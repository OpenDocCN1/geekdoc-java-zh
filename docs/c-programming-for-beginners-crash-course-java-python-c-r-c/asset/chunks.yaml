    # Chapter 4: Using Loops Inside of the C Language


    Loops can be a helpful thing to add into your code in the C language. These allow
    you to create lists of things or even graphs and charts inside of your code. They
    are nice because with just a few lines of code, you could get a huge chart done,
    rather than trying to type out each and every line that you need along the way.
    For example, if you wanted to make a chart that went from 1 to 100, it wouldn’t
    be much fun to write it all out for each line, but with the right loop statement,
    you would just need a few lines to make this happen.


    Loops are another way that you are able to do comparisons inside of your code
    in the C language and there are several options for looping that can really add
    some power to your code. The `while` loop, the nested loop, and the `do/while`
    loop are the most common types of these that you are able to use, but I will also
    spend some time talking about the `for` keyword in this chapter.


    ## The While Loop


    A loop is going to be a control program execution that is very repetitive. You
    will be able to specify the condition that makes that loop repeat, as well as
    a set of statements that you want to repeat in the code, and a way for the loop
    to stop. If you forget to add in the part about stopping the loop, the program
    is basically going to keep going on forever and freezing up the computer so make
    sure that this is added in.


    Here is an example of a code that will use the `while` loop in order to have the
    code count from 1 to 10.


    ```c

    #include <stdio.h>


    Int main()

    {

    Int x;

    x = 1;

    while(x <= 10)

    {

    Printf("%d\n” ,x);

    x++;

    }


    Return(0);

    }

    ```


    The condition for looping is shown at line 8 and it reads that when the value
    of your variable is less than or equal to the number ten, so as long as your condition
    ends up being true, the statements inside the loop will continue to repeat. Line
    11 shows that the value of `x` is going to be incremental so it will go up by
    one each time that the loop is executed, until the value of `x` is bigger than
    10. When you build and then run this code, you will be able to see a display of
    the numbers 1 to 10.


    You will be able to make changes to this to get as many `while` loops as you would
    like. For example, say that you would like to have the code count to twenty. You
    would just need to go to the part with the `while` statement and change out the
    number that you want to use. You can also change up how many increments that you
    would like to go up by. The code above is set so that `x = 1` so it just goes
    up by 1, but you could change this variable around to be anything that you would
    like, such as counting by 2s or 5s to get the right answers that you want.


    ## Do/While Loop


    Another option that you have with doing loops is the `do/while` loop. This is
    similar to the `while` loop, but it is almost like an upside down one. With the
    `while` loop, the code is going to see if the conditions are true and if they
    are, it will then execute. With the `do/while` loop, the code will execute once,
    and then check to see if the conditions are met before running again. If you want
    to make sure that the statement runs at least one time, the `do/while` loop is
    the best option for you to use. Let’s take a look at the following code to see
    how the `do/while` code will work.


    ```c

    #include <stdio.h>


    Int main()

    {

    Char ch:

    Ch = ‘A’;

    Do

    {

    Putchar(ch);

    Ch++;

    }

    While (ch != ‘z’);


    Putchar(‘\n\);


    Return(0);

    }

    ```


    You will notice that the `do/while` loop is going to start with line 9 with the
    statement `do`. this one doesn’t have a condition because the statements are going
    to be executed one right after the other. Then you can see that the `while` condition
    is going to appear at your 14th line. The loop is going to rely on the `ch` variable
    as the condition and it is first initialized at line 7 before being manipulated
    at line 12. Take a moment to build and then run this code in your compiler.


    In this one, the ‘z’ won’t be printed because it is considered an exit condition.
    If you would like to see the ‘z’ in your code, you will need to save the exit
    condition to ‘z+1’ at the end of your code. Now with this one, you are basically
    creating an endless loop because it has the plus one. If you built and tried to
    run this one, you would end up in an endless loop and would need to press `Ctrl
    + C` in order to get out of the program.


    There are times and places when you would want to use an endless loop, but as
    a beginner, you will most likely come across this unintentionally. There are ways
    to fix the endless loops by adding in a `break` statement to your code. Here we
    will insert the `break` statement right at the 8th line of the code like the following:


    ```c

    #include <stdio.h>


    Int main()

    {

    While(1)

    {

    Printf(“I’m endlessly!”);

    Break;

    }


    Return(0);

    }

    ```

    Now save, build, and then run this. Since the break statement is there, the loop
    is only spin once.


    ## For Keyword


    The `for` keyword is a great one to use when you want to create a loop inside
    the code. Unlike using the `while` loop, the `for` loop can be done with just
    one line, which does make it a bit cryptic to work with, but it is still a more
    popular and traditional loop type to work with. A good example of this includes
    the following:


    ```c

    #include <stdio.h>


    Int main()

    {

    Int x;

    For(x=0; x<10; x++)

    Printf("%d\n” ,x);


    Return(0);

    }

    ```


    The first part that you see is the initialization, the statement is `x=0`, which
    is the assignment that is made at the start of your loop. The second thing inside
    this code is the looping condition. The loop is going to continue to repeat until
    the condition is no longer true, which in this case is until the `x` equals 10.
    Finally, you will notice the iteration statement. Each time that your loop repeats
    itself, this particular statement is executed.


    The semi-colon is not going to follow the parenthesis of the `for` statement,
    but instead it is going to follow the single looping statement, which is inside
    the curly brackets on line 8. Take a moment to build and then run this code. As
    this is set up, the code is going to start at 0 and go up to 9, and then the loop
    stops as soon as this gets to 10 as the conditions are no longer true at that
    point. In this program, unless you specify differently, the program is going to
    start the counting at 0 rather than 1. Since most of the time you will want to
    start the counting at 1 since this is what most people are used to, you would
    go to line 8 and change the `x` to `x+1`. This isn’t going to make any changes
    to the value of `x`, but it does make a difference to the output.

