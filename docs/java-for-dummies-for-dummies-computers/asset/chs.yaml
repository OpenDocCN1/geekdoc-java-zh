  \ `yourInterestRate`。为什么一次调用使用字面量而另一次调用使用变量？没有原因。我只是想向你展示你可以用任何一种方式。\n\n### 向方法传递值\n\
  \n看一眼 `getInterest` 方法头。（当你阅读接下来的几个项目点的解释时，你可以通过图 7-6](#13_9781119235552-ch07.xhtml_c07-fig-0006)\
  \ 中的图表直观地理解某些观点。）\n\n*   `double` 单词告诉 Java，当调用 `getInterest` 方法时，该 `getInterest`\
  \ 方法向调用它的地方返回一个双精度点值。`getInterest` 方法体中的语句证实了这一点。该语句说 `return balance * percentageRate\
  \ / 100.00`，表达式 `balance * percentageRate / 100.00` 的类型是 `double`。（这是因为表达式中的所有内容——`balance`、`percentageRate`\
  \ 和 `100.00` 都是 `double` 类型。）\n\n    当调用 `getInterest` 方法时，`return` 语句计算 `balance\
  \ * percentageRate / 100.00` 并将结果交回给调用方法的代码。\n\n\n\n\n\n*   `getInterest` 单词是方法的名称。当你编写\
  \ `UseAccount` 类的代码时，你使用这个名称来调用该方法。\n\n*   括号包含了你在调用方法时传递给方法的所有内容。当你调用一个方法时，你可以即时向该方法传递信息。这些信息就是方法的参数列表。`getInterest`\
  \ 方法的头部显示，`getInterest` 方法接受一条信息，且该信息的类型必须是 `double`：\n\n```\npublic double getInterest(double\
  \ percentageRate)\n```\n\n果其然，如果你查看对 `getInterest` 的第一次调用（在 `UseAccount` 类的 `main`\
  \ 方法中），你会发现该调用包含了数字 5.00。而 `5.00` 是一个 `double` 字面量。当我调用 `getInterest` 时，我正在给该方法传递一个\
  \ `double` 类型的值。\n\n![交叉引用](img/crossreference.png) 如果你不记得什么是字面量，请参阅 第 4 章。\n\n\
  第二次调用 `getInterest` 的情况也是一样的。在 列表 7-6 底部附近，我调用了 `getInterest`并将变量 `yourInterestRate`\
  \ 传递给方法的参数列表。幸运的是，我在那几行之前刚刚将 `yourInterestRate` 声明为 `double` 类型。\n\n![image](img/9781119235552-fg0706.png)\n\
  \n图 7-6： 向方法传递值。\n\n当你在运行 列表 7-5 和 7-6 中的代码时，执行流并不是从上到下的。执行流从 `main` 到 `getInterest`，然后返回到\
  \ `main`，再次返回 `getInterest`，最后再次返回 `main`。图 7-7 显示了整个过程。\n\n![image](img/9781119235552-fg0707.png)\n\
  \n图 7-7： 列表 7-5 和 7-6 中的控制流。\n\n### 从 getInterest 方法返回值\n\n当调用 `getInterest` 方法时，该方法执行方法体中的唯一语句：一个\
  \ `return` 语句。`return` 语句计算 `balance * percentageRate / 100.00` 的值。如果 `balance`\
  \ 好是 `24.02`，且 `percentageRate` 是 `5.00`，则表达式的值为 `1.201` —— 大约 1.20 元。（因为计算机完全处理\
  \ 0 和 1，Java 计算出的数字会有极其微小的误差。Java 得到的是 `1.2009999999999998`。这是人类必须接受的。）\n\n总之，在计算此值后，Java\
  \ 执行 `return`，将该值传回 `main` 中调用 `getInterest` 的地方。在过程的该点，整个方法调用 —— `myAccount.getInterest(5.00)`\
  \ 获得了值 `1.2009999999999998`。该调用本身位于 `println` 内部：\n\n```\nout.println(myAccount.getInterest(5.00));\n\
  ```\n\n所以 `println` 最终具有以下含义：\n\n```\nout.println(1.2009999999999998);\n```\n\n\
  将值传回方法调用的整个过程在 图 7-8 中所示。\n\n![image](img/9781119235552-fg0708.png)\n\n图 7-8： 方法调用是一个带有值的表达式。\n\
  \n![记住](img/remember.png) 如果方法返回任何内容，对方法的调用就是一个带有值的表达式。该值可以被打印、赋值给变量、与其他值相加或进行任何其他操作。你对任何其他类型的值能做的事，对方法调用也能做。\n\
