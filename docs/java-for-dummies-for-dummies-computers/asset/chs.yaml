  \ 的维护者在 Java 9 中引入了一个新工具。他们将其称为 `JShell`。\n\n![ontheweb](img/ontheweb.png) 启动 `JShell`\
  \ 的指令在不同计算机之间有所不同。关于适用于你电脑的指令，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n当你使用 `JShell` 时，你几乎不需要编写整个程序。相反，你输入一个 Java 语句，然后 `JShell` 对你的语句做出响应，接着你再输入第二个语句，`JShell`\
  \ 对你的第二个语句做出响应，然后你输入第三个语句，以此类推。单条语句就足以获得 `JShell` 的响应。\n\n`JShell` 只是语言“读取-评估-打印循环”（REPL）的一个示例。许多编程语言都有\
  \ REPL，而随着 Java 9，Java 语言终于有了自己的 REPL。\n\n在图 4-7 中，我使用 `JShell` 来发现 Java 如何响应代码列表\
  \ 4-2 和 4-3 中的赋值语句。\n\n![image](img/9781119235552-fg0407.png)\n\n图 4-7： 我与 `JShell`\
  \ 之间的对话。\n\n当你运行 `JShell` 时，对话大致如下：\n\n```\njshell> 你输入一个语句\nJShell 给出响应\njshell>\
  \ 你输入另一个语句\nJShell 给出响应\n```\n\n例如，在图 4-7 中，我输入 `double amountInAccount` 然后按回车键。`JShell`\
  \ 通过显示：\n\n```\namountInAccount ==> 0.0\n```\n\n关于 `JShell` 有几点需要注意的：\n\n*   **你不需要输入整个\
  \ Java 程序。**\n    输入几条语句例如：\n    ```\n    double amountInAccount\n    amountInAccount\
  \ = 50.22\n    amountInAccount = amountInAccount + 1000000.00\n    ```\n    就能达到效果。这就像运行代码列表\
  \ 4-1 中的代码片段一样（除了代码列表 4-1 没有声明 `amountInAccount` 为 `double`）。\n\n*   **在 `JShell`\
  \ 中，分号（在很大程度上）是可选的。**\n    在图 4-7 中，我九行代码中只有一行在末尾打了分号。\n    ![crossreference](img/crossreference.png)\
  \ 关于在 `JShell` 中使用分号的建议，请参第 5 章。\n\n*   **`JShell` 在你输入每一行后立即响应。**\n    在我将 `amountInAccount`\
  \ 声明为 `double` 后，`JShell` 响应告诉我 `amountInAccount` 变量的值为 0.0。输入 `amountInAccount\
  \ = amountInAccount + 1000000.00` 后，`JShell` 告诉我 `amountInAccount` 的新值为 1000050.22。\n\
