  \ `if` 语句进行第二个测试（密码测试）。如果你没有通过第一个测试，就永远无法到达第二个测试。图 5-7\n\n图 5-6：中代码的三次运行。\n\n![image](img/9781119235552-fg0507.png)\n\
  \n图 5-7： 列表 5-5 中的代码在嵌套 `if` 语句方面做得很好，但在真实世界的用户验证方面做得非常糟糕。首先，永远不要明文显示密码（不使用星号掩盖）。其次，不要在不加密的情况下处理密码。第三，不要告诉恶意用户两个单词（用户名或密码）中哪一个输入错误。第四……我可以一直说下去。列表\
