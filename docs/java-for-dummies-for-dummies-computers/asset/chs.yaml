  \ benefitDeduction;\n    }\n}\n```\n\n观察列表 8-3，你可以看到每个 `FullTimeEmployee` 类实例都有两个字段：`weeklySalary`\
  \ 和 `benefitDeduction`。但这些是每个 `FullTimeEmployee` 实例拥有的字段字段吗？不是。列表 8-3 的第一行说 `FullTimeEmployee`\
  \ 类继承自现有的 `Employee` 类。这意味着除了拥有 `weeklySalary` 和 `benefitDeduction` 之外，每个 `FullTimeEmployee`\
  \ 实例还有另外两个字段：`name` 和 `jobTitle`。这两个字段来自 `Employee` 类的定义，你可以在列表 8-1 中找到它们。\n\n\n\
  \n在 Listing 8-3 中，魔法单词是 `extends`。当一个类继承一个现有的类时，扩展类会自动继承在现有类中定义的功能。因此，`FullTimeEmployee`\
  \ 类继承了 `name` 和 `jobTitle` 字段。`FullTimeEmployee` 类还继承了在 `Employee` 类中声明的所有方法：`setName`、`getName`、`setJobTitle`、`getJobTitle`\
  \ 和 `cutCheck`。`FullTimeEmployee` 类是 `Employee` 类的**子类**（subclass）。这意味着 `Employee`\
  \ 类是 `FullTimeEmployee` 类的**父类**（superclass）。你也可以用血缘关系来描述：`FullTimeEmployee` 类是\
  \ `Employee` 类的**子**（child），而 `Employee` 类是 `FullTimeEmployee` 类的**父**（parent）。\n\
  \n这几乎就像是 `FullTimeEmployee` 类是由 Listing 8-4 中的代码定义一样。\n\n### LISTING 8-4: 虚假的（但有参考价值）代码\n\
