  \ 40;\n    public void paint(Graphics g) {\n        g.drawOval(x, y, width, height);\n\
  \    }\n}\n```\n\n#### 列表 14-9:](#21_9781119235552-ch14.xhtml_rc14-fea-0010) 来自蓝湖的子类\n\
