  \n\n\n\nLambda 表达式从流中获取对象，并在每个对象上调用类似于 `display` 的方法。在 `display` 方法的头定义中，`void`\
  \ 关键字表示该方法不返回值。当你调用 `display` 方法（或使用等效的 lambda 表达式）时，你并不期望获得返回值。相反，你期望代码响应调用执行某些操作（例如在计算机屏幕上显示文本）。\n\
  \n为了在“返回值”和“执行某事”之间做出明确区别，函数式程序员为“不返回值的执行某事”起了一个名字——他们将这种行为称为“副作用”（side effect）。在函数式编程中，副作用被视为二等公民，是最后的手段，是一种当你无法简单地返回结果时使用的策略。遗憾的是，在屏幕上显示信息（许多计算机程序都会做的事情）是一种副作用。任何显示输出（在屏幕上、在纸上或作为杯中的茶叶）的程序都不是纯粹的函数式程序。\n\
  \n### Lambda 表达式的分类\n\nJava 将 lambda 表达式分为大约 45 类不同的类别。表 12-2 列出了其中几类。\n\n| 名称 |\
  \ 描述 | 示例 |\n| --- | --- | --- |\n| Function (函数) | 接受一个参数；产生任意类型的结果 | `(sale) ->\
  \ sale.price` |\n| Predicate (谓词) | 接受一个参数；产生布尔值结果 | `(sale) -> sale.item.equals(\"\
  DVD\")` |\n| BinaryOperator (二元运算符) | 接受两个相同类型的参数；产生相同类型的结果 | `(price1, price2)\
  \ -> price1 + price2` |\n| Consumer (消费者) | 接受一个参数；不产生结果 | `(sale) -> System.out.println(sale.price)`\
  \ |\n\n表 12-2 Lambda 表达式种类\n\n![remember](img/remember.png) 表 12-2 中的类别并不是互斥的。例如，每个\
  \ `Predicate` 都是 `Function`。（每个 `Predicate` 都接受一个参数并返回一个结果。结果恰好是布尔值。）\n\n### 使用流和\
  \ lambda 表达式\n\nJava 有高级方法可以优化利用流和 lambda 表达式。通过流和 lambda 表达式，你可以创建一个流水线，优雅地解决本章的销售问题。与列表\
  \ 12-4 中的代码不同，新的流水线解决方案使用了函数式编程的概念。\n\n流水线由几个方法组成。每个方法接收数据，以某种方式转换数据，并将其结果传递给链中的下一个方法。图\
  \ 12-9 展示了本章销售问题的流水线。\n\n![image](img/9781119235552-fg1209.png)\n\n图 12-9： 函数式编程流水线。\n\
  \n在图 12-9 中，每个框代表一组沿着流水线转换的原材料。每个箭头代表一个方法（或者比喻地，代表流水线上的工人）。\n\n例如，在从第二个框到第三个框的转换过程中，工人方法（`filter`\
  \ 方法）筛选掉不是 DVD 的销售项目。想象一下露西·里卡多（Lucy Ricardo）站在第二个和第三个框之间，从流水线上移除每本书或 CD，并随手不经地扔在地板上。\n\
  \nJava 的 `filter` 方法的参数是一个 `Predicate` —— 一个结果为布尔值的 lambda 表达式。（参见表 12-2）。图 12-9\
  \ 中的 `filter` 方法筛选掉未通过 lambda 表达式真/假测试的项目。\n\n| 方法名称 | 成员于 | 参数(s) | 结果类型 | 结果值\
  \ |\n| --- | --- | --- | --- | --- |\n| stream | `Collection`（例如一个 `ArrayList` 对象）\
  \ | （无） | `Stream` | 产生集合中元素的流 |\n| filter | `Stream` | `Predicate` | `Stream` |\
  \ 包含 lambda 表达式返回 true 的值的新流 |\n| map | `Stream` | `Function` | `Stream` | 包含应用\
  \ lambda 表达式结果的新流 |\n| reduce | `Stream` | `BinaryOperator` | `BinaryOperator` 使用的类型\
  \ | 输入流中所有值的合并结果 |\n\n表 12-3 一些方法\n\n![crossreference](img/crossreference.png) 为了帮助理解表\
  \ 12-3](#19_9781119235552-ch12.xhtml_c12-tbl-0003)第三列中的词（`Predicate`、`Function`\
  \ 和 `BinaryOperator`），请参见之前的 lambda 表达式的分类。在图 12-9 中，从第三个框到第四个框的转换过程中，工人方法（`map`\
  \ 方法）提取每个 `sale` 的 `price`。从那个工人那里，流水线只包含价格。更准确地说，Java 的 `map` 方法接受一个如 `(sale) ->\
  \ sale.getPrice()` 的 `Function` 并将其应用于流中的每个值。（参见表 12-2 和 12-3）。因此，图 12-9 中的 `map`\
  \ 方法接收一个 `sale` 输入流并创建一个价格输出流。\n\n在图 12-9 中，从第四个框到第五个框的转换过程中，工人方法（`reduce` 方法）累加了\
  \ DVD 销售的价格。Java 的 `reduce` 方法接受两个参数：\n* 第一个参数是初始值。在图 12-9 中，初始值为 `0.0`。\n* 第二个参数是\
  \ `BinaryOperator`。（参见表 12-2 和 12-3）。在图 12-9 中，`reduce` 方法的 `BinaryOperator` 是 `(price1,\
  \ price2) -> price1 + price2`。\n\n`reduce` 方法使用其 `BinaryOperator` 来合并输入流中的值。初始值作为所有合并的起点。因此，在图\
  \ 12-9 中，`reduce` 方法执行两次加法。（参见图 12-10）。\n\n![image](img/9781119235552-fg1210.png)\n\
  \n图 12-10： reduce 方法相加输入流中的两个值。\n\n作为比较，想象调用方法：\n```\nreduce(10.0, (value1, value2)\
  \ -> value1 * value2)\n```\n其值包含 3.0、2.0 和 5.0 的流。结果操作显示在图 12-11 中。\n\n![image](img/9781119235552-fg1211.png)\n\
  \n图 12-11： reduce 方法乘以输入流中的值。\n\n![technicalstuff](img/technicalstuff.png) 你可能听过\
  \ Google 的 MapReduce 编程模型。编程模型名称与 Java 方法名 `map` 和 `reduce` 之间的相似性并非巧合。\n\n整体而言，图\
  \ 12-9](#19_9781119235552-ch12.xhtml_c12-fig-0009)所示的整个流水线累加了所售 DVD 的价格。列表 12-5\
  \ 包含一个使用图 12-9](#19_9781119235552-ch12.xhtml_c12-fig-0009)中的流和 lambda 表达式的完整程序。\n\
  \n\n\n\n\n```java\nArrayList<Sale> sales = new ArrayList<>();\nNumberFormat currency\
  \ = NumberFormat.getCurrencyInstance();\nfillTheList(sales);\ndouble total = sales.stream()\n\
  \    .filter((sale) -> sale.getItem().equals(\"DVD\"))\n    .map((sale) -> sale.getPrice())\n\
  \    .reduce(0.0, (price1, price2) -> price1 + price2);\nSystem.out.println(currency.format(total));\n\
  }\n\nstatic void fillTheList(ArrayList<Sale> sales) {\n    sales.add(new Sale(\"\
  DVD\", 15.00));\n    sales.add(new Sale(\"Book\", 12.00));\n    sales.add(new Sale(\"\
  DVD\", 21.00));\n    sales.add(new Sale(\"CD\", 5.25));\n}\n```\n\n![warning](img/warning.png)\
  \ 示例 12-5 中的代码需要 Java 8 或更高版本。如果你的 IDE 设置为较早的 Java 版本，你可能需要调整 IDE 的设置。你甚至需要下载更高版本的\
  \ Java。\n\n示例 12-5 中的**粗体代码**是一个大的 Java 赋值语句。该语句的右侧包含了一系列的方法调用。每个方法调用返回一个对象，而每个此类对象都是下一次方法调用中点号之前的对象。这就是你构建流水线的方式。\n\
  \n例如，在粗体代码的开头，名称 `sales` 指向一个 `ArrayList` 对象。每个 `ArrayList` 对象都有一个 `stream` 方法。在示例\
  \ 12-5 中，`sales.stream()` 是对该 `ArrayList` 对象的 `stream` 方法的调用。\n\n`stream` 方法返回 Java\
  \ `Stream` 类的实例。（真让人惊喜！）因此，`sales.stream()` 指向一个 `Stream` 对象。（参见图 12-12）。\n\n![image](img/9781119235552-fg1212.png)\n\
  \n图 12-12： 获取所有 DVD 销售额。\n\n每个 `Stream` 对象都有一个 `filter` 方法。因此\n\n`sales.stream().filter((sale)\
  \ -> sale.getItem().equals(\"DVD\"))`\n\n是对 `Stream` 对象的 `filter` 方法的调用。（参见图 12-12）。\n\
  \n这种模式继续。`Stream` 对象的 `map` 方法返回另一个 `Stream` 对象 —— 一个包含价格的 `Stream` 对象。（参见图 12-13）。对该价格\
  \ `Stream` 应用 `reduce` 方法，它会产生一个 `double` 值 —— DVD 价格的总和。（参见图 12-14）。\n\n![image](img/9781119235552-fg1213.png)\
  \ 图 12-13： 从每个 DVD 销售额中获取价格。\n\n![image](img/9781119235552-fg1214.png) 图 12-14：\
  \ 获取所有 DVD 销售额的总价。\n\n### 为什么要费此精力？\n\n示例 12-5 中的方法调用链完成了示例 12-4 中循环完成的所有工作。但它使用了函数式编程。这有什么大不了？相比示例\
  \ 12-4，使用示例 12-5 会更好吗？\n\n过去几年，芯片设计的重大趋势是多核处理器。有了多个核心，处理器可以同时执行多条语句，如果你将工作分到多个核心上，程序运行速度可以提高\
  \ 2 倍、4 倍甚至更多。但你是如何分配工作的呢？\n\n你可以修改示例 12-4 中的命令式代码。例如，通过某些高级功能，可以将不同的迭代交给不同的核心。但结果代码非常混乱。为了让代码正常工作，你必须仔细管理循环迭代以确保总和正确。\n\
  \n相比之下，函数式代码很容易修改。为了利用多核处理器，你只需要修改示例 12-5 中的一个单词！\n\n```java\nsales.parallelStream()\n\
  \    .filter((sale) -> sale.getItem().equals(\"DVD\"))\n    .map((sale) -> sale.getPrice())\n\
  \    .reduce(0.0, (price1, price2) -> price1 + price2);\n```\n\n在示例 12-5 中，`stream()`\
  \ 方法创建一个顺序流。对于顺序流，Java 每次处理一次销售记录。但调用 `parallelStream()` 会创建一个类型略有不同的流：并行流。在并行流中，Java\
  \ 在计算机处理器的核心数之间分配工作（根据其他计算能力衡量）。如果你有 400 万笔销售记录和四个核心，每个核心处理 100 万笔。\n\n每个核心独立工作，每个核心将其结果提交到最后的\
  \ `reduce` 方法。`reduce` 方法将核心的结果合并为最终计数。在理想情况下，所有工作完成的时间只需要顺序流的四分之一。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 阅读上一段时，不要忽略*理想情况下*这个短语。并行性并不是魔法。有时，并行并不是你的朋友。考虑你只有 20 个销售金额需要汇总的情况。将问题分成四组每组五个所需花费的时间超过了你使用四个核心所节省的时间。此外，某些问题并不适合并行处理。假设商品的价格取决于相似商品的销售数量。在这种情况下，你无法将问题分配给四个独立运行的核心。如果你尝试这样做，每个核心都必须知道其他核心在做什么。你失去了四个线程执行的优势。\n\
  \n### 方法引用\n\n仔细观察示例 12-5 中的最后一个 lambda 表达式：\n\n`(price1, price2) -> price1 + price2)`\n\
  \n这个表达式的作用与 `sum` 方法大致相同。（事实上，你可以在之前的“Lambda 表达式”章节找到 `sum` 方法的声明。）如果你要在三行的 `sum`\
  \ 方法和一行的 lambda 表达式之间选择，你可能会选择 lambda 表达式。但如果你有第三种选择呢？与其自己编写 `sum` 方法，你可以引用现有的 `sum`\
  \ 方法。使用现有的方法是最快且安全的方法。\n\n幸运的是，Java 的 `Double` 类包含一个静态 `sum` 方法。你不需要创建自己的 `sum`\
  \ 方法。如果你运行以下代码：\n\n```java\ndouble i = 5.0, j = 7.0;\nSystem.out.println(Double.sum(i,\
  \ j));\n```\n\n计算机显示 12.0。因此，与其在示例 12-5 中编写 `price1 + price2` lambda 表达式，你可以创建一个*方法引用*\
  \ —— 一个引用现有方法的表达式。\n\n```java\nsales.stream()\n    .filter((sale) -> sale.getItem().equals(\"\
  DVD\"))\n    .map((sale) -> sale.getPrice())\n    .reduce(0.0, Double::sum);\n```\n\
  \n表达式 `Double::sum` 指向 Java `Double` 类的 `sum` 方法。当你使用这个 `Double::sum` 方法引用时，你所做的与最后一个\
  \ lambda 表达式所相同。大家都很开心。\n\n关于静态方法的信息，请参第 10 章。\n\n![tryitout](img/tryitout.png)\
  \ 你可以随时尝试自己构思的编程挑战。如果你没有可以让你练习函数式编程的想法，我有几个建议可以给你：\n\n*   每个员工都有一个姓名和一个绩效评估评分。如果你给每个评分为\
  \ 3 或以上的员工发放 100 美元的奖金，请计算你将支付的奖金总金额。\n\n\n\n\n\n*   每个食谱都有一个名称、一份食材列表（其中一些涉及肉类）和一个预计的准备时间。请找到其中一个素食食谱的平均预计时间。\n\
  \n# 第 13 章\n\n# 当情况发生意外变化时保持体面\n\n## 本章内容\n\n- ![check](img/check.png) **从错误输入和其他糟糕的状况中恢复**\n\
  - ![check](img/check.png) **让你的代码（在某种程度上）防止崩溃**\n- ![check](img/check.png) **定义你自己的异常类**\n\
  \n*1945 年 9 月 9 日：* 一只飞子飞入了哈佛 Mark II 型型计算机的一个继电器中，导致机器卡壳。这成了历史上首次有案的真实计算机故障（bug）。\n\
  \n*1957 年 4 月 20 日：* 匹兹堡西屋敦电气（Westinghouse）数据处理中心经理赫尔伯特·布莱特（Herbert Bright）在邮件中收到了一叠没有标记的计算机打孔卡（这就像今天在邮件里收到一张没有标签的\
  \ CD-ROM）。布莱特先生猜测这叠卡片来自 `FORTRAN` —— 第一种计算机编程语言的开发团队。他已经等了这个软件好几年。（当时还没有网络下载。）\n\
  \n仅凭这一个正确的猜测，布莱特写了一个小型 `FORTRAN` 程序，并尝试在他的 `IBM 704` 上进行编译。（`IBM 704` 位于一个专门建造的\
  \ 2000 平英尺房间里。由于使用的是真空管而非晶体管，机器拥有高达 32K 的 `RAM`。在运行每个程序之前，必须从磁带加载操作系统，一个典型的程序运行需要二到四小时。）在经过通常的等待后，布莱特编译\
  \ `FORTRAN` 程序的尝试返回了一个错误：其中一条语句缺少一个逗号。布莱特纠正了错误，程序运行得非常顺畅。\n\n*1962 年 7 月 22 日：*\
  \ 美国首个旨在其他行星的航天器水神星 1 号在发射四分钟后因表现异常被摧毁。这种异常归因于火箭速度公式中缺少一个横杠（类似于连字符）。\n\n同一时间，NASA\
  \ 的轨道计算软件被发现包含错误的语句 `DO 10 I=1.10`（应该是正确的 `DO 10 I=1,10`）。在现代表示法中，这就像是用 `do10i =\
  \ 1.10` 代替 `for (int i=1; i<=10; i++)`。从逗号到句点的改变将循环变成了一个赋值语句。\n\n*2000 年 1 月 1 日：*\
  \ “千千年虫问题”给现代世界造成了混乱。\n\n这些笔记中任何历史准确的事实都借自以下来源：计算机民俗新闻组（https://groups.google.com/forum/#!forum/alt.folklore.computers）、计算机在线免费词典（http://foldoc.org）、*Computer*\
  \ 杂志（www.computer.org/computer-magazine/）以及 IEEE 的其他网页（www.computer.org）。\n\n##\
  \ 处理异常\n\n你正在进行盘点。这意味着要一个接一个地数物品，一个一个地数箱，并在日志表、小型手持设备和计算机键盘表单上记录这些物品的数量。项目的一个特定部分涉及输入你在“自第一年起就未打开的大灰尘箱”架上发现的箱子数量。为了打破公司几十年的习惯，你决定不打开这些箱子的任何一个。你随意为每个箱子分配了\
  \ `$3.25` 的值。\n\n列表 13-1 显示了处理这部分盘点的软件。该软件有一个缺陷，在图 13-1 中暴露。当用户输入整数值时，一切正常。但当用户输入其他内容（如数字\
  \ `3.5`）时，程序就会崩溃。对此显然可以做些什么。计算机很笨，但它们并不笨到在用户输入错误的值时就输得一败完涂。\n\n![image](img/9781119235552-fg1301.png)\n\
  \n图 13-1 在列表 13-1 中代码的三次运行。\n\n列表 13-1 数数箱子\n\n```\nimport static java.lang.System.out;\n\
  import java.util.Scanner;\nimport java.text.NumberFormat;\npublic class InventoryA\
  \ {\n    public static void main(String args[]) {\n        final double boxPrice\
  \ = 3.25;\n        Scanner keyboard = new Scanner(System.in);\n        NumberFormat\
  \ currency = NumberFormat.getCurrencyInstance();\n        out.print(\"How many boxes\
  \ do we have? \");\n        String numBoxesIn = keyboard.next();\n        int numBoxes\
  \ = Integer.parseInt(numBoxesIn);\n        out.println(\"The value is \" + currency.format(numBoxes));\n\
  \        keyboard.close();\n    }\n}\n```\n\n\n\n\n```java\nint numBoxes = Integer.parseInt(numBoxesIn);\n\
  out.print(\"The value is \");\nout.println(currency.format(numBoxes * boxPrice));\n\
  } catch (NumberFormatException e) {\n    out.println(\"That's not a number.\");\n\
  }\nkeyboard.close();\n}\n}\n```\n\n图 13-3 显示了列表 13-2 中代码的三次运行。当一个误导的用户输入 `three`\
  \ 而不是 `3` 时，程序会保持冷静并显示 `That's not a number.`。这里的诀窍是将对 `Integer.parseInt` 的调用封装在\
  \ `try` 子句中。如果你这样做了，计算机在执行 `try` 子句内部的任何语句时都会监控异常。如果抛出异常，计算机将从 `try` 子句内部跳转到下方的\
  \ `catch` 子句。在列表 13-2 中，计算机直接跳转到 `catch (NumberFormatException e)` 子句。计算机执行子句内部的\
  \ `println` 语句，然后继续正常处理。（如果在列表 13-2 中 `catch` 子句结束之后还有语句，计算机将继续执行它们。）\n\n![image](img/9781119235552-fg1303.png)\n\
  \n图 13-3: 列表 13-2 中代码的三次运行。\n\n![technicalstuff](img/technicalstuff.png) 一个完整的 try-catch\
  \ 组合——包含 `try` 子句、`catch` 子句以及各种内容——被称为 `try 语句`。有时，为了强调，我称其为 `try-catch 语句`。\n\n\
  ### catch 子句中的参数\n\n看看列表 13-2 中的 `catch` 子句，特别注意 `(NumberFormatException e)` 这几个单词。这看起来很像方法的参数列表，不是吗？事实上，每个\
  \ `catch` 子句都像一个小的微方法，有它自己的参数列表。参数列表始终包含一个异常类型名称，然后是一个参数。\n\n在列表 13-2 中，我没有对 `catch`\
  \ 子句的 `e` 参数做任何操作，但如果我想做，完全可以做到。**记住：** 抛出的异常是一个对象——`NumberFormatException` 类的实例。当捕获到异常时，计算机会让\
  \ `catch` 子句的参数引用该异常对象。换句话说，名称 `e` 存储了关于异常的许多信息。为了利用这一点，你可以调用异常对象的一些。\n\n```java\n\
  } catch (NumberFormatException e) {\n    out.println(\"Message: \\\"\" + e.getMessage()\
  \ + \"\\\"\");\n    e.printStackTrace();\n}\n```\n\n有了这个新的 `catch` 子句，库存程序的运行看起来可能像图\
  \ 13-4 所示的运行。当你调用 `getMessage` 时，你获取了关于异常的某些细节。（在图 13-4 中，细节是 `Message: For input\
  \ string: \"three\"`。）当你调用 `printStackTrace` 时，你会获得一些额外的信息；即显示在抛出异常时正在运行的方法列表。（在图\
  \ 13-4 中，显示包含了 `Integer.parseInt` 和 `main` 方法。）`getMessage` 和 `printStackTrace`\
  \ 都提供了帮助你找到程序困难源头的信息。\n\n![image](img/9781119235552-fg1304.png)\n\n图 13-4: 调用异常对象的方法。\n\
  \n![technicalstuff](img/technicalstuff.png) 当你将 `System.out.println` 调用与 `printStackTrace`\
  \ 调用混合时，Java 显示信息的顺序是不可预测的。例如，在图 13-4 中，文本 `Message: For input string: \"three\"\
  ` 可能出现在堆栈跟踪之前或之后。如果你对这个输出的顺序有要求，将 `out.println(\"Message: \"` 改为 `System.err.println(\"\
  Message: `。\n\n今天还可能出什么问题？还有其他不是 `NumberFormatException` 类的异常吗？当然，有很多不同的异常类型。你甚至可以创建一个。如果是的话，看看列表\
  \ 13-3 和列表 13-4。\n\n列表 13-3: 创建你类型的异常\n```java\n@SuppressWarnings(\"serial\")\n\
  class OutRangeException extends Exception {\n}\n```\n\n列表 13-4: 使用自定义的异常\n```java\n\
  import static java.lang.System.out;\nimport java.util.Scanner;\nimport java.text.NumberFormat;\n\
  \npublic class InventoryC {\n    public static void main(String args[]) {\n    \
  \    final double boxPrice = 3.25;\n        Scanner keyboard = new Scanner(System.in);\n\
  \        NumberFormat currency = NumberFormat.getCurrencyInstance();\n        out.print(\"\
  How many boxes do we have? \");\n        String numBoxesIn = keyboard.next();\n\
  \        try {\n            int numBoxes = Integer.parseInt(numBoxesIn);\n     \
  \       if (numBoxes < 0) {\n                throw new OutRangeException();\n  \
  \          }\n            out.print(\"The value is \");\n            out.println(currency.format(numBoxes\
  \ * boxPrice));\n        } catch (NumberFormatException e) {\n            out.println(\"\
  That's not a number.\");\n        } catch (OutOfRangeException e) {\n          \
  \  out.print(numBoxesIn);\n            out.println(\" That's impossible!\");\n \
  \       }\n        keyboard.close();\n    }\n}\n```\n\n列表 13-3 和列表 13-4 解决了早些在图\
  \ 13-3 中出现的问题。看看图 13-3 中三次运行的最后一次。用户报告架子上有 –25 箱，而计算机毫不眨眼地接受了这个值。事实是，你需要一个黑洞（或其他某种奇异的时空现象）才能在仓库的任何架子上出现负数量的箱子。因此，如果用户输入负数量的箱子，程序应该感到生气，这正是列表\
  \ 13-4 中代码所做的。要看生气的代码，请看图 13-5。\n\n![image](img/9781119235552-fg1305.png)\n\n图 13-5:\
  \ 列表 13-3 和列表 13-4 中代码的三次运行。\n\n\n\n\n\n![crossreference](img/crossreference.png)\
  \ 列表 13-3 中的文本 `@SuppressWarnings(\"serial\")` 是一个 Java 注解。关于注解的介绍，请参见第 8 章。关于 `SuppressWarnings`\
  \ 注解的简要介绍，请参见第 9 章。\n\n![technicalstuff](img/technicalstuff.png) 如果你使用 Eclipse，可能会在列表\
  \ 13-4 中的`throw new OutOfRangeException()` 语句旁边看到一个黄色的警告标记。当你将指针悬停在警告标记上时，Eclipse\
  \ 会显示`Resource leak: 'keyboard' is not closed at this location.`Eclipse 得非常挑剔，以确保你的代码最终执行了`keyboard.close()`语句。（是的，在某些情况下，抛出\
  \ `OutOfRangeException` 可能会导致程序跳过 `keyboard.close()` 语句。但是，当你运行列表 13-4 中的代码时，这种情况不会发生。）在我看来，你可以安全忽略这个警告。\n\
  \n### 谁来捕获异常？\n\n再看一遍列表 13-4。注意，一个 `try` 语句可以伴随多个 `catch` 语句。当 `try` 语句内部抛出异常时，计算机开始按照随后的\
  \ `catch` 语句列表向下检查。计算机从 `try` 语句之后的第一个 `catch` 语句开始，沿着程序的文本向下执行。\n\n对于每个 `catch`\
  \ 语句，计算机都会问自己：“刚刚抛出的异常是该语句参数列表中类的实例吗？”\n\n*   如果不是，计算机将跳过该 `catch` 语句，并处理列表中的下一个\
  \ `catch` 语句。\n*   如果是，计算机将执行该 `catch` 语句，然后跳过该 `try` 语句之后的所有其他 `catch` 语句。计算机继续执行整个\
  \ `try-catch` 语句之后的任何语句。\n\n欲了解具体示例，请参见列表 13-5 和 13-6。\n\n#### 列表 13-5： 另一个异常\n\n\
  ```java\n@SuppressWarnings(\"serial\")\n\nclass NumberTooLargeException extends\
  \ OutOfRangeException {\n}\n```\n\n#### 列表 13-6： 责任归谁？\n\n```java\nimport static\
  \ java.lang.System.out;\nimport java.util.Scanner;\nimport java.text.NumberFormat;\n\
  \npublic class InventoryD {\n    public static void main(String args[]) {\n    \
  \    final double boxPrice = 3.25;\n        Scanner keyboard = new Scanner(System.in);\n\
  \        NumberFormat currency = NumberFormat.getCurrencyInstance();\n        out.print(\"\
  How many boxes do we have? \");\n        String numBoxesIn = keyboard.next();\n\
  \        try {\n            int numBoxes = Integer.parseInt(numBoxesIn);\n     \
  \       if (numBoxes < 0) {\n                throw new OutOfRangeException();\n\
  \            }\n            if (numBoxes > 1000) {\n                throw new NumberTooLargeException();\n\
  \            }\n            out.print(\"The value is \");\n            out.println(currency.format(numBoxes\
  \ * boxPrice));\n        } catch (NumberFormatException e) {\n            out.println(\"\
  That's not a number.\");\n        } catch (OutOfRangeException e) {\n          \
  \  out.print(numBoxesIn);\n            out.println(\"? That's impossible!\");\n\
  \        } catch (Exception e) {\n            out.print(\"Something went wrong,\
  \ \");\n            out.print(\"but I'm clueless about what \");\n            out.println(\"\
  it actually was.\");\n        }\n        out.println(\"That's that.\");\n      \
  \  keyboard.close();\n    }\n}\n```\n\n要运行列表 13-5 和 13-6 中的代码，你需要 `OutOfRangeException`\
  \ 类。（注：提供的源代码文本结尾包含大量重复/乱码句子，已进行清理以维护文档的核心逻辑。）\n\n\n\n\n但是，根据列表 13-5 中的代码，`NumberTooLargeException`\
  \ 是 `OutOfRangeException` 的子类。当计算机运行到第二个 `catch` 子句时，计算机会说：“嗯！`NumberTooLargeException`\
  \ 是一种 `OutOfRangeException`。我将执行这个 `catch` 子句中的语句——即带有类型为 `OutOfRangeException`\
  \ 参数的那个子句。”换句话说，匹配成功了。\n\n计算机执行第二个 `catch` 子句内部的语句。然后，计算机跳过第三个 `catch` 子句，执行紧接在所有\
  \ `catch` 子句之后的代码。（参见图 13-10。）\n\n*   **发生了其他事情，一些无法预料的事情。（我不知道是什么。）** 凭着我无的实验冲动，我进入了列表\
  \ 13-6 的 `try` 子句，添加了一条抛出 `IOException` 的语句。没有理由——我只是想看看会发生什么。\n\n当代码抛出 `IOException`\
  \ 时，计算机跳过了 `try` 子句中剩余的语句。然后，计算机跳过了第一个和第二个 `catch` 子句中的语句。当计算机运行到第三个 `catch` 子句时，我能听到计算机说：“嗯！`IOException`\
  \ 是 `Exception` 的一种。我找到了一个匹配的 `catch` 子句——一个带有类型为 `Exception` 参数的子句。我将执行这个 `catch`\
  \ 子句中的语句。”\n\n因此，计算机执行了第三个 `catch` 子句内部的语句。然后，计算机执行了紧接在所有 `catch` 子句之后的代码。（参见图 13-11。)\n\
  \n![image](img/9781119235552-fg1306.png)\n\nFIGURE 13-6: 列表 13-6 代码的四次运行。\n\n![image](img/9781119235552-fg1307.png)\n\
  \nFIGURE 13-7: 没有抛出异常。\n\n![image](img/9781119235552-fg1308.png)\n\nFIGURE 13-8:\
  \ 抛出了 `NumberFormatException`。\n\n![image](img/9781119235552-fg1309.png)\n\nFIGURE\
  \ 13-9: 抛出了 `OutOfRangeException`。\n\n![image](img/9781119235552-fg1310.png)\n\n\
  FIGURE 13-10: 抛出了 `NumberTooLargeException`。\n\n![image](img/9781119235552-fg1311.png)\n\
  \nFIGURE 13-11: 抛出了 `IOException`。\n\n当计算机寻找匹配的 `catch` 子句时，它会锁定符合以下描述之一的最顶部子句：\n\
  \n*   该子句的参数类型与抛出的异常类型相同。\n*   该子句的参数类型是该异常类型的父类。\n\n如果在 `catch` 子句列表的靠后位置出现了更好的匹配项，那太遗憾了。想象一下，你在列表\
  \ 13-6 的代码中添加了一个带有类型为 `NumberTooLargeException` 参数的 `catch` 子句。同样想象，你将这个新的 `catch`\
  \ 子句放在了类型为 `OutOfRangeException` 参数的 `catch` 子句*之后*。那么，由于 `NumberTooLargeException`\
  \ 是 `OutOfRangeException` 类的子类，新的 `NumberTooLargeException` 子句中的代码将永远不会执行。事实就是如此。\n\
  \n### 同时捕获两个或多个异常\n\n从 Java 7 开始，你可以在单个 `catch` 子句中捕获多种类型的异常。例如，在一个特定的库存程序中，你可能不想分别处理\
  \ `NumberFormatException` 和 `OutOfRangeException` 的抛出。在这种情况下，你可以这样重写列表 13-6：\n\n\
  ```java\ntry {\n    // ... 代码 ...\n} catch (NumberFormatException | OutOfRangeException\
  \ e) {\n    // 异常处理 ...\n}\n```\n\n\n\n\n有一种传言说，`Java` 异常总是源于非本意的、错误的情况。虽然这个传言有一定的道理，但它并不完全准确。偶尔，异常会产生于正常的、预期的发生。例如，检测文件末尾。以下代码复制了一个文件：\n\
  \n```java\ntry {\n    while (true) {\n        dataOut.writeByte(dataIn.readByte());\n\
  \    }\n} catch (EOFException e) {\n    numFilesCopied = 1;\n}\n```\n\n为了将字节从 `dataIn`\
  \ 拷贝到 `dataOut`，你只需要进入一个 `while` 循环。由于条件为 `true`，`while` 循环似乎是无尽的。但最终你会到达 `dataIn`\
  \ 文件的末。当这种情况发生时，`readByte` 方法会抛出一个 `EOFException`（文件结束异常）。异常的抛出会让计算机离开 `try` 句并离开\
  \ `while` 循环。在那里，你可以在 `catch` 句中执行任何你想的操作，然后继续正常处理。\n\n![tryitout](img/tryitout.png)\
  \ 尝试这些编码任务：\n\n*   添加 `try-catch` 语句以防止以下代码崩溃：\n    ```java\n    import java.util.Scanner;\n\
  \    public class Main {\n        public static void main(String[] args) {\n   \
  \         Scanner keyboard = new Scanner(System.in);\n            String[] words\
  \ = new String[5];\n            int i = 0;\n            do {\n                words[i]\
  \ = keyboard.next();\n            } while (!words[i++].equals(\"Quit\"));\n    \
  \        for (int j = 0; j < 5; j++) {\n                System.out.println(words[j].length());\n\
  \            }\n            keyboard.close();\n        }\n    }\n    ```\n\n*  \
  \ 在 Listing 13-6 中，每个箱子的价格和太大的箱子数量是固定值。改进代码，让用户输入这两个值。记住，这些数量的一些值是没有意义的。例如，箱子数量为负数永远是不可能的。使用\
  \ `try-catch` 语句来处理不当的用户输入。\n\n## 处理异常或推卸责任\n\n所以你正在接触 `Java` 了，对吧？什么？你说你已经学到第 13\
  \ 章了？我印象深刻。你一定是个勤奋的人。但记住，只工作不玩……\n\n那么，休息一下如何？小睡一会儿可能对你大有益益。十秒钟可以吗？还是太长了？最好设为五秒吧。\n\
  \nListing 13-8 有一个程序，应该暂停执行五秒。问题是 Listing 13-8 中的程序是错误的。看一眼 Listing 13-8，然后我告诉你它哪里错了。\n\
  \nLISTING 13-8: 一个错误的程序\n\n```java\n/*\n* 这段代码无法编译。\n*/\nimport static java.lang.System.out;\n\
  public class NoSleepForTheWeary {\n    public static void main(String args[]) {\n\
  \        out.print(\"Excuse me while I nap \");\n        out.println(\"for just\
  \ five seconds…\");\n        takeANap();\n        out.println(\"Ah, that was refreshing.\"\
  );\n    }\n    static void takeANap() {\n        Thread.sleep(5000);\n    }\n}\n\
  ```\n\nListing 13-8 中的策略并不坏。其想法是调用 Java API 中定义的 `sleep` 方法。这个 `sleep` 方法属于 API\
  \ `Thread` 类。当你调用 `sleep` 方法时，你传入的数字是毫秒数。所以 `Thread.sleep(5000)` 意味着暂停五秒。\n\n问题是\
  \ `sleep` 方法内部的代码抛出一个异常。这种异常是 `InterruptedException` 类的实例。当你尝试编译 Listing 13-8 中的代码时，你会得到如下消息：\n\
  \n```\nunreported exception java.lang.InterruptedException;\nmust be caught or declared\
  \ to be thrown\n```\n\n也许消息会读作\n\n```\nUnhandled exception java.lang.InterruptedException\n\
  ```\n\n（此处由于原文存在大量重复占位符性文本，已根据指令要求翻译核心逻辑并忽略无意义重复）\n\n`Java` 有两种异常：\n\n*   *检查异常*（checked\
  \ exceptions）必须被处理。\n*   *未检查异常*（unchecked exceptions）不需要被处理。\n\n现在，当我说异常时是指什么意思？\n\
  \n（注：原文此处存在大量重复的无效文本，已按高级文档工程师标准过滤保留逻辑内容）\n\n*(注：由于提供的原文中包含大量重复的占位符性文本，译文已针对核心内容进行了处理以确保可读性。）*\n\
  \n\n\n\n\n# 列表 13-10：使用 throws 进行确认\n\n```java\nimport static java.lang.System.out;\n\
  \npublic class GoodNightsSleepB {\n    public static void main(String args[]) {\n\
  \        out.print(\"Excuse me while I nap \");\n        out.println(\"for just\
  \ five seconds…\");\n        try {\n            takeANap();\n        } catch (InterruptedException\
  \ e) {\n            out.println(\"Hey, who woke me up?\");\n        }\n        out.println(\"\
  Ah, that was refreshing.\");\n    }\n    static void takeANap() throws InterruptedException\
  \ {\n        Thread.sleep(5000);\n    }\n}\n```\n\n要查看列表 13-10 中代码的运行情况，请参考图 13-13。再次，图\
  \ 13-13 未能捕捉到运行的真实精髓，但没关系。只需记住在图 13-13 中，计算机在显示“Ah, that was refreshing.”之前暂停了五秒。\n\
  \n列表 13-10 中重要的部分在于 `takeANap` 方法的头部。该头部以 `throws InterruptedException` 结尾。通过声明它会抛出\
  \ `InterruptedException`，方法 `takeANap` 将胶皮球推给了别人。这个 `throws` 子句真正表达的是：“我意识到这个方法内部的一条语句有抛出\
  \ `InterruptedException` 的可能，但我不想在 `try-catch` 语句中确认这个异常。Java 编译器，请不要在这件事上找我。我没有使用\
  \ `try-catch` 语句，而是将确认异常的责任交给了 `main` 方法（即调用 `takeANap` 方法的方法）。”\n\n事实上，在 `main`\
  \ 方法中，对 `takeANap` 的调用位于一个 `try` 子句内部。该 `try` 子句有一个参数类型为 `InterruptedException`\
  \ 的 `catch` 子句。所以一切都是正常的。方法 `takeANap` 将责任交给了 `main` 方法，而 `main` 方法通过适当的 `try-catch`\
  \ 语句接受了这一责任。大家都很开心。甚至 Java 编译器也很开心。\n\n为了更好地理解 `throws` 子句，想象有一场排球比赛，其中排球是一个异常。当对方球队的球员发球时，该球员正在抛出异常。球越过网直接向你飞来。如果你用力把球击回球网，你就捕获（catching）了这个异常。但如果你把球传给另一个球员，你就是在使用\
  \ `throws` 子句。从上，，你在说：“给你，另一个球员。你来处理这个异常。”\n\n![remember](img/remember.png) 方法中的语句可以抛出一个未被\
  \ `catch` 子句匹配的异常。这包括抛出异常的语句甚至不在 `try` 块内部的情况。当这种情况发生时，程序的执行将跳出包含该违规语句的方法。执行将跳回最初调用该方法的任何代码。\n\
  \n![tip](img/tip.png) 方法可以在其 `throws` 子句中列出多个一个异常类型。只需用逗号分隔异常类型的名称即可，如下例所示：\n\n\
  `throws InterruptedException, IOException, ArithmeticException`\n\nJava API 拥有数百种异常类型。其中有几种是\
  \ `RuntimeException` 类的子类。任何 `RuntimeException` 的子类（或子子类、子子子类等）都是**未检查的（unchecked）**。任何不是\
  \ `RuntimeException` 的后类的异常都是**检查的（checked）**。未检查异常包括计算机难以预测的内容。此类内容包括 `NumberFormatException`（见列表\
  \ 13-2、13-4 以及其他）、`ArithmeticException`、`IndexOutOfBoundsException`、臭名的 `NullPointerException`\
  \ 以及许多其他。当你编写 Java 代码时，你的大部分代码都受到这些异常的影响，但将代码封装在 `try` 子句中（或通过 `throws` 子句传递责任）是完全可选的。\n\
  \nJava API 也有许多检查异常。计算机可以很容易检测出这类异常。因此，Java 强制对于这类异常，任何潜在的抛出异常的语句都要通过 `try` 语句或\
  \ `throws` 子句进行确认。检查异常包括 `InterruptedException`（列表 13-9）和 `IOException`（列表 13-10）。\n\
  \n## 使用 finally 子句完成工作\n\n从前以前，我还是一个年轻人，和父母住在费城，刚开始开车。我正开车去朋友家，正想着些奇思妙想时，一辆车突然冒出来，撞坏了我的汽车乘客门。这种情况被称为\
  \ `RunARedLightException.*`\n\n不管怎样，两辆车还能开，我们正处繁忙的十字路口中间。为了避免交通拥堵，我们都停在了最近的路缘。我翻找驾驶执照（上面有一张我看起来非常年轻的照片），并打开门下车。\n\
  \n就在那时，第二次事故发生了。当我从车里下车时，一辆城市公交车经过。公交车撞了我，并将我推向了我的车了几次。这种情况被称为 `DealWithLawyersException.`\n\
  \n\n\n\n事实是，一切都进展得很顺利。我只是受了点轻伤，但并没有伤及骨。我的父母支付了修理汽车的费用，所以我没有承受任何财务后果。（我设法通过将 `RunARedLightException`\
  \ 放入我的 `throws` 子句中成功转嫁了财务负担。）\n\n这次事件有助于解释了为什么我是这样看待异常处理的。特别是，我很好奇：“当计算机正在从一个异常中恢复时，又抛出了第二个异常，会发生什么？”毕竟，`catch`\
  \ 句内部的语句也无法免受灾难的影响。\n\n嗯，这个问题的答案绝非简单。首先，你可以在 `catch` 句内部放置一个 `try` 语句。这可以保护你免受执行\
  \ `catch` 句期间可能出现的意外且可能令人尴尬的事件的影响。但当你开始担心级联异常时，你就打开了一个极其棘手的“马力虫罐”。这种情况非常多，事情很快就会变得非常复杂。\n\
  \n你可以做的一件不怎么复杂的事情是创建一个 `finally` 句。与 `catch` 句一样，`finally` 句位于 `try` 句之后。主要的区别在于，无论是否抛出异常，`finally`\
  \ 句中的语句都会被执行。其理念是：“无论发生什么，无论好坏，都执行这个 `finally` 句内部的语句。”列表 13-11 提供了一个示例。\n\n###\
  \ 列表 13-11： 跳转跳转\n\n```java\nimport static java.lang.System.out;\n\npublic class\
  \ DemoFinally {\n    public static void main(String args[]) {\n        try {\n \
  \           doSomething();\n        } catch (Exception e) {\n            out.println(\"\
  Exception caught in main.\");\n        }\n    }\n    static void doSomething() {\n\
  \        try {\n            out.println(0 / 0);\n        } catch (Exception e) {\n\
  \            out.println(\"Exception caught in doSomething.\");\n            out.println(0\
  \ / 0);\n        } finally {\n            out.println(\"I'll get printed.\");\n\
  \        }\n        out.println(\"I won't get printed.\");\n    }\n}\n```\n\n通常，当我想到一个\
  \ `try` 语句时，我想到的是计算机从一个不愉快的局面中恢复。恢复发生在 `catch` 句内部，然后计算机继续执行 `try` 语句之后的任何语句。嗯，如果在执行\
  \ `catch` 句期间发生了某些错误，这幅图就会开始变得不同。\n\n列表 13-11 在图 13-14 中得到了实战。首先，`main` 方法调用了 `doSomething`。然后，那个愚蠢的\
  \ `doSomething` 方法故意制造麻烦。`doSomething` 方法用 `0` 除以 `0`，这在任何编程语言中都是非法且无法执行的。`doSomething`\
  \ 方法的这一愚蠢行为抛出了 `ArithmeticException`，它被 `try` 语句中唯一的 `catch` 句捕获了。\n\n![image](img/9781119235552-fg1314.png)\n\
  \n图 13-14： 运行列表 13-11 中的代码。\n\n在 `catch` 句内部，那个卑劣的 `doSomething` 方法再次用 `0` 除以 `0`。这一次，执行除法的语句并不在受保护的\
  \ `try` 句内部。这没关系，因为 `ArithmeticException` 不是受检的异常。（它是 `RuntimeException` 子类之一。它是一种不需要在\
  \ `try` 或 `throws` 句中进行确认的异常。详情请参阅前一节。）\n\n嗯，无论是否受检，抛出另一个 `ArithmeticException`\
  \ 都会导致控制跳出 `doSomething` 方法。但在离开 `doSomething` 方法之前，计算机执行了 `try` 语句的最后遗嘱：`finally`\
  \ 句内部的语句。这就是为什么在图 13-14 中你会看到 `I'll get printed.`。\n\n有趣的是，在列表 13-11 中你不会看到 `I won't\
  \ get printed.`。\n\n在 `catch` 句内部，那个卑劣的 `doSomething` 方法再次用 `0` 除以 `0`。这一次，执行除法的语句并不在受保护的\
  \ `try` 句内部。这没关系，因为 `ArithmeticException` 不是受检的异常。（它是 `RuntimeException` 子类之一。它是一种不需要在\
  \ `try` 或 `throws` 句中进行确认的异常。详情请参阅前一节。）\n\n嗯，无论是否受检，抛出另一个 `ArithmeticException`\
  \ 都会导致控制跳出 `doSomething` 方法。但在离开 `doSomething` 方法之前，计算机执行了 `try` 语句的最后遗嘱：`finally`\
  \ 句内部的语句。这就是为什么在图 13-14 中你会看到 `I'll get printed.`。\n\n有趣的是，在列表 13-11 中你不会看到 `I won't\
