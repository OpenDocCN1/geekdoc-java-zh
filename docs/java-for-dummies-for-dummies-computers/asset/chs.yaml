  \n图 7-19： 我赢了！\n\n我的 `DummiesFrame` 类并不专门用于问候。列表 7-11 使用 `DummiesFrame` 来算运算。\n\n\
  \n\n\n\n这就是面向对象编程之所以成功的原因之一。多年来，公司一直在购买预写的代码，却发现这些代码并没有按照它们想要的方式运行。那么，公司是如何处理的呢？他们开始胡改代码。他们的程序员深入挖掘程序文件，更改变量名，移动子程序的位置，重写公式，并总的来说让代码变得更糟。现实情况是，如果一个程序没有按照你想要的方式运行（即使它运行得非常接近你的要求），你永远无法通过在代码内部乱搞来改善局面。最好的选择总是抛弃整个程序（尽管这很昂贵）并从头开始。多么凄惨的现状啊！\n\
  \n随着面向对象编程的出现，巨大的变化发生了。核心在于，面向对象的程序的设计初衷就是为了被修改。通过编写良好的软件，你可以利用已经内置的功能，添加你自己的新功能，并覆盖不符合你的需求。最棒的部分是，你所做的更改是整洁的。不需要去抠挖和挖掘他人脆弱的程序代码。相反，你可以在不接触现有代码内部逻辑的情况下，进行良好、有序的添加和修改。这是理想的解决方案。\n\
  \n### 关于员工的最后定\n\n当你编写一个面向对象的程序时，你首先开始考虑数据。你正在编写关于账户的内容。那么什么是账户？你正在编写代码来处理按钮点击。那么什么是按钮？你正在编写一个程序向员工发送工资支票。什么是员工？\n\
  \n在本章的第一个示例中，员工是一个拥有姓名和职位名称的人。当然，员工还有其他特征，但目前我坚持于基础知识。代码列表 8-1 中的代码定义了什么是员工。\n\n\
  代码列表 8-1: 什么是员工？\n\n```java\nimport static java.lang.System.out;\n\npublic class\
  \ Employee {\n    private String name;\n    private String jobTitle;\n\n    public\
  \ void setName(String nameIn) {\n        name = nameIn;\n    }\n\n    public String\
  \ getName() {\n        return name;\n    }\n\n    public void setJobTitle(String\
  \ jobTitleIn) {\n        jobTitle = jobTitleIn;\n    }\n\n    public String getJobTitle()\
  \ {\n        return jobTitle;\n    }\n\n    public void cutCheck(double amountPaid)\
  \ {\n        out.printf(\"Pay to the order of %s \", name);\n        out.printf(\"\
  (%s) ***$\", jobTitle);\n        out.printf(\"%,.2f\\n\", amountPaid);\n    }\n\
  }\n```\n\n根据代码列表 8-1，每个员工有七个特征。这些特征中的两个相当简单：每个员工都有一个姓名和一个职位名称。（在代码列表 8-1 中，`Employee`\
  \ 类有一个 `name` 字段和一个 `jobTitle` 字段。）\n\n员工还有什么呢？每个员工有四个方法来处理员工姓名和职位名称的值。这些方法是 `setName`、`getName`、`setJobTitle`\
  \ 和 `getJobTitle`。我在第 7 章中解释了此类方法（`accessor` 访问方法）。\n\n在这一切之上，每个员工还有一个 `cutCheck`\
  \ 方法。其想法是，编写工资支票的方法必须属于某一个类。因为工资支票中的大部分信息都是针对特定员工定制的，你不如将 `cutCheck` 方法放在 `Employee`\
  \ 类内部。\n\n关于 `cutCheck` 方法中 `printf` 的详细信息，请参见本章稍后的“开具支票”部分。\n\n### 善用你的类\n\n代码列表\
  \ 8-1 中的 `Employee` 类没有 `main` 方法，所以没有执行代码的起点。为了弥补这一缺陷，程序员编写了一个带有 `main` 方法的独立程序，并用该程序创建\
  \ `Employee` 实例。代码列表 8-2 展示了一个带有 `main` 方法的类——该类对代码列表 8-1 中的代码进行了测试。\n\n代码列表 8-2:\
  \ 编写工资支票\n\n```java\nimport java.util.Scanner;\nimport java.io.File;\nimport java.io.IOException;\n\
  \npublic class DoPayroll {\n    public static void main(String args[]) throws IOException\
  \ {\n        Scanner diskScanner = new Scanner(new File(\"EmployeeInfo.txt\"));\n\
  \        for (int empNum = 1; empNum <= 3; empNum++) {\n            payOneEmployee(diskScanner);\n\
  \        }\n        diskScanner.close();\n    }\n\n    static void payOneEmployee(Scanner\
  \ diskScanner) {\n        Employee anEmployee = new Employee();\n        anEmployee.setName(diskScanner.nextLine());\n\
  \        anEmployee.setJobTitle(diskScanner.nextLine());\n        anEmployee.cutCheck(diskScanner.nextDouble());\n\
  \    }\n}\n```\n\n\n\n\n\nListing 8-1 包含了三个 `printf` 调用。每个 `printf` 调用都包含一个格式字符串（例如\
  \ `\"(%s) $\"`）和一个变量（如 `jobTitle`）。每个格式字符串都有一个占位符（如 `%s`），它决定了变量值在何时以及如何显示。\n\n\
  例如，在第二个 `printf` 调用中，格式字符串有一个 `%s` 占位符。这个 `%s` 为 `jobTitle` 变量的值预留了位置。根据 Java 的规则，`%s`\
  \ 符号始终为字符串预留位置，事实也如此，变量 `jobTitle` 在 Listing 8-1 中被声明为 `String` 类型。括号和其他一些字符包围着\
  \ `%s` 占位符，因此在程序的输出中，每个职位标题都用括号包围。（参见 Figure 8-2。）\n\n![image](img/9781119235552-fg0802.png)\n\
  \nFIGURE 8-2: 每个人都得到了工资。\n\n回到 Listing 8-1，注意 `%,2f` 占位符内部的逗号。逗号告诉程序使用分组分隔符。这就是为什么在\
  \ Figure 8-2 中，你看到的是 $5,000.00、$7,000.00 和 $10,000.00，而不是 $5000.00、$7000.00 和 $10000.00。\n\
