  \n## 在许多替代方案中选择（Java switch 语句）\n\n我第一个承认，我讨厌做做决定。如果事情出了问题，我宁愿让问题变成别人的过错。编写之前的章节（关于使用\
  \ Java 的 `if` 语句做决定）让我精疲力竭。这就是为什么当我开始这个关于在许多替代方案中选择的章节时，我感到大脑发大。把这些话说出来真是轻松！\n\n\
  ### 你的基础 switch 语句\n\n现在，是时候探索具有多个分支决策的情况了。例如，流行的营火歌“Al’s All Wet”。关于歌词的介绍，请参见侧边栏“Al’s\
  \ All Wet”。你急于编写打印这首歌歌词的代码。幸运的是，你不需要重复输入所有的单词。显示“Al’s All Wet”歌词的完整程序将在第 6 章出现。假设你有一个名为\
  \ `verse` 的变量。`verse` 的值为 1、2、3 或 4，取决于你想打印“Al’s All Wet”的哪一节。你可以有一组笨拙的 `if` 语句来检查每一节：\n\
  \n```java\nif (verse == 1) {\n    out.println(\"That's because he has no brain.\"\
  );\n}\nif (verse == 2) {\n    out.println(\"That's because he is a pain.\");\n}\n\
  if (verse == 3) {\n    out.println(\"'Cause this is the refrain.\");\n}\n```\n\n\
  但这种方法似乎浪费资源。为什么不创建一个检查一次值的语句呢？幸运的是，这种语句存在，被称为 `switch`。列表 5-6 有一个 `switch` 的示例。\n\
  \n```java\nimport static java.lang.System.out;\nimport java.util.Scanner;\n\npublic\
  \ class JustSwitch {\n    public static void main(String args[]) {\n        Scanner\
  \ keyboard = new Scanner(System.in);\n        out.print(\"Which verse? \");\n  \
  \      int verse = keyboard.nextInt();\n        switch (verse) {\n            case\
  \ 1:\n                out.println(\"That's because he has no brain.\");\n      \
  \          break;\n            case 2:\n                out.println(\"That's because\
  \ he is a pain.\");\n                break;\n            case 3:\n             \
  \   out.println(\"'Cause this is the refrain.\");\n                break;\n    \
  \        default:\n                out.println(\"No such verse. Please try again.\"\
  );\n                break;\n        }\n        out.println(\"Ohhhhhhhh ...\");\n\
  \        keyboard.close();\n    }\n}\n```\n\n图 5-8 展示了列表 5-6 中代码的两次运行。（图 5-9 说明了程序的整体思路。）首先，用户输入一个数字，如\
  \ 2。然后程序的执行到达 switch 语句的顶部。计算机检查 `verse` 的值。当计算机确定 `verse` 变量的值为 2 时，计算机检查 switch\
  \ 语句的每个 `case`。值 2 不匹配第一个 case，因此计算机继续到中间。值 2 匹配中间 case，因此计算机执行 case 2 之后的语句。这两个语句是：\n\
  \n```java\nout.println(\"That's because he is a pain.\");\nbreak;\n```\n\n![image](img/9781119235552-fg0508.png)\n\
  \n图 5-8：中的代码。\n\n![image](img/9781119235552-fg0509.png)\n\n图 5-9：代码中的大分叉。\n\n两个语句中的第一个在屏幕上显示“That’s\
  \ because he is a pain.”。第二个语句被称为 `break` 语句。（多么惊喜！）当计算机遇到 `break` 语句时，计算机会跳出它所在的任何\
  \ switch 语句。因此，在列表 5-6 中，计算机直接跳过了会显示“Cause this is the refrain.”的 case。事实上，计算机跳出了整个\
  \ switch 语句，直接转到 switch 语句结束后的语句。计算机显示 Ohhhhhhhh …… 因为那是 switch 语句之后的语句告诉计算机做的。\n\
  \n如果这个讨厌的用户请求第 6 节，计算机将跳过 case 1、2 和 3。计算机直接进入 `default`。在 `default` 中，计算机显示“No\
  \ such verse. Please try again”，然后跳出 switch 语句。计算机跳出 switch 语句后，计算机显示 Ohhhhhhhh\
  \ .\n\n\n\n\n\n![tip](img/tip.png) 你并不真的需要在 switch 语句的最后末尾放置一个 break。在 Listing 5-6\
  \ 中，最后一个 break（属于 default 部分的 break）仅仅是为了整体的整洁。\n\n### 要么 break 还是不 break\n\n在每个\
  \ Java 程序员的生命中，总会有他们忘记使用 `break` 语句的时候。起初，输出结果会令人困惑，但随后程序员就会想起贯穿（fall-through）。`fall-through`\
  \ 这个术语描述了当你在没有 `break` 语句的情况下结束一个 case 时发生的情况。结果是代码的执行会直接穿透到下一个 case。执行会一直向下持续，直到你最终遇到\
  \ `break` 语句或整个 switch 语句的结束。\n\n通常情况下，当你使用 switch 语句时，你不希望发生贯穿，因此你会在 switch 语句中到处布置\
  \ `break` 语句。但有时，贯穿正是你所需要的。例如，歌曲“Al’s All Wet”。（高雅的歌词在带有歌曲名称侧边栏中。）“Al’s All Wet”的每一节都在之前几节的基础上增加了新的行。这种情况（从一节歌累积行到另一节歌）正需要一个带有贯穿功能的\
  \ switch 语句。Listing 5-7 演示了这一思想。\n\nLISTING 5-7: 带有贯穿的 switch 语句\n\n```\nimport\
  \ static java.lang.System.out;\nimport java.util.Scanner;\n\npublic class FallingForYou\
  \ {\n    public static void main(String args[]) {\n        Scanner keyboard = new\
  \ Scanner(System.in);\n        out.print(\"Which verse? \");\n        int verse\
  \ = keyboard.nextInt();\n        switch (verse) {\n            case 3:\n       \
  \         out.print(\"Last refrain, \");\n                out.println(\"last refrain,\"\
  );\n            case 2:\n                out.print(\"He's a pain, \");\n       \
  \         out.println(\"he's a pain,\");\n            case 1:\n                out.print(\"\
  Has no brain, \");\n                out.println(\"has no brain,\");\n        }\n\
  \        out.println(\"In the rain, in the rain.\");\n        out.println(\"Ohhhhhhhh…\"\
  );\n        out.println();\n        keyboard.close();\n    }\n}\n```\n\nFigure 5-10\
  \ 显示了 Listing 5-7 中程序的几次运行结果。因为 switch 内部没有 `break` 语句，贯穿现象随处发生。例如，当用户选择第 2 节时，计算机执行\
  \ case 2 中的两个语句：\n\n```\nout.print(\"He's a pain, \");\nout.println(\"he's a pain,\"\
  );\n```\n\n![image](img/9781119235552-fg0510.png)\n\nFIGURE 5-10: 运行四次 Listing 5-7\
  \ 中的代码。\n\n然后计算机直接向向执行 case 1 中的两个语句：\n\n```java\nout.print(\"Has no brain, \");\n\
  out.println(\"has no brain,\");\n```\n\n这是很好的，因为歌曲的第二节包含了所有这些行。\n\n注意看当用户请求第 6 节时发生了什么。Listing\
  \ 5-7 中的 switch 语句既没有 case 6 也没有 default，所以 switch 语句内部的任何操作都没有执行。尽管如此，由于在 switch\
  \ 语句之后紧跟着有打印 In the rain, in the rain 和 Ohhhhhhhh … 的语句，当用户请求第 6 节时，计算机仍然显示了某些内容。\n\
  \n### switch 语句中的字符串\n\n在之前显示的 Listings 5-6 和 5-7 中，变量 `verse`（一个 `int` 值）引导 switch\
  \ 语句进入某个 case 或另一个 case。switch 语句内部的 `int` 值在任何版本的 Java 中都有效。（事实上，`char` 值和其他几种类型的值自\
  \ Java 作为一个全新语言以来就可以在 Java 的 switch 语句中使用。）\n\n从 Java 7 开始，你可以设置使得 switch 语句中执行的\
  \ case 取决于特定字符串的值。Listing 5-8 阐了字符串在 switch 语句中的用法。Figure 5-11 显示了 Listing 5-8 代码的一次运行。\n\
  \n![image](img/9781119235552-fg0511.png)\n\n\n\n\n\n```java\npublic static void\
  \ main(String args[]) {\n    Scanner keyboard = new Scanner(System.in);\n    int\
  \ numGuesses = 0;\n    int randomNumber = new Random().nextInt(10) + 1;\n    out.println(\"\
  \ ************ \");\n    out.println(\"Welcome to the Guessing Game\");\n    out.println(\"\
  \ ************ \");\n    out.println();\n    out.print(\"Enter an int from 1 to\
  \ 10: \");\n    int inputNumber = keyboard.nextInt();\n    numGuesses++;\n    while\
  \ (inputNumber != randomNumber) {\n        out.println();\n        out.println(\"\
  Try again…\");\n        out.print(\"Enter an int from 1 to 10: \");\n        inputNumber\
  \ = keyboard.nextInt();\n        numGuesses++;\n    }\n    out.print(\"You win after\
  \ \");\n    out.println(numGuesses + \" guesses.\");\n    keyboard.close();\n}\n\
  ```\n\n在图 6-1 中，用户进行了四次猜测。每一轮，计算机都会检查猜测是否正确。错误的猜测会产生一个要求再次尝试的请求。对于正确的猜测，用户会得到一个振奋人心的“你赢了”提示，以及他或她所猜测次数的计数。计算机会重复几条语句，每次都检查用户的猜测是否与某个随机生成的数字相同。每当用户进行猜测，计算机就会在其猜测计数中加\
  \ 1。当用户给出正确猜测时，计算机就会显示该计数。图 6-2 展示了动作的流程。\n\n![image](img/9781119235552-fg0602.png)\n\
  \n图 6-2： 周而复始地进行。\n\n当你查看代码列表 6-1 时，你会看到完成所有这些工作的代码。代码的核心是一个被称为 `while statement`（也称为\
  \ `while loop`）的结构。用英语表述，`while`语句的意思是：\n\n`当` `inputNumber` `不等于` `randomNumber`\n\
  `一直执行大括号中的所有内容：` `{ }`\n\n大括号中的内容（重复的部分）是打印“Try again”和“Enter an int …”、从键盘获取值以及给用户的猜测计数加\
  \ 1 的代码。\n\n![tip](img/tip.png) **提示：** 当你处理计数器时（例如代码列表 6-1 中的`numGuesses`），你可能会很容易变得困惑，并在两个方向上产生差\
  \ 1。通过确保 `++` 语句紧贴你正在统计其事件的语句，你可以避免这种头疼的问题。例如，在代码列表 6-1 中，变量 `numGuesses` 的初始值为\
  \ 0。这是因为当程序开始运行时，用户还没有进行任何猜测。在程序的后面，紧接每次调用 `keyboard.nextInt` 之后都是一个 `numGuesses++`\
  \ 语句。这就是你的做法——一旦用户输入另一个猜测，你就立即为计数器加 1。\n\n只要 `inputNumber != randomNumber` 为真，大括号中的语句就会重复执行。循环中语句的每次执行被称为循环的次“迭代”（iteration）。在图\
  \ 6-1 中，循环经历了三次迭代。（如果你不相信图 6-1 **记住：** 使用如代码列表 6-1 所示的代码，计算机会跳过 `while` 循环并继续执行\
  \ `while` 循环下方的语句。\n\n## 重复次数（Java 语句）\n\n由于计数非常常见，语言创建者专门为此开发了语句。在 Java 中，重复特定次数的语句被称为\
  \ `for statement`。代码列表 6-2 和 6-3 展示了 `for` 的用法。\n\n### 代码列表 6-2：世界上最无聊的 for 循环\n\
  \n图 6-2\n```java\nimport static java.lang.System.out;\npublic class Yawn {\n   \
  \ public static void main(String args[]) {\n        for (int count = 1; count <=\
  \ 10; count++) {\n            out.print(\"The value of count is \");\n         \
  \   out.print(count);\n            out.println(\".\");\n        }\n        out.println(\"\
  Done!\");\n    }\n}\n```\n\n图 6-3 展示了当你运行代码列表 6-2 中的程序时会得到的结果。（你得到的是应得的。）代码列表 6-2\
  \ 中的 `for statement` 首先将 `count` 变量设置为 1。然后语句测试 `count` 是否小于等于 10（显然如此）。接着语句执行大括号之间的打印语句。（在游戏的早期阶段，计算机打印\
  \ The value of count is 1。）最后，`for` 语句执行其括号内的最后一项操作——将 `count` 的值加 1。\n\n\n\n\n\n\
  当 `count` 现在等于 2 时，`for` 语句再次检查以确保 `count` 小于或等于 10。（是的，2 小于 10。）由于测试通过，`for` 语句回到大括号内的语句中，并在屏幕上打印\
  \ `The value of count is 2`。最后，`for` 语句执行其括号内的最后的一件事——将 `count` 的值加 1，将 `count`\
  \ 的值增加到 3。\n\n以此此类推。整个过程重复，直到在十次迭代后，`count` 的值终于达到 11。当这种情况发生时，`count` 小于或等于十的检查失败，循环结束。计算机跳转到紧随\
  \ `for` 语句之后的语句。在列表 6-2 中，计算机打印 `Done!` 作为输出。图 6-4 说明了整个过程。\n\n![image](img/9781119235552-fg0604.png)\n\
  \n图 6-4: [列表 6-2]中 `for` 循环的作用。\n\n### for 语句的结构分析\n\n在单词 `for,` 之后，你始终要在括号中放入三个东西。这三个中的第一个被称为`初始化\
  \ (initialization)`，第二个是`表达式 (expression)`，第三个是`更新 (update)`：\n\n`for (initialization;\
  \ expression; update)`\n\n括号中的三个项目每个都有其独特的角色：\n\n*   `initialization` 执行一次，当程序运行第一次遇到\
  \ `for` 语句时执行。\n*   `expression` 被评估多次（在每次迭代之前）。\n*   `update` 也被评估多次（在每次迭代结束时）。\n\
  \n如果有帮助的话，可以将循环想象成它的文本在到处移动：\n\n```java\nint count = 1;\nfor count <= 10 {\n   \
  \ out.print(\"The value of count is \");\n    out.print(count);\n    out.println(\"\
  .\");\n    count++;\n}\n```\n\n你不能这样写一个真正的 `for` 语句。尽管如此，这也是语句各部分执行的顺序。\n\n![warning](img/warning.png)\
  \ 如果你在 `for` 循环的初始化中声明了一个变量，你就不能在循环外部使用该变量。例如，在列表 6-2 中，如果你尝试在循环结束后放置 `out.println(count)`，你会得到一个错误消息。\n\
  \n![tip](img/tip.png) 任何可以用 `for` 循环完成的事情也可以用 `while` 循环完成。选择使用 `for` 循环是风格和便利性的问题，而不是必要性。\n\
  \n![tryitout](img/tryitout.png) 想做些练习吗？尝试这些实验和挑战：\n\n*   `for` 语句的初始化可能有多个部分。`for`\
  \ 语句的更新也可以有多个部分。要发现如何，请在 Java 的 JShell 中输入以下行，或将这些行添加到一个小型 Java 程序中：\n\n    ```java\n\
  \    import static java.lang.System.out\n    for (int i = 0, j = 10; i < j; i++,\
  \ j--) {out.println(i + \" \" + j);}\n    ```\n\n*   以下代码的输出是什么？\n\n    ```java\n\
  \    int total = 0;\n    for (int i = 0; i < 10; i++) {\n        total += i;\n \
  \   }\n    System.out.println(total);\n    ```\n    在这段代码中，变量 `total` 被称为累加器 (accumulator)，因为它在循环内部累积（相加）了一组值。\n\
  \n*   在数学中，感叹号（`!`）意味着`阶乘 (factorial)`——当你乘以某个数字及其之前的所有正 `int` 值时所得到的结果。例如，`3!`\
  \ 是 `1 × 2 × 3`，结果为 `6`。而 `5!` 是 `1 × 2 × 3 × 4 × 5`，结果为 `120`。\n    编写一个程序，让用户输入一个正\
  \ `int` 值（称为 `n`），让 Java 显示 `n!` 的值作为输出。\n\n*   在不运行以下代码的情况下，尝试预测代码的输出：\n\n    ```java\n\
  \    for (int row = 0; row < 5; row++) {\n        for (int column = 0; column <\
  \ 5; column++) {\n            System.out.print(\"*\");\n        }\n        System.out.println();\n\
  \    }\n    ```\n    做出预测后，运行代码以发现你的预测是否正确。\n\n*   此实验中的代码是上一个实验代码的变体。首先预测代码将输出什么，然后运行代码找出你的预测是否正确：\n\
  \n    ```java\n    for (int row = 0; row < 5; row++) {\n        for (int column\
  \ = 0; column <= row; column++) {\n            System.out.print(\"*\");\n      \
  \  }\n        System.out.println();\n    }\n    ```\n\n*   编写一个使用循环显示三个模式副本的程序：\n\
  \n    ```\n    *\n    **\n    ***\n    ```\n\n### Al Wet 的世界首映\n\n列表 6-2 非常不错，但该程序什么都没做。为了有一个更引人注目的例子，请看列表\
  \ 6-3。在列表 6-3 中，两个 `switch` 语句嵌套在一个 `for` 循环中。其中一个 `switch` 语句使用了 `break` 语句；另一个\
  \ `switch` 语句使用了穿透（fall-through）。当 `for` 循环计数变量 `verse` 的值从 1 到 2 再到 3 时，`switch`\
  \ 语句中的所有 case 都会被执行。当程序运行接近结束且执行离开 `for` 循环时，程序的最后四个语句将打印歌曲的最后一节。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 当我大胆地声称 `for` 语句是为了计数的时，我稍微夸张了事实。Java 的 `for` 语句非常多能。你可以在与计数无关的情况下使用 `for` 语句。例如，没有更新部分的语句，如\
  \ `for (i = 0; i < 10; )`，会一直进行。当循环内部某些操作给变量 `i` 赋值一个大数时，循环就会结束。你甚至可以创建一个括号内为空的\
  \ `for` 语句。循环 `for ( ; ; )` 会永远运行，如果循环控制着一台严肃的机器，那是很好的。\n\n列表 6-3 无删节版的《Al Wet》歌曲\n\
  \n```java\nimport static java.lang.System.out\npublic class AlsAllWet {\n    public\
  \ static void main(String args[]) {\n        for (int verse = 1; verse <= 3; verse++)\
  \ {\n            out.print(\"Al's all wet. \");\n            out.println(\"Oh, why\
  \ is Al wet? Oh,\");\n            out.print(\"Al's all wet 'cause \");\n       \
  \     out.println(\"he's standing in the rain.\");\n            out.println(\"Why\
  \ is Al out in the rain?\");\n            switch (verse) {\n                case\
  \ 1:\n                    out.println(\"That's because he has no brain.\");\n  \
  \                  break;\n                case 2:\n                    out.println(\"\
  That's because he is a pain.\");\n                    break;\n                case\
  \ 3:\n                    out.println(\"'Cause this is the last refrain.\");\n \
  \                   break;\n            }\n            switch (verse) {\n      \
  \          case 3:\n                    out.println(\"Last refrain, last refrain,\"\
  );\n                case 2:\n                    out.println(\"He's a pain, he's\
  \ a pain,\");\n                case 1:\n                    out.println(\"Has no\
  \ brain, has no brain,\");\n            }\n            out.println(\"In the rain,\
  \ in the rain.\");\n            out.println(\"Ohhhhhhhh…\");\n            out.println();\n\
  \        }\n        out.print(\"Al's all wet. \");\n        out.println(\"Oh, why\
  \ is Al wet? Oh,\");\n        out.print(\"Al's all wet 'cause \");\n        out.println(\"\
  he's standing in the rain.\");\n    }\n}\n```\n\n列表 6-3 很好，因为它结合了第 5 章](#10_9781119235552-ch05.xhtml)和第\
  \ 6 章](#11_9781119235552-ch06.xhtml)中的许多思想。\n\n\n\n\n\n-   Listing 6-3 使用 `break`\
  \ 语句跳出 `switch` 结构。但 `break` 语句也可以循环内部内部作用。要了解它是如何工作的，请运行一个包含以下代码的程序：\n\n```\nScanner\
  \ keyboard = new Scanner(System.in);\nwhile (true) {\n    System.out.print(\"Enter\
  \ an int value: \");\n    int i = keyboard.nextInt();\n    if (i == 0) {\n     \
  \   break;\n    }\n    System.out.println(i);\n}\nSystem.out.println(\"Done!\");\n\
  keyboard.close();\n```\n\n循环的条件始终为真。这就像用 `while (1 + 1 == 2)` 这一行启动循环。如果没有 `break`\
  \ 语句，循环将永远运行。幸运的是，当你执行 `break` 语句时，Java 会跳转到循环之后后的代码。\n\n-   除了 `break` 语句外，Java\
  \ 还有一个 `continue` 语句。当你执行 `continue` 语句时，Java 会跳到循环的末尾并开始该循环的下次迭代。要看到它的作用，请运行一个包含以下代码的程序：\n\
  \n```\nScanner keyboard = new Scanner(System.in);\nwhile (true) {\n    System.out.print(\"\
  Enter an int value: \");\n    int i = keyboard.nextInt();\n    if (i > 10) {\n \
  \       continue;\n    }\n    if (i == 0) {\n        break;\n    }\n    System.out.println(i);\n\
  }\nSystem.out.println(\"Done!\");\nkeyboard.close();\n```\n\n# 重复直到你想要的（Java do\
  \ 语句）\n\n*愚蠢者闯入天使所畏惧的地方。*\n—亚历山大·波普\n\n今天，我想年轻而愚蠢（或者至少是愚蠢）。回看 图 6-2，注意 Java 的 `while`\
  \ 循环是如何工作的。当执行进入 `while` 循环时，计算机会检查循环条件是否为真。如果条件不为真，循环内部的语句永远不会执行——即使一次也不执行。事实上，你可以轻松编写一个\
  \ `while` 循环，其语句永远不会执行（尽管我想不出你为什么会有这种这么做）：\n\n```\nint twoPlusTwo = 2 + 2;\nwhile\
  \ (twoPlusTwo == 5) {\n    out.println(\"Are you kidding?\");\n    out.println(\"\
  2 + 2 doesn't equal 5\");\n    out.print(\"Everyone knows that\");\n    out.println(\"\
  \ 2 + 2 equals 3\");\n}\n```\n\n尽管有这个愚蠢的 `twoPlusTwo` 例子，`while` 语句被证明是 Java 循环结构中最多用途的。特别是，`while`\
  \ 循环适用于那些必须“三思后行”的情况。例如，“当账户里有钱时，每个月写一张抵押贷款支票。”当你第一次遇到这个语句时，如果你的账户余额为零，你不想写抵押贷款支票——哪怕一张都不写。\n\
  \n但有时（并不多），你想“先斩后奏”。例如，当你向用户索要回复的情况。也许用户的回复是有意义的，但可能没有意义。如果没有意义，你想再次询问。也许用户的手指滑了，又也许用户没有听懂问题。\n\
  \n图 6-5 显示了删除文件程序的几次运行。在删除文件之前，程序会询问用户是否可以进行删除。如果用户回答 `y` 或 `n`，程序将按照用户的意愿进行。但如果用户输入任何其他字符（任何数字、大写字母、标点符号或其他），程序将要求用户提供另一个回复。\n\
  \n![image](img/9781119235552-fg0605.png)\n\n图 6-5： Listing 6-4 代码的两次运行。\n\n要编写此程序，你需要一个循环——一个反复询问用户是否应该删除文件的循环。循环会一直询问，直到用户给出一个有意义的回复。现在，需要注意的是，循环在第一次询问用户之前不需要检查任何内容。事实上，在用户给出第一个回复之前，循环没有可以检查的内容。循环并不是开始于“只要某事为真，就从用户处获取回复”。相反，循环只是向前跳，获取用户的回复，然后检查该回复看看它是否有意义。这就是为什么\
  \ Listing 6-4 中的程序使用了 `do` 循环（也称为 `do...while` 循环）。使用 `do` 循环，程序直接进入并执行操作，然后检查结果是否有意义。如果结果有意义，循环结束。如果没有意义，程序返回循环顶部。\n\
