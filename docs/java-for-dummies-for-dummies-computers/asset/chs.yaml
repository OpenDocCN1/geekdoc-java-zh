  ## 静态化（计算团队平均值）\n\n考虑一下列表 10-1 到 10-3 中的代码，你决定想找到球队的整体击球率。这不是坏主意！图 10-1 中的 `Hankees`\
  \ 平均值约为 .106，所以团队需要进行一些强化训练。当球员们在球场上练习击球时，你有一个哲学上的障碍需要克服。\n\n在列表 10-1 到 10-3 中，你有三个类：一个\
  \ `Player` 类和另外两个帮助显示来自 `Player` 类数据的类。那么，在这个类的丛林中，存储你的整体团队平均总计数的变量应该存放在哪里呢？\n\n\
  *   在两个显示类（`TeamFrame` 和 `ShowTeamFrame`）中放置总计数变量是没有意义的。毕竟，总计数与球员、团队和棒球有某种关系。显示类是关于创建窗口的，而不是关于打棒球。\n\
  \n*   将整个团队平均值放在 `Player` 类的实例中让你感到不舒服，因为 `Player` 类的实例只代表团队中的某一个球员。一个单独球员有什么业务存储整个团队数据呢？当然，你可以让代码运行起来，但这并不是解决该问题的优雅方案。\n\
  \n最后，你发现……（此处原文后续为大量重复，译文已按要求去重并保留核心内容）\n\n\n\n\n在 Listing 10-4 中，`decFormat` 字段是静态的（static）。这是很有意义，因为\
  \ `decFormat` 让 `totalOfAverages / playerCount` 看起来很美观，而且表达式 `totalOfAverages /\
  \ playerCount` 中的两个字段都是静态的。更更直接地说，代码格式化数字只需要一个东西。如果你有几个数字需要格式化，属于整个类的同一个 `decFormat`\
  \ 实例就可以格式化每个数字。为每个玩家创建一个 `decFormat` 不仅不优雅，而且浪费资源。\n\n但将 `decFormat` 声明为静态的带来了一个小问题。为了设置格式，你必须调用诸如\
  \ `decFormat.setMaximumIntegerDigits(0)` 这样的方法。你不能随地将这些方法调用放在 `PlayerPlus` 类的任何地方。例如，下面的代码是糟糕的、无效的、非法的且不符合\
  \ Java 习惯的：\n\n```java\n#### 这是糟糕的代码：\npublic class PlayerPlus extends Player {\n\
  \    private static DecimalFormat decFormat = new DecimalFormat();\n    decFormat.setMaximumIntegerDigits(0);\
  \ // Bad!\n    decFormat.setMaximumFractionDigits(3); // Bad!\n    decFormat.setMinimumFractionDigits(3);\
  \ // Bad!\n}\n```\n\n看看之前章节中的示例。在那些示例中，我从没有让方法调用孤立地悬空，就像我在那段糟糕的代码中做的那样。在本章的 Listing\
  \ 10-1 中，我没有在将方法调用放在 `getAverageString` 方法体的情况下调用 `setMaximumIntegerDigits`。这种“不悬空方法调用”的做法并非偶然。Java\
  \ 的规则限制了代码中可以发布方法调的地方，在类定义内部直接放置一个孤立的方法调用是大忌。\n\n在 Listing 10-4 中，你可以在哪里放置必要的 `setMax`\
  \ 和 `setMin` 调用？你可以将它们放在 `findTeamAverageString` 方法体内部，就像我把 Listing 10-1 中将它们放在\
  \ `getAverageString` 方法内部的一样。但将这些方法调用放在 `findTeamAverageString` 方法体内可能会违背让 `decFormat`\
  \ 静态化的初衷。毕竟，程序员可能会多次调用 `findTeamAverageString`，每次都调用 `decFormat.setMaximumIntegerDigits(0)`。但那将是非常浪费的。整个\
  \ `PlayerPlus` 类只有一个 `decFormat` 字段，而该 `decFormat` 字段的 `MaximumIntegerDigits` 值始终为\
  \ 0。不要反复设置 `MaximumIntegerDigits(0)`。\n\n最好的替代方案是将本节糟糕代码中的那些坏行取出来，并将它们放在一个 `static\
  \ initializer`（静态初始化块）中。这样它们就变成了良好代码中的良好代码。（参见 Listing 10-4。）静态初始化块是一个由 `static`\
  \ 关键字引导的块。Java 为整个类执行一次静态初始化块中的语句。这正是你对“静态”一词所想要的。\n\n### 显示团队整体平均值\n\n你可能发现了一种模式。当你为一个类编写代码时，你通常会写两部分代码。一部分代码定义类，另一部分代码使用该类。（使用类的方法包括调用构造函数、引用非私有字段、调用类方法等。）Listing\
  \ 10-4 如之前所示包含了定义 `PlayerPlus` 类的代码，而 Listing 10-5 包含了使用该类的代码。\n\n\n\n\n\n这一节对静态字段和方法大做了铺垫，但静态内容从本书的早期开始已经是图景的一部分了。例如，第\
  \ 3 章 介绍了 `System.out.println`。`System` 名字指的是一个类，而 `out` 是该类中的一个静态字段。这就是为什么在第 4\
  \ 章 及后续章节，我使用 `static` 关键字来导入 `out` 字段：\n\n```\nimport static java.lang.System.out;\n\
  ```\n\n在 Java 中，静态字段和方法随处可见。当它们在别人的代码中声明，而你自己在自己的代码中使用它们时，你几乎不需要担心它们。但当你要声明自己的字段和方法并必须决定是否将它们声明为静态时，你就必须得更仔细地思考了。\n\
  \n![technicalstuff](img/technicalstuff.png) 在书中，我第一次认真使用 `static` 这个词是在早的代码列表 3-1\
  \ 中。我将 `static` 关键字作为每个 `main` 方法的一部分（书的代码列表中有很多 `main` 方法）。那么为什么 `main` 必须是静态的呢？嗯，记住非静态内容属于对象而不是类。如果\
  \ `main` 方法不是静态的，那么在创建对象之前你就无法拥有 `main` 方法。但当你启动 Java 程序时，还没有对象被创建。在 `main` 方法中执行的语句开始创建对象。所以，如果\
  \ `main` 方法不是静态的，你就会陷入一个巨大的鸡生蛋还是蛋问题。\n\n### 可能导致静态；小心处理\n\n当我刚开始写 Java 程序时，我经常梦见某个特定的错误信息。那条信息是\
  \ `non-static variable or method cannot be referenced from a static context`（非静态变量或方法不能从静态上下文中引用）。我如此频繁地看到这条信息，我是如此地困惑，以至于这条信息的记忆已经刻在了我的潜意识里。\n\
  \n现在，我知道为什么我经常收到那个错误信息了。如果我想，我甚至可以让它出现。但每当我在屏幕上看到这条信息时，仍然会感到一丝发毛。\n\n在你理解为什么会出现这条信息以及如何修复问题之前，你需要掌握一些术语。如果一个字段或方法不是静态的，它被称为\
  \ `non-static`（非静态）。（听起来很惊讶，对吧？）鉴于这个术语，至少有两种方法可以让那个令人可怕的信息出现：\n\n*   在程序的某个地方放置\
  \ `Class.nonstaticThing`。\n*   在静态方法内部的某处放置 `nonstaticThing`。\n\n无论哪种情况，你都在给自己找麻烦。你把一个属于对象的东西（非静态内容）放在了一个完全看不见对象的地方。\n\
  \n以我刚才描述的两种情况中的第一种为例。要看到这场灾难发生，请回到代码列表 10-5。在列表的末尾，将 `player.getName()` 改为 `Player.getName()`。这样做就起作用了。`Player.getName`\
  \ 可能意味着什么呢？如果说有意义，表达式 `Player.getName` 意味着“调用属于整个 `Player` 类的 `getName` 方法”。但回看代码列表\
  \ 10-1。`getName` 方法不是静态的。每个 `Player`（或 `PlayerPlus`）类的实例都有一个 `getName` 方法。没有哪一个\
