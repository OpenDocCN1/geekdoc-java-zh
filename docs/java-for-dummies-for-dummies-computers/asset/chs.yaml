  \ 类中。\n\n### 使类型匹配\n\n再次查看 Listing 8-6 的前半部分。特别注意最后一条语句——即实际上为全职员工开支票的那一条。该语句形成了一个漂亮且长的值及其类型的链。你可以通过从内向外读取语句来看到这一点：\n\
