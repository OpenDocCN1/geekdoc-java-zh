  \ Java 和 DSL 的 `Eclipse` 等。为了运行本书的示例，你需要一个较小的 `Eclipse` 包——适用于 Java 开发人员的 `Eclipse`\
  \ IDE。\n\n     `Eclipse` 商业和非商业用途均免费。\n\n   * **IntelliJ IDEA**\n\n     在 Baeldung\
