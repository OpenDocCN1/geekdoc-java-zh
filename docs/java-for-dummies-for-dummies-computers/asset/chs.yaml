  \ 章](#23_9781119235552-ch16.xhtml)中描述了一些常用技术。我甚至在本章中有一个微小的 GUI 示例。（参见后文章节“分子与化合物：引用类型”。）\n\
  \n通过这种枯燥程序与闪亮程序之间的精细平衡，你一定能学会 Java。\n\n## 原子：Java 的原始类型\n\n我在前面的章节中描述的 `int` 和 `double`\
  \ 词是 Java 中“原始类型”（也称为“简单类型”）的示例。Java 语言恰好有八种原始类型。作为 Java 新手，你可以几乎忽略这四种类型以外的所有类型。（在编程语言中，Java\
  \ 这样设计非常紧凑。）表 4-1](#09_9781119235552-ch04.xhtml_c04-tbl-0001) 显示了原始类型的完整列表。\n\n\
  | **类型名称** | **字面量样式** | **取值范围** |\n| --- | --- | --- |\n| *整数类型* |  | |\n| byte\
  \ | (byte)42 | –128 to 127 |\n| short | (short)42 | –32768 to 32767 |\n| int | 42\
  \ | –2147483648 to 2147483647 |\n\n\n\n\n\n| long | 42L | –9223372036854775808 to\
  \ 9223372036854775807 |\n| *十数字类型* | | | |\n| float | 42.0F | –3.4 × 10³⁸ to 3.4\
  \ × 10³⁸ |\n| double | 42.0 | –1.8 × 10³⁰⁸ to 1.8 × 10³⁰⁸ |\n| *字符类型* | | | |\n\
  | char | 'A' | 数千个字符、字形和符号 |\n| *逻辑类型* | | | |\n| boolean | true | true, false |\n\
  \n表 4-1 Java 的基本类型\n\n你不应该忽略的类型是 `int`、`double`、`char` 和 `boolean`。本章之前的章节涵盖了 `int`\
  \ 和 `double` 类型。因此，接下来的两个章节将涵盖 `char` 和 `boolean` 类型。\n\n### char 类型\n\n几十年前，人们认为计算机的存在仅仅是为了进行大数字计算。现在，没有人那样想过了。所以，如果你在过去的\
  \ 20 年里没有待在冷冻室，你就知道计算机可以存储字母、标点符号和其他字符。\n\n用于存储字符的 Java 类型称为 `char`。代码列表 4-4 有一个使用\
  \ `char` 类型的简单程序。图 4-8 显示了代码列表 4-4 中程序的输出。\n\n![image](img/9781119235552-fg0408.png)\n\
  \n图 4-8: 代码列表 4-4 中程序在 Eclipse 控制台视图中的精彩运行。\n\n代码列表 4-4: 使用 char 类型\n\n```java\n\
  public class CharDemo {\n    public static void main(String args[]) {\n        char\
  \ myLittleChar = 'b';\n        char myBigChar = Character.toUpperCase(myLittleChar);\n\
  \        System.out.println(myBigChar);\n    }\n}\n```\n\n在代码列表 4-4 中，第一次初始化将字母\
  \ `b` 存储在变量 `myLittleChar` 中。在初始化时，注意 `b` 是如何被单引号括起来。在 Java 中，每个 `char` 字面量都以单引号开头和结尾。\n\
  \n![remember](img/remember.png) 在 Java 程序中，单引号括着 `char` 字面量中的字母。\n\n如果你需要帮助理清 `assignment`（赋值）、`declaration`（声明）和\
  \ `initialization`（初始化）术语，请参本章前面的 “合并声明和初始化变量”章节。\n\n在代码列表 4-4 的第二次初始化中，程序调用了一个名为\
  \ `Character.toUpperCase` 的 API 方法。`Character.toUpperCase` 方法正如其名称所示——该方法产生字母 `b`\
  \ 的大写等效形式。这个大写等效形式（字母 `B`）被赋值给变量 `myBigChar`，并且 `myBigChar` 中的 `B` 打印在屏幕上。\n\n![crossreference](img/crossreference.png)\
  \ 关于 Java 应用程序编程接口（API）的介绍，请参见第 3 章。\n\n如果你想写以下语句，\n\n```java\nchar myLittleChars\
  \ = 'barry'; //不要这样做\n```\n\n请抵抗这种诱惑。你不能在 `char` 变量中同时存储多个字母，也不能在一对单引号之间放入多个字母。如果你试图存储单词或句子（而不仅仅是单个字母），你需要使用称为\
  \ `String` 的东西。\n\n关于 Java 的 `String` 类型，请查看本章后面的 “分子与化合物：引用类型”章节。\n\n![warning](img/warning.png)\
  \ 如果你习惯用其他语言编写程序，你可能了解过所谓的 ASCII 字符编码。大多数语言使用 ASCII；Java 使用 Unicode。在旧的 ASCII 表示中，每个字符只占用\
  \ 8 位，但在 Unicode 中，每个字符占用 8、16 或 32 位。ASCII 存储罗马（英语）字母表中的字母，而 Unicode 有空间容纳世界上大多数常用语言的字符。唯一的问题是，某些\
  \ Java API 方法专门针对 16 位 Unicode 设计。偶尔，这会让你产生麻烦（这取决于具体情况）。如果你使用一个方法在屏幕上写 Hello，结果显示的是\
  \ `H e l l o`，请检查该方法的文档是否提到了 Unicode 字符。\n\n值得注意的是，`Character.toUpperCase` 和 `System.out.println`\
  \ 这两个方法在代码列表 4-4 中的用法完全不同。`Character.toUpperCase` 是作为初始化的一部分调用的，而 `System.out.println`\
  \ 是独立独立。\n\n### boolean 类型\n\n`boolean` 类型变量存储两个值：`true` 和 `false`。`boolean` 类型用于逻辑表达式。\n\
  \n表 4-1 Java 的基本类型\n\n你不应该忽略的类型是 `int`、`double`、`char` 和 `boolean`。本章之前的章节涵盖了 `int`\
  \ 和 `double` 类型。因此，接下来的两个章节将涵盖 `char` 和 `boolean` 类型。\n\n\n\n\n通过将简单的元素组合，你可以得到更复杂的东西。事物总是如此发展的。以\
  \ Java 的一些基本类型为例，将它们混合成一锅“基本类型汤”，你会得到什么？一个名为`reference type`（引用类型）的复杂类型。\n\n列表 4-6\
  \ 中的程序使用了引用类型。图 4-10 向你展示了运行列表 4-6 中的程序时发生了什么。\n\n![image](img/9781119235552-fg0410.png)\n\
  \n图 4-10: 一个空框架。\n\n列表 4-6: 使用引用类型\n\n```java\nimport javax.swing.JFrame;\n\npublic\
  \ class ShowAFrame {\n    public static void main(String args[]) {\n        JFrame\
  \ myFrame = new JFrame();\n        String myTitle = \"Blank Frame\";\n        myFrame.setTitle(myTitle);\n\
  \        myFrame.setSize(300, 200);\n        myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        myFrame.setVisible(true);\n    }\n}\n```\n\n列表 4-6 中的程序使用了两种引用类型。这两种类型都定义在\
