  \ 类的代码内部，任何对 `number` 和 `scale` 字段的直接引用都会产生错误信息。确实，每个 `TemperatureNice` 对象都有自己的\
  \ `number` 和 `scale` 字段。（毕竟，`TemperatureNice` 是 `Temperature` 类的子类，而 `Temperature`\
  \ 类代码定义了 `number` 和 `scale` 字段。）但因为 `number` 和 `scale` 在 `Temperature` 类中被声明为 `private`，所以只有\
  \ `Temperature` 类内部的代码才能直接使用这些字段。\n\n![warning](img/warning.png) 不要在此 `TemperatureNice`\
  \ 类的代码中对 `number` 和 `scale` 字段进行额外的声明。如果你这样做，就会无意中创建了四个不同的变量（两个名为 `number`，两个名为\
  \ `scale`）。你会为其中一对变量赋值。然后你会惊讶地发现，当你显示另一对变量时，那些值似乎消失了。\n\n![remember](img/remember.png)\
  \ 当对象的代码包含对对象自身某个方法的调用时，你不需要在调用前加点号。例如，在代码列表 9-5 的最后语句中，对象调用了自己的自己的方法 `getNumber()`\
  \ 和 `getScale()`，而不是使用 `someObject.getNumber()` 和 `somethingOrOther.getScale()`。如果省略点号让你感到不舒服，你可以利用\
  \ `this` 关键字的另一个用途来弥补：只需在代码列表 9-5 的最后一行写成 `this.getNumber()` 和 `this.getScale()`\
  \ 即可。\n\n### 子类的构造函数\n\n到为止，代码列表 9-5 中最大的新闻是代码声明构造函数的方式。`TemperatureNice` 类有四个自己的构造函数。如果你已经在考虑子类继承，可能会疑惑为什么这些构造函数声明是必要的。`TemperatureNice`\
  \ 不是继承了父类 `Temperature` 类的构造函数吗？不，子类不继承构造函数。\n\n![remember](img/remember.png) 子类不继承构造函数。\n\
  \n没错。子类不继承构造函数。在一种特殊情况下，构造函数看起来像是被继承了，但那种情况只是偶然，不是常态。通常，当你定义一个子类时，你会声明新的构造函数来配合该子类。\n\
  \n我将在本章稍后描述这种特殊情况（构造函数看起来像被继承），即“默认构造函数”部分。\n\n因此，代码列表 9-5 中的代码有四个构造函数。每个构造函数的名称都是\
  \ `TemperatureNice`，且每个构造函数都有自己独特的标识参数列表。这是无趣的部分。有趣的部分是，每个构造函数都调用了名为 `super` 的内容，这是一个\
  \ Java 关键字。在代码列表 9-5 中，`super` 代表父类中的构造函数：\n\n*   代码列表 9-5 中的语句 `super()` 调用了代码列表\
  \ 9-2 中的无参数 `Temperature()` 构造函数。该无参数构造函数将 `0.0` 赋值给 `number` 字段，并将 `TempScale.FAHHEIT`\
  \ 赋值给 `scale` 字段。\n*   代码列表 9-5 中的语句 `super(number, scale)` 调用了代码列表 9-2 中的 `Temperature(double\
  \ number, TempScale scale)` 构造函数。该该构造函数为 `number` 和 `scale` 字段赋值。\n*   以类似的方式，代码列表\
  \ 9-5 中的语句 `super(number)` 和 `super(scale)` 调用了代码列表 9-2 中的构造函数。\n\n计算机通过查看 `super`\
  \ 后面的列表来决定调用 `Temperature` 类的哪个构造函数。例如，当在代码列表 9-5 中执行 `super(number, scale)` 时，计算机对自己说：“`number`\
  \ 和 `scale` 的类型是 `double` 和 `TempScale`。”但代码列表 9-2 中的 `Temperature` 构造函数只有一个。该构造函数的头部看起来是这样的：\n\
  \n### 使用这些功能\n\n在代码列表 9-5 中，我定义了 `TemperatureNice` 类的。现在是让这个 `TemperatureNice` 类派上用场了。代码列表\
  \ 9-6 使用了 `TemperatureNice`。\n\n代码列表 9-6： 使用 TemperatureNice 类\n\n```java\npublic\
  \ class UseTemperature {\n    public static void main(String args[]) {\n       \
  \ TemperatureNice temp = new TemperatureNice();\n        temp.setNumber(70.0);\n\
  \        temp.setScale(TempScale.FAHHEIT);\n        temp.display();\n        temp\
  \ = new TemperatureNice(32.0);\n        temp.display();\n        temp = new TemperatureNice(TempScale.CELSIUS);\n\
  \        temp.display();\n        temp = new TemperatureNice(2.73, TempScale.KELVIN);\n\
  \        temp.display();\n    }\n}\n```\n\n代码列表 9-6 中的代码与它的代码列表 9-3 相似。主要区别在于：\n\
  \n*   代码列表 9-6 创建了 `TemperatureNice` 类的实例。也就是说，代码列表 9-6 调用的是 `TemperatureNice` 类的构造函数，而不是\
  \ `Temperature` 类的构造函数。\n*   代码列表 9-6 利用了 `TemperatureNice` 类的 `display` 方法。因此，代码列表\
  \ 9-6 中的代码比它的代码列表 9-3 要洁得多。\n\n代码列表 9-6 的运行结果与代码列表 9-3 完全一样——只是以更优雅的方式到达终点。（运行结果之前已在[图\
  \ 9-1](#15_9781119235552-ch09.xhtml_c09-fig-0001）中显示。）\n\n\n\n\n上一节的核心信息是：子类不会继承构造函数。那么第\
  \ 8 章中的所有列表是怎么回事呢？在列表 8-6 中，有一条语句：\n\n```java\nFullTimeEmployee ftEmployee = new\
  \ FullTimeEmployee();\n```\n\n但是，问题在于：定义 `FullTimeEmployee` 的代码（参考列表 8-3）内部似乎没有声明任何构造函数。那么，在列表\
  \ 8-6 中，你如何调用 `FullTimeEmployee` 构造函数呢？\n\n情况是这样的：当你创建一个子类而不在代码中编写任何显式的构造函数声明时，Java\
  \ 会为你创建一个构造函数。它被称为`默认构造函数`（default constructor）。如果你创建一个公有的 `FullTimeEmployee` 子类，默认构造函数的形式就像列表\
  \ 9-7 所示。\n\n列表 9-7： 默认构造函数\n\n```java\npublic FullTimeEmployee() {\n  super();\n\
  }\n```\n\n列表 9-7 中的构造函数不接受任何参数，它的唯一语句是调用你所扩展的那个类的构造函数。（如果你扩展的类没有无参数的构造函数，那你就倒霉了。）\n\
  \n你刚刚读了关于默认构造函数的知识，但请注意！注意这段关于默认构造函数的讨论中*没有*提到的一点：它并没有说你总是能获得默认构造函数。特别是，如果你创建一个子类并自己定义了任何构造函数，Java\
  \ 就不会为该子类添加默认构造函数（而且子类也不会继承任何构造函数）。\n\n那么这会如何让你困惑呢？列表 9-8 包含了来自列表 8-3 的的副本，但其中添加了一个构造函数。看下这个修改后的\
  \ `FullTimeEmployee` 代码。\n\n列表 9-8： 看，我有一个构造函数！\n\n```java\npublic class FullTimeEmployee\
  \ extends Employee {\n  private double weeklySalary;\n  private double benefitDeduction;\n\
  \n  public FullTimeEmployee(double weeklySalary) {\n    this.weeklySalary = weeklySalary;\n\
  \  }\n\n  public void setWeeklySalary(double weeklySalaryIn) {\n    weeklySalary\
  \ = weeklySalaryIn;\n  }\n\n  public double getWeeklySalary() {\n    return weeklySalary;\n\
  \  }\n\n  public void setBenefitDeduction(double benefitDedIn) {\n    benefitDeduction\
  \ = benefitDedIn;\n  }\n\n  public double getBenefitDeduction() {\n    return benefitDeduction;\n\
  \  }\n\n  public double findPaymentAmount() {\n    return weeklySalary - benefitDeduction;\n\
  \  }\n}\n```\n\n如果你在列表 9-8 中使用 `FullTimeEmployee` 代码，类似如下的行将无法工作：\n\n```java\nFullTimeEmployee\
  \ ftEmployee = new FullTimeEmployee();\n```\n\n它之所以不起作用，是因为你声明了一个接受一个 `double` 参数的\
  \ `FullTimeEmployee` 构造函数，你就不再免费获得默认的无参数构造函数了。\n\n你该怎么办？如果你声明了任何构造函数，就声明你可能需要的所有构造函数。将列表\
  \ 9-7 中的构造函数取出，并添加到列表 9-8 的代码中。然后 `new FullTimeEmployee()` 的调用就能再次工作了。\n\n![ontheweb](img/ontheweb.png)\
  \ 在某些情况下，Java 会在构造函数体的顶部自动添加一个对父类构造函数的隐藏调用。这种 `super` 调用的自动添加是一个微妙的操作，并不经常出现，因此当它出现时，看起来可能看起来非常神秘。更多信息，请参阅本书的网站。\n\
  \n\n\n\n![crossreference](img/crossreference.png) 要查找我的 `DummiesFrame` 示例，请参阅第 7\
  \ 章。\n\n列表 9-9 中的代码包含许多你可能并不熟悉的名称 —— 这些是来自 Java API 的名称。当我刚开始接触 Java 时，我愚蠢地认为学习\
  \ Java 意味着记住所有这些名称。恰恰相反：这些名称只是随身行李。真正的 `Java` 是该语言实现面向对象概念的方式。\n\n无论如何，列表 9-10 中的\
  \ `main` 方法只有一条语句：对 `SimpleFrame` 类构造函数的调用。注意看该调用创建的对象甚至没有赋值给变量。这没关系，因为代码在其他地方不需要引用该对象。\n\
  \n在 `SimpleFrame` 类中，只有一个构造函数声明。这个构造函数不仅仅是设置变量的值，它调用了 Java API 中的一个接一个方法。\n\n在 `SimpleFrame`\
  \ 类构造函数中调用的所有方法都来自父类 `JFrame`。`JFrame` 类位于 `javax.swing` 包中。这个包和另一个包 `java.awt`\
  \ 包含了类，这些类可以帮助你在计算机屏幕上放置窗口、图像、图形和其他组件。（在 `java.awt` 包中，字母 *awt* 代表 *a*bstract（抽象）*w*indowing（窗口）*t*oolkit（工具包））\n\
  \n关于 Java 包概念的小八卦，请查看旁边的侧边栏“包和导入声明”。关于更多关于 `Java` 包概念的讨论，请参阅第 14 章。\n\n![remember](img/remember.png)\
  \ 在 Java API 中，人们通常所说的*窗口*是 `javax.swing.JFrame` 类的实例。\n\n### 来自 Java API 的类和方法\n\
  \n查看图 9-3，你可能已经看出 `SimpleFrame` 类的实例并没有做很多事情。框架上只有一个按钮，当你点击该按钮时，什么都不会发生。我以这种方式制作框架是为了防止示例变得过于复杂。尽管如此，列表\
  \ 9-9 中的代码仍使用了多个 API 类和方法。`setTitle`、`setLayout`、`setDefaultCloseOperation`、`add`、`setSize`\
  \ 和 `setVisible` 方法都属于 `javax.swing.JFrame` 类。以下是代码使用的名称列表：\n\n*   `setTitle`：调用\
  \ `setTitle` 将文字放入框架的标题栏中。（新的 `SimpleFrame` 对象正在调用它自己的 `setTitle` 方法。）\n*   `FlowLayout`：`FlowLayout`\
  \ 类的实例以居中的、打字机方式在框架上对齐对象。由于图 9-3 中的框架上只有一个按钮，该按钮将居于框架顶部附近。如果框架上有八个按钮，其中五个可能会在框架顶部排成一行，其余三个将沿第二行居中对齐。\n\
  *   `setLayout`：调用 `setLayout` 让新的 `FlowLayout` 对象负责安排框架上的组件，如按钮。（新的 `SimpleFrame`\
  \ 对象正在调用它自己的 `setLayout` 方法。）\n*   `setDefaultCloseOperation`：调用 `setDefaultCloseOperation`\
  \ 告诉 Java 当你点击框架右上角的小 × 时该做什么。（在 Mac 上，你点击框架左上角的小红圆圈。）如果没有这个方法调用，框架本身会消失，但 Java\
  \ 虚拟机 (JVM) 仍会保持运行。要停止你程序的运行，你必须再执行一个步骤。（$注：你可能需要在 `Eclipse`、`IntelliJ IDEA` 或 `NetBeans`\
  \ 中查找 `Terminate` 选项。）\n    调用 `setDefaultCloseOperation(EXIT_ON_CLOSE)` 告诉 Java\
  \ 当你点击框架右上角的 × 时关闭自身。`EXIT_ON_CLOSE` 的替代方案有 `HIDE_ON_CLOSE`、`DISPOSE_ON_CLOSE` 以及我个人喜欢的\
  \ `DO_NOTHING_ON_CLOSE`。当你的程序在用户关闭框架后还有更多工作要完成时，请使用这些替代方案之一。\n*   `JButton`：`JButton`\
  \ 类位于 `javax.swing` 包中。该类的构造函数之一接受一个 `String` 实例（例如 \"Panic\"）作为参数。调用此构造函数会将该 `String`\
  \ 实例变成新按钮正面的标签。\n*   `add`：新的 `SimpleFrame` 对象调用了它的 `add` 方法。调用 `add` 方法将按钮放置在对象的表面上（在本例中为框架的表面）。\n\
  *   `setSize`：框架变为 300 像素宽、100 像素高。（在 `javax.swing` 包中，每当你指定两个维度数字时，宽度始终在前。）\n*\
  \   `setVisible`：当它被创建时，框架是不可见的。但当你调用 `setVisible(true)` 时，框架就会出现。\n\n### Suppress\
  \ 注解\n\n第 8 章 引入了 `SuppressWarnings` 注解。在本章的列表 9-9 中，`SuppressWarnings(\"serial\"\
  )` 一行告诉 Java 不要提醒你缺失序列化字段。换句话说，`SuppressWarnings(\"serial\")` 告诉 Java 不要显示类似序列化字段的警告。图\
  \ 9-4 没有 `SuppressWarnings` 注解，Java 会就缺失序列化字段向你警告。“而且，”你问，“什么是序列化字段？”这与扩展 `JFrame`\
  \ 有关 —— 一些你不在乎的事情。所以大胆一点吧！只需抑制警告（使用列表 9-9 中的注解），就不用担心序列化字段。\n\n*   ![tryout](img/tryout.png)\
