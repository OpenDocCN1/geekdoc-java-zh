  \ `com` 的目录内。关于包的更多信息，请参见第 9 章和第 14 章。\n\n\n\n\n\n![technicalstuff](img/technicalstuff.png)\
  \ 为了保持简单，我在你从本书的网站下载的 `07-10` 文件夹中包含了 `DummiesFrame.java` 文件。但说真的，这是将我自己的代码添加到你的项目中的最佳方式吗？在第\
