  \n第 5 章\n\n# 使用决策语句控制程序流\n\n## 本章内容\n\n- ![check](img/check.png) **编写在备选项之间选择的语句**\n\
  - ![check](img/check.png) **构建逻辑条件**\n- ![check](img/check.png) **将语句嵌套**\n- ![check](img/check.png)\
  \ **在许多备选项中选择**\n\n电视节目《捣蛋丹尼》（Dennis the Menace）曾于 1959 年到 1963 年在 CBS 播出。我记得其中一集，威尔逊先生（Mr.\
  \ Wilson）在做一项重要决定时遇到困难。我想那是关于换工作或搬到新镇的事。总之，我仍然能看到那个镜头：威尔逊先生坐在自家院子里，喝着柠檬水，整个下午都在呆目发呆。当然，那个讨厌人的角色丹尼不断打扰威尔逊先生的清静。这正是让这个情况变得幽默的原因。\n\
  \n令我对这一集印象深刻的是（这也是我至今仍能清晰记得它的原因）是威尔逊先生在做决定时坚定的意。这家哥们并没有忙于日常事务，在社区里闲逛时让决定的想法在脑海中进来出出。他静静地坐在院子里，在心理负债表上仔细且有逻辑地做标记。到底有多少人是这样做决定的？\n\
  \n那时，我还很年轻。我从未面对过做出影响我和家人的重大决定的责任。但我好奇这样的决策过程会是怎样的。像树桩一样坐上几个小时会有帮助吗？我会通过仔细权衡和统计选项来做决定吗？还是我会盲目行、冒险并凭冲动行动？只有时间才能证明。\n\
  \n## 制作 if 语句\n\n当你编写程序时，你不断地遇到十字路口。用户输入密码了吗？如果是，让用户工作；如果不是，将其踢出去。语言需要一种方法：它被称为\
  \ `if` 语句。\n\nListing 4-8 展示了 Java 赋值运算符的通用性。你可以将赋值运算符作为更大 Java 语句的一部分。在 Listing\
  \ 4-8 的倒数第二行中，运算符从 `numberOfBunnies` 中减去 `7`，将 `numberOfBunnies` 的值从 `172` 减少到 `165`。然后整个赋值操作被放入\
  \ `System.out.println` 调用中，因此 `165` 显示在屏幕上。\n\n（注：由于原文中存在大量重复，译文已按要求去重并保留核心逻辑内容。）\n\
  \n```java\nSystem.out.println(numberOfBunnies -= 7);\nSystem.out.println(numberOfBunnies\
  \ = 100);\n}\n}\n```\n\n\n\n\n- 当你导入 `java.util.Scanner` 时，不需要使用 `static` 关键字。\n\
  \n但导入 `Scanner` 与导入 `System.out` 不同。当你导入 `java.lang.System.out` 时，需要使用 `static`\
  \ 关键字。（参考 Listing 5-1）。差异之所以出现在代码中，是因为 `Scanner` 是一个类的名称，而 `System.out` 并不是类名。\n\
  \n![crossreference](img/crossreference.png) 想要快速查看导入声明中 `static` 关键字用法，请参阅第 4 章](#09_9781119235552-ch04.xhtml)中关于导入声明的侧边：丑陋的真相。关于\
  \ `*` 符号的更完整介绍，请参阅第 10 章](#17_9781119235552-ch10.xhtml)。\n\n- 通常情况下（在桌面式或笔记本电脑上），名称\
  \ `System.in` 代表键盘。\n\n要从键盘以外的其他地方获取字符，可以在括号内输入 `System.in` 以外的内容。\n\n![crossreference](img/crossreference.png)\
  \ 在 `new Scanner(…)` 括号内还可以放什么？想要获取一些建议，请参阅第 8 章](#14_9781119235552-ch08.xhtml)。\n\
  \n在 Listing 5-1 中，我随机决定将其中一个变量命名为 `keyboard`。`keyboard` 这个名字提醒读者，该变量指的是你电脑前的一堆塑料按钮。将某个东西命名为\
  \ `keyboard` 并不会告诉 Java 任何关于塑料按钮或用户输入的信息。另一方面，`System.in` 这个名字总是告诉 Java 关于那些塑料按钮的信息。Listing\
  \ 5-1 中的代码 `Scanner keyboard = new Scanner(System.in)` 将名称 `keyboard` 与我们都熟悉并喜爱的塑料按钮连接了起来。\n\
  \n- 当预期用户输入一个 `int` 值（某种整数）时，请使用 `nextInt()`。\n\n如果你预期用户输入一个 `double` 值（包含小数点的数字），请使用\
  \ `nextDouble()`。如果你预期用户输入 `true` 或 `false`，请使用 `nextBoolean()`。如果你预期用户输入像 `Barry`、`Java`\
  \ 或 `Hello` 单词，请使用 `next()`。\n\n![warning](img/warning.png) 小数点在不同国家之间不同。在美国，`10.5`（使用点）表示十点半；但在法国，`10,5`（使用逗号）表示十点半。在波斯语中，小数点看起来像斜杠（但位置比数字字符低一点）。你的电脑操作系统存储了关于你所在国家的信息，Java\
  \ 会读取这些信息来决定十点半的写法。如果你运行一个包含 `nextDouble()` 方法调用的程序，且 Java 响应为 `InputMismatchException`，请检查你的输入。你可能在你的国家要求\
  \ `10,5`（或表示十点半的其他方式）时输入了 `10.5`。更多信息，请参阅第 8 章](#14_9781119235552-ch08.xhtml)中的侧边““你住在地球的哪里？](#14_9781119235552-ch08.xhtml_c08-fea-0003)”。\n\
