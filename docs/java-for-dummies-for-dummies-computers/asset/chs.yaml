  \ Q. Public | 111 Consumer Street | 55.63 | out.print … |\n\n表 7-2 面向对象的方法\n\n###\
  \ 一个能够自显示的账户\n\n在表 7-2 中，每个账户对象都有四个东西——一个名称、一个地址、一个余额以及在屏幕上显示自己的方式。当你转向面向对象的思维后，你将永远不会回头。代码列表\
