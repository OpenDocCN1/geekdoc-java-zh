  \ `FoodProduct` 实例并显示这些实例的信息。\n\n## 在类中定义方法（显示账户）\n\n想象一个包含两个账户信息的表格。（如果你很难想象这样的东西，就看表\
  \ 7-1。）\n\n| Name (姓名) | Address (地址) | Balance (余额) |\n| --- | --- | --- |\n| Barry\
  \ Burd | 222 Cyberspace Lane | 24.02 |\n| Jane Q. Public | 111 Consumer Street |\
  \ 55.63 |\n\n表 7-1 无面向对象编程之前\n\n在表 7-1 中，每个账户有三个东西——一个名称、一个地址和一个余额。在面向对象编程出现之前就是这样做。但面向对象编程涉及到思维的巨大转变。通过面向对象编程，每个账户都可以拥有一个名称、一个地址、一个余额以及一种显示方式。\n\
  \n在面向对象编程中，每个对象都有自己的内置功能。账户知道如何显示自己。字符串可以告诉你它内部的字符是否与另一个字符串内部相同。一个 `PrintStream`\
  \ 实例（例如 `System.out`）知道如何执行 `println`。在面向对象编程中，每个对象都有自己的方法。这些方法是小小的子程序，你可以调用它们来让对象为自己（或对自己）做事情。\n\
  \n为什么这是一个好主意呢？之所以好，是因为你让数据片段为自己负责。通过面向对象编程，所有与账户相关的功能都收集在 `Account` 类的代码中。关于字符串你所需要知道的一切信息都位于\
  \ `String.java` 文件中。任何与年份有关的内容（例如，是两位还是四位数字）都是在 `Year` 类内部处理的。因此，如果任何人对你的 `Account`\
  \ 类或 `Year` 类有任何问题，他或她知道该去哪里寻找所有的代码。这太棒了！\n\n想象一个增强后的账户表。在新表格中，每个对象都有内置功能。每个账户都知道如何在屏幕上显示自己。表格的每一行都有自己的显示方法副本。当然，你不需要太多的想象就能看出这个表格。我恰好有一个你可以查看的表格。它是表\
