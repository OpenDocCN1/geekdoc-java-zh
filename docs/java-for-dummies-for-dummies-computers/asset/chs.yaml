  \ 傻瓜万岁!(Vive les nuls!)\n\n《For Dummies》系列书的法语译名为 *Pour les Nuls.*。所以英语中的“dummy”在法语里是“nul”。但在\
  \ Java 中，`null` 一词的意思是“无”。当你看到\n\n```\nif (username != null)\n```\n\n在列表 5-4 中，你可以想象你看到的是\n\
  \n```java\nif (username isn't nothing)\n```\n\n或者\n\n```\nif (username has any value\
  \ at all)\n```\n\n要找出 `username` 如何可能没有值，请参见图 5-5 中的最后一行。当你在第一个对话框中点击取消时，计算机会将 `null`\
  \ 传递给你的程序。因此，在列表 5-4 中，变量 `username` 变成了 `null`。比较 `username != null` 检查是为了确保你没有在程序的第一个对话框中点击取消。比较\
  \ `password != null` 对程序的第二个对话框执行同样的检查。当你在列表 5-4 中看到 `if` 语句时，你可以想象你看到的是如下：\n\n\
  ```java\nif (you didn't press Cancel in the username dialog &&\n    you didn't press\
  \ Cancel in the password dialog &&\n    ((you typed bburd in the username dialog\
  \ &&\n      you typed swordfish in the password dialog) ||\n     (you typed hritter\
  \ in the username dialog &&\n      you typed preakston in the password dialog)))\n\
  ```\n\n![warning](img/warning.png) 在列表 5-4 中，比较 `username != null` 和 `password !=\
  \ null` 不是可的的。如果你忘记包含这些内容并在程序运行时点击取消，你将得到一个糟糕的 `NullPointerException` 消息，程序会在你眼皮底下直接崩溃。`null`\
  \ 一词代表“无”，在 Java 中，你不能将“无”与像“bburd”或“swordfish”这样的字符串进行比较。在列表 5-4 中，比较 `username\
  \ != null` 的目的是防止 Java 在你不小心点击取消时去检查 `username.equals(\"bburd\")`。如果没有这个初步的 `username\
  \ != null` 测试，你就是在自找麻烦。\n\n![technicalstuff](img/technicalstuff.png) 在列表 5-4 中的最后两个\
  \ `null` 与其他的不同。在代码 `JOptionPane.showMessageDialog(null, \"You're in.\")` 中，`null`\
  \ 代表“没有其他对话框”。特别是，调用 `showMessageDialog` 告诉 Java 弹出一个新的对话框，而 `null` 表示新对话框不会增长。在列表\
  \ 5-4 中，`null` 代表“没有其他对话框”。\n\n### 括号中的条件\n\n当使用逻辑运算符组合条件时，使用括号比由于使用过少而导致结果出错要好。例如，`if`\
  \ 语句的条件有十多个。在英语中，你可能会说“我们会有十个左右”。但在 Java 中，如果你写成下面这样，就会得到错误：\n\n```java\nif (username\
  \ != null && password != null &&\n    username.equals(\"bburd\") && password.equals(\"\
  swordfish\") ||\n    username.equals(\"hritter\") && password.equals(\"preakston\"\
  ))\n```\n\n通过使用 `||` 运算符，你可能会在 `&&` 运算符之前解析结果。在列表 5-4 中，`||` 运算符的优先级低于 `&&`，所以你需要对\
  \ `&&` 条件进行分组：\n\n```java\nif (username != null && password != null &&\n    (username.equals(\"\
  bburd\") && password.equals(\"swordfish\")) ||\n    (username.equals(\"hritter\"\
  ) && password.equals(\"preakston\")))\n```\n\n等等，`||` 运算符的优先级低于 `&&`。在列表 5-4 中...\n\
  \n\n\n\n\n这与之前的实验几乎相同。唯一的区别在于在两个 `== null` 测试之间使用了 `&&` 而不是 `||`。\n\n程序还能正常工作吗？为什么能呢，或者为什么不能呢？\n\
