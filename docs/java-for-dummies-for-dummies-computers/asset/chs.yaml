  \ value) {\n        this.value = value;\n    }\n}\n```\n\n## 变量实验\n\n在我大学期间的一个夏天，我坐在门廊上，无所事事地和一位刚认识的人聊天。我记得她的名字叫\
  \ Janine。“你来自哪里？”我问。“火星，”她回答。她停下来看我是否会问后续的问题。\n\n事实证明，Janine 来自宾夕法尼亚州的火星。好吧，我的观点是什么？观点是，名字的含义取决于上下文。\n\
  \n\n\n\n\n当然，住在宾夕法尼亚州马星市（Mars）的人非常清楚他们小镇的名字很奇特。对马星高中青少年时光的美好回忆并不会阻止人们对那颗红色行星的认知。在八月一个晴朗的夜晚，你仍然可以和当地居民进行如下对话：\n\
  \n- *你*：我该如何去马星？\n- *当地居民*：你就在马星啊，哥们儿。你想找马星的哪个特定区域？\n- *你*：不，我指不是宾夕法尼亚州的马星。我说的是火星行星。\n\
  - *当地居民*：哦，行星啊！那，坐 8:19 发往卡纳纳维拉尔的火车……不，等一下——那是当地火车。那会带你穿过弗吉尼亚州……\n\n所以，一个名字的含义取决于你使用这个名字的地方。虽然大多数英语国家的人认为火星是一个拥有二氧化碳大气层的地方，但宾夕法尼亚州的一些人想到的却是可以在马星市进行的所有购物。而那些宾夕法尼亚州的人对\
  \ `Mars` 这个名字确实有两个含义。在 Java 中，这些名字可能像这样：`Mars` 和 `planets.Mars`。\n\n### 将变量置于其位置\n\
