  \n创建一个新对象可能涉及各种任务，因此在本章中，你将创建构造函数。构造函数告诉计算机执行新对象的启动任务。\n\n### 什么是温度？\n\n“早上好，欢迎来自《对象新闻》。您所在地区的当地温度是宜人的\
  \ 73 华氏度。”\n\n每个温度由两个部分组成：一个数字和一个温度单位。数字只是一个 `double` 值，例如 `32.0` 或 `70.52`。但什么是温度单位呢？它是一串字符吗，比如“华氏”或“摄氏”？并不完全，因为某些字符串并不是温度单位。并没有所谓的“Quelploof”温度单位，一个可以显示温度为“73\
  \ Quelploof”的程序是一个糟糕的程序。那么，你如何将温度单位限制在人们使用的少数几种单位上呢？一种方法是使用 Java 的 `enum` 类型。\n\n\
