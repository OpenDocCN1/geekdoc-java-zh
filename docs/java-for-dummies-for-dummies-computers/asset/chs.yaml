  ```java\namountInAccount = 50.22;\namountInAccount = amountInAccount + 1000000.00;\n\
  ```\n\n\n\n\n![tip](img/tip.png) 从 Java 7 开始，你可以在数字字面量中添加下划线。与其在 Listing 4-1 中使用普通的\
  \ `1000000.00`，你可以写 `amountInAccount = amountInAccount + 1_000_000.00`。遗憾的是，你无法轻松实现你最想做的事。你不能写\
  \ `1,000,000.00`（就像在美国那样写），也不能写 `1.000.000,00`（就像在德国那样写）。如果你想在程序的输出中显示像 `1,000,000.00`\
  \ 这样的数字，必须使用一些花哨的格式技巧。有关格式化的更多信息，请查看第 10 章和第 11 章。\n\n### 赋值语句\n\n像 Listing 4-1\
  \ 中的这类语句被称为`赋值语句`（assignment statements）。在赋值语句中，你为某个东西分配值。在很多情况下，这个东西是一个变量。\n\n\
  我建议养成从右到左阅读赋值语句的习惯。图 4-2 说明了 Listing 4-1 中第一行的动作。\n\n![image](img/9781119235552-fg0402.png)\n\
  \nFIGURE 4-2: Listing 4-1 中第一行的动作。\n\nListing 4-1 中的第二行稍微复杂一点。图 4-3 说明了 Listing\
  \ 4-1 中第二行的动作。\n\n![image](img/9781119235552-fg0403.png)\n\nFIGURE 4-3: Listing\
  \ 4-1 中第二行的动作。\n\n![remember](img/remember.png) 在赋值语句中，被赋值的东西始终位于等号的左侧。\n\n### 变量可能拥有的值类型\n\
  \n你是否见过那些电视广告，让你觉得自己正飞梭在计算机内部的电路之间？很酷，对吧？这些广告展示了 0（零）和 1（一）在穿行，因为 0 和 1 是计算机唯一能处理的东西。当你认为计算机正在存储字母\
  \ `J` 时，计算机实际上在存储 `01001010`。计算机内部的一切都是 0 和 1 的序列。正如每一台计算机所知的，一个 0 或 1 被称为 `bit`（位）。\n\
  \n事实上，代表字母 `J` 的序列 `01001010` 也可以代表数字 `7.496608360046 × 10^-4`。事实上，如果将位解释为屏幕像素，那么同一个序列可以表示图\
  \ 4-4 中所示的点。`01001010` 的含义取决于软件解释这一 0 和 1 序列的方式。\n\n![image](img/9781119235552-fg0404.png)\n\
  \nFIGURE 4-4: 八个黑白像素的极特写。\n\n你如何告诉计算机 01001010 代表什么？答案在 `type`（类型）的概念中。变量的 `type`\
