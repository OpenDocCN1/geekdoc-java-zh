  一个`String`是一系列字符。它就像连续排列的几个`char`值。因此，当声明变量`myTitle`的类型为`String`时，将`\"Blank Frame\"\
  `赋值给变量`myTitle`在列表 4-6 中是有意义的。`String`类定义在 Java API 中。\n\n![remember](img/remember.png)\
  \ 在 Java 程序中，双引号包围着 String 字面量中的字母。\n\nJava `JFrame` 就像一个窗口。（唯一的区别是你称它为 `JFrame`\
  \ 而不是窗口。）为了让列表 4-6 简洁明了，我决定不在我的框架中放置任何东西——没有按钮、没有字段、什么都没有。\n\n即使是一个完全空的框架，列表 4-6\
  \ 也使用了我在本书后面部分才会介绍的技巧。所以，不要尝试阅读和理解列表 4-6 中的每一个字。从列表 4-6 中获得的主要信息是该程序有两个变量声明。在编写程序时，我构了两个变量名：`myTitle`和`myFrame`。根据声明，`myTitle`的类型是`String`，而`myFrame`的类型是`JFrame`。\n\
  \n你可以在 Java 的 API 文档中查询`String`和`JFrame`。但在你之前，我就可以告诉你你会发现什么。你会发现`String`和`JFrame`都是\
  \ Java 类的名称。这就是大新闻。每个类都是一个引用类型的名称。你可以通过编写以下代码为`double`值预留`amountInAccount`：\n\n\
  ```java\ndouble amountInAccount;\n```\n\n或者编写\n\n```java\ndouble amountInAccount\
  \ = 50.22;\n```\n\n你也可以通过编写以下代码为`JFrame`值预留`myFrame`：\n\n```java\nJFrame myFrame;\n\
  ```\n\n或者编写\n\n```java\nJFrame myFrame = new JFrame();\n```\n\n要复习 Java 类的概念，请参见第\
  \ 1 章中关于面向对象（OOP）的章节。\n\n![remember](img/remember.png) 每个 Java 类都是引用类型。如果你声明一个变量的类型不是基本类型，那么该变量的类型（大多数情况下）就是\
  \ Java 类的名称。\n\n现在，当你声明一个变量的类型为`int`时，你可以以直观的方式可视化该声明的含义。这意味着在计算机内存的某处为该变量预留了一个存储位置。比特的排列对于`int`或`double`等基本类型是足够的，但当你声明一个变量的类型为引用类型时，意味着什么呢？\n\
  \n嗯，声明\n\n```java\nJFrame myFrame;\n```\n\n意味着什么？这意味着`myFrame`属于该类。换句话说，`myFrame`引用一个实例。因为`JFrame`是一个类，你可以从它创建对象。\n\
