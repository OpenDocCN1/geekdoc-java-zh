  \ 方法。\n\n### Java 注解\n\n[Listing 8-7]中的 `@Override`get 是*注解*的示例。Java 注解告诉计算机关于你代码的信息。特别是，[Listing\
  \ 8-7] 中的 `@Override` 注解告诉 Java 编译器留意常见的编码错误。该注解的意思是：“确保紧跟此注解的方法与父类中的其中一个方法具有相同的内容（相同的名称、相同的参数等）。如果不是，则显示错误信息。”\n\
  \n所以，如果我不小心输入了\n\n```java\npublic double findPaymentAmount(double hours) {\n```\n\
  \n而不是像[Listings 8-5]和[8-7]中的`int hours`，编译器会提醒我，我的新 `findPaymentAmount` 方法并没有真正重写[Listing\
  \ 8-5]中的任何内容。\n\nJava 还有其他类型的注解（例如 `@Deprecated` 和 `@SuppressWarnings`）。你可以在[第 9\
  \ 章]中阅读关于 `@SuppressWarnings` 注解的介绍。\n\n![technicalstuff](img/technicalstuff.png)\
  \ Java 的注解是可选的。如果你从[Listing 8-7]中删除 `@Override` 单词，你的代码仍然可以运行。但 `@Override` 注解为你的代码提供了额外的安全性。通过\
  \ `@Override`，编译器会检查并确保你正在你想做的事（即重写父类的方法之一）。尽管向乔治·奥威尔道歉，某些类型的注解并不像其他类型那样可选。只有当你愿意用大量的无注解\
  \ Java 代码来替换注解时，才能从代码中省略某些注解。\n\n### 使用来自类和子类的方法\n\n如果你对“重写方法”这一概念需要解释，请查看[Listing\
