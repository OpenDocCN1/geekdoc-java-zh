  \n在许多 IDE 中，你不需要自己输入访问器方法。首先，你输入一个类似 `private String name` 的字段。然后，在 IDE 菜单中，选择 `Source`\
  \ -> `Generate Getters and Setters` 或者选择 `Code` -> `Insert Code`。在你完成所有选择后，IDE 会创建访问器方法并将它们添加到你的代码中。\n\
  \n\n\n\n![remember](img/remember.png) 当你调用 setter（设置）方法时，你传入一个与设置类型相同的值。这就是为什么在列表\
  \ 7-9 中，你使用类型为 `double` 的参数调用了 `yourAccount.setBalance(55.63)`。相比之下，当你调用 getter（获取）方法时，你通常不会向方法传递任何值。这就是为什么在列表\
  \ 7-9 中，你带空参数列表调用了 `yourAccount.getBalance()`。偶尔，你可能想用一条语句获取并设置一个值。要给账户的现有余额增加美元，你可以编写\
  \ `yourAccount.setBalance(yourAccount.getBalance() + 1.00)`。\n\n### 使用访问器方法强制规则\n\
  \n回到列表 7-8 并快速查看 `setName` 方法。想象将方法的赋值语句放在一个 if 语句中。\n\n```java\npublic void setName(String\
  \ n) {\n  if (!n.equals(\"\")) {\n    name = n;\n  }\n}\n```\n\n现在，如果负责 `UseAccount`\
  \ 类的程序员编写了 `myAccount.setName(\"\")`，对 `setName` 的调用将产生任何影响。此外，由于 `name` 字段是私有的，以下语句在\
  \ `UseAccount` 类中是非法的：\n\n```\nmyAccount.name = \"\";\n```\n\n当然，像 `myAccount.setName(\"\
  Joe Schmoe\")` 这样的调用仍然有效，因为 \"Joe Schmoe\" 不等于空字符串 \"\"。\n\n这很酷。通过私有字段和访问器方法，你可以防止有人将空字符串赋值给账户的名称字段。通过更复杂的\
  \ if 语句，你可以强制执行任何你想要的规则。\n\n![tryitout](img/tryitout.png) 在之前的章节中，你创建了自己的 `Organization`\
  \ 和 `FoodProduct` 类。在这些类中，将默认访问字段替换为私有字段。为这些字段创建 getter 和 setter 方法。在 setter 方法中，添加代码以确保\
  \ `String` 值不为空且数值不为负数。\n\n## Barry 自己的 GUI 类\n\n你可能已经厌倦了书中随处可见的枯燥基于文本的程序。你可能想要一些更酷炫的东西——带有文本字段和按钮的东西。很好，我为你准备了一些示例！\n\
  \n我创建了一个称为 `DummiesFrame` 的类。当你导入我的 `DummiesFrame` 类时，你可以很轻松地创建一个简单的图形用户界面（GUI）应用程序。\n\
  \n列表 7-10 使用我的 `DummiesFrame` 类，并使用图 7-15 到图 7-17 向你展示结果。\n\n列表 7-10： 你的第一个 DummiesFrame\
  \ 示例\n\n```java\nimport com.allmycode.dummiesframe.DummiesFrame;\n\npublic class\
  \ GuessingGame {\n  public static void main(String[] args) {\n    DummiesFrame frame\
  \ = new DummiesFrame(\"Greet Me!\");\n    frame.addRow(\"Your first name\");\n \
  \   frame.go();\n  }\n\n  public static String calculate(String firstName) {\n \
  \   return \"Hello, \" + firstName + \"!\";\n  }\n}\n```\n\n![image](img/9781119235552-fg0715.png)\n\
  \n图 7-15： 列表 7-10 中的代码开始运行。\n\n![image](img/9781119235552-fg0716.png)\n\n图 7-16：\
  \ 用户填充了字段。\n\n![image](img/9781119235552-fg0717.png)\n\n图 7-17： 用户点击了按钮。\n\n以下是对列表\
  \ 7-10 中代码的详细描述：\n\n*   第一行 `import com.allmycode.dummiesframe.DummiesFrame;` 使\
  \ `DummiesFrame` 名称对代码可用。\n*   在 `main` 方法内部，语句 `DummiesFrame frame = new DummiesFrame(\"\
  Greet Me!\");` 创建 `DummiesFrame` 类的实例并让变量 `frame` 指向该实例。DummiesFrame` 对象出现在屏幕上。在本示例中，窗口的标题是\
  \ *Greet Me!*。\n*   下一条语句调用 `frame` 对象的 `addRow` 方法 `frame.addRow(\"Your first name\"\
  )` 在应用程序窗口上添加一行。该行由一个标签（文本为 *Your first name*）、一个空文本字段和一个表示用户尚未输入任何内容的红色 X 标记组成（参见图\
  \ 7-15）。\n*   调用 `frame` 对象的 `go` 方法 `frame.go();` 使应用程序的窗口出现。\n*   `calculate`\
  \ 方法头 `public static String calculate(String firstName)` 告诉 Java 两件事：\n    *   `calculate`\
  \ 方法返回一个 `String` 类型的值。\n    *   Java 期望用户在文本字段中输入 `String` 值，用户输入的任何内容将成为 `firstName`\
  \ 参数的值。\n\n要使用 `DummiesFrame` 类，你的代码必须有一个名为 `calculate` 的方法，且 `calculate` 方法必须遵守某些规则：\n\
  \n*   `calculate` 方法必须以 `public static` 开头。\n*   方法可以返回任何 Java 类型：`String`、`int`\
  \ 或其他（这实际上不是规则，而是机会！）。\n*   `calculate` 方法的参数数量必须与应用程序窗口中的行数相同。列表 7-10 只有一个 `addRow`\
  \ 调用，因此图 7-10 中的窗口只有一行（不包括 *Submit* 按钮），因此 `calculate` 方法只有一个参数。当用户开始向窗口的文本中输入文本时，红色\
  \ X 标记会变为绿色勾标记（参见图 7-16）。绿色勾标记表示用户已在文本字段中输入了预期类型的值（在本示例中，一个 `String` 值）。\n*   当用户点击按钮时，Java\
  \ 执行 `calculate` 方法。方法返回语句中的表达式 `return \"Hello, \" + firstName + \"!\"` 告诉 Java\
  \ 在窗口底部显示什么。（参见图 7-17）。在本示例中，用户在唯一的文本字段中输入 *Barry*，因此 `firstName` 的值为 \"Barry\"\
  ，`calculate` 方法返回字符串 \"Hello, Barry!\"（啊！ *For Dummies* 作者的福利！）。\n\n使用我的 `DummiesFrame`\
