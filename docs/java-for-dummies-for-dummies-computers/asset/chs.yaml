  \n但在现实生活中，程序员回避使用默认访问权限。使用默认访问权限，包中的所有其他类都可以查看并更改你的字段值。其他程序员可以将 `daysInThisMonth`\
  \ 设置为 32，或者将 `chaptersInThisBook` 设置为 -7。\n\n\n\n\n到目前为止，最好的策略是仅在绝对必要时才使用默认访问权限。在大多数情况下，如果其他类必须获取或设置你的字段值，你应该使用私有访问并提供公共的\
  \ getter 和 setter 方法。\n\n## 保护级访问 (Protected Access)\n\n当我刚开始接触 Java 时，我以为 `protected`\
  \ 这个词意思是“友善且安全”之类。“哇，那个字段受保护的。它一定很难被访问。”好吧，这个想法被证明是错误的。在 Java 中，一个受保护的成员比具有默认访问权限的成员更不隐藏、更不安全，并且可以在更多类中使用。换句话说，受保护的访问权限比默认访问权限更宽松。对我来说，这个术语是具有误导性。但事实就是如此。\n\
  \n### 不在同一个包中的子类\n\n可以这样理解受保护的访问：你从一个具有默认访问权限的字段开始（声明中没有 `public`、`private` 或 `protected`\
  \ 单词的字段）。该字段只能在其所在的包内部被访问。现在在字段的声明前面加上 `protected` 单词。突然，该字段包之外的类对该字段有了某些访问权限。你现在可以从子类（声明该字段的类的子类）引用该字段。你也可以从子子类、子子子类等等依此类推引用该字段。任何后代类都可以。示例，请参阅列表\
  \ 14-8 和 14-9。\n\n#### 列表 14-8：受保护的字段\n\n```java\npackage com.burdbrain.drawings;\n\
  \nimport java.awt.Graphics;\n\npublic class Drawing {\n    protected int x = 40,\
  \ y = 40, width = 40, height = 40;\n    public void paint(Graphics g) {\n      \
  \  g.drawOval(x, y, width, height);\n    }\n}\n```\n\n#### 列表 14-9：来自蓝湖的子类，第二部分\n\
  \n```java\nimport java.awt.Graphics;\nimport com.burdbrain.drawings.Drawing;\n\n\
  public class DrawingWide extends Drawing {\n    int width = 100, height = 30;\n\
  \    public void paint(Graphics g) {\n        g.drawOval(x, y, width, height);\n\
  \    }\n}\n```\n\n列表 14-8 定义了 `Drawing` 类。列表 14-9 定义了 `DrawingWide`，它是 `Drawing`\
  \ 类的子类。\n\n在 `Drawing` 类中，`x`、`y`、`width` 和 `height` 字段是被保护的。`DrawingWide` 类有自己的\
  \ `width` 和 `height` 字段，但 `DrawingWide` 引用了父类 `Drawing` 类中定义的 `x` 和 `y` 字段。这是可以的，尽管\
  \ `DrawingWide` 与其父类 `Drawing` 类不在同一个包中（`Drawing` 类在 `com.burdbrain.drawings` 包中；`DrawingWide`\
  \ 类在 Java 伟大的未命名包中）。这是可以的，因为 `Drawing` 类中的 `x` 和 `y` 字段是保护的。\n\n比较图 14-8 和 14-9。注意图\
  \ 14-9 中多出来的部分阴影。子类可以访问一个类的受保护成员，即使该子类属于其他包。\n\n![image](img/9781119235552-fg1409.png)\n\
  \n图 14-9: 受保护字段或方法可以使用的代码范围（阴影部分）。\n\n![tip](img/tip.png) 你是否在一个程序员团队中工作？团队之外的人是否使用他们自己团队的包名？如果是这样，当他们使用你的代码时，他们可能会对你定义的类创建子类。这就是受保护访问派上用场的地方。当你希望团队之外的人直接引用你代码的字段或方法时，请使用受保护的访问。\n\
  \n![remember](img/remember.png) 对于类的成员，`private` 限制最严格，然后是默认，然后是 `protected`，最后是\
  \ `public` 访问权限。\n\n### 不在同一个包中的类\n\n关于受保护访问的真实故事比我在这一节中描述的故事要稍微复杂一点。Java 语言规范（[`https://docs.oracle.com/javase/specs`](https://docs.oracle.com/javase/specs/))）提到了一个关于代码负责对象实现的细微差别。当你刚开始学习用\
