  \ 你喜欢抽象艺术吗？你可以使用抽象类来创建抽象艺术！\n\n*   创建一个名为 `Shape` 的抽象类。`Shape` 类有一个 `size` 字段（类型为\
  \ `int`）和一个抽象的 `show` 方法。用另外两个类（`Square` 类和 `Triangle` 类）扩展抽象类 `Shape`。在 `Square`\
