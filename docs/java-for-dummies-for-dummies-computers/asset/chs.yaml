  \n去年的这个时候，你的公司花费了 1000 万美元购买了一份软件。该软件是以 `Employee.class` 文件形式提供的。Burd Brain Consulting\
  \ 公司（创建该软件的公司）的人不希望你了解软件的内部细节。（否则，你可能会偷取他们的创意。）因此，你没有该软件源自的 Java 程序文件。（换句话说，你没有\
  \ `Employee.java`。）你可以运行 `Employee.class` 文件中的字节码。你也可以阅读名为 `Employee.html` 的网页中的文档。但你无法看到\
  \ `Employee.java` 程序内部的语句，也无法更改程序的任何代码。\n\n从去年这个时候以来，你的公司成长了。与过去不同，你的公司现在有两种员工：全职和兼职。每位全职员工都领有固定的周薪。（如果员工在晚上和周末工作，那么作为对这种巨大付出的回报，员工将得到诚挚的握手。）相比之下，每位兼职员工按小时工资工作。你的公司从每位全职员工的工资单中扣除一部分费用来支付公司的福利方案。然而，兼职员工不享受福利。\n\
  \n问题是你公司去年购买的软件是否能跟上公司的增长。你投资了一个非常棒程序来处理员工及其工资单，但该程序并没有区分你的全职员工和兼职员工。你有几种选择：\n\n\
  *   **给你的邻居打个电话，他那 12 岁的孩子比你公司的任何人都更懂计算机编程。** 让这个傲慢的小不鬼把员工软件拆解、重写，并带着你公司要求的所有更改和新增交还给你。\n\
  \    仔细考虑一下，你不能那样做。无论那个孩子有多聪明，员工软件的复杂性可能会让那个孩子感到困惑。等你拿到软件时，它已经充满了 Bug 和不一致之处。此外，你甚至没有\
  \ `Employee.java` 文件可以给那个孩子。你拥有的只是 `Employee.class` 文件，无法用文本编辑器读取或修改它。（参见第 2 章）。此外，你的孩子刚打了了邻居的孩子。你不想让邻居获得看到你哀求那个天才少年帮助的快感。\n\
  \n*   **报废那份价值 1000 万美元的员工软件。** 让你公司里的某人从头重写软件。\n    换句话说，就是和你的时间和金钱告别。\n\n*   **为员工软件编写一个新的前端。**\
  \ 也就是说，编写一段代码对全职员工进行预处理，然后将初步结果交给你那价值 1000 万美元的软件。对兼职员工也进行同样的操作。\n    这个主意可能是好的，也可能导致灾难。你确定现有的员工软件中有方便的*钩子*（hooks）吗？（也就是说，员工软件是否包含允许你的前端软件轻松将初步数据发送到昂贵的员工软件的入口？）记住：这个计划将现有软件视为一个巨大的、单体的整体，这可能会变得笨拙。在你的前端代码和现有员工程序之间分工协作是困难的。如果你在现有的黑盒代码上层一层地添加，你可能会得到一个相当低效的系统。\n\
  \n*   **给卖给你员工软件的 Burd Brain Consulting 打电话。** 告诉 Burd 博士，你希望他软件的下一个版本能够区分全职和兼职。\n\
