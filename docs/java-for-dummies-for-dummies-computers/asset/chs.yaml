  # 十之法则\n\n在本部分中……\n\n在犯错之前抓住常见的错误。\n\n探索网络上最好的 Java 资源。\n\n## 第 18 章\n\n# 避免错误的十种方法\n\
  \n在本章中\n\n![check](img/check.png) **检查你的大小写和值比较**\n![check](img/check.png) **注意贯穿问题（fall-through）**\n\
  ![check](img/check.png) **将方法、监听器和构造函数放在它们该去的地方**\n![check](img/check.png) **使用静态和非静态引用**\n\
  ![check](img/check.png) **避免其他严重的错误**\n\n“从不犯错的人是那些什么都不做的人。”我的一位大学教授是这么说的。我不记得那位教授的名字，所以无法给予他应认可。我猜那是我的错。\n\
  \n## 将大写字母放在它们该去的地方\n\nJava 是一种区分大小写的语言，所以你真的必须注意你的 p 和 q —— 以及字母表中的其他所有字母。在创建 Java\
  \ 程序时，请记住以下细节：\n\n*   Java 的关键字全部全小写。例如，在 Java 的 `if` 语句中，`if` 单词不能是 `If` 或 `IF.`。\n\
  *   当你使用 Java API（应用程序编程接口）中的名称时，名称的大小写必须与 API 中显示的匹配。\n*   你还需要确保你自己定义的名称在整个程序中的大小写方式保持一致。如果你声明了一个\
  \ `myAccount` 变量，你不能将其引用为 `MyAccount`、`myaccount` 或 `Myaccount`。如果你以两种不同的方式大写化了变量名，Java\
  \ 会认为你正在引用两个完全不同的变量。\n\n关于 Java 区分大小写的更多信息，请参阅第 3 章。\n\n## 跳出 switch 语句\n\n如果你没有从\
  \ `switch` 语句中跳出，就会发生“贯穿问题”（fall-through）。例如，如果 `switch` 的值为 3，则会执行：\n\n```java\n\
  switch (value) {\n    case 3:\n        out.print(\"Last, \");\n    case 2:\n   \
  \     out.print(\"has, \");\n    case 1:\n        out.print(\"brain, \");\n}\n```\n\
  \n## 使用等号比较值\n\n当你比较两个值时，使用双等号。例如，如果 `switch` 的值为 3，以下代码是正确的：\n\n```java\nif (value\
  \ == 3) {\n    out.print(\"Last, \");\n}\n```\n但 `if (value = 3)` 不是。关于完整故事，请参阅第\
  \ 5 章。\n\n## 向 GUI 添加组件\n\n这是 `SimpleFrame` 的一个构造函数：\n\n```java\npublic SimpleFrame()\
  \ {\n    JButton button = new JButton(\"Thank you\");\n    setLayout(new FlowLayout());\n\
  \    add(button);\n    setSize(300, 100);\n    setVisible(true);\n}\n```\n\n## 为事件添加监听器\n\
  \n再次查看之前的 `SimpleFrame`。如果你忘记 `ActionListener`，什么都不会发生。关于监听器的详细介绍，请参阅第 16 章。\n\n\
  ## 定义所需的构造函数\n\n当你定义了带参数的构造函数时，计算机不再为你创建默认构造函数。换句话说，除非你显式定义，否则无法调用\n`Temperature\
  \ = new Temperature();`。关于构造函数的细节，请参阅第 9 章。\n\n## 修复非静态引用\n\n如果你尝试编译以下代码，你会得到错误信息：\n\
  \n```java\nclass WillNotWork {\n    String greeting = \"Hello\";\n    public static\
  \ void main(String[] args[]) {\n        System.out.println(greeting);\n    }\n}\n\
  ```\n\n报错是因为 `main` 是静态的，而 `greeting` 不是。关于解决此问题的完整指南，请参阅第 10 章。\n\n## 保持数组边界\n\n\
  当你声明一个包含十个组件的数组时，组件的索引从 0 到 9。换句话说，如果你声明\n`int guests[] = new int[10];`\n那么你可以通过编写\
  \ `guests[0]`、`guests[1]` 直到 `guests[9]` 来引用该数组的组件。你不能写 `guests[10]`，因为该数组没有索引为\
  \ 10 的组件。\n\n关于数组的最新动态，请参阅第 11 章。\n\n## 预测空指针\n\n本书中的示例不太可能抛出 `NullPointerException`，但在真实的\
  \ Java 编程中，你经常遇到这种异常。当你调用一个应该返回对象的方法，但该方法却返回了空时，就会发生 `NullPointerException`。这里有一个简单的示例：\n\
  \n```java\nimport static java.lang.System.out;\nimport java.io.File;\n\nclass ListMyFiles\
  \ {\n    public static void main(String[] args[]) {\n        File myFile = new File(\"\
  /Users\");\n        String dir[] = myFile.list();\n        for (String fileName\
  \ : dir) {\n            out.println(fileName);\n        }\n    }\n}\n```\n\n此程序将列出\
  \ Users 目录下的所有文件。\n\n\n\n\n\n但如果你将 `/Users` 改为其他内容——一个不代表目录名称的内容，会发生什么呢？\n\n```java\n\
  File myFile = new File(\"&*%$!!\");\n```\n\n新的 `File` 调用将返回 `null`（一个表示*无*的 Java\
  \ 特殊单词），因此变量 `myFile` 内部为空。在代码的后半部分，变量 `dir` 指向空，而尝试遍历所有 `dir` 值的操作会惨遭失败。你会得到一个巨大的\
  \ `NullPointerException`，程序会在你面前彻底崩溃。\n\n为了避免这种灾难，请检查 Java 的 API 文档。如果你正在调用的方法可能返回\
  \ `null`，请在你的程序中添加异常处理代码。\n\n关于处理异常的故事，请参阅第 13 章。关于阅读 API 文档的建议，请参阅第 3 章 以及本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n## 帮助 Java 找到文件\n\n当你正在编译 Java 代码，忙于自己的事情时，计算机给了你一个 `NoClassDefFoundError`。可能出现了各种问题，但很大可能是因为计算机找不到某个特定的\
  \ Java 文件。要修复这个问题，你必须让所有行星正确对齐：\n\n*   你的项目目录必须包含代码中使用的所有 Java 文件名。\n*   如果你使用了命名包，你的项目目录必须具有相应命名的子目录。\n\
  *   如果你从计算机的命令行运行代码，则必须正确设置 `CLASSPATH` 环境变量。\n\n具体的指南，请参阅第 14 章 以及本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n第 19 章\n\n# 适用于 Java 的十个网站\n\n本章内容：\n\n*   ![check](img/check.png) **查看本书的网站**\n\
  *   ![check](img/check.png) **从 Oracle 寻找资源**\n*   ![check](img/check.png) **阅读更多关于\
  \ Java 的内容**\n\n难怪网页如此流行：既有用又有趣。本章通过列出十个有用且有趣的网站来证明这一事实。每个网站都有资源帮助你更有效地使用 Java。而且据我所知，这些网站中没有一个使用广告软件、弹出窗口或其他怪异的东西。\n\
