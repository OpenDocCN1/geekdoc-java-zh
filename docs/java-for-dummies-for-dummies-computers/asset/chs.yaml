  \n}\n\n});pack();\n\nsetVisible(true);\n\n}\n\n}\n```\n\n内部类非常适合事件处理程序等，例如本章示例中的\
  \ `actionPerformed` 方法。*匿名*内部类最难的地方在于跟踪括号、大括号和缩进。我诚恳的建议是，从编写不包含任何内部类的代码开始，就像列表 16-1\
  \ 中的代码那样。稍后，当你对普通的 Java 类感到无味时，可以尝试将你的一些普通类改为内部类来做做实验。\n\n![tryitout](img/tryitout.png)\
