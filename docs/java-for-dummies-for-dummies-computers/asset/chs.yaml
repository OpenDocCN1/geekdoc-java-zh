  \n### 公有类\n\nListing 7-1 中的第一行是\n\n```java\npublic class Account {\n```\n\n`Account`\
  \ 类是公有的。公有类可供所有其他类使用。例如，如果你在网络空间的某个角落写了一个 `ATMController` 程序，它包含了对 Listing 7-1 中\
  \ `Account` 类的使用，例如 `myAccount.balance = 24.0`（当然，你知道 Listing 7-1 中声明的 `Account`\
  \ 类在哪里，但那是另一个故事。）\n\nListing 7-2 包含了 `myAccount.balance = 24.0`。你可能会对自己说：“`Account`\
  \ 类必须是公有的，因为另一个类（Listing 7-2）使用了 `Account` 类。”不幸的是，关于公有类的真实情况要复杂得多。事实上，当星辰对齐时，一个类可以使用另一个类的代码，即使另一个类不是公有的。（我在第\
  \ 14 章中介绍了正确的星辰对齐方法。）\n\n本章代码的秘密是，将某些类声明为公有仅仅让我感觉很好。是的，程序员会做某些事情来让自己感觉良好。在 Listing\
  \ 7-1 中，我的审美好感源于 `Account` 类对许多程序员都有用。当我创建一个实用且可命名的类时——例如 `Account`、`Engine`、`Customer`、`BrainWave`、`Headache`\
  \ 或 `SevenLayerCake` 类——我会将该类声明为公有。\n\n`UseAccount` 类在 Listing 7-2 中也是公有的。当一个类包含\
  \ `main` 方法时，Java 程序员倾向于将该类设为公有，而不考虑谁在使用该类。因此，即使没有其他类使用我的 `main` 方法，我也把 `UseAccount`\
  \ 类是公有的。书中的大多数类都包含 `main` 方法，因此书中的大多数类都是公有的。\n\n\n\n\n\n![warning](img/warning.png)\
  \ 当你声明一个类为 public（公有）时，你必须在一个与类名完全相同的文件（但加上 `.java` 扩展名）中声明该类。例如，如果你声明了 `public\
  \ class MyImportantCode`，你必须将该类的代码放在一个名为 `MyImportantCode.java` 的文件中，其中字母 M、I 和\
  \ C 大大写，其他所有字母均为小写。这个文件命名规则有一个重要的后果：如果你的代码声明了两个 public 类，那么你的代码必须至少由两个 `.java` 文件组成。换句话说，你不能在一个\
