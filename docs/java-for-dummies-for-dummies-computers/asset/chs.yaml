  \ `Add External JARs` 按钮，然后导航到计算机硬盘上的 `derby.jar` 文件。\n\n## 使用 SQL 命令\n\n在列表 17-1\
  \ 中，代码的核心在于 `executeUpdate` 的调用。`executeUpdate` 调用包含一个字符串——一个双引号字符串。为了代码的可读性，我将字符串分成了四个部分，并用加号（`+`）将其分开。\n\
  \n如果你熟悉结构化查询语言或 SQL，`executeUpdate` 调用中的字符串对你来说是有意义的。如果没有，请购买 Allen G. Taylor 写的《SQL\
  \ For Dummies》第 8 版。无论如何，不要在本章中寻找 `create table` 命令的解释。你将找不到，因为 `create table` 字符串在列表\
  \ 17-1 中并不是 Java 的部分。该命令只是传递给 Java `executeUpdate` 方法的字符串。\n\n## 连接与断开\n\n除了调用 `executeUpdate`\
  \ 方法外，列表 17-1 中的代码都是复制粘贴的内容。以下是代码各部分的说明：\n\n*   **DriverManager.getConnection:**\
  \ 与特定的数据库建立会话。\n\n`getConnection` 方法位于名为 `DriverManager` 的 Java 类中。在列表 17-1 中，`getConnection`\
  \ 调用创建一个 `AccountDatabase` 并打开到该数据库的连接。当然，在你运行列表 17-1 中的代码之前，你可能已经有一个 `AccountDatabase`\
  \ 了。如果是这样，`CONNECTION` 字符串中的 `;create=true` 文本没有影响。\n\n\n\n\n\n在 `CONNECTION` 字符串中，注意这些冒号。代码不仅仅是命名了\
  \ `AccountDatabase` —— 它在告诉 `DriverManager` 类使用什么种协议来连接数据库。代码 `jdbc:derby:` —— 这非常类似于网页地址中的\
  \ `http:` —— 告诉计算机使用 `jdbc` 协议与 `derby` 协议通信，而后者又直接与你的 `AccountDatabase` 通信。\n\n\
  - `conn.createStatement()`：创建一个语句（statement）。\n\n这听起来很奇怪，但在 Java 数据库连接（Java Database\
  \ Connectivity）中，你只需要创建一个语句对象。在创建了语句对象后，你可以多次使用该对象，配合许多不同的 SQL 字符串，向数据库发送许多不同的命令。因此，在开始调用\
  \ `statement.executeUpdate` 方法之前，你必须先创建一个真正的语句对象。对 `conn.createStatement()` 的调用就会为你创建该语句对象。\n\
  \n- `try-with-resources`：无论发生什么，都释放资源！\n\n正如 Ritter 经常说过的，如果你不清理自己留下的摊子，就是对他人不体。每一个连接和每一个数据库语句都会占用一些系统资源。当你完成对这些的使用后，就要释放它们。\n\
  \n在 Listing 17-1 中，Java 的 `try-with-resources` 块会在执行结束时自动关闭并释放你的资源。此外，`try-with-resources`\
  \ 还处理了与优雅地捕获异常相关的所有繁琐细节。\n\n![crossreference](img/crossreference.png) 有关 `try-with-resources`\
  \ 的详细信息，请参第 13 章。\n\n## 在表中插入数据\n\n与任何其他表格配置一样，数据库表都包含列和行。当你运行 Listing 17-1 中的代码时，你会得到一个空表。该表有三列（`NAME`、`ADDRESS`\
  \ 和 `BALANCE`）但没有行。要向表中添加行，请运行 Listing 17-2 中的代码。\n\nLISTING 17-2: 插入数据\n\n```java\n\
