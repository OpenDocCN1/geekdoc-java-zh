  \n`Displayable` 接口就像法律合同。`Displayable` 接口并没有告诉你实现类已经拥有什么。相反，`Displayable` 接口告诉实现类必须在自己的代码中声明什么。\n\
  \n除了显示数字列和表格，我可能还想汇总这两种数据。如何汇总一列数字？我不知道。也许你显示数字的总和。也许你汇总表格。你如何汇总数据不是我关心的。我关心的你有办法可以汇总数据。\n\
  \n在 Listing 15-2 中，我声明了一个 `Summarizable` 接口。\n\nListing 15-2: 另一个接口\n\n```java\n\
  public interface Summarizable {\n    String summarize();\n}\n```\n\n记住 在接口的声明中，特定方法可能没有体。没有体的方法被称为*抽象方法*。\n\
  \nJava 的编译器对 `implements` 关键字的使用非常严肃。如果你从 Listing 15-3 中移除两个方法声明中的任何一个而不移除 implements\
  \ 子句，你会在 IDE 编辑器中看到一些的错误信息。Java 期望你遵守 `implements` 关键字隐含的合同。如果不遵守合同，Java 将拒绝编译你的代码。\n\
  \n提示 你可以利用 Java 的错误信息。优势。从输入一些包含 `implements Displayable, Summarizable` 子句的代码开始。因为\
  \ implements 子句，编辑器会显示错误标记并列出你应该声明但没有声明的方法名称。经过几次鼠标点击，IDE 就会为你生成简单的 display 和 summarize\
  \ 方法。\n\nListing 15-4 包含了另一个实现了 Displayable 和 Summarizable 接口的类。\n\n```java\npublic\
  \ class Table implements Displayable, Summarizable {\n    double numbers[];\n  \
  \  public Table(double[] numbers) {\n        this.numbers = numbers;\n    }\n\n\
  \    @Override\n    public void display() {\n        for (double d : numbers) {\n\
  \            System.out.println(d);\n        }\n    }\n\n    @Override\n    public\
  \ String summarize() {\n        double total = 0.0;\n        for (double d : numbers)\
  \ {\n            total += d;\n        }\n        return Double.toString(total);\n\
  \    }\n}\n```\n\n\n\n\n```java\nScanner diskFile;\n\nArrayList<String> lines =\
  \ new ArrayList<>();\n\npublic Table(String fileName) {\n    try {\n        diskFile\
  \ = new Scanner(new File(fileName));\n    } catch (FileNotFoundException e) {\n\
  \        e.printStackTrace();\n    }\n    while (diskFile.hasNextLine()) {\n   \
  \     lines.add(diskFile.nextLine());\n    }\n}\n\n@Override\npublic void display()\
  \ {\n    for (String line : lines) {\n        System.out.println(line);\n    }\n\
  }\n\n@Override\npublic String summarize() {\n    return lines.get(0);\n}\n}\n```\n\
  \n在代码列表 15-3 和 15-4 中，注意几几次 `@Override` 注解的使用。第 8 章引入了 `@Override` 注解的使用。通常情况下，你使用\
