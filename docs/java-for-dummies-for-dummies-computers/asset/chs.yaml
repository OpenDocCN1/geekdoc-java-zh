  \ 文件。该文件如 Figure 8-3 所示；输出参见 Figure 8-2。\n\n### 复制粘贴代码\n\n在几乎任何编程语言中，从文件读取数据都是困难的。你添加额外的行来告诉计算机做什么。有时你可以从其他代码中复制这些行。例如，你可以遵循\
  \ Listing 8-2 的模式：\n\n```java\n/*\n * The pattern in Listing 8-2\n */\nimport java.util.Scanner;\n\
  import java.io.File;\nimport java.io.IOException;\n\nclass SomeClassName {\n   \
  \ public static void main(String args[]) throws IOException {\n        Scanner scannerName\
  \ = new Scanner(new File(\"SomeFileName\"));\n        // Some code goes here\n \
  \       scannerName.nextInt();\n        scannerName.nextDouble();\n        scannerName.next();\n\
  \        scannerName.nextLine();\n        // Some code goes here\n        scannerName.close();\n\
  \    }\n}\n```\n\n你想从文件读取数据。你首先想象你在从键盘读取。把常用的 `Scanner` 和 `next` 代码放入你的程序。然后添加一些额外的项：\n\
  \n*   添加两个新的导入声明——一个用于 `java.io.File`，另一个用于 `java.io.IOException`。\n*   在你的方法头部类型\
  \ `throws IOException`。\n*   在对 `new Scanner` 的调用中使用 `new File(\" \")`。\n*   取一个已经位于硬盘上的文件。在引号内输入该文件名。\n\
  *   取你用于扫描器的名称。在调用 `next`、`nextInt`、`nextDouble` 等时复用该名称。\n*   取你用于扫描器的名称。在调用 `close`\
  \ 时复用该名称。\n\n偶尔，复制粘贴代码会让你遇到麻烦。也许你正在编写一个符合简单模式的程序。你需要微调模式。但为了微调模式，你需要理解模式背后的一些想法。\n\
  \n这就是下一节将为你提供帮助。它涵盖了这些想法。\n\n\n\n\n\n![technicalstuff](img/technicalstuff.png) 这段话其实是一个告白。在几乎所有的计算机编程语言中，从磁盘文件输入都是一件棘手的事情。并不存在简单的\
  \ `INPUT` 命令。你通常必须在代码和磁盘设备之间建立连接，为从设备读取时可能出现的问题做好准备，进行读取，将读取到的字符转换为你需要的数值类型，最后断开与磁盘设备的连接。这是一团糟。这就是为什么在本书中，我依赖\
  \ Java 的 `Scanner` 类。`Scanner` 类让输入变得相对轻松。但我承认，专业的 Java 程序员很少使用 `Scanner` 类来处理输入。相反，他们使用被称为\
  \ `BufferedReader` 或 `java.nio` 包中的类。如果你对我对 `Scanner` 类的使用不满意，并希望看到列表 8-2 翻译成 `BufferedReader`\
  \ 程序，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n### 从文件读取\n\n在之前的章节中，程序从计算机键盘读取字符。这些程序使用了诸如 `Scanner`、`System.in` 和 `nextDouble`\
  \ 等在 Java API 中定义的工具。列表 8-2 中的 `DoPayroll` 程序为这个故事提供了新的视角。它不是从键盘读取字符，而是从 `EmployeeInfo.txt`\
  \ 文件读取字符。该文件存在于你计算机的硬盘上。\n\n要从文件中读取字符，你会使用一些与从键盘读取字符时相同的工具。你会使用 `Scanner`、`nextDouble`\
  \ 以及其他好东西。但这些工具之外，你还有几个额外的障碍需要跨越。以下是列表：\n\n*   **你需要一个新的 `File` 对象。** 更准确地说，你需要\
  \ API 中 `File` 类的一个新实例。你通过类似下面的代码获取这个新实例：\n\n    ```\n    new File(\"EmployeeInfo.txt\"\
  )\n    ```\n\n    引号中的内容是文件名——你计算机硬盘上的一个文件。该文件包含了之前在图 8-3 中所示的字符。\n\n    此时，这些术语把小问题说大大了。确实，我使用了\
  \ `new File object` 和 `new File instance` 等短语，但你所做的只是让 `new File(\"EmployeeInfo.txt\"\
  )` 代表硬盘上的文件。当你将 `new File(\"EmployeeInfo.txt\")` 传入 `new Scanner` 时：\n\n    ```java\n\
  \    Scanner diskScanner = new Scanner(new File(\"EmployeeInfo.txt\"));\n    ```\n\
  \n    你就可以忘记所有关于 `File` 的事情了。从代码的该点开始，`diskScanner` 代表你硬盘上的 `EmployeeInfo.txt` 文件名。（`diskScanner`\
  \ 这个名称代表硬盘上的文件，就像在之前的示例中，`keyboard` 名称代表你每天反复按的那些按钮一样。）\n\n    ![remember](img/remember.png)\
  \ 在列表 8-2 中创建一个新的 `File` 对象，就像在同一个列表中之后创建一个新的 `Employee` 对象一样。也像在第 7 章的示例中创建一个 `Account`\
  \ 对象一样。唯一的区别是 `Employee` 和 `Account` 类定义在本书的示例中，而 `File` 类定义在 Java API 中。\n\n  \
  \  ![warning](img/warning.png) 当你使用 `new Scanner` 连接到磁盘文件时，不要忘记 `new File` 的部分。如果你写\
  \ `new Scanner(\"EmployeeInfo.txt\")` 而不写 `new File`，编译器不会介意。（在运行代码之前，你不会收到任何警告或错误消息。）但当你运行代码时，你得不到预期的结果。\n\
  \n*   **你必须通过全名引用 `File` 类：`java.io.File`。** 你可以使用像列表 8-2 那样的导入语句来实现。或者，你可以在代码中加入类似下面的的语句：\n\
  \n    ```java\n    Scanner diskScanner = new Scanner(new java.io.File(\"EmployeeInfo.txt\"\
  ));\n    ```\n\n*   **你需要一个 `throws IOException` 子句。** 当你的程序连接到 `EmployeeInfo.txt`\
  \ 时，可能会发生很多问题。例如，你的硬盘上可能没有名为 `EmployeeInfo.txt` 的文件。另外，`EmployeeInfo.txt` 文件可能在错误的目录下。为了应对这种灾难，Java\
  \ 编程语言采取了预防措施。该语言坚持，当涉及磁盘文件时，你必须承认调用 `new Scanner` 的潜在危险。\n\n    你可以通过多种方式承认这些危险，但最简单的方法是使用\
  \ `throws` 子句。在列表 8-2 中，main 方法以 `throws IOException` 结尾。（如果没有这个，你会得到一个未报告的异常。）\n\
  \n\n\n\n当你从本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies））下载代码时，你会发现名为\
  \ `Employee.java` 和 `DoPayroll.java` 的文件——它们是列表 8-1 和 8-2 中的代码。你还会发现一个名为 `EmployeeInfo.txt`\
  \ 的文件。很好，因为如果 Java 找不到 `EmployeeInfo.txt` 文件，整个项目无法正常运行。相反，你会得到一个 `FileNotFoundException`。\n\
  \n通常情况下，当你遇到 `FileNotFoundException` 时，意味着程序需要的某个文件不可用。这是一个很容易犯的错误。这可能会让人沮丧，因为对你来说，像\
  \ `EmployeeInfo.txt` 这样的文件似乎对你的程序是可用的。但记住：计算机是愚笨的。如果你犯了一个微小的错误，计算机无法为你理解言外之意。因此，如果你的\
  \ `EmployeeInfo.txt` 文件不在硬盘的正确目录下，或者文件名拼写错误，计算机在尝试运行你的代码时就会卡住。\n\n有时你清楚硬盘上确实存在 `EmployeeInfo.txt`（或\
  \ `whatever.xyz`）文件。但当你运行程序时，仍然会得到一个很难看的 `FileNotFoundException`。当这种情况发生时，文件通常位于硬盘上错误的目录下。（当然，这取决于你的观点。也许文件在正确的目录中，但你的\
  \ Java 程序在错误的目录下查找文件。）要诊断这个问题，请在列表 8-2 中添加以下代码：\n\n```\nFile employeeInfo = new\
  \ File(\"EmployeeInfo.txt\");\nSystem.out.println(\"Looking for \" + employeeInfo.getCanonicalPath());\n\
  ```\n\n当你运行这段代码时，Java 会告诉你 `EmployeeInfo.txt` 文件应该在硬盘的哪个位置。\n\n#### 在文件名中添加目录名\n\
  \n你可以在 Java 代码中指定文件的精确位置。像 `new File(\"C:\\\\Users\\\\bburd\\\\workspace\\\\08-01\\\
  \\EmployeeInfo.txt\")` 这样的代码看起来非常丑，但它是有效的。\n\n在前面的段落中，你注意到“C: \\\\Users\\\\bburd\\\
  \\workspace …”中的双反斜杠了吗？如果你是 Windows 用户，你会很想用单反斜杠写 `C:\\Users\\bburd\\workspace …`。但在\
  \ Java 中，单反斜杠有自己特殊的含义。（例如，在列表 7-7 中，`\\n` 意味着换行。）因此，在 Java 中，要在引号字符串内表示反斜杠，你需要使用双反斜杠。\n\
  \n![technicalstuff](img/technicalstuff.png) Macintosh 和 Linux 用户可能会感到，因为他们的路径分隔符\
  \ `/` 在 Java 字符串中没有特殊含义。在 Mac 上，代码 `new File(\"/Users/bburd/workspace/08-01/EmployeeInfo.txt\"\
  )` 就像呼吸一样自然。（嗯，几乎是那样自然！）但 Mac 用户和 Linux 极客不应该过早声称优越。像 `new File(\"/Users/bburd/workspace\
  \ …` 这样的行在 Windows 中同样有效。在 Windows 中，你可以使用斜杠 (`/`) 或反斜杠 (`\\`) 作为路径名分隔符。在 Windows\
  \ 命令行提示符下，我可以输入 `cd c:/users\\bburd` 进入我的主目录。\n\n![tip](img/tip.png) 如果你知道 Java\
  \ 程序在何查找文件，你就可以从那个地方绕到你选择的目录。暂时假设列表 8-2 中的代码通常在名为 `08-01` 的目录下查找 `EmployeeInfo.txt`\
  \ 文件。作为一个实验，进入 `08-01` 目录并创建一个名为 `dataFiles` 的新子目录。然后将我的 `EmployeeInfo.txt` 文件移动到新的\
  \ `dataFiles` 目录。要从你移动的文件中读取数字和单词，请用代码 `new File(\"dataFiles\\\\EmployeeInfo.txt\"\
  )` 或 `new File(\"dataFiles/EmployeeInfo.txt\")` 修改列表 8-2。\n\n#### 逐行读取\n\n在列表 8-2\
  \ 中，`payOneEmployee` 方法演示了一些读取数据的有用技巧。特别是，你创建的每个 `scanner` 都有一个 `nextLine` 方法。（你可能不会使用这个\
  \ `nextLine` 方法，但该方法仍然可用。）当你调用扫描器的 `nextLine` 方法时，该方法会抓取直到当前行文本结束的所有内容。\n\n\n\n\
  对于普通计算机用户来说，键盘的感觉起来和存储在计算机硬盘上的文件完全不同。但磁盘文件和键盘输入有许多共同点。事实上，计算机操作系统的一个基本原则规定，对于程序员来说，两种输入类型之间的差异越模糊越好。作为一名\
  \ Java 程序员，你应该几乎以相同的方式来对待磁盘文件和键盘输入。这就是为什么列表 8-2 中包含一个 `diskScanner.close()` 调用。\n\
  \n当你运行一个 Java 程序时，你通常会执行 `main` 方法中的语句，从方法体中的第一条语句开始，到方法体中的最后一条语句结束。在此过程中，你会走一些弯路，跳过\
  \ `else` 部分并进入方法体内部，但基本上你会在 `main` 方法的末尾完成语句的执行。这就是为什么在列表 8-2 中，对 `close` 的调用位于\
  \ `main` 方法体的末尾。当你运行列表 8-2 中的代码时，你最后做的事情就是断开磁盘文件的连接。幸运的是，这种断开是在执行完所有 `nextLine`\
  \ 和 `nextDouble` 调用之后发生的。\n\n![tryitout](img/tryitout.png) 在本章之前的节中，你创建了自己的 `PlaceToLive`\
