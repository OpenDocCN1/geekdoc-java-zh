  \n```java\npublic interface Displayable {\n    public void display();\n}\n```\n\n\
  等一下！Listing 15-1 中的 `display` 方法声明有头部但没有体。`display()` 后面没有大括号——只有一个孤零零的分号。这里发生了什么？\n\
