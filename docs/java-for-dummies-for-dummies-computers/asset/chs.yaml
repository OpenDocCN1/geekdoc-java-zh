- "# Java 入学者指南\n\n\n\n![](img/cover.jpg)\n\n# 引言\n\nJava 是很棒的东西。我已经用它多年了。我喜欢 Java\
  \ 是因为它很有条理。几乎一切都遵循简单的规则。这些规则有时看起来可能令人生畏，但这本书正是为了帮助你理清它们。所以，如果你想使用 Java，并且想找一个传统的技术类平装书的替代方案，请坐下，放松心情，开始阅读《Java\
  \ For Dummies》第 7 版》。\n\n## 如何使用本书\n\n我真希望自己说：“打开这本书的随机一页并开始写 Java 代码。只需填好空白即可，不要回头看。”在某种意义上，这是事实。你写写\
  \ Java 代码时不会弄坏任何东西，所以你可以自由地进行实验。\n\n但让我诚实一点。如果你不理解大局，编写程序是非常困难的。对于任何计算机编程语言都是如此——不仅仅是\
  \ Java。如果你在不知道代码是关于什么的情况下输入代码，而代码没有完全按照你想要的方式运行，那么你就是彻底陷入了困境。\n\n在本书中，我将 Java 编程划分为易于管理的各个。每个部分（多或少）是一个章节。你可以从任何你想的地方开始——第\
  \ 5 章、第 10 章，或任何地方。你甚至可以从章节的中间开始。我已经尝试让示例变得有趣，同时又不让一个章节依赖于另一个。当我使用另一个章节中的重要概念时，我会附上注释帮助你找到方向。\n\
  \n通常情况下，我的建议如下：\n\n*   如果你已经了解某些内容，就不要费心阅读那部分了。\n*   如果你好奇，不要害怕跳读。如果你真的需要，随时可以偷看一眼之前的章节。\n\
  \n## 本书使用的字体约定\n\n几乎每本技术书籍的开头都有一个小型的字体图例，《Java For Dummies》第 7 版也不例外。以下是本书中所用字体的简要说明：\n\
  \n*   新术语用*斜体*表示。\n*   如果你需要输入混合在正文中输入某些内容，你输入的字符将以**粗体**显示。例如：“在文本字段中输入 `MyNewProject`。”\n\
  *   你还会看到这种计算机字体。我将计算机字体用于 Java 代码、文件名、网页地址（URL）、屏幕消息以及其他此类内容。此外，如果你需要输入的内容非常长，它将以计算机字体单独占一行（或多行）显示。\n\
  *   当你在自己的电脑键盘上输入内容时，需要对某些内容进行更改。例如，我可能会要求你输入：\n\n    ```\n    public class Anyname\n\
  \    ```\n\n    这意味着你输入 `public class`，然后是你自己想的某个名称。你需要替换为自己的词的单词将用*斜体计算机字体*表示。\n\
  \n## 你不需要阅读的内容\n\n选择第一个包含你尚未熟悉的内容的章节或节，并从那里开始阅读。当然，你可能像我一样讨厌做决定。如果是这样，这里有一些你可以遵循的指南：\n\
  \n*   如果你已经知道 Java 是什么样的“动物”，并且知道你想用 Java，请跳过第 1 章直接进入第 2 章。相信我，我不会介意的。\n*   如果你已经知道如何让\
  \ Java 程序运行起来，并且不在乎 Java 程序运行时后台发生了什么，请跳过第 2 章从第 3 章开始。\n*   如果你以编程为生但使用的是 C 或 C++\
  \ 以外的任何语言，请从第 2 章或第 3 开始。当你到达第 5 章和第 6 章时，你可能会发现它们读起来很快。当你读到第 7 章时，该时候深入学习了。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n*\
  \   如果你以编写 C（不是 C++）程序为生，请从第 2 章、第 3 章和第 4 章开始，并仅略读第 5 章和第 6 章，你可能会发现它们很容易读。\n\n\
  ## 本书的组织结构\n\n本书划分为若干节，节组成若干节，节组成章节，章节最后归为五个部分。（当你写一本书时，你会非常熟悉你书的结构。写几个月后，你晚上睡觉时会发现梦里都是节和章节。）书的部分列如下。\n\
  \n### 第一部分：开始学习 Java\n\n\n\n\n这部分是关于 Java 的完整执行摘要简报。它包含了一些“什么是 Java？”的内容以及一个快速上手章节\
  \ —— 第 3 章。在第 3 章中，你将接触主要的编程思想并分析一个简单的程序。\n\n## 第二部分：编写你自己的 Java 程序\n\n第 4 章到第 6\
  \ 章涵盖了基础知识。这些章节描述了你需要的知识，以便让你的电脑运行起来。\n\n如果你曾用 Visual Basic、C++ 或任何其他语言编写过程序，那么第二部分中的某些内容对你来说可能熟悉。如果是这样，你可以跳过某些章节或快速阅读这些内容。但不要读得太快。Java\
  \ 与其他某些编程语言有些不同，特别是在第 4 章中我描述的内容。\n\n## 第三部分：掌握大局：面向对象编程\n\n第三部分包含了我最喜欢的几个章节。这部分涵盖了至关重要的面向对象编程主题。在这些章节中，你将发现如何为大问题映射解决方案。（当然，这些章节中的示例并不大，但这些示例涉及宏大的思想。）通过易于吸收的渐进方式，你将发现如何设计类、重用现有类以及构建对象。\n\
  \n你是否读过那些用泛泛、通用的术语解释面向对象编程的书籍？我很自豪地说，《*Java For Dummies》（傻瓜指南）第 7 版并不那样。在书中，我用一个简单而具体的程序示例来阐述每一个概念。\n\
  \n## 第四部分：高级 Java 技术\n\n如果你已经领略了 Java 的魅力并想了解更多，可以在书的这一部分找到你需要的内容。这一部分的章节致力于细节 ——\
  \ 那些在你初看材料时并看不的东西。在读完前面的部分并自己写一些程序后，你可以通过阅读第四部分来进一步深入探索。\n\n## 第五部分：十之篇\n\n“十之篇”就像一个小型的\
  \ Java 糖果店。在“十之篇”中，你可以找到列表 —— 避免错误的技巧列表、寻找资源的列表以及各种趣物的列表。\n\n## 本书中使用的图标\n\n如果你能看着我写这本书，你会看到我坐在电脑前自言自语。我会在脑海里过每一个句子。对于大多数句子，我会在心里嘟念好几次。当我产生额外的想法、旁旁评论或不属于正文主流的内容时，我会稍微转一下头。这样一来，无论是谁在听我说话（通常没人听），都知道我进入了暂时的离题插曲。\n\
  \n当然，在印刷物中，你看不见我转头。我需要其他方式来把侧面思考放在单独的角落。我用图标来实现这一点。当你看到“提示 (Tip)”图标或“记住 (Remember)”图标时，你就知道我正在进行一次快速的小绕路。\n\
  \n以下是我书中使用的图标列表：\n\n![tip](img/tip.png) 提示（Tip）是一条额外信息 —— 其他书籍可能忘记告诉你的有用信息。\n\n\
  ![warning](img/warning.png) 每个人都会犯错。天知道我这辈子也犯过几次错。总之，当我认为某些地方特别容易犯错时，我会用“警告 (Warning)”图标标记它。\n\
  \n![remember](img/remember.png) *问题：* 有什么比“提示”强，但没有“警告”强？\n\n*答案：* “记住 (Remember)”图标。\n\
  \n![crossreference](img/crossreference.png) “如果你不记得某某的意思，请参见某某，”或“欲了解更多信息，请阅读某某”。\n\
  \n![tryitout](img/tryitout.png) 编写代码是一项活动，学习活动的最佳方法就是实践。这就是为什么我创建了一些供你尝试的内容，以巩固你的知识。其中许多是建立信心的，但有些更具挑战性。当你刚开始实践时，你会发现各种在开始阅读材料时从未想过的问题、困境和障碍。但那是好事。坚持下去！不要感到沮丧。或者，如果你真的感到沮丧了，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）获取提示和解决方案。\n\
  \n![ontheweb](img/ontheweb.png) 这个图标引起对可以在网上找到的有用材料的。看看吧！\n\n![technicalstuff](img/technicalstuff.png)\
  \ 偶尔，我会遇到一些技术小知识。这些小知识可能帮助你理解幕后人员（开发人员）\n\n## 书之外\n\n除了你阅读的内容外，这本书还附带了一个免费的在线备查表（Cheat\
  \ Sheet）。获取此备查表，只需访问[`www.dummies.com`](http://www.dummies.com/) 并在搜索框中输入 `For Dummies\
  \ Cheat Sheet`。\n\n## 接下来该去哪里\n\n如果你已经读到了这里，你就准备好开始 Java 开发了。把我（作者）想象成你的向导、主持人和私人助理。如果你喜欢读到的内容，请给我写封信。我的电子邮箱专门用于接收关于这本书的评语和问题，是\
  \ `JavaForDummies@allmycode.com`(mailto:JavaForDummies@allmycode.com)。如果你不喜欢邮件和聊天，你可以通过\
  \ Twitter (`[@allmycode`](http://www.twitter.com/allmycode)`) 和 Facebook (`[www.facebook.com/allmycode`](http://www.facebook.com/allmycode)`)\
  \ 与我联系。不要忘记 —— 要获取最新更新，请访问该网站。网址是 [`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)。\n\
  \n# 第一部分：Java 入门\n\n在本部分\n\n- 了解开发 Java 的工具。\n- 了解 Java 如何融入当今的技术领域。\n- 编写你的第一个\
  \ Java 程序。\n\n# 第一章：关于 Java 的一切\n\n在本章\n\n- ![check](img/check.png) **什么是 Java**\n\
  - ![check](img/check.png) **Java 源自哪里**\n- ![check](img/check.png) **为什么 Java 如此酷**\n\
  - ![check](img/check.png) **如何让自己适应面向对象编程**\n\n\n\n\n整个过程现在看起来似乎很浪费，但那仅仅是因为你我正舒适地坐在电子时代里。信息是思想，而墨水、纸张和马等物理实体与真正的思想几乎或完全没有关系；它们只是思想的临时载体（尽管人们在几个世纪里一直用它们来承载思想）。尽管如此，思想本身是无纸化、无马化且无信使的。\n\
  \n计算机的妙之处在于它们能高效地承载思想。它们除了思想以外，携带的几个光子和少量的电力。它们做到这一点既不杂乱，也不费力，没有额外的物理负担。\n\n当你开始高效地处理思想时，会发生非常棒的事情。突然，所有的开销消失了。你不再是在推销纸张和树木，而是在推销数字和概念。没有了这些开销，你可以运行得快得多，并且完成比以前复杂得多的任务。\n\
  \n## 你用 Java 能做什么\n\n如果所有这些复杂性都是免费的，那就太好了，但遗憾的是并非如此。有人必须苦苦思考并准确决定要让计算机做什么。在完成思考之后，有人必须为计算机编写一套供其遵循的指令。\n\
  \n鉴于现状，你无法用英语或任何人类使用的语言来编写这些指令。科幻小说中充满了这样的故事：人们对机器人说简单的话，却得到了灾难性的、意想不到的结果。英语及此类语言不适合与计算机通信，原因如下：\n\
  \n*   一个英语句子可能会被误解。“每天吃三次药片，直到吃完为止。”\n*   很难在英语中编织一个非常复杂的命令。“将法兰 A 连接到凸起 B，确保仅将法兰\
  \ A 的外缘连接到凸起 B 的较大端，同时将法兰 A 的中间和内缘连接到垫圈 C。”\n*   一个英语句子有很多多余的负担。“句子包含不必要的单词。”\n\
  *   英语很难解释。“作为 John Wiley & Sons, Inc.（`Wiley`）与作者（`Barry Burd’）之间本出版协议的一部分，Wiley\
  \ 将就《Java For Dummies》第 7 版（`the Work`）的部分提交向作者支付一千两百五十七美元六十三美分（$1,257.63）。”\n\n\
  要告诉计算机做什么，你必须使用一种特殊语言来编写简洁、无歧的指令。这种特殊语言被称为*计算机编程语言*。用这种语言编写的一组指令被称为*程序*。当将其看作一个大整体时，这些指令被称为*软件*或*代码*。以下是用\
  \ Java 编写的代码看起来像：\n\n```java\npublic class PayBarry {\n    public static void main(String\
  \ args[]) {\n        double checkAmount = 1257.63;\n        System.out.print(\"\
  Pay to the order of \");\n        System.out.print(\"Dr. Barry Burd \");\n     \
  \   System.out.print(\"$\");\n        System.out.println(checkAmount);\n    }\n\
  }\n```\n\n## 为什么你应该使用 Java\n\n是时候庆祝了！你刚刚拿到了一本《Java For Dummies》第 7 版，并且正在阅读第 1 章。按照这个速度，你很快就会成为一名\
  \ Java 程序员专家^(*)，所以请通过举办大型派对来为你最终的成功欢呼吧。\n\n为了准备派对，我会烤一个蛋糕。我很懒，所以我会用现成的蛋糕混合粉。让我看看……向混合粉中加水，然后加入黄油和鸡蛋——嘿，等等！我刚刚看了配料表。MSG\
  \ 是什么？丙二醇又是什么？那是用于防冻的吧？\n\n我会改变计划，从头开始制作蛋糕。当然，这要难一点，但这样我能得到准确想要的。\n\n计算机程序也是同样运作。你可以使用他人的程序，也可以编写自己的。如果你使用他人的程序，你就用你得到的任何。当你编写自己的程序时，你可以为自己的需求专门定制程序。\n\
  \n编写计算机代码是一项巨大的全球产业。公司在做、自由职业人士在做、爱好者在做——各各种类型的人都在做。典型的大公司有团队、部门和分支为公司编写程序。但你可以为自己或他人编写程序，为了谋生，也可以为了兴趣。在最近的一项估计中，仅美国程序员每天编写的代码行数就超过了木星上甲烷分子的数量。[#05_9781119235552-ch01.xhtml_c01-note-0002]。考虑几乎任何可以用计算机完成的事情。只要有合适的时间，你就可以编写自己的程序来完成。（当然，“合适的时间”可能非常长，但这不是重点。许多有趣且实用的程序可以在几小时甚至几分钟内写好。）\n\
  \n## 视角：Java 处于什么位置\n\n以下是现代计算机编程的简史：\n\n*   **1954–1957：FORTRAN 诞生。** FORTRAN 是第一种现代计算机语言。对于科学编程，FORTRAN\
  \ 是一匹真正的赛马。年年复今年，FORTRAN 都是领先语言。\n*   **1959：Grace Hopper 在 Remington Rand 开发了 COBOL\
  \ 语言。** COBOL 中的 B 代表 Business（业务），业务正是 COBOL 的核心。该语言的主要功能是处理一条接一条记录，一个接一个客户，或一个接一个员工。在开发后的几年里，COBOL\
  \ 成为最广泛使用的业务语言。\n*   **1972：Dennis Ritchie 在 AT&T 贝尔实验室开发了 C 语言。** 你在书中看到的“外观”和“感觉”来自\
  \ C 语言。用 C 编写的代码使用大括号、if 语句、for 语句等。在力量方面，你可以用 C 解决用 FORTRAN、Java 或任何现代语言解决的问题。（你可以用\
  \ COBOL 写科学计算程序，但那样会很奇怪。）编程语言之间的区别不是力量。区别在于易用性和适用性。那是它的擅长之处。\n*   **1986：Bjarne\
  \ Stroustrup（再次在贝尔实验室）开发了 C++。** 与祖先 C 语言不同，它支持对象编程。这种支持代表了巨大的进步。（参见本章下一节。）\n* \
  \  **1995 年 5 月 23 日：Sun Microsystems 发布了第一个版本的 Java 版本。** Java 改进了 C++ 的概念。Java\
  \ 的“一次编写，到处运行”哲学使得该语言非常适合分发代码。此外，Java 是一种极好的通用编程语言。通过 Java，你可以编写窗口应用程序、构建和探索数据库、控制手持设备等。在短短五年内，该语言在全球范围内拥有\
  \ 250 万开发者。（我知道，我有一件纪念 T 恤可以证明。）\n*   **2000 年 11 月：大学委员会宣布，从 2003 年开始，计算机科学高级别考试将基于\
  \ Java。** 想知道住在街那头的小鼻子在高中学什么吗？你猜对了——Java。\n*   **2002 年：微软推出了一种新语言，命名为 C#。** C#\
  \ 的许多特性直接来自 Java 的特性。\n*   **2004 年 6 月：Sys-Con Media 报告，对 Java 程序员的需求超过 C++ 程序员的需求的\
  \ 50%（[`http://java.sys-con.com/node/48507`](http://java.sys-con.com/node/48507)`）。**\n\
  \n\n\n\n\n而且不仅如此！Java 程序员的需求比 `C++` 和 `C#` 程序员的需求总和高出 8%。Java 程序员的就业率比 Visual Basic\
  \ (`VB`) 程序员高出高达 190%。\n\n*   **2007 年：Google 采用 Java 作为创建 Android 移动设备应用的首选语言。**\n\
  *   **2010 年 1 月：甲骨文公司收购太阳微系统公司，将 Java 技术引入了甲骨文产品家族。**\n*   **2010 年 6 月：`eWeek`\
  \ 将 Java 排在其“让你保持就业的前 10 种编程语言”中列第一位（[`www.eweek.com/c/a/Application-Development/Top-10-Programming-Languages-to-Keep-You-Employed-719257`](http://www.eweek.com/c/a/Application-Development/Top-10-Programming-Languages-to-Keep-You-Employed-719257))）。**\n\
  *   **2016 年：Java 运行在 150 亿台设备上（[`http://java.com/en/about`](http://java.com/en/about)`），**其中\
  \ Android Java 运行在全球 87.6% 的移动手机上**（[`www.idc.com/prodserv/smartphone-os-market-share.jsp`](http://www.idc.com/prodserv/smartphone-os-market-share.jsp)`）。**\n\
  \n此外，Java 技术为所有蓝光设备提供了交互能力，并且是 TIOBE 编程语言社区指数中最流行的编程语言（[`www.tiobe.com/index.php/content/paperinfo/tpci`](http://www.tiobe.com/index.php/content/paperinfo/tpci)`）、PYPL：编程语言流行指数（[`http://sites.google.com/site/pydatalog/pypl/PyPL-PopularitY-of-Programming-Language`](http://sites.google.com/site/pydatalog/pypl/PyPL-PopularitY-of-Programming-Language)`）以及其他指数。\n\
  \n嗯，我被印象深刻了。\n\n## 面对象编程 (OOP)\n\n现在是凌晨三点了。我正梦见自己在高中挂掉过的那门历史课。老师正在对我大吼：“你有两天时间准备期末考试，但你不会记得复习的。你会忘记并感到愧疚、愧疚、愧疚。”\n\
  \n突然，电话响了。我从深睡中猛地醒来。（当然，我不喜欢梦到那门历史课，但我更不喜欢被叫醒。）起初，我把电话掉在了地板上。费劲捡起来后，我发出了不耐烦的声音：“你好，哪位？”一个声音回答道：“我是来自《纽约时报》的一位记者。我正在写一篇关于\
  \ Java 的文章，我需要用五个字或更短的话介绍这种编程语言。你能解释一下吗？”\n\n我的大脑太昏迷了。我无法思考。于是我脱口脑子里闪过的第一个念头，然后继续睡睡。\n\
  \n第二天早上来临时，我几乎不记得和记者的谈话了。事实上，我不记得我是如何回答那个问题的。我有没有告诉记者他可以把关于关于 Java 的文章放在哪里？\n\n\
  我穿上袍子冲向车车道。当我拿起早报时，我瞥了一眼首页，看到了这个 2 英寸大的标题：\n\n> **伯德称 Java 为“一种优秀的面向对象的语言”**\n\n\
  ### 面向对象的语言\n\nJava 是面向对象的。这意味着什么？不像像 `FORTRAN` 这样的语言专注于给计算机发出命令式的“做这个/做那个”的指令，面向对象的语言关注的是数据。当然，面向对象的程序仍然告诉计算机该做什么。然而，它们是从组织数据开始，命令随后才来。\n\
  \n面向对象的语言优于“做这个/做那个”的语言，因为它们组织数据的方式有助于人们对数据进行各种操作。要修改数据，你可以在现有基础上进行构建，而不是在每次需要做新事情时丢弃已做的工作并重新开始。尽管计算机程序员通常是聪明人，但他们花了一段时间才弄明白这一点。想了解完整的历史课程，请参见侧边栏“从\
  \ FORTRAN 到 Java 的弯折之路”（但如果你不读，我不会让你感到愧疚的）。\n\n### 对象及其类\n\n在面向对象的语言中，你使用对象和类来组织你的数据。\n\
  \n想象你正在编写一个计算机程序，用来追踪一个新建公寓开发项目（仍在建设中）中的房屋。这些房屋之间的区别非常细微。每座房子都有独特的外墙颜色、室内墙漆颜色、厨房橱柜风格等。在你的面向对象的计算机程序中，每座房子都是一个对象（object）。\n\
  \n但对象并不是是全部。虽然房子之间略有不同，但所有房子都共享同一组特征列表。例如，每座房子都有一个名为 `siding color`（外墙颜色）的特征。每座房子还有另一个名为\
  \ `kitchen cabinet style`（厨房橱柜风格）的特征。在你的面向对象程序中，你需要一个包含房屋对象可能的所有特征的主列表。这个特征主列表被称为\
  \ `class`（类）。\n\n所以就是这样。面向对象编程这个名字起错了。它应该被称为“使用类和对象的编程”。\n\n现在注意，我把 `classes`（类）放在了前面。我竟敢这么做！嗯，也许我没疯。再次想那个开发项目。在建设中，一个特征列表被称为蓝图。建筑师的蓝图就像面向对象程序员的\
  \ `class`。蓝图上写着 `siding`。实际房屋对象拥有灰色的外墙。蓝图上写着 `kitchen cabinet`。实际房屋对象拥有路易橱柜。\n\n\
  这种类比不仅限于特征列表。蓝图和类之间存在另一个重要的平行关系。类和对象之间也是如此。程序员定义一个类，计算机从类定义中创建对象。\n\n### 面向对象的语言有什么好处？\n\
  \n基于上一节关于盖房的故事，想象你已经写好了一个计算机程序来追踪房屋的建造指令。然后，老板决定了一个修改后的计划——一半房子有三间卧室，另一半有四间。\n\n\
  如果你使用旧的 `FORTRAN/C` 风格计算机编程，你的指令看起来像这样：\n\n```\n为地下室挖坑。\n在坑周围铺设混凝土。\n在地下室框架侧面放置二四木材。\n\
  ...\n```\n\n这就像建筑师创建了一份长指令列表而不是蓝图。要修改计划，你必须翻遍列表寻找建造卧室的指令。更糟糕的是，这些指令可能分散在 234、394-410、739、10\
  \ 和 2 页。\n\n然而，从类开始就像是从蓝图开始。如果你决定既有三间也有四间卧室的房子，你可以从一个名为房屋蓝图的蓝图开始，它有一层和二层，但二层没有画室内墙。然后你再做两个二层蓝图——一个用于三卧室房屋，另一个用于四卧室房屋。（你将这些新蓝图命名为\
  \ `three-bedroom house` 蓝图和 `four-bedroom house` 蓝图。）\n\n建筑同事对你的逻辑和组织能力感到惊讶，但他们也有顾虑。他们提了一个问题：“你把其中一个蓝图称为‘三卧室房屋’蓝图。如果它只是二层的蓝图而不是整栋房子的蓝图，你怎么能这么做？”\n\
  \n\n\n\n你会会地一笑并回答道：“三居室房屋的蓝图可以写：‘关于楼层的信息，请参阅原始房屋蓝图。’这样一来，三居室房屋的蓝图描述了整栋房子。四居室房屋的蓝图也可以这样做。通过这种设置，我们可以利用之前为创建原始房屋蓝图所做的所有工作，节省大量的资金。”\n\
  \n在面向对象编程的语言中，三卧室和四卧室房屋类正在`inheriting`（继承）原始房屋类的特性。你也可以说三卧室和四卧室房屋类正在`extending`（扩展）原始房屋类。（参见图\
  \ 1-1。）\n\n![image](img/9781119235552-fg0101.png)\n\n图 1-1： 面向对象编程中的术语。\n\n原始房屋类被称为三卧室和四卧室房屋类的`superclass`（超类）。同样地，三卧室和四卧室房屋类是原始房屋类的`subclasses`（子类）。换句话说，原始房屋类被称为三卧室和四卧室房屋类的`parent\
  \ class`（父类）。三卧室和四卧室房屋类是原始房屋类的`child classes`（子类）（参见图 1-1。）\n\n不用说，你的建筑师同事们嫉妒不已。一群建筑师围在你身边，想听听你的绝妙主意。在那刻，你又抛出了一磅炸弹：“通过创建一个带有子类的类，我们将来可以重复使用该蓝图。如果有人想要一套五卧室的房子，我们可以通过创建一个五卧室房屋蓝图来扩展我们的原始房屋蓝图。我们再也不需要为原始房屋蓝图花钱了。”\n\
  \n“但是，”后排的一位同事说，“如果有人想要不同的一楼设计怎么办？我们是扔掉原始房屋蓝图，还是在原始蓝图上胡乱涂画？那可要花大价钱吧？”\n\n你用自信的语气回答道：“我们不需要动原始房屋蓝图。如果有人想在客厅里装一个按摩缸，我们可以创建一个新的小型蓝图，只描述新的客厅，并将其称为`Jacuzzi-in-living-room\
  \ house`（客厅带按摩缸房屋）蓝图。然后，这个新蓝图可以引用原始房屋蓝图获取房屋其他部分的信息（即客厅以外的部分）。”在面向对象编程语言中，客厅带按摩缸房屋蓝图仍然`extends`（扩展）原始房屋蓝图。按摩缸蓝图仍然是原始房屋蓝图子类。事实上，所有关于超类、父类和子类的术语仍然适用。唯一新之处是按摩缸蓝图`overrides`（重写）了原始房屋蓝图中的客厅特性。\n\
  \n在面向对象语言出现之前，编程世界经历了软件开发中的危机。程序员编写代码，然后发现新需求，接着就得抛弃代码并从头开始。这个问题反复反复发生，因为程序员编写的代码无法被重用。面向对象编程让这一切变得更好（而且正如\
  \ Burd 所说，Java 是‘一种伟大的面向对象语言’）。\n\n### 完善你对类和对象的理解\n\n当你用 `Java` 编程时，你不断地与类和对象打交道这两个想法非常重要。这就是为什么在这一章中，我用一个接一个关于类和对象的类比来反复冲击你的大脑。\n\
  \n闭上眼睛一分钟，思考一下物体变成椅子意味着什么……\n\n椅子有一个座位、一个靠背和腿。每个座位都有形状、颜色、软度等等。这些都是椅子所拥有的属性。我描述的是`chairness`（椅性）——即某物作为椅子的概念。在面向对象的术语中，我描述的是\
  \ `Chair` 类。\n\n现在，向书页的边缘看一眼，花一分钟观察一下你的房间。（如果你现在没坐在房间里，假装一下。）\n\n房间里有几把椅子，每把椅子都是一个对象。这些对象中的每一个都是名为`Chair`类的那个虚幻事物的例子。这就是这样运作的——类是`chairness`的理念，而每一把具体的椅子都是一个对象。\n\
  \n![remember](img/remember.png) 类并不是事物的集合。相反，类是某种事物背后的理念。当我谈到你房间里的椅子类时，我是在说每把椅子都有腿、座位、颜色等等。房间里不同椅子的颜色可能不同，但这并不重要。当你谈论一类事物时，你关注的是每个事物所拥有的属性。\n\
  \n将对象看作类的具体实例（instance）是符合逻辑的。事实上，官方术语与这种想法是一致的。如果你编写一个定义了 `Chair` 类的 `Java` 程序，那么每一把真实的椅子（你正坐的这把椅子、你旁边的空椅子等等）都被称为\
  \ `Chair` 类的 `instance`（实例）。\n\n这里是类的类的类的方式。想象一张显示了你三个银行账户的表格。（参见表 1-1。）\n\n| **账号**\
  \ | **类型** | **余额** |\n| --- | --- | --- |\n| 16-13154-22864-7 | 支票账户 | 174.87 |\n\
  | 1011 1234 2122 0000 | 信用卡账户 | –471.03 |\n| 16-17238-13344-7 | 储蓄账户 | 247.38 |\n\
  \n表 1-1 账户列表\n\n将表格的列标题看作一个类，将每一行看作一个对象。\n\n根据表格列标题，`Account` 类有账号、类型和余额。用面向对象编程的术语表述，`Account`类的每个对象（即\
  \ `Account` 类的每个 `instance`）都有账号、类型和余额。所以，表格的最后一行是一个账号 `16-17238-13344-7` 的对象。该对象类型为\
  \ `Savings`，余额为 `247.38`。如果你开了一个新账户，你就会另一个对象，表格也会增加一行。\n\n### 接下来是什么？\n\n这一章充满了通性的描述。当你刚开始时，通用描述是好的，但只有当你了解细节时，你才能真正理解。这就是为什么接下来的几章将处理细节。\n\
  \n所以，请翻页。下一章等不及要让你阅读了。\n\n## Notes\n\n第 2 章\n\n 关于软件\n\n![check](img/check.png)\
  \ **理解软件开发工具的作用**\n\n![check](img/check.png) **选择适合你的 Java 版本**\n\n![check](img/check.png)\
  \ **准备编写和运行 Java 程序**\n\n\n\n\n如果你是计算机和计算领域的老手（无论这是什么意思），而且如果你太心急，不想从本书的网站上获取详细说明，那么你可以尝试按照本节的通用说明来安装所需的软件。这些说明适用于许多计算机，但并非所有计算机。而且，本节没有提供详细的步骤，没有“如果……就那么……”的备选方案，也没有“虽然这可行，但你最好做某事”的建议。\n\
  \n要为编写 Java 程序准备计算机，请按照以下步骤操作：\n\n1. **安装 Java 开发工具包（JDK）。**\n\n   要执行此，请访问 [`www.oracle.com/technetwork/java/javase/downloads`](http://www.oracle.com/technetwork/java/javase/downloads)。\n\
  \n   按照网站上的说明下载并安装最新的 Java SE JDK。\n\n   ![remember](img/remember.png) 寻找标准版（SE）。不要费心企业版（EE）或任何其他此类版本。此外，选择\
  \ `JDK` 而不是 `JRE`。如果你看到代码数字，如 `9u3`，这代表“Java 9 的第 3 次更新”。通常情况下，任何标记为 Java 9 或更高版本的都适用于运行本书中的示例。\n\
  \n2. **安装集成开发环境。**\n\n   *集成开发环境*（IDE）是一个帮助你编写和测试新软件的程序。对于本书的示例，你可以使用几乎任何支持 Java\
  \ 的 IDE。\n\n   以下是最受欢迎流行的 Java IDE 列表：\n\n   * **Eclipse**\n\n     根据 [`www.baeldung.com/java-ides-2016`](http://www.baeldung.com/java-ides-2016)\
