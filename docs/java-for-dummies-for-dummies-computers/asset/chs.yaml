  \n# 第 4 章\n\n## 充分利用变量及其值\n\n在本章中\n\n![check](img/check.png) **给内容赋值**\n\n![check](img/check.png)\
  \ **让内容存储特定类型的值**\n\n![check](img/check.png) **应用运算符获取新值**\n\n以下 Van Doren 先生与 Barasch\
  \ 先生之间的对话从未发生过：\n\n* *Charles*：海水母吃掉了自己的大脑，让自己从动物变成了植物。\n* *Jack*：这是你的最终答案吗，Charles？\n\
  * *Charles*：是的。\n* *Jack*：Charles，你今天账户里有多少钱？\n* *Charles*：我的支票账户上有五十美元二分。\n* *Jack*：噢，你最好给税务局（IRS）打个电话，因为你的海水母答案是正确的。你赢了一百万美元。Charles，你怎么看？\n\
  * *Charles*：这全归功于诚实、勤奋和努力，Jack。\n\n这段对话的某些方面可以用几行 Java 代码表示。\n\n### 变量的变化\n\n无论你如何获得这百万美元，都可以使用变量来统计你的财富。列表\
  \ 4-1 显示了代码。\n\n列表 4-1： 使用变量\n\n```java\namountInAccount = 50.22;\namountInAccount\
  \ = amountInAccount + 1000000.00;\n```\n\n![ontheweb](img/ontheweb.png) 你不需要输入列表\
  \ 4-1](#09_9781119235552-ch04.xhtml_c04-fea-0001）中的代码（或本书中的任何列表）。要下载书中的所有代码，请访问本书的网站（[www.allmycode.com/JavaForDummies](http://www.allmycode.com/JavaForDummies)）。\n\
  \n列表 4-1](#09_9781119235552-ch04.xhtml_c04-fea-0001）中的代码使用了 `amountInAccount` 变量。*变量*是一个占位符。你可以将像\
  \ `50.22` 这样的数字放入变量中。在变量中放入一个数字后，你可以改变主意，向变量中放入不同的数字。（这就是变量变化的地方。）当然，当你向变量中放入一个新数字时，旧数字就不存在了。如果你没有在其他地方保存旧数字，旧数字就消失了。\n\
  \n[图 4-1](#09_9781119235552-ch04.xhtml_c04-fea-0001）提供了 `amountInAccount` 变量的前后对比图。\n\
