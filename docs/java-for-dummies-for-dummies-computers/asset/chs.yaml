  \n*   以下四个类存在于四个不同的 `.java` 文件中。在不向 IDE 编辑器中输入这些类的情况下，判断哪些语句会导致 IDE 显示错误信息。对于每个这样的语句，决定一个最小权限的访问更改以消除错误信息：\n\
