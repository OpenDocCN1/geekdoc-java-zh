  \ 在运行 `JShell` 时，你不需要重新输入已输入的命令。按一次向上箭头，`JShell` 显示你最近一次的命令。按两次向上箭头，`JShell` 显示上一条命令。以此类推。当\
  \ `JShell` 显示命令时，你可以使用左右箭头移动到命令中间的任何字符。你可以修改命令中的字符。最后，当你按下回车键，`JShell` 执行你新修改的命令。要结束\
  \ `JShell` 运行，输入 `/exit`（以斜杠开头）。但 `/exit` 只是你可以给 `JShell` 的许多命令之一。要询问 `JShell` 你可以使用哪些命令，输入\
  \ `/help`。\n\n通过 `JShell`，你可以在语句放入完整的 Java 程序之前对其进行测试。这使得 `JShell` 成为一个非常有用的工具。\n\
