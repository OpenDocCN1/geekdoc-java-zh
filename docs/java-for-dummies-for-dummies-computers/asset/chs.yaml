  ## 定义类（什么是棒球运动员）\n\n在我看来，一个棒球运动员有一个名字和一个打击率。列表 10-1 将我对此的感受转化成了 Java 程序形式。\n\n列表\
  \ 10-1: Player 类\n\n```java\nimport java.text.DecimalFormat;\n\npublic class Player\
  \ {\n    private String name;\n    private double average;\n    public Player(String\
  \ name, double average) {\n        this.name = name;\n        this.average = average;\n\
  \    }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ double getAverage() {\n        return average;\n    }\n\n    public String getAverageString()\
  \ {\n        DecimalFormat decFormat = new DecimalFormat();\n        decFormat.setMaximumIntegerDigits(0);\n\
  \        decFormat.setMaximumFractionDigits(3);\n        decFormat.setMinimumFractionDigits(3);\n\
  \        return decFormat.format(average);\n    }\n}\n```\n\n现在我来拆解列表 10-1 中的代码。幸运的是，前面的章节已经涵盖了这段代码中的很多内容。代码定义了作为\
  \ `Player` 类实例的含义。以下是代码内容：\n\n*   **字段 `name` 和 `average` 的声明：** 关于字段声明的闲读，请参第 7\
  \ 章。\n*   **用于创建 `Player` 类新实例的构造函数：** 关于构造函数的详细介绍，请参第 9 章。\n*   **字段 `name` 和 `average`\
  \ 的 getter 方法：** 关于访问器方法（即 setter 和 getter 方法）的闲谈，请参第 7 章。\n*   **返回 String 形式的球员打击率的方法：**\
  \ 关于方法的优质介绍，请参第 7 章。（我在第 7 章里放了很多好东西，不是吗？）\n\n### 另一种美化你数字数字方法\n\n列表 10-1 中的 `getAverageString`\
  \ 方法获取来自 `average` 字段（球员的打击率）的值，将该值（通常为 `double` 类型）转换为 `String`，然后将该 `String` 值直接返回给方法调用者。使用直接来自\
  \ Java API（应用程序接口）的 `DecimalFormat`，确保了 `String` 值看起来像棒球运动员的打击率。根据 `decFormat.setMaximum\
  \ …` 和 `decFormat.setMinimum …` 方法调用，`String` 值的小数点左侧没有数字，小数点右侧恰好三位数字。\n\nJava 的\
  \ `DecimalFormat` 类非常有用。例如，为了以会计友好的格式显示值 345 和 –345，你可以使用以下代码：\n\n```java\nDecimalFormat\
  \ decFormat = new DecimalFormat();\ndecFormat.setMinimumFractionDigits(2);\ndecFormat.setNegativePrefix(\"\
  (\");\ndecFormat.setNegativeSuffix(\")\");\nSystem.out.println(decFormat.format(345));\n\
  System.out.println(decFormat.format(-345));\n```\n\n在这个小示例的格式字符串中，分号之前的内容决定了正数的显示方式，分号之后的内容决定了负数的显示方式。因此，使用这种格式后，数字\
  \ 345 和 –345 显示如下：\n\n```\n345.00\n(345.00)\n```\n\n要发现其他数字技巧，请访问 Java API 文档中的\
  \ `DecimalFormat` 页面（[`https://docs.oracle.com/javase/8/docs/api/java/text/DecimalFormat`](https://docs.oracle.com/javase/8/docs/api/java/text/DecimalFormat)）。\n\
  \n### 使用 Player 类\n\n列表 10-2 和 10-3 中的代码使用了 `Player` 类——即在列表 10-1 中定义的类。\n\n列表 10-2:\
  \ 使用 Player 类\n\n```java\nimport java.util.Scanner;\nimport java.io.File;\nimport\
  \ java.io.IOException;\nimport java.swing.JFrame;\nimport java.swing.JLabel;\nimport\
  \ java.awt.GridLayout;\n\npublic class TeamFrame extends JFrame {\n    Player player;\n\
  \    public TeamFrame() throws IOException {\n        Scanner hankeesData = new\
  \ Scanner(new File(\"Hankees.txt\"));\n        for (int num = 1; num <= 9; num++)\
  \ {\n            player = new Player(hankeesData.nextLine(), hankeesData.nextDouble());\n\
  \            addPlayer(player);\n        }\n        setTitle(\"The Hankees\");\n\
  \        setLayout(new GridLayout(9, 2, 20, 3));\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n\
  \        pack();\n        setVisible(true);\n        hankeesData.close();\n    }\n\
  \n    void addPlayer(Player player) {\n        add(new JLabel(player.getName()));\n\
  \        add(new JLabel(player.getAverageString()));\n    }\n}\n```\n\n列表 10-3:\
  \ 显示框架\n\n```java\nimport java.io.IOException;\n\npublic class ShowTeam {\n    public\
  \ static void main(String args[]) throws IOException {\n        new TeamFrame();\n\
  \    }\n}\n```\n\n\n\n\n\n![ontheweb](img/ontheweb.png) 你可以从这本书的网站下载内容，并获取如何在你喜爱的\
