  \n# 第 17 章\n\n# 使用 Java 数据库连接\n\n本章内容\n\n![check](img/check.png) **连接数据库**\n\n![check](img/check.png)\
  \ **向数据库插入值**\n\n![check](img/check.png) **对数据库进行查询**\n\n每当我向专业程序员教授 Java 时，我总能听听到同样的老调调：“我们不需要制作外观精美的布局。我们不需要那些华丽的\
  \ GUI。我们需要访问数据库。是的，[闭嘴并]教我们如何编写与数据库通信的 Java 程序就行。”\n\n所以，各位，干货来了！\n\n*Java 数据库连接*^(*)\
  \ (JDBC) 类提供了对大多数数据库管理系统的通用访问。只需为你喜欢的供应商的系统获取一个驱动程序，修改本章每个示例中的一行代码，你就可以开始工作了。\n\n\
  ## 创建数据库和表\n\nJDBC 的核心包含两个包中：`java.sql` 和 `javax.sql`，它们都属于 Java API。本章的示例使用了 `java.sql`\
  \ 中的类。第一个示例在列表 17-1 中显示。\n\n列表 17-1： 创建数据库和表\n\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
  \npublic class CreateTable {\n    public static void main(String args[]) {\n   \
  \     final String CONNECTION = \"jdbc:derby:AccountDatabase;create=true\";\n  \
  \      try (Connection conn = DriverManager.getConnection(CONNECTION);\n       \
  \     Statement statement = conn.createStatement()) {\n            statement.executeUpdate(\"\
  create table ACCOUNTS \" +\n                \" (NAME VARCHAR(32) NOT NULL PRIMARY\
  \ KEY, \" +\n                \" ADDRESS VARCHAR(32), \" +\n                \" BALANCE\
  \ FLOAT )\");\n            System.out.println(\"ACCOUNTS table created.\");\n  \
  \      } catch (SQLException e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n\n运行本章的示例比运行其他章节的示例稍微复杂一点。要与数据库通信，你需要被称为*数据库驱动程序*的中间软件。数据库驱动程序有各种形状和大小，其中许多非常贵。但列表\
  \ 17-1 指向了一个小型的免费驱动程序：Derby JDBC 驱动程序。Derby JDBC 驱动程序的代码保留在 `EmbeddedDriver` 类中（这是一个\
  \ Java 类）。该类位于 `org.apache.derby.jdbc` 包中。\n\n当你安装 Java 9 时，不会得到这个 `org.apache.derby.jdbc`\
  \ 包。你需要一个名为 `derby.jar` 的单独文件，你可以从 [`http://db.apache.org/derby/derby_downloads.html`](http://db.apache.org/derby/derby_downloads.html)\
  \ 下载它。\n\n即使在你下载了 `derby.jar` 副本后，你的 IDE 也可能不知道你将该文件放在计算机硬盘的什么位置。通常将 `derby.jar`\
  \ 放在一个已知目录是不够的。相反，你必须准确告诉 Eclipse、IntelliJ IDEA 或 NetBeans 在何处找到你的 `derby.jar` 文件。以下是操作方法：\n\
  \n*   **Eclipse:** 选择 Project（项目）⇒   Properties（属性）。在弹出的对话框中，选择 `Java Build Path`，然后选择\
  \ `Libraries` 标签。点击 `Add External JARs` 按钮，然后导航到计算机硬盘上的 `derby.jar` 文件。\n*   **IntelliJ\
  \ IDEA:** 选择 File（文件）⇒  Project Structure（项目结构）。在弹出的对话框中，选择 `Libraries`。\n*   **NetBeans:**\
  \ 选择 File（文件）⇒  Properties（属性）。在弹出的对话框中，选择 `Java Build Path`，然后选择 `Libraries` 标签。点击\
  \ `Add External JARs` 按钮，然后导航到计算机硬盘上的 `derby.jar` 文件。\n\n## 运行代码时发生了什么\n\n运行本章的示例比运行其他章节的示例稍微复杂一点。要与数据库通信，你需要被称为*数据库驱动程序*的中间软件。数据库驱动程序有各种形状和大小，其中许多非常贵。但列表\
