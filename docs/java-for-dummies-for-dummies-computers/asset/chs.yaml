  object3.actionPerformed(infoAboutTheClick);\n}\n```\n\n当然，每一个答案的背后都是另一个问题。在这种情况下，接下来的问题是：“事件处理线程是如何找到要调用的\
  \ `actionPerformed` 方法的？”此外还有另一个问题：“如果你不想让事件处理线程调用代码中潜伏的某些 `actionPerformed` 方法该怎么办？”\n\
  \n嗯，这就是你调用 `addActionListener` 方法的原因。在 Listing 16-1 中，该调用\n\n`button.addActionListener(this);`\n\
  \n告诉事件处理线程：“将这段代码的 `actionPerformed` 方法放入你的待调用方法列表中。每当按钮被点击时，就调用这段代码的 `actionPerformed`\
  \ 方法。”\n\n这就是它的运作方式。要让计算机调用 `actionPerformed` 方法，你需要向 Java 的事件处理线程注册该方法。你通过调用 `addActionListener`\
  \ 来完成此注册。`addActionListener` 方法属于你正在等待点击（以及其他事件）的那个对象。在 Listing 16-1 中，你正在等待按钮对象被点击，而\
  \ `addActionListener` 方法属于那个按钮对象。\n\n### 关键字 `this`\n\n在第 9 章和第 10 章中，关键字 `this`\
  \ 让允许方法内部的代码访问实例变量。`this` 关键字到底意味着什么？嗯，将其与英语短语 *state your name:* 进行对比：\n\n> *I,\
  \ (state your name), do solemnly swear, to uphold the constitution of the Philadelphia\
  \ Central High School Photography Society … .*\n\n短语 *state your name* 是一个占位符。它是每个人填入自己名字的空间：\n\
  \n*   *I, Bob, do solemnly swear …*\n*   *I, Fred, do solemnly swear …*\n\n将这段誓词（“I\
  \ … do solemnly swear …”）想象成 Java 类中的某段代码。在这段代码中包含了占位符短语 *state your name.*。每当类的实例（某个人）执行代码（即进行宣誓）时，该实例就会用它自己的名字来代替短语\
  \ *state your name.*。\n\n`this` 关键字的工作方式是一样的。它位于定义 `GameFrame` 类的代码内部。每当 `GameFrame`\
  \ 的实例被构造时，该实例都会调用 `addActionListener(this)`。在那个调用中，`this` 关键字代表实例本身。\n\n`button.addActionListener(thisGameFrameInstance);`\n\
  \n通过调用 `button.addActionListener(this)`，`GameFrame` 实例正在说：“将我的 `actionPerformed`\
  \ 方法添加到每当按钮被点击时都会调用的方法列表中。”事实上，`GameFrame` 实例确实有一个 `actionPerformed` 方法。`GameFrame`\
  \ 必须有一个 `actionPerformed` 方法，因为 `GameFrame` 类实现了 `ActionListener` 接口。这一切是如何能够恰恰结合在一起，真是很奇妙。\n\
