  \n![remember](img/remember.png) `printf` 调用中的格式字符串并没有改变数字在内部用于计算的存储方式。格式字符串的作用仅仅创建了一组好看的数字字符，并显示在你的屏幕上。\n\
  \n\n\n\n要点在于，让事情看起来简单需要一些规划。在面向对象编程中，让事情看起来简单的方法之一是防止类外部代码直接使用在类内部定义的字段。看一眼列表 7-1\
  \ 中的代码。你正在一家公司工作，这家公司刚刚为 `Account` 类的代码花费了 1000 万美元。（平均每行代码就超过了 150 万美元！）现在，你的任务是编写\
  \ `UseAccount` 类。你想写下：\n\n```java\nmyAccount.name = \"Barry Burd\";\n```\n\n但这样做会让你过深地触及\
  \ `Account` 类的内部。毕竟，使用自动取款机的人并不允许编写机器的变量。他们不能使用机器的键盘来输入语句：\n\n```java\nbalanceOnAccount29872865457\
  \ = balanceOnAccount29872865457 + 1000000.00;\n```\n\n相反，他们通过按按钮来井然有序地完成工作。这就是程序员实现安全和简单的方式。\n\
  \n为了保持整洁和有序，你需要通过修改列表 7-1 中的 `Account` 类，禁止出现如下语句：\n\n```java\nmyAccount.name =\
  \ \"Barry Burd\";\n```\n\n以及\n\n```java\nout.print(yourAccount.balance);\n```\n\n\
  当然，这带来了一个问题。你是编写 `UseAccount` 类代码的人。如果你不能写 `myAccount.name` 或 `yourAccount.balance`，你该如何完成任何操作呢？答案在于被称为“访问器方法”（accessor\
  \ methods）的东西中。列表 7-8 和 7-9 演示了这些方法。\n\n### 列表 7-8 隐藏字段\n\n```java\npublic class\
  \ Account {\n    private String name;\n    private String address;\n    private\
  \ double balance;\n\n    public void setName(String n) {\n        name = n;\n  \
  \  }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ void setAddress(String a) {\n        address = a;\n    }\n\n    public String\
  \ getAddress() {\n        return address;\n    }\n\n    public void setBalance(double\
  \ b) {\n        balance = b;\n    }\n\n    public double getBalance() {\n      \
  \  return balance;\n    }\n}\n```\n\n### 列表 7-9 调用访问器方法\n\n```java\nimport static\
  \ java.lang.System.out;\npublic class UseAccount {\n    public static void main(String\
