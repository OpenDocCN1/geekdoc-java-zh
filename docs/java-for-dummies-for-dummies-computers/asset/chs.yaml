  \ 类。为这两个类都添加 `display` 方法，并创建一些使用这些 `display` 方法的独立类。\n\n## 在方法之间传递值（计算利息）\n\n想象一下派某去超市买面包。当你这样做时，你说：“去超市买些面包。”（在家里试试吧。你很快就能得到一个新鲜的面包！）当然，在另一个时间，你又让同一个人去超市买香蕉。你说：“去超市买些香蕉。”这一切的意义何在？嗯，你有一个方法，并且你有一些在调用方法时传递给该方法的即时信息。该方法命名为\
  \ `goToTheSupermarketAndBuySome`。即时信息是 `bread` 或 `bananas`，取决于你的烹饪需求。在 Java 中，方法调用看起来如下：\n\
  \n```java\ngoToTheSupermarketAndBuySome(bread);\ngoToTheSupermarketAndBuySome(bananas);\n\
  ```\n\n括号中的内容被称为`参数`（parameters）或`参数列表`（parameter lists）。有了参数，你的方法变得灵活得。。你不是每次都得到相同的东西，而是可以有一次派人去超市买面包，下一次买香蕉，第三次买鸟食。当你调用\
  \ `goToTheSupermarketAndBuySome` 方法时，你就在那里决定你想让朋友买什么。\n\n那么当你的朋友从超市回来时会发生什么？“这是你让我买的面包，”你的朋友说。通过执行你的愿望，你的朋友向你返回了某些东西。你进行方法调用，方法返回了信息（或一个面包）。\n\
  \n返回给你的东西被称为方法的`返回值`（return value）。返回给你的内容的通用类型被称为方法的`返回类型`（return type）。这些概念在代码列表\
  \ 7-5 和 7-6 中变得更加具体。\n\n代码列表 7-5： 一个计算自身利息的账户\n\n```java\nimport static java.lang.System.out;\n\
