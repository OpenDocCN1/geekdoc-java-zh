  \ IDE 都自带自己的 `JVM`，Oracle 网站可能提供组合的 `JDK+NetBeans` 安装包。尽管如此，我通过这些项目符号描述的场景是有用且可靠的。当你按照我的说明操作时，可能会得到两个\
  \ `JVM` 副本或两个 IDE，但这没关系。你不知道什么时候会需要备用。\n\n![ontheweb](img/ontheweb.png) 本章提供了你电脑上所需软件的背景信息。但本章完全没有帮助你安装软件的详细说明。如需详细说明，请访问本书的网站\
  \ ([`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies))。\n\
  \n本章其余部分描述了编译器、`JVMs` 和 `IDEs`。\n\n## 什么是编译器？\n\n*编译器获取你编写的 Java 代码并将代码转换为一组称为字节码（bytecode）的指令集。*\n\
  \n—*BARRY BURD,* 《Java 傻瓜指南》， *第 7 版*\n\n你是一个人类。（当然，每条规则都有例外。但如果你在读这本书，你很可能是一个人类。）无论如何，人类都可以编写并理解\
  \ Listing 2-1 中的代码。\n\nListing 2-1: 寻找空房\n\n```java\n// 这是一个 Java 程序的一部分。\n// 它不是一个完整的\
  \ Java 程序。\n\nroomNum = 1;\nwhile (roomNum < 100) {\n    if (guests[roomNum] ==\
  \ 0) {\n        out.println(\"Room \" + roomNum + \" is available.\");\n       \
  \ exit(0);\n    } else {\n        roomNum++;\n    }\n}\nout.println(\"No vacancy\"\
  );\n```\n\nListing 2-1 中的 Java 代码检查一家小酒店的空房情况（房号从 1 到 99 的酒店）。如果不添加几行额外的代码，你就无法运行\
  \ Listing 2-1 中的代码。但在 第 2 章 中，这些额外代码并不重要。重要的是，通过盯着代码、眯起眼睛，并忽略代码中所有奇怪的标点符号，你可以看出代码正试图做什么：\n\
  \n* 将房号设为 1。\n* 只要房号小于 100，\n* 检查房间内的客人数。\n* 如果房间内的客人数为 0，则\n* 报告该房间可用，\n* 并停止。\n\
  * 否则，\n* 通过给房号加 1 来\n* 准备检查下一个房间。\n* 如果你到了不存在的房号 100，则\n* 报告没有空房。\n\n如果你没有看出 Listing\
  \ 2-1 与其英文原文之间的相似之处，不要担心。你正在阅读《Java 傻瓜指南》第 7 版，像大多数人类一样，你可以学会阅读和编写 Listing 2-1 中的代码。Listing\
  \ 2-1 中的代码被称为 *Java 源代码*。\n\n但问题在于：计算机不是人类。计算机通常不会按照 Listing 2-1 中的指令来操作。也就是说，计算机不遵循\
  \ Java 源代码指令。相反，计算机遵循像 Listing 2-2 那样的晦涩指令。\n\nListing 2-2: Listing 2-1 翻译为 Java\
  \ 字节码\n\n```bytecode\naload_0\niconst_1\nputfield Hotel/roomNum I\ngoto 32\naload_0\n\
  getfield Hotel/guests [I\naload_0\ngetfield Hotel/roomNum I\niaload\nifne 26\ngetstatic\
  \ java/lang/System/out Ljava/io/PrintStream;\nnew java/lang/StringBuilder\ndup\n\
  ldc \"Room \"\ninvokespecial java/lang/StringBuilder/<init>(Ljava/lang/String;)V\n\
  aload_0\ngetfield Hotel/roomNum I\ninvokevirtual java/lang/StringBuilder/append(I)Ljava/lang/StringBuilder;\n\
  ldc \" is available.\"\ninvokevirtual java/lang/StringBuilder/append(Ljava/lang/String;)Ljava/lang/StringBuilder;\n\
  invokevirtual java/io/PrintStream/println(Ljava/lang/String;)V\n```\n（注：为了可读性，我稍微清理了代码块中的字节码语法）\n\
  \n\n\n\n这是一个假设的场景：现在是 1992 年（Java 发布的几年之前），你正在一台配有旧款 Pentium 处理器的电脑上运行 Linux 操作系统。你的朋友在一台配备不同类型处理器的电脑上运行\
  \ Linux —— 即 PowerPC 处理器。（在 20 世纪 90 年代，英特尔制造 Pentium 处理器，而 IBM 制造 PowerPC 处理器。）\n\
  \n列表 2-3 针对 Pentium 处理器的简单程序\n\n```assembly\n.data\nmsg:\n.ascii \"Hello, world!\\\
  n\"\nlen = . - msg\n\n.text\n.global _start\n_start:\nmovl $len,%edx\nmovl $msg,%ecx\n\
  movl $1,%ebx\nmovl $4,%eax\nint $0x80\nmovl $0,%ebx\nmovl $1,%eax\nint $0x80\n```\n\
  \n列表 2-4 包含另一组在屏幕上显示 Hello world! 的指令。列表 2-4 中的指令在运行 Linux 的 PowerPC 处理器上正常工作。\n\
  \n### 列表 2-4： 针对 PowerPC 处理器的简单程序\n\n```assembly\n.data\nmsg:\n.string \"Hello,\
  \ world!\\n\"\nlen = . - msg\n\n.text\n.global _start\n_start:\nli 0,4\nli 3,1\n\
  lis 4,msg@ha\naddi 4,4,msg@l\nli 5,len\nsc\nli 0,1\nli 3,1\nsc\n```\n\n列表 2-3 中的指令在\
  \ Pentium 处理器上运行顺畅。但这些指令对 PowerPC 处理器来说毫无意义。同样，列表 2-4 中的指令在 PowerPC 上运行良好，但这些相同的指令对于配有\
  \ Pentium 处理器的电脑来说完全是乱码。因此，你朋友的 PowerPC 软件可能无法在你的电脑上运行。而你英特尔电脑的软件可能完全无法在你朋友的电脑上运行。\n\
  \n现在去你表哥家里看看你表哥的电脑配有 Pentium 处理器（和你的一样），但表哥的电脑运行的是 Windows 而不是 Linux。当你向表哥的电脑输入列表\
  \ 2-3 中的 Pentium 代码时，会什么？它会大叫：“这不是有效的 Win32 应用程序”或“Windows 无法打开此文件”。真混乱！\n\nJava\
  \ 字节码从这一切混乱中建立了秩序。与列表 2-3 和 2-4 中的代码不同，Java 字节码并不特定于某种处理器或某种操作系统。相反，任何类型的电脑都可以拥有\
  \ Java 虚拟机（JVM），并且 Java 字节码指令可以在任何电脑的 Java 虚拟机上运行。运行在 Linux Pentium 上的 JVM 将 Java\
  \ 字节码指令翻译成你在列表 2-3 中看到的代码。运行在 Linux PowerPC 上的 JVM 将 Java 字节码指令翻译成你在列表 2-4 中看到的代码。\n\
  \n如果你编写了一个 Java 程序并将该程序编译为字节码，那么你电脑上的 JVM 就可以运行该字节码，你电脑上的 JVM 就可以运行该字节码，你电脑上的 JVM\
  \ 就可以运行该字节码。\n\n\n\n\n有关编译和运行 Java 程序的详细说明，请访问本书书的网站（[www.allmycode.com/JavaForDummies](http://www.allmycode.com/JavaForDummies)）。\n\
  \n当人们谈论编写程序时，使用的是图 2-2 中的表述。他们说：“你编译代码”和“你运行代码”。但“你”并不总是准确，而且“代码”在循环的每个阶段也略有不同。图\
  \ 2-3 更详细地描述了图 2-2 中的循环。\n\n![image](img/9781119235552-fg0203.png)\n\n图 2-3： 谁对什么代码做了什么？\n\
  \n![tip](img/tip.png) 对于大多数人的需求，图 2-3 包含的信息太多。如果我点击“运行”图标，我不需要记住计算机正在代表我运行代码。对我来说，计算机运行我的原始\
  \ Java 代码或者运行某种针对我原始 Java 代码的字节码仿制品都可以。事实上，在书中，我经常随口写道“当你运行你的 Java 代码时”或“当计算机运行你的\
  \ Java 程序时”。即使不看图 2-3，你也可以过上非常幸福的生活。图 2-3 的唯一用处是在图 2-2 中模糊的表述让你困惑时，为你提供帮助。如果图 2-2\
  \ 没有困扰你，请忽略图 2-3。\n\n### 什么是集成开发环境？\n\n*“集成开发环境帮助你管理你的 Java 代码，并为你编写、编译和运行代码提供了方便的方法。”*\n\
  \n—*BARRY BURD，JAVA FOR DUMMIES, 第 7 版*\n\n在过去，编写和运行 Java 程序需要打开多个窗口——一个用于输入程序的窗口，另一个用于运行程序的窗口，可能还有第三个窗口用来跟踪你编写的所有代码。（参见图\
  \ 2-4。）\n\n![image](img/9781119235552-fg0204.png)\n\n图 2-4： 在没有集成开发环境的情况下开发代码。\n\
  \n集成开发环境将所有这些功能无缝地整合到了一个组织良好的应用程序中。（参见图 2-5。）\n\n![image](img/9781119235552-fg0205.png)\n\
  \n图 2-5： 使用 Eclipse 集成开发环境开发代码。\n\nJava 也有自己的集成开发环境，如 `Eclipse`、`IntelliJ IDEA`\
  \ 和 `NetBeans`。许多环境具有拖放式组件，以便你可以视觉化地设计图形图形界面。（参见图 2-6。）\n\n![image](img/9781119235552-fg0206.png)\n\
  \n图 2-6： 在 NetBeans IDE 中使用拖放 Swing GUI 构建器。\n\n要运行程序，你可能点击工具栏上的按钮或从菜单中选择 `Run`。\n\
  \n![ontheweb](img/ontheweb.png) 有关编译和运行 Java 程序的详细说明，请访问本书书的网站（[www.allmycode.com/JavaForDummies](http://www.allmycode.com/JavaForDummies)）。\n\
  \n\n\n\n![remember](img/remember.png) 没有人完全了解 Java API 的所有知识。如果你是一个经常编写打开新窗口程序的\
  \ Java 程序员，你一定知道如何使用 API 中的 `JFrame` 类。如果你很少编写打开窗口的程序，那么在第一次需要创建窗口时，你可以在 API 文档中查找\
  \ `JFrame` 类。我推测，如果你阻止一个典型的 Java 程序员在 API 文档中查找任何内容，该程序员能够使用 Java API 中少于 2% 的名称。\n\
  \n![ontheweb](img/ontheweb.png) 你可能喜欢*自自教程*（For Dummies）的风格，但遗憾的是，Java 的官方 API 文档并不是那种风格写的。API\
  \ 文档既简洁又精确。如需帮助解读 API 文档的语言和风格，请参本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n在某种程度上，Java API 没有任何是特别的。每当你编写一个 Java 程序时——即使是最小、最简单的 Java 程序——你创建的类与官方 Java API\
  \ 中定义的任何类都是同等地位的。API 仅仅是一组普通程序员创建的类和其他名称，他们恰好参与了官方 Java 社区进程（JCP）和 OpenJDK 项目。与你创建的名称不同，API\
  \ 中的名称随每个 Java 版本的发布发行。（我假设你，即读者，并不是 Java 社区进程或 OpenJDK 项目的参与者。但是，有了像 *Java For\
  \ Dummies* 第 7 版这样的好书，谁也说不定。）\n\n![ontheweb](img/ontheweb.png) 如果你对 JCP 的活动感兴趣，请访问\
  \ [`www.jcp.org`](http://www.jcp.org)。如果你对 OpenJDK 项目感兴趣，请访问 [`http://openjdk.java.net`](http://openjdk.java.net)\
  \ 。\n\nJCP 的成员并没有将官方 Java API 中的 Java 程序视为保密。如果你愿意，可以查看所有这些程序。当你向电脑上安装 Java 时，安装程序会在你的硬盘上放置一个名为\
  \ `src.zip` 的文件。你可以用你喜喜欢的解压缩程序打开 `src.zip`。就在你眼前，展示着所有的 Java API 代码。\n\n## Java\
  \ 程序中的单词\n\n一个硬核 Java 程序员会说，Java 编程语言有两种单词：关键字（keywords）和标识符（identifiers）。这是正确的。但如果没有任何其他解释，赤裸事实有时具有误导性。因此，我建议对事实进行稍微修饰，并分三种单词来思考：关键字、你我这样的普通程序员创建的标识符，以及来自\
  \ API 的标识符。\n\n这三种单词之间的差异类似于英语中单词之间的差异。在句子“Sam is a person”中，`person` 这个词就像一个 Java\
  \ 关键字。无论谁使用 `person` 这个词，这个词的意思总是大致相同。（当然，你可以考虑英语用法中奇葩的例外，但请不要。）\n\n单词 `Sam` 就像一个\
  \ Java 标识符，因为 `Sam` 是一个特定人的名字。像 `Sam`、`Dinswald` 和 `McGillimaroo` 这样的词在英语中并没有预设含义。这些词根据上下文适用于不同的人，并在父母为新生婴儿选择其中一个时，它们就变成了名字。\n\
  \n现在考虑句子“Julius Caesar is a person”。如果你说出这句话，你可能是在谈论那个统治罗马直到三月十五首日的家伙。虽然 `Julius\
  \ Caesar` 这个名字没有硬编码在英语中，但几乎每个人都用这个名字指代同一个人。如果英语是一种编程语言，那么 `Julius Caesar` 将是一个 API\
  \ 标识符。\n\n所以这就是我在脑海中将 Java 程序中的单词分为类别的方式：\n\n*   **关键字（Keywords）：** `keyword` 是\
  \ Java 编程语言中具有自身特殊含义的单词，且该含义不会随程序之间而改变。Java 关键字示例有 `if`、`else` 和 `do`。\n    JCP\
  \ 委员会成员对什么构成一个 Java 程序拥有最终决定权，他们选择了所有的 Java 关键字。如果你考虑我早之前讨论的 Java 的两个部分，在“Java 语法和常用名称”部分，Java\
  \ 关键字坚定地属于语言规范。\n*   **标识符（Identifiers）：** `identifier` 是某个事物的名称。标识符的意思可以随程序之间而改变，但某些标识符的意思倾向于发生更大的变化：\n\
  \    *   **你我创建的标识符：** 作为一名 Java 程序员（是的，即使是初级 Java 程序员），你为你程序中描述的类和其他项目创建新名称。当然，你可能会将某物命名为\
  \ `Prime`，而走廊隔壁另一个办公室写代码的家伙可以将另一个东西命名为 `Prime`。这没关系，因为 Java 对 `Prime` 没有预设含义。在你的程序中，你可以让\
  \ `Prime` 代表联邦储备的优惠利率。而走廊那头的家伙可以让 `Prime` 代表“面包、圆面包、果酱和顶级肋排”。这不会产生冲突，因为你和你的同事正在编写两个不同的\
  \ Java 程序。\n    *   **来自 API 的标识符：** JCP 成员为许多事物创建了名称，并将数万个此类名称抛入 Java API 中。API\
  \ 随每个 Java 版本提供，因此这些名称对任何编写 Java 程序的人都可用。此类名称的示例有 `String`、`Integer`、`JWindow`、`JButton`、`JTextField`\
  \ 和 `File`。\n\n\n\n\n\n![ontheweb](img/ontheweb.png) 你不需要在代码列表 3-1（或本书中的任何其他代码列表）中输入代码。要下载书中的所有代码，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n当你运行代码列表 3-1 中的程序时，计算机会显示 `You'll love Java!`！（图 3-1 显示了当你使用 `Eclipse` IDE 时 `Displayer`\
  \ 程序的输出结果。）现在，我承认仅仅为了让 `You'll love Java!` 出现在某人的电脑屏幕上，编写并运行一个 Java 程序就要费很大精力，但每项尝试都要从哪里开始。\n\
  \n![image](img/9781119235552-fg0301.png)\n\n图 3-1： 我使用 `Eclipse` 来运行代码列表 3-1 中的程序。\n\
  \n![ontheweb](img/ontheweb.png) 想要查看如何运行代码列表 3-1 中的代码，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \n在接下来的节中，你将不仅仅是赞叹程序的输出。在读完本节后，你将真正理解代码列表 3-1 中的程序是如何工作的。\n\n## 理解一个简单的 Java 程序\n\
  \n本节将介绍、解释、分析、剖析并通过其他方式消除之前在代码列表 3-1 中显示的 Java 程序。\n\n### Java 类\n\n由于 Java 是一门面向对象的编程语言，你的首要目标是描述类和对象。（如果你对此不服，请阅读第\
  \ 1 章中关于面向对象编程的章节。）\n\n在那些我感性的特殊日子里，我会告诉人们，Java 在面向对象方面比许多其他所谓的面向对象的语言更纯粹。我之所以这么说，是因为在\
  \ Java 中，在你创建某种类之前，你什么也做不了。这就像是在《危险游戏》（Jeopardy!）节目中，听到 Alex Trebek 说：“让我们进入广告”，然后你打断他说：“抱歉，Alex。在不把指令放在类里面的情况下，你是无法发布指令的。”\n\
  \n代码列表 3-1 中的代码是一个 Java 程序，该程序描述了一个类。这个程序是我编写的，所以我可以为我的新类起一个名字。我选择了 `Displayer`\
  \ 这个名字，因为程序在电脑屏幕上显示了一行文本。这就是为什么代码列表 3-1 的第一行包含了 `class Displayer` 单词。（参见图 3-2。）\n\
  \n![image](img/9781119235552-fg0302.png)\n\n图 3-2： 一个 Java 程序就是一个类。\n\n代码列表 3-1\
  \ 中的前两个单词 `public` 和 `class` 是 Java 关键字。（参见本章前面的章节“[Java 程序中的单词”。）无论由谁编写 Java 程序，`public`\
  \ 和 `class` 单词的使用方式始终是相同的。另一方面，代码列表 3-1 中的 `Displayer` 是一个标识符。我在编写本章时构思了 `Displayer`\
  \ 这个单词。`Displayer` 是一个特定类的名称——是我编写该程序时创建的。\n\n## 理解方法\n\n在 Java 中，方法是一组组合在一起执行特定操作的语句。你可以将方法视为子程序或函数。\n\
  \n代码列表 3-2： 方法声明\n\n```java\nvoid fixTheAlternator(onACertainCar) {\n```\n\n\n\n\
  \n```\ndriveInto(car, bay);\nlift(hood);\nget(wrench);\nloosen(alternatorBelt);\n\
  …\n}\n```\n\n在我的 Java 代码的某处（位于列表 3-2 之外），我需要一条指令来调用我的 `fixTheAlternator` 方法。调用 `fixTheAlternator`\
  \ 方法的指令看起来可能像列表 3-3 中的那行代码。\n\n**列表 3-3：方法调用**\n\n```\nfixTheAlternator(junkyOldFord);\n\
  ```\n\n现在你已经对什么是方法以及它是如何工作的有了基本的了解，你可以更深入地研究一些实用的术语了：\n\n- 如果我偷懒，我会把列表 3-2 中的代码称为\
  \ `method`（方法）。如果我不偷懒，我会把这段代码称为 `method declaration`（方法声明）。\n- 列表 3-2 中的方法声明包含两个部分。第一行（包含\
  \ `fixTheAlternator` 的部分，直到但不包括左大括号）是 `method header`（方法报头）。列表 3-2 的其余部分（被大括号包围的部分）是\
  \ `method body`（方法体）。\n- `method declaration` 一词将列表 3-2 中的指令列表与列表 3-3 中的指令区分开来，后者被称为\
  \ `method call`（方法调用）。\n\n![remember](img/remember.png) `method’s declaration`（方法的声明）告诉计算机如果调用该方法会发生什么。`method\
  \ call`（一段独立的代码）则告诉计算机实际上去调用该方法。方法的声明和方法的调用通常位于 Java 程序的不同部分。\n\n### 程序中的 main 方法\n\
  \n图 3-3 包含了列表 3-1 中代码的副本。代码的大部分包含一个名为 `main` 的方法的声明。（只需在代码的方法报头中寻找 `main` 单词即可。）目前，不要担心方法报头中的其他单词：`public`、`static`、`void`、`String`\
  \ 和 `args`。我将在接下来的章节中解释这些单词。\n\n![image](img/9781119235552-fg0303.png)\n\n**图 3-3：main\
  \ 方法。**\n\n就像任何 Java 方法一样，main 方法像是一份食谱：\n\n```\n如何制作饼干：\n加热烤箱。\n揉面团。\n烘烤揉好的面团。\n\
  ```\n或者\n\n```\n如何遵循 Displayer 的主指令：\n在屏幕上打印“You'll love Java!”。\n```\n\n`main`\
  \ 这个单词在 Java 中起着特殊的作用。特别是，你永远不会编写显式调用 main 方法执行的代码。`main` 单词是程序开始运行就会自动被调用的方法名。\n\
  \n回看图 3-1。当 Displayer 程序运行时，计算机会自动找到程序的 `main` 方法，并执行方法体内的任何指令。在 Displayer 程序中，main\
  \ 方法体只有一条指令。那条指令告诉计算机在屏幕上打印 `You'll love Java!`。因此在图 3-1 中，`You'll love Java!` 出现在计算机屏幕上。\n\
  \n![remember](img/remember.png) 方法中的指令在方法被调用之前不会执行的。但是，如果你给一个方法命名为 `main`，那么这个方法就会被自动调用。\n\
  \n![technicalstuff](img/technicalstuff.png) 几乎每种计算机编程语言都有类似于 Java 方法的东西。如果你工作过其他语言，你可能记得像子程序（subprograms）、过程（procedures）、函数（functions）、子例（subroutines）、子过程（subprocedures）之类的术语。无论在你最喜欢的编程语言中如何称呼它，方法都是一组收集在一起并赋予新名称的指令。\n\
  \n### 你最终如何告诉计算机做某事\n\n在列表 3-1 的核心深处，隐藏着一行实际上向计算机发出直接指令的语句。这一行在图 3-4 中被高亮，告诉计算机显示\
  \ `You'll Java!`。这一行是一个 `statement`（语句）。在 Java 中，语句是一条告诉计算机执行某操作的直接指令（例如，显示这段文本、在那个内存中存入\
  \ 7、创建一个窗口）。\n\n![image](img/9781119235552-fg0304.png)\n\n**图 3-4：一条 Java 语句。**\n\
  \n![remember](img/remember.png) 在 `System.out.println` 中，倒数第二个字符是小写字母 `l`，而不是数字\
  \ `1`。\n\n当然，Java 有不同类型的语句。我在早之前的“Java 方法”部分中介绍的方法调用是许多 Java 语句类型之一。列表 3-3 向你展示了方法调用的样子，图\
  \ 3-4 也包含一个看起来像这样的方法调用：\n\n```\nSystem.out.println(\"You'll love Java!\");\n```\n\
  \n当计算机执行这条语句时，计算机会调用一个名为 `System.out.println` 方法。（是的，在 Java 中，名称可以包含点。这些点是有含义的。）\n\
  \n![warning](img/warning.png) 我已经说过了，但值得重复：在 `System.out.println` 中，倒数第二个字符是小写字母\
  \ `l`（如单词 line 所示），而不是数字 `1`（如数字一）。如果你使用数字 `1`，你的代码将无法工作。只需将 `println` 视为“打印行”的意思，你就不会有任何问题。\n\
  \n要了解 Java 名称中点的含义，请参见第 7 章。\n\n图 3-5 说明了 `System.out.println` 的情况。实际上，有两个方法在 Displayer\
  \ 运行中起着作用。它们的工作方式如下：\n\n- **有一个 main 方法声明。** main 方法是我我自己写的。每当我运行 Displayer 程序时，这个\
  \ main 方法就会被自动调用。\n- **有一个对 System.out.println 方法的调用。** System.out.println 方法调用是\
  \ main 方法体唯一的语句。换句话说，调用 `System.out.println` 方法是 main 方法清单上的唯一事项。\n\n`System.out.println`\
  \ 方法的声明隐藏在官方 Java API 之中。要复习 Java API，请参见本章前面的“语法和常用名称”以及“Java 程序中的单词”部分。\n\n![image](img/9781119235552-fg0305.png)\n\
  \n**图 3-5：调用 System.out.println 方法。**\n\n\n\n\n在 Java 中，每条语句（如图 3-4 中框选的行）都以分号结束。图\
  \ 3-4 中的其他行没有以分号结束，因为图 3-4 中的其他行并不是语句。例如，方法头（包含 `main` 单词的所在行）并没有直接告诉计算机要做任何事。方法头是在宣告：“万一你以后想执行\
  \ `main`，接下来的几行代码将告诉你如何操作。”\n\n![remember](img/remember.png) 每一个完整的 Java 语句都以分号结束。\n\
  \n### 大括号\n\n很久以前，或者也许并不久以前，你的老师们告诉过你大纲有多么有用。有了大纲，你可以组织思想和想法，帮助人们看到森林而非树木，并通常能证明你是一个“整洁人士俱乐部”的成员。嗯，一个\
  \ Java 程序就像一个大纲。代码列表 3-1 中的程序以一行行头开始，上面写着：“这里有一个名为 `Displayer` 的类”；在该行头之后，一个子标题宣布：“这里有一个名为\
  \ `main` 的方法”。\n\n现在，如果一个 Java 程序像一个大纲，为什么程序看起来不像大纲呢？什么取代了罗马数字、大写字母和其他项目？答案有两层含义：\n\
  \n*   在 Java 程序中，大括号包围了有意义的代码单元。\n*   你，作为程序员，可以（并且应该）对行进行缩进，以便其他程序员能够一眼看出你代码的大纲形式。\n\
  \n在大纲中，所有内容都隶属于罗马数字 `I.` 下的项目。在 Java 程序中，所有内容都隶属于顶行——包含 `class` 单词的所在行。为了指示代码中的所有其他内容隶属于该类行，你使用了大括号。代码中的所有其他内容都放在这些大括号内部。（参见代码列表\
  \ 3-4。）\n\n代码列表 3-4： Java 类的大括号\n\n```java\npublic class Displayer {\n    public\
  \ static void main(String args[]) {\n        System.out.println(\"You'll love Java!\"\
  );\n    }\n}\n```\n\n在大纲中，某些内容隶属于大写字母 `A` 项目。在 Java 程序中，某些行隶属于方法头。为了指示某项内容隶属于方法头，你使用了大括号。（参见代码列表\
  \ 3-5。）\n\n代码列表 3-5： Java 方法的大括号\n\n```java\npublic class Displayer {\n    public\
  \ static void main(String args[]) {\n        System.out.println(\"You'll love Java!\"\
  );\n    }\n}\n```\n\n在大纲中，某些项目处于食物链的底层。在 `Displayer` 类中，对应的行是以 `System.out.println`\
  \ 开头的那行。因此，这行 `System.out.println` 位于所有其他大括号内部，并且比其他任何行都缩进得深。\n\n![remember](img/remember.png)\
  \ 永远不要忘记，Java 程序首先是一个大纲。\n\n如果你把大括号放在了错误的位置，或者在应该有大括号的地方漏了大括号，你的程序可能完全无法运行。如果你的程序运行了，它可能运行结果错误。\n\
  \n如果你不以提供信息的方式对代码行进行缩进，你的程序仍然可以正确运行，但你或任何其他程序员都无法理解你在编写代码时在想什么。\n\n如果你是一个视觉型思考者，你可以在脑海中勾勒\
  \ Java 程序的大纲。我的一位朋友可以将一个真实的编号大纲想象变成一个 Java 程序。（参见图 3-6）。另一位不具名的人使用了更奇诡的意象。（参见图 3-7。）\n\
  \n![image](img/9781119235552-fg0306.png)\n\n图 3-6： 大纲变成了一个 Java 程序\n\n![image](img/9781119235552-fg0306.png)\
  \ 图 3-7： 大括号\n\n\n\n\n有一天，当她快要完成项目时，她收到一封来自医疗保险公司的令人不安的纸质邮件。不，这封信不是关于大疾病，而是关于一次常规的办公室门诊。保险公司的理赔表上有一个填写简恩出生日期的地方，就好像自从她上次提交理赔以来，她的出生日期改变了。她心不在焉地随手写了\
  \ `2016` 作为她的出生年份，因此保险公司拒绝支付该账单。\n\n简恩拨了保险公司的电话。在 20 分钟内，她接通了人工服务。“很抱歉，”人工客服说，“要解决这个问题，你必须拨打另一个号码。”好吧，你可以猜到接下来发生了什么。“抱歉，另一个接线员给了你错误的号码。”接着是，“抱歉，你必须拨回原始的电话号码。”\n\
  \n五个月后，简恩的耳朵生疼，但在电话里打了 `800` 小时后，她终于得到了一个初步承诺，即保险公司将重新处理这笔理赔。尽管她非常高兴，但她急于回到她的编程项目中。她还能记得那些代码代码原本是做什么的吗？\n\
  \n不，她记不得。简恩盯着自己的工作看，就像第二天早上醒来一个毫无意义的梦一样，这些代码对她来说完全没有意义。她写了数百万行代码，却没有一行代码配有任何说明性的注释。她没有留下任何线索帮助自己理解当时在想什么，因此在沮丧中，她放弃了整个项目。\n\
  \n### 为你的代码添加注释\n\n代码列表 3-6 是本章示例程序的增强版本。除了所有的关键字、标识符和标点符号外，列表 3-6 还包含了人类阅读的文本。\n\
  \n列表 3-6： 三种注释\n\n```java\n/*\n* Listing 3-6 in \"Java For Dummies, 7th Edition\"\
  \n*\n** Copyright 2017 Wiley Publishing, Inc.\n* All rights reserved.\n*/\n\n/**\n\
  * The Displayer 类用于在\n* 屏幕上显示文本。\n*\n* @author Barry Burd\n* @version 1.0 1/24/17\n\
  * @see java.lang.System\n*/\npublic class Displayer {\n    /**\n     * main 方法是代码\n\
  \     * 执行开始的地方。\n     *\n     * @param args (参见 第 11 章。)\n     */\n    public static\
  \ void main(String args[]) {\n        System.out.println(\"I love Java!\"); // I?\
  \ You?\n    }\n}\n```\n\n*注释*是程序内部特殊的文本区域，其目的是帮助人们理解程序。注释是良好程序文档的一部分。\n\nJava 编程语言有三种注释：\n\
  \n*   **传统注释：** 列表 3-6 的前五行构成了一个*传统*注释。注释以 `/*` 开头，以 `*/` 结束。起始 `/*` 和结束 `*/` 之间的所有内容仅供人类阅读。编译器不会翻译任何关于“Java\
  \ For Dummies, 7th Edition”或 Wiley Publishing, Inc. 的信息。\n\n    ![交叉引用](img/crossreference.png)\
  \ 欲了解编译器知识，请参 第 2 章。\n\n    列表 3-6 中的第二、三、四、五行有额外的星号（`*`）。我称它们为额外，是因为在创建注释时并不这些星号。它们只是让注释看起来更好看。我将它们包含在\
  \ 列表 3-6 中，因为由于我不完全理解的原因，大多数 Java 程序员都会添加这些额外的星号。\n\n*   **行尾注释：** 列表 3-6 中的文本 `//I?\
  \ You?` 是行尾注释。\n\n*   **Javadoc 注释：** *javadoc* 注释以 `/**` 开始，以 `*/` 结束。\n\n\n\n\
  你可能会听到程序员谈论*注释掉（comment out）*代码的某些部分。当你编写程序且某些部分运行不正常时，尝试移除代码通常会有帮助。此外，你可能不喜欢代码被移除后的结果，因此你不想完全删除代码。相反，你可以将普通的\
  \ Java 语句转换为注释。例如，你将：\n\n```java\nSystem.out.println(\"I love Java!\");\n```\n\n\
  转换为注释\n\n```java\n// System.out.println(\"I love Java!\");\n```\n\n这种更改可以在你查找程序问题时防止\
  \ Java 编译器看到这些代码。\n\n传统的注释在注释代码并不并不用。最大的问题是你不能在一个注释内部嵌套另一个注释。假设你想注释掉以下语句：\n\n```java\n\
  System.out.println(\"Parents,\");\nSystem.out.println(\"pick your\");\n/*\n* Intentionally\
  \ displays on separate lines\n*/\nSystem.out.println(\"battles\");\nSystem.out.println(\"\
  carefully!\");\n```\n\n如果你尝试将这段代码转换为一个传统的注释，你会得到下面的混乱：\n\n```java\n/*\nSystem.out.println(\"\
  Parents,\");\nSystem.out.println(\"pick your\");\n/*\n* Intentionally displays on\
  \ separate lines\n*/\nSystem.out.println(\"battles\");\nSystem.out.println(\"carefully!\"\
  );\n*/\n```\n\n第一个 `*/`（在 *Intentionally displays* 之后）提前结束了传统的注释。导致 `battles` 和\
  \ `carefully` 语句没有被注释掉，而最后一个 `*/` 则会导致编译器报错。因此，我建议使用行注释作为实验代码的工具。\n\n![ontheweb](img/ontheweb.png)\
  \ 大多数 IDE 都可以自动为你注释掉代码部分。更多详情，请访问本书的网站（[www.allmycode.com/JavaForDummies](http://www.allmycode.com/JavaForDummies)）。\n\
