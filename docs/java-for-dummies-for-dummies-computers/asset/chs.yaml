  \n\n\n```java\nSystem.out.println(numberOfBunnies -= 7);\nSystem.out.println(numberOfBunnies\
  \ = 100);\n}\n}\n```\n\nListing 4-8 展示了 Java 赋值运算符是多多通用。通过赋值运算符，你可以对变量进行任何数字的加、减、乘、除。注意\
  \ `+= 5` 如何给 `numberOfBunnies` 加 `5`，`*= 2` 如何将 `numberOfBunnies` 乘以 `2`。你甚至可以使用另一个表达式的值（在\
  \ Listing 4-8 中的 `numberExtra`）作为应用的数字。\n\nListing 4-8 中的最后两行演示了 Java 赋值运算符的一个特殊之处。你可以将赋值运算符作为更大\
  \ Java 语句的一部分。在 Listing 4-8 的倒数第二行中，运算符从 `numberOfBunnies` 中减去 `7`，将 `numberOfBunnies`\
  \ 的值从 `172` 减少到 `165`。然后整个赋值操作被放入 `System.out.println` 调用中，因此 `165` 显示在屏幕上。\n\n\
  看吧，Listing 4-8 的最后一行展示了你如何使用 Java 的普通等号完成同样的事情。我在在本章开头称之为赋值语句的东西，实际上是我在本节中描述的赋值运算符之一。因此，每当你给某个东西赋值时，都可以让该赋值成为更大语句的一部分。\n\
  \n![technicalstuff](img/technicalstuff.png) 赋值运算符的每次使用都兼具语句和表达式的双重职责。在所有情况下，表达式的值等于你赋值的任何值。例如，在执行代码\
  \ `System.out.println(numberOfBunnies -= 7)` 之前，`numberOfBunnies` 的值为 `172`。作为语句，`numberOfBunnies\
  \ -= 7` 告诉计算机从 `numberOfBunnies` 中减去 `7`（因此 `numberOfBunnies` 的值从 `172` 变为 `165`）。作为表达式，`numberOfBunnies\
  \ -= 7` 的值为 `165`。因此，代码 `System.out.println(numberOfBunnies -= 7)` 意味着 `System.out.println(165)`。数字\
  \ `165` 显示在计算机屏幕上。\n\n关于此类内容的更详细解释，请参见本章前面的侧边栏“语句和表达式”。\n\n![tryitout](img/tryitout.png)\
