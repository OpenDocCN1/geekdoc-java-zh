  \ 和 7-9 中的代码，与运行列表 7-1 没有区别。\n\n### 将这些字段设为私有\n\n要点在于，让事情看起来简单需要一些规划。在面向对象编程中，让事情看起来简单的方法之一是防止类外部代码直接使用在类内部定义的字段。看一眼列表\
  \ 7-1 中的代码。你正在一家公司工作，这家公司刚刚为 `Account` 类的代码花费了 1000 万美元。（平均每行代码就超过了 150 万美元！）现在，你的任务是编写\
