  \n\n\n\n![image](img/9781119235552-fg0502.png)\n\nFIGURE 5-2: 一个 `if` 语句就像路口的分叉路。\n\
  \n`inputNumber` 的值等于 `randomNumber` 的值吗？当条件为真时，计算机会执行条件与 `else` 单词之间的内容。当条件被证明为假时，计算机会执行\
  \ `else` 单词之后的内容。无论何种，计算机都会继续执行最后一个 `println` 调用，它会显示“Thank you for playing”（感谢参与）。\n\
  \n![remember](img/remember.png) `if` 语句中的条件必须包含在括号内。然而，像 `if (inputNumber == randomNumber)`\
  \ 这样的行并不是一个完整的语句（就像“如果我有把锤子”并不是一个完整的句子）。所以这一行 `if (inputNumber == randomNumber)`\
  \ 不应该以分号结尾。\n\n![technicalstuff](img/technicalstuff.png) 有时，当我编写关于正在测试的条件时，我会不小心使用\
  \ `expression`（表达式）一词而不是 `condition`（条件）。没关系，因为每个条件都是一个表达式。表达式是一个有值的东西，而每个条件确实都有值。条件的值要么是\
  \ `true` 就是 `false`。（有关表达式以及 `true` 和 `false` 等值的信息，请参阅第 4 章。）\n\n### 双等号\n\n在 Listing\
  \ 5-1 中，在 `if` 语句的条件中注意双等号的使用。比较两个数字以查看它们是否相同，与将某个值设为另一个值是不一样的。这就是为什么用于比较相等性的符号与赋值或初始化中使用的符号不同。在\
  \ `if` 语句的条件中，你不能用单等号替换双等号。如果你 true 这样做，你的程序将无法工作。（当你尝试编译代码时，几乎总是会收到错误信息。）\n\n另一方面，如果你从不犯在条件中使用单等号的错误，那你就不正常了。不久前，当我教一门\
  \ Java 入门课程时，我承诺如果任何实验课期间没有人犯使用单等号的错误，我就吃掉我的激光笔。这并不是空洞的承诺。我知道我永远不需要履行这个承诺。事实证明，即使我忽略了实验课期间任何人犯下的前十次单等号错误，我仍然不需要处理激光笔。每个人在编程生涯中都会错误地使用几次单等号。\n\
  \n![tip](img/tip.png) 诀窍不在于避免犯单等号的错误；诀窍在于每当你犯下该错误时都能发现它。\n\n### 准备好大括号\n\nListing\
  \ 5-1 中的 `if` 语句有两个部分：上半部分和下半部分。我为 `if` 语句的这两个部分取了名字。我把它们称为 `if part`（上半部分）和 `else\
  \ part`（下半部分）。\n\nListing 5-1 中的 `if part` 似乎包含多个语句。我通过用一对大括号将 `if part` 的三个语句括起来来实现这一点。当我这样做时，我就形成了一个\
  \ `block`（块）。一个 `block` 是一个由一对大括号挤在一起的一组语句。\n\n通过这个块，三次 `println` 调用被安全地安置在 `if\
  \ part` 内部。有了大括号，星号的行行和“You win”（你赢了）这些单词只有在用户猜测正确时才会显示。\n\n这种块和大括号的操作也适用于 `else\
  \ part`。在 Listing 5-1 中，每当 `inputNumber` 不等于 `randomNumber` 时，计算机就会执行三个 `print/println`\
  \ 调用。为了让计算机相信三个调用都在 `else` 子句中，我将这些调用放入一个块中。也就是说，我将这三个调用封装在一对大括号中。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 严格来说，Listing 5-1 在 `if` 和 `else` 语句之间只有一个语句，在 `else` 语句之后也只有一个语句。诀窍在于，当你把一组语句放在大括号内时，你就得到了一个块；而一个块在各方面表现得像一个单一语句。事实上，Java\
  \ 官方文档将块列为许多语句类型之一。因此，在 Listing 5-1 中，打印 You win 的块是一个内部包含三个语句的单一语句。\n\n### 缩进 if\
  \ 语句\n\n注意在 Listing 5-1 中，打印语句的缩进很有帮助。在小型程序中，未缩进或缩进不当的代码是可以忍受的。但在复杂的程序中，不整洁的缩进是一个噩梦。\n\
  \n![ontheweb](img/ontheweb.png) 许多 Java IDE 有自动缩进代码的工具。事实上，缩进是我最喜欢的功能之一。\n\n![warning](img/warning.png)\
  \ 当你编写 if 语句时，你可能会放弃规则仅仅依赖缩进。这在 Python 和 Haskell 等语言中可行，但在 Java 中无效。\n\n### 没有 else\
  \ 的 if\n\n好吧，这一节的标题是编出来的。有什么大！想法是你可以创建一个没有 `else` 部分的 `if` 语句。例如，参考 Listing 5-1\
  \ 中的代码。也许你更愿意在用户输的时候得意一下。Listing 5-2 中的修改后的代码展示了如何实现这一点（图 5-3\n\nFIGURE 5-3: Listing\
  \ 5-2 中的两次游戏运行。\n\n\n\n\n\n```java\n}\n\nout.println(\"That was a very good guess\
  \ :-)\");\nout.print(\"The random number was \");\nout.println(randomNumber + \"\
  .\");\nout.println(\"Thank you for playing.\");\nkeyboard.close();\n}\n\n}\n```\n\
  \nListing 5-2 中的 `if` 语句没有 `else` 部分。当 `inputNumber` 与 `randomNumber` 相同时，计算机会打印\
  \ `You win`。当 `inputNumber` 与 `randomNumber` 不同时，计算机就不会打印 `You win`。\n\nListing\
  \ 5-2 展示了另一个新。通过对 `System.in` 进行导入声明，我可以将 `new Scanner(System.in)` 简化为更短的 `new Scanner(in)`。添加这个导入声明并不值得费力。事实上，使用导入声明时打的字符比不使用时还要多。尽管如此，Listing\
  \ 5-2 中的代码证明了导入 `System.in` 是可能的。\n\n![tryitout](img/tryitout.png) 在第 4 章中，Listing\
  \ 4-5 会告诉你电梯能否挤下十个人。该列表代码的运行情况如下：\n\n```\nTrue or False?\nYou can fit all ten of\
  \ the\nBrickenchicker dectuplets\non the elevator:\nfalse\n```\n\n利用你对 Java `if`\
  \ 语句的知识，让程序的输出更加自然。根据程序变量 `elevatorWeightLimit` 的值，输出应该是：\n\n```\nYou can fit all\
  \ ten of the\nBrickenchicker dectuplets\non the elevator.\n```\n\n或者\n\n```\nYou\
  \ can't fit all ten of the\nBrickenchicker dectuplets\non the elevator.\n```\n\n\
  ## 在 JShell 中使用块\n\n第 4 章 引入了 Java 9 的交互式 JShell 环境。你输入一个语句，JShell 会立即通过执行该语句做出响应。对于简单的语句这没问题，但当你块内部有一个语句时会发生什么呢？\n\
  \n在 JShell 中，你可以用一个或多个块开始输入语句。在你完成整个语句（包括所有块）之前，JShell 不会响应。要查看它是如何工作的，请看我最近与 JShell\
  \ 的这段对话：\n\n```\njshell> import static java.lang.System.out\njshell> import java.util.Random\n\
  jshell> int randomNumber = new Random().nextInt(10) + 1\nrandomNumber ==> 4\njshell>\
  \ int inputNumber = 4\ninputNumber ==> 4\njshell> if (inputNumber == randomNumber)\
  \ {\n…> out.println(\"You win.\");\n…> }\nYou win.\njshell>\n```\n\n在这段对话中，我将输入的文本加了**粗体**。JShell\
  \ 的响应没有加粗。\n\n当我输入 `if (inputNumber == randomNumber) {` 并按回车时，JShell 并没有做什么。JShell\
  \ 只显示 `…>` 提示符，表示我输入的任何行都没有构成一个完整的语句。我必须通过输入 `if` 语句的剩余部分来响应。\n\n当我用右大括号完成 `if`\
  \ 语句时，JShell 承认我输入了一个完整的语句。JShell 执行该语句并在（在本例中）显示了 *You win.*。注意 `out.println` 行末尾的分号：\n\
  \n*   当你输入一个不在块内部的语句时，JShell 允许省略语句末尾的分号。\n*   当你输入一个块内部的语句时，JShell（像 Listing 5-2\
  \ 中的普通 Java 一样）不允许你省略分号。\n\n![tip](img/tip.png) 当你在 JShell 中输入一个块时，你始终可以选择将整个块写在一行，没有换行符，如下：\n\
  \n```java\nif (inputNumber == randomNumber) { out.println(\"You win.\"); }\n```\n\
  \n## 使用比较运算符和逻辑运算符构建条件\n\nJava 编程语言有许多小符号和装饰来满足你各种构建条件的需求。本节将为你详细介绍它们。\n\n### 比较数字；比较字符\n\
  \n表 5-1 展示了你可以用于比较一个值与另一个值的运算符。\n\n| 运算符符号 | 含义 | 示例 |\n| :--- | :--- | :--- |\n\
  | `==` | 等于 | `numberOfows == 5` |\n| `!=` | 不等于 | `numberOfClicked != 5` |\n| `<`\
  \ | 小于 | `numberOfows < 5` |\n| `>` | 大于 | `myInitial > 'B'` |\n| `<=` | 小于等于 |\
  \ `numberOfows <= 5` |\n| `>=` | 大于等于 | `myInitial >= 'B'` |\n\n### 比较对象\n\n当你开始处理对象时，你会发现可以使用\
  \ `==` 和 `!=` 来比较对象。例如，屏幕上的按钮就是一个对象。你可以判断刚刚点击的是否是特定的按钮。你可以通过 Java 的相等运算符来实现：\n\n\
  ```java\nif (e.getSource() == b) {\n    clipboard.setText(which.getText());\n}\n\
  ```\n\n![crossreference](img/crossreference.png) 要了解更多关于响应点击的信息，请阅读第 16 章。Java 比较方案的大陷阱出现在比较两个字符串时。（关于\
  \ String 类型的字，请参见第 4 章）。当你比较两个字符串时，不想使用双等号。使用双等号是在询问：“这个字符串在内存中的位置与另一个字符串完全相同吗？”通常不是你想问的。相反，你通常想问：“这个字符串包含的字符与另一个字符串相同吗？”为了问第二个问题（更合适的问题），String\
  \ 类型有一个名为 `equals` 的方法。（像已知宇宙中的其他事物一样，这个 `equals` 方法定义在 Java API 中，应用程序编程接口。）`equals`\
  \ 方法比较两个字符串以查看它们包含的字符是否相同。使用 Java `equals` 方法的示例参见 Listing 5-3（图 5-4 显示了 [Listing\
  \ 5-3] 中程序的运行情况。）\n\n\n\n\n\n# 检查密码\n\n```java\nimport static java.lang.System.*;\n\
  import java.util.Scanner;\n\npublic class CheckPassword {\n    public static void\
  \ main(String args[]) {\n        out.print(\"What's the password?\");\n        Scanner\
  \ keyboard = new Scanner(in);\n        String password = keyboard.next();\n    \
  \    out.println(\"You typed >>\" + password + \"<<\");\n        out.println();\n\
  \        if (password == \"swordfish\") {\n            out.println(\"The word you\
  \ typed is stored\");\n            out.println(\"in the same place as the real\"\
  );\n            out.println(\"password. You must be a\");\n            out.println(\"\
  hacker.\");\n        } else {\n            out.println(\"The word you typed is not\"\
  );\n            out.println(\"stored in the same place as\");\n            out.println(\"\
  the real password, but that's\");\n            out.println(\"no big deal.\");\n\
  \        }\n        out.println();\n        if (password.equals(\"swordfish\"))\
  \ {\n            out.println(\"The word you typed has the\");\n            out.println(\"\
  same characters as the real\");\n            out.println(\"password. You can use\
  \ our\");\n            out.println(\"precious system.\");\n        } else {\n  \
  \          out.println(\"The word you typed doesn't\");\n            out.println(\"\
  have the same characters as\");\n            out.println(\"the real password. You\
  \ can't\");\n            out.println(\"use our precious system.\");\n        }\n\
  \        keyboard.close();\n    }\n}\n```\n\n在 Listing 5-3 中，调用 `keyboard.next()`\
  \ 会获取用户在计算机键盘上输入的任何单词。代码将该单词存入名为 `password` 的变量中。然后，程序的 `if` 语句使用了两种不同的技术来比较 `password`\
  \ 和 \"swordfish\"。\n\n在两种技术中，更合适的是使用 Java 的 `equals` 方法。`equals` 方法看起来看起来很奇怪，因为当你调用它时，你需要在一个字符串后面加一个点，并将另一个字符串放在括号里。但这就是你必须这样做。\n\
  \n在调用 Java 的 `equals` 方法时，哪个字符串加点、哪个字符串加括号并不重要。例如，在 Listing 5-3 中，你可以写成：\n\n```java\n\
  if (\"swordfish\".equals(password))\n```\n\n该方法的效果同样良好。\n\n调用 Java 的 `equals` 方法看起来是不平衡的，但并非如此。点和括号之间这种表面的不平衡背后是有原因的。这种想法是你有两个对象：`password`\
  \ 对象和 \"swordfish\" 对象。这两个对象都是 `String` 类型。（不过，`password` 是一个 `String` 类型的变量，而 \"\
  swordfish\" 是一个 `String` 直接字面量。）当你写 `password.equals(\"swordfish\")` 时，你正在调用一个属于\
  \ `password` 对象的 `equals` 方法。当你调用该方法时，你正将 \"swordfish\" 作为方法的参数传递给该方法（这里是个双关）。\n\
  \n你可以在第 7 章中阅读更多关于属于对象的方法的知识。\n\n在比较字符串时，请使用 `equals` 方法 —— 而双双等号。\n\n### 一次性导入所有内容\n\
  \nListing 5-3 的第一行说明了一种偷懒的办法，可以同时导入 `System.out` 和 `System.in`。要导入 `System` 提供的所有内容，你可以使用星号通配符（`*`）。事实上，导入\
  \ `java.lang.System.*` 相当于拥有了大约 30 个独立的导入声明，包括 `System.in`、`System.out`、`System.err`、`System.nanoTime`\
  \ 以及许多其他 `System` 相关内容。\n\n在 `import` 语句中使用星号通常被认为是不良的编程习惯，因此我在本书的示例中并不经常这样做。但对于较大的程序——使用了\
  \ Java API 中几十个名称的程序——这种偷懒的星号技巧是非常实用的。\n\n你不能在 `import` 语句的任何地方随意放置星号。例如，你不能通过编写\
  \ `import java.*` 来导入所有以 `java` 开头的内容。你只能用星号替换类名，或者隐藏在类内部的静态成员名称。关于 `import` 语句中星号的更多信息，请参阅第\
  \ 9 章。关于静态内容的信息，请参阅第 10 章。\n\n### Java 的逻辑运算符\n\n斯波克先生会感到高兴：Java 拥有你混合和组合逻辑测试所需的所有运算符。这些运算符如表\
  \ 5-2 所示。\n\n| 运算符符号 | 含义 | 示例 |\n| :--- | :--- | :--- |\n| `&&` | 与 (and) | `5\
  \ < x && 10` |\n| `||` | 或 (or) | `5 < x || 10` |\n| `!` | 非 (not) | `!password.equals(\"\
  swordfish\")` |\n\n你可以使用这些运算符构建各种条件。Listing 5-4 是一个示例。\n\n### 检查用户名和密码\n\n```java\n\
