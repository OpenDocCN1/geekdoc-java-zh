  \ –1.8 × 10³⁰⁸ 到 1.8 × 10³⁰⁸ 之间的数字。（这些是小数点前有 308 个零的巨大数字。世界上最富有的人才会写出带有 308 个零的支票。这些数字中的第二个是千万亿（octillion）。）\n\
  \n比 `double` 类型范围更重要的是 `double` 可以具有小数点之外的数字。在很多情况下，你在 float 和 double 之间进行选择。但不要纠结于\
