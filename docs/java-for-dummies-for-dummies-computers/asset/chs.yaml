  \ 的对象交给 `displayMe` 方法时，`displayMe` 方法就知道了该怎么做。`displayMe` 方法知道它必须调用 `display()`\
  \ 方法。\n\n由于原始文本在后半部分出现了大量重复，此处仅翻译剩余的有效内容：\n\n抽象类\n\n**因此，当我定义我的 `HousePet` 类时，我想对宠物护理说明保持模糊。**而且在\
  \ Java 中，一个比较模糊的类被称为 `抽象类`。代码列表 15-7 有一个例子。\n\n```java\npublic abstract class HousePet\
  \ extends Animal {\n    String name;\n    public HousePet(String name, double weight,\
  \ String sound) {\n        super(weight, sound);\n        this.name = name;\n  \
  \  }\n    abstract public void howToCareFor();\n    public void about() {\n    \
  \    System.out.print(name + \" weighs \" + weight + \"pounds\");\n    }\n}\n```\n\
  \n\n\n\n```java\nSystem.out.print(sound != null ? (\" and says '\" + sound + \"\
  '\") : \"\");\nSystem.out.println(\".\");\n}\n```\n\n在代码列表 15-7 的第一行中，关键字 `abstract`\
  \ 告诉 Java `HousePet` 是一个抽象类。因为 `HousePet` 是抽象类，所以 `HousePet` 可以拥有抽象方法。在代码列表 15-7\
  \ 中，`howToCareFor` 是抽象方法。抽象方法有头部但没有方法体。在抽象方法的声明中，没有大括号——在通常出现大括号的地方，只有一个分号。\n\n\
  那么，当你尝试执行 `howToCareFor` 方法时，会发生什么？嗯，你实际上无法执行代码列表 15-7 中的`howToCareFor`方法。事实上，你甚至无法创建代码列表\
  \ 15-7 中定义的抽象类的实例。以下代码是非法的：\n\n```java\n// 非常糟糕的代码：\nHousePet myPet = new HousePet(\"\
  Boop\", 12.0, \"Meow\");\n```\n\n抽象类没有自己的生命。为了使用抽象类，你必须创建一个扩展该抽象类的普通（非抽象）类。在普通类中，所有方法都有方法体。这样一切就正常正常了。\n\
  \n![crossreference](img/crossreference.png) 在你离开代码列表 15-7 之前，注意该列表中的 `super(weight,\
  \ sound)` 调用。正如第 9 章一样，关键字 `super` 会触发对父类构造函数的调用。在代码列表 15-7 中，调用 `super(weight,\
  \ sound)` 就像调用代码列表 15-6 中的`Animal(double weight, String sound)`构造函数。构造函数为新对象的 `weight`\
  \ 和 `sound` 字段赋值。\n\n### 照顾你的宠物\n\n这里是来自《Java For Dummies》第 7 版的一段引用：\n\n“为了使用抽象类，你必须创建一个扩展该抽象类的普通（非抽象）类。”\n\
  \n因此，为了在代码列表 15-7 中使用 `HousePet` 类，你必须创建一个扩展 `HousePet` 类的类。代码列表 15-8 中的代码扩展了抽象的\
  \ `HousePet` 类，并为名为 `howToCareFor` 的方法提供了方法体。\n\n代码列表 15-8 狗的生活\n\n```java\npublic\
  \ class Dog extends HousePet {\n    int walksPerDay;\n    public Dog(String name,\
  \ double weight, int walksPerDay) {\n        super(name, weight, \"Woof\");\n  \
  \      walksPerDay = walksPerDay;\n    }\n    @Override\n    public void howToCareFor()\
  \ {\n        System.out.print(\"Walk \" + name);\n        System.out.println(\"\
  \ \" + walksPerDay + \" times each day.\");\n    }\n}\n```\n\n除了拥有名称、重量和声音之外，每只狗每天都会被遛几次。现在，因为有了\
  \ `howToCareFor` 方法体，你知道照顾狗意味着什么：意味着每天遛狗若干次。`HousePet` 类中 `howToCareFor` 方法是抽象的是一好事，因为你并不一定想遛其他类型的宠物。\n\
  \n以家猫为例。“照顾”猫可能意味着不要打扰它。猫还有其他不适用于狗的特征。例如，有些猫去室外，有些不是。你可以让室内猫的 `walksPerDay` 为 0，但这感觉像是在作弊。相反，每只猫可以有一个代表室内/室外状态的布尔值。代码列表\
  \ 15-9 提供了代码。\n\n如何养猫\n\n```java\npublic class Cat extends HousePet {\n    boolean\
  \ isOutdoor;\n    public Cat(String name, double weight, boolean isOutdoor) {\n\
  \        super(name, weight, \"Meow\");\n        isOutdoor = isOutdoor;\n    }\n\
  \    @Override\n    public void howToCareFor() {\n        System.out.println(isOutdoor\
  \ ? \"Let \" : \"Do not let \") + name + \" outdoors.\");\n    }\n}\n```\n\n`Dog`\
  \ 和 `Cat` 类都是 `HousePet` 类的子类。由于代码列表 15-7 中的抽象方法声明，`Dog` 和 `Cat` 类必须实现 `howToCareFor`\
  \ 方法。但这两个类中的 `howToCareFor` 方法非常不同。一个引用 `walksPerDay` 字段，另一个引用 `isOutdoor` 字段。因为\
  \ `HousePet` 类的 `howToCareFor` 方法是抽象的，所以没有默认行为。要么 `Dog` 和 `Cat` 类实现自己的 `howToCareFor`\
  \ 方法，要么这两个类无法扩展 `HousePet`。\n\n![technicalstuff](img/technicalstuff) 这一段描述了一个细节，如果你有任何这样做的倾向，可以忽略它：`Dog`\
  \ 和 `Cat` 类必须实现 `howToCareFor` 方法，因为 `Dog` 和 `Cat` 类不是抽象的。如果 `Dog` 和 `Cat` 类是抽象的（也就是说它们是扩展\
  \ `HousePet` 类的抽象类），那么 `Dog` 和 `Cat` 类就不需要实现 `howToCareFor`。`Dog` 和 `Cat` 类可以将实现传递给自己的子类。事实上，实现接口的抽象类不需要为接口方法提供方法体。抽象类可以利用许多漏洞。但为了利用这些漏洞，你必须创建一些特殊的示例。所以，在本章中我简化了故事并写道：a）扩展抽象类的类必须为抽象类的方法提供方法体，b）实现接口的类必须为接口的方法提供方法体。这并不完全，但目前足够了。如果你住在非常小的公寓里，可能没有空间养狗或猫。在这种情况下，代码列表\
  \ 15-10 适合你。\n\n你长大可能会变成一条鱼\n\n```java\npublic class Fish extends HousePet {\n \
  \   public Fish(String name, double weight) {\n        super(name, weight, null);\n\
  \    }\n    @Override\n    public void howToCareFor() {\n        System.out.println(\"\
  Feed \" + name + \" daily.\");\n    }\n}\n```\n\n我可以一直不断创建 `HousePet` 类的子类。多年前，我们的女儿养过几只宠物鼠。照顾老鼠意味着让猫远离它们。在\
  \ Java 中，子类像兔子一样大量繁殖。\n\n### 使用你所有的类\n\n在测试代码之前，你的工作还没有算完成。大多数程序需要数小时、几天甚至几个月的测试。但对于本章的\
  \ `HousePet` 示例，我只做一次测试。测试在代码列表 15-11 中。\n\n代码列表 15-11 动物园\n\n```java\npublic class\
