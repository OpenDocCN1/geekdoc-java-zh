  \n\n\n\n\n![crossreference](img/crossreference.png) 要了解什么是块（block），请参见第 5 章。然后，关于变量重新声明的真实讨论，请参见第\
  \ 10 章。\n\n### 递增和递减运算符\n\nJava 有了一些非常方便的小运算符，可以让生活变得更轻松（对于计算机处理器、你的大脑以及你的手指都是如此）。总共有四个这样的运算符——两个递增运算符和两个递减运算符。递增运算符加\
  \ 1，递减运算符减 1。递增运算符使用双加号（`++`），而递减运算符使用双减号（`--`）。要查看它们是如何工作的，你需要一些示例。第一个示例如图 4-13\
  \ 所示。\n\n![image](img/9781119235552-fg0413.png)\n\nFIGURE 4-13: 使用前递增。\n\n图 4-14\
  \ 显示了图 4-13 中程序的运行情况。在这次无聊的运行中，兔子的计数被打印了三次。\n\n![image](img/9781119235552-fg0414.png)\n\
  \nFIGURE 4-14: 图 4-13 中代码的运行情况。\n\n双加号有两个名称，取决于你将它们放在哪里。当你将 `++` 放在变量之前时，`++` 被称为**前递增**（preincrement）运算符。（`pre`\
  \ 代表“在……之前”（before）。）\n\n`before` 这个词有两个含义：\n\n*   你将 `++` 放在变量之前。\n*   在变量被语句中的任何其他部分使用之前，计算机将变量的值加\
  \ 1。\n\n为了理解这一点，请看图 4-13 中的加粗行**。计算机给 `numberOfBunnies` 加 1（将 `numberOfBunnies`\
  \ 的值提高到 29），然后在屏幕上打印 29。\n\n![remember](img/remember.png) 使用 `System.out.println(++numberOfBunnies)`\
  \ 时，计算机会在屏幕上打印 `numberOfBunnies` 的新值之前，给 `numberOfBunnies` 加 1。\n\n前递增的替代方案是**后递增**（postincrement。（`post`\
  \ 代表“在……之后”（after）。）`after` 这个词有两个不同的含义：\n\n*   你将 `++` 放在变量之后。\n*   在变量被语句中的任何其他部分使用之后，计算机将变量的值加\
  \ 1。\n\n为了更清楚地查看后递增是如何工作的，请看图 4-15 中的加粗行。计算机在屏幕上打印 `numberOfBunnies` 的旧值（即 28），然后计算机给\
  \ `numberOfBunnies` 加 1，将 `numberOfBunnies` 的值提高到 29。\n\n![image](img/9781119235552-fg0415.png)\n\
  \nFIGURE 4-15: 使用后递增。\n\n![remember](img/remember.png) 使用 `System.out.println(numberOfBunnies++)`\
  \ 时，计算机会在打印 `numberOfBunnies` 已经有的旧值之后，给 `numberOfBunnies` 加 1。\n\n图 4-16 显示了图 4-15\
  \ 中代码的运行情况。对比图 4-16 与图 4-14 中的运行情况：\n\n*   在图 4-14 中使用前递增时，第二个数字是 29。\n*   在图 4-16\
  \ 中使用后递增时，第二个数字是 28。\n    在图 4-16 中，29 直到计算机最后执行 `System.out.println(numberOfBunnies)`\
  \ 时才会显示在屏幕上。\n\n![image](img/9781119235552-fg0416.png)\n\nFIGURE 4-16:](#09_9781119235552-ch04.xhtml_rc04-fig-0016)\
  \ 图 4-15 中代码的运行情况。\n\n![tip](img/tip.png) 你在纠结用前递增还是后递增吗？别试了。大多数程序员使用后递增。在典型的 Java\
  \ 程序中，你经常看到 `numberOfBunnies++`。你很少看到 `++numberOfBunnies`。\n\n除了前递增和后递增，Java 还有两个使用\
  \ `--` 的运算符。它们被称为**前递减**（predecrement）和**后递减**（postdecrement）：\n\n*   使用前递减（`--numberOfBunnies`），计算机在语句的其他部分使用变量之前从变量的值中减\
  \ 1。\n*   使用后递减（`numberOfBunnies--`），计算机在语句的其他部分使用变量之后从变量的值中减 1。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 与其写入 `++numberOfBunnies`，你可以通过编写 `numberOfBunnies = numberOfBunnies + 1` 来实现相同的效果。因此有些人认为\
  \ Java 的 `++` 和 `--` 是为了节省击键——免让那些手指过度工作。这完全是错误的。使用 `++` 的最佳理由是避免在同一语句中两次编写相同的变量名（如\
  \ `numberOfBunnies`），这样做效率低下且容易出错。如果你写一次 `numberOfBunnies`（使用 `++` 或 `--`），计算机只需要识别一次\
  \ `numberOfBunnies`。此外，当你只写一次 `numberOfBunnies` 时，你只有一次（而不是两次）机会写错变量名。对于 `numberOfBunnies++`\
  \ 这种简单的表达式，这些优势并不明显。但对于像 `inventoryItems[(quantityReceived--*itemsPerBox+17)]++`\
  \ 这样的表达式，使用 `++` 和 `--` 带来的效率和准确性是巨大的。\n\n![tryitout](img/tryitout.png) 在运行以下代码之前，尝试预测代码的输出。然后运行代码查看你的预测是否正确：\n\
  \n```java\npublic class Main {\n    public static void main(String[] args) {\n \
  \       int i = 10;\n        System.out.println(i++);\n        System.out.println(--i);\n\
  \        --i;\n        i--;\n        System.out.println(i);\n        System.out.println(++i);\n\
  \        System.out.println(i--);\n        System.out.println(i);\n        i++;\n\
  \        i = i++ + ++i;\n        System.out.println(i);\n        i = i++ + i++;\n\
  \        System.out.println(i);\n    }\n}\n```\n\n将加粗文本一行一行输入 JShell，查看 JShell 的响应。\n\
  \n```jshell\nint i = 8\ni++\ni\ni\ni++\ni\n++i\ni\n```\n\n### 赋值运算符\n\n如果你读了上一节关于加\
  \ 1 运算符的内容，可能会疑惑是否可以操作这些运算符来加 2、5 或 1000000。你可以写 `numberOfBunnies++++` 并仍然自称为 Java\
  \ 程序员吗？嗯，你不能。如果你尝试，在编译代码时会出现错误信息。\n\n你可以做什么呢？幸运的是，Java 有许多你可以使用的赋值运算符。使用**赋值运算符**，你可以对任何你想要的内容加、减、乘、除。你还可以进行其他酷的操作。列表\
  \ 4-8 包含了丰富的赋值运算符（带有等号的内容）。图 4-17 显示了运行列表 4-8 的输出。\n\n![image](img/9781119235552-fg0417.png)\n\
