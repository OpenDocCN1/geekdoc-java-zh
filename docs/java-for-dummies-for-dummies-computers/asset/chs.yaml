  \ yourAccount.getInterest(yourInterestRate);\n        out.print(yourInterestAmount);\n\
  \        out.println(\" interest \");\n    }\n}\n```\n\n图 7-4 显示了代码列表 7-5](#13_9781119235552-ch07.xhtml_c07-fea-0005)\
  \ 和 7-6 的输出。在代码列表 7-5 中，`Account` 类有一个 `getInterest` 方法。该 `getInterest` 方法在代码列表\
