  \ 类是本章新引入的，但文本字段与按钮并没有太大区别。像许多组件一样，`JTextField` 位于 `javax.swing` 包中。在列表 16-1 中，创建框架、按钮和文本字段的代码并不是什么惊天动地的变化。\n\
