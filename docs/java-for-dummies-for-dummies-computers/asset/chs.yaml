  \ 类和 `Circle` 类）扩展抽象类 `Shape`。在 `Square` 和 `Circle` 类的 `paint` 方法体中，放置在 Java `JFrame`\
  \ 上绘制该特定形状的代码。\n\n## 放松！你没有看错！\n\n如果你读过本章之前关于接口和抽象方法的早期章节，你的头可能会可能会晕。接口和抽象类都有抽象方法。但抽象方法在这两种引用类型中扮演着略有不同的角色。你如何在脑海中理清这一切呢？\n\
  \n要做的第一件事是记住，没有人可以在没有大量代码实践的情况下学会面向对象编程概念的。如果你读了本章并感到困惑，这可能是一件好事。这意味着你已经理解了足够的内容，以知道这些东西有多复杂。你写的代码越多，对类、接口以及所有其他这些的想法就会越熟悉。\n\
  \n接下来的事情是理清声明抽象方法方式的差异。表 15-1 给出了答案。\n\n|    | 在普通（非抽象）类中 | 在接口中 | 在抽象类中 |\n| ---\
  \ | --- | --- | --- |\n| **允许有抽象方法吗？** | 否 | 是 | 是 |\n| **方法声明可以包含 abstract 关键字吗？**\
  \ | 否 | 是 | 是 |\n| **方法声明可以包含 default 关键字（意味着“非抽象”）吗？** | 否 | 是 | 否 |\n| **在既没有\
  \ abstract 也没有 default 关键字的情况下，方法是：** | 非抽象 | 抽象 | 非抽象 |\n\n表 15-1： 使用（或不使用）抽象方法\n\
  \n接口和抽象类都有抽象方法。所以你可能在想你应该如何在声明接口和声明抽象类之间进行选择。事实上，你可能会问三位专业程序员接口和抽象类之间有什么不同。如果你这样做，你可能会得到五个不同的答案。（是的，五个答案；不是三个答案。）\n\
  \n接口和抽象类是相似的野兽，Java 8 中的新功能使得它们比之前的 Java 版本更加相似。但基本思想是关于事物之间的关系。\n\n*   **扩展子类代表一种“是一个（is\
  \ a）”的关系。**\n\n    考虑本章早期章节“抽象类”中的关系。宠物动物是动物。狗是宠物动物。猫是宠物动物。鱼是宠物动物。\n\n*   **实现接口代表一种“能够（can\
  \ do）”的关系。**\n\n    考虑本章早期章节“Java 接口”中的关系。Listing 15-3 中的第一行说 `implements Displayable`。通过这些词，代码承诺每个\
  \ `ColumnOfNumbers` 对象都可以被显示。在同一个列表中之后，你通过声明 `display` 方法兑现了承诺。\n\n    数字列并不总是一个可以总结的东西。\n\
  \n\n\n\n在之前的章节中，我创建了一些功能不大的窗口。一个典型的窗口会显示一些信息，但没有任何交互元素。好了，现在是时候改变这一切了。本章的第一个示例是一个带有按钮的窗口。当用户点击按钮时，该死，某些事情发生了。代码显示在列表\
  \ 16-1 中，而调用列表 16-1 中代码的主方法位于列表 16-2 中。\n\n### 列表 16-1: 猜数字游戏\n\n```java\nimport\
  \ java.awt.FlowLayout;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
  import java.util.Random;\nimport javax.swing.JButton;\nimport javax.swing.JFrame;\n\
  import javax.swing.JLabel;\nimport javax.swing.JTextField;\nclass GameFrame extends\
  \ JFrame implements ActionListener {\n    private static final long serialVersionUID\
  \ = 1L;\n    int randomNumber = new Random().nextInt(10) + 1;\n    int numGuesses\
  \ = 0;\n    JTextField textField = new JTextField(5);\n    JButton button = new\
  \ JButton(\"Guess\");\n    JLabel label = new JLabel(numGuesses + \" guesses\");\n\
  \    public GameFrame() {\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        setLayout(new FlowLayout());\n        add(textField);\n        add(button);\n\
  \        add(label);\n        button.addActionListener(this);\n        pack();\n\
  \        setVisible(true);\n    }\n    @Override\n    public void actionPerformed(ActionEvent\
  \ e) {\n        String textFieldText = textField.getText();\n        if (Integer.parseInt(textFieldText)==randomNumber)\
  \ {\n            button.setEnabled(false);\n            textField.setText(textField.getText()\
  \ + \" Yes!\");\n            textField.setEnabled(false);\n        } else {\n  \
  \          textField.setText(\"\");\n            textField.requestFocus();\n   \
  \     }\n        numGuesses++;\n        String guessWord = (numGuesses == 1) ? \"\
  \ guess\" : \" guesses\";\n        label.setText(numGuesses + guessWord);\n    }\n\
  }\n```\n\n### 列表 16-2: 启动猜数字游戏\n\n```java\npublic class ShowGameFrame {\n    public\
