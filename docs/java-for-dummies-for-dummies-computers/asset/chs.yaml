  \ **调整你的代码以找到合适的平衡点**\n\n说起私有字段和方法（我在本章中确实会提到这些内容）……\n\n我正在和公司的几个同事一起吃午饭。“他们可以读你的邮件，”一个同事说。另一个插话道，“他们知道你访问的每一个网站。他们知道你买了什么产品，晚餐吃什么，穿什么，想了什么。他们甚至知道你最深层、最阴暗的秘密。天哪，如果他们知道你什么时候死，我不会感到意外。”\n\
  \n第三个声音加入了战斗。“现在已经到了这种地步，你连擦个涕都会有人在做记录。几周前我访问了一个网站，那个页面祝我生日快乐。他们是怎么知道我是我的，又是怎么记住我的生日的？”\n\
  \n“是啊，”第一个男人说，“我的车上有一个标签，可以让我顺畅地通过收费站。它能感应到我正在通过，并自动将费用记在我的信用卡上。每个月，我都会收到公司的一份列表，显示我去过哪里以及何时在那里的。我很惊讶它没有写出我去见了谁，以及我到达那里做了什么。”\n\
  \n我静静地自心里。我想说：“那全是胡扯。就个人而言，如果我的雇主、政府或某家大公司如此重视我，以至于追踪我的每一个一动，我会感到非常荣幸。当我真的想要引起人们注意时，已经够费劲了。而且大多数记录我所有购买和观看习惯的机构在给我发垃圾邮件时，连我的名字都拼不对。‘你好，这是给\
  \ Larry Burg 的礼貌电话。Burg 先生在家吗？’监视别人真的无聊透极。我完全能看到《纽约时报》头版上的头条：‘《傻瓜学 Java》作者把他的衬衫反过来穿了！’大惊得了！”\n\
  \n我静思了几秒钟，然后说：“他们想整死我们。电视摄像头！那是下一个大事——到处都是电视摄像头。”\n\n## 访问修饰符\n\n如果你已经读到了这本《傻瓜学\
  \ Java》第 7 版，你可能知道一件事：面向对象的编程非常注重隐藏细节。编写某段代码的程序员不应该碰另一个程序员代码内部的细节。这不仅仅是安全和机密的问题，而是模块化的问题。当你隐藏细节时，你就防止了段代码内部的复杂性被另一段代码扭曲和破坏。你的代码变成了一个个整齐、离散、易于管理的块。你将复杂度降到了最低。你犯的错误更少了。你节省了钱。你帮助促进了世界和平。\n\
  \n其他章节中有许多使用私有字段的例子。当一个字段被声明为 `private` 时，它就对所有外部干预隐藏了。这种隐藏增强了模块化，最小化了复杂性，等等。\n\n\
  在《傻瓜学 Java》第 7 版的其他地方，也有声明为 `public` 东西的例子。就像公众名人一样，声明为 `public` 的字段是完全开放的。可能许多人都知道埃尔维斯用的是哪种牙膏，任何程序员都可以引用一个公共字段，即使是一个名字不叫\
  \ *Elvis* 的字段。\n\n在 Java 中，`public` 和 `private` 单词被称为*访问修饰符*。毫无疑问，你在声明中见过没有访问修饰符的字段和方法。这类方法或字段被称为具有*默认访问权限*。书中的许多示例使用了默认访问权限。\n\
  \n\n\n\n\n-   如果成员变量是私有的（private），只有该成员所在类内部的代码才能直接引用该成员的名字：\n\n```java\nclass SomeClass\
  \ {\n    private int myField = 10;\n}\n\nclass SomeOtherClass {\n    public static\
  \ void main(String args[]) {\n        SomeClass someObject = new SomeClass();\n\
  \        //这行不起通：\n        System.out.println(someObject.myField);\n    }\n}\n```\n\
  \n-   如果成员变量是公有的（public），任何在同一个 Java 虚拟机运行的代码都可以直接引用该成员的名字。\n\n```java\nclass SomeClass\
  \ {\n    public int myField = 10;\n}\n\nclass SomeOtherClass {\n    public static\
  \ void main(String args[]) {\n        SomeClass someObject = new SomeClass();\n\
  \        //这行通的：\n        System.out.println(someObject.myField);\n    }\n}\n```\n\
