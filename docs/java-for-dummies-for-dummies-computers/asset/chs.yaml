  \n     Baeldung 对 Java IDE 的调查（[`www.baeldung.com/java-ides-2016``](http://www.baeldung.com/java-ides-2016)）显示\
  \ `NetBeans` 占比仅为 5.9%。但 `NetBeans` 是 Oracle 官方的 Java IDE。如果网站为你提供多种下载包的选择，请选择 Java\
  \ SE 包。\n\n   要获取你自己的 `NetBeans` 副本，请访问 [`https://netbeans.org/downloads`](https://netbeans.org/downloads/)。\n\
  \n     `NetBeans` 商业和非商业用途均免费。\n\n3. **测试你安装的软件。**\n\n   你在这一步的操作取决于你在第 2 步选择了哪种\
  \ IDE。无论如何，这里是一些通用说明：\n\n   1. 启动你的 IDE（`Eclipse`、`IntelliJ IDEA`、`NetBeans` 或其他）。\n\
  \n   2. 在 IDE 中创建一个新的 Java 项目。\n\n   3. 在 Java 项目中创建一个名为 `Displayer` 的新 Java 类。（在大多数\
  \ IDE 中，选择 File ⇒   New ⇒ Class 即可。）\n\n   4. 通过输入代码清单 3-1 中的代码来编辑新的 `Displayer.java`\
  \ 文件（这是第 3 章中的第一个代码清单）。\n\n      对于大多数 IDE，你将代码输入到一个较大的（大部分为空的）编辑器面板中。尝试完全按照你在代码清单\
  \ 3-1 中看到的样式输入代码。如果你看到大写字母，就输入大写字母。所有小写字母也如此。\n\n      ![ontheweb](img/ontheweb.png)\
