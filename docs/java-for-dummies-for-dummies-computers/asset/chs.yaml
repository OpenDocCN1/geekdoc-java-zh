  \ 为什么 Listing 8-4 的标题称这段代码为虚假的？（代码会感到被侮辱吗？）好吧，Listing 8-4 与 Listings 8-1 以及 8-3\
  \ 中继承情况的主要区别在于：子类不能直接引用父类的私有字段。要对父类的私有字段进行任何操作，子类必须调用父类的访问器方法（accessor methods）。在\
  \ Listing 8-3 中，调用 `setName(\"Rufus\")` 是合法的，但代码 `name=\"Rufus\"` 则是不法的。如果你相信 Listing\
  \ 8-4 中看到的所有内容，你会认为 `FullTimeEmployee` 类中的代码可以执行 `name=\"Rufus\"`。然而，它并不能。（噢，这是一个多么微妙的细节啊！）\n\
  \n![remember](img/remember.png) 你不需要在硬盘上拥有 `Employee.java` 文件来编写扩展 `Employee` 类的代码。你只需要\
  \ `Employee.class` 文件。\n\n### 创建子类是一种会养成的习惯\n\n当你习惯了扩展类之后，你可能会乐于不断扩展。如果你创建了一个 `FullTimeEmployee`\
  \ 类，你大可以创建一个 `PartTimeEmployee` 类，如 Listing 8-5 所示。\n\n### LISTING 8-5: 什么是 PartTimeEmployee?\n\
