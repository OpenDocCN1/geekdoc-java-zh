  \ 3 章中的 `Displayer` 示例，他们不需要在华丽的集成开发环境菜单中选择 `Run`。相反，他们在在一个看起来很朴的窗口中输入命令，通常是黑色背景上的白色文字。图\
  \ 11-12 说明了这一点。在图 11-12 中，我输入了 `java Displayer` 单词，计算机响应了我的 Java 程序的输出（You'll love\
  \ Java!）。\n\n![image](img/9781119235552-fg1112.png)\n\n图 11-12: 真无聊！\n\n这种看起来朴素的窗口根据你使用的操作系统类型有不同的名称。在\
  \ Windows 中，这种类型的文本窗口是命令提示符窗口。在 Macintosh 和 Linux 中，这个窗口是终端（terminal）。某些 Linux 和\
  \ UNIX 版本将此窗口称为 shell（壳）。\n\n总之，在古代，你可以编写一个程序，当你输入启动程序的命令时它可以吸收额外信息。图 11-13 向你展示了它是如何工作的。\n\
  \n![image](img/9781119235552-fg1113.png)\n\n图 11-13: 当你启动 `MakeNumsFile` 时，提供了额外信息。\n\
  \n### 在 Java 中使用命令行参数\n\n如果某个特定的程序需要命令行参数，你不能像启动其他程序那样启动它。你需要向程序传递参数。这就是为什么本书的网站（[www.allmycode.com/JavaDummies](http://www.allmycode.com/JavaDummies））提供了使用各种\
  \ IDE 传递参数的说明。\n\n当列表 11-7 中的代码开始运行时，`args` 数组获取了它的值。在图 11-13 所示的运行中，数组组件 `args[0]`\
  \ 自动取值为 \"NumberedFile.txt\"，而 `args[1]` 自动变为 \"5\"。因此程序的赋值具有以下含义：\n\n```\nPrintStream\
  \ printOut = new PrintStream(\"NumberedFile.txt\");\nint numLines = Integer.parseInt(\"\
  5\");\n```\n\n程序创建一个名为 NumberedFile.txt 的文件，并将 numLines 设置为 5。因此在代码的后续，程序随机生成五个值并将这些值放入\
  \ NumberedFile.txt。程序的程序运行得到了图 11-14 所示的文件。\n\n\n\n\n\n![tip](img/tip.png) 在运行 Listing\
  \ 11-7 中的代码后，你可以在硬盘的哪里找到新文件（`MyNumberedFile.txt`）？答案取决于许多不同的因素，因此我不想给出一个特定的答案。如果你使用将程序划分为项目的\
  \ IDE，那么新文件就在项目文件夹的某个地方。通过何种方式，你都可以修改 Listing 11-7 来指定完整路径名——类似于 `c:\\Users\\MyName\\\
  Documents\\MyNumberedFile.txt` 或 `/Users/MyName/Documents/MyNumberedFile.txt` 的名称。\n\
  \n![remember](img/remember.png) 在 Windows 中，文件路径名包含反斜杠字符。在 Java 中，当你想在双引号括的字符串字面量内部表示反斜杠时，你需要使用双反斜杠。这就是为什么\
  \ `c:\\Users\\MyName\\Documents\\MyNumberedFile.txt` 包含成对的反斜杠。相比之下，Linux 和 Macintosh\
  \ 操作系统的文件路径包含正斜杠。在 Java 字符串中表示正斜杠，只需使用一个正斜杠即可。\n\n注意 Listing 11-7 中的每一个命令行参数都是 String\
  \ 值。当你查看 `args[1]` 时，你看到的不是数字 5，而是看到一个包含数字字符的字符串 `\"5\"`。遗憾的是，你不能用这个 `\"5\"` 进行任何计数。要从\
  \ `\"5\"` 获取一个 `int` 值，你必须应用 `parseInt` 方法。（再次参见 Listing 11-7）。\n\n`parseInt` 方法位于一个名为\
  \ `Integer` 的类中。因此，要调用 `parseInt`，你需要在 `parseInt` 名称前加上 `Integer` 单词。`Integer` 类拥有各种方便的方法，用于处理\
  \ `int` 值。\n\n![remember](img/remember.png) 在 Java 中，`Integer` 是一个类的名称，而 `int` 是一个基础（简单）类型的名称。两者之间有联系，但它们不是同一个。`Integer`\
  \ 类拥有处理 `int` 值的方法和其他工具。\n\n### 检查命令行参数的数量\n\n如果用户犯了错会怎样？如果用户忘记在 Figure 11-13 的第一行输入数字\
  \ 5 会怎样？\n\n那么会将 `\"MyNumberedFile.txt\"` 分配给 `args[0]`，但不会给 `args[1]` 分配任何内容。这很糟糕。如果计算机执行到语句：\n\
  \n```java\nint numLines = Integer.parseInt(args[1]);\n```\n\n程序将由于一个不友好的 `ArrayIndexOutOfBoundsException`\
  \ 而崩溃。\n\n你该怎么办？在 Listing 11-7 中，你检查 `args` 数组的长度。你将 `args.length` 与 `2` 进行比较。如果\
  \ `args` 数组少于两个组件，你在屏幕上显示一条消息并退出程序。Figure 11-15 显示了结果输出。\n\n![image](img/9781119235552-fg1115.png)\n\
  \nFIGURE 11-15: Listing 11-7 中的代码告诉你如何运行它。\n\n![warning](img/warning.png) 尽管在 Listing\
  \ 11-7 中检查了 `args.length`，但代码仍然不是防止崩溃。如果用户输入五 而不是 5，程序会因为 `NumberFormatException`\
  \ 而崩溃。第二个命令行参数不能是单词。参数必须是一个数字（而且是一个整数）。我可以向 Listing 11-7 中添加语句来使代码更无可击，但检查 `NumberFormatException`\
  \ 最好在第 13 章中完成。\n\n\n\n\n\n有一天，来了一个新客户。由于你的客户是按顺序存储的（按姓氏字母顺序、按社会安全号码数字顺序，随你怎么意），你想将这个客户挤入数组中正确的组件中。问题是，这个客户位于数组中非常靠前的位置，索引为\
  \ `7` 的组件。这时会发生什么呢？\n\n你将第 `824` 组件中的名称移动到 `825` 组件。然后，你将第 `823` 组件中的名称移动到 `824`\
  \ 组件。再将第 `822` 组件中的名称移动到 `823` 组件。你不断这样做，直到移动了第 `7` 组件中的名称为止。然后，你将新客户的名字放入第 `7`\
  \ 组件中。真让人头疼！当然，计算机不会抱怨。（如果计算机有感情的话，它可能喜欢这种无忙碌的工作。）但当你移动所有这些名称时，你浪费了处理时间，浪费了电力，还浪费了各种资源。\n\
  \n“在我的下辈子，要在每两个名字之间留出三个空组件。”而且，你的业务扩大了。最终，你发现三个是不够的。\n\n## 集合类来救援\n\n前一节中的问题并不新。计算机科学家研究这些问题已经很长时间了。他们并没有发现任何万能的魔法解决方案，但他们发现了一些巧妙的技巧。\n\
  \nJava API 有一系列被称为 `collection`（集合）的类。每个集合类都有存储大量值的方法，而且每个集合类的方法都使用了一些巧妙的技巧。对你来说，底线是：某些集合类能够尽可能有效地处理前一节提出的问题。如果你在编写代码时必须处理此类问题，可以使用这些集合类并调用它们的方法。你无需为一个本该属于位置\
  \ `7` 的客户姓名发愁，只需调用类的 `add` 方法即可。该方法将名称插入在你选择的位置，并合理地处理可能发生的任何连锁反应。在最好的情况下，插入是非常高效的。在最坏的情况下，你可以放心地认为代码正在以最好的方式完成一切。\n\
  \n### 使用 ArrayList\n\nJava 集合类中最多功能的类之一是 `ArrayList`。[Listing 12-1] 展示展示了它是如何工作的。\n\
  \n[Listing 12-1:] 与 Java 集合操作\n\n```java\nimport static java.lang.System.out;\n\
  import java.util.Scanner;\nimport java.io.File;\nimport java.io.IOException;\nimport\
  \ java.util.ArrayList;\n\npublic class ShowNames {\n    public static void main(String\
  \ args[]) throws IOException {\n        ArrayList<String> people = new ArrayList<>();\n\
  \        Scanner diskScanner = new Scanner(new File(\"names.txt\"));\n        while\
  \ (diskScanner.hasNext()) {\n            people.add(diskScanner.nextLine());\n \
  \       }\n        people.remove(0);\n        people.add(2, \"Jim Newton\");\n \
  \       for (String name : people) {\n            out.println(name);\n        }\n\
  \        diskScanner.close();\n    }\n}\n```\n\n[Figure 12-1] 展示了一个示例 `names.txt`\
  \ 文件。[Listing 12-1] 中的代码读取了该 `names.txt` 文件并打印 [Figure 12-2] 中的内容。\n\n![image](img/9781119235552-fg1201.png)\n\
  \n[FIGURE 12-1:] 文件中的几个名字。\n\n![image](img/9781119235552-fg1202.png)\n\n[FIGURE\
  \ 12-2:] [Listing 12-1] 中的代码更改了一些名字。\n\n所有有趣的事情都发生在执行 `remove` 和 `add` 方法时。名为 `people`\
  \ 的变量指向一个 `ArrayList` 对象。当你调用该对象的 `remove` 方法时，\n\n```java\npeople.remove(0);\n\
  ```\n\n你从列表中删除了一个值。在这种情况下，你删除了列表初始位置（编号为 `0` 的位置）上的任何值。因此在 [Listing 12-1] 中，名为 `people`\
  \ 的变量指向一个 `ArrayList` 对象。当你调用该对象的 `remove` 方法时，\n\n```java\npeople.remove(0);\n\
  ```\n\n你从列表中删除了一个值。在这种情况下，你删除了列表初始位置（编号为 `0` 的位置）上的任何值。因此在 [Listing 12-1] 中，下一条语句\n\
  \n`people.add(2, \"Jim Newton\");`\n\n在位置 `2` 插入了一个名字。\n\n所有有趣的事情都发生在执行 `remove`\
  \ 和 `add` 方法时。名为 `people` 的变量指向一个 `ArrayList` 对象。当你调用该对象的 `remove` 方法时，\n\n```java\n\
  people.remove(0);\n```\n\n你从列表中删除了一个值。在这种情况下，你删除了列表初始位置（编号为 `0` 的位置）上的任何值。因此在 [Listing\
  \ 12-1] 中，下一条语句\n\n`people.add(2, \"Jim Newton\");`\n\n在位置 `2` 插入了一个名字。\n\n\n\n\n\
  \n在第 4 章中，我指出 Java 有两种类型：基本类型和引用类型。（如果你没有读过那些章节，或者你不记得，不要感到内疚。没关系的。）像 `int`、`double`、`char`\
  \ 和 `boolean` 等是基本类型，而像 `String`、`JFrame`、`ArrayList` 和 `Account` 等是引用类型。\n\n自 1995\
  \ 年 Java 诞生以来，基本类型和引用类型之间的区别一直是争议点。即使现在，Oracle 的大师们仍在制定计划来规避两种类型带来的棘手后果。其中一个后果是集合（如\
  \ `ArrayList`）不能包含基本类型的值。例如，这样写是可以的：\n\n```java\nArrayList<String> people = new\
  \ ArrayList<>();\n```\n\n但这样写是不行的：\n\n```java\nArrayList<int> numbers = new ArrayList<>();\
  \ // 错误！错误！\n```\n\n因为 `int` 是基本类型。所以，如果你要在`ArrayList` 中存储 3、55 和 21 这样的值，该怎么办？与其在`ArrayList`中存储`int`值，你不如存储\
  \ Java 的`Integer`值：\n\n```java\nArrayList<Integer> list = new ArrayList<>();\n```\n\
  \n在之前的章节中，你曾结合`parseInt`方法看到过`Integer`类：\n\n```java\nint numberOfCows = Integer.parseInt(\"\
  536\");\n```\n\n`Integer`类有许多方法（如`parseInt`）用于处理`int`值。该类还有如`MAX_VALUE`和`MIN_VALUE`之类的字段，它们代表`int`变量可能具有的最大值最小值。\n\
  \n`Integer`类是包装类（wrapper class）的一个示例。Java 的八种基本类型每种都有对应的包装类。你可以使用 Java 中`Double`、`Character`、`Boolean`、`Long`、`Float`、`Short`和`Byte`包装类的方法和字段。例如，`Double`类有名为`parseDouble`、`compareTo`、`toHexString`的方法以及名为`MAX_VALUE`和`MAX_EXPONENT`的字段。\n\
  \n`Integer`类用有用的方法和值封装了基本类型`int`。此外，你还可以创建一个 Integer 实例来封装单个`int`值：\n\n```java\n\
  Integer myInteger = new Integer(42);\n```\n\n在这行代码中，变量`myInteger`内部包含一个`int`值：即`int`值\
  \ 42。用保的话说，将`int`值 42 封装进`Integer`对象`myInteger`“就像在秋葵上裹了很多额外的面包粉。这让 42 对于集合这样挑剔的来说更容易消化。”\n\
  \n其他包装类的实例工作方式相同。例如，`Double`类的实例封装了单个的基本类型`double`值。\n\n```java\nDouble averageNumberOfTomatoes\
  \ = new Double(1.41421356237);\n```\n\n这是一个在`ArrayList`中存储了五个`Integer`值的程序：\n\n\
  ```java\nimport java.util.ArrayList;\n\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        ArrayList<Integer> list = new ArrayList<>();\n\
  \        fillTheList(list);\n        for (Integer n : list) {\n            System.out.println(n);\n\
  \        }\n    }\n    public static void fillTheList(ArrayList<Integer> list) {\n\
  \        list.add(85);\n        list.add(19);\n        list.add(0);\n        list.add(103);\n\
  \        list.add(13);\n    }\n}\n```\n\n在代码中，注意那些像`list.add(85)`这样带有`int`值参数的调用。此时，小比利非常兴奋并说：“看，妈妈！我向我的`ArrayList`里添加了基本类型`int`值\
  \ 85！”不，比利。那并不是真实发生的情况。\n\n在这段代码中，`list`集合包含的是`Integer`值，而不是`int`值。基本类型`int`值非常像`Integer`类的实例。但基本类型`int`值并不等同于`Integer`实例。\n\
  \n这种现象被称为自动装箱（autoboxing）。在 Java 5.0 之前，如果你想向`ArrayList`中添加一个`Integer`，必须写：\n\n\
  ```java\nlist.add(new Integer(85));\n```\n\n但 Java 5.0 及以后的 Java 版本可以将`int`值自动封装在一个盒子里。参数列表中的`int`值在`ArrayList`中变为`Integer`。Java\
  \ 的自动装箱特性使程序易读、易写。\n\n### 检测是否存在更多数据\n\n这是一个令人惊喜的发现。当你编写像之前代码列表 12-1 所示的程序时，你不需要知道输入文件中有多少名字。知道名字的数量可能会违反使用易扩展的`ArrayList`类的初衷。与其循环到恰好读取九个名字，你可以循环到数据耗尽。\n\
  \n`Scanner`类有几个很好的方法，如`hasNextInt`、`hasNextDouble`以及普通的`hasNext`。这些方法每个都检查是否有更多数据。如果有更多数据，方法返回`true`；否则，方法返回`false`。\n\
  \n代码列表 12-1 ... 随后的`hasNext`调用返回`false`。\n\n`hasNext`方法非常方便。事实上，`hasNext`非常方便，以至于它是名为迭代器（iterator）的大概念的一部分，而迭代器被内置在所有的所有的类中。\n\
  \n### 使用迭代器\n\n迭代器一个接一个地输出集合。要从集合中获取值，你调用迭代器的`next`方法。要检查集合是否还有更多值，你调用迭代器的`hasNext`方法。\n\
  \n代码列表 12-2 ... 使用迭代器显示人们的名字。\n\n```java\nimport static java.lang.System.out;\n\
  import java.util.Iterator;\nimport java.util.Scanner;\nimport java.io.File;\nimport\
  \ java.io.IOException;\nimport java.util.ArrayList;\n\npublic class ShowNames {\n\
  \    public static void main(String args[]) throws IOException {\n        ArrayList<String>\
  \ people = new ArrayList<>();\n        Scanner diskScanner = new Scanner(new File(\"\
  names.txt\"));\n        while (diskScanner.hasNext()) {\n            people.add(diskScanner.nextLine());\n\
  \        }\n        people.remove(0);\n        people.add(2, \"Jim Newton\");\n\
  \        Iterator<String> iterator = people.iterator();\n        while (iterator.hasNext())\
  \ {\n            out.println(iterator.next());\n        }\n        diskScanner.close();\n\
  \    }\n}\n```\n\n你可以将代码列表 12-1 结尾的增强型 for 循环替换为代码列表 12-2 中的粗体代码。当你这样做时，得到与之前相同的输出。（你得到图\
  \ 12-2 中的输出。）\n\n### Java 的许多集合类\n\n我在本章许多示例中使用的`ArrayList`类只是集合冰山的一角。Java 类库包含了许多集合类，每个类都有其优势。表\
  \ 12-1 包含了一个简要列表。\n\n| 类名 | 特性 |\n| --- | --- |\n| ArrayList | 可调整大小的数组。 |\n\n\n\
  \n\n\n| `LinkedList` | 值的列表，其中每个值都有一个指向列表中下一个值的字段。 |\n| `Stack` | 一种从底部到顶部增长的结构。该结构对访问顶部值进行了优化。你可以轻松地向顶部添加值或从顶部移除值。\
  \ |\n| `Queue` | 一种在某一端增长的结构。该结构对向其中一端（尾部）添加值和从另一端（头部）移除值进行了优化。 |\n| `PriorityQueue`\
  \ | 一种类似于队列的结构，允许某些（高优先级的）值向头部移动。 |\n| `HashSet` | 一个不包含重复值的集合。 |\n| `HashMap` |\
  \ 一个包含键/值对的集合。 |\n\n#### 表 12-1 某些集合类\n\n每个集合类都有自己的一套方法（除了它从所有集合类的祖先 `AbstractCollection`\
  \ 继承的方法之外）。\n\n![ontheweb](img/ontheweb.png) 要想找出哪些集合类最符合你的需求，请访问 Java API 文档页面\
  \ [`http://docs.oracle.com/javase/8/docs/api`](http://docs.oracle.com/javase/8/docs/api)\
  \ 。\n\n![tryitout](img/tryitout.png) 再次，我想让你动手实践一下：\n\n*   创建一个包含 `Integer` 值的 `ArrayList`。然后遍历列表中的值，找到列表中所有值中的最大值。例如，如果列表包含数字\
  \ 85, 19、0, 103 和 13，则显示数字 103。\n\n*   创建一个按字母顺序包含 `String` 值的 `ArrayList`。当用户在键盘上输入额外的单词时，程序将新单词插入到\
  \ `ArrayList` 中适当的（按字母排序的）位置。\n\n    例如，假设列表刚开始包含单词 \"cat\"、\"dog\"、\"horse\" 和\
  \ \"zebra\"（按顺序排列）。在用户在键盘上输入单词 \"fish\"（并按回车）后，列表包含了单词 \"cat\"、\"dog\"、\"fish\"\
  、\"horse\" 和 \"zebra\"（按顺序排列）。\n\n    为了编写这个程序，你可能会发现 `String` 类的 `compareToIgnoreCase`\
  \ 方法和 `ArrayList` 类的 `size` 方法非常有用。你可以通过 [`https://docs.oracle.com/javase/8/docs/api/java/lang/String.html#compareToIgnoreCase-java.lang.String-`](https://docs.oracle.com/javase/8/docs/api/java/lang/String.html#compareToIgnoreCase-java.lang.String-)\
  \ 和 [`http://docs.oracle.com/javase/8/docs/api/java/util/ArrayList.html#size--`](http://docs.oracle.com/javase/8/docs/api/java/util/ArrayList.html#size--)\
  \ 来了解这些方法。\n\n*   在 第 11 章 中，你创建了一个简单的文字处理器。你的程序将文本行存储在数组中，因此行数由数组大小。\n\n    在本章中，你可以通过将文本行存储在\
  \ `ArrayList` 中改进你在 第 11 章 中的工作。`ArrayList` 没有固定大小，因此行数可以增长以满足用户的需求。\n\n    你改进后的文字处理器支持三种命令：\n\
  \n    *   命令 `i 21` 告诉你的程序向文档中插入第 21 行文本。（如果已经存在第 21 行文本，新行将插入现有第 20 行和第 21 行之间。）\n\
  \n    *   命令 `r 13` 告诉你的程序替换文档中的第 13 行文本。（如果已经存在第 13 行文本，该行旧文本将消失。）\n\n    *   命令\
  \ `d 7` 告诉你的程序删除第 7 行文本。（如果已经存在第 8 行文本，该行将变成第 7 行文本。）\n\n    这个文字处理器程序可能很有挑战性。请缓慢、仔细地工作，不要气馁。如果你起初没有学会，请先放这个项目，以后再回来。\n\
  \n## 函数式编程\n\n从 1953 年到 1957 年，John Backus 等人开发了 FORTRAN 编程语言，它包含了 20 世纪数千种编程语言的基础框架。该框架由于其“做这个，再做那个”的特性被称为`命令式编程`（imperative\
  \ programming）。\n\n在 FORTRAN 兴起几年后，John McCarthy 创建了另一种名为 `Lisp` 的语言。与 FORTRAN 不同，`Lisp`\
  \ 的底层框架是`函数式编程`（functional programming）。在纯函数式程序中，你避免编写“做这个，再做那个”。相反，你写的是类似“当你准备好转换时，这是如何将这个转换为那个的”的内容。\n\
  \n出于某种原因，命令式编程变成了主导模式。结果是 Java 从根本上是一门命令式编程语言。但最近，函数式编程已成为一种强大且实用的思考方式。\n\n为了帮助你理解函数式编程，我用一个类比开始本节。在本章的剩余部分，我将给出一些\
  \ Java 示例。\n\n我用来描述函数式编程的类比非常粗略。我的朋友认为这个类比有些牵强，因为它适用于许多框架，而不仅仅是函数式编程。类比如下：将问题想象成一个立方体，将命令式解决方案想象成可以处理的碎片。（参见图\
  \ 12-3）。\n\n一切良好直到 2007 年，计算机首次使用了多核处理器。多核处理器可以同时执行多条指令。图 12-4 显示了当你试图将命令式程序挤入多核时会发生什么。\n\
  \n为了充分利用核处理器的性能，你将代码分成碎片——每个核心一个。但在命令式编程中，你的代码碎片无法完美放入处理器。\n\n如果你曾经历过这种现象：点击网站的购买按钮，却发现你尝试购买的商品缺货了。在你填写信用卡信息时，其他人完成了购买。许多客户同时在抢购相同的商品。\n\
