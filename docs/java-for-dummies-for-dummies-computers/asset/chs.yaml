  \ + 1000000.00;`；相反，他们通过按按钮来井然有序地完成工作。这就是程序员实现安全和简单的方式。\n\n为了保持整洁和有序，你需要通过修改列表 7-1\
  \ 中的 `Account` 类，禁止出现如下语句：`myAccount.name = \"Barry Burd\";` 和 `out.print(yourAccount.balance);`。\n\
  \n当然，这带来了一个问题。你是编写 `UseAccount` 类代码的人。如果你不能写 `myAccount.name` 或 `yourAccount.balance`，你该如何完成任何操作呢？答案在于被称为访问器方法的东西。列表\
  \ 7-8 和 7-9 演示了这些方法。\n\n运行列表 7-8 和 7-9 中的代码，与运行列表 7-1 没有区别。\n\n### 访问器方法\n\n要点在于，让事情看起来简单需要一些规划。在面向对象编程中，让事情看起来简单的方法之一是防止类外部代码直接使用类内部定义的字段。看一眼列表\
