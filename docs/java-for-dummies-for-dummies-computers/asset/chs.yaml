  ### 写入文件\n\nListing 11-4 中的代码使用了书中其他章节的技巧。代码唯一的新功能是使用 `PrintStream` 写入磁盘文件。考虑书中任何调用\
  \ `System.out.print`、`out.println` 或其变体的例子。当你调用这些方法之一时，到底发生了什么？\n\n名为 `System.out`\
  \ 的是一个对象。该对象定义在 Java API 中。事实上，`System.out` 是名为 `java.io.PrintStream` 的类的实例（对它的朋友只需称为\
  \ `PrintStream`）。现在，每个从 `PrintStream` 类创建的对象都有名为 `print` 和 `println` 的方法。就像 Listing\
  \ 7-3 中的每个 `Account` 对象都有一个 `display` 方法，就像 Listing 10-1 中的 `DecimalFormat` 对象有一个\
  \ `format` 方法一样，所以名为 `out` 的 `PrintStream` 对象拥有 `print` 和 `println` 方法。当你调用 `System.out.println`\
  \ 时，你正在调用一个属于 `PrintStream` 实例的方法。\n\n好吧，那又怎样呢？`System.out` 始终代表电脑屏幕上的某个文本区域。如果你创建了自己的\
  \ `PrintStream` 对象并让该对象指向磁盘文件，那么该 `PrintStream` 对象就会指向磁盘文件。当你调用该对象的 `print` 方法时，你就将文本写入硬盘上的一个文件。\n\
  \n在 Listing 11-4 中，当你说：\n\n```java\nPrintStream listOut = new PrintStream(\"GuestList.txt\"\
  );\nlistOut.print(guests[roomNum]);\nlistOut.print(\" \");\n```\n\n你是在告诉 Java 将文本写入你硬盘上的一个文件——`GuestList.txt`\
  \ 文件。这就是你更新酒店入住人数的方法。当你调用 `listOut.print` 输出 3 号房间的人数时，你可能会打印数字 5。\n\n\n\n\n![tip](img/tip.png)\
  \ 这与其说是一个观察，不如说是一个技巧。假设你想从名为 `Employees.txt` 的文件中`read` 数据。为了实现这一点，你创建一个扫描。你调用 `new\
  \ Scanner(new File(\"Employees.txt\"))`。如果你不小心在没有 `new File` 部分的情况下调用了 `new Scanner(\"\
  Employees.txt\")`，该调用将连接到你的 `Employees.txt` 文件。但注意你是如何准备向文件`write` 数据的。你通过调用 `new\
  \ PrintStream(\"GuestList.txt\")` 创建一个 `PrintStream` 实例。你在调用任何地方都没有使用 `new File`。如果你失误并意外包含了\
  \ `new File`，Java 编译器就会生气、跳出来并咬你你。\n\n### 何时关闭文件\n\n注意 Listing 11-4 中 `new Scanner`\
  \ 调用、`new PrintStream` 调用和 `close` 调用的位置。与所有的示例一样，每个 `new Scanner` 调用都有一个对应的 `close`\
  \ 调用。在 Listing 11-4 中，`new PrintStream` 调用有它自己的 `close` 调用（`listOut.close()` 调用）。但在\
  \ Listing 11-4 中，我仔细地将这些调用紧紧围绕在它们 `nextInt` 和 `print` 调用周围。例如，我没有在程序的最开始设置 `diskScanner`，也没有等到程序的最结束才关闭\
  \ `diskScanner`。相反，我一个接一个地快速执行所有的 `diskScanner` 任务：\n\n```java\nScanner diskScanner\
  \ = new Scanner(new File(\"GuestList.txt\")); //construct\nfor (roomNum = 0; roomNum\
  \ < 10; roomNum++) {\n    guests[roomNum] = diskScanner.nextInt(); //read\n}\ndiskScanner.close();\
  \ //close\n```\n\n我对键盘对象和 `listOut` 对象也做了同样的操作。\n\n我之所以对输入和输出进行这种“快速跳舞”，是因为我的程序使用了两次\
  \ `GuestList.txt` —— 一用于读取数字，第二次用于写入数字。如果我不小心，`GuestList.txt` 的两次使用可能会相互冲突。考虑以下程序：\n\
  \n```java\n// THIS IS BAD CODE\nimport java.io.File;\nimport java.io.IOException;\n\
  import java.io.PrintStream;\nimport java.util.Scanner;\n\npublic class BadCode {\n\
  \    public static void main(String args[]) throws IOException {\n        int guests[]\
  \ = new int[10];\n        Scanner diskScanner = new Scanner(new File(\"GuestList.txt\"\
  ));\n        PrintStream listOut = new PrintStream(\"GuestList.txt\");\n       \
  \ guests[0] = diskScanner.nextInt();\n        listOut.print(5);\n        diskScanner.close();\n\
  \        listOut.close();\n    }\n}\n```\n\n与其许多类型的方法和构造函数一样，`PrintStream` 构造函数不会对文件绕圈子。如果它找不到\
  \ `GuestList.txt` 文件，构造函数将创建一个 `GuestList.txt` 文件并准备向其中写入值。但是，如果 `GuestList.txt`\
  \ 文件已经存在，`PrintStream` 构造函数将删除现有文件并准备写入一个新的新的、空的 `GuestList.txt` 文件。在 `BadCode`\
  \ 类中，新的 `PrintStream` 构造函数调用删除了任何已存在的 `GuestList.txt` 文件。这种删除发生在调用 `diskScanner.nextInt()`\
  \ 之前。因此 `diskScanner.nextInt()` 无法读取原本 `GuestList.txt` 文件中的任何内容。这太糟糕了！\n\n为了避免这种灾难，我在\
  \ Listing 11-4 中仔细地分离了 `GuestList.txt` 文件的两次使用。在列表顶部，我构建 `diskScanner`，然后从原始的 `GuestList.txt`\
  \ 文件读取，然后关闭 `diskScanner`。稍后在列表结束前，我构建 `listOut`，然后向新的 `GuestList.txt` 文件写入，然后关闭\
  \ `listOut`。由于写入与读取完全分离，一切都运行正常。\n\n![technicalstuff](img/technicalstuff.png) Listing\
  \ 11-4 中的 `keyboard` 变量并不指向 `GuestList.txt`，因此 `keyboard` 不与其他输入或输出变量冲突。遵循我的常规做法\
  \ —— 在程序开始处放置 `keyboard = new Scanner(System.in)` 在程序结束处放置 `keyboard.close()` 没有任何处。但为了让\
  \ Listing 11-4 尽可能的可读和统一，我将 `keyboard` 构造函数和 `close` 调用紧紧围绕在 `keyboard.nextInt`\
  \ 调用周围。\n\n![tryitout](img/tryitout.png) 使用我的 `DummiesFrame`（来自第 7 章）基于 Listing\
  \ 11-4 创建一个 GUI。等等，我将 `keyboard` 构造函数和 `close` 调用紧紧围绕在 `keyboard.nextInt` 调用周围。\n\
  \n### 对象数组\n\n\n\n\n\n![tip](img/tip.png) 这个提示与 Java 完全没有关系。如果你是那种喜欢吸烟室的人（在 Listing\
  \ 11-5 中有一个布尔字段 `smoking = true`），那么请找一个你喜欢的人——一个能连续请三天假的人。让你那个人坐在你身边，在你连续安慰你 72\
  \ 小时，而你期间禁止吸烟。在尼古丁离开身体时，你可能会暂时变得疯狂，但最终你会没事的。你的朋友会觉得自己像个真正的英雄。\n\n### 使用 Room 类\n\
  \n现在你需要一个房间数组。创建这种结构的代码在代码列表 11-6 中。该代码从 `RoomList.txt` 文件中读取数据。（图 11-9 显示了 `RoomList.txt`\
  \ 文件的内容。）\n\n![image](img/9781119235552-fg1109.png)\n\n图 11-9: 一个 Room 数据文件。\n\n\
  图 11-10 显示了代码列表 11-6 中代码的运行结果。\n\n![image](img/9781119235552-fg1110.png)\n\n图 11-10:\
  \ 代码列表 11-6 中代码的运行结果。\n\n代码列表 11-6: 想看房间吗？\n\n```java\nimport static java.lang.System.out;\n\
  import java.util.Scanner;\nimport java.io.File;\nimport java.io.IOException;\n\n\
  public class ShowRooms {\n    public static void main(String args[]) throws IOException\
  \ {\n        Room rooms[];\n        rooms = new Room[10];\n        Scanner diskScanner\
  \ = new Scanner(new File(\"RoomList.txt\"));\n        for (int roomNum = 0; roomNum\
  \ < 10; roomNum++) {\n            rooms[roomNum] = new Room();\n            rooms[roomNum].readRoom(diskScanner);\n\
  \        }\n        out.println(\"Room\\tGuests\\tRate\\tSmoking?\");\n        for\
  \ (int roomNum = 0; roomNum < 10; roomNum++) {\n            out.print(roomNum);\n\
  \            out.print(\"\\t\");\n            rooms[roomNum].writeRoom();\n    \
  \    }\n        diskScanner.close();\n    }\n}\n```\n\n你可以对代码列表 11-6 中的代码有任何你想说的见解。在我看来，整个列表中只有一个问题是你应该关注的。你问那个问题是什么呢？嗯，要创建一个对象数组——而不是一个由基本类型值组成的数组——你必须做三件事：创建数组变量、创建数组本身，然后构造数组中的每一个单独对象。这与创建一个\
  \ `int` 值数组或包含任何其他基本类型值的数组是不同的。当你创建一个基本类型值的数组时，你只需要完成这三件事中的前两。\n\n为了帮助理解这些内容，在阅读以下几点时，请参考代码列表\
  \ 11-6 和图 11-11：\n\n*   `Room rooms[];`: 这一声明创建了一个 `rooms` 变量。该变量旨在指向一个数组（但目前尚未指向任何内容）。\n\
  *   `rooms = new Room[10];`: 这条语句在计算机内存中预留了十个存储槽。该语句还让 `rooms` 变量指向这组存储槽。每个槽旨在指向一个对象（但尚未指向任何内容）。\n\
  *   `rooms[roomNum] = new Room();`: 这条语句位于 `for` 循环内部。该语句为十个房间号中的每一个都执行一次。例如，在第一次循环时，该语句执行\
  \ `rooms[0] = new Room()`。第一次执行时，该语句让 `rooms[0]` 指向一个实际的对象（`Room` 类的实例）。\n\n![image](img/9781119235552-fg1109.png)\n\
  \n图 11-11: 创建对象数组的步骤。虽然技术上不被认为是创建数组的步骤，但你仍然需要填充对象的字段。例如，在第一次循环中，`readRoom` 调用 `rooms[1].readRoom(diskScanner)`\
  \ 表示从 `RoomList.txt` 读取数据到 `rooms[1]` 的字段中（人数、价格、是否吸烟）。每次循环，程序都会创建一个对象并将数据读入该对象的字段。\n\
  \n你可以像处理基本值数组一样将这些步骤合并。例如，你可以一次完成前两个步骤：\n\n`Room rooms[] = new Room[10];`\n\n你也可以使用数组初始化。（关于数组初始化的介绍，请参见本章前面的数组初始化。）\n\
  \n### 另一种美化数字的方法\n\n你有许多方法可以让数字看起来很好。如果你看看前面的章节，会发现代码列表 7-7 使用了 `printf`，而代码列表 10-1\
  \ 使用了 `DecimalFormat`。但在代码列表 11-5 中，为了显示金额时，我使用了 `NumberFormat` 类及其 `getCurrencyInstance`\
  \ 方法。\n\n如果你比较代码列表 10-1 和 11-5 中的格式化语句，你会发现差别不大。\n\n*   一个列表使用构造函数；另一个列表调用 `getCurrencyInstance`。`getCurrencyInstance`\
  \ 方法是所谓工厂方法的良好范例。工厂方法是创建常用对象的方便工具。人们总是需要显示金额的代码。因此 `getCurrencyInstance` 方法可以创建货币格式，而无需你编写复杂的\
  \ `DecimalFormat` 构造函数调用。在美国，这种复杂的构造函数调用将是 `new DecimalFormat(\"$###.00\")`。像构造函数一样，工厂方法返回一个新的对象。但与构造函数不同，工厂方法没有特殊身份。如果你创建自己的工厂方法，可以命名为任何名称。调用工厂方法时不需要使用\
  \ `new` 关键字。\n*   一个列表使用 `DecimalFormat`；另一个列表使用 `NumberFormat`。（事实上，小数数字是十进制数字。）因此，`DecimalFormat`\
  \ 类是 `NumberFormat` 类的子类。`DecimalFormat` 方法更具体，因此对于大多数用途，我使用 `DecimalFormat`。但使用\
  \ `DecimalFormat` 类的 `getCurrencyInstance` 方法比较困难。对于涉及金钱的程序，我倾向于使用 `NumberFormat`。\n\
  *   两个列表都使用了 `format` 方法。最后你只需要写类似 `currency.format(rate)` 或 `decFormat.format(average)`\
  \ 的代码。之后，Java 会为你完成工作。\n\n![remember](img/remember.png) 从第 4 章开始，我警告不要使用 `double`\
  \ 和 `float` 等类型来存储金额。对于最准确的货币计算，请使用 `int`、`long` 或者最理想 `BigDecimal`。\n\n![crossreference](img/crossreference.png)\
  \ 你可以在第 7 章中阅读更多关于 double 类型和金额的危险性的知识。\n\n### 三元运算符\n\n代码列表 11-5 使用了一种被称为三元运算符的有趣道具。这个三元运算符接受三个表达式并返回其中一个的值。它就像一个微型的\
  \ if 语句。当你使用三元运算符时，它看起来如下：\n\n```\nconditionToBeTested ? expression1 : expression2\n\
  ```\n\n计算机计算 `conditionToBeTested` 条件。如果条件为真，计算机返回 `expression1` 的值。但如果条件为假，计算机返回\
  \ `expression2` 的值。\n\n所以，在代码中\n\n```\nsmoking ? \"yes\" : \"no\"\n```\n\n\n\n\n\
  \n计算机检查 `smoking` 的值是否为 `true`。如果是，那么整个三部分构造的表达式就代表第一个字符串\"yes\"。如果不是，整个表达式就代表第二个字符串\"\
  no\"。\n\n在列表 11-5 中，对 `out.println` 的调用会导致显示 \"yes\" 或 \"no\"。显示哪一个字符串取决于 `smoking`\
  \ 的值是 `true` 还是 `false`。\n\n![tryitout](img/tryitout.png) 你是如何学习 Java 的？你像去往卡内基音乐厅一样学习\
