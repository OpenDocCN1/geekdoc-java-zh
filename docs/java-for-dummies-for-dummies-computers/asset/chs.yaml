  代码列表 4-2](#09_9781119235552-ch04.xhtml_c04-fea-0002)和 4-3 中的程序是基于文本的。基于文本的程序没有窗口、对话框——任何之类的东西。你看到的只是接接行的纯格式化文本。用户输入某些内容，计算机会在每行输入下方显示响应。\n\
  \n文本程序的对立面是“图形用户界面”（GUI）程序。GUI 程序有窗口、文本字段和其他视觉佳品。\n\n尽管文本程序在视觉上并不刺激，但它们包含了计算机编程的基础概念。此外，对于初学者来说，文本程序比相应的\
  \ GUI 程序更容易阅读、编写和理解。因此，在本书中我采用了三管齐下的方法：\n\n*   **文本示例：** 我通过这些示例介绍大部分新概念。\n*   **`DummiesFrame`\
  \ 类：** 除了文本示例，我还展示了使用专为本书创建的 `DummiesFrame`类的 GUI 版本。（我在第 7 章](#13_9781119235552-ch07.xhtml）中引入了\
  \ `DummiesFrame` 类）。\n*   **GUI 编程技术：** 我在第 9 章](#15_9781119235552-ch09.xhtml)、第\
