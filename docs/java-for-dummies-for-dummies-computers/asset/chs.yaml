  \ 方法使用了许多 Java API 技巧。以下是这些技巧的要列表：\n\n*   每个 `JTextField`（以及 `JLabel`）的实例都有自己的 getter\
  \ 和 setter 方法，包括 `getText` 和 `setText`。调用 `getText` 获取组件中的任何字符字符串。调用 `setText` 更改组件中的字符。在\
  \ Listing 16-1 中，巧妙地使用 `getText` 和 `setText` 从文本字段中提取出一个数字，并将该数字替换为空（空字符串 \"\"）或该数字，后面跟着\
  \ *Yes!* 一词。\n\n*   `javax.swing` 包中的每个组件（`JTextField`、`JButton` 或其他任何组件）都有一个 `setEnabled`\
  \ 方法。当你调用 `setEnabled(false)` 时，组件会变成那种无力、灰色、褪色的外观，并且无法再次接收按钮点击或击键输入。\n\n*   `javax.swing`\
  \ 包中的每个组件都有一个 `requestFocus` 方法。当你调用 `requestFocus` 时，组件将获得焦点。例如，在 Listing 16-1\
  \ 中，`requestFocus()` 表示“让组件获得焦点。”\n\n![tip](img/tip.png) 请用你自己的语言描述以下代码中关键字 `this`\
  \ 的用途：\n\n### `serialVersionUID`\n\n第 9 章引入了 `SuppressWarnings` 注解来避免处理所谓的 `serialVersionUID`。`serialVersionUID`\
  \ 是一个数字，它有助于在发送对象时避免冲突。例如，你可以将 JFrame 的状态发送到另一个。然后对方就可以检查版本号。\n\n在第 9 章中，我通过告诉 Java\
  \ 忽略任何关于序列化的警告来绕过 `serialVersionUID` 问题。但在 Listing 16-1 中，我采取了更大胆的方法。我给我的 JFrame\
  \ 分了一个真实的 `serialVersionUID`。这是我 `GameFrame` 的第一个版本，所以我给这个 `GameFrame` 分配了版本号 1。（实际上，我给\
  \ `GameFrame` 分配了 `1L`，意味着长型值 1。参见第 4 章。）\n\n那么，你会费精力更改类的 `serialVersionUID` 数字吗？如果版本号\
  \ 1 很好，版本号 2 是否更好？答案很复杂，但底线是，除非你对类做了不兼容更改，否则不要更改 `serialVersionUID` 数字。我们所说的“不兼容更改”是指导致接收端的代码无法处理你新创建的对象。\n\
  \n![crossreference](img/crossreference.png) 关于 `serialVersionUID` 以及哪些属于不兼容更改，请查看此网站：\n\
  \n[`http://docs.oracle.com/javase/8/docs/platform/serialization/spec/version.html`](http://docs.oracle.com/javase/8/docs/platform/serialization/spec/version.html)\n\
