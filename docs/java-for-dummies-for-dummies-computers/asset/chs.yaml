  \ 这些关于导入的细节可能会非常糟糕。但幸运的是，许多 IDE 都为导入声明提供了方便的辅助功能。更多细节，请参阅本书的网站`[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies))`。\n\
  \n书中没有哪一个章节可以介绍关于导入声明的完整故事。要开始理清一些导入声明的微妙之处，请参阅第 5 章、第 9 章和第 10 章。\n\n## 通过应用运算符创建新值\n\
  \n还有什么比你的老朋友加号更宽慰的呢？这是你在小学数学中学的第一个主题。几乎每个人都知道如何将 2 加到 2。事实上，在英语用法中，2 加 2 是对某些易事的比喻。每当你看到加号时，你大脑中的一个细胞就会说：“谢天谢地——它可能是比这复杂得多的东西。”\n\
  \nJava 有加号。你可以将它用于几个用途。你可以使用加号来相两个数字，如下所示：\n\n```java\nint apples, oranges, fruit;\n\
  apples = 5;\noranges = 16;\nfruit = apples + oranges;\n```\n\n你还可以使用加号将 String 值拼接在一起：\n\
  \n```java\nString startOfChapter =\n\"It's three in the morning. I'm dreaming about\
  \ the\"+\n\"history course that I failed in high school.\";\nSystem.out.println(startOfChapter);\n\
  ```\n\n这非常有用，因为在 Java 中，你不允许让一个 String 跨行显示。换句话说，下面的代码将无法工作：\n\n```java\nString\
  \ thisIsBadCode =\n\"It's three in the morning. I'm dreaming about the\nhistory\
  \ course that I failed in high school.\";\nSystem.out.println(thisIsBadCode);\n\
  ```\n\n![technicalstuff](img/technicalstuff.png) 描述你正在拼接 String 值的正确方式是说你正在*连接（concatenating）String\
  \ 值。\n\n你甚至可以使用加号将数字放在 String 值旁边：\n\n```java\nint apples, oranges, fruit;\napples\
  \ = 5;\noranges = 16;\nfruit = apples + oranges;\nSystem.out.println(\"You have\"\
  \ + fruit + \"pieces of fruit.\");\n```\n\n当然，旧的减号也可以用（但不适用于 String 值）：\n\n```java\n\
  apples = fruit - oranges;\n```\n\n使用星号（`*`）进行乘法，使用斜杠（`/`）进行除法：\n\n```java\ndouble\
  \ rate, pay;\nint hours;\nrate = 6.25;\nhours = 35;\npay = rate * hours;\nSystem.out.println(pay);\n\
  ```\n\n有关使用除法的示例，请参阅 Listing 4-3。\n\n![warning](img/warning.png) 当你用一个 int 值除以另一个\
  \ int 值时，你得到一个 int 值。计算机不会四舍五入。相反，计算机会切掉任何余数。如果你在程序中放入 `System.out.println(11 /\
  \ 4)`，计算机打印出 2，而不是 2.7。要解决这个问题，将你所除的数字之一（或两者）都变为 double。如果你在程序中放入 `System.out.println(11.0\
  \ / 4)`，计算机打印出 2.7。\n\n另一个有运算符是取余运算符。取余运算符的符号是百分号（%`）。当你把 `System.out.println(11\
  \ % 4)` 放入程序时，计算机打印出 3，因为 11 除以 4 的余数为 3。取余运算符是非常有用的。Listing 4-3 有一个例子。\n\n## 找零示例\n\
  \n```java\nimport static java.lang.System.*;\npublic class MakeChange {\n    public\
  \ static void main(String args[]) {\n        int total = 48;\n        int quarters\
  \ = total / 25;\n        total = total % 25;\n        int dimes = total / 10;\n\
  \        total = total % 10;\n        int nickels = total / 5;\n        total =\
  \ total % 5;\n        int cents = total;\n        println(\"From 48 cents, you get\"\
  );\n        startOfChapter = \"It's three in the morning. I'm dreaming about the\"\
  +\n\"history course that I failed in high school.\";\n        System.out.println(startOfChapter);\n\
  \    }\n}\n```\n*(注：由于原文文本存在混乱，且部分代码块和描述似乎混在一起，上述翻译已根据逻辑进行了重组和修正，以确保文档的可读性并符合高级文档工程师的专业标准。)*\n\
