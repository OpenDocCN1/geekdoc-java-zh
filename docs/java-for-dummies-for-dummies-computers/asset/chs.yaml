  $%5.2f\\n\", myInterest);\nout.printf(\"$%.2f\\n\", myInterest);\nout.printf(\"\
  $%3.2f\\n\", myInterest);\nout.printf(\"$%.2f $%.2f\", myInterest, yourInterest);\n\
