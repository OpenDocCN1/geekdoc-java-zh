  \        if (username != null && password != null &&\n            (username.equals(\"\
  swordfish\")) ||\n            (password.equals(\"swordfish\"))) {\n            JOptionPane.showMessageDialog(null,\
  \ \"You're in.\");\n        } else {\n            JOptionPane.showMessageDialog(null,\
  \ \"You're suspicious.\");\n        }\n    }\n}\n```\n\nListing 5-4 的多次运行如表 5-2\
