  \ 图 7-4 中不准确的数字来自于计算机对 0 和 1 的使用。一台电路设计为使用数字 0, 1, 2, 3, 4, 5, 6, 7, 8 和 9 的幻幻计算机就不会遭受同样的不准确性。因此，为了改进这一点，Java\
  \ 提供了了自己的特殊方法来解决计算机计算不准确的问题。Java API 有一个名为 `BigDecimal` 的类——该类绕过了计算机奇怪的 0 和 1，使用普通的十进制数字进行算术计算。欲需更多信息，请访问本书的网站（[`www.allmycode.com/JavaForDummies`](http://www.allmycode.com/JavaForDummies)）。\n\
  \nListing 7-7 使用了一个名为 `printf` 的方便方法。当你调用 `printf` 时，始终会在调用的括号内放置至少两个参数：\n\n*  \
