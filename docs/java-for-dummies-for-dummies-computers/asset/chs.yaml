  \ {\n            System.out.println(i);\n            System.out.println(j);\n  \
  \          System.out.println(k);\n        }\n    }\n    ```\n\n## Java 类的访问修饰符\n\
  \n也许读过的关于成员访问修饰符的内容让你感到有点头晕。毕竟，Java 中的成员访问是一个复杂的课题，有很多情节转折和悬念。好了，头晕感结束了。与字段和方法的史诗相比，类的访问故事要简单得多。\n\
  \n类可以是 `public` 或 `nonpublic` 的。如果你看到类似\n\n`public class Drawing`\n\n你正在查看一个公共类的声明。但，如果你看到普通的\n\
  \n`class ShowFrame`\n\n那么正在声明的类就不是公共的。\n\n### 公共类\n\n如果一个类是 `public` 的，你可以在代码的任何地方引用该类。当然，有一些限制。你必须遵守本章“目录结构”部分中的所有规则。你还必须正确地引用包中的类。例如，在列表\
  \ 14-1 中，你可以写：\n\n`import com.burdbrain.drawings.Drawing;`\n\n`import com.burdbrain.frames.ArtFrame;`\n\
  \n`…`\n\n`ArtFrame artFrame = new ArtFrame(new Drawing());`\n\n或者你可以不使用 import 语句而写：\n\
  \n`com.burdbrain.frames.ArtFrame artFrame = new com.burdbrain.frames.ArtFrame(new\
  \ com.burdbrain.drawings.Drawing());`\n\n无论如何，你的代码必须承认 `ArtFrame` 和 `Drawing` 类位于命名的包中。\n\
  \n### 非公共类\n\n如果一个类不是 `public` 的，你只能从类包内部的代码中引用该类。\n\n我尝试过。首先，我回到列表 14-2 并删除了 `public`\
  \ get。我将 `public class Drawing` 变成了普通的 `class Drawing`，如下：\n\n    ```java\n    package\
  \ com.burdbrain.drawings;\n\n    import java.awt.Graphics;\n\n    class Drawing\
  \ {\n        public int x = 40, y = 40, width = 40, height = 40;\n        public\
  \ void paint(Graphics g) {\n            g.drawOval(x, y, width, height);\n     \
  \   }\n    ```\n\n（注：此处原文中存在大量重复段落，已根据要求“不要重复输出原文”，未重复翻译重复内容）\n\n\n\n\n\n想象一个类（例如\
  \ `Employee` 类）和它的子类（例如 `FullTimeEmployee` 类）。类与其子类之间的关系是继承。在许多现实家庭中，孩子会从父母继承资产。在第\
  \ 8 章中，`FullTimeEmployee` 类从 `Employee` 类继承了 `name` 和 `jobTitle` 字段。它就是这样运作的。\n\n\
  但考虑一下编辑和作者之间的关系。编辑说：“通过签署这份合同，你同意在 1 月 9 日前提交一份完成的稿件。”无论作者在截止日期前给出什么借口（相信我，作者们有的是借口可找），编辑与作者之间的关系都是义务关系。作者同意承担某些责任；而且为了继续担任作者，作者必须履行这些责任。（顺便说一下，这段话没有任何言外之意——完全没有。）\n\
  \n现在考虑一下 Barry Burd。他是谁？Barry Burd——那个写了 *Java For Dummies* 以及其他某些 *For Dummies*\
  \ 系列书籍（全部由 Wiley 出版公司出版）的家伙。他是一位大学教授，也是一名作者。你想在 Java 程序中模拟这种情况，但 Java 不支持多重继承。你不能让\
  \ Barry 同时继承 `Professor` 类和 `Author` 类。\n\n对 Barry 来说，幸运的是，Java 有接口（interface）。接口是一种引用类型。事实上，创建接口的代码看起来非常像创建类的代码：\n\
  \n```java\npublic interface MyInterfaceName {\n    // blah, blah, blah\n}\n```\n\
  \n接口非常像类，但接口是不同的。（那么，还有什么新鲜的吗？牛像行星，但它们区别很大。牛会叫；行星悬浮在太空。）\n\n总之，当你看到 `interface`\
  \ 这个词时，可以先把它想象成类。然后，在脑海中记住：\n\n*   类只能继承一个父类，但一个类可以实现多个接口。\n*   父类是类继承的一组东西。但 `interface`\
  \ 是实现类*必须提供*的一组东西。\n\n可怜的 Barry 怎样？它可以成为 `Person` 类的实例，拥有任何人都拥有的字段——姓名、地址、年龄、身高、体重等。它还可以实现多个接口：\n\
  \n*   因为 Barry 实现了一个 `Professor` 接口，他必须拥有名为 `teachStudents`、`adviseStudents` 和 `gradePapers`\
  \ 的方法。\n*   因为他实现了 `Author` 接口，他必须拥有名为 `writeChapters`、`reviewChapters`、`answerEmail`\
  \ 等方法。\n\n### 两个接口\n\n想象两种不同的数据。一种来自数组的数字列。另一种是来自磁盘文件的表格（有行有列）。这两者有什么共同点？\n\n我不知道你怎么想，但我可能想显示这两种数据。所以我可以写代码来创建一个合同。合同规定：“任何签署此合同的人都同意拥有\
  \ `display` 方法。”在 Listing 15-1 中，我声明了一个 `Displayable` 接口。\n\nListing 15-1: 看！一个接口！\n\
  \n```java\npublic interface Displayable {\n    public void display();\n}\n```\n\n\
  等一下！Listing 15-1 中的 `display` 方法声明有头部但没有体。`display()` 后面没有大括号——只有一个孤零零的分号。这里发生了什么？\n\
  \n为了回答这个问题，我让 Listing 15-1 中的代码自己说明。如果列表中的代码会说话，它会这样说：\n\n> “作为一个接口，我的 `display`\
  \ 方法有头部但没有体。声称实现我（`Displayable` 接口）的类必须提供（直接或间接地）一个 `display` 方法的体。也就是说，声称实现 `Displayable`\
  \ 的类必须以某种方式提供如下类型的自己的代码：\n\n> ```java\n> public void display() {\n> // 这里写一些语句\n\
  > }\n> ```\n\n> “为了实现我（Listing 15-1 中的接口），新代码的 `display` 方法不能有参数且不返回任何（也称为 `void`）。”\n\
  \n`Displayable` 接口就像法律合同。`Displayable` 接口并没有告诉你实现类已经拥有什么。相反，`Displayable` 接口告诉实现类必须在自己的代码中声明什么。\n\
  \n除了显示数字列和表格，我可能还想汇总这两种数据。如何汇总一列数字？我不知道。也许你显示数字的总和。所以我可以写代码来创建一个合同。合同规定：“任何签署此合同的人都同意拥有\
  \ `display` 方法。”在 Listing 15-2 中，我声明了一个 `Summarizable` 接口。\n\n等等，我的意思是 `summarize`\
  \ 数字的总和。也许你汇总表格。你如何汇总数据不是我关心的。我关心的你有办法可以汇总数据。\n\n```java\npublic interface Summarizable\
  \ {\n    String summarize();\n}\n```\n\nListing 15-2: 另一个接口\n\n```java\npublic interface\
  \ Summarizable {\n    String summarize();\n}\n```\n\n记住 在接口的声明中，特定方法可能没有体。没有体的方法被称为*抽象方法*。\n\
  \n### 实现接口\n\n接口非常像类，但接口是不同的。（那么，还有什么新鲜的吗？牛像行星，但它们区别很大。）总之，当你读到 `interface` 这个词时，可以先把它想象成类。然后，在脑海中记住：\n\
  \n*   类只能继承一个父类，但一个类可以实现多个接口。\n*   父类是类继承的一组东西。但 `interface` 是实现类*必须提供*的一组东西。\n\n\
  没有体的方法被称为*抽象方法*。\n\n也就是说，声称实现 `Displayable` 的类必须以某种方式提供如下类型的自己的代码：\n\n```java\n\
  public void display() {\n    // 这里写一些语句\n}\n```\n\n为了实现我（Listing 15-1 中的接口），新代码的\
