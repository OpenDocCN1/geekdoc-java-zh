- - '#'
  - 什么时候使用 LinkedList 而不是 ArrayList？
- - '##'
  - 问题
- - '##'
  - 解决方案
- - '###'
  - 哈希表 + 链表
- - '###'
  - 1) **搜索：** 与 `LinkedList` 的搜索操作相比，`ArrayList` 的搜索操作快得多。`ArrayList` 中的 `get(int
    index)` 性能为 `O(1)`，而 `LinkedList` 的性能为 `O(n)`。
- - '###'
  - 2) **删除：** `LinkedList` 的 `remove` 操作提供 `O(1)` 的性能，而 `ArrayList` 提供的性能是可变的：最坏情况下（删除第一个元素）为
    `O(n)`，最理想情况下（删除最后一个元素）为 `O(1)`。
- - '###'
  - 3) **插入性能：** `LinkedList` 的 `add` 方法提供 `O(1)` 的性能，而 `ArrayList` 在最坏情况下为 `O(n)`。
- - '###'
  - 4) **内存开销：** `ArrayList` 维护索引和元素数据，而 `LinkedList` 维护元素数据以及指向邻居节点的两个指针，因此 `LinkedList`
    的内存消耗相对较高。
