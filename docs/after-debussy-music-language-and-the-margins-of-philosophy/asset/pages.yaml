    # Mélisande and the silence of music


    # Framing nothing


    At the beginning of Act 3 of Debussy''s *Pélas et Mélisande*, we encounter Mélisande
    alone for the first time. Seated at the window of her room in a tower of the castle,
    she sings to as she combs her hair for the night. Her song is unaccompanied, quite
    naked of any orchestral dress, but it is framed by a brief orchestral introduction,
    a musical outline of nothingness, the faintest of pencil lines on a white background.
    flickering gently across three octaves in the harp, lightly ripples the scrim
    of viola and cello harmonics, a mere breath of sound, ghosting the sustained note
    of the flute. To this is added the thin, muted line of the violins, floated in
    the distant movement of clouds in the night sky, allowing a sudden moment of moonlight,
    marked by the punctuation of the doves, a momentary thickening of the texture,
    and the repeated three-note figure given by two flutes — a gentle premonition
    of the stirring of the doves who will flight later in the scene (see Example 2.1).
    Opera composers have often found to conjure the presence of the heroine before
    her actual appearance on the stage. With these seventeen bars Debussy does something
    similar evokes an empty space. The sonic ripple runs through the orchestra frames
    almost nothing. By means of its veil of sound, silence appears.


    Debussy''s completed opera has been much discussed. It has in particular much
    discussed for its symbols, as if the opera''s relation to Symbolism meant that
    it should be full of symbols, presenting a series of musical devices that stand
    for ideas of other (non-musical) things. I take a different view. My approach
    has nothing to do with ideas of expression or communication, the carrying of messages
    or the ''freighting'' of meaning. Debussy''s *Pélas et Mélisande* does not, I
    suggest, convey either the ''interpretative meaning of the composer'' or ''the
    psycho-dramatic meaning of the original play by Maeterlinck¹. Neither do I hear
    this music as the ''encoder of the Unconscious'', whether that of the composer,
    the dramatist or the collective'
