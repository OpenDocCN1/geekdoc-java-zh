    working out, spectral compositions proceed by exploring not linguistic structures
    but spatial ones, defined by global, spatial conditions of relational rather than
    musical objects. They amplify the patterns that emerge between sounds and within
    sounds once the structures of language have dissolved.


    The constellation is a resonant image for music on many levels; rhythm, melody,
    harmony, and form exist only account of interval and the patterning of intervals,
    a network of differences like language itself. Such a revelation reveals itself
    in music only through time, as a continuously unfolding edge of the temporal moment,
    running like an elongated wave from start to finish, leaving its trace as it goes.
    For nothing did Henri Bergson look to music for an embodied image of his idea
    of his idea of the *durée* as opposed to an atomised idea of time based on the
    separation of spatial coordinates. To try to grasp music as a set of things or
    objects and you end up with ''bassoon'', ''B''; ''minim'', not the formed from
    the constellation of all its parts.


