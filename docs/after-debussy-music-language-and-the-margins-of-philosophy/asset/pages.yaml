    Schoenberg, via Stefan George’s poetry, inverts a central cultural symbol of the
    harmony between humankind and the world, and thus between words and things. At
    times, in the subsequent reception of Schoenberg’s work across the twentieth century,
    this ''explosion in the garden''28 has been taken to be a definitive and irreversible
    historical moment for the whole of western culture, the persistence of the motif
    in art, music, and literature across the last hundred years tells a different
    story. Because the space of the nocturnal garden is a heterotopos, it is not easily
    destroyed. Shakespeare and Mozart (respectively in A Midsummer’s Night Dream and
    Le nozze di Figaro) both present the nocturnal garden as a space in part which
    the dissonance of human relations is resolved by a process of coming to one’s
    senses (and thus, coming to self-presence). But in both cases, it is marked as
    an aesthetic heteropia – the fictional ‘as if’ of all art – the space of dream-illusion
    defined by music. Ravel evokes a similar space in Lefenant et les sortillés, a
    nocturnal in which the dissonant relations of the child and his environment indoors
    are reconfigured in the music of the night outdoors. ‘How wonderful to find you
    again, Garden,’ sings the child, on his return to a place in which he first has
    to acknowledge the infantile violence he has perpetrated on nature before the
    presence of forgiveness blooms in the expansion of the closing music.


    From Faurey and Ravel to Mural and Saariho, via Messiaen and Takemitsu, what all
    these pieces have in common is an emphasis on immersion in an extended moment
    rather than the unfolding of a linear or narrative tempo. As Makis Solomos puts:
    ‘To be in sound, to be immersed in sound, enveloped by sound, to travel to the
    heart of sound, to disappear into the abyss of sound [ . . . ] become the new
    metaphors, inspiring composers as much listeners.’29 This paradox is central to
    new music ‘after Debussy’: this is neither musical minimalism nor an imitation
    of models of musical temporality from outside the European tradition. This music
