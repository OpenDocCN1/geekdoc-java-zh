    a hammer without a master (sans maître) and without metre (sans mètre).43 that
    is to say, without the ordering rule of inherited schemas. This creative re-forging
    is without a master in the same way that the shipwreck of language, in Mallarmé’s
    Un coup de dés, is without a master. In Mallarmé’s a shipwreck, in Char ‘Le poème
    pulvérisé’44 a term Boulez used for his own musical language. And the constellation
    this shipwreck of language makes might recall René Char’s image of poetry as La
    parole is arch: words as a patterning in the infinity of the ocean like the tiny
    islands of some archipelago, or the pinpricks of light that form a constellation
    in the night sky.


