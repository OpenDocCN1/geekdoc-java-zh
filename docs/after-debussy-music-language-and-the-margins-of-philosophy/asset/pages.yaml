    # Reflection


    Monet''s Régates à Argenteuil (Figure 5.1) divides into two halves. A literal
    reading understands these as the reflection in the lower half of the painting
    (the surface of the river) of the real objects depicted in the upper half (the
    sailing boats, trees, buildings, and sky). But, of course, the river is no less
    real than the sky, and taken as a whole, the painting is suffused with the same
    blue that barely distinguishes between the appearance of water and air. The distinction
    between the two spaces (which allows us to know ''which way up'' the painting
    should go) is achieved by the rendering of the objects as relatively solid and
    their reflections as broken, with gaps turning colour blocks (like the white of
    the sails) into fragmented horizontal lines. On the one hand, Monet''s painting
    allows us to read it in a realistic manner (it depicts the broken effect of reflections
    on the moving surface of the water); on the other, it presents a quite radical
    reordering of the ''real'' (in the almost abstract play of the ''reflected'' lower
    half). Together, the painting presents the substance of the ''real'' and the insubstantiality
    of its reflection as two facets of the same thing. Indeed, the base of outlines
    blurs the distinction between one and the other. Just as, in Mallarmé''s account
    of the ballet dancer, it is through the movement of the dancer''s veils (voiles)
    that the dance appears, so too is it through the reflection of the boats'' sails
    (voiles) that the river appears. Just as, in Masterlin, a patterning of words
    allows the gaps between them to emerge, so too does the patterning of objects
    here allow something else to take place. The insubstantiality of reflected forms
    and colours is, on the one hand, a kind of ''nothing'' compared to the real objects
    above the water, but the painting gives both equal weight and brings into a new
    relation.


    The Impressionists'' fascination with reflections might be taken as part of a
    wider inquiry into ways of seeing and knowing the world. It is the act of seeing,
    the participation of the viewer in the appearing of the world, that is the concern
    of the painting, not the representation of its objects.'
