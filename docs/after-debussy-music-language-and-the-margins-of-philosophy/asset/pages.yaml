  md: '# PROLOGUE 5


    logic. Or, put another way, (musical) listening allows space for the indeterminacy
    of aesthetic perception whereas (philosophical) understanding hinges on the determinacy
    of the concept.¹⁶ If this is a distinction that reaches back to Kant (for whom
    the relationship is definitive of the idea of freedom), Nancy’s statement might
