    critique of Cartesian optics in favour of embodied perception. The business of
    art, as Paul Klee once underlined, ‘is not to reproduce the visible but to make
    visible’ – to appear not some ‘thing’ that hides the surfaces of objects like
    some supernatural or metaphysical presence, but a way of seeing things. Mallarmé’s
    constellation is just this: the stars were always there, they become a consolation
    when we find in their spacing a certain kind of pattern. Art takes place when
    the hard objects of the world enter into a new kind of relation with the viewer.


    Music has played with the metaphor of reflection for hundreds of years – the reflective
    symmetry of ascent and descent, to motivic inversions and retrogrades and the
    fascination with palindromic forms, to the possibilities of electro-acoustic music
    to invert harmonic spectra or reverse the decay of sounds. Debussy’s interest
    in the idea undoubtedly begins with the poetry he set. Arthur Wen discusses reflective
    symmetries in ‘La mort des am (Cinq poèmes de Baudelaire, 1887), which ‘incorporates
    the principle of reflection into every element of the music.’1 A stronger case,
    perhaps, is the Verlaine setting, ‘Lombre des arbres (Ariettes oubliées, 1885).
    In the poem, the trees are literally reflected in the water, the lover’s drowned
    hopes are metaphorically embodied in the weeping foliage. The reader is both immersed
    and reflected in the landscape as a whole. Reflection is also present at the sonic
