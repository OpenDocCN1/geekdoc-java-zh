    # Le jardin clos: Dwelling in music


    Excancement (Fulfilment), the first of Fauré’s Le jardin clos (1914), is one of
    the composer’s simplest but most subtle evocations of dwelling within the space
    of music. Even the look of the score to emphasise ‘les blancs’, the mute frames
    in Symbolist poetry.24 In the right hand of the piano, the regularity of the falling
    quaver pattern belies the fact that its harmonic content gently changes with each
    half-bar unit (see Example 6.2). It never repeats itself, while being all the
    time the same, like the image of the fountain in the nocturnal garden that appears
    in so many poems and songs of this time. The vocal line is contained within the
    space outlined by the piano figure, blending the two sonorities in a kind of heterophonic
    elaboration of the same pitch material. The voice is both immersed in the timbre
    and harmonic space and also emerges from it – distinct and articulated, but contained.
    The piano left hand appears to add a bass-line but it is one that eschews the
    normal functioning of a bass. It produces no cadence until the very end, but serves
    to gently offset the arpeggiated figures of the right hand, keep the harmonic
    space open-ended, infinitely variegated in its patterning of light shade, and
    gently dissonant in being slightly oblique to a clear tonal function. In a similar
    way, the piano makes a subtle metrical counterpoint to the voice in its movement
    on the weak beats of each bar. Rarely did Fauré find more understated and exquisite
    form for putting in motion the gap between two things otherwise so intimately
    close.'
