  md: '# 4 AFTER DEBUSY


    the problem of speaking at all, which is not a problem that has ever caused any
    one in normal circumstances to stop speaking.$^{14}


    Kramer’s breezy dismissal sounds reasonable and yet I want to disagree. Speaking
    about music is **not** the same as speaking about anything else – chairs or trees
    or cars, history or economics. Why not? Because music is itself reflective on
    the relation between speaking and not speaking, and on the relation between (bodily)
    sense, in the chair or (linguistic) signification. Speaking about music, like
    too often, proceeds in a manner that is the inverse of music’s own way of working.
    To accord no voice to the music it takes up into its own discourse. To speak about
    a chair or a tree, or history, is of a different order to speaking about music,
    in the same way that it is different from speaking about a person. I *can* speak
    about all these things in the same way, but my speech is radically different if
    another person is present to me; since she has too much to say, I don’t treat
    the chair on which she sits, as a mute object to be spoken about. Where the meeting
    of music and discourse is doomed to be sterile if the former simply makes the
    mute object of the latter. Or, put the other way, we must learn much about *music*
    and *language* by thinking through their relation in ways that allow both to speak.


    But that requires listening. Not just the act of attending to musical sound in
    a more or less directed and deliberate fashion, listening in a much expanded way
    – as a kind of openness to the material sense and logic of music that work in
    related inverse ways to those of language. Such a listening to sensuous particularity,
    however, is at odds with the kind of thinking we associate with rigorous disciplinary
    practice. It would require a suspension of (professional) discourse that resembles
    a condition of naivety. As Jean-Luc famously puts us, at the start of his book,
    *Listening:*


    Is listening something of philosophy is capable? Isn the philosopher who always
    hears (and who hears everything), but cannot listen, or who, more precisely, neutralizes
    listening within himself, so that he can philosophize?$^{15}$


    Nancy plays here on the difference of two French verbs *entendre* – to hear, but
    to understand, and *écouter* – to listen. The philosopher hears, the musician
    listens; one orders the world according to the logic of understanding, the other
    allows space for a recreational disorderly of that'
  merge: -1
