    well translated as ''drowning to tonality''67 – not an immersion but a kind of
    re-making, as follows the drowning of the mariner in *Un coup de des*. For Debussy,
    this new ''aquatic'' space of harmony brings with it a kind of ''polymorphous''
    quality (to borrow Freud’s term); compared to the phocentric law of tonal direction,
    in Debussy’s world one can enter or exit harmonic space in multiple ways. The
