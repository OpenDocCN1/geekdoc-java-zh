    poem into the next line. An elision confirmed by the rhyme scheme that requires
    line 6 to complete line 5. The midpoint of the poem''s trajectory is marked by
    a momentary silence and suspension of motion, before falling over into the second
    half of the rhyming couplet and the second half of the poem.³ reflective symmetry
    of Mallarmé''s poetic art is manifest at both a structural and semantic level.
    The rhythm and *enjambement* of each half, flowing towards and away from this
    central point of repetition, reinforces the poetic imagery itself, which hinges
    on the idea of rising (the key verb, ‘*monte*’, is delayed until the start of
    line 4) and falling (the trailing of the sun in the cold furrow of the water,
    line 10). The upward trajectory of the fountain''s jet of water is mirrored by
