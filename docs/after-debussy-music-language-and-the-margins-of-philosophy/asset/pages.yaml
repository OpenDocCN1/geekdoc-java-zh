    A century after his death, these claims for the nature of Debussy''s significance
    made by figures like Boulez, Barraquéqu, and Hodeir remain curiously timely. If
    we are still struggling to rethink our understanding of the music of the last
    one hundred years, it is perhaps because we still have not fully grasped the idea
    of music represented, embleatically, by music ''after Debussy''. Thirty years
    ago, that idea might have been offered as a correction to an over-narrow view
    of musical modernism ''after Schoenberg'', but the need for such a gesture has
    long passed. To be sure, a reading of twentieth-century music ''after Debussy''
    rather than Schoenberg, that begins with primacy of rhythm rather than pitch or
    motif and that frees itself from historic and generic anxieties, necessarily produces
    a very different picture of musical modernism. But it is not a question of backing
    one composer over another. Our understanding is not well served by a dialectical
    turn from one extreme to the other, and a French topos is not advanced as a belated
    counter-balance to Adorno''s expressive German construction of musical aesthetics
    (from Kant, Hegel, and Beethoven, by Nietzsche, Marx, Wagner, and Freud, Mahler,
    and Schoenberg). Nevertheless, listening to French voices does expose a deficit
    in Adorno''s Der Philosophie der neuen Musik (1949) and his decisive effect on
    the intellectual frameworks through which twentieth-century music was subsequently
    understood. And while Adorno''s privileging of the music of Schoenberg and his
    pupils is now widely discredited, the imprint of his thinking still shapes the
    discourses of musical modernism.


    In the decades after his death in 1969, as music took other directions, the limitations
    of Adorno''s model became increasingly obvious. Looking back, fifty years on,
    one particular ''dead-spot'' of Adorno''s is striking: his resistance to the embodied
