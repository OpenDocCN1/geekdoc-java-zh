    Images for piano (1907) (''Cloches à travers les feuilles'', ''Et la lune descend
    le temple qui fut'', ''Poissons d''Or''). As the titles suggest, Debussy’s ''image''
    is generally not of static, unchanging object disconnected to its environment,
    but precisely the movement within an environment – the sounding of bells heard
    across the leaves, the changing light as the moon falls towards the old temple,
    the filling of the rain upon the ground, the shimmering of the goldfish in the
    pond. The absence of human figures is key to the effect; there is no drama here,
    no expressing or emoting subject. Witness, in ''Jardins sous la plie'', for example,
    the erasure of specific identity in the constancy and neutrality of the semiquaver
    rhythmic figure, a movement of energy without any fixed point or reference. Instead,
    this music plays with the emerging and disappearing perceptual patterns, of movement
    towards and away. In this way, it focuses on the act of perception itself. Like
    ''jeux de vagues'', from *La mer*, is a play of forms, sounds, colors, not a saying.


    A similar pattern, in slow motion, shapes ''Pagodes''. Out of the spatial and
    harmonic content little melodic forms emerge only to fall again. The play between
    the neutrality of the pentatonic and the poignant of the melodic descent for a
    gentle dissonance whose echo of desire is, at the same time, already fulfilled
    in the rich sonority. Even when the piece expands it so without climax the whole
    space is self-contained (through register, harmony, rhythm) such that, at times,
    the extended repetitions plenty of movement – they are not blank canvases – witness
    the kind of proto-minimalism. The highly textural coda stages a draw-out process
    of disappearing, ending with the full register of the piano keyboard left ringing
    in the air (*laisser vibrer*). These pieces involve-the play of ‘Poissons d''Or’
    (capricieux et souple is the marking at b. 58). But the noisy gestural play of
    the moment, excused by the alibi of the goldfish, is contained within a resonant
    and immersive sonic space. The play between quite different temporalities – of
    the gestural present and a suspended, spatialised time – makes this piece another
    study of perception itself. The listening subject is not expressed by this music,
    nor invited to emote to putative story through music. Rather, the listener is
    drawn into a sonic environment, absorbed in the play of momentary and insubstantial
    events that emerge from, and then quickly subside into the ground. This embodies
    Merleau-Ponty’s idea of reciprocity of perception and ''ongoing interchange'';
    or, in David Abram’s words, of an improvised duet between my animal body and the
    fluid, breathing landscape that it inhabits.²²'
