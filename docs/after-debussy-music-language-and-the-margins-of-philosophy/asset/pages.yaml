    thus, for Mallarmé, something internal to poetry where it takes place between
    the sonic, sensuous and ''musical'' aspects of words and the grammatical, semantic,
    and signifying aspects of language. For reason, poetry has no need of the noisy
    art of music itself. Music may have the same ambition as poetry but it comes to
