    # Shipwreck and abyss


    If the siren voices of a wordless, pre-linguistic nature entice the unwary listener
    towards danger, like a sailor towards the rocks, what exactly is that danger?
    What is the nature of this shipwreck and drowning of the self of which the myth
    warns us? It is a theme that pervades the work of Stéphane Mallarmé, whose poetry
    is haunted by the siren, the threat of shipwreck and drowning. For Mallarmé, as
    Jacques Rancière observes, the idea of poetry itself is a linguistic adventure
    on the edge of shipwreck, ‘Salut’.47 Here, the poet runs through Mallarmé’s Poésies
    from its opening poem, the poet toasts his fellow poets as the crew of a ship,
    fearless beneath their white sail and ready to ‘clear wintry seas of blast and
    gale, all acknowledging that the poem is ‘nothing’, no more than foam (écume)
    – both that of the glass hears and of the sea in which ‘plunges far away a body
    of sirens’; But of the ship launched in the first poem, Rancière, presents several
    images of shipwreck – the wrecked itself, ‘the beautiful power of artifice’ a
    drowning, and the flank of a siren in the white foam. And who is the siren? For
    Rancière, she is the figure of fiction itself, momentarily joins two worlds together.48


    But this is more than a theme of Mallarmé’s work. As Roger Pearson has shown,
    the shipwreck first and foremost occurs in the syntax of Mallarmé’s poetry, famously
    so in the case of À la nue accablante tu’ which has no punctuation and relies
    on spatial organisation and enjambement. The shipwreck, Pearson suggests, ‘is
    no more analogy for the process whereby the ‘vessel’ of language ceases to ‘convey’
    when stripped of its traditional representational function’; even the word shipwreck
    (naufrage) suggests a breaking up of the ship in the coming together of eau and
    rage.49 For Pearson, the ‘sirène’ is at once an agent of death and a means of
    renewal and salvation: the poem as siren song both destroys everyday language
    and offers the prospect of poetic beauty.’50 The abime to which the ship is thus
    the bottomless, empty abyss of a language that has cast off from the shores of
