    A CONSTELLATION.’ The result of the shipwreck of linguistic order, the unstitching
    of its signifying forms, is a clearing of space within language itself. In the
    solidity of the things, one can now see the patterning of relations between things,
    the spacing of form that is their constellation. It recalls the effect of lines
