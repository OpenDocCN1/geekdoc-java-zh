    and multiple harmonic connections, often resorts to the negative and utilitarian
    label of ''non-functional harmony''. On the one hand, it is a reductive and ridiculous
    bewilderment that music might deploy triadic harmony to any other end than that
    of tonal progress underlines Debussy’s triadic but ''non-functional'' harmony
    constitutes a kind of tonality erasure; it undoes the tempor of tonality precisely
