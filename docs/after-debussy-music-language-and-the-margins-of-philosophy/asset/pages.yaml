    # Listening to landscape


    Imagine a music that sounds like daydreaming – a music that repeatedly turns over
    the same unarticulated thought without it becoming explicit, a faint stirring
    of the mind by some movement felt within the body, that presses briefly forward
    only to disappear unremarkably as it came, leaving behind a faint until inexplicable
    melancholy. Listening to the first movement of Debussy''s Nocturnes one thinks
    of clouds only because the title tells you. It is a good title, to be, allowing
    the listener more easily to accept a music that turns over without apparent purpose,
    and that drifts across the horizon of the listener''s perception with undirected
    nonchalance. The largely unchanging rhythmic pattern, and the essentially monochrome
    orchestral palette, with a curiously impersonal frame for the occasional return
    of the mournful figure in the cor anglais, like a half-remembered but unspoken
    regret (Example 6.1).


    Such music does not say; it takes place. It is communicative, but it does not
    convey information or communicative extraneous text. It does not pass messages,
    tell stories, express emotions, or represent things, events, or states of mind.
    That nevertheless ''fight'' with such tasks is a sign of how our linguistic culture
    refuses to tolerate music''s resistance to the communicative function of language.
    We insist, instead, that music should be a form of expression – the self-expression
    of the composer, the performer, the listener, or else the expression of ideas
    of philosophy, religion, history, or society, or even the romantics, who insisted
    music was somehow ''above'' or ''beyond'' language, at the same time framed it
    as a higher kind of communication – mysterious, but a language nevertheless.'
