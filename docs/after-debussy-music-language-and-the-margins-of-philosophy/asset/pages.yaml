  md: '# # Acknowledgements


    This book had its origins in a project funded by a Major Research Fellowship from
    the Leverhulme Foundation (2014–16) titled ‘Music, Voice, and Language in French
    Musical Thought’. I am grateful to the Foundation for funding two years of research
    leave, away from the pressures of teaching and administration, which enabled me
    to negotiate a move from my previous work on Austro-German musical culture to
    the current study of French music. I am also grateful to Royal Holloway, University
    of London, for a period of sabbatical Research leave immediately preceding the
    commencement of the Leverhulme Fellowship.


    This book has deeper roots however. They reach back thirty years to an earlier
    part of my career when I was still a composer and when the idea of music I have
    tried to articulate informed the daily business of my creative work. In this respect,
    I owe a particular debt to Jonathan Harvey, my teacher for a year (1988–89), subsequently
    a colleague for several more, and a much-loved friend and mentor until his death
    in 2012. I would dearly have liked to discuss the content of this book with him,
    and I would be delighted if I have managed, in some small way, to bring into the
    realm of discourse an idea of music he so richly embodied in his own creative
    practice and life.


    After Debussy is a wide-ranging book and necessarily shaped by a host of intellectual
    exchanges impossible to list. Those who exerted the most direct influence on my
    thinking are cited in my text, footnotes, and bibliography. But for their particular
    close encouragement and support, and for opening windows onto ways of thinking
    that I might not otherwise have across, I would like to single out for thanks
