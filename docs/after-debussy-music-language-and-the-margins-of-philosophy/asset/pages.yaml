    # Evanescence


    Music, more than most, is the art of disappearing. It is always, to borrow Mallarmé''s
    phrase, a ''dispersion volatile.''47 Musical sounds appear from within things
    (bodies, instruments, speakers) only to disperse into thin air. Mallarmé''s aerial
    metaphor for the poem, a disturbance of the air by a fan or a wing, is is apt
    for music. Taken literally, music is a shaping of the air, a patterning of sound
    waves, a pattern of vibrations, but also the perturbation of mind and body it
    occurs. No it is thing. The material substance of instruments, speakers, voices,
    and scores, are merely amplifiers, traces, and representations of a pattern, a
    set of intervals, a constellation that eludes the grasp. So the proper object
    of musical attention is not exactly nothing, but (in Derrida''s words) we in which
    this nothing is determined by disappearing. While it lasts, the act of musical
    listening oscillates between the listener and the listened, the sensual materials
    and their patterning, the vibrating body of the music and that of the listener.
    And then it is gone, but not without leaving a trace. Struck and plucked sounds
    are shaped by a moment of attack followed by a process of decay; a visible action
    is followed by an invisible resonance. Sounds produced by the breath or the movement
    of a bow have the supernatural quality of appearing to reverse this temporal curve;
    not only can the voice or the violin grow in amplitude after its onset, heard
    ''in concert'' with sound infinitely. Music takes place between these two extremes,
    between the percussive attack with almost no resonance and the sustained tone
    with apparently attack. All the musical complexities of rhythm, pitch, timbre,
    and harmony, take place within this space.


    Music after Debussy foregrounds this character of being ''vision fugitive'' (to
    borrow a phrase from Prokofiev). In place of appearing solid objects (the tonic
    triad, the theme, the closed phrase, the brass chorale), this music presents forms
    that are fleeting, momentary, and elusive. Debussy may have later shifted away
    from the ephemeral intensity of presence staged in his early setting of Mallarmé''s
    Apparition, but he never lost interest in conjuring the presence, in the musical
    play of sound and silence, of the fairy ''capped with light''—witness the evanescent
    figures of ''Eventual'' and all the fairy creatures of the Piano Preludes, both
    aerial and aquatic (Puck, the fairies who are ''exquisite dancers'', Ondine),
    figures that Jankélévitch refers to as ''Mélisande de tulle, of muslin and mist.''48
    Debussy''s music is often characterised by this art of evanescent disappearance,
    from the shy nymphs'
