    fuelled by professional and institutional anxieties, to allow musical encounter
    to resonate with and be engaged by the discourses of musicology. A refusal of
    music. More still, a refusal of oneself and a refusal of the being in the world
    that musical encounter affords. The musicologist is not alone in this, in reserving
    a certain way of being for the unspoken realm of experience while strictly expung
    it from professional activity. This, after all, is the default position of all
    professional discourse, from philosophy to politics, which is why all professional
    discourse excludes the very thing it needs. Those who write about art and music
    have a particular responsibility, because the purported object of our practice
    is a special kind of access to this special kind of being in the world. Our refusal
