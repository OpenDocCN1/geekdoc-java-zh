  md: '# 2 AFTER DEBUSY


    I place its image here as an epigraph, because its figuring makes tangible the
    productive tension between two things, the difference that joins what it also
    holds apart. My topic is the counterpoint of music and language – the play of
    two hands, kinds of creative invention, two modalities of the mind.^4


    It is precisely the charged space between two things that enables the spark that
    joins them. From the firing of microscopic synapses in the brain, the gap imaged
    by Michelangelo between the hand of Adam and the hand of God, it is the invisible
    spark gap that ignites us, not the closing of the difference. Such is my approach
    to the difference between music and language as a constitutive part of the embodied
    human mind. My focus, however, neither is the co-evolution of music and language
    in human process most^5 the similarities and differences in how our own brains
    process music and language.^6 It is, rather, an exploration of music (playing,
    listening, writing, thinking music) as a way of continually gaining the mind –
    making audible and thinkable a sparking across the gap between music and language,
    sound and grammar, embodied actions and abstract concepts. Minding the gap, in
    the sense of taking care of, attending to it and bringing it into the realm of
    self-reflection, is precisely what I invite the reader to do in these pages.


    I am not interested in this as one unbridgeable *difference*, perpetually deferred
    and unspeakable; to be clear, this is not another hymn to the ineffability of
    music. Neither do I repeat the romantic claim for music as somehow ''above'' or
    ''beyond'' language, nor fetishise music as experience of sensuous immediacy that
    language cannot provide. I am interested instead in an embodied and dynamic interaction
    between things – music and language and the world. My interest is with their close
    relationship of non-identity – a play of imitation and difference, of like and
    not-like, a counterpoint of parallels and divergences, of compensating for the
    lack of the other but always bound together. To one without the other would be
    like thinking Rodin’s sculpture one hand at a time.^7 My project therefore proceeds
    from the idea that music is better known through its dynamic and intimate relation
    of non-identity to language – and vice-versa. There is no resolution of this non-identity,
    nor is any sought. Music repeatedly becomes the topic of discourse, but continually
    asserts itself as sound in a way that discourse cannot grasp. If philosophical
    or musicological discourses shape our understanding of music by binding linguistic
    categories to bear upon it, music no less challenges those discourses by its recalcitrance
    towards them.


    It is a defining paradox of speaking about music that one of its most contrapuntal
    moves is to insist on its own redundancy. Witness a'
