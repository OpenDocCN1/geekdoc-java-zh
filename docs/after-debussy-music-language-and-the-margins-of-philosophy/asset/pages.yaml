  md: '# Prologue: Music and language


    # Music – logos – musicology


    All music is prô-logos; it comes before the discourse it provokes. In that sense,
    music making and music listening are anterior to speaking about music.¹ But isn''t
    the opposite also true? Isn''t all music made and heard in a world already pervasively
    discursive? There is no place, neither the concert hall nor of private listening,
    that isn''t already saturated with language. It''s not just that we bring linguistic
    minds to our listening, nor that all cultures of musical encounter are linguistically
    framed, but that all music is made within and against a dense weave of extra-musical
    discourse. As Albrecht argues, musical experience always occurs within an ‘enabling
    horizon of language’² So, if discourse frames music before a single sound is heard,
    then any priority we accord to musical experience is, best, or virtual. And if
    music provokes discourse, it is also true that speaking music provokes new musical
    experience. Were it not for this reciprocity, there would be little value in speaking
    of music at all.


    The tension between these ideas shapes this book. On the one hand, I urge readers
    to real-time acts of musical engagement; on the other, the words do not simply
    come as, by way of explication, interpretation, or translation. They are not a
    supplement to musical experience, neither in the sense of being additive or ancillary,
    nor the sense of substituting for music, by articulating its otherwise mute content.
    On the one hand: the figure of speech is itself telling since, as, figure, marks
    a logic of the figural (two-hand) body present within language itself. Rodin figured
    this one of his best-known sculptures. La cathédrale (1908) is larger than life-size
    study of two right hands, on the verge of touching at the very edge of the fingertips,
    a sculpture in stone that nevertheless evokes a gentle, almost imperceptible presence
    of the touch of another (see Figure 0.1).³ But it is the charged space, framed
    by the cathedral-like arch they form, is as much of the content as the hands themselves.'
