  md: '# PROLOGUE 3


    much-quoted statement of Vladimir Jankélévitch: ''Music has this in common with
    poetry, and love, and even with duty: music is not made to be spoken of, but for
    one to do; it is not made to be said, but to be ''played.'' No Music was not invented
    to be talked about. And we do, as Jankélévitch himself did, at great length and
    with great eloquence. Why should we do such a thing – to say, over and in different
    ways, that music''s saying cannot be said by language? Is it not one answer because
    reapproaching through language reframes our saying in general? Since the nondoing
    of music engages the same mind as speaking – a pattern of neural networks in the
    same brain and a structuring of energies in the same body – isn''t bringing language
    into proximity, over and again, a means to de-habituate our linguistic grasp of
    the world?10 Musical practice, in its widest sense, exhibits this free and dynamic
    mixing of words and music at every turn – from words about music, to within music.


    I am not interested in the philosophical question as to whether music is a language.
    Adorno warns us, in a short fragment from 1956, ''Music resembles a language [...]
    but music is not identical with language. The resemblance points to something
    else, but vague. Anyone who takes it literally will be seriously misled.''11 For
    Adorno, it is precisely the relationship of non-identity that defines. That is,
    music and language are better understood through their intimate relation of difference.
    Both are constituted by a temporal sequence of articulated sounds which are more
    than just sounds.'' Like language, music possesses a logic of logic, whatever
    is said by music ''cannot be detached from the music-like character,12 Adorno’s
    wider exploration of tonality and its imitation of syntactical structures of linguistic
    discourse (phrase, sentence, paragraph, answer, idea, closure). In the twentieth
    century, music''s deformation of such linguistic patterns embedded in tonality
    seemed to become all unrecognizable; for Adorno, the relation remained all the
    more critical.


    As the editors of a volume titled Speaking About Music just assert: ''It is impossible
    not to speak of music, for language and music are inextricably linked.''13 In
    the opening chapter, Lawrence Kramer (one of the most prolific and eloquent writers
    about music in recent times), asks simply ''What problem?''


    It is no problem because the problem of speaking of music is the same problem
    as the problem of speaking of anything. It is the same problem as'
