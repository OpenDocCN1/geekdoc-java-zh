    For Debussy, the very term ‘musologist’ must have sounded like a religious neologism.
    He was in his early years when Guido Adler sketched an outline for the historical
    and systematic study of music, published in the inaugural issue of the *Vierteljrschrift
    für Musikwissenschaft* in 1885.¹ The synchronicity is striking; just as music
    and poetry foregrounded the common-sense equivalence of word and was being undone,
    musicology was founded on quite different models drawn from the empirical sciences.³
    At this critical historical moment, in the face of the infinite mise opened up
    between music and language, musicology opted for firmer ground. Of course, a systematic
    and ‘scientific’ approach to music was partly a consequence of the wider philosophical
    crisis and its aesthetic parallels. As music became problematic, musicology responded
    by a the certainties of historical and scientific methods. It remains striking,
    at the very least, that work of Mallarmé, Debussy, and their contemporaries, inaugurated
    an aesthetic attitude that is wholly at odds with the worldview of Musikwissenschaft.


    Contemporary with the foundational moments of musicology, Debussy’s music questions
    the way in which the neologism formed a closing of the very gap it should reveal.
    Perhaps *mousik* and logos discloses musicology might be served better by a different
    orthography, one that draws attention to its own internal disjunction *Music//ology*,
    or *Music#ology*, or even, *Musicology* – in words, a discourse that would open
    up the gaps between music and language within it the language itself. That would
    be the task of a musicology which allowed it to be shaped by the music to which
    it listened – a musicology neither directed at rendering language into the ‘content’
    of music not seduced by the ‘nothing’ that it says, but insisting on the non-identity
