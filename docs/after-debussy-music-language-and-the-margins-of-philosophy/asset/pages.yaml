    We no longer know what music is. Its boundaries have been constantly challenged
    for over a century – from an avant garde that blurs the distinction between music
    and sound and between the agency of composers and that of listeners; from the
    perspective of an anthropology that locates music in embodied social practices
    rather than textual or sonic objects; from an logical view that understands music
    within a broader biological view of the sonic environment. One might begin to
    talk less about music such as, simply musical – a kind of being in the world that
    embodies attentiveness to ourselves and our environment. But such a condition
    of musical-in-the-world brings us not only to the margins of music, but also to
    the margins of philosophy, and quite possibly of ecology or even the history,
    it has to do with relations between things and a way of perceiving oneself as
    part of a wider world. Music is not self-contained; the edges of it must ebb against
    the shorelines of linguistic thought.


    A broad conception of a musical being-in-the-world might blur with the special
    kind of attentiveness afforded by an aesthetic attitude in general – ‘form of
    awareness’, Martin Seel suggests, that is constitutive of the human form of life’,
    without which, human beings would have a vastly diminished sense of their presence.⁷⁷
    It is not that aesthetic perception replaces conceptual development of the world
    but that it temporarily suspend the latter. Whoever can perceive something that
    is determined can also disregard this determination.⁷⁸ or to be more precise the
    fixation on this determination.⁷⁹ This would be the value of an aesthetic way
    of knowing the world – that it suspends the fixation of a conceptual, instrumental,
    thing-based way of knowing and connects us.


    In aesthetic intuition, we desist from the exclusively determining and affective
    orientation. We liberate ourselves from its determinations. We abstain for the
    sake of presence. We allow ourselves to be abducted to presence. Aesthetic intuition
    is a radical form of residency in the here and now.⁷⁹


    And yet, the musical object remains. More than that, in the very particular culture
    of musical écriture which I have focused, the musical work remains. The writing
    of sound – its self-reflective, self-critical, self-aware reconfiguring of the
    world – participates in this aesthetic attentiveness to the world but is, at the
    same time, something quite distinct. After John Cage,'
