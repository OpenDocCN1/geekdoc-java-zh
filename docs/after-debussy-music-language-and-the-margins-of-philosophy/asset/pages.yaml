    Every song is a hinge, the articulated joint of a double-door, a ‘double session’
    of two juxtaposed texts, a mise-en-abime in which the non-identical reflection
    of words in the music, and the music in the words, sets up a dynamic process without
    end. Debussy’s Mallarm songs are not unique in this regard, but they foreground
    the idea in particularly acute ways, playing with the vertinous groundlessness
    they reveal at the edges of poetic and musical language.


    The vertige they draw out is precisely the gentle dislocation of the linguistic
    mind occasioned by opening a no-identity between words and music, a dynamic space
    created by the cross-currents of significance and sense. It makes for a kind of
    dizziness, a cognitive dissonance provoked by the precarious rapture experience
    at the cliff-edge of sense. By delineating the gap, of words and music, sens and
    son, both poet and composer occasion a spark that momentarily bridges it ‘vertige’
    or ‘shudder’. Jankélitch talks of ‘surglement de l’instant, a sudden foregrounding
    of the moment that laps out of the temporal continuity of music—the tears and
    fractures in the musical surface — which is to say that it needs silence in order
    to appear.28 And the silence, conversely, needs the forming of words/sounds in
    order to appear. To borrow a resonant phrase from Merleau-Ponty, in this delicate
    play between the two, the form of being is supported by the frailty of the nothing-which
    is its accomplice.29


