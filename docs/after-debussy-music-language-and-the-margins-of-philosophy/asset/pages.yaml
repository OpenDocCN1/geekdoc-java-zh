    of all musicology to become like Golaud, bitter and bewildered, dragging Mélisande
    by the hair and demanding that she speak ‘la verité’.


    Far from bringing us to linguistic silence, Nancy underlines, ‘we have to keep
    pressing speech, language, and discourse’ against the ‘body’ of a music that relates
    to such approaches and resists them at the same time. A century after Debussy’s
    death, there are belated signs that we may be rethinking how we speak about music.
    Key to such a move is reversing the way in which musicology, from its inception,
    has massively undervalued its own object. Because musicology deferred to the assumed
    priority of a model of knowledge drawn from the human sciences, based on empirical,
    positivist, and linguistic frameworks, it largely ignored the different logic
    of musical thought – the aesthetic modes of knowledge and critical reflection
    that music affords – and turned a deaf ear to the specific nature of music’s mute
    butorous articulation. It has taken a century or so of linguistic self-reflection
    on language (from Mallarmé to Derrida, Fritz Mauthner to Albrecht Wellmer) to
    challenge this assumption of linguistic priority. In that century, the difference
    has been explored within musical écrire, in richly resonant works whose refined
    reflections on knowing the world sensuously have largely been ignored by academic
    musicology. To be sure, musicology has catalued, analysed, annotated, and curated
    this music, exhaustively recorded the provenance and reception of musical works
    and detailed the lives of their composers, but without knowing what these objects
    are or how we encounters them might occasion.


