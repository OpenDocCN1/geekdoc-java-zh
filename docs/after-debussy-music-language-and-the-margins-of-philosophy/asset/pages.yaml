    middle of the triptych, the words of a lower who knows their futility as he speaks
    them (Placet futile). Not only do these poems take the movement of air as their
    topic, each draws attention to itself as an object made of air, a sequence of
    words carried on the breath of the speaker that once spoken, disappears into the
    ether – a poetic idea to which Debussy responds with music that foregrounds its
    evanescence. His late settings of Mallarmé''s poetry reflect upon aesthetic principles
    that shape his music as a whole. In doing so, these songs offer, in exemplary
    and exquisite miniature, a musical counterpart to Mallarm''s poetry as acts of
    drawing attention to the ‘nothing’ of which they speak so eloquently.


