    Writing the body


    # L''écriture musicale


    Twenty-five years ago, Jean-Luc Nancy suggested that the body had already become
    ‘old culture’s latest, most worked, sifted, refined, dismantled, and reconstructed
    product.¹ Ten years later, Don Ihde similarly noted: ‘Bodies everywhere. Philosophy,
    writing on music in the 1970s, cultural studies, science studies, all have to
    reclaim rediscovered bodies.’² Austin wrote, in the same year, of a ‘return to
    an epistemology of embodiment’ and went on cite an extensive literature from the
    1990s and earlier.³ Given the importance of the body to Roland Barthes, writing
    to say nothing of Susan Sonag’s call for an erotics of art in 1964, the shift
    towards a more embodied aesthetics is already half a century old. Since then it
    has multiplied across the arts and humanities as part of a wider new materialism,
    a definitive shift away from the formalism of an earlier age. The move of the
    body, from its abrupt absence in discourse to its new-found centrality is well-known
    and I do not review it here. One might trace its roots to the beginning of the
    twentieth century, to Freud’s insistence on the presence of the body in the working
    of the mind, and to the origins of phenomenology in the philosophy of Husserl.
    But one might also look back to the exploration within music, visual, art, and
    literature, of a new kind of embodied materiality. If it has taken a century for
    the body to come centre stage in the realm of theory, the latter might learn something
    from the findings of art.


    But are the consequences for music of this new insistence on the body? After the
    urgent assertions of a sensing, breathing, and palpit musical body, what has been
    said about music? One answer is that such an approach reaffirms the claims of
    an embodied peculiarity – one might say, even the claims of our own embodied peculiarity
    – sound. Another answer is that this rush into the ecstatic body is a rush to
