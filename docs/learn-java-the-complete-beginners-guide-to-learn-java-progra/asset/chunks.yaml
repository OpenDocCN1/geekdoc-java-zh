  trans: "\n\n数组中存储的值类型取决于该数组的类型。例如，在下面的示例中，我声明了一个整数类型的数组。此数组将只包含整数类型的数据，不再包含其他内容。\n\
    \n```java\npublic class Candies {\n    int[] myIntArray = {1,2,3};\n}\n```\n\n\
    ### 使用数组：\n\n现在我们已经学习了如何声明不同类型的数组以及如何为它们赋值，让我们继续看看如何处理这些数组数据结构。我们可以使用之前在本书中读过的循环来遍历数组的每个索引，并对数组内部的值进行读取、打印或进行任何其他操作。在处理数组时，我们主要使用\
    \ `for` 循环，但你也可以使用我们讨论过的其他类型的循环来实现相同的功能。\n\n### 示例：\n\n```java\n// 你的 Candies\
    \ 类\npublic class Candies {\n    String[] candies = {\"m&Ms\",\"Yummybears\",\"\
    Mayfairs\"};\n    int[] myIntArray = {1,2,3};\n\n    public void ShowMyCandies()\
    \ {\n        for (int i = 0; i < candies.length; i++) {\n            System.out.println(\"\
    The name of my Candy is \" + candies[i]);\n        }\n    }\n}\n\n// 主类，在其中实例化你的\
    \ Candies 类\nimport java.io.Console;\npublic class MainClass {\n    public static\
    \ void main(String[] args) {\n        // TODO Auto-generated method stub\n   \
    \     Candies myCandies = new Candies();\n        myCandies.ShowMyCandies();\n\
    \    }\n}\n```\n\n输出:\nThe name of my Candy is m&Ms\nThe name of my Candy is Yummybears\n\
    The name of my Candy is Mayfairs\n\n### 示例 #2：\n\n```java\n// 你的 Candies 类\npublic\
    \ class Candies {\n    String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"\
    };\n    int[] myIntArray = {1,2,3};\n\n    public void ShowMyCandies() {\n   \
    \     for (int i = 0; i < candies.length; i++) {\n            System.out.println(\"\
    The name of my Candy is \" + candies[i]);\n        }\n    }\n\n    public void\
    \ ShowMyNumbers() {\n        for (int i = 0; i < myIntArray.length; i++) {\n \
    \           System.out.println(\"My Number Array Contains \" + myIntArray[i]);\n\
    \        }\n    }\n}\n\n// 主类，在其中实例化你的 Candies 类\nimport java.io.Console;\npublic\
    \ class MainClass {\n    public static void main(String[] args) {\n        //\
    \ TODO Auto-generated method stub\n        Candies myCandies = new Candies();\n\
    \        //myCandies.ShowMyCandies();\n        myCandies.ShowMyNumbers();\n  \
    \  }\n}\n```\n\n输出:\nMy Number Array Contains 1\nMy Number Array Contains 2\n\
    My Number Array Contains 3\n\n### 辅助方法：\n\n`Arrays` 还包含一些 Java 内置的辅助方法，可以让我们的生活更轻松。\n\
    \n#### `public static int binarySearch(Object[] a, Object key)`\n\n该方法使用二分查找算法在传递给它的数组中搜索值。如果该方法找到了正在查找的特定值，它将返回该值在数组中的索引。\n\
    \n#### `public static boolean equals(long[] a, long[] a2)`\n\n该方法告诉我们传递给它的两个数组是否相等。只有当数组的类型相同、元素数量相同且每个数组中的元素也相同时，数组才视为相等。此方法也可以用于任何其他基本类型的数组。\n\
    \n#### `public static void fill(int[] a, int val)`\n\n该方法将数组的每个索引的值设置为传递给该方法以及受影响数组的值。此方法也可以用于任何其他基本类型的数组。\n\
    \n#### `public static void sort(Object[] a)`\n\n该方法将任何基本类型元素的数组按升序排序。\n\n# 第 14\
    \ 章：日期和时间\n\n在 `java.util` 包中，存在一个 `Date` 类，以及其他使用内置功能编写的类。你可以使用 `date` 类进行与日期相关的操作，例如获取当前日期、对该日期字符串执行不同的函数等。\n\
    \n在本章中，我们将讨论日期以及你可以使用 `java` 对日期所执行的操作。打开你的编译器并创建一个名为 `mydateclass` 的类。\n\n```java\n\
    public class myDateClass {\n}\n```\n\n### 当前日期和时间：\n\n现在让我们使用创建的类来获取当前的日期和时间。请在类中添加以下方法。\n\
    \n```java\npublic void getDateTime() {\n    Date date = new Date();\n    System.out.println(\"\
    My Current Date and time is: \" + date.toString());\n}\n```\n\n`myDateClass` 的最终代码将如下。\n\
    \n```java\nimport java.util.Date;\npublic class myDateClass {\n    public void\
    \ getDateTime() {\n        Date date = new Date();\n        System.out.println(\"\
    My Current Date and time is: \" + date.toString());\n    }\n}\n```\n\n完成新的 `myDateClass`\
    \ 后，进入主类并创建一个 `myDateClass` 对象，然后调用 `getDateTime()` 方法。\n\n```java\nimport java.io.Console;\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   // TODO Auto-generated method stub\n        myDateClass mydate = new myDateClass();\n\
    \        mydate.getDateTime();\n    }\n}\n```\n\n当你运行上述代码时，你将获得当前日期。程序的输出将在控制窗口显示，并如下所示：\n\
    \n输出:\nMy Current Date and time is: Sat Dec 24 16:58:13 PKT 2016\n\n### 格式化日期：\n\
    \n你可以使用内置的日期格式化机制来格式化日期。\n\n### 示例：\n\n```java\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\npublic class myDateClass {\n    public void getDateTime()\
    \ {\n        Date date = new Date();\n        SimpleDateFormat newFormat = new\
    \ SimpleDateFormat (\"E yyyy-MM-dd 'at' hh:mm:ss a zzz\");\n        System.out.println(\"\
    Current Date is: \" + newFormat.format(date));\n    }\n}\n\nimport java.io.Console;\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   // TODO Auto-generated method stub\n        myDateClass mydate = new myDateClass();\n\
    \        mydate.getDateTime();\n    }\n}\n```\n\n输出:\nCurrent Date is: Sat 2016-12-24\
    \ at 05:18:02 PM PKT\n\n你也可以使用 Java 中的 `printf` 语句来格式化日期。\n\n### 示例：\n\n```java\n\
    import java.text.SimpleDateFormat;\nimport java.util.Date;\npublic class myDateClass\
    \ {\n    public void getDateTime() {\n        Date date = new Date();\n      \
    \  String mystring = String.format(\"Current Date and Time is : %tc\",date);\n\
    \        System.out.printf(mystring);\n    }\n}\n\nimport java.io.Console;\npublic\
    \ class MainClass {\n    public static void main(String[] args) {\n        //\
    \ TODO Auto-generated method stub\n        myDateClass mydate = new myDateClass();\n\
    \        mydate.getDateTime();\n    }\n}\n```\n\n输出:\nCurrent Date and Time is\
    \ : Sat Dec 24 17:24:26 PKT 2016\n\n"
- fmt: "\nThe name of my Candy is Yummybears\n\nThe name of my Candy is Mayfairs\n\
    \nIn the above example we have a class named `Candies`. Inside that class we declared\
    \ a method called `ShowMyCandies` this method loops through the `candies` array\
    \ and prints all the name of candies on the console screen. We call this function\
    \ after making an object of the class in which this method resides. This is an\
    \ instance method because it can only be used once you instantiate the class.\
    \ We can also do this by a static method. Here’s how:\n\n### Example:\n\n```java\n\
    // Your Candies Class\npublic class Candies {\n    String[] candies = {\"m&Ms\"\
    ,\"Yummybears\",\"Mayfairs\"};\n    int[] myIntArray = {1,2,3};\n\n    public\
    \ static void ShowMyCandies(){\n        for (int i = 0; i < candies.length; i++)\
    \ {\n            System.out.println(\"The name of my Candy is \" + candies[i]);\n\
    \        }\n    }\n}\n\n// Main Class where you instantiate your Candies class\n\
    import java.io.Console;\n\npublic class MainClass {\n    public static void main(String[]\
    \ args) {\n        // TODO Auto-generated method stub\n        Candies.ShowMyCandies();\n\
    \    }\n}\n```\n\nOutput:\nThe name of my Candy is m&Ms\nThe name of my Candy\
    \ is Yummybears\nThe name of my Candy is Mayfairs\n\nThe highlighted part in the\
    \ above example are the changes I made to the original `Candies` class. Just by\
    \ adding a keyword `static` to my method definition I have changed the way it’s\
    \ called. Now you can call the `ShowMyCandies` method directly by using the class\
    \ name.\n\nThe `Void` keyword used in the above methods means that the method\
    \ above doesn’t return anything.\n\n# Chapter 16: Exceptions\n\nException are\
    \ errors in our code. When an exception occurs it means that the flow of the program\
    \ you were running has been disturbed. The exceptions cause the programs to behave\
    \ abnormally so we should take some precautions in order to deal with these exceptions.\n\
    \nSo far the code we dealt with was error free. But now in order to understand\
    \ exceptions and how to deal with them, I will generate some errors in a code\
    \ and then I will teach you guys how to deal with those errors so have a look\
    \ at the following code:\n\n### Example:\n\n```java\nimport java.io.Console;\n\
    \npublic class ErrorClass {\n    public static void main(String[] args) {\n  \
    \      String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"};\n        System.out.println(candies[4]);\n\
    \    }\n}\n```\n\nOutput:\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\nat ErrorClass.main(ErrorClass.java:16)\n\nThe above error occurred because\
    \ the array `candies` have three values stored at zero, first and second index\
    \ of the array respectively. But in the second line where I try to print this\
    \ array I pass it the index four which does not exist as an array is a fixed size\
    \ data structure. I can correct this error just by updating the index of the array.\
    \ Here’s how:\n\n### Example:\n\n```java\nimport java.io.Console;\n\npublic class\
    \ ErrorClass {\n    public static void main(String[] args) {\n        String[]\
    \ candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"};\n        System.out.println(candies[1]);\n\
    \    }\n}\n```\n\nOutput:\nYummybears\n\nNow How to avoid this? How do we make\
    \ sure that we the programmers handle the exceptions rather than displaying the\
    \ end user a lot of technical details which he doesn’t understand? The answer\
    \ to that is also present in Java. In Java there is exception handling. Which\
    \ is done by using the `try-catch` blocks available in java.\n\n```java\ntry {\n\
    \  // Protected code\n}catch(ExceptionName e1) {\n  // Catch block\n}\n```\n\n\
    The `try` block is the block where you write your code. And the `catch` block\
    \ is the block where you handle your exceptions. I re-created the error inside\
    \ a `try-catch` block.\n\n### Example:\n\n```java\nimport java.io.Console;\n\n\
    public class ErrorClass {\n    public static void main(String[] args) {\n    \
    \    try {\n            String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"\
    };\n            System.out.println(candies[4]);\n        } catch (Exception e)\
    \ {\n            System.out.println(\"Something went wrong\");\n        }\n  \
    \  }\n}\n```\n\nOutput:\nSomething went wrong\n\nYou see? Now the code doesn’t\
    \ show us the real exception but just the alternative text we added in our code.\
    \ We can also see technical detail if we want to doing this.\n\n### Example:\n\
    \n```java\nimport java.io.Console;\n\npublic class ErrorClass {\n    public static\
    \ void main(String[] args) {\n        try {\n            String[] candies = {\"\
    m&Ms\",\"Yummybears\",\"Mayfairs\"};\n            System.out.println(candies[4]);\n\
    \        } catch (Exception e) {\n            System.out.println(\"Something went\
    \ wrong: \" + e.getMessage());\n        }\n    }\n}\n```\n\nOutput:\nSomething\
    \ went wrong: 4\n\nAs you can see now the exception is showing us the value that\
    \ it thinks has caused the error. If you want to see more detail about the exception\
    \ you can do this too:\n\n### Example:\n\n```java\nimport java.io.Console;\n\n\
    public class ErrorClass {\n    public static void main(String[] args) {\n    \
    \    try {\n            String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"\
    };\n            System.out.println(candies[4]);\n        } catch (Exception e)\
    \ {\n            throw e;\n        }\n    }\n}\n```\n\nOutput:\nException in thread\
    \ \"main\" java.lang.ArrayIndexOutOfBoundsException: 4\nat ErrorClass.main(ErrorClass.java:16)\n\
    \nThe cause of exception can be anything. It can be a logical mistake programmer\
    \ made while writing the code, or it can be because of the system you are working\
    \ on or the memory stack getting full. Sometimes Java Virtual Machine (`JVM`)\
    \ also end up being the cause of unwanted behaviors.\n\nYou can use multiple catch\
    \ blocks for a single try block. The reason you would want to do that is because\
    \ you expect more than one type of exception occurring. So you de declare multiple\
    \ catch blocks and attend each error accordingly. A general template for multiple\
    \ catch blocks is given below.\n\n```java\ntry {\n  // Protected code\n}catch(ExceptionType1\
    \ e1) {\n  // Catch block\n}catch(ExceptionType2 e2) {\n  // Catch block\n}catch(ExceptionType3\
    \ e3) {\n  // Catch block\n}\n```\n\n# Chapter 17: Inner Classes\n\nIn java we\
    \ can create nested classes just like nested if statements or nested functions.\
    \ Inner Classes are kind of a security mechanism provided by java. Following is\
    \ the general syntax for declaring an inner class:\n\n```java\nclass OuterClass\
    \ {\n    class InnerClass {\n    }\n}\n```\n\nHere’s a real code example.\n\n\
    ### Example:\n\n```java\nimport java.io.Console;\n\npublic class Candies {\n \
    \   private class chocoCandies {\n        public void Hello(){\n            System.out.println(\"\
    Hello from the inner Choco Candies Class\");\n        }\n    }\n\n    public void\
    \ displayChocoClass() {\n        chocoCandies mychoco = new chocoCandies();\n\
    \        mychoco.Hello();\n    }\n}\n\nimport java.io.Console;\n\npublic class\
    \ MainClass {\n    public static void main(String[] args) {\n        Candies myCandies\
    \ = new Candies();\n        myCandies.displayChocoClass();\n    }\n}\n```\n\n\
    Output:\nHello from the inner Choco Candies Class\n\n# Conclusion\n\nNow that\
    \ we have come to an end of this small book. I hope that you have learned something.\
    \ You should not stop here because there is more to java than this book. Read\
    \ as much as you can and most importantly code as much as you can. Only then you\
    \ will be able to master java. Happy Coding!\n"
