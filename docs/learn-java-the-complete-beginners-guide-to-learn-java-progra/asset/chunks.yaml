    \ this document.\n\n# Table of Contents\n- Introduction\n- Chapter 1: Environmental\
    \ Setup\n- Chapter 2: Basic Syntax\n- Chapter 3: Objects and Classes\n- Chapter\
    \ 4: Basic Datatypes\n- Chapter 5: Variable Types\n- Chapter 6: Modifier types\n\
