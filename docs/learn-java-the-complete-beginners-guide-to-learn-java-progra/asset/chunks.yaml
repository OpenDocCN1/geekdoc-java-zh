    \n* `char variableOfType_char = 'a';` //this is how you declare a variable of\
    \ type 'char' in Java.\n* `char variable2ofType_char = 'c';` //Another example.\n\
    \n### Reference Types:\n\nReference type variables are class objects. You can\
    \ also consider arrays of different types an example of reference type variables.\
    \ The default value of these kind of variables is `NULL`. See the following Example.\n\
    \n```java\nimport java.sql.Date;\n\npublic class Employee {\n    String name;\n\
    \    Date DateOfBirth; //Reference Variable\n    int Age; //Primitive Type Variable\n\
    \    String Designation;\n}\n```\n\nVariables are used in java to store different\
    \ type of values. Each variable has a type and value. The type of a variable tells\
    \ java the type of value it will possess and the range of that value. It also\
    \ helps us narrow down the type of operations that can be applied on that variable.\n\
    \nA variable must be declared before it’s used. Following is a generic template\
    \ for declaring a variable\n\n`Datatype Variable’s name = Variable’s Value;`\n\
    \n`int Age = 24;`\n\nData type represents the type of data this variable will\
    \ carry, `Variable’s name` will show its name and then after the equal sign you\
    \ will assign it a value based on its type.\n\nThere are three kind of variables:\n\
    \n* Local Variable.\n* Instance Variables.\n* Class/Static Variables.\n\n####\
    \ Local Variables:\n\nLocal variables are the type of variables that are declared\
    \ and used inside a block of code. Local variables can be declared inside methods,\
    \ constructors and other code blocks like If-else, switch etc. these kind of variables\
    \ are created when the compiler enters that block of code and are deleted when\
    \ the compiler exists that block. Local variables cannot use access modifiers\
    \ like `public/private` with them as they have a limited scope.\n\n###### Example:\n\
    \nIn the following example the `Employee` Class has a method `calculateAge()`\
    \ in which we are assigning a value to `Age` variable and are also printing it\
    \ out on the console window.\n\n```java\nimport java.sql.Date;\n\npublic class\
    \ Employee {\n    public void calculateAge() {\n        int Age = 0;\n       \
    \ Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\nThe employee\
    \ class is instantiated in the main class and the function `calculateAge()` gets\
    \ called.\n\n```java\nimport java.io.Console;\n\npublic class TestOne {\n    public\
    \ static void main(String[] args) {\n        // TODO Auto-generated method stub\n\
    \        Employee human = new Employee();\n        human.calculateAge();\n   \
    \ }\n}\n```\n\nOutput:\n24\n\n#### Instance Variables:\n\nInstance variables are\
    \ declared inside of a class and outside of any code block like if-else, methods\
    \ etc. These variables are used when an object of a class is created. When an\
    \ object of a class is created, memory in heap is allocated to that object and\
    \ part of that heap are allocated to each instance variable. Instance variables\
    \ life starts when an object is created and ends when that objects ends. You can\
    \ set the access level of an instance variable. The default values of instance\
    \ variables depend on its data type. Look at the previous chapter for variables\
    \ data types and their default values.\n\n###### Example:\n\n```java\nimport java.sql.Date;\n\
    \npublic class Employee {\n    String name; //Example of Instance Variables\n\
    \    Date DateofBirth; //Example of Instance Variables\n    String Designation;\
    \ //Example of Instance Variables\n\n    public void calculateAge() {\n      \
    \  int Age = 0;\n        Age = Age + 24;\n        System.out.println(Age);\n \
    \   }\n}\n```\n\n#### Class/Static Variables:\n\nClass variables or static variables\
    \ are variables that are declared outside of block or methods but inside of class\
    \ with a `static` keyword. Static variables will have only one value per class\
    \ and the number of object that class has will not effect this static variable.\
    \ The static variables are stored in static memory. The static variables are accessed\
    \ by the following way\n\n`ClassName.StaticVariableName`\n\n`Employee.Name;`\n\
    \n###### Example:\n\n```java\nimport java.sql.Date;\n\npublic class Employee {\n\
    \    String name; //Example of Instance Variables\n    Date DateofBirth; //Example\
    \ of Instance Variables\n    String Designation; //Example of Instance Variables\n\
    \n    private static double salary; //Example of Class/Static Variables\n    private\
    \ static String Department; //Example of Class/Static Variables\n\n    public\
    \ void calculateAge() {\n        int Age = 0;\n        Age = Age + 24;\n     \
    \   System.out.println(Age);\n    }\n}\n```\n\n# Chapter 6: Modifier types\n\n\
    Java has two type of modifiers:\n\n* Access Modifiers\n* Non-Access Modifiers\n\
    \n#### Access Modifiers:\n\nAccess modifiers are the type of modifiers that decide\
    \ who can see a certain variable, class, method etc. It has multiple types.\n\n\
    ##### public:\n\nThe `public` access modifier will allow any class, interface,\
    \ method, etc.\n\n###### Example:\n\n```java\npublic class Employee {\n    int\
    \ speed = 0;\n    public void calculateAge() {\n        int Age = 0;\n       \
    \ Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\n##### private:\n\
    \nWhen the `private` keyword is attached with a variable it means that it will\
    \ be accessed only from that class. Private is the most restricted level.\n\n\
    ###### Example:\n\n```java\npublic class Car {\n    int speed = 0;\n    private\
    \ String make = \"BMW\";\n    public void calculatespeed() {\n        speed =\
    \ 24;\n        System.out.println(speed);\n    }\n}\n```\n\n##### protected:\n\
    \nThe `protected` keyword is used to restrict access of variables and methods.\
    \ The `protected` code of a parent class is only allowed to be accessed by its\
    \ child class.\n\n###### Example:\n\n```java\nclass SongPlayer {\n    protected\
    \ boolean PlaySongs(Songs s) {\n        // implementation details\n    }\n}\n\n\
    class EnglishSongsPlayer extends SongPlayer {\n    public boolean PlaySongs(Songs\
    \ s) {\n        // implementation details\n    }\n}\n```\n\n#### Non-Access Variables:\n\
    \n##### static:\n\nYou can declare `static` variables or `static` methods. Use\
    \ of word `static` will ensure that the declared variable or method would only\
    \ be allowed to access by the name of class rather than its object.\n\n##### final:\n\
    \nThe `final` keyword is used to restrict the use of a variable after its initialized.\
    \ Meaning you cannot initialize an already initialized variable which has a `final`\
    \ keyword attached with it.\n\n# Chapter 7: Basic Operators\n\nIn Java there are\
    \ multiple types of operators and by using these operators you can perform mathematical\
    \ or logical operations.\n\nLet’s suppose, there are two variables named `a` and\
    \ `b`. `a` is equal to `10` and `b` is equal to `20`.\n\n### Arithmetic operators:\n\
    \nThe following table contains all the info you need for arithmetic operators\
    \ in java.\n\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n|\
    \ `+` (Addition) | For adding values | `a + b = 30` |\n| `-` (Subtraction) | For\
    \ subtracting values | `a - b = -10` |\n| `*` (Multiplication) | For multiplying\
    \ values | `a * b = 200` |\n| `/` (Division) | For dividing values | `b / a =\
    \ 2` |\n| `%` (Modulus) | For getting remainders | `b % a = 0` |\n| `++` (Increment)\
    \ | Add 1 to value. | `b++ gives 21` |\n| `--` (Decrement) | Subtract 1 from value.\
    \ | `b-- gives 19` |\n"
