  trans: "\n我的糖果名字是 Yummybears\n\n我的糖果名字是 Mayfairs\n\n在上面的示例中，我们有一个名为 `Candies` 的类。在该类内部，我们声明了一个名为\
    \ `ShowMyCandies` 的方法，该方法遍历 `candies` 数组并在控制屏幕上打印所有糖果的名字。我们在创建该方法所属类的对象后调用了此函数。这是一个实例方法，因为它只有在实例化该类后才能使用。我们也可以通过静态方法来实现这一点。方法如下：\n\
    \n### 示例：\n\n```java\n// Your Candies Class\npublic class Candies {\n    String[]\
    \ candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"};\n    int[] myIntArray = {1,2,3};\n\
    \n    public static void ShowMyCandies(){\n        for (int i = 0; i < candies.length;\
    \ i++) {\n            System.out.println(\"The name of my Candy is \" + candies[i]);\n\
    \        }\n    }\n}\n\n// Main Class where you instantiate your Candies class\n\
    import java.io.Console;\n\npublic class MainClass {\n    public static void main(String[]\
    \ args) {\n        // TODO Auto-generated method stub\n        Candies.ShowMyCandies();\n\
    \    }\n}\n```\n\n输出：\nThe name of my Candy is m&Ms\nThe name of my Candy is Yummybears\n\
    The name of my Candy is Mayfairs\n\n上述示例中高亮部分是我对原始 `Candies` 类所做的更改。通过仅在方法定义中添加\
    \ `static` 关键字，我就改变了它的调用方式。现在，你可以直接通过类名调用 `ShowMyCandies` 方法。\n\n上述方法使用的 `Void`\
    \ 关键字意味着该方法不返回任何内容。\n\n# 第 16 章：异常 (Exceptions)\n\n异常是我们代码中的错误。当异常发生时，意味着你正在运行的程序流被干扰。异常会导致程序行为异常，因此我们应该采取一些预防措施来处理这些异常。\n\
    \n到目前为止，我们处理的代码没有错误。但现在为了理解异常以及如何处理它们，我将在代码中生成一些错误，然后教你们如何处理这些错误，请看以下代码：\n\n###\
    \ 示例：\n\n```java\nimport java.io.Console;\n\npublic class ErrorClass {\n    public\
    \ static void main(String[] args) {\n        String[] candies = {\"m&Ms\",\"Yummybears\"\
    ,\"Mayfairs\"};\n        System.out.println(candies[4]);\n    }\n}\n```\n\n输出：\n\
    Exception in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 4\nat ErrorClass.main(ErrorClass.java:16)\n\
    \n上述错误的发生是因为 `candies` 数组分别在索引的零、第一和第二个处存储了三个值。但在第二行我尝试打印此数组时，我传递了索引四，这是不存在的，因为数组是固定大小的数据结构。我可以通过更新数组索引来纠正这个错误。方法如下：\n\
    \n### 示例：\n\n```java\nimport java.io.Console;\n\npublic class ErrorClass {\n \
    \   public static void main(String[] args) {\n        String[] candies = {\"m&Ms\"\
    ,\"Yummybears\",\"Mayfairs\"};\n        System.out.println(candies[1]);\n    }\n\
    }\n```\n\n输出：\nYummybears\n\n现在如何避免这种情况？我们如何确保由程序员来处理异常，而不是向终端用户显示大量他不理解的技术细节？答案也存在于\
    \ Java 中。在 Java 中有异常处理机制，它通过使用 java 中提供的 `try-catch` 块来实现。\n\n```java\ntry {\n\
    \  // Protected code\n}catch(ExceptionName e1) {\n  // Catch block\n}\n```\n\n\
    `try` 块是你编写代码的地方。而 `catch` 块是你处理异常的地方。我在 `try-catch` 块中重新创建了该错误。\n\n### 示例：\n\n\
    ```java\nimport java.io.Console;\n\npublic class ErrorClass {\n    public static\
    \ void main(String[] args) {\n        try {\n            String[] candies = {\"\
    m&Ms\",\"Yummybears\",\"Mayfairs\"};\n            System.out.println(candies[4]);\n\
    \        } catch (Exception e) {\n            System.out.println(\"Something went\
    \ wrong\");\n        }\n    }\n}\n```\n\n输出：\nSomething went wrong\n\n看到了吗？现在代码没有向我们显示真实的异常，而是显示了我们在代码中添加的备文本。如果我们想这样做，也可以看到技术细节。\n\
    \n### 示例：\n\n```java\nimport java.io.Console;\n\npublic class ErrorClass {\n \
    \   public static void main(String[] args) {\n        try {\n            String[]\
    \ candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"};\n            System.out.println(candies[4]);\n\
    \        } catch (Exception e) {\n            System.out.println(\"Something went\
    \ wrong: \" + e.getMessage());\n        }\n    }\n}\n```\n\n输出：\nSomething went\
    \ wrong: 4\n\n现在你可以看到，异常向我们展示了它认为导致错误的值。如果你想看到关于异常的更多细节，也可以这样做：\n\n### 示例：\n\n\
    ```java\nimport java.io.Console;\n\npublic class ErrorClass {\n    public static\
    \ void main(String[] args) {\n        try {\n            String[] candies = {\"\
    m&Ms\",\"Yummybears\",\"Mayfairs\"};\n            System.out.println(candies[4]);\n\
    \        } catch (Exception e) {\n            throw e;\n        }\n    }\n}\n\
    ```\n\n输出：\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\nat ErrorClass.main(ErrorClass.java:16)\n\n异常的原因可能是任何的。它可以是程序员在编写代码时的逻辑错误，也可能是由于你运行的系统内存栈溢出。有时\
    \ Java 虚拟机 (`JVM`) 也会导致异常行为。\n\n你可以对单个 `try` 块使用多个 `catch` 块。你这样做是因为你预计会发生多种类型的异常。因此你需要声明多个\
    \ `catch` 块并相应地处理。下面是多个 catch 块的通用模板：\n\n```java\ntry {\n  // Protected code\n\
    }catch(ExceptionType1 e1) {\n  // Catch block\n}catch(ExceptionType2 e2) {\n \
    \ // Catch block\n}catch(ExceptionType3 e3) {\n  // Catch block\n}\n```\n\n# 第\
    \ 17 章：内部类 (Inner Classes)\n\n在 Java 中，我们可以创建嵌套类，就像嵌套语句或嵌套函数一样。以下是声明内部类的通用语法：\n\
    \n```java\nclass OuterClass {\n    class InnerClass {\n    }\n}\n```\n\n这是一个真实的代码示例。\n\
    \n### 示例：\n\n```java\nimport java.io.Console;\n\npublic class Candies {\n    private\
    \ class chocoCandies {\n        public void Hello(){\n            System.out.println(\"\
    Hello from the inner Choco Candies Class\");\n        }\n    }\n\n    public void\
    \ displayChocoClass() {\n        chocoCandies mychoco = new chocoCandies();\n\
    \        mychoco.Hello();\n    }\n}\n\nimport java.io.Console;\n\npublic class\
    \ MainClass {\n    public static void main(String[] args) {\n        Candies myCandies\
    \ = new Candies();\n        myCandies.displayChocoClass();\n    }\n}\n```\n\n\
    输出：\nHello from the inner Choco Candies Class\n\n# 结语\n\n现在我们来到了这本小书的结尾。我希望你学到了东西。你不应该在这里停止，因为\
