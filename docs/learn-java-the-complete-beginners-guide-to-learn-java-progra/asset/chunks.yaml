    \ that all of these primitive types come from an abstract numbers class. When\
    \ we create variables of primitive types what really happens behind the scene\
    \ is that the primitive types gets wrapped around by the `Numbers` class and as\
    \ a result an object is created. This process of creating an object from a primitive\
    \ type is known as `boxing`. When we convert an object to a primitive type which\
    \ most of the time what the compilers does to show us numbered values is known\
    \ as `un-boxing`.\n\n### Number Methods:\n\nThe `Number` class has a lot of built\
