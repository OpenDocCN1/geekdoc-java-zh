  trans: "\n\nJava 关键字是 Java 语言本身使用的保留字，Java 不允许程序员使用这些单词。下面的列表显示了 Java 中的保留字。这些保留字不能作为常量、变量或任何标识符的名称，这意味着你不能使用下面描述的精确字汇来命名类的属性（变量）或类的行为（方法）。\n\
    \n| continue | abstract | Switch | for | new |\n| default | assert | synchronized\
    \ | goto | package |\n| do | boolean | this | if | private |\n| double | break\
    \ | throw | implements | protected |\n| else | byte | throws | import | public\
    \ |\n| enum | case | transient | instanceof | return |\n| extends | catch | try\
    \ | int | short |\n| final | char | void | interface | static |\n| finally | class\
    \ | volatile | long | strictfp |\n| float | const | while | native | super |\n\
    \n### 注释\n\nJava 中有多种类型的注释。单行注释和块注释。下面的示例展示了 Java 中多种类型的注释。\n\n### 示例\n\n```java\n\
    public  class TestOne {\n\n /* This is my first java program.\n     * This will\
    \ print 'Hello World' as the output\n* This is an example of multi-line comments.\n\
    \     */\n\n public  static  void main(String []args) {\n\n // This is an example\
    \ of single line comment\n\n /* This is also an example of single line comment.\
    \ */\n\n      System.out.println(\"Hello World\"); // prints Hello World\n\n \
    \ }\n\n}\n```\n\n# 第 3 章：对象与类\n\nJava 是一种面向对象的语言，这意味着它拥有对象和类。通过我之前的讨论，你可能对对象和类有一个大致的概念。现在我将在这里详细解释这些概念。\n\
    \n### 对象\n\n对象是具有某些属性和行为的东西。将人类视为现实生活中的实体，现在我们将人类映射到我们的软件对象。人类有名字、年龄等；他走路、说话、吃饭等，这些都是它的行为。\n\
    \n### 类\n\n类是一个蓝图，通过使用这些蓝图我们创建对象。下面是一个 Java 类的示例。如果你愿意，可以随意修改。\n\n### 示例\n\n```java\n\
    public  class Human {\n\nString name;\nint age;\nString gender;\n\nvoid walks()\
    \ {\n// 人走路时会发生什么\n\n}\n\nvoid talks() {\n// 人说话时会发生什么\n}\n\nvoid eats() {\n//\
    \ 人吃饭时会发生什么\n\n}\n\n}\n```\n\n现在我们可以使用上述蓝图来创建任意数量的对象。一个类可以有多种类型的变量。\n\n### 局部变量\n\
    \n局部变量是在方法、构造函数或块内部声明的变量。\n\n### 实例变量\n\n实例变量是在类内部声明的变量，并且允许在类实例化后使用。\n\n### 类变量\n\
    \n类变量使用 `static` 关键字声明，它们可以通过类名直接使用。\n\n### 构造函数\n\n构造函数是类内部的一个方法，当我们创建该类的对象时会被调用。构造函数用于在创建类对象时为属性赋值或调用某个方法。下面是一个构造函数的示例：\n\
    \n### 示例\n\n```java\npublic  class Human {\n\nString name;\nint age;\nString gender;\n\
    \npublic Human() {\n// 这是构造函数，你可以在这里给你的变量赋值。\n// 或者你可以调用函数。\n}\n\nvoid walks()\
    \ {\n// 人走路时会发生什么\n}\n\nvoid talks() {\n// 人说话时会发生什么\n}\n\nvoid eats() {\n// 人吃饭时会发生什么\n\
    \n}\n\n}\n```\n\n现在让我们谈谈创建我们自己的对象。在你的 IDE 中创建一个名为 `Human.java` 的类，并将下面的 Human\
    \ 类的内容写入到你的新类中。现在回到你的 `TestOne.java` 类并查看 `main` 方法。这是我们将用于实例化 Human 类对象的方法。在下面的\
    \ TestOne 类中编写对应的代码。运行程序，你将在控制台窗口看到 John。\n\n### 示例\n\n**Human.java**\n```java\n\
    public  class Human {\n\nString name;\nint  age;\nString gender;\n\nvoid walks()\
    \ {\n// 人走路时会发生什么\n}\n\nvoid talks() {\n// 人说话时会发生什么\n}\n\nvoid eats() {\n// 人吃饭时会发生什么\n\
    \n}\n\n}\n```\n\n**TestOne.java**\n```java\nimport java.io.Console;\n\npublic\
    \  class TestOne {\n\npublic  static  void main(String[] args) {\n// TODO Auto-generated\
    \ method stub\nHuman human = new Human();\nhuman.name = \"John\";\nSystem.out.println(human.name);\n\
    \n}\n\n}\n```\n\n继续给 `age` 和 `gender` 变量赋值并尝试打印它们。这对你来说是一个很好的练习。\n\n# 第 4 章：基本数据类型\n\
    \n变量在内部存储值。它们只是预留的内存位置，你可以在其中存储多种类型的值。Java 有两种主要的变量，在本章中我们不仅涵盖这些类型，还将涵盖它们的子类型。Java\
    \ 中的主要变量类型有：\n\n*   基本数据类型\n*   引用对象/数据类型\n\n### 基本数据类型\n\n基本数据类型是那些在 Java 中定义的类型。Java\
    \ 还为这些类型制定了某些规则，例如它们将存储什么类型的值？它们的范围是多少？等。Java 有八种基本类型。下面将详细解释每种基本类型。\n\n#### byte\n\
    \n*   `byte` 是一个 8 位有符号整数。\n*   范围是从 -128 到 127。\n*   当值较小时用于节省内存。\n\n#### 示例\n\
    ```java\nbyte b = 10;\n```\n\n#### short\n\n*   `short` 是一个 16 位有符号整数。\n*   范围是从\
    \ -32,768 到 32,767。\n\n#### 示例\n```java\nshort s = 100;\n```\n\n#### int\n\n*\
    \   `int` 是一个 32 位有符号整数。\n*   范围是从 -2,147,483,648 到 2,147,483,647。\n*   这是最常用的数据类型。\n\
    \n#### 示例\n```java\nint i = 1000;\n```\n\n#### long\n\n*   `long` 是一个 64 位有符号整数。\n\
    *   当整数值超过 `int` 的范围时使用。\n*   值通常以 `L` 结尾。\n\n#### 示例\n```java\nlong l = 15000000000L;\n\
    ```\n\n#### float\n\n*   `float` 是一个 32 位 IEEE 754 浮点数。\n*   用于小数。\n*   值通常以 `f`\
    \ 结尾。\n\n#### 示例\n```java\nfloat f = 10.99f;\n```\n\n#### double\n\n*   `double`\
    \ 是一个 64 位 IEEE 754 浮点数。\n*   Java 中小数的默认类型。\n\n#### 示例\n```java\ndouble d = 19.99;\n\
    ```\n\n#### char\n\n*   `char` 代表单个 16 位的 Unicode 字符。\n*   用于存储单个字符。\n\n#### 示例\n\
    ```java\nchar c = 'A';\n```\n\n#### boolean\n\n*   `boolean` 仅存储两个值：`true` 或 `false`。\n\
    \n#### 示例\n```java\nboolean is = true;\n```\n\n"
- fmt: "\n# Chapter 5: Variable Types\n\n* `double variable2ofType_double = 101.3d;`\
    \ //Another example.\n\n### boolean:\n\n* `boolean` stores one-bit information.\n\
    * By default its value is `false`.\n* This type of variables is used for storing\
    \ `true/false` values.\n\n#### Example:\n\n* `boolean variableOfType_boolean =\
    \ true;` //this is how you declare a variable of type 'boolean' in Java.\n* `boolean\
    \ variable2ofType_boolean = false;` //Another example.\n\n### char:\n\n* `char`\
    \ stores 16-bit Unicode characters.\n* `Char` is used to store characters.\n*\
