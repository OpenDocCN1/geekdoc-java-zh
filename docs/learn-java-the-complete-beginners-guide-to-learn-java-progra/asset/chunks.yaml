    \ of a single or multiple conditions and the lines of code that execute if the\
    \ conditions are met. If the conditions aren’t met the `else` block of this statement\
    \ executes.\n\n#### Example:\n\n```java\nif (false) {\n    System.out.println(\"\
    This is an if-else statement example\");\n}\nelse {\n    System.out.println(\"\
    Else block's output\");\n}\n```\n\n**Output:**\n\nElse block's output\n\nThe condition\
    \ inside the `if` statement above is false so the compiler will jump to the `else`\
    \ block to print the above mentioned output.\n\n### Switch Statement:\n\nA switch\
    \ is very much like an If statement and it works just like an if statement. But\
    \ what if you have a lot of conditions and you want to do different operations\
    \ for each condition, you’ll have to write multiple if statements to achieve your\
    \ desired result but with a switch statement you can do all those things inside\
    \ a single block of code.\n\n#### Example:\n\n```java\nString color = \"Blue\"\
    ;\n\nswitch(color) {\n    case \"Red\" :\n        System.out.println(\"Red\");\n\
    \        break;\n    case \"Violet\" :\n    case \"Blue\" :\n        System.out.println(\"\
    Blue\");\n        break;\n    case \"Green\" :\n        System.out.println(\"\
    Green\");\n    case \"Orange\" :\n        System.out.println(\"Orange\");\n  \
    \      break;\n    default :\n        System.out.println(\"White\");\n}\nSystem.out.println(\"\
    The Color you choose is \" + color);\n```\n\n**Output:**\n\nBlue\nThe Color you\
    \ choose is Blue\n\nSee the above mentioned switch statement. I have stored the\
    \ `Blue` color in the `color` variable. When I execute this code. It goes to each\
    \ `case` statement and compares it with the value I have stored in the `color`\
    \ variable. When it finds the match it runs the code inside that `case` and exits\
    \ the statement.\n\n# Chapter 10: Numbers\n\nNormally in java when we have to\
