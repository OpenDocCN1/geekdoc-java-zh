    # Chapter 8: Loops


    In real life, loop is something that goes over and over. Loops work almost the
    same in java. In java you have a condition and based on that condition you can
    run a loop. There are three kinds of loops in java:


    *   While loop


    *   Do-while loop


    *   For loop


    #### While Loop:


    When a while loop executes, it keeps on iterating and running the same block of
    code over and over until the condition defined with the loop is true. When the
    condition becomes false the loop breaks.


    ###### Example:


    int  i = 0;


    while(i < 10) {


    System.out.println("Programming is Fun " + i);


    i++;


    };


    Output:


    Programming is Fun 0


    Programming is Fun 1


    Programming is Fun 2


    Programming is Fun 3


    Programming is Fun 4


    Programming is Fun 5


    Programming is Fun 6


    Programming is Fun 7


    Programming is Fun 8


    Programming is Fun 9


    The above code will print the phrase Programming is fun 10 times.


    #### Do-while loop:


    A Do-while loop is similar to a while loop except that it executes at least one
    time. After its first iteration it checks whether the condition mentioned at the
    end of loop is true or not. If the condition is true it will keep on executing
    otherwise the loop will break.


    ###### Example:


    int  i = 0;


    do {


    System.out.println("Programming is Fun " + i);


    i++;


    } while (i < 10);


    Output:


    Programming is Fun 0


    Programming is Fun 1


    Programming is Fun 2


    Programming is Fun 3


    Programming is Fun 4


    Programming is Fun 5


    Programming is Fun 6


    Programming is Fun 7


    Programming is Fun 8


    Programming is Fun 9


    The above code will have the same output as to the one in the while loop case.


    #### For Loop:


    A “For loop” is another kind of loop that java supports. In for loop you define
    the condition which must be met in order for the loop to execute. If the condition
    is false the loop will break. Otherwise for loop will keep on executing. The syntax
    of for loop is following


    ###### Example:


    for (int  j = 0; j < 9; j++) {


    System.out.println("This is for loop''s iteration number "+ j);


    }


    Output:


    This is for loop''s iteration number 0


    This is for loop''s iteration number 1


    This is for loop''s iteration number 2


    This is for loop''s iteration number 3


    This is for loop''s iteration number 4


    This is for loop''s iteration number 5


    This is for loop''s iteration number 6


    This is for loop''s iteration number 7


    This is for loop''s iteration number 8


    #### Break and Continue:


    In loops the keywords break or continue can be used to perform certain operations.


    ##### Break:


    A break statement in any kind of loop will break the loop no matter if the condition
    of the loop was true or false. As soon as the loop hits the break statement it
    will stop executing.


    ###### Example:


    int  i = 0;


    do {


    if (i>5) {


    break;


    } else {


    System.out.println("Programming is Fun " + i);


    }


    i++;


    } while (i < 10);


    Output:


    Programming is Fun 0


    Programming is Fun 1'
