    \ 13: Arrays\n- Chapter 14: Date and Time\n- Chapter 15: Methods\n- Chapter 16:\
    \ Exceptions\n- Chapter 17: Inner Classes\n- Conclusion\n\n# Introduction\nJava\
    \ is a programming language used by more than 3 billion devices. Java is used\
    \ to build desktop, web and mobile applications. It was developed by Sun Computers\
    \ in 1995. Java runs on multiple platforms i.e. Windows, MAC and multiple versions\
    \ of UNIX.\n\n## Audience\nThis book is intended for absolute beginners. If you\
    \ haven’t done programming yet, then this is your book. This book will help you\
    \ in understanding the basic concepts of not only programming in general but will\
    \ also help you out in getting familiar with concepts of Java.\n\n# Chapter 1:\
    \ Environmental Setup\nIf you haven’t ever installed Java on your computer, don’t\
    \ worry I will guide you through the process of installing and running Java on\
    \ your computer. You will need to do the following steps in order to setup your\
    \ environment for Java Programing\n\n* Go to [http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
    \n![](images/00001.jpeg)\n\nChoose an installation setup according to your operating\
    \ system. X86 means that your operating system must be 32-bit. You can install\
    \ x86 or x64 versions of Java development Kit if your operating system is 64-bit.\
    \ The Java development Kit includes the libraries for development. It also has\
    \ Java runtime environment which is used in order to run java based applications.\
    \ After you download the setup, install it.\n\nNow that you have installed Java\
    \ on your system you will need to install an IDE (Integrated Development Environment).\
    \ An IDE is a tool you will use along with Java to build cool applications.\n\n\
    I will use Eclipse as an IDE. Eclipse is a very popular IDE used by millions of\
    \ java developers. There are other options available such as NETBEANS, IntelliJ\
    \ etc. I would recommend you guys to install eclipse for now in order to avoid\
    \ the hassles of installing other tools. Once you start understanding the basics\
    \ of Java and how it works you can go ahead and install and play with these other\
    \ tools too.\n\n* Go to [https://www.eclipse.org/downloads/](https://www.eclipse.org/downloads/)\n\
    \n![](images/00002.jpeg)\n\nDownload setup of Eclipse from the above mentioned\
    \ link. It has a very simple installation. After Installation of eclipse you will\
    \ see its icon on the desktop. Double Click on it to run Eclipse. It will ask\
    \ you for a workspace. A workspace is a directory on your computer where all your\
    \ java projects will be stored. Select a workspace of your choosing and click\
    \ OK. Now you’ll see the following screen.![](images/00003.jpeg)\n\nIf you see\
    \ a screen similar to the one above that means you have done everything according\
    \ to my instructions and now you and your computer are ready for programming in\
    \ java.\n\n# Chapter 2: Basic Syntax\nJava is a case sensitive language. Programs\
    \ written in java contain objects, classes, variables and methods.\n\n### Object\n\
    Consider an object as a real life entity with a behavior. For example a cat is\
    \ an object its behavior can be its ability to walk, eat, sleep etc.\n\n### Class\n\
    A class is a blueprint and based on that blue print you create multiple objects.\n\
    \n### Variables\nVariable can be attributes of a class like its name, size, and\
    \ etc. all the variables go into the class and are used once the class is instantiated.\
    \ By instantiation I mean that you will create an object of a class and then use\
    \ that object to assign values to its variables. I will explain these concepts\
    \ in details as we go along this book.\n\nSo let’s go ahead and open your eclipse\
    \ IDE, it’s time to write some code. When you open eclipse you will see a class\
    \ names `TestOne` which is created by default when you start eclipse. You can\
    \ create a new project and then do the same thing too.\n\n#### Example\n```java\n\
    public class TestOne {\n  public static void main(String []args) {\n    System.out.println(\"\
    Hello World\"); // prints Hello World\n  }\n}\n```\n\nThe code above, uses three\
    \ basic things of Java Programming i.e. class, method and variable. The class\
    \ `TestOne` contains a method. Now this method named as `main` is the origin of\
    \ your java program. This is where your java program goes when you run your program.\
    \ Inside the `main` method the `println` method prints “Hello World” to your console.\
    \ The `public` keyword is an access specifier and it allows you the developer\
    \ of the program to restrict access of a class, method or a variable. Other access\
    \ specifier are `private`, `protected`, `default`. Go ahead and hit the Run button\
    \ it will look like this![](images/00004.jpeg). After running the program you\
    \ will see a console window at the bottom of your screen showing you the output\
    \ of your first java program.\n\nAs I told you earlier that java is a case sensitive\
    \ language. So the word `VOID` and `void` will have different meanings so you\
    \ will have to be very careful when you use keywords or custom named identifiers\
    \ for classes, variables, objects and methods. A java program file has a `.java`\
    \ extension and the code written in this type of file will be known to the JRE.\
    \ If you write your java code in a file whom extension is not `.java` then the\
    \ JRE will not recognize that file or the code written inside it.\n\nJava Keywords:\n"
