    \n# 目录\n- 引言\n- 第 1 章：环境搭建\n- 第 2 章：基础语法\n- 第 3 章：对象与类\n- 第 4 章：基础数据类型\n- 第 5\
    \ 章：变量类型\n- 第 6 章：修饰符类型\n- 第 7 章：基础运算符\n- 第 8 章：循环\n- 第 9 章：决策\n- 第 10 章：数字\n\
    - 第 11 章：字符\n- 第 12 章：字符串\n- 第 13 章：数组\n- 第 14 章：日期与时间\n- 第 15 章：方法\n- 第 16 章：异常\n\
    - 第 17 章：内部类\n- 结论\n\n# 引言\nJava 是一种被超过 30 亿设备使用的编程语言。Java 用于构建桌面、Web 和移动应用程序。它由太阳公司于\
    \ 1995 年开发。Java 运行在多个平台上，即 Windows、MAC 和多个版本的 UNIX。\n\n## 目标读者\n本书专为绝对初学者设计。如果你还没有做过编程，那么这本书就是适合你的。这本书不仅将帮助你理解通义编程的基本概念，还将帮助你熟悉\
    \ Java 的概念。\n\n# 第 1 章：环境搭建\n如果你从未在电脑上安装过 Java，不要担心，我将引导你完成在电脑上安装和运行 Java 的过程。你需要执行以下步骤来配置\
    \ Java 编程环境：\n\n* 访问 [`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
    \n![](img/00001.jpeg)\n\n根据你的操作系统选择安装程序。X86 意味着你的操作系统必须是 32 位。如果你的操作系统是 64 位的，你可以安装\
    \ x86 或 x64 版本的 Java 开发包（JDK）。Java 开发包包含了开发所需的库。它还包含了运行 Java 应用程序的 Java 运行环境。下载安装程序后，对其进行安装。\n\
    \n现在你已经在系统中安装了 Java，你需要安装一个 IDE（集成开发环境）。IDE 是你配合 Java 一起构建酷应用程序的工具。\n\n我将使用 Eclipse\
    \ 作为 IDE。Eclipse 是数百万 Java 开发者使用的非常流行的 IDE。还有其他选择，如 NETBEANS、IntelliJ 等。我建议你们现在安装\
    \ Eclipse，以避免安装其他工具的麻烦。一旦你开始理解 Java 的基础及其工作原理，你也可以继续安装并尝试这些其他工具。\n\n* 访问 [`www.eclipse.org/downloads/`](https://www.eclipse.org/downloads/)\n\
    \n![](img/00002.jpeg)\n\n从上述链接下载 Eclipse 的安装程序。它的安装非常简单。安装 Eclipse 之后，你会在桌面上看到它的图标。双击它运行\
    \ Eclipse。它会要求你指定工作空间（workspace）。工作空间是你电脑上用于存储所有 Java 项目的目录。选择一个你喜欢的工作空间并点击 OK。现在你将看到以下画面![](img/00003.jpeg)\n\
    \n如果你看到一个与上面类似的屏幕，意味着你已经按照我的说明完成了所有操作，现在你和你的电脑已经准备好进行 Java 编程了。\n\n# 第 2 章：基础语法\n\
    Java 是一种区分大小写的语言。用 Java 编写的程序包含对象、类、变量和方法。\n\n### 对象\n将对象视为具有行为的现实实体。例如，猫是一个对象，它的行为可以是走路、吃东西、睡觉等能力。\n\
    \n### 类\n类是一个蓝图，根据这个蓝图你可以创建多个对象。\n\n### 变量\n变量可以是类的属性，例如它的名称、大小等。所有变量都进入类中，并在类实例化（instantiation）后被使用。实例化指的是你创建一个类的对象，然后使用该对象对其变量赋值。我将在随后的书中详细解释这些概念。\n\
    \n所以，让我们打开 Eclipse IDE，是时候编写代码了。当你打开 Eclipse 时，你会看到一个名为 `TestOne` 的类，这是在启动 Eclipse\
    \ 时默认创建。你可以创建一个新项目并进行同样的操作。\n\n#### 示例\n```java\npublic class TestOne {\n  public\
    \ static void main(String []args) {\n    System.out.println(\"Hello World\");\
    \ // 输出 Hello World\n  }\n}\n```\n\n上面的代码使用了 Java 编程中的三个基础元素：类、方法和变量。`TestOne`\
    \ 类包含一个方法。现在这个名为 `main` 的方法是 Java 程序的起点。这是当你运行程序时 Java 程序进入的地方。在 `main` 方法内部，`println`\
    \ 方法向控制台打印“Hello World”。`public` 关键字是一个访问修饰符，它允许程序开发者限制对类、方法或变量的访问。其他访问修饰符有 `private`、`protected`、`default`。点击运行按钮，它看起来像这样![](img/00004.jpeg)。运行程序后，你会在屏幕底部看到一个控制台窗口，显示你第一个\
    \ Java 程序的输出。\n\n正如我之前告诉你的，Java 是一种区分大小写的语言。所以 `VOID` 和 `void` 的含义不同，因此在你在使用关键字或为类、变量、对象和方法命名自定义标识符时，必须非常小心。Java\
    \ 程序文件具有 `.java` 扩展名，编写在该类型文件中的代码会被 JRE 识别。如果你在一个扩展名不是 `.java` 的文件中编写 Java 代码，那么\
    \ JRE 将无法识别该文件或其中编写的代码。\n\nJava 关键字：\n\n"
- fmt: "\nA java keyword is a reserved word which is used by java itself and java\
    \ doesn’t allow the programmers to use those words. The following list shows the\
    \ reserved words in Java. These reserved words may not be used as constant or\
    \ variable or any other identifier’s name, meaning you cannot name your attributes\
    \ of a class (variables), the behavior of a class (methods) with the exact words\
    \ described below.\n\n| continue | abstract | Switch | for | new |\n| default\
    \ | assert | synchronized | goto | package |\n| do | boolean | this | if | private\
    \ |\n| double | break | throw | implements | protected |\n| else | byte | throws\
    \ | import | public |\n| enum | case | transient | instanceof | return |\n| extends\
    \ | catch | try | int | short |\n| final | char | void | interface | static |\n\
    | finally | class | volatile | long | strictfp |\n| float | const | while | native\
    \ | super |\n\n### Comments\n\nThere are multiple types of comments in java. A\
    \ single line comment and a block comment. The following example shows multiple\
    \ type of comments in java.\n\n### Example\n\n```java\npublic  class TestOne {\n\
    \n /* This is my first java program.\n     * This will print 'Hello World' as\
    \ the output\n* This is an example of multi-line comments.\n     */\n\n public\
    \  static  void main(String []args) {\n\n // This is an example of single line\
    \ comment\n\n /* This is also an example of single line comment. */\n\n      System.out.println(\"\
    Hello World\"); // prints Hello World\n\n  }\n\n}\n```\n\n# Chapter 3: Objects\
    \ and Classes\n\nJava is an object oriented language which means that it will\
    \ have objects and classes. You may have got a general idea of objects and classes\
    \ by my previous discussion. Now I will explain these concepts in detail here.\n\
    \n### Objects\n\nObject is something that has some attributes and behaviors. Consider\
    \ human as a real life entity, now we will map human into our software object.\
    \ A human has a name, age etc. he walks, talks and eats etc. all of these are\
    \ its behaviors.\n\n### Class\n\nClass is a blueprint and by using these blueprints\
    \ we create objects. Following is an example of a class in java. Feel free to\
    \ tweak it if you want to.\n\n### Example\n\n```java\npublic  class Human {\n\n\
    String name;\nint age;\nString gender;\n\nvoid walks() {\n// What happens when\
    \ a person walks\n\n}\n\nvoid talks() {\n// What happens when a person talks\n\
    }\n\nvoid eats() {\n// What happens when a person eats\n\n}\n\n}\n```\n\nNow we\
    \ can use the above mentioned blueprint to create as many objects we want. A class\
    \ can have multiple types of variables.\n\n### Local Variables\n\nLocal Variables\
    \ are the variables that are declared inside of methods, constructors or blocks.\n\
    \n### Instance Variables\n\nInstance Variables are the variables that are declared\
    \ inside a class and are only allowed for use once the class is instantiated.\n\
    \n### Class Variables\n\nClass Variables are declared with a keyword `static`\
    \ and they can be used by directly via the name of a class.\n\n### Constructors\n\
    \nA constructor is a method inside a class that gets called when we create an\
    \ object of that class. Constructors are used to set values to attributes or to\
    \ make calls to a method when we create an object of a class. Following is an\
    \ example of a constructor:\n\n### Example\n\n```java\npublic  class Human {\n\
    \nString name;\nint age;\nString gender;\n\npublic Human() {\n// This is constructor\
    \ and this is where you can assign values to your variables.\n// or you can call\
    \ functions.\n}\n\nvoid walks() {\n// What happens when a person walks\n}\n\n\
    void talks() {\n// What happens when a person talks\n}\n\nvoid eats() {\n// What\
    \ happens when a person eats\n\n}\n\n}\n```\n\nNow let us talk about creating\
    \ object of our own. Create a class named `Human.java` in your IDE and write the\
    \ content of the below mentioned Human class into your new class. Now go to you\
    \ `TestOne.java` class and review the main method. This is the method we will\
    \ use to instantiate our Human class object. Write the code written in the TestOne\
    \ class below. Run the program and you will see John written on your console window.\n\
    \n### Example\n\n**Human.java**\n```java\npublic  class Human {\n\nString name;\n\
    int  age;\nString gender;\n\nvoid walks() {\n// What happens when a person walks\n\
    }\n\nvoid talks() {\n// What happens when a person talks\n}\n\nvoid eats() {\n\
    // What happens when a person eats\n\n}\n\n}\n```\n\n**TestOne.java**\n```java\n\
    import java.io.Console;\n\npublic  class TestOne {\n\npublic  static  void main(String[]\
    \ args) {\n// TODO Auto-generated method stub\nHuman human = new Human();\nhuman.name\
    \ = \"John\";\nSystem.out.println(human.name);\n\n}\n\n}\n```\n\nGo ahead and\
    \ assign values to age and gender variable and try printing them out. It will\
    \ be a good exercise for you.\n\n# Chapter 4: Basic Datatypes\n\nVariables store\
    \ values in themselves. They are just reserved memory locations inside which you\
    \ can store multiple types of values. Java has two main types of variables and\
    \ in this chapter we will cover not only those types but also their sub types.\
    \ The main variable types in Java are:\n\n*   Primitive Data Types\n*   Reference\
    \ Object/Data Types\n\n### Primitive Data Types\n\nPrimitive data types are those\
    \ types that are defined in Java. Java has also devised some rules for these types\
    \ i.e. what kind of a value they will store? What’s their range? Etc. Java has\
    \ eight primitive types. Each primitive type is explained below in detail.\n\n\
    #### byte\n\n*   `byte` is an 8-bit signed integer.\n*   Its range is from -128\
    \ to 127.\n*   It is used to save memory when the value is small.\n\n#### Example\n\
    ```java\nbyte b = 10;\n```\n\n#### short\n\n*   `short` is a 16-bit signed integer.\n\
    *   Its range is from -32,768 to 32,767.\n\n#### Example\n```java\nshort s = 100;\n\
    ```\n\n#### int\n\n*   `int` is a 32-bit signed integer.\n*   Its range is from\
    \ -2,147,483,648 to 2,147,483,647.\n*   This is the most commonly used data type.\n\
    \n#### Example\n```java\nint i = 1000;\n```\n\n#### long\n\n*   `long` is a 64-bit\
    \ signed integer.\n*   Used when the integer value exceeds the range of `int`.\n\
    *   Values are often suffixed with `L`.\n\n#### Example\n```java\nlong l = 15000000000L;\n\
    ```\n\n#### float\n\n*   `float` is a 32-bit IEEE 754 floating point.\n*   Used\
    \ for decimal numbers.\n*   Values are often suffixed with `f`.\n\n#### Example\n\
    ```java\nfloat f = 10.99f;\n```\n\n#### double\n\n*   `double` is a 64-bit IEEE\
    \ 754 floating point.\n*   The default type for decimal numbers in Java.\n\n####\
    \ Example\n```java\ndouble d = 19.99;\n```\n\n#### char\n\n*   `char` represents\
    \ a single 16-bit Unicode character.\n*   Used to store single characters.\n\n\
    #### Example\n```java\nchar c = 'A';\n```\n\n#### boolean\n\n*   `boolean` stores\
    \ only two values: `true` or `false`.\n\n#### Example\n```java\nboolean is = true;\n\
    ```\n"
