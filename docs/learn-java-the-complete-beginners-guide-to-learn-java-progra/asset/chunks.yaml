  trans: "\n\n# 第 5 章：变量类型\n\n* `double variable2ofType_double = 101.3d;` //另一个示例。\n\
    \n### boolean：\n\n* `boolean` 存储 1 位信息。\n* 它的默认值为 `false`。\n* 这种类型的变量用于存储 `true/false`\
    \ 布值。\n\n#### 示例：\n\n* `boolean variableOfType_boolean = true;` //这就是在 Java 中声明一个\
    \ 'boolean' 类型变量的方法。\n* `boolean variable2ofType_boolean = false;` //另一个示例。\n\n\
    ### char：\n\n* `char` 存储 16 位的 Unicode 字符。\n* `Char` 用于存储字符。\n* 它的最小值为 `\\u0000`。\n\
    * 它的最大值为 `\\uffff`。\n\n#### 示例：\n\n* `char variableOfType_char = 'a';` //这就是在\
    \ Java 中声明一个 'char' 类型变量的方法。\n* `char variable2ofType_char = 'c';` //另一个示例。\n\n\
    ### 引用类型：\n\n引用类型变量是类对象。你也可以将不同类型的数组视为引用类型变量的示例。这类变量的默认值为 `NULL`。请看下面的示例。\n\n\
    ```java\nimport java.sql.Date;\n\npublic class Employee {\n    String name;\n\
    \    Date DateOfBirth; //引用变量\n    int Age; //基本数据类型变量\n    String Designation;\n\
    }\n```\n\nJava 中使用变量来存储不同类型的值。每个变量都有类型和值。变量的类型告诉 Java 它将拥有的值类型以及该值的范围。它还帮助我们缩小可以应用于该变量的操作类型范围。\n\
    \n变量在使用之前必须对其进行声明。以下是声明变量的通用模板：\n\n`Datatype Variable’s name = Variable’s Value;`\n\
    \n`int Age = 24;`\n\n数据类型表示该变量将携带的数据类型，`Variable’s name` 显示其名称，然后在等号之后你根据其类型分配一个值。\n\
    \n有三种变量：\n\n* 局部变量。\n* 实例变量。\n* 类/静态变量。\n\n#### 局部变量：\n\n局部变量是在代码块内部声明并使用的变量类型。局部变量可以在方法、构造函数以及\
    \ If-else、switch 等其他代码块内部声明；这类变量在编译器进入该代码块时创建，在编译器离开该代码块时删除。由于作用范围有限，局部变量不能使用\
    \ `public/private` 等访问修饰符。\n\n###### 示例：\n\n在接下来的示例中，`Employee` 类有一个方法 `calculateAge()`，在方法中我们为\
    \ `Age` 变量赋值，并在控制台窗口将其打印出来。\n\n```java\nimport java.sql.Date;\n\npublic class\
    \ Employee {\n    public void calculateAge() {\n        int Age = 0;\n       \
    \ Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\n在主类中实例化\
    \ `employee` 类并调用函数 `calculateAge()`。\n\n```java\nimport java.io.Console;\n\n\
    public class TestOne {\n    public static void main(String[] args) {\n       \
    \ // TODO 自动生成的方法存根\n        Employee human = new Employee();\n        human.calculateAge();\n\
    \    }\n}\n```\n\n输出：\n24\n\n#### 实例变量：\n\n实例变量声明在类内部，但在任何代码块（如 if-else、方法等）之外。这些变量在创建类的对象时使用。当创建一个类的对象时，堆内存会为该对象分配空间，堆的一部分被分配给每个实例变量。实例变量的生命从对象创建时开始，到对象结束时结束。你可以设置实例变量的访问级别。实例变量的默认值取决于其数据类型。请查看上一章节关于变量数据类型及其默认值。\n\
    \n###### 示例：\n\n```java\nimport java.sql.Date;\n\npublic class Employee {\n  \
    \  String name; // 实例变量示例\n    Date DateofBirth; // 实例变量示例\n    String Designation;\
    \ // 实例变量示例\n\n    public void calculateAge() {\n        int Age = 0;\n      \
    \  Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\n#### 类/静态变量：\n\
    \n类变量或静态变量是在块或方法之外但在类内部且使用 `static` 关键字声明的变量。静态变量每个类只有一个值，该类拥有的对象数量不会影响该静态变量。静态变量存储在静态内存中。通过以下方式访问静态变量：\n\
    \n`ClassName.StaticVariableName`\n\n`Employee.Name;`\n\n###### 示例：\n\n```java\n\
    import java.sql.Date;\n\npublic class Employee {\n    String name; // 实例变量示例\n\
    \    Date DateofBirth; // 实例变量示例\n    String Designation; // 实例变量示例\n\n    private\
    \ static double salary; // 类/静态变量示例\n    private static String Department; //\
    \ 类/静态变量示例\n\n    public void calculateAge() {\n        int Age = 0;\n       \
    \ Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\n# 第 6 章：修饰符类型\n\
    \nJava 有两种修饰符：\n\n* 访问修饰符\n* 非访问修饰符\n\n#### 访问修饰符：\n\n访问修饰符是决定谁可以看到特定变量、类、方法等的修饰符类型。它有多种类型。\n\
    \n##### public：\n\n`public` 访问修饰符允许任何类、接口、方法等。\n\n###### 示例：\n\n```java\npublic\
    \ class Employee {\n    int Age = 0;\n    public void calculateAge() {\n     \
    \   Age = Age + 24;\n        System.out.println(Age);\n    }\n}\n```\n\n#####\
    \ private：\n\n当 `private` 关键字附加在变量上时，意味着只能在该类内部访问。这是最严格的限制。\n\n###### 示例：\n\n\
    ```java\npublic class Car {\n    int speed = 0;\n    private String make = \"\
    BMW\";\n    public void calculatespeed() {\n        // ...\n    }\n}\n```\n\n\
    ##### protected：\n\n`protected` 关键字用于限制变量的访问。父类的 `protected` 代码仅允许子类访问。\n\n######\
    \ 示例：\n\n```java\nclass SongPlayer {\n    protected boolean PlaySongs(Songs s)\
    \ {\n        // 实现细节\n    }\n}\n\nclass EnglishSongsPlayer extends SongPlayer\
    \ {\n    public boolean PlaySongs(Songs s) {\n        // 实现细节\n    }\n}\n```\n\
    \n#### 非访问：\n\n##### static：\n\n你可以声明 `static` 变量或 `static` 方法。使用 `static` 确保声明的变量或方法可以通过类名而不是对象来访问。\n\
    \n##### final：\n\n`final` 关键字用于限制初始化后的使用。意味着你不能初始化已经初始化且带有 `final` 关键字的变量。\n\n\
    # 第 7 章：基础运算符\n\n在 Java 中有多种类型的运算符，通过使用这些运算符可以执行数学或逻辑操作。\n\n假设有两个变量 `a` 和 `b`。`a`\
    \ 等于 `10`，`b` 等于 `20`。\n\n### 算术运算符：\n\n下表包含了 Java 中算术运算符的所有信息。\n\n| 运算符 | 描述\
    \ | 示例 |\n| :--- | :--- | :--- |\n| `+` (加法) | 用于相加 | `a + b = 30` |\n| `-` (减法)\
    \ | 用于相减 | `a - b = -10` |\n| `*` (乘法) | 用于相乘 | `a * b = 200` |\n| `/` (除法) |\
    \ 用于除法 | `b / a = 2` |\n| `%` (模) | 用于获取余数 | `b % a = 0` |\n| `++` (自增) | 值加 1\
    \ | `b++ 得到 21` |\n| `--` (递减) | 值减 1 | `b-- 得到 19` |\n\n"
- fmt: "\n## Relational operators\n\nThe following table contains all the info you\
    \ need for relational operators in java.\n\n| Operator | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| `==` (equal to) | This compares two values and\
    \ If values are equal than it returns true. | `(a == b)` is not true. |\n| `!=`\
    \ (not equal to) | This compares two values and if values are not equal then condition\
    \ becomes true. | `(a!= b)` is true. |\n| `>` (greater than) | If the value on\
    \ the left is greater than value on the right then condition becomes true. | `(a\
    \ > b)` is not true. |\n| `<` (less than) | If value on the left is less than\
    \ value on the right then condition becomes true. | `(a < b)` is true. |\n| `>=`\
    \ (greater than or equal to) | If the value on the left is greater than or equal\
    \ to the value on the right than it returns true. | `(a >= b)` is not true. |\n\
    | `<=` (less than or equal to) | If the value on the left is less than or equal\
    \ to the value on the right then condition becomes true. | `(a <= b)` is true.\
    \ |\n\n## Logical Operators\n\nThe following table contains all the info you need\
    \ for logical operators in java.\n\n| Operator | Description | Example |\n| :---\
    \ | :--- | :--- |\n| `&&` (`’AND`) | This operator is known as Logical AND operator.\
    \ If values on both sides of this operator are non-zero, then it returns true\
