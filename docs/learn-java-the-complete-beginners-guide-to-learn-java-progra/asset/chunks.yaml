  trans: "\n\n编程很有趣 2\n编程很有趣 3\n编程很有趣 4\n编程很有趣 5\n\n一旦循环遇到 `break` 语句，它将停止迭代。\n\n\
    ### Continue:\n\n当代码在循环内部遇到 `continue` 语句时，它会跳过当前迭代以及 `continue` 语句之后的代码，并跳转到下一次迭代。\n\
    \n#### 示例：\n\n```java\nint i = 0;\n\ndo {\n    if (i>=5) {\n        continue;\n\
    \    } else {\n        System.out.println(\"Programming is Fun \" + i);\n    }\n\
    \    i++;\n} while (i < 10);\n```\n\n**输出：**\n\n编程很有趣 0\n编程很有趣 1\n编程很有趣 2\n编程很有趣\
    \ 3\n编程很有趣 4\n\n# 第 9 章：决策\n\n在 java 中，决策指的是只有在在其前面提到的条件为真时才会执行代码块。java 中有多种类型的决策代码块。\n\
    \n* If 语句\n* If-else 语句\n* Switch 语句\n\n### If 语句：\n\n“If 语句”是一个代码块，它包含一个或多个条件以及在满足条件时执行的代码行。\n\
    \n#### 示例：\n\n```java\nif (true) {\n    System.out.println(\"This is an if statement\
    \ example\");\n}\n```\n\n**输出：**\n\nThis is an if statement example\n\n### If-Else\
    \ 语句：\n\n“If-Else 语句”是一个代码块，它包含一个或多个条件以及在满足条件时执行的代码行。如果条件不满足，则执行该语句的 `else` 块。\n\
    \n#### 示例：\n\n```java\nif (false) {\n    System.out.println(\"This is an if-else\
    \ statement example\");\n}\nelse {\n    System.out.println(\"Else block's output\"\
    );\n}\n```\n\n**输出：**\n\nElse block's output\n\n上述 `if` 语句内部条件为假，因此编译器将跳转到 `else`\
    \ 块以打印上述输出。\n\n### Switch 语句：\n\nswitch 非常像 If 语句，它的工作方式和 if 语句一样。但如果你有很多条件，并且想对每个条件执行不同的操作，你将需要编写多个\
    \ if 语句来实现所需的结果，但使用 switch 语句，你可以在单个代码块内完成所有工作。\n\n#### 示例：\n\n```java\nString\
    \ color = \"Blue\";\n\nswitch(color) {\n    case \"Red\" :\n        System.out.println(\"\
    Red\");\n        break;\n    case \"Violet\" :\n    case \"Blue\" :\n        System.out.println(\"\
    Blue\");\n        break;\n    case \"Green\" :\n        System.out.println(\"\
    Green\");\n    case \"Orange\" :\n        System.out.println(\"Orange\");\n  \
    \      break;\n    default :\n        System.out.println(\"White\");\n}\nSystem.out.println(\"\
    The Color you choose is \" + color);\n```\n\n**输出：**\n\nBlue\nThe Color you choose\
    \ is Blue\n\n查看上述 switch 语句。我将 `Blue` 颜色存储在 `color` 变量中。当我执行这段代码时，它会进入每个 `case`\
    \ 语句并与我在 `color` 变量中存储的值进行比较。当找到匹配项时，它运行该 `case` 内部的代码并退出语句。\n\n# 第 10 章：数字\n\n\
    通常在 java 中，当我们必须处理数字时，我们使用 `integer`、`float`、`decimal` 等，但你必须知道所有这些基本类型都源于一个抽象的数字类。当我们创建基本类型的变量时，背后发生的真实情况是基本类型被\
    \ `Numbers` 类封装，从而创建了一个对象。这种从基本类型创建对象的过程被称为 `装箱` (boxing)。当我们将对象转换为基本类型时（这通常是编译器向我们显示数值时所的操作），被称为\
    \ `拆箱` (un-boxing)。\n\n### 数字方法：\n\n`Number` 类有很多许多为你编写的内置函数。因此你只需要调用这些方法并使用它们，而不是自己编写这些。\n\
    \n#### [xxxValue()](https://www.tutorialspoint.com/java/number_xxxvalue.htm)\n\
    \n此方法将 `Number` 对象的值转换为所需的数据类型并返回结果。\n\n#### [compareTo()](https://www.tutorialspoint.com/java/number_compareto.htm)\n\
    \n此方法将 `Number` 对象与参数进行比较。\n\n#### [equals()](https://www.tutorialspoint.com/java/number_equals.htm)\n\
    \n此方法检查数字对象是否等于参数。\n\n#### [valueOf()](https://www.tutorialspoint.com/java/number_valueof.htm)\n\
    \n此方法返回一个在基本变量中指定值的整数类型对象。\n\n#### [toString()](https://www.tutorialspoint.com/java/number_tostring.htm)\n\
    \n此方法将值转换为字符串。\n\n#### [parseInt()](https://www.tutorialspoint.com/java/number_parseint.htm)\n\
    \n此方法用于将字符串转换为 `int`。\n\n#### [abs()](https://www.tutorialspoint.com/java/number_abs.htm)\n\
    \n此方法返回绝对值。\n\n#### [ceil()](https://www.tutorialspoint.com/java/number_ceil.htm)\n\
    \n此方法返回一个大于或等于参数的 double。\n\n#### [floor()](https://www.tutorialspoint.com/java/number_floor.htm)\n\
    \n此方法返回一个小于或等于参数的 double。\n\n#### [rint()](https://www.tutorialspoint.com/java/number_rint.htm)\n\
    \n此方法返回一个更接近参数的 double。\n\n#### [round()](https://www.tutorialspoint.com/java/number_round.htm)\n\
    \n此方法返回一个 long 或 `int` 值。\n\n#### [min()](https://www.tutorialspoint.com/java/number_min.htm)\n\
    \n此方法返回多个值中的较小值。\n\n#### [max()](https://www.tutorialspoint.com/java/number_max.htm)\n\
    \n此方法返回多个值中的最大值。\n\n#### [exp()](https://www.tutorialspoint.com/java/number_exp.htm)\n\
    \n此方法返回 `e` 的底。\n\n#### [log()](https://www.tutorialspoint.com/java/number_log.htm)\n\
    \n此方法对参数执行对数运算。\n\n#### [pow()](https://www.tutorialspoint.com/java/number_pow.htm)\n\
    \n此方法返回第一个参数的第二个参数的幂。\n\n#### [sqrt()](https://www.tutorialspoint.com/java/number_sqrt.htm)\n\
    \n此方法对参数执行平方根运算。\n\n#### [sin()](https://www.tutorialspoint.com/java/number_sin.htm)\n\
    \n此方法返回正弦值。\n\n#### [cos()](https://www.tutorialspoint.com/java/number_cos.htm)\n\
    \n此方法返回余弦值。\n\n#### [tan()](https://www.tutorialspoint.com/java/number_tan.htm)\n\
    \n此方法返回正切值。\n\n#### [asin()](https://www.tutorialspoint.com/java/number_asin.htm)\n\
    \n此方法返回反正正弦。\n\n#### [acos()](https://www.tutorialspoint.com/java/number_acos.htm)\n\
    \n此方法返回反余弦。\n\n#### [atan()](https://www.tutorialspoint.com/java/number_atan.htm)\n\
    \n此方法返回反正正切。\n\n#### [toDegrees()](https://www.tutorialspoint.com/java/number_todegrees.htm)\n\
    \n你可以通过此方法将参数转换为角度。\n\n#### [toRadians()](https://www.tutorialspoint.com/java/number_toradians.htm)\n\
    \n你可以通过此方法将参数转换为弧度。\n\n#### [random()](https://www.tutorialspoint.com/java/number_random.htm)\n\
    \n此辅助方法生成一个随机数。你可以提供一个范围来限制结果。\n\n# 第 11 章：字符\n\n就像数字一样，在 Java 中，你可以通过其包装类 `Character`\
