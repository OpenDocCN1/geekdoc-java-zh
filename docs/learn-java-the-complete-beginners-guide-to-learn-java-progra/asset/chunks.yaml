  trans: "\n\n### [isDigit()](https://www.tutorialspoint.com/java/character_isdigit.htm)\n\
    该方法检查所指定的 char 值是否为数字。\n\n### [isWhitespace()](https://www.tutorialspoint.com/java/character_iswhitespace.htm)\n\
    该方法检查所指定的 char 值是否为空白字符。\n\n### [isUpperCase()](https://www.tutorialspoint.com/java/character_isuppercase.htm)\n\
    该方法检查所指定的 char 值是否为大写。\n\n### [isLowerCase()](https://www.tutorialspoint.com/java/character_islowercase.htm)\n\
    该方法检查所指定的 char 值是否为小写。\n\n### [toUpperCase()](https://www.tutorialspoint.com/java/character_touppercase.htm)\n\
    该方法将所指定的 char 值转换为大写。\n\n### [toLowerCase()](https://www.tutorialspoint.com/java/character_tolowercase.htm)\n\
    该方法将所指定的 char 值转换为小写。\n\n### [toString()](https://www.tutorialspoint.com/java/character_tostring.htm)\n\
    该方法返回一个包含作为参数传递的字符值的字符串对象。\n\n# 第 12 章：字符串\n\n字符串在 Java 中被广泛使用。在 Java 中，字符串被视为对象。Java\
    \ 拥有内置的字符串类，该类包含许多辅助方法。\n\n以下是在 Java 中定义字符串的方法。\n\n```\nString name = \"John\"\
    ;\n```\n\n当编译器遇到上述那行代码时，它会创建一个类型为 string 的对象，其值为 John。\n\n#### 示例：\n\n```java\n\
    String name = \"John\";\nSystem.out.println(\"Hello guys my name is \"+ name);\n\
    ```\n\n 输出：\nHello guys my name is John\n\n在上面的示例中，我创建了一个字符串对象 `name` 并给它赋 le\
    \ 了一个值。第二行代码接收一个字符串参数并将其打印在控制台窗口上。字符串 `Hello guys my name is ` 和变量 `name` 的值都是字符串。我在上面使用的加号（`+`）用于连接这两个字符串。连接字符串的过程被称为拼接（concatenation）。这是另一个示例。\n\
    \n#### 示例：\n\n```java\nString greet1 = \"Hello\";\nString greet2 = \"World\";\n\
    System.out.println(greet1 + \" \" + greet2);\n```\n\n 输出：\nHello World\n\n在上面的示例中，我连接了两个名为\
    \ `greet1` 和 `greet2` 的字符串变量。我还在它们之间拼接了一个空格以提高可读性。\n\n你还可以在 Java 中格式化字符串。这意味着你可以使用占位符作为值，并可以直接将值传递给打印语句。看下面的示例。\n\
    \n#### 示例：\n\n```java\nint number1 = 1;\nfloat number2 = 2.0f;\nSystem.out.printf(\"\
    The value of number1 is %d and the value of number2 is %f\", number1, number2);\n\
    ```\n\n 输出：\nThe value of number1 is 1 and the value of number2 is 2.000000\n\n\
    在上面的示例中，我将两个变量 `number1` 和 `number2` 传递给 `printf` 语句。`%d` 是整数的占位符，`%f` 是浮点数值的占位符。\n\
    \n#### 字符串方法：\n\n字符串类有多个预定义的辅助方法。\n\n### [char charAt(int index)](https://www.tutorialspoint.com/java/java_string_charat.htm)\n\
    该方法返回字符串中特定索引处的字符。\n\n### [int compareTo(Object o)](https://www.tutorialspoint.com/java/java_string_compareto.htm)\n\
    该方法比较两个字符串对象。\n\n### [String concat(String str)](https://www.tutorialspoint.com/java/java_string_concat.htm)\n\
    该方法将指定的字符串拼接到另一个字符串的末尾。\n\n### [boolean contentEquals(StringBuffer sb)](https://www.tutorialspoint.com/java/java_string_contentequals.htm)\n\
    如果字符串中的字符序列与 StringBuffer 序列相同，则返回 true。\n\n### [boolean endsWith(String suffix)](https://www.tutorialspoint.com/java/java_string_endswith.htm)\n\
    该方法检查字符串是否以指定的后缀结尾。\n\n### [boolean equals(Object anObject)](https://www.tutorialspoint.com/java/java_string_equals.htm)\n\
    该方法接收两个字符串对象，如果它们匹配则返回 true。\n\n### [boolean equalsIgnoreCase(String anotherString)](https://www.tutorialspoint.com/java/java_string_equalsignorecase.htm)\n\
    该方法比较两个字符串，但不考虑大小写。\n\n### [byte getBytes()](https://www.tutorialspoint.com/java/java_string_getbytes.htm)\n\
    该方法将字符串转换为字节数组。\n\n### [void getChars(int srcBegin, int srcEnd, char[] dst, int\
    \ dstBegin)](https://www.tutorialspoint.com/java/java_string_getchars.htm)\n该方法将字符串拷贝到字符数组。\n\
    \n### [int hashCode()](https://www.tutorialspoint.com/java/java_string_hashcode.htm)\n\
    该方法为给定字符串生成哈希码。\n\n### [int indexOf(String str)](https://www.tutorialspoint.com/java/java_string_indexof_str.htm)\n\
    该方法返回指定字符串开始的索引。\n\n### [int lastIndexOf(int ch)](https://www.tutorialspoint.com/java/java_string_lastindex.htm)\n\
    该方法返回指定字符最后出现的索引。\n\n### [int lastIndexOf(String str, int fromIndex)](https://www.tutorialspoint.com/java/java_string_lastindex_fromindex.htm)\n\
    该方法返回指定字符串从指定索引开始最后出现的索引。\n\n### [int length()](https://www.tutorialspoint.com/java/java_string_length.htm)\n\
    该方法返回字符串的长度。\n\n### [boolean matches(String regex)](https://www.tutorialspoint.com/java/java_string_matches.htm)\n\
    如果字符串匹配正则表达式则返回 true。\n\n### [String replace(char oldChar, char newChar)](https://www.tutorialspoint.com/java/java_string_replace.htm)\n\
    该方法将字符串中的现有字符替换为新字符。\n\n### [String[] split(String regex)](https://www.tutorialspoint.com/java/java_string_split.htm)\n\
    该方法根据正则表达式分割字符串。\n\n### [boolean startsWith(String prefix)](https://www.tutorialspoint.com/java/java_string_startswith.htm)\n\
    该方法测试字符串是否以指定的前缀开头。\n\n### [String substring(int beginIndex)](https://www.tutorialspoint.com/java/java_string_substring.htm)\n\
    该方法返回给定字符串的子字符串。\n\n### [char[] toCharArray()](https://www.tutorialspoint.com/java/java_string_toCharArrayarray.htm)\n\
    该方法将字符串转换为字符数组。\n\n### [String toLowerCase()](https://www.tutorialspoint.com/java/java_string_tolowercase.htm)\n\
    该方法将字符串转换为小写。\n\n### [String toUpperCase()](https://www.tutorialspoint.com/java/java_string_touppercase.htm)\n\
    该方法将字符串转换为大写。\n\n# 第 13 章：数组\n\n数组是一种数据结构。Java 使用这种数据结构。数组基本上是固定大小的顺序数据结构。数组用于相似类型的数据集合。\n\
    \n在本章中，我们将学习如何声明数组、如何向其赋值以及如何处理数组。\n\n#### 创建数组：\n\n就像变量一样，在使用数组之前必须先声明它。你将告诉编译器数组的类型和名称。声明数组的通用语法如下：\n\
    \n```\ndatatype[] arrayname = {\"value1\",\"value2\",\"value3\"};\n```\n\n```\n\
    datatype arrayname[] = {\"value1\",\"value2\",\"value3\"};\n```\n\n你可以使用上述的任何一种方式来声明数组。\n\
    \n现在打开你的编译器并创建一个名为 `Candies` 的类。在其中添加以下代码：\n\n```java\npublic class Candies {\n\
    \    String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"};\n}\n```\n\n在上面的示例中，我了一个名为\
    \ `Candies` 的类，并在其中声明了一个类型为 `String` 的数组。然后我给数组赋了三个值。\n\n你也可以像这样声明上述的数组：\n\n```java\n\
    public class Candies {\n    String candies[] = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"\
    };\n}\n```\n\n"
- fmt: "\nThe type of value stored in an array depends on the type of that array for\
    \ example in the following example I have declared an array of interger type.\
    \ This array will only contains integer type data and nothing else.\n\n```java\n\
    public class Candies {\n    int[] myIntArray = {1,2,3};\n}\n```\n\n### Using Arrays:\n\
    \nNow that we have seen how to declare different types of arrays and how to assign\
    \ values to them let us go ahead and see how to process these array data structures.\
    \ We can use the loops we read earlier in this book to traverse each index of\
    \ an array and read , print or do anything else with the values inside of an array.\
    \ For processing the array mostly we use `for` loop but you can do the same thing\
    \ with other types of loops which we talked about.\n\n### Example:\n\n```java\n\
    // Your Candies Class\npublic class Candies {\n    String[] candies = {\"m&Ms\"\
    ,\"Yummybears\",\"Mayfairs\"};\n    int[] myIntArray = {1,2,3};\n\n    public\
    \ void ShowMyCandies() {\n        for (int i = 0; i < candies.length; i++) {\n\
    \            System.out.println(\"The name of my Candy is \" + candies[i]);\n\
    \        }\n    }\n}\n\n// Main Class where you instantiate your Candies class\n\
    import java.io.Console;\npublic class MainClass {\n    public static void main(String[]\
    \ args) {\n        // TODO Auto-generated method stub\n        Candies myCandies\
    \ = new Candies();\n        myCandies.ShowMyCandies();\n    }\n}\n```\n\nOutput:\n\
    The name of my Candy is m&Ms\nThe name of my Candy is Yummybears\nThe name of\
    \ my Candy is Mayfairs\n\n### Example #2:\n\n```java\n// Your Candies Class\n\
    public class Candies {\n    String[] candies = {\"m&Ms\",\"Yummybears\",\"Mayfairs\"\
    };\n    int[] myIntArray = {1,2,3};\n\n    public void ShowMyCandies() {\n   \
    \     for (int i = 0; i < candies.length; i++) {\n            System.out.println(\"\
    The name of my Candy is \" + candies[i]);\n        }\n    }\n\n    public void\
    \ ShowMyNumbers() {\n        for (int i = 0; i < myIntArray.length; i++) {\n \
    \           System.out.println(\"My Number Array Contains \" + myIntArray[i]);\n\
    \        }\n    }\n}\n\n// Main Class where you instantiate your Candies class\n\
    import java.io.Console;\npublic class MainClass {\n    public static void main(String[]\
    \ args) {\n        // TODO Auto-generated method stub\n        Candies myCandies\
    \ = new Candies();\n        //myCandies.ShowMyCandies();\n        myCandies.ShowMyNumbers();\n\
    \    }\n}\n```\n\nOutput:\nMy Number Array Contains 1\nMy Number Array Contains\
    \ 2\nMy Number Array Contains 3\n\n### Helper Methods:\n\nThe `Arrays` also have\
    \ some helper methods that are built in java to make our life easier.\n\n####\
    \ `public static int binarySearch(Object[] a, Object key)`\n\nThis method searches\
    \ the array passed to it for a value using the Binary search algorithm. If this\
    \ method finds the specific value it was looking for it returns the index where\
    \ it is located inside the array.\n\n#### `public static boolean equals(long[]\
    \ a, long[] a2)`\n\nThis method tells us whether the two arrays passed to it are\
    \ equal. Arrays are only equal if their type is same, they have same number of\
    \ elements and the elements are same in each array. This method can be used for\
    \ any other primitive type of arrays.\n\n#### `public static void fill(int[] a,\
    \ int val)`\n\nThis method sets the value of each index of an array to the value\
    \ passed to this method along with the array to be effected. This method can be\
    \ used for any other primitive type of array too.\n\n#### `public static void\
    \ sort(Object[] a)`\n\nThis method sorts an array of any primitive type into ascending\
    \ order.\n\n# Chapter 14: Date and Time\n\nIn the `java.util` package there exists\
    \ a `Date` class along with other classes written with built in features. You\
    \ can use `date` class for the date related operation like getting the current\
    \ date, Performing different functions on that date string etc.\n\nIn this chapter\
    \ we will talk about dates and the operations you can perform on dates by using\
    \ `java`. Open up your compiler and create a class named `mydateclass`.\n\n```java\n\
    public class myDateClass {\n}\n```\n\n### Current Date and Time:\n\nNow let us\
    \ use the class we created to get our current date and time. Go ahead and add\
    \ the following method to the class.\n\n```java\npublic void getDateTime() {\n\
    \    Date date = new Date();\n    System.out.println(\"My Current Date and time\
    \ is: \" + date.toString());\n}\n```\n\nThe Final code of `myDateClass` will look\
    \ like the following.\n\n```java\nimport java.util.Date;\npublic class myDateClass\
    \ {\n    public void getDateTime() {\n        Date date = new Date();\n      \
    \  System.out.println(\"My Current Date and time is: \" + date.toString());\n\
    \    }\n}\n```\n\nAfter completing the new `myDateClass` go to the main class\
    \ and create an object of your `myDateClass` and call the `getDateTime()` method.\n\
    \n```java\nimport java.io.Console;\npublic class MainClass {\n    public static\
    \ void main(String[] args) {\n        // TODO Auto-generated method stub\n   \
    \     myDateClass mydate = new myDateClass();\n        mydate.getDateTime();\n\
    \    }\n}\n```\n\nWhen you run the above code you will get your current date.\
    \ The output of this program will be shown in the console window and will look\
    \ like the following.\n\nOutput:\nMy Current Date and time is: Sat Dec 24 16:58:13\
    \ PKT 2016\n\n### Formatting Dates:\n\nYou can format your dates using the built\
    \ in date formatting mechanisms.\n\n### Example:\n\n```java\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\npublic class myDateClass {\n    public void getDateTime()\
    \ {\n        Date date = new Date();\n        SimpleDateFormat newFormat = new\
    \ SimpleDateFormat (\"E yyyy-MM-dd 'at' hh:mm:ss a zzz\");\n        System.out.println(\"\
    Current Date is: \" + newFormat.format(date));\n    }\n}\n\nimport java.io.Console;\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   // TODO Auto-generated method stub\n        myDateClass mydate = new myDateClass();\n\
    \        mydate.getDateTime();\n    }\n}\n```\n\nOutput:\nCurrent Date is: Sat\
    \ 2016-12-24 at 05:18:02 PM PKT\n\nYou can also format the date using the `printf`\
    \ statement in java.\n\n### Example:\n\n```java\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\npublic class myDateClass {\n    public void getDateTime()\
    \ {\n        Date date = new Date();\n        String mystring = String.format(\"\
    Current Date and Time is : %tc\",date);\n        System.out.printf(mystring);\n\
    \    }\n}\n\nimport java.io.Console;\npublic class MainClass {\n    public static\
    \ void main(String[] args) {\n        // TODO Auto-generated method stub\n   \
    \     myDateClass mydate = new myDateClass();\n        mydate.getDateTime();\n\
    \    }\n}\n```\n\nOutput:\nCurrent Date and Time is : Sat Dec 24 17:24:26 PKT\
    \ 2016\n"
