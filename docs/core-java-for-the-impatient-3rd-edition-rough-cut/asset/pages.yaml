    # 3.4.1. The Syntax of Lambda Expressions


    Consider again the sorting example from Section 3.3.2. We pass code that checks
    whether one string is shorter than another. We compute


    ```

    first.length() - second.length()

    ```


    What are first and second? They are both strings. Java is a strongly typed language,
    and we must specify that as well:


    ```

    (String first, String second) -> first.length() - second.length()

    ```


    You have seen your first lambda expression. Such an expression is simply a block
    of code, together with the specification of any variables that must be passed
    to the code.


    Why the name? Many years ago, before there were computers, the logician Alonzo
    Church wanted to formalize what it means for a mathematical function to be effectively
    computable. (Curiously, there are functions that are known to be effectively,
    but nobody knows how to compute their values.) He used the Greek letter lambda
    (λ) to mark parameters, somewhat like


    ```

    λfirst.λsecond. - second.length()

    ```


    # Note


    Why the letter λ? Did Church run out of letters of the alphabet? Actually, the
    venerable Principia Mathematica (see http://plato.stanford.edu/entries/principia-mathematica)
    used the ^ accent to denote function parameters, which inspired Church to use
    an uppercase lambda Λ But in the end, he switched to the lowercase version. Ever
    since, an expression with parameter variables has been called a lambda expression.'
