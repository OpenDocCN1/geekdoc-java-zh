  md: '# 14. Compiling and Scripting


    In this short chapter, you will learn how to use the compiler API to compile Java
    code from inside of your application. You will also see how to run programs written
    in other languages from your Java programs, using the scripting API. This is particularly
    useful if you want to give your users the ability to enhance your program with
    scripts.


    The key points of this chapter are:


    +   1. With the compiler API, you can access the Java compiler in your programs.

    2. You can generate Java code “on the fly” by reading source from memory and writing
    classes to memory.

    3. The scripting API lets Java program interoperate with a number of scripting
    languages.

    4. In your Java code, you can access variables that are read and written by the
    scripting code.

    5. With some scripting engines, you can call script functions from Java.


