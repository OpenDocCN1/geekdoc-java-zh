  md: 'Unfortunately, you cannot easily use the Files.walk method to delete a tree
    of directories since you need to first visit the children before deleting the
    parent. In that case, use the walkFileTree method. It requires an instance of
    the FileVisitor interface. Here is when the file visitor gets notified:


    +   1. Before a directory is processed:


    ```

    FileVisitResult preVisitDirectory(T dir,

    IOException ex)

    ```


    +   2. When a file is encountered:


    ```

    FileVisitResult visitFile(T path,

    BasicFileAttributes attrs)

    ```


    +   3. When an exception occurs in the visitFile method:


    ```

    FileVisitResult visitFileFailed(T path,

    IOException ex)

    ```


    +   4. After a directory is processed:


    ```

    FileVisitResult postVisitDirectory(T dir,

    IOException ex)

    ```


    In each case, the notification method returns one of the following results:


    +   ■ Continue visiting the next file: FileVisitResult.CONTINUE

    ■ Continue the walk, without visiting the entries in this directory: FileVisitResult.SKIP_SUBTREE

    ■ Continue the walk, but without visiting the siblings of this file: FileVisitResult.SKIP_SIBLINGS

    ■ Terminate the walk: FileVisitResult.TERMINATE


    If any of the methods throws an exception, the walk is also terminated, and that
    exception is thrown from the walkTree method.


    The SimpleFileVisitor class class implements this interface, continuing the iteration
    at each point and rethrowing any exceptions.


    Here is how you can delete a directory tree:'
