    all mutators make a copy of the underlying array. This arrangement is useful if
    the threads that iterate over the collection contains a reference to the current
    array. When you construct an iterator, if the array is mutated the iterator still
    has the old array, but the collection’s array is replaced. As a consequence, the
    older iterator has a consistent (but potentially outdated) view that it can access
    without any synchronization expense.'
