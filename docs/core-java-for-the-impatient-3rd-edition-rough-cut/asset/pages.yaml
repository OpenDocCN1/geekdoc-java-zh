  md: 'The WeakHashMap class was designed to solve an interesting problem. What happens
    with a value whose key is no longer used anywhere in your program? If the last
    reference to a key has gone away, there is no longer any way to refer to the value
    object so it should be removed by the garbage collector.


    It isn''t quite so simple. The garbage collector traces live objects. As long
    as the map object is live, all entries in it are live and won''t be reclaimed—and
    be the values that are referenced by the entries.


    This is the problem that the WeakHashMap class solves. This data structure cooperates
    with the garbage collector to remove key/value pairs when the only reference to
    the key is the one from the hash table entry.


    Technically, the WeakHashMap uses weak references to hold keys. The WeakReference
    object holds a reference to another object—in our case, a hash table. Objects
    of this type are treated in a special way by the garbage collector. If an object
    is reachable only by a weak reference, the garbage collector reclaims the object
    and places the weak reference into a queue associated with the WeakReference object.
    Whenever a method is invoked on it, the WeakHashMap checks its queue of weak references
    for new arrivals and removes the associated entries.


