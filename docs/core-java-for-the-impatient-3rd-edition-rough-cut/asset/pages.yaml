    were common in use. But seven decimal digits don’t go very far, and nowadays,
    “double precision” numbers are the default. It only makes sense to use *float*
    when you need to store a large number of them.


    Numbers of type *float* has a suffix F (for example, 3.14F). Floating-point literals
    without an F suffix (such as 3.14) have type *double*. You can optionally supply
    the D suffix (for example, 3.14D).


    # Note


