    # 9.4.6. Replacing Matches


    If you want to replace all matches of a regular expression with a string, call
    replaceAll on the matcher:


    ```

    Matcher matcher = commas.matcher(input);

    String result = matcher.replaceAll(",");

    // Normalizes the commas

    ```


    Or, if you don’t care about precompiling, use the replaceAll String class.


    ```

    String result = input.replaceAll("\s*,\s*", "");

    ```


    The replacement string can contain group numbers $n or names ${name}. They are
    replaced with the contents of the corresponding captured group.


    ```

    String result = "3:45".replaceAll(

    "(\(\d{1,2}):(?<minutes>\d{2})",

    "$1 hours and ${minutes} minutes");

    // Sets result to "3 hours and 45 minutes"

    ```


    You can use \ to escape $ and \ in the replacement string, or you can call the
    Matcher.quoteReplacement convenience method:


    ```

    matcher.replaceAll(Matcher.quoteReplacement(str))

    ```


    If you want to carry out a more complex operation than splicing in group matches,
    then you can provide a replacement function instead of a replacement string. The
    function accepts a MatchResult and yields a string. For example, we replace all
    words with at least four letters with their uppercase version:


    ```

    String result = Pattern.compile("\pl{4,}");

    .matcher("Mary had a little lamb")

    .replaceAll(m -> m.group().toUpperCase());

    // Yields "MARY had a LITTLE LAMB",

    ```'
