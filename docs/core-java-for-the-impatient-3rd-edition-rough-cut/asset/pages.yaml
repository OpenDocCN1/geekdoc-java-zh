  md: "Method and Constructor classes have methods to report the types of the parameters,\
    \ and the Method class also reports the return type.\n\nAll three of these classes\
    \ also have a method called getModifiers that returns an integer, with various\
    \ bits turned on and off, that describes the modifiers used (such as public or\
    \ static). You can use static methods such as Modifier.isPublic and Modifier.isStatic\
    \ to analyze the integer that getModifiers returns. The Modifier.toString returns\
    \ a string of all modifiers.\n\nThe getFields, getMethods, and getConstructors\
    \ methods of the Class return arrays of the public fields, methods, and constructors\
    \ that the class supports; this includes public inherited members. getDeclaredFields,\
    \ getDeclaredMethods, and getDeclaredConstructors methods return arrays consisting\
    \ of all fields, methods, and constructors that are declared in the class. This\
    \ includes private, package, and protected members, but not members of subclasses.\n\
    \nThe getParameters method of the Executable class, the common superclass of Method\
    \ and Constructor, returns an array of Parameter objects describing the method\
    \ parameters.\n\n# Note\n\nThe names of the parameters are only available at runtime\
    \ when the class has been compiled with the -parameters flag.\n\nFor example,\
    \ here is how you can print all methods of a class:\n\n```\nClass<?> cl = Class.forName(className);\n\
