    # 1.1.2. Compiling and Running a Java Program


    To compile and run this program, you need to install the Java Development Kit
    (JDK) and, optionally, an integrated development environment (IDE). You should
    also download the sample code, which you will find at the companion website for
    this book, http://horstmann.com/javaimpatient. Since instructions for installing
    software don''t make it for interesting reading, I put them on the companion website
    as well.


    Once you have installed the JDK, open a terminal window, change to the directory
    containing the ch01 directory, and run the commands


    ```

    javac ch01.sec01/HelloWorld.java

    java ch01.sec01.HelloWorld

    ```


    The familiar greeting will appear in the terminal window (see Figure 1.1).


    Note that two steps were involved to execute the program. The java command compiles
    the Java source code into an intermediate machine-independent representation,
    called byte codes, and saves them in class files. The java command launches a
    virtual machine that loads the class files and executes the bytes codes.


    Once compiled, byte codes can run on any Java virtual machine, whether on your
    desktop computer or on a device in a galaxy far, far away. The promise of “write
    once, run anywhere” was an important design criterion for Java.'
