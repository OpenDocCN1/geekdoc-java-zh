    # 12.7. Interoperating with Legacy Code


    The Java Date and Time API must operate with existing classes, in particular,
    the ubiquitous java.util.Date, java.util.GregorianCalendar, and java.sql.Date/Time/Timestamp.


    The Instant class is a close analog to java.util.Date. That class has a toInstant
