    elements and rearrangements if they are out of order. Of course, the rules for
    doing the comparison are different for each class, and the sorting algorithm should
    just call a method supplied by the class. As long as all classes agree on what
    that method is called, the sorting algorithm can do its job. That is where interfaces
    come in.'
