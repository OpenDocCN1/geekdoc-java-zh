  md: '# 3. Interfaces and Lambda Expressions


    Java was designed as an object-oriented programming language in the 1990s when
    object-oriented programming was the principal paradigm for software development.
    Interfaces are a key feature of object-oriented programming: They let you specify
    what should be done, without having to provide an implementation.


    Long before there was object-oriented programming, there were functional programming
    languages, such as Lisp, in which functions and not objects are the primary structuring
    mechanism. Recently, functional programming has risen in importance because it
    is well suited for concurrent and event-driven (or “reactive”) programming. Java
    supports function expressions that provide a convenient bridge between object-oriented
    and functional programming. In this chapter, you will learn about interfaces and
    lambda expressions.


    The key points of this chapter are:


    +   1. An interface specifies a set of methods that an implementing class must
    provide.

    2. An interface is a supertype of any class that it implements. Therefore, one
    can assign instances of the class to variables of the interface type.

    3. An interface can contain static methods. All variables of an interface are
    automatically public, static, and final.

    4. An interface can contain default methods that an implementing class can inherit
    or override.

    5. An interface can contain private methods that cannot be called or overridden
    by implementing classes.

    6. The Comparable and Comparator interfaces are used for comparing objects.'
