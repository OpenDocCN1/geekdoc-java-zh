    # 15.1. The Module Concept


    In object-oriented programming, the fundamental building block is the class. Classes
    provide encapsulation. Private features can only be accessed by code that has
    explicit permission, the methods of the class. This makes it possible to reason
    about access. If a private variable has changed, you can produce a set of all
    possible culprits. If you need to modify the representation, you know which methods
    are affected.


    In Java, packages provide the larger organizational grouping. A package is a collection
    of classes. Packages also provide a level of encapsulation. Any feature with package
    access (neither public nor private) is accessible only from methods in the same
    package.


    However, in large systems, this level of access control is not enough. Any public
    feature (that is accessible) is accessible everywhere. Suppose you want to modify
    or drop a rarely used feature. Once it is public, there is no way to reason about
    the impact of that change.


    This is the situation that the Java platform designers faced. Over twenty years,
    the JDK grows by leaps and bounds, but clearly some features are essentially obsolete.
    Everyone''s favorite example is CORBA. When is the last time you used it? The
    org.misc.corba package is shipped with every JDK. As it happens, it would not
    be too difficult to put all of CORBA into a JAR file so that it can be used by
    few who still need it.


    What about java.awt? It shouldn''t be required in a server-side application, right?
    Except that the class java.awt.DataFlavor is used in the implementation of SOAP,
    an XML-based web services protocol.'
