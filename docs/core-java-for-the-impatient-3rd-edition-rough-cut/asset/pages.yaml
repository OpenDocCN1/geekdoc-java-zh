  md: '# ### 5.3.4. Logging Configuration


    Let us now turn to the logging backend. As already mentioned, the default backend
    of the platform logging API is java.util.logging. The information in the following
    sections is specific to that backend.


    You can change various properties of the backend by editing a configuration file.
    The default configuration file is located at conf/logging.properties in the JDK.
    To use another file, set the java.util.logging.config.file property to the file
    location by starting your application with


    ```

    java -Djava.util.logging.config.file=configFile MainClass

    ```


    > Caution

    Calling System.setProperty("java.util.logging.config.file", configFile) in main
    has no effect because the log manager initialized during VM startup, before main
    executes.


    To change the default logging level, edit the configuration file and modify the
    line


    ```

    .level=INFO

    ```


    You can specify the logging levels for your own loggers by adding lines such as


    ```

    com.mycompany.myapp.level=WARNING

    ```


    That is, append the .level suffix to the logger name.


    # ### Caution


    For historical reasons, some of the levels have different names in the platform
    logging API and the java.util.logging framework. Here'
