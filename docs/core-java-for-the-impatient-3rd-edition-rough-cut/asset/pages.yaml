  md: "You just saw how to extend a class. Clearly, you can extend the subclass again,\
    \ and repeat that process, to form a hierarchy of classes. In the following sections,\
    \ you will learn the constructs that the Java language provides for controlling\
    \ what can be done in such an inheritance hierarchy.\n\n# 4.2.1. Final Methods\
    \ and Classes\n\nWhen you declare a method as final, no subclass can override\
    \ it.\n\n```\npublic class Employee {\n    ...\n    public final String getName()\
    \ {\n        return name;\n    }\n}\n```\n\nA good example of a final method in\
    \ the Java API is the getClass method of the Object class that you will see in\
    \ Section 4.5.1. It does not seem wise to allow objects to lie about the class\
    \ to which they belong, so this method can never be changed.\n\nSome programmers\
    \ believe that the final keyword is good for efficiency. This may have been true\
    \ in the early days of Java, but it is no longer. Modern virtual machines will\
    \ speculatively “inline” simple methods, such as the getName method above, even\
    \ if they are not declared final. In the rare case when a subclass is loaded that\
    \ overrides such method, the inlining is undone.\n\nSome programmers believe that\
    \ most methods of a class should be declared final, and only methods specifically\
    \ designed to be overridden should not be. Others find this too draconian since\
    \ it prevents even harmless overriding, for example for logging or debugging purposes.\n\
    \nOccasionally, you may want to prevent someone from forming a subclass from one\
    \ of your classes. Use the final modifier in the class definition to indicate\
    \ this. For example, here is how to prevent others from subclassing the Executive\
    \ class:\n\n```\npublic final class Executive extends Manager {\n    ...\n}\n\
    ```"
