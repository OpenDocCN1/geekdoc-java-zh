  md: '# # 4. Inheritance and Reflection


    The preceding chapters introduced you to classes and interfaces. In this chapter,
    you will learn about another fundamental concept of object-oriented programming:
    inheritance. Inheritance is the process of creating new classes that are built
    on existing classes. When you inherit from an existing class, you reuse (or inherit)
    its methods, and you can add new methods and fields.


    # Note


    > Instance variables and static variables are collectively called *fields*. The
    fields, methods, and nested classes/interfaces inside a class are collectively
    called its *members*.


    This chapter covers reflection, the ability to find out about classes and their
    members in a running program. Reflection is a powerful feature, but it is undeniably
    complex. Since reflection is of greater interest to tool builders than to application
    programmers, you can probably glance over that part of the chapter upon first
    reading and come back to it later.


    The key points of this chapter are:


    +   1. A subclass can inherit or override methods from the superclass, provided
    they are not `private`.

    2. Use the `super` keyword to invoke a superclass method or constructor.

    3. A `final` method cannot be overridden; a `final` class cannot be extended.

    4. An `abstract` method has no implementation; an `abstract` class cannot be instantiated.

    5. A `protected` member of a superclass is accessible in a subclass method, but
    only when applied to objects of the same subclass. It is also accessible in its
    package.'
