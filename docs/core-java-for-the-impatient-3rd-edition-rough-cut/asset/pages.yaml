  md: "compile-time safety of the module system with the classic permissive runtime\
    \ behavior.\n\nRecall from Section 0.0.0 that JAR files can contain, in addition\
    \ to class files and a manifest, file resources which can be loaded with the method\
    \ Class.getResourceAsStream, and now also with Module.getResourceAsStream. If\
    \ a resource is stored in a directory that matches a package in a module, then\
    \ the package must be opened to the caller. Resources in other directories, as\
    \ well as the class files and manifest, can be read by anyone.\n\n# Note\n\nIt\
    \ is possible that future libraries will use variable handles instead of reflection\
    \ for reading and writing fields. A VarHandle is similar to a Field. You can use\
    \ it to read or write a specific field of any instance of a specific class. However,\
    \ to obtain a VarHandle, the library code needs a Lookup object:\n\n```\npublic\
    \ Object getFieldValue(Object obj, String fieldName, Lookup lookup)\n    throws\
    \ NoSuchFieldException, IllegalAccessException {\n    Class<?> cl = obj.getClass();\n\
    \    Field field = cl.getDeclaredField(fieldName);\n    VarHandle handle =\n \
    \       MethodHandles.privateLookupIn(cl, lookup)\n        .unreflectVarHandle(field);\n\
    \    return handle.get(obj);\n}\n```\n\nThis works for Lookup object is generated\
    \ in the module that has the permission to access the field. Some method in the\
    \ module simply calls MethodHandles.lookup(), which yields an object encapsulating\
    \ the access rights of the caller. In this way, one module can give permission\
    \ for accessing private members to another module. The practical issue is how\
    \ those permissions are given with a minimum of hassle."
