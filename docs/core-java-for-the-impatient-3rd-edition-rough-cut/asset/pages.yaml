  md: '# #13. Internationalization


    There’s a big world out there, and hopefully many of its inhabitants will be interested
    in your software. Some programmers believe that all they need to do internationalize
    their application is to support Unicode and translate the messages in the user
    interface. However, as you will see, there is a lot more to internationalizing
    programs. Dates, times, currencies, even numbers are formatted differently in
    different parts of the world. In this chapter, you will learn how to use the internationalization
    features of Java so that your programs present and accept information in a way
    that makes sense to users, wherever they may be.


    At the end of this chapter, you will find a brief overview of the Java Preferences
    API for storing user preferences.


    The key points of this chapter:


    +   - Translating an application for international users requires more than translating
    messages. In particular, formatting for numbers and dates varies widely across
    the world.


    +   - A locale describes language and formatting preferences for a population
    of users.


    +   - The NumberFormat and DateTimeFormat classes handle locale-aware formatting
    of numbers, currencies, dates, and times.


    +   - The MessageFormat class can format message strings with placeholders, each
    of which can have its own format.


    +   - Use the Collator class for locale-dependent sorting of strings.


    +   - The ResourceBundle class manages localized strings and objects for multiple
    locales.


    +   - The Preferences class can be used for storing user preferences in a platform-independent
    way.'
  merge: -1
  pgno: 595
- img_proc: true
  md: '# 13.1. Locales


    When you look at an application that is adapted to an international market, the
    most obvious difference is the language. But there are many more subtle differences;
    for example, numbers are formatted quite differently in English and in German.
    The number


    ```

    123,456.78

    ```


    should be displayed as


    ```

    123.456,78

    ```


    for a German user—that is, the roles of the decimal point and the decimal comma
    separator are reversed. There are similar variations in the display of dates.
    In the United States, dates are displayed as month/day/year; Germany uses the
    more sensible order of day/month/year, whereas in China, the usage is year/month/day.
    Thus, the American date


    ```

    3/22/61

    ```


    should be presented as


    ```

    22.03.1961

    ```


    to a German user. If the month names are written out explicitly, then the difference
    in languages becomes even more apparent. The English


    ```

    March 22, 1961

    ```


    should be presented as


    ```

    22. März 1961

    ```


    in German, or


    ```

    1961年3月22日

    ```


    in Chinese.


    A locale specifies the language and location of a user, which allows formatters
    to take user preferences into account. The following sections show you how'
  merge: -1
  pgno: 596
- img_proc: true
  md: 'specify locale and how to control the locale settings of a Java program.


    # 13.1.1. Specifying a Locale


    A locale consists of up to five components:


    +   1. A language, specified by two or three lowercase letters, such as en (English),
    de (German), or zh (Chinese). Table 13.1 shows codes.

    2. Optionally, a script, specified by four letters with an initial uppercase,
    such as Lat (Latin), Cyr (Cyrillic), or Hant (traditional Chinese characters).
    can be useful because some languages, such as Serbian, are written in Latin or
    Cyrillic, and some Chinese readers prefer the traditional over the simplified
    characters.

    3. Optionally, a country or region, specified by two uppercase letters or three
    digits, such as US (United States) or CH (Switzerland). Table 13.2 shows common
    codes.

    4. Optionally, a variant.


    +   5. Optionally, an extension. Extensions describe local preferences for calendars
    (such as the Japanese calendar), numbers (Thai instead of Western digits), and
    so on. The Unicode standard specifies some of these extensions. Extensions start
    with u- and a two-letter code specifying whether the extension deals with the
    calendar (ca), numbers (nu), and so on. For example, the extension u-nu-thai denotes
    the of Thai numerals. Other extensions are entirely arbitrary and start with x-,
    as x-java.


    > Note

    > Variants are rarely used nowadays. There used to be a “Nynorsk” variant of Norwegian,
    but it is now expressed with a different language code, nn. What used to be variants
    for the Japanese imperial calendar and Thai numerals are now expressed as extensions.


    Rules for locales are formulated in the “Best Current Practices” memo BCP 47 of
    the Internet Engineering Task Force (http://tools.ietf.org/html/bcp47). You can
    find a more'
  merge: -1
  pgno: 597
