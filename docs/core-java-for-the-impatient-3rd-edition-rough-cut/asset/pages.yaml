    In general, when you implement a class, you need to decide whether


    +   1. You do not want provide a clone method, or

    2. The inherited clone method is acceptable, or

    3. The clone method should make a deep copy.


    For the first option, simply do nothing. Your class will inherit the clone method,
    but no user of your class will be able to call it since it protected.


    To choose the second option, your class must implement the Cloneable interface.
    This is an interface without any methods, called a tagging or marker interface.
    (Recall that the clone method is defined in the Object class.) The Object.clone
    method checks that this interface is implemented before making a shallow copy,
    and throws a CloneNotSupportedException


