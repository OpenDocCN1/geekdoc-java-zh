  md: 'To check whether two strings are equal, use the equals method. For example,


    ```

    location.equals("World")

    ```


    yields true if location is in fact the string "World".


    # Caution


    > Never use the == operator to compare strings. The comparison


    ```

    location == "World" // Don''t do that!

    ```


    returns true only if location and "World" are the same object in memory. In the
    virtual machine, there is only one instance of each literal string, so "World"
    == "World" will be true. But if location was computed, for example,


    ```

    String location = greeting.substring(7, 12);

    ```


    then the result is placed into a separate String object, and the comparison location
    == "World" will return false!


    Like any object variable, a String variable can be null, which indicates that
    the variable does not refer to any object at all, not even an empty string.


    ```

    String middleName = null;

    ```


    To test whether an object is null, you do use the == operator:


    ```

    if (middleName == null) ...

    ```


    Note that null is not the same as an empty string "". An empty string is a string
    of length zero, whereas null isn''t any string at all.


    # Caution


    > Invoking any method on null causes a "null pointer exception.\ Like exceptions,
    it terminates your program if you don''t explicitly handle it.'
