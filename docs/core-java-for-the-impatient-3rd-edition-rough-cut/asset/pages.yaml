  md: '# 12. The Date and Time API


    Time flies like an arrow, and we can easily set a starting point and count forwards
    and backwards in seconds. So why is it so hard to deal with time? The problem
    is humans. All would be easy if we could just tell each other: “Meet me at 1371409200,
    and don’t be late!” But we want to relate to daylight and the seasons. That’s
    where things gets complicated. Java 1.0 had a Date class that Java 1.1 when a
    Calendar was introduced. Its API wasn’t stellar, its instances were mutable, and
    it didn’t deal with issues such as leap seconds. The third time was a charm, and
    the java.time API introduced in Java 8 has remedied the flaws of the past and
    should serve us for quite some time. In this chapter, you will learn what make
    time computations vexing, and how the Date and Time API solves these issues.


    The key points of this chapter are:


    +   1. java.time objects are immutable.

    2. An Instant is a point on the time line (similar to a Date).

    3. In Java time, each day has exactly 86,400 seconds (that is, no leap seconds).

    4. A Duration is the difference between two instants.

    5. LocalDateTime has no time zone information.

    6. TemporalAdjuster methods handle common computations, such as finding the first
    Tuesday of a month.

    7. ZonedDateTime is a point in time in a given time zone (similar to GregorianCalendar).

    8. Use a Period, not a Duration, when advancing zoned time, in order to account
    for daylight savings time changes.

    9. Use DateTimeFormatter to format and parse dates and times.'
