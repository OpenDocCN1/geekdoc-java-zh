  md: 'The Java platform designers, faced with a giant hairball of code, decided that
    they needed a structuring mechanism that provides more control. They looked at
    existing module systems (such as OSGi) and found them unsuitable for their problem.
    Instead, they designed a new system, called the Java Platform Module System, that
    is now a part of the Java language and virtual machine. That system has been used
    successfully to modularize the Java API, and you can, if you so choose, use it
    with your applications.


    A platform module consists of:


    +   - A collection of packages

    - Optionally, resource files and other files such as native libraries

    - A list of the accessible packages in the module

    - A list of all modules on which this module depends


    The Java platform performs encapsulation and dependencies, both at compile time
    and in the virtual machine.


    Why should you consider using the Java Platform Module System for your own programs
    instead of following the traditional approach of using JAR files on the class
    path? There are two advantages.


    +   1. Strong encapsulation: You can control which of your packages are accessible,
    and you didn''t have to worry about maintaining code that you didn''t intend for
    public consumption.

    2. Reliable configuration: You avoid common class path problems such as duplicate
    or missing classes.


    There are some issues that the Java Platform Module System does not address, such
    as versioning of modules. There is no support for specifying which version of
    a module is required, or for using multiple versions of a module in the same program.
    These can be desirable features, but you must use mechanisms other than the Java
    Platform Module System if you need them.


    # 15.2. Naming Modules


    A module is a collection of packages. The package names in the module need to
    be related. For example, the module java.sql contains packages java.sql, javax.sql,
    and javax.transaction.xa. Also, as you can see from this example, it is perfectly
    acceptable for the module name to be the same as a package name.'
