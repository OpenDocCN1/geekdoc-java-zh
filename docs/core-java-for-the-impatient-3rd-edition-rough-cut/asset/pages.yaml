    # 9.5.7. Deserialization and Security


    During deserialization of a serializable class, objects are created without invoking
    constructor of the class. Even if the class has a no-argument constructor, it
    is not used. The field values are set directly from the values of the object input
    stream.


    # Note


    For serializable records, deserialization calls the canonical constructor, passing
    the values of the components from the object input stream. (As a consequence,
    cyclic references in records are not restored.)


    Bypassing construction is a security risk. An attacker can craft bytes describing
    an invalid object that could never have been constructed. Suppose for example,
    that the Employee constructor throw an exception when called with a negative salary.
    We would like to think that this means no Employee object can have a negative
    salary. But it is not difficult to inspect the bytes for a serialized object and
    modify some of them. By doing so, one can craft bytes for an employee with a negative
    salary and deserialize them.


    A serializable class can optionally implement the ObjectInputValidation interface
    and define a validateObject method to check whether its objects are properly deserialized.
    For example, the Employee class can check that salaries are not negative:


    ```

    public void validateObject() throws InvalidObjectException

    ```'
