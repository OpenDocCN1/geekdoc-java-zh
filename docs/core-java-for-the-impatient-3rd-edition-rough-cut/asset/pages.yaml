  md: '# 6. Generic Programming


    You often need to implement classes and methods that work with multiple types.
    For example, an ArrayList<T> stores elements of an arbitrary class T. We say that
    the ArrayList class is generic, and T is a type parameter. The basic idea is very
    simple and incredibly useful. The first two sections of this chapter cover the
    simple part.


    In any programming language with generic types, the details get tricky when you
    restrict or vary type parameters. For example, suppose you want to sort elements.
    Then you must specify that T provides an ordering. Furthermore, if the type parameter
    varies, what should that mean for the generic type? For example, what should be
    the relationship between ArrayList<String> to a method that expects ArrayList<Object>?
    Section 6.3 and Section 6.4 show how Java deals with these issues.


    In Java, generic programming is more complex than it perhaps should, because generics
    were added when Java had been around for a while, and they were designed to be
    backward-compatible. As a consequence, there are a number of unfortunate restrictions,
    which affect every Java programmer. Others are only of interest to implementors
    of generic classes. See Section 6.5 and Section 6.6 for the details. The final
    section covers generics and reflection, and you can safely skip it if you are
    not using reflection in your programs.


    The key points of this chapter are:


    +   1. A generic class is a class with one or more type parameters.

    2. A generic method is a method with type parameters.

    3. You can require a type parameter to be a subtype of one or more types.

    4. Generic types are invariant: When S is a subtype of T, there is no relationship
    between G<S> and G<T>.'
