  md: "# 9.5. Serialization\n\nIn the following sections, you will learn about object\
    \ serialization—a mechanism for turning an object into a bunch of bytes that can\
    \ be shipped somewhere else or stored on disk, and for reconstituting the object\
    \ from those bytes.\n\nSerialization is an essential tool for distributed processing,\
    \ where objects are shipped from one virtual machine to another. It is also used\
    \ for fail-over and load balancing, where serialized objects can be moved to another\
    \ server. If you work with server-side software, you will often need to enable\
    \ serialization for classes. The following sections tell you how to do it.\n\n\
    # 9.5.1. The Serializable Interface\n\nIn order for an object to be serialized—that\
    \ is, turned into a bunch of bytes—it must be an instance of a class that implements\
    \ the Serializable interface. This is a marker interface with no methods, similar\
    \ to the Cloneable interface that you saw in Chapter 4.\n\nFor example, make Employee\
    \ objects serializable, the class needs to be declared as\n\n```\npublic class\
    \ Employee implements Serializable {\n    private String name;\n    private double\
    \ salary;\n    ...\n}\n```\n\nIt is appropriate for a class to implement the Serializable\
    \ interface if all instance variables are primitive or enum type, or contain references\
    \ to serializable objects. Many classes in the standard library are serializable.\
    \ Arrays and the collection classes that you saw in Chapter 7 are serializable\
    \ provided their elements are.\n\nIn the case of the Employee class, and indeed\
    \ with most classes, there is no problem. In the following sections, you will\
    \ see what to do when a little extra help is needed.\n\nTo serialize objects,\
    \ you need an ObjectOutputStream, which is constructed with another OutputStream\
    \ that receives the actual bytes."
