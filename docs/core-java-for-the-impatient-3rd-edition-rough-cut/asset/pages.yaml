  md: '# 15. The Java Platform Module System


    An important characteristic of object-oriented programming is encapsulation. A
    class declaration consists of a public module interface and a private implementation.
    A class can evolve by changing the implementation without affecting its users.
    A module system provides the same benefits for programming in the large. A module
    can make classes and packages selectively available so that its evolution can
    be controlled.


    Several existing Java module systems rely on class loaders. However, Java 9 introduced
    a new system, called the Java Platform Module System, that is supported by the
    Java compiler and virtual machine. It was designed to modularize the large code
    base of the Java platform. You can, if you choose, use this system to modularize
    your applications.


    Whether or not you use Java platform modules in your applications, you may be
    impacted by the modularized Java platform. This chapter shows how to declare and
    use Java platform modules. You will also learn how to migrate your applications
    to work with the modularized Java platform and third-party modules.


    The key points of this chapter are:


    +   1. The Java Platform Module System was designed to modularize the Java platform.

    2. You can use the Java Platform Module System to modularize applications and
    libraries.

    3. A module is a collection of packages.

    4. The properties of a module are defined in module-info.java.

    5. A module declares on which other modules it depends.

    6. A module provides encapsulation. Accessible packages must be explicitly exported.

    7. A module may allow reflective access to private features by opening a package
    or the entire module.

    8. The module system provides support for the ServiceLoader facility.'
