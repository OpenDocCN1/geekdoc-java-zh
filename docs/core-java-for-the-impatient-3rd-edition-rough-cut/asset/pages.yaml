  md: 'reflective access at runtime is also enforced. In order to give you time to
    prepare for that change, the java launcher in Java 9 through 16 had an --illegal-access
    flag with four possible settings:


    +   1. --illegal-access=permit is the Java 9 default behavior, printing a message
    for the first instance of illegal access.


    +   2. --illegal-access=warn prints a message for each illegal access.


    +   3. --illegal-access=debug prints a message and stack trace for each illegal
    access.


    +   4. --illegal-access=deny is the Java 16 default behavior, denying illegal
    access.


    The --illegal-access flag is no longer usable in Java 17.


    The --add-exports and --add-opens flags allow you to tweak legacy applications.
    Consider an application that uses an internal API that is no longer accessible,
    such as com.sun.rowset.CachedRowSetImpl. The best remedy is to change the implementation.
    (As of Java 7, you can get a cached row set from RowSetProvider.) But suppose
    you dont have access to the source code.


