    # 1.5.7. Text Blocks


    The text block syntax makes it easy to provide string literals that span multiple
    lines. A text block starts with """", followed by a line feed. The text block
    ends with another """"


    ```

    String greeting = """

    Hello

    World

    """

    ```


    This string contains two line breaks: one after Hello and one after World. The
    line break after the opening """ is not included in the string literal.


    If you don''t want a line break after the last line, you put the closing """ immediately
    behind the last character:


    ```

    String prompt = """

    Hello, my name is Hal.

    Please enter your name: """;

    ```


    In any line, you can suppress the line break with a backslash as the last character:


    ```

    String prompt = """

    Hello, my name is Hal. \

    Please enter your name:""";

    ```


    This string does not contain any line breaks.'
