  md: "An HttpClient can issue requests and receive responses. You get a client by\
    \ calling\n\n```\nHttpClient client = HttpClient.newHttpClient();\n```\n\nAlternatively,\
    \ if you need to configure the client, use a builder API like this:\n\n```\nHttpClient\
    \ client = HttpClient.newBuilder()\n    .followRedirects(HttpClient.Redirect.ALWAYS)\n\
    \    .build();\n```\n\nThat is, you get a builder, call methods to customize the\
    \ item that is going to be built, and then can call the build method to finalize\
    \ the building process. This is a common pattern for constructing immutable objects.\n\
    \nFollow the same pattern for formulating requests. Here is a GET request:\n\n\
    ```\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(new URI(\"https://horstmann.com\"\
    ))\n    .GET()\n    .build();\n```\n\nThe URI is the “uniform resource identifier”\
    \ which is, when using HTTP, the same as a URL. However, in Java, the URL class\
    \ has methods for actually opening a connection to a URL, whereas the URI class\
    \ is only concerned with the syntax (scheme, host, port, path, query, fragment,\
    \ and so on).\n\nWhen sending the request, you have to tell the client how to\
    \ handle the response. If you just want the body as a string, send the request\
    \ with a HttpResponse.BodyHandlers.ofString(), like this:\n\n```\nHttpResponse<String>\
    \ response\n    = client.send(request,\n    HttpResponse.BodyHandlers.ofString());\n\
    ```\n\nThe HttpResponse class is a template whose type denotes the type of the\
    \ body. You get the response body string simply as\n\n```\nString bodyString =\
    \ response.body();\n```"
