    them. Calling setAccessible(true) “unlocks” the field or method for reflection.
    However, the module system or a security manager can block the request and protect
    objects from being accessed in this way. In that case, the setAccessible method
    throws an InaccessibleObjectException or SecurityException. Alternatively, you
    can call the tryAccessible method which simply returns false if the field or method
    is not accessible.


