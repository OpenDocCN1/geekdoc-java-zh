  md: 'HelloWorld class and the main method as public, which is the most common arrangement
    for classes and methods.


    +   A package is a set of related classes. It is a good idea to place each class
    in a package so you can group related classes together and avoid conflicts when
    multiple classes have the same name. In this book, we''ll use chapter and section
    numbers as package names. The full name of our class is ch01.sec01.HelloWorld.
    Chapter 2 has more to say about packages and package naming conventions.


    +   The line starting with // is a comment. All characters between // and the
    end of the line are ignored by the compiler and meant for human readers.


    +   Finally, we come to the body of the main method. In our example, it consists
    of a single line with a command to print a message to System.out, an object representing
    the "standard output" of the Java program.


    As you can see, Java is not a scripting language that can be used to quickly dash
    off few commands. It is squarely intended as a language for larger programs that
    benefit from being organized into classes, packages, and modules (Modules are
    introduced in Chapter 15).


    Java is also quite simple and uniform. Some languages have global variables and
    functions as variables inside a class. In Java, everything is declared inside
    a class. This uniformity can lead to somewhat verbose code, but it makes it easy
    to understand the meaning of a program.


    # Note


    > You have just seen a // comment that extends to the end of the line. You can
    also have multiline comments between /* and */ delimiters, such as


    /*

    This is the first sample program in Core Java for the Impatient.

    The program displays the traditional greeting "Hello, World!".

    */'
