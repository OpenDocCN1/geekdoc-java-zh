    Some operating systems have a central repository for configuration information.
    The best-known example is the registry in Microsoft Windows. The Preferences class,
    which is the standard mechanism in Java for storing user preferences, uses the
    registry on Windows. On Linux, the information is stored in the local file system
    instead. The specific repository implementation is transparent to the programmer
    using the Preferences class.


    The Preferences repository holds trees of nodes. Each node in the repository has
    a table of key/value pairs. Values can be numbers, boolean values, strings, or
    byte arrays.


    # Note


    > No provision is made for storing arbitrary objects. You are, of course, free
    to store a serialized object as a byte array if you aren''t worried about using
    serialization for long-term storage.


    Paths to nodes look like /com/mycompany/myapp. As with package names, you can
    avoid name clashes by starting the paths with reversed domain names.


    There are two parallel trees. Each program user has one tree. An additional tree,
    called the system tree, is available for settings that are common to all users.
    The Preferences class uses the operating system notion of the "current user" for
    accessing the appropriate user tree. To access a node in the tree, start with
    the user or system root:


    ```

    Preferences root = Preferences.userRoot();

    ```


    or


    ```

    Preferences root = Preferences.systemRoot();

