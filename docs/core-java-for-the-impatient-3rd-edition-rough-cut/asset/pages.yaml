  md: "There is a good number of final classes in the Java API, such as String, LocalTime,\
    \ and URL.\n\n# 4.2.2. Abstract Methods and Classes\n\nA class can define a method\
    \ without an implementation, forcing subclasses to implement it. Such a method,\
    \ and the class containing it, are called abstract and must be tagged with the\
    \ abstract modifier. This is commonly done for very general classes, for example:\n\
    \n```\npublic abstract class Person {\n    private String name;\n\n    public\
    \ Person(String name) { this.name = name; }\n\n    public final String getName()\
    \ { return name; }\n\n    public abstract int getId();\n}\n```\n\nAny class extending\
    \ Person must either supply an implementation of the getId method or be itself\
    \ declared as abstract.\n\nNote that an abstract class can have nonabstract methods,\
    \ such as the getName method in the preceding example.\n\n> ### Note\n\nUnlike\
    \ an interface, an abstract class can have instance variables and constructors.\n\
    \nIt is not possible to construct an instance of an abstract class. For example,\
    \ the call\n\n```\nPerson p = new Person(\"Fred\"); // Error\n```\n\nwould be\
    \ a compile-time error."
