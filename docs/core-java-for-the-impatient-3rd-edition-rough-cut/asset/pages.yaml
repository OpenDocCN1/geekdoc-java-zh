    # 1.1.3. Method Calls


    Let us have a closer look at the single statement of the `main` method:


    ```

    System.out.println("Hello, World!");

    ```


    `System.out` is an object. It is an instance of a class called `PrintStream`.
    The `PrintStream` class has methods `println`, `print`, and so on. These methods
    are called `instance methods` because they operate on objects, or instances, of
    the class.


    To invoke an instance method on an object, you use the dot notation


    ```

    object.methodName(arguments)

    ```


    In this case, there is just one argument, the string "Hello, World!". Let’s try
    it with another example. Strings such as "Hello, World!" are instances of the
    `String` class. The `String` class has a method `length` that returns the length
    of a `String` object. To call the method, you again use the dot notation:


    ```

    "Hello, World!".length()

    ```


    The `length` method is invoked on the object "Hello, World!", and it has no arguments.
    Unlike the `println` method, the `length` method returns a result. One way of
    using that result is to print it:


    ```

    System.out.println("Hello, World!".length());

    ```


    Give it a try. Make a Java program with this statement and run it to see how long
    string.


    In Java, you need to `construct` most objects (unlike `System.out` "Hello, World!"
    objects, which are already there, ready for you to use).'
