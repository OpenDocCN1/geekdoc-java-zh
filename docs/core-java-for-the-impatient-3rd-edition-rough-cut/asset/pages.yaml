- img_proc: true
  md: 'In ancient times, before objects were invented, you wrote programs by calling
    functions. When you call a function, it returns a result that you use without
    worrying how it was computed. Functions have an important benefit: they allow
    work to be shared. You can call a function that someone else wrote without having
    to know how it does its task.


    Objects add another dimension. Each object can have its own state. The state affects
    the results that you get from calling a method. For example, if in is a Scanner
    object and you call `next()`, the object remembers what was read and gives you
    the next input token.


    When you use objects someone else implemented and invoke methods on them, you
    do not need to know what goes under the hood. This principle, called *encapsulation*,
    is a key concept of object-oriented programming.


    At some point, you may want to make your work available for other programmers
    by providing them with objects they can use. In Java, you provide a `class`—a
    mechanism for creating and using objects with the same behavior.


    Consider a common task: manipulation of calendar dates. Calendars are somewhat
    messy, with varying month lengths and leap years, not to mention leap seconds.
    It makes sense to have experts who figure out those messy details and who provide
    implementations that other programmers can use. In this situation, objects arise
    naturally. A date is an object whose methods can provide information such as “on
    what weekday does this date fall” and “what date is tomorrow.”


    In Java, experts who understand date computations provide date-related concepts
    such as weekdays. If you want to do computations with dates, use one of those
    classes to create date objects and invoke methods on them, such as a method that
    yields the weekday or the next date.


    Few of us want to ponder the details of date arithmetic, but you are probably
    an expert in some other area. To enable other programmers to leverage your knowledge,
    you can provide them with classes. And even if you are not enabling other programmers,
    you will find it useful in your own work to use classes so that your programs
    are structured in a coherent way.


    Before learning how to declare your own classes, let us run through a nontrivial
    example of using objects.'
