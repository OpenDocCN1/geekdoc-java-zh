    # Note


    There are times when reduce is not general enough. For example, suppose you want
    to collect the results in a BitSet. If the collection is parallelized, you can''t
    put the elements directly into a single BitSet because a BitSet object is not
    threadsafe. For that reason, you can''t use reduce. Each segment needs to start
    out with its empty set, and reduce only lets you supply one identity value. Instead,
    use collect. It takes three arguments:


    +   1. A supplier to make new instances of the target object, for example constructor
    for a hash set


    +   2. An accumulator that adds an element to the target, such as an add method


    +   3. A combiner that merges two objects into one, such as add


    Here is how the collect method works for a bit set:


    ```

    BitSet result = stream.collect(BitSet::new,

    BitSet::set, BitSet::or);

