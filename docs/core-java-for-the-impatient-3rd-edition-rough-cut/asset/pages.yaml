    The returned value is one of the following:


    +   ■ null: Concurrent execution is not safe.

    ■ "MULTITHREADED": Concurrent execution is safe. Effects from one thread might
    be visible from another thread.

    ■ "THREAD-ISOLATED": In addition, different variable bindings are maintained for
    each thread.

    ■ "STATELESS": In addition, scripts do not alter variable bindings.


    # 14.2.3. Bindings


    A binding consists of a name and an associated Java object. For example, consider
    these statements:


    ```

    engine.put("k", 1728);

    Object result = engine.eval("k + 1");

    ```


    Conversely, you can retrieve variables that were bound by scripting statements:


    ```

    engine.eval("n = 1728");

    Object result = engine.get("n");

    ```


    These bindings live in the engine scope. In addition, there is a global scope.
    Any bindings you add to the ScriptEngineManager are visible to all engines.


    Instead of adding bindings to the engine or global scope, you can collect them
    in an object of type Bindings and pass it to the eval method:


    ```

    Bindings scope = engine.createBindings();

    scope.put("k", 1728);

    Object result = engine.eval("k + 1", scope);

    ```


    This is useful if a set of bindings should not persist for future calls to the
    eval method.'
