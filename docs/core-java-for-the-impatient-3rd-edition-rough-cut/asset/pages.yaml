    # 5.2.2. Enabling and Disabling Assertions


    By default, assertions are disabled. Enable them by running the program with the
    -enableassertions or -ea option:


    ```

    java -ea MainClass

    ```


    You do not have to recompile your program because enabling or disabling assertions
    is handled by the class loader. When assertions are disabled, the class loader
    strips out the assertion code so that it won''t slow execution. You can even enable
    assertions in specific classes or in entire packages, for example:


    ```

