    # 10.3.3. Strategies for Safe Concurrency


    In languages such as C and C++, programmers need to manually allocate andallocate
    memory. That sounds dangerous—and it is. Many programmers have spent countless
    hours chasing memory allocation bugs. In Java, there is a garbage collector, and
    a few programmers need to worry about memory management.


    Unfortunately, there is no equivalent mechanism for shared data access in a concurrent
    program. The best you can do is to follow a set of guidelines to manage the inherent
    dangers.


    A highly effective strategy is confinement. Just say no when it comes to sharing
    data among tasks. For example, when your tasks need to count something, give each
    of them a private counter instead of updating a shared counter. When the tasks
    are done, they can hand off their results to another task that combines them.


    Another good strategy is immutability. It is safe to share immutable objects.
    For example, instead of adding results to a shared collection, a task can generate
