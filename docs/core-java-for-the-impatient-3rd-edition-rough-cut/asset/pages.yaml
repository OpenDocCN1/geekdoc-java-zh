    # # 12.5. Zoned Time


    Time zones, perhaps because they are an entirely human creation, are even messier
    than the complications caused by the Earth''s irregular rotation. In a rational
    world, we''d all follow the clock in Greenwich, and some of us would eat our lunch
    at 02:00, at 22:00. Our stomachs would figure out. It is actually done in China,
    which spans four conventional time zones. Elsewhere, we have time zones with irregular
    and shifting boundaries, and to make matters worse, the daylight savings time.


    As capricious as the time zones may appear to the enlightened, they are a fact
    of life. When you implement a calendar application, it needs to work for people
    who fly from one country to another. When you have a conference call at 10:00
    in New York, but happen to be in Berlin, you expect to be alerted to the correct
    local time.


    The Internet Assigned Numbers Authority (IANA) keeps a database of all known time
    zones around the world (https://www.iana.org/time-zones), which is updated several
    times per year. The bulk of the updates deals with the changing rules for daylight
    savings time. Java uses the IANA database.


    Each time zone has an ID, such as America/New_York or Europe/Berlin. To find out
    all available time zones, call ZoneId.getAvailableIds(). At the time of this writing,
    there were most 600 IDs.


    Given a time zone ID, the static method ZoneId.of(id) yields a ZoneId object.
    You can use that object to turn a LocalLocalDateTime object into a ZonedDateTime
    object by calling local.atZone(zone), or you can construct a ZonedDateTime by
    calling the static method ZonedDateTime.of(year, month, day, hour, minute, nano,
    zoneId). For example,'
