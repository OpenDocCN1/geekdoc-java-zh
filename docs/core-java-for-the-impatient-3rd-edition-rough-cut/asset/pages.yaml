  md: 'The List interface is implemented both by the ArrayList class, which you have
    seen throughout this book, and the LinkedList class. If you took a course on data
    structures, you probably remember a linked list—a sequence of linked nodes, each
    carrying an element. Insertion in the middle of a linked list is speedy—you just
    in a node. But to get to the middle, you have to follow all the links from the
    beginning, which is slow. There are applications for linked lists, but most programmers
    will probably stick with array lists when they need a sequential collection. Still,
    the List interface is useful. For example, the method Collections.nCopies(n, o)
    returns a List with n copies of the object o. That object “cheats” in that it
    doesn''t actually store n copies but, when you ask about any of them, returns
    o.


    # Caution


    > The List interface provides methods to access the nth element of a list, even
    though such an access may not be efficient. To indicate that it is, a collection
    class should implement the RandomAccess interface. This is a tagging interface
    without methods. For example, ArrayList implements List and RandomAccess, but
    LinkedList implements only the List interface.


    In a Set, elements are not inserted at a particular position, and duplicate elements
    are not allowed. A SortedSet allows iteration in sort order, and a NavigableSet
    has methods for finding neighbors of elements. You will learn more about sets
    in Section 7.3.


    A Queue retains insertion order, but you can only insert elements from the head
    (just like a queue of people). A Deque is a double-ended queue with insertion
    and removal at both ends.


    All collection interfaces are generic, with a type parameter for the element type
    (Collection<E>, List<E>). The Map<K, V> interface has a type parameter K for the
    key type and V for the value type.


    You are encouraged to use the interfaces as much as possible in your code. For
    example, by constructing an ArrayList, store the reference in a variable of type
    List:'
