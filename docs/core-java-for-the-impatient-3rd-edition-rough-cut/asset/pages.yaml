  md: 'Abusing the @SuppressWarnings annotation can lead to heap pollution—objects
    that should belong to a particular generic type instantiation but actually belong
    to a different one. For example, you can assign an ArrayList<Employee> to an ArrayList<String>
    reference. The consequence is a ClassCastException when element of the wrong type
    is retrieved.


    # Tip


    The trouble with heap pollution is that the reported runtime error is far from
    the source of the problem—the insertion of a wrong element. If you need to debug
    such a problem, you can use a “checked view.” Where you constructed, say, an ArrayList<String>,
    instead use


    ```

    List<String> strings

    = Collections.checkedList(ArrayList<>()(), String.class);

    ```


    The view monitors all insertions into the list and throws an exception when an
    object of the wrong type is added.


    The getClass method always returns a raw type. For example, if list an ArrayList<String>,
    then list.getClass() returns ArrayList.class. In fact, there is no ArrayList<String>.class—such
    a class literal is a syntax error.


    Also, you can have type variables in class literals. There is no T.class, T[].class,
    or ArrayList<T>.class.


    # 6.6.3. You Cannot Instantiate Type Variables


    You cannot use type variables in expressions such as new T(...) or new T[...].
    These forms are outlawed because they would not do what the programmer intends
    when T is erased.'
