  md: '# Note


    Of course, the increment method does not return the old value. Doing that would
    undo the efficiency gain of splitting the sum into multiple summands.


    The LongAccumulator generalizes this idea to an arbitrary accumulation operation.
    In the constructor, you provide the operation as well as its neutral element.
    To incorporate new values, call accumulate. Call get to obtain the current value.


    ```

    var accumulator = new LongAccumulator(Long::sum, 0);

    // In some tasks...

    accumulator.accumulate(value);

    // When all work is done

    long sum = accumulator.get();

    ```


    Internally, the accumulator has variables a₁, a₂, ..., aₙ. Each variable is initialized
    with the neutral element (0 in our example).


    When accumulate is called with value v, then one of them is atomically updated
    as a_ᵢ = aᵢ op v, where op is the accumulation operation written in infix form.
    In our example, a call to accumulate a_ᵢ = aᵢ + v for some i.


    The result of get is a₁ a₂ op ... op aₙ. In our example, this is the sum of the
    accumulators, a₁ + a₂ + ... + aₙ.


    If you choose a different operation, you can compute maximum or minimum (see Exercise
    0). In general, the operation must be associative and commutative. That means
    that the final result must be independent of the order in which the intermediate
    values were combined.


    There are also DoubleAdder and DoubleAccumulator that work in the same way, except
    with double values.


