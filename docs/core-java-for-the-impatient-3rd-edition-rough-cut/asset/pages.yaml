  md: "# Tip\n\nIf you want to load a module into JShell, include the JAR on the module\
    \ path and use the --add-module-modules option:\n\n```\njshell --module-path\n\
    com.horstmann.greet@1.0.jar \\\n  --add-modules com.horstmann.greet\n```\n\n#\
    \ 15.8. Automatic Modules\n\nYou now know to put the Java Platform Module System\
    \ to use. If you start with a brand-new project in which you write all the code\
    \ yourself, you can design modules, declare module dependencies, and package your\
    \ application into modular files.\n\nHowever, that is an extremely uncommon scenario.\
    \ Almost all projects rely on third-party libraries. Of course, you can wait until\
    \ the providers of all libraries have turned them into modules, and modularize\
    \ your own.\n\nBut what if you don't want to wait? The Java Platform Module System\
    \ provides two mechanisms for crossing the chasm that separates today's pre-modular\
    \ world and fully modular applications: automatic modules and the unnamed module.\n\
    \nFor migration purposes, you can turn any JAR file into a module, simply by placing\
    \ it onto a directory in the module path instead of the class path. A JAR without\
    \ a module-info.class on the module path is called an automatic module. An automatic\
    \ module has the following properties:\n\n+   1. The module implicitly has a requires\
    \ clause for all other modules.\n2. All of its packages are exported and opened.\n\
    3. If there is an entry with key Automatic-Module-Name in the JAR file manifest\
    \ META-INF/MANIFEST.MF, the value becomes the module name.\n4. Otherwise the module\
