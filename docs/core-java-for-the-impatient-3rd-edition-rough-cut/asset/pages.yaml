    # ## 12.2. Local Dates


    Now let us turn from absolute time to human time. There are two kinds of human
    time in the Java API, *local date/time and zoned time*. Local date/time has a
    date and/or time of day, but no associated time zone information. An example of
    a local date is June 14, 1903 (the day on which Alonzo Church, inventor of the
    lambda calculus, was born). Since that date has neither a time of'
  merge: -1
  pgno: 572
- img_proc: true
  md: 'day nor time zone information, it does not correspond to a precise instant
    of time. In contrast, July 16, 1969, 09:32:00 EDT (the launch of Apollo 11) is
    a zoned date/time, representing a precise instant on the time line.


    There are many calculations where time zones are not required, and in some cases
    they can even be a hindrance. Suppose you schedule a meeting every week at 10:00.
    If you add 7 days (that is, 7 × 24 × 60 × 60 seconds) to the last zoned time,
    and you have to cross the daylight savings time boundary, the meeting will be
    an hour too early or too late!


    For this reason, the API designers recommend that you do not use zoned time unless
    you really want to represent absolute time instances. Birthdays, holidays, schedule
    times, and so on are usually best represented as local times.


    A LocalDate is a date with a year, month, and day of the month. To construct one,
    you can use the now or of static methods:


    ```

    LocalDate today = LocalDate.now(); // Today’s date

    LocalDate alonzosBirthday = LocalDate.of(1903, 6, 14);

    alonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);


    // Uses the Month enumeration

    ```


    Unlike the irregular conventions in Unix and java.util.Date, where months are
    zero-based and years are counted from 1900, you supply the usual numbers for the
    month of year. Alternatively, you can use the Month enumeration.


    Table 12.2 shows the most useful methods for working with LocalDate objects.


