  md: '# 2. Object-Oriented Programming


    In object-oriented programming, work is carried out by collaborating objects whose
    behavior is defined by the classes to which they belong. Java was one of the first
    mainstream programming languages to fully embrace object-oriented programming.
    As you have already seen, in Java every method is declared in a class, and except
    for a few primitive types, every value is an object. In this chapter, you will
    learn how to implement your own classes and methods.


    The key points of this chapter are:


    +   1. Mutator methods change the state of an object; accessor methods don''t.

    2. In Java, variables don''t hold objects; they hold references to objects.

    3. Instance variables and method implementations are declared inside the class
    declaration.

    4. An instance method is invoked on an object, which is accessible through the
    `this` reference.

    5. A constructor has the same name as the class. A class can have multiple (overloaded)
    constructors.

    6. Static variables don''t belong to any objects. Static methods are not invoked
    on objects.

    7. A `record` is a class with public acceptors for all instance variables.

    8. Classes are organized into packages. Use import declarations so that you don''t
    have to use the package name in your programs.

    9. Classes can be nested in other classes.


    10. An inner class is a nonstatic nested class. Its instances have a reference
    to the object of the enclosing class that constructed it.


    11. The `javadoc` utility processes source files, producing HTML files with declarations
    and programmer-supplied comments.


    # 2.1. Working with Objects'
