    # 3.2.4. Private Methods


    Methods in an interface can be private. A private method can be static or an instance
    method, but it cannot be a default method since that can be overridden. As private
    methods can only be used in the methods of the interface itself, their use is
    limited to being helper methods for the other methods of the interface.


    For example, suppose the IntSequence class provides methods


    ```

    static of(int a)

    static of(int a, int b)

    static of(int a, int b, int c)

    ```


    Each of these methods could call a helper method


    ```

    private static IntSequence

    makeFiniteSequence(int... values) { ... }

    ```


    # 3.3. Examples of Interfaces


    At first glance, interfaces don’t seem to do very much. An interface is just a
    set of methods that a class promises to implement. To make the importance of interfaces
    more tangible, the following sections show you four examples of commonly used
    interfaces from the Java API.


