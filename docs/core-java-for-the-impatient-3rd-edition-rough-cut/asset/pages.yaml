    You use the jlink tool to produce an application that executes without a separate
    Java runtime. The resulting image is much smaller than the entire JDK. You specify
    the modules that you want to include and an output directory.


    ```

    jlink --module-path com.horstmann.greet.jar:ch15.sec05.jar:$JAVA_HOME/jmods \

    n--add-modules ch15.sec05 --output /tmp/hello

    ```


    The output directory has a sub true bin with a java executable. If you run bin/java
    -m ch15.sec05


    the main method of the module''s main class is invoked.

    The point of jlink is that it bundles the minimal set of modules that is required
    to run the application. You can list them all:

    bin/java --list-modules


    In this example, the output is

    ch15.sec05 com.horstmann.greet java.base@9


