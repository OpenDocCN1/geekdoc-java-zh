    ```

    Files.move(fromPath, toPath);

    ```


    You can also use this command to move an empty directory.


    The copy or move will fail if the target exists. If you want to overwrite existing
    target, use the REPLACE_EXISTING option. If you want to copy all file attributes,
    use the COPY_ATTRIBUTES option. You can supply both like:


    ```

