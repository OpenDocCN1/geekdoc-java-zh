    # 15.6. Modules and Reflective Access


    In the preceding section, you saw that the module system enforces encapsulation.
    A module can only access explicitly exported packages from another module. In
    the past, it was always possible to overcome pesky access restrictions by using
    reflection. As you have seen in Chapter 4 reflection can access private members
    of any class.


    However, in the modular world, that is no longer true. If a class is inside a
    module, reflective access to non-public members will fail. Specifically, recall
    how we accessed private fields:


    ```

    Field f = obj.getClass().getDeclaredField("salary");

    f.setAccessible(true);

    double value = f.getDouble(obj);

    f.setDouble(obj, value * 1.1);

    ```


    The call f.setAccessible(true) succeeds unless a security manager disallows private
    field access. However, it is not common to run Java applications with security
    managers, and there are many libraries that use reflective access. Typical examples
    are object-relation mappers such as JPA and "binding layers" that provide converters
    between Java objects and JSON or XML.


    If you use such a library, and you also want to use modules, you have to be careful.
    To demonstrate this issue, I will use the Yasson implementation of the JSON-B
    standard. Here is a trivial class that illustrates the mechanism:'
