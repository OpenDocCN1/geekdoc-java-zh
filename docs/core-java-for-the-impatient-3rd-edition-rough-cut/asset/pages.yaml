  md: "+   6. Prefer using parallel algorithms and threadsafe data structures over\
    \ programming with locks.\n\n+   7. Parallel streams and array operations automatically\
    \ and safely parallelize computations.\n\n+   8. ConcurrentHashMap is a threadsafe\
    \ hash table that allows atomic update of entries.\n\n+   9. You can use AtomicLong\
    \ for a lock-free shared counter, or use LongAdder if contention is high.\n\n\
    +   10. A lock ensures that only one thread at a time executes a critical section.\n\
    \n+   11. An interruptible task should terminate when the interrupted flag is\
    \ set or an InterruptedException occurs.\n\n+   12. A long-running task should\
    \ not block the user-interface thread of a program, but progress and final updates\
    \ need to occur in the user-interface thread.\n\n+   13. The Process class lets\
    \ you execute a command in a separate process and interact with the input, output,\
    \ and error streams.\n\n# # 10.1. Concurrent Tasks\n\nWhen you design a concurrent\
    \ program, you need to think about the tasks that can be run together. In the\
    \ following sections, you will see how to execute tasks concurrently.\n\n# ##\
    \ 10.1.1. Running Tasks\n\nIn Java, the Runnable interface describes a task you\
    \ want to run, perhaps concurrently with others.\n\n```\npublic interface Runnable\
    \ {\n    void run();\n}\n```\n\nLike all methods, the run method is executed in\
    \ a thread. A thread is a mechanism for executing a sequence of instructions,\
    \ usually provided by the operating system. Multiple threads run concurrently,\
    \ by using separate processors or different time slices on the same processor."
