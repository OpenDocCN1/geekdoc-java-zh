  md: '# 11. Annotations


    Annotations are tags that you insert into your source code so that some tool can
    process them. The tools can operate on the source level, or they can process class
    files into which the compiler has placed annotations.


    Annotations do not change the way your programs are compiled. The Java compiler
    generates the same virtual machine instructions with or without the annotations.


    To benefit from annotations, you need to select a processing tool and use annotations
    that your processing tool understands, before you can apply that tool to your
    code.


    There is a wide range of uses for annotations. For example, JUnit uses annotations
    to mark methods that execute tests and to specify how the tests should run. The
    Java Persistence Architecture uses annotations to define mappings between classes
    and database tables, so that objects can be persisted automatically without the
    developer having to write SQL queries.


    In this chapter, you will learn the details of the annotation syntax, how to define
    your annotations, and how to write annotation processors that work at the source
    level or at runtime.


    The key points of this chapter are:


    +   1. You can annotate declarations just as you use modifiers such as public
    or static.


    +   2. You can annotate types that appear in declarations, casts, instanceof checks,
    or method references.


    +   3. An annotation starts with a @ symbol and may contain key/value pairs called
    elements.


    +   4. Annotation values must be compile-time constants: primitive types, enum
    constants, Class literals, other annotations, or arrays thereof.


    +   5. An item can have repeating annotations or annotations of different types.'
