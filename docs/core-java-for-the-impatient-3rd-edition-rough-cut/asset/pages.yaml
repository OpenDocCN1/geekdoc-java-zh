    # Note


    In this section, I will use the ReentrantLock class to explain how locking works.
    As you will see in the next section, there is no requirement to use explicit locks
    since there are “implicit” locks that are used by the synchronized keyword. But
    it is easier to understand what goes on under the hood by looking at explicit
    locks.


    The first thread to execute the lock method locks the countLock object and then
    proceeds into the critical section. If another thread tries to call lock on the
    same object, it is blocked until the first thread executes the call to unlock.
    In this way, it is guaranteed that only one thread can execute the critical section.


    Note, by placing the unlock method into a finally clause, the lock is released
    if any exception happens in the critical section. Otherwise, the lock would be
    permanently locked, and no other thread would be able to proceed past it. This
    would clearly be very bad. Of course, in this case, the critical section can''t
    throw an exception since it only executes an integer increment. But it is a common
    idiom to use the try/finally statement anyway, in case more code gets added later.


    At first glance, it seems enough to use locks for protecting critical sections.
    However, the devil is in the details. Experience has shown that many programmers
    have difficulty writing correct code with locks. They might use the wrong locks,
    or create situations that deadlock when no thread can make progress because of
    all them wait for a lock.


    For that reason, application programmers should use locks as a matter of last
    resort. First try to avoid sharing, by using immutable data or handing off mutable
    data from one thread to another. If you must share, use prebuilt threadsafe structures
    such as a ConcurrentHashMap or a LongAdder.'
