    # 8.12. Reduction Operations


    The reduce method is a general mechanism for computing a value from a stream.
    The simplest form takes a binary function and keeps applying it, starting with
    the first two elements. It''s easy to explain this if the function is the sum:


    ```

    List<Integer> values = ...;

    Optional<Integer> sum =

    values.stream().reduce((x, y) -> x + y);

    ```


    In this case, the reduce method computes v₀ + v₁ + v₂ + ..., where the vi are
    the stream elements. The method returns an Optional because there is no valid
    result if the stream is empty.


    # Note


    In this case, you can write reduce(Integer::sum) instead of reduce(x, y) -> x
    + y).


    More generally, you can use any operation that combines a partial result x with
    the next value y to yield a new partial result.


    Here is another way of looking at reductions. Given a reduction operation op,
    the reduction yields v₀ op v₁ op v₂ op ..., where vi op vᵢ₁ + 1 denotes the function
    call op(vi, vi).'
