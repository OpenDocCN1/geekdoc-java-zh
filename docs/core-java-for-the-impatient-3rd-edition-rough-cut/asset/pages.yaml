    = $2^{-10}$ can be written as 0x1.0p-10. In hexadecimal notation, you use a p,
    not an e, to denote the exponent. (An e is a hexadecimal digit.) Note, even though
    the digits are written in hexadecimal, the exponent (that is, the power of 2)
    is written in decimal.


