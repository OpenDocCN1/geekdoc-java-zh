    if the next action is also asynchronous, the next action after that is in a different
    callback. Even though the programmer thinks in terms of “first to do step 1, then
    step 2, then step 3,” the program logic can become dispersed in “callback hell.”
    It gets worse when you have to add error handling. Suppose step 2 is the “user
    logs in.” You may need to repeat that step since the user may misty the credentials.
