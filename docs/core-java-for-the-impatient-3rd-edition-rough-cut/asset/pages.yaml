  md: 'If you want to execute a Runnable in a separate thread, you could spawn a thread
    just for this Runnable, and you will see how to do that in Section 10.8.1. But
    in practice, it doesn''t usually make sense to have a one-to-one relationship
    between tasks and threads. When tasks are short-lived, you want to run many of
    them on the same thread, so don''t waste the time it takes to start a thread.
    When your tasks are computationally intensive, you just want one thread per processor
    instead of one thread per task, to avoid the overhead of switching among threads.
    You do not to think of these issues when designing tasks, and therefore, it is
    best to separate tasks and task scheduling.


    In the Java concurrency library, an executor service schedules and executes tasks,
    choosing the threads to run on.


    ```

    Runnable task = () -> { ... };nExecutorService executor = ...;

    executor.execute(task);

    ```


    The Executors has factory methods for executor services with different scheduling
    policies. The call


    ```

    exec = Executors.newCachedThreadPool();

    ```


    yields an executor service optimized for programs with many tasks that are short-lived
    or spent more of their waiting time. Each task is executed on an idle thread if
    possible, but a new thread is allocated if all threads are busy. There is no bound
    on the number of concurrent threads. Threads that are idle for an extended time
    are terminated.


    The call


    ```

    exec = Executors.newFixedThreadPool(n);

    ```


    yield a pool with a fixed number of threads. When you submit a task, it is queued
    until a thread becomes available. This is a good choice to use for computationally
    intensive tasks, or to limit the resource consumption of a service. You can derive
    the number of threads from the number of available processors, which you obtain
    as


    ```

    int processors =

    Runtime.getRuntime().availableProcessors();

    ```'
