  md: 'are the correspondences:


    | Platform logging | java.util.logging |

    |---|---|

    | ERROR | SEVERE |

    | WARNING | WARNING |

    | INFO | INFO |

    | DEBUG | FINE |

    | TRACE | FINER |


    Similar to package names, logger names are hierarchical. In fact, they are more
    hierarchical than packages. There no semantic relationship between a package and
    its parent, but logger parents and children share certain properties. For example,
    if you turn off loggers to the logger `com.mycompany`, then the child loggers
