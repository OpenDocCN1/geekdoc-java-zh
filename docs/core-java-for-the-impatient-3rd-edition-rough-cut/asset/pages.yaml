  md: 'accessible summary at www.w3.org/International/articles/language-tags.


    # Note


    > The codes for languages and countries seem a bit random because some of them
    are derived from local languages. German in German is Deutsch, Chinese in Chinese
    is zhong; hence de and zh. And Switzerland is CH, deriving from the latin term
    Confederatio Helvetica for the Swiss confederation.


    Locales are described by tags—hyphenated strings of locale elements such as en-US.


    In Germany, you would use a locale de-DE. Switzerland has four official languages
    (German, French, Italian, andhaeto-Romance). A German speaker in Switzerland would
    want to use a locale de-CH. This locale uses the rules for the German language,
    but currency values are expressed in Swiss francs, not euros.


    If you only specify the language, say, de, then the locale cannot be used for
    country-specific issues such as currencies.


    You can construct a Locale object from a tag string like this:


    ```

    LocaleEnglish = Locale.forLanguageTag("en-US");

    ```


    The toLanguageTag method yields the language tag for a given locale. For example,
    Locale.US.toLanguageTag() is the string "en-US".


