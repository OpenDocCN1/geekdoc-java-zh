  md: '# ## 4.3. Object: The Cosmic Superclass


    Every class in Java directly or indirectly extends the class Object. When a class
    has no explicit superclass, it implicitly extends Object. For example,


    ```

    public class Employee { ... }

    ```


    is equivalent to


    ```

    public class Employee extends Object { ... }

    ```


    The Object class defines methods that are applicable to any Java object (see Table
    4.1). We will examine several of these methods in detail in the following sections.


    > > Note

    > Arrays are classes. Therefore, it is legal to convert an array, even a primitive
    type array, to a reference of type Object.


    Table 4.1: The Methods of the java.lang.Object Class'
