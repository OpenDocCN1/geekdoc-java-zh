    # Caution


    In Java, superclass assignment also works for arrays: You can assign a Manager[]
    array to an Employee[] variable. (The technical term is that Java arrays are covariant.)
    This is convenient, but it is also unsound—that is, a possible cause of type errors.
    Consider this example:


    ```

    Manager[] bosses = new Manager[10];

    Employee[] empls = bosses; // Legal in Java

    empls[] = new Employee(...); // Runtime error

    ```


    The compiler accepts the last statement since it is generally legal to store an
    Employee[] array. However, here empl and bosses reference the same Manager[] array,
    which cannot hold a lowly Employee. This mistake is only caught at runtime, when
    the virtual machine throws ArrayStoreException.


    # 4.1.6. Casts


    In the preceding section, you saw how a variable empl of type Employee can refer
    to objects whose class is Employee, Manager, or another subclass of Employee.
    That is useful for code that deals with objects from multiple classes. There is
    one drawback: you can only invoke methods that belong to the superclass. Consider,
    for example:


    ```

    Employee empl = new Manager(...);

    empl.setBonus(10000); // Compile-time error

    ```


    Even though this call could succeed at runtime, it is a compile-time error. The
    compiler checks that you only invoke methods that exist for the receiver type.
    Here, empl is of type Employee and that class has no setBonus method.


    As with interfaces, you can use the instanceof operator and cast to turn a superclass
    reference to a subclass.'
