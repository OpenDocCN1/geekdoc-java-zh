  md: '# 14.2.4. Redirecting Input and Output


    You can redirect the standard input and output of a script by calling the setReader
    and setWriter methods of the script context. For example,


    ```

    var writer = new StringBuilder();

    engine.getContext().setWriter(writer);

    engine.eval("print(''Hello'')");

    String result = writer.toString();

    ```


    Any output written with the JavaScript print function is sent to writer.

    The setReader and setWriter methods only affect the scripting engine''s standard
    input and output sources. For example, if you execute the JavaScript code


    ```

    print(''Hello'');

    java.lang.System.out.println(''World'');

    ```


    only the first output is redirected.


    > Note

    nThe Rhino engine does not have the notion of a standard input source.

    Calling setReader has no effect.


    > Note

    In JavaScript, semicolons at the end of a line are optional. Many JavaScript programmers
    put them in anyway, but in this chapter, I omit them so you can more easily distinguish
    between Java and JavaScript code snippets.

    For the same reason, I use ''...'', not "...", for JavaScript strings whenever
    possible.'
