  md: '# 7. Collections


    Many data structures have been developed so programmers can store and retrieve
    values efficiently. The Java API provides implementations of common data structures
    and algorithms, as well as a framework to organize them. In this chapter, you
    will learn how to work with lists, sets, maps, and other collections.

    The key points of this chapter are:


    +   1. The Collection interface provides common methods for all collections, except
    for maps which are described by the Map interface.

    2. A list is a sequential collection in which each element has an integer index.

    3. A set is optimized for efficient containment testing. Java provides HashSet
    and TreeSet implementations.

    4. For maps, you have the choice between HashMap and TreeMap implementations.
    A LinkedHashMap retains insertion order.

    5. The Collection interface and Collections class provide many useful algorithms:
    set operations, searching, sorting, shuffling, and more.

    6. Views provide access to data stored elsewhere using the standard collection
    interfaces.


    # 7.1. An Overview of the Collections Framework


    The Java collections framework provides implementations of common data structures.
    To make it easy to write code that is independent of the choice of data structures,
    the collections framework provides a number of common interfaces, shown in Figure
    7.1. The fundamental interface is Collection whose methods are shown in Table
    7.1.'
