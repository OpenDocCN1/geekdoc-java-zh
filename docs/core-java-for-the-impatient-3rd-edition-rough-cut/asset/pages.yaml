    When creating a JAR file, you can optionally specify a version number. Use the
    --module-version argument, and also add @ and the version number to the JAR name:


    ```

    jar -c -v -f com.horstmann.greet@1.0.jar --module-version 1.0 -C com.horstmann.greet
    .

    ```


    As already discussed, the version number is not used by the Java Platform Module
    System for resolving modules, but it can be queried by other tools and frameworks.


    # Note


    > You can find the version number through the reflection API. In our example:


    Optional<String> version =

    Greeter.class.getModule().getDescriptor().rawVersion();


    yields an Optional containing the version string "1.0".


    # Note


    > The module equivalent to a class loader is a layer. The Java Platform Module
    System loads the JDK modules and application modules into the boot layer. A program
    can load other modules, using the layer API (which is not covered in this book).
    Such a program may choose to take module versions into account. Is is expected
    that developers of programs such as Java EE application servers make use of the
