    # ### 1.3.1. Variable Declarations


    Java is a strongly typed language. Each variable can only hold values of a specific
    type. When you declare a variable, you specify the type, the name, and an optional
    initial value. For example


    ```

    int total = 0;

    ```


    You can declare multiple variables of the same type in a single statement:


    ```

    int total = 0, count; // count is an uninitialized integer

    ```


    Most Java programmers prefer to use separate declarations for each variable. Consider
    this variable declaration:


    ```

    Random generator = new Random();

    ```


    Here, the name of the object''s class occurs twice. The first `Random` is the
    type of the variable `generator`. The second `Random` is a part of the new expression
    for constructing an object of that class.


    To avoid this repetition, you can declare a variable with the `var` keyword:


    ```

    var generator = new Random();

    ```


    Then the type of the variable is the type of the expression with which the variable
    is initialized. In this example, `generator` is a variable of type Random.'
