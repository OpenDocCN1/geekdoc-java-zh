  md: '# 10. Concurrent Programming


    Java was one of the first mainstream programming languages with built-in support
    for concurrent programming. Early Java programmers were enthusiastic about how
    easy it was to load images in background threads or implement a web server that
    serves multiple requests concurrently. At the time, the focus was on keeping a
    processor busy while some tasks spend their time waiting for the network. Nowadays,
    most computers have multiple processors or cores, and programmers worry about
    keeping them all.


    In this chapter, you will learn how to divide computations into concurrent tasks
    and how to execute them safely. My focus is on the needs of application programmers,
    not system programmers who write web servers or middleware.


    For that reason, I arranged the information in this chapter so that I can, as
    much as possible, first show you the tools that you should be using in your work.
    I cover the low-level constructs later in the chapter. It is useful to know about
    these low-level details that you get a feel for the costs of certain operations.
    But it is best to leave low-level thread programming to the experts. If you want
    to become one of them, I highly recommend the excellent book Java Concurrency
    in Practice by Brian Goetz et al. [Addison-Wesley, 2006].


    The key points of this chapter are:


    +   1. A Runnable describes a task that can be executed asynchronously but does
    not return a result.

    2. An ExecutorService schedules tasks instances for execution.

    3. A Callable describes a task that can be executed asynchronously and yields
    a result.

    4. You can submit one or more Callable instances to an ExecutorService and combine
    the results when they are available.

    5. When multiple threads operate on shared data without synchronization, the result
    is unpredictable.'
