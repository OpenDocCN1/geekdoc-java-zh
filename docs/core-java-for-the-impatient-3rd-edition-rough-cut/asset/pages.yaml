    # 3.8.3. Comparator Methods


    The Comparator interface has number of useful static methods that are higher-order
    functions generating comparators. The comparing method takes a “key extractor”
    function that maps a type T to a comparable type (such as String). The function
    is applied to the objects to be compared, and the comparison is made on the returned
    keys. For example, suppose a Person class has a method getLast. Then you can sort
    an array of Person objects by last name like this:


    ```

    Arrays.sort(people, Comparator.comparing(Person::getLast));

    ```


    You can chain comparators with the thenComparing method to break ties. For example,
    sort an array of people by last name, then use the first name for people with
    the last name:


    ```

    Arrays.sort(people, Comparator.comparing(Person::getLast).thenComparing(Person::getFirst));

    ```


    There are a few variations of these methods. You can specify a comparator to be
    used for the keys that the comparing and thenComparing methods extract. For example,
    here we sort people by the length of their names:


    ```

    Arrays.sort(people, Comparator.comparing(Person::getLast,(s, t) -> s.length()
    - t.length()));

    ```'
