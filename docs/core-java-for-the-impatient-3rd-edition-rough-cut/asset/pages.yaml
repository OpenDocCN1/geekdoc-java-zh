    A random-access file has a file pointer that indicates the position of the next
    byte to be read or written. The seek method sets the file pointer to an arbitrary
    byte position within the file. The argument is a long integer between zero and
    the length of the file (which you can obtain with the length method). The getFilePointer
    method returns the current position of the file pointer.


    The RandomAccessFile class implements the DataInput and DataOutput interfaces.
    To read and write numbers from a random-access file, use methods such as readInt/writeInt
    that you saw in the preceding section. For example,


    ```

    int value = readInt();

    file.seek(file.getFilePointer() - 4);

    file.writeInt(value + 1);

    ```


