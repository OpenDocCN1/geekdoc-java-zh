    # 9.4.5. Splitting along Delimiters


    Sometimes, you want to break an input along matched delimiters and keep everything
    else. The Pattern.split method automates this task. You obtain an array of strings,
    with the delimiters removed:


    ```

    String input = ...;

    Pattern commas = Pattern.compile("\s*,\s*\*");

    String[] tokens = commas.split(input);

    // "1", "2", "3" turns into ["1", "2", "3"]

    ```


    If there are many tokens, you can fetch them lazily:


    ```

    Stream<String> tokens =

    commas.splitAsStream(input);

    ```


    If you don''t care about precomp the pattern or lazy fetching, you can just use
    the String.split method:


    ```

    String[] tokens = input.split("\s*,\s*\*");

    ```


    If the input is in a file, use a scanner:


    ```

    var in = new Scanner(path, StandardCharsets.UTF_8);

    in.useDelimiter("\s*,\s*\*");

    ```'
