    +   3. The WildcardType interface, describing wildcards (such as ?nsuper T)


    +   4. The ParameterizedType interface, describing generic class or

    interface types (such as Comparable<? super T)


    +   5. The GenericArrayType interface, describing generic arrays (such

    as T[])


    Note that the last four subtypes are interfaces—the virtual machine

    instantiates suitable classes that implement these interfaces.


    Both classes and methods can have type variables. Technically speaking,

