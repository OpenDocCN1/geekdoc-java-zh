  md: "# 1.7.5. Local Variable Scope\n\nNow that you have seen examples of nested\
    \ blocks, it is a good idea to go over the rules for variable scope. A local variable\
    \ is any variable that is declared in a method, including the method's parameter\
    \ variables. The scope of a variable is the part of the program where you can\
    \ access the variable. The scope of a local variable extends from the point where\
    \ it is declared to the end of the enclosing block.\n\n```\nwhile (...) {\n  \
    \  System.out.println(...);\n    String input = in.next(); // Scope of input starts\n\
    here\n    ...\n    // Scope of input ends here\n}\n```\n\nIn other words, a new\
    \ copy of input is created for each loop iteration, and the variable does not\
    \ exist outside the loop.\n\nThe scope of a parameter variable is the entire method.\n\
    \n```\npublic static void main(String[] args) { // Scope of\\ args starts here\n\
    \    ...\n    // Scope of args ends here\n}\n```\n\nHere is a situation where\
    \ you need to understand scope rules. This loop counts how many times it takes\
    \ to get a particular random digit:\n\n```\nint count = 0;\nint next;\ndo {\n\
