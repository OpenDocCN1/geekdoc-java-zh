  md: 'In fact, all methods of the LocalDate class are acceptors. This situation is
    increasingly common because mutation can be risky, particularly if two computations
    mutate an object simultaneously. Nowadays, most computers have multiple processing
    units, and safe concurrent access is a serious issue. One way to address this
    issue is to make objects immutable by providing only accessor methods.


    Still, there are many situations where mutation is desirable. The add method of
    the ArrayList class is an example of a mutator. After calling add, the array list
    object is changed.


    ```

    var friends = new ArrayList<String>();

    // friends is empty

    friends.add("Peter");

    // friends has size 1

    ```


    # 2.1.2. Object References


    In some programming languages (such as C++), a variable can actually hold the
    object—that is, the bits that make up the object''s state. In Java, that is not
    the case. A variable can only hold a reference to an object. The actual object
    is elsewhere, and the reference is some implementation-dependent way of locating
    the object (see Figure 2.1).


    # Note


    > References behave like pointers in C and C++, except that they are perfectly
    safe. In C and C++, you can modify pointers and use them to overwrite arbitrary
    memory locations. With a Java reference, you can only access a specific object.'
