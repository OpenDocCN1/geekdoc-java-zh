    # # 5.3. Logging


    Every Java programmer is familiar with the process of inserting System.out.println
    calls into troublesome code to gain insight into program behavior. Once, if you
    have figured out the cause of trouble, you remove the print statements—only to
    put them back in the next problem surfaces. Logging frameworks are designed to
    overcome this problem.


    # # 5.3.1. Should You Use the Java Logging Framework?


    Java has a standard logging framework, usually called after its package name java.util.logging,
    and sometimes abbreviated as j.u.l. However, other logging frameworks have more
    features and are in common use, such as Log4j (https://logging.apache.org/log4j/2.x/)
    and Logback (https://logback.qos.ch/).


    If you want to give users of your code the choice of logging framework, then you
    should use a “facade” library that sends log messages to the preferred framework.
    A commonly used façade with a pleasant API is SLF4J (https://www.slf4j.org/).
    Another façade is the “platform logging API” (also known as JEP 246). It is very
    basic but a part of the JDK. The façade is sometimes called the frontend. It provides
    the API that programmers use to'
