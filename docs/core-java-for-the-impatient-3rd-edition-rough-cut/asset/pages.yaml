    # 14.2. The Scripting API


    A scripting language is a language that avoids the usual edit/compile/link/run
    cycle by interpreting the program at runtime. This encourages experimentation.
    Also, scripting languages tend to be less complex, which makes them suitable as
    extension languages for expert users of your programs.


    The scripting API lets you combine the advantages of scripting and traditional
    languages. It enables you to invoke scripts written in JavaScript, Groovy, Ruby,
    and even languages such as Scheme and Haskell, from a Java program. In the following
    sections, you will see how to select an engine for a particular language, how
    to execute scripts, and how to take advantage of advanced features that some scripting
    engines offer.


    # 14.2.1. Getting a Scripting Engine


    A scripting engine is a library that can execute scripts in a particular language.
    When the virtual machine starts, it discovers the available scripting engines.
    To enumerate them, construct ScriptEngineManager and invoke the getEngineFactories
    method.


    Usually, you know which engine you need, and you can simply request it by name.
    For example:


    ```

    var manager = new ScriptEngineManager();

    ScriptEngine engine =

    nmanager.getEngineByName("javascript");

    ```'
