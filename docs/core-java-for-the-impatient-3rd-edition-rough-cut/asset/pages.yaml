  md: '# 15.7. Modular JARs


    So far, we have simply compiled modules into the directory tree of the source
    code. Clearly, that is not satisfactory for deployment. Instead, a module can
    be deployed by placing all its classes in a JAR file, with a `module-info.class`
    in the root. Such a JAR file is called a _modular JAR.


    To create a modular JAR file, use the `jar` tool in the usual way. If you have
    multiple packages, it is best to compile with the `-d` option which places classes
    into a separate directory. The directory is created if it doesn''t exist already.
    Then use the `-C` option of the `jar` command to change to that directory when
    collecting files.


    ```

    javac -d modules/com.horstmann.greet `find com.horstmann.greet -name *.java`

    jar -cvf com.horstmann.greet.jar -C modules/com.horstmann.greet .`

    ```


    If you use a build tool like Maven, Ant, or Gradle, just keep building your JAR
    file as you always do. As long as `module-info.class` is included, you get a modular
    JAR.


    Then you can include the modular JAR in the module path, and the module will be
    loaded.


    # Caution


    > In the past, the classes of a package were sometimes distributed over multiple
    JAR files. (Such a package is called a "split package.") This probably never had
    a good idea, and it is not possible with modules.


    As with regular JAR files, you can specify a main class in a modular JAR:


    ```

    javac -p com.horstmann.greet.jar -d modules/ch15.sec05 `find ch15.sec05 -name
    *.java`

    jar -c -v f ch15.sec05.jar -e com.horstmann.hello.HelloWorld -C modules/ch15.sec05
    .

    ```'
