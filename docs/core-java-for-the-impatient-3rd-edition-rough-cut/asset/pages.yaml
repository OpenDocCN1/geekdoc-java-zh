  md: '# 8. Streams


    Streams provide a view of data that lets you specify computations at a higher
    conceptual level than with collections. With a stream, you specify what you want
    to have done, not how to do it. You leave the scheduling of operations to the
    implementation. For example, suppose you want to compute the average of a certain
    property. You specify the source of data and the property, and the stream library
    can then optimize the computation, for example by using multiple threads for computing
    sums and counts and combining the results.


    The key points of this chapter are:


    +   1. Iterators imply a specific traversal strategy and prohibit efficient concurrent
    execution.


    +   2. You can create streams from collections, arrays, generators, or iterators.


    +   3. Use filter to select elements and map to transform elements.


    +   4. Other operations for transforming streams include limit, distinct, sorted.


    +   5. To obtain a result from a stream, use a reduction operator such as count,
    min, findFirst, or findAny. Some of these methods return an Optional value.


    +   6. The Optional type is intended as a safe alternative to working with null
    values. To use it safely, take advantage of the ifPresent or orElse methods.


    +   7. You can collect stream results in collections, arrays, strings, or maps.


    +   8. The groupingBy and partitioningBy methods of the Collectors class allow
    you to split the contents of a stream into groups, and to obtain a result for
    each group.'
