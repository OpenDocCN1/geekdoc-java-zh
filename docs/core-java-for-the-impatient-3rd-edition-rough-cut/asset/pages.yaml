  md: 'The characters ^ and $ match the beginning and end of input.


    If you need to have a literal. * + ? { | ( ) [ \ ^ $, precede it by a backslash.
    Inside a character class, you only need to escape [ \\ , provided you are careful
    about the positions of ] - ^. For example, []]- is a class containing all three
    of them.


    Alternatively, surround a string with \Q and \E. For example, \(\$0\.99\) and
    \Q($0.99)\E both match the string ($0.99).


    # Tip


    If you have a string that may contain some of the many special characters in the
    regular expression syntax, you can escape them all by calling Parse.quote(str).
    This simply surrounds the string with \Q and \E, but it takes care of the special
    case where str may contain \E.


