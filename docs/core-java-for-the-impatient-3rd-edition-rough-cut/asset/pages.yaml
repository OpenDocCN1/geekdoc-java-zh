  md: '+ 1). There are many operations that might be useful in practice, such as sum,
    product, string concatenation, maximum and minimum, set union and intersection.


    If you want to use reduction with parallel streams, the operation must be associative;
    It shouldn''t matter in which order you combine the elements. In math notation,
    (x op) op z must be equal to x op (y op z). An example of an operation that is
    not associative is subtraction. For example, (6–3)–2 ≠ 6–(3–2)


    Often, there is an identity e that e op x = x, and you can use that element as
    the start of the computation. For example, 0 is the identity for addition. Then
    call the second form of reduce:


    ```

    List<Integer> values = ...;

    Integer sum = values.stream().reduce(0, (x, y) -> x + y)

    // Computes 0 + v0 + v1 + v2 ...

    ```


    The identity value is returned if the stream is empty, and you no longer need
    to deal with the Optional class.


    Now suppose you have a stream of objects and want to form the sum of some property,
    such as all lengths in a stream of strings. You can''t use the simple form of
    reduce. It requires a function (T, T) -> T, with the same types for the parameters
    and the result. But in this situation, you have two types: The stream elements
    have type String, and the accumulated result is an integer. There is a form of
    reduce that can deal with this situation.


    First, you supply an “accumulator” function (total, word) -> total + word.length().
    That function is called repeatedly, forming the cumulative total. But when the
    computation is parallelized, there will be multiple computations of this kind,
    and you need to combine their results. You supply a second function for that purpose.
    The complete is


    ```

    int result = words.reduce(0,

    (total, word) -> total + word.length(),

    (total1, total2) -> total1 + total2);

    ```'
