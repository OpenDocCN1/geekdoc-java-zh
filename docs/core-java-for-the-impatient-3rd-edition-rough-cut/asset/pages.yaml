    # 1.5.6. Code Points and Code Units


    When Java was first created, it proudly embraced the Unicode standard that had
    been developed shortly before. The Unicode standard had been developed to solve
    a vexing issue of character encodings. Prior to Unicode, there were many incompatible
    character encodings. For English, there was near-universal agreement on the 7-bit
    ASCII standard that assigned codes between 0 and 127 to all English letters, the
    decimal digits, and many symbols. In Western Europe, ASCII was extended to an
    8-bit code that contained accented characters such as ä and é. But in Russia,
    ASCII was extended to hold Cyrillic characters in the positions 128 to 255. In
    Japan, a variable-length encoding was used to encode English and Japanese characters.
    Multiple incompatible encodings of Chinese characters were in common use. Exchanging
    files with different encodings was a major problem.


    Unicode set out to fix all by assigning each character in all of the writing systems
    ever devised a unique 16-bit code between 0 and 65535. In 1991, Unicode 1.0 was
    released, slightly less than half of the available 65536 code values. Java was
    designed from the ground up to use 16-bit Unicode characters, which was a major
    advantage over other programming languages that used 8-bit characters. But then
    something awkward happened. Turned out to be many more characters than previously
    estimated—mostly Chinese ideographs. This pushed Unicode well beyond a 16-bit
    code.


    Nowadays, Unicode requires 21 bits. Each Unicode value is called a code point
    and written as U+, followed by four or more hexadecimal digits. For example, the
    code point for the letter A is U+0041, and the mathematical symbol ℝ for the set
    of octonions (http://math.ucr.edu/home/baez/octonions) has code point U+1D546.


    There is an obvious way to represent code points, as int values, but it is clearly
    wasteful. Java uses a variable-length encoding, called UTF-16, that represents
    all “classic” Unicode characters with a single 16-bit value and the'
