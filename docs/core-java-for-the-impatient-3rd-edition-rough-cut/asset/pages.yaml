  md: '# 1.8.7. Array Algorithms


    The Arrays and Collections classes provide implementations of common algorithms
    for arrays and array lists. Here is how to fill an array or an array list:


    ```

    Arrays.fill(numbers, 0); // int[] array

    Collections.fill(friends, ""); // ArrayList<String>

    ```


    To sort an array or array list, use the sort method:


    ```

    Arrays.sort(names);

    Collections.sort(friends);

    ```


    # Note


    For arrays (but not array lists), you can use the parallelSort method that distributes
    the work over multiple processors if an array is large.


    The Arrays.toString method yields a string representation of an array. This is
    particularly useful to print an array for debugging.


    ```

    System.out.println(Arrays.toString(primes));

