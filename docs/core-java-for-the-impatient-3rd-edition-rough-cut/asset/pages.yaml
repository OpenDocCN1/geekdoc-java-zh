  md: 'Why wouldn''t it be visible? Modern compilers, virtual machines, and processors
    perform many optimizations. These optimizations assume that the code is sequential
    unless explicitly told otherwise.


    One optimization is caching of memory locations. We think of a memory location
    such as done bits somewhere in the transistors of a RAM chip. But RAM chips are
    slow—many times slower than modern processors. Therefore, a processor tries to
    hold the data that it needs in registers or an onboard memory cache, and eventually
    writes changes back to memory. This caching is simply indispensable for processor
    performance. There are operations for synchronizing cached copies, but they have
    a significant performance cost and are only issued when requested.


    Another optimization is instruction reordering. The compiler, the virtual machine,
    and the processor are allowed to change the order of instructions to speed up
    operations, provided it does not change the sequential semantics of the program.


    For example, consider a computation


    ```

    x = Something not involving y;

    y = Something not involving x;

    z = x + y;

    ```


    The first two steps must occur before the third, but they can occur in either
    order. A processor can (and often will) run the first two steps concurrently,
    or swap the order if the inputs to the second step are more quickly available.


    In our case, the loop


    ```

    while (!done) i++;

    ```


    can be reordered as


    ```

    if (!done) while (true) i++;

    ```


    since the loop body does not change the value of done.


    By default, optimizations assume that there are no concurrent memory accesses.
    If there are, the virtual machine needs to know, so that it can then emit processor
    instructions that inhibit improper reorderings.'
