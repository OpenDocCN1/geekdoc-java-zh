  md: 'is 23MB, whereas the runtime image of all JDK modules takes up 121MB. The entire
    application takes up 45MB, a fraction of the size of the JDK.


    This can be the basis of a useful tool for packaging an application. You would
    still need to produce file sets for multiple platforms and launch scripts for
    the application.


    # Note


    You can inspect the runtime image with the `jimage` command. However, the format
    is internal to the JVM, and runtime images are not meant to be generated or by
    other tools.


    Finally, the `jmod` tool builds and inspect the module files that are included
    with the JDK. When you look into the `jmods` directory inside the JDK, you will
    find a file with extension `jmod` for each module. There is no longer a `rt.jar`
    file.


    Like JAR files, these files contain class files. In addition, they can hold native
    code libraries, commands, header files, configuration files, and legal notices.
    The JMOD files use the ZIP format. You can inspect their contents with any ZIP
    tool.


    Unlike JAR files, JMOD files are only useful for linking; that is, for producing
    runtime images. There is no need for you to produce JMODs unless you also want
    to bundle binary files as native code libraries with your modules.


