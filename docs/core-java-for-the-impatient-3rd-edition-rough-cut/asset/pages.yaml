    # 4.5.3. Class Loaders


    Virtual machine instructions are stored in class files. Each class file contains
    the instructions for a single class or interface. A class file can be located
    on a file system, in a JAR file, at a remote location, or it can be dynamically
    constructed in memory. A class loader is responsible for loading the bytes and
    turning them into a class or interface in the virtual machine.


    The virtual machine loads class files on demand, starting with the class whose
    main method is invoked. That class will depend on other classes, such as java.lang.System
    and java.util.Scanner, which will be loaded together with the classes they depend
    on.


    When executing a program, at least three class loaders are involved.


    The bootstrap class loader loads the most fundamental Java library classes. It
    is a part of the virtual machine.


    The platform class loader loads other library classes. Unlike the classes loaded
    with the bootstrap class loader, platform class permissions can be configured
    with a security policy.


    The system class loader loads the application classes. It locates classes in the
    directories and JAR files on the class path and module path.


    > Caution

    In previous releases of the Oracle JDK, the platform and system class loaders
    were instances of the URLClassLoader. This is no longer the case. Some programmers
    used the getURL method to find the class path. Use System.getProperty("java.class.path")
    instead.


    You can load classes from a directory or JAR file that is not already on the class
    path, by creating your own URLClassLoader instance. This is commonly done to load
    plugins.'
