    interface. You can always assign an object to a variable whose type is an implemented
    interface, or pass it to a method expecting such an interface.


    Here is a bit of useful terminology. A type S is a supertype of the type T (the
    subtype) when value of the subtype can be assigned to a variable of the supertype
    without a conversion. For example, the IntSequence interface is a supertype of
    the DigitSequence class.


    # Note


