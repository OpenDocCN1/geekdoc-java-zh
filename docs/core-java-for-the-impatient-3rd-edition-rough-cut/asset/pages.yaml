  md: '# 12.1. The Time Line


    Historically, the fundamental time unit—the second—60×60 was derived from Earth’s
    rotation around its axis. There are 24 hours or 24 × 60 × 60 = 86400 seconds in
    a full revolution, so seems just a question of astronomical measurements to precisely
    define a second. Unfortunately, Earth wobbles slightly, and a more precise definition
    was needed. In 1967, a new precise definition of a second, matching the historical
    definition, was derived from an intrinsic property of atoms of caesium-133. Since
    then, a network of atomic clocks keeps the official time.


    Ever so, the official time keepers synchronize the absolute time with the rotation
    of Earth. At first, the official seconds were slightly adjusted, starting in 1972,
    “leap seconds” were occasionally inserted. (In theory, a second might need to
    be removed once in a while, but that has not yet happened.) There talk of changing
    the system again. Clearly, leap seconds are a pain, and many computers systems
    use “smoothing” where time is artificially slowed down or speed up just before
    the leap, keeping 86,400 seconds per day. This works because the local time on
    a computer isn’t all that precise, and computers are used to synchronizing themselves
    with an external time service.


    The Java Date and Time API specification requires that Java uses a time scale
    that:


    +   - Has 86,400 seconds per day

    - Exactly matches the official time at noon each day

    - Closely matches it elsewhere, in a precisely defined way


    That gives Java the flexibility to adjust to changes in the official time.


    In Java, an `Instant` represents a point on the time line. An origin, called the
    *epoch*, is arbitrarily set at midnight of January 1, 1970 at the prime meridian
    that passes through the Greenwich Royal Observatory in London. This is the same
    convention used in the Unix/POSIX time. Starting from that origin, time is measured
    in 86,400 seconds per day, forwards and backwards, to nanosecond precision. The
    `Instant` values go back as far as a billion years (`Instant.MIN`). That’s not
    enough to express the age of the Universe (around 13.5 billion years), but it
    should be enough for all practical purposes. After all, a billion years ago, the
    Earth was covered in ice and populated by'
  merge: -1
  pgno: 569
- img_proc: true
  md: 'microscopic ancestors of today’s plants and animals. The largest value, Instant.MAX,
    is December 31 of the year 1,000,000,000.


    The static method call Instant.now() gives the current instant. You can compare
    two instants with the equals and compareTo methods in the usual way, so you can
    use instants as timestamps.


    To find out the difference between two instants, use the static method Duration.between.
    For example, here is how you can measure the running time of an algorithm:


    ```

    Instant start = Instant.now();

    runAlgorithm();

    Instant end = Instant.now();

    Duration timeElapsed = Duration.between(start, end);

    long millis = timeElapsed.toMillis();

    ```


    A Duration is the amount of time between two instants. You can get the length
    of a Duration in conventional units by calling toNanos, toMillis, toSeconds, toMinutes,
    toHours, or Days.


    Conversely, you can obtain a duration with one of the static methods ofNanos,
    ofMillis, ofSeconds, ofMinutes, ofHours, ofDays:


    ```

    Duration oneWeek = Duration.ofDays(7);

    long secondsPerWeek = oneWeek.toSeconds();

    ```


    Durations require more than a long for their internal storage. The number of instants
    is stored in a long, and the number of nanoseconds in an additional int. If you
    want to make computations to nanosecond accuracy, and you actually need the entire
    range of a Duration, you can use one of the methods in Table 12.1. Otherwise,
    you can just call toNanos and do your calculations with long values.


    # Note


    It takes almost 300 years of nanoseconds to overflow a long.'
