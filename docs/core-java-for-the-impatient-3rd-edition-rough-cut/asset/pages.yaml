    Sometimes one needs to put strings in order. The compareTo method tells you whether
    one string comes before another in dictionary order. The call


    ```

    first.compareTo(second);

    ```


    returns a negative integer (not necessarily -1) if first comes before second,
    a positive integer (not necessarily 1) if first comes after second, and 0 if they
    are equal.

    The strings are compared a character at a time, until one of them runs out of
