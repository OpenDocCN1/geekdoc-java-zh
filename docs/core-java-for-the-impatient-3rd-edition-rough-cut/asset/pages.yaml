  md: "See Chapter 14 for an example in which classes are compiled into memory and\
    \ then loaded.\n\n# 4.5.4. The Context Class Loader\n\nMost of the time you don't\
    \ have to worry about the class loading process. Classes are transparently loaded\
    \ as they are required by other classes. However, if a method loads classes dynamically,\
    \ and that method is called from a class that itself was loaded with another class\
    \ loader, then problems can arise. Here is a specific example.\n\n+   1. You provide\
    \ a utility class that is loaded by the system class loader, and it has a method\n\
    \n```\npublic class Util {\n    Object createInstance(String className) {\n  \
    \      Class<?> cl = Class.forName(className);\n        ...\n    }\\...\n}\n```\n\
    \n+   2. You load a plugin with another class loader that reads classes from a\
