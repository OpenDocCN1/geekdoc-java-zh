  md: "# ## 8.14. Parallel Streams\n\nStreams make it easy to parallelize bulk operations.\
    \ The process is mostly automatic, but you need to follow a few rules. First of\
    \ all, you must have a parallel stream. You can get a parallel stream from any\
    \ collection with the Collection.parallelStream() method:\n\n```\nStream<String>\
    \ parallelWords =\nwords.parallelStream();\n```\n\nMoreover, the parallel method\
    \ converts any sequential stream into a parallel one.\n\n```\nStream<String> parallelWords\
    \ =\nStream.of(wordArray).parallel();\n```\n\nAs long as the stream is in parallel\
    \ mode when the terminal method executes, all intermediate stream operations will\
    \ be parallelized.\n\nWhen stream operations run in parallel, the intent is that\
    \ the same result is returned as they had run serially. It is important that the\
    \ operations are stateless and can be executed in an arbitrary order.\n\nHere\
    \ is an example of something you cannot do. Suppose you want to count all short\
    \ words in a stream of strings:\n\n```\nvar shortWords = new int[12];\nwords.parallelStream().forEach(\n\
    \  s -> { if (s.length() < 12) shortWords[s.length()]++; });\n  // error race\
    \ condition!\nSystem.out.println(Arrays.toString(shortWords));\n```\n\nThis is\
    \ very, bad code. The function passed to forEach runs concurrently in multiple\
    \ threads, updating a shared array. As you will see in Chapter 10, that's a classic\
    \ race condition. If you run this program multiple times, you are quite likely\
    \ to get a different sequence of counts in each run—each of them wrong."
  merge: -1
