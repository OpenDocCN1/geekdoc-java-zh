- img_proc: true
  md: "It is your responsibility to ensure that any functions you pass to parallel\
    \ stream operations are safe to execute in parallel. The best way to do that is\
    \ to stay away from mutable state. In this example, you can safely parallelize\
    \ the computation if you group strings by length and count them.\n\n```\nMap<Integer,\
    \ Long> shortWordCounts\n= words.parallelStream()\n    .filter(s -> s.length()\
    \ < 12)\n    .collect(groupingBy(\n        String::length,\n        counting()));\n\
    ```\n\nBy default, streams that arise from ordered collections (arrays and lists),\
    \ from ranges, generators, and iterators, or from calling Stream.sorted(), are\
    \ ordered. Results are accumulated in the order of the original elements, and\
    \ are entirely predictable. If you run the same operations twice, you will get\
    \ exactly the same results.\n\nOrdering does not preclude efficient parallelization.\
    \ For example, when computing stream.map(fun), the stream is partitioned into\
    \ n segments, each of which is concurrently processed. Then the results are reassembled\
    \ in order.\n\nSome operations can be more effectively parallelized when the ordering\
    \ requirement is dropped. By calling the Stream.unordered method, you indicate\
    \ that you are not interested in ordering. One operation that can benefit from\
    \ this is Stream.distinct. On an ordered stream, distinct retains the first of\
    \ all equal elements. That impedes parallelization—the thread processing a segment\
    \ can't know which elements to discard until the preceding segment has been processed.\
    \ If it is acceptable to retain any of the unique elements, all segments can be\
    \ processed concurrently (using a shared set to track duplicates).\n\nYou can\
    \ also speed up the limit method by dropping ordering. If you want any n elements\
    \ from a stream and don't care which ones you get, call\n\n```\nStream<String>\
    \ sample =\nwords.parallelStream().unordered().limit(n);\n```"
