  md: '# Note


    Default methods put an end to the classic pattern of providing an interface and
    a companion class that implements most or all of its methods, such as Collection/AbstractCollection
    or WindowListener/WindowAdapter in the Java API. Nowadays you should just implement
    the methods in the interface.


    An important use for default methods is interface evolution. Consider for example
    the Collection interface that has been a part of Java for many years. Suppose
    that you back when, you provided a class


    ```

    public class Bag implements Collection

    ```


    Later, in Java 8, a stream method was added to the interface.


    Suppose the stream method was not a default method. Then the Bag class longer
    compiles since it doesn''t implement the new method. Adding a nondefault method
    to an interface is not source-compatible. However, if a program calls a nondefault
    method to an interface is binary-compatible.)


    But suppose you don''t recompile the class and simply use an old JAR file containing
    it. The class will still load, even with the missing method. Programs can still
    construct Bag instances, and nothing bad will happen. (Adding a method to an interface
    is calls the stream method on a Bag instance, an AbstractMethodError occurs.


    Making the method a default method solves both problems. The Bag class will again
    compile. And if the class is loaded without being recompiled and the stream method
