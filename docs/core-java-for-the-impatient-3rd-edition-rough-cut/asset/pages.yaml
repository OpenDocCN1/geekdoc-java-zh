  md: '# 9.4. Regular Expressions


    Regular expressions specify string patterns. Use them whenever you need to locate
    strings that match a particular pattern. For example, suppose you want to find
    hyperlinks in an HTML file. You need to look for strings of the pattern <href="...".
    But wait may be extra spaces, or the URL may be enclosed in single quotes. Regular
    expressions give you a precise syntax for specifying sequences of characters are
    legal matches.


    In the following sections, you will see the regular expression syntax used by
    the Java API, and how to put regular expressions to work.


    # 9.4.1. The Regular Expression Syntax


    In a regular expression, a character denotes itself unless it is one of the reserved
    characters


    +   * + ? { ( | ) [ ] $


    For example, the regular expression Java only matches the string Java.


    The symbol . matches any single character. For example, .a matches Java and data.


    The * indicates that the preceding constructs may be 0 or more times; for a +
    it is 1 or more times. A suffix of ? indicates that a construct is optional (0
    or 1 times). For example, be+s matches bee, bee and bees. You can specify other
    multiplicities with { } (see Table 9.4).


    A | denotes an alternative: .ooef matches beef or wolf. Note the parentheseswithout
    them, ooef would be the alternative between .oo and eef. parentheses are used
    for grouping—see Section 9.4.4.


    A character class is a set of character alternatives enclosed in brackets, such
    as [Jj], [0-9], [A-Za-z], or [0-9]. Inside a character class, the denotes a range
    (all characters whose Unicode values fall between the two bounds). However, a
    - that is the first or last character in a character class denotes itself. A ^
    as the first character in a character class denotes the complement (all characters
    except specified).


    There are many predefined character classes such as \d (digits) or \p{Sc} (Unicode
    currency symbols). See and .'
