  md: 'Assertions are a commonly used idiom of defensive programming. Suppose you
    are convinced that a particular property is fulfilled, and you rely on that property
    in your code. For example, you may be computing


    ```

    double y = Math.sqrt(x);

    ```


    You are certain that x is not negative. Still, you want to double-check rather
    than have "a number" floating-point values creep into your computation. You could,
    of course, throw an exception:


    ```

    if (x < 0) throw new IllegalStateException(x + " < 0");

    ```


    But this condition stays in the program, even after testing is complete, slowing
    it down. The assertion mechanism allows you to put in checks during testing and
    to have them automatically removed in the production code.


    # Note


    > In Java, assertions are intended as a debugging aid for validating internal
    assumptions, not as a mechanism for enforcing contracts. For example, if you want
    to report an inappropriate argument of a public method, don''t use an assertion
    but throw an IllegalArgumentException.


    # 5.2.1. Using Assertions


    There are two forms of the assertion statement in Java:


    ```

    assert condition;

    assert condition : expression;

    ```


    The assert statement evaluates the condition and throws an AssertionError if it
    is false. In the second form, the expression is turned into a string that becomes
    the message of the error object.


    # Note'
