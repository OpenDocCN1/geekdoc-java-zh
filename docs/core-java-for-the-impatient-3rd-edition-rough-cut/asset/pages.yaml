    # 9.5.2. Transient Instance Variables


    Certain instance variables should not be serialized—for example, database connections
    that are meaningless when an object is reconstituted. Also, when an object keeps
    a cache of values, it might be better to drop the cache and recompute it instead
    of storing it.


    To prevent an instance variable from being serialized, simply tag it with the
    transient modifier. Always mark instance variables as transient if they hold instances
    of nonserializable classes. Transient instance variables are skipped when objects
    are serialized.


