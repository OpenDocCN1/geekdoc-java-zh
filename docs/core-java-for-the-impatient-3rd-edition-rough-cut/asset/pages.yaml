    # 10.5.2. Blocking Queues


    One commonly used for coordinating work between tasks is a blocking queue. Producer
    tasks insert items into the queue, and consumer tasks retrieve them. The queue
    lets you hand over data from one task to another.


    When you try to add an element and the queue is currently full, or you try to
    remove an element when the queue is empty, the operation blocks. In this way,
    the queue balances the workload. If the producer runs slower than the consumer
    tasks, the consumers block while waiting for the results. If the producers run
    faster, the queue fills up until the consumers catch up.


    Table 10.3 shows the methods for blocking queues. The blocking queue methods fall
    into three categories that differ by the action they perform when the queue is
    full or empty. In addition to the blocking methods, there are methods that throw
    an exception when they don''t succeed, and methods that return with a failure
    indicator instead of throwing an exception if they cannot carry out their tasks.


