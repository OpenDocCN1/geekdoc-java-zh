    \n## 集合 (Sets)\n\n集合是不包含重复元素的集合。就像顺序数组列表不能有两个相同的索引一样，`Map` 也不能有两个相同的键。键形成了一个“集合”。然而，值并不形成集合，因为相同的值可能与多个键相关联——\"\
