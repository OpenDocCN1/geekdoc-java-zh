    # Chapter 3 — Elements of Java Programming


    # Strings


    We use strings frequently in our programs to conclude this chapter, I will explain,
    in simple terms, what a string actually is. In Java, a string represents a series
    of characters. For example, the string "Hello\u0027\u002 represents the five characters
    ''H'',''e'',''l'',''l'',''o''. A string can be entered as a series of characters
    delimited by double quotes (this is called a *string literal*) and its data type
    is String. A char literal has the char data type. A char literal is delimited
    by single quotes \ for example ''H''.


    A string is, in fact, an object which contains both data (some characters) and
    various methods. String methods include functions to find characters and substrings,
    to return a copy of the string in upper or lower case and return the length of
    the string. The first character in a string has the index 0. The last character
    in the string has an index given by the length of the string minus 1.


    Assuming the string contains the text, "Hello world". The expression, s.length(),
    would return a value of 11.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_55_0.png)


    # How Can a String Literal Have Methods?


    Earlier I explained that an int literal such as 500 is just a piece of data with
    no methods so I can''t write 500.toString(). I would need an Integer object in
    order to do that. So why it string literals have access to methods? For example,
    I can write "hello".toUpperCase() which will return the string "HELLO". This is
    because Java creates a String object when you assign a string literal to a variable.
    In fact, although string values such as "Hello" are *literals* they are not primitives.
    A primitive is a very simple piece of data such as a character. A string is a
    whole series of characters and can therefore be regarded as a relatively complex
    data type.


    This is how my code creates this string and assigns it to the int variable sLen:


    ```

    String s;

    int sLen;

    s = "Hello world";

    sLen = s.length();

    ```


    Below you can see I have passed the index values 0 and sLen-1 to the charAt()
    method (which returns a character at a given index) in order to find the first
    and last characters in'
  - '[PAGE 56]


    the string. A string is indexed from 0 (the first character) to the length of
    the string minus 1 (the last character):


    ```

    char c;

    char c2;

    \ = "Hello world";

    sLen = s.length();

    c = s.charAt(0); // c is now ''H''

    c2 = s.charAt(sLen-1); // c2 is now ''d''

    ```


    If I want to use a lowercase or uppercase version of the string, I need to call
    the toLowerCase() or toUpperCase() methods on the string object. These methods
    return a new string with all the characters changed to the specified case.


    ```

    lowercaseS = s.toLowerCase();

    uercaseS = s.toUpperCase();

    ```


    # Java Strings are Immutable


    Java strings are immutable which means that they cannot be modified. For example,
    when I call the toUpperCase() method on the string s, that string object is not
    set into uppercase. The string "HELLO WORLD", which is returned by the toUpperCase()
    method is a new string object. I assign to the variable upcases. The original
    string, s, remains unchanged: it still contains "Hello world".


    # Escape Characters


    Notice that when I display the output in the Strings sample program I use a slash
    character, \ in front of the double-quote character in order to display a double-quote.


    ```

    "\nIn lowercase, the string is \"" + lowercaseS + "\"

    ```


    If I don''t do that, Java thinks that the double-quote character is intended to
    be the end of the string literal. The slash \ tells Java that the character that
    follows it (such as " or n) should be treated specially: \n is treated as a newline
    character, " is a double-quote character.'
- md: "\n# Chapter 3 — Elements of Java Programming\n\nThese are the escape characters\
    \ recognised by Java strings:\n\n| Escape Character | Description |\n|---|---|\n\
    | \\t | Insert a tab in the text at this point. |\n| \\b | Insert a backspace\
    \ in the text at this point. |\n| \\n | Insert a newline in the text at this point.\
    \ |\n| \\r | Insert a carriage return in the text at this point. |\n| \\f | Insert\
    \ a form feed in the text at this point. |\n| \\' | Insert a single quote character\
    \ in the text at this point. |\n| \\\" | Insert a double quote character in the\
    \ text at this point. |\n| \\\\ | Insert a backslash character in the text at\
    \ this point. |\n\n# Chapter 4 – Object Orientation\n\nJava is an object oriented\
    \ programming language. In this chapter I'll explain what objects are, how they\
    \ are related to classes and why object orientation is useful.\n\nAlmost everything\
    \ you work with Java – from a string as \"Hello world\" to a treasure in an adventure\
    \ game – is wrapped inside an object that contains the data itself (for example,\
    \ the characters in a string or the description of a treasure) and the functions\
    \ 'methods' that can be used to manipulate data — such as, for example, a string\
    \ object's `toUpperCase()` method.\n\n# Primitives are Different\n\nAs've already\
    \ seen, primitives are exceptions to the rule 'everything in Java is an object'.\
    \ Primitives are simple pieces of data; they are not Java objects. However, primitives\
    \ may be 'wrapped up' inside Java objects so an int primitive may be wrapped up\
    \ inside an Integer object as explained in Chapter 3.\n\n# Classes and Objects\n\
    \nEach object you use is created from a 'class'. You can think of a class as a\
    \ blueprint that defines the data and the behavior (the methods) of an object.\n\
    \nLet's look at an example of a very simple definition. You define a class using\
    \ the class keyword. Here I have decided to call the class `Thing`. Notice that\
    \ the initial letter of the class name is capitalized. This is the normal convention\
    \ in Java and in many other programming languages. The class contains two string\
    \ variables, name and description. I have made these variables private by prefixing\
    \ their declarations with the private keyword:\n\n```\nprivate String name;\n\
    private String description;\n```\n\n# Chapter 4 — Object Orientation\n\nWhen variables\
    \ inside a class are private, any code outside the class is unable to access them.\
    \ In order to provide access to my private variables I have written these 'get'\
    \ and 'set' accessor methods:\n\n# Objects (Thing.java)\n\n```\npublic String\
    \ getName() {\n    return name;\n}\n\npublic void setName(String aName) {\n  \
    \  name = aName;\n}\n\npublic String getDescription() {\n    return description;\n\
    }\n\npublic void setDescription(String aDescription) {\n    description = aDescription;\n\
    }\n```\n\nIn Java, when you want to give a new value to a private variable, you\
    \ need to write a set accessor which, by tradition, uses the capitalized name\
    \ of the variable preceded by set. So a new value can be assigned to the name\
    \ variable, for example, using the setName() method.\n\nWhen you want to retrieve\
    \ the value of a private variable, you need to write a get accessor which, by\
    \ tradition, uses the capitalized name of the variable preceded by get. So the\
    \ value of the name variable is returned by the getName() method.\n\nEach class\
    \ should be created in a separate class file with the same name as the class.\
    \ So, for example, I have written the Thing class in a file named Thing.java.\n\
    \n![](img/8c3ac46909d3d5f277ec850365ee22ff_59_0.png)\n\n# Private Variables, Public\
    \ Methods\n\nIt is generally good practice to make variables private. By using\
    \ methods to access data you are able to control how much access is permitted\
    \ to your data and you may also write code in the methods to test that the data\
    \ is valid. If you create public variables, other programmers will have direct\
    \ access to them. If you want to prevent direct access at a later date, it will\
    \ be difficult to do so. But if you create public methods and private variables,\
    \ you can change the code of the methods to limit access, display error messages\
    \ or make other changes as required.\n\n# Chapter 4 — Object Orientation\n\nThis\
    \ is the completed Thing class:\n\n```\npackage myclasses;\n\npublic class Thing\
    \ {\n\n    private String name;\n    private String description;\n\n    public\
    \ Thing(String aName, String aDescription) {\n        // constructor\n       \
    \ name = aName;\n        description = aDescription;\n    }\n\n    public String\
    \ getName() {\n        return name;\n    }\n\n    public void setName(String aName)\
    \ {\n        name = aName;\n    }\n\n    public String getDescription() {\n  \
    \      return description;\n    }\n\n    public void setDescription(String aDescription)\
    \ {\n        description = aDescription;\n    }\n}\n```\n\n# A Class is the Blueprint\
    \ of an Object\n\nMy Thing class doesn't do anything. It is simply the 'blueprint'\
    \ of a Thing object. Before you can use an actual Thing object, you will have\
    \ to create it from the Thing class just as you would have to create an actual\
    \ car from a Car blueprint before you can drive it!\n\nThe Car blueprint and the\
    \ Thing class are the plans or designs which define what a Car or a Thing are.\
    \ From a single Car blueprint, a manufacturer may construct numerous car 'objects'.\
    \ From a single Thing class, a programmer may construct numerous Thing objects.\
    \ Given the class shown above, I can see that each object will have a string name\
    \ and a description along with get/set methods.\n\n# Chapter 4 — Object Orientation\n\
    \n# Constructors\n\nThe Thing class also has a constructor. A constructor is a\
    \ special method which, in Java, has the same name as the class and it is used\
    \ to initialize the fields (the variables).\n\n```java\npublic Thing(String aName,\
