    ```


    Unlike the interfaces we''ve looked previously, the Serializable interface contains
    no methods or data fields. By implementing the Serializable interface a class
    informs Java that it is available for serialization.


    If you attempt to serialize objects whose classes do not implement the Serializable
    interface, an exception of the type NotSerializableException will be thrown.


