    # Chapter 3 — Elements of Java Programming


    be related in some way – a package called calc might contain a number of source
    code files that do those calculations; a package called files might contain numerous
    methods that do some sort of file handling operations, and so on. In other words,
    packages define named libraries of reusable code.


    For a better example of how packages can be used to create logical groups of code
    files, load up the Adventure project. This is my first attempt at writing a text-based
    exploring game in Java. While most of the sample projects in this book are very
    short, this project will grow in size as we go through the book. It provides an
    example of a more complex Java project which will use a variety of coding techniques.


    Don’t worry much about the details of the code at the moment – I’ll explain how
    it works later on. For now it is sufficient to know that the project contains
    four packages. The default (unnamed) package contains the visual design (the main
    part of my project). Then there are three named packages: game, gameobjects and
    globals. Notice that the gameobjects package contains three code files: Actor.java,
    Room.java and Thing.java. These files are all related – they implement three ‘types’
    of object in the game.


    # Importing


    The code inside a named package cannot be used by code in other packages unless
    it is explicitly imported. If you look in the Game.java file of the Adventure1
    you’ll see that I have imported the Actor and Room classes like this:


    | Adventure1 (Game.java) |

    | import gameobjects.Actor; |

    | import gameobjects.Room; |


    Since a package may contain many different classes, it is often useful to import
    only the specific classes that your code requires as I have done here. Alternatively,
    you may use an asterisk to import all the classes in a single operation, like
    this:


    | import gameobjects.*; |


    The standard Java class library contains many classes and you will need to import
    these by adding the appropriate import statement (this statement may sometimes
    be added ‘automatically’ by an IDE such as NetBeans). For example, in the Game.java
    file I have imported everything from Java’s util package with this statement:


    | import java.util.*; |


