    \ finally {\n    if (out != null) {\n        System.out.println(\"Closing PrintWriter\"\
    );\n        out.close();\n    } else {\n        System.out.println(\"PrintWriter\
    \ not open\");\n    }\n}\n```\n\nWe will look more closely at files and streams\
    \ in the next chapter.\n\n## More On Exceptions\n\nThere are many subclasses of\
    \ the Exception class. I don’t list them all here because there are so many of\
    \ them and they are, in any case, already fully documented by Oracle. If you need\
    \ to trap specific exception types, refer to the documentation of all available\
    \ classes here: \n\nhttps://docs.oracle.com/javase/7/docs/api/java/lang/Exception.html\n\
    \nOracle also has online tutorial on Exceptions:\n\nhttp://docs.oracle.com/javase/tutorial/essential/exceptions/index.html\n\
    \n## Chapter 10 – Files and Serialization\n\nIn this chapter we shall look at\
    \ some ways of dealing with files on disk and reading and writing data to and\
    \ from files.\n\nWhether you are programming a spreadsheet, a word processor or\
    \ a game, you will, at some stage, need to read data from one place and write\
    \ it to another. There are, in fact, many ways of writing and reading data to\
    \ and from files using Java.\n\nThe PrintList project from Chapter 9 used a PrintWriter\
    \ object to save lines of text to a file. PrintWriter is one of a special-purposes\
    \ classes that write into text 'streams'. A stream can be thought of as a channel\
    \ that conducts data from a source and a destination – for example from memory\
    \ to disk or vice versa. Streams can be used to save data either in the form of\
    \ linear sequences of bytes or as well-defined structures representing objects\
    \ of various types. I will explain how to save and load complex objects shortly.\n\
    \nFirst though I want to look at random access files. These are structured files\
    \ that enable us locate data at precise positions. In older programming languages,\
    \ random access files provided the most common way of storing records of fixed\
    \ sizes – such as the records in a database.\n\n## Random Access Files\n\nWe first\
    \ came across the RandomAccessFile class in Chapter 7. You may recall that the\
    \ ReadFile sample program in that chapter created a RandomAccessFile object, file,\
    \ and we used the readline() method to read lines of text from that file:\n\n\
    ### ReadFile\n\n```java\nRandomAccessFile file = null;\nfile = new RandomAccessFile(pathname,\
    \ \"r\");\nint linecount = 0;\nString line = \"\";\nwhile ((line = file.readLine())\
    \ != null) {\n    linecount++;\n    ta.append(String.format(\"[%d] %s\\n\", linecount,\
    \ line));\n}\n```\n\n## Chapter 10 — Files and Serialization\n\nI've slightly\
    \ updated this program in the RAFile project. This new version illustrates one\
    \ of the key features of random-access files: the ability to find data by ‘seeking’\
    \ (moving file–pointer) to specific locations. If you seek to 0 that will move\
    \ the pointer.\n\n### File Pointers\n\nA file pointer is a marker that keeps track\
    \ of where the next read or write operation will occur. When you read or write\
    \ data, the pointer moves forward by the number of bytes processed. You can move\
    \ the pointer to any position in the file using the seek(long pos) method.\n\n\
    The getPointer() method returns the current position of the file pointer. This\
    \ is useful if you want to know how much data has been read or if you want to\
    \ return to a previous position.\n\nIn Java, the RandomAccessFile class provides\
    \ several methods for manipulating the file pointer. For example, seek(long pos)\
    \ moves the pointer to the specified byte, and skipBytes(int n) moves it forward\
    \ by the specified number of bytes.\n"
  mdcn: "\n\n## 第 9 章 — 通型与异常\n\n我还在末尾添加了一个非常通用的块，它将处理任何未被捕获的 `Exception` 对象。如果已经捕获了特定类型的异常（例如\
    \ `ArithmeticException` 或 `NumberFormatException`），则最后一个块将被跳过。\n\n然而，如果发生了其他类型的异常（我甚至没有想过的异常！），那么这个块将处理它。自然地，如果没有抛出异常，则没有任何\
    \ `catch` 块块将执行。\n\n## finally\n\n你还可以可选地提供一个 `finally` 区域，其中包含无论是否发生异常都将执行的代码。`finally`\
    \ 块通常用于“清理”某些资源。Oracle 提供了这个 `finally` 块示例，用于关闭 `PrintWriter` 对象（一种写入数据“流”的类——在本例中，是将文本保存到文件中），无论是否发生错误：\n\
    \n## WriteList\n\n```java\ntry {\n    System.out.println(\"Entering\" + \" \"\
    \ + \"try statement\");\n    out = new PrintWriter(new FileWriter(fileName));\n\
    \    for (int i = 0; i < SIZE; i++) {\n        System.out.println(\"Value at:\
    \ \" + i + \" = \" + list.get(i));\n    }\n} catch (IndexOutOfBoundsException\
    \ e) {\n    System.err.println(\"Caught IndexOutOfBoundsException: \" + e.getMessage());\n\
    } catch (IOException e) {\n    System.err.println(\"Caught IOException: \" + e.getMessage());\n\
    } finally {\n    if (out != null) {\n        System.out.println(\"Closing PrintWriter\"\
    );\n        out.close();\n    } else {\n        System.out.println(\"PrintWriter\
    \ not open\");\n    }\n}\n```\n\n我们将在下一章中更详细地查看文件和流。\n\n## 关于异常的更多信息\n\n`Exception`\
    \ 类有很多子类。我在这里没有列出所有的类，因为它们太多了，而且无论如何，它们已经由 Oracle 提供了充分文档。如果你需要捕获特定的异常类型，请参阅此处所有可用类的文档：\n\
    \nhttps://docs.oracle.com/javase/7/docs/api/java/lang/Exception.html\n\nOracle\
    \ 还提供了关于异常的在线教程：\n\nhttp://docs.oracle.com/javase/tutorial/essential/exceptions/index.html\n\
    \n## 第 10 章 — 文件与序列化\n\n在本章中，我们将查看处理磁盘上的文件以及在文件之间读写数据的一些方法。\n\n无论你是在编写电子表格、文字处理器还是游戏，你都会在某个阶段需要从一个地方读取数据并将其写入另一个地方。事实上，使用\
    \ Java 有许多方法读写文件数据。\n\n第 9 章的 `PrintList` 项目使用 `PrintWriter` 对象将文本行保存到文件中。`PrintWriter`\
    \ 是写入文本“流”的特殊用途类之一。流可以被看作是一个从源到目的地传输数据的通道——例如从内存到磁盘或反之。流可以以字节线性序列的形式，或作为表示各种类型对象的定义良好的结构来保存数据。我很快就会解释如何保存和加载复杂对象。\n\
    \n首先，我想查看随机访问文件。这些是结构化文件，允许我们在精确的位置定位数据。在旧的编程语言中，随机访问文件是存储固定大小记录的最常见方式——例如数据库中的记录。\n\
    \n## 随机访问文件\n\n我们首先在第 7 章遇到了 `RandomAccessFile` 类。你可能记得该章节中的 `ReadFile` 示例程序创建了一个\
    \ `RandomAccessFile` 对象 `file`，并且我们使用 `readline()` 方法从该文件中读取文本行：\n\n### ReadFile\n\
    \n```java\nRandomAccessFile file = null;\nfile = new RandomAccessFile(pathname,\
    \ \"r\");\nint linecount = 0;\nString line = \"\";\nwhile ((line = file.readLine())\
    \ != null) {\n    linecount++;\n    ta.append(String.format(\"[%d] %s\\n\", linecount,\
    \ line));\n}\n```\n\n## 第 10 章 — 文件与序列化\n\n我在 RAFile 项目中稍微更新了这个程序。这个新版本说明了随机访问文件的关键特性之一：通过“寻址”（移动文件指针）到特定位置来查找数据的能力。如果你\
    \ `seek` 到 0，它将移动指针。\n\n### 文件指针\n\n文件指针是一个标记，用于跟踪下一次读取或写入操作将发生的位置。当你读取或写入数据时，指针会根据处理处理的字节数向前移动。你可以使用\
    \ `seek(long pos)` 方法将指针移动到文件的任何位置。\n\n`getPointer()` 方法返回文件指针当前的位置。如果你想知道读取了多少数据，或者想返回到之前的位置，这非常有用。\n\
    \n在 Java 中，`RandomAccessFile` 类提供了几个方法来操作文件指针。例如，`seek(long pos)` 将指针移动到指定的字节处，而\
    \ `skipBytes(int n)` 将其向前移动指定的字节数。\n\n"
