    \ on four exits: n, w and e.\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_74_0.png)\n\
    \n# this and super\n\nSometimes you will see the keyword which refers to the current\
    \ object – the object that is being created. It is often omitted: this.name =\
    \ aName has exactly the same effect as the assignment name = aName. However, if\
    \ I had just named the parameter name instead of aName, then the keyword this\
    \ is required to remove the ambiguity: this.name = name.\n\nThe keyword super\
    \ is used in a similar manner to reference variables and methods in the superclass\
    \ – for example, the superclass’s constructor as we saw earlier, and again is\
    \ often used to remove the ambiguity between method with both the ancestor class\
    \ and the subclass. I will cover method overriding and overloading in detail in\
    \ chapter 9.\n\n# Chapter 5 – Tests and Operators\n\nYou will often need to change\
    \ and test values in your programs using operators so that the code can take different\
    \ actions in different circumstances. That's the subject of this chapter.\n\n\
    Frequently, in your programs, you will need to test if two variables have the\
    \ same or different values. Java provides ‘operators’ to help you do these tests.\
    \ In this chapter we'll discover how to use Java operators to write conditional\
    \ tests, modify the values of variables and do arithmetical calculations.\n\n\
    We've seen some operators already – for example, in the Hello/Args program in\
    \ Chapter 1, we used the equality operator (==) to test if the number of arguments\
    \ entered on the command line (args.length) equalled 0:\n\n```\nif (args.length\
    \ == 0)\n```\n\nWe used the multiplication (*) and addition (+) operators, as\
    \ well as the assignment (=) operator in the TaxCalc program from Chapter 3. You\
    \ may recall that, in that program, we multiplied the subtotal variable by the\
    \ TAXRATE constant and assigned the calculated value to the tax variable. The\
    \ values of the subtotal and tax variables were added together and the result\
    \ was assigned to the grandtotal variable:\n\n```\ntax = subtotal * TAXRATE;\n\
    grandtotal = subtotal + tax;\n```\n\nIn this chapter we will look at a number\
    \ of other operators.\n\n# Operators\n\nSo what exactly is an operator? Put simply,\
    \ operators are special symbols that are used to do operations such as addition\
    \ and multiplication of numbers.\n\n# Assignment\n\nOne of the most important\
    \ operators is the assignment operator, which assigns the value on its right to\
    \ a variable. Note the type of data assigned must be compatible with the type\
    \ of variable:\n\n```\nint IntVar = 10;\n```\n\n# Equality\n\nWhile one equals\
    \ sign = is used to assign a value, two equals signs == are used to test a condition.\
    \ You will find, in the EqualsOps sample a more complete example which tests a\
