  mdcn: "\n\n接口作为“契约”\n\n“接口”（interface）是类必须实现的代码定义：如果你愿意的话，它就是使用该接口的类必须遵守的“契约”。如果你有一份建造房子的合同，例如，合同本身并不是房子，但它确实规定了（在多或少的详细程度上）将建造什么，以及按照什么标准来建造房屋。\n\
    \n要查看实现某些接口的类示例，请看 `ArrayList` 类，它的声明如下：\n\n```\npublic class ArrayList<E> extends\
    \ AbstractList<E>\nimplements List<E>, RandomAccess, Cloneable, Serializable\n\
    ```\n\n每个类都可以自一个直接父类——在这里 `ArrayList` 继承自（extends）`AbstractList`。当一个类继承自另一个类（其父类）时，它会自动继承父类的行为——即方法。\n\
    \n除了“继承”之外，`ArrayList` 类还“实现”（implements）`List`、`RandomAccess`、`Cloneable` 和 `Serializable`。这些不是类，它们是接口。一个类只能继承另一个类，但可以实现多个接口。接口就像没有可执行代码的类定义。每个接口可以定义一组常量和方法，但它不提供这些方法的行为——即实际代码。\n\
    \n这意味着每当一个类实现接口时，它就有义务提供与接口定义的所有方法匹配的方法。例如，`ArrayList` 实现了 `List`接口，而 `List` 接口声明了\
    \ `size()`、`add()` 和 `remove()` 方法，`ArrayList` 就必须提供自己的 `size()`、`add()` 和 `remove()`\
    \ 方法。如果失败，将会报错。\n\n此外，每个实现 `List` 接口的类都必须提供自己的 `size()`、`add()` 和 `remove()` 方法。每个类可以用不同的方式实现这些方法。例如，`TreasureList`\
    \ 和 `BeerList` 类都可以实现 `List`接口。`List` 接口定义 `size()` 方法如下：\n\n```\nint size();\n\
    ```\n\n# 第8章 — 枚、接口和作用\n\n在该声明上方有一个注释块，记录了 `size()`：\n\n```\n/**\n * 返回此列表中元素的数量。如果此列表包含\n\
    \ * 多于 <tt>Integer.MAX_VALUE</tt> 个元素，则返回\n * <tt>integer.MAX_VALUE</tt>。\n *\
    \ @return 此列表中元素的数量\n */\n```\n\n# 查找类和接口代码\n\n你可能可以使用 IDE 的“搜索”工具来查找接口声明和文档。在\
    \ NetBeans 中，在我使用 `ArrayList` 的一个程序中，双击 `ArrayList` 进行选择，然后右键并选择 `Navigate|GoToSource`（导航|转到源代码）。这将带我进入\
    \ `ArrayList.java`。该类的声明显示它实现了 `List` 接口。右键点击 `List` 并再次选择 `Navigate|GoToSource`\
    \ 查看 `List.java`。\n\n这就是 `ArrayList` 类实现 `size()` 的方式：\n\n```\npublic int size()\
    \ {\n  return size;\n}\n```\n\n如果你搜索 `ArrayList.java` 的代码，你会发现 `size` 是一个私有的 `int`\
    \ 变量，它的值通过各种方法改变。例如，令人惊讶的是，`add()` 方法增加了 `size` 的值：\n\n```\nsize++;\n```\n\n如果你写一个\
    \ `TreasureList` 类，它可能实现 `size()` 来返回游戏中宝藏的数量，而 `BeerList` 类对 `size()` 的实现可能返回酿酒厂库存的加仑数。只要这两个类都按照\
    \ `List` 接口的要求实现 `size()` 并返回一个 `int` 值，它们就可以以任何喜欢的方式实现方法的行为。\n\n# 自定义接口\n\n让我们看看你如何编写自己的接口。假设你正在带领一个程序员团队开发游戏。该游戏定义了多种具有某种值的类。这些可以是从宝藏（Treasure）到分数（Score）任何东西。\n\
    \n问题是 `Treasure` 和 `Score` 类之间没有通过继承建立联系。`Treasure` 是 `Thing` 的后代，而 `Score` 除了两者都存储一个值之外，没有其他共同点，并且它们需要可以增加或减小该值数值的方法。\n\
    \n处理这个问题的一种方法是编写一个定义操作值所需方法的接口，然后让 `Treasure` 和 `Score` 类都实现它。在我的 `Interfaces`\
    \ 程序中，我在 `myinterfaces` 包的 `ValuableItem.java` 代码文件中定义了这个接口：\n\n| Interfaces (myinterfaces.ValuableItem.java)\
