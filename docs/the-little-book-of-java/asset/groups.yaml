    # Loading and Running a Program in NetBeans


    If you are using NetBeans, you can load a project from the source code archive
    just by selecting File, Open Project.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_11_0.png)


    Now navigate to the directory containing the NetBeans project file (this will
    be indicated by a little coffee-cup icon in the project-browse dialog) then select
    the project and click the Open Project button:


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_11_1.png)


    If you already have a open project in NetBeans the new project will be loaded
    beneath in the Projects window. To compile and run a project, first make sure
    the project is selected in the Projects window then select Run from the Run menu
    or press the green arrow-head button in the NetBeans toolbar


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_11_2.png)'
