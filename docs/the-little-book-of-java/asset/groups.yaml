    ## # 第一章 – 入门


    在用 Java 编程之前，你需要了解 Java 是什么，以及编写 Java 程序需要哪些工具。


    如果你已经安装了 Java 编辑器和编译器，并且知道如何运行和构建 Java 程序，那么你已经准备就绪。我在编写本书的代码时，使用的是 NetBeans IDE（集成开发环境）。即使你通常使用其他编辑器，我也建议使用
    NetBeans，以便以最简单的方式加载和运行我的程序。


    ![](img/8c3ac46909d3d5f277ec850365ee2ff_8_0.png)


    ## 什么是 Java？


    Java 是一种跨平台的面向对象的语言。你以 .java 结尾的文件编写高级人类可读的 Java 程序代码。Java 编译器会将这些文本转换为压缩的非人类可读字节码，字节码可以通过称为
    Java 虚拟机（JVM）的程序运行。任何能够运行 Java 虚拟机的操作系统（现在的大多数）都能运行你的 Java 字节码。这就是为什么 Java 程序在不同平台和操作系统之间具有高度的可移植性。

