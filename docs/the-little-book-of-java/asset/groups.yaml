    # Chapter 2 — First Steps in Java


    In fact, there may also be some ''comments'' – that is, text placed between /*
    */ and /* or placed after the // comments. Comments are ''inline documentation''
    and they are ignored by the Java compiler. As long as the actual Java code is
    the same as shown above, you are all ready to go.


    # Why Comments?


    It is a good idea to add comments to your programs to describe what each section
    is supposed to do. Java lets you insert multi-line comments between pairs of /*
    and */ delimiters, like this:


    ```

    /* This program displays the words "Hello world"

    on a new line */

    ```


    In addition to these multi-line comments, you may also add ''line comments'' that
    begin with two slash characters // and extend to the end of the current line.
    Line comments may either comment an entire line or any part of a line which may
    include code before the // characters. These are examples of line comments:


    ```

    // This is a full-line comment

    if (args.length ==){ // this is a part-line comment

    ```


    An IDE like NetBeans may automatically insert comments when it creates code files.
    You may edit or delete those comments without affecting the behavior of the code.


    The easiest way to run this program within NetBeans is by clicking the green arrow
    ''Run Project'' button or by selecting the Run Project item from the Run menu.
    All being well, you will now see the output from the program – that is, the text
    Hello world – displayed in the NetBeans Output window.


    # How to Load the Sample Projects in NetBeans


    If you are using NetBeans, you can load the projects from the source code archive
    one a time or you can create a ''project group'' so that all the projects can
    be loaded simultaneously.'
