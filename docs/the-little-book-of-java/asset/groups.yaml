    ![](img/8c3ac46909d3d5f277ec850365ee22ff_178_0.png)


    The diagram above shows a simplified view of the sort of tree-structured network
    of objects we may need to save. Here a game object contains a map (ArrayList)
    object and a player (Actor) object. The player has a sack which contains two treasures.
    The map contains three rooms each of which contain one treasure.


    Of course, as the game progresses, this ‘game state’ will change. The player may
    take more treasures and put some of them into the sack while dropping other treasures
    into different rooms. When the game is saved all complex relationships need to
    be saved. When it is reloaded, the saved state has to be restored. In a real game
    there would be far more treasures and rooms than I’ve shown here. At first sight,
    the problem of saving and restoring a game like that may look extremely difficult
    to solve.


    In fact, it turns out that I can save or ‘serialize’ the entire tree of objects
    simply by serializing the object at the root of the tree – here’s the game object
    – and all the other objects in the rest of the tree (here, every other object
    in the game – the map, the rooms, the treasures and so on) will be serialized
    automatically!'
