    # Chapter 3 — Elements of Java Programming


    The calculation is done in the same way in this command line program as the previous
    visual program. The only real difference is that this time the program reads input
    that was entered at the command prompt and displays the results in the form of
    a formatted string.


    The System class provides the in and out fields for reading and writing to from
    input. The in and out fields are ''streams'' of data. Think of them as storing
    the characters we need to read and write. We''ll look more closely at scanners
    in Chapter 10.


