    map.add(new Room(\n\"room4\", \"Dark cave\", 2, Direction.NOEXIT, Direction.NOEXIT,\
    \ 5));\nmap.add(new Room(\n\"room5\", \"Troll room\", 3, Direction.NOEXIT, 4,\
    \ Direction.NOEXIT));\n```\n\nLet's take this Room object as an example:\n\n```\n\
    new Room(\"room2\", \"Gold room\", 0, 4, Direction.NOEXIT, 3)\n```\n\nThis room\
    \ has a name, \"room2\", a description, \"Gold room\" and then four exits. The\
    \ North exit leads in, to the room at index 0 in the map (that is the room with\
    \ the name \"room0\"), the South exit leads to the room at index 4, the West exit\
    \ is marked by the constant Direction.NOEXIT to indicate that there is no room\
    \ in that direction, and the East exit leads to the room at index 3 in the map.\n\
    \nTo understand Direction.NOEXIT, look back at the definition of the Direction\
    \ enum. The NOEXIT is declared rather differently from all the others: NORTH,\
    \ SOUTH, EAST and WEST are just as items in a comma-separated list with no associated\
    \ data-types or values. But NOEXIT is declared as a static final int (that is,\
    \ an integer constant that 'belongs' to the Direction class):\n\n```\npublic static\
    \ final int NOEXIT = -1;\n```\n\nI can't use the identifiers NORTH, SOUTH, WEST\
    \ and EAST to initialize exits when creating Room objects because each of the\
    \ exit fields is an int, not a Direction. But I can use the NOEXIT constant to\
    \ initialize one of the exit fields because I have declared NOEXIT to be an int\
    \ and I have assigned it to the int value -1. I've chosen -1 because I can be\
    \ sure that no room in the map will have that index.\n\n## Chapter 8 — Enums,\
    \ Interfaces and Scope\n\n## The Enum Class\n\nIn some programming languages,\
    \ an enum is simply collections of names – constants that may, or not may, have\
    \ some associated value such as an integer. For example, this is how I might declare\
    \ an enum in the C language:\n\n```\nenum directions {\nNORTH, SOUTH, EAST, WEST\n\
    };\n```\n\nBy default, c assigns integer values to enum constants. Here NORTH\
    \ would be assigned 0, SOUTH would be assigned 1 and so on. At first sight, a\
    \ Java enum may look pretty much like a C. But in fact, when you create an enum\
    \ in Java you are actually defining a class that is a descendant of the Enum class.\n\
    \nYour enum (just like a regular class) is able to contain specifically typed\
    \ data items as the NOEXIT constant I added to my Direction enum. In fact, a Java\
    \ enum can even contain methods. The Oracle Java tutorial provides an example\
    \ of quite a complex enum Planet which has its own constructor, methods and variables.\n\
    \n## The Planet Enum\n\nIf you want to explore some of the more esoteric features\
    \ of Java enums, look at Oracle's sample code which I've copied into the Planet\
    \ project. To run this code, compile the program, from the command prompt, as\
    \ explained in Chapter 2 or (more simply) run it from an IDE such as NetBeans.\
    \ You should now have the compiled class file, Planet.class, in the Planet folder\
    \ beneath the \\classes folder. If your code archive is stored in the \\LittleBookOfJava\
    \ directory on the C:\\ drive, the full path (on Windows) will be: C:\\LittleBookOfJavaCode\\\
    Step08\\Planet\\build\\classes\n\nAt the command prompt enter this:\n\n```\njava\
    \ planet.Planet 175\n```\n\nThis passes the 175 to be run by the Planet program.\
    \ This is what is displayed:\n\n| Your weight on MERCURY is 66.107583 |\n| Your\
    \ weight on VENUS is 158.374842 |\n| Your weight on EARTH is 175.000000 |\n| Your\
    \ weight on MARS is 66.279007 |\n| Your weight on JUPITER is 442.847567 |\n| Your\
    \ weight on SATURN is 186.552719 |\n| Your weight on URANUS is 89.2263 |\n| Your\
    \ weight on NEPTUNE is 161.13 |\n\n## Complex Enums?\n\nWhile the kind of complex\
    \ enum implemented in the Planet project may have a use in special cases, many\
    \ programmers (myself included!) prefer to stick with the traditional type of\
    \ enum, broadly similar to those in C, which simply groups together to assist\
    \ in clarity.\n\n## Interfaces\n\nWe first come across interfaces in Chapter 6.\
    \ You may recall that I described an interface as being a sort of abstract class:\
    \ it defines the methods that a class must implement but it does not contain the\
    \ actual code. But be careful – Java also lets you define abstract classes which\
    \ are extended rather than implemented. See the section later in this chapter\
    \ describing abstract classes.\n\n![](img/8c3ac6909d3d5f277ec850365ee22ff_136_0.png)\n\
    \n## Extending, Interfaces and Scope\n\n## Extending and Implementing\n\nA class\
    \ may extend one other class and implement zero, one or more interfaces.\n\n```\n\
    class A\n    doSomething();\n    doSomethingElse();\n```\n\n```\ninterface Int1\n\
    \    doThis();\n    doThat();\n```\n\n```\ninterface Int2\n    doTheOther();\n\
    ```\n\n```\nclass B extends A implements Int1, Int2\n    inherits these...   \
    \         must implement these...\n    doSomething();          doThis();     \
    \     doTheOther();\n    doSomethingElse();      doThat();\n```\n\nThe diagram\
    \ above shows a simplified view of class, class B, which extends (so it is the\
    \ descendant) of class A and implements the two interfaces Int1 and Int2.\n\n\
    The class A contains the code of the methods doSomething() and doSomethingElse(),\
