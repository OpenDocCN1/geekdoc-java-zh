    ```


    This should create a compiled file AdventureGame.class. To run this now, enter
    java followed by the name of the compiled file (without the extension .class):


    ```

    java AdventureGame

    ```


    As long as the class that was compiled is not declared to be within a named package,
    this command should run the program.


