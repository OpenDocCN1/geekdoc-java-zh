    public class ArrayList<E> extends AbstractList<E>

    implements List<E>, RandomAccess, Cloneable, Serializable

    ```


    Each class can descend from one immediate parent class – here ArrayList descends
    from ‘extends’ the AbstractList. When one class descends from some other class
    (its superclass) it automatically inherits the behavior – the methods – from the
    superclass.


    In addition to ‘extending’, the ArrayList class also ‘implements’ List, RandomAccess,
    Cloneable and Serializable. These are not classes. They are interfaces. A class
    can extend only one other class but it can implement many interfaces. An interface
    is like the definition of a class without executable code. Each interface may
    define a set of constants and methods but it does not provide the behavior – the
    actual code – of those methods.


