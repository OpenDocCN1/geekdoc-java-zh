    # Chapter 2 — First Steps in Java


    # How to Load a Single Project


    To load a single project, select File | Open Project, then browse to the directory
    containing the project (e.g. C:\LittleBookOfJava\Step02), click the ''+'' icon
    to expand the directory and select a named project (e.g. HelloWorld).


    # How to Create a Project Group


    To create a group of projects stored beneath a directory, select File | Project
    Groups then click New Group. In the dialog, select Folder Of Projects, then click
    the Browse button. Find the folder containing the projects you wish to add to
    the default directory name, if you have unzipped the sample source code into it
    this will be a folder \LittleBookOfJavaCode. Select this folder and click Open.


    If necessary, edit the name field in the ''Create New Group'' dialog then click
    the Create Group button. You should now see all the projects beneath your selected
    folder shown in the Netbeans Projects panel.


    If you close the project group (File | Close All Projects) you can open it again
    by selecting File | Project Groups, highlighting the group name in the dialog
    and clicking Select Group.


    # How to Activate a Project in a Project Group


    When you want to compile and run a specific project in a group, highlight the
    project name in the Projects panel then click the Run Project button (the green
    arrowhead) and select the Run | Run Project menu item.


    # Running a Program from the Command Prompt


    If you want to run a Java program from the command window or Terminal in the \classes
    directory. This is the directory you need to open the directory that contains
    the \helloworld subdirectory (you can see in my code that helloworld is the name
    of the Java ''package'') — I''ll have more to say about packages later.


    To run the Java virtual machine – the tool that runs your Java programs, you need
    to enter java followed by the name of the package and class file (minus its extension).
    Here my class file is HelloWorld.class (that''s the compiled file that has been
    placed into the \helloworld subdirectory), so I have to enter this command:


    ```

    java helloworld/HelloWorld

    ```'
