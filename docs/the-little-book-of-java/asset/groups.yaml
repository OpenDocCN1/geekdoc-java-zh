    \    if (myIntVar == 1) {\n        textField2.setText(\"Yes!\");\n    } else {\n\
    \        textField2.setText(\"No!\");\n    }\n}\n```\n\nBut that is not what happens.\
    \ When textField1 is empty, the code following else is run – which is not what\
