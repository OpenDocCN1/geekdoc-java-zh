    \ to Super Implementation | Ctrl+P | Call Hierarchy |\n\n# Class Networks\n\n\
    In this chapter, we've learnt classes are used as the blueprints from which objects\
    \ are created and how a descendant class can inherit the features of an ancestor\
    \ class. In some types of application, it may be useful to have more than one\
    \ 'level' of descent so that class D inherits from class C; class C inherits from\
    \ class B; and class B inherits from class A.\n\nIt may also be useful to have\
    \ more than one 'line' of descent so both class B and class X descend from class\
    \ A, while class Y descend from class B. In this way, we can create complex networks\
    \ or 'family trees' of classes.\n\nI'll show a real example of a complex network\
    \ when I explain my Java game project which I will be developing in later chapters\
    \ and which is summarized in the Appendix.\n\nThe diagram below shows the network\
    \ of 'game objects' in the Adventure1 project. The Thing class has a name and\
    \ a description. The Actor class and the Room class both descend from the Thing\
    \ class, so Actor and Room objects will also have a name and a description.\n\n\
    The Actor class defines an interactive character (or the game player) and it adds\
