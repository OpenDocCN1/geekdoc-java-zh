    Fido\", \"a big smelly dog\", \"Woof!\", 10);\n```\n\n## 函数（Functions）或方法（Methods）\n\
    \n正如我在第 2 章中提到的，“方法”是面向对象语言中非面向对象（或“过程”）编程语言中通常被称为“函数”的术，尽管某些语言也使用“过程”（procedure）和“子程序”（subroutine）等术语。\n\
