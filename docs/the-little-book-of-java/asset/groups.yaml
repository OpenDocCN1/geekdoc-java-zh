    # Loading and Running Programs in Other IDEs


    If you are using another editor or IDE you need to check the developers'' documentation
    of that IDE in order to learn how to create projects and add Java code files.
    While my code should work equally well with all Java editors and IDEs, I do not
    provide any help or support for any IDE other than NetBeans So if you decide to
    use another IDE, you must be sure that you already know how to compile and run
    projects and how to add code files to that IDE. Alternatively, you may edit the
    code files in any Java-enabled editor and compile and run the code from the command
    prompt.


    # Loading Groups of Projects in NetBeans


    Since the code archive supplied with this book contains a great many projects
    you may prefer to load all the projects simultaneously and then switch from one
    to another by selecting a project in the Projects window. To load multiple projects
    you need to create a Project Group. This is how to do with the code archive.


    +   * Select File|Project Groups...

    * The Manage Groups dialog pops up.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_12_0.png)


    +   * Click New Group

    * Give the group a name such as ''JavaBook'''
