    The NOEXIT is declared rather differently from all the others: NORTH, SOUTH, EAST
    and WEST are just as items in a comma-separated list with no associated data-types
    or values. But NOEXIT is declared as a static final int (that is, an integer constant
    that ''belongs'' to the Direction class):


    ```

    public static final int NOEXIT = -1;

    ```


    I can''t use the identifiers NORTH, SOUTH, WEST and EAST to initialize exits when
    creating Room objects because each of the exit fields is an int, not a Direction.
    But I can use the NOEXIT constant to initialize one of the exit fields because
    I have declared NOEXIT to be an int and I have assigned it to the int value -1.
    I''ve chosen -1 because I can be sure that no room in the map will have that index.'
