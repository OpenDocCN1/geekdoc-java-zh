    # Multidimensional Arrays


    In the last chapter, we looked at simple linear arrays that contain simple lists
    of elements.

    in addition to linear arrays you can also create ''multidimensional arrays'' –
    that is, arrays of arrays. This sort of array poses a special challenge when you
    need to iterate over its elements. Before looking at this problem, we need to
    be clear on what a multidimensional array is.


    A simple linear array can be thought of a single row of elements indexed from
    0 to some upper limit, like a row of cells in a spreadsheet:


    | A | B | C | D | E |

    |---|---|---|---|---|---|n| 1 | 1 | 2 | 3 | 4 | 5 |


    A multidimensional array can have both rows and columns like a spreadsheet: one
    dimension stores the rows, the other dimension stores the columns (in fact, arrays
    can have more than two dimensions but for our purposes two are sufficient). Conceptually
    a two-dimensional array forms a sort of grid or matrix like the rows and columns
    in a spreadsheet:


    | A | B | C | D | E |

    |---|---|---|---|---|---|n| 1 | 1 | 2 | 3 | 4 | 5 |

    | 2 | 6 | 7 | 8 | 9 | 10 |

    | 3 | 11 | 12 | 13 | 14 | 15 |

    | 4 | 16 | 17 | 18 | 19 | 20 |


    You will find an example of a two-dimensional array in the Multidimensional/Array
    sample project. I declare an array variable grid and show that its are arrays
    of integers by putting the element type int before the variable name and two pairs
    of square brackets after the variable:


    ```

    int grid[][];

    ```


