    \ | byte[] |\n| [0] | 32 | byte |\n| [1] | 97 | byte |\n| [2] | 32 | byte |\n\
    | [3] | 99 | byte |\n| [4] | 108 | byte |\n| [5] | 111 | byte |\n| [6] | 117 |\
    \ byte |\n| [7] | 100 | byte |\n| [8] | | byte |\n| [9] | 10 | byte |\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_175_0.png)\n\
    \n## Debugging\n\nA detailed explanation of the debugging tools of any specific\
    \ IDE (such as NetBeans) is beyond the scope of this book. You should, take the\
    \ time to study your IDE's debugger in depth. Refer to your IDE's help documentation\
    \ or user guide for more information. Debugging is invaluable for understanding\
    \ how your programs work – or why they don't!\n\n## Streams\n\nMost of Java's\
    \ input/output tasks are handled by streams. A stream is nothing more than a flow\
    \ of bytes from one place to another. It doesn't have to be to and from disk.\
    \ It could be to and from some remote location on the Internet, for example. For\
    \ our purposes, however, we'll restrict our streams of data flowing between a\
    \ computer's memory and a disk.\n\nJava defines two important streams for disk\
    \ IO operations, FileInputStream and FileOutputStream each of which takes a string\
    \ representing a file name. Once a FileInputStream has been created, it can be\
