- md: "\n# Chapter 5 – Tests and Operators\n\nHowever, when I compare a string \"\
    1\" with another string \"1\" the test evaluates to false. In other words, Java\
    \ considers two integers with identical values to be the same but two strings\
    \ with identical values to be different.\n\n## String.equals()\n\nIn order to\
    \ determine if two strings contain identical characters (or no characters at all)\
    \ you need to use the equals() method of the string object. This is how I rewritten\
    \ my test (which now works as I intended):\n\n| EqualsOps |\n| :--- |\n| if (\"\
    \".equals(textField1.getText())) { textField2.setText(\"You must enter a number\
    \ into textField1.\");}|\n\n## String Equality\n\nLet's consider why two apparently\
    \ identical strings are considered to be different. It turns out that each string\
    \ occupies its own chunk of memory and it is, therefore, considered to be different\
    \ from every other string. Remember, in Java, an integer is a simple piece of\
    \ data – a primitive. But a string is an object – and every object is different\
    \ from every other object. This is true even when two strings contain exactly\
    \ the same characters.\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_79_0.png)\n\
    \n## Strings are Objects?\n\nNot all programming languages deal with strings this\
    \ way. Even the C# language which is, in many, very similar to Java, allows you\
    \ to test two strings using the regular == equality operator. In C#, when two\
    \ different strings contain the same characters, a test using the == operator,\
    \ returns true. In Java, it returns false. You have to bear in mind that Java\
    \ treats strings like any other objects. Two cat objects, catA and catB, both\
    \ have the same name, \"Tiddles\", but they are nevertheless two different objects.\
    \ Java treats string comparisons in the same way!\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_79_1.png)\n\
    \nLet's suppose you initialize two strings as follows:\n\n```java\nString s1 =\
    \ new String(\"Hello\");\nString s2 = new String(\"Hello\");\n```\n\nNow you compare\
    \ s1 and s2 using this test:\n\n```java\n(s1 == s2) // This evaluates to false\n\
    ```\n\nThe test evaluates to false because, even though the two strings contain\
    \ the same characters, s1 is a different string object (I've created each explicitly\
    \ using new) to s2. The same will be true of any string objects that are created\
    \ at runtime (for example, by assigning the text from a text field to a string\
    \ variable).\n\nHowever, when two identical strings are assigned to variables\
    \ (without creating new objects) they will reference (or 'point to') the same\
    \ string. That is because string literals created in your code before compiling\
    \ an application are saved into a 'table' of strings and any variable that is\
    \ assigned to that string will reference this stored value. As a consequence,\
    \ two variables such as below, which are assigned the same string will return\
    \ true when tested for equality using the == operator:\n\n| StringCompare |\n\
    | :--- |\n| String s1 = \"Hello\"; String s2 = \"Hello\"; |\n\n```java\n(s1 ==\
    \ s2) // This evaluates to true\n```\n\nThat is why Java strings have the equals()\
    \ method. This method compares the characters in two strings and return true if\
    \ those characters are the same.\n\n## Which is the ‘Best’ Way To Test Strings?\n\
    \nLook at the code in the StringCompare project to help you understand how strings\
    \ are compared in Java. If you find this confusing, just remember that in most\
    \ cases, it is not a good idea to compare strings using the == operator. You should,\
    \ instead, use the equals() method. Whereas the == operator returns different\
    \ results depending on how and when a string was assigned to a variable, the equals()\
    \ method is consistent in all cases.\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_80_0.png)\n\
    \n# Chapter 5 — Tests and Operators\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_81_0.png)\n\
    \nHere I run the StringCompare project, entered two identical strings into the\
    \ text fields and clicked the ‘Test1’ button to compare the strings using the\
    \ == operator and the equals() method.\n\nThe == operator returns false, indicating\
    \ that these are two different objects. The equals() method returns true indicating\
    \ that the two strings contain exactly the same characters.\n\n## Tests and Comparisons\n\
    \nJava can perform tests using the if statement. The test itself must be contained\
