    Chapter 8 — Enums, Interfaces and Scope


    # Assigning Values to enum Constants


    For another example of enum, take a look at the Adventure2 project (in the Adventure
    folder of the source code archive). This is a game with a simple user interface
    that provides buttons that can be clicked to move the player North, South, East
    and West. The code that handles these button-clicks calls the movePlayerTo() method
    of the game object. The game object is created from the Game class and it contains
    all the elements of a game including the map of rooms and the player. The important
    thing to notice is when I call the movePlayerTo() method I provide an argument
    such as Direction.NORTH or Direction.SOUTH. Giving a descriptive direction is
    much clearer than using an integer value, for example. Here Direction is defined
    in the Direction.java code file:


    Adventure2 (Direction.java)


    ```

    public enum Direction {

    NORTH,

    SOUTH,

    EAST,

    WEST;


    public static final int NOEXIT = -1;

    }

    ```


    # Compiling Adventure2


    When you run the Adventure2 project for the first time (or if you select (Run|Clean
    and Build Project in NetBeans you may see some warnings of an “unchecked call
    to add(E)”. That is because the map ArrayList in this project can hold any type
    of object and Java is reminding me that it would be safer if I created an ArrayList
    to hold only a specific type (here my map will only need to hold Room objects).
    If you look at the code of Adventure3 you''ll see that I have declared the ArrayList
    like this:


    ```

    private ArrayList<Room> map;

    ```


    When declared like this, the map ArrayList will only be able to store Room objects.
    Java can perform type-checking when I try to add an element to ensure that I don''
    accidentally add some other type of object. Adding type-checking to an ArrayList
    is an example of ‘generics’ which is explained in Chapter 9.


