  - '[PAGE 171]


    # Chapter 10 — Files and Serialization


    I''ve slightly updated this program in the RAFile project. This new version illustrates
    one of the key features of random-access files: the ability to find data by ‘seeking’
    (moving file–pointer) to specific locations. If you seek to 0 that will move the
    file pointer to the start of the file.


    # File Pointers


    A file pointer is not, as you might imagine, a pointer (the sort of memory reference)
    that is common in the C language but not in Java) directly into a file on disk.
    What is referred to as a ‘file pointer’ is, in fact, a piece of data that stores
    a position or ‘offset’ into a file. The JavaRandomAccessFile class has a getPointer()
    method which returns a long integer which represents an offset (a number of bytes)
    in a file at which the next read or write operation occurs. When programmers talking
    about ‘moving’ the file pointer, they really mean updating the stored offset –
    changing the ‘position’ which it refers to.


    If you have saved ‘chunks of data’ or ‘records’ each of a fixed size, you can
    locate the start of a specific record by seeking to an index multiplied by the
    size of the record. For example, if you have saved a set of records from an employee
    database, and the size of each record is given by the constant RECISIZE (which,
    for the sake of argument, we’ll suppose has the value 500 to show that each record
    takes up 500 bytes), you could seek to the record at index 5 like this:


    ```

    file.seek(5 * RECISIZE);

    ```


    In my example project, I am working with a plain text file – a file of characters.
    Each character has the the size of 1 byte – so I can seek to a specific character
    position, like this:


    RAFile

    file.seek(20);


    Now, from position 20, I can read in a specific number of bytes (where a byte
    is a piece of memory big enough to store a character). I’ve create a 20-byte array
    like this:


    ```

    byte[20] chars = new byte[20];

    ```'
  - '[PAGE 172]


    I read bytes into the chars array like this:


    ```

    bytesread = file.read(chars);

    ```


    Here bytesread is an int variable that is assigned the number of bytes that were
    read into the buffer. If I want to continue reading from where I left off, I can
    just add a new number (say 20) to the number of bytes that were read in previously
    (bytesread) in order to move the file pointer to this offset (20 bytes after the
    end of the bytes that were read previously):


    ```

    file.seek(20+bytesread);

    ```


    If there is no data to read then the value returned by the read() method will
    be -1 and I can test this in my code. For example, there are fewer than 1000 bytes
    in my short file if I attempt to read data from position 1000 the operation fails
    and -1 is returned. This code handles:


    ```

    RAFile(NewJFrame.java) - readFileBtnActionPerformed()

    file.seek(1000);

    bytesread = file.read(chars);

    if (bytesread == -1) {

    s = new String(chars);

    t.append("\nchars " + s);

    } else {

    t.append("\nEnd Of File!!! -- No more data to read!")

    }

    ```


    When I''ve finished with the file, I close it:


    ```

    file.close();

    ```


    When you close a file, any memory that was used in is cleaned up (in the jargon,
    any allocated resources are released) and the file is no longer available for
    reading and writing operations.


    If you want to run this program, make sure you have a text file called ''test.txt''
    in the C:/temp/ directory. If it is in some other directory, be sure to edit this
    line in the source code (note that forward ''/'' is the standard delimiter in
    Java):


    ```

    String pathName = "C:/temp/test.txt";

    ```'
