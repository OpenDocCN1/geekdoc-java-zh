    # Chapter 8 — Enums, Interfaces and Scope


    # The Enum Class


    In some programming languages, an enum is simply collections of names – constants
    that may, or not may, have some associated value such as an integer. For example,
    this is how I might declare an enum in the C language:


    ```

    enum directions {

    NORTH, SOUTH, EAST, WEST

    };

    ```


    By default, c assigns integer values to enum constants. Here NORTH would be assigned
    0, SOUTH would be assigned 1 and so on. At first sight, a Java enum may look pretty
    much like a C. But in fact, when you create an enum in Java you are actually defining
    a class that is a descendant of the Enum class.


    Your enum (just like a regular class) is able to contain specifically typed data
    items as the NOEXIT constant I added to my Direction enum. In fact, a Java enum
    can even contain methods. The Oracle Java tutorial provides an example of quite
    a complex enum Planet which has its own constructor, methods and variables.


    # The Planet Enum


    If you want to explore some of the more esoteric features of Java enums, look
    at Oracle''s sample code which I''ve copied into the Planet project. To run this
    code, compile the program, from the command prompt, as explained in Chapter 2
    or (more simply) run it from an IDE such as NetBeans. You should now have the
    compiled class file, Planet.class, in the Planet folder beneath the \classes folder.
    If your code archive is stored in the \LittleBookOfJava directory on the C:\ drive,
    the full path (on Windows) will be: C:\LittleBookOfJavaCode\Step08\Planet\build\classes


    At the command prompt enter this:


    ```

    java planet.Planet 175

    ```


    This passes the 175 to be run by the Planet program. This is what is displayed:


    | Your weight on MERCURY is 66.107583 |

    Your weight on VENUS is 158.374842 |

    Your weight on EARTH is 175.000000 |

    Your weight on MARS is 66.279007 |

    Your weight on JUPITER is 442.847567 |'
