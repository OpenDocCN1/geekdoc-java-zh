    # Chapter 2 — First Steps in Java


    The Java compiler would create a bytecode file called HelloWorld.class. In order
    to run that file I have to pass the file name (without the .class extension) to
    the Java ''interpreter''. This is the program that runs the bytecode inside the
    Java Virtual Machine. The Java interpreter is named java. So, in order to run
    the compiled file HelloWorld.class this is the command I would need to enter:


    ```

    java HelloWorld

