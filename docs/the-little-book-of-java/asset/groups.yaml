    \ — in this case, by saving text to a file) or not an error occurred:\n\n## WriteList\n\
    \n```java\ntry {\n    System.out.println(\"Entering\" + \" \" + \"try statement\"\
    );\n    out = new PrintWriter(new FileWriter(fileName));\n    for (int i = 0;\
    \ i < SIZE; i++) {\n        System.out.println(\"Value at: \" + i + \" = \" +\
    \ list.get(i));\n    }\n} catch (IndexOutOfBoundsException e) {\n    System.err.println(\"\
    Caught IndexOutOfBoundsException: \" + e.getMessage());\n} catch (IOException\
