  - "[PAGE 161]\n\n# Chapter 9 – Generics and Exceptions\n\nThe code is still valid\
    \ because when I call myTroll.saySomething() Java looks for a method with that\
    \ name and finds it in the ancestor class Monster. But, of course, that wasn't\
    \ my intention. My intention was that the ancestor I wrote in the Troll class\
    \ should be used – that it override the method with the same name in the Monster\
    \ class. My silly typing error (using the lowercase 's' instead of the uppercase\
    \ 'S' in something()) has caused a bug which, in a more complicated program, might\
    \ be very hard for me to find and fix.\n\n# @Override Annotation\n\nThere is a\
    \ simple trick to help me avoid the sort of problem that would result from accidentally\
    \ misnaming a method. When I intend one method to override another, I can place\
    \ the @Override annotation before that method.\n\nIn Java an annotation is an\
    \ intention to the compiler. The @Override annotation tells it to check that the\
    \ annotated method has successfully overridden a method with the same name in\
    \ its ancestor class. You may recall that I used @override in Chapter 8 when implementing\
    \ interfaces, to check that the methods were declared by an. In the current example,\
    \ I can place @Override above the method in my Troll class like this:\n\n```\n\
    public String saysothing() {\n    return \"Ugh, ugh, ugh!\\n\";\n}\n```\n\nNow\
    \ the compiler will compare this method with the methods in the ancestor class.\
    \ It will discover that there is no method with this name in the ancestor class\
    \ so the method cannot be overridden and an error occurs. In fact, your IDE may\
    \ also perform this check and it too may flag an error:\n\n| method does not override\
    \ or implement a method from a supertype |\n| --- |\n| (Alt-Enter shows hints)\
    \ |\n| @Override |\n| public String sayssomething() {\n| return \"Ugh, ugh, ugh!\\\
    n\";n| } |\n\n162"
- md: "\nNow I can fix this by capitalising the 'S' so that the method saySomething()\
    \ matches the method with the same name in the superclass and the error goes away:\n\
    \n```\n@Override\npublic String saySomething() {\n    return \"Ugh, ugh, ugh!\\\
    n\";\n}\n```\n\n## Overloading Methods\n\nDon't confuse method overiding with\
    \ method overloading. We first encountered overloaded methods back in Chapter\
    \ 4 when I mentioned that some Java classes have multiple methods with the same\
    \ name but with different signatures.\n\n## Method Signature\n\nA method signature\
    \ is the complete method declaration including its name and its parameters.\n\n\
    For example, the String class has several methods called indexOf(), each version\
    \ having a different set of parameters. The fact that the method signatures are\
    \ different means that Java is able to identify them as different methods, so\
    \ that indexOf(String str) is different from indexOf(String str, int fromIndex),\
    \ for example.\n\nSimilarly, a single class can have more than one constructor.\
    \ The Java JDK documentation for the String class lists numerous constructor each\
    \ of which defines a different set of arguments so that each constructor has a\
    \ unique signature:\n\n```\nString()\nString(byte[] bytes)\nString(byte[] ascii,\
    \ int hibyte, int offset, int count)\nString(byte[] bytes, int offset, int length,\
    \ String charsetName)\nString(byte[] bytes, int offset, int length, Charset charset)\n\
    String(byte[] bytes, String charsetName)\nString(byte[], Charset charset)\nString(char[])\
    \ value\nString(char[] value, int offset, count)\nString(int[] codePoints, int\
    \ offset, count)\nString(String original)\nString(StringBuilder buffer)\nString(StringBuilder\
    \ builder)\n```\n\n# Chapter 9 – Generics and Exceptions\n\nWhen two methods in\
    \ the same class have the same name but different signatures are said to be overloaded.\
    \ This is an example of an overloaded method:\n\n## Overriding (Troll.java)\n\n\
    ```\npublic class Troll extends Monster{\n    public String saySomething() {\n\
    \        return \"Ugh, ugh, ugh!\\n\";\n    }\n\n    public String saySomething(String\
    \ thingToSay) {\n        return \"Ugh, ugh, \" + thingToSay + \"!\\n\";\n    }\n\
    }\n```\n\nWhen I call the saySomething() with no arguments, the first of the two\
    \ methods with that name will be executed. If I call saySomething(\"I want to\
    \ be fed\") passing a single string argument, the second version of the method\
    \ will be used:\n\n```\noutputTA.append(myTroll.saySomething());\noutputTA.append(myTroll.saySomething(\"\
    I want to be fed\"));\n```\n\nThis displays:\n\n```\nUgh, ugh, ugh!\nUgh, ugh,\
    \ I want to be fed!\n```\n\n## Exceptions\n\nThere is one important problem I\
    \ have not yet considered in any depth of this book. Namely: bugs! Few programs\
    \ of any ambition are totally bug-free. What is more, even if your programs work\
    \ when you use them, there is always the risk that they will go wrong when someone\
    \ else uses them; because other people may not do all the things you expect them\
    \ to do. For example, in a calculator program, you may expect the user to enter\
    \ a number as 10 (the characters for one and zero) but in fact someone enters\
    \ a string as \"IO\" (the alphabetic letters, 'I' and 'O').\n\nIt is the program's\
    \ responsibility to assume that the end user, at some time or another, do stupid\
    \ things – things that could cause your program to produce incorrect results or\
    \ to crash. It is in your interests, therefore, to build into your code some means\
    \ of recovering from potential disaster. Exceptions can help.\n\nFor an example\
    \ of this, the TaxCalc project from Chapter 3. This prompted the user to use a\
    \ subtotal. It then used this to calculate the tax and the grand total (the subtotal\
    \ plus tax). But what would happen if the user entered some text that could not\
    \ be converted to a floating-point number by the parseDouble() method?\n\n## TaxCalc\n\
    \n```\nsubtotal = Double.parseDouble(subtotalTF.getText());\n```\n\nThis is what\
    \ would happen: a NumberFormatException would occur and you would see an error\
    \ message like this...\n\n> Exception in thread \"AWT-EventQueue-0\" java.lang.NumberFormatException:\
    \ For input string: \"ten\"\nat sun.min.misc.FloatingDecimal.readFormatString(FloatingDecimal.java:2043)\n\
    at sun.min.misc.FloatingDecimal.parseDouble(FloatingDecimal.java:110)\nat java.lang.Double.parseDouble(Double.Java:538)\n\
    \n![](img/8c3ac46909d3d5f277ec850365ee22ff_164_0.png)\n\nAn exception is an object.\
    \ When an error occurs at runtime, an instance of Java’s Exception classes, such\
    \ as NumberFormatException, is created. Your code can make use of this by catching\
    \ the exception object and accessing its properties and methods.\n\nLoad and run\
    \ the SafeTaxCalc project. Enter “IO” (letters ‘I’ and ‘O’), the numbers 1 and\
    \ 0) into the subtotal edit box at the top of the frame. Click the ‘Calculate’\
    \ button. An error message pops up telling you both the class of the exception\
    \ - NumberFormatException and the cause (“For input string “IO”).\n\nThe user\
    \ can now close the dialog and fix the error by entering a valid number into the\
    \ text box. Clearly this is more civilized behavior than entering the exception\
    \ unhandled as before:\n\n## Chapter 9 — Generics and Exceptions\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_165_0.png)\n\
    \nAn exception is an object. When an error occurs at runtime, an instance of Java’s\
    \ Exception classes, such as NumberFormatException, is created. Your code can\
    \ make use of this by catching the exception object and accessing its properties\
    \ and methods.\n\nLoad and run the SafeTaxCalc project. Enter “IO” (letters ‘I’\
    \ and ‘O’), the numbers 1 and 0) into the subtotal edit box at the top of the\
    \ frame. Click the ‘Calculate’ button. An error message pops up telling you both\
    \ the class of the exception - NumberFormatException and the cause (“For input\
    \ string “IO”).\n\nThe user can now close the dialog and fix the error by entering\
    \ a valid number into the text box. Clearly this is more civilized behavior than\
    \ entering the exception unhandled as before:\n\nLet’s look at how I handle this.\
    \ First, I create:\n\n```\ndouble TAXRATE = 0.2;\ndouble subtotal = 0.0;\ndouble\
    \ tax = 0.0;\ndouble grandtotal = 0.0;\nboolean no_error = true;\n```\n\nBetween\
    \ a pair of brackets, I use `try` block. If an exception occurs, the `catch` block\
