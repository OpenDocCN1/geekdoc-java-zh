    \ \"Hello\":\n\n```\nthis.setTitle(this.getTitle() + \"!\");\n```\n\n# Chapter\
    \ 3 — Elements of Java Programming\n\nIn this chapter we'll look at how different\
    \ types of data are categorised and how data items are assigned to variables.\
    \ When your programs do calculations or display some text, use data. The data\
    \ items have a data type. For example, to do calculations you may use integer\
