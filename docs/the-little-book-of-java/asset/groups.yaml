- md: "\n## Chapter 7 – Loops\n\nThis is the output:\n\n| one |\n| --- |\n| two |\n\
    | thtree |\n\n## while\n\nAs we've seen, for loops are useful when you have a\
    \ known number of elements to iterate through – from 0 to 4, say. But sometimes\
    \ you may not know in advance how many elements you need to process.\n\nFor example,\
    \ you might write some code to format the lines of text in a file. But each file\
    \ may contain a different number of lines so you cannot assume, in advance, that\
    \ there will be a specific number of lines to process. One way of dealing with\
    \ this problem is to use a while loop which continues to execute as long as some\
    \ test condition remains true. This is the syntax of a while loop:\n\n```\nwhile\
    \ (condition) {statements}\n```\n\nThere are some basic examples of while loops\
    \ in the WhileLoops sample program. Here we create an array, intarray, of five\
    \ integers and I use a while loop to count through the elements of that array\
    \ while the value of i is less than 5. Since i starts with the value of 0 this\
    \ loop would continue for ever unless the value of i is incremented so that the\
    \ test condition would eventually be met. That is what I do here:\n\n```\nint\
    \ intarray[] = {1, 2, 3, 4, 5};\nint i;\ni = 0;\nwhile (i < 5) {\n    System.out.printf(\"\
    %d\\n\", intarray[i]);\n    i++;\n}\n```\n\nYou need to be very careful to ensure\
    \ that every while loop has a test condition that will eventually evaluate to\
    \ false, otherwise you risk creating an endless loop, which is almost never a\
    \ good thing to do! You also need to be aware that sometimes a loop condition\
    \ may never be met – that is, may evaluate to false immediately so the code never\
    \ executes, as in this example:\n\n```\ni = 2;\nwhile (i < 2) {\n    System.out.printf(\"\
    %d\\n\", intray[i]);\n    i++;\n}\n```\n\nFor a more useful example of a while\
    \ loop in a ‘real life’ program, take a look at the ReadFile sample program. This\
    \ uses a RandomAccessFile object called file to read each line from a text file\
    \ using the readline() method until no more lines are available (when null is\
    \ returned). The total number of lines read is assigned to the int variable linecount.\n\
    \nThis program tries to read a file named ‘test.txt’ in the directory C:/temp.\
    \ If the file is not found an error message is displayed. But, if you create a\
    \ text file with name, it will read its contents. It displays each line (the string\
    \ variable line), preceded by its number, in a text area, ta. Finally, it displays\
    \ the number of lines read from the file. Let’s assume that the C:/temp/test.txt\
    \ contains these lines:\n\nThis is a file containing three lines of text!\n\n\
    This is what you will see when you click the ‘Read File’ button:\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_110_0.png)\n\
    \nThis program contains quite a bit of file-handling and error-recovery code which\
    \ we will learn about later chapters. For now, concentrate on the block of code\
    \ which shows how the while loop is used:\n\n## ReadFile\n\n```\nwhile ((line\
    \ = file.readLine()) != null) {\n    linecount++;\n    ta.append(String.format(\"\
    %d] %s\\n\", linecount, line));\n}\nta.append(\"\\nTotal lines in file = \" +\
    \ linecount);\n```\n\n## do...while\n\nIn some circumstances, you may want to\
    \ be certain that the code runs at least once — say, for example, if your program\
    \ is downloading a huge file from the internet and after every ten minutes you\
    \ want the user to confirm whether or not the operation should continue. You would\
    \ want to be sure that the user is asked for confirmation at least once (and possibly\
    \ more than once). One way of doing that would be to write a do...while loop.\n\
    \nA do...while loop is essentially the same as a while loop, apart from the fact\
    \ that the test condition is placed at the end of the loop rather than at the\
    \ beginning. This means that the statements inside the loop are bound to execute\
    \ at least once before the test condition is even evaluated. This is the syntax\
    \ of a do...while loop:\n\ndo {statements} while (condition);\n\nHere is a very\
    \ simple example of a do...while loop:\n\n### WhileLoops\n\n```\ni = 2;\ndo {\n\
    \    System.out.printf(\"%d\\n\", intarray[i]);\n    i++;\n} while (i < 2);\n\
    ```\n\nAs in the while loop example earlier, the condition evaluates to false\
    \ the first time it is tested. But since this test is only performed after the\
    \ code in the loop executes, the code is bound to run once (before the test is\
    \ done). In this case, this code displays the integer at index 2 in intarray:\n\
    \nCompare that with the while loop that I showed earlier, which began with while:\
    \ (i < 2). This test is done before the code inside the loop runs. So when i is\
    \ 2 the test evaluates to false and any code inside the loop, never executes.\n\
    \n## Multidimensional Arrays\n\nIn the last chapter, we looked at simple linear\
    \ arrays that contain simple lists of elements. In addition to linear arrays you\
    \ can also create 'multidimensional arrays' – that is, arrays of arrays. This\
