    ## Atomic String Conversions


    As I mentioned earlier, when you want to convert numeric values to strings — for
    example, if you want to display an integer in a text area using the setText()
    method — you need to call the toString() method using the appropriate wrapper
    class, like this:


    | DataTypes |

    | :--- |

    | myTextArea.setText(Integer.toString(myInt + myOtherInt)); |


    However, if you''ve been paying attention to my code you may notice that I don''t
    follow this rule. In the DataTypes project, for example, I display the value of
    the double variable total without explicitly converting it to a string:


    ```java

    myTextArea.setText("Total = " + total);

    ```


    How can this be? Let''s try an experiment. You''ll find the above line of code
    in the parseStringsBtnActionPerformed() method in the DataTypes project. Try editing
    it to rid of the string "Total = " and the concatenation operator + so that the
    code now reads:


    ```java

    myTextArea.setText(total);

    ```


    If you now try to rebuild and run the project you will see an error message warning
    that a double cannot be converted to a string:


    ```

    incompatible types: double cannot be converted to String

    ----

    (Alt-Enter shows hints)

    myTextArea.setText(total);

    }

    ```


    So how is it that my original version worked without problems but this new version
    does not? It turns out that when you concatenate strings (here by appending the
    value of the double variable to the string "Total = "), Java automatically calls
    the toString() method for each item that is not already a string. That means that
    the two lines of code shown below are equivalent:


    ```java

    myTextArea.setText("Total = " + total);

    myTextArea.setText("Total = " + Double.toString(total));

    ```


    ## Boxing and Unboxing


    When you use primitives in your programs, you may also need to use the methods
    provided by the corresponding ''wrapper'' classes. For that reason, Java provides
    a shorthand of converting primitives into number objects. A number object is constructed
    from a number class and has access to the built-in methods of that class.


    When you assign a primitive to a variable with the corresponding wrapper class,
    an object is created which contains the primitive value. That is called autoboxing.
    When you assign a number object to a variable of the corresponding primitive type,
    the primitive value which is contained in the number is assigned to the variable.
    That is called unboxing. You can find a simple example of autoboxing and unboxing
    in the Primitives:


    | Primitives | Object |

    | :--- | :--- |

    | int unboxed; | Integer boxedInt; |

    | double unboxed; | Double boxedDouble; |


    ```java

    boxedInt = 500; // auto-boxing

    unboxed = boxedInt; // unboxing

    ```


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_54.png)


    This diagram shows a simplified view of the primitive variable, unboxed, compared
    with the Integer object, boxedInt. The primitive is just a number; it has no built-in
    behavior. It can be used in calculations as simple primitive but not much else.
    In short, a primitive is just a piece of data. The Integer object is altogether
    more complicated. It includes some data (here the int value) but it also has functions
    or methods as floatValue(), toString() and toDouble() that can perform actions
    on that data or return values of different types as floats, strings and doubles.


    ## Strings


    We use strings frequently in our programs. To conclude this chapter, I will explain,
    in simple terms, what a string actually is. In Java, a string represents a series
    of characters. For example, the string "Hello" represents the characters ''H'',''e'',''l'',''o''.
    A string is entered as a series of characters delimited by double quotes (this
    is called a string literal) and its data type is String. A primitive has data
    type. A string is, in fact, an object which contains both data (some characters)
    and various methods. String methods include functions to find characters and substrings,
    to return a copy of the string in upper or lower case and return the length of
    the string. The first character in a string has index 0. The last character in
    the string has an index given by the length of the string minus 1.


    Assuming the string contains the text, "Hello world", the expression s.length(),
    would return a value of 11.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_55.png)


    ## How Can a String Literal Have Methods?


    Earlier I explained that an int literal such as 500 is just a piece of data with
    no methods so I can''t write 500.toString(). I would need an Integer object in
    order to do that. So why string literals have access to methods? For example,
    I can write "hello".toUpperCase() which will return the string "HELLO". This is
    because Java creates a String object when you assign a string literal to a variable.
    In fact, although string values such as "Hello" are literals they are not primitives.
    A primitive is a very simple piece of data as a character. A string is a whole
    series of characters and can therefore be regarded as a relatively complex data
    type.


    This is how my code creates this string and assigns it to the variable sLen:


    ```java

    String s;

    int sLen;

    s = "Hello world";

    sLen = s.length();

    ```


    Below you can see I have passed the index values 0 and sLen-1 to the charAt()
    method (which returns a character at a given index) in order to find the first
    and last characters in the string. A string is indexed from 0 (the first character)
    to the length of the string minus 1 (the last character):


    ```java

    char c;

    char c2;

    s = "Hello world";

    sLen = s.length();

    c = c.charAt(0); // c is now ''H''

    c2 = s.charAt(sLen-1); // c2 is now ''d''

    ```


    If I want to use a lowercase or uppercase version of the string, I need to call
    the toLowerCase() or toUpperCase() methods on the string object. These methods
    return a new string with all the characters changed to the specified case.


    ```java

    String lowercaseS = s.toLowerCase();

    String uppercaseS = s.toUpperCase();

    ```


    ## Java Strings are Immutable


    Java strings are immutable which means that they cannot be modified. For example,
    when I call the toUpperCase() method on the string s, that string object is not
    set into uppercase. The string "HELLO WORLD", which is returned by the toUpperCase()
    method is a new string object. I assign to the variable uppercase. The original
    string, s, remains unchanged: it still contains "Hello world".


    ## Escape Characters


    Notice that when I display the output in the Strings sample program I use a slash
    character, \ in front of the double-quote character in order to display a double-quote.


    ```java

    "\nIn lowercase, the string is \"" + lowercaseS + "\""

    ```


    If I don''t do that, Java thinks that the double-quote character is intended to
    be the end of the string literal. The slash \ tells Java that the character that
    follows it (such as " or n) should be treated specially: \n is treated as a newline
    character, " is a double-quote character.

