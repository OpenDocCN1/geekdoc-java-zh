    \n在这里，消息是 `toUpperCase()`。原则上，对象可能会拒绝该消息。在 Smalltalk 等面向对象语言中，消息传递是基础性的。在 Java\
    \ 等更面向对象的语言中，程序员需要讨论函数调用或方法调用，而不是消息传递。要执行代码，你必须通过名称调用它。在 Java 中，调用无参数的方法必须在方法名后跟一对空括号：\n\
    \n```java\ndoSomething();\n```\n\n## 返回值（Return Values）\n\n如果方法返回一个值，该值可以（在调用代码中）赋值给匹配数据类型的变量。在这里，`doSomething()`\
    \ 方法返回一个字符串并赋值给变量 `astr`。\n\n| 方法 (NewJFrame.java) |\n| --- |\n| `String astr;`\
