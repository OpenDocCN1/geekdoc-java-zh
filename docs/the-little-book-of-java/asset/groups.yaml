    map.put(\"White House\", new Room(2, -1, 1, 5));\nmap.put(\"Narrow Passage\",\
    \ new Room(3, -1, 4, -1));\n```\n\nIn order to obtain the value (the Room object)\
    \ associated with a specific key (a name), I pass the key to the get() method\
    \ like this:\n\n```\naKey = \"Troll Room\";\naValue = map.get(aKey);\n```\n\n\
    But sometimes I want to do some operation on all the keys or all the values. In\
    \ this case, I want to display all the room names and all the exits of each Room\
    \ object. In the code below I use a special type of for loop (which I'll have\
    \ more to say about Chapter 7) that iterates over all the keys returned by the\
    \ getKey() function and uses each key in turn to get the associated Room object,\
    \ r. It then displays the key (room name) and the exit values, n, s, w, e, of\
    \ each Room object:\n\n```\nfor(String key: map.keySet()) {\n  Room r;\n  r =\
    \ map.get(key);\n  System.out.println(String.format(\n    \"%s has exits: %tn\
    \ = %d %ts = %d %tw = %d %te = %d\",\n    key, r.n, r.s, r.w, r.e));\n}\n```\n\
    \nThis is the output:\n\n| Troll Room has exits: | N = -1 S = -1 W = 0 E = -1\
    \ |\n| Narrow Passage has exits: | N = 3 S = -1 W = 4 E = -1 |\n| Twisty Maze\
    \ has exits: | N = -1 S = 5 W = 2 E = -1 |\n| Dark Cave has exits: | N = -1 S\
    \ = 2 W = -1 E = 1 |\n| White House has exits: | N = 2 S = -1 W = 1 E = 5 |\n\
    | Dragon's Lair has exits: | N = 0 S = 4 W = -1 E = 3 |\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_104_0.png)\n\
    \n## Sets\n\nA set is a collection that contains no duplicates. Just as a sequential\
    \ array list cannot have two identical indices, so Map cannot have two identical\
    \ keys. Keys form a ‘set’. The values do not form a set, however, because the\
    \ same values may be associated with more than one key – \"of\" and \"bark\" share\
