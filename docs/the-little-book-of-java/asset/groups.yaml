    # The Serializable Interface


    In order that an object can be serialized, its class needs to implement the Serializable
    interface from the java.io package. To do that you need to add this to each class
    declaration:


    ```

    implements java.io.Serializable

    ```


    In my adventure game, I add this implements statement to all the classes I want
    to be available for serialization:


    ```

