    # Chapter 6 – Arrays and Collections


    Programs often need to deal with collections of items. In this chapter we''ll
    look at some ways of dealing with everything from arrays of integers to HashMaps
    of user-defined objects.


    Whether you are developing a payroll application or an adventure game, you will
    often need to deal with collections of data items: a list of a company’s employees,
    perhaps. Or a collection of all the treasures to be found in the Dragon’s Lair
    in your game. As in most other programming languages, the simplest way of creating
    a collection in Java is to add items to a sequential list or array.


    # Arrays


    You can think of an array as a set of slots in which a fixed number of items of
    the same type can be stored. As with just everything else in Java, an array is
    an object. An array is declared by specifying the type of elements which it will
    store, such as int, double, char or String, followed by a pair of square brackets,
    the variable name and a semicolon. Here are four array declarations:


    | ArrayDeclarations |

    | --- |

    | int[] intarray;

    | double[] doublearray;

    | char[] chararray;

    | String[] stringarray; |


    It is also permissible to place the square brackets after the variable name rather
    than the type name, like this:


    ```

    int[] intarray[];

    double[] doublearray[];

    char[] chararray[];

    String stringarray[];

    ```'
  - '[PAGE 91]


    # Chapter 6 — Arrays and Collections


    In Java, it is usually more common to place the brackets directly after the type
    name, however, and that is the convention I adopt in this book.


    Before you can use an array, you have to create it. This can be done, as with
    other types of object, using the keyword `new`. There is one extra complication
    with array objects: each array needs to be a size to identify the maximum number
    of objects that it can contain.


    Here I create four array objects. The first array can contain one integer; the
    second can contain doubles, the third can contain three characters and the fourth
    can contain five strings:


    ```

    intarray = new int[1];

    doublearray = new double[2];

    chararray = new char[3];

    stringarray = new String[5];

    ```


    Notice the syntax for creating an array. Following the keyword `new` I need to
    place the type name of each element, such as `int` or `String`, and between, square
    brackets I specify the maximum number of elements of the specified type that can
    be stored in the array.


    When arrays are created, the designated number of ''slots'' are automatically
    filled with a default value. For integers and floating points this is 0 or 0.0.
    For other types it may be a non-printable null value.


    # Arrays are Zero-Based


    The first element of an array is at index 0. So let''s suppose we have an array
    called chararray that contains the five characters: ''H'', ''e'', ''l'', ''l'',
    ''o''. The first character, ''H'', would be at the ''array index'' 0, which we
    can write in code as `chararray[0]`, the second character, ''e'', would be at
    index 1 and so on. You can think of an array as being like a container with a
    fixed number of slots numbered from 0 upwards until this:


    | Contents: | H | e | l | l | o |

    |---|---|---|---|---||

    | Index: | 0 | 1 | 2 | 3 | 4 |


    Notice that, since the first element in an array is at index 0, the last element
    is at the index given by the length of the array minus 1. In the array shown above,
    there are five characters so the array length is 5. The first element, ''H'',
    is at index 0 and the last element, ''o'', is at index 4, that is the position
    given by the array length (5), minus 1.'
