    \ `/*` 和 `*/` 字符之间的任何文本都被视为注释，并被 Java 编译器忽略。注释可记录你的代码或提供版权或许可详情。真正的 Java 代码的第一行出现在这里：\n\
    \n```\npackage helloworld;\n```\n\n每个 `package` 都是关键字——也就是说，它是 Java 程序中具有特殊含义的预定义词，而\
    \ `helloworld` 是我为当前包选择的名称或“标识符”。语句以分号结束。分号在 Java 中被广泛用于标记语句的结束。\n\n## 关键字\n\n\
