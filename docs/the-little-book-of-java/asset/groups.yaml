  - "[PAGE 119]\n\n# Breaking Code Logie!\n\nIn a complex loop, containing many lines\
    \ of code, the break condition may not be obvious and it would be easy to assume\
    \ that the loop is guaranteed to run while i is less than 10 (this is the 'logic'\
    \ of the loop condition). When you add a break you are breaking the 'code logic'\
    \ of the loop. As a general principle, it is better, clearer and less bug-prone,\
    \ to avoid breaking out of loops unless you have a very good reason for doing\
    \ so.\n\nLet me turn to a more useful example of a loop that uses a break. Here,\
    \ when the user clicks the 'Encrypt' button of the encryptBtnActionPerformed()\
    \ method 'encrypts' a string, teststr, adding 1 to the number (ASCII) value of\
    \ each character in that string. It does this by getting each character at index\
    \ i from 0 to the end of the string and adding 1 to that character's value:\n\n\
    ```\ntestStr.charAt(i) + 1\n```\n\nIt then casts the new value to a character\
    \ (char) as explained in Chapter 3 and appends this character to another string\
    \ variable str:\n\n```\nstr += (char)(testStr.charAt(i) + 1);\n```\n\nSuffice\
    \ to say, this is a very simple (and not very secure!) encryption algorithm. Even\
    \ so, it serves to illustrate the basics of how to process strings, or arrays\
    \ of elements, using loops. In principle my code could encrypt strings entered\
    \ at the keyboard or loaded from a file. For simplicity, I have created the string\
    \ shown below, in order to illustrate how the program works:\n\n```\nString testStr\
    \ = \"Hello world! Goodbye\";\n```\n\nI have set up a for to iterate over the\
    \ characters from 0 to the end of the string. However, I have made it a requirement\
    \ that each string should be terminated by the '!' character. When that character\
    \ is found the rest of the string is ignored because that point I break right\
    \ out of the for loop:\n\n```\nif (c == '!') {\n  break;\n}\n```"
- md: "\n## Chapter 7 Loops\n\nThere is one other character that I want to treat specially.\
    \ When a space is encountered – for example, the space character between the words\
    \ in \"Hello world\" – I want to retain that space character rather than encrypt\
    \ it. This is how my code does that:\n\n```\nif (c == ' ') {\n    str += c;\n\
    \    continue;\n}\n```\n\nThis is the complete encryption routine:\n\n```\nfor\
    \ (int i = 0; i < testStr.length(); i++) {\n    c = testStr.charAt(i);\n    if\
    \ (c == ' ') {\n        str += c;\n        continue;\n    }\n    if (c == '!')\
    \ {\n        break;\n    }\n    str += (char)(testStr.charAt(i) + 1);\n}\n```\n\
    \nSo what does the continue statement do after the first test? Let's find out.\n\
    \n### continue\n\nThe continue statement is a bit like a less dramatic version\
    \ of break. Whereas break exits the loop and stops running the code in the loop\
    \ any more, continue exits the loop at this through the loop then carries on running\
    \ the code in the loop.\n\nSo, in my example, if I break on '!', the code loop\
    \ stops running. Given the string \"Hello world!\" the code would process up to\
    \ the '!' character and no further. But the code would continue when it processes\
    \ the space ' '. It means the loop when ' ' is found after \"Hello\" but then\
    \ it continues running the loop to process the rest of the characters, \"world\"\
    .\n\nAs break, you should use continue with caution. There may sometimes be perfectly\
    \ good reasons for jumping out of code blocks using break or continue but likes\
    \ this can make your code hard to understand and, in complex programs, they may\
    \ result in subtle bugs.\n\nThere is another example of break and continue in\
    \ the code:\n\n```\nfor (i = 0; i < str.length(); i++) {\n  c = str.charAt(i);\n\
    \  if (c == ' ') {\n    str2 += c;\n    continue;\n  }\n  if (c == '!') {\n  \
    \  break;\n  }\n  str2 += (char)(str.charAt(i) - 1);\n}\n```\n\nThis translates\
    \ the encrypted string str (by subtracting 1 from each character) back to an unencrypted\
    \ version. It copies the unencrypted characters into the string str2.\n\nSince\
    \ the space characters in the string str are not encrypted, this code ignores\
    \ spaces by executing continue when one is found. It breaks when the string terminator\
    \ '!' is found. If you run the program and click the 'Encrypt' button, this is\
    \ what you will see:\n\n| Encrypted string is 'Ifmmp xpsme' |\n| Decrypted string\
    \ is 'Hello world' |\n\nNotice that the space between \"Hello\" and \"world\"\
    \ has been retained by the \"!\" character and all the characters following it\
    \ in the string \"Hello world! Goodbye\" have been moved.\n\nLook at the code\
    \ carefully and try to work out why that has happened. If this isn't clear to\
    \ you, try editing the string testStr by removing the \"! \" character or adding\
    \ more of them and see what results you get when you click the 'Encrypt' button:\n\
    \n```\n// try this\nString testStr = \"Hello! world! Goodbye\";\n\n// and this\n\
    String testStr = \"Hello world Goodbye\";\n```\n\nThe BreakAndContinue project\
    \ also contains an example of breaking out of a while loop (see the whileBtnActionPerformed()\
    \ method):\n\n```\nprivate void whileBtnActionPerformed(java.awt.event.ActionEvent\
    \ evt) {\nint i;\nchar c;\nString str = \"\";\ni = 0;\nwhile (i >= 0) {\n    c\
    \ = testStr.charAt(i);\n    ta.append(String.format(\"[%d]='%c \", i, c));\n \
    \   if (c == '!') {\n        break;\n    }\n    str += c;\n    i++;\n}\nta.append(String.format(\"\
    \\nAfter while loop, str='%s\", str));\n}\n```\n\nThis runs a while loop with\
    \ no valid end condition (since i will always be greater than or equal to 0):\n\
    \n```\ni = 0;\nwhile(i >= 0)\n```\n\nIt displays the character and numeric code\
    \ of each item in testStr and builds a new string str that ends when the '!' character\
    \ is found. A loop with no valid end condition will run forever unless you explicitly\
    \ break out of it. In this loop, '!' is found breaks:\n\n```\nif (c == '!') {\n\
    \    break;\n}\n```\n\nIn common with the break statement, you can continue destroy\
    \ the logic of your code, making it hard to understand. a loop that begins with\
    \ while (i >= 0) looks as though it should continue running as long as i has any\
    \ value that is 0 or more. When I insert an additional test that breaks out of\
    \ the loop when some other condition is met such as if (c == '!') violates the\
    \ condition controlling the while loop. In many cases, you can avoid breaking\
    \ from loops by rewriting the test condition of the loop itself, like this:\n\n\
    ```\nwhile ((i >= 0) && (c != '!'))\n```\n\n### Breaking Out of a ‘for’ Loop\n\
    \nIn a previous example program MultidimensionalArray, you may recall that I placed\
    \ one for loop inside another in order to process the elements in arrays that\
    \ were nested inside another array:\n\n```\nMultidimensionalArray\nfor (int row\
    \ = 0; row < 4; row++) {\n    System.out.printf(\"--- row %d --\\n\", row, Arrays.toString(grid[row]));\n\
    \    for (int column = 0; column < 5; column++) {\n        System.out.printf(\"\
    column[%d] = %d\\n\", column, grid[row][column]);\n    }\n}\n```\n\nThis was the\
    \ output:\n\n```\n-- row 0 : [1, 2, 3, 4, 5] --\ncolumn[0] = 1\ncolumn[1] = 2\n\
    column[2] = 3\ncolumn[3] = 4\ncolumn[4] = 5\n-- row 1 : [6, 7, 8, 9, 10] --\n\
    column[0] = 6\ncolumn[1] = 7\ncolumn[2] = 8\ncolumn[3] = 9\ncolumn[4] = 10\n--\
    \ row 2 : [11, 12, 13, 14, 15] --\ncolumn[0] = 11\ncolumn[1] = 12\ncolumn[2] =\
    \ 13\ncolumn[3] = 14\ncolumn[4] = 15\n-- row 3 : [16, 17, 18, 19, 20] --\ncolumn[0]\
    \ = 16\ncolumn[1] = 17\n```\n\nNow you might wonder what you would need to do\
    \ to break out of inner for loop?\n\n```\nfor(some condition){\n    for(some condition)\
    \ {\n        break;\n    }\n}\n```\n\nWould the break exit just the inner loop\
    \ or would it exit the outer loop? Try it out. Here add code to the inner loop\
    \ that breaks when the value of column is 2:\n\n```\nfor (int row = 0; row < 4;\
    \ row++) {\n    System.out.printf(\"--- row %d : %s --\\n\", row, Arrays.toString(grid[row]));\n\
    \    for (int column = 0; column < 5; column++) {\n        System.out.printf(\"\
    column[%d] = %d\\n\", column, grid[row][column]);\n        if (column == 2) {\n\
    \            break;\n        }\n    }\n}\n```\n\nThis time, this is what I see\
    \ when the program runs:\n\n```\n-- row 0 : [1, 2, 3, 4, 5] --\ncolumn[0] = 1\n\
    column[1] = 2\ncolumn[2] = 3\n-- row 1 : [6, 7, 8, 9, 10] --\ncolumn[0] = 6\n\
    column[1] = 7\ncolumn[2] = 8\n-- row 2 : [11, 12, 13, 14, 15] --\ncolumn[0] =\
    \ 11\ncolumn[1] = 12\ncolumn[2] = 13\n-- row 3 : [16, 17, 18, 19, 20] --\ncolumn[0]\
    \ = 16\ncolumn[1] = 17\ncolumn[2] = 18\n```\n\nFrom this you can see that the\
    \ inner loop breaks when row is 0 and column is 2 but the outer loop continues\
    \ running it breaks again when row is 1 and column is 2 – and so on. This shows\
    \ that break causes an exit from the innermost loop only.\n\n### Labelled break\n\
    \nIf you want a break from both the inner and the outer loop you can do this using\
    \ a labelled break statement. You should add a label (that is, a name followed\
    \ by a colon) such as outerloop: immediately before the start of the outer loop\
    \ like this:\n\n```\nouterloop:\nfor (int row = 0; row < 4; row++) {\n```\n\n\
    In order to break to this label (which would exit both the inner and the outer\
    \ loop) you add the label name (without a colon) after break:\n\n```\nbreak outerloop;\n\
    ```\n\nThe LabelBreak sample program demonstrates the effect of breaking to a\
    \ label:\n\n```\nLabelBreak\nouterloop:\nfor (int row = 0; row < 4; row++) {\n\
    \  System.out.printf(\"--- row %d : %s \\n\", row, Arrays.toString(grid[row]));\n\
    \  for (int column = 0; column < 5; column++) {\n    System.out.printf(\"column[%d]\
    \ = %d\\n\", column, grid[row][column]);\n    if (column == 2) {\n      break\
    \ outerloop;\n    }\n  }\n}\n```\n\nThis displays the following:\n\n```\n-- row\
    \ 0 : [1, 2, 3, 4, 5] --\ncolumn[0] = 1\ncolumn[1] = 2\ncolumn[2] = 3\n```\n\n\
    ### Labelled continue\n\nYou can also have labelled continue statements like this:\n\
    \n```\ncontinue outerloop;\n```\n\nPreviously the unlabelled break exited the\
    \ inner for loop the variable column had the value 2 and then it continued executing\
    \ the outer for loop loop – with the result that the first three items in each\
    \ of the four nested arrays were displayed.\n\nBut with a break that jumps to\
    \ the labelled outer for loop, both loops exit when the break is encountered.\
    \ As a result only the three elements from the first nested array are displayed.\
    \ The labelled break then terminates both for loops so none of the other nested\
    \ arrays (if you look at the sample code, you'll see there are four nested arrays)\
    \ is processed.\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_125_0.png)\n"
  mdcn: "\n\n## 第 7 章 循环\n\n我还有一个想要特殊处理的字符。当遇到空格时——例如 \"Hello world\" 中单词之间的空格字符——我想保留该空格字符而不是对其进行加密。我的代码是这样：\n\
    \n```\nif (c == ' ') {\n    str += c;\n    continue;\n}\n```\n\n这是完整的加密例程：\n\n\
    ```\nfor (int i = 0; i < testStr.length(); i++) {\n    c = testStr.charAt(i);\n\
    \    if (c == ' ') {\n        str += c;\n        continue;\n    }\n    if (c ==\
    \ '!') {\n        break;\n    }\n    str += (char)(testStr.charAt(i) + 1);\n}\n\
    ```\n\n那么，在第一次测试之后，`continue` 语句做了什么？让我们发现一下。\n\n### continue\n\n`continue` 语句有点像程度较轻的\
    \ `break`。`break` 会退出循环并停止执行循环中的代码，而 `continue` 则从当前迭代退出循环，然后继续执行循环剩余的代码。\n\n\
    因此，在我的示例中，如果遇到 '!' 时执行 `break`，代码循环就会停止运行。对于字符串 \"Hello world!\"，代码将处理到 '!' 字符处且不再继续。但代码在处理空格\
    \ ' ' 时会继续。这意味着当在 \"Hello\" 之后发现 ' ' 时，循环会跳过当前部分，然后继续运行循环以处理剩余字符 \"world\"。\n\n\
    与 `break` 一样，你应该谨慎使用 `continue`。虽然有时使用 `break` 或 `continue` 跳出代码块可能有完全合理的理由，但这种做法会让你的代码难以理解，在复杂的程序中，它们可能会导致微妙的\
    \ bug。\n\n代码中另一个关于 `break` 和 `continue` 的示例：\n\n```\nfor (i = 0; i < str.length();\
    \ i++) {\n  c = str.charAt(i);\n  if (c == ' ') {\n    str2 += c;\n    continue;\n\
    \  }\n  if (c == '!') {\n    break;\n  }\n  str2 += (char)(str.charAt(i) - 1);\n\
    }\n```\n\n这会将加密后的字符串 `str`（通过对每个字符减 1）转换回未加密版本。它将解密的字符复制到字符串 `str2` 中。\n\n由于字符串\
    \ `str` 中的空格字符没有被加密，这段代码在发现空格时通过执行 `continue` 来忽略空格。当发现字符串终止符 '!' 时，它执行 `break`。如果你运行程序并点击“Encrypt”（加密）按钮，你将看到：\n\
    \n| 加密字符串为 'Ifmmp xpsme' |\n| 解密字符串为 'Hello world' |\n\n注意看到\"Hello\" 和 \"world\"\
    \ 之间的空格被 \"!\" 字符保留了，而字符串 \"Hello world! Goodbye\" 中其之后的所有字符都被移动了。\n\n仔细观察代码并尝试找出为什么会发生这种情况。如果你还不清楚，可以尝试编辑字符串\
    \ `testStr`，移除 \"!\" 字符或添加更多，看看点击“Encrypt”按钮时会得到什么结果：\n\n```\n// 尝试这个\nString\
    \ testStr = \"Hello! world! Goodbye\";\n\n// 还有这个\nString testStr = \"Hello world\
    \ Goodbye\";\n```\n\nBreakAndContinue 项目还包含一个跳出 while 循环的示例（参见 `whileBtnActionPerformed()`\
    \ 方法）：\n\n```java\nprivate void whileBtnActionPerformed(java.awt.event.ActionEvent\
    \ evt) {\nint i;\nchar c;\nString str = \"\";\ni = 0;\nwhile (i >= 0) {\n    c\
    \ = testStr.charAt(i);\n    ta.append(String.format(\"[%d]='%c \", i, c));\n \
    \   if (c == '!') {\n        break;\n    }\n    str += c;\n    i++;\n}\nta.append(String.format(\"\
    \\nAfter loop, str='%s\", str));\n```\n\n这是一个没有有效结束条件的 while 循环（因为 `i` 始终大于或等于\
    \ 0）：\n\n```\ni = 0;\nwhile(i >= 0)\n```\n\n它显示 `testStr` 中每个项目的数字代码，并在发现 '!'\
    \ 字符时构建一个新字符串 `str`。除非显式使用 `break`，否则没有有效结束条件的循环将无限运行。带有 `break` 语句的情况可能会破坏你的代码逻辑：\n\
    \n```\nif (c == '!') {\n    break;\n}\n```\n\n在很多情况下，你可以通过重写循环自身的条件来避免跳出循环，例如：\n\
    \n```\nwhile ((i >= 0) && (c != '!'))\n```\n\n### 跳出 for 循环\n\n在之前的示例 `MultidimensionalArray`\
    \ 中，你可能记得我在另一个循环内部放置了一个 for 循环来处理数组元素：\n\n```\nMultidimensionalArray\nfor (int\
    \ row = 0; row < 4; row++) {\n    System.out.printf(\"--- row %d --\\n\", row,\
    \ Arrays.toString(grid[row]));\n    for (int column = 0; column < 5; column++)\
    \ {\n        System.out.printf(\"column[%d] = %d\\n\", column, grid[row][column]);\n\
    \    }\n}\n```\n\n这是输出结果：\n\n```\n-- row 0 : [1, 2, 3, 4, 5] --\ncolumn[0] = 1\n\
    column[1] = 2\ncolumn[2] = 3\ncolumn[3] = 4\ncolumn[4] = 5\n-- row 1 : [6, 7,\
    \ 8, 9, 10] --\ncolumn[0] = 6\ncolumn[1] = 7\ncolumn[2] = 8\ncolumn[3] = 9\ncolumn[4]\
    \ = 10\n-- row 2 : [11, 12, 13, 14, 15] --\ncolumn[0] = 11\ncolumn[1] = 12\ncolumn[2]\
    \ = 13\ncolumn[3] = 14\ncolumn[4] = 15\n-- row 3 : [16, 17, 18, 19, 20] --\ncolumn[0]\
    \ = 16\ncolumn[1] = 17\ncolumn[2] = 18\ncolumn[3] = 19\ncolumn[4] = 20\n```\n\n\
    现在你可能想知道需要做什么才能跳出内层 for 循环？\n\n```\nfor(some condition){\n    for(some condition)\
    \ {\n        break;\n    }\n}\n```\n\n`break` 会退出内层循环还是退出外部循环？尝试一下。在内层循环中添加代码，当\
    \ `column` 的值为 2 时跳出：\n\n```\nfor (int row = 0; row < 4; row++) {\n    System.out.printf(\"\
    --- row %d --\\n\", row, Arrays.toString(grid[row]));\n    for (int column = 0;\
    \ column < 5; column++) {\n        System.out.printf(\"column[%d] = %d\\n\", column,\
    \ grid[row][column]);\n        if (column == 2) {\n            break;\n      \
    \  }\n    }\n}\n```\n\n这一次，当程序运行时，我看到：\n\n```\n-- row 0 : [1, 2, 3, 4, 5] --\n\
    column[0] = 1\ncolumn[1] = 2\n-- row 1 : [6, 7, 8, 9, 10] --\ncolumn[0] = 6\n\
    column[1] = 7\n-- row 2 : [11, 12, 13, 14, 15] --\ncolumn[0] = 11\ncolumn[1] =\
    \ 12\n-- row 3 : [16, 17, 18, 19, 20] --\ncolumn[0] = 16\ncolumn[1] = 17\n```\n\
    \n从这里你可以看到，当 `row` 为 0 且 `column` 为 2 时，内层循环中断，但外部循环继续运行，并在 `row` 为 1 且 `column`\
    \ 为 2 时再次中断——依此类推。这表明 `break` 只导致退出最内循环。\n\n### 标签 break (Labelled break)\n\n\
    如果你想同时跳出内层和外部循环，可以使用标签 `break` 语句。你应该在外部循环开始之前立即添加一个标签（即后面跟一个冒号的名称），例如 `outerloop:`：\n\
    \n```\nouterloop:\nfor (int row = 0; row < 4; row++) {\n```\n\n为了跳转到此标签（这将同时退出内层和外部循环），你需要在\
    \ `break` 之后添加标签名称（不带冒号）：\n\n```\nbreak outerloop;\n```\n\n`LabelBreak` 示例程序演示了跳转到标签的效果：\n\
    \n```\nLabelBreak\nouterloop:\nfor (int row = 0; row < 4; row++) {\n  System.out.printf(\"\
    --- row %d --\\n\", row, Arrays.toString(grid[row]));\n  for (int column = 0;\
    \ column < 5; column++) {\n    System.out.printf(\"column[%d] = %d\\n\", column,\
    \ grid[row][column]);\n    if (column == 2) {\n      break outerloop;\n    }\n\
    \  }\n}\n```\n\n这显示了：\n\n```\n-- row 0 : [1, 2, 3, 4, 5] --\ncolumn[0] = 1\ncolumn[1]\
    \ = 2\ncolumn[2] = 3\n```\n\n### 标签 continue (Labelled continue)\n\n你也可以拥有这样的标签\
    \ `continue` 语句：\n\n```\ncontinue outerloop;\n```\n\n之前，无标签的 `break` 退出内层 for\
    \ 循环，变量 `column` 值为 2，然后继续执行外部 for 循环——结果是显示了四个嵌套数组中的前三个项。\n\n但使用跳转到标签外部 for 循环的\
    \ `break` 时，当遇到 break 时，两个循环都会退出。结果只显示了第一个嵌套数组中的三个元素。标签 `break` 随后终止了两个 for 循环，因此没有处理其他任何嵌套数组（如果你查看示例代码，你会发现四个嵌套数组）。\n\
    \n![](img/8c3ac46909d3d5f277ec850365ee22ff_125_0.png)\n\n"
