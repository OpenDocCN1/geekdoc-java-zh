    # Chapter 9 – Generics and Exceptions


    Now all is well and good just so long as the final element of aList is indeed
    a string. But let''s suppose I add on an integer:


    ```

    aList.add(4);

    ```


    Now I call my method to return the final element in the list:


    ```

    outputTA.append(getLastItem(aList) + "\n");

    ```


    The program compiles without any errors. But when you click the button labelled
    ''string list'' that runs the code to return a string from the end of aList, you
    will see a nasty-looking error message:


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_153_0.png)


    This should be no surprise. We cannot ''cast'' an integer to a string. The two
    objects are incompatible. But, that so, why were we not able to compile the program
    in the first case since it contained this obvious error.


    It turns out that the compiler allowed this because ArrayList is capable of holding
    objects of any type and it is entirely legitimate for our method to cast an object
    to a specific class as String. So, as far as the compiler is concerned, all the
    code is valid.


    In fact, if we never click the button that runs the code that calls the getLastItem()
    with a list containing a final integer, the code will all work correctly. This
    means we have to take extra care when writing code to handle the elements in an
    ArrayList to make sure we do not accidentally try to manipulate an element in
    inappropriate way.'
  - '[PAGE 154]


    # Strongly-typed Lists


    One way of avoiding this problem would be to insist that the ArrayList must store
    elements only of a single type. You might think it would be sufficient just to
    make a note to remind yourself that ArrayList should only be used to store strings.
    But what if, at some later date in a complicated programming project, you (or
    other programmers in your team) forget that this was what you intended and you
    (or they) write some code that adds an integer?


    As long as integer is at any position other than the last in your list, your code
    continues to work fine until you won''t realize it contains a bag. And then one
    day, something in your code just happens to put an integer in the final position
    – that''s when the error occurs.


    One way to make sure that this cannot happen would be the list strongly-typed
    — that is, to insist that only strings can be added to it. In Java, this is how
    you would declare an ArrayList that can add some other type. For example, this
    code will not compile:


    Generics (NewJFrame.java)

    ArrayList<String>gStrList = new ArrayList<>();


    Now, with gStrList typed to hold String elements the compiler can spot immediately
    if you attempt to add some other type. This code will not compile:


    Generics (NewJFrame.Java) - genericStringListBtnActionPerformed()

    gStrList.add(2);


    The compiler produces this message (this may be shown as an error ''hint'' in
    an IDE):


    ```

    error: no suitable method found for add(int)

    gStrList.add(2);

    method Collection.add(String) is not applicable

    (argument mismatch; int cannot be converted to String)

    ```


    I am now obliged to fix my code, removing any possibility that the error will
    occur when the code is run. This is good news for me as a developer. It forces
    me to avoid errors that might otherwise occur in a running program. My strongly-typed
    ArrayList is a simple example of Java''s generics.'
  - '[PAGE 155]


    # Generics


    Generics allow you to use placeholders or parameters when defining classes, interfaces
    and methods. These are similar to the usual formal parameters used in method declarations,
    but instead of being values they are types. Generics let you re-use the same code
    with different inputs – that is with different types of data.


    What this means is that you are able to define classes and methods that can work
    with some non-specified type of object. That is is common or ''generic'' to all
    object types. The actual type of the object can be specified when those classes
    and types are used in your code. The ArrayList class is generic. It is declared
    as being a collection of elements, each of which has the type E:


    ```

    public class ArrayList<E>

    ```


    Here <E> is not a real type – it is a place-holder that will be replaced with
    an actual type when you create an instance of ArrayList. You simply place the
    actual type between pointy brackets and also place an empty pair of pointy brackets
    before the parentheses of the constructor. So this is how I create an ArrayList
    to hold string elements:


    ```

    ArrayList <String>gstrList = new ArrayList<>();

    ```


    I could just as easily create an ArrayList to contain Integer elements, like this:


    ```

    ArrayList <Integer>gIntList = new ArrayList<>();

    ```


    # Generic Key-Value pairs


    Java defines a number of generic collections. You may recall from Chapter 6 that
    I created a HashMap object to hold strictly-typed Key-Value pairs in which the
    key was obliged to be a String and the value was an instance of my Room class:


    ```

    HashMap <String, Room>map;

    map = new HashMap<>();

    ```'
- md: "\n# Chapter 9 — Generics and Exceptions\n\nI was able to specify types for\
    \ the HashMap keys and values due to the fact that the HashMap class is generic\
    \ and, just as ArrayList has the <E> placeholder, a HashMap has a pair of placeholders\
    \ <K, V> that can be replaced by actual types when a HashMap object is declared\
    \ and created in your own code.\n\n## Generic Classes\n\nYou can write your own\
    \ generic classes which, just like the generic ArrayList class, can be used to\
    \ handle objects of different types. This is how I would declare a simple generic\
    \ class:\n\n| Generics (MyGenericClass.java) |\n| public class MyGenericClass<T>\
    \ {} |\n\nHere <T> is the 'type parameter'. It provides a placeholder for a real\
    \ type so that this type can then be used inside the class. This is how I declare\
    \ a private variable someData of the type T:\n\n```java\nprivate T someData;\n\
    ```\n\nIf I want to provide a constructor to initialize this variable, I do so\
    \ by declaring the input parameter as being of type T:\n\n```java\npublic MyGenericClass(T\
    \ aValue) {\n    someData = aValue;\n}\n```\n\nAs just with a normal class, I\
    \ can provide getter and setter methods to assign or return the values of private\
    \ variables, once again being sure of the type as T:\n\n```java\npublic T getObjData()\
    \ {\n    return someData;\n}\n\npublic void someData(T someData) {\n    this.someData\
    \ = someData;\n}\n```\n\nIn my example, I've also written one other method that\
    \ returns a string description of MyGenericClass object and its private data:\n\
    \nWhen I create an object from my generic class I have to supply an actual type\
    \ (between a pair of pointy brackets) to replace the T parameter, like this:\n\
    \n```java\nGenerics (NewJFrame.java) - myGenericClassActionPerformed()\nMyGenericClass<String>\
    \ myStrOb;\n```\n\nIn fact, myGenericClass has its own constructor, with a parameter\
    \ given by the type T, I can pass a piece of the same type specified for my object\
    \ (here, that's a String) when I create that object:\n\n```java\nMyGenericClass<String>\
    \ myStrOb = new MyGenericClass<>(\"Hello world\");\n```\n\nI could equally create\
    \ MyGenericClass objects to work with other types such as Integer:\n\n```java\n\
    MyGenericClass<Integer> myIntegerOb = new MyGenericClass<>(10);\n```\n\nNow I\
    \ can call the describe() method of MyGenericClass as well as its getter and setter\
    \ methods that do the same methods on different type data:\n\n```java\noutputTA.append(myStrOb.describe());\n\
    outputTA.append(myIntegerOb.describe());\nmyIntegerOb.setSomeData(500);\noutputTA.append(myIntegerOb.describe());\n\
    ```\n\nClick the ‘My Generic Class’ button to run this code:\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_157_0.png)\n\
    \nThis is what you will see:\n\n```\nclass MyGenericClass <class java.lang.String>\
    \ Hello world\nclass MyGenericClass <class java.lang.Integer> 10\nclass MyGenericClass\
    \ <class java.lang.Integer> 500\n```\n\n## Generic Parameter Names\n\nYou may\
    \ choose your own parameter names (such as <T> or <E> when defining generics).\
    \ However, by convention, these are the types typically used:\n\n- T: Type\n-\
    \ E: Element (in a collection)\n- K: Key in a Map/Hash\n- V: Value in a Map/Hash\n\
    - N: Number\n\n## Generic Lists and Collections\n\nCommonly, classes that manage\
    \ collections or lists may be made generic. This is because lists of all types\
    \ of object need to perform similar actions on the elements of the list – for\
    \ example, to add and remove elements or to find an element at a given index.\n\
    \nImplementing the same methods time after time for each class that defines some\
    \ strongly-typed list (a Liststring and a Integer class, for example) would clearly\
    \ be highly repetitive. It would be better to implement a generic class with all\
    \ the required methods for manipulating list elements in general and specify the\
    \ actual element type whenever an instance of that generic class is created.\n\
    \nYou could either implement your list from the ground up or could extend an existing\
    \ generic collection type and add any additional features that you need. In my\
    \ Generics sample program I extended ArrayList and added on one new method to\
    \ return the last element of a list:\n\n```java\nGenerics (List.java)\npublic\
    \ class List<E> extends ArrayList<E> {\n    public E getItem() {\n        return\
    \ this.get(this.size() - 1);\n    }\n}\n```\n\nThis time I have followed the Java\
    \ convention of naming the generic parameter E to represent the type of the elements\
    \ in the list. List<E> extends ArrayList<E> since both handle elements of the\
    \ type given by E. The method getItem() returns both whose type is once again\
    \ represented by the generic type parameter E. The index of the last item is calculated\
    \ by subtracting 1 from the list's size.\n\nWhen I used a standard ArrayList to\
    \ hold elements, I was obliged to pass ArrayList as an argument to a method such\
    \ as getLast(ArrayList list) which returned a generic type such as String. But\
    \ with the generic MyList class, the getLast() method acts upon the list itself\
    \ and de-facto returns the generic type.\n\n(Note: The OCR text had some artifacts/disjoint\
    \ sentences in the latter half of the provided text; the logical reconstruction\
    \ based on the context of Java generics/subclassing has been applied here to maintain\
    \ a coherent technical flow.)\n\n## Overriding Methods\n\nSometimes you may want\
    \ a subclass to override a method from the ancestor class. This is called ‘overriding’.\
    \ For example, if you have a subclass that extends the ancestor and you want to\
    \ override the method with the same name:\n\n### Monster.java\n```java\npublic\
    \ class Monster {\n    public String saySomething() {\n        return \"Grrrrr\"\
    ;\n    }\n}\n```\n\n### Troll.java\n```java\npublic class Troll extends Monster\
    \ {\n    public String saySomething() {\n        return \"Ugh, ugh!\";\n    }\n\
    }\n```\n\nNow when I call saySomething() on the Troll object, its overridden method\
    \ is executed rather than the method in the ancestor class. But what happens if\
    \ I made a mistake and accidentally named the method somethingElse()? As we know,\
    \ Java is a case-sensitive language so the fact that I accidentally used a lowercase\
    \ 's' in the method is important:\n\n```java\npublic class Troll extends Monster\
    \ {\n    public String somethingElse() {\n        return \"Ugh, ugh, ugh!\";\n\
    \    }\n}\n```\n\nNow when I call saySomething() on the Troll object, Java finds\
    \ it in the ancestor class. This is what I see:\n```\nGrrrrr\n```\n\n## @Override\
    \ Annotation\n\nThere is a simple trick to help me avoid the sort of problem would\
    \ result from accidentally misnaming a method. When I intend one method to override\
    \ another, I can place the @Override annotation before that method.\n\nIn Java\
    \ an annotation is an intention to the compiler. The @Override annotation tells\
    \ it to check that the annotated method has successfully overridden a method with\
    \ the same name in its ancestor class. You may recall that I used @Override in\
    \ Chapter 8 when implementing interfaces, to check that the methods were declared\
    \ by. In the current example, I can place @Override above the method in my Troll\
    \ class like this:\n\n```java\n@Override\npublic String somethingElse() {\n  \
    \  return \"Ugh, ugh, ugh!\";\n}\n```\n\nNow the compiler will compare this method\
    \ with the methods in the ancestor class. It will discover that there is no method\
    \ with this name in the ancestor class so the method cannot be overridden and\
    \ an error occurs. In fact, your IDE may also perform this check and it too may\
    \ flag an error:\n\n| method does not override or implement a method from a supertype\
    \ |\n| --- |\n| (Alt-Enter shows hints) |\n| @Override |\n| public String somethingElse()\
    \ {\n| return \"Ugh, ugh, ugh!\";n| } |\n"
  mdcn: "\n\n# 第 9 章 泛泛与异常\n\n我能够为 HashMap 的键和值指定类型，是因为 HashMap 类是泛型的。就像 ArrayList\
    \ 有 `<E>` 占位符一样，HashMap 也有一对 `<K, V>` 占位符，在你自己的代码中声明并创建 HashMap 对象时，它们可以被实际类型替换。\n\
    \n## 泛型类\n\n你可以编写自己的泛型类，它们就像泛型 ArrayList 类一样，可以处理不同类型的对象。我是这样声明一个简单的泛型类的：\n\n\
    | 泛型 (MyGenericClass.java) |\n| public class MyGenericClass<T> {} |\n\n在这里，`<T>`\
    \ 是“类型参数”。它为真实类型提供了一个占位符，以便该类型可以在类内部使用。这就是我如何声明类型为 `T` 的私有变量 `someData`：\n\n```java\n\
    private T someData;\n```\n\n如果我想提供一个构造函数来初始化这个变量，可以通过将输入参数声明为类型 `T` 来实现：\n\n```java\n\
    public MyGenericClass(T aValue) {\n    someData = aValue;\n}\n```\n\n就像普通类一样，我可以提供\
    \ getter 和 setter 方法来分配或返回私有变量的值，再次确保了类型为 `T`：\n\n```java\npublic T getObjData()\
    \ {\n    return someData;\n}\n\npublic void someData(T someData) {\n    this.someData\
    \ = someData;\n}\n```\n\n在我的示例中，我还写写了另一个方法，用于返回 `MyGenericClass` 对象及其私有数据的字符串描述：\n\
    \n当我从我的泛型类创建对象时，我必须提供一个实际类型（位于一对尖括号之间）来替换 `T` 参数，如下：\n\n```java\n泛型 (NewJFrame.java)\
    \ - myGenericClassActionPerformed()\nMyGenericClass<String> myStrOb;\n```\n\n\
    事实上，`myGenericClass` 有它自己的构造函数，参数由类型 `T` 指定。在创建该对象时，我可以传递一个与我的对象指定的类型相同（这里是 `String`）：\n\
    \n```java\nMyGenericClass<String> myStrOb = new MyGenericClass<>(\"Hello world\"\
    );\n```\n\n我同样可以创建 `MyGenericClass` 对象来处理其他类型，例如 `Integer`：\n\n```java\nMyGenericClass<Integer>\
    \ myIntegerOb = new MyGenericClass<>(10);\n```\n\n现在我可以调用 `MyGenericClass` 的 `describe()`\
    \ 方法以及它的 getter 和 setter 方法，这些方法对不同类型的数据执行相同的操作：\n\n```java\noutputTA.append(myStrOb.describe());\n\
    outputTA.append(myIntegerOb.describe());\nmyIntegerOb.setSomeData(500);\noutputTA.append(myIntegerOb.describe());\n\
    ```\n\n点击“My Generic Class”按钮运行此代码：\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_157_0.png)\n\
    \n这是你将看到的：\n\n```\nclass MyGenericClass <class java.lang.String> Hello world\n\
    class MyGenericClass <class java.lang.Integer> 10\nclass MyGenericClass <class\
    \ java.lang.Integer> 500\n```\n\n## 泛型参数名称\n\n你可以选择自己的参数名称（例如在定义泛型时使用 `<T>` 或\
    \ `<E>`）。但根据惯例，这些是通常使用的类型：\n\n- T: 类型 (Type)\n- E: 元素 (Element)\n- K: Map/Hash\
    \ 中的键 (Key)\n- V: Map/Hash 中的值 (Value)\n- N: 数字 (Number)\n\n## 泛型列表和集合\n\n通常，管理集合或列表的类可以是泛型的。这是因为所有类型的对象列表都需要对列表元素执行相似的操作——例如添加和删除元素，或查找给定索引处的元素。\n\
    \n为每个定义了强类型列表的类（例如 `Liststring` 类和 `Integer` 类）反复实现相同的方法，显然是高度重复的。更好的做法是实现一个泛型类，包含所有操作列表元素所需的通用方法，并在每次创建该泛型类的实例时指定实际元素类型。\n\
    \n你可以从零开始实现列表，也可以扩展现有的泛型集合类型并添加你需要的任何额外功能。在我的泛型示例程序中，我扩展了 `ArrayList` 并添加了一个新方法来返回列表的最后一个元素：\n\
    \n```java\n泛型 (List.java)\npublic class List<E> extends ArrayList<E> {\n    public\
    \ E getItem() {\n        return this.get(this.size() - 1);\n    }\n}\n```\n\n\
    这一次，我遵循了 Java 的约定，将泛型参数命名为 `E` 以表示元素的类型。`List<E>` 扩展了 `ArrayList<E>`，因为它们都处理由\
    \ `E` 指定类型的元素。`getItem()` 方法的类型再次由泛型类型参数 `E` 表示。最后一项的索引通过列表大小减去 1 计算得出。\n\n当我使用标准的\
    \ `ArrayList` 来存储元素时，我被迫将 `ArrayList` 作为参数传递给如 `getLast(ArrayList list)` 这样的方法，该方法返回泛型如\
    \ `String`。但使用泛型 `MyList` 类，`getLast()` 方法作用于列表本身，并实际上返回了泛型类型。\n\n（注：提供的文本后半部分\
    \ OCR 存在一些伪影/断句；此处已根据 Java 泛型/子类的上下文进行了逻辑重构，以保持技术流的连贯性。）\n\n## 方法重写\n\n有时，你可能希望子类重写父类的方法。这被称为“重写”。例如，如果你有一个扩展父类的子类，并且你想重写同名的方法：\n\
    \n### Monster.java\n```java\npublic class Monster {\n    public String saySomething()\
    \ {\n        return \"Grrrrr\";\n    }\n}\n```\n\n### Troll.java\n```java\npublic\
    \ class Troll extends Monster {\n    public String saySomething() {\n        return\
    \ \"Ugh, ugh!\";\n    }\n}\n```\n\n现在当我对 `Troll` 对象调用 `saySomething()`，执行的是它的重写方法而不是父类的方法。但如果我犯了错误，将方法命名为\
    \ `somethingElse()` 会怎样？正如我们所知，Java 是一种大小敏感的语言，因此我在方法中无意使用小写 `s` 是重要的：\n\n```java\n\
    public class Troll extends Monster {\n    public String somethingElse() {\n  \
    \      return \"Ugh, ugh, ugh!\";\n    }\n}\n```\n\n现在当我调用 `saySomething()` 时，Java\
    \ 在父类中找到了它。这就是我看到的：\n```\nGrrrrr\n```\n\n## @Override 注解\n\n有一个简单的技巧可以帮助我避免因误命名方法引起的问题。当我想要一个方法重写另一个方法时，可以在该方法之前放置\
    \ `@Override` 注解。\n\n在 Java 中，注解是对编译器的一种意图。`@Override` 注解告诉编译器检查被注解的方法是否成功重写了其父类中的同名方法。你可能记得我在第\
    \ 8 章实现接口时使用过 `@Override`，以检查方法是否是由接口定义的。在当前示例中，我可以像这样在 `Troll` 类的方法上方放置 `@Override`：\n\
    \n```java\n@Override\npublic String somethingElse() {\n    return \"Ugh, ugh,\
    \ ugh!\";\n}\n```\n\n现在编译器会将此方法与父类中的方法进行比较。它会发现父类中没有同名的方法，因此该方法无法重写，并会导致错误。事实上，你的\
    \ IDE 可能也会进行此类检查，并且也可能标记错误：\n\n| 方法未重写或实现父类中的方法 |\n| --- |\n| (Alt-Enter 显示提示)\
    \ |\n| @Override |\n| public String somethingElse() {\n| return \"Ugh, ugh, ugh!\"\
    ;\n| } |\n\n"
