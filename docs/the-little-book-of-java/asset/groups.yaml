    \ The syntax of an enhanced for loop can be summarised as:\n\n> for (type variableName:\
    \ collection) {statements}\n\nHere type is the type-name of the elements stored\
    \ in the collection. This is an example which prints each string in the somewords\
    \ array:\n\n```\nfor (String word:somewords){\n    System.out.println(word);\n\
    }\n```\n\n109\n"
