    \ that have the same names as the packages. This has the advantage of making the\
    \ organization of packages clear.\n\nFollowing the package declaration in HelloWorld.java,\
    \ we come to:\n\n```\npublic class HelloWorld {\n```\n\n# Classes\n\nIf you have\
