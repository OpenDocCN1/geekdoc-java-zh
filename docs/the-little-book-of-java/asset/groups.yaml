- md: "\nInterfaces as ‘Contracts’\n\nAn ‘interface’ is a definition of the code that\
    \ a class must implement: it is, if you like, a ‘contract’ that the class using\
    \ the interface must respect. If you have a contract to build a house, say, the\
    \ contract isn’t the actual house, but it does specify (in more or less detail)\
