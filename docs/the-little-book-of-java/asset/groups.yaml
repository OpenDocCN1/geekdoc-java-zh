    \ Scope\n\n##\n\n## Global and Local Variables\n\nIn the preceding example, the\
    \ scope of variable x within methodA() is 'local' to the method. It is a local\
    \ variable with local scope. The scope of the variable declared outside that method\
    \ is the class in which it is declared. You could say its scope is local to that\
    \ class.\n\nHowever, you will often hear programmers say that it is a 'global'\
    \ variable — meaning that its scope is widely or 'globally' visible to all the\
    \ methods in the class. The precise meaning of 'global' scope in programming varies\
    \ from language (a truly global variable would be visible to all the code everywhere\
    \ in your program). I prefer, therefore, to refer to 'class-level variables' to\
    \ describe variables whose scope is a single class.\n\n## Access Modifiers\n\n\
    You can restrict the visibility of methods by declaring them using private, public\
    \ or protected. When a method is private it can be accessed only from other methods\
    \ declared in the same class. This is useful if you want to make sure that code\
    \ that uses the class or objects created from that class cannot directly access\
    \ those methods.\n"
