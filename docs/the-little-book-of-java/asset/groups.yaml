    # Label Positions


    There are precise rules on where you can put the label for a labelled break or
    continue. Labels are used for breaking out of switch, for, while, or do-while
    statements by exiting the outermost statement. The label must appear *directly*
    above the outermost statement, with no other code between the label and that statement.


    If you find all this hard to follow, that is not surprising.. Breaking in this
    way is rarely the most elegant way of terminating a loop. It is a sort of *goto*
    statement that suddenly jumps out of a block of code and starts running code somewhere
    else. That sort of jump can sometimes be useful – when a critical condition means
    that you need to stop running a piece of code as fast as possible – but it can
    also be confusing and it risks introducing accidental bugs.


    For reason, whenever possible, you should try to terminate a loop only when the
    loop *condition* is met – for example when the test in a *while* loop or the expression
    in the second part of a *for* loop (e.g. column < 5) evaluates to *false*. There
    are some occasions when it is useful to break from a loop and you certainly need
    to understand how break and *continue* are used, but don''t be too enthusiastic
    about using them. As a general principle, you should avoid breaking out of loops
    if there is a simpler, and less confusing, alternative.'
