    ```


    This room has a name, "room2", a description, "Gold room" and then four exits.
    The North exit leads, in, to the room at index 0 in the map (that is the room
    with the name "room0"), the South exit leads to the room at index 4, the West
    exit is marked by the constant Direction.NOEXIT to indicate that there is no room
    in that direction, and the East exit leads to the room at index 3 in the map.


