    \n在包含许多行代码的复杂循环中，`break` 条件可能并不明显，很容易假设循环在 `i` 小于 10 时保证运行（这是循环条件的“逻辑”）。当你添加 `break`\
    \ 时，你正在破坏循环的“代码逻辑”。作为一个一般原则，除非你有充分的理由这样做，否则避免跳出循环更好、更清晰且更不容易出错。\n\n让我转向一个使用 `break`\
