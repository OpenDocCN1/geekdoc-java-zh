    \ `NoisyThing` 类创建猫和狗对象。假设我现在想要一个特定的 `Treasure` 类。`Treasure` 和 `NoisyThing` 都从它们的共同祖先\
    \ `Thing` 继承了名称和描述。我还希望这些类实现它们自己的 `describe()` 方法。由于我永远不会直接从 `Thing` 创建对象，我决定将\
    \ `Thing` 作为一个抽象类，它提供名称和描述的简单实现，并将 `describe()` 设置为抽象方法，因为该方法在子类中的实现方式将不同。\n\n\
    ```java\nAbstractClasses (Thing.java)\npublic abstract class Thing {\n    private\
    \ String name;\n    private String description;\n    public Thing(String aName,\
    \ String aDescription) {\n        // constructor\n        this.name = aName;\n\
    \        this.description = aDescription;\n    }\n    public String getName()\
    \ {\n        return name;\n    }\n    public void setName(String aName) {\n  \
    \      this.name = aName;\n    }\n    public String getDescription() {\n     \
    \   return description;\n    }\n    public void setDescription(String aDescription)\
    \ {\n        this.description = aDescription;\n    }\n    abstract public String\
    \ describe();\n}\n```\n\n## 第 8 章 — 枚举、接口与作用域\n\n这里需要注意的重要点是类本身被定义为抽象的，因此无法从它创建对象（尽管可以从它的子类创建），而且\
    \ `describe()` 方法也是抽象的。该方法不包含任何代码——每个子类都需要编写它们自己的 `describe()` 方法。这就是 `Treasure`\
    \ 类：\n\nAbstractClasses (Treasure.java)\n\n```java\npublic class Treasure extends\
    \ Thing {\n    private int value;\n\n    public Treasure(String aName, String\
