    # 类网络 (Class Networks)\n\n在本章中，我们学习了类被用创建对象的蓝图，以及后代类如何继承祖先类的特征。在某些类型的应用程序中，拥有多个“级”的继承可能是很有用的，例如类\
    \ D 继承自类 C；类 C 继承自类 B；类 B 继承自类 A。\n\n拥有多个“行”的继承关系也可能有用，即类 B 和类 X 都继承自类 A，而类 Y\
    \ 继承自类 B。通过情况下，我们可以创建复杂的类网络或“族树”。\n\n当我解释我的 Java 游戏项目时，我会展示一个复杂网络的真实示例，该项目将在后面的章节中开发，并在附录中进行总结。下面的图显示了\
    \ Adventure1 项目中“游戏对象”的网络。Thing 类有一个名称和描述。Actor 类和 Room 类都继承自 Thing 类，因此 Actor\
    \ 和 Room 对象也将具有名称和描述。\n\nActor 类定义了一个交互式角色（或游戏玩家）并添加了位置。Room 类定义了游戏地图中的房间，并添加了四个出口：n,\
    \ w 和 e。\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_74_0.png)\n\n# this 和 super\n\
    \n有时你会看到引用当前对象的关键字——即正在被创建的对象。它通常是省略的：`this.name = aName` 的效果与赋值 `name = aName`\
    \ 完全相同。然而，如果我直接将参数命名为 `name` 而不是 `aName`，那么就需要 `this` 关键字来消除歧义：`this.name = name`。\n\
    \n`super` 关键字的使用方式类似，用于引用父类中的变量和方法——例如，我们之前看到的父类构造函数，它再次经常用于消除祖先类和子类之间同名方法的歧义。我将在第\
    \ 9 章详细介绍方法的重写和重载。\n\n# 第 5 章 – 测试与运算符\n\n你经常需要使用运算符来更改和测试程序中的值，以便代码能够在在不同情况下采取不同的操作。这就是本章的主题。\n\
    \n在你的程序中，你经常需要测试两个变量的值是否相同或不同。Java 提供了“运算符”来帮助你进行这些测试。在本章中，我们将发现如何使用 Java 运算符来编写条件测试、修改变量值以及进行算术计算。\n\
    \n我们已经见过一些运算符——例如，在第 1 章的 Hello/Args 程序中，我们使用等等运算符 (==) 来测试命令行输入的参数数量 (args.length)\
    \ 是否等于 0：\n\n```\nif (args.length == 0)\n```\n\n我们在第 3 章的 TaxCalc 程序中使用了乘法 (*)\
    \ 和加法 (+) 运算符，以及赋值运算符 (=)。你可能记得，在那个程序中，我们将 `subtotal` 变量乘以 `TAXRATE` 常量，并将计算结果赋值给\
    \ `tax` 变量。将 `subtotal` 和 `tax` 变量的值相加并将结果赋值给 `grandtotal` 变量：\n\n```\ntax = subtotal\
    \ * TAXRATE;\ngrandtotal = subtotal + tax;\n```\n\n在本章中，我们将查看其他运算符。\n\n# 运算符\n\
    \n什么是运算符？简单来说，运算符是用于执行加法和乘法操作的特殊符号。\n\n# 赋值 (Assignment)\n\n最重要的运算符之一是赋值运算符，它将右侧的值分配给变量。注意，赋值的数据类型必须与变量的类型兼容：\n\
    \n```\nint IntVar = 10;\n```\n\n# 相等 (Equality)\n\n虽然一个等号 = 用于赋值，但两个等号 == 用于测试条件。你将在\
    \ `EqualsOps` 示例中找到一个更完整的示例，它测试了用户输入的值：\n\n```java\nif (IntVar == 1) {\n    textField2.setText(\"\
    Yes!\");\n} else {\n    textField2.setText(\"No!\");\n}\n```\n但这段代码有一个问题。在用户向\
    \ `textField1` 输入值之前，该字段是空的。如果我尝试使用 `Integer()` 将其内容转换为整数，将导致错误。我将在第 9 章讨论异常处理时，解释一些从错误中恢复的方法。在这里，只需通过测试字段是否包含空字符串来避免错误，从而显示错误信息，而不是尝试将字符串转换为整数。这是我的第一次尝试：\n\
    \n```java\nif (textField1.getText() == \"\") {\n    textField2.setText(\"You must\
    \ enter a number into textField..\");\n} else {\n    myIntVar = Integer.parseInt(textField1.getText());\n\
    \    if (myIntVar == 1) {\n        textField2.setText(\"Yes!\");\n    } else {\n\
    \        textField2.setText(\"No!\");\n    }\n}\n```\n\n我想从 `textField1` 获取文本并将其与空字符串比较：\n\
    \n```java\nif (textField1.getText() == \"\")\n```\n\n如果是空字符串，那么我想运行所有这些代码：\n\n\
    ```java\ntextField2.setText(\"You must enter a number into textField..\");\n```\n\
    \n如果不是空字符串，我想运行 `else` 关键字之后的所有代码：\n\n```java\n{\n    myIntVar = Integer.parseInt(textField1.getText());\n\
    \    if (myIntVar == 1) {\n        textField2.setText(\"Yes!\");\n    } else {\n\
    \        textField2.setText(\"No!\");\n    }\n}\n```\n\n但事实并非如此。当 `textField1`\
    \ 为空时，运行的是 `else` 之后的代码——这完全不是我想要的。要理解为什么，你必须理解 Java 如何处理字符串。\n\n# 比较字符串\n\n整数可以与另一个整数进行比较，因此如果\
    \ `myIntVar` 的值为 1，此测试将结果为真：\n\n```java\nif (myIntVar == 1)\n```\n\n"
