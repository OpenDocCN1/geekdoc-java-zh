    # Interfaces as ‘Contracts’


    An ‘interface’ is a definition of the code that a class must implement: it is,
    if you like, a ‘contract’ that the class using the interface must respect. If
    you have a contract to build a house, say, the contract isn’t the actual house,
    but it does specify (in more or less detail) what will be built and to what standards
    the house will be built.


    To see an example of a class that implements some interfaces, look at the ArrayList
    class which is declared like this:


