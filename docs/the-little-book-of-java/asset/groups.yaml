    \ `Room`。如果你想更深入地探索 `Map` 的可能性，可以尝试这样使用字符串键。\n\n# 第 7 章 — 循环\n\n计算机程序通常需要多次执行相同的任务。在本章中，我们将看到这些循环是如何工作的。计算机程序经常必须执行重复动作，例如打印一系列字符串直到没有更多可打印，或者计算收集的宝藏数量。最常见的循环类型可能是\
