  - "[PAGE 156]\n\n# Chapter 9 — Generics and Exceptions\n\nI was able to specify\
    \ types for the HashMap keys and values due to the fact that the HashMap class\
    \ is generic and, just as ArrayList has the <E> placeholder, a HashMap has a pair\
    \ of placeholders <K, V> that can be replaced by actual types when a HashMap object\
    \ is declared and created in your own code.\n\n# Generic Classes\n\nYou can write\
    \ your own generic classes which, just like the generic ArrayList class, can be\
    \ used to handle objects of different types. This is how I would declare a simple\
    \ generic class:\n\n| Generics (MyGenericClass.java) |\n| public class MyGenericClass<T>\
    \ {} |\n\nHere <T> is the 'type parameter'. It provides a placeholder for a real\
    \ type so that this type can then be used inside the class. This is how I declare\
    \ a private variable someData of the type T:\n\n```\nprivate T someData;\n```\n\
    \nIf I want to provide a constructor to initialize this variable, I do so by declaring\
    \ the input parameter as being of type T:\n\n```\npublic MyGenericClass(T aValue)\
    \ {\n    someData = aValue;\n}\n```\n\nAs just with a normal class, I can provide\
    \ getter and setter methods to assign or return the values of private variables,\
    \ once again being sure of the type as T:\n\n```\npublic T getObjData() {\n  \
    \  return someData;\n}\n\npublic void someData(T someData) {\n    this.someData\
    \ = someData;\n}\n```\n\n157"
