    # Chapter 3 – Elements of Java Programming


    to assign numeric literals to variables of other numeric data types the Java compiler
    may complain. If, for example, you try to assign to a long variable a numeric
    integer (int) that is bigger than the maximum value of an int, the compiler (or
    your IDE, such as NetBeans) will complain that the numeric number is too large.
    Look at this example:


    ```

    long l = 1;

    l = 922337203685477580L;

    ```


    Even though a long (such as the variable l) is capable of holding the value 922337203685477580,
    this assignment is an error because an integer literal is treated as an int –
    and an int has a maximum value of 2147483647. In NetBeans I see this error message:


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_51_0.png)


    In order to fix this I need to tell the compiler that this numeric literal is
    a long value. I do that by appending an l to the number like this:


    ```

    l = 922337203685477580L;

    ```


    Similarly, if you need to assign a floating point literal (which is by default
    treated as double) to a float variable, you can append an F to the literal like
    this:


    ```java

    float f;

    f = 3.4028235E38F;

    ```


    If you are unsure of the minimum and maximum ranges of numeric types, the constants
    MIN_VALUE and MAX_VALUE provided by the wrapper classes for each type return the
    appropriate values:


    | Byte.MIN_VALUE | Byte.MAX_VALUE |

    | :--- | :--- |

    | Short.MIN_VALUE | Short.MAX_VALUE |

    | Integer.MIN_VALUE | Integer.MAX_VALUE |

    | Long.MIN_VALUE | Long.MAX_VALUE |

    | Float.MIN_VALUE | Float.MAX_VALUE |

