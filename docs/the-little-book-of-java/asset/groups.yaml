    Chapter 3 – Elements of Java Programming


    # # Chapter 3 – Elements of Java Programming


    In this chapter we''ll look at how different types of data are categorised and
    how data items are assigned to variables.


    When your programs do calculations or display some text, use data. The data items
    each have a data type. For example, to do calculations you may use integer numbers
    such as 10 or floating point number such as 10.5. In a program you can assign
    values to named variables.


    # ## Variables and Types


    In Java, each variable must be declared with the appropriate data type. This is
    how to declare a floating-point variable namedDouble with the double data-type:


    ```

    myDouble;

    ```


    You can now assign a floating-point value to that variable:


    ```

    myDouble = 100.75;

    ```


    Alternatively, you can assign a value at the same time you declare the variable:


    ```

    myDouble = 100.75;

    ```


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_38_0.png)


    # ## Variables without Types?


    It is also possible, in some cases, to declare a variable using the keyword var
    instead of specifying its data type. Java may then work out or ‘infer’ the actual
    data type. In most cases, you should specify an actual data type as int, double
    or string whenever you define a variable.


