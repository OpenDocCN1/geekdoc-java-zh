    private String description;\n```\n\n# 第 4 章 — 面对象\n\n当类内部的变量是私有的时，类外部代码无法访问它们。为了访问我的私有变量，我编写了这些“get”和“set”访问器方法：\n\
    \n# 对象 (Thing.java)\n\n```\npublic String getName() {\n    return name;\n}\n\n\
