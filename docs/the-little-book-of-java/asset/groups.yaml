    | someText = textField.getText(); | upperCaseField.setText(someText.toUpperCase());\
    \ |\n| myButton.setText(\"Thank you!\"); | |\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_36_0.png)\n\
    \nTo get or set the title of a JFrame (the main window of your application), use\
    \ getTitle() and setTitle(). In my sample program I call these methods using the\
