    \ be displayed:\n\n```\nHello worldHello worldHello world\n```\n\nYou can embed\
    \ newline(\"\\n\").\n\n# PrintText.java\n\n```\nSystem.out.print(\"\\tHello \"\
    );\nSystem.out.print(\"world\\n\");\nSystem.out.println(\"Hello\\tworld\");\n\
    ```\n\nThis would be displayed:\n\n```\nHello\nworld\n```\n\n# printf\n\nThe printf()\
    \ function allows you to embed 'format specifiers' into a string. A format specifier\
    \ begins with a % and is followed by a letter: %s specifies a string; %d specifies\
    \ an integer. When format specifiers occur in the string, the string must be followed\
    \ by a comma-delimited list of values. These values will replace the specifiers\
    \ in the string. The programmer must take care that the values in the list exactly\
    \ match the types and the number of format specifiers in the string. Here is an\
