    # Chapter 4 — Object Orientation


    The MyClass class also has an instance (non-static) variable, obnumber:


    ```

    private int obnumber;

    ```


    Each time a new object is created the constructor assigns the current value of
    obcount to this variable:


    ```

    obnumber = obcount;

    ```


    This means that each time a new object is created the static variable obcount
    is incremented and so it will store an integer representing the total number of
    objects that have been created. There is only *one copy* of this static variable.
    So even if there are many objects this static variable will always have a *single
    value*.*


    The instance *obnumber* is also incremented each time a new object is created.
    However, each object will have its own copy of this instance variable so each
    object will have a *different value* for obnumber.


    Let''s suppose you were to create three objects, namely 3. ob1, ob2 and ob3. The
    number of ob1 would be the original value of the variable – that''s 0 plus 1;
    so for ob1, its value be 1; for ob2 its value would be 2 and for ob3 its value
    would be 3.


    But the count variable, which belongs to the class rather than to any individual
    object, would be the same for all three objects – We can verify this. Here is
    the code which runs when the button labelled ''Object Methods'' is clicked:


    # Methods (NewJFrame.java)


    ```

    MyObject ob1;

    MyObject ob2;

    MyObject ob3;


    outputTA.setText("");

    outputTA.append(MyObject.numberOfObjects());

    obob1 = new MyObject();

    outputTA.append(MyObject.numberOfObjects());

    ob2 = new MyObject();

    outputTA.append(MyObject.numberOfObjects());

    ob3 = new MyObject();

    outputTA.append(MyObject.numberOfObjects());

    outputTA.append("when all objects have been created: "

    + MyObject.numberOfObjects());

    outputTA.append(ob1.objectInfo());

    outputTA.append(ob2.objectInfo());

    outputTA.append(ob3.objectInfo());

    ```'
- md: "\n# Chapter 4 — Object Orientation\n\nThis is what is displayed:\n\n| | |\n\
