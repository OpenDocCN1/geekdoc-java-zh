    ## Chapter I — Getting Started


    ### What will You Learn?


    This book assumes no prior knowledge of programming in general or the Java language
    in particular. It teaches you everything you need to write, compile and run Java
    programs on a PC, Mac or (in principle) any other system capable of running Java.
    It will teach you the fundamentals of programming, including Object Oriented programming.
    It will explain how to create objects, handle data and deal with files on disk.
    If you already have some programming experience, feel free to skip over the early
    sections of the book. It will be sure to download the ready-to-run code samples
    provided in the source-code archive available from the publisher’s web site.


    ## How to Follow this Book


    It is entirely up to you to decide whether you prefer to read this book, by chapter,
    from start to finish or just ‘jump in’ to specific sections that are of interest
    to you. If you are new to programming, I would suggest that you read everything
    in strict order. If you are an experienced programmer – but new to Java – you
    may want to read the introductory information about IDEs and compilation then
    browse to topics that are unfamiliar to you.


    Remember that source code is available for all the projects described in this
    book. You may prefer to run the code first and then read the explanations in the
    book. I would also recommend that you try modifying and extending my example code
    to help you understand how the Java language works.


    ## Download the Source Code


    All the source code shown in this book is available for download. Just sign up
    to your mailing list and we will send you the download link:


    www.bitwisebooks.com/subscribe


    ## Install Java


    If you don’t already have Java installed, you should download it from:


    https://www.java.com/


    There are two components needed in developing Java – the Java Runtime Environment
    or JRE and the Java Development Kit (the compiler and libraries) or JDK. You must
    install the JDK. The JDK is usually installed as well.


    ## Installation Help


    The Java web site has links to Help on installing and using Java on different
    operating systems: https://www.java.com/. It is important to read this help information
    in order to avoid or fix any potential problems.


    ## Which IDE?


    You can load the source code into any programming editor that supports Java syntax.
    The projects were developed using the NetBeans IDE. If you are unsure which IDE
    to use, I recommend using NetBeans.


    To install NetBeans, download one of the ready-to-run installation programs from:


    https://netbeans.apache.org/


    ## Using NetBeans


    When you don''t have use NetBeans in order to write and run my Java programs,
