- md: "\n## Chapter 8 — Enums, Interfaces and Scope\n\n## An Abstract Class Example\n\
    \nIn Chapter 4 I explained how to create a simple class hierarchy (the Objects\
    \ project) in which a Thing class defined a name and a description. A descendant\
    \ class, NoisyThing, added on a noise and a volume.\n\nI was then able to create\
    \ treasure objects from the Thing class and cat and dog objects from the NoisyThing\
    \ class. Let's suppose I now want a dedicated Treasure class. Both Treasure and\
    \ NoisyThing inherit its name and description from their common ancestor Thing.\
    \ I also want these classes to implement their own describe() methods. Since I\
    \ will never create objects directly from Thing, I decided to make Thing an abstract\
    \ class that provides a simple implementation of name and description and makes\
    \ describe() abstract because that method will be implemented differently in the\
    \ descendant classes.\n\n```java\nAbstractClasses (Thing.java)\npublic abstract\
    \ class Thing {\n    private String name;\n    private String description;\n \
    \   public Thing(String aName, String aDescription) {\n        // constructor\n\
    \        this.name = aName;\n        this.description = aDescription;\n    }\n\
    \    public String getName() {\n        return name;\n    }\n    public void setName(String\
    \ aName) {\n        this.name = aName;\n    }\n    public String getDescription()\
    \ {\n        return description;\n    }\n    public void setDescription(String\
    \ aDescription) {\n        this.description = aDescription;\n    }\n    abstract\
    \ public String describe();\n}\n```\n\n## Chapter 8 — Enums, Interfaces and Scope\n\
    \nThe important things to notice here is that the class itself is defined as abstract,\
