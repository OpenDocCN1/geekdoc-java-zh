    \ 中，它显示在项目窗口的源包 `Source Package\\helloworld` 分支）。现在我们来尝试识别这段代码的核心部分。程序开始于：\n\n\
    ```\nHelloWorld (HelloWorld.java)\n```\n\n```java\nHelloWorld (HelloWorld.java)\n\
