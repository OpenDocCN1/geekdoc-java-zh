    \ Thing mySword; Thing myRing |\n\n在使用这些对象之前，我需要创建它们。我通过使用 `new` 关键字后跟构造函数名称以及括号（如果构造函数不需要参数）来实现。事实上，`Thing`\
    \ 构造函数需要两个字符串 aName 和 aDescription，因此我在括号之间放置了两个逗号分隔的字符串：\n\n```\nmySword = new\
    \ Thing(\"Dwarf Sword\", \"a sword of great power\");\nmyRing = new Thing(\"Elvish\
    \ Ring\", \"a golden ring of magic power\");\n```\n\n当你这样调用构造函数时，会创建一个对象并用传递给构造函数的数据初始化其字段。新创建的对象可以赋值给类型相同的变量。\n\
    \n# 类层次结构\n\n面向对象的核心特征之一是继承。简单来说，这意味着你可以创建一个类的族树，使得一个或多个类继承另一个类的特征。\n\n被继承特征的类可以认为是祖先，继承祖先类特征的类可以认为是它的后代。后代类也称为子类。祖先类通常被称为父类。\n\
    \n假设我想创建一个 `NoisyThing` 类，它是 `Thing` 的一种“类型”——因此它继承了 `Thing`类的特征，即名称和描述，但它又增加了两个新特征：噪音和音量。你可以这样理解：\n\
    \n要创建一个子类，你需要在新类名和其父类名之间放置 `extends` 关键字。我是这样声明的：\n\n```java\nclass NoisyThing\
    \ extends Thing\n```\n\n子类继承其祖先类的特征（方法和变量），因此你不需要重新编写它们。在这个示例中，`Thing` 类有两个变量\
    \ name 和 description，以及四个访问这些变量的访问方法 `getName()`、`setName()`、`getDescription()`\
    \ 和 `setDescription()`。\n\n"
