    \ responsibility to assume that the end user, at some time or another, do stupid\
    \ things – things that could cause your program to produce incorrect results or\
    \ to crash. It is in your interests, therefore, to build into your code some means\
    \ of recovering from potential disaster. Exceptions can help."
