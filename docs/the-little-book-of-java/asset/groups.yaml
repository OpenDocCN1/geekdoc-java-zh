    \ assign values to named variables.\n\n## Variables and Types\n\nIn Java, each\
    \ variable must be declared with the appropriate data type. This is how to declare\
    \ a floating-point variable named myDouble with the double type:\n\n```\ndouble\
    \ myDouble;\n```\n\nYou can now assign a floating-point value to that variable:\n\
    \n```\nmyDouble = 100.75;\n```\n\nAlternatively, you can assign a value at the\
    \ same time you declare the variable:\n\n```\ndouble myDouble = 100.75;\n```img/8c3ac46909d3d5f277ec850365ee22ff_38_0.png)\n\
    \n## Variables without Types\n\nIt is also possible, in some cases, to declare\
    \ a variable using the keyword var instead of specifying its data type. Java may\
    \ then work out or ‘infer’ the actual data type. In most cases, you should specify\
    \ an actual data type as int, double or string.\n\n# Constants\n\nThe value of\
    \ a variable can be changed. So, for example, if you were to write a tax calculator\
    \ that allowed the user to enter a subtotal and then calculated both the tax and\
    \ grand total (the subtotal plus the tax), you might have three floating point\
    \ variables (double) named subtotal, tax and grandtotal.\n\nThese variables could\
    \ be assigned different values each time a new calculation is done, based on numbers\
    \ entered by the user. You could also change the values in your code, like this:\n\
    \n```\nsubtotal = 10.0;\nsubtotal = 20.2;\nsubtotal = 15.6;\n```\n\nBut sometimes\
    \ you may want to make sure that a value cannot be changed. For example, if the\
    \ tax rate is 20% you might declare a variable like this:\n\n```\ndouble TAXRATE\
