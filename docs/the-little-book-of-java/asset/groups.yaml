    \      exit = r.getW();\n      break;\n    default:\n      exit = Direction.NOEXIT;\n\
    \      break;\n  }\n  if (exit != Direction.NOEXIT) {\n    moveActorTo(anActor,\
    \ (Room) map.get(exit));\n  }\n  return exit;\n}\n```\n\nI have deliberately moveTo()\
    \ capable of moving any interactive character (in my program, interactive character\
    \ is an instance of the Actor class) since later on I may want to add other characters,\
    \ just like the player of the game, can move around the map and collect treasures.\
    \ The moveTo() method tries to match the value of the Direction parameter using\
    \ a switch statement.\n\nThe advantage of using the Direction enum here is clarity.\
    \ When I used identifiers such as EAST and WEST it is obvious that I am trying\
    \ to move the player in the specified compass direction.\n\nYou will also notice\
    \ that I have defined Direction.NOEXIT. This is used not only here but when I\
    \ create the map in the Game() constructor. In this project the map is a simple\
    \ ArrayList and each room in that list occupies a fixed position. The exits from\
    \ room to another are simply integers which indicate the map index of the room\
    \ at any given exit:\n\n## Adventure2 (Game.java)\n\n```\nmap.add(new Room(\n\"\
    room0\", \"You are west of a house\", Direction.NOEXIT, 2, Direction.NOEXIT, 1));\n\
    map.add(new Room(\n\"room1\", \"White House\",Direction.NOEXIT, 0, Direction.NOEXIT));\n\
    map.add(new Room(\n\"room2\", \"Gold room\", 0, 4, Direction.NOEXIT, 3));\nmap.add(new\
