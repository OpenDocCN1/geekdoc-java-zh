  - "[PAGE 79]\n\n# Chapter 5 – Tests and Operators\n\nHowever, when I compare a string\
    \ \"1\" with another string \"1\" the test evaluates to false. In other words,\
    \ Java considers two integers with identical values to be the same but two strings\
    \ with identical values to be different.\n\n# String.equals()\n\nIn order to determine\
    \ if two strings contain identical characters (or no characters at all) you need\
    \ to use the equals() method of the string object. This is how I rewritten my\
    \ test (which now works as I intended):\n\n| EqualsOps |\n| if (\"\".equals(textField1.getText()))\
    \ {\n  textField2.setText(\"You must enter a number into textField1.\");\n}|\n\
    \n# String Equality\n\nLet's consider why two apparently identical strings are\
    \ considered to be different. It turns out that each string occupies its own chunk\
    \ of memory and it is, therefore, considered to be different from every other\
    \ string. Remember, in Java, an integer is a simple piece of data – a primitive.\
    \ But a string is an object – and every object is different from every other object.\
    \ This is true even when two strings contain exactly the same characters.\n\n\
    ![](img/8c3ac46909d3d5f277ec850365ee22ff_79_0.png)\n\n# Strings are Objects?\n\
    \nNot all programming languages deal with strings this way. Even the C# language\
    \ which is, in many, very similar to Java, allows you to test two strings using\
    \ the regular == equality operator. In C#, when two different strings contain\
    \ the same characters, a test using the == operator, returns true. In Java, it\
    \ returns false. You have to bear in mind that Java treats strings like any other\
    \ objects. Two cat objects, catA and catB, both have the same name, \"Tiddles\"\
    , but they are nevertheless two different objects. Java treats string comparisons\
    \ in the same way!\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_79_1.png)\n\n80"
  - '[PAGE 80]


    Let''s suppose you initialize two strings as follows:


    ```

    String s1 = new String("Hello");

    String s2 = new String("Hello");

    ```


    Now you compare s1 and s2 using this test:


    ```

    (s1 == s2) // This evaluates to false

    ```


    The test evaluates to false because, even though the two strings contain the same
    characters, s1 is a different string object (I''ve created each explicitly using
    new) to s2. The same will be true of any string objects that are created at runtime
    (for example, by assigning the text from a text field to a string variable).


    However, when two identical strings are assigned to variables (without creating
    new objects) they will reference (or ''point to'') the same string. That is because
    string literals created in your code before compiling an application are saved
    into a ''table'' of strings and any variable that is assigned to that string will
    reference this stored value. As a consequence, two variables such as below, which
    are assigned the same string will return true when tested for equality using the
    == operator:


    | StringCompare |

    | String s1 = "Hello"; String s2 = "Hello"; |


    (s1 == s2) // This evaluates to true


    That is why Java strings have the equals() method. This method compares the characters
    in two strings and return true if those characters are the same.


    # Which is the ‘Best’ Way To Test Strings?


    Look at the code in the StringCompare project to help you understand how strings
    are compared in Java. If you find this confusing, just remember that in most cases,
    it is not a good idea to compare strings using the == operator. You should, instead
    use the equals() method. Whereas the == operator returns different results depending
    on how and when a string was assigned to a variable, the equals() method is consistent
    in all cases.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_80_0.png)'
