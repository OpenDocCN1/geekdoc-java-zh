    As explained earlier, any text placed between the characters /* and */ is treated
    as a comment and is ignored by the Java compiler. A comment can be used to document
    your code or provide copyright or licensing details. The first line of real Java
    code occurs here:


    ```

    package helloworld;

    ```


    Each package is a keyword – that is, it is a predefined word that has a special
    meaning in a Java program, and helloworld is a name or ''identifier'' which I
    have chosen for the current package. The statement is terminated by a semicolon.
    Semicolons are widely used in Java to mark the end of a statement.


