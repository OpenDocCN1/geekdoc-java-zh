    # Visual Java Applications


    Most of the applications that we run on our computers have some sort of ''visual''
    user interface. Everything from a calculator to a word processor pops up in its
    own window which contains a number of ''components'' such as buttons and text
    fields. It turns out that Java (especially when used from an IDE like NetBeans)
    makes it very easy to create visual applications and some of the programs described
    in this book, and provided in the source code archive, will have ''visual'' user
    interfaces rather than having to run from the command line.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_31_0.png)


    This is "Hello World" with a user interface (the HelloVisual project in the code
    archive).


    # Visual Design in Other IDEs


    Other IDEs such as Eclipse and IntelliJ also provide visual Graphical User Interface
    (GUI) designers. Typically a Java visual interface relies upon a set of Java tools
    and classes called Swing. Note, however, that a design created using one IDE may
    not be directly editable in another IDE. The visual designs supplied in the code
    archive of this book have all been created with NetBeans.'
