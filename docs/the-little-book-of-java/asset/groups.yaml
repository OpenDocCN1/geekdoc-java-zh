    # Troubleshooting


    In some circumstances, instead of the expected output, Java may show an error
    message such as:


    ```

    Error: Could not find or load main class

    ```


    There are a number of possible reasons for this. For example, this message might
    appear if the HelloWorld.class file does not exist (maybe you haven''t compiled
    your project yet); or you might have entered the wrong name or used the wrong-mix
    of upper and lowercase letters (Java is ‘case sensitive’ so if your class is called
    HelloWorld with a capital H and W but you enter hello/HelloWorld (with a lowercase
    w) the class will not be found. Or maybe you are in the wrong directory. Make
    sure you are in the .classes directory. Or possibly you didn''t compile the main
    class in the specified package. You can check this by highlighting the HelloWorld
    project in NetBeans and selecting File | Project Properties. Then select the Run
    node in the dialog. Check that the Main Class is shown as hello.HelloWorld where
    HelloWorld is the package name and HelloWorld is the class name.


    Even if you have problems running from the command prompt, don''t worry. If you
    are using the NetBeans IDE, as I recommend, you will be able to compile and run
    programs using menus and buttons within the IDE itself rather than from the command
    prompt.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_23_0.png)


    # Using the Command Prompt


    If you plan to compile and run programs from the command prompt, you may want
    to read Oracle’s documentation:


    http://docs.oracle.com/javase/tutorial/getStarted/cupojava/index.html


    Oracle also has a problem-solving guide to help you identify and fix common errors:


    http://docs.oracle.com/javase/tutorial/information/run-examples.html


