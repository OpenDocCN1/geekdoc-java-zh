    \ ch, int from)\n```\n\n从指定的索引处开始搜索，返回指定字符在此字符串中第一次出现的索引。\n\n```java\nindexOf(String\
    \ str)\n```\n\n返回指定子字符串在此字符串中第一次出现的索引。\n\n```java\nindexOf(String str, int fromIndex)\n\
    ```\n\n从指定的索引处开始搜索，返回指定子字符串在此字符串中第一次出现的索引。\n\n这里是一个使用所有这些方法的示例：\n\n| indexOf |\n\
    | :--- |\n| `public static void main(String[] args) {` |\n| `String s = \"The\
    \ quick brown fox jumps over the lazy dog\";` |\n| `System.out.printf(\"s.indexOf(\\\
    \"quick\\\") = %d\\n\", s.indexOf(\\\"quick\"));` |\n| `System.out.printf(\"s.indexOf(\\\
    \"e\\\") = %d\\n\", s.indexOf(\\\"e\"));` |\n| `System.out.printf(\"s.indexOf(\\\
    \"the\\\", 3) = %d\\n\", s.indexOf(\\\"the\\\", 3));` |\n| `System.out.printf(\"\
    s.indexOf(\\\"u\\\", 3) = %d\\n\", s.indexOf(\\\"u\\\", 3));` |\n| `}` |\n\n这是输出结果：\n\
    \n```\ns.indexOf(\"quick\") = 4\ns.indexOf(\"e\") = 2\ns.indexOf(\"the\", 3) =\
    \ 31\ns.indexOf(\"u\", 3) = 5\n```\n\n# 类方法\n\n通常，当你想要使用由某个类提供的方法时，必须根据该类创建一个新对象。然后你就可以从该对象调用该方法。例如，如果你想获取\
    \ `Room` 对象的北出口，首先需要创建一个新的 `Room` 对象，然后像这样从该对象调用 `getN()` 方法：\n\n```java\nRoom\
    \ goldRoom;\nint exit;\ngoldRoom = new Room(\"room2\", \"Gold room\", 0, 4, Direction.NOEXIT,\
    \ 3);\nexit = goldRoom.getN();\n```\n\n上所示的代码片段假设你已经定义了一个 `Room` 类（正如示例项目 `AdventureGame1`\
    \ 所示，我稍后会解释）。\n\n有时，在不需要创建对象的情况下调用方法是有用的，例如为了将字符串 \"200\" 转换为其整数表示 200。你可以这样做，比方通过先创建一个新的\
    \ `Integer` 对象，然后将字符串作为参数调用 `valueOf()` 方法，如下：\n\n```java\nInteger intOB;\nint\
    \ anInt;\nString s = \"200\";\n\nintOB = new Integer(0);\nanInt = intOB.valueOf(s);\n\
    ```\n\n然而，这是完成一个非常简单任务的一种非常复杂的方法。我创建一个简单的 `Integer` 对象是为了调用定义在 `Integer` 类内部的转换方法\
    \ `valueOf()`。如果我不需要先创建 `Integer` 对象就可以调用 `valueOf()`，那样会整洁得多。事实上，我可以做到这一点。我不需要从\
    \ `Integer` 类创建对象，而是可以直接从类本身调用 `valueOf()`，如下：\n\n```java\nInteger.valueOf(s);\n\
    ```\n\n你会在 `ClassMethods` 项目中找到这个示例。我有一个字符串变量 `s`，值为 \"200\"（在实际程序中，这可能是用户通过文本框输入的，也可能是从磁盘上的文件中读取的）。当我在计算中使用该值时，我调用\
    \ `Integer.valueOf(s)` 来返回一个整数值：\n\n```java\nint x;\nint total;\nString s;\n\n\
    s = \"200\";\nx = 5;\ntotal = x * Integer.valueOf(s);\n```\n\n许多其他标准 Java 类也提供了可以通过这种方式调用的方法。例如，`String`\
    \ 类提供了 `format()` 方法，它允许你通过在由“格式占位符”标记的位置嵌入值来创建一个字符串（就像我们在第 2 章描述的 `printf()`\
    \ 函数中使用的那样）：\n\n# 静态方法 (static Methods)\n\n`String` 类提供了 `format()` 方法，它允许你通过在由“格式占位符”标记的位置嵌入值来创建一个字符串（就像我们在第\
    \ 2 章描述的 `printf()` 函数中使用的那样）：\n\n```java\nString.format(\"%d %s\", x, s);\n```\n\
    \n为了能够直接从类调用，方法必须被声明为 `static`。这意味着该方法属于类，而不是属于任何特定的对象。这对于那些不需要特定对象的状态即可运行的方法是非常用的。\n\
    \n`ClassMethods` 项目提供了此方面的很好的示例：\n\n```java\npublic static class ClassMethods\
    \ {\n    private static int count = 0;\n    public static int valueOf(String s)\
    \ {\n        count++;\n        return Integer.parseInt(s);\n    }\n}\n```\n\n"
