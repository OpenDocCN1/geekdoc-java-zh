    add() and remove() methods. If it fails to do so, it will be an error.


    What’s more, every other class that implements the List interface must also provide
    their own size(), add() and remove() methods. Each class may implement those methods
    in different ways. For example a TreasureList and a BeerList class might both
    implement the List interface. The List interface defines the size() method like
    this:


    ```

    int size();

