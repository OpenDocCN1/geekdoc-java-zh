    Java defines a number of ''reserved'' words or keywords that have special meanings
    in the language. For example, when we start testing values, we will use the if
    and else keywords. The following keywords are found in the HelloWorld program:


    ```

    package public class static void

    ```


    For now you need not be concerned about what these all mean. The most important
    Java keywords will be explained later in this book.


