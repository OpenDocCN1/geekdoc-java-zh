    # # Chapter I – Getting Started


    Before you can program in Java, you need to understand what Java is and what tools
    you need to write Java programs.


    If you already have a Java editor and compiler installed and you know how to run
    and build Java programs, you are all ready to go. When I wrote the code for this
    book, I used the NetBeans IDE (Integrated Development Environment). Even if you
    generally use some other editor, I recommend that you use NetBeans so that you
    will be able to load and run my programs in the simplest possible way.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_8_0.png)


    # ## What is Java?


    Java is a cross-platform Object Oriented language. You write Java programs in
    high-level human-readable programming code in files ending with .java. The Java
    compiler translates this text into a compressed non-human-readable called bytecode
    which can be run by a program called the Java Virtual Machine (JVM). Any operating
    system that can run a Java Virtual Machine (and these days most) is able to run
    your Java bytecode. This is why Java programs are highly portable across different
    platforms and operating systems. Java was developed in the mid ''90s by-grammers
    at Sun Microsystems. In 2010 Sun was acquired by Oracle Corporation.'
