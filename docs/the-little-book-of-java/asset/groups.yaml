    ## Chapter 6 — Arrays and Collections


    Before it can be used, an ArrayList has to be created just like any other Java
    object, using the keyword `new` followed by the name of the class''s constructor
    method:


    ```

    aList = new ArrayList();

    ```


    Now you can use the methods available to ArrayList objects such as `add()` to
    add an element and `get()` to retrieve an element at a specific index:


    ```

    aList.add("hello");

    aList.add(20);

    System.out.println(aList.get(0));

    System.out.println(aList.get(1));

    ```


    ## Garbage Collection


    C and Pascal programmers may be alarmed to see that I keep creating objects using
    `new` but I never bother to dispose of them (to free up their memory). I don''t
    do this because I don''t need to. In Java, when objects are no longer required
    (i.e. they are no longer referenced by anything in your program), Java gets rid
    of them. This is called ‘garbage collection’. Once upon a time, garbage-collecting
    languages were rare. These days, many languages ranging from C# to Ruby provide
    garbage collection.


    ## Typed ArrayLists


    While it is permissible to store elements of mixed types — such as both integers
    and strings in an untyped `ArrayList` object, you can also ensure that only elements
    of a specific type are allowed. In order to do this, you need to place the type
    name, such as `Integer` or `String`, between a pair of angle-brackets after the
    `ArrayList` class name when you declare the variable, like this:


    ```

    ArrayList<String> stringList;

    ```


    When you create a `typed` ArrayList object you need to place an empty pair of
    angle brackets before the parentheses of the ArrayList constructor:


    ```

    stringList = new ArrayList<>();

    ```


    The empty pair of angle brackets <> is sometimes called the ''diamond operator''.
    Instead of using empty angle-brackets when creating an ArrayList object, some
    programmers like to repeat the element-type name between the angle-brackets:


    ```

    stringList = new ArrayList<String>();

    ```


    In early versions of Java, this syntax was obligatory. In modern versions of Java
    (from Java 7 onwards) it is optional but not required.


    Having created the stringList object as an ArrayList to hold strings, you can
    now use the methods of ArrayList to add, get or remove string elements:


    ```

    stringList.add("hello")

    stringList.add("20")

    System.out.println(stringList.get(0));

    System.out.println(stringList.get(1));

    stringList.remove(0);

    ```


    You cannot add other element types, however. For example, this is not allowed


    ```

    stringList.add(20); // Not allowed. stringList is typed for strings

    ```


    ## Generics


    A typed ArrayList such as my stringList object is an example of Java’s ''generics''.
    A generic list is one that provides the behavior needed to operate on lists of
    different types of element.


    In other words, the list-manipulation code is ''general purpose'' – capable of
    operating on many types of object – and you are able to use it with specific types
    of object by specifying a name between angle-brackets. Just as I created an ArrayList
    object to store String elements, I could create another ArrayList object to store
    Integer elements like this:


    ```

    ArrayList<Integer> intList;

    intList = new ArrayList<>();

    intList.add(100);

    intList.add(200);

    System.out.println(intList.get(0));

    System.out.println(intList.get(1));

    ```


    ## Generics Work with Objects!


    Be sure to specify classes as Integer rather than primitive types such as int.
    Generic lists operate on objects, not primitives.


    Of course, just as I cannot add an Integer to an ArrayList to hold String objects,
    I cannot add strings to an ArrayList to hold Integer objects, so this is not permitted:


    ```

    intList.add("hello"); // Not allowed. intList is typed for Integers

    ```


    If you want to try out the other methods available to ArrayList, refer to Oracle''s
    online documentation (see the Appendix). Here''ll just mention two more important
    methods: remove() which removes an element at an index and size() which returns
    the number of elements:


    ```

    stringList.remove(0);

    System.out.println("Now stringList size = " + stringList.size());

    ```


    As always, I recommend that you run my sample code (the ArrayLists project) in
    order to understand how this works. I''ll be exploring generic lists in more detail
    in Chapter 9.


    ## Maps and Dictionaries


    Sometimes it may be useful to index a collection of objects by something other
    than their numerical positions in a list. For example, in a dictionary it would
    be able to look up the definition of a word by searching for the word itself rather
    than its page number. In programming terms, the entries in a dictionary would
    be said to be up of key-value pairs where the key is the word itself and the value
    is its associated definition.


    In Java, you can create dictionary-like collections with something called a ''map''.
    Map is the name of an interface which defines a collection of key-value pairs
    in which the key is used to look up a value.


    In some programming languages, this type of collection may be called an ''associative
    array'', a ''hash'' or a ''dictionary''. In fact, Java also has a Dictionary class
    which supplies similar functionality to a Map but that class is now considered
    to be obsolete and is recommended that programmers use classes that implement
    the Map interface instead of Dictionary.


    ## HashMap


