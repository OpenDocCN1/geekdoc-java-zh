    \ 声明之后，我们来到：\n\n```\npublic class HelloWorld {\n```\n\n## 类（Classes）\n\n如果你以前编写过面向对象的语言，可能对类的概念很熟悉。如果这是你第一次接触它，只需知道类定义了一个代码“块”。在这个程序中，类位于大括号内。这个类非常简单：\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String[] args)\
