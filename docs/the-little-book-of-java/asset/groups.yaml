    \ 3，所以当 `i` 值为 3 时，循环代码不再运行：\n\n```\nString[] somewords = {\"one\", \"two\", \"\
    three\"};\n\nfor (int i = 0; i < somewords.length; i++) {\n    System.out.println(i\
    \ + \" : \" + somewords[i]);\n}\n```\n\n这产生了以下输出：\n\n```\n0 : one\n1 : two\n2\
    \ : three\n```\n\n## for...each\n\n我们还看到了另一种类型的 `for` 循环，它没有循环变量或终止测试。这种循环遍历集合中的所有项。你可能记得在第\
    \ 6 章我使用这种循环来遍历 `HashMap` 对象的 `keySet()` 方法返回的所有字符串：\n\n| RoomMap |\n| :--- |\n\
    | for(String key: map.keySet()) |\n\n这种循环有时被称为“增强型 for”语句，它类似于某些其他编程语言提供的 `foreach`\
    \ 或 `forin` 循环。增强 `for` 循环的语法可以总结为：\n\n> for (type variableName: collection) {statements}\n\
    \n这里 `type` 是存储在集合中的元素类型名称。这是一个打印 `somewords` 数组中每个字符串的示例：\n\n```\nfor (String\
    \ word:somewords){\n    System.out.println(word);\n}\n```\n\n109\n\n"
