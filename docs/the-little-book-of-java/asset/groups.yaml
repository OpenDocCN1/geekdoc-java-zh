- md: "\n# Label Positions\n\nThere are precise rules on where you can put the label\
    \ for a labelled break or continue. Labels are used for breaking out of switch,\
    \ for, while, or do-while statements by exiting the outermost statement. The label\
    \ must appear *directly* above the outermost statement, with no other code between\
    \ the label and that statement.\n\nIf you find all this hard to follow, that is\
    \ not surprising. Breaking in this way is rarely the most elegant way of terminating\
    \ a loop. It is a sort of *goto* statement that suddenly jumps out of a block\
    \ of code and starts running code somewhere else. That sort of jump can sometimes\
    \ be useful – when a critical condition means that you need to stop running a\
    \ piece of code as fast as possible – but it can also be confusing and it risks\
    \ introducing accidental bugs.\n\nFor reason's sake (or \"For reason\"), whenever\
    \ possible, you should try to terminate a loop only when the loop *condition*\
    \ is met – for example when the test in a *while* loop or the expression in the\
    \ second part of a *for* loop (e.g. column < 5) evaluates to *false*. There are\
    \ some occasions when it is useful to break from a loop and you certainly need\
    \ to understand how break and *continue* are used, but don't be too enthusiastic\
    \ about using them. As a general principle, you should avoid breaking out of loops\
    \ if there is a simpler, and less confusing, alternative.\n\n## Chapter 8 – Enums,\
    \ Interfaces and Scope\n\nIn this chapter I'll explain how enumerated constants\
    \ can help code clarity, how interfaces can redefine the behavior of classes and\
    \ why the position of a piece of code is important.\n\nSometimes your programs\
    \ may need to work with a fixed set of related values – for example, a calendar\
    \ program may need to deal with the seven days of the week, whereas a gambling\
    \ program might deal with four suits of playing cards. In order to represent these\
    \ values you could use integers from 0 to 6 for days or from 0 to 3 for suits\
    \ of cards respectively. But often it would be clearer if you could use named\
    \ identifiers instead of numbers. For example, consider this code:\n\n```java\n\
    if ((suit == 0) || (suit == 1)) {\n  System.out.println(\"This card is a red suit\"\
    );\n}\n```\n\nCompare with this code:\n\n```java\nif ((suit == Suits.HEARTS) ||\
    \ (suit == Suits.DIAMONDS)) {\n  System.out.println(\"This card is a red suit\"\
    );\n}\n```\n\nAs far as the computer is concerned the two code fragments above\
    \ mean the same thing; when your program runs, they will produce exactly the same\
    \ results. But from the perspective of the programmer, the second example, which\
    \ uses named identifiers such as HEARTS and DIAMONDS instead of numbers as 0 and\
    \ 1 is certainly much clearer. In order to use identifiers like this, you need\
    \ to create an enum.\n\n## Enum Types\n\nTo create series of identifying names\
    \ such as HEARTS, DIAMONDS, SPADES and CLUBS and group them together as suits,\
    \ you need to define an ‘enumerated type’ or enum. This is how I would define\
    \ the four suits of a deck of cards:\n\n```java\npublic enum Suits {\n  HEARTS,\
    \ DIAMONDS, CLUBS, SPADES\n};\n```\n\nSimilarly, I could create an enum of the\
    \ months of the year like this:\n\n```java\npublic enum Months {\n  JAN, FEB,\
    \ MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC\n};\n```\n\n### Enumeration\
    \ Constants\n\nThe identifiers listed in an enum are actually constants because\
    \ their values cannot be changed. In fact, an enum might sometimes be described\
    \ as an ‘enumeration constant’. By convention, constant identifiers are normally\
    \ written all in uppercase. That isn’t obligatory – you could call them Hearts,\
    \ Diamonds, Clubs and Spades if you wished, but all-capital identifiers are usual.\n\
    \nIn this example, Suits and Months are the enum type names. If you want to pass\
    \ enum values to functions, be sure to declare the function argument appropriately.\
    \ For example, here is a function that expects an argument, suit, of the enum\
    \ type Suits:\n\n```java\npublic static void showsuit(Suits suit) {\n```\n\nWhen\
    \ calling this function, I must be sure to send it to one of the constants defined\
    \ by the Suits enum. One way of doing that would be to pass the enum name, followed\
    \ by a dot constant name, like this:\n\n```java\nshowsuit(Suits.HEARTS);\n```\n\
    \nAlternatively I could declare a variable of the same type as the enum and assign\
    \ to it one of the enum constants. That variable could then be passed to the function,\
    \ like this:\n\n```java\nSuits card;\ncard = Suits.SPADES;\nshowsuit(card);\n\
    ```\n\nThis is my example code in the Enums project:\n\n```java\npublic class\
    \ Enums {\n    public enum Suits { HEARTS, DIAMONDS, CLUBS, SPADES };\n    public\
    \ enum Months {\n        JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV,\
    \ DEC };\n    }\n\n    public static void showsuit(Suits suit) {\n        if (suit\
    \ == Suits.HEARTS || suit == Suits.DIAMONDS) {\n            System.out.printf(\"\
    This card is a %s which is a red suit.\\n\",\n                suit.toString());\n\
    \        } else {\n            System.out.printf(\"This card is a %s which is\
    \ a black suit.\\n\",\n                suit.toString());\n        }\n    }\n\n\
    \    public static void showsuit(Months month) {\n        String msg = \"\";\n\
    \        switch (month) {\n            case DEC:\n                msg = \"Christmas\
    \ is coming!\";\n            case JAN:\n                msg = \"Baby's cold outside!\"\
    ;\n            case FEB:\n                msg = \"Baby's cold outside!\";\n  \
    \          case MAR:\n                msg = \"Spring is out!\";\n            case\
    \ APR:\n                msg = \"Spring is out!\";\n            case MAY:\n   \
    \             msg = \"June is favourite month!\";\n            case JUN:\n   \
    \             msg = \"Time to the beach!\";\n            case JUL:\n         \
    \       msg = \"The leaves are falling!\";\n            case AUG:\n          \
    \      msg = \"The leaves are falling!\";\n            case SEP:\n           \
    \ case OCT:\n            case NOV:\n                msg = \"I don't know what\
    \ month this!\";\n        }\n        System.out.println(month.toString() + \"\
    \ \" + msg);\n    }\n\n    public static void main(String[] args) {\n        Suits\
    \ card;\n        card = Suits.SPADES;\n        showsuit(card);\n\n        Months\
    \ month;\n        month = Months.DEC;\n        showsuit(month);\n    }\n}\n```\n\
    \n## Chapter 8 — Enums, Interfaces and Scope\n\n### Assigning Values to enum Constants\n\
    \nFor another example of enum, take a look at the Adventure2 project (in the Adventure\
    \ folder of the source code). This is a game with a simple user interface that\
    \ provides buttons that can be clicked to move the player North, South, East and\
    \ West. The code that handles these button-clicks calls the moveTo() method of\
    \ the game object. The game object is created from the Game class and it contains\
    \ all the elements of a game including the map of rooms and the player. The important\
    \ thing to notice is when I call the moveTo() method I provide an argument such\
    \ as Direction.NORTH or Direction.SOUTH. Giving a descriptive direction is much\
    \ clearer than using an integer value, for example. Here Direction is defined\
    \ in the Direction.java code file:\n\nAdventure2 (Direction.java)\n\n```java\n\
    public enum Direction {\n    NORTH,\n    SOUTH,\n    EAST,\n    WEST;\n\n    public\
    \ static final int NOEXIT = -1;\n}\n```\n\n### Compiling Adventure2\n\nWhen you\
    \ run the Adventure2 project for the first time (or if you select Run|Clean and\
    \ Build Project in NetBeans you may see some warnings of an “unchecked call to\
    \ add(E)”. That is because the map ArrayList in this project can hold any type\
    \ of object and Java is reminding me that it would be safer if I created an ArrayList\
    \ to hold only a specific type (here my map will only need to hold Room objects).\
    \ If you look at the code of Adventure3 you'll see that I have declared the ArrayList\
    \ like this:\n\n```java\nprivate ArrayList<Room> map;\n```\n\n### Enum.toString()\n\
    \nNotice that I have used the toString() method to display the actual name of\
    \ an enum constant. The toString() method is defined for many standard classes\
    \ including the Enum class.\n"
  mdcn: "\n\n# 标签位置\n\n对于带标签的 `break` 或 `continue`，标签的位置有精确的规则。标签用于通过退出最外层语句来跳出 `switch`、`for`、`while`\
    \ 或 `do-while` 语句。标签必须*直接*出现在最外层语句上方，且标签与该语句之间不能有其他代码。\n\n如果你觉得这些内容很难跟上，这并不奇怪。以这种方式跳出通常不是终止循环最优雅的方法。它类似于一种\
    \ *goto* 语句，会突然跳出一个代码块并开始在别的地方运行代码。这种跳转有时是有用的——当某个关键条件意味着你需要尽可能快地停止运行某段代码时——但它也会导致困惑，并存在引入意外\
    \ bug 的风险。\n\n出于原因考虑（或者说“为了某种原因”），在尽可能的情况下，你应该尝试只在循环*条件*满足时才终止循环——例如，当 *while*\
    \ 循环中的测试或 *for* 循环第二部分的表达式（例如 `column < 5`）求值为为 *false* 时。在某些情况下，从循环中跳出是有用的，你确实需要理解\
    \ `break` 和 *continue* 的用法，但不要对使用它们过于狂热。作为一个基本原则，如果有更简单、更不困惑的替代方案，你应该避免跳出循环。\n\
    \n## 第 8 章 – 枚举、接口和作用域\n\n在本章中，我将解释枚举常量如何帮助代码清晰化，接口如何重新定义类的行为，以及为什么代码的位置很重要。\n\
    \n有时，你的程序可能需要处理一组固定的相关值——例如，日程程序可能需要处理一周的七天，而赌博程序可能需要处理扑克牌的花色。为了表示这些值，你可以分别使用\
    \ 0 到 6 的整数表示日期，或使用 0 到 3 的整数表示花色。但如果可以使用命名标识符而不是数字，通常会更清晰。例如，考虑这段代码：\n\n```java\n\
    if ((suit == 0) || (suit == 1)) {\n  System.out.println(\"This card is a red suit\"\
    );\n}\n```\n\n与这段代码对比：\n\n```java\nif ((suit == Suits.HEARTS) || (suit == Suits.DIAMONDS))\
    \ {\n  System.out.println(\"This card is a red suit\");\n}\n```\n\n对于计算机而言，上述两个代码段的含义相同；当你的程序运行时，它们将产生完全相同的结果。但从程序员的角度来看，第二个示例使用了如\
    \ `HEARTS` 和 `DIAMONDS` 这样的命名标识符而不是数字 0 和 1，显然要清晰得多。为了使用这样的标识符，你需要创建一个枚举（enum）。\n\
    \n## 枚举类型\n\n为了创建如 `HEARTS`、`DIAMONDS`、`SPADES` 和 `CLUBS` 这样的系列标识名称并将它们分组为花色，你需要定义一个“枚举类型”或\
    \ enum。我将这样定义扑克牌的四种花色：\n\n```java\npublic enum Suits {\n  HEARTS, DIAMONDS, CLUBS,\
    \ SPADES\n};\n```\n\n类似地，我可以这样创建一个月份的枚举：\n\n```java\npublic enum Months {\n  JAN,\
    \ FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC\n};\n```\n\n### 枚举常量\n\
    \n枚举中列出的标识符实际上是常量，因为它们的值不能被改变。事实上，枚举有时被描述为“枚举常量”。根据惯例，常量标识符通常全大写写。这并不是强制的——如果你愿意，可以命名为\
    \ `Hearts`、`Diamonds`、`Clubs` 和 `Spades`，但全大写标识符是常见的。\n\n在这个示例中，`Suits` 和 `Months`\
    \ 是枚举类型名称。如果你想将枚举值传递给函数，请确保适当声明函数参数。例如，这里有一个接收类型 `Suits` 的参数 `suit` 的函数：\n\n```java\n\
    public static void showsuit(Suits suit) {\n```\n\n在调用此函数时，我必须确保发送的是 `Suits` 枚举定义的常量之一。实现的一种方法是传递枚举名，后跟着点和常量名，如下：\n\
    \n```java\nshowsuit(Suits.HEARTS);\n```\n\n或者，我可以声明一个与枚举类型相同的变量，并给它赋值一个枚举常量。然后可以将该变量传递给函数，如下：\n\
    \n```java\nSuits card;\ncard = Suits.SPADES;\nshowsuit(card);\n```\n\n这是我在 Enums\
    \ 项目中的示例代码：\n\n```java\npublic class Enums {\n    public enum Suits { HEARTS,\
    \ DIAMONDS, CLUBS, SPADES };\n    public enum Months {\n        JAN, FEB, MAR,\
    \ APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC };\n    }\n\n    public static void\
    \ showsuit(Suits suit) {\n        if (suit == Suits.HEARTS || suit == Suits.DIAMONDS)\
    \ {\n            System.out.printf(\"This card is a %s which is a red suit.\\\
    n\",\n                suit.toString());\n        } else {\n            System.out.printf(\"\
    This card is a %s which is a black suit.\\n\",\n                suit.toString());\n\
    \        }\n    }\n\n    public static void showsuit(Months month) {\n       \
    \ String msg = \"\";\n        switch (month) {\n            case DEC:\n      \
    \          msg = \"Christmas is coming!\";\n            case JAN:\n          \
    \      msg = \"Baby's cold outside!\";\n            case FEB:\n              \
    \  msg = \"Baby's cold outside!\";\n            case MAR:\n                msg\
    \ = \"Spring is out!\";\n            case APR:\n                msg = \"Spring\
    \ is out!\";\n            case MAY:\n                msg = \"June is favourite\
    \ month!\";\n            case JUN:\n                msg = \"Time to the beach!\"\
    ;\n            case JUL:\n                msg = \"The leaves are falling!\";\n\
    \            case AUG:\n                msg = \"The leaves are falling!\";\n \
    \           case SEP:\n            case OCT:\n            case NOV:\n        \
    \        msg = \"I don't know what month this!\";\n        }\n        System.out.println(month.toString()\
    \ + \" \" + msg);\n    }\n\n    public static void main(String[] args) {\n   \
    \     Suits card;\n        card = Suits.SPADES;\n        showsuit(card);\n\n \
    \       Months month;\n        month = Months.DEC;\n        showsuit(month);\n\
    \    }\n}\n```\n\n## 第 8 章 — 枚举、接口和作用域\n\n### 给枚举常量赋值\n\n另一个枚举的例子，请查看 Adventure2\
    \ 项目（位于源代码的 Adventure 文件夹中）。这是一个具有简单用户界面的游戏，提供了可以点击的按钮来移动玩家北、南、东、西。处理这些点击的代码调用了游戏对象的\
    \ `moveTo()` 方法。游戏对象由 `Game` 类创建，它包含了游戏的所有元素，包括房间地图和玩家。需要注意的是，当我调用 `moveTo()`\
    \ 方法时，我提供了如 `Direction.NORTH` 或 `Direction.SOUTH` 这样的参数。提供一个描述性的方向比使用整数值要清晰得多，例如。这里的\
    \ `Direction` 定义在 `Direction.java` 代码文件中：\n\nAdventure2 (Direction.java)\n\n```java\n\
    public enum Direction {\n    NORTH,\n    SOUTH,\n    EAST,\n    WEST;\n\n    public\
    \ static final int NOEXIT = -1;\n}\n```\n\n### 编译 Adventure2\n\n当你第一次运行 Adventure2\
    \ 项目时（或者如果你在 NetBeans 中选择 Run|Clean and Build Project），你可能会看到一些关于“unchecked call\
    \ to add(E)”的警告。这是因为该项目中的地图 `ArrayList` 可以持有任何类型的对象，而 Java 正在提醒我，如果我创建一个只持有特定类型的\
    \ `ArrayList`，将会更安全（在这里我的地图只需要持有 `Room` 对象）。如果你查看 Adventure3 的代码，你会看到我是这样声明 `ArrayList`\
    \ 的：\n\n```java\nprivate ArrayList<Room> map;\n```\n\n### Enum.toString()\n\n\
    注意我使用了 `toString()` 方法来显示枚举常量的实际名称。`toString()` 方法在许多标准类（包括 `Enum` 类）中都有定义。\n\n"
