    \ `equals()` 方法。== 运算符会根据字符串如何以及何时赋值给变量而返回不同的结果，而 `equals()` 方法在所有情况下都是一致的。\n\n\
    ![](img/8c3ac46909d3d5f277ec850365ee22ff_80_0.png)\n\n# 第 5 章 — 测试与运算符\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_81_0.png)\n\
    \n在这里运行了 StringCompare 项目，在文本框中输入了两个相同的字符串，并点击“Test1”按钮，使用 == 运算符和 `equals()`\
    \ 方法比较字符串。\n\n== 运算符返回 false，表示它们是两个不同的对象。equals() 方法返回 true，表示两个字符串包含完全相同的字符。\n\
    \n## 测试与比较\n\nJava 可以使用 if 语句进行执行测试。测试本身必须包含在括号（圆括号）中，并且能够评估为 true 或 false。如果为\
    \ true，则执行测试后的语句。单表达式语句以分号结束，如下所示：\n\n```java\nif (inputStr.equals(\"\"))\n  \
    \  outputStr.setText(\"你没有输入任何内容\");\n```\n\n如果你想在测试后执行多行代码，所有这些代码行必须在大括号内，形成一个代码“块”。\n\
    \n# 第 5 章 — 测试与运算符\n\n一些程序员（包括在内！）为了清晰和一致性，倾向于用大括号将单行和多行语句括起来。因此，上面的示例可以重写为：\n\
    \n```java\nif (inputStr.equals(\"\")) {\n    output.setText(\"你没有输入任何内容\");\n\
    }\n```\n\n## if...else\n\n可选地块后面可以跟一个 else 块。如果测试评估为 false，则执行 else 块。你可以链多个 else\
    \ 语句。这里有一个例子：\n\n| Tests |\n| :--- |\n| if (inputStr.equals(\"\")) { output.setText(\"\
    你没有输入任何内容\"); } |\n| else if (inputStr.equals(\"hello\")) { output.setText(\"\
    你好！\"); } |\n| else { output.setText(\"我不明白你在说什么!\"); } |\n\n"
