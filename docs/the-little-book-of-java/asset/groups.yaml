  mdcn: "\n\n# 第 3 章 – Java 编程元素\n\n在将数值字面量赋值给其他数值数据类型的变量时，Java 编译器可能会报错。例如，如果你尝试向一个\
    \ `long` 变量赋值一个大于 `int` 最大值的数值整数（int），编译器（或你的 IDE，如 NetBeans）会报错提示该数值过大。请看这个示例：\n\
    \n```\nlong l = 1;\nl = 922337203685477580L;\n```\n\n尽管 `long`（如变量 `l`）能够容数值 `922337203685477580`，但这种赋值是错误的，因为整数字面量被视为一个\
    \ `int` —— 而 `int` 的最大值为 `2147483647`。在 NetBeans 中我看到了此错误信息：\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_51_0.png)\n\
    \n为了修复这个问题，我需要告诉编译器这个数值字面量是一个 `long` 值。我通过在数字后面加上一个 `l` 来这样做：\n\n```\nl = 922337203685477580L;\n\
    ```\n\n同样，如果你需要将一个浮点数字面量（默认被视为 `double`）赋值给 `float` 变量，你可以在字面量后面加上一个 `F`：\n\n\
    ```java\nfloat f;\nf = 3.4028235E38F;\n```\n\n如果你不确定数值类型的最小和最大范围，每个类型包装类提供的 `MIN_VALUE`\
    \ 和 `MAX_VALUE` 常量会返回相应的值：\n\n| Byte.MIN_VALUE | Byte.MAX_VALUE |\n| :--- | :---\
    \ |\n| Short.MIN_VALUE | Short.MAX_VALUE |\n| Integer.MIN_VALUE | Integer.MAX_VALUE\
    \ |\n| Long.MIN_VALUE | Long.MAX_VALUE |\n| Float.MIN_VALUE | Float.MAX_VALUE\
    \ |\n| Double.MIN_VALUE | Double.MAX_VALUE |\n\n`Primitives` 示例程序包含此示例，可以在 `typesActionPerformed()`\
    \ 方法中找到。\n\n## 原子级字符串转换\n\n正如我之前提到的，当你想要将数值转换为字符串时 —— 例如，如果你想使用 `setText()` 方法在文本区域中显示一个整数\
    \ —— 你需要使用包装类调用 `toString()` 方法，如下：\n\n| DataTypes |\n| :--- |\n| myTextArea.setText(Integer.toString(myInt\
    \ + myOtherInt)); |\n\n然而，如果你一直关注我的代码，可能会注意到我并没有遵循这条规则。在 `DataTypes` 项目中，例如我直接显示\
    \ `double` 变量 `total` 的值，而没有显式地将其转换为字符串：\n\n```java\nmyTextArea.setText(\"Total\
    \ = \" + total);\n```\n\n这怎么可能呢？让我们做一个实验。你会在 `DataTypes` 项目的 `parseStringsBtnActionPerformed()`\
    \ 方法中找到上述代码行。尝试编辑它，去掉字符串 `\"Total = \"` 和拼接运算符 `+`，使得代码现在读取为：\n\n```java\nmyTextArea.setText(total);\n\
    ```\n\n如果你现在尝试重新构建并运行项目，你将看到一个错误信息，警告 `double` 无法转换为 `String`：\n\n```\nincompatible\
    \ types: double cannot be converted to String\n----\n(Alt-Enter shows hints)\n\
    myTextArea.setText(total);\n}\n```\n\n那么，为什么我的原始版本没有问题地运行，而这个新版本却不行？事实证明，当你拼接字符串时（这里通过将\
    \ `double` 变量的值附加到字符串 `\"Total = \"` 之后），Java 会自动为每个尚不是字符串的项调用 `toString()` 方法。这意味着下面所示的两个代码行是等价的：\n\
    \n```\nmyTextArea.setText(\"Total = \" + total);\nmyTextArea.setText(\"Total =\
    \ \" + Double.toString(total));\n```\n\n## 装箱与拆箱（Boxing and Unboxing）\n\n在程序中使用基本类型时，你可能需要使用包装类提供的方法。由于这种原因，Java\
    \ 提供了一种简写方式，将基本类型转换为对象。当你将基本类型赋值给相应的包装类变量时，会创建一个包含该基本值的对象，这被称为装箱（autoboxing）。当你将包装对象赋值给相应的基本类型变量时，对象中包含的基本值被赋值给变量，这被称为拆箱（unboxing）。你可以在\
    \ `Primitives` 中找到装箱和拆箱的简单示例：\n\n| Primitives | Object |\n| :--- | :--- |\n| int\
    \ unboxed; | Integer boxedInt; |\n| double unboxed; | Double boxedDouble; |\n\n\
    ```java\nboxedInt = 500; // 装箱\nunboxed = boxedInt; // 拆箱\n```\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_54.png)\n\
    \n这张图显示了变量 `unboxed` 与对象 `boxedInt` 的简化视图。基本类型只是一个数字；它没有内置行为。简而言之，基本类型只是一段数据。对象要复杂得多，它包含了一些数据（这里是值），但也有如\
    \ `floatValue()`、`toString()` 和 `toDouble()` 等方法，可以对该数据执行操作或返回不同类型的值。\n\n## 字符串\n\
    \n我们在程序中频繁使用字符串。在结束本章之前，我将用简单的语言解释什么是字符串。在 Java 中，字符串代表一系列字符。例如，字符串 `\"Hello\"\
    ` 代表字符 'H''e''l''l''o'。字符串是以双引号分隔的字符序列输入的（这被称为字符串字面量），它的数据类型是 `String`。字符串实际上是一个包含数据（某些字符）和各种方法的对象。String\
    \ 方法包括查找字符、获取子字符串、返回字符串的大写或小写，以及返回字符串的长度。字符串中的第一个字符索引为 0。字符串中的最后一个字符索引为字符串长度减\
    \ 1。假设字符串包含文本 `\"Hello world\"`，表达式 `s.length()` 将返回值 11。\n\n![](img/8c3ac46909d3d5f277ec850365ee22ff_55.png)\n\
    \n## 字符串字面量如何拥有方法？\n\n之前我解释过，像 `500` 这样的整数字面量只是没有方法的数据，所以我不能写 `500.toString()`。为了这样做，我一个\
    \ `Integer` 对象。那么为什么字符串字面量可以访问方法？例如，我可以写 `\"hello\".toUpperCase()`，它将返回字符串 `\"\
    HELLO\"`。这是因为当你将字符串字面量赋值给变量时，Java 会创建一个 `String` 对象。事实上，尽管像 `\"Hello\"` 这样的字符串值是字面量，但它们不是基本类型。基本类型是一个非常简单的字符数据。字符串是一整系列字符，因此可以被视为一种复杂的数据类型。\n\
    \n这是我的代码创建此字符串并将其赋值给变量 `sLen` 的方式：\n\n```java\nString s;\nint sLen;\ns = \"Hello\
    \ world\";\nsLen = s.length();\n```\n\n下面你可以看到我将索引值 `0` 和 `sLen-1` 传递给 `charAt()`\
    \ 方法（该方法返回指定索引处的字符），以便找到字符串中的第一个最后一个字符。字符串的索引从 0（第一个字符）到字符串长度减 1（最后一个字符）：\n\n\
    ```java\nchar c;\nchar c2;\ns = \"Hello world\";\nsLen = s.length();\nc = s.charAt(0);\
    \ // c 现在是 'H'\nc2 = s.charAt(sLen-1); // c2 现在是 'd'\n```\n\n如果我想使用字符串的小写或大写版本，我需要在字符串对象上调用\
    \ `toLowerCase()` 或 `toUpperCase()` 方法。这些方法返回一个所有字符都更改为指定大小的新字符串。\n\n```java\n\
    String lowercaseS = s.toLowerCase();\nString uppercaseS = s.toUpperCase();\n```\n\
    \n## Java 字符串是不可变的\n\nJava 字符串是不可变的，这意味着它们不能被修改。例如，当我对字符串 `s` 调用 `toUpperCase()`\
    \ 方法时，该字符串对象并没有被设置为大写。`toUpperCase()` 方法返回的字符串 `\"HELLO WORLD\"` 是一个新的字符串对象。将其赋值给变量\
    \ `uppercase`。原始字符串 `s` 保持不变：它仍然包含 `\"Hello world\"`。\n\n 转义字符\n\n注意，当我们在 `Strings`\
    \ 示例程序中显示输出时，我在双引号字符前面使用斜杠字符 `\\` 来显示双引号。\n\n```java\n\"\\nIn lowercase, the string\
    \ is \\\"\" + lowercaseS + \"\\\"\"\n```\n\n如果我不这样做，Java 会认为双引号字符是字符串字面量的结束。斜杠\
    \ `\\` 告诉 Java 紧随其后的字符（如 `\"` 或 `n`）应该被特殊对待：`\\n` 被视为换行符，`\"` 是双引号字符。\n\n"
