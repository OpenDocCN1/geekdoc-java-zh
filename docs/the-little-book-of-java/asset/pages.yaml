  md: '# Interfaces as ‘Contracts’


    An ‘interface’ is a definition of the code that a class must implement: it is,
    if you like, a ‘contract’ that the class using the interface must respect. If
    you have a contract to build a house, say, the contract isn’t the actual house,
    but it does specify (in more or less detail) what will be built and to what standards
    the house will be built.


    To see an example of a class that implements some interfaces, look at the ArrayList
    class which is declared like this:


    ```

    public class ArrayList<E> extends AbstractList<E>

    implements List<E>, RandomAccess, Cloneable, Serializable

    ```


    Each class can descend from one immediate parent class – here ArrayList descends
    from ‘extends’ the AbstractList. When one class descends from some other class
    (its superclass) it automatically inherits the behavior – the methods – from the
    superclass.


    In addition to ‘extending’, the ArrayList class also ‘implements’ List, RandomAccess,
    Cloneable and Serializable. These are not classes. They are interfaces. A class
    can extend only one other class but it can implement many interfaces. An interface
    is like the definition of a class without executable code. Each interface may
    define a set of constants and methods but it does not provide the behavior – the
    actual code – of those methods.


    This means that whenever a class implements an interface it is obliged to provide
    methods matching all the methods that the interface defines. For example, the
    ArrayList implements the List interface, and the List interface declares the size(),
    add() and remove() methods, the ArrayList is obliged to provide its own size(),
    add() and remove() methods. If it fails to do so, it will be an error.


    What’s more, every other class that implements the List interface must also provide
    their own size(), add() and remove() methods. Each class may implement those methods
    in different ways. For example a TreasureList and a BeerList class might both
    implement the List interface. The List interface defines the size() method like
    this:


    ```

    int size();

    ```'
