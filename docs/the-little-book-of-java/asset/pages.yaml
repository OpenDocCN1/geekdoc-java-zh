  md: '# Abstract Classes


    ```

    abstract class MyClass() {

    ```


    An abstract class may optionally contain abstract methods. An abstract method
    is a method that is declared using the `abstract` keyword but without an implementation
    (no executable code) like this:


    ```

    abstract void myMethod(int someValue);

    ```


    Abstract classes may be thought of as ‘prototypes’. They define the structure
    of a class but not its implementation. An abstract class can be subclassed (extended
    rather than implemented) and the behavior of the abstract class''s methods must
    be programmed in the subclass.


    An abstract class is a bit like a regular class (it can contain fully implemented
    methods and it can be subclassed) and it is bit like an interface (you cannot
    create objects from an abstract class but you can define ‘empty methods’ which
    must be implemented in subclasses of the abstract class). Refer to Oracle’s documentation
    for more information:


    https://docs.oracle.com/javase/tutorial/java/landl/abstract.html


    # Abstract Classes Or Interfaces?


    There may be occasions when interfaces may be useful as a way of defining ‘templates’
    to ensure that a number of classes (those which implement the interface) have
    all certain specific methods which are coded differently for each class. An abstract
    class may be useful as a ‘base’ class that provides both a set of common methods
    and ‘method templates’ (similar to those defined by an interface) to a number
    of classes. If, however, you are unsure of the need for interfaces or abstract
    classes in your code, don’t use them. They are not fundamental to your object
    oriented programming though they may sometimes be of.'
