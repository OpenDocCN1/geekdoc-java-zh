  md: '# this and super


    Sometimes you will see the keyword which refers to the current object – the object
    that is being created. It is often omitted: this.name = aName has exactly the
    same effect as the assignment name = aName. However, if I had just named the parameter
    name instead of aName, then the keyword this is required to remove the ambiguity:
    this.name = name.


    The keyword super is used in a similar manner to reference variables and methods
    in the superclass – for example, the superclass’s constructor as we saw earlier,
    and again is often used to remove the ambiguity between method with both the ancestor
    class and the subclass. I will cover method overriding and overloading in detail
