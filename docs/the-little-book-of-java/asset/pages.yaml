  md: 'javac HelloWorld.java


    This will compile my code and create a file HelloWorld.class which is capable
    of being run by the Java virtual machine. I now try to run this file using the
    command:


    java HelloWorld


    But it won''t run! I will see this error message:


    ```

    Error: Could not find or load main class HelloWorld

    ```


    That is because the HelloWorld class is defined to be in the helloworld package.
    In order to run this program, I need to go up to the directory above the \helloworld
    folder - that is, to C:\LittleBookOfJavaCode\Step02\HelloWorld\srv\ and then enter
    this command which includes the package name hell:


    java helloworld.HelloWorld


    The program should now run correctly and display this output:


    ```

    Hello world

    ```


    If you find this confusing, remember that if you compile and run programs from
    within an IDE as NetBeans, all the details of packages and folders will be handled
    automatically. It is only when you compile and run from the command prompt that
    you need to enter these details yourself.


    # Java is Case Sensitive


    If your main class is called AdventureGame with a capital ''A'' and a capital
    ''G'', you must be sure to use the same mix of upper and lowercase letters when
    you try to run the program.


    Let''s suppose I forget to capitalize the ''G'' when I enter the command like
    this:


    java Adventuregame


    Java will show an error message similar to:


    ```

    Error: Could not find or load main class Adventuregame

    ```


