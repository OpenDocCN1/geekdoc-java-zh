  md: '# Generics


    Generics allow you to use placeholders or parameters when defining classes, interfaces
    and methods. These are similar to the usual formal parameters used in method declarations,
    but instead of being values they are types. Generics let you re-use the same code
    with different inputs – that is with different types of data.


    What this means is that you are able to define classes and methods that can work
    with some non-specified type of object. That is is common or ''generic'' to all
    object types. The actual type of the object can be specified when those classes
    and types are used in your code. The ArrayList class is generic. It is declared
    as being a collection of elements, each of which has the type E:


    ```

    public class ArrayList<E>

    ```


    Here <E> is not a real type – it is a place-holder that will be replaced with
    an actual type when you create an instance of ArrayList. You simply place the
    actual type between pointy brackets and also place an empty pair of pointy brackets
    before the parentheses of the constructor. So this is how I create an ArrayList
    to hold string elements:


    ```

    ArrayList <String>gstrList = new ArrayList<>();

    ```


    I could just as easily create an ArrayList to contain Integer elements, like this:


    ```

    ArrayList <Integer>gIntList = new ArrayList<>();

    ```


    # Generic Key-Value pairs


    Java defines a number of generic collections. You may recall from Chapter 6 that
    I created a HashMap object to hold strictly-typed Key-Value pairs in which the
    key was obliged to be a String and the value was an instance of my Room class:


    ```

    HashMap <String, Room>map;

    map = new HashMap<>();

    ```'
