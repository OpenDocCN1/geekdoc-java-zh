  md: '# Indexing Errors


    Be aware that while it is permissible to place fewer objects into an array than
    the maximum declared size of the array, it is not permissible to add more objects
    to an array than the declared maximum size. So, for example, consider this stringarray
    variable, declared with a maximum size of 5:


    ```

    stringarray = new String[5];

    ```


    Here the length of the array is 5 so the last element is at index 4. What happens,
    then if I try to add a string at index 5, like this?


    ```

    stringarray[5] = "cloud";

    ```


    If you try this you will find that when you try to compile and run your program,
    Java shows an message that says your code has caused an error of the type java.lang.ArrayIndexOutOfBoundsException.
