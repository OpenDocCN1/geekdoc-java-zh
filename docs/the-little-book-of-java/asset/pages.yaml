  md: '# The Serializable Interface


    In order that an object can be serialized, its class needs to implement the Serializable
    interface from the java.io package. To do that you need to add this to each class
    declaration:


    ```

    implements java.io.Serializable

    ```


    In my adventure game, I add this implements statement to all the classes I want
    to be available for serialization:


    ```

    Adventure4

    public class Game implements java.io.Serializable

    public class Treasure extends Thing implements java.io.Serializable

    // ...and so on

    ```


    Unlike the interfaces we''ve looked previously, the Serializable interface contains
    no methods or data fields. By implementing the Serializable interface a class
    informs Java that it is available for serialization.


    If you attempt to serialize objects whose classes do not implement the Serializable
    interface, an exception of the type NotSerializableException will be thrown.


    # Saving and Restoring Objects


    In the FileInputStream project which we looked at earlier in this chapter, when
    I want to save data to disk by creating a new FileOutputStream object, passing
    it to the constructor of the file to be created and opened.


    You may recall that the FileInputStream project I passed a FileOutputStream object
    as an argument to the constructor of DataOutputStream which handled the nitty-gritty
    primitive data types to the output stream. In my adventure game I need to write
    complex object types, instead of using a DataOutputStream I have used an ObjectOutputStream.
    This is how the Java documentation describes this:


    An ObjectOutputStream writes primitive data types and graphs of Java objects to
    an OutputStream. The objects can be read (reconstructed) using an ObjectInputStream.'
