  md: "# Breaking Code Logie!\n\nIn a complex loop, containing many lines of code,\
    \ the break condition may not be obvious and it would be easy to assume that the\
    \ loop is guaranteed to run while i is less than 10 (this is the 'logic' of the\
    \ loop condition). When you add a break you are breaking the 'code logic' of the\
    \ loop. As a general principle, it is better, clearer and less bug-prone, to avoid\
    \ breaking out of loops unless you have a very good reason for doing so.\n\nLet\
    \ me turn to a more useful example of a loop that uses a break. Here, when the\
    \ user clicks the 'Encrypt' button of the encryptBtnActionPerformed() method 'encrypts'\
    \ a string, teststr, adding 1 to the number (ASCII) value of each character in\
    \ that string. It does this by getting each character at index i from 0 to the\
    \ end of the string and adding 1 to that character's value:\n\n```\ntestStr.charAt(i)\
    \ + 1\n```\n\nIt then casts the new value to a character (char) as explained in\
    \ Chapter 3 and appends this character to another string variable str:\n\n```\n\
    str += (char)(testStr.charAt(i) + 1);\n```\n\nSuffice to say, this is a very simple\
    \ (and not very secure!) encryption algorithm. Even so, it serves to illustrate\
    \ the basics of how to process strings, or arrays of elements, using loops. In\
    \ principle my code could encrypt strings entered at the keyboard or loaded from\
