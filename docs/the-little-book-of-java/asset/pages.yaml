  md: '# Chapter 4 – Object Orientation


    Java is an object oriented programming language. In this chapter I''ll explain
    what objects are, how they are related to classes and why object orientation is
    useful.


    Almost everything you work with Java – from a string as "Hello world" to a treasure
    in an adventure game – is wrapped inside an object that contains the data itself
    (for example, the characters in a string or the description of a treasure) and
    the functions ''methods'' that can be used to manipulate data — such as, for example,
    a string object''s `toUpperCase()` method.


    # Primitives are Different


    As''ve already seen, primitives are exceptions to the rule ''everything in Java
    is an object''. Primitives are simple pieces of data; they are not Java objects.
    However, primitives may be ''wrapped up'' inside Java objects so an int primitive
    may be wrapped up inside an Integer object as explained in Chapter 3.


    # Classes and Objects


    Each object you use is created from a ''class''. You can think of a class as a
    blueprint that defines the data and the behavior (the methods) of an object.


    Let''s look at an example of a very simple definition. You define a class using
    the class keyword. Here I have decided to call the class `Thing`. Notice that
    the initial letter of the class name is capitalized. This is the normal convention
    in Java and in many other programming languages. The class contains two string
    variables, name and description. I have made these variables private by prefixing
    their declarations with the private keyword:


    ```

    private String name;

    private String description;

    ```'
