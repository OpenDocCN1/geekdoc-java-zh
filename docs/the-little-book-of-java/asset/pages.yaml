  md: '# The Compilation Process


    Java programs are written in a human-readable form – the Java source code that
    you write in an editor. But before the program can be run, that source code has
    to be translated into a different format called ''bytecode''. The translation
    from source code to bytecode is done by the Java compiler.


    # Java Virtual Machine and Java Runtime Environment


    In order to run a Java program, the bytecode has to be loaded into the Java Virtual
    Machine or JVM. You can think of the JVM as a special environment for running
    Java programs and it is, in fact, the core element of the Java Runtime Environment
    (JRE). In addition to the JVM, the JRE also includes various essential class libraries.


    # The Java Compiler


    Java source code ends with the extension .java. Java bytecode files end with the
    extension .class. To translate source code to bytecode you must pass the .java
    file to the Java compiler.


    # Compiler Options


    There are many options available for use with the javac compiler. For example,
    it is possible to compile multiple source code files and to place the compiled
    .class files into a specific subdirectory. To see the available options, just
    enter the command javac at the command prompt. More detailed documentation can
    be found here:


    http://docs.oracle.com/javase/8/docs/technotes/tools/windows/javac.html


    More information on the java command can be found here:


    http://docs.oracle.com/javase/8/docs/technotes/tools/windows/java.html


    The Java compiler has the name javac. This is the command I would enter in order
    to compile a source code file called HelloWorld.java at the command prompt:


    ```

    javac HelloWorld.java

    ```'
