    In brief then, instance variables store different values for each object. Class
    or static variables store a single value which is accessible by all objects created
    from a class. Instance methods are called from an object but class methods are
    called from a class. Incidentally, it is also possible to call static methods
    from an object but this can be confusing so it would generally be better to avoid
    this.


    # static Constants


    Recall from Chapter 3 that constant values are generally declared using the final
    keyword. This prevents the value assigned to an identifier value being changed.
    In fact, you will often see that Java constants are also defined using the static
    keyword. The static keyword ensures we only create one copy of the constant, stored
    by the class itself, rather than creating new copies for each object. For example,
    this is how the constant value PI is declared:


    ```

    public static final double PI = 3.14159265385979323846;

    ```


    Java typically truncates this value to 3.141592653859793 as you can see when you
    run the PIT project. If you want to view constants in Java, you may be able to
    use the navigation tools of your IDE. In NetBeans, for example, you can right-click
