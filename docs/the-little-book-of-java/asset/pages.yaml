  md: "# Chapter 8 — Enums, Interfaces and Scope\n\n# Extending and Implementing\n\
    \nA class may extend one other class and implement zero, one or more interfaces.\n\
    \n```\nclass A\n    doSomething();\n    doSomethingElse();\n```\n\n```\ninterface\
    \ Int1\n    doThis();\n    doThat();\n```\n\n```\ninterface Int2\n    doTheOther();\n\
    ```\n\n```\nclass B extends A implements Int1, Int2\n    inherits these...   \
    \         must implement these...\n    doSomething();          doThis();     \
    \     doTheOther();\n    doSomethingElse();      doThat();\n```\n\nThe diagram\
    \ above shows a simplified view of class, class B, which extends (so it is the\
    \ descendant) of class A and implements the two interfaces Int1 and Int2.\n\n\
    The class A contains the code of the methods doSomething() and doSomethingElse(),\
    \ and class B automatically inherits those methods.\n\nThe two interfaces, however,\
    \ only define the methods doThis(), doThat() and doTheOther() — they do not contain\
    \ the code of those methods. So class B must now implement (that is, the programmer\
    \ must write the actual code of) those three methods.\n\nIn other words, when\
    \ class B extends class A it inherits the fully-working methods of class A. But\
    \ when class B implements the interfaces Int1 and Int2 it does not gain access\
    \ to existing methods. Instead, it makes an agreement or ‘contract’ to write code\
    \ for the methods that are defined (but not implemented) by those interfaces."
