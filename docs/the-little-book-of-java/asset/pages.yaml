  md: "# Chapter 9 – Generics and Exceptions\n\nThe code is still valid because when\
    \ I call myTroll.saySomething() Java looks for a method with that name and finds\
    \ it in the ancestor class Monster. But, of course, that wasn't my intention.\
    \ My intention was that the ancestor I wrote in the Troll class should be used\
    \ – that it override the method with the same name in the Monster class. My silly\
    \ typing error (using the lowercase 's' instead of the uppercase 'S' in something())\
    \ has caused a bug which, in a more complicated program, might be very hard for\
    \ me to find and fix.\n\n# @Override Annotation\n\nThere is a simple trick to\
    \ help me avoid the sort of problem that would result from accidentally misnaming\
    \ a method. When I intend one method to override another, I can place the @Override\
    \ annotation before that method.\n\nIn Java an annotation is an intention to the\
    \ compiler. The @Override annotation tells it to check that the annotated method\
    \ has successfully overridden a method with the same name in its ancestor class.\
    \ You may recall that I used @override in Chapter 8 when implementing interfaces,\
    \ to check that the methods were declared by an. In the current example, I can\
    \ place @Override above the method in my Troll class like this:\n\n```\npublic\
    \ String saysothing() {\n    return \"Ugh, ugh, ugh!\\n\";\n}\n```\n\nNow the\
    \ compiler will compare this method with the methods in the ancestor class. It\
    \ will discover that there is no method with this name in the ancestor class so\
    \ the method cannot be overridden and an error occurs. In fact, your IDE may also\
    \ perform this check and it too may flag an error:\n\n| method does not override\
    \ or implement a method from a supertype |\n| --- |\n| (Alt-Enter shows hints)\
    \ |\n| @Override |\n| public String sayssomething() {\n| return \"Ugh, ugh, ugh!\\\
    n\";n| } |\n\n162"
