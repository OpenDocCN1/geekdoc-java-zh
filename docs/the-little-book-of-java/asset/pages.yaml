  md: "# Generic Parameter Names\n\nYou may choose your own parameter names (such\
    \ as <T> or <E>\nwhen defining generics. However, by convention, these are the\n\
    types typically used:\n\n+   - T: Type\n- E: Element (in a collection)\n- K: Key\
    \ in a Map/Hash\n- V: Value in a Map/Hash\n- N: Number\n\n# Generic Lists and\
    \ Collections\n\nCommonly, classes that manage collections or lists may be made\
    \ generic. This is because\nlists of all types of object need to perform similar\
    \ actions on the elements of the list\n– for example, to add and remove elements\
    \ or to find an element at a given index.\n\nImplementing the same methods time\
    \ after time for each class that defines some\nstrongly-typed list (a Liststring\
    \ and a Integer class, for example) would\nclearly highly repetitive. It would\
    \ be better to implement a generic class with all the\nrequired methods for manipulating\
    \ list elements in general and specify the actual\nelement type whenever an instance\
    \ of that generic class is created.\n\nYou could either implement your list from\
    \ the ground up or could extend an\nextisting generic collection type and add\
    \ any additional features that you need. In my\nGenerics sample program I extended\
    \ ArrayList and added on one new method to\nreturn the last element of a list:\n\
    \n```\nGenerics (List.java)\npublic class List<E> extends ArrayList<E> {\n   \
    \ public E getItem() {\n        return this.get(this.size() - 1);\n    }\n}\n\
    ```\n\nThis time I have followed the Java convention of naming the generic parameter\
    \ E to\nrepresent the type of the elements in the list. List<E> extends ArrayList<E>\
    \ since both\nhand elements of the type given by E. The method getItem() returns\
    \ both"
