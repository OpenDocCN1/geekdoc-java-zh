  md: '# Methods Or Functions


    In Object Oriented terminology, a named block of code – that is, a function or
    subroutine is called a ‘method’. In Java, the names of methods must be followed
    by a pair of parentheses like this:


    ```

    public void myfunction()

    ```


    If you want to be able to pass some kind of data to a method (or function), you
    can add one or more ‘arguments’ between the parentheses. The main() function defines
    a list or ‘array’ of String arguments called args:


    ```

    main(String[] args)

    ```


    Just as the class is defined by a pair of curly brackets, so too the function.
    Note also that in my code the function contains a comment to document what the
    function does:


    ```

    // Display Hello world to output

    ```


    Finally, we come to this single line of code:


    ```

    System.out.println("Hello world");

    ```


    Here System is the name of a class supplied by the Java API and out is the name
    of a data or ‘field’ that is found inside the System class. In fact, it is the
    name of a PrintStream object and it contains a function or ‘method’ called println()
    which displays (that is, it ‘prints’) a string. You don’t need to understand the
    way this works for now.’ll have more to say about printing and streams in Chapter
    10.


    # Strings


    A string is a sequence of characters delimited by double-quotes. For example “Hello”
    is a string containing five characters.


    In order to call the println() method I have to specify the full ‘path’ in the
    form of the name of the class System, the name of the field out and finally the
    name of the function println() function, all joined together by dots, like this:
    System.out.println.'
