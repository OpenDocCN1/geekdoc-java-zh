  md: "# Chapter 2 – First Steps in Java\n\nIn this chapter we shall discover the\
    \ basic features of the Java language and write a few short Java programs.\n\n\
    By tradition, the first program many people like to create when learning a new\
    \ programming language is one that simply displays “Hello world”. Let’s do that\
    \ now.\n\n# Hello World\n\nIf you are using NetBeans, select File | New Project.\
    \ In the New Project dialog, make sure the Java (or Java with Ant) category is\
    \ selected in the left-hand pane. Click Next. Give the project a name such as\
    \ HelloWorld and make sure the Create Main Class option is ticked. You might also\
    \ want to browse to a project location to select a specific directory for this\
    \ project. Then click Finish.\n\nNetBeans will create a source code file called\
    \ HelloWorld.java. This includes a main function which will run when the program\
    \ itself is run. Edit this main function by adding the following code before the\
    \ curly brackets:\n\n```\nSystem.out.println(\"Hello world\");\n```\n\nThe code\
    \ in file should now look something like this:\n\n```\nHelloWorld.java\npackage\
    \ helloworld;\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello world\");\n    }\n}\n```"
