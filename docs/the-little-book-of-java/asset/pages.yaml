    objects are incompatible. But, that so, why were we not able to compile the program
    in the first case since it contained this obvious error.


    It turns out that the compiler allowed this because ArrayList is capable of holding
    objects of any type and it is entirely legitimate for our method to cast an object
    to a specific class as String. So, as far as the compiler is concerned, all the
    code is valid.


    In fact, if we never click the button that runs the code that calls the getLastItem()
    with a list containing a final integer, the code will all work correctly. This
    means we have to take extra care when writing code to handle the elements in an
    ArrayList to make sure we do not accidentally try to manipulate an element in
    inappropriate way.'
