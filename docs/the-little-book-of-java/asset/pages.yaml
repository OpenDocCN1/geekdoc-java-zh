  md: '# Appendix


    # The Adventure Game Projects


    You will find four little adventure game projects in the code archive. The Adventure1
    project begins by creating some fundamental game classes: Actor (the player),
    Room (the locations) and Thing (any type of object in the game). Both Actor and
    Room descend from Thing. The Game class itself defines the entire game.

    In Adventure2, I add on a Treasure object. This also descends from Thing. It is
    used to create objects found in rooms and which the player is able to take and
    drop. The player moves around a map, from one room to another, in response to
    direction buttons on the main form of the program. Adventure3 adds on generics
    so that the map is now declared to be an ArrayList typed to hold Room objects
    only and so the ''cast'' found in the previous project is no longer needed:


    | Adventure2 - moveTo() |

    | moveActorTo(anActor, (Room) map.get(exit)); |


    | Adventure3 - moveTo() |

    | moveActorTo(anActor, map.get(exit)); |


    Adventure4 adds on the ability to take, drop and look at objects and to serialize
    data that a game can be saved and restored.


    # The Little Java Book Of Adventure Game Programming


    If you really want to write an adventure game, I have a whole book devoted to
    the subject! The Little Java Java Book Of Adventure Game Programming explains
    how to open, close, take, drop and look at objects. It shows you how to put objects
    into containers and how to write recursive methods to calculate the combined masses
    of Treasure objects (so the player can only take a specific number and weight
    at objects). It provides code to parse adjectives so that the user can distinguish
    between similar object types. For example, if there are two Elvish swords, one
    big silver sword and one small golden sword, the user can enter the command: "Take
    the small golden Elvish sword".'
