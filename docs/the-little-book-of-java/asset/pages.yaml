    In the Objects sample program (the NewJFrame.java file), I declare two object
    variables of the Thing type:


    | Objects (NewJFrame.java) |

    | Thing mySword; Thing myRing; |


    Before I use these objects, I need to create them. I do that by using the new
    keyword followed by the name of constructor and a pair of empty parentheses if
    the constructor doesn''t require any arguments – for example, if the Thing constructor
    doesn''t define any named arguments, I would create a new object like this: new
    Thing(). In fact, my Thing constructor requires two string arguments, aName and
    aDescription, so I place two strings, separated by commas, between the parentheses:


    ```

    Thing mySword; Thing myRing;

    mySword = new Thing("Dwarf Sword", "a sword of great power");

    myRing = new Thing("Elvish Ring", "a golden ring of magic power");

    ```


    When you call a constructor in this way, a new object will be created and its
    fields (there are any) will be initialized with the data – the arguments – that
    passed to the constructor. The newly created object can then be assigned to a
    variable of the same type as the object''s class as I have done in the preceding
    code which creates the two Thing objects, mySword and myRing.'
