    \ 4, 5};\nint i;\nni = 0;\nwhile (i < 5) {\n    System.out.printf(\"%d\\n\", intarray[i]);\n\
    \    i++;\n}\n```\n\nYou need to be very careful to ensure that every while loop\
    \ has a test condition that will eventually evaluate to false, otherwise you risk\
    \ creating an endless loop, which is almost never a good thing to do! You also\
    \ need to be aware that sometimes a loop condition may never be met – that is,\
