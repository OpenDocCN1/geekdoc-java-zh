  md: "# Chapter 7 Loops\n\nThere is one other character that I want to treat specially.\
    \ When a space is encountered – for example, the space character between the words\
    \ in \"Hello world\" – I want to retain that space character rather than encrypt\
    \ it. This is how my code does that:\n\n```\nif (c == ' ') {\n    str += c;\n\
    \    continue;\n}\n```\n\nThis is the complete encryption routine:\n\n```\nfor\
    \ (int i = 0; i < testStr.length(); i++) {\n    c = testStr.charAt(i);\n    if\
    \ (c == ' ') {\n        str += c;\n        continue;\n    }\n    if (c == '!')\
    \ {\n        break;\n    }\n    str += (char)(testStr.charAt(i) + 1);\n}\n```\n\
    \nSo what does the continue statement do after the first test? Let's find out.\n\
    \n# continue\n\nThe continue statement is a bit like a less dramatic version of\
    \ break. Whereas break exits the loop and stops running the code in the loop any\
    \ more, continue exits the loop at this through the loop then carries on running\
    \ the code in the loop.\n\nSo, in my example, if I break on '!', the code loop\
    \ stops running. Given the string \"Hello world!\" the code would process up to\
    \ the '!' character and no further. But the code would continue when it processes\
    \ the space ' '. It means the loop when ' ' is found after \"Hello\" but then\
    \ it continues running the loop to process the rest of the characters, \"world\"\
    .\n\nAs break, you should use continue with caution. There may sometimes be perfectly\
    \ good reasons for jumping out of code blocks using break or continue but likes\
    \ this can make your code hard to understand and, in complex programs, they may\
    \ result in subtle bugs."
