    While computer scientists may like to make a clear distinction between the terms
    ''parameter'' and ''argument'', programmers often use the words interchangeably.
    So, informally, a method''s ''parameter list'' may be referred to as its ''argument
    list''.


    When you call a method, you must pass the same number of arguments as the parameters
    declared by the method. Each argument in the list must be of the same data type
    as the matching parameter.


