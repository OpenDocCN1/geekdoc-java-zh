    # for Loops


    When you want to run some code repeatedly, you could use a for loop to run one
    or more lines of code for a predetermined number of times. A for loop is defined
    by three parts, between parentheses — the initialization, test and increment parts
    — separated by semicolon. This is the basic syntax:


    ```

    for (initialization; test; increment) {statements}

    ```


    | initialization | This executes once when the loop starts. Normally the counter
    variable is assigned its initial value here. |

    | test | This is evaluated every time the loop runs. If it evaluates to true,
    the loop continues. If it evaluates to false, the loop ends. |

    | increment | This is evaluated every time the loop runs. Normally the counter
    variable is incremented |

    | {statements} | The code that executes at each turn through the loop is placed
    between a pair of curly brackets.


    Here is a simple example that executes 10 times and displays ten integers from
    0 to 9:


    ```

    for (int i = 0; i < 10; i++) {

    System.out.println(i);

    }

    ```


    The first part initializes the value of a counter variable, the integer i, which
    is assigned the value 0.

    The second part tests the value of the counter variable and stops running the
    loop when test condition evaluates to false (here the loop continues as long as
    i is less than 10. As soon as it has the value of 10 or more, the loop ends).'
