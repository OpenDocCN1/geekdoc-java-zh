    } catch (ArithmeticException e) {\n    ta.append(\"Oops! Can't divide by \" +\
    \ textField1.getText());\n    i = 0;\n} catch (NumberFormatException e) {\n  \
    \  ta.append(textField1.getText() + \" is not a valid integer!\");\n    i = 0;\n\
    } catch (Exception e) {\n    ta.append(\"ERROR: \" + e.getClass() + \" \" + +\
