  md: '# Prefix and Postfix Operators


    You may place the ++ and -- operators either before or after a variable like this:
    a++ or ++a. When placed before a variable, the value of that variable is incremented
    before assignment is made:


    ```

    a = 10;

    b = ++a;      // a = 11, b = 11

    ```


    When placed after a variable, the value is incremented after any assignment is
    made:


    ```

    a = 10;

    b = a++;      // // a = 11, b = 10

    ```


    Mixing prefix and postfix operators in your code can be confusing and may lead
    to hard-find bugs. So, whenever possible, keep it simple and keep it clear. In
    fact, there is often nothing wrong with using the longer form, which may seem
    more verbose but is at least completely unambiguous — e.g, a = a + 1 or a = a
    - 1.'
