    both the tax and also the grand total (the subtotal plus the tax), you might have
    three floating point variables (double) named subtotal, tax and grandtotal.


    These variables could be assigned different values each time a new calculation
    is done, based on numbers entered by the user. You could also change the values
    in your code, like this:


    ```

    subtotal = 10.0;

    subtotal = 20.2;

    subtotal = 105.6;

    ```


    But sometimes you may want to make sure that a value cannot be changed. For example,
    if the tax rate is 20% you might declare a variable like this:


    ```

    double TAXRATE = 0.2;

    ```


    But now some other programmer might accidentally set a different tax rate (this
    is not a problem in a very small program – but this sort of error can easily crop
    up in a realworld program that contains tens or hundreds of thousands of lines
    of Java code). For example, it would be permissible to assign a new value of 30%
    to the TAXRATE variable like this:


    ```

    TAXRATE = 0.3;

    ```


    If you want to make sure that this cannot be done, you need to make TAXRATE a
    constant rather than a variable. A constant is an identifier whose value can only
    be assigned once. In Java, you can create a constant by placing the final keyword
    before the declaration like this:


    ```

    final double TAXRATE = 0.2;

    ```


    Now it would be an error (my program would not compile) if I tried to assign a
    new value to TAXRATE in my code.'
