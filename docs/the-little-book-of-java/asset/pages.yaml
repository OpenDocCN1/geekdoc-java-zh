    on a new line */

    ```


    In addition to these multi-line comments, you may also add ''line comments'' that
    begin with two slash characters // and extend to the end of the current line.
    Line comments may either comment an entire line or any part of a line which may
    include code before the // characters. These are examples of line comments:


    ```

    // This is a full-line comment

    if (args.length ==){ // this is a part-line comment

    ```


    An IDE like NetBeans may automatically insert comments when it creates code files.
    You may edit or delete those comments without affecting the behavior of the code.


