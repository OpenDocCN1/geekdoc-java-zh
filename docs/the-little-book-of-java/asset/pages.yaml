    \ a different number of lines so you cannot assume, in advance, that there will\
    \ be a specific number of lines to process. One way of dealing with this problem\
    \ is to use a while loop which continues to execute as long as some test condition\
    \ remains true. This is the syntax of a while loop:\n\n```\nwhile (condition)\
    \ {statements}\n```\n\nThere are some basic examples of while loops in the WhileLoops\
    \ sample program. Here we create an array, intarray, of five integers and I use\
    \ a while loop to count through the elements of that array while the value of\
