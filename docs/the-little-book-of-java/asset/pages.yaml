  md: '# Chapter 8 — Enums, Interfaces and Scope


    Here method() calls methodA(). The only variable called x that is in the scope
    of methodA() is the one declared outside that method which has the value 10. So
    the value of x is appended to the text in the box, outputTA:10 is displayed. Now
    method() calls methodB(). This method declares a local variable x which is assigned
    the value 100. The local variable takes precedence over the class-level variable
    so the value displayed now is 100.


    It is important to note that even though the local variable x has the same name
    as the class-level variable, these are two different variables. The local variable
    pops into existence when the method is entered and it pops out of existence again
    when the method is exited. Its value does not affect the value of the variable
    with the same name outside that method. So though the local variable x was assigned
    100, the value of the class-level variable declared outside the method is unchanged.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_148_0.png)


    # Global and Local Variables


    In the preceding example, the scope of the variable x within methodA() is ''local''
    to the method itself. It is a local variable with local scope. The scope of the
    variable x declared outside that method is the class in which it is declared.
    You could say its scope is local to that class.


    However, you will often hear programmers say that it is a ''global'' variable
    — meaning that its scope is widely or ''globally'' visible to all the methods
    in the class. The precise meaning of ''global'' scope in programming varies from
    language to language (a truly global variable would be visible to all the code
    everywhere in your program). I prefer, therefore, to refer to ''class-level variables''
    to describe variables whose scope is a single class.


    # Access Modifiers


    You can restrict the visibility of methods by declaring them using private, public
    or protected. When a method is private it can be accessed only from other methods
    declared in the same class. This is useful if you want to make sure that code
    that uses the class or objects created from that class cannot directly access
    those methods. Here is an example of a private method:'
