  md: "# Chapter 7 — Loops\n\nIn order to break to this label (which would exit both\
    \ the inner and the outer loop) you add the label name (without a colon) after\
    \ break:\n\n```\nbreak outerloop;\n```\n\nThe LabelBreak sample program demonstrates\
    \ the effect of breaking to a label:\n\n```\nLabelBreak\nouterloop:\nfor (int\
    \ row = 0; row < 4; row++) {\n  System.out.printf(\"--- row %d : %s \\n\", row,\
    \ Arrays.toString(grid[row]));\n  for (int column = 0; column < 5; column++) {\n\
