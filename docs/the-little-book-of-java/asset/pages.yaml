    # Boolean Values


    Logical operators test Boolean values. A Boolean value can either be true or it
    can be false. Java provides a boolean data type which can hold either a true value
    or a false value:


    ```

    Booleans

    boolean happy;

    boolean rich;


    happy = true;

    rich = false;

    ```


    It is possible to create quite complex conditions by chaining together tests with
    multiple && || operators. You may need to enclose multiple-part tests between
    parentheses to ensure that the component tests are all evaluated together to return
    a true or false value. For example, by placing parentheses around the first two
    conditions here I can be sure that ((income > 100000) || (wonTheLottery)) is evaluated
    as a single test.


    ```

