  md: '# More Little Programming Books...


    The Little Book Of Java Programming is one of a series of ‘Little Books Of ...’
    for programmers. In each Little Book we aim to give you just the stuff you really
    need to get straight to the heart of the matter without all the fluff and padding.


    We know that there is plenty of information online about standard code libraries,
    we don''t fill the pages of these books by duplicating that information. Instead,
    we aim to explain the really important details that you need to gain a solid understanding
    of each subject and start hands-on programming as quickly as possible.


    Some other Little Books Of ...’ are:


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_190_0.png)


    # The Little Java Book of Adventure Game Programming


    +   Advanced object oriented techniques:

    - Create command line games

    - Parse user input

    - Open, close and lock containers

    - Put treasures into containers

    - Object properties and adjectives

    - Traverse networks recursively


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_190_1.png)


    # The Little Book of C#


    +   A beginners guide to the C# language:

    - Object Orientation

    - Classes and Methods

    - Methods & Arguments

    - Arrays & Strings

    - Exception-handling

    - Lists & Generics'
