    # Compiling and Running Programs from the Command Prompt


    If you have properly installed Java, you can go to the command prompt or Terminal
    in order to compile and run programs. You must be sure that both the Java compiler
    javac.exe and the application launcher java.exe are on the system path so that
    they can be run from any directory. To verify open a command prompt and type these
    two commands:


    ```

    javac

    java

    ```


    In both cases, some lines of help text should be displayed. If, on the other hand,
    you see an error message telling you that the command is not recognised or your
    name cannot be found, you need to add the directory containing those programs
    to your system path. For example, on Windows 10, you could open Windows Settings,
    search for “path” in the search box. Click the link to edit environment variables.
    In the dialog box, click Edit the system environment variables, then click Environment
    Variables. In the System Variables list, select Path then click Edit. Click New.
    Now add the full path to the directory containing java.exe and jdk.exe. For example,
    on your PC this is:


    ```

    C:\Program Files\Java\jdk1.8.0_111\bin

    ```


