  md: 'Chapter 3 — Elements of Java Programming


    # Type Casts


    Sometimes it may be useful to tell the Java compiler to treat one data type as
    another data type, assuming that the two data types are compatible (that is, that
    is it actually makes sense to treat one type as the other type – for example,
    it wouldn''t make sense to treat "Hello world" as an integer). You can accomplish
    this by ''type casting''.


    Let''s assume that you have declared a variable doubleVar which is a double but
    you now want to assign its value to another variable, floatVar, which is a float.
    Both double and float are floating numbers so they are compatible with one another
    apart from the fact that the two data types have different ranges (maximum and
    minimum values).


    # double or float?


    With floating point numbers, the double data type is ''double precision'' which
    means that a double can store a bigger range of floating point values than a ''single
    precision'' float.


    The compiler will if you attempt to assign the larger (double) value to the smaller
    (float) variable, like this - that is trying to pour a gallon of water into a
    pint glass:


    ```

    floatVar = doubleVar;

    ```


    In order to perform this conversion, you could ''cast'' a double to a float by
    placing the target type name (float) between parentheses in front of the source
    (double) value:


    ```

    floatVar = (float) doubleVar;

    ```


    But careful! Remember that a float has a smaller range than a double so if the
    value that you assign is greater than the range of a float, that value will be
    truncated (you may try to pour a gallon into a pint glass but it is never actually
    going to contain more than a pint). Look at this code (in castBtnActionPerformed()
    method):


    | Primitives |

    | floatVar;

    | doubleVar;

    | doubleVar = 1.76598700980000052;

    | floatVar = (float) doubleVar;

    | outputTA.setText("doubleVar = " +doubleVar + ", floatVar = "+floatVar\);


