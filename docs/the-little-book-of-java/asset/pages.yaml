    C and Pascal programmers may be alarmed to see that I keep creating objects using
    `new` but I never bother to dispose of them (to free up their memory). I don''t
    do this because I don''t need to. In Java, when objects are no longer required
    (i.e. they are no longer referenced by anything in your program), Java gets rid
    of them. This is called ‘garbage collection’. Once upon a time, garbage-collecting
    languages were rare. These days, many languages ranging from C# to Ruby provide
    garbage collection.


