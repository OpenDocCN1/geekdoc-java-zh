    array by putting each element between curly brackets and assigning them to the
    array name at the time of its declaration.


    In this case, one array (the ''outer'' array) contains some arrays (the ''inner''
    arrays) as its elements. I initialize the arrays by placing one set of curly brackets
    to delimit the outer array: int grid[][][] { } and I add a comma-delimited list
    of'
