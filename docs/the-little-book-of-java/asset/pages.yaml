  md: '# Chapter 7 – Loops


    Computer programs often need to perform the same task many times. Java lets you
    do this using several different types of loop. In this chapter we''ll see how
    these loops work.


    Computer programs often have to perform repetitive actions as printing a series
    of strings until there are no more strings to print or counting the number of
    treasures which a game-player has collected. Probably the most common type of
    loop – and one that we''ve already used in previous chapter – is the for loop.


    for


    As explained in Chapter 6, the traditional type of for loop is declared with three
    parts: initialization, test, and increment:


    ```

    for (initialization; test; increment) {statements}

    ```


    The initialization expression initializes the loop. Typically this takes the form
    of an integer loop variable which is assigned a starting value (for example i
    = 0). This is executed once only when the loop begins.


    The statements in the for loop continue to execute only as long as the test evaluates
    to true (for example, i < 10). When it evaluates to false (here when the value
    of i is not less than 10), the loop terminates.


    The increment expression is executed after each iteration through the loop. Typically
    this increments the loop variable (for example i++), but it may also decrement
    it.


    In the following example, the loop variable i is initialized with the value 0
    when the loop begins and it is incremented by 1 each time the loop executes. The
    statements in the loop – here System.out.println(i) – execute each turn through
    the loop. The loop ends when the test value i < 10 is no longer true. In other
    words, the loop runs while i is less than 10:'
  merge: -1
  pgno: 106
