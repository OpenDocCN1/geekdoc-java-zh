  md: '# Custom Interfaces


    Let''s see how you might go about writing your own interface. Let''s suppose that
    you are leading a team of programmers developing a game. The game defines a variety
    of classes that have some sort of value. These may be anything from Treasure to
    a Score.


    The trouble is the Treasure and Score classes are not related through inheritance.
    Treasure is a descendant of the Thing whereas Score has nothing in common apart
    from the fact that they both store a value and they need to have methods that
    can add to or subtract numbers from that value.


    One way of dealing with this would be to write an interface that defines the methods
    needed to manipulate values and then make both the Treasure and Score classes
    implement that. In my Interfaces program, I define this interface in the ValuableItem.java
    code file in the myinterfaces package:


    | Interfaces (myinterfaces.ValuableItem.java) |

    |--- |

    | package myInterfaces;

    | public interface ValuableItem {

    | public int value();

    | public void addValue(int aValue);

    | public void deductValue(int aValue);

    |} |


    I create a Treasure class that inherits the features of its ancestor Thing class
    and implements the methods declared by the ValuableItem interface:


    ```

    public class Treasure extends Thing implements ValuableItem {

    ```


    You can see the complete code of my Treasure class on the next page. The @Override
    annotations here are optional but recommended. They provide information to the
    compiler to tell it that the methods that follow the annotations have been previously
    declared. The compiler can then compare the method ''signature'' its name and
    arguments – with the previous declaration, to make sure that they match.


    I said earlier, that one interface can be implemented by many classes and that
    the ValuableItem interface which is implemented by Treasure might also be implemented
    by another class such as Score.'
