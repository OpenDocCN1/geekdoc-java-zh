  md: '# Chapter 5 – Tests and Operators


    You will often need to change and test values in your programs using operators
    so that the code can take different actions in different circumstances. That''s
    the subject of this chapter.


    Frequently, in your programs, you will need to test if two variables have the
    same or different values. Java provides ‘operators’ to help you do these tests.
    In this chapter we''ll discover how to use Java operators to write conditional
    tests, modify the values of variables and do arithmetical calculations.


    We''ve seen some operators already – for example, in the Hello/Args program in
    Chapter 1, we used the equality operator (==) to test if the number of arguments
    entered on the command line (args.length) equalled 0:


    ```

    if (args.length == 0)

    ```


    We used the multiplication (*) and addition (+) operators, as well as the assignment
    (=) operator in the TaxCalc program from Chapter 3. You may recall that, in that
    program, we multiplied the subtotal variable by the TAXRATE constant and assigned
    the calculated value to the tax variable. The values of the subtotal and tax variables
    were added together and the result was assigned to the grandtotal variable:


    ```

    tax = subtotal * TAXRATE;

    grandtotal = subtotal + tax;

    ```


    In this chapter we will look at a number of other operators too.


    # Operators


    So what exactly is an operator? Put simply, operators are special symbols that
    are used to do specific operations such as the addition and multiplication of
    numbers or the concatenation (adding together) of strings.'
