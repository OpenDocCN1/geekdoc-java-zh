  md: 'A Message from the Author


    # A Message from the Author


    Thank you for reading my book. I hope you''ve found it useful – and, with luck,
    even enjoyable! I''ve been programming, and writing about programming, since the
    early 1980s. In the series of ‘Little Books’ I hope to be able to pass on some
    of the knowledge that I''ve gained over the years and provide readers with the
    sort of books I wish been available (but weren''t!) when I was learning to program.


    Writing these books, and all the sample code that goes with them, takes a great
    deal of time and effort, while I enjoy writing them – because, after all, programming
    is something I love – it is really hard for me for my books to compete against
    books produced by big publishing companies.


    *You can help me!*


    Reviews are incredibly important to me. They let potential readers know if my
    books have been useful to other people so that they can decide whether they might
    also be useful to them. I would therefore be really grateful if you could take
    a few moments to leave a short review on Amazon. You can do that by clicking one
    of the links on the next page, using your phone to read the QR code or (on other
    Amazon sites) by clicking the ‘Write a Customer Review’ button on the book page.


    Thanks again for reading my book!


    Huw Collingbourne'
