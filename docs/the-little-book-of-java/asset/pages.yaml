    ''Run Project'' button or by selecting the Run Project item from the Run menu.
    All being well, you will now see the output from the program – that is, the text
    Hello world – displayed in the NetBeans Output window.


    # How to Load the Sample Projects in NetBeans


    If you are using NetBeans, you can load the projects from the source code archive
    one a time or you can create a ''project group'' so that all the projects can
    be loaded simultaneously.'
