    \ One way of doing that would be to write a do...while loop.\n\nA do...while loop\
    \ is essentially the same as a while loop, apart from the fact that the test condition\
    \ is placed at the end of the loop rather than at the beginning. This means that\
    \ the statements inside the loop are bound to execute at least once before the\
    \ test condition is even evaluated. This is the syntax of a do...while loop:\n\
    \ndo {statements} while (condition);\n\nHere is a very simple example of a do...while\
