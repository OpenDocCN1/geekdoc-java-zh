    \n# String Equality\n\nLet's consider why two apparently identical strings are\
    \ considered to be different. It turns out that each string occupies its own chunk\
    \ of memory and it is, therefore, considered to be different from every other\
    \ string. Remember, in Java, an integer is a simple piece of data – a primitive.\
    \ But a string is an object – and every object is different from every other object.\
    \ This is true even when two strings contain exactly the same characters.\n\n\
    ![](img/8c3ac46909d3d5f277ec850365ee22ff_79_0.png)\n\n# Strings are Objects?\n\
    \nNot all programming languages deal with strings this way. Even the C# language\
