    Other IDEs such as Eclipse and IntelliJ also provide visual Graphical User Interface
    (GUI) designers. Typically a Java visual interface relies upon a set of Java tools
    and classes called Swing. Note, however, that a design created using one IDE may
    not be directly editable in another IDE. The visual designs supplied in the code
    archive of this book have all been created with NetBeans.'
