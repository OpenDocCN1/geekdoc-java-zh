  md: "# # Chapter 8 – Enums, Interfaces and Scope\n\nIn this chapter I'll explain\
    \ how enumerated constants can help code clarity, how interfaces can redefine\
    \ the behavior of classes and why the position of a piece of code is important.\n\
    \nSometimes your programs may need to work with a fixed set of related values\
    \ – for example, a calendar program may need to deal with the seven days of the\
    \ week, whereas a gambling program might deal with from four suits of playing\
    \ cards. In order to represent these values you could use integers from 0 to 6\
    \ for days or from 0 to 3 for suits of cards respectively. But often it would\
    \ be clearer if you could use named identifiers instead of numbers. For example,\
    \ consider this code:\n\n```\nif ((suit == 0) || (suit == 1)) {\n  System.out.println(\"\
    This card is a red suit\");\n}\n```\n\nCompare with this code:\n\n```\nif ((suit\
    \ == Suits.HEARTS) || (suit == Suits.DIAMONDS)) {\n  System.out.println(\"This\
    \ card is a red suit\");\n}\n```\n\nAs far as the computer is concerned the two\
    \ code fragments above mean the same thing; when your program runs, they will\
