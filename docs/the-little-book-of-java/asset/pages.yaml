  md: '# Chapter 8 — Enums, Interfaces and Scope


    # The Enum Class


    In some programming languages, an enum is simply collections of names – constants
    that may, or not may, have some associated value such as an integer. For example,
    this is how I might declare an enum in the C language:


    ```

    enum directions {

    NORTH, SOUTH, EAST, WEST

    };

    ```


    By default, c assigns integer values to enum constants. Here NORTH would be assigned
    0, SOUTH would be assigned 1 and so on. At first sight, a Java enum may look pretty
    much like a C. But in fact, when you create an enum in Java you are actually defining
    a class that is a descendant of the Enum class.


    Your enum (just like a regular class) is able to contain specifically typed data
    items as the NOEXIT constant I added to my Direction enum. In fact, a Java enum
    can even contain methods. The Oracle Java tutorial provides an example of quite
    a complex enum Planet which has its own constructor, methods and variables.


