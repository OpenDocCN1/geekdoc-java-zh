  md: '# Chapter 4 — Object Orientation


    # # Constructors


    The Thing class also has a constructor method. A constructor is a special method
    which, in Java, has the same name as the class itself. Often a constructor method
    can be used to initialize the fields (the variables) of an object. Here, for example,
    my Thing constructor receives two string arguments, aName and aDescription, which
    it assigns to its private variables, name and description:


    ```

    public Thing(String aName, String aDescription) {

    // constructor

    name = aName;

    description = aDescription;

    }

