  md: '# Chapter 3 — Elements of Java Programming


    Simple data types are known as ''primitives''. There are precisely eight primitive
    data types available to you in Java. Four of them are integers (byte, short, int,
    long), two are floating point numbers (float and double), one is an alphanumeric
    character (char) and one is a true or false value (boolean).


    The various numeric data-types have different ranges of possible values. These
    are shown below. When creating a variable of specific type you must be sure that
    the value falls within the supported range:


    | Type | Size | Range |

    |---|---|--|

    | Integers | | |

    | byte | 8 bits | -128 to 127 |

    | short | 16 bits | -32,768 to 32,767 |

    | int | 32 bits | -2,147,483,648 to 2,147,483,647 |

    | long | 64 bits | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | Floating Points | | |

    | float | 32 bits | 3.40282347 × 10⁻³⁸ to 1.40239846 × 10⁻⁴⁵ |

    | double | 64 bits | 1.7976931348623157 × 10³⁰⁸ to 4.940656485412645 × 10⁻³²⁴
    |

    | Character | | |

    | char | 16 bits | |

    | Boolean | | |

    | boolean | 1 bit | true or false |


    Since primitives have no methods, Java needs a way of wrapping up primitives inside
    something that does have methods which can be used upon the specific primitive
    data type. You can think of Integer as a wrapper for int primitive and Double
    with a capital D as a wrapper for double primitive. These wrappers are Java classes.
    I''ll have a lot to say about classes in the next chapter. It is this wrapper
    classes that supply methods such as Integer.toString() to convert an int to its
    representation:


    | Primitive | Wrapper Class |

    |---|--|

    | byte | Byte |

    | short | Short |

    | int | Integer |

    | long | Long |

    | boolean | Boolean |

    | char | Character |

    | double | Double |

    | float | Float |'
