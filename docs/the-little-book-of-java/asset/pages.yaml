  md: '# Class Hierarchies


    One of the key features of object orientation is inheritance. Put simply, this
    means that you can create a ‘family tree’ of classes in such a way that one or
    more classes inherit the features of another class.


    The class from which features are inherited might be considered to be an ancestor,
    the classes that inherit features from the ancestor class might be thought of
    as its descendants. A descendant class is also called a subclass. An ancestor
    class is often called a superclass.


    Let’s suppose I want to create a NoisyThing class that is a ‘type’ of Thing —
    so it inherits the features of the Thing class, that is, a name and a description,
    but it adds on two new features, a noise and a volume. You can picture it like
    this:


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_62_0.png)


    To create a subclass, you need to place the keyword extends between the new class
    name and the name of its subclass. This is how I have declared a class named NoisyThing
    to be a subclass of the Thing class:


    ```

    Objects (NoisyThing.java)

    public class NoisyThing extends Thing

    ```


    A subclass inherits the features (the methods and variables) of its ancestor so
    you don’t need to recode them. In this example, the Thing class has two variables,
    name and description along with four accessor methods, getName(), setName(), getDescription()
    and setDescription() to access those variables.'
