  md: 'Let''s suppose you initialize two strings as follows:


    ```

    String s1 = new String("Hello");

    String s2 = new String("Hello");

    ```


    Now you compare s1 and s2 using this test:


    ```

    (s1 == s2) // This evaluates to false

    ```


    The test evaluates to false because, even though the two strings contain the same
    characters, s1 is a different string object (I''ve created each explicitly using
    new) to s2. The same will be true of any string objects that are created at runtime
    (for example, by assigning the text from a text field to a string variable).


    However, when two identical strings are assigned to variables (without creating
    new objects) they will reference (or ''point to'') the same string. That is because
    string literals created in your code before compiling an application are saved
    into a ''table'' of strings and any variable that is assigned to that string will
    reference this stored value. As a consequence, two variables such as below, which
    are assigned the same string will return true when tested for equality using the
    == operator:


    | StringCompare |

    | String s1 = "Hello"; String s2 = "Hello"; |


    (s1 == s2) // This evaluates to true


    That is why Java strings have the equals() method. This method compares the characters
    in two strings and return true if those characters are the same.


    # Which is the ‘Best’ Way To Test Strings?


    Look at the code in the StringCompare project to help you understand how strings
    are compared in Java. If you find this confusing, just remember that in most cases,
    it is not a good idea to compare strings using the == operator. You should, instead
    use the equals() method. Whereas the == operator returns different results depending
    on how and when a string was assigned to a variable, the equals() method is consistent
    in all cases.


    ![](img/8c3ac46909d3d5f277ec850365ee22ff_80_0.png)'
