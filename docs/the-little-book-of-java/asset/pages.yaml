  md: "# Naming Conventions\n\nWhen you give names to variables, classes and other\
    \ programming elements it is normally neater and clearer if you adopt a consistent\
    \ 'naming convention'. So, for example, you may decide to name private variables\
    \ such as `description`, all in lowercase like this:\n\n```\nprivate String description;\n\
    ```\n\nYou might name functions (methods) in mixed case with the first letter\
    \ in lowercase and any other words capitalized like this:\n\n```\npublic String\
    \ getDescription()\npublic int moveToPlayer(Direction dir)\n```\n\nI won't be\
    \ insisting on a strict set of naming conventions in this book. In real-world\
    \ programming, the naming (and code formatting) conventions are often defined\
    \ by the team-leader of a specific project. If you are programming alone, you\
    \ have more freedom to decide on naming conventions. In this book I will mention\
    \ important conventions, ones that are very widely adopted or are syntactically\
    \ required, as I encounter them – example, the capitalization of class names and\
    \ constants.\n\n# Making Sense of the Text\n\nIn *The Little Book Of Java*, any\
    \ Java source code is written like this:\n\n```\npublic void setThings(ThingList\
    \ things) {\n    this.things = things;\n}\n```\n\nSome code may be preceded by\
    \ a project name, sometimes with the source file name shown in parentheses:\n\n\
    | AdventureGame1 (Thing.java) |\n| public void setName(String aName) {\n    name\
    \ = aName;\n} |"
