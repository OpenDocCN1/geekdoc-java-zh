    # 简介


    ## 什么是冒险游戏？


    ![](img/f210b6659f24a42b28725bec993abfc1_9_0.png)


    在这里，你看到的是作者个人收藏的经典复古冒险游戏的一小部分。


    冒险游戏——特别是*文本*冒险游戏——就像一个发生在一个连接位置的世界中的故事。通常，玩家可能需要探索广阔的区域，以找到某些宝藏，并使用它们来解决谜题。你通过输入单词而不是点击菜单或按钮来与游戏交互。在本书书中，我将开发一个能够理解简短英语命令的游戏，例如：


    - 拿起剑 (take the sword)

    - 丢掉戒指 (drop the ring)

    - 看看那个臭臭的大袋子 (look into the big smelly sack)

    - 打开珠宝盒 (open the jewel box)

    - 关闭海盗宝箱 (close the pirate treasure chest)

    - 将魔法金戒指放入小丝绸兜袋 (put the magic gold ring into the small silk reticule)


    ……等等。


    # 交互式小说


    文本冒险游戏有时被称为“交互式小说”（interactive fiction）或简称为“IF”。这强调了这类游戏的叙事性。某些冒险游戏提供了很长的描述性段落，玩家可以输入文本来获取更多信息、查看物体并以其他方式与游戏交互。


    # 在哪里可以玩文本冒险游戏？


    当然，在你编写自己的冒险游戏之前，如果能玩一些现有的游戏将很有帮助。我建议你从 Infocom 公司在 20 世纪 70 年代和 80 年代开发的经典之作开始。这些包括《奎克》（Zork）三曲（一个关于地下帝国的魔法与探索的游戏）、《三位一体》（Trinity，《爱丽丝仙游》遇上原子弹！）；以及《银河系漫游》（The
    Hitchhiker''s Guide To The Galaxy，Infocom 版对道格拉斯·亚当斯广播剧和小说的改编）。附录提供了可以找到其中一些游戏的网站链接。


    ![](img/f210b6659f24a42b28725bec993abfc1_10_0.png)


    # 冒险游戏简史


    虽然无法知道是谁写了第一个文本冒险游戏，但第一个在计算机用户中引起兴趣的几乎是 Crowther 的《巨型洞穴》（Colossal Cave），它有时被称为“原始冒险游戏”。除了编程，Crowther
    还是一个爱好者，他解释了为什么他的冒险游戏发生在一个巨大的洞穴系统内。《巨型洞穴》开发于 1975 年至 1977 年之间，并在另一位程序员 Don Woods
    的帮助下完成。他们的游戏是用 FORTRAN 语言编写的，运行在 PDP-10 主机计算机上。


    冒险游戏演进的下一步随着《奎克》（Zork）的发布到来。这个游戏很大程度上借鉴了《巨型洞穴》，包括构成了《奎克》世界大部分部分的地下洞穴网络。它由 Dave
    Lebling 领导的 MIT 程序员团队开发。


    《奎克》最初是用 MDL 语言编写的，同样运行在 PDP-10 上。MDL 是一种基于 LISP 列表处理语言的语言。后来该游戏被重写了多次，最著名的一个是用
    ZIL（Zork 实现语言）编写的，这是另一种专门为编写游戏开发的类 LISP 语言。当 Infocom 公司于 1979 年成立时，《奎克》最终发布了一个可以在个人计算机上运行的版本。


    # 简介


    Infocom 凭借《星际交叉》（Starcross）、《福玻斯的皮革女神》（The Leather Goddesses Of Phobos）和《魔法师》（Enchanter）等作品主导了冒险游戏领域。Infocom
