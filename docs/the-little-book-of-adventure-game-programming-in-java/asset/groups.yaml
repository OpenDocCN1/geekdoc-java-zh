    It is a display console into the desk.

    It is displaying this message:

    Starship currently in FTL mode (operate with caution!)


    For your convenience, I''ve added the above commands to the test() method of the
    Game class. Just enter the command "test" to execute it.


    --I have now shown you how to program a complex game with linked rooms, treasures
    inside containers and a player that can interact with the game – by moving from
    room to room, taking and dropping objects and performing all kinds of other actions
    such as opening, closing and locking objects, looking at or into objects and putting
    objects into containers.


    What is left to program? Well, a lot, as a matter of fact. Indeed, I go so far
    as to say that there is really no limit (other than your own inventiveness!) to
    the additional features that might be added. Here are a few suggestions...


    ## More Actions


    So most of the actions have been ‘tactile’ – things that the virtual player does
    with virtual hands: moving, taking, dropping, putting things into other and so
    on. The exception to this rule have been a few ‘visual’ actions: ‘look’, ‘look
    at’, ‘look into’. Why not add ‘listen’ and ‘listen to’? Or ‘smell’ or even ‘taste’?
    You could even add ‘eat’ and ‘drink’ – so some liquids will make the player grow
    to enormous size or shrink to a tiny size like Alice In Wonderland.


    What about some extra ‘look’ and ‘put’ actions: ‘look under’ and ‘put under’,
    ‘look up’, ‘put onto’ and so on? Maybe you could add a few extra actions, similar
    to my ‘unlock’ action to implement – ‘look at’ with (e.g. “Look at the fingerprint
    with the magnifying glass”).


    ## More Classes


    Maybe you need some levers to open the dam gates. Or Buttons to activate the laser
    destroyer ray. Both a lever and a button are two-state devices. Why not note a
    two-state class with Level and Button subclasses? You could even add multi-state
    devices say dials that go from 0 to 9. They could be used as a combination locks
    on safes or activations for the warp drive.


    The player might need to find the activation code hidden in some special location
    before the safe can be opened or the warp drive initialized. You might also think
    of adding characters – people, robots, monsters.


    Very simple characters could be treated as special types of GameThing. More complex
    characters – ones such as robots or thieves, which need to interact with their
    environment – could be created as Actor objects. You might need to subclass the
    Actor class to provide special features for such characters.


    ## Extend the Parser


    Add more words, define more commands. Maybe define synonyms so that, for example,
    "knife" is a synonym of "dagger"? the player could either "take knife" or "take
    dagger" and, if there is a dagger here, it will be taken. If you want to try adding
    this, think how I dealt with adjectives. This is a similar problem – allowing
    a single object to be identified using one or more different words.


    ## What Sort of Game?


    My sample game has been set on a ship. Many traditional adventure games are set
    in a fantasy world with a landscape of mountains, forests and caverns where magic
    scrolls provide the solutions to puzzles. But you can set your game in any world
    of your choosing.


    You might write a romantic adventure set on a Caribbean island or a detective
    set in 1930s Chicago. Your player might be a policeman hunting The Ripper through
    the swirling mists of Victorian London. Or you might set your story in a haunted
    house, on Mars, under the sea, in Antarctica – literally anywhere you find interesting.


    ## How to Get Started


    The easiest way to start writing your own game would be to use the code from Starmania
    project but substitute just three code files that define the data and special
    actions unique to your own game. Two of these files are found in the game.data
    package:


    GameData.java: Here you need to create the Rooms and objects for your game.

    VocabularyData.java: Here you need to add the words understood by your game.


    The third file, in game.gameObject.special package, is the one that defines any
    ‘special’ actions for the game – so that when the magic is put into the golden
    box, for example, something special occurs which does not occur when you put any
    other object into any other container:


    Actions.java: Here you add methods to perform ‘special’ actions.


    While you could write a game without adding any actions at all (in which case
    you would only need to modify GameData.java and VocabularyData.java) but in the
    course of developing your own game it is highly likely that you will want to add
    some non-standard actions. As a final step, you should rename the ‘main’ class
    — currently called Starcrash — to give it whatever name you want your game to
    have.

