    # But wait, there’s more Little Books Of ...


    The Little Book Of Adventure Game Programming is one of a series of ‘Little Books
    Of...’ for programmers. In each Little Book we aim to give you just the stuff
    you really need to get to the heart of the matter without all the fluff and padding.


    We know that there is plenty of information online about standard code libraries,
    so we don''t fill the pages of these books by duplicating that information. Instead,
    we aim to explain the really important details that you need to gain a solid understanding
    of each subject and hands-on programming as quickly as possible.


    Some other ‘Little Books Of...’ are:


    ![](img/f210b6659f24a42b28725bec993abfc1_190_0.png)


    # The Little Book of C#


    +   A beginners guide to the C# language:

    - Object Orientation

    - Classes and Methods

    - Methods & Analytics

    - Arrays & Strings

    - Exception-handling

    - Lists & Generics


    ![](img/f210b6659f24a42b28725bec993abfc1_190_1.png)


    # The Little Book of Pointers


    +   An in-depth guide to pointers in C:

    - Indirection

    - Pointer arithmetic

    - Data Alignment

    - Linked Lists (single/double)

    - Stacks & Queues

    - Function Pointers

    - Common Pointer Problems'
