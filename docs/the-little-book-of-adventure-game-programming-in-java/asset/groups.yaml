    # Black Box Encapsulation


    In my view, data-hiding is a necessary feature of true encapsulation. An object
    is not truly encapsulated unless its data is hidden from other code. The only
    way to get at the data inside an encapsulated object should be via its methods.


    However, many programmers use the term ‘encapsulation’ to mean simply the inclusion
    of both data (variables or fields) and methods (functions) within objects even
    when the data are public. Some Object Oriented programmers prefer the term ‘black
    box encapsulation’ to emphasize that their objects are strictly encapsulated and
    have private data.


    A strictly encapsulated object is a sealed box. From outside the box you can see
    what it contains. All you know is its behavior. It sends messages. It returns
    replies like an old-style mainframe computer into which punched cards were fed
    (messages) and from rolls of printed output were produced (replies).


    The advantage of black-box encapsulation is that the code of methods is hidden
    outside each object. The programmer who created a strictly encapsulated class
    can feel free to rewrite it without worrying about causing unintended side-effects
    due to some other code relying upon the implementation details of those methods.
    Only the messages that can be sent (defined by the method name and arguments)
    and the data that is returned are visible to the code beyond any object. The implementation
    of the methods goes like this:


