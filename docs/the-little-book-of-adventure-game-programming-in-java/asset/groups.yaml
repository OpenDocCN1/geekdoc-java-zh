  mdcn: "\n\n## 第二章 – 描述物品的形容词\n\n| Starcrash (Preposition.java) |\n| public class\
    \ Preposition extends GrammarUnit implements java.io.Serializable { \n public\
    \ Preposition(String aWord) { \n } } |\n\n名词短语（NounPhrase）要稍微复杂一些。除了主词（名词）外，它还包含一个形容词的\
    \ `ArrayList` 以及一个 `phrase()` 方法，该方法会返回一个格式化的字符串，例如 \"small gold elvish ring\"\
    金色金色精灵戒指），其中包含了所有的形容词和名词：\n\n| Starcrash (NounPhrase.util.ArrayList) |\n| import\
    \ java.util.ArrayList; \n public class NounPhrase extends GrammarUnit implements\
    \ java.io.Serializable { \n private ArrayList<String> adjectives; \n NounPhrase(String\
