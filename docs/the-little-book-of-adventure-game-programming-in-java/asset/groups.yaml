    # 但等一下，还有更多《……小书》……


    《冒险游戏编程小书》是为程序员编写的一系列“……小书”中的之一。在每本小书中，我们的目标是为您提供真正需要的、直击问题核心的内容，而剔除所有的废话和填充。


