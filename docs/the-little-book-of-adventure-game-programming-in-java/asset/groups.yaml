    # Testing Code


    In the AdventureGame5 project I''ve added a "test" command. If you enter the string
    "test" at the prompt when running the program, it executes the test() function.
    Here you can enter any number of commands like this:


    ```

    showTest("get carrot");

    showTest("get bowl");

    showTest("put carrot in bowl");

    showTest("put bowl in sack");

    ```


    The strings passed to showTest() will be treated in the same way as commands entered
    by the user. This makes it easy to perform repetitive tests on code that you are
    developing without having to enter numerous commands at the prompt.


    # Displaying Lists Recursively


    The showThings() method was a simple test of the recursive technique I need to
    use in order to display the things either in a Room or in the player''s inventory.
    I now need to write some similar code in an appropriate class. Which class should
    I choose?

    I could choose the Room class but then I''d need to rewrite the same code in Actor
    and also in ContainerThing. It makes more sense to implement this behavior in
    the ThingHolder class which is an ancestor of Room, Actor and ContainerThing,
    so those classes will automatically inherit the recursive methods.


    You might wonder why I didn''t decide to add these recursive methods directly
    to the ThingList. I considered doing that but I quickly realized that there is
    a disadvantage. When processing the things in one ThingList (say the bowl''s list)
    I would not have a reference to the list (say the sack''s list) in which the bowl''s
    list itself is stored.


    Sometimes that will be useful. I may, for example, to tell the player that "You
    see the carrot which is in the bowl which is in the sack." ThingHolder class defines
    an object that contains other objects so it provides me with an immediate reference
    to the container in which any given object in a ThingList can be found.'
