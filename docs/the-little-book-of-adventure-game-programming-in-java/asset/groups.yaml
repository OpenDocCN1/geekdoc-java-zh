    # # Introduction


    This book provides a step-by-step guide to creating retro-style text adventure
    games just like the classics such as Zork and The Hitchhiker''s Guide To The Galaxy.


    In the pages that follow, I will show you how to create an exploring-style game
    containing a map of connected locations. The player will interact with the game
    by entering English-language commands to move around, take or drop treasures and
    solve puzzles.


    ![](img/f210b6659f24a42b28725bec993abfc1_8_0.png)


    By the end of this book you will be able to create games similar to the one shown
    above. I will explain all the coding techniques that you''ll need. You can download
    the source code of all the programs developed in this book plus a library of adventure
    game routines (the Bitwise Interactive Fiction Framework, ''BIFF'') to help you
    write games of your own.'
