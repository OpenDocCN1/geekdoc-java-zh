    in which related code units can be grouped together. Packages fulfil a similar
    role to the named folders on your computer disk. Your disk folders may group together
    related data files. Your Java packages group together related code. In fact, Java
    packages are usually placed into disk folders that have the same names as the
    packages.


    When code is not explicitly placed into a named package, it is treated as existing
    within an unnamed or ‘default’ package. This is convenient when developing simple
    applications, but it is recommended that all code should be placed into named
    packages.


    The Actor, Room, Thing, ThingHolder, List and Treasure classes have then been
    placed into the gameobjects package. The globally available Direction enum is
    placed into the globals package. The Game class is in the game package. The default
    package contains the AdventureGame class.


    The package name is placed at the top of the code unit. For example, the code
    files Actorjava and Roomjava, which contain the Actor and Room classes, both begin
    with this line of code:


    ```

    package gameobjects;

    ```


    When your code needs to use a class from a package, it can import a single class
    using the package name, a dot, then the class name, like this:


    ```

    import gameobjects.Actor;

    ```


    Alternatively, it can import all the classes from a package by using an asterisk
    instead of a class name. Here, for example, I import all the classes from the
    java.util package:


