    \ t, objname);\n            }\n        }\n    }\n}\n```\n\nThis method once again\
    \ takes a ThingHolder as an argument and calls itself to deal with any other ThingHolder\
    \ objects which it holds (literally, which are found in its ThingList).\n\nUnlike\
    \ the previous recursive method we looked at, this one doesn't return a string.\
