    \ adjectives; } \n public String phrase() { \n String s=\"\"; \n for (String a:\
    \ adjectives) { \n s += a + \" \"; } \n s += this.getWord(); \n return s; } }\
    \ |\n\n现在我需要一种方法将注释或“句子”分析为语法单元。我创建了一个 `SentenceAnalyzer` 类来完成此工作。它的构造函数接受 `WordAnd`\
    \ 对象的 `List` 作为参数——即一组对值列表，例如字符串 \"take\" 和 常量 `WT.VERB`，或者字符串 \"sword\" 和 `WT.NOUN`\
    \ 等。它有以下两个字段：\n\n## 第1章 — 描述物品的形容词\n\n### Starcrash (SentenceAnalyzer.java)\n\n\
    ```\nprivate List<GrammarUnit> sentence;\nprivate List<WordAndType> rest;\n```\n\
    \n在构造时，`SentenceAnalyzer` 对象将整个 `WordAndType` 列表分配给 `rest`（这里 `rest` 是尚未分析的“列表剩余部分”）。它的目标是遍历此列表，并由\
    \ `GrammarUnit` 对象构建出一个句子。每处理一个 `WordAndType` 元素，它就会从 `rest` 中移除。这是处理此逻辑工作的方法：\n\
    \n### Starcrash (SentenceAnalyzer.java)\n\n```java\npublic List<GrammarUnit> analyze()\
    \ {\n  WordAndType wt;\n  String word;\n\n  while (!rest.isEmpty()) {\n    wt\
    \ = getNextElement();\n    word = wt.getWord();\n    switch (wt.getType()) {\n\
    \      case VERB:\n        addVerb(wt);\n        break;\n      case ADJECTIVE:\n\
    \        case NOUN:\n          addNounPhrase(wt);\n          break;\n      case\
    \ PREPOSITION:\n        addPreposition(wt);\n        break;\n      default:\n\
    \        break;\n    }\n  }\n  return sentence;\n}\n```\n\n## 更多包，更多类\n\n在 Starcrash\
    \ 项目中，我继续通过创建许多专家类来重构代码，这些类被分组在包中，例如 `game.data`（包含“初始化”游戏的类）和 `game.grammar`（包含\
    \ `GrammarUnit` 类、其子类以及分析和分类单词及命令所需的其他类）。\n\n## 动词与介词\n\n由于 `Verb` 和 `Preposition`\
    \ 类各包含一个字符串，当在 `WordAndType` 列表中找到其中之一时，它会被简单的从 `rest` 中移除，然后找到该字符串以初始化合适的 `GrammarUnit`\
    \ 对象，并将其添加到 `sentence` 中：\n\n```java\nprivate void addPreposition(WordAndType\
    \ wt) {\n    sentence.add(new Preposition(wt.getWord()));\n    rest.remove(wt);\n\
    }\n\nprivate void addVerb(WordAndType wt) {\n    sentence.add(new Verb(wt.getWord()));\n\
    \    rest.remove(wt);\n}\n```\n\n## 名词短语\n\n当发现形容词或名词时，会调用 `addNounPhrase()` 方法：\n\
    \n```java\nprivate void addNounPhrase(WordAndType wt) {\n    WordAndType nextWT;\n\
    \    String noun;\n    ArrayList<String> adjectives;\n\nnextWT = wt;\nadjectives\
    \ = getAdjectives(nextWT);\nif (adjectives.isEmpty()) {\n    noun = getNoun(nextWT);\n\
    } else {\n    nextWT = getNextElement();\n    noun = getNoun(nextWT);\n}\nif (noun.isEmpty())\
    \ {\n    sentence.add(new GrammarError(\"Missing Noun\"));\n} else {\n    sentence.add(new\
    \ NounPhrase(noun, adjectives));\n}\n```\n\n### 形容词\n\n此方法首先调用 `getAdjectives()`\
    \ 来寻找一些形容词：\n\n```java\nArrayList<String> getAdjectives(WordAndType wt) {\n  \
    \  ArrayList<String> adjectives = new ArrayList<>();\n    boolean loop = true;\n\
    \n    while (loop) {\n        wt = getNextElement();\n        if (wt == null)\
    \ {\n            loop = false;\n        } else if (wt.getType() == WT.ADJECTIVE)\
    \ {\n            adjectives.add(wt.getWord());\n            rest.remove(wt);\n\
    \        } else {\n            loop = false;\n        }\n    }\n    return adjectives;\n\
    }\n```\n\n### 名词\n\n`addNoun()` 方法尝试寻找名词。顺便提一下，如果没有更多元素，它将返回 `null`：\n\n```java\n\
    private WordAndType getNextElement() {\n  if (rest.isEmpty()) {\n    return null;\n\
    \  } else {\n    return rest.get(0);\n  }\n}\n```\n\n在某些情况下，用户可能输入形容词但没有名词（例如\
    \ \"get small\"），此时我会向 `sentence` 添加一个 `GrammarError`：\n\n```java\nif (noun.isEmpty())\
    \ {\n  sentence.add(new GrammarError(\"Missing Noun\"));\n}\n```\n\n### 分析句子\n\
    \n在 `Parser` 类中，`processCommand()` 方法被重写了。它现在开始创建一个 `SentenceAnalyzer` 对象，并用 `WordAndType`\
    \ 列表初始化：\n\n```\nStarcrash (Parser.java)\nstatic processcommand() {\n  SentenceAnalyzer\
    \ analyzer;\n  analyzer = new SentenceAnalyzer(command);\n```\n\n一旦 `SentenceAnalyzer`\
    \ 对象用此列表初始化，它可以分析该列表并返回一个新的 `GrammarUnit` 对象的 `ArrayList`：\n\n```java\nList<GrammarUnit>\
    \ grammarunits = new ArrayList<>();\ngrammarunits = analyzer.analyze();\n```\n\
    \n例如，如果用户输入 \"take gold ring\"，命令将被解析为如下 `word`(String) 和 `wordtype`(WT) 对：\n\n\
    | word wordtype |\n| \"take\" VERB |\n| \"small\" ADJECTIVE |\n| \"gold\" ADJECTIVE\
