    # 第 7 章 – 保存游戏


    ```java

    // saveGame()

    FileOutputStream fos = new FileOutputStream("Adv.sav");


    // loadgame()

    FileInputStream fis = new FileInputStream("Adv.sav");

    ```


    # 对象输入输出流


    为了将这些字节作为代表对象的数据写入或读取，我必须在保存时将这些流之一传递给 `ObjectOutputStream`，在加载时将其传递给 `ObjectInputStream`：


    ```java

    // saveGame()

    ObjectOutputStream oos = new ObjectOutputStream(fos);


    // loadGame()

    ObjectInputStream ois = new ObjectInputStream(fis);

    ```


    那么 `ObjectOutputStream` 和 `ObjectInputStream` 到底是什么呢？Java API 参考告诉我：“`ObjectOutputStream`
    将原始数据类型和 Java 对象图写入 `OutputStream` 中。这些对象可以使用 `ObjectInputStream` 进行读取（重构）。换句话说，它们能够以流的形式写入和读取复杂的对象网络或‘图’。”在我的代码中，我将文件流传递给
    `ObjectInputStream` 和 `ObjectOutputStream` 的构造函数。


    一旦完成，保存我的整个对象网络就像使用 `ObjectOutputStream` 的 `writeObject()` 方法写入“顶层”对象（在这种情况下是包含所有其他对象的对象）一样简单：


    ```java

    oos.writeObject(game);

    ```


    然后我调用 `flush()` 以确保在关闭输出流之前任何缓冲区中的数据都已写入：


    ```java

    oos.flush();

    oos.close();

    ```


    重新加载数据的方法类似，只是这次我需要告诉 Java 我想从流中构造哪种类的的对象，这就是为什么在将数据赋值给我的 `game` 变量之前，我在括号中写了
    `Game`：


    ```java

    game = (Game) ois.readObject();

    ois.close();

    ```


    # Serializable 接口


    为了使序列化生效，我还需要做另一件事。每个想要可序列化的类都必须实现 `java.io.Serializable` 接口。这通知 Java 该类的对象可以用于序列化。如果你尝试序列化没有实现
    `Serializable` 接口的类的对象，将抛出 `NotSerializableException` 类型的异常。


    # 什么是 Serializable 接口？


    通常，Java 接口定义了方法，任何实现该接口的类必须编写这些方法的代码。例如，`List` 接口定义了 `add()` 和 `remove()` 方法。实现
    `List` 的类必须包含这些方法的代码。然而，`Serializable` 接口没有定义任何方法。它的唯一目的是标识可用于序列化的类。当一个类实现 `java.io.Serializable`
    时，它实际上是被“标记”为可用于序列化。


    就这些了。你现在有了一个基础的游戏框架，允许你创建带有玩家可以收集的宝物的链接房间地图。你可以使用序列化来保存和恢复你的游戏。在我们继续之前，我认为还有很多工作要做，我想现在是时候仔细查看游戏的代码并对其进行重构了，以确保在我们继续开发最终可能变成非常大型复杂的程序时，它是清晰、模块化且易于维护的。


