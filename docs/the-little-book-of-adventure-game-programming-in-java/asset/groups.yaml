  mdcn: "\n\n## 代码更改\n\n我第一次创建一个完整游戏的尝试可以在 Starcrash-beta-project 中找到。它被标记为“beta（测试版）”，因为在开发过程中，我意识到在代码变得适用于开发完整游戏之前，我还有许多需要改进的地方。这个\
