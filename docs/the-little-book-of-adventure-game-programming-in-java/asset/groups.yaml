    # 在线冒险游戏\n\n在编写自己的冒险游戏之前，先玩玩几个别人编写的游戏是个好主意。有很多免费的冒险游戏可以下载或在线玩。\n\nInfocom 的游戏可以从互联网上的多个地点（如\
