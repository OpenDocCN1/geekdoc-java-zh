  mdcn: "\n\n# 第 1 章——与游戏通信\n\n```java\nAdventureGame1 (Game.java)\npublic static\
    \ void parseCommand(List<String> wordlist) {\n    String verb;\n    String noun;\n\
    \    List<String> commands = new ArrayList<>(Arrays.asList(\"take\", \"drop\"\
    ));\n    List<String> objects = new ArrayList<>(Arrays.asList(\"sword\", \"ring\"\
    , \"snake\"));\n\n    if (wordlist.size() > 2) {\n        System.out.println(\"\
    Only 2 word commands allowed!\");\n    } else {\n        verb = wordlist.get(0);\n\
    \        noun = wordlist.get(1);\n        if (!commands.contains(verb)) {\n  \
    \          System.out.println(verb + \" is not a known verb!\");\n        }\n\
    \        if (!objects.contains(noun)) {\n            System.out.println(noun +\
    \ \" is not a known noun!\");\n        }\n    }\n}\n```\n\n这是一个非常、非常简单的解析程序，在目前的形式下，它对解析出的单词没有进行任何操作。然而，正如我之前提到的，这是一个“概念验证”测试。它向我展示了使用这些技术，我可以将用户输入的字符串拆分为单词列表，然后将这些单词与已知动词和名词的列表进行比较（如果我想多写点代码，也可以比较形容词、副词和介词）。这目前已经足够了。随着游戏的继续开发，我将扩展这个简单的解析器来处理更复杂的命令，并将使用这些命令来控制游戏中发生的情况。\n\
    \n# 第 2 章——地图\n\n探索风格的冒险游戏需要一个可以探索的地方。这意味着你需要一些地点，或者说是与其他房间连接的“房间”（Rooms）。换句话说，你需要一张地图。这就是本节课的主题。\n\
    \n在创建地图之前，我需要决定“房间”是一个什么样的对象。让我们从画一张简单的地图开始。我有四个房间：巨人房间、一片森林、一个洞穴和一个地牢。每个房间都有一个名字，并在四个方向（北、南、东、西）上有连接。当没有指向另一个房间的连接时，我将其称为“无出口”（No\
    \ Exit）：\n\n![](img/f210b6659f24a42b28725bec993abfc1_32_0.png)\n\n## 房间还是地点？\n\
    \n传统上，冒险游戏将地点称为“房间”（rooms），无论这些地点是否在字面上位于建筑内部。在本书中，当我谈到房间时，我指的是任何独特的地点，即使它恰好位于“外部世界”的某个处，例如街道或森林。同样，当我谈到“出口”（exit）时，指的是指向特定“方向”的另一个房间或地点的连接。\n\
    \n# 第 2 章 ——地图\n\n## Room 类\n\n为了创建房间对象，我首先需要编写一个 `Room` 类。从我画的地图中可以看出，房间需要一个名字（字符串）以及四个表示方向的变量。我将用数字对房间进行索引，因此将使用整数来定义出口。如果一个房间的北有一个通往另一个房间的出口，那么该方向的房间编号即为\
    \ 1。目前，不要担心这些索引数字的含义。当我们在下一章创建一个索引化的房间集合（即地图）时，这一切将开始变得意义。我将添加一个额外的字段，另一个名为 `description`\
    \ 的字符串，它将包含房间的描述。这是该类的最简单版本——我将其命名为 `SimpleRoom`：\n\n```java\npublic class SimpleRoom\
    \ {\n    public String name;\n    public String description;\n    public int n;\n\
    \    public int s;\n    public int w;\n    public int e;\n}\n```\n\n这些变量都是公共的（public），这意味着当我创建一个房间对象时，我可以像这样给变量赋值：\n\
    \n```java\nsr = new SimpleRoom();\nsr.name = \"Troll Room\";\nsr.description =\
    \ \"a dank room that smells of troll\";\nsr.n = -1;\nsr.s = 2;\nsr.w = -1;\nsr.e\
    \ = 1;\n```\n\n虽然在类中使用公共变量看起来是个好主意，因为它们简短且易于使用，但它们有严重的缺点。“探入”对象内部并为变量分配新值的能力意味着我的代码可以自由在任何时候更改对象的任何变量：\n\
    \n```java\nsr.name = \"New name\";\nsr.s = 0;\n```\n\n这是一个坏主意。首先，这意味着我（或者，如果我是编程团队的一员，那么一个比我更不可信的人！）可以改变那些从未打算被更改的值。在这里，例如，我不希望房间的名字被更改。声明为公共的变量也可以被赋予错误的值。假设我的游戏有从\
    \ 0 到 99 的房间。给诸如 `s` 的出口赋值 100 永远是不可能的。如果 `s` 是公共的，我无法阻止。如果我将变量设为私有（private）并编写访问器方法来获取和设置它们的值，会更好。在\
    \ `Room` 类中，我使用了一种简写语法，相同类型的变量用逗号隔开：\n\n| RoomTest (Room.java) |\n| :--- |\n|\
    \ private String name, description; |\n| private int n, s, w, e; |\n\n对于我赋予完全访问权限的变量，我像这样提供一组获取和设置方法（注：此处原文逻辑有误，此处对应翻译）：\n\
    \n```java\npublic int getN() {\n  return n;\n}\npublic void setN(int n) {\n  n\
    \ = n;\n}\n```\n\n由于对私有变量的访问现在必须通过方法执行，我在返回它们之前会“处理”它们。例如，`getDescription()` 方法返回字符串“This\
    \ is ”：\n\n```java\npublic String getDescription() {\n  return \"This is \";\n\
    }\n```\n\n`setS()` 方法提供了如何防止不当值赋值给变量：\n\n```java\npublic void setS(int aS) {\n\
    \  if (aS < 100) {\n    s = aS;\n  } else {\n    System.out.println(\"Error: index\
    \ must be less than 100\");\n  }\n}\n```\n\n同时，`name` 变量通过 `getName()` 方法返回其值，这意味着它现在是只读的（read-only）：\n\
    \n```java\npublic String getName() {\n  return name;\n}\n```\n\n我为构造函数添加了额外的参数，以便在构造对象时赋值：\n\
    \n```java\nRoom(String aName, String aDescription, int aN, int aS, int aW, int\
    \ aE) {\n  name = aName;\n  description = aDescription;\n  n = aN;\n  s = aS;\n\
    \  w = aW;\n  e = aE;\n}\n```\n\n防止访问变量被称为“数据隐藏”（data hiding）。将数据（内部字段和变量）与作用于数据的函数或方法包装在一起通常被称为“封装”（encapsulation）。当你将数据设为私有时，这就是数据隐藏。\n\
    \n![](img/f210b6659f24a42b28725bec993abfc1_35_0.png)\n\n## 数据隐藏\n\n在我看来，数据隐藏是真正封装的必要特征。除非数据对其他代码隐藏，否则对象没有被真正封装。获取封装内部数据的唯一方式应该是通过方法。\n\
    \n然而，许多程序员使用“封装”一词仅仅是指在对象内部包含数据（变量）和方法（函数），即使数据是公共的。某些面向对象的程序员倾向于使用“黑盒封装”来强调他们的对象是严格封装的，并且具有私有数据。\n\
    \n严格封装的对象是一个密封的盒子。从外面你看不到它内部有什么。你只知道它的行为。它发送消息。就像老式计算机输入孔卡片（消息）并产生打印输出（回复）。\n\n\
    黑盒封装的好处是方法代码隐藏在外部。创建严格封装类的程序员可以自由重写它，而不必担心由于其他代码依赖这些方法的实现细节而导致意外副作用。只有可以发送的消息（由方法名和参数定义）以及返回的数据对对象之外的代码是可见的。方法的实现如下：\n\
    \n现在我可以创建一些房间\n\n| Room Test (RoomTest.java) |\n| :--- |\n| Room0;\nRoom1;\nRoom2;\n\
    Room3; |\n| room0 = new Room(\"Troll Room\", \"a dank room that smells of troll\"\
    , -1, 2, -1, 1);\\nroom1 = new Room(\"Forest\", \"a leafy woodland\", -1, -1,\
    \ 0, -1);\\nroom2 = new Room(\"Cave\", \"a dark cave\", 0, -1, -1, 3);\\nroom3\
    \ = new Room(\"Dungeon\", \"a nasty basement in the castle\", -1, -1, 2, -1);\
    \ |\n\n"
