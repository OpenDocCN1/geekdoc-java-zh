    \ `Thing` 对象的名称（以及已定义的形容词）进行匹配。`Thing` 的以下两种方法处理了这一点：\n\n```\nStarcrash (Thing.java)\n\
    private boolean adjectivesMatch(Array<String> someAdjectives) {\n    boolean ok\
    \ = true;\n\n    for (String a :someAdjectives) {\n        if (adjectives.contains(a))\
    \ {\n            ok = false;\n        }\n    }\n    return ok;\n}\n\npublic boolean\
    \ matchThing(NounPhrase np) {\n    boolean match = false;\n\n    if (np.getName().equals(np.getWord())\
    \ && adjectivesMatch(np.getAdjectives())) {\n        match = true;\n    }\n  \
    \  return match;\n}\n```\n\n`matchThing()` 方法是从 `ThingHolder` 类的 `findThingInAnyList()`\
    \ 方法调用的，该方法递归地在列表中搜索对象。例如，如果某个对象位于一个打开的容器内，它将尝试在玩家的背包中找到它（例如，盒子里的一个戒指）：\n\n```\n\
    Starcrash (ThingHolder) – findThingInAnyList()\nif ((container != null) && (container.isOpen()))\
    \ {\n    findThingInAnyList(container, np);\n}\n```\n\n所有编码的最终结果是，玩家现在可以输入如下命令：\n\
    \n- take the gold ring (拿起金戒指)\n- look at the silver elvish sword (查看银色的精灵剑)\n\
    - put the small gold ring into the big red wooden box (把小金戒指放入大红木箱中)\n\n此外，如果存在任何歧义（因为多个对象符合玩家的描述），游戏将做出相应的响应。玩家可能会输入：\n\
    \ntake the box (拿那个盒子)\n\n然后游戏会回复：\n\n| 你想拿哪一个？ |\n| :--- |\n| small cardboard\
    \ box (小纸箱) |\n| big wooden box (大木箱) |\n| tiny onyx box (微型黑玛石盒) |\n\n## 第 12\
    \ 章 — 创建游戏！\n\n为了将一个“开发”阶段的代码库（在测试阶段创建）准备好进行部署（即创建一个真正的游戏），我们进行了大量的更改……\n\n![](img/f210b6659f24a42b28725bec993abfc1_152_0.png)\n\
    \n如果你在学习上一章概述的主要更改时查看 `Starcrash` 的源代码，你一定已经注意到整个项目的结构与之前的版本（Starcrash-beta）相比发生了很大变化。现在让我带你快速浏览一下最重要的更改。\n\
    \n许多更改旨在使代码更加整洁和模块化。如果你在 NetBeans IDE 中打开所有项目节点，你会看到有很多新类，这些类被组织在若干个包（packages）中，以便将相关的类放在逻辑组中。这些更改中的大多数很容易理解——它们不涉及任何复杂的编码——因此我将重点介绍最重要的区别。\n\
    \n## 游戏类\n\n游戏类基本上分为三组。第一组组织在 `game` 包中。这包括 `game.data` 中的数据初始化类、`game.grammar`\
    \ 中的语法类以及“顶层”游戏类：`Game`、`Parser` 和 `Starcrash`。`gameobjects` 包包含了核心游戏 `Thing`\
    \ 以及 `gameobjects.lists` 中的一些特殊列表类型、`gameobjects.lists` 中的 `ListTool` 类以及 `gameobjects.lists`\
    \ 中的 `Actions`。`globals` 包包含了工具类和枚举：\n\n![](img/f210b6659f24a42b28725bec993abfc1_153_0.png)\n\
    \n## 游戏对象\n\n“游戏对象”类都放在 `gameobjects` 包中。最终基类是 `BaseThing`，它包含一个 `name` 和一个 `description`。`Thing`\
    \ 类实现了所有游戏对象的通用行为，如 `movable`。它还通过 `show()` 方法的布尔值来决定是否应该显示在列表中（例如，在描述房间时显示一个对象）。\n\
    \n## 游戏对象\n\n代码被组织组织命名包中。添加了多个新包，如 `game.data`、`game.grammar`、`gameobjects.lists`\
    \ 和 `gameobjects.lists.tools`，实现这一点这一点。\n\n现在有两个公共方法，可以它们它们来只显示顶层对象或所有对象：\n\n\
    在玩家进入房间时，只显示顶层对象。我们通过测试由 `show()` 方法返回的布尔值来实现此点的：\n\n```\nStarcrash (ThingHolder.java)\
    \ - doDescribeThings()\nif (t.show())\n```\n\n## 隐藏容器的内容\n\n我对 `doDescribeThings()`\
    \ 方法做了另一处修改。之前它会描述容器的内容。但有时这会破坏谜题。例如在我的游戏中，钥匙被隐藏在花盆里。我不希望玩家在进入房间时看到这个描述：\n\n```\n\
    Hydroponics: This is steamy hydroponics area with plants everywhere.\nThings here:\n\
    pitcher plant\n```\n\n我为 `doDescribeThings()` 添加了一个布尔参数 `describeAll`。当 `describeAll`\
    \ 为 `true` 时，该方法才会递归（显示容器的内容）。否则，它只描述顶层对象列表——不是位于其他对象内部的对象：\n\nStarcrash (ThingHolder)\n\
    \n```\nvoid doDescribeThings(Thing th, boolean describeAll) {\n  ThingList tlist\
    \ = th.getThings();\n  Container container;\n\n  for (Thing t : tlist) {\n   \
    \ String inContainer = \"\";\n    if (t.getContainer() instanceof Container) {\n\
    \      inContainer = \" (in \" + t.getContainer().getDescription()) + \")\";\n\
    ```\n\n"
