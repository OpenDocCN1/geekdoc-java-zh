    \ (ThingHolder.java)\n\n```\npublic String describeThings() {\n    thingStr =\
    \ \"\";\n    describeThings(this);\n    return thingStr;\n}\n```\n\nThis method\
    \ assigns an empty string to thingStr which is a field of the ThingHolder class.\
    \ It calls describeThings() which is a private method (private because I don't\
    \ want any code outside of this class to be able to use it) to create a new string\
    \ which is assigned to thingStr and this string is then returned.\n\nThe describeThings()\
    \ method gets a ThingList containing a list of Thing objects from the ThingHolder\
    \ th (initially this the 'top-level' ThingHolder – that's the player) and iterates\
    \ over the elements in a for loop.\n\nIt gets the name of each Thing t and appends\
    \ it to thing. Then it does test if I explained in an earlier example to check\
