    # The AdventureGame3 Class Hierarchy


    First, let me go over the game as it stands at present (the AdventureGame3 project).
    I''ve created these classes:


    +   - Thing: has a name and a description.

    - Room: descends from Thing. It adds four integer variables for the room exits.

    - Actor: descends from Thing. It adds a Room variable location.

    - Treasure: descends from Thing. It adds an integer variable value.

    - ThingHolder: descends from Thing and adds a ThingList variable.

    - ThingList: descends from ArrayList and is typed to hold Thing objects.

    - Game: includes the map (an ArrayList of Room objects) and the player (an Actor
    object).


    Since the map and the player encapsulate all other objects, the Game class can
    be thought of containing everything in a game.

    AdventureGame: This defines the entry point for the program. It creates the game
    object from the Game class. It runs a loop that takes input from the user until
    the program exits. It saves and restores the game state using serialization.

    Direction: an enum which contains the constants: NORTH, SOUTH, EAST, WEST, NOEXIT.


    # Object Oriented Design


    Most modern programming languages such as Java, C#, C++ and Object Pascal are,
    to some degree, ''hybrid'' Object Oriented languages. Their syntax is derived
    from procedural languages such as C and Pascal. Many programmers write code in
    a procedural style. By that, I mean, in non-oriented languages such as C or Pascal
    it is common to write long code files containing a broad range of densely-coded
    functions. Some programmers use a huge number of methods in a single Java class.
    In a ''pure'' Object Oriented language as Smalltalk, it is more normal to create
    relatively small classes containing short methods. Rather than continually extending
    a class by adding new methods, when new behaviour is needed, a new, specialised
    class is created. This leads to a fairly dense class hierarchy. As I revise my
    code, I will try to follow the Smalltalk idea of creating many small specialist
    classes rather than few large general-purpose ones.


