    # Introduction


    # What is an Adventure Game?


    ![](img/f210b6659f24a42b28725bec993abfc1_9_0.png)


    Here you see just a small selection of the author''s personal collection of classic
    retro adventure games.


    An adventure game – specifically a *text* adventure game – is like a story that
    takes place in a world of connected locations. Often the player may need to explore
    a vast landscape in order to locate certain treasures and use them in order to
    solve puzzles. You interact with the game by entering words rather than by clicking
    menus or buttons. In this book I''ll develop a game that will be able to make
    sense of short English-language commands such as:


    +   take the sword

    drop the ring

    look into the big smelly sack

    open the jewel box

    close the pirate treasure chest

    put the magic gold ring into the small silk reticule


    ...and so on.


    # Interactive Fiction


    Text adventures are sometimes called ''interactive fiction'' or ''IF'' for short.
    This emphasises the story-telling aspect of this type of game. Some adventure
    games provide long descriptive passages and the player can then enter text to
    ask for more information, look at objects and interact with the game in other
    ways.'
  - '[PAGE 10]


    # Where Can You Play Text Adventures?


    Naturally, before you write your own adventure game, it would be useful if you
    played some existing games. I''d recommend that you begin with some of the ''classics''
    that were developed in the 1970s and 1980s by Infocom. These include the Zork
    trilogy (a game of magic and exploration in an underground empire), Trinity (Alice
    in Wonderland meets the atomic bomb!); The Hitchhiker''s Guide To The Galaxy (Infocom''s
    version of the Douglas Adams radio shows and novels). The Appendix provides links
    to sites where some of those games can be found.


    ![](img/f210b6659f24a42b28725bec993abfc1_10_0.png)


    # A Brief History of Adventure Games


    While it''s impossible to know who wrote the first text adventure game, the first
    to generate any interest among computer users was almost Certainly Crowther''s
    Colossal Cave which is sometimes called the ''Original Adventure''. In addition
    to programming, Crowther was also enthusiast who explains why his adventure game
    took place in a massive cave system. Colossal Cave was developed between 1975
    and 1977 and with the assistance of another programmer, Don Woods. Their game
    was written in FORTRAN and ran on a PDP-10 mainframe computer.


    The next step in the evolution of adventure games came with the release of Zork.
    This game owed a huge debt to Colossal, including the underground cave network
    that formed a large part of the Zork world. Developed by a team of programmers
    at MIT, led by Dave Lebling.


    Zork was originally written in the MDL programming language, once again on a PDP-10.
    MDL was a language based on the LISP list processing language. Later the game
    was rewritten several times and the most famous was written in ZIL (Zork Implementation
    Language), another LISP-like language developed specifically for writing games.
    Zork was eventually released in a version that could run on personal computers
    when the Infocom games company was founded in 1979.'
  - '[PAGE 11]


    # Introduction


    Infocom soon dominated the field of adventure games with titles such as Starcross,
    The Leather Goddesses Of Phobos and Enchanter. One of the improvements Infocom
    made to the earlier Colossal Cave was a better ‘parser’ to interpret simple human
    language commands. Colossal Cave was limited to two word commands as “take sword”.
    Infocom games allowed longer commands as “put the elvish sword into the sack”.


    ![](img/f210b6659f24a42b28725bec993abfc1_11_0.png)


    # Who Should Read this Book?


    This book is suitable for anyone interested in how to write text adventure games
    in the tradition of the classic games such as Enchanter and Colossal Cave. It
    also provides a tutorial to developing complex programming projects in Java. It
    is suitable for novice Java programmers (who may be studying Java using a more
    conventional tutorial) and for more experienced programmers who are looking for
    a fun, challenging to develop their programming skills.


    # The Best Way to Follow the Book


    It''s up to you how you use this book and the code that comes with it. If you
    are already an experienced Java programmer you may want to skip parts of the first
    couple of chapters which explain elements of the language. If you want to follow
    every step of the way, on the other hand, load up the sample projects so you can
    see the entire source code as you read through the explanations given in this
    book.


    This book explains the actual development process which I went through in the
    code libraries for creating a fully-functional adventure game. Nothing is hidden.
    I explain techniques that I tried and later rejected in favour of different techniques.
    I explain how I debugged my code to find and fix problems and how I restructured
    my code to make it clearer and more maintainable. If you aren''t familiar with
    programming large, complex projects containing numerous interoperating code files,
    you may find it useful to follow the precise development process that I go through.'
