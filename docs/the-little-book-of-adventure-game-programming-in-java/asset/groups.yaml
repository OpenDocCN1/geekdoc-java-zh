    \ 中添加了一个字段。这是一个整数，可以粗略地反映每个 `Thing` 的大小和重量。它将在以后被用于确保玩家收集物品的数量有一个限制。\n\n## 计算对象的“质量”\n\
    \n为了简单起见，我决定 `Thing` 的质量通常应该从由常量定义的有限整数值集中赋值。我在这里稍微耍了小聪明，创建了一个不包含枚举值而只包含数值常量的枚举（enum）。为了让编译器对此保持沉默，我必须在常量上方添加一个分号。分号通常放置在枚举标识符之后，但在这里它只是一段无意义（但必须的）语法。值\
    \ `UNKNOWN` 用于用于质量无关的 `Thing` 对象（例如 `Room` 和 `Actor` 对象）：\n\n```java\npublic enum\
    \ Mass {\n    public static final int UNKNOWN = 0;\n    public static final int\
    \ TINY = 1;\n    public static final int SMALL = 5;\n    public static final int\
    \ MEDIUM = 25;\n    public static final int BIG = 50;\n    public static final\
