    Room1;

    Room2;

    Room3; |

    | room0 = new Room("Troll Room", "a dank room that smells of troll", -1, 2, -1,
    1);\nroom1 = new Room("Forest", "a leafy woodland", -1, -1, 0, -1);\nroom2 = new
    Room("Cave", "a dark cave". 0, -1, -1, 3);\nroom3 = new Room("Dungeon", "a nasty
    basement in the castle", -1, -1, 2, -1); |


    This is all well and if I want the player to stay in one room throughout the game.
    But if I want to let the player move from one room to another, I need to connect
    the room ‘exits’ so that each exit leads into another room. And to do that, I
    need a map.


