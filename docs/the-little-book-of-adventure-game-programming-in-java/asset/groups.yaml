    Introduction


    # Run and Debug The Code!


    Throughout this book I assume that you will read and run the code supplied in
    the archive. I also recommend that you use your IDE''s debugger to step through
    the code and examine the values of variables – especially in the more complex
    projects that include many different classes and recursive functions. If you do
    not know how to use your IDE''s debugger, take some time to read its documentation
    or find some tutorials.


    # How is this Different from My C# Adventure Game Book?


    ![](img/f210b6659f24a42b28725bec993abfc1_12_0.png)


    This book on Java game programming explores more advanced programming techniques
    than are used in my other book, The Little Book Of Adventure Game Programming
    in C#. In this book I explain how to use recursive functions to locate treasures
    in complex data-structures – lists lists when, for example, a treasure might be
    inside a sack which is in a cupboard and so on. The parser and hierarchy are more
    complex than in the C# book. There are more commands available and I also explain
    how to calculate the ‘mass’ (the relative size and weight of objects) to ensure
    that things can be put into small containers and that the player can only carry
    a total ‘mass’ of treasures.


    I explain how to assign ‘attributes’ to treasures so that they can be described
    by one or more adjectives. This means that the player can enter a command such
    as "take the elvish sword" and, if there happen to be two Elvish swords in the
    current location, the game will ask whether you want to take the "small silver
    elvish sword" or the "big brown elvish sword". If you have read my C# adventure
    game programming book, you should be able to learn numerous more advanced techniques
    from this book. If you need help translating the Java code to C#, refer to the
    Appendix.


