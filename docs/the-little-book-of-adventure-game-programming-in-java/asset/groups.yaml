    Mass.SMALL, boxList, readyRoom); |


    # Mass Exceptions


    Since the mass field of Thing is an integer, it would be possible for me to pass
    any integer value instead of using a Mass constant. I want to make sure that I
    don''t accidentally initialize a thing with some silly value — say if I accidentally
    entered 1000 when I meant to enter 100. For that reason, I''ve written this test
    method which I call in the constructor:


    | Starcrash-beta (Thing.java)

    | private void testMass(){

    if ((mass < Mass.UNKNOWN) || (mass > Mass.HUGE)){

    throw new IncorrectMassException("Mass value " + mass + " is invalid!");

    }}\ |


    I''ve defined this Exception (error object) class:


    | Starcrash-beta (Thing.java)

    | class IncorrectMassException

    extends RuntimeException {

    public IncorrectMassException(String errorMessage) {

    super(errorMessage);

    }}\ |


    Now, let''s assume that I accidentally passed the invalid number, 1000:


    | ContainerThing box = new ContainerThing("box", "a small cardboard box", 1000,

    boxList, readyRoom); |


    When I run the program, Java shows me this error:


    | Exception in thread "main" gameobjects.IncorrectMassException: Mass value 1000
    is

    invalid! |


