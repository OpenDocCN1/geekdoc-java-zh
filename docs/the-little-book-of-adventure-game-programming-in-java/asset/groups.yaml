  mdcn: "\n\n# 什么，没有用户界面？\n\n在我本关于使用 C# 编写冒险游戏的书中，我开始设计一个带有按钮的 Windows 用户界面，通过点击按钮来向游戏发送命令。这是因为\
    \ C# 开发是在 Visual Studio 中进行的，它有一个集成的可视化设计器。书中的最终项目解释了如何从命令提示符创建一个游戏，就像传统的文本冒险一样。虽然你可以在\
    \ Java 中创建类似的界面（例如使用 JavaBeans），但在本书中，我决定从一开始就创建一个命令行游戏。我们将开发的游戏将完全从提示符运行，就像经典游戏一样。\n\
    \n传统的文本冒险游戏没有带有菜单和按钮的用户界面。它们只有像这样的命令提示符：\n\n```\n>\n```\n\n要与游戏交互，用户在命令提示符旁边输入指令。常用指令包括：\n\
    \n- n, s, w 和 e 让游戏向北、南、西、东移动玩家\n- look 让游戏描述当前位置\n- i 或 inventory 显示玩家物品列表\n\
    - take 或 drop 后面跟对象的名称。\n\n输入命令后，游戏会给出回复。以下是一个典型的文本冒险游戏的简短摘：\n\n```\n> n\nYou\
    \ have moved into the Troll Room.\n> look\nIt is a dank room in a dungeon. There\
    \ is a sword lying on the floor.\n> take sword\nsword taken.\nYou have a lantern\
    \ ( (providing light), a magic ring and a sword.\n> drop ring\nYou drop the ring.\
    \ A bearded dwarf appears. The dwarf picks up the ring, puts it on his finger\
    \ and runs away to the north. The dwarf has dropped an emerald.\n> take emerald\n\
    emerald taken.\n```\n\n## 第一章 与游戏通信\n\n## 加载并运行源代码\n\n一旦下载了源代码压缩包，请解压代码。你可以使用\
    \ NetBeans 浏览到包含你想编辑或运行的项目目录。\n\n### 在 NetBeans 中加载项目\n\n选择文件（File），打开项目（Open\
    \ Project）。然后浏览到包含示例项目的目录。\n\n按 CTRL+CLICK 更多项目名称以从对话框中选择它们。\n\n点击打开项目（Open Project）。\n\
    \n## 运行项目\n\n在项目（Projects）窗口中选择一个节点。\n\n点击工具栏上的绿色箭头按钮，或从运行（Run）菜单中选择运行项目（Run project）。\n\
    \n![](img/f210b6659f24a42b28725bec993abfc1_20_0.png)\n\n## 第一章 与游戏通信\n\n## 如何创建项目\n\
    \n如果你是从从零开始创建一个游戏项目，首先需要做的是创建一个包含程序启动时运行代码的 Java 文件。该代码文件必须有一个 main 函数，该函数将包含某些在循环中持续执行的代码。这些代码将接收玩家的命令并将其发送去处理和执行，直到程序结束（当玩家退出时）。\n\
    \n首先你需要创建一个新的 Java 应用程序。如果你使用 NetBeans，请按照下面的步骤操作。如果你使用其他编辑器或 IDE 并且已经知道如何创建 Java\
    \ 应用程序，可以通过创建一个名为 MainLoop.java 的代码创建 Java 应用程序。或者从本书的源代码存档中加载 main_loop 项目的代码。\n\
    \n## 如何在 NetBeans 中创建新项目\n\n1. 选择文件（File），新建项目（New Project）\n2. 根据 NetBeans 的版本选择\
    \ Java 或 Java With Ant\n3. 在右侧面板中，选择 Java Application。点击下一步（Next）。\n4. 在下一个对话框中为项目输入名称（例如\
    \ HelloWorld）\n5. 可选选择项目位置\n6. 点击完成（Finish）\n\n## 使用 Maven 的 Java 还是使用 Ant 的 Java？\n\
    \n某些版本的 NetBeans 建议新用户创建 Java With Maven 应用程序。Maven 和 Ant 是“构建工具”，在书中我们不关心它们的细节。对于我们的目的来说，选择\
    \ Java With Maven 还是 Java With Ant 并不重要。Java With Ant 的优点是项目会自动为你创建一个主文件。如果你选择\
    \ Java With Maven，你将需要自己创建主文件。所以，如果你的项目命名为 HelloWorld，你应该创建一个名为 HelloWorld.java\
    \ 的代码文件。要执行此操作，点击项目窗口中的源包（Source Packages）节点，并右键点击下方的包名。包名将类似于 com.mycompany.helloworld。从弹出的菜单中，选择新建（New），Java\
    \ 类（Java Class）。输入类名（例如 HelloWorld）。这将创建一个代码文件 HelloWorld.java。通过添加如下所示的 main()\
    \ 函数来编辑该类。\n\n![](img/f210b6659f24a42b28725bec993abfc1_21_0.png)\n\n## 第一章 与游戏通信\n\
    \n你的应用程序需要一个 main() 函数。这是在应用程序启动时运行的函数。确保类和 main() 函数包含下面的代码：\n\n```\npublic class\
    \ HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    hello world\");\n    }\n}\n```\n\n通过运行程序来测试它（点击 NetBeans 工具栏上的绿色箭头）。此时你可能会被提示选择主类（main\
    \ class）。自然地，选择 HelloWorld 类（这是这个简单项目中唯一的类）。你的代码将会被编译并运行。最终它应该会在控制台中显示字符串 \"hello\
    \ world\"。\n\n## main() 函数\n\n我的游戏的 main() 函数需要读取字符串（用户输入的命令），并且在系统提示符处写入字符串（描述和回复）。因此，我的主循环需要不断读取和写入字符串，直到玩家决定退出游戏。我在\
    \ MainLoop 中写了这样一个简单的函数：\n\n让我逐行向你解释一下它是如何运行的：\n\n```\npublic static void main(String[]\
    \ args) throws Exception {\n```\n\n## 第一章 与游戏通信\n\nmain() 函数是静态的（static），这意味着它“属于”（作用域在）一个类。这与\
    \ C 等非面向对象语言的“悬浮型”函数形成对比。在书中，“函数”（function）和“方法”（method）这两个词是通用的。从现在起，我将通常使用“方法”一词。\n\
    \n## 缓冲读取\n\n缓冲区（buffer）是内存中的临时存储区域。这可以加快字符的处理，而不是从磁盘一个一个地读取它们。\n\n接下来是这个声明：\n\
    \n```\nBufferedReader in;\nString input;\n```\n\nString 变量 input 将被玩家输入的字符串（行）：\n\
    \n```\nin = new BufferedReader(new InputStreamReader(System.in));\n```\n\n对此简单的解释是，InputStreamReader\
    \ 读取字节并将其传递给 BufferedReader，以便数据可以被缓冲。后面是更详细的解释……\n\n## 函数还是方法？\n\n“方法”（Method）是面向对象领域的术语，指“属于”（作用域在）类或对象的函数。这与\
    \ C 等非面向对象语言的“悬浮型”函数形成对比。\n\nInputStreamReader 是一个 Java 类，它从流中读取字节并将字节解码为字符。“流”（stream）是从一个地方到另一个地方的字节流。System.in\
    \ 是一个对应键盘输入数据的流。因此，上面的代码行将用户输入的文本作为参数传递给 InputStreamReader 对象的构造方法（创建并初始化新对象的方法）。这会将字节解码为字符流，并传递给\
    \ BufferedReader。BufferedReader 从字符输入流读取，缓冲字符以提高效率。然后 BufferedReader 对象赋值给变量 in。\n\
    \n![](img/f210b6659f24a42b28725bec993abfc1_24_0.png)\n\n现在有一个循环：\n\n```\ndo {\n\
    } while(\"q\".equals(input));\n```\n\n这是一个 do..while 循环。它执行大括号之间的所有代码，直到满足结束条件（位于\
