    \ C# 中，比较的是字符串的内容，因此 \"q\" 会认为与另一个包含 \"q\" 的字符串相等，而在 Java 中则不会。这是在 Java 中比较两个字符串的正确方法：\n\
    \n```\ndo {\n  // 执行的代码\n} while(\"q\".equals(input));\n```\n\n# 字符串分割\n\nC# 和\
