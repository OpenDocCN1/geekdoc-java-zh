    counterpart in the real world. Magical or ''special power'' objects aren''t confined
    to fantasy games. However in a science-fiction game, you might include a transportation
    device which ''beams'' the player from one location to another. This too, is essentially
    a magical object though it isn''t described as such. In a pirate game, you might
    find a ruby that hypnotizes the pirate captain, leaving you free to go and steal
    him. This too is a magical object. A ''special power'' over the pirate captain.
    In the example I gave earlier, even the ham sandwich is a sort of magical object.
    It''s the only thing in the game that lets you past the troll. It might just as
    well have been a magical spell. I happened to decide to make a ham sandwich but
    its power over the troll is the same as a spell would have been. Magical or ''special
    power'' objects such as this can be very useful in a game but don''t overwhelm
    them. In essence, all of these types of object are illogical. There is no reason
    why a spell should have any real power and the troll could just as well have decided
    not to eat the ham sandwich. So don''t overwhelm them!


    # Special Locations


    Sometimes the map itself can help to solve a puzzle. Maybe there be a courtyard
    that you can''t exit because it is guarded by a monster. You find some poison
    that, when thrown at the monster, kills it. Unfortunately, as you are in the same
    location as the time, it kills you. Then, on, you find a room in a tower and there
    is an open window in the room. The window is too high for you to look through.
    However, if you''ve mapped the game, you will see that the tower overlooks the
    courtyard. You can now throw the poison through the window. It will fall into
    the courtyard and kill the monster without killing you (since you are now at a
    safe distance). This was, in fact one of the puzzles in the first adventure game
    I wrote, *The Golden Wombat Of Destiny.*


    Another map-based puzzle might be a completely locked room. There is no way in
    and no way out. A magical object (a spell or a transporter) might be the solution
    — allowing the player to ''beam into'' the locked room (and with luck!) beam out
    again.


