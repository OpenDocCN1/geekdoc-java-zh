    # A Room with a View


    One final – and dramatic change that I''ve made has to the Room class. Previously,
    the exits from the Room – the n, s, w, e, up and down fields – were integers.
    Those represented indexes into the list of rooms stored in the map. This is a
    common way of representing a map in a game. It has the advantage that a linear
