    }\n\npublic void wagTail() {\n    System.out.println(\"Wag, wag, wag\");\n}\n\
    ```\n\nMy `main()` loop creates a Cow and a Dog object and each calls their methods:\n\
    \n```java\npublic static void main(String[] args) {\n    Cow aCow = new Cow();\n\
    \    aCow.talk();\n    aCow.move();\n\n    Dog rover = new Dog(\"Rover\");\n \
    \   System.out.println(rover.getName());\n    rover.talk();\n    rover.move();\n\
    \    rover.wagTail();\n}\n```\n\nThis is the output:\n\nMooo\nPlod, plod, plod...\n\
    Rover!\nWoof!\nLeap, walk, sniff, leap, walk...\nWag, wag, wag\n\nWhile you may\
    \ not need to create your own interfaces in this way, you do need to understand\
    \ how to implement the interfaces defined by standard Java classes. In my games,\
    \ for example, to be able to save and reload the game objects, each class has\
    \ to implement java.io.Serializable. It turns out that java.io.Serializable does\
    \ not declare methods so we don't have to implement any specific methods in our\
    \ code. You can think of java.io.Serializable as a 'marker interface' – one that\
    \ instructs Java to treat a class in a specific way. Java won't serialize any\
    \ objects unless they implement the java.io.Serializable interface.\n\n## Modifying\
    \ the Game Data\n\nUsing the game framework developed in this book, you can create\
    \ your own games by modifying just two classes.\n\nAs mentioned in Chapter 12,\
    \ the easiest way to get started on a game of your own would be by using the code\
    \ from my *Starrush* project and modifying the two files (*GameData.java* and\
    \ *VocabularyData.java*) in the `game.data` package and the one file (*Actions.java*)\
    \ in the `game.objects.special` package. Here'll give you a short guide on how\
    \ to modify these three files.\n\nIn the *VocabularyData* class, add any words\
    \ that you want to be understood by your game. These must be added as paired elements\
    \ where the first item of each element is the word itself (a string) and the second\
    \ item is a word type defined in the `WT` enum. Each word is added to the vocal\
    \ `HashMap` using the put() method:\n\n| VocabularyData.java |\n| :--- |\n| vocab.put(\"\
    box\", WT.NOUN); |\n\n![](img/f210b6659f24a42b28725bec993abfc1_185_0.png)\n\n\
    ## Sample Data Files\n\nTo get started, I've included sample *GameData.java* and\
    \ *VocabularyData.java* files which are in the *EmptyDataFiles* folder of the\
    \ source archive. You can modify these files to your own requirement and replace\
    \ the files in the `game` folder with your modified files.\n\nIn the *GameData*\
    \ class, you need to create initialize objects in a specific order. That's because\
    \ some objects refer to other objects. For example, a *Room* object has references\
    \ to other *Room* objects (its exits) so all *Room* objects must be created before\
    \ the objects are initialized. Similarly, you can't put an object into a container\
    \ before the object is created. These are the steps I recommend that you follow\
    \ when modifying the *GameData* class (I show brief code examples for each step):\n\
    \n## Step I – Create Rooms\n\n| GameData.java |\n| :--- |\n| Room exampleRoom1\
    \ = new Room(\"exampleRoom1\"); |\n\n## Step 2 – Create Containers\n\n```java\n\
    ContainerThing exampleContainer = new ContainerThing(\"exampleContainer\",\n\"\
    example container\", Mass.SMALL);\n// optionally sets its attributes\nexampleContainer.setOpenable(true)\n\
    exampleContainer.setOpen(false)\nexampleContainer.addAdjectives(new String[]{\"\
    small\", \"example\"});\n```\n\n```java\n// Lockable objects are also containers\n\
    LockableThing cupboard = new LockableThing(\"cupboard\"\n\"cupboard on the wall\"\
    , Mass.MEDIUM, false, false, true, false, true, false);\ncupboard.setShow(false);\n\
    ```\n\n## Step 3 – Generate Game Things (Treasures) and Generic Things (Scenery)\n\
    \n```java\nGameThing exampleGameThing = new GameThing(\"exampleGameThing\", \"\
    lovely thing\",\nMass.BIG, false, false);\n// optionally sets its attributes\n\
    exampleGameThing.addAdjectives(new String[]{\"lovely\", \"big\", \"shiny\"});\n\
    ```\n\n```java\nGenericThing lights = new GenericThing(\"lights\",\n\"flashing\
    \ lights set into the walls\", true);\n```\n\n## Step 4 – Add Things to Containers\n\
    \n```java\nexampleContainer.add(exampleGameThing);\n```\n\n## Step 5 – Add Objects\
    \ to Rooms\n\n```java\nexampleRoom1.addThing(exampleContainer);\n```\n\n## Step\
    \ 6 – Set Special Attributes (which may require other game objects)\n\n```java\n\
    cupboard.canBeUnlockedWith(exampleGameThing);\n```\n\n## Step 7 – Add Game Objects\
    \ to things HashMap (Optional but Recommended)\n\n```java\nthings = new HashMap<>();\n\
    things.put(\"exampleGameThing\", exampleGameThing);\nthings.put(\"exampleContainer\"\
    , exampleContainer);\n```\n\n## Step 8 – Initialize Rooms\n\n```java\nmap = new\
    \ HashMap<>();\nmap.put(\"exampleRoom1\", exampleRoom1);\n```\n\n## Step 9 – Add\
    \ Rooms to map\n\n```java\nmap.put(\"exampleRoom2\", exampleRoom2);\n```\n\n##\
    \ Step 10 – Create Player and Set Location\n\n```java\nplayer = new Actor(\"player\"\
    , \"loveable game\");\n```\n\n## Step 11 – Display Introductory Text when Game\
    \ Starts\n\n```java\npublic static void initGame() {\n    // Here are Steps 1\
    \ to 10 followed by this method\n    defineIntroText();\n}\n\n// Here assign to\
    \ intro any text to be shown\nprivate static void defineIntroText() {\n  introtext\
    \ = \"You are in a room that smells of jasmine\"\n  + \"What do you want to do?\\\
    n\"\n  + \"(Enter q to quit)\";\n}\n```\n\n## Bitwise Books and Courses\n\nFor\
    \ all the latest news on Bitwise Books and Courses, be sure to bookmark these\
    \ sites:\n\nFor our full range of paperback books and eBooks plus free downloads,\
    \ be sure to visit the Bitwise Books site: http://www.bitwisebooks.com\n\nFor\
    \ video-based programming tutorials, go to Bitwise Courses site: http://www.bitwisourses.com\n\
    \nVisit the Facebook page of Bitwise Books & Courses: https://www.facebook.com/BitwiseCourses\n\
    \nSubscribe to our Twitter feed: https://twitter.com/bitwisourses\n\nSubscribe\
    \ to our YouTube Channel: https://www.youtube.com/BitwiseCourses?sub_confirmation=1\n\
    \n## Appendix\n\n## BIFF – The Bitwise Interactive Framework\n\nThe Bitwise Interactive\
    \ Framework (‘BIFF’) is work in progress. Be sure to keep up to date with developments.\n\
    \nSince the code defining my specific game, Starrash, largely depends on just\
    \ two files – GameData.java and VocabularyData.java, in the game.data package\
    \ – the rest of the code may be easily used to implement totally different games.\n\
    \nIn other words, the code provides a ‘framework’ for adventure game development.\
    \ I’ve called the framework BIFF, The Bitwise Interactive Framework. I’m making\
    \ this code available to other programmers. You are free to use it and modify\
    \ it for your personal use or even for commercial development. All I ask is that\
    \ you retain your copyright information in the code files:\n\n- This code (and\
    \ other sample code) accompanies the book\n- \"The Little Book of Adventure Game\
    \ Programming In Java\"\n- Source code can be downloaded from:\n- http://www.bitwisebooks.com\n\
    \nAs long as you do that, the code is yours to use as you wish. I shall continue\
    \ to add extra features to BIFF and I shall inform subscribers to my email list\
    \ when new releases of the framework are available. To keep up to date with developments,\
    \ please join my mailing list:\n\n```\nhttp://www.bitwisebooks.com/subscribe\n\
    ```\n\nSo now’s your chance to write your own interactive fiction. I look forward\
    \ to exploring your adventures in future!\n\nGood luck – and good programming!\n\
    \nHuw Collingbourne\n"
  mdcn: "\n\n# 附录\n\n## 如何创建接口\n\n如果你希望在多个类之间共享通用行为，可以通过创建你自己的接口来实现。Interfaces 项目提供了一个简单的的示例，我在其中定义了以下两个接口：\n\
    \n```java\ninterface Animal {\n    public void talk();\n    public void move();\n\
    }\n\ninterface Pet {\n    public String getName();\n}\n```\n\n然后我创建了一个实现了 `Animal`\
    \ 接口的 `Cow` 类。该类现在有义务实现接口定义的两个方法：`talk()` 和 `move()`：\n\n```java\nclass Cow implements\
    \ Animal {\n    public void talk() {\n        System.out.println(\"Moooo\");\n\
    \    }\n\n    public void move() {\n        System.out.println(\"Plod, plod, plod...\"\
    );\n    }\n}\n```\n\n`Dog` 实现了两个接口`Animal` 和 `Pet`，它必须实现这两个接口中的所有方法（当然，它也可以包含它自己的其他方法，例如这里的\
    \ `wagtail()` 方法）：\n\n```java\nclass Dog implements Animal, Pet {\n    private\
    \ String name;\n\n    public Dog(String aName) {\n        name = aName;\n    }\n\
    \n    public void talk() {\n        System.out.println(\"Woof!\");\n    }\n}\n\
    ```\n\n## Dog 类 [接续...]\n\n```java\npublic void move() {\n    System.out.println(\"\
    Leap, walk, sniff, leap, walk...\");\n}\n\npublic String getName() {\n    return\
    \ name;\n}\n\npublic void wagTail() {\n    System.out.println(\"Wag, wag, wag\"\
    );\n}\n```\n\n我的 `main()` 循环创建了一个 `Cow` 对象和一个 `Dog` 对象，并分别调用了它们的方法：\n\n```java\n\
    public static void main(String[] args) {\n    Cow aCow = new Cow();\n    aCow.talk();\n\
    \    aCow.move();\n\n    Dog rover = new Dog(\"Rover\");\n    System.out.println(rover.getName());\n\
    \    rover.talk();\n    rover.move();\n    rover.wagTail();\n}\n```\n\n这是输出结果：\n\
    \nMooo\nPlod, plod, plod...\nRover!\nWoof!\nLeap, walk, sniff, leap, walk...\n\
    Wag, wag, wag\n\n虽然你可能不需要以这种方式创建自己的接口，但你确实需要理解如何实现标准 Java 类定义的接口。例如，在我的游戏中，为了能够保存和重新加载游戏对象，每个类必须实现\
    \ `java.io.Serializable`。事实证明，`java.io.Serializable` 没有声明方法，因此我们不需要在代码中实现任何特定方法。你可以将\
    \ `java.io.Serializable` 视为一个“标记接口”——它指示 Java 以特定的方式处理某个类。除非对象实现了 `java.io.Serializable`\
    \ 接口，否则 Java 不会对任何对象进行序列化。\n\n## 修改游戏数据\n\n使用本书书中开发的游戏框架，你只需修改两个类即可创建你自己的游戏。\n\
    \n正如第 12 章提到的，开始编写你自己的游戏最简单的方法是使用我 *Starrush* 项目中的代码，并修改 `game.data` 包中的两个文件（*GameData.java*\
    \ 和 *VocabularyData.java*）以及 `game.objects.special` 包中的一个文件（*Actions.java*）。下文接内容将为你提供一个关于如何修改这三个文件的简短指南。\n\
    \n在 *VocabularyData* 类中，添加任何你希望游戏理解的单词。这些单词必须作为成对元素添加，每个元素的第一个项是单词本身（一个字符串），第二个项是在\
    \ `WT` 枚举中定义的单词类型。每个单词都使用 `put()` 方法添加到词汇 `HashMap` 中：\n\n| VocabularyData.java\
    \ |\n| :--- |\n| vocab.put(\"box\", WT.NOUN); |\n\n![](img/f210b6659f24a42b28725bec993abfc1_185_0.png)\n\
    \n## 示例数据文件\n\n为了方便开始，我包含了示例的 *GameData.java* 和 *VocabularyData.java* 文件，它们位于源代码存档的\
    \ *EmptyDataFiles* 文件夹中。你可以根据自己的需求修改这些文件，并用你修改后的文件替换 `game` 文件夹中的文件。\n\n在 *GameData*\
    \ 类中，你需要按照特定的顺序创建初始化对象。这是因为某些对象引用了其他对象。例如，*Room*（房间）对象引用了其他 *Room* 对象（出口），因此在初始化对象之前，必须创建所有\
    \ *Room* 对象。同样，在创建对象之前，你不能将对象放入容器中。这些是我建议你在修改 *GameData* 类时遵循的步骤（我为每个步骤展示了简短的代码示例）：\n\
    \n## 第 1 步 – 创建房间\n\n| GameData.java |\n| :--- |\n| Room exampleRoom1 = new Room(\"\
    exampleRoom1\"); |\n\n## 第 2 步 – 创建容器\n\n```java\nContainerThing exampleContainer\
    \ = new ContainerThing(\"exampleContainer\",\n\"example container\", Mass.SMALL);\n\
    // 可选设置其属性\nexampleContainer.setOpenable(true)\nexampleContainer.setOpen(false)\n\
    exampleContainer.addAdjectives(new String[]{\"small\", \"example\"});\n```\n\n\
    ```java\n// 可锁对象也是容器\nLockableThing cupboard = new LockableThing(\"cupboard\"\n\
    \"cupboard on the wall\", Mass.MEDIUM, false, false, true, false, true, false);\n\
    cupboard.setShow(false);\n```\n\n## 第 3 步 – 生成游戏物品（宝物）和通用物品\n\n"
