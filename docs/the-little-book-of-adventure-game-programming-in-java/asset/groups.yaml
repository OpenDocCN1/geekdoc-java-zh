    `wordList()` 函数也被声明返回 `List` 而不是 `ArrayList`。这是 Java 中的一种常见写法。它的优点是，当使用接口名称声明特定对象类型时，该对象只需要与接口兼容。因此，在这里可以将实际对象类型更改为实现\
    \ `List` 的其他对象（例如 `LinkedList`），你的代码应该能够继续工作：\n\n```\nList<String> strlist = new\
    \ LinkedList<>();\n```\n\n或者，也可以通过重写这段代码创建如下的 `ArrayList` 对象来使对象类型更“严格”：\n\n```\n\
    ArrayList<String> strlist = new ArrayList<>();\n```\n\n在这种情况下，你不能替换不同的类。只允许 `ArrayList`\
    \ 对象。你也可以重写 `wordList()` 方法返回 `ArrayList`：\n\n```\npublic static ArrayList<String>\
    \ wordList(String input)\n```\n\n这取决于你的选择。好处是，如果你将对象和方法的返回值声明为特定类（如 `ArrayList`），你将受益\
    \ Java 的类型检查，尝试使用“错误类型”的列表对象将显示错误。然而，Java API 文档中的代码示例通常使用 `List` 接口声明，因此我采取了这种惯。\n\
    \n# 将字符串拆分为“单词”\n\n在处理命令之前，我们需要从玩家输入的文本行中提取出单个单词。Java 有一个特殊的 `StringTokenizer`\
    \ 类可以帮助我们。在这里，“标记”是使用的术语，我们通常用人类语言描述为“单词”。\n\n![](img/f210b6659f24a42b28725bec993abfc1_26_0.png)\n\
    \n我们的目标是根据分隔符拆分字符串，分隔符包括空格、逗号、句号、分号、问号、感叹号和星号。这些分隔符本身会被丢弃。在我的代码中，我定义分隔符时，分隔符定义如下：\n\
    \n然后我调用 `StringTokenizer` 构造函数，向它传递两个参数：输入字符串和 `delims`：\n\n现在将输入拆分为标记变得非常简单。我只需使用\
    \ `StringTokenizer` 的 `nextToken()` 方法从输入字符串中拆分。我将其放在一个 循环中，直到没有标记（此时 `hasMoreTokens()`\
    \ 方法返回 `false`）。每次我拆出一个新标记，都会将其添加到我的字符串列表 `strlist` 中：\n\n```\nwhile (tokenizer.hasMoreTokens())\
    \ {\n  t = tokenizer.nextToken();\n  strlist.add(t);\n}\n```\n\n# 第一章——与游戏交互\n\
    \n# 一个 Tokenizer\n\n我喜欢 `StringTokenizer` 类，因为它简单且直观。然而，Java 文档指出“Tokenizer 是为了兼容性而保留的遗留类，但不建议使用”。\n\
    \n文档建议使用 `String.split()` 方法。`String.split()` 需要正则表达式而不是简单的分隔符字符串。你并不经常使用正则表达式，其语法可能会让人困惑，而且非常容易出错，在我看来这是尽可能避免使用它的一个理由。\n\
    \n然而，以防你对使用“遗留”类有疑问，我使用 `String.split()` 编写了这个替代的 `wordList()` 方法。这里的正则表达式很简单。它在方括号之间声明分隔符并在结尾添加一个符号，以便连续的分隔符被视为一个分隔符（也就是说，当遇到多个连续的分隔符时会被删除）。这是我在从\
    \ `AdventureGame1` 开始的游戏项目中使用的方法：\n\n# AdventureGame1(Game.java)\n\n```\npublic\
    \ static List<String> wordList(String input) {\n    String delimiters = \"[\\\
    t,.;?!]+\\\";\n    List<String> strlist = new ArrayList<>();\n    String[] words\
    \ = input.split(delimiters);\n\n    for (String word : words) {\n        strlist.add(word);\n\
    \    }\n    return strlist;\n}\n```\n\n# 解析命令\n\n一旦将字符串分为标记，将其作为列表传递给 `parseCommand()`\
    \ 方法。在 `UserInput` 项目中，这只是一个简单的方法，用于识别由动词（如“take”或“drop”）后跟名词（如“sword”或“ring”）组成的输入。我们在两个列表中定义所有已知单词：`commands`\
    \ 和 `objects`。我们使用 `get()` 方法从双单词列表中获取第一个和第二个单词，然后只需检查 `commands` 列表是否包含第一个单词（索引为0）以及\
    \ `objects` 列表是否包含第二个单词（索引为1）。如果两个都成功，我们就有一个有效的双单词命令。如果其中任何一个失败，我们没有。\n\n"
