    \ {\n        showStr(\"No Exit!\");\n    } else {\n        look();\n    }\n}\n\
    ```\n\nThis method is called by the methods dealing with commands to go N, S,\
    \ W and E. For example, this is the goN() method:\n\n```java\nprivate void goN()\
    \ {\n    movePlayerTo(Direction.NORTH);\n}\n```\n\nThis calls moveTo(), which,\
    \ as explained previously, returns an integer indicating the adjoining room (as\
    \ an index in map) in the selected direction. If there is no room in the direction,\
    \ it returns Direction.NOEXIT (which has the value -1). If there is a room found\
    \ at the specified exit, moveTo() moves the player into the adjoining room (that\
    \ is, the player's location variable is assigned the new Room object). Then the\
    \ look() method is called. This same method, incidentally, is called if the user\
    \ enters the command \"look\":\n\n```java\nprivate void look() {\n    showStr(\"\
    You are in the \" + getPlayer().getLocation().describe());\n}\n```\n\n## Describing\
    \ a Room\n\nThe look() method is pretty straightforward. It gets the player's\
    \ location and calls the describe() method to return a description. What does\
    \ the describe() method do? Let's try to figure it out. If I run the game and\
    \ enter the command \"look\", what do I see:\n\n![](img/f210b6659f24a42b28725bec993abfc1_57_0.png)\n\
    \n- > look\nYou are in the Troll Room. A dank room that smells of troll.\nThings\
    \ here:\ncarrot: It is a very crunchy carrot\n\nThis shows describe() returns\
    \ the room name, its description and a description of all treasures in the room.\
    \ This is the Room class's describe() method:\n\n### AdventureGame2 (Room.java)\n\
    \n```java\npublic String describe() {\n    return String.format(\"%s. %s.\",\n\
    \        getName(), getDescription())\n        + \"\\nThings here:\\n\" + getThings().describeThings();\n\
    }\n```\n\nRemember that the Room class is a descendant of the ThingHolder class\
    \ which is itself a descendant of the Thing class. The ThingHolder class contains\
    \ a field called things which is a ThingList object (an ArrayList that is typed\
    \ to hold Thing objects). So Room inherits name, description and things and adds\
    \ on n, s, w and e:\n\n![](img/f210b6659f24a42b28725bec993abfc1_58_0.png)\n\n\
    ## Describing Treasures\n\nThe getName() and getDescription() are methods of the\
    \ Thing class (used to access the name and description variables) and getThings()\
    \ is a method of the ThingHolder class (used to access the things variable). The\
    \ getThings() method returns a ThingList object. The ThingList class contains\
    \ this method:\n\n![](img/f210b6659f24a42b28725bec993abfc1_58_1.png)\n\n### AdventureGame2\
    \ (ThingList.java)\n\n```java\npublic String describeThings() {\n    String s\
    \ = \"\";\n    if (this.size() == 0) {\n        s = \"nothing.\\n\";\n    } else\
    \ {\n        for (Thing t : this) {\n            s = s + t.getName() + \": \"\
    \ + t.getDescription() + \"\\n\";\n        }\n    }\n    return s;\n}\n```\n\n\
    If there are some things – say, an emerald, a sapphire and a ruby – in the list,\
    \ then the size of the list is not 0, so the method will iterate over the Thing\
    \ objects in a for loop, initializing the variable t with each Thing in the list\
    \ (here the keyword refers to the current object which is a Thing). It calls getName()\
    \ and getDescription() for each thing and appends the two strings returned by\
    \ those methods to the string s before finally returning that string.\n\n![](img/f210b6659f24a42b28725bec993abfc1_59_0.png)\n\
    \n## Method Overriding\n\nSometimes it is useful to implement the same method\
    \ in different classes within a class hierarchy. For example, I may want every\
    \ class in my program to implement its own version of describe(). Let's suppose\
    \ I have a Treasure class which descends from a Thing class. For clarity, I'll\
    \ keep these classes very simple here:\n\n### Overriding (Overriding.java)\n\n\
    ```java\nclass Thing {\n    private String description;\n\n    public Thing(String\
    \ aDescription) {\n        this.description = aDescription;\n    }\n\n    public\
    \ String describe() {\n        return description;\n    }\n}\n```\n\n### Overriding\
    \ (Overriding.java) [continued]\n\n```java\nclass Treasure extends Thing {\n \
    \   private int value;\n\n    public Treasure(String aDescription, int aValue)\
    \ {\n        super(aDescription);\n        this.value = aValue;\n    }\n}\n```\n\
    \nAs you expect, the Treasure class inherits the describe() method from its ancestor\
    \ Thing class. So I can write this code:\n\n```java\npublic class Overriding {\n\
    \    public static void main(String[] args) {\n        Thing thing1, thing2;\n\
    \        thing1 = new Thing(\"A thing\");\n        thing2 = new Treasure(\"A treasure\"\
    , 100);\n        System.out.println(thing1.describe());\n        System.out.println(thing2.describe());\n\
    \    }\n}\n```\n(Note: I have reconstructed the final code block as the OCR was\
    \ corrupted, but the context clearly implies this standard override example).\n"
