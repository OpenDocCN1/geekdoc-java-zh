    \ how to implement the interfaces defined by standard Java classes. In my games,\
    \ for example, to be able to save and reload the game objects, each class has\
    \ to implement java.io.Serializable. It turns out that java.io.Serializable does\
    \ not declare methods so we don't have to implement any specific methods in our\
    \ code. You can think of java.io.Serializable as a 'marker interface' – one that\
    \ instructs Java to treat a class in a specific way. Java won't serialize any\
    \ objects unless they implement the java.io.Serializable interface."
