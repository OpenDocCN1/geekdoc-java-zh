  - "[PAGE 127]\n\n# Chapter 10 – Maps, Mazes and Masses\n\nHowever, if you give a\
    \ little thought to this, you'll soon realise that just adding and subtracting\
    \ the mass of the object in this way is too simplistic. What if there is a sack\
    \ that contains a box and the box contains a full set of kitchen furniture?\n\n\
    The total mass could be huge — far more than the player should be able to carry\
    \ – but the mass of the outermost container (the sack) is so. So if I only use\
    \ the mass of the object that the player tries to take (here, the mass of just\
    \ the sack) in my calculations, the player will soon be able to carry around a\
    \ huge number of ridiculously big and heavy objects, as long as they are inside\
    \ other containers.\n\n# The Reticule Effect!\n\nYou could deliberately allow\
    \ a tiny container to hold a huge mass of objects either as a joke or as part\
    \ of the solution to a puzzle Infocom did this in the pirate adventure game Plundered\
    \ Hearts where a tiny reticule (purse) was capable of containing vast quantities\
    \ of treasures.\n\nIn my game, I don't plan to allow small containers to hold\
    \ ridiculous amounts of swag. That's why I use a variable called tmass which stores\
    \ the 'total mass':\n\n```\nStarmarch-beta (Actor.java) - drop()\ntmass = t.totalMass();\n\
    ```\n\nI assign to tmass the total mass of an object and (when necessary) everything\
    \ it contains. When that object is a container, the total mass includes the mass\
    \ of the object and all its contents (including the contents of any other containers\
    \ inside the outer container). How do I calculate the total mass? The total mass\
    \ of most things is straightforward. It's the same as the mass of the thing itself:\n\
    \n```\nStarmarch-beta (Thing.java)\npublic int totalMass() {\n    return mass;\n\
    }\n```\n\nIt's more complicated for a ContainerThing which could be empty (in\
    \ which case its total mass is the same as its mass), it could contain one or\
    \ more things (in which case its total mass is its mass plus the mass of things\
    \ it contains), it could contain some things (in which case its total mass is\
    \ its mass plus the mass of the things it contains plus the mass of the things\
    \ that they contain)."
  - '[PAGE 128]


    # Chapter 10 — Maps, Mazes and Mazes


    When a container contains other containers, I clearly need to calculate the total
    mass of each ''nested'' or ''inner'' container in the same way that I calculated
    the total mass of the outer container. If I have many nested levels of container
    – one inside inside another – I would need to carry on doing the calculations
    for however many containers there happen to be.


    # Massive Recursion!


    This may remind you of a problem we grappled with in Chapter 9, when the code
    had to dig down through an unknown number of nested containers to work out which
    objects are "visible" and can therefore be considered to be "here". I solved that
    problem with recursion, and as you''ll see, I will solve the total mass problem
    in a similar way.

    TheMass() method in ContainerThing is really simple: it adds together the mass
    of the container object, given by getMass() to the mass of all the objects it
    contains, given by contentsMass():


    | Starcrash-beta (ContainerThing.java) |

    | --- |

    | public int totalMass() { return this.getMass() + contentsMass(); }


    The contentsMass() method is also very simple. It iterates over a linear list
    of all the things that the current ContainerThing contains, t1, gets the mass
    value of each of t.getMass(), and adds that value to an int variable, countmass:


    | Starcrash-beta (ContainerThing.java) |

    | --- |

    | public int contentsMass() { List t1; int countmass; t1 = flatten(); countmass
    = 0; for (Thing t : t1) { countmass += t.getMass(); } return countmass; } }


    So far, there has been no recursion. But where, you may wonder, do I get the linear
    list, t1, from? The t1 list needs to contain all the things in the List of the
    current ContainerThing object plus the things in any other ContainerThing objects
    that may be in'
