    # Chapter 2 — The Map


    # # Make a Map


    It''s a good idea, when planning a game to begin by drawing a map of the ‘world’
    of the game. At the beginning of this chapter, I showed a diagram of my map of
    four rooms: Troll Room, Forest, Cave and Dungeon. The lines showed the exits that
    connect one room to another. Where there are no connecting lines, there are no
    exits.


    The simplest way to make a map is to put rooms into some kind of collection. The
    most obvious type of collection would be an array — that is, a sequential list
    of elements each is indexed by its numeric position. The ArrayList class (which,
    you may recall, I used previously when parsing input), is a sort of dynamically-sized
    array which lets me add and delete elements to grow and shrink the list. This
    is how I declare an ArrayList of objects:


    | AdventureGame1 (Game.java) |

    | private ArrayList<Room>map; |


    # ## Finally, a Game!


    I''m moving the pace up a notch now. Up to now, I''ve gone quite a lot of detail
    when explaining the basic techniques needed to handle user input and create encapsulated
    game objects. Now’s the time to start work on an actual game. From now on, the
    ‘main’ class of my programs will be the Game class which is in the Game.java code
    file. Be sure to refer to the source code archive to see all the code.


    Just as in the word() method I type an ArrayList to strings, now I type an ArrayList
    (called map) to hold Room objects: private ArrayList<Room>map;


    # ## Other Types of Map


    Linear lists as arrays provide an easy way to store collections of rooms. However,
    there are alternatives. You could create a dictionary or HashMap where each room
    is indexed by a name rather than by a number. This is the approach I took in my
    C# adventure game book. Towards the end of this book, I’ll show a way of linking
    rooms together without any map at all!'
