    \n```\ndo {\n  // 执行的代码\n} while(\"q\".equals(input));\n```\n\n# 重写方法\n\n在 C#\
    \ 中重写方法时（即你为基类中已有的方法创建新的实现时），你必须使用 `virtual` 关键字定义基类方法。在 Java 中，与基类同名的方法默认就是可重写的。不需要关键字，但你可以选择在重写方法之前放置\
