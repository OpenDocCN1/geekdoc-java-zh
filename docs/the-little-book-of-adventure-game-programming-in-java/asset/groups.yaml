    \ 对象列表：\n\n| object | word | adjectives |\n| --- | --- | --- |\n| Verb | \"take\"\
    \ | |\n| NounPhrase | \"ring\" | \"small\", \"gold\" |\n\n在这个例子中，我从四个 `WordAndType`\
    \ 元素中开始了一个单词，`SentenceAnalyzer` 创建了一个仅包含两个 `GrammarUnit` 元素的列表——一个表示单个单词的 `Verb`\
