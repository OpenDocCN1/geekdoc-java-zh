    # # Chapter II – Adjectives to Describe Things


    "take the ring" you say. The game replies "do you mean the gold ring, the diamond
    ring or the silver ring?" – How can it do that? Let’s find out...


    ![](img/f210b6659f24a42b28725bec993abfc1_134_0.png)


    Up to now there has only been one object with any given name in each of my game
    projects – one box, one sword, one coin. So if the player enters "Open the box"
    we can work out exactly which box is intended because there is only one box in
    the entire game.


    But that’s isn’t really good enough. After all, we may need a few small boxes
    in the game. And a treasure chest would probably contain many gold coins. If we
    are able to do that we may then we also need to let the player specify a particular
    box to open or a specific coin to take. In other words, it should be possible
    to enter commands like this:


    ```

    open the small box

    take the gold coin

    ```


    Even that isn’t really good enough. After all, we may need a few small boxes in
    the game. And a treasure chest would probably contain many gold coins. The player
    really needs to be able to enter more descriptive commands like this:


    ```

    open the small brown wooden box

    take the big broken Spanish coin

    kill the small dragon with the big lance

    kill the big dragon with the small lance

    ```'
  - '[PAGE 135]


    # Chapter 11 – Adjectives to Describe Things


    Naturally, we also need some way of determining which objects match those descriptions.
    In other words, each object must have a certain number of ''attributes'' such
    as "big" and "broken" or "small" or "wooden". Our parser needs to provide a way
    of describing those attributes using adjectives.


    The parser we''ve seen so far isn''t up to the job. It analyses a sentence into
    individual words and word-types that the commands it interpret is limited to just
    one word of any grammatical type. Using that parser would be fairly easy to add
    adjectives but it would be limited to one adjective per noun – "small box" would
    work but "small ugly broken brown box" would not. What can I do about that? There
    is really only one solution: I need to write a better parser!


    # Grammar Units


    Rewriting the parser, it reminds me of how the current parser (as found in the
    Starbash-beta project) works. Each command that the user enters is split into
    a set of individual words. For example, "take sword" is one verb ("take") and
    one noun ("sword"). The command "put the sword into the box" is a verb, an article,
    a noun, a preposition, another article and finally another noun. For simplicity
    I discard articles "the", "a" and "an". I deal with the remaining words using
    methods such as processVerbNoun(noun) and processVerbNounPrepositionNoun(noun)
    to deal with containing a precise number of words of specific grammatical types.


    But once I start adjectives, I can no longer know advance how many words a valid
    command might contain. All of these commands should be acceptable:


    ```

    put the ring into the box

    put the gold ring into the wooden box

    put the small gold ring into the wooden box

    put the small gold elvish ring into the smelly wooden box

    ```


    ...and so on. My solution to this problem is to define a grammatical unit called
    a noun-phrase. A noun-phrase must contain a noun and zero or more adjectives.
    All of the following are noun-phrases:


    +   - "ring"

    - "elvish ring"

    - "gold elvish ring"

    - "small gold elvish ring"

    - "small gold ancient inscribed elvish ring"'
  - "[PAGE 136]\n\n# Chapter 11 – Adjectives to Describe Things\n\nIn order to deal\
    \ with noun-phrases my parser needs to do a second-pass. In the first pass (as\
    \ before) it decomposes the string entered by the user into individual words categorised\
    \ according to their grammatical type – noun, verb and so on. In the second pass\
    \ it creates grammar units. A grammar unit may contain a single word or a group\
    \ of words that ‘work together’. In a noun-phrase the adjectives work together\
    \ with the noun to describe an object.\n\n# Other Grammar Units?\n\nYou could\
    \ define other multi-word grammar units such as verb-phrases that include zero\
    \ or more adverbs so that “Quickly take” or “Gently pull” would be accepted as\
    \ verb-phrases. In my long experience of playing adventure games, however I have\
    \ not found much cause to use adverbs – I don’t think many players would bother\
    \ using them either – so I would not defining verb-phrases. But you could do so\
    \ if you wanted.\n\nIn the Starcrash project I defines a class called GrammarUnit\
    \ which contains a string field, word:\n\n| Starcrash (GrammarUnit.java) |\n|\
    \ public class GrammarUnit implements java.io.Serializable {\n  private String\
    \ word;\n\n  public GrammarUnit(String aword) {\n    word = aword;\n  }\n\n  public\
    \ String getWord() {\n    return word;\n  }\n} |\n\nI’ve created these descendant\
    \ classes: Verb, Preposition and NounPhrase. The Verb and Preposition classes\
    \ are extremely simple. They just have constructors that pass a string to be initialized\
    \ by GrammarUnit:\n\n| Starcrash (Verb.java) |\n| public class Verb extends GrammarUnit\
    \ implements java.io.Serializable {\n  public Verb(String aword) {\n    super(aword);\n\
    \  }\n} |\n\n137"
