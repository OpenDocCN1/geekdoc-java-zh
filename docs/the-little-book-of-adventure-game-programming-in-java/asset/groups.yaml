    # Overriding in Other Languages


    Maybe you think the way in which one method overrides another with the same name
    is so obvious that it doesn''t need to be mentioned. In fact, not all languages
    work this way. For example, if I wrote similar code in C#, the for loop would
    always call the `describe()` method defined for the `Treasure` class. That''s
    because C# treats the loop variable `t` as an object of the exact type that it
    was declared to be: `Thing`. In order to make it call a method with the same name
    in a descendant class, that method would need to be declared with the keyword
    `virtual` in the base class and the keyword `override` in the descendant classes.
    In Java, base methods are virtual by default and can be overridden without any
    special syntax.'
