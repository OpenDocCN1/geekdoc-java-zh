    # What if There Are Two Matching Things Here?


    All my code so far assumes that there will only be one thing with a given name
    – one sword, one lantern or one – in any location. But what if there are more
    than one? What if there is a gold sword and a silver sword, a red lantern and
    a green lantern, a small cardboard box and a big wooden box? It will take quite
    a bit more coding in order to deal with this. This is explained in the next chapter.


