  - "[PAGE 94]\n\n# Open and Close Objects\n\nYou may have noticed in the code of\
    \ processNoun() shown earlier, that I have two new methods called openOb() and\
    \ closeOb(). These are intended to deal with objects created from the ContainerThing\
    \ class. There is nothing complicated about these methods. As the specified object\
    \ t is, they end up calling t.open() or t.close() to set the isopen state:\n\n\
    ```\nAdventureGame5 (Actor.java)\nt_and_th = isHere(obname);\nt = t_and_th.getThing();\n\
    if (t == null) {\n    s = \"There is no \" + obname + \" here!\";\n} else {\n\
    \    s = t.close();\n}\n```\n\nHowever, what is a bit more complicated is the\
    \ method named isHere(). Think about it. What does it really mean for a thing\
    \ to be “here”? If I want to open the sack or look at the sword, for instance,\
    \ I expect to be able to do so only if the sword and the sack are “here”.\n\n\
    # Is a Thing “Here”?\n\nYou might think that to be an object would have to be\
    \ in the current room – that is, it would have to be found in the ThingList of\
    \ the current room. But what if the object is not in the current room but is in\
    \ the player’s inventory? Our definition of here needs to be extended: an object\
    \ is “here” either if it is in the ThingList of the current room or it is in the\
    \ ThingList of the player.\n\nBut, no that won’t do. Either maybe the player has\
    \ a sack and it is the sack that contains the sword. The sword is still “here”\
    \ (because the player can look at it to take it and drop it) but this is in the\
    \ ThingList of the sack (a ContainerThing object) which is itself in the ThingList\
