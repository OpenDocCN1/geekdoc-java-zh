    \ object, t_and_th is assigned the carrot object (the Thing) and the bowl object\
    \ (the ThingHolder).\n\n# ThingAndHolder\n\nI created the ThingAndHolder class\
    \ so I can easily create an object in which field t is assigned a Thing and a\
    \ field th is assigned the ThingHolder that 'contains' Thing. I can then pass\
    \ those two objects wrapped in a ThingAndHolder object as arguments to methods\
    \ or return them as results of methods:\n\n```\npublic class ThingAndHolder implements\
