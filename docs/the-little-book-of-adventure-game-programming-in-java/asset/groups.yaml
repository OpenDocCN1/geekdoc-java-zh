    Chapter 8 — Restructuring the Game


    # # The Parser


    Up to now, the parsing routines have been bundled up inside the Game class. As
    the parser starts to become more complicated, this will tend to inflate the code
    in the file Game.java, making it harder for me to navigate the code. In any case,
    the parsing routines are sufficiently specialised that they really should have
    their own class.


    # ## Partial Classes?


    In the game I wrote in the C# language – see my book ‘The Little Book Of Adventure
    Game Programming (in C# and other languages)’ – I split out the parsing routines
    by creating a ‘partial class’. A C# partial class is a class that is divided across
    multiple code files. Partial classes do not exist in Java so I have to find other
    way of doing this.


    I don''t particularly want to create ‘objects’ as there will only be one parser.
    My solution has been to create a Parser class containing static methods. These
    can be invoked by calling them from the class itself rather than from objects
    created from that class. However, there are a few other things I have to sort
    out in order to get this to work. That''s what I''ll explain now.


    First I''ve moved the parsing methods, processVerb() and processVerbNoun() into
    a new class called Parser which I placed into the game package. I also moved the
    ‘startup’ class, AdventureGame, from the default package into the game package.
    As I''ll explain, the AdventureGame, Game and Parser classes will need to share
    objects and methods which I don''t want to share with other classes. The easiest
    way for them to do is to place them into the same package.


    # ## Package-private Scope


    The two parsing methods were previously marked as private so that they were only
    visible inside the Game class. Now I want them to be visible through the game
    package but, ideally, not visible to code outside the package. To do that I declare
    them without any access modifier (keywords such as private or public) like this:


    ```

    static String processVerbNoun(List<String> wordlist)

    static String processVerb(List<String> wordlist)

    ```


