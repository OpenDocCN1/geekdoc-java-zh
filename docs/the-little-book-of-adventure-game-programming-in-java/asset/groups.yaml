  mdcn: "\n\n## 第 2 章 地图\n\n## 绘制地图\n\n在规划游戏时，从绘制世界地图开始是一个好主意。在本章的开始，我展示了一个包含四个房间的图：巨人房间（Troll\
    \ Room）、森林（Forest）、洞穴（Cave）和地下牢（Dungeon）。制作地图最简单的方法是将房间放入某种集合中。最明显的集合类型是数组（array）——即一组由其数字位置索引的元素的顺序列表。ArrayList（你可能记得，我之前使用过它）是一种动态大小的数组，允许我添加和删除元素来扩展或收缩列表。这就是我声明一个对象\
    \ ArrayList 的方式：\n\nAdventureGame1 (Game.java)\n```java\nprivate ArrayList<Room>\
    \ map;\n```\n\n## 终于有游戏了！\n\n在本章的开始，我展示了连接一个房间到另一个房间的线条。在没有连接线的地方，就没有出口。我正在加快节奏。到目前为止，在解释处理用户输入的基本技术时，我花了很多细节。现在是时候开始开发实际的游戏了。从现在起，我的程序类将是\
    \ Game.java 文件中的 Game 类。请务必参考源代码以查看所有代码。正如在文中输入的那样，我输入了一个 ArrayList 来存储 Room 对象：\n\
    \n## 其他类型的地图\n\n作为数组的线性列表提供了存储房间集合的简单方法。然而，还有其他替代方案。你可以创建一个字典（dictionary）或 HashMap，其中每个房间通过名称而不是数字进行索引。这是我在我的书中采用的方法。在本书的末尾，我将展示一种完全不需要地图就能将房间连接在一起的方法！\n\
    \n正如之前解释过的，ArrayList 提供了各种实用方法，如 `add()`。我在游戏开始时创建 map 对象，然后使用 `add()` 方法向其添加对象：\n\
    \nAdventureGame1 (Game.java)\n```java\nmap = new ArrayList<Room>();\nmap.add(new\
    \ Room(\"Troll Room\"), \"一间弥漫着巨人气味的潮湿房间\", Direction.NOEXIT, Direction.NOEXIT,\
    \ 1);\nmap.add(new Room(\"Forest\"), \"一片叶茂的木林\", Direction.NOEXIT, Direction.NOEXIT,\
    \ 0);\nmap.add(new Room(\"Cave\"), \"一个墙上布满苔藓的洞穴\", Direction.NOEXIT, Direction.NOEXIT,\
    \ 3);\nmap.add(new Room(\"Dungeon\"), \"一间肮恶、黑暗的牢室\", Direction.NOEXIT, Direction.NOEXIT,\
    \ 2);\n```\n\n我不需要为每个房间创建命名变量，因为从现在起，我将通过索引 map 来访问房间。Room 对象是通过在 `new` 关键字后调用\
    \ `Room()` 构造函数并传递所有所需的参数创建的：名称、描述以及四个“出口”值，用于显示北、南、西、东方向上相邻的房间。每个值都是一个整数，表示它在\
    \ map 中的索引。例如，第一个房间“巨人房间”位于索引 0。第二个房间“森林”位于索引 1。我看到“巨人房间”东侧的出口的值是 1，所以它通向“森林”。“森林”西侧的出口的值是\
    \ 0，所以它通向“巨人房间”。这就是我在本章开始展示的地图。\n\n但那些被称为 `Direction.NOEXIT` 的东西叫什么呢？你一定猜到了它们表示这些方向上没有出口。在\
    \ RoomTest 项目中，我使用值 -1 来表示没有出口。虽然这样做可行，但我我不喜欢用这种方式用整数来表示特殊值，而 `Direction` 没有“明显”的含义，但\
    \ `Direction.NOEXIT` 是自言自语的：\n\nAdventureGame1 (Direction.java)\n```java\npackage\
    \ globals;\n\npublic enum Direction {\n    NORTH,\n    SOUTH,\n    EAST,\n   \
    \ WEST,\n    public static final int NOEXIT = -1;\n};\n```\n\n这里的 `Direction`\
    \ 是我在 `globals` 包中定义的枚举类型。事实证明它的值确实是 -1。通过分配一个整数值，我确保了它与 Room 构造函数所需的整数出口值兼容。这里的其他常量\
    \ NORTH、SOUTH、EAST 和 WEST 没有在 Room 构造函数中使用，因此它们不需要整数值。我将在稍后使用这些常量：\n\n所以现在我有了一个包含几个房间的地图。玩家如何从一个房间移动到另一个房间呢？我将在下一节中解释。\n\
    \n## 第 3 章 移动玩家\n\n我们有了房间，有了地图。现在我们需要添加一个能够在房间之间移动的玩家……\n\n我需要一个类来表示玩家。玩家需要在地图上移动并在（稍后）与对象交互——例如，通过拾捡和丢弃宝物。你可以将玩家视为游戏中的一个“角色”。在原则上，我可以添加任何数量可以闲逛、拾捡和丢弃东西的角色。\n\
    \n## 第 3 章 移动玩家\n\n尽管玩家将是“主”角色，但我决定创建一个名为 Actor 的类。和其他所有对象一样，它应该有一个名称和描述。\n\n\
    类 类层次结构\n\n我可以给我的 Actor 添加名称和描述变量以及 get/set 方法。然而，如果我这样做，我就会重复 Room 类的代码。为了避免这种情况，最好创建另一个类。在\
    \ AdventureGame 项目中，我创建了一个名为 Thing 的类。`Thing` 拥有一个名称和描述：\n\nAdventureGame1 (Thing.java)\n\
    ```java\npublic class Thing {\n    private String name;\n    private String description;\n\
    \n    public Thing(String aName, String aDescription) {\n        // 构造函数\n   \
    \     name = aName;\n        description = aDescription;\n    }\n\n    public\
    \ String getName() {\n        return name;\n    }\n\n    public void setName(String\
    \ aName) {\n        name = aName;\n    }\n\n    public String getDescription()\
    \ {\n        return description;\n    }\n\n    public void setDescription(String\
    \ aDescription) {\n        description = aDescription;\n    }\n}\n```\n\n## 继承\n\
    \n面向对象的一个基本原则是，简单类应该包含其他更专门的类所共有的数据（变量）和行为（方法）。那些更专门的类可以继承简单类的特征并根据需要添加额外的特征。继承另一个类特征的类可以被称为后代类或子类。它继承的类可以被称为祖先类或超类。多层祖先和后代形成了一个类似于家族树或“类层次结构”。\n\
    \n我让 `Actor` 类成为 `Thing` 类的后代。在 Java 中，这样做的方法是在类名和其祖先类名之间放置 `extends` 关键字，如下：\n\
    \n```java\npublic class Actor extends Thing {\n```\n\n这表明我的 Actor 类是 Thing 类的后代。`Thing`\
    \ 类已经有了名称和描述（包括变量以及访问它们所需的 get/set 方法），因此 Actor 类不需要重新编写这些代码。它们自动从 Thing 继承。现在我为\
    \ Actor 对象添加它需要的额外功能。目前这只是 `location`——定义 Actor 对象当前位置的房间：\n\nAdventureGame1 (Actor.java)\n\
    ```java\npublic class Actor extends Thing {\n    private Room location; // 玩家所在的房间\n\
    \    public Actor(String aName, String aDescription, Room aRoom) {\n        super(aName,\
    \ aDescription); // 初始化父类\n        location = aRoom;\n    }\n\n    public void\
    \ setLocation(Room aRoom) {\n        location = aRoom;\n    }\n\n    public Room\
    \ getLocation() {\n        return location;\n    }\n}\n```\n\n"
