    # # Modifying the Game Data


    Using the game framework developed in this book, you can create your own games
    by modifying just two classes.


    As mentioned in Chapter 12, the easiest way to get started on a game of your own
    would be by using the code from my *Starrush* project and modifying the two files
    (*GameData.java* and *VocabularyData.java*) in the `game.data` package and the
    one file (*Actions.java*) in the `game.objects.special` package. Here''ll give
    you a short guide on how to modify these three files.


    In the *VocabularyData* class, add any words that you want to be understood by
    your game. These must be added as paired elements where the first item of each
    element is the word itself (a string) and the second item is a word type defined
    in the `WT` enum. Each word is added to the vocal `HashMap` using the put() method:


    | VocabularyData.java |

    | vocab.put("box", WT.NOUN); |


    ![](img/f210b6659f24a42b28725bec993abfc1_185_0.png)


    # # Sample Data Files


    To get started, I''ve included sample *GameData.java* and *VocabularyData.java*
    files which are in the *EmptyDataFiles* folder of the source archive. You can
    modify these files to your own requirement and replace the files in the `game`
    folder with your modified files.


    In the *GameData* class, you need to create initialize objects in a specific order.
    That''s because some objects refer to other objects. For example, a *Room* object
    has references to other *Room* objects (its exits) so all *Room* objects must
    be created before the objects are initialized. Similarly, you can''t put an object
    into a container before the object is created. These are the steps I recommend
    that you follow when modifying the *GameData* class (I show brief code examples
    for each step):


    # # Step I – Create Rooms


    | GameData.java |

    | Room exampleRoom1 = new Room("exampleRoom1"); |'
