    # Chapter 7 – Saving Games


    How do you save a game so that any changes made (the player’s position, the treasures
    that have been collected and so on) can be reloaded later?


    Now you have a game with a map containing numerous rooms which contain numerous
    treasures. The ‘state’ of the game constantly changes as the player moves from
    one room to another, taking and dropping treasures.


    ![](img/f210b6659f24a42b28725bec993abfc1_70_0.png)


    # Saving and Restoring


    In order to re-load a game you have to be able to save and restore the entire
    game state – the map, the rooms, the treasures in the rooms, the player’s position
    and the treasures in the player’s inventory. Sounds complicated? In fact, it’s
    remarkably easy to do thanks to the power of Java serialization. This is how I
    save the game:


    ```

    oos.writeObject(game);

    ```'
