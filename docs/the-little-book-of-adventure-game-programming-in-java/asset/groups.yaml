    \ `Thing` 对象的确定方式。\n\n在上一个项目中，假设整个游戏中只会有一个箱子、一把剑、一个戒指（以此此类推），因此通过调用 `find()` 方法并传入对象的名称即可找到该对象：\n\
    \n```java\nStarcrash-beta (Actor.java)\nt_th = this.findThing(objname);\n```\n\
    \n在当前项目（Starcrash）中，可能有许多箱子、剑和戒指，每种物品都通过一组“属性”（attributes）来区分——即通过可以使用形容词描述的区分性特征：“small\
    \ gold ring”、“silver ring”等。\n\n![](img/f210b6659f24a42b28725bec993abfc1_145_0.png)\n\
    \n### 形容词还是属性？\n\n当我使用“属性”（attributes）一词时，指的是 `Thing` 对象的“属性”（properties），这些属性帮助我们将其与其他\
    \ `Thing` 对象区分开。`Thing` 的每个属性都可以用形容词描述。由于在编程中，“attribute”（属性）和“property”（属性）通常被用于描述语法的特定特征，我决定为\
    \ `Thing` 对象的属性列表使用“adjectives”（形容词）这一名称。\n\n### 匹配多个对象\n\n我写了一个新方法 `matchingThingsInInventory()`，将整个\
    \ `NounPhrase` 对象传递给它。它能够匹配多个一个对象。例如，如果玩家的物品栏中有一个银戒指（silver ring）和一个金戒指（gold ring），且用户输入了“drop\
    \ ring”，此方法将返回两个对象：\n\n```java\nStarcrash (Actor.java)\npublic ThingAndThingHolderList\
    \ matchingThingsInInventory(NounPhrase np) {\n    ThingAndThingHolderList things;\n\
    \    things = findThings(np);\n    return things;\n}\n```\n\n这里的代码依赖于 `ThingHolder`\
    \ 的 `findThings()` 方法。我在这里不会详细说明它的工作原理（你可以查看 `ThingHolder.java` 中的代码）。只需说明，它再次依赖于一个递归方法。例如，如果用户输入“drop\
    \ small gold ring”，将调用 `dropOb()` 方法。该方法会将包含单词“ring”以及形容词“small”和“gold”的 `NounPhrase`\
    \ 对象传递给玩家对象的 `drop()` 方法：\n\n```java\nStarcrash (ListTool.java)\nprivate static\
    \ String oneThingInList(ArrayList<ThingAndThingHolder> things, String desc, String\
    \ verb, boolean mustInInventory) {\n    String s = \"\";\n\n    if (isNullOrEmpty())\
    \ {\n        if (mustInInventory) {\n            s = \"You haven't got \" + desc;\n\
    \        } else {\n            s = \"Can't see \" + desc;\n        }\n    } else\
    \ if (things.size() > 1) {\n        s = \"Which of these do you want to \" + verb\
    \ + \"?\\n\";\n        s += listMultipleThings(things);\n    }\n    return s;\n\
    }\n```\n\n### II 描述物品的形容词\n\n这里的参数如下：\n\n- ThingAndThingHolder things\n- String\
    \ desc\n- String verb\n- boolean mustInInventory\n- ThingAndThingHolder列表\n- 描述（例如“small\
    \ gold ring”）\n- 动词（如“drop”或“take”）\n- 如果对象必须由 Actor 所有则为 true\n\n### ListTool\
    \ 类\n\n我在 `gameobjects.lists.tools` 包下创建了一个新类 `ListTool`，它包含一些检查列表的静态方法。\n\n另一方面，如果找到了多个对象，则返回字符串“Which\
    \ of these do you want to ”加上动词（例如“drop”或“take”），以及由 `listMultipleThings()` 返回的对象列表：\n\
    \n```java\nStarcrash (ListTool.java)\nprivate static String listMultipleThings(ArrayList<ThingAndThingHolder>\
    \ things) {\n  String s = \"\"\n\n  for (ThingAndThingHolder tth : things) {\n\
    \    s += tth.get().getDescription() + \"\\n\";\n  }\n  return s;\n}\n```\n\n\
    所以实际上，判断多个对象是否匹配命令的操作就此了。每个动作方法 `take()`、`drop()`、`lookAt()`、`look()` 等都使用了在执行动作之前确定\
    \ `Thing` 是否可以被唯一识别的技术。`put` 方法稍微复杂因为它需要检查两个物体是否都能被唯一识别。例如，如果用户输入“put the ring\
    \ into the box”，而这里有两个戒指和两个箱子，它需要显示一条消息告知用户它无法判断指的是哪个箱子或哪个戒指。我留给你们在空闲时间研究 Actor\
    \ 中这个方法以及所有其他“动作”方法的代码。\n\n"
