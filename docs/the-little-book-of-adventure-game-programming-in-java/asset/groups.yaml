    \n## Partial Classes?\n\nIn the game I wrote in the C# language – see my book\
    \ ‘The Little Book Of Adventure Game Programming (in C# and other languages)’\
    \ – I split out the parsing routines by creating a ‘partial class’. A C# partial\
    \ class is a class that is divided across multiple code files. Partial classes\
    \ do not exist in Java so I have to find other way of doing this.\n\nI don't particularly\
    \ want to create ‘objects’ as there will only be one parser. My solution has been\
    \ to create a Parser class containing static methods. These can be invoked by\
    \ calling them from the class itself rather than from objects created from that\
    \ class. However, there are a few other things I have to sort out in order to\
    \ get this to work. That's what I'll explain now.\n\nFirst I've moved the parsing\
    \ methods, processVerb() and processVerbNoun() into a new class called Parser\
    \ which I placed into the game package. I also moved the ‘startup’ class, AdventureGame,\
    \ from the default package into the game package. As I'll explain, the AdventureGame,\
    \ Game and Parser classes will need to share objects and methods which I don't\
    \ want to share with other classes. The easiest way for them to do is to place\
    \ them into the same package.\n\n## Package-private Scope\n\nThe two parsing methods\
    \ were previously marked as private so that they were only visible inside the\
    \ Game class. Now I want them to be visible through the game package but, ideally,\
    \ not visible to code outside the package. To do that I declare them without any\
    \ access modifier (keywords such as private or public) like this:\n\n```\nstatic\
    \ String processVerbNoun(List<String> wordlist)\nstatic String processVerb(List<String>\
    \ wordlist)\n```\n\nWhen declared this like, a method is given ‘package-private’\
    \ scope. What means is that the methods will be visible to other classes in the\
    \ same package but not visible to classes in other packages. So even if I imported\
    \ game.Parser into a class in some other package, I would not be able to call\
    \ the processVerb() method. If I tried to do so from the Room class (in the objects\
    \ package) for example, Java would show me an error message and refuse to compile\
    \ my code.\n\nHowever, from a class within the same package, the methods can be\
    \ called by placing the method name (for example processVerb()) after the class\
    \ name (Parser) and a dot like this: Parser.processVerb(wordlist) method:\n\n\
    ### AdventureGame4 (Game.java)\n\n```java\nprivate String parseCommand(List<String>\
    \ wordlist) {\n  String msg;\n\n  if (wordlist.size() == 1) {\n    msg = Parser.processVerb(wordlist);\n\
    \  } else if (wordlist.size() == 2) {\n    msg = Parser.processVerbNoun(wordlist);\n\
    \  } else {\n    msg = \"Only 2 word commands allowed!\";\n  }\n  return msg;\n\
    }\n```\n\nNow I face one complication. The parser methods need to be able to call\
    \ methods defined in the Game class. For example, if the user enters \"take sword\"\
    , the method processVerbNoun() would assign \"sword\" to the variable noun and\
    \ then it needs to call takeOb(noun) to take the sword.\n\nIn the last version\
    \ of game, AdventureGame3, this was easily done since the takeOb() and dropOb()\
    \ methods were in the same class, Game, as the parser methods could be called\
    \ in the normal way from within a switch:case block:\n\n### AdventureGame3 (Game.java)\n\
    \n```java\ncase \"take\":\n  msg = takeOb(noun);\n  break;\ncase \"drop\":\n \
    \ msg = dropOb(noun);\n  break;\n```\n\nIn AdventureGame3, the methods for handling\
    \ actions such as takeOb() and dropOb() were declared to be private. Since Now\
    \ I want to access these methods from another class (Parser) I’ve removed their\
    \ access modifiers to make them package-private:\n\n| String takeOb(String obname)\
    \ |\n| String dropOb(String obname) |\n\nEven so, I can't just takeOb(noun) from\
    \ code inside the Parser because takeOb() of other action-performing methods all\
    \ belong to an instance of the Game class – in other words, those methods belong\
    \ to the game object. So how do I get access to the game object? Well, it is created\
    \ in the startup class, AdventureGame:\n\n### AdventureGame4 (AdventureGame.java)\n\
    \n| static Game game; |\n| static void main(String[] args) throws Exception {\
    \ |\n| game = new Game(); |\n| // ... and more code |\n\nAs game is a static variable\
    \ with package-private visibility, I can access it like this:\n\n| AdventureGame.game\n\
    \nThis is how I call methods of the game object from code inside the Parser class:\n\
    \n### AdventureGame4 (Parser.java) – processVerbNoun()\n\n| case \"take\": |\n\
    | msg = AdventureGame.game.takeOb(noun); |\n| break; |\n| case \"drop\": |\n|\
    \ msg = AdventureGame.game.dropOb(noun); |\n| break; |\n\n## Extending the Parser\n\
    \nIn AdventureGame5, I've continued working on the Parser class. I've moved the\
    \ static methods wordList() and parseCommand() into Parser.java so that runCommand()\
    \ calls them like:\n\n### AdventureGame5 (Game.java) – runCommand()\n\n| static\
    \ wordlist = Parser.wordList(); |\n| static s = Parser.parseCommand(wordlist);\
    \ |\n\n## Chapter 8 — Restructuring the Game\n\nThe parser itself has been changed\
    \ in this revision. Up to now, I maintained two lists of words — one called commands\
    \ and one called nouns. I now want to add categories of words such as articles\
    \ and prepositions. I've decided that instead of having separate lists for each\
    \ type, it would be better to have a single list in which word is categorised\
    \ according to its grammatical type. In other words, I need a dictionary.\n\n\
    ## HashMap\n\nJava also has a Dictionary class but it is documented as 'obsolete'.\
    \ HashMap is one of classes that implement the Map<K, V> interface where K is\
    \ a key and V is a value. These Map classes are now recommended when you need\
    \ a dictionary. You can add words that your game requires by placing them as key-value\
    \ pairs in my HashMap. These key-value pairs are added to vocab by the initVocab()\
    \ method. If you use this code in your own game, you must be sure to call initVocab()\
    \ at the outset otherwise your game won't have vocabulary. I do that in the constructor\
    \ of the Game class. This is how the vocab object is created:\n\n### AdventureGame5\
    \ (Parser.java)\n\n| static HashMap<String, WT> vocab = new HashMap<>(); |\n\n\
    The items between pointy brackets in this declaration indicate the data types\
    \ required for the key and the value of each element in the HashMap. Here the\
    \ key (which must be unique) is a String and the value is a WT. A WT is an enum\
    \ that provides constants to define the grammatical type of word. I've created\
    \ the WT in the globals:\n\n### AdventureGame5 (WT.java)\n\n```java\npublic enum\
    \ WT {\n  NOUN,\n  VERB,\n  ADJECTIVE,\n  CONJUNCTION,\n  ARTICLE,\n  PREPOSITION,\n\
    \  UNKNOWN,\n  ERROR\n}\n```\n\nSince I am now using a single HashMap to store\
    \ vocabulary instead of multiple lists, I had to rewrite the parseCommand() method:\n\
    \n### AdventureGame5 (Parser.java)\n\n```java\nstatic String parseCommand(List<String>\
    \ wordlist) {\n  List<WordAndWait> command = new ArrayList<>();\n  WT wordtype;\n\
    \  String errms = \"\";\n  String msg;\n  for (String k : wordlist) {\n    if\
    \ (vocab.containsKey(k)) {\n      wordtype = vocab.get(k);\n      if (wordtype\
    \ == WT.ARTICLE) {\n      } else {\n        command.add(new WordAndWait(k, wordtype));\n\
    \      }\n    } else {\n      command.add(new WordAndWait(k, WT.ERROR));\n   \
    \   errms = \"Sorry, I don't understand \" + k + \"'\";\n    }\n  }\n}\n```\n"
  mdcn: "\n\n## 第 8 章 — 重构游戏\n\n## 解析器\n\n到目前为止，解析程序一直被封装在 `Game` 类内部。随着解析器开始变得复杂，这会导致\
    \ `Game.java` 文件中的代码变得膨胀，使我更难导航代码。无论如何，这些解析程序具有充分的特殊性，它们真的应该有自己的类。\n\n## 局部类（Partial\
    \ Classes）？\n\n在我用 C# 语言编写的游戏中——参阅我的书籍《冒险游戏编程入门（使用 C# 及其他语言）》——我通过创建“部分类（partial\
    \ class）”来拆分解析程序。C# 的部分类是指一个跨越多个代码文件的类。Java 中不存在部分类，因此我必须找到其他方法来实现这一目标。\n\n我并不特别想创建“对象”，因为只会有一个解析器。我的解决方案是创建一个包含静态方法的\
    \ `Parser` 类。这些方法可以通过直接调用类本身来执行，而不是通过从该类创建的对象来调用。然而，为了让它运行起来，我还有一些其他事情需要处理。现在我将解释这些。\n\
    \n首先，我将解析方法 `processVerb()` 和 `processVerbNoun()` 移动到一个名为 `Parser` 的新类中，并将其放在\
    \ `game` 包中。我还将将“启动”类 `AdventureGame` 从默认包移动到 `game` 包。正如我将解释的那样，`AdventureGame`、`Game`\
    \ 和 `Parser` 类需要共享对象和方法，而我不想将它们与其他类共享。它们这样做最简单的方法是将它们放在同一个包中。\n\n## 包私有作用范围（Package-private\
    \ Scope）\n\n这两个解析方法之前被标记为 `private`，以便它们只在 `Game` 类内部可见。现在我希望它们在 `game` 包中可见，但理想情况下对包外部的代码不可见。为了做到，我像这样在不使用任何修饰符（如\
    \ `private` 或 `public` 等关键字）的情况下声明它们：\n\n```\nstatic String processVerbNoun(List<String>\
    \ wordlist)\nstatic String processVerb(List<String> wordlist)\n```\n\n这样声明方法将赋予方法“包私有”作用范围。这意味着这些方法对相同包中的其他类可见，但对其他包中的类不可见。因此，即使我在其他包的类中导入了\
    \ `game.Parser`，我也无法调用 `processVerb()` 方法。例如，如果我尝试从 `Room` 类（在 `objects` 包中）这样做，Java\
    \ 将向我显示错误信息并拒绝编译我的代码。\n\n然而，从相同包内的类，可以在类名（例如 `Parser`）和点之后放置方法名（例如 `processVerb()`）来调用这些方法：`Parser.processVerb(wordlist)`\
    \ 方法：\n\n### AdventureGame4 (Game.java)\n\n```java\nprivate String parseCommand(List<String>\
    \ wordlist) {\n  String msg;\n\n  if (wordlist.size() == 1) {\n    msg = Parser.processVerb(wordlist);\n\
    \  } else if (wordlist.size() == 2) {\n    msg = Parser.processVerbNoun(wordlist);\n\
    \  } else {\n    msg = \"Only 2 word commands allowed!\";\n  }\n  return msg;\n\
    }\n```\n\n现在我面临一个复杂问题。解析器方法需要能够调用在 `Game` 类中的方法。例如，如果用户输入 \"take sword\"，`processVerbNoun()`\
    \ 方法会将 \"sword\" 赋值给变量 `noun`，然后它需要调用 `takeOb(noun)` 来拿剑。\n\n在游戏的上一个版本 `AdventureGame3`\
    \ 中，这很容易完成，因为 `takeOb()` 和 `dropOb()` 方法位于同一个类 `Game` 中，解析器方法可以在 `switch:case`\
    \ 块内部以普通方式被调用：\n\n### AdventureGame3 (Game.java)\n\n```java\ncase \"take\":\n\
    \  msg = takeOb(noun);\n  break;\ncase \"drop\":\n  msg = dropOb(noun);\n  break;\n\
    ```\n\n在 `AdventureGame3` 中，处理动作的方法（如 `takeOb()` 和 `dropOb()`）被声明为 `private`。由于现在我想从另一个类（`Parser`）访问这些方法，我删除了它们的修饰符以使它们变为包私有：\n\
    \n| String takeOb(String obname) |\n| String dropOb(String obname) |\n\n尽管如此，我不能直接从\
    \ `Parser` 内部的代码中调用 `takeOb(noun)`，因为其他执行动作方法的 `takeOb()` 都属于 `Game` 类的实例——换句话说，这些方法属于游戏对象。那么我如何获取游戏对象呢？嗯，它是在启动类\
    \ `AdventureGame` 中的：\n\n### AdventureGame4 (AdventureGame.java)\n\n| static Game\
    \ game; |\n| static void main(String[] args) throws Exception { |\n| game = new\
    \ Game(); |\n| // ... and more code |\n\n由于 `game` 是一个具有包私有可见性的静态变量，我可以这样访问它：\n\
    \n| AdventureGame.game\n\n这就是我如何从 `Parser` 类内部的代码调用游戏对象的方法：\n\n### AdventureGame4\
    \ (Parser.java) – processVerbNoun()\n\n| case \"take\": |\n| msg = AdventureGame.game.takeOb(noun);\
    \ |\n| break; |\n| case \"drop\": |\n| msg = AdventureGame.game.dropOb(noun);\
    \ |\n| break; |\n\n## 扩展解析器\n\n在 `AdventureGame5` 中，我继续完善 `Parser` 类。我将静态方法 `wordList()`\
    \ 和 `parseCommand()` 移动到了 `Parser.java` 中，以便 `runCommand()` 如下调用它们：\n\n### AdventureGame5\
    \ (Game.java) – runCommand()\n\n| static wordlist = Parser.wordList(); |\n| static\
    \ s = Parser.parseCommand(wordlist); |\n\n## 第 8 章 — 重构游戏\n\n解析器本身在修订中发生了变化。到目前为止，我维护了两个列表——一个命令，一个名词。现在我想添加像冠词和介词之类的单词类别。我决定不再为每个类型建立单独的列表，而是使用一个列表根据语法类型进行分类。换句话说，我需要字典。\n\
    \n## HashMap\n\nJava 也有 `Dictionary` 类，但它被标记为“已过（deprecated）”。`HashMap` 是实现 `Map<K,\
    \ V>` 接口的类之一，其中 `K` 是键，`V` 是值。当你需要字典时，现在推荐通过在 `HashMap` 中放置键值对来添加游戏所需的单词。这些键值对通过\
    \ `initVocab()` 方法添加到 `vocab`。如果你在自己的游戏中使用这些代码，必须确保调用 `initVocab()`，否则你的游戏将没有词汇。我在\
    \ `Game` 类的构造函数中这样做。这就是 `vocab` 对象的创建方式：\n\n### AdventureGame5 (Parser.java)\n\
    \n| static HashMap<String, WT> vocab = new HashMap<>(); |\n\n此声明中尖括号中的项指示了 `HashMap`\
    \ 中键和值的数据类型。在这里，键（必须唯一）是 `String`，值是 `WT`。`WT` 是一个提供定义单词语法类型的枚举。我在全局中创建了 `WT`：\n\
    \n### AdventureGame5 (WT.java)\n\n```java\npublic enum WT {\n  NOUN,\n  VERB,\n\
    \  ADJECTIVE,\n  CONJUNCTION,\n  ARTICLE,\n  PREPOSITION,\n  UNKNOWN,\n  ERROR\n\
    }\n```\n\n由于我现在使用单个 `HashMap` 来存储词汇而不是多个列表，我必须重写 `parseCommand()` 方法：\n\n### AdventureGame5\
    \ (Parser.java)\n\n```java\nstatic String parseCommand(List<String> wordlist)\
    \ {\n  List<WordAndWait> command = new ArrayList<>();\n  WT wordtype;\n  String\
    \ errms = \"\";\n  String msg;\n  for (String k : wordlist) {\n    if (vocab.containsKey(k))\
    \ {\n      wordtype = vocab.get(k);\n      if (wordtype == WT.ARTICLE) {\n   \
    \   } else {\n        command.add(new WordAndWait(k, wordtype));\n      }\n  \
    \  } else {\n      command.add(new WordAndWait(k, WT.ERROR));\n      errms = \"\
    Sorry, I don't understand \" + k + \"'\";\n    }\n  }\n}\n```\n\n"
