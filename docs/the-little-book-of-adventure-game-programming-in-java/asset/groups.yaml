    # Chapter 2 – The Map


    An exploring-style adventure game needs to have somewhere to go exploring. That
    means you need to have locations, or Rooms that are connected to other Rooms.
    In other words, you need a map. That''s what this lesson is about.


    Before I can create a map, I need to decide what sort of object a Room is. Let''s
    begin by draw out a simple map. I have four Rooms – A Troll Room, A Forest, a
    Cave and a Dungeon. Each Room has a name and it has connections in any of the
    four directions, North, South, East or West. When there is no connection to another
    room, I''ll call that No Exit:


    ![](img/f210b6659f24a42b28725bec993abfc1_32_0.png)


    # Rooms or Locations?


    Traditionally, adventure games refers to locations as ‘rooms’ whether or not those
    locations are literally inside a building. In this book, when I talk about a room
    I mean any distinct location even if it happens to be somewhere in the ‘outside
    world’ such as in a street or in a forest. Similarly, when I talk about an ‘exit’
    I mean a connection to another room or location in a specific ‘direction’.'
