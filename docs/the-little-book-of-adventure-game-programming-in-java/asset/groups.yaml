    `contentsMass()` 方法也很简单。它遍历当前 `ContainerThing` 包含的所有线性列表 `t1`，获取每个 `t.getMass()`\
    \ 的值，并将该值加到整数变量 `countmass` 中：\n\n| Starcrash-beta (ContainerThing.java) |\n|\
    \ :--- |\n| public int contentsMass() {\\n    List t1;\\n    int countmass;\\\
    n    t1 = flatten();\\n    countmass = 0;\\n    for (Thing t : t1) {\\n      \
    \  countmass += t.getMass();\\n    }\\n    return countmass;\\n} } |\n\n到此为止还没有递归。但是，你可能会问，我从哪里获取线性列表\
    \ `t1`？`t1` 列表需要包含当前 `ContainerThing` 对象列表中的所有物品，加上可能在其中的其他 `ContainerThing` 对象中的物品。\n\
    \n"
