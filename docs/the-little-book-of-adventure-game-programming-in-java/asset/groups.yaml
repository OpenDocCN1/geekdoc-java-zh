  - "[PAGE 105]\n\n# Chapter 9 — Object Orientation Revisited\n\nYou'll find that\
    \ the \"look\" command calls AdventureGame.game.look() which calls player.describeLocation()\
    \ which calls the location.describe() method which calls the describeThings()\
    \ method of ThingHolder.\n\n# Is a Thing “Here?” – the Problem Revisited\n\nAt\
    \ the end of Chapter 8, I outlined the problem of determining whether a specific\
    \ Thing can be considered to be “here” from the player's point of view. An object\
    \ that is “here” is one that is either in the room the player's inventory – or\
    \ could be inside one or more open objects in the room or the inventory. So, for\
    \ example, if I put the carrot into the bowl and then I put the bowl into the\
    \ open sack and then enter the command \"take carrot\", this is what I want to\
    \ see:\n\n+   You take the carrot from the bowl\n\nIn order for this to happen,\
    \ I need to know that the carrot is “here” (that is, I need to be sure that the\
    \ player can “see” it in the current location) even though it might be inside\
    \ a container – and that container itself be inside one or more other containers.\
    \ In programming terms, I need to be able to produce lists that are nested inside\
    \ other lists. To do that, I need another recursive method. Here it is:\n\n```\n\
    AdventureGame5 (ThingHolder.java)\nprivate void findThingInList(ThingHolder th,\
    \ String objame) {\n    boolean found = false;\n\n    for (Thing t : th.getThings())\
    \ {\n        if (t.getName().equals(objname)) {\n            t_and_th = new ThingAndHolder(th,\
    \ th);\n            found = true;\n        }\n        if (found) {\n         \
    \   if ((t instanceof ContainerThing) && ((ContainerThing) t).isOpen()) {\n  \
    \              findThingInList(((ContainerThing) t), objame);\n            }\n\
    \        }\n    }\n}\n```\n\nThis method once again takes a ThingHolder as an\
    \ argument and calls itself recursively to deal with any other ThingHolder objects\
    \ which it ‘holds’ (literally, which are found in its ThingList field things)."
  - "[PAGE 106]\n\nUnlike the previous recursive method we looked at, this one doesn't\
    \ return a string. It assigns to the t_and_th field a Thing object and a ThingHolder\
    \ object. This does when a Thing is found that matches the string passed as obname.\
    \ So, for instance if obname is \"carrot\" and the carrot object is found in the\
    \ bowl object t_and_th is assigned the carrot object (the Thing t) and the bowl\
    \ object (the ThingHolder th).\n\n# ThingAndThingHolder\n\nI created the ThingAndThingHolder\
    \ class so I can easily create an object in which field t is assigned a Thing\
    \ and a field th is assigned the ThingHolder that 'contains' Thing. I can then\
    \ pass those two objects wrapped in a ThingAndThingHolder object as arguments\
    \ to methods or return them as results of methods:\n\n```\npublic class ThingAndThingHolder\
    \ implements java.io.Serializable{\n\n    private Thing t;\n    private ThingHolder\
    \ th;\n\n    public ThingAndThingHolder(Thing aThing, ThingHolder aThingHolder)\
    \ {\n        t = aThing;\n        th = aThingHolder;\n    }\n\n    public Thing\
    \ getThing() {\n        return t;\n    }\n\n    public void setThing(Thing aThing)\
    \ {\n        this.t = aThing;\n    }\n\n    public ThingHolder getThingHolder()\
    \ {\n        return th;\n    }\n\n    public void setThingHolder(ThingHolder aThingHolder)\
    \ {\n        this.th = aThingHolder;\n    }\n\n    public ThingList getList()\
    \ {\n        return th.getThings();\n    }\n}\n```"
