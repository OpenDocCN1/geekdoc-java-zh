  - "[PAGE 96]\n\n# # Chapter 9 – Object Orientation Revisited\n\nSince Java is an\
    \ object oriented language, let's see if our code can be structured in more object\
    \ oriented way and consider what are the advantages – and disadvantages – doing\
    \ so.\n\nUp to now, the Game class has been the all-seeing, all-doing 'god' of\
    \ the game. When the user enters a command to look or take a game object, it is\
    \ the game object that does all the work. It looks upon all the other objects\
    \ the chess player might look down at the chess pieces on a board.\n\nIf the Queen\
    \ takes a Pawn, it is the chess player who performs that. If the player wants\
    \ to take a sword then it is the game object that performs that action.\n\nThere's\
    \ nothing wrong with implementing game in that way. However, one of the big ideas\
    \ of object orientation is that each object encapsulates the data and the behaviour\
    \ necessary to that object. Instead of getting the game object to take or drop\
    \ or look at things, it might be better to ask the player to take and drop objects\
    \ or look at the room in which it is situated.\n\nIn this chapter, I will rewrite\
    \ my code to make each object more 'self-contained'. First though, let me turn\
    \ to the problem outlined at the end of the last chapter – how can I find an object\
    \ that is inside one or more containers? First, look at what my first attempt\
    \ at writing some code that shows all the objects in the current room:\n\n# AdventureGame5\
    \ (Game.java)\n\n```\nvoid showThings() { // shows only 'top-level' objects in\
    \ list\nThingList tl = player.getLocation().getThings();\n for (Thing t : tl)\
    \ {\n    showStr(t.getName());\n}\n}\n```\n\n![](img/f210b6659f24a42b28725bec993abfc1_96_0.png)"
