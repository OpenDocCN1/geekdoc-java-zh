    # GenericThing


    A new class, GenericThing, has been added. This is intended for objects that may
    form part of the ''scenery'' (so they can be looked at, pushed and so on) but
    are not intended to be usable game objects. You might create lights, windows,
    walls, trees and so forth as GenericThing objects:


    | Starcrash (GameData.java) - initGame() |

    | GenericThing lights = new GenericThing("lights", "flashing lights", true); bridge.adding(lights);
    |


    When the final argument of the GenericThing() constructor is true, the thing is
    a plural - here''s that ''lights'' not ''Light''. When plural, the GenericThing
    isPlural() method returns true and the article() method returns an empty string
    (but return "some" if you prefer) so that, if you need to describe the object,
    you know it should be "lights" or "some lights" or "a light" when singular:


    # Plurals


    You could also extend the parser and the Thing objects to deal seamlessly with
    plurals. For example, if there is a GenericThing called "lights" or "plants" in
    the current location, you might write some code to deal with commands that specify
    the singular "light" or "plant" so that, for example, the player could either
    either "look at plant" or "look at plants". In my game, I''ve cheated a bit. In
    a room with lights I add two objects, one called "light", another called "lights"
    so that the user can look at (or interact in other ways) with either a singular
    light or several lights.


    ![](img/f210b6659f24a42b28725bec993abfc1_156_0.png)'
