    # Buffered Reading


    Next comes this declaration:


    ```

    BufferedReader in;

    ```


    I''ve declared a variable called in which is a BufferedReader object. This is
    an object that is used to read text from a character-input stream (which might
    be a file on disk, example, or might, as here, be entered at a prompt). It reads
    characters into a buffer which makes it more efficient when dealing with characters,
    arrays and lines of text.


    # What is a Buffer?


    A buffer is an area of temporary storage in memory. A program might read a fairly
    large chunk of data into a buffer and then process the individual characters or
    bytes by reading them from this buffer rather than reading them one by one from
    a file on disk. This can speed up the processing of data since memory access is
    much faster than disk access.


    Then I declare this variable:


    ```

    String input;

