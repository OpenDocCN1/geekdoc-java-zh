    # Chapter 8 – Restructuring the Game


    continue to do in later chapters. My aim is to take all the ''experimental'' code
    that I''ve written up to now – in short programs – and turn it into the ''user-ready''
    code that can be released in a finished game.


    # Revision Never Ends!


    Some programming authors give the impression that their complex programs arrive
    ‘fully formed’, well-structured and bug-free, without any significant changes
    from start to finish. That’s not how most real-world programs are written. In
    the real world, programs – just like novels or movie scripts – go through ‘drafts’
    as new ideas occur to the writer, repetitive scenes (or functions) are deleted
    and plot-problems (or bugs) are found and fixed. In the course of this book I’ve
    tried to be absolutely honest with the reader. When I’ve discovered design flaws
    in my original code – some classes and methods becoming too long and complicated,
    for example – I’ve shown the steps I took to fix these problems. This sort of
    incremental development never ends when programming big projects. There is always
    something that can be improved!


    # New Classes


    ![](img/f210b6659f24a42b28725bec993abfc1_77_0.png)


    On the far left are the AdventureGame3 classes (shown in NetBeans). On the right
    are the AdventureGame5 classes which are developed in this chapter. Later, I will
    add more classes to my game. My aim is to create a fairly dense class hierarchy
    of special-purpose classes rather than a shallower hierarchy made up of general-purpose
    classes.'
