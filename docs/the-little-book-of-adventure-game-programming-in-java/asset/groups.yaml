    or\n\nhttps://www.amazon.co.uk/review/create-review?asin=1913132137\n\n# Appendix\n\
    \n# Online Adventure Games\n\nBefore programming your own adventure game, it's\
    \ a good idea to play a few games that have been written by other people. There\
    \ are numerous free adventure games that you can download or play online.\n\n\
    Infocom games can be downloaded, free, from several locations on the Internet\
    \ such as http://www.infocom-if.org.\n\nMy game, The Golden Wombat Of Destiny,\
    \ can be played online or downloaded from: https://archive.org/details/TheGoldenWombatOfDestiny.\n\
    \nOther old adventure games are available from http://www.abandonia.com.\n\nYou\
    \ may need a DOS emulator such as DOSBox http://www.dosbox.com/ to run some of\
    \ these games.\n\n# C# Compared to Java\n\nIn many respects the C# and Java languages\
    \ are quite similar. They are both Object Oriented languages with a C-like syntax.\
    \ Frequently it is possible to translate Java code to C#, or vice versa, with\
    \ relatively few changes.\n\nSince I also have a book on writing an adventure\
    \ game in C#, I think it's worth taking a little time to highlight some important\
    \ differences between the two languages. Being able to translate code from one\
    \ language to another is a useful skill for any programmer to have. This is, of\
    \ course, only a very brief comparison of the two languages. In order to translate\
    \ from one to the other, you would need some familiarity with both Java and C#\
    \ and you would also need to refer frequently to the documentation of their class\
    \ libraries. Even so, this short Appendix may give you an insight into the sorts\
    \ of problems you may encounter when doing this. At any rate, these are a few\
    \ of the things that tripped me up when I worked on my Java adventure game.\n\n\
    # String Equality\n\nHere's the main loop in a C# game. It continues running as\
    \ long as the value of output is not \"q\":\n\n| C# |\n| :--- |\n| string input;\
    \ |\n| do { |\n| input = Console.ReadLine().ToLower(); |\n| // code to run |\n\
    | } while (input != \"q\"); |\n\nThe syntax of a do loop in Java is the same as\
    \ in C#, I could write a loop like this:\n\n| Java |\n| :--- |\n| String input;\
    \ |\n| do { |\n| input = getInput().toLowerCase(); |\n| // code to run |\n| }\
    \ while (input != \"q\"); |\n\n# Appendix\n\nHowever, if I did that, the loop\
    \ would run for ever. When I enter \"q\" at the prompt, the comparison with the\
    \ string \"q\" would fail. That's because in Java the operators == != test absolute\
    \ string equality which means that in order to be equal, two strings or string\
    \ variables must refer to the exact same string, stored in a single memory location.\
    \ In C#, on the other hand, the contents of the string are compared so \"q\" will\
    \ be considered equal to another string that contains \"q\" whereas in Java it\
    \ would not. This is the correct way to compare two strings in Java:\n\n```\n\
    do {\n  // code to run\n} while(\"q\".equals(input));\n```\n\n# Splitting Strings\n\
    \nBoth C# and Java have a String.split() method. Both C# and Java have a String.split()\
    \ method. Both C# and Java have a String.split() method.\n\n| C# |\n| :--- |\n\
    | string input; |\n| do { |\n| input = Console.ReadLine().ToLower(); |\n| // code\
    \ to run |\n| } while (input != \"q\"); |\n\n| Java |\n| :--- |\n| String input;\
    \ |\n| do { |\n| input = getInput().toLowerCase(); |\n| // code to run |\n| }\
    \ while (input != \"q\"); |\n\nHowever, if I did that, the loop would run for\
    \ ever. When I enter \"q\" at the prompt, the comparison with the string \"q\"\
    \ would fail. That's because in Java the operators == != test absolute string\
    \ equality which means that in order to be equal, two strings or string variables\
    \ must refer to the exact same string, stored in a single memory location. In\
    \ C#, on the other hand, the contents of the string are compared so \"q\" will\
    \ be considered equal to another string that contains \"q\" whereas in Java it\
    \ would not. This is the correct way to compare two strings in Java:\n\n```\n\
    do {\n  // code to run\n} while(\"q\".equals(input));\n```\n\nBoth C# and Java\
    \ have a String.split() method. Both C# and Java have a String.split() method.\
    \ Both C# and Java have a String.split() method.\n\n| C# |\n| :--- |\n| string\
    \ input; |\n| do { |\n| input = Console.ReadLine().ToLower(); |\n| // code to\
    \ run |\n| } while (input != \"q\"); |\n\n| Java |\n| :--- |\n| String input;\
    \ |\n| do { |\n| input = getInput().toLowerCase(); |\n| // code to run |\n| }\
    \ while (input != \"q\"); |\n\n# Overriding Methods\n\nWhen you override a method\
    \ in C# (that is, when you create a new implementation of a method that already\
    \ exists in ancestor class), you must define the ancestor method using the virtual\
    \ keyword. In Java, methods with the same names as ancestor classes are overridden\
    \ by default. No keywords are needed though you may optionally place @override\
    \ annotation before overridden method so that the compiler can do additional checking.\n\
    \n# Partial Classes\n\nIn C# a partial class is a class that is divided up across\
    \ multiple files. This makes it possible to write quite long classes while keeping\
    \ source file fairly short. Partial classes don't exist in Java.\n"
