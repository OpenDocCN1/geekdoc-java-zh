    \  t = aThing;\n        th = aThingHolder;\n    }\n\n    public Thing getThing()\
    \ {\n        return t;\n    }\n\n    public void setThing(Thing aThing) {\n  \
    \      this.t = aThing;\n    }\n\n    public ThingHolder getThingHolder() {\n\
    \        return th;\n    }\n\n    public void setThingHolder(ThingHolder aThingHolder)\
    \ {\n        this.th = aThingHolder;\n    }\n\n    public ThingList getList()\
    \ {\n        return th.getThings();\n    }\n}\n```\n"
