    \ Object Orientation Revisited\n\n# AdventureGame5 (ThingHolder.java)\n\n```\n\
    public String describeThings() {\n    thingStr = \"\";\n    describeThings(this);\n\
    \    return thingStr;\n}\n```\n\nThis method assigns an empty string to thingStr\
    \ which is a field of the ThingHolder class. It calls describeThings() which is\
    \ a private method (private because I don't want any code outside of this class\
    \ to be able to use it) to create a new string which is assigned to thingStr and\
    \ this string is then returned.\n\nThe describeThings() method gets a ThingList\
    \ containing a list of Thing objects from the ThingHolder th (initially this the\
    \ 'top-level' ThingHolder – that's the player) and iterates over the elements\
    \ in a for loop.\n\nIt gets the name of each Thing t and appends it to thingStr.\
    \ Then it does test if I explained in an earlier example to check if any Thing\
    \ is an instance of the ContainerThing and, if it is, it tests if it is open.\n\
    \nIf an open ContainerThing is found and contains something (that is, the size()\
    \ of its ThingList, returned by getThings(), returned by getThings(), is greater\
    \ than 0), then it appends \"The \" plus the name of the current container.\n\n\
    Then the method calls itself recursively.\n\n```\nAdventureGame5 (ThingHolder.java)\n\
    private void findThingList(ThingHolder th, String objname) {\n    boolean found\
    \ = false;\n\n    for (Thing t : th.getThings()) {\n        if (t.getName().equals(objname))\
    \ {\n            t_and_th = new ThingAndHolder(t, th);\n            found = true;\n\
    \        }\n        if (found) {\n            if ((t instanceof ContainerThing)\
