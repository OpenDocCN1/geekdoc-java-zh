    \ it is open.\n\nIf an open ContainerThing is found and contains something (that\
    \ is, the size() of its ThingList, returned by getThings(), is greater than 0),\
    \ then it appends \"The \" plus the name of the current ContainerThing contains:\
    \ \\n\".\n\nThen the method calls itself recursively – describeThings((ContainerThing)\
    \ t) to process the newly found ContainerThing. This time the elements of the\
    \ ThingList will be iterated over (in the for loop) and so on.\n\n# AdventureGame5\
    \ (ThingHolder.java)\n\n```\nprivate void describeThings(ThingHolder th) {\n \
    \   ThingList tlist = th.getThings();\n\n    for (Thing t : tlist) {\n       \
    \ thingStr += t.getName() + \"\\n\";\n        if ((t instanceof ContainerThing)\
