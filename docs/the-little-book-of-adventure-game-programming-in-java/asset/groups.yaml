  - '[PAGE 124]


    # Code Changes


    My first attempt at creating a complete game can be found in Starcrash-beta-project.
    It has been marked ''beta'' because, as I developed this, I realised there were
    still things I needed to improve before the code was suitable for developing a
    complete game. This beta release incorporates various changes and additions to
    tidy up my code and get it ready for a ''final'' version. I''ll go over these
    changes quite quickly as they don''t involve anything new in terms of coding technique:


    # GameThing


    I''ve renamed Treasure to GameThing. Thing is now intended to be the class for
    all ''simple'' game objects. Thing is still the ''base'' class but it is my intention
    to create Thing objects any longer. GameThing will be used for simple objects
    that aren''t containers. I don''t plan to maintain a ''score'' I''ve added field
    to Thing. This is an integer which gives a very rough idea of the size and weight
    of each Thing. It will used later to make sure that there is a limit to the number
    of things the player collect.


    # Calculating ‘Mass’ of Objects


    For simplicity, I''ve decided that the mass of a Thing should normally be assigned
    from a limited set of integer values defined by some constants. I cheated a bit
    here by creating an enum that contains no enumerated values but only numeric constants.
    To keep the compiler quiet about this, I''ve had to add a semicolon just above
    the constants. The semicolon would normally be placed after the enumerated identifiers
    but here it is just a piece of meaningless (but required) syntax. The value UNKNOWN
    is used for Thing objects whose mass is irrelevant (e.g. Room and Actor objects):


    ```

    public enum Mass {

    public static final int UNKNOWN = 0;

    public static final int TINY = 1;

    public static final int SMALL = 5;

    public static final int MEDIUM = 25;

    public static final int BIG = 50;

    public static final int HUGE = 100;

    }

    ```'
