    \ Java 和 C#，并且需要频繁参考它们的类库文档。尽管如此，这个简短的附录可能也会让你了解在进行此类操作时可能会遇到的某些问题。总之，这些都是我在编写\
    \ Java 冒险游戏时遇到的一些问题。\n\n# 字符串相等性\n\n这是一个 C# 游戏中的主循环。只要输出的值不为 \"q\"，它就会继续运行：\n\n\
    | C# |\n| :--- |\n| string input; |\n| do { |\n| input = Console.ReadLine().ToLower();\
    \ |\n| // 执行的代码 |\n| } while (input != \"q\"); |\n\nJava 中 do 循环的语法与 C# 相同，我可以写出这样的循环：\n\
