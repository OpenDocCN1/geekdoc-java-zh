  mdcn: "\n\n## 第 9 章 — 回顾面向对象编程\n\n你可能会想，在地图中拥有实际的 Room 对象不是更好吗？当玩家想要从巨人房间（Troll\
    \ Room）向南移动时，`go()` 方法将返回位于巨人房间南方出口的相邻 Room。\n\n使用实际 Room 对象作为出口有助于让玩家更具自主性——就像一个能够执行自身动作的软件机器人，而不是一个需要外部输出（如玩家或游戏本身）才能在不同地点之间移动的棋子。但也有一些缺点。首先，对象之间的链接可能会迅速创建一个复杂的对象网络（这会让调试变得非常棘手）。而且你还需要确保按照正确的顺序创建和初始化房间。\n\
    \n在将 Room 对象作为其他 Room 对象的字段（出口）添加时，你需要分两个不同的步骤来创建和初始化每个 Room。首先，你必须创建“空”的 Room\
    \ 对象。然后，你必须初始化每个 Room，将其他 Room 对象分配给出口变量。你可以在一个步骤中将 Room 对象放置在出口（在这些对象的构造期间），因为在将它们分配给出口变量之前，所有的\
    \ Room 对象 都必须创建。这就是我创建和初始化的方式：\n\n### AdventureGame6 (Game.java)\n\n```java\n\
    // 创建房间\nRoom troll = new Room();\nRoom forest = new Room();\nRoom cave = new\
    \ Room();\nRoom shed = new Room();\nRoom dungeon = new Room();\n```\n\n```java\n\
    // 初始化房间\ntroll.init(\"Troll Room\", \"一个闻着巨人味道的黑暗房间\", null, cave, null, null,\
    \ null, trollList());\nforest.init(\"Forest\", \"一片绿树葱葱的森林\", null, null, trollRoom,\
    \ null, null, forestList());\ncave.init(\"Cave\", \"一个布满发光苔藓的阴暗洞穴\", TrollRoom,\
    \ null, null, null, dungeon, caveList());\nshed.init(\"Shed\", \"一个旧木小屋\", null,\
    \ null, cave, null, null, new ThingList(\"shedList\"));\ndungeon.init(\"Dungeon\"\
    , \"一个恶臭、黑暗的牢室\", null, null, null, cave, null, new ThingList(\"dungeonList\"\
    ));\n```\n\n当然，我重写了 Room 构造函数并添加了一个 `init()` 方法来支持这种操作。由于 Actor 能够在指定的出口找到 Room\
    \ 并移动（设置位置），我将 `moveTo()` 方法从 Game 类移动到了 Actor 类，并对其略微重写，以处理 Room 对象而不是整数。\n\n\
    在 Game 类中，`moveTo()` 方法调用 `player.moveTo()` 并向其传递一个 `Dir` 参数（如 NORTH 或 SOUTH 这样的枚举常量）。执行实际“移动”动作的是\
    \ `Actor` 对象。如果玩家移动到了新房间，`moveTo()` 返回 `true`，否则返回 `false`：\n\n```java\nvoid movePlayerTo(Dir\
    \ dir) {\n  if (player.moveTo(dir)) {\n    look();\n  } else {\n    showStr(\"\
    没有出口!\");\n  }\n}\n```\n\n## 房间作为出口\n\n简而言之，使用 Room 对象的优点比使用像整数 2 更言而易见：b) 拥有指向实际房间的引用使得玩家（Actor\
    \ 对象）能够移动，而不需要另一个对象（如门）来完成操作。使用 Room 而不是整数的缺点是它让调试更困难。房间之间的链接创建了一个复杂的多链网络。相比之下，数组或\
    \ ArrayList 是一种线性结构，在调试时更容易导航。当你使用 Room 对象表示出口时，你根本不需要单独的地图结构。但在我的代码中，为了调试，我将所有房间都添加到了我的地图\
    \ ArrayList 中。处理这个问题还有其他方法。我在《The Little Book of Adventure Game Programming in\
    \ C#》中开发的 C# 游戏中，Dictionary 条目是通过描述性枚举常量（例如 `rm.DaggerStreet`）表示的，如下：\n\n```c\n\
    rmRoom(\"Ripper Mews\", \"一条令人愉快的小街\", Rm.NOEXIT, Rm.GardenN, Rm.DaggerStreet,\
    \ Rm.NOEXIT, ThingList())\n```\n\n## 现在编写一个游戏\n\n我们现在准备好超越代码的测试和开发阶段，开始制作一个可以玩的游戏。当然，你可以添加更多词汇和方法，让玩家执行拉、推或其他动作。自然地，这完全取决于你如何决定在你的游戏中可以发现哪些宝藏和房间。\n\
