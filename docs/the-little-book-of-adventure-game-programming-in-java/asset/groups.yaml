  md: "\n## Chapter 9 – Object Orientation Revisited\n\nSince Java is an object oriented\
    \ language, let's see if our code can be structured in more object oriented way\
    \ and consider what are the advantages – and disadvantages – doing so.\n\nUp to\
    \ now, the Game class has been the all-seeing, all-doing 'god' of the game. When\
    \ the user enters a command to look or take a game object, it is the game object\
    \ that does all the work. It looks upon all the other objects the chess player\
    \ might look down at the the chess pieces on a board.\n\nIf the Queen takes a\
    \ Pawn, it is the chess player who performs that. If the player wants to take\
    \ a sword then it is the game object that performs that action.\n\nThere's nothing\
    \ wrong with implementing game in that way. However, one of the big ideas of object\
    \ orientation is that each object encapsulates the data and the behaviour necessary\
    \ to that object. Instead of getting the game object to take or drop or look at\
    \ things, it might be better to ask the player to take and drop objects or look\
    \ at the room in which it is situated.\n\nIn this chapter, I will rewrite my code\
    \ to make each object more 'self-contained'. First though, let me turn to the\
    \ problem outlined at the end of the last chapter – how can I find an object that\
    \ is inside one or more containers? First, look at what my first attempt at writing\
    \ some code that shows all the objects in the current room:\n\n### AdventureGame5\
    \ (Game.java)\n\n```java\nvoid showThings() { // shows only 'top-level' objects\
    \ in list\nThingList tl = player.getLocation().getThings();\n for (Thing t : tl)\
    \ {\n    showStr(t.getName());\n}\n}\n```\n\n![](img/f210b6659f24a42b28725bec993abfc1_96_0.png)\n\
    \nWhen my game begins, the first room contains these objects: carrot, tree, sack,\
    \ bowl. If I call the showThingsInRoom() method, this is what I see:\n\n```\n\
    carrot\ntree\nsack\nbowl\n```\n\nThat looks right. But suppose I now take the\
    \ carrot and put it into the bowl. Then I take the bowl and put it into the sack.\
    \ Now I call the showThingsInRoom() method again. This is what I see:\n\n```\n\
    tree\nsack\n```\n\nIt doesn't show me the objects inside the sack. That’s because\
    \ my code only iterates over the items in the ‘top-level’ ThingList — the one’s\
    \ owned by the Room. The bowl is in the ThingList owned by the sack, and the carrot\
    \ is in the ThingList owned by the bowl so neither of those are shown.\n\n###\
    \ Finding Things inside Containers\n\nHere’s my rewritten method:\n\n```java\n\
    AdventureGame5 (Game.java)\nvoid visibleThings(ThingList tl) {\n    for (Thing\
    \ t : tl) {\n        showStr(t.getName());\n        if ((t instanceof ContainerThing)\
    \ && ((ContainerThing) t).isOpen()) {\n            showVisibleThings(((ContainerThing)\
    \ t).getThings());\n        }\n    }\n}\n```\n\nThis method calls itself recursively\
    \ so that when it finds a ContainerThing it passes the list from ContainerThing\
    \ back to showVisibleThings():\n\n```java\nshowVisibleThings(((ContainerThing)\
    \ t).getThings());\n```\n\nIf I were to put the carrot into the bowl and I then\
    \ put the bowl into the sack, this method would display the following:\n\n| carrot\
    \ |\n| :--- |\n| tree |\n| sack |\n| bowl |\n\nSo, in effect, this code has let\
    \ me 'look inside' the sack to find the bowl and then it has looked inside the\
    \ bowl to find the carrot. It's actually even slightly cleverer than that. If\
    \ I close the sack and call the method again, it shows this:\n\n| tree |\n| :---\
    \ |\n| sack |\n\nIn other words, it shows all the objects which are 'visible'\
    \ to the player in the current location. I'll go through the code of this method\
    \ line by line to explain how it works.\n\n### A Primer on Recursion\n\nA recursive\
    \ function or method is one that calls itself.\n\n```java\nshowVisibleThings(ThingList\
    \ tl) {\n  for (Thing t : tl) {\n    showStr(t.getName());\n    if ((t instanceof\
    \ ContainerThing) && ((ContainerThing) t).isOpen()) {\n      showVisibleThings(((ContainerThing)\
    \ t).getThings());\n    }\n  }\n}\n```\n\nWhen I first call the showVisibleThings()\
    \ method, I pass to it the ThingList of the Room assigned to the player's location\
    \ variable:\n\n```java\nshowVisibleThings(player.getLocation().getThings());\n\
    ```\n\nThe showVisibleThings() method has a loop that iterates over all the things\
    \ in the ThingList tl and it shows the name of each thing:\n\n```java\nfor (Thing\
    \ t : tl) {\n  showStr(t.getName());\n}\n```\n\nImmediately after showing the\
    \ name of the thing, it does this test:\n\n```java\nif ((t instanceof ContainerThing)\
    \ && ((ContainerThing) t).isOpen()) {\n  showVisibleThings(((ContainerThing) t).getThings());\n\
    }\n```\n\nThis code tests if the Thing t is a ContainerThing (in which case it\
    \ will have its own ThingList) and it also tests if it is open (in which case,\
    \ any things 'contains' should be visible). If these tests succeed, the ThingList\
    \ of t is passed back to the same method:\n\n```java\nshowVisibleThings(((ContainerThing)\
    \ t).getThings());\n```\n\nIf I were to put the carrot into the bowl and I then\
    \ put the bowl into the sack, this method would display the following:\n\nSo,\
    \ in effect, this code has let me 'look inside' the sack to find the bowl and\
    \ then it has looked inside the bowl to find the carrot. It's actually even slightly\
    \ cleverer than that. If I close the sack and call the method again, it shows\
    \ this:\n\nIn other words, it shows all the objects which are 'visible' to the\
    \ player in the current location. I'll go through the code of this method line\
    \ by line to explain how it works.\n\n### How Recursion\n\nTo understand recursion\
    \ you need to know that when a function calls itself, a new frame is added to\
    \ the stack to store the internal details of that particular 'instance' of the\
    \ function.\n"
  mdcn: "\n\n## 第 9 章 – 重温面向对象编程\n\n由于 Java 是一种面向对象的语言，让我们看看代码是否可以以更面向对象的方式构建结构，并考虑这样做的优缺点。\n\
    \n到目前为止，`Game` 类一直是游戏中无所不能、无所不包的“神”。当用户输入查看查看或拿取某个游戏对象的命令时，是由游戏对象来完成所有工作的。它审视所有其他对象，就像棋手俯视棋盘上的棋子一样。\n\
    \n如果皇后吃掉一个兵，是由棋手执行这一操作的。如果玩家想拿一把剑，那么是由游戏对象执行该动作的。\n\n以这种方式实现游戏并没有错。然而，面向对象的核心思想之一是每个对象都封装了该对象所需的数据和行为。与其让游戏对象去取、丢弃或查看物品，不如让玩家去拿取、丢弃对象，或者查看它所在的房间可能更好。\n\
    \n在本章中，我将重写代码以使每个对象都更加“自包含”。首先，让我回到上一章末尾提出的问题——我如何找到位于一个或多个容器内部的对象？首先，看看我第一次尝试编写代码来显示当前房间内所有对象的情况：\n\
    \n### AdventureGame5 (Game.java)\n\n```java\nvoid showThings() { // 只显示列表中的“顶层”对象\n\
    ThingList tl = player.getLocation().getThings();\n for (Thing t : tl) {\n    showStr(t.getName());\n\
    }\n}\n```\n\n![](img/f210b6659f24a42b28725bec993abfc1_96_0.png)\n\n当游戏开始时，第一个房间包含这些对象：萝卜、树、袋子、碗。如果我调用\
    \ `showThingsInRoom()` 方法，我看到的是：\n\n```\ncarrot\ntree\nsack\nbowl\n```\n\n这看起来是对的。但假设我现在拿起萝卜把它放在碗里。然后我把碗放在袋子里。现在我再次调用\
    \ `showThingsInRoom()` 方法。我看到的是：\n\n```\ntree\nsack\n```\n\n它没有显示袋子内部的对象。这是因为我的代码只遍历了“顶层”\
    \ `ThingList` 中的项——即由 `Room` 拥有的列表。碗在袋子拥有的 `ThingList` 中，萝卜在碗拥有的 `ThingList` 中，因此它们都没有被显示。\n\
    \n### 寻找容器内部的物品\n\n这是我重写的方法：\n\n```java\nAdventureGame5 (Game.java)\nvoid visibleThings(ThingList\
    \ tl) {\n    for (Thing t : tl) {\n        showStr(t.getName());\n        if ((t\
    \ instanceof ContainerThing) && ((ContainerThing) t).isOpen()) {\n           \
    \ showVisibleThings(((ContainerThing) t).getThings());\n        }\n    }\n}\n\
    ```\n\n该方法递归地调用自己，因此当它发现一个 `ContainerThing` 时，它会将 `ContainerThing` 的列表传回给 `showVisibleThings()`：\n\
    \n```java\nshowVisibleThings(((ContainerThing) t).getThings());\n```\n\n如果我把萝卜放入碗中，然后将碗放入袋中，此方法将显示以下内容：\n\
    \n| carrot |\n| :--- |\n| tree |\n| sack |\n| bowl |\n\n所以，实际上，这段代码让我能够“查看”袋子内部以找到碗，然后“查看”碗内部以找到萝卜。它实际上比这还要聪明一点点。如果我关上袋子并再次调用该方法，它会显示这个：\n\
    \n| tree |\n| :--- |\n| sack |\n\n换句话说，它显示了玩家在当前位置所有“可见”的对象。我将逐行分析该方法的代码以解释它是如何运行的。\n\
    \n### 递归入门\n\n递归函数或方法是指调用它自身的函数。\n\n```java\nshowVisibleThings(ThingList tl) {\n\
    \  for (Thing t : tl) {\n    showStr(t.getName());\n    if ((t instanceof ContainerThing)\
    \ && ((ContainerThing) t).isOpen()) {\n      showVisibleThings(((ContainerThing)\
    \ t).getThings());\n    }\n  }\n}\n```\n\n当我第一次调用 `showVisibleThings()` 方法时，我将分配给玩家位置变量的房间的\
    \ `ThingList` 传递给它：\n\n```java\nshowVisibleThings(player.getLocation().getThings());\n\
    ```\n\n`showVisibleThings()` 方法有一个循环，遍历 `ThingList tl` 中的所有项，并显示每个物品的名称：\n\n```java\n\
    for (Thing t : tl) {\n  showStr(t.getName());\n}\n```\n\n在显示物品名称后，它立即执行了以下测试：\n\
    \n```java\nif ((t instanceof ContainerThing) && ((ContainerThing) t).isOpen())\
    \ {\n  showVisibleThings(((ContainerThing) t).getThings());\n}\n```\n\n这段代码测试\
    \ `Thing t` 是否为 `ContainerThing`（如果是，它将拥有它自己的 `ThingList`），并且还测试它是否打开（如果是，则任何“包含”的物品都应该是可见的）。如果这些测试通过，`t`\
    \ 的 `ThingList` 将被传回同一个方法：\n\n```java\nshowVisibleThings(((ContainerThing) t).getThings());\n\
    ```\n\n如果我把萝卜放入碗中，然后将碗放入袋中，此方法将显示以下内容：\n\n所以，实际上，这段代码让我能够“查看”袋子内部以找到碗，然后“查看”碗内部以找到萝卜。它实际上比这还要聪明一点点。如果我关上袋子并再次调用该方法，它会显示这个：\n\
    \n换句话说，它显示了玩家在当前位置所有“可见”的对象。我将逐行分析该方法的代码以解释它是如何运行的。\n\n### 递归原理\n\n要理解递归，你需要知道：当函数调用其自身时，栈上会添加一个新的帧，用以存储该函数特定“实例”的内部细节。\n\
    \n"
