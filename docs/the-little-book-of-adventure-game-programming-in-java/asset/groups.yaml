    # Chapter 8 – Restructuring the Game


    At some time in most programming projects of any size will need to rewrite and
    simplify your code to make it more modular and maintainable. That time has arrived
    for my game.


    ![](img/f210b6659f24a42b28725bec993abfc1_76_0.png)


    Restructuring and rewriting code may not sound very interesting. In fact, the
    most important developments are often made during the rewriting process. As you''ll
    see in this and succeeding chapters, my code revision not only results in a better
    game structure – with more encapsulated classes for clarity and maintainability
    – but it also reveals some deficiencies in my code which have forced me to rethink
    and substantially rewrite a number of methods.


    # Try, Test, Revise


    Writing a programs is a constant process of try-test-and-revise. Some revisions
    may be small. But every once in a while, it’s a good idea to take a long, hard
    look at the entire project and, if it can be better structured, then it is worth
    putting in the effort to undertake a major revision of your code. That’s what
    I will start to do in this chapter and'
