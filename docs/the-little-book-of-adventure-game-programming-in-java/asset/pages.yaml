  md: '# Chapter 12 – Creating the Game!


    Here you can exit from the east of Hydroponics North and enter via the east of
    Hydroponics South. But this is not a two-way connection. If you exit from the
    east of Hydroponics South you don''t go back to Hydroponics North. You go to Hydroponics
    Central. As you can see, the other exits and entrances are one-way only. A maze
    with sorts of connections can be fiendishly to navigate. If you create this sort
    of maze you may a) want to make it small (a few rooms) and b) warn the player
    that there is something very odd about the layout of the maze.


    You also need to provide some way in which the maze can be mapped. Maybe each
    room has a slightly different description or maybe the player needs to drop objects
    into each room to identify when it is next entered?


    Some players enjoy solving mazes for the fun of it. But a maze can also be used
    as part of some other puzzle. Maybe a lever has to be pulled at one end of the
    maze in order to activate the spaceship engine which is started by pressing a
    button at the other end of the maze. But this has to be done within ten minutes
    or the engine will become deactivated again. In order to get through the maze
    within ten minutes, the player needs to have mapped. Or there is a certain treasure
    at the center of the maze and it''s really hard to get to the center (and back
    out again) without making a map.


    # Collecting Treasures


    In some games, the goal is simply to amass a certain amount of wealth. When the
    player has acquired a certain value of treasure (which may need to be transported
    to a specific location such as a treasure chest), the final score is calculated.
    In this sort of game the player may be challenged to play the game more than once
    to try to achieve a higher score than previous.


    # Special-Purpose Objects


    Probably the commonest sort of puzzle is one that is solved using some special-purpose
    object. Maybe there is a locked room with a door that can only be opened using
    a specific key. But the key you need is inside a sealed container. You can only
    unseal the container by casting an ''unsealing spell''. The spell is on a scroll
    that is guarded by a Troll. Every time you try to get the scroll, the troll prevents
    you. Eventually you find a ham sandwich inside It turns out if you drop the ham
    sandwich in the troll room, the troll will go and eat it, leaving free to go and
    steal the scroll. Here are several locked puzzles. To solve the ultimate puzzle
    (getting into the locked room) you have to make use of several special-purpose
    objects: a key, a scroll and a ham sandwich. You will probably want to include
    quite a few multi-part puzzles in your game.


    168'
