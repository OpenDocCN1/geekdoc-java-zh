- pgno: 17
  md: '# Introduction


    # About the Author


    Huw Collingbourne is the author of the cult text adventure game, The Golden Wombat
    Of Destiny. Huw has been a programmer for more than 30 years. He is an online
    programming instructor with successful courses on C, C#, Java, Object Pascal,
    Ruby, JavaScript and other programming languages and topics. For a full list of
    available courses be sure to visit the Bitwise Courses web site: http://bitwisecourses.com/


    Huw is the author of The Little Book of Adventure Game Programming in C#, The
    Little Book Of C#, The Little Book Of Ruby and The Little Book Of Recursion from
    Bitwise Books. He is a well-known technology writer in the UK and has written
    numerous opinion and programming columns for a number of computer magazines, such
    as Computer Shopper, PC Pro, and PC Plus. At various times Huw has been a magazine
    publisher, editor, and TV broadcaster. He has an MA in English from the University
    of Cambridge and holds a 2nd dan black belt in aikido, a martial art which he
    teaches in North Devon, UK.


    ![](img/f210b6659f24a42b28725bec993abfc1_17_0.png)


    # About the Technical Editor


    Dr. Dermot Hogan is a software developer who has led major projects written in
    Assembly Language, C, C# and a number of other programming languages. A specialist
    in real time trading technologies, he has managed and developed global risk management
    systems for several international banks and financial institutions. He is the
    lead developer of the independent software company, SapphireSteel Software. He
    holds a Ph.D in physics from the University of Cambridge. His current area of
    research is devoted to robotic control and imaging systems.


    ![](img/f210b6659f24a42b28725bec993abfc1_17_1.png)'
