  md: '# Step 2 – Create Containers


    ```

    ContainerThing exampleContainer = new ContainerThing("exampleContainer",

    "example container"; Mass.SMALL);

    // optionally sets its attributes

    exampleContainer.setOpenable(true)

    exampleContainer.setOpen(false)

    exampleContainer.addAdjectives(new String[]{"small", "example"});

    ```


    ```

    // Lockable objects are also containers

    LockableThing cupboard = new LockableThing("cupboard"

    cupboard on the wall", Mass.MEDIUM, false, false, true, false, true, false);

    cupboard.setShow(false);

    ```


    # Step 3 – Generate Game Things (Treasures) and Generic Things (Scenery)


    ```

    GameThing exampleGameThing = new GameThing("exampleGameThing", "lovely thing",

    Mass.BIG, false, false);

    // optionally sets its attributes

    exampleGameThing.addAdjectives(new String[]{"lovely", "big", "shiny"});

    ```


    ```

    GenericThing lights = new GenericThing("lights",

    "flashing lights set into the walls", true);

    ```


    # Step 4 – Add Things to Containers


    ```

    exampleContainer.add(exampleGameThing);

    ```


    # Step 5 – Add Objects to Rooms


    ```

    exampleRoom1.addThing(exampleContainer);

    ```


    # Step 6 – Set Special Attributes (which may require other game objects)


    ```

    cupboard.canBeUnlockedWith(exampleGameThing);

    ```


    # Step 7 – Add Game Objects to things HashMap (Optional but Recommended)


    ```

    things = new HashMap<>();

    things.put("exampleGameThing", exampleGameThing);

    things.put("exampleContainer", exampleContainer);

    ```'
