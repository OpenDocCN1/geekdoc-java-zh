- pgno: 100
  md: '# Stack Frames


    A stack frame is a chunk of memory that I can represent using an index card, like
    this:


    ![](img/f210b6659f24a42b28725bec993abfc1_100_0.png)


    Every time a new function-call is made (whether that''s a regular function-call
    or a recursive function-call), a new chunk of memory is set aside to store the
    internal state of the running function. If you call a recursive function ten times,
    you''ll end up with a stack of ten stack-frames. I can think of that as like a
    stack of index cards:


    ![](img/f210b6659f24a42b28725bec993abfc1_100_1.png)


    When a function calls itself recursively, a new stack-frame is added to the stack
    for each function-call. That stack-frame stores the internal details of that particular
    ''instance'' of the function so that the values of its local variables and parameters
    are different from the values for each other frame in the stack. Just as I might
    write different values onto each index card.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Chapter 9 – Object Orientation Revisited


    Stack frames keep being added each time the function is called. When the function
    exits, the frame is taken off the stack and the frame ''beneath'' it in the stack
    (the function that was called prior to the one that just finished running) continues
    executing until it too exits and so on.


    The illustration below shows how a function called sum_recursion() might call
    itself recursively. Each time it calls itself, a new frame is added to the stack.
    When that instance of the function ends, the flow of execution returns to the
    line immediately following the function-call (in the frame below it in the stack)
    and so on...


    ```

    void sum_recursion(int n) {

    n += 1;

    total += 1;

    printf(""......");

    if (total < 3) {

    sum_recursion(n);

    }

    printf(""......");

    }

    ```


