  md: "# Chapter 7 — Saving Games\n\n# Saving Named Games\n\nIn the save and load\
    \ routines shown in this chapter, the player will only ever be able to save one\
    \ game file called Adv.sav. Whenever the \"save\" command is entered, the Adv.sav\
    \ file will be overwritten. It would clearly be better if the user were able to\
    \ save multiple different files and choose names for them.\n\nThen, when a game\
    \ is loaded, it would be possible to restore the game to its state at the time\
    \ when one of numerous game files were saved. Moreover, if a file with the specified\
    \ name already exists on disk, the user should ideally be asked if they wish to\
    \ overwrite that file.\n\nI will add these features later on. If you want a small\
    \ programming project to work on, however, you might want to see if you can code\
    \ these features now.\n\n# Save Game\n\nAt first sight, it may seem ridiculous\
    \ that one line of code is all that's needed to save the entire game including\
    \ the map, rooms, the treasures in the room, the player's position, any treasures\
    \ that the player has collected and so on.\n\nHow can one line of code do all\
    \ that want? In order to do that, we need to start by looking at the object oos.\
    \ This is created in my saveGame() method which you'll find in the file AdventureGame3.java\
    \ in the AdventureGame3 project:\n\n> AdventureGame3 (AdventureGame3.java)\n\n\
    ```\nprivate static void saveGame() {\n  try {\n    FileOutputStream fos = new\
    \ FileOutputStream(\"Adv.sav\");\n    ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
    \    oos.writeObject(game);\n    oos.flush();\n    oos.close();\n    System.out.print(\"\
    Game saved\\n\");\n  } catch (Exception e) {\n    System.out.print(\"Serialization\
    \ Error! Can't save data.\\n\" \n    + e.getClass() + \":\" \" + e.getMessage()\
    \ + \"\\n\");\n  }\n}\n```"
