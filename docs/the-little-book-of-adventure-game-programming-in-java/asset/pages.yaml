  md: '# Chapter 10 — Maps, Mazes and Mazes


    When a container contains other containers, I clearly need to calculate the total
    mass of each ''nested'' or ''inner'' container in the same way that I calculated
    the total mass of the outer container. If I have many nested levels of container
    – one inside inside another – I would need to carry on doing the calculations
    for however many containers there happen to be.


    # Massive Recursion!


    This may remind you of a problem we grappled with in Chapter 9, when the code
    had to dig down through an unknown number of nested containers to work out which
    objects are "visible" and can therefore be considered to be "here". I solved that
    problem with recursion, and as you''ll see, I will solve the total mass problem
    in a similar way.

    TheMass() method in ContainerThing is really simple: it adds together the mass
    of the container object, given by getMass() to the mass of all the objects it
    contains, given by contentsMass():


    | Starcrash-beta (ContainerThing.java) |

    | --- |

    | public int totalMass() { return this.getMass() + contentsMass(); }


    The contentsMass() method is also very simple. It iterates over a linear list
    of all the things that the current ContainerThing contains, t1, gets the mass
    value of each of t.getMass(), and adds that value to an int variable, countmass:


    | Starcrash-beta (ContainerThing.java) |

    | --- |

    | public int contentsMass() { List t1; int countmass; t1 = flatten(); countmass
    = 0; for (Thing t : t1) { countmass += t.getMass(); } return countmass; } }


    So far, there has been no recursion. But where, you may wonder, do I get the linear
    list, t1, from? The t1 list needs to contain all the things in the List of the
    current ContainerThing object plus the things in any other ContainerThing objects
    that may be in'
