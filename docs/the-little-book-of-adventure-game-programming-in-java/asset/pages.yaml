- pgno: 123
  md: '# Chapter 10 — Maps, Mazes and Masses


    huge, plant-filled room. When you wander through it, So, you don''t just exit
    and enter as you would have walked through a door. So, here, for example, if you
    go east from Hydroponics North you enter to the east of Hydroponics Central. In
    my map, you can also go back that way (when you exit to the east of Hydroponics
    Central you then enter at the east of Hydroponics North) but if you wanted to
    make the map even harder to navigate you could opt to make some exits one-way.


    # Mazes


    Rooms that join up in odd ways like my three Hydroponics rooms may be used to
    represent locations that don''t form a regular matrix – for example, forests in
    which the paths ''meander'' irregularly rather than fixed N, S, W, E exits. Or
    they may represent locations that connect via twisty little passages that do all
    join up in neat, well-defined directions.


    In this way, you can create difficult-to-navigate mazes from a fairly small number
    of rooms. These mazes will be especially difficult to navigate if each room has
    the same name or description as ''corridor'' or ''You are in a maze of twisty
    little passages, all alike.'' In fact, the latter description was famously used
    in the ''original adventure'' or Colossal Cave written in the mid-1970s by Will
    Crowther. This is an extract from that game...


    +   > south

    You are are in a maze of twisty little passages, all alike.

    > east

    You are are in a maze of twisty little passages, all alike.

    > south

    You are are in a maze of twisty little passages, all alike.

    > south

    You are are in a maze of twisty little passages, all alike.


    A maze can become part of a puzzle. The user needs to get somewhere and back again
    in a specific number of moves in order to perform some action such as pulling
    the lever that deactivates the bomb. This is almost impossible unless the maze
    is mapped. One way of mapping a maze is by dropping objects into rooms. When the
    player comes back to the room with a carrot in (for example), that room could
    be drawn on a sheet of paper and labelled ''carrot room''. By checking each of
    its exits leads, dropping other objects in other locations, the player will gradually
    be able to reconstruct the map that the programmer used when designing the maze.


