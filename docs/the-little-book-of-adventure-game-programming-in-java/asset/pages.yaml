  md: '# Overriding Methods


    When you override a method in C# (that is, when you create a new implementation
    of a method that already exists in an ancestor class, you must define the ancestor
    method using the virtual keyword and the descendant method using the override
    keyword. In Java, methods with the same names as those in ancestor classes are
    overridden by default. No keywords are needed though you may optionally place
    the @override annotation before an overridden method so that the compiler can
    do additional error checking. This is explained in Chapter 5.


    # Partial Classes


    In C# a partial class is a class that is divided up across multiple code files.
    This makes it possible to write quite long classes containing many methods while
    keeping each source file fairly short. Partial classes don''t exist in Java. I''ve
    explained one possible way of achieving a similar (up to a point!) effect Chapter
    8.'
