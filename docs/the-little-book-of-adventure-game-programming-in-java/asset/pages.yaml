  md: '# Chapter 1— Communicating with the Game


    It is static which means that it ''belongs'' to a class rather than to an object
    created from a class. This allows this function to be run without having to create
    an object first. It doesn''t return any data so it is declared to be void.


    The main() function takes an array of string arguments args which may be initialized
    with arguments passed to the program from the command line. We don''t need to
    pass any arguments in this case but we still need to declare the args parameter.


    The function has been declared to throw an exception (an error object) of the
    type IOException. This is required by the readLine() method which is called from
    within this function. In principle, you could write some code to handle the exception
    (if an error occurs) but we don''t need to do that here. Even so, main() must
    declare throws IOException because it didn''t do so, the code would not compile.


    # Buffered Reading


    Next comes this declaration:


    ```

    BufferedReader in;

    ```


    I''ve declared a variable called in which is a BufferedReader object. This is
    an object that is used to read text from a character-input stream (which might
    be a file on disk, example, or might, as here, be entered at a prompt). It reads
    characters into a buffer which makes it more efficient when dealing with characters,
    arrays and lines of text.


    # What is a Buffer?


    A buffer is an area of temporary storage in memory. A program might read a fairly
    large chunk of data into a buffer and then process the individual characters or
    bytes by reading them from this buffer rather than reading them one by one from
    a file on disk. This can speed up the processing of data since memory access is
    much faster than disk access.


    Then I declare this variable:


    ```

    String input;

    ```'
