  md: "# Chapter II – Adjectives to Describe Things\n\nTo match a Thing that corresponds\
    \ to a description entered by the user I need to match the noun (and adjectives,\
    \ if present) stored in a NounPhrase object with the name (and adjectives, if\
    \ defined) of a Thing object. These two methods of Thing handle this:\n\n```\n\
    Starscarch (Thing.java)\nprivate boolean adjectivesMatch(Array<String> someAdjectives)\
    \ {\n    boolean ok = true;\n\n    for (String a :someAdjectives) {\n        if\
    \ (adjectives.contains(a)) {\n            ok = false;\n        }\n    }\n    return\
    \ ok;\n}\n\npublic boolean matchThing(NounPhrase np) {\n    boolean match = false;\n\
    \n    if (np.getName().equals(np.getWord()) && adjectivesMatch(np.getAdjectives()))\
    \ {\n        match = true;\n    }\n    return match;\n}\n```\n\nThe matchThing()\
    \ method is called from the findThingInAnyList() method of the ThingHolder class,\
    \ which is the method that recursively searches for objects in a list. For example,\
    \ it will try to find an object in the player's inventory if that object is inside\
