  md: "# Inheritance\n\nIt is a basic principle of object orientation that simple\
    \ classes should contain data (variables) and behaviour (methods) that are common\
    \ to other, more specialist classes. Those more specialist classes can inherit\
    \ the features of the simple class and add additional features as required. A\
    \ class that inherits features of another class may be called a descendant class\
    \ or a subclass. The class from which it inherits may be called ancestor class\
    \ or a superclass. Multiple levels of ancestors and descendants form a sort of\
    \ family tree or 'class hierarchy'.\n\nI make the Actor class a descendant of\
    \ the Thing class. In Java, the way to do that is to place the keyword extends\
    \ between the name of a class and the name of its ancestor class like this:\n\n\
    ```\npublic class Actor extends Thing {\n\n```\n\nThis shows that my Actor class\
    \ is a descendant of the Thing class. The Thing class already has a name and a\
    \ description (both the variables and the get/set methods needed to access them)\
    \ so the Actor class doesn't need to re-code those. It automatically inherits\
    \ them from Thing. I now add on the extra features needed by an Actor object.\
    \ Currently that is just location — the Room that defines the Actor object's current\
    \ position:\n\n| AdventureGame1(Actor.java) |\n| public class Actor extends Thing\
    \ {\n| private Room location; // the Room where the Person is at |\n| public Actor(String\
    \ aName, String aDescription, Room aRoom) {\n| super(aName, aDescription); //\
    \ init super class \n| location = aRoom;\n}|\n| public void setLocation(Room aRoom)\
    \ {\n| location = aRoom;\n}|\n| public Room getLocation() {\n| return location;\n\
    }|\n} |"
