  md: "# Chapter 11 – Adjectives to Describe Things\n\nIn order to deal with noun-phrases\
    \ my parser needs to do a second-pass. In the first pass (as before) it decomposes\
    \ the string entered by the user into individual words categorised according to\
    \ their grammatical type – noun, verb and so on. In the second pass it creates\
    \ grammar units. A grammar unit may contain a single word or a group of words\
    \ that ‘work together’. In a noun-phrase the adjectives work together with the\
    \ noun to describe an object.\n\n# Other Grammar Units?\n\nYou could define other\
    \ multi-word grammar units such as verb-phrases that include zero or more adverbs\
    \ so that “Quickly take” or “Gently pull” would be accepted as verb-phrases. In\
    \ my long experience of playing adventure games, however I have not found much\
    \ cause to use adverbs – I don’t think many players would bother using them either\
    \ – so I would not defining verb-phrases. But you could do so if you wanted.\n\
    \nIn the Starcrash project I defines a class called GrammarUnit which contains\
    \ a string field, word:\n\n| Starcrash (GrammarUnit.java) |\n| public class GrammarUnit\
    \ implements java.io.Serializable {\n  private String word;\n\n  public GrammarUnit(String\
    \ aword) {\n    word = aword;\n  }\n\n  public String getWord() {\n    return\
    \ word;\n  }\n} |\n\nI’ve created these descendant classes: Verb, Preposition\
    \ and NounPhrase. The Verb and Preposition classes are extremely simple. They\
    \ just have constructors that pass a string to be initialized by GrammarUnit:\n\
    \n| Starcrash (Verb.java) |\n| public class Verb extends GrammarUnit implements\
    \ java.io.Serializable {\n  public Verb(String aword) {\n    super(aword);\n \
    \ }\n} |\n\n137"
