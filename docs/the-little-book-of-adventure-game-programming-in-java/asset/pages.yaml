- pgno: 14
  md: 'Explanatory notes (which generally provide some hints or give a more in-depth
    explanation of some point mentioned in the text) are shown like this:


    # This is a Note


    This is an explanatory note. You can skip it if you like – but if you do so, you
    may miss something of interest...!


    # Download the Source Code


    All the source code shown in this book is available for download. Just sign up
    to our mailing list and we will send you the download link: www.bitwisebooks.com/subscribe


    # Install Java


    This book assumes that you already have Java installed. If not, you may download
    Java from: https://www.java.com/


    There are two components needed in developing Java – the Java Runtime Environment
    or JRE and the Java Development Kit (the compiler and libraries) or JDK. You must
    install the JDK. If you install the JDK, the JRE is usually installed as well.


    # Which IDE?


    You can load the source code into any programming editor that supports Java syntax.
    The projects were developed using the NetBeans IDE. If you are unsure which IDE
    to use, I recommend using NetBeans. This code has been tested in NetBeans 8.2
    from NetBeans.org and in NetBeans 11.3 from Apache.org. Some people (myself included)
    prefer the older (8.2) version of NetBeans because it is a bit simpler to use.
    But if you want the newest release, then you should install the latest stable
    build from Apache. To install NetBeans, download one of the ready-to-run installation
    programs from one of these sites.


    ```

    https://netbeans.org/

    https://netbeans.apache.org/

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Using NetBeans


    While you don''t have to use NetBeans in order to write and run Java adventure
    games, I will occasionally show all the steps you need to follow in order to create
    files and ''projects'' using NetBeans. I therefore recommend that you use NetBeans
    to load, edit and run the sample code that accompanies this book.


    # Loading and Running Programs in NetBeans


    If you are using NetBeans can load a project from the source code archive just
    by selecting File, Open Project and navigating to the directory containing the
    NetBeans project file (this will be indicate by a little coffee-cup icon in the
    project-browse dialog) then select the project and click the Open Project button.
    If you already have a project open in NetBeans the new project will be loaded
    inbuilt in the Projects window.

    To compile and run a project, first make sure the project is selected in the Projects
    then select Run from the Run menu or press the green arrow-head button in the
    NetBeans toolbar.


    # Compiling and Running Programs from the System Prompt


    If you have properly installed Java, you can go to the system prompt or Terminal
    in order to compile and run programs. You must be sure that the Java compiler
    java.exe and the java application launcher java.exe are on the system path so
    that they can run from any directory. To verify this opens a system prompt and
    type these


    ```

    javac

    java

    ```


    In both cases, some lines of help text could be displayed. If, on the other hand,
    you see an error message telling you that the command is not recognised or a program
    with name cannot be found, you need to add the directory containing those programs
    to your system path. For example, on Windows 10, you could open Windows Settings,
    search for "path" in the search box. Click the link to edit system variables.
    In the dialog box, click Edit system environment variables, then click Environment
    Variables. In the System Variables list, select Path then click Edit. Click New.
    Now add the full path to the directory containing java.exe and javac.exe. For
    example, on my PC this is:'
  merge: -1
  img_proc: true
