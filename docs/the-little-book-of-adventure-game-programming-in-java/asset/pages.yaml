    \ Error! Can't load data.\\\\n\");\n    System.out.print(e.getClass() + \" : \"\
    \ + e.getMessage() + \"\\n\");\n  }\n}\n```\n\n# Streams\n\nYou can see that both\
    \ the save() and the loadGame() methods use of various types of 'stream'. So what\
    \ is a stream? In essence, a stream is just a series of bytes. It may be used\
    \ to move data from one place to another – here from memory to disk when saving\
    \ and from disk to memory when loading a game.\n\n![](img/f210b6659f24a42b28725bec993abfc1_72_0.png)\n\
    \n# File IO Streams\n\nJava provides special of stream depending on the sort of\
    \ data that needs to be stored in the stream. Here, I need a FileOutputStream\
    \ to save the data and a FileInputStream to load the data, passing to each of\
    \ these streams the name of a file:"
