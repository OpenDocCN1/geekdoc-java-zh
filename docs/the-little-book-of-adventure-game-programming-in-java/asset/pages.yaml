  md: '# Chapter 6 – Taking and Dropping Things


    One of the fun things that the player of an adventure game can collect treasures.
    In order to do that we have to program some way of taking and dropping objects.


    In just about all the classic text adventure games, the player moves around the
    game world stealing things that happen to be lying around. That means, we need
    a way for the player to take and drop things.

    Taking and dropping objects is, in fact, easy to program. That''s because I''ve
    already created a ThingList class to maintain lists of Thing objects and a Thingholder
    class that contains a ThingList.

    Both the player and the rooms are Thingholder objects so to take an object from
    a room I just to remove that object from the Room''s ThingList and add it to the
    player''s ThingList.

    To drop an object, I do the reverse. In other words, to take or drop an object
    I have to transfer that object from one list to another. When taking, I transfer
    it from inventory. When dropping, I transfer it from inventory to room.


    ![](img/f210b6659f24a42b28725bec993abfc1_64_0.png)


    ```

    You are in the Troll Room. A dank room that smells of troll.

    Things here:

    ccarrot: It is a very crunchy carrot


    > take carrot

    ccarrot taken!

    > drop carrot

    ```


    In AdventureGame3 you can take and drop objects'
