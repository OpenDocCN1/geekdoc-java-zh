    \ description, which will contain a\ndescription of the room. This is the simplest\
    \ possible version of this class – which I've\nnamed SimpleRoom:\n\n```\npublic\
    \ class SimpleRoom {\n    public String name;\n    public String description;\n\
    \    public int n;\n    public int s;\n    public int w;\n    public int e;\n\
    }\n```\n\nThe variables are all public which means that when I create a Room object,\
    \ I can assign\nvalues to the variables like this:\n\n```\nsr = new SimpleRoom();\n\
    sr.name = \"Troll Room\";\nsr.description = \"a dank room that smells of troll\"\
    ;\nsr.n = -1;\nsr.s = 2;\nsr.w = -1;\nsr.e = 1;\n```\n\nBut while using public\
