  md: "# Chapter 10 – Maps, Mazes and Masses\n\nHowever, if you give a little thought\
    \ to this, you'll soon realise that just adding and subtracting the mass of the\
    \ object in this way is too simplistic. What if there is a sack that contains\
    \ a box and the box contains a full set of kitchen furniture?\n\nThe total mass\
    \ could be huge — far more than the player should be able to carry – but the mass\
    \ of the outermost container (the sack) is so. So if I only use the mass of the\
    \ object that the player tries to take (here, the mass of just the sack) in my\
    \ calculations, the player will soon be able to carry around a huge number of\
    \ ridiculously big and heavy objects, as long as they are inside other containers.\n\
    \n# The Reticule Effect!\n\nYou could deliberately allow a tiny container to hold\
    \ a huge mass of objects either as a joke or as part of the solution to a puzzle\
    \ Infocom did this in the pirate adventure game Plundered Hearts where a tiny\
    \ reticule (purse) was capable of containing vast quantities of treasures.\n\n\
    In my game, I don't plan to allow small containers to hold ridiculous amounts\
    \ of swag. That's why I use a variable called tmass which stores the 'total mass':\n\
    \n```\nStarmarch-beta (Actor.java) - drop()\ntmass = t.totalMass();\n```\n\nI\
    \ assign to tmass the total mass of an object and (when necessary) everything\
    \ it contains. When that object is a container, the total mass includes the mass\
    \ of the object and all its contents (including the contents of any other containers\
    \ inside the outer container). How do I calculate the total mass? The total mass\
    \ of most things is straightforward. It's the same as the mass of the thing itself:\n\
    \n```\nStarmarch-beta (Thing.java)\npublic int totalMass() {\n    return mass;\n\
    }\n```\n\nIt's more complicated for a ContainerThing which could be empty (in\
    \ which case its total mass is the same as its mass), it could contain one or\
    \ more things (in which case its total mass is its mass plus the mass of things\
    \ it contains), it could contain some things (in which case its total mass is\
    \ its mass plus the mass of the things it contains plus the mass of the things\
    \ that they contain)."
