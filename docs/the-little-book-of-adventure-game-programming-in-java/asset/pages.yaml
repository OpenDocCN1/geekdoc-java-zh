  md: "# Chapter 11 — Adjectives to Describe Things\n\nEven though some of these may\
    \ look fairly complicated, this is mainly due to all the checking to resolve potential\
    \ ambiguities. The fundamental coding techniques are similar in all the methods.\n\
    \n# Object Attributes\n\nIn order to be match adjectives entered by the user with\
    \ actual objects in the game I've had to add an ArrayList to the Thing class:\n\
    \n```\nStarcrash (Thing.java)\nprivate ArrayList<String> adjectives;\n```\n\n\
    The elements in this list can be thought of as the 'attributes' of the Thing object\
    \ — they tell us that one is \"small\" and \"gold\" whereas another is \"silver\"\
    \ and \"big\". By default the adjectives list is empty. Not all Thing objects\
    \ in the game will need to have adjectives associated with them. When I want to\
    \ add adjectives to a Thing I call the addAdjectives() method which uses the addAll()\
    \ method of the Java Collections to add to the entire list:\n\n```\nStarcrash\
    \ (Thing.java)\npublic void addAdjectives(String[] someAdjectives) {\n  Collections.addAll(adjectives,\
    \ someAdjectives);\n}\n```\n\nI also have a set accessor to assign to a list:\n\
    \n```\npublic void setAdjectives(ArrayList someAdjectives) {\n  this.adjectives\
    \ = someAdjectives;\n}\n```\n\nBear in mind that setAdjectives() will replace\
    \ an existing list where addAdjectives() add to an existing list. At the time\
    \ of creating the game (when the lists are empty), I can call either method. The\
    \ setAdjectives() method takes an ArrayList argument while the addAdjectives()\
    \ method takes an array of strings. They are called like this:\n\n```\nStarcrash\
    \ (GameData.java)\ngoldRing.addAdjectives(new String[]{\"small\", \"gold\"});\n\
    silverRing.setAdjectives(new ArrayList<>(Arrays.asList(\"small\", \"silver\\)));\n\
    ```\n\n149"
