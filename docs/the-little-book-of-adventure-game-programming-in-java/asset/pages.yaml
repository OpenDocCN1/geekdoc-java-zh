  md: "# Adjectives\n\nThis method starts by calling getAdjectives() to try to find\
    \ some adjectives:\n\n```\nprivate ArrayList<String> getAdjectives(WordAndType\
    \ wt) {\n    ArrayList<String> adjectives = new ArrayList<>();\n    boolean loop\
    \ = true;\n\n    while (loop) {\n        if (wt == null) {\n            loop =\
    \ false;\n        } else if (wt.wordtype() == WT.ADJECTIVE) {\n            adjectives.add(wt.getWord());\n\
    \            rest.remove(wt);\n            wt = getNextElement();\n        } else\
    \ {\n            loop = false;\n        }\n    }\n    return adjectives;\n}\n\
    ```\n\nIt keeps looping through the WordAndType elements in rest, and as long\
    \ as the type is ADJECTIVE, it adds the word to the adjectives list. When there\
    \ are no more adjectives the loop ends and the list of adjectives is returned.\
    \ If there are no adjectives at all, the loop fails on the first pass and an empty\
    \ list is returned.\n\n# Nouns\n\nThe addNounPhrase() method now tries to find\
    \ the noun. If the adjectives list is empty, the noun will be the only word in\
    \ the NounPhrase object. If the adjectives list is not empty, the addNounPhrase()\
    \ method gets the next element from rest which should be the noun:\n\n```\nif\
    \ (adjectives.isEmpty()) {\n    noun = getNoun(nextWT);\n} else {\n    nextWT\
    \ = getNextElement();\n    noun = getNoun(nextWT);\n}\n```\n\nNotice, by the way,\
    \ I've written a method to get the next element from the rest list and this returns\
    \ null if there are no more elements to be processed:"
