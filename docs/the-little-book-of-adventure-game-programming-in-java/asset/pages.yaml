  md: "# Conditional Debug Directives\n\nWhen developing all this recursive code I\
    \ find it useful to display a great deal of quite verbose diagnostic information\
    \ that's useful to find and fix bugs.\n\nSome programming languages, such as C#,\
    \ provide 'conditional compilation' directives that let you selectively omit chunks\
    \ of code when compiling your program.\n\nThis is incredibly handy when you want\
    \ to run some code when you are debugging but omit that code from the final program.\n\
    \nJava doesn't have conditional compilation directives but you can achieve a similar\
    \ effect by defining a simple class with constants as I have in the Starcrash-beta\
    \ project:\n\n| Starcrash-beta (Debug.java) |\n| public class Debug {\n public\
    \ static final boolean ON = true;\n } |\n\nI can now test the value of the constant\
    \ ON and create a block to enclose my debugging code like this (here debugTakeDrop())\
    \ is a method that displays lots of debugging output:\n\n| Starcrash (Actor.java)\
    \ - drop |\n| if (Debug.ON) {\n ct = toContainerThing(t);\\ ns += debugTakeDrop(t,\
    \ tmass, ct != null);\n } |\n\nI can put similar debugging blocks throughout your\
    \ code. When I'm ready to compile the finished game, I can turn off all the diagnostic\
    \ output simply by editing the value of the ON in the Debug class:\n\n```\npublic\
    \ static final boolean ON = false;\n```"
