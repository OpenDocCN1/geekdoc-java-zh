- pgno: 189
  md: '# Appendix


    # # BIFF – The Bitwise Interactive Fiction Framework


    The Bitwise Interactive Fiction Framework (‘BIFF’) is work in progress. Be sure
    to keep up to date with developments.


    Since the code defining my specific game, Starcarash, largely depends on just
    two files – GameData.java and VocabularyData.java, in the game.data package –
    the rest of the code may be easily used to implement totally different adventure
    games.


    In other words, the code provides a ‘framework’ for adventure game development.
    I’ve called the framework BIFF, The Bitwise Interactive Fiction Framework. I’m
    making this code available to other programmers. You are free to use it and modify
    it for your personal use or even for commercial development. All I ask is that
    you retain your copyright information in the code files:


    +   * This code (and other sample code) accompanies the book

    * "The Little Book of Adventure Game Programming In Java"

    * Source code can be downloaded from:

    * http://www.bitwisebooks.com


    As long as you do that, the code is yours to use as you wish. I shall continue
    to add extra features to BIFF and I shall inform subscribers to my email list
    when new releases of the framework are available. To keep up to date with developments,
    please join my mailing list:


    ```

    http://www.bitwisebooks.com/subscribe

    ```


    So now’s your chance to write your own interactive fiction. I look forward to
    exploring your adventures in future!


    Good luck – and good programming!


    Huw Collingbourne'
