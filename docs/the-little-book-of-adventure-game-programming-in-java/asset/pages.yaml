  md: '# Chapter 9 — Object Orientation Revisited


    Wouldn''t it be better, you might think, to have actual Room objects in the map?
    when the player wanted to move South from the Troll Room, the go() method would
    return adjoining Room at the southern exit from the Troll Room.


    Using actual Room objects as the exits helps make the player more autonomous –
    like a software robot that performs its own actions rather than a chess-piece
    which requires some external output such as the game-player or the game, to move
    from place to place. But there are some downsides. For one thing, the links between
    objects can quickly create a complex network of objects (which can make debugging
    quite tricky). And you also need to take care that you create and initialize rooms
    in the correct order.


    When adding Room objects as fields (the exits) of other Room objects, you will
    need to create and initialize each Room in two distinct steps. First you must
    create ''empty'' Room objects. Then you must initialize each Room, assigning other
    Room object to the exit variables. You can place Room objects at exits in a single
    step (during the construction of those objects) because all Room objects need
    to have been created before they are assigned to the exit variables. This is how
