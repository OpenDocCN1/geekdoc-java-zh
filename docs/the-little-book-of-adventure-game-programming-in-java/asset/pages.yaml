  md: "# Flattening Branching Lists\n\nThis is how I “flatten” a list containing other\
    \ lists:\n\n```\nStarcrash-beta (ThingHolder.java)\nThingList flatlist = new ThingList();\n\
    \nprivate ThingList thingsToFlatten(ThingHolder th) {\n    for (Thing t : th.getThings())\
    \ {\n        flatlist.add(t);\n        if (t instanceof ContainerThing) {\n  \
    \          thingsToFlatten((ContainerThing)t);\n    }\n    }\n    return flatlist;\n\
    }\n\npublic ThingList flatten() {\n    flatlist.clear();\n    return thingsToFlatten(this);\n\
    }\n```\n\nThis builds a list of objects by adding every object in a list to the\
    \ ThingList flatlist. If one of those objects is a ContainerThing, the function\
    \ thingsToFlatten calls itself recursively, passing the ContainerThing object\
    \ as an argument in order that any objects in that container’s list are also processed\
    \ and added to flatlist.\n\nIn addition to making sure the player can't create\
    \ an infinite number of massive items, it also makes sense to make sure that a\
    \ container can't hold impossible numbers of objects. For that reason, I've added\
    \ the int container_volume field to the ContainerThing class. This pair of methods\
    \ calculate the mass of a container’s contents (once again using flatten() to\
    \ create a list):\n\n```\nStarcrash-beta (ContainerThing.java)\npublic int contentsMass()\
    \ {\n    ThingList tl;\n    int countmass;\n\n    tl = flatten();\n    countmass\
    \ = 0;\n    for (Thing t : tl) {\n        countmass += t.getMass();\n    }\n \
    \   return countmass;\n}\n```"
