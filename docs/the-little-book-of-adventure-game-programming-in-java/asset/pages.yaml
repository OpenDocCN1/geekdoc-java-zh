  md: "# Chapter 8 — Restructuring the Game\n\nThe parser itself has been substantially\
    \ changed in this revision. Up to now, I maintained two lists of words — one called\
    \ commands for the verbs and one called objects for the nouns. I now want to add\
    \ other categories of words such as articles and prepositions. I've decided that\
    \ instead of having separate lists for each type of word, it would be better to\
    \ have a single list in which each word is categorised according to its grammatical\
    \ type. In other words, I need a dictionary.\n\n# HashMap\n\nJava's HashMap class\
    \ implements the sort of dictionary I. It lets me create lists of key-value pairs\
    \ in which the key (here a string as \"carrot\") acts as an index into the dictionary\
    \ and can be used to retrieve the associated value (here a WT constant as WT.NOUN).\
    \ This is the HashMap which I called vocab. The keys are the words that the game\
    \ understands and the values are the grammatical types of words:\n\n![](img/f210b6659f24a42b28725bec993abfc1_88_0.png)\n\
    \n```\nstatic void initVocab() {\n  vocab.put(\"bone\", WT.NOUN);\n  vocab.put(\"\
    button\", WT.NOUN);\n  vocab.put(\"carrot\", WT.NOUN);\n  vocab.put(\"chest\"\
    , WT.VERB);\n  vocab.put(\"cut\", WT.VERB);\n  vocab.put(\"inventory\", WT.VERB);\n\
    \  vocab.put(\"take\", WT.VERB);\n  vocab.put(\"drop\", WT.VERB);\n  vocab.put(\"\
    a\", WT.ARTICLE);\n  vocab.put(\"an\", WT.ARTICLE);\n  vocab.put(\"the\", WT.ARTICLE);\n\
    \  vocab.put(\"in\", WT.PREPOSITION);\n  vocab.put(\"into\", WT.PREPOSITION);\n\
    \  vocab.put(\"at\", WT.PREPOSITION);\n}\n```\n\n# HashMap or Dictionary?\n\n\
    Java also has a Dictionary class but it is documented as being 'obsolete'. HashMap\
    \ is one of a number of classes that implement the Map<K, V> interface where K\
    \ is a key and V is a value. These Map classes are now recommended when you need\
    \ a dictionary.\n\nYou can add words that your game requires by placing them as\
    \ key-value pairs in my vocab HashMap. These key-value pairs are added to vocab\
