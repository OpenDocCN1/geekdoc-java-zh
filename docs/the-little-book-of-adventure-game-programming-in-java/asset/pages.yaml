    \ them. This makes it possible to change what happens when an object is made to\
    \ get or set the value of a variable. In Oriented terminology, a 'method-call'\
    \ can be thought of as a message that is sent to an object. The message is a request\
    \ to the object to do something. It is up to the object to respond to that request.\
    \ In your Room, for instance, a call to setS(100) is a request to set the value\
    \ of s to 100. The setS() method refuses to do that, however.\n\n# Data Hiding\n\
    \nWrapping up data – the internal fields and variables – along with the functions\
    \ or methods that act upon data is often termed ‘encapsulation’. When you make\
    \ the data private, that’s called data-hiding.\n\n![](img/f210b6659f24a42b28725bec993abfc1_35_0.png)"
