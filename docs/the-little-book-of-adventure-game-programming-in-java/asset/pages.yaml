    \ to the doDescribeThings() method. Previously always it described the contents\
    \ of containers. But sometimes that spoils a puzzle. For example, in my game,\
    \ a key is hidden inside a pitcher plant. But I want the player to find that key\
    \ by looking into the plant. So I don't want this description when the player\
