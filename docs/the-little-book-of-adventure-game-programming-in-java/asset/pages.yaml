    # The Serializable Interface


    In order for serialization to work, there is one other thing I have to do. Every
    class that wants to be serializable needs to implement the java.io.Serializable
    interface. This informs Java that objects of this class are available for serialization.
    If you attempt to serialize objects whose classes do not implement the Serializable
    interface, an exception of the type NotSerializableException will be thrown.


    # What is the Serializable Interface?


    Usually, Java interfaces define methods whose code must be written in any class
    that implements that interface. For example, the List interface defines add()
    and remove() methods. Classes that implement List must include code for those
    methods. The Serializable interface, however, doesn''t define any methods. Its
    only purpose is to identify classes that are available for serialization. When
    a class implements java.io.Serializable it is, in effect, ''marked'' as being
    available for serialization.


    And that''s all there is to it. You now have a basic game framework that lets
    you create maps of linked rooms with treasures that the player can collect. And
    you can save and restore your games using serialization. There''s still plenty
    more to be done before we go any further, I think it''s time to take a close look
    at the code of the game and restructure it to make sure that it is clear, modular
    and maintainable when we carry on developing what could eventually become a very
    large and complex program.


    # Try it out


    To try out the saving and loading features, run AdventureGame3, take some objects,
    move to other rooms, drop objects, then save. Now carry on taking, dropping and
    moving. Then load the game you saved earlier. The saved game state will be restored'
