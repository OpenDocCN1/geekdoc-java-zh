- pgno: 18
  md: '# # Chapter I– Communicating with the Game


    The player will communicate with the game by entering English language commands
    such as "take the sword". So the first thing we need to do is make the game understands
    those commands.


    ```

    Copyright (c) 1981, 1982 Infocom, Inc. All rights reserved.

    ZORK is a registered trademark of Infocom, Inc.

    Revision 08 / Serial number 849726

    West of House

    You are standing in an open field west of a white house, with a boarded door.

    There is a small mailbox here.

    Open mailbox

    Opening the small mailbox reveals a leaflet.

    Take leaflet

    Taken.

    Read the leaflet

    WELCOME TO ZORK!

    ZORK is a game of adventure, danger, and low cunning. In it you will explore some
    of the most amazing territory ever seen by mortals. No computer should be without
    one!>

    ```


    Infocom''s *Zark* (shown above) is one of the most famous and influential games
    ever written. This is how it begins:


    You are standing in an open field west of a white house, with a boarded door.
    There is a small mailbox here.


    Naturally, the first thing the player wants to do is open the mailbox and take
    a look inside, then exploring inside the house and around the countryside. This
    is done by entering text commands such as "open mailbox" and "take leaflet". By
    the end of this book, our games will be able to understand complicated commands
    such as "Put the small silver dagger into the big wooden box." But in this chapter
    we''ll start simple – with commands such as "take sword" and "drop ring"'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# What, No User Interface?


    In my book on programming adventure games in C#, I began designing a windows user
    interface with buttons that had to be clicked in order to send commands to the
    game. That was because C# development is done with Visual Studio which has an
    integrated visual designer. The final project in book explained how to create
    a game from a command prompt just like a traditional text adventure. While you
    could create a similar interface in Java (using, for example the JavaBeans), in
    this book I''ve decided to create a command-line game from the outset. We will
    be developing games that will run entirely from a prompt, just like the classics.


    Traditional text adventure games don''t have user interfaces with menus and buttons.
    They simply have a command prompt like this:


    ```

    >

    ```


    To interact with the game, the user enters instructions alongside the command
    prompt. Common instructions include:


    +   - n, s, w and e to tell the game to move the player North, South, West or
    East

    - look to tell the game to describe the current location

    - i or inventory to display a list of the player''s possessions

    - take or drop followed by the name of an object.


    After the command is entered the game replies. Here is a brief extract from a
    typical text adventure game:


    ```

    > n

    You have moved into the Troll Room.

    > look

    It is a dank room in a dungeon. There is a sword lying on the floor.

    > take sword

    sword taken.

    You have a lantern ( (providing light), a magic ring and a sword.

    > drop ring

    You drop the ring. A bearded dwarf appears. The dwarf picks up the ring, puts
    it on his finger and runs away to the north. The dwarf has dropped an emerald.

    > take emerald

    emerald taken.

    ```'
