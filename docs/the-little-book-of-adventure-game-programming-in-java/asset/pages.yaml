  md: "# Chapter 9 – Object Orientation Revisited\n\nImmediately after showing the\
    \ name of the thing, && it does this test:\n\n```\nif ((t instanceof ContainerThing)\
    \ && ((ContainerThing) t).isOpen()) {\n  showVisibleThings(((ContainerThing) t).getThings());\n\
    }\n```\n\nThis code tests if the Thing t is a ContainerThing (in which case it\
    \ will have its own ThingList and it also tests if it is open (in which case,\
    \ any things 'contains' should be visible). If these tests succeed, the ThingList\
    \ of t is passed back to the same method:\n\n```\nshowVisibleThings((ContainerThing)\
    \ t).getThings());\n```\n\nSo, if t were here the 'sack', the ThingList of the\
    \ sack object would be passed as an argument to showVisibleThings() and that ThingList\
    \ would now be assigned to the parameter tl:\n\n```\nvoid showVisibleThings(ThingList\
    \ tl);\n```\n\nThis time the for loop iterates the things in the sack's ThingList.\
    \ Once again, it displays the name of each thing in list and if one of the is\
    \ an open container, as the bowl, then it ThingList is passed back to showVisibleThings().\
    \ Now the loop iterates over the bowl's ThingList. Let's assume the bowl's list\
    \ only contains a carrot. A carrot is not a ContainerThing so this time the test\
    \ fails and the showVisibleThings() method is not called.\n\n# How Recursion Works\n\
    \nTo understand recursion you need to know that any function — is is called, a\
    \ chunk of memory called a 'stack frame' is created. The internal state (the variables\
    \ and parameters) of the executing function-call are stored in that stack frame.\
    \ If a function is called recursively, a new stack frame is created each time\
    \ it is called.\n\nSo let's assume the showVisibleThings(ThingList tl) method\
    \ is called with a Room list assigned to its tl parameter (this is call #1), then\
    \ the same method is called recursively with the sack's list assigned to tl (call\
    \ #2), then the same method is called recursively again, this time with the bowl's\
    \ list assigned to tl (call #3).\n\nWhen call #3 exits, the flow of execution\
    \ returns to the previous stack frame — that's the one storing the state of call\
    \ #2 (so tl is the sack's list again). When that function-call exits, we return\
    \ to the stack frame storing the state of call #1 (so tl is the Room list again)."
