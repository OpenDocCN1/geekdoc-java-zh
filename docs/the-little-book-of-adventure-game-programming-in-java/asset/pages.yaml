    \ (ThingHolder.java)\n\n```\nvoid doDescribeThings(Thing th, boolean describeAll)\
    \ {\n  ThingList tlist = th.getThings();\n  Container container;\n\n  for (Thing\
    \ t : tlist) {\n    String inContainer = \"\";\n    if (t.getContainer() instanceof\
    \ Container) {\n      inContainer = \" (in the \" + t.getContainer().getDescription())\
    \ + \\\n```"
