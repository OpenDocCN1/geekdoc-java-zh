    So exactly are ObjectOutputStream and ObjectInputStream? The Java API reference
    tells me that “An ObjectOutputStream writes primitive data types and graphs of
    Java objects to an OutputStream. The objects can be read (reconstructed) using
    an ObjectInputStream.\ In other words, they are able to write and read complex
    networks or ‘graphs’ of objects in the form of streams. In my code, I pass file
    streams to the ObjectInputStream and ObjectOutputStream constructors.


    Once that is done, saving my entire network of objects is as easy as writing the
    ‘top-level’ object (the one that contains all the other objects which in this
    case is the object) using the ObjectOutputStream writeObject() method:


    ```

    oos.writeObject(game);

    ```


    I then call flush() to make sure that any buffered data is written before I close
    the output stream:


    ```

    oos.flush();

    .close();

    ```


    Reloading the data is done in a similar way, only this time I need to tell Java
    which class of object I want to construct from the stream is why I put Game in
