  md: "# Chapter I— Communicating with the Game\n\nIt is up to you you prefer. On\
    \ the plus side, if you declare objects and method return-values to be of a specific\
    \ class such as ArrayList you will benefit from Java’s type-checking which will\
    \ show errors if you attempt to use the ‘wrong type’ of list object. The code\
    \ samples in the Java API documentation, however, generally use the List interface\
    \ declaration so I have adopted that convention.\n\n# Splitting a String Into\
    \ ‘Words’\n\nBefore we process a command we need to extract the individual words\
    \ from the line of text that was entered by the player. Java has a special StringTokenizer\
    \ class that can help us. Here, ‘token’ is the term used to describe, in human\
    \ language terms, we would usually call a ‘word’.\n\n![](img/f210b6659f24a42b28725bec993abfc1_28_0.png)\n\
    \nMy aim is to take an input string as “take the small, golden ring.” and split\
    \ it into the tokens: ‘take’, ‘the’, ‘small’, ‘golden’, ‘ring’. The string will\
    \ be split on delimiter characters such as spaces “ ”, commas “ ”, full-stops\
    \ “.” and other punctuation. The delimiters themselves will be discarded as they\
    \ are of no further interest. In my code I define the delimiter characters like\
    \ this:\n\n```\nString delims = \"\\t,;?\\\\\"\n```\n\nI then call the StringTokenizer\
    \ constructor, passing to it two arguments: the input string and the string of\
    \ delims:\n\n```\nStringTokenizer tokenizer = new StringTokenizer(input, delims);\n\
    ```\n\nNow it is incredibly simple to split the input string into individuals.\
    \ I just use the StringTokenizer’s nextToken() method to return the next token\
    \ (that is the next substring split on the delimited delimiters) from the input\
    \ string. I keep this inside a while loop until I run out of tokens (at which\
    \ point the hasMoreTokens() method returns false). Each time I split out new token\
    \ I add to my ArrayList of strings, strlist:\n\n```\nwhile (tokenizer.hasMoreTokens())\
    \ {\n  t = tokenizer.nextToken();\n  strlist.add(t);\n}\n```\n\n29"
