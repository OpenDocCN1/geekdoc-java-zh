  md: 'Chapter 1— Communicating with the Game


    # # How to Create a Project


    If you are creating a game project from scratch, the first thing you need to do
    is create a Java file containing the code that will run when the program is started.
    This code file must have a main function which will contain some code that keeps
    on executing within a loop. This code will take commands from the player and send
    them to be processed and acted upon until the program ends (when the player games
    it).


    First you need to create a new Java application. If you are using NetBeans, follow
    the steps below. If you are using some other editor or IDE and you already know
    how to create Java applications, so by creating a Java application with a code
    called MainLoop.java. Or load up the code of the main_loop project from this book''s
    source archive.


    # # How to Create a New Project in NetBeans


    +   1. Select File, New Project

    2. Depending on the NetBeans version select Java or Java With Ant

    3. In the right-hand pane, select Java Application. Click Next.

    4. In the next dialog enter a name for the project (e.g. HelloWorld)

    5. Optionally choose a project location

    6. Click Finish


    # # Java With Maven or Java With Ant?


    Some versions of NetBeans recommend that new users create a Java With Maven application.
    Maven and Ant are ''build tools'' and in this book we do not concern ourselves
    with their details. For our purposes, it doesn''t really matter whether you select
    Java With Maven or Java With Ant. The advantage of Java With Ant is that the project
    automatically creates a main file for you. If you select Java With Maven, you
    will need to create the main file yourself. So if your project is named HelloWorld,
    you should create a code file called HelloWorld.java. To do that, click the Source
    Packages node in the Projects window and right-click the package name beneath
    it. The package name will be something like com.mycompany.helloworld. From the
    popup menu, select New, Java Class. Enter a class name (such as HelloWorld). This
    will create a code file HelloWorld.java. Edit the class by adding a main() function
    as shown.


