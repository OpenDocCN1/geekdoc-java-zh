  img_proc: true
- pgno: 165
  md: 'Chapter 12 – Creating the Game!


    # Hint – How To Develop Puzzles


    When I am dealing with a new puzzle I usually do it in the starting location (the
    ‘first room’) of the game. In the final game, the player might have to go all
    the way down to the greenhouse in order to find a key then all the way back up
    to the bridge to use it. I don’t want to have to go through all those moves when
    I am testing this puzzle. So in the development stage, I put the key on the bridge
    so I can test the puzzle as soon as I run the game. Once I am happy that the puzzle
    works correctly, I change the key’s location to the greenhouse which is where
    the user needs to collect in the final version of the game.


    I don’t intend to go into a great deal of detail on how to program puzzles. Every
    game has a different set of puzzles and there is no ‘special technique’ for creating
    them. The type of puzzle – and the programming techniques needed to develop them
    – are limited only by the imagination of the programmer. Here are a few ideas
    for the types of puzzle you might think of programming:


    # Mazes


    These are commonplace in text adventure games. Ever since the ‘original’ adventure
    game, The Colossal Cave, mazes have been one of the traditional puzzles to put
    into games. You could program a maze which – just like a real-life maze – is a
    complicated set of locations where all the exits lead to and from adjacent locations.


    ![](img/f210b6659f24a42b28725bec993abfc1_165_0.png)


    166'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Or you could create a more complicated maze by connecting rooms ''twisty''
    little passages rather than simple north, south, west, east exits. The three hydroponics
    rooms in the Starcrash project do this:


    ![](img/f210b6659f24a42b28725bec993abfc1_166_0.png)


    Here, you can go west from Hydroponics North and enter on the west of Hydroponics
    Central. The connection works both ways. Ge go west of Hydroponics Central and
    you enter on the west of Hydroponics North. Similarly, Hydroponics Central and
    Hydroponics South have a two-way connection via their east exits. Connecting rooms
    in this unexpected ways here may much more seem, to the user, to be connected
    in difficult-to-understand ways. That is especially true if the rooms are given
    the same names (e.g. each is just called “Hydroponics”). Without the benefit of
    a map, it may seem that the player is wandering through a very large area made
    of numerous rooms. Only when the player makes a map does the relative simplicity
    de-complic the maze become apparent.


    If you want to be really tricky, you could create a maze in which the exits are
    different from the entrances. So you exit from a room down a one-way passage (or
    through a door that immediately locks itself behind you) and enter via a different
    one-way passage of self-locking door. Here''s an example:


