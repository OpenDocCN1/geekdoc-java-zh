  md: "# Open and Close Objects\n\nYou may have noticed in the code of processNoun()\
    \ shown earlier, that I have two new methods called openOb() and closeOb(). These\
    \ are intended to deal with objects created from the ContainerThing class. There\
    \ is nothing complicated about these methods. As the specified object t is, they\
    \ end up calling t.open() or t.close() to set the isopen state:\n\n```\nAdventureGame5\
    \ (Actor.java)\nt_and_th = isHere(obname);\nt = t_and_th.getThing();\nif (t ==\
    \ null) {\n    s = \"There is no \" + obname + \" here!\";\n} else {\n    s =\
    \ t.close();\n}\n```\n\nHowever, what is a bit more complicated is the method\
    \ named isHere(). Think about it. What does it really mean for a thing to be “here”?\
    \ If I want to open the sack or look at the sword, for instance, I expect to be\
    \ able to do so only if the sword and the sack are “here”.\n\n# Is a Thing “Here”?\n\
    \nYou might think that to be an object would have to be in the current room –\
    \ that is, it would have to be found in the ThingList of the current room. But\
    \ what if the object is not in the current room but is in the player’s inventory?\
    \ Our definition of here needs to be extended: an object is “here” either if it\
    \ is in the ThingList of the current room or it is in the ThingList of the player.\n\
    \nBut, no that won’t do. Either maybe the player has a sack and it is the sack\
    \ that contains the sword. The sword is still “here” (because the player can look\
    \ at it to take it and drop it) but this is in the ThingList of the sack (a ContainerThing\
    \ object) which is itself in the ThingList of the player (an Actor object).\n\n\
    In fact, such an object might be in a box in a sack in a treasure chest in the\
    \ current room. The sword is still “here” but now we have to search an awful lot\
    \ of ThingLists to find it. First we search the current room’s ThingList to find\
    \ the treasure chest, then we search the treasure chest’s ThingList to find the\
    \ box, then we search the box’s ThingList to find the sack and so on..."
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/f210b6659f24a42b28725bec993abfc1_95_0.png)


    # Is the Sword “Here”?


    The sack is in the room so we know it’s here. But the sword is in the sack so
    how do we know that it is “here?” Currently, only those objects that are in the
    top-level list owned by each room are considered to be “in” the room. Those objects
    that are stored in lists owned by containers (such as the sack) are not considered
    to be here. That’s obviously not correct – and we are soon going to have to fix
    this problem!


    What we really need is some way of searching for an object through a whole network
    of ThingList lists as much as we use a software tool to search for a file through
    a whole network of subdirectories on disk. The obvious was of doing this is by
    performing a recursive search. That’s easy to say, but if you are not too familiar
    with recursive programming, it may not be quite easy to do. In the next chapter,
    I’ll explain how to search through lists recursively.'
