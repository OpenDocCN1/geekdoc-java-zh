  md: "# Chapter 11 — Adjectives to Describe Things\n\nThe code here relies on the\
    \ findThings() method of ThingHolder. I won't go into how that works here (you\
    \ can examine the code in ThingHolder.java). Suffice to say that it once again\
    \ relies on a recursive method, findThingInAnyList(), to locate objects. Instead\
    \ of returning a single object this returns a ThingAndHolderList of all matching\
    \ objects.\n\nIf the object name is \"ring\" and there are two rings here, it\
    \ returns a list containing both rings. If the user specifies \"gold ring\" and\
    \ there are two gold rings here (a \"small gold ring\" and a \"big gold ring\"\
    ) once both rings are returned. But if the user specifies \"small ring\" and only\
    \ one of the rings has the \"small\" attribute or adjective then only ring is\
    \ returned in the list.\n\nIf the list of objects returned to the drop() method\
    \ contains just one object, it can, of course, be dropped. But it may contain\
    \ multiple objects – or none at all. Therefore, drop() calls another method, oneThingInList(),\
    \ to determine if there is one – and only one – object in the list:\n\n```\ns\
    \ = ListTool.oneThingInList(things, np.phrase(), \"drop\", true);\n```\n\nThe\
    \ oneThingInList() method returns an empty string if there is precisely one in\
    \ the list, otherwise it returns a message of some sort. If the string is empty\
    \ all is well and the drop() method proceeds with dropping the object. Otherwise\
    \ the message is displayed to the user. This is the oneThingInList() method:\n\
    \n# Starcrash (ListTool.java)\n\n```\nprivate static String oneThingInList(ThingAndHolderList\
    \ things,\n    String desc,\n    String verb, boolean mustBeInInventory()) { //mustBeInInventory\
    \ true for \"drop\"\n    String s = \"\";\n\n    if (things.isNullOrEmpty()) {\n\
    \        if (mustBeInInventory()) {\n            s = \"You haven't got \" + thingDesc;\n\
    \        } else {\n            s = \"Can't see \" + thingDesc + \" here.\";\n\
    \        }\n    } else if (things.size() > 1) {\n        s = \"Which of these\
    \ do you want to \" + verb + \"?\\n\";\n        s += listMultipleThings(things);\n\
    \    }\n    return s;\n}\n```"
