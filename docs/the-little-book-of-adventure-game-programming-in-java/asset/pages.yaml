    \ 100 groats.\nThe Ring is a treasure worth 500 groats.\n\n# @Override\n\nWhen\
    \ you intend a method to override another method, it is good practice to mark\
    \ the overridden method with the @Override annotation like this:\n\n```\n@Override\n\
    public String describe() {\n    return \"The \" + super.describe() + \" is a treasure\
    \ worth \"\n    + value + \" groats.\";\n}\n```\n\nThe @override annotation doesn't\
    \ change the behaviour of the method (unlike the override keyword in C#) but it\
    \ does cause the compiler to show an error if a method marked with @override does\
    \ not, in fact, override another method.\n\nThis is useful if, for example, you\
    \ mistakenly the name of the method – say by calling it Describe() with an uppercase\
    \ 'D' instead of describe() with a lowercase 'd’. If you omit the @override annotation,\
    \ your code will compile but will produce incorrect results. So, in short, overriding\
    \ methods is easy in Java, but be aware that overridden methods may not work in\
    \ quite the same way as you are used to in other languages, so use them with care."
