  md: 'Chapter I— Communicating with the Game


    The String variable input will be assigned a string (the line of text) entered
    by the player:


    ```

    in = new BufferedReader(new InputStreamReader(System.in));

    ```


    The simple explanation of this is that the InputStreamReader reads text data and
    passes it to BufferedReader so that the data can be buffered for efficiency. A
    more detailed explanation follows...

    InputStreamReader is a Java class that reads bytes from a stream and decodes bytes
    as characters. A ‘stream’ is a flow of bytes from one place to another. System.in
    is a stream that corresponds to data entered from the keyboard. So the line of
    code above passes the bytes the text entered by the user as an argument to the
    constructor method (the method that creates and initializes a new object) of an
    InputStreamReader object. This decodes the bytes into a stream of characters which
    are passed to the constructor of BufferedReader. This reads from the character-input
    stream, buffering characters for efficiency. The BufferedReader object is then
    assigned to the variable in.


    Phew! That might sound awfully complicated just to read in a line of text. The
    good news is, once you''ve done you can forget about it. Everything that follows
    in the main() function is simpler.


    # Functions or Methods?


    ‘Method’ is the object-oriented term for a function that ‘belongs’ (to be scoped
    within) a class or an object. This contrasts with the ‘free-floating’ functions
    of non-object oriented languages such as C. In this book, the words ‘function’
    and ‘method’ are used interchangeably. From now on, I will generally use the word
    ‘method’.


    ![](img/f210b6659f24a42b28725bec993abfc1_24_0.png)


    Now there is a loop:


    ```

    do {

    } while("q".equals(input));

    ```


    This is a do..while loop. It runs all the code between the curly brackets until
    the end condition (following the keyword while) is met. Here the loop executes
    while input (the text that was entered by the user) is not “q”. As soon as the
    user enters “q”, the end condition is met and the loop stops running. Notice that
    in Java I must test a string for


