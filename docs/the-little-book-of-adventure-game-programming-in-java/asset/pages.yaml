- pgno: 164
  md: '# Game Save/Restore


    The startup class, Starcrash.java, now includes some file-saving and loading routines
    that prompt the user to enter a file name. If the file name already exists, when
    saving, the user is asked whether or not that file should be overwritten. If it
    does not exist when loading, an error message is shown. The file extension ''adh''
    is obligatory and an error message is shown if another extension or no extension
    is used. To begin saving or loading, you must enter the commands "save" or "load"
    and then enter a file name when prompted.


    # Game Initialization


    The game initialization — the data defining the rooms, the objects and the vocabulary
    — is now done in the two files GameDate.java and VocabularyData.java located in
    the game.data package. This will make it easier to write other games, with different
    data. The code in these classes is self-explanatory. However, be very careful
    when initializing in the GameData class: you must create and initialize objects
    in the correct order (as documented in the comments). For example, when you initialize
    a Room object you need to pass it other rooms for the ''exits'' so obviously those
    Room objects must already exist.


    # Adding Puzzles


    In the course of this book, we''ve created a ''framework'' — all the core classes
    and methods — needed to write adventure games in Java. At the simplest level,
    the only thing you need to create your own game is to define some game data (the
    rooms and treasures) and the vocabulary (such as the names of objects with which
    the user can interact) in the two files, GameData.java and VocabularyData.java.
    Even doing alone, you could create a substantial game with many linked objects.
    If the object of the game is simply to find and collect all the treasures, then
    you are all ready to go.


    Most adventure games, however, contain puzzles. Maybe the player needs a gold
    key to open a door or a treasure chest. Maybe the dials in the Laser Destructor
    Ray have to be set to specific values and those values can only be found in a
    book inside a cupboard. But that cupboard can only be opened once you find the
    silver key which is hidden in a box which is inside the chest which can only be
    opened using the golden key... and so on.'
