    This is the runCommand() method:


    wl is a generic list typed to hold strings. A generic list is one that defines
    methods that can be used on objects of varying types but which can also be typed
    to work on elements of a specific type. The type of the list elements is specified
    by placing a class name (here String) between pointy brackets when declaring the
    list.


    # The List Interface


    In Java, List is the name of an interface, not of a class. An interface is a sort
    of template that defines a set of methods which contains no code. You cannot create
    objects from interfaces. Classes can implement interfaces, however, and when they
    do so must include fully working methods for each of the empty methods defined
    by the interface. For example, the ArrayList class implements the List interface
    (plus several other interfaces) and it contains methods defined by that interface.
    For more on interfaces, see the Appendix.


