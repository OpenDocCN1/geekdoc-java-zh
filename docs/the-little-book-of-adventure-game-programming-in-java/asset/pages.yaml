  md: "# Chapter 12 – Creating the Game!\n\nThe article() method of GenericThing overrides\
    \ the article() method of Thing which returns \"a\" or \"an\" depending on whether\
    \ the initial letter of the string passed to it is a vowel:\n\n# Starcrash (Thing.java)\n\
    \n```\nprotected String article(String s) {\n  char initial;\n  String a;\n\n\
    \  a = \"a\";\n  char[] vowels = {'a', 'e', 'i', 'o', 'u'};\n  initial = (s.toLowerCase()).charAt(0);\n\
    \  for (char c : vowels) {\n    if (c == initial) {\n      a = \"an\";\n    }\n\
    \  }\n  return a;\n}\n```\n\nYou can see an example of this in the describe()\
    \ method of GenericThing:\n\n# Starcrash (GenericThing.java)\n\n```\npublic String\
    \ describe() {\n  String d;\n  String s;\n\n  d = getLongDescription();\n  if\
    \ (this.isPlural()) {\n    s = \"They are \" + article(d) + \" \" + d;\n  } else\
    \ {\n    s = \"It is \" + article(d) + \" \" + d;\n  }\n  return s;\n}\n```\n\n\
    # LockableThing\n\nThe new lockableThing class is a descendant of ContainerThing.\
    \ It adds a new boolean field. When this field is false the object is unlocked,\
    \ when it's true, the object is locked. You might think that I all need to do\
    \ is add methods to toggle the value of locked. In fact, it's not that simple.\
    \ First, the locked and open states need to work together. Logically, something\
    \ that may be locked can only be opened after it has been unlocked, so I've overridden\
    \ the open() method of ContainerThing:"
