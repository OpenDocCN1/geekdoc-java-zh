  md: "Chapter 4 — Treasures\n\n# # Treasure Lists\n\nSince both the player and the\
    \ rooms need to hold lists of objects, it makes sense to add a list not to the\
    \ Room and Actor classes individually but to a common ancestor class. That way,\
    \ instead of implementing the list twice, the Room and the Actor class will inherit\
    \ the same set of list management capabilities from their ancestor. \n\nUp to\
    \ now Room and Actor have descended directly from the base. The Thing class is\
    \ a very simple class and I want to stay that way! It is good object oriented\
    \ design to keep a base class small and 'generic' and to place more specialized\
    \ features (such as list management) in descendant classes. If I were to add list\
    \ management to the Thing class then all other classes would inherit lists. That\
    \ is not what I want.\n\nMy solution is to create an intermediate class — one\
    \ that goes between the base class, Thing, and the more specialist classes, Actor\
    \ and Room. I've created a class called Thing to maintain a list of things. It\
    \ contains a ThingList and it has getThings() and set methods:\n\n```\npublic\
    \ class ThingHolder extends Thing {\n    private ThingList things = new ThingList();\n\
    \n    public ThingHolder(String aName, String aDescription, ThingList t1) {\n\
    \        super(aName, aDescription);\n        things = tl;\n    }\n\n    public\
    \ ThingList getThings() {\n        return things;\n    }\n\n    public void setThings(ThingList\
    \ things) {\n        this.things = things;\n    }\n}\n```\n\nThingHolder is a\
    \ descendant of Thing. In order to add the features of the ThingHolder class to\
    \ both the Actor and Room classes, all I need to do is redefine the ancestors\
    \ of those classes.\n\nPrevious Room and Actor descended directly from Thing.\
    \ Now I make them descend from ThingHolder. They still ultimately descend from\
    \ Thing, of course, because the ThingHolder class itself descends from Thing."
