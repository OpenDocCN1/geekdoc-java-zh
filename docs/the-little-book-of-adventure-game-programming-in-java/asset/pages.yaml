  md: "# Chapter I— Communicating with the Game\n\n# An Alternative Tokenizer\n\n\
    I like the StringTokenizer class because it is simple and straightforward. However,\
    \ the Java documentation states that \"Tokenizer is a legacy class that is retained\
    \ for compatibility reasons although its use is discouraged in new code\".\n\n\
    The documentation recommends using the String.split() method instead. String.split()\
    \ requires a regular expression instead of a simple string of delimiters. You\
    \ don't use regular expressions regularly, the syntax can be confusing and it\
    \ is all too easy to make an accidental error, which is a good reason (in my opinion)\
    \ for avoiding them whenever possible.\n\nHowever, just in case you have doubts\
    \ about using a \"legacy\" class, I have written this alternative wordList() method\
    \ using String.split(). The regular expression here, is simple. It declares the\
    \ delimiter characters between square brackets and adds a sign at the end so consecutive\
    \ delimiters are treated as though they were one delimiter (that is, multiple\
    \ consecutive delimiters are removed when they are encountered). This is the method\
    \ I use in my game projects starting with AdventureGame1:\n\n# AdventureGame1(Game.java)\n\
    \n```\npublic static List<String> wordList(String input) {\n    String delimiters\
    \ = \"[\\t,.;?!]+\\+\";\n    List<String> strlist = new ArrayList<>();\n    String[]\
    \ words = input.split(delimiters);\n\n    for (String word : words) {\n      \
    \  strlist.add(word);\n    }\n    return strlist;\n}\n```\n\n# Parsing Commands\n\
    \nOnce I've split a string into tokens, I pass them as a list to the parseCommand()\
    \ method. In the Userinput project, this is no more than a simple method that\
    \ tries to recognise input made up of a verb such as \"take\" or \"drop\" followed\
    \ by a noun such as \"sword\" or \"ring\". I define all the known words in two\
    \ lists, commands and objects. I use the get() method to get the first and second\
    \ words from a two-word list and then simply check that my commands list contains\
    \ the first word (at index 0) and my objects list contains the second word (at\
    \ index 1). If both succeed then I have a valid two-word command. If either fails,\
    \ I don't:"
