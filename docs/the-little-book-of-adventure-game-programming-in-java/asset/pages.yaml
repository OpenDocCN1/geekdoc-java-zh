  md: '# # Chapter 12 – Creating the Game!


    In order to take a ''development'' codebase (created during the testing phase)
    and get it ready for deployment (to create an actual game), numerous changes have
    been made...


    ![](img/f210b6659f24a42b28725bec993abfc1_152_0.png)


    If you looked at the Starcrash source code while working through the major changes
    outlined in the last chapter, you can''t have failed to notice the structure of
    the entire project has changed quite a bit since the previous version (Starcrash-beta).
    Let me take you quickly through the most important changes now.


    Many of the changes have been aimed at making the code neater and more modular.
    If you open all the project nodes in the NetBeans IDE you will see there are lots
    of new classes and these have been organized into a number of packages to keep
    related classes in logical groups. Most of these changes should be easy to understand
    – they don''t involve any difficult coding – so I''ll highlight the most important
    differences.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Chapter 12 – Creating the Game!


    # Game Classes


    The game classes essentially form three groups. The first group is arranged within
    the game package. This includes data-initializing classes in game.data, the grammar
    classes in game.grammar and the ''top-level'' game classes: Game, Parser and Starcrash.
    The gameobjects package contains the essential game Thing plus some special list
    types in gamerobjects.lists, the ListTool class in gameobjects.lists and the Actions
    in gameobjects.lists. The globals package contains utility classes and enums:


    ![](img/f210b6659f24a42b28725bec993abfc1_153_0.png)


    # Game Objects


    The ''game object'' classes are all placed into the gameobjects package. The ultimate
    ancestor is BaseThing which contains a name and a description. The Thing class
    implements behaviour common to all game objects such as movable and movable. It
    also has a long_description (in addition to description) which can provide a more
    detailed description of an object in response, for example, to the "look at" command.
    The boolean show variety has been added, when false, can indicate that an object
    should not be shown in the list of objects for each room. This means that you
    can mention an object (say the cupboard object in the Ready Room) when describing
    the room but not include it in the list of objects in that room. You do this by
    testing the boolean returned by the show() method:


    ```

    Starcrash (ThingHolder.java) - doDescribeThings()

    if (t.show())

    154

    ```'
