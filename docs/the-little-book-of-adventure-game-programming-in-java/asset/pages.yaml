  md: '# C# Compared to Java


    In many respects the C# and Java languages are quite similar. They are both Object
    Oriented languages with a C-like syntax. Frequently it is possible to translate
    Java code to C#, or vice versa, with relatively few changes.


    Since I also have a book on writing an adventure game in C#, I think it''s worth
    taking a little time to highlight some important differences between the two languages.
    Being able to translate code from one language to another is a useful skill for
    any programmer to have. This is, of course, only a very brief comparison of the
    two languages. In order to translate from one to the other, you would need some
    familiarity with both Java and C# and you would also need to refer frequently
    to the documentation of their class libraries. Even so, this short Appendix may
    give you an insight into the sorts of problems you may encounter when doing this.
    At any rate, these are a few of the things that tripped me up when I worked on
    my Java adventure game.


    # String Equality


    Here''s the main loop in a C# game. It continues running as long as the value
    of output is not "q":


    | C# |

    | string input;

    | do {

    | input = Console.ReadLine().ToLower();

    | // code to run

    } while (input != "q"); |


    The syntax of a do loop in Java is the same as in C#, I could write a loop like
    this:


    | Java |

    | String input;

    | do {

    | input = getInput().toLowerCase();

    | // code to run

    } while (input != "q"); |'
