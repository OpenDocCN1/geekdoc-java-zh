  md: "# Chapter 11 – Adjectives to Describe Things\n\nIf you compare the drop() method\
    \ with the version of the same method from the previous project (Starcrash-beta),\
    \ you'll see that they are very similar. They get a ThingAndThingHolder th and\
    \ they call transferObj() to transfer that object from the Actor's list of things\
    \ to the current room's list of things. The only significant difference is the\
    \ way in which the Thing object to be transferred is.\n\nIn the previous project\
    \ it was assumed that there would only ever be one box, sword, one ring (and so\
    \ on) in the entire game that such object was found by calling the find() method\
    \ with the object's name:\n\n```\nStarcrash-beta (Actor.java)\nt_th = this.findThing(objname);\n\
    ```\n\nIn the present project (Starcrash), there may be many boxes, swords and\
    \ rings, each of which is distinguished by a set of 'attributes' – that is, by\
    \ distinguishing features that may be described using adjectives: “small gold\
    \ ring”, “silver ring” and so on.\n\n![](img/f210b6659f24a42b28725bec993abfc1_145_0.png)\n\
    \n# Adjectives or Attributes?\n\nWhen I use the word 'attributes' I mean the 'properties'\
    \ of a Thing object that help us to distinguish it from other Thing objects. Each\
    \ attribute of a Thing can be described using an adjective. Since, in programming,\
    \ the words ‘attribute’ and ‘property’ are often used to describe specific features\
    \ of syntax, I decided to use the name adjectives for the list of attributes of\
    \ Thing objects.\n\n# Matching Multiple Objects\n\nI have written a new method\
    \ matchingThingsInInventory() to which the entire NounPhrase object is passed.\
    \ This is capable of matching more than one object. For example, if there is a\
    \ silver ring and a gold ring in the player's inventory, the user enters “drop\
    \ ring”, this method will return two objects:\n\n```\nStarcrash (Actor.java)\n\
    public ThingAndThingHolderList matchingThingsInInventory(NounPhrase np) {\n  \
    \  ThingAndThingHolderList things;\n    things = findThings(np);\n    return things;\n\
    }\n```"
