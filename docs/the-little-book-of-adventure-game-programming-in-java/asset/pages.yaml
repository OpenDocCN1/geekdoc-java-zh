- pgno: 182
  md: '# Interfaces


    We''ve come across interfaces quite a bit in the course of this book. Let''s take
    a closer look at what an Interface actually is.


    Two interfaces in particular, List and Serializable, have been vital to the development
    of the game projects. So what exactly is an interface? Java interfaces are like
    "abstract classes". They define methods but they do not implement those methods.
    Classes may optionally implement one or more interfaces and when they do they
    must add the methods (that is, they must provide the actual code of the methods)
    defined by each interface.


    # The List Interface


    The List interface is an example which you will have seen many times in this book.
    This defines all kinds of methods that are useful when working with lists of objects
    such as add(), remove() and size(). Other classes such as ArrayList, LinkedList
    and Stack implement the List interface and in each case these classes must provide
    the methods defined by List.


    This makes possible to ensure that all list classes provide a certain number of
    important methods even though the behavior of those classes may be somewhat different.
    A class can also subclass or ''extend'' one other class, through inheritance.
    But it may implement multiple interfaces. Here, for example, is the declaration
    of the ArrayList class:


    ```

    public class ArrayList<E> extends AbstractList<E>

    implements List<E>, RandomAccess, Cloneable, java.io.Serializable

    ```


    As you can see, Java''s ArrayList extends just one class, AbstractList, but it
    implements four interfaces: List<E>, RandomAccess, Cloneable, java.io.Serializable.
    Here the <E> shows ArrayList and List are generic. They can be held to elements
    <E> of a specific type such as int or String. In the UserInput sample project,
    I declare the variable strlist to be a List of String objects stored in an ArrayList:


    ```

    List<String> strlist = new ArrayList<>();

    ```'
