  md: "Chapter 12 — Creating the Game!\n\nAs with many similar methods which we've\
    \ seen before, these begin by trying to match a Thing object to a description\
    \ (that is they try to find Thing objects that match the nouns and adjectives\
    \ in two NounPhrase objects). The only bit of code of real interest is the code\
    \ that tests if the thing the player wants to be unlocked is, in fact, a LockableThing.\
    \ If it isn't, then it cannot be unlocked. If it is, then the code that the player\
    \ wants to use is tryLock():\n\n```\nif (t instanceof LockableThing) {\n    s\
    \ = ((LockableThing) t).tryunlockWith(t2);\n}\n```\n\nAnd similarly, when the\
    \ player wants to lock something:\n\n```\nif (t instanceof LockableThing) {\n\
    \    s = ((LockableThing) t).trylockWith(t2);\n}\n```\n\nYou could program various\
    \ other \"Do something added with something\" methods in a similar way, if you\
    \ wished to. In fact, I've already added an open() method to Actor but currently\
    \ there is nothing that can be opened with another object so any attempt to do\
    \ will always fail. But there may be occasions in a game where some object needs\
    \ to be opened with some other specific object. For example, maybe the furnace\
    \ door can only be opened with the tongs. Or maybe the rusted lid can only be\
    \ opened with the super concentrated acid. As an exercise, you may want to try\
    \ rewriting the open() method to deal with this.\n\n# Special Actions\n\nSometimes\
    \ you may want actions to have different effects when done to specific objects.\
    \ For example, when you press the button on the wall of the dam control room,\
    \ you may want to flood gates to open. When you rub the magic lamp, you may want\
    \ the genie to appear. To do this sort of thing, you need some way of substituting\
    \ 'special' actions for the defaults. I've added the Actions class for purpose.\
    \ In my game, for example, I want to take a special action when the activation\
    \ card is put into the slot of the Bridge. Usually when one thing is put into\
    \ another thing, nothing happens. But when the card is put into the slot, I want\
    \ to activate the ship's Faster Than Light drive.\n\n161"
