  md: "Chapter 1 — Adjectives to Describe Things\n\n# Starcrash (SentenceAnalyzer.java)\n\
    \n```\nprivate List<GrammarUnit> sentence;\nprivate List<WordAndType> rest;\n\
    ```\n\nWhen constructed, the SentenceAnalyzer object assigns the entire WordAndType\
    \ list to rest (here rest is the \"rest of the list\" that has yet to be analyzed).\
    \ Its aim is to iterate over this list and construct from a sentence made of GrammarUnit\
    \ objects. As each WordAndType element is dealt with, it is removed from rest.\
    \ This is the method that handles this processing work:\n\n# Starcrash (SentenceAnalyzer.java)\n\
    \n```\npublic List<GrammarUnit> analyze() {\n  WordAndType wt;\n  String word;\n\
    \n  while (!rest.isEmpty()) {\n    wt = getNextElement();\n    word = wt.getWord();\n\
    \    switch (wt.getType()) {\n      case VERB:\n        addVerb(wt);\n       \
    \ break;\n      case ADJECTIVE:\n        case NOUN:\n          addNounPhrase(wt);\n\
    \          break;\n      case PREPOSITION:\n        addPreposition(wt);\n    \
    \    break;\n      default:\n        break;\n    }\n  }\n  return sentence;\n\
    }\n```\n\n# More Packages, More Classes\n\nIn the Starcrash project I’ve continued\
    \ to restructure my code by creating a number of specialist classes which are\
    \ grouped together into packages such as game.data (to contain the classes ‘initialize’\
    \ the game) and game.grammar (to contain the GrammarUnit class, its descendants\
    \ and other classes needed to analyse and categorize words and commands).\n\n\
