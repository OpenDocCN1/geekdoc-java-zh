  md: "Chapter II – Adjectives to Describe Things\n\nThe arguments here are as follows:\n\
    \n+   - ThingAndThingHolderList things\n- StringDesc\n- String verb\n- boolean\
    \ mustBeInventory\n- a list of ThingAndThingHolder objects\n- a description (c.g.\
    \ \"small gold ring\")\n- a verb (such as \"drop\" or \"take\")\n- true if object\
    \ must be owned by Actor\n\nThe code is simple. If no object is found, then if\
    \ mustBeInventory is true, it returns a string saying \"You haven't got\" plus\
    \ the object description, or if mustBeInventory is false (the object might be\
    \ either in the room *or* in the inventory), it returns \"Can't see\" plus the\
    \ object description.\n\n# The ListTool Class\n\nI created a new class, ListTool,\
    \ in the gameobjects.lists.tools package contains some static methods for checking\
    \ lists.\n\nOn, if the other hand, than more one object is found then the string\
    \ \"Which of these do you want to \" plus the verb (c.g. \"drop\" or \"take\"\
    ) and a list of object descriptions returned by listMultipleThings():\n\n```\n\
    Starcrash (ListTool.java)\nprivate static String listMultipleThings(ArrayList<ThingAndThingHolder>\
    \ things) {\n  String s = \"\"\n\n  for (ThingAndThingHolder tth : things) {\n\
    \    s += tth.get().getDescription() + \"\\n\";\n  }\n  return s;\n}\n```\n\n\
    So really, that's all there is to the business of determining whether or not multiple\
    \ objects match a command. Each action method, take(), drop(), lookAt(), look()\
    \ and so on uses this technique of determining whether or not a Thing can be uniquely\
    \ identified prior to performing an action.\nThe put method is a bit more complicated\
    \ than it has to check that two things can be uniquely identified. For example,\
    \ if the user entered \"put the ring into the box\" and there are two rings and\
    \ two boxes here, it would need to display a message informing the user that it\
    \ can't tell which box or ring was intended. I'll leave you to study the code\
    \ of this and all the other 'action' methods in Actor in your own time.\n\n148"
