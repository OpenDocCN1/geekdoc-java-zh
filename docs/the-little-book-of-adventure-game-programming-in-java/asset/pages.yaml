  md: '```

    C:\Program Files\Java\jdk1.8.0_111\bin

    ```


    Click OK. Open a new system prompt and check that the java and javac commands
    are understood. To compile a program, open a system prompt and navigate to the
    directory containing the ''main'' Java program. For example, in the AdventureGame1
    project, the main program is AdventureGame.java and it is likely to be found in
    a directory such as:


    ```

    D:\JavaAdventureGame\AdventureGame1\src

    ```


    Once logged into that directory, enter the name of the main code file after the
    javac command in order to compile the project:


    ```

    javac AdventureGame.java

    ```


    This should create a compiled file called AdventureGame.class. To run this, now
    enter java followed by the name of the compiled file (without the extension .class):


    ```

    java AdventureGame

    ```


    This should run the program.


    # Java is Case Sensitive


    If your main class is called AdventureGame with a capital ''A'' and a capital
    ''G'', you must be sure to use the same mix of upper and lowercase when you try
    to run the program. Let''s suppose I forget to capitalize the ''G'' when I enter
    the command like this:


    ```

    java Adventuregame

    ```


    Java will show an error message similar to this:


    | Error: Could not find or load main class Adventuregame |


