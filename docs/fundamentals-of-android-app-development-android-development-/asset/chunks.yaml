    \n## Preface\nApplication layering is still a recent development in Android when\
    \ compared to the existing application delivery solutions available today, and\
    \ how applications are typically delivered to a physical mobile. This older model\
    \ of application delivery had to be changed to embrace the full features and functionality\
    \ that a virtual environment delivers.\n\nThis change was made to address the\
    \ issue of how to deliver applications to stateless virtual machines. This stateless\
    \ or non-persistent model of delivering and building virtual machines on demand\
    \ meant that end users would not “own” their virtual machine and instead would\
    \ be allocated a new, freshly built machine on demand. The next time they logged\
    \ in, they would again log in to a freshly built device.\n\nWhat do App Volumes\
    \ deliver? At a highlevel, `App Volumes` provides real-time application-delivery\
    \ which can be used as delivery system for your `android` and Other Real-time\
    \ servers. The primary goal of this book is to provide information and skills\
    \ that are necessary to Understand the Android Apps and how is work and what is\
    \ the future of Android.\n\n## Chapter 1: Android Basic\n### Section 1: Introduction\n\
    Android application layering as a concept and how it works. It focuses on the\
    \ specifics of the `Android App` and what the solution can deliver in terms of\
    \ use cases.\n\n### Section 2: Android basic\nThis section provides necessary\
    \ information on the android device that focuses on the specifics of the `Android\
    \ App` and what the solution as per required.\n\n### Section 3: Android practice\
    \ question and answers\nThis section provides android question answers which are\
    \ most common for information on the android device.\n\n### Section 4: Android\
    \ practice set\nThis section provides a practical android solution, this is the\
    \ most common set for android development and how to practice in future android\
    \ apps for your devices.\n\n## Chapter 2: SQLite Database and Android\n### Section\
    \ 1\nDifferent components of the solution and how to work them are shown in easy\
    \ to follow, step-by-step instructions using an actual screenshot from `SQLite`.\n\
    \n### Section 2: SQLite basic question and answers\nProvides components of the\
    \ solution and how to work them are shown in easy to follow, step-by-step instructions\
    \ as per business required.\n\n### Section 3: Google Firebase service\nWhich is\
    \ most common for real-time data and large application development for android\
    \ devices.\n\n### Section 4: Unity service\nFor game apps development including\
    \ 2D and 3D Game interface for the Android throughout user the `unity` is also\
    \ providing real-time data and large application development for android devices.\n\
    \n### Section 5: Android Project\nIt’s a practical part of the android developer.\
    \ In this section, Android developed can practice a practical project for your\
    \ android devices.\n\n## Implementation Examples\n\n### How to developed SMS applications\n\
    1. Add the following code in Main Activity XML:\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
    http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
    \    android:layout_height=\"match_parent\"\n    android:orientation=\"vertical\"\
    \n    android:background=\"#E0FFFF\"\n    tools:context=\".MainActivity\"\n  \
    \  android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
    \n    android:text=\"@string/enter_your_mobile_number_and_messages\"\n    android:textAlignment=\"\
    center\"\n    android:textScaleX=\"1.5\"\n    android:textSize=\"25dp\"\n    android:layout_marginTop=\"\
    20dp\">\n\n    <EditText\n        android:id=\"@+id/fstTxt\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginLeft=\"\
    100dp\"\n        android:layout_marginTop=\"150dp\"\n        android:text=\"Mobile\
    \ No\" />\n\n    <EditText\n        android:id=\"@+id/mblTxt\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginLeft=\"\
    100dp\"\n        android:ems=\"10\" />\n\n    <EditText\n        android:id=\"\
    @+id/secTxt\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:text=\"Message\"\n        android:layout_marginLeft=\"\
    100dp\" />\n\n    <EditText\n        android:id=\"@+id/msgTxt\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginLeft=\"\
    100dp\"\n        android:ems=\"10\" />\n\n    <Button\n        android:id=\"@+id/smsbtnSend\"\
    \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:layout_marginLeft=\"100dp\"\n        android:text=\"\
    Send SMS\" />\n</LinearLayout>\n```\n2. Add user permission in your Manifest file:\n\
    ```xml\n<uses-permission android:name=\"android.permission.SEND_SMS\" />\n```\n\
    3. Add the following code in Java file in MainActivity:\n```java\npackage com.homeworld.android;\n\
    \nimport android.content.Intent;\nimport android.net.Uri;\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.telephony.SmsManager;\nimport android.view.View;\n\
    import android.widget.Button;\nimport android.widget.EditText;\nimport android.widget.Toast;\n\
    \npublic class MainActivity extends AppCompatActivity {\n    private EditText\
    \ txtMobile;\n    private EditText txtMessage;\n    private Button btnms;\n\n\
    \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n   \
    \     super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \        txtMobile = (EditText) findViewById(R.id.mblTxt);\n        txtMessage\
    \ = (EditText) findViewById(R.id.msgTxt);\n        btnms = (Button) findViewById(R.id.smsbtnSend);\n\
    \        btnms.setOnClickListener(new View.OnClickListener() {\n            @Override\n\
    \            public void onClick(View v) {\n                try {\n          \
    \          Intent i = new Intent(Intent.ACTION_VIEW);\n                    i.setData(Uri.parse(\"\
    smto:\" + txtMobile.getText().toString()));\n                    i.setType(\"\
    vnd.android.mms-message\");\n                    i.putExtra(\"address\", txtMobile.getText().toString());\n\
    \                    i.putExtra(\"body\", txtMessage.getText().toString());\n\
    \                    startActivity(Intent.createChooser(i, \"Send sms via Mobile:\"\
    ));\n                } catch (Exception e) {\n                    Toast.makeText(MainActivity.this,\
    \ \"SMS Failed to Send, Please try again\", Toast.LENGTH_SHORT).show();\n    \
    \            }\n            }\n        });\n    }\n}\n```\n\n### How to create\
    \ simple music player\n1. The following code of XML file of MainActivity:\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
    http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
    \    android:layout_height=\"match_parent\"\n    android:background=\"@drawable/background\"\
    \n    tools:context=\".MainActivity\">\n\n    <ImageButton\n        android:id=\"\
    @+id/btn_play\"\n        android:layout_width=\"90dp\"\n        android:layout_height=\"\
    90dp\"\n        android:layout_centerHorizontal=\"true\"\n        android:layout_marginTop=\"\
    550dp\"\n        android:background=\"@drawable/play\" />\n\n    <ImageButton\n\
    \        android:id=\"@+id/btn_pause\"\n        android:layout_width=\"90dp\"\n\
    \        android:layout_height=\"90dp\"\n        android:layout_marginLeft=\"\
    10dp\"\n        android:background=\"@drawable/pause\"\n        android:layout_startOf=\"\
    @+id/btn_play\"\n        android:layout_leftOf=\"@+id/btn_play\" />\n\n    <ImageButton\n\
    \        android:id=\"@+id/btn_stop\"\n        android:layout_width=\"90dp\"\n\
    \        android:layout_height=\"90dp\"\n        android:layout_alignEnd=\"@+id/btn_play\"\
    \n        android:layout_rightOf=\"@+id/btn_play\"\n        android:background=\"\
    @drawable/stop\" />\n</RelativeLayout>\n```\n2. Add a new raw folder in your project\
    \ and add one `aaja.mp3` for music play.\n3. Add the following code in the Main\
    \ Activity Java file:\n```java\npackage com.example.marinamusicplayer;\n\nimport\
    \ android.media.MediaPlayer;\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\nimport android.widget.Button;\n\
    \npublic class MainActivity extends AppCompatActivity implements View.OnClickListener\
    \ {\n    Button play, pause, stop;\n    int pausePosittion;\n    MediaPlayer mediaPlayer;\n\
    \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n  \
    \      super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \        play = (Button) findViewById(R.id.btn_play);\n        pause = (Button)\
    \ findViewById(R.id.btn_pause);\n        stop = (Button) findViewById(R.id.btn_stop);\n\
    \        play.setOnClickListener(this);\n        pause.setOnClickListener(this);\n\
    \        stop.setOnClickListener(this);\n    }\n\n    @Override\n    public void\
    \ onClick(View view) {\n        switch (view.getId()) {\n            case R.id.btn_play:\n\
    \                if (mediaPlayer == null) {\n                    mediaPlayer =\
    \ MediaPlayer.create(getApplicationContext(), R.raw.aaja);\n                 \
    \   mediaPlayer.start();\n                } else if (!mediaPlayer.isPlaying())\
    \ {\n                    mediaPlayer.seekTo(pausePosittion);\n               \
    \     mediaPlayer.start();\n                }\n                break;\n      \
    \      case R.id.btn_pause:\n                if (mediaPlayer != null) {\n    \
    \                pausePosittion = mediaPlayer.getCurrentPosition();\n        \
    \            mediaPlayer.pause();\n                }\n                break;\n\
    \            case R.id.btn_stop:\n                if (mediaPlayer != null) {\n\
    \                    mediaPlayer.stop();\n                    mediaPlayer = null;\n\
    \                }\n                break;\n        }\n    }\n}\n```\n\n### How\
    \ to call one Activity to another\n1. The following is the code of XML (MainActivity):\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
    \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"match_parent\"\n    android:background=\"\
    @drawable/time\"\n    tools:context=\".MainActivity\"\n    android:layout_width=\"\
    wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
    Welcome to First Page\"\n    android:textSize=\"30dp\"\n    android:layout_centerHorizontal=\"\
    true\">\n\n    <Button\n        android:id=\"@+id/button\"\n        android:layout_width=\"\
    90dp\"\n        android:layout_height=\"90dp\"\n        android:layout_marginTop=\"\
    450dp\"\n        android:layout_centerHorizontal=\"true\"\n        android:text=\"\
    Next\" />\n</RelativeLayout>\n```\n2. The following is the code of Main Activity\
    \ Java file:\n```java\npackage com.example.marina_secret;\n\nimport android.app.Activity;\n\
    import android.content.Intent;\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\nimport android.widget.Button;\n\
    \npublic class MainActivity extends AppCompatActivity {\n    private Button button;\n\
    \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n  \
    \      super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \        button = (Button) findViewById(R.id.button);\n        button.setOnClickListener(new\
    \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
    \ v) {\n                Next();\n            }\n        });\n    }\n\n    public\
    \ void Next() {\n        Intent intent = new Intent(this, Activity2.class);\n\
    \        startActivity(intent);\n    }\n}\n```\n3. The following will be the code\
    \ of Activity 2 in XML file:\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
    http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
    \    android:layout_height=\"match_parent\"\n    android:background=\"@color/colorAccent\"\
    \n    tools:context=\".Activity2\">\n\n    <TextView\n        android:id=\"@+id/titleid\"\
    \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:text=\"Second Page List\"\n        android:textDirection=\"\
    firstStrong\"\n        android:textSize=\"30sp\"\n        android:textStyle=\"\
    italic\"\n        android:layout_centerHorizontal=\"true\"\n        android:textColor=\"\
    #FFFFFF\"\n        android:textScaleX=\"1\"/>\n\n    <ImageView\n        android:layout_width=\"\
    450dp\"\n        android:layout_height=\"350dp\"\n        android:layout_below=\"\
    @+id/titleid\"\n        android:src=\"@drawable/time\"\n        android:scaleType=\"\
    fitXY\"/>\n\n    <Button\n        android:id=\"@+id/button2\"\n        android:layout_width=\"\
    90dp\"\n        android:layout_height=\"90dp\"\n        android:layout_marginTop=\"\
    450dp\"\n        android:layout_centerHorizontal=\"true\"\n        android:text=\"\
    Next\"\n        android:textSize=\"20dp\"/>\n</RelativeLayout>\n```\n4. The following\
    \ code is of Activity 2 in Java file:\n```java\npackage com.example.marina_secret;\n\
    \nimport android.content.Intent;\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\nimport android.widget.ArrayAdapter;\n\
    import android.widget.Button;\nimport android.widget.ListView;\n\npublic class\
    \ Activity2 extends AppCompatActivity {\n    private Button button2;\n\n    @Override\n\
    \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_2);\n        button2 = (Button) findViewById(R.id.button2);\n\
    \        button2.setOnClickListener(new View.OnClickListener() {\n           \
    \ @Override\n            public void onClick(View v) {\n                Next();\n\
    \            }\n        });\n    }\n\n    public void Next() {\n        Intent\
    \ intent = new Intent(this, MainActivity.class);\n        startActivity(intent);\n\
    \    }\n}\n```\n\n### How to add banner ads in our project?\n1. Changes in Manifest\
    \ file add code as below:\n```xml\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK\"\
    \ />\n```\nAdd the following code inside meta-data (For more details you can visit\
    \ Google updation site):\n```xml\n<meta-data\n    name=\"com.google.android.ads.APPLICATION_ID\"\
    \n    value=\"ca-app-pub-873399301722397/92347129\"/>\n```\n2. Add the following\
    \ code in your Main Activity file:\n```java\nprivate AdView mAdView;\n// Added\
    \ for banner in my project.\nAds.initialize(this, \"ca-app-pub-873399301722397/92347129\"\
    );\nmAdView = findViewById(R.id.adView);\nAdRequest request = new AdRequest.Builder().build();\n\
    mAdView.loadAd(request);\n```\n3. Add the following code in XML file for ads:\n\
    ```xml\n<com.google.android.gms.ads.AdView\n    android:id=\"@+id/adView\"\n \
    \   android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
    \n    android:layout_centerHorizontal=\"true\"\n    android:layout_alignParentBottom=\"\
    true\"\n    android:layout_gravity=\"center\"\n    ads:adSize=\"BANNER\"\n   \
    \ ads:adUnitId=\"ca-app-pub-873399301722397/923471291\"/>\n```\n4. Add the following\
    \ library in Gradle library of your project:\n```gradle\nimplementation 'com.google.android.gms:play-services-ads:17.2.1'\n\
    ```\n\n### How to develop a feedback form in Android?\n1. Add the following code\
    \ in your manifest file for permission:\n```xml\n<uses-permission android:name=\"\
    android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"\
    \ />\n```\n2. Add the following code in your XML file help activity:\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<RelativeLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
    http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
    \    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"@dimen/activity_horizontal_margin\"\
    \n    android:paddingRight=\"@dimen/activity_horizontal_margin\"\n    android:paddingTop=\"\
    @dimen/activity_vertical_margin\"\n    android:paddingBottom=\"@dimen/activity_vertical_margin\"\
    \n    tools:context=\".HelpActivity\"\n    android:layout_width=\"wrap_content\"\
    \n    android:layout_height=\"wrap_content\"\n    android:text=\"@string/support\"\
    \n    android:textScaleX=\"2\"\n    android:textStyle=\"bold\"\n    android:textSize=\"\
    15sp\"\n    android:layout_marginTop=\"25sp\"\n    android:layout_marginStart=\"\
    120sp\">\n\n    <ImageButton\n        android:id=\"@+id/phone_icon1\"\n      \
    \  android:layout_width=\"40dp\"\n        android:layout_height=\"40dp\"\n   \
    \     android:layout_marginTop=\"45sp\"\n        android:src=\"@drawable/ic_message_black_24dp\"\
    \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
    wrap_content\"\n        android:layout_marginStart=\"50sp\"\n        android:layout_marginTop=\"\
    55sp\"\n        android:text=\"@string/app_not_download\" />\n\n    <ImageButton\n\
    \        android:id=\"@+id/phone_icon2\"\n        android:layout_width=\"40dp\"\
    \n        android:layout_height=\"40dp\"\n        android:layout_marginTop=\"\
    250sp\"\n        android:src=\"@drawable/ic_message_black_24dp\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginStart=\"\
    50sp\"\n        android:layout_marginTop=\"250sp\"\n        android:text=\"@string/delete_apps\"\
    \ />\n\n    <ImageButton\n        android:id=\"@+id/phone_icon\"\n        android:layout_width=\"\
    40dp\"\n        android:layout_height=\"40dp\"\n        android:layout_marginTop=\"\
    450sp\"\n        android:src=\"@drawable/ic_feedback_black_24dp\"\n        android:layout_width=\"\
    wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
    @string/contact_us\" />\n</RelativeLayout>\n```\n3. Add the following code in\
    \ Java Help file:\n```java\npackage com.island.test;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
    import android.content.Intent;\nimport android.os.Bundle;\nimport android.view.Menu;\n\
    import android.view.View;\n\npublic class HelpActivity extends AppCompatActivity\
    \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_help);\n\
    \        findViewById(R.id.btn_feedback).setOnClickListener(new View.OnClickListener()\
    \ {\n            @Override\n            public void onClick(View v) {\n      \
    \          sendFeedback();\n            }\n        });\n    }\n\n    @Override\n\
    \    public boolean onCreateOptionsMenu(Menu menu) {\n        getMenuInflater().inflate(R.menu.main,\
    \ menu);\n        return true;\n    }\n\n    //Start a new activity for sending\
    \ email\n    private void sendFeedback() {\n        final Intent _Intent = new\
    \ Intent(Intent.ACTION_SEND);\n        _Intent.setType(\"text/html\");\n     \
    \   _Intent.putExtra(Intent.EXTRA_EMAIL, new String[]{getString(R.string.mail_email)});\n\
    \        _Intent.putExtra(Intent.EXTRA_SUBJECT, getString(R.string.mail_subject));\n\
    \        _Intent.putExtra(Intent.EXTRA_TEXT, getString(R.string.mail_message));\n\
    \        startActivity(Intent.createChooser(_Intent, getString(R.string.title)));\n\
    \    }\n}\n```\n"
