    \ In this, we have to cover most frequently asked question & answers for student\
    \ & professional who is facing problem during the development. I’ve spent more\
    \ than six years working experience in IT industry. I’ve to collect information\
    \ from different types of sources including meeting someone in the same domain\
    \ & work with him etc. and I’ve to figure out what the problem is and how to resolve\
    \ it form this book.\n\nMy sincere thanks go to:\n- My publisher `BPB publication`\
    \ & his teams. He has brought enormous in my life. They always guided & encourage\
