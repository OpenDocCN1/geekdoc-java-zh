  trans: "\n\n# Android 应用开发基础\n\n面向初学者学习 Android 技术、SQLite、Firebase 和 Unity 的 Android\
    \ 开发指南，作者为 `Sujit Kumar Mishra`。\n\n**2020 年第一版**\n版权 © BPB Publications, 印度\n\
    ISBN: 978-93-89845-204\n保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段复制、分发或在数据库或检索系统中存储本书的任何部分，可以在计算机系统中输入、存储和执行的程序列表外，但这些程序不能通过出版手段进行复制。\n\
    \n## 免责声明\n本书中包含的信息是真实、正确的，并根据作者和出版者所知的最佳信息。作者已尽一切努力确保这些出版物的准确性，但对书中任何信息可能导致的任何损失或损害不承担责任。书中提到的所有商标均确认为其各自所有者的财产。\n\
    \n### 分销商：\n- **BPB PUBLICATIONS**: 20, Ansari Road, Darya Ganj, New Delhi-110002,\
    \ 电话: 23254990/23254991\n- **MICRO MEDIA**: Shop No. 5, Mahendra Chambers, 150\
    \ DN Rd. Next to Capital Cinema, V.T. (C.S.T.) Station, MUMBAI-400 001, 电话: 22078296/22078297\n\
    - **DECCAN AGENCIES**: 4-3-329, Bank Street, Hyderabad-500195, 电话: 24756967/24756400\n\
    - **BPB BOOK CENTRE**: 376 Old Lajpat Rai Market, Delhi-110006, 电话: 23861747\n\
    \n由 Manish Jain 为 BPB Publications 出版（地址：20 Ansari Road, Darya Ganj, New Delhi-110002），并在\
    \ Repro India Ltd, Mumbai 印刷。\n\n献给 `Sudha Mishra`，我的母亲，她慈爱的精神依然支持着我。\n\n## 关于作者\n\
    `Sujit Kumar Mishra` 是一位经验丰富的软件工程师，过去七年来一直与客户和合作伙伴一起设计技术解决方案。在职业生涯中，`Sujit Kumar\
    \ Mishra` 在 `C# .Net`、`Java (Android)`、`PHP`、`SAP (MM)` 以及数据库 `SQL Server`、`MySQL`\
    \ 等关键 IT 活动中进行过。他曾在 `Tata Steel`、`BPCL`、`Sun pharma` 和 `KPMG` 担任高级软件职位和项目管理职位。\n\
    \n2020 年，`Sujit Kumar Mishra` 创立了自己的网站，目前在那里担任创始人兼首席技术官。`Sujit Kumar Mishra` 还写了其他四本书：小说《神秘岛\
    \ Zoya》、《Dot net & MVC 面试题：面试准备，如何致富》以及 2019 年出版的《一日数学》。在工作之外，`Sujit Kumar Mishra`\
    \ 是一位出演过电视和宝莱坞电影的演员。\n\n## 谢谢\n我想感谢几位在本书写作期间向我持续支持的人。首先，我要感谢我的父母和朋友 `Anoop Sriwastawa`、`Pritesh\
    \ Sawant` 和 `Harish`，感谢在我花费许多周末和晚上写作时包容我——没有他们的支持，我永远无法完成这本书。\n\n如果没有 IT 团队中一些关键供应商和合作伙伴的支持，这本书就不会诞生。我感谢\
    \ `Computer world` 团队，特别是 `Pritesh Sawant`，他为其中的一些新功能提供了宝贵的见解。最后，感谢 `BPB Publications`\
    \ 给我这个机会为他们写我的第一本书。\n\n## 前言\nAndroid 技术是由美国 Google 开发的技术。它是全球销售最畅销、用户最多的技术。`Android\
    \ framework` 是一个我们可以为用户开发 Web 应用程序、移动应用程序、地图、多媒体应用和云服务的平台。在此，我们必须涵盖在开发过程中遇到问题的学生和专业人士最常见的问题解答。我在\
    \ IT 行业拥有六多年的工作经验。我必须从不同类型的来源收集信息，包括与同一领域的人见面并合作等，并且必须从书中找出问题所在以及如何解决它。\n\n诚挚地感谢：\n\
    - 我的出版者 `BPB publication` 及其团队。他给我的生活带来了巨大的变化。他们总是指导并鼓励我工作。\n- 读这些材料的 Android\
    \ 书书读者，没有你们，它无法完成。\n- 最后，一直鼓励我的朋友和家人。\n\n## 序言\n与目前现有的应用程序交付解决方案以及应用程序通常如何交付到物理手机相比，Android\
    \ 的应用层化仍然是一项近期进展。这种旧的应用程序交付模型必须改变，以采用虚拟环境提供的完整特性和功能。\n\n这种改变是为了解决如何向无状态虚拟机交付应用程序的问题。这种无状态或非持久的按需交付和构建虚拟机模型意味着终端用户并不“拥有”他们的虚拟机，而是根据需要分配一台全新的、新构建的机器。当他们下次登录时，将再次登录到一个新构建的设备。\n\
    \nApp Volumes 提供了什么？从高层次来说，`App Volumes` 提供实时应用交付，可以作为您的 `android` 实时服务器的交付系统。本书的主要目标是提供必要的信息，以理解\
    \ Android 应用以及如何工作。\n\n## 第一章：Android 基础\n### 第 1 节：介绍\n应用层化作为一个概念以及如何工作。\n###\
    \ 第 2 节\n本节提供了关于 `Android App` 要求的必要信息。\n### 第 3 节：问题与解答\n本节提供了关于 Android 设备的常见答案。\n\
    ### 第 4 节：练习\n本节提供了实用的 解决方案，并在未来的 Android 应用中进行练习。\n\n## 第二章：SQLite 与 Android\n\
    ### 第 1 节\n使用 `SQLite` 的实际截图显示了不同的组件以及如何工作。\n### 第 2 节：问题与解答\n本节提供了根据业务要求的分步说明以及如何工作。\n\
    ### 第 3 节：Firebase 服务\n对于 Android 设备，这是最常见的实时数据。\n### 第 4 节：Unity 服务\n包括 2D 和\
    \ 3D 游戏开发以及 Android 界面。\n### 第 5 节：Android 项目\n这是 Android Android 开发者的实用部分。\n\n\
    ## 实现示例\n\n### 如何开发 SMS 应用\n1. 在 Activity XML 中添加以下代码：\n```xml\n<?xml version=\"\
