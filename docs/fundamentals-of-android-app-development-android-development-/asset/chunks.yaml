    or shrink them to save space. Android practical fundamental question and answer  What
    is the Android SDK? For the development of any mobile application in Android Studio
    we need some tools, and this requirement is satisfied by Android SDK, which is
    a set of tools that are used for developing or writing apps. It’s a GUI, which
    emulates the Android environment. The Android Emulator acts like an actual mobile
    device on which the developers write their code and then debug/test the same code
    to check if anything is wrong or debug on the mobile. What is Context in Android? The
    Android Context is a handle to the android system; it provides services like resolving
    resources, obtaining access to databases and preferences, and so on. An Android
    app has activities. Context is like a handle to the environment your application
    is currently running in. There are two types of context using on Android:  Application
    Context Activity Context What is Activity in Android? The Activity performs actions
    on the screen. If you want to do any operations, we can do it with activity. We
    can create multiple activities as per our requirement on Android Studio for our
    application. In Activity, we can add UI part and logical coding as per our application
    requirement. What is the APK format? The APK format of the application bundle
    is in one file. The Android packaging key is compressed with classes, user interface,
    supportive assets, and manifest. All files are compressed to a single file is
    called APK. What is build type in Gradle? How to use them? The Android build types
    define properties that Gradle uses when building and packaging of your Android
    app. A build type defines how a module is built, for example, whether ProGuard
    is run. A product flavor defines what is built, such as which resources are included
    in the build. Gradle creates a build variant for every possible combination of
    your project’s product flavors and builds types. The build type Gradle automatically
    downloads packages whenever we add any new package for our project. If Gradle
    is not built properly we get an error in our application. What is intent in Android? The
    intent is connected to either the external world of application or the inner world
    of application, such as opening a PDF is intent, connect to the web browser, and
    more. We can have used various types of intent for our activity. We can have used
    two types of intent explicit intent and implicit intent. What is a manifest file
    in the Android project? The manifest file is an XML file in our Android project.
    Every Android application must have an AndroidManifest.xml file in its root directory.
    The manifest file presents essential information about your app to the Android
    system, information the system must have before it can run any of the app’s code.
    In the manifest file, we can add authorization permission and deference type of
    services as per our application requirement. How may the type of notification
    available in an Android device? There are three types of notification available
    on an Android device as given below:  Toast notification: It will show a pop-up
    message on the surface of the window. And after some time, it will be automatically
    closed. Status bar notification: It will show notifications on the status bar. Dialogue
    notification: It is an activity related notification for your Android. What is
    ADB? The Android Debug Bridge (ADB) is used for debugging the application. ADB
    is a command-line tool that performs shell commands. ADB is used for direct communication
    between the emulator ports. It gives direct control of the communication between
    the emulator instances to the developer. What are Loaders in Android? The Android
