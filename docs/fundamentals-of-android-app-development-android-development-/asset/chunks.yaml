    \ `SQL Server`, `MySQL`, etc. He has also worked in senior software roles and\
    \ project management roles for `Tata Steel`, `BPCL`, `Sun pharma`, and `KPMG`.\n\
    \nIn 2020, `Sujit Kumar Mishra` founded his Website, where he works today, the\
    \ Founder and Chief Technology Officer. `Sujit Kumar Mishra` is also written four\
    \ other books: `Mysterious Island Zoya` (Novel), `Dot net & MVC interview questions:\
    \ Interview preparation, how to be rich`, and `One Day Mathematics`, which is\
    \ published in 2019. Outside work, `Sujit Kumar Mishra` is an Actor who worked\
    \ on TV & Bollywood Movies.\n\n## Acknowledgement\nThere are a few people I want\
    \ to thank for the continued and ongoing support they have given me during the\
