    span="">xmlns:android=”http://schemas.android.com/apk/res/android”</relativelayout>xmlns:app=”http://schemas.android.com/apk/res-auto”xmlns:tools=”http://schemas.android.com/tools”android:layout_width=”match_parent”android:layout_height=”match_parent”android:background=”@drawable/background”tools:context=”.MainActivity” <imagebutton
    _="" span=""></imagebutton>android:layout_width=”match_parent”android:layout_height=”279dp”android:background=”@drawable/logo3”
    / android:id=”@+id/btn_play”android:layout_width=”90dp”android:layout_height=”90dp”android:layout_centerHorizontal=”true”android:layout_marginTop=”550dp”android:background=”@drawable/play”/ android:id=”@+id/btn_pause”android:layout_width=”90dp”android:layout_height=”90dp”android:layout_marginLeft=”10dp”android:background=”@drawable/pause”android:layout_toStartOf=”@id/btn_play”android:layout_toLeftOf=”@id/btn_play”android:layout_alignBottom=”@id/btn_play”android:layout_marginRight=”50dp”android:layout_marginEnd=”20dp”/ android:id=”@+id/btn_stop”android:layout_width=”90dp”android:layout_height=”90dp”android:layout_alignEnd=”@id/btn_play”android:layout_alignRight=”@id/btn_play”android:layout_alignBottom=”@id/btn_play”android:layout_marginEnd=”-114dp”android:layout_marginRight=”-114dp”android:layout_marginBottom=”-1dp”android:background=”@drawable/stop”/ Basic
    info for code change as per requirement: android:background=”@drawable/background” This
    code is used for image background in my project I’ve used drawable folder adding
    a few images for designing purpose for example:  background.jpg logo.png (for
    logo) logo3.jpg (for design) pause.png (for pause image button) play.png (for
    play button) stop.png (for stop button) 2) All the above image are added in the
    default drawable folder in my project you can add design as per your choice. I
    have to add one new raw folder in my project and add one MP3 for local storage
    aaja.mp3 for music play. In music play, don’t add long names; use a small one. 3)
    Add the following code in the Main Activity Java file: package com.example.marinamusicplayer; import
    android.media.MediaPlayer;import android.support.v7.app.AppCompatActivity;import
    android.os.Bundle;import android.view.View;import android.widget.Button; public
    class MainActivity extends AppCompatActivity implements View.OnClickListener {Button
    play,pause,stop;int pausePosittion;MediaPlayer mediaPlayer; @Overrideprotected
    void onCreate(Bundle savedInstanceState) {super.onCreate(savedInstanceState);setContentView(R.layout.activity_main);play=(Button)
    findViewById(R.id.btn_play);pause=(Button) findViewById(R.id.btn_pause);stop=(Button)
    findViewById(R.id.btn_stop);play.setOnClickListener(this);pause.setOnClickListener(this);stop.setOnClickListener(this);} @Overridepublic
    void onClick(View view){switch ( view.getId()) {case R.id.btn_play:if (mediaPlayer
    == null){mediaPlayer = MediaPlayer.create(getApplicationContext(), R.raw.aaja);mediaPlayer.start();}else
    if (!mediaPlayer.isPlaying()){mediaPlayer.seekTo(pausePosittion);mediaPlayer.start();}break;case
    R.id.btn_pause:if (mediaPlayer != null) {pausePosittion = mediaPlayer.getCurrentPosition();mediaPlayer.pause();}break;case
    R.id.btn_stop:if(mediaPlayer!=null){mediaPlayer.stop();mediaPlayer=null;}break;}}} We
    will get the following output: ![](image-nwndv8ke.jpg) Figure (P) 1.2: Music player Develop
    a simple project to call one Activity to another Activity? OR How to call one
    page to another page by clicking the button? 1) The following is the code of XML
    Activity (Main Activity): version=”1.0” encoding=”utf-8”?<relativelayout _=""
    span="">xmlns:android=”http://schemas.android.com/apk/res/android”</relativelayout>xmlns:app=”http://schemas.android.com/apk/res-auto”xmlns:tools=”http://schemas.android.com/tools”android:layout_width=”match_parent”android:layout_height=”match_parent”android:background=”@drawable/time”tools:context=”.MainActivity” android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:text=”Welcome
    to First Page”android:textSize=”30dp”android:layout_centerHorizontal=”true”android:textColor=”#FFFFFF” android:id=”@+id/button”android:layout_width=”90dp”android:layout_height=”90dp”android:layout_marginTop=”450dp”android:layout_centerHorizontal=”true”android:text=”Next”android:textSize=”20dp”
    / In this project, we have to add a few images for the background and image button
    for design purposes. The following will be the output for the XML file: ![](image-es85nka6.jpg) Figure
    (P) 1.3: Main activity in XML(First page) 2) The following is the code of Main
    Activity in Java file: package com.example.marina_secret;import android.app.Activity;import
    android.content.Intent;import android.support.v7.app.AppCompatActivity;import
    android.os.Bundle;import android.view.View;import android.widget.Button; public
    class MainActivity extends AppCompatActivity {private Button button;@Overrideprotected
    void onCreate(Bundle savedInstanceState) {super.onCreate(savedInstanceState);setContentView(R.layout.activity_main);button
    = (Button) findViewById(R.id.button);button.setOnClickListener(new View.OnClickListener()
    {@Overridepublic void onClick(View v) {Next();}});}public void Next(){Intent intent
    = new Intent(this,Activity2.class);startActivity(intent);}} 3) The following will
    be the code of Activity 2 in XML file: version=”1.0” encoding=”utf-8”?<relativelayout
    _="" span="">xmlns:android=”http://schemas.android.com/apk/res/android” xmlns:app=”http://schemas.android.com/apk/res-auto”</relativelayout>mlns:tools=”http://schemas.android.com/tools”android:layout_width=”match_parent”android:layout_height=”match_parent”android:background=”@color/colorAccent”tools:context=”.Activity2” android:id=”@+id/titleid”android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:text=”Second
    Page List”android:textDirection=”firstStrong”android:textSize=”30sp”android:textStyle=”italic”android:layout_centerHorizontal=”true”android:textColor=”#FFFFFF”android:textScaleX=”1” <imageview
    _="" span=""></imageview>android:layout_width=”450dp”android:layout_height=”350dp”android:layout_below=”@+id/titleid”android:src=”@drawable/time”android:scaleType=”fitXY”/ android:id=”@+id/button2”android:layout_width=”90dp”android:layout_height=”90dp”android:layout_marginTop=”450dp”android:layout_centerHorizontal=”true”android:text=”Next”android:textSize=”20dp”
    /  We will get the following output of the above XML file: ![](image-jq4xwurw.jpg) Figure
    (P) 1.4: Main activity in Java(Second Page) 4) The following code is of Activity
    2 in Java file: package com.example.marina_secret; import android.content.Intent;import
    android.support.v7.app.AppCompatActivity;import android.os.Bundle;import android.view.View;import
    android.widget.ArrayAdapter;import android.widget.Button;import android.widget.ListView; public
    class Activity2 extends AppCompatActivity {private Button button2;@Overrideprotected
    void onCreate(Bundle savedInstanceState) {super.onCreate(savedInstanceState);setContentView(R.layout.activity_2);button2
    = (Button) findViewById(R.id.button2);button2.setOnClickListener(new View.OnClickListener()
    {@Overridepublic void onClick(View v) {Next();}});}public void Next(){Intent intent
    = new Intent(this, MainActivity.class);startActivity(intent);}} The following
    screenshot shows the final output: ![](image-ubx68lt8.jpg) Figure (P) 1.5: Output
    after clicking on “Next” button in the first page How to add banner ads in our
    Android project? The following changes of code in our application as given below: 1)
    Changes in Manifest file add code as given below: <uses-permission _="" span="">android:name=”android.permission.ACCESS_NETWORK_STATE”></uses-permission> Add
    the following code inside meta-data (For more details you can visit Google ads
    updation site): android:name=”com.google.android.gms.ads.APPLICATION_ID”android:value=”ca-app-pub-8733993011722397~1692276577”/> 2)
    Add the following code in your Main Activity file: // Added for Ads banner in
    my project.private AdView mAdView;Button bt;// Added for Ads banner in my project.
    as on 26.05.2019 after Main ActivityMobileAds.initialize(this,” \n” +”ca-app-pub-8733993011722397~1692276577
    “);mAdView = findViewById(R.id.adView);AdRequest adRequest = new AdRequest.Builder().build();mAdView.loadAd(adRequest); 3)
    Add the following code in XML file for ads: //Chnages on XML Code<com.google.android.gms.ads.adview
    _="" span=""></com.google.android.gms.ads.adview>xmlns:ads=”http://schemas.android.com/apk/res-auto”android:id=”@+id/adView”android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:layout_centerHorizontal=”true”android:layout_alignParentBottom=”true”android:layout_gravity=”center”android:layout_marginTop=”280dp”ads:adSize=”BANNER”ads:adUnitId=”ca-app-pub-8733993011722397/9234712919”> 4)
    Add the following library in Gradle library of your project: implementation ‘com.google.android.gms:play-services-ads:17.2.1‘ How
    to develop a feedback form in Android? 1) Add the following code in your manifest
    file for permission: <uses-permission _="" span="">android:name=”android.permission.INTERNET”
    /</uses-permission><uses-permission _="" span="">android:name=”android.permission.ACCESS_NETWORK_STATE”
    /></uses-permission> 2) Add the following code in your XML file help activity: version=”1.0”
    encoding=”utf-8”?<relativelayout _="" span="">xmlns:android=”http://schemas.android.com/apk/res/android”</relativelayout>xmlns:app=”http://schemas.android.com/apk/res-auto”xmlns:tools=”http://schemas.android.com/tools”android:layout_width=”match_parent”android:layout_height=”match_parent”android:paddingLeft=”@dimen/activity_horizontal_margin”android:paddingRight=”@dimen/activity_horizontal_margin”android:paddingTop=”@dimen/activity_vertical_margin”android:paddingBottom=”@dimen/activity_vertical_margin”tools:context=”.HelpActivity” android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:text=”@string/support”android:textScaleX=”2”android:textStyle=”bold”android:textSize=”15sp”android:layout_marginTop=”25sp”android:layout_marginStart=”120sp”/ <imagebutton
    _="" span=""></imagebutton>android:layout_marginTop=”45sp”android:layout_width=”40dp”android:layout_height=”40dp”android:id=”@+id/phone_icon1”android:src=”@drawable/ic_message_black_24dp”/ android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:layout_marginStart=”50sp”android:layout_marginTop=”55sp”android:text=”@string/app_not_download”
    / <imagebutton _="" span=""></imagebutton>android:layout_marginTop=”250sp”android:layout_width=”40dp”android:layout_height=”40dp”android:id=”@+id/phone_icon2”android:src=”@drawable/ic_message_black_24dp”/ android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:layout_marginStart=”50sp”android:layout_marginTop=”250sp”android:text=”@string/delete_apps”
    / <imagebutton _="" span=""></imagebutton>android:layout_marginTop=”450sp”android:layout_width=”40dp”android:layout_height=”40dp”android:id=”@+id/phone_icon”android:src=”@drawable/ic_feedback_black_24dp”/> android:layout_width=”wrap_content”android:layout_height=”wrap_content”android:text=”@string/contact_us”android:textScaleX=”2”android:textStyle=”bold”android:textSize=”15sp”android:layout_marginTop=”420dp”/ android:id=”@+id/btn_feedback”android:layout_width=”match_parent”android:layout_height=”wrap_content”android:layout_marginTop=”500dp”android:text=”@string/button_feedback”
    / We will get the following output: ![](image-num3c8hr.jpg) Figure (P) 1.6: Support In
    this code, we are adding few icons in a from assets of Android file: drawable>
    new> Vector Assets > Clip Art (Click double) and select icon as you wish. 3) Add
    the following code in Java Help Activity file: package com.island.test; import
    androidx.appcompat.app.AppCompatActivity;import android.content.Intent;import
    android.os.Bundle;import android.view.Menu;import android.view.View; public class
    HelpActivity extends AppCompatActivity {@Overrideprotected void onCreate(Bundle
    savedInstanceState) {super.onCreate(savedInstanceState);setContentView(R.layout.activity_help); findViewById(R.id.btn_feedback).setOnClickListener(new
    View.OnClickListener() {@Overridepublic void onClick(View v) {}});findViewById(R.id.btn_feedback).setOnClickListener(new
    View.OnClickListener() {@Overridepublic void onClick(View v) {sendFeedback();}});} public
    boolean onCreateOptionsMenu(Menu menu) {// Inflate the menu; this adds items to
    the action bar if it is present.getMenuInflater().inflate(R.menu.main, menu);return
    true;} //Start a new activity for sending a feedback emailprivate void sendFeedback()
    {final Intent _Intent = new Intent(android.content.Intent.ACTION_SEND);_Intent.setType(“text/html”);_Intent.putExtra(android.content.Intent.EXTRA_EMAIL,
    new String[]{ getString(R.string.mail_feedback_email) });_Intent.putExtra(android.content.Intent.EXTRA_SUBJECT,
    getString(R.string.mail_feedback_subject));_Intent.putExtra(android.content.Intent.EXTRA_TEXT,
    getString(R.string.mail_feedback_message));startActivity(Intent.createChooser(_Intent,
    getString(R.string.title_send_feedback)));}} When you click in Send Feedback button,
    you can share/send email as per your requirements. We will get the following output: ![](image-cmadxomx.jpg) Figure
    (P) 1.7: Share feedback How to Implement Google Map in your projects? The Google
    map is identification for your business. The Google map is providing your geographical
    location of the business in a global network. Its necessary steps are as follow: Add
    the following code given below: Create Project | Google Map Activity | Next |
    Finished: ![](image-o8is3c7v.jpg) Figure (P) 1.8: API key You’ll get the above
    output after running the code. Copy this and paste it to your browser. It will
    give the following screen: −https://console.developers.google.com/flows/enableapi?apiid=maps_android_backend&keyType=CLIENT_SIDE_ANDROID&r Paste
    in Google Browser for getting API Code. 1) Select create project and 2) Create
    API Key | Copy API Key. Like this: AIzaSyAAOGNE8m_rctmM4SFQCsz-Xwxo57PWIRI Add
    code in your Manifest file for permission: <uses-permission _="" span="">android:name=”android.permission.ACCESS_FINE_LOCATION”
    /></uses-permission><uses-permission _="" span="">android:name=”android.permission.ACCESS_COARSE_LOCATION”
    /></uses-permission><uses-permission _="" span="">android:name=”android.permission.INTERNET”
    /></uses-permission> Add API Key in Manifest file: <meta-data _="" span=""></meta-data>android:name=”com.google.android.geo.API_KEY”android:value=”AIzaSyAAOGNE8m_rctmM4SFQCsz-Xwxo57PWIRI”
    /> Add the following code in your Map Java Activity file: package com.androidworld.googletestmap;import
    androidx.fragment.app.FragmentActivity;import android.os.Bundle;import com.google.android.gms.maps.CameraUpdateFactory;import
    com.google.android.gms.maps.GoogleMap;import com.google.android.gms.maps.OnMapReadyCallback;import
    com.google.android.gms.maps.SupportMapFragment;import com.google.android.gms.maps.model.LatLng;import
    com.google.android.gms.maps.model.MarkerOptions; public class MapsActivity extends
    FragmentActivity implements OnMapReadyCallback {private GoogleMap mMap; @Overrideprotected
    void onCreate(Bundle savedInstanceState) {super.onCreate(savedInstanceState);setContentView(R.layout.activity_maps);//
    Obtain the SupportMapFragment and get notified when the map is ready to be used.SupportMapFragment
    mapFragment = (SupportMapFragment) getSupportFragmentManager().findFragmentById(R.id.map);mapFragment.getMapAsync(this);} /***
    Manipulates the map once available.* This callback is triggered when the map is
    ready to be used.* This is where we can add markers or lines, add listeners or
    move the camera. In this case,* we just add a marker near Sydney, Australia.*
    If Google Play services are not installed on the device, the user will be prompted
    to install* it inside the SupportMapFragment. This method will only be triggered
    once the user has* installed Google Play services and returned to the app.*/ @Overridepublic
    void onMapReady(GoogleMap googleMap) {mMap = googleMap;// Add a marker in Sydney
    and move the cameraLatLng sydney = new LatLng(-34, 151);mMap.addMarker(new MarkerOptions().position(sydney).title(“Android
    Test Map”));mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));}} There will
    be no changes in XML file, and we will get the following output of map: ![](image-wa5xvdri.jpg) Figure
    (P) 1.9: Google mapIndex ACID – Page - 35Activity – Page – 3Activity Life Cycle
