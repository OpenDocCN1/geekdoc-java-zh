  md: "# Exercise 51: Arrays Without Foreach Loops\n\nAs you might noticed by now,\
    \ arrays and foreach loops are designed to work together well. there are situations\
    \ where we have been doing won't.\n\n+   - A foreach loop can't iterate through\
    \ an array backward; it can only go forward.\n- A foreach loop can't be used to\
    \ change the values in the array. The foreach loop variable is a read-only copy\
    \ of what's in the array and changing it doesn't affect the array.\n\nIn addition,\
    \ we have only putting values into an initializer list (the curly braces thing),\
    \ which has its limitations:\n\n+   - An initializer list only works when the\
    \ array is first being declared; you can't use it elsewhere in the code.\n- An\
    \ initializer list is best suited for relatively small arrays, if you have 1000+\
    \ values in the array, an initializer list will be no fun.\n- Initializer lists\
    \ don't help us if we want the values in the array to come from a file or other\
    \ place we don't have when we are typing the code.\n\nSo there is another way\
    \ to store values in an array and access them. In fact, it is more common than\
    \ what you have been doing. Using square brackets and a slot number, we can access\
    \ the slots of an array individually.\n\nArraySlotAccess.java\n\n```\npublic class\
    \ ArraySlotAccess {\n    public static void main( String[] args ) {\n        int[]\
    \ arr = new int[3];\n\n        // We always use a for loop to access each slot\
    \ of an array.\n        for ( int i=0; i < arr.length; i++) {\n            arr[i]\
    \ = 1 + (int)(Math.random()*100);\n        }\n    }\n\n    // Displaying all the\
    \ values in an array usually looks like this\n```"
