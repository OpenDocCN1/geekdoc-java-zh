  md: "# Exercise 29: Do-While loops\n\nIf the condition of the while loop is true\
    \ the very first time it is checked, then code using a while loop and equivalent\
    \ code using a do-while loop will behave exactly the same. Anything you can do\
    \ with a while loop you can do with (slightly different code) and vice-versa.\n\
    \nSo why would the developers of Java bother to make a do-while loop? Because\
    \ sometimes what you're checking in the condition is something you don't know\
    \ until you have gone through the body of the loop at least once.\n\nIn this case,\
    \ you are flipping a coin and using an if statement. Then we ask them if they\
    \ want to flip again or stop. The condition of our loop repeats if they say they\
    \ want to flip again.\n\nIf we had done this with a while loop, the condition\
    \ would look like this:\n\n```\nwhile ( again.equals(\"y\") {\n\n```\n\nThis is\
    \ fine, and would work, but the variable again doesn't get a value until line\
    \ 24. And so our code wouldn't compile because again (in the words of the Java\
    \ compiler) \"might not have been initialized.\" And so we would have to give\
    \ it a value before the loop that doesn't mean anything and is only there to parse\
    \ the compiler.\n\nThat is annoying, so the do-while loop allows us to leave our\
    \ condition same but wait until the end to check it. This is handy.\n\nBefore\
    \ we get to the Study Drills, I should explain a bit more about how I \"flipped\
    \ a coin\" in this case. Hopefully you remember that Math.random() returns a random\
    \ double between 0 and 1. So The Boolean expression\n\n```\nMath.random() < 0.5\n\
    ```\n\n...is true exactly 50% of the time. We store that value (true or false)\
    \ into the variable getHeads and use it to test it to later.\n\nI need this result\
    \ twice (lines 13 and 30), so I store it into a variable. I understand that feels\
