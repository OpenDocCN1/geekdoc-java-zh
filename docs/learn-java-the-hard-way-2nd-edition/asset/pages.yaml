  md: '# Exercise 53: Mailing Addresses

    (Records)


    Today''s exercise is about what I call "records". In the programming languages
    C and C++ they are called "structs". An array is a bunch of different values in
    one variable where the values are all the same type and they are distinguished
    by index (slot number). A record is few different values in one variable but the
    values can be different types and they are distinguished by name (usually called
    a "field")^27


    Type the following code into a single file named MailingAddresses.java. The line
    that says class Address is correct but you can''t name your file Address.java
    or it won''t work.


    MailingAddresses.java


    ```

    1 class Address {

    2 String street;

    3 String city;

    4 String state;

    5 int zip;

    6 }

    7

    8 public class MailingAddresses {

    9 public static void main(String[] args) {

    10 Address uno, dos, tres;

    11

    12 uno = new Address();

    13 uno.street = "191 Marigold Lane";

    14 uno.city = "Miami";

    15 uno.state = "FL";

    16 uno.zip = 33179;

    17

    18

    19 dos = new Address();

    20 dos.street = "3029 Los Lane";n21 dos.city = "Crafton";

    ```


    > ^27There''s only one problem with it: Java doesn''t actually have records. It
    turns out that a nested class with methods and only public fields works just like
    a struct, tres; if it isn''t the Java Way.

    But I care if it is the Java Way or not. I have been teaching students a long
    time and I believe that you can understand object-oriented programming very well
    if you don''t understand records. So I am going to fake it in a way that works
    perfectly and would be very nice code in lots of different programming languages.

    Some diehard-object-oriented Java-beard is going to stumble across this exercise
    and send me a nasty email that I am Doing Wrong and why I am filling these poor
    ''beads'' with lies? Oh, well.'
