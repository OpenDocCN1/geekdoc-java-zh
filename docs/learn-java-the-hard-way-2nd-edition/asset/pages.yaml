- pgno: 7
  md: '# Preface: Learning by Doing


    I have been teaching beginners how to code for the better part of two decades.
    More than 2,000 students have taken my classes and left knowing how to write simple
    programs that work. Some learned how to do only a little and others gained incredible
    skill over the course of just a few years.


    I have plenty of students who are exceptional and most of my students are regular
    kids with no experience and no particular aptitude for programming. This book
    is written for regular people like them.


    Most programming books and tutorials are written by people with great natural
    ability and very little experience with real beginners. Their books often cover
    far too much material far too quickly and overestimate what true beginners can
    understand.


    If you have lot of experience or extremely high aptitude, you can learn to code
    from almost any source. I sometimes read comments like "I taught my 9-year-old
    daughter to code, and she made her first Android app six weeks later!" If you
    are the child prodigy, this book is not written for you.


    I have also come to believe that there is no substitute for writing lots of small
    programs. So that''s what you will do in this book. You will type in small programs
    and run them.


    > "The best way to learn is to do." – P.R. Halmos'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Introduction: Java


    Java is not a language for beginners. I am convinced that most “beginner” Java
    books only work for people who already know how to code or who are prodigies.


    I can teach you Java, even if you have never programmed before and even if you
    are not a genius. But I am going to teach you how to cheat at.


    What I will teach you is Java. But it is not *all* of Java. I have to leave parts
    out because you''re not ready for them. But if you think you are ready for the
    more complex parts of Java, then 1) you''re wrong, and 2) buy a different book.
    There are a great many books on the market that will throw all the complexity
    Java has, faster than you can handle.


    In particular, I have one huge omission: I am going to avoid the topic of Object-Oriented
    Programming (OOP). I''m pretty that uncomfortable beginners can''t learn how to
    code and also learn object-oriented programming at the same time. I have almost
    never seen it.


    I am writing a follow-up book that covers Object-Oriented Programming and some
    of the more complex parts of Java. But you should finish this book first. I have
    been teaching students to program for many, many years, and I have never had a
    student visit me from college and say “I wish you had spent time on the fundamentals."


    # What You Will Learn


    +   - How to install the Java compiler and a text editor to write programs,

    - How to create, compile and run your first Java program.

    - Variables and getting input from the user and from files.

    - Making decisions with if statements

    - Loops (for, while, do-while)

    - Arrays

    - Records


    In the final chapter you will write a not-so-simple text-based adventure game
    with levels loaded from text files. You should also be able to write a text-based
    card game like Hearts or Spades.


    All the examples in this book will work in version 1.5 of Java or any newer version.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# What You Will Not Learn


    +   - Graphics

    - Object-oriented programming

    - How to make an Android app

    - Specifics of different "versions" of Java

    - Javascript


    No graphics


    I like graphics, and they''re not hard in Java compared to, say, C++, but I can''t
    cover everything

    and teach the basics well, so nothing had to go.


    No OOP


    Object-oriented programming has no place in an introductory book, in my opinion.


    No Android


    Android apps are pretty complex, and if you''re a beginner, an app is way beyond
    your ability.

    Nothing in this book will hurt your chances of making an app, though, and the
    kinder, gentler

    pace may keep you going when other books would frustrate you into quitting.


    No specific version


    I will not cover anything about the differences between Java SE 7 and Java SE
    8, for example.

    If you care about the difference, then this book is not for you.


    I will also not cover anything that was only recently added to Java. This book
    is for learning

    the basics of programming and what has changed about the basics of Java in many
    years.


    No Javascript


    > "Javascript" is the name of a programming language and "Java" is also the name
    of a

    programming language. These two languages have nothing to do with each other.
    They are\completely unrelated.


    I hope to write more books after this one. My second book will cover object-oriented
    programming

    in Java. My third book will cover making a simple Android app, assuming you have
    finished through

    the first two books.


    # How to Use This Book


    Although I have provided a zipfile containing the source code for all the exercises
    in the book, you

    should type them in.


    For each exercise, type in the code. Yourself, by hand. How are you going to learn
    otherwise? None

    of my former students ever became great at programming by merely reading others''
    code.


    Work the Study Drills. Then watch the Study Drill (if you have them) to compare
    your

    solutions to mine. And by the end you will be able to code, at least a little.'
  merge: -1
  img_proc: true
