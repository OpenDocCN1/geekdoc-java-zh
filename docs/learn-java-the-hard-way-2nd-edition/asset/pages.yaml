  md: "# Exercise 23: More String Comparisons\n\n(Course I couldn't resist adding\
    \ something new. On line 9 instead of the Scanner object's .next() method to read\
    \ in a String, I used the Scanner object's .nextLine() method to read in a String.\
    \ The difference is that .next() will stop reading if you type a space, so if\
    \ you typed \"visual basic\" it would only read \"visual\" and leave the rest\
    \ behind. When you use .nextLine() it reads everything you type including spaces\
    \ and tabs – until you press Enter and puts all into one long String and stores\
    \ it in the variable).\n\nYou compare Strings to each other using the String object's\
    \ .compareTo() method. The .compareTo() method doesn't work the way you probably\
    \ expect, but there is genius in how it works. The comparison involves two Strings.\
    \ The first String is the one to the left of .compareTo(). The second String is\
    \ the one in the parentheses. And the comparison simplifies to an integer! If\
    \ we call the first one self the second other it would look like this:\n\n```\n\
    int n = self.compareTo(other);\n```\n\nSo self compares itself to other. If self\
    \ is equal to other (the same length and every character is the same), then n\
    \ would be set to 0. If self comes before other alphabetically, then n would be\
    \ set to a negative number (a number less than 0). And if self comes after other\
    \ alphabetically, then n would be set to a positive number (a number greater than\
    \ 0).\n\nThe genius part is this: because .compareTo() gives us an integer instead\
    \ of a Boolean or false, we only need this one method to do all the comparisons:\
    \ less than, greater than, less than or equal to, whatever.\n\nSince if self is\
    \ equal to other we would get zero and since if self is less than other we would\
    \ get a number less than zero, we can write:\n\n```\n ( self.compareTo(other)\
