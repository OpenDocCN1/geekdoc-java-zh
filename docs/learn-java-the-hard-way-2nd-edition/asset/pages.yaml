  md: '# Exercise 39: Importing Standard Libraries


    ```

    Password: password

    5E8BA8498DA28047151D0E56F8DC6292773603D0D6AABBD062A11EF721D1542D8

    ```


    64-character string length is the SHA-256 digest of the String. That message digest
    will

    always be the same for your input.


    If you type in a different password, you will get a different digest, of course:


    ```

    Password: hunter2

    F52FB3D2B3B886FF88EF6C4906285F482AF15DDBC29541F94BC526A3F6C7

    ```


    Back in the early days of programming, when machines first started having usernames
    and

    password, it was pretty obvious that you wouldn''t want to store the passwords
    themselves in a

    database. Instead, they would store some sort of cryptographic hash of the password.

    Cryptographic hashes have two useful properties:


    +   1. They are consistent. A given input will always produce the same output.

    2. They are one-way. You can easily compute the output for a given input, but
    figuring out the input that you gave a certain input is very hard or impossible.


    SHA-256 is a very good hash function, and it produces a “digest” for a given input

    (or “message”) that is always exactly 256 bits long. Here instead of trying to
    deal with bits

    have printed out the base-16 representation of those bits. Since each hexadecimal
    (base-16) digit

    cresponds to 4 bits, we end up with an 64 characters long.


    Back in the 1970s, when you changed your password on a certain machine you would
    type your password

    and the machine would store your username and the hash of your new password in
    a file.


    Then when you wanted to log in the machine later, it would make you type in your
    username

    password. It would find the username in the password database file and find the
    stored hash of\your password. It would find the hash of whatever password you
    just typed. If the stored

    and the computed hash match, then you must have typed in the correct password
    and you would

    allowed access to the machine.


    This is a clever scheme. It is also much better than ever storing passwords directly
    in a database.

    However, nowadays computers are way too fast and have way much storage space for
    this to

    be enough security. Since machines can compute the SHA-256 of a password very
    quickly, it doesn''t

    take long for a determined hacker to figure out what your password was.'
