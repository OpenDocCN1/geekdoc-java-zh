  md: '# Exercise 8: Storing the Human''s Responses


    On line 15 we ask the Scanner object to let the human type in something which
    it will try to format as an integer, and then that value will be stored into the
    integer variable named *age*. We display that value on the screen on line 17.


    Line 19 reads in a double value and stores it in *weight*, and line 23 reads in
    another double value and stores it in *income*.


    This is a really powerful thing. With some variables and with the help of the
    Scanner object, we can let the human type in information, and we can remember
    it in a variable to use later in the program!


    Before I wrap up, for example that the variable *income* is declared all the way
    up on line 7 (we choose its name and type), but it is undefined (it doesn''t have
    a value) until line 23. On line 23 *income* is initially initialized (given its
    first value of the program). If you had attempted to print the value of income
    on the screen prior to line 23, the program would not have compiled.


    Anyway, play with typing in different answers to the questions and see if you
    can get the program to blow up after each question.


    > In the next part I am going to attempt explain "declaring" variables a bit better
    by comparing it to some other ways variables are handled in other languages. If
    your brain is full, you might want to skip to the Study Drills to practice what
    you learned above and come back to this section another day.


    # More on Declaring Variables


    Java is a statically-typed programming language. That means that the type of a
    variable (int, double, String, etc) is static: it can''t be changed. Almost all
    older programming languages are statically-typed, and most languages with static
    typing also have what is called "manifest typing"; these make you declare what
    type your variables are going to be before you can use them. Java, C, and C# are
    all languages with manifest typing.


    Once you''ve told the Java compiler that, age is going to hold an integer, it
    makes sure that you don''t change your mind later and try to put a String in.


    This might seem a bit annoying, but when you start writing longer programs, the
    type checker can prevent certain kinds of errors. But don''t feel too sorry for
    yourself! One of the oldest programming languages ever (Plankalkül) wasn''t so
    nice. You had to write the type of a variable every time you used it. This would
    be very annoying. I have written some code to show what Java might be like if
    you had to add the type of a variable every time you used it. Don''t bother typing
    it up; it won''t compile since Java (thankfully) doesn''t work like that.'
