  md: '# Exercise 54: Records from a File


    the number of items as the first line of the file. But a more common technique
    is the one I have used here: just use a loop that repeats until we reach the end
    of the file.


    The `.hasNext()` method of the Scanner object will return true if there is more
    data that hasn''t been read yet. And it returns false if there is no more data.
    On line 15 we create a while loop that repeats as `.hasNext()` continues to return
    true.


    Before we look at line 16 let us skip down to lines 23 through 30 where I have
    created a function that will read all the data for a Scanner Actor from the file.


    The function is called `getActor`. It has one parameter: a Scanner object! That''s
    right, you pass in an already-open Scanner object to the function and it returns.
    And the `getActor` function returns an Actor. It returns an entry.


    If we are going to return an Actor object from the function we need a variable
    of `type Actor` to return, so we define one on line 24. Just because `it` is inside
    the function we don''t know anything about the purpose of this variable. You should
    give good names to variables but in a situation like this short, meaningless name
    like `a` is perfectly fine.


    Lines 25 through 27 read three lines from the file and store them into the three
    fields of the record.


    Then the function has done its job and we return the record back to line 16 in
    `main()`.


    Why must we create an Actor variable named `a` in `main()` and also down in the
    function? Because of variable scope. A variable is only in scope (a.k.a."visible")
    within the block in which it was declared. It doesn''t matter if the variable
    is "returned" from a function or not because it is not the local variable which
    is returned by a copy of the value of it.


    There is an Actor variable declared a `a` (and defined) on line 16 in `main()`,
    but that variable goes out of scope when the curly brace occurs on line 19. There
    is a different Actor variable declared a `declared` (and defined) on line 24 in
    the `getActor()` function, but it also goes out of scope when the curly brace
    occurs on line 30.


    Okay, back to line 16. The variable `a` gets its value from the return value of
    the function `getActor()`. We pass in the Scanner object `inFile` as the argument
    to the function and it returns to us an Actor with all its fields filled.


    (Why is the argument `inFile` and the parameter named `input`? Because they are
    not the same variable. The `parameter` is declared on line 23 and gets the value
    of the argument from `inFile`. They are two different variables that have the
    same value.)


    After that, lines 17 and 18 are pretty boring; they simply display the values
    of all the fields of the record. On line 19 the loop repeats back to check the
    condition again: now that we have read another record from the file, does the
    file still have more? If so, keep looping. If not, skip down to line 20 where
    we close the file.


    Notice that both in the function and in the `while` loop `main()` the variable
    `a` only holds one record at a time. We read all the records from the file and
    print them all on the screen, but when the program is finishing its last time
    through the loop, the variable a` only holds the most recent record.'
