- pgno: 61
  md: '# Exercise 10: Variables Only Hold Values


    | How much is the purchase price? 7.99 |

    | Item price: 7.99 |

    | Sales tax: 0.0 |

    | Total cost: 0.0 |


    Are you surprised by the output? Did you expect the sales tax on $7.99 to show
    something like $0.66 instead of a big fat zero? And the total cost should have
    been something like $8.65, right? What happened?


    What happened is that in Java (and most programming languages), variables can
    not hold formulas. Variables can only hold values.


    Look at line 10. My students think that line stores the *formula price * 0.0825*
    into the variable *salesTax* and then later the human stores the value 7.9 into
    the variable. They think that on line 17 we print *salesTax* that the computer
    "runs" the formula somehow.


    This is not what happens. In fact, this program shouldn''t have compiled. The
    variable price doesn''t even have a proper value on line 10. The only reason it
    has a value is because I declared something on line 8.


    Normally we have declaring variables up at the top of our programs and initializing
    them later. But on line 8 I declared *price* and *initialized* a variable at the
    same time, that is called "defining" the value. *salesTax* and *total* are not
    defined on line 8, just declared.


    So on line 14 the human types in doesn''t *initialize price*; *price* already
    has an initial value (0). But the human types in (7.99 or whatever) *does get
    stored into the variable before execution*. The ø is replaced with 7.99.


    From line 8 until 13 the variable *price* contains the value. When line 14 is
    executing and we are waiting for the human to type something, *price still contains
    ø*. But by the time line 14 is completed, whatever human typed has been stored
    into price, replacing the zero. From line 15 until the end of the program, the
    variable *price contains the value 7.99 (or whatever was typed in).


    So with this, we can see what really happens on line 10. Line *does not store*
    a formula into *salesTax* but it does store a value. What value? It takes the
    value of the variable *price at this point in the code* (which is ø), multiplies
    it by 0.0825 (which is still zero), and stores that zero into *salesTax*.


    As line 10 is beginning, the value of *salesTax* is undefined. (*salesTax is declared
    but not defined.) By the end of line 10, *salesTax holds the value ø*. There is
    no line of code that changes *salesTax* (there is no line of code that begins
    with *salesTax =*), so value never changes and *salesTax* is still zero when it
    is displayed on line 17.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Exercise 10: Variables Only Hold Values


    Line 11 is similar. It takes the value of price right then (zero) and adds it
    to the value of salesTax right then (also zero) and stores the sum (zero) into
    the variable total. Total''s value is never changed, and total does not ''remember''
    that its value came from a formula involving some variables.


    So there have it. Variables hold values, not formulas. Computer programs are not
    a set of rules, they are a sequence of instructions that the computer executes
    in order, and things later in your code depend on what happened before.


    > (It actually is possible, of course, to package up a formula and attach a name
    to it. Then using name in your code will cause the formula to run each time it
    is referenced. We call it "function definition" and a "function call", but it''s
    too complicated to discuss right now. And it isn''t happening in this program,
    in any case.)


