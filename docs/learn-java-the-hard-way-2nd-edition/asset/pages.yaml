  md: '# Next Steps


    I highly recommend working through them. Once you''ve done that, here are some
    other resources for practice:


    +   - CodingBat³⁵ - short, targeted practice problems. These are especially good
    practice for students preparing for the Advanced Placement (AP) exam in Computer
    Science.

    - ProjectEuler³⁶ - a series of challenging mathematical/computer programming problems
    that will require more than mathematical insights to solve. While mathematics
    will help you arrive at elegant and efficient methods, the use of a computer and
    programming skills will be required to solve most problems.


    # You don''t know OOP.


    Java is an object-oriented language. No matter how good you get at assignments
    like mine, you can never call yourself a Java programmer until you know OOP well.


    I am writing a sequel to this book that teaches object-oriented programming: I
    hope to have finished by April 2016 or least by September 2016. You don''t have
    to email me to ask if it''s done, though; I can promise you I won''t keep it a
    secret. learnjavatethehardward.org will definitely mention the new book once it''s
    done.


    You can also see if it has been published at Leanpub yet at <leanpub.com/javahard2>.
    However, until it''s finished I will have to recommend other people''s books.


    +   - Java Methods³⁷ by Maria and Gary Litvin - an excellent book designed to
    prepare students for the APCS exam. Teaches objects and object-oriented programming
    from the very beginning.

    - any other highly-rated Java book on Amazon. Almost all books that teach you
