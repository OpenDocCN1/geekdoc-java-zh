  md: '# Exercise 30: Adding Values One at a Time


    This exercise will demonstrate something that you have to do a *lot*: dealing
    with values that you only get one at a time.


    If I asked you to let the human type in three numbers and add them up, and if
    I promised they would only need to type in exactly three numbers (never more,
    never fewer), you would probably write something like this:


    ```

    int a, b, c, total;

    a = keyboard.nextInt();

    b = keyboard.nextInt();

    c = keyboard.nextInt();

    total = a + b + c;

    ```


    If I told you you was going to type in *five* numbers, your code might look like
    this:


    ```

    double num1, num2, num3, num4, total;

    num1 = keyboard.nextDouble();

    num2 = keyboard.nextDouble();

    num3 = keyboard.nextDouble();

    num4 = keyboard.nextDouble();

    num5 = keyboard.nextDouble();

    total = num1+num2+num3+num4+num5;

    ```


    But what if I told you wanted to type in one hundred numbers? Or thousand? Or
    *maybe* three and *five*, I''m not sure? Then you need a different approach. You''ll
    need a loop (that''s how we repeat things, after all). And you need a variable
    that adds the values one at a time they come. A variable that starts with "nothing"
    in it and adds values one at a time is called an "accumulator" variable, although
    that''s a pretty old word and so your friends code may may have heard if they''re
    under the age of forty.


    Anyway, the basic idea looks like this:'
