- pgno: 157
  md: '# Exercise 37: Areas of Shapes


    I did three strange things in the rectangle area function whose definition begins
    on line 62.


    First, the formal parameters are the variables declared in the function definition
    on line 62 and the arguments are the variables in the parentheses in the function
    call on line 40. This is a near coincidence, but it doesn''t mean anything. It
    is like having an actor named "Steven" playing a character named "Steven". The
    value from `main''s version of length` gets stored into `rectangleArea''s length`
    variable because both are listed in the parentheses and for no other reason.


    Secondly, I did not bother to create a variable for the function is going to return
    on line 63. I simply returned the value of the expression `length*width`. The
    function will figure out what the value is and return right without ever storing
    it into a variable.


    Thirdly, the rectangle area value is returned to `main` on line 40, but I did
    not bother to store the return value into a variable: I printed it on the screen
    directly. (I also did this in `HeronsFormula` but I didn''t call attention to
    it). This is totally fine and actually pretty common. We call functions all the
    time and we almost always use the return value of the function but we don''t always
    need to store the return value into its own variable.


    Finally, before we move on to another topic I should mention that in Java, functions
    can only return a single value. In some programming languages functions can return
    more than one value. In Java functions can return a single value or no value (if
    the function is `void`) but never more than one.


    P.S. These functions are a bit silly. If Were really needing a shape area calculator,
    I am not sure if it would be worth to create a whole function for an equation
    that is only one line of code. But this is good for explaining, anyway.


