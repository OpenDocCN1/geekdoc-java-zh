  md: '# Exercise 23: More Comparisons


    ```

    if ( self.compareTo(other) < 0 ) // true when self < other

    if ( self.compareTo(other) <= 0 ) // true when self <= other

    if ( self.compareTo(other) > 0 ) // true when self > other

    if ( self.compareTo(other) >= 0 ) // true when self >= other

    if ( self.compareTo(other) == 0 ) // true when self == other

    if ( self.compareTo(other) != 0 ) // true when self != other

    ```


    So that''s the idea. Pretty confusing for beginners, and slightly harder to use
    but not bad at all once you get to it.


    The other difficulty (and this is not just a .compareTo() thing, it happens everywhere
    in code unless you write code to fix it) is capitalization matters. "Bob" is not
    the same value as "bob". And what''s worse is that because of the Unicode values¹³
    of the letters, "Bob" comes before "bob" alphabetically. If you want to avoid
    this issue, there are lots of ways, but like one of these:


    ```

    if ( self.toLowerCase().compareTo(other.toLowerCase()) < 0 ) // or

    if ( self.compareToIgnoreCase(other) < 0 )

    ```


    Or you can let the human type whatever they want and convert it to lower-case
    right away and then compare it to lower-case things in your code.


