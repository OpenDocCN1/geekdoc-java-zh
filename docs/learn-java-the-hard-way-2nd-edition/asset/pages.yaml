    This exercise is ridiculous. There is no good reason that any self-respecting
    programmer would ever write the code to draw a flag on the screen like this. It
    is okay if writing this program feels a little silly. But functions are important
    and I prefer to start with silly examples that you can actually understand instead
    of realistic examples that are too hard to follow.


    So how we even trace through the execution of a program like this? We start at
    the beginning: the first line of `main()`. On line 5 the first thing `main` does
    is call the function `printTopHalf()`. So main gets put on pause and execution
    jumps down to the first line of the `printTopHalf()` function, which is on line
    53.


    The first thing that `printTopHalf` moves on to line 56, which is another function
    we will call be the top of the flag. After execution moves on to line 56, which
    is **another function call**! `main()` is still on pause, waiting for `printTopHalf()`
    to finish, and now `printTopHalf()` itself is on pause, waiting for `printSixStarLine()`
    to finish and return control to.


    `printSixStarLine()` begins on line 44, where it calls the `print6Stars()` function.
    That function (thankfully) only displays something on the screen when the close
    curly brace of `print6Stars()` comes on line 37, it returns control back to the
    second line (line 45) of `printSixStarLine()`, which then has another function
    call. This runs through the body of the function `print290hs()` and comes back
    to line 46. So `printSixStarLine()` ends, which returns control to the end of
    line 56.


    At this point, I explaining all the functions will be more confusing than just
    following the execution path on your own, which you will do in the Study Drill.'
