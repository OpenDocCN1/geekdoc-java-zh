  md: 'Exercise 30: Adding One at a Time


    On line 13 the human gets to type in a number. This is inside the body of a do-while
    loop, which runs at least once no matter what, so this code always happens. Let''s
    pretend they type 3 at first.


    On line 14 the magic happens. We add the value the human typed to whatever value
    is already in the variable total. There''s a zero in total at first, so this line
    of code adds to current and stores new number back into total. Total no longer
    has a zero in it; it has the same value current did. Total was zero, now it is
    3.


    We print the subtotal and on line 16 to check if current is zero. Let''s say it
    is a 4. The variable total gets changed to current (4) plus total''s existing
    value (3), so total is now 7.


    The condition is checked again, and the process continues. Eventually the human
    types a 0, that zero gets added to the total (which doesn''t hurt it) and the
    condition is false so the do-while loop stops looping.


