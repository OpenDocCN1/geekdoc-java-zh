  md: '# Exercise 56: Array of Records from a File (Temperatures Revisited)


    6717 daily temperatures loaded.

    Average daily temperature over 540 days in November: 59.7


    Lines 3 through 6 declare our record, which will store a single average daily
    temperature value (a double) but also has fields for the month, day and year.


    Line 14 defines an array of records. We have a problem, though. We can''t define
    an array without providing a capacity and we don''t know the capacity until we
    see how many records are in the file. There are three possible solutions to this
    problem:


    +   1. Don''t use an array. Use something else like an array that can automatically
    grow as you add entries. This is actually the right solution, but that "something
    else" is beyond the scope of this book.


    +   2. Read the file twice. Do once just to count the number of records and then
    create the array with the perfect size. Then read it all the values into the array
    to slurp until it''s slow.


    +   3. Don''t worry about making the array right size. Just make it "big enough."
    Then count how many records you actually have while reading them in and count
    instead of the array''s capacity for loops. This is not perfect, but it works
    and it''s easy. Writing software sometimes requires compromise, and this is one
    of them.


    Line 14 declares the array and defines it to ten thousand slots: "big enough."


    On line 17 we start a loop to read all the values from the file. We are using
    an index variable i to keep track of which slot in the array needs to be filled
    next. Our loop keeps going as long as the file has more integers in it we haven''t
    run out of capacity in our array.


    Just because we used a shortcut by making our array "big enough" does not mean
    we are going to be stupid about it. If the file ends up bigger than our array''s
    capacity we want to stop reading the file too early than blow the program with
    an ArrayOutOfBoundsException.


    Line 18 defines a TemperatureRecord name e. Lines 19 through 22 load the next
    few values from the file into the appropriate fields of that record.


    But Remember that there are "missing" values in our file. Some days have a temperature
    reading of -99, so we put it in an if statement on line 23 to detect whether we
    put into our database.


    On line 24 there is something new: The Java keyword continue. continue is only
    legal inside body of a loop. And it means "skip the rest of code in the body of
    the loop and go back up to the top for the next iteration."


    This effectively throws away the current (invalid) record because it skips lines
    25 and 26, which store the current record in the next available slot in the array
    and then increment the index.


    Some people don''t like to use continue and write it like this:'
