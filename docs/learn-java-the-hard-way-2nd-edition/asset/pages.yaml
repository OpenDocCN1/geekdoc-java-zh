    that, yet.)


    So on line 12 we check to see if they followed directions. If the value in x is
    negative (less than zero) we go back up to line 12 and check if the condition
    is still true. They are still failing to follow directions? If so, display the
    error message again and we give them another chance.


    Computers get impatient or bored, so the human is trapped in this loop until they
    comply. They could type negative numbers two billion times and each time the computer
    would politely complain and make them something again.


    Eventually, the human will wise up and type a non-negative number. The condition
    of the loop will be false (false) and the body of the loop will be skipped (finally)
    and execution will pick up on line 17 where we can save the square root of a number
    that we know positive.


    Real programs like this all over. You have to do it because humans are unreliable
    and often do unexpected things. What happens when your toddler pulls himself up
    to your laptop and starts smashing keys while a program is running? Would we like
    the program not to crash.


