  md: '# Exercise 52: Lowest Temperature


    Line 24 we create a Scanner object to read data from a file, but instead of getting
    the data from a file, we get the information from a URL. One of the nice things
    about Java is that this is only a tiny change.


    Now, I do a trick with text file that I learned many years ago. At the time I
    am writing this chapter, my file contains 6717 temperatures. But maybe you are
    reading this a year later and I want to update the file to add more temperatures.
    So the first line of the file is just a number: 6717. Then after I have 6717 lines
    of temperatures, one per line.


    Line 25 in this code I read the count from the first thing in the file. And I
    use that to decide how my array should be on 27. So now months from now if I decide
    to add more temperatures to the file, all I have to change the first line of my
    file to match and this code will still work. Not a bad trick, eh?


    Line 27 we define an array of doubles with count slots. (Currently 6717.0)


    Line 29 there''s a loop that iterates through each slot in the array, and on line
    30 we read a double each time (fin.nextDouble()) and store it in the next indexed
    slot in array.


    When the loop ends, I close() the function. Then on line 33 the array is returned
    from the function and that array is stored in the array temps back on line 7 of
    main().


    Line 9 we put out the current value of the array to make sure nothing went wrong
    with the reading.


    Line 11 we create a variable that will eventually hold the lowest temperature
    in the whole array. At first we put a very large value there.


    Line 13 is another for loop that is giving us all the legal indexes in the array.
    In this case, since the array has 6717 values in it, the indexes will run from
    0 to 6716.


    Line 14 compares the value we are currently looking at in the array (depending
    on the current value of i). If that value is less than whatever is in lowest,
    then we have a new record! On line 15 we replace what was used to be in lowest
    with this smaller value.


    And the loop continues until all the values in the array have been compared. When
    the loop ends, the variable lowest also contains the smallest value.


    There is a small function down on lines 36 through 38 to convert a temperature
    from degrees Fahrenheit to degrees Celsius. On line 20 we display the temperature
    as it came from the file and converted to Celsius.


    You may be thinking that 22.1F (-5.5C) is not a very cold temperature. Well, that''s
    for you. Also remember that the temperatures aren''t the lowest temperature of
    the day, they are the average of 24 hourly temperature samples for each day.'
