- pgno: 30
  md: 'Exercise 1: An Important Message


    # Compiling Your First Program


    Now that the program has been written and hopefully contains no mistakes (we''ll
    see soon enough), launch your Terminal (or PowerShell) and change into the directory
    where the code is saved.


    Then do a directory listing to make sure the Java file is there. On my computer,
    those commands look like this:


    ```

    mitchell@localhost:~$ cd Documents

    mitchell@localhost:~/Documents$ cd javahard

    mitchell@localhost:~/Documents/javahard$ ls

    FirstProg.java test.txt

    mitchell@localhost:~/Documents/javahard$

    ```


    In the future, since your terminal probably doesn''t look like mine, I am going
    to abbreviate the prompt like this:


    ```

    cd Documents

    cd javahard

    ls

    ```


    That will be less confusing, since there is less "wrong" stuff to ignore and you
    only have to look at what you should type and what you should see.


    Okay. We have typed a list of instructions in a programming language called Java.
    But the computer cannot execute our commands directly in this form. We have to
    give this file to a "compiler", which is a program that will translate our instructions
    into something like ones and zeros that the computer can execute. In Java that
    ones-and-zeros file is called "bytecode". We are going to run the Java compiler
    to "compile" your source code into a bytecode file that we will be able to execute.


    The Java compiler is named javac (the ''c'' is for "compiler"). It is properly
    pronounced "java-see", though many people say "java-ack". (Those people are incorrect,
    but they are reasonable).


    Anyway, we use javac to compile our program like so:


    ```

    javac FirstProg.java

    ```


    If you have extraordinary attention to detail and did everything that I told you,
    this command will take a second to run, and then the terminal will just display
    the prompt again without showing anything else.


    However, if you made some sort of mistake, you will see an error like this:'
  merge: -1
  img_proc: true
