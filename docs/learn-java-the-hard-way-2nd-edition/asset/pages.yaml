  md: 'Exercise 58: Final Project - Text Adventure Game


    ```

    slams behind you. There is no handle on the interior of the door.


    There is no escaping. Type "quit" to die.

    > quit

    ```


    Before I start talking about the code, let me take a moment to talk about the
    adventure game "file format".


    The game consists of several "rooms". Each room has a room number and a room name;
    these are only used for the game engine and are never shown to the player.


    Each room also has a description and one or more "exits". An exit is a path to
    another room.


    The adventure game starts with a number: the total number of locations (rooms)
    in the game. After that there are records for each room. Here''s an example of
    a record for a single room.


    1

    ITCHEN


    There is a long countertop with dirty dishes everywhere. Off to one side there
    is, as you''d expect, a refrigerator. You may open the "frigerator" or "go back".


    ```

    %

    fridge:3

    refrigerator:0

    go back:0

    back:0

    %%

    ```


    The first line of this record is the room number, so this is room number 1. The
    second line of the record is the room name, which we only use for debugging.


    Starting with the third line of the record is the description of the room, which
    continues until there is a line with nothing %% on it. Blank lines are allowed
    in the description. Each line has the name of the exit (what the player will type
    to that route) followed by a colon, followed by the room number that it leads.


    For example, in this room if the player types "fridge" then the game engine will
    move them from this room (room #1) into room #3. If they type "go back" then they
    will "travel" to room #0. You may that in order to make it easier for the player
    to decide what to type I have duplicate exits in the list. Either the word "fridge"
    or "refrigerator" will take them to room #3. The list of exits ends with another
    line containing %%%. And that''s the end of the record.'
  merge: -1
