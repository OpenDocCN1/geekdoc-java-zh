    In main(), lines 27 through 34 are pretty boring. Before I explain the for loop,
    I need to explain two String class methods: charAt() and length().


    If you have a String you can get a single char out of it using the charAt() method.
    Like so:


    ```

    String s = "Howdy";nchar c = s.charAt(2);

    // Now c == ''w''

    // s.length() is 5

    ```


    charAt() is zero-based, it gets the first character of a String. And if s.length()
    tells you how many characters are there in s, then s.charAt(s.length()-1) gets
    the final character.


    Now we can understand the for loop on line 36. The initialization declares a loop
    control variable and sets it to zero. The condition is as long as i is less than
    the number of characters in the message. And the update adds one to i each time.


    On line 37, a lot of things are happening. We use the charAt() method to pull
    out the i-th character of the plaintext message. That character and the shift
    value are passed as arguments to the shiftLetter() function, which returns the
    shifted letter. And finally shifted letter is tacked on the end of the String
    cipher.


    By the time the loop ends, it has gone through each letter of the message one
    at a time and built up new message from the shifted versions of the letters.


