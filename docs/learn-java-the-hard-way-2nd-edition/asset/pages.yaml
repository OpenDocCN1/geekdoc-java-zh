    main() always has an open brace. And on line 12 is the end of the function''s
    body, and there''s a curly brace. The function definition starts on line 10 and
    ends on line 12.


    What does the function do? It prints the "There." on the screen.


    Now let''s get back to main() and look at the function inside the body of main().


    On line 3 we print the String "Here." on the screen. Then on line 4 you will see
    a "function call." This line tells the computer to jump down to the function erebor(),
    run all the code in the body of that function, and return to line 4 that has been
    accomplished.


    So when we see that we call the erebor(), the String "There." gets printed on
    the screen right after the String "Here." When the computer runs line 4, execution
    of the program pauses in main(), skips over all the rest of the code in main(),
    jumps down to line 10, runs all the code in the body of the function erebor()
    (all 1 of line 11) and then execution hits the curly brace on line 12, it returns
    back to the end of line 4 and unpauses the execution in main(). It runs line 5
    next.


    On line 5 it displays another message on the screen, then on line 6 there is another
    function call. The function erebor is called a second time. main() pauses on line
    6, jumps and runs through the body of erebor (which prints the String "There."
    again), then returns back to line 6 where execution of main() resumes.


    Finally line 7 prints one last String on the screen. Execution proceeds to the
    close curly brace of main(). When main() ends, the program ends.


    That''s pretty important, so I will say when main() ends, the program ends. If
    you have a bunch of different functions inside the class, program execution begins
    with the first line of main(). And once the last line of main() has been executed,
    the program starts running even if there are functions that never got called.
    (We will see an example of this in the next exercise.)'
