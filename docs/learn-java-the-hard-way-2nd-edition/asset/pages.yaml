  md: '# Exercise 14: Compound Boolean Expressions


    Enter your age: 40

    Enter your yearly income: 49000

    How cute are you, on a scale from 0.0 to 10.0? 7.5

    Allowed to date my grandchild? false


    We can see that for complicated Boolean expressions you can use parentheses to
    group things, and you use the symbols && to mean "AND" and || to mean "OR".


    I know what you are thinking: using & (an "ampersand" or "sign") to mean "AND"
    makes a little sense, but why two of them? And whose idea was it to use | ("pipe
    pipe") to mean "OR??",


    > Well, Ken Thompson''s idea, probably. Java syntax is modeled after C++s syntax,
    which was basically copied from C''s syntax, and that was modified by B''s syntax,
    was invented by Dennis Ritchie and Ken Thompson.


    The programming language B used to mean "AND" and "OR", but they were "bitwise":
    they only worked on two integers and would walk one bit at a time the integers
    doing a bitwise AND or OR on each pair of bits, putting a 1 or 0 in the output
    for each comparison. (| was probably used because it was mathematical-looking
    and was a key on the keyboards of the PDP-7 computer and B was originally developed
    for.)


    When Ken and Dennis started developing the programming C to replace B, they decided
    there was a need for a logical "AND" and "OR", and the one-symbol-long things
    were already taken, so they used ampersands to represent logical "AND" and two
    vertical bars or "pipes" to represent logical "OR". When.


    Fortunately for you, you don''t need to know any of that. You just need to remember
    what to type and get it right.


    This next bit is going to be a little bit weird, because I''m going to show you
    the "truth tables" for AND and OR, and you''ll have to think of "AND" as an operation
    that is being performed on two values instead of conjunction.


    Here is the truth table for AND:


    | Inputs | Output |

    | A B | A & B |

    | true true | true |

    | true false | false |

    | false true | false |

    | false false | false |'
