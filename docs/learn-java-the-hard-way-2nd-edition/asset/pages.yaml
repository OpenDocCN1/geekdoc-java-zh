    On lines 18 through 21 we pick four new random numbers. We multiply each one of
    them by 10, then we cast all to to integers, then finally add 1 to each.


    This sequence of math operations turns each number into something that''s always
    from 1 to 10.

    The chunk of code picks more random numbers and does the same steps but ends up
    with random integers from 1 to 6. (That''s inclusive, so both 1 and 6 are possible.)
    Here are the steps:


    +   * `Math.random()` generates a random double from 0 to 0.9999999999

    * `6*Math.random()` scales it from 0 to 5.999999999999

    * `(int)(6*Math.random())` casts it to an integer, which throws away the part
    after the decimal point (truncates); from 0 to 5

    * `1 + (int)(6*Math.random())` adds one, translating it to be from 1 to 6


    Line 32 makes the computer choose a random integer from 1 to 100 and puts it into
    the variable a. Notice that a only contains a copy of the *value* of the number,
    so printing it out more than once just displays the same random number over and
    over. Just printing the value of *a* doesn''t magically make it again somehow.


    The next chunk of code picks four random numbers from 1 to 100 and puts their
    values into four variables, then displays them.


    The chunk of code on line 43 picks more random numbers, but since we didn''t add
    1 to all of them, their range is 0 to 99.


    (It''s hard to tell from the output, but trust me. If you run this program 10,000
    times line 47 would occasionally print out a and just occasionally print out 99
    but never 100 for any of the random numbers.)


    Starting on line 50, there''s a chunk of code that picks random numbers from 10
    to 20. Surprised?


    +   * `Math.random()` generates a random double from 0 to 0.9999999999

    * `11*Math.random()` makes it from 0 to 10.9999999999

    * `(int)(11*Math.random())` casts it to an integer from 0 to 10

    * `10 + (int)(11*Math.random())` adds 10 so it''s now from 10 to 20


    In general, you multiply it by *how many* random integers are in the range. Multiplying
    by 6 gives you six possible numbers.


    Then you add the number (after truncating/casting) is called the "origin" and
    is the *smallest* random you''ll end up with after all the math is done.


    There are eleven numbers from 10 to 20 (if you count both 10 and 20), that''s
    why we multiply by 11. And we add ten because we want to start at 10.


