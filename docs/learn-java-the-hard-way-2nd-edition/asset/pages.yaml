  md: "# ## Exercise 36: Returning a Value from a Function\n\nSome functions have\
    \ parameters and do not. Parameters are the only way to send values into a function.\
    \ There is also only one way to get a value out of a function: the return value.\n\
    \nThis exercise gives an example of a function that has three parameters (the\
    \ side lengths of triangle) and one response: the area of triangle using Heron's\
    \ Formula.\n\n```\nHeronsFormula.java\npublic class HeronsFormula {\n    public\
    \ static void main(String[] args) {\n        double a, g;\n        String twos\
    \ = \"\n        a = triangleArea(3, 3, 3);\n        System.out.println(\"A triangle\
    \ with sides 3,3,3 has area \" + a);\n        a = triangleArea(3, 4, 5);\n   \
    \     System.out.println(\"A triangle with sides 3,4,5 has area \" + a);\n   \
    \     g = triangleArea(7, 8, 9);\n        System.out.println(tws + \"7,8,9 has\
    \ area \" + g);\n        System.out.println(tws + \"5,12,13 has area \" + triangleArea(5,\
    \ 12, 13));\n        System.out.println(tws + \"4,9,11 has area \" + triangleArea(10,\
    \ 9, 11));\n        System.out.println(tws + \"8,15,17 has area \" + triangleArea(8,\
    \ 15, 17));\n    }\n\n    // This function computes the area of a triangle with\
    \ side lengths a, b, & c.\n    public static double triangleArea(int a, int b,\
    \ int c) {\n        double s = (a+b+c) / 2;\n        double A = Math.sqrt(s*(s-a)*(s-b)*(s-c));\n\
    \        // After computing the area, you must \"return\" the computed value:\n\
    \        return A;\n    }\n}\n```"
