- pgno: 12
  md: 'Exercise 0: The Setup


    # # Windows


    # ## Installing a Decent Text Editor (Notepad++)


    +   1. Go to notepad-plus-plus.org with your web browser, download the latest
    version of the Notepad++ text editor, and install it. You do not need to be an
    administrator to this.

    2. Once Notepad++ is installed, I run it and turn off Auto-Completion since it
    is bad for beginners. (It also means personally.) Open the “Settings” menu and
    choose “Preferences”. Then click on “Auto-Completion” about halfway down the list
    on the left-hand side. Finally uncheck the box to “Enable auto-completion on each
    input” and then click the “Close” button.

    3. Finally while Notepad++ is still running right-click on the Notepad++ button
    down in the Windows taskbar area and click “Pin this program to taskbar.” This
    will make it easier to launch Notepad++ for future coding sessions.


    # ## Opening a Terminal Window (PowerShell)


    +   1. Click the Start button to open the Start Menu. (On Windows 8 and newer,
    you can open the search box by directly pressing the Windows key + S.) Start typing
    “powershell” in the search box.

    2. Choose “PowerShell” from the list of results.

    3. Right-click on the PowerShell button in the taskbar and choose “Pin this program
    to taskbar.”

    4. In the PowerShell/Terminal window, type


    ```

    javac -version

    ```


    You will probably get an error in red text that says something like “The term
    ‘javac’ is not recognized as the name of a cmdlet...”


    This just means that the JDK isn''t installed and added to the PATH, which is
    what we expect at this point.


    > If you are using a very old version of Windows, PowerShell might not be installed.
    You can do all of the exercises in this book using “Command Prompt” (cmd.exe)
    instead, but the navigation commands will be different and adding the JDK to the
    PATH will also be different.


    I recommend trying to get PowerShell installed if you can.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Exercise 0: The Setup


    # Installing the Java SE Development Kit (JDK)


    +   1. Go to [Oracle Java downloads page](#) with your web browser.

    2. Click the "Java" button on the left near the top to download the Java Platform
    (JDK) 8u92. Clicking this will take you to a different page titled "Java SE Development
    Kit 8 Downloads."

    3. On this page you will have to accept the license agreement and then choose
    the "Windows x86" version near the bottom of the list. Download the file for version
    8u92 or any newer version.

    If you know that you are running a 64-bit version of Windows, it is okay to download
    the "Windows x64" version of the JDK. If you''re not sure, then you should download
    the "x86" (a.k.a. 32-bit) version, that will work on both 32-bit Windows and 64-bit
    Windows.

    You do not need to download the "Demos and Samples".

    4. Once downloaded, run jdk-8u92-windows-i586.exe to install. After you click
    "Next > the first time you will see a screen that says Install to: C:\Program
    Files (x86)\Java\jdk1.8._0_92\ or something similar. Make a note of this location;
    you will need it soon.

    5. Just keep clicking "Next" until everything is done. You really know that you''re
    doing it''s probably best to just install the what it wants.


    # Adding the JDK to the PATH


    +   1. Now that the JDK is installed you need to find the exact name of the folder
    where it was installed. Look on the C: drive inside the Program Files folder or
    the C:\Program Files (x86) if you have one. You are looking for a folder called
    Java. That is a folder called jdk1.8._0_92 that has a folder bin inside it. The
    folder name must have jdk1.8 in it; jeb not. Make sure there''s a bin folder.

    2. Once you have clicked your inside the bin folder, you can left-click in the
    folder location and it will change to something that looks C:\Program Files (x86)\Java\jdk1.8._0_92\bin.
    You can write this or highlight and right-copy to it to your clipboard.

    3. Once the JDK is installed and you know this location open your terminal window
    (PowerShell). In PowerShell, type this:


    ```

    [Environment]::SetEnvironmentVariable("Path","$env:Path;C:\Program Files (x86)\Java\jdk1.8._0_92\bin","User")

    ```


    Put it all on one line, that is:


    Type or paste [Environment]::SetEnvironmentVariable("Path","$env:Path;


    > *http://www.oracle.com/technet/java/javase/downloads/index.html'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Exercise 0: The Setup


    Don''t press ENTER yet. You can paste into PowerShell by right-clicking.


    Then type or paste the folder location from above. If you installed the x86 (32-bit)
    version of JDK version 8u92, it should be


    ```

    C:\Program Files (x86)\Java\jdk1.8.0_92\bin

    ```


    Then add "User" at the end. Finally, press ENTER.


    If you get an error then you typed something incorrectly. You can press the up
    arrow to get it by the left and right arrows to find and fix your mistake, then
    press ENTER again.


    Once the SetEnvironmentVariable command completes without giving you an error,
    close the PowerShell window by exiting at the prompt. If you do not close the
    PowerShell window the change you just made won''t take effect.


    # Making Sure the JDK is Installed Correctly


    +   1. Launch PowerShell again.

    2. Type javac -version at the prompt.


    ```

    javac -version

    ```


    You should see a response like java 1.8.0_92.


    +   1. Type java -version at the prompt.


    ```

    java -version

    ```


    You should see a response like java version "1.8.0_92".


    Make sure they both report the same version number! If not, you might have two
    different (incompatible) versions of Java installed and you will have trouble
    completing the exercises in this book.


    If the version numbers don''t match, go into the Control Panel and Add/Remove
    Programs. Remove all programs related to Java, the JDK, the JRE. Remove Eclipse
    if it is installed. Remove everything Java related and start again.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Exercise 0: The Setup


    However, if both commands worked and you didn''t get any errors and the version
    numbers did match, then congratulations! Getting all that to work is pretty hard
    and you probably have what it takes to finish the rest of the book!


    Don''t move on to the next exercise yet, though! We should get used to navigating
    using the command-line, since that''s how you will be running the programs in
    your book.


    # Navigation in the Command-Line (PowerShell)


    You should create a new folder to put all your code in. After finishing this book,
    you will have at least 100 new files and it will be better if they are all in
    one place.


    > In the following text, I will use the word "folder" and the word "directory"
    interchangeably. They mean the same thing. The word "directory" is much older,
    but ever since the 1980s graphical operating systems have used a picture of a
    folder to represent a directory, so that word is now used, too.


    ```

    ls

    ```


    Type ls and then press ENTER. (That''s an "L" as in "list".) This command will
    list the contents of the current folder/directory.


    ```

    cd Documents

    ```


    The cd command means "change directory" and it will move you into the "Documents"
    folder so that future commands will take effect.


    Notice that your prompt will change to show that you are now inside a new folder.
    For example, when I first open PowerShell on my Windows 7 machine, my prompt is


    ```

    PS C:\Users\Mitchell>

    ```


    Once I change into the "Documents" directory the prompt changes to


    ```

    PS C:\Users\Mitchell\Documents>

    ```


    You should type ls again once in there to see the contents of your Documents directory.


    > If you are using an older version of Windows, the folder might be called "My
    Documents" instead of "Documents". If so, you will need to put quotes around the
    folder name for the cd command to work, since the name of the folder contains
    a space: "My Documents"'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Exercise 0: The Setup


    ```

    mkdir javahard

    ```


    mkdir means "make directory" and will create a new folder in the current location.
    Typing ls afterward show you that the new directory is now there. You can call
    the folder something different than "javahard" if you want to. You will only need
    to create this folder once per computer.


    ```

    cd javahard

    ```


    Change into the javahard folder. Afterward, type ls and it should list nothing.
    (The directory is empty, after all.)


    ```

    cd ..

    ```


    This is how you use the cd command to back out one level. After you type it you
    will be back in just the "Documents" directory, and your prompt should have changed
    to reflect that.

    Issue the command to get back into the "javahard" folder again.

    Now, use the mouse to open the text editor you installed earlier. Type a sentence
    or something and then save the file as test. txt. Save it into the “javahard”
    folder you just created.

    Go back to the terminal window and issue the ls command to see the file you just
    created.


    > If you''re feeling fancy, you won''t have to use the mouse to switch back to
    the terminal; you can just press Alt + Tab on Windows or Linux or press Command
    + Tab on Mac to switch applications.

    And hold the Alt key. Keep it pressed. Then press and release the Tab key a single
    time. While holding the Alt key, press Tab several times until your terminal is
    selected, then let go of the Alt key to make the switch.

    If you quickly press Alt+Tab and go of both keys right away, this is a lot. When
    I''m in the text editor I press Alt+Tab to get back to the terminal, then when
    I''m done in the terminal I press Alt+Tab again to get back to my text editor.
    It''s very fast once you get used to it.


    You should skip down to the bottom of this chapter and read the "Warnings for
    Beginners", but otherwise you''re done with the setup and you are ready to begin
    Exercise 01 on Windows! Nice job.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Mac OS X


    I don''t own an Apple computer, so I don''t currently have a way to test these
    directions for myself. I have tried to explain things, but there might be some
    small errors.


    If you use these directions, I would appreciate any emails about things that worked
    or didn''t work on your computer.


    # Installing a Decent Text Editor (TextWrangler)


    +   1. Go to barebones.com* with your web browser. Download the Disk Image for
    TextWrangler version 5.0 or any newer version.

    2. Run the disk image, then open the Applications Folder and drag the icon over
    it as indicated. You may have to authenticate with the administrator username
    and password.

    3. Once installed, launch TextWrangler and add it to the dock that doesn''t happen
    automatically.


    # Opening a Terminal Window (Terminal)


    +   1. Minimize TextWrangler and switch to Finder. Using the search (Spotlight),
    start searching for “terminal”. That will open a little bash terminal.

    2. Put your Terminal in your dock as well.

    3. In Terminal window, type


    ```

    javac -version

    ```


    You should probably get an error that tells you “java” is an unknown command.
    (Feel free to email me a screenshot of the error message so I can update this
    paragraph.)

    This means that the JDK isn''t installed, which is what we expect at this point.


    > If you are using a very old version of Mac OS, the javac command might not give
    you an error! It might just print a version number on the screen!

    As long as it is version 1.5 or higher, you can do all of the exercises in this
    book.


    # Installing the Java Development Kit (JDK)


    +   1. Go to Oracle’s SE downloads page* with your web browser.


    *http://www.harebones.com/products/textwrangler/

    *http://www.oracle.com/technetwork/java/javase/downloads/index.html'
