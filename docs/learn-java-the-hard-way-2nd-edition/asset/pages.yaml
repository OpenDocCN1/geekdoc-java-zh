    easier. Lines 61 and 62 are identical to lines 59 and 60. And for the lines 63
    and 64. I mean, like byte-for-byte.


    We display this in a similar childish fashion over lines 65 through 75.


    But then maybe it occurs to you. "Why would I bother to type the exact same lines
    three times in a row when I could... You know a thing that allows you to repeat
    a chunk of code while making a single variable by each one time, right?


    That''s right: a for loop is just the thing. Not so silly after all, am I?


    Lines 79 through 88 are the same as lines 58 through 64 except that we let the
    for loop handle the repeating and the changing of the index. The initialization
    statement (the first part) of the for loop sets q to start at ø, which happens
    to be the smallest legal index for an array. The condition says "repeat this as
    long as q is less than .length (which is 3)." And note that it says less than,
    not less or equal to, which would be too far. The update statement (the third
    part) adds 1 to q each time.


    Lines 84 through 88 display the values on the screen.


    Here''s the thing: this sort of code on lines 79 through 88 might seem a bit complex,
    but working with arrays in Java you end up writing code like all the time. I cannot
    tell you how many times I have written a for loop just like that for array with
    an array.


