  md: "# Exercise 0: The Setup\n\nThis exercise has no code but **do not skip** it.\
    \ It will help you to get a decent text editor installed and to install the Java\
    \ Development Kit (JDK). If you do not do both of these things, you will not be\
    \ able to do any of the other exercises in the book. You should follow these instructions\
    \ exactly as possible.\n\nThis exercise requires you to do things in a terminal\
    \ window (also called a \"shell\", or \"command prompt\". If you have no experience\
    \ with a terminal, then you might need to go learn that.\n\nI'll tell you all\
    \ the commands to type, but if you're interested in more detail you want to check\
    \ out the first chapter of \"Conquering the Command Line\" by Mark Bates. His\
    \ book is designed for users of a \"real\" command line that you get on a Linux\
    \ or Mac OS X, but the commands will be similar if you are using PowerShell on\
    \ Windows.\n\nRead Mark's book at [conqueringthecommandline.com](http://conqueringthecommandline.com).\n\
    \nYou are going to need to do three things what kind of system you have:\n\n+\
    \   1. Install a decent text editor for writing code.\n2. Figure out how to open\
    \ a terminal window so we can type commands.\n3. Install the JDK (Java Development\
    \ Kit).\n   And on Windows, you'll need to do a fourth thing:\n4. Add the JDK\
    \ to the system PATH.\n\n(The JDK commands are automatically added to the PATH\
    \ on Apple computers and on Linux computers.)\n\nI have instructions below for\
    \ Windows, then for the Mac OS, and finally for Linux. Skip down to the operating\
    \ system you prefer."
