- pgno: 239
  md: '# Exercise 58: Final Project - Text Adventure Game


    Okay, now let''s to the code. Lines 3 through 10 declare the record for one room.
    You can see we have fields for everything in the adventure game file. The only
    thing you might not have guessed is that the array of Strings (exits) and the
    array of destination room numbers (destinations) has an arbitrary capacity of
    10 and there''s a numExits field to keep track of how many exits there are actually
    in this room. Free to make this capacity larger if you need more than 10 exits
    in room.


    Moving into main(), line 17 declares the array of rooms and initializes it from
    the loadRoomsFrom-File() function that I will explain.


    Line 19 has a commented-call to the showAllRooms() function that is for debugging.


    On line 22 we see the definition of the currentRoom variable, which holds the
    room number of the player is. They start in room 0, which is the first room in
    the file. And on line 26 is the declaration of the String ans, which will hold
    whatever the player types.


    Line 24 is the beginning of the main loop. It repeats as long as the currentRoom
    variable is or more. So we use this to stop the game: when the player dies (or
    wins) we set currentRoom to -1.


    The array rooms contains a list of all the locations in the game. The number of
    room containing the player is stored in the variable currentRoom. So rooms[currentRoom]
    is the entire record for the... current room. In line 25 we set a copy of this
    room into the Room variable current (I only do this because I''m lazy and want
    to type things like .description instead of rooms[currentRoom].description).


    Speaking of that, line 26 prints out the description of the current room, which
    is stored in the description field.


    On lines 27 and 28 we print out a prompt and let the player enter in a String
    for they want to go.


    Lines 32 through 38 search through this room''s array of exits to see if any of
    them match what the typed. Remember that the exits has a capacity of 10, but there
    are probably not many exits actually present in this room. So in the loop we count
    up to the value of the numExits field instead of .exits.length.


    If we find an exit that matches the player''s command, we set our flag to true
    (so we know if should complain if they end typing something that''s not in our
    list). Then when the words in the exits line up with the room numbers of the destinations
    array and make that our room number grows. This way, when the main loop repeats
    again, we will automatically traveled to the new room.


    On line 39 we check our flag. If it''s false, it means the human typed something
    we never found in the list of exits. It can still complain. Because currentRoom
    hasn''t changed, looping around again in the main loop will just print the description
    for the room they were already


    And that''s the end of the main loop and the end of main(). All that''s left is
    actually fill up the array of rooms from the adventure game file.'
