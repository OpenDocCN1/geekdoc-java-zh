  md: "# Exercise 1: An Important Message\n\nIn this exercise you will write a working\
    \ program in Java to display an important message on the screen.\n\nIf you are\
    \ not used to typing detailed instructions for a computer then this could be one\
    \ of the harder exercises in the book. Computers are very stupid and if you don't\
    \ get every detail right, the computer won't understand your instructions. But\
    \ if you get this exercise done and working, then there is a good chance that\
    \ you will be able to handle every exercise in the book as long as you work it\
    \ every day and don't quit.\n\nOpen the text editor you chose and type the following\
    \ text into a single file named FirstProg.java. Make sure to match what I have\
    \ written exactly, including spacing, punctuation, and capitalization.\n\nFirstProg.java\n\
    \n```\npublic class FirstProg {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"I am determined to learn how to code.\");\n    \
    \    System.out.println(\"Today's date is \");\n    }\n}\n```\n\nI have line numbers\
    \ in front of each line, but do not type the line numbers. They are only there\
    \ so I can talk about the lines. Also, depending on whether or not you have saved\
    \ the file yet, the different words might not be colored at all. If they are colored,\
    \ they might be different colors than mine. These differences are fine.\n\nI'm\
    \ going to walk through this line-by-line, just to make sure you typed everything\
    \ correctly.\n\nThe first line starts with the word public followed by a single\
    \ space then the word class, a single space, the word FirstProg, a space, and\
    \ then a character called a \"brace\". You type a brace by holding down SHIFT\
    \ and pressing the '{' key, which is usually to the right of the letter 'P'.\n\
    \nThe 'F' in \"First\" is capitalized, the 'P' in \"Prog\" is capitalized. There\
    \ are only two capital letters in the first line. There are only three spaces.\n\
    \nBefore I go to the second line of the program, I will tell you what programmers\
    \ usually call each funny symbol that appears in this program."
