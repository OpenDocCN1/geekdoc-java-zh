    is not the same as the value of the variable *guess*... run the following chunk
    of code." Lines 16 through 25 are the body of the loop. Every time the condition
    is true, all twelve of these lines of code executed.


    Inside the body of the loop we have a couple of statements. We already know that
    the human''s guess is different from the secret number or we wouldn''t be inside
    the *while* loop to begin with! But we don''t know if the guess is wrong because
    it is too low or it is too high, so if these statements figure out and display
    the appropriate error message.


    After the error message is displayed, we allow them to guess again. The human
    (hopefully) types a number which is then stored in the variable *guess*, overwriting
    their previous guess in that variable.


    Since the body of the loop executed once all the way through, the program pops
    up to line 15 and checks the condition again. If that condition is *still* true
    (their guess is still not equal to the secret number) then the whole loop body
    will execute a second time. If the condition is now false (because they guessed
    it) then the whole loop body will be skipped and the program will skip down to
    line 27.


