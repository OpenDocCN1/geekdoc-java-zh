  md: '# Exercise 19: Mutual Exclusion with Chains of If and Else


    Your group travels over to this person but no one starts flirting until they see
    how you fare. If you seem to be making progress, your friends will back off and
    let you away. If however, you get rejected by one of your other companions feels
    cleared to and make a play.


    This is basically what happens with else if. An else statement (an statement with
    an else in front of the if) contains a condition that might be true or false.
    But the else means that the if statement only check to see if it is true or false
    assuming the preceding statement (and only the immediately preceding one) was
    false.


    The else on line 18 makes that if statement defer to the if statement starts on
    line 15: if it''s true, the line-18 statement will skip even if it would have
    been true on its own. The else on line 21 makes its if statement defer to the
    previous if statement, and so on. And the else at the very end on line 33 is like
    the smallest dog in a pack: it only gets a shot if all the if statements in the
    chain were false.


    We''ll talk a little bit about this in the next exercise, so that''s enough for
    now.


