  md: '# Next Steps


    You made it!

    If you finished all the exercises and did the Study Drills and understood what
    you were doing, then congratulations! Java isn''t an easy language for beginners,
    so pat yourself on the back or something.

    You now know the basics of programming, and more importantly, you have a lot of
    practice reading code, understanding it, and fixing bugs. These are important
    tools for programmers. With these skills, you should be able to pick up just any
    book about programming and handle it fine.

    However, your journey isn''t over yet. Typing in someone else''s programs is hard
    but writing your own programs from scratch is a lot harder. Also, you know the
    basics of Java but nothing about "Object-Oriented Programming"

    Most of my real-life situations practiced and learned for four or five years after
    working my assignments as they got jobs in the industry.

    Currently, you are lacking in three areas:


    +   - You need a lot more practice, especially writing your own programs.

    - You don''t know Object-Oriented Programming (OOP).

    - You don''t know the standard library very well.


    # You don''t know the standard library.


    Professional Java programmers spend a lot of time writing small amounts of code
    to "glue together" modules written by other people. Many of these are included
    with Java itself and are available to "import".

    Java''s standard library is provided as packages of objects, so you''ll need to
    know object-oriented programming before you can get much better at this.


    # You need a lot more practice.


    The students I teach at my public school do the exercises in this book to start
    learning, but that''s not all I make them do. They also have to write a lot of
    programs from scratch. You can see the list of assignments at


    Programming by Doing³⁴


    ³⁴https://programmingbydoing.com/'
