  md: "# Exercise 35: Displaying Dice with Functions\n\nOn lines 7 through 11 we choose\
    \ five random numbers (each from 1 to 6) and store the results into the five integer\
    \ variables r1 through r5.\n\nWe want to use if statements to display a picture\
    \ of the die's value on the screen, but we don't want to write the same if statements\
    \ five times (which we would have to do because the variables are different).\
    \ The solution is to create a function that takes a parameter.\n\nOn line 25 you\
    \ see the beginning of the definition of the showDice function. After the name\
    \ (or \"identifier\") showDice is a set of parentheses and between them a variable\
    \ is declared! This variable is called a \"parameter\". The showDice function\
    \ has one parameter. That parameter is integer named roll.\n\nHere are some examples:\n\
    \n```\nshowDice;               // NO (without parens refers to a variable\n  \
    \                           // rather than a function call)\nshowDice();     \
    \           // NO (function call must have one argument, not zero)\nshowDice(1);\
    \               // YES (one argument is just right)\nshowDice(4);            \
    \   // YES\nshowDice(1+2);             // YES\nshowDice(r2);              // YES\n\
    showDice(r5);              // YES\nshowDice(r3-r4 / 2);      // YES (strange but\
    \ legal)\nshowDice(17);              // YES (although it won't show a dice picture)\n\
    showDice(3, 4);            // NO (function call must have one argument, not two)\n\
    showDice(2.0);             // NO (argument must be an integer, not a String)\n\
    showDice(\"two\");          // NO (argument must be an integer, not a String)\n\
    showDice(false);           // NO (argument must be an integer, not a Boolean)\n\
    ```\n\nIn all cases, a copy of the argument is stored in the parameter. So if\
    \ you call the function like showDice(3); then the function is called and the\
    \ value 3 is stored into the parameter roll. So by line 26 the variable roll has\
    \ already been declared and initialized with the value 3.\n\nIf we call the function\
    \ using a variable showDice(r2); then the function is called and a copy of whatever\
    \ value is currently in r2 will be stored into the parameter roll before the body\
    \ of the function is executed.\n\nOn line 14 the showDice function is executed,\
    \ and roll will be set equal to whatever value is in r1.\n\nOn line 15 showDice\
    \ is called again, but this roll will be set equal to whatever value is in r2.\
    \ Line 16 calls showDice while setting its parameter value to the value of r3.\
    \ And so on."
