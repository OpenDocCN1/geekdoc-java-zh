  md: '# Exercise 48: Arrays - Many Values in a Single Variable


    The curly braces on this line are used for a different purpose than usual. All
    these values are in quotes because they are Strings. There are commas between
    each value, the whole initializer list is in curly braces. And there''s a semicolon
    at the end.


    (Split the initializer list into two lines because it wouldn''t fit on one in
    the printed version of this book. You can leave it like I wrote it and it will
    work or you can put all the Strings in one longer.)


    The second new in this exercise is a new kind of for loop. (This is sometimes
    called a "foreach" loop, since it works a bit like a loop in another programming
    language where the keyword actually instead of for. It is also called an "enhanced
    for loop")


    On line 6 you will see this foreach loop. You read it out like this: "for String
    ''p'' in the array ''plants...''"


    So inside the body of this loop the String p will take on a copy of each value
    in the array planets. The first time through the loop, p will contain a copy of
    the first value in the array ("Mercury"). The second time through the loop, p
    will contain a copy of the second value in the array ("Venus"). And so on, until
    all the values in the array have been seen. The loop will automatically stop.


    Inside the body of the loop (on line 7?) we are just printing out the current
    value of p and an uppercase version of p. Just for fun, I guess.


    This new kind of for only works with compound variables like this: variables that
    have one name but contain multiple values. Arrays aren''t the only sort of compound
    variable in Java, but we won''t be looking at any of the others in this book.


    Arrays are a big deal, so that''s enough for this exercise. I want to make absolutely
    sure you understand what is happening in this assignment before throwing your
    plate.


