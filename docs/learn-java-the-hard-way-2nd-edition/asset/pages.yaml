  md: '# # Exercise 11: Variable Modification Shortcuts


    The value of a variable can change over time as your program runs. (It won''t
    change unless you code to change it, but it can change is what I''m saying.)


    In fact, this is pretty common. Something we do often is take a variable and add
    something to it. For example, let''s say the variable x contains the value 10.
    We want to add 2 to it so that x now contains 12.


    We can do this:


    ```

    int x = 10,      // x is 10, tempX is undefined

    tempX = x + 2;      // x is still 10, tempX is now 12

    x = tempX;           // x has been changed to 12

    ```


    This will work, but it is annoying. If we want, we can take advantage of the fact
    that a variable can have one value at the beginning of a line of code and have
    a different value stored in it by the end. So we can write something like this:


    ```

    int y = 10;      // y is 10

    y = 2 + y;           // y *becomes* (2 plus the current value of y)

    ```


    This also works. Second line says “take the current value of y (10), add 2 to
    it, and store the sum (12) into the variable y. So when the second line of code
    begins executing, y is 10, and when it is done executing, y is 12. The order of
    adding doesn''t matter, so we can even do something like this:


    ```

    int m = 10;

    m = m + 2;

    ```


    ...which is identical to the previous example. Okay, now to the code!'
