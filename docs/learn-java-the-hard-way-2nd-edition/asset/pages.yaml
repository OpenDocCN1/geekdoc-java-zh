  md: '# Exercise 44: Counting with a For Loop


    loop starts looping. If the condition is true, the loop body will be executed
    one time. If the condition is false, the loop body will be skipped and the loop
    is over.


    The third part (n++) runs after each iteration of the loop, just before it checks
    the condition again. Remember that ++ adds one to a variable. The third part is
    sometimes called an "update statement".


    After the three parts in parentheses are curly braces which contain the "body"
    of the loop. If you place them on a line by themselves in some Java Program. But
    the middle part (condition) isn''t a complete statement, it''s just an expression
    that evaluates to true or false.


    So if we unroll this loop, these are the statements that will happen in their
    order:


    ```

    n = 1;

    // check if ( n <= 5 ), which is true

    System.out.println(1 + "." + message);

    ++; // so now n is 2

    // check if ( n <= 5 ), which is true

    System.out.println(2 + "." + message);

    ++; // so now n is 3

    // check if ( n <= 5 ), which is true

    System.out.println(3 + "." + message);

    ++; // so now n is 4

    // check if ( n <= 5 ), which is true

    System.out.println(4 + "." + message);

    ++; // so now n is 5

    // check if ( n <= 5 ), which is true

    System.out.println(5 + "." + message);

    ++; // so now n is 6

    // check if ( n <= 5 ), which is false. The loop stops.

    ```


    Notice that the first part happened only once, and that the third part happened
    exactly as many times as the loop body.


    On line 18 there is another for loop. The loop control variable is still n. (Notice
    the loop control variable appears in all three parts of the loop. This is always
    the case.)


    The first part ("initialization" statement) sets the loop control variable to
    start at 5. The second part checks to see if n is less than or equal to 5. If
    so, the body is executed one time and then the third part is executed. The third
    part adds one to the loop control variable, and then the condition is checked.
    If it is false, the loop stops.


