    values, display, change their values and print them again. Starting on line 14
    we give the variables the same values they started with and print them.


    On line 18 we see something new: a shortcut called a "compound assignment operator."
    The i += 3 means the same as i = i + 3: "take the current value of i, add 3 to
    it, and store the result as the new value of i. When we say it out, we would say
    "plus equals 3."


    On line 19 we use -= ("minus equals"), which subtracts 3 from j, and the next
    line demonstrates *=, which multiplies. whatever variable is on the left-hand
    side does whatever the right-hand side ends equaling. "Modulus equals" (=) also
    exists, which whatever variable on the left-hand side equal to the remainder when
    its previous value is divided by whatever is on the right. (Whew.)


    Then on line 21 we do something else. Instead of taking three lines of code to
    set i, j and k all to 5, I do it in one (Some people do not approve of this trick,
    but I think it''s fine in cases like this.) This line means "Put the value 5 into
    the variable k. Then take a copy of whatever is now in k ($) and store it into
    j. Then take a copy of whatever is now in j and store it into i." So when this
    line of code is done, all three variables have been changed to 5.


    Lines 25 through 27 are basically the same as lines 18 through 20 except that
    we are no longer using 3 as the number to add, subtract or multiply.'
