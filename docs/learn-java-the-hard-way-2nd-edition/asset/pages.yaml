    Line 110 reads the whole line, which means that line contains something like "refrigerator:3".
    (If it''s not something like that but is actually %, lines 111 and 112 stop the
    loop.)


    So now we need to split this line into two parts. Fortunately for us, the String
    class has a built-in method called split().


    ```

    line.split(":") searches the String line and breaks it up until it sees a :colon.

    And it returns an array of Strings. For example, if line contained thisXaoTest
    then

    line.split(":") would return an array containing("this", "a", "test"). In our
    case

    ther''s only one line in line, so it returns something like("refrigerator", "3").

    ```


