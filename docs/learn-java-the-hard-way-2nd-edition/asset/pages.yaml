  md: 'case and then a value that the variable up in the parentheses might equal.
    Then''s a colon (:). You don''t see colons often in Java.


    After the case, the value, and the colon is some code. It can be as many lines
    of code as you like except that you''re not allowed to declare any variables inside
    the switch statement. Then after all the code is the keyword break. The break
    marks the end of the case.


    When a switch statement runs, the computer figures out the current value of the
    variable in the parentheses. Then it looks through the list of cases, one at a
    time, looking for a match. When it finds a match it moves from the left side where
    the cases are to the right side and starts running until it is stopped by a break.


    If none of the cases match and there is a default case (it''s optional), then
    the code in the default case will be run instead.


    The second example starts on line 46 and demonstrates that once the switch finds
    a case that matches, it really does run on the right side until it hits a break
    statement. It will even fall through from one case to another.


    We can take advantage of this fall-through behavior to do clever things sometimes,
    like the code to figure out the number of days in a month. Since September, April,
    June and November all have 30 days, we can just put all their cases in a row and
    let it fall through for any of those to run the same thing.


    Anyway, I won''t use switch statements again in this book because I virtually
    never find a good use for them, but it does exist and at least I can say that
    you saw it.


