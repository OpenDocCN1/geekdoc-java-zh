  md: '# Exercise 58: Final Project - Text Adventure Game


    Line 44 is the beginning of the loadRoomsFromFile() function, which takes the
    filename to open as a parameter and returns an array of Rooms.


    (I decided that I didn''t want to have Exception anywhere in this file, so there''s
    a try-catch block here. It opens the file.)


    If we make it down to line 54 it means the file was opened successfully. We read
    in the first line of the file to us how many rooms are there. Then line 55 defines
    an array of Room records with the appropriate capacity.


    On line 58 I made a variable roomNum, which has a dual purpose. First of all:
    it is the index for the next available slot in the room array. But secondly, it
    is used to double-check the room number (from the file) and the slot number of
    the room are the same. If not, there''s probably some sort of error in the game
    data file. If we detect such an error (on line 61), we complain and end the program.
    System.exit() ends the program, even inside a function call.


    Line 59 is the beginning of the "read all rooms" loop. It keeps going as long
    as there is stuff in the file we haven''t seen. There''s a potential error here:
    if the number of rooms at the top of your data file is a lie, then this loop could
    go too far in the array and blow up. (For example, if the first line of the file
    says you have 7 rooms then we have 8 rooms then this loop will repeat many times.)


    On line 60 we read a single room using the getRoom() function I''ll explain.


    Lines 61 through 65 are the room number sanity check that I already mentioned,
    and then line 66 stores this new room into the next available slot in the array.
    And line 67 increments the room index. So on line 71 we can return the array of
    rooms back up to line 17 of main().


    After that loop is over, all the rooms have been read from the file and stored
    each into their slot of the array.


    Lines 74 through 82 are the showRooms() function that I use for debugging. It
    displays all the rooms on the screen, and for each room it shows all the exits
    and where they lead.


    Our final function is getRoom(), which expects a Scanner to be passed in as a
    parameter and returns a single Room object.


    On lines 86 and 87 there is a simple sanity check in case there is a malformed
    data file. If the next thing in the file is not an integer, then just return null
    (the value of an uninitialized object). Putting a return up here will return the
    function right away without bothering to run any of the remaining code.


    On line 89 the empty room object is defined. Line 90 creates a String called,
    which I use for a couple of different things.


    Line 93 reads the room number from the file. The room number is the first part
    of the room record. The rest of this function is to use only the Scanner''s nextLine()
    method, and a nextLine() after a nextInt() usually doesn''t work because it only
    reads the end of the line after the integer that was just read.'
