    \ is... HEADS\nThat's 3 in a row...\nWould you like to flip again (y/n)? n\nFinal\
    \ score: 3\n\nThere are only two differences between while loops and do-while\
    \ loops.\n\n+   1. The condition of a while loop is before the body, but do-while\
    \ loops just have the keyword before the body and the condition is at the end,\
    \ just after the curly brace. (And there's a semicolon after the close paren of\
    \ the loop condition, which while loops don't).\n2. while loops check their condition\
    \ before going into the loop body, but do-while loops run the body of the loop\
    \ once no matter what and only check the condition after the first time through.\n\
    \nIn computer-science circles, the while loop is called a \"pre-test\" loop (because\
    \ it checks the condition first) and the do-while is called a \"post-test\" loop\
    \ (because it checks the condition afterward)."
