  md: '# Exercise 21: Nested If Statements


    Anyway, there''s not much else interesting to say about this exercise except that
    it demonstrates nesting if statements and else inside of others. I have a little
    surprise in the study drills, though.


    # Study Drills


    +   1. Change the else on line 31 to a suitable if statement instead, like:


    ```

    if ( gender equals("M") )

    ```


    Notice that the program doesn''t compile anymore. Can you figure out why?

    It is because the variable is declared on line 6 but is not given a value right
    away. The variable must have a value at this point, or on line 36, the value of
    title is printed to display the value of a variable. We will be trying to display
    the value of a variable that is undefined: it has no value. The compiler wants
    to prevent this.

    When line 31 was an else, the compiler could guarantee that no matter path through
    the nested if statements were taken, title would always get a value. Once we changed
    it to a regular if statement, there is now a way the human could type something
    to get it to sneak through all the nested if statements without giving title a
    value. You can think of one?


    (They could type an age 20 or greater and a letter different from "M" or "F" when
    prompted for gender. Then neither gender if statement would be true.)


    We can fix this by changing the if statement back to else (probably a good idea)
    or by initializing title right when we declare it (probably a good idea anyways):


    ```

    String title = "error";

    ```


    ...or something like that. Now title has no value no matter what, and the compiler
    is happy.'
