  md: '# Exercise 51: Arrays Without Foreach Loops


    ```

    Values: 82 42 59

    Values: 6 7 8

    Values: 13 21 41

    Values: 42 44 78

    Values: 83 93 78

    Values: 61 74 96

    ```


    On line 4 we are creating an array of integers without using an initializer list.
    The [3] means that the array has a capacity of 3. Since we didn''t provide values,
    every slot in the array starts out with a value of Ø stored in it. Once an array
    has been created, its capacity can''t be changed.


    On lines 7 through 9 I skip to the hard part: using a for loop to make a variable
    value changes into all the locations of the values in the array. That is, the
    variable i will equal Ø then i then 2 instead of the values in the array.


    In the body of the loop we store a random number from 1-100 into each slot of
    the array. I''ll explain more later.


    On lines 13 through 17 we use an identical loop to display all the random values
    in the array onto the screen. If both of these loops don''t make total size to
    you, you''re in luck! The rest of the code explains the technique.


    So let''s skip down to 22, which uses square brackets and a name to store the
    value 6 into slot 0 of the array.


    Maybe this seems weird. The first slot in an array is slot number Ø in most programming
    languages. You could also say that the first slot in an array has the index 0,
    because the number that refers to an array slot is called an "index". (Collectively
    these ought to be called "indices" (INN-DUH-SEEZ) but most people just say "indices")


    So Java – like all programming languages – has "0-based array indexes." This means
    that our array has for three slots, they are numbered 0-1-2.


    The first slot in an array is Ø. This array can hold three values, the last index
    is 2. There is nothing you can do about this except get used to it. So .length
    is 3, but there is not a slot with index 3. This will probably be a source of
    bugs for you, but eventually, you will learn.


    Anyway, lines 21 through 23 store values into all three slots in the array. (All
    the slots used to have random numbers in them, but those have now been overwritten.)


    On line 26 we put all current values in the array so you can see that they have
    changed.


    On lines 30 through 32 we put random numbers into each slot of the array. And
    print them out on line 35.


    Starting on line 39 I have done something silly. Try to withhold judgment a number
    until the end of the exercise.'
