  md: '# Exercise 17: Otherwise (If Statements with Else)


    So, if statements are pretty great. Almost every programming language has them,
    and you use them ALL the time. In fact, if statements alone are functional enough
    that you could do a lot just if statements.


    But sometimes, having something else could make things a little more convenient.
    Like this example quick! What is the logical opposite of the following expression?


    ```

    if (onGuestList || age >= 21 || (gender.equals("F") && attractiveness >= 8))

    ```


    Eh? Got it yet? Well, if you said


    ```

    if (!onGuestList || age >= 21 || (gender.equals("F") && attractiveness >= 8))

    ```


    ...then you''re right and you''re my kind of person. Clever and when to let the
    machine do the work for you. If you said


    ```

    if (!onGuestList && age < 21 && (!gender.equals("F") || attractiveness < 8))

    ```


    ...then you''re right and... nice job. That''s actually pretty tough to do correctly.
    But what about the logical opposite of this:


    ```

    if (expensiveDatabaseThatTakes45SecondsToLookup(username, password) == true)

    ```


    Do we really want to write


    ```

    if (expensiveDatabaseThatTakes45SecondsToLookup(username, password) == false)

    ```


    ...because now we''re having to wait 90 seconds to do if statements instead of
    45 seconds. Fortunately, programming languages give us something else. (Yeah,
    Couldn''t resist.)'
