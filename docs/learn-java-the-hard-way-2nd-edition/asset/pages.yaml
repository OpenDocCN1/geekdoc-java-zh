    # Warnings for Beginners


    You are done with the first exercise. This exercise might have been quite hard
    for you depending on your familiarity with your computer. If it was difficult
    and you didn''t finish it, go back and take the time to study and get through
    it. Programming requires careful reading and attention to detail.


    If a programmer tells you to use emacs or Eclipse, just say "no." These editors
    are for when you are a better programmer. All you need now is an editor that lets
    you put text into a file. We will use gedit, TextWrangler, or Notepad++ (from
    now called "the text editor" or "a text editor") because it is simple and the
    same on all computers. Professional programmers use these text editors so it''s
    good enough for you starting out.


    A programmer will eventually tell you to use Mac OS X or Linux. If the programmer
    likes fonts and typography, he''ll tell you to get a Mac OS X computer. If he
    likes control and has a huge beard, he''ll tell you to install Linux. Again, whatever
    computer you have right now that works. All you need is an editor, a terminal,
    and the Java Development Kit.


    Finally, the purpose of this setup is you can do three things very reliably while
    you are on the exercises:


    +   * Write exercises using your text editor (gedit on Linux, TextWrangler on
    OSX, or Notepad++ on Windows).

