  md: '# Exercise 1: An Important Message


    ```

    FirstProg.java:6: error: reached end of file while parsing

    }

    ^

    1 error

    ```


    Don''t worry too much about the particular error message. When it gets confused,
    the compiler tries to guess about what you might have done wrong. Unfortunately,
    the guesses are designed for expert programmers, so it usually doesn''guess well
    for beginner-type mistakes.

    Here is an example of a different error message you might get:


    ```

    FirstProg.java:3: error: '';'' expected

    System.out.println("I am determined to learn how to code.")


    1 error

    ```


    In this case, the compiler is actually right the error is on line 3 and the specific
    error is that a semicolon was expected ('';'' expected). The line ends with a
    colon (:) but it ought to be a semicolon (

    Here''s one more:


    ```

    FirstProg.java:1: error: class Firstprog is public, should be declared in a file\nnamed
    FirstProg.java

    public class FirstProg

    ^

    1 error

    ```


    This time is a capitalization error. The code says public class Firstprog (note
    the lowercase ''p'') but the filename is FirstProg.java. Because they don''t match
    exactly – capitalization and all – the compiler gets confused and baits out.

    So if you have any error messages, fix them, then save your code, go back to the
    terminal and compile again.'
