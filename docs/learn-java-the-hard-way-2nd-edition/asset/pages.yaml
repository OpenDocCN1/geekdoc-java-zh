  md: '# Exercise 25: Repeating Yourself with parentheses the While Loop


    ```

    WELCOME TO THE BANK OF JAVA.

    ENTER YOUR PIN: 123


    INCORRECT PIN. TRY AGAIN.

    ENTER YOUR PIN: 1234


    INCORRECT PIN. TRY AGAIN.

    ENTER YOUR PIN: 12345


    PIN ACCEPTED. YOUR ACCOUNT BALANCE IS $425.17

    ```


    On line 14 you get your first look at the while loop. Both have a condition that
    is checked to see if it is true or false. If the condition is false, both while
    loops and statements will skip all the code in the body. And when the condition
    is true, both while loops and statements will execute all of the code in their
    body one time.


    The only difference is that if statements are true will execute all of the code
    in the curly braces exactly once, while loops that are true will execute all of
    the code in the curly braces once and then go back up and check the condition
    again. If the condition is still true, the code in the body will all be executed
    again. Then it checks the condition again and runs the body again if the condition
    is true.


    In fact, you could say that the while loop executes all of the code in its body
    over and over again as long as its condition is true when checked.


    Eventually, the condition will be false when it is checked. Then the while loop
    will skip over all the code in its body and the rest of the program will continue.
    Once the condition of a while loop is false, it doesn''t get checked again.


    Looping is so great because we can finally do something more than once without
    having to type the code for it more than once! In fact, programmers sometimes
    say "Keep your code D.R.Y.: Don''t Repeat Yourself." Once you know how to program
    pretty well and finish all of the exercises in this book, you will start to get
    suspicious if you find yourself typing (or copying-and-pasting) the same code
    more than once in a program.'
