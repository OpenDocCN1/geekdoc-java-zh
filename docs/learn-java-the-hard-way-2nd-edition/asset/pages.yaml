  md: '# Exercise 14: Compound Boolean Expressions


    You read the tables this way: let''s pretend that our shallow grandmother has
    decided that she will only go on a cruise if it is cheap AND the alcohol is included
    in the price. So we will pretend that statement A "the cruise is cheap" and statement
    B is "the alcohol is included". Each row in the table is a possible cruise


    Row 1 is a cruise where both statements are true. Grandmother will be excited
    about cruise #1! Yes! "Cruise is cheap" and "alcohol is included" is true, so
    "grandmother will go" (A & B) is also true.


    Cruise #2 is cheap, but the alcohol is not included (statement B is false). So
    grandmother isn''t interested: (A & B) is false when A is true and B is false.


    Clear? Now here is the truth table for:


    | A | B | A || B |

    |---|---|---|

    | true | true | true |

    | true | false | false |

    | false | true | true |

    | false | false | false |


    Let''s say grandmother will buy a used car if it is really cool-looking OR if
    it gets great gas mileage. Statement A is "car is cool looking", B is "good miles
    per gallon" and the result, A OR B determines if it is a car grandmother would.


    Car #1 is awesome-looking and it also goes a long way on a tank of gas. Is grandmother
    interested? Heck, yes! We can say that the value trueORed with the value true
    gives a result of true.


    In fact, the only grandmother won''t like is when both are false. An expression
    involving OR is only false when BOTH of its components are false.


