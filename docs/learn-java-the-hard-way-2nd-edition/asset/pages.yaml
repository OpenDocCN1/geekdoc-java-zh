  md: "Exercise 15: Making Decisions with If Statements\n\n66\n\n# What You Should\
    \ See\n\n```\nHow old are you? 17\nYou are:\n    too young to get a tattoo\n \
    \   too young to drink alcohol\n    too young to run for President of the U.S.\n\
    \    (How sad!)\n```\n\nOkay, this is called an \"if statement\". An if statement\
    \ starts with the keyword if, followed by a \"condition\" in parentheses. The\
    \ condition must be a Boolean expression that evaluates to either true or false.\
    \ Underneath that a block of code surrounded by curly braces, and the stuff inside\
    \ the curly braces is indented one more level. That block of code is called the\
    \ \"body\" of the if statement.\n\nWhen the condition of the if statement is true,\
    \ all the code in the body of the if statement is executed. When the condition\
    \ of the if statement is false, all the code in the body is skipped. You can have\
    \ as many lines of code as you want inside the body of an if statement; they will\
    \ all be executed or skipped as a group.\n\nNotice that when I ran the code, I\
    \ put in 17 for my age. Because 17 is not less than 13, the condition on line\
    \ 12 is false, and so the code in the body of the first if statement (lines 13\
    \ and 14) was skipped.\n\nThe second if statement was also false because 17 is\
    \ not less than 16, so the code in its body (lines 16 and 17) was skipped, too.\n\
    \nWhen the condition of the third if statement was true: 17 is less than 18, so\
    \ the body of the third statement was not skipped; it was executed and the phrase\
    \ \"too young to get a tattoo\" was printed on the screen. The remaining statements\
    \ in the exercise are all true.\n\nThe final statement contains two lines of code\
    \ in its body, just to show you what it would look like.\n\n# Study Drills\n\n\
