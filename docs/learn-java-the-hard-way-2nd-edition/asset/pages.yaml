    word.


    On 15 we use the getBytes() method of the String class, with an argument of "UTF-8".
    This converts the String to a list of bytes in UTF-8 format which we pass directly
    as an argument to the update() method of the MessageDigest object named digest.
    I learned about the getBytes() method by reading the javadoc documentation for
    the String class!


