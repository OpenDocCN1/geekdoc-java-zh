    You can see that the functionArea has three parameters. They are all integers,
    and they are named a, b and c. As you already know, this means that we cannot
    call the function without providing three integer values as arguments.


    In addition to this, the triangleArea function returns a value. Notice that on
    line 20 it doesn''t say between public static and triangleArea. It says double.
    That means "this function returns a value, and the type of value it returns is
    double."


    If instead it used the keyword void in this position, it means "this function
    does not return any value." If we wanted triangleArea to return a different type
    of value:


    ```

    // a function defined this will return a value that is an int

    public static int triangleArea(int a, int b, int c)

    ```


    ```

    // this one must return a value that is a, a String

    public static String triangleArea(int a, int b, int c)

    ```


    ```

    // this function must return either the value true or the value false

    public static boolean triangleArea(int a, int b, int c)

    ```


    ```

    // a function defined this cannot return any value of any type

    public static void triangleArea(int a, int b, int c)

    ```


    My students get confused about functions that return values versus functions that
    do not return values. An analogy is helpful.


    Let us say that we are sitting in my school classroom. We hear the sound of thunder
    and I remember that I left my car windows down. I don''t want to rain the inside
    of my car, so I send you out into the parking lot.


    "Student, please go out into the parking lot and roll up the windows of my car."


    "Yes, sir," you say.'
