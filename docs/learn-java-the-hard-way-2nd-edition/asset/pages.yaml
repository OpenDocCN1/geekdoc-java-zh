  md: '# Exercise 55: An Array of Records


    ...there''s no integer yet. The variable n can potentially hold an integer, but
    there''s no number in it yet. n is declared as undefined. In the same way, once
    line 9 has finished executing, db is a variable that could refer to an array of
    Students, but is still undefined.


    Fortunately we don''t have to wait long; 10 initializes db by creating an actual
    array of Students with three slots. This point db is defined, db.length is 3 and
    db has three legal indexes: 0, and 1.


    Okay, at this point, db is an array of Student records. Except that it isn''t,
    db is an array of Student variables, each of which can potentially hold a Student
    record, but none of which do. All three slots in the array are undefined.


    > (Technically they contain the null, which is the special value that reference
    variables in Java when there''s no object in them yet.)


    On line 12 it is important that a Student object is created and stored into the
    first slot (index 0) of the array. On line 13 we can store a value into the name
    field of the Student record which is in index 0 of the array db.


    Let''s trace it from the outside:


    | expression | type | description |

    | db | Student[] | an array of Student records |

    | db[] | Student | a single Student record (the first one) |

    | db().name | String | the name field of the first Student in the array |

    | db.name | error | the whole array doesn''t have a single name field |


    So line 13 stores a value into the name field of the first record in the array.
    Lines 14 and 15 store values into the remaining fields in that record. Lines 17
    through 25 create then fill the other two records in the array.


    On lines 27 through 31 we use a loop to display all the values on the screen.


    Then lines 33 through 36 find the student with the highest GPA. This is worth
    explaining in more detail. On line 33 act maxLoc is not going to hold the value
    of the highest GPA; it is going to hold only its index.


    When I put i into maxLoc I mean "As point in the code, as I know, the highest-scoring
    student is in slot i." This is probably not true, but we haven''t looked at any
    of the values in the database yet it is as good a starting place as any.


    Then on line 34 we set up the loop to look through each slot of the array. however,
    that the loop starts with 1 (the second slot). Why?


    Because maxLoc is already Ø. So if i started already Ø then the if statement would
    be comparing'
