- pgno: 28
  md: '# Exercise 1: An Important Message


    ( and ) are called “parentheses” (that''s plural). Just one of them is called
    “parenthesis”, but some people just call them parens (“puh-RENZ”). One (“ is sometimes
    called a “left paren” and the other (\”) is called a “right paren” because parentheses
    usually come in pairs and one is to the left of the other. The left parenthesis
    (“) is also called an “open paren” and the right one called a “close paren” for
    similar reasons.


    There''s an open paren on line 2 and a close paren, too.


    [ ] are called “brackets”, but many programmers call them “square brackets” to
    make sure there''s no confusion. In Java, parentheses and square brackets are
    *not* interchangeable. Brackets come in pairs and they are called “left bracket”
    (or “open bracket”) and “right bracket” (or “close bracket”).


    There''s an open and close square bracket next to each other on line 2, and no
    other brackets in the whole file.


    { } are called “braces”, and some programmers call them “curly braces”. These
    always come in pairs of left and right braces / open and close braces.


    " is a “quotation mark”, but often abbreviated “quote”. These always come in pairs.
    In Java, the first one in pair is usually called an “open quote” and the second
    one is a “close quote” even though it''s the exact character in both places. The
    first quote serves to begin something and the second one ends that thing.


    '' is technically an “apostrophe”, but almost all programmers call them “single
    quotes”. For this reason a question mark is often called a “double quote”. In
    some programming languages, single quotes and double quotes are interchangeable,
    but not in Java. Java does use single quotes sometimes, but they''re going to
    be pretty rare in this book.


    . is technically a “period”, but almost all programmers say “dot”. They are used
    a lot in programming languages, and they are used as separators instead of “enders”,
    so we don''t call them periods.


    There are four dots in this program and one period.


    ; is called a “semicolon”. It''s between the letter ‘L’ and the quote on the keyboard.
    Java uses a lot of semicolons although there are only two of them in this program:
    one at the end of line 3 and another at the end of line 4.


    Finally, < is a “less-than sign” and > is a “greater-than sign”, but sometimes
    they are used sort-like braces or brackets. When they are used this way, they''re
    usually called “angle brackets”. Java uses angle brackets, but you won''t see
    them in this book.


    Okay, so back to the line-by-line. You have already typed the first line correctly.


    You should start the second line by pressing TAB one time. Your cursor will move
    over several spaces'
