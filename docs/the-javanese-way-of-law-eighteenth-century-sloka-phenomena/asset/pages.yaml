    Sima bangga rebut mangsa mati katiban taru (LOr 7440, f. 341)

    Translation


    A deviant/disobedient tiger seizing prey dies, struck by a falling tree [an

    un-expected fate].


    Variations

    gana ina, arebut mangsa, mati katiban taruh, a dastard young buck in

