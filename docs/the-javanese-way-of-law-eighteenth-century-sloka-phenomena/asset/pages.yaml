    the cited instruction is relative: one must choose the best, or the least negative,
    for one''s case. To the relative good or true belong to the andh-andihian, also
    termed ekral/ikral (guiding principles). As one of the most often cited ten types
    of evidence, most invariably arranged in order of precedent in deciding a legal
    affair.


    The term andih-andihian derives from endhih, (1 to beat, overcome; 2 to take over,
    pre-empt; to take s.o''s seat by pushing them off). In the form used in the texts,
    i.e., kendilih/kendhih, it becomes ''to get, overwhelmed; pushed off the seat.''
    Paragraph 4 of the Adilulas confirms as ''expressions of the aksara'' (ujaring
    aksara).^4 The andih-andihian are positive models for winning a case in the sense
    that a one based on a concept lower the validity scale will defeat a case based
    on a higher one. In short, the schema is a progression of types of evidence which
    is overruled by its successor. The universality of their acceptance is seen from
    the fact that they are repeated with little variation in most of our key manuscripts.
