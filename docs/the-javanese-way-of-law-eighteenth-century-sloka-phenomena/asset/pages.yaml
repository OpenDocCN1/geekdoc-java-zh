    THE JAVANESE WAY OF LAW


    Wangkara which opened this work. The latter, as all relevant legal titles, is
    dominated by sloka and sloka derivatives. These yet key components are conspicuously
    absent in the Dutch compendium. A partial exception consists of the unique formulation
    of sinalokan. Two other factors caution in accepting the published Pepakem Tjerbon
    at face value. The first concerns the supplement to the original Dutch text of
    an apparently younger Javanese manuscript unencumbered by information on origin
    or date requested in connection with preparations for the pepakem''s publication
    in 1905. The second is the lack of congruence between the contents of the pepakem''s
    paragraphs and those of the from pre-existing Javanese manuscripts cited as its
    source.


    # Dutch v. Javanese texts


    The Pepakem Tjerbon publication is composed of unequal Dutch and Javanese components.
    At its core is the original archival act written in Company Dutch and officially
    promulgated in 1768. This means that the compendium of translations of Javanese
    texts lacks reference to the sources of information. Only titles are provided,
    which we have seen, are unreliable due to disparity between title and contents.
    The Javanese component has even less solid pedigree. It consists of a manuscript
    of unknown date and provenance, the ''de Nooy manuscript'' de-named after the
    Cirebon Resident who supplied it. For the 1905 publication editor, G.A.J. Hazeu,
    paired the de Nooy manuscript with the archival act. In accordance with the request
    of theasch Genootschap, which sponsored publication, the eighteenth-century Dutch
    text is reproduced in the left-hand column and the corresponding paragraphs from
    de Nooy in the ha-na-ca-ra-ska in the right-hand column. The Dutch archival act
    is longer and more explanatory than the compressed, nearly cryptic, Javanese of
    the de Nooy manuscript. In addition, many Dutch paragraphs lack a Javanese counterpart
    in the published work, never the reverse.4


    Although a Javanese publication had thus been available for the Pepakem Tjerbon
    publication, concordance between the contents of the Dutch Nooy text


    > 4 According to Hazeu, the Dutch version was so true to the original deserves
    unqualified praise. ''With amazement one observes the fact that in the second
    half of the 18th century there were [Dutch] personnel in Java who knew enough
    Javanese to produce rules often difficult to understand. Although the actual power
    of the terms is not always felt, the meaning is somehow misunderstood. Beside
    in the many residents respecting pioneering work accomplished by Raffles can point
    to this 1768 created Dutch translation of the Pepakem Tjerbon with some satisfaction'',
    ''Introduction'', p. vii. Praise of Raffles'' contribution, undoubtedly referring
    to the Surya Alam translation, as positive model seems ironic. We have seen, the
    weakness of both publications lies in the uncertainties of the exact relationship
    between Dutch or English translation and the equivalent paragraphs in the Javanese
    sources.'
