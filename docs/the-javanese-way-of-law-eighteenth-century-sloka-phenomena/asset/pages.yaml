  md: 'embedded. Although sloka consist of self-contained phrases, their broader implications
    are grasped fully within the proper context, that is, in a vignette as those of
    the Jugul Muda.


    Almost all the sloka phenomena considered in the preceding pages are connected
    to vignettes. Most of the Classic Sloka originated from the first two vignettes
    of the Jugul Muda, namely the Dora-Sangkara affair and the Dustha band. Their
    contents and significance are confirmed by parallel references in other titles.
    Most common are the mini-vignettes ending in a dozen or sinalokan connecting Corah,
    Tatayi, Walat, etc. found in the second half of Jugul Muda versions. Specialized
    vignettes, many ending in sinalokan bearing the names of the actors, provide the
    material of the middle section of the Jaya Lengkara. Even the generally tabular
    Surya Alam titles are the source of vignettes related to the components under
    discussion. While bringing in additional vignettes is indeed akin to ''hauling
    coals to New Castle'', the following discussion confines itself to a half dozen.
    They have special significance for embedded sloka phenomena because their contents
    touch on all the key components dealt with this work. In short, they illustrate
    how the individual components functioned within the broader context of written
    law. Lacking obvious organizational principles, they are presented in order of
    increasing complexity, when possible, gathered about a common theme.


    # Jugul Muda and Jaya Lengkara vignettes


    Given that change is one of the few constants of human existence, revealing insight
    is provided by the contrast between the Jaya Lengkara''s sinalokan: ''boga andrawah...''
    as found in the Pepakum Tjerbon and that of the Jugul Muda''s ''tidhem [...] pramanen''.
    A summary of the former follows.


    Two hunchbacks, Boga and Andrawah, sent out to collect taxes over the division
    of the spoils. A fight ensued, ending in their deaths. Since they were royal favourites,
    out of fear of the king''s wrath, supplemented by general greed, the villagers
    chose not to report the matter. A middle-ranking official subsequently informed
    the court of the situation. This resulted in the patih of Medhang Kamulan summoning
    the villagers and their chiefs. All were fined for neglect of duty. The informer
    was rewarded.²'
