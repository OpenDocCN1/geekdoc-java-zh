    on Thursday the 28th of the month of Jumadilawal in the year Jimawal 1219 [1804].


    Suriya Nagara has not been identified. However, the similarity of regent tints
    in Sumedang and of Adipati argues that he was mostly likely the Regent in the
    late eighteenth or early nineteenth century,¹


    The Nriti Suruti is composed of over a hundred paragraphs of roughly equal length.
    Each is separated by the pada lahur sign indicating a break in the narrative.
    This suggests that it was written in verse, although it lacks the compulsory induction
    of the specific verse form usually incorporated in the last sentence of a canto.
    Only in the beginning of the third paragraph is it titled, ''This is the instruction
    Nriti Suruti imitating the pandita (punika inga wasita Nriti Suruti (sec) kinda
    pandita). The language seems to be an archaic form of modern Javanese. Although
    individual words and terms are recognisable, it is difficult to construct a consistent
    narrative. That it belongs to the world of Javanese law is attested by specific
    mention of evildoers (durs § 20 and durjana § 21), as well as terms familiar from
    the other texts of this nature as, for example, agama, jaksa, mantri, maling retna,
    and maling jiwa enumerated in the Surya Alam. The title penultimate paragraph
    mentions a Nriti Praja, which was an introduction to the following text that name.
    As part of the genre the title is not unique within the era''s legal literature.
    The first line is identical with the opening lines of the texts from the Yogyakarta
    collection.²


    An interesting variant of the Nriti Suruti was re-written and published nearly
    one and half centuries later by Rangga Warsita (d. 1860), the last of the famed
    Sukakarta pujangga (a master of the literary art; poet). For convenience convenience
    sake, an internet version is considered here. This is hardly the place to consider
    why a text seems to belong to the earliest category of Hindu (Vedic) literature
    was ''written'' by a prominent jaksa in the Independent Kingdoms generalised by
    a growing Islamic identity. ''Sruti'' is a piece of divine revelation ''heard''
    by the seer of the Vedic period. Sruti literature was not only pre-the smriti
    (man-made) literature – including others the dharma-sastra of Manu is the best
    known – but also the revealed source of dharma. Chandra Yuda''s interest was not
    unique. There are other, seemingly similar, sruti texts originating from Yogyakarta.³


