  md: '# Generic pepakem and the Pepakem Tjerbon of 1768


    By focusing on *pepakem* it is all-to-easy to substitute one unknown for another.
    *Pepakem* can embrace many things. These can range from a formal legal tract to
    a ''miscellaneous book'',¹⁸ including letters (*serat/surat*), and even the random
    notes found in several of the textual traditions. Formal definitions of *pepakem*
    are many, but relatively consistent. In addition to that Pigeaud a recent version
    is found in Robson and Wibono. They confirm the handbook''s nature as a ''summary'',
    concise version of a story used by a *dalang* (narrator and puppet of traditional
    shadow-plays). Prawiroatma emphasizes its function as a ''basic guide or compass,
    the original story (*wayang*, law, etc.)''. In short, a *pepakem* was an aid to
    memory. But this was only for those possessing an understanding of legal custom
    necessary for an acceptable interpretation, namely, functioning as jaksa. Moreover,
    pepakem law books were inclusive, in that they provided multiple solutions for
    like issues, and random in their contents varied from title to title or within
    the same title.


    Easily the best known is the Pepakem Tjerbon published as the *Tjeribonsch Wetboek
    van jaar*¹⁹ Although claimed to have been compiled from selected parts of several
    legal titles, the contents of the published work contrast with that of the manuscript
    titles, or least those available for this study.ed on the authority of the Dutch
    East India Company, and therefore valid from a set date and applicable to a specific
    geographical area, the compendium intended as a guide for its officials to supervise
    local courts. Its contents were exclusive, specific, and consistent. Thus, it
    supplied much of what Crawford felt was lacking in Javanese language. Because
    the *pepakem* genre of the manuscripts is easily confused with the *Pepem Tjerbon*
    compilation, their relationship needs to be clarified, if ever summarily.


