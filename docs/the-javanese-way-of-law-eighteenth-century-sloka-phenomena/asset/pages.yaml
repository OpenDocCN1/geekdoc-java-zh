  md: '# 3 Sloka


    The *sloka* genre is introduced by legal texts associated with kingdom of Medhang
    Kamulan. In addition to the first ever *sloka* formulated by Aji Saka himself,
    the main source of early *sloka* comes from the Jugul Muda. According to Javanese
    tradition attributed to the sixteenth century,¹ constitutes the earliest title
    of the period concerned with law. Hence, the *Jugul Muda* and those texts belonging
    to that tradition provide the material for capturing the many features of the
    genre. On the more practical level, *sloka* provide the basis for resolving suits.


    Both sloka and the means of communication, *aksara*, are common Javanese terms.
    Aksara as the twenty letters comprising the Javanese writing system can be traced
    back literally to the beginning of time. The ha-na-ca-ra-ka alphabet composed
    to Aji Saka, who also invented the Javanese *saka* calendar. In order to relate
    the tragic story of his two loyal servants, Dora and Sembada, who breathed life
    into the abstract symbols, through which the *aksara* – here in the standard dictionary
    meaning of letters of the alphabet – were arranged into stanzas thereby creating
    the first *sloka*. The story is as follows.


    On the way from India, Aji Saka and his ret landed on the island of Majethi. When
    Sembada was asked to remain and guard the priceless heirloom, a *k*. On no account
    should it be surrendered to anyone but Aji Saka in person. Aji Saka continued
    to the Javanese kingdom of Medhang Kamulan, that time ruled by a man-eating demon
    Dewata Cengker. The latter was bested through the rue of an ever-lengthening turban
    wrapping, turned into a white crocodile, and ultimately exiled to the southern
    sea. Dora was then dispatched to Majethi in order to retrieve the *k*, which was
    to become the palladium of the newly-won kingdom. True to his pledge, Sembada
    refused to surrender to anyone other than Aji Saka. Dora stuck by the order to
    retrieve it. The two were equally steadfast in their commitment to carry out their
    master''s wishes. They were equally matched in fighting prowess. Both perished.
    Unswerving loyalty was immortalised by Aji Saka through creating the twenty *aksara*
    to compose a *sloka* of four lines of five letters to their memory.'
