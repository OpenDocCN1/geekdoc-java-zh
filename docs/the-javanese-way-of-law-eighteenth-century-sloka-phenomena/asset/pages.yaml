    fact, declared by the Company. In any event the eighteenth century aksara were
    an established feature of the island''s judicial tradition. Just how far back
    in time they go is impossible to determine. However, given legal texts’ inherent
    conservatism – one of their functions is a senatorial effect – it seems likely
    that they had their origins in the post-Demak era. That were of a written tradition,
    as opposed to the oral adat first recorded by Van Vollenhoven and his disciples
    in the early twentieth century, again rests on Gobius'' testimony of 1717.


    If aksara were so much part of Javanese written law, then why is their importance
    overlooked? The answer lies partially with misdirected scholarly emphasis exacerbated
    by flexibilities in Javanese grammar. In consideration the sources at our disposal
    in Chapter 2 it was noted that the only translated and published texts from the
    period were two versions of the Surya Alam, namely that found in Raffles'' History
    of Java and the de Hout translation. The fact that aksara are only mentioned in
    passing in the Surya Alam textual tradition makes it easy to underestimate their
    importance, a factor supported by the structure of Javanese. Within the Surya
    Alam aksara texts are often used, or associated with, prakara, a point to which
    we shall return. In contact, the text excellence for aksara, i.e., the Jaya Lengkara
    and the minor texts emphasising the aksara benener/salah, andhih-andihinan, and
