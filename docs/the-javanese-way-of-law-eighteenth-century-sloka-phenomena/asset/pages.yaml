    # Carry-overs


    The other feature revealing the catholic nature of the prakara concerns carry-overs
    into the present. As in the case of the sanggraha, they are usually linked with
    modest changes in form and/or contents. These in turn provide the opportunity
    for seeing the modifications for what they are. Among the most prosperous and
    idiomatic expressions are the Thirty Prakara. Roughly half of them can be identified
    as present-day sloka, paribasan, bebasan, and the like.⁵ With greater understanding
    the percentage of identified Javanese proverbial expressions could be even higher.
    Why otherwise formulate aphorhems requiring explanation if they are not to be
    used as gems of inherited wisdom in the future? A second reason for singling out
    the Thirty Prakara for further consideration is that they form the first and longest
    of the prakara lists found in the Surya Alam''s half-dozen paragraphs (§ 9–15)
    comprising the standard 144 items. The exception here is again the Berlin 402/van
    der Hout. A special version of a list is given by the Raffles translation (1817).
