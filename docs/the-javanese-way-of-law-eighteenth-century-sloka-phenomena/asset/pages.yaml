    # Aksara of the right/truth


    Abstract rightness and wrongness are important. Yet on a practical level the whole
    process is dependent on the existence of a recognized legal contest between two
    or more parties. Hence litigants are exerted to build on aksara bener and avoid
    aksara salah. This is good advice under any circumstances, but without specifies
