    # Luwangan sloka


    In contrast to the Jugul Muda''s dedication to pre-existing sloka with sinalokan
    derivations appended to vignettes, the Luwangan contains only sinalokan. These
    conclude short paragraphs focusing on commonly arising affairs. In the LOr 7410
    version the subjects are further indicated by key words written in the left-hand
    margin of the manuscript. Their completeness extends to multiple sloka. One for
    winners, corresponding to a jayapatra,¹³ in the Independent Kingdoms repeating
    a surat kukudung; for losers, an almost identical surat sararan; and often a third
    for the master involved. Concern for the loser(s), as well as the winner, was
    part of the self-fulfilling character of traditional Javanese law. Whereas victims
    need incentive to carry out the terms of the ruling, it was crucial that it be
    accepted by the losers in order to avoid the necessity of evoking instruments
    of enforcement, in which any event were not normally part of the island''s governmental
    instruments.


    On first reading, the Luwangan gives the impression of a random listing of misdemeanours
    and crimes. This precluded resolutions and/ punishments by the appropriate sinalokan.
    Two have been discussed earlier. These include the sama bangga [...] taru and
    mistika brahmara [...] ngalen-alun phrases in the first part of the Jugul Muda
    and repeated in Cac 4. Confusingly they are referred to as sloka, which shows
    the ease with which sloka could be appropriated in part or wholly by sinalokan.
    According to the marginal notations in LOr 7410, the Luwangan contents touch on
    such elements as murder (mamaten 3), robbery (beg 4), stabbing (suduk 6), sorcery
    (neluh 7), as well as the ''crime of silence'' (sidhem papatih 16), ending with
    cases not allowed to be due to


    ¹³ Holey, ‘Continuity and change’.'
