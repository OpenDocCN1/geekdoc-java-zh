    # Aji Saka lives:


    Aji Saka''s aksara/sloka are prospering in today''s Indonesia. Interpretations
    have been advanced by serious and frivolous scholars, commentators, bloggers,
    etc. What is common for all of them is that the uncompromising loyalty of Dora
    and Sembada to their master''s conflicting wishes (setia v. durhaka) have given
    way to a more nuanced version of various degrees of chicantry. Modern versions
    also tend toward moral philosophy and mysticism. No less than a figure than Pakubuwono
    IX (1861-1903) is said to have created a moral philosophy from the aksara comprising
    the Dora-Semb story. It was resurrected and commemorated in a new building in
    the Yogyakarta kraton, the ''Balai Kajian Sejarah dan Nilai Tradisional'' dedicated
    on 13 July 1992. The philosophy is introduced by a classical Javanese verse, which
    translates as:


