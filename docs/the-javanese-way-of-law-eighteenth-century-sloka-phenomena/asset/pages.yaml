  md: '# Appendix II Classic Sloka


    The legal sloka considered in this work are ''classic'' in the sense of ''remarkably
    typical: outstandingly important.'' Frequency of occurrence and usefulness in
    clarifying the sloka phenomena of the Independent Kingdoms provide the criteria.
    In this respect some dozen sloka are particularly relevant to the present study.
    They come from the Jugul Muda, Jaya Lengkara, and Surya Alam, those found in related
    ''minor titles'', all cited as sources of 1768 Pepaken Tjerborn. The twenty-four
    consideration may seem an inadequate representation of even legal sloka. They
    contrast with some fifteen-hundred sloka and sloka-like phrases contained in Javaansche
    Zamenspraken. In defence it can be pointed out that the present work is a study
    of their function as examples of a code rather than the entire body of such phrases.
    Consequently, their number suffices to establish the importance of the sloka phenomena
    as for delving into the vast number of sloka-phrases, legal and non-legal, contained
    in the Javanese manuscripts.


    At the outset it should be noted that at consistency in the organization of this
    appendix are thwarted by the contrast in available and comprehensible information
    concerning individual sloka. Here they are ordered after their appearance in respectively
    the Jugul Muda (nos. 1-13), Jaya Lengkara (nos. 14-22), and Surya Alam (nos. 23-24),
    although they are repeated in the other titles. Afterwards for reference an appropriate
    name has been assigned to every sloka. The sloka are cited in the most usual form
    and their source provided. This is followed by Translation (literal or literary)
    and references to Copies and Variations. The latter consists of both literal phrases
    from other titles and longer explanations. In instances where the title provides
    its own complementary explanation, this is recorded in my translation under the
    rubric Textual Explanation. Given the importance of Javaansche Zamenspraken the
    work ''Interpretation of quotes'' from available Winter''s contribution translated
    into English from the Javanese in ha-na-ca-ra-ca script. In many cases a Modern
    Translation is available which draws from one or more of contemporary Indonesian
    authors as Suarno, Darmasoetipta, Ngafenen, and Hariwijaya. In special cases,
    as no. 2, an Analysis added. More commonly such considerations are relegated to
    the specific chapters focusing on respective sloka phenomena.


    The Concise Oxford Dictionary.'
