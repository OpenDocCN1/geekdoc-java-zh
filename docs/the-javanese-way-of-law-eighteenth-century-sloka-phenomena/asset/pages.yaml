  md: '# Prakara


    The fourth component of traditional Javanese law consists of prakara. While sloka,
    aksara, and sinokan, are specialised, each having their own consistent core, prakara
    (perkara ng prakara kr 1 matter [...] 3 lawsuit case) are derivatives. Albeit
    in abbreviated or random form, they repeat, quote, or embroider on phrases identified
    as other sloka phenomena. For example, sloka are not uncommon included under both
    the standard 144 prakara items as, in the Combi Surya Alam § 11 nos. 19, 20; §
    14 no. 6; and § 15 no. 1; as well as in those standing outside the standard 144
    as §§ 24, 29, 34 no. 3, and the Berlin dozen Surya Alam is included with its mixing
    of sinalokan and sloka, dozen full-fledged sinalokan are recognisably listed as
    prakara. Generally common is the inclusion of aksara, both aksara (andh-andihan)
    and aksara salah (uger) within prakara. The latter case are listed under the Twenty
    Prakara in the Yogyakarta Surya Alam § 11 as a block mixed with other concepts
    as corah, tatayi, enumeration of the scourges (getgetheng) in Classic Sloka, no.
    6, and vignettes as Ni Ind. Because they are copies or representations, a great
    number of them have come down to the present. Sloka are thereby transformed from
    pithy phrases into idiomatic expressions and proverbs. The Twenty Prakara (Table
    6.1) nearly half of them have found their way into modern Javanese proverbs. This
    argues that prakara were both shorthand for phenomena of traditional Javanese
    texts and the source of future proverbs.


    By way of documenting the first point, namely prakara borrowing from other sloka
    phenomena, a small, but revealing examples can be considered. The Twenty Prakara
    (§ 11) from the Yogyakarta Surya Alam provides an appropriate point. It includes
    as the next to last item the common sloka/sinalokan: adedamam tanggal sapisan
    kapurnum. The phrase’s original emphasis is the figurative shift from the light
    of a new moon to the brightness of one. The message is illustrated in the Ki Samar
    v. Ki Awak vignette presented in Chapter 2 under sinalokan. The narrative of Ki
    Pepakum Tjerbon (nos. 18, 13) illustrates how the darkness surrounding the claim
    of Ki Samar (vague, obscure) was dispelled by the veracity of Ki Awak (able to
    see, sight, proper). Modern compilers explain this as a bebasan (saying, set expression):
    when the lamp becomes brighter, the victory finishes the set, alternatively: using
    the illumination of the rising moon, suddenly comes the light of the full moon
    [which clarifies things]; From the natural parallels to practical jurisprudence
    comes another'
