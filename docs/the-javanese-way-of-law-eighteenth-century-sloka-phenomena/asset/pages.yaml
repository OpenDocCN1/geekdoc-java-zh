    *3–7* – respectively ‘Sloka’, ‘Aksara’, ‘Sinalokan’, ‘Prakara’, ‘Vignettes and
    Practice’ – constitute the work''s substantive constitution. They draw upon a
    range of titles for discussion of these key elements and provide the textual content
    of the *sloka* phenomena from which they take their significance.


    Section III. ‘Character, App Demise, and Context’ summarises the basics of traditional
    Javanese law (Chapter 8. ‘Character’) and relevant developments taking place the
    period under scrutiny (Chapter 9. ‘Context’). More specifically, the first half
    of Chapter 9 traces the fate of traditional law and particularly its formal disenfranchisement
    by the ‘New Legislation’ introduced by the Dutch East Indies government between
    1846 and 1848. The radical step was facilitated by the legal vacuum during the
    Cultivation System era (1830–c.1870), a gap paralleled by the reformulation of
    law in the region which would become the Kingdom of the Netherlands. Despite such
    measures, sources of traditional law continued to be copied, edited, and revised,
    raising the possibility that the cleft between banished and presumably forgotten
    Javanese written law and the living oral *adat* is overemphasized. The last half
    of the chapter documents the longevity of the *sloka* phenomena into the present
    as modern references, both written and on the Internet, and even a tendency to
    merge with contemporary Islamic ideas of public morality. Section IV supplements
