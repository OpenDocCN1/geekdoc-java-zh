    THE JAVANESE WAY OF LAW


    of the much larger number of the Thirty Prakara in Chapter 6. While some of the
    terms from high Javanese (*krama*) with a possible Old Javanese derivation, often
    they are *ngoko* of everyday usage. None have a discernible Sanskrit origin. A
    more significant point is their function. As to be expected from precepts precipitating
    in the coals of Hell, they bring about defeat. At first glance they seem to describe
    formal defects or inconsistencies. In fact, the *urger-urger* do not so much weaken
    a case or so invalidate it. Key here is the fact that such deviations from the
    law require the plaintiff to compensate the defendant (nos. 1, 4–7) and are fixed
    in addition.


    As found in the legal traditions the message of the *urger* seems clear. Those
    bringing a suit before the formal authority, the *sosoca ing negara* (the jewel
    of the land, i.e., the sovereign or his surrogate the *patih*), must conform to
    a set of standards known in advance through the requirements of the *urger* and
    similar prerequisites. These include congruence between written documents recording
    the plaint and the plea – later texts specifically rule making the one from the
    other – between documents, and between documents and witnesses. Witnesses must
    not only measure their in in that acts, they are experienced or saw what they
    testify to, but also fulfil moral and physical standards in order to qualify as
    acceptable (cf. *Surya Lanka*). If these standards were not met, the suit could
    not be accepted by the authorized legal body. In such cases often carried an additional
    punishment of levying a fine (*dhendha*) on the initiator of an unsupported, and
    by implication false, case.


    # Rajaji mode


    The third stage of the *aksara* of the Jaya Langkara is marked by the transition
    to ‘...’, the meaning [of the terms] (*tegese/artininpun*) followed by an abbreviated
    epitome of the individual *aksara*, several of which cite the relevant *sloka*.
    Derived implicitly from the text’s contents, Table 4.4 lists the functions of
    the *aksara* as legal instruments.


    On the simplest level the *aksara* of this mode signify a division of labour between
    king and *kerta* with a single provision for the *pangulu/pengulu*. The first
    five (*badan, angin, banyu, bumi, and lintang*) expounded by pathihs Kerta Basa
    and Sunduk Prayoga applies to courts of justice (*kerta*), the next six (*thathit,
    lék, bulan/segara, kilat, and sreng*) expounded by Anggas Kara, Niti Sastra, and
    Madana Sraya are coupled to sovereign authority; while *kukus* (smoke), also mentioned
    by Madana Sraya, surrendered to the *pangulu*. Regardless of whether they were
    delegated, and thus handled by the *kerta* or *pangulu*, all ultimately fell under
    the responsibility and authority of the sovereign. If this was the only information
    available, we would have little'
