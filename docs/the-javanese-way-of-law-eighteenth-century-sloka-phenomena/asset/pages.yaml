  md: '238


    THE JAVANESE WAY OF LAW


    Four titles whose potential value is not at present reliable take a prominent
    place in the manuscripts drawn upon this study. There are from LOr 7440 and one
    from Add 12 303. It will be recalled that LOr 7440 identifies three titles coming
    from the pen of an early eighteenth century Sumedang jaksa, Candra Yuda, which
    precede the mainstream titles. We include *Niti Sruti* (ff. 1-34), a *Niti Praja*
    (ff. 33-72) – both with an apparent Old Javanese flavour – and a *Sundak Prayoga*
    (ff. 73-100). The latter is also found in a variant version of Add 12 303 (ff.
    357-35v) and Add 18 398 (ff. 40r-4v). The fourth title of interest is the *Kuntarakara*
    from Add 12 303 (ff. 31-357). More than just rounding out a list of manuscript
    sources, the *Sundak Prayoga* and *Kuntarakara* provide some challenging variations
    on the usual forms of *sloka* phenomena contained in Pepagem Tjjerbon-era sources.


    # Niti Sruti


    *text (kitab), the heritage from the elder, our humble servant Candra Yoda, jaksa
    of Sumedang*'' (f. 74).


    The titles provided by the respective manuscripts are by no means the originals.
    LOr 7440 was copied by a single hand, most likely closer to the random dates from
    the nineteenth century found in the manuscript than the era of Candra Yuda. Yet
    the use of the term ''*kitab*'' (text) is significant. Standing in contrast to
    *tulis* (writing) of the first quotation, it would seem to indicate that the whole
    manuscript was part of his heritage associated with Sumedang''s past. This is
    spelled out by the immediately following notation in a different hand, thus one
    foreign to the manuscript''s contents.


    [A] reminder, the time of recreation of this text (*kitab*) from His Royal Highness,
    Adipatih Suriya Nagara by this humble servant Nyatanu (?'
