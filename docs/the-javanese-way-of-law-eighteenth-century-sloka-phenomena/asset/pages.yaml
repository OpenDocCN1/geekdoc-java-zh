    # THE JAVANESE WAY OF LAW


    prohibitions on *riba* (usury) (§ 46). Somewhat more numerous are instances of
    parts of *sloka* incorporated into *sinalokan*. A telling example comes from the
    *sloka: lurung buntu*, which means ‘a court case that cannot proceed because of
    insufficient evidence and [or] lack of witness.’¹⁴ It is found in Luwangan (§
    48) with reference to a case of which the homeowner is passive. The text adds
    that ‘the miscrime is caused to be lost (*dustma mangilangkan*)’. According to
    a judgment of a Java-Dutch court in 1717 described, it suggests that the whole
    process shows the [uncertainty] of accusations (*kelebt taka baya*). Again, the
    modified phrase is purely descriptive and has been tailored to fit the specific
    occasion.¹⁵


    Closer inspection of the Luwangan’s fifty or so paragraphs reveals a more ambitious
    plan of integrating older judicial concepts into the context of the *sloka* phenomena.
    This is most clearly seen in the *sad-atatayi*. As documented in Appendix IV,
    these derive from Old Javanese legal precepts, which in the Independent Kingdoms
    era were transformed into *sloka*.¹⁶ On the basis of similar ruling – the actual
    rubrics as *sad-atatayi, sanggraha/sanggama, astha corah*, etc. are not cited
    directly – and ended phrases, it becomes clear that the Luwangan was attempting
    to *sinalokan-ize* such concepts. Paragraphs 2–12 list the atatay, in more numerous
    variant forms and overlapping definitions, in order to make them recognizable
    sinalokan. The use of three aksara – *kilat/thathit, bumi, and rengséné* as key
    terms by the *Arya Dilah* (§ 1), both co-opted as *sinalokan* in the additional
    paragraphs listing the aksara bener (*andhih-andhih*, §§ 51–52) and aksara salalah
    (*uger-uger*, § 54), both from LOR 7440. The astha corah are given block sinalokan,
    for the first one as named in the Luwangan and one for the last. And finally,
    the *sanggraha* (illicit sexual intercourse) consistently ‘named’ (*arané*) in
    other texts are transformed into *sinalokan*, while reinforcing the nature of
    the transactions. ‘sinalokan-ification’ of the *sad-atatayi* is the most comprehensive,
    and it is worth pursuing further. Table 5.1 sketches the contrast. The left-hand
    column gives the Luwangan paragraph number, the Javanese term, and the relevant
    sinalokan; the right-hand list lists the equivalents from the legal literature
    of the period.


