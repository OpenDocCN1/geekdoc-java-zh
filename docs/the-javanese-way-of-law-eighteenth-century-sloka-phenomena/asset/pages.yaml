  md: 'of the term within older literature are limited to two instances, both from
    the Middle Javanese historical novel Rangga Lawé. In they caution against ignoring
    the teachings of the aksaraji ''...precepts esteemed'' (sasana nèng alewh), Rangga
    Lawé posed one of the most dangerous threats to the rule of Hayam Wuruk (r 1350–1389)
    the boy king of Majapahit. In principle the revolt challenged ''kingship'', the
    object of aksaraji. With born of hindsight the following presentation advances
    seems to be a more appropriate interpretation of the ''precepts esteemed'', namely
    the exercise of royal authority without recourse to procedure. Direct punishment
    at the will of the sovereign was a crucial ingredient. In a nutshell this was
    the advice communicated in sloka to Raja Mahapunggung by his ministers in the
    Jugul Muda. It was also based on the assumption of loyalty parallel to demanded
    of Dora and Sembada by Aji Saka.


    # Aksara in the Jaya Lengkara


    The opening paragraphs of the Jaya Lengkara imply that the period under discussion
    constituted departure from its predecessors. The great durbar convened at Medhang
    Kamulan specifically concentrated on two points. These were 1) imajuama, i.e.,
    experience/custom stripped of the Hindu concepts in the Middle Javanese tradition
    of the Rangga Lawé, Agama, or other works prominent within a Balinese context,
    and 2) the rules laid down by the aksara. The text of Add 12303 summarised in
    The Archive of Yogyakarta provides the point of departure.


    This narrative tells of His Majesty, crowned king at Medhang Kamulan, Sri Jaya
    Lengkara, sitting in audience before all the kings who had to submit under Medhang
    Kamulan from the regions, the king from the winds sang Angkor Kerta with his path
    Kerta Basa, the king of metaphors (ibarat) sang Kuthara Manawa with his path Sunduk
    Prayoga, king of Pangukul Angin, sang Raja Niti, with his path Piti Syara, king
    of Tunggul Amet sang Lembu Jawa with his path Anggas Kara, and king of Petung
    Manglars Jaya Pralambang with his path Niti Sastra.


    The list of ministers is similar to those cited by the Jugul Muda in which the
    dignitaries bears names of recognizable books. Unlike, however, the Jaya Lengkara
    departs by naming delegates from the lands ''above the winds'', a characteristic
    it shares with the younger Surya Alam tradition.'
