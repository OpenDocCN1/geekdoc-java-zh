    # Sinalokan


    The third layer of the phenomena consists of sinalokan. Grammatically sinalokan
    are direct derivatives of sloka. They are formed by the addition of the passive
    suffix ''-in-''plus the causative ''-aken/akan''. The resultant meaning is something
    like ''to be formed of/from sloka''. Sometimes mistakenly mixed by copies, the
    two are conceptually separate. Sloka defends the affairs by how they are applied;
    sinalokan are cited or occasionally coined at their conclusion, often incorporating
    parts of existing sloka. Not noted above, the last section in the Leiden manuscript
    versions of the Jugul Muda turns into short vignettes summed up in sinalokan.
    Along with the published Surakarta book they present nearly fifty vignettes. The
    first half dozen with major criminal acts in the form of miscreants named Korah
    (theft), Ki Tatayi (evil donor), Ki Walat (violence), Ki Sangraha


