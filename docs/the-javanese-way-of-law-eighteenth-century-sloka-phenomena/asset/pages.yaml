    ing sla* ''a mushroom growing on a stone'',¹⁶ an impossible task. They were expected
    to fulfil an unrealistic task of uniting the contents of authentic Javanese titles
    with Dutch Company demands. In practice the principles of local law had to give
    way to the practical exigencies of foreign rule. The archives leave no doubt that
    the intention was to create a text for handling the legal affairs of the ''natives''
    by indigenous law, an ambition seemingly forgotten within a couple of decades.
    Apparently for the new rulers *aksara* and *sloka* did not offer immediately recognisable
    functions. Hence, they were omitted in the finished product. As a result, later
    researchers were confronted with an emasulated standard text.


