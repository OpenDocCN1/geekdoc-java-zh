    # A triangle drama


    Another example from the vignettes constituting the middle section of the Jaya
    Lengkara is the affair of Ki Anggas, Ni Prana, and Ki Sungging Panuksma. It is
    included as the opening vignette in virtually all versions of this title. In capacity
    it is representative of these special sinalokans into the names of the actors
    were woven, like the Boga-Andrawahin vignette. The story, summarised in Chapter
    5 (p. 79), revolved about Ki Anggas''s responsibility for the death of the painter
    Ki Sungging Panuksma. The motive was apparently Ki Anggas''s jealousy over a drop
    of paint spilled on Ni Prana''s breast while her portrait was painted.


    The Arya Dilah (§3) suggests a deeper connection on the part of Ki Anggas. The
    paragraph in question reads:


    This is the case of persons engaged in adultery (jinah), who are caught in the
    act by the family, it is permitted to take the life [of the man] without fear
    of punishment. [However] if one [the adulterer or the protector of the woman]
    dies, the alarm must be sounded, and a plea submitted to the authorities. After
    the death has been established it is allowed to levy a fine (raja dhendha) of
    eight laksa, with the sinalokan: anggas prana, sandhi upaya krama yojana, ing
    pati or in the Anggas-Prana affair a hidden stratagem [has been used to destroy]
    a healthy marriage [resulting] in a death.


