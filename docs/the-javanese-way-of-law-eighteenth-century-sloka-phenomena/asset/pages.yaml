    and the Dutch text are not as clear as its editor would have believe. At issue
    is the apparent incongruity between their general similarity and a lack of a one-to-one
    correspondence between the contents of their respective paragraphs. In short,
    the relation between the de Nooy text and the Javanese pekem-s, which are said
    to be its source, is tenuous. The implicit assumption is that the contents of
    the de Nooy text are identical with that team Hasselaer had to work in the second
    half of the eighteenth century. In practice this means attempts to go beyond the
    Dutch text and to compare its contents with the (more) original expressions are
    frustrated by the uncertainties of date and provenance of the Javanese language
    part of the *Papakem* Tjerbon publication.


    The issue is exacerbated by hiatus and differences in length of respectively Dutch
    and Javanese renditions of the same paragraphs. The de Nooy manuscript was found
    in 1895 after a search in the Virebon archives the preceding year proved to be
    fruitless. Although not conclusive – could still be an older text, which remained
    undiscovered in some collection – lacunae and maynates between the two do not
    inspire confidence in its authenticity as reflecting the pre-1768 contents of
    Javanese pekem. No folio numbers are given for the Javanese text with which to
    ascertain the source of the relevant passages. In any event, several other manuscripts
    cited in Chapter 2 have better credentials. Even the solved checking of the de
    Nooy contents contains the manuscript versions drawn down in this work proves
    to be more than justified.⁵ It seems more profitable to concentrate on the manuscript
    versions and use the Dutch text to supplement the information provided.


    # Contents


    The *Papakem Tjerbon* publication consists of three sections. The first section
    consists of an introduction to legal procedure entitled Manner of Procedure at
    Virebon under the direction of the Seven Jaksa and the Sultans Collectively’.
    This eighteen-page treatise on procedure (pp. 1-18) is generalised by considerable
    legal formalism, particularly in the use of written documents and the requirements
    of consistency, absent from both Javanese texts and the few case examples from
    the period. No Javanese text is cited as the source to match the Dutch paragraphs,
    resulting in blank spaces in the right-hand column. This means that the ‘Manner
    of Procedure’ was not part of the de Nooy manuscript.


    +   5 Preliminary comparison of supposedly identical paragraphs between the de
    Nooy text and relevant manuscript texts as the Raja Niscaya and Jaya Lengkara
    show that considerably less than half match. Most of them come from sources other
    than those cited by the de Nooy text.'
