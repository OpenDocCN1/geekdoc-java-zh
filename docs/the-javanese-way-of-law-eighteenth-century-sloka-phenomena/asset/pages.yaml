    # Modern interpretation

    ''durjana who is well known to have the character of continually (happily) destroying
    [property] and damaging others is condemned to death. The meaning: a person whose
    fate is misfortune occasioned by his own actions''.²


    Analysis

    Typical for the genre, the significance of a sloka extends far beyond the textual
    explanation. In the present instance this contains only the first part of the
    sloka, namely concerning mice and bees as unwanted guests with well-known evil
    characteristics, which occasions sounding the alarm (titir). While this provides
    motivation for ending their destructive activities by allowing them to be killed,
    it allows the more important part of the sloka as License consists of two parts.
    The first—surah ing paham—means unclear. Suarno, Dictionary, no. 948, gives ''a
    ''applauded by a storm'', an alternative dictionary meaning is (¹ to possess special
    (supernatural) power (weapons, words), that is, someone with supernatural powers.
    Prawiroatmodjo, Kamus Jawa Indonesia for ampuh ''a storm and misty rain'', while
    the der Hout vision maintains that it is the sound of mice.


    The second part—mati déning alun-alun—conveys this intention. It cannot be denied
    from the literal meaning of the sloka''s contents, even though it is crucial to
    the phrase''s function. The literal meaning of ''dying by the grassy tony square'',
    is negated by the phrase of causal conjunction déning (i done) by; 2 of. A solution
    is provided by a version found in Lo 740, 7.ttv. A textual explanation clarifies
    the phrase ''dying because of his acts''. This is seconded by Winter, Javaasche
    Zamenspraken, Vol. ii, pt. 3, no. 442, which provides a parallel of ''dying by
    his own utterances''. In other words, alun-alun has a non-dictionary meaning of
    deeds, behaviour as reflected in the modern translation by Ngafen, Parasan. The
    point is crucial to the self-enforcing character of Javanese language. However,
    without the existence of an alternative title the phrase must either be left unexplained
    or


    ² Ngafen, Paribasan, p. 88, also see Suarno, Dictionary, no. 948.'
