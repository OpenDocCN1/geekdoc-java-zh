    Hasselaar for consequent scholarship. The voluminous manuscript containing titles
    Jaya Lengkara, Arya Dilah, Raja Niscaya, and the like have not attracted scholarly
    attention. This may be due to the assumption that the Pepakon Tjerbon contains
    the true essence of Javanese law. In fact, it constitutes a highly selective version
