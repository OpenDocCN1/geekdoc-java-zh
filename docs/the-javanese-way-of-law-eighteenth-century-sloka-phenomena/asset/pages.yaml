    provides a window of access for reconstruction of the (more) traditional

    law of the island.


    The sheer volume of references to custom within Javanese legal texts

    obligates one to consider them as a potentially rewarding field of research.

    In this respect, the present work''s contribution lies in the obvious; the only

    way to reach the path earlier than the span of human memory is to consult

    sources that have survived, namely datable written texts. The existence of

    the sloka phenomena embodying contemporaneous local custom adds a

    retrospective dimension to sources otherwise limited by the living memory

    of its practitioners. Since the sloka phenomena are quoted, not created, by

    the transmitters of the tradition, they must pre-date them. Should one find

    a way to determine how much so, then we would have a research tool of

    considerable historical significance. There is some belief in this direction

    is indicated by the tag ''Old Javanese'' appended to sloka and sloka-like

    phrases in modern compilations of such terms. Basically, the term refers to

    language employed in order to differentiate from present-day Javanese.

    However, because Old Javanese was used on the island throughout the

    period up to the fifteenth sixteenth centuries, it can be interpreted

    indicating that the phrases in question originate from a period pre-dating

    the sources used in this inquiry. Again, the postulate cannot simply be

    written off because the form and contents of the law used in the fourteenth

    century and is far from clear. Looking in the opposite direction, the

    temporary renaissance of interest in Javanese tradition, including the

    sloka phenomena, attends to their longevity in the eyes of contemporary

    Indonesians.


    A final touches on the intellectual debt owed to scholarly

    predecessors for the same end. Despite that it was

    ot always directed to the same end. A special place is held by C.F.

    Winter''s prodigious collection of "verbs/maxims, adages, sayings, and

    other subjects" (salokas, paribasans, wangalsans in anime onderwerpen)

    found in Javaansche Zampraken (Javanese Dialogues), as does the

    observation of its editor, Salomon Keycer, concerning the close relation-

    ship existing between such phrases and Javanese law in the Forward to

    the second edition of 1858. Other contributions include G.A.J. Hazeu''s

    edition of the Cirebon law book, the Pepakem Tjerbon, and Mijnheer van

    der Der Hout''s translation of the Kartasura Surya Alam. Regrettably, neither

    scholar followed up on these projects. A more modern debt is owed to

    Peter Suwarno for his comprehensive Dictionary of Javanese Proverbs and

    Idiomatic Expressions.'
