    # Javanese written law


    More than just an anomalous reference to Hindu cosmology in an era assumed to
    be Islamic in character, the components singled out by the Wadangun Wangkara dominate
    traditional Javanese written law. As the subject of this inquiry it is traditional
    by virtue of stemming from an era semi-independent kingdoms, successors of earlier
    Hindu-Javanese kingdoms modified through accumulate internal developments and
    the island''s conversion to Islam. The latter is usually understood as having
    taken place from the fifteenth century onwards marked by the rise of prominence
    of the Demak federation on the eastern Pasir (java northeast coast). This took
    place under the leadership of Raden Patah ( Kyai Senapati Jimbun). Raden Patah
    by tradition is seen as the vanquisher of the Hindu-Javanese Majapahit Empire,
    the greatest figure of which was Patih Gajah Mada (c.1290-1364). With decreasing
    authority, the Javanese kingdoms continued to function throughout a period which
    the island''s legal institutions were successively inundated by rules, regulations,
    and practice resulting from the growing political hegemony exercised by the Dutch
    East India Company. Although a period of transition extended over a relative long
    period of time, it is best documented from the eighteenth century which saw the
    kingdoms of Banten-Lampung, Cirebon, those of the Priangan region, Mataram (after
    1755 Yogyakarta and Surakarta), and Balambangan brought under Dutch Authority.
    As result, ''Independent Kingdoms'' has been coined for the period more appropriate
    than an unwieldy ''Semi-Independent Kingdoms'' or a deterministic ''Pre-Colonial
    Period''.


    Traditional law is Javanese in two respects. The first lies in the medium of transmission.
    Its texts are written in common or ngoko (the basic speech of Javanese) using
    the ha-na-ca-ra-ka alphabet, the twenty aksara or more accurately the tajayana.⁵
    An exception is the Kartasura Surya Alam written in ‘pegon’ (Javanese language
    written with Arabic script), but subsequently copied in ha-na-ca-ra-ka. The second
    aspect is Javanese'
