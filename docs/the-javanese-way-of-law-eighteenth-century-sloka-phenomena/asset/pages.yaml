  md: 'Thus, there seems good reason to wonder if the commonly-accepted juxtaposition
    of *adat* (oral custom) and *ubaya*, undhang-undhang* (agreement of written governmental
    ordinances) was valid for the earlier period. More likely the legal tradition
    of the Independent Kingdoms period embraced both textual as preserved in the titles
    considered here and an equivalent tradition to which we have no access. Hints
    from the sources and logic argue that they were compatible, if not congruent.
    Gobius’ 1717 reference to the ‘adat of the jakssa’ The titles considered here,
    which continued to be reproduced well after the Dutch East Indies government invalidated
    all prior written forms, undoubtedly would emerge as *adatrecht* in the late nineteenth
    and early twentieth centuries. Hence dominance of *adat*, in all its all-embracing
    authority, was an artificial product of Dutch fiat. This does not, argue, that
    its contents were not authentic. Just that elimination of traditional written
    law contained in the titles analysed allowed the oral version to dominate, carrying
    with it the danger of overestimating its significance.


    To return to the question posed at the start of this section, the titles of what
    has been identified as traditional Javanese law collectively comprised a repertoire
    of legal principles by time and usage. Admittedly varied in composition. In addition,
    it remains unclear what provided the basis for choosing which principles/concepts
    were to be reproduced in texts. By no detracting from their validity, the heterogeneity
    and generalization must be counted as a *sine qua* of a system in which precedent
    and consistency were not considered essential, despite that no single text constituted
    an all-encompassing law. Should an important principle not be found in the *pepakem*
    of one expert, the appropriate element would turn up in the collective memory,
    a written one, of another. Hence continuation of this collective legal memory,
    even after its validity was altered to the oral form of *adat*, is understandable.
    Under the circumstances it would be illogical to abandon the written records of
    the legal tradition via the commands of the (temporary) authority of the Dutch
    East Indies government. The fact that these basic principles have continued or
    re-emerged in modern times attests to the longevity of the system.


