  md: '# 8 Character


    At this point it seems prudent to remind ourselves that the sloka phenomena are
    instrumental. They constitute facets of law that both served the community and
    were created by it. With the knowledge gained of the sloka phenomena, discussion
    can turn to the broader significance of the law valid during the Independent Kingdoms
    era. A start can be made by emphasising its break from what we know of the law
    of Old Java.


    # Sloka phenomena as unique


    Appreciation for the uniqueness of traditional Javanese law comes from comparison
    with what little is known of its predecessors. It has long been assumed that the
    law prevailing in the era of Old Java can be reconstructed from manuscripts copied,
    preserved, and edited by Balinese scripts. However, the present work is concerned
    with legal history only in so far as it touches on the sloka phenomena of the
    period under consideration. Nevertheless, any discussion of the subject must consider
    the accessible titles ascribed to Java and Bali, for example, the Agama (of both
    Java and Bali), as the Balinese texts Adigma, Kutara Agama, and Purwa Agama.¹
    One summary reading of the contents of those texts reveals the lack of expressions
    identifiable as sloka phenomena. The hundreds of paragraphs comprising these texts
    yield only three dozen expressions vaguely resembling those of the Independent
    Kingdoms. The only sloka reference discovered to date from the apparently Old
    Javanese Adagama in connection with false witness.


    Because phrases resembling sloka of the Independent Kingdoms are uncommon in titles
    of Java and Bali, a few examples can be given by way of illustrating their format
    and method of expression. Most of the three dozen deemed repeated in several deals
    with wak parusa, literally ‘verbal violence’ illustrated by the Bali Agama § 295
    and 297, as well as § 230-235. They concern and insults. Significantly, they are
    dependent on a strictly observed caste hierarchy, which does not seem to have
    characterised


