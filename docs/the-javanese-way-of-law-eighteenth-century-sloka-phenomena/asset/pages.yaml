    # Late date


    A second point arguing against accepting the Pepamak Tjerbon''s contents as authentic
    Javanese law comes from the relative late date of the compendium. By 1768 the
    Dutch East India Company''s representatives had dispensing law for the subjects
    of the principality, as well as the regencies of the neighbouring Priangan region,
    for close to eighty years. Study of cases handled by the Java-Dutch courts has
    documented the type of changes in procedural and substantive law brought about
    by the existence of alien hegemony. In fact, the last case in which the jaksa
    participated from more than two decades before the promulgation of the Pepamak
    Tjerbon, namely the Sultan Cirebon by Anon (1743). By 1768 the text no longer
    reflected authentic Javanese law, but one characterised by a relative degree of
    alien accretions. Supporting arguments concentrate on two points, namely artificial
    innovations and literal authenticity


    # Artificial Innovations


    Several radical changes in the fabric of law appear without warning in the Dutch
    publication. This text contrasts with the legal tradition established on the testimony
    of its own texts. The first and most obvious example comes from innovations within
    judicial authority for assigning capital punishment for criminal activity. The
    Pepamak Tjerbon cites the ''six points'', actually the sad-atatayi (Six Tyrants)
    discussed in Appendix IV. The provision is neither West nor Central Javanese examples
    of that. Even more remarkable, the Pepamak states that these crimes lead to capital
    punishment under the authority of the pangulu!, originally a leader from ''ulu''
    (lit. head; leader), had taken on the meaning of chief religious official in the
    community. To the extent this was realised in practice it would signify a shift
    from purely authority (backed by the Company) to that exercised by religious functionaries,
    which otherwise consciously excluded. Out of the existence of institutionalised
    pangulu courts but also to punish transgressions of the sad-atatayi, along


