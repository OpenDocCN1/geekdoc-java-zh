    THE JAVANESE WAY OF LAW


    The literary summary does not justice to the legal aspects of the case. Comprising
    some two dozen verses, the trial scene is particularly informative. It provides
    a unique witness to legal process before a traditional Javanese court. Whatever
    the inaccuracies arising from poetic license, they are more than compensated for
    its indigenous character, one apparently not influenced by European concepts.
    Because the narrative is self-explanatory, only a few points need emphasizing
    here. As to be expected, *jaksa* supplied the textual expertise. This included
    several *sloka* and *sinalokan*, as well as references to legal instruments in
    *aksara* and *prakara* played an important role. Moreover, the ending graphically
    emphasizes the major concern of traditional Javanese law, namely a return to relative
    *tata tantrem* over abstract concepts of justice.


    Yet appears to be an anomaly in the affair. This is because the ending seems to
    indicate crime pays. By skillfully using principles of Javanese law – the evidence
    of the (dog''s) belief (*bukti*) and the alarm – Kartiguna literally got away
    with murder. One cannot dismiss the possibility that the episode addresses a higher
    order of morality. In long term perspectives the settlement may have been aimed
    at providing a counter to the arrogance characterizing Japlak''s actions. This
    has gone so far as bragging about Kartiguna''s wife and children as debt slaves
    resulting from a wager. Had it a question of only legal tricks, then stands 187-191
    would be superficial. Their message is clear: the case is resolved by litigants
    accepting the equity contained in the *salaran* and *kukuding*. Both explicitly
    accepted them: ''Finished is this case, not to be heard of again (190).


    The concluding *sloka/sinalokan: yukti bukti* [...] brings us the full circle
    back to the *sloka* of Jugul Muda. To Classic *sloka*, no. 1: *sama* [...] has
    thus been ''yukti bukti'' to create a *sinalokan* through which the affair was
