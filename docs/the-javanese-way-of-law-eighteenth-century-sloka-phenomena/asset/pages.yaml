  md: '# THE JAVANESE WAY OF LAW


    But what were the *astha corah* and *astha dusta* to which should be added that
    of the *sad-atatayi* or Six Tyrants? They constituted transgressions which entailed
    the severe punishments ordered directly by the sovereign and normally not require
    judicial process. Found only in younger texts dating from the period of ‘Indigenization’,
    the three categories can be summarised.


    *Sadatatayi* or Six Tyrants consist of:


    +   1. arson (agnida), 2. we attack (amok/waja wangkara), 3. molest/abduct women
    (datikrama/murugul/strisanggrahana), 4. betrayer of kings (pw/isuna), 5. poisoner
    (wasada/upasi), and 6. sorcerer (neluh).


    *Astha corah* or Eight Kinds of Misconduct, consist of:


    +   1. evildoer (karta), 2. collaborate with an evildoer (karhitat), 3. befriend
    with an evildoer (avpritika), 4. give food to an evildoer (bhakhtadah), 5. relative
    with an evildoer (sahacahara) 6. know the actions of an evildoer (talayah), 7.
    assist gives weapons to an evildoer (tritah/tulun), and 8. shelter an evildoer
    (goptah).


    *Astha dusta* or Eight Factors, consist of:


    +   1. murder of an innocent person, 2. order the murder of an innocent person,
    3. wound an innocent person, 4. accompany a murderer, 5. befriend a murderer,
    6. shelter someone to a murderer, 7. eat with a murderer, and 8. help a murderer.³


    The evidence suggests a process of the institutionalization of original Javanese
    crimes derived from Sanskrit models. *Amok* (blind attack) and *mangler* (molester/abductor
    of women) of the Kaladi inscription were incorporated into the category of *sad-atatayi,
    maling* (thief) remained under the *astha corah*, wangkey kabunan (finding a buried
    corpse) was dropped from that category, although it retained its serious character
    by demanding answerability for those living around the site of a murder.* By the
    time of the Canggu inscription in the mid-fourteenth century categories had taken
    on sufficiently concrete form to be cited under Sanskrit rubric of *astha corah*
    without needing to name the contents. Alternatively, a single reference, explicitly
    in the case of the *astha dusta*


    3 The *sad-atatayi* and *astha corah* have been discussed in Hadoley, ‘Sanskrit
    Continuity’, based upon the Salokantara and Wratisasana; the *Adigama*, in Hadoley
    and Hooker, ‘The Law Texts of Java and Bali’, pp. 326–331; and *The Agama* §§
    55, 176, 181.


    4 *The Agama*, Art. 66.'
