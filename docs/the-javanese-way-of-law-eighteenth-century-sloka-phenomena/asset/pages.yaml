    However, before showing how individuals focus on specific phenomena, we must dispense
    with the notion that *sloka* of the Independent Kingdoms were identical to or
    even dependent upon foreign historical models in but name. Unlike the remainder
    of the phenomena, the term ‘sloka’ (alt. *saloka* or Sundanese *siloka*) has both
    a long and foreign history. The original meaning and function emphasize the uniqueness
    it has taken on as the key concept of the Independent Kingdoms era. *Sloka* is
    defined by Zoetmulder as ‘... (Skr) esp. a stanza, two lines of 16 syllables each.’
    Moreover, they are inseparable from *smrti*,


    the sacred tradition (*dharma*) as remembered by human teaching (incontradiction
    to *sruti*), what is directly revealed and heard by risis.


    Lingat contends that testing Müller’s hypothesis with respect to the *Manava-dharma-sutra*
    it has been established in classic Hindu law how:


    there existed from a very ancient period a floating mass of adages or precepts
    in verse form from which [were] formulated a rule of law or a moral duty. These
    precepts, *dharma-slokas* analogous to the maxims (*brocards*) of Europe but in
    a popular and spontaneous style, are found in the *sutras.*¹⁵


    Legal texts are prose compositions mostly secular in nature. Partial exceptions
    are found in the younger versification of the *Surya Alam* by Yasadipura and parts
    of the Kartasura text. A clue as to when the term came to take on its characteristic
    meaning may be found in J. Gonda, *Sanskrit* in India.


    The *sloka stanza* has been preserved in Sundanese, where *siloka*, which is no
    doubt the identical word, denotes apophthem, metaphorical sayings, especially
    when dealing with esoteric or religious lore.


