    These were undoubtedly what Gobius in 1716 meant by his comment on jaksa ‘miscellany
    books’, a reference to the differing pepakem possessed by individual jaksa. From
    this important point emerges, namely that even pepakem bearing the same name could
    have varying contents. Most commonly they have taken the name of a notable particularly
    memorable in the field of justice as a patih (Jugul Muda, Dilah), a sovereign
    (Jaya Lengkara, Surya Alam), or a war leader (Senapati Jimbun). Some titles suggest
    their subject matter as the Luwangan Undhang-Undhang, Cacad, and Slokantara. Yet
    there was no one-to-one correspondence between title and contents or even complete
    congruity between titles bearing the same name.


    ⁵‘Memorie Hassela’, cited in Hoadley, Selective Judicial Competence, p. 139.'
