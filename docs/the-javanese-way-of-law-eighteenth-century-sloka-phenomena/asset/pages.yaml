  md: '# Table 6.2 Place within the textual tradition


    | Sloka | Aksara | Sinalalokan | Prakara |

    |---|---|---|---|n| Definition of sovereign duties and obligations opened by the
    contents of the Jugul Muda | 1. Sovereign prorogatives plus delegation to kerta
    and pangulu | Wisdom after the fact, i.e., used as proverbs or similes; part sloka
    part simple | 144 negative criteria, the presence of any one resulting in the
    case''s |

    | | 2. determination of civil cases: -positive = andih-andihan -negative = uger-uger
    aspects | | |


    Sloka in the legal tradition are concerned mostly with issues of sovereign authority.
    The earliest source by tradition, namely the Jugul Muda, shows them to have centred
    on sovereign rights and obligations to punish monarchs, with an additional proclaiming
    claiming virtues (Classic Sloka, no. 8, giri jaladri [...] tanu). In the Jaya
    Lengkara sloka are more closely connected to the practice of justice. This takes
    two forms. The first comprises the ten-to-twelve statements of sovereign authority
    concerning pradata affairs, with some delegation to court officials. The these
    are aksaraāji. The title also cites sloka emphasizing the importance of officials
    (jaksa, kerta) (Classic Sloka, no. 19), ending with the ideal qualities of kingship
    no. 22. As developed by subsequent titles, another level of authority set the
    criteria for determining the results of civil affairs in both positive and negative
    terms. The latter or uger-uger turn up frequently in the greatly expanded list
    of 144 phrases constituting the prakara guaranteeing defeat in a case. As such
    aksara represent a development from sloka proper with greater applicability as
    interpreted and applied by Patih Jugul Muda and his colleagues. This transitional
    character is further emphasized by the fact that the ‘aksara of the wrong’ (uger-uger)
    lead directly to the prakara, most of which are contained in § 11 of the Yogyakarta
    Surya Alam. Their part of the phenomena. They are both used as sloka proper, often
    with literal working or paraphrases thereof, and as ex post facto less common
    proverbial expressions. These leave the prakara as the least active of and most
    descriptive of the sloka phenomena. At the same time, they are the most numerous,
    being reduced to a core list of 144 by King Surya Alam. Prakara are also the ones
    most likely to continue into modern Javanese usage, albeit as simile-type shorthand
    reminders of the functional sloka.'
