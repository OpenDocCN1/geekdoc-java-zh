  md: '# Summary


    At a moderate level of generalisation, a correspondence between *sloka* phenomena
    and their sources of information become apparent. *Sloka* proper are formulated
    by the *Jugul Muda*, with a considerable dosage of *sinalokan* in the text''s
    second half. The most conscious exposition of the *aksara* is found in the *Jaya
    Lengkara*, many of which are sealed by *sloka* introduced in the *Jugul Muda*.
    Sinalokan are found in most of the minor texts and all the major texts except
    the *Berlin Surya Alam*. Yet, it is the *Undhang-Undhang Luwangan* that is dedicated
    entirely to their exposition. In more than fifty *sinalokan* are tersely explained
    in slightly more than one per paragraph. The ostensibly youngest of the *sloka*
    phenomena are the *prakara* found primarily in the *Yogyakarta Surya Alam*. As
    part of that tradition is the enunciation of the standard number of 144 *prakara*.
    Some cases seem to have derived from *sloka*; others incorporate terms from various
    *sloka* phenomena. As seen in Table 2.2, the dedicated and secondary titles mesh
    to make a textual matrix for the *sloka* phenomena.'
