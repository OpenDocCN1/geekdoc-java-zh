  md: '# Present work


    Focus of the present work can be summarised in four points. The first stems from
    the observation that the legal tradition of the Independent Kingdoms era is dominated
    by sloka phenomena contained in various pepakem and expressed in vignettes. As
    derivatives of or dependent upon sloka for their authority, aksara, sinalokan,
    and prakara are integral parts of that tradition. This is true if for no reason
    than their sheer numbers. Of the fifteen-hundred phrases presented and explained
    in Javaansche Grenzen, most of them are directly connected with legal affairs.
    A typical connection is expressed as ''this is a sloka [as contrasted to those
    of a paribasa, etc.] of having legal suit concerning [its subject]'' It reflects
    their dominance in the contents of titles identified as providing the main source
    of information for understanding Javanese law.


    The second point is that Javanese law is highly fragmented. ''Texts'' in the usual
    sense of the word implying equivalent contents as, for example, those of the Babad
    Tanah Jawi or equivalent literary works, are exceedingly rare. A title only to
    a limited degree shares its contents with titles of the same name, be they from
    manuscripts or the same one. Here titles and traditional denote the contents of
    relevant sources which are similar, but by no means congruent. The similar part
    comes from the fact that most commonly titles are built around a recognisable
    core to which variations on that theme are appended.


    The third point is that the sloka phenomena were functional as opposed to decorative.
    ''Classic sloka'' define sovereign rights, obligations, and attributes. They also
    pre-date the textual tradition in that they are quoted, not credited, by ministers,
    or in the case of the Surya Alam, the sovereign himself. Aksara provided legal
    categories of chastisement and instruments of resolving legal contests, sinalokan
    employed parts of sloka in order to authenticate cases, and prakara summarised
    them all. In these rare examples of case law preserved in the sources, sloka phenomena
    also define the nature of the affair as well as assess its seriousness.


    The fourth point is that the sloka phenomenon as defined here are antiquarian
    relics from a vaguely understood past or relevant concepts for the present. Anticipating
    the work’s conclusion, it can be noted that aksara and sloka, as the vignettes
    in which they are embedded, are alive and well living in the Republic of Indonesia
    today. Thanks to modern media they are discussed and interpreted as never before.
    This contrasts with the modern (European) legal transplants, comprising by far
    the largest part of the Republic’s laws. These seem to lack acceptance as measured
    by their'
