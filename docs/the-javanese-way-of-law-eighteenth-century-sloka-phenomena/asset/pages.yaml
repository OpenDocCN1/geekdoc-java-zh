    pp. 274-346.

    ² Sloka status has been erroneously assumed in ibid., to three paragraphs from
    the Bali Agama, namely Art.s 295, 297, and 345. Further research shows them to
    be general statements (ucapan) roughly equivalent to sinalokan, as Adagama, lOR
    3789, Sugiarto transcription lOR 10.441, p. 9, 10.'
