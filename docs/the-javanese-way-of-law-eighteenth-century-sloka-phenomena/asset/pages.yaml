    Skr. = Sanskrit


    +   - Adat Ar. Customs, customary law

    - Alun-alun Jav. Grassy square in front of Sultan''s palace

    - Angger-ang Jav. Rule, regulation

    - Catur mangala Jav. Four chief officials of the realm

    - Demang Jav. regional official

    - Dhalang Jav. Narrator and puppeteer of the wayang shadow-play

    - Dhendha Skr. Punishment, fine (Lit. = rod)

    - Den-tayojana Jav. the twenty letters of the ha-na-ca-ra-ka Javanese alphabet

    - Drigama Jav. Experience (''written adat''), tradition (alt danger, dangerous
    hindrance)

    - Jaksa Jav. Assessor-at-law

    - Jayapatta Skr. ''Certificate of victory'' (in the eighteenth century as surat
    kukudung)

    - Kali-yuga (alt Dopara/Dwapara Age) Skr. ''Age of deceit''

    - Kanduruhan Jav. Treasury official

    - Kitab Jav. Book, religious or legal text

    - Larangan Jav. Royal reserve, something forbidden

    - Mantri Jav. Javanese governmental official

    - Muarrar [Mouta] Ar. Islamic law book by Abu Kasim al-Rafei

    - Musawat-mupakat Jav. ''Mutual discussion-collective decision''

    - Pangadilan Jav. Law court (from adal = just)

    - Pangulu (alt pengengulu) Jav. Village official, religious function

    - Patih Jav. King''s chief councillor

    - Pégon Jav. Jeseese written in the Arabic script

    - Pepem Jav. A summary or concise version of a known story or narration

    - Prajanji Jav. Promise, treaty

    - Sidhem Pramanen Jav. ''The crime of silence''

    - Sengara (alt sangara or sangkara) Jav. curse, solemn oath (not to do s.t.)

    - Tata Tantrem Jav. Peace and order

    - Ubaya Jav. Agreement, summons to appear before a court'
