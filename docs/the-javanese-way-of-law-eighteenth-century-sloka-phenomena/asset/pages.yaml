  md: '# THE JAVANESE WAY OF LAW


    The Adigama (57:3, a romanised copy of LOr 3879 by Soegiarto). To the best of
    the author’s knowledge the single reference to panca-bhangga in Java is found
    in IOL Java 90 ($ 50). To the point, the first four of the five [sic] items of
    the (Java-Bali) panca-bhangga correspond to the ‘aksara of the wrong’ (aksara
    salah) or uger, the eight fatal flaws of litigation (Chapter 4). During the Independent
    Kingdom era they were undoubtedly part of the sloka phenomenon.


    Other apparent likenesses to traditional Javanese law are found in the analysis
    section following presentation of the relevant texts of Java and Bali. They comprise
    several dozen sloka-like phrases designated arane. A good example is anumpak ing
    pang akin (sitting on a dead branch), to one suing a dead person, the subject
    matter of the Agama Art. In a slightly different version of (s)lendhean kayu akin
    (riding a dead branch) or anggugat kayu akin (accusing a dead branch), the phrase
    constitutes a common Javanese prakara affair, as well as a modern Javanese proverb.Another
    example is provided by the Agama (Art. 66), the Balinese Agama ($ 280), and the
    Kutara Agama (162.4). This is the provision for a ‘bedewed corpse’ (arané) ketemu
    wangking kabul, meaning the discovery of the victim of murder by an unknown perpetrator.
    This entails collective responsibility for payment of the wergeld term for those
    living within a fixed radius of discovery. No specific Javanese term is known
    for the phenomenon because the references come from Dutch reports.⁸


    This discussion has aimed at establishing that most unique features of Javanese
    law do not necessarily stem from Old Java. They have only partially preserved
    in younger times. What remains to be done is to pin down of what these consisted.
    The characteristic features of the Independent Kingdoms can be discussed under
    the rubrics of goal, selectivity, and autonomous law.


