    # Bok Ening/Ni Indun


    A relatively uncommon theme within the sloka phenomena comes in the Bok Ening/Ni
    Indun vignette. It occurs in two versions of the Surya Alam, namely the Combi
    Yogyakarta version (§ 23) and the Raffles translation (XIV). They provide the
    bare outlines to illustrate the workings of taruka (suspicion). A third version
    by Yasadipura turns the dry exposition into true vignette by setting the narrative
    in the period of the prophetud (David) with his son Nabi Suleman as chief actor
    and originator of Solomon judgment.¹ A widow, Bok Ening (Ni Indun in the Yogyakarta
    version) was accused not only of illicit sex, but of fornication with a dog! The
    first is mentioned in the Raffles version. The accusers were four men as required
    by the shari''a. Bok Ening was brought before the tribunal, understandably in
    theirs. Very likely suspecting that all was not as it should, be Nabi Suleman
    was persuaded by his father to investigate the case. Apparently, a departure from
    the usual, it was decided to hear the accusers separately one by one. From this
    it appeared that for one dog in the question was black, white for another, spotted
    for a third, and so on.


    The incompatible differences in the accounts of the accusers, who were also the
    witnesses, fell under the panca bakah (Table 4.3, no. 5) of the aksara salah or
    uger-uger in the supporting evidence''. Although not stated in the titles, subsequent
    action by court officials shows that the accusations against Bok Ening were discredited,
    freeing her from the authority of the law. The four accusations were reversed;
    the accusers stood accused and convicted. The Raffles translation adds that:


    With regard to the Páncha báka, which is the case of a woman accused by four men
    of fornication; if on examination these four men do not agree in their testimony,
    they ought to be put to death, or else fined agreeably


