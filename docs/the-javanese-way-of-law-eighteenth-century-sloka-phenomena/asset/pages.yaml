    The above helps explain the generalist and non-specific nature of the titles.
    As denoted by the term *pepakem*, all Javanese legal titles are compilations,
    even compilations of compilations. Drawing upon various sources not cited in the
    paragraphs was the norm, not the exception. Rather than variations in evidence,
    guilt, etc., being provided by set texts, the tradition dealt with here provided
    multiple solutions for any situation. Obviously differing circumstances required
    different provisions, variations on a set piece of law. The choice was left to
    the sovereign''s tribunal. Thus, a more accurate evaluation of Crawford''s observation
    would be that his description it that it is misleading. Heterogeneity and inconsistency
    of legal titles'' contents were strengths rather than weaknesses. They gave Javanese
    law the flexibility necessary to deal with a whole spectrum of affairs within
    a corpus of law drawing upon tradition/experience, which was thereby sheltered
    from temporary alterations by passing rulers. Law was composed of short, mutually
    consistent collective paragraphs, often represented by the *sloka* phenomena,
    which reflected the collective experience of society rather than the will of a
    human agent or that of a supernatural force. The aim was a self-governing society
    regulating itself through custom born of experience (*drigama*) rather than one
    tailored by mortal sovereigns (law books, constitutions, undhang-undhang, etc.)
    or by a Supreme Being.'
