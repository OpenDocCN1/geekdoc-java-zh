  md: '# CHARACTER 173


    materially, socially, or physically. Ideally through the instrument of law the
    original controversy is settled. The challenge was to ensure that those naturally
    divisive circumstances were only temporary. Former contestants must be reconciled,
    to at least the extent of being able to interact normally within the demands set
    by custom. In societies characterized by a centralized governmental authority
    recognition or sponsorship of a given solution ensures complicity of winner and
    loser alike. A spin-off sponsorship tends to motivate state-provided means of
    decision through courts of law, rules and regulations, and even creation of a
    frame for arbitrated settlements.


    In this respect traditional Javanese law differs from expectations. Concern with
    preserving or restoring the *tata tantrem* was paired with decentralized political
    authority. Not surprisingly, the function of *sloka phenomena* was attuned to
    Java’s decentralized form of concentration of political power in the hands of
    a competent ruler. The accomplishments of a Raden Patah (aka Demak I, Senapati
    Jimbun), a Sultan Agung, or a Pangeran Mangkubungi was more offset by the numerous
    examples of over-extending and overestimating the power of kings, thereby bringing
    disaster to the ruler and ruled. This is exemplified by the rule of Mangkurat
    (r. 1646-1677) and most of his successors.This meant that centralized enforcement
    exercised by the state was not an option. It became only with the imposition of
    Dutch political hegemony in the region beginning in the eighteenth century. During
    the transitional phase considered here foreign power helped to prop up indigenous
    authority only in so far as it further Dutch East India ends.


    Under the traditional conditions prevailing during the Independent Kingdoms era,
    socially divisive threats inherent in legal contests had to be overcome without
    recourse. Action took many forms. One was to show that the outcome of legal dispute
    was not dependent on decisive power exercised by the (state) court but stemmed
    from customary rules. A second was to secure acceptance by loser and winner alike,
    which demanded selectivity within legal rules. A final instrument was self-regulation
    in the form of surrendering certain types of punishments to the wronged party
    itself.


    The clearest statement of the confluence of flaw leading to settlements and customary
    behaviour comes from the much-quoted § 50 of the Luangan. Litigants are not defeated
    by the judges, but by their own utterances. As


