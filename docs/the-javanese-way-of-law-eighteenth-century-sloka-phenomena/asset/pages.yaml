    Add 18398, f. 62r termed a sinalokan.

    sima bangga andkaraka amet mangsa, Suarno, Dictionary, no. 1460, 1461.

    sima bangga tanpa karana, Winter, Javaansche Zamenspraken, vol. II, ppt.

    nos. 318, 319.


    Commentary


    For unknown reasons a royal follow-up to the Dora-Sangkara is lacking

    in the three complementary sources of LOr 7410, RAS 6, and the published

    Ser angg: Jugul Muda. They are otherwise nearly identical to the LOr

    7440 version used as the primary source in this work. It were not for the

    alterative version in sinalokan form from the Luwangan § 18: padhu bangga

    rebut mangsa katiban ing taru, a disobedient suit (padhu) competing for

    prey [i., victory] is struck by a falling tree, one would be hard put to include

    it as a Classic Sloka. In any case, nominal variants have come down to

    t proverbial form.


