    west as Priangan Regencies, Jakarta/Batavia, and even the kingdom of Banten on
    the island''s western-most tip.²


    Even the incorporation of Islamic themes into legal texts of the period left the
    sloka phenomena unchanged. Prominent examples are seen in the names/titles of
    Islamic-Javanese texts. These include the Surya Alam, from a mythological ruler
    of the Muslim Middle East, the ''Jimbun texts'' as the Undang Senapati Jimbun
    and Jimbun Slokantara after Senapati Jimbun (akad Raden Patah) the semi-mythological
    vanquisher of the Hindu-Buddhist Rajput empire of East Java and founder of the
    region''s first Islamic kingdom of Demak in the late fifteenth century, as well
    as the Arya Dilah, after his trusted companion. Despite Islamic trappings, the
    texts rely upon the sloka phenomena as the primary vehicle of traditional Javanese
    law.³


    Pre-eminence of the sloka phenomena in early modern Javanese law also raises the
    issue of its relation to adat (custom). That would develop into the academic discipline
    of adatrecht (the study of adat law) grew out of rulings by the Dutch East Indies
    in the middle of the nineteenth century. By governmental decree, all previous
    laws were invalidated and adat recognized as the legal norm for the island''s
    inhabitants, that in so far had not voluntarily or otherwise already been placed
    under the colony''s European norms. Common sense argues that customary practices
    had the inception of legal process, yet it is first recorded for Java in the beginning
    of the twentieth century, mainly through the efforts of Cornelis van Vollenhoven
    and his disciples leading to the publication of De Ontdeking het Adrecht (The
    Discovery of the adat law) in 1928. Soft of sort of changing adat deforming historical
    developments, research into the past is limited to information contained in the
    extant legal titles. The fact that texts, as actual as didactic or normative legal
    cases were dominated by the sloka phenomena


