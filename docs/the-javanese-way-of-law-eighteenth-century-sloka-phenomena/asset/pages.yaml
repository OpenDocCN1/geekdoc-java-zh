  md: '74


    THE JAVANESE WAY OF LAW


    judicial authority. The wording of sloka is fixed. Only a limited amount of variation
    is allowed as shown by examples coming from titles of different origins within
    the Independent Kingdoms era. Because the intent of a sloka is predetermined,
    interpretation is crucial for understanding the manner of applying them. In turn
    knowledge of what constitutes sloka is dependent on the contents of the extant
    titles, including possibilities of scribal errors, earlier copies misidentified,
    and conscious fabrication. Hence the most pressing challenge is that of text,
    namely the reading of a given sloka. For present purposes the LOR 7440 version
    of the Jugul Muda has been chosen as providing the standard. Variations, as those
    found in the titles cited in Appendix II, are more of degree than kind.


    Once the individual sloka''s reading has been satisfactorily established remains
    the challenge of interpretation. What is the intention? Interpretation and translation
    go in hand. A good illustration of challenges met and overcome is that of deciphering
    arguably the best known sloka of the Jugul Muda cited by Tumenggung Raja Sasana.


    > Mustika brahmara corah titir penajaraken surak amp amp mati déning ngalen-alun.

    The presence of mice and bees is corah [discordant elements] trigger the alarm,
    [even with] supernatural powers; [miscreants] die due to their own actions (Classic
