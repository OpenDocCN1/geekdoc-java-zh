    and implicitly in the case of the sad-atatayi, represented the entire category.

    At an unspecified time after the Majapahit period the three categories were codified
    into a generally accepted list, as that given above.


    The contents of heinous crimes retained their validity into the eighteenth century.
    For example, the provisions of *sad-atatayi* and *astha corah* were utilized in
    1717 to condemn a Javanese Regent to exile for forfeiture of rank, property, and
    the freedom of wife and children.Two decades earlier the *raja wisuna* and *waja
    wangkara*, part of the *sad-atatayi* fell the *Shambandar* of Cirebon.


    In the Independent Kingdoms period their use was selective and even then, in modified
    form. The oft-cited *astha dustha* provides the point of departure which dominates
    the first half-dozen paragraphs of the law books of Java and Bali? The Eight Malfactors
    as they are translated – The Murderers or The Wicked Ones – to focus on actively
    carrying illegal acts. They include, for example, ‘to kill an innocent person’,
    to order the murder of an innocent person’, and ‘to wound an innocent person’,
    as well as various degrees of complexity. Despite their prominence in legal texts
    of ostensibly Old Javanese origin preserved on Bali, by the time of the titles
    considered here *astha dustha* were all but forgotten. The single reference comes
    directly from the *Jugu Muda’s* main vignette. It will be recalled that a Ki Dusta
    instigated a theft of King Mahapungung’s golden image, itself symbolic of the
    wicked of sins brought down upon the realm by the greed of Dora and Sangkara in
    the title’s opening vignette. It was noted that no ordinary theft (*corah or maling*)
    but act of defying royal order is signified by its being termed *dustha* (bad,
    wicked, evil, sinful, Prawiroatama, Bausaustra Jawa-Indonesia). Ki Dusta was accompanied
    by eight durmak (criminals), several of which bear the names of the *astha corah*
    (Eight Thieves), as (Sa)Pratig, Bojakah, Tatrah, and Codékah explained by § 1
    of the *Jimbun Slokara I*. After being apprehended on the complaint of Dusta’s
    wives, deliberation by *sloka* by the realm’s highest ministers counselling the
    sovereign on his rights and duties provides the core of the *Jugul Muda*. In all
    the durmak received the harvest of punishments, at least as far as could be met
    out by the king’s surrogate, the *patih*.


    While the concept of the *astha dustha* was to all intents and purposes neglected
    by the titles of the Independent Kingdoms period, the sad-atatayi


