    # Practice


    The preceding discussion of Javanese law as defined by the sloka phenomena are
    utilized as the standard for accessing the veracity, thus usefulness, of information
    recorded by intruding European officials. This approach reverses that of the author''s
    earlier work on the subject which of necessity was built information supplied
    by foreigners supplemented by choice bits of local lore, when available. More
    than an exercise in Asian-centric history by harmonizing the data contained in
    foreign and local sources, the approach leads to a more realistic depiction of
    Javanese legal practice. Four cases resolved by joint Javanese-Dutch courts during
    the first quarter of the eighteenth century are analysed with reference to the
    contribution of the sloka phenomena. Because the cases have been analysed within
    the context of Company Dutch v. Javanese legal system, their contents are summarised
    below.


    # Karta Nagar v. Karta Dinata et al. 1722


    As close as possible to an autonomous case record from the Independent Kingdoms
    period is the Karta Nagar theft of 1722. What prevents it from being an authentic
    Javanese judgment are two points. The first is its acknowledgment of submission
    to both the Dutch Resident of Cirebon, Willem Tersmitten (1720-1726) and Pangeran
    Aria Cirebon, the Company''s overseer of the Priangan region and co-reigning regent
    of Cirebon.


    The case agrees in the first instance with the wishes of the honourable Resident
    who governs over Cirebon and secondly with those of His Majesty Pangeran Aria
    Cirebon. The time of writing this certificate of victory is on Thursday in the
    month of Rabiulkar the 23rd of the year Jé.


