    # Titles of the Sloka phenomena


    The contents of the available titles would appear to constitute nearly insurmountable
    barriers to better understanding of traditional Javanese written law. Manuscripts
    contain a mixture of titles, single title manuscripts are a rarity, and titles
    with the same name usually differ in contents. Yet, a unique feature of the sloka
    sources also shows a way of meeting the challenge. Information with which to analyse
    individual sloka phenomenon – sloka, aksara, sinalokan, and prakara – tends to
