    Independent Kingdoms era supplemented by a modest number of cases contained in
    the Dutch East India Company records. Equally perplexing, the titles containing
    sinalokan provide no textual clarification of the type seen in instances of explanations
    for sloka or clarifying context for aksara. This is with the partial exception
    of those found in the Jaya Lengkara created by a process of kinawi, i.e., being
    formulated in literary Javanese considered below.


