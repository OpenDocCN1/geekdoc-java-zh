    with the astha dustha and as corah, had always been a monopoly of the sovereign.⁹
    Hence their transfer to a new instance in the form of a tribunal composed of Islamic
    functions must be a textual innovation of the pepakem. Motivation may come from
    either a concession to what the Dutch felt be a growing Islamic identity among
    the ''natives'' or an attempt to undermine potential Islamic, anti-Dutch sentiment
    by bringing pangulu into the Pepakem-dominated administrative system.¹⁰ A third
    possibility was that it was a ‘paper tiger’, only for show. Throughout the eighteenth
    century, East India Company officials kept the assignment of capital punishment
    finely in their own hands.


    A second example of innovations reported by the pepakem as though they were accepted
    practice concerns the water order (toyagama). It was added to the original *agama-drigama*
    (religion-custom) dichotomy. The innovation is found only in the printed Pepakem
    Tjerbon (p. 43) citing its as source *Jaya Lengkara*. It is well known to observe
    that the Pepakem’s attribution only matches the reality of its contents. *Drinama*
    (experience, custom, etc) lies at the heart of the entire *Jaya Lengkara* tradition.
