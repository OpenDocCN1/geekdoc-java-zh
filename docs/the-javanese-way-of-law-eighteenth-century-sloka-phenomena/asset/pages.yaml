    THE JAVANESE WAY OF LAW


    At this juncture one could expect the end of story. After all, traditional Javanese
    written law was formally replaced by a combination of statute originating from
    political authority, native and foreign, and adat coming from custom. The former
    was supplemented by laws, ordinances, and regulations promulgated by the Dutch
    and, within reason, the recognized rulers of the rump states containing ‘The Principalities’.
    Similarly, as the newly-recognized law for the natives, *adatrecht* tended to
    amass studies, capped by a growing number of *adat* law decisions by local courts
    vetted by Dutch colonial officials. These provided precedents for subsequent cases
    of a like nature. To all intents and purposes law as contained in the *sloka phenomena*
    was a shadow of the past, reinforced by lack of even academic interest.


    # ‘Rumors of my demise...’


    But traditional Javanese written law as dead as all that? Such rumours were exaggerated
    by occurrences in the century and a half following the New Legislation. For convenience’s
    sake they can be considered chronologically. The short run during the remainder
    of the nineteenth century, there was an active engagement on behalf of the supposedly
    abolished legal texts by the number of copies and new editions of these texts
    produced by court circles. In the medium-term interest in ‘implied law’⁴ (customary
    or written) previously known via the written word – is attested by the establishment
    and spread of *adat* law not only as an academic discipline but also as a living
    source of law. And finally, in the long range the untimely death of tradition
    is believed by the growing retero interest in the *sloka phenomena* as embodying
    a moral compass of exemplary behaviour seen as lacking in contemporaneous Indonesian
    society. Obviously, each of the topics could provide subject matter for a book
    or books. Until such is reached, we can orient ourselves with a succinct sketch
    of the major points by setting this study in a temporal and spatial context.


    A survey of manuscripts collections of Central Java shows that many of the titles
    of the Independent Kingdoms continued to be copied,


