    The Dora-Sloka is important for no other reason than utility. Entries in Javanese
    lexicons, as well as references in Javaansche Zampraken, are arranged alphabetically
    following the order of the aksara given above. Sloka must be learned by everyone
    studying Javanese letters, thereby repeating endlessly as a mantra.


    Realization that a sloka is more than a mnemonic device or curious bit of forgotten
    raises is synonymous with the Javanese law pioneered by Adi Saka''s kingdom of
    Medhang Kamulan, then why the intention of the original sloka would have happened
    had Dora or Sembada followed common sense instead of their master''s conflicting
    orders? They would have been guilty of durkha (rebellion, insubordination), which
    would be punishable by death at the will of the sovereign. The underlying intention
    of the sloka was coupled to the demands of Javanese authoritarianism, a monument
    to unswerving loyalty (setia) and avoidance of disloyalty/treachery (durhaka)
    tempered by mild concern for subordinates. As we shall see, the authoritarian
    character of sloka is recognized by contemporary Indonesians. One well-known figure
    figure has attempted to liberate it from the narrow warrior mentality (Chapter
    9. ''Context'').


    For present purposes a more important aspect of the first ever sloka lies in its
    illustration of the intimate contextual relationship between sloka and function.
    Unfortunately, in the relevant times the often cryptic sloka phrases are rarely
    accompanied by more detailed vignettes or supplementary textual explanations from
    which their meaning and purpose can be determined. Even when such complementary
    materials are provided, the explanations themselves are in need of clarification
    in order to arrive at the intended meaning of the phrase in question. Consequently,
    the following paragraphs will first consider the bare outlines of the sloka introduced
    by Muda before turning to an analysis of their context with a view of establishing
    the basic features of the genre. A more detailed analysis of some two-dozen classical
