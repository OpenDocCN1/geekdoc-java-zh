  md: '# Kandurahan Panembong v. Suba Mangala of 1714/15


    The sinalokan connected to the guilty verdict in the second case confirms of suggestive,
    but not necessarily binding, identification of punishable behaviour. Suba Mangala,
    son of the Regent of Parakanmuncang, had attempted to frame his kandurahan (treasury
    official) by accusing him of corruption. The accusation in the previous case was
    strengthened by the (false) testimony sworn by nine subordinates. How the scheme
    unglued is not revealed. The translated sularan states only that the nine subordinates
    were found guilty. Their conviction fell under the sinalokan:


    +   * supra amigena sobaga awagé [agawé] dustha bad than weruh in baya Pushing
    aside documents makes hindrances with the character of being an expert evildoer,
    ignoring the consequences.¹


    Aside from what must be one of the earliest references to the corruption so characteristic
    of present-day Indonesia, the sinalokan is more suggestive than demonstrative.
    This is indicated by the used of dustha in the sinalokan, a term clearly associated
    with proven criminal activities.


    # Puspa Nagara/Wisa Truna affair of 1717


    A third example is provided by the murder of a Company servant, Corporal Christian
    Kruger, while duty on the eastern Priangan. He was stabbed during an inspection
    tour of the pearl banks at Segara Anakan by Wisa Truna, who fled. The Company''s
    tentative hold on an outlying region with potentially valuable resources in concert
    with the potential danger posed to its officials who travelled unaccompanied in
    the region, the case was closely monitored. For present purposes two legal issues
    are crucial. The first is the extent to which the murder had been arranged with
    the conniv of the local Regent, Puspa Nagara. Because there was no evidence for
    this, Resident Gobius turned to the general principles of Javanese law. The Regent
    was accused of being een held van moordenearden (associate of murderers) amounting
    to the astha corah. The Javanese term is not given. It could have been any of
    the eight. ‘Befriending’ (isaka), ‘knowing the actions of’ (spratingkah), (tatah),
    or ‘sheltering’


