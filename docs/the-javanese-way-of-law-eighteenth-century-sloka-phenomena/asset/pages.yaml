    # Witnesses


    Judging from modern collections of pro and idiomatic expressions, two legal concepts
    particularly productive of *sloka* expressions were those concerning witnesses
    (*saksi*) and legal responsibility for witnessing, i.e., reporting, crimes (*sidhem
    praman*). Categories of acceptable and unacceptable witnesses are straightforward.
    This may be explained the fact that witnesses played a crucial role within these
    texts, and for that matter, in legal practice as well. According to the *andhih-andhihan*
    cited by virtually all the titles, witnesses'' relative weight before the law
    was higher than that of *tarka* (suspicion) and *patra* (documents), but below
    bukti (that coming from the defendant), *cina* (that coming from the plaintiff),
    as well as *satmata*, *nyama*, *ubaya*, and of, *parusa* (Table 4.4). Support
    for the observation come from the contents of the Pepaken Tjerbon, which sums
    up toward the end of the Independent Kingdoms period. Hierarchy in the weight
    of respective witnesses'' testimony attest the inequalities existing in Javanese
    society of the time based upon status, capacity, and gender.²³


    Amaha téja* (great area), village chiefs, as well as retired *mantri*, children
    and grandchildren of the same, *nabêhi*, etc., come from the Pepaken Tjerbon (p.
    42) citing the Raja Niscaya. Also cited as especially trustworthy riches are lebé
    *modin* (muezzin), ''priester'' [ulama], which with powerful persons, advisors
