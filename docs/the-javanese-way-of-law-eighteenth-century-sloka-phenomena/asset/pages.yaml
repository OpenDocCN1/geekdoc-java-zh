    of [Sri] Langka after the death of his brother, the evil Ravana, at Rama''s hands.
    Even a superficial review of the terms and attributes reveals a clear resemblance
    to the aksara of the Jaya Lengkara. For example, characteristics for an ideal
    leader in the broadest sense include the sun (srengengé), which shines on every
    person and thereby gives life to all. A secondary virtue connected with *srengengé*
    is the ability to differentiate between essentials and non-essentials. Additional
    exemplary features are conceptualized by parallels with the stars (*intang*),
    which stand out all others; wind (*angin*), which reaches even the most difficult
    places; water (banyu), which erodes and cleans everything; which is deviating
    without flickering; and the earth (*bumi*), which has a receiving nature able
    to accept all manner of human behaviour with sincerity.


    Under the circumstances it is not surprising that many of the aksara in the descriptive
    mode reflect both general ideals of leadership expressed by *Astha Brata* and
    specific legal virtues contained in ''*giri jaladri* [...] tanu*'' sloka in the
    *Fugul Muda* (Classical Sloka, no. 8). These include impartiality (banyu), ardour
    (gent = punishments, fire), outstanding excellence (intang), prestige (kilat)
