    ### Tatayi-dustha-corah

    As carry-overs from the preceding era, the concepts of *tatayi-dustha-corah* –
    comprising a set of particularly abhorrent transgressions – continued into the
    Independent Kingdoms era, albeit with modifications. That they were operational
    before the infusion of Indian concepts is suggested by the fact that one result
    of ‘Sanskritization’ was to formalize pre-existing concepts under rub. In this
    form they continued to play an active role in Javanese legal administration through
    the eighteenth century. The first listing of such transgressions comes from the
    Kaladi inscription of Bukit (r. 900-928). It enumerates undesirables who are forbidden
    to enter the freeholds established by the grant. The relevant part of the inscription
    reads:


    +   7b. The advantages and disadvantages were as follows: Sharing and dividing,
    all sorts of fines (*dhendha*), reviling, the corpse in dew (*wangkey kabunan*),
    blood flowing, sputtering of saliva

    8 1. *molha maine amuk, maayana lawang, mati amamumpang*, these were the ‘Eight
    Kind of Misconduct’, (my italics)¹


    Despite challenges of deciphering the contents, several of the transgressions
    are recognizable. Among them are *wangkey kabunan* (finding a bedewed corpse),
    *maling* (thief), *amok* (weaponed attack), and (a)*mumpang* (molest/abduct woman).
    As Javanese terms these are very likely pre-date the Hindu era. According to inscription
    known as the *astha corah* of ‘Eight Kind of Misconduct’. The Canggu inscription
    of 1358, better known as ‘the Ferry Charter’, also refers to these transgressions.
    In the good character of the ferry transgressions was established by their freedom
    from contamination of the type listed in Bukit’s Kaladi inscription. However,
    instead of listing individual ‘crimes’, the Canggu inscription mentions freedom
    from 1) ‘The Eight Larcen’, the Kaladi inscription’s Eight Kind of conduct, *astha
    corah*, 2) trisgangahana = mumpang (molester/abductor of women), and 3) tangapi
    (receiving stolen goods), which belongs to the category of (*astha*) dustha, i.e.,
    the ‘Eight Miscreants’.


    ¹ Barrett Jones


    ² Pigeaud, *Java in the 14th Century*, Vol. III, pp. 160, plate 9, verso, lines
    1-6.'
