  md: '# AKSARA


    can be profitably divided into themes or modes. The first focuses on the names
    and attributes of the ten-to-twelve aksara (Table 4.1). These are couched in terms
    of natural elements with their suggestive properties, for convenience termed a
    ''descriptive mode''. Drawing upon particularly the Cacad and Surya Alam, the
    second theme, the ''functional mode'' (''Table 4.2 and 4.3), analyzes the textual
    check of invalid suits and those deemed to fail as invalid before considering
    implications of a hierarchy of relative weight given pleas based on the type of
    evidence supporting them. They reveal how aksara are used in the legal tradition.
    The third theme considers the special, if limited, sovereign authority for punishing
    certain classes of cases without recourse to judicial process, a true ''science
    of kings'' (rajājti) mode.


    # Descriptive mode


    Study of the relevant texts provides a more or less inclusive list of aksara and
    their attributes.


    Table 4.1 Aksara

    | | |

    | badan (body) | action of the kerta |

    | angin (wind) | intention of the kerta |

    | banyu (water) | coolness/purity [impartiality] of the kerta |

    | geni (fire) | ardour/radiance (panuoring = streaming out as fire) of the kerta
    |

    | buni (earth) | place of the kerta |

    | lintang (star) | excellence of the kerta |

    | kilat (lightening) | know king''s wishes before they are uttered |

    | thathid (thunder) | king addressing his servants (bala) |

    | kukus (smoke/cloud) | ~ vision of the kerta |

    | srengeng (sun) | king warring loyal people/ministers [either destruction of
    the world or intentional lies] sangkara of the Jugul Muda''s first vignette |


    With most of the sloka phenomena, the terms are far from self-explanatory. The
    question of origins begins the logical point of departure.


    One explanation of the origin of the aksara is that they come from the same cultural
    environment as the ''Astha Brata''. These are the eight lessons of leadership
    found in the Old Javanese Ramayana. They were taught by Rama either to Bhatara,
    who was to substitute for him as king of Ayodhya in his absence, or to Wasibana,
    who was to be crowned king'
