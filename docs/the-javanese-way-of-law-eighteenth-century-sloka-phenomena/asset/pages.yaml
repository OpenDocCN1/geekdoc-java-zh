    The work''s organisation roughly follows the demarcation between vehicles of traditional
    law and its contents. Section *I*. ‘Law, *Sloka*, and Sources*’ opens the work.
    Tradition and its expression are found in Chapter 1. ‘Traditional Law. *Sloka
