    # Conclusion


    One of the most notable features of the Independent Kingdom''s sloka is that they
    existed in their final forms prior to their use in a legal setting. This was true
    even in the semi-mythical kingdom of Medhang Kamulan. Patih Jugul Muda and his
    colleagues provided counsel on how the sovereign should deal with legal-political
    affairs. embraced both the issue of royal priority in claims to discovered treasures,
    especially gold, and its subsequent theft by nine mercenaries bearing the names
    of the astha corah.43 Characteristically, the ministers do not offer advice based
    upon law books or their opinions. They quote sloka. The latter epitomised rules
    of accepted/required behaviour based upon custom, in law its broadest meaning.
    Because they were quoted, often followed by a textual explanation, the ''text''
    or wording, is reasonably consistent. However, for those unaccompanied references
    to the original text, the authenticity of transmission can be problematic. The
    nature of the extant sources means the challenge is only partially resolvable.
    Yet, judging from the longevity and consistency of the sloka deals with, reconstructions
    are merely lively.


    Another feature of the sloka flows out of ''text'' but goes far beyond it. Obviously,
    the wording of sloka transmitted through various chains of preservation and communication
    greatly influences interpretation of what is meant or intended. Deciphering what
    the sloka say is possible; less so their functional intention. This is of minor
    importance in those sloka describing the authority of an ideal king, as in Classic
    Sloka no. 8 or 10. Yet when cited as the basis for a legal action, i.e., punishment,
    capital or monetary, it becomes a challenge. This is no so within the nuances
    of intention. Tumenggung Raja Sasasana citation of the much-quoted mustika


