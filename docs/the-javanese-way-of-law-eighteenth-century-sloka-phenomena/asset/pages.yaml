    The reverse side of the coin, i.e., what is important for traditional Java, may
    grate on European sensibilities. ''Traditional Javanese law is proverbial? You
    must be joking!'' Yet such is literally the case. Many pre-or early-colonial Javanese
    texts deal with length with what is termed here the *sloka* phenomena consisting
    of *sloka proper (roughly = proverbs), aksara (legal precepts), sinalokan (that
    made of sloka), prakara (cases, instances), set in vignettes.* As these have a
    special character within Javanese society, the challenge for scholarship is to
    discover the nature of that character and communicate it to a wider public, in
    a nutshell the purpose of this book.'
