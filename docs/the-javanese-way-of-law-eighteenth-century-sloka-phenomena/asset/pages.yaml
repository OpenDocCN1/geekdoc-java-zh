    # Aksara


    As the second layer of the phenomena, ''aksara'' is used by the texts under scrutiny
    in a manner at variance with accepted wisdom. Standard reference to aksara indicates
    the twenty letters of the Javanese script, dubbed ha-na-ca-ra-ka after the first
    five letters, ultimately deriving from India''s Devanagari alphabet. More accurately,
    the unadorned twenty characters of the Javanese alphabet, the actual letter plus
    ''a'', are termed den-tayojana.² These are subsequently ''clothed'' (pasangan)
    with diacritical marks to indicate the remainder of the vowels – i, i, o, u –
    the ''r'', and the punctuation marks employed. In the texts of the Independent
    Kingdoms aksara are normally the name for a set of legal precepts associated with
    sovereign rights and duties, as well as for setting of proof in settling legal
    conflicts.


    The dedicated text for aksara is the Jaya Lengkara. In contrast to the modest
    number of Jugul Muda and Kartasura Surya Alam examples there are numerous examples
    of the Jaya Lengkara. Moreover, their contents are relatively consistent, being
    built around a standard frame story with near identical beginnings in all versions
    and endings. For present purposes the most accessible version of the Jaya Lengkara
    is that of Add 12 303 from the Crowford collection. Jaya Lengkara texts are also
    found in RAS 38, as well as those of theoften Leiden manuscripts LoR 7440 and
    7410. Notwithstanding the standard contents of manuscripts from both West and
    Central Java, a significant variant is found in LoR 7440''s middle section. As
    an addition to the standard frame story, it consists of paragraphs nearly identical
    to §§ 1–14 of the Jimbon Slakarta I discussed earlier. Another variant is found
    in LoR 2125. It follows the standard introduction of the aksara and digrama, but
    then turns to legal paragraphs following the ''utterances'' or tatrapan (sic trap-trapan
