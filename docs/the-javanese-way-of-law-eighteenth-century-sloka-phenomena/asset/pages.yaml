  md: '# Substance of a sloka


    It will be recalled that the initial vignette of the *fugul Muda* revolved about
    a dispute between Dora and Sangkara over a windfall found on leased land. More
    specifically, it centred about whether the owner or renter profits from a treasure
    dug after agreeing upon a common *tebasan* (sale with payment in advance) leasing
    arrangement. The cache was jinxed by the presence of stolen goods, especially
    because they were of gold. Dora and Sangkara contesting ownership rights of tainted
    goods revealed deep moral failings. According to the *Jugul Muda*, these led to
    the onslaught of the sorrowful era of deceit, Dora/Dapwara Age. In the more detailed
    version of LOr 7440 the respect reported the incident to the king for which they
    were rewarded, thus breaking the bounds of loyalty between husband and wife. King
    Mahapunggung appealed to his *patih* Jugul Muda for advice, who responded by quoting
    a *sloka*.


    +   *Sima bangga rebut mangsa katiban taru**nA deviant tiger seizing prey dies,
    struck by a falling tree [alt. a falling star].*²


    Dora and Sangkara are the tigers who have deviated from the well-known principle
    that stolen booty is forfeited to death. Blinded by greed, they chose to ignore
    it and met with unexpected death. The gold taken by the king was made into a golden
    image (*anak-anak kencana*), which caused the controversies revealed in the second
    vignette of the story. This first vignette concludes by re-emphasising the incident
    revealed moral backsliding thereby calling the calamity of *dopra* on the people
    of Purwa Carita. In broader terms the vignette''s lesson is that an era of lies
    and deceit necessitates laws and law courts in order to counteract human greed.
    This provides the leitmotiv for the rest of *Jugul Muda*, whose contents as expressed
    either in *sloka* or, in the last section, *sinaloka* deal with various criminal
    acts to be particularly aberrant in the Javanese legal tradition.


    Taken out of their vignette context *sloka* are to a high degree cryptic. Without
    further explanation, which is seldom available, they are nearly incomprehensible.
    In some cases, clarification or partial clarification comes from collections of
    such phrases. With reference to the sloka considered here, the second volume of
    *Javaansche Zamenspraken* offers a couple of parallels


