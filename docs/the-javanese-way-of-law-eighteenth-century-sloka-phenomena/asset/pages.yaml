  md: '# Traditional Law. Sloka in Pepakem


    If a single entity could contain the contents of traditional law, it would be
    paragraph four of a text called the Wadangun Wangkara.¹ The article opens by citing
    the Hindu concept of *yuga* (epochs) in the world''s cosmic decline. In it the
    original Sanskrit *yuga* are rephrased in form of five Javanese terms representing
    stages of decreasing validity in legal claims. Highest on the scale is Krta/Satya
    Yuga, which becomes Javanese Tirta assuring victory; however, the Kali Yuga becoming
    Sengara, dooms a case to defeat. More important, explanation of the term marking
    the final epoch describes the king''s efforts to counter the Kali era of darkness
    and deceit by creating rules communicated through the *sloka* phenomena. The extraordinary
    step of introducing innovations into the body of law customarily regulated by
    experience (*drigma*) was necessitated by ministerial evasion of their moral and
    professional duty in the case of the unexpected death of a high official''s son.
    Unacceptability of ''passing the buck'' through each minister deferring to the
    opinion of the others parallel *patih* (prime minister, king''s chief counselor),²
    Gajah Mada Amongjunggung, to reveal a *sloka* (proverb, maxim containing a simile,
    metaphor [esp. as a legal term]) constructed from the names of the five irresponsible
    mantri the description of their actions as ''clearly smelling of evil'' (*danding
    nyata*), constituting profound negligence based on the ''crime of silence'' (*sidhem
    praeman*). Pronouncement of the legal *sloka* was accompanied by the imposition
    of large fines levied from the eminent. In this turn established a *sinoka* (a
    phrase of *sloka* elements), which became the custom of the realm. Not to be outdone,
    His Majesty Wijayang Sastra (adegi) a reform in the form of two affairs (prakaw/paravais).
    These were askara (legal precepts), which constitute


