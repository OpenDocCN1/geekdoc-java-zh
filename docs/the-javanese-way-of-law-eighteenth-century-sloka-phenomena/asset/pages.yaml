    ting under the specified circumstances. The passive, or self-fulfilling and

    self-encoring, character of Javanese law is underscored by the text itself.


    This is the measure of the jaksa in handling of padu and pradata affairs:

    it is not the jaksa who cause persons with such suits to be defeated; defeat

    comes from the utterances of their suing (§ 50).'
