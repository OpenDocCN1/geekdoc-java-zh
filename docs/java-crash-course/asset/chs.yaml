  ## 使用流和 lambda 编写功能程序\n\n在最后一个项目中，我们将构建一个城市人口探索器（CPE）应用程序。它是一个功能性 Java 程序，用于读取世界城市数据集。它还允许用户使用流\
  \ 和 lambda 执行查询。数据集包括每个城市的名称、州、国家、人口和面积（平方英里）。用户可以通过过滤城市、计算人口密度以及识别密度最高和最低的城市来探索数据。\n\
