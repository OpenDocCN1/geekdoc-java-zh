  \n### 记录多个错误\n- **目标**：实现多个 `catch` 块以在单个工作流中处理不同类型的异常。\n- **活动**：完成以下操作：\n    -\
  \ 编写一个执行以下操作的 Java 程序：\n        - 从用户处读取一个整数。\n        - 用固定值（例如 `319`）除以该整数。\n\
  \        - 使用该整数作为索引访问大小为 `5` 的数组。\n    - 使用多个 `catch` 块处理：\n        - 针对除零错误的 `ArithmeticException`。\n\
  \        - 针对无效数组索引的 `ArrayIndexOutOfBoundsException`。\n        - 使用通用异常块处理任何其他未预见的异常。\n\
