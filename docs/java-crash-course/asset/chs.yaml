  \ Bougie Books 的背景下，你将如何设计一个查询来检索客户订单以及书籍标题和数量？为什么理解 JOIN 对于复杂数据检索至关重要？\n\n6. 索引是提高查询性能的关键优化技术。在决定对哪些列建立索引时应该考虑哪些因素？过度索引会对数据库性能产生负影响影响？\n\
