  \ Streams 的知识进行评估：\n\n1. Streams API 的中间操作和终端操作有什么区别？\n2. `Optional` 类如何帮助处理空值值？\n\
  3. `map()` 和 `flatMap()` 之间的区别是什么？\n4. 不可变性在处理流时为什么重要？它对原始数据有何影响？\n5. 想象你正在对交易进行过滤，你会如何使用流来：\n\
  \    1. 过滤已完成的交易。\n    2. 计算总金额。\n    3. 生成唯一的客户 ID。\n\n### 答案\n\n1. 中间操作将流转换为另一种流，它们是惰性的，意味着在调用终端操作之前不会执行。包括\
  \ `filter()`、`map()` 和 `sorted()`。终端操作消耗流并产生结果。包括 `collect()`、`forEach()` 和 `count()`。\n\
  2. `Optional` 类提供了一种表示值是否存在的方式。方法包括：\n    - `orElse()` 如果存在则返回值；否则返回默认值。\n    -\
  \ `orElseGet()` 在不存在时计算值。\n    - `orElseThrow()` 如果值不存在则抛出异常。\n    - `ifPresent()`\
  \ 在值存在时执行操作。\n    典型的用例是安全地获取用户信息：\n```java\nOptional<User> user = findUserById(\"\
  319\");\nuser.ifPresent(u -> System.out.println(\"User: \" + u.getName()));\n```\n\
  3. `map()` 将流中的每个元素转换为另一种形式。`flatMap()` 将流展平为单个流，通常在处理嵌套结构时使用。\n4. 不可变性确保流操作不会修改原始数据源，防止产生副作用。流在数据的副本上操作，保持了原始集合的完整。\n\
  5. 为了过滤、计算并生成所需数据，我们将结合过滤、映射和聚合来得到所需的结果。\n\n\n\n\n在本章结束时，你应该能够解释 I/O 操作在 Java 应用中的作用。此外，你将能够实现\
  \ `Scanner` 类来处理用户输入，使用 Java 的 `nio` 包读取和读写文件，并实现字符流和字节流。你还应该能够使用缓冲流（buffered streams）和数据流（data\
  \ streams）来优化 Java 应用中 I/O 组件的性能。通过引导示例，你应该能够通过序列化和反序列化实现对象持久化。最后，在本章结束时，你应该能够在\
  \ Java 应用中应用安全且高效的文件处理最佳实践。\n\n## Java I/O 简介\n\n现代 Java 应用通常需要处理来自和多个源的数据，包括用户输入、各种文件格式和数据库。这是一项核心功能，因此学习如何高效处理\
  \ I/O 操作至关重要，这样我们才能确保应用程序具有响应性和扩展性。幸运的是，Java 为我们提供了一套强大的应用程序编程接口（API）来管理 I/O。\n\n\
  本节介绍了 Java 的 I/O 能力，从 I/O 流的概述开始，I/O 流是 Java I/O 机制的基础。\n\n| 注意：为了阐明本章中的概念，我们将使用\
  \ Digitale，这是一家虚拟的数字媒体公司，提供音乐和视频流媒体服务。Digitale 的后端需要高效的文件管理来存储媒体文件的元数据、记录用户活动并处理客户偏好。\
  \ |\n\n通过应用 Java 的 I/O 特性，我们将开发处理用户输入、读写媒体元数据以及高效管理应用程序日志的组件。\n\n### I/O 流概述\n\n\
  流是 Java I/O 系统的核心。它们提供了处理 I/O 的灵活方法。Java 的 I/O 框架抽象了 I/O 操作，使我们能够轻松地处理文件、数据结构、网络连接和内存数据结构。\n\
  \n| 注意：流是从源流向目的地（从输入到输出）的数据序列。 |\n\nJava 的 I/O 系统构建在流的概念之上，流提供了一种处理 I/O 数据的灵活方式。流是从源（输入）流向目的地（输出）的数据序列。流分为分为大类：\n\
  \n- 字符流（Character stream）：用于处理文本数据。\n- 字节流（Byte stream）：用于处理二进制数据（即图像、音频、视频等）。\n\
  \n让我们检查每种流类别并演示其在代码中的用法。\n\n### 字符流简介\n\n字符流在处理文本数据方面非常高效。它帮助我们确保字符经过正确的编码和解码。数据流的常见用途包括处理日志文件、配置文件和其他文本文件。\n\
  \n以下是一个示例，使用了我们的 Digitale 示例，从文本文件中读取媒体描述：\n\n```java\nimport java.io.FileReader;\n\
  import java.io.IOException;\n\npublic class MediaDescriptionReader {\n    public\
  \ static void main(String[] args) {\n        try (FileReader fr = new FileReader(\"\
  descriptions.txt\")) {\n            int character;\n            while ((character\
  \ = fr.read()) != -1) {\n                System.out.print((char) character);\n \
  \           }\n        } catch (IOException e) {\n            System.err.println(\"\
  Error reading description file: \" + e.getMessage());\n        }\n    }\n}\n```\n\
  \n在上述示例中，我们使用 `FileReader` 将 `descriptions.txt` 文件作为字符流进行处理。我们的示例示例还提供了关于如何处理文件访问问题的早期预览。我们将在本章稍后的部分详细讨论。\n\
  \n### 字节流简介\n\n当我们拥有音频、视频和图像等文件时，我们需要使用字节流来处理它们的二进制数据。这种流在处理加密数据时也很有用。\n\n以下是一个\
  \ Digitale 示例，从二进制文件中读取元数据：\n\n```java\nimport java.io.FileInputStream;\nimport\
  \ java.io.IOException;\n\npublic class MetadataReader {\n    public static void\
  \ main(String[] args) {\n        try (FileInputStream fis = new FileInputStream(\"\
  metadata.dat\")) {\n            int data;\n            while ((data = fis.read())\
  \ != -1) {\n                System.out.print((char) data);\n            }\n    \
  \    } catch (IOException e) {\n            System.err.println(\"Error reading metadata\
  \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上述示例中，我们使用 `FileInputStream`\
  \ 读取 `metadata.dat` 二进制文件，它每次处理一个字节的文件内容。\n\n### I/O 在编程中的重要性\n\n想想你任何喜欢的应用程序，无论是桌面应用、移动应用、运行在平板电脑上的程序，还是运行在智能电视上的媒体流媒体应用，想想正在处理的\
  \ I/O 混合操作。如果你是学生或教职员工，考虑你的学习管理系统（LMS）以及其中涉及多少 I/O 操作。几乎所有现代应用程序都包含 I/O 操作。这些操作的关键在于效率。\n\
  \n以我们的 Digitale 数字媒体公司为例，I/O 操作对于管理用户交互、存储媒体元数据、处理日志和高效流传输至关重要。无论是从文本文件中读取媒体描述、记录播放历史，还是将用户生成的播放列表写入外部文件，我们都必须实现适当的\
  \ I/O 管理，以确保应用程序运行流畅可靠。\n\n让我们来看展示 I/O 在 Java 开发中重要性的五个示例。\n\n### 处理用户输入\n\n大多数应用程序都需要用户输入，无论是来自键盘、触摸屏还是网络请求。Java\
  \ 的 `Scanner` 类简化了从控制台读取输入，这使得它对交互式应用程序特别有用。\n\n使用我们的 Digitale 示例，我们可以为用户创建通过控制台输入他们喜爱的歌曲的功能，我们的应用程序将使用\
  \ `scanner` 处理这些歌曲：\n\n`Scanner` 类将在本章稍后的“使用 Scanner 类进行输入”部分中详细介绍。\n\n### 管理文件存储\n\
  \n文件存储是管理持久化数据的主要方法之一，数据在应用程序终止后仍然存在。我们使用持久化数据来保存系统配置、用户数据、日志等。在 Java 中，我们可以使用 `java.nio.file`\
  \ 包来实现高效的文件操作，包括读取、写入和更改数据。\n\n以 Digitale 为例，将使用文件存储来存储最近播放的歌曲。这可以记录在文本文件中，允许用户暂停和恢复他们的会话。\n\
  \n`java.nio.file` 包将在本章稍后的“使用 java.nio 处理文件”部分中详细介绍。\n\n### 缓冲流\n\n持久化数据存储的效率问题之一是物理磁盘访问的迭代次数。大文件如果不以高效的方式处理可能会可能会降低应用程序的响应和用户体验。为了解决这个问题，我们可以使用\
  \ Java 的缓冲流来提高性能。这是通过减少物理磁盘访问次数来实现的。\n\n在 Digitale 示例的背景下，想象当用户播放歌曲时，我们的应用程序将播放数据追加到日志文件中。这将通过缓冲写入来实现。\n\
  \n缓冲流将在本章稍后的“缓冲流和数据流”部分进行深入探讨。\n\n### 对象持久化\n\n在 Java 应用中，我们的数据结构是复杂的，我们更倾向于将其存储为对象而不是文本或原始数据。Java\
  \ 赋予我们通过序列化来实现对象持久化的能力。\n\n例如，Digitale 可能希望将带有偏好和播放列表的用户配置文件保存为序列化对象。\n\n对象持久化将在本章稍后的“使用序列化和反序列化”部分中介绍。\n\
  \n### 网络通信\n\n\n\n\n\nI/O 操作还允许我们通过互联网和其他网络进行通信。考虑 Digitale 的后端，它可能需要从远程服务器获取媒体元数据，或向用户流传输音频。Java\
  \ 的套接字编程和 HTTP API 实现了这些交互。\n\n我们将在第 10 章 数据库连接”中探索基于网络的 I/O。\n\n## 使用 `Scanner`\
  \ 类进行输入\n\n本章已经确认为，大多数应用程序在某种程度上依赖用户输入。这可能是为了实现交互和个性化体验、捕捉登录凭据、处理文本文件等。由于对这些功能有此类需求，高效地读取这些输入至关重要。Java\
  \ 的 `Scanner` 类为我们完成了大部分工作工作，使我们能够轻松地从各种源读取数据。\n\n继续我们的 Digitale 示例，用户输入对于搜索歌曲、将媒体添加到播放列表以及自定义用户偏好等功能至关重要。本节将探索如何利用\
  \ `Scanner` 类来高效地读取输入。\n\n### `Scanner` 类概述\n\n`Scanner` 类是 `java.util` 包的一部分，它为我们提供了一种从不同源解析用户输入的高效方法。它可以读取原始类型（整数、双精度浮等）和字符串，使其成为我们应用程序功能非常强大的工具。除了从多个源读取输入外，`Scanner`\
  \ 类支持不同的数据类型，将输入拆分为标记（tokens），并处理输入验证。\n\n要使用 `Scanner` 类，我们首先导入它，然后创建一个实例。以下是代码示例：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class ScannerExample {\n    public\
  \ static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter your favorite song: \");\n        String song\
  \ = scanner.nextLine();\n        System.out.println(\"You entered: \" + song);\n\
  \        scanner.close();\n    }\n}\n```\n\n在这个示例中，我们使用了 `new Scanner(System.in)`\
  \ 语句来初始化一个读取控制台的扫描器。`nextLine()` 方法捕捉整行文本，允许用户输入带空格的歌曲名称。我们的示例以 `scanner.close()`结束，在读取输入后释放系统资源。\n\
  \n以下是一个示例，我们在不需要手动转换的情况下读取了多种数据类型：\n\n```java\nimport java.util.Scanner;\n\npublic\
  \ class UserPreferences {\n    public static void main(String[] args) {\n      \
  \  Scanner scanner = new Scanner(System.in);\n        System.out.print(\"Enter your\
  \ preferred music genre: \");\n        String genre = scanner.nextLine();\n    \
  \    System.out.print(\"How many songs do you listen to daily? \");\n        int\
  \ dailySongs = scanner.nextInt();\n        System.out.print(\"Do you prefer high-quality\
  \ streaming? (true/false) \");\n        boolean highQuality = scanner.nextBoolean();\n\
  \        System.out.println(\"\\nUser Preferences:\");\n        System.out.println(\"\
  Genre: \" + genre);\n        System.out.println(\"Daily Songs: \" + dailySongs);\n\
  \        System.out.println(\"High-Quality Streaming: \" + highQuality);\n     \
  \   scanner.close();\n    }\n}\n```\n\n在这个示例中，我们使用 `nextInt()` 读取整数输入，使用 `nextBoolean()`\
  \ 读取布尔值。在将 `nextLine()`与其他方法混合使用时我们需要小心，以避免输入跳过（我们将在本章的“从文件中读取和解析数据”部分之后讨论这一点）。\n\
  \n`Scanner` 类的另一个常见用法是与文件一起使用。这使我们能够加载媒体描述、用户偏好或日志。以下是在 Digitale 中读取播放列表文件的示例：\n\
  \n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\n\
  \npublic class PlaylistReader {\n    public static void main(String[] args) {\n\
  \        try {\n            File file = new File(\"playlist.txt\");\n          \
  \  Scanner scanner = new Scanner(file);\n            while (scanner.hasNextLine())\
  \ {\n                String song = scanner.nextLine();\n                System.out.println(\"\
  Now playing: \" + song);\n            }\n            scanner.close();\n        }\
  \ catch (FileNotFoundException e) {\n            System.err.println(\"Playlist file\
  \ not found.\");\n        }\n    }\n}\n```\n\n以下是我们的 `PlaylistReader` 的示例输出：\n\n\
  ```\nNow playing: Whispering Pines - The Howling Wolves\nNow playing: Ocean Breeze\
  \ - The Soaring Eagles\nNow playing: Golden Meadow - The Grazing Deer\nNow playing:\
  \ Thunder Over the Valley - The Roaring Lions\nNow playing: River's Serenade - The\
  \ Swimming Otters\nNow playing: Dancing Leaves - The Playful Squirrels\nNow playing:\
  \ Moonlit Forest - The Silent Owls\nNow playing: Snowfall Symphony - The Arctic\
  \ Foxes\nNow playing: Mountain Echo - The Wandering Bears\nNow playing: Sands of\
  \ Time - The Desert Tortoises\n```\n\n如我们在上述示例所示，我们使用 `Scanner scanner = new Scanner(file)`\
  \ 从文件中读取数据。我们使用 `hasNextLine()` 来确保读取所有行，直到结束。我们还使用 `try-catch` 块进行错误处理，防止在文件缺失时崩溃。\n\
  \n### 从控制台读取输入\n\nJava 的 `Scanner` 类为我们提供了一种从控制台读取数据的简单方法。这对于捕捉用户偏好、搜索查询和其他交互元素非常有用。对于\
  \ Digitale 而言，用户输入对于歌曲搜索、播放列表创建和内容过滤至关重要。\n\n让我们演示如何高效地从控制台捕捉用户输入。我们将使用 `Scanner`\
  \ 类从 `System.in` 读取输入，正如我们之前做的那样。下面的示例展示了如何通过控制台输入进一步实现 Digitale 的功能：\n\n```java\n\
  import java.util.Scanner;\n\npublic class SongSearch {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print(\"\
  Enter a song title to search: \");\n        String songTitle = scanner.nextLine();\n\
  \        System.out.println(\"Searching for: \" + songTitle);\n        scanner.close();\n\
  \    }\n}\n```\n\n在示例中，`new Scanner(System.in)` 用于初始化读取输入的扫描器。`nextLine()` 方法捕捉整行，允许用户输入带空格的内容。最后，`scanner.close()`\
  \ 在处理后释放资源。\n\n让我们看看另一个从控制台获取输入的示例。在这个示例中，我们展示了 `Scanner` 类如何读取数字和布尔值，以便 Digitale\
  \ 获取歌曲的用户评分：\n\n```java\nimport java.util.Scanner;\n\npublic class SongRating {\n\
  \    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter your rating (1-5) for the song: \");\n       \
  \ int rating = scanner.nextInt();\n        System.out.println(\"You rated this song:\
  \ \" + rating + \" stars.\");\n        scanner.close();\n    }\n}\n```\n\n在上述示例中，我们使用了\
  \ `nextInt()` 读取整数输入；这对于评分功能非常理想。以下是我们程序的输出：\n\n```\nEnter your rating (1-5) for\
  \ the song: 3\nYou rated this song: 3 stars.\n```\n\n### 从文件中读取和解析数据\n\n应用程序通常使用存储在文件中的数据并将数据写入文件。Java\
  \ 的 `Scanner` 类使我们能够轻松地从文件中读取和解析文本数据。通过这种，我们可以在应用程序中集成加载设置、处理日志和检索存储的用户偏好的功能。对于\
  \ Digitale 而言，从文件中读取媒体数据允许用户访问保存的播放列表、播放历史和歌曲元数据。我们在本章之前的部分通过 `PlaylistReader` 演示了这一点。\n\
  \n让我们看看如何处理具有结构数据的文件。我们将使用 `Scanner` 类的标记功能来解析 `playlist.txt` 文件中的歌曲数据。在这个示例中，我们假设每首歌的标题和艺术家之间用连字符隔开。以下是代码：\n\
  \n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\n\
  \npublic class PlaylistParser {\n    public static void main(String[] args) {\n\
  \        try {\n            File file = new File(\"playlist.txt\");\n```\n\n\n\n\
  \n\n```java\nScanner scanner = new Scanner(file);\n\nwhile (scanner.hasNextLine())\
  \ {\n    String line = scanner.nextLine();\n    String[] parts = line.split(\" -\
  \ \"); // 分割标题和艺术家\n    if (parts.length == 2) {\n        System.out.println(\"\
  Song: \" + parts[0] + \" | Artist: \" + parts[1]);\n    }\n}\nscanner.close();\n\
  } catch (FileNotFoundException e) {\n    System.err.println(\"Playlist file not\
  \ found.\");\n}\n}\n}\n\n\n我们上面的示例通过拆分数据来提取有效信息。我们使用了 `split()` 方法根据连字符分隔符来分离歌曲标题和艺术家。我们通过检查行内容是否包含两个元素来确保解析的有效性。以下是我们程序的输出：\n\
  \nSong: Whispering Pines | Artist: The Howling Wolves\nSong: Ocean Breeze | Artist:\
  \ The Soaring Eagles\nSong: Golden Meadow | Artist: The Grazing Deer\nSong: Thunder\
  \ Over the Valley | Artist: The Roaring Lions\nSong: River's Serenade | Artist:\
  \ The Swimming Otters\nSong: Dancing Leaves | Artist: The Playful Squirrels\nSong:\
  \ Moonlit Forest | Artist: The Silent Owls\nSong: Snowfall Symphony | Artist: The\
  \ Arctic Foxes\nSong: Mountain Echo | Artist: The Wandering Bears\nSong: Sands of\
  \ Time | Artist: The Desert Tortoises\n\n### 常见陷阱与最佳实践\n\n正如我们看到的，`Scanner` 类简化了从控制台和文件读取输入。如果我们不恰当使用该类，可能会遇到意外行为、性能问题甚至数据丢失。让我们来看看四个最常见的陷阱（混合输入方法、未关闭扫描器、无效输入、低效）以及使用\
  \ `Scanner` 类进行输入的四种最佳实践。\n\n以下是常见陷阱：\n\n- **混合输入方法**：第一个常见陷阱是将 `nextLine()` 方法与其他输入方法混合，例如将\
  \ `nextLine()` 与 `nextInt()` 结合。这种混合的问题在于 `nextInt()` 等其他基本类型输入方法不会消耗换行符（`\\n`），而是将其留在缓冲区中。这会导致\
  \ `nextLine()` 跳过输入。\n\n在接下来的示例中，我们尝试使用 `nextInt()` 获取用户的年龄，然后尝试使用 `nextLine()`\
  \ 获取歌曲名。以下是代码：\n\n```java\nimport java.util.Scanner;\n\npublic class MixingInputMethodsPitfall\
  \ {\n    public static void main(String[] args) {\n        Scanner scanner = new\
  \ Scanner(System.in);\n        System.out.print(\"Enter your age: \");\n       \
  \ int age = scanner.nextInt(); // 读取了数字但在缓冲区中留下了 \\n\n        System.out.print(\"\
  Enter your favorite song: \");\n        String song = scanner.nextLine(); // 跳过了输入！\n\
  \        System.out.println(\"Age: \" + age + \", Favorite Song: \" + song);\n \
  \       scanner.close();\n    }\n}\n```\n\n正如下面输出所示，用户从未被询问过最喜欢的歌曲是什么：\nEnter your\
  \ age: 24\nEnter your favorite song: Age: 24, Favorite Song:\n\n这个逻辑错误是因为 `nextLine()`\
  \ 方法立即返回了一个空字符串，因为它读取了 `nextInt()` 留下的残留换行符（`\\n`）。解决此陷阱的方案是在数值输入后使用 `nextLine()`\
  \ 之前始终消耗掉额外的换行符。以下是修复了逻辑错误的代码：\n\n```java\nimport java.util.Scanner;\n\npublic class\
  \ MixingInputMethodsFixed {\n    public static void main(String[] args) {\n    \
  \    Scanner scanner = new Scanner(System.in);\n        System.out.print(\"Enter\
  \ your age: \");\n        int age = scanner.nextInt();\n        scanner.nextLine();\
  \ // Fix：消耗残留的换行符\n        System.out.print(\"Enter your favorite song: \");\n \
  \       String song = scanner.nextLine();\n        System.out.println(\"Age: \"\
  \ + age + \", Favorite Song: \" + song);\n        scanner.close();\n    }\n}\n```\n\
  \n当我们运行更新后的代码时，我们可以从用户那里获取年龄和歌曲标题。输出如下：\nEnter your age: 24\nEnter your favorite\
  \ song: When Doves Cry\nAge: 24, Favorite Song: When Doves Cry\n\n- **未关闭扫描器**：我们所有使用\
  \ `Scanner` 类的代码示例都包含了 `scanner.close()` 方法，以便在读取输入后释放系统资源。常见的陷阱是忘记关闭扫描器。这可能导致资源泄漏并需要避免。解决方案是简单地将其成为编码习惯；始终关闭你的扫描器。最理想的方法是在处理文件时使用\
  \ `try-with-resources` 块来实现。以下是实现方法：\n\n```java\ntry (Scanner scanner = new Scanner(new\
  \ File(\"playlist.txt\"))) {\n    while (scanner.hasNextLine()) {\n        System.out.println(scanner.nextLine());\n\
  \    }\n} catch (FileNotFoundException e) {\n    System.err.println(\"File not found.\"\
  );\n}\n```\n\n- **无效输入**：与 `Scanner` 类相关的第三个陷阱是未能检查用户输入的有效性。无效的用户输入（无论是否是有意的）对我们的系统构成了重大威胁。我们应该始终验证用户输入。例如，如果我们询问年龄，我们只期望输入一个整数。此外，它还能为用户提供适当的反馈。下面的代码段演示了这种实现：\n\
  \n```java\nScanner scanner = new Scanner(System.in);\nSystem.out.print(\"Enter your\
  \ rating (1-5): \");\nif (scanner.hasNextInt()) {\n    int rating = scanner.nextInt();\n\
  \    System.out.println(\"Your rating: \" + rating);\n} else {\n    System.out.println(\"\
  Invalid input! Please enter a number.\");\n}\n```\nscanner.close();\n\n- **低效**：第四个陷阱是在处理大文件时使用\
  \ `Scanner` 类效率低下。请记住，`Scanner` 逐行读取，这对于小文件没有问题。当我们处理大文件时，我们需要不同的方法。在这种情况下，应该使用\
  \ `BufferedReader` 来提高效率。实现方法如下：\n\n```java\nimport java.io.BufferedReader;\nimport\
  \ java.io.FileReader;\nimport java.io.IOException;\n\npublic class BufferedReaderExample\
  \ {\n    public static void main(String[] args) {\n        try (BufferedReader br\
  \ = new BufferedReader(new FileReader(\"large_playlist.txt\"))) {\n            String\
  \ line;\n            while ((line = br.readLine()) != null) {\n                System.out.println(line);\n\
  \            }\n        } catch (IOException e) {\n            System.err.println(\"\
  Error reading file.\");\n        }\n    }\n}\n```\n\n#### 最佳实践\n\n这里介绍的最佳实践与上述陷阱的解决方案相同。它们如下：\n\
  \n- 在混合输入类型时消耗换行符。\n- 始终关闭扫描器，或使用 `try-with-resources` 进行资源管理。\n- 始终验证用户输入。\n- 对于大文件使用\
  \ `BufferedReader`。\n\n## 使用 java.nio 进行文件处理\n\n上一节引入了读取文件的方法，虽然 `java.io` 的方法对于小文件是足够的，但在涉及大文件时会导致效率低下。我们的目标是以高效的方式处理文件\
  \ I/O。为了实现这一点，我们将使用 Java `java.nio.file` 包提供的功能。\n\n对于 Digitale（我们的数字媒体公司示例），高效管理文件对于存储用户生成的列表、处理媒体元数据和处理应用程序日志至关重要。本节将介绍\
  \ `java.nio.file` 包的功能，重点关注以结构化且高效的方式处理文件。\n\n### Java 文件操作基础\n\n`java.nio.file`\
  \ 包包含了用于高效处理文件操作的类和方法，特别是与 `java.io` 相比时。该包的核心是 `Path` 类，它用于创建表示文件或目录位置的对象。`java.nio.file`\
  \ 的另一个核心是 `Files` 类，它包含了用于读取、写入、复制和删除文件的实用方法。\n\n在执行任何文件操作之前，始终检查文件是否存在是一个良好的习惯，可以防止错误。让我们来看一个如何检查文件存在的示例：\n\
  \n```java\nimport java.nio.file.*;\n\npublic class FileCheckExampmle {\n```\n\n\n\
  \n\n\n```java\npublic static void main(String[] args) {\n    Path path = Paths.get(\"\
  playlist.txt\");\n    if (Files.exists(path)) {\n        System.out.println(\"File\
  \ exists: \" + path.toAbsolutePath());\n    } else {\n        System.out.println(\"\
  File not found.\");\n    }\n}\n```\n\n在上述的示例中，我们使用 `Paths.get(\"filename\")` 为文件创建了一个\
  \ `Path` 对象。然后，我们使用 `Files.exists(path)` 来检查文件是否存在。与 `java.io.File` 不同，`java.nio.file`\
  \ 提供了一套更简单、更强大的文件操作方法。\n\n## 使用 java.nio 读写文本文件\n\n我们可以使用 Java 的 `Files` 类来读写文件，这比使用\
  \ `Scanner` 方法更加高效。在本节中，我们将演示如何使用 `java.nio` 同时读取和写入文件。\n\n让我们从一个如何读取 Digitale 播放列表文件的示例开始。以下是代码：\n\
  \n```java\nimport java.nio.file.*;\nimport java.io.IOException;\nimport java.util.List;\n\
  \npublic class ReadPlaylist {\n    public static void main(String[] args) {\n  \
  \      Path filePath = Paths.get(\"playlist.txt\");\n        try {\n           \
  \ List<String> lines = Files.readAllLines(filePath);\n            for (String line\
  \ : lines) {\n                System.out.println(\"Now playing: \" + line);\n  \
  \          }\n        } catch (IOException e) {\n            System.err.println(\"\
  Error reading the file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上述的\
  \ `ReadPlaylist.java` 示例中，我们使用 `Files.readAllLines(filePath)` 将文件的所有行读取到 `List<String>`\
  \ 中。这使得我们能够轻松处理。这种方法比使用 `Scanner` 更加简洁且具有可读性。我们还实现了异常处理，以防止在文件缺失时系统崩溃。\n\n接下来，让我们来看一个将用户的播放列表保存到输出文件的示例。以下是代码：\n\
  \n```java\nimport java.nio.file.*;\nimport java.io.IOException;\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class WritePlaylist {\n    public static void main(String[]\
  \ args) {\n        List<String> playlist = Arrays.asList(\n            \"Whispering\
  \ Pines - The Howling Wolves\",\n            \"Ocean Breeze - The Soaring Eagles\"\
  ,\n            \"Golden Meadow - The Grazing Deer\"\n        );\n        Path filePath\
  \ = Paths.get(\"newPlaylist.txt\");\n        try {\n            Files.write(filePath,\
  \ playlist);\n            System.out.println(\"Nw playlist saved successfully.\"\
  );\n        } catch (IOException e) {\n            System.err.println(\"Error writing\
  \ to file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上述示例中，我们直接将一个字符串列表写入文件（`newPlaylist.txt`）。这种方法会覆盖文件中文件中已有的任何内容。在我们的示例中，由于文件并不存在，因此创建了一个新文件。让我们来看一个示例，该示例向用户显示当前播放列表，请求新的歌曲名和作者，将其追加到列表中，然后显示更新后的列表。以下是代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.nio.file.*;\nimport java.util.List;\n\
  import java.util.Scanner;\nimport java.util.Arrays;\nimport java.nio.charset.StandardCharsets;\n\
  import java.nio.file.StandardOpenOption;\n\npublic class AppendPlaylist {\n    public\
  \ static void main(String[] args) {\n        Path filePath = Paths.get(\"myPlaylist.txt\"\
  );\n        // 显示当前播放列表\n        System.out.println(\"Current Playlist:\");\n  \
  \      displayPlaylist(filePath);\n        // 获取用户输入\n        Scanner scanner =\
  \ new Scanner(System.in);\n        System.out.print(\"\\nEnter the song title: \"\
  );\n        String songTitle = scanner.nextLine();\n        System.out.print(\"\
  Enter the artist name: \");\n        String artist = scanner.nextLine();\n     \
  \   scanner.close();\n        // 将新歌曲追加到文件\n        String newEntry = songTitle\
  \ + \" - \" + artist;\n        appendToPlaylist(filePath, newEntry);\n        //\
  \ 显示更新后的播放列表\n        System.out.println(\"\\nUpdated Playlist:\");\n        displayPlaylist(filePath);\n\
  \    }\n\n    /**\n     * 读取并显示播放列表文件的内容。\n     */\n    private static void displayPlaylist(Path\
  \ filePath) {\n        try {\n            if (Files.exists(filePath)) {\n      \
  \          List<String> lines = Files.readAllLines(filePath, StandardCharsets.UTF_8);\n\
  \                if (lines.isEmpty()) {\n                    System.out.println(\"\
  Playlist is empty.\");\n                } else {\n                    lines.forEach(System.out::println);\n\
  \                }\n            } else {\n                System.out.println(\"\
  Playlist file not found. Creating a new one...\");\n                Files.createFile(filePath);\n\
  \            }\n        } catch (IOException e) {\n            System.err.println(\"\
  Error reading the playlist: \" + e.getMessage());\n        }\n    }\n\n    /**\n\
  \     * 将新的歌曲目追加到播放列表文件。\n     */\n    private static void appendToPlaylist(Path\
  \ filePath, String newEntry) {\n        try {\n            Files.write(filePath,\
  \ Arrays.asList(newEntry), StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n\
  \            System.out.println(\"Song added successfully.\");\n        } catch\
  \ (IOException e) {\n            System.err.println(\"Error updating the playlist:\
  \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n以下是上述代码的输出：\n```text\nCurrent\
  \ Playlist:\nWhispering Pines - The Howling Wolves\nOcean Breeze - The Soaring Eagles\n\
  Golden Meadow - The Grazing Deer\n\nEnter the song title: \nImagine Dreams\nEnter\
  \ the artist name: \nJohn Lennon\nSong added successfully.\n\nUpdated Playlist:\n\
  Whispering Pines - The Howling Wolves\nOcean Breeze - The Soaring Eagles\nGolden\
  \ Meadow - The Grazing Deer\nImagine Dreams - John Lennon\n```\n\n\n\n\n\n```java\n\
  return \"Title: \" + title + \"\\nArtist: \" + artist + \"\\nGenre: \" + genre +\
  \ \"\\nDuration: \" + duration + \" mins\\n\";\n\n}\n\n}\n```在上述示例中，我们实现了 `Serializable`\
  \ 接口，允许类实例被写入文件并从文件中读取。我们使用了 `serialVersionUID` 来确保类不同版本之间的兼容性。最后，我们使用 `toString()`\
  \ 方法在反序列化后显示对象详情。\n\n为了将多个歌曲元数据条目保存到文件中，我们使用 `ObjectOutputStream`。以下是将媒体元数据写入文件的示例：\n\
  \n```java\nimport java.io.*;\n\nimport java.util.ArrayList;\n\nimport java.util.List;\n\
  \npublic class MetadataWriter {\n\n    public static void main(String[] args) {\n\
  \        List<MediaMetadata> mediaList = new ArrayList<>();\n        mediaList.add(new\
  \ MediaMetadata(\"Whispering Pines\", \"The Howling Wolves\", \"Folk\", 4.35));\n\
  \        mediaList.add(new MediaMetadata(\"Ocean Breeze\", \"The Soaring Eagles\"\
  , \"Instrumental\", 5.12));\n        mediaList.add(new MediaMetadata(\"Golden Meadow\"\
  , \"The Grazing Deer\", \"Acoustic\", 3.48));\n        try (FileOutputStream fos\
  \ = new FileOutputStream(\"metadata.dat\");\n             ObjectOutputStream oos\
  \ = new ObjectOutputStream(fos)) {\n            oos.writeObject(mediaList);\n  \
  \          System.out.println(\"Media metadata saved successfully.\");\n       \
  \ } catch (IOException e) {\n            System.err.println(\"Error saving metadata:\
  \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n我们的上述示例创建了一个 `MediaMetadata`\
  \ 对象的列表，然后使用 `ObjectOutputStream` 将对象列表写入 `metadata.dat`。我们使用了 `try-with-resources`\
  \ 块来确保资源的安全管理。\n\n> 注意：虽然 Java 中的大多数对象都可以使用上述方法进行序列化，但 Java 还为我们提供了 `Externalizable`\
  \ 接口，以便对序列化过程进行更强大的控制。\n\n## 反序列化\n\n接下来，让我们看看如何从文件中检索对象。这需要我们对对象进行反序列化。我们的后续示例从\
  \ `metadata.dat` 中读取媒体元数据。以下是代码：\n\n```java\nimport java.io.*;\n\nimport java.util.List;\n\
  \npublic class DeserializationExample {\n\n    public static void main(String[]\
  \ args) {\n        try (FileInputStream fis = new FileInputStream(\"metadata.dat\"\
  );\n             ObjectInputStream ois = new ObjectInputStream(fis)) {\n       \
  \     List<MediaMetadata> mediaList = (List<MediaMetadata>) ois.readObject();\n\
  \            System.out.println(\"Retrieved Media Metadata:\");\n            for\
  \ (MediaMetadata media : mediaList) {\n                System.out.println(media);\n\
  \            }\n        } catch (IOException | ClassNotFoundException e) {\n   \
  \         System.err.println(\"Error reading metadata: \" + e.getMessage());\n \
  \       }\n    }\n}\n```\n\n如上所示，我们的示例使用 `ObjectInputStream` 从 `metadata.dat` 中读取对象。我们将反序列化的数据转换回\
  \ `List<MediaMetadata>`。我们的示例还正确处理了异常，防止在文件丢失或损坏时程序崩溃。\n\n## 序列化与反序列化示例\n\n现在我们已经涵盖了存储和检索对象的基础知识，可以探索序列化可以增强文件管理的其他真实场景。序列化对于数字应用尤为有用，因为存储用户播放列表、播放历史和媒体元数据等结构化数据有助于无缝的数据持久化。本节提供了序列化和反序列化的实用示例，涵盖了追加序列化数据、处理版本变化以及通过缓冲流提高性能等内容。\n\
  \n### 在不覆盖的情况下追加序列化数据\n\n默认情况下，`ObjectOutputStream` 在每次对象被序列化时都会覆盖文件。这可能是我们预期的行为，也可能产生问题。如果我们想保留当前信息，则需要在不擦除之前的条目的情况下追加对象。为了实现这一点，我们必须使用自定义流以避免在追加时写入新的头文件。这将确保之前写入的对象仍然可以被访问。\n\
  \n以下是一个在 `playback.dat` 文件中存储用户播放历史的示例：\n\n```java\nimport java.io.*;\n\nimport\
  \ java.util.List;\n\nimport java.util.ArrayList;\n\nclass PlaybackHistory implements\
  \ Serializable {\n\n    private static final long serialVersionUID = 1L;\n\n   \
  \ private String songTitle;\n    private String timestamp;\n\n    public PlaybackHistory(String\
  \ songTitle, String timestamp) {\n        this.songTitle = songTitle;\n        this.timestamp\
  \ = timestamp;\n    }\n\n    @Override\n    public String toString() {\n       \
  \ return \"Song: \" + songTitle + \" | Played at: \" + timestamp;\n    }\n}\n\n\
  public class PlaybackLogger {\n\n    private static final String FILE_NAME = \"\
  playback.dat\";\n\n    public static void main(String[] args) {\n        PlaybackHistory\
  \ newPlayback = new PlaybackHistory(\"Whispering Pines\", \"2025-01-30 14:45\");\n\
  \        List<PlaybackHistory> playbackList = readPlaybackHistory(); // 加载之前的记录\n\
  \        playbackList.add(newPlayback); // 追加新记录\n        writePlaybackHistory(playbackList);\n\
  \        System.out.println(\"Updated Playback History:\");\n        playbackList.forEach(System.out::println);\n\
  \    }\n\n    /**\n     * 从文件中读取之前的播放历史。\n     */\n    private static List<PlaybackHistory>\
  \ readPlaybackHistory() {\n        try (FileInputStream fis = new FileInputStream(FILE_NAME);\n\
  \             ObjectInputStream ois = new ObjectInputStream(fis)) {\n          \
  \  return (List<PlaybackHistory>) ois.readObject();\n        } catch (IOException\
  \ | ClassNotFoundException e) {\n            return new ArrayList<>(); // 如果文件未找到，返回空列表\n\
  \        }\n    }\n\n    /**\n     * 将更新的播放历史写入文件。\n     */\n    private static\
  \ void writePlaybackHistory(List<PlaybackHistory> history) {\n        try (FileOutputStream\
  \ fos = new FileOutputStream(FILE_NAME);\n             ObjectOutputStream oos =\
  \ new ObjectOutputStream(fos)) {\n            oos.writeObject(history);\n      \
  \      System.out.println(\"Playback history updated.\");\n        } catch (IOException\
  \ e) {\n            System.err.println(\"Error writing playback history: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n我们的示例首先读取现有记录，防止数据丢失。然后将整个列表写回 `metadata.dat`，确保所有条目持久化。如果文件不存在，它将重新开始。\n\
  \n示例的输出如下：\n\nPlayback history updated.\nUpdated History:\nSong: Whispering Pines\
  \ | Played at: 2025-01-30 14:45\n\n### 处理类版本变化\n\n当类结构发生变化时，会给我们的序列化实现带来问题。例如当我们向对象中添加新字段时。旧的序列化对象可能会变得不兼容，导致\
  \ `InvalidClassException` 错误。解决这一挑战的方法是使用 `serialVersionUID` 和 `transient` 字段。让我们来看修改\
  \ `PlaybackHistory` 以包含新字段（设备信息）的示例。以下是代码：\n\n```java\nimport java.io.Serializable;\n\
  \nclass PlaybackHistory implements Serializable {\n\n    private static final long\
  \ serialVersionUID = 2L; // 更新的版本\n\n    private String songTitle;\n    private\
  \ String timestamp;\n    private transient String deviceUsed; // 新字段（不序列化）\n\n \
  \   public PlaybackHistory(String songTitle, String timestamp, String deviceUsed)\
  \ {\n        this.songTitle = songTitle;\n        this.timestamp = timestamp;\n\
  \        this.deviceUsed = deviceUsed;\n    }\n\n    @Override\n    public String\
  \ toString() {\n        return \"Song: \" + songTitle + \" | Played at: \" + timestamp\
  \ + \" | Device: \" + (deviceUsed != null ? deviceUsed : \"Unknown\");\n    }\n\
  }\n```\n\n在上述示例中，我们使用 `serialVersionUID` 来防止兼容性问题。如果类被修改，旧版本仍然可以读取。`transient` 字段不会被序列化，这防止了以后添加新字段时出现错误。\n\
  \n### 使用缓冲流提高性能\n\n序列化的另一个挑战是，如果不实现缓冲，写入大对象时速度可能会很慢。`BufferedOutputStream` 允许我们减少磁盘写入操作，从而提高性能。以下是一个高效存储大型播放数据的示例：\n\
  \n```java\nimport java.io.*;\n\nimport java.util.ArrayList;\n\nimport java.util.List;\n\
  \nclass PlaylistEntry implements Serializable {\n\n    private static final long\
  \ serialVersionUID = 1L;\n```\n\n\n\n\n\n```java\npublic class PlaylistEntry {\n\
  \    private String title;\n    private String artist;\n\n    public PlaylistEntry(String\
  \ title, String artist) {\n        this.title = title;\n        this.artist = artist;\n\
  \    }\n\n    @Override\n    public String toString() {\n        return \"Song:\
  \ \" + title + \" | Artist: \" + artist;\n    }\n}\n\npublic class PlaylistSerializer\
  \ {\n    private static final String FILE_NAME = \"playlist.dat\";\n\n    public\
  \ static void main(String[] args) {\n        List<PlaylistEntry> playlist = new\
  \ ArrayList<>();\n        playlist.add(new PlaylistEntry(\"Golden Meadow\", \"The\
  \ Grazing Deer\"));\n        playlist.add(new PlaylistEntry(\"Ocean Breeze\", \"\
  The Soaring Eagles\"));\n        writePlaylist(playlist);\n        System.out.println(\"\
  Playlist saved successfully.\");\n        List<PlaylistEntry> loadedPlaylist = readPlaylist();\n\
  \        System.out.println(\"\\nLoaded Playlist:\");\n        loadedPlaylist.forEach(System.out::println);\n\
  \    }\n\n    /**\n     * 使用缓冲将播放列表写入到文件。\n     */\n    private static void writePlaylist(List<PlaylistEntry>\
  \ playlist) {\n        try (FileOutputStream fos = new FileOutputStream(FILE_NAME);\n\
  \             BufferedOutputStream bos = new BufferedOutputStream(fos);\n      \
  \       ObjectOutputStream oos = new ObjectOutputStream(bos)) {\n            oos.writeObject(playlist);\n\
  \        } catch (IOException e) {\n            System.err.println(\"Error writing\
  \ playlist: \" + e.getMessage());\n        }\n    }\n\n    /**\n     * 从文件读取播放列表。\n\
  \     */\n    private static List<PlaylistEntry> readPlaylist() {\n        try (FileInputStream\
  \ fis = new FileInputStream(FILE_NAME);\n             BufferedInputStream bis =\
  \ new BufferedInputStream(fis);\n             ObjectInputStream ois = new ObjectInputStream(bis))\
  \ {\n            return (List<PlaylistEntry>) ois.readObject();\n        } catch\
  \ (IOException | ClassNotFoundException e) {\n            return new ArrayList<>();\
  \ // 如果文件不存在则返回空列表\n        }\n    }\n}\n```\n\n正如我们在示例中所示的，我们使用了 `BufferedOutputStream`\
  \ 通过减少 I/O 操作来加速写入过程。与直接写入对象相比，这减少了内存开销。此外，我们还使用了 `BufferedInputStream` 来优化读取。\n\
  \n## 缓冲流与数据流\n\n我们已经确定了高效文件处理对整个应用程序性能重要性，特别是在处理大文件或频繁的读写操作时。在 Java 中，我们可以实现缓冲流，通过减少直接磁盘访问来提高效率。数据流也是如此，它允许我们以紧凑的二进制格式读取和写入原始数据类型。\n\
  \n我们应该考虑在以下用例中使用运行缓冲流：\n\n*   针对大文件\n*   针对频繁的 I/O 操作\n*   当性能是首要考虑因素时\n\n对于我们正在\
  \ Digitale 示例，这些技术对于优化媒体元数据存储、日志管理和播放历史跟踪至关重要。本节将探索缓冲流如何增强 I/O 性能，以及数据流如何促进结构化二进制数据处理。\n\
  \n### 使用缓冲流来提高效率\n\n我们之前涵盖了 Java 的 `FileInputStream` 和 `FileOutputStream`，它们都执行逐字节的操作。这对于大文件来说可能是极度低效的。缓冲流通过在将数据写入磁盘或从磁盘读取之前将其存储在内存中来提高性能。这显著减少了\
  \ I/O 操作的次数。\n\n缓冲流使用内部缓冲区来读取/写入数据块，而不是一次一个字节地读写。这显著加快了文件操作。让我们来看 Digitale 示例，我们希望在不产生过多磁盘写入操作的情况下高效地记录歌曲播放历史。我们使用\
  \ `BufferedOutputStream` 实现了这一点。以下是代码：\n\n```java\nimport java.io.BufferedOutputStream;\n\
  import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\n\
  \npublic class LargePlaybackLogger {\n    public static void main(String[] args)\
  \ {\n        String logEntry = \"User played: Symphony of the Stars - Aurora Sounds\\\
  n\";\n        String fileName = \"playback_log.txt\";\n        try (FileOutputStream\
  \ fos = new FileOutputStream(fileName, true);\n             BufferedOutputStream\
  \ bos = new BufferedOutputStream(fos)) {\n            bos.write(logEntry.getBytes(StandardCharsets.UTF_8));\n\
  \            bos.flush(); // 确保数据立即写入\n            System.out.println(\"Playback\
  \ log updated.\");\n        } catch (IOException e) {\n            System.err.println(\"\
  Error writing log: \" + e.getMessage());\n        }\n    }\n}\n```\n\n如前所述，我们的示例使用\
  \ `BufferedOutputStream` 来减少对文件的直接写入次数，这将提高我们应用程序的性能。`flush()` 方法确保所有缓冲数据都被写入，防止了在意外关闭时发生数据丢失。最后，我们使用\
  \ `FileOutputStream(filename, true)` 来追加文件，确保添加新的日志条目而不会覆盖现有条目。\n\n让我们来看第二个示例，它使用\
  \ `BufferedInputStream` 读取大日志文件。以下是代码：\n\n```java\nimport java.io.BufferedInputStream;\n\
  import java.io.FileInputStream;\nimport java.io.IOException;\n\npublic class LargePlaybackReader\
  \ {\n    public static void main(String[] args) {\n        String fileName = \"\
  playback_log.txt\";\n        try (FileInputStream fis = new FileInputStream(fileName);\n\
  \             BufferedInputStream bis = new BufferedInputStream(fis)) {\n      \
  \      int data;\n            while ((data = bis.read()) != -1) {\n            \
  \    System.out.print((char) data);\n            }\n        } catch (IOException\
  \ e) {\n            System.err.println(\"Error reading log: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n如前所述，我们的示例使用 `BufferedOutputStream` 来减少对文件的直接写入次数，这将提高我们应用程序的性能。`flush()`\
  \ 方法确保所有缓冲数据都被写入，防止了在意外关闭时发生数据丢失。最后，我们使用 `FileOutputStream(filename, true)` 来追加文件，确保添加新的日志条目而不会覆盖现有条目。\n\
