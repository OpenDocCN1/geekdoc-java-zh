  \ 中错误（Errors）和异常（exceptions）之间的主要区别是什么？\n\n    1. 错误是应用程序控制范围之外的严重问题，而异常是可恢复的。\n\
  \    2. 错误是可恢复的，而异常不可恢复的。\n    3. 错误只在编译期间发生，而异常只在运行时发生。\n    4. 错误和异常使用不同的编程语言处理。\n\
  \n2. 下列哪一个是受检异常（checked exception）的示例？\n\n    1. `NullPointerException`\n    2.\
  \ `IOException`\n    3. `ArrayIndexOutOfBoundsException`\n    4. `ArithmeticException`\n\
  \n3. Java `try-catch-finally` 结构中 `finally` 块的目的是？\n\n    1. 捕获 `catch` 块未处理的异常。\n\
  \    2. 定义无论是否发生异常都会运行的清理代码。\n    3. 指定特定方法可以抛出的异常。\n    4. 将异常传播给调用方法。\n\n4. 关于\
  \ Java 的 `throws` 关键字，哪种说法是正确的？\n\n    1. 它用于在方法内部捕获异常。\n    2. 它仅用于运行时异常（runtime\
  \ exceptions）。\n    3. 它自动处理方法抛出的异常。\n    4. 它声明了方法可以传播给调用者的异常。\n\n5. 在 Java 中，何时创建自定义异常是合适的？\n\
  \n    1. 当异常需要额外的属性时。\n    2. 当标准异常提供了关于错误的足够信息时。\n    3. 当异常需要在编译时被捕获时。\n    4.\
  \ 当你想避免使用未检异常（unchecked exceptions）。\n\n### 答案\n\n| 1. | a. |\n| 2. | b. |\n| 3.\
  \ | b. |\n| 4. | d. |\n| 5. | a. |\n\n## 问答\n\n1. Java 异常层次结构（`Throwable`, `Error`,\
