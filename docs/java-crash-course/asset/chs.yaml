  \n```java\npublic class MultipleRelationals {\n    public static void main(String[]\
  \ args) {\n        int nbrA = 15;\n        int nbrB = 10;\n        // 在单行中使用多个关系运算符\n\
  \        if (nbrA > nbrB && nbrA < nbrC) {\n            System.out.println(\"A is\
  \ greater than B AND less than C.\");\n        } else {\n            System.out.println(\"\
  A does not satisfy both conditions.\");\n        }\n    }\n}\n```\n\n\n\n\n上一个示例使用了关系运算符和逻辑与\
  \ (`&&`) 运算符来检查 `nbrA` 是否大于 `nbrB` 以及 `nbrA` 是否小于 `nbrC`。\n\n### 三元运算符\n\nJava 还有一种三元运算符，我们可以用它简洁地评估条件，并根据检查条件的真/假结果返回一个或两个值。其语法如下：\n\
  `result = condition ? value_if_true : value_if_false;`\n\n条件是我们评估的表达式。唯一的要求是它的结果为真或假。以下是一个使用三元运算符找到两个数较大值的代码示例：\n\
  \n```java\npublic class Ternary {\n    public static void main(String[] args) {\n\
  \        int nbrA = 8;\n        int nbrB = 24;\n        int largest = (nbrA > nbrB)\
  \ ? nbrA : nbrB;\n        System.out.println(\"The largest value is: \" + largest);\n\
  \    }\n}\n```\n\n是另一个示例。在这里，我们使用三元运算符来判断一个数字是奇数还是偶数。\n\n```java\nSystem.out.println(\"\
  nbrA is: \" + result);\n```\n\n| 注意：三元运算符本质上是 `if-else` 语句的快捷方式，它将在本章后面的控制结构部分进行介绍。\
  \ |\n\n### 一元运算符\n\n一元运算符用于对单个数字执行操作。一元意味着涉及单个组件。正如在表 2.7 中所示，共有五个一元运算符：\n\n| :---\
  \ | :--- |\n| + | 一元加 |\n| - | 一元减 |\n| ++ | 递增 |\n| -- | 减 |\n| ! | 逻辑取反 (NOT)\
  \ |\n\n表 2.7：一元运算符\n\n\n```java\npublic class UnaryExample {\n    public static\
  \ void main(String[] args) {\n        int nbrA = 5;\n        int nbrB = -10;\n \
  \       boolean boolC = true;\n        // 一元加 (+)\n        int positiveA = +nbrA;\
  \ // 值没有变化\n        // 一元减 (-)\n        int negativeB = -nbrB; // 对 nbrB 的值取反\n\
  \        System.out.println(\"Unary minus of nbrB: \" + negativeB); // 输出: 10\n\
  \        // 递增运算符 (++)\n        nbrA++; // nbrA = nbrA + 1\n        System.out.println(\"\
  After incrementing, nbrA: \" + nbrA); // 输出: 6\n        // 递减运算符 (--)\n        nbrB--;\
  \ // nbrB = nbrB - 1\n        System.out.println(\"After decrementing, nbrB: \"\
  \ + nbrB); // 输出: -11\n        boolean notC = !boolC; // 对 boolC 的布尔值取反\n      \
  \  System.out.println(\"Logical complement of boolC: \" + notC); // 输出: false\n\
  \    }\n}\n```\n\n上一个代码的输出如下：\n\nUnary plus of nbrA: 5\nAfter incrementing, nbrA:\
  \ 6\nAfter decrementing, nbrB: -11\nLogical complement of boolC: false\n\n## 控制结构\n\
  \nJava 了一系列允许我们控制程序流的结构。我们通过评估条件并根据结果执行特定代码来实现。Java 中有三种主要的控制结构：条件语句、循环结构和分支语句。\n\
  \n### 条件语句\n条件语句允许我们根据编写的条件来决定执行哪个代码块，从而引导程序执行的流。想一个非编程的例子：如果一个人的年龄达到最小年龄，他们将被允许进入嘉乐场设施。同样的逻辑可以使用条件语句在\
  \ Java 中实现。\n\n在本节中，我们将涵盖四个条件语句：`if`、`if-else`、`else-if` 和 `switch`。\n\n### If\n\
  \n`if` 语句是最常见且最简单的条件控制结构。我们可以用它来评估特定条件，如果该条件为真，则执行代码块。这是一个示例：\n\n```java\nif (age\
  \ > 17) {\n    System.out.println(\"You can ride the Ferris Wheel!\");\n}\n```\n\
  \n在之前的示例中，只有当我们的条件 `age > 17` 求值为真时，我们才会打印代码块中的消息。\n\n### If-else\n\n\n```java\n\
  int age = 21;\nif (age > 17) {\n    System.out.println(\"You can ride the Ferris\
  \ Wheel!\");\n} else {\n    System.out.println(\"Sorry, you are too young to ride\
  \ the Ferris Wheel.\");\n}\n```\n在上述示例中，我们为每个条件结果（真或假）准备了不同的代码块。\n\n### Else-if\n\
  \n`else-if` 语句允许在一个块中实现多个条件。这是一个示例：\n\n```java\nint age = 21;\nif (age < 18) {\n\
  } else if (age >= 65) {\n    System.out.println(\"Seniors ride for free!\");\n}\n\
  ```\n\n### Switch\n\n`switch` 语句是 `else-if` 的简化版本。这是一个示例：\n\nint weekDay = 3;\n\
  switch (weekDay) {\n    case 1:\n        System.out.println(\"Monday\");\n     \
  \   break;\n    case 2:\n        System.out.println(\"Tuesday\");\n        break;\n\
  \    case 3:\n        break;\n    case 4:\n        System.out.println(\"Thursday\"\
  );\n        break;\n    case 5:\n        System.out.println(\"Friday\");\n     \
  \   break;\n    default:\n        System.out.println(\"Invalid day.\");\n```\n\n\
  ### 循环\n\n循环允许我们重复执行代码块。节介绍了三种循环类型：`for`、`while` 和 `do-while`。\n\n#### For\n\n`for`\
  \ 循环通常用于我们知道重复代码块次数的情况。`for` 语句有三个部分：初始化、条件和递增。\n```java\nfor (int i = 0; i < 6;\
  \ i++) {\n    System.out.println(i);\n}\n```\n\n#### While\n\n`while` 循环用于在条件为真时运行代码块。示例如下：\n\
  ```java\nint i = 0;\nwhile (i < 6) {\n    System.out.println(i);\n    i++;\n}\n\
  ```\n\n#### Do-while\n`do-while` 循环用于我们希望代码块至少运行一次。它的实现方式是在每次迭代结束后进行条件检查。\n\n```java\n\
  int i = 0;\ndo {\n    System.out.println(i);\n    i++;\n} while (i < 6);\n```\n\
  ### 分支\n\n分支允许我们中断其他控制结构的正常流。在本节中，我们将查看三个用于分支的 Java 关键字：`break`、`continue` 和 `return`。\n\
  \n### Break\n\n`break` 关键字用于在循环完成之前突然退出循环。\n\n```java\n    if (i == 8) {\n     \
  \   break;\n    }\n    System.out.println(i);\n}\n```\n\n#### Continue\n\n\n```java\n\
  for (int i = 0; i < 25; i++) {\n    if (i == 8) {\n        continue;\n    }\n  \
  \  System.out.println(i);\n}\n```\n#### Return\n\n\n\n\n\n`return` 关键字用于退出方法。根据我们编写方法的方式（在下一节中将详细介绍），我们可以在退出时选择性返回一个值。\n\
  \n这是一个示例：\n```java\nfor (int i = 0; i < 24; i++) {\n    if (i == 8) {\n        System.out.println(\"\
  Exiting the loop because i = \" + i);\n        return;\n    }\n    System.out.println(i);\n\
  }\n```\n上述示例在条件 `i == 8` 结果为真后，退出循环并终止当前的执行。\n\n## 方法\n\n方法是为执行特定任务编写的代码块。它们可以接受输入（参数）并返回结果。方法是可以重用的，并且是\
  \ Java 模块化的核心部分。在应用程序中使用方法可以帮助我们避免重复代码，使代码更易于读，并且更具维护性。\n\n方法的语法如下：\n\n```java\n\
  \    // 方法体放在这里\n}\n```\n\n`returnType` 标识方法返回的数据类型。如果不返回任何内容，我们使用 `void` 关键字而不是特定的数据类型。方法名应该是自描述的，并使用\
  \ `camelCase`（驼峰法）。参数是可选的，如果方法不接受参数，我们只需使用一对空括号，中间不留任何内容。方法体被包括在一在大括号中。\n\n以下是一个不接受任何参数且不返回值的示例方法。它只是在屏幕上打印如下消息：\n\
  \n```java\n    System.out.println(\"Welcome to my world!\");\n}\n```\n\n我们可以通过简单的一行代码来调用此方法：\n\
  \n```java\nwelcome();\n```\n让我们来看下面这个接受参数并返回值的示例方法：\n\n```java\npublic int add(int\
  \ nbrA, int nbrB) {\n    return nbrA + nbrB;\n}\n```\n\n下面的代码所示 `add()` 方法接受两个值，这两个值都是整数。`return`\
  \ 语句返回两个变量之和。我们在程序中调用它的方式可以是以下形式之一：\n```java\n// 示例 1\nmyTotal = add(8, 24);\n\n\
  // 示例 2\nint a = 8;\nint b = 24;\nmyTotal = add(a, b);\n```\n### 关于参数的更多内容\n\n正如我们之前过的，方法可以可选地接受参数。这些参数是方法的输入。如果我们写了一个方法并确定它接受参数，则必须提供这些参数。我们的\
  \ `add(int nbrA, int nbrB)` 示例需要两个参数，两者都必须是整数。如果不是，我们的代码将无法编译，我们的 IDE 将提醒我们错误。\n\
  \n关于方法参数，有几条规则需要记住：\n\n- 如果方法需要参数，则必须传递参数。\n- 传递的参数必须与方法名中定义的匹配。\n- Java 是按值传递的，因此传递到方法的是参数（参数）值的副本，而不是变量本身。\n\
  \n### 作用域\n\n我们之前介绍过作用域，将其定义为变量在程序中可访问的引用。在方法内部定义的变量是局部变量，仅在方法内部可见。使用显示的方法作为参考，`jerseyNumber`\
  \ 变量是局部的，并在方法执行结束后后被销毁：\n\n```java\npublic void displayJerseyNumber() {\n    int\
  \ jerseyNumber = 24; // 局部变量\n    System.out.println(jerseyNumber);\n```\n\n`jerseyNumber`\
  \ 变量在 `displayJerseyNumber()` 方法外部无法。\n\n### 详细示例\n\n让我们仔细查看一个电子商务系统部分的方法实现，该系统允许用户选择盘子类型（晚餐盘、沙拉盘或甜点盘）、选择图案、颜色以及材料类型或刻字等其他定制选项。我们将逐节审查此代码。\n\
  \n第一部分设置了我们的 `CustomPlate` 类，导入了必要的 Java 包，建立了我们需要的变量，并包含了构造函数。所有这些方面将在第 3 章 面向对象编程基础中涵盖。在这里展示它们是为了代码的清晰和完整性，如下所示：\n\
  ```java\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class CustomPlate\
  \ {\n    // 盘子配置变量\n    private String plateType; // 盘子类型（例如：晚餐、沙拉、甜点）\n    private\
  \ String print; // 图案（例如：花卉、几何）\n    private String color; // 盘子颜色\n    private\
  \ String engraving; // 自定义刻字文字（可选）\n    private List<String> additionalOptions;\
  \ // 任何额外定制（例如：金边、哑光面）\n    private double basePrice;\n\n    // 构造函数\n    public\
