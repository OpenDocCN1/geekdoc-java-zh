  \ 和 `getNodeByRowColumnIndex()` 方法，所示：\n\n```java\n// Helper method to save transaction\
  \ to file\nprivate void saveTransactionToFile(String transactionLine) {\n    try\
  \ (BufferedWriter writer = new BufferedWriter(new FileWriter(\"transactions.txt\"\
  , true))) {\n        writer.write(transactionLine);\n        writer.newLine();\n\
  \    } catch (IOException ex) {\n        showAlert(\"Error\", \"Failed to save transaction.\"\
  );\n    }\n}\n\n// Remove a transaction\nprivate void removeTransactionFromTable(int\
  \ rowIndex) {\n    // Find and remove row nodes\n    accountTable.getChildren().removeIf(node\
  \ -> GridPane.getRowIndex(node) != null && GridPane.getRowIndex(node) == rowIndex);\n\
  \    // Adjust balance\n    Label amountLabel = (Label) getNodeByRowColumnIndex(rowIndex,\
  \ 1, accountTable);\n    if (amountLabel != null) {\n        try {\n           \
  \ double transactionAmount = Double.parseDouble(amountLabel.getText());\n      \
  \      totalBalance.set(totalBalance.get() - transactionAmount);\n        } catch\
  \ (NumberFormatException e) {\n            showAlert(\"Error\", \"Invalid amount\
  \ in table. Please check the data.\");\n        }\n    }\n    // Update file\n \
  \   updateTransactionsFile();\n}\n\n// Helper method to get node by row and column\
  \ index\nprivate Node getNodeByRowColumnIndex(final int row, final int column, GridPane\
  \ gridPane) {\n    Node result = null;\n    for (Node node : gridPane.getChildren())\
  \ {\n        if (GridPane.getRowIndex(node) != null && GridPane.getRowIndex(node)\
  \ == row &&\n            GridPane.getColumnIndex(node) != null && GridPane.getColumnIndex(node)\
  \ == column) {\n            result = node;\n            break;\n        }\n    }\n\
  \    return result;\n}\n```\n\n我们代码的最后一部分包含了 `updateTransactionFile()` 方法和 `main()`\
