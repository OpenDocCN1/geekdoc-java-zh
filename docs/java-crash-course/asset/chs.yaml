  \ Insets(10));\n// VBox - 交易输入\nLabel transactionLabel = new Label(\"输入详情\");\n\
  transactionLabel.setStyle(\"-fx-font-size: 16px; -fx-font-weight: bold;\");\nTextField\
  \ amountField = new TextField();\namountField.setPromptText(\"输入金额\");\nTextField\
