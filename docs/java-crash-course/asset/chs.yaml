  你发现自己在洞穴里.\");\n            // Room 1\n            System.out.println(\"Room 1:\
  \ 你看到两条路。你走左路 (A) 还是右路 (B)？\");\n            String choice1 = scanner.nextLine().trim().toUpperCase();\n\
  \            boolean tookLeftPath = choice1.equals(\"A\");\n```\n\n\n\n\n```java\n\
  // Room 2\n\nSystem.out.println(\"Room 2: You find a locked door. Do you knock (A)\
  \ or look around for a key (B)?\");\n\nString choice2 = scanner.nextLine().trim().toUpperCase();\n\
  \nboolean foundKey = choice2.equals(\"B\");\n\n// Room 3\n\nSystem.out.println(\"\
  Room 3: A mysterious figure asks you to solve a riddle.\");\n\nSystem.out.println(\"\
  Do you answer truthfully (A) or lie (B)?\");\n\nString choice3 = scanner.nextLine().trim().toUpperCase();\n\
  \nboolean answeredTruthfully = choice3.equals(\"A\");\n\n// Determine ending\n\n\
  if (tookLeftPath && foundKey && answeredTruthfully) {\n    System.out.println(\"\
  Congratulations! The figure rewards your honesty. You escape the cave safely!\"\
