  \n7. 最后一步是充分测试我们的应用程序，以确保所有功能均按预期运行。你可以尝试包含 `Clear Fields`（清除字段）按钮的功能，并尝试使用 `Add\
  \ Transaction`（添加交易）按钮查看是否会显示警报消息（参考图 11.11）：\n\n![一个带有蓝色信息图标的弹出错误消息框，文本为“所有字段必须填写”，以及一个\
  \ OK 按钮。 ](img/Figure_11.11.png)\n\n图 11.11：PFT 警报消息\n\n## 绑定属性与可观察对象\n\n在 JavaFX\
  \ 中，绑定属性（binding properties）和可观察对象（observables）是增强 GUI 交互性的关键概念。它们可以结合使用，创建响应底层数据变化的动态\
  \ UI。这种数据驱动模型与我们在本章之前介绍的事件驱动模型互为补充。\n\n在 PFT 桌面应用程序中实现这些功能之前，让我们进一步探索这些概念。在 JavaFX\
  \ 语文中，绑定属性是用来用于设置属性值之间自动同步的。当两个属性绑定且其中一个发生变化时，另一个绑定的属性或多个属性会根据变化自动更新。两种主要的绑定机制是单向绑定（unidirectional\
  \ binding）和双向绑定（bidirectional binding）。这些自描述的绑定机制为我们提供了极大的灵活性。\n\nJavaFX 还包含了带有附加监听器的对象。这些对象被称为可观察对象。它们对于我们\
  \ GUI 的响应式特性至关重要。它们的工作是在内容发生变化时通知监听器。最常见的 JavaFX 观察者类型是 `ObservableValue`（代表可观察的值）和\
  \ `ObservableList`（代表可观察列表）。\n\n在接下来的章节中，我们将在 PFT 应用程序中实现绑定属性和可观察对象。\n\n### 实现绑定属性\n\
  \n让我们使用绑定属性跟踪 PFT 应用程序中用户的总余额。我们首先在类级别声明一个 `totalBalance` 变量。\n\n以下是添加该变量的代码片段：\n\
  \n```java\npublic class PFTApp extends Application {\n\n    private GridPane accountTable;\n\
  \n    private DoubleProperty totalBalance = new SimpleDoubleProperty(0.0);\n```\n\
  \n接下来，我们将更新 UI 以显示自动更新的总余额。更新你的 `PFTApp.java` 类中的以下部分：\n\n```java\n// 将交易输入和按钮添加到\
  \ VBox\nvbox.getChildren().add(hbox);\n\n// 总余额显示\nLabel balanceLabel = new Label();\n\
  balanceLabel.setStyle(\"-fx-font-size: 18px; -fx-font-weight: bold;\");\n\n// 将\
  \ balanceLabel 绑定到 totalBalance\nbalanceLabel.textProperty().bind(totalBalance.asString(\"\
  Total Balance: $%.2f\"));\n\n// 在交易输入字段之前添加到 VBox\nvbox.getChildren().add(balanceLabel);\n\
  \nroot.setCenter(vbox);\n```\n\n你现在可以运行程序并看到总余额标签，但它还没有功能性。\n\n让我们现在来处理这个问题。\n\n\
  按照指示更新 `addTransactionToTable` 方法：\n\n```java\n// 将交易添加到表格\nprivate void addTransactionToTable(GridPane\
  \ table, String amount, String category, String description) {\n    int rowIndex\
  \ = table.getChildren().size() / 3; // 计算下一行索引\n    table.add(new Label(amount),\
  \ 0, rowIndex);\n    table.add(new Label(category), 1, rowIndex);\n    table.add(new\
  \ Label(description), 2, rowIndex);\n\n    // ─── 更新总余额 ───\n    try {\n       \
  \ double transactionAmount = Double.parseDouble(amount);\n        totalBalance.set(totalBalance.get()\
  \ + transactionAmount);\n    } catch (NumberFormatException e) {\n        showAlert(\"\
