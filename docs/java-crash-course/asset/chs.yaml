  2. 变量的作用范围定义了它在程序中可以访问的地方。在 `Java` 中有三种主要的作用范围：\n    - 局部变量：在方法内部声明，仅在该方法内访问。它们在方法执行结束后被销。\n\
  \    - 实例变量：在类中但在方法之外声明，使其可以在类的不同方法之间访问。\n    - 类变量：使用 `static` 关键字声明，这些变量由类的所有实例共享。\n\
  3. 你可以通过使用 `continue` 语句修改 `for` 循环以跳过特定的迭代。该语句强制循环跳转到下一次迭代，跳过当前迭代的其余代码。示例使用 `continue`\
  \ 跳过循环中的特定迭代。\n\n```java\nfor (int i = 1; i <= 24; i++) {\n    if (i == 8) {\n \
  \   }\n    System.out.println(i);\n}\n```\n4. `while` 循环在执行代码块之前检查条件，因此如果条件从开始就为假，则循环体将不会执行。相反，`do-while`\
  \ 循环在执行代码块后检查条件，确保代码无论初始条件如何都会运行一次。当你只想在开始时为真时才执行循环，你会使用 `while` 循环。当你需要代码至少执行一次时（即使以后可能不成立），请使用\
  \ `do-while` 循环。\n\n\n\n\n### 5. 条件语句\n\n条件语句允许程序根据不同的输入或条件执行不同的操作，从而实现决策功能。例如，在一个根据目的地国家确定运费的程序中，`if-else`\
  \ 语句可以对不同的应用不同的逻辑：\n\n```\nif (country.equals(\"USA\")) {\n  shippingCost = 12.00;\n\
  } else if (country.equals(\"Canada\")) {\n  shippingCost = 16.00;\n  shippingCost\
  \ = 24.00;\n}\n```\n\n这种条件结构通过根据用户的输入应用动态逻辑，改进了程序的功能。或者，如果有多个需要检查的预定义类别，可以使用 `switch`\
  \ 语句代替 `if-else`，这在某些情况下可以使代码更整洁。\n\n# 第 3 章 面向对象基础\n\n## 引言\n面向对象编程（OOP）是 Java\
  \ 使用的一种框架，用于结构化和组织代码，以实现可扩展性、可读性、可重性和可维护性。Java 是一门 OOP 语言，本章将涵盖 OOP 的基础知识，包括抽象、封装、继承和多态原则。OOP\
  \ 框架也称为编程范式，使我们能够高效地构建复杂的 Java 程序。\n\n在本章中，我们将介绍类和对象，它们是 OOP 的构建模块。我们将讨论构造函数和方法重载的重要性，以及它们对灵活代码的贡献。我们还将介绍如何使用\
  \ Java 的 `extends` 关键字通过建立类之间的层级关系来促进代码重用。此外，本章将介绍如何利用 OOP 安全地管理 Java 应用程序中的数据安全和完整性。与安全相关的主题包括访问修饰符和封装。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* OOP 原则简介\n* 构造函数和重载\n* 继承和 `super` 关键字\n* 多态和方法重写\n*\
  \ 访问修饰符和封装\n\n## 目标\n\n在本章结束时，我们将理解 OOP 的基本原则，包括封装、继承、多态和抽象。我们将创建并使用类和对象，以模块化、可重用的方法组织您的代码。我们还将通过构造函数和方法重载创建灵活高效的代码。我们将理解如何应用继承和\
  \ `extends` 关键字来建立层级关系并促进代码重用。此外，我们将使用访问修饰符来封装数据，确保 Java 应用程序中的数据安全和完整性。\n\n\nOOP\
  \ 是一种编程方法，也称为编程范式，它基于“对象”的概念。对象是可以包含数据以及操作这些数据的代码实体。OOP 是 Java 编程语言的基础组成部分。这种方法允许我们结构化应用程序，使其具有模块化、可重用、可读和可维护性。\n\
  \n对象的概念允许我们将代码组织成对象，每个对象都有自己的属性集和行为。正如本章所解释的，对象的属性是数据，其行为是方法（代码模块）。这种编程方法使开发变得高效，并使我们能够编写复杂且可扩展的\
  \ Java 应用程序。\n\nOOP 的核心是对象，我们根据封装、继承、多态和抽象的原则对现实世界的实体进行建模。本节将简要解释这些原则每一个，并在本章后面的部分提供更深入的介绍。\n\
  \n### 封装\n\n\n| 注意：在 OOP 背景下，数据（data）、属性（properties）和特性（attributes）本质上是可以互换的。 |\n\
  \n这种封装具有多个目的，包括：\n\n* 确保数据完整性\n* 能够限制访问\n* 保护敏感数据\n* 防止无意交互\n封装是 Java 软件开发中的关键部分，因为它允许我们编写既模块化又安全的应用程序，并且对数据以及数据在整个应用程序中的流转具有强大的控制力。\n\
  \n### 继承\n\nJava 中的继承是模仿现实世界的继承建模的。就像特征从祖父传给父母再给孩子一样，Java 中的类可以继承其他类。这促进了代码重用，意味着更少的编程工作。我们在类之间建立了一种层级关系，从基类（也称为父类）开始，并使用专门的类（也称为子类）扩展该类。这种继承允许子类继承基本属性，同时拥有自己独特的属性和行为。\n\
  \n考虑动物界的层级结构，部分如图 3.1 所示：\n\n![一张层级图，显示顶部是物种，分支到猫、狗和斑马。狗分支到爱尔兰塞特犬、柯基犬和狮子犬。柯基分支到威尔士柯基和康迪根威尔士柯基？](img/Figure_3.1.png)\n\
  图 3.1：四层继承层级结构\n\n在这个示例中，`Species` 是基类，代表多种动物，包括 `Dog`。`Corgi` 类继承自 `Dog`，`Dog`\
  \ 继承自 `Species`。`Dog` 类有三个子类（或称为孩子）：爱尔兰塞特犬、威尔士柯基和康迪根威尔士柯基。\n\n在本章的晚些时候，我们将在 Java\
  \ 中创建这些类和子类。\n\n### 多态\n\n在编程中，“多态”一术语意味着“多种形式”。具体来说，一个对象可以是父类的实例，同时拥有自己独特的属性和行为。这允许我们以标准化的方式处理不同类的对象。这为我们的程序提供了极大的灵活性和扩展性。\n\
  让我们考虑上一节中狗的例子。使用多态，我们可以将 `PembrokeWelshCorgi` 和 `CardiganWelshCorgi` 都视为其父类 `Corgi`\
  \ 的实例。此外，我们甚至可以将它们视为更广泛的 `Dog` 类的实例。尽管这些子类中的可能共享某些方法，但每个子类都可以重写这些方法以表现出自己的行为。例如，`PembrokeWelshCorgi`\
  \ 和 `CardiganWelshCorgi` 类都可能有一个 `herd()` 方法，每个类都可以根据其独特的放牧风格不同地实现该方法；也许一个会叫，另一个咬脚踝。\n\
  \n多态是一个至关重要的 OOP 原则，允许我们创建灵活、自适应且可扩展的代码。利用 Java 的多态能力允许我们创建系统，可以根据现有代码轻松创建新的对象类型。这强制新对象必须遵循父类预期的结构和行为。\n\
  \n### 抽象\n\n抽象是第四个核心 OOP 原则，它允许我们隐藏对象实现的细节，只暴露功能所需的内容。“抽象”一词源于将实现与功能分离的抽象行为。在 Java\
  \ 中，我们通过定义具有整体类视图的类和接口并封装其复杂性来实现这一点。\n\n回到我们的狗的例子，我们可以创建一个 `Animal` 抽象类，它包含一些基础方法，如\
  \ `eat()`、`sleep()`、`walk()` 和 `jump()`，但不对这些方法提供任何细节。然后，`Dog` 类将继承 `Animal` 类，并针对这四个方法在狗身上的应用提供实现细节。每个亚品种的类可以根据需要包含额外的方法定制。\n\
  \n\n\n抽象允许我们对对象的简化表示形式进行操作，而无需理解所有的细节。这在处理大型应用程序时特别有帮助。隐藏复杂性有助于我们的代码更具可读性和可维护性。\n\
  \n## 定义和使用类与对象\n\n此时，你应该理解类和对象是 Java 面向对象（OOP）实现的核心。本节将解释如何定义和使用类和对象。我们的目标是使用 OOP\
  \ 方法创建结构化、模块化的应用程序。我们从类创建对象，这意味着类是对象的蓝图。它们定义了对象可以拥有的属性和方法。我们将继续使用狗的例子来帮助你理解如何定义和使用类与对象。\n\
  \n\n出乎意料的是，在 Java 中创建一个类，我们使用 `class` 关键字，后跟类名和一对大括号，如下所示：`public class Dog {}`。在大括号内部，我们定义属性（也称为字段）和方法（也称为行为）。让我们来编写\
  \ `Dog` 类，然后讨论它的组件：\n\n```java\npublic class Dog {\n\n// attributes / fields\nprivate\
  \ String name;\nprivate String breed;\nprivate double weight;\n\n// methods / behaviors\n\
  public void bark() {\n    System.out.println(name + \" is currently barking!\");\n\
  }\n\npublic void eat() {\n    System.out.println(name + \" is currently eating.\"\
  );\n\npublic void sleep() {\n    System.out.println(name + \" is currently sleeping.\"\
  );\n}\n\n}\n```\n\n正如我们在示例中看到的，`Dog` 类包含了属性和方法。属性有 `name`、`breed`、`age` 和 `weight`。这些是使用\
  \ `Dog` 类创建的狗的特征。每只狗都可以对这些属性拥有自己的值。例如，一只狗的名字可能是 `Muzz`，另一只是 `Java`。每个方法都是使用 `private`\
  \ 访问修饰符创建的。\n正如我们在封装中讨论过的，这是封装的一个实际示例。这意味着属性只能通过类内部的方法进行访问。我们将在本章稍后部分介绍方法。\n\n`Dog`\
  \ 类目前包含三个方法：`bark()`、`eat()` 和 `sleep()`。除了输出消息外，它们还没有做过任何令人印象深刻的事情。\n\n### 创建对象\n\
  \n现在我们有了一个 `Dog` 类，可以使用该类作为模板创建新对象。为了做到这一点，我们将在 Java 中使用 `new` 关键字。对象是类的唯一实例。它有自己的内存位置和唯一的属性值。`new`\
  \ 关键字会导致为对象分配内存。它还会调用类的构造器方法，这就是初始化对象的方式。\n\n让我们看看下面的示例：\n```java\npublic class\
  \ CorgiLove {\n\n    public static void main(String[] args) {\n        // 创建一个 Dog\
  \ 类的对象\n        Dog myDog = new Dog();\n\n        // 设置属性\n        myDog.name =\
  \ \"Basil\";\n        myDog.age = 3;\n        myDog.weight = 12.5;\n\n        //\
  \ 调用方法\n        myDog.bark();\n        myDog.eat();\n        myDog.sleep();\n  \
  \  }\n}\n\n关键代码行是 `Dog myDog = new Dog();`，因为这是我们创建 `Dog` 对象的方式。`myDog` 变量名由你决定。我们可以很容易地使用\
  \ `myFirstDog` 或 `dadsDog`。在属性部分，我们使用点符号（`.`）来访问对象的属性和方法。这就是我们如何确保属性或方法特指这个特定的对象的方法。\n\
  \n### 初始化对象\n\n当我们使用 `new` 关键字创建 `myDog`（即 `Dog` 类的一个实例）时，Java 使用类中的构造器方法来创建该实例。构造器在对象创建时会被自动调用。这些构造器用于建立默认属性及其值。正如你将在后续示例中看到的，构造器的名称与类相同。下面的示例是一个更新后的\
  \ `Dog` 类，它包含一个构造器来初始化类的实例并初始化其字段：\n\n```java\npublic class Dog {\n// attributes\
  \ / fields\nprivate String name;\nprivate String breed;\nprivate int age;\nprivate\
  \ double weight;\n\n// Constructor\npublic Dog(String name, String breed, int age,\
  \ double weight) {\n    this.name = name;\n    this.age = age;\n    this.weight\
  \ = weight;\n}\n\n// methods / behaviors\npublic void bark() {\n    System.out.println(name\
  \ + \" is currently barking!\");\n}\n\n    System.out.println(name + \" is currently\
  \ eating.\");\n}\n\npublic void sleep() {\n    System.out.println(name + \" is currently\
  \ sleeping.\");\n}\n\n}\n```\n现在我们的 `Dog` 类有了构造器，我们可以修改 `CorgiLove` 类，并将属性值作为对象创建过程的一部分提供。以下是代码：\n\
  \n```java\npublic class CorgiLove {\n\n    public static void main(String[] args)\
  \ {\n        // 创建一个 Dog 类的对象\n        Dog myDog = new Dog(\"Basil\", \"Corgi\"\
  , 3, 12.5);\n\n        myDog.bark();\n        myDog.eat();\n        myDog.sleep();\n\
  \    }\n}\n```\n\n正如你所看到的，构造器允许我们仅需一行代码即可创建完全初始化的对象。\n\n\n构造器允许我们仅需一行代码即可创建完全初始化的对象。\
  \ \n\n当我们有了属性时，我们需要能够获取并修改它们。通常，我们使用获取（getter）和设置（setter）方法。这种命名约定（使用 `get` 和 `set`\
  \ 前缀）有助于我们代码的可读性和可维护性。\n\n以下是带有 getter 和 setter 的更新后的 `Dog` 类：\n\n```java\npublic\
  \ class Dog {\n// attributes / fields\nprivate String name;\nprivate String breed;\n\
  private int age;\nprivate double weight;\n\n// Constructor\npublic Dog(String name,\
  \ String breed, int age, double weight) {\n    this.name = name;\n    this.age =\
  \ age;\n    this.weight = weight;\n}\n\n// Getter and Setter for name\npublic String\
  \ getName() {\n    return name;\n}\npublic void setName(String name) {\n}\n\n//\
  \ Getter and Setter for age\npublic int getAge() {\n    return age;\n}\npublic void\
  \ setAge(int age) {\n    this.age = age;\n}\n// methods / behaviors\npublic void\
  \ bark() {\n    System.out.println(name + \" is currently barking!\");\n}\n\npublic\
  \ void eat() {\n    System.out.println(name + \" is currently eating.\");\n}\n\n\
  \    System.out.println(name + \" is currently sleeping.\");\n}\n\n}\n```\n\n接下来，我们必须修改我们的\
  \ `CorgiLove` 类以使用 getter 和 setter。以下是使用 `getName()`、`getAge()` 和 `setAge()` 方法的示例：\n\
  \n```java\n\n    public static void main(String[] args) {\n        // 创建一个 Dog 类的对象\n\
  \        Dog myDog = new Dog(\"Basil\", \"Corgi\", 3, 12.5);\n\n        // 使用 getter\
  \ 访问属性\n        System.out.println(\"狗的名字是 \" + myDog.getName());\n        System.out.println(\"\
  狗的年龄是 \" + myDog.getAge());\n\n        myDog.setAge(8);\n        System.out.println(\"\
  更新后的年龄: \" + myDog.getAge());\n    }\n}\n```\n\n创建和使用 getter 和 setter 让我们能够清晰地控制类属性的访问和修改。这不仅是一种最佳实践，也是保护数据的一种很好的技术。\n\
  \n构造器与重载\n在 Java 中，我们使用构造器方法来初始化新对象，赋予它们初始属性值。我们依赖构造器在对象使用之前对其进行正确的初始化。这是一个重要的 OOP\
  \ 结构。构造器重载是一个 OOP 特性，允许我们创建多个版本的构造器，每个版本都有独特的参数集。这为我们创建对象引入了极大的活性。\n\n在深入研究构造器重载之前，让我们回顾一下构造器的规则：\n\
  \n*   它们必须与类名相同。\n*   它们没有返回类型；这包括 `void` 关键字。\n*   它们的唯一目的是初始化对象。\n\n\n在上一节中，我们编写了\
  \ `Dog` 类，其中包含了此构造器方法：\n\n```java\npublic Dog(String name, String breed, int age,\
  \ double weight) {\n    this.name = name;\n    this.breed = breed;\n    this.age\
  \ = age;\n    this.weight = weight;\n}\n\n上述方法确保了每当初始化一个 `Dog` 对象时，它都会拥有 `name`、`breed`、`age`\
  \ 和 `weight` 属性。使用 Java 的 `this` 关键字可以区分参数名和类的字段名。\n\n### 构造器重载的用例\n\n在上一节中，我们已经确定可以使用以下代码创建\
  \ `Dog` 实例，并为对象的属性建立初始值：\n\n```java\nDog myDog = new Dog(\"Basil\", \"Corgi\", 3,\
  \ 12.5);\n\n如果我们在创建对象时没有所有四个属性值可以使用了呢？考虑这样一种场景：我们的应用程序用于动物诊所；`name` 和 `breed` 被输入系统，而\
  \ `age` 和 `weight` 值在动物就诊期间后期才输入。我们不希望强制填写 `age` 和 `weight` 值；相反，我们希望只用四个属性中的两个来初始化对象。\n\
  \n每个构造器都有唯一的参数列表，为我们提供了所需的灵活性。因此，让我们通过创建一个仅包含两个属性的新构造器方法来重载当前的构造器，如下如下：\n\n```java\n\
  public Dog(String name, String breed) {\n    this.name = name;\n    this.breed =\
  \ breed;\n    this.weight = 0.0; // 默认值\n}\n```\n\n如前面的代码所示，构造器的定义只包含两个属性，另外两个由方法赋予了默认值。\n\
  \n接下来，让我们写另一个没有参数的构造器，如下：\n\n```java\n    this.name = \"Unknown\";\n    this.breed\
  \ = \"Unknown\";\n    this.age = 0;\n    this.weight = 0.0;\n}\n```\n\n| 注意：无参数的构造器被称为默认构造器。\
  \ |\n\n\n```java\npublic class Dog {\n    // 属性 / 字段\n    private String name;\n\
  \    private String breed;\n    private int age;\n    private double weight;\n\n\
  \    public Dog(String name, String breed, int age, double weight) {\n        this.name\
  \ = name;\n        this.breed = breed;\n        this.age = age;\n        this.weight\
  \ = weight;\n    }\n\n    // 只有 name 和 breed 的构造器\n    public Dog(String name, String\
  \ breed) {\n        this.breed = breed;\n        this.age = 0; // 默认值\n        this.weight\
  \ = 0.0; // 默认值\n    }\n\n    // 无参数的构造器（默认构造器）\n    public Dog() {\n        this.name\
  \ = \"Unknown\";\n        this.breed = \"Unknown\";\n        this.weight = 0.0;\n\
  \    }\n\n    // 'name' 的 Getter 和 Setter\n    public String getName() {\n     \
  \   return name;\n    }\n    public void setName(String name) {\n        this.name\
  \ = name;\n\n    // 'breed' 的 Getter 和 Setter\n    public String getBreed() {\n\
  \        return breed;\n    }\n    public void setBreed(String breed) {\n      \
  \  this.breed = breed;\n    }\n\n    public int getAge() {\n        return age;\n\
  \    }\n    public void setAge(int age) {\n        this.age = age;\n    }\n\n  \
  \  // 'weight' 的 Getter 和 Setter\n    public double getWeight() {\n    }\n    public\
  \ void setWeight(double weight) {\n        this.weight = weight;\n    }\n\n    //\
  \ 方法 / 行为\n    public void bark() {\n        System.out.println(name + \" 正在叫!\"\
  );\n    }\n    public void eat() {\n        System.out.println(name + \" 正在吃饭.\"\
  );\n    }\n\n    public void sleep() {\n        System.out.println(name + \" 正在睡觉.\"\
  );\n    }\n}\n```\n在下一节中，我们将探索如何调用这些不同的构造器方法。\n\n### 调用构造器\n\n当我们创建一个新的 `Dog` 对象时，Java\
  \ 将根据我们的参数知道该调用哪个构造器方法。记住，每个构造器都有唯一的参数列表。\n\n以下是使用所有三个构造器的示例：\n\n```java\n    public\
  \ static void main(String[] args) {\n        // 使用全构造器\n        Dog dog1 = new Dog(\"\
  Java\", \"Corgi\", 10, 48.3);\n        // 使用部分构造器\n        Dog dog2 = new Dog(\"\
  Brandy\", \"Irish Setter\");\n        // 使用默认构造器\n        Dog dog3 = new Dog();\n\
  \n        // 输出示例\n        System.out.println(dog2.getName() + \", \" + dog2.getBreed()\
  \ + \", \" + dog2.getAge() + \" years, \" + dog2.getWeight() + \" lbs\");\n    \
  \    System.out.println(dog3.getName() + \", \" + dog3.getBreed() + \", \" + dog3.getAge()\
  \ + \" years, \" + dog3.getWeight() + \" lbs\");\n    }\n}\n```\n\n以下是 `AnimalClinic`\
  \ 程序的输出：\n\nJava, Corgi, 10 years, 48.3 lbs\nUnknown, Unknown, 0 years, 0.0 lbs\n\
  \n### 益处\n\n在我们结束对构造器重载的之前，让我们回顾一下实现此功能的主要优势：\n\n*   构造器重载为我们创建对象提供了极大的灵活性，每个对象可以使用不同的数据集。\n\
  *   这种方法减少了代码，因为我们不需要为以各种方式创建对象重复方法。\n*   它使我们的代码更具可读性和维护性。\n## 继承和 super 关键字\n\n\
  继承是 OOP 的核心原则，允许类从另一个类继承属性和方法。这些关系通常模拟现实世界中的关系，如图所示。本节将演示如何使用 Java 的 `extends` 关键字实现继承，并解释\
  \ `super` 关键字所起的作用。\n\n### 实现继承\n\n继承的核心是基于现有类定义新类的能力。现有类被称为父类或超类。新类是子类，也称为派类。子类继承超类的所有属性和方法，但不限于所继承的内容；子类中可以存在新的属性和方法。\n\
  \n注意：由于我们之前实现的是没有关系的 `Dog` 类，我们将在本节中使用 `Canine` 类来说明这种结构。\n在编写我们的类之前，我们需要审查层次结构，以确保完全理解每个层级所需的属性和方法。下表详细列出了我们将实现的层次结构如下：\n\
  \n| 类 | 继承自 | 详情 |\n| :--- | :--- | :--- |\n| Species | | 这是顶层类，代表广泛的生物分类。 |\n|\
  \ Animal | Species | 它代表所有动物的共同特征。 |\n| Canine | Animal | 它包含犬特有的属性和行为。 |\n| Corgi\
  \ | Canine | 进一步专门化 `Canine` 类，区分柯基犬：彭士威尔柯基和康威尔柯基。 |\n\n\n```java\npublic class\
  \ Species {\n    // 属性\n    protected String scientificName;\n\n    // 构造器\n   \
  \ public Species(String scientificName) {\n        this.scientificName = scientificName;\n\
  \n    // 方法\n    public void displayInfo() {\n        System.out.println(\"Species:\
  \ \" + scientificName);\n    }\n}\n```\n\n\n如前面的代码所示，`Species` 类有一个单一属性 `scientificName`，它是所有物种的共同属性。该类包含一个构造函数和一个显示\
  \ `scientificName` 属性值的方法。\n\n接下来，我们将编写 `Animal` 类，它将继承自 `Species`。\n\n```java\n\
  public class Animal extends Species {\n    // 属性\n    protected String habitat;\n\
  \n    public Animal(String scientificName, String habitat) {\n        super(scientificName);\
  \ // 调用 Species 的构造函数\n        this.habitat = habitat;\n    }\n\n    // 方法\n   \
  \ public void move() {\n        System.out.println(\"The animal moves in its habitat.\"\
  );\n    }\n```\n\n使用 `extends` 关键字告诉 Java `Animal` 类继承自 `Species`。`super(scientificName)`\
  \ 这一行调用 `Species` 类的构造函数来初始化 `scientificName`。`move()` 方法是 `Animal` 特有的；它作为 `Species`\
  \ 类的一部分存在。\n\n接下来，让我们实现 `Canine` 类并让它继承 `Animal` 类，如下：\n\n```java\npublic class\
  \ Canine extends Animal {\n    // 属性\n\n    // 构造函数\n    public Canine(String scientificName,\
  \ String habitat, String breed) {\n        super(scientificName, habitat); // 调用\
  \ Animal 的构造函数\n        this.breed = breed;\n    }\n\n    // 方法\n    public void\
  \ bark() {\n    }\n}\n```\n\n我们的 `Canine` 类使用 `super(scientificName, habitat)` 代码调用\
  \ `Animal` 类构造函数，而这又调用了 `Species` 类构造函数。`bark()` 方法是 `Canine` 类特有的；它不是从 `Animal`\
  \ 或 `Species` 继承来的。\n\n```java\npublic class Corgi extends Canine {\n    // 属性\n\
  \n    // 构造函数\n    public Corgi(String scientificName, String habitat, String breed,\
  \ String subBreed) {\n        super(scientificName, habitat, breed); // 调用 Canine\
  \ 的构造函数\n        this.subBreed = subBreed;\n    }\n\n    // 方法\n    public void\
  \ herd() {\n    }\n\n    // 重写 displayInfo 方法\n    @Override\n    public void displayInfo()\
  \ {\n        super.displayInfo(); // 调用 Species 的 displayInfo\n        System.out.println(\"\
  Breed: \" + breed + \", Sub-breed: \" + subBreed);\n    }\n}\n\n我们的 `Corgi` 类拥有\
  \ `subBreed` 属性，因此我们可以指定两种柯基类型之一：威尔士彭柯基或卡迪根威尔士柯基。`herd()` 方法是 `Corgi` 类特有的。最后，重写了\
  \ `displayInfo()` 方法，以显示关于 `breed` 和 `subBreed` 的额外信息。\n\n注意：当子类需要引用其父类时，使用 `super`\
  \ 关键字。这可以用于调用父类构造函数或访问父类方法。\n\n### 完整的继承演示\n\n写好 `Species`、`Animal`、`Canine` 和 `Corgi`\
  \ 类后，我们准备好创建这些类的实例，以演示继承和 `super` 关键字的使用，如下：\n\npublic class PetGrooming {\n   \
  \ public static void main(String[] args) {\n        // 创建一个柯基对象\n        Corgi myCorgi\
  \ = new Corgi(\"Canis lupus familiaris\", \"Domestic\", \"Corgi\", \"Pembroke Welsh\
  \ Corgi\");\n\n        // 调用方法\n        myCorgi.displayInfo(); // 调用 Corgi 中重写的方法\n\
  \        myCorgi.move(); // 调用来自 Animal 的方法\n        myCorgi.bark(); // 调用来自 Canine\
  \ 的方法\n    }\n}\n```\n\n以下是 `PetGrooming` 程序的输出：\n\nSpecies: Canis lupus familiaris\n\
  Breed: Corgi, Sub-breed: Pembroke Welsh Corgi\nThe animal moves in its habitat.\n\
  The Pembroke Welsh Corgi Corgi is herding.\n\n我们的 `PetGrooming` 调用了四个方法：\n\n*  \
  \ `Corgi` 中的 `displayInfo()` 调用 `super.displayInfo()` 来访问父类的版本的方法。它随后添加了 `Corgi`\
  \ 类特有的额外细节。\n*   `move()` 继承自 `Animal`。\n*   `bark()` 继承自 `Canine`。\n*   `herd()`\
  \ 是 `Corgi` 特有的。\n\n\n在我们结束对继承和 `super` 关键字的介绍时，让我们总结一下在程序中实现这些特性的三个主要优势：\n\n* \
  \  **代码复用性**：我们可以将共同属性和功能放在父类中，并允许多个子类继承它。这减少了代码重复。\n*   **逻辑组织**：我们使用继承来紧密模拟真实世界的层次结构和分类法，以便理解。\n\
  *   **可扩展性**：我们可以在不需要修改父类的情况下添加子类。这有助于扩展性。\n\n### 多态与方法重写\n\n\n我们将继续通过 `Species`、`Animal`、`Canine`\
  \ 和 `Corgi` 类来讨论这些实现方法。\n\n### 方法重写\n\n在 Java 中，我们使用方法重写，以便子类可以提供特定的方法实现。重写的方法必须与父类具有相同的方法、返回类型和参数。这是实现多态的核心。\n\
  \n为了演示方法重写，我们将修改 `Animal` 类中的 `move()` 方法，并在 `Corgi` 类中提供自己的特定实现。\n\n\n\n```java\n\
  dogAnimal.move(); // 由于多态，调用 Canine 的 move() 方法\n\ncorgiAnimal.move(); // 由于多态，调用\
  \ Corgi 的 move() 方法\n\n}\n\n```\n\n该程序的输出如下：\n\n动物在它的栖息地相应地移动。\n狗在它的栖息地顽玩地跑跑。\n\
  彭布鲁威尔柯基以短而跳跃的步态快走。\n\n在示例中，我们创建了三个对象（`genericAnimal`、`dogAnimal` 和 `corgiAnimal`），并将它们都声明为\
  \ `Animal` 类型。在运行时，Java 根据对象的实际类型决定调用哪个 `move()` 方法：\n* `genericAnimal.move()` 调用\
  \ `Animal` 类中的 `move()` 方法。\n* `dogAnimal.move()` 调用 `Canine` 类中被重写的 `move()` 方法。\n\
  * `corgiAnimal.move()` 调用 `Corgi` 类中被重写的 `move()` 方法。\n\n动态方法分派机制使我们能够编写高度灵活的代码。我们可以编写使用父类引用的方法，Java\
  \ 将使用运行时最具体的实现。\n\n### 完整实现\n\n让我们把所有部分结合，演示多态如何简化我们的代码。考虑一个 `animalMovement()`\
  \ 方法，它接受一个 `Animal` 参数并调用它的 `move()` 方法。通过多态，我们可以将 `Animal` 的任何子类传递给此方法，它将表现出该子类的特定行为。我们将从如下一个新的\
  \ `Zoo` 类开始：\n```java\npublic class Zoo {\n    public void animalMovement(Animal\
  \ animal) {\n        animal.move();\n    }\n}\n```\n\n现在，我们将创建一个 `NashvilleZoo`\
  \ ，用不同类型的动物调用 `animalMovement()` 方法：\n```java\npublic class NashvilleZoo {\n   \
  \ public static void main(String[] args) {\n        Zoo zoo = new Zoo();\n     \
  \   Animal genericAnimal = new Animal(\"Generic species\", \"various habitats\"\
  );\n        Animal dog = new Canine(\"Canis lupus familiaris\", \"Domestic\", \"\
  Mixed breed\");\n        Animal corgi = new Corgi(\"Canis lupus familiaris\", \"\
  Domestic\", \"Corgi\", \"Pembroke Welsh Corgi\");\n        zoo.animalMovement(genericAnimal);\n\
  \        zoo.animalMovement(dog);\n    }\n}\n```\n\n以下是程序的输出：\n\n动物在它的栖息地相应地移动。\n\
  狗在它的栖息地顽玩地跑跑。\n彭布鲁威尔柯基以短而跳跃的步态快走。\n在示例中，我们在 `Zoo` 类中创建了一个 `animalMovement()` 方法，它可以接受任何\
  \ `Animal` 对象。它依赖多态来调用合适的 `move()` 方法。如果我们添加一种新的动物类型（例如 `Bird` 或 `Fish`），只要 `Bird`\
  \ 和 `Fish` 是 `Animal` 的子类并重写了 `move()` 方法，`animalMovement()` 方法就不需要更改。\n\n### 优势\n\
  \n在结束对多态和方法重写的介绍之际，让我们总结在程序中实现这些特性的三大优势：\n\n* **简化代码**：多态允许我们使用通用接口，使代码不那么臃肿，并且更容易阅读和维护。\n\
  * **代码重用性**：当我们编写可以被多个类使用的通用代码时，减少了代码重复。这使得我们的代码更具可读性且更容易维护。\n* **灵活性**：使用多态，我们可以在不修改现有代码的情况下引入新的子类。这是面向对象编程（OOP）原则的共同主题。\n\
  ## 访问修饰符与封装\n\n封装是核心 OOP 原则，使我们能够编写 Java 程序来保护数据不受误用。在 Java 中，我们使用如 `private` 和\
  \ `protected` 等访问修饰符来设置类、属性和方法的访问权限。通过封装，我们可以限制代码某些部分与其他部分交互的方式。这使得代码是安全、模块化且易于维护的。\n\
  \n在 Java 中，我们通过访问修饰符来实现封装。这些修饰符控制类及其组件（属性和方法）可以从哪里被访问。默认被称为“包私有”（package-private），它强制在没有显式访问修饰符的情况下，实体仅在同一个包内可访问。让我们检查主要的访问修饰符：\n\
  \n* `public` 访问修饰符限制最小。声明为 `public` 的组件可以从任何其他类访问。\n* `private` 访问修饰符是限制最严格的修饰符。声明为\
  \ `private` 的组件仅在定义的类内部可访问。\n* `protected` 访问修饰符允许组件在同一个包内以及子类中访问，即使它们在不同的包中。\n\
  这些修饰符中的每一个在封装中都起着关键作用。在下一节中，我们将实践封装，重点关注 `private` 访问修饰符。\n\n### Private\n\n我们实现封装的主要方法是将类属性设为\
  \ `private`。这限制了从类外部的直接访问。当我们编写类时，可以包含 `public` 的 getter 和 setter 方法，为类的属性提供受控的访问。这是\
  \ OOP 的一个重要方面，因为它允许我们保护任何对象的内部状态，只暴露必要的信息。它允许在任何属性值更改之前进行数据验证。\n\n让我们看看 `Animal2`\
  \ 和 `Canine2` 类中的封装。我们正在使用新类，因此原始类与上一节保持不变。以下是 `Animal2` 类：\n\n```java\n    // 私有属性（封装）\n\
  \    private String habitat;\n    private double weight;\n\n    // 构造函数\n    public\
  \ Animal2(String scientificName, String habitat, double weight) {\n        super(scientificName);\n\
  \        this.habitat = habitat;\n        this.weight = weight;\n\n    // habitat\
  \ 的 getter 和 setter\n    public String getHabitat() {\n        return habitat;\n\
  \    }\n\n    public void setHabitat(String habitat) {\n        this.habitat = habitat;\n\
  \    }\n    // weight 的 getter 和 setter\n    public double getWeight() {\n     \
  \   return weight;\n    }\n\n    public void setWeight(double weight) {\n      \
  \  if (weight > 0) { // 简单验证\n            this.weight = weight;\n        }\n}\n\
  ```\n*(注：由于提供的示例代码块逻辑与描述略有出入，翻译时保持了代码逻辑的完整性，并对注释进行了翻译)*\n\n我们通过将 `habitat` 和 `weight`\
  \ 属性声明为 `private` 在 `Animal2` 类中实现了封装。这防止了从类外部直接访问。通过 getter 和 setter 方法提供了受控的访问。我们在\
  \ `setWeight()` 方法中实现了一个简单的验证。\n\n接下来，我们将创建一个 `Dog2` 类来演示子类中的属性封装。以下是代码：\n\n```java\n\
  \    private String breed;\n\n    public Dog2(String scientificName, String habitat,\
  \ double weight, String breed) {\n        super(scientificName, habitat, weight);\n\
  \        this.breed = breed;\n    }\n\n    // breed 的 getter 和 setter\n    public\
  \ String getBreed() {\n    }\n\n    public void setBreed(String breed) {\n     \
  \   this.breed = breed;\n    }\n}\n```\n\n我们的 `Dog2` 类包含一个具有 `private` 访问修饰符的 `breed`\
  \ 属性。这意味着可以通过它的 getter 和 setter 方法访问。这种封装保护属性不受外部意外修改。\n### Protected\n\n我们现在转向\
  \ `protected` 访问修饰符。它允许属性和方法在同一个包内以及子类中访问，无论它们是否在同一个包中。\n\n| 注意：Java 中的包就像计算机上的文件文件夹。将相关的类和子类放在一起是一种聪明的组织方式。\
  \ |\n\n`protected` 访问修饰符在继承时 特为重要，因为子类需要访问父类的某些属性和方法。下面的 `Bird2` 类继承自 `Animal2`：\n\
  \n```java\n    protected String featherColor;\n\n    public Bird2(String scientificName,\
  \ String habitat, double weight, String featherColor) {\n        super(scientificName,\
  \ habitat, weight);\n        this.featherColor = featherColor;\n    }\n\n    public\
  \ void fly() {\n        System.out.println(\"The bird flies through the \" + getHabitat());\n\
  }\n```\n\n\n\n\n`Bird2` 类有一个单一属性 `featherColor`，它被标记为受保护（protected）。这意味着它可以被 `Bird2`\
  \ 的任何子类或同一包中的其他类访问。`fly()` 方法使用了 `Animal2` 类中的公共 getter 方法 `getHabitat()`。正如我们的示例所示，`protected`\
  \ 修饰符是继承与访问控制之间的完美平衡。\n\n### 完整实现\n让我们创建一个 `Zoo2` ，演示访问修饰符在程序中是如何交互的。我们将使用 `Animal2`、`Dog2`\
  \ 和 `Bird2` 类。首先，我们需要在 `Animal2` 类中添加一个 `move()` 方法。以下是代码：\n\n```java\n// Method\n\
  public void move() {\n    System.out.println(\"The animal moves appropriately in\
  \ its habitat.\");\n}\n```\n\n\n```java\npublic class Zoo2 {\n    public static\
  \ void main(String[] args) {\n        // Creating instances\n        Animal2 genericAnimal\
  \ = new Animal2(\"Canis lupus\", \"Forests\", 70.5);\n        Dog2 dog = new Dog2(\"\
  Canis lupus familiaris\", \"Domestic\", 12.5, \"Labrador\");\n        Bird2 bird\
  \ = new Bird2(\"Corvus corax\", \"Mountains\", 1.2, \"Black\");\n\n        System.out.println(\"\
  Animal habitat: \" + genericAnimal.getHabitat());\n        System.out.println(\"\
  Dog breed: \" + dog.getBreed());\n        System.out.println(\"Bird feather color:\
  \ \" + bird.featherColor); // Allowed because of protected access\n\n        //\
  \ Modifying attributes through public setters\n        genericAnimal.setWeight(75.0);\n\
  \        System.out.println(\"Updated weight: \" + genericAnimal.getWeight());\n\
  \n        // Attempting direct access to private attribute (will result in an error\
  \ if uncommented)\n\n        // Calling public methods\n        dog.move();\n  \
  \      bird.fly();\n    }\n}\n```\n\n`Zoo2` 类的输出如下：\n```\nAnimal habitat: Forests\n\
  Dog breed: Labrador\nBird feather color: Black\nUpdated weight: 75.0\nThe animal\
  \ moves appropriately in its habitat.\nThe bird flies through the Mountains\n```\n\
  \n\n## 结论\n\n在本章结束时，我们探索了 OOP 的基础以及如何在 Java 中实现它们。OOP 的四个核心原则（抽象、封装、继承和多态）已已通过解释和代码示例进行了介绍。你有机会学习了这些原则如何帮助我们编写高度结构化、模块化、可重用、可读且可维护的代码。\n\
  \n本章还研究了如何定义和使用类与对象，这为我们构建复杂程序奠定了框架。详细介绍了构造函数和构造函数重载，强调了如何创建和初始化对象。章节探索了继承，并演示了如何通过层次类关系和\
  \ `super` 关键字来实现代码重用。多态和方法重写展示了 Java 的灵活性，允许相同的方法根据调用对象的类表现出不同的行为。最后，本章演示了如何使用封装以及如\
  \ `private`、`protected` 和 `public` 等访问修饰符来创建安全、组织良好的代码。\n\n在下一章 第 4 章 高级 OOP 概念中，将在\
  \ OOP 基础的基础上探索接口和抽象类等高级主题。正如你所学到的，它们为我们的 Java 应用提供了极大的灵性和扩展性。该章将演示如何使用接口实现多继承，并探索函数式接口以及默认方法。其他高级主题包括用于简化函数式编程的\
  \ lambdas 和方法引用。\n\n\n- 访问修饰符控制类、属性和方法的可见性和可访问性。\n- 抽象隐藏了类实现的复杂性，只暴露对象功能的必要部分。\n\
  - 对象是使用 `new` 关键字创建的类的实例。\n- 类层次结构代表了现实世界的关系，并允许组织、可重用的代码结构。\n- 构造函数重载允许具有不同参数列表的多个构造函数，为初始化对象提供了灵活性。\n\
  - 构造函数是用于初始化新对象的特殊方法，建立它们的初始属性值。\n- 动态方法分发允许 Java 在运行时根据对象的类型选择合适的重写方法。\n- 封装将数据和方法打包在类中并限制对类属性的访问，确保数据完整性。\n\
  - 继承允许类从父类继承属性和方法，促进代码重用。\n- 方法重写允许子类对其超父类中存在的方法提供特定的实现。\n- 从同一类创建的对象是唯一的，每个对象占用自己的内存空间并持有自己的属性值。\n\
  - 多态允许不同类的对象被视为共同超父类的实例。\n- `private` 访问将成员限制在同一个类中，确保它们在类外部无法访问。\n- `protected`\
  \ 访问允许在同一个包内以及通过子类访问，即使它们在不同的包中。\n- `public` 访问允许从任何其他类访问成员，为对象交互创建清晰的接口。\n- Setter\
  \ 方法允许对私有属性进行控制修改，通常包含验证以确保数据完整性。\n- `super` 关键字允许子类调用其父类的构造函数并访问其方法。\n\n## 案例研究\n\
  \n这些案例提供了真实的场景，鼓励你批判性地思考如何在各种语境下应用封装、访问控制、继承和多态等 OOP 原则。\n\n关键案例提供如下：\n\n- 敏感数据的访问管理：StarTech\
  \ Solutions 是一家软件开发公司，构建用于管理云环境中数据安全的应用程序。他们的团队开始使用 OOP 创建安全且可扩展的客户端应用程序。首席开发人员设计了一个基础类层次结构，包括\
  \ `User`、`Admin` 和 `SuperAdmin` 类，这些类继承自基础 `Person` 类。然而，随着项目的演进，团队在管理层访问敏感数据方面遇到了困难。他们需要确定最佳的访问修饰符和封装策略来保护用户信息。\n\
  - 供你考虑：团队如何使用 `private`、`protected` 和 `public` 访问修饰符来封装敏感的用户信息，同时允许不同角色进行适当访问？如果他们实现\
  \ getter 和 setter 方法来控制对关键数据的访问，可能会获得哪些潜在收益？\n\n\n\n\n\n- 供考虑：使用构造函数重载来初始化带有和不带折扣信息的的产品有哪些优势？团队如何有效使用\
  \ `super` 关键字来初始化 `DiscountedProduct` 子类中的属性，同时避免重复来自 `Product` 类的代码？\n\n- 多态性的必要性：Hyperion\
  \ Robotics 专门为用于太空探索的自主机器人构建软件。他们开发了一个 `Entity` 类作为所有机器人的基类，并此继承了 `Rover`（漫游者）、`Drone`（无人机）和\
  \ `Orbiter`（轨道器）等子类。每种机器人类型都有独特的能力：漫游者在崎岖的地形上导航，无人机飞行，轨道器监测大气。工程团队在 `Entity` 类中实现了\
  \ `move()` 方法，并利用多态允许每个子类定义特定的移动行为。然而，他们在有效管理不同移动类型的方法重写方面遇到了困难，因为每个子类都需要高度定制的行为。\n\
  \n\n- 封装与受控访问之间的平衡：Celestial Insights 提供占星数据分析，并最近启动了一个新项目，创建一个面向客户的定制化星盘预测平台。该平台包含\
  \ `Customer`、`Subscription` 和 `Prediction` 等类。为了确保客户数据安全，团队对 `Customer` 类中的所有敏感信息都实施了\
  \ `private` 访问修饰符。然而，他们需要允许 `Subscription` 类出于账单目的访问特定的客户详情。团队正在考虑不同的方法来平衡封装与受控的数据访问。\n\
  \n    - 供考虑：团队如何利用 getter 方法（get 方法）为 `Subscription` 类对私有客户数据提供受控访问？开发团队还可以探索哪些替代方案（例如使用\
  \ `protected` 修饰符或扩展 `Customer` 类）来管理相关类之间的访问权限？\n\n- 维护数据隐私：Orion Genomics 正在构建一个用于存储和分析医学研究基因数据的应用程序。开发团队实现了一个带有\
  \ `Sample`、`DNASequence` 和 `Gene` 类的 OOP 结构。每个 `Sample` 对象都包含敏感的患者数据，需要通过 `private`\
  \ 访问修饰符进行严格的数据保护。继承自 `Sample` 的 `DNASequence` 类需要访问非敏感样本信息进行分析。开发团队希望有效利用封装和继承来维护数据隐私，同时为分析提供适当的访问。\n\
  \n    - 供考虑：开发团队如何使用带有 `private` 和 `protected` 修饰符的封装来控制对 `Sample` 中敏感患者数据的访问，同时允许\
  \ `DNASequence` 必要的访问？在 `Sample` 类中为非敏感数据创建 getter 和 setter 方法（set 方法）有哪些优势？它们将如何在跨子类之间强制执行数据隐私？\n\
  \n\n1. 哪种访问修饰符允许成员仅在同一个类内可访问？\n    1. Public（公共）\n    2. Private（私有）\n    3. Protected（受保护）\n\
