  \ 的 JavaFX 设置测试窗口\n\n### 下一步工作和 PFT\n\n随着 JavaFX 的运行，我们可以开始构建我们的 PFT 应用程序。我们将在本章的剩余部分中逐步完成此工作，实现以下目标：\n\
  \n*   设计应用程序布局。\n*   创建 UI 组件。\n*   实现事件处理。\n*   使用属性绑定（property binding）和可观察对象（observables）。在本章结束时，我们的\
  \ PFT 应用程序应该是功能完整的，其 GUI 允许用户：\n\n*   输入交易\n*   查看摘要\n*   与财务数据进行交互\n\n## 理解场景图（scene\
  \ graph）\n\n场景图是 JavaFX UI 框架的重要部分；它组织了我们应用程序中的图形元素（节点）。每个 UI 组件（例如按钮、标签、图像等）都是一个带有属性的节点。场景图为我们提供了为交互式界面实现布局和事件处理的能力。\n\
  \n如图 11.4 所示，场景图是 JavaFX 层次结构的一部分，并且是阶段（stage）的子节点。场景（Scenes）是将 UI 组件（节点）组合在一起的内容区域。\n\
  \n图 11.4 显示了一个垂直框（`VBox`）作为根节点，它包含一个标签、用户名和密码的输入框以及一个登录按钮：\n\n![一个流程图显示了 JavaFX\
  \ GUI 层级结构：Stage（主屏幕）到 Scene，然后到 VBox（根节点），它包含一个 Label（Welcome to PFT）、TextField（用户名输入）、PasswordField（登录）和\
  \ Button（登录）。 ](img/Figure_11.4.png)\n\n图 11.4：登录界面的 JavaFX 示例结构\n\n本节将在我们构建 PFT\
  \ 应用程序的过程中，探索场景图及其组件。\n\n### 核心组件\n\n在深入讨论场景之前，让我们先看看阶段（stage）。阶段代表我们应用程序的窗口，处于\
  \ JavaFX 层次结构的顶端。我们应用程序的主窗口被称为主阶段（primary stage）。我们也可以添加额外的阶段用于用于弹出窗口/模态窗口。\n\n\
  每个阶段一次只能包含一个活跃的场景。场景是 UI 容器，作为阶段与单个 UI 组件之间的桥梁。我们可以根据需要动态切换场景。\n\n节点（Nodes）是场景图中的\
  \ UI 组件。节点的三个主要类别在表 11.1 中解释：\n\n| 类别 | 类型 | 示例 |\n| :--- | :--- | :--- |\n| 父节点\
  \ | 布局管理器和容器 | 水平框（`HBox`）、`VBox`、`GridPane` 等 |\n| 叶子节点 | 基础 UI 元素 | 按钮、标签、图像等\
  \ |\n| 形状节点 | 图形 | 圆形、折线、矩形 |\n\n表 11.1：JavaFX 节点分类及示例\n\n节点具有高度的可定制性，并拥有大量属性，包括位置、大小、样式和事件处理。\n\
  \n### 设置 PFT 阶段和场景\n\n让我们为我们的 PFT 桌面应用程序设置阶段和场景。首先，我们需要按照所示更新 `launch.json` 文件：\n\
