  \n## 结论\n\n本章探索了 Java `Streams API` 的强大以及函数式编程特性，这些特性帮助我们高效地处理和操作数据集合。确定了这些结构使我们能够创建简洁且声明式的代码，使其具有可读性和可维护性，特别适用于复杂的数据操作。文中关注了流的基础知识、操作类型及其优势（包括不可变性和并行性）。还涵盖了中间操作和终端操作，展示了如何转换和聚合数据。此外，还探索了函数式接口和\
  \ Lambda 表达式，展示了如何为各种任务定义清晰、可重用的逻辑。本章还研究了用于并发数据处理的并行流，以及作为安全处理空值解决方案的 `Optional`\
  \ 类。\n\n本章使用一个虚拟的 `SocialSense` 应用作为贯示例。这有助于演示本章概念在现实世界中的应用。我们的示例包括过滤活跃用户、生成报告以及处理大规模数据处理任务。\n\
  \n下一章将重点关注 I/O，特别是文件处理。该章节解释了为什么文件处理对许多 Java 应用至关重要，并介绍了 Java 的 `I/O` 系统。章节介绍了如何使用\
  \ `java.nio` 包读写文件，并探索了处理字符和字节数据的流。还涵盖了从文件中存储和检索对象的序列化与反序列化。引入了缓冲流和数据流以优化性能，提供了在\
  \ Java 应用中高效安全管理文件所需的技能。\n\n## 重点回顾\n\n* Lambda 表达式是一个简短的代码块，可以作为参数传递以执行特定操作。\n\
  * `Optional` 是一个容器对象，可能包含也可能不包含值，降低了 `NullPointerException` 的风险。\n* 可以使用 `Optional.of(value)`、`Optional.ofNullable(value)`\
  \ 或 `Optional.empty()` 等方法创建 `Optional` 对象。\n* 在集合上调用 `parallelStream()` 通过将数据源拆分为多个块（每个块在单独线程中处理）来启用并行处理。\n\
  * 在流中链式调用中间操作（如 `filter()`、`map()` 和 `sorted()`）允许灵活高效的数据转换。\n* 常见的函数式接口包括 `Predicate`、`Consumer`、`Function`、`Supplier`\
  \ 和 `BiFunction`，它们在函数式编程中都有不同的用途。\n* 函数式接口设计用于与 Lambda 表达式和方法引用无缝协作。\n* 流中的中间操作（如\
  \ `filter()` 和 `map()`）是惰惰的，在调用终端操作之前不会执行。\n* Java 的 `Streams API` 使我们能够以函数式和声明式的方式处理数据集合。\n\
  * 方法引用（如 `UserActivity::getUsername`）为编写调用单个方法的 Lambda 提供了简写形式。\n* 使用 `Optional`\
  \ 类可以优雅地处理空值，它提供了 `orElse()`、`orElseGet()` 和 `orElseThrow()` 等方法来处理缺失值。\n* 并行流最适用于大型数据集上的\
  \ CPU 密集型操作，但对较小数据集可能会引入开销。\n* 并行流利用 `fork/join` 框架进行线程管理和负载均衡。\n* 流流水由源、中间操作和终端操作组成。\n\
  * 流不存储数据；它们在数组或集合等数据源上操作。\n* 终端操作（如 `collect()`、`forEach()` 和 `reduce()`）会消耗流并触发中间操作的执行。\n\
  * `forEachOrdered()` 方法可以维护并行流中元素的顺序。\n* `map()` 方法转换流中的元素，而 `flatMap()` 将嵌套结构展平为单一流。\n\
  * `Optional.ifPresentOrElse()` 方法提供了一种同时处理值存在和不存在的方法。\n* 通过确保操作不修改数据源来促进不可变性。\n\
  * 在 `filter()` 中使用 `Predicate` 允许根据条件过滤流元素。\n* 使用 `Streams API` 可以为数据处理任务生成简洁、丰富且具读性的代码。\n\
