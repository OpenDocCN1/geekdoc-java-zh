  \n\n在本章中，我们将探索每个 Java 程序员必须掌握的基础概念。我们将首先查看在程序中存储和处理数据所需的数据类型和变量。接下来，我们将涵盖运算符，以便我们能够在程序中实现逻辑并执行计算。控制结构用于实现重复逻辑和逻辑判断，因此我们将探索它们，以确保你熟练掌握它们的实现。本章将以方法部分结束，方法是组织代码、实现模块化以及创建可读、可重用且易于维护的代码的关键元素。本章是接下来的两章的先决条件，后两章将深入介绍面向对象编程\
  \ (OOP)。\n\n## 结构\n\n本章涵盖了以下主题：\n\n- 运算符\n- 控制结构\n- 方法\n\n## 目标\n\n在本章结束时，我们将理解\
  \ Java 中数据类型的区别和用途。我们将在 Java 程序中定义并使用变量，并使用 Java 运算符进行计算和逻辑操作。此外，我们使用使用控制结构来实现重复逻辑，以及用于流程控制的控制结构。此外，我们将编写具有适当参数、返回类型和作用域的可重用方法。\n\
  ## 数据类型和变量\n\n每个 Java 程序都会使用从简单的屏幕文本标签到大型数据库的各种数据。无论程序大小如何，你都需要完全理解数据类型（不同类型的数据）和变量。这一部分旨在帮助你理解并熟悉在变量中使用数据类型。我们将从变量开始，然后探索数据类型。这一部分还涵盖了变量的作用域。\n\
  \n### 变量\n\n变量是用于存储数据的命名的内存位置。我们不需要知道某项内容存储在内存的什么种位置，而是使用变量作为引用。例如，我们可以创建一个名为 `quantity`\
  \ 的变量来存储电子商务系统中的物品数量。变量的值可以改变。要创建此变量，我们只需要标识它的数据类型和名称：\n\nint quantity;\n```\n\n\
  在前面的代码行代码中，`int` 指整数（integer），一个全数字，而 `quantity` 是变量名。在深入研究数据类型之前，让我们探索如何结合 Java\
  \ 的规则、行业规范和最佳实践来为我们的变量命名。\n\n### 变量命名命名规范\n\n\n- 它不能以数字开头；必须以字母、`$` 或 `_` 字符开头。\n\
  - 它不能包含空格。\n- 它不能是 Java 关键字（例如 `int`、`else` 等）。\n\n注意：大小写敏感！例如，`Beehive`、`BeeHive`\
  \ 和 `beehive` 是三个明显不同的变量名。\n\n上述是 Java 不允许你违反的规则。以下列表包含了基于行业规范和最佳实践的指南。这些规范和最佳实践有助于使你的代码具有可读性和可维护性。\n\
  - 变量名应该是自解释描述的，例如 `gradePointAverage` 或 `cartPreTaxTotal`。\n- 不要在变量名中使用 `$`。\n-\
  \ 不要以下划线字符开头你的变量名。\n- 避免使用单字母变量名，除非是用于循环和其他区域通常使用的临时丢弃性名称。\n- 你可以创建自己的变量命名方案。无论你做什么，请在整个应用程序中保持一致。\n\
  \n\n\n\n\n使用 `camelCase`（驼峰命名法），第一个单词以小字母开头，第二个及后续单词以大写字母开头。例如，`itemQuantity` 和\
  \ `myAccountBalance` 正确地实现了 `camelCase`。\n\n| 注意：`camelCase` 用于变量，而 `PascalCase`\
  \ 用于类名。这有助于识别类和变量。 |\n\n## 常量\n\n常量是一种特殊的变量，其值在赋值后无法被更改。我们使用 `final` 关键字将变量指定为常量，如下所示：\n\
  ```java\nfinal double TN_SALES_TAX = 0.975;\n```\n\n按照惯例，常量应该是自描述的、全大写的，并且每个单词之间有下划线。Java\
  \ 并不强制执行这一点，但遵循命名规范将有助于提高代码的可读性和可维护性。这使得故障故障也变得简单得多。\n\n## 数据类型\n\n\n### 基本数据类型\n\
  \n名为 primitive 的数据类型是持有简单值且不是对象的类型。表 2.1 列出了基本数据类型及其示例：\n\n| 数据类型 | 描述 | 示例 |\n\
  | :--- | :--- | :--- |\n| Byte | 8 位整数 | 100 |\n| Int | 32 位整数 | 5000 |\n| Long\
  \ | 64 位整数 | 100000L |\n| float | 单精度小数 | 31.9 |\n| double | 双精度小数 | 24.99 |\n|\
  \ char | 单个字符 | ‘E’ |\n| boolean | 真或假 | true |\n\n表 2.1：基本数据类型\n最常用的基本数据类型是用于整数的\
  \ `int`、用于带小数数字的 `float`、用于单个字母或字符的 `char` 以及 `boolean`。\n\n### 引用数据类型\n\n引用数据类型是指对象的类型。这些对象可以包括字符串、类、接口和数组。对象可以包含多个值。例如，一个数字数组可能包含一组数字，而字符串可能包含密码、名称、短语甚至一整本书。\n\
  \n## 变量声明\n\n\n```java\nint room;\n```\n\n我们也可以在变量声明过程中赋值。下一行代码结合了声明和赋值：\n\n```java\n\
  ```\n\n这里是变量声明和赋值的另外两个示例：\n\n```java\nString name = “Neo Anderson”\nint roomNumber\
  \ = 319;\n```\n\n我们可以在程序执行期间为变量分配新值。例如，我们创建一个 `int` 变量并分配初始值 8，然后将其更改为 24，如下代码所示：\n\
  ```java\nint jerseyNumber = 8;\njerseyNumber = 24;\n```\n\n如你所看到的，在变量声明后，我们不再需要提供数据类型；Java\
  \ 会记住。\n\n## 变量作用域\n\n\n### 局部变量\n\n局部变量的使用限制在定义它的方法或代码块中。\n\n让我们两个例子。例如，下面的 `dogBreed`\
  \ 变量是一个 `String`，并且仅在定义的 `main()` 方法内可访问，其定义如下：\n\n```java\npublic class Local {\n\
  \    public static void main(String[] args) {\n        System.out.println(dogBreed);\n\
  \    }\n}\n```\n\n### 实例变量\n\n实例变量是在类内部方法外部声明的。这使得它们在整个类中都是可的。我们通常在这里定义对象的属性。如下代码所示，我们在\
  \ `Instance` 类内部、任何方法之外声明了 `dogBreed` 实例变量：\n\n```java\npublic class Instance {\n\
  \    public void corgiType() {\n        System.out.println(dogBreed);\n    }\n \
  \   public void main(String[] args) {\n        corgiType();\n    }\n}\n```\n这个示例允许我们在类中的任何地方使用\
  \ `dogBreed` 变量。\n\n### 类变量\n\n第三种变量是类变量，也称为静态变量。这些变量使用 Java 的 `static` 关键字定义。这确保了变量在类的所有实例（副本）之间共享。这里有一个示例：\n\
  \n```java\npublic class ClassVariable {\n    public static void corgiType() {\n\
  \        System.out.println(dogBreed);\n    }\n    public static void main(String[]\
  \ args) {\n        corgiType();\n    }\n}\n```\n我们将在第 3 章 面向对象基础探索类实例。\n\n## 类型转换\n\
  \n虽然每个变量只能有一种数据类型，但 Java 允许我们从一种类型转换为另一种类型。这被称为类型转换。我们可以从宽到窄（隐式转换）或窄到宽（显式转换）。让我们来看一下。\n\
  \n### 隐式转换\n\n\n在下面的示例中，我们将 `int` 变量转换为 `double`，然后将 `double` 变量转换为 `float`：\n\n\
  ```java\nint num = 33;\ndouble converted = num;\nfloat convertedDouble = converted;\n\
  ```\n### 显式转换\n\n与隐式转换不同，显式转换要求我们从较大的数据类型转换为较小的类型。由于可能会丢失数据，Java 强制我们显式地进行这种转换。\n\
  \n在下面的示例中，我们将 `double` 转换为 `int`。由于是整数，任何小数都会丢失。\n\n```java\ndouble price = 31.99;\n\
  ```\n\n如所示，我们在语句中添加了 `(int)`，这与你在隐式转换中看到的不同。\n\n| 注意：当显式转换涉及将小数变量转换为整数时，小数部分会被截断，而不是四舍五入。\
  \ |\n\n### 整数与字符串之间的转换\n\n\n第一个示例使用 `String.valueOf()` 方法将 `int` 转换为 `String`：\n\
  \n```java\nint jerseyNumber = 24;\nString strJerseyNbr = String.valueOf(jerseyNumber);\n\
  System.out.println(\"The jersey number is: \" + strJerseyNbr);\n```\n下面的示例使用 `Integer.toString()`\
  \ 方法从 `int` 转换为 `String`：\n\n```java\nint jerseyNumber = 24;\nString strJerseyNbr\
  \ = Integer.toString(jerseyNumber);\nSystem.out.println(\"The jersey number is:\
  \ \" + strJerseyNbr);\n```\n\n\n```java\nint jerseyNumber = 24;\nString strJerseyNbr\
  \ = jerseyNumber + \"\";\nSystem.out.println(\"The jersey number is: \" + strJerseyNbr);\n\
  ```\n\n\n\n注意：将 `int` 转换为 `String` 是常见的，例如当我们需要将数字作为图形用户界面的一部分或拼接输出消息时。\n\n接下来，我们将看到如何将\
  \ `String` 转换为 `int`。在下面的示例中，使用 `Integer.parseInt()` 方法：\n\n```\nString strPhoneNumber\
  \ = “3125550690”;\nint phoneNumber = Integer.parseInt(strPhoneNumber);\n\n在我们的最后一个示例中，我们使用\
  \ `Integer.valueOf()` 方法将 `String` 转换为 `int`：\n\n```java\nString strPhoneNumber\
  \ = “3125550690”;\nint phoneNumber = Integer.valueOf(strPhoneNumber);\n```\n\n\n\
  # 运算符\n\nJava 包含了特殊的符号，我们可以用这些符号对变量进行操作，改变它们的值。这些符号被称为运算符，并且在几乎所有现代编程语言中通用的。本节涵盖了七种运算符。对于每个运算符，我们将介绍它们是什么、为什么要使用它们，并回顾一个代码示例。\n\
  \n## 算术运算符\n\n算术运算符用于数学运算，并限于加、减、乘、除。更高级的数学运算符需要使用 Java 的 `Math` 类。\n\n\n| 运算符 |\
  \ 描述 |\n| :--- | :--- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模（余数）\
  \ |\n表 2.2：算术运算符\n\n让我们在代码中使用每一个运算符：\n\n```java\nint nbrA = 3;\nint nbrB = 19;\n\
  int sum = nbrA + nbrB; // 结果为 22\nint product = nbrA * nbrB; // 结果为 57\nint quotient\
  \ = nbrB / nbrA; // 结果为 6\nint remainder = nbrB / nbrA; // 结果为 1\n```\n\n注意：当除两个整数时，结果将始终是一个整数。如果你希望结果具有更高的精度，等式中使用的值之一应该是\
  \ `double` 或 `float`。\n\n## 赋值运算符\n\n\nJava 还包含复合运算符；这些是带有两个符号的运算符，如 [表 2.3] 所示：\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| = | 简单赋值 |\n| += | 加并赋值 |\n| -= | 减并赋值 |\n| /=\
  \ | 除并赋值 |\n| %= | 取模并赋值 |\n\n表 2.3：赋值运算符\n\n下面的示例展示了复合运算符如何工作。它们本质上是快捷方式，可以产生更简洁、更具读性的代码：\n\
  \n```java\nint nbr += 8;\n```\n\n该示例首先使用赋值运算符将值 24 赋值给变量 `nbr`。然后，我们使用 `+=` 复合运算符，在这种情况下，它等于\
  \ `nbr = nbr + 8`。\n\n## 位运算符\n\n位运算符不那么常见，但理解它们很重要。它们用于对整数数据的每个位进行操作。这使我们对数据拥有有限的控制。位运算符最常用的用途之一是我们需要软件与系统硬件交互时。\n\
  \n\n| 运算符 | 描述 |\n| :--- | :--- |\n| & | 位与 |\n| | | 位或 |\n| ^ | 位异或 |\n| ~ | 位取反（非）\
  \ |\n| << | 左移 |\n| >> | 右移 |\n\n表 2.4 位运算符\n\n例如，如果使用使用 `5 & 3` 比较 5 和 3，结果是 1。这是因为\
  \ `0101 & 0011 = 0001`。\n\n| 注意：位运算符的使用可能会令人困惑。我们在书中不再再次使用它们，因为它们比其他运算符不常见。 |\n\n\
  ## 逻辑运算符\n\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| && | 逻辑与 |\n| | | 逻辑或 |\n| ! | 逻辑非\
  \ |\n\n表 2.5：逻辑运算符\n\n\n```java\npublic class LogicalOperatorExample {\n    public\
  \ static void main(String[] args) {\n        boolean isRainy = true;\n        boolean\
  \ isWeekend = false;\n        boolean isHoliday = true;\n        // 逻辑与 (&&) - 两个条件都为真\n\
  \        if (isRainy && isWeekend) {\n        }\n        // 逻辑或 (||) - 至少有一个条件为真\n\
  \        if (isWeekend || isHoliday) {\n            System.out.println(\"It is a\
  \ weekend or a holiday.\");\n        }\n        // 逻辑非 (!) - 对条件取反\n        if (!isRainy)\
  \ {\n            System.out.println(\"It is not rainy.\");\n        }\n}\n```\n\n\
  \ 关系运算符\n\n关系运算符用于比较两个值。结果为真或假。[表 2.6] 显示了关系运算符：\n\n| 运算符 | 描述 |\n| :--- | :---\
