  \n图 11.8：带有输入字段和按钮的更新后的 PFT 应用窗口\n\n### 事件处理\n\n事件处理是我们设计 JavaFX 应用的方式，使其响应用户的操作，例如下拉菜单、点击按钮、输入文本等。事件处理是事件驱动模型。我们现在的任务是处理事件，特别是点击按钮时。需要采取以下步骤：\n\
  \n1.  在 `start()` 方法中，在 `// 创建场景` 下方添加 `GridPane` 之后，替换 `// BorderPane - Center`\
