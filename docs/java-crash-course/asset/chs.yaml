  \n## 自我评估\n\n提供以下问题以便你对本章节内容的掌握情况进行自评估，并将批判性思维应用于核心概念：\n\n1. 在 Java 中，使用 `Thread`\
  \ 类和实现 `Runnable` 接口创建线程之间的主要区别是什么？\n2. `CountDownLatch` 工具类是如何工作的？在现实应用中你何时会使用它？请提供一个它大有益的实际场景。\n\
  3. 解释 `Executor` 框架如何帮助优化线程管理。与手动管理线程相比，使用线程池的内核优势是什么？\n4. 假设你正在开发一个文件处理系统，多个线程需要同时读取和更新同一个文件。你会使用什么同步技术来确保数据一致性？为什么？\n\
  5. 反思多线程应用程序中可能发生死锁的情况。你将如何使用 `tryLock()` 来防止死锁？请提供示例场景来支持你的答案。\n\n### 答案\n\n1.\
  \ 主要区别在于，当你使用 `Thread` 类时，你创建了一个自 `Thread` 的新类并重写了 `run()` 方法。这种方法将任务逻辑与线程管理结合，可能会产生局限性。另一方面，实现\
  \ `Runnable` 接口将任务逻辑与线程管理分离，提供了更大的灵活性，例如在扩展其他类的同时仍在线程上运行任务。为了更整洁的设计和更高的重用性，通常优选使用\
  \ `Runnable` 接口。\n2. `CountDownLatch` 工具类允许一个或多个线程等待其他线程中的一组操作完成。它的工作原理是从一个给定的数字递减，当计数器零时，所有等待的线程都会释放。一个实际场景是视频游戏的加载界面，它在游戏开始之前等待所有资源（纹理、声音、模型、关卡）完全加载。主线程可以等待计数器直到所有加载任务完成。\n\
  3. `Executor` 框架为管理线程池提供了一种抽象，允许我们提交任务而不必担心底层线程管理。使用线程池的关键优势包括：\n    1. 减少重复创建和销毁线程的开销。\n\
  \    2. 管理固定数量的线程以防止资源耗尽。\n    3. 简化任务调度和执行。\n4. 为了确保多线程访问同一文件处理系统中的数据一致性，可以使用 `synchronized`\
  \ 块或 `ReentrantLock`。`ReentrantLock` 对线程同步提供了更多控制，例如尝试带超时时间的获取锁（`tryLock()`）。通过对读取或写入文件的代码关键段加锁，你可以防止竞态条件，并确保一次只有一个线程修改文件，从而维护数据完整性。\n\
  5. 如果两个线程尝试以不同的顺序获取两个不同的锁，就会发生死锁。例如，线程 1 锁定了资源 A 并等待锁定资源 B，而线程 2 锁定了资源 B 并等待锁定资源\
  \ A。两个线程都会陷入无限期的等待中。使用带超时的 `tryLock()` 可以防止这种情况，因为它允许线程尝试获取锁，如果如果在规定时间内无法获取，则放弃。这样，线程就可以回退并重试，从而避免死锁局势。\n\
