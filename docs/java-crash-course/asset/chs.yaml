  \ Building {\n    default void addBathrooms() {\n        System.out.println(\"Adding\
  \ bathrooms to the building.\");\n    }\n}\n```\n\n4. 你如何使用函数式接口和 lambda 表达式在运行时动态地微建筑添加功能？提供一个简短的示例。\n\
  5. 如果一个类实现了多个具有相同签名方法的接口，该类应该如何处理歧义？写一个短示例来演示你的解决方案。\n\n### 答案\n\n1. 抽象类可以包含具体方法和抽象方法、实例变量以及构造函数。当密切相关的类共享行为时，它们是理想的选择。接口只能包含抽象方法（Java\
  \ 8 之前）或 `default/static` 方法（Java 8 及之后）。它们更适合定义不相关类可以实现的契约。当你想在相关类之间共享代码时，使用抽象类。当你想在不相关的类之间强制执行合约或启用多继承时，使用接口。\n\
  2. 下方的代码块：\n\n```java\npublic interface RoomFeatures {\n    void addLighting();\n\
  \    void addHeating();\n}\n\npublic class LivingRoom implements RoomFeatures {\n\
  \    @Override\n    public void addLighting() {\n        System.out.println(\"Adding\
  \ dimmable LED lighting.\");\n    }\n    @Override\n    public void addHeating()\
  \ {\n        System.out.println(\"Installing underfloor heating.\");\n    }\n}\n\
  ```\n\n3. `default` 关键字允许接口提供具体的的方法实现。这有助于确保在接口中添加新方法时的向后兼容性。在给出的示例中，`addBathrooms()`\
  \ 方法提供了一个默认实现，实现类可以继承或重写它。\n4. 函数式接口和 lambda 表达式简化了动态添加功能的实现。例如：\n\n```java\n@FunctionalInterface\n\
  public interface FeatureAdder {\n    void addFeature(String feature);\n}\n\npublic\
  \ class TinyBuilding {\n    public void applyFeature(FeatureAdder featureAdder,\
  \ String feature) {\n        featureAdder.addFeature(feature);\n    }\n}\n\npublic\
  \ static void main(String[] args) {\n    TinyBuilding building = new TinyBuilding();\n\
  \    building.applyFeature(feature -> System.out.println(\"Adding \" + feature),\
  \ \"solar panels\");\n}\n```\n\n这允许在不硬编码方法的情况下动态添加功能。\n5. 当实现多个具有相同签名方法的接口时，该类必须重写冲突的方法并提供自己的实现。\n\
  \n```java\npublic interface Residential {\n    default void describe() {\n     \
  \   System.out.println(\"This is a residential building.\");\n    }\n}\n\npublic\
  \ interface Commercial {\n    default void describe() {\n        System.out.println(\"\
  This is a commercial building.\");\n    }\n}\n\npublic class MixedUseBuilding implements\
  \ Residential, Commercial {\n    @Override\n    public void describe() {\n     \
  \   System.out.println(\"This is a mixed-use building.\");\n    }\n}\n```\n\n通过重写\
