  \ 应用程序中动态修改现有数据。\n\n## 自测\n\n提供以下问题用于自测你对章节内容的理解，并将批判性思维应用于关键概念：\n\n1. JavaFX 中场景图（scene\
  \ graph）的作用是什么？它是如何帮助组织 UI 组件的？\n2. 与手动对 UI 元素定位相比，JavaFX 布局管理器在哪些方面改进了应用程序的设计和可用性？\n\
  3. JavaFX 中的属性绑定（property binding）如何增强交互性？单向绑定和双向绑定有什么区别？\n4. 假设你正在开发一个 JavaFX 应用程序来跟踪员工工作时间而不是财务交易。如何修改\
  \ `PFT` 应用程序以适应这个新目的？\n5. 在 JavaFX 应用程序中实现数据持久化的优势和挑战是什么？你会如何决定将数据存储在文件中还是数据库中？\n\
  \n### 答案\n\n1. 场景图是定义 UI 组件（`nodes`）在 JavaFX 应用程序中排列和渲染方式的层级结构。它由 `stage`（主应用程序窗口）、`scene`（内容容器）和\
  \ `nodes`（如按钮、标签和布局等 UI 元素）组成。通过使用结构化的场景图，开发者可以有效地组织 UI 元素、应用变换并在应用程序内管理事件传播。\n\n\
  2. JavaFX 布局管理器（如 `VBox`、`HBox`、`BorderPane` 和 `GridPane`）允许开发者在不指定精确像素坐标的情况下动态定位\
  \ UI 组件。这确保了：\n    - UI 在调整窗口大小时能够正确调整。\n    - 元素间距均匀且对齐，提高了可用性。\n    - 应用程序支持不同的屏幕尺寸和分辨率，而无需手动调整。\n\
  \    - 使用布局管理器更容易创建响应式且看起来专业的 UI。\n\n3. 属性绑定将 UI 元素与底层数据同步，确保无需手动处理事件即可实现实时更新。\n\
  \n单向绑定和双向绑定的区别如下：\n1. 单向绑定意味着一个属性的变化会自动更新绑定的 UI 组件，但反之则不然（例如，当值变化时更新标签）。\n2. 双向绑定确保任一属性的更改都会更新另一个（例如，同步文本字段和标签，使它们都反映相同的值）。\n\
  \n4. 为了使 `PFT` 应用程序适应跟踪员工工作时间，需要进行几项更改：\n    - 输入字段不再是交易详情，而是允许用户输入员工姓名、签入签出时间和班次。\n\
  \    - 交易表将修改为存储和显示员工工作日志，包括总工作小时。\n    - `balance` 标签可以调整为显示日/周/月的总小时，而不是财务总额。\n\
  \    - 数据持久化功能可以扩展，以根据工作小时计算并保存工资估算。\n\n5. 数据持久化的优势如下：\n    - 防止应用程序关闭时数据丢失。\n \
  \   - 允许用户重新加载之前的交易或记录。\n    - 支持历史数据分析和报告。\n\n数据持久化的挑战如下：\n1. 管理文件完整性并防止数据损坏。\n\
  2. 处理重复交易或不完整的记录。\n3. 确保存储数据的安全性和适当的访问控制。\n\n在文件和数据库之间进行选择：\n1. 对于小型应用程序（如 `PFT`\
  \ 跟踪器），文件是一个更简单的选择，因为数据不需要复杂的查询。\n2. 对于需要高级过滤、排序、多用户访问和可扩展性的应用程序，数据库是更优的选择。\n\n\n\
  \n\n\n本章重点关注某些现代 Java 特性，这些特性可以帮助构建现代 Java 软件开发项目。这些特性包括 Project Jigsaw 的模块化系统、模式匹配、密封类以及虚拟线程。本章还探讨了\
  \ JDK 增强提案（`JEP`）`477`（隐式声明类和实例主方法）以及其他能够显著简化开发工作流和应用程序性能的增强。本章最后以一组利用现代 Java 特性的最佳实践作为结束。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n*   现代 Java 概述\n*   Project Jigsaw\n*   近期的 Java 增强\n*\
  \   Java 24，包括 `JEP` `477`\n*   最佳实践\n\n## 目标\n\n完成本章后，你应该能够使用 Project Jigsaw 实现模块化编程，使用模式匹配、使用密封类以及使用虚拟线程。你还应该掌握如何应用\
  \ `JEP` `477` 增强的知识，并能够应用使用现代 Java 特性的最佳实践。\n\n## 现代 Java 概述\n\nJava 无疑是今天最强大、健壮且最流行的编程语言之一。虽然排名可能随来源略有不同，但\
  \ Java 在流行度上始终与 Python 和 JavaScript/TypeScript 并列前三。当将流行度与健壮性和能力相结合时，Java 仍然与 Python\
  \ 以及 C++/C# 并列位名前三。\n\nJava 排名的持久性归于几个因素，包括它的适应性、平台无关性、向后兼容性和持续的发布周期。通过这些定期的发布，Java\
  \ 已经成为一种支持扩展性、高性能和模块化编程的健壮工具。近期的 Java 版本通过引入语法增强、优化技术等，提高了开发者的效率。Java 使我们能够编写简洁、可扩展且易于维护的代码。\n\
  \n在整个章节中，我们将引用一个真实的场景：烹饪订单与库存网络（`COIN`）系统。这是一个虚拟的企业级系统，用于管理成千上万个仓库、餐厅和商店的库存和订单交付。\n\
  \n### 发布周期\n\nOracle 在 2017 年引入了六个月一次的发布周期，让我们能够更早地接触新特性。表 12.1, HTTP Client API\
  \ | Java 19 | 虚拟线程（预览）和结构化并发（孵化器） |\n| Java 12 | switch 表达式（预览） | Java 20 | switch\
  \ 的模式匹配（预览） |\n| Java 13 | 文本块（预览） | Java 21 | LTS 和 Z 垃圾回收器 (ZGC) |\n| Java 14\
  \ | switch 表达式（标准版） | Java 22 | 外界函数与内存 (FFM) API |\n| Java 15 | 文本块（标准版）和密封类（预览）\
  \ | Java 23 | Project Loom（虚拟线程） |\n| Java 16 | `instanceof` 的模式匹配 | Java 24 | Project\
  \ Panama（外界函数接口） |\n\n表 12.1：带有重点/亮点的 Java 版本\n\n| 注意：本章未涵盖上述所有亮点条目。你可以自由地探索 Oracle\
  \ 的发布说明。 |\n\n如表 12.1 {}\n```\n\n## Project Jigsaw\n\nProject Jigsaw 在 Java 9 中引入了模块系统，使我们能够编写模块化的\
  \ Java 应用程序。在此之前，大型系统通常基于单体设计，这导致了安全风险、性能低下、紧耦合等问题。\n\n| 注意：单体设计是指作为单个代码库构建的软件架构。\
  \ |\n\n这种编程方法支持扩展性、安全维护性。我们的 `COIN` 系统是一个大型订单和库存平台，是模块化编程的绝佳案例。`COIN` 包含多个相互依赖的组件，例如仓库库存管理、订单处理、支付处理和物流协调。通过采用模块化架构，我们可以提高安全性并减少\
  \ `COIN` 的内存占用。这种采用也将使 `COIN` 的代码更具维护性。\n\n### 模块系统\n\nJava 模块系统帮助我们把代码组织成模块。`module`\
  \ 是一个独立的代码单元。这些模块独立于整个系统进行维护，使得我们的代码具有更强的维护性。\n\n所有模块具有以下特性：\n\n*   代码被封装了。\n* \
  \  代码仅暴露给所需的 API。\n*   显式声明依赖关系（使用 `requires` 指令）。\n\n这些特性提高了安全性，因为对内部组件的访问是限制的。应用程序启动时间也缩短了，因为我们只需要加载需要的模块。\n\
  \n\n\n\n\n我们创建的模块将包含一个声明，标识它们导出的包以及对其他模块的任何依赖。考虑到我们的 COIN 系统，采用模块化方法允许我们把系统组织成多个模块（参见表\
  \ 12.2）：\n\n| 模块 | 用途 |\n| :--- | :--- |\n| `com.coin.inventory` | 用于管理仓库库存水平 |\n\
  | `com.coin.orders` | 处理订单的生成和处理 |\n| `com.coin.payments` | 管理发票和支付 |\n| `com.coin.shipping`\
  \ | 处理物流，包括交付 |\n\n表 12.2：COIN 系统模块\n\n可以创建这些模块，使其保持内部实现隐藏，并仅暴露核心的 API。\n\n## 实现的优势\n\
  \n在 COIN 系统中实现模块化设计将在多个领域提供优势，包括整体系统的可维护性。每个模块都可以独立于其他模块进行更新、故障排除和其他维护。开发团队可以同时处理其中一个模块，而不影响其他模块。例如，我们可能有一个负责仓库库存系统的团队。他们可以更新\
  \ `com.coin.inventory` 模块，而无需修改 `com.coin.orders`。另一个例子是 `com.coin.payments` 可以替换为外部支付网关，而不影响\
  \ `com.coin.orders` 处理订单的方式。这种方法具有内在的可扩展性。\n\n安全性是使用模块化系统设计的另一个优势。安全性提高部分是因为每个模块只暴露必要的\
  \ API。这有助于防止对内部代码的非预期访问。模块化方法还通过封装和隐藏敏感实现来减少安全漏洞。这里展示的 `com.coin.payments` 模块示例仅暴露其支付\
  \ API，并向其他模块隐藏交易细节：\n\n```\nmodule com.coin.payments {\n  exports com.coin.payments.api;\n\
  }\n```\n\n模块化系统设计的第三个优势是我们的应用程序可以获得更快的加载速度。JVM 只加载启动所需的模块，这可以显著减少运行时开销。在我们的 COIN\
  \ 系统中，移动订单系统只需要订单处理和支付，因此 `com.coin.shipping` 模块在启动时不会加载。\n\nJava 的模块系统还允许我们可靠地管理依赖关系。我们使用\
  \ `requires` 语句来防止由隐藏依赖可能引起的任何冲突。例如，`com.coin.orders` 模块同时需要 `com.coin.inventory`\
  \ 和 `com.coin.payments`。下面的代码确保了如果没有这些依赖，`com.coin.orders` 将无法编译或运行。这将防止运行时错误：\n\
  \n```\nmodule com.coin.orders {\n  requires com.coin.inventory;\n  requires com.coin.payments;\n\
  }\n```\n\n## 使用模块\n\n创建模块我们需要识别它的依赖关系以及要导出/暴露的包。正如模块定义中所示，`com.coin.inventory` 仅暴露\
  \ API 包，并需要 `java.sql` 模块来访问数据库：\n\n```\nmodule com.coin.inventory {\n  exports\
  \ com.coin.inventory.api;\n  requires java.sql;\n}\n```\n\n每个模块都有自己的包层级结构。例如：\n\n\
  * `com.coin.inventory`:\n    * `module-info.java`\n    * `com/coin/inventory/api/InventoryService.java`\n\
  \    * `com/coin/inventory/internal/StockManager.java`\n\n在接下来的 `InventoryService`\
  \ 示例中，这是一个其他模块使用的暴露 API。如你所见，`InventoryService` 类位于 `com.coin.inventory.api` 包中。这使得其他模块可以访问它：\n\
  \n```java\npackage com.coin.inventory.api;\n\npublic class InventoryService {\n\
  \  public int checkStock(String productCode) {\n    // 实现在此处\n    return 100;\n\
  \  }\n}\n```\n\n如前所述，模块必须声明对其他模块的依赖关系，否则它们将无法使用暴露的 API。让我们来看 `com.coin.orders` 模块使用\
  \ `com.coin.inventory` 模块的示例。\n\n首先，我们使用 `requires` 语句声明 `com.coin.orders` 依赖于 `com.coin.inventory`\
  \ 模块以执行其操作：\n\n```\nmodule com.coin.orders {\n  requires com.coin.inventory;\n}\n\
  ```\n\n下面的部分类 `OrderProcessing` 演示了如何从订单模块访问库存：\n\n```java\nimport com.coin.inventory.api.InventoryService;\n\
  \npublic class OrderProcessor {\n  private InventoryService inventoryService = new\
  \ InventoryService();\n\n  public void processOrder(String productCode) {\n    if\
  \ (inventoryService.checkStock(productCode) > 0) {\n      System.out.println(\"\
  订单下单成功!\");\n    } else {\n      System.out.println(\"缺货!\");\n    }\n  }\n}\n```\n\
  \n## 最近 Java 增强\n\n正如我们所探索的，Java 的发布引入了新功能和增强，使我们能够编写易于阅读、安全、可维护、可扩展且性能良好的代码。本节探讨了模式匹配、密封类和虚拟线程，这是三项现代\
  \ Java 的重大增强。\n\n我们将继续使用 COIN 系统来演示这些特性。\n\n### 模式匹配\n\n模式匹配为我们提供了简化的语法来实现条件逻辑。它消除了对特定类型转换和\
  \ `instanceof` 检查的重复代码的需求。\n\n| 注意：模式匹配简化了条件逻辑并减少了样板代码。 |\n\n让我们进一步解释模式匹配。我们将回顾使用\
  \ `instanceof` 的模式匹配代码示例、结合 `switch` 的模式匹配，以及用于不可变数据的记录（records）。\n\n### 结合 instanceof\
  \ 的模式匹配\n\n在下面的代码块中，我们需要在 `instanceof` 检查后手动进行类型转换。在这里，我们进行 `instanceof` 检查，然后在第二行进行转换；这是冗余代码：\n\
  \n```java\nif (obj instanceof InventoryItem) {\n  InventoryItem item = (InventoryItem)\
  \ obj;\n  System.out.println(\"Product: \" + item.name());\n}\n```\n\n通过模式匹配，我们可以如下所示重写代码，无需显式转换：\n\
  \n```java\nif (obj instanceof InventoryItem item) {\n  System.out.println(\"Product:\
  \ \" + item.name());\n}\n```\n\n我们可以在 COIN 系统中使用这种方法验证库存物品。下面的代码消除了必要的转换，使得我们的代码更简洁、易读且更高效：\n\
  \n```java\npublic void processInventory(Object obj) {\n  if (obj instanceof InventoryItem\
  \ item) {\n    System.out.println(\"正在处理: \" + item.name());\n  } else {\n    System.out.println(\"\
  无效库存物品.\");\n  }\n}\n```\n\n### 结合 switch 的模式匹配\n\n模式匹配的另一个用法是结合 `switch` 语句。这允许我们既简洁又丰富。让我们来看传统的\
  \ switch 语句，我们可以称之为冗长：\n\n```java\nswitch (order.getStatus()) {\n  case \"PENDING\"\
  :\n    System.out.println(\"订单等待审批.\");\n    break;\n  case \"SHIPPED\":\n    System.out.println(\"\
  订单已发货.\");\n    break;\n  default:\n    System.out.println(\"未知状态.\");\n}\n```\n\
  \n现在，将上面的冗长代码与下面使用模式匹配的简洁版本对比。如你所见，不再需要样板代码 `break` 语句：\n\n```java\nswitch (order.getStatus())\
  \ {\n  case \"PENDING\" -> System.out.println(\"订单等待审批.\");\n  case \"SHIPPED\"\
  \ -> System.out.println(\"订单已发货.\");\n  default -> System.out.println(\"未知状态.\"\
  );\n}\n```\n\n为了进一步演示，让我们来看一个 COIN 系统的示例。下面的代码可以处理不同类型的订单：\n\n```java\npublic void\
  \ processOrder(Order order) {\n  switch (order) {\n    case ExpressOrder eo -> System.out.println(\"\
  正在处理快递订单: \" + eo.getId());\n    case StandardOrder so -> System.out.println(\"\
  正在处理标准订单: \" + so.getId());\n    default -> System.out.println(\"未知订单类型.\");\n \
  \ }\n}\n```\n\n\n\n\n\n在 Java 中，引入 `Records` 类是为了让我们更方便地创建不可变数据对象。我们可以使用 `record`\
  \ 关键字让 Java 自动为我们生成样板代码。这包括构造函数、`setters`、`getters`、`equals()` 和 `toString()` 等方法。\n\
  \n以下是一个使用标准 Java 类实现的 `InventoryItem` 类的示例：\n\n```java\nclass InventoryItem {\n\n\
  \  private final String sku;\n\n  private final String name;\n\n  private final\
  \ int quantity;\n\n  public InventoryItem(String sku, String name, int quantity)\
  \ {\n    this.sku = sku;\n\n    this.name = name;\n\n    this.quantity = quantity;\n\
  \  }\n\n  public String getSku() { return sku; }\n\n  public String getName() {\
  \ return name; }\n\n  public int getQuantity() { return quantity; }\n\n}\n```\n\n\
  现在，让我们看看使用 `Records` 代替标准类的同类实现：\n\n```java\nrecord InventoryItem(String sku, String\
  \ name, int quantity) {}\n```\n\n如你所见，代码量显著减少。你可能还记得我们在第 3 章面向对象编程基础中详细说明过创建构造函数、`setters`\
  \ 和 `getters` 的必要性。使用 `Records`，我们不再需要创建这些方法。\n\n### 密封类 (Sealed classes)\n\n密封类是\
  \ Java 的一项特性，用于限制哪些类可以继承它们以及哪些接口可以实现它们。这使我们能够严格控制继承并支持安全性。\n\n| 注意：密封类强制执行严格的类层级结构。\
  \ |\n\n此功能可以防止意外继承、实现封闭层级并使我们的代码更具预测性。它还能提高应用程序的性能。\n\n以下是一个使用我们 COIN 系统的示例，我们为\
  \ `Order` 类定义了密封类：\n\n```java\nsealed class Order permits ExpressOrder, StandardOrder\
  \ {}\n\nfinal class ExpressOrder extends Order {\n  public void process() { System.out.println(\"\
  Fast shipping enabled.\"); }\n}\n\nfinal class StandardOrder extends Order {\n \
  \ public void process() { System.out.println(\"Standard shipping in progress.\"\
  ); }\n}\n```\n\n如前面的代码所示，我们的 `Order` 类将继承限制为仅 `ExpressOrder` 和 `StandardOrder`；没有其他类可以继承\
  \ `Order` 类。这防止了意外的修改。如果我们尝试扩展 `Order` 类，将收到编译错误。\n\n### 虚拟线程 (Virtual threads)\n\
  \n大规模系统通常处理海量的并发请求。为了整体应用程序的效率，优化这些操作的性能至关重要。请参第 7 章并发与多线程，获取有关线程和并发的更多细节。\n\nProject\
  \ Loom 在 Java 19 中引入了虚拟线程，其目的是让当前的编程兼具可扩展性和高性能。\n\n| 注意：虚拟线程让多线程变得轻量级且可扩展。 |\n\n\
  线程管理可能是内存密集型的，特别是当你的应用程序处理数千万甚至数百万个并发操作时。以下代码演示了我们在不使用虚拟线程的情况下实现线程：\n\n```java\n\
  ExecutorService executor = Executors.newFixedThreadPool(100);\n\nfor (int i = 0;\
  \ i < 1000; i++) {\n  executor.submit(() -> System.out.println(\"Processing order...\"\
  ));\n}\n```\n\n上述示例使用了平台线程。我们将线程数限制在 100 个，是因为每个线程都会消耗大量的内存。\n\n现在，让我们看看使用虚拟线程的方法：\n\
  \n```java\nExecutorService executor = Executors.newVirtualThreadPerTaskExecutor();\n\
  \nfor (int i = 0; i < 1000; i++) {\n  executor.submit(() -> System.out.println(\"\
  Processing order...\"));\n}\n```\n\n上述代码实现了更多的线程，每个线程的内存需求都降低了。在我们的 COIN 系统背景下，我们可以实现结构化并发，以确保获取订单详情的操作和库存操作在继续处理之前并行发生。\n\
  \n该实现提供如下：\n\n```java\ntry (var scope = new StructuredTaskScope.ShutdownOnFailure())\
  \ {\n  Supplier<Order> order = scope.fork(() -> fetchOrder(orderId));\n  Supplier<Inventory>\
  \ inventory = scope.fork(() -> fetchInventory(orderId));\n  scope.join();\n  System.out.println(\"\
  Order: \" + order.get());\n  System.out.println(\"Inventory: \" + inventory.get());\n\
  }\n```\n\n## Java 24，包括 JEP 477\n\nJava 24 于 2025 年 3 月发布，引入了新特性，帮助我们节省开发时间并提高应用程序性能。该版本继续了减少样板代码并引入语法变化及其他改进的趋势，以进一步使\
  \ Java 现代化。Java 24 最受欢迎的增强之一是 JEP 477，它引入了隐式声明类和实例主方法的能力。\n\n| 注意：JEP 是在 JDK 发布前用于通信\
  \ JDK 增强而提供的 JEP 文档。 |\n\n本节深入探讨了 JEP 477 并包含额外的增强。\n\n### JEP 477\n\nJEP 477 引入了类声明的新方法。在传统上，我们必须显式地声明类，这在某种程度上也是\
  \ Java 被称为冗长语言的原因。即使是简单的程序也需要大量代码来完成极少的功能。新特性允许我们在简单程序中编写无需显式声明类的代码，在 `main()` 类中包含实例方法，并提高我们代码的可读性。这一特性与\
  \ Python 和 JavaScript 的代码编写方式进行了对比。让我们来看一个简单的应用程序示例，它会在屏幕上打印“Welcome to the COIN\
  \ System!”。\n\n以下是传统的 Java 代码：\n\n```java\npublic class HelloWorld {\n  public static\
  \ void main(String[] args) {\n    System.out.println(\"Welcome to the COIN System!\"\
  );\n  }\n}\n```\n\n这是使用 Python 的写法：\n\n```python\nprint(\"Welcome to the COIN System!\"\
  )\n```\n\n现在让我们看看使用 JavaScript 的写法：\n\n```javascript\nconsole.log(\"Welcome to the\
  \ COIN System!\");\n```\n\n接下来我们根据 JEP 477 重写它：\n\n```java\nvoid main() {\n  System.out.println(\"\
  Welcome to the COIN System!\");\n}\n```\n\n如你所见，使用 JEP 477 的 Java 代码更加简洁（不再冗长）。使用我们的\
  \ COIN 系统，我们可以实现一个快速库存检查脚本。这是使用传统 Java 代码的做法：\n\n```java\npublic class InventoryCheck\
  \ {\n  public static void main(String[] args) {\n    InventoryService service =\
  \ new InventoryService();\n    System.out.println(\"Stock Level: \" + service.getStock(\"\
  Widget319\"));\n  }\n}\n```\n\n现在，让我们使用 JEP 477 重写它：\n\n```java\nvoid main() {\n\
  \  InventoryService service = new InventoryService();\n  System.out.println(\"Stock\
  \ Level: \" + service.getStock(\"Widget319\"));\n}\n```\n\n如你所见，JEP 477 通过减少样板代码提高了我们代码的可读性。它允许更快的原型设计。\n\
  \n| 注意：记住，JEP 477 适用于简单的 Java 应用。 |\n\n### 额外的增强\n\nJava 24 还发布了若干额外的增强，包括：\n\n\
  *   改进 GC 性能\n*   减少 JVM 预热时间\n*   网络 API 完善\n*   输入输出 (I/O) 增强\n*   强加密算法\n*  \
  \ 增强 TLS 健壮性\n*   改进模块安全权限\n\n你可以在 Oracle 官方网站查看发布说明：[`jdk.java.net/24/release-notes`](https://jdk.java.net/24/release-notes)\n\
  \n## 最佳实践\n\n随着 Java 平台的演进，我们也应该演进自己的编程方法和实践。这对于构建可维护、模块化和高性能的应用程序至关重要。我们应该努力采用与\
  \ Java 最新增强保持一致的最佳实践，以便我们的代码更高效、可扩展、易于维护且高性能。\n\n\n\n\n\n在最后一个节中，我们将继续使用 `COIN`\
  \ 系统来帮助演示编码方法。提醒一下，`COIN` 系统是一个大型订单履行和库存管理平台，负责协调全北美各地的仓库、餐厅和商店。`COIN` 系统对性能、模块化和可维护性有很高要求，这使其成为应用现代\
  \ Java 最佳实践的极佳案例研究。\n\n本节分享了使用 records、模式匹配（pattern matching）、实现虚拟线程（virtual threads）以及实现模块化设计的最佳实践。\n\
  \n### 使用 records\n\n在处理不可变数据时，最好使用 records 而不是传统的类方法。这种做法减少了模板化的构造函数、getter 和 setter\
  \ 代码，带来了以下优势：\n\n* 缩短开发时间\n* 减少待维护代码\n* 更具可读性的代码\n* 更少的内存占用\n* 确保不可变性\n* 防止意外的修改\n\
  \n以下是我们在如何在 `COIN` 系统中为库存项定义 record：\n\n```java\nrecord InventoryItem(String sku,\
  \ String name, int quantity) {}\n```\n\n### 使用模式匹配\n\n正如本章前面提到的，我们可以使用模式匹配来代替 `instanceof`\
  \ 检查。使用这种方法是一种最佳实践，因为它提供了以下优势：\n\n* 减少冗余类型转换。\n* 代码更简洁。\n* 代码更具可读性。\n* 代码更具维护性。\n\
  \n以下是如何为 `COIN` 系统的订单处理实现模式匹配：\n\n```java\nvoid processOrder(Object order) {\n \
  \   if (order instanceof ExpressOrder eo) {\n        System.out.println(\"Processing\
  \ express order: \" + eo.getId());\n    } else if (order instanceof StandardOrder\
  \ so) {\n        System.out.println(\"Processing standard order: \" + so.getId());\n\
  \    }\n}\n```\n\n我们还可以结合 switch 表达式使用模式匹配来实现以下优势：\n\n* 清晰的流控制。\n* 代码更简洁。\n* 代码更具可读性。\n\
  * 代码更具维护性。\n\n以下是我们如何在 `COIN` 系统中实现这一最佳实践：\n\n```java\nvoid handleOrder(Order order)\
  \ {\n    switch (order) {\n        case ExpressOrder eo -> System.out.println(\"\
  Fast shipping for \" + eo.getId());\n        case StandardOrder so -> System.out.println(\"\
  Processing standard order: \" + so.getId());\n        case Backorder bo -> System.out.println(\"\
  Order is backordered.\");\n        default -> System.out.println(\"Unknown order\
  \ type.\");\n    }\n}\n```\n\n### 实现虚拟线程\n\n虚拟线程实现是现代 Java 应用的另一个最佳实践。具体而言，我们可以使用虚拟线程代替平台线程（platform\
  \ threads）。这种方法的优势包括：\n\n* 减少内存占用\n* 提高性能\n* 可扩展性\n\n以下是 `COIN` 系统如何实现虚拟线程以同时处理数千个订单的示例：\n\
  \n```java\nExecutorService executor = Executors.newVirtualThreadPerTaskExecutor();\n\
  for (int i = 0; i < 1000; i++) {\n    executor.submit(() -> System.out.println(\"\
  Processing order...\"));\n}\n```\n\n### 实现模块化设计\n\n我们现代 Java 开发的最后一个特色最佳实践是实现模块化设计，以获得以下优势：\n\
  \n* 增强封装\n* 代码安全\n* 提高可维护性\n* 提高可读性\n\n以下是一个将 `COIN` 系统的库存和订单流程模块化的示例：\n\n```java\n\
  module com.coin.inventory {\n    exports com.coin.inventory.api;\n    requires java.sql;\n\
  }\n\nmodule com.coin.orders {\n    exports com.coin.orders.api;\n    requires com.coin.inventory;\n\
  }\n```\n\n### 额外考虑\n\n本节介绍的最佳实践可以为你作为开发者、你的系统性能以及用户体验带来巨大益处。它们并不是建议孤立地使用，而是应该作为一种整体方法来实现，以帮助确保你的应用程序是安全、可扩展、可读、可维护且高性能的。\n\
  \n以下列表提供了你在开发和维护现代 Java 应用时可以考虑的额外最佳实践：\n\n* 尽可能实现不可变性，以降低并发问题风险并增加线程安全性。更多信息请参阅\
  \ 第 7 章 [并发与多线程]。\n* 使用函数式编程代替循环进行数据处理。实现细节请参阅 第 8 章 [流与函数式编程]。\n* 避免过度的对象创建，并使用现代\
  \ Java 垃圾回收器（例如 `ZGC`、Garbage-First 垃圾回收器 (`G1 GC`) 等）以实现低延迟并减少 GC 开销。\n* 在编码之前，将安全性设计到你的模块和整个应用程序中。采用诸如限制模块暴露、始终验证输入以及对敏感数据使用强加密等技术。\n\
  \n## 结论\n\n作为 Java 开发者，我们很幸运 Java 平台和生态系统在不断演进。我们不断获得新工具，可以改进我们 Java 程序的多个方面，包括模块化、可扩展性、可读性、可维护性、安全性、性能等。本章检查了近期\
  \ Java 版本发布中一些最重要的特性。这包括 Project Jigsaw、模式匹配、密封类（sealed classes）、虚拟线程以及 `JEP 477`。这些每项增强都为编写更清洁、更高效且更具维护性的\
  \ Java 应用程序提供了开发效率。\n\n我们将这些增强功能应用到 `COIN` 系统中，以展示这些现代特性如何造福企业级系统。本章最后以对现代 Java\
  \ 应用开发最佳实践的回顾作为结束。\n\n在下一章中，我们将探索调试、测试、部署和支持应用程序的方法。本章演示了如何使用 IDE 工具和日志来调试 Java\
  \ 程序。你可以学习如何使用 `JUnit` 编写单元测试，并应用测试驱动开发 (`TDD`) 原则来确保代码的可靠性。最后，本章涵盖了使用 `Maven` 和\
  \ `Gradle` 等工具打包和部署 Java 应用，帮助你准备发布软件。\n\n## 记住\n\n* 采用现代 Java 最佳实践可以提高应用程序的性能、维护性和扩展性。\n\
  * 应用程序受益于模块化编程，提高了封装性、安全维护性。\n* 现代 Java 开发的最佳实践包括使用 records、模式匹配、虚拟线程和模块化。\n* 模块化编程中的封装确保只暴露必要的\
  \ API，从而降低安全风险。\n* 函数式编程技术（如 `Stream API`）提高了代码的可读性和性能。\n* 垃圾回收一直在持续优化以减少内存开销。\n\
  * Java 六个月一次的发布周期确保了更新的持续，平衡了创新与稳定性。\n* `JEP` 概述了对 Java 平台的提案。\n* `JEP 477` 允许隐式类声明，减少了模板代码并提高了简单应用程序的可读性。\n\
  * 模块化设计随 Project Jigsaw 引入。\n* 模块化应用通过只加载所需的组件改进了依赖管理并缩短了启动时间。\n* 模块化允许将应用程序拆分为自包含的独立的模块。\n\
  * 模式匹配允许 `instanceof` 检查和 switch 语句的编写更加简洁，提高了代码可读性。\n* 近期 Java 版本的性能优化包括减少 JVM\
  \ 预热时间、改进 I/O 处理以及网络精简。\n* records 消除了对模板化构造函数和 getter 的需求。\n* records 提供了一种定义不可变数据结构的简洁方法。\n\
  * 密封类控制继承，允许我们限制哪些类可以扩展或实现接口。\n* 结构化并发允许更高效的线程管理和并行任务执行。\n\n\n\n\n\n- 在模块定义中使用 `requires`\
  \ 指令可以确保 Java 应用程序声明并显式强制依赖。\n- 虚拟线程可以以极小的内存开销处理数百万并发任务。\n\n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对现代\
  \ Java 特性进行批判性思考：\n\n* 全球供应链系统的模块化：Skyforge Logistics 是一家全球供应链管理公司，为跨不同大陆的数千企业协调运输、仓储和履行。该公司的基于\
