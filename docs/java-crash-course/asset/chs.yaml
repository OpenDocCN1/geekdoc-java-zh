  \ Java 扩展包\n\n如果未安装扩展，点击安装按钮并按照屏幕上的说明操作。\n\n### 创建 JavaFX 项目\n\n到此时，你应该已经准备好可以使用\
  \ `JDK`、JavaFX `SDK` 和 VS Code。本节将介绍如何在 VS Code 中设置 PFT 项目。\n\n通过以下步骤创建项目、添加依赖并验证设置：\n\
  \n1.  我们的第一步是创建一个新项目：\n    *   打开 VS Code 并按下 `Cmd + Shift + P` (macOS) 或 `Ctrl\
  \ + Shift + P` (Windows) 打开命令面板。\n    *   输入 `Java: Create Project` 并选择该项。\n   \
  \ *   选择 `No Build Tools`（我们为了简单采用此方案）。\n    *   选择保存项目的位置。\n    *   命名项目为 PFT。\n\
  \n2.  接下来，我们需要将 JavaFX 链接到项目中。由于 JavaFX 是外部库：\n    *   如果 VS Code 没有自动在项目中创建 `lib`\
  \ 文件夹，请手动创建一个。\n    *   找到你解压后的 JavaFX 文件夹。你可以通过系统文件夹操作，或直接将 JavaFX 文件夹拖到项目的 `lib`\
  \ 文件夹中。\n\n3.  接下来，我们需要在项目的 `.vscode` 目录中创建一个 `launch.json` 文件。该文件的示例内容如下。请确保路径与你放入\
