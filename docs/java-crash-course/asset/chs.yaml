  \n### 扩展项目\n\n该项目符合所有要求的规范。如果你想扩展这个项目来锻炼你的 Java 技能，这里是一些建议：\n\n- 添加如下功能：\n    -\
  \ 按所有者姓名或物种搜索宠物的能力。\n    - 按年龄、品种或名称排序。\n    - 添加宠物性别。\n    - 添加激活/非激活的记录标记。\n \
  \   - 添加完整记录的报告。\n    - 提供没有就诊记录的宠物报告。\n- 对所有用户输入进行数据验证。\n- 增强用户体验：\n    - 添加确认提示。\n\
  \    - 允许用户清除或重置输入。\n    - 为宠物主生成可打印的报告。\n- 将 UI 从文本改为图形。\n\n# 构建多线程数据处理器\n\n我们的第三个项目要求创建一个多线程频率计数器。它应该使用\
  \ Java 线程读取并分析大型文本文件。我们的程序将文件分成较小的块并将每个块分配给一个线程。每个线程将计算每个单词出现的次数。所有线程完成后，主线程将合并结果并输出发现的唯一单词总数。我们将提示用户想在输出中查看多少个单词。\n\
  \n此项目旨在让你在以下领域获得实践经验：\n\n- 创建和管理多个线程。\n- 使用线程安全的集合和同步。\n- 在多线程上下文中协调工作并聚合结果。\n\n\
  应用程序的要求是：\n\n- 接受单个大型 `.txt` 文件作为输入。\n- 将文件划分为基于行的段（每个线程一个）。\n- 为每个段创建一个线程来计算单词频率。\n\
  - 将结果合并到单个主单词频率表中。\n- 输出唯一单词的总数。\n- 提示用户指定他们想看多少个高频单词。\n- 根据用户的指定输出单词频率。\n\n###\
  \ 设计\n\n我们将使用生产者-消费者模型，每个工作线程将拥有输入数据的一个子集，与其他所有其他线程相互独立。有两个类：\n\n- `WordFrequencyCounter`：这将是主类；它将处理：\n\
  \    - 读取输入文件。\n    - 创建线程。\n    - 聚合结果。\n- `WordCountWorker`：这将实现 `Runnable` 接口。\n\
  \    - 它将接受行列表并计算单词频率。\n    - 它将维护一个本地的 `Map<String, Integer>` 以供主线程合并。\n\n注意：`Runnable`\
  \ 是一个函数接口，代表一个可线程执行的任务。\n\n在构建应用程序之前，我们还需要考虑其他几个设计问题：\n\n- 我们将从文本中去除标点符号。\n- 单词匹配将不区分大小写。\n\
  - 每个线程将分配固定数量的行。\n- 我们将使用 `thread.join()` 来确保在聚合结果之前所有线程已完成。\n\n图 14.4 展示了我们程序的流程：\n\
  \n![包含七步的流程图：读取输入文件、分成行块、创建工作线程、每个线程计算单词、主线程聚合结果、用户输入（前 N 个单词）、输出结果。箭头连接了每个步骤。](img/Figure_14.4.png)\n\
  \n图 14.4：程序流程\n\n### 实现\n\n这是我们的主类：\n\n```java\nimport java.io.*;\nimport java.util.*;\n\
  \npublic class WordFrequencyCounter {\n    private static final int LINES_PER_THREAD\
  \ = 500;\n\n    public static void main(String[] args) {\n        Scanner scanner\
  \ = new Scanner(System.in);\n        System.out.print(\"Enter path to text file:\
  \ \");\n        String filePath = scanner.nextLine();\n        List<String> allLines\
  \ = new ArrayList<>();\n        // 将文件读入内存\n        try (BufferedReader reader =\
  \ new BufferedReader(new FileReader(filePath))) {\n            String line;\n  \
  \          while ((line = reader.readLine()) != null) {\n                allLines.add(line);\n\
  \            }\n        } catch (IOException e) {\n            System.out.println(\"\
  Error reading file: \" + e.getMessage());\n            return;\n        }\n    \
  \    // 将行分成块\n        List<List<String>> chunks = new ArrayList<>();\n        for\
  \ (int i = 0; i < allLines.size(); i += LINES_PER_THREAD) {\n            int end\
  \ = Math.min(i + LINES_PER_THREAD, allLines.size());\n            chunks.add(allLines.subList(i,\
  \ end));\n        }\n        // 使用线程处理块\n        List<WordCountWorker> workers =\
  \ new ArrayList<>();\n        List<Thread> threads = new ArrayList<>();\n      \
  \  for (List<String> chunk : chunks) {\n            WordCountWorker worker = new\
  \ WordCountWorker(chunk);\n            Thread thread = new Thread(worker);\n   \
  \         workers.add(worker);\n            threads.add(thread);\n            thread.start();\n\
  \        }\n        // 等待所有线程完成\n        for (Thread thread : threads) {\n     \
  \       try {\n                thread.join();\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"Thread interrupted: \" + e.getMessage());\n\
  \            }\n        }\n        // 合并结果\n        Map<String, Integer> finalWordCounts\
  \ = new HashMap<>();\n        for (WordCountWorker worker : workers) {\n       \
  \     Map<String, Integer> localMap = worker.getWordCounts();\n            for (Map.Entry<String,\
  \ Integer> entry : localMap.entrySet()) {\n                finalWordCounts.merge(entry.getKey(),\
  \ entry.getValue(), Integer::sum);\n            }\n        }\n        System.out.println(\"\
  Total unique words: \" + finalWordCounts.size());\n        System.out.print(\"How\
  \ many top frequent words would you like to see? \");\n        int topN = scanner.nextInt();\n\
  \        // 排序并显示\n        finalWordCounts.entrySet().stream()\n            .sorted((a,\
  \ b) -> b.getValue().compareTo(a.getValue()))\n            .limit(topN)\n      \
  \      .forEach(e -> System.out.printf(\"%-20s %d%n\", e.getKey(), e.getValue()));\n\
  \    }\n}\n```\n\n你的 IDE 可能会给你一个警告，提示 `Scanner` 没有关闭。在我们情况下，我们使用它从 `System.in` 获取用户输入。如果我们关闭了\
  \ `Scanner`，它也会关闭 `System.in`，我们不想关闭它，因为它无法重新打开，并且如果你计划扩展它的功能，以后可能需要它。我们可以通过在 `main()`\
  \ 方法之前放置以下内容来抑制此警告：`@SuppressWarnings(\"resource\")`。\n\n应用程序的输出如下：\n\n\n\n\n\n\
