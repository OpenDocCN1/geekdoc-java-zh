  \n![QR-Logo](img/fm1.png)\n\n# 第 5 章 处理错误与异常\n\n## 引言\n\n我们花费大量时间编写 Java 应用程序，当程序运行时可能会发生很多问题，包括错误（errors）和异常（exceptions）。在\
  \ Java 的语文中，错误是遇到的、超出应用程序控制范围的关键问题。异常是代码可以处理的可以恢复的问题。处理异常的能力是本章的重点。\n\n有效的错误处理是现代软件开发的关键组成部分。在我们编写程序时，我们对可能发生的情况有很好的感知（例如文件缺失），Java\
  \ 赋予了我们优雅管理这些错误的能力。我们首先检查 Java 的异常层次，并理解已检查（checked）和未检查（unchecked）异常的区别。在此基础上，本章将演示如何使用\
  \ `try-catch-finally` 块实现错误处理机制，并探索异常传播。你会发现，异常传播决定了错误如何在应用程序中传递。\n\n本章还介绍了创建自定义异常的技术，我们可以利用它有效地通信特定的应用程序问题。你可以发现如何测试错误处理代码以确保健壮性和可靠性。本章以设计故障安全应用程序的最佳实践作为结束。在处理复杂的应用程序组件（如文件输入输出、并发和数据库，这些将在本书的后续章节中介绍）时，优雅处理异常的能力尤为重要。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n- 理解 Java 异常层次\n- 已检查与未检查异常\n- try-catch-finally 块\n- 抛出异常与异常传播\n\
  - 创建自定义异常\n- 测试异常处理\n\n\n\n\n\nJava 异常处理框架的核心在于能够在运行时捕获异常并优雅地处理它们。这使得我们可以控制应用程序如何响应异常。这种能力是围绕\
  \ Java 的 `Throwable` 类构建的。理解异常处理的结构和层次至关重要。\n\n本节将探讨这些概念，从查看 `Throwable` 类开始。\n\n\
  ### Throwable 类\n\nJava 包含 `Throwable` 类，用于表示任何由 Java 虚拟机 (`JVM`) 抛出的对象。在这种语境下，“抛出（thrown）”意味着\
  \ `JVM` 在运行时遇到了异常情况，例如错误。`JVM` 通过创建 `Throwable` 类或其某个子类的实例，并将该实例传递给异常处理器来信号这一点。因此，用通俗的话说，抛出一个对象意味着创建并向我们的程序发出错误或异常信号。我们可以捕获被抛出的内容，以便优雅地处理错误和异常。\n\
  \n如图 1.1 所示，`Throwable` 类有两个主要的子类：`Error` 和 `Exception`，如下所示：\n\n![一张显示 Java Throwable\
  \ 类层次结构的图，分为 Error（包含 InternalError、OutOfMemoryError、StackOverflowError）和 Exception（包含\
  \ IOException、RuntimeException、SQLException 及其子类型）。 ](img/Figure_5.1.png)\n\n图 5.1：Java\
  \ 异常层次\n\n在下一节中，我们将仔细研究 Java 中错误（errors）与异常（exceptions）之间的区别。\n\n### 错误与异常\n\n我们已经确定\
  \ Java 中的错误是通常应用程序控制之外的重大问题，例如硬件故障或关键资源耗尽。主要的例子包括 `OutOfMemoryError`（表示 `JVM` 内存不足）和\
  \ `StackOverflowError`（当递归过多导致栈溢出时发生）。\n\n相反，异常是应用程序可以恢复的条件。它们被进一步分为检查异常（checked\
  \ exceptions）和未检查异常（unchecked exceptions）。\n\n检查异常必须在方法的 `throws` 子句中声明。未检查异常（也称为运行时异常）不需要声明或处理。示例包括在访问空引用时发生的\
  \ `NullPointerException`，以及发生无效索引时的 `IndexOutOfBoundsException`。\n\n注意：何时使用检查异常与未检查异常。对于可预测的问题使用检查异常。对于编程\
  \ Bug 使用未检查异常。\n\n```java\nimport java.io.File;\nimport java.io.IOException;\nimport\
  \ java.util.Scanner;\n\npublic class ExceptionExample {\n    public static void\
  \ main(String[] args) {\n        File file = new File(\"test.txt\");\n        try\
  \ {\n            Scanner scanner = new Scanner(file);\n            while (scanner.hasNextLine())\
  \ {\n                System.out.println(scanner.nextLine());\n            }\n  \
  \      } catch (IOException e) {\n            System.out.println(\"Error: \" + e.getMessage());\n\
  \        } catch (ArithmeticException e) {\n            System.out.println(\"Error:\
  \ \" + e.getMessage());\n        } finally {\n            System.out.println(\"\
  Cleanup actions.\");\n        }\n    }\n\n    public static int divide(int a, int\
  \ b) throws IOException {\n        return a / b;\n    }\n\n    public static void\
  \ readFromFile(String fileName) throws IOException {\n        File file = new File(fileName);\n\
  \        Scanner scanner = new Scanner(file);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  // 尝试连接数据库\n\nconnection = DriverManager.getConnection(\"jdbc:mysql://localhost:3306/test\"\
  , \"user\", \"password\");\n\n// 此处将进行数据库操作\n\n} catch (SQLException e) {\n\n//\
  \ 处理 SQLException\n\nSystem.out.println(\"数据库访问错误:\");\n\ne.printStackTrace();\n\
  \n} finally {\n\n// 关闭连接（如果已建立）\n\nif (connection != null) {\n\ntry {\n\nconnection.close();\n\
  \n} catch (SQLException e) {\n\nSystem.out.println(\"关闭连接时出错:\");\n\ne.printStackTrace();\n\
  \n}\n\n}\n\n}\n\n}\n\n}\n```\n\n在上述示例中，在尝试建立数据库连接或关闭连接时，都可能抛出 `SQLException`。在在这两种情况下，我们都有一个\
  \ `catch` 块来处理该异常。此外，我们还使用 `e.printStackTrace()` 来显示异常的详细信息。\n\n### 未检查异常 (Unchecked\
  \ exceptions)\n\n未检查异常可能是编程逻辑错误或 Bug 导致。在这种情况下，通过更彻底的测试和质量保证可以避免这些异常。它们之所以被称为“未检查”，是因为\
  \ Java 编译器在编译时不会对其进行强制检查。我们不需要强制处理或声明未检查异常。这种异常的分类是为了识别编程逻辑缺陷，例如空引用或无效参数。\n\n未检查异常的常见示例包括\
  \ `ArithmeticException`（例如除以零）、`ArrayIndexOutOfBoundsException`（例如尝试访问无效的数组索引时）以及\
  \ `NullPointerException`（在访问空引用时发生）。\n\n让我们来理解当调用带有以下空引用的方法时，如何处理该用例：\n\n```java\n\
  public class NullPointerExceptionExample {\n\n    public static void main(String[]\
  \ args) {\n\n        String myString = null;\n\n        try {\n\n            //\
  \ 此处我们尝试对空引用调用方法\n\n            int length = myString.length();\n\n        } catch\
  \ (NullPointerException e) {\n\n            System.out.println(\"我们捕获到了 NullPointerException:\
  \ \");\n\n            e.printStackTrace();\n\n        }\n\n    }\n}\n```\n\n在上述代码中，我们声明了一个名为\
  \ `myString` 的 `String` 变量并将其设置为 `null`。当我们尝试对 `myString` 调用 `length()` 方法时，会抛出\
  \ `NullPointerException`，因为 `myString` 没有引用任何对象。`catch` 块捕获了异常并使用 `printStackTrace()`\
  \ 方法打印了其堆栈跟踪。\n\n表 5.1 总结了已检查异常和未检查异常之间的差异：\n\n| 组件 | 已检查异常 (Checked exceptions)\
  \ | 未检查异常 (Unchecked exceptions) |\n| :--- | :--- | :--- |\n| 目的 | 用于可恢复的问题 | 用于编程错误\
  \ |\n| 编译时强制执行 | 必须处理或使用 `throws` 声明 | 不需要 |\n| 示例 | `FileNotFoundException`IOException`SQLException`\
  \ | `ArithmeticException`ArrayIndexOutOfBoundsException``NullPointerException` |\n\
  \n表 5.1: 已检查与未检查异常的对比\n\n\n\n## Try-catch-finally 块\n\n到为止，在本章中，我们已经看到了多个 `try-catch-finally`\
  \ 块的实例。本节将深入探讨这一结构，它是 Java 处理异常能力的核心。它允许我们优雅地恢复并保持应用程序流的控制。\n\n### try-catch-finally\
  \ 块的结构\n\n`try-catch-finally` 异常处理结构由三个不同的块组成。\n\n让我们在接下来的章节中检查每一个块。\n\n#### Try\
  \ 块\n\n`try` 块包含了我们认为会抛出异常的代码。该块尝试（tries）执行这些代码。它将任何异常传递给相应的 `catch` 块。其结构如下：\n\n\
  ```java\ntry {\n    // 此块中的代码可能会抛出异常\n}\n```\n\n#### Catch 块\n\n`catch` 块是您处理由 `try`\
  \ 块抛出的异常的地方。每个 `catch` 块都与特定的异常类型相关。我们将在本节的稍后部分查看多个 `catch` 块。\n\n以下是结构：\n\n```java\n\
  catch {\n    // 处理异常的代码\n}\n```\n\n#### Finally 块\n\n`finally` 块是可选的，但强烈建议使用。无论是否发生异常，它都会执行。它被视为清理代码，通常用于关闭文件、数据库和连接。\n\
  \n注意：即使 `try` 或 `catch` 块中出现了 `return` 语句，`finally` 块始终会执行。\n\n以下是结构：\n\n```java\n\
  finally {\n    // 此处编写清理代码\n}\n```\n\n让我们看一个在 `try-catch-finally` 结构中使用所有三个的示例：\n\
  \n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\n\
  \npublic class TryCatchFinallyExample {\n    public static void main(String[] args)\
  \ {\n        Scanner scanner = null;\n        try {\n            File file = new\
  \ File(\"unlikelyfile.txt\");\n            scanner = new Scanner(file); // 可能抛出\
  \ FileNotFoundException\n            while (scanner.hasNextLine()) {\n         \
  \       System.out.println(scanner.nextLine());\n            }\n        } catch\
  \ (FileNotFoundException e) {\n            System.out.println(\"错误：未找到指定的文件.\");\n\
  \        } finally {\n            if (scanner != null) {\n                scanner.close();\
  \ // 确保资源被释放\n            }\n            System.out.println(\"文件操作完成.\");\n    \
  \    }\n    }\n}\n```\n\n在上述示例中，`try` 块尝试打开并读取文件；`catch` 块处理了 `FileNotFoundException`；而\
  \ `finally` 块关闭了 `Scanner` 资源以防止资源泄漏。\n\n### 多个 catch 块\n\n`try-catch-finally` 异常处理结构可以超出这三个独立块。具体来说，我们可以包含多个\
  \ `catch` 块，每个块处理一种不同的异常。如果 `try` 块抛出了多个异常，Java 将执行匹配的第一个 `catch` 块。\n\n以下演示这种方法的代码片段：\n\
  \n```java\ntry {\n    int[] array = new int[3];\n    System.out.println(array[19]);\
  \ // 抛出 ArrayIndexOutOfBoundsException\n    int result = 19 / 0; // 抛出 ArithmeticException\n\
  } catch (ArrayIndexOutOfBoundsException e) {\n    System.out.println(\"数组越界：\" +\
  \ e.getMessage());\n} catch (ArithmeticException e) {\n    System.out.println(\"\
  数学错误：\" + e.getMessage());\n} finally {\n    System.out.println(\"执行完成.\");\n}\n\
  ```\n\n该代码片段的输出将是：\n\n数组越界：Index 3\n执行完成.\n\n### 最佳实践与陷阱\n\n优雅处理异常的重要性不言而喻。在应用程序实现这一点时，请考虑以下最佳实践：\n\
  \n- 捕获的异常要具体。与其捕获通用异常（如 `Exception` 或 `Throwable`），不如捕获您预期的特定异常，以便有意义地处理它们。\n- 尽量减少\
  \ `try` 块中的代码。仅在该块中放置可能抛出异常的代码。这将使调试和代码维护工作更高效。\n- 始终在 `finally` 块中释放资源以防止泄漏。\n\
  - 使用 `try-with-resources` 块简化清理工作。\n\n| 注意：我们将在第 9 章输入/输出中讨论。 |\n\n此外，我们在处理应用程序异常时应努力避免这些常见陷阱：\n\
  \n- 不要使用空的 `catch` 块。这会在不采取任何操作的情况下吞掉异常。这会隐藏 Bug 并使调试极其困难。\n\n以下是一个示例：\n\n```java\n\
  try {\n    int result = 19 / 0;\n} catch (ArithmeticException e) {\n    // 避免在此什么都不做！\n\
  \    // 以有意义的方式处理异常！\n}\n```\n\n\n\n\n\n到目前为止，我们探索了异常以及预测和处理异常的必要性。我们也可以有意地抛出异常。Java\
  \ 为我们提供了有意抛出异常并将其向调用栈向上传播的能力。这允许我们有效地发出信号并管理异常。在本节中，我们将介绍如何以及为什么要在代码中生成异常，以及如何传播它们。我们还将涵盖异常管理策略。\n\
  \n## 抛出异常\n\n要有意地抛出异常，我们只需要使用 Java 的 `throw` 关键字。当我们的程序遇到它无法自行处理的情况时（例如无效的用户输入或非法的方法参数），这种方法非常有用。\n\
  \n其语法如下：\n\n```java\nthrow new ExceptionType(\"Error message\");\n```\n\n以下是代码中的示例：\n\
  \n```java\npublic class IntentionalThrowExample {\n    public static void main(String[]\
  \ args) {\n        try {\n            validateAge(119); // 将抛出异常\n        } catch\
  \ (IllegalArgumentException e) {\n            System.out.println(\"Exception caught:\
  \ \" + e.getMessage());\n        }\n    }\n\n    public static void validateAge(int\
  \ age) {\n        if (age > 99) {\n            throw new IllegalArgumentException(\"\
  Maximum age allowed is 99.\");\n        }\n    }\n}\n```\n\n该程序的输出如下：\n\n```\nException\
  \ caught: Maximum age allowed is 99.\n```\n\n在上述示例中，当 `age` 大于 99 时，我们使用 `throw`\
  \ 关键字创建并抛出一个 `IllegalArgumentException`。异常带有描述性消息以帮助识别问题。\n\n## 异常传播\n\n当方法中抛出异常时，我们既可以在方法内部处理它，也可以将其传播给调用者。通过传播，我们可以不断将异常向上推调用栈，直到它被\
  \ `try-catch` 块捕获。因此，如果一个方法抛出的异常没有在其内部被捕获，那么该异常将传播到调用它的方法。这种传播一直持续到异常被捕获或程序结束。\n\
  \n以下是代码中的示例：\n\n```java\npublic class PropagationExample {\n    public static void\
  \ main(String[] args) {\n        try {\n            methodA();\n        } catch\
  \ (Exception e) {\n            System.out.println(\"Caught exception: \" + e.getMessage());\n\
  \        }\n    }\n\n    public static void methodA() throws Exception {\n     \
  \   methodB(); // 传播异常\n    }\n\n    public static void methodB() throws Exception\
  \ {\n        throw new Exception(\"Something went wrong in methodB.\");\n    }\n\
  }\n```\n\n该程序的输出如下：\n\n```\nCaught exception: Something went wrong in methodB.\n\
  ```\n\n在上述示例中，`methodB()` 方法抛出了异常。`methodA()` 方法声明要抛出异常但没有处理它。`main()` 方法在 `try-catch`\
  \ 块中捕获了该传播的异常。\n\n## 深入研究 throws 关键字\n\n正如我们在上一节中看到的，方法必须在它们的签名中声明异常以传播异常。这种声明是通过\
  \ `throws` 关键字完成的。这对于检查异常（checked exceptions）是强制性的；对于未检查异常（unchecked exceptions）是可选的。\n\
  \n以下是语法：\n\n```java\nreturnType methodName(parameters) throws ExceptionType {\n\
  \    // 方法逻辑在此处\n}\n```\n\n下面的代码片段演示了一个具有适当签名以便发生异常传播的方法：\n\n```java\npublic static\
  \ void readTheFile(String fileName) throws FileNotFoundException {\n    File file\
  \ = new File(fileName);\n    Scanner scanner = new Scanner(file); // 抛出 FileNotFoundException\n\
  }\n```\n\n| 注意：对于你不想在方法内部处理的异常，请使用 `throws` 关键字。 |\n\n那么，哪种方法更好：捕获还是传播？当我们设计程序时，必须思考这个问题。我们是想在本地处理异常，还是将它们传播给调用者？\n\
  \n[表 5.2] 提供了对这两种方法的总结回顾：\n\n| 方法 | 目的 | 示例 |\n| :--- | :--- | :--- |\n| 本地捕获 |\
  \ 在靠近源的地方处理异常<br>恢复或采取特定操作 | 在临时性故障后重试数据库连接。 |\n| 传播 | 当方法本身无法解决问题时<br>当调用者更适合处理它时\
  \ | 从数据访问层抛出 `SQLException` 传递到应用层以通知用户。 |\n\n表 5.2: 捕获与传播方法的总结\n\n## 最佳实践\n\n以下是抛出和传播异常的最佳实践：\n\
  \n*   使用特定的异常类型而不是通用类型。我们应该努力为日志和用户提供有意义的错误信息。\n\n[表 5.3] 提供了以下示例：\n\n| 坏示例 | 良好示例\
  \ |\n| :--- | :--- |\n| `throw new Exception(“Error”);` | `throw new IllegalArgumentException(“Invalid\
  \ argument”);` |\n\n表 5.3: 特定错误消息的坏示例和良好示例\n\n*   尽可能避免传播运行时异常，例如 `NullPointerExceptions`。相反，请修复底层逻辑。\n\
  *   使用代码注释详尽地记录你的异常。\n\n下面的代码片段提供了一个关于注释清晰度和深度的示例：\n\n```java\n/**\n* readTheFile\
  \ 方法读取文件并将其内容打印到控制台。\n* @param fileName 要读取的文件名\n* @throws FileNotFoundException\
  \ 如果文件在给定路径不存在则抛出异常\n*/\npublic void readFile(String fileName) throws FileNotFoundException\
  \ {\n    // 实现将在此处\n}\n```\n\n*   创建自定义异常是可以的（将在下一节介绍），但要节节使用。保持代码的可读性和可维护性很重要。\n\
  \n## 创建自定义异常\n\nJava 的内置异常并不总是满足我们的需求。特别是在复杂的程序中，我们可能会遇到内置异常提供信息不足的情况。在这种情况下，我们可以创建专门为应用程序定制的异常。\n\
  \n自定义异常允许我们：\n\n*   为用户和日志提供更多关于错误的上下文。\n*   通过区分标准错误和特定的错误来提高代码的可读性。\n*   通过信号应用程序特的问题来强制特定的错误处理。\n\
  \n本节演示了如何有效地设计、创建和使用自定义异常。\n\n### 设计自定义异常\n\nJava 使自定义扩展变得简单。我们只需要扩展 `Exception`\
  \ 类或 `RuntimeException` 类，取决于我们处理的是检查异常还是未检查异常。\n\n以下是三个步骤流程：\n\n1.  首先，我们需要确保扩展了正确的基类。基本指南如下：\n\
  \    1. 使用 `Exception` 类用于检查异常（必须声明或处理）。\n    2. 使用 `RuntimeException` 类用于未检查异常（可选声明或处理）。\n\
  2.  接下来，定义一个默认构造函数以及另一个接受自定义错误消息的构造函数。虽然不是必须的，但我们还可以包含一个接受原因的构造函数，这对调试非常有帮助。\n3.\
  \  最后，我们可以添加字段来存储附加信息，例如错误代码和友好的输出消息。这一步是可选的，但强烈建议这样做。\n\n以下是自定义检查异常的示例：\n\n```java\n\
  /*\n* 此类是一个自定义\n* 检查异常\n* 示例\n*/\npublic class InvalidInputException extends Exception\
  \ {\n    private int errorCode;\n\n    // 默认构造函数\n    public InvalidInputException()\
  \ {\n        super(\"Invalid input provided.\");\n    }\n\n    // 带自定义消息的构造函数\n\
  \    public InvalidInputException(String message) {\n        super(message);\n \
  \   }\n\n    // 带自定义消息和错误代码的构造函数\n    public InvalidInputException(String message,\
  \ int errorCode) {\n        super(message);\n        this.errorCode = errorCode;\n\
  \    }\n\n    // 错误代码的 getter\n    public int getErrorCode() {\n        return errorCode;\n\
  \    }\n}\n```\n\n\n\n\n\n在我们上面的上面的示例中，自定义异常包含了为了灵活而设计的构造函数。`errorCode` 字段提供了有关错误的额外上下文。\n\
  \n### 使用自定义检查异常\n\n在上一节中，我们创建了一个名为 `InvalidInputException` 的自定义检查异常，并带有自定义的错误消息。\n\
  \n以下代码演示了我们如何在程序中实现自定义异常：\n\n```java\npublic class CustomExceptionImplementation\
  \ {\n    public static void main(String[] args) {\n        try {\n            processInput(-5);\n\
  \        } catch (InvalidInputException e) {\n            System.out.println(\"\
  Error: \" + e.getMessage());\n            System.out.println(\"Error Code: \" +\
  \ e.getErrorCode());\n        }\n    }\n\n    public static void processInput(int\
  \ input) throws InvalidInputException {\n        if (input <= 0) {\n           \
  \ throw new InvalidInputException(\"Input must be positive.\", 1001);\n        }\n\
  \        System.out.println(\"Valid input: \" + input);\n    }\n}\n```\n\n这里是程序的程序的输出：\n\
  \nError: Input must be positive.\nError Code: 1001\n\n### 自定义非检查异常\n\n以下示例演示了如何创建一个自定义非检查异常：\n\
  \n```java\n/*\n* 此类是一个\n* 自定义非检查\n* 异常示例\n*/\npublic class ConfigurationException\
  \ extends RuntimeException {\n    public ConfigurationException(String message)\
  \ {\n        super(message);\n    }\n\n    public ConfigurationException(String\
  \ message, Throwable cause) {\n        super(message, cause);\n    }\n}\n```\n\n\
  正如你在示例中看到的，我们继承了 `RuntimeException`，因为我们的异常是非检查的。我们还包含了两个构造函数：默认构造函数和一个接受原因以获得更深见角的第二个构造函数。\n\
  \n现在，让我们在程序中使用自定义的非检查异常：\n\n```java\npublic class CustomUncheckedExceptionImplementation\
  \ {\n    public static void main(String[] args) {\n        try {\n            loadConfiguration(null);\n\
  \        } catch (ConfigurationException e) {\n            System.out.println(\"\
  Configuration error: \" + e.getMessage());\n        }\n    }\n\n    public static\
  \ void loadConfiguration(String configPath) {\n        if (configPath == null) {\n\
  \            throw new ConfigurationException(\"Configuration file path cannot be\
  \ null.\");\n        }\n        System.out.println(\"Loading configuration from:\
  \ \" + configPath);\n    }\n}\n```\n\n以下是程序的输出：\n\nConfiguration error: Configuration\
  \ file path cannot be null.\n\n### 最佳实践\n\n以下是创建和使用自定义异常的几项最佳实践：\n\n* 如果标准异常足够了，请使用它。\n\
  * 给你的自定义异常起一个自描述性的名称。\n* 提供有意义的错误消息。\n* 使用代码内注释详细地记录你的异常。\n\n## 测试异常处理\n\n与应用程序中的任何其他组件一样，我们需要彻底测试异常处理代码，以帮助我们的应用程序能够优雅地管理错误。我们花费了大量时间对异常处理进行建模，并希望确保它在不利条件下行为是可预测的。\n\
  \n以下是测试异常处理的主要原因：\n\n* 确保我们的应用程序是健壮的。\n* 确保我们的应用程序是可靠的。\n* 验证程序可以从故障中恢复。\n* 确保我们向用户和日志提供了有意义的反馈。\n\
  * 捕获处理不当或传播的异常，以防止运行时错误。\n* 确保我们的错误处理逻辑遵循最佳实践。\n* 确保我们的错误处理没有引入新问题。\n\n有几种技术可以支持我们的测试工作。`JUnit`\
  \ 是一个单元测试框架。它允许我们编写和运行重复的测试，以帮助代码行为符合预期。我们将在第 13 章 调试、测试与部署中详细介绍 `JUnit`。在本节中，将在不使用\
  \ `JUnit` 的情况下实现测试。\n\n以下是不使用 `JUnit` 测试异常的一些用处：\n\n* 我们可以进行自包含测试，而不需要安装或配置外部库。\n\
  * 它可以让我们对测试原理有更深入的。\n* 它是简单项目的轻量级解决方案。\n\n我们的测试技术包括使用 `try-catch` 块、异常属性验证以及模拟错误条件。\n\
  \n让我们查看检查异常和非检查异常（标准和自定义）的示例。\n\n### 测试检查异常\n\n让我们测试一个抛出 `FileNotFoundException`\
  \ 的方法。\n\n以下是我们要测试的代码：\n\n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  import java.util.Scanner;\n\npublic class MyFileReader {\n    public String readMyFile(String\
  \ fileName) throws FileNotFoundException {\n        File file = new File(fileName);\n\
  \        Scanner scanner = new Scanner(file);\n        return scanner.nextLine();\n\
  \    }\n}\n```\n\n现在，让我们写一个测试用例。\n\n```java\nimport java.io.FileNotFoundException;\n\
  \npublic class MyFileReaderTest {\n    public static void main(String[] args) {\n\
  \        MyFileReader fileReader = new MyFileReader();\n        try {\n        \
  \    fileReader.readMyFile(\"nonexistentfile.txt\");\n            System.out.println(\"\
  Test failed: No exception was thrown.\");\n        } catch (FileNotFoundException\
  \ e) {\n            System.out.println(\"Test passed: Caught FileNotFoundException.\"\
  );\n            System.out.println(\"Exception message: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n以下是我们测试的输出：\n\nTest passed: Caught FileNotFoundException.\n\
  Exception message: nonexistentfile.txt (No such file or directory)\n\n正如你在示例中看到的，`try`\
  \ 块调用了 `readMyFile()` 方法；那是我们正在测试的方法。`catch` 块确认了异常被抛出。\n\n### 测试非检查异常\n\n让我们测试一个抛出\
  \ `IllegalArgumentException` 的方法。为了测试非检查异常，我们将写一个针对无效输入抛出该异常的方法。\n\n以下是我们要测试的代码：\n\
  \n```java\npublic class MyMathToolkit {\n    public int divide(int numerator, int\
  \ denominator) {\n        if (denominator == 0) {\n            throw new IllegalArgumentException(\"\
  Denominator cannot be zero.\");\n        }\n        return numerator / denominator;\n\
  \    }\n}\n```\n\n以下是我们可以用来测试非检查异常的代码：\n\n```java\npublic class MyMathToolkitTest\
  \ {\n    public static void main(String[] args) {\n        MyMathToolkit mathToolkit\
  \ = new MyMathToolkit();\n        try {\n            mathToolkit.divide(19, 0);\n\
  \            System.out.println(\"Test failed: No exception was thrown.\");\n  \
  \      } catch (IllegalArgumentException e) {\n            System.out.println(\"\
  Test passed: Caught IllegalArgumentException.\");\n            System.out.println(\"\
  Exception message: \" + e.getMessage());\n        }\n    }\n}\n```\n\n这是我们程序的输出：\n\
  \nTest passed: Caught IllegalArgumentException.\nException message: Denominator\
  \ cannot be zero.\n\n在前面的示例中，我们验证了在尝试除零时抛出了 `IllegalArgumentException`。我们还提供了异常消息以便验证其正确性。\n\
  \n### 测试自定义异常\n\n以下是一个名为 `InvalidInputException` 的自定义异常：\n\n```java\npublic class\
  \ InvalidInputException extends Exception {\n    public InvalidInputException(String\
  \ message) {\n        super(message);\n    }\n}\n```\n\n让我们编写抛出该异常的代码：\n\n```java\n\
  public class MyInputValidator {\n    public void validateTheAge(int age) throws\
  \ InvalidInputException {\n        if (age < 21) {\n            throw new InvalidInputException(\"\
  Minimum age allowed is 21.\");\n        }\n    }\n}\n```\n\n以下是我们可以用来测试 `validateTheAge()`\
  \ 方法的代码：\n\n```java\npublic class MyInputValidatorTest {\n    public static void\
  \ main(String[] args) {\n        MyInputValidator validator = new MyInputValidator();\n\
  \        try {\n            validator.validateTheAge(15);\n            System.out.println(\"\
  Test failed: No exception was thrown.\");\n        } catch (InvalidInputException\
  \ e) {\n            System.out.println(\"Test passed: Caught InvalidInputException.\"\
  );\n            System.out.println(\"Exception message: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n我们测试的输出如下：\n\nTest passed: Caught InvalidInputException.\n\
  Exception message: Minimum age allowed is 21.\n\n我们的测试确认了异常类型，并验证了我们的自定义消息。\n\n\n\
  \n\n\n作为最后一个测试用例，让我们来测试一个具有额外字段的自定义异常。以下是我们要测试的代码：\n\n```java\npublic class MyCustomException\
  \ extends Exception {\n    private int errorCode;\n\n    public MyCustomException(String\
  \ message, int errorCode) {\n        super(message);\n        this.errorCode = errorCode;\n\
  \    }\n\n    public int getErrorCode() {\n        return errorCode;\n    }\n}\n\
  ```\n\n现在，我们可以写一个测试用例：\n\n```java\npublic class MyCustomExceptionTest {\n    public\
  \ static void main(String[] args) {\n        try {\n            throw new MyCustomException(\"\
  Custom error occurred.\", 404);\n        } catch (MyCustomException e) {\n     \
  \       System.out.println(\"Test passed: Caught MyCustomException.\");\n      \
  \      System.out.println(\"Message: \" + e.getMessage());\n            System.out.println(\"\
  Error Code: \" + e.getErrorCode());\n        }\n    }\n}\n```\n\n以下是我们的测试输出：\n\n\
  ```\nTest passed: Caught MyCustomException.\nMessage: Custom error occurred.\nError\
  \ Code: 404\n```\n\n我们的测试确保了自定义异常的消息和额外属性（`errorCode`）是正确的。\n\n### 最佳实践\n\n以下是在\
  \ Java 应用程序中测试异常处理的最佳实践：\n\n*   在测试用例中使用描述性的输出，以便明确测试是通过还是失败的。\n*   为你的测试模拟真实的场景，重点关注边界情况，如空值、空输入等。\n\
  *   验证异常消息和任何额外属性。\n*   显式地验证异常类型。\n\n本节重点介绍的是手动测试，而不是使用 `JUnit` 等框架。这种方法对于小型程序通常足够了，但缺乏自动化将使大型程序的测试变得困难且低效。手动测试还可能引入人为错误，因此对于较大的系统，建议使用如\
  \ `JUnit` 等框架进行测试，这将在第 13 章 调试、测试与部署中进行介绍。\n\n## 结论\n\n在本章结束时，我们已经将异常处理确认为编写健壮、可维护且用户友好的\
  \ Java 应用程序的基础技能。我们探索了 Java 用于管理错误和异常的健壮框架，它允许我们预测、处理并优雅地从可预见和不可预见的问题中恢复。本章检查了 Java\
  \ 的异常层次结构，包括错误（errors）、检查异常（checked exceptions）和非检查异常（unchecked exceptions）之间的区别。你有机会学习如何抛出和传播异常，这为程序处理错误的方式提供了灵活性。\n\
  \n本章还介绍了自定义异常的创建，这允许我们更清晰、更准确地封装特定的特定问题。最后，本章探索了测试异常处理的技术，有助于确保应用程序能够在各种条件下可预测且可靠地处理错误。\n\
  \n在下一章中，我们将讨论数据结构，包括数组和数组列表，并将它们扩展到 Java 集合框架。我们的涵盖将包括如何操作列表（lists）、集合（sets）、映射（maps）和队列（queues）。章节还将涵盖集合的排序和搜索，以及迭代器和增强\
  \ for 循环的作用。掌握这些结构可以帮助你编写高效、可扩展的代码来处理大型数据集。\n\n## 记忆点\n\n*   自定义异常可以提供有关特定错误的额外上下文，通过扩展\
  \ `Exception` 或 `RuntimeException` 类创建。\n*   在测试异常处理时，务要验证异常属性（如消息和自定义字段）。\n*  \
  \ 避免常见的陷阱，例如使用空 catch 块、捕获通用异常以及过度使用检查异常，这些会掩盖有的错误处理。\n*   检查异常在编译时强制执行，应用于可预见的、可恢复的问题，例如文件\
  \ I/O 或数据库操作。\n*   关闭文件或数据库连接等资源应在 `finally` 块中或使用 `try-with-resources` 进行更好的资源管理。\n\
  *   自定义异常应具有自描述性的名称和有意义的消息，以提高代码清晰度和可调试性。\n*   在方法签名中使用 `throws` 关键字记录异常，以便在无法在本地处理时传播检查异常。\n\
  *   错误（Errors），如 `OutOfMemoryError` 和 `StackOverflowError`，代表了应用程序通常无法恢复的严重问题，不应在代码中处理。\n\
  *   异常传播允许异常沿调用栈向上传递，直到它被捕获处理或程序终止。\n*   异常测试有助于确保我们的应用程序能够在恶劣条件下优雅地处理错误并可预测地恢复。\n\
  *   优雅地处理异常可确保应用程序保持健壮性、用户友好性和可维护性。\n*   Java 的异常层次结构根于 `Throwable` 类，该类分为 `Error`\
  \ 和 `Exception` 的子类。\n*   可以使用多个 catch 块来处理不同类型的异常，Java 会执行第一个匹配的块。\n*   `Throwable`\
  \ 类提供了实用的方法，如 `getMessage()`、`printStackTrace()` 和 `getCause()`，用于检查和诊断异常。\n*  \
  \ `finally` 块无论是否发生异常都会执行，通常用于清理工作。\n*   使用 `throw` 关键字有意识地抛出异常，有助于信号和管理无法直接解决的特定应用程序问题。\n\
  *   `try-catch-finally` 块构成了 Java 异常处理框架的基础，允许错误恢复和资源清理。\n*   非检查异常（如 `NullPointerException`\
  \ 和 `IllegalArgumentException`）源于编程错误，且在编译时不进行强制执行。\n*   使用描述性的测试输出消息来清晰地指示异常处理测试是成功还是失败的。\n\
  *   使用特定的异常类型（如 `IllegalArgumentException`）而不是通用的异常（如 `Exception`），以提高调试性和清晰度。\n\
