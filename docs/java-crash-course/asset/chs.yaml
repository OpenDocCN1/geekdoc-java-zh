  \ `java -version` 以显示电脑上安装的 Java 版本。\n\n示例输出如下：\n\n```\njava version \"23\" 2024-09-17\n\
  Java(TM) SE Runtime Environment (build 23+37-2369)\nJava HotSpot(TM) 64-Bit Server\
