  3. 它减少了程序中的行数\n4. 它自动化了编译、依赖管理、测试和部署\n\n### 答案\n\n| 1. | d. |\n| 2. | d. |\n| 3.\
  \ | b. |\n| 4. | d. |\n| 5. | d. |\n\n## 问题\n\n1. 调试是软件开发中至关重要的部分。在你自己的项目中使用过哪些调试策略？它们与\
