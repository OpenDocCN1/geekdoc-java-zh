  \ 以确保你的系统识别 JDK 23。\n\n输出将如下：\n\n```\njava version \"23\" 2024-09-17\nJava HotSpot(TM)\
  \ 64-Bit Server VM (build 23+37-2369, mixed mode, sharing)\n```\n\n接下来，我们将验证系统是否识别\
  \ Java 编译器。输入 `javac -version`。你的输出应该反映以下内容：\n\n```\n```\n\n现在我们已经安装了 JDK 23，创建了环境变量并验证了安装，我们准备好选择、下载并配置\
