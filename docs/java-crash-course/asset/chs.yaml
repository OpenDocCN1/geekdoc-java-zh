  \ `Java` 数据库应用程序的数据完整性至关重要？\n2. 解释 `JDBC` 中 `Statement` 和 `PreparedStatement` 的区别。为什么通常优先使用\
  \ `PreparedStatement`，特别是在处理用户输入时？\n3. 在关系数据库中，`FK`（外键）的作用是什么？它如何帮助维护数据完整性？使用 `Bougie\
  \ Books` 数据库模式举例说明。\n4. 想象你正在为一家在线书店开发 `Java` 应用程序。你发现按标题搜索书籍的查询缓慢。你可以采取哪些步骤利用本章涵盖的技术来优化查询性能？\n\
  5. 思考一个现实世界的应用（例如电子商务平台、银行系统或社交网络）。你将如何在应用程序中实现事务管理，以确保在复杂操作（如下单或转账）期间的数据完整性？\n\n\
  ### 答案\n\n1. 以下 `ACID` 特性对于防止数据损坏至关重要，特别是在多用户环境中：\n    - **原子性 (Atomicity)** 确保事务被视为一个单元；要么所有操作都成功，要么全都不成功。\n\
  \    - **一致性 (Consistency)** 保证事务将数据库从一个有效状态转换为另一个有效状态，维护数据完整性。\n    - **隔离性 (Isolation)**\
  \ 确保并发事务之间互不干扰，保护数据准确性。\n    - **持久性 (Durability)** 保证一旦事务提交，其更改就是永久的，即使在系统崩溃的情况下也是如此。\n\
  \n2. `Statement` 与 `PreparedStatement`：\n    - `Statement` 直接执行静态 SQL 查询，当用户输入被连接到查询中时，往往会导致\
  \ SQL 注入等漏洞。\n    - `PreparedStatement` 允许参数化查询，使用占位符（`?`），并将用户输入安全地绑定到这些占位符。这种方法防止了\
  \ SQL 注入，并且通常会产生更好的性能，因为 SQL 执行计划可以被重用。\n\n3. 外键在两个表之间建立关系，将一个表中的列链接到另一个表中的主键。这强制执行了引用完整性，确保一个表中的记录与另一个表中的有效条目对应。\n\
  \    - **示例 (Bougie Books)**:\n```sql\nCREATE TABLE Orders (\n  order_id INTEGER\
  \ PRIMARY KEY,\n  order_date TEXT NOT NULL,\n  cust_id INTEGER,\n  FOREIGN KEY (cust_id)\
  \ REFERENCES Customers(cust_id)\n);\n```\n\n4. 以银行系统为例（其中用户可以在账户之间转账），我们通过以下步骤确保数据完整性：\n\
  \    - 使用事务将从一个账户的扣款和另一个账户的增加封装在一个工作单元中。\n    - 只有在两个操作都成功时才执行 `commit`。否则，使用 `rollback`\
  \ 还原任何部分更改。\n\n加入我们的 Discord 空间\n\n加入我们的 Discord 工作区获取最新更新、优惠、全球科技动态、新发布以及与作者的交流：\n\
  \n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\n![QR-Logo](img/fm1.png)\n\
  \n# 第 11 章 GUI 编程\n\n## 引言\n\n图形用户界面（GUI）是现代应用程序的重要组成部分。它们为用户提供了与我们的应用程序进行交互的视觉界面。它是用户体验设计的一部分，旨在为用户提供视觉吸引力且交互性的体验。\n\
  \n构建应用程序的 GUI 有多种方法。我们可以使用较旧的库，如 `Swing` 和 `抽象窗口工具包` (`AWT`)，或者使用构建健壮 GUI 的事实标准\
  \ `JavaFX`，特别是对于桌面应用程序。虽然有像 `Electron` 和 `Qt` 这样较新的框架，但本章重点关注 `JavaFX` 作为主要的 Java\
  \ GUI 开发方法。\n\n本章将探索使用 `JavaFX` 进行 GUI 开发的基础知识。我们的涵盖从概述和设置 `JavaFX` 环境开始。接下来，我们将研究\
  \ `JavaFX` 的核心概念，包括场景图、布局和事件处理机制。本章将演示如何创建按钮、文本字段和菜单等 UI 元素，以及如何通过事件驱动编程处理用户交互。你将学习到属性绑定（property\
  \ binding），它允许 UI 元素与底层数据之间进行无缝更新。我们还将探索可观察对象（observables）的概念，以实现动态响应响应的界面。\n\n\
  我们将使用一个 `个人财务跟踪器` (`PFT`) 桌面应用程序来演示 `JavaFX` 概念。\n\n## 结构\n\n本章涵盖了以下主题：\n\n- `JavaFX`\
  \ 基础\n- 设置 `JavaFX` 环境\n- 理解场景图\n- 布局、控件和事件处理\n- 绑定属性和可观察对象\n- 完成 `PFT` 应用程序\n\n\
  ## 目标\n\n在本章结束时，你应该能够配置包含 `JavaFX` 的本地开发环境。你应该熟悉 `JavaFX` 的架构及其布局。通过遵循示例并执行活动，你应该能够实现用户界面控件，处理用户交互并应用属性绑定和可观察对象。此外，在本章结束时，你应该能够创建一个基础\
  \ `JavaFX` 应用程序。\n\n## JavaFX 基础\n\nJava 有悠久的 GUI 开发历史，从 `Swing` 和 `AWT` 工具包开始。`JavaFX`\
  \ 由 Sun 公司于 2008 年底创建。两年后，Oracle 收购了 Sun 公司并支持了 `JavaFX` 约八年。从那时起，`JavaFX` 以 `OpenJFX`\
  \ 项目的名得到了开源社区的支持。\n\n| 注意：Sun 公司是 Java 的原创者。 |\n\n`JavaFX` 是一个 GUI 框架，允许我们使用 Java\
  \ 构建交互式桌面应用程序。它包含了用于 UI 控件的内置工具、使用层样式表 (`CSS`) 进行数据和样式绑定以及多媒体支持。`JavaFX` 的前身是 `Swing`\
  \ 和 `AWT`。\n\n`JavaFX` 相比于那些 GUI 框架的优势包括：\n\n- `CSS`样式支持\n- 用于 UI 定义的 FX 标记语言 (`FXML`)\n\
  - 多媒体支持\n- 更新的 UI 组件，包括图表\n- 场景图模型（在本章稍后介绍）\n- 跨平台兼容性\n- GPU 加速\n\n对上述特征的审查将让你对\
  \ `JavaFX` 框架为何被广泛应用于企业应用程序、桌面仪表板和数据可视化工具不再产生疑虑。\n\n### 架构\n\n`JavaFX` 使用层级结构，如图\
  \ 11.1 所示。\n\n\n\n\n\n`Stage` 是应用程序的主窗口，包含了所有的 UI 元素；`Scene` 是 `Stage` 内部的内容区域，而\
  \ `Nodes` 是单独的 UI 组件（例如：按钮、标签、输入框等），如所示：\n\n![一个流程图，顶部是 Stage，指向 Scene，Scene 向下分支到三个标记为\
  \ Node 的并行方框。](img/Figure_11.1.png)\n\n图 11.1: JavaFX 层级结构\n\n处理层级结构是两个重要组件之一。首先是事件驱动的编程模型，它让我们的代码能够对点击按钮等用户行为做出响应。另一个重要组件是属性绑定（binding\
  \ properties），它允许 UI 组件在底层数据更改时进行动态更新。\n\n让我们仔细观察 JavaFX 架构的核心组件。首先，必须有一个启动 GUI\
  \ 的 `Application` 类。`stage` 是主窗口，负责显示 UI 元素。虽然总会有一个主阶段框（primary stage），但我们可以创建额外的\
  \ `stages`（额外的窗口）。在 `stage` 内部是 `scenes`。`scenes` 持有 UI 组件并组织成场景图（scene graph，在本章稍后会介绍）。单个\
  \ UI 组件被称为 `nodes`。\n\n前面提到的事件驱动编程模型基于事件监听器（event listeners），它允许我们的 UI 组件对用户点击、在文本框中捕获用户输入、响应菜单选择等做出。这些事件监听器结合将\
  \ UI 组件绑定到数据的能力，可以构建出高度动态且交互的应用程序 GUI。\n\n### PFT 计划\n\n随着本章的进展，我们将逐步开发一个 PFT 桌面应用程序。我们的应用程序将允许用户跟踪收支并可视化财务趋势。我们还将实现数据持久化。\n\
  \n以下是我们如何使用 JavaFX 创建 PFT GUI 的计划：\n\n*   `Stage` 和 `scene`：\n    *   定义主应用程序窗口。\n\
  \    *   组织 UI 元素。\n*   `Layouts` 和控件：\n    *   设计结构化的用户输入表单。\n*   `Event handling`：\n\
  \    *   捕获按钮点击。\n    *   响应表单提交。\n*   `Property binding`：\n    *   根据用户操作动态同步 UI\
  \ 元素。\n\n在本章结束时，你应该拥有一个基于 JavaFX 的功能性财务管理器，它反映了一个使用 Java 开发的真实应用。\n\n## 设置 JavaFX\
  \ 环境\n\n本节提供了关于为 JavaFX 开发准备开发环境的信息。我们将使用 Visual Studio Code (VS Code)。\n\n我们的目标是使用\
  \ JavaFX 开始开发我们的 PFT 桌面应用程序。我们将从准备工作开始，包括 Java 开发工具包 (`JDK`)、JavaFX 软件开发包包 (`SDK`)\
  \ 以及所需的扩展程序。接下来，我们将创建一个 JavaFX 项目来验证我们的设置。\n\n最后，我们将讨论接下来的步骤以及 PFT 桌面应用程序的计划。\n\n\
  ### 前提条件\n\nJavaFX 不包含在现代版本的 `JDK` 中，因此我们需要在项目中显式地配置它。\n\n| 注意：JDK 排除 JavaFX 反映了其支持从\
