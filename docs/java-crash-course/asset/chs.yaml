  \n\n## 引言\n\n本章将重点介绍为什么理解 Java 对现代软件开发者和工程师有益。我们将主要介绍设置 Java 开发环境，并提供帮助你编写和运行第一个\
  \ Java 程序的指南。\n\n本章涵盖了以下主题：\n\n* Java 概述\n* Java 的历史与演变\n* Java 的重要\n* Java 与现代软件开发的相关性\n\
  * 编写并运行你的第一个 Java 程序\n\n## 目标\n在本章结束时，我们将涵盖 Java 的历史和演变，并描述学习 Java 的意义。我们还将建立用于\
  \ Java 编程的开发环境，编写并执行一个简单的 Java 程序，并理解 Java 语法。\n\nJava 是一种于 1995 年引入的高级编程语言，至今仍然是世界上最流行的语言之一。这种流行归因于众多原因，包括它的可读性、面向对象的特性、可用的库和工具、可扩展性等。它被归类为高级语言，是因为人类和计算机都能读懂\
  \ Java 代码。Java 广泛使用的另一个原因是它是跨平台语言。这意味着你可以在自己的电脑上编写 Java 代码（无论是 Mac、PC 还是 Linux 机器），并且编译后的代码可以在任何安装了\
  \ Java 虚拟机（`JVM`）的设备上运行。这对于开发者来说是一个巨大的优势。\n\n在接下来的章节中，我们将详细讨论 Java 的关键特性、架构和平台。\n\
  \nJava 凭借其丰富的特性成为人们首选的编程语言。让我们来看其中的一些特性：\n\n* **平台无关性**：当我们用 Java 编程时，我们会创建带有 `.java`\
  \ 扩展名的文本文件。一旦完成应用程序，我们就把代码编译成字节码，字节码可以在任何安装了 `JVM` 的设备上执行。这可能是 Java 编程语言最受推崇的特性，因为我们不需要担心执行程序的计算机操作系统（`OS`）或环境。Java\
  \ 让我们能够专注于应用程序的编码，而不必担心繁琐的多系统间迁移操作。\n* **面向对象编程 (OOP)**：Java 是一种面向对象的语言，这意味着对象既代表行为也代表应用程序的数据。这种编程方法帮助我们创建模块化、可扩展且易于维护的应用程序。正如第\
  \ 3 章面向对象编程基础所示，主要的 OOP 原则是是抽象、封装、继承和多态。Java 对 OOP 的实现让开发者能够轻松使用，因此它是 Java 的关键特性之一。\n\
  * **垃圾回收 (GC)**：Java 包含一个名为 `GC` 的自动内存管理系统，它能够自动释放不再需要的应用程序数据所占用的内存。由系统自动完成工作节省了大量时间。我们在讨论对象生命周期时，将在第\
  \ 4 章高级 OOP 概念中介绍 `GC`。`GC` 自动化且高效的方式使其成为一个值得研究的关键特性。\n* **侧重安全性**：Java 因其安全的运行时环境被认为是一种安全语言。`JVM`\
  \ 在验证我们的字节码方面表现出色（记住，字节码是代码与 `JVM` 之间的中间文件），以确保其不包含恶意代码。Java 还有额外的安全相关特性，包括安全应用程序编程接口（`API`），使我们能够加密、身份验证等。Java\
  \ 对安全的关注使其在选择编程语言时成为极具吸引力的选择。\n* **多线程支持**：在第 7 章并发与多线程中，我们将有机会探索 Java 的原生多线程支持。这允许我们编写程序同时运行多个操作（并发）。这让我们能够利用具有多个核心的现代系统。正如你所看到的，Java\
  \ 包含一个 `Executor` 框架，我们可以用它控制线程池，从而获得更高的效率和更智能的资源管理。\n\n对这六个特性的回顾让我们了解 Java 编程语言的健壮性。\n\
  \nJava 架构的三个核心组件是 Java 开发包（`JDK`）、`JVM` 和 Java 运行环境（`JRE`）。这些组件的定义如下：\n\n* **JDK**：我们使用\
  \ `JDK` 开发 Java 应用程序；它是基础。`JDK` 包含了 `JRE`（见后续）以及将 Java 代码编译为字节码的工具。\n* **JVM**：`JVM`\
  \ 执行这些字节码（编译后的 Java 代码）。正如我们之前提到的，`JVM` 负责让 Java 成为平台无关语言。它通过作为宿主机操作系统 `OS` 与 Java\
  \ 应用程序之间的中间件来实现。`JVM` 的中间角色涉及抽象任何硬件和 `OS` 细节，并将字节码（平台无关）翻译成机器码。\n* **JRE**：`JRE`\
  \ 是 Java 编程语言的第三个核心组件。它包含了 `JVM` 以及允许我们执行 Java 程序的库。\n\nJava 提供了四个平台；每个平台都是针对独特的开发目的设计的。第一个版本是\
  \ Java 标准版（`Java SE`）。该版本提供了所有 Java 程序的基础核心库和 `API`。这个标准版非常强大，并用于整本书的编码示例。\n\nJava\
  \ 企业版（`Java EE`）平台可以被视为 Java SE 的进阶。Java `EE` 包含了支持企业级应用开发的库，包括大规模系统、多层应用以及安全可扩展的网络应用。\n\
  \nJava 微型版（`Java ME`）平台是 Java SE 的子集，因为它设计用于运行在缺乏大型系统的计算、内存和存储资源的设备上。该版本包含的 `JVM`\
  \ 占用小。典型部署包括嵌入式系统和物联网（`IoT`）设备。\n\n\n\n\n\n\n\n## 快速采用\n软件开发者迅速采用 Java 平台来创建 Web\
  \ 应用程序，随着 Java 的改进，它开始被用于企业和大型系统。Java 2 于 20 世纪 90 年代后期推出，并介绍了上一节描述的 `Java SE`、`Java\
  \ EE` 和 `Java ME`。这使得语言适用于所有开发者，无论他们是在开发桌面电脑软件、创建大型企业系统、为移动设备创建应用程序，还是为嵌入式系统编写代码。Java\
  \ 跃升成为新应用程序最常用的编程语言。\n\n在 Java 推出约 15 年后，它于 2010 年 10 月被 Oracle 收购。Oracle 一直是 Java\
  \ 出色的管理者，正如我们看到的，它不断演进并跟上当代开发的需求。他们实施了六个月一次的发布计划，导致新功能不断发布。这有助于 Java 在拥有多种选择的开发者中保持相关性。今天有数百种编程语言在使用，但自最初发布以来，Java\
  \ 一直位列大多数列表的前五。\n\n## 准备面对未来\n如今，Java 仍然是多个行业中最流行的编程环境之一，包括学术界、商业、通信、金融、医疗保健等。它继续演进，并拥有极其活跃的开发者社区。Java\
  \ 的持续演进将跟上我们的现代开发需求。\n## Java 的重要性\nJava 是所有类型应用中最广泛使用的编程语言之一，包括嵌入式系统、移动应用程序、桌面解决方案、大型企业系统、分布式系统等。这种流行与你为什么应该学习\
  \ Java 的原因不同；让 Java 如此流行的原因在于学习使用 Java 编程是值得你投入时间的。\n\n以下是 Java 可能是你开发需求良好选择的一些原因：\n\
  * 你可以在运行 Windows、macOS 或 Linux 的系统上使用 Java 进行开发。\n* Java 是平台无关的，因此你可以在电脑上开发一次，并将应用程序部署到任何地方。\n\
  * Java 支持模块化、多线程、流等现代概念。\n* Java 包含了带有垃圾回收器的自动内存释放功能。这为我们节省了无需在应用程序中手动编写内存释放程序的大量时间。\n\
  * Java 语言的工具、库和扩展数量是惊人的，开发者社区也是如此。\n\n在随后的章节中，你将发现入门 Java 是很容易的。我们可以免费下载 `Java SE`\
  \ 和 `JDK`，并在免费的集成开发环境 (IDE) 中使用它们，因此启动成本为零。\n\n除了学习 Java 来解决当前的编程需求外，Java 开发者的需求也非常迫盛。搜索任何招聘网站，你都会看到多条针对\
  \ Java 开发者和具备 Java 知识的软件工程师的招聘信息。\n## Java 与现代软件开发的相关性\nJava 与现代软件开发具有高度相关性，是无数在各行业中创建和维护应用程序的开发者的首选语言。开发人员通常被要求开发可以部署在多个设备上的系统。Java\
  \ 的平台独立性使这一切变得简单，为开发人员和产品团队节省了时间并减少恼。\n\nJava 与现代软件开发如此相关的原因之一是其强大的生态系统，它包含了工具、库和框架，这些可以简化并缩短开发时间。这个生态系统让我们能够轻松创建可扩展、模块化且可维护的系统。\n\
  \n### 新范式\n\n### 安全性\n当隐私和数据保护很重要时（例如金融、政府和医疗保健应用），安全性对于几乎所有的软件开发项目都是至关重要的。Java\
  \ 是一种类型安全的语言，这意味着它允许在指定的数据类型上执行操作。\n\n应用程序运行时安全至关重要的是内存中数据的管理方式。正如你将在 第 4 章，高级 OOP\
  \ 概念中读到的，Java 拥有自动化过程，当应用程序不再需要数据时释放内存中的数据。这个过程 `GC` 不仅是一项安全功能，也有助于整体系统的性能。\n\n\n\
  ## 设置开发环境\n要为你的电脑设置 Java 开发环境，涉及以下步骤：\n1. 下载并安装 `JDK`\n2. 设置环境变量\n3. 选择并配置 IDE\n\
