  \      showAlert(\"Error\", \"加载交易失败.\");\n    }\n}\n```\n\n最后，在 `Create Scene`\
  \ 之前添加以下方法调用：\n\n```java\nloadFromFile();\n```\n\n#### 最后回顾\n\n让我们遍历我们的 PFT 应用以验证一切运行正常。首先，这些是导入语句：\n\
