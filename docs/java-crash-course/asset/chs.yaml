- "# Java 快速入门指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给 Java，不是指那种语言，而是我们已故的三色威尔士柯基犬。它被名叫\
  \ Java，是因为我对这种语言的喜爱，以及我妻子对优质有机咖啡的热爱。在写这本书的过程中，我一直挂念它。\n\n# 关于作者\n\nEdward Lavieri\
  \ Jr. 博士是一位软件工程师也是学者。他开发软件已有近四十年。他的项目包括分布式全栈应用、移动应用、桌面应用和组件应用。虽然他的核心身份是软件工程师，但也担任一个大学系统的院长，该系统包含计算机科学学院、信息技术学院和一个编码训练营（他在后者中担任首席学术官）。他喜欢用技术解决现实世界的业务问题。\n\
  \nEdward 于 2014 年获得科罗拉多技术大学计算机科学博士学位，拥有三个硕士学位和多个研究生证书，是电气电子工程师学会（IEEE）的高级会员。他已出版十余部技术书籍。\n\
  \n# 关于评审员\n\n* Dimakatso 是一位软件开发者，拥有计算机科学学士学位，拥有 8 年以上的软件开发经验。他擅长使用尖端技术，例如使用 Spring/Quarkus\
  \ 构建高性能后端，使用 Angular/React 构建直观的用户界面，以及使用 React Native 进行移动开发。他的专业知识涵盖了从系统设计到部署的全开发生命周期，确保无缝集成和用户满意。\n\
  * Serhad 是一位拥有 17 年经验的 Java 开发者。他广泛使用 Spring 和更广泛的 Java 生态系统构建可扩展且可维护的软件解决方案。他的专业背景包括深度参与企业级应用开发和系统集成。工作之余，他喜欢阅读历史和探索编程语言；对塑造技术和人类进步的思想始终保持好奇。\n\
  \n# 致谢\n\n感谢每一位为这本书做出贡献的人。\n\n感谢我的妻子，她对我维持工作、写作与生活之间的平衡至关重要。\n\n我也非常感谢 BPB Publications\
  \ 的信任。感谢你们在写这本书的每一步提供的指导和支持。\n\n我还要感谢帮助完成最终最终的评审员、技术专家和编辑。你们的见解和专业知识无疑提升了这本书的质量。\n\
  \n# 前言\n\nJava 是今天最流行的编程语言之一，驱动着从企业级应用到移动平台的一切领域。无论你是刚刚开始编程之旅，还是从其他语言转型到 Java，《Java\
  \ 速成》都是你掌握这种强大语言的必备指南。\n\n本书将带你从 Java 语法、数据类型和控制结构的基础开始，一步步通过核心面向对象编程（OOP）概念，一直到并发、流和图形用户界面（GUI）等高级主题。在此过程中，你将学习如何处理异常、操作集合、连接数据库，并获得使用\
  \ lambda 和函数式编程等现代 Java 特性的经验。实操练习、真实世界项目和清晰的示例可以加强你的理解，并提供可以立即应用的实用技能。\n\n读完这本书后，你不仅应该对\
  \ Java 有深入的理解，还有信心构建可扩展、高效的应用程序并从容应对现实世界的编码挑战。无论你是学生、开发者还是 IT 专业人士，这门速课程都能为你提供在职业生涯中取得所需的技能。\n\
  \n- 本章介绍了 Java 编程语言及其生态系统。章节从 Java 的简史开始，介绍了它是如何演变的，以及它如何在现代软件开发行业中保持相关性。学习 Java\
  \ 的益处从未像现在这样巨大，特别是在今天企业级应用、云计算和移动开发的世界中。本章还将引导你搭建开发环境，包括安装 Java 开发包（`JDK`）和配置集成开发环境（`IDE`）。最后，你将有机会编写并运行你的第一个\
  \ Java 程序，从一开始就获得对该语言的实践经验。\n\n- 本章探索了每个 Java 程序员必须掌握的基础概念。从数据类型和变量开始，章节介绍了 Java\
  \ 如何处理信息，随后概述了构成程序决策和逻辑基础的运算符和控制结构。本章探讨了如何编写方法、理解参数、返回类型和作用域，这些对于构建可重用的代码至关重要。到本章结束，你应该牢牢掌握\
  \ Java 的核心语法和功能，并准备应对更复杂的问题。\n\n- 本章介绍了面向对象编程（OOP），这是让 Java 成为多功能且强大语言的关键范式之一。涵盖了封装、继承、多态和抽象等\
  \ OOP 原则。章节还涵盖了如何定义和使用类与对象、管理构造函数和重载，并探索了 `super` 关键字以增强代码的可重用性和维护性。通过示例和练习，本章将向你展示如何应用这些原则来设计健壮、可扩展的软件应用程序。\n\
  \n- 在 OOP 基础的基础上，本章探索了接口和抽象类等高级主题，这些主题为 Java 设计提供了灵活性和扩展性。章节演示了如何使用接口实现多继承，并探索了函数式接口和默认方法，这些是强大的现代\
  \ Java 工具。章节还涵盖了 lambda 和方法引用，它们简化了 Java 中的函数式编程，使你的代码更加整洁简洁。到本章结束，你应该对如何用面向对象的方法构建大型复杂应用程序有更深入的理解。\n\
  \n\n\n\n\n有效的错误处理对于创建健壮的 Java 应用程序关重要，本章将为你介绍 Java 复杂的异常处理系统。本章探讨了检查异常（checked exceptions）与运行时异常（unchecked\
  \ exceptions）之间的区别，如何使用 `try-catch-finally` 块，以及如何在代码中抛出和处理异常。此外，你还可以学习如何创建自定义异常以及处理错误的最佳实践。本章的目标是帮助你能够优雅地处理意外问题，并构建失败安全且提供丰富信息的应用程序。\n\
  \n本章探索了数据结构，从数组和数组列表开始，扩展到 Java 集合框架（JCF）。内容包括如何处理列表（lists）、集合（sets）、映射（maps）和队列（queues），帮助你理解何时使用每种。章节还涵盖了集合的排序和搜索，以及\
  \ `iterators` 和增强型 `for` 循环的作用。你可以学习如何使用 `Comparable` 和 `Comparator` 接口来比较对象，并利用\
  \ Java 的工具类来简化集合管理。掌握这些结构可以帮助你编写出高效、可扩展的代码来处理大型数据集。\n\n并发是现代软件的一个重要方面，本章将向你介绍 Java\
  \ 中的多线程。本章首先解释如何使用 `Thread` 类和 `Runnable` 接口创建并管理线程。从那里开始，章节探讨了同步、锁（locks）以及简化并发编程的\
  \ `Executor` 框架。本章还涵盖了 Java 的并发工具类，如 `CountDownLatch` 和 `CyclicBarrier`，为你提供了管理复杂线程交互的工具。强调了编写线程安全代码的最佳实践，以帮助你避免并发编程中的常见陷阱。\n\
  \n本章重点关注 Java 中的函数式编程，特别是 Java 8 引入的 `Streams API`。本章解释了如何处理流，以函数式风格执行过滤（filtering）、映射（mapping）和归约（reducing）数据的操作。章节还探索了函数接口，例如\
  \ `Predicate`、`Consumer` 和 `Supplier`，它们是现代 Java 大许多功能的基础。提供了使用 `lambdas` 和 `parallel\
  \ streams` 的实践机会，以高效处理大型数据集。通过掌握这些技术，你可以更好地准备编写更整洁、更高效的代码。\n\n文件处理对于许多 Java 应用程序至关重要，本章向你介绍\
  \ Java 的 I/O 系统。本章解释了如何使用 `java.nio` 包读写文件，并探索了用于处理字符和字节数据的流。章节还涵盖了用于从文件中存储和检索对象的序列化与反序列化。引入了\
  \ `Buffered streams` 和 `data streams` 来优化性能，赋予你从应用程序中高效、安全地管理文件的技能。\n\n本章涵盖了使用 Java\
  \ 数据库连接（JDBC）将 Java 应用程序连接到数据库。章节展示了如何在项目中设置 `JDBC`、建立与数据库的连接以及执行 `SQL` 查询。章节还解释了如何使用\
  \ `prepared statements` 和 `callable statements` 安全且高效地与数据库交互。此外，章节还探讨了如何在 Java 中处理数据库事务，确保应用程序的一致性和可靠性。强调了数据库操作的最佳实践，以确保最佳性能。\n\
  \nGUI 允许用户通过视觉方式与应用程序交互，本章向你介绍 `JavaFX`——Java 的现代 GUI 框架。章节解释了如何在你的环境中设置 `JavaFX`\
  \ 并使用 `scene graph` 创建具有视觉吸引力的布局。章节还涵盖了处理用户事件、创建如 `buttons` 和 `text fields` 等控件，以及绑定属性以增强应用程序的交互性。在本章结束时，你应该能够用\
  \ Java 构建简单且功能齐全的 GUI 应用程序。\n\nJava 在多年年来经历了显著演变，本章探索了最近最重要的 Java 特性。你将有机会使用 `streams`\
  \ 和 `lambdas`，探索 `Project Jigsaw` 的模块，并深入研究最新 Java 版本中的特性，如 `JEP 477`（隐式声明类和实例 main\
  \ 方法）。本章还包含了现代 Java 开发的最佳实践，涵盖了用于编写高效、可维护代码的最新工具和技术。\n\n一旦写好了 Java 代码，我们必须能够对应用程序进行调试、测试、部署和支持。本章向你如何使用\
  \ IDE 工具和日志调试 Java 程序。你可以学习如何使用 `JUnit` 编写单元测试，并应用测试驱动开发（`TDD`）原则来确保你的代码可靠的。最后，章节涵盖了使用\
  \ `Maven` 和 `Gradle` 等构建工具打包和部署 Java 应用程序，帮助你准备发布生产级软件。\n\n本章为你提供了将前面章节中学到的技能应用于真实世界\
  \ Java 项目的机会。这从构建一个简单的命令行应用程序开始，进展到使用 `JDBC` 的数据库应用程序以及基于 `JavaFX` 的 GUI 应用程序。你将有机会处理一个多线程数据处理器，并使用\
  \ `streams` 和 `lambdas` 编写功能性程序。这些项目旨在帮助加强对关键 Java 概念的理解，同时提供可以应用于真实世界开发场景的实践经验。\n\
  \n最后一章总结了书中涵盖的关键概念，并提供了关于如何在本书之外继续学习 Java 的指导。章节包含了关于准备行业认证的建议，以及进一步加深知识的资源。章节还展望了\
  \ Java 开发的趋势，帮助你确保在这个快速发展的领域中保持与前沿同步。\n\n请点击以下链接下载此书的代码包（`Code Bundle`）和彩色图片（`Coloured\
  \ Images`）：\n\n\n书的代码包也托管在 GitHub 上：`https://github.com/bpbpublications/Java-Crash-Course`。如果代码有更新，将在现有的\
  \ GitHub 仓库中更新。\n\n\n## 勘误\n\n**errata@bpbonline.com**\n\nBPB Publications 全体非常感谢您的支持、建议和反馈。\n\
