  \n## 自测\n\n提供以下问题用于自测你对章节内容的掌握情况，并对关键概念运用批判性思维，如下：\n\n1. `try-catch-finally` 结构的主要目的是什么？每个块对有效的异常处理有何贡献？提供一个需要同时使用这三个块的情况示例。\n\
  2. 检查异常（checked exceptions）与未检查异常（unchecked exceptions）在用法和强制方面有何区别？描述一个检查异常比未检查异常更合适的场景。\n\
  3. 为什么你可能会选择传播异常而不是在本地处理异常？提供一个异常传播比立即处理更好的方法示例。\n4. 在创建自定义异常时，如果你的目标是确保它是有效且有意义的，应该考虑哪些因素？提供一个简短的自定义异常示例，并解释它在给定上下为何有用。\n\
  5. 假设你正在开发一个文件处理应用程序，该程序在文件缺失或损坏时偶尔失败。你将如何应用本章的概念来确保应用程序能够地处理这些错误，并向用户提供有意义的反馈？\n\
  \n### 答案\n\n1. `try` 块包含可能抛出异常的代码。`catch` 块处理 `try` 块执行期间发生的特定异常。`finally` 块用于清理操作（如关闭资源），无论是否抛出了异常。以下是一个示例：\n\
  \    - `try` 块尝试打开并读取特定文件。\n    - `catch` 块处理如 `FileNotFoundException` 等错误。\n  \
  \  - `finally` 块确保文件被关闭以避免资源泄漏。\n2. 检查异常在编译时强制执行。我们必须显式地处理它们或在方法签名中声明它们（例如 `IOException`）。它们用于可预测的、可恢复的问题。未检查异常在编译时不进行强制执行。它们通常代表编程错误，如\
  \ `NullPointerException` 或 `ArithmeticException`。\n3. 传播允许由调用堆栈中更高的方法来处理异常，该方法可能具有更多的上下文或能力来处理该错误。例如，考虑一个多层应用程序，其中数据访问方法可能会向业务逻辑层抛出\
  \ `SQLException`。业务逻辑层可以根据上下文决定是记录错误、重试操作还是通知用户。\n4. 在创建自定义异常时，我们应该考虑以下因素：\n   \
  \ - 标准异常是否足够，还是是否需要额外信息？\n    - 哪些特定属性（例如错误码）是描述问题所必需的？\n    - 异常是否自解释其义？\n\n  \
  \  示例：\n```java\npublic class InvalidInputException extends Exception {\n    private\
  \ int errorCode;\n    public InvalidInputException(String message, int errorCode)\
  \ {\n        super(message);\n        this.errorCode = errorCode;\n    }\n    public\
  \ int getErrorCode() {\n        return errorCode;\n    }\n}\n```\n为什么这个自定义异常有用？此异常专门为输入验证定制，允许我们提供详细的反馈，例如用于调试或用户通知的错误码。\n\
  5. 将本章的概念应用于文件处理应用程序中可能包括以下内容：\n    - 实现 `try-catch` 块来处理 `FileNotFoundException`\
  \ 和 `IOException` 等异常。\n    - 使用自定义异常（例如 `InvalidFileException`）来指示特定于文件处理的问题，如不支持的文件格式。\n\
  \    - 将错误记录到文件或控制台以便调试，并显示友好型消息以通知用户问题。\n    - 包含 `finally` 块以关闭文件流并释放资源，即使发生异常也是如此。\n\
  \n\n\n\n\n数据结构是我们在 Java 中存储数据的方式，每种类型的数据都有不同的结构。数据结构是编程中的基础构建模块，允许对数据进行高效的存储、检索和操作。本章介绍了本质的数据结构以及\
  \ Java 内置的集合框架。我们将介绍如何使用数组（arrays）和 `ArrayLists`，以及列表、集合、映射（maps）和队列（queues）等高级结构，这些结构都针对特定的用例进行了优化。\n\
  \n我们数据结构涵盖的关键是 `JCF`，这是 Java 提供的一个强大库，使能够对数据结构和相关的算法实现标准化。你将有机会学习如何使用 `iterators`\
  \ 遍历集合，以及使用增强型 for 循环来简化操作。在探索排序和搜索时，我们还将利用 `Comparable` 和 `Comparator` 接口。\n\n\
  ## 结构\n\n本章涵盖以下主题：\n\n*   数组和 `ArrayLists` 简介\n*   Java 集合框架 (Collection Framework)\n\
  *   使用 iterators 和增强型 for 循环\n*   对集合进行排序和搜索\n*   `Comparable` 与 `Comparator`\n\
  *   使用 Java 的工具类\n\n## 目标\n\n在本章结束时，你应该能够解释 Java 中关键数据结构的作用和功能。此外，你应该能够实现和操作数组及\
  \ `ArrayLists`，利用 Java 集合框架 (`JCF`) 来处理列表、集合、映射和队列。通过动手实践活动，你将有机会在 Java 应用程序中使用\
  \ `iterators` 和增强型 for 循环练习遍历集合，并使用 `Comparable` 和 `Comparator` 接口对集合执行排序和搜索操作。最后，在本章结束时，你应该能够应用\
  \ Java 的工具类来简化集合的管理和操作。\n\n## 数组和 ArrayLists 简介\n\n所有程序都处理某种数据，而现代应用程序通常处理非常庞且复杂的数据集。在应用程序中实现高效的数据访问和存储至关重要。幸运的是，Java\
  \ 提供了广泛的功能，使我们能够轻松管理应用程序的数据，特别是数据的集合，即“数据集合”（data collections）。\n\n`Arrays` 和 `ArrayLists`\
  \ 是 Java 中存储和操作数据集合最常用的结构之一。两者都可用于组织和索引数据，但我们必须理解它们之间的区别，以确保我们使用了最符合应用程序需求的数据结构。\n\
  \n`Arrays` 为相同类型的元素提供了一个固定大小的容器。它们具有以下特征：\n\n*   具有固定大小\n*   元素访问快速\n*   从 0 开始的索引\n\
  \n`Arrays` 对于内存效率和性能至关重要的应用程序特别有用。它们的开销极小，特别是与 `ArrayLists` 相比。\n\n`ArrayLists`\
  \ 是 `JCF` 的一部分。与 `arrays` 不同，`ArrayLists` 的大小可以动态增长或缩小。记住，`arrays` 的大小是固定的。因此，`ArrayLists`\
  \ 非常适合处理量量的数据。`ArrayLists` 还内置的方法用于添加、删除和搜索元素等操作。这减少了我们手动实现这些功能的需求。\n\n图 6.1 展示了\
  \ `arrays` 和 `ArrayLists` 之间的核心区别，加号表示 `ArrayLists` 可以缩小和增加大小：\n\n![一张图比较了数组和 ArrayList，两者都包含值\
  \ 2, 3, 5, 7 和 11，索引从 0 到 4。ArrayList 在末尾有一个额外的空槽，用 + 符号标出。](img/Figure_6.1)\n\n\
  图 6.1 数组与 ArrayList 的区别\n\n### 实现数组\n\n当我们在 Java 中声明数组时，必须指定大小。以下是示例：\n\n```java\n\
  int[] jerseys = new int[5];\n```\n\n一旦建立了数组，就可以填充值。操作方法如下：\n\n```java\njerseys[0]\
  \ = 8;\njerseys[1] = 2;\njerseys[2] = 4;\njerseys[3] = 6;\njerseys[4] = 0;\n```\n\
  \n我们可以访问特定的元素。以下是示例：\n\n```java\nfor (int i = 0; i < jerseys.length; i++) {\n  \
  \  System.out.println(\"The jersey at \" + i + \": \" + jerseys[i]);\n}\n```\n\n\
  ### 实现 ArrayLists\n\nArrayLists 更具动态，我们不需要指定。以下是示例：\n\n```java\nimport java.util.ArrayList;\n\
  \npublic class PlanetExample {\n    public static void main(String[] args) {\n \
  \       // 声明并初始化\n        ArrayList<String> planets = new ArrayList<>();\n\n  \
  \      // 添加元素\n        planets.add(\"Mercury\");\n        planets.add(\"Venus\"\
  );\n        planets.add(\"Earth\");\n        planets.add(\"Mars\");\n        planets.add(\"\
  Saturn\");\n        planets.add(\"Uranus\");\n        planets.add(\"Neptune\");\n\
  \        planets.add(\"Pluto\");\n\n        // 访问并打印\n        System.out.println(\"\
  First planet: \" + planets.get(0));\n\n        // 一个元素\n        planets.remove(\"\
  Pluto\");\n\n        // 遍历\n        for (String planet : planets) {\n          \
  \  System.out.println(planet);\n        }\n    }\n}\n```\n\n我们示例的输出如下：\n\n```\n\
  Mercury\nVenus\nEarth\nMars\nSaturn\nUranus\nNeptune\n```\n\n作为数组和 `ArrayLists`\
  \ 的总结，请参考 表 6.1：\n\n| 特性 | 数组 | ArrayList |\n| :--- | :--- | :--- |\n| 性能 | 更快 |\
  \ 较慢 |\n| 大小 | 固定 | 动态 |\n| 灵活性 | 低 | 高 |\n\n表 6.1 数组与 ArrayList\n\n## Java 集合框架\n\
  \n`JCF` 是类和接口的集合，为我们提供了极其强大的数据处理能力。`JCF` 有助于简化应用程序存储和操作数据的方式。如果没有 JCF 的类和接口，我们将花费大量时间来编写帮助我们处理数据的代码。\n\
  \n`JCF` 包含几种类型的集合。它们通过根接口（`collection` 和 `map`）组织。以下是 JCF 层次结构以及最常用的集合、映射和其他数据结构的简览：\n\
  \n*   `Collection`：\n    *   `Lists`: 有序集合，提供对元素位置的精确控制。值得注意的是，列表允许重复元素。常见示例包括：\n\
  \        *   `ArrayList`: 一种根据需要增长的动态数组。\n        *   `LinkedList`: 提供提供高效插入和删除操作的列表。\n\
  \    *   `Queues`: 这种集合设计用于在处理之前持有元素，通常按特定顺序。常见示例包括：\n        *   `PriorityQueue`:\
  \ 根据元素的自然顺序或自定义 `Comparator` 排序的队列（本章稍后将详细介绍 Comparator）。\n    *   `Sets`: 这些集合确保所有元素都是唯一的。常见示例包括：\n\
  \        *   `HashSet`: 使用哈希表进行快速查找的集合类型。\n        *   `TreeSet`: 按排序顺序维护元素的集合类型。\n\
  *   `Maps`: 存储键值对的集合。我们使用键高效检索其值对。常见示例包括：\n    *   `HashMap`: 以基本操作的常数性能著称。\n  \
  \  *   `TreeMap`: 按排序顺序维护键。\n\n### 集合操作\n\n我们的应用程序可能需要的四种常见集合操作是添加、删除、搜索和排序。表 6.2\
  \ 列出了每种操作的一些示例方法：\n\n| 操作 | 示例方法 |\n| :--- | :--- |\n\n\n\n\n\n| 操作 | 方法 |\n| :---\
  \ | :--- |\n| 添加元素 | `add()`, `addAll()` |\n| 移除元素 | `remove()`, `clear()` |\n|\
  \ 搜索元素 | `contains()`, `indexOf()` |\n| 排序元素 | `sort()`, `filter()` |\n\n表 6.2:\
  \ 集合操作的示例方法\n\n在在本章的剩余部分中，我们将通过代码示例来探索这些集合操作。\n\n## 使用迭代器和增强 for 循环\n\n一旦我们拥有了集合（例如\
  \ `ArrayList` 或 `LinkedList`），我们需要能够访问该集合中的元素。本节侧重于如何高效地遍历集合。我们将探索 JCF（Java 集合框架）提供的遍历集合的两种主要机制：迭代器（iterators）和增强型\
  \ for 循环（enhanced for loops）。这些工具允许我们检查集合中的每个元素，而无需手动管理索引位置。当我们理解了`iterators`和增强\
  \ for 循环的正确使用方法时，就可以写出可读且且无错误的代码。\n\n### 迭代器\n\n在 Java 中，`iterator` 是一个对象，允许我们以顺序方式遍历集合中的元素。这被称为顺序遍历，是一个需要学会实现的重要操作。正如你将在接下来的示例中看到的，`iterator`\
  \ 是 `java.util` 包的一部分，并包含了几个方法，包括表 6.3 列出的方法：\n\n| 方法 | 用途 |\n| :--- | :--- |\n\
  | `hasNext()` | 检查集合是否至少包含另一个元素，返回 true 或 false。 |\n| `next()` | 获取集合中的下一个元素。 |\n\
  | `remove()` | 移除迭代器返回的元素。 |\n\n表 6.3: 迭代器方法\n\n在代码中使用 `Iterators` 的用处是它们适用于所有类型的集合，并且它们在迭代时提供了某些修改元素的灵活性（即通过\
  \ `remove()` 方法）。让我们来看一个使用迭代器处理列表的范示例代码：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Iterator;\n\npublic class MyIteratorExample {\n    public static\
  \ void main(String[] args) {\n        ArrayList<String> names = new ArrayList<>();\n\
  \        names.add(\"Kobe\");\n        names.add(\"Magic\");\n        names.add(\"\
  Kareem\");\n        names.add(\"Shaq\");\n        // 为列表创建一个迭代器\n        Iterator<String>\
  \ iterator = names.iterator();\n        // 遍历列表\n        while (iterator.hasNext())\
  \ {\n            String name = iterator.next();\n            System.out.println(\"\
  Name: \" + name);\n            // 移除一个元素（可选）\n            if (name.equals(\"Shaq\"\
  )) {\n                iterator.remove();\n            }\n        }\n        System.out.println(\"\
  Updated List: \" + names);\n    }\n}\n```\n\n以下是我们代码的输出：\nName: Kobe\nName: Magic\n\
  Name: Kareem\nName: Shaq\nUpdated List: [Kobe, Magic, Kareem]\n\n### 增强 for 循环\n\
  \n遍历集合的另一种方法是使用 `for each` 循环，也称为增强 for 循环。这是一种抽象了内部 `for` 循环组件的简化方法。正如后续示例所示，它是遍历集合的一种简洁方式：\n\
  \n```java\nimport java.util.ArrayList;\n\npublic class MyEnhancedForLoopExample\
  \ {\n    public static void main(String[] args) {\n        ArrayList<String> names\
  \ = new ArrayList<>();\n        names.add(\"Kobe\");\n        names.add(\"Magic\"\
  );\n        names.add(\"Kareem\");\n        // 这是一个增强 for 循环\n        for (String\
  \ name : names) {\n            System.out.println(\"Name: \" + name);\n        }\n\
  \    }\n}\n```\n\n我们示例的输出如下：\nName: Kobe\nName: Magic\nName: Kareem\n\n使用这种方法的优点是代码更整洁、更易读。如果你需要遍历集合，且不需要在迭代期间对集合进行修改，那么这种是最好的方法。\n\
  \n## 集合的排序与搜索\n\n排序和搜索是我们对集合执行的最两个基础操作。这些操作的目的不仅是为了找到数据，更是为了高效地组织和检索数据。JCF 为我们提供了多种排序和搜索集合的工具，使我们很容易在程序中实现这些功能。\n\
  \n### 排序\n\n我们将利用 Java 集合类提供的实用程序。具体来说，我们将使用 `sort()` 方法执行两种排序：\n\n*   自然顺序（Natural\
  \ order）：这分别是数字的升序顺序和字符串的字母顺序。\n*   逆序（Reverse order）：这是自然顺序的相反。\n\n以下是我们的示例代码：\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\npublic\
  \ class SpacecraftSortingExample {\n    public static void main(String[] args) {\n\
  \        // 创建并填充 ArrayList\n        ArrayList<String> spacecraft = new ArrayList<>();\n\
  \        spacecraft.add(\"Voyager\");\n        spacecraft.add(\"Apollo\");\n   \
  \     spacecraft.add(\"Perseverance\");\n        spacecraft.add(\"Hubble\");\n \
  \       spacecraft.add(\"Artemis\");\n        // 按“自然”顺序排序\n        Collections.sort(spacecraft);\n\
  \        System.out.println(\"Spacecraft (Natural Order): \" + spacecraft);\n  \
  \      // 按逆序排序\n        spacecraft.sort(Collections.reverseOrder());\n        System.out.println(\"\
  Spacecraft (Reverse Order): \" + spacecraft);\n    }\n}\n```\n\n该应用程序的输出如下：\nSpacecraft\
  \ (Natural Order): [Apollo, Artemis, Hubble, Perseverance, Voyager]\nSpacecraft\
  \ (Reverse Order): [Voyager, Perseverance, Hubble, Artemis, Apollo]\n\n接下来，让我们考虑\
  \ `TreeSet` 集合，它会自动按自然顺序维护元素：\n\n```java\nimport java.util.TreeSet;\n\npublic class\
  \ TreeSetExample {\n    public static void main(String[] args) {\n        // 创建并填充\
  \ TreeSet\n        TreeSet<String> spacecraft = new TreeSet<>();\n        spacecraft.add(\"\
  Voyager\");\n        spacecraft.add(\"Apollo\");\n        spacecraft.add(\"Perseverance\"\
  );\n        spacecraft.add(\"Hubble\");\n        spacecraft.add(\"Artemis\");\n\
  \        // 输出排序后的 TreeSet\n        System.out.println(\"Sorted TreeSet: \" + spacecraft);\n\
  \        // 尝试添加重复项\n        spacecraft.add(\"Apollo\");\n        System.out.println(\"\
  After Duplicate: \" + spacecraft);\n    }\n}\n```\n\n该示例的输出如下：\nSorted TreeSet:\
  \ [Apollo, Artemis, Hubble, Perseverance, Voyager]\nAfter Duplicate: [Apollo, Artemis,\
  \ Hubble, Perseverance, Voyager]\n\n你可以看到，`TreeSet` 不允许重复值。\n\n现在，让我们检查如何使用 `TreeMap`。`TreeMap`\
  \ 存储键值对并按自然顺序排序键。这与具有唯一元素的 `TreeSet` 不同。以下是我们的 TreeMap 示例：\n\n```java\nimport java.util.TreeMap;\n\
  \npublic class TreeMapExample {\n    public static void main(String[] args) {\n\
  \        // 创建填充 TreeMap\n        // 使用空间船名称和发射年份\n        TreeMap<String, Integer>\
  \ spacecraft = new TreeMap<>();\n        spacecraft.put(\"Voyager\", 1977);\n  \
  \      spacecraft.put(\"Apollo\", 1968);\n        spacecraft.put(\"Perseverance\"\
  , 2020);\n        spacecraft.put(\"Hubble\", 1990);\n        spacecraft.put(\"Artemis\"\
  , 2022);\n        // 输出排序后的 TreeMap\n        System.out.println(\"Sorted TreeMap\
  \ (by Name): \" + spacecraft);\n    }\n}\n```\n\n我们代码的输出：\nSorted TreeMap (by Name):\
  \ {Apollo=1968, Artemis=2022, Hubble=1990, Perseverance=2020, Voyager=1977}\n\n\
  正如所示，Java 的集合实用类使我们能够轻松排序集合。\n\n### 搜索集合\n\nJava 搜索集合的难度与排序一样简单。对于我们的示例，我们将使用集合实用类。以下是我们在集合中搜索特定项的方法：\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\npublic\
  \ class SpacecraftSearchExample {\n    public static void main(String[] args) {\n\
  \        // 创建并填充 ArrayList\n        ArrayList<String> spacecraft = new ArrayList<>();\n\
  \        spacecraft.add(\"Voyager\");\n        spacecraft.add(\"Apollo\");\n   \
  \     spacecraft.add(\"Perseverance\");\n        spacecraft.add(\"Hubble\");\n \
  \       spacecraft.add(\"Artemis\");\n        // 排序 ArrayList\n        Collections.sort(spacecraft);\n\
  \        // 模拟获取输入\n        String missingSpacecraft = \"Hubble\";\n        // 搜索特定的空间器\n\
  \        int index = Collections.binarySearch(spacecraft, missingSpacecraft);\n\
  \        if (index >= 0) {\n            System.out.println(\"Found spacecraft at\
  \ index: \" + index);\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  Found \" + missingSpacecraft + \" at index: \" + index);\n} else {\n    System.out.println(missingSpacecraft\
  \ + \" not found in the list.\");\n}\n}\n}\n```\n\n我们程序的输出如下：\nFound Hubble at index:\
  \ 2\n\n注意：在搜索之前，必须先对集合进行排序。虽然你不会收到错误，但可能无法获得结果。如果删除了 `Collections.sort(spacecraft)`\
  \ 这一行，上一个示例应用程序的输出将是 `Hubble not found in the list`。\n\n接下来，让我们重新回顾 `TreeSet` 并演示如何使用\
  \ `contains()` 方法进行搜索操作：\n\n```java\nimport java.util.TreeSet;\n\npublic class TreeSetSearchExample\
  \ {\n    public static void main(String[] args) {\n        TreeSet<String> spacecraft\
  \ = new TreeSet<>();\n        spacecraft.add(\"Voyager\");\n        spacecraft.add(\"\
  Apollo\");\n        spacecraft.add(\"Perseverance\");\n        spacecraft.add(\"\
  Hubble\");\n        spacecraft.add(\"Artemis\");\n        // 搜索航天器\n        if (spacecraft.contains(\"\
  Hubble\")) {\n            System.out.println(\"Hubble is in the TreeSet.\");\n \
  \       } else {\n            System.out.println(\"Hubble is not in the TreeSet.\"\
  );\n        }\n    }\n}\n```\n\n以下是我们的示例程序的输出：\nHubble is in the TreeSet.\n\n本节的最后一个示例演示了如何搜索\
  \ `TreeMap`。在下面的示例实现中，我们使用了 `TreeMap` 工具类中的 `containsKey()` 和 `containsValue()`\
  \ 方法：\n\n```java\nimport java.util.TreeMap;\n\npublic class TreeMapSearchExample\
  \ {\n    public static void main(String[] args) {\n        TreeMap<String, Integer>\
  \ spacecraft = new TreeMap<>();\n        spacecraft.put(\"Voyager\", 1977);\n  \
  \      spacecraft.put(\"Apollo\", 1968);\n        spacecraft.put(\"Perseverance\"\
  , 2020);\n        spacecraft.put(\"Hubble\", 1990);\n        spacecraft.put(\"Artemis\"\
  , 2022);\n        // 按名称搜索航天器\n        if (spacecraft.containsKey(\"Hubble\")) {\n\
  \            System.out.println(\"Hubble is in the TreeMap.\");\n        } else\
  \ {\n            System.out.println(\"Hubble is not in the TreeMap.\");\n      \
  \  }\n        // 按发射年份搜索\n        if (spacecraft.containsValue(1990)) {\n      \
  \      System.out.println(\"A spacecraft in our collection launched in 1990.\");\n\
  \        } else {\n            System.out.println(\"No spacecraft in our collection\
  \ launched in 1990.\");\n        }\n    }\n}\n```\n\n这里是我们的示例应用程序的输出：\nHubble is\
  \ in the TreeMap.\nA spacecraft in our collection launched in 1990.\n\n关于排序和搜索的最后提示，让我们复习一些最佳实践：\n\
  - 在使用 `binarySearch()` 方法之前，始终对你的集合进行排序。\n- 确保为你的数据使用合适的数据结构。\n\n## Comparable 对比\
  \ Comparator\n\n如前一节所述，排序是 Java 中一个非常常见的操作。我们已经演示了集合的自然顺序，这对于许多编程需求已经足够了，但并非所有情况。有时，我们需要按照自定义顺序进行排序。Java\
  \ 为我们提供了两个工具（接口）来解决这一需求：`Comparable` 和 `Comparator`。正如你所看到的，这些接口允许为 `ArrayList`、`TreeSet`\
  \ 和 `TreeMap` 等集合中的对象定义自定义排序。\n\n本节解释了 `Comparable` 和 `Comparator` 接口并演示了它们的用法。\n\
  \n### Comparable\n\nJava 的 `Comparable` 接口允许我们创建具有自定义自然顺序定义的类。这些类实现了 `Comparable`\
  \ 接口并必须重写 `compareTo()` 方法。我们使用该方法通过比较当前对象（`this`）与作为参数传递另一个对象来定义对象的顺序。语法如下：\n\n\
  ```java\npublic interface Comparable<T> {\n    int compareTo(T o);\n}\n```\n\n`compareTo()`\
  \ 方法有三个返回值，如表 6.4 所示：\n\n| 返回类型 | 说明 |\n| :--- | :--- |\n| 0 | 如果此对象与被比较的对象相等 |\n\
  | 负整数 | 如果此对象小于被比较的对象 |\n| 正整数 | 如果此对象大于被比较的对象 |\n\n表 6.4：`compareTo()` 方法返回类型\n\
  \n让我们一个代码示例。接下来的 `Dog` 类是 `Comparable` 的，因为它实现了 `Comparable` 接口：\n\n```java\nclass\
  \ Dog implements Comparable<Dog> {\n    private String name;\n    public Dog(String\
  \ name) {\n        this.name = name;\n    }\n    public String getName() {\n   \
  \     return name;\n    }\n    @Override\n    public int compareTo(Dog other) {\n\
  \        return this.name.compareTo(other.name); // 按名称的自然排序\n    }\n    @Override\n\
  \    public String toString() {\n        return name;\n    }\n}\n```\n\n以下代码驱动 `Dog`\
  \ 类以演示使用 `Comparable` 进行排序：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  \npublic class ComparableExample {\n    public static void main(String[] args) {\n\
  \        ArrayList<Dog> dogs = new ArrayList<>();\n        dogs.add(new Dog(\"Corgi\"\
  ));\n        dogs.add(new Dog(\"Beagle\"));\n        dogs.add(new Dog(\"Labrador\"\
  ));\n        dogs.add(new Dog(\"Dalmatian\"));\n        dogs.add(new Dog(\"Poodle\"\
  ));\n        // 使用 Comparable 排序\n        Collections.sort(dogs);\n        System.out.println(\"\
  Sorted Dogs by Name: \" + dogs);\n    }\n}\n```\n\n程序的输出如下：\nSorted Dogs by Name:\
  \ Beagle, Corgi, Dalmatian, Labrador, Poodle\n\n### Comparator\n\n`Comparable` 接口允许类定义自定义自然顺序，而\
  \ `Comparator` 接口允许我们定义自定义排序，这在不需要修改类时非常有用。语法如下：\n\n```java\npublic interface Comparator<T>\
  \ {\n    int compare(T o1, T o2);\n}\n```\n\n`compare()` 方法比较两个对象并有返回值，如表 6.5 所示：\n\
  \n| 返回类型 | 说明 |\n| :--- | :--- |\n| 0 | 如果两者相等 |\n| 负整数 | 如果 o1 小于 o2 |\n| 正整数 |\
  \ 如果 o1 大于 o2 |\n\n表 6.5：`compare()` 方法返回值\n\n让我们看一个代码示例，其中按名称长度进行排序：\n\n```java\n\
  class Cat {\n    private String breed;\n    public Cat(String breed) {\n       \
  \ this.breed = breed;\n    }\n    public String getBreed() {\n        return breed;\n\
  \    }\n    @Override\n    public String toString() {\n        return breed;\n \
  \   }\n}\n```\n\n接下来，我们将编写 `ComparatorExample` 来使用它：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Collections;\nimport java.util.Comparator;\n\npublic class ComparatorExample\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Cat> cats =\
  \ new ArrayList<>();\n        cats.add(new Cat(\"Exotic Shorthair\"));\n       \
  \ cats.add(new Cat(\"Maine Coon\"));\n        cats.add(new Cat(\"Devon Rex\"));\n\
  \        cats.add(new Cat(\"Persian\"));\n        cats.add(new Cat(\"Ragdoll\"));\n\
  \        // 按名称长度的自定义 Comparator\n        Comparator<Cat> lengthComparator = new\
  \ Comparator<Cat>() {\n            @Override\n            public int compare(Cat\
  \ c1, Cat c2) {\n                return Integer.compare(c1.getBreed().length(),\
  \ c2.getBreed().length());\n            }\n        };\n        Collections.sort(cats,\
  \ lengthComparator);\n        System.out.println(\"Sorted Cats by Breed Length:\
  \ \" + cats);\n    }\n}\n```\n\n我们程序的输出如下：\nSorted Cats by Breed Length: [Persian,\
  \ Ragdoll, Devon Rex, Maine Coon, Exotic Shorthair]\n\n### 结合使用\n\n我们介绍了 `Comparable`\
  \ 和 `Comparator` 接口，并演示了为什么以及如何使用它们。我们可以在同一个应用程序中使用这两个接口。例如，我们可以先按照自然顺序（按字母顺序）对动物列表进行排序，然后使用自定义\
  \ Comparator 按年龄排序。让我们在代码中查看：\n\n```java\nclass Animal implements Comparable<Animal>\
  \ {\n    private String name;\n    private int age;\n    public Animal(String name,\
  \ int age) {\n        this.name = name;\n        this.age = age;\n    }\n    public\
  \ String getName() {\n        return name;\n    }\n    public int getAge() {\n \
  \       return age;\n    }\n    @Override\n    public int compareTo(Animal other)\
  \ {\n        return this.name.compareTo(other.name); // 按名称的自然排序\n    }\n    @Override\n\
  \    public String toString() {\n        return name + \" (\" + age + \" years)\"\
  ;\n    }\n}\n```\n\n\n\n\n\n接下来，我们将编写一个名为 `CombinedComparableComparatorExample`\
  \ 的驱动程序，它使用了 `Animal` 类：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
  import java.util.Comparator;\n\npublic class CombinedComparableComparatorExample\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Animal> animals\
  \ = new ArrayList<>();\n        animals.add(new Animal(\"Elephant\", 25));\n   \
  \     animals.add(new Animal(\"Zebra\", 12));\n        animals.add(new Animal(\"\
  Lion\", 15));\n        animals.add(new Animal(\"Giraffe\", 10));\n        // 按自然顺序（名称）排序\n\
  \        Collections.sort(animals);\n        System.out.println(\"Sorted Animals\
  \ by Name: \" + animals);\n\n        // 按年龄排序的自定义 Comparator\n        Comparator<Animal>\
  \ ageComparator = new Comparator<Animal>() {\n            @Override\n          \
  \  public int compare(Animal a1, Animal a2) {\n                return Integer.compare(a1.getAge(),\
  \ a2.getAge());\n            }\n        };\n        Collections.sort(animals, ageComparator);\n\
  \        System.out.println(\"Sorted Animals by Age: \" + animals);\n    }\n}\n\
  ```\n\n以下是我们的示例程序的输出：\n\nSorted Animals by Name: [Elephant (25 years), Giraffe (10\
  \ years), Lion (15 years), Zebra (12 years)]\nSorted Animals by Age: [Giraffe (10\
  \ years), Zebra (12 years), Lion (15 years), Elephant (25 years)]\n\n作为本节总结，让我们回顾一下\
  \ `Comparable` 和 `Comparator` 接口之间的相似之处和区别。如表 6.6 所示，这两个接口的关系在于它们都提供了对象排序功能，但在实现上不同：\n\
  \n| 特性 | Comparable | Comparator |\n| :--- | :--- | :--- |\n| Java 包 | `java.lang`\
  \ | `java.util` |\n| 实现方法 | `compareTo(T o)` | `compare(T o1, T o2)` |\n| 用例 | 定义自然顺序\
  \ | 允许多个自定义顺序 |\n| 是否需要修改类 | 是。我们必须实现 `Comparable` | 否。 |\n\n表 6.6：Comparable 和\
  \ Comparator 接口对比\n\n## 使用 Java 的工具类\n\nJava 的工具包（`java.util`）为我们提供了一些简化常用操作类。这些类有助于简化管理集合、生成随机数和处理日期等任务。在本节中，我们将回顾本章已过的工具类，并引入其他一些本质类，为每个类提供代码示例。\n\
  \n### 主要工具类\n\n以下是本章中介绍过的工具类的回顾：\n\n* `ArrayList`：一种动态数组的实现，允许在没有预定义大小限制的情况下添加或删除元素。\n\
  * `HashMap`：`HashMap` 存储键值对，允许根据键快速检索值。它们不是排序的，且不允许重复的键。\n* `HashSet`：`HashSet`\
  \ 是一个不允许重复元素的集合，并为 `add`、`remove` 和 `contains` 等基本操作提供常数级性能。\n* `Collections`：此工具类具有静态方法，用于列表的排序、反转、洗乱，以及使用\
  \ `binarySearch()` 在其中进行搜索。\n* `LinkedList`：`LinkedList` 是一个内部使用双向链表的集合。当我们需要频繁插入和删除时，它是理想的。\n\
  * `TreeMap`：一种映射的实现，它保持键按自然顺序或指定的 `Comparator` 排序。\n* `TreeSet`：一种集合实现，它按自然顺序或指定的顺序维护元素。它还可以防止重复。\n\
  \n正如你所看到的，这些类是我们能够高效管理集合的关键。接下来的章节将涵盖额外的工具类。\n\n### Date（日期）\n\n`Date` 类允许我们访问具有毫秒精度的特定时间。我们通常在处理时间戳、在界面中显示时间、日志记录和报告时使用它。以下是一个简单的实现示例：\n\
  \n```java\nimport java.util.Date;\n\npublic class DateExample {\n    public static\
  \ void main(String[] args) {\n        // 获取当前日期和时间\n        Date currentDate = new\
  \ Date();\n        System.out.println(\"Current Date and Time: \" + currentDate);\n\
  \    }\n}\n```\n\n该示例的输出基于本地计算机的系统时间，显示如下所示：\n\nCurrent Date and Time: Sat Dec 07\
  \ 18:09:42 CST 2024\n\n### Calendar（日历）\n\nJava 的 `Calendar` 类为我们提供了处理日期和时间的灵活方式。这允许我们处理年、月、日字段。以下是一个示例：\n\
  \n```java\nimport java.util.Calendar;\n\npublic class CalendarExample {\n    public\
  \ static void main(String[] args) {\n        // 创建日历实例并设置特定日期\n        Calendar\
  \ calendar = Calendar.getInstance();\n        calendar.set(2025, Calendar.MARCH,\
  \ 9);\n        System.out.println(\"Custom Date: \" + calendar.getTime());\n   \
  \ }\n}\n```\n\n该示例的输出基于 2025 年 3 月 9 日的自定义日期：\n\nCustom Date: Sun Mar 09 18:14:22\
  \ CDT 2025\n\n### Random（随机）\n\n`Random` 类生成伪随机数。它可以生成随机整数、双精度、布尔值等。以下是一个生成三个随机整数（每个基于不同的范围）和一个随机双精度数的示例：\n\
  \n```java\nimport java.util.Random;\n\npublic class RandomExample {\n    public\
  \ static void main(String[] args) {\n        // 创建 Random 实例\n        Random random\
  \ = new Random();\n        // 生成随机数\n        int random1 = random.nextInt(10); //\
  \ 0 到 9 之间的整数\n        int random2 = random.nextInt(100); // 0 到 99 之间的整数\n    \
  \    int random3 = random.nextInt(1000); // 0 到 999 之间的整数\n        double randomDouble\
  \ = random.nextDouble(); // 0.0 到 1.0 之间的双精度\n        System.out.println(random1);\n\
  \        System.out.println(random2);\n        System.out.println(random3);\n  \
  \      System.out.println(randomDouble);\n    }\n}\n```\n\n### Scanner\n\n`Scanner`\
  \ 类是一个多功能工具类，允许我们从各种源（包括文件、控制台等）读取输入。它还支持解析字符串和整数、双精度类型，使其成为处理 Java 程序输入的至关重要的工具。我们将在第\
  \ 9 章 输入输出中详细介绍 `Scanner` 类，重点关注它在读取和处理输入方面的作用。\n\n## 总结\n\n本章探索了 Java 中数据结构和集合的基础知识，涵盖了它们的实现、功能和实际应用。我们从数组和\
  \ `ArrayList` 开始，研究了它们的区别、用例和性能特性。随后章节介绍了 JCF，强调了它的核心组件（如列表、集合、映射和队列）以及在 Java 应用开发中的实用价值。\n\
  \n本章还演示了使用迭代器和增强型循环的遍历技术，以便对集合进行高效导航和操作。通过示例涵盖了排序和搜索操作，演示了内置工具以及使用 `Comparable`\
  \ 和 `Comparator` 接口的自定义排序。本章以回顾 Java 工具类结束，包括 `HashMap`、`HashSet`、`LinkedList`、`Date`、`Calendar`\
  \ 和 `Random`，为有效的数据管理和处理提供了工具。\n\n本章的目标是为你学习 Java 中处理数据结构奠定坚实的基础。这些技能对于编写高效、可扩展且易于维护的应用程序至关重要。\n\
  \n\n\n\n\n在下一章中，我们将介绍 Java 中的并发与多线程。本章将从解释如何使用 `Thread` 类和 `Runnable` 接口来创建和管理线程开始。从那里，章节将探讨同步、锁以及\
  \ `Executor` 框架，它简化了并发编程。本章还将涵盖 Java 的并发工具类，如 `CountDownLatch` 和 `CyclicBarrier`，为你提供管理复杂线程交互的工具。此外，还将强调编写线程安全代码的最佳实践，以帮助你避免并发编程中的常见陷阱。\n\
  \n## 记忆要点\n\n- 使用 `add()` 和 `addAll()` 等方法向集合中添加元素，这些方法在 `ArrayList` 和 `LinkedList`\
  \ 等类中可用。\n- `ArrayList` 是 Java 集合框架（JCF）的一部分，提供了动态调整大小的能力，适用于数据量不断变化的应用程序。\n- `Arrays`\
  \ 是固定大小的集合，提供了快速元素访问，但缺乏动态调整大小的灵活性。\n- 在使用 `Collections.binarySearch()` 等方法时，需要先对集合进行排序以确保结果的准确性。\n\
  - `Collections` 工具类提供了静态方法，用于对集合进行排序、反转、洗牌和搜索等操作。\n- `Comparator` 接口允许为对象的排序定义多个自定义顺序，而无需修改其类定义。\n\
  - `Comparable` 接口允许对象通过实现 `compareTo()` 方法来定义其自然顺序。\n- 列表（lists）、集合（sets）、映射（maps）和队列（queues）等数据结构是\
  \ JCF 的核心组件，每种结构都针对特定的用例进行了优化。\n- 当不需要在遍历期间进行修改时，增强 for 循环提供了一种遍历集合的更简洁、更具读性的方式。\n\
  - `HashMap` 存储键值对，适用于快速查找，但不保证任何特定的顺序。\n- `HashSet` 确保元素的唯一性，并为 `add()`、`remove()`\
  \ 和 `contains()` 等基本方法提供常数时间性能。\n- `Iterators`（迭代器）提供了的顺序遍历，并允许使用 `remove()` 等方法在遍历期间进行修改。\n\
  - JCF 通过数据结构和算法的标准实现，简化了数据的存储和操作。\n- `LinkedList` 由于其底层双向链表的实现，非常适用于需要频繁插入和删除的场景。\n\
  - 字符串或数字等集合的自然顺序排序默认使用升序，这可以通过 `Collections.sort()` 等方法高效处理。\n- `Random` 类生成伪随机数，并支持生成整数、双浮点数、布尔值等的方法。\n\
  - 集合搜索可以使用针对集合的 `contains()` 方法或针对有序列表的 `binarySearch()` 方法进行。\n- 集合排序可以通过 `Collections`\
  \ 工具类中的 `sort()` 等方法实现，该方法同时支持自然顺序和自定义顺序。\n- `TreeMap` 维护键值对，其键按自然顺序或使用指定的 `Comparator`\
  \ 排序。\n- `TreeSet` 按照排序顺序维护元素并防止重复，适用于需要唯一元素的集合。\n- `Date` 和 `Calendar` 等工具类提供了处理日期和时间的工具，使得在处理时间戳和调度任务时更具灵活性。\n\
  \n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对以下内容进行批判性思考：\n\n- **为 StarNet Logistics 优化船队管理**：StarNet\
