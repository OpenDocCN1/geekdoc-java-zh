  \    - 编写一个测试程序，使用所有三个构造函数创建 `Book` 对象并显示它们的详情。\n- **现实世界应用**：构造函数重载允许 Java 开发者创建具有不同细节的对象，适应不同的使用场景。此挑战旨在帮助你练习为类设计灵活的初始化选项。\n\
  ## 设计类层次结构\n- **目标**：构建一个简单的类层次结构来演示继承和方法重写。\n- **活动**：执行以下操作：\n    - 创建一个基类 `Vehicle`，包含一个\
  \ `move()` 方法，该方法打印关于移动的通用信息。\n    - 创建子类 `Car` 和 `Bicycle`，每个子类都重写 `move()` 方法以打印特定车辆的移动信息。\n\
  \    - 实例化 `Car` 和 `Bicycle` 对象，并调用它们的 `move()` 方法以查看不同的输出。\n- **现实世界应用**：继承模拟了现实世界的关系，并通过允许子类继承基类的公共行为来减少了代码重复。此挑战旨在帮助你理解继承和方法重写如何产生更有组织且更易维护的代码。\n\
  \n## 使用动态方法分发实现多态\n- **活动**：执行以下操作：\n    - 创建一个 `Pet` 类，包含一个打印通用信息的 `makeSound()`\
  \ 方法。\n    - 扩展 `Pet` 类创建 `Dog` 和 `Cat` 子类，每个子类都重写 `makeSound()` 以打印它们特定的声音（例如：狗在汪汪。猫在呼喵。）。\n\
  \    - 编写方法 `playWithPet(Pet pet)`，它在 `Pet` 对象上调用 `makeSound()`。\n    - 使用 `Dog`\
  \ 和 `Cat` 对象测试该方法。\n- **现实世界应用**：多态允许我们编写操作超类的方法，同时启用子类特定的行为。此挑战展示了动态方法分发在创建适应且可重用的代码方面的威力。\n\
  \n## 使用访问修饰符创建安全类\n- **目标**：应用不同的访问修饰符创建安全的类结构。\n    - 设计一个 `BankAccount` 类，具有私有属性\
  \ `accountNumber`、`balance` 和 `ownerName`。\n    - 添加 `public` 方法用于存款和取款，确保取款方法在允许交易前检查资金是否充足。\n\
  \    - 使用 `protected` 访问权限编写 `calculateInterest()` 方法，根据受保护的 `interestRate` 属性计算每月利。\n\
  \    - 编写一个测试程序与 `BankAccount` 对象进行交互，展示不同访问修饰符在实践中如何工作。\n- **现实世界应用**：对类成员进行访问的管理对于处理敏感数据的软件应用程序至关重要。此挑战旨在帮助你理解如何使用访问修饰符来控制哪些信息暴露，哪些保持受保护。\n\
  \n## 自测\n\n提供以下问题用于评估你对章节内容的掌握情况，并对关键概念应用批判性思维：\n1. 面向对象编程（OOP）中封装的主要目的是什么？Java\
  \ 如何强制执行？\n2. 解释方法重载（method overloading）和方法重写（method overriding）之间的区别。提供你可能使用每一者的示例。\n\
  3. 为什么 `super` 关键字在继承中很重要？描述一个你会使用它的场景。\n4. 想象你正在为交通系统设计一个类层次结构。你创建了一个超类 `Vehicle`\
  \ 以及子类 `Car`、`Bicycle` 和 `Boat`。你如何使用多态来编写一个处理所有类型车辆的方法，而无需为每种新车辆类型修改方法？\n5. 反思\
  \ Java 中的访问修饰符（`public`、`protected`、`private` 和 `default`）。为什么将类属性设为私通常是良好做法？这如何影响你代码的安全性和可维护性？\n\
  \n### 答案\n\n1. 封装的主要目的是限制对对象数据的直接访问，并控制数据如何被修改或访问。Java 通过将类属性设为私有，并提供 `public` 的\
  \ getter 和 setter 方法来安全地访问和修改值来强制封装。这保护了对象的内部状态，防止了意外修改，并有助于维护数据完整性。\n3. `super`\
  \ 关键字允许子类调用其超类的构造函数或方法，这为初始化继承的属性或调用父类方法提供了途径。它很重要，因为有助于避免代码重复，并保持超类与子类功能之间清晰的。例如，如果子类\
  \ `Dog` 继承自超类 `Animal`，`Dog` 构造函数可以使用 `super(habitat)` 来初始化继承的 `habitat` 属性，确保调用了超类的构造函数并且属性被正确初始化。\n\
  4. 多态允许我们在 `Vehicle` 超类中创建一个单一方法（如 `move()`），然后在每个子类（`Car`、`Bicycle`、`Boat`）中重写此方法以定义特定的移动行为。例如，`Car`\
  \ 中的 `move()` 方法可能会打印“汽车在行驶”，而 `Bicycle` 可能会打印“自行车在踩踏”。你可以编写一个类似 `testVehicle(Vehicle\
  \ v)` 的方法，它调用 `v.move()`。由于多态的存在，Java 会根据实际对象类型调用相应的 `move()` 方法，允许 `testVehicle`\
  \ 无需修改即可处理任何 `Vehicle` 子类。\n5. 将类属性设为私有是一种良好的做法，因为它限制了类外部对这些属性的直接访问。这允许类本身通过公共方法控制何时以及如何修改它们。这保护了数据的完整性并防止了意外修改或误用。通过控制访问访问，我们提升了代码的安全性和可维护性。\n\
  \n\n\n\n\n面向对象编程（OOP）框架是 Java 开发的核心。它为我们提供了一个稳健的框架以及一套工具和实践，用于开发模块化、可扩展、安全且易于维护的应用程序。第\
  \ 3 章 面向对象编程基础介绍了 OOP 的基本原理，包括封装、继承和多态。本章将详细讨论高级 OOP 概念，帮助你充分利用 Java OOP 能力的威力。\n\
  本章探索了高级 OOP 概念，包括接口和抽象类，这些概念为我们的软件设计提供了巨大的灵活性和扩展性。涵盖了接口如何在 Java 中实现多继承、函数式接口以及默认方法。本章还涵盖了\
  \ Lambda 表达式和方法引用。\n\n我们的目标是使用这些高级 OOP 概念帮助我们编写更整洁、简洁的代码，同时简化现代 Java 代码。在本章结束时，你应该对\
  \ OOP 有深入的理解，并获得使用高级设计模式构建复杂应用的实用技能。\n\n## 结构\n\n本章涵盖了以下主题：\n\n* 接口简介\n* 通过接口在 Java\
  \ 中实现多继承\n* 函数式接口和默认方法\n* Lambdas 和方法引用\n* 对象生命周期\n\n## 目标\n\n本章的设计旨在帮助你理解并获得实现接口以增强\
  \ Java 灵活性的经验。学习本章时，请注意抽象类和接口之间的区别，因为理解何时使用哪一个至关重要。在本章结束时，你应该有信心利用函数式接口和默认方法简化你的编码实践。你将有机会编写并应用\
  \ lambda 表达式和方法引用来实现流式函数式编程。最后，在完成本章后，你应该能够管理 Java 中对象的生命周期，并应用高级 OOP 概念设计可扩展和易维护的\
  \ Java 应用程序。\n\n\nJava 接口允许为实现类定义合约（要求）。这是我们编写灵活且可扩展软件应用程序的基础组件。我们通过启用多继承、抽象和支持多态来实现这一点。接口的使用让我们能够设计出易于读取、维护和扩展的系统。\n\
  \nJava 是一种引用类型，与类有一些相似之处。接口只能包含以下组件：\n\n* 常量\n* 方法签名\n* 默认方法\n* 静态方法\n\n接口不能包含以下内容：\n\
  \n* 实例变量\n* 构造函数\n\n| 注意：接口不能直接实例化对象。 |\n\n接口不能直接实例化对象；相反，它们定义了一个合约，其他类必须通过实现接口来适应该合约。为了充分理解这一概念，可以将接口想象成设计不同类型建筑的蓝图。例如，每栋建筑都必须有基础、屋顶、墙壁和出入方式，但这些组件的具体实现可以根据建造者、位置和建筑类型而大不同。\n\
  本节介绍了接口的概念、语法和用例，并结合了建筑架构和层级结构的实际示例来澄清这些概念。\n\n| 注意：上一章使用动物界层级引入了 OOP 以支持知识传递。本章使用建筑层级进一步加强你对\
  \ OOP 的理解。这在学习 OOP 和高级 OOP 概念时将为你提供额外的背景信息。 |\n\n### 语法与实现\n\n要创建一个接口，我们只需要在它的定义中使用\
  \ `interface` 关键字。下面的 `Building` 接口显示了接口的基本结构：\n\n```java\n    void buildFoundation();\n\
  \    void constructWalls();\n    void addRoof();\n}\n```\n\n在这个示例中，`Building` 是我们接口的名称。实现此接口的类将被遵守合约，该合约包括创建抽象的\
  \ `buildFoundation()`、`constructWalls()` 和 `addRoof()` 方法。\n\n让我们两个类使用 `implements`\
  \ 关键字来实现我们的 `Building` 接口的示例：\n```java\npublic class Skyscraper implements Building\
  \ {\n    @Override\n    public void buildFoundation() {\n        System.out.println(\"\
  为摩大楼铺设深层混凝土基础。\");\n    }\n\n    @Override\n    public void constructWalls() {\n\
  \    }\n\n    @Override\n    public void addRoof() {\n        System.out.println(\"\
  为摩大楼增加屋顶平台。\");\n    }\n}\n```\n\n\n现在，让我们看看 `Building` 接口的第二个实现：\n\n```java\npublic\
  \ class House implements Building {\n    @Override\n    public void buildFoundation()\
  \ {\n        System.out.println(\"为房屋铺设浅层混凝土基础。\");\n    }\n    @Override\n    public\
  \ void constructWalls() {\n        System.out.println(\"为房屋建造砖和灰浆墙。\");\n    }\n\
  \n    @Override\n    public void addRoof() {\n        System.out.println(\"为房屋增加人字屋顶。\"\
  );\n    }\n}\n```\n\n在我们的第二个示例中，我们看到 `House` 类实现了 `Building` 接口，并根据接口合约重写了这些方法。\n\
  \n在 `Skyscraper` 和 `House` 的两种实现中，三个方法都已定义，只是方式不同。\n\n### 多继承\n\nJava 赋予我们一次实现多个接口的灵活性。当我们设计系统时，可以让单独的类采用多个接口的行为。为了演示这一点，让我们为建筑类别创建两个额外的接口：`Commercial`（商业）和\
  \ `Residential`（住宅）：\n\n```java\npublic interface Commercial {\n    void addConferenceRooms();\n\
  \    void addReceptionAreas();\n}\n\npublic interface Residential {\n    void addBedrooms();\n\
  \    void addKitchen();\n}\n```\n\n如所示，我们现在有两个额外的接口，每个都有两个方法。接下来，让我们写一个实现多个接口的类：\n\
  \n```java\npublic class DualUseBuilding implements Building, Residential, Commercial\
  \ {\n    @Override\n    public void buildFoundation() {\n        System.out.println(\"\
  为多用途建筑铺设通用基础。\");\n    }\n\n    @Override\n    public void constructWalls() {\n\
  \        System.out.println(\"为多用途空间建造墙壁。\");\n    }\n\n    @Override\n    public\
  \ void addRoof() {\n        System.out.println(\"为多用途建筑增加通用屋顶。\");\n    }\n\n  \
  \  @Override\n    public void addBedrooms() {\n        System.out.println(\"增加住宅公寓。\"\
  );\n    }\n\n    @Override\n    public void addConferenceRooms() {\n        System.out.println(\"\
  增加带有会议室的办公空间。\");\n    }\n\n    @Override\n    public void addReceptionAreas() {\n\
  \        System.out.println(\"为每个套房增加接待区。\");\n    }\n\n    @Override\n    public\
  \ void addKitchen() {\n        System.out.println(\"为每个套房增加厨房区域。\");\n    }\n}\n\
  ```\n\n在上述示例中，我们创建了一个实现三个接口的 `DualUseBuilding` 类，每个接口之间用逗号隔开。三个接口中的所有方法都必须定义，否则你无法编译和运行程序。\n\
  \n### 多态\n\n接口允许将不同类的对象视为相同接口类型的对象；从而支持多态。这等同于将所有类型的建筑（例如摩大楼、房屋、博物馆等）简单地称为建筑。\n\n\
  \n\n\n前面的示例演示了运行时多态。在编译时，编译器只知道建筑的类型是 `Building`。然而，在运行时，由于对象的真实类型，会调用 `Skyscraper`\
  \ 和 `House` 中实际的方法实现。\n\n让我们来看下面的代码：\n\n```java\npublic class ConstructionSite {\n\
  \    public static void constructBuilding(Building building) {\n        building.buildFoundation();\n\
  \        building.constructWalls();\n        building.addRoof();\n    }\n}\n\npublic\
  \ class ConstructionCompany {\n    public static void main(String[] args) {\n  \
  \      Building skyscraper = new Skyscraper();\n        Building house = new House();\n\
  \        ConstructionSite.constructBuilding(skyscraper);\n        ConstructionSite.constructBuilding(house);\n\
  \    }\n}\n```\n\n### 默认方法和静态方法\n\n让我们继续探索接口。我们可以通过包含默认方法（default methods）和静态方法（static\
  \ methods）来扩展接口的功能。我们在接口中创建一个默认方法时，实现类可以使用它，也可以对其进行重写。\n\n在下面的示例中，我们将通过添加一个默认方法来更新我们的\
  \ `Building` 接口：\n\n```java\npublic interface Building {\n    void buildFoundation();\n\
  \    void constructWalls();\n    void addRoof();\n    default void addBathrooms()\
  \ {\n        System.out.println(\"Adding bathrooms to the building.\");\n    }\n\
  }\n```\n\n接下来，让我们更新一个新类 `HouseBuilder`，它使用了 `House` 类并利用了 `Building` 接口中新的 `addBathrooms()`\
  \ 默认方法：\n\n```java\npublic class HouseBuilder {\n    public static void main(String[]\
  \ args) {\n        Building house = new House();\n        house.addBathrooms();\
  \ // 调用默认实现\n    }\n}\n```\n\nJava 还允许我们在接口中编写不绑定任何实例的工具方法（utility methods）。以下是一个实现示例：\n\
  \n```java\npublic interface BuildingUtilities {\n    static void printBuildingInfo()\
  \ {\n        System.out.println(\"Buildings must be approved by the local Codes\
  \ office.\");\n    }\n}\n\npublic class BuildingDriver {\n    public static void\
  \ main(String[] args) {\n        BuildingUtilities.printBuildingInfo();\n    }\n\
  }\n```\n\n### 使用抽象类\n\n到目前为止，我们探索了类和接口。在光谱的一端，我们完全实现了类；而在另一端，是使用接口的纯抽象。位于两者之间的是抽象类（abstract\
  \ classes）。抽象类可以既包含具体方法（concrete methods），也包含抽象方法（abstract methods）。具体方法是有实现的，而抽象方法是没有实现的。这一对方法类型（具体和抽象）允许我们既能与相关类共享代码，又能强制所有子类必须实现某些方法。\n\
  \n使用本章中持续的架构示例，你可以将抽象类类为部分构建的建筑模板。其中一个模板可能会指定如何创建基础和添加公设施，但将墙和屋顶的创建留给特定的建筑类型。因此，基础和公设施是具体方法，而墙和屋顶是抽象方法。\n\
  \n我们可以使用 `abstract` 关键字声明类，使其成为抽象类。抽象类的对象不能直接实例化；相反，子类可以扩展抽象类，然后为抽象类中的方法提供具体的实现。\n\
  \n以下是抽象类的语法和结构：\n\n```java\npublic abstract class BuildingTemplate {\n    // 具体方法：共享实现\n\
  \    public void constructFoundation() {\n        System.out.println(\"Constructing\
  \ a standard concrete foundation.\");\n    }\n    // 抽象方法：必须由子类实现\n    public abstract\
  \ void constructWalls();\n    public abstract void addRoof();\n}\n```\n\n在上述示例代码中，我们使用\
  \ `abstract` 关键字将 `BuildingTemplate` 声明为抽象类。我们将 `constructFoundation()` 定义为具体方法，它在该类中被实现并在所有建筑类型中共享。我们还将\
  \ `constructWalls()` 和 `addRoof()` 定义为抽象方法，它们需要每个子类进行特定的实现。\n\n#### 抽象类的实现\n\n正如我们之前涵盖过的，子类从抽象类继承抽象方法，并且必须实现这些方法。下面的示例显示了不同的建筑类型如何实现\
  \ `BuildingTemplate` 抽象类：\n\n```java\npublic class Restaurant extends BuildingTemplate\
  \ {\n    @Override\n    public void constructWalls() {\n        System.out.println(\"\
  Consstructing brick and mortar walls for the restaurant.\");\n    }\n    @Override\n\
  \    public void addRoof() {\n        System.out.println(\"Adding a flat-top roof\
  \ to the restaurant.\");\n    }\n}\n\npublic class Bank extends BuildingTemplate\
  \ {\n    @Override\n    public void constructWalls() {\n        System.out.println(\"\
  Constructing reinforced steel walls for the bank.\");\n    }\n    @Override\n  \
  \  public void addRoof() {\n        System.out.println(\"Adding a steel and concrete\
  \ roof to the bank.\");\n    }\n}\n```\n\n在我们创建了 `Restaurant` 和 `Bank` 类并实现了抽象方法后，我们可以使用这些类来建造特定类型的建筑，如下所示：\n\
  \n```java\npublic class ConstructionSite {\n    public static void constructBuilding(BuildingTemplate\
  \ building) {\n        building.constructFoundation();\n        building.constructWalls();\n\
  \        building.addRoof();\n    }\n    public static void main(String[] args)\
  \ {\n        BuildingTemplate restaurant = new Restaurant();\n        BuildingTemplate\
  \ bank = new Bank();\n        constructBuilding(restaurant);\n        constructBuilding(bank);\n\
  \    }\n}\n```\n\n#### 总结抽象类\n\n正如我们看到的，抽象类是一个强大的 OOP（面向对象编程）概念，允许我们创建具体和抽象方法。具体方法在所有子类之间共享，这有助于减少代码重复。抽象方法是子类必须实现的方法。每个子类都可以有自己独特的抽象方法实现，并且必须被实现；否则你将无法编译程序。\n\
  \n当你想要与密切相关的类共享代码、当你想要定义既共享的（具体方法）又强制的（抽象类），以及当你想要共享基类包含实例变量或构造函数时，抽象类是非常用的。\n\n\
  ### 通过接口实现多继承\n\n多继承发生在一个类实现多个接口时。Java 不支持类的多继承，因为会引入过多的复杂性。我们仍然可以通过接口在 Java 中实现多继承。这允许我们创建一个从不相关的来源继承属性和行为且不会引入冲突的类。就像孩子从每个生物学父母那里继承不同的属性和行为一样，我们可以在\
  \ Java 中实现这一点。\n\n考虑到建筑类比，我们可以设计一种结合了多种功能的混合建筑，例如结合了住宅和商业建筑。我们可能会建造一个一楼是咖啡店、二层及以上是公寓的建筑。\n\
  \n下面是混合用途建筑的示例代码，它结合了来自 `Residential` 和 `Commercial` 接口的行为：\n\n```java\npublic interface\
  \ Residential {\n    void addBedrooms();\n    void addKitchen();\n}\n\npublic interface\
  \ Commercial {\n    void addConferenceRooms();\n    void addReceptionAreas();\n\
  }\n\npublic class MixedUseBuilding implements Residential, Commercial {\n    @Override\n\
  \    public void addConferenceRooms() {\n        System.out.println(\"Adding a conference\
  \ room and office spaces.\");\n    }\n    @Override\n    public void addReceptionAreas()\
  \ {\n        System.out.println(\"Adding a reception area near the front entrance.\"\
  );\n    }\n    @Override\n    public void addBedrooms() {\n        System.out.println(\"\
  Adding residential apartments with bedrooms.\");\n    }\n    @Override\n    public\
  \ void addKitchen() {\n        System.out.println(\"Adding kitchens for each apartment.\"\
  );\n    }\n}\n```\n\n\n\n\n在 Java 中使用接口来实现多个接口有多个优势。第一个优势也是最佳实践是接口将契约与实现分离来。这允许我们创建行为的组合。总的来说，接口为我们的代码提供了一种有组织化的方法。我们可以封装特定的行为，提高代码的模块化。此外，在\
  \ Java 中使用接口实现多个接口可以减少代码的歧义性，使其更于阅读，从而更于排查故障和维护。\n\n以下是值得使用多个接口的主要用例：\n\n* 当你想要避免歧义时，例如，你想要确保没有方法名冲突。\n\
  * 当我们实现多个接口时，我们可以强制执行不同的自定义行为，使类实现来自多个领域的方法，例如我们的 `Residential` 和 `Commercial` 接口示例。\n\
  * 当我们想要定义单责任接口时。\n\n### 实际应用\n\n让我们将接口的多重继承运诸实战。我们将模拟构建一个继承自多个接口行为的智能建筑。\n\n以下是代码：\n\
  \n```java\npublic interface Sustainable {\n    void installSolarPanels();\n}\n\n\
  public interface Security {\n    void addSurveillance();\n}\n\npublic interface\
  \ SmartSystems {\n    void enableSmartLighting();\n}\n\npublic class SmartBuilding\
  \ implements Sustainable, SmartSystems, Security {\n    @Override\n    public void\
  \ installSolarPanels() {\n        System.out.println(\"Installing rooftop solar\
  \ panels.\");\n    }\n\n    @Override\n    public void enableSmartLighting() {\n\
  \        System.out.println(\"Enabling smart lighting for energy efficiency.\");\n\
  \    }\n\n    @Override\n    public void addSurveillance() {\n        System.out.println(\"\
  Adding high-resolution surveillance cameras.\");\n    }\n}\n```\n\n如你所见，我们创建了一个\
  \ `SmartBuilding` 类，实现了三个接口（`Sustainable`、`Security` 和 `SmartSystems`）。\n\n让我们来看另一个实际示例。我们将模拟使用\
  \ `Concert`、`Conference` 和 `Exhibition` 等接口构建一个多功能活动场所。\n\n```java\npublic interface\
  \ Concert {\n    void setupAcousticSystem();\n}\n\npublic interface Conference {\n\
  \    void setupProjectionSystem();\n}\n\npublic interface Exhibition {\n    void\
  \ configureOpenFloorPlan();\n}\n\npublic class EventVenue implements Concert, Conference,\
  \ Exhibition {\n    @Override\n    public void setupAcousticSystem() {\n       \
  \ System.out.println(\"Setting up acoustic panels for the concert.\");\n    }\n\n\
  \    @Override\n    public void setupProjectionSystem() {\n        System.out.println(\"\
  Setting up projection system for conference.\");\n    }\n\n    @Override\n    public\
  \ void configureOpenFloorPlan() {\n        System.out.println(\"Providing an open\
  \ floor plan for exhibitions.\");\n    }\n}\n```\n\n### 函数式接口和默认方法\n\n函数式接口是仅包含单个抽象方法的特殊接口。它们是\
  \ Java 函数式编程模型的核心组件，并且正如你将在在本章稍后看到的，以及在 第 8 章] 流和函数式编程中，它们被广泛用于方法引用和 lambda 表达式。\n\
  \nJava 要求函数式接口遵循这些规则：\n\n* 它们可以有多个默认方法或静态方法。\n* 它们只能有一个抽象方法。\n\n我们通过可选的 `@FunctionalInterface`\
  \ 注解来识别函数式接口，如下所示：\n\n```java\n@FunctionalInterface\npublic interface RoomDesigner\
  \ {\n    void designRoom(String roomType);\n}\n```\n\n在前面的示例中，`designRoom(String\
  \ roomType)` 是定义函数式接口契约的抽象方法。\n\n注意：虽然 `@FunctionalInterface` 注解是可选的，但始终包含它被认为是一种最佳实践。\n\
  \n### 默认方法\n\n默认方法允许接口包含方法实现。这使我们能够在抽象和可重用性之间保持平衡。\n\n要在接口中定义默认方法，我们使用 `default`\
  \ 关键字，如下：\n\n```java\npublic interface Building {\n    default void addBathrooms()\
  \ {\n        System.out.println(\"Adding bathrooms to the building.\");\n    }\n\
  }\n```\n\n现在，让我们创建一个类 `OfficeBuilding` 来实现 `Building` 接口并使用它的默认方法：\n\n```java\n\
  public class OfficeBuilding implements Building {\n    @Override\n    public void\
  \ buildFoundation() {\n        System.out.println(\"Constructing a deep foundation\
  \ for the office building.\");\n    }\n\n    @Override\n    public void constructWalls()\
  \ {\n        System.out.println(\"Constructing steel and glass walls for the officebuilding.\"\
  );\n    }\n\n    @Override\n    public void addRoof() {\n        System.out.println(\"\
  Adding a roof to the office building.\");\n    }\n\n    public static void main(String[]\
  \ args) {\n        Building office = new OfficeBuilding();\n        office.addBathrooms();\
  \ // 使用了默认实现\n    }\n}\n```\n\n此程序的输出如下：\n\n```\nAdding bathrooms to the building.\n\
  ```\n\n如你所见，我们的 `OfficeBuilding` 类没有实现 `addBathrooms()` 方法，但可以调用它，因为它是 `OfficeBuilding`\
  \ 类实现的 `Building` 接口中的默认方法。\n\n### Lambda 和方法引用\n\nLambda 和方法引用是 Java 为我们提供的高级 OOP\
  \ 构造之一。正如你将在本节中看到的，lambda 允许我们在实现抽象方法时编写简洁、可靠且模块化的代码。方法引用允许我们在实现函数式接口时对现有方法使用简写形式。我们将在本节中探索这两种构造。\n\
  \n### Lambda\n\nLambda 表达式是实现函数式接口单个抽象方法的一种方式。Java 引入此是为了消除样板代码，并为我们提供了一种简洁的单抽象方法实现方法。这有助于使代码更具可读性且易于维护。它支持\
  \ 第 8 章] 流和函数式编程。\n\nlambda 表达式语法包含三个部分：\n\n* 括号内的参数。\n* 箭头运算符 (`->`)，它分隔参数和体。\n\
  * 位于大括号中的体。\n\n代码中的语法如下：\n\n```\n(parameters) { body }\n```\n\n使用本章的架构示例，将 lambda\
  \ 视为特殊房间的灵活蓝图（例如卧室）。无需为每个变体创建详细蓝图，我们可以使用 lambda 快速创建可用设计。\n\n让我们来看在建筑内设计房间的示例：\n\
  \n```java\nRoomDesigner designer = (roomType) -> {\n    System.out.println(\"Designing\
  \ a \" + roomType);\n};\n```\n\n`designer.designRoom(\"Bedroom\");`\n\n对比下面的示例，它没有使用\
  \ lambda 表达式：\n\n```java\nRoomDesigner designer = new RoomDesigner() {\n    @Override\n\
  \    public void designRoom(String roomType) {\n        System.out.println(\"Designing\
  \ a \" + roomType);\n    }\n};\n```\n\n`designer.designRoom(\"Living Room\");`\n\
  \n现在，让我们如何使用 lambda 表达式简洁地编写相同的代码：\n\n```java\nRoomDesigner designer = roomType\
  \ -> System.out.println(\"Designing a \" + roomType);\n```\n\n`designer.designRoom(\"\
  Living Room\");`\n\n### 方法引用\n\nJava 允许我们使用 `::` 运算符作为现有方法的简写。\n\n让我们来看四个示例，每个示例都有不同的形式。\n\
  \n第一种形式是静态方法引用。语法是 `ClassName::staticMethod`。\n\n以下是示例：\n\n```java\npublic class\
  \ Utilities {\n    public static void designRoom(String roomType) {\n        System.out.println(\"\
  Designing a \" + roomType + \" using utilities.\");\n    }\n}\n```\n\n`RoomDesigner\
  \ designer = Utilities::designRoom;`\n\n`designer.designRoom(\"Office\");`\n\n我们也可以配合实例方法使用方法引用简写。这适用于特定的对象。语法是\
  \ `instance::instanceMethod`。\n\n以下是示例：\n\n```java\nBuildingPlanner planner = new\
  \ BuildingPlanner();\nRoomDesigner designer = planner::planRoom;\n```\n\n`designer.designRoom(\"\
  Library\");`\n\n\n\n\n如果我们想对任意对象的实例方法使用方法引用的简写形式，我们将使用这种语法：`ClassName::instanceMethod`。\n\
  \n以下是一个示例：\n\n```java\nFunction<String, String> toUpperCase = String::toUpperCase;\n\
  \nSystem.out.println(toUpperCase.apply(\"building\"));\n```\n\n第四种方法引用简写形式用于构造函数引用。语法为\
  \ `ClassName::new`。\n\n以下是一个示例：\n\n```java\nSupplier<BuildingPlanner> plannerSupplier\
  \ = BuildingPlanner::new;\n\nBuildingPlanner planner = plannerSupplier.get();\n\
  ```\n\n### 使用场景\n\n使用 Lambda 表达式和方法引用有助于我们编写简洁的代码，使我们的代码更具可读性和可维护性。对于初学者来说，这些技术可能看起来很令人生畏，但随着开发者\
  \ Java 知识的增加，Lambda 表达式和方法引用的使用也应该之增加。\n\n通常，当我们我们需要根据方法调用定义自定义行为时，应该考虑使用 Lambda\
  \ 表达式。当现有方法已经提供了所需的功能时，可以使用方法引用。\n\n以下是结合我们的架构类比使用这些技术的示例。\n\n第一个示例使用 Lambda 表达式作为一种具有高度灵活性的房间设计方法：\n\
  \n```java\nRoomDesigner bedroomDesigner = room -> System.out.println(\"Designing\
  \ a \" + room + \" with modern furniture.\");\n\nbedroomDesigner.designRoom(\"Bedroom\"\
  );\n```\n\n以下代码是一个利用预定义工具方法的静态方法引用示例：\n\n```java\npublic class RoomUtilities {\n\
  \    public static void designStandardRoom(String roomType) {\n        System.out.println(\"\
  Designing a standard \" + roomType);\n    }\n}\n\nRoomDesigner standardDesigner\
  \ = RoomUtilities::designStandardRoom;\n\nstandardDesigner.designRoom(\"Kitchen\"\
  );\n```\n\n我们的代码片段是一个实例方法引用示例，它使用了现有对象的方法：\n\n```java\npublic class CustomRoomPlanner\
  \ {\n    public void customizeRoom(String roomType) {\n        System.out.println(\"\
  Customizing a \" + roomType + \" with user preferences.\");\n    }\n}\n\nCustomRoomPlanner\
  \ planner = new CustomRoomPlanner();\n\nRoomDesigner customDesigner = planner::customizeRoom;\n\
  \ncustomDesigner.designRoom(\"Living Room\");\n```\n\n我们将在第 8 章 流和函数式编程中详细详细讨论 Lambda\
  \ 表达式。\n\n### 对象生命周期\n\n你应该记得 OOP 的前提是一切皆对象。对象的生命周期从被创建时开始，到被销毁时结束。对象消耗系统内存，这些内会在对象被销毁之前不会释放。为了确保我们的代码运行高效且不会导致内存溢出情况，我们需要理解对象的生命周期。\n\
  \n本节继续使用我们的架构类比。我们可以将生命周期比作一座微型建筑；它始于建设（对象创建），接着是使用（活跃生命周期），并在微型建筑被拆除或作他用（对象销毁和垃圾回收\
  \ (GC)）时结束。生命周期中的每个阶段都为我们优化代码提供了独特的挑战和机会。\n\n本节回顾了对象生命周期的每个阶段。\n\n### 对象创建\n\n对象生命周期的第一阶段是对象创建。我们使用\
  \ Java 的 `new` 关键字或工厂方法创建对象。当对象被创建时，会在 Java 虚拟机 (JVM) 堆中分配内存。堆预留用于动态内存分配。此外，对象的引用存储在栈内存中。栈内存用于持有方法调用信息和局部变量。然后会调用构造函数来初始化对象的状态。\n\
  \n以下是一个示例：\n\n```java\npublic class TinyBuilding {\n    private String type;\n \
  \   public TinyBuilding(String type) {\n        this.type = type;\n        System.out.println(type\
  \ + \" is constructed.\");\n    }\n}\n\npublic class BuildTinyBuilding {\n    public\
  \ static void main(String[] args) {\n        TinyBuilding cottage = new TinyBuilding(\"\
  Cottage\");\n    }\n}\n```\n\n该示例的输出如下：\n\n`Cottage is constructed.`\n\n接下来，让我们回顾如何使用对象。\n\
  \n### 对象使用\n\n一旦创建了对象，我们就可以对其进行操作、存储数据、让它与其他对象交互等。\n\n以下是使用使用我们在上一个生命周期阶段创建的 `Cottage`\
  \ 对象的示例：\n\n```java\npublic class TinyBuilding {\n    private String type;\n\n \
  \   public TinyBuilding(String type) {\n        this.type = type;\n    }\n\n   \
  \ public void openDoor() {\n        System.out.println(\"Opening the door of the\
  \ \" + type);\n    }\n}\n```\n\n你可以看到，我们为 `TinyBuilding` 类添加了一个 `openDoor()` 方法。\n\
  \n接下来，让我们在存在应用程序 `main()` 方法的 `BuildTinyBuilding` 类中使用它：\n\n```java\npublic class\
  \ BuildTinyBuilding {\n    public static void main(String[] args) {\n        TinyBuilding\
  \ cottage = new TinyBuilding(\"Cottage\");\n        cottage.openDoor();\n    }\n\
  }\n```\n\n该程序的输出所示：\n\n`Opening the door of the Cottage`\n\n下一节涵盖了生命周期的最后一个阶段：销毁。\n\
  \n### 对象销毁\n\n对象生命周期的对象销毁阶段由我们来处理。当对象不再被引用时，Java 会自动销毁它们。如果一个对象没有引用，它就无法被访问或使用，因此释放这些对象占用的内存是合理的。\n\
  \n这种自动的资源回收被称为 `GC`。Java 有一个支持高效的健壮 `GC` 系统。\n\n让我们探索 Java 的 `GC` 系统，它通常缩写为 `GC`。\n\
  \n正如我们在示例代码所示，我们创建了一个名为 `shed` 的 `TinyBuilding` 对象。当它被设置为 `null` 时，没有任何引用指向它，Java\
  \ 将自动回收相关的内存。对象将被销毁。我们也可以使用 `System.gc()` 方法显式调用垃圾回收器，但这并不保证它 会被销毁。\n\n```java\n\
  public class GarbageCollectionDemo {\n    public static void main(String[] args)\
  \ {\n        TinyBuilding shed = new TinyBuilding(\"Shed\");\n        shed = null;\
  \ // 可垃圾回收\n        System.gc(); // 请求垃圾回收（不保证）\n    }\n}\n```\n\n### 最佳实践\n\n仅仅依赖\
  \ Java 的自动 `GC` 系统来保持软件高效运行是不重要的。本节回顾了管理应用程序对象生命期的三个最佳实践。\n\n#### 减少对象创建\n\n最易实现的最佳实践之一是减少对象创建。无论应用程序大小如何，我们都应该避免创建必要的对象。对于频繁使用的数据类型尤其如此。\n\
  \n以下是一个示例：\n\n```java\nString tinyHome1 = \"TinyHome\";\nString tinyHome2 = \"TinyHome\"\
  ; // 重用池中的对象\n```\n\n#### 管理对象引用\n\n在我们不再需要对象时，应该努力释放对象的引用。这有助于我们避免内存泄漏。参考以下代码：\n\
  \n```java\npublic class Room {\n    private TinyBuilding building;\n\n    public\
  \ void assignBuilding(TinyBuilding building) {\n        this.building = building;\n\
  \    }\n\n    public void releaseBuilding() {\n        this.building = null; //\
  \ 释放引用\n    }\n}\n```\n\n如所示，我们将对象设置为 `null`，释放了对象的引用并使其可以进行 `GC`。\n\n#### 显式关闭资源\n\
  \n我们可以使用 try-with-resources 方案显式关闭资源，它会在代码块执行完毕后自动关闭资源。参考以下代码：\n\n```java\ntry (BufferedReader\
  \ reader = new BufferedReader(new FileReader(\"tinyhome.txt\"))) {\n    System.out.println(reader.readLine());\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n```\n\n使用 try-with-resources\
  \ 方案对于文件、流和套接字等资源是非常理想的。\n\n### 示例\n\n让我们来看一个完整的代码示例。我们如下模拟 `TinyBuilding2` 对象的生命周期：\n\
  \n```java\npublic class TinyBuilding2 {\n    private String name;\n    public TinyBuilding2(String\
  \ name) {\n        this.name = name;\n    }\n}\n```\n\n\n\n\n```java\nSystem.out.println(name\
  \ + \" is constructed.\");\n}\n\npublic void useBuilding() {\n    System.out.println(name\
  \ + \" is in use.\");\n}\n\n@Override\nprotected void finalize() throws Throwable\
  \ {\n    System.out.println(name + \" is demolished.\");\n}\n\n}\n```\n\n`TinyBuilding2Manager`\
  \ 应用是我们的驱动程序。以下是代码：\n\n```java\npublic class TinyBuilding2Manager {\n    public\
  \ static void main(String[] args) {\n        TinyBuilding2 tinyOffice = new TinyBuilding2(\"\
  Tiny Office\");\n        tinyOffice.useBuilding();\n        // 取消对象的引用，使其符合垃圾回收条件\n\
  \        tinyOffice = null;\n        // 建议进行垃圾回收\n        System.gc();\n    }\n\
  }\n```\n\n我们程序的输出如下：\n\nTiny Office is constructed.\nTiny Office is in use.\n\n\
  如前面的代码所示，我们可以使用 Java 的 `finalize()` 方法，该方法在对象被垃圾回收之前会被调用。`GC` 和对象最终化的实际执行时机是不保证的。因此，不建议使用\
  \ `finalize()` 方法。更好的替代方案是使用 `try-with-resources` 方案。\n\n为了强调这一点，之前的代码可能会提供以下输出，但正如你上面看到的，它并没有。这说明了\
  \ `finalize()` 方法不可预测的行为。\n\nTiny Office is constructed.\nTiny Office is in use.\n\
  Tiny Office is demolished.\n\n## 结论\n\n在本章结束时，我们探索了用于创建可扩展和可维护软件系统的高级 OOP 概念。我们从涵盖接口和抽象类开始；研究了这些结构如何为我们的系统提供灵活性和扩展性。我们还查看了函数式接口、默认方法、lambda\
  \ 和方法引用。此外，我们还有机会理解如何使用这些结构使你的 Java 代码更加简洁、易读且易于维护。我们通过对对象生命周期以及 `GC` 在内存管理中起的关键作用进行回顾，结束了本章。\n\
  \n本章及其代码示例旨在为在保持效率的同时编写模块化和可重用的代码提供见解。这些示例演示了如何利用 Java 的高级 OOP 能力来解决复杂问题、实施最佳实践、有效管理资源，并设计健壮且可扩展的系统。\n\
  \n下一章是第 5 章 处理错误与异常，它介绍了 Java 复杂的异常处理系统。有效的错误处理对于创建健壮的 Java 应用至关重要，本章探索了检查异常和未检查异常之间的区别、如何使用\
  \ `try-catch-finally` 块，以及如何在代码中抛出和处理异常。此外，你还可以学习如何创建异常并实施处理错误的最佳实践。本章的目标是帮助确保你能够优雅地处理意外问题，并构建失败安全且提供信息的应用程序。\n\
  \n## 知识点回顾\n\n* 抽象类允许在相关类之间共享通用代码，同时强制子类实现抽象方法。 \n* 抽象类中的抽象方法必须由子类实现，从而在共享可重用代码的同时确保特定行为。\n\
  * 对象的生命周期包括创建、活动使用和销毁，Java 通过 `GC` 自动管理内存。\n* 抽象类中的具体方法提供了共享实现，有助于减少子类之间的代码重复。\n\
  * 接口中的默认方法允许实现类继承并使用方法实现，同时保留了覆盖它们的选项。\n* 函数式接口定义了单个抽象方法，作为 lambda 表达式和方法引用的基础。\n\
  * `GC` 自动回收不再被引用的对象所使用的内存，提高了内存效率。\n* 接口通过允许类实现多个接口，从而在 Java 中实现了多继承，在不产生冲突的情况下结合不同的行为。\n\
  * Lambda 为实现函数式接口提供了简洁的语法，减少了样板代码并提高了可读性。\n* 方法引用为引用现有方法提供了简写，增强了代码的可读性并促进了重用。\n\
  * 通过接口实现多继承支持模块化，允许类从无相关的来源采用行为而无歧义。\n* 对象创建发生在 JVM 堆中，并使用构造函数或工厂方法分配内存。\n* 多态允许不同类的对象被视为相同接口类型的对象，实现了设计的灵活性。\n\
  * 在不再需要时释放对对象的引用有助于防止内存泄漏，并确保对象符合 `GC` 的条件。\n* `finalize()` 方法在对象被 `GC` 销毁之前调用，但由于其不可预测性已被弃用。\n\
  * `try-with-resources` 确保文件和套接字等资源的自动释放，使其成为 `finalize()` 的可靠替代方案。\n* 使用接口促进了松耦合和扩展性，有助于使代码更易读、更于维护。\n\
