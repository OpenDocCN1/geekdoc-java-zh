  {\n  \"java.configuration.runtimes\": [\n    {\n      \"name\": \"JavaSE23\",\n\
  \      \"path\": \"/Library/Java/JavaVirtualMachines/jdk-23.jdk/Contents/Home/bin\"\
  \n    }\n  ]\n}\n\n现在我们已经安装了 JDK 23，创建了环境变量并验证了安装，我们准备好选择、下载并配置 IDE。\n\n## 编写并运行你的第一个\
  \ Java 程序\n\n现在我们已经配置好了开发环境，准备好开始编写和运行 Java 程序。在本节中，我们将从一个打印屏幕信息的简单程序开始。欢迎程序是学习新语言的起点。使用\
  \ VS Code 编写和运行 Java 程序非常简单。\n\n### 编写 Java 程序\n按照以下步骤编写 Java 程序：\n\n1. 在计算机上创建一个存放代码的文件夹。\n\
  2. 打开 VS Code。\n3. 在 VS Code 菜单中选择`文件`然后`打开文件夹`。使用文件资源管理器选择你在第 1 步中创建的文件夹。\n4. 在\
  \ VS Code 管理器中点击`新建文件`并输入 `Welcome.java`。\n注意：Java 使用 `.java` 文件后缀。这些是纯文本文件。\n5.\
  \ 在 `Welcome.java` 文件中输入以下代码：\n```java\npublic class Welcome {\n    public static\
  \ void main(String[] args) {\n        System.out.println(\"Welcome to Java Programming!\"\
  );\n    }\n}\n```\n6. 保存工作。\n\n在下一节中，我们将运行此应用程序。\n\n\n要运行该应用程序，我们只需选择`运行 Java` 图标，它位于\
  \ VS Code 界面的右上角。它是一个向右的三角形。点击该按钮并查看控制台输出窗口。你应该看到：\n\n```\nWelcome to Java Programming!\n\
  ```\n\n简单程序就是这样。\n\n\n在本章中，我们了 Java 的基础和 Java 生态系统。这包括 Java 的历史、关键特性、多年来的演变，以及为什么\
  \ Java 在现代软件开发中仍然重要。我们还演示了设置开发环境的必要步骤，包括安装 JDK 23 和 VS Code。此外，我们通过编写和运行第一个 Java\
  \ 程序测试了开发环境。\n\n在下一章中，我们将核心 Java 概念，包括语法、数据类型、变量、运算符、控制结构和方法。\n\n\n* GC（垃圾回收）通过释放不再使用的内存自动进行内存管理。\n\
  * 架构包括 JVM、JRE 和 JDK，每个在开发和执行 Java 程序时都起着独特的作用。\n* Java 面向对象的方法有助于创建模块化、可重用和可扩展的代码。\n\
  * Java 通过由 JVM 执行的字节码提供了广泛的平台独立性。\n* Java 丰富的标准库包含了用于数据结构、网络、文件处理等功能性的工具。\n* Java\
  \ 支持多线程，允许应用程序并发执行多个操作。\n\n\n\n\n*   平台独立性允许 Java 程序在任何带有 `JVM` 的设备上运行，无论底层操作系统是什么。\n\
  *   Java 的安全特性（包括安全的运行时环境和加密 API）有助于我们构建安全的应用程序。\n\n## 案例研究\n以下案例研究旨在帮助你理解 Java\
  \ 核心特性与现实世界挑战之间的关联性。在回顾这些案例研究时，请考虑其优点和潜在缺点，以巩固对 Java 的理解：\n\n*   跨平台应用开发：Zorgon\
  \ Enterprises 是一家专门从事工业自动化的虚拟公司，被要求开发一个需要在 Windows、Linux 和 macOS 上运行的监控应用程序。他们的开发团队因为平台的独立性而决定使用\
  \ Java。他们理解 Java 将源代码编译为字节码，这些字节码可以由任何配备 `JVM` 的设备执行。Zorgon 团队使用 `Java SE` 实现核心功能，并使用\
  \ `JavaFX` 创建一个无缝适配不同操作系统的 GUI。\n    *   供你思考：Java 的“一次编写，随运行”（WORA）能力如何简化了 Zorgon\
  \ Enterprises 的开发流程？特定平台的特性可能会带来哪些挑战？\n\n*   利用 Java 的多线程提升性能：Vulcanix Technologies\
  \ 运营一个电子商务平台，该平台一直面临巨大的流量，特别是在假日销售期间。他们希望系统能够同时处理多个用户请求，而不影响响应时间。开发团队选择了 Java，是因为其提供了强大的多线程支持。\n\
  \    *   供你思考：Java 的多线程支持如何帮助 Vulcanix Technologies 处理并发任务？在资源管理方面，他们应该注意哪些潜在问题？\n\
  *   利用 `Java EE` 实现可扩展性：Andorian Data Services 是一家提供数据分析解决方案的虚拟公司，他们需要为客户构建一个可扩展的后端。该公司决定使用\
  \ `Java EE` 来实现 Web 服务并管理分布式数据处理。使用 `Java EE` 允许他们利用企业级特性，如事务管理、安全管理等。\n    *  \
  \ 供你思考：`Java EE` 特性如何帮助 Andorian Data Services 构建可扩展且安全的企业级解决方案？与其它方法相比，`Java EE`\
  \ 在大型项目中的具体优势是什么？\n\n*   金融软件开发的安全保障：T'Khasi 是一家虚拟金融科技（fintech）初创公司，正在构建一个新的移动银行应用程序。鉴于用户数据的敏感性，安全性是一个至关重要的问题。该公司选择使用\
  \ Java 开发应用程序，是因为其强大的安全模型。这包括 `JVM` 安全检查以及用于加密和安全通信的 API。该应用程序利用 Java 的加密包确保交易通过数据加密是安全的。他们还对\
  \ `JVM` 的安全执行环境感到兴奋，这可以降低未经授权代码执行的风险。\n    *   供你思考：Java 的内置安全特性如何帮助 T'Khasi 系统确保用户数据受到保护？他们还可以实施哪些额外措施来进一步增强安全性？\n\
  \n*   `Java ME` 用于 IoT 设备：Betazoid Embedded Solutions 是 IoT 行业的一家虚拟公司，想要为智能家居设备（包括恒温器、吊扇和灯光开关）开发软件。由于这些设备的硬件资源有限，Betazoid\
  \ 选择了 `Java ME`，因为它专为资源受限的环境设计。`Java ME` 允许他们构建可以在低内存和低处理能力下运行的高应用程序，同时仍可以使用 Java\
  \ 语法和特性。\n\n## 单选题\n\n1.  Java 的 WORA 哲学的主要目标是什么？\n    1.  让 Java 代码运行比其他编程语言更快。\n\
  \    2.  让 Java 代码在无需修改的情况下跨不同平台复用。\n    3.  确保 Java 程序仅在 Unix 系统上执行。\n\n2.  哪个\
