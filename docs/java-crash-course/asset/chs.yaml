  \    alert.showAndWait();\n}\n```\n\n我们的下一部分包含 `addTransactionToTable()` 方法，所示：\n\
  \n```java\n// 将交易添加到表格\n// 时间戳和删除选项\nprivate addTransactionToTable(String amount,\
