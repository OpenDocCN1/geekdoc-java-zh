  \ 完成 PFT 应用程序\n\n在整个章节中，我们逐步构建了一个 PFT 桌面应用程序，以演示 JavaFX 的功能以及如何实现它。在最后一个节中，我们将通过调整窗口大小、增强\
  \ UI、改进交易表格、实现基础数据持久化以及添加额外的错误处理来完成我们的应用程序。让我们开始吧。\n\n### 窗口大小\n\n\n\n\n\n我们的窗口目前太小了，无法显示所有的\
