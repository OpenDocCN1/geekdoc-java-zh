  \ scene = new Scene(root, 600, 400);\n        primaryStage.setScene(scene);\n  \
  \      primaryStage.show();\n    }\n\n    public static void main(String[] args)\
  \ {\n        launch(args);\n    }\n}\n```\n\n我们的 `PFT` 应用现在在布局器内部包含了一些占位内容（参考图 11.7）：\n\
