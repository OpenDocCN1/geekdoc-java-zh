  正如在本章中所看到的，Java 为我们提供了两种基本的流类型用于读写数据：字符流和字节流。我们使用 `Reader` 和 `Writer` 类通过字符流来处理文本数据，使用\
  \ `InputStream` 和 `OutputStream` 类通过字节流来处理二进制数据。\n\n这些流对于 Digitale 处理媒体文件、元数据和用户生成的内容至关重要。理解字符流和字节流之间的区别可以帮助我们为每个任务选择最有效的方法。我们将在本节重点关注这一点。\n\
  \n### 字符流和字节流的区别\n\n字符流和字节流之间的关键区别在于它们处理的数据类型以及处理数据的方式。字符流处理文本数据（字母、数字和符号）。字节流处理原始二进制数据，这对于处理图像、音频和视频等非文本数据非常理想。\n\
  \n让我们详细探索这两种类型的流。\n\n### 字符流\n\n我们可以使用 `Reader` 和 `Writer` 类通过字符流来处理文本数据。这些类处理 Unicode\
  \ 字符，使其成为读写文本文件、配置文件和日志的理想选择。关键类包括 `FileReader`、`FileWriter`、`BufferedReader`、`BufferedWriter`\
  \ 和 `PrintWriter`。\n\n以下是使用 `FileWriter` 写文本文件的示例：\n\n```java\nimport java.io.FileWriter;\n\
  import java.io.IOException;\n\npublic class PlaylistWriter {\n    public static\
  \ void main(String[] args) {\n        String fileName = \"playlist.txt\";\n    \
  \    try (FileWriter writer = new FileWriter(fileName)) {\n            writer.write(\"\
  Whispering Pines - The Howling Wolves\\n\");\n            writer.write(\"Ocean Breeze\
  \ - The Soaring Eagles\\n\");\n            System.out.println(\"Playlist saved.\"\
  );\n        } catch (IOException e) {\n            System.err.println(\"Error writing\
  \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上述示例中，我们使用 `FileWriter`\
  \ 写入人类可读的文本。这种方法会自动处理字符编码，帮助我们避免非美国信息交换代码（ASCII）文本的损坏。\n\n### 字节流\n\n字节流用于使用 Java\
  \ 的 `InputStream` 和 `OutputStream` 类处理二进制数据。这些流通常用于媒体文件、图像和加密数据。与字节流配合的关键类是 `FileInputStream`、`FileOutputStream`、`BufferedInputStream`、`BufferedOutputStream`、`DataInputStream`\
  \ 和 `DataOutputStream`。\n\n让我们来看一个使用 `FileInputStream` 和 `FileOutputStream` 拷贝二进制文件的示例。以下是代码：\n\
  \n```java\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\nimport\
  \ java.io.IOException;\n\npublic class MediaFileCopy {\n    public static void main(String[]\
  \ args) {\n        String sourceFile = \"original.mp3\";\n        String destinationFile\
  \ = \"copy.mp3\";\n        try (FileInputStream fis = new FileInputStream(sourceFile);\n\
  \             FileOutputStream fos = new FileOutputStream(destinationFile)) {\n\
  \            byte[] buffer = new byte[1024]; // 1KB buffer\n            int bytesRead;\n\
  \            while ((bytesRead = fis.read(buffer)) != -1) {\n                fos.write(buffer,\
  \ 0, bytesRead);\n            }\n            System.out.println(\"File copied successfully.\"\
  );\n        } catch (IOException e) {\n            System.err.println(\"Error copying\
  \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n这种方法对于音频、视频和加密数据等非文本文件非常理想。它与原始字节工作，从而在不产生任何编码问题的情况下保留文件结构。\n\
  \n### 每种类型流的用例\n\n在决定使用哪种流时，取决于你的应用程序处理的数据类型。如果你使用文本数据，你将实现字符流。如果你处理的是图像、音频或视频等非文本数据，你将实现字节流。\n\
  \n#### 字符流的使用\n\n正如我们看到的，字符流对于文本文件、结构化文本数据文件和人类可读的内容是理想的。这里有一个基于 Digitale 场景的最后一个字符流示例。以下示例使用\
  \ `BufferedReader` 从文件中读取歌词：\n\n```java\nimport java.io.BufferedReader;\nimport\
  \ java.io.FileReader;\nimport java.io.IOException;\n\npublic class LyricsReader\
  \ {\n    public static void main(String[] args) {\n        String fileName = \"\
  song_lyrics.txt\";\n        try (BufferedReader br = new BufferedReader(new FileReader(fileName)))\
  \ {\n            String line;\n            while ((line = br.readLine()) != null)\
  \ {\n                System.out.println(line);\n            }\n        } catch (IOException\
  \ e) {\n            System.err.println(\"Error reading lyrics: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n#### 字节流的使用\n\n字节流对于二进制文件、性能敏感型应用和精确的文件控制很有用。在我们最后一个字节流示例中，我们为\
  \ Digitale 实现了音频文件的流传输，使用了 `BufferedInputStream`。以下是代码：\n\n```java\nimport java.io.BufferedInputStream;\n\
  import java.io.FileInputStream;\nimport java.io.IOException;\n\npublic class AudioStream\
  \ {\n    public static void main(String[] args) {\n        String fileName = \"\
  audio.mp3\";\n        try (BufferedInputStream bis = new BufferedInputStream(new\
  \ FileInputStream(fileName))) {\n            byte[] buffer = new byte[4096]; //\
  \ 4KB buffer\n            int bytesRead;\n            while ((bytesRead = bis.read(buffer))\
  \ != -1) {\n                System.out.println(\"Streaming \" + bytesRead + \" bytes...\"\
  );\n            }\n        } catch (IOException e) {\n            System.err.println(\"\
  Error streaming audio: \" + e.getMessage());\n        }\n    }\n}\n```\n\n## 总结\n\
  \n本章探索了 Java 的 I/O 能力，涵盖了高效管理 I/O 所需的技术。我们从使用 `Scanner` 类处理基础输入开始，学习了如何交互式地读取用户输入并解析结构化文本文件。我们还探索了\
  \ Java 的 `java.nio` 包以改进文件操作，包括高效读写文本数据。本章介绍了序列化和反序列化，这是一种结构化方式存储 Java 对象的强大技术。章节演示了它如何让像\
  \ Digitale 这样的应用程序实现媒体元数据、用户列表和播放历史的持久化，同时保持对象结构的完整性。\n\n本章还考虑了性能优化，使用缓冲流减少直接磁盘访问，并使用数据流进行高效的二进制数据存储。最后，我们检查了字符流和字节流。\n\
  \n下一章将介绍使用 Java 数据库连接 (JDBC) 将 Java 应用程序连接数据库。章节将展示如何在项目中设置 JDBC、建立数据库连接并执行结构查询语言\
  \ (SQL) 查询。章节还解释了如何使用预编译语句和调用语句来安全高效地与数据库交互。此外，章节探讨了如何在 Java 中处理数据库事务，以确保应用程序的一性和可靠性。强调了数据库操作的最佳实践以确保最优性能。\n\
  \n涵盖主题包括数据库和 JDBC 简介、设置 JDBC、建立连接、执行查询、预编译语句、调用语句、JDBC 中的事务处理以及数据库操作最佳实践。\n\n##\
  \ 记忆点\n\n*   向文件追加数据时应小心，避免产生不必要的空行或覆盖现有内容。\n\n*   二进制数据（如图像和音频文件）应使用字节流而非字符流进行处理。\n\
  \n\n\n\n\n- `Buffered streams`（缓冲流）推荐通过减少读写操作次数来高效处理大文件。\n- `Character streams`（字符流）旨在处理文本数据并自动处理字符编码。\n\
  - `Data streams`（数据流）允许以紧凑的二进制格式对原始数据类型进行高效的存储和检索。\n- 如果类结构自对象序列化以来发生了变化，反序列化可能会失败，除非正确使用了\
  \ `serialVersionUID`。\n- 在执行文件 I/O 时应始终实现异常处理，以防止由于文件缺失或访问问题导致应用程序崩溃。\n- 与旧的 `java.io`\
  \ 方法相比，使用 `java.nio.file` 包进行 Java 文件处理更高效、更灵活。\n- 文件读取操作应始终正确关闭资源以防止内存泄漏，理想情况下是使用\
  \ `try-with-resources`。\n- 文件写入应使用适当的 `StandardOpenOption` 设置，以实现覆盖或追加数据。\n- Java\
  \ 序列化允许将对象转换为字节流并保存到文件中，以便日后检索。\n- 大文件应使用 `buffered streams` 进行读写以优化性能。\n- 混合使用\
  \ `scanner` 方法可能会导致输入跳过问题，因此我们应该在读取数字后消耗换行符。\n- `Object streams`（对象流）允许从文件中存储和检索完整的\
  \ Java 对象。\n- 在处理大量数据时，如果没有缓冲，可能会出现性能问题。\n- 使用 `BufferedReader` 读取文件通过分块读取数据而非逐个字符读取来提高效率。\n\
  - 序列化对于持久化复杂对象非常有用，但应谨慎使用以确保类不同版本之间的兼容性。\n- 文本数据应使用 `character streams`（字符流）存储，而原始二进制数据应使用\
  \ `byte streams`（字节流）存储。\n- `java.nio.file` 中的 `Files` 类提供了简洁读取、写入、复制和删除文件的实用方法。\n\
  - `Scanner` 类常用于从控制台读取用户输入以及逐行解析文本文件。\n- 应使用 `try-with-resources` 语句管理文件流，以确保资源自动关闭。\n\
  - 使用 `BufferedWriter` 写入文件可以提高效率并允许在不影响现有内容的情况下追加文本。\n- 处理大型数据集时，使用 `DataOutputStream`\
  \ 和 `DataInputStream` 进行结构化二进制存储可以显著提高性能。\n\n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对文件处理、序列化和\
  \ I/O 优化进行批判性思考：\n\n- **优化日志文件管理**：NebulaTunes 是一家未来的音乐流媒体服务，会将用户流的每首歌记录到文件中。系统每天写入数百万条日志记录，导致性能缓慢和磁盘\
  \ I/O 过头。公司目前的日志系统使用 `FileWriter` 将每条记录直接写入文本文件，但最近的系统监控显示磁盘写入正在降低整体性能。\n    - 供你考虑：NebulaTunes\
  \ 如何在确保所有数据都正确写入的情况下提高日志性能？缓冲写入是一个合适的解决方案吗？为什么？如果日志文件变得太大，可以使用什么策略来高效管理它们？\n\n-\
  \ **处理 StarMap AI 跨版本系统中的用户偏好**：StarMap AI 是一个空间探索平台，使用 Java 序列化存储用户偏好和配置设置。公司最近引入了原始系统不存在的新设置，现在旧的序列化偏好文件无法正常加载，抛出\
  \ `InvalidClassException`。在应用程序之前的版本中存储偏好的用户无法再次加载他们的设置，因为类结构已经发生了变化。\n    - 供你考虑：导致此问题的原因是什么？如何修改序列化以允许向后兼容？`serialVersionUID`\
  \ 在维护类兼容性方面有什么帮助？在这种情况下，基于 JavaScript 对象表示（JSON）的存储是否是 Java 序列化的更好替代方案？\n\n- **在仙户座档案中高效处理大型媒体文件**：仙户座档案是一个星际广播的数字图书馆，存储了海量的音频视频文件。系统频繁复制和传输大型二进制媒体文件，但由于文件处理效率低下，一直以来性能缓慢。开发者目前使用\
  \ `FileInputStream` 和 `FileOutputStream`，但观察到处理大文件（超过 1GB）时处理速度大幅下降。\n    - 供你考虑：缓冲流在处理大型二进制文件时如何提高性能？对于这些媒体文件，使用字节流或字符流更合适？最小化内存占用的实现文件复制的最佳方法是什么？\n\
  \n- **为 QuantumMetrics 结构化并存储高频传感器数据**：QuantumMetrics 是一家深空数据分析公司，从卫星和深空探测器收集实时传感器数据。数据包括每秒记录一次的高精度浮点值（例如温度和辐射水平）。目前，公司将传感器数据以纯文本格式写入逗号分隔值（CSV）文件。然而，他们注意到在回读数据时存储需求增长并出现性能问题。\n\
  \    - 供你考虑：切换到 `DataOutputStream` 的二进制存储会提高效率吗？为什么或不为什么？与文本存储相比，结构化二进制格式（例如 `DataOutputStream`）如何帮助更快地读取传感器数据？使用人类可读格式（例如\
  \ CSV 或 JSON）与二进制格式（例如序列化对象、二进制流）之间的权衡是什么？\n\n- **为 CyberCore 实现安全的用户身份验证系统**：CyberCore\
  \ 是一家网络安全公司正在开发一种安全的登录系统，在将用户凭存储到文件中之前对其加密。他们必须确保敏感信息（例如用户名和哈希密码）安全存储，而不会以明文形式访问。目前，用户凭据使用\
  \ `FileWriter` 写入简单的文本文件，使其受到数据泄露的影响。\n    - 供你考虑：为什么明文存储用户密码是一个重大的安全风险？使用 `DataOutputStream`\
  \ 或 Java 序列化会提供更好的安全性吗？如何将加密集成到 Java 的 I/O 系统以安全存储凭据？\n\n## 单选题\n\n1. 下面哪项最能描述 Java\
