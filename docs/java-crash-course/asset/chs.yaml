  \n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对章节内容进行批判性思考：\n\n*   **应届的计算机科学毕业生**：Priya 最近完成了她的计算机科学本科学学位。她在大学里上过几门\
