  \ HEX 代码的能力：[`g.co/kgs/dhRXrzd`](https://g.co/kgs/dhRXrzd) |\n\n### 交易表格\n\n我们的交易表格在输入交易时能够充分地记录交易，但它仅此此功能。它不允许允许用户查看交易发生的时间戳，也不允许他们删除交易。我们现在来处理这两个问题。\n\
