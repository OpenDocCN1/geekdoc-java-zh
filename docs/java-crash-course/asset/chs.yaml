  \ PFT 应用程序。\n\n## 布局、控件和事件处理\n\n上一节介绍了 PFT 桌面应用程序阶段和场景的创建。我们添加了 Logo 和标题。本节通过引入布局、控件和事件处理来扩展应用程序。具体来说，我们将探索如何使用布局组织\
  \ UI 组件、如何使用控件捕捉用户输入以及如何通过事件处理响应用户行为。\n\n### 布局\n\n布局是 GUI 的重要方面。它们是组织元素的容器。布局容器可以根据屏幕大小自动调整。常见的\
  \ JavaFX 布局容器是 `VBox` 和 `HBox`，正如其名称所示，它们按垂直和水平排列元素。\n\n注意：布局容器也可以被称为布局管理器。这两个术语是通用的。\n\
  \n`VBox` 布局的的用途包括表单、菜单和我们垂直对齐的内容。`HBox` 是用于头部和页脚部分、工具栏、按钮和输入字段的常用布局容器。`BorderPane`\
  \ 可用于将 UI 分为左、右、中间、顶部和底部（参见图 11.6）。我们对这些部分的大小有完全的控制。\n\n![一个带有五个标记部分的图：Top、Left、Center、Right\
  \ 和 Bottom。顶部和底部跨越宽度。中间行有 Left、Center 和 Right 列。 ](img/Figure_11.6.png)\n\n图 11.6：JavaFX\
  \ BorderPane 部分\n\n`GridPane` 是另一种常见的布局管理器。它用于表格、表单和其他结构化布局。\n\n让我们更新 PFT 应用程序以包含以下布局管理器：\n\
  \n*   使用 `BorderPane` 作为主布局，带有这些部分：\n    *   顶部：我们将 Logo 和标题放在这里。\n    *   左侧和右侧：我们将使用这些部分填充中间。\n\
  \    *   中间：它将包含一个 `VBox` 和一个 `HBox`。\n    *   底部：我们将显示一个版权标签。\n\n\n\n\n\n*   `HBox`:\
  \ 我们将用它用于按钮。\n*   `GridPane`: 我们将用它用于数据表。\n\n以下是实现我们布局器的代码：\n\n```java\nimport javafx.application.Application;\n\
  import javafx.geometry.Insets;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Label;\n\
  import javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.GridPane;\nimport javafx.scene.layout.HBox;\nimport javafx.scene.layout.VBox;\n\
  import javafx.stage.Stage;\n\npublic class PFTApp extends Application {\n\n    @Override\n\
  \    public void start(Stage primaryStage) {\n        primaryStage.setTitle(\"个人财务追踪器\"\
  );\n        // BorderPane 布局\n        BorderPane root = new BorderPane();\n    \
  \    root.setPadding(new Insets(10));\n        // BorderPane - Top\n        Label\
