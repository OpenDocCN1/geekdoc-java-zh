  \n## 开发一个基础数据库应用程序\n\n我们的第二个项目要求我们构建一个宠物医疗记录系统 (PMRS)。这是一个命令行数据库应用程序，用于跟踪宠物、它们的就诊情况以及任何处方药物。这个受现实启发的系统模拟了一个轻量级的兽医诊管理工具，旨在让你获得\
  \ Java 和 SQLite 集成的实践经验。\n\n我们的目标是创建 PMSR，允许用户执行以下操作：\n\n* 添加、查看、编辑和删除宠物记录。\n* 记录就诊情况并与宠物关联。\n\
  * 跟踪每只宠物的处方药物。\n* 导航基于菜单的界面，该界面将循环直到用户退出。\n\n该应用程序的要求是：\n\n* 使用 `SQLite` 在名为 `pmrs.db`\
  \ 的文件中进行持久化存储。\n* 包括三个表：`Pets`、`MedicalVisits` 和 `Medications`。\n* 为每个表实现完整的增、删、改、查\
  \ (CRUD) 功能。\n* 使用 `Java` 原生的 `JDBC` API 连接并与数据库交互。\n* 界面基于命令行，使用菜单和文本提示。\n\n###\
  \ 设计\n\n我们的设计有两个方面：数据库架构和用户界面。图 14.2 显示了数据库架构：\n\n![一个数据库架构图显示了三个表：Pets、MedicalVisits\
  \ 和 Medications，每个表，每个表都有列名、数据类型和描述，用于管理宠物记录、就诊和药物。 ](img/Figure_14.2.png)\n\n图\
  \ 14.2：PMRS 数据库架构\n\n接下来，我们需要设计用户界面。图 14.3 显示了我们将在此应用程序中使用的文本菜单系统：\n\n![一个流程图显示了一个包含四个选项的主菜单，以及连接到三个子菜单的线条：管理宠物、管理药物和管理就诊，每个菜单都列出了六个相关选项。\
  \ ](img/Figure_14.3.png)\n\n图 14.3：PMRS 菜单设计\n\n### 实现\n\n现在我们有了系统需求、数据库架构和设计好的用户界面。我们的第一个实现步骤是创建数据库。\n\
  \n#### 数据库初始化\n\n我们可以创建一个 `PMRSDatabaseInitializer.java` 类来创建我们的数据库及其表。以下是该代码：\n\
  \n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
  import java.sql.Statement;\n\npublic class PMRSDatabaseInitializer {\n\n    private\
  \ static final String DB_URL = \"jdbc:sqlite:pmrs.db\";\n\n    public static void\
  \ main(String[] args) {\n        try (Connection conn = DriverManager.getConnection(DB_URL))\
  \ {\n            if (conn != null) {\n                createTables(conn);\n    \
  \            System.out.println(\"数据库和表创建成功.\");\n            }\n        } catch\
  \ (SQLException e) {\n            System.out.println(\"初始化错误: \" + e.getMessage());\n\
  \        }\n    }\n\n    private static void createTables(Connection conn) throws\
  \ SQLException {\n        Statement stmt = conn.createStatement();\n        // 创建\
  \ Pets 表\n        String createPetsTable = \"\"\"\n            CREATE TABLE IF NOT\
  \ EXISTS Pets (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n       \
  \         name TEXT NOT NULL,\n                breed TEXT,\n                age\
  \ INTEGER,\n                species TEXT NOT NULL\n            );\"\"\";\n     \
  \   // 创建 MedicalVisits 表\n        String createVisitsTable = \"\"\"\n         \
  \   CREATE TABLE IF NOT EXISTS MedicalVisits (\n                id INTEGER PRIMARY\
  \ KEY AUTOINCREMENT,\n                pet_id INTEGER,\n                date TEXT\
  \ NOT NULL,\n                reason TEXT,\n                FOREIGN KEY (pet_id)\
  \ REFERENCES Pets(id)\n            );\"\"\";\n        // 创建 Medications 表\n    \
  \    String createMedicationsTable = \"\"\"\n            CREATE TABLE IF NOT EXISTS\
  \ Medications (\n                id INTEGER PRIMARY KEY AUTOINCREMENT,\n       \
  \         visit_id INTEGER,\n                medication_name TEXT NOT NULL,\n  \
  \              dosage TEXT,\n                FOREIGN KEY (visit_id) REFERENCES MedicalVisits(id)\n\
  \            );\"\"\";\n        stmt.execute(createPetsTable);\n        stmt.execute(createVisitsTable);\n\
  \        stmt.execute(createMedicationsTable);\n        stmt.close();\n    }\n}\n\
  ```\n\n我们可以通过以下步骤运行我们的 `PMRSDatabaseInitializer.java` 类：\n\n1. 将从第十章，数据库连接获得的 `sqlite.jar`\
  \ 文件放入你的 PMRS 项目文件夹。\n2. 使用此命令编译 `.java` 文件：`javac -cp \".:sqlite-jdbc-3.49.jar\"\
  \ PMRSDatabaseInitializer.java`\n3. 使用此命令运行：`java -cp \".:sqlite-jdbc-3.49.jar\"\
  \ PMRSDatabaseInitializer`\n\n你应该收到以下输出：\n数据库和表创建成功。\n\n你还会在文件夹中看到 `pmrs.db`（数据库）。\n\
