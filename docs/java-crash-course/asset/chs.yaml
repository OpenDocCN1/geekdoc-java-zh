  \n![QR-Logo](img/fm1.png)\n\n# 第 14 章 真实 Java 项目\n\n## 引言\n\n之前的章节探索了从基础原理到高级概念的\
  \ Java。这包括面向对象编程 (`OOP`)、并发、数据库交互和函数式编程。本章为你提供了一个机会，通过开发真实的 Java 项目将之前涵盖的所有内容付诸实践。每个项目的设计旨在增强你的技能，允许你将理论知识应用于现实场景。书中包含了四个不同的项目：一个简单的命令行应用程序、一个数据库应用程序、一个多线程数据处理器以及一个使用\
  \ streams 和 lambdas 的函数式编程程序。每个项目将包含项目概述与需求、设计、实现、测试以及项目扩展。这些实操项目可以加强你的理解，并建立开发健壮、高效且用户友好\
  \ Java 应用的信心。\n\n## 结构\n\n本章涵盖了以下主题：\n\n* 构建一个简单的命令行应用程序\n* 开发基础数据库应用程序\n* 构建多线程数据处理器\n\
  * 使用 streams 和 lambdas 编写函数式程序\n\n## 目标\n\n在本章结束时，你应该能够设计并实现一个简单的命令行 Java 应用，开发一个数据库驱动的\
  \ Java 应用，构建一个多线程数据处理器，并使用 Java `Streams` 和 lambdas 编写函数式编程应用。\n\n## 构建一个简单的命令行应用程序\n\
  \n该项目要求我们构建一个简单的文本冒险游戏，玩家通过做出决策来穿过简短的互动故事。游戏由三个连续的房间组成，玩家的选择将影响最终结果。最后一个房间将根据他们之前的决定决定他们是获得好结局还是坏结局。\n\
  \n该项目有助于强化基础 Java 概念，包括：\n\n* 通过控制台处理用户输入\n* 使用条件语句\n* 应用循环\n\n游戏的要求如下：\n\n* 游戏从\
  \ Room 1 开始，玩家在那里做出初始决策。\n* Room 1 通向 Room 2，在那里必须做出另一个决定。\n* Room 2 通向 Room 3，这是在决定结果之前的最后的挑战。\n\
  * 在 Room 3 中，玩家先前的决定会影响最终结果（好结局或坏结局）。\n* 游戏为每个决策提供文本反馈。\n* 如果玩家想重玩，游戏将回到开头。\n\n\
  ### 设计\n\n如 ` 14.1` 所示，游戏将遵循一个简单的决策树：\n\n![流程图显示了通过三个房间的决策路径，带有 A 和 B 选项，根据 tookPath、foundKey\
  \ 和 answeredTruthfully 的条件导致坏结局或好结局。](img/figure_14.png)\n\n图 14.1：游戏流程\n\n表 14.1\
  \ 提供了关于每个房间选项的细节：\n\n| 房间 | 场景 | 选择 | 变量 | 结果 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | 你在一个洞穴里看到两条路。 | A—走左路 | `tookLeftPath = true` | 进入 Room 2 |\n| | B—走右路\
  \ | | |\n| 2 | 你发现了一扇锁着的门。 | A—敲门 | | 进入 Room 3 |\n| | B—寻找钥匙 | `foundKey = true`\
  \ | | |\n| 3 | 一个神秘人物让你解谜。 | A—诚实回答 | `answeredTruthfully = true` | 决定好坏结局 |\n|\
  \ | B—撒谎 | | |\n\n表 14.1：游戏决策映射\n\n回顾游戏流程和用户选项可以发现，他们需要做出以下决策才能获得结局（逃离洞穴）；任何偏离此操作的都会导致坏结局（陷阱）。\n\
  \n* 从 Room 1 走左路\n* 在 Room 2 寻找钥匙\n* 在 Room 3 诚实回答\n\n### 实现\n\n以下是简单文本冒险游戏的 Java\
