  \ 进行模块化的主要优势是什么？它如何提高应用程序的结构、安全性和性能？\n2. 虚拟线程与传统的平台线程有何区别？在什么场景下使用虚拟线程会更有利？\n3.\
  \ 解释模式匹配如何增强 Java 的 `switch` 表达式。与传统的 `switch` 语句相比，这提供了哪些优势？\n4. `JEP 477` 引入了隐式声明类和实例\
  \ main 方法。此功能如何简化 Java 开发？在哪些情况下使用 `JEP 477` 可能不合适？\n5. 密封类允许开发者限制继承。在什么类型的应用程序中密封类会特别有用？它们如何帮助安全性和维护性？\n\
  \n## 答案\n\n1. Project Jigsaw 的优势：\n- 代码被封装，仅暴露必要的 API。这减少了意外访问。\n- 模块可以限制内部实现的可见性，从而提高了安全性。\n\
  - JVM 仅加载所需的模块，这减少了内存开销并提升了性能。\n- 我们可以独立地更新和调试特定模块，而不影响应用的其他部分，使代码更易维护。\n\n2. 虚拟线程对比平台线程：\n\
  - 虚拟线程是轻量级的，消耗内存极少。这允许数百万并发操作。\n- 平台线程是重量级的，与操作系统线程绑定且数量有限。\n- 虚拟线程的使用场景包括高并发应用，例如聊天服务器、事务处理和需要并发处理数千个任务的\
  \ Web 服务。\n\n\n\n\n\n### 3. switch 表达式中的模式匹配：\n\n* 模式匹配通过消除对冗长 if-else 结构的需求，简化了我们的代码。\n\
  * switch 语句中的模式匹配提高了我们代码的可读性。它允许在 switch 分（cases）中直接进行类型检查和变量声明。\n* 一个应用用例是处理不同类型的金融交易，或根据属性对客户订单进行分类。\n\
  \n### 4. JEP 477 简化：\n\n* 它通过消除小型 Java 程序中对显式类声明的需求，减少了样板代码。\n* 它使用类似于 `Python`\
  \ 和 `JavaScript` 等脚本语言的语法，提高了可读性。\n* 这不适用于需要显式面向对象结构、复杂业务逻辑或依赖管理的大型应用。\n\n### 5.\
  \ 密封类（Sealed classes）：\n\n* 示例 1：通过防止未经授权的子类来增加安全性。这确保了受控的类层次结构。\n* 示例 2：通过限制外部开发者扩展库的方式，提高\
  \ API 的稳定性。\n* 用例：RBAC 系统、金融交易处理，以及需要严格控制特定子类的企业级应用。\n\n# 第 13 章 调试、测试与部署\n\n##\
  \ 引言\n\n使用 `Java` 开发软件是一项令人愉快的工作。我们为应用程序投入了大量的时间和精力，有时这些程序可能需要几年时间才能完成。这只是过程的一部分。一旦部署，我们就必须支持我们的应用程序，这需要调试、测试和部署。几乎无例外，我们花费在支持软件上的时间比创建它们的时间多。\n\
  \n本章涵盖了可以帮助我们高效识别和解决错误的调试技术。这些技术可以包括简单的打印语句、日志框架以及带有内置调试工具的集成开发环境（`IDEs`）。我们必须熟悉调试策略，以便在\
  \ `Java` 应用程序部署到生产环境后能够对其提供支持。\n\n本章还探讨了使用 `JUnit` 测试框架进行单元测试。你将有机会学习如何采用测试驱动开发（`TDD`）原则，以帮助你创建可靠、易维护的应用程序。我们还将涵盖构建测试结构的最佳实践，以帮助我们在开发周期早期发现问题。\n\
  \n我们将通过介绍打包和部署来结束本章。将介绍 `Maven` 和 `Gradle` 等构建工具，以简化依赖管理并自动化软件部署。\n\n## 结构\n\n本章涵盖了以下主题：\n\
  \n* `Java` 中的调试\n* 使用 `JUnit` 进行单元测试\n* 编写可测试的代码\n* 测试驱动开发\n* 打包和部署 `Java` \n* 构建工具简介\n\
  \n## 目标\n\n在本章结束时，你应该能够使用调试工具识别问题并利用日志框架。你还应该理解并能够使用 `JUnit` 编写单元测试。此外，在本章结束时，你应该能够应用\
  \ `TDD` 原则，对构建工具有坚实的理解，并能够打包和部署 `Java` 应用程序。\n\n## Java 中的调试\n\n无论我们的代码写得有多好，它都不可能没有错误。这并不是反映了我们的代码水平，而是反映了环境问题，如电源、`APIs`\
  \ 变化、网络和互联网中断、用户行为等。这强调了调试的重要性。本节探讨了调试策略、工具和最佳实践，以帮助简化调试过程。\n\n| 注意：调试是识别、分析和解决错误或意外应用程序行为的过程。\
  \ |\n\n错误有三种类型：逻辑错误、语法错误和运行时错误。逻辑错误是我们在创建软件时犯的错误。我们的逻辑是错误的，所以结果是不正确的。应用程序不会崩溃或抛出异常；结果只是不正确。考虑以下示例。代码将正确编译，没有错误；但输出是错误的。\n\
  \n```java\npublic class LogicError {\n    public static void main(String[] args)\
  \ {\n        double price = 3.19;\n        int quantity = 10;\n        double total\
  \ = price + quantity;\n        System.out.println(\"The total price is: \" + total);\n\
  \    }\n}\n```\n\n我们示例中的输出是 `13.19`，而它应该是 `31.90`。\n\n第二种错误是语法错误。这些错误是因为我们没有正确遵循\
  \ `Java` 的语法，或者简单地说，是在代码中写了拼写错误。例如，图 13.1 中的代码显示第 3 行缺少右括号和分号。`IDE` 为我们捕获这一点，并提供了视觉指示显示错误所在位置。\n\
  \n![一个 Java 代码编辑器的截图，显示一个 SyntaxError 类。main 方法打印 Read more BPB books! 但缺少一个右括号和分号，并被内联注释突出显示。\
  \ ](img/Figure_13.1.png)\n\n图 13.1：IDE 中捕获的语法错误\n\n我们的最后一种错误是运行时错误，它们发生在应用程序运行时。这些是最糟糕的，因为如果我们不捕获它们，就会破坏用户体验。运行时错误的示例有\
  \ `NullPointerException` 和 `ArithmeticException`。另一个在以下代码中演示示例是 `ArrayIndexOutOfBoundsException`：\n\
  \n```java\npublic class RuntimeError {\n    public static void main(String[] args)\
  \ {\n        int[] numbers = {1, 2, 3};\n        // 尝试访问无效索引\n        System.out.println(numbers[5]);\n\
  \    }\n}\n```\n\n这里是该代码生成的错误：\n\n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
  \ Index 5 out of bounds for length 3\nat RuntimeError.main(RuntimeError.java:6)\n\
  ```\n\n理解这三种类型的错误是关重要的，这样我们就能让调试工作更高效、更有效。\n\n### IDE 调试工具\n\n所有现代 `IDEs` 都有某种程度的调试功能。它们帮助我们检查代码并分析其执行情况。Visual\
  \ Studio Code (`VS Code`) 中的关键调试功能包括断点、调用栈检查、控制台日志和步执行。让我们查看其中的每一个。\n\n#### 断点\n\
  \n我们可以添加断点来暂停代码执行，以便检查变量、输出等。要添加断点，只需点击行号左侧的边缘区域（参见图 13.2 的第一部分）。`VS Code` 会在边缘放置一个红点，指示该行有断点。\n\
  \n![三张图片显示在 Java 代码中设置和管理断点。断点以红点显示；上下文菜单提供了断点选项；代码编辑器显示带有调试表达式的 for 循环。 ](img/Figure_13.2.png)\n\
  \n图 13.2：断点序列\n\n我们可以通过右键点击断点（红点）并选择编辑断点……来使用条件断点，如图 13.2 第二部分所示。这弹出了图 13.2 的第三部分，我们可以在其中选择表达式、命中计数、日志消息或等待断点。\n\
  \n这里是图 13.2 中引用的代码：\n\n```java\npublic class DebugBreakpoints {\n    public static\
  \ void main(String[] args) {\n        for (int i = 0; i < 10; i++) {\n         \
  \   System.out.println(\"Iteration: \" + i);\n        }\n    }\n}\n```\n\n断点允许我们暂停代码执行并检查变量和行为。\n\
  \n#### 调用栈检查\n\n\n\n\n我们可以使用 VS Code 中的 `CALL STACK`（调用栈）面板来跟踪方法的调用序列。要打开此面板，你需要使用\
  \ `RUN AND DEBUG` 命令运行程序。它可以通过左侧导航栏访问，外观像一个带有播放按钮的虫子，如图图 13.3 所示：\n\n![代码编辑器调试面板的截图，显示了变量（Variables）、监听（Watch）和展开的调用栈（Call\
  \ Stack）部分。运行和调试栏位于顶部，有一个标记为当前文件（Current File）的播放按钮。](img/Figure_13.3.png)\n\n图\
  \ 13.3：调试和运行图标及其位置\n\n### 控制台日志\n\n我们可以轻松地在代码各处添加打印语句，帮助我们确定变量状态和执行流。我们可以在代码中到处散布\
  \ `System.out.println()` 方法调用来进行简单调试，但使用 Java 的 `java.util.logging` 包可以让我们对日志级别和输出有更好的控制。\n\
  \n这里是一个使用 `java.util.logging` 包的示例程序：\n\n```java\nimport java.util.logging.Level;\n\
  import java.util.logging.Logger;\n\npublic class ConsoleLogging {\n    // 创建日志器实例\n\
  \    private static final Logger logger = Logger.getLogger(ConsoleLogging.class.getName());\n\
  \n    public static void main(String[] args) {\n        logger.info(\"Application\
  \ started.\");\n        int number1 = 10;\n        int number2 = 5;\n        logger.fine(\"\
  Variables initialized: number1=\" + number1 + \", number2=\" + number2);\n     \
  \   try {\n            int result = divideNumbers(number1, number2);\n         \
  \   logger.info(\"Result of division: \" + result);\n        } catch (ArithmeticException\
  \ e) {\n            logger.log(Level.SEVERE, \"An error occurred during division:\
  \ \", e);\n        }\n        logger.info(\"Application finished.\");\n    }\n\n\
  \    private static int divideNumbers(int num1, int num2) {\n        logger.fine(\"\
  Dividing numbers: \" + num1 + \" / \" + num2);\n        if (num2 == 0) {\n     \
  \       throw new ArithmeticException(\"Division by zero!\");\n        }\n     \
  \   return num1 / num2;\n    }\n}\n```\n\n这里是我们程序的控制台日志：\n\n```\nMar 19, 2025 12:04:26\
  \ AM ConsoleLogging main\nINFO: Application started.\nMar 19, 2025 12:04:26 AM ConsoleLogging\
  \ main\nINFO: Result of division: 2\nMar 19, 2025 12:04:26 AM ConsoleLogging main\n\
  INFO: Application finished.\n```\n\n日志记录允许我们区分普通输出、调试信息和错误消息。这是生产环境中的一种良好调试方法。\n\
  \n### 步骤执行\n\n另一种由 IDE 支持的调试技术是逐行执行我们的代码。这允许我们观察软件如何运行以及变量是如何改变的。VS Code 为我们提供了几种方法来实现这一点：\n\
  \n*   **单步跳过（Step over）**：执行当前行代码并移动到下一行，不进入方法调用。\n*   **单步进入（Step into）**：程序流进入方法调用并调试其执行。\n\
  *   **单步跳出（Step out）**：跳出当前方法并返回调用者。\n*   **继续（Continue）**：恢复程序的正常执行，直到遇到下一个断点。\n\
  \n使用这些功能可以帮助我们从细粒度上检查代码的执行情况。\n\n### 调试策略\n\n这里是十种调试策略，也是最佳实践：\n\n*   自动化测试\n* \
  \  检查堆栈跟踪\n*   检查变量状态\n*   隔离代码段\n*   复现 bug\n*   从简单解决方案开始\n*   增量测试\n*   使用断言（`assert`\
  \ 语句）\n*   使用调试工具\n*   使用版本控制\n\n调试是所有开发者的关键技能。我们幸运的是，IDE 提供了一系列强大的工具来帮助简化我们的调试过程。\n\
  \n## 使用 JUnit 进行单元测试\n\n我们在上一节中涵盖了软件调试。调试本质上是我们在出现问题时所做的事情。而测试我们软件的概念是一个预防性的、主动的过程。本节涵盖了特定的测试类型——单元测试，这是一种基础实践，其中我们验证应用程序的单个组件。我们孤立地测试各个单元。作为\
  \ Java 开发人员，我们倾向于使用 `JUnit` 框架来编写和运行单元测试。本节重点关注单元测试的重要性、如何使用 `JUnit` 以及如何编写和运行单元测试。\n\
  \n单元测试应该遵循以下指南：\n\n*   聚焦于有限的代码单元（例如，一个`method`）。\n*   测试应该是可重复的。\n*   它们应该易于实现/运行。\n\
  *   它们运行应该很快。\n*   测试不应依赖于外部系统（例如数据库、网络等）。\n\n有许多测试框架供我们选择，我们专注于 `JUnit`。正如你在我们的代码示例中看到的，`JUnit`\
  \ 允许我们轻松地编写、运行和维护单元测试。它已经成为 Java 开发中不可不可少的工具。\n\n### JUnit 设置\n\n准备 VS Code 以支持\
  \ `JUnit` 和单元测试涉及几个步骤。第一步是安装 Java 测试运行（Test Runner for Java）。正如你在图 13.4 所示，它支持 `JUnit`：\n\
  \n![Microsoft 提供的“Test Runner for Java”扩展程序列表，显示有 35,208,171 次下载、19 条评论的 4 星级评分，以及禁用、卸载或自动更新的选项。包含一个风格化的咖啡杯图标。](img/Figure_13.4.png)\n\
  \n图 13.4：VS Code 支持 JUnit\n\n安装该扩展后，请遵循后续步骤：\n\n1.  在 VS Code 中创建一个项目。\n2.  创建 `src/main/`\
  \ 和 `src/test/` 文件夹。\n3.  从此站点下载 `JUnit`：[`junit.org/`](https://junit.org/)\n4.\
  \  创建一个 `lib/` 文件夹。\n5.  将 JAR 文件移动到 `lib/` 文件夹。\n6.  接下来，我们需要将 JUnit 添加到类路径中。创建一个\
  \ `.vscode/` 文件夹。\n7.  在 `.vscode/` 文件夹中创建 `settings.json` 文件，内容如下：\n\n```json\n\
  {\n  \"java.project.referencedLibraries\": [\n    \"lib/**/*.jar\"\n  ]\n}\n```\n\
  \n8.  我们现在准备好创建一个测试类了。在 `src/test` 文件夹中创建 `MyTest.java`，内容如下：\n\n```java\nimport\
  \ org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
  \npublic class MyTest {\n    @Test\n    public void additionTest() {\n        assertEquals(2,\
  \ 1 + 1);\n    }\n}\n```\n\n9.  你会注意到没有 `main()` 方法，这没关系。点击代码边格中的绿色箭头（见图 13.5）：\n\
  \n![测试文件的 Java 代码截图。它导入了 JUnit 库，定义了一个 MyTest 类，并包含一个断言 2 等于 1+1 的测试方法。](img/Figure_13.5.png)\n\
  \n图 13.5：VS Code 运行测试\n\n就是如此。现在，让我们看看图 13.5 中的示例代码。正如你看到的，我们使用了断言方法来验证条件。在我们的示例中，我们使用了\
  \ `assertEquals()`。我们为单元测试提供了一个断言来比较结果。还有其他自描述断言方法可以使用：`assertNotEquals()`、`assertTrue()`、`assertFalse()`、`assertThrows()`\
  \ 等。\n\n## 编写可测试的代码\n\n在设计和编写代码时考虑测试是一项最佳实践。如果我们在开发代码时考虑到测试，那么它将具有模块化和松耦合的特点。这将有助于我们编写可重复且易于维护的有意义的测试。\n\
  \n本节回顾了编写可测试代码的几个原则：避免硬编码依赖、实现接口、使用返回值、避免静态方法、避免全局变量以及编写可测试的方法。\n\n\n\n\n```java\n\
  public class OrderProcessor {\n    private final PaymentService paymentService =\
  \ new PaymentService();\n\n    public boolean processOrder(double amount) {\n  \
  \      return paymentService.charge(amount);\n    }\n}\n```\n\n现在，让我们来重构代码，使其使用依赖注入。\n\
  \n```java\npublic class OrderProcessor {\n    private final PaymentService paymentService;\n\
  \n    public OrderProcessor(PaymentService paymentService) {\n        this.paymentService\
  \ = paymentService;\n    }\n\n    public boolean processOrder(double amount) {\n\
  \        return paymentService.charge(amount);\n    }\n}\n```\n\n依赖注入的方法虽然更冗长，但它将允许我们在测试期间模拟\
  \ `PaymentService`。\n\n### 实现接口\n\n使用接口对我们来说并不新鲜；在之前的章节中我们一直在使用它们。只要可能，我们都应该将接口作为具体实现的优选替代。这种方法允许依赖项与替代方案相互交换。\n\
  \n这是一个紧耦合代码的示例：\n\n```java\npublic class EmailSender {\n    public void sendEmail(String\
  \ message) {\n        // 发送邮件的代码（依赖外部系统）\n    }\n}\n```\n\n现在，让我们来看使用接口的松耦合示例：\n\
  \n```java\npublic interface EmailService {\n    void send(String message);\n}\n\n\
  public class EmailSender implements EmailService {\n    @Override\n    public void\
  \ send(String message) {\n        // 真实实现\n    }\n}\n\npublic class NotificationService\
  \ {\n    private final EmailService emailService;\n\n    public NotificationService(EmailService\
  \ emailService) {\n        this.emailService = emailService;\n    }\n\n    public\
  \ void notifyUser() {\n        emailService.send(\"您的订单已经发货！\");\n    }\n}\n```\n\
  \n我们重构的代码在测试中模拟了 `EmailService` 接口，而不是依赖真实的邮件发送系统。\n\n### 返回值\n\n当我们编写输出到控制台的代码时，我们很难为了测试而捕获输出。与其直接打印到控制台，我们应该使用返回值。让我们来看一个直接打印到控制台的示例：\n\
  \n```java\npublic class UserService {\n    public void displayUser(String username)\
  \ {\n        System.out.println(\"User: \" + username);\n    }\n}\n```\n\n那个示例很难测试。为了让这段代码具有测试性，我们可以如下所示使用\
  \ `return` 语句对其进行重构：\n\n```java\npublic class UserService {\n    public String getUser(String\
  \ username) {\n        return \"User: \" + username;\n    }\n}\n```\n\n现在我们可以使用\
  \ `assert` 方法编写测试了：\n\n```java\n@Test\nvoid testGetUser() {\n    UserService userService\
  \ = new UserService();\n    assertEquals(\"User: NeoAnderson\", userService.getUser(\"\
  NeoAnderson\"));\n}\n```\n\n### 避免静态方法\n\n静态方法无法被模拟或重写，使得它们难以测试。\n\n注意：静态方法属于类，而不是属于类的实例。\n\
  \n这是一个增加测试难度的静态方法示例：\n\n```java\npublic class MyMathUtilities {\n    public static\
  \ int square(int x) {\n        return x * x;\n    }\n}\n```\n\n以下重构版本使代码更具测试性：\n\
  \n```java\npublic class MyMathUtilities {\n    public int square(int x) {\n    \
  \    return x * x;\n    }\n}\n```\n\n实例方法比静态方法更具测试性，因为它们支持模拟和依赖注入。\n\n### 避免全局变量\n\
  \n使我们的代码更具测试性的第五个原则是避免全局变量。它们在测试时会引入某种程度的不可预测性，因此导致难以调试。\n\n例如，以下代码使用了静态类级变量：\n\n\
  ```java\npublic class MyCounter {\n    public static int count = 0;\n    public\
  \ static void increment() {\n        count++;\n    }\n}\n```\n\n现在，让我们通过封装变量状态来重构代码，使代码更具测试性：\n\
  \n```java\npublic class MyCounter {\n    private int count = 0;\n\n    public void\
  \ increment() {\n        count++;\n    }\n    public int getCount() {\n        return\
  \ count;\n    }\n}\n```\n\n这种方法确保每个测试都从干净的状态开始，并且不受值可能持续的先前的测试的影响。\n\n### 可测试方法\n\
  \n在编写方法时，我们应该考虑单一职责原则，该原则规定每个方法应该有一个单一目的；即它只做一件事。当遵循这一原则时，我们的方法可能会难以测试。\n\n这是一个执行任务过多的复杂方法示例：\n\
  \n```java\npublic class OrderProcessor {\n    public void processOrder(String productId)\
  \ {\n        // 验证产品\n        // 计算价格\n        // 费用支付\n        // 发送邮件通知\n    }\n\
  }\n```\n\n在这里，我们将之前的 `OrderProcessor` 版本重构为更小的、更具可测试的方法：\n\n```java\npublic class\
  \ OrderProcessor {\n    public boolean validateProduct(String productId) { /* ...\
  \ */ }\n    public double calculatePrice(String productId) { /* ... */ }\n    public\
  \ boolean chargePayment(double amount) { /* ... */ }\n    public void sendNotification(String\
  \ message) { /* ... */ }\n}\n```\n\n重构后的代码允许对每个方法进行单独测试。\n\n#### 在 VS Code 中测试代码\n\
  \n一旦代码结构化以便测试，编写单元测试就会变得简单直易。让我们测试提供的 `OrderProcessor` 类。以下代码演示了一个基础单元测试。\n\n测试类（`OrderProcessorTest.java`）：\n\
  \n```java\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\
  \nclass OrderProcessorTest {\n    private final OrderProcessor processor = new OrderProcessor();\n\
  \n    @Test\n    void testCalculatePrice() {\n        double price = processor.calculatePrice(\"\
  123\");\n        assertTrue(price > 0, \"Price should 大于 zero\");\n    }\n```\n\n\
  ### 测试驱动开发\n\n传统的软件开发涉及编写代码然后进行测试以确保其准确性。相反，TDD 让我们在实现之前编写测试。这种方法有助于确保我们的代码基于详细的需求，减少缺陷并在软件生命周期内节省时间。额外的益处包括：\n\
  \n* 通过测试确保正确性。\n* 改进我们的代码设计（即模块化和简单化）。\n* 支持调试工作。\n\nTDD 是循环的而非线性的，它涉及三个步骤，如（图 13.6：\n\
  \n![一个循环步骤的图，包含框：编写失败的测试、编写简单的代码通过测试、以及重构代码，由箭头连接。](img/Figure_13.6.png)\n\n图 13.6：红-绿-重构循环\n\
  \n第一步（红）让我们编写一个失败的测试。由于代码尚未编写，它被认为是失败的。第二步（绿）是编写最少代码来实现功能，只需通过测试。接下来，重构步骤让我们优化实现并确保测试继续通过。\n\
  \n### 应用 TDD\n\n让我们在一个包含反转字符串字符串工具类中使用 TDD。对于红色阶段，我们编写一个失败的测试。这定义了我们在单元测试中期望的行为。这是一个测试类：\n\
  \n```java\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\
  \npublic class MyStringUtilityTest {\n    @Test\n    void testReverseString() {\n\
  \        String result = MyStringUtility.reverse(\"matrix\");\n        assertEquals(\"\
  xirtam\", result, \"反转后的字符串应为 'xirtam'\");\n    }\n}\n```\n\n现在，对于绿色阶段，我们实现最简单的版本：\n\
  \n```java\npublic class MyStringUtility {\n    public static String reverse(String\
  \ input) {\n        StringBuilder sb = new StringBuilder(input);\n        return\
  \ sb.reverse().toString();\n    }\n}\n```\n\n现在，如果我们运行此测试，它将通过。第三阶段是重构阶段，我们根据需要改进代码。每当我们更改已通过测试的代码时，我们需要重新测试它。一个重构后的版本可能如下：\n\
  \n```java\npublic class MyStringUtility {\n    public static String reverse(String\
  \ input) {\n        if (input == null || input.isEmpty()) {\n            return\
  \ input;\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nreturn new StringBuilder(input).reverse().toString();\n\
  \n}\n\n}\n```\n\n上述重构后的代码包含了返回值不为空的边界情况。为了在测试中考虑到这一点，我们需要更新测试类：\n\n```java\n@Test\n\
  void testReverseEmptyString() {\n    assertEquals(\"\", StringUtils.reverse(\"\"\
  ), \"Empty string should remain empty\");\n}\n\n@Test\nvoid testReverseNullString()\
  \ {\n    assertNull(StringUtils.reverse(null), \"Null input should return null\"\
  );\n}\n```\n\n使用 TDD（测试驱动开发）方法论，我们的代码将是健壮且经过充分测试的。这使得在代码部署后会有更少的 Bug 和更少的调试工作。\n\
  \n# Java 应用程序的打包与部署\n\n本节重点关注在编写并彻底测试应用程序后，如何对其进行打包和部署。打包是收集必要的文件并封装成 JAR 文件。部署是将应用程序分发到所需的环境中。\n\
  \n在本章的后半部分，我们将介绍诸如 `Maven` 和 `Gradle` 等构建工具。现在，我们将探索如何使用 Java 编译器 (`javac`) 和 `JAR`\
  \ 工具手动编译 Java 应用程序。该过程在图 13.7 中所示，包含多个步骤。我们将查看每一个步骤。\n\n![一个流程图，显示步骤：编译、创建 JAR 文件、制作\
  \ JAR 可运行、包含依赖项和部署，箭头指示处理顺序。 ](img/Figure_13.7.png)\n\n图 13.7：打包与部署过程\n\n## 编译\n\
  \n第一步是编译我们的项目。让我们使用以下应用程序进行演示：\n\n```java\npublic class SampleApp {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"I am a simple\
  \ Java application!\");\n    }\n}\n```\n\n编译应用程序只需在终端窗口中运行此 `javac` 命令：\n\n```bash\n\
  javac SampleApp.java\n```\n\n虽然你不会在终端窗口中看到任何输出，但你会在项目文件夹中看到 `SampleApp.class` 文件。这是\
  \ `JVM` 可以执行的字节码文件。\n\n## 创建 JAR 文件\n\n一旦应用程序被编译成字节码，我们就可以将多个 `.class` 文件封装成单个压缩文件（JAR）以便分发。\n\
  \n我们将使用 `jar` 命令来创建 JAR 文件。具体来说，我们将使用以下语句：\n\n```bash\njar cvf SampleApp.jar SamplmeApp.class\n\
  ```\n\n这将导致 `SampleApp.jar` 文件被添加到你的项目文件夹中。该命令的输出如下：\n\n```\nadded manifest\nadding:\
  \ SampleApp.class(in = 443) (out= 306)(deflated 30%)\n```传递给 `jar` 命令的 `cvf` 参数在表\
  \ 13.1 中解释：\n\n| 参数 | 解释 |\n| :--- | :--- |\n| c | 创建新的 JAR 文件 |\n| v | 详细输出 |\n\
  | f | 指定 JAR 文件名 |\n\n表 13.1：Jar 命令参数\n\n示例中未使用的额外 `jar` 命令参数在表 13.2 中解释：\n\n| 参数\
  \ | 解释 |\n| :--- | :--- |\n| e | 指定作为入口点执行的主类 |\n| --help |为 jar 命令提供帮助 |\n| m |\
  \ 指定要包含的清单文件 |\n| t | 列出 JAR 文件的内容 |\n| u | 更新现有的 JAR 文件 |\n| x | 提取 JAR 文件内容 |\n\
  \n表 13.2：额外的 jar 命令参数\n\n## 制作可运行的 JAR\n\n我们可以让 JAR 变得可运行，这样用户就可以可以使用命令执行应用程序：\n\
  \n```bash\njava -jar SampleApp.jar\n```\n\n我们还没有准备好使用该命令。首先，我们需要创建一个名为 `MANIFEST.MF`\
  \ 的新文件。在项目文件夹中创建该文件，内容如下：\n\n```\nManifest-Version: 1.0\nMain-Class: SampleApp\n\
  ```\n\n接下来，我们可以使用以下命令带有清单打包 JAR：\n\n```bash\njar cfm SampleApp.jar MANIFEST.MF SampleApp.class\n\
  ```\n\n现在，当我们运行以下命令时，`SampleApp.java` 类中的 `main()` 方法将被执行：\n\n```bash\njava -jar\
  \ SampleApp.jar\n```\n\n程序的输出显示如下：\n\n```\nI am a simple Java application!\n```\n\
  \n## 包含外部依赖项\n\n如果我们的应用程序依赖于任何外部 `.jar` 文件，我们需要将它们包含在 `classpath` 中。让我们假设应用程序有一个外部的\
  \ `weather.jar` 依赖。第一个命令是 Windows 特有的，这是我们运行带依赖的 JAR 的方式：\n\n```bash\njava -cp \"\
  .;weather.jar\" SampleApp\n```\n\n要在 Linux 或 macOS 上运行相同的命令，我们将命令格式化如下：\n\n```bash\n\
  java -cp \".:weather.jar\" SampleApp\n```\n\n我们可以像所示将依赖项打包到 JAR 中：\n\n```bash\n\
  jar cvf SampleApp.jar SampleApp.class weather.jar\n```\n\n## 部署\n\n一旦应用程序完成打包，我们就可以准备好部署它。让我们查看本地部署和在服务器上部署我们的应用程序。\n\
  \n### 本地部署\n\n为了在开发团队之间共享我们的应用程序，我们可以简单共享 `SampleApp.jar` 文件并告诉团队成员使用以下命令：\n\n```bash\n\
  java -jar SampleApp.jar\n```\n\n重要的是告诉团队成员应该安装哪个 Java 版本。\n\n我们还可以提供可执行文件。对于 Linux\
  \ 和 macOS，我们可以创建一个脚本：\n\n```bash\n#!/bin/bash\njava -jar SampleApp.jar\n```\n\n\
  然后，通过以下命令使其可执行：\n\n```bash\nchmod +x run.sh\n./run.sh\n```\n\n要在 Windows 上制作可执行文件，我们需要使用诸如\
  \ `JSmooth` 或 `Launch4j` 的工具。\n\n### 服务器部署\n\n对于服务器应用程序，我们只需要将 JAR 文件复制到服务器，然后在后台运行应用程序。可以通过命令完成：\n\
  \n```bash\nnohup java -jar SampleApp.jar &\n```\n\n`nohup` 命令确保在退出后应用程序仍然运行，而 `&`\
  \ 参数在后台运行该进程。\n\n\n\n\n下一章将为你提供一个机会，将你在前面章节中学到的技能应用到真实的 Java 项目中。这从构建一个简单的命令行应用程序开始，然后进展到使用\
  \ `JDBC` 的数据库应用程序以及基于 `JavaFX` 的 GUI 应用程序。你将有机会处理多线程数据处理器，并使用流（streams）和 lambda\
  \ 表达式编写功能程序。这些项目旨在加强你对 Java 核心概念的理解，同时提供可以应用于真实开发场景的实践经验。\n\n## 注意事项\n\n- `breakpoint`（断点）在特定的代码行处暂停执行，以便检查变量和应用程序行为。\n\
  - `call stack`（调用栈）帮助我们追溯导致当前执行状态的方法调用序列。\n- `unit test`（单元测试）应该是独立的、可重复的，并且不依赖于外部系统。\n\
  - 自动化测试确保了一致性并减少人为错误。\n- 构建工具自动化了编译、依赖管理、打包、测试和部署。\n- `call stack` 检查允许我们分析执行流是如何通过不同的方法调用流动的。\n\
  - `Conditional breakpoints`（条件断点）仅在满足指定条件时才暂停执行。\n- `Console logging`（控制台日志）提供跟踪执行流和捕诊断消息的方法。\n\
  - `Debugging`（调试）是识别、分析和解决错误的过程。\n- `Dependency injection`（依赖注入）通过将硬编码依赖替换为灵活实现来提高测试性。\n\
  - `Global variables`（全局变量）可能会引入不可预测性并使代码更难测试。\n- `Hardcoded dependencies`（硬编码依赖）使测试变得困难，应该用\
  \ `dependency injection` 替换。\n- VS Code 中的 `IDE` 调试工具包括 `breakpoints`、``step execution`（单步执行）、`call\
  \ stack inspection` 和 `logging`。\n- `java.util.logging` 等 `Logging frameworks`（日志框架）比简单的打印语句提供了更好的日志级别控制。\n\
  - 方法应该遵循 `single responsibility principle`（单一职责原则），确保它们只执行一个任务。\n- `Packaging`（打包）涉及将编译后的\
  \ Java 文件和资源封装成可分发的 `JAR` 文件。\n- `Runnable JAR` 文件需要一个指定执行 `main class`（主类）的 `manifest\
  \ file`（清单文件）。\n- `step execution`（单步执行）允许我们逐行移动代码。\n- `Static methods`（静态方法）降低了可测试性，因为它们无法被模拟或重写。\n\
  - `Syntax errors`（语法错误）由于错误的 Java 语法。\n- `TDD`（测试驱动开发）遵循 `red-green-refactor`（红-绿-重构）循环。\n\
  - `Test assertions`（测试断言）验证实际输出是否与预期结果。\n- `Testable code`（可测试代码）是模块化的、松耦合且可预测的。\n\
  - Java 中的三种错误是 `syntax errors`（语法错误）、`runtime errors`（运行时错误）和 `logic errors`（逻辑错误）。\n\
  - `Unit testing`（单元测试）隔离验证单个组件。\n\n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对章节内容进行批判性思考：\n\n\
  - **调试性能问题**：Andromeda Systems 是一家云分析公司，最近部署了 `Nebula AI engine` 新版本，这是一个为企业客户处理大型数据集的\
  \ Java 应用程序。部署后，用户报告响应速度缓慢且系统间歇性崩溃。开发团队运行了基本的 `print debugging`（打印调试），但未能确定根源。某些日志显示内存占用高，但问题在不同环境之间并不一致。\n\
  \    - 供你考虑：VS Code 中的哪些调试工具对诊断此问题有用？`profiling`（性能分析）和 `logging frameworks` 如何帮助确定性能瓶颈？哪些常见的\
  \ `runtime errors`（例如内存泄漏、低效循环）可能导致性能缓慢？如何使用 `call stack` 和 `breakpoints` 来跟踪执行流并定位瓶颈？\n\
  \n- **防止部署失败**：Orion Banking Solutions 准备部署其 `Celestial Pay`，这是其新的 Java 支付处理系统。开发团队手动将应用程序打包成\
  \ `JAR` 文件并部署在 Linux 服务器上。然而，用户报告交易随机失败，日志显示 `missing dependency error`（缺少依赖错误）。经过调查，开发人员发现安全交易所需的外部加密库在生产服务器上不可用。该问题在开发期间并未出现，因为该库安装在开发者的本地机器上。\n\
  \    - 供你考虑：`dependency management`（使用如 `Maven` 或 `Gradle` 等构建工具）如何能防止这个问题？应该采取哪些手动打包步骤以确保包含所有所需的\
  \ `JAR` 文件？在发布软件之前可以使用哪些策略来测试部署环境？`logging` 和 `exception handling` 如何帮助更有效地诊断部署失败？\n\
  \n- **单元测试危机**：Xenon Robotics 开发用于工业检查的自主无人机软件。公司遵循 `TDD` 以确保代码的可靠性。然而，最近一次软件更新导致了严重故障——某些无人机误读了高度读数，导致飞行不稳定。在审查测试套件时，开发人员发现某些\
  \ `unit tests` 的结构不正确。某些测试没有测试单个函数，而是依赖于多个方法，导致不清楚代码的哪个部分出了问题。此外，测试没有考虑到边界情况，例如负数高度值。\n\
  \    - 供你考虑：编写有效的 `unit tests` 的关键原则是什么？它们如何能帮助防止这个问题？为什么一次测试一个函数比在单个 `unit test`\
  \ 中测试多个功能更好？开发人员如何确保在测试情景中包含边界情况？应该使用哪些 `assertions`（断言）和验证技术来保证高度计算的正确性？\n\n- **调试多线程问题**：Vega\
  \ AI 正在开发 `HyperVision`，这是一种基于 Java 的用于自动驾驶的实时图像识别系统。该系统使用 `multithreading`（多线程）同时处理多个摄像头流。但在测试期间，系统偶尔冻结或崩溃，特别是在高负载下。开发人员怀疑\
  \ `race conditions`（竞态条件）或 `synchronization issues`（同步问题）导致了不稳定，但错误随机发生，难以复现。某些错误日志指向共享数据被多个线程同时修改。\n\
  \    - 供你考虑：什么调试策略可以帮助多线程 Java 应用程序中的并发问题？`breakpoints` 和 `step execution` 如何分析线程行为？哪些\
  \ `synchronization` 技术（例如 `locks`、`synchronized methods`）可以防止共享数据冲突？测试多线程应用时为什么要模拟高负载场景？\n\
  \n- **提高软件维护性**：Solaris HealthTech 开发 MedConnect，这是一个基于 Java 的远程医疗平台。随着时间的推移，代码库变得巨大且难以维护。系统紧耦合，难以编写\
  \ `unit tests`，由于依赖关系复杂，调试时间变长。工程团队难以在不引入 Bug 的情况下实现新功能。许多测试由于硬编码依赖而失败，某些关键组件依赖\
  \ `static methods`，而这些在测试期间无法被模拟。\n    - 供你考虑：重构代码如何提高可测试性和维护性？为什么在编写可测试代码时应避免 `static\
  \ methods`？哪些设计原则（例如 `dependency injection`、基于接口的编程）可以提高灵活性？自动化测试工具和如 `Maven` 或\
  \ `Gradle` 等构建工具如何简化测试和部署流程？\n\n## 单选题\n\n1. 调试中 `breakpoint` 的主要目的是什么？\n    1.\
