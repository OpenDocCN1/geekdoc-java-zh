  \n![QR-Logo](img/fm1.png)\n\n# 第 7 章：并发与多线程\n\n## 引言\n\n并发允许程序同时处理多个任务，是现代软件应用的核心。这是一个提高性能的编程结构，也是本章的重点。本章从介绍\
  \ Java 多线程的基础概念开始，目标是为你提供构建高效、线程安全应用所需的工具和技术。在基础知识之后，本章涵盖了使用 `Thread` 类和 `Runnable`\
  \ 接口创建线程的基础知识。它还涵盖了同步和锁，这些机制可以帮助我们在并发环境中实现数据一致性。\n\n本章还介绍了 `Executor` 框架，它简化了线程管理。此外，还涵盖了\
  \ Java 的并发工具类，如 `CountDownLatch` 和 `CyclicBarrier`，用于协调复杂的线程交互。最后，本章探索了编写线程安全代码的最佳实践，帮助你避免死锁和竞态条件等常见陷阱。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* Java 多线程简介论\n* `Thread` 类和 `Runnable` 接口\n* 同步与锁\n* `Executor`\
  \ 框架\n* 并发工具类\n* 编写并发代码的最佳实践\n\n## 目标\n\n在本章结束时，你应该理解多线程的基础知识及其在现代软件开发中的重要性。通过学习本章提供的示例，你将能够使用\
  \ `Thread` 类和 `Runnable` 接口创建并管理线程。你还应该能够应用同步和锁来维护并发应用中的数据一致性，使用 `Executor` 框架有效管理线程，并使用\
  \ Java 的并发工具（包括 `CountDownLatch` 和 `CyclicBarrier`）实现高级线程协调。最后，在本章结束时，你应该能够有效地实现编写线程安全\
  \ Java 代码的最佳实践。\n\n## Java 多线程简介\n\n在 Java 中，我们的应用程序可以在独立的线程中执行任务。现代计算机的中央处理器（CPU）具有多个核心，允许它们同时处理多个线程。这种能力被称为多线程。它对现代多核处理器利用了高效利用。\n\
  \n正如你将在本章稍后看到的，我们通过使用 `java.lang.Thread` 类和 `java.lang.Runnable` 接口在 Java 中实现多线程，这使得我们创建创建和管理线程。多线程的一个巨大优势是它允许我们并发执行应用程序的不同部分。这可以显著提高各种类型应用的性能和响应速度，包括实时系统、现代游戏、数据处理流水线等。\n\
  \n随着对本章及其 Java 代码示例的不断学习，你应该对多线程形成基础性的理解。建议关注它在 Java 中的重要性和实际实现。要理解的早期概念之一是进程和线程的区别。例如，线程在单个进程内共享内存空间。图\
  \ 7.1 阐述了线程和多线程的概念：![一张对比图，一列显示带有任务 1–4 的单线程示例，另一列并行显示带有线程 1–4 的多线程示例，每个线程处理一个任务。](img/Figure_7.1.png)\n\
  \n图 7.1：线程与多线程\n\n正如图 7.1 所示，单线程方法涉及每个任务的按顺序执行；第第二个任务在第一个任务结束时开始，依此类推。在多线程示例中，每个任务由一个单独的线程处理，允许它们同时运行（并发）。\n\
  \n让我们来看多线程在现代视频游戏中的一个常见用例。视频游戏中使用多线程是为了提高游戏的性能和响应能力。图 7.2 显示了一个具有五个不同线程的基础型游戏架构，每个线程都在并发运行：\n\
  \n![一张图表，分为五列，概述了游戏引擎线程：主线程、渲染线程、物理线程、AI 线程和网络线程，每个列都用项目符号列出了它们的主要职责。](img/Figure_7.2.png)\n\
  \n图 7.2：视频游戏多线程示例\n\n正如你在图 7.2 中看到的，现代视频游戏可以充分利用多线程。在这个示例中，有五个主线程。通过将“渲染线程”与“主线程”分离，游戏可以继续处理玩家输入和游戏逻辑，而不会在执行渲染任务时被减慢或引入延迟。专用的“物理线程”可以允许游戏在进行复杂计算的同时不影响性能。“AI\
  \ 线程”处理非玩家角色（NPC）及其动作。将 AI 放在它自己的线程中是有意义的。“网络线程”可能处理游戏服务器，这在大型多人游戏中尤为重要。\n\n一个企业级应用可能会有以下主线程：\n\
  \n* 主线程\n* 数据库线程\n* 网络线程\n* 用户界面线程\n* 日志线程\n* 缓存管理线程\n* 安全线程\n* 任务调度线程\n* 程序或基础设施健康线程\n\
  * 后台线程\n\n在下一节中，你将学习如何使用 `Thread` 类和 `Runnable` 接口创建并启动线程。\n\n## Thread 类和 Runnable\
  \ 接口\n\n`Thread` 类和 `Runnable` 接口是 Java 多线程的构建模块。它们提供了创建和管理线程的两种不同方式，使我们能够并发执行任务。`Thread`\
  \ 类代表单个执行线程。要使用它，我们只需创建 `Thread` 的子类并重写 `run` 方法以定义线程将执行的任务。\n\n接下来的章节通过视频游戏和企业银行应用的用例，演示如何使用\
  \ `Thread` 类和实现 `Runnable` 接口。\n\n### 视频游戏用例\n\n使用视频游戏用例，考虑这种情况：游戏的多个组件（即渲染图形、处理玩家输入和播放背景音乐）需要同时操作。这些任务中的每一个都可以在单独的线程运行运行以确保流畅的游戏体验。让我们来看两种方法：一种使用\
  \ `Thread` 类，另一种使用 `Runnable` 接口。\n\n#### 视频游戏中的 Thread 类\n\n下面的 `BackgroundRenderer`\
  \ 类继承了 Java 的 `Thread` 类。它模拟渲染 24 帧背景图形：\n\n```java\nclass BackgroundRenderer extends\
  \ Thread {\n  @Override\n  public void run() {\n    for (int i = 0; i < 24; i++)\
  \ {\n      System.out.println(\"Rendering background frame \" + i);\n      try {\n\
  \        Thread.sleep(300); // 模拟渲染时间\n      } catch (InterruptedException e) {\n\
  ```\n\n\n\n\n\n```java\nSystem.out.println(\"Rendering interrupted\");\n}\n}\n\n\
  \n```\n\n`GameThreadsDemo1` 类包含一个 `start()` 方法，该方法通过在单独执行线程中调用其 `run()` 方法来启动线程：\n\
  \n```java\npublic class GameThreadsDemo1 {\n    public static void main(String[]\
  \ args) {\n        BackgroundRenderer renderer = new BackgroundRenderer();\n   \
  \     renderer.start(); // 背景渲染线程\n    }\n}\n```\n\n接下来，让我们来看使用 `Runnable` 接口的视频游戏示例。\n\
  \n### 视频游戏中的 Runnable 接口\n\n在节一节中，我们演示了子化 `Thread` 类是多么简单。通常情况下，实现 `Runnable` 接口会更好，特别是当我们我们需要将任务逻辑与线程管理分离时。这是一种更灵活的方法，因为它允许我们的类在作为线程运行的同时，继承自另一个类。\n\
  \n以下是一个使用 `Runnable` 接口处理玩家输入的示例：\n\n```java\nclass PlayerInputHandler implements\
  \ Runnable {\n    @Override\n    public void run() {\n        for (int i = 0; i\
  \ < 24; i++) {\n            System.out.println(\"Processing player input \" + i);\n\
  \            try {\n                Thread.sleep(300); // 模拟输入处理延迟\n           \
  \ } catch (InterruptedException e) {\n                System.out.println(\"Input\
  \ processing interrupted\");\n            }\n        }\n    }\n}\n```\n\n上面的 `PlayerInputHandler`\
  \ 类实现了 `Runnable` 接口。如下所示的 `GameThreadsDemo2` 类定义了任务逻辑并允许 `Thread` 类管理执行：\n\n```java\n\
  public class GameThreadsDemo2 {\n    public static void main(String[] args) {\n\
  \        Thread inputThread = new Thread(new PlayerInputHandler());\n        inputThread.start();\
  \ // 启动输入处理线程\n    }\n}\n```\n\n在我们的视频游戏示例中，我们可能需要同时运行背景渲染和输入处理。以下示例演示了如何结合多个线程：\n\
  \n```java\npublic class GameThreadsDemo3 {\n    public static void main(String[]\
  \ args) {\n        Thread renderer = new BackgroundRenderer();\n        Thread inputThread\
  \ = new Thread(new PlayerInputHandler());\n        renderer.start();\n        inputThread.start();\n\
  \    }\n}\n```\n\n通过两个线程并发运行，我们的游戏可以在持续渲染图形的同时处理玩家输入。这确保了平畅、响应及时的游戏体验。\n\n### 企业级银行用例\n\
  \n本节演示了如何在企业级银行应用程序中使用 `Thread` 类和 `Runnable` 接口。在类类应用程序中，多线程对于处理复杂操作（即处理多个客户交易、生成报告、管理通知等）是至关重要的。使用\
  \ `Thread` 类和 `Runnable` 接口将允许我们并发执行这些任务，确保在高需求环境下的响应能力和效率。\n\n让我们来看两种方法：一种使用 `Thread`\
  \ 类，另一种使用 `Runnable` 接口。\n\n#### 企业级银行中的 Thread 类\n\n假设我们正在开发一个企业级银行应用程序，并需要它生成交易报告。每份报告都涉及大量的计算，因此可以使用\
  \ `Thread` 类将其分配到单独的线程中。以下是一个示例：\n\n```java\nclass TransactionReportGenerator extends\
  \ Thread {\n    private String accountNumber;\n    public TransactionReportGenerator(String\
  \ accountNumber) {\n        this.accountNumber = accountNumber;\n    }\n    @Override\n\
  \    public void run() {\n        System.out.println(\"Generating transaction report\
  \ for account: \" + accountNumber);\n        try {\n            Thread.sleep(2400);\
  \ // 模拟耗时的报告生成\n        } catch (InterruptedException e) {\n            System.out.println(\"\
  Report generation interrupted for account: \" + accountNumber);\n        }\n   \
  \     System.out.println(\"Report generated for account: \" + accountNumber);\n\
  \    }\n}\n\npublic class BankingThreadsDemo1 {\n    public static void main(String[]\
  \ args) {\n        TransactionReportGenerator report1 = new TransactionReportGenerator(\"\
  12345\");\n        TransactionReportGenerator report2 = new TransactionReportGenerator(\"\
  67890\");\n        report1.start(); // 启动第一个报告线程\n        report2.start(); // 启动第二个报告线程\n\
  \    }\n}\n```\n\n前面的示例演示了如何使用多个线程同时为不同的账户生成交易报告。这无疑将提高我们多用户银行系统的效率。\n\n接下来，让我们来看使用\
  \ `Runnable` 接口的企业级银行示例。\n\n#### 企业级银行中的 Runnable 接口\n\n在处理客户交易时，使用 `Runnable` 接口允许我们将业务逻辑与线程管理解耦。以下是我们的实现方式：\n\
  \n```java\nclass TransactionProcessor implements Runnable {\n    private String\
  \ transactionId;\n    public TransactionProcessor(String transactionId) {\n    \
  \    this.transactionId = transactionId;\n    }\n    @Override\n    public void\
  \ run() {\n        System.out.println(\"Processing transaction: \" + transactionId);\n\
  \        try {\n            Thread.sleep(2400); // 模拟交易处理延迟\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(\"Transaction interrupted: \" + transactionId);\n\
  \        }\n        System.out.println(\"Transaction completed: \" + transactionId);\n\
  \    }\n}\n\npublic class BankingThreadsDemo2 {\n    public static void main(String[]\
  \ args) {\n        Thread transaction1 = new Thread(new TransactionProcessor(\"\
  TXN001\"));\n        Thread transaction2 = new Thread(new TransactionProcessor(\"\
  TXN002\"));\n        transaction1.start(); // 启动第一个交易线程\n        transaction2.start();\
  \ // 启动第二个交易线程\n    }\n}\n```\n\n```这种方法允许我们的应用程序并发处理多个交易，确保系统具有响应性。\n\n在真实的银行系统中，可能需要多个线程来同时管理生成交易报告、处理支付和发送通知等任务。以下是实现方法：\n\
  \n```java\npublic class BankingThreadsDemo3 {\n    public static void main(String[]\
  \ args) {\n        Thread reportThread = new TransactionReportGenerator(\"12345\"\
  );\n        Thread transactionThread = new Thread(new TransactionProcessor(\"TXN001\"\
  ));\n        reportThread.start();\n        transactionThread.start();\n       \
  \ System.out.println(\"Banking system is handling tasks concurrently.\");\n    }\n\
  }\n```\n\n通过结合线程，我们的银行系统可以高效地处理各种任务。这即使在高峰负载期间也能提升用户体验。\n\n\n\n\n现在，考虑我们的银行应用程序，其中多个线程正尝试从同一个账户提取款。这可能发生在账户所有者处理一笔交易，而同时计划的电子账单支付也在进行处理时。如果没有适当的同步，账户余额可能会被计算错误，导致透支或其他不一致的情况。\n\
  \n## 同步示例\n\n为了演示如何实现同步，我们将创建一个 `GameHealthBar` 类来管理玩家的健康值。确保线程安全最简单的方法是使用 `synchronized`\
  \ 关键字。在下面的示例中，我们对 `takeDamage()` 和 `heal()` 方法使用了 `synchronized` 关键字。这确保了一次只有一个线程可以执行该方法。\n\
  \n以下是 `GameHealthBar` 类：\n\n```java\nclass GameHealthBar {\n    private int health\
  \ = 100;\n\n    public synchronized void takeDamage(int damage) {\n        if (health\
  \ > 0) {\n            health -= damage;\n            System.out.println(\"You took\
  \ damage. Health: \" + health);\n        }\n    }\n\n    public synchronized void\
  \ heal(int amount) {\n        if (health < 100) {\n            health += amount;\n\
  \            System.out.println(\"You healed. Health: \" + health);\n        }\n\
  \    }\n}\n```\n\n接下来，我们创建一个带有游戏 `main()` 方法的类。如后面所示，我们为伤害和回血函数创建了独立的线程：\n\n```java\n\
  public class GameSynchronizationDemo1 {\n    public static void main(String[] args)\
  \ {\n        GameHealthBar healthBar = new GameHealthBar();\n        Thread damageThread\
  \ = new Thread(() -> {\n            for (int i = 0; i < 5; i++) {\n            \
  \    healthBar.takeDamage(10);\n                try {\n                    Thread.sleep(50);\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
  \                }\n            }\n        });\n        Thread healThread = new\
  \ Thread(() -> {\n            for (int i = 0; i < 5; i++) {\n                healthBar.heal(5);\n\
  \                try {\n                    Thread.sleep(70);\n                }\
  \ catch (InterruptedException e) {\n                    e.printStackTrace();\n \
  \               }\n            }\n        });\n        damageThread.start();\n \
  \       healThread.start();\n    }\n}\n```\n\n程序的输出如下。这是因为我们使用了 `synchronized` 关键字；即使多个线程同时访问\
  \ `health` 变量，我们对该变量的更新也是保持一致的：\n\n```\nYou took damage. Health: 90\nYou healed.\
  \ Health: 95\nYou took damage. Health: 85\nYou healed. Health: 90\nYou took damage.\
  \ Health: 80\nYou healed. Health: 85\nYou took damage. Health: 75\nYou took damage.\
  \ Health: 65\nYou healed. Health: 70\nYou healed. Health: 75\n```\n\n接下来，我们将查看锁（locks），这是在多线程环境中避免竞态条件的第二种方法。\n\
  \n## 使用锁\n\n在需要时，我们可以实现更高级的同步方法。具体来说，我们可以实现 Java 的 `java.util.concurrent.locks.Lock`\
  \ 接口，它让我们对线程访问有更好的控制力。例如，`ReentrantLock` 可以显式地锁定和解锁代码的关键区域。这允许进行更复杂的线程管理，例如带有超时尝试获取锁，或检查锁是否被任何线程持有。此外，与\
  \ `synchronized` 块相比，`ReentrantLock` 在高竞争下提供了更好的性能，使其成为复杂多线程应用程序的首选。\n\n### 锁的示例\n\
  \n为了演示锁，我们将编写一个 `BankAccount1` 类，该类包含一个 `balance` 变量和一个使用 `java.util.concurrent.locks`\
  \ 中的 `ReentrantLock` 类实现的锁。`BankAccount1` 类有一个构造函数来设置初始余额，以及一个 `withdraw` 方法从账户中提取金额。当调用\
  \ `withdraw` 方法时，它会获取锁以确保一次只有一个线程可以修改 `balance`。在 `try` 块内部，它检查是否有足够的资金。如果有，则从 `balance`\
  \ 中减去提取金额并打印剩余余额。如果没有，则打印一条资金不足的消息。最后，在 `final` 块中释放锁，以确保即使发生异常锁也能被释放。这段代码通过使用锁控制对共享资源\
  \ `balance` 的访问，确保了线程安全。\n\n以下是 `BankAccount1` 类：\n\n```java\nimport java.util.concurrent.locks.Lock;\n\
  import java.util.concurrent.locks.ReentrantLock;\n\nclass BankAccount1 {\n    private\
  \ double balance;\n    private final Lock lock = new ReentrantLock();\n\n    public\
  \ BankAccount1(double initialBalance) {\n        this.balance = initialBalance;\n\
  \    }\n\n    public void withdraw(double amount) {\n        lock.lock(); // 获取锁\n\
  \        try {\n            if (balance >= amount) {\n                System.out.println(\"\
  Withdrawing: \" + amount);\n                balance -= amount;\n               \
  \ System.out.println(\"Remaining Balance: \" + balance);\n            } else {\n\
  \                System.out.println(\"Low funds; cannot withdraw: \" + amount);\n\
  \            }\n        } finally {\n            lock.unlock(); // 释放锁\n       \
  \ }\n    }\n}\n```\n\n我们对 `ReentrantLock` 的使用确保了一次只有一个线程可以访问代码的关键区域。以下是 `BankAccount1`\
  \ 的驱动程序：\n\n```java\nimport java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReentrantLock;\n\
  \nclass BankAccount1 {\n    private double balance;\n    private final Lock lock\
  \ = new ReentrantLock();\n\n    public BankAccount1(double initialBalance) {\n \
  \       this.balance = initialBalance;\n    }\n\n    public void withdraw(double\
  \ amount) {\n        lock.lock();\n        try {\n            if (balance >= amount)\
  \ {\n                System.out.println(\"Withdrawing: \" + amount);\n         \
  \       balance -= amount;\n                System.out.println(\"Remaining Balance:\
  \ \" + balance);\n            } else {\n                System.out.println(\"Low\
  \ funds; cannot withdraw: \" + amount);\n            }\n        } finally {\n  \
  \          lock.unlock();\n        }\n    }\n}\n\npublic class BankingLocksDemo1\
  \ {\n    public static void main(String[] args) {\n        BankAccount1 account\
  \ = new BankAccount1(1500);\n        Thread user1 = new Thread(() -> account.withdraw(900));\n\
  \        Thread user2 = new Thread(() -> account.withdraw(700));\n        user1.start();\n\
  \        user2.start();\n    }\n}\n```\n\n程序的输出如下：\n```\nWithdrawing: 900.0\nRemaining\
  \ Balance: 600.0\nLow funds; cannot withdraw: 700.0\n```\n\n## 使用 tryLock 避免死锁\n\
  \n虽然同步和锁可以解决很多问题，但也可能引入新问题。其中一个问题是死锁，当两个或多个线程相互等待对方的锁时就会发生。为了避免死锁，应在所有线程中保持获取锁的顺序一致。建议缩小\
  \ `synchronized` 代码范围以减少竞争。我们还可以使用 `tryLock()` 方法，它是 `java.util.concurrent.locks.Lock`\
  \ 接口的一部分。这在我们想要在不阻塞的情况下获取锁时非常有用。以下是 `tryLock()` 的基本语法：\n\n```java\nboolean tryLock();\n\
  ```\n\n我们还可以使用带超时的 `tryLock()`。以下是该版本的语法：\n\n```java\nboolean tryLock(long timeout,\
  \ TimeUnit unit) throws InterruptedException;\n```\n\n`timeout` 参数是等待的最大时间。如果在规定时间内获取锁，方法返回\
  \ true；如果在获取锁之前超时，则返回 false。下面的章节提供了 `tryLock()` 版本的示例，一种是不阻塞的，另一种是超时的。\n\n### 不阻塞示例\n\
  \n在我们的银行应用程序示例中，假设有两个线程尝试访问同一个账户进行不同的交易。我们可以实现 `tryLock()` 防止一个线程无限期等待锁。以下是一个示例：\n\
  \n```java\nimport java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReentrantLock;\n\
  \nclass BankAccount2 {\n    private double balance;\n    private final Lock lock\
  \ = new ReentrantLock();\n\n    public BankAccount2(double initialBalance) {\n \
  \       this.balance = initialBalance;\n    }\n\n    public void withdraw(double\
  \ amount) {\n        if (lock.tryLock()) {\n            try {\n                if\
  \ (balance >= amount) {\n                    System.out.println(\"Withdrawing: \"\
  \ + amount);\n                    balance -= amount;\n                    System.out.println(\"\
  Remaining Balance: \" + balance);\n                } else {\n                  \
  \  System.out.println(\"Low funds; cannot withdraw: \" + amount);\n            \
  \    }\n            } finally {\n                lock.unlock();\n            }\n\
  \        } else {\n            System.out.println(\"无法获取锁。跳过交易。\");\n        }\n\
  \    }\n}\n```\n\n以下是示例的驱动代码：\n\n```java\npublic class BankingLocksDemo2 {\n   \
  \ public static void main(String[] args) {\n        BankAccount2 account = new BankAccount2(1500);\n\
  \        Thread user1 = new Thread(() -> account.withdraw(900));\n        Thread\
  \ user2 = new Thread(() -> account.withdraw(700));\n        user1.start();\n   \
  \     user2.start();\n    }\n}\n```\n\n可能的输出：\n```\nWithdrawing: 900.0\nRemaining\
  \ Balance: 600.0\n无法获取锁。跳过交易。\n```\n\n\n\n\n当我们希望线程在放弃获取锁之前等待特定时间段时，也可以实现 `tryLock()`。为了实现这一点，我们使用\
  \ `tryLock()` 的超时版本。以下是使用我们的银行应用程序实现的示例代码：\n\n```java\nimport java.util.concurrent.TimeUnit;\n\
  import java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReentrantLock;\n\
  \nclass BankAccount3 {\n    private double balance;\n    private final Lock lock\
  \ = new ReentrantLock();\n\n    public BankAccount3(double initialBalance) {\n \
  \       this.balance = initialBalance;\n    }\n\n    public void withdraw(double\
  \ amount) {\n        try {\n            if (lock.tryLock(3, TimeUnit.SECONDS)) {\n\
  \                try {\n                    if (balance >= amount) {\n         \
  \               System.out.println(\"Withdrawing: \" + amount);\n              \
  \          balance -= amount;\n                        System.out.println(\"Remaining\
  \ Balance: \" + balance);\n                    } else {\n                      \
  \  System.out.println(\"Low funds; cannot withdraw: \" + amount);\n            \
  \        }\n                } finally {\n                    lock.unlock();\n  \
  \              }\n            } else {\n                System.out.println(\"Unable\
  \ to acquire lock within the timeout. Transaction skipped.\");\n            }\n\
  \        } catch (InterruptedException e) {\n            System.out.println(\"Thread\
  \ interrupted while waiting for lock.\");\n        }\n    }\n}\n```\n\n以下是我们示例的驱动代码：\n\
  \n```java\npublic class BankingLocksDemo3 {\n    public static void main(String[]\
  \ args) {\n        BankAccount3 account = new BankAccount3(1500);\n        Thread\
  \ user1 = new Thread(() -> account.withdraw(900));\n        Thread user2 = new Thread(()\
  \ -> account.withdraw(700));\n        user1.start();\n        user2.start();\n \
  \   }\n}\n```\n\n## Executor 框架\n\n到目前为止，我们的线程管理都是手动的，这很快就会变得具有挑战性。当处理许多任务以及我们想要优化线程使用时，情况尤其如此。`Executor`\
  \ 框架通过将任务提交与线程管理机制解耦，简化了 Java 中的线程管理。我们不再需要像之前做的那样手动创建和管理线程，而是可以使用 `Executor` 框架高效地处理应用程序中的并发任务。\n\
  \n`Executor` 框架是 `java.util.concurrent` 包的一部分。它提供了一系列灵活的工具，用于管理线程池、调度任务和优化资源使用。为了明确该框架的用处，让我们考虑在本章节中使用的两个应用程序示例（视频游戏和银行应用）。\n\
  \n在我们的视频游戏中，我们需要处理多个任务，包括渲染图形、处理玩家输入、管理 NPC 行为等。为这些任务中的每一个手动创建并管理线程将是低效的，并且可能会引入错误。\n\
  \n我们的银行应用程序需要处理多个并发请求，例如余额查询、取款和交易历史生成。如果每个请求都由一个新线程处理，很容易导致系统过载。由 `Executor` 框架提供的线程池允许系统高效地管理请求，而不会耗尽资源。\n\
  \n`Executor` 框架由几个关键组件组成，如 表 7.1 所示：\n\n| 组件 | 解释 |\n| :--- | :--- |\n| `Executor`\
  \ 接口 | 这是基础接口。 |\n| `ExecutorService` 接口 | 这是一个更高级的接口，包含了生命周期管理以及任务提交的方法。 |\n| `ScheduledExecutorService`\
  \ 接口 | 可用于定期或在延迟后调度任务。 |\n| `ThreadPoolExecutor` 类 | 用于管理线程池。 |\n\n表 7.1：Executor\
  \ 框架组件\n\n让我们看看如何使用我们的视频游戏和银行应用程序示例来实现 `Executor` 框架。\n\n### 视频游戏的 Executor 示例\n\
  \n为了演示执行器框架的用处，我们将从视频游戏示例开始。为了演示执行器框架的用处，我们将从我们的视频游戏示例开始。游戏有多个任务，例如渲染图形、处理玩家输入和生成\
  \ NPC。以下是三个不同的类：\n\n```java\npublic class GameRenderTask implements Runnable {\n\
  \    @Override\n    public void run() {\n        System.out.println(\"Rendering\
  \ graphics...\");\n    }\n}\n\npublic class GameInputTask implements Runnable {\n\
  \    @Override\n    public void run() {\n        System.out.println(\"Processing\
  \ player input...\");\n    }\n}\n\npublic class GameNPCTask implements Runnable\
  \ {\n    @Override\n    public void run() {\n        System.out.println(\"Spawning\
  \ NPC...\");\n    }\n}\n```\n\n以下是使用 `Executors.newFixedThreadPool(3)` 创建具有三个线程的池的驱动程序：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic class GameExecutor {\n    public static void main(String[] args) {\n  \
  \      ExecutorService executor = Executors.newFixedThreadPool(3);\n        executor.execute(new\
  \ GameRenderTask());\n        executor.execute(new GameInputTask());\n        executor.execute(new\
  \ GameNPCTask());\n        executor.shutdown();\n    }\n}\n```\n\n所示，`execute()`\
  \ 方法用于将任务提交到线程池，`shutdown()` 方法在所有任务完成后停止线程池。\n\n### 银行应用的 Executor 示例\n\n现在，让我们考虑如何在银行应用程序中使用\
  \ `Executor` 类。我们的应用程序可能需要并发处理多个客户交易。以下是一个示例：\n\n```java\npublic class BankTransactionTask\
  \ implements Runnable {\n    private String transactionId;\n    public BankTransactionTask(String\
  \ transactionId) {\n        this.transactionId = transactionId;\n    }\n\n    @Override\n\
  \    public void run() {\n        System.out.println(\"Processing transaction: \"\
  \ + transactionId);\n    }\n}\n```\n\n以下是使用 `Executors.newCachedThreadPool()` 创建根据需求调整线程数量的池的驱动程序：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic class BankingExecutor {\n    public static void main(String[] args) {\n\
  \        ExecutorService executor = Executors.newCachedThreadPool();\n        executor.execute(new\
  \ BankTransactionTask(\"BTXN00001\"));\n        executor.execute(new BankTransactionTask(\"\
  BTXN00002\"));\n        executor.execute(new BankTransactionTask(\"BTXN00003\"));\n\
  \        executor.execute(new BankTransactionTask(\"BTXN00004\"));\n        executor.execute(new\
  \ BankTransactionTask(\"BTXN00005\"));\n        executor.shutdown();\n    }\n}\n\
  ```\n\n### ScheduledExecutorService 示例\n\nJava 的 Executor 框架还包含了 `ScheduledExecutorService`，它是允许任务定期或在指定延迟后运行的特殊\
  \ `Executor`。让我们在银行应用程序实现它。我们将实现定期的余额通知。以下是代码：\n\n```java\npublic class BankBalanceNotifications\
  \ implements Runnable {\n    @Override\n    public void run() {\n        System.out.println(\"\
  Sending balance notification to customers...\");\n    }\n}\n```\n\n以下是驱动类：\n\n```java\n\
  import java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;\n\
  import java.util.concurrent.TimeUnit;\n\npublic class BankScheduledExecutorDemo\
  \ {\n    public static void main(String[] args) {\n        ScheduledExecutorService\
  \ scheduler = Executors.newScheduledThreadPool(1);\n        // 每 10 秒运行一次任务\n  \
  \      scheduler.scheduleAtFixedRate(new BankBalanceNotifications(), 0, 10, TimeUnit.SECONDS);\n\
  \    }\n}\n```\n\n\n\n\n\n`java.util.concurrent` 包包含了许多并发实用工具，旨在帮助我们开发多线程应用程序。我们已经涵盖了其中几个，包括\
  \ `ExecutorService`、`ScheduledExecutorService` 和 `ReentrantLock`。本节将探索另外三个工具：`CountDownLatch`、`CyclicBarrier`\
  \ 和 `Semaphore`。这些工具为我们提供了线程协调和线程同步的高级控制。这使我们能够处理线程之间复杂的交互。理解这些工具可以写出更易读、更高效的代码。\n\
  \n### CountDownLatch\n\n`CountDownLatch` 是一种同步工具，我们可以允许一个或多个线程等待其他线程中的一组操作完成。当计数器达到零时，所有等待的线程都将释放。这是一个简单而强大的构造结构。\n\
  \n以下实现使用了我们的视频游戏示例。在这里，我们编写了一个 `GameResourceLoader` 类，它使用 `CountDownLatch` 来确保在所有资源加载之前游戏不会启动：\n\
  \n```java\nimport java.util.concurrent.CountDownLatch;\n\nclass GameResourceLoader\
  \ implements Runnable {\n\n    private final CountDownLatch latch;\n    private\
  \ final String resource;\n\n    public GameResourceLoader(CountDownLatch latch,\
  \ String resource) {\n        this.latch = latch;\n        this.resource = resource;\n\
  \    }\n\n    @Override\n    public void run() {\n        System.out.println(\"\
  Loading \" + resource);\n        try {\n            Thread.sleep(1000); // Simulate\
  \ 加载时间\n        } catch (InterruptedException e) {\n            e.printStackTrace();\n\
  \        }\n        System.out.println(resource + \" loaded.\");\n        latch.countDown();\n\
  \    }\n}\n```\n\n以下是驱动类：\n\n```java\nimport java.util.concurrent.CountDownLatch;\n\
  \npublic class GameCountDownLatchDemo {\n\n    public static void main(String[]\
  \ args) throws InterruptedException {\n        CountDownLatch latch = new CountDownLatch(3);\n\
  \        new Thread(new GameResourceLoader(latch, \"Textures\")).start();\n    \
  \    new Thread(new GameResourceLoader(latch, \"Sounds\")).start();\n        new\
  \ Thread(new GameResourceLoader(latch, \"Models\")).start();\n        new Thread(new\
  \ GameResourceLoader(latch, \"Levels\")).start();\n        latch.await(); // Wait\
  \ for all resources to load\n        System.out.println(\"All resources loaded.\
  \ Game starting...\");\n    }\n}\n```\n\n注意：如果你曾经玩过带有加载界面的视频游戏，开发者使用了这种方法来确保在游戏开始之前，所有的\
  \ `Textures`、`Sounds`、`Models`、`Levels` 等都已加载。\n\n正如我们的示例实现所示，游戏会在等待所有资源加载后才启动。\n\
  \n接下来，让我们看看另一个实现，这次使用我们的烘焙应用程序示例。考虑一下超过特定阈值的交易可能需要多个银行官员或部门的批准。我们可以使用 `CountDownLatch`\
  \ 来确保交易处理线程等待直到收到所有必要的批准。以下是该功能的实现方式：\n\n```java\nimport java.util.concurrent.CountDownLatch;\n\
  \nclass BankApprovalTask implements Runnable {\n\n    private final CountDownLatch\
  \ latch;\n    private final String department;\n\n    public BankApprovalTask(CountDownLatch\
  \ latch, String department) {\n        this.latch = latch;\n        this.department\
  \ = department;\n    }\n\n    @Override\n    public void run() {\n        System.out.println(\"\
  Approval from \" + department + \" in progress...\");\n        try {\n         \
  \   Thread.sleep(1500); // Simulate 批准时间\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n        System.out.println(department\
  \ + \" approved.\");\n        latch.countDown();\n    }\n}\n```\n\n以下是驱动类：\n\n```java\n\
  import java.util.concurrent.CountDownLatch;\n\npublic class BankCountDownLatchDemo\
  \ {\n\n    public static void main(String[] args) throws InterruptedException {\n\
  \        CountDownLatch latch = new CountDownLatch(3);\n        new Thread(new BankApprovalTask(latch,\
  \ \"Finance\")).start();\n        new Thread(new BankApprovalTask(latch, \"Risk\
  \ Management\")).start();\n        new Thread(new BankApprovalTask(latch, \"Compliance\"\
  )).start();\n        latch.await(); // Wait for all approvals\n        System.out.println(\"\
  Transaction approved by all departments.\");\n    }\n}\n```\n\n### CyclicBarrier\n\
  \n`CyclicBarrier` 可用于同步多个线程，使它们在共同点等待，直到所有线程到达屏障。一旦所有线程都到达屏障，它们就会被释放并继续各自的执行。这种结构在线程在继续之前必须等待彼此到达某个点的场景下特别有用。因为在线程被释放后它可以重用，所以它非常适合迭代任务。让我们来看一个使用我们的视频游戏示例的样本实现。考虑该游戏是一个多人赛车游戏，玩家必须在游戏开始之前在起跑线上等待。我们可以使用\
  \ `CyclicBarrier` 来确保在比赛开始前所有玩家都已就绪。以下是该实现方式：\n\n```java\nimport java.util.concurrent.CyclicBarrier;\n\
  \nclass GamePlayer implements Runnable {\n\n    private final CyclicBarrier barrier;\n\
  \    private final String name;\n\n    public GamePlayer(CyclicBarrier barrier,\
  \ String name) {\n        this.barrier = barrier;\n        this.name = name;\n \
  \   }\n\n    @Override\n    public void run() {\n        try {\n            System.out.println(name\
  \ + \" is ready.\");\n            barrier.await(); // Wait for all players to be\
  \ ready\n            System.out.println(name + \" starts playing!\");\n        }\
  \ catch (Exception e) {\n            e.printStackTrace();\n        }\n    }\n}\n\
  ```\n\n以下是驱动类：\n\n```java\nimport java.util.concurrent.CyclicBarrier;\n\npublic\
  \ class GameCyclicBarrierDemo {\n\n    public static void main(String[] args) {\n\
  \        CyclicBarrier barrier = new CyclicBarrier(3, () -> System.out.println(\"\
  All players are ready. Game starts!\"));\n        new Thread(new GamePlayer(barrier,\
  \ \"Player 1\")).start();\n        new Thread(new GamePlayer(barrier, \"Player 2\"\
  )).start();\n        new Thread(new GamePlayer(barrier, \"Player 3\")).start();\n\
  \    }\n}\n```\n\n接下来，让我们看看 `CyclicBarrier` 的另一种实现，这次使用我们的烘焙应用程序示例。我们可能需要在银行应用程序中添加生成综合报告的功能。这可能需要多个部门的数据。我们可以使用\
  \ `CyclicBarrier` 来确保在生成报告之前所有部门都完成了数据准备。以下是实现方式：\n\n```java\nimport java.util.concurrent.CyclicBarrier;\n\
  \nclass BankDepartmentTask implements Runnable {\n\n    private final CyclicBarrier\
  \ barrier;\n    private final String department;\n\n    public BankDepartmentTask(CyclicBarrier\
  \ barrier, String department) {\n        this.barrier = barrier;\n        this.department\
  \ = department;\n    }\n\n    @Override\n    public void run() {\n        try {\n\
  \            System.out.println(department + \" department is preparing data.\"\
  );\n            Thread.sleep(2000); // Simulate data preparation\n            System.out.println(department\
  \ + \" department has finished.\");\n            barrier.await(); // Wait for other\
  \ departments\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n以下是驱动类：\n\n```java\nimport java.util.concurrent.CyclicBarrier;\n\
  \npublic class BankCyclicBarrierDemo {\n\n    public static void main(String[] args)\
  \ {\n        CyclicBarrier barrier = new CyclicBarrier(3, () -> System.out.println(\"\
  All departments have finished. Generating financial report.\"));\n        new Thread(new\
  \ BankDepartmentTask(barrier, \"Finance\")).start();\n        new Thread(new BankDepartmentTask(barrier,\
  \ \"Risk\")).start();\n        new Thread(new BankDepartmentTask(barrier, \"Compliance\"\
  )).start();\n    }\n}\n```\n\n### Semaphore\n\n`Semaphore` 通过允许有限数量的线程同时获取资源来控制对资源的访问。它在管理固定数量资源的访问时非常有用。它是一种同步辅助工具，限制了访问特定资源的并发线程数量。`Semaphore`\
  \ 维护一组许可，并使用两个主要方法：\n\n*   `acquire()` 在必要时会阻塞，直到许可可用，然后获取它。\n*   `release()` 增加一个许可，可能会释放一个阻塞的获取者。\n\
  \n以下是一个针对视频游戏的示例实现，该游戏需要限制同时登录的玩家数量：\n\n\n\n\n```java\nimport java.util.concurrent.Semaphore;\n\
  \nclass GameLoginTask implements Runnable {\n\n    private final Semaphore semaphore;\n\
  \n    public GameLoginTask(Semaphore semaphore) {\n        this.semaphore = semaphore;\n\
  \    }\n\n    @Override\n    public void run() {\n        try {\n            semaphore.acquire();\n\
  \            System.out.println(Thread.currentThread().getName() + \" logged in.\"\
  );\n            Thread.sleep(2000); // Simulate gameplay\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        } finally {\n            System.out.println(Thread.currentThread().getName()\
  \ + \" logged out.\");\n            semaphore.release();\n        }\n    }\n}\n\
  ```\n\n```java\nimport java.util.concurrent.Semaphore;\n\npublic class GameSemaphoreDemo\
  \ {\n    public static void main(String[] args) {\n        Semaphore semaphore =\
  \ new Semaphore(2); // Limit to 2 concurrent logins\n        for (int i = 1; i <=\
  \ 5; i++) {\n            new Thread(new GameLoginTask(semaphore), \"Player \" +\
  \ i).start();\n        }\n    }\n}\n```\n\n## 并发代码的最佳实践\n\n现代 Java 应用强调效率，这凸显了编写并发代码的重要性。创建功能使我们的应用程序能够同时处理多个任务会引入诸如竞态条件、死锁和资源竞争等挑战。本节介绍了几种最佳实践，以帮助降低这些风险，并确保您的多线程\
  \ Java 应用程序既可靠又易于维护。\n\n在编写并发代码时，应始终遵循以下最佳实践：\n\n*   **避免阻塞操作**：阻塞操作（如等待线程完成或无限期获取锁）可能会导致性能瓶颈。为了避免阻塞问题，我们可以尽可能使用非阻塞算法，使用带有超时的\
  \ `tryLock()` 来防止无限阻塞，并使用异步任务来提高响应能力。\n*   **避免死锁**：当两个或多个线程互相等待对方释放锁时，就会发生死锁，导致程序停滞。为了防止死锁，我们应该始终以一致的顺序获取锁，使用\
  \ `tryLock()` 避免无限等待，并将大任务拆分为较小的、独立的任务，这些任务就不需要同时持有多个锁。\n*   **记录并发需求**：为了确保代码的可维护性，我们应该详尽记录哪些资源在线程间共享、使用了什么同步机制来保护共享资源，以及任何潜在的死锁场景及其缓解方法。\n\
  *   **优雅地处理异常**：无论使用什么编程结构，我们都应该始终优雅地处理异常。一个线程中未处理的异常可能会导致整个应用程序失败或让共享资源处于不一致的状态。优雅的异常处理包括始终将并发代码封装在\
  \ `try-catch` 块中，并为线程池使用自定义异常处理器。更多信息请参阅第 5 章，处理错误与异常。\n*   **剖析和监控并发代码**：并发问题通常发生在特定条件下，例如高负载或特定的时间序列。使用监控工具（如\
  \ Java VisualVM (JVisualVM) 和 Java Mission Control (JMC)）监控线程行为。应用程序性能监控 (APM) 工具可用于检测生产环境中的死锁、竞态条件和瓶颈。更多信息请参阅第\
  \ 13 章，调试、测试与部署。\n*   **保护关键区域**：识别修改共享资源的代码关键区域并对其进行保护，以确保数据一致性。请按照本章概述使用适当的同步机制。\n\
  *   **彻底测试并发代码**：并发问题通常很难通过非正式测试检测。为了确保您的并发代码可靠的，您应该使用压力测试工具来模拟高并发负载，在不同的环境和硬件配置下测试代码，并使用并发测试框架。更多信息请参阅第\
  \ 13 章，调试、测试与部署。\n*   **使用高级并发工具类**：不要手动管理线程，而是使用 `Executor` 框架和 `java.util.concurrent`\
  \ 包提供的并发工具类。这种方法可以让 Java 为我们处理许多线程管理的复杂性问题。具体而言，使用 `ExecutorService` 进行任务管理，并使用\
  \ `CountDownLatch`、`CyclicBarrier` 和 `Semaphore` 来协调线程交互。\n\n编写并发代码要求我们采用性能最大化的思维方式。通过遵循上述最佳实践，您应该能够构建出健壮、高效、易于维护且没有常见并发陷阱的多线程应用程序。\n\
  \n## 结论\n\n本章探索了在 Java 中构建并发应用程序的核心概念和工具。从使用 `Thread` 类和 `Runnable` 接口的多线程基础开始，您有机会学习如何有效地创建和管理线程。本章还涵盖了同步技术，例如使用锁和\
  \ `synchronized` 关键字，以维护数据一致性并防止竞态条件。\n\n引入了 `Executor` 框架并将其确立为管理线程池的强大抽象，以及 `CountDownLatch`、`CyclicBarrier`\
  \ 和 `Semaphore` 等各种并发工具类。这些工具类可以简化复杂的线程交互，使我们能够轻松处理并发任务并构建可扩展且高效的应用程序。\n\n本章涵盖的概念、实践和示例旨在让您应对现实世界的并发挑战。\n\
