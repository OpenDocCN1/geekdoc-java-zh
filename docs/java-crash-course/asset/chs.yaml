  \n10. 糟糕的异常处理会以何种方式对用户产生负面影响？例如，不完善的错误信息或未处理的异常如何影响用户信任或数据安全？\n\n## 挑战\n\n以下问题用于评估你对章节内容的理解并对关键概念进行批判性思考：\n\
  \n- 验证用户输入：\n\n    - 目标：确保用户输入符合预定义标准并优雅地处理无效输入。\n    - 活动：编写一个 Java 程序接收用户输入的密码。如果密码不符合下面的标准，抛出一个自定义异常\
  \ `InvalidPasswordException` 并附带适当的消息。确保程序处理该异常并提示用户再次输入密码，直到有效为止。密码必须满足以下标准：\n\n\
  \        - 至少八个字符。\n        - 包含至少一个大写字母。\n        - 包含至少一个小写字母。\n        - 包含至少一个数字。\n\
  \n    - 现实应用：用户输入验证是应用程序中的常见需求，特别是账户安全和敏感数据保护。\n\n- 处理缺失的配置文件：\n\n\n\n\n\n### 处理缺失的必要配置文件\n\
