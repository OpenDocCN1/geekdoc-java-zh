  \n![QR-Logo](img/fm1.png)\n\n# 第 10 章 数据库连接\n\n## 引言\n\n数据库是现代 Java 应用程序的基础组件。高效数据检索、操作和存储的重要性不言而喻，因为对于从小型单功能工具到大型企业系统的\
  \ Java 应用程序都至关重要。本章将探索数据库连接和操作，帮助你在 Java 应用程序中构建高效且可扩展的数据库功能。具体来说，本章探讨了 Java 如何与关系型数据库交互以处理结构化数据。\n\
  \n本章从关系型数据库介绍，重点关注它们在 Java 应用程序中的用法。我们将检查这些数据库的结构以及它们如何存储数据。`SQLite` 作为一种开源、轻量级的嵌入数据库，将用于实现持久数据存储的上手示例。还将涵盖通过结构化查询语言（`SQL`）查询的核心数据库操作。\n\
  \n还将探讨使用 Java 数据库连接（`JDBC`）程序化执行 `SQL` 查询这一高级主题。我们查看数据库和 `JDBC` 在应用开发中的性。关键主题包括在\
  \ Java 项目中设置 `JDBC`、建立数据库连接、执行 `SQL` 查询以及使用预编译语句和可调用语句。本章还涉及了数据库的两个底层问题：安全且高效的数据处理。最后，我们介绍了数据库事务、数据库操作的最佳实践以及性能增强技术。\n\
  \n## 章节结构\n\n本章涵盖了以下主题：\n\n* Java 应用程序数据库简介\n* 在 Java 中与数据库交互\n* 使用 `JDBC` 进行数据库连接\n\
  * 事务管理\n* 数据库操作最佳实践\n\n## 目标\n\n在本章结束时，你应该理解如何在 Java 中实现关系型数据库并执行基本的 `SQL` 操作。在上手练习的帮助下，你应该能够使用\
  \ Java 编程语言设置、创建并与数据库交互。你还应该理解 `JDBC` 在数据库交互中的作用，以及它如何帮助你管理数据库事务。最后，你应该理解并能够实现 Java\
  \ 中数据库交互的最佳实践，例如防止 SQL 注入。\n\n## Java 应用程序数据库简介\n\n几乎每个现代软件开发项目都涉及高效地处理、存储和检索数据。这对于小型、中型和大型应用程序都是如此。即使是现代数字游戏也需要数据库。我们可以开发与数据库交互的\
  \ Java 应用程序，高效处理海量数据并遵循安全规范。\n\n考虑在线零售商管理的数据量级。他们的系统通常拥有用户账户、产品信息、订单交易和库存。他们需要高效地存储和检索数据。本章以一家销售旧书的虚拟在线零售商\
  \ Bougie Books 作为我们的示例应用程序。Bougie Books 维护着书籍目录、客户订单和评论，所有这些都需要在关系数据库中进行结构化存储。当我们探索数据库概念和\
  \ `SQL` 查询时，我们将构建支持该书店运营的数据库功能。\n\n### 关系型数据库概述\n\n在几种类型的数据库中，关系型数据库在现代应用开发中的应用最广泛。它们的结构是为了支持数据一致性和数据管理效率。\n\
  \n| 注意：关系数据库将数据组织成具有预定义关系的结构化表。 |\n\n关系型数据库为我们提供了这些处：\n\n* 结构化数据存储\n* 数据完整性强制\n\
  * 高效的复杂查询支持\n* 事务管理\n* 结构化实体关系\n* 可扩展性\n\n这种类型的数据库由于其表结构而易于理解。每个表代表一个实体。每行是一条记录，每列都是一个字段。列持有特定的数据类型，例如日期、数字或文本。我们通过主键（`PK`）和外键（`FK`）连接表。这些键允许我们建立不同实体之间的关系。\n\
  \n让我们使用我们的 Bougie Books 示例。对于该应用程序，我们需要存储有关书籍、客户和订单的信息。\n\n表 10.1 显示了我们如何使用关系数据库组织\
  \ Bougie Books 数据：\n\n| 表名 | 用途 |\n| :--- | :--- |\n| Books | 书籍详情，如标题、作者、价格等 |\n\
  | Customers | 存储名称、电子邮件、地址等 |\n| Orders | 用于跟踪客户购买 |\n| Order_Items | 每个订单的明细记录\
  \ |\n\n表 10.1：Bougie Books 关系数据库表\n\n图 10.1 显示了一个简化的数据库架构，用来说说明如何通过 `PK` 和 `FK`\
  \ 连接数据库表：\n\n\n\n\n\n![截图显示了四个数据库表：Books、Orders、Customers 和 Order_Items，每个表都列出了书籍销售数据库架构的列名、数据类型和简要描述。](img/Figure_10.1.png)\
  \ \n\n图 10.1: 简化的 Bougie Books 数据库架构\n\n在创建数据库架构时，需要考虑若干因素，包括需要哪些数据、数据的格式是什么，以及表与表之间的什么关系。在我们的示例中，`Orders`\
  \ 和 `Books` 表是多对多的关系。这是因为一个订单可以包含多本书，而一本书也可以出现在多个订单中。我们将使用 `Order_Items` 表来管理这种关系。\n\
  \n为了实现我们的 gie Books 示例，我们将选择与 SQLite 兼容的数据类型。\n\n表 10.2 描述了我们将使用的数据类型：\n\n| 数据类型\
  \ | 描述 |\n| :--- | :--- |\n| `INTEGER` | 用于 ID 以确保索引效率 |\n| `REAL` | 将用于精确计算 |\n\
  | `TEXT` | 用于 `YYYY-MM-DD HH:MM:SS` 格式的日期 |\n\n表 10.2: Bougie Books 选择的数据类型\n\n\
  我们的结构化架构应该允许 Bougie Books 高效地管理其书籍库存、客户信息和订单。实现关系型数据库支持事务完整性和可扩展性。\n\n### 存储和管理结构化数据\n\
  \n数据库的核心目的是安全地存储结构化数据，以便应用程序检索和管理这些数据。我们的目标是提高数据库交互的效率。这通过定义良好的表以及它们之间的关系来实现。\n\n\
  在 Bougie Books，结构化数据对于追踪书籍库存、处理客户订单和管理用户信息至关重要。在关系型数据库中，表是存储结构化数据的主要方式。正如我们在上一节提到的，每个表代表一个实体（例如\
  \ `Books`、`Customers`、`Orders`），表中的每行代表一条记录（例如特定的书籍或客户）。\n\n#### 数据一致性\n\n我们的表由列组成，每列都有特定的数据类型。它们的结构化特性确保了数据一致性。\n\
  \n| 注意：数据一致性意味着每条记录都遵循相同的格式。 |\n\n例如，在 Bougie Books 中，`Books` 表存储可用书籍的信息，包括标题、作者、体裁、价格和\
  \ `stock_qty`。参考 表 10.3 示例数据：\n\n| `Book_id (PK)` | title | author | genre | price\
  \ | stock_qty |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | Mastering Agile\
  \ for Enterprises | Aditi Agarawal | Software | 12.99 | 24 |\n| 2 | Cloud Security\
  \ for Beginners | Sasa Kovacevic | Security | 14.99 | 8 |\n| 3 | Java 8 to 21 |\
  \ Shai Almog | Programming | 9.99 | 32 |\n\n表 10.3: 书籍表的示例数据\n\n如上表所示，每行代表一本书，每列定义了书籍的属性。这种类型的表可能包含额外的字段（列），如出版日期、版本、品状况、装帧、硬壳/软装、ISBN\
  \ 等。`book_id` 字段是 `PK`（主键），是每本书籍的唯一标识。\n\n#### 管理关系\n\n我们之前提到过 `FK`（外键）是建立表之间连接的机制。这些关系非常重要，因为它们旨在防止数据重复并确保所有记录的一致性。\n\
  \n使用我们的 Bougie Books 示例，客户订单需要跟踪购买了哪些书籍。由于书籍信息已经在 `Books` 表中，我们不需要复制它；相反，我们可以使用\
  \ `Order_Items` 表通过 `FK` 连接书籍和订单。\n\n参见 表 10.4 示例：\n\n| `order_item_id (PK)` | `order_id\
  \ (FK)` | `book_id (FK)` | quantity |\n| :--- | :--- | :--- | :--- |\n| 1 | 1001\
  \ | 1 | 2 |\n| 2 | 1001 | 3 | 1 |\n| 3 | 1--2 | 2 | 3 |\n\n表 10.4: 书籍表的示例数据\n\n\
  在我们的示例中，`order_id` 1001 包含了两本《Mastering Agile for Enterprises》和一本《Java 8 to 21》。这种结构允许\
  \ Bougie Books 高效地存储订单信息，而无需在多个表中重复书籍详情。\n\n#### 存储和管理数据\n\n`SQL` 是我们与关系型数据库中的结构化数据交互的方式。让我们通过\
  \ Bougie Books 数据库示例来看一些基本的 `SQL` 操作。\n\n要向表中添加数据，我们使用 `INSERT` 语句。当 Bougie Books\
  \ 收到一批旧书时，它们将存储在 `Books` 表中，语句如下：\n\n```\nINSERT INTO Books (book_id, title, author,\
  \ genre, price, stock_qty)\nVALUES (4, 'Blender 3D for Jobseekers', 'Laurie Annis',\
  \ 'Game Dev', 11.99, 8);\n```\n\n此 `INSERT` 语句向表中添加了一条新记录，将 Laurie Annis 编写的《Blender\
  \ 3D for Jobseekers》存储到我们的库存中。\n\n要更新现有数据，我们使用 `UPDATE` 语句。每当客户购买书籍时，都需要更新数据。\n\n\
  以下是我们使用 `UPDATE` 语句减少数量的示例：\n\n```\nUPDATE Books\nSET stock_qty = stock_qty - 1\n\
  WHERE book_id = 1;\n```\n\n该查询在成功购买后减少了《Mastering Agile for Enterprises》的库存。\n\n\
  为了向客户显示可用书籍或生成报告，我们使用 `SELECT` 语句：\n\n```\nSELECT title, author, price, stock_qty\n\
  FROM Books\nWHERE stock_qty > 0\nORDER BY title;\n```\n\n#### 优化存储\n\n优化存储的概念目的是让应用程序能够高效管理数据。我们需要优化查询和存储。\n\
  \n以下是帮助我们优化存储的一些最佳实践：\n\n- 确定经常搜索的列并对其建立索引。这将提高查询速度。\n- 在可能的情况下，对批量操作使用事务。我们将在本章后面的部分介绍事务。\n\
  - 仔细设计你的数据库架构以避免数据冗余。这将提高一致性并减少存储。\n- 为每个字段使用最高效的数据类型以减少存储开销。\n\n### 数据库在 Java 程序中的重要性\n\
  \nJava 程序中使用数据库使我们能够实现持久化存储。用户期望每次使用应用程序时数据可用。一个简单的例子是用户信息。我们不需要用户每次使用系统时都创建新账户；相反，我们将他们的凭据存储在数据库中以便日后检索。\n\
  \n数据库的价值不仅限于简单的用户账户，还包括产品库存、财务交易、数据分析等用例。当数据库针对存储进行了优化时，我们的应用程序可以使用 `SQL` 语句来检索、处理和存储数据。\n\
  \n#### 持久数据存储\n\n正如我们所建立的，Java 程序通常需要数据持久越单个会话。如果没有持久存储，我们需要在易失内存中管理数据，数据会在程序终止时丢失。关系型数据库允许我们的数据永久存储，即使在系统重启后依然可用。\n\
  \n例如，在 Bougie Books，我们需要存储客户的购买历史。通过将订单记录存储在数据库中，我们可以随时检索这些信息。以下是我们在 Bougie Books\
  \ 数据库中存储订单的方式：\n\n```\nINSERT INTO Orders (order_id, order_date, cust_id, total_price)\n\
  VALUES (1003, '2025-02-16', 202, 75.99);\n```\n\n这种方法确保订单信息永久保存在系统中。\n\n#### 高效搜索\n\
  \n\n\n\n我们在设计数据库时考虑了效率。结构良好的数据库能够通过 `SQL` 查询实现快速的数据检索，允许我们的 `Java` 应用程序高效地访问和过滤信息。\n\
  \n在 Bougie Books，一个常见的例子是客户按特定作者搜索书籍。我们不需要扫描整个文件或遍历内存中的列表，而是可以立即使用简单的 `SQL` 查询来检索相关记录。\n\
  \n以下是一个示例：\n\n```sql\nSELECT title, price FROM Books WHERE author = 'Neo Anderson';\n\
  ```\n\n该查询会快速获取 Neo Anderson 的所有书籍，提供无缝的用户体验。\n\n## 数据一致性与完整性\n\n虽然我们在在本章的开头已经提到了数据一致性，但让我们再次来看并使用示例来巩固我们的理解。关系型数据库主要通过\
  \ `PK`（主键）和 `FK`（外键）等约束来强制数据完整性。这可以防止重复记录和数据缺失等问题。\n\n以 Bougie Books 为例，每笔订单必须关联到一个有效的客户。`FK`\
  \ 约束确保了如果系统中不存在该客户，则无法创建订单。\n\n以下是我们在 `Orders` 表中建立 `FK` 约束的方法\n\n```sql\nCREATE\
  \ TABLE Orders (\n    order_id INTEGER PRIMARY KEY,\n    order_date TEXT NOT NULL,\n\
  \    cust_id INTEGER NOT NULL,\n    total_price REAL CHECK (total_price > 0),\n\
  \    FOREIGN KEY (cust_id) REFERENCES Customers(cust_id)\n);\n```\n\n在之前的 `SQL`\
  \ 示例中，`FOREIGN KEY` 确保了在下订单之前必须存在有效的客户。`CHECK (total_price > 0)` 语句是另一个约束，确保订单总金额不会为负。此类约束可以防止无效数据损坏系统。\n\
  \n## 多用户访问\n\n大多数现代应用程序都支持多个用户同时访问系统。我们使用数据库来高效处理并发操作。我们的目标是即使在多个用户同时读写数据时也能保持数据的一致性。\n\
  \n例如，想象一下有多个客户试图在 Bougie Books 购买最后本书。数据库将确保只有一名客户能够成功完成交易。\n\n让我们来看看如何处理同时购买的情况：\n\
  \n```sql\nBEGIN TRANSACTION;\n\nUPDATE Books\nSET stock_qty = stock_qty - 1\nWHERE\
  \ book_id = 2 AND stock_qty > 0;\n\nCOMMIT;\n```\n\n在这个示例中，持续更新库存水平至关重要，以防止多个客户同时购买同一本书。这避免了库存冲突。\n\
  \n## 可扩展性\n\n为数据库的增长进行计划是非常重要的，这样我们就可以高效处理增加的数据量，而不会降低整个系统的性能。对于 Bougie Books 来说，这意味着：\n\
  \n* 在不产生性能问题的情况下扩展书籍目录。\n* 管理数千个客户订单而不导致系统崩溃。\n* 支持多个类别、折扣和促销活动。\n\n关系型数据库可以使用索引、优化的查询和缓存机制高效地处理数百万记录。\n\
  \n## 安全性\n\n实现关系数据库的另一个原因是利用其内置的安全机制。限制对隐私和敏感信息的访问是非常重要的。通过关系型数据库，我们可以实现用户角色和权限，确保只有授权用户才能修改或查看特定数据。\n\
  \n例如，在 Bougie Books，这可能意味着客户只能看到自己的订单，而经理可以管理库存并查看所有订单。\n\n以下是一个授予客户只读权限的示例：\n\n\
  ```sql\nGRANT SELECT ON Orders TO customer_role;\n```\n\n上面的 `SQL` 语句确保客户可以查看订单但不能修改它们。使用基于角色的访问系统可以防止对应用程序数据进行未经授权的修改。\n\
  \n## 在 Java 中操作数据库\n\n上一节涵盖了数据库在 `Java` 应用程序中的重要性，并解释了如何使用关系数据库进行持久化数据。本节将把上一节的知识应用于实际操作示例。我们将使用\
  \ `SQLite` 为我们的在线零售商 Bougie Books 构建数据库功能。我们将涵盖基础 `SQL` 操作，演示如何用 `Java` 执行 `SQL`\
  \ 查询，以及在 `Java` 程序中设置和与 `SQLite` 交互。\n\n### 基础 SQL 操作\n\n四个主要的数据库交互是创建、读取、更新和删除（CRUD），而四个基本的\
  \ `SQL` 操作是 `SELECT`、`INSERT`、`UPDATE` 和 `DELETE`。这些操作允许我们检索和修改数据库中的记录。\n\n让我们以\
  \ Bougie Books 为背景，看看如何使用这些这些 `SQL` 操作。\n\n### 检索数据\n\n当客户或其他用户在 Bougie Books 上搜索书籍时，我们将使用\
  \ `SELECT` 语句来检索相关数据。\n\n以下是检索当前库存中所有书籍的示例：\n\n```sql\nSELECT title, author, price,\
  \ stock_qty\nFROM Books\nWHERE stock_qty > 0\nORDER BY title ASC;\n```\n\n该查询根据库存值大于零，返回书店目前所有的所有书籍。查询将返回书籍的标题、作者、价格和\
  \ `stock_qty`（库存数量）。结果将按标题的字母顺序排列。\n\n### 添加数据\n\n当新书到货时，Bougie Books 的员工将使用系统将其添加到数据库中。向我们的\
  \ `Books` 表添加新书的功能需要使用 `INSERT`。以下是操作方法：\n\n```sql\nINSERT INTO Books (book_id,\
  \ title, author, genre, price, stock_qty)\nVALUES (5, 'Master Flutter', 'Kevin Moore',\
  \ 'Programming', 31.99, 24);\n```\n\n这会将书籍 `Master Flutter` 添加到我们的库存中，并附有相应的元数据，包括添加到库存的数量。\n\
  \n### 更新数据\n\n更新现有数据是常见的数据库操作。这可能是更新书籍价格、修复拼写错误或在书籍购买后更新库存。\n\n这是一个我们在销售后减少库存的示例：\n\
  \n```sql\nUPDATE Books\nSET stock_qty = stock_qty - 1\nWHERE book_id = 5;\n```\n\
  \n这将 `Master Flutter` 的库存数量减少一。\n\n### 删除数据\n\n如果某本书售罄，我们只需要更新记录使数量归零。然而，如果某本书停产了，我们需要将其从库存中删除。\n\
  \n以下是该操作的示例：\n\n```sql\nDELETE FROM Books\nWHERE book_id = 5;\n```\n\n这将从我们的数据库中永久删除\
  \ `Master Flutter`。\n\n### 执行 SQL 查询\n\n`Java` 提供了与关系型数据库通信的 `JDBC` API。我们将探索如何使用\
  \ `JDBC` 从 `Java` 代码向数据库发送 `SQL` 查询。现在让我们看看在 `Java` 中执行 `SQL` 查询的基本机制。\n\n我们的第一个任务是连接数据库，如下：\n\
  \n```java\npublic class DatabaseConnection {\n    public static Connection connect()\
  \ {\n        Connection conn = null;\n        try {\n            String url = \"\
  bougie_books.db\";\n            conn = DriverManager.getConnection(url);\n     \
  \       System.out.println(\"连接到 Bougie Books 数据库.\");\n        } catch (SQLException\
  \ e) {\n            System.out.println(\"连接失败: \" + e.getMessage());\n        }\n\
  \        return conn;\n    }\n}\n```\n\n这段代码片段尝试连接到我们的数据库。如果数据库尚不存在，它将被创建。\n\n接下来，我们可以通过此行代码测试我们的连接：\n\
  \n```java\nconnect(); // 测试连接\n```\n\n一旦连接到数据库，我们就可以 `Statement` 和 `PreparedStatement`\
  \ 类从 `Java` 执行 `SQL` 语句。\n\n这里是一个简化的示例，其中我们可能会从数据库中检索所有书籍：\n\n```java\ntry (Connection\
  \ conn = DatabaseConnection.connect();\n     Statement stmt = conn.createStatement();\n\
  \     ResultSet rs = stmt.executeQuery(\"SELECT * FROM Books\")) {\n    while (rs.next())\
  \ {\n        System.out.println(rs.getInt(\"book_id\") + \" - \" +\n           \
  \ rs.getString(\"title\") + \" by \" +\n            rs.getString(\"author\") + \"\
  \ - $\" +\n            rs.getDouble(\"price\"));\n    }\n}\n```\n\n\n\n```java\n\
  } catch (SQLException e) {\n    System.out.println(\"Error fetching books: \" +\
  \ e.getMessage());\n}\n```\n\n上述代码段演示了如何使用 `Statement` 类从 `Books` 表检索所有书籍并将其打印到控制台。\n\
  \n### 使用 SQLite\n\n对于简单的程序和测试，SQLite 数据库非常有帮助。它们易于实现，且不需要独立的数据库服务器。SQLite 数据库存储在单个\
  \ `.db` 文件中。\n\n使用以下步骤来设置和测试 SQLite：\n\n1.  在 VS Code 中安装 SQLite 扩展。\n2.  为我们的项目添加\
  \ SQLite JDBC 驱动。你可以在此处找到最新驱动：[`https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc`](https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc)\n\
  3.  在你的 VS Code 项目中创建一个 `/lib` 文件夹并将 `.jar` 文件放在其中。\n4.  在你的项目中创建一个 `/.vscode` 文件夹。\n\
  5.  在 `.vscode` 文件夹内部创建一个新的 `launch.json` 文件，并将以下内容添加到该文件中：\n\n```json\n{\n  \"\
  version\": \"3.49.0.0\",\n  \"configurations\": [\n    {\n      \"type\": \"java\"\
  ,\n      \"name\": \"Launch Java Program\",\n      \"request\": \"launch\",\n  \
  \    \"mainClass\": \"SQLiteConnection\",\n      \"projectName\": \"SQLiteConnection\"\
  ,\n      \"classPaths\": [\n        \"${workspaceFolder}/lib/sqlite-jdbc-3.49.0.0.jar\"\
  \n      ]\n    }\n  ]\n}\n```\n\n6.  编写如下所示 `SQLiteConnection` 类：\n\n```java\nimport\
  \ java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
  \npublic class SQLiteConnection {\n    public static void main(String[] args) {\n\
  \        Connection connection = null;\n        try {\n            // 加载 SQLite\
  \ JDBC 驱动\n            Class.forName(\"org.sqlite.JDBC\");\n            // 数据库参数\n\
  \            String url = \"jdbc:sqlite:./lib/test.db\"; // 确保路径正确\n           \
  \ // 创建数据库连接\n            connection = DriverManager.getConnection(url);\n     \
  \       System.out.println(\"Connection to SQLite has been established.\");\n  \
  \      } catch (ClassNotFoundException e) {\n            System.out.println(\"SQLite\
  \ JDBC driver not found. \" + e.getMessage());\n        } catch (SQLException e)\
  \ {\n            System.out.println(e.getMessage());\n        } finally {\n    \
  \        try {\n                if (connection != null) {\n                    connection.close();\n\
  \                }\n            } catch (SQLException ex) {\n                System.out.println(ex.getMessage());\n\
  \            }\n        }\n    }\n}\n```\n\n7.  在终端窗口中使用 `javac` 编译你的程序。例如：\n  \
  \  `javac -cp .:./lib/sqlite-jdbc-3.49.0.0.jar SQLiteConnection.java`\n8.  在终端窗口中使用\
  \ `java` 运行你的程序。例如：\n    `java -cp .:./lib/sqlite-jdbc-3.49.0.0.jar SQLiteConnection`\n\
  \n如果一切运行正常，你应该看到以下输出：\n```\nConnection to SQLite has been established.\n```\n\n\
  ### 创建 Bougie Books 数据库\n\n好了，既然我们已经在 VS Code 中运行了 SQLite，让我们为我们的 Bougie Books 数据库创建一个\
  \ `Connection` 类。以下是一个示例类：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.SQLException;\n\npublic class SQLiteConnection {\n    public static\
  \ Connection connect() {\n        Connection connection = null;\n        try {\n\
  \            // 连接到 SQLite 数据库\n            String url = \"jdbc:sqlite:bougie_books.db\"\
  ;\n            connection = DriverManager.getConnection(url);\n            System.out.println(\"\
  Connected to SQLite database.\");\n        } catch (SQLException e) {\n        \
  \    System.out.println(\"Connection failed: \" + e.getMessage());\n        }\n\
  \        return connection;\n    }\n\n    public static void main(String[] args)\
  \ {\n        Connection connection = connect();\n        if (connection != null)\
  \ {\n            try {\n                Statement stmt = connection.createStatement();\n\
  \                String sql = \"CREATE TABLE IF NOT EXISTS Books (\"\n         \
  \               + \"book_id INTEGER PRIMARY KEY, \"\n                        + \"\
  title TEXT NOT NULL, \"\n                        + \"author TEXT NOT NULL, \"\n\
  \                        + \"genre TEXT NOT NULL, \"\n                        +\
  \ \"price REAL NOT NULL, \"\n                        + \"stock INTEGER NOT NULL)\"\
  ;\n                stmt.execute(sql);\n                System.out.println(\"Books\
  \ table created.\");\n            } catch (SQLException e) {\n                System.out.println(\"\
  Error creating table: \" + e.getMessage());\n            } finally {\n         \
  \       try {\n                    connection.close();\n                } catch\
  \ (SQLException e) {\n                    System.out.println(e.getMessage());\n\
  \                }\n            }\n        }\n    }\n}\n```\n（注：提供的类实现源文本是碎片化且混乱的；我已根据输入文本中提供的变量和字符串将逻辑重构为有效的\
  \ Java 结构，以保持语义价值。）\n\n\n\n\n1. 客户下了一个订单。\n2. 从 `Books` 表中扣除购买的数量。\n3. 将购买信息添加到\
  \ `Orders` 表中。\n4. 确保这两个操作（上述第 2 步和第 3 步）都要成功，要么回滚更改。\n\n以下是一个演示如何实现上述功能的代码片段：\n\
  \n```java\ntry {\n  conn.setAutoCommit(false); // 开始事务\n  // 扣库存\n  String updateStock\
  \ = \"UPDATE Books SET stock_qty = stock_qty - ? WHERE book_id = ?\";\n  PreparedStatement\
  \ pstmt1 = conn.prepareStatement(updateStock);\n  pstmt1.setInt(1, 2); // 减少库存 2\n\
  \  pstmt1.setInt(2, 1); // Book ID = 1\n  pstmt1.executeUpdate();\n  // 插入订单\n \
  \ String insertOrder = \"INSERT INTO Orders (order_id, order_date, cust_id, total_price)\
  \ VALUES (?, ?, ?, ?)\";\n  PreparedStatement pstmt2 = conn.prepareStatement(insertOrder);\n\
  \  pstmt2.setInt(1, 101); // 订单 ID\n  pstmt2.setString(2, \"2025-02-16\"); // 订单日期\n\
  \  pstmt2.setInt(3, 5); // 客户 ID\n  pstmt2.setDouble(4, 79.98); // 总价\n  pstmt2.executeUpdate();\n\
  \  conn.commit(); // 提交事务\n} catch (SQLException e) {\n  conn.rollback(); // 错误回滚\n\
  \  System.out.println(\"Transaction failed: \" + e.getMessage());\n}\n```\n\n如前面的代码所示，我们使用\
  \ `try-catch` 块来捕获 `SQLException` 错误。事务中任何原子部分的错误都会导致操作回滚，将数据库恢复到之前的状态。\n\n## 数据库操作最佳实践\n\
  \n低效、不安全且编写不当的数据库查询会对 Java 应用程序产生灾难性的影响。这些问题的症状包括性能瓶颈、安全漏洞、逻辑错误以及难以维护的代码。\n\n本节将探讨在\
  \ Java 中处理数据库时的几项最佳实践，所有内容均基于我们的 Bougie Books 应用程序背景。\n\n### 防止 SQL 注入\n\nSQL 注入是与数据库相关的最常见的安全漏洞之一。恶意实体试图通过注入有害输入来操纵\
  \ SQL 语句。\n\n例如，考虑以下代码：\n\n```java\nString userInput = \"Java\"; // 可能会被用户操纵\nString\
  \ query = \"SELECT * FROM Books WHERE genre = '\" + userInput + \"'\";\nStatement\
  \ stmt = conn.createStatement();\nResultSet rs = stmt.executeQuery(query);\n```\n\
  \n如果用户输入 `'' OR ‘1’='1’`，原始查询将变为：\n\n`SELECT * FROM Books WHERE genre = '' OR '1'='1';`\n\
  \n这将返回所有记录，从而暴露整个数据库。为了防止这一点，我们可以使用 `PreparedStatement` 实现参数化查询，而不是直接将用户输入拼接到 SQL\
  \ 字符串中。\n\n这是一个示例：\n\n```java\nString query = \"SELECT * FROM Books WHERE genre\
  \ = ?\";\nPreparedStatement pstmt = conn.prepareStatement(query);\npstmt.setString(1,\
  \ userInput);\nResultSet rs = pstmt.executeQuery();\n```\n\n这种方法确保我们对待用户输入视为数据，而不是\
  \ SQL 语句的一部分。这是防止 SQL 注入的有效方法。\n\n### 优化查询性能\n\n另一个最佳实践是优化我们的 SQL 查询以实现高效的性能。编写不当的\
  \ SQL 语句可能导致系统卡顿、响应时间缓慢和服务器负载增加。为了实现优化查询性能的目标，我们可以使用四种特定技术。\n\n首先，我们可以对重复查询使用 `PreparedStatement`。这种技术的效率源于数据库对执行语句的缓存，减少了开销。这带来了更安全、更快的查询。\n\
  \n这是一个示例：\n\n```java\nString query = \"SELECT * FROM Books WHERE price < ?\";\n\
  PreparedStatement pstmt = conn.prepareStatement(query);\npstmt.setDouble(1, 50.00);\
  \ // 第一次执行\npstmt.executeQuery();\npstmt.setDouble(1, 30.00); // 使用新参数第二次执行\npstmt.executeQuery();\n\
  ```\n\n第二个优化方法是只检索必要的列。不要使用 `SELECT *`，而是指定系统需要的列。与其使用 `SELECT * FROM Books;`，不如使用类似\
  \ `SELECT title, price FROM Books WHERE stock_qty > 0;` 的语句。\n\n第三查询优化方法是使用索引来实现更快的搜索。以下是在\
  \ `title` 列上创建索引的方法：\n\n`CREATE INDEX idx_title ON Books (title);`\n\n这将加快此类查询的速度：\n\
  \n`SELECT * FROM Books WHERE title = 'Effective Java';`\n\n最后的查询优化方法是限制结果集，特别是在处理大型数据集时。限制结果数量可以避免使应用程序过载。这是一个示例：\n\
  \n`SELECT * FROM Books ORDER BY title ASC LIMIT 10;`\n\n### 管理数据库连接\n\n必须意识到数据库连接是资源密集型的，这凸显了正确管理它们的重要性。管理不当的数据库连接可能导致内存泄漏和整体性能低下的。\n\
  \n以下三种技术可以减少这种对资源的消耗：\n\n*   使用 `try-with-resources` 进行自动资源管理。这种方法在整个章节中一直在使用。\n\
  *   实现连接池以重用现有连接，而不是在每次有数据库请求时打开新连接。这将减少开销。你可以在 Java 中使用以下连接池库之一：\n    *   Apache\
  \ DBCP\n    *   C3P0\n    *   HikariCP\n*   在使用完成后务必关闭数据库连接。这将防止连接泄漏。\n\n以下是这样操作的示例：\n\
  \n```java\nif (conn != null && !conn.isClosed()) {\n  conn.close();\n}\n```\n\n\
  ### 处理查询结果\n\n高效处理 `ResultSet` 数据是一项有助于确保应用程序性能和可读性的最佳实践。\n\n首先，我们应该正确遍历 `ResultSet`。我们可以使用\
  \ `while` 循环处理结果，如下：\n\n```java\nString query = \"SELECT title, price FROM Books\
  \ WHERE stock_qty > 0\";\nPreparedStatement pstmt = conn.prepareStatement(query);\n\
  ResultSet rs = pstmt.executeQuery();\nwhile (rs.next()) {\n  String title = rs.getString(\"\
  title\");\n  double price = rs.getDouble(\"price\");\n  System.out.println(title\
  \ + \" - $\" + price);\n}\n```\n\n第二个方法是安全地处理空值。在获取值后，可以使用 `wasNull()` 检查空值。这是一个这样操作的示例：\n\
  \n```java\nint stockQty = rs.getInt(\"stock_qty\");\nif (rs.wasNull()) {\n  stockQty\
  \ = 0; // 默认值\n}\n```\n\n我们在 Java 中处理数据库的最后一个最佳实践是正确处理错误和异常。这将有助于我们的应用程序从意外故障中恢复。\n\
  \n一种方法是使用特定的异常处理来区分 SQL 和通用异常。例如：\n\n```java\ntry {\n  // 数据库代码\n} catch (SQLIntegrityViolationException\
  \ e) {\n  System.out.println(\"Duplicate entry: \" + e.getMessage());\n} catch (SQLException\
  \ e) {\n  System.out.println(\"Database error: \" + e.getMessage());\n} catch (Exception\
  \ e) {\n  System.out.println(\"Unexpected error: \" + e.getMessage());\n}\n```\n\
  \n第二个方法是在事务中的任何操作失败时实现回滚。这是一个示例：\n\n```java\ntry {\n  conn.setAutoCommit(false);\n\
  \  // 执行多个 SQL 语句\n  conn.commit();\n} catch (SQLException e) {\n  conn.rollback();\
  \ // 错误时回滚\n  System.out.println(\"Transaction failed: \" + e.getMessage());\n}\n\
  ```\n\n第三种方法是记录错误以支持调试。例如，你可以记录错误以供调试。有一些日志框架（例如 Log4j 和 SLF4J）可以提供帮助。\n\n最后，我们应该始终避免暴露敏感信息。例如，向用户显示原始\
  \ SQL 错误应该是始终被避免的。相反，应提供用户友好的消息并记录技术细节。\n\n例如：\n\n```java\nSystem.out.println(\"\
  发生意外错误。请稍后重试.\");\nlogger.error(\"SQL Error\", e);\n```\n\n## 结论\n\n\n\n\n本章探讨了\
  \ Java 应用程序的基础数据库概念。它强调了关系数据库在现代 Java 应用中的作用，并强调了结构化数据如何支持可扩展且高效的数据管理。通过在线书店的场景，我们演示了如何设计数据库模式、使用\
  \ `SQL` 管理结构化数据，以及如何实现 CRUD 操作来处理常见的数据操作。\n\n本章还探讨了 Java 如何通过 `JDBC` 与数据库进行交互。我们还涵盖了优化查询性能、管理数据库连接以及处理错误和异常的最佳实践。现在，你应该能够构建利用数据库为用户提供持久化数据、无缝交互和可靠性能的\
  \ Java 应用程序。\n\n下一章将重点关注图形用户界面（GUI），它允许用户通过视觉方式与我们的应用程序交互。本章介绍了 `JavaFX`，这是 Java\
  \ 的现代 GUI 框架。章节解释了如何设置 `JavaFX` 以及使用场景图创建具有视觉吸引力的布局。章节还涵盖了用户事件的处理，在其中你将学习创建按钮和文本字段等控件，并绑定属性以增强应用程序的交互性。\n\
  \n## 要点\n\n- `ACID` 属性确保了可靠的事务管理。\n- 使用后务必关闭数据库连接，以防止资源泄露并维护性能。\n- 避免在查询中使用 `SELECT\
  \ *`；仅指定你需要的列以提高性能。\n- 批量操作应封装在事务中，以确保数据的完整性和一致性。\n- 连接池通过重用数据库连接来提高性能。\n- 关系数据库中的一致性确保数据保持准确并遵循定义的规则和约束。\n\
  - `CRUD` 操作是应用程序中使用的基础数据库交互。\n- 使用 `PRIMARY KEY`、`FOREIGN KEY`、`NOT NULL`、`UNIQUE`\
  \ 和 `CHECK` 等约束来强制数据完整性。\n- 数据持久化允许信息存储在应用程序运行之外，确保数据的长存性。\n- 禁用自动提交模式允许使用 `commit`\
  \ 和 `rollback` 进行手动事务控制。\n- 高效的错误处理包括捕捉特定的 `SQL` 异常并记录技术细节以供调试。\n- `FKs` 链接相关表并强制关系数据库中实体之间的引用完整性。\n\
  - 对经常搜索的列建立索引可以提高查询性能，特别是对于大型数据集。\n- `JDBC` 是将 Java 应用程序连接到关系数据库的标准 API。\n- 使用 `PreparedStatement`\
  \ 的参数化查询可以防止 SQL 注入并提高查询安全性。\n- `PreparedStatement` 允许预编译 `SQL` 查询，提高性能和安全性。\n-\
  \ `PKs` 唯一标识表中的每条记录，并在 `FK` 关系中作为引用。\n- 适当的事务管理确保相关的数据库操作要么全部成功，要么全部失败。\n- 关系数据库将数据组织成具有定义关系的结构化表，确保数据一致性。\n\
  - `ResultSet` 用于在 Java 数据库操作中存储和遍历查询结果。\n- `Rollback` 在发生错误时撤销事务期间的更改，维护数据库完整性。\n\
  - SQL 注入是一种关键的安全漏洞，可以通过使用参数化查询来防止。\n- `SQLite` 是一种轻量级嵌入式数据库，适用于中小型应用程序，不需要独立的服务器。\n\
  - `SQL` 用于通过 `SELECT`、`INSERT`、`UPDATE` 和 `DELETE` 等命令与关系数据库交互。\n- 事务将多个数据库操作组合为一个单元，确保原子性和一致性。\n\
  - 在 Java 中使用 `try-with-resources` 语句来自动关闭连接、语句和结果集。\n- 在表定义中使用 `CHECK` 约束确保数据遵循特定规则（例如\
  \ `quantity < 0`）。\n- 在数据库操作中使用 `PreparedStatement` 替代 `Statement` 可以同时提高安全性和性能。\n\
  - 高效使用 `ResultSet` 涉及使用 `while` 循环遍历行，并使用合适的 getter 方法检索数据。\n\n## 案例研究\n\n这些案例研究提供了真实的场景，鼓励你对\
  \ `JDBC` 和相关操作进行批判性思考：\n\n### Vulcan Ventures，库存管理系统\nVulcan Ventures 是一家在线销售高科技产品的初创公司。他们不断增长的库存需要一个健壮的数据库系统来管理产品列表、库存水平和供应商详情。Vulcan\
  \ Ventures 的开发团队使用 `SQLite` 构建了一个基于 Java 的库存管理系统。然而，他们在数据一致性方面面临挑战。偶尔，由于多个用户同时处理订单时发生并发更新，库存水平会变成负数。\n\
  \n- **请思考：** 你将如何重新设计库存更新过程以防止库存水平变为负数？你会应用哪些事务管理技术（例如 `ACID` 属性）？你将如何优化库存查找的查询，特别是针对高需求产品？\n\
  \n### Andorian Archives，数字图书馆程序\nAndorian Archives 提供了一个海量的数字图书馆，允许用户在线借阅和阅读书籍。该系统支持成千上万并发用户并持有数百万书籍记录。图书馆的搜索功能变得缓慢，特别是当用户按书名或作者搜索时。目前的\
  \ `SQL` 查询在整个书籍表上使用 `SELECT *` 而没有建立索引。用户还报告偶尔会出现重复的书籍条目。\n\n- **请思考：** 你将如何提高搜索性能并优化查询？你会实施什么样的索引策略来支持快速查找？如何强制执行数据完整性以防止重复书籍条目？\n\
  \n### Romulan Retail，电子商务平台\nRomulan Retail 是一个销售收藏品和稀有文物的电子商务网站。该平台支持在线购物车、用户个人资料和订单历史。最近的安全审核显示，该应用程序容易受到\
  \ `SQL` 注入攻击，特别是在登录页面。恶意用户已经能够通过登录表单中构造的输入绕过身份验证。\n\n- **请思考：** 你将如何重构登录功能以防止 SQL\
  \ 注入？你会应用哪些最佳实践来保护整个站的其他用户输入表单？如何能够实现正确的错误处理和日志记录以检测未来的注入尝试？\n\n### Betazoid Banking，金融交易系统\n\
  Betazoid Banking 提供数字银行服务，允许客户通过其 Java 平台进行转账、查看账单和管理账户。银行遇到了事务不完整的问题，即用户转了资金，但只有一个账户发生了更新。例如，发送方账户被扣款，但由于中途失败，接收方账户未增加。\n\
  \n- **请思考：** 你将如何使用事务管理来确保资金转账的原子性和一致性？你会采取哪些步骤在发生错误时实现正确的 `rollback`？如何记录失败的交易以支持调试和恢复？\n\
  \n### Ferengi Foods，在线订单系统\nFerengi Foods 是一家食物外送服务，允许用户从当地餐厅订餐。他们的平台跟踪订单、管理客户数据并处理支付。在高峰时段，客户报告订单未被正确记录。开发团队怀疑连接泄露导致数据库超时，从而导致事务丢失。\n\
  \n\n\n\n供你参考：你将如何实现连接池来高效管理数据库连接？你将使用哪些策略来确保所有连接在使用后都能被正确关闭？如何在在影响客户之前，监控并检测系统中的连接泄漏？\n\
  \n## 单选题\n\n1. 关于 `JDBC` 中的 `PreparedStatement`，以下陈述哪项是正确的？\n    1. 它通过对用户输入进行参数化自动防止\
  \ SQL 注入。\n    2. 它需要手动对用户输入进行转义以防止 SQL 注入。\n    3. 对于重复查询，它比使用 statement 的效率低。\n\
  \    4. 它只能执行 SELECT 查询。\n\n2. 在关系型数据库中，`FK` 的主要作用是什么？\n    1. 确保表内的数据保持唯一。\n  \
  \  2. 将一个表中的记录与另一个表中的相关记录链接起来。\n    3. 通过索引加速搜索查询。\n    4. 使列中的值自动递增。\n\n3. 下列哪项不是事务管理中\
  \ ACID 特性的一部分？\n    1. 原子性 (Atomic)\n    2. 一致性 (Consistent)\n    3. 持久性 (Durable)\n\
  \    4. 可扩展性 (Scalable)\n\n4. 连接池的主要目的是什么？\n    1. 避免使用 `JDBC` 驱动。\n    2. 允许同时访问多个数据库。\n\
  \    3. 重用现有的数据库连接。\n    4. 防止 SQL 注入攻击。\n\n5. 你使用哪种 SQL 命令从表中永久删除一条记录？\n    1.\
  \ UPDATE\n    2. DELETE\n    3. REMOVE\n    4. DROP\n\n### 答案\n\n| 1. | a. |\n|\
  \ 2. | b. |\n| 3. | d. |\n| 4. | c. |\n| 5. | b. |\n\n## 简答题\n\n1. 在 Java 程序的上下文中，为什么在处理用户输入时使用预\
