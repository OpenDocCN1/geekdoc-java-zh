    # 2.2.5 Constructor Summary


    +   - In Java, constructors are used to create new objects (instances of classes).


    +   - A constructor always has the same name as the class in which it is defined.


    +   - It does not have a return type, nor does it have void in its header.


    +   - It can have no parameters, or as many parameters as are needed.


    +   - A constructor method is always called with the new operator.


    +   - A constructor method can be overloaded, meaning that there can be more than
    one constructor method with the same name, as long as each constructor in the
    same class has a different quantity or type of parameters (i.e. the signatures
    of the overloaded methods will be all different).'
