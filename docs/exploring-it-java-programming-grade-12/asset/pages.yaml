    #  1.4.3 LEFT JOIN


    The LEFT JOIN returns all the rows from the first table, even if there are no
    matches in the second table. If no match is found, the records from the first
    table are still listed with null values for the fields in the second table.


    # Example 3


    List all employees and their orders - if any.


    ```

    SELECT Employees.Name, Orders.Product

    FROM Employees

    LEFT JOIN Orders

    ON Employees.Employee_ID=Orders.Employee_ID

    ```


    # Result


    | Name | Product |

    | Hansen, Ola | Printer |

    | Svensson, Tove | null |

    | Svensson, Stephen | Table |

    | Svensson, Stephen | Chair |

    | Pettersen, Kari | null |


    Tove Svensson and Kari Pettersen have not placed any orders. There is no match
    for these records in the Orders table. The LEFT JOIN includes all the records
    from the Employees table if no match is found and places null (a blank) in the
    Product column.


    The previous SQL statement can be changed to list the employees who have not placed
    any orders:


    ```

    SELECT Employees.Name, Orders.Product

    FROM Employees

    LEFT JOIN Orders

    ON Employees.Employee_ID=Orders.Employee_ID

    WHERE Orders.Product is null

    ```


    The last line checks if the Product field contains a null using the operator IS
    instead of the sign =

    LEFT JOINS can be replaced by a WHERE clause using NOT IN.


    ```

    SELECT Employees.Name, Orders.Product

    FROM Employees

    WHERE Employees.Employee_ID NOT IN

    (SELECT Orders.Employee_ID

    FROM Orders)

    ```'
