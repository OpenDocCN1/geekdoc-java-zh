  md: '# Exploring IT: Java Programming Grade 12


    # 2.5.3.1 Declaring as a Parent Type by Instantiating as a Child Type


    Recall the difference between an object''s declaration and its instantiation


    The following statement declares an object or reference variable of the Entry
    class with the identifier details:


    ```

    Entry details; null

    ```


    In memory, the variable will be initialized with null the default initial value
    given to all variables, unless otherwise specified. Note that the variable details
    is NOT an object and that this declaration statement does not refer to any object.
    It simplifies the type of object to which it can refer.


    The statement: details = new Entry (name, cell);


    In memory, the variable will be assigned the address of another location in memory
    at which the object is actually stored.


    instantiates an object of the Entry class, using the new operator, which actually
    creates the object, using the Entry constructor to assign values to the fields
