    # # Learning Unit 6 JSON Files and ArrayLists


    # ## 6.1 Introduction


    JavaScript Object Notation (JSON) is a platform-independent, human readable, text
    file used for transferring data. Currently, it is the standard format for the
    communication between web services and their clients (browsers, mobile applications,
    etc.). JSON files have become the data structure of the Internet. Even though
    JSON was derived from JavaScript, it can be used in most programming languages
    including Java, Python, Ruby, and many.


    The popularity of JSON resulted in its support by many databases, such as MySQL,
    which provide the ability to query the data stored in JSON fields. NoSQL databases,
    like MongoDB, were built upon this format and use JSON documents to store records,
    just as tables and rows store records in a relational database.


    ```

    https://attacomian.com/blog/java-read-write-json-files#

    https://stackoverflow.com/reading-and-writing-json-in-java/

    ```


    JSON is a generic data format that has six data types:


    +   1. Strings

    2. Numbers

    3. Booleans

    4. Arrays

    5. Objects

    6. null


    # ## 6.2 Reading from a Simple JSON File


    JSON files are processed using two data structures, namely objects and arrays:


    +   * A JSONObject is an unordered collection of name and value pairs.

    * A JSONArray is an ordered list of zero or more values.


