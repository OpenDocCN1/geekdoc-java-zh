  md: '# Exploring IT: Java Programming Grade 12


    In the contactArray, the elements are all declared as Entry objects, but each
    element can refer to either an Entry object or an EmailEntry object in memory.
    For example, the first 3 elements of the array in memory could be:


    ```

    ```

    contactArray

    | 0 | 1 | 2 |

    |---|---|--|

    | AddrX | AddrY | AddrZ |

    ```

    ```


    It is essential to understand that the parent or subclass and the subclasses form
    a hierarchy that goes from the more general class to more specific subclasses.


    When using inheritance, the subclasses need to be designed correctly, so that
    subclass type objects use all elements of the parent class, except for overridden
    methods. This subclasses the flexibility to define their own methods, while superclass
    common fields and methods that can be used by all subclasses.


    ![](img/86128095066e8dc60f919134196e1504_85_0.png)


    ![](img/86128095066e8dc60f919134196e1504_85_1.png)


    ![](img/86128095066e8dc60f919134196e1504_85_2.png)


    Polymorphism allows a more general parent class to contain methods that will be
    overridden by subclasses, each which define a more specific implementation of
    these methods.


    If an object has been declared as an object of the subclass but is instantiated
    by the subclass and the methods of the subclass need to be accessed, if it is
    unknown whether the object is a subclass or a subclass object, the instanceof
    operator can be used to determine the type of object.


