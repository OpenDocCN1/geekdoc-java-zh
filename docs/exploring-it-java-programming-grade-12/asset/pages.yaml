  md: '# # Learning Unit 5 Data Validation


    Continuing with the NetBeans project **BookProj**, we will need to allow the user
    to add and delete a book from the list of books stored in the array. To add a
    book, the user will need to input values for the title, author, fiction/non-fiction,
    ISBN and date fields. These fields will need to be validated before the book object
    is instantiated and added to the array. In **Unit 7 of Exploring IT: Theory Grade
    11** we listed the types of checks that can be to validate data. The parity check
    has been excluded as it is designed for transmission of bits on a network.


    | Check | Description | |

    | --- | --- | --- |

    | Presence | The data must exist. | A user number or ID must be present to match
    to a database record. |

    | Range | The data has a lower and upper bound. | The number of hours worked in
    a day by an employee may only be between 0 and 8. |

    | Uniqueness | No duplicates exist for the data. | A user name on a computer.
    There cannot be two with the same name; this usually involves a search algorithm
    check. |

    | Length | The data must be of a specific length. | A African ID number must consist
    of 13 characters. |

    | Type | The data must be of an appropriate type. | An age can be a number in
    the range 0 to 120, not a string "twenty". |

    | Format | The data requires an entry in a specific format. | Examples include
    date format, vehicle licence plates, ID numbers. |

    | Logical | The data is consistent with the scenario. | A delivery date cannot
    be earlier than an order date. |

    | Check Digit | A digit within the data must be a certain value. | In ISBN numbers,
    the last digit is a modulo calculation of the previous digits. |

    | Check Sum | Checksums are used to compare sets of data to ensure they are the
    same. The checksum can be calculated using a variety of algorithms. | A pair of
    text files that are very similar (maybe only differ by as 1 character) can be
    differentiated as their checksums will be different. |

    | Parity | Ensures accurate data transmission between nodes during network communication.
    | A parity bit is added to an even or odd bit number; the number of bits with
    one value. The source transmits this data via a link, and bits are checked and
    verified at the destination. |


    Data validation can be done in three ways:


    +   * using GUI components,

    * coding if statements to check the data,

    * try-catch statements.'
