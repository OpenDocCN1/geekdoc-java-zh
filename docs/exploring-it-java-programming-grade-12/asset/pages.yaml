  md: '# Exploring IT: Java Programming Grade 12


    # 7.5.2.2 Disadvantages of a Database


    +   - Cost. It is expensive to set up and maintain the database system. Specialised
    software needs to be purchased, the data needs to be entered and queries need
    to be designed.


    +   - Complexity. A database is complex. It needs to be designed to ensure that
    it is normalised with no anomalies. Accessing data across many tables requires
    complex SQL statements JOINS and a driver is needed if the database is accessed
    from a third-party application.


    +   - Hardware Performance. Complex queries require sophisticated processing power.
    Most desktop computers can process smaller and less complex databases; large and
    extremely complex databases may require more powerful servers to return results
    within an acceptable time.


    https://microsoft.com/limitations-relational-database-business-24159.html


    +   - Damage to the database will affect many applications. Since many programs
    will be used by the database, if the database is corrupted or damaged, all these
    programs will be affected.


    +   - Poor design makes it inflexible. If a database is badly designed, when more
    data is added the database could become inefficient as the database grows. All
    databases need to be designed with the vision that each table could hold millions
    of records and would be accessed by millions of queries.


    # 7.5.2.3 Comparing SQL Database toSQL Database


    SQL databases were discussed in Learning Unit 4 of Exploring IT: Theory 12.


    | Relational SQL Database | Non-Relational SQL Database |

    |--- |--- |

    | The schema is fixed and predefined. | The schema is dynamic and does not need
    to be predefined. |

    | Model based on a table. | Model based on a document. |

    | A large expert community is available. SQL is a standard language. | The community
    is small but growing. Lack of a standard query language. Dynamic schema is the
    key benefit of NoSQL. Rigid schema makes inflexible. Columns/fields cannot be
    added to tables without affecting the schema. | New columns/fields can be added
    without disturbing the design |


    https://www.educom.com/mysql-vs-nosql/


    # 7.5.2.4 Comparing Relational Database to Text Files


    Both files and databases are used permanently to store data in secondary storage.
    Most files store data as Comma Separated Values (CSV).


    | Relational SQL Database | Text Files |

    |--- |--- |

    | Data is well structured with no redundancy. | Data is not structured. |

    | Setting up the database is complex and requires additional software and possibly
    a database server. | Very easy to set up. |

    | Migrating the data is a complex process. | A text file can simply be copied
    and pasted. |

    | DBMS provides additional features to secure the data as back up, data validation,
    multi-user control and ensuring data integrity. | A text file has no built-in
    security. It is not designed to support multiple users. There is no DBMS to provide
    additional features. |

    | Database software can be costly, such as SQL Server, however some database software
    is open source and free of charge such as MySQL. | Text files are freely available
    as a feature of the operating system.'
