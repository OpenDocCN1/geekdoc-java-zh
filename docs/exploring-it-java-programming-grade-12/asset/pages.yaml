    # 5.13 NetBeans JAR files


    NetBeans creates an executable Archive file, called a jar file, for NetBeans projects.
    This jar file contains all the projects files, including classes, images, audio,
    etc. in a lossless compressed format.


    The jar file can be distributed and run on any computer that has the Java Run-Time
    Environment (JRE) installed on it. The path to the jar file for a NetBeans project
    is shown in the Output window when the projects is Build.


    To access the jar file which is created each time you build a project:


    +   - Select the Files tab and expand the dist folder.


    +   - The BookProj.jar file will be stored there as part of the distribution.


    +   - To check if this file will run on its own, browse to this file using


    your file browser as Windows Explorer and double click on the jar file. The program
    should run without NetBeans.


    Notice if you have created the APIs for the project, these docs will be stored
    in a javadoc folder together with the BookProj.jar file.


