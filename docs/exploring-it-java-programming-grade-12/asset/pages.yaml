  md: '# Exploring IT: Java Programming Grade 12


    # 8.3.3.6 VoterManager Class


    The VoterManager class will serve as the back-end manager. It will have an array
    of Candidate objects called caArr and a field size to record the number of objects
    in the Candidate array. There will be three public static fields: one for the
    database connection db of the DB class, a Person object called admin and a Voter
    object called will store the details of the user that is authenticated in the
    LogOnUI.


    The constructor of the VoterManager will instantiate the array of Candidates called
    caArr. There will be two accessor methods: getSize to return the size of the array
    and getCandidate to return a Candidate object given the position of the object
    in the array. The toString will return the array of Candidates as a String.


    ```

    + db = new DB()

    + admin : Person

    + voter : Voter

    + Candidate[] caArr = new Candidate[100]

    + size : integer

    + Candidate()

    + getSize() : integer

    + getCandidate(int n) : Candidate

    + toString() : string

    ```


    We will code the VoterManager class later.


    # 8.3.4 Secondary Storage Design


    # 8.3.4.1 Database Design


    In this scenario, we are going to use a database to store the details of the Candidates
    in tblCandidates, the Voters in tblVoters and the votes for each Candidate. There
    will be ID fields for both tblVoters and tblCandidates tables to serve as primary
    keys. A voter can only vote once for each candidate after they have logged on.
    An entry will be made in the tblVoting table.


    The relationship between tblCandidates and tblVoters is many-to-many so a tblVoting
    is needed with a concatenated primary key of IDVoter and IDCandidate. Each candidate
    will have a picture stored as an image file and the name of the file will be a
    combination of their firstName + "jpg".


    The help topic and description will be stored in the tblHelp.


    | Table: tblVoters | Table: tblCandidates | Table: tblHelp |

    |---|---|--|

    | IDVoter Text | IDCandidate Text | IDCandidate Text |

    | VUsername Text | CFirstName Text | Topic Text |

    | VfirstName Text | Surname Text | Description Text |

    | Username Text | Class Text | |

    | Class Text | CNoOfVotes Number | |

    | Password Text | | |


    | ACTIVITY 4 |


    +   - the Leaders database from http://www.funworks.co.za/FileDownloads.aspx either
    MS Access or MySQL. The Leaders database contains sample data to create a solution.


    # 8.3.4.2 Install the Leaders Database in MySQL


    +   - If you are using MySQL, in NetBeans, click on the + next to Drivers and
    right click on MySQL (Connector/J Driver).'
