  md: '# Exploring IT: Java Programming Grade 12


    # 7.5.1.3 Comparing JSON Files and Text Files


    In the previous Learning Unit, we used JSON files to store data permanently. Comma
    Separated Value (CSV) is a file that can store many fields on a line separated
    by commas (or another delimiter). The following table compares these two type
    of files.


    | JSON Files | CSV Files |

    | --- | --- |

    | Student Example: | Student Example: |

    | ```first name": "Fatima",

    "last name": "Habib",

    "date of birth": "2005-04-12",

    "boarder": false,

    "subjects": [84.3,78.4,79.9,65.7]``` | Fatima,Habib,2005-04-12,false,84.3,78.4,79.9,65.7
    |


    Data can be structured as an object or an array and is stored in value pairs.


    Data is unstructured.


    String and Date types are enclosed in quotes unlike Boolean and numeric data.


    The programmer interprets the data as a relevant type when reading from the file.


    Each object in the file can have many fields and the field is not ordered.


    The fields are listed in an order.


    JSON files can contain nested structures, such as an array within an object. Nested
    structures can be used to eliminate repeated data.


    CSV is not based on nested structures. Can be frequently repeated. If a CSV file
    is used to record a user''s log in activity, the username will be repeated each
    time the user logs on or off.


    JSON files are more readable because the values include a description of the data
    value.


    CSV merely list data separated by commas.


    JSON files are less compact than CSV files.


    CSV files take less bandwidth to transfer.


    External libraries are needed by Java to process JSON files.


    Text processing file libraries are part of standard Java.


    JSON files are language independent but are also supported by databases. For example,
    MySQL has JSON functions to manipulate JSON files directly.


    CSV are language independent files used to transfer between different applications.
    Data is exported to a CSV file from one application and imported to the next application.
    A database can be exported to a CSV file which will include CREATE TABLE statements
    and INSERT statements.


    > https://www.educba.com/json-vs-csv/


    # 7.5.2 Databases


    A relational database provides an effective manner of organising data logically
    so that it can be retrieved with SQL queries. Relational databases are often used
    when creating industrial standard efficient and scalable databases.


    They are based on structure of tables which are logically connected to each other
    and can be queried in complex way to extract relevant and meaningful information.
    The querying of a relational database is done using a high-level language called
    SQL. SQL is easy to understand and, unlike traditional programming languages,
    does not rely on arcane syntax, rather it is closer to English.


    > http://www.studymode.com/essays/Advantages-Of-A-Relational-Database-1054578.html'
