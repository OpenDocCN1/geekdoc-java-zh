    The Relationships between the tables linked by primary and foreign keys:


    ![](img/86128095066e8dc60f919134196e1504_14_0.png)


    Whenever there is a **primary key** in one table that links to a **foreign key**
    (a primary table) a relationship exists between the two tables and we can perform
    queries that make use of that relationship to combine data from both tables.


    The primary/foreign key relationships that exist in this database are:


    +   * **ActNum key in tblActs** links to the foreign key ActNum in tblEntrants;
    the relationship is **one-to-many**, where one act may have many entrants.

    * **ActNum key in tblActs** links to the foreign key ActNum in tblPoints; the
    relationship is one-to-one, meaning that one act has only one set of points.


    When there is a **one-to-one relationship** between **primary keys** of two tables,
    the **primary key** of each table is considered to be a **foreign key** in the
    other table.


    We are investigating many queries that use the primary/foreign key relationships
    between these tables. For example, there is no direct link between **tblEntrants**
    and **tblPoints**, but if we want to know how many points were attributed to an
    entrant? Simply use the fact that **tblEntrants** is linked to **tblActs** through
    the *primary/foreign key relationship* on **ActNum** in each table; then we link
    the primary/foreign keys **ActNum** between **tblActs** and **tblPoints** to create
    a relationship "path" from **tblEntrants** to **tblPoints**.


    ```

