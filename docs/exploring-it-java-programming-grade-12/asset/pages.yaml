    # 5.11 Adding Help to your GUI


    It is important to give users as much help as possible so they will be able to
    use your program efficiently and with little frustration. The more user-friendly
    your interface is, the fewer errors are likely to occur and the more the user
    will enjoy your product.


    # 5.11.1 Contextual Help


    The most effective help relates to the component with which the user is experiencing
    difficulty. A user is unlikely to wade through pages and pages of help files and
    will avoid doing so unless necessary. Help that can be displayed where the user
    needs it most. This can be done by adding Tool Tips which appear when the user
    hovers over a component. We can also add contextual help that can be activated
    when the user presses the <F1> key when a component is selected.


    # ACTIVITY 2


    A tool tip is descriptive text that appears over a component when the user pauses
    their mouse over a component.


    +   - Select the txtTitle Text Field by selecting the inputDialog component under
    the Other Components node in the inspector window.


    +   - In the properties window of the txtTitle Text Field scroll down to show
    the tooltip property. Enter the text "Enter the new name"


    +   - Build and run the project and check that a tool tip is displayed when the
    user''s mouse hovers over the txtTitle field.


    +   - Add tool tips for all the Text Fields and Buttons on the inputDialog.


    Another way to provide contextual help is when the user presses the <F1> key.
    The help displayed will relate to the component that the user has selected and
    is active. In the case of a Text field it will be focus as the cursor will be
    flashing in the Text Field. A Button is active when it is highlighted.


    This code using <F1> for help was designed by Carol Lewis of Hatfield Christian
    School, Pretoria.'
