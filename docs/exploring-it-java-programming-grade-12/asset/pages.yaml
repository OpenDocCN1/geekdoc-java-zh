  md: '# 7.3 Objects


    Objects combine data and their algorithms that act on the data in one container.
    Object-Oriented Programming (OOP) has become a dominant style of system design
    and programming when dealing with large problems, since the solution can be subdivided
    into independent objects which can be reused in other projects.


    Some programs/projects (we will use these terms interchangeably) do not lend themselves
    to objects and the overhead of creating an object is not beneficial. Objects should
    not be used in programming when:


    +   - the program is small or trivial,

    - the program will not be re-used in any way,

    - the program does not have any sections that are similar, and

    - the code does not need to be adapted in the future.


    Object Oriented Programming (OOP) is useful in the following situations:


    +   - the program is large and needs to be well organised,

    - the program needs to be flexible,

    - the program has a lot of repetition, and

    - the program will be re-used or have sections that will be re-used.


    # 7.3.1 Inheritance vs Composition


    Inheritance is when one class is derived from another and composition is when
    a class is a field of another class. An example of requiring inheritance was covered
    in section 3.1 in Learning Unit 3 and an example of a solution with composition
    was covered in section 3.4 in Learning Unit 3.


    With inheritance, classes and objects are tightly coupled. Any change in the parent
    or super class may adversely affect the child class. Classes and objects created
    through composition are loosely coupled; changes in one will not affect other
    objects as the internal workings of a class are hidden from class users. Inheritance
    and composition can be compared using a table:


    | Inheritance | Composition |

    | Less – changes in the superclass may affect inherited classes. | More flexible
    – information hiding, the internal workings of a class can change if the method
    signatures remain the same. |

    | Inheritance is suitable when the subclass is a specialised version of the subclass.
    For example, a cat is an animal, a manager is an employee. | Composition is suitable
    when one object has another object as a field. For example, a car has a battery,
    a car has a driver. |

    | The subclass is designed to use all methods in the superclass. | The object
    usually uses only some of the methods of the other class. |

    | A subclass can only inherit from one super class. | An object can have many
    objects as fields. |

    | A subclass can override a method in the superclass and Java will call the appropriate
    method. Overridden methods in the subclass can alter how a method functions in
    the superclass. | |'
