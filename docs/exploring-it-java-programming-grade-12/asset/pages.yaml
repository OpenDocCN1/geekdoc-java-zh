    \ + cellNo;\n}\npublic String toString() {\n```\n\nChange the call statement in\
    \ the toString method of the EmailEntry so that it also calls the addSpaces()\
    \ method in the Tools class.\n\n```\npublic String toString() {\n    String temp;\n\
    \    temp = super.toString();\n    temp = temp + Tools.addSpaces(getCellNo(),\
    \ 15) + email;\n    return temp;\n}\n```\n\nCompile and run the project to check\
    \ that it works.\n\n# 3.1.7 Protected Fields\n\nWhen a class inherits from another,\
    \ the fields in the superclass can be protected so they can be accessed from the\
    \ subclass. Protected methods and fields are available to subclasses and classes\
    \ within the same package. Private fields and methods are only available in the\
    \ class in which they are defined.\n\n# 3.1.8 Summary of Access Modifiers for\
    \ Fields and Methods\n\n| public | Accessible everywhere. |\n| private | Accessible\
    \ only in its own class. |\n| protected | Accessible by any subclass (in any package)\
    \ and by any other class in the same package. |\n\nIn general, fields of a class\
    \ are usually private, and methods are usually public, except for helper methods,\
    \ which are used by a public method and are called from the public method, therefore,\
    \ if they are in the same class, they can be private.\n\nThis gives rise to the\
    \ question: Why not all the fields of an object class protected instead of private,\
    \ so they can be directly accessed by subclasses?\n\nThe answer is that protected\
    \ access does not offer secure protection, for two reasons:\n\n+   1. Anyone can\
    \ create a subclass from an existing class and could there access and change values\
    \ in fields which could have dire consequences on applications using those.\n\n\
    +   2. In Java, all classes in the same package have access to protected fields,\
    \ whether they are subclasses or not."
