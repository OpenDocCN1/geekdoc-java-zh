    # 1.4 Using JOINS Instead of Compound WHERE Clauses


    # 1.4.1 The INNER JOIN


    An INNER JOIN connects tables where the primary key matches the foreign key in
    the related table. Only rows that meet the requirements are given in the results.
    Any records that do not have a matching key field to the primary key field will
    not be included.


    An INNER JOIN is the same as a join using the WHERE clause, although the syntax
    is quite different (logical, clear, but different). Both produce the same result.
    We are going to investigate the INNER JOIN by executing exactly the same queries
    as before replacing the WHERE clauses with INNER JOINS wherever possible.


    General form of an INNER JOIN statement:


    ```

    SELECT field1, field2, field3...

    FROM first_table

    INNER JOIN second_table

    ON first_table.keyfield = second_table.foreign_keyfield

    ```


