  md: "# Learning Unit 2 Inheritance\n\n# 2.1 Introduction\n\nIn Grade 11 we wrote\
    \ OOP programs where we defined our own classes, for example the Line class. We\
    \ then coded applications to instantiate objects using the Line class. Once we\
    \ had written applications which had instantiated objects from the Line class,\
    \ we could no longer alter the class interface by changing the fields or methods\
    \ of the class, as any changes in the Line class might affect applications that\
    \ use the class. If we want to safely add fields or edit methods of a class without\
    \ affecting applications that instantiate objects of the class, we can extend\
    \ the class by creating an inherited class. The inheriting class is a new child\
    \ class which is created from a parent class and is dependent on the original\
    \ parent class. In this Learning Unit, we will learn how to adapt existing classes\
    \ using inheritance.\n\n# 2.2 Extending the Gogga Class\n\n# 2.2.1 SquareGogga\
    \ Class\n\nMakeSquare uses two Gogga: bug and beetle. Each has to make its own\
    \ square. Much of the code in this program is repeated, as shown in bold.\n\n\
    ```\nimport *;\npublic class MakeSquare\n{\n    public static void main(String[]\
    \ args) {\n        Gogga bug = new Gogga();\n        bug.setLabel(\"bug\");\n\
    \        for (int loop = 1; loop <= 4 ; loop++) {\n            bug.move();\n \
    \           bug.move();\n            bug.move();\n            bug.turnLeft();\n\
    \        }\n\n        Gogga beetle = new Gogga();\n        beetle.setPosition(12,\
    \ 5);\n        beetle.setLabel(\"beetle\");\n        for (int loop = 1; loop <=\
    \ 4; loop++) {\n            beetle.move();\n            beetle.move();\n     \
    \       beetle.move();\n            beetle.turnLeft();\n        }\n    }\n   \
    \ // main method\n} MakeSquare2 class\n```\n\n> The code in both for loops is\
    \ virtually identical. The only difference is the object's name.\n\n![](img/86128095066e8dc60f919134196e1504_46_0.png)\n\
    \nGood programmers avoid repetition of code. We could teach the Gogga object how\
    \ to draw a square by creating a new class with a method to draw a square, using\
    \ the existing Gogga class and methods and variables that will be related to drawing\
    \ squares. The method to draw the square can be used by other objects as well\
    \ - not just bug and beetle which are defined in this class."
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Exploring IT: Java Programming Grade 12\n\nThe new class will be a child\
    \ of the Gogga class which means that any object instantiated from the new class\
    \ will be able to use the methods in the new class as well as methods in the Gogga\
    \ class. the new class will extend the Gogga class so that it inherit the public\
    \ fields and methods of the Gogga class.\n\nWhy not add the new method(s) to the\
    \ Gogga class? It is not good to change a base class which has been tried and\
    \ tested which may have many applications depending on it.\n\nWe will create a\
    \ class SquareGogga and will develop a method in this new class called SquareGogga.\n\
    \n# ACTIVITY 1\n\nCreate SquareGogga class which inherits from Gogga class.\n\n\
    Type in the code below.\n\n```\nimport it.*;\n\npublic class SquareGogga extends\
    \ Gogga {\n\n    public SquareGogga() {\n        super();\n    }\n\n    public\
    \ void makeSquare() {\n        for (int loop = 1; loop <= 4; loop++) {\n     \
    \       this.move();\n            this.move();\n            this.move();\n   \
    \         this.turnLeft();\n        }\n    }\n}\n```\n\nRemember to import the\
    \ class to use the Gogga class.\n\nThe new class called SquareGogga inherits from\
    \ the Gogga class using the extends keyword.\n\nObjects to be instantiated from\
    \ this new class, MUST HAVE a constructor method with the same name as the class.\n\
    \nThis super(); statement is used to tell Java to call the constructor of the\
    \ parent class Gogga() to assign initial values to any object created. All methods\
    \ of the Gogga class can also be used by SquareGogga objects. The parent class,\
    \ Gogga, is called the superclass.\n\nThe method called makeSquare() with a loop\
    \ to draw a square. Instead of using a specific object's name (like bug or beetle)\
    \ with the methods, the keyword this (implicit parameter) is used as a placeholder\
    \ when the method is defined. Then, any object of this class that calls this method\
    \ will have its identifier such substituted in place of this.\n\nNote that the\
    \ makeSquare() method is defined in public so that it is accessible outside the\
    \ class and it does not return a value.\n\nThe SquareGogga class contains the\
    \ definitions of methods that will be called from other classes.\n\n+   Save this\
