    # 2.4 Examples in which Inheritance is Suitable


    Inheritance is when there the relationship between two classes can be described
    with the words a The subclass is a specialisation of the superclass. For example,
    Salmon is a fish and SquareGogga is a Gogga. When two classes have many fields
    and methods in common, it is better to form a common super class that contains
    all the fields and methods.


    For example


    For another example of inheritance, consider a printer that has one paper tray
    and basic functionality of printing on one side of a page. A few years later,
    a better model of this printer is released. The new model has an extra paper tray,
    well as the capability of printing on both sides of a page. The existing functionality
    of the original printer has been inherited and retained in the new model, but
    the new model of the same printer has extra and improved features.


    In a similar way, an existing, more general Java class can be used as a base and
    built upon to create a class more suited to a specific purpose. Often, an existing
    class could be more useful for a particular solution if the class could have one
    or two extra fields and methods added to it. In addition, you may not have the
    source code of the existing class, so it is not possible to edit it and adapt
    it to your needs. Inheritance provides a very powerful solution to this.


    By extending an existing class, adding fields and/or methods over existing ones,
    a subclass can be created with a fraction of extra coding. The bonus is that all
    the code in the original class can be accepted as having tested and therefore
    should be reliable. It is always better to use existing, tried and tested code
    and then add to it, rather than to rewrite similar code from scratch.


    # 2.4.1 Computational Thinking


    Inheritance can be incorporated in the computational thinking process. A problem
    can be decomposed into separate sections, with the developer zooming into each
    section (abstracting the details by focusing on the one part) and decomposing
    the section, until each section becomes a manageable section of code (like a class).
    At any stage, an existing class exists that can solve a part of the problem, the
    class can be used. If the developer is aware of a class that is similar but does
    not exactly solve the problem (pattern recognition), inheritance can be used to
    extend the existing class and adapt it to achieve the desired solution.'
