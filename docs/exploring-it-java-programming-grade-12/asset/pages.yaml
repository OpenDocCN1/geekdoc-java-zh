  md: "# Learning Unit 4 User Interface Design with GUIs\n\nA Graphical Interface\
    \ (GUI) is a more intuitive interface for the user as opposed to a text-based\
    \ interface. The GUI provides components such as menus, buttons, drop down boxes\
    \ for the user to select entering potentially invalid text.\n\nIn this Unit, we\
    \ will create a project to store, search and sort a list of books. Each book has\
    \ a title, author, the type of book (fiction or non-fiction), ISBN number and\
    \ the date it was published. We will first create the back-end classes Book and\
    \ BookArray before moving onto the GUI.\n\n# 4.1 Creating the Book Class with\
    \ Static Constants\n\nIn the previous sections, all input and output has text-based.\
    \ In the following section, you will develop a GUI front-end for the Book Project.\n\
    \nYou can use NetBeans or any other IDE that supports GUI design.\n\nThe following\
    \ sections are based on NetBeans version 11 using Ant.\n\n| ACTIVITY 1 |\n\n+\
    \   Create a new project in NetBeans called BookProj.\nCreate a package in BookProj\
    \ using your name.\nRight click on the project name and select New... Java Class.\
    \ Name the class Book.\nAdd private fields to store the title, author, isbn number,\
    \ date published and the type of book. Include two public static constant fields\
    \ FICTION and NONFICTION with values of 1 and 2, respectively. These static constant\
    \ fields will be used throughout the project so that class users will not need\
    \ to remember the value 1 for FICTION books and 2 for NONFICTION books.\n\n```\n\
    private String title;\nprivate String author;\nprivate String isbn;\nprivate LocalDate\
    \ date;\nprivate int type;\npublic static final int FICTION = 1;\npublic static\
    \ final int NONFICTION = 2;\n```\n\nCode a constructor to assign values to the\
    \ first five fields. To aid the user, convert the author's text to upper case\
    \ so that the author can be easily found among the book's details.\n\nThe date\
    \ will be a LocalDate type in the format dd-MM-yyyy which is assigned to the date\
    \ field. The type field will store a 1 or 2 depending on whether the book is fiction\
    \ or non-fiction.\n\n```\npublic Book(String t, String a, String i, LocalDate\
    \ d, int tp)\n{\n    title = t;\n    author = a.toUpperCase();\n    isbn = i;\n\
    \    date = d;\n    type = tp;\n}\n```"
