  md: '# 7.5 Secondary Storage


    Data structures mostly refer to data in primary storage but can also extend to
    secondary storage. Data is represented in primary memory using variables, arrays
    and objects while secondary storage could be text files, JSON files or a database.


    When a program executes, data is loaded from secondary storage to primary memory.
    A programmer needs to determine how the data will be permanently stored (in secondary
    storage) and how it will be stored in primary memory (RAM) when the program is
    running.


    Any data that is changed in RAM, needs to be written (synchronised) to permanent
    storage if the changed data is needed once the program has run.


    # 7.5.1 Text Files


    A text file is a computer file that is structured as a sequence of lines of electronic
    text. The end of a text file is often denoted by one or more special characters,
    known as an end-of-file marker, after the last line in a text file.


    http://en.wikipedia.org/wiki/Computer_file_system


    Text files can be created as output while the program is running and can be used
    as input for a program. In Grade 11 we used text files where each line stored
    the data for the fields of an object separated by a delimiter such as a # although
    commas can be used as a separator.


    ```

    144, uhler,Donald, deonton, NE, 62322,

    300, Mary, North Platte, NE, 67854,

    691, Seth, Tom, York, NE, 68503,

    692, Flanagan, Jim, Lincoln, NE, 62322,

    696, Good, Bob, North Bend, NE, 68942,

    697, Brown, Mary, Grand Island, NE, 64334,

    698, Metric, Omaha, NE, 64423,

    699, Stuckey, Lana, Seward, NE, 64424,

    700, Smith, Joseph, Central City, NE, 64223,

    701, Johnston, Mary, Benton, NE, 64422,

    859, Luebbe, John, Yutan, NE, 63322,

    987, Keseke, Beverly, Omaha, NE, 61234,

    ```


    http://www.googlewherefmt.com/assets/images/delimited_text_read.png


    # 7.5.1.1 Advantages of Using Text Files


    +   - Text files are simple to use and ideal to store small amounts of data; like
    the high scores of a user or their passwords (which should be encrypted).


    +   - They can be used to import and export data between different types of applications.
    They can be considered as the lowest common denominator for transferring data.
    Most applications will use Comma Separated Value (CSV) format.


    +   - They do not need any software to be installed. The operating system will
    provide support for text files as they are commonly used.


    # 7.5.1.2 Disadvantages of Text Files


    +   - They are usually stored on the user''s computer and are designed to be shared
    by many users.


    +   - There is no additional functionality such as backing up, restoring and archiving.


    +   - Any manipulation of the text file seeking and sorting must be written by
    a programmer.


    +   - Text files are not secure. Anyone who has access to the text file can open
    a text file.


    +   - Data may be redundant and badly organised.'
