  md: '# ACTIVITY 7


    One of the first queries that we performed to link two tables was similar to:


    ```

    SELECT Surname, FirstName, ActName

    FROM tblEntrants, tblActs

    WHERE tblEntrants.ActNum = tblActs.ActNum

    ```


    Change the query to the following and run it to check that the outcome is the
    same:


    ```

    SELECT Surname, FirstName

    FROM

    tblEntrants

    INNER JOIN tblActs

    ON tblEntrants.ActNum = tblActs.ActNum

    ```


    Notice that there is no longer a WHERE clause that links the primary/foreign keys.
    The ON keyword precedes the link.


    A later query that linked all three tables:


    ```

    SELECT Surname, FirstName, ActName, Jugel, Judge2, Judge3

    FROM tblEntrants, tblPoints

    WHERE tblActs.ActNum = tblEntrants.ActNum

    AND tblActs.ActNum = tblPoints.ActNum

    ```


    When you link more than two tables, the second table is replaced by a virtual
    table enclosed in brackets.


    ```

    SELECT field1, field2, field3,

    FROM first_table

    INNER JOIN (virtual_table)

    ON first_table.keyfield = second_table.foreign_keyfield

    ```


    The virtual table is a table produced by joining the second and third table.


    ```

    (tblActs

    INNER JOIN

    tblPoints

    ON tblActs.ActNum = tblPoints.ActNum)

    ```


    Type in the following query to join three tables using a nested join:


    ```

    SELECT Surname, FirstName, Act Name, Jugel, Judge2, Judge3

    FROM tblEntrants

    INNER JOIN

    (tblActs

    INNER JOIN

    tblPoints

    ON tblActs.ActNum = tblPoints.ActNum)

