  md: '# Exploring IT: Java Programming Grade 12


    Open the database HomeDecor.mdb and perform the following query:


    SELECT SUM(Quantity) AS TotalNumberOfPurchases

    FROM tblvoices


    If you have not performed any updates (INSERT, UPDATE or DELETE) on this database,
    then the total number of items sold should be 642.


    We want to display the salesperson (in tblSalesPeople, field SPName) and the quantity
    (in tblvoices, aggregate SUM(Quantity)) they have sold.


    Note: we want to know the total (SUM) of items sold, not the number of times (COUNT)
    the salesperson performed a sale. Also, we want to return results for each salesperson,
    a GROUP BY would need to be included.


    Some of the query is easy to code:


    ```

    SELECT SPName, SUM(Quantity) AS TotalItemsSold

    FROM ???

    WHERE ???

    GROUP BY SPName

    ```


    To replace the "???" items in the query, we need to establish the relationships
    between the tables.


    Looking at the structures of the relationships between the tables, it is clear
    that there is no direct relationship between tblSalesPeople (for SPName) and tblvoices
    (for Quantity), so we will have to use any of other relationships to get the Required
    Result Set for the query.


    | tblSalesPeople | tblClients | tblvoices | tblitems |

    |---|---|---|---|

    | SPID | clientID | ItemID | itemID |

    | SPName | clientName | Quantity | itemDescription |

    | SPPhone | SPID | InvoiceDate | itemCategory itemCostPrice |


    Looking at the relationships, you can see:


    +   - tblSalesPeople relates to tblClients on tblSalesPeople SPID = tblClients
    SPID

    - tblClients relates to tblvoices on tblClients clientID = tblvoices clientID

    - tblvoices relates to tblitems on tblvoices itemID = tblitems.itemID.


    Note to retrieve data from tblvoices and tblSalesPeople we will have to use tblClients.
    We will need to use three tables which will be listed in the FROM clause of the
    SQL statement.


    ```

    SELECT SPName, SUM(Quantity) AS TotalItemsSold

    FROM tblClients, tblvoices, tblSalesPeople

    WHERE tblSalesPeople.SPID = tblClients.SPID

    AND tblClients.clientID = tblvoices.clientID

    GROUP BY SPName

    ```


    The WHERE clause must specify how to link the tables together by using a compound
    AND that describes the relationships.'
