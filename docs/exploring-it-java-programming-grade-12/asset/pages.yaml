  md: "# 3.2 Polymorphism and Dynamic Method Lookup\n\nConsider again what takes place\
    \ when the output statement System.out.println(cl); in the ContextList executed.\
    \ The System statement automatically calls the toString() method, but how does\
    \ the Java compiler know whether to use the toString() method of the Entry class\
    \ or the toString() method of the EmailEntry class?\n\nEntry\n- name : string\n\
    - cellNO : string\n+ Constructor(n:string, c:string)\n+ getName() : string\n+\
    \ getCellNo() : string\n+ setName(n:string)\n+ setCellNo(c:string)\n+ toString()\
    \ : string\n\n```\nprivate Entry[] array = new Entry[100];\nprivate int size =\
    \ 0;\nif (sc.hasNext()) {\n    email = sc.next();\n    contactArray[size] = new\
    \ EmailEntry(\n        name, cell, email);\n} else {\n    contactArray[size] =\
    \ new Entry(\n        name, cell);\n}\nsize++;\n```\n\nThe array elements are\
    \ all declared as type Entry.\n\nWhen the above condition is true, it means that\
    \ a third data value exists, for example: Sipho an EmailEntry object is instantiated\
    \ using the constructor of the Entry class.\n\nEmailEntry\n- email : string\n\
    + Constructor(n:string, c:string)\n+ getEmail() : string\n+ setEmail(e:string)\n\
    + toString() : string\n\nIf the condition is false, with no value for the email\
    \ address, for example: Susanna@0721245678 an Entry object is created using the\
    \ constructor of the Entry class.\n\nWhen an output statement as System.out.println(entry);\
    \ is executed, the method of the class from which the object was instantiated\
    \ is called to display the object - either EmailEntry or Entry.\n\nThe appropriate\
    \ toString() method is invoked at runtime, depending on the class that the object\
    \ has been instantiated from. This process is called dynamic method lookup.\n\n\
    Polymorphism is the ability of an object declared as a subclass to be instantiated\
    \ as an object of the super or subclass in an inheritance hierarchy using the\
    \ relevant constructor. The object can call overridden methods with the same name,\
    \ according to object's class. The programmer does not have to know the exact\
    \ type of the object in advance, so this behaviour can be implemented at runtime\
    \ (this is called dynamic binding).\n\nBecause a subclass reference variable can\
    \ refer to a subclass object, Java determines which version of an overridden method\
    \ to use, based on the class from which the object was instantiated. In other\
    \ words, it is the type (or class) of the instantiated object not the declaration\
    \ type that determines which version of an overridden method will be used.\n\n\
    > http://en.wikipedia.org/wiki/Polymorphism_in_object-oriented_programming"
