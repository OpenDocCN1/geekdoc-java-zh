    In this activity we will write code to create a Student.JSON file to store the
    details of an IT student at a boarding school. You may need to add in the HTML5
    plugin in NetBeans by selecting Tools | Plugins and searching HTML5 from the Available
    Plugins. Select the plugin and click Install.


    # ACTIVITY 1


    +   * Open NetBeans and create a new project called JSONProj.

    * Create a package using your surname.


    Learning Unit 6 JSON Files and ArrayLists


