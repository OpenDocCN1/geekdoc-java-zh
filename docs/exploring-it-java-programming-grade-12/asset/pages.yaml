  md: 'Exploring IT: Java Programming Grade 12


    # 2.2.6 The Inheritance Relationship


    A new class that extends an existing class and adds functionality to the class
    is using the powerful OOP characteristic called inheritance.


    Think of it as you knowing more than your parents. You have inherited more of
    your parent''s attitudes and knowledge, but you have more to add, such as your
    knowledge of new social media apps and music styles.


    Inheritance is very powerful as it leads to reuse of code. We do not have to reinvent
    the wheel; we can use previously written code and add or adapt it for the current
    program''s needs. It is also important as the code that is being extended usually
    has been used and tested. This generally leads to more reliable code.


    ![](img/86128095066e8dc60f919134196e1504_53_0.png)


    A class in Java can only extend one other class i.e. can have only one immediate
    superclass, although an inheritance hierarchy usually exists, because all classes
    inherit from the Object class. Classes higher up in the hierarchy are more general,
    while classes lower down in the hierarchy are more specialised, as they are customised
    to provide more specific properties and behaviours.


    The inheritance hierarchy can be represented in UML notation with an upwards open
    arrow.


    All classes ultimately inherit from the Object superclass.


    ![](img/86128095066e8dc60f919134196e1504_53_1.png)


    Page 42


    Learning Unit 2 Inheritance'
