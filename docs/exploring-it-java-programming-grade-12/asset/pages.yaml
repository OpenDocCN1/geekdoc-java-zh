  md: "# Static Arrays\n\n# Dynamic Arrays\n\nThe maximum size of an array is declared\
    \ when the array is created and cannot change.\n\nA dynamic array is declared\
    \ without the number of elements.\n\n```\nint numArr[] = new int[5];\n```\n\n\
    ```\nArrayList<Double> aveArr;\n```\n\nIf we are unsure how many elements will\
    \ be needed in a static array, we use a variable size to record the number of\
    \ elements in the array, and make the static array arbitrarily large to accommodate\
    \ possible elements.\n\nA dynamic array can grow and contract, as necessary.\n\
    \n```\nStudent studArr[] = new Student[100];\nsize;\n```\n\nAn element of the\
