    | ... |


    A total of 1316 records were generated in the Result Set which is Cartesian product
    of the number of records in the tblEntrants table (47) and the tblActs table (28).


    This is known as a Cartesian Product, WHERE EVERY row in one table "maps" to EVERY
    row in another table. As can be seen 47x28 rows produces 1316 rows.


    A Cartesian product occurs when the query is not given any specific criteria on
    HOW to match the data in one table to the other. By specifying how to join the
    two tables, we can reduce the number of rows and only match rows that are using
    linked common fields.'
