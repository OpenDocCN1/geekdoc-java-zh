  md: '# 8.3.3 Class Diagrams


    The class diagrams are the primary storage for the data stored in memory while
    the program is running. This includes the objects and arrays of objects that store
    the Voter''s, Administrator''s and Candidate''s details.


    Remember that a class is a representation of an object. Each class is composed
    of three sections: **name; fields; methods** (including constructors) with parameters
    and return data types. Class hierarchies must be indicated.


    # 8.3.3.1 Voter, Candidate and Administrator Class


    The objects in memory are going to mirror the records in the tables that store
    the details of a Voter, Administrator and Candidates permanently. For example,
    the table *Voters* stores the ID, username, surname, password and register class.
    We will create a **Voter** class to store the ID, first name, surname and password.
    The Voter object will be instantiated after the Voter has been identified, hence
    we will need to store the username. We will store the password since the field
    Voter could change their password as a function. A **Candidate** object will have
    an ID, first name, surname, register class and their number of votes. An **Administrator**
    object will store the ID, username, first name, surname and password.


    To demonstrate how a text file could be used as opposed to a database for secondary
    storage, the details of the Administrators will be stored in a text file. Generally,
    secondary storage should either be a database or a text file and not a combination
    of unless otherwise dictated by the scenario.


    We will not be able to change the ID fields, so there will be no mutator methods
    for the ID fields. Similarly, for simplicity sake we will not allow the passwords
    to be accessed or changed requiring no accessor or mutator methods for the passwords
    fields. (This feature could be added in a future version).


    | Voter | Candidate | Administrator |

    | :--- | :--- | :--- |

    | - vid : string | - cid : string | - aid : string |

    | - vname : string | cName : string | aName : string |

    | - vsurname : string | - cSurname : string | aSurname : string |

    | - vpassword : string | - cclass : string | aPassword : string |

    | - vclass : string | - noVotes : integer | |

    | + Constructor | + Constructor (ID : | + Constructor (ID : |

    | ID : string, vn : | string, cn, cs : | string, n, m, s |

    | string, sw, pw : string | string, cs : | string, pw : |

    | string, vc : string | inv : integer | |

    | + getID() : string | + getID() : string | + getAID() : string |

    | + getName() : string | + getName() : string | + getName() : string |

    | getSurname() : string | + getSurname() : string | + getSurn() : string |

    | + toString() : string | + toString() : string | + toString() : string |


    Since the ID, first name, surname and password are common to the **Voter** class,
    the **Candidate** class and the **Administrator** class we can use inheritance
    to simplify the class design. The common fields (ID, first name, surname and password)
    can be placed in a Person superclass. The **Voter** subclass will inherit from
    the **Person** class with an additional register class field, and the **Candidate**
    subclass will inherit from the **Person** class with an additional number of votes
    field. A **Candidate** will not have a password, so we can set this field to a
    null or an empty string. An Administrator class is not required as it can be replaced
    by the superclass **Person**.'
