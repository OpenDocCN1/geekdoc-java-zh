    HAVING tblClients.clientName = ''Mr A Moosajee''

    ```


    and you will see that Mr Moosajee has the correct total of 81879.


    Remove the HAVING clause to find the GrandTotal for all.


    If you notice, the name of the field itemPrice indicates that it stores the cost
    of the item and the selling price of the item. If item is increased by 35% to
    50% to get the selling price then we would have the correct result.


    Change the query to multiply the itemPrice field by 1.35 to add 35% to the itemPrice.


    ```

    SELECT clientName, SUM(itemCost * 1.35 * Quantity) AS TotalSpend

    FROM tblClients, tblItems, tblInvoices

    WHERE tblClients.clientID = tblInvoices.clientID

    AND tblInvoices.itemId = tblItems.itemId

    GROUP BY clientName;

    ```


    We could list the clients from highest to lowest order of total spent.


    Simply add an ORDER to the query:


    ```

    SELECT clientName, SUM(itemCost * 1.35 * Quantity) AS TotalSpend

    FROM tblClients, tblItems, tblInvoices

    WHERE tblClients.clientID = tblInvoices.clientID

    AND tblInvoices.itemId = tblItems.itemId

    GROUP BY clientName;

    ORDER BY SUM(itemCost * 1.35 * Quantity) DESC

    ```


    Remember in MS Access, if you want to ORDER BY a derived field or aggregate function,
    you must include the complete code of the derived field or aggregate function
    as it was stated in the SELECT clause (unless you use an alias (AS) in an ORDER
    BY clause).


    If we want results for a total spend of >= R100 000.00?


    Add a HAVING clause to relate the aggregate:


    ```

    SELECT clientName, SUM(itemCost * 1.35 * Quantity) AS TotalSpend

    FROM tblClients, tblItems, tblInvoices

    WHERE tblClients.clientID = tblInvoices.clientID

    AND tblInvoices.itemId = tblItems.itemId

    GROUP BY clientName

    HAVING SUM(itemCost * Quantity) >= 100000

    ORDER BY SUM(itemCost * Quantity) DESC

    ```


    and only for purchases of "Interior" items?


    Add another condition to the WHERE clause:


    ```

    SELECT clientName, SUM(itemCost * Quantity) AS TotalSpend

    FROM tblClients, tblInvoices

    WHERE clientID = clientID AND itemId = itemID

    AND itemCategory = "Interior"

    GROUP BY clientName

    HAVING SUM(itemCost * Quantity) >= 100000

    ORDER BY SUM(itemCost * Quantity) DESC

    ```'
