  md: "# Organising and Reducing Code\n\nInstead of declaring 100 separate variables\
    \ to store 100 numbers, an array of 100 elements can be declared. A loop can be\
    \ used to process the array drastically reducing the code. For example:\n\n```\n\
    int numArr[] = new int[100];\n\nfor (int i = 0; i < numArr.length; i++)\n    numArr[i]\
    \ = Integer.parseInt(JOptionPane.showDialog(\n        (\"Number \" + (i + 1) +\
    \ \"));\n\nfor (int i = 0; i < numArr.length; i++)\n    System.out.println(\"\
    Number \" + (i + 1) + \" is \" + numArr[i]);\n```\n\nThe advantage of this solution\
    \ is that it can be easily scaled to deal with more than 100 numbers. In Java,\
    \ the length field of the array class defines the number of elements in the array\
    \ in which this case is 100. To increase the number of elements in the array,\
    \ only the 100 has to be changed in the array declaration.\n\n# Array of Primitive\
    \ and Object Types\n\nAn array can combine primitive types as well as objects.\
    \ Arrays can also be two dimensional.\n\n```\nint numArr[] = new int[100];\nFriend\
    \ friendArr[] = new Friend[100];\nprivate int tdArr[][][] = new int[10][10];\n\
    ```\n\n# Arrays Can Store a Sequence of Values\n\nString daysOfWeek[] = {\"Monday\"\
    , \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\"\
    };\n\nThis is useful for a series of values to use as constants (days, months,\
    \ colours, grades, etc.). Each value is related to its position in the array,\
    \ using the index, providing an order to the values. For example, daysOfWeek[2]\
    \ = \"Wednesday\" and 2 is less than 3, \"Tuesday\" is before \"Wednesday\".\n\
    \n# Algorithms Relating to Arrays\n\nCertain problems cannot be solved without\
    \ an array data structure. Some of these are:\n\n+   - reading in a set of elements\
    \ and displaying them in reverse order,\n- determining which number is above (or\
    \ below) average in a set of numbers,\n- searching for an item in a set of items,\n\
    - sorting a set of elements.\n\n# 7.2.2.2 Compare Static and Dynamic Arrays\n\n\
    In programming terms, static means fixed while dynamic means the ability to change.\
    \ There are many dynamic arrays provided in Java such as ArrayList, Vector and\
    \ LinkedList. We will use ArrayLists as an example of dynamic arrays.\n\nNote\
    \ that your Grade 12 exam may not allow the use of dynamic arrays in practical\
    \ examinations.\n\nLearning Unit 7 Data Structures and Algorithms"
