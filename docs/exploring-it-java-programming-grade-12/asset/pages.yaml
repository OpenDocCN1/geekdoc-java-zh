  md: '# Advantages of a Relational Database


    Data is only stored once (no data redundancy). As a result of normalisation, anomalies
    such as update, insert and delete should not occur when manipulating the data
    in the database.


    ![](img/86128095066e8dc60f919134196e1504_160_0.png)


    +   - Complex queries can be carried out across multiple tables.

    - Better control and security. By splitting data into tables, certain tables can
    be restricted to users who are not authorised to view.


    +   - Databases are managed by a Database Management System (DBMS) which is a
    software system designed to allow the definition, creation, querying, update and
    administration of databases. The DBMS will manage the security, backups, accesses
    and creation of data in the database.


    +   - Data Integrity. DBMS provides validation rules to reject incorrect data
    such as invalid dates and data that is outside the range of allowable values.


    +   - Referential Integrity. The DBMS ensures that no record can refer to another
    record that does not exist.


    +   - Concurrency Control. A database is a multiuser software system, meaning
    that many user applications access a database at the same time. Therefore, each
    database system must have a control mechanism to ensure that if several applications
    try to update the same data at the same time, do so in a controlled way. For example:


    +   - The owners of bank account 4711 at bank X have an account balance of R2
    000.

    - The two owners of this bank account, As and Mr B, go to two different bank tellers
    and each withdraw R1,000 at the same time.

    - After these transactions, the amount of money in bank account 4711 is R0 and
    not R1,000.


    The DBMS must have the necessary mechanisms to handle these kind of cases.


    +   - Backup and Recovery. A database system must have a subsystem that is responsible
    for recovery from hardware or software errors. An audit trail should be used to
    record all transactions.


    +   - Database Security. The most important database security concepts are authentication
    and authorisation. Authentication is the process of validating user credentials
    to prevent unauthorised users from using a system. Authorisation is the process
    that is applied after the identity of a user is authenticated when the system
    determines what resources the particular user can use.'
