    # 8.6 Testing


    # 8.6.1 Evaluate the Solution


    Discuss the strengths and weaknesses of the solution. Include possible improvements
    for the solution. For example:


    # 8.6.1.1 Strengths


    +   - The solution provides a user-friendly GUI that complies with most of the
    principles of good GUI design.

    - The solutions can manage many voters and candidates.

    - The solution accurately calculates the votes for a candidate as specified.


    # 8.6.1.2 Weaknesses


    +   - The system does not check if the voter has voted for a candidate before.

    - There could be more help topics.


    # 8.6.1.3 Improvements


    +   - The tabs could be made invisible depending on the type of user that has
    logged on. The Voter and Administrator should only be able to see the tabs relevant
    to them.

    - There should be a feature for the user to load images using a File Picker instead
    of expecting the user to paste images to the correct folder.

    - Once voting has been completed, the voting session should be closed with the
    records in the tables tblCandidates, tblVoters and tblVoting.

    - A list of Voters and Candidates could be imported from a CSV file saved to the
    database.

    - The database and text files could be stored on a central server with multiple
    desktop applications connecting to the server''s secondary storage to allow for
    many users to vote at the same time.


