  md: '# Exploring IT: Java Programming Grade 12


    # 5.1 Analysing the Data Validation Required


    We can analyse the data to input, select an appropriate component and choose the
    data validation rules to be applied.


    | Field | Type | Component | Data Validation |

    | --- | --- | --- | --- |

    | Title | String | Text Field | Presence check – a book must have a title. Length
    check – the title must be at least 1 character. Type check – the title can be
    letters, numbers, spaces and punctuation. |

    | Author First Name | String | Text Field | Presence check – the author must have
    a first name. Length check – the first name must be a least 1 character. Type
    check – the title can consist of letters, punctuation and spaces. |

    | Author Surname | String | Text Field | Presence check – the author must have
    a surname. Length check – the surname must be a least 1 character. Type check
    – the title can consist of letters, numbers and spaces. |

    | Fiction / Non-fiction | Integer | Radio Button | The book can be fiction or
    non-fiction, the user can select either option. Only one option must be selected.
    |

    | ISBN | String | Text Field | Presence check – a book must have an ISBN number.
    Length check – an ISBN number can be 10 or 13 characters. Type check – an ISBN
    can only consist of numbers after spaces or/ hyphens are removed. Check digit
    – an ISBN''s last digit is a check digit using a 10 algorithm or a 13 digital
    algorithm. |

