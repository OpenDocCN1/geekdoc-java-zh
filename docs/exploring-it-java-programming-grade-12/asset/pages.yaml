  md: '# # Learning Unit 3 Arrays of Inherited Objects


    You will need to have completed all activities with the Entry and EmailEntry classes
    from Learning Unit 2 before you can continue with this Learning Unit.


    # ## 3.1 Creating and Using an Array of Inherited Objects


    In the previous Learning Unit, we developed the Entry class to store a person''s
    name and cell phone number. The EmailEntry class inherited these fields and methods
    and added an email address field for people who have cell phones as well as email
    addresses.


    We want to import many entries for a contact list and manipulate the data by sorting
    and searching for entries. Some of the entries are objects of the Entry class
    and have email addresses, so they are from the EmailEntry class.


    We know that we need an array to perform sorts and searches, but the array needs
    to be of both Entry and EmailEntry objects. The following example use a text file
    with several entries. The program will read the data from the text file, instantiate
    an array of inherited objects, sort the array alphabetically and search for an
    object.


    The only real changes from the usual array of objects will be in reading the data
    from the file, instantiating the object, depending on the data. The code for sorting
    and searching is the same as for any array of a single type of object.


    Java happily deals different types of objects in the same inheritance hierarchy
    and knows which methods to apply when they are. For example, if you have an object
    of the EmailEntry class and you wish to use the name field, you would use the
    method getName(), but getName() is not in the EmailEntry class. Java looks up
    the inheritance hierarchy until it finds a match for the getName() method. It
    will then use the getName() method in the Entry class for the EmailEntry object.


