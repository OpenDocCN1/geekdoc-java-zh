  md: '# 4.3 Creating a GUI


    In Exploring IT: Theory Grade 10, we examined Command Line Interfaces (CLI) and
    Graphical User Interfaces (GUI). In BookProj, the user interacts with the system
    by typing text using the front-end class TextBox. Text input is susceptible to
    input errors and requires extensive validation to ensure the input is correct.
    A GUI provides a more structured form of input where the user is required to interact
    with the system using components. For example, a radio button can be used to choose
    certain options, check boxes for multiple options, menus to move between subsections
    of the system, and buttons to initiate an action.


    # 4.3.1 Rules for User Interface Design


    User interface design was covered in Exploring IT: Theory Grade 10 and focused
    on the consistency, readability, layout, typography or use of colour usually embodied
    in a theme.


    # 4.3.1.1 Readability


    +   - Reduce the number of elements on the screen.

    - Place elements in locations that make them easy to see, recognise and use.

    - Use recognisable icons.


    # 4.3.1.2 Navigation


    +   - The "three-click rule" should be applied to any web site design.

    - Use menu bars with a similar layout to move between screens.


    # 4.3.1.3 Typography/Colour


    +   - Ensure your fonts are readable and will be available on all computers.

    - Use dark fonts on light background or light fonts on a dark background.

    - Use conventional colours. Red is usually associated with danger, yellow is associated
    with caution and green with safety.

    - Limit the colours to at three with highlights or variations in shade.


    # 4.3.1.4 Layout


    +   - Keep the layout simple.

    - Place the most important part of the screen where a user is likely to look.

    - Use colour, fonts and images to draw the user to important sections.


    # 4.3.1.5 Theme


    +   - All the screens must have a consistent look and feel with the same colours,
    menus and other components on each page.


    # 4.3.1.6 Consistency


    +   - Screen elements must behave the same.

    - Screen elements should have consistent colour, design and the position on the
    screen.

    - Screen elements that behave differently should look different.


    In the following activities, we will create a GUI for BookProj using any interface
    design principles as possible.'
