  md: "# Project Properties - LeadersProj\n\nCategories:\n\n| Sources | Java Platform:\
    \ JDK 12 (Default) | Manage Platforms... |\n| :--- | :--- | :--- |\n| Libraries\
    \ | | Browse... |\n| Build | Libraries Folder: |\n| Compiling | Processor Run\
