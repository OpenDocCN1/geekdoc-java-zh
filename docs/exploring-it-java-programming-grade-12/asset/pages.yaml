  md: '# # Learning Unit 1 Advanced SQL


    # ## 1.1 Introduction


    In Grade 11 we applied SQL queries to databases using SELECT, INSERT, UPDATE and
    DELETE but the SELECT queries were restricted to a single table. A vast number
    of interesting and relevant queries can be applied using multiple tables in the
    same query.


    # ## 1.2 General Form of SQL Select Statement


    A SQL statement can have many clauses of which only the word SELECT is compulsory.
    You can have a SQL query such as SELECT 5 will return r, or SELECT NOW() to return
    the time. Most queries have the FROM clause to indicate the table to be used.
    The rest of the clauses are optional depending on what the SQL statement needs
    to determine.


    General form of a SELECT statement:


    | MS Access | MySQL |

    |---|---|

    | TOP <n> <fields(s)> | SELECT <fields(s)> |

    | FROM <table(s)> | FROM <table(s)> |

    | WHERE condition(s) | WHERE condition(s) |

    | GROUP BY expression | GROUP BY expression |

    | HAVING condition | HAVING condition |

    | ORDER BY expression | ORDER BY expression |

    | | LIMIT <n> |


    # ## 1.3 The WhoGotTalent Database


    This database was created by Lizeth van der Merwe, an IT and CAT Educator at Trinityhouse
    High School.


    The process of designing a database with many tables is covered in Normalisation
    in Learning Unit 1 of Exploring IT: Theory Grade 12. It is not necessary to cover
    normal before this Learning Unit.


    The WhoGotTalent database consists of 3 simple tables with a small number of records
    in each table. Once a database has been normalised, the data is separated into
    tables by primary and foreign keys. We need to learn how to combine the tables
    using the links between the tables.


    Download the WhoGotTalent database, in either MS Access or MySQL from http://www.funfunks.co.za/FileDownloads.aspx
    to perform the activities and exercises in this Learning Unit.


    For detailed instructions on how to create a MySQL database using .sql file refer
    to section 8.3.4.2 in Learning Unit 8.'
  merge: -1
  pgno: 12
