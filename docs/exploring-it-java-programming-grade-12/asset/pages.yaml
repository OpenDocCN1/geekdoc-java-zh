    # ## 1.3.3 Joining More Than Two Tables Using a WHERE Clause


    We can combine more than two tables using the WHERE clause if you establish the
    correct links between the primary/foreign keys between the tables.


    The general form of a SQL statement to combine 3 tables using the WHERE clause:


    ```

    SELECT <field1>, <field2>, <field3>, <fieldN

    FROM <table1>, <table2>, <table3>

    WHERE <table1>.primary key = <table2>.foreign key

    AND <table2>.primary key = <table3.foreign key

    ```


    A couple of rules that will guarantee success when joining many tables:


    +   * For the fields chosen in the SELECT clause, the corresponding tables must
    be included in the FROM clause.

    * The WHERE clause establishes the correct links of primary to foreign keys across
    the tables.

    * The number of links between tables are less than the number of tables. For example,
    if there are three tables then there must be two links.

    * Even if fields are not used in the SELECT clause, the tables must be included
    in the FROM clause if they form part of the WHERE clause links.


