    \ Click OK.\n\nYou may have a different version of MySQL installed resulting in\
    \ varying version numbers.\n\n# 8.4.1.4 Investigate the DB Class The update method\
    \ is void the query method returns a ResultSet which can be processed in the calling\
    \ class. The processResultSet method can be used as an alternative where the ResultSet\
    \ is processed into String.\n\n```\npublic void update (String update) throws\
    \ SQLException\n{\n    statement = connection.prepareStatement(update);\n    statement.executeUpdate();\n\
    \    statement.close();\n}\n```\n\n```\npublic ResultSet query (String stmt) throws\
    \ SQLException\n{\n    statement = connection.prepareStatement(stmt);\n    resultSet\
    \ = statement.executeQuery();\n    return resultSet;\n}\n```\n\n```\npublic String\
    \ processResultSet(ResultSet rs)\n{\n    // The processResultSet method is extremely\
    \ handy for converting ANY ResultSet to a String where the fields are separated\
    \ by the \"# character.\n    String temp = \"\";\n    ResultSetMetaData meta =\
    \ rs.getMetaData();\n    int size = meta.getColumnCount();\n// The getColumnCount\
    \ method returns the number of columns in the ResultSet.\n    while (rs.next())\
    \ {\n        for (int i = 1; i <= size; i++) {\n            Object value = rs.getObject(i);\n\
    \            temp += \"#\" + value;\n        }\n        // Each object is converted\
    \ to the super class Object before it is added to the String temp.\n        temp\
    \ += \"\\n\";\n    }\n// A blank line is added after each record.\n    catch (SQLException\
    \ ex) {\n        ex.printStackTrace();\n    }\n    return temp;\n}\n```\n\nLearning\
    \ Unit 8 Application Development\n\nPage 181"
