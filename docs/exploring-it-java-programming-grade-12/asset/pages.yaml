  md: "# 6.3 Array Lists\n\nEach student will obviously have an average for many subjects\
    \ instead of IT. We can use an ArrayList to store multiple values for each subject's\
    \ averages.\n\nAn ArrayList is a dynamic array which can automatically grow as\
    \ elements are added and shrink as elements are removed. The arrays we have are\
    \ static (not a static field or method) and cannot change their size once they\
    \ are created. Methods remove(position) and add(element) are used to add and delete\
    \ elements from the ArrayList.\n\nArrayLists are ordered and the element at position\
    \ pos is accessed using the method get(pos) whilst an element in a static array\
    \ at position pos is accessed using arr[pos].\n\n# ACTIVITY 4\n\n+   - Download\
    \ the JSON file Subj.JSON from http://www.funworks.com/FileDownloads.aspx and\
    \ save the file to the JSONProj folder.\n\n+   - The file stores multiple values\
    \ for a student's subjects indicated by the values placed in square brackets.\n\
    \n```\n{\n  \"first name\": \"Fatima\",\n  \"last name\": \"Habib\",\n  \"date\
    \ of birth\": \"2005-04-12\",\n  \"boarder\": false,\n  \"subjects\": [84.3,78.4,79.9,65.7,72.8]\n\
    }\n```\n\n+   - Change the Student class (in bold) to use an ArrayList to store\
    \ the averages.\n\n```\nprivate String fname, lName;\nprivate LocalDate dob;\n\
    private boolean boarder;\nprivate ArrayList<Double> aveList;\n\npublic Student\
    \ (String f, String l, LocalDate d, boolean b, ArrayList<Double> a) {\n  fname\
    \ = f;\n  lName = l;\n  dob = d;\n  boarder = b;\n  aveList = a;\n}\n```\n\n+\
    \   - Import the ArrayList to the toString method (in bold) to include the aveList.\n\
    \n+   - Change the JSONclass (in bold) to extract the entire list of subjects\
    \ in one statement and cast them to an ArrayList of type using double the Subj.JSON\
