  md: '# Learning Unit 7 Data Structures and Algorithms


    # 7.1 Defining Data Structures and Algorithms


    A data structure describes how data is stored and organised in a computer so that
    it can be used efficiently. Data structures in primary memory include variables,
    arrays and objects and are chosen by the programmer to organise the data required
    for the problem. Algorithms manipulate the data in these various ways, such as
    finding the average of the items, searching for an item; or sorting the items.


    Data structures provide a mean to manage large amounts of data, such as databases
    which are stored in secondary memory, or arrays in primary memory to store many
    items of the same type. Usually, efficient data structures are a key to designing
    efficient algorithms.


    Sometimes it makes sense to combine the data and algorithms into a single entity
    (encapsulation) called an object, where the data is stored in fields and the code
    acts upon the fields are placed in methods.


    # 7.2 Primary Memory


    When designing a solution to the problem, the programmer has to decide what data
    structures to use in primary memory to represent the data while the program is
    running. The data structures that we have studied include:


    +   * Variables (int, double, Boolean, char or String)

    * Arrays (static or dynamic)

    * User defined objects

    * A combination of any of the above


    Using computational thinking, the problem needs to be decomposed into parts. Each
    part may become a class, a class inheriting from a similar class, an instance
    of an existing class depending on what the solution requires. Each part needs
    to be further decomposed as the programmer zooms in (abstraction) to focus on
    solving that each part of the problem. This process is repeated for all of the
    problem. Each part should be tested on its own before the parts are combined to
    create the complete solution. The final solution should also be tested using standard,
    extreme and abnormal data.


    # 7.2.1 Arrays


    A static array is a data structure that stores a fixed collection of items of
    identical type. These items are arranged sequentially in memory and are numbered
    using an index starting from 0 in Java.


    # 7.2.2.1 Advantages of Using Arrays


    Keeping Types of the Sort Together


    An array combines elements of the same type so that elements can be addressed
    using one identifier name with an index or subscript.'
