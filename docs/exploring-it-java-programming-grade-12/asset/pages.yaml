    | 29 | GS | 61 | 93 | | | 125 |

    | 30 | RS | 62 | 94 | | | 126 |

    | 31 | US | 63 | 95 | | | 127 |


    Each character on the keyboard has a unique associated integer code value called
    Unicode or ASCII code.


    You may have some difficulty getting the first 31 ASCII characters to print on
    the screen or printer. This is because they are control characters with special
    meanings.


    +   - e.g. in tab

    - 10 is line feed

    - 27 is escape

    - (Esc the keyboard)


    7 is for the bell of sound

    32 is a space


    You may also find that the printer prints characters on paper to what you see
    on the screen. If this happens, consult your printer manual and find out to change
    the settings.


    Although Java uses 16-bit Unicode instead of 8-bit ASCII code, the first 127 ASCII
    values, representing the most common characters, can be ''converted'' by Java
    into Unicode and can be used to cast characters from the integer ASCII values.


