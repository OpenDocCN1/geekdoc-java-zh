  md: '# General form of a LEFT JOIN


    ```

    SELECT field1, field2, field3

    FROM first_table

    LEFT JOIN second_table

    ON first_table.keyfield = second_table.foreign_keyfield

    ```


    Note that the first table listed will contain the extra fields produced in the
    Result Set.


    # 1.4.4 RIGHT JOIN


    The RIGHT JOIN returns all rows from the second table, even if there are no matches
    in the first table Employees. If there had been any rows in Orders that did not
    have matches in Employees, those rows also would have been listed.


    # Example 5


    List all orders and who has ordered - if any.


    ```

    SELECT Employees.Name, Orders.Product

    FROM Employees

    RIGHT JOIN Orders

    ON Employees.Employee_ID = Orders.Employee_ID

    ```


    Result


    | Name | Product |

    | --- | --- |

    | Hansen, Ola | Printer |

    | Svensson, Stephen | Table |

    | Svensson, Stephen | Chair |


    A RIGHT JOIN is the exact opposite of the LEFT JOIN and can be written as a LEFT
    JOIN by swapping the tables around.


    ```

    SELECT Employees.Name, Orders.Product

    FROM Employees

    RIGHT JOIN Orders

    ON Employees.Employee_ID = Orders.Employee_ID

    ```


    is the same as:


    The two SQL statements produce the same results. So, it is simpler to always use
    a LEFT JOIN. Make sure the table that has extra fields is always listed first.
    This will include fields from the first table that do not have matches in the
    second table.


    # General form of RIGHT JOIN


    ```

    SELECT field1, field2, field3

    FROM first_table

    RIGHT JOIN second_table

    ON first_table.keyfield = second_table.foreign_keyfield

    ```'
