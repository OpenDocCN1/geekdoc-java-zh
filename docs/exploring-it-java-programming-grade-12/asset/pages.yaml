    \ bug = new SquareGogga();\n2 bug.makeSquare();\n3 SquareGogga beetle=new SquareGogga();\n\
    4 beetle.setPosition(10, 5);\n5 beetle.makeSquare();\n\n```\npublic void makeSquare\
    \ () {\n    for (int loop=1; loop<4; loop++) {\n        this.move();\n       \
    \ this.move();\n        this.move();\n        this.turnLeft ()\nn    }\n}\n```\n\
    \nThe statements on the left are numbered for reference purposes. These statements,\
    \ in the main method of the MakeSquare application, are executed when the Run\
    \ command is given. Another method is called from these statements, the execution\
    \ of which is follows:\n\n+   * Line 1 is executed, instantiating the SquareGogga\
    \ object bug.\n* Line 2 is executed, calls the makeSquare() method, sending a\
    \ copy of the implicit parameter bug, beetle, to the makeSquare() method, where\
    \ bug is used in place of this.\n* All the statements in the makeSquare() method\
    \ are executed, with the object bug. Control is then transferred to the main method's\
    \ statements.\n* Line 3 is executed, instantiating the SquareGogga object beetle.\n\
    * Line 4 is executed, moving beetle to the specified position.\n* Line 5 is executed,\
    \ invokes the makeSquare() method, sending a copy of the implicit parameter beetle,\
    \ beetle, to the makeSquare() method, where beetle is used in place of this.\n\
    * All the statements in the makeSquare() method are executed, with the object\
    \ beetle substituted in place of this. Control is then transferred to the main\
    \ method's statements.\n* There are no more statements in the main method, so\
    \ the program ends.\n\nDuring this Learning Unit, we are going to develop many\
    \ methods. It will sometimes be difficult to determine what to put into a method.\
    \ A method should, by definition, perform only one task, such as making a square,\
