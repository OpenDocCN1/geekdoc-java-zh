  \ 章 “Future 与并发”向你展示如何使用 Scala 的 `Future`。虽然你可以在 Scala 程序中使用 Java 平台的并发原语和库，但 future\
  \ 可以帮助你避免困扰传统“线程和锁”并发方法的死锁和竞态条件。\n- 第 33 章 “组合解析”展示了如何使用 Scala 的解析器组合器库构建解析器。\n\
