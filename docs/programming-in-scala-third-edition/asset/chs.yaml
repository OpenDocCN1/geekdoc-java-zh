  \ 或 `String` 都没有出现过。这个例子说明了*类型推断*（type inference），即 Scala 能够识别你省略的类型的能力。在这种情况下，由于你使用字符串字面量初始化了\
  \ `msg`，Scala 推断出 `msg` 的类型为 `String`。当 Scala 解释器（或编译器）能够推断类型时，最好让它这样做完成，而不是在代码中填满不必要的、显式的类型注解。不过，如果你愿意，也可以显式地指定类型，而且有时你可能应该这样做。显式类型注解既可以确保\
  \ Scala 编译器推断出你预期的类型，又能为代码未来的阅读者提供有用的文档。与 Java 不同（Java 在变量名之前指定类型），而在 Scala 中，你在变量名之后指定类型，并用冒号隔开。例如：\n\
  \n```\nscala> val msg2: java.lang.String = \"Hello again, world!\"\n  msg2: String\
  \ = Hello again, world!\n```\n\n或者，由于 `java.lang` 类型在 Scala 程序中可以使用简单名称可见，只需写为：\n\
