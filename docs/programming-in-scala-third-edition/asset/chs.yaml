  \ Thanks Darlene Gruendl 和 Samantha Woolf 完成了本版。\n\n# 引言\n\n本书是一本关于 Scala 语言的教程，由直接参与\
  \ Scala 开发的人编写。我们的目标是让你通过阅读本书学会成为高效 Scala 程序员所需的一切。书中的所有示例均使用 Scala 版本 11.7，标记为\
  \ 12 的部分使用 12.0-M3。\n\n### 谁应该读这本书\n\n这本书的目标读者是想要使用 Scala 的程序员。如果你想下一个项目使用 Scala，那么这本书适合你。此外，希望通过学习新概念来扩展视野的程序员也会很有兴趣。例如，如果你是一个\
  \ Java 程序员，这本书将让你接触许多函数式编程概念以及高级对象思想。我们相信学习 Scala 及其背后的思想有助于你成为更好的程序员。\n\n假设具备通用编程知识。虽然\
  \ Scala 是一门很好的入门语言，但这本书并不是用来学习编程的。\n\n另一方面，不需要特定的编程语言知识。尽管大多数人在 Java 平台上使用 Scala，但本书并不假设你对\
  \ Java 有任何了解。\n\n### 如何使用这本书\n\n由于本书的主要目的是作为教程，建议的阅读方式是按照章节从前往后阅读。我们努力每次介绍一个主题，并仅用我们介绍过的主题来解释新主题。因此，如果你跳到最后先看某些内容，你可能会发现它是用你尚未完全理解的概念来解释的。只要你按照章节顺序阅读，我们认为你可以循序渐进地掌握\
  \ Scala。\n\n\n\n\n\n在你读过一遍书后，它也应该作为一份语言参考。Scala 语言有一个正式的规范，但该规范为了追求精确性往往牺牲了可读性。虽然这本书没有涵盖\
  \ Scala 的每一个细节，但它非常全面，当你对 Scala 编程变得越来越熟练时，它可以作为一份易于上手的语言参考。\n\n## 如何学习 Scala\n\n\
  仅仅通过从头到尾阅读这本书，你就能学很多 Scala 的知识。不过，如果你能做一些额外的工作，学得更快、更彻底。\n\n首先，你可以利用书中包含的许多程序示例。手动输入这些示例是强迫大脑思考每一行代码的方法。尝试变体则可以让学习变得更有趣，并确保你真正理解了它们是如何运行的。\n\
  \n其次，与大量的在线论坛保持联系。这样，你和其他 Scala 爱好者就可以互相帮助。有许多邮件列表、讨论论坛、聊天室、wiki 以及多个针对 Scala 的文章订阅。花些时间找到适合你信息需求的平台。你将在小问题上花费少得的时间，从而把时间花在更深层次、更重要的问题上。\n\
  \n最后，当你读了足够的内容后，开始着你自己的编程项目。从零开始编写一个小程序，或者为一个更大的程序开发一个插件。仅通过阅读的进步是有限的。\n\n## EBook\
