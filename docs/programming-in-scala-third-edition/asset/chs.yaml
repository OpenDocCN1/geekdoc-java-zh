  \n#### 图 35.2 - 显示自身的单元格。\n\n就是这样。如果你使用带有 `Model` 类编译修改后的 `Spreadsheet` 类并运行 `Main`\
  \ 应用程序，你应该能看到一个类似于图 35.2 的窗口。\n\n本节的目标是实现一种设计，使得单元格的显示值与输入它的字符串不同。这个目标显然已经实现，尽管方式非常粗糙。在新的电子表格中，你可以在单元格中输入任何内容，但一旦它失去焦点，它将始终显示其坐标。显然，我们还没有完成。\n\
  \n### 35.3 公式\n\n在现实中，一个电子表格单元格持有两个东西：一个实际值和一个用于计算该值的公式。电子表格中有三种类型的公式：\n\n1. 数值，例如\
  \ `1.22`、`-3` 或 `0`。\n2. 文本标签，例如 `Annual sales`、`Deprecation` 或 `total`。\n3. 根据单元格内容计算新值的公式，例如\
  \ `=add(A1,B2)` 或 `=sum(mul(2, A2), C1:D16)`。\n\n计算计算值的公式总是以等号开头，后面紧跟一个算术表达式。`SCells`\
  \ 电子表格对算术表达式有一个特别简单且统一的约定：每个表达式都是将某个函数应用于参数列表。函数名是一个标识符，例如用于二元加法的 `add`，或用于任意数量操作数求和的\
  \ `sum`。函数参数可以是数字、单元格引用、单元格范围引用（如 `C1:D16`）或另一个函数应用。稍后你会看到 `SCells` 具有开放架构，使其可以通过混合组合（mixin\
  \ composition）轻松安装你自己的函数。\n\n处理公式的第一步是写下表示它们的类型。正如你预期的，不同类型的公式由样例类（case classes）表示。列表\
  \ 35.5 显示了名为 `Formulas.scala` 的文件的内容，这些样例类在该文件中定义：\n\n```scala\npackage org.stairwaybook.scells\n\
  \n  trait Formula  \n\n  case class Coord(row: Int, column: Int) extends Formula\
  \ {\n    override def toString = ('A' + column).toChar.toString + row\n  }\n  case\
  \ class Range(c1: Coord, c2: Coord) extends Formula {\n    override def toString\
  \ = c1.toString + \":\" + c2.toString\n  }\n  case class Number(value: Double) extends\
  \ Formula {\n    override def toString = value.toString \n  }\n  case class Textual(value:\
  \ String) extends Formula { \n    override def toString = value\n  }\n  case class\
  \ Application(function: String, \n      arguments: List[Formula]) extends Formula\
  \ { \n\n    override def toString = \n      function + arguments.mkString(\"(\"\
  , \",\", \")\")\n  }\n  object Empty extends Textual(\"\")\n```\n\n#### 列表 35.5\
  \ - 表示公式的类。\n\nTrait `Formula`（如列表 35.5` |\n\n`Coord` 重写了 `toString` 方法，以便显示其坐标。每个样例类类都重写了\
  \ `toString` 来表示其值。`Empty` 是 `Textual` 的一个实例，对应空字符串。\n\n### 35.4 解析公式\n\n在本节中，我们将看到如何将字符串解析为\
  \ `Formula` 对象。我们将使用 `scala.parser.combinator` 库。\n\n```scala\npackage org.stairwaybook.scells\n\
  import scala.util.parsing.combinator._\n\nobject FormulaParsers extends RegexParser\
  \ {\n  def ident: Parser[String] = \"\"\"[a-z_]\\w\"\"\".r\n  def decimal: Parser[String]\
  \ = \"\"\"-?\\d+\"\"\".r\n\n  def cell: Parser[Coord] = \"\"\"[A-Za-z]\\d+\"\"\"\
  .map { s =>\n    val column = s.charAt(0).toUpper - 'A'\n    val row = s.substring(1).toInt\n\
  \    Coord(row, column)\n  }\n\n  def range: Parser[Range] = cell ~ \":\" ~ cell\
  \ map {\n    case c1 ~ \":\" ~ c2 => Range(c1, c2)\n  }\n\n  def number: Parser[Number]\
  \ = decimal map { d => Number(d.toDouble) }\n\n  def application: Parser[Application]\
  \ = ident ~ \"(\" ~ repsep(expr, \",\") ~ \")\" map {\n    case f ~ \"(\" ~ ps ~\
  \ \")\" => Application(f, ps)\n  }\n\n  lazy def expr: Parser[Formula] = range |\
  \ cell | number | application\n}\n```\n\n\n\n\n\n文本解析器可以识别任意输入字符串，只要它不以等号开头（记住，以\
  \ `='` 开头的字符串被视为公式）：\n\n```scala\n def textual: Parser[Textual] = \n  \"\"\"[^=].*\"\
  \"\".r ^^ Textual\n```\n\n公式解析器可以识别输入单元格的各种合法输入。公式可以是数字、文本条目，或者是以等号开头的公式：\n\n```scala\n\
  \ def formula: Parser[Formula] = \n  number | textual | \"=\"~>expr\n```\n\n到此，电子表格单元格的语法定义结束了。最终方法\
  \ `parse` 在一个方法中使用该语法，将输入字符串转换为 `Formula` 树树：\n\n```scala\n def parse(input: String):\
  \ Formula =\n    parseAll(formula, input) match {\n      case Success(e, _) => e\n\
  \      case f: NoSuccess => Textual(\"[\" + f.msg + \"]\")\n    }\n  } //end FormulaParsers\n\
  ```\n\n`parse` 方法使用公式解析器解析所有输入。如果成功，则返回结果公式。如果失败，则返回一个带有错误消息的 `Textual` 对象。\n\n\
  ```scala\npackage org.stairwaybook.scells\n  import swing._\n  import event._\n\n\
  \  class Spreadsheet(val height: Int, val width: Int) ... {\n    val table = new\
  \ Table(height, width) {\n      ...\n      reactions += {\n        case TableUpdated(table,\
  \ rows, column) =>\n          for (row <- rows)\n            cells(row)(column).formula\
  \ = \n              FormulaParsers.parse(userData(row, column))\n      }\n    }\n\
  \  }\n```\n\n##### 列表 35.6 - 一个解析公式的电子表格。\n\n解析公式的内容到此为止。剩下的工作是将解析器集成到电子表格中。为了实现这一点，你可以通过公式字段来丰富\
  \ `Model` 类中的 `Cell` 类：\n\n```scala\n case class Cell(row: Int, column: Int) {\n\
  \  var formula: Formula = Empty\n  override def toString = formula.toString\n}\n\
  ```\n\n在 `Cell` 类的新版本中，`toString` 方法被定义用于显示单元格的公式。这样你就可以检查公式是否被正确解析。\n\n本节的最后一步是将解析器集成到电子表格中。公式的解析是在用户输入单元格时作为响应发生的。完成的单元格输入在\
  \ Swing 库中通过 `TableUpdated` 事件进行建模。`TableUpdated` 类位于 `scala.swing.event` 包中。该事件的形式如下：\n\
  \n```\n TableUpdated(table, rows, column)\n```\n\n它包含了被更改的表格，以及由 `rows` 和 `column`\
  \ 提供的受影响单元格坐标集。`rows` 参数是一个类型为 `Range[Int]` 的范围值。`column` 参数是一个整数。因此，通常一个 `TableUpdated`\
  \ 事件可以引用多个受影响的单元格，但它们位于连续的行范围内并共享相同的列。\n\n![image images/scells3Gray96.png](img/scells3Gray96.png)\n\
  \n##### 图 35.3 - 显示公式的单元格。\n\n一旦表格发生变化，就需要重新解析受影响的单元格。为了响应 `TableUpdated` 事件，你向表格组件的\
  \ `reactions` 值中添加一个用例，如 列表 35.6 所示的电子表格应用程序。你可以通过输入内容来编辑单元格。编辑完成后，单元格将显示公式。\n\n\
  ### 35.5 求值\n\n当然，电子表格最终应该求值，而不仅仅是显示它们。在本节中，我们将添加实现此点的必要组件。我们需要一个 `evaluate` 方法，它接收一个公式并返回一个值。我们将此方法放在一个新的\
  \ trait `Evaluator` 中。该方法需要访问 `cells` 以查找当前值。另一方面，`Model` 类需要调用 `evaluate`。因此，类之间存在相互依赖。\n\
  \n表示相互依赖的一种良好方法已[第 29 章]中给出：在一个方向上使用继承，在另一个方向使用自类型（self types）。在电子表格示例中，`Model`\
  \ 继承自 `Evaluator` 并获得了对其方法的访问权限。要反过来走，`Evaluator` 将其 `self` 类型定义为 `Model`，如下：\n\n\
  ```scala\npackage org.stairwaybook.scells\ntrait Evaluator{ this: Model =>\n```\n\
  \n这样，`Evaluator` 内部的 `this` 值被假设为 `Model`，可以通过 `this.cells` 访问 `cells` 数组。现在连接已经完成，我们将专注于定义\
  \ `Evaluator` 的内容。列表 35.7 显示了 `evaluate` 方法的实现。正如你预期的，该方法对不同类型的公式进行了模式匹配。对于 `Coord(row,\
  \ column)`，它返回 `cells` 数组在该坐标处的值。对于数字 `Number(v)`，它返回值 `v`。对于文本标签 `Textual(_)`，它返回零。最后，对于应用\
  \ `Application(function, arguments)`，它计算所有参数的值，从操作表中获取与函数名对应的函数对象并将将其应用于参数值。\n\n\
  ```scala\n def evaluate(e: Formula): Double = try {\n  e match {\n    case Coord(row,\
  \ column) =>\n      cells(row)(column).value\n    case Number(v) =>\n      v\n \
  \   case Textual(_) =>\n      0\n    case Application(function, arguments) =>\n\
  \      val argvals = arguments flatMap evalList\n      operations(function)(argvals)\n\
  \  }\n} catch {\n  case ex: Exception => Double.NaN\n}\n```\n\n##### 列表 35.7 - trait\
  \ Evaluator 的 evaluate 方法。\n\n操作表将函数名映射到函数对象。它的定义如下：\n\n```scala\n type Op = List[Double]\
  \ => Double\n val operations = new collection.mutable.HashMap[String, Op]\n```\n\
  \n从这个定义可以看出，操作被建模为从值列表到值的函数。`Op` 类型为操作引入了一个方便的别名。\n\n\n\n\n`evaluate` 方法中的计算被封装在\
  \ `try-catch` 块中，以防止输入错误。在评估单元格公式时，实际上有很多可能出现的问题：坐标可能超出范围；函数名可能未定义；参数数量可能错误；算术运算可能非法或溢出。对任何这些错误的处理都是相同的：返回一个“非数字”（not-a-number）值。返回的值\
  \ `Double.NaN` 是 IEEE 对不可表示的浮点数值的计算的表示。这可能是因为溢出或除以零引起的，例如。代码列表 35.7 中的 `evaluate`\
  \ 方法选择对所有其他类型的错误也返回相同的值。这种方案的优点是易于理解，且不需要大量代码即可实现。它的缺点是各种错误都混合在了一起，因此电子表格用户无法获得关于何错误的任何详细反馈。如果你愿意，可以尝试在\
  \ SCells 应用中用更精细的错误表示方法。\n\n参数的评估与顶层公式的评估是不同的。参数可能是列表，而顶层函数可能不是。例如，`sum(A1:A3)`\
  \ 中的参数表达式 `A1:A3` 返回单元格 `A1`、`A2`、`A3` 值的列表。该列表随后被传递给 `sum` 操作。在参数表达式中混合列表和单值也是可能的，例如操作\
  \ `sum(A1:A3, 1.0, C7)`，它将对五个值进行求和。为了处理可能评估为列表的参数，有另一个评估函数称为 `evalList`，它接受一个公式并返回一个值列表：\n\
  \n```scala\nprivate def evalList(e: Formula): List[Double] = e match {\n  case Range(_,\
  \ _) => references(e) map (_.value)\n  case _ => List(evaluate(e))\n}\n```\n\n如果传递给\
  \ `evalList` 的公式参数是 `Range`，返回的值是由该范围引用的所有单元格值组成的列表。对于其他任何公式，结果都是包含该公式单一结果值的列表。公式引用的单元格由第三个函数\
  \ `references` 计算。以下是它的定义：\n\n```scala\ndef references(e: Formula): List[Cell] =\
  \ e match {\n  case Coord(row, column) => \n    List(cells(row)(column))\n  case\
  \ Range(Coord(r1, c1), Coord(r2, c2)) =>\n    for (row <- (r1 to r2).toList; column\
  \ <- c1 to c2)\n      yield cells(row)(column)\n  case Application(function, arguments)\
  \ =>\n    arguments flatMap references\n  case _ =>\n    List()\n} // end Evaluator\n\
  ```\n\n`references` 方法实际上比现在需要的更通用，因为它计算任何类型公式引用的单元格列表，而不仅仅是 `Range` 公式。以后会证明，这种新增的功能用于计算需要更新的单元格集。该方法的体是对公式种的简单模式匹配。对于坐标\
  \ `Coord(row, column)`，它返回一个包含该坐标单元格的单元素列表。对于范围表达式 `Range(coord1, coord2)`，它通过 `for`\
  \ 表达式返回两个坐标之间的所有单元格。对于函数应用 `Application(function, arguments)`，它返回每个参数表达式引用的单元格，通过\
  \ `flatMap` 拼接成一个单一列表。对于其他两种类型的公式（`Textual` 和 `Number`），它返回一个空列表。\n\n### 35.6 操作库\n\
  \n`Evaluator` 类本身没有定义可以在单元格上执行的操作：它的操作表初始时是空的。这种思想是在其他 trait（特质）中定义这些操作，然后将它们混入\
  \ `Model` 类中。[代码列表 35.8 显示了一个实现常用算术操作的示例 trait： \n\n```scala\npackage org.stairwaybook.scells\n\
  trait Arithmetic { this: Evaluator =>\n  operations += (\n    \"add\"  -> { case\
  \ List(x, y) => x + y },\n    \"sub\"  -> { case List(x, y) => x - y },\n    \"\
  div\"  -> { case List(x, y) => x / y },\n    \"mul\"  -> { case List(x, y) => x\
  \ * y },\n    \"mod\"  -> { case List(x, y) => x % y },\n    \"sum\"  -> { xs =>\
  \ (0.0 / xs)(_) },\n    \"prod\" -> { xs => (1.0 / xs)(_) }\n  )\n}\n```\n\n####\
  \ 代码列表 35.8 - 算术操作库\n\n有趣的是，这个 trait 没有导出的成员。它所做的唯一事情是在其初始化期间填充操作表。它通过使用自类型（self\
  \ type）`Evaluator` 来访问该表，即使用 `Arithmetic` 类用于访问 model 的相同技术。\n\n在 `Arithmetic` trait\
  \ 定义的七个操作中，五个是二元操作，两个接收任意数量参数。二元操作遵循相同的模式。例如，加法操作 `add` 是通过表达式定义的：\n\n```scala\n\
  case List(x, y) => x + y\n```\n\n这意味着，它期望一个包含两个元素 `x` 和 `y` 的参数列表，并返回 `x` 和 `y`\
  \ 的和。\n\n\n\n如果一个单元格的值发生了变化，所有依赖于该值的单元格都应该重新计算并重新显示结果。实现这一点最简单的方法是在每次更改后重新计算电子表格中每个单元格的值。然而，随着表格规模的增大，这种方法的可扩展性并不好。\n\
  \n更好的方法是重新计算那些在公式中引用了已更改单元格的单元格。其思想是使用一个基于事件的发布/订阅框架来进行更改传播：一旦某个单元格被分配了公式，它就会订阅该公式所引用的所有单元格的值变化通知。这些单元格中任何一个值的变化都会触发订阅单元格的重新评估。如果这种重新评估导致了单元格值的变化，它将反过来通知所有依赖于它的单元格。这个过程一直持续，直到所有单元格的值都稳定（即不再有单元格的值发生变化）。\n\
  \n该发布/订阅框架在 `Model` 类中实现，使用了 Scala `Swing` 框架的标准事件机制。这里是该类的最新（也是最终）版本：\n\n```scala\n\
  \ package org.stairwaybook.scells\n  import swing._\n\n  class Model(val height:\
  \ Int, val width: Int) \n  extends Evaluator with Arithmetic {\n```\n\n与 `Model`\
  \ 的之前的版本相比，这个版本增加了对 `swing._` 的导入，使得 `Swing` 的事件抽象直接可用。\n\n`Model` 类的主要修改涉及嵌套类 `Cell`。`Cell`\
  \ 类现在继承自 `Publisher`，因此它可以发布事件。事件处理逻辑完全包含在两个属性的 setter（setter）中：`value` 和 `formula`。以下是\
  \ `Cell` 的新版本：\n\n```scala\ncase class Cell(row: Int, column: Int) extends Publisher\
  \ {\n  override def toString = formula match {\n    case Textual(s) => s\n    case\
  \ _ => value.toString\n  }\n```\n\n从外部看，`value` 和 `formula` 像是 `Cell` 类中的两个变量。它们的实际实现是基于两个私有字段，这些字段配备了公共获取器（getters）`value`\
  \ 和 `formula`以及设置器（setters）`value_` 和 `formula_`。以下是实现 `value` 属性的定义：\n\n```scala\n\
  private var v: Double = 0\n  def value: Double = v\n  def value_=(w: Double) = {\n\
  \    if (!(v == w || v.isNaN && w.isNaN)) {\n      v = w\n      publish(ValueChanged(this))\n\
  \    }\n  }\n```\n\n`value_` 设置器将新值 `w` 分配给私有字段 `v`。如果新值与旧值不同，它还会以单元格本身作为参数发布一个\
  \ `ValueChanged` 事件。注意，对值是否变化的测试有点复杂，因为涉及到值 `NaN`。Java 规范说 `NaN` 与任何其他值（包括它本身）都不同！因此，测试两个值相等必须特殊处理\
  \ `NaN`：如果两个值 `v`, `w` 在相对于 `==` 来说相等，或者它们都是值 `NaN`（即 `v.isNaN` 和 `w.isNaN` 都返回\
  \ true），则它们是相同的。\n\n`value_` 设置器在发布/订阅框架中执行发布，而 `formula_` 设置器执行订阅：\n\n```scala\n\
  private var f: Formula = Empty\n  def formula: Formula = f\n  def formula_=(f: Formula)\
  \ = {\n    for (c <- references(formula)) deafTo(c)\n    this.f = f\n    for (c\
  \ <- references(formula)) listenTo(c)\n    value = evaluate(f)\n  }\n```\n\n如果一个单元格被分配了一个新公式，它首先通过\
  \ `deafTo` 从之前公式值引用的所有单元格取消订阅。然后将新公式存储在私有变量 `f` 中，并通过 `listenTo` 订阅它引用的所有单元格。最后，它使用新公式重新计算自己的值。\n\
  \n修订后的 `Cell` 类中的最后一段代码指定了如何响应 `ValueChanged` 事件：\n\n```scala\nreactions += {\n\
  \  case ValueChanged(_) => value = evaluate(formula)\n} // end class Cell\n```\n\
  \n`ValueChanged` 类也包含在 `Model` 类中：\n\n```scala\ncase class ValueChanged(cell: Cell)\
  \ extends event.Event\n```\n\n`Model` 类的部分与之前相同：\n\n```scala\nval cells = Array.ofDimCell\
  \ \n\nfor (i <- 0 until height; j <- 0 until width)\n  cells(i)(j) = new Cell(i,\
  \ j)\n// end class Model\n```\n\n```scala\npackage org.stairwaybook.scells\n  import\
  \ swing., event._\n\n  class Spreadsheet(val height: Int, val width: Int) \n  extends\
  \ ScrollPane {\n\n    val cellModel = Model(height, width)\n    import cellModel._\n\
  \n    val table = Table(height, width) {\n      ... // 如 Listing 所示设置\n\n      override\
  \ def rendererComponent(\n        isSelected: Boolean, hasFocus: Boolean,\n    \
  \    row: Int, column: Int) =\n        ... // 如 Listing 所示\n\n      def userData(row:\
  \ Int, column: Int): String = \n        ... // 如 Listing 所示\n\n      reactions +=\
  \ {\n        case TableUpdated(table, rows, column) =>\n          for (row <- rows)\n\
  \            cells(row)(column).formula = \n              FormulaParsers.parse(userData(row,\
  \ column))\n        case ValueChanged(cell) =>\n          updateCell(cell.row, cell.column)\n\
  \      }\n\n      for (row <- cells; cell <- row) listenTo(cell)\n    }\n\n    val\
  \ rowHeader = new ListView(0 until height) {\n      fixedCellWidth = 30\n      fixedCellHeight\
  \ = table.rowHeight\n    }\n\n    viewportView = table\n    rowHeaderView = rowHeader\n\
  \  }\n```\n\n##### Listing 35.9 - 完成的电子表格组件。\n\n电子表格代码现在几乎完成了。最后缺失的是修改单元格的重新显示。到为止，所有的值传播只涉及内部的\
  \ `Cell`；可见表格并未受到影响。改变这一点的一种方法是在 `value_` 设置器中添加重绘命令。然而，这将破坏你目前看到的模型与视图之间的严格分离。一种更模块化的解决方案是通知表格所有的\
  \ `ValueChanged` 事件，让它自己负责重绘。Listing 35.9 展示了这种方案的两个修订：首先，表格组件现在通过 `listenTo` 订阅模型中的所有单元格。其次，在表格的响应中增加了一个情况：如果收到\
  \ `ValueChanged(cell)` 事件，它将调用 `updateCell(cell.row, cell.column)` 来重绘相应的单元格。\n\n\
  ### 35.8 结\n\n本章开发的电子表格功能完备，尽管在某些地方它采用了最简单的实现方案而不是最方便用户的方案。这样一来，它只需要 200 行代码即可编写。尽管如此，电子表格的架构使得修改和扩展变得容易。如果你想对代码进行更多实验，这里有一些可以更改或添加的建议：\n\
  \n1. 你可以让电子表格支持缩放，以便交互式更改行列数。\n\n2. 你可以添加新类型的公式，例如二元运算或其他函数。\n\n3. 你可能需要考虑单元格递归引用自身的情况。例如，如果单元格\
  \ A1 持公式 `add(B1, 1)` 而单元格 B1 持公式 `mul(A1, 2)`，重新评估其中任何一个单元格都会触发栈溢出。显然这不是一个很好的解决方案。作为替代方案，你可以要么禁止这种情况，要么在每次接触其中一个单元格时只计算一次。\n\
  \n4. 你可以增强错误处理，提供更详细的错误描述信息。\n\n5. 你可以在电子表格顶部添加一个公式输入框，以便更方便地输入长公式。\n\n\n\n在本书开头，我们强调了\
  \ Scala 的可扩展性。我们声称 Scala 面向对象和函数式构造的结合，使其适用于从小型脚本到非常大型系统的各种程序。这里展示的电子表格显然仍然是一个小型系统，尽管在大多数其他语言中它可能需要超过\
  \ 200 行。尽管如此，你仍然在这个应用程序中看到了许多使 Scala 具有可扩展性的细节。\n\n该电子表格使用了 Scala 的 `classes` 和\
  \ `traits` 及其它们的混入组合（mixin composition），以灵活的方式组合组件。组件之间的递归依赖使用 `self types` 来表达。对静态状态的需求被完全消除了——不是类的的唯一顶层组件是公式树和公式解析器，而这两者都是纯函数式的。该应用程序还广泛使用了高阶函数和模式匹配，既用于访问公式也用于事件处理。因此，它是展示函数式编程和面向对象编程如何完美结合的绝佳示例。\n\
  \n电子表格应用程序之所以如此简洁，一个重要原因是它可以基于强大的库。解析器组合器库（parser combinator library）实际上为编写解析器提供了一种内部领域特定语言（DSL）。如果没有它，解析公式将变得困难得多。Scala\
  \ Swing 库中的事件处理是控制抽象力量的一个良好例子。如果你熟悉 Java 的 Swing 库，可能会欣赏 Scala 反应（reactions）概念的简洁性，特别是与经典的发布/订阅设计模式中编写\
  \ `notify` 方法和实现监听器接口的繁琐相比。因此，电子表格展示了可扩展性的优势，即高层库可以看起来就像语言的扩展一样。\n\n***\n\n### 第\
  \ 35 章脚注：\n\n[1] 虽然 `this(row, column)` 看起来类似于构造函数调用，但在这种情况下，它是对当前 `Table` 实例上的\
  \ `apply` 方法的调用。\n\n[2] `Range[Int]` 也是 Scala 表达式如 `\"1 to N\"` 的类型。\n\n[3] 这假设单元格之间没有循环依赖。我们将在章末尾讨论放弃这一假设。\n\
  \n## 附录 A\n\n# Unix 和 Windows  Scala 脚本\n\n如果你在某种版本的 Unix 上，你可以在文件开头添加一个“井号叹号”（pound\
  \ bang）指令，将 Scala 脚本作为 shell 脚本运行。例如，在名为 `helloarg` 的文件中输入以下内容：\n\n```\n#!/bin/sh\n\
  exec scala \"$0\" \"$@\"\n!#\n// 向第一个参数问好\nprintln(\"Hello, \" + args(0) + \"!\"\
  )\n```\n\n初始的 `#!/bin/sh` 必须是文件的第一行。一旦你设置了执行权限：\n\n```bash\nchmod +x helloarg\n\
  ```\n\n你可以通过简单的命令将 Scala 脚本作为 shell 脚本运行：\n\n```bash\n./helloarg globe\n```\n\n\
  如果你在 Windows 上，你可以通过将文件命名为 `helloarg.bat` 并将此内容放在脚本顶部来实现相同的效果：\n\n```batch\n::#!\n\
  @echo off\ncall scala %0 %*\ngoto :eof\n::!#\n```\n\n# 术语表\n\n**代数数据类型（algebraic\
  \ data type）** —— 通过提供几种替代方案定义的类型，每种方案都有其自己的构造函数。它通常带有一种通过模式匹配来分解该类型的方法。该概念出现在规范语言和函数式编程语言中。代数数据类型可以用\
  \ `case classes` 在 Scala 中模拟。\n\n**分支（alternative）** —— `match` 表达式的一个分支。它的形式为 `\"\
  case pattern => expression.\"`。分支的另一个名称是 `case`。\n\n**注解（annotation）** —— `annotation`\
  \ 出现在源代码中并附加到语法的某些部分。注解是计算机可处理的，因此你可以使用它们有效地为 Scala 添加扩展。\n\n**匿名类（anonymous class）**\
  \ —— 匿名类是 Scala 编译器从新表达式生成的合成子类，在新表达式中，类或 trait 的名称后跟着大括号。大括号包含匿名子类的体，该体可以是空的。然而，如果\
  \ `new` 之后的名称指向一个包含抽象成员的 trait 或类，则这些成员必须在定义匿名子类体的大括号内部被具体化。\n\n**匿名函数（anonymous\
  \ function）** —— 函数字面量（function literal）的另一个名称。\n\n**apply** —— 你可以对参数 `apply` 一个方法、函数或闭包，这意味着你在这些参数上调用了它。\n\
  \n**实参（argument）** —— 当函数被调用时，该函数的每个参数都会传递一个 `argument`。参数是引用实参的变量。参是在调用时传递的对象。此外，应用程序可以接收（命令行）参数，这些参数出现在传递给单例对象\
  \ main 方法的 `Array[String]` 中。\n\n**赋值（assign）** 你可以将一个对象赋值给变量。之后，该变量将引用该对象。\n\n\
  **辅助构造函数（auxiliary constructor）** —— 在类定义的大括号内部定义的额外构造函数，看起来像命名为 `this` 的方法定义，但没有结果类型。\n\
  \n**块（block）** —— 由大括号围绕的一个或多个表达式和声明。当块求值时，所有的表达式和声明都会按顺序处理，然后块将最后一个表达式的值作为自己的值。块通常用作函数体、表达式、while\
  \ 循环以及任何你想要将多个语句组合的地方。更正式地说，块是一种封装结构，你只能看到它的副作用和结果。\n\n**绑定变量（bound variable）**\
  \ —— 表达式的*绑定变量*是在表达式内部既被使用又定义的变量。例如，在函数字面量 `(x: Int) => (x, y)` 中，变量 `x` 和 `y` 都被使用了，但只有\
  \ `x` 是绑定的，因为它在表达式中被定义为 `Int`。\n\n**按名参数（by-name parameter）** —— 在参数类型前带有 `=>` 的参数，例如\
  \ `(x => Int)`。按名参数对应的参数不是在调用方法之前求值的，而是在方法内部每次通过名称引用参数时求值的。如果一个参数不是按名的，它就是*按值的*的。\n\
  \n**按值参数（by-value parameter）** —— 在参数类型前*没有*带有 `=>` 的参数，例如 `(x: Int)`。按值参数对应的参数在调用方法之前求值。按值参数与*按名参数*形成对比。\n\
  \n**类（class）** —— 用 `class` 关键字定义，*class*可以是抽象的也可以是具体的，并在实例化时对类型和值进行参数化。在 `new ArrayString`\
  \ 中，被实例化的类是 `Array`，结果值的类型是 `Array[String]`。带有类型参数的类被称为*类型构造器*（type constructor）。一个类型也可以被认为拥有一个类，例如：类型\
  \ `Array[String]` 的类是 `Array`。\n\n\n\n\n\n### 逆变 (contravariant)\n`contravariant`\
  \ 注解可以通过在类或 trait 的类型参数前加上减号（`-`）来应用于该类型参数。该类或 trait 就会与标注的参数进行逆变子类型化——即方向相反。例如，`Function1`\
  \ 在其第一个类型参数上是逆变的，因此 `Function1[Any, Any]` 是 `Function1[String, Any]` 的子类型。\n\n###\
  \ 协变 (covariant)\n`covariant` 注解可以通过在类或 trait 的类型参数前加上加号（`+`）来应用于该类型参数。该类或 trait\
  \ 就会与标注的参数进行协变子类型化——即方向相同。例如，`List` 在其类型参数上是协变的，因此 `List[String]` 是 `List[Any]`\
  \ 的子类型。\n\n### 柯里化 (currying)\n编写具有多个参数列表的的方法。例如 `def f(x: Int)(y: Int)` 是带有两个参数列表的柯里化函数。柯里化函数通过传递多个参数列表来应用，如\
  \ `f(3)(4)`。然而，也可以对柯里化函数编写 `部分应用`，如 `f(3)`。\n\n### 声明 (declare)\n你可以 `declare` 一个抽象字段、方法或类型，这为实体提供了一个名称但没有提供实现。声明（declarations）与定义（definitions）之间的区别在于，定义建立了实现。\n\
  \n### 定义 (define)\n在 Scala 程序中 `define` 某些内容是指给它一个名称和实现。你可以定义类、trait、单例对象、字段、方法、局部函数、局部变量等。由于定义总是涉及某种实现，成员是声明的。\n\
  \n### 直接子类 (direct subclass)\n一个类是其 `direct subclass`。\n\n### 直接父类 (direct superclass)\n\
  类或 trait 直接派生的类，即其在继承层次结构中相邻的类。如果 `Parent` 在 `Child` 的 `extends` 子句中，那么 `Parent`\
  \ 就是 `Child` 的直接父类。如果 trait 在 `Child` 的 `extends` 子句中，该 trait 就是 `Child` 的直接父类。如果\
  \ `Child` 没有 `extends` 子句，则 `Any` 是 `Child` 的直接父类。如果类的直接父类带有类型参数，例如 `class Child\
  \ extends Parent[String]`，则 `Child` 的直接父类仍然是 `Parent`。`Parent[String]` 是 `Child`\
  \ 的 `supertype`。\n\n### 等于 (equality)\n在没有限定的情况下，`equality` 是由 `==` 表示的值之间的关系。参见\
  \ `引用相等性`。\n\n### 表达式 (expression)\n任何产生结果的 Scala 代码片段。也可以说一个表达式 `evaluates to`\
  \ 或 `results in` 一个值。\n\n### 过滤器 (filter)\n`for` 表达式中 `if` 后面的布尔表达式。`for(i <- 1\
  \ to 10; if i % 2 == 0)`，过滤器是 `\"i % 2 == 0\"`。`if` 右侧的值是过滤器表达式。\n\n### 过滤器表达式 (filter\
  \ expression)\n`filter expression` 是 `for` 表达式中 `if` 后面的布尔表达式。`for(i <- 1 to 10;\
  \ if i % 2 == 0)`，过滤器表达式是 `\"i % 2 == 0\"`。\n\n### 一等公民函数 (first-class function)\n\
  Scala 支持 `first-class functions`，这意味着你可以用 `function literal` 语法表示函数，例如 `(x: Int)\
  \ => x + 1`，这些函数可以用对象表示，被称为 `function values`。\n\n### for 导式 (for comprehension)\n\
  `for expression` 的另一个名称。\n\n### 自由变量 (free variable)\n表达式的 `free variable` 是表达式内部使用但未在内部定义的变量。例如，在函数字面量表达式\
  \ `(x: Int) => (x, y)` 中，变量 `x` 和 `y` 都使用了，但只有 `y` 是自由变量，因为它没有在表达式内部定义。\n\n### 函数\
  \ (function)\n`function` 通过一组参数 `invoked` 以产生结果。函数拥有参数列表、体和结果类型。类、trait 或单例对象的成员称为\
  \ `methods`。在函数内部定义的函数称为 `local functions`。结果类型为 `Unit` 的函数称为 `procedures`。源代码中的匿名函数称为\
  \ `function literals`。在运行时，函数字面量被实例化为对象 `function values`。\n\n### 函数字面量 (function\
  \ literal)\nScala 源代码中没有名称的函数，用函数字面量语法指定。例如，`(x: Int, y: Int) => x + y`。\n\n###\
  \ 函数值 (function value)\n可以像其他函数一样被调用的函数对象。函数值的类扩展了 `scala` 包中的 `FunctionN` trait（例如\
  \ `Function0`, `Function1`），并通常在源代码中通过 `function literal` 语法表示。当调用其 `apply` 方法时，函数值被“调用”。捕获自由变量的函数值\
  \ `closure`。\n\n### 函数式风格 (functional style)\n编程的 `functional style` 强调函数，而弱化操作发生的顺序。该风格的特点是传递函数值、不可变数据和带有副作用的方法。它是\
  \ Haskell 和 Erlang 等语言的主流范式，与 `imperative style` 相对。\n\n### 生成器 (generator)\n`generator`\
  \ 在 `for` 表达式中定义一个命名的 `val` 并为其赋值一系列值。例如，在 `for(i <- 1 to 10)` 中，生成器是 `\"i <- 1\
  \ to 10\"`。\n\n### 生成器表达式 (generator expression)\n`generator expression` 在 `for`\
  \ 表达式中生成一系列值。在 `for(i <- 1 to 10)` 中，生成器是 `\"1 to 10\"`。\n\n### 通用类 (generic class)\n\
  `generic class` 带有类型参数。例如，因为 `scala.List` 带有类型参数，所以 `scala.List` 是一个通用类。\n\n###\
  \ 通用 trait (generic trait)\n`generic trait` 带有类型参数。例如，因为 `scala.collection.Set`\
  \ 带有类型参数，所以它是一个通用 trait。\n\n### 辅助函数 (helper function)\n`helper function` 的目的是为一个或多个函数提供服务。辅助函数通常实现为局部函数。\n\
  \n### 辅助方法 (helper method)\n类成员的 `helper method`。辅助方法通常是私有的。\n\n### 不可变 (immutable)\n\
  如果一个对象在创建后无法以任何可见的方式更改，则它就是 `immutable`。对象可能是也可能不可变的。\n\n### 命令式风格 (imperative style)\n\
  编程的 `imperative style` 强调操作的顺序。该风格的特点是循环迭代、原地修改数据和带有副作用的方法。它是 C、C++、C# 和 Java 等语言的主流范式，与\
  \ `functional style` 相对。\n\n### 初始化 (initialize)\n当在 Scala 源代码中定义变量时，你必须用一个对象 `initialize`\
  \ 它。\n\n### 实例 (instance)\n`instance`（或类实例）是一个对象，这是一个只存在于运行的概念。\n\n### 实例化 (instantiate)\n\
  `instantiate` 一个类是指从类创建一个新对象，这是一个只发生在运行的操作。\n\n### 不变性 (invariant)\n`Invariant`\
  \ 有两种用法。它可以指数据结构良好时始终成立的属性。例如，排序二叉树的一个不变性是：如果存在右子节点，则每个节点在其之前。`Invariant` 有时也用作非变的同义词：“class\
  \ Array 在其类型参数上是不变的”。\n\n### 调用 (invoke)\n你可以通过参数 `invoke` 一个方法、函数或闭包，这意味着将使用指定的参数执行其体。\n\
  \n### JVM\n`JVM` 是托管运行 Scala 程序的 Java 虚拟机，或 `runtime`。\n\n\n\n\n\n### local function\
  \ (局部函数)\n`local function` 是定义在块内部的 `def`。相比之下，定义为类、`trait` 或单例对象成员的 `def` 被称为 `method`（方法）。\n\
  \n### local variable (局部变量)\n`local variable` 是定义在块内部的 `val` 或 `var`。虽然与局部变量相似，函数的参数不被称为局部变量，而简单称为参数或不带“local”前缀的“变量”。\n\
  \n### member (成员)\n`member` 是类、`trait` 或单例对象模板中的任何命名元素。可以通过其所有者的名称、点符号和其简单名称来访问成员。例如，在类中定义的顶层字段和方法是该类的成员。在类内部定义的\
  \ `trait` 是其闭包类的成员。在类中用 `type` 关键字定义的类型是该类的成员。`class` 是其定义所在包的成员。相比之下，局部变量或局部函数不是其外层块的成员。\n\
  \n### message (消息)\nActor（Actor）之间通过互相发送 `messages`（消息）进行通信。发送消息不会中断接收者正在执行的操作。接收者可以等待直到其完成当前活动并重新建立其不变性。\n\
  \n### meta-programming (元编程)\n元编程软件是指输入本身是软件的软件。编译器是元程序，`scaladoc` 等工具也是。为了对 `annotation`（注解）进行任何操作，则需要元编程软件。\n\
  \n### method (方法)\n`method` 是作为某个类、`trait` 或单例对象成员的函数。\n\n### mixin (混入)\n当 `trait`\
  \ 被用于混入组合（mixin composition）时，它被称为 `Mixin`。换句话说，在 \"trait Hat\" 中，`Hat` 只是一个 `trait`；但在\
  \ \"new Cat extends AnyRef with Hat\" 中，`Hat` 可以被称为 mixin。当作为动词使用时，\"mix in\" 是两个单词。例如，你可以将\
  \ `traits` `mix` `in`to 类或其他 `trait` 中。\n\n### mixin composition (混入组合)\n将 `trait`\
  \ 混入到类或其他 `trait` 中的过程。`Mixin composition` 与传统的多继承的区别在于：超类引用的类型在定义 `trait` 时是未知的，而是每当该\
  \ `trait` 混入类或其他 `trait` 时重新确定的。\n\n### modifier (修饰符)\n一种以某种方式限定类、`trait`、`field`（字段）或方法定义的关键字。例如，`private`\
  \ 修饰符表示正在定义的类、`trait`、`field` 或方法是私有的。\n\n### multiple definitions (多重定义)\n如果使用语法\
  \ `val v1, v2, v3 = exp`，则相同的表达式可以在 `multiple definitions` 中被多次赋值。\n\n### nonvariant\
  \ (非变体)\n类或 `trait` 的类型参数默认是 `nonvariant` 的。此时，当该参数变化时，类或 `trait` 不会发生子类型化。例如，因为\
  \ `class Array` 在其类型参数是非变体的，所以 `Array[String]`既不是 `Array[Any]` 的子类型也不是超类型。\n\n###\
  \ operation (操作)\n在 Scala 中，每个 `operation`（操作）都是方法调用。方法可以通过 `operator notation`（运算符符号法）调用，例如\
  \ `b + 2`，在这种符号法下，`+` 是一个 `operator`（运算符）。\n\n### parameter (参数)\n函数可以接受零到多个 `parameters`。每个参数都有一个名称和一个类型。参数与参数（arguments）的区别在于，参数是指函数被调用时传递的实际对象。参数是指引用这些传递参数的变量。\n\
  \n### parameterless function (无参数函数)\n一种不接受任何参数的函数，定义时不带任何空括号。无参数函数的调用可以提供括号。这支持了\
  \ `uniform access principle`（统一访问原则），使得 `def` 可以在不需要更改客户端代码的情况下被更改为 `val`。\n\n###\
  \ parameterless method (无参数方法)\n`parameterless method` 是作为类、`trait` 或单例对象成员的无参数函数。\n\
  \n### parametric field (参数化字段)\n作为类参数定义的字段。\n\n### partially applied function (部分应用函数)\n\
  在表达式中使用但缺少了部分参数的函数。例如，如果函数 `f` 的类型为 `Int => Int => Int`，那么 `f` 和 `f(1)` 都是 `partially\
  \ applied functions`（部分应用函数）。\n\n### path-dependent type (路径依赖类型)\n类似 `swiss.cow.Food`\
  \ 的类型。`swiss.cow` 部分是一个形成对象引用的 `path`（路径）。该类型的含义取决于你用于访问它的路径。例如，类型 `swiss.cow.Food`\
  \ 和 `fish.Food` 是不同的类型。\n\n### pattern (模式)\n在 match 表达式的备选分支中，`pattern`（模式）跟在每个\
  \ `case` 关键字之后，并位于 `pattern guard`（模式守卫）或 `=>` 符号之前。\n\n### pattern guard (模式守卫)\n\
  在 match 表达式的备选分支中，`pattern guard` 可以跟在 `pattern` 之后。例如，在 \"case x if x % 2 == 0\
  \ => x + 1\" 中，模式守卫是 \"if x % 2 == 0\"。只有当模式匹配且模式守卫返回真时，带有守卫的 case 才会被选中。\n\n###\
  \ predicate (谓词)\n`predicate`（谓词）结果类型为 `Boolean` 的函数。\n\n### primary constructor\
  \ (主构造函数)\n类的主构造函数，它在必要时调用父类构造函数，将字段初始化为传递的值，并执行在类的大括号之间定义的任何顶层代码。字段仅对未传递给父类构造函数的值参数进行初始化，类体中未使用且可以被优化掉的参数除外。\n\
  \n### procedure (过程)\n`procedure`（过程）是结果类型为 `Unit` 的函数，因此它的执行完全是为了其副作用。\n\n### reassignable\
  \ (可重新赋值的)\n变量可能是或不是 `reassignable` 的。`var` 是可重新赋值的，而 `val` 不是。\n\n### recursive\
  \ (递归)\n如果函数调用自身，则它是 `recursive`（递归的）。如果函数在最后一个表达式调用自身，则该函数是 `tail recursive`（尾递归）。\n\
  \n### reference (引用)\n`reference`（引用）是 JVM 堆上对象的 Java 抽象。引用类型持有引用，因为 `AnyRef` 的实例。相比之下，值类型变量有时持有引用（到包装类型），有时不持有（当对象表示为原始值时）。泛泛地说，Scala\
  \ 变量 `refers`（引用）一个对象。如果 `Int` 类型的变量当前表示为原始值，那么它仍然引用 Int 对象，但不再涉及引用。\n\n### reference\
  \ equality (引用相等性)\n`Reference equality`（引用相等性）意味着两个引用指向同一个 Java 对象。对于引用类型，可以通过调用\
  \ `AnyRef` 中的 `eq` 来确定引用相等性。（在 Java 程序中，可以使用 == 来确定引用相等性。）\n\n### reference type\
  \ (引用类型)\n`reference type` 是 `AnyRef` 的子类。引用类型的实例运行时始终位于 JVM 堆上。\n\n### referential\
  \ transparency (引用透明性)\n独立于时间上下文且没有副作用的函数的属性。对于特定的输入，引用透明函数的调用可以替换为其结果而不改变程序语义。\n\
  \n### refers (引用)\n运行中 Scala 程序的变量始终 `refers`（引用）某个对象。即使该变量被赋值为 null，它在概念上也引用 Null\
  \ 对象。在运行时，对象可能由 Java 对象或原始类型的值实现，但 Scala 允许程序员以更高的抽象级别来思考其运行的代码。参见 *reference*。\n\
  \n### refinement type (细化类型)\n通过在大括号内提供若干成员来构的类型。大括号内的成员细化了基类型中存在的类型。例如，“吃草动物”的类型是\
  \ `Animal { type SuitableFood = Grass }`。\n\n### result (结果)\nScala 程序中的表达式产生一个\
  \ `result`（结果）。Scala 中每个表达式的结果都是一个对象。\n\n### result type (结果类型)\n方法的 `result type`\
  \ 是调用方法时产生的值类型。（在 Java 中，这一概念被称为返回类型。）\n\n\n\n\n\n**return**（返回）Scala 程序中的函数`returns`一个值。你可以将此值称为函数的\
  \ `result`（结果）。你也可以说该函数`results in`该值。Scala 中每个函数的结果都是一个对象。\n\n**runtime**（运行时）托管正在运行的\
  \ Scala 程序的 Java 虚拟机，或 `JVM`。`Runtime`（运行时）包含了由 Java 虚拟机规范定义的虚拟虚拟机，以及 Java API 和标准\
  \ Scala API 的运行时库。短语 `at run time`（`run` 和 `time` 之间有一个空格）意味着程序正在运行时，与编译时（compile\
  \ time）形成对比。\n\n**runtime type**（运行时类型）对象在运行时的类型。相比之下，`static type`（静态类型）是表达式在编译时的类型。大多数运行时类型仅仅是不带类型参数的裸类。例如，`\"\
  Hi\"` 的运行时类型是 `String`，而 `(x: Int) => x + 1` 的运行时类型是 `Function1`。可以使用 `isInstanceOf`\
  \ 测试运行时类型。\n\n**script**（脚本）包含顶层定义和语句的文件，可以直接用 `scala` 运行而无需显式编译。脚本必须以表达式结束，而不是定义结束。\n\
  \n**selector**（选择器）在 `match` 表达式中被匹配的值。例如，在 `\"s match { case _ => }\"` 中，选择器是 `s`。\n\
  \n**self type**（自类型）trait 的 `self type`（自类型）是 `this`（接收者）的假设类型，用于 trait 内部。任何混入该\
  \ trait 的具体类都必须确保其类型符合该 trait 的自类型。自类型最常见的用法是将一个大类拆分为几个几个 trait，如 第 29 章 所示。\n\n\
  **semi-structured data**（半结构化数据）XML 数据是半结构化的。它比扁平二进制文件或文本文件更具结构化，但没有编程语言数据结构那种完整结构。\n\
  \n**serialization**（序列化）你可以将对象 `serialize`（序列化）为字节流，然后将其保存到文件中或通过网络传输。你之后可以 `deserialize`（反序列化）该字节流（即使在不同的计算机上也可以），并获得与原始序列化对象相同的对象。\n\
  \n**shadow**（遮蔽）局部变量的新声明会 `shadow`（遮蔽）作用域内同名的变量。\n\n**signature**（签名）`Signature`\
  \ 是 `type signature`（类型签名）的缩写。\n\n**singleton object**（单例对象）用 `object` 关键字定义的对象。每个单例对象只有一个且唯一的实例。与类同名且定义在类同一个源文件中的单例对象是该类的\
  \ `companion object`（伴随对象）。该类是它的 `companion class`（伴随类）。没有伴随类的单例对象是 `standalone\
  \ object`（独立对象）。\n\n**standalone object**（独立对象）没有伴随类的单例对象。\n\n**statement**（语句）表达式、定义或导入，即\
  \ `i.e.`（即），是指可以放入 Scala 源代码的模板或块中的内容。\n\n**static type**（静态类型）参见 `type`。\n\n**subclass**（子类）一个类是它所有超类和超\
  \ trait 的 `subclass`（子类）。\n\n**subtrait**（子 trait）一个 trait 是它所有超 trait 的 `subtrait`（子\
  \ trait）。\n\n**subtype**（子类型）Scala 编译器允许在任何需要该类型的地方使用该类型的任何 `subtypes`（子类型）。对于不接受类型参数的类和\
  \ trait，子类型关系镜像了子类关系。例如，如果 `class Cat` 是 `abstract class Animal` 的子类，且都不接受类型参数，那么\
  \ `type Cat` 就是 `type Animal` 的子类型。同样，如果 `trait Apple` 是 `trait Fruit` 的子 trait，且都不接受类型参数，那么\
  \ `type Apple` 就是 `type Fruit` 的子类型。然而，对于带有类型参数的类和 trait，变性（variance）会起作用。例如，因为\
  \ `abstract class List` 被声明在其唯一的类型参数是协变的（即，`List` 被声明为 `List[+A]`），因此 `List[Cat]`\
  \ 是 `List[Animal]` 的子类型，`List[Apple]` 是 `List[Fruit]` 的子类型。尽管这些类型的类都是 `List`，这些子类型关系仍然存在。相反，由于\
  \ `Set` 未被声明在其类型参数是协变的（即，`Set` 被声明为 `Set[A]` 且没有加号），因此 `Set[Cat]` `not`（不是） `Set[Animal]`\
  \ 的子类型。子类型应该正确实现其父类型的契约，以便适用于里氏夫替换原则（Liskov Substitution Principle），但编译器仅在类型检查层面验证这一属性。\n\
  \n**superclass**（超类）类的 `superclasses` 包括其直接超类、其直接超类的直接超类等，一直向上推导直到 `Any`。\n\n**supertrait**（超\
  \ trait）类或 trait 的 `supertraits`（如果有的话）包括直接混入该类或 trait 或其任何超类的所有 trait，加上这些 trait\
  \ 的任何超 trait。\n\n**supertype**（父类型）一个类型是它所有子类型的 `supertype`（父类型）。\n\n**synthetic\
  \ class**（合成类）`synthetic class`（合成类）是由编译器自动生成的，而不是由程序员手写的。\n\n**tail recursive**（尾递归）如果函数调用自身的唯一地方是函数的最后操作，则该函数是\
  \ `tail recursive`（尾递归的）。\n\n**target typing**（目标类型推断）`Target typing`（目标类型推断）是类型推断的形式，考虑了预期的类型。例如，在\
  \ `nums.filter((x) => x > 0)` 中，Scala 编译器推断 `x` 的类型。\n\n**template**（模板）`template`（模板）是类、trait\
  \ 或对象的体。它定义了 `type signature`（类型签名）、行为和初始状态。\n\n**trait**（ trait）用 `trait` 关键字定义的\
  \ trait  类似于不接受值参数的抽象类，可以通过 `mixin`（混入）过程“混入”类或 trait。当 trait 被参数化时，它被称为 `mixin`。\n\
  \n**type**（类型）Scala 程序中的每个变量和表达式都有编译时已知的 `type`（类型）。类型限制了运行时变量可以引用或表达式可以产生的可能值。需要时，变量或表达式的类型也可以称为\
  \ `static type`（静态类型），以区别于对象的 `runtime type`（运行时类型）。换句话说，“类型”本身与类的区别在于，带有类型参数的类可以构造许多类型。例如，`List`\
  \ 是一个类，而不是类型。`List[T]` 是带有自由类型参数的类型。`List[Int]` 和 `List[String]` 也是类型（由于它们没有类型参数，被称为基类型\
  \ ground types）。类型可以有一个“类”或“trait”。例如，类型 `List[Int]` 的类是 `List`。类型 `Set[String]`\
  \ 的 trait 是 `Set`。\n\n**type constraint**（类型约束）某些注解是 `type constraints`（类型约束），意味着它们对类型包含的值增加了限制或约束。例如，`@positive`\
  \ 可以是 `Int` 类型的类型约束，将 32 位整数限制为整数。类型约束不受标准 Scala 编译器检查，而是由额外的工具或编译器插件检查。\n\n**type\
  \ constructor**（类型构造器）带有类型参数的类或 trait。\n\n**type parameter**（类型参数）泛型类或泛型方法的参数，必须由类型填充。例如，`class\
  \ List` 被定义为 `class List[T] { ... }`，方法 `identity`（`object Predef` 的成员）定义为 `def\
  \ identityT = x`。两种情况下的 `T` 是类型参数。\n\n**type signature**（类型签名）方法的 `type signature`（类型签名）包括其名称、参数的数量、顺序和类型（如果有），以及结果类型。类、trait\
  \ 或单例对象的类型签名包括其名称、所有成员和构造函数的类型签名，以及声明的继承和混入关系。**\n\n\n\n### 统一访问原则 (uniform access\
  \ principle)\n`uniform access principle` 指变量和无参数函数应该使用相同的语法进行访问。Scala 通过不允许在无参数函数的调用处放置括号来支持这一原则。因此，可以将无参数函数的定义更改为\
  \ `val`，或者*反之亦然*（vice versa），而不会影响客户端代码。\n\n### 不可到达 (unreachable)\n在 Scala 层面，对象可能会变得\
  \ `unreachable`（不可到达），在此时，它们占据的内存可能会被运行时回收。`Unreachable` 并不意味着未被引用（unreferenced）。引用类型（`AnyRef`\
  \ 的实例）被实现为存储在 `JVM` 堆上的对象。当一个引用类型的实例变为 `unreachable` 时，它确实变得未被引用，并且可以进行垃圾回收。值类型（`AnyVal`\
  \ 的实例）既实现为原始类型值，也实现为 Java 包装类型的实例（如 `java.lang.Integer`），它们存储在堆上。在引用这些值的变量整个生命周期内，值类型实例可以进行装箱（从原始值转换为包装对象）和解箱（从包装对象转换为原始值）。如果一个当前表示为\
  \ `JVM` 堆上包装对象的值类型实例变为 `unreachable`，它确实变得未被引用，并且可以进行垃圾回收。但如果一个当前表示为原始值的值类型变为 `unreachable`，那么它并不会变成未被引用，因为在那个时刻它并没有以对象的形式存在于\
  \ `JVM` 堆上。运行时可能会回收不可对象占据的内存，但如果 `Int` 在运行时由原始 Java `int` 实现，且它在执行方法的栈帧中占据了某些内存，那么当方法完成且栈帧被弹出时，该对象的内存就会被“回收”。引用类型（如\
  \ `Strings`）的内存在它们变为 `unreachable` 后可能会被 `JVM` 的垃圾回收器回收。\n\n### 未引用 (unreferenced)\n\
  参见 `unreachable`。\n\n### 值 (value)\nScala 中任何计算或表达式的结果都是一个 `value`，在 Scala 中，每个值都是对象。`value`\
  \ 一词本质上是指对象在内存中（在 `JVM` 的堆或栈上）的映像。\n\n### 值类型 (value type)\n`value type` 是 `AnyVal`\
  \ 的任何子类，如 `Int`、`Double` 或 `Unit`。该术语在 Scala 代码层面具有意义。在运行时，对应于 Java 原始类型的值类型实例可能以原始类型值或包装类型实例（如\
  \ `java.lang.Integer`）的形式实现。值类型实例的生命周期内，运行时可以在原始类型和包装类型之间来回转换（即 `i.e.`，进行装箱和解箱）。\n\
  \n### 变量 (variable)\n引用对象的命名实体。变量可以是 `val` 或 `var`。所有的 `vals` 和 `vars` 在定义时必须初始化，但只有\
  \ `vars` 可以在之后重新赋值以引用不同的对象。\n\n### 变体 (variance)\n类或 trait 的类型参数可以用 `variance` 注解标记，可以是协变的\
  \ `covariant` (+) 或逆变的 `contravariant` (-)。此类变体注解指示了泛型类或 trait 如何处理子类型。例如，泛型类 `List`\
  \ 在其类型参数上是协变的，因此 `List[String]` 是 `List[Any]` 的子类型。默认情况下（即 `i.e.`），在缺少 `+` 或 `-`\
  \ 注解的情况下，类型参数是非变体的（nonvariant）。\n\n### 通配类型 (wildcard type)\n通配类型包含对未知类型变量的引用。例如，`Array[_]`\
  \ 是一个通配类型。它是一个元素类型完全未知的数组。\n\n### 生成 (yield)\n表达式可以 `yield` 一个结果。`yield` 关键字指定 `for`\
  \ 表达式的结果。\n\n# 参考文献\n\n| [Ray99] | Raymond, Eric. *The Cathedral & the Bazaar: Musings\
