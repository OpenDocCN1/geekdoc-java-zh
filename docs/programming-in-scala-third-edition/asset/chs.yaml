  \n### 步骤 3. 定义一些函数\n\n现在你已经接触了 Scala 变量，你可能想写一些函数。在 Scala 中是这样做的：\n\n```\nscala>\
  \ def max(x: Int, y: Int): Int = {\n          if (x > y) x\n          else y\n \
  \     }\n  max: (x: Int, y: Int)Int\n```\n\n函数定义以 `def` 开始。函数名（在本例中为 `max`）后面跟着括号内逗号分隔的参数列表。每个函数参数后面都必须跟上类型注解，并以冒号。\n\
  \n\n\n\n\n注意此脚本包含了一个注释。Scala 编译器会忽略 `//` 到下一行末尾之间的字符，以及 `/*` 和 `*/` 之间的任何字符。此示例还展示了使用\
  \ `+` 运算符进行字符串拼接。这正如你预期的那样工作。表达式 `\"Hello, \" + \"world!\"` 将导致字符串 `\"Hello,  world!\"\
  `。\n\n### 步骤 5. 使用 while 循环；使用 if 进行判断\n\n要尝试使用 `while`，请在名为 `printargs.scala` 的文件中输入以下内容：\n\
  \n```\nvar i = 0\nwhile (i < args.length) {\n  println(args(i))\n  i += 1\n}\n```\n\
  \n#### 注意\n\n尽管本节的示例有助于解释 `while` 循环，但它们并没有展示最佳 Scala 风格。在下一节中，你将看到更好的方法，以避免通过索引遍历数组。\n\
  \n该脚本从变量定义 `var i = 0` 开始。类型推断为 `i` 分配了 `scala.Int` 类型，因为这是它的初始值 `0` 的类型。下一行的 `while`\
  \ 结构会导致 `block`（大括号之间的代码）重复执行，直到布尔表达式 `i < args.length` 为假。`args.length` 返回 `args`\
  \ 数组的长度。该块包含两个语句，每个语句都缩进两个空格，这是 Scala 推荐的缩进风格。第一个语句 `println(args(i))` 打印第 i 个命令行参数。第二个语句\
  \ `i += 1` 将 `i` 加 1。请注意，Java 的 `++i` 和 `i++` 在 Scala 中不起用。要在 Scala 中进行递增，你需要说 `i\
  \ = i + 1` 或 `i += 1`。使用以下命令运行此脚本：\n\n```\n$ scala printargs.scala Scala is fun\n\
  ```\n\n你应该看到：\n\n```\nScala\n  is\n  fun\n```\n\n为了增加趣味性，请在一个名为 `echoargs.scala`\
  \ 的新文件中输入以下代码：\n\n```\nvar i = 0\nwhile (i < args.length) {\n  if (i != 0)\n   \
  \ print(\" \")\n  print(args(i))\n  i += 1\n}\nprintln()\n```\n\n在这个版本中，你用 `print`\
  \ 调用替换了 `println` 调用，因此所有参数都会打印在同一行。为了使其可读性，你通过 `if (i != 0)` 结构在第一个参数以外的每个参数之前插入了一个空格。由于\
  \ `i != 0` 在第一次执行 `while` 循环时为假，因此在初始参数之前不会打印空格。最后，你在末尾又添加了一个 `println`，以便在打印所有参数后换行。你的输出将会非常漂亮。如果你使用以下命令运行此脚本：\n\
  \n```\n$ scala echoargs.scala Scala is even more fun\n```\n\n你将得到：\n\n```\nScala\
  \ is even more fun\n```\n\n注意，在 Scala 中（与 Java 中一样），你必须将 `while` 或 `if` 的布尔表达式放在括号中。（换句话说，在\
  \ Scala 中你不能像在 Ruby 等语言中那样写 `if i < 10`。在 Scala 中你必须写成 `if (i < 10)`。）另一个与 Java\
  \ 相似的之处是，如果一个代码块只有一个语句，你可以选择性省略大括号，如 `echoargs.scala` 中的 `if` 语句所示。尽管你还没有见过它们，但\
  \ Scala 确实像 Java 一样使用分号来分隔语句，但在 Scala 中分号通常是可选的，这为你的右手小指带来了欢迎的缓解。因此，如果你当时想写得啰嗦一点，可以这样编写\
  \ `echoargs.scala` 脚本：\n\n```\nvar i = 0;\nwhile (i < args.length) {\n  if (i !=\
  \ 0) {\n    print(\" \");\n  }\n  print(args(i));\n  i += 1;\n}\nprintln();\n```\n\
  \n### 步骤 6. 使用 foreach 和 for 进行迭代\n\n尽管你可能没有意识到，当你上一步中编写 `while` 循环时，你正在使用*命令式*（imperative）风格编程。在命令式风格中（你通常在\
  \ Java、C++ 和 C 等语言使用的风格），你每次给出一个命令指令，通过循环进行迭代，并且经常改变不同函数之间的共享状态。Scala 允许你进行命令式编程，但随着你对\
  \ Scala 越来越熟悉，你可能会发现自己经常以*函数式*（functional）风格进行编程。事实上，这本书的主要目标之一就是帮助你像习惯命令式风格一样习惯函数式风格。\n\
  \n函数式语言的主要特征之一是函数是一一等公民，并且……（注: 此处省略了部分重复描述，保留了核心逻辑）\n\n\n\n\n\n[1] 本书中的示例在 Scala\
