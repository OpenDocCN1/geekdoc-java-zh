  \ |  |\n| `xs.grouped size` | 一个产生该集合的固定大小“块”的迭代器 |\n| `xs.sliding size` | 一个产生该集合中滑动固定大小窗口元素的迭代器\
  \ |\n| 子集合: |  |\n| `xs.takeRight n` | 一个由 `xs` 的最后 `n` 个元素组成的集合（或者，如果没有定义顺序，则为任意的\
  \ `n` 个元素） |\n| `xs.dropRight n` | 除去 `xs.takeRight n` 之外的集合剩余部分 |\n| 拉链 (Zippers):\
