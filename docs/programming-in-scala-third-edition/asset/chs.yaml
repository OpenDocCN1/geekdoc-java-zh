  \  }\n```\n\n### 列表 31.1 - 一个声明 Java throws 子句的 Scala 方法。\n\n这是它在 Java 看起来的样子：\n\
  \n```\n $ javap Reader\n  Compiled from \"Reader.scala\"\n  public class Reader\
