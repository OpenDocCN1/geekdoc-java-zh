  \ “处理 XML”解释了如何在 Scala 中处理 XML。该章向你展示了生成 XML、解析 XML 以及解析后处理 XML 的惯用法。\n- 第 29 章\
  \ “使用对象的模块化编程”展示了你如何将 Scala 的对象作为模块系统使用。\n- 第 30 章 “对象等性”指出了编写 `equals` 方法时需要考虑的几个问题。有几个需要避免的陷阱。\n\
