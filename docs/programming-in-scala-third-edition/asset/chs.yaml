- "# Scala 编程入门指南，第三版\n\n\n\n\n# 对《Programming in Scala》早期版本的赞誉\n\n`Programming in\
  \ Scala` 可能是我读过的最好的编程书籍之一。我喜欢它的写作风格、简洁性以及详尽的解释。这本书似乎能回答我脑海中浮现的每一个问题——它总是比我快出一一步。作者们不仅仅是丢给你一些代码并认为一切都是理所当然的。他们给你的是“干货”，让你真正理解背后的原理。我非常喜欢这一点。\n\
  \n- Ken Egervari，首席软件架构师\n\n`Programming in Scala` 写得清晰、详尽且易于理解。书中处处都有精彩的示例和实用的提示。它让我们的组织能够快速、高效地上手\
  \ `Scala` 语言。对于任何试图理解 `Scala` 语言灵活性和优雅性的程序员来说，这本书都是极佳的。\n\n- Larry Morroni，Morroni\
  \ Technologies, Inc. 所有人\n\n《Programming in Scala》一书是 `Scala` 语言的极佳教程。通过阅读这本书，内容逻辑非常顺畅，每一章都建立在前章节描述的概念和示例之上。书中通过深入解释了语言结构，并经常提供该语言与\
  \ `Java` 区别的示例。除了主语言外，还涵盖了如容器（containers）和 Actor（actors）等库。\n\n我发现这本书非常易读，它可能是我最近读过的写得最好的技术书籍之一。我真的会向任何想要了解更多\
  \ `Scala` 语言的程序员推荐这本书。\n\n- Matthew Todd\n\n`Programming in Scala` 作者们所付出的努力令我惊叹。这本书是一份无价的指南，通向我所称的\
  \ `Scala` 平台（Scala the Platform）：一个通往更佳代码的工具，是可扩展软件设计与实现的永恒灵感来源。如果 2003 年，当我正在为\
  \ 2004 年雅典奥运会门户网站的基础设施部分进行协同设计和实现时，我的桌上就有处于目前成熟状态的 `Scala` 和这本书就好了！\n\n致所有读者：无论你们的编程背景如何，我觉得你们会发现在\
  \ `Scala` 中编程是解放性的，而这本书将成为你们旅程中的忠实朋友。\n\n- Christos KK Loverdos，软件顾问、研究员\n\n`Programming\
  \ in Scala` 是对 `Scala` 极佳的深度介绍，它也是一本非常好的参考书。我会说它在我书架上占据了显要的位置，只不过是我现在几乎去到哪里都带着它。\n\
  \n- Brian Clapper，ArdenTex, Inc. 主席\n\n好书，写得很好，示例也深思熟虑。我会向资深程序员和新手都推荐此书。\n\n- Howard\
  \ Lovatt\n\n《Programming in Scala》这本书不仅关于“如何”（how），更重要的是关于“为什么”（why）要用这种新编程语言开发程序。书中在介绍结合面向对象编程和函数式编程的力量时，其务实的方法让读者对\
  \ `Scala` 究竟是什么不再产生怀疑。\n\n- Dr. Ervin Varga，CEO/创始人，EXPRO I.T. Consulting\n\n这是一本针对面向对象（OO）程序员的函数式编程极佳介绍。学习\
  \ `FP` 是我的主要目标，但也接触了一些很棒的 `Scala` 惊喜，比如案例类（case classes）和模式匹配（pattern matching）。`Scala`\
  \ 是一门引人入胜的语言，这本书涵盖得很好。\n\n在语言介绍书中，提供信息过多或不足之间总有一条微妙的界限。我觉得 `Programming in Scala`\
  \ 实现了完美的平衡。\n\n- Jeff Heon，程序员分析师\n\n我买了由 `Odersky`、`Spoon` 和 `Venners` 编写的《Programming\
  \ in Scala》早期电子版，立刻成了它的粉丝。除了包含了关于语言最全面的信息外，电子格式的几个关键特性也留下了深刻印象。我从未在 `PDF` 中看到过如此优秀的链接，不仅用于书签，还从目录和索引提供了活动链接。我不知道为什么没有更多作者使用这个功能，因为这对于读者来说真的是一种享受。另一个令我印象深刻的功能是通往论坛（\"\
  Discuss”）的链接，以及通过电子邮件向作者发送反馈（\"Suggest”）的方法。反馈功能本身并不罕见，但在发送给作者的内容中简单包含页码，这对作者和读者来说都有价值。如果过程更繁琐的话，我提供的评论会比现在多。\n\
  \n为了内容请阅读《Programming in Scala》，但如果你读的是电子版，一定要利用作者们精心构建的数字功能！\n\n- Dianne Marsh，SRT\
  \ Solutions 创始人/软件顾问\n\n清晰性和技术上的完备性是任何优秀书籍的标志，我祝贺 `Martin Odersky`、`Lex Spoon` 和\
  \ `Bill Venners` 做得非常出色！《Programming in Scala》首先通过基础概念建立起坚实的基础，并将用户引导到中级及以上水平。这本书对于任何渴望学习\
  \ `Scala` 的人来说绝对是必买。\n\n- Jagan Nambi，GMAC Financial Services 企业架构师\n\n`Programming\
  \ in Scala` 读起来是一种享受。它是这类优秀的技术书籍之一，以极其简洁和优雅的方式对主题进行了深入且全面的涵盖。\n\n书的组织非常自然且符合逻辑。它同样适合想要跟上最新趋势的技术奇才，也适合寻求深度理解语言核心特征及其设计原理的专业人士。我强烈推荐给所有对通用函数式编程感兴趣的人。对于\
  \ `Scala` 开发者来说，这本书无条件必读。\n\n- Igor Khlystov，Greystone Inc. 软件架构师/首席程序员\n\n《Programming\
  \ in Scala》这本书流溢着作者付出的巨大心血。我从未读过任何一本既是入门级、又全面的教程类书籍：在大多数教程中，为了（可能是误导的）让内容变得易于上手且不“困扰”读者，往往忽略了主题中超出当前水平的部分。这留下了非常糟糕的感觉，因为人们永远无法确定自己的理解程度。总会有一些未解释的残留“魔法”，读者无法对其做出判断。这本书从未这样做，它从不认为任何事情是理所当然：每一个细节都得到了充分解释，或者提供了后续解释的引用。确实，文中大量的交叉引用和索引，使得构建复杂主题的全景相对容易。\n\
  \n- Gerald Loeffler，企业 Java 架构师……你在这里找到学习这门充满前景的语言所需。\n\n- Christian Neukirchen\n\
