  \ 和 [[Emi07]](#bibliography.html_scala-ecoop07)。\n\n# 第 2 章：Scala 的第一步\n\n是时候写一些\
  \ Scala 代码了。在我们开始深入的 Scala 教程之前，我们安排了两个章节让你对 Scala 有整体认识，最重要的是让你开始编写代码。我们鼓励你在学习过程中尝试本章和下一章中展示的所有代码示例。学习\
  \ Scala 的最好方法就是用它编程。\n\n要运行本章中的示例，你需要安装标准的 Scala。要获取安装，请访问 [`www.scala-lang.org/downloads`](http://www.scala-lang.org/downloads)\
  \ 并按照你平台的说明操作。你也可以使用 Eclipse、IntelliJ 或 NetBeans 的 Scala 插件。对于本章中的步骤，我们假设你使用的是来自\
  \ [scala-lang.org](http://www.scala-lang.org) 的 Scala 发行版。[1]](#first-steps-in-scala.html_footnotemain2-1)\n\
  \n如果你是一个资深程序员，接下来的两个章节将给你足够的理解，让你开始用 Scala 编写实用程序。如果你经验较少，有些内容对你来说可能有些神秘。但不要担心。为了让你快速进入状态，我们省略了一些细节。所有内容将在后面的章节中以不那么“喷射式”的方式解释。此外，我们在接下来的两个章节中插入了许多脚注，引导你查看书中后面的章节，在那里你可以找到更详细的解释。\n\
  \n### 步骤 1 学习使用 Scala 解释器\n\n开始学习 Scala 的简单方法是使用 Scala 解释器，这是一个编写 Scala 表达式和程序的交互式“壳”。解释器名为\
  \ `scala`，会对你输入的表达式并打印结果。[2]](#first-steps-in-scala.html_footnotemain2-2)\n\n```\n\
  $ scala\n  Welcome to Scala version 2.11.7\n  Type in expressions to have them evaluated.\n\
  \  Type :help for more information.\n\n  scala>\n```\n\n当你输入一个表达式例如 `1 + 2` 并按回车后：\n\
  \n```\nscala> 1 + 2\n```\n\n解释器将打印：\n\n```\nres0: Int = 3\n```\n\n这包含：\n*   自动生成的或定义的名称（`res0`，表示结果\
  \ 0），\n*   冒号（`:`），后面是表达式的类型（`Int`），\n*   等号（`=`），\n*   从表达式计算的值（`3`）。\n\n类型 `Int`\
  \ 命名了 `scala` 包中的 `Int` 类。Scala 的包类似于 Java 的包：它们划分了全局命名空间并提供了一种信息隐藏机制。[3]](#first-steps-in-scala.html_footnotemain2-3)\
  \ `Int` 类的值对应 Java 的 `int` 值。更通用地说，Java 的所有原生类型在 `scala` 包中都有对应的类。例如，`scala.Boolean`\
  \ 对应 Java 的 `boolean`。`scala.Float` 对应 Java 的 `float`。当你编译 Scala 代码为 Java 字节码时，Scala\
  \ 编译器将尽可能使用 Java 的原生类型以获得原生类型的性能优势。\n\n### 步骤 2 定义变量\n\nScala 有两种变量：`val` 和 `var`。`val`\
  \ 类似于 Java 中的 `final` 变量。一旦初始化，`val` 永远无法重新赋值。相比之下，`var` 类似于 Java 中的非 final 变量。`var`\
  \ 在其生命周期内可以重新赋值。这里有一个 `val` 的定义：\n\n```\nscala> val msg = \"Hello, world!\"\n  msg:\
  \ String = Hello, world!\n```\n\n\n\n这条语句引入了 `msg` 作为字符串 \"Hello, world!\" 的名称。`msg`\
  \ 的类型是 `java.lang.String`，因为 Scala 字符串是由 Java 的 `String` 类实现的。\n\n如果你习惯在 Java 中声明变量，你会发现这里有一个显著的区别：在\
  \ `val` 的定义中，`java.lang.String` 或 `String` 都没有出现过。这个例子说明了*类型推断*（type inference），即\
  \ Scala 能够识别你省略的类型的能力。在这种情况下，由于你使用字符串字面量初始化了 `msg`，Scala 推断出 `msg` 的类型为 `String`。当\
  \ Scala 解释器（或编译器）能够推断类型时，最好让它这样做完成，而不是在代码中填满不必要的、显式的类型注解。不过，如果你愿意，也可以显式地指定类型，而且有时你可能应该这样做。显式类型注解既可以确保\
  \ Scala 编译器推断出你预期的类型，又能为代码未来的阅读者提供有用的文档。与 Java 不同（Java 在变量名之前指定类型），而在 Scala 中，你在变量名之后指定类型，并用冒号隔开。例如：\n\
  \n```\nscala> val msg2: java.lang.String = \"Hello again, world!\"\n  msg2: String\
  \ = Hello again, world!\n```\n\n或者，由于 `java.lang` 类型在 程序 程序中可以使用简单名称可见，只需写为：\n\n\
  ```\nscala> val msg3: String = \"Hello yet again, world!\"\n  msg3: String = Hello\
  \ yet again, world!\n```\n\n回到原始的 `msg`，现在它已经定义了，你可以像预期那样使用它，例如：\n\n```\nscala>\
  \ println(msg)\n  Hello, world!\n```\n\n由于 `msg` 是一个 `val` 而不是 `var`，你无法对它进行重新赋值。例如，看一眼当你尝试以下操作时，解释器是如何报错的：\n\
  \n```\nscala> msg = \"Goodbye cruel world!\"\n  <console>:8: error: reassignment\
  \ to val\n        msg = \"Goodbye cruel world!\"\n               ^\n```\n\n如果你想进行重新赋值，你需要使用\
  \ `var`，如下：\n\n```\nscala> var greeting = \"Hello, world!\"\n  greeting: String\
  \ = Hello, world!\n```\n\n由于 `greeting` 是 `var` 而不是 `val`，你以后可以重新赋值它。如果你之后心情不佳，例如，你可以将问候语改为：\n\
  \n```\nscala> greeting = \"Leave me alone, world!\"\n  greeting: String = Leave\
  \ me alone, world!\n```\n\n要在解释器中输入多行内容，只需在第一行之后继续输入即可。如果你目前输入的代码尚不完整，解释器会在下一行显示一个竖线（|）。\n\
  \n```\nscala> val multiLine =\n      |   \"This is the next line.\"\n  multiLine:\
  \ String = This is the next line.\n```\n\n如果你意识到自己写错了什么，但解释器仍在等待更多输入，可以通过连续两次回车键来退出：\n\
  \n```\nscala> val oops =\n      | \n      | \n  You typed two blank lines. Starting\
  \ a new command.\n\n  scala>\n```\n\n在书的其余部分，我们将省略竖线，以便代码更易读（也更便于从 PDF 电子书复制粘贴到解释器中）。\n\
  \n### 步骤 3. 定义一些函数\n\n现在你已经接触了 Scala 变量，你可能想写一些函数。在 Scala 中是这样做的：\n\n```\nscala>\
  \ def max(x: Int, y: Int): Int = {\n          if (x > y) x\n          else y\n \
  \     }\n  max: (x: Int, y: Int)Int\n```\n\n函数定义以 `def` 开始。函数名（在本例中为 `max`）后面跟着括号内逗号分隔的参数列表。每个函数参数后面都必须跟上类型注解，并以冒号。当\
  \ Scala 解释器（或编译器）能够推断类型时，最好让它这样做完成，而不是在代码中填满不必要的、显式的类型注解。不过，如果你愿意，也可以显式地指定类型，而且有时你可能应该这样做。显式类型注解既可以确保\
  \ Scala 编译器推断出你预期的类型，又能为代码未来的阅读者提供有用的文档。与 Java 不同（Java 在变量名之前指定类型），而在 Scala 中，你在变量名之后指定类型，并用冒号隔开。例如：\n\
  \n```\nscala> val msg2: java.lang.String = \"Hello again, world!\"\n  msg2: String\
  \ = Hello again, world!\n```\n\n或者，由于 `java.lang` 类型在 Scala 程序中可以使用简单名称可见，只需写为：\n\
  \n```\nscala> val msg3: String = \"Hello yet again, world!\"\n  msg3: String = Hello\
  \ yet again, world!\n```\n\n回到原始的 `msg`，现在它已经定义了，你可以像预期那样使用它，例如：\n\n```\nscala>\
  \ println(msg)\n  Hello, world!\n```\n\n由于 `msg` 是一个 `val` 而不是 `var`，你无法对它进行重新赋值。例如，看一眼当你尝试以下操作时，解释器是如何报错的：\n\
  \n```\nscala> msg = \"Goodbye cruel world!\"\n  <console>:8: error: reassignment\
  \ to val\n        msg = \"Goodbye cruel world!\"\n               ^\n```\n\n如果你想进行重新赋值，你需要使用\
  \ `var`，如下：\n\n```\nscala> var greeting = \"Hello, world!\"\n  greeting: String\
  \ = Hello, world!\n```\n\n由于 `greeting` 是 `var` 而不是 `val`，你以后可以重新赋值它。如果你之后心情不佳，例如，你可以将问候语改为：\n\
  \n```\nscala> greeting = \"Leave me alone, world!\"\n  greeting: String = Leave\
  \ me alone, world!\n```\n\n要在解释器中输入多行内容，只需在第一行之后继续输入即可。如果你目前输入的代码尚不完整，解释器会在下一行显示一个竖线。\n\
  \n```\nscala> val multiLine =\n      |   \"This is the next line.\"\n  multiLine:\
  \ String = This is the next line.\n```\n\n如果你意识到自己写错了什么，但解释器仍在等待更多输入，可以通过连续两次回车键来退出：\n\
  \n```\nscala> val oops =\n      | \n      | \n  You typed two blank lines. Starting\
  \ a new command.\n\n  scala>\n```\n\n在书的其余部分，我们将省略竖线，以便代码更易读（也更便于从 PDF 电子书复制粘贴到解释器中）。\n\
