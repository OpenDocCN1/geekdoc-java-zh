  \ `List` 类的实现。理解列表在 Scala 中如何工作至关重要，此外该实现演示了 Scala 若干功能的用法。\n- 第 23 章 “重温 for 表达式”展示了\
  \ for 表达式是如何翻译为 `map`、`flatMap`、`filter` 和 `foreach`调用的。\n- 第 24 章 “深度集合”对集合库进行了详细介绍。\n\
