  \ 第 3 章\n\n## Scala 的后续步骤\n\n本章延续了上一章对 Scala 的介绍。在本章中，我们将介绍一些高级特性。当你完成本章时，你应该具备足够的知识来开始编写实用的\
  \ Scala 脚本。与上一章一样，我们建议你在学习过程中尝试这些示例。熟悉 Scala 的最好方法是开始编写 Scala 代码。\n\n### 步骤 7. 使用类型参数化数组\n\
  \n在 Scala 中，你可以使用 `new` 来实例化对象或类实例。当你在 Scala 中实例化对象时，你可以使用值和类型对其进行 `parameterize`（参数化）。参数化意味着在创建实例时对其进行“配置”。你通过向括号中的构造函数传递对象来使用值对实例进行参数化。例如，以下\
  \ Scala 代码实例化了一个新的 `java.math.BigInteger` 并使用值 `\"12345\"` 对其进行参数化。\n\n```\nval\
  \ big = new java.math.BigInteger(\"12345\")\n```\n\n通过在方括号中指定一个或多个类型来使用类型对实例进行参数化。示例在列表\
  \ 3.1 所示。在此示例中，`greetStrings` 是一个 `Array[String]` 类型的值（一个“字符串数组”），它在代码的第一行通过对值 3\
  \ 进行参数化被初始化为长度 3。如果你以脚本形式运行列表 3.1 中的代码，你会看到另一个 Hello, world! 问候。注意，当你同时使用类型和值对实例进行参数化时，类型位于方括号中，随后是括号中的值。\n\
  \n```\nval greetStrings = new ArrayString\n\n  greetStrings(0) = \"Hello\"\n  greetStrings(1)\
  \ = \", \"\n  greetStrings(2) = \"world!\\n\"\n\n  for (i <- 0 to 2)\n    print(greetStrings(i))\n\
  ```\n\n#### 列表 3.1 - 使用类型参数化数组。\n\n#### 注意\n\n尽管列表 3.1 中的代码展示了重要的概念，但它并没有展示 Scala\
  \ 中创建和初始化数组的推荐方法。你将在列表 3.2 此处看到更好的方法。\n\n如果你想写得更显式，可以这样显式地指定 `greetStrings` 的类型：\n\
  \n```\nval greetStrings: Array[String] = new ArrayString\n```\n\n考虑到 Scala 的类型推断，这行代码在语义上等同于列表\
  \ 3.1 中的实际第一行。但这种形式证明了，虽然类型参数化部分（方括号中的类型名称）是实例类型的一部分，但值参数化部分（括号中的值）不是。`greetStrings`\
  \ 的类型是 `Array[String]`，而不是 `ArrayString`。\n\n列表 3.1 中的接三行代码初始化了元素：\n\n```\ngreetStrings(0)\
  \ = \"Hello\"\ngreetStrings(1) = \", \"\ngreetStrings(2) = \"world!\\n\"\n```\n\n\
  \n\n\n```\ngreetStrings(0) = \"Hello\"\n```\n\n将被转换为：\n\n```\ngreetStrings.update(0,\
  \ \"Hello\")\n```\n\n因此，以下代码与 代码列表 3.1 中的代码在语义上等价：\n\n```\n val greetStrings = new\
  \ ArrayString\n\n  greetStrings.update(0, \"Hello\")\n  greetStrings.update(1, \"\
  , \")\n  greetStrings.update(2, \"world!\\n\")\n\n  for (i <- 0.to(2))\n    print(greetStrings.apply(i))\n\
  ```\n\nScala 通过将所有内容（从数组到表达式）视为带有方法的对象，实现了概念上的简单性。你不需要记忆特殊情况，例如 Java 中基本类型与其对应的包装类型之间的差异，或者数组与普通对象之间的差异。此外，这种统一性不会产生显著的性能代价。Scala\
  \ 编译器在编译代码中尽可能使用 Java 数组、基本类型和原生算术。\n\n尽管你到目前为止看到的示例可以正常编译和运行，但 Scala 还提供了一种更简洁的方式来创建和初始化数组，你通常会使用它（参见\
  \ 代码列表 3.2）。这段代码创建了一个长度为三的新数组，并初始化传入的字符串 zerozero\"one\" 和 \"two\"。编译器推断数组的类型为 `Array[String]`，因为你向它传递了字符串。\n\
  \n```\n val numNames = Array(\"zero\", \"one\", \"two\")\n```\n\n#### 列表 3.2 - 创建并初始化数组。\n\
  \n你在 代码列表 3.2 中实际执行的操作调用了一个名为 `apply` 的工厂方法，该方法创建并返回新数组。此 `apply` 方法接受变数量参数[[2]](#next-steps-in-scala.html_footnotemain3-2)，并定义在\
  \ `Array` 伴随对象上。你将在 第 4.3 节 中学习更多关于伴随对象的知识。如果你是 Java 程序员，可以将其认为在 `Array` 类上调用一个名为\
  \ `apply` 的静态方法。调用相同 `apply` 方法的更冗长的方式是：\n\n```\n val numNames2 = Array.apply(\"\
  zero\", \"one\", \"two\")\n```\n\n### 步骤 8. 使用列表\n\n函数式编程风格的核心思想之一是方法不应该有副作用。方法的唯一应该是计算并返回一个值。采用这种方法可以获得某些处，例如方法之间的耦合性降低了，因此更加可靠且可重用。另一个益处（在静态类型语言中）是进入和离开方法的所有内容都会经过类型检查器的检查，因此逻辑错误更有可能表现为类型错误。将这种函数式哲学应用于对象世界意味着让对象变为不可变。\n\
  \n正如你所见，Scala 数组是一个共享相同类型的可变对象序列。例如，一个 `Array[String]` 只包含字符串。虽然你不能在实例化后更改数组的长度，但你可以更改它的元素值。因此，数组是可变对象。\n\
  \n对于共享相同类型的不可变对象序列，你可以使用 Scala 的 `List` 类。与数组一样，`List[String]` 只包含字符串。Scala 的 `List`（`scala.List`）与\
  \ Java 的 `java.util.List` 类型不同之处在于 Scala 列表始终是不可变的（而 Java 列表可以是可变的）。更通地说，Scala 的\
  \ `List` 设计用于启用函数式编程风格。创建列表很容易，代码列表 3.3 展示了如何操作：\n\n```\n val oneTwoThree = List(1,\
  \ 2, 3)\n```\n\n#### 列表 3.3 - 创建并初始化列表。\n\n代码列表 3.3 中的代码建立了一个名为 `oneTwoThree` 的新\
  \ `val`，它初始化为包含整数元素 1、2 和 3 的新 `List[Int]`[[3]](#next-steps-in-scala.html_footnotemain3-3)。由于列表是不可变的，它们的行为有点像\
  \ Java 字符串：当你对列表调用一个从名称上看似乎暗示列表会发生变的方法时，它实际上创建并返回了一个带有新值的新列表。例如，`List` 有一个名为 `:::`\
  \ 的方法用于列表拼接。以下是其使用方法：\n\n```\n val oneTwo = List(1, 2)\n  val threeFour = List(3,\
  \ 4)\n  val oneTwoThreeFour = oneTwo ::: threeFour\n  println(oneTwo + \" and \"\
  \ + threeFour + \" were not mutated.\")\n  println(\"Thus, \" + oneTwoThreeFour\
  \ + \" is a new list.\")\n```\n\n如果你运行此脚本，你会看到：\n\n```\n List(1, 2) and List(3,\
  \ 4) were not mutated.\n Thus, List(1, 2, 3, 4) is a new list.\n```\n\n\n\n\n| `thrill.filter(s\
  \ => s.length == 4)` | 按顺序返回 thrill 列表中所有长度为 4 的元素列表（返回 `List(\"Will\", \"fill\"\
  )`） |\n| `thrill.forall(s => s.endsWith(\"l\"))` | 表明 thrill 列表中的所有元素是否以字母 \"l\"\
  \ 结尾（返回 `true`） |\n| `thrill.foreach(s => print(s))` | 对 thrill 列表中的每个字符串执行 `print`\
  \ 语句（打印 \"Willfilluntil\"） |\n| `thrill.foreach(print)` | 与上相同，但更简洁（同样打印 \"Willfilluntil\"\
  ） |\n| `thrill.head` | 返回 thrill 列表中的第一个元素（返回 \"Will\"） |\n| `thrill.init` | 返回\
  \ thrill 列表中除最后一个元素外的所有元素的列表（返回 `List(\"Will\", \"fill\")`） |\n| `thrill.isEmpty`\
  \ | 表明 thrill 列表为空（返回 `false`） |\n| `thrill.last` | 返回 thrill 列表中的最后一个元素（返回 \"until\"\
  ） |\n| `thrill.length` | 返回 thrill 列表中的元素数量（返回 3） |\n| `thrill.map(s => s + \"y\"\
  )` | 返回一个为 thrill 列表中每个字符串元素添加 \"y\" 后得到的列表（返回 `List(\"Willy\", \"filly\", \"untily\"\
  )`） |\n| `thrill.mkString(\", \")` | 用列表元素创建一个字符串（返回 \"Will, fill, until\"） |\n\
  | `thrill.filterNot(s => s.length == 4)` | 按顺序返回 thrill 列表中*除长度为 4 的元素*之外的所有元素列表（返回\
  \ `List(\"until\")`） |\n| `thrill.reverse` | 返回一个包含反序 thrill 列表所有元素的列表（返回 `List(\"\
  until\", \"fill\", \"Will\")`） |\n| `thrill.sort((s, t) => s.charAt(0).toLower <\
  \ t.charAt(0).toLower)` | 返回一个按首字母小写后字母顺序排列 thrill 列表所有元素的列表（返回 `List(\"fill\",\
  \ \"until\", \"Will\")`） |\n| `thrill.tail` | 返回减去第一个元素后的 thrill 列表（返回 `List(\"\
  fill\", \"until\")`） |\n\n### Step 9. 使用元组\n\n另一个有用的容器对象是元组（元组）。和列表一样，元组是不可变的，但与列表不同，元组可以包含不同类型的元素。列表可能是\
  \ `List[Int]` 或 `List[String]`，而元组可以同时包含一个整数和一个字符串。元组非常有用，例如当你需要从一个方法返回多个对象时。在 Java\
  \ 中，你通常会创建一个类似于 JavaBean 的类来持有多个返回值，而在 Scala 中，你只需要简单地返回一个元组。而且非常简单：要实例化一个包含某些对象的新元组，只需将对象放在括号中并用逗号隔开即可。一旦实例化了元组，你就可以通过点、下划线和从\
  \ 1 开始的索引来单独访问其元素。示例如 Listing 3.4 所示：\n\n```\nval pair = (99, \"Luftballons\")\n\
  \  println(pair._1)\n  println(pair._2)\n```\n\n#### Listing 3.4 - 创建并使用元组。\n\n\
  在 Listing 3.4 的第一行中，你创建了一个新的元组，包含整数 99 作为第一个元素，字符串 \"Luftballons\" 作为第二个元素。Scala\
  \ 推导出元组的类型为 `Tuple2[Int, String]`，并将该类型赋给变量 `pair`。在第二行中，你访问了 `_1` 字段，它将产生第一个元素\
  \ 99。第二行中的 `.` 与你访问字段或调用方法时使用的点 相同。在这种情况下，你正在访问一个名为 `_1` 的字段。如果你运行此脚本，你将看到：\n\n\
  ```\n99\nLuftballons\n```\n\n元组的实际类型取决于它包含的元素数量以及这些元素的类型。因此，`(99, \"Luftballons\"\
  )` 的类型是 `Tuple2[Int, String]`。`('u', 'r', \"the\", 1, 4, \"me\")` 的类型是 `Tuple6[Char,\
  \ Char, String, Int, Int, String]`。\n\n### 访问元组元素\n\n你可能在奇怪为什么不能像访问列表元素那样访问元组元素（例如使用\
  \ `pair(0)`）。原因是列表的 `apply` 方法始终返回相同类型，但元组的每个元素可能是不同类型：`_1` 有一种结果类型，`_2` 可能是另一种，依此类推。这些\
  \ `_N` 数字从 1 开始而不是从 0 开始，是因为从 1 开始是其他具有静态类型元组的语言（如 Haskell 和 ML）所设定的传统。\n\n### Step\
  \ 10. 使用集合和映射\n\n由于 Scala 的设计目标是帮助你利用函数式和命令式编程风格，它提供了一个丰富的集合库。常用的集合是列表（lists）、集合（sets）和映射（maps）。\n\
  \n\n\n\n在 Listing 3.6 的第一行中，你导入了可变的 `Set`。与 Java 一样，导入语句允许你使用简单的名称（如 `Set`），而不是较长的全限定名。因此，当你在第三行说\
  \ `Set` 时，编译器知道你指的是 `scala.collection.mutable.Set`。在这一行中，你用一个包含字符串 \"Hitch\" 和 \"\
  Poltergeist\" 的新可变集合初始化了 `movieSet`。后续的一行通过调用集合上的 `+=` 方法并传入字符串 \"Shrek\"，向该可变集合添加了\
  \ \"Shrek\"。如前文提到的，`+=` 是定义在可变集合上的一个实际方法。如果你愿意，与其写 `movieSet += \"Shrek\"`，你也可以写成\
  \ `movieSet.+=(\"Shrek\")`[[6]](#next-steps-in-scala.html_footnotemain3-6)\n\n尽管到为止显示的可变和不可变\
  \ `Set` 工厂方法产生的默认集合实现可能对于大多数情况，但有时你可能需要一个显式的集合类。幸运的是，其语法是类似的。只需导入你需要的类，并使用其伴侣对象（companion\
  \ object）上的工厂方法即可。例如，如果你需要一个不可变的 `HashSet`，你可以这样做：\n\n```scala\nimport scala.collection.immutable.HashSet\n\
  \nval hashSet = HashSet(\"Tomatoes\", \"Chilies\")\nprintln(hashSet + \"Coriander\"\
  )\n```\n\nScala 中另一个有用的集合类是 `Map`。与集合一样，Scala 通过类层次结构提供了 `Map` 的可变和不可变版本。正如你在图 3.3\
  \ 中所示，map 的类层次结构与集合非常相似。在 `scala.collection` 包中有一个基础的 `Map` 特性（trait），以及两个子特性 `Maps`：位于\
  \ `scala.collection.mutable` 中的可变 `Map` 和位于 `scala.collection.immutable` 中的不可变 `Map`。\n\
  \n![image images/maps85.png](img/maps85.png)\n\n#### 图 3.3 - Scala map 的类层次结构。\n\
  \n`Map` 的实现（如图 3.3 中类层次结构所示的 `HashMaps`）扩展了可变或不可变特性。你可以使用与数组、列表和集合相似的工厂方法来创建并初始化\
  \ map。\n\n```scala\nimport scala.collection.mutable\n\nval treasureMap = mutable.Map[Int,\
  \ String]()\ntreasureMap += (1 -> \"Go to island.\")\ntreasureMap += (2 -> \"Find\
  \ big X on ground.\")\ntreasureMap += (3 -> \"Dig.\")\nprintln(treasureMap(2))\n\
  ```\n\n#### Listing 3.7 - 创建、初始化和使用可变 map。\n\n例如，Listing 3.7 展示了可变 map 的用法。在 Listing\
  \ 3.7 的第一行中，你导入了可变的 `Map`。然后你定义了一个名为 `treasureMap` 的 `val`，并用一个具有整数键和字符串值的空可变 `Map`\
  \ 对其进行初始化。map 是空的，因为你没有向工厂方法传递任何内容（`Map[Int, String]()` 中的括号是空的）。[[7]](#next-steps-in-scala.html_footnotemain3-7)\
  \ 在接下来的三行中，你使用 `->` 和 `+=` 方法向 map 添加键值对。如前所示，Scala 编译器会将二元操作表达式如 `1 -> \"Go to\
  \ island.\"` 转换为 `(1).->(\"Go to island.\")`。因此，当你说 `1 -> \"Go to island.\"` 时，你实际上是在值为\
  \ 1 的整数上调用了一个名为 `->` 的方法，并传入值为 \"Go to island.\" 的字符串。这个 `->` 方法可以在 Scala 程序中的任何对象上调用，它返回一个包含键和值的二元素元组[[8]](#next-steps-in-scala.html_footnotemain3-8)。然后你将此元组传递给\
  \ `treasureMap` 所引的 map 对象的 `+=` 方法。最后，最后一行打印了 `treasureMap` 中对应于键 2 的值。\n\n如果你运行这段代码，它将打印：\n\
  \n```\nFind big X on ground.\n```\n\n如果你更喜欢不可变 map，则不需要导入，因为不可变是默认的 map。示例在 Listing\
  \ 3.8 中所示：\n\n```scala\nval romanNumeral = Map(\n    1 -> \"I\", 2 -> \"II\", 3\
  \ -> \"III\", 4 -> \"IV\", 5 -> \"V\"\n)\nprintln(romanNumeral(4))\n```\n\n####\
  \ Listing 3.8 - 创建、初始化和使用不可变 map。\n\n### 步骤 1：学会识别区别\n\n正如 a-language.html)所述，Scala\
  \ 允许你使用命令式风格编程，但鼓励你采用更函数式的风格。如果你来自命令式背景，学习 Scala 时可能面临的主要挑战之一就是如何摆弃 `var`。\n\n考虑以下\
  \ `while` 循环示例，它改编自[第 2 章，使用了 `var`，因此是命令式风格的：\n\n```scala\ndef printArgs(args:\
  \ Array[String]): Unit = {\n  var i = 0\n  while (i < args.length) {\n    println(args(i))\n\
  \    i += 1\n  }\n}\n```\n\n你可以通过摆弃 `var` 将这段代码转换为更具函数式的风格，例如：\n\n```scala\ndef\
  \ printArgs(args: Array[String]): Unit = {\n  for (arg <- args) {\n    println(arg)\n\
  \  }\n}\n```\n\n或者这样：\n\n```scala\ndef printArgs(args: Array[String]): Unit = {\n\
  \  args.foreach(println)\n}\n```\n\n这个示例说明了使用较少 `var` 编程的一个用处。重构后（更函数式的）代码比原始（更命令式的）代码更清晰、更简洁且不易出错。Scala\
  \ 鼓励函数式风格是因为它可以帮助你写出更易于理解、不易出错的代码。\n\n\n\n但你还可以更进一步。重构后的 `printArgs` 方法并不是*纯粹*的函数式，因为它具有副作用——在这种情况下，它的副作用是打印到标准输出流。具有副作用的函数的显性标志是其返回结果类型为\
  \ `Unit`。如果一个函数没有返回任何有趣的值（这正是 `Unit` 结果类型的含义），那么该函数对外部世界产生影响的唯一方式就是通过某种副作用。一种更函数式的方法是定义一个方法，对传入的\
  \ `args` 进行格式化处理以供打印，但仅返回格式化后的字符串，如 Listing 3.9 所示：\n\n```scala\n def formatArgs(args:\
  \ Array[String]) = args.mkString(\"\\n\")\n```\n\n#### Listing 3.9 - 无副作用或 vars\
  \ 的函数。\n\n现在你真的是函数式的了：随处看不到副作用或 `vars`。`mkString` 方法可以在任何迭代集合（包括数组、列表、集合和映射）上调用，它返回一个字符串，由对每个元素调用\
  \ `toString` 的结果组成，并用传递的字符串分隔。因此，如果 `args` 包含三个元素 \"zero\"、one\" 和 \"two\"，`formatArgs`\
  \ 将返回 \"zero\\one\\ntwo\"。当然，这个函数并不会像 `printArgs` 方法那样实际打印内容，但你可以轻松地将它的结果传递给 `println`\
  \ 来实现这一点：\n\n```scala\n println(formatArgs(args))\n```\n\n每个实用的程序可能都有某种形式的副作用；否则，它无法为外部世界提供价值。偏好使用没有副作用的方法鼓励你设计尽可能减少副作用代码程序。这种方法的好处之一是它可以帮助你的程序更容易测试。\n\
  \n例如，为了测试本节之前显示的三个 `printArgs` 方法中的任意一个，你需要重新定义 `println`，捕获传递给它的输出，并确保它符合你的预期。相比之下，你只需通过检查结果就可以测试\
  \ `formatArgs` 函数：\n\n```scala\n val res = formatArgs(Array(\"zero\", \"one\", \"\
  two\"))\n assert(res == \"zero\\one\\ntwo\")\n```\n\nScala 的 `assert` 方法会检查传递的布尔值，如果为\
  \ `false`，则抛出 `AssertionError`。如果传递的布尔值为 `true`，`assert` 则静静返回。你将在 第 14 章 中学习更多关于断言和测试的知识。\n\
  \n尽管如此，请记住 `vars` 或副作用并不是本质恶的。Scala 不是一种强制你用函数式风格编写一切的纯函数式语言。Scala 是一种命令式/函数式的混合语言。你可能会发现，在某些情况下命令式风格更适合当前的问题，在这种情况下你不必犹豫使用它。然而，为了帮助你学习不使用\
  \ `vars` 进行编程，我们将在 第 7 章 中向你展示许多带有 `vars` 的代码示例，以及如何将这些 `vars` 转换为 `vals`。\n\n###\
  \ Scala 程序员的平衡态度\n\n优先使用 `vals`、不可变对象和没有副作用的方法。首先尝试它们。当你有特定的需求和理由时，再使用 `vars`、可变对象和带有副作用的方法。\n\
  \n### 步骤 12. 从文件读取行\n\n执行日常微型任务的脚本通常需要处理文件中的行。在本节中，你将构建一个从文件中读取行并打印它们的脚本，每行前面会加上该行的字符数。第一个版本如\
  \ Listing 3.10 所示：\n\n```scala\n import scala.io.Source\n\n  if (args.length > 0)\
  \ {\n\n    for (line <- Source.fromFile(args(0)).getLines())\n      println(line.length\
  \ + \" \" + line)\n  }\n  else\n    Console.err.println(\"Please enter filename\"\
  )\n```\n\n#### Listing 3.10 - 从文件读取行。\n\n该脚本从导入 `scala.io` 包中的 `Source` 类开始。然后它检查命令行是否至少指定了一个参数。如果是，第一个参数被解释为要打开并处理的文件。`Source.fromFile(args(0))`\
  \ 尝试打开指定的文件并返回一个 `Source` 对象，在该对象上调用 `getLines`。`getLines` 方法返回一个 `Iterator[String]`，它在每次迭代提供一行，不包括换行符。`for`\
  \ 表达式遍历这些行，并打印每行的长度、一个空格以及行本身。如果命令行没有提供任何参数，最后的 `else` 子句将向标准错误流打印消息。如果你将此代码放在名为\
  \ `countchars1.scala` 的文件中，并对自身运行它：\n\n```bash\n $ scala countchars1.scala countchars1.scala\n\
  ```\n\n你应该看到：\n\n```\n 22 import scala.io.Source\n  0 \n  22 if (args.length > 0)\
  \ {\n  0 \n  51   for (line <- Source.fromFile(args(0)).getLines())\n  0 \n  37\
  \       println(line.length + \" \" + line)\n  1   }\n  46   else\n  51     Console.err.println(\"\
  Please enter filename\")\n```（注意：提供的源文本包含了一些重复/乱码内容，我已清理结构以保持逻辑）。\n\n\n\n\n```\n\
  \ val maxWidth = widthOfLength(longestLine)\n```\n\n剩下的就是以适当的格式打印这些行。你可以这样这样做：\n\
  \n```\n for (line <- lines) {\n  val numSpaces = maxWidth - widthOfLength(line)\n\
  \  val padding = \" \" * numSpaces\n  println(padding + line.length + \" | \" +\
  \ line)\n}\n```\n\n在这个 `for` 表达式中，你再次遍历了 `lines`。对于每一行 `line`，你首先计算行长度之前所需的空格数，并将其赋值给\
  \ `numSpaces`。然后，你使用表达式 `\" \" * numSpaces` 创建一个包含 `numSpaces` 个空格的字符串。最后，你按照所需的格式打印信息。整个脚本看起来如\
  \ 列表 3.11 所示：\n\n```\n import scala.io.Source\n\n  def widthOfLength(s: String)\
  \ = s.length.toString.length\n\n  if (args.length > 0) {\n\n    val lines = Source.fromFile(args(0)).getLines().toList\n\
  \n    val longestLine = lines.reduceLeft(\n      (a, b) => if (a.length > b.length)\
  \ a else b \n    ) \n    val maxWidth = widthOfLength(longestLine)\n\n    for (line\
  \ <- lines) {\n      val numSpaces = maxWidth - widthOfLength(line)\n      val padding\
  \ = \" \" * numSpaces\n      println(padding + line.length + \" | \" + line)\n \
  \   }\n  }\n  else\n    Console.err.println(\"Please enter filename\")\n```\n\n\
  #### 列表 3.11 - 为文件的行打印格式化的字符计数。\n\n### 结论\n\n通过你在本章中获得的知识，你应该已经能够开始使用 Scala 处理小型任务，特别是脚本。在随后的章节中，我们将进一步探讨这些主题，并介绍此处甚至没有提到的其他主题。\n\
  \n***\n\n#### 第 3 章脚注：\n\n[1] 此方法实际上返回的不是数组，而是另一种类型的序列，其中包含值 0、1 和 2，`for` 表达式会对这些值进行迭代。序列和其他集合集合将在\
  \ 第 17 章 中描述。\n\n[2] 变长参数列表，或*重复参数*，将在 第 8.8 节 中描述。\n\n[3] 你不需要说新的 `List`，因为 `List.apply()`\
  \ 被定义为 `scala.List` *伴生对象* 工厂方法。你将在 第 4.3 节 中学习更多关于伴生对象的知识。\n\n[4] 在末尾需要 `Nil` 的原因是\
  \ `::` 是定义在类 `List`上的。如果你尝试只说 `1 :: 2 :: 3`，它将无法编译，因为 `3` 是一个 `Int` 类型，它没有 `::`\
  \ 方法。\n\n[5] 虽然在概念上你可以创建任何长度的元组，但目前 Scala 库只定义了到 `Tuple22` 的元组。\n\n[6] 因为 列表 3.6\
  \ 中的集合是可变的，因此不需要重新赋值 `movieSet`，这就是为什么它可以是一个 `val`。相比之下，在 列表 3.5 中对不可变集合使用 `+=`\
  \ 需要重新赋值 `jetSet`，这就是为什么它必须是一个 `var`。\n\n[7] 在 列表 3.7 中需要显式的类型参数化 `[Int, String]`，因为由于没有向工厂方法传递任何值，编译器无法推断\
  \ map 的类型参数。相比之下，编译器可以从 列表 3.8 所示 map 工厂方法传递的值中推断类型参数，因此不需要显式的类型参数。\n\n[8] 允许你在任何对象上调用\
  \ `->` 的 Scala 机制——*隐式转换*，将在第 4 章介绍。\n\n# 第 4 章\n\n## 类与对象\n\n你现在已经在之前的章节中看到了类和对象的基础。在本章中，我们将更深入地探讨类、字段和方法。如果你熟悉\
  \ Java，你会发现它很相似。\n\n### 4.1 类、字段和方法\n\n类是对象的蓝图。当你实例化一个类时，它会为对象留出内存。字段也被称为*实例变量*，因为每个实例都有它自己的一组变量。对象的实例变量共同构成了对象的状态。\n\
  \n关于这个例子需要注意的一点是，尽管 `acc` 是一个 `val`，你仍然能够修改对象 `acc`。由于 `acc`（或 `csa`）是 `val` 而不是\
  \ `var`，你不能对它们所做的操作是给它们重新赋值一个不同的对象。例如，下述尝试将失败：\n\n```\n // 无法编译，因为 acc 是一个 val\n\
  \  acc= new Checksumulator\n```\n\n因此，你可以确信 `acc` 将始终指向你初始化它时的同一个 Checksumulator\
  \ 对象，但该对象包含的字段可能会随时间而改变。\n\n追求对象健壮性的重要方法之一是确保对象的状态（其实例变量的值）在其整个生命周期内保持有效。第一步是通过将字段设为*私有*来防止外部直接访问字段。因为私有字段只能由类中定义的方法访问，因此所有更新状态的代码都将局限于类内部。要声明一个私有字段，你可以在字段前面放置私有访问修饰符，如下：\n\
  \n```\n class Checksumulator {\n  private var sum = 0\n  }\n```\n\n给定这个 Checksumulator\
  \ 的定义，从类外部访问 sum 的任何尝试将失败：\n\n```\n val acc = new Checksumulator\n  acc.sum = 5\
  \ // 无法编译，因为 sum 是私有的\n```\n\n#### 注意\n\n在 Scala 中使成员公开的方法是不显式指定任何访问修饰符。换句话说，在 Java\
  \ 中你需要说“public”的地方，在 Scala 中只需什么都不说。公开是 Scala 的默认访问级别。\n\n\n\n\n现在 `sum` 是私有的，唯一可以访问\
  \ `sum` 的代码是定义在类体内部的代码。因此，除非我们在其中定义一些方法，否则 `ChecksumAccumulator` 对任何人来说都没有太大用：\n\
  \n```scala\n class ChecksumAccumulator {\n\n  private var sum = 0\n\n  def add(b:\
  \ Byte): Unit = {\n    sum += b\n  }\n\n  def checksum(): Int = {\n    return ~(sum\
  \ & 0xFF) + 1\n  }\n}\n```\n\n`ChecksumAccumulator` 现在有两个方法，`add` 和 `checksum`，它们都展示了函数定义的基本形式，详见图\
  \ 2.1 以及此处。\n\n方法的任何参数都可以在方法内部使用。Scala 方法参数的一个重要特性是它们是 `vals`（不可变），而不是 `vars`。[[1]](#classes-and-objects.html_footnotemain4-1)\
  \ 因此，如果你尝试在 Scala 方法内部重新给参数赋值，它将无法通过编译：\n\n```scala\n def add(b: Byte): Unit = {\n\
  \  b = 1     // 这无法编译，因为 b 是一个 val\n  sum += b\n}\n```\n\n尽管此版本的 `ChecksumAccumulator`\
  \ 中的 `add` 和 `checksum` 正确实现了所需的功能，但你可以使用更简洁的风格来表达。首先，`checksum` 方法末尾的 `return`\
  \ 是多余，可以删除。在没有显式返回语句的情况下，Scala 方法返回方法计算的最后一个值。\n\n方法的推荐风格实际上是避免使用显式的（特别是多个）返回语句。相反，将每个方法视为一个产生一个值并返回该值的表达式。这种哲学将鼓励你使方法变得非常小，并将较大的方法拆分成多个较小的方法。另一方面，设计选择取决于设计上下文，如果你有需要，Scala\
  \ 也让你轻松编写出具有多个显式返回的方法。\n\n由于 `checksum` 做的只是计算一个值，因此它不需要显式返回。方法的另一种简写方式是，如果方法只计算一个结果表达式，你可以省略大括号。如果结果表达式很短，甚至可以将其与\
  \ `def` 本身放在同一行。为了极致的简洁，你可以省略结果类型，Scala 将自动推断它。通过这些更改，类 `ChecksumAccumulator` 看起来如下：\n\
  \n```scala\n class ChecksumAccumulator {\n  private var sum = 0\n  def add(b: Byte)\
  \ = sum += b\n  def checksum() = ~(sum & 0xFF) + 1\n}\n```\n\n虽然 Scala 编译器会正确推断上一个示例中\
  \ `add` 和 `checksum` 方法的结果类型，但代码的读者也需要通过研究方法体在脑中推断结果类型。因此，即使编译器可以为你推断，显式提供类中声明的公共方法的结果类型通常是更好的。列表\
  \ 4.1 展示了这种风格。\n\n```scala\n // 在文件 ChecksumAccumulator.scala\n  class ChecksumAccumulator\
  \ {\n    private var sum = 0\n    def add(b: Byte): Unit = { sum += b }\n    def\
  \ checksum(): Int = ~(sum & 0xFF) + 1\n  }\n```\n\n#### 列表 4.1 - ChecksumAccumulator\
  \ 类的最终版本。\n\n结果类型为 `Unit` 的方法（例如 `ChecksumAccumulator` 的 `add` 方法）是为了其副作用而执行的。副作用通常定义为修改方法外部某处的状态或执行\
  \ I/O 操作。在 `add` 的用例中，副作用是 `sum` 被重新赋值。仅为了副作用而执行的方法被称为 `procedure`（过程）。\n\n### 4.2\
  \ 分号推断\n\n在 Scala 程序中，语句末尾的分号通常是可选的。如果你想写，可以写上一个分号，但如果该语句独占一行，则没必要这么写。相反，如果你在同一行上写了多个语句，则必须使用分号：\n\
  \n```scala\n val s = \"hello\"; println(s)\n```\n\n如果你想输入一个跨越多行的语句，大多数情况下你只需直接输入它，Scala\
  \ 就会在正确的位置分隔语句。例如，以下内容被视为一个四四行的语句：\n\n```scala\n if (x < 2)\n  println(\"too small\"\
  )\n  else\n  println(\"ok\")\n```\n\n然而，偶尔 Scala 会违背你的意愿将一个语句拆分成两部分：\n\n```scala\n\
  \ x\n  + y\n```\n\n这被解析为两个语句 `x` 和 `+y`。如果你希望它解析为一个语句 `x + y`，你可以始终将其封装在括号中：\n\n\
  ```scala\n (x\n  + y)\n```\n\n或者，你可以将 `+` 放在一行的末尾。正因为这个原因，每当你链用如 `+` 等中缀操作时，常见的\
  \ Scala 风格是将操作符放在行尾而不是行首：\n\n```scala\n x +\n  y +\n  z\n```\n\n### 分号推断的规则\n\n\
  语句分隔的精确规则对于其有效性来说竟然出奇地简单。简而言之，除非满足以下条件之一，否则行尾换行符被视为分号：\n\n1. 该行以一个不作为语句结尾的合法单词结束，例如点或中缀操作符。\n\
  2. 下一行以一个不能启动语句的单词开头。\n3. 该行在括号 `(...)` 或方括号 `[...]` 结束，因为这些包含了多个语句。\n\n### 4.3\
  \ 单例对象\n\n正如第 1 章 中提到的，Scala 优于 Java 的一点是类不能拥有静态成员。相反，Scala 有`单例对象`。单例对象看起来像类定义，除了使用\
  \ `class` 关键字外，你使用的是 `object` 关键字。列表 4.2 展示了一个示例。\n\n此图中的单例对象是 `ChecksumAccumulator`，与上一个示例中的类同名。当一个单例对象与类同名时，它被称为该类的`伴侣对象`。你必须在同一个源文件中定义类及其它的伴侣对象。类被称为该单例对象的*伴侣类`。类及其伴侣对象可以访问对方的私有成员。\n\
  \n```scala\n // 在文件 ChecksumAccumulator.scala\n  import scala.collection.mutable\n\
  \n  object ChecksumAccumulator {\n\n    private val cache = mutable.Map.empty[String,\
  \ Int]\n\n    def calculate(s: String): Int = \n      if (cache.contains(s))\n \
  \       cache(s)\n      else {\n        val acc = new ChecksumAccumulator\n    \
  \    for (c <- s)\n          acc.add(c.toByte)\n        val cs = acc.checksum()\n\
  \        cache += (s -> cs)\n        cs\n      }\n  }\n```\n\n#### 列表 4.2 - ChecksumAccumulator\
  \ 类的伴侣对象。\n\n\n\n\n`ChecksumAccumulator` 单例对象有一个名为 `calculate` 的方法，它接收一个 `String`\
  \ 并计算该 `String` 中字符的校验和。它还有一个私有字段 `cache`，这是一个可变映射（map），在其中缓存了之前计算过的校验和。该方法的第一行\
  \ `if (cache.contains(s))` 检查缓存，查看传入的字符串是否已经作为键存在映射中。如果是的话，它直接返回映射的值 `cache(s)`。否则，它执行\
  \ `else` 子句，该子句计算校验和。`else` 子句的第一行定义了一个名为 `acc` 的 `val`，并用一个新的 `ChecksumAccumulator`\
  \ 实例初始化它。下一行是一个 `for` 表达式，它遍历传入字符串中的每个字符，通过调用该字符的 `toByte` 将其转换为 `Byte`，并将其传递给 `acc`\
  \ 所指的 `ChecksumAccumulator` 实例的 `add` 方法。在 `for` 表达式完成后，方法的下一行调用了 `acc` 上的 `checksum`\
  \ 方法，获取传入 `String` 的校验和，并将其存储在名为 `cs` 的 `val` 中。在下一行 `cache += (s -> cs)` 中，传入的字符串键被映射到整数校验和值，并将此键值对添加到\
  \ `cache` 映射中。该方法的最后一个表达式 `cs` 确保了校验和是该方法的结果。\n\n如果你是一个 Java 程序员，思考单例对象的一种方式是将其看作你在\
  \ Java 中可能编写的任何静态方法的宿主。你可以使用类似的语法在单例对象上调用方法：单例对象的名称、一个点以及方法的名称。例如，你可以如下所示调用单例对象\
  \ `ChecksumAccumulator` 的 `calculate` 方法：\n\n```\nChecksumAccumulator.calculate(\"\
  Every value is an object.\")\n```\n\n然而，单例对象不仅仅是静态方法的持有者。它是一个一等对象。因此，你可以将单例对象的名称视为附加在对象上的“名称标签”：\n\
  \n![image images/csaObject160.png](img/csaObject160.png)\n\n定义一个单例对象并没有定义一个类型（在\
  \ Scala 的抽象级别）。仅凭一个 `object ChecksumAccumulator` 的定义，你无法创建一个 `ChecksumAccumulator`\
  \ 类型的变量。相反，名为 `ChecksumAccumulator` 的类型是由单例对象的伴侣类（companion class）定义的。然而，单例对象可以扩展超类并混入特征（traits）。由于每个单例对象都是其超类和混入特征的实例，你可以通过这些类型调用它的方法，通过这些类型的变量引用它，并将其传递给期望这些类型的方法。我们将在第\
  \ 13 章中展示单例对象继承类和特征的一些示例。\n\n类和单例对象之间的区别之一是，单例对象不能接收参数，而类可以。因为你不能用 `new` 关键字实例化单例对象，所以你没有方法向它传递参数。每个单例对象都实现为从静态变量引用的\
  \ `synthetic class`（合成类）的实例，因此它们具有与 Java 静态变量相同的初始化语义。特别是，单例对象会在代码第一次访问它时进行初始化。\n\
  \n不与伴侣类具有同名的单例对象被称为 `standalone object`（独立对象）。你可以将独立对象用于许多目的，包括将相关的工具类方法汇集在一起，或定义\
  \ Scala 应用程序的入口。这种用例将在下一节显示。\n\n### 4.4 一个 Scala 应用程序\n\n要运行一个 Scala 程序，你必须提供一个带有\
  \ `main` 方法的独立单例对象的名称，该方法接收一个参数 `Array[String]`，并且结果类型为 `Unit`。任何具有正确签名的 `main`\
  \ 方法的独立对象都可以作为应用程序的入口。示例见列表 4.3：\n\n```scala\n// 在文件 Summer.scala 中\nimport ChecksumAccumulator.calculate\n\
  \nobject Summer {\n  def main(args: Array[String]) = {\n    for (arg <- args)\n\
  \      println(arg + \": \" + calculate(arg))\n  }\n}\n```\n\n#### 列表 4.3 - Summer\
  \ 应用程序。\n\n列表 4.3 中单例对象的名称是 `Summer`。它的 `main` 方法具有正确的签名，因此你可以将其作为应用程序。文件中的第一条语句导入了上一个示例中\
  \ `ChecksumAccumulator` 对象中定义的 `calculate` 方法。此导入语句允许你在文件的其余部分使用该方法的简单名称。\n\n####\
  \ 注意\n\nScala 会隐式地将 `java.lang` 和 `scala` 的成员，以及名为 `Predef` 的单例对象的成员导入到每个源文件中。`Predef`\
  \ 位于 `scala` 中，包含了许多有用的方法。例如，当你在源文件中 `println` 时，你实际上是在调用 `Predef`。（`Predef` 会转而调用\
  \ `Console`，由它执行实际工作。）当你说 `assert` 时，你正在调用 `Predef`。\n\n要运行 Summer 应用程序，请将列表 4.3\
  \ 中的代码放在名为 `Summer.scala` 的文件中。由于 `Summer` 使用了 `ChecksumAccumulator`，请将 `ChecksumAccumulator`\
  \ 的代码（列表 4.1 所示的类和列表 4.2 所示的伴侣对象）放在名为 `ChecksumAccumulator.scala` 的文件中。\n\nScala\
  \ 和 Java 的区别在于，Java 要求你将公共类放在与类同名的文件中——例如，你会将 `class SpeedRacer` 放在 `SpeedRacer.java`\
  \ 中——而在 Scala 中，你可以将 `.scala` 文件命名为任何名称，无论你在其中放入了什么 Scala 类或代码。然而，在非脚本的情况下，推荐的风格是像\
  \ Java 那样，根据它们包含的类来命名文件。我们在本示例的两个文件 `Summer.scala` 和 `ChecksumAccumulator.scala`\
  \ 中采用的就是这种方法。\n\n`ChecksumAccumulator.scala` 和 `Summer.scala` 都都不是脚本，因为它们以定义结尾。相比之下，脚本必须以结果表达式结尾。因此，如果你尝试将\
  \ `Summer.scala` 作为脚本运行，Scala 解释器将报错说 `Summer.scala` 没有以结果表达式结尾（当然，假设你没有在 `Summer`\
  \ 对象定义之后添加任何自己的表达式）。相反，你实际上需要用 Scala 编译器编译这些文件，然后运行生成的类文件。实现此操作的方法之一是使用 `scalac`，它是基础\
  \ Scala 编译器，如下：\n\n```\n$ scalac ChecksumAccumulator.scala Summer.scala\n```\n\n\
  这会编译你的源文件，但在编译完成之前可能会有明显的延迟。这是因为编译器每次启动时，都会花时间扫描 jar 包的内容并进行其他初始工作，然后查看你提交给它的新源文件。由于这个原因，Scala\
  \ 分发版还包含一个名为 `fsc`（代表 fast Scala daemon）的 Scala 编译器守护进程。你可以这样使用它：\n\n```\n$ fsc\
  \ ChecksumAccumulator.scala Summer.scala\n```\n\n\n\n\n当你第一次运行 `fsc` 时，它会创建一个附加到你计算机端口的本地服务器守护进程。然后它会通过该端口将要编译的文件列表发送给守护进程，由守护进程编译这些文件。下次你运行\
  \ `fsc` 时，守护进程已经在运行，因此 `fsc` 只需将文件列表发送给守护进程，守护进程会立即编译文件。使用 `fsc`，你只需要在第一次等待 Java\
  \ 运行时启动即可。如果你想停止 `fsc` 守护进程，可以使用 `fsc -shutdown`。\n\n运行 `scalac` 或 `fsc` 命令中的任意一个都会生成\
  \ Java 类文件，然后你可以通过 `scala` 命令运行它们，该命令与你在之前的示例中用于调用解释器的命令相同。但是，这次你不像你在之前的每个示例中那样给它一个带有\
  \ `.scala` 扩展名的包含 Scala 代码的文件进行解释，在这种情况下，你将提供一个包含正确签名的 `main` 方法的独立对象的名称。因此，你可以通过输入以下命令运行\
  \ `Summer` 程序：\n\n```\n $ scala Summer of love\n```\n\n你将看到打印两个命令行参数的校验和：\n\n```\n\
  \ of: -213\n  love: -182\n```\n\n### 4.5 App trait\n\nScala 提供了一个名为 `scala.App`\
  \ 的 trait，它可以节省你一些键盘打字的工作。虽然我们还没有涵盖确切理解该 trait 如何工作所需的全部内容，但我们认为你现在可能也想了解它。列表 4.4\
  \ 显示了一个示例：\n\n```\n import ChecksumAccumulator.calculate\n\n  object FallWinterSpringSummer\
  \ extends App {\n\n    for (season <- List(\"fall\", \"winter\", \"spring\"))\n\
  \      println(season + \": \" + calculate(season))\n  }\n```\n\n#### 列表 4.4 - 使用\
  \ App trait。\n\n要使用该 trait，你首先要在你的单例对象名称后编写 `extends App`。然后，你不再需要编写 `main` 方法，而是将原本打算放在\
  \ `main` 方法中的代码直接放在单例对象的大括号之间。你可以通过名为 `args` 的字符串数组访问命令行参数。就这样。你可以像运行任何其他程序一样编译并运行此程序。\n\
  \n### 4.6 总结\n\n本章介绍了 Scala 中类和对象的基础知识，并展示了如何编译和运行应用程序。在下一章中，你将学习 Scala 的基本类型以及如何使用它们。\n\
  \n***\n\n#### 第 4 章脚注：\n\n[1] 参数是 `vals` 的原因是 `vals` 更容易理解。你不需要进一步查找即可确定一个 `val`\
  \ 是否被重新赋值，而对于 `var` 则必须像之前那样去确认。\n\n[2] 我们在这里使用了一个缓存来展示一个带有字段的单例对象。这样的缓存是一种用内存换取计算时间的性能优化。通常情况下，只有当你遇到缓存可以解决的性能问题时，你可能才会使用此类缓存，并且可能会使用弱映射（例如\
  \ `scala.collection.jcl` 中的 `WeakHashMap`），这样当内存紧张时，缓存中的条目就可以被垃圾回收。\n\n[3] 因为关键字\
  \ `new` 仅用于实例化类，所以这里创建的新新对象是 `ChecksumAccumulator` 类的实例，而不是同名的单例对象。\n\n[4] 合成类的名称是对象名加上一个美元符号。因此，名为\
  \ `ChecksumAccumulator` 的单例对象的合成类是 `ChecksumAccumulator$`。\n\n[5] 如果你是一名 Java 程序员，可以将这种导入看作类似于\
  \ Java 5 中引入的静态导入功能。然而，Scala 中的一个区别是，你可以从任何对象导入成员，而不仅仅是单例对象。\n\n[6] `scala` 程序用于“解释”\
  \ Scala 源文件的实际机制是：将 Scala 源码编译为 Java 字节码，通过类加载器立即加载它们，并执行它们。\n\n# 第 5 章\n\n## 基本类型与操作\n\
  \n现在你已经看到了类和对象的实际运行，现在是时候深入了解 Scala 的基本类型和操作了。如果你熟悉 Java，你会很高兴地发现 Java 的基本类型和运算符在\
  \ Scala 中具有相同的含义。然而，还有一些有趣的区别使得即使你是一个经验丰富的 Java 开发者，本章也值得一读。由于本章涵盖的 Scala 某些方面本质上与\
  \ Java 相同，我们插入了注释指示 Java 开发者可以安全跳过的内容。\n\n在本章中，你将概述 Scala 的基本类型，包括 `Strings` 以及值类型\
  \ `Int`、`Long`、`Short`、`Byte`、`Float`、`Double`、`Char` 和 `Boolean`。你将学习可以在这些类型上执行的操作，包括运算符优先级在\
  \ Scala 表达式中是如何工作的。你还将学习隐式转换如何“丰富”这些基本类型的变体，为你提供 Java 支持之外的额外操作。\n\n### 5.1 某些基本类型\n\
  \nScala 的几种基本类型以及这些类型实例可能具有的值范围如表 5.1 所示。`Byte`、`Short`、`Int`、`Long` 类型统称为整数类型。\n\
  \n#### 表 5.1 - 某些基本类型\n\n| 基本类型 | 范围 |\n| :--- | :--- |\n| `Byte` | 8 位有符号补码整数 (-2⁷\
  \ 到 ²⁷⁻¹) |\n| `Short` | 16 位有符号补码整数 (-²⁶ 到 ²⁶⁻¹) |\n| `Int` | 32 位有符号补码整数 (-²³¹\
  \ 到 ²³¹⁻¹) |\n| `Long` | 64 位有符号补码整数 (-²⁶³ 到 ²⁶³⁻¹) |\n| `Char` | 16 位无符号 Unicode\
  \ 字符 (0 到 ²⁶⁻¹) |\n| `String` | 字符序列 |\n| `Float` | 32 位 IEEE 754 单精度浮点数 |\n| `Double`\
  \ | 64 位 IEEE 754 双精度浮点数 |\n| `Boolean` | true 或 false |\n\n除了位于 `java.lang` 包的\
  \ `String` 外，表 5.1 所示的所有类型都是 `scala` 包的成员。1 例如，`Int` 的全名是 `scala.Int`。\n\n经验丰富的\
  \ Java 开发者会注意到 Scala 的基本类型与 Java 中对应的类型范围完全相同。这使得 Scala 编译器可以将 Scala 值类型的实例（如 `Int`\
  \ 或 `Double`）转换为生成的 Java 原始类型。\n\n### 5.2 字面量\n\n所有的基本类型都可以字面量表示。字面量是在代码中直接编写常量值的方法。\n\
  \n### Java 程序员的快速通道\n\n本节所示的大多数字面量的语法与 Java 完全相同，因此如果你是 Java 大师，可以安全地跳过本节的大部分内容。你应该阅读的一些区别是\
  \ Scala 的原始字符串和符号字面量（从[此处](#basic-types-and-operations.html_sec-string-literals））以及字符串插值（从[此处](#basic-types-and-operations.html_sec-string-interpolation））。此外，Scala\
  \ 不支持八进制字面量；以 0 开头的整数字面量无法编译。\n\n#### 整数字面量\n\n`Int`、`Long`、`Short` 和 `Byte` 整数字面量有两种形式：十进制和十六进制。整数字面量的起始方式指示基数。如果数字以\
  \ `0x` 或 `0X` 开头，则是十六进制（16 进制），可以包含 0 到 9 以及大小写的字母 A 到 F。一些示例如下：\n\n\n\n\n\n```scala\n\
  scala>�val hex = 0x5\n  hex: Int = 5\n\n  scala>�val hex2 = 0x00FF\n  hex2: Int\
  \ = 255\n\n  scala>�val magic = 0xcafebabe\n  magic: Int = -889275714\n```\n\nScala\
  \ shell 始终以十进制打印整数值，无论你使用什么字面量形式对其进行初始化。因此，解释器会将你用字面量 `0x00FF` 初始化的变量 `hex2` 显示为十进制\
  \ `255`。（当然，你不需要听我们的。开始熟悉这种语言的一种良好方法，是在阅读本章时，在解释器中尝试这些语句。）如果数字以非零数字开头且没有没有其他修饰，它就是十进制（base\
  \ 10）。例如：\n\n```scala\nscala>�val dec1 = 31\n  dec1: Int = 31\n\n  scala>�val dec2\
  \ = 255\n  dec2: Int = 255\n\n  scala>�val dec3 = 20\n  dec3: Int = 20\n```\n\n\
  如果整数字面量以 `L` 或 `l` 结尾，它是一个 `Long`；否则它是 `Int`。`Long` 整数字面量的示例包括：\n\n```scala\nscala>�val prog\
  \ = 0XCAFEBABEL\n  prog: Long = 3405691582\n\n  scala>�val tower = 35L\n  tower:\
  \ Long = 35\n\n  scala>�val of = 31l\n  of: Long = 31\n```\n\n如果将 `Int` 字面量赋值给类型为\
  \ `Short` 或 `Byte` 的变量，只要字面量值在相应类型的有效范围内，该字面量就会被视为 `Short` 或 `Byte` 类型。例如：\n\n```scala\n\
  scala>�val little: Short = \\�367\n  little: Short = \\�367\n\n  scala>�val littler:\
  \ Byte = \\�38\n  littler: Byte = \\�38\n```\n\n#### 浮点数字面量\n\n浮点数字面量由数字组成，可选地包含小数点，并可选地后跟一个\
  \ `E` 或 `e` 以及一个指数。浮点数字面量的示例包括：\n\n```scala\nscala>�val big = \\�1.2345\n  big:\
  \ Double = \\�1.2345\n\n  scala>�val bigger = \\�1.2345e1\n  bigger: Double = \\\
  �12.345\n\n  scala>�val biggerStill = \\�123E45\n  biggerStill: Double = \\�1.23E47\n\
  ```\n\n注意，指数部分意味着其他部分所乘以 10 的幂次方。因此，`1.2345e1` 是 `1.2345 *times* 10¹`，即 `12.345`。如果浮点数字面量以\
  \ `F` 或 `f` 结尾，它是一个 `Float`；否则它是 `Double`。可选地，`Double` 浮点数字面量可以以 `D` 或 `d` 结尾。`Float`\
  \ 字面量的示例包括：\n\n```scala\nscala>�val little = \\�1.2345F\n  little: Float = \\�1.2345\n\
  \n  scala>�val littleBigger = \\�3e5f\n  littleBigger: Float = \\�300000.0\n```\n\
  \n最后一个以 `Double` 表示的值可以采取这些（以及其他）形式：\n\n```scala\nscala>�val anotherDouble = \\\
  �3e5\n  anotherDouble: Double = \\�300000.0\n\n  scala>�val yetAnother = \\�3e5D\n\
  \  yetAnother: Double = \\�300000.0\n```\n\n#### 字符字面量\n\n字符字面量由单引号之间的任何 Unicode\
  \ 字符组成，例如：\n\n```scala\nscala>�val a = \\�'A'\n  a: Char = \\�A\n```\n\n除了在单引号之间提供显式字符外，你还可以使用\
  \ Unicode 码点来识别字符。为此只需编写 `\\u` 后跟四个表示该码点的十六进制数字，如下所示：\n\n```scala\nscala>�val d\
  \ = \\�'\\u0041'\n  d: Char = \\�A\n\n  scala>�val f = \\�'\\u0044'\n  f: Char =\
  \ \\�D\n```\n\n事实上，此类 Unicode 字符可以出现在 Scala 程序的任何地方。例如你也可以这样写标识符：\n\n```scala\n\
  scala>�val B\\u0041\\u0044 = \\�1\n  BAD: Int = \\�1\n```\n\n此标识符被视为与 `BAD` 相同，即上述两个字符展开后的结果。通常情况下，这样命名标识符并不是一个好主意，因为很难阅读。相反，这种语法是为了允许包含非\
  \ ASCII 字符的 Scala 文件以 ASCII 形式表示。最后，还有少数几个由特殊序列表示的字符字面量。例如：\n\n```scala\nscala>�val backslash\
  \ = \\�'\\\\'\n  backslash: Char = \\�\\\n```\n\n#### 表 5.2 - 特殊字符转义序列\n\n| 字面量\
  \ | 含义 |\n| :--- | :--- |\n| `\\n` | 换 (`\\u00A`) |\n| `\\b` | 退格 (`\\u008`) |\n\
  | `\\t` | 制表符 (`\\u009`) |\n| `\\f` | 换页 (`\\u00C`) |\n| `\\r` | 回车 (`\\u00D`) |\n\
  | `\\\"` | 双引号 (`\\u022`) |\n| `\\'` | 单引号 (`\\u027`) |\n| `\\\\` | 反斜杠 (`\\u05C`)\
  \ |\n\n#### 字符串字面量\n\n字符串字面量由双引号包围的字符组成：\n\n```scala\nscala>�val hello = \\�\"hello\"\
  \n  hello: String = \\�hello\n```\n\n引号内字符的语法取决于（此处原文似乎不完整，但根据上下文翻译为：引号内字符的语法如下）\n\
  \n（注：由于原文在 \"The syntax of the characters within the quotes is\" 处似乎截断，此处仅翻译已提供的内容。）\n\
  \n\n\n\n\n`s\"Hello, $name!\"` 是一个处理过的字符串字面量。由于字母 `s` 紧邻左引号，`Scala` 将使用 `s` 字符串插值器来处理该字面量。`s`\
  \ 插值器会评估每个嵌入的表达式，对每个结果调用 `toString`，并将字面量中的嵌入表达式替换为这些结果。因此，`s\"Hello, $name!\"`\
  \ 产生 `\"Hello, reader!\"`，这与 `\"Hello, \" + name + \"!\"` 的结果相同。\n\n你可以在处理过的字符串字面量的美元符号（`$`）之后放置任何表达式。对于单变量表达式，你通常只需要在美元符号后放置变量名。`Scala`\
  \ 将将到第一个非标识符字符的所有字符解释为表达式。如果表达式包含非标识符字符，你必须将其放在花括号中，左大括号紧跟在美元符号之后。这是一个示例：\n\n```scala\n\
  scala> s\"The answer is ${6 * 7}.\"\n  res0: String = The answer is 42.\n```\n\n\
  `Scala` 默认提供了另外两个字符串插值器：`raw` 和 `f`。`raw` 字符串插值器的行为类似于 `s`，但它不识别字符字面量转义序列（如 表 5.2\
  \ 所示）。例如，以下语句打印四个反斜杠，而不是两个：\n\n```scala\nprintln(raw\"No\\\\\\\\escape!\") // prints:\
  \ No\\\\\\\\escape!\n```\n\n`f` 字符串插值器允许你为嵌入表达式附加 printf 风格的格式指令。你将指令放在表达式之后，以百分号（`%`）开头，使用\
  \ `java.util.Formatter`指定的语法。例如，格式化 `pi`：\n\n```scala\nscala> f\"${math.Pi}%.5f\"\
  \n  res1: String = 3.14159\n```\n\n如果你没有为嵌入表达式提供格式指令，`f` 字符串插值器将默认使用 `%s`，这意味着将替换\
  \ `toString` 值，就像 `s` 字符串插值器一样。例如：\n\n```scala\nscala> val pi = \"Pi\"\n  pi: String\
  \ = Pi\n\n  scala> f\"$pi is approximately ${math.Pi}%.8f.\"\n  res2: String = Pi\
  \ is approximately 3.14159265.\n```\n\n在 `Scala` 中，字符串插值通过编译时重写代码来实现。编译器会将任何由标识符后紧跟字符串字面量的左双引号组成的表达式视为字符串插值器表达式。`s`、`f`\
  \ 和 `raw` 字符串插值器是通过这种通用机制实现的。库和用户可以为其他目的定义其他的字符串插值器。\n\n### 5.4 运算符是方法\n\n`Scala`\
  \ 为其基本类型提供了丰富的运算符集合。如前面的章节所述，这些运算符实际上只是普通方法调用的简洁语法。例如，`1 + 2` 的含义实际上等同于 `1.+(2)`。换句话说，类\
  \ `Int` 包含名为 `+` 的方法，它接收一个 `Int` 并返回一个 `Int` 结果。当你将两个 `Int` 相时，就会调用这个 `+` 方法：\n\n\
  ```scala\nscala> val sum = 1 + 2    // Scala 调用了 1.+(2)\n  sum: Int = 3\n```\n\n\
  为了向自己证明这一点，你可以显式地将表达式写为方法调用：\n\n```scala\nscala> val sumMore = 1.+(2) \n  sumMore:\
  \ Int = 3\n```\n\n事实上，`Int` 包含了多个重载的 `+` 方法，接收不同的参数类型[[3]](#basic-types-and-operations.html_footnotemain5-3)。例如，`Int`\
  \ 还有另一个名为 `+` 的方法，接收并返回 `Long`。如果你向 `Int` 添加一个 `Long`，则会调用这个备选的 `+` 方法，如下：\n\n```scala\n\
  scala> val longSum = 1 + 2L    // Scala 调用了 1.+(2L)\n  longSum: Long = 3\n```\n\n\
  `+` 符号是一个运算符——具体来说是一个中运算符。运算符符号不仅限于其他语言中像 `+` 这样的运算符的方法。你可以在运算符符号中使用任何方法。例如，`String`\
  \ 类有一个方法 `indexOf`，接收一个 `Char` 参数。`indexOf` 方法在字符串中搜索指定字符首次出现的位置，并返回其索引；如果未找到该字符，则返回\
  \ -1。你可以像这样将 `indexOf` 作为运算符：\n\n```scala\nscala> val s = \"Hello, world!\" \n \
  \ s: String = Hello, world!\n\n  scala> s indexOf 'o'      // Scala 调用了 s.indexOf('o')\n\
  \  res0: Int = 4\n```\n\n此外，`String` 还提供了一个重载的 `indexOf` 方法，接收两个参数：要搜索的字符和起始索引。（另一个\
  \ `indexOf` 方法在字符串中搜索指定字符首次出现的位置，并返回其索引；如果未找到该字符，则返回 -1。）\n\n后置运算符是不带参数的方法，当它们在没有点或括号的情况下被调用。在\
  \ `Scala` 中，你可以省略方法调用中的空括号。惯例是，如果方法有副作用则包含括号（例如 `println()`），但如果方法没有副作用，则可以省略（例如在\
  \ `String` 上调用的 `toLowerCase`）。\n\n\n\n\n因此，为了查看对 Scala 基础类型可以使用哪些操作符，你所需要的仅仅查看\
  \ Scala API 文档中该类型类所声明的方法。然而，鉴于这是一本 Scala 教程，我们将在接下来的几个节中为你快速介绍这些方法中的大部分。\n\n###\
  \ Java 程序员的快速通过通道\n\n本章接下来的部分描述的 Scala 许多方面与 Java 相同。如果你是一个急于赶时间的 Java 大师，可以安全地直接跳转到第\
  \ 5.8 节 这里，该节描述了 Scala 在对象等性方面与 Java 的区别。\n\n### 5.5 算术运算\n\n你可以在任何数值类型上通过中缀运算符符号调用加（`+`）、减（`-`）、乘（`*`）、除（`/`）和取余（`%`）的算术方法。以下是一些示例：\n\
  \n```\n scala> 1.2 + 2.3\n  res6: Double = 3.5\n\n  scala> 3 - 1\n  res7: Int =\
  \ 2\n\n  scala> 'b' - 'a'\n  res8: Int = 1\n\n  scala> 2L * 3L  \n  res9: Long =\
  \ 6\n\n  scala> 11 / 4    \n  res10: Int = 2\n\n  scala> 11 % 4    \n  res11: Int\
  \ = 3\n\n  scala> 11.0f / 4.0f\n  res12: Float = 2.75\n\n  scala> 11.0 % 4.0  \n\
  \  res13: Double = 3.0\n```\n\n当左右两个操作数都是整数类型（`Int`、`Long`、`Byte`、`Short` 或 `Char`）时，`/`\
  \ 运算符将告诉你商的整数部分，不包含任何余数。`%` 运算符表示隐含整数除法的余数。\n\n通过 `%` 得到的浮点数余数并不是 IEEE 754 标准定义的那个一个。IEEE\
  \ 754 余数在计算余数时使用的是舍入除法，而不是截断除法，因此它与整数余数运算非常不同。如果你真的想要 IEEE 754 余数，可以调用 `scala.math`\
  \ 中的 `IEEEremainder`，如下所示：\n\n```\n scala> math.IEEEremainder(11.0, 4.0)\n  res14:\
  \ Double = -1.0\n```\n\n数值类型还提供了一元前缀操作符 `+`（方法 `unary_+`）和 `-`（方法 `unary_-`），它们允许你指示字面量数字是正还是负，例如\
  \ `-3` 或 `+4.0`。如果你不指定一元 `+` 或 `-`，字面量数字将被解释为正数。一元 `+` 的存在完全是为了与一元 `-` 称对称，但没有实际影响。一元\
  \ `-` 也可以用于对变量取反。以下是一些示例：\n\n```\n scala> val neg = 1 + -3\n  neg: Int = -2\n\n\
  \  scala> val y = +3\n  y: Int = 3\n\n  scala> -neg\n  res15: Int = 2\n```\n\n###\
  \ 5.6 关系和逻辑运算\n\n你可以使用关系方法比较数值类型：大于（`>`）、小于（`<`）、大于等于（`>=`）和小于等于（`<=`），这些方法会产生 `Boolean`\
  \ 结果。此外，你可以使用一元 `!` 运算符（`unary_!` 方法）来反转 `Boolean` 值。以下是几个示例：\n\n```\n scala> 1\
  \ > 2 \n  res16: Boolean = false\n\n  scala> 1 < 2 \n  res17: Boolean = true\n\n\
  \  scala> 1.0 <= 1.0  \n  res18: Boolean = true\n\n  scala> 3.5f >= 3.6f  \n  res19:\
  \ Boolean = false\n\n  scala> 'a' >= 'A' \n  res20: Boolean = true\n\n  scala> val\
  \ untrue = !true \n  untrue: Boolean = false\n```\n\n逻辑方法、逻辑与（`&&` 和 `&`）以及逻辑或（`||`\
  \ 和 `|`）以中缀形式接收 `Boolean` 操作数并产生 `Boolean` 结果。例如：\n\n```\n scala> val toBe = true\n\
  \  toBe: Boolean = true\n\n  scala> val question = toBe || !toBe\n  question: Boolean\
  \ = true\n\n  scala> val paradox = toBe && !toBe\n  paradox: Boolean = false\n```\n\
  \n`&&` 和 `||` 运算像 Java 一样会短路：由这些操作符构建的表达式仅评估到确定结果所需的程度。换句话说，如果 `&&` 和 `||` 的左侧确定了结果，则右侧不会被评估。例如，如果\
  \ `&&` 表达式的左侧求值为 `false`，则表达式的结果将是 `false`。同样，如果 `||` 表达式的左侧求值为 `true`，则右侧不会被评估。\n\
  \n```\n scala> def salt() = { println(\"salt\"); false }\n  salt: Boolean\n\nscala>\
  \ def pepper() = { println(\"pepper\"); true }\n  pepper: true\n\nscala> pepper()\
  \ && salt()\n  res1: Boolean = false\n\nscala> salt() && pepper()\n  res2: Boolean\
  \ = false\n```\n\n在第一个表达式中，`pepper` 和 `salt` 会被调用（注：原文此处为函数调用，逻辑上应为 `pepper() &&\
  \ salt()`），在第二个表达式中，只有 `salt` 被调用（由于短路逻辑）。*注：原文示例代码 `pepper() && salt()` 似乎存在笔误，根据短路规则，若第一个\
  \ `pepper` 为真，则 `salt` 不会执行。*（此处根据原文逻辑翻译）。\n\n\n\n这些操作实际上适用于所有对象，而不仅仅是基本类型。例如，你可以使用\
  \ `==` 来比较列表：\n\n```\nscala> List(1, 2, 3) == List(1, 2, 3)\n  res34: Boolean =\
  \ true\n\n  scala> List(1, 2, 3) == List(4, 5, 6)\n  res35: Boolean = false\n```\n\
  \n进一步，你可以比较两个不同类型的对象：\n\n```\nscala> 1 == 1.0\n  res36: Boolean = true\n\n  scala>\
  \ List(1, 2, 3) == \"hello\"\n  res37: Boolean = false\n```\n\n你甚至可以与 `null` 或可能为\
  \ `null` 的对象进行比较。这不会抛出任何异常：\n\n```\nscala> List(1, 2, 3) == null\n  res38: Boolean\
  \ = false\n\n  scala> null == List(1, 2, 3)\n  res39: Boolean = false\n```\n\n如你所见，`==`\
  \ 经过精心设计，以便在大多数情况下都能获得你想要的等值比较。这是通过一个非常简单的规则实现的：首先检查左侧是否为 `null`。如果不是 `null`，则调用\
  \ `equals` 方法。由于 `equals` 是一个方法，你得到的精确比较结果取决于左侧参数的类型。由于有自动的空检查，你不需要自己进行该检查。\n\n\
  这种比较在不同对象上会产生 `true`，只要它们的内容相同，并且它们的 `equals` 方法是基于内容编写的。例如，这里有两个恰好包含五个相同字母的字符串比较：\n\
  \n```\nscala> (\"he\" + \"llo\") == \"hello\"\n  res40: Boolean = true\n```\n\n\
  ### Scala 的 ==== 与 Java 的区别\n\n在 Java 中，你可以使用 `==` 来比较基本数据类型和引用类型。对于基本数据类型，Java\
  \ 的 `==` 比较的是值等性，就像 Scala 中的一样。然而，对于引用类型，Java 的 `==` 比较的是**引用等性**（reference equality），这意味着两个变量指向\
  \ JVM 堆上的同一个对象。Scala 同样提供了一种比较引用等性的机制，名为 `eq`。然而，`eq` 及其反向操作 `ne` 只适用于直接映射到 Java\
  \ 对象的对象。关于 `eq` 和 `ne` 的完整细节见第 11.1 节和第 11.2 节。此外，参见第 30 章关于如何编写一个良好的 `equals` 方法。\n\
  \n### 5.9 运算符优先级和结合性\n\n运算符优先级决定了表达式的哪些部分在其他部分之前求值。例如，表达式 `2 + 2 * 7` 的结果为 `16`而不是\
  \ `28`，因为 `*` 运算符的优先级高于 `+` 运算符。因此，表达式中的乘法部分在加法部分之前计算。你当然可以在表达式中使用括号来明确求值顺序或覆盖优先级。例如，如果你真的想要上述表达式的结果为\
  \ `28`，你可以这样写该表达式：\n\n```\n(2 + 2) * 7\n```\n\n考虑到 Scala 并没有严格意义上的运算符，而是一种以运算符表示法使用方法的方法，你可能会好奇运算符优先级是如何工作的。Scala\
  \ 根据运算符表示法中所用方法的第一个字符来决定优先级（该规则有一个例外，将在接下来的页中讨论）。例如，如果方法名以 `*` 开头，它的优先级将高于以 `+`\
  \ 开头的方法。因此 `2 + 2 * 7` 将求值为 `2 + (2 * 7)`。同样，`a+++ b *** c`（其中 `a`、`b` 和 `c` 是变量，`+++`\
  \ 和 `***` 是方法）将被求值为 `a+++ (b *** c)`，因为 `***` 方法的优先级高于 `+++ method` 方法。\n\n####\
  \ 表 5.3 - 运算符优先级\n\n| (所有其他特殊字符) |\n| :--- |\n| `* / %` |\n| `+ -` |\n| `:` |\n\
