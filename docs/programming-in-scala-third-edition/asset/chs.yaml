  \n```\nscala> 2 << 2 + 2\n  res41: Int = 32\n```\n\n`<<` 方法以字符 `<` 开头，该字符在表 5.3\
  \ 中的位置比 `+` 低，而 `+` 是 `+` 方法的首个且唯一的字符。因此 `<<` 的优先级低于 `+`，表达式将通过首先调用 `+` 方法然后调用 `<<`\
  \ 方法来计算， own `2 << (2 + 2)`。根据我们的计算，`2 + 2` 是 `4`，而 `2 << 4` 产生 `32`。如果你交换运算符，将得到不同的结果：\n\
