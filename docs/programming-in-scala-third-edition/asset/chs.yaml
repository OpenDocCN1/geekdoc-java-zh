  \ Scala 代码。\n* 第 3 章 “Scala 进阶”，展示了另外几个基础编程任务，将帮助你快速上手 Scala。完成本章后，你应该应该能够开始使用 Scala\
  \ 处理简单的脚本任务。\n* 第 4 章 “类与对象”，开始对 Scala 进行深度介绍，描述了其基础的面向对象构建块，并说明了如何编译和运行 Scala 应用程序。\n\
