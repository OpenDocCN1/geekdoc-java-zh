  \n# 前言\n\n你选择了一个非常好的时来拿起这本书！Scala 的采用正在不断加速，我们的社区正蓬勃发展，招聘广告随处可见。无论你是为了趣味还是盈利（或两者兼有）而编程，Scala\
  \ 对快乐和生产力的承诺都证明是不可抵挡的。对我来说，编程真正的乐趣来自于用简单、复杂的解决方案来应对有趣的挑战。Scala 的使命不仅是让这成为可能，而且让它变得有趣，而这本书将向你如何做到。\n\
  \n我第一次尝试 Scala `2.5`，立即被它语法和概念的规律性所吸引。当我遇到类型参数本身不能拥有类型参数这种不规则性时，我在 2006 年的一次会议上（胆怯地）走向\
  \ Martin Odersky，并提议通过实习来消除这一限制。我的贡献被接受了，并为 Scala `2.7` 及更高版本带来了对类型构造器多态的支持。从那时，我参与了编译器的大部分其他部分。2012\
  \ 年，我从 Martin 实验室的博士后转变为 Typesafe 的 Scala 团队负责人，此时 Scala 以 `2.10` 版本已经从其实用的学术根源成长为健壮的企业级语言。\n\
  \nScala `2.10` 是一个转折点，它从基于学术研究的快速、功能丰富的发布，转向关注简化和增加在企业中的应用。我们将注意力转移到不会写在论文中的问题上，例如二进制兼容性。为了平衡稳定性与不断进化的愿望，我们正致力于一个更小的核心。作为\
  \ Scala 技术负责人，我的第一个项目是开始模块化。为了减少变化率，Typesafe 也决定更改库和编译器。\n\nScala `12` 是一个带有新后端和优化器的版本，与\
  \ Java 更加接近。为了与 Java 互操作性并充分利用 Java `8` 特性，Scala 生成与其相同的字节码。同样，Scala traits 现在编译为带有默认方法的\
  \ Java 接口。这些对 Scala 的改进非常令人兴奋，无疑 Scala 提供了更好的函数式编程体验，具有默认不可变性、表达式统一处理（书中几乎没有 return\
  \ 语句）、模式匹配、定义处变性（Java 的使用处变性让类型变得很奇怪）等等。直言，函数式编程不仅仅是优雅的 Lambda 语法。\n\n作为语言的守护者，我们的目标是开发核心语言以及培养生态系统。Scala\
  \ 的成功得益于优秀的库、出色的 IDE 和工具，以及社区友好且乐于助人的成员。我完全享受了我的 Scala 十年——作为语言的实现者，看到程序员在许多领域使用\
  \ Scala 获得乐趣，是如此巨大的动力和灵感。\n\n我热爱 Scala 编程，希望你也是。代表 Scala 社区，欢迎你！\n\nAdriaan Moors\n\
