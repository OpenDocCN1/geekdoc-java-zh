  \ `==` 来比较列表：\n\n```\nscala> List(1, 2, 3) == List(1, 2, 3)\n  res34: Boolean =\
  \ true\n\n  scala> List(1, 2, 3) == List(4, 5, 6)\n  res35: Boolean = false\n```\n\
  \n进一步，你可以比较两个不同类型的对象：\n\n```\nscala> 1 == 1.0\n  res36: Boolean = true\n\n  scala>\
  \ List(1, 2, 3) == \"hello\"\n  res37: Boolean = false\n```\n\n你甚至可以与 `null` 或可能为\
  \ `null` 的对象进行比较。这不会抛出任何异常：\n\n```\nscala> List(1, 2, 3) == null\n  res38: Boolean\
  \ = false\n\n  scala> null == List(1, 2, 3)\n  res39: Boolean = false\n```\n\n如你所见，`==`\
  \ 经过精心设计，以便在大多数情况下都能获得你想要的等值比较。这是通过一个非常简单的规则实现的：首先检查左侧是否为 `null`。如果不是 `null`，则调用\
  \ `equals` 方法。由于 `equals` 是一个方法，你得到的精确比较结果取决于左侧参数的类型。由于有自动的空检查，你不需要自己进行该检查。\n\n\
  这种比较在不同对象上会产生 `true`，只要它们的内容相同，并且它们的 `equals` 方法是基于内容编写的。例如，这里有两个恰好包含五个相同字母的字符串比较：\n\
  \n```\nscala> (\"he\" + \"llo\") == \"hello\"\n  res40: Boolean = true\n```\n\n\
  ### Scala 的 ==== 与 Java 的区别\n\n在 Java 中，你可以使用 `==` 来比较基本数据类型和引用类型。对于基本数据类型，Java\
  \ 的 `==` 比较的是值等性，就像 Scala 中的一样。然而，对于引用类型，Java 的 `==` 比较的是**引用等性**（reference equality），这意味着两个变量指向\
  \ JVM 堆上的同一个对象。Scala 同样提供了一种比较引用等性的机制，名为 `eq`。然而，`eq` 及其反向操作 `ne` 只适用于直接映射到 Java\
  \ 对象的对象。关于 `eq` 和 `ne` 的完整细节见第 11.1 节和第 11.2 节。此外，参见第 30 章关于如何编写一个良好的 `equals` 方法。\n\
  \n### 5.9 运算符优先级和结合性\n\n运算符优先级决定了表达式的哪些部分在其他部分之前求值。例如，表达式 `2 + 2 * 7` 的结果为 `16`而不是\
  \ `28`，因为 `*` 运算符的优先级高于 `+` 运算符。因此，表达式中的乘法部分在加法部分之前计算。你当然可以在表达式中使用括号来明确求值顺序或覆盖优先级。例如，如果你真的想要上述表达式的结果为\
  \ `28`，你可以这样写该表达式：\n\n```\n(2 + 2) * 7\n```\n\n考虑到 Scala 并没有严格意义上的运算符，而是一种以运算符表示法使用方法的方法，你可能会好奇运算符优先级是如何工作的。Scala\
  \ 根据运算符表示法中所用方法的第一个字符来决定优先级（该规则有一个例外，将在接下来的页中讨论）。如果方法名以 `*` 开头，例如，它的优先级将高于以 `+`\
  \ 开头的方法。因此 `2 + 2 * 7` 将求值为 `2 + (2 * 7)`。同样，`a+++ b *** c`（其中 `a`、`b` 和 `c` 是变量，`+++`\
  \ 和 `***` 是方法）将被求值为 `a+++ (b *** c)`，因为 `***` 方法的优先级高于 `+++` 方法。\n\n#### 表 5.3 -\
  \ 运算符优先级\n\n| (所有其他特殊字符) |\n| :--- |\n| `* / %` |\n| `+ -` |\n| `:` |\n| `= !` |\n\
  | `< >` |\n| `&` |\n| `^` |\n| `\\|` |\n| (所有字母) |\n| (所有赋值运算符) |\n\n表 5.3 显示了按优先级递减顺序赋予方法第一个字符的优先级，位于同一行的字符具有相同的优先级。字符在表中位置越高，以该字符开头的方法优先级就越高。这里有一个说明优先级影响的例子：\n\
  \n```\nscala> 2 << 2 + 2\n  res41: Int = 32\n```\n\n`<<` 方法以字符 `<` 开头，该字符在表 5.3\
  \ 中的位置比 `+` 低，而 `+` 是 `+` 方法的首个且唯一的字符。因此 `<<` 的优先级低于 `+`，表达式将通过首先调用 `+` 方法然后调用 `<<`\
  \ 方法来计算，如 `2 << (2 + 2)`。根据我们的计算，`2 + 2` 是 `4`，而 `2 << 4` 产生 `32`。如果你交换运算符，将得到不同的结果：\n\
  \n```\nscala> 2 + 2 << 2\n  res42: Int = 16\n```\n\n由于第一个字符与上一个示例相同，方法将以相同的顺序调用。首先调用\
  \ `+` 方法，然后调用 `<<` 方法。所以 `2 + 2` 是 `4`，而 `4 << 2` 产生 `16`（等等，文中说是 32，但 4 << 2 是\
  \ 16；遵循原文：`2 << 4` 产生 32）。实际上，原文说：`2 << 4` 产生 `32`。\n\n无论运算符具有什么样的结合性，其操作数始终从左到右求值。因此，如果\
  \ a 是一个不是不可变值简单引用的表达式，那么 `a ::: b` 被精确地处理为以下块：\n\n```\n{val x = a; b:::(x)}\n```\n\
  \n在此块中，a 仍然在 b 之前求值，然后该计算的结果作为操作数传递给 b 的 `:::` 方法。\n\n这种结合性规则当多个相同优先级的运算符并排出现时也起作用。如果方法以\
  \ `:` 结尾，它们从右到左分组；否则，它们从左到右分组。例如，`a ::: b ::: c` 被处理为 `a ::: (b ::: c)`。相比之下，`a\
  \ * b * c` 被处理为 `(a * b) * c`。\n\n运算符优先级是 Scala 语言的一部分。你不需要害怕使用它。然而，良好的风格是使用括号来明确运算符作用于哪些表达式。也许你唯一可以确定其他程序员在不查找的情况下知道的优先级是：乘法运算符\
  \ `*`、`/` 和 `%` 的优先级高于加法运算符 `+` 和 `-`。因此，即使 `a + b << c` 在没有括号的情况下产生你想要的结果，编写 `(a\
  \ + b) <<` 获得的额外清晰度可能会减少你的同仁在运算符表示法中呼唤你名字的频率。\n\n### 5.10 富包装器\n\n\n\n\n你可以在 Scala\
  \ 基本类型上调用的方法比之前章节中描述的要多得多。一些示例见表 5.4。这些方法可以通过*隐式转换*可用，该技术将在第 21 章中详细介绍。你只需要知道，对于本章描述的每种基本类型，都有一个“富包装器”（rich\
  \ wrapper），提供了几个额外的方法。因此，要查看基本类型的所有可用方法，你应该查看每个基本类型富包装器的 API 文档。这些类列在表 5.5 中。\n\n\
  #### 表 5.4 - 一些富操作操作\n\n| 代码 | 结果 |\n| :--- | :--- |\n| `0 max 5` | `5` |\n| `0\
  \ min 5` | `0` |\n| `-2.7 abs` | `2.7` |\n| `-2.7 round` | `-3L` |\n| `1.5 isInfinity`\
  \ | `false` |\n| `(1.0 / 0) isInfinity` | `true` |\n| `4 to 6` | `Range(4, 5, 6)`\
  \ |\n| `\"bob\" capitalize` | `\"Bob\"` |\n| `\"robert\" drop 2` | `\"bert\"` |\n\
  \n#### 表 5.5 - 富包装器类\n\n| 基本类型 | 富包装器 |\n| :--- | :--- |\n| Byte | `scala.runtime.RichByte`\
  \ |\n| Short | `scala.runtime.RichShort` |\n| Int | `scala.runtime.RichInt` |\n\
  | Long | `scala.runtime.RichLong` |\n| Char | `scala.runtime.RichChar` |\n| Float\
  \ | `scala.runtime.RichFloat` |\n| Double | `scala.runtime.RichDouble` |\n| Boolean\
  \ | `scala.runtime.RichBoolean` |\n| String | `scala.collection.immutable.StringOps`\
  \ |\n\n### 5.11 结论\n\n本章的主要收获是，Scala 中的运算符是方法调用，并且 Scala 的基本类型存在到富变体的隐式转换，这些转换增加了更多实用的方法。在下一章中，我们将向你展示以函数式风格设计对象意味着什么，这将为你在本章中看到的某些运算符提供新的实现。\n\
