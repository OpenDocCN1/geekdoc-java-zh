  \ 18 章结尾一直到第 19 章开头的所有内容。)*\n\n**以下是针对第 19 章部分的译文：**\n\n[content]\n# 第 19 章\n\n\
  # 类型参数化\n\n在本章中，我们将解释 Scala 中类型参数化的细节。在此过程中，我们将通过一个具体的示例——纯函数队列的设计，演示在 第 13 章 中引入的一些信息隐藏技术。我们将类型参数化和信息隐藏放在一起介绍，因为信息隐藏可以用于获取更通用的类型参数变性。\n\
  \n类型参数化允许你编写泛型类和 trait。例如，集合是泛型的并接受一个类型参数：它们被定义为 `Set[T]`。因此，任何特定的集合实例可以是 `Set[String]`、`Set[Int]`\
  \ 等，但它必须是某种某种东西的集合。与 Java 允许原始类型不同，Scala 要求指定类型参数。变性定义了参数化类型的继承关系，例如 `Set[String]`\
  \ 是否是 `Set[AnyRef]` 的子类型。\n\n本章包含三个部分。第一部分开发纯函数队列的数据结构。第二部分开发隐藏该结构内部表示细节的技术。最后一部分解释类型参数的变性，以及它如何与信息隐藏相互作用。\n\
  \n\n\n函数式队列（functional queue）是一种具有三种操作的数据结构：\n\n| head | 返回队列的第一个元素 |\n| tail |\
  \ 返回一个去除了第一个元素的队列 |\n| enqueue | 返回一个包含给定元素的新队列 |\n| | 附加在末尾 |\n\n与可变队列不同，函数式队列在添加元素时不会改变其内容。相反，它会返回一个包含该元素的新队列。本章的目标是创建一个\
  \ `Queue` 的类，它的工作方式如下：\n\n```scala\nscala> val q = Queue(1, 2, 3)\n  q: Queue[Int]\
  \ = Queue(1, 2, 3)\n\n  scala> val q1 = q enqueue 4\n  q1: Queue[Int] = Queue(1,\
  \ 2, 3, 4)\n\n  scala> q\n  res0: Queue[Int] = Queue(1, 2, 3)\n```\n\n如果 `Queue`\
  \ 是一个可变实现，那么上面第二行中的 `enqueue` 操作将影响 `q` 的内容；事实上，在操作后，结果 `q1` 和原始队列 `q` 都将包含序列 1,\
  \ 2, 3, 4。但对于函数式队列，添加的值只会出现在结果 `q1` 中，而不在被操作的队列 `q` 中。\n\n纯函数式队列与列表也有某些相似之处。它们都是所谓的全持久数据结构（fully\
  \ persistent data structures），即使在扩展或修改后，旧版本仍然可用。它们都支持 `head` 和 `tail` 操作。但列表通常使用\
  \ `::` 操作在头部扩展，而队列则使用 `enqueue` 在末尾扩展。\n\n如何高效地实现这种结构呢？理想情况下，一个函数式（不可变）队列的开销不应该从根本上高于命令过程式（可变）队列。也就是说，所有三个操作\
  \ `head`、`tail` 和 `enqueue` 都应该在常时间内（constant time）运行。\n\n实现函数式队列的一种简单方法是使用列表作为表示类型。那么\
  \ `head` 和 `tail` 只需要翻译为列表的相同操作，而 `enqueue` 则是拼接操作。\n\n这将产生以下实现：\n\n```scala\nclass\
  \ SlowAppendQueueT { // 效率低下\n  def head = elems.head\n  def tail = new SlowAppendQueue(elems.tail)\n\
  \  def enqueue(x: T) = new SlowAppendQueue(elems ::: List(x))\n}\n```\n\n这种实现的问题在于\
  \ `enqueue` 操作。它所花费的时间与存储在队列中的元素数量成正比。如果你想要常数时间的添加，也可以尝试反转表示列表中的元素顺序，使得最后添加的元素出现在列表的最前面。这将导致以下实现：\n\
  \n```scala\nclass SlowHeadQueueT { // 效率低下\n  // smele 是 elems 反转后的结果\n  def head\
  \ = smele.last\n  def tail = new SlowHeadQueue(smele.init)\n  def enqueue(x: T)\
  \ = new SlowHeadQueue(x :: smele)\n}\n```\n\n现在 `enqueue` 是常数时间，但 `head` 和 `tail`\
  \ 不是。它们现在花费的时间与存储在队列中的元素数量成正比。\n\n观察这两个例子，想要设计出一个所有三个操作都是常数时间的实现似乎并不容易。事实上，这是否可行还值得怀疑！然而，通过结合这两个操作，你可以非常接近目标。其思想是用两个列表来表示队列，分别称为\
  \ `leading` 和 `trailing`。`leading` 列表包含靠近头部的元素，而 `trailing` 列表包含队列尾部的元素且顺序反转。整个队列的内容在任何时刻都等于\
  \ `\"leading ::: trailing.reverse\"`。\n\n现在，要添加元素，只需使用 `::` 操作符将其 cons 到 `trailing`\
  \ 列表中，因此 `enqueue` 是常数时间。这意味着，当通过连续的 `enqueue` 操作构建一个初始空队列时，`trailing` 列表会增长，而 `leading`\
  \ 列表将保持为空。然后，在对 `leading` 列表执行第一次 `head` 或 `tail` 操作之前，整个 `trailing` 列表会被复制到 `leading`，并反转元素的顺序。这是通过一个名为\
  \ `mirror`的操作完成的。列表 19.1 显示了使用这种方法的队列实现。\n\n```scala\nclass QueueT {\n  private\
  \ def mirror = \n    if (leading.isEmpty)\n      Queue(trailing.reverse, Nil)\n\
  \    else this\n\n  def head = \n    if (leading.isEmpty)\n      mirror.head\n \
  \   else leading.head\n\n  def tail = \n    if (leading.isEmpty)\n      mirror.tail\n\
  \    else Queue(leading.tail, trailing)\n\n  def enqueue(x: T) = Queue(leading,\
  \ x :: trailing)\n}\n```\n##### 列表 19.1 - 一个基础队列\n\n这种实现的复杂度是多少？`mirror` 操作可能会花费与元素数量成正比的时间，但仅当\
  \ `leading` 为空时如此。此时 `mirror` 必须对整个队列执行一次工作。假设 `head`、`tail` 和 `enqueue` 出现的频率大致相同，那么摊还复杂度（amortized\
  \ complexity）就是常数。因此，函数式队列在渐进上与可变队列一样高效。\n\n现在，有一些需要附加在该论点上的注意事项。首先，讨论仅关于渐进行为；常数因子可能会很大。其次，该论点基于\
  \ `head`、`tail` 和 `enqueue` 调用频率大致相等的基础上。如果 `head` 的调用频率远高于其他操作，那么该论点就不成立，因为每次调用\
  \ `head` 都可能涉及昂贵的重组。第二个注意事项是可以避免的；可以设计函数式队列，使得在系列 `head` 操作中只有第一次需要重组。你将在本章末尾发现如何实现。\n\
  \n### 19.2 信息隐藏\n\n列表 19.1 所示的 `Queue` 实现在效率方面已经很好了。尽管如此，你可能会反对这种效率是以暴露必要的实现细节为代价的。`Queue`\
  \ 构造函数是全局可见的，它接受列表作为参数，其中一个是反转的——这并不是直观的队列表示。我们需要方法向客户端代码隐藏这个构造函数。在本节中，我们将展示如何在\
  \ Scala 中实现。\n\n#### 私有构造函数和工厂方法\n\n在 Java 中，你可以通过将构造函数变为私有来隐藏它。在 Scala 中，主构造函数没有显式定义；它是通过类参数和主体定义的。然而，通过在类参数列表前添加\
  \ `private` 修饰符仍然可以隐藏主构造函数，如列表 19.2 所示：\n\n```scala\nclass Queue[T] private (\n\
  \    private val leading: List[T],\n    private val trailing: List[T]\n)\n```\n\n\
  ##### 列表 19.2 - 通过变为私有来隐藏主构造函数。\n\n类名和参数之间的 `private` 修饰符表示 `Queue` 的构造函数是私有的：可以在类内部及其伴对象中访问。类名\
  \ `Queue` 仍然是公开的，因此你可以将其作为类型使用，但不能调用它的构造函数：\n\n\n\n\n```scala\nscala> new Queue(List(1,\
  \ 2), List(3))\n  <console>:9: error: constructor Queue in class Queue cannot \n\
  \  be accessed in object $iw\n             new Queue(List(1, 2), List(3))\n    \
  \         ^\n```\n\n既然 `Queue` 类的主构造函数无法再从客户端代码调用，那么就需要其他方法来创建新队列。一种可能性是添加一个辅助构造函数，如下：\n\
  \n```scala\n def this() = this(Nil, Nil)\n```\n\n上一个示例所示的辅助构造函数构建了一个空队列。作为改进，辅助构造函数可以接收一个初始队列元素列表：\n\
  \n```scala\n def this(elems: T*) = this(elems.toList, Nil)\n```\n\n请记住，`T*` 是重复参数的符号，如第\
  \ 8.8 节所述。\n\n另一种可能性是添加一个工厂方法，根据这种初始元素序列构建队列。实现此点的一种优雅方法是定义一个与所定义类同名的对象 `Queue`，并包含一个\
  \ `apply` 方法，如列表 19.3 所示：\n\n```scala\n object Queue {\n    // 构建一个具有初始元素 `xs` 的队列\n\
  \    def applyT = new QueueT\n }\n```\n\n#### 列表 19.3 - Companion 对象中的 apply 工厂方法。\n\
  \n通过将此对象与 `Queue` 类放在同一个源文件中，你使该对象成为类的伴生对象。你在第 13.5 节中看到，伴生对象与其类具有相同的访问权限。正因为如此，对象\
  \ `Queue` 中的 `apply` 方法可以创建一个新的 `Queue` 对象，即使 `Queue` 构造函数是私有的。\n\n注意，由于工厂方法被命名为\
  \ `apply`，客户端可以使用类似于 `Queue(1, 2, 3)` 的表达式创建队列。由于 `Queue` 是对象而不是函数，该表达式会被展开为 `Queue.apply(1,\
  \ 2, 3)`。结果是，`Queue` 在客户端看来就像是一个全局定义的工厂方法。实际上，Scala 没有全局可见的方法；每个方法都必须包含在对象或类中。然而，通过在全局对象中使用名为\
  \ `apply` 的方法，你可以支持看起来像调用全局方法的用法模式。\n\n```scala\n trait Queue[T] {\n    def head:\
  \ T\n    def tail: Queue[T]\n    def enqueue(x: T): Queue[T]\n  }\n\n  object Queue\
  \ {\n\n    def applyT: Queue[T] = \n      new QueueImplT\n\n    private class QueueImplT\
  \ extends Queue[T] {\n\n      def mirror = \n        if (leading.isEmpty)\n    \
  \      new QueueImpl(trailing.reverse, Nil)\n        else \n          this\n\n \
  \     def head: T = mirror.leading.head\n\n      def tail: QueueImpl[T] = {\n  \
  \      val q = mirror\n        new QueueImpl(q.leading.tail, q.trailing)\n     \
  \ }\n\n      def enqueue(x: T) = \n        new QueueImpl(leading, trailing)\n  \
  \  }\n  }\n```\n\n#### 列表 19.4 - 函数式队列的类型抽象。\n\n##### 一种替代方案：私有类\n\n私有构造函数和私有成员是隐藏类的初始化和表示的一种方法。另一种更激进的方法是隐藏类本身，仅导出一个揭示类接口的\
  \ trait（特征）。列表 19.4 中的代码实现了这种设计。它是一个 `Queue` 的 trait，声明了 `head`、`tail` 和 `enqueue`\
  \ 方法。这三个方法都在子类 `QueueImpl` 中实现，而该子类本身是对象 `Queue` 的私有类。这向客户端暴露了之前相同的信息，但使用了不同的技术。此版本没有隐藏单独的构造函数和方法，而是隐藏了整个实现。\n\
  \n### 19.3 变体注解\n\n`Queue` 如在列表 19.4 中定义，是一个 trait，但不是一个类型。`Queue` 不是类型是因为因为它接受类型参数。结果是，你不能创建类型为\
  \ `Queue` 的变量：\n\n```scala\nscala> def doesCompile(q: Queue) = {}\n  <console>:8:\
  \ error: class Queue takes type parameters\n    def doesCompile(q: Queue) = {}\n\
  ```\n\n相反，trait `Queue` 允许你指定参数类型，例如 `Queue[String]`、`Queue[Int]` 或 `Queue[AnyRef]`：\n\
  \n```scala\nscala> def doesCompile(q: Queue[AnyRef]) = {}\ndoesCompile: Unit\n```\n\
  \n因此，`Queue` 是一个 trait，而 `Queue[String]` 是一个类型。`Queue` 也称为类型构造器，因为你可以通过指定类型参数来构造一个类型（这比于使用普通构造函数构造对象实例）。类型构造器\
  \ `Queue` “生成”了一族类型，包括 `Queue[Int]`、`Queue[String]` 和 `Queue[AnyRef]`。\n\n你也可以说\
  \ `Queue` 是一个泛型 trait。（注：此处原文部分似乎存在语乱或重复，已根据逻辑进行顺译）。\n\n\n\n\n\n在纯函数的世界中，许多类型自然上是协变的（灵活的）。然而，一旦引入了可变数据，情况就会发生变化。为了找出原因，请考虑一个简单的单元素单元类型，它是可读可写的，如**列表\
  \ 19.5 所示。\n\n```\nclass CellT {\n  private[this] var current = init\n  def get\
  \ = current\n  def set(x: T) = { current = x }\n}\n```\n\n##### 列表 19.5 - 非变体（刚性）Cell\
  \ 类。\n\n列表 19.5 中的 `Cell` 类型被声明为非变体（刚性）。为了论证，假设一下 `Cell` 被声明为协变的——*即*，它被声明为 `class\
  \ Cell[+T]`——并且这通过了 Scala 编译器的检查（实际上并没有通过，我们稍后会解释原因）。那么，你就可以构造出以下有问题的语句序列：\n\n```\n\
  val c1 = new CellString\nval c2: Cell[Any] = c1\nc2.set(1)\nval s: String = c1.get\n\
  ```\n\n单看这四行中的每一行看起来都是没问题的。第一行创建了一个字符串单元并将其存储在名为 `c1` 的 `val` 中。第二行定义了一个类型为 `Cell[Any]`\
  \ 的新 `val` `c2`，并用 `c1` 初始化它。这是可以的，因为假设 `Cells` 是协变的。第三行将单元 `c2` 的值设置为 `1`。这同样是可以的，因为赋值的值\
  \ `1` 是 `c2` 的元素类型 `Any` 的实例。最后，最后一行将 `c1` 的元素值赋值给一个字符串。这里没有奇怪的，因为两侧的类型相同。但结合在一起，这四行代码最终将整数\
  \ `1` 赋值给了字符串 `s`。这显然违反了类型健全性（type soundness）。\n\n是哪个操作导致了运行时错误的罪祸首？一定是第二个操作，因为它使用了协变子类型。其他的语句太简单且基础了。因此，`String`\
  \ 的 `Cell` 并不是 `Any` 的 `Cell`，因为你可以对 `Any` 的 `Cell` 做一些你对 `String` 的 `Cell` 不能做的事情。例如，你不能在\
  \ `String` 的 `Cell` 上使用 `Int` 参数调用 `set`。\n\n事实上，如果你将 `Cell` 的协变版本传递给 Scala 编译器，你会得到一个编译时错误：\n\
  \n```\nCell.scala:7: error: covariant type T occurs in\n  contravariant position\
  \ in type T of value x\n  def set(x: T) = current = x\n               ^\n```\n\n\
  ### 变体与数组\n\n将这种行为与 Java 中的数组进行比较很有趣。原则上，数组就像单元一样，除了它们可以包含多个元素。尽管如此，数组在 Java 中被视为协变的。\n\
  \n你可以尝试用 Java 数组实现与此处描述的单元交互类似的示例：\n\n```java\n// this is Java\nString[] a1 = {\
  \ \"abc\" };\nObject[] a2 = a1;\na2[0] = new Integer(17);\nString s = a1[0];\n```\n\
  \n如果你尝试这个示例，你会发现它是可以通过编译的。但执行程序时，当 `a2[0]` 被赋值为 `Integer` 时会抛出一个 `ArrayStore` 异常：\n\
  \n```\nException in thread \"main\" java.lang.ArrayStoreException: \n  java.lang.Integer\n\
  \    at JavaArrays.main(JavaArrays.java:8)\n```\n\n这里发生的是 Java 在运行时存储了数组的元素类型。然后，每当更新数组元素时，都会根据存储的类型检查新元素的值。如果它不是该类型的实例，就会抛出\
  \ `ArrayStore` 异常。\n\n你可能会问为什么 Java 采用这种既不安全又昂贵的设计。当问及这个问题时，Java 语言的主要发明者 James\
  \ Gosling 回答说他们希望有一种简单的方法来泛泛处理数组。例如，他们希望能够写一个排序数组所有元素的方法，使用如下接收 `Object` 数组的签名：\n\
  \n```java\nvoid sort(Object[] a, Comparator cmp) { ... }\n```\n\n数组的协变是必要的，以便可以将任意引用类型的数组传递给这个\
  \ `sort` 方法。当然，随着 Java 泛型的出现，现在可以使用类型参数编写此类 `sort` 方法，因此数组的协变不再需要。出于兼容性考虑，它一直保留在\
  \ Java 中。\n\nScala 尝试通过不将数组视为协变来比 Java 更纯粹。如果你将前几行翻译成 Scala，你会得到：\n\n```scala\n\
  val a1 = Array(\"abc\")\nval a2: Array[Any] = a1 // Error: type mismatch\nfound:\
  \ Array[String]\nrequired: Array[Any]\n```\n\n### 19.4 检查变体\n\n现在你已经看到了一些示例，你可能会好奇哪种定义需要被拒绝，哪些可以被接受。到为止，所有违反健全性的行为都涉及某些可赋值的字段或数组。另一方面，队列的纯函数实现看起来是协变的良好候选。然而，下面的示例表明，即使没有可赋值的字段，你也可以“工程”出一个不健全的情况。为了设置这个示例，假设\
  \ 19.4 中定义的队列是协变的。然后创建一个队列子类，将元素类型专门化 `Int` 并重写 `enqueue` 方法：\n\n```scala\nclass\
  \ StrangeIntQueue extends Queue[Int] {\n  override def enqueue(x: Int) = {\n   \
  \ println(math.sqrt(x))\n    super.enqueue(x)\n  }\n}\n```\n\n`StrangeIntQueue`\
  \ 中的 `enqueue` 方法打印其（整数）参数的平方根。现在，你可以用两行写出一个反例：\n\n```scala\nval x: Queue[Any] =\
  \ new StrangeIntQueue\nx.enqueue(\"abc\")\n```\n\n这两行中的第一行是有效的，因为 `StrangeIntQueue`\
  \ 是 `Queue[Int]` 的子类，而在假设队列协变的情况下，`Queue[Int]` 是 `Queue[Any]` 的子类型。第二行有效，因为你可以向\
  \ `Queue[Any]` 添加 `String`。但结合在一起，这两行产生了对字符串应用平方根方法的结果，这没有意义。\n\n显然，不仅仅是可变字段会导致协变类型不健全。问题更一般。事实证明，一旦泛型参数类型出现在方法参数类型中，包含它的类或特征就可以在该类型参数上是协变的。\n\
  \n对于队列，`enqueue` 方法违反了这一条件：\n\n```scala\nclass Queue[+T] {\n  def enqueue(x: T)\
  \ = \n}\n```\n\n通过 Scala 编译器运行上述修改队列类将产生：\n\n```\nQueues.scala:11: error: covariant\
  \ type T occurs in\n  contravariant position in type T of value x\n  def enqueue(x:\
  \ T) = \n               ^\n```\n\n\n\n\n可重新赋值字段是规则的一个特例，该规则禁止将带有 `+` 注角的类型参数作为方法的参数类型。如第\
  \ 18.2 节所述，一个可重新赋值字段 `var x: T` 在 Scala 中被视为一个 getter 方法 `def x: T` 和一个 setter 方法\
  \ `def x_=(y: T)`。如你所见，setter 方法有一个类型为字段类型 `T` 的参数。因此该类型可以是协变的。\n\n#### 快速通道\n\n\
  在本节的剩余部分中，我们将描述 Scala 编译器检查变性注解的机制。如果你现在对这些细节不感兴趣，可以安全地跳到第 19.5 节。最重要的一点是，Scala\
  \ 编译器会检查你放置在类型参数上的任何变性注解。例如，如果你尝试将一个类型参数声明为协变（通过添加 `+`），但这可能导致潜在的运行时错误，那么你的程序将无法编译。\n\
  \n为了验证变性注解的正确性，Scala 编译器将类或 trait 体内的所有位置分类为 `positive`（正）、`negative`（负）或 `neutral`（中性）。“位置”是指类或\
  \ trait（从现在起我们只写“类”）体中可以使用类型参数的任何位置。例如，每个方法的值参数都是一个位置，因为方法值参数有一个类型。因此，类型参数可以出现在该位置。\n\
  \n编译器检查类的每个类型参数的每次使用。带有 `+` 注角的类型参数只能在正位置使用，而带有 `-` 注角的类型参数只能在负位置使用。没有变性注解的类型参数可以在任何位置使用，因此它是唯一可以在类体中性位置使用的类型参数类型。\n\
  \n为了对位置进行分类，编译器从类型参数的声明开始，然后向内部移动通过更深嵌套层。声明类顶层的位置被分类为正。默认情况下，更深嵌套层的位置的分类与其外层级的分类相同，但有少数例外分类会发生变化。方法值参数的位置相对于方法之外的位置被分类为\
  \ `flipped`（翻转）分类，其中正分类的翻转为负，负分类的翻转为正，中性分类的翻转仍为中性。\n\n除了方法值参数位置外，当前分类在方法的类型参数处也会被翻转。分类有时会在类型的类型参数位置发生翻转，例如\
  \ `C[Arg]` 中的 `Arg`，这取决于相应类型参数的变性。如果 `C` 的类型参数带有 `+` 注角，则分类不变。如果 `C` 的类型参数带有 `-`\
  \ 注角，则当前分类被翻转。如果 `C` 的类型参数没有变性注解，则当前分类变为中性。\n\n作为一个稍为刻意的例子，考虑以下类定义，其中几个位置被标记了它们的分类，`^+`（正）或\
  \ `^-`（负）：\n\n```scala\nabstract class Cat[-T, +U] {\n  def meowW^-\n    : Cat[Cat[U+,\
  \ T^-]-, U^+]^+\n}\n```\n\n类型参数 `W` 以及两个值参数 `volume` 和 `listener` 的位置都是负的。观察 `meow`\
  \ 的结果类型，第一个 `Cat[U, T]` 参数的位置是负的，因为 `Cat` 的第一个类型参数 `T` 带有 `-` 注角。该参数内部的类型 `U` 再次正位置（两次翻转），而该参数内部的类型\
  \ `T` 仍然在负位置。\n\n从这段讨论可以看出，要跟踪变性位置是非常的。这就是为什么 Scala 编译器为你完成这项工作是一件令人松慰的事。\n\n一旦计算出分类，编译器就会检查每个类型参数是否仅用于分类恰当的位置。在这种情况下，`T`\
  \ 仅在负位置使用，而 `U` 仅在正位置使用。因此，类 `Cat` 是类型正确的。\n\n### 19.5 下界\n\n回到 `Queue` 类。你看到在列表\
  \ 19.4 中显示的 `Queue[T]` 之前的定义无法在 `T` 上变为协变，因为 `T` 作为 `enqueue` 方法参数的类型出现，这是一个负位置。\n\
  \n幸运的是，有一种方法可以解决这个问题：你可以通过使 `enqueue` 变为多态（即为 `enqueue` 方法本身赋予一个类型参数）并对其类型参数使用 `lower\
  \ bound`（下界）来泛化 `enqueue`。列表 19.6 显示了实现这一想法的 `Queue` 新定义。\n\n```scala\nclass Queue[+T]\
  \ (private val leading: List[T],\n      private val trailing: List[T]) {\n  def\
  \ enqueueU > T = \n    new QueueU\n  // ...\n}\n```\n\n##### 列表 19.6 - 带有下界的类型参数。\n\
  \n新定义为 `enqueue` 提供了一个类型参数 `U`，并使用语法 `U > T` 将 `T` 定义为 `U` 的下界。结果是，`U` 必须是 `T` 的超类。方法的返回值现在是\
  \ `Queue[U]` 而不是 `Queue[T]`。\n\n例如，假设 `Fruit` 类，它有两个子类 `Apple` 和 `Orange`。有了新定义的\
  \ `Queue`，可以向 `Queue[Apple]` 添加 `Orange`。结果将是 `Queue[Fruit]`。\n\n这种修改后的 `enqueue`\
  \ 定义是类型正确的。直观地说，如果 `T` 比预期的类型更具体（例如是 `Apple` 而不是 `Fruit`），调用 `enqueue` 仍然有效，因为 `U`（Fruit）仍然是\
  \ `T` 的超类。\n\n新定义的 `enqueue` 可能比旧的更好，因为它更通用。与旧版本不同，新定义允许添加队列元素类型 `T` 的任意超类 `U`。结果是\
  \ `Queue[U]`。结合队列的协变，这为建模不同元素类型的队列提供了所需的活性。\n\n这表明变性注解和下界可以很好协作。它们是类型驱动设计的良好示例，接口的类型指导了其详细的设计和实现。在\
  \ `queue` 的情况下，你可能没有考虑到带有下界的 `enqueue` 的精细实现。但你可能决定让队列变为协变，在这种情况下，编译器会指出 `enqueue`\
  \ 的变性错误。通过添加下界来修正变性错误使得 `enqueue` 更通用，且整个队列更加易用。\n\n这一观察也是 Scala 偏于声明处变性而非 Java\
  \ 通配符中的用处变性的主要原因。在用处变性中，你必须自己设计一个类。该类的客户端才需要填写通配符，如果他们写错了，一些重要的实例方法将不再适用。在定义处变性中，你向编译器表达了你的意图，编译器会双重检查你想要提供的方法是否确实可用。\n\
  \n### 19.6 逆变性\n\n到本章为止，你看到的所有示例都是协变或非变的。但存在某些逆变性变自然的情况。例如，考虑列表 19.7 所示的输出通道 trait：\n\
  \n\n\n\n\n```\ntrait OutputChannel[-T] {\n  def write(x: T)\n}\n```\n\n##### 列表\
  \ 19.7 - 一个逆变的输出通道。\n\n在这里，`OutputChannel` 被定义为 `T` 的逆变。因此，一个 `AnyRefs` 的输出通道是 `Strings`\
  \ 的输出通道的子类型。虽然这看起来可能不直观，但实际上是有意义的。为了理解为什么，请考虑你可以对 `OutputChannel[String]` 做什么。唯一支持的操作是向其写入一个\
  \ `String`。同样的操作也可以在 `OutputChannel[AnyRef]` 上执行。因此，用 `OutputChannel[AnyRef]` 替换\
  \ `OutputChannel[String]` 是安全的。相比之下，在需要 `OutputChannel[AnyRef]` 的地方替换 `OutputChannel[String]`\
  \ 则是不安全的。毕竟，你可以向 `OutputChannel[AnyRef]` 发送任何对象，而 `OutputChannel[String]` 则要求写入的值都必须是字符串。\n\
  \n这种推论逻辑引向了类型系统设计中的一个通用原则：如果你可以在任何需要类型 `U` 的值的地方替换类型 `T` 的值，那么就可以安全地假设类型 `T` 是类型\
  \ `U` 的子类型。这被称为 **Liskov Substitution 原则**。如果 `T` 支持与 `U` 相同的操作，并且 `T` 的所有操作要求的更少且提供的比\
  \ `U` 的对应操作更多，则该原则成立。在输出通道的的情况下，`OutputChannel[AnyRef]` 可以作为 `OutputChannel[String]`\
  \ 的子类型，因为两者都支持相同的 `write` 操作，并且该操作在 `OutputChannel[AnyRef]` 中要求的比在 `OutputChannel[String]`\
  \ 中要求的少。“少”意味着在第一种情况下，参数只需要是 `AnyRef`，而在第二种情况下它被要求是 `String`。\n\n有时，协变和逆变会混合在同一个类型中。一个著名的例子是\
  \ Scala 的函数特性类（traits）。例如，每当你编写函数类型 `A => B` 时，Scala 都会将其扩展为 `Function1[A, B]`。标准库中\
  \ `Function1` 的定义同时使用了协变和逆变：`Function1` 特性类在函数参数类型 `S` 上是逆变的，在结果类型 `T` 上是协变的，如列表\
  \ 19.8 所示。这满足了 Liskov Substitution 原则，因为参数是被需要的，而结果是被提供的。\n\n```\ntrait Function1[-S,\
  \ +T] {\n  def apply(x: S): T\n}\n```\n\n##### 列表 19.8 - Function1 的协变与逆变。\n\n作为一个示例，请考虑列表\
  \ 19.9 中所示的应用。在这里，`Publication` 类包含一个类型为 `String` 的参数化字段 `title`。`Book` 类继承 `Publication`\
  \ 并将其字符串参数 `title` 传递给父类的构造函数。`Library` 单例对象定义了一组书和一个方法 `printBookList`，该方法接受一个名为\
  \ `info` 的、类型为 `Book => AnyRef` 的函数。换句话说，`printBookList` 唯一参数的类型是一个接受一个 `Book` 参数并返回\
  \ `AnyRef` 的函数。`Customer` 应用定义了一个方法 `getTitle`，它接收一个 `Publication` 作为唯一参数并返回一个 `String`，即传递的\
  \ `Publication` 的 `title`。\n\n```scala\nclass Publication(val title: String)\n \
  \ class Book(title: String) extends Publication(title)\n\n  object Library {\n \
  \   val books: Set[Book] =\n      Set(\n        new Book(\"Programming in Scala\"\
  ),\n        new Book(\"Walden\")\n      )\n    def printBookList(info: Book => AnyRef)\
  \ = {\n      for (book <- books) println(info(book))\n    }\n  }\n\n  object Customer\
  \ extends App {\n    def getTitle(p: Publication): String = p.title\n    Library.printBookList(getTitle)\n\
  \  }\n```\n\n##### 列表 19.9 - 函数类型参数变性的演示。\n\n现在来看 `Customer` 中的最后一行。这行代码调用了 `Library`\
  \ 的 `printBookList` 方法并传递了封装在函数值中的 `getTitle`：\n\n```\nLibrary.printBookList(getTitle)\n\
  ```\n\n这行代码通过了类型检查，尽管 `String`（函数的返回类型）是 `AnyRef`（`printBookList` 的参数 `info` 的结果类型）的子类型。这段代码能够通过编译器的，是因为函数的结果类型被声明为协变的（列表\
  \ 19.8 中的 `+T`）。如果你查看 `printBookList` 的体内部，就可以看出为什么这样做是有意义的。\n\n`printBookList`\
  \ 方法遍历其列表并在每本书上调用传递的函数。它将 `info` 返回的 `AnyRef` 传递给 `println`。这对于 `String` 是有效的，因为任何\
  \ `AnyRef` 的子类，这就是结果类型的协变。\n\n现在考虑函数的参数。`printBookList` 的参数被声明为 `Book`。`getTitle`\
  \ 接收 `Publication`，它是 `Book` 的超类。这之所以可行，是因为 `printBookList` 的参数是 `Book`，这是参数类型的逆变。\n\
  \n##### 图 19.1 - 函数参数中的协变与逆变。``````\nclass Queue [+T] private (\n  private[this]\
  \ var leading: List[T],\n  private[this] var trailing: List[T]\n) {\n\n  private\
  \ def mirror() = \n    if (leading.isEmpty) {\n      while (!trailing.isEmpty) {\n\
  \        leading = trailing.head :: leading\n        trailing = trailing.tail\n\
  \      }\n    }\n\n  def head: T = { \n    mirror()\n    leading.head \n  }\n\n\
  \  def tail: Queue[T] = { \n    mirror()\n    new Queue(leading.tail, trailing)\
  \ \n  }\n\n  def enqueueU > T = \n    new QueueU\n}\n```\n##### 列表 19.10 - 一个优化的函数队列。\n\
  \n### 19.7 对象私有数据\n\n目前为止看到的 `Queue` 类有一个问题，如果在 `leading` 为空的情况下连续调用 `head`，`mirror`\
  \ 操作将反复将 `trailing` 复制到 `leading`。通过添加一些谨慎的副作用可以避免这种浪费的复制。列表 19.10 展示了 `Queue` 的新实现。\n\
  \n\n\n\n\n与之前的版本不同之处在于现在 `leading` 和 `trailing` 是可重新赋值的变量，并且 `mirror` 会执行从 `trailing`\
  \ 到 `leading` 的反向拷贝，作为当前队列的副作用，而不是返回一个新队列。这种副作用纯粹是 `Queue` 操作内部实现的副作用；由于 `leading`\
  \ 和 `trailing` 是私有变量，该效果对 `Queue` 的客户端是不可见的。因此，根据第 18 章中建立的术语，尽管 `Queue` 现在包含了可重新赋值的字段，但新版本的\
  \ `Queue` 仍然是纯函数对象。\n\n你可能会想这段代码是否通过了 Scala 的类型检查。毕竟，队列现在包含了两个具有协变参数类型 `T` 的可重新赋值字段。这难道不是违反了变性规则吗？事实确实如此，但有一个细节：`leading`\
  \ 和 `trailing` 具有 `private[this]` 修饰符，因此被声明为对象私有。\n\n如第 13.5 节中提到的，对象私有成员只能在定义的对象内部访问。事实证明，从定义它们的同一个对象内部访问变量不会引起变性问题。直观的解释是，为了构造一个会导致变性导致类型错误的案例，你需要一个指向包含对象的引用，且该对象的静态类型要比定义对象时的类型更弱。然而，对于对象私有值的访问，这是是不可能的。\n\
  \nScala 的变性检查规则对对象私有定义包含一个特殊情况。在检查带有 `+` 或 `-` 注解的类型参数是否仅出现在具有相同变性分类的位置时，这些定义会被省略在外。因此，列表\
  \ 19.10 中的代码可以无错误地编译。另一方面，如果你从两个私有修饰符中去掉了 `[this]` 限定符，你会看到两个类型错误：\n\n```\n Queues.scala:1:\
  \ error: covariant type T occurs in \n  contravariant position in type List[T] of\
  \ parameter of\n  setter leading_=\n  class Queue[+T] private (private var leading:\
  \ List[T],\n                           ^\n  Queues.scala:1: error: covariant type\
  \ T occurs in \n  contravariant position in type List[T] of parameter of\n  setter\
  \ trailing_=\n                           private var trailing: List[T]) {\n    \
  \                       ^\n```\n\n### 19.8 上界\n\n在列表 16.1 此处中，我们展示了一个用于列表的合并排序函数，该函数将第一个参数接收比较函数，并将第二个柯里化参数接收待排序的列表。你可能想要组织此类排序函数的另一种方法是要求列表的类型混入\
  \ `Ordered` 特性。如第 12.4 节中提到的，通过在类中混入 `Ordered` 并实现一个抽象方法 `compare`，你能够让客户端使用 `<`,\
  \ `>`, `<=` 和 `>=` 来比较该类的实例。例如，列表 19.11 展示了将 `Ordered` 混入 `Person` 类中。\n\n结果是，你可以像这样比较两个个人：\n\
  \n```\nscala> val robert = new Person(\"Robert\", \"Jones\")\n  robert: Person =\
  \ Robert Jones\n\n  scala> val sally = new Person(\"Sally\", \"Smith\")\n  sally:\
  \ Person = Sally Smith\n\n  scala> robert < sally\n  res0: Boolean = true\n```\n\
  \n```scala\nclass Person(val firstName: String, val lastName: String)\n      extends\
  \ Ordered[Person] {\n\n  def compare(that: Person) = {\n    val lastNameComparison\
  \ =\n      lastName.compareTo(that.lastName)\n    if (lastNameComparison != 0)\n\
  \      lastNameComparison\n    else\n      firstName.compareTo(that.firstName)\n\
  \  }\n\n  override def toString = firstName + lastName\n}\n```\n\n#### 列表 19.11\
  \ - 一个混入 Ordered 的 Person 类。\n\n```scala\n def orderedSort[T <: Ordered[T]](xs:\
  \ List[T]): List[T] = {\n  def merge(xs: List[T], ys: List[T]): List[T] =\n  (xs,\
  \ ys) match {\n    case (Nil, _) => ys\n    case (_, Nil) => xs\n    case (x ::\
  \ xs1, y :: ys1) =>\n      if (x < y) x :: merge(xs1, ys)\n      else y :: merge(xs,\
  \ ys1)\n  }\n  val n = xs.length / 2\n  if (n == 0) xs\n  else {\n    val (ys, zs)\
  \ = xs.splitAt(n)\n    merge(orderedSort(ys), orderedSort(zs))\n  }\n}\n```\n\n\
  #### 列表 19.12 - 一个带有上界的合并排序函数。\n\n为了要求传递给排序函数的列表类型混入 `Ordered`，你需要使用*上界*（upper bound）。上界的指定方式与下界类似，除了用于下界的\
  \ `:` 符号外，你使用的是 `<:` 符号，如列表 19.12 所示。\n\n通过 `\"T <: Ordered[T]`\"` 语法，你指明类型参数 `T`\
  \ 有一个上界 `Ordered[T]`。这意味着传递给 `orderedSort` 的列表元素类型必须是 `Ordered` 的子类型。因此，你可以向 `orderedSort`\
  \ 传递一个 `List[Person]`，因为 `Person` 混入了 `Ordered`。\n\n例如，考虑这个列表：\n\n```\nscala> val\
  \ people = List(\n  new Person(\"Larry\", \"Wall\"),\n  new Person(\"Anders\", \"\
  Hejberg\"),\n  new Person(\"Guido\", \"Rossum\"),\n  new Person(\"Alan\", \"Kay\"\
  ),\n  new Person(\"Yukihiro\", \"Matsumoto\")\n)\n  people: List[Person] = List(Larry\
  \ Wall, Anders Hejberg, Guido Rossum, Alan Kay, Yukihiro Matsumoto)\n```\n\n由于此列表的元素类型\
  \ `Person` 混入了（因此是 `Ordered[People]` 的子类型），你可以将列表传递给 `orderedSort`：\n\n```scala\n\
  scala> val sortedPeople = orderedSort(people)\n  sortedPeople: List[Person] = List(Anders\
  \ Hejberg, Alan Kay, Yukihiro Matsumoto, Guido Rossum, Larry Wall)\n```\n\n现在，虽然列表\
  \ 19.12 中所示的排序函数作为上界的有效说明，但它实际上并不是 Scala 中利用 `Ordered` 特性设计排序函数最通的方法。\n\n例如，你无法使用\
  \ `orderedSort` 函数来排序整数列表，因为 `Int` 类不是 `Ordered` 的子类型：\n\n```\nscala> val wontCompile\
  \ = orderedSort(List(3, 2, 1))\n  <console>:5: error: inferred type arguments [Int]\
  \ do\n    not conform to method orderedSort's type\n      parameter bounds [T <:\
  \ Ordered[T]]\n      val wontCompile = orderedSort(List(3, 2, 1))\n            \
  \               ^\n```\n\n在第 21.6 节中，我们将向你展示如何使用*隐式参数*和*上下文边界*来实现更通用的解决方案。\n\n###\
  \ 19.9 总结\n\n在本章中你学习了多种隐藏信息的技术：私有构造函数、工厂方法、类型抽象和对象私有成员。你还学习了如何指定数据类型变性以及它对类实现的意义。最后，你看到了有助于获取灵活变性注解的两种技术：方法类型参数的下界以及局部字段和方法的\
  \ `private[this]` 注解。\n\n* * *\n\n#### 第 19 章的脚注：\n\n[1] 超类型和子类型关系是自反的，这意味着一个类型既是自身的超类型也是子类型。即使\
  \ T 是 U 的下界，你仍然可以向 enqueue 传递一个 T。\n\n[2] 技术上，发生的是下界发生了翻转。类型参数 U 位于负位置（1 次翻转），而下界\
  \ (>: T) 位于正位置（2 次翻转）。\n\n\n\n\n如果类或 trait 的成员在类中没有完整的定义，则该成员是抽象的。抽象成员 intended\
  \ 在声明该成员的类的子类中实现。这种理念在许多面向对象的编程语言中都存在。例如，Java 允许你声明抽象方法。Scala 也允许你声明此类方法，正如你在第 10.2\
  \ 节中所看到的。。但 Scala 远超此，并以完全通的方式实现了这一理念：除了方法外，你还可以声明类和 trait 的成员为抽象字段甚至抽象类型。\n\n在本章中，我们将描述所有四种抽象成员：`vals`、`vars`、`methods`\
  \ 和 `types`。在此过程中，我们将讨论预初始化字段、懒性值（lazy vals）、路径依赖类型和枚举。\n\n## 20.1 抽象成员概览\n\n下面的\
  \ trait 声明了每种类型的抽象成员：一个抽象类型 (`T`)、一个方法 (`transform`)、一个 `val` (`initial`) 和一个 `var`\
  \ (`current`)：\n\n```\n trait Abstract {\n  type T\n  def transform(x: T): T\n \
  \ val initial: T\n  var current: T\n}\n```\n\n`Abstract` 的具体实现需要为它的每个抽象成员填充定义。这是一个提供了这些定义的示例实现：\n\
  \n```\n class Concrete extends Abstract {\n  type T = String\n  def transform(x:\
  \ String) = x + x\n  val initial = \"hi\"\n  var current = initial\n}\n```\n\n该实现通过将\
  \ `T` 定义为类型 `String` 的别名，为类型名 `T` 赋予了具体的含义。`transform` 操作将给定的字符串与其自身拼接，而 `initial`\
  \ 和 `current` 值都被设置为 \"hi\"。\n\n这个例子让你对 Scala 中存在哪些类型的抽象成员有一个初步的了解。本章的剩余部分将介绍细节，并解释这些新形式的抽象成员以及泛义的类型成员的用途。\n\
  \n### 20.2 类型成员\n\n正如你在上一节的示例所示，Scala 中的 `abstract type`（抽象类型）意味着一个声明（使用 `type`\
  \ 关键字）为类或 trait 成员的类型，但没有指定定义。类本身可以是抽象的，而 trait 按定义上就是抽象的，但这两者都不是 Scala 中所指的 `abstract\
  \ types`。Scala 中的抽象类型始终是某个类或 trait 的成员，例如 trait `Abstract` 中的 `type T`。\n\n你可以将非抽象的（或“具体的”）类型成员（例如类\
  \ `Concrete` 中的 `type T`）看作是为类型定义一个新名称或“别名”（alias）的方法。例如，在类 `Concrete` 中，类型 `String`\
  \ 被赋予了别名 `T`。因此，在类 `Concrete` 的定义中出现 `T` 的地方，它都意味着 `String`。这包括 `transform`、`initial`\
  \ 和 `current` 的参数类型和结果类型，它们在超父 trait `Abstract` 中声明时提到了 `T`。因此，当类 `Concrete` 实现这些方法时，那些\
  \ `T` 会被解释为 `String`。\n\n使用类型成员的原因之一是为一个类型定义一个简短且具描述性的别名，该类型的真实名称可能比别名更冗长或含义不那么直观。此类类型成员可以帮助澄清类或\
  \ trait 代码。类型成员的另一个主要用途是声明必须在子类中定义的抽象类型。这种用法在上一节中已演示，将在本章稍后部分详细描述。\n\n### 20.3 抽象\
  \ vals\n\n抽象 `val` 声明的形式如下：\n\n```\n val initial: String\n```\n\n它为 `val` 提供了一个名称和类型，但没有提供它的值。这个值必须由子类中具体的\
  \ `val` 定义来提供。例如，类 `Concrete` 使用以下代码实现了 `val`：\n\n```\n val initial = \"hi\"\n```\n\
  \n当你在类中使用抽象 `val` 声明时，是因为你还尚不知道类中正确的值，但你确定该变量在类的每个实例中都具有一个不可改变的值。\n\n抽象 `val` 声明类似于如下所示的抽象无参数方法声明：\n\
  \n```\n def initial: String\n```\n\n客户端代码将以完全相同的方式引用该 `val` 和该方法（即 `obj.initial`）。然而，如果\
  \ `initial` 是一个抽象 `val`，则客户端可以保证 `obj.initial` 在每次被引用时都会产生相同的值。如果 `initial` 是一个抽象方法，这种保证就不成立了，因为在这种情况下，`initial`\
  \ 可能由一个具体的方法实现，该方法每次被调用时都会返回不同的值。\n\n换句话说，抽象 `val` 限制了它的合法实现：任何实现必须是一个 `val` 定义；它不能是\
  \ `var` 或 `def`。另一方面，抽象方法的声明可以由具体的方法定义和具体的 `val` 定义来实现。给定列表 20.1 所示的抽象类 `Fruit`，类\
  \ `Apple` 将是一个合法的子类实现，但类 `BadApple` 则不是。\n\n```\n abstract class Fruit {\n  val\
  \ v: String // 'v' 代表 value\n  def m: String // 'm' 代表 method\n}\n\n abstract class\
  \ Apple extends Fruit {\n  val v: String // 允许用 'val' 覆盖 'def'\n  val m: String\n\
  }\n\n abstract class BadApple extends Fruit {\n  def v: String // 错误：不能用 'def' 覆盖\
  \ 'val'\n  def m: String\n}\n```\n##### 列表 20.1 - 覆盖抽象 vals 和方法。\n\n### 20.4 抽象\
  \ vars\n\n与抽象 `val` 类似，抽象 `var` 仅声明一个名称和类型，但没有初始值。例如，列表 20.2 显示了一个 trait `AbstractTime`，它声明了两个变量：\n\
  \n```\n trait AbstractTime {\n  var hour: Int\n  var minute: Int\n}\n```\n#####\
  \ 列表 20.2 - 抽象 vars。\n\n`hour` 和 `minute` 这样的抽象 vars 是什么意思？你在第 18.2 节](#mutable-objects.properties)\
  \ 中看到类成员 `vars` 配有 getter 和 setter 方法。对于抽象 vars 也是如此。如果你声明一个名为 `hour` 的抽象 var，你隐含地声明了一个抽象\
  \ getter 方法 `hour` 和一个抽象 setter 方法 `hour=`。没有待定义的赋值字段——那将由定义具体 var 的子类提供。例如，列表 20.3\
  \ 中 `AbstractTime` 的定义等同于：\n\n```\n trait AbstractTime {\n  def hour: Int // hour\
  \ 的 getter\n  def hour=(x: Int) // hour 的 setter\n  def minute: Int // minute 的\
  \ getter\n  def minute=(x: Int) // minute 的 setter\n}\n```\n##### 列表 20.3 - 抽象 vars\
  \ 如何展开为 getter 和 setter。\n\n## 20.5 初始化抽象 vals\n\n抽象 vals 有时起到类似于父类参数的作用：它们允许你在子类中提供父类中缺失的细节。这对于\
  \ trait 来说特别重要，因为 trait 没有可以传递参数的构造函数。因此，参数化 trait 的通常方法是通过子类类实现的抽象 vals 实现的。\n\n\
  例如，考虑将第 6 章](#functional-objects.html)中的 `Rational` 类重构为 trait，如列表 6.5 所示：\n\n```\n\
  \ trait RationalTrait {\n  val numerArg: Int\n  val denomArg: Int\n}\n```\n\n第 6\
  \ 章](#functional-objects.html) 中的 `Rational` 类有两个参数：`n` 用于有理数的分子，`d` 用于分母。这里给出的\
  \ `RationalTrait` trait 定义了两个抽象 vals：`numerArg` 和 `denomArg`。为了实例化该 trait 的具体实例，你需要实现这些抽象\
  \ val 定义。这是一个示例：\n\n\n\n\n\n```\n new RationalTrait {\n  val numerArg = 1\n  val\
  \ denomArg = 2\n}\n```\n\n在这里，关键字 `new` 出现在 trait 名称 `RationalTrait` 之前，后面跟着用大括号括的类体。该表达式产生了一个\
  \ `anonymous class` 的实例，该类混入了该 trait 并由其类体定义。这种特定的匿名类实例化效果与创建实例 `new Rational(1,\
  \ 2)` 类似。\n\n然而，这种类比并不是完美的。在表达式初始化的顺序上存在细微的差异。当你写：\n\n```\n new Rational(expr1,\
  \ expr2)\n```\n\n两个表达式 `expr1` 和 `expr2` 在类 `Rational` 初始化之前就会被求值，因此 `expr1` 和 `expr2`\
  \ 的值可用于类 `Rational` 的初始化。\n\n对于 trait 来说，情况恰相反。当你写：\n\n```\n new RationalTrait {\n\
  \  val numerArg = expr1\n  val denomArg = expr2\n}\n```\n\n表达式 `expr1` 和 `expr2`\
  \ 是作为匿名类初始化的一部分被求值的，但匿名类是在 `RationalTrait` *之后* 才初始化的。因此，`numerArg` 和 `denomArg`\
  \ 的值在 `RationalTrait` 初始化期间是不可用的（更准确地说，选择任一个值都会产生类型 `Int` 的默认值 `0`）。对于之前给出的 `RationalTrait`\
  \ 定义，这不是一个问题，因为 trait 的初始化没有使用 `numerArg` 或 `denomArg` 的值。但在[Listing 20.4]所示的 `RationalTrait`\
  \ 变体中，这个问题出现了，该变体定义了归一化的分子和分母。\n\n```\n trait RationalTrait { \n    val numerArg:\
  \ Int \n    val denomArg: Int \n    require(denomArg != 0)\n    private val g =\
  \ gcd(numerArg, denomArg)\n    val numer = numerArg / g\n    val denom = denomArg\
  \ / g\n    private def gcd(a: Int, b: Int): Int = \n      if (b == 0) a else gcd(b,\
  \ a % b)\n    override def toString = numer + \"/\" + denom\n  }\n```\n\n##### Listing\
  \ 20.4 - 使用其抽象 vals 的 trait。\n\n如果你尝试使用某些不是简单字面量的分子和分母表达式来实例化这个 trait，你将得到一个异常：\n\
  \n```\nscala> val x = 2\n  x: Int = 2\n\n  scala> new RationalTrait {\n        \
  \  val numerArg = 1 * x\n          val denomArg = 2 * x\n        }\n  java.lang.IllegalArgumentException:\
  \ requirement failed\n  at scala.Predef$.require(Predef.scala:207)\n  at RationalTrait$class.$init$(<console>:10)\n\
  \  ... 28 elided\n```\n\n示例中的异常之所以抛出，是因为类 `RationalTrait` 初始化时 `denomArg` 仍然是默认值\
  \ `0`，导致 `require` 调用失败。\n\n这个示例说明，类参数和抽象字段的初始化顺序是不相同的。类参数参数在传递给类构造函数之前会被求值（除非参数是\
  \ by-name 的）。相比之下，子类中实现的 `val` 定义仅在父类初始化后才会被求值。\n\n现在你已经了为什么抽象 vals 的行为与参数不同，了解如何处理这个问题将很有帮助。是否可以定义一个可以健壮初始化的\
  \ `RationalTrait`，而无需担心因未初始字段而导致的错误？事实上，Scala 为此问题提供了两种替代解决方案：预初始化字段和 `lazy vals`。它们将在本节的剩余部分介绍。\n\
  \n### Pre-initialized fields\n\n第一种解决方案预初始化字段，它允许你在调用父类构造函数之前初始化子类的字段。要实现这一点，只需将字段定义放在父类构造函数调用之前的大括号中即可。例如，[Listing\
  \ 20.5] 显示了创建 `RationalTrait` 实例的另一种尝试。从这个示例中可以看出，初始化部分出现在提到 supertrait `RationalTrait`\
  \ 之前。两者被 `with` 隔开。\n\n```\nscala> new {\n          val numerArg = 1 * x\n     \
  \     val denomArg = 2 * x\n        } with RationalTrait\n  res: RationalTrait =\
  \ 1/2\n```\n\n##### Listing 20.5 - 匿名类中的预初始化字段。\n\n预初始化字段不仅限于匿名类；也可以用于对象或具名的子类。20.6\
  \ 和 20.7 展示了两个示例。从这些示例可以看出，在每情况下，预初始化都发生在定义的对象或类的 `extends` 关键字之后。20.7 所示的 `RationalClass`\
  \ 示例了类参数如何可以用于 supertrait 初始化的通用模式。\n\n```\nobject thirds extends {\n  val numerArg\
  \ = 2\n  val denomArg = 3\n} with RationalTrait\n```\n\n##### Listing 20.6 - 对象中的预初始化字段。\n\
  \n```\nclass RationalClass(n: Int, d: Int) extends {\n  val numerArg = n\n  val\
  \ denomArg = d\n} with RationalTrait {\n  def + (that: RationalClass) = new RationalClass(\n\
  \    numer * that.denom + that.numer * denom,\n    denom * that.denom\n  )\n}\n\
  ```\n\n##### Listing 20.7 - 类定义中的预初始化字段。\n\n由于预初始化字段是在父类构造函数被调用之前初始化的，它们的初始化器无法引用正在被构造的对象。因此，如果这样的初始化器引用了\
  \ `this`，它指向的是正在构造的容器。\n\n这里有一个例子：\n\n```\nscala> new {\n  val numerArg = 1\n  val\
  \ denomArg = this.numerArg * 2\n} with RationalTrait\n<console>:11: error: value\
  \ numerArg is not a member of object\n  $iw\n          ^\n```\n\n该示例未编译，是因为引用 `this.numerArg`\
  \ 在查找包含 `new` 的对象（在这种情况下是 `$iw` 对象）。再次，预初始化字段在这方面的行为类似于类参数。\n\n### Lazy vals\n\n\
  你可以使用预初始化字段来精确模拟类参数的初始化行为。然而，有时你可能倾向于让系统自己决定如何初始化。这可以通过将你的 `val` 定义为 `lazy` 来实现。如果你在\
  \ `val` 定义前加上 `lazy` 修饰符，右侧的初始化表达式只会在第一次使用该 `val` 时被求值。\n\n例如，定义一个带有 `val` 的对象 `Demo`：\n\
  \n```\nscala> object Demo {\n  val x = { println(\"initializing x\"); \"done\" }\n\
  }\ndefined object Demo\n```\n\n现在，先引用 `Demo`，再引用 `Demo.x`：\n\n```\nscala> Demo\n\
  \  initializing x\n  res: Demo.type = Demo@2129a843\n\n  scala> Demo.x\n  res: String\
  \ = done\n```\n\n如你所示，一旦使用 `Demo`，它的 `x` 字段就被初始化了。`x` 的初始化形成了 `Demo` 初始化的一部分。但如果你将\
  \ `x` 字段定义为 `lazy`，情况就会发生变化：\n\n```\nscala> object Demo {\n  lazy val x = { println(\"\
  initializing x\"); \"done\" }\n}\ndefined object Demo\n\n  scala> Demo\n  res: Demo.type\
  \ = Demo@5b1769c\n\n  scala> Demo.x\n  initializing x\n  res: String = done\n```\n\
  \n\n\n\n现在，初始化 `Demo` 并不涉及 `x`。`x` 的初始化将推迟到第一次使用 `x` 时。这与使用 `def` 将 `x` 定义为无参数的方法的情况类似。然而，与\
  \ `def` 不同，`lazy val` 不会被求值多次。事实上，在对 `lazy val` 进行首次求值后，评估结果会被存储，以便在后续使用同一个 `val`\
  \ 时重用。\n\n观察这个示例，似乎像 `Demo` 这样的对象本身表现得像 `lazy vals`，因为它们也是在第一次被使用时按需初始化的。这是正确的。事实上，一个对象的定义可以看作是\
  \ `lazy val` 定义的简写，其中包含一个描述对象内容的匿名类。\n\n使用 `lazy vals`，你可以将 `RationalTrait` 重新构写，如\
  \ Listing 20.8 所示。在新的 trait 定义中，所有具体字段都定义为 `lazy`。与之前 Listing 20.4 中的 `RationalTrait`\
  \ 定义相比，另一个变化是 `require` 子句从 trait 的体移动到了私有字段 `g` 的初始化器中，该字段计算 `numerArg` 和 `denomArg`\
  \ 的最大公约数。通过这些更改，当初始化 `LazyRationalTrait` 时已经没有需要做的事了；所有的初始化代码现在都成了 `lazy val` 的右侧部分。因此，在类定义之后初始化\
  \ `LazyRationalTrait` 的抽象字段是安全的。\n\n```scala\n trait LazyRationalTrait { \n    val\
  \ numerArg: Int \n    val denomArg: Int \n    lazy val numer = numerArg / g\n  \
  \  lazy val denom = denomArg / g\n    override def toString = numer + \"/\" + denom\n\
  \    private lazy val g = {\n      require(denomArg != 0)\n      gcd(numerArg, denomArg)\n\
  \    }\n    private def gcd(a: Int, b: Int): Int = \n      if (b == 0) a else gcd(b,\
  \ a % b)\n }\n```\n\n#### Listing 20.8 - 使用 lazy vals 初始化 trait。\n\n这是一个示例：\n\n\
  ```scala\nscala> val x = 2\n  x: Int = 2\n\n  scala> new LazyRationalTrait {\n \
  \         val numerArg = 1 * x\n          val denomArg = 2 * x\n        }\n  res7:\
  \ LazyRationalTrait = 1/2\n```\n\n不需要预初始化。追踪导致上述代码打印字符串 `1/2` 的初始化序列是很有启发意义的：\n\n\
  1. 创建一个新的 `LazyRationalTrait` 实例并运行 `LazyRationalTrait` 的初始化代码。这段初始化代码是空的；`LazyRationalTrait`\
  \ 的没有任何字段尚未被初始化。\n2. 接着，执行由 `new` 表达式定义的匿名子类的主构造函数。这涉及将 `numerArg` 初始化为 `2`，并将将\
  \ `denomArg` 初始化为 `4`。\n3. 接着，解释器在构建的对象上调用 `toString` 方法，以便可以打印结果值。\n4. 接着，trait\
  \ `LazyRationalTrait` 中的 `toString` 方法第一次访问了 `numer` 字段，因此对其初始化器执行了求值。\n5. `numer`\
  \ 的初始化器访问了私有字段 `g`，因此接下来求值 `g`。这次求值访问了在步骤 2 中定义的 `numerArg` 和 `denomArg`。\n6. 接着，`toString`\
  \ 方法访问了 `denom` 的值，导致 `denom` 的求值。`denom` 的求值访问了 `denomArg` 和 `g` 的值。`g` 字段的初始化器没有被重新求值，因为它在步骤\
  \ 5 中已经求值过了。\n7. 最后，构建并打印结果字符串 \"1/2\"。\n\n注意，在类 `LazyRationalTrait` 中，`g` 的定义在文本上位于\
  \ `numer` 和 `denom` 定义之后。尽管如此，由于三个值都是 `lazy` 的，`g` 在 `numer` 和 `denom` 初始化完成之前就被初始化了。\n\
  \n这展示了 `lazy vals` 的一个重要特性：它们的定义文本顺序并不重要，因为值是按需初始化的。因此，`lazy vals` 可以让程序员解放出来，不再需要苦思思考如何安排\
  \ `val` 的定义，以确保在需要时所有内容都已定义。\n\n然而，这种优势只有在 `lazy vals` 的初始化既不产生副作用也不依赖于副作用时才成立。在存在副作用的情况下，初始化顺序开始变得重要。正如前面的示例所示，那时追踪初始化代码运行的顺序可能会非常困难。因此，`lazy\
  \ vals` 是函数式对象的理想补充，在函数式对象中，只要最终都完成了初始化，初始化顺序并不重要。它们不太适用于以命令式为主的代码。\n\n### 惰性函数式语言\n\
  \nScala 绝不是第一个利用惰性定义与函数式代码完美结合的语言。事实上，存在一类“惰性函数式编程语言”，其中每个值和参数都是惰性初始化的。这类语言中最广为人知的成员是\
  \ Haskell [[SPJ02]](#bibliography.html_haskell98)。\n\n### 20.6 抽象类型\n\n在本章的开头，你看到了\
  \ \"type T\"，这是一个抽象类型声明。本章的其余部分讨论了这种抽象类型声明的含义以及它的用途。正如所有其他抽象声明一样，抽象类型声明是某些将在子类中具体定义的内容的占位符。这里有一个出现抽象类型的已知例子。假设你被赋予的任务是建模动物的进食习惯。你可能从一个\
  \ `Food` 类和一个带有 `eat` 方法的 `Animal` 类开始：\n\n```scala\nclass Food\nabstract class\
  \ Animal {\n  def eat(food: Food)\n}\n```\n\n然后你可能会尝试将这两个类特化为 `Grass` 类：\n\n```scala\n\
  class Grass extends Food\nclass Cow extends Animal {\n  override def eat(food: Grass)\
  \ = {}\n}\n```\n\n然而，如果你尝试编译这些类，将得到以下错误：\n\n```\nBuggyAnimals.scala:7: error: class\
  \ Cow needs to be abstract, since method eat in Animal of Food is not defined\n\
  \  class Cow extends Animal {\n^\nBuggyAnimals.scala:8: error: method eat overrides\
  \ nothing\n  override def eat(food: Grass) = {}\n```\n\n发生的是 `Cow` 类中的 `eat` 方法并没有覆盖\
  \ `Animal` 类中的 `eat` 方法，因为它们的参数类型不同：在 `Cow` 中是 `Grass`，而在 `Animal` 中是 `Food`。\n\n\
  有些人认为类型系统拒绝这些类是过度严格的。他们认为特化方法的参数应该是允许的。然而，如果允许像这样写，你很快就会陷入不安全的情况。\n\n例如，以下脚本将通过类型检查：\n\
  \n```scala\nclass Food\nabstract class Animal {\n  def eat(food: Food)\n}\nclass\
  \ Grass extends Food\nclass Cow extends Animal {\n  override def eat(food: Grass)\
  \ = {} // 如果允许\n}\nclass Fish extends Food\nval bessy: Animal = new Cow\nbessy.eat(new\
  \ Fish)\n```\n\n如果放宽限制，程序将会编译，因为 `Cow` 是 `Animal`，并且 `Animal` 确实有一个可以接受任何 `Food`（包括\
  \ `Fish`）的 `eat` 方法。但让牛吃鱼显然没有好处！\n\n相反，你需要应用更精确的建模。动物确实吃 `Food`，但每个 `Animal` 吃什么种\
  \ `Food` 取决于 `Animal`。这可以通过抽象类型优雅地表达，如 Listing 20.9 所示：\n\n\n\n\n\n```\n class Food\n\
  \  abstract class Animal {\n    type SuitableFood <: Food\n    def eat(food: SuitableFood)\n\
  \  }\n```\n\n#### 列表 20.9 - 使用抽象类型建模合适的食物。\n\n有了新的类定义，`Animal` 只能吃合适的食物。什么食物是合适的在\
  \ `Animal` 类级别无法确定的。这就是为什么 `SuitableFood` 被建模为一个抽象类型。该类型有一个上界 `Food`，通过 `<: Food`\
  \ 子句表示。这意味着 `SuitableFood` 的任何具体实例化（在 `Animal` 的子类中）必须是 `Food` 的子类。例如，你将无法使用 `IOException`\
  \ 类来实例化 `SuitableFood`。\n\n定义好 `Animal` 后，你现在可以处理牛了，如列表 20.10 所示。`Cow` 类将其 `SuitableFood`\
  \ 固定为 `Grass`，并为这种类型的食物定义了一个具体的 `eat` 方法。\n\n```\n class Grass extends Food\n  class\
  \ Cow extends Animal {\n    type SuitableFood = Grass\n    override def eat(food:\
  \ Grass) = {}\n  }\n```\n\n#### 列表 20.10 - 在子类中实现抽象类型。\n\n这些新的类定义编译时没有错误。如果你尝试使用新的类定义运行“吃鱼的牛”这一反例，你将得到以下编译器错误：\n\
  \n```\nscala> class Fish extends Food\n  defined class Fish\n\n  scala> val bessy:\
  \ Animal = new Cow\n  bessy: Animal = Cow@1515d8a6\n\n  scala> bessy eat (new Fish)\n\
  \  <console>:14: error: type mismatch;\n  found    : Fish\n  required: bessy.SuitableFood\n\
  \              bessy eat (new Fish)\n                       ^\n```\n\n### 20.7 路径依赖类型\n\
  \n再次查看最后一条错误信息。有趣之处在于 `eat` 方法所需的类型：`bessy.SuitableFood`。该类型由一个对象引用 `bessy` 后面跟一个该对象的类型字段\
  \ `SuitableFood` 组成。这表明 Scala 中的对象可以拥有类型作为成员。`bessy.SuitableFood` 的意思是“从 `bessy`\
  \ 引用的对象所拥的 `SuitableFood` 类型”，或者换说，适合 `bessy` 的食物类型。\n\n像 `bessy.SuitableFood` 这样的类型被称为路径依赖类型。这里的“路径”指的是对一个对象的引用。它可以是一个单一名称，如\
  \ `bessy`，也可以是一个较长的访问路径，如 `farm.barn.bessy`，其中 `farm`、`barn` 和 `bessy` 都是对象的变量（或单例对象名称）。\n\
  \n正如“路径依赖类型”这一术语所示，类型取决于路径；通常情况下，不同的路径产生不同的类型。例如，假设你像这样定义了 `DogFood` 和 `Dog` 类：\n\
  \n```\n class DogFood extends Food\n  class Dog extends Animal {\n    type SuitableFood\
  \ = DogFood\n    override def eat(food: DogFood) = {}\n  }\n```\n\n如果你尝试用适合牛的食物喂狗，你的代码将无法编译：\n\
  \n```scala\nscala> val bessy = new Cow\n  bessy: Cow = Cow@713e7e09\n\n  scala>\
  \ val lassie = new Dog\n  lassie: Dog = Dog@6eaf2c57\n\n  scala> lassie eat (new\
  \ bessy.SuitableFood)\n  <console>:16: error: type mismatch;\n  found    : Grass\n\
  \  required: DogFood\n              lassie eat (new bessy.SuitableFood)\n      \
  \                 ^\n```\n\n问题在于传递给 `eat` 方法的 `SuitableFood` 对象类型 `bessy.SuitableFood`\
  \ 与 `eat` 的参数类型 `lassie.SuitableFood` 不兼容。\n\n两个 `Dog` 的情况就会不同。因为 `Dog` 的 `SuitableFood`\
  \ 被定义为 `DogFood` 的别名，两个 `Dog` 的 `SuitableFood` 类型是相同的。因此，名为 `lassie` 的 `Dog` 实例实际上可以吃另一个实例的食物：\n\
  \n```\nscala> val bootsie = new Dog\n  bootsie: Dog = Dog@13a7c8c\n\n  scala> lassie\
  \ eat (new bootsie.SuitableFood)\n```\n\n路径依赖类型类似于 Java 中内部类的语法，但有一个关键的区别：路径依赖类型命名的是一个外部对象，而内部类命名的是一个外部类。Java\
  \ 风格的内部类类型也可以在 Scala 中表示，但它们的写法不同。考虑这两个类，`Outer` 和 `Inner`：\n\n```\nclass Outer\
  \ {\n  class Inner\n}\n```\n\n在 Scala 中，内部类的地址使用的是 `Outer#Inner` 而不是 `Outer.Inner`。`.`\
  \ 语法保留给对象使用。例如，假设你实例化了两个 `Outer` 类型的对象，如下：\n\n```\nval o1 = new Outer\nval o2 =\
  \ new Outer\n```\n\n`o1.Inner` 和 `o2.Inner` 是路径依赖类型（并且它们是不同的类型）。这两个类型都符合（是）更通用的\
  \ `Outer#Inner` 的子类型，后者代表了具有任意 `Outer` 类型外部对象的 `Inner` 类。相比之下，\n\n### 20.8 细化类型\n\
  \n当一个类继承另一个类时，第一个类被称为另一个类的名义（nominal）子类型。它是名义子类型是因为每个类型都有名称，且这些名称显式地声明了子类型关系。Scala\
  \ 额外支持结构化（structural），即只要两个类型的成员兼容即可获得子类型关系。在 Scala 中获取结构化子类型，请使用细化类型。\n\n名义子类型通常更方便，因此在任何新设计中应首先尝试名义类型。名称是一个短的标识符，因此比显式列出成员类型更简洁。此外，结构化子类型通常比你想象的要灵活。`widget`\
  \ 可以 `draw()`，西部牛仔也可以 `draw()`，但它们并不是可替换的。你通常希望在尝试用牛仔替换 `widget` 时得到编译错误。\n\n尽管如此，结构化子类型也有自己的优势。其中之一是，有时一个类型仅仅取决于它的成员。例如，假设你想定义一个可以包含吃草动物的\
  \ `Pasture` 类。一种方案是定义一个 `trait AnimalThatEatsGrass` 并将其混合到所有应用的类中。然而，这将非常繁琐。`Cow`\
  \ 类已经声明了它是一个动物且它吃草，现在它还必须声明自己也是一个吃草的动物。\n\n与其定义 `AnimalThatEatsGrass`，可以使用细化类型。只需写出基类型\
  \ `Animal`，后跟一串在大括号中列出的成员。大括号中的成员进一步指定——或者说细化了——基类的成员类型。\n\n这就是书写“吃草的动物”类型的方法：\n\
  \n```\nAnimal { type SuitableFood = Grass }\n```\n\n给定该类型，你现在可以这样写牧场类：\n\n\n\n\n\
  \n```\nclass Pasture {\n  var animals: List[Animal { type SuitableFood = Grass }]\
  \ = Nil\n  // ...\n}\n```\n\n### 20.9 枚举\n\n路径依赖类型的一个有趣应用位于 Scala 对枚举的支持中。其他一些语言（包括\
  \ `Java` 和 `C#`）将枚举作为内置语言结构来定义新类型。Scala 不需要为枚举提供特殊的语法。相反，它的标准库中有一个类：`scala.Enumeration`。\n\
  \n要创建一个新的枚举，你需要定义一个扩展该类的对象，如下例所示，它定义了一个颜色（Colors）的新枚举：\n\n```\nobject Color extends\
  \ Enumeration {\n  val Red = Value\n  val Green = Value\n  val Blue = Value\n}\n\
  ```\n\nScala 还允许你通过具有相同右侧表达式简化多个连续的 `val` 或 `var` 定义。与上述等等，你可以写：\n\n```\nobject\
  \ Color extends Enumeration {\n  val Red, Green, Blue = Value\n}\n```\n\n这个对象定义提供了三个值：`Color.Red`、`Color.Green`\
  \ 和 `Color.Blue`。你也可以通过以下方式导入 `Color` 中的所有内容：\n\n```\nimport Color._\n```\n\n然后直接使用\
  \ `Red`、`Green` 和 `Blue`。但这些值的类型是什么什么呢？\n\n`Enumeration` 定义了一个名为 `Value` 的内部类，而同名的无参数\
  \ `Value` 方法返回该类的一个新实例。换句话说，像 `Color.Red` 这样的值类型是 `Color.Value`；`Color.Value` 是对象\
  \ `Color` 中定义的所有枚举值的类型。它是一个路径依赖类型，其中 `Color` 是路径而 `Value` 是依赖类型。其意义在于，它是一个全新的类型，与所有其他类型都不同。\n\
  \n特别是，如果你定义了另一个枚举，例如：\n\n```\nobject Direction extends Enumeration {\n  val North,\
  \ East, South, West = Value\n}\n```\n\n那么 `Direction.Value` 将与 `Color.Value` 不同，因为这两个类型的路径部分不同。\n\
  \nScala 的 `Enumeration` 类还提供了其他语言枚举设计中常见的许多其他功能。你可以通过使用 `Value` 方法的不同重载变体将名称与枚举值关联：\n\
  \n```\nobject Direction extends Enumeration {\n  val North = Value(\"North\")\n\
  \  val East = Value(\"East\")\n  val South = Value(\"South\")\n  val West = Value(\"\
  West\")\n}\n```\n\n你可以通过枚举的 `values` 方法返回的集合来遍历枚举的值：\n\n```scala\nscala> for (d\
  \ <- Direction.values) print(d + \" \")\n  North East South West\n```\n\n枚举的值从 0\
  \ 开始编号，你可以通过其 `id` 方法找到枚举值的数字：\n\n```scala\nscala> Direction.East.id\n  res14: Int\
  \ = 1\n```\n\n反过来也是可能的，从一个非负整数跳转到枚举中具有该数字作为 `id` 的值：\n\n```scala\nscala> Direction(1)\n\
  \  res15: Direction.Value = East\n```\n\n这足够让你开始学习枚举了。你可以在 `scala.Enumeration` 类的\
  \ Scaladoc 注释找到更多信息。\n\n### 20.10 案例研究：货币\n\n本章的剩余部分介绍了一个案例研究，解释了如何在 Scala 中使用抽象类型。任务是设计一个\
  \ `Currency` 类。`Currency` 的典型实例将代表美元、欧元、日元或其他货币的金额。应该能够对货币进行算术运算。例如，你应该能够将两个相同货币的金额相加。或者你应该能够将货币金额乘以代表利率的因子。\n\
  \n这些思考引出了货币类的第一个初始设计：\n\n```\n// Currency 类的第一种（有缺陷的）设计\nabstract class Currency\
  \ {\n  val amount: Long\n  def designation: String \n  override def toString = amount\
  \ + \" \" + designation\n  def + (that: Currency): Currency = ...\n  def * (x: Double):\
  \ Currency = ...\n}\n```\n\n货币的金额是它代表的货币单位数量。这是一个 `Long` 类型的字段，以便表示非常大的金额，例如 `Google`\
  \ 或 `Apple`。它是抽象的，等待定义子类。货币的标识（designation）是一个字符串。最后，有用于添加货币的 `+` 方法和用于将货币乘以浮点数的\
  \ `*` 方法。你可以通过提供具体值来创建货币，如下：\n\n```\nnew Currency {\n  amount = 79\n}\n```\n\n如果我们只需要一种货币，那么这个设计是可以的。但如果我们需要处理多种货币，它就失效了。假设你将美元和欧元建模为两个子类：\n\
  \n```\nabstract class Dollar {\n  def designation = \"USD\"\n}\nabstract class Euro\
  \ {\n  def designation = \"Euro\"\n}\n```\n\n乍看之下是合理的。但它允许你将美元加到欧元上。这种加法的结果类型是 `Currency`。你想要的是\
  \ `+` 方法的特化版本。当在 `Dollar` 类中实现时，它应该接受 `Dollar` 参数并产生 `Dollar` 结果；当在 `Euro` 类中实现时，它应该接受\
  \ `Euro` 参数并产生 `Euro` 结果。尽管如此，你只想写一次方法，而不是在定义定义货币时都写一遍。\n\n在 Scala 中，有一种处理这种情况的简单技术。如果某些内容在定义类时不可知，就让它抽象化。这将导致\
  \ `Currency` 类的草稿：\n\n```\n// Currency 类的第二种（仍不完善的）设计\nabstract class Currency {\n\
  \  type Currency <: AbstractCurrency\n  val amount: Long\n  def designation: String\
  \ \n  override def toString = amount + \" \" + designation\n  def + (that: Currency):\
  \ Currency = ...\n  def * (x: Double): Currency = ...\n}\n```\n\n与之前的情况的不同之处在于，类现在被称为\
  \ `AbstractCurrency`，它包含一个抽象类型 `Currency`，该类型代表所涉及的货币。`AbstractCurrency` 的每个具体子类都需要将\
  \ `Currency` 类型指向子类本身，从而“打好结”。\n\n例如，这里是 `Dollar` 类的新版本，它现在扩展了 `AbstractCurrency`：\n\
  \n```\nabstract class Dollar extends AbstractCurrency {\n  type Currency = Dollar\n\
  \  def designation = \"USD\"\n}\n```\n\n这种设计是可行的，但仍然并不完美。一个问题被隐藏在省略号中，省略号表示 `AbstractCurrency`\
  \ 中缺失的 `+` 和 `*` 方法定义。特别地，在这个类中应该如何实现加法？计算新货币的正确金额 `this.amount + that.amount` 是很容易的，但你如何将金额转换为正确类型的货币呢？\n\
  \n你可能会尝试类似这样的：\n\n```\ndef + (that: Currency): Currency = new Currency {\n  amount\
  \ = this.amount + that.amount\n}\n```\n\n然而，这无法通过编译：\n\n```\nerror: class type required\n\
  \  def + (that: Currency): Currency = new Currency {\n                         \
  \            ^\n```\n\n\n\n\n\nScala 对抽象类型处理的一个限制是：你既不能创建抽象类型的实例，也不能将抽象类型作为另一个类的超类型[[1]](#abstract-members.html_footnotemain20-1)。因此，编译器会拒绝此处尝试实例化\
  \ `Currency` 的示例代码。\n\n然而，你可以使用工厂方法来绕过这一限制。不要直接创建抽象类型的实例，而是声明一个执行该操作的抽象方法。然后，每当抽象类型被固定为某个具体类型时，你也需要提供该工厂方法的具体实现。对于\
  \ `AbstractCurrency` 类，它的写法如下：\n\n```\n abstract class AbstractCurrency {\n  type\
  \ Currency <: AbstractCurrency // 抽象类型\n  def make(amount: Long): Currency  // 工厂方法\n\
  \  ...                              // 类的其余部分\n}\n```\n\n这样的设计可以运行，但它看起来相当可疑。为什么要将工厂方法放在\
  \ `AbstractCurrency` 类内部呢？从至少两个理由来看，这都是不明的。首先，如果你拥有一定金额的货币（例如 1 美元），你手中还拥有了制造更多相同货币的能力，代码如下所示：\n\
  \n```\n myDollar.make(100)  // 这里又有了一百个！\n```\n\n在彩色复印的时代，这可能是一个诱人的场景，但希望你不会在不被发现的情况下这样做太久。这段代码的第二个问题是，如果你已经有一个\
  \ `Currency` 对象的引用，你就可以创建更多的 `Currency` 对象。但你如何获取给定 `Currency` 的第一个对象呢？你需要另一个创建方法，它的作用与\
  \ `make` 本质上相同。因此你导致了代码重复的情况，这是代码异味（code smell）的明确信号。\n\n当然，解决方案是将抽象类型和工厂方法移动到 `AbstractCurrency`\
  \ 类之外。你需要创建另一个类，包含 `AbstractCurrency` 类、`Currency` 类型和 `make` 工厂方法。\n\n我们将其称为 `CurrencyZone`：\n\
  \n```\n abstract class CurrencyZone {\n  type Currency <: AbstractCurrency\n  def\
  \ make(x: Long): Currency\n  abstract class AbstractCurrency {\n    val amount:\
  \ Long\n    def designation: String \n    override def toString = amount + \" \"\
  \ + designation\n    def + (that: Currency): Currency = \n      make(this.amount\
  \ + that.amount)\n    def * (x: Double): Currency = \n      make((this.amount *\
  \ x).toLong)\n  }\n}\n```\n\n一个具体的 `CurrencyZone` 示例是 `US`，其定义如下：\n\n```\n object\
  \ US extends CurrencyZone {\n  abstract class Dollar extends AbstractCurrency {\n\
  \    def designation = \"USD\"\n  }\n  type Currency = Dollar\n  def make(x: Long)\
  \ = new Dollar { val amount = x }\n}\n```\n\n在这里，`US` 是扩展 `CurrencyZone` 的对象。它定义了一个类\
  \ `Dollar`，它是 `AbstractCurrency` 的子类。因此，该区域的货币类型是 `US.Dollar`。`US` 对象还将类型 `Currency`\
  \ 固定为 `Dollar` 的别名，并提供了 `make` 工厂方法的实现以返回美元金额。\n\n这是一个可行的设计。只需添加几处改进即可。第一个改进涉及子单位。到目前为止，每种货币都是以单一单位衡量的：美元、欧元或日元。然而，大多数货币都有子单位：例如，在美国，是美元和分。建模“分”最直接的方法是让\
  \ `US.Currency` 中的 `amount` 字段代表分而不是美元。为了转换回美元，在 `CurrencyZone` 类中引入一个 `CurrencyUnit`\
  \ 字段很有用，它包含该货币中一个标准单位金额：\n\n```\n class CurrencyZone {\n  ... \n  val CurrencyUnit:\
  \ Currency \n}\n```\n\n如 Listing 20.11\n    formatted(\"%.\" + decimals(CurrencyUnit.amount)\
  \ + \"f\")\n    + \" \" + designation)\n```\n\n在这里，`formatted` 是 Scala 在几个类中（包括\
  \ `Double`）提供的方法。[[2]](#abstract-members.html_footnotemain20-2) `formatted` 方法根据传递给\
  \ `formatted` 方法的右侧操作数，对调用的原始字符串进行格式化返回的结果。\n\n```\n object US extends CurrencyZone\
  \ {\n    abstract class Dollar extends AbstractCurrency {\n      def designation\
  \ = \"USD\"\n    }\n    type Currency = Dollar\n    def make(x: Long) = new Dollar\
  \ { val amount = x }\n  }\n  val Cent = make(1)\n  val Dollar = make(100)\n  val\
  \ CurrencyUnit = Dollar\n }\n```\n\n##### Listing 20.11 - 美国货币区。\n\n例如，格式字符串 `%.2f`\
  \ 将数字格式化为两位小数。在 `toString` 中之前使用的格式字符串是通过对 `CurrencyUnit.amount` 调用 `decimals` 方法生成的。该方法返回十进制幂减一的结果。例如，`decimals(10)`\
  \ 是 1，`decimals(100)` 是 2，依此类推。`decimals` 方法通过简单的递归实现：\n\n```\n private def decimals(n:\
  \ Long): Int =\n  if (n == 1) 0 else 1 + decimals(n / 10)\n```\n\nListing 20.12\
  \ 显示了一些货币区域。作为另一个改进，你可以为模型添加货币转换功能。首先，你可以编写一个 `Converter` 对象，包含货币之间的适用汇率，如 Listing\
  \ 20.13 所示。然后，你可以在 `Currency` 类中添加一个转换方法 `from`，将给定的源货币转换为当前的 `Currency` 对象：\n\n\
  ```\n def from(other: CurrencyZone#AbstractCurrency): Currency = \n  make(math.round(\n\
  \    other.amount.toDouble * Converter.exchangeRate\n    (other.designation)(this.designation)))\n\
  ```\n\n`from` 方法接受任意货币作为参数。这通过其形式参数类型 `CurrencyZone#AbstractCurrency` 表示，作为 `other`\
  \ 传递的参数必须是某个任意 `CurrencyZone` 中的 `AbstractCurrency` 类型。它通过将 `other` 货币的金额乘以 `other`\
  \ 与当前货币之间的汇率来产生结果。\n\n\n\n\n```\n object Europe extends CurrencyZone {\n    abstract\
  \ class Euro extends AbstractCurrency {\n      def designation = \"EUR\"\n    }\n\
  \    type Currency = Euro\n    def make(cents: Long) = new Euro {\n      val amount\
  \ = cents\n    }\n    val Cent = make(1)\n    val Euro = make(100)\n    val CurrencyUnit\
  \ = Euro\n  }\n\n  object Japan extends CurrencyZone {\n    abstract class Yen extends\
  \ AbstractCurrency {\n      def designation = \"JPY\"\n    }\n    type Currency\
  \ = Yen\n    def make(yen: Long) = new Yen {\n      val amount = yen\n    }\n  \
  \  val Yen = make(1)\n    val CurrencyUnit = Yen\n  }\n```\n\n#### 列表 20.12 - 欧洲和日本货币区。\n\
  \n```\n object Converter {\n    var exchangeRate = Map(\n      \"USD\" -> Map(\"\
  USD\" -> 1.0    , \"EUR\" -> 0.7596, \n                      \"JPY\" -> 1.211 ,\
  \ \"CHF\" -> 1.223),\n      \"EUR\" -> Map(\"USD\" -> 1.316 , \"EUR\" -> 1.0   ,\
  \ \n                      \"JPY\" -> 1.594 , \"CHF\" -> 1.623),\n      \"JPY\" ->\
  \ Map(\"USD\" -> 0.8257, \"EUR\" -> 0.6272, \n                      \"JPY\" -> 1.0\
  \    , \"CHF\" -> 1.018),\n      \"CHF\" -> Map(\"USD\" -> 0.8108, \"EUR\" -> 0.6160,\
  \ \n                      \"JPY\" -> 0.982 , \"CHF\" -> 1.0  )\n    )\n  }\n```\n\
  \n#### 列表 20.13 - 一个带有汇率映射的转换器对象。\n\n```scala\n abstract class CurrencyZone {\n\n\
  \  type Currency <: AbstractCurrency\n  def make(x: Long): Currency\n\n  abstract\
  \ class AbstractCurrency {\n\n    val amount: Long\n    def designation: String\
  \ \n\n    def + (that: Currency): Currency = \n      make(this.amount + that.amount)\n\
  \    def * (x: Double): Currency = \n      make((this.amount * x).toLong)\n    def\
  \ - (that: Currency): Currency = \n      make(this.amount - that.amount)\n    def\
  \ / (that: Double): Currency = \n      make((this.amount / that).toLong)\n    def\
  \ / (that: Currency) = \n      this.amount.toDouble / that.amount\n\n    def from(other:\
  \ CurrencyZone#AbstractCurrency): Currency = \n      make(math.round(\n        other.amount.toDouble\
  \ * Converter.exchangeRate\n        (other.designation))(this.designation)\n\n \
  \   private def decimals(n: Long): Int = \n      if (n == 1) 0 else 1 + decimals(n\
  \ / 10)\n\n    override def toString = \n      formatted(\"%.\" + decimals(CurrencyUnit.amount)\
  \ + \"f\")(amount.toDouble) + designation\n  }\n\n  val CurrencyUnit: Currency\n\
  ```\n\n#### 列表 20.14 - CurrencyZone 的完整代码。\n\n`CurrencyZone` 类的最终版本在 abstract.html_lst-CurrencyZone\
  \ 中所示。你可以在 Scala 命令行 shell 中测试该类。我们假设 `CurrencyZone` 类和所有具体的 `CurrencyZone` 对象都定义在包\
  \ `org.stairbook.currencies` 中。第一步是将 `org.stairbook.currencies._` 导入到命令行 shell。然后你可以进行一些货币转换：\n\
  \n```\nscala> Japan.Yen from US.Dollar * 100\n  res16: Japan.Currency = 12110 JPY\n\
  \nscala> Europe.Euro from res16\n  res17: Europe.Currency = 75.95 EUR\n\nscala>\
  \ US.Dollar from res17\n  res18: US.Currency = 99.95 USD\n```\n\n在三次转换后，我们获得了几乎相同的金额，这一事实说明这些汇率是非常准确的！你还可以相加相同货币的值：\n\
  \n```\nscala> US.Dollar * 100 + res18\n  res19: US.Currency = 199.95 USD\n```\n\n\
  另一方面，你不能相加不同货币的金额：\n\n```\nscala> US.Dollar + Europe.Euro\n  <console>:12: error:\
  \ type mismatch;\n  found   : Europe.Euro\n  required: US.Currency\n  (which expands\
  \ to)  US.Dollar\n               US.Dollar + Europe.Euro\n^\n```\n\n通过防止两个不同单位（在本例中为货币）的值进行相加，类型抽象完成了它的工作。它防止了我们执行不靠谱的计算。不同单位之间的正确转换失败似乎是微不足道的\
  \ bug，但它们曾导致许多严重的系统故障。一个例子是 1999 年 9 月 23 日火星气候轨道器（Mars Climate Orbiter）的坠，那是因为一个工程团队使用了公制，而另一个团队使用了英制。如果单位编码的方式像本章编码货币一样，那么这个错误可以通过简单的编译检测出来。\n\
  \n### 20.11 结论\n\nScala 为面向对象提供了系统化且通用的支持。本章展示了如何利用抽象成员。无论未知的是类型、方法还是值并不重要。在 Scala\
  \ 中，这些都可以声明的。\n\n#### 第 20 章脚注：\n\n[1] 关于虚拟类有一些有前景的研究，可以实现这一点，但 Scala 不支持虚拟类。\n\n\
  [2] Scala 使用富包装器（见第 5.10 节）来使 `formatted` 可用。\n\n[3] 顺便说一下，如果你觉得你的日元亏了，汇率可以转换货币。\n\
  \n\n\n\n\n如果 Swing 在编写时考虑了 Scala，那么事件监听器可能会用函数类型来表示。调用者可以使用函数字面量语法作为一种轻量级的方式，来指定特定类型事件应该发生什么。由于\
  \ Java 没有函数字面量，Swing 使用了仅其次的替代方案：实现单方法接口的内部类。在动作监听器的情况下，该接口是 `ActionListener`。\n\
  \n如果不使用隐式转换，使用 Swing 的 Scala 程序必须像 Java 一样使用内部类。这里有一个创建按钮并挂载动作监听器的示例。每当按下按钮时，动作监听器就会被调用，此时会打印字符串“pressed!”：\n\
  \n```\n val button = new JButton\n  button.addActionListener(\n  new ActionListener\
  \ {\n    def actionPerformed(event: ActionEvent) = {\n      println(\"pressed!\"\
  )\n    }\n  }\n  )\n```\n\n这段代码包含了大量没有信息的模板代码。监听器是 `ActionListener`、回调方法名为 `actionPerformed`\
  \ 以及参数是 `ActionEvent` 这些对于 `addActionListener` 的任何参数来说都是隐含的。这里唯一的新信息是待执行的代码，即 `println`\
  \ 的调用。这个新信息被淹没在模板代码中了。阅读这段代码的人需要具有火眼金睛，才能从噪声中找出有信息的部分。\n\n一个更符合 Scala 风格的版本会将一个函数作为参数，大大减少了模板代码量：\n\
  \n```\n button.addActionListener( // 类型不匹配！\n  (_: ActionEvent) => println(\"pressed!\"\
  )\n  )\n```\n\n到目前为止，这段代码无法工作。`addActionListener` 方法想要一个动作监听器，但得到的是一个函数。然而，通过隐式转换，可以让这段代码正常工作。\n\
  \n第一步是在两种类型之间编写一个隐式转换。这是一个从函数到动作监听器的隐式转换：\n\n```\n implicit def function2ActionListener(f:\
  \ ActionEvent => Unit) =\n  new ActionListener {\n    def actionPerformed(event:\
  \ ActionEvent) = f(event)\n  }\n```\n\n这是一个接收函数并返回动作监听器的单参数方法。像任何其他单参数方法一样，它可以被被调用，并将其结果传递给另一个表达式：\n\
  \n```\n button.addActionListener(\n  function2ActionListener(\n    (_: ActionEvent)\
  \ => println(\"pressed!\")\n  )\n  )\n```\n\n这已经是对内部类版本的改进了。注意任意数量的模板代码是如何被函数字面量和方法调用取代的。不过，有了隐式转换会变得更好。由于\
  \ `function2ActionListener` 被标记为 `implicit`，可以省略它，编译器会自动插入它。结果是这样的：\n\n```\n //\
  \ 现在这可以工作了\n  button.addActionListener(\n  (_: ActionEvent) => println(\"pressed!\"\
  )\n  )\n```\n\n这段代码的工作原理是：编译器首先尝试原样编译它，但它看到了类型错误。在放弃之前，它会寻找可以修复该问题的隐式转换。在这种情况下，它找到了\
  \ `function2ActionListener`。它尝试该转换方法，发现它是可行的，然后继续执行。编译器在这里非常努力，以便开发者可以忽略又一个琐碎的细节。动作监听器？动作事件函数？哪一个都可以——使用更方便的那个就绪。\n\
  \n在本节中，我们展示了隐式转换的一些强大之处以及它们如何让你能够装饰现有的库。在接下来的章节中，你将学习决定何时尝试隐式转换以及如何找到它们的规则。\n\n\
  ### 21.2 隐式转换的规则\n\n隐式定义是编译器允许插入到程序中以修复任何类型错误的定义。例如，如果 `x + y` 没有通过类型检查，那么编译器可能会将其更改为\
  \ `convert(x) + y`，其中 `convert` 是某个可用的隐式转换。如果 `convert` 将 `x` 变为具有 `+` 方法的对象，那么这种更改可能会修复程序，使其通过类型检查并正确运行。如果\
  \ `convert` 真的只是一个简单的转换函数，那么在源代码中省略它可以作为一种说明。\n\n隐式转换遵循以下通用规则：\n\n**标记规则：只有标记为 implicit\
  \ 的定义才是可用的。** `implicit` 关键字用于标记编译器可以作为隐式使用的声明。你可以用它来标记任何变量、函数或对象定义。这里有一个隐式函数定义：\n\
  \n```\nimplicit def intToString(x: Int) = x.toString\n```\n\n只有当 `convert` 被标记为\
  \ `implicit` 时，编译器才会将 `x + y` 更改为 `convert(x) + y`。这样，你就避免了如果编译器随机选择作用域内的函数并将其作为“转换”插入而导致的混乱。编译器只会从你显式标记为隐式的定义中进行选择。\n\
  \n**范围规则：插入的隐式转换必须作为单个标识符在作用域内，或者与源类型或目标类型相关。** Scala 编译器只考虑作用域内的隐式转换。因此，为了使隐式转换可用，你必须以某种方式将其引入作用域。此外，除一个例外外，隐式转换必须作为单个标识符在作用域内。编译器不会插入\
  \ `someVariable.convert` 形式的转换。例如，它不会将 `x + y` 扩展为 `someVariable.convert(x) + y`。如果你想让\
  \ `someVariable.convert` 隐式可用，你需要导入它，这会使其作为单个标识符可用。一旦导入，编译器就可以将其应用为 `convert(x)\
  \ + y`。事实上，库通常包含一个 Preamble 对象，其中包含许多隐式转换。使用该库的代码只需执行一次 `import Preamble._` 即可访问库的隐式转换。\n\
  \n“单个标识符”规则有一个例外。编译器还会源类型或预期目标类型的伴对象中查找隐式定义。例如，如果你尝试将一个 `Dollar` 对象传递给接受 `Euro`\
  \ 的方法，源类型是 `Dollar`，目标类型是 `Euro`。因此，你可以将从 `Dollar` 到 `Euro` 的隐式转换封装在任一类（`Dollar`\
  \ 或 `Euro`）的伴对象中。\n\n这里是将隐式定义放在 Dollar 伴对象中的示例：\n\n```\nobject Dollar {\n  implicit\
  \ def dollarToEuro(x: Dollar): Euro = ...\n}\nclass Dollar { ... }\n```\n\n在这种情况下，转换\
  \ `dollarToEuro` 被认为与类型 `Dollar` 相关。每当需要从 `Dollar` 实例进行转换时，编译器都会找到这种关联转换。不需要在程序中单独导入该转换。\n\
  \n范围规则有助于模块化推理。当你读取文件中的代码时，你只需要考虑其他文件中那些被导入或通过全限定名显式引用的内容。这种好处对于隐式转换来说，至少与显式编写的代码一样重要。\n\
  \n\n\n\n# 一次一个规则：仅插入一个隐式转换。\n\n编译器不会将 `x + y` 重写为 `convert1(convert2(x)) + y`。这样做会导致错误代码的编译时间急剧增加，并且增加程序员编写的内容与程序实际执行内容之间的差异。为了安全起见，当编译器已经在尝试另一个隐式转换时，它不会插入额外的隐式转换。然而，可以通过让隐式带有隐式参数来绕过这一限制，这将在本章后面介绍。\n\
  \n# 显式优先规则：只要代码在编写时类型通过，就不尝试隐式转换。\n\n编译器不会修改已经正常的代码。该规则的一个推论是，你可以始终用显式标识符替换隐式标识符，从而使代码更长但歧义更小。你可以根据具体情况在这些选择之间进行权衡。每当你看到代码看起来重复且冗长时，隐式转换可以帮助你减少单调感；每当代码简洁到难以晦懂时，你可以显式地插入转换。留给编译器插入隐式转换的数量，究底是一个风格问题。\n\
  \n## 为隐式转换命名\n\n隐式转换可以有任意名称。隐式转换的名称仅在两种情况下重要：如果你想在方法调用中显式地编写它，以及确定程序中任何地方可用的隐式转换。为了说明第二点，假设你有一个具有两个隐式转换的对象：\n\
  \n```scala\nobject MyConversions {\n  implicit def stringWrapper(s: String): IndexedSeq[Char]\
  \ = ...\n  implicit def intToString(x: Int): String = ...\n}\n```\n\n在你的应用中，你想要利用\
  \ `stringWrapper` 转换，但你不希望整数通过 `intToString` 转换自动转换为字符串。你可以通过只导入一个转换而不导入另一个来实现这一目标：\n\
  \n```scala\nimport MyConversions.stringWrapper\n... // 使用 stringWrapper 的代码\n```\n\
  \n在这个示例中，隐式转换拥有名称是重要的，因为只有这样你才能有选择地导入其中一个而不导入另一个。\n\n## 隐式转换尝试的地方\n\n语言中有三个地方使用隐式转换：到预期类型的转换、选择器接收者的转换，以及隐式参数。到预期类型的隐式转换允许你在期望不同类型的上下文中使用一种类型。例如，你可能有一个\
  \ `String`，并将其传递给一个需要 `IndexedSeq[Char]` 的方法。接收者的转换允许你调整方法调用的接收者（即调用方法的对象），如果该方法在原始类型上不可用。一个例子是\
  \ `\"abc\".exists`，它被转换为 `stringWrapper(\"abc\").exists`，因为 `exists` 方法在 `Strings`\
  \ 上不可用，但在 `IndexedSeqs` 上可用。另一方面，隐式参数通常用于向被调用函数提供更多信息，关于调用者想要什么。隐式参数对于泛型函数特别有用，否则被调用函数可能对一个或多个参数的类型一无所知。将在接几节中检查这三种隐式转换。\n\
  \n### 21.3 到预期类型的隐式转换\n\n到预期类型的隐式转换是式式的地方。式的地方。每当编译器看到 `X` 但需要 `Y` 时，它会寻找一个将 `X`\
  \ 转换为 `Y` 的隐式函数。例如，通常双精度浮点不能当作整数因为它会丢失精度：\n\n```scala\nscala> val i: Int = 3.5\n\
  <console>:7: error: type mismatch;\n  found: Double(3.5)\n  required: Int\n  val\
  \ i: Int = 3.5\n               ^\n```\n\n然而，你可以定义一个隐式转换来平滑这个问题：\n\n```scala\nscala>\
  \ implicit def doubleToInt(x: Double) = x.toInt\ndoubleToInt: (x: Double)Int\n\n\
  scala> val i: Int = 3.5\ni: Int = 3\n```\n\n这里发生的是编译器在需要 `Int` 的上下文中看到了 `Double`，特别是\
  \ `3.5`。到此为止，编译器正在处理一个普通的类型错误。但在放弃之前，它搜索从 `Double` 到 `Int` 的隐式转换。在这种情况下，它找到了一个：`doubleToInt`，因为\
  \ `doubleToInt` 在作用范围内作为一个单个标识符存在。（在解释器之外，你可能通过 `import` 或可能通过继承将 `doubleToInt`\
  \ 引入作用范围）。编译器会自动插入对 `doubleToInt` 的调用。在背后，代码变成了：\n\n```scala\nval i: Int = doubleToInt(3.5)\n\
  ```\n\n这实实在在是一个*隐式*转换。你没有显式请求转换。相反，你将 `doubleToInt` 标记为可用。\n\n### 21.4 转换接收者\n\n\
  隐式转换也适用于方法调用的接收者，即调用方法的对象。这种隐式转换有两个主要用途。首先，接收者转换允许将新类平滑地集成到现有类中。其次，它们支持在语言内部编写领域特定语言\
  \ (DSL)。\n\n为了查看如何工作，假设你写了 `obj.doIt`，而 `obj` 没有名为 `doIt` 的成员。编译器将在放弃之前尝试插入转换。在这种情况下，转换需要适用于接收者\
  \ `obj`。编译器的行为将就像 `obj` 的预期“类型”是“有一个名为 doIt 的成员”。这种“拥有 doIt”类型不是普通类型，但它在概念上是存在的，这就是为什么编译器在这种情况下会插入隐式转换。\n\
  \n#### 与新类型互操作\n\n如之前提到的，接收者转换的一个主要用途是允许新类型与现有类型更平滑地集成。特别是，它们允许让客户端程序员使用现有类型的实例就像是你的新类型的实例一样。以\
  \ `Rational` 类为例。这里是该类的片段：\n\n```scala\nclass Rational(n: Int, d: Int) {\n  ...\n\
  \  def +(that: Rational) = ...\n  def +(that: Int) = ...\n}\n```\n\n`Rational` 类有两个重载的\
  \ `+` 方法变体，分别接受 `Rational` 和 `Int` 作为参数。你可以加两个有理数，或者加一个有理数和一个整数：\n\n```scala\nscala>\
  \ val oneHalf = new Rational(1, 2)\n  oneHalf: Rational = 1/2\n\nscala> oneHalf\
  \ + oneHalf\n  res0: Rational = 1/1\n\nscala> oneHalf + 1\n  res1: Rational = 3/2\n\
  ```\n\n\n\n\n\n对于像 `1 + oneHalf` 这样的表达式呢？这个表达式很棘手，因为接收者 `1` 并没有一个合适的 `+` 方法。因此，以下代码会报错：\n\
  \n```\nscala> 1 + oneHalf\n  <console>:6: error: overloaded method value + with\n\
  \  alternatives (Double)Double <and> ... cannot be applied\n  to (Rational)\n  \
  \    1 + oneHalf\n        ^\n```\n\n为了允许这种混合算术，你需要定义一个从 `Int` 到 `Rational` 的隐式转换（implicit\
  \ conversion）：\n\n```\nscala> implicit def intToRational(x: Int) = \n        new\
  \ Rational(x, 1)\n  intToRational: (x: Int)Rational\n```\n\n一旦有了转换，转换接收者就能解决问题：\n\
  \n```\nscala> 1 + oneHalf\n  res2: Rational = 3/2\n```\n\n这里在背后发生的过程是：Scala 编译器首先尝试对原始表达式\
  \ `1 + oneHalf` 进行类型检查。由于类型检查失败了，因为 `Int` 虽然有多个 `+` 方法，但没有一个可以接受 `Rational` 参数的。接下来，编译器会寻找从\
  \ `Int` 到其他类型的隐式转换，而该类型必须有一个可以应用于 `Rational` 的 `+` 方法。它找到了你定义的转换并应用了它，结果如下：\n\n\
  ```\nintToRational(1) + oneHalf\n```\n\n在这种情况下，编译器之所以能找到隐式转换是因为你在解释器中输入了它的定义，这使其在整个会话期间一直处于作用域内。\n\
  \n### 模拟新语法\n\n隐式转换的另一个主要用途是模拟新语法。还记得你可以像这样编写 `Map` 语法吗：\n\n```\nMap(1 -> \"one\"\
  , 2 -> \"two\", 3 -> \"three\")\n```\n\n你是否好奇过 `->` 是如何被支持的？它并不是语法！相反，`->` 是 `Arrowoc`\
  \ 类的一个方法，该类定义在标准预定义文件（`scala.Predef`）中。预定义文件还定义了一个从 `Any` 到 `Arrowoc` 的隐式转换。当你写下\
  \ `1 -> \"one\"` 时，编译器会插入一个从 `1` 到 `Arrowoc` 的转换，以便能够找到 `->` 方法。以下是相关的定义：\n\n```\n\
  package scala\n  object Predef {\n    class ArrowocA {\n      def ->B: Tuple2[A,\
  \ B] = Tuple2(x, y)\n    }\n    implicit def any2ArrowocA: Arrowoc[A] = new Arrowoc(x)\n\
  \  }\n```\n\n这种“富包装器”（rich wrappers）模式在为语言提供类语法扩展的库中非常常见，因此你应该看到它时准备好识别这种模式。每当你看到有人调用接收者中似乎不存在的方法时，他们可能在使用隐式转换（implicits）。同样，如果你看到一个名为\
  \ `RichInt` 或 `RichBoolean` 的类，该类可能添加了类似语法的方法。\n\n你在第 5 章中已经见过了基础类型的这种富包装器模式。正如你现在看到的，这些富包装器的应用非常广泛，通常让你能够直接使用内部\
  \ DSL，而其他语言的程序员可能会觉得有开发外部 DSL 的必要。\n\n### 隐式类（Implicit classes）\n\nScala 在 2.10\
  \ 中引入了隐式类，以便更方便地编写富包装器类。隐式类是一个带有 `implicit` 关键字的类。对于任何此类类，编译器都会生成一个从类的构造函数参数到该类本身的隐式转换。如果你计划将该类用于包装器模式，这种转换正是你需要的。\n\
  \n例如，假设你有一个名为 `Rectangle` 的类，用于表示屏幕上矩形的宽度和高度：\n\n```\ncase class Rectangle(width:\
  \ Int, height: Int)\n```\n\n如果你频繁使用这个类，你可能想使用富包装器模式，以便方便地构造它。这里有一种方法：\n\n```\nimplicit\
  \ class RectangleMaker(width: Int) {\n  def x(height: Int) = Rectangle(width, height)\n\
  }\n```\n\n上面的定义以通常的方式定义了一个 `RectangleMaker` 类。此外，它会导致自动生成以下转换：\n\n```\n// 自动生成\n\
  implicit def RectangleMaker(width: Int) = new RectangleMaker(width)\n```\n\n结果是，你可以通过在两个整数之间放置一个\
  \ `x` 来创建点：\n\n```\nscala> val myRectangle = 3 x 4\n  myRectangle: Rectangle = Rectangle(3,4)\n\
  ```\n\n这是它的工作原理：由于类型 `Int` 没有名为 `x` 的方法，编译器将寻找从 `Int` 到具有该方法的类型的隐式转换。它会找到生成的 `RectangleMaker`\
  \ 转换，而 `RectangleMaker` 确实有一个名为 `x` 的方法。编译器插入了对该转换的调用，之后对 `x` 的调用通过了类型检查并实现了预期的效果。\n\
  \n作为一个冒险者的警告：你可能会想认为任何类前面都可以加 `implicit`。事实并非如此。隐式类不能是 `case class`，且它的构造函数必须恰好有一个参数。此外，隐式类必须位于另一个对象、类或特质（trait）内部。在实践中，只要你将隐式类作为富包装器来为现有类添加一些方法，这些限制通常并不重要。\n\
  \n### 21.5 隐式参数（Implicit parameters）\n\n编译器插入隐式内容的另一个地方是在参数列表中。编译器有时会将 `someCall(a)`\
  \ 替换为 `someCall(a)(b)`，或将 `new SomeClass(a)` 替换为 `new SomeClass(a)(b)`，从而添加缺失的参数列表以完成调用。被替换的是整个柯里参数列表，而不是最后一个参数。例如，如果\
  \ `someCall` 缺失的最后一个参数列表需要三个参数，不仅在定义这些标识符（如 `b`、`c` 和 `d`）时必须标记为式，`someCall` 或 `someClass`\
  \ 的定义也必须是隐式的。\n\n这是一个简单的示例。假设你有一个 `PreferredPrompt` 类来封装提示字符串：\n\n```\nclass PreferredPrompt(val\
  \ preference: String)\n```\n\n同样，假设有一个 `Greeter` 对象，其 `greet` 方法接收两个参数列表。第一个参数列表接收字符串\
  \ `name`，第二个参数列表接收一个 `PreferredPrompt`：\n\n```\nobject Greeter {\n  def greet(name:\
  \ String)(implicit prompt: PreferredPrompt) = {\n    println(\"Welcome, \" + name\
  \ + \". The system is ready.\")\n    println(prompt.preference)\n  }\n}\n```\n\n\
  最后一个参数列表标记为隐式，这意味着它可以被隐式提供。但你仍然可以显式地提供提示，如下：\n\n```\nscala> val obsPrompt = new\
  \ PreferredPrompt(\">\")\nobsPrompt: PreferredPrompt\n\nscala> Greeter.greet(\"\
  Bob\")(obsPrompt)\nWelcome, Bob. The system is ready.\n```\n\n为了让编译器隐式提供参数，你必须首先定义一个预期类型的变量，在本例中是\
  \ `PreferredPrompt`。你可以这样做，例如在一个 `JoesPrefs` 对象中：\n\n```\nobject JoesPrefs {\n \
  \ implicit val prompt = new PreferredPrompt(\"Yes, master>\")\n}\n```\n\n注意，`val`\
  \ 本身被标记为隐式。如果没有标记，编译器将不会使用它来提供缺失的参数列表。如果它没有作为单个标识符处于作用域内，也不会使用它，如示例所示：\n\n```\n\
  scala> Greeter.greet(\"Joe\")\n  <console>:13: error: could not find implicit value\
  \ for\n  parameter prompt: PreferredPrompt\n    Greeter.greet(\"Joe\")\n       \
  \        ^\n```\n\n一旦你通过 `import` 将其引入作用域，它就会被用于提供缺失的参数列表：\n\n```\nscala> import\
  \ JoesPrefs._\nimport JoesPrefs._\n\nscala> Greeter.greet(\"Joe\")\nWelcome, Joe.\
  \ The system is ready.\n```\n\n\n\n\n请注意，`implicit` 关键字应用于整个参数列表，而不是针对单个参数。Listing\
  \ 21.1 显示了一个示例，其中 `Greeter` 的 `greet` 方法的最后一个参数列表（它再次被标记为隐式）包含两个参数：`prompt`（类型为\
  \ `PreferredPrompt`）和 `drink`（类型为 `PreferredDrink`）。\n\n单例对象 `JoesPrefs` 声明了两个隐式\
  \ `vals`：类型为 `PreferredPrompt` 的 `prompt` 和类型为 `PreferredDrink` 的 `drink`。与之前一样，只要这些没有作为单一标识符处于作用域内，它们就不会被用于填充\
  \ `greet` 缺失的参数列表：\n\n```\nscala> Greeter.greet(\"Joe\") \n  <console>:19: error:\
  \ could not find implicit value for \n  parameter prompt: PreferredPrompt\n    \
  \              Greeter.greet(\"Joe\")\n                               ^\n```\n\n\
  你可以通过导入将两个隐式 `vals` 都引入作用域：\n\n```\nscala> import JoesPrefs._\n  import JoesPrefs._\n\
  ```\n\n由于 `prompt` 和 `drink` 现在都作为单一标识符处于作用域内，可以使用它们来显式地提供最后一个参数列表，如下：\n\n```\n\
  scala> Greeter.greet(\"Joe\")(prompt, drink)\n  Welcome, Joe. The system is ready.\n\
  \  But while you work, why not enjoy a cup of tea?\n  Yes, master>\n```\n\n并且由于所有隐式参数的规则现在都已满足，你也可以通过省略最后一个参数列表，让\
  \ Scala 编译器自动为你提供 `prompt` 和 `drink`：\n\n```\nscala> Greeter.greet(\"Joe\")\n  Welcome,\
  \ Joe. The system is ready.\n  But while you work, why not enjoy a cup of tea?\n\
  \  Yes, master>\n```\n\n```scala\nclass PreferredPrompt(val preference: String)\n\
  \  class PreferredDrink(val preference: String)\n\n  object Greeter {\n    def greet(name:\
  \ String)(implicit prompt: PreferredPrompt,\n        drink: PreferredDrink) = {\n\
  \n      println(\"Welcome, \" + name + \". The system is ready.\")\n      print(\"\
  But while you work, \")\n      println(\"why not enjoy a cup of \" + drink.preference\
  \ + \"?\")\n      println(prompt.preference)\n    }\n  }\n\n  object JoesPrefs {\n\
  \    implicit val prompt = new PreferredPrompt(\"Yes, master> \")\n    implicit\
  \ val drink = new PreferredDrink(\"tea\")\n  }\n```\n\n##### Listing 21.1 - 一个带有多个参数的隐式参数列表。\n\
  \n关于前面的示例需要注意的一点是，我们没有使用 `String` 作为 `prompt` 或 `drink` 的类型，尽管它们最终通过其 `preference`\
  \ 字段提供的都是 `String`。因为编译器通过匹配参数类型与作用域内值的值的类型来选择隐式参数，所以隐式参数通常具有“稀有”或“特殊”的类型，这样就不可能发生意外匹配。例如，Listing\
  \ 21.1 中的 `PreferredPrompt` 和 `PreferredDrink` 类型仅是为了作为隐式参数类型而定义的。因此，如果这些类型的隐式变量不是打算用作\
  \ `Greeter.greet` 的隐式参数，那么它们不太可能处于作用域内。\n\n关于隐式参数需要知道的另一点是，它们最常用于提供有关在早之前的参数列表中*显式*提到的类型的信息，类似于\
  \ Haskell 的类型类（type classes）。\n\n例如，考虑 Listing 21.2 显示的 `maxListOrdering` 函数，它返回传递的列表的最大元素。\n\
  \n```scala\ndef maxListOrderingT\n      (ordering: Ordering[T]): T = \n  elements\
  \ match {\n    case List() =>\n      throw new IllegalArgumentException(\"empty\
  \ list!\")\n    case List(x) => x\n    case x :: rest =>\n      val maxRest = maxListOrdering(rest)(ordering)\n\
  \      if (ordering.gt(x, maxRest)) x\n      else maxRest\n  }\n```\n\n#### Listing\
  \ 21.2 - 一个带有上界的函数。\n\n`maxListOrdering` 的签名与 Listing 19.12 此处 所示的 `orderedSort`\
  \ 类似：它接受一个 `List[T]` 作为参数，现在额外接受一个类型为 `Ordering[T]` 的额外参数。这个额外参数指定了在比较类型 T 的元素时使用什么排序。因此，此版本可以用于没有内置排序的类型。此外，此版本也可以用于那些*有*内置排序的类型，但你偶尔想使用某些其他排序的情况。\n\
  \n这个版本更通用，但使用起来也更麻烦。现在，即使 T 是像 `String` 这样具有明显排序的类型，调用者也必须指定排序。为了让新方法更方便，将第二个参数设为隐式会有帮助。这种方法在\
  \ Listing 21.3 中所示。\n\n示例中的 `ordering` 参数用于描述 `Ts` 的排序。在 `maxListParm` 的体中，这个 `ordering`\
  \ 用于两个地方：对 `maxListParm` 的递归调用，以及一个 `if` 表达式。\n\n```scala\ndef maxListParmT\n  \
  \  (implicit ordering: Ordering[T]): T =\n\n  elements match {\n    case List()\
  \ =>\n      throw new IllegalArgumentException(\"empty list!\")\n    case List(x)\
  \ => x\n    case x :: rest =>\n      val maxRest = maxListParm(rest)(ordering)\n\
  \      if (ordering.gt(x, maxRest)) x\n      else maxRest\n  }\n```\n\n#### Listing\
  \ 21.3 - 一个带有隐式参数的函数。\n\n`maxListParm` 函数是一个使用用于提供有关在早之前的参数列表中*显式*提到的类型的信息的隐式参数的示例。具体来说，类型为\
  \ `Ordering[T]` 的隐式参数 `ordering` 提供关于 `T` 的更多信息——在这个情况下是如何排序 `Ts`。`T` 位于 `List[T]`\
  \ 中，即 `elements` 的类型。因为调用 `maxListParm` 时必须显式提供 `elements`，编译器在编译时知道 `T`，因此可以确定是否存在隐式的定义。如果是，它就可以隐式地传递第二个参数列表。\n\
  \n这种模式非常常见，以至于标准库为许多类型提供了隐式的“ordering”方法。因此，你可以对多种类型使用此 `maxListParm` 方法：\n\n```scala\n\
  scala> maxListParm(List(1,5,10,3))\n  res9: Int = 10\n\nscala> maxListParm(List(1.5,5.2,10.7,3.14159))\n\
  \  res10: Double = 10.7\n\nscala> maxListParm(List(\"one\", \"two\", \"three\"))\n\
  \  res11: String = two\n```\n\n在第一情况下，编译器为 `Ints` 插入了排序；在第二情况下，针对 `Doubles`；在第三情况下，针对\
  \ `Strings`。\n\n#### 隐式参数的规则\n\n作为规则，最好在隐式参数的类型中使用自定义命名类型。例如，在前面的示例中，`prompt` 和\
  \ `drink` 的类型不是 `String`，而是 `PreferredPrompt` 和 `PreferredDrink`。作为反例，考虑 `maxListParm`\
  \ 函数完全可以写成以下类型签名：\n\n```scala\ndef maxListPoorStyleT\n  (implicit orderer: (T, T)\
  \ => Boolean): T\n```\n\n然而，为了使用此版本的函数，调用者必须提供一个类型为 `(T, T) => Boolean` 的 `orderer`\
  \ 参数。这是一个相当通用的类型，包含了任何从两个 T 到 `Boolean` 的函数。它完全没有指示该类型用于何；它可以是一个等性测试、小于测试、大于测试，或者完全是其他。\n\
  \n\n\n\n`maxListImpParm` 的实际代码在 Listing 21.3 中，展示了更好的风格。它使用了一个类型为 `Ordering[T]`\
  \ 的排序参数。该类型中的 `Ordering` 一词准确地说明了隐式参数的用途：用于对 `T` 的元素进行排序。由于这种排序类型更加显式，在标准库中为该类型添加隐式提供程序并没有什么困难。相比之下，想象一下如果你在标准库中添加一个类型为\
  \ `(T, T) => Boolean` 的隐式参数，并且编译器开始在人们的代码中到处使用它，会造成怎样的混乱。你最终将得到可以编译和运行的代码，但它会对项对进行相当任意的测试！因此得出了风格规则：在隐式参数的类型中至少使用一个确定角色的名称。\n\
  \n### 21.6 上下文边界 (Context bounds)\n\n上一个示例展示了使用隐式的机会，但并没有使用。请注意，当你在参数上使用隐式时，编译器不仅会尝试为该参数\
  \ `supply` 一个隐式值，编译器还会将该参数作为可用的隐式在方法体内部 `use`！因此，方法体内部第一次对 `ordering` 的使用可以省略。\n\
  \n```scala\n def maxListT\n      (implicit ordering: Ordering[T]): T =\n\n  elements\
  \ match {\n    case List() => \n      throw new IllegalArgumentException(\"empty\
  \ list!\")\n    case List(x) => x\n    case x :: rest =>\n      val maxRest = maxList(rest)\
  \    // (ordering) 是隐式的\n      if (ordering.gt(x, maxRest)) x  //这里的 ordering 是\n\
  \      else maxRest                  // 仍然显式的\n  }\n```\n\n#### Listing 21.4 - 内部使用隐式参数的函数。\n\
  \n当编译器检查 Listing 21.4 中的代码时，它会发现类型不匹配。表达式 `maxList(rest)` 只提供了一个参数列表，但 `maxList`\
  \ 需要两个。由于第二个参数列表是隐式的，编译器并没有立即放弃类型检查。相反，它会寻找合适类型的隐式参数，在本例中是 `Ordering[T]`。在这种情况下，它找到了一个，并将调用重写为\
  \ `maxList(rest)(ordering)`，之后代码通过了类型检查。\n\n另一种消除对 `ordering` 第二次使用的方法。它涉及标准库中定义的以下方法：\n\
  \n```scala\n def implicitlyT = t\n```\n\n调用 `implicitly[Foo]` 的效果是编译器将寻找类型为 `Foo`\
  \ 的隐式定义。然后它将使用该对象调用 `implicitly` 方法，而该方法反过来又将对象直接返回。因此，当你想在当前作用域内查找类型为 `Foo` 的隐式对象时，都可以编写\
  \ `implicitly[Foo]`。例如，Listing 21.5 展示了如何使用 `implicitly[Ordering[T]]` 通过其类型检索排序参数。\n\
  \n仔细观察这个最后版本的 `maxList`。在方法的正文中，没有一处提到过 `ordering` 参数。第二个参数完全可以命名为 \"comparator\"\
  ：\n\n```scala\n def maxListT\n      (implicit comparator: Ordering[T]): T = // 体体相同...\n\
  ```\n\n```scala\n def maxListT\n         (implicit ordering: Ordering[T]): T =\n\
  \n  elements match {\n    case List() => \n      throw new IllegalArgumentException(\"\
  empty list!\")\n    case List(x) => x\n    case x :: rest =>\n      val maxRest\
  \ = maxList(rest)\n      if (implicitly[Ordering[T]].gt(x, maxRest)) x\n      else\
  \ maxRest\n  }\n```\n\n#### Listing 21.5 - 使用 implicitly 的函数。\n\n确然如此，这个版本同样有效：\n\
  \n```scala\n def maxListT\n      (implicit iceCream: Ordering[T]): T = // 体体相同...\n\
  ```\n\n由于这种模式很常见，Scala 允许通过使用上下文边界 (context bound*) 来省略此参数的名称并缩短方法头。使用上下文边界，你编写\
  \ `maxList` 的签名将如所示 Listing 21.6。语法 `[T : Ordering]` 是一个上下文边界，它做了两件事：首先，它像往常引入了一个类型参数\
  \ `T`。其次，它添加了一个类型为 `Ordering[T]` 的隐式参数。在之前的版本中，它被称为 `ordering`，但使用上下文边界时你并不知道它是什么。直觉上，你可以将上下文边界看作是*关于*某种类型的某种内容。当你写\
  \ `[T : Ordered]` 时，你是在说 T *是* `Ordered`。相比之下，当你写 `[T : Ordering]` 时，你并不是在说 T 是；而是在说与\
  \ T 关联有某种 `ordering`。因此，上下文边界是非常灵活的。\n\n```scala\n def maxListT : Ordering: T =\n\
  \  elements match {\n    case List() => \n      throw new IllegalArgumentException(\"\
  empty list!\")\n    case List(x) => x\n    case x :: rest =>\n      val maxRest\
  \ = maxList(rest)\n      if (implicitly[Ordering[T]].gt(x, maxRest)) x\n      else\
  \ maxRest\n  }\n```\n\n#### Listing 21.6 - 使用上下文边界的函数。\n\n### 21.7 当多个转换适用时\n\n\
  可能会出现多个隐式转换都在作用域内，且每个都有效。在大多数情况下，Scala 拒绝在这种情况下插入转换。当省略的转换显而易见时，隐式转换效果良好。这里有一个简单的示例。有一个接收序列的方法，一个将整数转换为范围的转换，以及一个将整数转换为数字列表的转换：\n\
  \n```scala\nscala> def printLength(seq: Seq[Int]) = println(seq.length)\n\nscala>\
  \ implicit def intToRange(i: Int) = 1 to i\nintToRange: (i: Int)scala.collection.immutable.Range\n\
  \nscala> implicit def intToDigits(i: Int) =\n  i.toString.toList.map(_.toInt)\n\
  intToDigits: (i: Int)List[Int]\n\nscala> printLength(12)\n<console>:26: error: type\
  \ mismatch;\n  found   : Int(12)\n  required: Seq[Int]\nNote that implicit conversions\
  \ are not applicable because they 存在歧义:\n  both method intToRange of type (i: Int)scala.collection.immutable.Range\n\
  \  and method intToDigits of type (i: Int)List[Int]\n  are possible conversion functions\
  \ from Int(12) to Seq[Int]\n   printLength(12)\n                               \
  \  ^\n```\n\n这里的歧义是真实的。将整数转换为数字序列与转换为范围完全不同。在这种情况下，程序员应该指定意图是哪一个并显式化。直到 Scala 2.7，这就是故事的结局。当多个隐式转换适用时，编译器拒绝在它们之间做出选择。这种情况与方法重载一样。如果你尝试调用\
  \ `foo(null)` 且有两个接受 null 的不同 `foo` 重载，编译器将拒绝。它会说方法调用的目标存在歧义。\n\n\n\n\nScala 2.8\
  \ 放宽了这一规则。如果可用的转换中有一个比其他的**更具体（more specific）**，那么编译器将选择更具体的那个。这种思想是：每当有理由相信程序员总是会选择其中一种转换而不是其他时，就不要求程序员显式地编写它。毕竟，方法重载也有类似的松宽机制。继续上一个例子，如果可用的\
  \ `foo` 方法中有一个接收 `String`，而另一个接收 `Any`，则选择 `String` 版本。它显然更具体。\n\n更准确地说，如果满足以下任一，则一个隐式转换比另一个**更具体**：\n\
  \n*   前者的参数类型是后者的子类型。\n*   两个转换都是方法，且前者的封装类扩展了后者的封装类。\n\n重新审视这个问题并修订规则的动机是为了改进 Java\
  \ 集合、Scala 集合和字符串之间的互操作性。\n\n这是一个简单的示例：\n\n```\nval cba = \"abc\".reverse\n```\n\
  \n`cba` 的推断类型是什么？直觉上，该类型应该是 `String`。反转一个字符串应该产生另一个字符串，对吧？然而，在 Scala 2.7 中发生的情况是\
  \ `\"abc\"` 被转换成了 Scala 集合。反转 Scala 集合会产生 Scala 集合，因此 `cba` 的类型将是一个集合。虽然有一个返回字符串的隐式转换，但并没有解决所有问题。例如，在\
  \ Scala 2.8 之前的版本中，`\"abc\" == \"abc\".reverse.reverse` Result 为 false！\n\n在 Scala\
  \ 2.8 中，`cba` 的类型是 `String`。旧的到 Scala 集合的隐式转换（现在命名为 `WrappedString`）被保留了。但是，从 `String`\
  \ 到新类型 `StringOps` 有更具体的转换。`StringOps` 有许多如 `reverse` 等方法，但它们返回的是 `String` 而不是集合。到\
  \ `StringOps` 的转换直接定义在 `Predef` 中，而到 Scala 集合的转换定义在一个类 `LowPriorityImplicits` 中，该类由\
  \ `Predef` 扩展。当这两个转换之间存在选择时，编译器会选择到 `StringOps` 的转换，因为它定义在另一个转换所在类的子类中。\n\n### 21.8\
  \ 调试隐式转换\n\n隐式转换是 Scala 中一个强大的特性，但有时很难正确处理。本节包含了一些调试隐式转换的技巧。\n\n有时你可能觉得奇怪，为什么编译器没有找到你认为应该适用的隐式转换。在这种情况下，显式地写出转换会有帮助。如果这样做仍然给出错误信息，那么你就知道编译器为什么无法应用你的隐式转换了。\n\
  \n例如，假设你错误地认为 `wrapString` 认为是从 `Strings` 到 `Lists` 的转换，而不是 `IndexedSeqs`。你会纳闷为什么下面的代码无法工作：\n\
  \n```\nscala> val chars: List[Char] = \"xyz\"\n  <console>:24: error: type mismatch;\n\
  \  found    : String(\"xyz\")\n  required: List[Char]\n       val chars: List[Char]\
  \ = \"xyz\"\n                               ^\n```\n\n同样，显式写出 `wrapString` 转换有助于发现出了什么问题：\n\
  \n```\nscala> val chars: List[Char] = wrapString(\"xyz\")\n  <console>:24: error:\
  \ type mismatch;\n  found    : scala.collection.immutable.WrappedString\n  required:\
  \ List[Char]\n       val chars: List[Char] = wrapString(\"xyz\")\n             \
  \                  ^\n```\n\n通过这样，你找到了错误原因：`wrapString` 的返回类型是错误的。另一方面，显式插入转换也可能让错误消失。在这种情况下，你就知道其他规则之一（例如作用域规则\
  \ `Scope Rule`）阻止了隐式转换的生效。\n\n在调试程序时，查看编译器插入了哪些隐式转换有时会有帮助。编译器的 `-Xprint:typer` 选项对此非常有用。如果你带有此选项运行\
  \ `scalac`，编译器将向你展示类型检查器添加所有隐式转换后的代码原貌。示例可以在 列表 21.7 和 列表 21.8 中所示。如果你查看这些列表的最后一条语句，你会看到...\n\
  \n\n\n\n了解 `List` 类的内部工作原理有几个用处。你将对列表操作的相对效率有更好的理解，这将帮助你使用列表编写出快速且紧凑的代码。你还将获得一套技术工具箱，可以将其应用于你自己的库的设计中。最后，`List`\
  \ 类是 Scala 类型系统（特别是其泛型概念）的一个复杂应用。因此，学习 `List` 类将深化你在这些领域的知识。\n\n### 22.1 原理上的 List\
  \ 类\n\n在 Scala 中，列表并不是作为语言构造结构“内置”的；它们由 `scala` 包中的抽象类 `List` 定义，该类带有两个子类：`::` 和\
  \ `Nil`。在本章中，我们将对 `List` 类进行快速的漫览。本节对该类的描述是较为简化的，与其在 Scala 标准库中的实际实现相比，后者将在第 22.3\
  \ 节 中介绍。\n\n```\n package scala\nabstract class List[+T] {\n```\n\n`List` 是一个抽象类，因此你不能通过调用空\
  \ `List` 构造函数来定义元素。例如，表达式 `\"new List\"` 是非法的。该类有一个类型参数 `T`。该类型参数前的 `+` 指定列表是协变的，正如第\
  \ 19 节 中讨论的那。\n\n![image images/listHierarchy85.png](img/listHierarchy85.png)\n\n\
  #### 图 22.1 - Scala 列表的类层次结构。\n\n由于这个属性，你可以将类型为 `List[Int]` 的值赋值给类型为 `List[Any]`\
  \ 的变量：\n\n```\n scala> val xs = List(1, 2, 3)\n  xs: List[Int] = List(1, 2, 3)\n\
  \n  scala> var ys: List[Any] = xs\n  ys: List[Any] = List(1, 2, 3)\n```\n\n所有的列表操作都可以基于三个基本方法定义：\n\
  \n```\n def isEmpty: Boolean\n  def head: T\n  def tail: List[T]\n```\n\n三个方法在 `List`\
  \ 类中都是抽象的。它们定义在子对象 `Nil` 和子类 `::` 中。`List` 的层次结构如图图 22.1 所示。\n\n#### Nil 对象\n\n\
  `Nil` 对象定义了一个空列表。它的定义如代码列表 22.1 所示。`Nil` 对象继承自类型 `List[Nothing]`。由于协变性，这意味着 `Nil`\
  \ 与 `List` 类型的每一个实例兼容。\n\n```\n case object Nil extends List[Nothing] {\n    override\
  \ def isEmpty = true\n    def head: Nothing =\n      throw new NoSuchElementException(\"\
  head of empty list\")\n    def tail: List[Nothing] =\n      throw new NoSuchElementException(\"\
  tail of empty list\")\n}\n```\n\n##### 代码列表 22.1 - Nil 单例对象的定义。\n\n`List` 类的三个抽象方法在\
  \ `Nil` 对象中以一种直接的方式实现：`isEmpty` 方法返回 `true`，而 `head` 和 `tail` 方法都会抛出异常。注意，抛出异常不仅是合理的，而且对于\
  \ `head` 来说实际上是唯一可能的操作：因为 `Nil` 是 `Nothing` 的 `List`，所以 `head` 的结果类型必须是 `Nothing`。由于没有这种类型的值，这意味着\
  \ `head` 无法返回普通值。它必须通过抛出异常来异常地返回。\n\n#### :: 类\n\n`::` 类读作 \"cons\"（construct 的缩写），代表非空列表。这样命名是为了支持使用中缀符号\
  \ `::` 进行模式匹配。你可能已经在第 16.5 节 中看到，模式中的每个中缀操作都被视为该中缀运算符对其参数的构造器应用。因此，模式 `x :: xs`\
  \ 被视为 `::(x, xs)`，其中 `::` 是一个样例类（case class）。\n\n这里是 `::` 类的定义：\n\n```\n final case\
  \ class ::T extends List[T] {\n  def head = hd\n  def tail = tl\n  override def\
  \ isEmpty: Boolean = false\n}\n```\n\n`::` 类的实现非常直接。它接收两个参数 `hd` 和 `tl`，表示要构造的列表的头部和尾部。`head`\
  \ 和 `tail` 方法的定义只需返回对应的参数。事实上，这种模式可以通过让参数直接实现父类 `List` 的 `head` 和 `tail` 方法来缩写，如下所示\
  \ `::` 类等效但更短的定义：\n\n```\n final case class ::T\n    extends List[T] {\n\n  override\
  \ def isEmpty: Boolean = false\n}\n```\n\n这之所以有效，是因为每个样例类参数都隐式地也是该类的字段（就像参数声明前缀了\
  \ `val` 一样）。回想第 20.3 节，Scala 允许你使用字段来实现如 `head` 或 `tail` 这样的无参数抽象方法。因此，上述代码直接使用参数\
  \ `head` 和 `tail` 作为从 `List` 类继承的抽象方法 `head` 和 `tail` 的实现。\n\n#### 更多方法\n\n所有其他\
  \ `List` 方法都可以使用基本的三个方法来编写。例如：\n\n```\n def length: Int = \n    if (isEmpty) 0 else\
  \ 1 + tail.length\n```\n\n或者：\n\n```\n def drop(n: Int): List[T] =\n  if (isEmpty)\
  \ Nil\n  else if (n <= 0) this\n  else tail.drop(n - 1)\n```\n\n或者：\n\n```\n def\
  \ mapU: List[U] =\n  if (isEmpty) Nil\n  else f(head) :: tail\n```\n\n#### 列表构造\n\
  \n列表构造方法 `::` 和 `:::` 是特殊的。由于它们以冒号结尾，它们绑定到右侧的操作数上。也就是说，如 `x :: xs` 这样的操作被视为方法调用\
  \ `xs::(x)`。事实上，`x::(xs)` 是意义的，因为 `x` 是列表类型，所以我们不能假设该类型有 `::` 方法。\n\n因此，`::` 方法应该接收一个元素值并产生一个新的列表。元素的所需的类型是什么？你可能倾向于说它应该与列表类型相同，但实际上这样限制太严格了。\n\
  \n为了理解这一点，请考虑以下类层次结构：\n\n```\n abstract class Fruit\n  class Apple extends Fruit\n\
  \  class Orange extends Fruit\n```\n\n代码列表 22.2 显示了当你构造水果列表时发生了什么：\n\n```\n scala>\
  \ val apples = new Apple :: Nil\n  apples: List[Apple] = List(Apple@e885c6)\n\n\
  \  scala> val fruits = new Orange :: apples\n  fruits: List[Fruit] = List(Orange@3f51b39,\
  \ Apple@e885c6)\n```\n\n##### 代码列表 22.2 - 向子类列表添加父类元素。\n\n`apples` 值被预期的苹果 列表。然而，`fruits`\
  \ 的定义显示仍然可以向列表添加不同类型的元素。结果列表的元素类型是 `Fruit`，它是列表元素类型（即 `Apple`）和要添加元素类型（即 `Orange`）的最精确的公共父类。这种灵活性是通过如下定义\
  \ `::` 方法获得的，如代码列表 22.3 所示：\n\n```\n def ::U > T: List[U] = new scala.::(x, this)\n\
  ```\n\n##### 代码列表 22.3 - List 类中方法 :: (cons) 的定义。\n\n注意，该方法本身是多态的——它接受一个名为 `U` 的类型参数。此外，`U`\
  \ 在 `[U > T]` 中被限制为列表元素类型 `T` 的父类。要添加的元素类型为 `U`，结果是 `List[U]`。\n\n\n\n\n通过列表 22.3\
  \ 中所示的 `::` 表达式，你可以检查列表 22.2 中所示 fruits 的定义在类型上是如何运作的：在该定义中，`::` 的类型参数 `U` 被实例化为\
  \ `Fruit`。`U` 的下界约束得到了满足，因为列表 `apples` 的类型为 `List[Apple]`，且 `Fruit` 是 `Apple` 的超类型。`::`\
  \ 的参数是 `new Orange`，它符合 `Fruit` 类型。因此，该方法的应用在类型上是正确的，结果类型为 `List[Fruit]`。图 22.2\
  \ 展示了执行列表 22.2 中所示代码后生成的列表结构。\n\n![image images/moreFruit160.png](img/moreFruit160.png)\n\
  \n#### 图 22.2 - 列表 22.2 中所示 Scala 列表的结构。\n\n事实上，带有下界 `T` 的 `::` 多态定义不仅方便，而且使 `class\
  \ List` 的定义类型正确也是必要的。这是因为列表被定义为协变的。\n\n假设我们是这样定义 `::` 的：\n\n``` // 一个思想实验（无法运行）\n\
  \ def ::(x: T): List[T] = new scala.::(x, this)\n```\n\n你已经在第 19 章中看到，方法参数被视为逆变位置，因此列表元素类型\
  \ `T` 在上面的定义中处于逆变位置。但这样 `List` 就不能声明为对 `T` 协变。因此，下界 `U > T` 一石二鸟：它既消除了一个类型问题，并产生了一个使用上更灵活的\
  \ `::` 方法。列表连接方法 `:::` 的定义与 `::` 类似，如列表 22.4 所示。\n\n```\n def :::U >: T: List[U]\
  \ = \n     if (prefix.isEmpty) this\n     else prefix.head :: prefix.tail ::: this\n\
  ```\n\n#### 列表 22.4 - List 类中方法 ::: 的定义。\n\n与 `cons` 一样，连接操作也是多态的。结果类型会根据需要“拓宽”，以包含所有列表元素的类型。再次注意，在中缀操作和显式方法调用之间，参数的顺序是交换的。由于\
  \ `:::` 和 `::` 都以冒号结尾，它们都向右侧绑定，且都是右结合的。例如，列表 22.4 所示的 `:::` 定义的 `else` 部分包含了 `::`\
  \ 和 `:::` 的中缀操作。\n\n这些中缀操作可以展开为等效的方法调用，如下：\n\n```\n prefix.head :: prefix.tail :::\
  \ this (因为 :: 和 ::: 是右结合的)\n\n prefix.head :: (prefix.tail ::: this) (因为 :: 向右结合)\n\
  \n (prefix.tail ::: this) :: prefix.head (因为 ::: 向右结合)\n\n this ::: (prefix.tail)\
  \ :: prefix.head\n```\n\n### 22.2 ListBuffer 类\n\n列表的典型访问模式是递归的。例如，为了不使用 `map` 增加列表的每个元素，你可以写：\n\
  \n```\n def incAll(xs: List[Int]): List[Int] = xs match {\n  case List() => List()\n\
  \  case x :: xs1 => x + 1 :: incAll(xs1)\n }\n```\n\n该程序的一个缺点是它不是尾递归的。注意，对 `incAll`\
  \ 的递归调用发生在 `::` 操作内部。因此，每次递归调用都需要一个新的栈帧。在当今的虚拟机上，这意味着你不能将 `incAll` 应用于超过 30,000\
  \ 到 50,000 个元素的列表。这很遗憾。你如何编写一个可以处理任意大小列表（取决于堆栈容量能力）的 `incAll` 版本呢？\n\n一种方法是使用循环：\n\
  \n```\n for (x <- xs)\n```\n\n但循环中应该放什么？注意，`incAll` 通过将元素插入到递归调用之前来构建列表，而循环需要在结果的末尾添加新元素。一种非常低效的可能性是使用\
  \ `:::`，即列表追加运算符：\n\n```\n var result = List[Int]()\n for (x <- xs) result = result\
  \ ::: List(x + 1)\n result\n```\n\n这是极其低效的。因为 `:::` 消耗的时间与其第一个操作数的长度成正比，整个操作的时间与列表的平方成正比。这显然是不可接受的。\n\
  \n更好的替代方案是使用列表缓冲区。列表缓冲区允许你累积列表的元素。要实现这一点，你使用 `buf += elem` 操作，它会将元素 `elem` 添加到列表\
  \ `buf` 的末尾。一旦完成元素的添加，你就可以使用 `toList` 操作将缓冲区转换为列表。\n\n`ListBuffer` 是 `scala.collection.mutable`\
  \ 中的一个类。为了仅使用简单名称，你可以从它的包导入 `ListBuffer`：\n\n```\n import scala.collection.mutable.ListBuffer\n\
  ```\n\n使用列表缓冲区后，`incAll` 的体现在可以写成：\n\n```\n val buf = ListBuffer[Int]\n for (x <-\
  \ xs) buf += x + 1\n buf.toList\n```\n\n这是一种构建列表的高效方式。事实上，列表缓冲区的追加操作（`+=`）和 `toList`\
  \ 操作都只需要常数时间。\n\n### 22.3 实践中的 List 类\n\n第 22.1 节中给出的列表方法实现虽然清晰，但会遇到相同的栈溢出问题。因此，`List`\
  \ 的实际实现避免了递归，转而使用列表缓冲区。例如，列表 22.5 展示了 `List` 类中 `map` 的实际实现：\n\n```\n final override\
  \ def mapU: List[U] = {\n   val b = new ListBuffer[U]\n   var these = this\n   while\
  \ (!these.isEmpty) {\n     b += f(these.head)\n     these = these.tail\n   }\n \
  \  b.toList\n }\n```\n\n#### 列表 22.5 - List 类中方法 map 的定义。\n\n这种实现通过循环遍历列表，非常高效。尾递归实现同样高效，但通用递归实现会更慢且扩展性差。但最后的\
  \ `b.toList` 操作又是怎样的？它的复杂度是多少？事实上，调用 `toList` 方法只需要少量的周期，与列表的长度无关。\n\n为了理解为什么，再次查看构造非空列表的\
  \ `class ::`。实践中，该类与第 22.1 节中给出的理想定义并不完全对应。实际定义见列表 22.6。如你所见，有一个异常：`tl` 参数是一个 `var`！这意味着可以在构造列表后修改其尾部。但是，由于变量\
  \ `tl` 具有 `private[scala]` 修饰，它只能在 `scala` 包内部访问。包外的客户端代码既不能读取也不能写入 `tl`。\n\n```\n\
  \ final case class ::U extends List[U] {\n\n  def head = hd\n  def tail = tl\n \
  \ override def isEmpty: Boolean = false\n }\n```\n\n#### 22.6 - List 的子类 :: 的定义。\n\
  \n由于 `ListBuffer` 类包含 `scala` 包的子包 `scala.collection.mutable` 中，`ListBuffer` 可以访问\
  \ cons 单元的 `tl` 字段。事实上，列表缓冲区的元素表示为列表，追加新元素涉及对列表中最后一个 `::` 单元的 `tl` 字段的修改。以下是 `class\
  \ ListBuffer` 的开头：\n\n\n\n\n\n```scala\npackage scala.collection.immutable\nfinal\
  \ class ListBuffer[T] extends Buffer[T] {\n  private var start: List[T] = Nil\n\
  \  private var last0: ::[T] = _\n  private var exported: Boolean = false\n  ...\n\
  }\n```\n\n你看到了三个刻画 `ListBuffer` 特性的私有字段：\n\n| 字段 | 描述 |\n| :--- | :--- |\n| start\
  \ | 指向缓冲区中存储的所有元素的列表 |\n| last0 | 指向该列表中的最后一个 `::` 单元 |\n| exported | 表明缓冲区是否已通过\
  \ `toList` 操作转换为列表 |\n\n`toList` 操作非常简单：\n\n```scala\noverride def toList: List[T]\
  \ = {\n  exported = !start.isEmpty\n  start\n}\n```\n\n它返回由 `start` 指向的元素列表，如果该列表不为空，还会将\
  \ `exported` 设置为 `true`。因此，`toList` 非常高效，因为它没有复制存储在 `ListBuffer` 中的列表。但如果在 `toList`\
  \ 操作后进一步扩展该列表会发生什么呢？当然，一旦从 `toList` 返回列表，它就必须是不可变的。然而，向 `last0` 元素添加元素将修改 `start`\
  \ 所指向的列表。\n\n为了保持列表缓冲区操作的正确性，你需要处理一个新的列表。这是通过 `+=` 操作实现的第一行实现的：\n\n```scala\noverride\
  \ def += (x: T) = {\n  if (exported) copy()\n  if (start.isEmpty) {\n    last0 =\
  \ new scala.::(x, Nil)\n    start = last0\n  } else {\n    val last1 = last0\n \
  \   last0 = new scala.::(x, Nil)\n    last1.tl = last0\n  }\n}\n```\n\n你看到如果 `exported`\
  \ 为 `true`，`+=` 会复制 `start` 指向的列表。因此，最后并没有免费的午餐。如果你想从可以在末尾扩展的列表转换为不可变列表，就需要某些复制。然而，`ListBuffer`\
  \ 的实现使得只有在在转换为列表后被进一步扩展的列表缓冲区上才需要复制。这种情况在实践中非常罕见。列表缓冲区的大多数用例是增量地添加元素，最后在最后执行一次 `toList`\
  \ 操作。在这种情况下，没有必要的复制。\n\n### 22.4 外部函数式\n\n在上一节中，我们展示了 Scala 的 `List` 类和 `ListBuffer`\
  \ 类实现的关键元素。你看到列表在“外部”是纯函数式的，但在“内部”使用了使用列表缓冲器的命令式实现。这是 Scala 编程中的一种典型策略——通过仔细界定不纯操作的影响，试图将纯性与效率结合起来。\n\
  \n但你可能会问，为什么要坚持纯性？为什么不直接开放列表的定义，让 `tail` 字段（可能还有 `head` 字段）变为可变？这种方法的缺点是它会使程序变得脆弱得多。注意，使用\
  \ `::` 构建列表会重用已构建列表的尾部。\n\n所以当你写下：\n\n```scala\nval ys = 1 :: xs\nval zs = 2 ::\
  \ xs\n```\n\n列表 `ys` 和 `zs` 的尾部是共享的；它们指向同一个数据结构。这对于效率至关重要；如果每次向 `xs` 添加新元素时都复制列表\
  \ `xs`，速度会慢得多。由于共享是无处不在的，如果可以更改列表元素，将是非常危险的。例如，采用上面的代码，如果你想通过以下代码将列表 `ys` 截断为前两个元素：\n\
  \n```scala\nys.drop(2).tail = Nil // 在 Scala 中不能这样做！\n```\n\n你也会作为副作用截断列表 `zs` 和\
  \ `xs`。\n\n显然，这会变得非常困难。这就是为什么 Scala 采用不可变性。\n\n\n\n\n然而，最后两个查询并没有看起来那么不相似。事实上，`Scala`\
  \ 编译器会将第二个查询翻译成第一个。更广义地说，所有产生结果的 `for` 表达式都会被编译器翻译为高阶方法 `map`、`flatMap` 和 `withFilter`\
  \ 调用的组合。所有不带 `yield` 的 `for` 循环都会被翻译成一个较小规模的高阶函数集合：仅包含 `withFilter` 和 `foreach`。\n\
  \n在本章中，你将首先了解到到编写 `for` 表达式的精确规则。之后，你将看到它们如何让组合问题变得更容易解决。最后，你将学习 `for` 表达式是如何翻译的，以及结果，`for`\
  \ 表达式如何帮助你将 `Scala` 语言“扩展”到新的应用领域。\n\n### 23.1 For 表达式\n\n通常情况下，一个 `for` 表达式的形式如下：\n\
  \n```\n for ( seq ) yield expr\n```\n\n在这里，`seq` 是由生成器（generators）、定义（definitions）和过滤器（filters）组成的序列，元素之间用分号隔开。一个\
  \ `for` 表达式的示例是：\n\n```\n for (p <- persons; n = p.name; if (n startsWith \"To\"\
  )) \n  yield n\n```\n\n这个 `for` 表达式包含一个生成器、一个定义和一个过滤器。正如第 7.3 节此处所示，你也可以用大括号而不是括号包裹序列。这时分号就变成了可选的：\n\
  \n```\n for {\n  p <- persons             // 一个生成器\n  n = p.name              //\
  \ 一个定义\n  if (n startsWith \"To\")   // 一个过滤器\n } yield n\n```\n\n生成器的形式为：\n\n```\n\
  \ pat <- expr\n```\n\n表达式 `expr` 通常返回一个列表，尽管你稍后会看到这是可以通化的。模式 `pat` 会与列表中的所有元素进行逐一匹配。如果匹配成功，模式中的变量将绑定到元素对应的部分，就就像在第\
  \ 15 章中描述的那样。但如果匹配失败，不会抛出 `MatchError`。相反，该元素直接从迭代中丢弃。\n\n在最常见的情况下，模式 `pat` 只是一个变量\
  \ `x`，如 `x <- expr`。在这种情况下，变量 `x` 简单地遍历 `expr` 返回的所有元素。\n\n定义的形式为：\n\n```\n pat\
  \ = expr\n```\n\n该定义将模式 `pat` 绑定到 `expr` 的值，因此它的效果与 `val` 定义相同：\n\n```\n val x =\
  \ expr\n```\n\n最常见的情况仍然是模式是一个简单的变量 `x`（*例如*，`x = expr`）。这把 `x` 定义为值 `expr` 的名称。\n\
  \n过滤器的形式为：\n\n```\n if expr\n```\n\n在这里，`expr` 是一个 `Boolean` 类型的表达式。过滤器会丢弃迭代中所有\
  \ `expr` 返回 `false` 的元素。\n\n每个 `for` 表达式都从生成器开始。如果一个 `for` 表达式中有多个生成器，后来的生成器变化比先前的生成器更快。你可以通过以下简单的测试轻松地验证这一点：\n\
  \n```\nscala> for (x <- List(1, 2); y <- List(\"one\", \"two\")) \n      yield (x,\
  \ y)\n  res3: List[(Int, String)] =\n    List((1,one), (1,two), (2,one), (2,two))\n\
  ```\n\n### 23.2 N 皇后问题\n\n`for` 表达式的一个特别合适的应用领域是组合谜。这类谜的一个例子是 8 皇后问题：在标准棋盘上，放置八个皇后，使得没有任何一个皇后受到其他任何皇后的攻击（如果两个皇后处于同一列、同一行或对角线上，皇后就可以攻击另一个）。为了找到这个问题的解，实际上将其推广到任意大小的棋盘更为简单。因此，问题是在\
  \ `N x N` 的棋盘上放置 `N` 个皇后，其中大小 `N` 是任意的。我们将从 1 开始编号，所以 `N x N` 棋盘的左上角坐标为 `(1, 1)`，右下角坐标为\
  \ `(N, N)`。\n\n解决 N 皇后问题，注意你需要在每行中放置一个皇后。因此，你可以在连续的行中放置皇后，每次检查新放置的皇后是否受到已放置皇后的攻击。在搜索过程中，可能会出现需要在第\
  \ `k` 行放置的皇后在 във行的所有区域内都受到从第 1 行到 `k-1` 行皇后的攻击。在这种情况下，你需要终止该部分的搜索，以便继续第 1 到 `k-1`\
  \ 列的不同的皇后配置。\n\n解决此问题的命令式方案会逐一个地放置皇后，并在棋盘上移动它们。但要设计出一个真正尝试所有可能的方案似乎很困难。一种更函数化的方法是将解决方案直接表示为一个值。一个解由坐标列表组成，每个坐标对应棋盘上放置的一个皇后。但请注意，完整的解决方案无法通过一步找到。它需要通过在连续行中占用皇后来逐步构建。\n\
  \n这暗示了一种递归算法。假设你已经生成了在 `N x N` 棋盘上放置 `k` 个皇后的所有解，其中 `k < N`。每个这样的解可以用一个长度为 `k` 的坐标列表\
  \ `(row, column)` 来表示，其中行和列的范围都是 1 到 `N`。\n\n这种算法思想体现在函数 `placeQueens` 中：\n\n```\n\
  def queens(n: Int): List[List[(Int, Int)]] = {\n  def placeQueens(k: Int): List[List[(Int,\
  \ Int)]] =\n    if (k == 0)\n      List(List())\n    else\n      for {\n       \
  \ queens <- placeQueens(k - 1)\n        column <- 1 to n\n        queen = (k, column)\n\
  \        if isSafe(queen, queens)\n      } yield queen :: queens\n\n  placeQueens(n)\n\
  }\n```\n\n上述程序的外部函数 `queens` 只是用棋盘大小 `n` 作为参数调用 `placeQueens`。函数应用 `placeQueens(k)`\
  \ 的任务是在列表中生成所有长度为 `k` 的部分解。列表的每个元素都是一个解，由长度为 `k` 的列表表示。因此 `placeQueens` 返回一个列表的列表。\n\
  \n如果 `placeQueens` 的参数 `k` 为 0，这意味着它需要生成在零行上放置零个皇后的所有解。只有一个这样的解：完全不放置皇后。这个解由空列表表示。因此，如果\
  \ `k` 为 0，`placeQueens` 返回 `List(List())`，这是一个包含单个空元素的列表。请注意，这与空列表 `List()` 完全不同。如果\
  \ `placeQueens` 返回 `List()`，则意味着没有解，而不是一个由不放置皇后组成的单一解。\n\n在 `k` 不为 0 的另一种情况下，`placeQueens`\
  \ 的所有工作通过一个 `for` 表达式完成。该 `for` 表达式的第一个生成器遍历在棋盘上放置 `k-1` 个皇后的所有解。第二个生成器遍历第 k 个皇后可能放置的所有可能的列。`for`\
  \ 表达式的第三部分将新考虑的皇后位置定义为由第 `k` 行和每个生成的列组成的对。`for` 表达式的第四部分是一个过滤器，它通过 `isSafe` 检查新皇后是否免受所有之前皇后的攻击（`isSafe`\
  \ 的定义稍后将讨论）。\n\n\n\n\n如果新皇后没有受到任何其他皇后的攻击，它就可以作为部分解的一部分，因此 `placeQueens` 会为带有 `::`\
  \ 个皇后的皇后生成一个新的解。如果新皇后无法免受攻击，过滤器将返回 `false`，因此不会生成解。\n\n剩余的唯一部分是 `isSafe` 方法，它用于检查给定的皇后是否受到皇后列表中其他任何元素的攻击。以下是它的定义：\n\
  \n```scala\n def isSafe(queen: (Int, Int), queens: List[(Int, Int)]) = \n   queens\
  \ for (q => !inCheck(queen, q))\n\n  def inCheck(q1: (Int, Int), q2: (Int, Int))\
  \ = \n    q1._1 == q2._1 ||  // 在同一行\n    q1._2 == q2._2 ||  // 在同一列\n    (q1._1\
  \ - q2._1).abs == (q1._2 - q2._2).abs // 在对角线上\n```\n\n`isSafe` 方法表示，如果皇后没有受到任何其他皇后的攻击，则它相对于其他皇后是安全的。`inCheck`\
  \ 方法表示皇后 `q1` 和 `q2` 相互攻击。\n\n它在以下三种情况之一返回 `true`：\n\n1. 如果两个皇后具有相同的行坐标，\n2. 如果两个皇后具有相同的列坐标，\n\
  3. 如果两个皇后在同一条对角线上（即它们的行之差和列之差相等）。\n\n第一种情况——即两个皇后具有相同的行坐标——在应用程序中不会发生，因为 `placeQueens`\
  \ 已经处理了将每个皇后放置在不同的行。因此，你可以在不改变程序功能的情况下删除该测试。\n\n### 23.3 使用 for 表达式进行查询\n\n`for`\
  \ 法本质上等同于数据库查询语言的常用操作。例如，假设你有一个名为 `books` 的数据库，它表示为书籍列表，其中 `Book` 的定义如下：\n\n```scala\n\
  \ case class Book(title: String, authors: String*)\n```\n\n这里是一个表示为内存列表的小型示例数据库：\n\
  \n```scala\n val books: List[Book] =\n  List(\n    Book(\n      \"Structure and\
  \ Interpretation of Computer Programs\",\n      \"Abelson, Harold\", \"Sussman,\
  \ Gerald J.\"\n    ),\n    Book(\n      \"Principles of Compiler Design\",\n   \
  \   \"Aho, Alfred\", \"Ullman, Jeffrey\"\n    ),\n    Book(\n      \"Programming\
  \ in Modula-2\",\n      \"Wirth, Niklaus\"\n    ),\n    Book(\n      \"Elements\
  \ of ML Programming\",\n      \"Ullman, Jeffrey\"\n    ),\n    Book(\n      \"The\
  \ Java Language Specification\", \"Gosling, James\",\n      \"Joy, Bill\", \"Steele,\
  \ Guy\", \"Bracha, Gilad\"\n    )\n  )\n```\n\n要查找所有姓 \"Gosling\" 的作者的书籍标题：\n\n\
  ```scala\nscala> for (b <- books; a <- b.authors\n              if a startsWith\
  \ \"Gosling\")\n      yield b.title\nres4: List[String] = List(The Java Language\
  \ Specification)\n```\n\n或者查找所有标题中包含字符串 \"Program\" 的书籍标题：\n\n```scala\nscala> for\
  \ (b <- books if (b.title indexOf \"Program\") >= 0)\n      yield b.title\nres5:\
  \ List[String] = List(Structure and Interpretation of Computer Programs, Programming\
  \ in Modula-2, Elements of ML Programming)\n```\n\n或者查找所有在数据库中写过至少本书的作者名称：\n\n```scala\n\
  scala> for (b1 <- books; b2 <- books if b1 != b2;\n      a1 <- b1.authors; a2 <-\
  \ b2.authors if a1 == a2)\n      yield a1\nres6: List[String] = List(Ullman, Jeffrey,\
  \ Ullman, Jeffrey)\n```\n\n最后一个解决方案仍然并不完美，因为作者会在列表中出现多次。你仍然需要删除重复项。可以通过以下函数实现：\n\
  \n```scala\nscala> def removeDuplicatesA: List[A] = {\n  if (xs.isEmpty) xs\n  else\n\
  \    xs.head :: removeDuplicates(xs.tail.filter(x => x != xs.head))\n}\nremoveDuplicates(res6)\n\
  res7: List[String] = List(Ullman, Jeffrey)\n```\n\n值得注意的是，`removeDuplicates` 方法中的最后一个表达式可以使用\
  \ `for` 表达式等价地表示：\n\n```scala\nxs.head :: removeDuplicates(for (x <- xs.tail if\
  \ x != xs.head) yield x)\n```\n\n### 23.4 for 表达式翻译\n\n每个 `for` 表达式都可以用三个高阶函数 `map`、`flatMap`\
  \ 和 `withFilter` 来表示。本节描述了翻译方案，Scala 编译器也使用该方案。\n\n#### 翻译带有一个生成器的 for 表达式\n\n首先，假设你有一个\
  \ `for` 表达式：\n\n```scala\nfor (x <- expr_1) yield expr_2\n```\n\n其中 `x` 是一个变量。这样的表达式被翻译为：\n\
  \n```scala\nexpr_1.map(x => expr_2)\n```\n\n#### 翻译以生成器和过滤器开头的 for 表达式\n\n现在，考虑将头部生成器与其他元素结合\
  \ `for` 表达式。形式如下的 `for` 表达式：\n\n```scala\nfor (x <- expr_1 if expr_2) yield expr_3\n\
  ```\n\n被翻译为：\n\n```scala\nfor (x <- expr_1 withFilter(x => expr_2)) yield expr_3\n\
  ```\n\n这种翻译产生了一个比原始短一个元素的 `for` 表达式，因为 `if` 被转换成了 `withFilter`。翻译随后继续处理这个生成器，最终你得到：\n\
  \n```scala\nexpr_1 withFilter(x => expr_2).map(x => expr_3)\n```\n\n如果 `seq` 是生成器、定义的任意序列，那么：\n\
  \n```scala\nfor (x <- expr_1 if expr_2; seq) yield expr_3\n```\n\n被翻译为：\n\n```scala\n\
  for (x <- expr_1 withFilter(x => expr_2)) seq\n```\n\n然后翻译继续处理第二个表达式，它再次比原始短一个元素。\n\
  \n#### 翻译以两个生成器开头的 for 表达式\n\n下一个情况处理以两个生成器开头的 `for` 表达式，例如：\n\n```scala\nfor (x\
  \ <- expr_1; y <- expr_2; seq) yield expr_3\n```\n\n再次假设 `seq` 是生成器、定义的任意序列。事实上，`seq`\
  \ 也可能是空的，在这种情况下 `expr_2` 之后没有分号。翻译方案在每情况下都是相同的。上述 `for` 表达式被翻译为 `flatMap` 的应用：\n\
  \n```scala\nexpr_1.flatMap(x => for (y <- expr_2; seq) yield expr_3)\n```\n\n这一次，传递给\
  \ `flatMap` 的函数值中另一个 `for` 表达式。该 `for` 表达式（再次比原始短一个元素）按相同的规则翻译。\n\n目前为止的三个翻译方案足以翻译所有仅包含生成器和过滤器的\
  \ `for` 表达式，生成器仅绑定简单变量。例如 23.3 节中的“查找所有出版至少两本书的作者”查询：\n\n```scala\nfor (b1 <- books;\
  \ b2 <- books if b1 != b2;\n      a1 <- b1.authors; a2 <- b2.authors if a1 == a2)\n\
  \  yield a1\n```\n\n该查询翻译为以下 map/flatMap/filter 组合：\n\n```scala\nbooks.flatMap(b1\
  \ =>\n  books.withFilter(b2 => b1 != b2).flatMap(b2 =>\n    b1.authors.flatMap(a1\
  \ =>\n      b2.authors.withFilter(a2 => a1 == a2).map(a2 =>\n        a1))))\n```\n\
  \n目前给出的翻译方案尚未处理绑定整个模式而非简单变量的生成器。它还没有涵盖定义（definitions）。这两个方面将在接下来的两个子节中解释。\n\n####\
  \ 翻译生成器中的模式\n\n如果生成器的左侧不是简单变量，而是模式 `pat`，则翻译方案将变得更加复杂。`for` 表达式绑定变量元组的情况仍然相对容易处理。在这种情况下，与单个变量的方案几乎相同。\n\
  \n形式如下的 `for` 表达式：\n\n```scala\nfor ((x, y, ...) <- expr_1) yield expr_2\n```\n\n\
  被翻译为：\n\n```scala\nexpr_1.map { case (x, y, ...) => expr_2 }\n```\n\n\n如果生成器的左侧是一个任意模式\
  \ `pat` 而不是单个变量或元组，情况就会变得复杂一些。\n\n在这种情况下：\n\n```\n for (pat <- expr_1) yield expr_2\n\
  ```\n\n翻译为：\n\n```\n expr_1 withFilter {\n  case pat => true\n  case _ => false\n\
  } map { \n  case pat => expr_2\n}\n```\n\n也就是说，生成的项首先经过过滤，只有匹配 `pat` 的项才会被映射（map）。因此，可以保证模式匹配生成器永远不会抛出\
  \ `MatchError`。\n\n这里的方案只处理了 `for` 表达式包含单个模式匹配生成器的情况。如果 `for` 表达式包含其他生成器、过滤器或定义，则适用类似的规则。由于这些额外规则没有提供太新的见解，因此在本文中被省略了。如果你感兴趣，可以在\
  \ *Scala 语言规范* [[Ode11]](#bibliography.html_sls) 中查找。\n\n#### 翻译定义\n\n最后一个缺失的情况是\
  \ `for` 表达式包含了嵌入定义。这是一个典型案例：\n\n```\n for (null <- expr_1; null = expr_2; seq) yield\
  \ expr_3\n```\n\n再次假设 `seq` 是一个（可能为空的）生成器、定义和过滤器序列。该表达式翻译为：\n\n```\n for ((null,\
  \ null) <- for (null <- expr_1) yield (null, expr_2); seq) \n  yield expr_3\n```\n\
  \n你可以看到，每当生成一个新的 `x` 值时，`expr_2` 都会被求值。重新评估是必要的，因为 `expr_2` 可能引用 `x`，因此需要根据 `x`\
  \ 值的改变进行重新评估。对于程序员来说，结论是：在 `for` 表达式中嵌入未引用前面的生成器绑定变量的定义可能不是一个好主意，因为重新评估此类表达式将浪费资源。例如，与其写：\n\
  \n```\n for (x <- 1 to 1000; y = expensiveComputationNotInvolvingX)\n  yield x *\
  \ y\n```\n\n通常最好写成：\n\n```\n val y = expensiveComputationNotInvolvingX\n  for (x\
  \ <- 1 to 1000) yield x * y\n```\n\n### 翻译 for 循环\n\n之前的章节展示了包含 `yield` 的 `for`\
  \ 表达式是如何翻译的。那么仅仅执行副作用而不返回任何内容的 `for` 循环呢？它们的翻译与 `for` 表达式类似，但更简单。原则上，只要之前的翻译方案在翻译中使用了\
  \ `map` 或 `flatMap`，`for` 循环的翻译方案就只使用 `foreach`。\n\n例如，表达式：\n\n```\n for (null <-\
  \ expr_1) body\n```\n\n翻译为：\n\n```\n expr_1 foreach (null => body)\n```\n\n一个较大的示例是表达式：\n\
  \n```\n for (null <- expr_1; if expr_2; null <- expr_3) body\n```\n\n该表达式翻译为：\n\n\
  ```\n expr_1 withFilter (null => expr_2) foreach (null =>\n  expr_3 foreach (null\
  \ => body))\n```\n\n例如，以下表达式累加了以列表列表表示的矩阵的所有元素：\n\n```\n var sum = 0\n  for (xs\
  \ <- xss; x <- xs) sum += x\n```\n\n该循环被翻译为两个嵌套的 `foreach` 应用：\n\n```\n var sum\
  \ = 0\n  xss foreach (xs => \n    xs foreach (x =>\n      sum += x))\n```\n\n###\
  \ 23.5 反过来\n\n上一节展示了 `for` 表达式可以翻译为高阶函数 `map`、`flatMap` 和 `withFilter` 的应用。事实上，你完全可以反过来操作：每一个\
  \ `map`、`flatMap` 或 `filter` 的应用都可以表示为一个 `for` 表达式。\n\n这里是使用 `for` 表达式实现的这三个方法。这些方法包含在一个\
  \ `Demo` 对象中，以与与 `Lists` 的标准操作区分来。具体来说，这三个函数都接受 `List` 作为参数，但翻译方案同样适用于其他集合类型：\n\n\
  ```\n object Demo {\n  def mapA, B: List[B] =\n    for (x <- xs) yield f(x)\n\n\
  \  def flatMapA, B: List[B] =\n    for (x <- xs; y <- f(x)) yield y\n\n  def filter(xs:\
  \ List[A], p: A => Boolean): List[A] =\n    for (x <- xs) if p(x) yield x\n}\n```\n\
  \n\n\n\n在上面的类 `C` 中，`withFilter` 方法会产生一个相同类型的新集合。这意味着每次调用 `withFilter` 都会创建一个新的\
  \ `C` 对象，这与 `filter` 的原理相同。现在，在 `for` 表达式的转换中，对 `withFilter` 的任何调用总是紧跟着对其他三个方法之一的调用。因此，由\
  \ `withFilter` 创建的对象会立即被后续的某个方法拆解。如果类 `C` 的对象很大（例如长序列），你可能想避免创建这种中间中间对象。一种标准技术是让\
  \ `withFilter` 返回的不是一个 `C` 对象，而仅仅是一个包装对象，该对象会“记住”在进一步处理之前需要对元素进行过滤。\n\n仅关注类 `C`\
  \ 的前三个函数，以下事实值得注意。在函数式编程中，有一个通用的概念被称为 **monad（单子）**，它可以解释许多带有计算的类型，范围涵盖了从集合到带有状态和\
  \ I/O 的计算、回溯计算以及事务等。你可以在 monad 上构建函数 `map`、`flatMap` 和 `withFilter`，如果你这样做了，它们的类型最终与此处给出的完全一致。\n\
  \n此外，你可以通过 `map`、`flatMap` 和 `withFilter` 加上一个从元素值产生 monad 的“unit”构造函数来表征每个 monad。在面向对象的语言中，这个“unit”构造函数简单来说实例构造函数或工厂方法。因此，`map`、`flatMap`\
  \ 和 `withFilter` 可以被视为函数式概念 monad 的面向对象版本。因为 `for` 表达式等同于这三个方法的应用，它们可以被视为 monad\
  \ 的语法。\n\n这一切表明，`for` 表达式的概念比仅仅对集合进行迭代要通用得多，事实也如此。例如，`for` 表达式在异步 I/O 中起着重要作用，或者作为可选值（optional\
  \ values）的替代表示。在 Scala 库中留意 `map`、`flatMap` 和 `withFilter` 的出现——当它们存在时，`for` 表达式本身就是操作该类型元素的一种简洁方式。\n\
  \n### 23.7 总结\n\n在本章中，你领略了 `for` 表达式和 `for` 循环的内部机制。你学习了它们是如何翻译为一组标准的高阶方法调用的。结果，你发现\
  \ `for` 表达式实际上比仅仅对集合迭代要通用得多，而且你可以设计自己的类来支持它们。\n\n# 第 24 章\n\n## 深入理解集合\n\nScala\
  \ 包含一个优雅且强大的集合库。尽管集合 API 初看之下很微妙，但它对你的编程风格可能带来的改变是深远的。很多时候，感觉就像你是在更高层级上工作，程序的阶构建块是整个集合而不是它们的元素。这种新的编程风格需要一些适应。幸运的是，Scala\
  \ 集合的几个优良特性有助于这种适应。它们既易于使用、简洁、安全、快速且通用。\n\n- **易于使用：** 只有二十到五十个方法的小型词汇量就足以在几次操作内解决大多数集合问题。不需要理解复杂的循环结构或递归。持久化集合（Persistent\
  \ collections）和无副作用的操作意味着你不需要担心新数据意外损坏现有集合。迭代器与集合更新之间的干扰被消除了。\n- **简洁：** 你可以用一个单词完成过去需要一个或多个循环的工作。你可以用轻量级语法表达函数式操作，并轻松地组合这些操作，使得结果感觉像一种自定义的代数。\n\
  - **安全：** 这一点必须亲身体会。Scala 集合的静态类型化和函数式特性意味着你可能犯的绝大多数错误在编译时被捕获。原因是：(1) 集合操作本身被频繁使用并经过了良好的测试。(2)\
  \ 集合操作的使用将输入和输出作为函数参数和结果显式化。(3) 这些显式的输入输出受到静态类型检查。底线是，绝大多数误用都会表现为类型错误。一个几百行的程序第一次尝试就能运行的情况并不罕见。\n\
  - **快速：** 集合操作在库中经过调优和优化。因此，使用集合通常是非常高效的。你可能通过仔细手工调优的数据结构和操作做得更好，但你也可能在过程中做出某些次优的实现决策导致结果糟糕得多。此外，集合已经适应了多核心并行执行。并行集合（Parallel\
  \ collections）支持与顺序集合相同的操作，因此不需要学习新操作，也不需要重写代码。你只需调用 `par` 方法即可将顺序集合转换为并行集合。\n-\
  \ **通用：** 集合在任何有意义的类型上提供相同的操作。因此，你可以用很小的操作词汇实现很多功能。例如，字符串在概念上是字符序列。因此，在 Scala 集合中，字符串支持所有序列操作。数组也是如此。\n\
  \n本章从用户的角度深入描述了 Scala 集合类的 API。你可能已经在 第 17 章 中看过了对集合库的快速导览。本章将带你进行一次更详细详尽的导览，展示所有的集合类以及它们定义的所有方法，因此它包含了使用\
  \ Scala 集合所需要的所有知识。展望未来，第 25 章 将专注于库的架构和扩展性方面，面向实现新集合类型的人员。\n\n### 24.1 可变与不可变集合\n\
  \n正如你现在所知的，Scala 集合系统地区分了可变（mutable）和不可变（immutable）集合。可变集合可以在原地更新或扩展。这意味着你可以为了副作用改变、添加或删除元素。相比之下，不可变集合永远改变。你仍然拥有模拟添加、删除或更新的操作，但这些操作每次都会返回一个新的集合，并保持旧集合不变。\n\
  \n\n\n\n\n`scala.collection` 包中的集合可以是可变的，也可以是不可变的。例如，`scala.collection.IndexedSeq[T]`\
  \ 是 `scala.collection.immutable.IndexedSeq[T]` 及其可变兄弟类 `scala.collection.mutable.IndexedSeq[T]`\
  \ 的共同父 trait。通常情况下，`scala.collection` 包中的根集合定义的与不可变集合相同的接口。通常，`scala.collection.mutable`\
  \ 包中的可变集合会在此不可变接口的基础上，添加一些具有副作用的修改操作。\n\n根集合与不可变集合之间的区别在于，不可变集合的客户端可以保证没有人能变动该集合，而根集合的客户端只知道他们不能更改该集合。尽管此类集合的静态类型没有提供修改集合的操作，但其运行时类型仍然可能是一个可以被其他客户端所修改的的可变集合。\n\
  \n默认情况下，Scala 总是选择不可变集合。例如，如果你只写 `Set` 而不带任何前缀，或者在没有导入任何内容的情况下，你将得到一个不可变集合；如果你写\
  \ `Iterable`，你将得到一个不可变迭代器，因为这些是从 `scala` 包导入的默认绑定。要获取可变的默认版本，你需要显式地写 `collection.mutable.Set`\
  \ 或 `collection.mutable.Iterable`。\n\n集合层次结构中的最后一个包是 `collection.generic`。该包包含了实现集合的构建模块。通常，集合类会将其某些操作的实现推迟到\
  \ `generic` 中的类。另一方面，集合框架的日常用户只有在特殊情况下才需要引用 `generic` 中的类。\n\n```\n Traversable\n\
  \      Iterable\n          Seq\n              IndexedSeq\n                  Vector\n\
  \                  ResizableArray\n                  GenericArray\n            \
  \  LinearSeq\n                  MutableList\n                  List\n          \
  \        Stream\n              Buffer\n                  ListBuffer\n          \
  \        ArrayBuffer\n          Set\n              SortedSet\n                 \
  \ TreeSet\n              HashSet (mutable)\n              LinkedHashSet\n      \
  \        HashSet (immutable)\n              BitSet\n              EmptySet, Set1,\
  \ Set2, Set3, Set4\n          Map\n              SortedMap\n                  TreeMap\n\
  \              HashMap (mutable)\n              LinkedHashMap (mutable)\n      \
  \        HashMap (immutable)\n              EmptyMap, Map1, Map2, Map3, Map4\n```\n\
  \n## 集合层次结构。\n\n### 24.2 集合的一致性\n\n图 24.1 中展示了最重要的集合类。这些类之间有许多共同点。例如，每种集合都可以通过相同的统一语法创建，即编写集合类名后跟其元素：\n\
  \n```\n Traversable(1, 2, 3)\n  Iterable(\"x\", \"y\", \"z\")\n  Map(\"x\" -> 24,\
  \ \"y\" -> 25, \"z\" -> 26)\n  Set(Color.Red, Color.Green, Color.Blue)\n  SortedSet(\"\
  hello\", \"world\")\n  Buffer(x, y, z)\n  IndexedSeq(1.0, 2.0)\n  LinearSeq(a, b,\
  \ c)\n```\n\n同样的原理也适用于特定的集合实现：\n\n```\n List(1, 2, 3)\n  HashMap(\"x\" -> 24, \"\
  y\" -> 25, \"z\" -> 26)\n```\n\n所有集合的 `toString` 方法都会产生如所示的输出，格式为类型名称后跟括号中的集合元素。所有集合都支持\
  \ `Traversable` 提供的 API，但它们的方法都返回它们自己的类，而不是根类 `Traversable`。例如，`List` 的 `map` 方法的返回类型为\
  \ `List`，而 `Set` 的 `map` 方法的返回类型为 `Set`。因此，这些方法的静态返回类型相当精确：\n\n```\nscala> List(1,\
  \ 2, 3) map (_ + 1)\n  res0: List[Int] = List(2, 3, 4)\n\n  scala> Set(1, 2, 3)\
  \ map (_ * 2)\n  res1: scala.collection.immutable.Set[Int] = Set(2, 4, 6)\n```\n\
  \n相等性对所有集合类也是统一组织的；更多信息请参阅 第 24.13 节。\n\n图 24.1 中的大多数类以三种变体存在：根、可变和不可变。唯一的例外是 `Buffer`\
  \ trait，它只作为可变集合存在。\n\n在本章的剩余部分，我们将逐一回顾这些类。\n\n## 24.3 Trait Traversable\n\n集合层次结构的顶端是\
  \ trait `Traversable`。它唯一的抽象操作是 `foreach`：\n\n```\n def foreachU\n```\n\n实现 `Traversable`\
  \ 的集合类只需要定义此方法；所有其他方法都可以从 `Traversable` 继承。\n\n`foreach` 方法旨在遍历集合的所有元素，并对每个元素应用给定的操作\
  \ `f`。操作的类型是 `Elem => U`，其中 `Elem` 是集合元素的类型，`U` 是任意的结果类型。对 `f` 的调用仅用于副作用；事实上，`f`\
  \ 的任何结果都会被丢弃。\n\n`Traversable` 还定义了许多具体方法，它们都列在 表 24.1 中。这些方法分为以下类别：\n\n*   **加法**：`++`，将两个可遍历集合合并，或者将迭代器的所有添加到可遍历集合中。\n\
  *   **Map 操作**：`map`、`flatMap` 和 `collect`，通过对元素应用某些函数产生新的集合。\n*   **转换**：`toIndexedSeq`、`toIterable`、`toStream`、`toArray`、`toList`、`toSet`\
  \ 和 `toMap`，将 `Traversable` 转换为更具体的集合。如果接收者已经已经是所请求集合。例如，对列表应用 `toList` 将返回列表本身。\n\
  *   **复制**：`copyToBuffer` 和 `toArray`。正如名称所示，这些将元素复制到缓冲区或数组。\n*   **大小操作**：`isEmpty`、`nonEmpty`、`size`\
  \ 和 `hasDefiniteSize`。可遍历集合可以是有限的或无限的。无限可遍历集合的示例是自然数流 `Stream.from(0)`。`hasDefiniteSize`\
  \ 方法指示集合是否无限。如果 `hasDefiniteSize` 返回 `true`，则集合是有限的。如果返回 `false`，则集合可能是无限的，此时 `size`\
  \ 将产生错误或不返回。\n*   **元素检索**：`head`、`last`、`headOption`、`lastOption` 和 `find`。这些选择集合的第一个或最后一个元素，或者符合条件的第一个元素。然而，请注意并非所有集合对“第一个”和“最后一个”都有良好的定义。例如，哈希集合可能根据哈希键存储元素，哈希可能随运行而变化。在这种情况下，哈希集合的“第一个”元素在不同的运行中也可能不同。如果集合总是以相同的顺序输出元素，则它是有序的。大多数集合是有序的，但有些（如哈希集合）不是——放弃排序可以提供额外的效率。这就是为什么\
  \ Scala 集合为所有集合类型提供了有序替代方案。例如，`HashSet` 的有序替代方案是 `LinkedHashSet`。\n*   **子集合检索**：`takeWhile`、`tail`、`init`、`slice`、`take`、`drop`、`filter`、`dropWhile`、`filterNot`\
  \ 和 `withFilter`。这些都根据索引范围或谓词返回某些子集合。\n*   **划分操作**：`splitAt`、`span`、`partition`\
  \ 和 `groupBy`，它们将此集合的元素划分为若干个子集合。\n*   **元素测试**：`exists`、`forall` 和 `count`，它们使用给定的谓词对元素进行测试。\n\
  \n\n\n\n\n- **折叠 (Folds)**: `foldLeft`, `foldRight`, `/:`, `:\\`, `reduceLeft`,\
  \ `reduceRight`，它们对连续元素应用二元操作。\n- **特定的折叠**: `sum`, `product`, `min` 和 `max`，它们作用于特定类型（数值或可比较类型）的集合。\n\
  - **字符串操作**: `mkString`, `addString` 和 `stringPrefix`，它们提供了将集合转换为字符串的替代方法。\n- **视图操作\
  \ (View operations)**: 由 `view` 方法的两个重载变体组成。`view` 是一个惰性求值的集合。你将在第 24.14 节中学习更多关于视图的内容。\n\
  \n### Traversable trait 中的操作\n\n| 定义 | 作用 |\n| --- | --- |\n| 抽象方法: | |\n| `xs foreach\
  \ f` | 对 `xs` 的每一个元素执行函数 `f`。 |\n| 加法: | |\n| `xs ++ ys` | 一个包含 `xs` 和 `ys` 所有元素的集合。`ys`\
  \ 是一个 `TraversableOnce` 集合，*即*要么是 `Traversable` 要是 `Iterator`。 |\n| 映射 (Maps): |\
  \ |\n| `xs map f` | 通过将函数 `f` 应用于 `xs` 中的每一个元素而得到的集合。 |\n| `xs flatMap f` | 通过将集合值函数\
  \ `f` 应用于 `xs` 中的每一个元素并拼接结果得到的集合。 |\n| `xs collect f` | 通过将偏函数 `f` 应用于 `xs` 中其定义的每一个元素并收集结果得到的集合。\
  \ |\n| 转换 (Conversions): | |\n| `xs.toArray` | 将集合转换为数组。 |\n| `xs.toList` | 将集合转换为列表。\
  \ |\n| `xs.toIterable` | 将集合转换为可迭代对象。 |\n| `xs.toSeq` | 将集合转换为序列。 |\n| `xs.toIndexedSeq`\
  \ | 将集合转换为索引序列。 |\n| `xs.toStream` | 将集合转换为流（一种惰性计算的序列）。 |\n| `xs.toSet` | 将集合转换为集合。\
  \ |\n| `xs.toMap` | 将键/值对集合转换为映射。 |\n| 复制 (Copying): | |\n| `xs copyToBuffer buf`\
  \ | 将集合的所有元素复制到缓冲区 `buf`。 |\n| `xs copyToArray(arr, s, len)` | 拷贝 `arr` 中从索引 `s`\
  \ 开始的最多 `len` 个元素。最后两个参数是可选的。 |\n| 大小信息: | |\n| `xs.isEmpty` | 测试集合是否为空。 |\n| `xs.nonEmpty`\
  \ | 测试集合是否包含元素。 |\n| `xs.size` | 集合中元素的数量。 |\n| `xs.hasDefiniteSize` | 如果 `xs` 已知具有有限大小，则为\
  \ `true`。 |\n| 元素检索: | |\n| `xs.head` | 集合的第一个元素（如果没有定义顺序，则为某个元素）。 |\n| `xs.headOption`\
  \ | 以 option 值的形式返回 `xs` 的第一个元素，如果 `xs` 为空则返回 `None`。 |\n| `xs.last` | 集合的最后一个元素（如果没有定义顺序，则为某个元素）。\
  \ |\n| `xs.lastOption` | 以 option 值的形式返回 `xs` 的最后一个元素，如果 `xs` 为空则返回 `None`。 |\n\
  | `xs find p` | 返回一个包含 `xs` 中满足 `p` 的第一个元素的 option，如果没有元素符合条件则返回 `None`。 |\n| 子集合\
  \ (Subcollections): | |\n| `xs.tail` | 除去 `xs.head` 之外的集合剩余部分。 |\n| `xs.init` |\
  \ 除去 `xs.last` 之外的集合剩余部分。 |\n| `xs slice (from, to)` | 一个由 `xs` 某些索引范围内的元素组成的集合（从\
  \ `from` 开始，但不包括 `to`）。 |\n| `xs take n` | 一个由 `xs` 前 `n` 个元素组成的集合（如果没有定义顺序，则为任意\
  \ `n` 个元素）。 |\n| `xs drop n` | 除去 `xs take n` 之外的集合剩余部分。 |\n| `xs takeWhile p` |\
  \ 集合中所有满足 `p` 的元素的最长前缀。 |\n| `xs dropWhile p` | 去掉所有满足 `p` 的元素的最长前缀后的集合。 |\n| `xs\
  \ filter p` | 由 `xs` 中满足谓词 `p` 的元素组成的集合。 |\n| `xs withFilter p` | 对 `xs` 的非严格过滤。\
  \ |\n| 细分 (Subdivisions): | |\n| `xs.splitAt(n)` | 在某个位置拆分 `xs`，给出一对集合（`xs.take\
  \ n`, `xs.drop n`）。 |\n| `xs.span p` | 根据谓词拆分 `xs`（`xs.takeWhile p`, `xs.dropWhile\
  \ p`）。 |\n| `xs.partition p` | 将 `xs` 拆分为两个集合：一个满足 `p`，另一个不满足。 |\n| `xs.groupBy\
  \ f` | 根据 `f` 将 `xs` 分类并一个包含集合的映射。 |\n| 元素条件: | |\n| `xs.forall p` | 一个布尔值，表示 `p`\
  \ 是否对 `xs` 的所有元素成立。 |\n| `xs.exists p` | 一个布尔值，表示 `p` 是否对 `xs` 中的某些元素成立。 |\n| `xs.count\
  \ p` | `xs` 中满足 `p` 的元素数量。 |\n| 折叠: | |\n| `(z /:) xs` | 同 `foldRight`。 |\n| `(z\
  \ <<) xs` | 同 `foldLeft`。 |\n\n### 24.4 Iterable trait\n\n图 24.1 顶部的下一个 trait 是\
  \ `Iterable`。该 trait 中的所有方法都是根据一个抽象方法 `iterator` 定义的，该方法逐个产生集合元素。从 `Traversable`\
  \ 继承的抽象 `foreach` 方法在 `Iterable` 中通过 `iterator` 实现。这里是具体的实现代码：\n\n```\ndef foreachU:\
  \ Unit = {\n  val it = iterator\n  while (it.hasNext) f(it.next())\n}\n```\n\n`Iterable`\
  \ 的许多子类都重写了 `Iterable` 中这种标准的 `foreach` 实现，因为它们可以提供更高效的实现。记住 `foreach` 是 `Traversable`\
  \ 中所有操作实现的基础，因此它的性能至关重要。\n\n`Iterable` 中还有两个返回迭代器的方法：`grouped` 和 `sliding`。然而，这些迭代器返回的不是单个元素，而是元素的整个子序列。这些子序列的最大长度作为这些方法的参数给出。它们之间的区别通过查看以下解释器交互将变得清晰：\n\
  \n\n\n\n\n```\nscala> val xs = List(1, 2, 3, 4, 5)\n  xs: List[Int] = List(1, 2,\
  \ 3, 4, 5)\n\n  scala> val git = xs grouped 3\n  git: Iterator[List[Int]] = non-empty\
  \ iterator\n\n  scala> git.next()\n  res2: List[Int] = List(1, 2, 3)\n\n  scala>\
  \ git.next()\n  res3: List[Int] = List(4, 5)\n\n  scala> val sit = xs sliding 3\n\
  \  sit: Iterator[List[Int]] = non-empty iterator\n\n  scala> sit.next()\n  res4:\
  \ List[Int] = List(1, 2, 3)\n\n  scala> sit.next()\n  res5: List[Int] = List(2,\
  \ 3, 4)\n\n  scala> sit.next()\n  res6: List[Int] = List(3, 4, 5)\n```\n\n`Iterable`\
  \  true 增加了其他方法到 `Traversable` 中，这些方法只有在可用迭代器时才能被高效实现。它们总结在 表 24.2 中：\n\n##### 特性\
  \ `Iterable` 中的操作\n\n| 什么是 | 它的作用 |\n\n| --- | --- |\n| 抽象方法: |  |\n| `xs.iterator`\
  \ | 一个产生 `xs` 中每个元素的迭代器，顺序与 `foreach` 遍历元素的顺序相同 |\n| 其他迭代器: |  |\n| `xs.grouped\
  \ size` | 一个产生该集合的固定大小“块”的迭代器 |\n| `xs.sliding size` | 一个产生该集合中滑动固定大小窗口元素的迭代器 |\n\
  | 子集合: |  |\n| `xs.takeRight n` | 一个由 `xs` 的最后 `n` 个元素组成的集合（或者，如果没有定义顺序，则为任意的 `n`\
  \ 个元素） |\n| `xs.dropRight n` | 除去 `xs.takeRight n` 之外的集合剩余部分 |\n| 拉链 (Zippers):\
  \ |  |\n| `xs.zip ys` | 来自 `xs` 和 `ys` 对应元素的对的迭代器 |\n| `xs.zipAll (ys, x, y)` |\
  \ 来自 `xs` 和 `ys` 对应元素的对的迭代器，其中较短的序列通过追加元素 `x` 或 `y` 来匹配较长的序列 |\n| `xs.zipWithIndex`\
  \ | 来自 `xs` 的元素及其索引的对对的迭代器 |\n| 比较: |  |\n| `xs.sameElements ys` | 测试 `xs` 和 `ys`\
  \ 是否包含相同顺序的相同元素 |\n\n#### 为什么同时拥有 `Traversable` 和 `Iterable`？\n\n你可能会疑惑为什么额外的 `Traversable`\
  \ 特性在 `Iterable` 之上。我们不能仅通过迭代器完成一切吗？那么，拥有一个用 `foreach` 而不是 `iterator` 来定义其方法的更抽象的特性意义何在？`Traversable`\
  \ 的原因之一是，有时提供 `foreach` 的实现比提供 `iterator` 的实现更简单或更高效。这里有一个简单的例子。假设你想为一种叶子节点为整数元素的二叉树设计一个类层次结构。你可以这样设计这个层次结构：\n\
  \n```\nsealed abstract class Tree\n  case class Branch(left: Tree, right: Tree)\
  \ extends Tree\n  case class Node(elem: Int) extends Tree\n```\n\n现在假设你想让树变为可遍历的。为了这一点，让\
  \ `Tree` 继承自 `Traversable[Int]` 并定义如下的 `foreach` 方法：\n\n```scala\nsealed abstract\
  \ class Tree extends Traversable[Int] {\n  def foreachU = this match {\n    case\
  \ Node(elem) => f(elem)\n    case Branch(l, r) => l foreach f; r foreach f\n  }\n\
  }\n```\n\n这并不难，而且非常高效——遍历平衡树所需的时间与树中元素的数量成正比。为了理解这一点，考虑对于具有 `N` 个叶子节点的平衡树，你有 `N\
  \ - 1` 个 `Branch` 类的内部节点。因此，遍历树的总步骤数为 `N + N - 1`。\n\n现在，将其与让树变为迭代进行对比。这样做，让 `Tree`\
  \ 继承自 `Iterable[Int]` 并定义如下的 `iterator` 方法：\n\n```scala\nsealed abstract class Tree\
  \ extends Iterable[Int] {\n  def iterator: Iterator[Int] = this match {\n    case\
  \ Node(elem) => yield elem\n    case Branch(l, r) => l.iterator ++ r.iterator\n\
  \  }\n}\n```\n*(等待，提供的输入文本在最后一个区块是乱码/损坏的，我根据标准的 Scala 模式在保持提示中提供的语义意图的同时清理了逻辑).*\n\
