  \n顺便提一下，请注意当使用 Java 反射查看时，方法位于 `Tests$` 类中，而不是 `Tests` 类。正如章节开头所述，Scala 单例对象的实现被放置在一个在名称末尾添加了美元符号\
  \ `$` 的 Java 类中。在这种情况下，`Tests` 的实现位于 Java 类 `Tests$` 中。\n\n请注意，当你使用 Java 注解（annotations）时，必须考虑它们的局限性。例如，在注解的参数中，你只能使用常量而不能使用表达式。你可以支持\
  \ `@serial(1234)`，但不支持 `@serial(x * 2)`，因为 `x * 2` 不是常量。\n\n### 31.3 通配符类型\n\n所有的\
  \ Java 类型都有对应的 Scala 类型。这是为了让 Scala 代码能够访问任何合法的 Java 类。大多数情况下，这种转换是直观的。Java 中的 `Pattern`\
  \ 在 Scala 中对应为 `Pattern`，Java 中的 `Iterator<Component>` 在 Scala 中是 `Iterator[Component]`。但在某些情况下，你到目前为止看到的\
  \ Scala 类型是不够的。Java 通配符类型（如 `Iterator<?>` 或 `Iterator<? extends Component>`）可以做什么？对于省略了类型参数的\
  \ `Iterator` 等原始类型（raw types），又可以做什么？对于 Java 通配符类型和原始类型，Scala 使用了一种额外的类型，也称为 `*wildcard\
  \ type`。\n\n通配符类型使用“占位符语法”（placeholder syntax）编写，就像 第 8.5 节 中描述的短函数字面量一样。在函数字面量的简写中，你可以使用下划线\
  \ `_` 代替表达式；例如，`(_ + 1)` 等于 `(x => x + 1)`。通配符类型使用了相同的思想，只是针对类型而非表达式。如果你编写 `Iterator[_]`，那么下划线替换了一个类型。这种类型表示一个元素类型未知的\
  \ `Iterator`。\n\n在使用这种占位符语法时，你还可以插入上界和下界。只需在下划线后添加边界即可，使用与类型参数相同的 `<:` 语法（参见 第 19.8\
  \ 节 和 第 19.5 节）。例如，类型 `Iterator[_ <: Component]` 是一个元素类型未知的迭代器，但无论是什么类型，它必须是 `Component`\
  \ 的子类型。\n\n这就是编写通配符类型的方法，但如何使用它呢？在简单的情况下，你可以忽略通配符并在基类类型上调用方法。例如，假设你有如下 Java 类：\n\
  \n```java\n // 这是一个带有通配符的 Java 类\n public class Wild {\n  public Collection<?> contents()\
  \ {\n    Collection<String> stuff = new Vector<String>();\n    stuff.add(\"a\");\n\
  \    stuff.add(\"b\");\n    stuff.add(\"see\");\n    return stuff;\n  }\n}\n```\n\
  \n如果你在 Scala 代码中访问它，你会发现它有一个通配符类型：\n\n```\nscala> val contents = (new Wild).contents\n\
  \  contents: java.util.Collection[_] = [a, b, see]\n```\n\n如果你想知道这个集合中有多少元素，可以简单地忽略通配符部分并像往常一样调用\
  \ `size` 方法：\n\n```\nscala> contents.size()\n  res0: Int = 3\n```\n\n在更复杂的情况下，通配符类型可能会更麻烦。由于通配符类型没有名称，因此没有办法在两个独立的地方使用它。例如，假设你想创建一个可变的\
  \ Scala 集合，并用 `contents` 中的元素初始化它：\n\n```scala\nimport scala.collection.mutable\n\
  \  val iter = (new Wild).contents.iterator\n  val set = mutable.Set.empty[???] \
  \    // 这里应该放什么类型？\n  while (iter.hasMore)\n    set += iter.next()\n```\n\n在第三行出现了问题。由于无法为\
  \ Java 集合中的元素类型命名，因此你无法为 `set` 写出一个令人满意的类型。为了解决这类问题，这里有两个你应该考虑的技巧：\n\n1. 当将通配符类型传递给方法时，为该方法提供一个参数作为占位符。现在你有了该类型的名称，可以根据需要多次使用。\n\
  2. 不要从方法返回通配符类型，而是返回一个对每个占位符类型都具有抽象成员的对象。（有关抽象成员的信息请参见 第 20 节。）\n\n结合使用这两个技巧，之前的代码可以写如下：\n\
  \n```scala\nimport scala.collection.mutable\n  import java.util.Collection\n\n \
  \ abstract class SetAndType {\n    type Elem\n    val set: mutable.Set[Elem]\n \
  \ }\n\n  def ScalaSetT: SetAndType = {\n    val iter = jset.iterator\n    while\
  \ (iter.hasMore)\n      set += iter.next()\n\n    return new SetAndType {\n    \
  \  type Elem = T\n    }\n  }\n```\n\n你可以看出为什么 Scala 通常不使用通配符类型。为了对它们进行操作，你倾向于使用抽象成员。因此你完全可以使用抽象成员。\n\
  \n### 31.4 编译 Scala 和 Java\n\n通常在编译依赖 Java 的 Scala 时，你首先构建 Scala 代码。然后使用 Scala 文件编译\
  \ Java 代码。这是不正确的，因为对于依赖 Scala 的 Java 构建，你应该编译 Java 源文件。\n\n以下是一个典型的命令序列：\n\n```\n\
  \ $ scalac -d bin Analysis.scala Item.java\n $ javac -cp bin Item.java Management.java\n\
  \ $ scala -cp bin Management\n  Most expensive item = sprocket(4.99)\n```\n\n###\
  \ 31.5 Scala 2.12 中的 Java 8\n\nJava 8 对 Java 语言和字节码进行了一些改进，Scala 在 2.12 版本利用了这些改进。3\
  \ 通过利用 Java 8 的新特性，Scala 2.12 编译器可以生成更小的类和 jar 文件，并提高 trait 的二进制兼容性。\n\n#### 表达式与\
  \ SAM 类型\n\n从 Scala 程序员的角度来看，Scala 2.12 中可见的 Java 8 相关增强是 Scala 函数字面量可以像 Java 8\
  \ Lambda 表达式一样作为匿名类表达式的简洁形式。在 Java 8 之前，Java 程序员通常定义匿名内部类实例如下：\n\n```java\nJButton\
  \ button = new JButton(); // 这是 Java\n  button.addActionListener(\n    new ActionListener()\
  \ {\n      public void actionPerformed(ActionEvent event) {\n        System.out.println(\"\
  pressed!\");\n      }\n    }\n  );\n```\n\n在这个示例中，创建了一个 `ActionListener` 的匿名实例并将其传递给\
  \ Swing `JButton` 的 `addActionListener` 方法。当用户点击按钮时，Swing 将调用该实例的 `actionPerformed`\
  \ 方法，从而打印出“pressed!”。\n\n在 Java 8 中，任何需要仅包含单个抽象方法（SAM）的类或接口实例的地方，都可以使用 Lambda 表达式。`ActionListener`\
  \ 就是这样一个接口，因为它只包含一个抽象方法 `actionPerformed`。因此，可以使用 Lambda 表达式在 Swing 按钮上注册动作监听器。\n\
  \n\n\n\n\n```java\nJButton button = new JButton();  // 这是 Java 8 代码\n  button.addActionListener(\n\
  \    event -> System.out.println(\"pressed!\")\n  );\n```\n\n在 `Scala` 中，你也可以在相同的情况下使用匿名内部类实例，但你可能倾向于使用函数字面量，如下：\n\
  \n```scala\n val button = new JButton\n  button.addActionListener( \n    _ => println(\"\
  pressed!\")\n  )\n```\n\n正如你已经在第 21.1 节中看到的，你可以通过定义从 `ActionEvent` `=>` `Unit` 函数类型到\
  \ `ActionListener` 的隐式转换来支持这种编码风格。\n\n`Scala 2.12` 允许即使在没有这种隐式转换的情况下，也可以在此情况下使用函数字面量。与\
  \ `Java 8` 一样，`Scala 2.12` 允许在需要声明单个抽象方法（`SAM`）的类或 trait 实例使用函数类型。这适用于 `Scala 2.12`\
  \ 中的任何 `SAM`。例如，你可以定义一个带有单个抽象方法 `increase` 的 trait `Increaser`：\n\n```scala\n scala>\
  \ trait Increaser {\n          def increase(i: Int): Int\n        }\ndefined trait\
  \ Increaser\n```\n\n然后你可以定义一个接受 `Increaser` 的方法：\n\n```scala\n scala> def increaseOne(increaser:\
  \ Increaser): Int =\n          increaser.increase(1)\n  increaseOne: (increaser:\
  \ Increaser)Int\n```\n\n要调用你的新方法，你可以像这样传递一个 trait `Increaser` 的匿名实例：\n\n```scala\n\
  \ scala> increaseOne(\n          new Increaser {\n            def increase(i: Int):\
  \ Int = i + 7\n          }\n        )\nres0: Int = 8\n```\n\n然而，在 `Scala 2.12` 中，你也可以选择而直接使用函数字面量，因为\
  \ `Increaser` 是一个 `SAM` 类型：\n\n```scala\n scala> increaseOne(i => i + 7) // Scala\
  \ 2.12\n  res1: Int = 8\n```\n\n### 在 Scala 2.12 中使用 Java 8 Streams\n\n`Java` 的\
  \ `Stream` 是一种函数式数据结构，它提供了一个接受 `java.util.function.IntUnaryOperator` 的 `map` 方法。从\
  \ `Scala` 可以调用 `Stream.map` 来递增 `Array` 中的每个元素，如下：\n\n```scala\n scala> import java.util.function.IntUnaryOperator\n\
  \  import java.util.function.IntUnaryOperator\n\n  scala> import java.util.Arrays\n\
  \  import java.util.Arrays\n\n  scala> val stream = Arrays.stream(Array(1, 2, 3))\n\
  \  stream: java.util.stream.IntStream = ...\n\n  scala> stream.map(\n    new IntUnaryOperator\
  \ {\n      def apply(i: Int): Int = i + 1\n    }\n  ).toArray\n  res3: Array[Int]\
  \ = Array(2, 3, 4)\n```\n\n但是，由于 `IntUnaryOperator` 是 `SAM` 类型，在 `Scala 2.12` 中你可以使用函数字面量更简洁地调用它：\n\
  \n```scala\n scala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream: java.util.stream.IntStream\
  \ = ...\n\n  scala> stream.map(i => i + 1).toArray // Scala 2.12\n  res4: Array[Int]\
  \ = Array(2, 3, 4)\n```\n\n注意，只有函数字面量会被适配为 `SAM` 类型，而不是具有函数类型的任意表达式。例如，考虑以下 `val\
  \ f`，它的类型为 `Int =>` `Int`：\n\n```scala\n scala> val f = (i: Int) => i + 1\n  f:\
  \ Int => Int = ...\n```\n\n尽管 `f` 的类型与传递给 `stream.map` 的函数字面量相同，但在需要 `IntUnaryOperator`\
  \ 的地方，你无法使用 `f`：\n\n```scala\n scala> val stream = Arrays.stream(Array(1, 2, 3))\n\
  \  stream: java.util.stream.IntStream = ...\n\n  scala> stream.map(f).toArray\n\
  \  <console>:16: error: type mismatch;\n  found: Int => Int\n  required: java.util.function.IntUnaryOperator\n\
  \  stream.map(f).toArray\n             ^\n```\n\n要使用 `f`，你可以使用函数字面量显式地调用它，如下：\n\n\
  ```scala\n scala> stream.map(i => f(i)).toArray\n  res5: Array[Int] = Array(2, 3,\
  \ 4)\n```\n\n或者，在定义 `f` 时，可以使用 `IntUnaryOperator`（`Stream.map` 预期的类型）对 `f` 进行注解：\n\
  \n```scala\n scala> val f: IntUnaryOperator = i => i + 1\n  f: java.util.function.IntUnaryOperator\
  \ = ...\n\n  scala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream: java.util.stream.IntStream\
  \ = ...\n\n  scala> stream.map(f).toArray\n  res6: Array[Int] = Array(2, 3, 4)\n\
  ```\n\n通过 `Scala 2.12` 和 `Java 8`，你还可以从 `Java` 调用用 `Scala` 编译的方法，并使用 `Java`  Lambda\
  \ 表达式传递 `Scala` 函数类型。\n\n尽管 `Scala` 函数类型被定义为包含具体方法的 trait，`Scala 2.12` 将 trait 编译为带有默认方法的接口，这是\
  \ `Java 8` 的新功能。结果是 `Scala` 函数类型在 `Java` 看来就是 `SAM`。\n\n### 31.6 结论\n\n大多数时候，你可以忽略\
  \ `Scala` 如何实现的，只需编写并运行代码即可。但有时查看“内部原理”是有用的，本章探讨了 `Scala` 在 `Java` 平台上实现的三个方面：转换情况、`Scala`\
  \ 和 `Java` 注解如何协同工作以及 `Scala` 的通配类型如何让你访问 `Java` 通配类型。它还涵盖了从 `Scala` 使用 `Java` 并发原以及编译混合\
  \ `Scala` 和 `Java` 项目。当你同时使用 `Scala` 和 `Java` 时，这些主题是非常重要的。\n\n* *\n\n#### 第 31\
  \ 章脚注：\n\n[1] 值的实现已在第 11.2 节中进行了详细讨论。\n\n[2] 这这一切之所以奏效，是因为 `Java` 字节码验证器根本不检查这些声明。\n\
  \n[3] `Scala 2.12` 需要 `Java 8` 以便它能够利用。\n\n\n\n\n\n遗憾的是，程序员们发现，使用共享数据和锁的模型来可靠地构建健壮的多线程应用程序非常困难，特别是当应用程序规模和复杂性增加时。问题在于，在程序的每个点，你都必须推断你正在修改或访问哪些数据可能被其他线程修改或访问，以及正持有哪些锁。在每个方法调用处，你必须推断它将尝试持有哪些锁，并说服自己在尝试获取它们时不会死锁。更糟糕的是，你所推断的锁在编译时并不是固定的，因为程序在运行过程中可以自由创建新的锁。\n\
  \n更糟糕的是，多线程代码的测试是不可靠的。由于线程是非确定性的，你可能成功地测试了程序一千次——但程序在客户的机器上第一次运行时仍然可能会出错。使用共享数据和锁时，你必须仅通过推理来确保程序是正确的。\n\
  \n此外，你无法通过过度同步来解决问题。同步所有内容所产生的问题与什么都不同步可能一样棘手。虽然新的锁操作可能会消除竞态条件可能，但它们同时也增加了死锁的可能性。一个正确使用锁的程序既没有竞态条件也没有死锁，因此你不能通过在某一个方向上过度来寻求安全。\n\
  \n`java.util.concurrent` 库为并发编程提供了更高层次的抽象。使用并发工具使得多线程编程比使用 Java 的低级同步原语自定义抽象要容易出错得多。然而，这些并发工具也是基于共享数据和锁的模型，因此并没有解决使用该模型的根本性困难。\n\
  \n### 32.2 异步执行与 Try\n\n虽然 Scala 的 `Future` 不是万能灵药，但它提供了一种处理并发的方法，可以减少并通常消除对共享数据和锁进行推理的需求。当你调用一个\
  \ Scala 方法时，它会在你“等待”的同时执行计算并返回结果。如果该结果是一个 `Future`，那么这个 `Future` 代表另一个将异步执行的计算，通常由完全不同的线程执行。因此，对\
  \ `Future` 的许多操作需要一个隐式的执行上下文（execution context），该上下文提供了一个异步执行函数的策略。例如，如果你尝试通过 `Future.apply`\
  \ 工厂方法创建一个 future 而不提供隐式执行上下文（即 `scala.concurrent.ExecutionContext` 的实例），你将得到编译错误：\n\
  \n```\nscala> import scala.concurrent.Future\n  import scala.concurrent.Future\n\
  \n  scala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n  <console>:11: error:\
  \ Cannot find an implicit ExecutionContext.\n      You might pass an (implicit ec:\
  \ ExecutionContext)\n      parameter to your method or import\n      scala.concurrent.ExecutionContext.Implicits.global.\n\
  \        val fut = Future { Thread.sleep(10000); 21 + 21 }\n                   \
  \       ^\n```\n\n错误信息提供了一种解决问题的方法：导入 Scala 自身提供的全局执行上下文。在 JVM 上，全局执行上下文使用线程池。一旦你将隐式执行上下文引入作用域，你就可以创建一个\
  \ future：\n\n```\nscala> import scala.concurrent.ExecutionContext.Implicits.global\n\
  \  import scala.concurrent.ExecutionContext.Implicits.global\n\n  scala> val fut\
  \ = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n在上一个示例中创建的 future 使用全局执行上下文异步执行代码块，然后带有值 42 完成。一旦它开始执行，该线程将睡眠十秒。因此，这个\
  \ future 将至少需要十秒才能完成。\n\n`Future` 上的两个方法允许你轮询：`isCompleted` 和 `value`。在尚未完成的 future\
  \ 上调用时，`isCompleted` 将返回 `false`，`value` 将返回 `None`。\n\n```\nscala> fut.isCompleted\n\
  \  res0: Boolean = false\n\n  scala> fut.value\n  res1: Option[scala.util.Try[Int]]\
  \ = None\n```\n\n一旦 future 完成（在本例中，在至少十秒之后），`isCompleted` 将返回 `true`，`value` 将返回一个\
  \ `Some`：\n\n```\nscala> fut.isCompleted\n  res2: Boolean = true\n\n  scala> fut.value\n\
  \  res3: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n`value` 返回的 包含一个\
  \ `Try`。如图 32.1 所示，`Try` 要么是 `Success`（包含一个类型为 `T` 的值），要么是 `Failure`（包含一个异常）。`Try`\
  \ 的目的是为异步计算提供 `try/catch` 为同步计算提供的功能。对于异步计算，你使用 `Try` 来处理活动失败的可能性。这里有一个示例展示了当异步活动失败时发生什么：\n\
  \n```\nscala> val fut = Future { Thread.sleep(10000); 21 / 0 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> fut.value\n  res4: Option[scala.util.Try[Int]] = None\n```\n\
  \n然后，十秒之后：\n\n```\nscala> fut.value\n  res5: Option[scala.util.Try[Int]] = Some(Failure(ArithmeticException:\
  \ / zero))\n```\n\n### 32.3 使用 Futures\n\nScala 的 `Future` 允许你对 Future 结果指定转换，并获得一个表示这两个异步计算组合的新新\
  \ future。\n\n#### 使用 map 转换 Futures\n\n此类操作的最基础操作是 `map`。与其阻塞后继续另一个计算，你只需将下一个计算映射到\
  \ future 上。结果将是一个代表原始结果通过函数进行异步转换的新 future。\n\n例如，以下 future 将十秒后完成：\n\n```\nscala>\
  \ val fut = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n使用一个加 1 的函数映射这个 future 将产生另一个 future。这个新 future 将代表由原始加法和随后的增量组成的计算：\n\
  \n```\nscala> val result = fut.map(x => x + 1)\n  result: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> result.value\n  res5: Option[scala.util.Try[Int]] = None\n```\n\
  \n一旦原始 future 完成并将函数应用于其结果，由 `map` 返回的 future 将完成：\n\n```\nscala> result.value\n\
  \  res6: Option[scala.util.Try[Int]] = Some(Success(43))\n```\n\n注意，此示例中执行的操作——future\
  \ 的创建、21 + 21 的和计算以及 42 + 1 的增量——可能由三个不同的线程执行。\n\n#### 使用 for 表达式转换 Futures\n\n\n\
  \n\n由于 Scala 的未来也声明了 `flatMap` 方法，你可以使用 `for` 表达式来转换 future。例如，考虑以下两个 future，它们将在十秒后分别产生\
  \ 42 和 46：\n\n```\nscala> val fut1 = Future { Thread.sleep(10000); 21 + 21 }\n \
  \ fut1: scala.concurrent.Future[Int] = ...\n\n  scala> val fut2 = Future { Thread.sleep(10000);\
  \ 23 + 23 }\n  fut2: scala.concurrent.Future[Int] = ...\n```\n\n给定这两个 future，你可以像下面这样获取一个新的\
  \ future，它代表它们结果的异步求和：\n\n```\n scala> for {\n          x <- fut1\n          y <-\
  \ fut2\n        } yield x + y\n  res7: scala.concurrent.Future[Int] = ...\n```\n\
  \n一旦原始 future 完成，并且随后的求和也完成了，你就能看到结果：\n\n```\n scala> res7.value\n  res8: Option[scala.util.Try[Int]]\
  \ = Some(Success(88))\n```\n\n由于 `for` 表达式会序列化它们的转换，如果你没有在 `for` 表达式之前创建 future，它们将不会并行运行。例如，虽然之前的\
  \ `for` 表达式需要大约十秒才能完成，但以下的 `for` 表达式至少需要二十秒：\n\n```\nscala> for {\n          x <-\
  \ Future { Thread.sleep(10000); 21 + 21 }\n          y <- Future { Thread.sleep(10000);\
  \ 23 + 23 }\n        } yield x + y\n  res9: scala.concurrent.Future[Int] = ...\n\
  \n  scala> res9.value\n  res27: Option[scala.util.Try[Int]] = None\n\n  scala> //\
  \ 至少需要 20 秒才能完成\n\n  scala> res9.value\n  res28: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n### 创建 Future: Future.failed, Future.successful, Future.fromTry 和 Promises\n\
  \n除了在早期的示例中用于创建 future 的 `apply` 方法外，`Future` 伴生对象还包含了三个用于创建已完成 future 的工厂方法：`successful`、`failed`\
  \ 和 `fromTry`。这些工厂方法不需要 `ExecutionContext`。\n\n`successful` 工厂方法创建一个已经执行成功的 future：\n\
  \n```\nscala> Future.successful { 21 + 21 }\n  res2: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n`failed` 方法创建一个已经失败的 future：\n\n```\nscala> Future.failed(new Exception(\"\
  bummer!\"))\n  res3: scala.concurrent.Future[Nothing] = ...\n```\n\n`fromTry` 方法从一个\
  \ `Try` 创建一个已完成的 future：\n\n```\nscala> import scala.util.{Success,Failure}\n  import\
  \ scala.util.{Success, Failure}\n\n  scala> Future.fromTry(Success { 21 + 21 })\
  \ \n  res4: scala.concurrent.Future[Int] = ...\n\n  scala> Future.fromTry(Failure(new\
  \ Exception(\"bummer!\"))) \n  res5: scala.concurrent.Future[Nothing] = ...\n```\n\
  \n创建 future 最通用的方法是使用 `Promise`。给定一个 promise，你可以获得一个受该 promise 控制的 future。当你完成 promise\
  \ 时，future 就会完成。这里有一个示例：\n\n```\nscala> val pro = Promise[Int]\n  pro: scala.concurrent.Promise[Int]\
  \ = ...\n\n  scala> val fut = pro.future\n  fut: scala.concurrent.Future[Int] =\
  \ ...\n\n  scala> fut.value\n  res8: Option[scala.util.Try[Int]] = None\n```\n\n\
  你可以使用命名为 `success`、`failure` 和 `complete` 的方法来完成 promise。`Promise` 这些方法与之前描述的构建已完成\
  \ future 的方法相似。例如，`success` 方法将完成 future：\n\n```\nscala> pro.success(42)\n  res9:\
  \ pro.type = ...\n\n  scala> fut.value\n  res10: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n`failure` 方法接收一个会导致 future 失败的异常。`complete` 方法接收一个 `Try`。还存在一个接收 future 的\
  \ `completeWith` 方法；promise 的 future 将镜像传递给 `completeWith` 的 future 的完成状态。\n\n###\
  \ 过滤：filter 和 collect\n\nScala 的 future 提供了两个方法，`filter` 和 `collect`，它们允许你确保 future\
  \ 满足某个属性。`filter` 方法验证 future 结果，如果有效，则保持不变。这里有一个确保 `Int` 为正数的示例：\n\n```\nscala>\
  \ val fut = Future { 2 }\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ val valid = fut.filter(res => res > 0)\n  valid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> valid.value\n  res0: Option[scala.util.Try[Int]] = Some(Success(2))\n\
  ```\n\n如果 future 值无效，由 `filter` 返回的 future 将以 `NoSuchElementException` 失败：\n\n```\n\
  scala> val invalid = fut.filter(res => res < 0)\n  invalid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> invalid.value\n  res1: Option[scala.util.Try[Int]] = Some(Failure(NoSuchElementException:\
  \ filter not satisfied))\n```\n\n由于 `Future` 还提供了 `withFilter` 方法，你可以像下面这样执行相同的操作：\n\
  \n```\nscala> val valid = for (res <- fut if res > 0) yield res\n  valid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> valid.value\n  res2: Option[scala.util.Try[Int]] = Some(Success(2))\n\
  \n  scala> val invalid = for (res <- fut if res < 0) yield res\n  invalid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> invalid.value\n  res3: Option[scala.util.Try[Int]] = Some(Failure(NoSuchElementException:\
  \ filter not satisfied))\n```\n\n`Future` 的 `collect` 方法允许你验证 future 值并进行转换。如果传递给\
  \ `collect` 的部分函数定义，由 `collect` 返回的 future 将以该值成功：\n\n```\nscala> val valid = fut.collect\
  \ { case res if res > 0 => res + 46 }\n  valid: scala.concurrent.Future[Int] = ...\n\
  \n  scala> valid.value\n  res4: Option[scala.util.Try[Int]] = Some(Success(48))\n\
  ```\n\n否则，future 将以 `NoSuchElementException` 失败：\n\n```\nscala> val invalid = fut.collect\
  \ { case res if res < 0 => res + 46 }\n  invalid: scala.concurrent.Future[Int] =\
  \ ...\n\n  scala> invalid.value\n  res5: Option[scala.util.Try[Int]] = Some(Failure(NoSuchElementException:\
  \ collect partial function not defined))\n```\n\n### 处理失败：failed, fallbackTo, recover\
  \ 和 recoverWith\n\nScala 的 future 提供了处理失败 future 方法，包括 `failed`、`fallbackTo`、`recover`\
  \ 和 `recoverWith`。`failed` 方法将任何类型的失败 future 转换为成功的 `Future[Throwable]`，它持有导致失败的异常。这里有一个示例：\n\
  \n```\nscala> val failure = Future { 42 / 0 }\n  failure: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> failure.value\n  res6: Option[scala.util.Try[Int]] = Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n\n  scala> val expectedFailure = failure.failed\n  expectedFailure:\
  \ scala.concurrent.Future[Throwable] = ...\n\n  scala> expectedFailure.value\n \
  \ res7: Option[scala.util.Try[Throwable]] = Some(Success(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n如果调用 `failed` 方法的 future 最终成功，则 `failed` 返回的 future 将自身以 `NoSuchElementException`\
  \ 失败。因此，`failed` 方法仅适用于预期该 future 会失败的情况。这里有一个示例：\n\n```\nscala> val success = Future\
  \ { 42 / 1 }\n  success: scala.concurrent.Future[Int] = ...\n\n  scala> success.value\n\
  \  res8: Option[scala.util.Try[Int]] = Some(Success(42))\n\n  scala> val unexpectedSuccess\
  \ = success.failed\n  unexpectedSuccess: scala.concurrent.Future[Throwable] = ...\n\
  \n  scala> unexpectedSuccess.value\n  res9: Option[scala.util.Try[Throwable]] =\
  \ Some(Failure(java.util.NoSuchElementException: Future.failed not completed with\
  \ a throwable.))\n```\n\n`fallbackTo` 方法允许你在调用 `fallbackTo` 的 future 失败时提供一个备用的\
  \ future。这里有一个示例，其中一个失败的 future 回退到一个成功的 future：\n\n```\nscala> val failure = Future\
  \ { 42 / 0 }\n  failure: scala.concurrent.Future[Int] = ...\n\n  scala> val success\
  \ = Future { 42 / 1 }\n  success: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ val result = failure.fallbackTo(success)\n  result: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> result.value\n  res10: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n\n\n\n```scala\nscala> val fallback = failure.fallbackTo(success)\n  fallback:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> fallback.value\n  res27: Option[scala.util.Try[Int]]\
  \ = Some(Success(42))\n```\n\n如果调用 `fallbackTo` 的原始 future 失败，则传递给 `fallbackTo`\
  \ 的 future 的失败将实际上被忽略。由 `fallbackTo` 返回的 future 将以初始异常失败。这里有一个示例：\n\n```scala\n\
  scala> val failedFallback = failure.fallbackTo(\n          Future { val res = 42;\
  \ require(res < 0); res }\n        )\n  failedFallback: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> failedFallback.value\n  res28: Option[scala.util.Try[Int]] =\n\
  \  Some(Failure(java.lang.ArithmeticException: / by zero))\n```\n\n`recover` 方法允许你将失败的\
  \ future 转换为成功的 future，从而让成功的 future 的结果原封样地传递。例如，对于一个因 `ArithmeticException` 失败的\
  \ future，你可以使用 `recover` 方法将失败转换为成功，如下所示：\n\n```scala\nscala> val recovered = failedFallback\
  \ recover {\n          case ex: ArithmeticException => -1\n        }\n  recovered:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> recovered.value\n  res32: Option[scala.util.Try[Int]]\
  \ = Some(Success(-1))\n```\n\n如果原始 future 没有失败，由 `recover` 返回的 future 将以相同的值完成：\n\
  \n```scala\nscala> val unrecovered = fallback recover {\n          case ex: ArithmeticException\
  \ => -1\n        }\n  unrecovered: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ unrecovered.value\n  res33: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n同样，如果传递给 `recover` 的偏函数没有在原始 future 最终失败的异常处定义，那么原始失败将传递传递：\n\n```scala\n\
  scala> val alsoUnrecovered = failedFallback recover {\n          case ex: IllegalArgumentException\
  \ => -2\n        }\n  alsoUnrecovered: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ alsoUnrecovered.value\n  res34: Option[scala.util.Try[Int]] =\n  Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n`recoverWith` 方法与 `recover` 类似，不同之处在于不像 `recover` 那样恢复到一个值，`recoverWith`\
  \ 方法允许你恢复到一个 future 数值。这里有一个示例：\n\n```scala\nscala> val alsoRecovered = failedFallback\
  \ recoverWith {\n          case ex: ArithmeticException => Future { 42 + 46 }\n\
  \        }\n  alsoRecovered: scala.concurrent.Future[Int] = ...\n\n  scala> alsoRecovered.value\n\
  \  res35: Option[scala.util.Try[Int]] = Some(Success(88))\n```\n\n与 `recover` 一样，如果原始\
  \ future 没有失败，或者传递给 `recoverWith` 的偏函数在原始 future 最终失败的异常处没有定义，原始的成功（或失败）将传递给 `recoverWith`\
  \ 返回的 future。\n\n### 映射两种可能性：transform\n\n`Future` 的 `transform` 方法接受两个函数用于转换 future：一个用于成功情况，另一个用于失败情况：\n\
  \n```scala\nscala> val first = success.transform(\n          res => res * -1,\n\
  \          ex => new Exception(\"see cause\", ex)\n        )\n  first: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n如果 future 成功，则使用第一个函数：\n\n```scala\nscala> first.value\n  res42:\
  \ Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n如果 future 失败，则使用第二个函数：\n\
  \n```scala\nscala> val second = failure.transform(\n          res => res * -1,\n\
  \          ex => new Exception(\"see cause\", ex)\n        )\n  second: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> second.value\n  res43: Option[scala.util.Try[Int]] = Some(Failure(java.lang.ArithmeticException:\
  \ see cause))\n```\n\n注意，在使用上述示例所示的 `transform` 方法时，你不能将成功的 future 更改为失败，也不能将失败的\
  \ future 更改成功的。为了让这种转换更容易，Scala 2.12 引入了 `transform` 的另一种形式，它接受一个从 `Try` 到 `Try`\
  \ 的函数。这里是一些示例：\n\n```scala\nscala> val firstCase = success.transform { // Scala\
  \ 2.12\n          case Success(res) => Success(res * -1)\n          case Failure(ex)\
  \ => Failure(new Exception(\"see cause\", ex))\n        }\n  firstCase: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> firstCase.value\n  res6: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  \n  scala> val secondCase = failure.transform {\n          case Success(res) =>\
  \ Success(res * -1)\n          case Failure(ex) => Failure(new Exception(\"see cause\"\
  , ex))\n        }\n  secondCase: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ secondCase.value\n  res8: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\
  \n以下是使用 `transform` 方法将失败转换为成功的示例（Scala 2.12+）：\n\n```scala\nscala> val nonNegative\
  \ = failure.transform {\n          case Success(res) => Success(res.abs)\n     \
  \     case Failure(ex) => Failure(new Exception(\"see cause\", ex))\n        }\n\
  \  nonNegative: scala.concurrent.Future[Int] = ...\n\n  scala> nonNegative.value\n\
  \  res9: Option[scala.util.Try[Int]] = Some(Failure(java.lang.ArithmeticException:\
  \ see cause))\n```\n\n### 合并 future：zip, fold, reduce, sequence, traverse\n\n`Future`\
  \ 及其伴生对象提供了多种方法来合并多个 future。`zip` 方法将两个成功的 future 转换为包含这两个值的 future 元组。这是一个示例：\n\
  \n```scala\nscala> val zippedSuccess = success success\n  zippedSuccess: scala.concurrent.Future[(Int,\
  \ Int)] = ...\n\n  scala> zippedSuccess.value\n  res10: Option[scala.util.Try[(Int,\
  \ Int)]] = Some(Success((42,-1)))\n```\n\n如果其中一个 future 失败，`zip` 返回的 future 将包含相同的异常：\n\
  \n```scala\nscala> val zippedFailure = success failure\n  zippedFailure: scala.concurrent.Future[(Int,\
  \ Int)] = ...\n\n  scala> zippedFailure.value\n  res11: Option[scala.util.Try[(Int,\
  \ Int)]] = Some(Failure(java.lang.ArithmeticException: see cause))\n```\n\n`Future`\
  \ 伴生对象提供了 `fold` 方法，允许对 `TraversableOnce` 中的 future 进行累加，产生一个 结果。如果集合中的所有 future\
  \ 都成功，返回的 future 将带有累加结果。如果集合中的任何 future 失败，返回的 future 将失败。如果多个 future 失败，结果将是第一个失败的\
  \ future 的异常。这是一个示例：\n\n```scala\nscala> val fortyTwo = Future { 21 + 21 }\n  fortyTwo:\
  \ scala.concurrent.Future[Int] = ...\n\nscala> val fortySix = Future { 23 + 23 }\n\
  \  fortySix: scala.concurrent.Future[Int] = ...\n\nscala> val futureNums = List(fortyTwo,\
  \ fortySix)\n  futureNums: List[scala.concurrent.Future[Int]] = ...\n\nscala> val\
  \ folded = Future.fold(futureNums)(0) { (acc, num) =>\n          acc + num\n   \
  \     }\n  folded: scala.concurrent.Future[Int] = ...\n\n  scala> folded.value\n\
  \  res12: Option[scala.util.Try[Int]] = Some(Success(88))\n```\n\n`Future.reduce`\
  \ 方法执行不带零值的折，使用初始 future 结果作为起始值。这是一个示例：\n\n```scala\nscala> val reduced = Future.reduce(futureNums)\
  \ { (acc, num) =>\n          acc + num\n        }\n  reduced: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> reduced.value\n  res13: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n如果你向 `reduce` 传递一个空集合，返回的 future 将因 `NoSuchElementException` 失败。\n\n`Future.sequence`\
  \ 方法将 `TraversableOnce` future 集合转换为一个未来的 `TraversableOnce` 数值。例如，在下面的示例中，`sequence`\
  \ 用于将 `List[Future[Int]]` 转换为 `Future[List[Int]]`：\n\n```scala\nscala> val listOfFutures\
  \ = List(Future { 1 }, Future { 2 })\n  listOfFutures: List[scala.concurrent.Future[Int]]\
  \ = ...\n\nscala> val sequenced = Future.sequence(listOfFutures)\n  sequenced: scala.concurrent.Future[List[Int]]\
  \ = ...\n\n  scala> sequenced.value\n  res14: Option[scala.util.Try[List[Int]]]\
  \ = Some(Success(List(1,2)))\n```\n\n\n\n\n\n```\nscala> val futureList = Future.sequence(futureNums)\n\
  \  futureList: scala.concurrent.Future[List[Int]] = ...\n\n  scala> futureList.value\n\
  \  res55: Option[scala.util.Try[List[Int]]] =\n    Some(Success(List(42, 46)))\n\
  ```\n\n`Future.traverse` 方法将将任何任意元素类型的 `TraversableOnce` 转换为包含 future 的 `TraversableOnce`，并将其“序列化”（sequence）为包含值的\
  \ future `TraversableOnce`。例如，在这里通过 `Future.traverse` 将一个 `List[Int]` 转换为了 `Future[List[Int]]`：\n\
  \n```\nscala> val traversed =\n          Future.traverse(List(1, 2, 3)) { i => Future(i)\
  \ }\n  traversed: scala.concurrent.Future[List[Int]] = ...\n\n  scala> traversed.value\n\
  \  res58: Option[scala.util.Try[List[Int]]] = \n  Some(Success(List(1, 2, 3)))\n\
  ```\n\n## 执行副作用：foreach, onComplete 和 andThen\n\n有时你可能需要在 future 完成后执行某种副作用。`Future`\
  \ 为此目的提供了几种方法。最基本的方法是 `foreach`，它会在 future 成功完成时执行副作用。例如，在下面的示例中，如果 future 失败则不会执行\
  \ `println`，只有成功的 future 才会执行：\n\n```\nscala> failure.foreach(ex => println(ex))\n\
  \n  scala> success.foreach(res => println(res))\n  42\n```\n\n由于不带 `yield` 的 `for`\
  \ 会重写为 `foreach` 的调用，你也可以使用 `for` 表达式来实现相同的效果：\n\n```scala\nscala> for (res <- failure)\
  \ println(res)\n\n  scala> for (res <- success) println(res)\n  42\n```\n\n`Future`\
  \ 还提供了两个注册“回调”函数的方法。`onComplete` 方法无论 future 最终成功还是失败都会执行。该函数将接收一个 `Try`——如果 future\
  \ 成功，则是一个持有结果的 `Success`；否则是一个持有导致 future 失败的异常的 `Failure`。这里有一个示例：\n\n```scala\n\
  scala> import scala.util.{Success, Failure}\n  import scala.util.{Success, Failure}\n\
  \n  scala> success onComplete {\n          case Success(res) => println(res)\n \
  \         case Failure(ex) => println(ex)\n        }\n  42\n\n  scala> failure onComplete\
  \ {\n          case Success(res) => println(res)\n          case Failure(ex) =>\
  \ println(ex)\n        }\njava.lang.ArithmeticException: / by zero\n```\n\n`Future`\
  \ 不保证通过 `onComplete` 注册的回调函数具有执行顺序。如果你想强制执行回调函数的顺序，则必须使用 `andThen`。`andThen` 方法返回一个新的\
  \ future，该 future 会与你调用 `andThen` 的原始 future 镜像（以相同的方式成功或失败），但在回调函数被完全执行之前，它不会完成：\n\
  \n```scala\nscala> val newFuture = success andThen {\n          case Success(res)\
  \ => println(res)\n          case Failure(ex) => println(ex)\n        }\n  42\n\
  \  newFuture: scala.concurrent.Future[Int] = ...\n\n  scala> newFuture.value\n \
  \ res76: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n注意，如果传递给 `andThen`\
  \ 的回调函数在执行时抛出异常，该异常将不会传播到后续的回调，也不会通过生成的 future 报告。\n\n## 2.12 添加的其他方法：flatten, zipWith\
  \ 和 transformWith\n\n在 2.12 添加的 `flatten` 方法将嵌套在另一个 `Future` 内部的 `Future` 转换为嵌套类型的\
  \ `Future`。例如，`flatten` 可以将 `Future[Future[Int]]` 转换为 `Future[Int]`：\n\n```scala\n\
  scala> val nestedFuture = Future { Future { 42 } }\n  nestedFuture: Future[Future[Int]]\
  \ = ...\n\n  scala> val flattened = nestedFuture.flatten // Scala 2.12\n  flattened:\
  \ scala.concurrent.Future[Int] = Future(Success(42))\n```\n\n在 2.12 添加的 `zipWith`\
  \ 方法本质上是将两个 `Futures` 压缩（zip）在一起，然后对生成的元组执行 `map`。这里是两步过程的示例，先 zip 后 map：\n\n```scala\n\
  scala> val futNum = Future { 21 + 21 }\n  futNum: scala.concurrent.Future[Int] =\
  \ ...\n\n  scala> val futStr = Future { \"ans\" + \"wer\" }\n  futStr: scala.concurrent.Future[String]\
  \ = ...\n\n  scala> val zipped = futNum zip futStr\n  zipped: scala.concurrent.Future[(Int,\
  \ String)] = ...\n\n  scala> val mapped = zipped map {\n          (num, str) =>\
  \ s\"$num is $str\"\n        }\n  mapped: scala.concurrent.Future[String] = ...\n\
  \n  scala> mapped.value\n  res2: Option[scala.util.Try[String]] = Some(Success(42\
  \ is answer))\n```\n\n`zipWith` 允许你在一到位内完成相同的操作：\n\n```scala\nscala> val flipped\
  \ = futNum.zipWith(futStr) { // Scala 2.12\n          case (num, str) => s\"$num\
  \ is $str\"\n        }\n  flipped: scala.concurrent.Future[String] = ...\n\n  scala>\
  \ flipped.value\n  res3: Option[scala.util.Try[String]] = Some(Success(42 is answer))\n\
  ```\n\n`Future` 在 2.12 获得了 `transform` 方法，允许你使用 `Try` 来转换 future。这里有一个示例：\n\n```scala\n\
  scala> val flipped = success.transform {\n          case Success(res) => Success(res)\n\
  \          case Failure(ex) => Failure(ex)\n        }\n  flipped: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> flipped.value\n  res4: Option[scala.util.Try[Int]] = Some(Success(42\
  \ is answer))\n```\n\n`transformWith` 方法与 `transform` 类似，区别在于传递的函数不是返回 `Try`，而是返回一个\
  \ `Future`：\n\n```scala\nscala> val flipped = success.transformWith {\n        \
  \  case Success(res) => Future(res)\n          case Failure(ex) => Future(ex)\n\
  \        }\n  flipped: scala.concurrent.Future[Int] = ...\n\n  scala> flipped.value\n\
  \  res5: Option[scala.util.Try[Int]] = Some(Success(42 is answer))\n```\n\n## 3.\
  \ 使用 Futures 测试\n\n`futures` 的一个优势在于它们有助于避免阻塞。在大多数 JVM 实现中，创建数千个线程的线程切换开销会导致性能下降到不可接受的水平。尽管如此，Scala\
  \ 允许你在需要时对 future 进行阻塞。`Await` 对象：\n\n```scala\nscala> import scala.concurrent.Await\n\
  \  import scala.concurrent.Await\n\n  scala> import scala.concurrent.duration._\n\
  \  import scala.concurrent.duration._\n\n  scala> val fut = Future { Thread.sleep(10000);\
  \ 21 + 21 }\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala> val x = Await.result(fut,\
  \ 15.seconds) // blocks\n  x: Int = 42\n```\n\n`Await.result` 接收一个 `Future` 和一个\
  \ `Duration`。`Duration` 指定 `Await.result` 在超时前等待 `Future` 完成的时间。在这个示例中，指定了十五秒。因此，`Await.result`\
  \ 方法在 future 完成其最终值 42 之前不会超时。\n\n阻塞被广泛接受的一个地方是异步代码的测试。现在 `Await.result` 返回后，你可以使用该结果进行计算，例如测试中的断言：\n\
  \n```scala\nscala> import org.scalatest.Matchers._\n  import org.scalatest.Matchers._\n\
  \n  scala> x should be (42)\n  res0: org.scalatest.Assertion = Succeeded\n```\n\n\
  或者，你可以使用 ScalaTest 特性 `ScalaFutures` 提供的阻塞结构。例如，由 `ScalaFutures` 隐式添加到 `Future`\
  \ 的 `futureValue` 方法将阻塞直到 future 完成。如果 future 失败，`futureValue` 将抛出一个描述问题的 `TestFailedException`。如果\
  \ future 成功，`futureValue` 将返回 future 的成功结果，你可以对该值进行断言：\n\n```scala\nscala> import\
  \ org.scalatest.concurrent.ScalaFutures._\n  import org.scalatest.concurrent.ScalaFutures._\n\
  \n  scala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> fut.futureValue should be (42) // futureValue blocks\n  res1:\
  \ org.scalatest.Assertion = Succeeded\n```\n\n\n\n\n虽然在测试中使用阻塞操作通常是可以接受的，但 ScalaTest\
  \ 3.0 增加了“异步（async）”测试风格，允许你在不阻塞的情况下测试 future。给定一个 future，与其阻塞并对结果进行断言，不如直接将断言映射到该\
  \ future 上，并并将生成的 `Future[Assertion]` 返回给 ScalaTest。示例如 Listing 32.1 所示。当 future\
  \ 断言完成时，ScalaTest 将异步地向测试报告生成器发送事件（测试成功、测试失败等）。\n\n```\n import org.scalatest.AsyncFunSpec\n\
  \  import scala.concurrent.Future\n\n  class AddSpec extends AsyncFunSpec {\n\n\
  \    def addSoon(addends: Int*): Future[Int] =\n        Future { addends.sum }\n\
  \n    describe(\"addSoon\") {\n      it(\"will eventually compute a sum of passed\
  \ Ints\") {\n        val futureSum: Future[Int] = addSoon(1, 2)\n        // You\
  \ can map assertions onto a Future, then return\n        // the resulting Future[Assertion]\
  \ to ScalaTest:\n        futureSum map { sum => assert(sum == 3) }\n      }\n  \
  \  }\n  }\n```\n\n##### Listing 32.1 - 将 future 断言返回给 ScalaTest。\n\n异步测试的用例说明了处理\
  \ future 的通用原则：一旦进入“future 空间”，就尽量留在 future 空间内。不要在 future 上进行阻塞，然后使用结果继续计算。通过执行一系列转换来保持异步状态，每个转换都返回一个新的用于转换的\
  \ future。要从 future 空间中获取结果，请注册在 future 完成后异步执行的副作用操作（side effects）。这种方法将帮助你最大限度地利用线程。\n\
  \n### 32.5 结论\n\n并发编程赋予了你巨大的力量。它让你能够简化代码并利用多处理器的优势。遗憾的是，最广泛使用的并发原语——线程、锁和监视器——是死锁和竞态条件的“雷区”。Future\
  \ 提供了一种逃离该雷区的方法，让你在编写并发程序时，不会面临如此大的死锁和竞态条件风险。本章介绍了在 Scala 中处理 future 的几个基础构造结构，包括如何创建\
  \ future、如何转换它们以及如何测试它们，以及其他基础知识。随后，它向你展示了如何将这些构造结构作为通用 future 风格的一部分。\n\n***\n\n\
  #### 第 32 章脚注：\n\n[1] 在 Scala.js 中，全局执行上下文会将任务置于 JavaScript 事件队列中。\n\n[2] 注意，Java\
  \ 的 `Future` 也有一种方法来处理异步计算可能抛出的异常：它的 `get` 方法会将该异常封装在 `ExecutionException` 中并抛出。\n\
  \n[3] 示例中所示的 `for` 表达式将被重写为对 `fut1.flatMap` 的调用，并传入一个调用 `fut2.map` 的函数：`fut1.flatMap(x\
  \ => fut2.map(y => x + y))`。\n\n## 第 33 章\n\n# 组合解析 (Combinator Parsing)\n\n偶尔，你可能需要处理一种小型的特殊用途语言。例如，你可能需要为软件读取配置文件，并且你希望它们比\
  \ XML 更容易手动修改。或者，也许你可能在你的程序中支持一种输入语言，例如带有布尔操作符的搜索词（“电脑，帮我找一部带有 `太空飞船` 且没有 `爱情故事`\
  \ 的电影”）。无论出于什么原因，你都需要一个*解析器*（parser）。你需要一种方法将输入语言转换为你的软件可以处理的数据结构。\n\n本质上，你只有几种选择。一种选择是自己编写解析器（以及词法分析器）。如果你不是专家，这是很难的。如果你是专家，这仍然非常耗时。\n\
  \n另一种选择是使用解析器生成器。有很多这样的生成器。其中一些著名的包括用于 C 编写的解析器的 `Yacc` 和 `Bison`，以及用于 Java 编写的解析器的\
  \ `ANTLR`。你可能还需要一个扫描器生成器（如 `Lex`、`Flex` 或 `JFlex`）配合使用。这可能是最佳解决方案，尽管有两个不便之处：你需要学习新工具，包括它们有时很晦涩的错误信息；你还需要弄清楚如何将这些工具的输出连接到你的程序。这可能会限制编程语言的选择，并使你的工具链复杂化。\n\
  \n本章介绍了第三种替代方案。你不再使用解析器生成器的独立领域语言，而是将使用一种内部领域语言，简称内部 DSL。内部 DSL 将由解析器组合器组成——这些是在\
  \ Scala 中定义的函数。本章仅介绍了一个之前没有解释过的特性：别名，位于 Section 33.6。本章展示了这些元素如何组合。\n\n本章的概念往往比之前的章节更高级。如果你在编译器构造方面有良好的基础，将从本章中受益。如果没有，可以安全地跳过本章。\n\
  \n### 33.1 示例：算术表达式\n\n我们从一个示例开始。假设你想为算术表达式构建一个解析器，这些表达式由浮点数、括号和二进制运算符 `+`、`-`、`*`\
  \ 和 `/` 组成。第一步总是为要解析的语言编写文法。以下是算术表达式的文法：\n\n| `expr` ::= | `term``{`+``term` | `-``term``}`\
  \ |\n\n| `term` ::= | `factor``{`*``factor` | `/``factor``}` |\n\n| `factor` ::=\
  \ | `floatingPointNumber` | `(``expr``)` |\n\n在这里，`|` 表示可选产生式，`{` ... `}` 表示重复。虽然在本示例中没有用到它，但\
  \ `[` ... `]` 表示可选出现。\n\n这个上下文文法形式地定义了算术表达式的语言。每个表达式（由 `expr` 表示）都是一个 `term`，后面跟着一系列\
  \ `+` 或 `-` 运算符以及更多的 `term`。`term` 是一个 `factor`，可能跟着一系列 `*` 或 `/` 运算符。`factor` 是一个数字字面量，或者是括号内的表达式。注意文法已经编码了运算符的相对优先级。例如，`*`\
  \ 的优先级比 `+` 高，因为 `*` 操作产生一个 `term`，而 `+` 操作产生一个 `expr`，且 *term* 只有在后者被括号包含时才能包含\
  \ *expr*。\n\n现在你已经定义了文法，下一步是什么？如果你使用 Scala 的组合解析器，你基本上完成了！你只需要进行一些系统的文本替换，并将解析器封装在一个类中，如\
  \ Listing 33.1 所示：\n\n```\n import scala.util.parsing.combinator._\n\n  class Arith\
  \ extends JavaTokenParsers {\n    def expr: Parser[Any] = term~rep(\"+\"~term |\
  \ \"-\"~term)\n    def term: Parser[Any] = factor~rep(\"*\"~factor | \"/\"~factor)\n\
  \    def factor: Parser[Any] = floatingPointNumber | \"(\"~expr~\")\")\n  }\n```\n\
  \n\n\n\n算术表达式的解析器包含在一个继承自 `JavaTokenParsers` 特性的类中。该特性为编写解析器提供了基础机制，并提供了一些用于识别某些词类类的原始解析器：标识符、字符串字面量和数字。在列表\
  \ 33.1 的示例中，你只需要继承自该特性的原始 `floatingPointNumber` 解析器。\n\n类 `Arith` 中的这三个定义表示了算术表达式的产生式（productions）。如你所见，它们非常紧地遵循了上下文无关文法的产生式。事实上，你可以通过执行许多简单的文本替换，从上下文无关文法中自动生成这部分内容：\n\
  \n1. 每一个产生式都变成一个方法，因此你需要为它加上 `def` 前缀。\n2. 每个方法的返回类型都是 `Parser[Any]`，因此你需要将符号 `::=`\
  \ 符号更改为 `: Parser[Any] =`。你将在在本章的稍后部分中发现 `Parser[Any]` 类型的含义，以及如何让它更精确。\n3. 在语法中，顺序组合是隐式的，但在程序中它通过一个显式运算符表示：`~`。因此，你需要在产生式的两个连续符号之间插入一个\
  \ `~`。在列表 33.1 的示例中，我们选择不在 `~` 运算符周围写任何空格。这样一来，解析器代码就紧保持了文法的视觉外观——它只是将空格替换为 `~`\
  \ 字符。\n4. 重复用 `rep( ... )` 而不是 `\\{ ... \\}` 表示。类似地（尽管示例中未显示），选项用 `opt( ... )` 而不是\
  \ `[ ... ]` 表示。\n5. 每个产生式末尾的句号（`.`）被省略了——如果你愿意，也可以写分号（`;`）。\n\n就是这些了。生成的类 `Arith`\
  \ 定义了三个解析器：`expr`、`term` 和 `factor`，它们可以用于解析算术表达式及其部分。\n\n### 33.2 运行你的解析器\n\n你可以使用以下小型程序来练习你的解析器：\n\
  \n```scala\nobject ParseExpr extends Arith {\n  def main(args: Array[String]) =\
  \ {\n    println(\"input : \" + args(0))\n    println(parseAll(expr, args(0)))\n\
  \  }\n}\n```\n\n`ParseExpr` 对象定义了一个 `main` 方法，用于解析传递给第一个命令行参数。它打印原始输入参数，然后打印其解析后的版本。解析是通过该表达式完成的：\n\
  \n```\nparseAll(expr, input)\n```\n\n该表达式将解析器 `expr` 应用于给定的输入。它期望所有输入都匹配，即解析后的表达式后面没有多余的字符。还有一个方法\
  \ `parse`，它允许你解析一个输入前缀，并留下一部分未读取的剩余内容。\n\n你可以使用以下命令运行算术解析器：\n\n```bash\n$ scala\
  \ ParseExpr \"2 * (3 + 7)\"\ninput: 2 * (3 + 7)\n[1.12] parsed: ((2~List((*~(((~((3~List())~List((~(7~List())))))~)))))~List())\n\
  ```\n\n输出告诉你解析器已成功分析了到位置 [1.12] 的输入字符串。这意味着第一行和第十二列——换句话说，整个输入字符串——已被解析。暂时忽略 \"\
  parsed:\" 之后的结果。它并不是很有用，你将在稍后发现如何获取更具体的解析器结果。\n\n你也可以尝试引入一些不是合法表达式的输入字符串。例如，你可以多写一个右括号：\n\
  \n```bash\n$ scala ParseExpr \"2 * (3 + 7))\"\ninput: 2 * (3 + 7))\n[1.12] failure:\
  \ expected ) found ')'\n\n2 * (3 + 7))\n           ^\n```\n\n在这里，`parseAll` 方法在右括号处发出了错误：期望\
  \ ')' 但发现了 ')'。\n\n### 33.3 基础解析器\n\n算术表达式的解析器提供了某些词类的解析器：`floatingPointNumber`。这个解析器继承自另一个特性\
  \ `JavaTokenParsers`，它识别序列。但如果需要解析一种与 Java 不同的格式怎么办？\n\n解析器是使用正则表达式的。例如，[列表 33.2]\
  \ 中的正则表达式解析器描述了标识符：\n\n```scala\nobject MyParsers extends Regexers {\n  val ident:\
  \ Parser[String] = \"\"\"a-zA-Z]\\w\"\"\".r\n}\n```\n\n`MyParsers` 对象继承自 `Regexers`，而\
  \ `TokenParsers` 的解析器组合排列在 `scala.util.parsing` 中。顶层特性是 `Parsers`，它定义了一个通用框架。更专门的是\
  \ `Regexers`，它需要字符序列。\n\n### 33.4 另一个示例：JSON\n\nJSON（JavaScript Object Notation）是一种流行的交换格式。在本节中，我们将展示如何为它编写一个解析器。这里是描述语法的语法：\n\
  \n```\nvalue ::= obj | arr | string | floatingPointNumber | null | true | false\n\
  obj ::= \"{\" members \"}\"\narr ::= \"[\" values \"]\"\nmembers ::= member | member\
  \ \",\"\nvalues ::= value | value \",\"\n```\n\nJSON 值可以是对象、数组、字符串或保留字 null、true、false。JSON\
  \ 对象是用逗号分隔的成员序列。每个成员都是字符串/值对，字符串和值之间用冒号分隔。最后，JSON 数组是可以用逗号分隔的值序列。作为一个示例，[列表 33.3]\
  \ 包含了以 JSON 对象格式的地址录。\n\n```json\n{\n  \"address-book\": {\n    \"name\": \"John\
  \ Smith\",\n    \"address\": {\n      \"street\": \"10 Market Street\",\n      \"\
  city\": \"San Francisco, CA\",\n      \"zip\": 94111\n    },\n    \"phone numbers\"\
  : [\n      \"408-338-4238\",\n      \"408-111-6892\"\n    ]\n  }\n}\n```\n\n使用 Scala\
  \ 的解析器组合，解析此类数据是直接的。完整的解析器如列表 33.4 所示。该解析器遵循算术表达式解析器相同的结构。它再次是 JSON 语法产生式的直接映射。产生式使用了一个简化语法的快捷：`repsec`\
  \ 组合器解析由给定分隔字符串分隔的可能的项序列。例如，在列表 33.4 的示例中，`repsec(member, \",\")` 解析由逗号分隔的成员项。除此之外，解析器中的产生式与文法的产生式完全对应，正如算术表达式解析器的情况一样。\n\
  \n\n\n\n```scala\nimport scala.util.parsing.combinator._\n\nclass JSON extends JavaTokenParsers\
  \ {\n\n  def value : Parser[Any] = obj | arr |\n                           stringLiteral\
  \ |\n                           floatingPointNumber |\n                        \
  \   \"null\" | \"true\" | \"false\"\n\n  def obj : Parser[Any] = \"{\"~repsep(member,\
  \ \",\")~\"}\"\n\n  def arr : Parser[Any] = \"[\"~repsep(value, \",\")~\"]\"\n\n\
  \  def member: Parser[Any] = stringLiteral~\":\"~value\n}\n```\n\n##### 列表 33.4\
  \ - 一个简单的 JSON 解析器。\n\n为了尝试这些 JSON 解析器，我们将稍微修改框架，使解析器在文件上操作而不是在命令行中：\n\n```scala\n\
  import java.io.FileReader\n\nobject ParseJSON extends JSON {\n  def main(args: Array[String])\
  \ = {\n    val reader = new FileReader(args(0))\n    println(parseAll(value, reader))\n\
  \  }\n}\n```\n\n该程序中的 `main` 方法首先创建了一个 `FileReader` 对象。然后它根据 JSON 语法的 `value` 产生式解析读取器返回的字符。注意\
  \ `parseAll` 和 `parse` 存在重载变：它们都可以接受字符序列或作为输入读取器作为第二个参数。\n\n如果你将列表 33.3 所示的“地址簿”对象保存到名为\
  \ `address-book.json` 的文件中并运行 `ParseJSON` 程序，你将得到：\n\n```bash\n $ scala ParseJSON\
  \ address-book.json\n  [13.4] parsed: (({~List(((\"address book\"~:)~(({~List(((\n\
  \  \"name\"~:)~\"John Smith\"), ((\"address\"~:)~(({~List(((\n  \"street\"~:)~\"\
  10 Market Street\"), ((\"city\"~:)~\"San Francisco\n  ,CA\"), ((\"zip\"~:)94111)))~})),\
  \ ((\"phone numbers\"~:)~(([~\n  List(\"408 338-4238\", \"408 111-6892\"))~]))))~}))))~})\n\
  ```\n\n### 33.5 解析器输出\n\n`ParseJSON` 程序成功地解析了 JSON 地址簿。然而，解析器的输出看起来很奇怪。它似乎是由输入的碎片通过列表和\
  \ `~` 组合组合在一起而成的序列。这种输出并不是非常实用。对于人类来说，它比输入更易读，但对于计算机来说也太混乱了，难以分析。是时候对此做处理了。\n\n\
  为了确定该做什么，你首先需要知道组合器框架中的各个解析器返回什么结果（前提是它们成功解析了输入）。以下是这些规则：\n\n1. 每个被写为字符串的解析器（例如：`\"\
  {\"` 或 `\":\"` 或 `\"null\"`）都返回解析后的字符串本身。\n\n2. 正则表达式解析器（如 `\"\"\"[a-zA-Z_]\\w*\"\
  \"\".r`）也返回解析后的字符串本身。继承自 `JavaTokenParsers` 特性的正则表达式解析器（如 `stringLiteral` 或 `floatingPointNumber`）情况也是如此。\n\
  \n3. 顺序组合 `P~Q` 返回 `P` 和 `Q` 的两个结果。这些结果在一个也写为 `~` 的例类实例中返回。因此，如果 `P` 返回 `\"true\"\
  ` 且 `Q` 返回 `\"?\"`，那么顺序组合 `P~Q` 返回 `~(\"true\", \"?\")`，打印为 `(true~?)`。\n\n4. 可选组合\
  \ `P | Q` 返回 `P` 或 `Q` 的结果，取决于哪一个成功。\n\n5. 重复 `rep(P)` 或 `repsep(P, separator)`\
  \ 返回所有 `P` 运行结果的列表。\n\n6. 可选项 `opt(P)` 返回 Scala `Option` 类型的实例。如果 `P` 成功并获得结果 `R`，则返回\
  \ `Some(R)`；如果 `P` 失败则返回 `None`。\n\n有了这些规则，你现在可以推断出为什么解析器的输出在之前的示例中是那样了。然而，输出仍然不方便。将一个\
  \ JSON 对象映射到表示 JSON 值含义的内部表示中会好得多。一种更自然的表示方式如下：\n\n* JSON 对象被表示为类型为 `Map[String,\
  \ Any]` 的 Scala map。每个成员都表示为一个键值对绑定。\n* JSON 数组被表示为类型为 `List[Any]` 的列表。\n* JSON\
  \ 字符串被表示为 `String`。\n* 数值字面量被表示为 `Double`。\n* 值 `true`、`false` 和 `null` 被表示为 Scala\
  \ 值。\n\n为了产生这种表示，你需要使用另一种解析器组合方式：`^^`。`^^` 运算符转换解析器的结果。使用该运算符的表达式形式为 `P ^^ f`，其中\
  \ `P` 是解析器，`f` 是函数。`P^^ f` 的解析方式与 `P` 相同。每当 `P` 返回某个结果 `R` 时，`P^^ f` 的结果就是 `f(R)`。\n\
  \n例如，这是一个解析浮点数并将其转换为 Scala `Double` 类型值的解析器：\n\n```scala\nfloatingPointNumber (_.toDouble)\n\
  ```\n\n这里是解析字符串 `\"true\"` 并返回 Scala 布尔值的解析器：\n\n```scala\n\"true\" ^^ (x => true)\n\
  ```\n\n\n\n\n\n### 表 33.1 - 解析器组合器总结\n\n| `\"...\"` | 字面面量 (literal) |\n| :--- |\
  \ :--- |\n| `\"...\".r` | 正则表达式 |\n| `P~Q` | 顺序组合 (sequential composition) |\n|\
  \ `P <~ Q, P ~> Q` | 顺序组合；仅保留左/右侧 |\n| `P \\| Q` | 选择 (alternative) |\n| `opt(P)`\
  \ | 选项 (option) |\n| `rep(P)` | 重复 (repetition) |\n| `repsep(P, Q)` | 交替重复 (interleaved\
  \ repetition) |\n| `P ^^ f` | 结果转换 |\n\n### 关闭分号推断\n\n注意列表 33.5 中的值解析器主体包含在括号内。这是一个禁用解析器表达式中分号推断的小技巧。你会在第\
  \ 4.2 节 中已经看到，Scala 会假设在任何两个在语法上可以分成独立语句的行之间存在分号，除非第一行以中缀运算符结尾，或者两行被包含在括号或方括号中。现在，你可以将\
  \ `|` 运算符写在每个选项的结尾，而不是下一个选项的开头，如下所示：\n\n```\n def value: Parser[Any] = \n   obj\
  \ |\n   arr |\n   stringLiteral |\n   ...\n```\n\n在这种情况下，值解析器主体就不需要括号了。然而，有些人人更倾向于看到\
  \ `|` 运算符出现在第二个选项的开头，而不是第一个选项的末尾。通常，这会导致两行之间出现意外的分号，如下：\n\n```\n obj;  // 隐插入的分号\n\
  \  | arr\n```\n\n分号改变了代码结构，导致编译失败。将整个表达式放在括号中可以避免分号并使代码能够正确编译。\n\n### 符号名称与字母数字名称\n\
  \n表 33.1 中的许多解析器组合器使用了符号名称。这既有优点也有缺点。缺点是，符号名称需要时间来学习。不熟悉 Scala 组合器解析库的用户可能无法理解 `~`、`~>`\
  \ 或 `^^` 的含义。优点是，符号名称很短，并且可以选择使其具有“正确”的优先级和结合性。例如，解析器组合器 `~`、`^^` 和 `|` 是刻意按照优先级从高到低的顺序选择的。一个典型的语法产生式由具有解析部分和转换部分的选项组成。解析部分通常包含若干个由\
  \ `~` 运算符运算符隔开的顺序项。通过选定的 `~`、`^^` 和 `|` 优先级，你可以编写这样的语法产生式而不需要任何括号。\n\n此外，符号运算符占据的视觉空间比字母运算符更少。这对于解析器来说很重要，因为它让你关注当前的语法，而不是组合器本身。为了看到区别，请想象一下顺序组合(`~`）被称为\
  \ `andThen`，而选择(`|`）被称为 `orElse`。那么列表 33.1 此处 中的算术表达式解析器看起来将如下：\n\n```\n class ArithHypothetical\
  \ extends JavaTokenParsers {   \n  def expr: Parser[Any]   = \n    term andThen\
  \ rep((\"+\" andThen term) orElse \n                      (\"-\" andThen term))\n\
  \  def term: Parser[Any]   = \n    factor andThen rep((\"*\" andThen factor) orElse\
  \ \n                      (\"/\" andThen factor))\n  def factor: Parser[Any] = \n\
  \    floatingPointNumber orElse \n      (\"(\" andThen expr andThen \")\")\n}\n\
  ```\n\n你会注意到代码变得长得多，而且在所有这些运算符和括号中很难“看出”语法。另一方面，一个接触组合器解析的新手可能能够更好地理解代码的意图。\n\n\
  ### 在符号名称和字母名称之间进行选择\n\n作为选择符号名称和字母名称的指南，我们建议如下：\n\n*   在符号名称已具有通用公认含义的情况下使用符号名称。例如，没有人会建议在数值加法中用\
  \ `add` 代替 `+`。\n*   否则，如果你希望你的代码能让普通读者读懂，请优先使用字母名称。\n*   对于特定领域的库，如果这在清晰性和可读性方面具有明显的优势，你仍然可以选择符号名称。\n\
  \n在特定领域库的情况下，我们预计普通读者可能无法立即理解代码。符号名称对专家来说具有明显的优势。\n\n### 33.6 实现解析器\n\n之前的章节已经展示了\
  \ Scala 提供了构建自定义解析器的方便方法。在本章的剩余部分中，你将查看解析器库的“内部”。你将看到什么是解析器，以及原始组合器是如何实现的。\n\nScala\
  \ 组合器框架的核心包含在 trait `scala.util.combinator.Parsers` 中。该 trait 定义了 `Parser` 类型以及所有的组合器。除非另有说明，在后续子节中解释的定义都位于此\
  \ trait 中。也就是说，假设它们包含在一个如下所示开始的 trait 中：\n\n```\n package scala.util.combinator\n\
  \ trait Parsers {\n  ... // 除非另有说明，否则代码在此\n }\n```\n\n`Parser` 本质上是从某些输入到解析结果的函数。作为初步近似，该类型可以写为：\n\
  \n```\n type Parser[T] = Input => ParseResult[T]\n```\n\n#### 解析器输入\n\n有时，解析器读取的是标记流而不是原始字符序列。这时使用独立的词法分析器将原始字符流转换为标记流。解析器的输入类型定义如下：\n\
  \n```\n type Input = Reader[Elem]\n```\n\n`Reader` 类来自 `scala.util.parsing.input`。它与\
  \ `Stream` 类似，但还会跟踪它读取的所有元素的位置。`Elem` 类型代表单个输入元素。它是 `Parsers` trait 的抽象类型成员：\n\n\
  ```\n type Elem\n```\n\n这意味着 `Parsers` 的子类和子 trait 需要将 `Elem` 实例化正在解析的输入元素的类型。例如，`RegexParsers`\
  \ 和 `JavaTokenParsers` 将 `Elem` 固定为 `Char`。但可以将 `Elem` 设置为其他类型，例如从独立词法器返回的标记类型。\n\
  \n#### 解析器结果\n\n解析器在给定输入上可能会成功或失败。因此，`ParseResult` 类有两个表示成功和失败的子类：\n\n```\n sealed\
  \ abstract class ParseResult[+T]\n  case class SuccessT extends ParseResult[T]\n\
  \  case class Failure(msg: String, in: Input) extends ParseResult[Nothing]\n```\n\
  \n\n\n\n\n`Success` 案例在其 `result` 参数中携带了从解析器返回的结果。解析器结果的类型是任意的；这就是为什么 `ParseResult`、`Success`\
  \ 和 `Parser` 都使用类型参数 `T` 进行泛化。类型参数 `T` 代表给定解析器所返回的种类。`Success` 还接受第二个参数 `in`，它指向紧接在解析器消耗的部分之后的输入。该字段对于解析器的链式调用是必须的，以便一个解析器可以在另一个解析器之后运行。注意，这是一种纯函数式的解析方法。输入不是作为副作用读取的，而是被保留在流中。解析器分析输入流的某部分，然后在其结果中返回剩余的部分。\n\
  \n`ParseResult` 的另一个子类是 `Failure`。该类接受一个消息作为参数，描述解析器失败的原因。像 `Success` 一样，`Failure`\
  \ 也接受剩余输入流作为第二个参数。这并不是为了链式调用（解析器在失败后不会继续执行），而是为了将错误消息置于输入流中的正确位置。\n\n注意，解析结果被定义为类型参数\
  \ `T` 协变的。也就是说，例如一个返回 `Strings` 作为结果的解析器与一个返回 `AnyRefs` 的解析器是兼容的。\n\n## Parser 类\n\
  \n之前将解析器描述为从输入到解析结果的函数的定义稍微过于简单了。之前的示例显示，解析器还实现了许多方法，例如用于两个解析器顺序组合的 `~` 以及用于它们备选组合的\
  \ `|`。因此，`Parser` 实际上是一个继承自函数类型 `Input => ParseResult[T]` 的类，并额外定义了这些方法：\n\n```\n\
  abstract class Parser[+T] extends (Input => ParseResult[T]) \n  { p =>\n    // 一个未指定的方法，用于定义\
  \ \n    // 此解析器的行为。\n    def apply(in: Input): ParseResult[T]\n\n    def ~ ...\n\
  \    def | ...\n    ...\n  }\n```\n\n由于解析器是函数（即继承自函数），它们需要定义一个 `apply` 方法。你在 `Parser`\
  \ 类中看到一个抽象的 `apply` 方法，但这仅仅是为了文档说明之，因为该方法在任何情况下都是从父类型 `Input => ParseResult[T]`\
  \ 继承的（回想一下，该类型是 `scala.Function1[Input, ParseResult[T]]` 的缩写）。在继承抽象 `Parser` 类的具体解析器中，仍需实现\
  \ `apply` 方法。这些解析器将在关于此别名的后续章节之后进行讨论。\n\n### 对此进行别名\n\n`Parser` 类的体开始于一个奇特的表达式：\n\
  \n```\nabstract class Parser[+T] extends ... { p =>\n```\n\n在类模板左大括号之后紧跟的类似 `id\
  \ =>` 子句会将标识符 `id` 定义为类中 `this` 的别名。这就像是你写了：\n\n```\nval id = this\n```\n\n在类体中，但\
  \ Scala 编译器知道 `id` 是 `this` 的别名。例如，你可以使用 `id.m` 或 `this.m` 访问类的对象私有成员 `m`；两者完全等价。如果\
  \ `id` 仅仅被定义为一个以 `this` 为右侧的 `val`，那么第一个表达式将无法编译，因为在这种情况下 Scala 编译器会将 `id` 视为一个普通的标识符。\n\
  \n你在 第 29.4 节 中见过这种语法，那里它被用于为 trait 提供自类型。当你需要访问外部类的 `this` 时，别名也可以是一个很好的缩写。这里有一个示例：\n\
  \n```\nclass Outer { outer =>\n  class Inner {\n    println(Outer.this eq outer)\
  \ // 打印输出: true\n  }\n}\n```\n\n该示例定义了两个嵌套类，`Outer` 和 `Inner`。在 `Inner` 内部，通过不同的表达式两次引用了\
  \ `Outer` 类的 `this` 值。第一个表达式显示了 Java 处理此类问题的方法：你可以在保留字 `this` 前面加上外部类的名称和点号；这样一个表达式就指向了外部类的\
  \ `this`。第二个表达式显示了 Scala 为你提供的替代方案。通过在 `Outer` 类中为 `this` 引入一个名为 `outer` 的别名，你也可以在内部类中直接引用此别名。如果你选择合适的别名名称，Scala\
  \ 的方法会更简洁，并且也能提高清晰度。你可以在这里和这里看到这些示例。\n\n### 单标记解析器\n\nTrait `Parsers` 定义了一个泛型解析器\
  \ `elem`，它可以用于解析任何单个标记：\n\n```\ndef elem(kind: String, p: Elem => Boolean) = \n\
  \  new Parser[Elem] {\n    def apply(in: Input) =\n      if (p(in.first)) Success(in.first,\
  \ in.rest)\n      else Failure(kind + \" expected\", in)\n  }\n```\n\n此解析器接受两个参数：一个描述应该解析什么种标记的\
  \ `kind` 字符串，以及一个针对 `Elems` 的谓词 `p`，指示该元素是否符合要解析的标记类别。\n\n将解析器 `elem(kind, p)` 应用于某些输入\
  \ `in` 时，输入流的第一个元素将通过谓词 `p` 测试。如果 `p` 返回 `true`，则解析器成功。其结果是元素本身，其剩余输入是从紧接在解析的元素之后开始的输入流。另一方面，如果\
  \ `p` 返回 `false`，则解析器失败并带有一个错误消息，指示期望什么类型的标记。\n\n### 顺序组合\n\n`elem` 解析器仅消耗单个元素。为了解析更有趣的短，你可以使用顺序组合运算符\
  \ `~` 将解析器连接起来。正如你之前看到的，`P~Q` 是一个解析器，它首先将 `P` 解析器应用于给定的输入字符串。然后，如果 `P` 成功，则 `Q`\
  \ 解析器应用于剩余输入。\n\n`~` 组合器被实现为 `Parser` 类中的一个方法。它的定义在列表 33.6 中。`~` 的结果类型是一个解析器，返回一个例类\
  \ `~` 的实例，元素类型为 `T` 和 `U`。类型表达式 `T~U` 仅仅是泛化类型 `~[T, U]` 的更易读的简写。通常，Scala 总是将二进制类型操作（如\
  \ `A op B`）解释为泛化类型 `op[A, B]`。这与模式匹配的情况类似，其中二进制模式 `P op Q` 也被解释为应用，*即*，`op(P, Q)`。\n\
  \n```\nabstract class Parser[+T] extends (Input => ParseResult[T]) \n  { p =>\n\
  \    // 一个未指定的方法，用于定义 \n    // 此解析器的行为。\n    def apply(in: Input): ParseResult[T]\n\
  \n    def ~ ...\n    def | ...\n    ...\n  }\n```\n\n##### 列表 33.6 - ~ 组合器方法。\n\n\
  ```\nabstract class Parser[+T] extends (Input => ParseResult[T]) \n  { p =>\n  \
  \  // ...\n    def ~U = new Parser[T~U] {\n      def apply(in: Input) = p(in) match\
  \ {\n        case Success(x, in1) => \n          q(in1) match {\n            case\
  \ Success(y, in2) => Success(~x, y), in2)\n            case failure => failure\n\
  \          }\n        case failure => failure\n      }\n    }\n  }\n```\n\n另外两个顺序组合运算符\
  \ `<~` 和 `~>` 可以像 `~` 一样定义，只是在计算结果的方式上进行微调。然而，一种更优雅的技术是根据 `~` 来定义它们：\n\n```\ndef\
  \ <~U: Parser[T] = \n  (p~q) ^^ { case x~y => x }\ndef ~>U: Parser[U] = \n  (p~q)\
  \ ^^ { case x~y => y }\n```\n\n\n\n\n\n另一种组合方式 `P | Q` 对给定的输入应用 `P` 或 `Q`。它首先尝试\
  \ `P`。如果 `P` 成功，则整个解析器以 `P` 的结果成功成功。否则，如果 `P` 失败，则在与 `P` 相同的输入上尝试 `Q`。此时 `Q` 的结果即为整个解析器的结果。\n\
  \n以下是 `|` 作为 `Parser` 类的一个方法的的定义：\n\n```scala\n def | (q: => Parser[T]) = new Parser[T]\
  \ {\n  def apply(in: Input) = p(in) match {\n    case s1 @ Success(_, _) => s1\n\
  \    case failure => q(in) \n  }\n}\n```\n\n注意，如果 `P` 和 `Q` 都失败，则错误信息将由 `Q` 决定。这种细微的选择将在后文\
  \ 第 33.9 节 中讨论。\n\n### 处理递归\n\n注意，方法 `~` 和 `|` 中的参数 `q` 是按名（by-name）传递的——其类型前面有\
  \ `=>`。这意味着实际的解析器参数在需要 `q` 时才会被评估，而这应该发生在 `p` 运行之后。使得编写递归解析器成为可能，例如下面这个解析由任意数量括号括起来的数字：\n\
  \n```scala\n def parens = floatingPointNumber | \"(\"~parens~\")\"\n```\n\n如果 `|`\
  \ 和 `~` 采用按值（by-value）参数，该定义将立即导致栈溢出而不会读取任何内容，因为 `parens` 的值出现在其右侧部分的中间。\n\n###\
  \ 结果转换\n\n`Parser` 类的最后一个方法转换解析器的结果。解析器 `P ^^ f` 仅当 `P` 成功时成功。在这种情况下，它返回使用函数 `f`\
  \ 转换后的 `P` 的结果。以下是该方法的实现：\n\n```scala\n def ^^ U: Parser[U] = new Parser[U] {\n\
  \    def apply(in: Input) = p(in) match {\n      case Success(x, in1) => Success(f(x),\
  \ in1)\n      case failure => failure\n    }\n  } // end Parser\n```\n\n### 不读取任何输入的解析器\n\
  \n还有两个不消耗任何输入的解析器：`success` 和 `failure`。解析器 `success(result)` 总是以给定的结果成功。解析器 `failure(msg)`\
  \ 总是以错误信息 `msg` 失败。两者都实现为 `Parsers` 特性中的方法，该外层特性还包含了 `Parser` 类：\n\n```scala\n def\
  \ successT = new Parser[T] {\n  def apply(in: Input) = Success(v, in)\n }\n  def\
  \ failure(msg: String) = new Parser[Nothing] {\n  def apply(in: Input) = Failure(msg,\
  \ in)\n  }\n```\n\n### 选项与重复\n\n在 `Parsers` 特性中还定义的选项和重复组合器 `opt`、`rep` 和 `repsep`。它们都是基于顺序组合、备选方案和结果转换实现的：\n\
  \n```scala\n def optT: Parser[Option[T]] = (\n    p ^^ Some(_)  \n  | success(None)\n\
  \  )\n\n  def repT: Parser[List[T]] = (\n    p~rep(p) ^^ { case x~xs => x :: xs\
  \ }  \n  | success(List())\n  )\n\n  def repsepT: Parser[List[T]] = (\n\n    p~rep(q~>\
  \ p) ^^ { case r~rs => r :: rs }  \n  | success(List())\n  )\n\n  } // end Parsers\n\
  ```\n\n### 33.7 字符串字面量与正则表达式\n\n你目前看到的解析器使用了字符串字面量和正则表达式。对这些支持来自 `RegexParsers`，它是\
  \ `Parsers` 的一个特性：\n\n```scala\n trait RegexParsers extends Parsers {\n```\n\n`RegexParsers`\
  \ 比 `Parsers` 更专门，它只适用于 `Elem` 类型的输入。它定义了两个方法 `literal` 和 `regex`，签名如下：\n\n```scala\n\
  \ implicit literal(s: String): Parser[String] = ...\n implicit regex(r: Regex):\
  \ Parser[String] = ...\n```\n\n注意，`literal` 和 `regex` 都有 `implicit` 修饰符，因此每当给出 `String`\
  \ 或 `Regex` 时它们都会自动应用。`RegexParsers` 还处理空格。为了做到这一点，它调用一个方法 `handleWhiteSpace`，该方法的默认定义为：\n\
  \n```scala\n protected handleSpace = \\s+\n```\n\n如果你对空格有不同的处理，可以使用正则表达式重写 `handleSpace`：\n\
  \n```scala\n object MyParsers extends RegexParsers {\n```\n\n### 33.8 词法分析与解析\n\n\
  语法分析的任务通常分为两个阶段。词法阶段识别输入中的单个单词并对其进行分类。其后是语法分析阶段，用于分析标记的序列。语法分析也被称为解析（parsing），尽管这种说法稍不精确，因为词法分析也可以被视为解析。\n\
  \nScala 的解析组合器为词法和语法分析提供了几个实用类。它们包含在两个子包中，每个子包负责一种分析：\n\n```scala\n scala.util.parsing.combinator.lexical\n\
  scala.util.parsing.combinator.syntactical\n```\n\n如果你想将解析器拆分为词法器和语法分析器，应该咨询这些包的\
  \ Scaladoc。但对于简单的解析器，之前所示的方法就足够了。对于词法分析，`Elem`：\n\n### 33.9 错误报告\n\n最后一个尚未涵盖的话：解析器如何发布错误信息？解析错误报告有些门门。一个问题是，当解析器拒绝某些输入时，它通常遇到了许多失败。每个备选方案都失败了，并且在每个选择点都是如此。众多失败中的哪一个应该作为错误信息发布给用户？\n\
  \nScala 解析库实现了一种简单的启发式：在所有失败中，选择发生位置最晚的那一个。换句话说，解析器选择了最长前缀，并发布描述为什么该前缀无法继续的错误信息。如果在该最新位置有多个失败点，则选择最后访问的那个。\n\
  \n例如，考虑在一个错误的地址簿上运行 JSON 解析器，该地址簿如下行开头：\n\n```json\n { \"name\": John,\n```\n\n\
  该短语的最长合法前缀是 `{\"name\": `。因此 JSON 解析器会将单词 John 标记为错误。JSON 解析器在此点期望一个值，但 John 是一个标识符，它不被视为值（可能是文档作者忘记了给名字加上引号）。解析器对该文档发布的错误信息如下：\n\
  \n```\n [1.13] failure: \"false\" expected but identifier John found\n\n  { \"name\"\
  : John,\n             ^\n```\n\n期望 \"false\" 的部分来自于 \"false\" 是 JSON 语法中值产生式中的最后一个备选方案。因此，这是该点的最后一次失败。详细了解\
  \ JSON 语法的用户可以重构错误信息，但对于非专家来说，这个错误信息可能会让他们感到意外，并且可能具有很大的误导性。\n\n\n\n\n\n通过在值生成的最后一个备选方案中添加“全捕获”失败点，可以设计出更好的错误信息：\n\
  \n```\n def value: Parser[Any] =\n  obj | arr | stringLit | floatingPointNumber\
  \ | \"null\" |\n  \"true\" | \"false\" | failure(\"illegal start of value\")\n```\n\
  \n这种添加不会改变被接受为有效文档的输入集。它的作用是改进错误信息，因为现在显式添加的失败将作为最后一个备选方案出现并被报告：\n\n```\n [1.13]\
  \ failure: illegal start of value\n\n  { \"name\": John,\n               ^\n```\n\
  \n“最晚可能”错误报告方案的实现使用了 trait `Parsers` 中一个名为 `lastFailure` 的字段，用于标记发生在输入中最晚位置的失败：\n\
  \n```\n var lastFailure: Option[Failure] = None\n```\n\n该字段初始化为 `None`。它在 `Failure`\
  \ 类的构造函数中被更新：\n\n```\n case class Failure(msg: String, in: Input) \n    extends\
  \ ParseResult[Nothing] {\n\n  if (lastFailure.isDefined && \n      lastFailure.get.in.pos\
  \ <= in.pos)\n    lastFailure = Some(this)\n}\n```\n\n该字段由 `phrase` 方法读取，如果解析器失败，该方法会输出最终错误信息。以下是\
  \ trait `Parsers` 中 `phrase` 的实现：\n\n```\n def phraseT = new Parser[T] {\n  lastFailure\
  \ = None\n  def apply(in: Input) = p(in) match {\n    case s @ Success(out, in1)\
  \ =>\n      if (in1.atEnd) s \n      else Failure(\"end of input expected\", in1)\n\
  \    case f : Failure => \n      lastFailure\n  }\n}\n```\n\n`phrase` 方法运行其参数解析器\
  \ `p`。如果 `p` 在输入被完全消耗的情况下成功，则返回 `p` 的成功结果。如果 `p` 成功但输入未被完全读取，则返回一个消息为“end of input\
  \ expected”的失败。如果 `p` 失败，则返回存储在 `lastFailure` 中的失败或错误。注意，对 `lastFailure` 的处理是非函数式的；它是通过\
  \ `Failure` 的构造函数和 `phrase` 方法本身作为副作用更新的。相同方案的函数式版本是可能的，但它需要将 `lastFailure` 值传递到每个解析结果中，无论该结果是\
  \ `Success` 还是 `Failure`。\n\n### 33.10 回溯与 LL(1)\n\n解析器组合器使用回溯在备选方案中的不同解析器之间进行选择。在表达式\
  \ `P | Q` 中，如果 `P` 失败，则 `Q` 将在与 `P` 相同的输入上运行。即使 `P` 在失败之前已经解析了一些标记，情况也是如此。在这种情况下，`Q`\
  \ 将再次解析相同的标记。\n\n回溯仅对如何制定可以被解析的语法施加了少数限制。基本上，你只需要避免左递归产生式。如下的产生式：\n\n| expr | ::=\
  \ | expr + term | term. |\n\n它将始终失败，因为 `expr` 会立即调用自己，从而永远无法进一步进展[[1]](#combinator-parsing.html_footnotemain33-1)。另一方面，回溯的代价可能是昂贵的，因为相同的输入可能会被多次解析。例如考虑产生式：\n\
  \n| expr | ::= | term + expr | term. |\n\n如果将 `expr` 解析器应用于诸如 `(1 + 2) * 3` 这样的构成合法\
  \ `term` 的输入会发生什么？将会尝试第一个备选方案，并在匹配 `+` 号时失败。然后将在同一个 `term` 上尝试第二个备选方案，并成功。最终，该 `term`\
  \ 被解析了两次。\n\n通常可以通过修改语法来避免回溯。例如，在算术表达式的情况下，这种修改是可能的：\n\n| expr | ::= | term + expr\
  \ |\n\n| expr | ::= | term + term |\n\n许多语言允许“LL(1)”语法[[2]](#combinator-parsing.html_footnotemain33-2)。当从组合器解析构造解析器时，它可以构建上下文无关文法。\n\
  \n### 33.11 结论\n\n你现在已经看到了 Scala 组合器框架的所有要素。对于实用的代码非常少。使用该框架，你可以为许多类语法构造解析器。\n\n\
  组合器解析器的一个缺点是它们的效率不高，至少与从 Yacc 或 Bison 等专用工具生成的解析器相比。这有两个原因。首先，组合器解析使用的回溯方法本身效率不高。取决于语法和输入，它可能会导致指数级的减慢。可以通过使语法变为\
  \ LL(1) 并使用组合运算符 `~` 来解决。\n\n影响组合器解析器的第二个问题是它们将解析器构造和分析混合在同一组操作中。实际上，每次都会重新生成解析器。\n\
  \n这个问题可以克服，但它需要解析器框架的重新实现。在优化框架中，解析器将不再表示为从输入到解析结果的函数。相反，它将被表示为树，其中每个构造步骤都表示为一个类。例如，顺序组合由\
  \ `Seq` 类表示，备选方案由 `Alt` 类表示，依此类推。最外解析器方法 `phrase` 然后可以获取这种解析器的符号表示并将其转换为高效的解析表。\n\
  \n这一切的棒之处在于，从用户的角度来看，与普通的组合器解析器相比没有任何变化。用户仍然使用 `ident`、`floatingPointNumber`、`~`、`|`\
  \ 等编写解析器。他们不需要知道这些方法生成的是解析器的符号表示而不是解析器函数。由于 `phrase` 组合器将这些表示转换为真正的解析器，一切都如以前一样工作。\n\
  \n\n\n\n目前，Scala 还没有编写这样一种优化的解析器生成器。但这样做是完全可能的。如果有人贡献了这样一个生成器，它将很容易被集成到 Scala 标准库中。然而，即使假设在未来的某个时刻会存在这样的生成器，我们仍然有理由保留目前的解析器组合框架（parser\
  \ combinator framework）。它比解析器生成器更容易理解和适应，除非你需要解析非常大的输入，否则速度上的差异在实践中通常并不重要。\n\n***\n\
  \n#### 第 33 章脚注：\n\n[1] 即使在存在左的情况下，也有方法避免栈溢出，但这需要一个更精细的解析器组合框架，该框架目前尚未实现。\n\n[2]\
  \ Aho, *et. al.*, *Compilers: Principles, Techniques, and Tools*. [[Aho86]](#bibliography.html_aho-sethi-ullman)\n\
  \n[3] Aho, *et. al.*, *Compilers: Principles, Techniques, and Tools*. [[Aho86]](#bibliography.html_aho-sethi-ullman)\n\
  \n# 第 34 章\n\n# GUI 编程\n\n在本章中，你将学习如何开发使用图形用户界面（GUI）的 Scala 应用程序。我们将开发的基于一个 Scala\
  \ 库，该库提供了对 Java Swing GUI 类框架的访问。从概念上讲，Scala 库类似于底层的 Swing 类，但隐藏了它们的大部分复杂性。你会发现，使用该框架开发\
  \ GUI 应用程序实际上非常简单。\n\n即使有了 Scala 的简化，像 Swing 这样的框架仍然非常丰富，包含许多不同的类，每个类中都有许多方法。要在这样一个丰富的库中找到路径，使用如\
  \ Scala 的 Eclipse 插件之类的 IDE 会很有帮助。优点是 IDE 可以通过其命令补全交互式向你展示某个包中有哪些类，以及你引用的对象可以使用哪些方法。当你第一次探索陌库空间时，这会显著加快你的学习速度。\n\
  \n| ![image images/firstSwingAppLittleGray96.png](img/firstSwingAppLittleGray96.png)\
  \ | ![image images/firstSwingAppBigGray96.png](img/firstSwingAppBigGray96.png) |\n\
  \n##### 图 34.1 - 一个简单的 Swing 应用程序：初始（左）和调整大小后的（右）。\n\n### 34.1 第一个 Swing 应用程序\n\n\
  作为第一个 Swing 应用程序，我们将从一个包含单个按钮的窗口开始。要用 Swing 编程，你需要从 Scala 的 Swing API 包中导入各种类：\n\
  \n```scala\nimport scala.swing._\n```\n\nListing 34.1 显示了你在 Scala 中编写的第一个 Swing\
  \ 应用程序的代码。如果你编译并运行该文件，你应该能看到如图 34.1 左侧所示的窗口。窗口可以调整为更大的尺寸，如图 34.1 右侧所示。\n\n```scala\n\
  import scala.swing._\n\n  object FirstSwingApp extends SimpleSwingApplication {\n\
  \    def top = new MainFrame {\n      title = \"First Swing App\"\n      contents\
  \ = new Button {\n        text = \"Click me\"\n      }\n    }\n  }\n```\n\n#####\
  \ 列表 34.1 - Scala 中的简单 Swing 应用程序。\n\n如果你逐行分析 Listing 34.1 中的代码，你会注意到以下元素：\n\n```scala\n\
  object FirstSwingApp extends SimpleSwingApplication {\n```\n\n在 `import` 之后的第一行，`FirstSwingApp`\
  \ 对象继承自 `scala.swing.SimpleSwingApplication`。该应用程序与传统的命令行应用程序不同，后者可能继承自 `scala.App`。`SimpleSwingApplication`\
  \ 类已经定义了一个 `main` 方法，其中包含了用于 Java Swing 框架的一些设置代码。`main` 方法接着调用了你提供的 `top` 方法：\n\
  \n```scala\ndef top = new MainFrame {\n```\n\n下一行实现了 `top` 方法。该方法包含了定义你的顶层 GUI 组件的代码。这通常是某种类型的\
  \ `Frame`——即一个可以包含任意数据的窗口。在 Listing 34.1 中，我们选择了 `MainFrame` 作为顶层组件。`MainFrame`\
  \ 就像一个普通的 `Swing Frame`，不同之处在于关闭它也会同时关闭整个 GUI 应用程序。\n\n```scala\ntitle = \"First\
  \ Swing App\"\n```\n\nFrame 许多许多属性。其中最重要的两个是框架的标题（将写在标题栏上）和它的内容（将显示在窗口本身）。在 Scala\
  \ 的 Swing API 中，这些属性被建模为属性。你从第 18.2 节知道属性被编码为属性。\n\n### 34.2 面与布局\n\n下一步，我们将向顶层框架添加一些文本作为元素。图\
  \ 34.2 左侧显示了应用程序应该的样子。\n\n| ![image images/noClicksGray96.png](img/noClicksGray96.png)\
  \ | ![image images/sevenClicksGray96.png](img/sevenClicksGray96.png) |\n\n#####\
  \ 图 34.2 - 响应式应用程序：初始（左）和点击后的（右）。\n\n```scala\nimport scala.swing._\n\n  object\
  \ SecondSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame {\n\
  \      title = \"Second Swing App\"\n      button = new Button {\n        text =\
  \ \"Click me\"\n      }\n      label = new Label {\n        text = \"No button clicks\"\
  \n      }\n      contents = new BoxPanel(Orientation.Vertical) {\n        contents\
  \ += button\n        contents += label\n        border = Swing.EmptyBorder(30, 30,\
  \ 10, 30)\n      }\n    }\n  }\n```\n\n##### 列表 34.2 - 面板上的组件装配。\n\n你在上一节中看到框架恰好包含一个子组件。因此，为了创建一个既有按钮又有标签的框架，你需要创建一个包含这两者的不同容器组件。这就是面板（panel）的作用。`Panel`\
  \ 是一个容器，它根据固定的布局规则显示它包含的所有组件。有许多不同的布局通过 `Panel` 类的各种子类实现，从简单到非常复杂不等。事实上，复杂的 GUI\
  \ 应用程序最困难的部分之一就是调整好布局——要设计出在所有设备和所有窗口尺寸下显示都良好的布局并不容易。\n\nListing 34.2 显示了一个完整的实现。在这个类中，顶层框架的两个子组件命名为\
  \ `button` 和 `label`。按钮的定义与之前一样。标签是一个不可编辑的文本字段：\n\n```scala\nval label = new Label\
  \ {\n  text = \"No button clicks\"\n}\n```\n\n\n\n\nListing 34.2 中的代码选择了一个简单的垂直布局，组件在\
  \ `BoxPanel` 中垂直堆叠在一起：\n\n```\ncontents = new BoxPanel(Orientation.Vertical) {\n\
  ```\n\n`BoxPanel` 的 `contents` 属性是一个（初始为空的）缓冲区，通过 `+=` 运算符向其添加按钮和标签元素：\n\n```\n\
  contents += button\ncontents += label\n```\n\n我们还通过给面板的 `border` 属性赋值，为这两个对象周围添加了内边框：\n\
  \n```\nborder = Swing.EmptyBorder(30, 30, 10, 30)\n```\n\n与其他 GUI 组件一样，边框是以对象形式表示的。`EmptyBorder`\
  \ 是对象 `Swing` 中的一个工厂方法，它接受四个参数，分别表示要绘制的对象的上、右、下、左边的边框宽度。\n\n虽然这个示例很简单，但它已经展示了构建\
  \ GUI 应用的基本方法。它是由组件构建的，这些组件是 `scala.swing` 类的实例，例如 `Frame`、`Panel`、`Label` 或 `Button`。组件具有属性，这些属性可以通过应用程序自定义。`Panel`\
  \ 组件可以在其 `contents` 属性中包含多个其他组件，因此一个 GUI 应用最终由一个组件树组成。\n\n### 34.3 处理事件\n\n另一方面，应用程序仍然缺少一个核心属性。如果你运行\
  \ Listing 34.2 中的代码并点击显示的按钮，什么也不会发生。事实上，该应用程序是完全静态的；除了顶层框架的关闭按钮（会终止应用程序）外，它不会以任何方式对用户事件做出反应。因此，下一步，我们将完善应用程序，使其在显示按钮的同时显示一个标签，指示按钮被点击的次数。图\
  \ 34.2 的右侧部分包含了在点击几次按钮后应用程序应该呈现的快照。\n\n为了实现这种行为，你需要将用户输入事件（按钮被点击）与动作（更新显示的标签）连接起来。Java\
  \ 和 Scala 在事件处理方面从根本上具有相同的“发布/订阅”方法：组件可以是发布者和/或订阅者。发布者发布事件。订阅者通过订阅发布者来接收任何发布事件的通知。发布者也称为“事件源”，订阅者也称为“事件监听器”。例如，`Button`\
  \ 是一个事件源，它发布一个名为 `ButtonClicked` 的事件，表示按钮被点击。\n\n在 Scala 中，订阅事件源 `source` 是通过调用\
  \ `listenTo(source)` 完成的。另一种方法是通过 `deafTo(source)` 从事件源取消订阅。在当前的示例应用程序中，首要工作是让顶层框架监听它的按钮，这样它就能接收按钮发出的任何事件。要这样做，你需要在顶层框架的主体中添加以下调用：\n\
  \n```\nlistenTo(button)\n```\n\n接收事件通知只是故事的一半；另一半是处理这些事件。这正是 Scala Swing 框架与 Java\
  \ Swing API 差异最大（且从上简单得多）的地方。在 Java 中，信号事件意味着在一个必须实现某些 `Listener` 接口的对象中调用“notify”方法。通常，这涉及到大量的间接层和样板代码，使得事件处理类应用程序难以编写和阅读。相比之下，在\
  \ Scala 中，事件是一个真实的对象，就像消息发送给 actor 一样发送给订阅组件。例如，按下按钮将创建一个事件，该事件是以下 `case class`\
  \ 的实例：\n\n```\ncase class ButtonClicked(source: Button)\n```\n\n该 case class 的参数引用被点击的按钮。与所有其他\
  \ Scala Swing 事件一样，此事件类包含在名为 `scala.swing.event` 的包中。\n\n要让你的组件对传入的事件做出反应，你需要向一个名为\
  \ `reactions` 的属性添加处理器。以下是实现此操作的代码：\n\n```\nvar nClicks = 0\nreactions += {\n  case\
  \ ButtonClicked(b) =>\n    nClicks += 1\n    label.text = \"Number of button clicks:\
  \ \" + nClicks\n}\n```\n\n上面的第一行定义了一个变量 `nClicks`，它存储按钮被点击的次数。其余行将大括号之间的代码作为处理器添加到顶层框架的\
  \ `reactions` 属性中。处理器是通过对事件进行模式匹配（pattern matching）定义的函数，就像 Akka actor（注：此处原文应为\
  \ actor）接收方法是通过对消息进行模式匹配来定义的一样。上面的处理器匹配形式为 `ButtonClicked(b)` 的事件，*即*任何作为 `ButtonClicked`\
  \ 类实例的事件。模式变量 `b` 指向被点击的实际按钮。代码中对应此事件的动作增加了 `nClicks` 并更新了标签的文本。\n\n通常，处理器是一个 `PartialFunction`，它对事件进行匹配并执行某些动作。也可以在单个处理器中使用多个\
  \ `case` 来匹配超过一种种类的事件。\n\n```\nimport scala.swing._\nimport scala.swing.event._\n\
  \nobject ReactiveSwingApp extends SimpleSwingApplication {\n  def top = new Frame\
  \ {\n    title = \"Reactive App\"\n    button = new Button {\n      text = \"Click\
  \ me\"\n    }\n    label = new Label {\n      text = \"No clicks registered\"\n\
  \    }\n    contents = new BoxPanel(Orientation.Vertical) {\n      contents += button\n\
  \      contents += label\n      border = Swing.EmptyBorder(30, 30, 10, 30)\n   \
  \ }\n    listenTo(button)\n    var nClicks = 0\n    reactions += {\n      case ButtonClicked(b)\
  \ =>\n        nClicks += 1\n        label.text = \"Number of button clicks: \" +\
  \ nClicks\n    }\n  }\n}\n```\n\n##### Listing 34.3 - 实现一个响应式 Swing 应用\n\n`reactions`\
  \ 属性实现了一个集合，就像 `contents` 属性一样。某些组件带有预定义的反应。例如，`Frame` 有一个预定义的反应，当用户按下关闭按钮时关闭它。如果你通过\
  \ `+=` 向 `reactions` 属性添加自己的反应，你定义的反应将与标准反应一起考虑。概念上，安装的处理器形成了一个栈。在当前示例中，如果顶层框架接收到事件，第一个尝试的处理器将是\
  \ `ButtonClicked`，因为它是最后一个安装的处理器。如果接收到的事件是 `ButtonClicked` 类型，则与之关联的代码将被调用。在该代码执行完成后，系统将在事件栈中搜索其他可能适处理器。如果接收到的事件不是\
  \ `ButtonClicked` 类型，事件将立即传播到剩余的处理器栈。也可以使用 `-=` 运算符从反应属性中移除处理器。\n\n\n\n\n\n```\n\
  \ import swing._\n  import event._\n\n  object TempConverter extends SimpleSwingApplication\
  \ {\n    def top = new MainFrame {\n      title = \"Celsius/Fahrenheit Converter\"\
  \n      object celsius extends TextField { columns = 5 }\n      object fahrenheit\
  \ extends TextField { columns = 5 }\n      contents = new FlowPanel {\n        contents\
  \ += celsius\n        contents += new Label(\"  Celsius  =  \")\n        contents\
  \ += fahrenheit\n        contents += new Label(\"  Fahrenheit\")\n        border\
  \ = Swing.EmptyBorder(15, 10, 10, 10)\n      }\n      listenTo(celsius, fahrenheit)\n\
  \      reactions += {\n        case EditDone(`fahrenheit`) =>\n          val f =\
  \ fahrenheit.text.toInt\n          val c = (f - 32) * 5 / 9\n          celsius.text\
  \ = c.toString\n        case EditDone(`celsius`) =>\n          val c = celsius.text.toInt\n\
  \          val f = c * 9 / 5 + 32\n          fahrenheit.text = f.toString\n    \
  \  }      \n    }\n  }\n```\n\n##### 列表 34.4 - 温度转换器的实现。\n\n### 34.4 示例：摄氏度华氏度转换器\n\
  \n作为另一个示例，我们将编写一个 GUI 程序，在摄氏度和华氏度之间进行温度转换。程序的用户界面如图 34.3 所示。它由两个文本字段（用白色显示）组成，每个字段后面跟着一个标签。一个文本字段显示摄氏度，另一个显示华氏度。这两个字段中的任何一个都可以由应用程序的用户编辑。一旦用户更改了任一字段中的温度，另一个字段中的温度应该自动更新。\n\
  \n列表 34.4 显示了实现此程序的完整代码。代码顶部的导入使用了简写形式：\n\n```\n import swing._\n  import event._\n\
  ```\n\n这实际上等同于之前使用的导入：\n\n```\n import scala.swing._\n  import scala.swing.event._\n\
  ```\n\n你之所以可以使用这种简写的原因是 Scala 中的包是嵌套的。因为包 `scala.swing` 包含在包 `scala` 中，且该包中的所有内容都会自动导入，你可以只需写\
  \ `swing` 来引用该包。同样，包 `scala.swing.event` 作为子包 `event` 包含在包 `scala.swing` 中。由于你已经在第一个导入中了\
  \ `scala.swing` 中的所有内容，之后你可以可以使用 `event` 来引用事件包。\n\n`TempConverter` 中的两个组件 `celsius`\
  \ 和 `fahrenheit` 是 `TextField` 类的对象。Swing 中的 `TextField` 是一个允许你编辑单行文本的组件。它有一个默认宽度，由\
  \ `columns` 属性以字符计数给出（两个字段都设置为 5）。\n\n`TempConverter` 的内容被组装进面板中，该面板包含了两个文本字段和两个解释字段含义的标签。面板是\
  \ `FlowPanel` 类，这意味着它会根据框架的宽度在一个行或多行中按顺序显示所有元素。\n\n`TempConverter` 的反应（reactions）由包含两个用例（case）的处理器定义。每个用例匹配两个文本字段之一的\
  \ `EditDone` 事件。当文本字段被用户编辑时，就会发布此类事件。注意模式的形式，元素名称周围带有反引号（back ticks）：\n\n```\n case\
  \ EditDone(`celsius`)\n```\n\n正如第 15.2 节 所述，`celsius` 周围的反引号确保了只有当事件源是 `celsius`\
  \ 对象时模式才会匹配。如果你省略了反引号并只写 `case EditDone(celsius)`，该模式将匹配每个 `EditDone` 类的事件。更改的字段将存储在模式变量\
  \ `celsius` 中。显然，这并不是你想要的。或者，你也可以用大写字母定义两个 `TextField` 对象，例如 `Celsius` 和 `Fahrenheit`。在这种情况下，你可以直接匹配它们而无需反引号，如\
  \ `case EditDone(Celsius)`。\n\n`EditDone` 事件的两个动作将将一个量值转换为另一个量值。每个动作都从读取被修改字段的内容并进行转换开始。\n\
  \n### 34.5 总结\n\n本章让你初步接触了使用 Scala 进行 GUI 编程。它展示了如何组装 GUI 组件、如何自定义它们的属性以及如何处理事件。由于空间限制，我们只能讨论少数几个组件。你可以通过查阅\
  \ `scala.swing` 包来了解它们。下一节将开发一个大型应用程序的示例。\n\n* *\n\n#### 第 34 的脚注：\n\n[1] 参见，例如*The\
