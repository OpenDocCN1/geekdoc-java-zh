  \n## 第 17 章：使用其他集合\n\nScala 拥有丰富的集合库。本章将带你浏览最常用的集合类型和操作，展示你将最频繁使用的部分。第 24 章将提供对可用内容的更全面介绍，第\
  \ 25 章将展示如何使用 Scala 的组合结构来提供如此丰富的 API。\n\n### 17.1 序列 (Sequence)\n\n序列类型允许你处理有序的数据组。因为元素是有序的，你可以请求第一个元素、第二个元素、第\
  \ 103 个元素等。在本节中，我们将快速介绍最重要的序列。\n\n### 列表 (Lists)\n\n可能最重要的序列类型是 `List` 类，它是上一章中详细描述的不可变链表。列表支持在列表开头快速添加和删除项，但它们不提供对任意索引的快速访问，因为其实实现必须线性遍历列表。\n\
  \n这种特性的组合听起来可能很奇怪，但它们恰恰击中了许多算法非常适用的平衡点。初始元素的快速添加和删除意味着模式匹配运行良好，如第 15 章所述。列表的不可变性有助于你开发正确、高效的算法，因为你永远不需要复制列表。\n\
  \n这里有一个短的示例，展示了如何初始化列表并访问其头部和尾部：\n\n```\nscala> val colors = List(\"red\", \"blue\"\
  , \"green\")\n  colors: List[String] = List(red, blue, green)\n\n  scala> colors.head\n\
  \  res0: String = red\n\n  scala> colors.tail\n  res1: List[String] = List(blue,\
  \ green)\n```\n\n关于列表的复习，请参见第 3 章中的第 8 步。你可以在第 16 章中找到使用列表的细节。列表将在第 22 章](#implementing-lists.html)中再次讨论，该章节提供了关于\
  \ Scala 中如何实现列表的见解。\n\n### 数组 (Arrays)\n\n数组允许你持有元素序列，并可以使用从零开始的索引高效访问任意位置的元素（以获取或更新）。以下是创建一个已知大小但未知元素值的数组的方法：\n\
  \n```\nscala> val fiveInts = new ArrayInt\n  fiveInts: Array[Int] = Array(0, 0,\
  \ 0, 0)\n```\n\n以下是在你已知元素值时初始化数组的方法：\n\n```\nscala> val fiveToOne = Array(5, 4,\
  \ 3, 2, 1)\n  fiveToOne: Array[Int] = Array(5, 4, 3, 2, 1)\n```\n\n如前所述，Scala 中通过括号访问数组。这是一个访问并更新元素的示例：\n\
  \n```\nscala> fiveInts(0) = 4\n\nscala> fiveInts\n  res3: Array[Int] = Array(4,\
  \ 0, 0, 0, 0)\n```\n\n数组的表示方式与 Java 相同。因此你可以无缝使用现有的 Java 方法 #other-collections.html)。你已经多次看到数组的应用了。基础知识在[第\
  \ 7 步。使用 `for` 表达式遍历数组的示例在 7.3 节。\n\n### 列表缓冲区 (List buffers)\n\n`List` 类提供了快速访问列表头部的方法。因此，当你需要通过向末尾添加来构建列表时，考虑通过向头部插入元素来反向构建列表。完成后，调用\
  \ `reverse` 以所需的顺序获取元素。\n\n另一种避免 `reverse` 操作的方案是使用 `ListBuffer`。`ListBuffer` 是一个可变对象（位于\
  \ `scala.mutable` 包），当你需要添加时它可以帮助更高效地构建列表。`ListBuffer` 提供常量时间的添加和插入操作。你使用 `+=` 运算符添加元素，使用\
  \ `+=:` 运算符在头部插入。构建完成后，可以通过在 `ListBuffer` 上调用 `toList` 获取一个 `List`。这里有一个示例：\n\n\
  ```\nscala> import scala.collection.mutable.ListBuffer\nimport scala.collection.mutable.ListBuffer\n\
  \nscala> val buf = new ListBuffer[Int]\n  buf: scala.collection.mutable.ListBuffer[Int]\
  \ = ListBuffer()\n\nscala> buf += 1\n  res4: buf.type = ListBuffer(1)\n\n  scala>\
  \ buf += 2\n  res5: buf.type = ListBuffer(1, 2)\n\n  scala> buf\n  res6: scala.collection.mutable.ListBuffer[Int]\
  \ =\n    ListBuffer(1, 2)\n\n  scala> 3 +=: buf\n  res7: buf.type = ListBuffer(3,\
  \ 1, 2)\n\n  scala> buf.toList\n  res8: List[Int] = List(3, 1, 2)\n```\n\n\n\n使用\
  \ `ListBuffer` 而不是 `List` 的另一个原因是防止潜在的栈溢出。如果你可以通过前置元素来按所需的顺序构建列表，但所需的递归算法不是尾递归的，那么你可以使用\
  \ `for` 表达式或 `while` 循环以及 `ListBuffer` 来代替。你将在第 22.2 节看到这样使用 `ListBuffer`。\n\n##\
  \ Array 缓冲区\n\n`ArrayBuffer` 类似于数组，区别在于你可以额外从序列的开头和结尾添加或删除元素。所有的数组操作都可用，但由于实现中包含了一层包装，速度会慢一些。新的添加和删除操作的平均复杂度为常数级，但由于实现需要分配一个新数组来存放缓冲区的内容，偶尔需要线性级的时间。\n\
  \n要使用 `ArrayBuffer`，你必须先从 `mutable` 集合包中导入它：\n\n```\nscala> import scala.collection.mutable.ArrayBuffer\n\
  \  import scala.collection.mutable.ArrayBuffer\n```\n\n当你创建一个 `ArrayBuffer` 时，必须指定一个类型参数，但不需要指定长度。`ArrayBuffer`\
  \ 会根据需要自动调整分配的空间：\n\n```\nscala> val buf = new ArrayBuffer[Int]()\n  buf: scala.collection.mutable.ArrayBuffer[Int]\
  \ = \n  ArrayBuffer()\n```\n\n你可以使用 `+=` 方法向 `ArrayBuffer` 中追加元素：\n\n```\nscala>\
  \ buf += 12\n  res9: buf.type = ArrayBuffer(12)\n\n  scala> buf += 15\n  res10:\
  \ buf.type = ArrayBuffer(12, 15)\n\n  scala> buf\n  res11: scala.collection.mutable.ArrayBuffer[Int]\
  \ = \n      ArrayBuffer(12, 15)\n```\n\n所有的普通数组方法都可用。例如，你可以询问 `ArrayBuffer` 的 `length`，或者通过其索引检索元素：\n\
  \n```\nscala> buf.length\n  res12: Int = 2\n\n  scala> buf(0)\n  res13: Int = 12\n\
  ```\n\n## 字符串（通过 StringOps）\n\n另一个需要注意的序列是 `StringOps`，它实现了许多序列方法。由于 `Predef` 有从\
  \ `String` 到 `StringOps` 的隐式转换，你可以将任何字符串视为序列。这里有一个示例：\n\n```\nscala> def hasUpperCase(s:\
  \ String) = s.exists(_.isUpper)\n  hasUpperCase: (s: String)Boolean\n\n  scala>\
  \ hasUpperCase(\"Robert Frost\")\n  res14: Boolean = true\n\n  scala> hasUpperCase(\"\
  e e cumnings\")\n  res15: Boolean = false\n```\n\n在这个示例中，`exists` 方法是在 `hasUpperCase`\
  \ 方法体内的名为 `s` 的字符串上被调用的。由于 `String` 类本身没有声明名为 `\"exists\"` 的方法，Scala 编译器将隐式地将 `s`\
  \ 转换为 `StringOps`，后者拥有该方法。`exists` 方法将字符串视为字符序列，如果任何一个字符是大写字母，则返回 true。[[2]](#working-with-other-collections.html_footnotemain17-2)\n\
