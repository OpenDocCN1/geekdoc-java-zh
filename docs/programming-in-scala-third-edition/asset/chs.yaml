  \  xs: List[Int] = List(1, 2, 3, 4, 5)\n\n  scala> val git = xs grouped 3\n  git:\
  \ Iterator[List[Int]] = non-empty iterator\n\n  scala> git.next()\n  res2: List[Int]\
  \ = List(1, 2, 3)\n\n  scala> git.next()\n  res3: List[Int] = List(4, 5)\n\n  scala>\
  \ val sit = xs sliding 3\n  sit: Iterator[List[Int]] = non-empty iterator\n\n  scala>\
  \ sit.next()\n  res4: List[Int] = List(1, 2, 3)\n\n  scala> sit.next()\n  res5:\
  \ List[Int] = List(2, 3, 4)\n\n  scala> sit.next()\n  res6: List[Int] = List(3,\
  \ 4, 5)\n```\n\n`Iterable` true 增加了其他方法到 `Traversable` 中，这些方法只有在可用迭代器时才能被高效实现。它们总结在\
  \ 表 24.2 中：\n\n##### 特性 `Iterable` 中的操作\n\n| 什么是 | 它的作用 |\n\n| --- | --- |\n| 抽象方法:\
