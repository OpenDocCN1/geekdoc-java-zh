  Hello, reader!\")\n```\n\n# 第 1 章\n\n## 可扩展的语言\n\nScala 的名字代表“可扩展语言”（scalable language）。该语言之所以这样命名，是因为它的设计是为了随着用户的需求而增长。你可以将\
  \ Scala 应用于广泛的编程任务，从编写小型脚本到构建大型系统[[1]]。\n\nScala 很容易上手。它运行在标准的 Java 平台上，并与所有 Java\
  \ 库无缝互操作。对于编写整合 Java 组件的脚本来说，它是一个非常好的语言。但用于构建大型系统和可重用组件框架时，它能发挥出更大的优势。\n\n从技术上讲，Scala\
  \ 是静态类型语言中面向对象和函数式编程概念的混合。面向对象和函数式编程的融合出现在 Scala 的许多不同方面；它可能比任何其他广泛使用的语言都更为普及。在可扩展性方面，这两种编程风格具有互补的优势。Scala\
  \ 的函数式构造使得人们易于从简单部分快速构建出有趣的东西。它的面向对象构造使得构建更大的系统并使其适应新需求变得易如。Scala 中这两种风格的结合使得表达新的编程模式和组件抽象成为可能。它还导致了易读且简洁的编程风格。由于它是如此具有塑性，用\
  \ Scala 编程可以非常有趣。\n\n这一初始章节回答了“为什么选择 Scala？”的问题。它提供了 Scala 设计的高层级视角。读完本章后，你应该对 Scala\
  \ 是什么以及它能完成的任务类型有一个基本的了解。尽管这本书是一本教程，但本章并不是教程的一部分。如果你急于开始编写 Scala 代码，应该跳到第 2 章。\n\
  \n### 1.1 让你熟悉的语言\n\n不同规模的程序往往需要不同的构造。例如，考虑以下小型 Scala 程序：\n\n```\nvar capital =\
  \ Map(\"US\" -> \"Washington\", \"France\" -> \"Paris\")\n\ncapital += (\"Japan\"\
  \ -> \"Tokyo\")\n\nprintln(capital(\"France\"))\n```\n\n该程序建立了从国家到首都的映射，通过添加新绑定修改映射，并打印与国家相关的首都。示例中的符号是高级的、直接的，且没有被多余的分号或类型注解干扰。事实上，这种感觉就像\
  \ Perl、Python 或 Ruby 等现代“脚本”语言。这些语言的一个共同特征（与示例相关）是它们在语言语法中都支持“关联映射”构造。\n\n关联映射非常有用，因为有助于保持程序的易读性和简洁，但有时你可能不同意它们的“一刀切”哲学，因为你需要以更细粒度的方式控制程序中使用映射的属性。如果你需要，Scala\
  \ 会给你提供这种细粒度的控制，因为 Scala 中的映射并不是语言语法。它们是可以扩展和适应的库抽象。\n\n在上面的程序中，你会得到默认的 `Map` 实现，但你可以轻松更改它。例如，你可以指定特定的实现，如\
  \ `HashMap` 或 `TreeMap`，或者调用 `par` 方法获取一个并行执行操作的 `ParMap`。你可以为映射指定默认值，也可以覆盖你创建的映射的任何其他方法。在每种情况下，你都可以使用示例中相同的映射访问语法。\n\
  \n\n\n\n此示例展示了 Scala 如何同时兼顾便利性和灵活性。Scala 拥有一系列方便的构造，可以帮助你快速上手，并让你以一种极其简洁的风格进行编程。同时，你也可以确保自己不会受限于语言的限制。你可以随时根据需求定制程序，因为一切都基于库模块，你可以根据需要选择并适配它们。\n\
  \n### 扩展新类型\n\n埃里克·雷蒙德（Eric Raymond）将“大教堂”（cathedral）和“集市”（bazaar）作为软件开发的两种比喻。大教堂是一座近乎完美的建筑，需要很长时间才能建成。一旦建成，它就会长时间保持不变。相比之下，集市每天由工作的人不断调整和扩展。在雷蒙德的作品中，集市是开源开发的比喻。盖·斯蒂尔（Guy\
  \ Steele）在一次关于“语言增长”的演讲中提到，同样的区别也适用于语言设计。Scala 更像是一个集市而不是大教堂，它的设计目标是让编程的人对其进行扩展和适配。Scala\
  \ 并不是在一个“完美完整”的语言中提供你可能需要的所有构造，而是将构建此类构造的工具交到你手中。\n\n这是一个示例。许多应用程序需要一种整数类型，它可以变得任意大而不会发生算术运算的溢出或“回绕”。Scala\
  \ 在库类 `scala.BigInt` 中定义了这种类型。下面是使用该类型的方法定义，用于计算传入整数值的阶乘：\n\n```\n def factorial(x:\
  \ BigInt): BigInt = \n  if (x == 0) 1 else x * factorial(x - 1)\n```\n\n现在，如果你调用\
  \ `factorial(30)`，你将得到：\n\n```\n 265252859812191058636308480000000\n```\n\nBigInt\
  \ 看起来像是一个内置类型，因为你可以对该类型的值使用整数字面量以及 `*` 和 `-` 等运算符。然而，它只是一个定义在 Scala 标准库中的类。如果缺少了这个类，对于任何\
  \ Scala 程序员来说编写一个实现都是简单的，例如通过封装 Java 的类 `java.math.BigInteger`（事实上，Scala 的 `BigInt`\
  \ 类就是这样实现的）。\n\n当然，你也可以直接使用 Java 的类。但结果并不那么愉快，因为尽管 Java 允许创建新类型，但这些类型的感觉并不像原生语言支持：\n\
  \n```\n import java.math.BigInteger\n\n  def factorial(x: BigInteger): BigInteger\
  \ =\n  if (x == BigInteger.ZERO)\n    BigInteger.ONE\n  else\n    x.multiply(factorial(x.subtract(BigInteger.ONE)))\n\
  ```\n\nBigInt 代表了许多其他类数值类型——大数、复数、有理数、置信区间、多项式等等层出不穷。某些编程语言原生实现了其中一些类型。例如，Lisp、Haskell\
  \ 和 Python 实现了大整数；Fortran 和 Python 实现了复数。但任何试图同时实现所有这些抽象的语言都会变得过于庞大而无法管理。此外，即使存在这样的语言，某些应用程序无疑会受益于未提供的其他类数值类型。因此，试图在一种语言中提供所有内容的方法扩展性并不好。相反，Scala\
  \ 允许用户通过定义易用且感觉像原生语言支持的库，在他们需要的方向上来扩展和适配语言。\n\n### 扩展新的控制构造\n\n上一个示例证明了 Scala 允许你添加新类型，并可以像内置类型一样方便地使用。同样的扩展原则也适用于控制结构。这种扩展性可以通过\
  \ Akka 来说明，Akka 是一个用于“ actor”的并发编程的 Scala API。\n\n随着多核心处理器在未来几年不断普及，获得理想的性能可能越来越多地要求你在应用程序中利用更多的并行性。通常，这意味着要重写代码，以便计算能够分布在多个并发线程上。不幸的是，在实践中创建可靠的多线程应用程序已被证明是挑战性的。Java\
  \ 的线程模型围绕共享内存和锁构建，这种模型通常难以理解，特别是当系统规模和复杂性增加时。很难确定你没有潜伏着竞态条件或死锁——这些问题在测试期间没有出现，但可能在生产环境中出现。一种更安全的替代方案是消息传递架构，例如\
  \ Erlang 编程语言使用的“actor”方法。\n\nJava 自带了一个丰富的基于线程的并发库。Scala 程序可以像使用其他 Java API 一样使用它。然而，Akka\
  \ 是一个额外的 Scala 库，实现了类似于 Erlang 的 Actor 模型。\n\nActor 是实现在线程之上的并发抽象。它们通过互相发送消息进行通信。一个\
  \ Actor 可以执行两个基本操作：发送消息和接收消息。发送操作由感叹号（`!`）表示，向一个 Actor 发送消息。这是一个 Actor 名为 `recipient`\
  \ 的示例：\n\n```\n recipient ! msg\n```\n\n\n\nScala 中的接收块（receive block）和发送（`!` 语法）看起来与\
  \ Erlang 非常相似，但在 Erlang 中，这些构造体是语言内置的。Akka 也实现了 Erlang 的大部分其他并发编程构造体，例如监控失败的 actor\
  \ 和超时处理。总之，actor 模型被证明是表达并发和分布式计算的一种非常愉的手段。尽管它们必须在库中定义，但 actor 感觉就像是 Scala 语言中不可或缺的一部分。\n\
  \n这个示例说明了你可以向新的方向“生长” Scala 语言，即使是像并发编程这样专门的领域。当然，要做到这一点，你需要优秀的架构师和程序员。但关键点在于，这种做法是可行的——你可以在\
  \ Scala 中设计并实现解决极其全新应用领域的抽象，而在使用时仍然感觉像是原生语言支持。\n\n### 1.2 是什么让 Scala 具有可扩展性？\n\n\
  可扩展性受到许多因素的影响，从语法细节到组件抽象构造体不一包。如果我们被迫只能列出 Scala 的一个有助于可扩展性的方面，我们会选择它面向对象编程和函数式编程的结合（好吧，我们作弊了，那实际上是两个方面，但它们是交织在一起的）。\n\
  \nScala 在将面向对象和函数式编程融合进统一的语言设计方面，比所有其他语言更进一步。例如，其他语言可能将对象和函数视为两个不同的概念，而在 Scala 中，函数值就是一个对象。函数类型是可以被子类继承的类。这看起来可能只是学术上的精巧，但它对可扩展性具有深远的影响。事实上，如果没有函数和对象的这种统一，之前展示的\
  \ actor 将无法实现。本节概述了 Scala 融合面向对象和函数式概念的方法。\n\n### Scala 是面向对象的\n\n面向对象编程已经取得了巨大的成功。从\
  \ 60 年代中期的 Simula 到 70 年代的 Smalltalk，它现在出现的语言比不支持它的语言多。在某些领域，对象已经完全接管了一切。虽然对“面向对象”的没有精确的定义，但对象确实有某些吸引程序员的地方。\n\
  \n原则上，面向对象编程的动机非常简单：除了最简单的程序外，所有程序都需要某种结构。实现这一点最直接的方法是将数据和操作放入某些形式的容器中。面向对象编程的伟大思想是将这些容器完全通用化，以便它们既可以包含操作也可以包含数据，并且它们本身也是可以存储在其他容器中的值，或作为参数传递给操作。这样的容器被称为对象。Smalltalk\
  \ 的发明者 Alan Kay 评论说，通过这种方式，简单的对象与完整的计算机具有相同的构造原理：它们在形式化的接口下将数据与操作结合。因此，对象与语言的可扩展性密切相关：相同的技术也适用于小型和大型程序的构建。\n\
  \n尽管面向对象编程已经成为主流了很长时间，但只有少有语言像 Smalltalk 那样将这种构造原理推向逻辑上的终点。例如，许多语言允许非对象的值存在，例如 `Java`\
  \ 中的原始值。或者它们允许不是任何对象成员的静态字段和方法。这些对纯粹面向对象编程理念的偏离初看起来看起来大无害，但它们有一种令人讨厌的倾向，会使问题复杂化并限制可扩展性。\n\
  \n相比之下，Scala 是一种纯形式的面向对象语言：每个值都是对象，每个操作都是方法调用。例如，当你在 Scala 中说 `1 + 2` 时，你实际上是在调用定义在\
  \ `Int` 类中的名为 `+` 的方法。你可以定义具有类运算符名称的方法，你的 API 客户端可以在运算符表示法中使用这些方法。这就是 Akka actor\
  \ API 设计师让你能够使用如之前示例所示的 `requester ! sum` 等表达式的原因：`!` 是 `Actor` 类的方法。\n\n在组合对象方面，Scala\
  \ 比大多数其他语言都要先进。一个例子是 Scala 的 `traits`。Traits 类似于 `Java` 中的接口，但它们也可以拥有方法实现甚至字段。对象是通过混入组合（mixin\
  \ composition）构建的，它获取一个类的成员并向添加许多 trait 的成员。通过这种方式，类的不同方面可以封装在不同的 trait 中。这看起来有点像多重继承，但在细节上有所不同。与类不同，trait\
  \ 可以为未指定的父类添加一些新功能。这使得 trait 比类更具“可插性”。特别是，它避免了多重继承中经典的“菱继承”问题，这种问题在通过多个不同的路径继承同一个类时会发生。\n\
  \n### Scala 是函数式的\n\n除了是纯面向对象的语言外，Scala 还是一门真正的函数式语言。函数式编程的想法比（电子）计算机还要悠远。它们的基础建立在\
  \ Alonzo Church 在 20 世纪 30 年代开发的 lambda 演算上。第一个函数式编程语言是 `Lisp`，起源于 50 年代后期。其他流行的函数式语言有\
  \ `Scheme`、`SML`、`Erlang`、`Haskell`、`OCaml` 和 `F#`。长期以来，函数式编程一直处于边缘——在学术界流行，但在工业界并没有广泛使用。然而，近年来，人们对函数式编程语言和技术的兴趣增加了。\n\
  \n函数式编程由两个主要思想引导。第一个想法是函数是一等等值。在函数式语言中，函数的地位与整数或字符串相同。你可以将函数作为参数传递给其他函数，将它们作为结果返回，或将它们存储在变量中。你还可以在另一个函数内部定义函数，就像你可以在函数内部定义一个整数值一样。你还可以在不给函数命名的情况下定义函数，在你的代码中洒入像\
  \ `42` 这样的整数字面量。\n\n作为一等值的函数为抽象操作和创建新的控制结构提供了方便的方法。这种函数的泛化提供了极大的表达能力，通常会导致程序非常易读且简洁。它在可扩展性方面也起着重要作用。例如，ScalaTest\
  \ 测试库提供了一个接受函数作为参数的 `eventually` 构造。它的用法如下：\n\n```\nval xs = 1 to 3\nval it = xs.iterator\n\
  eventually { it.next() shouldBe 3 }\n```\n\n`eventually` 内部的代码——断言 `it.next() shouldBe\
  \ 3`——封装在一个函数中并在未执行传递给 `eventually` 方法。在配置的时间内，`eventually` 会反复执行该函数，直到断言成功。\n\n\
  相比之下，大多数传统语言中的函数不是值。具有函数值的语言通常将其降级为二等公民。例如，`C` 和 `C++` 的函数指针与这些语言中的非函数值地位不同：函数指针只能引用全局函数，它们不允许你定义引用环境中某些值的一等嵌套函数。它们也不允许定义未命名的函数字面量。\n\
  \n\n\n\n函数式编程的第二个核心思想是程序的操作应该将输入值映射到输出值，而不是直接修改数据。为了观察这种差异，请考虑 Ruby 和 Java 中字符串的实现。在\
  \ Ruby 中，字符串是一个字符数组。字符串中的字符可以被单独修改。例如，你可以将同一个字符串对象中的分号字符更改为句号。而在 Java 和 Scala 中，字符串是数学意义上的字符序列。使用诸如\
  \ `s.replace(';', ';')` 的表达式替换字符串中的字符会产生一个新的字符串对象，它与 `s` 不同。这种现象的另一种表达方式是：字符串在 Java\
  \ 中是不可变的（immutable），而在 Ruby 中是可变的（mutable）。因此，如果仅从字符串来看，Java 是一门函数式语言，而 Ruby 不是。不可变数据结构是函数式编程的基石之一。Scala\
  \ 库在 Java API 之上定义了更多不可变数据类型。例如， Scala 拥有不可变列表、元组、映射和集合。\n\n描述函数式编程这第二个思想的另一种方式是：方法不应该有任何副作用。它们应该只通过接收参数和返回结果与其环境进行通信。例如，Java\
  \ `String` 类中的 `replace` 方法就符合这一描述。它接收一个字符串和两个字符，并产生一个新的字符串，其中一个字符的所有出现都被替换为另一个。调用\
  \ `replace` 没有其他影响。像 `replace` 这样的方法被称为`引用透明`。Scala 程序编译为 JVM 字节码。它们的运行时性能通常与 Java\
  \ 程序不鼓。Scala 代码可以调用 Java 方法、访问 Java 字段、继承 Java 类并实现 Java 接口。这些都不需要特殊的语法、显式的接口描述或胶接代码。事实上，几乎所有的\
  \ Scala 代码都大量使用了 Java 库，而且程序员往往并不知道这一事实。\n\n完全互操作性的另一个方面是，Scala 大量地复用了 Java 类型。Scala\
  \ 的 `Ints` 表示为类型为 `int` 的 Java 原生整数，`Floats` 表示为 `floats`，`Booleans` 表示为 `booleans`，依此类推。Scala\
  \ 数组映射到 Java 数组。Scala 还复用了许多标准 Java 库类型。例如，Scala 中字符串字面量 `\"abc\"` 的类型是 `java.lang.String`，而抛出的异常必须是\
  \ `java.lang.Throwable` 的子类。\n\nScala 不仅复用了 Java 的类型，还对它们进行了“修饰”使其变得更好用。例如，Scala\
  \ 的字符串支持如 `toInt` 或 `toFloat` 等方法，这些方法可以将字符串转换为整数或浮点数。因此你可以写 `str.toInt` 而不是 `Integer.parseInt(str)`。在不破坏兼容性的情况下如何实现这一点呢？Java\
  \ 的 `String` 类显然没有 `toInt` 方法！事实上，Scala 有一个非常通用的解决方案来解决高级库设计与互操作性之间的紧张关系。Scala 允许你定义隐式转换（implicit\
  \ conversions），当类型通常不匹配或当选择不存在的成员时，隐式转换总会被应用。在上面的例子中，当在字符串上寻找 `toInt` 方法时，Scala\
  \ 编译器在 `String` 类中找不到该成员，但它会找到一个隐式转换，将 Java `String` 转换为 Scala 类 `StringOps` 的实例，而该类定义了该成员。然后，该转换会在执行\
  \ `toInt` 操作之前隐式地应用。\n\nScala 代码也可以从 Java 代码调用。这有时稍微微妙一些，因为 Scala 是一种比 Java 更丰富的语言，所以\
  \ Scala 的一些高级特性在映射到 Java 之前需要先编码。第 31 章 解释了细节。\n\n#### Scala 是简洁的\n\nScala 程序往往很短。Scala\
  \ 程序员报告说，与 Java 相比，行数减少多达十倍。这些可能是极端情况。更保守的估计是，一个典型的 Scala 程序的行数应该是相同 Java 程序的大半。代码行数的减少意味着不仅打字更少，还意味着阅读和理解程序的精力更少，缺陷的可能性也更。有几个因素导致了行数的减少。\n\
  \n首先，Scala 的语法避免了一些负担 Java 程序的样板代码。例如，分号在 Scala 中是可选的，且通常被省略。Scala 的语法在其他几个领域也更简洁。例如，比较你在\
  \ Java 和 Scala 中编写类和构造函数。在 Java 中，带构造函数的类通常看起来像：\n\n```java\n// 这是 Java 代码\nclass\
  \ MyClass {\n    private int index;\nprivate String name;\n\n    public MyClass(int\
  \ index, String name) {\n        this.index = index;\n        this.name = name;\n\
  \    }\n}\n```\n\n在 Scala 中，你可能会写成这个：\n\n```scala\nclass MyClass(index: Int, name:\
  \ String)\n```\n\n给定这段代码，Scala 编译器将产生一个拥有两个私有实例变量（一个名为 `index` 的 `Int` 和一个名为 `name`\
  \ 的 `String`）以及一个接收这些变量初始值作为参数的构造函数的类。该构造函数的代码将使用传递的参数值初始化这两个实例变量。简而言之，你基本上获得了与冗长的\
  \ Java 版本相同的功能[[10]](#a-scalable-language.html_footnotemain1-10)。Scala 类写起来更快、更易读，最重要的是，比\
  \ Java 类更不容易出错。\n\nScala 的类型推断是导致其简洁性的另一个因素。重复的类型信息可以被省略，因此程序变得不那么杂乱，更具可读性。\n\n\
  但紧凑代码最重要的关键可能是你不需要编写的代码，因为这些已经在库中为你完成了。Scala 为你提供了许多工具来定义强大的库，让你捕捉并提取常见行为。例如，库类的不同方面可以分离到特征（traits）中，然后以灵活的方式混合在一起。或者，库方法可以对操作进行参数化，这让你能够定义实际上是你自己的控制结构的结构。这些结构共同允许定义既高级又易于使用的库。\n\
  \n#### Scala 是高级的\n\n\n\n\n程序员不断在与复杂性斗争。为了高效地编程，你必须理解你正在工作的代码。过度复杂的代码是许多软件项目失败的根源。遗憾的是，软件通常具有复杂的需求。这种复杂性是无法避免的；相反对其进行管理。\n\
  \nScala 通过让你提高你设计和使用的接口的抽象层次来帮助你管理复杂性。例如，假设你有一个 `String` 变量 `name`，你想找出这个 `String`\
  \ 是否包含大写字母。在 Java 8 之前，你可能会编写如下的循环：\n\n```\n boolean nameHasUpperCase = false; \
  \ // this is Java\n  for (int i = 0; i < name.length(); ++i) {\n    if (Character.isUpperCase(name.charAt(i)))\
  \ {\n        nameHasUpperCase = true;\n        break;\n    }\n  }\n```\n\n而在 Scala\
  \ 中，你可以这样写：\n\n```\n val nameHasUpperCase = name.exists(_.isUpper)\n```\n\nJava\
  \ 代码将字符串视为低级实体，在循环中逐个字符地遍历。而 Scala 代码将相同的字符串视为更层级的字符序列，可以使用谓词进行查询。显然，Scala 代码要短得多，而且对于训练过的眼睛来说，比\
  \ Java 代码更容易理解。因此，Scala 代码对总复杂性预算的影响较小。它也减少了你出错的机会。\n\n谓词 `_.isUpper` 是 Scala 中函数字面量的示例。11\
  \ 它描述了一个接受字符参数（由下划线字符表示）并测试其是否为大写字母的函数。12\n\nJava 8 引入了对 lambda 和流的支持，允许你在 Java\
  \ 中执行类似的操作。它可能如下：\n\n```\n boolean nameHasUpperCase =   // This is Java 8\n    name.chars().anyMatch(\n\
  \        (int ch) -> Character.isUpperCase((char) ch)\n    );\n```\n\n尽管比早期的 Java\
  \ 版本有了巨大的改进，但 Java 8 代码仍然比等量的 Scala 代码冗长。Java 代码这种额外的“沉重感”以及 Java 悠久的循环传统，可能会鼓励许多需要\
  \ `exists` 等新方法的 Java 程序员直接编写循环，并忍受代码中增加的复杂性。\n\n另一方面，Scala 中的函数字面量是非常轻量级的，因此它们被频繁使用。随着你对\
  \ Scala 越来越熟悉，你会发现更多定义和使用自己的控制抽象的机会。你会发现这有助于避免代码重复，从而使你的程序更短、更清晰。\n\nScala 的函数式编程风格还为编程提供了高层推理原则。核心思想是函数是引用透明的——函数应用仅以其结果为特征。因此，你可以自由地将函数应用与函数的右侧（即等号后面的函数体）进行交换，而不必担心任何隐藏的副作用。这一原则提供了许多有用的定律，你可以利用它们来更好地理解或重构你的代码。例如，再次考虑上述的\
  \ `exists` 方法。该方法应该满足以下定律：对于每一个序列 `s` 和每一对谓词 `p` 和 `q`，应该满足：\n\n```\n s.exists(p)\
  \ || s.exists(q) == s.exists(x => p(x) || q(x))\n```\n\n也就是说，使用两个谓词 `p` 和 `q` 查询同一个序列并对结果进行逻辑或操作，与使用一个同时测试\
  \ `p` 或 `q` 的单谓词进行查询是相同的。这样的定律对于编写和重构程序显然是有用的。然而，如果 `exists` 有副作用，那么通常假设这种定律是不正确的，因为左侧对每个序列元素执行了两次\
  \ `exists`，而右侧对每个元素只执行一次。所以这是一个纯函数代码产生更多有助于理解和重构代码的有用定律的示例。\n\n函数式编程风格还消除了命令式编程中遇到的别名问题。当多个变量引用同一个对象时，就会发生别名。这产生了一些棘手的问题和复杂性。例如，更改字段\
  \ `r.x` 是否也会影响 `s.x`？如果 `r` 和 `s` 指向同一个对象，就会。在实践中，追踪此类别名通常非常困难。另一方面，不可变数据可以自由共享，因为副本与共享引用是没有区别的。这种优势在编写并发代码时尤为至重要。（这就是为什么\
  \ Java 有不可变字符串。）\n\n### Scala 是静态类型的\n\n静态类型系统根据它们持有和计算的值类型对变量和表达式进行分类。Scala 成为一种具有非常先进的静态类型系统的语言脱颖而出。从像\
  \ Java 那样的嵌套类系统开始，它允许你使用泛型对类型进行参数，使用交叉集组合类型，并使用抽象类型隐藏类型的细节。13 这些为构建和组合你自己的类型提供了坚实的基础，让你能够设计出既安全又易于使用的接口。\n\
  \n如果你喜欢动态语言，如 Perl、Python、Ruby 或 Groovy，你可能会觉得 Scala 的静态类型系统被列为它的优点之一有点奇怪。毕竟，静态类型系统的缺失曾被一些人认为是动态语言的一个大优势。反对静态类型的最常见论点是，它们让程序变得过于冗长，阻止了程序员按照自己的意愿表达自己，并使得软件系统进行某些模式的动态修改变得不可能。然而，这些论点通常并不是针对静态类型这一泛指的概念，而是针对特定的类型系统，这些类型系统被认为过于冗长或缺乏灵活性。例如，Smalltalk\
  \ 语言的发明者 Alan Kay 曾评论道：“我并不反对类型，但我不知道任何一种类型系统是不完全痛苦的，所以我仍然喜欢动态类型。”14\n\n**可验证的属性。**\
  \ 静态类型系统可以证明某些运行时错误不存在。例如，它们可以证明如下属性：布尔值永远不会加到整数上；私有变量不会从类外部访问；函数应用于正确数量的参数；只有字符串会被添加到字符串集中。\n\
  \n\n\n如今的静态类型系统无法检测其他类型的错误。例如，它们通常不会检测不终止函数、数组越界或除以零。它们还无法检测你的程序是否符合其规范（假设确实有规范的话！）。因此，静态类型系统被一些人认为没太大用。这种论点认为，既然这类类型系统只能检测简单的错误，而单元测试可以提供更广泛的覆盖，为什么还要费心使用静态类型呢？我们认为这些论点偏离了重点。虽然静态类型系统确实不能`replace`单元测试，但它可以通过处理某些本需要测试的属性来减少所需的单元测试数量。同样，单元测试也无法取代静态类型。毕竟，正如\
  \ Edsger Dijkstra 所说，测试只能证明错误的存在，而永远无法证明错误的不存在。[[15]](#a-scalable-language.html_footnotemain1-15)\
  \ 因此，静态类型所提供的保证可能是简单的，但它们是真实的保证，是无论任何程度的测试都无法提供的形式。\n\n#### 安全重构。\n静态类型系统提供了一个安全网，让你能够以极高的信心对代码库进行更改。例如，考虑一个为方法添加额外参数的重构。在静态类型语言中，你可以进行此更改，重新编译系统，并只需修复所有导致类型错误的行。一旦完成这些操作，你就可以确定已经找到了所有需要更改的地方。许多其他简单的重构也是如此的，例如更改方法名或将方法从一个类移动到另一个类。在所有情况下，静态类型检查都会提供足够的保证，确保新系统与旧系统工作完全一样。\n\
  \n#### 文档。\n静态类型是经编译器检查正确性的程序文档。与普通注释不同，类型注解永远不会过时（至少如果包含它的源文件最近通过了编译器的话）。此外，编译器和集成开发环境（IDE）可以利用类型注解来提供更好的上下文帮助。例如，IDE\
  \ 可以通过确定所选定表达式的静态类型并查找该类型的所有成员，来显示选定内容所有可用成员。\n\n尽管静态类型对程序文档通常很有用，但当它们弄乱程序时，有时也会让人很烦疼。通常，有用的文档是程序读者无法自己轻易推导出的内容。在如下的方法定义中：\n\
  \n```scala\n def f(x: String) = ...\n```\n\n知道 `f` 的参数应该是 `String` 是很有用的。另一方面，在下面的示例中，两个注解至少有一个是烦人的：\n\
  \n```scala\n val x: HashMap[Int, String] = new HashMap[Int, String]()\n```\n\n显然，只需要说一次\
  \ `x` 是一个以 `Int` 为键、`String` 为值的 `HashMap` 就足够了；不需要重复两次相同的描述。\n\nScala 拥有一个非常复杂的类型推断系统，让你省略几乎所有被认为是烦人的类型信息。在上一个示例中，以下两种不那么烦人的方案同样有效：\n\
  \n```scala\n val x = new HashMap[Int, String]()\n val x: Map[Int, String] = new\
  \ HashMap()\n```\n\nScala 的类型推断可以进行得很远。事实上，用户代码完全没有显式类型并不罕见。因此，Scala 程序看起来往往有点像用动态类型脚本语言编写的程序。这对于客户端应用代码尤为如此，这些代码将预先写的库组件胶合在一起。对于库组件本身，这种情况就不那么多了，因为这些组件通常采用相当复杂的类型以允许灵活的用法模式。这是很自然的。毕竟，构成可用组件接口的成员类型签名应该显式给出，因为它们构成了组件与其客户端之间合同的重要组成部分。\n\
  \n### 1.4 Scala 的根源\n\nScala 的设计受到许多编程语言和编程语言研究思想的影响。事实上，Scala 只有少数特征是真正全新的；大多数已经以某种形式应用在其他语言中。Scala\
  \ 的创新主要源于它的构造体是如何组合在一起的。在本节中，我们列出了对 Scala 设计的主要影响。这个列表是不详尽的——编程语言设计中的聪明点子太多了，无法在这里一一列举。\n\
  \n在表面上，Scala 吸收了 `Java` 和 `C#` 的大部分语法，而这些者又从 `C` 和 `C++` 借用了大部分语法规范。表达式、语句和块大部分与\
  \ `Java` 相同，类、包和导入的语法也是如此[[16]](#a-scalable-language.html_footnotemain1-16) 除了语法之外，Scala\
  \ 还采纳了 `Java` 的其他元素，如其基本类型、类库和执行模型。\n\nScala 也得益于其他语言。它的统一对象模型由 `Smalltalk` 开创，随后被\
  \ `Ruby` 采纳。它的通用嵌套思想（`Scala` 中的几乎每个构造体都可以嵌套在任何其他构造体内部）也存在于 `Algol`、`Simula`以及最近的\
  \ `Beta` 和 `gbeta` 中。它方法调用和字段选择的统一访问原则来自 `Eiffel`。它对函数式编程的方法在精神上与 `ML` 系列语言非常相似，该系列拥有\
  \ `SML`、`OCaml` 和 `F#` 等著名成员。Scala 标准库中的许多高阶函数也出现在 `ML` 或 `Haskell` 中。Scala 的隐式参数灵感来自\
  \ `Haskell` 的类型类；它们在更经典的面向环境中实现了类似的结果。Scala 主要基于 Actor 的并发库 `Akka` 深受 `Erlang` 的启发。\n\
  \nScala 不是第一个强调可扩展性和可扩展性的语言。跨应用领域的可扩展语言的历史根源是 Peter Landin 1966 年的论文《未来的 700 种编程语言》。[[17]](#a-scalable-language.html_footnotemain1-17)（本文描述的语言\
  \ `Iswim` 与 `Lisp` 并列为先驱函数语言之一。）将中缀运算符视为函数的特定思想可以追溯到 `Iswim` 和 `Smalltalk`。另一个重要思想是允许将函数字面量（或块）作为参数，使库能够定义控制结构。再次，这回到了\
  \ `Iswim` 和 `Smalltalk`。`Smalltalk` 和 `Lisp` 都具有灵活的语法，被广泛应用于构建领域特定语言。`C++` 是另一种通过运算符重载和其模板系统进行适应和扩展的可扩展语言；与\
  \ `Scala` 相比，它构建在更底层、更面向系统的内核之上。Scala 也不是第一个集成函数和面向对象编程的语言，尽管它在这个方向上可能走得远。其他将函数式编程元素整合面向对象编程（OOP）的语言包括\
  \ `Ruby`、`Smalltalk` 和 `Python`。在 `Java` 平台上，`Pizza`、`Nice`、`Multi-Java` 以及 `Java\
  \ 8` 本身都扩展了类 `Java` 核心以引入函数式思想。一些主要是函数式的语言获得了对象系统；例如 `OCaml`、`F#` 和 `PLT-Scheme`。\n\
  \nScala 为编程语言领域贡献了一些创新。例如，它的抽象类型为泛型提供了一种更面向对象的替代方案，它的特征（traits）允许灵活的组件组装，而它的提取器（extractors）为模式匹配提供了一种表示无关的方法。这些创新已在近年编程语言会议上发表过论文[[18]](#a-scalable-language.html_footnotemain1-18)\n\
  \n### 1.5 结论\n\n\n\n\n在本章中，我们让你初步了解了 Scala 是什么以及它可能如何帮助你的编程。需要明确的是，Scala 并不是一种能神奇地让你提高生产率的“万灵药”。要更上一层楼，你需要艺术地应用\
  \ Scala，而这需要一些学习和实践。如果你是从 Java 转到 Scala 的，学习 Scala 最挑战性的方面可能涉及 Scala 的类型系统（它比 Java\
  \ 更丰富）以及它对函数式编程的支持。本书的目标是引导你稳步跨越 Scala 的学习曲线，一步一个来。我们认为你会发现这是一次很有回报的智力体验，将开阔你的眼界，并让你对程序设计有不同的思考。希望你也能从\
  \ Scala 编程中获得快乐和灵感。\n\n在下一章中，我们将开始学习编写一些 Scala 代码。\n\n***\n\n### 第 1 章脚注：\n\n[1]\
