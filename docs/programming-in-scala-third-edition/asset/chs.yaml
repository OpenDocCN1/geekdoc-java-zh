  \n`Akka Concurrency` 是使用 Akka 进行并发编程的权威指南。本书作为一本实用的指南而编写，它不仅会教你 Akka 的“是什么”和“如何做”，还会告诉你背后的“为什么”。Akka\
  \ 不仅仅是一个你可以用来编写并发应用程序的工具包：它更体现了一套你可以用来推演这些应用程序的范式。这本书将为你提供如何在 JVM 上设计、构建和思考并发应用程序的全新的视角。\n\
