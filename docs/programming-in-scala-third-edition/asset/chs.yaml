  \ Scala trait 编写 RMI 远程接口，你需要在这些方法的 `throws` 子句中列出 `RemoteException`。要实现这一点，你只需要为你的方法标记\
  \ `@throws` 注解即可。例如，在列表 31.1 所示的 Scala 类有一个方法被标记为抛出 `IOException`。\n\n```\n import\
