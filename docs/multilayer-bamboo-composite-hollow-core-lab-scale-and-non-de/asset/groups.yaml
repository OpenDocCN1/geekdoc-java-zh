    # 2. 多层竹复合材料空心


    ## 2.1. 提议系统


    目前关于作为结构元件的竹或其与混凝土竹条复合材料的研究几乎占据了大部分。对竹空心提议样品的研究很少，甚至没有。基于此，本研究讨论了横截面上由混凝土和多层竹组成的复合板在短跨桥上的实现，且没有使用钢筋。由于在该复合系统中包含了完整的竹竿或竹杆，因此命名为
    Mulambphol（多层交叉复合竹空心）。已对用竹或农材料制成的全尺寸结构行为进行了无破坏检测。


