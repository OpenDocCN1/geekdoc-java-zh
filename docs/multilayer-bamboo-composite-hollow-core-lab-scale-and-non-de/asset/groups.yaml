    关于施工的重要研究，根据 [11] 和 [13-15] 的综述发现，竹连接在粘结强度和抗滑性方面表现良好。竹材料的表性化如力学性能实验数据已通过 [16]
    验证。研究人员观察到密度、水分含量和刚度由 [18] 进行了总结，以及这些性质沿竹青的变化。在表性化中考虑几何特性以及物理和力学性能的重要性已由 [18]
    讨论，且加工结果由 [18] 给出。


    由于竹加筋复合材料正被应用于结构应用中，如板面板 [19]、柱 [20]，且全尺寸也由 [21] 进行了检查。尽管竹材被广泛认为是可持续结构的资源，正如 [22]
    所讨论的。研究 [23] 的主要结果是，由于其高拉和压强度，竹是一种优良的加筋材料。竹加筋梁的抗弯强度已增强，但其可靠性仍存在争议，因此需要解决这个问题 [26]。


    ## 1.2. 竹结构的现状


    作为结构材料的竹的研究主要分为三个部分：竹与混凝土的复合材料，以及竹元件及其连接。


    此类评估了胶层竹材的径向强度，并在轴向压缩下的竹柱也由 [7] 进行了研究。而另一位研究人员 [4] 研究了胶层竹的径向长度和方向


