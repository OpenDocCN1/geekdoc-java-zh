    # Multilayer bamboo composite hollow-core: Lab-scale and non-destructive testing
    of full-scale concrete bridges considering transverse bamboo pole as shear reinforcement


    Taufiq Rochman*, Suharianto


    Civil Engineering Department, State Polytechnic of Malang, J. Soekarno H No. 9,
    Malang 65141, East Java, Indonesia


    # ARTICLE INFO


    # ABSTRACT


    - Keywords:

    - Multilayer

    - Cross-poly

    - Bamboo

    - Composite

    - Hollow-core

    - Multihollowcomposite


    Due to bamboo''s superior mechanical qualities, it has often been used in rural
    construction, however research on bamboo poles as reinforcement has been limited.
    The purpose of this paper is to introduce a composite system made of several layers
    of bamboo-core, hollow Multihollowcomposite concrete system for simplicity. In
    this paper, we analyze the implementation of a composite slab on a bridge span
    consisting of concrete in a cross-section, without any utilization of steel reinforcement.
    Multihollowcomposite bamboo reinforcement is used because the presence of entire
    bamboo in this composite system enhances the flexural behavior of a full-scale
    vehicle under an actual service load. Due to the difficulties of obtaining excellent
    results and the potential for bias, the study is conducted using a FEM-based model
    (thick shell and shell element). Bamboo poles with a certain section were used
    as concrete slabs, which were subjected to the 21 kN force. Simultaneously, when
    tested on a radial axis, multilayer bamboo poles can withstand a force 52% more
    than conventional slabs at the same concrete volume, resulting in a 73% reduction
    in deflection. On the other hand, higher resistance to failure in terms of ductility
    and maximum load that can be carried in both analysis and experimental testing.


    # 1. Introduction


    ## 1.1. Bamboo nature


    Bamboo seems to be the only renewable material that was quickly growing and offers
    a wide range of applications. The existing bamboo products were manufactured by
    using bamboo hollow poles [1]. This is a concern and urgent research to construct
    bridges using traditional materials that are reliable. As bamboo, a natural material
    that is complex and multi-null, with an extremely thin layer on the outside.


    The bamboo is made up of hollow cores and nodes. The nodes are responsible for
    the formation of roots and branches. Internodes are formed by a hollow wall of
    varying thickness that surrounds a hollow core. The outer layer of the culms denser
    than the innermost layer, and as they expand, they often take a tapered shape
    [2]. Bamboo was environmentally friendly material that has been widely employed
    in building due to its mechanical properties [3, 4]. It has rapid growth and regeneration
    capacities. Bamboo has also been used in construction elements such as timber,
    flooring, special treatment (in material), and bamboo columns [6] especially in
    structural frames [7, 8] and two-four point bending tests on bamboo culms to evaluate
    a variety of mechanical properties and potential uses. Bamboo has been used as
    reinforcement for structural concrete parts. By the logic of mesh, they established
    bamboo''s composite behavior, bamboo reinforces concrete beams, in a simple manner.
    However, with [10] illustrated the possibility of using lightweight, robust structural
    materials on a massive scale using abundant, fast-growing, and sustainable bamboo.


