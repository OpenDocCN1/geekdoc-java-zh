    # 多层竹复合材料空心：考虑横向竹杆作为剪切筋的全尺寸混凝土桥梁实验室规模与无破坏检测


    Taufiq Rochman*, Suharianto


    印尼玛兰州立大学土木工程系，J. Soekarno H No. 9, Malang 65141, East Java, Indonesia


    # 文章信息


    # 摘要


    - 关键词：

    - 多层

    - 交叉复合

    - 竹子

    - 复合材料

    - 空心

    - 多空心复合材料


    由于竹子优越的力学性能，它经常用于农村建筑，然而对竹杆作为加筋的研究仍然有限。本文的目的是介绍一种由多层竹芯空心多空心复合混凝土系统（简称为多空心复合）组成的复合系统。在本文，我们分析了桥梁跨上复合板的实现情况，该截面由混凝土组成，且没有使用任何钢筋。使用多空心复合竹材加筋，是因为在该复合系统中完整竹材的存在增强了实际工作载荷下全尺寸车辆的抗弯性能。由于获得优异结果困难且存在偏差风险，研究采用基于有限元分析（FEM）的模型（厚壳和壳单元）进行。使用具有特定截面的竹杆作为混凝土板，承受
    21 kN 的力。同时，在径向轴上进行测试时，多层竹杆在相同混凝土体积下承受的力比传统板高出 52%，导致挠度减少了 73%。另一方面，在分析和实验测试中，在延性和最大承载能力方面表现出更高的抗力。


    # 1. 引言


    ## 1.1. 竹的特性


    竹子似乎是唯一生长迅速且具有广泛应用的再生材料。现有的竹制品是利用空心竹杆制造的 [1]。使用可靠的传统材料建造桥梁是一项令人关注且紧迫的研究。竹子作为一种复杂且多孔天然材料，其外层极薄。


    竹子由空心和节组成。节负责根和分支的形成。节间由围绕空心的、厚度不变化的空心壁形成。竹青的外层比最内层密，随着它们的扩张，它们通常呈现锥形 [2]。竹子是一种因其力学性能而被广泛应用于建筑的环保型材料
    [3, 4]。它具有快速的生长和再生能力。竹子还用于建筑元件，如木材、地板、特殊处理（材料）和竹柱 [6]，特别是在结构框架 [7, 8] 中，并对竹青进行二、四点弯曲测试以评估各种力学性能和潜在用途。竹已被用作结构混凝土部件的加筋材料。根据网格逻辑，它们建立了竹的复合行为，即竹子以简单的方式加筋混凝土梁。然而，[10]
    证明了利用丰富的、生长快且可持续的竹子在大规模使用轻质、坚固结构材料的可能性。


