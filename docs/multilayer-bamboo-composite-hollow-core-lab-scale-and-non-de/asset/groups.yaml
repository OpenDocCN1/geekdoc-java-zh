    Almost majority of current research on bamboo as structural elements or on their
    composite with concrete as culm strips. Very, if any, studies have been conducted
    on bamboo hollow-core proposed specimens have received little attention. On that
    basis, this study discusses the implementation of a composite slab system consisting
    of concrete and multilayer bamboo arranged in a cross-section, without steel reinforcement,
    on a short span bridge. Due to the inclusion of complete culms or bamboo poles
    in this composite system, it is dubbed Mulambphol (multilayer cross-ply bamboo
