    # 2. Multilayer bamboo composite hollow-hollow


    # 2.1. Proposed system


    Almost majority of current research on bamboo as structural elements or on their
    composite with concrete as culm strips. Very, if any, studies have been conducted
    on bamboo poles as complete elements that are fully integrated with concrete.


    Now until nowadays, bamboo hollow-core proposed specimens have received little
    attention. Past studies have studied bamboo in the form of fiber, woven or unspun,
    thick wick, latticework of or filamentous chips. There have been very little research
    on the utilization of bamboo poles as reinforcement.


    On that basis, this study discusses the implementation of a composite


    slab system consisting of concrete and multilayer bamboo arranged in a cross-section,
    without steel reinforcement, on a short span bridge. Due to the inclusion of complete
    culms or bamboo poles in this composite system, it is dubbed Mulbamcompoh (multilayer
    cross-ply bamboo hollow-cores). Non-destructive tests have been conducted on full-scale
    structural behavior of trusses made with bamboo or agricultural material. Fundamentals
