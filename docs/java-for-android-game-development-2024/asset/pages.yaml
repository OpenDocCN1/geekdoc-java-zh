    # Game Development Terminology


    +   1. Game Engine: A game engine is a software framework or platform used to
    develop and run games. It provides tools, libraries, and APIs for handling graphics,
    physics, input, audio, and other aspects of game development.


    +   2. Sprite: A sprite is a 2D image or animation used to represent characters,
    objects, or visual elements within a game. Sprites are often organized into sprite
    sheets for efficient rendering.


    +   3. Physics Engine: A physics engine simulates physical interactions and behaviors
    within a game world, including gravity, collisions, friction, and object dynamics.
    Popular physics engines include Box2D and Bullet Physics.


    +   4. Collision Detection: Collision detection is the process of determining
    whether two or more objects in a game world are intersecting or overlapping. It
    is essential for implementing gameplay mechanics such as object interactions,
    player movement, and enemy AI.


    +   5. Game Loop: The game loop is the main loop that drives the execution of
    a game, including updating game state, handling input, and rendering graphics.
    It typically runs continuously throughout the game''s lifecycle.'
