    7. Collision Detection: The process of detecting when two or more objects intersect
    or collide in a game world.


    8. Compiler: A program that translates source code written in a high-level programming
    language into machine code or bytecode.


    9. Constructor: A special method used to initialize objects when they are created.


    # D


    10. Debugging: The process of identifying, diagnosing, and fixing errors or bugs
    in software code.


    11. Data Structure: A method of arranging and managing data in a computer to enable
    efficient access and manipulation.


    12. Dependency Injection: A design pattern in which the dependencies of a class
