    ### 从文件读取


    我们需要知道如何从文件中读取。这是一个非常简单的过程，在任何方面都不复杂。事实上它与 `Cout` 非常相似。下面显示了如何读取单个字符。


    ![](img/00041.jpeg)


    首先，我们需要一个变量来存储输入，第 11 行创建了一个 `string` 类型变量 `x`。在第 13 行，`cin >> x` 将读取第一个单词。在第
    15 行，`Cout << x` 指令程序打印值。


