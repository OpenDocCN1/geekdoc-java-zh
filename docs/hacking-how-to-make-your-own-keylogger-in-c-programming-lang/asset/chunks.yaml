    Well, from the ASCII code, the value `49` on Line (47) represents the number `1`.
    Line 49 says: `if the shift key (described by 0x10 in Hexadecimal form) is interrupted
    tell us this.`. Also, since the program has `case 49` added to its list, if the
    user types the number `1` on his keyboard immediately after the shift key it will
    send the exclamation symbol `!` to `RECORD.txt` as directed by Line 50.


    ![](images/00061.jpeg)


    As shown in the figure above, the Keylogger is being run and tested by utilizing
    the quotation mark in addition to a short note, which says “Heythere” through
    the command prompt window to see if it will recognize the exclamation symbol and
    send it to our project file as we defined it `!` or just give us some other result.


    ![](images/00062.jpeg)


    Nice! As seen above in the figure, our Keylogger now writes the exclamation mark
    for what it truly is and not just some funny figure. *the statement highlighted
    is previously tested work, it isn’t part and parcel of the result of the recent
    test.*


    From this point on, we just have to continue building on the `switch` statement,
    adding more and more `cases` to represent all the characters we will want our
    Keylogger to be able to interpret. This will allow us to customize our Keylogger
    to a keyboard that we will like generally, so even if a person has his or her
    keys configured differently it affects you but not very much.


    So far we have written our codes in blocks, from the case-checking block, the
    character incorporation block to the filing block etc. and have put these blocks
    with different functions together to fulfil a single purpose of a good Keylogger.
    Now let’s go ahead with the case incorporation (filtering) and better general
    code arrangement.


    ## Case incorporation


    We have incorporated more `break` statements at the end of each check, so if the
    conditional statement evaluates to true, the program should jump the loop and
    move on to the next task. Also in the `else` part where we have the `switch` statement
    with `cases` under it; for all the characters we see ranging from the parenthesis,
    backslash, forward slash, exclamation mark etc. in the figure below, they are
    written in a way in which the program can tell that just a value was pressed without
    a shift key and therefore it should print that value and not a symbol.


    ![](images/00063.jpeg)


    For instance, on Line 48 we have `case 48` written. `48` on the ASCII table represent
    the number `0`.


    ![](images/00064.jpeg)


    So, when a user presses the key that carries the number `0` and at the same time
    a close parenthesis, depending on whether shift is pressed or not (based on the
    statement of Line 50), either a close parenthesis `)` or a `0` will be recorded
    (examine the code within Line 48 and 52). With the `GetAsyncKey(0x10)` function
    on Line 50, the program verifies whether the shift key is being pressed or not
    and if it is and `0` is being pressed along with it then the close parenthesis
    will be considered and if it is not, `0` will be written.


    With the `break` statement on Line 55, if the condition, which lies within Line
    48 and 54, evaluates to true, the program does not go checking other cases out
    just yet, it exits the loop immediately.


    Basically, for the rest of the cases in the program from Line 48 down concerned
    with determining whether or not it is a number typed by the user or a symbol sharing
    the same key as the individual numbers on the keyboard, we follow the same logic
    as we have for the `0` or close parenthesis case which falls within Line 48 and
    53.


    ![](images/00065.jpeg)


    The figures below shows what the cases will look like put together:


    ![](images/00066.jpeg)![](images/00067.jpeg)![](images/00068.jpeg)![](images/00069.jpeg)![](images/00070.jpeg)


    Now we have incorporated cases to cover both the keyboard numbers and symbols,
    let us go ahead and test if they function properly.


    ![](images/00071.jpeg)


    Having gathered the cases to cover numbers and symbols of the Keyboard, it is
    good that we test to see if the Keylogger actually recognizes them. So as seen
    above, we have built the code and set it to run. Using the command prompt window
    we type in the digits on the keyboard and also the symbols by holding down the
    shift key combing the digits `1 – 9` one after the other.


    ![](images/00072.jpeg)


    From the figure above it is clear that the Keylogger recognizes our number and
    symbol inputs and so, if a user happens to use numbers and symbols for password
    or username or anything else, our Keylogger at its present state will still do
    good magic.


    Earlier, we added a function which enables our Keylogger tell the difference between
    upper and lower case letters so it will still do fine if a user uses a mixture
    of numbers, symbols, upper and lower case letters as password.


    ![](images/00073.jpeg)


    Having come this far, we can decide to utilize the Keylogger the way it is but
    adding more functionality wouldn’t be bad at all as the more keys we get to add
    to the Keylogger, the better we can trust its overall performance. Lets go ahead
    and add more cases that will make our Keylogger generally more relevant.


    ### Virtual Keys


    So far we have been adding series of cases revolving around numbers, letters and
    symbols however an area we haven’t really done much is the area of virtual keys.
    The virtual keys cover `tab`, `capslock`, `backspace`, `escape`, `delete` and
    many more such as `f-keys`, `num lock`.


    Within Line 127 down to 145, we have incorporated a good number of really important
    codes, such as the `backspace`, `delete`, `escape` as seen above. As observed,
    the virtual Keys can be written without using neither the `if` statement nor the
    curly brackets and they still function fine.

