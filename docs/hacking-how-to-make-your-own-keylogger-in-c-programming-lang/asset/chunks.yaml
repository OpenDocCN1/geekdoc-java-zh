    However, there is a way we can hide this window. We can do this by creating a
    function -that will hide the entire program- within our code. Let us begin by
    giving this function a name that will help us identify it from within the code
    so we can make reference to it whenever need be, say: hide.


    ![](images/00082.jpeg)


    In creating the function that will hide the Keylogger we will need to first create
    a function outside the main function and then call it within it (the main function)
    we will also need to create another function at the end of the program.


    On line 9, a function that will hide the Keylogger is created with the name hide.
    It is created outside the main function. Following this, the function is called
    within the main function on Line 13 and an extension of this function is also
    added to the end of the program as seen in the figure below:


    ![](images/00083.jpeg)


    On Line 182, a handler called stealth is created to handle the input (the Keylogger
    window being displayed on the home screen) generated by the FindwindowA() function.
    On Line 185, details of the Keylogger window which has been obtained and stored
    in stealth, is set to 0. Zero implying that it shouldn’t display it on the home
    screen.


    That done, on building and releasing our Keylogger afresh as an executable file,
    we obtain a wonderful result. The Keylogger no longer displays a window on the
    home screen so not even you the creator can see that it is running. Confirming
    whether your code is running might be a problem however. A way you can check it
    is by writing something anywhere on your system perhaps your notepad. After this,
    open your workspace as well as the Record.txt file and if your keystrokes are
    saved then your Keylogger works.


    If you have gotten to this point, big congrats to you!


    Finally, we have come to the end of this course which illustrates how to build
    a Keylogger. Hopefully at this point, making your own Keylogger wouldn’t seem
    like an impossible task to you anymore but one that can easily be accomplished
    without much stress.


    Though the Keylogger we have built here might not be the most advanced one that
    there is out there or one with the super features that you expected a Keylogger
    to have, however with the knowledge you have gathered on building what we have
    here, making others with more advanced features such as webcam activation, screen
    capturing and other cool features wouldn’t be a problem to you with little research.


    Furthermore, if you followed this course it is expected that you understand pretty
    much about the C++ programing language, its syntax, how it functions and you are
    able to write other programs beside the Keylogger which you have just learnt to
    build.


    Continue practicing, researching and finding solutions to problems you will encounter
    along the way and you will record great improvements.


