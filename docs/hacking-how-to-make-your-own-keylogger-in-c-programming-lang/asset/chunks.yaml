    基本上，不仅在 C++ 中，在其他编程语言中，指针被用于显示变量的内存位置。让我们分析上面的的小程序，帮助我们理解指针是如何使用的。


    从 1 行到第 6 行的代码与我们之前编写的代码中的用途相同。在第 9 行声明了一个 `int` 类型的变量 `num`。由于指针会显示变量的内存位置，必须有一个声明了位置的变量。在第
    10 行声明了指针。这是通过使用与要建立位置的变量相同的变量类型，后跟一个星号，最后是指针的名称完成的。指针可以有任何名称，上面的程序使用了 `ptr`。


    现在，在第 9 行，让指针指向变量 `num`。这是通过输入指针名称（`ptr`）并将其等于取地址符（`&`）和变量名（`num`），中间不留空格来实现。在第
    13 行，写了一个 `COut` 语句来输出 `num`（我们之前将其设置为值 10）和 `ptr`，后者将显示 `num` 的内存位置。如上图所示，运行代码时，它会显示
    `num` 中包含的值（10）以及变量的内存位置（0x28ff18）。


    注意，在第 13 行，如果我们想让指针向控制台打印变量包含的值，只需在 `ptr` 之前加上一个星号，如下所示。


    ![](img/00032.jpeg)


    ## Files


    我们可能会在问自己，到底为什么我们需要文件。嗯，如果我们我们需要键盘记录器（Keylogger），我们就需要知道如何使用文件，因为如果在某人的系统上安装了键盘记录器，我们将用户的按键存储在文件中。如果用户输入
    ABC，它应该被写入某个地方的文件。


    我们需要知道如何仅用 C++ 写入文件。这是一个非常简单的过程，在任何方面都不复杂。事实上上，它与 `Cout` 和 `Cin` 非常相似。我们只需要做：


    *   在 `#include<iostream>` 下方输入 `#include <fstream>`，这样我们就能写入文件了。

    *   像第 8 行一样创建一个输出流并给它命名。输出流通过只需写入 `ofstream` 并添加你选择的任何名称创建的。在第 8 行，输出流的名称是 `write`。注意必须指定路径，否则它将在你的项目文件夹中。


    ![](img/00033.jpeg)


    要找到默认路径，根据你系统上的设置，点击“PC”或“我的电脑”，点击“本地磁盘”，然后点击“用户”。点击你当前使用的用户名。


    *   找到“Work space”（工作空间）并点击它


    ![](img/00034.jpeg)


    在“Workspace”中，寻找你的 C++ 项目名称并点击它。如果你将项目命名为 Keylogger，那么你应该在寻找 Keylogger。


    ![](img/00035.jpeg)


    *   保存的按键默认会在 Keylogger 内部。


    让我们继续指定文件路径，以便我们将希望获取的按键发送到精确位置。


    ![](img/00036.jpeg)


    在第 8 行文件创建语句前的括号内，包含你所所需的路径。在上面的程序中，`C:\Users\Creator\OUR_FILE` 是选定的路径，存储的按键将跟到
    `OUR_FILE`（文件名），并在那里被存储。完成此操作后，文件名就形成了，并指定了它的路径。


    ### 写入你的文件


    为了写入你的文件，换句话说将输入发送到你创建的文件，在某行写下你的文件名（在上面的程序中：`write`），就像你用 `Cout` 打印语句一样：


    ```

    Write << “……”

    ```


    ![](img/00037.jpeg)


    现在，从上图中显示的程序部分，看看这条语句：


    “Windows is awesome I like working in it, I like all the freedom I have in it
    as” “opposed to Linux”


