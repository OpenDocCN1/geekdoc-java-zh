    在第 15 行和第 18 行之间，我们另一个嵌套在第一个循环之下的 for 循环。程序会评估第 15 行的代码，只要评估结果为 `true`，它就会持续打印第
    17 行的语句，直到结果变为 `false`——当 `j` 大于或等于 3 时它将停止，退出第二个循环并重新进入第一个循环，然后会再次打印第 20 行的语句。如果第一个条件再次评估为
    `true`，第二个循环将再次运行，如此重复 3 次（0 – 2 = 即 0, 1, 2 次）。请结合其输出结果学习下面的程序。


    ![](img/00045.jpeg)!(images/00046.jpeg)


    现在你已经理解了嵌套结构是如何运作的，让我们直接进入它在键盘记录器（Keylogger）上的应用。


    ![](img/00047.jpeg)


    从正上方的图中可以看出，第 12 行包含一个 for 循环。括号内的两个分号指定该循环是无限循环，即它被设置为持续运行而不停止。在第 14 行有一个嵌套循环，其条件指定了程序能够读取的字符范围。这组字符范围是从
    ASCII 码获得的。没有必要在脑中携带 ASCII 表，可以直接从网上引用它。下面是一个 ASCII 代码表示例：


    ![](img/00048.jpeg)


    每个数字代表数量数量字符。在我们的键盘记录器程序中，第 14 行包含了 ASCII 表中 8 到 222 之间的字符。第 16 行的语句对我们来说是一个新语句，但它并不复杂。它被称为系统中断函数。它的作用仅仅是观察计算机用户是否在键盘上输入了任何内容。考虑到它与
    if 语句一起使用，它的意思是：用户按过任何键吗？如果是，将键存储在我们的变量 `c` 中，然后根据第 18 行和第 19 行将其发送到我们的文件中。


    在同一行（第 18 行）的括号内，`ios::app` 指定我们不希望每次有人按键时都重写文件。如果不指定这一点，每当用户按键时，文件都会重新打开，之前写入的内容将被新内容覆盖。


    看起来我们已经完成了原始的键盘记录器并准备好运行它了。然而，如果我们尝试按照目前的方式运行程序，我们将得到一个错误消息。粗一看，你认为什么可能导致错误？


    头文件！我们未能附加启用程序运行/执行我们代码中指定函数的头文件，即将接收到的输入发送到文件的函数。用于此功能的头文件（让我们能够利用 `ofstream`
    函数）是 `#include <fstream>`。现在，在我们的代码开头加上以下头文件后，我们的程序将成功运行：


    ![](img/00049.jpeg)


    在我们的 eclipse 环境中运行键盘记录器程序时，我们可能会认为程序没有运行，因为窗口控制台中不会打印任何内容。不过这是正常的，因为我们没有在代码的任何地方指定要打印输入，而是将其发送到我们的文件中。


    我们的小型键盘记录器目前正在存储我们在系统任何地方记录的击键，并将其发送到 `Record.txt`。为了证明键盘记录器正在工作，让我们访问浏览器，进行输入并返回文件查看我们的输入是否已存储。


    ![](img/00050.jpeg)


    在上面的图中，可以看到打开了浏览器并访问了 Yahoo 网站。现在我们登录了，输入用户名为 `USERNAME`，密码为 `PASSWORD`。在此之后，为了确定我们的键盘记录器是否在运行，我们进入键盘记录器项目的默认文件位置，正如部分覆盖浏览器的白色屏幕上所示，我们为
    Yahoo.com 网站输入的内容被记录了（然而，`yahoo.com` 中的点没有出现，在我们继续为键盘记录器添加更多功能时，我们将确保考虑所有的字符）。如所示，用户名和密码也被记录了。


    我们已经成功地编写了一个非常简单的键盘记录器，但它缺少一些功能，例如过滤器，过滤器可以过滤掉一些不需要的字符，例如在我们输入时出现的类似 Tab 的空格。此外，我们还将致力于为其添加其他功能。


    我们构建的这个键盘记录器并不太完美，主要是因为记录信息的方式。当我们测试运行它时，发现它既不能处理空格也不能处理制表符，而是直接保存了输入。让我们在键盘记录器中构建更多功能，使其更擅长处理输入。我们可以通过利用
    Switch 语句来实现这一点。让我们立即开始！


    之前提到过，为了让我们的键盘记录器具备处理空格、制表符和其他字符的能力，我们必须使用 `switch` 语句。然而，在引入 `switch` 语句之前，我们需要将之前编写的
    ![](img/00051.jpeg)代码归类到一个函数下：`void log()`，以便于我们操作。我们的分组将如下所示所示：


    ![](img/00052.jpeg)


    因此在第 8 行创建了名为 `log` 的 `void` 函数来容纳我们之前的代码。此函数不返回任何值。此外，按照要求，`void` 在第 8 行的 `main`
    函数中调用，这样就可以通过简单的调用来随时使用，而不需要重新写一遍。重新测试程序时，它将像以前一样运行。


    ### 引入 switch 语句


    参考上图：


    *   删除第 27 行的 `<< c`。我们将将其放回默认情况（default case），以防所有条件都评估为 false。

    *   如第 28 行所示，编写 `switch` 语句并将之前创建的变量 `c` 的任何情况通过括号传递给 `switch`。

    *   让我们创建一个 case（不同条件之一），例如 case 8。这样，如果变量 `c` 的数值为 8（如 case 8 所示），在 ASCII 中意味着这是一个退格键![](img/00053.jpeg)


    换句话说，第 22 行到第 35 行的语句的作用如下：


    第 22 行涵盖了 ASCII 码 8 到 222 之间的值。24 行包含一个条件 if 语句，用于检查是否有按键中断，即用户键盘上是否按了任何键，如果评估结果为
    `true`，第 26 行的函数应该记录这一点，将其存储在名为 `Record.txt` 的文件中，并确保后来的输入不会覆盖之前的输入。第 28 行的 `switch`
    语句让在第 30 行和第 34 行中评估的情况传递给变量 `c`。第 35 行将保存用户的击键——假设他没有按下 ASCII 码 8 到 222 之间的任何键，或者我们
    case 覆盖的任何键，正如我们在原始键盘记录器中这样做那样。


