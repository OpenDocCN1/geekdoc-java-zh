    mark? Depending on the keyboard you use, however for the exclamation mark it is
    quite universal; Shift 1 will give you that. We need to make a statement, which
    will recognize the state of the shift key and if the shift key is pressed and
    the value, which follows after, is the ASCII value of the number 1 on the keyboard,
    please don’t record 1, record “exclamation mark” instead.


