    如上所示，`if` 语句（用于跳出循环）和 `break` 语句被直接放置在要求用户输入的第 13 行下方，这样当用户输入值 `-1` 时，循环将被打破并打印
    `else` 语句。在输入除 `-1` 以外数值的情况下，第 12 行的语句将打印出来，之后第 13 行将要求用户为变量 `b` 输入值。同样，如果变量 `b`
    输入了除 `-1` 以外的值，下方的其余条件语句将被求值，并打印相应的结果：


    ![](img/00022.jpeg)


    此外，重要的一点是，你要知道如何安排代码行以产生特定的输出，这并不是 `C++` 特有的。。这只需要基础的逻辑。你只需要了解不同的语句、它们的作用以及如何使用它们。为了实现特定功能而对这些语句进行的安排，完全取决于你的想法。


    接下来我们将学习 `For` 循环。但在进入主题之前，让我们看看增量是如何工作的。


    ![](img/00023.jpeg)


    到目前为止，我们之前程序中的所有内容都保持不变，但在第 9 行，有一个变量 `i` 被初始化，即设置为 `0`。创建这个变量 `i` 是为了在 `while`
    循环内部使用，以设置循环内程序终止前的运行次数。


    `While( i <= 3 )` 位于第 10 行是一个条件，它指令程序在 `i` 的值小于 `3` 时继续运行，一旦 `i` 变为 `3` 就停止，即程序将运行三次。


    ![](img/00024.jpeg)


    在第 35 行，`i++` 是一个增量语句，它意味着每完成一次循环，就给 `i` 的值加 `1`。它也可以写成：`i = i + 1`，不过 `i++` 较短，也是大多数人的用法。


    `i` 被添加在每个条件语句的末尾，因此每个循环结束后都会显示完成的循环次数。


    ### For 循环


    `For` 执行的功能与 `While` 循环基本相同。它们的相似之处在于两者都能让程序以迭代的方式运行。然而，它们之间的区别在于在程序中的利用方式。


    ![](img/00025.jpeg)


    从上图中可以看到 `for` 循环是如何写的。`For( int i = 0; i < 3; i++)` 仅仅意味着变量 `i` 被赋值为持有 `variable`
    类型的数据，并初始化为零。`i < 3; i++` 指令程序持续运行（记录完成循环的次数），直到 `i` 比 `3` 小 `1`，即程序将仅运行两次。此外，值得注意的是，由于增量是在
    `for` 循环的括号内进行的，因此增量仅对该块内（第 10 行到 25 行）的程序有效。


    ### 利用数学运算符


    如所述，`C++` 世界中的数学运算符与现实世界中的并无区别。让我们看看这些运算符如何使用，特别是与其他数据类型（如 `float` 和 `double`）一起，因为我们目前为止一直在处理整数。我们还将看到为什么某些数据类型
    ![](img/00027.jpeg)


    如果变量 `a` 和 `b` 是 `float` 或 `double` 类型，结果将完整打印出来，即整数部分和小数部分，如如下图所示。


    在上述程序的第 10 行，执行了与之前相似的除法运算。但在这次特定操作中，值被赋值给 `double` 类型的变量（`c = 10.3, d = 60.234`）。可以看到，运行程序后，打印出的答案是
    `0.171`。答案带有小数部分是因为赋值的变量类型（`double`）。


    到目前为止，我们一直在处理 `C++` 的基础，预计到现在，你已经能够编写一个简单的程序，也许是一个“Hello world”程序。然而，如果某些事情你仍然不理解或没有真正掌握，不要恐慌，随着我们编码的进行，你一定能跟上。


    ### 函数


    函数是组合成一个整体以执行特定功能的代码组。我们在这里谈到的函数与我们通常编写的普通 `main` 函数类似。我们之所以需要函数，是因为我们需要组合某些代码块来执行特定的功能。例如，假设我们需要一个函数来进行加减除一组数字，我们可以在
    `main` 外部创建函数，并在 `main` 内部调用。


    在第 5 行，创建了一个 `sum` 函数来接收 `variable` 类型的输入。在括号内，`sum` 函数声明了变量 `a` 和 `b`。在第 8 行，声明了
    `main` 变量并在其中定义了特定的任务。


    第 10 行编写的“3 和 5 之和为：只是一个将打印出来的语句。然而，在该行的末尾，调用了 `sum` 函数，并将变量 `a` 和 `b` 分别设置为 3
    和 5。在第 14 行，在 `main` 函数外部创建的函数被引入其中。最后，在第 16 行编写了计算 `a` 和 `b` 之和的数学运算。运行程序时，变量
    `a` 和 `b` (3,5) 的和显示结果为 8。

