    # 引言


    今天，随着 `Keylogger`（键盘记录器）程序的出现，未经授权访问计算机用户的密码、账户和机密信息已变得轻而易举。在能够监控之前，你并不一定需要用户计算机的物理接触，有时用户只需点击一下指向你程序的链接即可。


    任何具有计算机基础知识的人都可以使用 `Keylogger`。在本章结束时，希望你能够通过我为你提供的简单、详细且带有插图的步骤制作出你自己的 `Keylogger`。


    ### 什么是键盘记录器？


    `Keylogger`，有时被称为“键记录器”或“系统监控器”，是一种计算机程序，它通过监控和记录计算机用户的每一个按键来获取未经授权的密码和其他机密信息。


    ### 编写自己的键盘记录器 vs 下载现有的


    之所以编写自己的 `Keylogger` 而不是直接从互联网下载的原因是反病毒软件的检测问题。如果你为 `keylogger` 编写了自己的自定义代码并将源代码留给自己，那么专门制作反病毒软件的公司将对你的
    `Keylogger` 一无所知，因此被破解的几率将大大降低。


    此外，从互联网下载 `Keylogger` 是极其危险的，因为你不知道程序中可能嵌入了什么。换句话说，你自己的系统可能会被“监控”。


    ## 制作你自己的键盘记录器的要求


    为了制作你自己的 `Keylogger`，你需要准备好某些特定的包。其中一些包包括：


    ### 1. 虚拟机


    当代码编写好并需要测试时，并不总是建议直接在你的计算机上运行它们。这是因为代码可能具有破坏性，运行它们可能会导致你的系统受损。在测试编写的程序时，利用虚拟机就非常方便。


    虚拟机是一个具有与你计算机系统相似环境的程序，可以在其中测试可能破坏性的程序，即使它们真的具有破坏性，也不会对其造成任何微的伤害。


    如果你说——在虚拟机内部发生的任何事情都留在虚拟机内部，那么你是对的。虚拟机可以很容易下载。


    ### 2. Windows 操作系统


    我们将制作的 `Keylogger` 将是一个只能感染 Windows PC 的。我们选择制作这样的 `Keylogger` 是因为大多数桌面用户使用 Windows
    平台。然而，除此之外，制作一个可以感染 Windows 系统的 `Keylogger` 比制作一个可以在 Mac PC 上运行的要容易得多。出于这个原因，我们从简单的工作开始，以后可以在我的下一本书书中向更复杂的工作进。


    ### 3. IDE – 集成开发环境


    IDE 是一套整合了开发者编写和测试软件所需的各种工具的软件套件。


    通常情况下，IDE 包含代码编辑器、调试器和编译器，开发者通过单一界面访问它们。我们将在此项目中使用名为 `eclipse` 的 IDE。


    ### 4. 编译器


    编译器是一种特殊的程序，它处理用特定计算机语言编写的语句，并将其转换为机器语言或计算机可以理解的 `code`。


    在我们开始编写键盘记录器之前，我们需要设置环境，并学习一些关于 `C++` 的基础知识，因为大多数 Windows 代码都是用它编写的，而我们的 `Keylogger`
    目标是 Windows。


    提前告知你，由于语法的性质，`C++` 并不是容易学习的编程语言。尽管如此，不要立刻放弃，我们将从简单内容开始，逐渐过渡到高级内容，采取全面的循序渐进的方法。


    我还建议你使用关于 `C++` 的外部材料来扩展你在这个项目过程中将涉及的领域的知识，这将提高你的生产力。


    希望在本章结束时，你将能够制作出你自己的 `Keylogger`，并对其进行修改以适应你的用途。


    # 环境搭建


    就像我们在开始使用计算机系统之前需要设置它们一样，我们同样需要设置一个能够让我们编写 `C++` 代码并最终制作 `Keylogger` 的环境。


    我们需要第一个东西是集成开发环境 (IDE)，正如之前提到的，我们将使用 `Eclipse`。我们选择的 IDE (`Eclipse`) 是基于 Java
    的，因此我们需要访问 Java 网站 ([www.eclipse.org](http://www.eclipse.org)) 下载它。


    ![](img/00001.jpeg)


    当我们进入 Java 网站时，我们会发现有很多可选的 Eclipse 程序。然而，由于我们打算使用 `C++` 编程语言，我们下载 `Eclipse for
    C/C++ developers`，同时脑海中记得我们正在 Windows 平台上工作。因此，虽然有适用于 Linux、Solaris、Mac  Eclipse
    版本，但我们将下载 Windows 版本的 Eclipse。


    ![](img/00002.jpeg)


    我们还需要根据计算机运行的操作系统在 32 位或 64 位之间进行选择。你可以右键点击“此电脑”或“我的电脑”并轻松检查你的系统运行什么位数。在确定位数后，下载与之兼容的
    Eclipse 文件。


    '
- fmt: '

    When the download is complete, the downloaded file will be in your download folder
    by default unless you made changes locate it. We will be required to unzip the
    file, as it will be zipped.


    After the unzipping and installation of the Eclipse file, an attempt to run it
    will result in the display of an error message stating that Eclipse cannot work
    without a Java Run time Environment (`JRE`) or a Java Development Kit (`JDK`).
    This is no problem at all, as all we need do is return to the Internet and download
    a `JDK`. The latest versions of the `JDK` usually come with the `JRE`.


    We can simply Google “Java development kit” and click on a link leading to the
    Oracle website where we can make the required download.


    ![](images/00003.jpeg)


    On the site, we have got the `JDK` program for a lot of different operating systems
    and for different system bits ranging from `JDK` for Linux system to `JDK` for
    Mac OS Solaris and more. However, as we know, we are interested in a `JDK` for
    the windows OS. So we go right ahead and download it making sure it fits our system
    bits (32 or 64).


    ![](images/00004.jpeg)


    We will be required to accept the Oracle Binary Code License agreement by clicking
    on the box provided before we can begin the download. We do this and go ahead
    with the download and installation of the `JDK`.


    Now, unlike most programs we download, we have to set environment variables path.
    We do this for the `JDK` because it does not automatically set its path like most
    other programs do. The implication of an unset variable path is that: each time
    we want to run such a file (with unset variable path), we have to specify the
    full path to the executable file such as:


    `C:\Program Files\Java\jdk1.7.0\bin\javac”Myclass.java`. This could be really
    tedious and also lead to lots of errors.


    For instance Eclipse requires `JDK` to run, but if the `JDK` path is not set,
    Eclipse will be unable to locate it and thus will not be able to run unless the
    path manually inputted. Setting path simply means setting an address to make the
    location of the program possible.


    ### Setting The JDK Path


    1.  Navigate to file explorer (shortcut: `windows + E`), right-click on “PC” or
    “My computer,” from the drop down menu that is displayed, click on “Properties.”![](images/00005.jpeg)

    2.  Click on advanced settings and then from the pop-up menu that appears, click
    on “environment variables” then navigate down to system variables and select one
    at random.![](images/00006.jpeg)

    3.  Press “P” on your keyboard and you will be redirected to “Path.” Now let’s
    go ahead and edit it. The default path will begin like so: `%systemRoot%`... As
    it is shown in a more complete form in the figure below. (The address was only
    shown in notepad for enlargement purposes, you need not place the path in notepad
    too.) We are going to make an addition to the default path.![](images/00007.jpeg)

    4.  Add `C:\mingw\binbin;` to the already existing address, so it looks just the
    way it is in the figure below. Avoid making any other change in the path, else
    an error message will be encountered on attempt to run Eclipse.![](images/00008.jpeg)

    5.  Click on “OK” as many times as you are prompted to and finally, click on apply
    and the JDK path is set.


    True, we have made a couple of downloads and we should jump right into the meat
    of the matter: making our Keylogger but wait just a minute, are we not forgetting
    something? Of course we are!


    We have a Virtual Machine where all operations regarding our Keylogger will be
    carried out. We have Eclipse where all our code writing will be done, we also
    have the `JDK` which will enable us run Eclipse on our system. What we lack is
    a compiler which will translate our C++ written codes to machine language which
    is understandable to our computer systems.


    Without wasting time, we can download our compiler from [www.mingw.org](http://www.mingw.org)
    even though there are still other sites we can make downloads from. However, MinGW
    is straightforward.


    ![](images/00009.jpeg)


    Hit the download button at the top right hand corner to start downloading the
    compiler. Again, the compiler is going to be in a zipped format and like we did
    for the `JDK` we downloaded previously, unzip it by extracting its content to
    any location of your choice. Finally, install the compiler.


    Now, with the variable path set, the `JDK` and a compiler installed, we can comfortably
    lunch the eclipse environment without getting any error messages and write our
    codes with certainty that they will be interpreted to our computer and will be
    executed too.


    # Setting the Eclipse environment


    On lunching Eclipse, greetings with a welcome screen that will offer a tour around
    the eclipse environment will be displayed. If you happen to be one that loves
    practical guides, you could go on with it, else close it. Immediately after the
    greeting note, Eclipse displays a small default program, which will print “hello
    world” when, compiled. Do not worry about how complex these codes might seem at
    first glance, as we progress things will unwrap and you will see that coding is
    just piece of cake waiting to be eaten.


    ![](images/00010.jpeg)


    The lines in purple, blue and green texts are called “Codes.” We will be playing
    around with them in no time.


    ## Steps To Setup the Environment for Coding


    1.  Close the default program. We can achieve this by clicking on the projects
    ‘x’ button at the left hand side of the screen.

    2.  Click on “File” in the upper left left, select “New” then C++ project because
    we want to create environment.

    3.  Give the project you want name e.g. Keylogger, Calculator, Mary Jane.

    4.  Under “Project type” select “Empty project.” Select “MinGW GCC” (which is
    the compiler) under “Toolchains.” Click on “Next” to proceed with author settings
    or click “Finish” to go to Eclipse editor directly.


    …and we are done with things in that category. Now, just like we did for the `JDK`,
    we need to go ahead and set some paths here.


    ### Listed below are the steps


    1.  Go to your project name, right-click on it and from the down menu that appears
    scroll down and click “Properties”.

    2.  Expand the C++ Build and from the down menu, click on “Environment.”![](images/00011.jpeg)

    3.  Under “Environment path to select,” click on `Path` and click on “Edit.” The
    path displayed is long, cumbersome and tedious however, we only need to add a
    small path to its beginning.

    4.  Remember the path we copied out when we were setting our `JDK` path variable?
    `C:\mingw\binbin;` paste it at the beginning of the eclipse path variable so it
    looks like it does in the figure below:(images/00012.jpeg)

    5.  Click on “Apply”


    We have just one more thing to do and we are done with setting eclipse. This is
    setting the binary parser.


    1.  Click on “File” and from the down menu that appears, click on “Properties,”
    “C++ Build” and then go into settings.

    2.  Under “Settings,” Click on “Binary Parser.” Make sure that the PE Windows
    parser is ticked.![](images/00014.jpeg)

    3.  Click on “Ok” and that’s all about the settings.


    ### How to run written Codes


    Now that your environment is set your coding can begin. However it does not all
    end at just writing many many lines of codes, running them is important as it
    enables the coder know if what he is writing is coming out the way he wants it.
    You run your codes as you write so you know the outcome of what you have written
    and if there any changes you will like to make. Here are simple steps to running
    your written codes:


    1.  At the upper left corner of the eclipse environment, there is a hammer symbol.
    The hammer signifies “Build.” Without building the written code, it will not run.
    Click on it (Shortcut: `Ctrl B`) to build your code.

