  trans: '


    嗯，从 ASCII 码来看，第 (47) 行的值 `49` 代表数字 `1`。第 49 行写道：`如果 shift 键（十六进制形式表示为 0x10）被中断，请告诉我们。`。此外，由于程序列表中加入了
    `case 49`，如果用户在按下 shift 键后立即在键盘上输入数字 `1`，它将根据第 50 行的指示将感叹符号 `!` 发送到 `RECORD.txt`。


    ![](img/00061.jpeg)


    如上所示，键盘记录器（Keylogger）正在运行和测试。我们利用引号以及一段短备注（通过命令提示符窗口输入“Heythere”）来查看它是否能识别感叹号并将其发送到我们定义的项目文件
    `!`，或者仅仅给我们返回其他结果。


    ![](img/00062.jpeg)


    太棒了！如上所示，我们的键盘记录器现在将感叹号以其真实的内容写入，而不仅仅是一个奇怪的图形。*高亮显示的语句是之前测试过的内容，它并不属于最近测试结果的一部分。*


    从现在起，我们只需要继续基于 `switch` 语句进行构建，添加越来越多的 `cases` 来表示我们希望键盘记录器能够解释的所有字符。这将允许我们根据喜好的键盘对键盘记录器进行自定义，这样即使某人的按键配置不同，虽然会影响你，但影响并不大。


    到为止，我们已经分块编写了代码，从分支检查块、字符整合块到文件记录块等，并将这些具有不同功能的块组合在一起，实现一个优秀键盘记录器的单一目标。现在让我们继续进行分支整合（过滤）和更好的通用代码安排。


    ## Case 整合


    我们在每个检查的末尾加入了更多的 `break` 语句，因此如果条件语句求值为真，程序应该跳出循环并处理下一个任务。同样，在 `else` 部分，我们有带有
    `cases` 的 `switch` 语句；对于我们在底图中看到的从括号、反斜杠、正斜杠、感叹号等所有字符，它们的编写方式使程序能够判断出只是按了一个值而没有按下
    shift 键，因此它应该打印该值而不是符号。


    ![](img/00063.jpeg)


    例如，在第 48 行我们写了 `case 48`。ASCII 表上的 `48` 代表数字 `0`。


    ![](img/00064.jpeg)


    所以，当用户按下带有数字 `0` 的键并同时按下右括号时，取决于是否按了 shift（根据第 50 行的语句），将记录右括号 `)` 或数字 `0`（检查第
    48 行和 52 行内的代码）。通过第 50 行的 `GetAsyncKey(0x10)` 函数，程序会验证 shift 键是否被按下，如果是且同时按下了
    `0`，则会被视为右括号；否则，将写入 `0`。


    通过第 55 行的 `break` 语句，如果第 48 行和 54 行之间的条件求值为真，程序将不会去检查其他 cases，而是立即退出循环。


    基本上，对于程序从第 48 行向下数的剩余 cases，涉及判断用户输入的是数字还是与键盘上各个数字共用键的符号，我们遵循与处理第 48 行和 53 行的
    `0` 或右括号情况相同的逻辑。


    ![](img/00065.jpeg)


    下面的图展示了这些 cases 组合后的样子：


    ![](img/00066.jpeg)![](img/00067.jpeg)![](img/00068.jpeg)![](img/00069.jpeg)![](img/00070.jpeg)


    现在我们已经整合了涵盖键盘数字和符号的 cases，让我们继续测试它们的功能是否正常。


    ![](img/00071.jpeg)


    在在收集了涵盖键盘数字和符号的 cases 后，测试一下键盘记录器是否真的能识别它们是非常好的。正如上文所示，我们已经构建了代码并设置为运行。使用命令提示符窗口，我们在键盘上输入数字，并通过按住
    shift 键连续输入数字 `1–9` 以及符号。


    ![](img/00072.jpeg)


    从上面的图中可以看出，键盘记录器识别了我们的数字和符号输入，因此，如果用户恰好使用数字和符号作为密码、用户名或其他任何内容，我们的键盘记录器目前的状态仍然能够良好工作。


    早些时候我们添加了一个函数，让键盘记录器能够区分大小写字母，这样如果用户使用混合数字、符号、大写和小写字母作为密码，它仍然能够良好运行。


    ![](img/00073.jpeg)


    走到这里，我们可以决定按原样使用键盘记录器，但添加更多功能也完全没有坏处，因为为键盘记录器添加的按键越多，我们对其整体性能的信任就越高。让我们继续添加更多
    cases，让我们的键盘记录器在通用范围内更实用。


    ### 虚拟键 (Virtual Keys)


    到为止，我们一直在添加围绕数字、字母和符号的一系列 cases，但我们还没有真正做的很多领域是虚拟键。虚拟键涵盖了 `tab`、`capslock`、`backspace`、`escape`、`delete`
    以及许多如 `f 键`、`num lock`。


    在 127 行到 145 行之间，我们整合了很多非常重要的代码，如上所示的 `backspace`、`delete`、`escape`。正如观察到的，虚拟键不需要使用
    `if` 语句或大括号即可编写，并且功能依然正常。


