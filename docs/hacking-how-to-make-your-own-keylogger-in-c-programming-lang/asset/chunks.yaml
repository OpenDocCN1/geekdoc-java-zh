    Eclipse。我们缺少的是一个编译器，它将我们编写的 C++ 代码翻译成计算机系统理解的机器语言。


    不要浪费时间，我们可以从 [www.mingw.org](http://www.mingw.org) 下载编译器，尽管还有其他网站可以进行下载。然而，MinGW
    非常直观。


    ![](img/00009.jpeg)


    点击右上角的下载按钮开始下载编译器。再次，编译器将是压缩格式，就像我们之前下载 `JDK` 一样，通过将其内容提取到你选择的任何位置来解压。最后，安装编译器。


    现在，设置了变量路径并安装了 `JDK` 和编译器，我们可以舒服地启动 Eclipse 环境而不会出现任何错误信息，并放心地编写代码，确定它们会被我们的计算机解释并执行。


    # 设置 Eclipse 环境


    启动 Eclipse 时，将显示欢迎屏幕，提供 Eclipse 环境的导览。如果你恰好是一个喜欢实用指南的人，你可以继续，否则请关闭它。在问候之后之后，Eclipse
    显示了一个小的默认程序，它在编译时会打印“hello world”。不要担心这些代码初看起来可能有多复杂，随着我们的进展，事情将会迎刃而解，你会发现编码仅仅是小菜一碟。


    ![](img/00010.jpeg)


    紫色、蓝色和绿色文本的行被称为“代码”。我们很快就能玩转它们。


    ## 设置编码环境的步骤


    1.  关闭默认程序。我们可以通过点击屏幕左侧的项目“x”按钮来实现。

    2.  点击“文件”，选择“新建”C++ 项目，因为我们要创建一个环境。

    3.  给项目起一个名字，例如 Keylogger、Calculator。

    4.  在“项目类型”下选择“空项目”。在“工具链”下选择“MinGW GCC”（这是编译器）。点击“下一步”继续设置，或点击“完成”直接进入编辑器器。


    ……我们就完成了该类别的设置。现在，就像我们之前设置 `JDK` 一样，我们需要在这里设置一些路径。


    ### 步骤列如下


    1.  找到你的项目名称，右键点击它，从显示的下拉菜单向下滚动并点击“属性”。

    2.  展开 C++ Build，从下拉菜单中点击“环境变量”。![](img/00011.jpeg)

    3.  在“选择的环境变量”下，点击 `Path` 并点击“编辑”。显示的路径很长、复杂且繁琐，但我们只需要在它的开头添加一个短路径。

    4.  记得我们在设置 `JDK` 变量路径时复制的路径吗？`C:\mingw\binbin;` 将粘贴到 Eclipse 路径变量的开头，使其如下所示：images/00012.jpeg)

    5.  点击“应用”。


    我们还有最后件事要做，就可以完成 Eclipse 的设置。这就是设置二进制解析器。


    1.  点击“文件”，从显示的下拉菜单中点击“属性”、“C++ Build”，然后进入设置。

    2.  在“设置”下，点击“二进制解析器”。确保 PE Windows 解析器已勾选。(images/00014.jpeg)

    3.  点击“确定”，设置就全部完成了。


    ### 如何运行编写的代码


    现在你的环境已经设置好，编码就可以开始了。然而，这并不结束于编写许多行代码，运行它们是非常重要的，因为这让编码者知道他编写的内容是否符合预期。你在编写代码时就运行它们，这样就能知道编写内容的结果以及是否有任何想要做的更改。以下是运行编写代码的简单步骤：


    1.  在 Eclipse 环境的左上角，有一个锤子符号。锤子代表“构建”。如果不构建编写的代码，它将无法运行。点击它（快捷键：`Ctrl B`）来构建你的代码。

