    Basically, a pointer in not just C++ but in other programming languages is used
    in showing the memory locations of variables. Let us analyze the little program
    above to help us understand how pointers are used.


    Codes from Line 1 to 6 serve the same purpose they have always served in previous
    codes we have written. A variable `num` of type `int` is declared on Line 9. Since
    a pointer discloses the memory location of a variable, there has to be a variable
    whose location declared. On Line 10, the pointer is declared. This is done by
    using a variable type, same as that of the variable, whose location is to be established,
    followed by an asterisk and finally the name of the pointer. The pointer can have
    any name, `ptr` was used in above program.


    Now, one Line 9, the pointer is told to point to the variable `num`. This is done
    by typing the name of the pointer (`ptr`) and equating it to an ampersand sign
    (`&`) and the variable name (`num`) with no space in-between. On line 13, a `COut`
    statement is written to output `num` (which we set earlier to a value of 10) and
    `ptr`, which will display the memory location of `num`. As seen in the figure
    above, on running the code, it displays the value contained in `num` (10) together
    with the memory location of the variable (0x28ff18).


    Note that on Line 13, if we wanted the pointer to print to console the value contained
    in the variable, we could simply have put an asterisk before `ptr` as shown in
    the figure below.


    ![](images/00032.jpeg)


    ## Files


    We might be asking ourselves why on earth we need Files. Well, if we are going
    to need a Keylogger, we are going to need know how to use files because if you
    have a Keylogger on somebody’s system, we will be storing the keystrokes of the
    user in the files. If the user types ABC, it should be written to a file somewhere.


    We need to know how to write to a file using nothing else but C++. It is a very
    simple process that is not complicated in any way. In fact it is very similar
    to `Cout` and `Cin`. All we need do is:


    *   Type in `#include <fstream>` just under the `#include<iostream>` so that we
    will be able to write to a file.

    *   Create an output stream just like on Line 8 and give it a name. The output
    stream is created by just writing `ofstream` and adding any name of your choice
    to it. On Line 8, the output stream’s name is `write`. Note that paths will have
    to be specified else, it will be in your project folder.


    ![](images/00033.jpeg)


    To locate the default path, click on “PC” or “My Computer” depending on how it
    is on your system, on “Local Disk” and then on “Users.” Click on the user name
    of the User you are using at the moment.


    *   Locate “Work space” and click on it


    ![](images/00034.jpeg)


    Within “Workspace,” look for your C++ project name and click on it. If you named
    your project - Keylogger, you should be looking for Keylogger.


    ![](images/00035.jpeg)


    *   The saved Keystrokes will be within Keylogger by default.


    Let’s go ahead and specify file paths for the exact location we will like obtained
    keystrokes to be sent to.


    ![](images/00036.jpeg)


    Within the parenthesis in front of the file creator statement on Line 8, include
    your desired path. In the program above, `C:\Users\Creator\OUR_FILE` is the chosen
    path where the stored keystrokes would follow to `OUR_FILE` (the file name) where
    they will be stored. Having done this, your file name is formed and a path to
    it is specified.


    ### Writing to your File


    In other to write to your file or in other words send inputs to your created file,
    on a line number put down your file name (in the program above: `write`) the same
    way you print out statements with `Cout` i.e.


    ```

    Write << “……”

    ```


    ![](images/00037.jpeg)


    Now, from the part of the program displayed in the figure above, take a look at
    the statement:


    “Windows is awesome I like working in it, I like all the freedom I have in it
    as” “opposed to Linux”


    Notice how the quotation mark is used; it makes no difference to the computer
    however as it will all be displayed on a single line unless an escape sequence
    such as: `\n` or `endl` is used.


    ![](images/00038.jpeg)


    In the above figure, the program has been compiled and set to run, however the
    statement in quotes is not printed to the display window. This is normal, as we
    did not instruct the program to display inputs but to send them to `OUR_FILE`.


    Let’s go ahead and confirm if our statement was written to the file we created.


    ![](images/00039.jpeg)


    Ureka!!! There lies our statement within the file we created via the path we set.
    Well done.


    Now, it is good practice to always close a file at the end of its codes. Its easy
    work and we have a built in function for that, it involves just re-writing our
    output filestream name (on line 8: `write`).close()` and then parenthesis with
    a semi-colon as shown in the figure below I.e. `write`


    ```

    write.close();

    ```


    ![](images/00040.jpeg) This will effectively close the file even though we can’t
    close it.


    ### Reading from a File


    We need to know how to read from a file. It is a very simple process that is not
    complicated in any way. In fact it is very similar to `Cout`. Below below shows
    how to read individual characters.


    ![](images/00041.jpeg)


    First of all, we need a variable to store the input, a variable `x` of type `string`
    is created on Line 11. On Line 13, `cin >> x` will read the first word. On Line
    15, `Cout << x` instructs the program to print the value.


    ![](images/00042.jpeg)


    We have finally come through the basics of C++ and so we can now start building
    our Keylogger.


    # Basic Keylogger


    The first things we are going to need for the Keylogger are the `#include <windows.h>`
    and `#include <user.h>` header files because we are going to be needing some functions
    for which these are the requirement.


    Building loops within loops (nested loops) is important, as the Keylogger will
    have lots and of of within it. The The below shows how a loop is built within
    another and made to run infinitely.


    ![](images/00043.jpeg)


    On line 11, a variable of type `char` is created and on Line 13, the first loop
    (for loop begins). Within the parenthesis of this loop, conditions are set to
    govern the operation of the program block. A variable `i` of type `int` is created
    and initialized to 0. The loop is set to continue running as long as `i` is less
    than 3 i.e. `i` will run twice. `i++` counts and records the number of cycles
    the program has completed and stops once it satisfies the condition of `i < 3`.
    The beginning and end or start and finish of this loop is defined by the braces
    which spans from Line 14 to 21.


    Note: Curly braces are used to mark the beginning and end of functions.


    In other words, the for loop on line 13 will begin and once it begins, it will
    start evaluating the conditions laid out within it. If it evaluates to true, i.e.
    if `i` is less than 3, it will run whatever codes are within the curly brackets
    of the for loop.


    ![](images/00044.jpeg)

