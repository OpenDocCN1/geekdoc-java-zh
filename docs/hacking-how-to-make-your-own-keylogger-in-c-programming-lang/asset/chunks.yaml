    # Basic Keylogger


    键盘记录器首先需要的一些东西是 `<windows.h>` 和 `<user.h>` 头文件，因为我们需要一些函数，而这些是要求。


    构建循环中的循环（嵌套循环）很重要，因为键盘记录器内部将有很多。下面显示了如何在另一个循环中构建循环并设置为无限运行。


    ![](img/00043.jpeg)


    在第 11 行，创建了一个 `char` 类型变量，在第 13 行，第一个循环（for 循环开始）。在循环的括号内，设置了条件来控制程序块的操作。创建了一个
    `int` 类型变量 `i` 并初始化为 0。循环设置为只要 `i` 小于 3 就继续运行，即 `i` 将运行两次。`i++` 计算并记录程序完成的次数，并在满足
    `i < 3` 条件后停止。此循环的开始和结束由括号定义，跨越第 14 行到 21 行。


    注意：大括号用于标记函数的开始和结束。


    换句话说，第 13 行的 for 循环将开始，一旦开始，它将开始评估其中列出的条件。如果评估为真，即如果 `i` 小于 3，它将运行 for 循环大括号内的任何代码。


