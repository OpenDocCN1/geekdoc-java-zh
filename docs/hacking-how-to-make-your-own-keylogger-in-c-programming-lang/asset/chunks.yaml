  trans: "\n正如大写和小写字母对英语语言同样重要，它们对通用编程也同样重要，特别是涉及到利用它们来实现键盘记录器（Keylogger）时。我们必须学会如何区分这两种大小写。我们还将对\
    \ `tab`、`caps lock`、`shift`、`alt`、`arrow` 和鼠标键进行一些过滤。\n\n![](img/00055.jpeg)\n\
    \n嗯，我们可以通过 `shift` 键的状态来区分大写和小写字母；我们也可以使用 `arrow` 键的状态。因此，如果这两个键中的任意一个被按下，请输入大写字母，否则输入小写字母。这就是我们要告诉程序的逻辑。在默认情况下，上面的程序将输入大写字母，因此我们必须定义小写字母的状态。\n\
    \n诚然，上图所示的键盘记录器程序进行了微调，但尽管如此，不要担心，因为我们将分析整个程序。我们提到过，我们制作的第一个键盘记录器是原始的，我们正在逐渐进入更复杂的类型。\n\
    \n我们更改的内容之一是存储按键记录的变量。我们将它的名称从 `c` 改为 `key`。为要放入变量的信息提供合适的名称是一个良好的习惯，因为它有助于非常容易地定位任何信息；或者如果你正与其他代码编写人员合作，他们也能非常轻松地找到他们所需的任何函数。\n\
    \n在第 23 行，我们引入了 `sleep` 函数，尽管它目前被注释掉了，但稍后会用到。`sleep` 函数有助于防止 CPU 因重复运行而导致满载（导致其变慢）。然而，`sleep`\
    \ 函数并不是防止 CPU 满载的最佳解决方案，但目前我们将使用它来避免陷入任何复杂的问题。\n\n虽然 `Sleep()` 函数会让程序暂停括号内指定的任意毫秒数（例如\
    \ `sleep(1)`、`sleep(2)`、`sleep(5)` 等），但括号内为 0 的 `sleep()` 函数（即 `sleep(0)`）则具有不同的作用。它告诉程序，当另一个程序想要使用\
    \ CPU 时，停止使用它。\n\n让我们继续分析从 31 行到 43 行的代码，因为它们是一个共同工作的块。\n\n![](img/00056.jpeg)\n\
