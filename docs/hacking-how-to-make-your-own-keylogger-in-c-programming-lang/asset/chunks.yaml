    # Programming Basics (Crash course on C++)


    True, we are concerned with making a Keylogger and you must be wondering why we
    are still beating around the bush. Thing is, it is really necessary that we equip
    ourselves with basic knowledge of the environments we will work in and the tools
    we will use.


    C++ is the programming language we have decided to use and so we will go through
    basic areas of this language which will give us a sense of direction of where
    we are headed (making a Keylogger.) later on, as we progress we will learn more
    and more and more of this language.


    ## Terms


    **Variable**. A variable is a location in memory where a value can be stored for
    use by a program. An analogy is the post office boxes where each box has an address
    (post office box number). When the box is opened, the content will be retrieved.
    Similarly, each memory location has an address and when that is invoked, the content
    can be retrieved.


    **Identifier**. An identifier is a sequence of characters taken from the C++ character
    set. Each variable needs an identifier that distinguishes it from another. For
    instance, given a variable `a`, ‘a’ is the identifier and the value is the content.
    An identifier can consist of alphabets, digits and / or underscores.


    * It must not start with a digit

    * C++ is case sensitive; that is upper case and lower case letters are considered
    different from each other. For example `boy != BOY` (where `!=` means not equal
    to)

    * It must not be a reserved word


    **Reserved words**. A reserved word or keyword is a word that has special meaning
    to the C++ compiler. Some C++ keywords are: `double`, `asm`, `break`, `operator`,
    `static`, `void`, etc.


    To declare a variable, it must be first given a name and type of data to hold.
    For example: `Int a;` where ‘a’ is an identifier and is of type integer.


    There are several C++ data types and each of these data types have their functions.
    Listed below are the various data types:


    * `Int`: These are small whole numbers e.g.

    * `Long int`: Large whole numbers

    * `Float`: small real numbers

    * `Double`: Theses are numbers with decimal points, e.g. 20.3, 0.45

    * `Long double`: Very large real numbers

    * `Char`: A single character

    * `Bool`: Boolean value. It can take one of two values: `true` or `false`


    ## Understanding Code Statements


    When we first launched Eclipse and were welcomed with a greeting note, we saw
    a default program shortly after which if we ran using the steps we learnt earlier
    would have displayed “Hello World.” Let us go through the functions of those codes
    that were written in green, purple and red in that default program and how they
    operate.![](images/00015.jpeg)


    * `#include`: The statement `#include` is a call for statements from a library
    to be included in the program being written. A library can be said a room which
    houses a lot of pre-written codes that we can utilize at any time. It saves us
    the stress of having to write every single thing we might need while coding.

    * `<iostream>`: This is a library file which contains some certain functions which
    will enable us utilize some certain commands. Some of these commands include:
    `Cout` and `Cin`.

    * `Cout`: This is a command that displays the outcome of written codes to the
    computer user. For example, if you write codes for a program that will ask a user
    questions, the `Cout` statement is what will make the questions visible to the
    user.

    * `Cin`: This statement is a command which is used to receive input from a user.
    For instance if you write a program that collects the biometrics of different
    people, the `Cin` command is what will enable your program take in the information
    the computer user will key in.


    A good example explaining both the `Cin` and `Cout` statement is a calculator.
    `Cin` allows the calculator to take in your inputs and `Cout` lets it display
    an answer to you.


    * `//`: The double slash is a comment line. This means that the particular line
    it precedes will not be taking into consideration. It is used by the code writer
    to explain what a particular line of code does either for his remembrance or for
    other programmers that might work with his code. We also have a multi-line comment.
    A multi-line comment has a single slash and an asterisk sign together (`/*`).
    It functions just like a single line comment except that the statement being written
    can exceed a single line.


    ### Examples of:


    A single line comment: `//Life is not a bed of roses.`


    Multi-line comment: `/*Roses are red violets are blue, most poems rhyme but this
    one doesn’t.*/`


    # A Typical Program


    The diagram below shows a simple program which is designed to ask the computer
    user to input two separate values which it prints out. Let’s go through the lines
    of this code step-by-step understanding what each means.


    ![](images/00016.jpeg)


    Line 1: This line contains `#include <iostream>`. It is what begins this program.
    The `#include` statement calls the `Cin` and `Cout` commands out of the library
    `<iostream>`. Without this line, the program will neither take in nor display
    any input.


    Line 2: “Using namespace” is a command, and `std` which stands for ‘standard’
    is a library. When you write `Using namespace std` you are bringing everything
    from that library into your class, but it is not quite like using the `#include`
    command. Namespace in C++ is a way to put word in a scope.


    Line 4: On this line, the `main()` is a function and `int` specifies the type
    of values that the function will be dealing with (integers). A function in C++
    is a group of statements that together forms a task. This is the first function
    in C++ and it must always be written.


    Lines 5 & 14: The curly braces on 5 and 14 indicate the start and end of a compound
    statement.


    Line 6: Here, two variables are allocated, `a` and `b`. As stated earlier, a variable
    is a location assigned to the RAM used to store data. Therefore, two memory allocations
    are made to store integers. `a` was assigned a value of 10 and `b` a value 20.
    This process is called initialization, i.e. setting an initial value so even without
    input by a user there is a starting value.


    Line 7: On this line initialization was made. The variable of type double was
    initialized just as the variable of type integer was.


    Line 9: On this line the print out statement `Cout` is utilized. It prints the
    statement “Enter the values for a and b” though without the quotation marks. Only
    statements within the quotation marks get printed. Note that the `a` and `b` written
    in the statement “Enter the values for a and b” will not display the value contained
    in the variable `a` it will only display it as the letter of an alphabet because
    it lies within the quotation marks. At the end of this line, we have a reserved
    word `endl`. The `endL` word causes every statement that comes after it to begin
    on a new line.


    Line 10: This line contains the `Cin >>` statement. The `Cin` statement prompts
    the user to input a value for both a and b. Without the computer user making such
    input, the program will not progress.


    Line 11: When observed, in the statement `Cout << “ Value of a: ”` it can be seen
    that after the column (ushering in the expected input of the user) there is a
    space before the quotation mark which ends the statement. These spaces will make
    the output look as shown below when the program is set to run.


    Value of a: 50


    However, without this space, the output will take this form:


