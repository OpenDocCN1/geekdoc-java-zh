- fmt: "\nJust as important as the upper and lower case letters are to the English\
    \ language, they are important too to general programming especially when it comes\
    \ to utilizing them for the purpose of the Keylogger. We have to learn how to\
    \ differentiate between the two letter cases. We will also be doing a little bit\
    \ of filtering with the `tab`, `caps lock`, `shift`, `alt`, `arrow` and mouse\
    \ keys too.\n\n![](images/00055.jpeg)\n\nWell, we can differentiate between the\
    \ upper and lower case letters by using the state of the `shift` key; we can also\
    \ use the state of the `arrow` key too. So if either of these two keys is pressed\
    \ then please write capital letters otherwise write lower case letters. This is\
    \ what we want to tell our program. By default, the program above will write in\
    \ capital letters so we have to define the state for lower case letters.\n\nIt’s\
    \ true that slight changes has been made to the program for our Keylogger shown\
