    解压并安装 Eclipse 文件后，尝试运行它将显示一条错误信息，说明 Eclipse 在缺少 Java 运行环境（`JRE`）或 Java 开发工具包（`JDK`）的情况下无法运行这完全没有问题，我们只需要回到互联网下载一个
    `JDK` 即可。最新版本的 `JDK` 通常带有 `JRE`。


    我们只需在 Google 上搜索“Java development kit”，并点击进入 Oracle 网站的链接，在那里进行所需的下载。


    ![](img/00003.jpeg)


    在该网站上，我们获得了适用于许多操作系统和不同位系统的 `JDK` 程序，从适用于 Linux 系统的 `JDK` 到适用于 Mac OS Solaris
    的 `JDK` 等。然而，正如我们所知，我们感兴趣的是 Windows 系统的 `JDK`。因此我们直接下载，并确保它符合我们的系统位数（32 位或 64
    位）。


    ![](img/00004.jpeg)


    在开始下载之前，我们需要勾选提供的复选框接受 Oracle 二进制代码许可协议。我们完成这一步并继续下载和安装 `JDK`。


    现在，与我们下载的大多数程序不同，我们必须设置环境变量路径。我们对 `JDK` 这样做是因为它不像大多数其他程序那样自动设置路径。未设置变量路径的影响是：每当我们想要运行此类文件（未设置变量路径时）时，我们必须指定执行文件的完整路径，例如：


    `C:\Program Files\Java\jdk1.7.0\bin\javac”Myclass.java`。这可能非常麻烦，而且还会导致许多错误。


    例如，Eclipse 运行需要 `JDK`，但如果没有设置 `JDK` 路径，Eclipse 将无法找到它，除非手动输入路径，否则将无法运行。设置路径简单意味着设置一个地址，使程序的位置变得可行。


    ### 设置 JDK 路径


    1.  导航到文件资源管理器（快捷键：`windows + E`），右键点击“此电脑”或“我的电脑”，在显示的下拉菜单中点击“属性”。![](img/00005.jpeg)

    2.  点击“高级设置”，然后从弹出的菜单中点击“环境变量”，然后向下导航到系统变量并随机选择一个。![](img/00006.jpeg)

    3.  在键盘上按“P”键，你将被重定向到“路径”。现在让我们来编辑它。默认路径开头如下：`%systemRoot%`……如下图中更完整的格式所示。（地址仅在记事本中显示以便放大，你不需要将路径也放在记事本中。）我们要在默认路径中添加内容。![](img/00007.jpeg)

    4.  向已有的地址添加 `C:\mingw\binbin;`，使其看起来就像图中所示。避免对路径进行任何其他更改，否则在尝试运行 Eclipse 时会遇到错误信息。(images/00008.jpeg)

    5.  根据提示多次点击“确定”，最后点击“应用”，JDK 路径即设置完成。


    诚然，我们已经完成了几次下载，现在应该直接进入正题：制作我们的键盘记录器。但等一下，我们不是漏掉了什么吗？当然，我们忘记了！


