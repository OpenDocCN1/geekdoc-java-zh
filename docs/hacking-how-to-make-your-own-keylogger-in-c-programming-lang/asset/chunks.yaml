  raw: 'Just as important as the upper and lower case letters are to the English language,
    they are important too to general programming especially when it comes to utilizing
    them for the purpose of the Keylogger. We have to learn how to differentiate between
    the two letter cases. We will also be doing a little bit of filtering with the
    tab, caps lock, shift, alt, arrow and mouse keys too.


    ![](images/00055.jpeg)


    Well, we can differentiate between the upper and lower case letters by using the
    state of the shift key; we can also use the state of the arrow key too. So if
    either of these two keys is pressed then please write capital letters otherwise
    write lower case letters. This is what we want to tell our program. By default,
    the program above will write in capital letters so we have to define the state
    for lower case letters.


    It’s true that slight changes has been made to the program for our Keylogger shown
    in the figure above, nevertheless do not gather butterflies in your stomach as
    we will analyze the whole program. We made mention that the first Keylogger we
    made was a primitive one, gradually we are going into the more sophisticated ones.


    One of the things we have changed is the variable in which our keystrokes are
    placed. We changed its name from c to key. Giving names that fit the information
    to be placed in variables is good practice as it helps in the location of any
    information very easily or should in case you are working with a team of other
    code writers, they will be able to locate whatever function they seek very easily.


    On line 23, we have incorporated the sleep function though it has be commented
    out for the time being it will be used later on. The sleep function helps prevent
    the CPU from maxing (causing it to slow down) out as a result of running repetitively.
    However the sleep function is not the best solution for preventing the CPU from
    maxing out but for now we will use it to avoid getting into any complex matters.


    While the Sleep() function will pause the program for any number of milliseconds
    put within the parenthesis (e.g. sleep(1), sleep(2), sleep(5)… etc.), the sleep()
    function with zero within its parenthesis (i.e. sleep(0)) does something different.
    It tells the program to stop using the CPU whenever another program wants to use
    it.


    Let us go ahead and analyze the code from Line 31 down to 43 as it is a block,
    which works together.


    ![](images/00056.jpeg)


    *Note that Key += 32 is equivalent to Key = Key + 32.


    The block of codes displayed in figure above is one created for the purpose of
    distinguishing between the upper and lower case letters. 


    Line 30 contains an if statement which basically say: if the value of key is greater
    than 64 (all values from ASCII code) but lesser than 91 and the shift key is not
    pressed (written as !(GetAsyncKey (0x10)) ) -where 0x10 is the hexadecimal notation
    for the Shift key- please add 32 to the previous key values. It is worthy of note
    that the range 64 to 91 within the if conditional statements was not just chosen
    at random but on intent owing to the fact that letters of the alphabet fall between
    this range on the ASCII table.


    From the cutout of the ASCII code displayed in the figure below, doing some little
    math, we will see why we chose the number 32 to be added to the values in key
    within our conditional if statement on Line 31\.


    ![](images/00057.jpeg)


    Our if conditional statement on Line 31 stated: if key is greater than 64… this
    means during evaluation, Key will be read from the number 65. Now take a look
    at the number 65 on the ASCII table under the character column. 65 represents
    the upper case letter A.


    Now, if 32 is added to 65 the result is 97. Take a look at the char column of
    number 97 on the ASCII table, does the number 97 represent the lower case letter
    a? Yes it does!


    Remember that by default our Keylogger program will use upper case letters and
    like the codes within Line 31 and 33 states, if the shift key is not pressed (to
    make the letter uppercase) then  the value 32 (which will convert the letter to
    its lowercase as defined by the ASCII table) should be added. Now we know why
    32 is the number chosen to be added.


    You can go ahead and pick a number from the ASCII table, which represents any
    uppercase letter, add 32 to that number and see if it leads you to the lowercase
    of the very same letter.


    While the statement on Line 34 closes the file: that on Line 35 is utilized for
    just the test run so we don’t check for anything else. We might remove it later,
    but let’s just see how it works in our program for the main time.


    ![](images/00058.jpeg)


    Analyzed together, Line 31 to 42 says: if the range of values in the program falls
    within that which contains letters of the alphabet in ASCII code and the shift
    key is not pressed (for capitalization) add the number 32 to the previous values
    to convert to lowercase and this lower case be written to file unless however,
    the shift key is not pressed then the input should be sent to file in uppercase.


    The figure below shows the output of the program during a test-run session:


    ![](images/00059.jpeg)


    Here command prompt was used (the Keylogger can be tested anywhere as long as
    inputs are made) to test the program and like you see, it did work.


    Note also that the program we just analyzed was one for differentiating between
    the upper and lowercase letters. During the test above, spaces were not given
    between each of the words we wrote, this is because we used a multi-line comment
    to shutout the aspect of our code that contains the required cases to handle spacing
    and similar function and so if we used spacing the form of the input would be
    in some sort of disarray. Our basic intention here was to treat uppercase and
    lowercase letters.


    Furthermore, this is just one way to implement the differentiation between the
    uppercase and lower case letters there are several ways to do this. Some of them
    are probably better than this one, feel free to experiment for it will help further
    your knowledge.


    ### Filtering Characters:


    Here, we are going to see how we can filter out all types of characters. This
    is important as in in most cases, people tend to type in certain characters such
    as: asterisk signs, exclamation mark, symbol for a British pound etc. as passwords
    and these symbols in most cases are obtained by the combination of two or more
    keys. Filtering will enable our Keylogger recognize when such keys are pressed
    by a user.


    We need to deal with these things however, the big question is HOW? Well think
