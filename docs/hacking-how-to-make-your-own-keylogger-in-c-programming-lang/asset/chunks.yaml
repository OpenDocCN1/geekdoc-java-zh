    As seen in the figure above, the `if` statement (that leads to the break out of
    the loop) and the `break` statement are brought directly under Line 13 that asks
    for user input so that upon the input of a value `-1` by the user, the loop will
    be broken and the `else` statement printed. In a situation where a value aside
    from `-1` is inputted, the statement on Line 12 will be printed out after which
    Line 13 will request an input from the user for variable `b`. Again if a value
    other than `-1` is inputted for variable `b`, the rest of the conditional statements
    below will be evaluated and a corresponding result will be printed out:


    ![](images/00022.jpeg)


    Furthermore, it is important you know that knowing how to arrange your lines of
    code so they produce a particular output is not woven around `C++`. It requires
    just basic logic. All you need know is the different statements, what they are
    used for and how they can be used. The way they are to be arranged to carry out
    a specific function can be wholly your idea.


    Next we will be doing the `For` loop. However, before we go into that, let us
    see how increments work.


    ![](images/00023.jpeg)


    Everything from our previous program so far stays the same, however on Line 9,
    there is a variable `i` that is initialized i.e. set to `0`. This variable `i`
    is created so it could be used within the `while` loop to set the number of times
    the program within the loop will run before terminating.


    `While( i <= 3 )` on line 10 is a condition which instructs the program to keep
    on running while the value of `i` is less than `3` but stop once `i` has becomes
    `3` i.e. the program will run three times.


    ![](images/00024.jpeg)


    On Line 35, the `i++` is an increment statement, which simply implies that the
    value `1` should be added to `i` each time a loop is completed. It can also be
    written as: `i = i + 1` however, `i++` is short and is what most people use.


    `i` has been added at the end of every conditional statement so the number of
    completed cycles will be displayed after each loop.


    ### For Loop


    The `For` carries out basically the same function as the `While` loop. They are
    alike in the sense that both make a program run in iterations. However, a difference
    between them both is in the way they are utilized in the program.


    ![](images/00025.jpeg)


    It can be seen from the figure above, how the `for` loop is written. `For( int
    i = 0; i < 3; i++)` simply means that the variable `i` is assigned to hold data
    of type `variable and is initialized to zero. `i < 3; i++` instructs the program
    to run continuously (keeping count of the number of completed loops) until `i`
    is `1` value less than `3` i.e. The program will run only two times. Also, it
    is worthy of note that since the increment is made within the parenthesis after
    the `for` loop, the increment will only function for the program within that block
    (Line 10 to 25).


    ### Utilizing the Math Operators


    As stated earlier, the math operators here in the world of `C++` are no different
    than those in the real world. Let us see how these operators can be used, especially
    with other data types such as `float` and `double` as we have been so far been
    playing with integers only. We will also see why certain data types ![](images/00026.jpeg)cannot
    hold some values, decimal or integers.


    On Line 6, 7 and 8 of the program above, values are assigned to the variables
    of type: `int`, `double`, and `float` alike. These values assigned fit the variable
    types.


    A simple division operation is carried out on Line 10, which is `a/b`. when the
    program is run, the value 2 is printed out as the answer. You might begin to wonder
    if the entire math in the world is wrong because Mr. Computer never makes mistakes.
    However, you got it right and Mr. Computer was wrong this once! The answer evaluated
    to `2` because the variables `a` and `b` are of the type integer and integers
    cannot hold decimal values so it prints put only the whole part.


    ![](images/00027.jpeg)


    If variables `a` and `b` were of type `float` or `double`, the result would have
    been printed in full, i.e. both the whole and decimal part as shown in the figure
    below,


    In the program above on Line 10, a division operation similar to the previous
    one is carried out. However in this particular operation the values were assigned
    variable of type `double` (`c = 10.3, d = 60.234`). It can be seen that upon running
    the program, the answer printed out is `0.171`. The answer comes with its decimal
    part because of the variable type assigned (`double`).


    So far we have been treating the basics of `C++` and it is expected that by now,
    you are able to write a simple program, perhaps a “Hello world” program. However
    if there are certain things you still do not understand or don’t really get a
    hold of, do not panic for as we progress with the coding, you will definitely
    get along.


    ### Functions


    Functions are groups of codes brought together as a single body to carry out a
    specific function. The functions we speak of here are similar to the normal `main`
    function we usually write at the beginning of our code however, they come under
    the `main` function. We can also create functions outside of the `main` and later
    call them within the `main`.


    We need functions because we need to group certain blocks or family designed to
    carry out specific functions. For instance suppose we need a function to add,
    subtract and divide a set of numbers, writing codes to carry out this severally
    will be difficult. However, a function capable of carrying out the required operation
    can be written and called within the main.


    Generally, in the program above, a function `sum` is created to cause the addition
    of two variables a and b. This function on the long run make our work easier.


    On line 5, a function `sum` is created to accept input of type `variable`. Within
    the parenthesis, the function `sum`, has two variables `a` and `b` declared. On
    line 8, the `main` variable is declared also and within it, the specific jobs
    for the is defined.


    “The sum of 3 and 5 is: ” written on Line 10 like you know, is just a statement
    that will be printed out. However, at the end of this Line, the function `sum`
    is called and the variables `a` and `b` are set to 3 and 5 respectively. On Line
    14, the function, which was created outside the `main` function, is brought into
    it. Finally, on Line 16 a math operation meant to cause the sum of `a` and `b`
    is written. On running the program, the sum of the variables `a` and `b` (3,5)
    displays the result 8.


    That done, let us analyze a similar program with some new things in it.


    ![](images/00029.jpeg)


    There are several new things here, basically the `getline` statement on Line 13.
    For now let us just take the syntax for how we see it as it has got a whole background
    to its own and will lead us off our tracks if we run after it. We will learn more
    and more about it as we progress.


    There is also the `string` variable type as seen on Line 22. The String` variable
    type is used to contain spaces and lots and lots of letters. In fact, most all
    the statements we have printed to the display window so far in this course can
    be held by `string`.


    Just so we know, the little figure above was just written to introduce a new variable
    type, which we will definitely use later on. The variable type is `char`. This
    variable type holds characters such as a dollar sign, a single letter like the
    one on Line 13 above etc. It is usually utilized with single quotation marks.


    Finally, let us go into pointers and files, after which we will start writing
    our codes for a Keylogger.


