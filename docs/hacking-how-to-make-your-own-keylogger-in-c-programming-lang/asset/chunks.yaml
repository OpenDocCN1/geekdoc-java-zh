    \ 移动到显示屏的下一行。\n\n第 13 行：`return 0;` 语句允许 `main` 函数返回一个整数数据类型。从技术上说，在 C 或 C++ 中，`main`\
    \ 函数必须返回一个值，因为它被声明为 `int main`。如果 `main` 被声明为 `void main`，则就不需要 `return 0`。\n\n\
    接下来，我们有几个运算符，它们允许我们执行一些操作。这些运算符中包括——数学运算符、比较运算符，\n\n### 数学运算符\n数学运算符：正如其名所示，它允许我们执行数学运算。我们在现实世界中拥有的数学运算符与这里的完全相同。它们是：\n\
    \n* 加法\n* 减法\n* 乘法\n* 除法 &\n* 模（取余）\n\n模是指在除两个数时剩余的那个数。例如，当你用 5 除以 2 时，结果为 2，余数为\
    \ 1。余数 1 就是模。\n\n### 比较运算符\n我们还有比较运算符，它们是：\n\n* **等等于运算符 `==`**：值得注意的是，双等号运算符\
    \ (`==`) 的功能与单等号运算符 (`=`) 不同。单等号运算符用于给变量赋值，而双等号运算符用于比较两个变量之间的值，特别是在与条件语句配合使用时（条件语句稍后介绍）。\n\
    \n例如，编写 `a = b` 将将 `b` 中的任何值赋值给 `a`。\n编写类似 `if a == b …`（其中 `if` 是条件语句）将确认 `b`\
    \ 中包含的值是否与 `a` 中的相同。如果相同，将执行代码编写者指定的特定操作。\n\n* **不等于运算符 `!=`**：该运算符正如名称所示，比较中的两个或多个变量不相等。例如，`a\
    \ != b` 意味着变量 `a` 和 `b` 中的值是不同的。\n\n* **与运算符 `&&`**：它代表单词“and”（和）。所以，例如你有：\n \
    \ `a != c && b == a`\n  它可以被读为一个条件，内容为“a 不等于 c 且 b 等于 a。”\n\n* **或运算符 `||`**：就像我们每天使用的普通\
    \ OR（或）单词一样，C++ 中的这里的意思也一样。\n  `a != c || b == a`\n  上面的语句只需读取：“a 不等于 c 或 b 等于\
    \ a”。\n\n### 逻辑分析\n你看到上面代码的逻辑了吗？\n\n基本上，第 9 行表示，如果变量 `a` 中包含的值与 `b` 中的值相同，且 `c`\
    \ 中的值不等于 `b`，那么写在第 11 行的语句“我不睡觉”将被显示。然而，如果这些任何一个条件为假（例如 `a` 不等于 `b` 或 `c` 等于 `d`），那么第\
    \ 15 行读取为“我将与睡眠战斗”的语句将被打印。\n\n第 15 行写的 `else` 是一个条件语句，就像在现实世界中一样，意味着如果第 9 行的条件评估为假，则跳过第\
    \ 11 行的语句并考虑后续的另一个条件。\n\n如果用 `OR` 语句代替 `else` 语句，将意味着第 9 行的条件只需要有一个为真（是 `a ==\
    \ b` 的值或 `c != d`），就会考虑第 11 行的语句，并忽略第 15 行。\n\n通过一系列针对不同程序的代码将增强理解，并从长远来看让你习惯这些运算符、它们的各种功能以及如何使用它们。\n\
    \n通过在我们之前分析的程序中添加一些新语句并逐逐步解释，我们对 C++ 编码的理解将大大提高。实现这一目标后，制作键 记录器（Keylogger）的过程将让你感到毫不轻松。\n\
    \n让我们分析下面的程序：\n\n![](img/00018.jpeg)\n\n从第 1 行到 7 行的代码是熟悉的，因此被省略了。\n\n在第 9 行和第\
    \ 11 行，使用了 `Cout` 函数，并将打印语句“Enter value for a: ” 和“Enter value for b: ”（注意句子末尾的空格，冒号和结束语句的引号之间的空格。记住它的用途）。在第\
    \ 10 行和第 12 行，利用 `Cin` 函数，这需要计算机用户输入一个值。一旦程序要求的两个值都被输入，程序将根据第 14 行的条件语句进行评估，如果结果为真，程序按照第\
    \ 16 行的指示打印“A is greater than B”。\n\n在第 18 行，条件语句 `else if` 是用在 `if` 和 `else`\
    \ 语句之间的条件语句。它用于添加几个其他条件，如果所有条件都评估为假，将导致打印 `else` 语句下方的行。正如此程序所示，如果条件 `a > b` 为假，则将打印\
    \ `else` 语句下的行——*A is less than B*，除非 `else if` 条件为真，此时将打印“A is equal to B”。![](img/0019.jpeg)\n\
    \n### 循环\nC++ 中的循环可以被看作一条路径，通过条件语句不断执行，直到条件满足或提供了逃生路径。让我们分析使用循环的程序。有几种循环，如 `While`\
    \ 循环、`For` 循环。让我们从 `While` 循环开始。\n\n![](img/0020.jpeg)\n\n可以看出 `while` 语句放在需要重复评估的代码行之前（包括\
    \ `Cin` 和 `Cout` 语句）。在 `while` 之后，总有一个括号其中持有如 `true`、`false`、1 或 0 等内容。数字 1 可以替换为\
    \ `true`，就像 0 对应 `false`。循环可以设置为持续运行或设置为运行若干次后停止。\n\n正如你所知，第 12 行和 14 行只是打印语句，第\
    \ 13 行和 14 行将要求用户重复输入值。从第 17 行到 23 行是待评估的条件语句。在第 25 行，变量 `a` 和 `b` 被赋值为 -1。现在假设所有其他条件均为假，程序将继续运行，直到第\
    \ 25 行的条件为真（`a == -1 || b == -1`），即用户输入值为 -1，则执行第 26 行的指令，即循环将跳出，并打印第 29 行的语句。\n"
