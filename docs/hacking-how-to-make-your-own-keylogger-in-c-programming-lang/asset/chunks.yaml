    The else written on Line 15 is a conditional statement, which just like it does
    in the real world means that if the condition on Line 9 evaluates to false then
    the statement on Line 11 be skipped and another condition down the line be considered.


    If the OR statement was used in place of the else statement, it will imply that
    only one of the conditions on Line 9 will have to be true (either the value in
    a == b or c != d) for the statement on Line 11 to be considered and that on Line
    15 to be ignored.


    Going through series and series of codes for different programs will enhance understanding
    and on the long run get you used to the operators, their various functions and
    how they can be used.


    By adding some new statements to our previously analyzed program and explaining
    them step by step our understanding of coding in C++ will improve greatly. When
    this is achieved, walking through the process of making a Keylogger will cause
    you no sweat.


    Let us analyze the following programs below:    


    ![](images/00018.jpeg)


    The code from Line 1 to 7 is familiar codes and hence, they have been omitted.


    In Line 9 and 11, the Cout function is used and the statement “Enter value for
    a: ” and “Enter value for b: ” will be printed out (note the space at the end
    of both sentences, between colon and the quotation mark that ends the statements.
    Remember its purpose). On Line 10 and 12, the Cin functions which will require
    the computer user to input a value, is utilized. Once both values requested of
    the user by the program are entered, the program does evaluation based on the
    conditional statements on Line 14 and if the result is true, the program prints
    as directed by Line16 “A is greater than B”.


    On Line 18, the conditional statement else if is a type of conditional statement
    used in between the if and else statements. It is used to add several other conditions
    which if all evaluated to false, will result to the printing of line under the
    else statement. As utilized in this program, if the condition a > b is false,
    the line under the else statement –A is less than B- will be printed except the
    else if condition is true then “A is equal to B” will be printed.![](images/00019.jpeg)


    As observed from the codes written above, the user inputted the value 1 for the
    variable a and 3 for the variable b. These values do not meet the condition on
    Line 14, neither do they meet that on Line 18 and so the else statement is considered.
    The statement on Line 24 “A is less than B is printed.”


    ## Loops


    A loop in C++ can be said to be a circular path through which conditional statements
    being evaluated continue on in circles never to stop until the required condition
    is met or an escape route is provided. Let us analyze a program which loops are
    used. There are several loops such as the While loop, the For loop, the             
    .Let us begin with the While loop.


    ![](images/00020.jpeg)


    It can be seen that the while statement is placed just before the lines of code
    in which repetitive evaluation is required, the user input inclusive (Cin and
    Cout statements). After the while, there is always a parenthesis which holds things
    such as true, false, 1 or 0. The number 1 can be replaced with true like 0 with
    false. The loop can be set to run continuously without stopping or set to a number
    of times to run before stopping.


    Like you know, Line 12 and 14 are just statements that will be printed out and
    Line 13 and 14 will ask the user to input values repetitively (Loop) . From Line
    17 down to 23 lies the conditional statement to be evaluated. On Line 25 both
    variable a and b are assigned a value -1\. Now supposing all other conditions
    evaluate to false the program will continue to run until the condition on Line
    25 evaluates to true (a == -1 || b == -1) i.e. the user inputs a value of -1 then
    the instruction on Line 26 will be carried out i.e. the loop will break and the
    statement on Line 29 will be printed.


    However, the way we went about our conditional statement for the loop to be terminated
    is not so efficient. This is so because if the user inputs a value of -1 for a
    as Line 13 requires, the loop will not break but the user will be asked again
    for an input for the variable b. Only when both a and b are assigned a value of
    -1 will the loop be broken.


    Let us look at a more efficient way of utilizing our conditional statements and
    break statement so that when the user inputs a -1 value for either of both variables,
    the loop will terminate.


