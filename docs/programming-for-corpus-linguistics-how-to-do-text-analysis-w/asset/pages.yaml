    Furthermore, Java is machine independent, which means that you can run programs
    on any platform. This is especially important when working with different machines
    at home and at work; a less powerful computer might not be as fast or might not
    be capable of processing large amounts of data, but at least you won''t have to
    change your programs. This is due to the hybrid nature of Java, which is halfway
