- pgno: 42
  md: '# HOW TO STORE TEXTUAL DATA


    ![](img/c394310805c2e60720e6e9e923804321_42_0.png)


    to mark up attributes). Grouping corpus data in a sensible way, however, can greatly
    speed up the analysis, as you don''t have to trawl all your material to find relevant
    parts for comparisons; instead you can select a block of data grouped according
    to the attribute you are looking for.


    There has some work on developing guidelines for structuring corpus material,
    and the results of the EU project EAGLES are available on the Internet. The address
    of the site can be found in the appendix.


    # 3.2.2 File Formats


    After deciding on a logical structure, you need to think about the physical structure,
    i.e. how to store the data on your computer. One straightforward way is to mirror
    the hierarchical structure in the directory tree on your hard disk. This way the
    attributes of a work would be reflected by its position on the disk, but processing
    might be more difficult as you will have to gather text files from a set of separate
    directories. It also means rearranging the data more complicated.


    Another possibility is to have a separate file for each text, and keep a list
    of text''s attributes (such as author, title and source) elsewhere. When you need
    to pick some of your corpus, you can consult the list of attributes and select
    those files which contains the texts you are interested in. This is easier for
    processing, but it might be inefficient if you have too many files in a single
    directory. Some operating systems might also put an upper limit on the number
    of files you can have in a single directory.


    In principle the choice between storing texts in individual files on your computer,
    orにつき them together in one or more large files is largely a matter of convenience.
    If all the data is in one big file, processing is as easy, as there is only one
    file you have to work with, as opposed to a large number of smaller files. When
    your corpus has grown in size, a large file becomes unwieldy and if it does not
    fit onto a single floppy or ZIP disk it might be difficult to copy it back up.
    You might also have to think about marking document boundaries in a big file,
    whereas individual little files could comprise self-contained documents with all
    related necessary meta information.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 36 BASIC CORPUS CONCEPTS


    Once you get to storing the material in the right place on your computer, the
    next question is what format to choose. In principle there are three kinds of
    formats to choose from, all with their special advantages and disadvantages:


    +   1. plain ASCII text

    2. marked-up ASCII text (SGML/XML/...)

    3. word processing text (Word/RTF/...)


    Plain ASCII text is the most restricted format. You all store it in the words
    and some simple layout information as line breaks. You cannot represent non-ASCII
    characters, like accented letters and umlauts, which severely restricts when it
    comes to working with occasional frequent words or even non-English corpora. In
    order to overcome this problem, a whole host of different conventions has evolved,
    each of which requires a special program to work with. If you had a concordance
    program suitable for corpus X, changes could not use it on corpus Y, or at least
    would not be able to exploit the information stored in that corpus.


    After years of developing idiosyncratic schemes, a standard format has been established:
    SGML, or its simplified version, XML. These are formal descriptions of how to
    encode a text, and how to represent otherwise could not be added straightforwardly
    into the text. As this standard is increasingly used for marking up corpus data,
    a lot of software has been developed to work with it. More details of mark-up
    will be discussed in the next section.


    Another popular choice for corpus formats seems to be word processing files. There
    are three main reasons for this:


    +   1. many people have a word processor available

    2. plenty of existing files are already in this format

    3. you can highlight important words or change their font


    Unless it represents data, a corpus is basically a collection of text documents.
    Thus it seems natural to use a word processor to store them, which allows you
    to use highlighting and changes to mark certain bits of text. You can format ergative
    verbs in a bold font, then search for bold text during the analysis, and with
    built-in mark languages you might be able to write a basic concordance program.
    What''s wrong with that? The problem is that you would be limiting yourself to
    just a single product on a single platform, supported by a single vendor. What
    if the next version of the word processor changes some formatting codes? Suddenly
    all your laboriously inserted codes for marking up ergative verbs could have disappeared
    from the view.


    Even though it seems a big improvement to be able to mark words by choosing a
    different typeface over not able to do it all with a plain ASCII text, it severely
    limits the way in which you can process the file later. By choosing a word processor
    format you can then only analyze your text within this word processor, as the
    file format will almost certainly not be readable by any other software. A word
    processor is not designed to be used for corpus analysis, you cannot do much more
    than just search for words.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# MARK-UP AND ANNOTATIONS


    Furthermore, what happens if the word processor is discontinued? might be tempted
    to think that a certain product is so widespread that it will always be around,
    but think back ten years: then there was a pre-PC computer in widespread use,
    the Amstr PCW. It came with a word processing program (Locoscript), and it would
    save your data on 3 inch floppy disks (remember that the ''standard'' floppy size
    is now 3.5 inch). Suppose you had your corpus gathering in those days using this
    platform. You may take a break from working on it, and now, a few years later,
    you may continue turning it into a really useful resource. The problem is that
    you swapped your PCW for a PC (or an Apple Mac) at the last round of equipment
    spendings, suppose you manage to find another one in a computing museum. Unfortunately
    it doesn''t have Locoscript on, as the disk got lost somehow. Without any supporting
    software you are unable to make use of the files, and if there might be a Locoscript
    version for PCs you still cannot do anything because PCs don'' have drives which
    can read 3 inch floppies.


    Many individual attempts of gathering corpus data have chosen this form of storing
    data, and as the question of a program for analyses arises, realise they have
    reached a dead end. Converting the data back into will certainly result in a loss
    of information, and consequently much time has been wasted during setting up.


    Technology changes so quickly that it would be foolish to tie yourself to one
    particular product. Instead you should go for an open, non-proprietary format
    that can be read by any program and that is well-documented, so that you can write
    your own software if you need to. You should also store it on a variety of media
    which are likely to be available at future dates. This of course includes the
    necessity of making backup copies to insure yourself against accidental loss of
    your data in your drive breaks downs.


    As we will see in the following section, marked-up ASCII is the best option. It
    is readable by any program on any computing platform, and if you choose the right
    kind of mark-up you will find plenty of software available to work with it.


    The main point of this section is that you should generally do what other people
    have done already, so that you can gain from their experience and share-your data
    and possibly theirs. It also makes it easier for other people to use your data
    if it is not kept in an obscure format nobody else can. Corpora have been collected
    for more than forty years, so it would be foolish to ignore the lessons learned
    by your predecessors. A particular choice might make sense in the short term,
    but the long run is best to follow the existing roads rather than out into the
    wild on your. This particularly applies to the topic of annotations, which we
    will look at next.


    # 3.3 MARK-UP AND ANNOTATIONS


    In the previous section we discussed ways of organising and storing your corpus,
    how to structure it and how to keep it on a computer physically; in this section
    we will look at how you would want to use annotations and how they can be stored.
    In chapter 8 we will then develop programs to process annotations.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 3.3.1 Why Use Annotations?


    Annotations can be used to label items of interest in a corpus. For example, if
    you are analysing anaphoric references, you cannot use a program to extract them
    automatically, as their identification is still an unsolved research problem.
    The only reliable way to find them is through the data (perhaps after it has been
    processed by an auxiliary program which identifies pronouns) and labels the references.


    Once you have added annotations to your data, you can search for them and retrieve
    instances of the features and process them. This means, of course, that the program
    you are using is capable of looking for the annotations you put in earlier. While
    it is unlikely to be ask a concordancing program to find anaphoric references,
    it is much easier to find all labels marking instances of those.


    In practice, some corpora have some kind of annotations. The degree of granularity
    varies, and more sophisticated ones (i.e. those that need to be put in manually)
    are mainly restricted to smaller corpora, larger corpora typically contain only
    annotations which can be added automatically using computer programs, e.g. part-of-speech
    tags and perhaps sentence boundaries and paragraph breaks. Any material you get
    from other sources will most likely be without any annotations.


    # 3.3.2 Different Ways to Store Annotations


    We have already seen that there are different ways to store your data files, and
    there is an even larger variety of formats in which to encode annotations. In
    this section we will briefly touch upon this subject, but we will spend too much
    time on describing obsolete formats.


    There are typically two kinds of annotations, those relating to the whole text,
    such as author, and title, and those which only apply to parts of it (usually
    words or groups of words), such as part-of-speech or anaphoric references. While
    the former are usually kept separate in a header block at the beginning of the
    text, the latter necessarily have to be included inside the text.


    # Header Information


    Usually a corpus will contain the plain text, unless it was converted from published
    sources (such as newspaper articles or typesetter''s tapes) or structured collections
    (such as databases, Galle et al. (1992)). In this case it sometimes contains extra
    information, which is attached to it at the beginning in a header describing what
    the document is, when it was published, in which edition, and so on. This kind
    of external information can easily be separate from the actual text through some
    kind of boundary marker which indicates the start of the text proper.


    Some mark-up schemes use a number of tags to indicate which attributes of a document
    are filled with what values. A newspaper article could for example be annotated
    as:


    ```

    \begin(header)

    title(Labour Party To Abolish Monday)

    date(01/04/2001)

    author(A.P. Rool)

    source(The Monday Times)

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# MARK-UP ANNOTATIONS


    ```

    \end(header)

    \begin(text)

    In an announcement yesterday the Prime Minister said that ...

    \end(text)

    ```


    Other labels could be used, or they could be enclosed in brackets, as in this
    example from McEnery and Wilson (1996):


    <A CHARLES DICKENS


    This line in the so-called COCOA format (from an early computer program) indicates
    that Charles Dickens is the author of the following text. There are many different
    ways in which such information can be stored, and each concordance will understand
    its own format only. Structuring the header information is a problem of standardisation,
    as different corpora can be annotated in different variants, using different tags,
    and without any specification of what kinds of information will be given. This
    makes it difficult for software to process different corpora, as it cannot rely
    on them being one particular format. Also, without having a defined set of properties
    which are defined, any program will have problems allowing the user to exploit
    the information which is available. The solution is to have one single format
    which is used for all corpora, as the writers of corpus processing software can
    tailor the software to that format.


    # Text-Internal Annotations


    Adding annotation for other aspects of a corpus requires that annotation be added
    within the text. If you want to analyse the part-of-speech of the individual words,
    or the reference points of anaphora, you will have to mark them up in the text
    itself, and this creates many problems. The first is to keep the annotation separable
    from the text. If at some future point you want to get back to the original, unannotated,
    text, and cannot easily out what is part of the text and what is annotation then
    you will have a problem.


    When researchers first started gathering corpora, they had to make up their own
    formats for storing them. Early computers only had uppercase letters, so special
    conventions were introduced to distinguish upper and lower case, e.g. by putting
    an asterisk character before any case letter, treating all other letters as lower
    case. This made dealing with the data rather complicated, as programs had to be
    able to handle all these conventions, but there were no real alternatives. Worse
    still, everybody used their own conventions, mainly because people wanted to encode
    different things, which meant neither software nor data could be exchanged or
    re-used.


    As there were not many people working with corpus initially there was no awareness
    that this could turn into a problem. However, with corpus linguistics becoming
    more and more mainstream it became an issue, as not everybody could start from
    scratch developing their own software and collecting their own data, and committees
    were set up to develop standards. This has gone so far that projects sometimes
    will no longer get funding if they create resources that do not follow these standards.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# BASIC CORPUS CONCEPTS


    # SGML


    The only file format which can be understood is generally plain ASCII text. ASCII
    allows no non-printable characters apart from line breaks and tabulator marks,
    and no characters with a code higher than 127. However, you can now read your
    data on virtually any machine using any software, but how do you mark up your
    ergodic occurrences? This is where mark-up languages enter the scene. A mark-up
    language allows you to store any kind of information from the text in an unambiguous
    way. You can then easily recognise it, and if you don''t need it you can simply
    remove it from the text with a computer program, without any worries that you
    might also remove parts of the text at the same time. A mark-up language reserves
    a number of characters which you can use in your data unless they are ‘escaped’,
    i.e. replaced by a character code. For example, HTML, the hypertext mark-up language,
    if you want to write a web page about your R&D unit have to write R&amp;D, where
    amp is the entity name of the ampersand character, and the ampersand and semicolon
    are used to separate it from the other text. The facto standard format is SGML,
    which actually is a language to define mark-up.


    SGML is a well established standard (ISO 8879), and as it cannot be changed easily
    because of, software developers have written few tools to work with it in the
    knowledge that it will be to there and thus the time and effort they invest will
    be worth. And you can then find a large number of programs, a of them very cheap
    or free, that will allow you to work with SGML data.


    SGML can be used to specify a set of tags and mark their relationships explicit
    in a formal grammar which describes valid combinations of tags. For example, you
    could specify that a ‘chapter’ tag can contain one or more ‘sections’, which in
    turn contain ‘paragraphs’. If you try to put a ‘chapter’ tag inside a ‘section’
    you violate the structural integrity of your data, and a piece of software called
    parser uses the angle brackets (‘<’ and ‘>’) and the ampersand (&) as special
    characters to separate your tags from the text, will tell you that there is an
    error in your mark-up. SGML though could be contained in a mark-up language definition.


    The Text Encoding Initiative (TEI) has spent a considerable amount of effort on
    providing guidelines for marking-up texts for scholarly use in the humanities.
    These encoding guidelines are available on the Internet (see section 12.2 on resources),
    and there is even a ‘TEI Lite’, a version stripped down to the bare essentials
    of marking textual data.


    The TEI guidelines provide a standard format, but that does not mean that a corpus
    will be marked up in all the detail provided by them. There is a special custom
    version of these guidelines, the Corpus Encoding Standard (CES) which defines
    different levels of annotation, to the detail expressed in the mark-up.


    For the newcomer SGML is not too easy to start working in, as there is a lot of
    terminology, a large number of acronyms, and programs which you might be reluctant
    to deal with your data, giving cryptic error messages as an excuse. The reason
    for that SGML is very powerful, but also extremely complex. As a result, software
    is slow and difficult to write, which has prevented SGML from being widely used
    for the last ten years.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# MARK-UP AND ANNOTATIONS


    However, there is a wide variety of mark-up languages that have been defined for
    all areas of academia and commerce, the best known of which is HTML. HTML is a
    mark-up language for hypertext documents, widely used on the Internet for formatting
    web pages. It follows the standard SGML conventions regarding tag format.


    # HTML


    Part of the success of HTML is that it is simple. Its limited power and resulting
    ease of use have contributed to the success of the world wide web. When you are
    downloading web pages, they will be marked-up in HTML, so you could conceivably
    use it for marking up other corpus data as well.


    HTML was developed originally for the basic presentation of scientific articles,
    with extensions to allow more general formatting of information, and it contains
    a number of tags which allow you to mark paragraphs and headings, and even crossreferences,
    but there is no <excerpt> tag. Of course you could use one of the existing tags
    for font-change and italic or bold printing, but that only gives you a limited
    range of tags, and there is no obvious link between the tag and its meaning. If
    you just add your own tags, your data is no longer HTML conformant and no browser
    would know how to handle those cases.


    For a solution to this dilemma we need to go back one step and look at what HTML
    is itself. HTML is an application of SGML. It is a definition of a (L) to mark
    up (M) hypertext (HT) documents. But a corpus is not properly marked and you might
    want to use another SGML-based format to mark it up. This other format has been
    designed to be a simplified subset of SGML, easy to use for the human user, flexible,
    powerful, and easy to process for the computer. The outcome of that design is
    XML, the extensible Mark-up Language.


    It is a lot easier to write programs that process XML than it is to do for SGML,
    but SGML conformant documents can easily be converted without compatibility issue.
    The constraints on XML are less strict, as we will see in chapter 8, when we write
    a couple of tools to work with XML data. The corpus encoding schemes that have
    been developed for SGML are now available for XML (see XCES in the appendix),
    and XML looks like it is going to be a major breakthrough in mark up.


    For all reasons it is advisable to use XML to store your data; it''s extensible,
