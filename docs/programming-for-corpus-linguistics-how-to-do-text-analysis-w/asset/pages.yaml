    # 6.2.2 Writing to a File


    Writing to a file is as simple as reading from it: the only difference is that
    you need to use a FileWriter. Also, with a FileWriter filename does not have to
    point to an existing file; a new file is created if there is none which has a
    matching name. You want to be careful, though, you can easily overwrite (and thus
    erase) an existing file once you open for it.


    The Buffered class does not have an equivalent to readLine(). This counter-intuitive
    asymmetry means we need to wrap another class around it, a PrintWriter.


    ```

