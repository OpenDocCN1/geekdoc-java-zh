    between the two. Other corpora were picked up on the same structure as well, like
    for example FLOB and Frown, the modern equivalents of Brown and LOB created at
    the University of Freiburg, and the Kolkhar corpus of Indian English. As it is
    widely used, the organisation of these corpora is shown in table 3.1 (from Taylor,
    Leech, and Fligelstone (1991)).


    +   - A press (reportage)

    - B press (editorial)

    - C press (reviews)

    - D religion

    - E skills & hobbies

    - F popular lore

    - G belles lettres, biography, essays

    - H miscellaneous

    - I learned & scientific writings

    - K general fiction

    - L mystery & detective fiction

    - M science fiction

    - N adventure & western fiction

    - P romance & love story

    - R humour


    Table 3.1: Brown/LOB structure


    If you cannot find any other corpora whose structure you can follow, you will
    have to think of one yourself. It might be useful to partition your data in a
    kind of tree structure, taking the most important attributes to decide on the
    split (see figure 3.1 ). For instance, if your corpora contains both written and
    spoken material, you might want to think the first split across that particular
    article, and within the partition you might want to distinguish further between
    books and newspapers, and adult and children''s books, or female/male authors.
    Here you could choose whatever is most convenient for your later analysis, and
    you could re-arrange the partitioning if necessary for other studies.


    Another useful criterion to structure your corpus is. If you are looking at the
    usage patterns change across time, it might be good solution to have different
    sub-corpora for different years or chronological ranges. Depending on your time
    scale you might distinguish between decades, years, months, or even days. This
    is also relatively neutral way of dividing your corpus, which doesn''t make too
    many assumptions about the data.


    In the end, the partitioning is mainly a matter of convenience, as all attributes
    should be stored within the data files, allowing you to select data according
    to any of them, provided they are marked up in a sensible way (see next section
    on how'
