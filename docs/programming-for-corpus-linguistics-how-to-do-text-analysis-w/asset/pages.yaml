    \ from the test run of our\nclass.\n\n# The Ring Buffer Approach\n\nAs mentioned\
    \ above, the way we shift the line buffer by one character every time\nwe read\
    \ a new character in is rather wasteful. With a buffer length of 75 characters\n\
    we shift 74 characters for each character read in, so for a file with 100,000\
    \ char-\\acters (approximately 25,000 words) we have 7.4 million shift operations\
    \ to do. An\nalternative approach that does not shift any characters at all is\
    \ to use a ring buffer.\nAs we said, the buffer is like a strip of paper where\
    \ the end is attached to the\beginning to form a circle (with no beginning or\
    \ end). With a linear buffer we always\nhave a fixed binding (index position 0)\
    \ and a fixed end (determined by the buffer\nlength). The idea with a ring buffer\
    \ is that you don't shift the content of the buffer,\nbut instead you move the\
    \ boundaries. So having read a character you declare\nthat the buffer starts at\
    \ position one, and not at zero, and after that position\ntwo, and so forth. The\
    \ end of the buffer is always the start position plus the length,\n it moves accordingly.\n\
    \nOnce we go past the end of the buffer we start again at position zero. This\
    \ makes\nit more complicated to turn the line into a String, but saves on all\
    \ those character\nshifts. And as long as the added complexity amounts to less\
    \ than those we will be\nmore efficient in the end.\n\nAs the source code is pretty\
    \ much the same as the linear buffer we will\nnot discuss it in full detail. The\
    \ complete listing is printed in the appendix on\npage 231. Instead, we will only\
    \ look at the methods which are different from\nthe ConcordanceReader class. We\
    \ have only one instance variable, start\nwhich is initially set to zero. We use\
    \ to keep track of the current starting position of\nthe buffer. The first change\
    \ is that the method shiftBuffer() has disappeared,\nand instead we have two new\
    \ methods, nextPointer() and prevPointer()\n are used to move through the ring\
    \ buffer. They work by changing the value\nof a variable pointing to a buffer\
    \ position by one and test for the special case that\neither end of the buffer\
    \ has been reached. If this has happened, the value is set to the\nbeginning (if\
    \ it would have gone over the end) and end (if it would have gone over the\nfirst\
    \ position) respectively:"
