  md: 'In fact, all classes are arranged in a hierarchy, which means they are all
    derived from some other class, apart from the class at the top. This class is
    Object, the most general class. All other classes are directly or indirectly derived
    from it, and if you write a new class it is implicitly extending Object unless
    you specify another class (like the PedestrianLight) from which it is derived.


    # 4.2.1 Multiple Inheritance


    In Java you can only extend one class at a time, but if you want to combine two
    or more classes for functionality? In C++, a class can have more than one ancestor
    class, but this is not allowed in Java for very good reasons. One reason is that
    it keeps the hierarchy simple: instead of having a complex network of classes
    you have a straightforward tree, where each class has exactly one path back to
    the class Object which is at the root of this tree. The other one is that it avoids
    potential clashes: if the two parents classes have methods of the same name, which
    one be chosen? If there is only one parent problem does not arise.


    But there is also a way of more or less having multiple inheritance in Java. Instead
    of inheriting a method''s implementation you can state that a class simply has
    a method of that name. This might sound a bit pointless, but is in extremely useful.
    Often a class can serve multiple functions in different contexts. The constraint
    of single inheritance would make it difficult if not impossible to realise this.
    Let''s assume for example, you have a class which models things using electricity.
    It has a property ''required voltage'', and methods switchOn(). Our Pedestrian
    would ideally extend both the ElectricItem class and the TrafficLight, as it shares
    features with both. This, however, is not possible in Java, as there can only
    be a single super-class.


    The way you do this is through so-called interface definition. An interface is
    declared just of class, and all the method bodies are empty. That means you can
    define a method''s signature, but you don''t provide the instructions with it.
    You use the keyword extend to extend a class, and the implements class to implement
    an interface. This means that you need to provide implementations for the methods
    declared in the interface. Effectively you can only inherit the implementation
    from one class, but the functionality of as many interfaces as you care to implement.
    Interfaces are useful when you have different classes that provide the same service,
    and you want to be able to exchange them for each other without having to change
    anything else. An interface can be used to isolate the functionality, and you
    can treat all the classes implementing the interface as if they had the same data
    type. You will see how this can be used later.


    # 4.3 SUMMARY


    In this chapter we have a brief introduction to object-oriented programming. We
    have learned how to model our problem using classes which represent entities in
    the domain we are dealing with, abstracting away all aspects which are not relevant'
