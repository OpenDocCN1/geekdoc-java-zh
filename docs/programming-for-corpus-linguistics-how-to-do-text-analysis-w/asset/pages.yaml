    # 3.4.2 Concordances


    Looking at a word of text might be useful for getting a first impression of what
    words are used in the text, and also the style it is written in, but it necessarily
    has to be superficial and general. It is far more useful to look at the words
    themselves, analysing the local context how they are being used. This allows you
    to analyse the meaning which is constituted by usage. The tool for that is the
    concordance.


    Concordances have been around before corpus linguistics, but only with the advent
    of an ad-hoc basis for language research. Previously concordances took years to
    produce, and were only compiled for certain works of literary or religious importance.
    However, it is now possible to create exhaustive concordances for sizeable amounts
    of text in seconds on a standard desktop computer.


    There are basically two types of concordances, KWIC and KWOC. These two acronym
    stand for keyword/in of context, and refer to the visual presentation of a list
    of words with the keyword in the centre, with as much context of either side of
    it fits in the line. KWOC, on the other hand, shows the keyword on the margin
    of the page, next to a sentence or paragraph which makes up the context.


    In 3.2 you can see an example concordance in KWIC format. This is an extract from
    a concordance of the word in this book (before this figure was added to it).


    KWIC allows quick and easy scanning of the local contexts, so that one can find
    out what phrases and expressions a word is used in, and what adjectives'
