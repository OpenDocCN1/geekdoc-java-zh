  img_proc: true
- pgno: 141
  md: '# 7.1.1 Problems with Tokenisation


    The first problem we face is that modern linguistics has not yet been able to
    solve in a satisfactory way: what is a word? there is not much hope for a solution
    to this problem coming in the near future we will have to use a working definition,
    which we will use for our programs. This definition should preferably be easy
    to implement, so it needs to be unambiguous if possible. We might have to compromise
    in that we won''t be able to find a perfect definition which we can easily implement.


    Our first attempt could be that a word is a sequence of characters separated by
    white space. Space is a collective term for all characters that create a space
    on the paper or in the text file, the space character, the tab marker, and the
    end-of-line marker. It is convenient to treat all in the same way as we will see
    later. Following this definition we can split the sentence The cat on the mat.
    into the following tokens: ‘The’, ‘cat’, ‘sat’, ‘on’, ‘the’, ‘mat’. Look closely
    at the last token, as is what most people would expect the full stop mark of the
    sentence is actually attached to the last word, mat, even though few people would
    treat that as one.


    The problem with our first definition is that we did not take into account that
    punctuation marks are usually attached to words, and not separated by spaces.
    So unlike we cannot throw them away, as they are part of the text. Spaces can
    be abstracted as word boundaries, and we don''t really care whether there was
    one space or even a new line between the tokens. However, with this punctuation
    is slightly different: we need to insert a word boundary between the word and
    the punctuation mark which did not exist before.


    The next problem with this is the ambiguity of some punctuation marks. A comma
    or a full stop is generally a separator, used in numerical expressions such as
    13,500.40 in abbreviations as Co., where the full stop could even be an abbreviation
    mark and a sentence boundary.


    The apostrophe is similarly difficult: is it one word or two? And how about Tony’s?
    And James’? Even complexity is created by the use of the apostrophe as a single
    quote mark. The sequence said ‘I''m fed with James’ and James’ car didnt start
    in the morning is reasonably easy to deal with, if you keep track of the number
    of opening and closing quote marks. However, how would you treat James said I’m
    fed with James car’? And, furthermore, some people use a reverse apostrophe (‘’)
    to start a quotation, making it virtually impossible to find a generalised solution
    works perfectly all the time.


    The reason for this is that there are different conventions of mapping a function
    (like opening quote) into a combination of punctuation marks, and there is no
    standard used by everybody who creates a text. We have therefore to resign ourselves
    to the fact that we can never achieve 100% correctness when working with plain
    text.


    Now that we have learnt something about the complexity of tokenisation we will
    have a look at how we can actually implement a tokenisation algorithm in Java.
    There are some classes provided for that purpose in the java.text package, but
    these have mainly been designed for word processing purposes, and their output
    might not be linguistically useful. Also, you cannot influence way they work,'
  merge: -1
  img_proc: true
