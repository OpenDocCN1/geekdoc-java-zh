- pgno: 161
  md: '# DEALING WITH ANNOTATIONS


    In XML all tags have to be present, and the first sequence would mean something
    quite different from the second. This increases the verbosity of the data, but
    it gives developers who write software to process marked-up files a lot fewer
    headaches.


    XML is very cutting edge. It is going to be the way all pages will look in the
    future, where you have anything from browsers to WAP phones and TV set-top boxes
    accessing pages on the Internet. It seems to be the solution to the limited capabilities
    of HTML, which was only intended to mark up simple documents (as reading the layout),
    like help pages and academic papers. However, as it is so much on the forefront
    of current developments it is rather difficult to give a definitive description
    of it in a book, as it would be out of date by the time the book was published.


    The basic structure of XML seems to be fairly stable by now, it is the processing
    side of which is still changing rather frequently. Therefore the main focus of
    this description of XML is the format itself, and some ways you can handle without
    waiting for the arrival of the latest specifications. This might have to be rather
    simplified, but that is all we need to know for our purposes.


    # 8.2.1 An Informal Description of XML


    XML is an application of SGML. SGML itself is a way of defining mark-up languages,
    using a formal grammar to specify what the structure of a text should be like.
    Using the right programs you can verify that your data has the right structure,
    and you can rely on for any further processing. There is a formal grammar for
    XML, the XML DTD. A DTD is a document type descriptor, and it describes the relationship
    between different tags.


    An XML document is well-formed if it follows all the syntactic requirements that
    there is a closing tag for each tag, and nested properly. You can decide on the
    well-formedness by simply looking at the document and analysing its tags. To decide
    whether a well-formed XML document is also valid, you need to check if the tags
    also follows the ‘semantic’ restrictions specified by the DTD. The DTD prescribes
    what tags can be contained within what other tags, and in what order they have
    to occur. For example, the second form of the \<w> tag is also well-formed, as
    each opening tag has a corresponding closing tag. However, it is only valid if
    its DTD allows it to contain character data and does not require any further tags
    to be contained within the tags.


    We have already learned in XML both opening and closing tags have to be present,
    but what do you do with generic tags that do not have a closing tag? For example


    ```

    This is ridiculous. <pause duration=2sec> You can''t just do that. (SGML)

    ```


    there is a pause in the text, but it is a singular event, without a reason. For
    this you put a closing slash at the end of the tag, so that it looks like


    This is ridiculous. <pause duration="2sec"/> You can''t just do that. (XML)'
