    At first the large number of options may be a bit daunting, but once you understand
    the underlying structure you will see how it fits nicely into place. For each
    basic ‘conceptual’ type there are several implementations, each with their specific
    features. Choosing the right class for your task is the key for easy and efficient
    programming.


    The framework is centered around a set of interfaces. As you might recall from
    the previous chapter, interfaces allow you to create relationships between classes
    outside the strict hierarchy, so you can treat objects in the same way, even if
    they are from completely different branches of the class. You could see it as
    looking at just one aspect of the class: imagine a car, a bicycle and a stationary
    motor-driven crane. You could model this with an interface Vehicle and another
    interface MotorObject. Both the car and the bike could have methods for moving
    to some location, turning left, and so on. The crane and the car would have methods
    for starting the engine, increasing the engine speed, and checking on the level
    of fuel.


    If another say, a Person, you could implement a method which takes a Vehicle as
    a parameter. This would then implement bikes and cars, or even planes and buses,
    due to their ‘vehicleness’, regardless of any other of their properties. This
    is one of the major advantages of object oriented programming: that you can concentrate
    on shared features of otherwise unrelated classes.


    In the collection framework you will find many data structures, which are implemented
    in multiple ways. The actual implementations have different properties and features,
    and you need to think which of these suit your needs. Some implementations are
    faster than others, but will use more memory, whereas others need less memory
    but are slower. The impact on programming is minimal, as will still provide the
    same methods, and you are usually able to swap the classes you are using by just
    changing a single line.


    To make the best use of the collection framework it is therefore advisable to
    use the interfaces wherever possible, and only there to implementing the classes
    when you need to (e.g. when you are creating an instance of a collection class).


