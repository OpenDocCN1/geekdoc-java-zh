  md: '# 5.5.7 Collections


    The Collections class contains a set of methods which operate on collections,
    but you do not need to create an instance of it to use them. All its methods are
    declared static, which means they can be called directly, such as


    ```

    Collections.copy(targetList, sourceList);

    ```


    Strictly speaking this is violating the principles of object-oriented programming,
    but there are in a few cases where this makes perfect sense. A similar case is
    the java.lang.Math class, which also just holds a collection of mathematical methods,
    without being a ''proper'' class in its own right.


    ```

    static int binarySearch(List list, Object key);

    static void copy(List destination, List source);

    static Enumeration enumeration(Collection col);

    static void reverse(List list);

    static void shuffle(List list);

    static void sort(List list);

    ```


    Table 5.16: Important Collections methods


    The most important methods are listed in table 5.16. Most of the remaining methods
    have to do with more advanced aspects of Java and are not yet relevant to us.

    When looking again the different data structures provided by the collection framework,
    we can see that the List is less rich in features than the Set and the Map. There
    is also SortedList, for example, access is by index and not a key. Some of these
    issues are dealt with by two Collections methods, both operate on: sort() and
    binarySearch(). The sort() method will not sort any list, either according to
    the natural ordering of elements (provided they implement the Comparable interface)
    or a Comparator object which you have to pass to. The sorting algorithm is stable,
    which means that if you sort a list several times the elements will not change.
    This is obviously relevant if there are objects in the list which are equal.

    Once you have sorted a list, you can search for elements in it much more quickly,
    relying on the fact that they are in the right order. This is done with the method
    called binarySearch(), which is much faster than a simple sequential travel through
    the whole list. It looks at the value in the middle, and depending on whether
    the search value is higher or lower than that, continues searching in the upper
    or lower half. This search space is halved after each comparison, and you can
    locate an object in a set of 256 with 8 comparisons (as ²⁸ is 256). If you are
    searching through 1024 objects, this will increase to 10 comparisons (²⁰ is 1024).
    However, it is important that you sort() the list first, otherwise you will get
    an undefined result, which means that it is most likely you won''t find anything
    in the list at all.'
