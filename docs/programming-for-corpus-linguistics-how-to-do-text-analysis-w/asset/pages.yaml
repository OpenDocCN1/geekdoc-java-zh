    also optional, and it has the same return values as add(). You should not add
    a collection to itself, as this will result in undefined behaviour.


    Complementing the methods for adding elements are the following methods remove()
    and removeAll(). In case an object is contained multiple times in a collection,
    only a single instance will be removed. Again, both methods return true if the
    collection was changed. You can use this to check whether an object was actually
    in the collection in the first place, as


    ```

    boolean wasThere = wordList.remove("coffee");

    if(!wasThere) {

    System.out.println("The word was not in the list");

    }

    ```


    Note the use of the negation operator ''!'', which is often used instead of the
    more verbose if (wasThere == false).


    In order to remove all elements from a collection you can use the clear() method.
    Again, this is an optional operation, and it guarantees to set the unset unless
    it returns an exception.


