  md: 'modify it it is a noun. For this purpose most of the time only a narrow context
    is required. As soon as the context exceeds a single line on a printed page or
    a computer screen, it loses its big advantage, namely that the keyword (or node
    word) can be instantly located in the middle of it. Most computer software for
    corpus analysis provides a way of producing a KWIC display, while the KWOC format
    is not really used in corpus linguistics.


    # 3.4.3 Collocations


    By sorting concordances according to the words to the left or right of the node
    word it is very easy to spot recurrent patterns in the usage of the node word.
    However, if you have more than couple of hundred lines to look through, it becomes
    very difficult to lose sight of the big picture. One way to reduce large amounts
    of concordance to a list of few relevant words is to calculate the *collocations*
    of a node word.


    The basic concept underlying the notion of collocation is that words are important
    to a node word will occur in its local context more than one would expect if there
    were no ''bond'' of some sort between them. For example, the *word cup* will be
    found in the context of the *word tea* more often than the *word spade*, of the
    comparatively fixed expression *cup of tea* and the compound *tea cup*. There
    is no particular reason why spade should share the same link to tea as cup.


    Collocations are not limited to straightforward cases like this; quite often a
    list of collocates comes up with a few words one would expect, but also with a
    number of words which are obvious once you think about them, alone not native
    speakers would come up with This makes collocation a useful tool for corpus analysis,
    as it helps to unearth subliminal patterns in language use of which speakers are
    generally not aware.


    A number of studies (e.g. 1995) show how certain words (e.g. apparently neutral
    verb *to cause*) are always used with predominantly negative words, even though
    the word itself does not actually have any negative connotations when taken out
    of context.


    One important aspect when working with collocations is how they are evaluated:
    there is list of almost a dozen functions which compute significance scores for
    a word given a few basic parameters such as the overall size of the corpus, the
    frequency of the node, the frequency of the collocate, and the joint frequency
    of the two (i.e. the count of how often they occurs in the context of the node
    word). Some of these functions yield similar results, but they all have certain
    biases, towards towards more frequent words, and it is important to know about
    these properties before relying on the results for any analysis.


