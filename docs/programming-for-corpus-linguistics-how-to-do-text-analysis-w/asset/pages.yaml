  md: '# FILE HANDLING


    # 6.2 FILE HANDLING


    The most frequent I/O-operation you will perform is probably reading and writing
    to files. Before you can work with a file you will have to open it, and once you''re
    done with it you need to close it. If you don''t open a file, you will get an
    error when you try to read from it (or write to it), and if you forget to close
    a file that you opened for writing you lose some data, as for efficiency reasons,
    some data is usually held in a buffer in many memory, and the buffer is only written
    to the disk (or ''flushed'') when it is either full or the file is being closed.
    When opening files for reading does not really matter, the file itself will not
    have changed, but there is usually a limit on how many files you can open at a
    given time. If you open a lot of files for reading without closing them you might
    get an error message once that limit is exceeded, and you will be unable to open
    any more files. It is thus always a good idea to close any file you''re finished
    with it, regardless of whether you have opened it for reading or writing.


    # 6.2.1 Reading from a File


    Let''s look at how we open a file for reading:


    ```

    FileReader corpusFile = new FileReader("bnc.sgml");

    ```


    This is very much straightforward: we create a new FileReader object, called corpusFile,
    specifying the name of the file we want to open, here ''bnc.sgml''. This of course
    can be a String variable instead of literal string value. If you look closely
    at the full API description of the FileReader class, you can throw a FileNotFoundException,
    a subclass of IOException. This happens when you try to open a file that does
    not exist, so you need to be aware that you either to catch the exception or propagate
    it to a higher level.


    As we discussed earlier, FileReader is not a very useful class for text processing,
    as it only allows you to read a single character at a time. Reading single characters
    is both inefficient and cumbersome, as you would have to collect the individual
    characters and put them together to get a line or word. For a reason the FileReader
    is typically wrapped in a BufferedReader, as in


    ```

    BufferedReader corpusReader = new BufferedReader(new FileReader("lob.txt"));

    ```


    Now you can use of the readLine() method, which returns a whole line at a time.


    The following example class does the job of the Unix cat command, or the old DOS
    type: it displays the contents of whatever files you list on the command-line
    when you call the class. Note how exceptions are used to provide meaningful error
    messages.'
