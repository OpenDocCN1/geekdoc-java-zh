  md: '# 7


    # Processing Plain Text


    There are plenty of different shapes or forms that text can come in, mainly due
    to sophisticated word processing or desktop publishing programs that combine layout
    information and images with text itself.


    As we discussed in chapter 3, one could try and reverse-engineer these formats,
    but that is often a very difficult task that requires a lot of expertise with
    data formats, so if you want to use these texts for your corpus work you would
    face quite a problem before you even got started. You will probably be best off
    to convert any data into plain text for further processing, or choosing plain
    text to start with. Plain text can practically be created from any text processing
    package. You do of course lose all formatting information, but that is generally
    not relevant for linguistic purposes anyway. If you want to represent any structural
    information you can use a mark-language to add to them. One suitable option for
    this is XML, which we will look into in the next chapter.


    # 7.1 SPLITTING A TEXT INTO WORDS


    In the previous chapter, when we produced concordances, we dealt with a line as
    a sequence of characters in which we matched a pattern, namely the word we were
    looking for. We did not analyse the lines by any further, for example to find
    out how often a other word would occur next to our node. Looking at the concordance
    output like this is a very easy thing to do for a human, but to the computer it
    is just a of symbols without any further meaning.


    So, before we do anything else with a text, we need to split it into individual
    words, a process which is called tokenisation. By tokenising a text we make the
    important transition from an unstructured stream of single characters to a list
    of meaningful symbols, just segmenting phonemes into morphemes and morphing those
    into lexemes.


    We have already seen that the characters that make up a concordance line like
    all the same to a computer, but for a human reader they have additional properties:
    the space separates two words, and some most of the punctuation. Letters make
    up words, and some punctuation marks (such as the hyphen or the apostrophe) can
    also be part of a word. For most purposes we want to deal with higher level units
    instead of simply characters, so we have to extract words out of the stream of
    characters that the computer reads out of an input file.'
