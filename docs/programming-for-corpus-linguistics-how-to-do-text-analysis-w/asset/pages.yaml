  md: '# VARIABLES AND DATA TYPES


    # 2.3 VARIABLES AND DATA TYPES


    We have already come across data types when we were talking about expressions
    on page 16. We there use time as an example. All expressions have a data type,
    which tells the computer how to deal with them. The data type of the ''time''
    expression depends on the computer language you''re using: it could be a specific
    type handling dates and times, or it could be a sequence of characters (e.g. ''10:30''),
    or even (as it is common in the Unix operating system) a single number representing
    the number of seconds that have elapsed since 12:00 a.m. on January 1st of 1970.
    In Java there is a special class, which contains references to dates and times.


    When an expression is evaluated, you need somewhere to store the result. You also
    need a way of accessing it, and this is done through variables. We have already
    come across variables and constants as symbolic labels for certain values, assigning
    new values to them. From a technical point of view, variables are places in memory
    which have a label attached to them the program can use to reference it. For example,
    if you want to count how many words are in a text, you would have a variable ''counter''
    in which you store the number of words encountered far. When you read the word,
    you take the current value stored under the label ''counter'' and increment it
    by one. When you have finished counting, you can print out the final value. In
    pseudo-code this could look like


    ```

    1 counter = 0

    2 while more words are available

    3 read next word

    4 counter = counter + 1

    5 endif

    6 print counter

    ```


    At the beginning of this program, the variable is initialised to zero, which means
    it is assigned an initial value. If this is not done, the storage area this label
    refers to just contain a random value, which might lead to undesired results.
    If you forget to initialise a variable, the Java compiler generally gives you
    a warning. It is best to develop the habit of always organising variables before
    they are used.


    A variable can contain only one sort of data, which means that the data in the
    computer''s memory points to it is interpreted in a certain way. The basic distinction
    between numerical data, character data, and composite data. In the following sections
    we will walk through the different data types, starting with numerical types.


    # 2.3.1 Numerical Data


    These are numbers of different kinds. The way a number is stored in memory is
    optimised depending on what it is used for. The basic distinction here are integer
    numbers (with no decimal places) and floating point numbers (with decimal places).
    The wider range of the value, the more memory it takes up, so it is worth choosing
    the right data type. The numerical types available in Java together with their
    required storage space is shown in table 2.2.'
  merge: -1
  img_proc: true
