    when you want to write a file. It would have been a lot easier and more intuitive
    if the author of the BufferedWriter had included a corresponding writeLine() method.


    We cannot write to a file without having anything to write, so as an example we
    will tie together reading and writing to process a word list. The input file contains
    one word per line. This file is entirely unordered, and contains multiple occurrences
    of a word. The following class will read in such a list, sort it alphabetically,
    and at the same time how many occurrences of each word are in the file. This sorted
    list is then written into a file.


    # Sorting a Word List


    The class has two main methods, which take a reader and a writer as their respective
    parameters. The readList() method reads lines from a BufferedReader, assuming
    that there is one word per line. After this method has been called all words with
    their respective frequencies are in the computer''s main method. The other method,
    writeList(), writes the sorted list with the frequency information to the PrintWriter
    it has as its parameter.


    A further method, main(), is provided so that you can run the class as an application,
    but it is not necessary if you want to use this class in a program of your own.'
