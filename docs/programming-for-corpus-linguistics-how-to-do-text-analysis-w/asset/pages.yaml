    # 2.1 WHAT DOES A PROGRAM DO?


    A computer program is simply a list of instructions which the machine executes
    in the specified order. These instructions have to be in a code that the machine
    can interpret in some way, which is roughly what a computer language is. In order
    to make it easier for humans to write programs, special programming languages
    have been developed which are more abstract and at a lower level than human thinking
    than the low-level manipulation of zeroes and ones that the computer ultimately
    does. One can go even further and design programs in an abstraction from programming
    languages, which would be the equivalent of jotting an outline of a book or before
    filling in the gaps with prose text.


    This outline is called an algorithm in computing terminology. An algorithm is
    very much like a recipe, in that it describes by step what needs to be done in
    order to achieve a desired result. The only problem is that the computer cannot
    cook, and will therefore be stupid when it comes to interpreting the recipe: it
    does so without trying to make sense of it, which means it does literally what
    you tell it to do. You will find that when you''re new to programming it usually
    does something you didn''t want it to, mainly because it is difficult for a programmer
    to think in the simple and narrow-minded way as a computer does when executing
    a program. And that is also one of the main ''skills'' of programming: you have
    to think about an abstract level during the design phase, but when it comes to
    coding you also need to be think in a manner as straightforward and pedantic


    In the following sections we will have a closer look at what an algorithm is and
    how we can most easily express it. In the discipline of software engineering a
    variety of methods have been developed over time, and we will investigate some
    of which might be useful for our purposes. The most important point here is that
    we don''t care too much about the methods themselves, as we only view them as
    a means to the end of creating a computer program.'
