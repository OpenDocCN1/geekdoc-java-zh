    \ is working best when the list does not grow in size. This is another argument\
    \ to transfer your data into an array for later processing.\n\n# Set\n\nA Set\
    \ is similar to a list in that it can only contain single objects, but it has\
    \ the added restriction that each element can only occur once. If you want to\
    \ have a list of all word types in a text, you can go through the data with a\
    \ tokeniser and add the tokens to a set as you go along. All duplicate instances\
    \ will automatically be discarded, and you are left with list of types.\n\nYou\
    \ can choose a SortedSet, in which case you get a sorted word list at no extra\
    \ cost. However, if you want to associate frequency values with the words, processing\
    \ becomes a bit more cumbersome.\n\n# Map\n\nMaps are more suitable for frequency\
    \ lists, as they allow you to associate data with a key. The key would simply\
    \ be the word, and its frequency can be stored in the associated object. This\
    \ can be used for counting, as we have already seen in the SortedFVList class\
