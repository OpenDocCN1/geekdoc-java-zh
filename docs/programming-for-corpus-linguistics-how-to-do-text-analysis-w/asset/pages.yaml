- pgno: 231
  md: '# COLOCATION ANALYSIS


    We need to create a word frequency list of the text. In order to avoid funny results,
    the ''small print'' at the beginning of the file was removed, as that was the
    last line which stated that this was the end of the text. Then you run


    ```

    java FreqList frank1.txt

    ```


    and shortly after you find a file ''frank1.txt.frq'' in your working directory.
    This file contains all tokens with their respective frequencies.


    The next step is to extract some concordance lines from chapter 6, which we''ll
    be using the IndexedConcordancer to work on. For this we''ll need to create an
    index for the file:


    ```

    java IndexConcordancer frank1.txt

    ```


    This should give you a file ''frank1.txt.idx'' with all your words and then you
    can use it to extract collocations, for example with


    ```

    java IndexedConcordancer frank1.txt monster monster.cnc

    ```


    This command runs the IndexedConcordancer to find occurrences of monster, which
    will be 33 of, and writes them to a file named ''monster.cnc''. Once we have gathered
    all the data we can finally complete the collocations, for example the command-line:


    ```

    java Collocation 4 4 1 monster.cnc frank1.txt.freq

    ```


    This uses a focus of four words and cut-off of one, and the result is a list of
    collocations, such as:


