- pgno: 200
  md: '# Part of Speech Tagging


    # 10.1 INTRODUCTION


    In a study question in McEnergy and Wilson (1996) a simple part-of-speech tagger
    is described, and the task for the reader is to manually tag a sentence using
    the algorithm. In this chapter we will see what it takes to implement this as
    a computer program, as tagging is rather boring if it is done by hand. Before
    we look at the program there is a brief introduction to some relevant concepts
    of tagging.


    Part-of-speech tagging is the process of assigning word class labels to tokens
    in a running text. It is then possible to investigate syntactic patterns and distinguish
    different forms of a lemma. Sometimes it is even possible to look at words, as
    long as they are tied to different word classes.


    The program performing that word class assignment is called a tagger, rule-based
    or stochastic. The first step, which all tags share, each word of the input text
    gets assigned number of potential tags, the number which depends on the ambiguity
    of the token. Some words will not be found in the lexicon, in case there has to
    be some way of ''guessing'' the right set of tags. This is typically done by looking
    at morphological features, for example the ending, and that if should fail the
    last resort is to assign a default set of all open word classes.


    A rule-based tagger has its resources a list of rules which describe possible
    sequences of tags. They typically look the environment of an ambiguous word and
    try to work out from the context what the most likely tag would be. For example,
    light can be either of adj, noun or verb, but in this context


    ```

    a_DET light ??? snack_NOUN

    ```


    there could be a rule which might look like


    ```

    DET ??? NOUN -> DET ADJ NOUN

    ```


    and specify that an unknown word surrounded by a determiner and a noun is likely
    to be an adjective.


    The problem with rules is that they usually require a lot of effort to create
    (though there are ways to acquire rules automatically, see Brill (1992), and you
    need a lot of rules for comprehensive coverage of all possible situations. Also,
    these rules are generally language specific, or even limited to a particular tagset.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'As opposed to that, a stochastic tagger uses probabilities which usually have
    been gathered from a (manually) pre-tagged training corpus. In the above example
    the tagger would evaluate which of the individual tags are most likely on their
    own (i.e. what part-of-speech is most frequent for light), and that is when combined
    with the likelihood of the tagging sequence. Some taggers use bigrams, so they
    just look at the preceding tag, whereas others use trigrams, which means they
    take three tags into account


    A stochastic tagger can easily be designed to be language independent. All it
    needs is a training corpus to extract probabilities, and there are ways to fall
    back in cases which did not occur in the training data. For an experiment in adapting
    a stochastic tagger from English to Romanian we Tufis and Mason (1998).


    The tagger described in McEnery and Wilson (1996) is a stochastic one, based on
    bigrams. In the following section we will look at the design, before we then discuss
    how it can be implemented.


    # 10.2 PROGRAM DESIGN


    The tagger can conceptually be separated into four different components:


    +   1. the lexicon, to look up the open class words

    2. the suffix analyser, to deal with the open class words

    3. the transition matrix, to incorporate knowledge about context

    4. the processor, to assign the tags


    It thus seems fairly straightforward to design the tagger using four different
    classes, for each of the components. There are a number of points to look out
    for during the design phase, as we want to keep our options open for further improvements.


    ![](img/c394310805c2e60720e6e9e923804321_201_0.png)


    Figure 10.1: The structure of the tagger'
