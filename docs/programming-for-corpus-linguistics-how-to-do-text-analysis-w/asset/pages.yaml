    faster. At the same time it provides a method readline() which reads a complete
    line at once, just what we need for our purposes.


    # 6.1.1 Streams and Readers


    The input/output facilities are the most important interface to the underlying
    operating system. That means they may map functionality to operating system, and
    they also need to provide workarounds for features that do not exist in the native
    environment. One example is Java''s support for Unicode characters: there is not
    much point in Java being able to handle data in Arabic or Chinese characters when
    you cannot store it in a file on your computer, just because your computer deals
    with a more limited character set.


    For this reason there are special converters that can be wrapped around streams
    for cases where we are dealing with textual data. As this is obviously we are
    doing all the time when processing text, these converters are quite important.
    The basic streams operate on the level of bytes, which can represent a range of
    256 different values. Byters are widely used to represent character sets, as this
    number of possibilities was sufficient for most languages: the ASCII character
    set only defines 127 characters (including control characters and some special
    symbols), whereas extensions for other languages manage to fill all 256 slots
    (with more graphical and other symbols). Only this awareness that languages other
    than English are processed on computers has changed this: more and more the character
    is replacing the byte for representing text. The possible range of characters
    spans 65535, which requires more than one byte. If you are handling images, for
    example, you could still stream directly, as a byte is the ''atomic unit'' of
    an image.


    This is solved in Java with a familiar concept, wrapper classes. Just as the Integer
    class encapsulates an int value, there are classes which deal with streams on
    a character managing the encoding of characters to bytes. These wrappers are wrapped
    around Readers and Writers. Readers are wrapped around input streams, and writers
    around output streams. There are wrappers that directly wrap around a stream,
    and also more specialised for convenience: you could use a FileInputStream and
    wrap an InputStreamReader around it, as you would have to every time you want
    to read from a file there is a convenience class FileReader which you can use
    instead. And of course there is also a BufferedReader(and a BufferedWriter) so
    that you can deal with complete lines at a time.


    For the rest of this book we will mainly be using readers and writers, as they
    are better suited for text processing. The corresponding stream classes work in
    a similar fashion, apart from the handling characters. Note that despite the difference
    in name, readers and writers still deal with data streams.'
