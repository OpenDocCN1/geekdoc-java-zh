- pgno: 192
  md: '# IMPLEMENTATION


    # 187


    implement the List interface, but for anybody using the RuleLoader class all that
    is relevant to the class it returns a List. If the actual choice turns out to
    be too slow, or to wasteful with space, the actual Vector which is to implement
    the List can easily be replaced by some other List class without having any impact
    on other classes. This decoupling of functionality and implementation is a very
    good thing to do, and it cases like when one suddenly realises the power of object-oriented
    languages and Java in particular.


    The load() method itself follows a common pattern, a loop through lines of a file.
    First we open the file and wrap a BufferedReader around it for increased efficiency.
    We read the first line, and locate errors to also keep track of line numbers.
    We enter a loop while there are still more lines available. Attempt to read a
    line beyond the end of the file will return null, so we test for that in the loop''s
    condition. Empty lines or those starting with a hash sign are ignored, we only
    process a line if this does not apply.


    Each line consists of a number of strings, separated by spaces or tab characters.
    To split a line into elements we use a StringTokenizer object, which we construct
    on the input line. White spaces are the default separators, so we don''t need
    to take any further action here. If a line is incomplete, the next token will
    throw an exception, and in order to drop this we enclose the tokenisation of the
    line in a try/catch block. In this block we read four tokens, assuming that there
    are at least four tokens available. An empty element is indicated by a dash, so
    we need to convert those to nulls. We create a Rule object with these parameters
    and add it to the list of rules.


    If there are fewer than four tokens a NoSuchElementException will be thrown and
    causing the flow of control to be handled over the catch block. Here we print
    a diagnostic message to notify the user of the error, and then continue, thus
    effectively skipping the incomplete line. It is unlikely that this error cannot
    be recovered from, as it means that rule is missing, and execution of the program
    will continue without it, as long as the user is aware that there might be problems.
    This is an example of a recoverable error.'
