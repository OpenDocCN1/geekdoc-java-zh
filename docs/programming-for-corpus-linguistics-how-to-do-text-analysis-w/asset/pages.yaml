  md: 'After the theoretical background, we have implemented a simple tokeniser which
    splits XML data into distinct elements. This tokeniser does not recognise all
    possible forms of tags, but should go a long way when processing corpus data,
    which doesn''t necessarily use a lot of fancy mark-up.


    And finally we have seen how easy it is to create applications based on lower-level
    components like the tokeniser. Once the main job of splitting the input correctly
    is done, checking for well-formedness is very easy and straightforward, and does
    not require a lot of programming effort.'
