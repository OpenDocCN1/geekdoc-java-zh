    # # The Java Class Library


    In this chapter we will first briefly cover the different parts of the Java class
    library are organised. Related classes are arranged in so-called packages, and
    understanding the mechanics of those is fundamental for Java programming. After
    that we will have a brief look at how Java deals with errors, before we look in
    detail at one of the most important classes of the Java language, the String class,
    which is used to represent sequences of characters. We''ll investigate the API
    of the String class, with how the individual methods it provides can be used.


    Next we''ll look in slightly less detail at some other classes which we will use
    frequently when writing your own programs, and which are vital if you want to
    look at existing programs written by other people in order to understand how they
    work. Some of these classes, however, have been made superfluous by the collection
    framework which was introduced in version 1.2 of the JDK. We will look at this
    framework in the final section.


    This chapter will contain a few examples to illustrate the usage of the classes
    described in it. Its main purpose is to introduce these classes and to prepare
    for using them in the following chapters. For most examples we require external
    input, which we will be dealing with in the next chapter. So far we have mainly
    looked at the theoretical background and the principles of object oriented programming,
    and this chapter is going to make the transition to applying these principles
    in practice.


    # ## 5.1 PACKAGING IT UP


    # ### 5.1.1 Introduction


    A Java application consists of a number of classes, and through modular design
    and re-use this number can be quite large. There are classes available for a wide
    variety of tasks, and it would be a question of time until classes were created
    that had the same name. This would cause a rather difficult situation, namely
    how you tell the computer which of identically named classes you want to use.


    As this problem can easily be foreseen, there is a solution built into the language:
    packages. A package is a directory on your hard-disk, a container where classes
    are kept together. Just as when you have two identically named files on your computer''s
    disk, they can be told apart by their fullname, which includes the location as
    a path of directories leading to the actual file. This analogy with directories
    is closer than you might think, as packages directly reflect the directory structure,
    and the package name of a class is mapped onto a pathname that the JVM follows
    when it tries to find a certain class.'
