  md: '# THE STRINGTOKENENIZER CLASS


    If you look at the source code of the PreTokeniser class you will notice that
    we have created a hit. As the class only has one method, tokenize() which can
    only be called once with a given string, we have not implemented in strict object-oriented
    fashion. We have just implemented this method and tok2 which we have ''wrapped''
    in a class, as methods cannot be outside classes in Java. This is similar to the
    Math class in the java.lang package, which is basically a collection of methods.
    There are sometimes cases where the object-oriented paradigm doesn''t really fit,
    and in those cases you will have to wrap the methods up separately.


    But how you call a class ''method'' without having an instance of that class available?
    The answer to this lies in the special keyword static. This means that you can
    call the method directly without the need to create an object first. This is identical
    to the main() method, which is also declared static. After all, you have to start
    somewhere, and when you run a program there are no objects around initially.


    In order for the JVM to know where the definition of the method is you simply
    prepend the class name to that


    ```

    StringWithSpaces = PreTokeniser.tokenize(originalString);

    ```


    The PreTokeniser class also contains a main() method so that you can test it from
    a command-line. You might have to enclose the command-line quotes, as it contains
    spaces. In the next section we will have a closer at how the PreTokeniser works.


    # 7.2.2 The PreTokeniser Explained


    As already mentioned, the PreTokeniser has only one method, tokenize(). It arguments
    as a String which contains the text that is to be processed. At the beginning
    we create an instance of the StringTokenizer class around String, which we use
    for splitting it into basic tokens. In the constructor of the StringTokenizer
    we supply a list of all punctuation marks (defined earlier in the class as a constant,
    called PUNCT), and also state that we want to receive delimiters as well as tokens
    by setting the third parameter to see the StringTokenizer API in table 7.1 above).
    The sequence \u00a3 in the PUNCT stands for the Unicode character with the index
    A3, which is a pound sign. This can be used to represent any characters which
    you cannot find on your keyboard; the only difficulty is to convert the decimal
    to hexadecimal.


    In the tokenize() method we require a few more variables: apart the StringTokenizer
    object there are two Strings, tok1 and tok2, a boolean flag ship, and a StringBuffer
    object retval. Tok1 and tok2 are used to keep track of the context. In order to
    decide whether a comma is a separating punctuation mark we need to test whether
    it''s followed by a space, so we need a context of two tokens, the comma and what
    follows it. Here the current token is stored in tok1, and we read the next token
    into tok2.'
