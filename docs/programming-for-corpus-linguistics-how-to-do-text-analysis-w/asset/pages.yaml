  md: '# 22 INTRODUCTION TO BASIC PROGRAMMING CONCEPTS


    We start off by initialising a few variables. If you initialise a variable, you
    assign an initial value to it. These variables are: searchWord, the word we will
    be looking for, searchPosition, the position it first occurs at, and a counter
    that keeps track of which position we''re at, currentPosition. The searchPosition
    as an indicator of whether we have found the word yet: it initially is set to
    -1, and keeps value until it matches a word in the text.


    After opening our input text for reading, we enter the loop. In our case they
    are governed by a complex condition, which is made up of two sub-conditions. Our
    condition is a logical AND, which makes the whole condition true only if both
    sub-conditions are true. As soon as either of the sub-conditions becomes false,
    the condition will become false as well. The condition is that there are more
    words available to read (otherwise we wouldn''t know when to stop reading), and
    that the value of searchPosition is -1. This means that we haven''t found the
    word we are looking for.


    In the loop we read a word and note its position in the text, and then we compare
    it to our target word: searchPosition. Once this has happened, the variable will
    no longer be -1, and the second sub-condition becomes false, causing the loop
    to be terminated. Otherwise searchPosition will remain -1, and the loop is executed
    again.


    Once we''re done with the loop, we investigate the value of the searchPosition
    variable: if it is still -1, the loop terminated because the end of the text had
    been read before the search word was encountered. In case we print out a message
    that it has, please note the way the variable is printed: if it is enclosed in
    double quotes like the rest of the message, we would simply printed the word ''searchPosition''
    instead of the value of the variable searchPosition. What we have to do to print
    the actual value is to attach it to the message with a plus sign outside the double
    quotes.


    While this loop is characterised by the fact that the condition is evaluated before
    the body of the loop is reached. This means that the body might not be evaluated
    at all, when the condition is false to start off. This could be the case if the
    input text is empty, if it contains no words (or maybe doesn''t exist). Another
    type of loop has the condition after the body, so that the body is executed at
    least once. They are similar, so let''s look at the same task with a different
    loop:


    ```

    1 searchWord = "scooter"

    2 searchPosition = -1

    3 currentPosition = 0

    4 open input text for reading

    5 do

    6 read word

    7 increment currentPosition

    8 if word == searchWord

    9 then

    10 searchPosition = currentPosition

    11 endif

    12 while text-has-more-words && searchPosition == -1

    13 input text

    14 if searchPosition == -1

    15 then

    16 print "the search word does not occur in the text"

    17 else

    ```'
