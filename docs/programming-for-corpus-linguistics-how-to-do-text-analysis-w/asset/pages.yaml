    \nNext we get the transfer part of the rule and compare it to the String finished.\
    \ The string literal can be used in exactly the same way as a normal string object,\
    \ and there is a reason that we call the equals() method on the literal and not\
    \ on the transfer: if the value of transfer is null we get a NullPointerException\
    \ when we try to execute one of its methods. The literal, however, will never\
    \ be null, and is not a problem if the parameter of equals() is null we never\
    \ get into trouble here, whatever the value of transfer.\n\nIf the transfer part\
    \ is equal to finish we set the variable to true, which means we exit the main\
    \ loop at the end of this part. Otherwise we try and locate a route which has\
    \ a label that matches the transfer. The advance() method does that, and it returns\
    \ true if it found a matching label. When it returns false it means there was\
    \ no matching label and we ought to stop the processing. Therefore we assign to\
    \ the finished flag the negation of the return value, as indicated by the exclamation\
    \ mark (the boolean operator, see 2.1).\n\n+   * Advance through the set of rules\
    \ until a matching label has been found.\n* The iterator given as a parameter\
    \ is moved forward to the next rule\n* matches the given label.\n* @param iter\
    \ an iterator through a set of rules.\n* @param label to match.\n* @return false\
    \ if no matching label could be found, true otherwise.\n\n```\nprivate boolean\n\
    advance(Iterator iter, String label) {\n    boolean found = false;\n    while(iter.hasNext()\
    \ && !found) {\n        Rule r = (Rule)iter.next();\n        if(r.matches(label))\
    \ { // match found\n            iter.proceed();\n            found = true;\n \
    \       }\n    }\n    return(found);\n}\n```\n\nThe advance() method moves the\
    \ iterator forward until it hits the end of the list of rules or finds one with\
    \ a matching label. By default we assume that no rule has been found, and we initialise\
    \ a flag with false. Like the main loop of the stem() method we proceed while\
    \ there are more rules to look through and we haven't found a match. We get the\
    \ next rule and test if it label matches the one we are looking for. If the match\
    \ was successful, we need to go back one step, as the the previous rule, which\
    \ is in fact the one we just retrieved, so that the matching rule will be the\
    \ one selected next time the iterator is accessed. Effectively we are moving the\
    \ iterator to the rule before the one with the matching label. We then set the\
    \ flag to true so that the loop is exited. If there was no matching rule, the\
    \ loop will exit because of the first condition, and found will still have the\
