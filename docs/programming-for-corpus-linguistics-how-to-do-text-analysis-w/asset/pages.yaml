    # 5.1.2 The Standard Packages


    Part of the power of Java comes from the large number of useful classes that are
    included in the language specification. Unlike alot of other languages which only
    define a minimal set of commands and few third party extensions for anything non-trivial,
    Java includes quite a large set of classes for most purposes. As these classes
    are guaranteed to be available on any Java system, you can use them without worrying
    about whether they are actually installed on the machine of a potential user


    This saves you a lot of time, as you always don''t have to reinvent the wheel,
    and the standard packages allow you to concentrate your efforts on the actual
    logic of your program, without wasting too much time on programming auxiliary
    classes for other tasks that you might need. Every major revision of Java has
    included more packages and classes, so it doesn''t make sense to spend too much
    time listing them; it is best to consult the on-line documentation of the JDK
    you have installed on your computer for the authoritative list. In this section
    we will therefore have a brief look at packages which contains classes that are
    important for processing texts and corpora, plus a few you might be interested
    in later on.


    All classes in the standard package start with java.., followed by the actual
    name of the package. However, you can''t import all classes by typing


    ```

    import java.*;

    ```


    as the asterisk only applies to classes within a package, and not to sub-packages.
    The above statement would only include classes from a package called java, but
    there aren''t any, as they are all in sub-packages of java.


    There is no other set of packages that comes with JDK distribution, which start
    with sun. These packages are not very well documented, and for a good reason:
    you shouldn''t use them. They are either internal classes that are used behind
    the scenes, or classes which haven''t quite made it into the standard distribution.
    The sun are likely to change without notice, and if you want your programs to
    work longer than until the next version of Java is released you should avoid to
    use them. Generally you won''t need them anyway.


    The most important package is java.lang, and it is crucial that you don''t even
    have to import it yourself; it is automatically imported by the compiler. It contains
    some basic classes which are required by the language itself.


    The package from which you import classes most often is java.util. It contains
    a set of utility classes which are not essential but very useful. We will look
    at some of its classes towards the end of this chapter.


    All classes that deal with input and output are bundled in the package java.io.
    The whole of chapter 6 is devoted to these classes, as they are important for
    data processing.'
