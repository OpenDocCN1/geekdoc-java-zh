    # Networking


    Java is closely associated with the Internet. This is mainly because it is used
    as a programming language for applets, small applications which run within a web
    browser when you visit a certain page, but it also has a range of components which
    allow easy access to data networks, just as if it was on the local machine. Opening
    a web page from within an application is as easy as reading a file on your local
    hard drive. Furthermore it is possible to execute programs on other machines on
    a network, so that distributed applications can be implemented. By utilising the
    capacity of multiple computers at the same time very powerful and resource-intensive
    software can be developed.


    # 1.3 GETTING JAVA


    Unlike a lot of languages, compilers for Java are freely available on the Internet.
    You can download the latest version from the Sun website, see the resources section
    in 12.2 on page 231. There are two different packages available, one called JRE
    and one JDK or SDK.


    The JRE is ''Java Runtime-Environment''. You need this if you just want to run
    programs in Java. It contains the standard class library for a virtual machine
    for your computer.


    The JDK or SDK is the ''Java Development Kit'', or the ''System Development Kit''.
    Sun, as the distributor, has changed the name of that package from version 1.2
    onwards. This package contains all you need to develop programs in Java, and includes
    the run-environment important. In fact, the Java compiler, javac is itself written
    in Java. If you want to compile your programs in Java you will need to get this
    package.


    You also need an editor, in order to write the source files. You can use any text
    editor, as long as you can produce plain text files. Some companies offer so-called
    IDEs (Integrated Development Environment), sometimes with their own optimised
    compilers. As long as they are supporting the full Java standard you can use one
    of them for development.


