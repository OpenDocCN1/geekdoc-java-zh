- pgno: 145
  md: '# 138 PROCESSING PLAIN TEXT


    The main loop of the tokenize() method is driven by the availability of tokens
    from the StringTokenizer. Within the loop we shift the tokens, making the previous
    ''next token'' our current one, reading in the next token (the called look-ahead)
    from the StringTokenizer. Then we investigate our current token; if it is one
    of the three special characters we are interested in we look at the next token:
    if it is a white space we put a space in front of it, separating it from the previous.
    If it is not followed by a space it is inside a word, like don''t or 2.50. In
    this case we set the skip flag to true to make that we don''t want to insert a
    space after it.


    If the current token was not one of the special characters, we put a space in
    front of it (unless it is the skip flag will be). Then we append the (possibly
    modified) current token to the StringBuffer in which we build up the pre-tokenized
    string. At the end of the loop we add the last token, before converting the StringBuffer
    into a String and returning it.


    Using the main() method provided for testing purposes we can actually try it.
    A sample could look like this:


    ```

    > java PreTokenizer "Testing, 2.50 don''t 10,000,000.00"

    Testing , 2.50 don''t 10,000,000.00

    > _

    ```


    As you can see, the program correctly splits off the first comma from the word
    Testing, leaving the other punctuation marks. You will also notice that there
    are some additional spaces that have been inserted; this could have been avoided
    by not adding spaces around the space delimiters, but this is not relevant for
    further processing. After all, a sequence of delimiters is treated as just one
    delimiter for the purpose of tokenisation.


    # 7.2.3 Example: The FileTokeniser


    For the next stage we integrate our PreTokeniser in a useful utility to tokenise
    a whole file. The FileTokeniser class can be used exactly the same way as the
    StringTokenizer, except it works on a file rather than a String. It takes as argument
    in its constructor the name of the text file which contains the data to be tokenised.
    This is then opened and tokens are read from, analogous to the StringTokenizer.
    It makes use of the PreTokeniser to handle tokenisation as described above.


    Unlike the PreTokeniser this not implemented using a static method, as it is more
    suitable to be done as a ''proper'' object which renders a service, namely the
    delivery of tokens when one is requested.


    Basically this is a wrapper around the StringTokenizer class. It reads a line
    from a file and puts it through the PreTokenizer and a StringTokenizer to extract
    the tokens from it. When all tokens from the line have been read continues reading
    the next line from the file and the process is repeated until the end of the file
    has been reached.'
