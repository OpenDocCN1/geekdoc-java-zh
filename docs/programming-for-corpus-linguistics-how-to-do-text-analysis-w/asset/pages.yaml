    associated with a word.

    This is where container classes come in. A container class is an object that contains
    a number of other objects. You access these objects either by an index number,
    with a key, or in a sequential order through so-called iterators. You can think
    of a dictionary as a container class, where you access the entries via a key,
    named the headword. As it happens, most entries will be containers themselves,
    with separate definitions for each sense. Here you access the definition by the
    sense number. So, in order to look up sense of the *word* you first retrieve from
    the dictionary the list of definitions associated with *take*, and then you take
    the third definition from that list.


    There are different ways of organising data objects, each with their advantages
    and disadvantages. Each way has a set of parameters which determine its suitability
    for the task at hand, and choosing the right option can make a program easy and
    straightforward, fast, and efficient. The wrong choice, on the other hand, can
    make it awkward, slow and space-wasting. This is important to know what the available
    options and their properties are.


    From version 1.2 onwards, Java has a very systematic framework of data structures,
    so the *collections framework*. In previous versions of Java there were only a
    few loosely related classes. However, as older classes are still widely used (for
    reasons of backwards compatibility) it is important to have a look at them. In
    practice you might prefer to use the classes from the collections framework instead
    if you are using Java 1.2.


    # 5.4.2 Array


    An array is a structure built into the Java language. Unlike all the other container
    classes you can store primitive types (int, char and so on) in an array. You declare
    a variable as an array by adding square brackets to char, for example


    ```

    int frequencies[];

    ```


    This line only declares frequencies as an array in which you can store int values,
    it doesn''t specify how many of them there could. In order to use this array,
    you then need to create it using a new statement, like other objects:


    ```

    frequencies = new int[5];

    ```


    Here you reserve space for five values. Arrays have a defined number of cells,
    and you cannot change that unless you use another statement to relocate the array.
    Unlike the *StringBuilder* method *set()* however, you will then lose the contents
    of the previous array. You can access the individual cells in an array by their
    index positions; note that counting starts at zero, so you have indices 0 to 4.
    Arrays have an associated variable, length, which tells you how many elements
    are there in. Unfortunately this is very confusing, as it is a public variable,
    not a method, so while you use *length()* to find out the length of a *String*,
    you use *length* (without brackets) for the size of an array. The compiler will
    tell you when you mix these up, but nevertheless it is quite a nuisance to remember
    this (and to be told by the compiler if you got it wrong).'
