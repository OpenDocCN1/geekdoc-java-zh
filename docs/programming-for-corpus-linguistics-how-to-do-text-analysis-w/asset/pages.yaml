  md: '# RANDOM ACCESS FILES


    The reason for that is that we always have to trawl the whole text when we want
    to find occurrences, even if the word does not appear in the data at all. We only
    know this when we have looked at every character. This is obviously not good enough,
    especially when you need to produce concordance lines interact. Unfortunately
    there is no way of speeding up this kind of input processing enough for it to
    be suitable for interactive use with larger amounts of data.


    Another problem is that it is not possible to extend the context once has been
    created. Suppose you are looking at a set of concordance lines and there is one
    where you want to investigate an extended context. You can''t do this with either
    of the two versions of the ConcordanceReader, unless you start reading from the
    beginning of the text with a bigger buffer size.


    These limitations are not inherent to Java programming or concordancing, and you
    will surely have used a concordancing program that brings up in an almost instantaneous
    way, even with larger amounts of text. The problem here is in the way the data
    is processed: it is read sequentially. That means you can only read in data, without
    being able to move around freely within the data. This restriction is necessary
    for some types of data, for example with keyboard input or read data through a
    network. In those cases it is physically impossible to move around in any other
    way. In fact, the only case where random access is possible is when the data is
    kept in a file that is available through the local file system of the computer.
    We will look at how to do this in the following section.


    # 6.4 RANDOM ACCESS FILES


    Up now we have used a FileReader to access a file. This is very easy and straightforward,
    but with it comes the disadvantage that we can only process sequentially, as discussed
    earlier. Apart from streams and readers there is another way to access a file.
    This method allows random access, which means you can specify exactly at what
    position in the file you want to read or write data. This allows another kind
    of concordancing, which requires some initial preparation by building an index,
    but in this section we will first look at the concept of retrieving words from
    an index, and then we will implement a concordancer that makes use of it. This
    will necessarily involve some overheads which might make it look too complicated
    with small amounts of data, but the general idea can be applied to very large
    corpora as well. In fact, the larger the corpus the greater the efficiency when
    using an index.


    # 6.4.1 Indexing


    The stream-based concordancer had to process the whole text every time it was
    looking for occurrences of a word. It didn''t know how many hits there would be,
    and could not stop searching once they had been retrieved. It could skip portions
    of the text that did not contain any hits, as their distribution was unknown.
    This is not a problem as long as the length of the text is reasonably small, as
    it can be quickly searched or slower. And, each search takes exactly the same
    amount of time, regardless of the number of hits found. You can see this when
    looking at the timings'
