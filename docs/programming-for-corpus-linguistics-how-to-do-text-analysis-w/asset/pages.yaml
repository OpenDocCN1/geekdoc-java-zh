  md: '# SYSTEM DESIGN


    whitespace followed by the frequency value. Most frequency lists will already
    be in that format. For a more detailed description of the class see chapter 7.


    # 11.1.3 Evaluation Function


    Barnbrook (1996) describes three possible ways to evaluate the frequencies we
    extracted from the environment: z-score, t-score, and mutual information. We will
    implement all of them, so that you can compare the resulting scores. The scores
    all require the same parameters: the frequencies of the collocate in the environment
    of the node and in the benchmark list, and the number of tokens of both environment
    and reference list. The latter are used to compute the relative frequencies which
    are used for comparison.


    # 11.2 SYSTEM DESIGN


    Starting at the end, the resulting output of the system should be a list of collocates
    with their respective scores as computed by the evaluation functions. We therefore
    need some object to hold a word and the three scores, which we will call Collocate.
    Objects of this class will be created during the process, so we need accessor
    methods to read out the scores. This will also be relevant for sorting.


    As we saw above, the algorithm to compute collocates involves counting the frequencies
    of words in the neighbourhood of the node word. The input data to procedure is
    a set of concordance lines and the size of the span. We create a frequency list
    from which we will then compare with the general frequency list. The input data
    will be lines, which will need to be split into tokens. For this we will use a
    Span class which will take a concordance line and prepare it for access by ''slot'',
    the distance to the node. This can be illustrated as follows:


    | -4 -3 -2 -1 NODE +1 +2 +3 +4 +5 |

    | accessing tasks, as creating word lists, computing parameters of a te |


    We would have enough context for a span of up to 4 words on the left and five
    on the right. The first and last word is ignored, as it could be truncated, even
    though it could happen to be complete in the actual.


    The ''collocation engine'' will travel through all lines and convert them into
    tokens using the Span class. This then used to retrieve the words from within
    the span we are looking at, in order to count the frequencies of the collocates.
    We already have a suitable class in Flist, which was introduced earlier, so we
    can simply reuse that class. All we need is to design a class which performs the
    necessary operations, ''engine''.


    The Collocator class will coordinate the activities involved in the whole process:


    +   1. tokenise the concordance lines.

    2. count the collocate frequencies.

    3. compare them with the benchmark.

    4. generate the output.'
