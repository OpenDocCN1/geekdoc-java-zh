    # 5.4 OTHER USEFUL CLASSES


    In this section we will look at those classes of the standard Java class library
    which will be likely to use most often. It has to be brief, but remember that
    you can always have a closer look in detail by studying the on-line API documentation.
    Once you have an idea what a class is good for and how you can use it, the API
    documentation enables you to make the best use of it.


    The classes in this section have to do with data structures. A data structure
    is a container that you can use to store objects. One important thing is that
    only objects can be stored: to store primitive values you must use wrapper classes.
    So, in order to store a set of int values (e.g word frequencies), you would have
    to create Integer objects from them, which you can then store. The only exception
    to this is an array, which we will come to.


    # 5.4.1 Container Classes


    Suppose you want to collect the word frequencies of a text: as you read each word
    you will have to look up often it has occurred so far, and increment its frequency
    by one, adding it to the list if it is a new. You cannot do that with just string
    and integer variables, as you do not know how many words you need to store, and
    it would be impractical to compare one variable to a large set of other variables,
    as you would have to spell all that out explicitly in the program code of what
    is likely to be a huge program. In fact, everytime you manipulate data you do
    need somewhere to store the results of intermediate processing, like the current
    number of occurrences of a word, or probability scores for a set of word class
    tags'
