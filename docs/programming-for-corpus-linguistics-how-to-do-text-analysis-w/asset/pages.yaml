  md: '# 8


    # Dealing with Annotations


    # 8.1 INTRODUCTION


    In chapter 3 we discussed the background of annotations, and we mentioned there
    that XML should be used as the format for marking your data, as it is becoming
    a standard. In this chapter we will first look at XML in a bit more detail, and
    then we will see how we can process it. Without the right software tools at hand
    it is rather awkward, but once you have cracked this, you will quickly see how
    powerful XML mark-up can be.


    We will stick to a subset of XML, as its full specification is still changing.
    However, the basic structures as described here are unlikely to be changed, and
    they are sufficient for encoding most annotations you will come across.


    # 8.2 WHAT IS XML?


    XML is a recent attempt to make SGML more popular and usable. It is basically
    a cut-down version of SGML, with an emphasis on ease of processing. SGML allows
    a number of short-cuts in the mark-up itself, but the drawback of this is that
    an SGML parser needs to be able to expand those short-cuts in order to make sense
    of the document. This would require a document type descriptor to work out which
    shortcuts have been taken. For example, it is perfectly permissible in an SGML
    document to leave out tags, the parser will know when an element has to stop.
    In the BNC, a word is enclosed in a <w> tags in SGML are not case-sensitive, unlike
    XML). From the formal description of the mark-up scheme for the BNC parser knows
    that a <w> can only contain character data, and no other tags. If the parser encounters
    another tag after an opening <w>, it knows to insert a closing </w>. In other
    words, the sequence


    ```

    <w> This <w> is <w> a <w> short <w> sample <w> text

    ```


    the tag between This and cannot be within the scope of the original <w> tag, and
    the parser implicitly adds a closing tag, so that the sequence in fact reads (as
    it would in XML):


    ```

    <w>This</w> <w>is</w> <w>a</w> <w>short</w> <w>sample</w> <w>text</w>

    ```'
