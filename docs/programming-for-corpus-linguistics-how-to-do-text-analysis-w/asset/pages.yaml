  md: '180


    STEMMING


    This might serve as a first step for creating a grouped word list, as it removes
    inflection endings, as well as derivational suffixes. As the program does not
    contain any language components apart from the rule it can easily be adopted to
    other languages as well, provided we use suffixes only for derivations.


    # 9.2 PROGRAM DESIGN


    Summarising the algorithm is quite simple: for each word we are dealing with we
    traverse the list of rules, testing each rule it applies to the input word. Once
    a match has been found, we ‘advise’ then ‘execute’, which means we take the suffix
    off the word and append the replacement if it is one. Afterwards we interpret
    the transfer: we continue until another rule or stop the whole process.


    As an example we will have a look at the first:


    +   - ably IS


    This rule deals with the suffix ‘ably’ in words like ‘reasonably’. Here it would
    remove the suffix, as the replacement is empty (as indicated by the dash). This
    results in ‘reason’. Then we jump to the rule whose label is ‘IS’ and continue
    processing. For our example word would be the end, but e.g. ‘adviously’ would
    have been reduced to ‘first’ and then ‘adv’. If the word would not end in ‘ably’,
    the rule would be skipped and proceeding continue with the second rule.


    When designing the program, we first need to think what kind of objects we are
    dealing with. The most basic object, which we will be using as a starting point,
    is a rule. A rule consists of four elements, the first three which are optional:
    label, suffix, replacement and transfer. The label is used for skipping rules
    during the processing of the list of rules, the suffix determines whether a rule
    fires, and the replacement specifies what a matching suffix is to be replaced.
    All can be empty; only the transfer part describes what action is being taken
    after a rule has been found, compulsory.


    Then we need to initialise the rules however. In order to allow different sets
    of rules to be used, and make it easier to modify rules, we will be reading the
    rules from a text file. This could be done within the same class as the rule definition,
    but in this example the rule loader is kept in a separate class. On one hand this
    introduces two classes with a tight coupling, the rule loader needs to interact
    with the rule objects it is creating from the data file, and this interdependency
    is generally not a good thing. On the other hand, rules could be loaded from different
    sources, like files, networked servers, user input, or even automatically generated
    from another program. This would be an argument in favour of keeping the polarisation
    from the rule itself. Furthermore, the specification of a rule is unlikely to
    change, and any major change of its interface would need to be reflected in all
    other classes anyway. With the present design we keep the classes small and uncluttered
    and organised by functionality.


    The final class we need is the main processor, which is often called the engine.
    Our stemming engine does all the actual work, initialising the rules at startup,
    then waiting for input words to come in which will will be subjected to the rules.
    As we have delegated the initialisation to the rule loader, and all the low level'
