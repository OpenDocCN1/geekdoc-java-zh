  md: '# 9


    # Stemming


    In this section we take a look at implementing a stemmer as described in Oakes
    (1998). Starting from a brief description we will see what it takes to turn a
    table of production rules into a working program.


    # 9.1 INTRODUCTION


    Table 10 of Oakes (1998) lists a set of rules used by Paice (1977) for implementing
    a stemmer. A stemmer is a program that reduces word forms to a canonical form,
    almost like a lemmatiser. The main difference is that a lemmatiser will only take
    inflectional endings off, effectively resulting in a verb''s or the singular of
    a noun. A stemmer on the other hand tries to remove derivational suffixes as well,
    and the resulting string of characters might not always be a real word. Stemmers
    are mainly used for information retrieval, where able and ability should be identical
    for indexing purposes, whereas most linguists would not consider them part of
    the same inflectional paradigm.


    There is a further advantage of stemmers: a requirement to produce proper words
    with the need for a way to recognise them, but a stemmer can do without. This
    means that a lemmatiser usually consists of a set of reductions with a dictionary
    to check for the correctness of the result, while for a stemmer a set of rules
    is sufficient. This are in general not only smaller in size, but also much faster.


    The most widespread stemmers in use are based on an algorithm by Porter (1980),
    which is quite sophisticated and therefore not as easy to implement as one of
    Porter (1977). However, the basic principles are the same, the major difference
    being that Porter''s algorithm applies a number of tests on the input word before
    executing a rule, Paice''s applies a rule as soon as a matching suffix has been
    found.


    Looking at the list of rules there is one major point to notice: as the matching
    suffix fixes a replacement rule, the order in which the rules are processed is
    quite important. Consider the case of -ied and -ed. Both rules match the word
    but the first one accounts for more characters, reducing correctly to testify,
    while the second is an ''incomplete'' when looking at the full picture, as it
    leads to the undesirable testifi. It is therefore important that the longer rule
    is applied first; this mode of matching patterns is called longest-matching.


    The stemming program that we are about to write will now take a word, all possible
    rules to it, and will output a canonical representation of the input word.'
