    # THE JAVA CLASS LIBRARY


    There is also a method to test multiple objects, containsAll(), which works in
    the same way.


    Two methods allow you to look at the extent of a collection: size() returns the
    number of elements it contains, and isEmpty() returns true if the collection is
    empty, and false if it is not.


    Several methods allow you to perform set operations on collections, provided they
    support the retrieve operations: addAll() forms the union of collections, removeAll()
    subtracts one from the other, and retainAll() forms the intersection, it returns
    all elements which are not in the collection which is passed as a parameter.


    The legacy Vector and Hashtable allowed you to walk through their elements (keys)
    using the Enumeration interface. The equivalent method of access in the collections
    framework is through iterators (see below). The method iterator() returns such
    an object which allows sequential access to all elements of the collection.


    The Collection interface specifies what operations a data structure supports.
    We will now look at three interfaces which describe the properties of data structures:
    Set, List, and Map. As interfaces contain only methods and possibly constant declarations,
    the properties can only be described indirectly, which makes it rather hard to
    work things out from the API.


    # 5.5.3 Set


    | Comparator | comparator(); |

    |---|---|

    | Object | first(); |

    | SortedSet | headSet(Object toObj) |

    | Object | last(); |

    | SortedSet | subSet(Object fromObj, Object toObj); |

    | SortedSet | tailSet(Object fromObj); |


    Table 5.14: Methods of SortedSet


    A Set is a collection that does not contain any duplicate elements. The interface
    itself does not contain any methods other than those in Collection. There is a
    rather useful subtype, a SortedSet, which provides a few additional methods. These
    methods are listed in table 5.14.


    There are two classes in the collection framework that implement the Set interface:
    HashSet and TreeSet. A HashSet is like a Hashtable with key and value being one
    and the same object, it allows very fast retrieval but the elements are in no
    particular order. The TreeSet is a bit slower to de to access, but being a SortedSet
    it maintains a natural order among its elements. This is very useful if you want
    to have an alphabetically sorted list of word types, for example.'
