    # 2.2 CONTROL FLOW


    When you read a text, start at the beginning and proceed along each line until
    you get to the end, unless you case references as footnotes or literature references.
    In those cases you ''jump'' to the place where the footnote is printed, and you
    resume reading at the place where you had stopped reading before. This is essentially
    the same way that the computer will go through your program. However, there are
    also lines in the listings we looked at in section 2.2 that indicate negation
    (while there are more words) and branching (if word is in list). Such statements
    are directing the flow of control through the program, and are very important
    for understanding the way the computer executes it. In this section we will discuss
    in greater detail how control flow is such an important concept in programming.


    In order to keep track of which commands to execute the computer needs a pointer
    to the current position within the program, just as you need to keep track of
    where you are in a text you are reading. This position marker is the program counter
    and it stores the address of the next instruction to be executed. It has an auxiliary
    storage to case it temporarily to jump to another position, looking like a footnote
    in an article. It stores the current value of the program counter in a separate
    place and then loads it with the address of the ''footnote''. When the end of
    the footnote is reached, an end-marker notifies the processor to reload the old
    value from the temporary space back into the program counter, and execution resumes
    where it was interrupted.


    In a program we will make use of several ways to direct the control flow. You
    may remember the some called Interactive Fiction books, which were a kind of fantasy
    role-playing game for one. It was a collection of numbered graphs, and things
    would happen that they tell you to continue from. You ''fight'' against an ogre
    by throwing a die, and depending on the outcome you win or lose. The last lines
