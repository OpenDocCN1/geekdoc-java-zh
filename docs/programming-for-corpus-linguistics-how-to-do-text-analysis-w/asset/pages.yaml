  md: "# TESTING 225\n\n# 11.3.5 The Utility Class\n\nBefore we actually run the application,\
    \ one more class needs to be described, Utility. This class has the same function\
    \ as the Math class, to be a collection of useful routines which do not really\
    \ fit anywhere else and are not related in any way. You can easily add more methods\
    \ to such a class, but they all should be static, so that you never need an actual\
    \ instance of this class.\n\nThis class has at present just one method, which\
    \ reads a text file and returns it in an array of Strings, one per line. This\
    \ is used to load the concordance lines from an external file.\n\n```\n/*\n* Utility.java.*;\n\
    */\n\nimport java.io.*;\nimport java.util.*;\n\npublic class Utility {\n    public\
    \ static String[] readFile(String filename)\n    throws IOException {\n      \
    \  BufferedReader br = new BufferedReader(new FileReader(filename));\n       \
    \ Vector<String> v = new Vector();\n        String line = br.readLine();\n   \
    \     while (line != null) {\n            v.addElement(line);\n            line\
    \ = br.readLine();\n        }\n        String[] retval() = new String[v.size()];\n\
    \        v.copyInto(retval);\n        return(retval);\n    }\n}\n\n// end of class\
    \ Utility\n```\n\nThe method does not require any objects, so we can declare it\
    \ static. At first we create a BufferedReader for the file that we want to read,\
    \ and a Vector for storing the lines. As we don't initially how many lines there\
    \ are going to be we will need a dynamic structure which can grow if its capacity\
    \ is exceeded. We then fill the vector with the lines we're reading, and once\
    \ we have finished reading (which is when line will become null) we convert the\
    \ Vector into an array. This is similar to how we converted the vector of Collocate\
    \ objects to an array in the Collocator class above.\n\n# 11.4 TESTING\n\nAs mentioned,\
    \ setting the Collocator application is a bit more complicated than with previous\
    \ applications. For this run we assume that you have a sample text available that\
    \ you can use; stay with the example of Barnbrook (1996) you might want to download\
    \ the text of Frankenstein from the Gutenberg Project (for the address see section\
    \ 12.2). At the time of writing the last release was labelled 'frank13'. The actual\
    \ filename is 'frank13.txt'."
