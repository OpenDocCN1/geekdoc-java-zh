    BASIC CORPUS CONCEPTS


    with no annotations, stored in a single file on the computer''s hard disk. However,
    if you decide to add annotations to any data you are collecting, it is worth using
    XML as the mark-up format. One of the sample applications we will be looking at
    in the final part of this book will allow you to process such data.


    # 3.3.3 Error Correction


    Another point is worth mentioning in connection with mark-up: it is unavoidable
    that there will be typographical errors in a corpus, as all methods to enter data
    are prone to the introduction of glitches. Whether there is a smudge on the page
    that is scanned, or just a momentary lapse of the keyboard, errors will always
    creep in. Unless the amounts of data involved are very small, it is generally
    not worth correcting, as so much time is spent on which, could probably be used
    for more productive tasks. Furthermore, sending the data through a spell checker
    is not guaranteed to make it any better, as rare words could not be recognised
    and changed, while other errors might happen to coincide with the spelling of
    other, correct words and remain uncorrected.


    There is, however, a kind of error which should be corrected, namely faulty mark-up.
    Unlike natural language, mark-up has a strict grammar, which can easily be checked
    automatically. So a simple computer program (like the one we will develop in chapter
    8 ) can tell you there are any inconsistencies, and more importantly where they
    are. However, this applies only to the syntactic correctness, as the computer
    cannot check whether the mark-up has been applied correctly on the semantic level.


    # 3.4 COMMON OPERATIONS


    In this section we will investigate some of the basic operations which are usually
    applied to corpus data. These operations will later be implemented in Java, so
    it is important that you have an idea of how they work, and what they can be used
    for. All of them are described in more detail in the accompanying books of the
    series, namely McNery and Wilson (1996) and Barnbrook (1996), with the latter
    having an emphasis on how they can be used in linguistic research.


    # 3.4.1 Word Lists


    A word list is basically a list of all words of a text, ordered by some criterion.
    The most common form is that of a word-frequency list, where the words are sorted
    in descending order of frequency, so that the most common words are at the top
    of the list, and the rare ones at the bottom.


    A frequency-list can give you an idea of what a text is: if it is a first-person
    narrative, you would expect to see a lot of occurrences of the personal pronoun
    ''I'', and certain other used words might reflect what the text is actually about.
    They can also be used to compare different texts by working out which words are
    more frequently used in one text than another.'
