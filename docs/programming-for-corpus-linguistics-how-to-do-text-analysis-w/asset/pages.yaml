    In this chapter we have learned what algorithms are, namely formalised descriptions
    of how things are done. The level of formality of an algorithm is quite arbitrary,
    which can be used to guide the software development process: starting from a very
    informal and imprecise outline we gradually go into more detail using more and
    more formal elements until we reach the level of the programming language.


    Individual statements can be combined into blocks and the way the computer executes
    them can be commanded using branching and loops. This control flow allows the
    computer to repeat operations multiple times and make decisions based on boolean
    expressions.


    A program consists of both instructions and data. Variables and constants are
    named labels which can be used to store and retrieve individual variables. Larger
    numbers of variables can be stored in container classes within the computer''s
    memory or external data files on the hard disk.


    At the end of the chapter we discussed the different properties of internal and
    external storage media: internal memory is faster to access, but more limited
    in size, whereas external storage is slower but there is far more of it, and it
    keeps information even if there is no electrical power available.'
  merge: -1
