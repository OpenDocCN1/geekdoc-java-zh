    anything\");\n\nif (word.equals(\"something\")) {\n  }\n```\n\nwithout comparing\
    \ the return value to some pre-defined value.\n\nUnlike equals(), the method compareTo()\
    \ (and the corresponding non-sensitive variant, compareToIgnoreCase()) returns\
    \ an int value. This is because it evaluates the sorting order of two strings,\
    \ and there are three possible options (before, after, same) which are too many\
    \ to represent as boolean values. The return value is negative if the current\
    \ object (on which the method is invoked) comes before the other object (the parameter)\
    \ in lexicographical order, and if it comes after it. Methods return 0 if the\
    \ strings are equal, i.e. if the equals() method would return true.\n\nIf you\
    \ look at the full API documentation of the String class, you will notice that\
    \ there is another form of the compareTo() method, which takes an Object as its\
    \ parameter, just like the equals() method. This method exists because the String\
    \ class implements an interface Comparable (which specifies just one method, compareTo());\
    \ By implementing that interface a fixed sorting order is defined, which means\
    \ you can use strings in sorted collections (see below) without any further effort\
    \ on your part. Again, the Comparable interface is general and thus can only specify\
    \ Object as its parameter, as it can be implemented by any class.\n\n# Comparing\
