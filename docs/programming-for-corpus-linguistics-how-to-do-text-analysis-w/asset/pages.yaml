    # 6.3 Limitations & Problems


    In the previous section we have seen that it is relatively easy to produce specialised
    readers which can be used in other programs like the built-in streams and readers.
    For a lot of applications these classes will be sufficient, though they are not
    particularly optimised. However, when you look at the timing of the two concordance
    reader classes, you will notice that producing a set of concordance lines from
    a text always takes approximately the same amount of time, regardless of the node
    word we are looking for.'
