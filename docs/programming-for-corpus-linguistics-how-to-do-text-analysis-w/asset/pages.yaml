  md: '# 11


    # # Collocation Analysis


    This chapter shows how to implement the facilities described in Language and Computers,
    chapter 5. There, Barnbrook describes in detail how to compute collocations.


    # ## 11.1 INTRODUCTION


    Colocational analysis attempts to identify words that occur together significantly
    more often than one would expect by pure chance. These word pairs then form what
    is called a collocation. Collocations can be the result of a number of different
    linguistic processes which influence the combinatorial arrangement of words; these
    processes can be syntactic, semantic, or even prosodic.


    The one way to identify collocations is by looking at the frequency of words in
    the environment of the node word. If a potential candidate for a collocation,
    sometimes called a collocate, has a particularly high frequency in this environment,
    we can assume that the two words form a collocation. This involves comparing the
    frequency of a word in the node''s environment with a benchmark frequency. The
    benchmark can be a general word frequency list, or if none is available we can
    simply take the frequency of the word in the corpus we are investigating. However,
    in that case the frequencies are not independent of each other, which might skew
    the results.


    The significance of a node-collocate pair is evaluated using a mathematical formula,
    the evaluation function. There are a number of different ways to do that, and
    consequently there are about a dozen formulae in use, each producing slightly
    different results. The most common ones are the z-score, the t-score, and mutual
    information. The first two are based on general statistics, while mutual information
    originates from information theory. It is very difficult to say that one is better
    than the other, so the best way to get familiar with them is to simply try them
    on a number of words. This will quickly give you an idea of what you can expect
    from each collocation.


    The evaluation function assigns a score to each collocation, which indicates the
    strength of the bond between the node and the collocate. It is generally not possible
    to compare those scores directly with each other, so you should only use them
    for ranking the list of collocations. We will see later how a list of collocations
    can be sorted according to the different scores assigned to them.'
