  md: '# 5.4.6 Stack


    A Stack is a fairly simple data structure. You can put an object on top of the
    stack, and you can take the topmost element off it, but you cannot access any
    other of its elements (see 5.11). These actions are called ''push'' and ''pop''
    respectively. Despite this limited way of accessing elements it, a stack is a
    useful data structure for certain types of processing. In chapter 8 we will see
    how we can use a stack to keep track of matching pairs of mark-tags.


    ```

    Stack();

    push();

    pop();

    boolean empty();

    Object peek();

    ```


    Table 5.11: Frequently used methods from the Stack API


    The empty() method allows you to check whether there is anything on the Stack;
    if you try to pop() an element off an empty Stack, you get an EmptyStackException.
    The peek() method is a shortcut for:


    ```

    Object obj = myStack.pop();

    myStack.push(obj);

    ```


    It retrieves the topmost element of the Stack without actually removing it off
    the Stack.


    Here is a brief example of how a Stack can be used: first we push three String
    objects on a Stack, and then pop them off:


    ```

    Stack stack = new Stack();

    stack.push(''Stilton'');

    stack.push(''Cheddar'');

    stack.push(''Shropshire Blue'');

    String cheese = (String)stack.pop(); // cheese is ''Shropshire Blue''

    cheese = (String)stack.pop(); // cheese is ''Cheddar''

    cheese = (String)stack.pop(); // cheese is ''Stilton''

    ```


    As usual, we have to return the value of the pop() method to get the correct data
    type. This example illustrates that a stack is so-called LIFO (last in, first
    out) structure: the last item we put on the stack (''Shropshire Blue'') is the
    first one that we get when we take an element off. As we will see in chapter 8,
    this is ideally suited for processing nested and embedded structures.


    # 5.4.7 Enumeration


    An Enumeration is somewhat the odd one out in this section. It is not a data structure
    in itself, but rather an auxiliary type to provide access to the container classes
    we have just discussed. And, it is not even a class, but just an interface. The
    full API of the Enumeration is shown in table 5.12.'
