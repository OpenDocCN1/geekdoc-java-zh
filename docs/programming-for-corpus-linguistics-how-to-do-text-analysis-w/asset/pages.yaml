  md: '# INTRODUCTION TO BASIC PROGRAMMING CONCEPTS


    | data type | description | size (bytes) |

    |---|---|---|

    | byte | small number (-128 to 127) | 1 |

    | short | small number (-32768 to 32767) | 2 |

    | int | number (+/- 2 billion) | 4 |

    | long | large number | 8 |

    | float | floating-point number | 4 |

    | double | double precision floating point number | 8 |


    Table 2.2: Numerical data types in Java


    Unlike some programming languages, all numerical data types in Java are signed,
    which means they have a positive and a negative range. This effectively halves
    the range that would be available if there were only positive values, but is more
    useful for computing purposes. A single byte, for example, can store 256 different
    values. In Java this is mapped onto the range -127 to +128, so you still have
    the same amount of different values, only the maximum and minimum values are different.


    Most you will probably need int variables, mainly for counting words or properties
    of words. They have a range of about two thousand million either side of zero,
    which should be sufficient for most purposes. Floating-point variables should
    only be used when working with decimal places, such as probabilities, as they
    cannot represent large integer values without losing precision. A float has a
    precision of about 40 decimal places, whereas a double goes to about 310.


    # 2.3.2 Character Data


    A character is a symbol that is not interpreted as a numerical value. This includes
    letters and digits, and special symbols as punctuation marks and diagrams. The
    ability to process symbols is one important aspect that distinguishes a general
    computer from a pocket calculator, and one that is obviously relevant for corpus
    linguistics.


    Internally each character is represented by a number, its index in the character
    table. In order to allow the exchange of textual data between different computers
    there are standard mappings from characters to values. While mainframes usually
    work with the EBCDIC character table, most other machines use the ASCII character
    set. This defines 127 symbols, which includes control codes (e.g. line break and
    page break), the basic letters used in English, the digits, and punctuation. Often
    there are also extensions for regional characters to a maximum of 256 symbols
    (which is the maximum number of different values for a single byte). Java, however,
    uses the Unicode character set, which provides more than 65,000 characters, enough
    for most of the world''s alphabets. Single letters are represented by the char
    data type, while sequences of letters are represented by Strings:'
