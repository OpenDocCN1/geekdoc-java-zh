- pgno: 162
  md: '# WHAT IS XML?


    Also note that the attribute value has to be enclosed in quotes. This is not the
    case in SGML, where you can leave those quotes out, provided there are no spaces
    in them.


    Sometimes you have data which is a form that would interfere with the mark-up
    syntax. In HTML, for example, there is a `<pre>` tag which gives you an easy way
    to include a stretch of text that is preformatted and could possibly contain tags.
    Apart from the closing `</pre>` tag, all other tags are treated as data, not as
    mark-up. In XML the sequence `<CDATA[` introduces literal text, which is terminated
    by `]]`. In between these special tags you can have any sequence of characters,
    apart of course from the coding itself.


    Another special kind of tag is processing instructions. These are like empty tags
    in that they have no closing equivalent, and they are not part of the document
    itself. Instead they are to be ''passed through the application'', which will
    identify them by their name. Processing instructions look like


    ```

    < myApp restart ?>

    ```


    If your application receives a instruction from the parser, it can check whether
    it should react to it by checking the first part, and in this case the instruction
    ''restart'' is to be interpreted by a program called ''myApp'', any other programs
    processing that XML file simply ignore it.


    There is one restriction on the name, or target, of a processing instruction:
    it must not start with the ''xml'' in either lower, upper, or mixed case. These
    are reserved for XML-related declarations. In fact, an XML file should begin with
    the XML declaration, which looks like this


    ```

    <xml version="1.0"?>

    ```


    For the current version of XML. This at a later stage be to reject documents which
    contain a version of XML that is not supported by your software.


    Finally, there are comments. Comments are introduced by the sequence `<!--`, and
    they end with `-->`. They must not contain a double hyphen, of compatibility with
    earlier versions of markup. Apart from that they can contain anything else.


    That is about all we need to know XML in order to start using it. There are, however,
    several complex constructs, like conditional inclusion of parts of a document,
    or external entities (e.g. files) which might need to be included. Most of these
    do not really apply to corpus data, or at least should not concern us here. If
    you happen to come across such in your data, you can extend the programs described
    here, or you can simply choose a parser that supports full XML. There are a number
    of around, most of them written in Java, and often available for free.


    About the only thing we might want to use which we are not dealing with is entity
    declarations which define special characters. For example you have come across
    their notation, which is also used in HTML: an am, followed by a name, terminated
    by a semicolon; as in ''&aacute;'', which stands for the letter ''o'' with an
    acute accent on top. A full XML processor would translate that expression into
    a single character code representing the correct letter.'
