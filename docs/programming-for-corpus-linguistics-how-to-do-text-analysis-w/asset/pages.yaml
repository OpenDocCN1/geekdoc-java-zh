    This was seen by some that the ‘write once run anywhere’ philosophy of Java was
    flawed. However, these problems have been successfully solved by using a more
    low-level approach, where only the basic operations are managed by the host system,
    and everything else is allowed by Java. So, buttons behave the same on all platforms,
