  md: '# CONTROL FLOW


    # 19


    Computer programs are a like that. Depending on outside influences the computer
    takes different paths through a program, and there are several ways of changing
    the flow of control. We will now discuss three of them in more detail: sequence,
    choice, and loop.


    # 2.2.1 Sequence


    This is the general way in which a program is executed, in sequence. Starting
    at the first instruction, the program counter is simply incremented to point to
    the next instruction and most instructions will not actually influence the program
    counter. A sequence is like reading a book from start to finish without ever going
    backwards or skipping parts of it.


    Even though it is the default, a program cannot do much if the strength of a computer
    is its speed, and that be be exploited by making it perform some repeatedly. For
    this we need others, which we will look at below.


    The expressiveness of a purely sequential flow is fairly limited; a pocket calculator
    that can perform mathematical operations, but cannot react to the result in any
    way. Any algorithm that is more complex than that will require a more differentiated
    control flow.


    Before discussing the ways of directing the control flow, there is one other concept
    that we need to know about, the block. A block is a sequence of statements grouped
    together that are syntactically equivalent to a single statement. In the previous
    example we had a block at the end:


    ```

    11 for all words in list

    12 reverse word

    13 print word

    ```


    The two lines are a block, and in pseudo-code they are grouped together by being
    at the same level of indentation. In a Java program, and in a number of other
    languages, blocks are delimited by curly brackets. The reason for having blocks
    is so that the computer can determine the scope of certain commands; otherwise,
    how should it know that the print statement is also to be executed for each word?
    By putting those two statements into a block it becomes clear immediately. We
    will see more examples where blocks are essential in the following sections.


    # 2.2.2 Choice


    If there was only sequential execution, each time a computer program was run it
    would basically be the same as before. Variation can be introduced through another
    type of control flow, the choice. Here the processor evaluates a condition, and
    depending on the result branches into one of two or more alternatives. The simple
    alternative is expressed in abstract form as IF X THEN ELSE B X is the condition
    to be evaluated, and A and B are the two alternative blocks of statements. The
    condition X must be a boolean expression, i.e. it evaluates to true or false.
    If X is true, then it is block A gets gets, otherwise it is block B.


