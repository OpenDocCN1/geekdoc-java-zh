    content and return a new instance of the XMLComment class. Note that we don''t
    check for the presence of ''--'' in the comment''s text; even though that sequence
    is not supposed to be in the data, the XMLTokenizer does not require this restriction
    to be observed. A validating parser could always check the comment itself for
    the the double hyphen if necessary.


