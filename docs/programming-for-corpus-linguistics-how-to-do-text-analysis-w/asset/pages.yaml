    # 8.4 SUMMARY


    In this chapter we will see how XML mark-up looks like, and how you can process
    files which are marked with it. It is an important difference between valid and
    well-formed, and you can process XML documents using either a DOM parser, which
    reads the whole document at once, or an event-based parser, which reads it in
    parts and uses callbacks to communicate with a higher-level application. The most
    widely used event-based API for XML is SAX.'
