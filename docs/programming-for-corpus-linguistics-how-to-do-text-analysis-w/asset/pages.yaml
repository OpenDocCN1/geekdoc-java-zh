    The main question for you now is which of the two models you should use when dealing
    with corpora marked up in XML. While DOM allows you to access and manipulate any
    part of a document, it has one big drawback for corpus processing: the whole tree
    needs to be in the computer''s memory at the same time. When working with smallish
    texts that might not be a problem, but as soon as you look at larger amounts of
    data (and structural information if it is annotated in detail) you will quickly
    reach the limits of your machine''s memory. And that is for storing the text,
    without having any further processing on.


    One possible solution is to store parts of the tree that you are not currently
    accessing in a file, and swap them in and out of memory as you need. This seems
    hugely complicated if all you want to do is a bit of concordance. If you are processing
    the data in sequential order, then SAX is far easier to use and more efficient
    with your available resources as well.


    # 8.3.2 An XML Tokenizer


    In this section we will have a look at how an XML tokenizer can be implemented.
    It is important that you have understood the (informal) description of the XML
    format above, as we will refer to throughout this section. There are a few things
    that will not be covered by this tokenizer, namely some of the complex aspects
    of XML. This includes the document type description (DTD). We are assuming that
    your input files contain valid XML already, and so will not require processing
    DTDs.


    As the tokenizer consists of several classes, we create a package to keep them
    separate from other files. To keep it simple we are naming it xml, which is good
    enough to organize your source files here. If you ever want to distribute classes
    you''ve written, it will not be enough, and you will need to choose a more specific
    package name. The suggested name of a package is determined by the domain name
    of the developer''s computer; I am using working on a machine in the domain bham.ac.uk,
    so my packages should start uk.ac.bham, alternatively, for the examples in this
    book I could have chosen something like uk.ac.ed.dup.javabook. You can see that
    these are rather clumsy, but that''s the price you have to pay for being specific.
    If you''re stuck for a name, just use your reversed email address.


