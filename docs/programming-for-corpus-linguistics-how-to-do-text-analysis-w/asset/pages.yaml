    \ the text, and similarly we will need to pad out the end of the input data with\
    \ spaces to have a full right context if it happens to be the last word. Otherwise\
    \ we would have a section of the line in an undefined state, so we effectively\
    \ embed the text in blank lines to fill these gaps. We will have to make provisions\
    \ to pretend that there is another set of spaces available once the physical end\
    \ of the input data has been reached.\n\n![](img/c394310805c2e60720e6e9e923804321_113_0.png)\n\
    \nFigure 6.2: A plain buffer before and after the shift\n\nThe straightforward\
    \ way of filling a buffer (which is a window over the stream of text) is to move\
    \ its content to the left by one character, read in the next character from the\
    \ input text, and place it into the slot at the far right which has been vacated\
    \ by the left shift, as illustrated in figure 6.2. Here you can see the buffer\
    \ before and after the shift; while the 'T' at the beginning of the buffer has\
    \ been dropped, a full stop has been added to the end of the buffer, and all other\
    \ characters have shifted one to the left. This is the way we will implement it\
    \ first, but it is rather inefficient, as it involves a lot of moving characters\
    \ around. Therefore we will also implement a different, more complex but much\
    \ faster version, using a ring buffer. With a ring buffer, instead of moving the\
    \ content, you move the beginning and end, which are kept variable. It is called\
    \ a ring buffer, as you can imagine the ends being put together, like a paper\
    \ strip that has been round and glued together at its ends. This involves a bit\
    \ more housekeeping, but we will compare the performance of the two approaches\
    \ afterwards and will see that it is well worth the extra effort.\n\n# Straightforward\
    \ Buffer Approach\n\nAs the basis for our ConcordanceReader we use a BufferedReader.\
    \ Not only do we get the benefit of its performance improvement, but we can simply\
    \ overwrite the readLine() method which in our new class will not return a line\
    \ from the input data, but a matching content instead.\n\n```\n/\n * ConcordanceReader.java\n\
    \ */\nimport java.io.*;\nnpublic class ConcordanceReader\n```"
