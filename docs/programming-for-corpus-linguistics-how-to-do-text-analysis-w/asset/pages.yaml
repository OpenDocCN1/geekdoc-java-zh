- pgno: 234
  md: '# 12


    # Appendix


    # 12.1 A LIST OF JAVA KEYWORDS


    Java has a set of reserved keywords, which you cannot use as variable names. Some
    of these are fairly obvious, like if, while others (like goto) are not yet used
    but merely reserved for possible use. To spare you from wondering why your program
    doesn''t compile for no apparent reason when you called one of your variables
    operator, here is a list of the reserved words:


    | abstract | else | int | static |

    | boolean | interface | super |

    | break | false | long | switch |

    | byte | final | native | synchronized |

    | byvalue | new | this |

    | case | null | throw |

    | cast | for | operator | throws |

    | catch | future | outer | transient |

    | char | generic | package | true |

    | class | goto | private | try |

    | const | protected | var |

    | continue | implements | public | void |

    | default | import | rest | volatile |

    | do | inner | return | while |

    | double | instanceof | short |


    Table 12.1 contains a list of websites which contain useful resources for corpus
    work. Obviously, the Internet is a very volatile entity, with such disappearing,
    addresses, and new sites coming up at a rate much higher than revised editions
    of this book will be published. For that reason, some of the URLs listed here
    be no longer valid, even though they were at the time of writing.


    Your first resort when a link doesn''t work should be to search for the name or
    title of that resource on your engine of choice. It is quite likely that you might
    pick up another link to the resource which still works, or even that you get hold
    of the resource''s address directly.


    # 12.3 RINGCONCORDANCEREADER


    In this section you will find the listing of the RingConcordanceReader class,
    which was not printed in full in chapter 6.'
