    # 5.4.5 Properties


    The Properties class (see table 5.10) is an extension of the Hashtable, which
    is more specialised as to the keys and values you can store. In a Hashtable there
    are no restrictions, so you can use any kind of object you want as either keys
    or values. In a Properties object you can only use Strings, but there are some
    mechanisms which allow you to provide default values in case a key''s not found
    in the Properties object: you can specify another Properties object which contains
    default values, so that you can override certain properties and the values of
    others, or you can directly supply a default when trying to retrieve the attribute.
    This attribute is illustrated in the following code snippet:


    ```

    Properties classTable = new Properties(basicLexicon);

    classTable.setProperty("koala", "noun");

    String wclass1 = classTable.getProperty("koala");

    // wclass1 is now "noun"

    String wclass2 = classTable.getProperty("aardvark", "unknown");

    // wclass2 is now "unknown"

    ```


    We create a Properties object called classTable, in which we want to store words
    with their associated classes. We define a default class called basicLexicon,
    another Properties object which would have to be defined elsewhere. We then add
    it to the key-value pair ''koala'' and ''noun'', and after that we try to retrieve
    the value for ''koala''. Since we have just entered it, we will get the same result
    back, but if we hadn''t done that the system would look up ''koala'' in the basicLexicon,
    and return the value stored there if was one. If the attribute was in neither
    classTable nor basicLexicon then the value null would be returned.


    We also look up ''aardvark'', and this time we provide a default value directly
    in the method call. If it fails, instead of returning null it returns ''unknown'',
    the default we supplied.'
