  md: "Using this version we implement a ‘pre-tokenizer’ which can handle some of\
    \ the ambiguities that we mentioned before. In order to avoid splitting numbers\
    \ and contractions, we treat the comma, the full stop, the hyphen, and the apostrophe\
    \ differently from other punctuation marks; they are only treated as delimiters\
    \ if they are followed by white space. The apostrophe still leaves some unresolved\
    \ problems, as it could be used as an opening single quote, but this requires\
    \ more effort to disambiguate than one would usually want to spend on it.\n\n\
    The pre-tokenizer takes a string and splits all tokens by white space, so that\
    \ we can process it again with an ordinary StringTokenizer to extract the tokens.\
    \ Alternatively we could combine the two steps, but it is easier to start off\
    \ with implementing them separately.\n\n```\n/*\n * PreTokenizer.java\n */\nimport\
    \ java.util.StringTokenizer;\n\npublic class PreTokenizer {\n    public static\
    \ final String PUNCT = \"*!\\\\$\\\\\\u00a3%%&*(){\\[\\];:,+=;/?,.\\t\\n\";n \
