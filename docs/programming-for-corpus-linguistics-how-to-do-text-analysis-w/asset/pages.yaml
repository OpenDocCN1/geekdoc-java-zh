  md: 'so you can have more confidence in the result. However, the difference in speed
    can mean that some operations are not really feasible unless they are optimised.


    When you are starting to program, speed is not a priority. Instead, it is more
    important to have programs that are working correctly and produce the right results.
    It is also worth thinking about measures to improve the speed once this has been
    achieved. Sometimes even small changes will have a large effect, for example choosing
    buffered classes for I/O operations, and sometimes you need to change a data structure
    (like using a ring buffer instead of a plain buffer). For a more detailed discussion
    on speed issues, see Bulka (2000).


    In all cases it is useful to encapsulate access to underlying data structures
    as much as possible. Using interfaces of concrete classes separates the concept
    from the implementation, and you can easily swap a hashtable for a tree and see
    if performance increases, without having to change much than a single line of
    code. Ideally you can change back if there was no perceptible gain in performance.


    There are different layers of optimising a program, each with a certain potential
    of gain. The highest can be achieved on the higher levels, which means adjusting
    the algorithm. A bit of time spent thinking about a problem before you start designing
    the program can save you a lot of time in the long


    Sometimes a completely different approach will give you the best results, as you
    will see if you use the IndexedConcordancer. However, it requires more time for
    the initial set-up, so the performance gain comes at a cost. If you only want
    to do a single concordance of a corpus, the slower concordancers might be faster,
    and they do not require the generation of an index. There is no absolute solution
    to a programming problem; it always depends on the context.


