    # 1.2.2 Other Features of Java


    As mentioned before, Java has developed (and still is developing further) into
    a vast language with extensions for all kinds of areas. However, a lot of those
    will not be directly relevant for your purposes, and in this section we will touch
    on some features which had to be left out of this book, but might be relevant
    for your further work. If you want to learn more about those features, I suggest
    you get a general Java book, like Horton (1999).


    Throughout this list you will find one recurring theme, namely that system operations
    are generalised to a more abstract level which is then incorporated into the language.
    A lot of operations which need to access external hardware components (such as
    a graphics card, or a network adapter) or other software modules (such as a database)
    are specific to a certain machine or operating system. However, by creating an
    abstract layer they can be treated identically across platforms, with the Java
    run-time environment filling the gap between the common operations and the way
    they actually work on a given computer.


    # Graphics


    Graphics are another of Java''s strong points. Dealing with graphical output is
    very platform specific, which means there is no general support for it if your
    development needs to be portable. The developers of Java, however, have designed
    an abstract toolkit that handles graphical operations and renders them on the
    target platform. In the first version, this scheme suffered from deficiencies
    and subtle differences between the buttons and other elements in Windows and the
    X Window system on Unix, but the developers chose a slightly different approach
    which worked much better: instead of relying on the system to provide user interface
    widgets, the new toolkit (called Swing) only makes use of basic operations such
    as drawing lines and windows, and all widgets are realised by their primitives.


    By leaving aside the ''native'' devices, user interface is now truly consistent
    across all platforms, and it is possible to program sophisticated user interfaces
    in a portable way. There is a large number of components, from labels, buttons
    and checkboxes to complex structures such as tables and ready-made file choers.
    These work on both proper applications as well as adapters, even though there
    could be problems as browser implementations of Java always lag a bit and might
    not fully support Swing without needing an upgrade.


    # Databases


    Similar to graphical operations, all database-related functionality has also been
    abstracted into a generalised system, the so-called JDBC (Java Database Connectivity).
    Here the programmer has access to a set of standard operations to retrieve data
    from databases, regardless of what database is actually backing up the application.
    To provide compatibility there is a set of drivers which make those standardised
    operations onto the specific commands implemented by the database itself.


    Together with the portable graph environment this makes it easy to build graphical
    interfaces to database systems, which will continue to work when the'
