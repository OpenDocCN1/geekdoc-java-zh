    \ it into tokens. This is done separately for the left and right sides, in a separate\
    \ method called tokenize(). As we start right in the middle of the node, the first\
    \ token of the right side and the last token of the left side has to be ignored,\
    \ in fact, the first and last tokens of both sides have be discarded, as the respective\
    \ words would be truncated as well.\n\n```\nSpan(String line) {\n    int middle\
    \ = line.length() / 2;\n    right = tokenize(line.substring(middle));\n    left\
    \ = tokenize(line.substring(0,middle));\n}\n```\n\nIn the tokenize() method we\
    \ can greatly build upon previous efforts in tokenization. By using the PreTokenizer\
    \ class can be sure that our software will always have the same definition of\
    \ a token. For some reason we may want to change the PreTokenizer class, all classes\
    \ using it adopt the new behaviour without recompilation.\n\n```\nprivate String[]\n\
    tokenize(String line) {\n    StringTokenizer st = new StringTokenizer(PreTokenizer.tokenize(line));\n\
    \    String[] retrieval = new String[st.countTokens()-2];\n    String dummy =\
    \ st.nextToken();\n    for(int i = 0; i < retrieval.length; i++) {\n        retrieval[i]\
    \ = st.nextToken();\n    }\n    return retrieval;\n}\n```\n\nAs mentioned before,\
    \ we skip both the first and the last token of the string, as it might not be\
    \ a complete word. To do this we allocate words less than the number of available\
    \ words, and the first token before entering the loop in which we assign the valid\
    \ words to the retrieval array.\n\nThe getWord() retrieves a token from the span\
    \ to give to a given offset. This offset value will be negative for the left context\
    \ and positive for the right context. For an offset value of zero, null will be\
