  md: "THE STRINGTOKENIZER CLASS\n\nand for language research it is important that\
    \ you have complete control over the result. For this reason we will be looking\
    \ at how tokenisation can be done, so that you get an understanding of the issues\
    \ involved. \n\n# 7.2 THE STRINGTOKENIZER CLASS\n\nTokenisation is also an important\
    \ issue in other areas of computing, not only text processing. In fact, when you\
    \ write a Java program, the compiler analyses it and performs a tokenisation on\
    \ it, with tokens being variable names or Java keywords. Tokenising a programming\
    \ file is of course simpler, as there is less ambiguity in the punctuation compared\
    \ to natural language. Recognising the importance of general purpose tokenisation\
    \ in programming, the designers of Java included a useful class in the standard\
    \ library: the StringTokenizer (note the American spelling). In this section we\
    \ will look at the StringTokenizer in more detail.\n\n# 7.2.1 The StringTokenizer\
    \ API\n\nThe API of the StringTokenizer class is shown in table 7.1. You basically\
    \ have three options when constructing an instance of it. Whichever version you\
    \ choose you have to provide the source String, which contains the text that you\
    \ want to have tokenised.\n\n```\nTokenizer(String str);\nTokenizer(String str,\
    \ String delim);\nTokenizer(String str, String delim, boolean keepDelim);\ncountTokens();\n\
    boolean hasMoreElements();\nboolean hasMoreTokens();\nObject nextElement();\n\
    String nextToken();\nString nextToken(String delim);\n```\n\nTable 7.1: StringTokenizer\
    \ API\n\nBy default only spaces are taken as delimiters, which means for example\
    \ that punctuation marks would still be attached to the previous word. The next\
    \ variant allows you to specify which characters you want as delimiters. Here\
    \ you could for example specify commas, full stops, and other punctuation marks\
    \ in addition to white spaces (which you now have to explicitly yourself). However,\
    \ as delimiting characters are ignored in the tokenisation process you would lose\
    \ them, which generally is not what you want.\n\nThe most useful version for text\
    \ processing is the third option: here you could specify whether you want treat\
    \ delimiters as tokens, which means that you would get all the spaces and punctuation\
    \ marks specified in the second String parameter and you could decide for yourself\
    \ whether you would want to keep them or not."
