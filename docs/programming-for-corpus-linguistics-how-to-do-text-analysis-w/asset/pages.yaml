  md: 'of the two concordancers we developed in the previous section: even the faster
    ring buffer version still needs roughly the same time for each concordance it
    produces.


    In order to save time we go through the corpus and record all occurrences of each
    word type in a list. At the end of this process we effectively have a word list
    with a corpus position value for each occurrence of a word. We also have the number
    of occurrences of the word, which is the number of positions recorded for it.
    When we now look for a word we go to this list, and we know instantly it occurs
    and where in the data the occurrences are. We then go to these locations and retrieve
    enough context to produce a concordance line.


    The list with positions that we have created is called an index. The index will
    typically be rather large, and can be even larger than the original input file,
    but we will get almost instantaneous access to all occurrences of all words that
    are in the text.


    Some concord programs have more or sophisticated query languages, which allow
    precise descriptions of word patterns to be retrieved from the data. You can search
    for adjacent word pairs, word pairs with gaps in between, inflected forms or alterations
    and a lot of other combinations of items. Query languages are conceptually rather
    complicated, so we will restrict ourselves to retrieving single words only. In
    the end, all query languages look up individual words, and decompose more complex
    queries into single word index pickups. At the end of this section we will briefly
    sketch how this can be done.


    # 6.4.2 Creating the Index


    In order to create the index we need to record the position of each word in the
    text, so we have to pass through the data and extract the words, while at the
    same time keeping track of their positions in the file. To keep it simple, we
    split the process into several steps:


    +   1. create a list of words with their positions in the text

    2. collate all the positions of each word in a separate list

    3. write the positions into the index file


    We will deliberately be rather verbose when it comes to storing data. There are
    ways of optimising this, using assumptions about the distributional properties
    of the data (see Witten, Moffat, and Bell (1994) for a discussion on efficient
    data storage), but that would overcomplicate matters further. In this section
    we are interested in the basic principles only.


    The first step is performed by the class PositionLister. This class simply reads
    in a file and sends a list of words and their positions in another class, the
    IndexCreator. This process is depicted in figure 6.3, which gives an overview
    over the program''s structure. The not convention used here shows programs (or
    classes) in boxes with a shadow, whereas data is in plain boxes. Note that this
    is the only logical structure; some components will not ''exist'' separately,
    like the list of positions.'
