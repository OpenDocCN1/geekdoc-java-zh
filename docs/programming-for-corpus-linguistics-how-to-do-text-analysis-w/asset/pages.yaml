- pgno: 10
  md: '# 1


    # Introduction


    Corpus linguistics is all about analysing language data in order to draw conclusions
    about how language works. To make valid claims about the nature of language, one
    usually has to at large numbers of words, often more than one million. Such amounts
    of text are clearly outside the scope of manual analysis, so we need the help
    of computers. But the computer, powerful though it is, is not an easy tool to
    use for someone with a humanities background, and so its use is generally restricted
    to whatever ready-made programs are available at the moment.


    This book is an introduction to computer programming, aimed at corpus linguistics.
    It has been written to enable corpus linguists without any prior knowledge of
    programming (but who know how to switch a computer on and off) to create programs
    to aid them in their research, analysing texts and corpora. It introduces the
    basic concepts of using the programming language Java. This language is not only
    suitable for beginners, but also has a number of features which are very desirable
    for corpus processing.


    This book is also suitable for computer science students, who do have background
    in computing itself, and want to venture into the language processing field. The
    basics of text processing are explained in chapter 3, which should do what chapter
    2 does for non-programmers: give enough of an introduction to make practical work
    in the field possible, before proceeding with examples and applications later.


    After having this book, you will know how to produce your own tools for basic
    text processing tasks, such as creating word lists, computing parameters of text,
    and concordancing. To give you an idea how to go about developing complex software
    we will look at a few example projects: a stemmer, a part-of-speech tagger, and
    a collocation program.


    What this book obviously cannot do is provide a full discussion of both corpus
    linguistics and programming. Both subjects are large enough for introductory books
    in their own right, and in computing especially there are many of them, targeted
    at all levels. In corpus linguistics there have been introductory books published
    recently, and the other books in this series will serve well if you want to delve
    deeper into the subject. This book brings the two areas together. Hopefully, this
    book will whet your appetite and will make you want to go further from the foundations
    provided here.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# INTRODUCTION


    # 1.1 PROGRAMMING IN CORPUS LINGISTICS


    Corpus originates from linguistics, as a branch concentrating on the em-empirical
    analysis of data. However, the role of the computer is extremely important one,
    and without machine-readable corpora linguistics didn''t get very far. In order
    to process such corpora one requires software, i.e. computer programs that analyse
    the data, that creates a need for programming skills. This section will briefly
    discuss some of the problems arising from the current situation of corpus linguistics,
    arguing that the IT skills crisis threatens industry also has an effect on the
    academic world.


    # 1.1.1 The Computer in Corpus Linguistics


    The computer is the basic tool of the corpus linguist when it comes to analysing
    large amounts of language data. But as soon as the task at hand goes beyond the
    gathering of a small set of concordance lines one finds that there is no adequate
    software for the task at hand. This means that in order to perform an empirical
    investigation, one has to resort to doing it manually, or create an appropriate
    piece of software oneself.


    Manual data analysis is not only tedious and time-consuming, it is also prone
    to errors, as the human mind is not suited for dull repetitive tasks, which is
    what counting linguistics even amounts to. This, however, is exactly what the
    computer is extremely good at. Taking the point further it would not be far-fetched
    to say corpus linguistics in its current form cannot work without the help of
    the computer. Some techniques, for example collocational analysis (Church and
    Hanks, 1990; Clear, 1993), and the study of register variation (Biber, 1988) could
    simply not be applied manually. In fact, a corpus is really only useful if available
    in machine-readable form, and the meaning of ‘corpus’ is indeed coming to imply
    machinereadable, so that a printed corpus is now the exception rather the rule
    (McEnery and Wilson, 1996).


    This dependency on corpus for all the but most basic work is obviously not without
    problems. The problem is that a researcher is limited by the available software
    and its functionality, and will often have to change the way in which he she approaches
    a question in order to be able to use a given program. Developers on the other
    hand are guarded by what they are interested in themselves (due to lack of communication
    with potential users), or what is easy to implement. The main requirement for
    corpus linguistics software seems to be flexibility, so that a corpus can be explored
    in new ways, unforeseen by the developer. This, however, can only be achieved
    with some sort of programming on the user’s part.


    When there is no software available for a given task there are two main solutions:
    users can develop the right software themselves, or get a developer to do it.
    The problem with the do-it-yourself approach is that it requires programming expertise,
    which be difficult to acquire. Programming itself is not only time-consuming,
    but it can also be rather frustrating when the resulting program does not work
    properly and needs to be debugged. It is generally worth checking to what degree
    a computer needs to be involved in a project, see Barnbrook (1996): often enough
    the effort required to adjust the problem in a way to be able to use a


    ![](img/c394310805c2e60720e6e9e923804321_11_0.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# PROGRAMMING IN CORPUS LINGISTICS


    computer is far higher doing it manually, especially when it does not involve
    repetitive or large-scale counting tasks.


    # 1.1.2 Which Programming Language?


    A computer program is written in a special code, the so-called programming language.
    There are several levels of machine instructions, and the programmer usually uses
    a higher level language, which gets translated into the actual machine code, which
    depends on the computer''s processor. Programming has gone a long way since the
    middle of the last century, when it basically consisted of configuring switches
    on large front panels of computers which needed high air-conditioned rooms to
    be stored. In, writing a computer program nowadays is not very different from
    writing an academic paper: you sit down in front of the screen and type into a
    text editor, composing the program as you go along, changing sections of it, and
    occasionally trying how it works.


    Today is a multitude of programming languages, with Java being one of the most
    recent developments. All of these languages have been developed for a specific
    purpose, and with different design goals in mind. There are languages more suitable
    for mathematical computing (like Fortran), Artificial Intelligence research and
    logic computing (like Prolog). Thus it is the first task to find a language that
    is well suited for the typical processes that take place in corpus analysis. However,
    there are other aspects as well: the language should be reasonably easy to learn
    for non-computing experts, as few corpus languages have a degree in computer science
    and it should be available on different platforms, as both personal computers
    and large workstations are typically used in corpus processing.


    For this book Java is mainly known for being used to ''enhance'' web pages with
    bits of animations and interactivity, but at the same time it is a powerful and
    well-designed general purpose programming language, an aspect that has contributed
    to making it one of the most widespread languages in a relatively short time.
    In the following sections we will have a brief look at those aspects of Java that
    make it particularly useful for corpus analysis, before you find a detailed outline
    of the road ahead.


    # 1.1.3 Useful Aspects of Java


    The first feature of the Java language that is particularly suited for working
    with corpus material is its advanced capability to deal with characters. While
    many other languages are restricted to the basic Latin alphabet, with possibly
    a few accented characters as extensions, Java supports the Full character set
    (http://www.unicode.org/). That means it is easy to deal with languages other
    than English, however many different letters they should have. It includes completely
    non-Latin alphabets such as Greek, Cyrillic and Chinese.


    Apart being able to deal with character sets without problems, Java itself has
    a very simple and straightforward syntax, which makes it easy to learn. The instructions,
    the so-called source code, are easily readable and can be understood quickly,
    as the designers of the language decided to leave out some powerful but cryptic
    language constructs. The syntax originates from the programming language'
  merge: -1
  img_proc: true
- pgno: 13
  md: One feature with which programming languages can be classified is the way their
    programs are run on the computer. Some programs are readily understood by the
    machine and run just by themselves. They are compiled languages. Here the source
    code is processed by a translation program that transforms it into a directly
    executable program. The translation program is called a compiler. Compiled lan-
  merge: -1
  img_proc: true
- pgno: 14
  md: '# PROGRAMMING IN CORPUS LINGISTICS


    guages require some initial effort to be translated, but then they are fairly
    speedy. Thus, compiled languages are best suited for programs that are run frequently,
    and which don''t get changed too often, as every change requires a re-compilation
    and the respective delay takes place. This also slows down development, and an
    added bonus is that a lot of errors in the source code can be detected by the
    compiler and be corrected before the program actually runs for real.


    The other major class are interpreted languages. Here the source code is interpreted
    by another program as the program is executed. This other program is the interpreter.
    This means execution time is slower, as the same source code has to be re-interpreted
    every time it is executed, which is not the case with compiled languages, where
    this happens only once, during the translation. On the positive side it means
    that programs can be run immediately, without the need for compilation, and also
    that they are not dependent on the actual machine, as run through the interpreter.
    The interpreter is machine dependent, but not necessarily the program itself.
    Development time is quick, but some errors may go unnoticed until the program
    actually runs, as it is not checked in advance.


    This distinction matches natural languages: if you want to read a book in a language
    you can''t understand, wait until someone translates the books for you. This might
    take a while, but then you can read it quickly, as the translation is now in your
    own language. On the other hand, if it is not worth getting it translated (if
    you only want to read it, for example) you could get someone to read it and translate
    it as you go along. This is slower, as the translator needs to read, translate
    and then tell you what it means in your language. Also, if you want to go back
    to a chapter and read it a second time it will have to be translated again. On
    the positive side you don''t have to wait for the translation of the book to be
    completed before you start ''reading''.


    Java has elements of both these types of languages: the source code is initially
    compiled, but not into a machine-specific executable program, but into an intermediate
    code, the so-called byte code. This byte code is then interpreted by the Java
    runtime interpreter. This interpreter is the Java Virtual Machine (JVM), and it
    provides the same environment to a Java program, whatever the actual type of computer
    that it runs on.


    Arguably you get the worst of both worlds, the delay during the compilation and
    the slow execution at the same time. It works both ways: the code can be interpreted
    much more quickly than actual source code, as it is already pre-translated and
    error checked. It also keeps the portability, as the byte code is machine independent,
    and the ''compiled'' program works on a Windows PC as it does on a Unix workstation
    or Apple Macintosh.


    When you are working with Java, you first write your program in the form of its
    source code. Then you compile it, using the command javac, which results in a
    pre-compiled byte code, the so-called class file. If you want to execute that
    program, you then start the Java runtime environment with the java command, which
    will run the commands by interpreting the byte code.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '8


    INTRODUCTION


    # 1.2 ROAD-MAP


    In a book like this is obviously not possible to cover either aspects of Java
    programming or all aspects of corpus linguistics, some decisions have to be made
    as to what would it into the book and what was left out. This section briefly
    lists what you will find in the rest of the book, and what you won''t find. Java
    has quickly grown into a very comprehensive programming language, and tones with
    thousands of pages are being produced to describe it. However, a lot of this is
    not really relevant for the corpus linguist, but still leaves a lot of useful
    elements for text and corpus analysis.


    # 1.2.1 What is Covered


    In the following chapter, Introduction to Basic Programming Concepts, in general.
    It is intended for readers who have not done any programming so far, and will
    provide the foundation for later chapters. Basic Corpus Concepts, the third chapter,
    introduces the basics of corpus linguistics. By reading both of them, a framework
    is established to bring corpus linguistics and programming together, to see how
    programming can be utilised for linguistic research.


    The next chapter, Basic Java Programming, introduces the Java programming language,
    building up on the concepts introduced in the first chapter. It will show how
    they can be realised in actual programming code. In The Java Class Library we
    then have a look at some of the standard classes that you can use in your projects.
    Using existing classes greatly speeds up development, and also reduces the scope
    for errors, as existing classes are less likely to contain a lot of undetected
    bugs.


    Then, Input/Output gets you going with the most important task in corpus linguistics.
    After showing how to read texts and print out them we will apply our newly acquired
    skills to investigate different ways of creating a concordance.


    Afterwards, in chapter 7, we will look into processing full texts of just simple
    words. Identifying words in a stream of input is one of the fundamental processing
    steps, on which a lot of other tasks depend later.


    Most corpora have annotations. How to process annotations in a corpus is the topic
    of chapter 8. Here we will look at mark-up, concentrating on XML, which is not
    only the new standard for the Web, but as a simplified variant of SGML is also
    relevant for corpus encoding.


    And finally we will investigate three case studies, which are self-contained projects
    you might find useful in your day-to-day research. Taking up threads from two
    companion books in the series, we will implement a stemmer from a brief description
    in Oaks'' Statistics for Corpus Linguistics, a parts-of-speech tagger described
    in a study question of McEnemy & Wilson''s Corpus Linguistics, and see how we
    can compute collocations as described in Barnbrook''s Language and Computers.
    All these case studies start off from a simple description of how to do it, and
    will end up with a working program that you can start using straight away.'
