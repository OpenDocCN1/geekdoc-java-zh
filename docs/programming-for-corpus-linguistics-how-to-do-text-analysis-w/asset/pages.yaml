    # ## 5.3 STRING HANDLING IN JAVA


    The basic unit of analysis in linguistics is generally the word. So we will use
    this as the entry into the Java programming language, especially since it is important
    for programming in general: there are a number of occasions where sequences of
    words are used, such as names of files, error messages, help texts, and labels
    on buttons. In computing terminology sequence of characters is called a String,
    and there is a class of name in Java''s basic class library, which we have come
    across in the previous chapter.


    # ### 5.3.1 String Literals


    When you are assigning a value to a numerical variable, you can simply write the
    value in the source code as a sequence of digits, for example


    ```

    int aNumber = 13;

    ```


    To do the same with a String, you have to tell the compiler exactly where the
    string starts and where it ends. For that reason you need to enclose a string
    in the source code in double quotes, in the following example:


    ```

