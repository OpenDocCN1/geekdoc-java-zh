    # 2.3.3 Composite Data


    The data types described so far enable one do most kinds of programming, but usually
    real world data is more complex than simple numerical values or single characters.
    If you want to deal with words, for example, it would rather tedious handle each
    letter individually. The solution for this lies in composite data. Historically
    they started off with records with several fields consisting of primitive types
    (the types described in the previous paragraphs) or other composite types. This
    allowed you to store related data together in the same place, so you could have
    a word and its frequency in the same composite variable, and you could keep track
    of the relationship between the two entities.


    Later on it became apparent that one might not only want to have related data
    but also instructions that are relevant only to that data. The result of this
    is the object, a combination of data fields and operations that can be applied
    to them. With the example of the word, we could create a word object from a text
    file, and could define operations to retrieve the length of the word, the overall
    frequency of the word in the text, its base form, or a distribution graph that
    showed us where all the occurrences showed up in a text.


    Objects are a powerful programming idiom: they are basically reusable building
    blocks that can be combined to create an application. As objects are fundamental
    part of Java we will discuss them in more detail in chapter 4.


    # 2.4 DATA STORAGE


    When processing there is one fundamental question that we need to look at next:
    where and how do we keep that data? We already know that we can store individual
    data items in variables, but this is only really suitable for a small number of
    items that we are processing. If you want to store all words of text in different
    variables you would example have to know in advance how many there are, and then
    you can''t easily do anything useful with them. Instead you would have to follow
    a different approach, storing the words in an area where you can access them by
    one or manipulate them as a whole, if you want to sort them. Principally there
    are two places where you can store your data, either directly in the computer''s
    memory or in a file on the computer''s hard disk.


    # 2.4.1 Internal Storage: Memory


    Storing your data in memory has one big advantage: accessing it is very fast.
    The reason for that is that the time needed by the computer to read a value out
    of a memory chip is much shorter than the time needed to read out an external
    storage'
