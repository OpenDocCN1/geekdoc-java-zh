  md: '# SUMMARY


    +   - word X exactly d words before/after word Y

    - word X up to d words before and/or after word Y

    - word X or word Y

    - word X not followed by word Y

    - ...


    This can be done by splitting the query into a set of ''atomic'' queries, which
    are combined in a tree structure, similar to a phrase structure tree. The exact
    details of how this can be done are beyond the scope of this book, but figure
    6.4 might give you an idea of how it could work.


    ![](img/c394310805c2e60720e6e9e923804321_136_0.png)


    The query “followed by either little or green followed by house” can be represented
    by a parse tree as shown in figure 6.4. The leaves of the tree show the atomic
    queries, which are looked up in the index, where the nodes are operators. Here,
    ADJ stands for adjacent, an operator which checks whether the two operands are
    next to each other. So, it passes the position of the rightmost element to the
    node above.

    Looking at the tree from left to right, we first find all occurrences of the.
    These are then combined with the occurrences of the OR node below, which returns
    the (sorted) union of the occurrences of little and green. The result of this
    will be all occurrences of little and green which are preceded by the. Then are
    are joined with all occurrences of house in the uppermost ADJ node.


