  md: '![](img/c394310805c2e60720e6e9e923804321_126_0.png)


    The index positions are simply stored in a Properties file, which can be read
    into memory using the FileIndex class. In this class we store the positions in
    int arrays within a Map with the word form as the key. To keep things simpler,
    we will be ignoring punctuation for indexing purposes, and we will only look at
    tokens which contain just letters and digits.


    We will use a very simple algorithm to identify our tokens in the input data;
    with more sophisticated methods to do so are discussed in the next chapter. With
    these, however, it is also difficult to keep track of the positions of the tokens
    in the data file, as they work on a higher level of abstraction.


    We will try to make sure that the components of the program can be easily changed
    for alternative implementations. For this reason we will not directly access the
    index file from the IndexedConcordance class, but use another class, FileIndex
    instead. If we decide to change the format of the index file we can extend the
    FileIndex class in a way that can also handle the new format, and the IndexedConcordance
    will never know (and never need to know) that something has changed.


    # The WordPositionReceiver Interface


    First we define our interface which is used to record words and their positions.
    This interface needs to be implemented by a class that processes index positions,
    i.e. collating them to a sorted list. The reason for choosing an interface for
    for this is a fairly general task, and we might be able to reuse this interface
    for some other programs. Furthermore we avoid a tight dependency between classes,
    as we separate the functionality (i.e. the interface) from the implementation
    (i.e. the class).'
