- pgno: 219
  md: '# COLLOCATION ANALYSIS


    We have now seen what the important parameters are for computing the collocations
    of a word:


    +   - A definition of the environment.

    - A definition of the benchmark frequency.

    - A method for comparing the frequencies.


    You have some degree of choice with these parameters, as there are no definite
    answers. Collocations in the past have been looked at in a rather haphazard way,
    using trial-and-error to reach plausible conclusions. Not much work has been done
    on the theoretical foundations, so you need to build up some degree of experience
    by just using it, looking at the data and comparing it with what you would expect.


    We will now step through the three parameters and see how we handle them in our
    application.


    # 11.1.1 Environment


    Conventionally, researchers have used a fixed span of three or four words to either
    side of the node word in the environment in which to look for collocates. However,
    recent research (see Mason (1997) and Mason (2000)) shows that this is simplifying
    matters, and ideally you would have to use a different span depending on the word
    you are looking at. Each word seems to have its own range of influence on the
    neighbouring words, and with a simple procedure you can work out what the ideal
    span should be.


    For purposes we will use a variable span, so that you can specify the range for
    both the left and the right side of the node. This means you can choose whatever
    span you want. It is likely you will need to vary your choice depending on the
    type of words you''re looking at and the language you are working in: English
    with its comparatively fixed word-order one can get away with relatively small
    values for the span, whereas others languages might require larger values.


    We will extract the environment from a set of concordance lines. These concordances
    can be produced using any of the concordancing programs we looked at in chapter
    6. You need to make sure that the lines are wide enough to contain enough words
