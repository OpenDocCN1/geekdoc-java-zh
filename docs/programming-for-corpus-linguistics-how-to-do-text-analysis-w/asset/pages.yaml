  md: '# 6


    # # Input/Output


    Input and Output (I/O), those is essentially what data processing is all about.
    The basic procedure is that data is read from a file or other external source,
    then processed in core memory, and the result of the processing sent to the screen
    or into another file. The input could be example a text file containing a corpus,
    and the output file could be a list of all words ordered by frequency of occurrence.
    This chapter describes how to do this. At first we will have a look at the Java
    I/O architecture, and how we can extend the classes provided by the standard library.
    For this purpose we will design several classes that can be used to produce concordance
    lines and compare the advantages and disadvantages of the different approaches.
    Finally we will look at alternative ways of accessing external data via index
    files.


    # ## 6.1 THE STREAM CONCEPT


    I/O in Java is based around streams. There are two types of streams: those that
    deliver data, input streams, and those that receive data, output streams. The
    main idea behind the stream concept is that it doesn''t really matter where the
    data actually comes from, the keyboard, a file on a disk, or even from a network
    connection. Using streams as an abstract layer in-between allows you to treat
    all these different sources the same. Same also applies to output streams.


    Apart from direct interaction with input and output devices, streams can also
    interact with each other; special streams can be chained to perform tasks such
    as counting lines, buffering or transforming the data passing through them. This
    is an extremely powerful concept, which you can yourself through creating special
    streams for any purpose. Later in this chapter we will design a stream for concordancing.
    This can then be used with any input source, be a text file or a web page on a
    remote server machine.


    At the point where you get with the actual data you decide which stream to use,
    and from then it does not matter any more. Streams are arranged in an inheritance
    hierarchy, so that all streams have either InputStream (for reading) or OutputStream
    (for writing) as one of their ancestor classes, and these two define the functionality
    that you can make use of. Corpora are mainly stored in text files, the most important
    streams for handling them are the FileInputStream and the File. These streams
    allow direct reading and writing to data files.


    If you look at the API of InputStream, you will see that it mainly allows you
    to read single items, or a fixed number of items at a time. But we usually deal
    with'
