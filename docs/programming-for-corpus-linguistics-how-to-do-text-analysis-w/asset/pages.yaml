    # Basic Java Programming


    Before we can start writing programs in Java we will need to cover some more ground:
    the basics of object-oriented programming. We have already heard that Java is
    an object-oriented programming language, and now we are going to see what that
    means for writing programs in it.


    # 4.1 OBJECT-ORIENTED PROGRAMMING


    Object-oriented programming, or OOP, was developed in order to make it easier
    to design robust and maintainable software. It basically tries to provide an easy
    to understand structure or model for the software developer by reducing the overall
    complexity of a program through splitting it into autonomous components, or objects.
    OOP is a topic which in itself is taught in University degree-level courses, but
    for our purposes will limit ourselves to the aspects of it which are relevant
    for developing medium-scale software projects.


    The central terms in OOP are class and object. In the following section we will
    discuss what they are and how you can use them in programming. We will also learn
    how Java specifically supports the use and re-use of components through particular
    conventions.


    # 4.1.1 What is a Class, What is an Object?


    Any computer program is constructed of instructions modelling a process, like
    for the way a traffic light at a junction works, how tomorrow''s weather can be
    predicted from today''s temperature, humidity and air pressure, and so on. These
    are either copies of real systems (the traffic light), or theoretical models of
    those (the weather prediction). In corpus linguistics we for example implement
    models of part-of-speech assignment, lexical co-occurrence, and similar aspects
    of texts.


    However, we are generally not interested in all aspects of reality, so in our
    model restrict ourselves to just those which are deemed important for our application.
    We create an abstraction, leaving out those irrelevant details, making the model
    simpler than the real world.


    So, by creating a computer program we effectively create a model of what is called
    the domain we are dealing with. In this domain are objects, for example words,
    sentences, texts, which all have certain properties. Now, if a programming language
    has objects as well, it is fairly easy to produce a model of the domain as a program.
    Writing a program is then easily separated into two phases, the design'
