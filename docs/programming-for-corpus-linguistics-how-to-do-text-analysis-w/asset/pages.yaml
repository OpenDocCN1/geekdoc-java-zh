  md: '48


    BASIC JAVA PROGRAMMING


    phase, where you look at your domain and work out what objects it contains and
    of which are relevant to the solution of your problem, and the implementation
    phase, where you take your design to the reality to create the objects by writing
    their blueprints as Java source code.


    The important word in the previous sentence is blueprint. You don''t specify the
    objects, but templates of them. This makes sense, as you would usually have to
    deal with more than one word when analysing a text, and so you create a Word class,
    which is used as a template to create the actual word objects as needed. This
    template is called a class!, and classes are the foundation underlying object-oriented
    programs. A Java program contains one or more classes. When it is executed, objects
    can be created from the classes, and they populate the computer''s main memory.


    # 4.1.2 Object Properties


    An object has a set of properties associated with it. For example, a traffic light
    has a state, which is its current light configuration. When you model a traffic
    light, you wouldn''t need to keep track of how it is, or what colour the state
    is painted in. These properties are not relevant if you want to model the functionality.
    If, on the other hand, you want to create computer animation of a junction, you
    would probably want to include them.


    When designing your class, you need to represent these properties, and the way
    to do that is to store them in variables. Each class can define any number of
    variables, and each instance of the class will have its own set of these variables.
    What you need to do when you are designing the class is to map those properties
    to the set of available data types. We have already come across the same data
    types in chapter 2, but classes are data types as well, so you can use other classes
    to store properties of your objects.


    For our traffic example we would want to store the state as a colour, and there
    are several options how we can represent this:


    +   we could assign a number to each possible colour and store it as a numerical
    value, e.g. red is 1, amber and 2, and green is 3.


    +   we could use the first letter of each colour and store it as a character value,
    e.g. ''r'', ''a'', and ''g''.


    +   we could use String objects storing the full name, i.e. ''red'', ''amber''
    and ''green''.


    +   we could define a special class, Colour and have different objects for the
    respective colours we need for the traffic light.


    All of these have their advantages and disadvantages. From a purist''s point of
    the final option would be best, but it is also a bit more complex. We will come
    back to this point further on.


    # 4.1.3 Object Operations


    Apart from properties, classes also define operations. These allow you to do-something
    with those properties, and they model the behaviour of your domain object in'
