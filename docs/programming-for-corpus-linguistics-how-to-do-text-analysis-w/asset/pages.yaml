    In this introductory chapter we first discussed the role of the computer in linguistics,
    emphasising the fact that it becomes more and relevant to be able to program when
    working with computer corpora. The preferred solution to this is to learn Java,
    a language that is suitable for text and processing, easy to learn at the same
