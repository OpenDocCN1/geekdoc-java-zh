    \ the input has been reached.\n\nThe part of the getNext() method dealing with\
    \ reading the next token from the file is encapsulated in a try/catch block, as\
    \ the I/O operations can throw an exception. In order not to deal with this in\
    \ the place where we call the method any possible IOException is trapped. Should\
    \ an exception be thrown, the value for nextToken remains null, and we can signal\
    \ that the end of the input has been reached, even if we have actually stumbled\
    \ over a disk failure. This is a reasonable way to handle potential I/O problems,\
    \ as the object will still be in a defined state, and will continue working despite\
    \ the exception. The only potential problem is that it will prematurely stop tokenising,\
    \ which is probably much less significant than the fact that some error has occurred.\
