  md: "# IMPLEMENTATION\n\n```\npublic\nCollocate(String word, int f, int F, int n,\
    \ int N) {\n    double observed = (double)f;\n    double expected = ((double)F\
    \ / (double)N) * (double)n;\n    double p = (double)f / (double)N;\n    double\
    \ std = Math.sqrt((double)n * (1.0-p));\n    collocate = word;\n    zscore = (observed\
    \ - expected) / std;\n    tscore = (observed - expected) / Math.sqrt(observed);\n\
    \    mutual = Math.log(observed/expected) / Math.log(2.0);\n}\n```\n\nIn order\
    \ to make the computations explicit as possible we are using temporary variables\
    \ to store the observed and expected frequencies. The implementation of the formulae\
