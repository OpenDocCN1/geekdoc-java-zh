    ```


    This tells the compiler that whenever we are using a class called Date it is in
    fact the class java.util.Date, i.e. the class from the package java.util. If you
    would leave the import statement, you would always have to refer to the class
    by its full name, which is the package name and the class name separated by a
    dot (in our case java.util.Date). You can of course do that, but you would save
    yourself a lot of typing by using the import statement.


    If you find that you are using a lot of classes from a package you can either
    enumerate them, as


    ```

    import java.util.Date;

    import java.util.Calendar;

    import java.util.TimeZone;

    ```


    or you could import all classes of the package all at once, by writing


    ```

    import java.util.*;

    ```


