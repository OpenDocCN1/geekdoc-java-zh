  md: '# CREATING YOUR OWN READERS


    First we make sure that we have both of the required command-line parameters.
    If the array args does not contain exactly two elements, we either have to few
    parameters or some ones we won''t use. To prevent any potential for errors we
    print a usage message, describing how the class is used, and skip the processing.


    If we have exactly two parameters, we assign them to two String variables with
    more descriptive names. This is not really necessary, but it greatly enhances
    the readability of the source code. It is also very easy to accidentally swap
    0 and 1, and having descriptive names reduces the mental effort required to keep
    track of what is going on.


    Due to the potential IO exceptions we enter a try block, we open the input file
    (wrapped in a BufferedReader), create an instance of the SortedWFlist, read the
    input file into that object, and close the input file. We next the output file
    and write the sorted word frequency list to it. Finally we close the output if
    something goes wrong we simply print the content of the exception in the catch
    block, which will tell us what caused the problem.


    In the example you will notice that the SortedWFlist class does not have a constructor.
    In this case it simply inherits the constructor from Object, and there is no further
    initialisation to do this is all that is required here. The storage has a static
    initializer, i.e. it is being as soon as a new instance of the SortedWFlist is
    created. Alternatively we could put this initialisation into a constructor.


    In the next chapter, we deal with splitting running text into input words, where
    we will see how we can make this class more usable. This mean that you don''t
    have to provide the input data in the rather restricted format that is necessary
    at the moment.


    # 6.3 CREATING YOUR OWN READERS


    For most purposes you can use existing streams and readers, and process the data
    once you have read it, but sometimes it is also convenient to just create a specialised
    reader, especially if it is a task that you might want to perform very frequently.
    In Corpus processing the obvious example is creating concordance lines from plain
    text, as concordance lines can be used as input for a wider variety of processing
    steps. In this section we will develop two variants of a ConcordanceReader which
    simply produces character-based concordances. The first variant is a straightforward
    implementation, while the second uses a more sophisticated way of processing the
    data, which results in a two-fold increase in speed.


    # 6.3.1 The ConcordanceReader


    For this section we define a concordance line as a string of characters of a fixed
    length which contains a target sequence in the middle. This target sequence is
    the word, which we want to investigate. The line length can be any size, so we
    will keep it variable, with a default value of 75, which is just less than the
    width of a normal text window or a line on a normal printer.'
