    # 2.1.1 What is an Algorithm?


    Suppose you are standing in front of a closed door, which we know is not locked.
    How do we get to the other side of the door? This is something most people learn
    early in life and don''t spend much time thinking about later, but the computer
    is a little child in many ways, and it does not come with the knowledge of how
    to walk through a door. If you want to teach a robot to move around in the house,
    you will need to describe the task it should perform in a list of simple steps
    to follow, such as: take hold of the door handle, press it down, pull or push
    door through the resulting gap.


    Unless your robot is already rather sophisticated one, you will now have to tell
    it how a door handle looks and how it can be pressed down. Ultimately this will
    be described in more and detail until you have arrived at the level of simple
    movements of its hands or their equivalents. Of course you will have to describe
    a list of movements only once, ''move arm downwards'' and you can refer to them
    once they have been defined. Such repeated ''procedures'' could be things like
    gripping a handle, pushing an object, and effortlessly opening doors.


    As a computer has no built-in intelligence, it needs to be told everything down
    to the last detail. However, at that rate writing a program to accomplish a certain
    task would take longer than doing it yourself, and there are lot of basic operations
    that are required every time. In order to make programming easier programming
    languages with higher levels of abstraction have been developed. Here the most
    likely tasks you want to do are readily available as single commands, like print
    this sentence on the screen at the current position of the cursor. You don''t
    have to worry about all the details, and thus high-level languages are considerably
    easier to learn and speed development, with less scope to produce errors, the
    size of programs (measured in the number of instructions written by the programmer)
    is reduced.


    If you want to know, for example how the length of a word is, you would have to
    go through it from beginning to ending, adding one to a counter for each letter
    until you have got to the last letter of the word, making sure that you don''t
    stop too early or too late. In Java, however, there is a single instruction that
    computes the length of a piece of text for, and you haven''t got to go around
    all the details of how this is accomplished.


    High-level languages are one step towards easier communication with computers.
    Of course we are still a long way from Star Trek-like interaction with them, but
    at least we no longer have to program machines on the level of individual bits
    and bytes that load register X from memory address Y, shift accumulator content
    to or decrement accumulator and jump to accumulator Z is not zero.


    Programming, then, is the formulation of an algorithm in a way that the computer
    can understand and execute. The first step in this is to be clear what it is you
    want the computer to do. Unless you know exactly what you want you will not be
