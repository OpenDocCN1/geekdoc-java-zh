- pgno: 232
  md: '# STUDY QUESTIONS


    The lines contain first the word, and then the three respective scores. They are
    sorted in reverse order according to the t-score, so the is the most significant
    collocate of monster, followed by whom. If you look at the z-score, you will find
    that created scores highest, and then depart; these are also the top two collocates
    with the largest mutual information score.


    # 11.5 STUDY QUESTIONS


    +   1. As it stands the Collocator operates on a set of concordances in an external
    file that you had to prepare earlier. Combine the Collocator with a concordancing
    program from chapter 6 so that you can specify the node word instead of a filename,
    with the concordances being extracted automatically.

    2. It is a bit cumbersome to have three different Comparator objects for the significance
    scores. Can you think of a way of combining them into a single object which can
    be set to sort according to any of the three scores? This could either be done
    in the constructor or via a method that allows you to change the sort mode.

    3. To facilitate comparing the different scores, think of a way to work out the
    ranking of each collocate according to each score and then print out a list which
    will look like:


    | created | 1 | 1 | 2 |

    | depart | 2 | 3 | 1 |

    | whom | 3 | 15 | 6 |


    This shows the word and the respective ranking for each of the scores.'
