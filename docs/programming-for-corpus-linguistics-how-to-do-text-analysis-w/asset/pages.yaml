    # Transforming Strings


    As you will notice looking at table 5.4, all the methods that transform strings
    return a String object. This is because they cannot operate on the current object
    themselves, as String objects are immutable. However, in practice this does not
    much matter, as you always assign the return value to the same variable, as in


    ```

    word = word.toLowerCase();

    ```


    When you convert the object word to lower case, and in fact happens is that a
    new String object is created which contains the lower case version of word; this
    object is then assigned to word, and the original mixed case version is discarded.
    The only drawback of this is a slight cost in performance, but that would only
    be noticed in time-critical applications churning through massive amounts of data.


    The first method, concat(), concatenates the String given as a parameter with
    the value of the current object and returns a new String object (provided the
    parameter string was not empty) which consists of the two strings combined. Concatenation
    is the technical term for putting two strings together, as in:


    ```

