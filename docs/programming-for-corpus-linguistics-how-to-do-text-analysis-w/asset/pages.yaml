  md: '# CREATING YOUR READERS


    What do we do to measure the speed of the respective versions is the following:
    we set up a FileReader with a sufficiently large input file, and construct several
    ConcordanceReaders with a few words of different frequencies. It is important
    to try it out with words from different bands, as the ring buffer version is slower
    when we find a match and the output line is constructed by going the buffer by
    character, when the linear buffer can be output straightaway. We trade this loss
    for a gain in the more frequent occasion of moving the buffer across the text.
    If we were only looking at very frequent words, we would not get the right picture,
    as the slow buffer construction would have to be done more than one would expect
    otherwise.


    As you can see, proper performance measurements are verified! Before we start
    the current time is, and compare to the time we have finished the test run. For
    this we use the method currentTime() in the Class System, which tells us how many
    milliseconds have elapsed since 01/01/70. As we are also interested in the difference
    between the two times the actual absolute value doesn''t matter.


    After we have measured the times for the ConcordanceReader we need to do the same
    for the RingConcordanceReader. We repeat the whole process several times, as the
    file might have been read into the computer''s internal cache the first time,
    which would improved the performance on the second run. We also swap the calls
    to the ring buffer and the linear buffer versions on alternate passes through
    the data. We also add the total time that the first run, and then display it.


    This sample output is for a test of four, the, book, word, and test, on a test
    file called corpus.txt. You can see four passes through the data, numbered from
    0 to 3, with the timings for each word in a separate line. The lines begin with
    the word ''Testing'' contain the word followed by its frequency in the test file
    and the time required to process the file. Then you have the frequency and timing
    again for the corresponding method. For the word ''the'' we get 3818 occurrences
    with both versions (so they do at give the same results!), and the timings are
    47355 milliseconds and 25422 respectively. Passes 0 and 2 give the linear buffer
    results before the ring buffer results, whereas passes 1 and 3 have the ring buffer
    results. If you look at the respective values, you will note that for each pass
    you get slightly different results for each word. This is because we are reporting
    the results in milliseconds, so a value of 47355 actually means about 47.3 seconds.


    corpus.txt, pass 0


    ```

    Testing 3818 time: 47355      3818 time: 25422

    Testing book 31 time: 46324      31 time: 22431

    Testing word 479 time: 49750      479 time: 18801

    Testing test 32 time: 46682      32 time: 18150

    ```'
