    DEALING WITH ANNOTATIONS


    The full specification of XML is available from http://www.w3.org/, the website
    of the World Wide Web Consortium. A list of software tools and where to get them
    is in 12.2.


    # 8.3 WORKING WITH XML


    This section contains sample programs that show how to process text marked up
    with XML tags. We will not handle all aspects of XML (that would be too much for
    this book) but assume that it is already well-formed and DTD is necessary. Obviously
    these programs cannot really compared to full-blown XML parsers, but they should
    give you an idea of how they work, without getting involved in too many of the
    hidden complexities. They are not intended to be used of fully XML-aware programs,
    but they go a long way when it comes to processing texts which are annotated in
    basic XML.


    # 8.3.1 Integrating XML into your Application


    When you are writing an application that makes use of XML for processing data
    you will not usually want to start from scratch by implementing your XML parser.
    Instead, you would probably want to use one of the many existing XML parsers,
    some of which are even freely available (see section 12.2 for a list of XML tools).
    More and more XML parsers are now being written in Java, as many developers see
    Java and XML as two things that go together: both program and data format are
    essentially independent.


    So, you need an interface of some kind from your application to the XML parser.
    For example, let''s assume you are writing a concordance program that operates
    on XML-encoded corpus data. You leave the handling to the parser, but you will
    need to access the result of the XML parsing in order to match your words in it.
    There are standard APIs which allow you to get hold of both the data and the structure
    of an XML document. These APIs are even defined for different programming languages,
    as they are fairly generic.


    There are basically two models of working with XML documents. The first one is
    document object model (DOM). Here the XML parser reads the whole document into
    memory and constructs a tree structure from it. This tree structure is passed
    to the parser, and the data processing then simply consists of tree traversal
    and navigation.


    The other way to process XML documents is via the simple API for XML (SAX). This
    is event-based, every time an element is read something happens to handle it.
    The usual way to do that is through callbacks. A callback is a method which is
    called whenever some special event occurs. In this case you would need to define
    a method which handles an opening tag. The set of methods you would need to define
    be specified in a Java interface, and your application would need a class implementing
    that interface. Some SAX callbacks are shown in table 8.1 to give you an idea
    of what kind of events can occur.


    You might notice that SAX is more ‘low-level’ than DOM. In fact, you can write
    an XML parser which internally uses SAX to create a DOM of a document.'
