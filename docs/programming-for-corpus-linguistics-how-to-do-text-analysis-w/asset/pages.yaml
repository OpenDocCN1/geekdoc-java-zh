  md: '# 3


    # Basic Corpus Concepts


    This chapter introduces relevant concepts from corpus linguistics. It is intended
    as a brief introduction to enable you to understand the principal problems that
    you will encounter when working with corpora.


    # 3.1 HOW TO COLLECT DATA


    Unless you are working with a research group that already has de corpora available
    that your first question will be where to get data from and how to assemble it
    to a corpus. For the remainder of this section we will assume that you want to
    build your own corpus for analysis. There are several reasons why you might want
    to do this. The main one is the kind of data you want to analyse does not (yet)
    exists as a corpus. This is in fact highly likely when you choose your topic without
    knowing what corpora already exist and accessible publicly. On the one hand you
    will have the advantage of not having to compromise on the subject of your research
    (e.g. by restricting its scope), but you might have to put extra work into collecting
    appropriate texts. Often you might want to compare a special sample of language
    with general language; here you would collect some data (e.g. political speeches,
    or learner essays) and use existing corpora (like the BNC or the Bank of English)
    as a benchmark.


    # 3.1.1 Typing


    Typing in data is undoubtedly the most tedious and time consuming of getting it
    into the computer. It is also prone to errors, the human typist will either correct
    the data, or mistype it. Nevertheless, this is often the only possible solution,
    e.g. when dealing with spoken data, or when no other alternative (following sections)
    is available.


    The most important point to consider when entering corpus data at the keyboard
    is that you want it to be in a format that can be easily processed by a computer.
    There is no point in having a machine-readable corpus otherwise. Over the years
    (mainly prompted through advancements in computing technology) several different
    formats have evolved. More on data formats below in section 3.2.2.


    # 3.1.2 Scanning


    Scanning seems to be a much better way of entering data. All you need to do (provided
    you have access to appropriate hardware) is to put a page at a time into the'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 32 BASIC CORPUS CONCEPTS


    scanner, press (or click on) a button, and the scanner will read the page and
    dump it on your system. Just as easy as photocopying it seems.


    Unfortunately it is not that easy; there is one important step that complicates
    things tremendously. The that from the page image to the page content, in other
    words the reading process. While humans are usually quite good at reading, to
    a computer a page looks like a large area with random black dots on it. Using
    sophisticated software for optical character recognition (OCR), the dots are matched
    with letter shapes, and are then written into an output file as plain text.


    This transformation from image to text can be easy for high quality printed on
    paper. Older data, however, can quite lead to mistakes, due to lack of contrast
    between paper and letters, or because the lead type has been rubbed off with time
    and bits of the letter shapes are missing. Imperfect printing can lead to letters
    being misinterpreted by the computer, where the most common examples are missing
    c (and vice versa), or ni for m.


    Luckily a lot of these recognition errors can be caught with modern spell software,
    but it adds to the effort required to get the texts into machine-readable before
    you start analysing them, and spell checkers are not infallible.


    Further complications arise once you start to look at data that is formatted in
    multiple columns, intermixed with figures or tables. It is very hard for the computer
    to figure out what the flow of the text is, and thus a lot of manual intervention
    is required for such data.


    # 3.1.3 Downloading


    The best solution—as always—is to re-use material that somebody has already made
    machine-readable. There are plenty of texts available on the Internet, from a
    variety of sources, and of varying quality. For a list of possible sources see
    the appendix.


    Generally there are two types of texts available on the Internet, web pages and
    text files. Web pages can easily be saved from a browser, and they contain many
    different texts. Often you can find newspaper articles or even academic papers
    in this form. Texts are usually too large to display on a single page, and they
    are available for downloading rather than on-line viewing. A number of sites contain
    whole books, Project Gutenberg and other ventures. The Oxford Text Archive also
    allows downloading of full texts, in different formats. Most of the books available
    for free downloading are classics which are out of copyright; while this makes
    them an easy source of data, their linguistic relevance may be dubious.


    # 3.1.4 Other Media


    It is increasingly possible to buy collections of text on CD ROM for not very
    much money. These are usually whole worth of newspapers or classics which are
    out of copyright and are sold as a kind of digital library, with software that
    displays the texts on the computer screen. While this seems like a very convenient
    source of data, it is often the case that the texts are in encoded format, which
    makes them'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# HOW TO STORE TEXTUAL DATA


    impossible to use without the included software. This format could be for indexing
    or compression purposes, and it means you will have to use the software provided
    on the CD to look at the data. Sometimes you might be able to save the text you
    are looking at within the program, or you can ''print'' it into a file you can
    then process


    It might require some computing expertise to extract texts from such collections,
    it is probably easier to find the texts on the Internet, which is presumably where
    a lot of these texts originated from the first place (see previous section).


    With newspapers, when you get back issues of a whole year on a CD, you will almost
    certainly have problems accessing the text. These CDs are mainly meant as an archive
    of news articles, so they are linked up with search mechanisms which often provide
    the only point of entry to a text. The caveats mentioned before apply, even more
    since the publishers might see some commercial value in the material and even
    encrypt it to prevent access other than through the interface provided. The same
    applies to a lot of encyclopedias which are available on CD, often over the disks
    of computing magazines.


    One issue that is often neglected here is that of copyright, which is a right
    mine. If you are not allowed to use some data, it is best to consult an expert,
    as can save you a lot of trouble in the long run.


    # 3.2 HOW TO STORE TEXTUAL DATA


    Collecting data is one of the whole problem, another one is to store it. It is
    important, as how you manage your data greatly influences what you can do with
    it during analysis, and how easy this analysis will be. Apart organising your
    data, you also need to look at the physical storage, which means the format you
    store your data in. There are a great number of ways to represent textual data
    on a computer, especially when it is more than just plain text, such as annotations
    of some sort. Careful planning at the outset of your research project can save
    you many headaches later, and how handling your data is as important as your actual
    investigation, so any time spent on is worth the effort.


    # 3.2.1 Corpus Organisation


    Once you have collected all your texts, you need to store them in some form on
    your computer. Depending on what your analysis will be, there are different ways
    of organising your material, but it is always worth trying to anticipate other
    uses of your data. Try not to exclude avenues of analysis on the grounds that
    you are not interested in them; your own interest might change or somebody else
    might come along with using your data in an unforeseen way.


    It is probably a good choice to partition your data into smaller parts which is
    possible to give little guidelines which are suitable for each and every corpus.
    \r

    The first step is to look around and see if there are similar corpora whose structure
    you might want to mirror. This is the approach that has been chosen for the LOB
    corpus (Lancaster-Oslo/Bergen corpus of British English), which took the design
    of the corpus!Brown (American written English) to allow direct comparison'
  merge: -1
