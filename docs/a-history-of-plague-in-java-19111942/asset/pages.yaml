  md: '# Introduction


    Three European men in white attire pose in a partially constructed house in Java
    around 1919 (figure 0.1). Two have climbed up into the theams, one emerging triumphantly
    through the skeleton of the roof. Below, two Javanese men in hybrid local and
    colonial uniform look on. The actual subject of the photograph—the construction—has
    been captured in its entirety. The roof dominates the image, its latticework contrasting
    with the sky behind. The structure is placed on a stone foundation and has wooden
    corner posts and joists. Most of the dwelling is drawn up of a different material,
    cheaper and readily available. Sturdy bamboo poles serve as support posts. The
    rafters are made of halved or "split" bamboo. The walls are made of a single layer
    of wicker bamboo mats called *gedek*. More pieces of bamboo are scattered in the
    foreground, one stalk at the base of the house revealing its hollow interior.
    The neatly dressed men climbing into the half-finished dwelling have something
    boyish about them, but the photograph conveys message regarding the prevailing
    race and power dynamics in the Dutch East Indies. To contemporary audiences, this
    would have been evident not only from the pose and positioning of the human figures,
    but also from the recognition that this evidently "native" house was no longer
    fully Javanese. We are witnessing a scene of home improvement in Java: one of
    the most invasive, sustained, and best-advertised health interventions'
