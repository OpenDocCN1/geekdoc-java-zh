    # Private Plague Propaganda


    Medical propaganda in the Indies was short-lived, its activities were generally
    viewed positively and showed up broad support for the undoubt, if unquantifiable,
    benefits of public health education with visual materials. Over time, diverse
    private individuals and organizations with or without government ties also began
    to produce health messaging materials in order to address a range of health challenges.


    The Rockefeller Foundation was a key player in this domain. Since 1913, this American
    philanthropic organization pursued “the well-being of humanity throughout the
    world” with a strong emphasis on improving population health.⁶² Its initial focus
    was on hookworm, since its directors believed that the control of this prevalent
    and debilitating intestinal disease would not just benefit health but have a broader
    societal impact by increasing economic productivity.'
