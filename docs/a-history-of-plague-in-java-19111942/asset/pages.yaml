    affected by a plague was a truum by the end of the nineteenth century, argues
    the anthropologist Nicholas Evans, while the “modern-day iconography” of plague
    is “replete with images of rats as plague carriers,” the notion that animals played
    a role in their transmission to or from humans was “unheard before the turn of
    the nineteenth century.”—33 Though even Yers had pointed to the rat as a vehicle
    of plague, which was only in 1899 that another Pasteurian scientist, Paul-Louis
    Simond, presented preliminary evidence that plague could be transmitted by the
    bite of an infected flea.³32 His theory was met with skepticism but over the following
    decades, Evans, members of the Second Indian Plague Commission (1905–1917) laboriously
    proved the evidence that supported this “rat-flea-man” hypothesis.³33 Other species
    of rodent such as gerbils, marmots, and barbans were subsequently implicated as
    “sylvatic or wild hosts” of plague. Plague consequently came to be situated at
    the intersection of human and animal life: helping to lay a foundation for the
    concept of zoonosis.³34 At the time in British India, however, the theory was
    rallied once more to reaffirm existential crisis and social hierarchies. Europeans
    concerned less on the problematic agency of the rat itself than on the native
    customs that fostered “improper” relationships between humans and rats. The “uncovering
    of rat agency” suggests Evans, ultimately made native bodies and habits knowable
    and, crucially, judicable.³35 Similar discrepancies, I demonstrate over the course
    of this book, were present in Dutch assumptions on plague and plague transmission
    in the Indies.


    # The Dutch East Indies


    In a chapter in the incisive series of books Asia Inside Out, the historian Eric
    Tagliacco provides a snapshot of the Dutch East Indies in 1910. The Dutch colonial
    government, he suggests, found itself “close to the apex of its dominion” over
    the archipelago. Geographically, the colony had grown to its fullest extent. Mapping
    and surveying missions documented the territory under Dutch rule and the people
    it contained with ever greater precision. Railroads penetrated the hinterlands
    of Java and Sumatra. Advances in shipping knitted islands closer together. The
    number of state agents at the periphery steadily increased, and the Royal Dutch
    East India Army (Koninklijk Nederlands-Indisch Leg, KNIL) was an increasingly
    professional military force. The yet stage was set “for disasters that were just
    around the bend.”—36 Government corruption and maltreatment of the population
    persisted; discontent was rife. Nationalist forces had been set in motion with
    the founding of the political organization Boedi Oetomo in 1908 and, as the historian
    Hans Pols ex-'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# INTRODUCTION


    plains from the perspective of Indies physicians, they steadily increased in strength,
    diversity, and outlook.^37 But if, as Tagliacozzo put it, the gangrenebled away
    at the Dutch colonial project after 1910, why not substantiate his metaphor by
    referencing the pathogenic threat that entered the Indies that very year? Given
    his emphasis on the figments of colonial rule that excluded confidence, insistence
    on healthcare was surprising. After all, if many indicators suggested the robustness
    of the Dutch colonial state at this time, medicine was not among them. The arrival
    of plague in Java and subsequent measures could not contain it, would materially
    expand Dutch dominion for decades to come.


    Since 1827, a civil health service operated in Java as part of military health
    service. The health of the Indies population, consequently, secondary to the care
    of Dutch military and government personnel. Repeated attempts to separate these
    branches failed, while the system was criticized alternately for drawing resources
    from the military and for the neglect of civilian health.^38 For most of the nineteenth
    century, only a handful of larger settlements boasted a municipal or port health
    officer. Various plantations engaged in private physicians were scattered across
    Java.^39 In her study on developments in the medical market of the Dutch East
    Indies over the late nineteenth and twentieth centuries, the historian Liesbeth
    Hesselink put the number of Europeantrained physicians in 1850 at less sixty.
    By 1900, this figure had risen to 228: a significant increase, but far too low
    to cover a population of nearly thirty million people in Java alone. The vast
    majority of the Indies population instead received medical care from the doctors,
    men and women who tended to specialize in a particular health practice and who
    gained their knowledge orally and experially. Their number, estimated Hesselink,
    was about 33,000 in 1900.^40 Mean, the number of medical institutes (including
    psychiatric hospitals) stood around eighty in 1900. They were run primarily by
    the army and offered about 4,000 beds.^41 A government medical laboratory known
    as the Geneskund Laboratorium was opened in 1888.


    The Dutch colonial health service—such as it was—was supported by a small number
    of Japanese medical assistants. The Batavia Medical College opened in 1851 and
    graduated a steady trickle of junior physicians and vaccinators who, in return
    for stipends, were obliged to work for the colonial state for a period of ten
    years.^42 The curriculum steadily expanded in length and complexity, and in 1902
    the college was renamed the School for Education of Native Doctors (School tool
