  md: '# INTRODUCTION


    outbreak assumed a rural character instead. Home improvement consequently presented
    a uniquely far-reaching intervention beyond urban enclaves of colonial presence
    and control. Second, plague scholarship has shown a tendency to focus on epidemic
    outbreak moments and the immediate responses triggered—with less attention given
    to their endemic afterlives. In Java, plague is of interest precisely because
    of its endemic entrenchment and the remarkably strong and constant health intervention
    that it (nonetheless) provoked. To explain the importance of this disease to colonial
    governance despite its modest burden to the Indies death rate I suggest that plague
    and plague control in Java offered the Dutch a platform: an epidemic drama against
    which they could assert themselves locally, nationally, and internationally as
    an advanced colonial and scientific power. As progressive, ethical, and “modern.”^10


    # The Third Plague Pandemic


    The outbreak of plague in Java took place during a global expansion of this disease
    known as the third plague pandemic. The origin of this event is often traced back
    to an outbreak in Yunnan Province in southwest China in 1855 (where plague had
    in fact endemic since 1787). Political and economic instability, migration, and
    urbanization, explains the historian Carol Benedict, helped to carry the disease
    eastward over the latter half of the nineteenth century. Following an outbreak
    in Canton (Guangzhou), plague reached the nearby British colony of Hong Kong in
    May 1894.^11 From this key shipping hub on the south coast of the Qing Empire
    plague attained a global fusion. In a matter of years, it reached every inhabited
    continent and established new endemic foci (that in the case of Madagascar and
    the United States) exist to this day. By the time the pandemic came to an end
    in the second half of the twentieth century, plague had claimed an estimated twelve
    to fifteen lives—with ten to twelve deaths in India alone.^12


    The demographic impact of plague was not negligible. The resources mobilized in
    response to the disease—globally and locally—were certainly disproportionate to
    the total number of deaths.^13 The tremendous cultural response to plague was
    provoked by its high-fatality rate, on the one hand (ranging from 60 to 100 percent
    between its bubonic, septicemic, and pneumonic forms), and its cataclysmic history,
    on the other. The plague that entered Hong Kong in 1894 exhibited all the symptoms
    of the true bubonic pest devastated Europe in the Middle Ages.^14 It was consequently
    equated with a disease that had pandemic twice before: the “plague of Justinian”
    (541–750) and the'
