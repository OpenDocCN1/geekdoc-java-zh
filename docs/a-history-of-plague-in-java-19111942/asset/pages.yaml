    # War, Plague, and Decolonization


    In September 1939, the German invasion of Poland marked the start of World

    II. After a brief period of neutrality in the escalating conflict, the Neth-

    erlands was likewise invaded and occupied by German forces in May 1940.

    The Dutch government fled to London. Its colonies in Southeast Asia and the Ca-

    ibbean now had to fend for themselves. In the Dutch East Indies, the threat

    of invasion by Japanese loomed large as this expansionist power sought to secure

    access to key resources. In the end, was the Dutch government-in-exile that

    decl war following the Japanese attack on Pearl Harbor in December 1941.'
