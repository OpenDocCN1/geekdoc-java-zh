    Malang and had their basis in the organization of a plague intelligence service
    of sorts. After the disease was recognized in March 1911, state agents were faced
    with the question of how far the disease had already spread. An analysis of the
    available mortality statistics for East Java suggested that plague could have
    been present since November 1910 and consequently had ample time to spread. Over
    the following weeks, Willem de Vogel of the BGD produced a series of maps that
    converted statistical and bacteriological information on'
