    In 1924, after repeated offers, the new head of the Dutch colonial health service,
    van Lonkhuyzen, finally allowed Rockefeller agents to arrange a demonstration
    of its hookworm control methods.63 Broadly speaking, such demonstrations were
    similar to plague control. After a survey to estimate the incidence of hookworm
    in a community, the Foundation financed the construction of latrines in rural
    kampongs and initiated an education campaign that instructed local populations
    in the art and health benefits of proper defecation. Next followed the community
    administration of medications to kill and flush out the worms. Following such
    a demonstration, the increase in health and productivity of a population had to
    continue these activities elsewhere. The relationship between the Rockefeller
    representative John Lee Hydrick and Dutch health officials had been strained at
    first, as the Dutch were skeptical of the hookworm program and its benefits.64
