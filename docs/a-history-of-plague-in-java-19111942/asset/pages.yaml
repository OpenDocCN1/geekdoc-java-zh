    # Conclusion


    After 1928, health officials in Java were faced with a new series of challenges
    regarding plague and plague control. First, the disease expanded into new territory
    in West Java where home improvement lagged behind in Central Java. Second, the
    global economic downturn after 1930 put further pressure on the plague service
    as budget cuts caused the colonial service its staff and funding to be slashed
    in half. As a result, the number of plague cases exploded and reached unprecedented
    heights. Between 1932 and 1934, more people died of plague in Priangan than in
    East Java over the thirty years that plague was endemic. In 1935, the live vaccine
    by Ott offered a new and highly economical alternative to home improvement and
    dramatically reduced plague mortality. In 1941, the last year of Dutch colonial
    rule in the archipelago, just a few hundred plague deaths were recorded across
    the island. The signature home improvement scheme, however, was not abandoned.


