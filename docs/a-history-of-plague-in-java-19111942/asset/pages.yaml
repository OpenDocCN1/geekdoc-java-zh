  md: '48. These are the Royal Netherlands Institute of Southeast Asian and Caribbean
    Studies (KITLV), the Netherlands Institute for Military History (NIMH), the NIOD
    Institute for War, Holocaust, and Genocide Studies (NIOD), and the Department
    of History at Universitas Gadjah Mada (UGM). They published a final project report
    in February 2022: KITLV, NIMH, and NIOD, *Beyond the Pale*.


    49. The municipal councils of Utrecht, Amsterdam, Rotterdam, and The Hague have
    each announced research initiatives into the historical involvement of these cities
    in the slave trade, while the National Archives are working on an extensive digitization
    project to make slavery records publicly available. Furthermore, large museums
    such as the Rijksmuseum in Amsterdam are looking more closely into the origin
    of items in their collection and are organizing exhibitions on slavery.


    51. See for instance: Daniel R. Headrick, *The Tools of Empire: Technology and
    Euro-European Imperialism in the Nineteenth Century* (New York: Oxford University
    Press, 1981); Laurence Monnais, *The Colonial Life of Pharmaceuticals: *Medicines
    and Modernity* in Vietnam* (Cambridge: Cambridge University Press, 2019).


    52. For colonial Indonesia, the major studies in this field are van Bergen, Uncertainty,
    Anxiety, Frugality; Hesselink, *Healers on the Colonial Market*; and Pols, *Nurturing
    Indonesia*. For the Dutch colonies in the Caribbean, just one book stands out:
    Stephen Snelders, *Leprosy and Colonialism: Suriname under Dutch Rule, 1750–1950*
    (Manchester: Manchester University Press, 2017).'
