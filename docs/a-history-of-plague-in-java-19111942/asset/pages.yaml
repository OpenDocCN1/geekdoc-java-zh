  md: '# INTRODUCTION


    was a source of puzzle, meanwhile, radically different from place to place; ranging
    from panic to denial, from lax to outright "draconian" countermeasures, and from
    the dismissal of "native" hygienic practices to the mockery of modern science.
    Everywhere, the newly established bacterial cause of plague collided with existing
    theories, assumptions, and prejudices about its nature and transmission to form
    hybrid epidemics.


    In the early years of the pandemic, argues the anthropologist Christos Lyn, that
    plague was a "soil disease" built on older suggestions that the plague was caused
    by inhaling telluric gases. These theories now held that bacilli infected the
    earth, remained dormant until it to start fresh outbreaks at long intervals, and
    suggested a number of interventions. In Hong Kong, such notions supported the
    demolition and burning of the Chinese neighborhood Taipingshan. Similarly, in
    Bombay, health officials demolished buildings in plague-stricken quarters and
    dug up earthen floors to "expose" the soil to the perceived disinfecting qualities
    of sunlight, air, and fire. In the process, native practices that facilitated
    contact between humans and soil were dismissed by colonial officials as dangerous.
    The bare feet of Hong Kong or the women of Calcutta who used to clean metal objects.
    Simultaneously, suggests the medical historian Robert Peckham, health officials
    were preoccupied with the "infective propensity of Chinese things" that were being
    stored in and shipped from Hong Kong. Here and elsewhere, the perceptible ability
    of the bacillus to hide among a proliferation of "things" rendered plague an export
    commodity, leading to the disinfecting or burning of personal items as well as
    merchandise.


    Then, of course, there prevalent social and racial associations that cast one
    group or another such as Chinese, Indians, or hajis as human carriers of plague.
    In one well-known example, racist sentiment played a part in the burning of Chinatown
    in Honolulu in 1898. In San Francisco and elsewhere, due to ineffective quarantines
    placed on Chinese neighborhoods. In Brazil, Argentina, and South Africa, white
    elites implicated poorer, nonwhite communities and sought to push them to the
    margins of society. Plague, in short, remained an epistemologically uncertain
    entity that was easily worked into notions and biases on the nature, origin, and
    transmission of disease. By the time plague arrived in Java, many of these persisted
    and informed early responses to the outbreak. But in the meantime, a radically
    new theory of plague had also gained traction.


    Today, plague is understood as an infectious disease that primarily affects rodents
    and is most efficiently transmitted by the so-called rat flea. Rats in particular
    have become central to contemporary narratives of plague transmission. It is our
    “epidemic villain” of choice. That animals were also'
