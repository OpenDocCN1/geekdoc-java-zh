    # The Matter of Expertise


    A key challenge that faced Vogel in the early days of April was the fact that
    neither nor his colleagues had any experience working with plague. Whether as
    physicians, epidemiologists or bacteriologists, the Dutch knew little more about
    plague than what books, periodicals, and photographs told them.79 In a lengthy
    telegram to The Hague to inform the Dutch government on recent developments, Idenburg
    argued that bubonic plague had initially been measures taken for tropical malaria,
    and pneumonic plague for tuberculosis. The oversight, he insisted, was understandable:
    “No physician had previously seen plague, medical handbooks very different from
    that one he sees... even now with difficulty diagnosis.78 In a letter to de Waal
    Malfeit, written three weeks earlier, Idenburg made the same point. Even now,
    he Vogel faced great challenges separating cases of plague from cases of other
    febrile diseases.81 Coupled to these diagnostic difficulties were, as mentioned,
    the persistent anxieties about what plague might “lurk” and how it might spread.


    Soemowidigo, the doctor djawa who reported malaria and drusen fever in Meling
    in early March, was widely blamed for misdiagnosis. His failure to recognize plague,
    critics claimed, was responsible for the fact that the disease had already spread
    far and wide. From a letter by Susanna de Vogel of May 4 we learn that her husband
    placed responsibility for the situation wherever:


    For [the spread of plague] this doctor djawa is blamed heavily, but Wilhelm thought
    that the officers of health in charge of the civil service were more to blame.
    They kept reporting high mortality in the kampongs from a region where malaria
    is infrequent and never bothered to look themselves.82


    In his final report on the outbreak at Malang, Vogel made his defense of Soemowidigo
    official. At the same time, he adopted a milder tone toward his colleagues by
    underscoring their communal lack of experience with plague:


    None of us knew the disease from experience. . . . What medical man without any
    experience of plague, in a country where plague had never been assured, is willing
    to certify people with swollen and broken-down lymphatic glands. . . . as plague
    patients, thereby bringing upon himself the responsibility for an unnecessary
    panic and all the consequences thereof?83


    While Soemowidigo was thus recuperated and ultimately received a decoration for
    his contribution to the plague control efforts, the problem of deficient expertise
    was never truly solved.84'
