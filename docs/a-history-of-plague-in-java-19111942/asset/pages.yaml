    process, chapter 2 continues by tracing the early development of what would become
    the signature response to plague in Java: home improvement. This scheme effectively
    “colonized the home,” I by regulating, restricting, and partially recuperating
    the use of traditional Javanese building materials and architectural forms. In
    the process, local populations came clearly into the purview of the colonial state,
