    widely disseminated scenes of home improvement in Java. Were they really “about
    the Indies, about colonial relations, or about the Netherlands itself?”^7

    The colonial spectacle—whether it was a vertoning or not—may be defined as a performance
    or display of imperial power toward one or multiple audiences, in which cultural
    realism and racial hierarchies between colonizer and colonized are visually established
    within a single moment or frame.^8 Events such as the Delhi Durbar, where Indian
    princes paid homage to a British monarch, or a “native” performance at a European
    exhibition, “set the world like a picture” and invited the viewer to study it
    as a symbolic representation of the world’s “cultural and colonial order.”^9 Colonial
    spectacles informed a process of exoticizing or otherwise articulating “difference.”^10
    They shocked and begailed its consumers. In other words, they helped to establish
    new conventions of seeing by offering a “calculated realism” in which the “gaze
    renders the other distinct and separate from the self.”^11 Photographs helped
    to trench such conventions: practically (by reproducing spectacle for audiences
    elsewhere) and conceptually (through its persistent claims to provide objective
    representations of the real).^12 Scholars have on occasion argued the agency of
    indigenous peoples in their (re)presentation, though the nuances of their performance
    may have been lost on colonial and metropolitan populations immersed in narratives
    of racial and cultural hierarchy.^13 And if colonial relations of power were indeed
    established in scenes of home improvement in Java, it is important to emphasize
    that this spectacle was far from illusory. On the contrary, it was grounded in
    a very real and very material expansion of Dutch colonial power and cultural influence.


    In this chapter, I argue that home improvement was to a significant extent not
    about plague control at all. Rather, home improvement offered Dutch health actors
    an opportunity to perform “colonial modernity” by putting this health intervention
    on display to an obliging audience of lay countrymen and foreign specialists.^14
    Home improvement offered a highly visible intervention against a historically
    loaded disease. And though slow, it was also effective. But just as important,
    home improvement helped to reaffirm both cultural hierarchies in Java and the
    international political order by demonstrating Dutch colonial ability and scientific
    acumen in the context of a new (and poorly defined) civilizing mission.^^15


