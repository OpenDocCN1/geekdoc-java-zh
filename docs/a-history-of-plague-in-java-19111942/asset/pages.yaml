    # Countermeasures


    The recognition that plague had now been introduced into Java, as had long been
    feared, prompted a flurry of activity. Strict measures were indeed implemented.
    Haunted by the millions of lives plague had claimed in India since 1896 and the
    tens of thousands of deaths caused by a devastating outbreak of pneumonic plague
    in Manchuria only months earlier—to say nothing of the economic consequences—Idenburg
    gave de Vogel a free hand to try and contain the outbreak.45 In a private letter
    Idenburg recorded his personal recommendation to burn down entire kampongs if
    that was what it took.46 This was indeed the fate of several settlements such
    as the dessa Banjak, where ninety people out of a population of 859 were diagnosed
    with plague in rapid succession.47 The residents were moved to an evacuation camp,
    the houses burned, and the village was reconstructed on a nearby mountain slope.
    A photograph of the new village shows houses built in neat rows, made of bamboo
    poles and woven mats and roofed with thatch, with rice paddies and jungle in the
    background (figure 1.2). The rebuilt village predated the development of a new
    transmission theory of plague in Java, offering a sharp contrast to subsequently
    rebuilt houses as we will see. Primarily, however, de Vogel strove to implement
    the recommendations is-


