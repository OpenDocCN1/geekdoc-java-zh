    # Conclusion


    1911 and 1942, public health education that relied heavily on visual materials—medical
    propaganda—developed into a key public health practice in the Dutch East Indies.
    Plague was a catalyst for its development, as well as a sustained target. These
    health messaging materials and activities aimed to struct the Javanese in a new
    understanding of this disease as a bacterial, vectorborne disease hosted by rats,
    conveyed by fleas, and contracted (or indeed through) the house. On one hand,
    plague propaganda aspired to generate broader awareness of biomedical explanations
    of plague and to thereby facilitate interventions designed to counter the disease—home
    improvement. On the other hand, it sought to instill new ways of seeing and inhabiting
    the house to keep “improved” structures free of rats. From the inception of the
    home improvement scheme, plague physicians admitted that technical interventions
    in the house were moot if its occupants could not be brought to properly clean
    and inspect the renovated structure. The persistence of this two-pronged approach—home
    improvement and plague propaganda—through the 1930s indicates how'
