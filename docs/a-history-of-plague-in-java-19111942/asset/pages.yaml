    # Audiences of Home Improvement


    Home improvement grew into the signature health intervention of the Dutch colonial
    period. From its inception in 1911, the scheme was broadcast to national and international
    audiences as the most permanent response to plague in Java. The Dutch may have
    been late to the party in terms of plague research, but as one physician put it,
    they would be the only country “in which the consequences of the rat-flea-man
    transmission system were accepted in their entirety” and translated in a systematic
    attempt to widen the distance between humans and rats$^{35}$ In the realm of plague
    control, Dutch officials fancied, they came out on time. Photographs of home improvement
    found their way into lectures, fairs, and exhibitions that targeted lay and specialist
    audiences alike. And, as we have seen, they went beyond representation by taking
    foreign visitors to tour see home improvement in action. Home improvement was
    the poster child of colonial healthcare in the Dutch reform period.


