    home improvement directly. These photographs were taken by a cast of Dutch and
    Indies individuals, of whom Gerard Martin Verste was by the most first. As a physician
    with the plague service (DP) between 1919 and 1931 (director of plague control
    for Central Java after 1928) he took over 150 photographs of houses, landscapes,
    and building features before, during, and after improvement.


    As part of the larger collection of plague photographs, the images of home improvement
    fall within the remit of a visual genre that the anthropologist Ly리스 Hollis calls
    “epidemic photography.” These photographs encompass the entirety of social and
    natural life that surrounds an outbreak of infectious disease, and in Java specifically
    reveal a vivid concern with the role of the built environment in the epidemiology
