  md: '# APPENDIX 2


    # Instructions for Inhabiting

    an an Improved House


    Below is an excerpt from a series of plague regulations published in 1921, entitled
    Requirements for the Improvement of Plague-Dangerous Buildings as well as Their
    Inhabitation and Use. This section afforded a detailed list of "requirements for
    the habitation and use of buildings and commons" that had been determined by the
    head of the Dienst der Pestbestrijding in 1919. Similar regulations had existed
    since 1911 and remained in force until the end of Dutch colonial rule. The regulations
    formed a basis for both home inspection and hygiene education targeting plague.


    Beknopt overzicht betreffende hygiëne en uitvoering der pestbestrijdingsmaatregelen
    (Semarang: A. Bischchop, 1921), 38–44.


    C. Requirements for the Inhabitation and Use of Buildings and Commons


    +   1. Sleeping spaces

    (a) Sleeping spaces and balé-balés must be on feet, which reach at least one foot
    above the floor.

    (b) They must be at least one foot away of any of the surrounding walls.

    (c) They must not be placed in rooms or part of the room in which goods are stored.

    (d) It is forbidden for balé-balés to have watons made of bamboo, unless they
    have been opened up [trontong].'
