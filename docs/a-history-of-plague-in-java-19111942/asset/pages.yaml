  md: '# INTRODUCTION


    disease in Java was less remarkable for its mortality than the cultural response
    it provoked.


    Between the recognition of plague invasion in March 1911 and its virtual elimination
    by the time of the Japanese invasion in March 1942, an estimated 215,000 people
    succumbed to plague: a modest figure that plagues in comparison to the 1.5 million
    deaths attributed to the archipelago the influenza pandemic of 1918–1919 or the
    incalculable (and uncalculated) deaths caused by malaria every year.³ Yet these
    diseases did not trigger the sweeping countermeasures against plague. After identifying
    the obligate rat *Mus rattus* as the principal host or reservoir of plague in
    Java, increasing the distance between man and rat was prevented by health officials
    as the key to bringing the disease under control. Way, the plague vector—the rat
    flea, *Xenopsylla cheopis*—was denied access to humans whose preferred host had
    expired. The traditional Javanese dwelling, drawn up of bamboo and palm leaf thatch,
    discovered to offer a multitude of hiding spaces for the rat to live and nest
    in close proximity to humans without being observed. Consequently, the Dutch labeled
    the native house “plague dangerous.” They imbued historic notions of the “plague
    house” as a space of transmission with a new, transformed, and actionable reality.⁴
    In response, over 1.6 million houses were either removed or rebuilt over the last
    three decades of Dutch colonial rule in a concerted effort to “build the out”—to
    build plague (table 1).⁵ Millions of houses were more subjected to periodic inspection,
    and countless Javanese were exposed to a concurrent campaign straining to ratproof
    their practices and beliefs along their homes.⁶ Between 1911 and 1942, I estimate
    that plague control consumed no less than f.85 million and likely more (see chapter
    2). Home improvement to counter plague was not unique to Java, but the scale on
    which it was implemented (assisted Dutch state agents to colonial, domestic, and
    foreign aliens alike) most certainly was.


    This book examines the Dutch response to plague in Java. It stands at the intersection
    of colonial, medical, and environmental histories of Southeast Asia and how plague
    triggered a tremendous expansion of Dutch state power and cultural influence at
    a time when—as has been suggested—the “gangrene” had already set its claws into
    the colonial project.⁷ My argument is straightforward: prompted prompted colonial
    health intervention that was both unprecedented in scale and uniquely invasive
    in scope. If such a claim is original to plague studies to scholarship on colonial
    Indonesia, a history of plague in Java makes two significant contributions to
    the formidable body of scholarship on this disease. First, plague has tended to
    be studied and framed as a “house disease” with a distinct urban preference.⁸
    In Java, such associations between plague and the built environment were exceptionally
    strong, but the'
