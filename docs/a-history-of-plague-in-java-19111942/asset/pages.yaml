    # Organization


    In this book, I argue that plague in Java provoked perhaps the most dramatic health
    intervention of the Dutch colonial period. Plague control would have a lasting
    impact on Japanese material culture, health practices, and built environments.
    The disease and the Dutch colonial response to it facilitated unprecedented governmental
    oversight and control over the land and its various human and animal inhabitants.
    Quite likely, it constituted the far-reaching and durable colonial intrusion into
    the lives of millions. Each chapter contributes to this overall argument a particular
    angle in roughly chronological order. At the same time, these chapters seek to
    make smaller contributions to the existing scholarship on plague, colonialism,
    and the environment in late-colonial Asia.


    In chapter 1, I look at the initial outbreak of plague in the district Malang
    in March 1911 as the fulfilment of a process of “anxious suspense” in which physicians
    and officials feared the introduction of plague into the Dutch East Indies. How,
    this chapter asks, were notions of the role of the house in plague transmission
    rearticulated traditional bamboo dwellings of the Javanese at the center of Dutch
