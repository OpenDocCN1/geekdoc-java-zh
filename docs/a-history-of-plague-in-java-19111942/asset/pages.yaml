    ca. 1919. G. M. Versteeg, House at Tjapar with Home Improvement. Kastelij, Snijders,
    and Fischmann with Mantri Home Improvement, ca. 1919, TM-60012999. Courtesy of
    the Nationaal Museum with Worldercultures.


    of the Dutch colonial period that was implemented in response to the out-break
    of plague in 1911.


    Plague is a bacterial disease that manifests predominantly in three distinct but
    equally graphic forms that continue to inform the pandemic imaginary.¹ It is a
    zoonotic disease, strictly speaking, normally crossing over animal reservoirs
    in small mammals to humans by the bite of an infected flea or by the handling
    of infected animals. In its most common and least deadly bubonic forms develop
    acute febrile symptoms and characteristic lymphadenopathy (lymphatic swellings)
    in the groin, armpit, and neck: buboes. The disease overwhelms the immune system,
    and patients may ultimately succumb to organ failure. Bubonic plague may progress
    into septicemic plague, or rare victims develop this form through direct contact
    with an infected source. Here, plague bacilli infect and cause blood clots, tissue
    death, organ failure, and endotoxic shock. Finally, plague may advance to the
    lungs, causing coughing, coughing up, and ultimately respiratory failure. This
    form alone is transmissible directly between humans, by breathing in highly infectious
    particles exposed by patients through coughing or sneezing. Pneumonic plague is
    invariably fatal without treatment.² As with outbreaks of plague at the turn of
    the nineteenth and twentieth centuries elsewhere, the'
  merge: -1
