    # Medicine and Colonialism in the Indies


    This turbulent era of war and decolonization is at present extensively searched.
    in the Netherlands and Indonesia, four academic institutes recently completed
    a five-year government-supported investigation into the nature, causes, and consequences
    of Dutch violence between 1945 and 1950. This project emerged from a broad societal
    call to reassess the dark side of the Dutch colonial past, with slavery as another
    topic of intense public and scholarly attention. A broader understanding of the
    physical forms of violence under Dutch colonialism is long overdue, but it is
    imperative not to lose sight of other (and perhaps less self-evident) facets of
    the coercive nature of Dutch colonial rule. "While the violent character of the
    colonial regime can be taken for granted," observed the historian Marike Blomberg
    in 2007, "there is still much that we do not know about the actual practice of
    implementing state violence in colonial Indonesia." The domain of health, disease,
    and medicine is certainly worth exploring in this regard—the history of plague
    in Java islets. Forced evacuations, mandatory rations, regular home inspections,
    forcing people into debt, the alteration of landscapes and art forms, neglecting
    a phenomenon as wonongbereteringsmalaria, the propagation of it all by foreign
    medical cosmology, the documentation and representation of it in all photographs,
    and all their attendant social, cultural, and environmental consequences were
    not a form of "colonial wellness" as well? Scholars have long since demonstrated
    the complex relationship between medicine and empire in other contexts. From crude
    arguments of medicine as a "tool of empire" to sophisticated analyses of the ways
    in which local and colonial medical traditions interacted, they have shown how
    colonial persists reverber into present-day health challenges and shape global
    health structures and practices. Until recently, such histories took very little
    cognition of the Dutch empire. If we are indeed to arrive at a better-standing
    of the impact and afterlives of Dutch colonial rule, however, the realm of medicine
    is in urgent need of further scholarly attention.


    In this book, I have traced how the introduction of plague in Java in 1911 prompted
