    # Plague in Java


    Despite enduring concerns that plague could find its way into the Dutch East Indies,
    the colonial government and its health services were poorly prepared when the
    disease was recognized in March 1911. Plague was a predominantly urban disease,
    and the fact that it somehow leaped over major port cities and apparently entrenched
    itself in the rural interior of East Java baffled officials and physicians alike.
    Malang, the capital of the eponymous district in the residency Paseroean, had
    developed rapidly since the late nineteenth century as a center of the local plantation
    economy. Its higher elevation and cooler climate had, ironically, lent the region
    as a health resort for European colonials.⁵ The public health services of Malang
    had however not kept pace with the construction of neoclassical villas, “Swiss-chalets,”
    and hotels, alowing the introduction of plague to be overlooked. As discussed
    in the introduction, even at major port cities precautionary measures against
    plague had been minimal. As of 1911, there were barely two functioning quarantine
    stations in the vast archipelago.⁶ Every three months, one newspaper claimed the
    government purchased small amounts of plague serum from the Pasteur Institute
    and distributed it between a few towns in case of an outbreak. The efficacy of
    this serum was not beyond, and its supply was certainly inadequate.⁷ In fact,
    the Indies had not possessed a civil medical service until January 1911. When
    the plague bacillus was identified in Malang, this civil medical service (Burgerlijke
    Geneeskundige Dienst, BGD) was, as Jan der Waal Malefeit, the Dutch minister of
    colonies, put it, “still in diapers.”⁸


