    # The Plague Service


    The calamity of plague in Java had demanded the full attention of the recently
    organized BGD and caused its uneven development over the 1910s. Chronically understaffed,
    the health organization was unable to address the myriad challenges facing the
    archipelago.⁷³ The forceful response to plague in 1911 followed by its apparent
    containment over 1912 gave the impression that this disease, at least, was under
    control. In both years, the total number of reported deaths hovered around 2,200.
    But over the next two years the number of cases rose quickly (introduction, table
    1). In 1913, over 11,000 cases of plague were reported, joining to nearly 16,000
    in 1913. The situation in Malang, where home improvement had advanced further,
    was of particular concern. Here alone, plague deaths rose from 1,503 in 1912 to
    6,918 in 1913.⁷⁴ As plague resumed with the vengeance, an independent plague control
    service (Dienst der Pestbestrijding, DP) was created in January 1915 to relieve
    the BGD and the Dutch response to plague.


    Given that plague had returned to Malang, the efficacy of home improvement was
    in doubt. Back in the Netherlands, politicians questioned the wisdom of abandoning
    alternative control methods early.⁷⁵ Renewed experiments with fumigating dwellings
    in 1913 were stepped up in the wake of a second visit by Idenburg to the plague-stricken
    districts in February 1914.⁷⁶ Over the first months of its existence, however,
    the head of the DP, Wilhelm van Gork, quickly denounced fumigation as nothing
    more than a costly, unrestly, and laborious all of home improvement. In many instances,
    his team maintained, free lives had been even after fumigation, and experiments
    had further demonstrated the tenacity of plague in the face of chemical eradication
    methods. The assistant-resident of Malang voiced a string of other objections
    in a letter of March 17, 1915. As a preventive strategy, fumigation was of no
    use, he wrote, and like home improvement was slow. It did not replace the need
    to evacuate people from their homes for extended periods of time, and the method
    required considerable manpower that dessa residents'
