    # Conclusion


    In the decade following the outbreak of plague in East Java, Dutch officials fine-tuned
    their response to the disease. Other control measures were abandoned in favor
    of house improvement that sought to increase the distance between the plague host—the
    house rat—and humans. The scale and scope of this intervention gradually increased,
    however, as plague expanded westward. In response, plague control was placed in
    the hands of a dedicated organization that concentrated on the identification,
    renovation, and inspection of plague-dangerous dwellings. The BGD had continued
    to rely on the regulated use of bamboo, the DP had but prohibited its use. The
    imaju roof was likewise prohibited. The replacement of these ubiquitous construction
    materials placed new pressures on the availability of timber and more species
    of tiles: requiring the creation of new industries where plague reigned. These
    challenges became increasingly acute when the disease reached Central Java, prompting
    a desire to return to the regulated use of native construction materials while
    adhering to the goal of breaking humanhabitation.


    The impact of plague control on the Javanese landscape and Javanese material culture
    was tremendous. The "idyllic" bamboo house that seamlessly'
