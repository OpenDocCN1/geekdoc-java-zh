    After successive defeats of the American, Australian, British, and Dutch forces
    in the region, Japan invaded Java on March 1, 1942, and quickly overran its defenses.
    Within a week the governor-general surrendered and a Japanese military administration
    took charge. The European civilian population as well as Allied prisoners-of-war
    were placed in internment camps. The Eurasian community (the-called Indo population)
    was permitted to live outside the camps but was subject to strict regulations.^26


