    # The Model House


    As early 1911, de Vogel and van Loghem "attempted to build a native house of indigenous
    materials, in which the rat will find it hard to settle." The appeal of such a
    structure lay in the fact that it could be made with cheap and locally available
    construction materials, with minimal infringement on local Javanese building practices.
    Preoccupied by their recent discovery that the rat lived and nested inside the
    hollow bamboo frame of the native house, their model structure consisted entirely
