    home improvement scheme ostensibly sought to break human-rat cohabitation at once
    reshaped Javanese architecture, material culture, landscapes, environments, and
    social relations. And by replacing at roofs tiles or metal covers, the renovations
    literally “revealed” previously obscured villages and populations to colonial
    administrators. The rapid acknowledgment that no measure of improvement would
    ever make a house insensibly rat resulted in an increasingly systemic hygienic
    education and home inspection scheme that expanded Dutch colonial oversight further
    still. It also extended Dutch cultural influence by inducing Javanese populations
    to see their dwellings in new ways, reform domestic and hygienic practices, and
    lay a foundation for a broader “appreciation” of European scientific medicine.


    The fact that plague control was more than health alone is perhaps most powerfully
    illustrated by the sizable archive of plague photography. These images overwhelmingly
    emphasized the responsive nature of the Dutch colonial government to this health
    threat. They present physicians, officials, laborers, and residents had at work
    at countering the outbreak. Most of all, they sought to demonstrate the “visible”
    improvement that the Dutch policy of home improvement wrought in people, houses,
    and landscapes. In other words, I have to demonstrate throughout, plague control
    of a spectacle of Dutch colonial rule in the Indices. It offered visual evidence
    of the need for this intervention as well as the scale on which it implemented,
    and in doing so justified existing colonial relations. The tremendous scale and
    impact of the home improvement scheme were as evidence of the Dutch commitment
    to its new “ethical” course in colonial governance—all the while intimating that
    continued colonial oversight and control were indispensable for the present moment.
    Naturally, the coercive forces of the scheme remained out of sight. The extensive
    use of plague photography employed in the Indies, the Netherlands, and indeed
    alongside other visual materials such as maps, graphs, and models—was proof of
    Dutch scientific acumen and colonial ability. This propagandistic use of home
    improvement as a representation of the benign nature of Dutch colonial rule was
    increasingly evident over the 1910s and 1920s. The overriding importance of this
    function was starkly illustrated by the fact that home improvement continued in
    the 1930s when it had implied as the cause behind fresh outbreaks of malaria—and
    still when it persisted when vaccination offered a powerful and cost-effective
    alternative. In the end, it appears that the aesthetics of plague control in Java
    were simply more important to the Dutch colonial government than its efficacy.'
