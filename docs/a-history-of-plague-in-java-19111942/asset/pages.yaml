    Almost immediately after home improvement was decided on the principle plague
    control strategy—about August 1911—it became clear that this intervention alone
    could never beat the rat. On inspection, renovated houses were once more found
    to contain rats’ nests. Villages from which plague had been eradicated fell prey
    to the disease once more. What was needed in conjunction with the technical intervention
    in the house, was a behavioral adjustment in the way it was inhabited. “Lumber,
    under boxes, and matsowed away in dark corners, in lofts, or under bal-balés,
    must be cleared from time to time to be examined or thrown away,”¹⁵ admonished
    van Loghem, who had first recognized the vitality of such spaces to rodent populations.'
