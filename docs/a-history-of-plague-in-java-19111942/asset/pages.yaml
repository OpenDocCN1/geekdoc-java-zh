  md: '# APPENDIX 1


    # List of Key Government Officials


    Below follows a list of key officials in the Dutch East Indies who were involved
    in the organization of healthcare in the colony between 1911 and 1942, with their
    dates in office. Between 1925 and 1930, there appears to have been no formal leader
    of the department of plague control and the organization of this scheme was unambiguously
    divided between the head of the Public Health Service and the senior plague physician
    in Central Java (the center of the epidemic at the time). Officials were often
    appointed on an “acting” basis, for instance to cover extended periods of furlough
    for their colleagues or in anticipation of a formal appointment.


