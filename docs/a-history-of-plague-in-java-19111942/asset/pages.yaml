    # Conclusion


    At the beginning of 1911, longstanding anxieties that plague might enter the Dutch
    East Indies were realized. When the disease was recognized at the end of March
    in the rural interior of East Java, the colonial health services responded forcefully,
    though in a manner that betrayed enduring uncertainties in their understanding
    of the nature and transmission of plague. The initial difficulty in confirming
    rats as the animal host of plague was resolved over the months of June and July
    by a “systematic” investigation of the houses of human plague victims that revealed
    an unexpected proximity between human and rat dent “bamboo dwellers.” Photographs,
    tables, and diagrams mapped out the presence of the house rat within the traditional
    Javanese dwelling, and were relied to formulate a nascent (and distinctly Javanese)
    plague ecology. This protoecology concentrated on the use of “native” construction
    materials as well as building designs that were seen to actively facilitate human-rat
    contact and thereby allow infected rat fleas to cross the species boundary. These
    first months of investigation consequently established the house as both a space
    and a vehicle of plague transmission, but simultaneously as the weakest link in
    a reformulated rat-flea-man transmission scheme. This framing laid a foundation
    for one of the most far-reaching and invasive health interventions of the Dutch
    colonial period.'
