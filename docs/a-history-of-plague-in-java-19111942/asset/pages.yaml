  md: '# INTRODUCTION


    Great Plague (peaking in Eurasia between 1346 and 1353), better known as the Black
    Death. Both events had led to such enormous loss of life and to periods of social
    instability that “plague” had to be framed in eschatological terms. It was seen
    as the disease at the end of human existence.$15$ That is to say, when plague
    became an object of knowledge of European scientific medicine at the turn of the
    nineteenth and twentieth centuries, physicians and officials seeking to study
    and control the disease operated “under the bane of its perceived ability to wipe
    out humanity.$16$


    On Hong Kong declared an “infected” port on May 10, 1894, its colonial government
    acceptance of a Japanese team of bacteriologists led by Kitasato Shibasuburō—an
    apprentice of Robert Koch. His arrival was followed shortly after that of Alexander
    Yersin, a product of the school of Louis Pasteur, who worked in nearby Saigon.
    As representatives of new and rival medical schools that led the way in microbiology,
    they were on a mission to identify a possible causative organism of the dread
    disease. The story of their competition has become legendary. Kitasato was welcomed
    by the British health service, which furnished him with laboratory space and provided
    samples from plague corpses for his experiments. Yersin was forced to set up shop
    in a makeshift bamboo shed and had to procure samples illicitly.$17$ The two identified
    the plague bacillus within one of another. Kitasato announced his discovery first
    and with the backing of the directing health officials in Hong Kong, but his account
    was contradictory and his samples were polluted.$18$ Yersin''s later communication
    with clear microographs was favored, and the bacterium named after his mentor:
    Pasteella pestis.$19$


    The landmark discovery of the plague bacillus has been equipped with the discovery
    of the plague itself as a discrete entity, but it did nothing to explain its origin
    or transmission.$20$ Over the following years, plague spread around the world
    and Hong Kong became the center of a global pandemic: a plague out. In 1895, the
    city was free of cases, though plague manifested in the neighboring Portuguese
    colony Macau. In 1896, plague “came again” and recur annually in Hong Kong until
    1921.$21$ Also in 1896, the disease broke out in the port city of Bombay, from
    which it spread across British India. Two years later, plague was introduced into
    Mauritius and Madagascar may have “leaked” from Yersin’s laboratory in Nha Trang
    to cause a local outbreak.$22$ In 1899, plague outbreaks were reported in Manila,
    Honolulu, Porto, and Alexandria. San Francisco, Buenos Aires, Rio de Janeiro,
    and Sydney hosted outbreaks in the same year, and in 1901 there was an outbreak
    in Cape Town. Given the location of the Dutch East Indies at the crossroads of
    routes of trade between South and East Asia, the Americas, and Australia, the
    failure of plague to establish itself in the archipelago about this time'
