  md: '# TECHNICAL NOTES


    This book considers the Dutch response to plague in late-colonial Java. While
    the use of modern Indonesian spelling is generally preferable for scholarship
    on this region, I have chosen for the sake of clarity and consistency to adopt
    colonial-era spelling for Indonesian place names throughout (e.g., Soerabaja,
    Madioen, and Priangan). The words Dutch titles and organizations have been translated
    into English in the main body of the text with noted exceptions. Where relevant,
    abbreviations are used based on the original Dutch (e.g., BGD for Burgerlijke
    Geneeskundige Dienst and DP for Dienstbestrijding). "improved" and "improvement"
    in relation to the renovation of houses and villages throughout as plague control
    are used as descriptive (as opposed to qualifying) terms.


    The official currency in the Dutch East Indies was the guilder (f). Financial
    and other numerical data presented in this book are often approximations compiled
    from multiple sources (see chapter 2).


    Through the colonial period, Java was the most tightly controlled island in the
    Dutch East Indies. It boasted a large and diverse population that grew from approximately
    4.5 million in 1815 to over 40 million by 1930. The colonial government was run
    by a corps of civil servants; interior government known as Domestic Government
    (Binnenlands Bestuur, BB). Administratively, the island was divided into approximately
    twenty-two residencies (consist) of several *afdelingen* (districts) that were
    led by a resident and *assistant-resident*, respectively. These districts tended
    to overlap with historic *regenschappen* (regencies) that were led by a figurehead
    *regent* (regent). More locally, Dutch administrators collaborated with the (assistant)
    *wedono* (district chief) and *loerah* (village chief). The principalities of
    Djokajarta and Soakarta in Central Java remained nominally independent. The central
    colonial government was based in offices in Batavia (present-day Jakarta), its
    suburb Weltevreden, and the elevated cities Buitenzorg (Bogor) and Bandoeng. It
    was led by a governor-general appointed by the Dutch government in The Hague.'
