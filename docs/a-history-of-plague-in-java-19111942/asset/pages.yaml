    # FILM


    If lectures, traveling exhibitions, museums, and newspapers failed to reach audiences,
    then perhaps parts of Dutch society would finally learn about plague and plague
    control in the Indies through a medium with true mass appeal. Late in 1926, the
    physician J. J. van Lonkhuyer, leader of the DVG, asked the well-known filmmaker
    Willy Mullens to produce what would become known as the plague film. The seventy-long,
    three-part assembly that resulted from this collaboration stands out as one of
    only a handful of films on plague amongst another vast visual archive.⁷⁶ is a
    silent black-and-white film interspersed with Dutch and Malay subtitles. The film
    includes live-action shots, animated sequences, and various bits of static and
    animated scientific imagery. These elements comprise to explain the nature, transmission,
    and control of plague in Java since 1911. As a whole, however, De post Java is
    a curious blend of the ethnographic and the educational—as observed when it came
    out.⁷⁷


    The plague film captured home improvement in motion pictures for the first and
    possibly last time. It contains long shots documenting various stages of the process.
    First comes the methodological dissection of the traditional Javanese house, which
    leads to the discovery of rats and nests hidden inside the bamboo beams and at
    roofs. Next, the structure is unroofed, renovated, and finally inspected. Wide-angle
    shots of villages before improvement (‘blending into the green background,’ as
    Willem de Vogel might put it) are contrasted with neatly tiled houses having undergone
    improvement. A Dutch newspaper commented:


    It is made clear, that the chief cause [of plague] rests within the defective
    housing conditions of the Javanese, as each house offers accessible nesting spaces
    for rats, the spreaders of the epidemic. Everywhere, where more modern houses
    arise, the disease reduces in intensity before their eyes.⁷⁸


    The natural history of plague, bacteriological investigations, medical treatment,
    and the role of rice in the “metastatic” spread of plague are all covered. A significant
