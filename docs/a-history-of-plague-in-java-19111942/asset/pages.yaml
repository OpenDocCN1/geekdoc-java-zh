    # Of Rats and Man


    In principle, both the Vogel and van Loghem—the de facto leaders of the plague
    control work—were to converts to the rat-flea-man transmission theory. This theory
    that a plague rat was disease transmitted secondarily to humans by the rat flea
    after the demise of its original host. The specifics of this transmission scheme
    in Java were of great concern. What rats were involved? Which fleas?96 The quarantine
    imposed on Malang, according to Vogel, was justified because “we know almost nothing
    of the rats within the affected districts.”97 On arriving in Malang on May 16,
    van Loghem could distinguish between three major varieties of rat in East Java.
    The prevailing type, Mus rattus, divided between a “house,” or dessa, and a “field,”
    or sawah type. Since the rat-flea-man model required “a close contact with the
    sick rat and man” in order for infected fleas to be able to make the species jump,
    suspicions had settled on the normally ubiquitous rat as the principal host of
    plague—which would reaffirm the role of the house as a space in which transmission
    occurred.98 The question as to how field rats remained unanswered—the local population
    stated that this species played a role in the dissemination of plague between
    villages.99 Meanwhile, the common rat flea Xenopis cheopis, the principal vector
    of plague, was certainly abundant in Malang but so were other species. Might other
    “common parasites” between humans and rats play a role in transmission?100 And
    how were humans implicated in the spread of plague?


    To answer these and other questions, the Malangese were encouraged by a small
    fee to catch as many rats as possible and deliver them to de Haan’s improvised
    laboratory for examination. The precautionary measure to dip'
