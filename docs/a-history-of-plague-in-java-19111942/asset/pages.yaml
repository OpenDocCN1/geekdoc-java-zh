    # THE BANDOOENG RURAL HYGIENE CONFERENCE


    The FEATM, the League of Nations, and the Rockefeller Foundation certainly were
    the most prominent organizations to pursue international health collaboration
    in early twentieth-century Asia. Their professional support of health improvement—even
    Heiser’s reluctant praise—could be constructed by Dutch officials to reflect positively
    on their colonial project as a whole. But the endorsement of the scheme was yet
    to come.


    In August 1937, the Dutch East Indies hosted an Intergovernmental Conference of
    Rural Hygiene in Bandoeng under the auspices of the League of Nations. It became
    a landmark in the history of public health.¹⁴ First, the meeting explicitly recognized
    that health was tied to broader social and economic processes. Second, it stressed
    the importance of local conditions and community participation to the success
    of health interventions. And third, it advocated an international health agenda
    focused less on the control and eradication of individual diseases but more on
    the provision of primary healthcare. To address the most pressing health questions
    facing East, South, and Southeast Asia, it sought to develop an intersectional
    approach. The Bandoeng Rural Hygiene Conference frequently connected physicians,
    agronomists, engineers, and other experts to articulate responses to challenges
    in sanitary infrastructure, medical training, nutrition, education, the position
    of women, and indeed the high incidence of infectious disease. This focus was
    quickly lost again—in the wake of World War II—new such as DDT prompted a return
    to top-down disease eradication models. It was rekindled in 1978 with the Declaration
    of Alma-Ata on the importance of primary healthcare, which was explicitly framed
    as the “resurrection” of the health ambitions that had been articulated in Bandoeng.¹¹⁵


