    # Colonizing the Home (II)


    According to the anthropologist Sylvia Goosit, traditional Javanese housing knew
    very little in its basic floor plan. The rank, class, and social relations of
    its inhabitants were apparent in the size of the house and in the construction
    materials used. Primarily, they manifested in the shape and style of the roof.^91
    While health officials had been concerned since 1911 with the ability of the ancestral
    roof to nest inside the atop cover, as far as I can tell roof design was not a
    specific concern when plague was organized by the BGD. But from its first quarterly
    report in April 1915 onward, the DP expressed its fear that specific roof designs
    were conducive to rat nesting and hence plague transmission. Cross-crossed by
    wooden and bamboo beams, the regions of the inside of the roof were often too
    dark and too high to be easily searched. If a plague rat died, its fleas could
    easily drop onto human victims. Thus, dictated by Gork, the roof construction
    must be as simple as.^92 Diagrams and sketches of undesirable roof designs featured
    frequently in the DP’s reports, and regulations (such as for the type of roof
    tile) tightened over time.


    Hipped roofs such as the joglo designated the inhabitants of a dwelling as members
    of the Javanese aristocracy. The shape was forbidden in new buildings in plague-affected
    districts, as was the use of atop or other plant material. The same went for the
    similar pendopo form used in government buildings, and rampasan roofs. These shapes
    were ideally replaced but could be retained if they were tiled: the use of natural
