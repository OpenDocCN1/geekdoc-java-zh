    We could have defined `viewp` and `editp` from `person` to `content` instead,
    but then we want definitions for `viewp` and `editp` to be uniform to the definition
    for `page` in the abstract machine, and therefore to be able to use operators
    like `⊂` or `⊆` to compare page content and permissions on content directly.


    ![image](images/pg74_1.png)


    `INV-1` introduces a static hierarchy between the two access permissions, and
    `INV-2` describes a safety property of the system whereby the owner of a content
    item may access it in any possible way.


    ![image](images/pg74_2.png)


    Refinement machines must keep a palpable behavioral relationship with its abstraction
    (abstract machine). This relationship is modeled through a `gluing invariant`
    property that relates variables of the refinement machine with variables of the
    refined machine. Roughly speaking, a refinement model should be such that it can
    replace the refined (abstract) model without the user of it noticing any change.
    Next, we describe some properties about gluing invariants.


    * Gluing invariants are defined in the refinement machine.

    * Gluing invariants relate the state of the refinement machine to the state of
    the refined machine.

    * Gluing invariants must be preserved by the events of the refinement machine,
    therefore, the gluing invariant generates POs that the refinement machine must
    verify.

    * As a refinement event `refines` or `extends` an abstract (refined) event, concrete
    events must comply with invariants of the refined machine reachable through the
    gluing invariants.


    We introduce a gluing invariant that relates view permissions in the refinement
    machine with page content in the refined machine: every view permission on a person’s
    content is defined over the existing content in her page. Note that one does not
    need to add a similar invariant that relates edit permissions and page content;
    this invariant would be inferred from invariants `@invr13` and `@invr16`.


    ![image](images/pg75_1.png)


    `FUN-4` refers to the dynamic part of the refinement machine, for which we write
    a `grant-view-permission` event. `@grd1` and `@grd2` typeset content `c` and the
    person `p` to whom the permission will be granted. `@grd3` expresses a defensive
    style of writing specifications: We want to grant permissions to content items
    that do not have those permissions already. The job of `@grd4` is to preserve
    `@invr16`. As we are adding an element to `viewp`, either we add the same element
    to `page`, or we require the element to exist in `page`, as we have.


    ![image](images/pg75_2.png)


    Poporo implements some functionality that deletes network content. Event `delete`
    deletes a content item `c` and all the content items in `cts` from all the pages
    in the network. The intended meaning of `cts` will be clearer when we refine the
    observation about the system (see [Section 4.7](#12_Chapter04.xhtml_ch4_7)). `@grdr11`
    typesets `c`. `@grdr12` prevents the event from leaving `owner(c)` with an empty
    page. `@grdr13` typesets `cts`.


    [Section 4.7](#12_Chapter04.xhtml_ch4_7) shows the observations of principal and
    secondary content. [Section 4.8](#12_Chapter04.xhtml_ch4_8) shows what POs are
    generated for further observations (refinements) to be correct.


    ![image](images/pg75_3.png)


    ## 4.7 FURTHER STRENGTHENING


    We add the observation of page fields. Each content item belongs to some field.
    Content fields model the typical situation in social networks in which people
    comment on certain content-item. The comment is a field or secondary content item
    and the commented content item is a principal content item. A field belongs to
    a unique principal content; the same way a photo belongs to a unique photo album.
    Deleting a principal content item entails deleting all its fields, the same way
    that deleting a photo album would entail deleting all its photos, or deleting
    a content item would force one to remove all the content item comments too. Its
    owner can only remove a principal content item. Expression `field∼[{c}]` returns
    all the secondary content items whose principal content item is `c`. Definitions
    for principal and secondary content are given next.


    ![image](images/pg76_1.png)


    Events can be refined by using either a `refines` or an `extends` keyword. These
    two mechanisms are alike. An extending event implicitly includes parameters, guards,
    and actions of the extended event; a refinement event does not. A refinement event
    can additionally declare a `witness` (using the clause `with`) for every disappearing
    parameter of the abstract event. A witness for a parameter `x` in the refined
    (abstract) event is a property `P(x)` declared in the refinement (concrete) event,
    typically written: “`with @x P(x).`”


    ![image](images/pg77_1.png)


    Event `delete-principal` refines event `delete`. Parameter `cts` is a disappearing
    abstract parameter which we model in the concrete event as `field∼[{c}]` with
    a `with` clause. Therefore, parameter `c` is a principal content and `cts` are
    all its fields. The three actions of the abstract event are repeated in the concrete
    event, yet not show explicitly. The fourth and fifth actions in the concrete event
    are written not to break invariants `@invr13` and `@invr16`.


    The same event can be modeled in a more succinct way by using `extends` keyword.
    Nevertheless, a `refines` keyword offers more possibilities for (data) refinement.
    Had we defined a concrete machine invariant that relates either `content`, `owner`
    or `page` with the state of the abstract machine, we would not have needed to
    repeat the first three actions, but instead we could have expressed them by the
    gluing invariant. The definition of refinement events generates POs for the adequacy
    and correctness of the events. [Section 4.8](#12_Chapter04.xhtml_ch4_8) explains
    the POs that are generated for event `delete-principal`.


    ## 4.8 REFINEMENT PROOF OBLIGATIONS


    Refinement POs are generated to attest about the correctness of refinement events.
    The refinement invariant PO rule in [Figure 4.7](#12_Chapter04.xhtml_fig4_7) is
    similar to the `INV` rule depicted in [Figure 4.2](#12_Chapter04.xhtml_fig4_2),
    except that rule in [Figure 4.7](#12_Chapter04.xhtml_fig4_7) accounts for both
    abstract and concrete machine invariants. The concrete machine invariant `J` depends
    on both the abstract and concrete machine variables `v` and `w`, respectively.
    `H` is the concrete event guard, and `y` is the set of concrete event parameters.


    ![image](images/pg78_1.png)


    Figure 4.7: Invariant PO for refinement events.


    Invariant POs are generated with respect to a particular event action that might
    invalidate the invariant. For instance, Rodin generates the PO `delete-principal/invr18/INV`
    below for event `delete-principal` with respect to invariant `@invr18` and even
    action `@actr27`. The first hypothesis below is the concrete machine invariant.
    The second and third hypotheses are the concrete event guards. The goal is the
    modified concrete machine invariant. The witness predicate about `cts` is expanded
    (unfolded) in the goal. Abstract machine invariants are not included explicitly
    as hypotheses but unfolded in the goal tool.


    The *lasso* functionality of Rodin allows one to see all the hypotheses generated
    as explained in [Section 4.4](#12_Chapter04.xhtml_ch4_4). We do not show the other
    concrete machine invariants either, as they are not needed to discharge the PO.


    ![image](images/pg79_1.png)


    Figure 4.8: Invariant PO for delete-principal.


    PO rule `GRD` below attests to the obligation for the abstract event to be enabled
    whenever the concrete event is. The concrete event guard must be stronger than
    the abstract event guard.


    ![image](images/pg79_2.png)


    Figure 4.9: Guard PO for event refinement.

