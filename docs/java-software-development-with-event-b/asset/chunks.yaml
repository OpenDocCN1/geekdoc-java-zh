    We present below the definition of the event `add-user` which add a fresh user
    to the chat system. Event guard `@grd1` guarantees that user `u` is a fresh user.
    Action `@act1` adds `u` to the sets of users. Action `@act2` initializes `u`’s
    chat-content to `∅` (the empty set).


