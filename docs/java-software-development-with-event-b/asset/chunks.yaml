    ## 3.4 EVENT B 中的 MACHINEZERO


    我们在此展示 MachineZero 的形式化。一个核心概念是机器不变性（machine invariant）。EVENT B 中的不变性有多种类型，即：(i)
    类型不变性，例如用户 `∈ USER`，表示用户是 `USER` 的子集；(ii) 粘合不变性（gluing invariants），将蓝图的抽象状态与其具体状态联系起来；以及
    (iii) 限制变量状态的不变性。上述第三类可能包含在软件需求文档中。第一类和第二类不变性未包含在内，因为它们是 EVENT B 特有的。


    我们首先查看抽象机器的上下文，它引入了两个载体，即 `USER` 和 `CONTENT`，用于对聊天系统中注册的所有用户以及它处理的所有内容。


    ![image](img/pg32_1.png)


    表 3.2 中的前两个不变性是通过在模型中引入两个集合变量来实现的；第一个变量持有已注册到聊天系统的用户，第二个变量持有所有交换的内容。


    ![image](img/pg32_2.png)


    表 3.2 中的不变性 3 是通过一个声明 `chat` 为用户之间关系的不变性来实现的。不变性 4 是通过 `chat` 是一个二元关系这一事实实现的。将
    `chat` 建模为集合强制了 表 3.2 中的第五个不变性，因此，聊天会话中的元素对不会重复重复。


    ![image](img/pg33_1.png)


    实现 表 3.2 中的第六个不变性需要更细致的分析，因为它涉及到内容、内容的发送者和接收者。下方的变量 `chatcontent` 引入了聊天内容。该变量被定义为域为
    `user`（发送消息的人）、值域为 `content ⇸ ℙ(user)` 的部分函数，其中 `content` 是发送的内容，而 `ℙ(user)` 是接收该内容的用户集合。由于
    `chatcontent` 是部分函数，因此可能存在一个未与任何人聊过的用户。`chatcontent` 的值域也是部分函数，因此可能存在某个用户没有与某个特定用户聊天。由于
    `chatcontent` 及其值域都是函数，在 `u1` 存在于 `chatcontent` 的域且 `c` 存在于 `chatcontent(u1)`
    的域的情况下，用户 `u1` 发送内容 `c` 的用户集合被唯一地表示为 `chatcontent(u1)(c)`。


