    \ 是一位软件工程师、计算机科学家和热衷的形式化方法开发者。他的主要研究领域是形式化方法在软件工程中的应用。Néstor 擅长使用 `JML` 和设计设计进行程序规范与验证，并精通名为\
    \ `EVENT B` 的形式化方法。他的主要目标是构建形式化方法工具，以增强人们对系统正确行为的信任。他的主要工具贡献包括 `EVENTB2JAVA` 和\
    \ `EVENTB2JML` 代码生成器、`EVENTB2DANY` 证明责任生成器，以及 `JML` `assign` 子句的语法检查器。Néstor 关于\
    \ `EVENTB2DANY`的研究得到了微软研究院 2011 年 `SEIF` 项目的资助。他自 2004 年以来一直从事学术工作，定期向研究生和本科生教授软件工程、形式化方法和编程课程。\n\
    \nCollazos 博士在巴黎七大学获得计算机科学硕士和博士学位。他目前正在加州大学伯克利分校攻读信息与网络安全硕士。\n\n"
