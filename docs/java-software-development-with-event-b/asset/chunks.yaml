    ## 3.5 EVENT B 中的 MACHINEONE


    *机器细化*(Machine refinement)* 是 EVENT B 提供的扩展或详细机器行为和功能的机制。在 EVENT B 中，*细化机器*的所有组件都包含在*细化机器*中，要么是显式的（机器变量、机器变量初始化、使用
    `refines` 定义的细化事件的守卫和动作），要么是隐式的（使用 `extends` 定义的内变式、守卫和动作）。下方的机器 `machine1` 查看
    `machine0`，因此它细化了其所有功能。它还引入了变量 `toread` 以编码 US EX-01。该变量存储了所有待读的聊天内容。


    下方的变量 `user`、`content`、`chat`、`active`、`chatcontent` 和 `muted` 由 `machine1` 显式细化。该机器包含了两个初始为空的变量
    `toread` 和 `inactive`。注意，`initialization` 事件没有初始化任何抽象变量 `user`、`content`、`chat`、`active`、`chatcontent`
    或 `muted`，因为它们在 `machine0` 中已经初始化。`machine1` 查看 `machine0` 相同的上下文 `ctx0`。


    ![image](img/pg39_2.png)


    不变式 `@invr11` 和 `@invr12` 将 `toread` 和 `inactive` 声明为 `user ↔ user` 类型关系并包含在 `chat`
    中。不变式 `@invr13` 约束 `chat` 为 `active`、`toread` 和 `inactive` 的并；`active` 和 `toread`
    是不交集，`active` 和 `inactive` 也是如此，然而聊天会话可能同时是 `inactive` 和 `toread`。


    ![image](img/pg40_1.png)


    US EX-01 *静态地*通过所有操作 `toread` 或 `active` 变量的不变式实现，并*动态地*通过 `machine1` 中引用这些变量的事件编码来实现。


    机器事件通过使用 `extends` 子句在细化机器中隐式细化。下方细化事件 `unmute-chat` 的参数是 `u1` 和 `u2`，加上 `machine1`
    中声明的新参数（空集）。下方细化事件 `unmute-chat` 的守卫是来自抽象事件的 `@grd1`、`@grd2` 和 `@grd3`，加上 `machine1`
    中声明的新守卫（无）。事件 `unmute-chat` 的抽象动作也是如此，即 `@act1 muted ≔ muted ∖ {u1↦u2}`，它隐式地出现在下方的具体
    mute-chat 事件中。


    ![image](img/pg40_2.png)


