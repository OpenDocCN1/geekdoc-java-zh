    B 模型由 `contexts`（上下文）和 `machines`（机器）组成。上下文定义了常量、未解释集以及它们以 `axioms`（公理）表示的属性，而机器定义了变量及其属性，以及表示为事件的状态转换。初始化事件计算机器的初始状态。一个事件由一个
    `guard`（守卫条件）和一个 `action`（动作）组成。守卫条件（写在关键字 `where` 和 `then` 之间）代表了为了触发该事件，在某一状态下必须满足的条件。动作（写在关键字
    `then` 和 `end` 之间）为状态变量计算新值，从而执行可观测的状态转换。如果系统进入了一个一个没有事件守卫条件被满足的状态，它将停止并被认为发生了
    `deadlocked`（死锁）。EVENT B 系统并不要求必须停止，事实上，大多数 EVENT B 模型代表的是无限运行的系统。如果需要停止，可以使用
    `convergent` 事件进行建模，这种事件会单调地减少称为机器 `variant`（变体）的自然数表达式的值。此类事件只能在 `variant` 值为负的状态下被触发。此外，系统可能会进入一个多个事件的守卫条件同时满足的状态。在这种情况下，系统被认为是
    `non-deterministic`（非确定性的）。EVENT B 语义允许任何守卫条件被满足的事件被触发。


    在 EVENT B 中，系统通常通过一系列细化（refinements）进行建模。首先，编写一个抽象机器（模型）并检查其是否满足各种不变性属性。细化机器用于向抽象机器添加更多细节，直到该模型足够具体，可以进行人工或自动的到代码翻译。细化证明义务（POs）需要被消除（证明），以确保每个细化机器都是前一个机器的忠实模型，使得所有机器都满足原始的正确性属性。


