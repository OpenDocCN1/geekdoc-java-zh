    `chat ∖ toread`。注意，我们的 EVENT B 编码比 US 和局部不变式描述的更细粒，因为拥有“已读”状态的变量可以是 `active` 或
    `inactive`。


    不变式 2 无法直接通过不变式进行静态编码，而是需要通过机器事件进行编码，因此每当内容项发送到 `inactive` 聊天时，都需要被添加到 `toread`
    中。

