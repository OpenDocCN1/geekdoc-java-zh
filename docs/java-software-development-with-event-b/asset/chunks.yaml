    **3.2 MACHINEONE**


    Our chat system resembles WhatsApp, which implements a graphical interface with
    one grey tick indicating that the message has successfully been sent to the recipient’s
    device, and two grey ticks indicating that the recipient has read the message.
    EX-01 describes the latter functionality. A content item is read if the recipient
    has an active chat session with the sender during or after the content item has
    been sent. In other words, once a user opens up a window chat, the chat content
    is considered to have been read.


