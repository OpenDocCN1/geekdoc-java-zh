    ### 2.1 关系与函数


    函数和关系是 EVENT B 语言的核心。EVENT B 提供了一些预定义集，例如空集 `∅`、自然数集 `ℕ`、正数集 `ℕ1` 和整数集 `ℤ`。它还提供了集合的常用操作，如分别表示交集、并集和集的
    `∩`、`∪` 和 `∖`。符号 `ℙ` 用于集合的幂集（power-set），符号 `×` 用于两个集合之间的笛卡尔积（cross product）。


    任何 EVENT B 关系都编码为一个集合。配对的第一个元素是源（source）或域（domain），配对的第二个元素是目标（target）或范围（range）。函数是一种满足没有两个不同的对包含相同元素的关系。换句话，源的任何元素最多映射到一个目标元素。


    假设 `f` 是定义在域 A 和范围 B 上的关系，表示为 `f: A ↔︎ B`。如果 `f` 对于 `A` 的*所有*值定义，我们称 `f` 是全函数（total
    function），写作 `f: A → B`。如果 `f` 对于 `A` 的某些值定义，我们称 `f` 是部分函数（partial function），写作
    `f: A ⇸ B`。如果 `f` 是一个函数，使得范围中的没有元素对应于域中的多个元素，那么我们称 `f` 是单射函数（one-to-one/injective
    function），写作 `f: A ↣ B`。如果 `f` 是一个范围恰为 `B` 的函数，我们称 `f` 是满射（onto/surjective function），写作
    `f: A ↠ B`。如果 `f` 既是单射又是满射，我们称 `f` 是双射函数（bijection），写作 `f: A ⤖ B`。


    ![image](img/pg6_1.png)


