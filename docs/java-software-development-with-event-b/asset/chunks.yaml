    `@grd4` typesets `c`. `@grd6` checks that `u` indeed possesses chat sessions with
    every user member of `us`. Expression `muted[{u}] ∩ us = ∅` checks that no member
    of the set `us` is part of the set of users that `u` has muted. Expression `muted[us]
    ∩ {u} = ∅` verifies that `u` has not been muted by any member of `us`. Body action
    `@ act2` creates respective chat sessions for each member of the set `us` to chat
    with `u`. Action `@act1` overrides `chatcontent` to include content `c` into the
    chat sessions between `u` and each element of `us`. Event `forward` itself does
    not implement a notion of order among the content items of a chat session, hence,
    at the abstract level as implemented by the abstract machine one cannot establish
    which chat content reads first or after another.


    Event `broadcast` for US-08 is implemented in a similar way to event `forward`.
    The major difference between both of them is that guard `@grd6` for event `forward`
    is not included by event `broadcast`.


    ![image](images/pg38_1.png)


    Event `unselect-chat` implements US-10\. It unselects the chat between `u1` and
    `u2` by dropping `u1↦u2` from `active`.


    ![image](images/pg39_1.png)


    **3.5 MACHINEONE IN EVENT B**


    *Machine refinement* is the mechanism that EVENT B offers to extend or to detail
    the behavior and functionality of a machine. In EVENT B, all the components of
    a *refined machine* are included in a *refinement machine*, either explicitly
    (machine variables, machine variable initializations, guards and actions of a
    refining event defined using `refines`) or implicitly (invariants, guards, and
    actions of a refining event defined using `extends`). Machine `machine1` below
    sees `machine0`, hence it refines all its functionality. It additionally introduces
    variable `toread` so as to encode US EX-01\. This variable stores all the chat-content
    pending to read.


    Variables `user`, `content`, `chat`, `active`, `chatcontent`, and `muted` below
    are explicitly refined by `machine1`. The machine includes two further variables
    `toread` and `inactive` which are initially empty. Notice that the `initialization`
    event does not initialize any of the abstract variables `user`, `content`, `chat`,
    `active`, `chatcontent`, or `muted`, as they are already initialized in `machine0`
    (the most abstract machine). Machine `machine1` “sees” the same context `ctx0`
    that `machine0` sess.


    ![image](images/pg39_2.png)


    Invariants `@invr11` and `@invr12` declare `toread` and `inactive` as relations
    of type `user ↔︎ user` which are included in `chat`. Invariant `@invr13` constrains
    `chat` to be the union of `active`, `toread`, and `inactive`; `active` and `toread`
    are disjoint sets, as well as `active` and `inactive`, however, a chat session
    may be `inactive` and `toread` at the same time.


    ![image](images/pg40_1.png)


    US EX-01 is implemented *statically* by all the invariants manipulating variables
    `toread` or `active`, and *dynamically* through the encoding of events within
    `machine1` that refer to either variable.


    Machine events are implicitly refined within the refinement machine through the
    use of an `extends` clause. The parameters of the refined event `unmute-chat`
    below are `u1` and `u2` union the new parameters that `unmute-chat` declares in
    `machine1` (the empty set). The guards of the refined event `unmute-chat` below
    are `@grd1`, `@grd2`, and `@grd3` from the abstract event conjoined with the new
    guards that `unmute-chat` declares in `machine1` (none). The same goes for the
    abstract action of event `unmute-chat`, that is `@act1 muted ≔ muted ∖ {u1↦u2}`,
    which implicitly appears repeated in the concrete version of unmute-chat event
    below.


    ![image](images/pg40_2.png)


    Next, we describe how local invariants in [Table 3.3](#11_Chapter03.xhtml_tab3_3)
    are implemented in EVENT B. Regarding Invariant 1, the “unread” status is encoded
    through the variable `toread`, and the “read” status as `chat ∖ toread`. Notice
    that our EVENT B encoding is more granular than what is described by the USs and
    the local invariants since a variable possessing a “read” status can be `active`
    or `inactive`. This is often the case in Software Engineering where USs are kept
    away from implementation details.


    Invariant 2 cannot be encoded statically directly through invariants but it rather
    needs to be encoded through the machine events, hence every time a content item
    is sent to an `inactive` chat then it needs to be added to `toread`.'
