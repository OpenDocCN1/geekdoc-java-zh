    ### Example 13. Abstract States (Sets)


    We want to model dictionaries in EVENT B. For the sake of simplicity, let us assume
    that a word has exactly one meaning, and that we are just interested in adding
    words to the dictionary. Variable `word` is a set of words, and `meaning` is a
    set of word meanings. `dictionary` is a partial function from `word` to `meaning`.
    Therefore, a word has one meaning, yet it might be the case that a word has no
    meaning.


    ![image](images/pg12_1.png)


    We show below how to add a new word and its meaning to the dictionary. EVENT B
    guard `@grd1` checks that the word `w` is in the set difference `WORD ∖ word`;
    since `w` cannot be in `word`, it needs a new word taken from `WORD`. Likewise,
    guard `@grd2` checks that `m` is a new meaning that is not already in the set
    of meanings. Event action `@act1` adds `w` to the list of words, `@act2` adds
    `m` to the list of meanings, and `@act3` adds to the dictionary an entry that
    maps `w` into `m`.


    ![image](images/pg12_2.png)


    ### Example 14. Data Refinement


    Let us suppose that we have an abstract state variable `a` representing a set
    of natural numbers.


    ![image](images/pg13_1.png)


    Suppose that we decide to represent this set in our concrete state space using
    integer sequences (perhaps implemented as linked lists).


    ![image](images/pg13_2.png)


    Then, an abstract value of `{3,5}` could be represented by the sequence `<3,5>`
    or the sequence `<5,3>`.


    ### Example 15. A Segment of Natural Numbers


    EVENT B has a built-in notion for a segment of natural numbers based on the notion
    of set extension. `a‥b` below equals to the set of the natural number between
    `a` and `b`. This set can be empty.


    ![image](images/pg13_3.png)


    ### Example 16. Concrete State (Sequences)


    We make variables `word` and `meaning` in Example 13 concrete. We implement them
    as sequences `words` and `meanings`, respectively. `words` is encoded as a total
    function from the set `1‥size` into `word`. Likewise, `meanings` is encoded as
    a total function from the same set into `meaning`. We safely assume the same `size`
    for both sequences `words` and `meanings` since the same meaning cannot be added
    twice to the dictionary.


    ![image](images/pg13_4.png)


    ### Example 17. Gluing Invariant for word


    We want to add an invariant condition that relates the abstract state variable
    `word` defined in Example 13 to its concrete state variable `words` in Example
    16. This invariant condition is called a *gluing invariant* in literature and
    is better explained in [Section 3.6](#11_Chapter03.xhtml_ch3_6). The invariant
    below is a gluing invariant. It says that the abstract variable `word` is equal
    to the set of all the elements `words(i)` with index `i` between `1` and `size`.


    ![image](images/pg14_1.png)


