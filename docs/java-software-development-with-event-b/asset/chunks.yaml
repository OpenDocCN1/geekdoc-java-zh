    ### Example 4. Operations Over Sets and Relations


    EVENT B is equipped with a series of operators over relations that restrict elements
    of the relation (pairs) to contain elements in a certain set. Operators `◁`, `⩤`,
    `▷`, and `⩥` are used for domain restriction, domain subtraction, range restriction,
    and range subtraction, respectively. They receive two operands, namely a relation
    and a set, whereby the relation filters out some of its elements based on the
    elements of the set. For instance, the expression `r⩥s` returns a relation `r’`
    after removing all pairs of elements in the relation `r` whose second components
    are in the set `s`. The expression `r⩥s` itself does not modify `r` but just builds
    a new relation.


    Building on the previous example of Facebook, expression `page ▷ {c}` returns
    a relation that is formed from `page` by considering only the pairs of elements
    whose second element is `c`. Expression `dom (page▷{c})` returns the set of persons
    with content `c` in their page. Expression `page⩥{c}` returns a relation formed
    from page that disregards any pair of elements whose second element is `c`. These
    operators are formally defined in [Table 2.2](#10_Chapter02.xhtml_tab2_2).


