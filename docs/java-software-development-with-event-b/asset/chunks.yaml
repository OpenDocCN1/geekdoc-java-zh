    **4.5 POS FOR QUANTIFIED EXPRESSIONS**


    Discharging POs that involve universally or existentially quantified properties
    is often complex since provers cannot instantiate quantifiers automatically, in
    general. We show a small example of how a universally quantified invariant PO
    is proven in Rodin. We model an invariant property that says that people can only
    own content items that exist in their web pages, and we present two equivalent
    versions of that invariant: invariant `@inv51` uses set operations; and invariant
    `@inv52` uses a universally quantified expression.


    ![image](images/pg72_1.png)


    We are interested in discharging the PO generated for invariant `@inv52` with
    respect to event `hide` below, which hides a content item `c` from the page of
    a user `p`.


    ![image](images/pg72_2.png)


    Following up the invariant PO rule in [Figure 4.2](#12_Chapter04.xhtml_fig4_2)
    in [Section 4.3](#12_Chapter04.xhtml_ch4_3), a *sequent* is formed with hypotheses
    that account for `@inv52` and the guards of the event `hide`, and the goal of
    the sequence is a modified version of `@inv52` that accounts for the state changes
    introduced by the execution of the event actions. [Figure 4.6](#12_Chapter04.xhtml_fig4_6)
    shows the sequent. Hypothesis 1 is invariant `@inv5 2`, hypotheses 2 to 5 are
    the event guards. Rodin automatically instantiates the goal (a universally quantified
    invariant) and applies modus ponens, hence the hypothesis number 6\. The latter
    hypothesis typesets `c1` and `p1`.


    ![image](images/pg73_1.png)


    Figure 4.6: PO for event hide as per `@inv52`.


    To discharge this PO one should instantiate the first hypothesis with appropriate
    values. One needs two values of type `content` and `person` such that the mapping
    from the latter to the former is an element of `owner`. After the instantiation
    of this hypothesis with `c1` and `p1`, `nPP` discharges the PO automatically.
    However, had we defined `@inv52` as `@inv51`, the prover would have discharged
    the underlying PO without human intervention. One should avoid writing invariant
    properties that use quantifiers in general, and foresees ways those can be expressed
    using set and relation operations instead.


    **4.6 STRENGTHENING THE SPECIFICATION**


    This section partially shows the development of the first refinement machine in
    [Table 4.2](#12_Chapter04.xhtml_tab4_2). The refinement involves requirements
    SEC-1, SEC-2, FUN-4, INV-1, and INV-2. SEC-1 and SEC-2 refer to the static part
    of the refinement machine; they extend Poporo’s abstract machine to model access
    permissions on network content. We use two relations `viewp` and `editp` as below
    to represent *view* and *edit* permissions. Note that labels in the refinement
    machine are different to the labels in the refined machine. This allows tools
    like Rodin to generate POs for invariants.'
