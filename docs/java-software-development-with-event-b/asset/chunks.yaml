    ### 2.2 EVENT B MATHEMATICAL NOTATION


    EVENT B provides a full battery of set and relation notation. [Table 2.2](#10_Chapter02.xhtml_tab2_2)
    shows some of the EVENT B mathematical notations that will be used in this book.
    We use square brackets to apply (evaluate) a relation to (over) a set of elements
    as mentioned above. For instance, `r[s]` applies relation `r` to all the elements
    in set `s`. The result of `r[s]` is a set of elements in the range of relation
    `r`. EVENT B provides standard notations for set union, intersection, difference,
    etc. The symbol  denotes the cross product between two sets. The operator `dom`
    returns the domain of a relation, and `ran` its range relation. The operator `id`
    denotes the identity relation over a set of elements `s`. Applying the forward
    composition relation `q;r` to an element `a` in the domain of relation `q` returns
    a set of elements calculated as the result of applying `r` to `q[{a}]`. When relation
    `q` is a function, `q[{a}]` should be used as `q(a)`. The domain restriction relation
    expression `s▷r` restricts the domain of a relation `r` to (consider only elements
    in) a subset `s` of its domain. The range restriction relation expression `r⩤s`
    restricts the range of relation `r` to consider only elements in a subset `s`
    of its range. Domain (range) subtraction is defined similarly to domain (range)
    restriction, except that the elements in the set `s` are disregarded rather than
    considered. EVENT B also provides the `r∼` notation for the inverse of a relation
    `r`.


    Table 2.2: EVENT B’s basic mathematical notation


    ![image](images/pg9_1.png)


    ### Example 6. Assignments


    EVENT B is equipped with two types of assignments: deterministic and non-deterministic.
    Deterministic assignments use the `≔` notation, and so, for instance, the expression
    `content ≔ cts` assigns `cts` to content. Only machine variables are allowed to
    be in the left-hand side of an assignment. EVENT B provides two related non-deterministic
    assignment operators, namely `:|` (Becomes such that), and `:∈` (becomes in).
    The right-hand side of `:∈` is a set expression and the right-hand side of `:|`
    is a predicate. An `:∈` expression can always be reduced to a `:|` expression.
    The non-deterministic assignment `content :∣ ⊇ content` assigns to `content` some
    of its supersets. The expression `content :∈ {content ∪ cts1, content ∪ cts2}`
    non-deterministically assigns to `content` either `content ∪ cts1` or `content
    ∪ cts2`. This expression can alternatively be written as `content :| content’
    = {content ∪ cts1} ∨ content’ = {content ∪ cts2}`.


    Building on the example of the social network in order to delete every occurrence
    of some content `c` in every single page of Facebook one can use the expression
    `page ≔ page⩥{c}`. If we additionally want to replace `c` by some new content
    `newc`, then we can use the expression `page ≔ page⩥{c} ∪ (dom(page▷{c}) × {newc})`.
    Alternatively, to replace `c` by `newc`, we can use the expression `page ≔ page⩥{c}
    ∪ (page∼[{c}] × {newc})`, in which `page∼` is the inverse relation of `page` and
    `page∼[{c}]` returns all the persons with `c` in their page. The symbol × is used
    for the cross product between two sets. EVENT B provides two types of quantifiers,
    existential and universal quantifiers, denoted `` and , respectively. For instance,
    the expression `c,p • c↦p ∈ owner` is true of all pair of elements `c↦p in owner`,
    and `c,p • c↦p ∈ owner` is true of (at least) one element in `owner`.


