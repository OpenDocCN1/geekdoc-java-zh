    overriding expression forgets about chatcontent(You), which amounts to deleting
    it. This issue cannot be spotted by Rodin, in particular regarding invariant `@inv4`
    in [Section 3.4](#11_Chapter03.xhtml_ch3_4), as the new association for You below
    would be a partial function anyway. This can only be spotted by a domain expert
    who knows that deleting a person’s chat whenever a content item is sent to her
    is an unwanted side effect.


    ![image](images/pg58_1.png)


    The final solution is to use a set-comprehension expression to express the new
    value of `chatcontent(You)` as indicated in the last overriding expression below.
    The downside of this solution is that the expression cannot directly be encoded
    with sets, relations, and their operators (domain restriction, domain subtraction,
    inverse, etc.) by code generators such as EVENTB2JAVA.


    ![image](images/pg58_2.png)


    **3.10.3**   **EVENTS DELETE-CONTENT AND REMOVE-CONTENT**


    `delete-content` and `remove-content` are two of the subtlest functionalities
    of our chatting system since that the performing of either can break invariants
    all around. `delete-content` below does not remove `c` from chat `You ↦ Me`. Under
    which circumstances should one add action `@act2 content := content \ {c}` to
    event `delete-content`? If we add `@act2` to `delete-content`, Rodin will generate
    an unprovable PO. The PO relates to `@inv4` in [Section 3.3](#11_Chapter03.xhtml_ch3_3).
    One would need to demonstrate that for any user Someone other than `Me` the range
    of `chatcontent(Someone)` is a partial function from `content\{c}` to `ℙ(user)`,
    which is not possible because it might be the case that Someone had sent (forwarded
    or broadcasted) c to another user previously.


    ![image](images/pg59_1.png)


    A turn-around to this problem is to express content as below. However, to calculate
    the value of `chatcontent` that way one should traverse user twice and content
    once, which might be time-consuming depending on the type of structure used to
    store `chatcontent` or to represent sets in general.


    ![image](images/pg59_2.png)


    Notice that if `Me` is chatting with `You`, and `You` with `Another`, and `Me`
    sends `c` to `You`, and `You` sends `c` to `Another`, calling `remove-content`
    with parameters `Me`, `You`, and `c` does not remove `c` from the chat between
    `You` and `Another`, but only from the chat between `Me` and `You` and between
    `You` and `Me`. For this reason, `remove-content` does not implement a second
    action `@act2 content := content\{c}`. To express the new value of content we
    can adopt the same approach as above and add the following line to the event `remove-content`.


    ![image](images/pg60_1.png)


    ^([4](#11_Chapter03.xhtml_fn3_4))  Machine is the name given to a blueprint in
    EVENT B.


    ^([5](#11_Chapter03.xhtml_fn3_5))  ! is the symbol for logical negation in JAVA.


    CHAPTER 4


    **The Poporo Social Network**


    This chapter presents a complete EVENT B formal model of a social networking site
    called *Poporo*. A Poporo is a receptacle made of gold, used by pre-Columbian
    (before Christopher Columbus) Amerindians to socialize and communicate with ancient
    gods. Poporos were believed to have mystical and social communication powers.
    These mystical communication powers are arguably due to a mixture of quicklime
    and mashed coca leaves substances that were poured into the Poporos. Poporos belong
    to the Chibcha, Muisca, Quimbaya, and Calima pre-Columbian cultures.


    ![image](images/pg61_1.png)


    Figure 4.1: Poporo Muisca.'
