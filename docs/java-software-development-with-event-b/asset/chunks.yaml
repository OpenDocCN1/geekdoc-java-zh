    invariants that restrict the state of variables. Only invariants of the third
    kind above are likely to be included in a software requirements document. Invariants
    falling in the first and second invariants category are not included since they
    are particular to EVENT B.


    We start by looking at the context of the abstract machine, which introduces two
    *carrier sets*, namely, `USER` and `CONTENT` that are used to typeset all the
    users registered in the chat system and all the content that it manipulates.


    ![image](images/pg32_1.png)


    The first two invariants in [Table 3.2](#11_Chapter03.xhtml_tab3_2) are implemented
    by introducing two set variables in our model; the first one holds the users who
    have signed up to the chat system, and the second one holds all the exchanged
    content.


    ![image](images/pg32_2.png)


    Invariant 3 in [Table 3.2](#11_Chapter03.xhtml_tab3_2) is implemented as an invariant
    that declares `chat` as a relationship between users. Invariant 4 is implemented
    by the fact that `chat` is a binary relation. Having modeled `chat` as a set enforces
    the fifth invariant in [Table 3.2](#11_Chapter03.xhtml_tab3_2), therefore, no
    pair of elements in a chat session is repeated.


    ![image](images/pg33_1.png)


    Implementing the sixth invariant in [Table 3.2](#11_Chapter03.xhtml_tab3_2) requires
    a subtler analysis as it relates content, the sender and the receiver of the content.
    Variable `chatcontent` below introduces chat content. The variable is defined
    as a partial function with domain `user` (the person who sends the message) and
    range `content ⇸ ℙ(user)`, where `content` is the content sent and `ℙ(user)`is
    the set of users to whom the content has been sent. `chatcontent` is a *partial
    function*, therefore, it might be the case a user exists that has not chatted
    with anyone. The range of `chatcontent` is again a *partial function*, therefore,
    it might be the case a user exists that has not chatted with some particular user.
    Since `chatcontent` and its range are functions, the set of users to whom user
    `u1` has sent some content `c` is uniquely represented as `chatcontent(u1)(c)`,
    given that `u1` exists in the domain of `chatcontent` and `c` exists in the domain
    of `chatcontent(u1)`. The set of users with whom `u1` has chatted is represented
    as `ran`(`chatcontent(u1))`, and the set of content items sent by `u1` (to anyone)
    is represented as `dom`(`chatcontent(u1))`, given that `u1` exists in the domain
    of `chatcontent`.


    ![image](images/pg33_2.png)


    Next, we proceed to encode invariant 8 in [Table 3.2](#11_Chapter03.xhtml_tab3_2),
    which says that active and muted chats are disjoint. `@inv5` below encodes the
    set of active chat sessions; `active` is a *partial function*, hence, a user has
    one active chat session maximum (the *function* part), but it might be the case
    he has no active chat session at all (the *partial* part). `@inv7` states that
    it is never that case an active chat session is not a chat session, and `@inv8`
    states that it is never the case that a muted chat session is not a chat session,
    therefore, elements from muted chats are taken from chats. `@inv9` encodes invariant
    8 in [Table 3.2](#11_Chapter03.xhtml_tab3_2).


    ![image](images/pg33_3.png)


    Invariants 9 and 10 in [Table 3.2](#11_Chapter03.xhtml_tab3_2) state that `chat`
    and `active` sessions are not symmetric necessarily. These invariants are modeled
    by not imposing further constraints over them. In other words, if we want them
    to be symmetric, we need to enforce further invariants. Invariant 11 in [Table
    3.2](#11_Chapter03.xhtml_tab3_2) is implemented by `@inv10` below. Expression
    `chatcontent(u)(c)` returns the set of users to whom user `u` has sent some content.
    Expression `chat[{u}]` returns the set of users with whom user `u` is chatting.


    ![image](images/pg34_1.png)


    Invariant 12 in [Table 3.2](#11_Chapter03.xhtml_tab3_2) is enforced by the fact
    that `active` is a function.


    EVENT B models are composed of a *static part* defining observations (variables,
    constants, parameters, etc.) of the system and their invariants properties, and
    a *dynamic part* defining operations (events) changing the state of the system.
    Definitions introduced up to now are all static, and the next definitions are
    the dynamic part of the abstract machine (`machine0`) of our model. Invariant
    13 in [Table 3.2](#11_Chapter03.xhtml_tab3_2) is dynamic. It requires us to add
    an event guard to every event that otherwise might modify `chatcontent` of a muted
    chat.


    Next, we implement the basic functionality of chat sessions in EVENT B.


    Event `create-chat-session` implements US-01\. It creates a chat session for user
    `u1` to chat with user `u2`. The `Given` condition in `US-01` is encoded by guard
    `@grd2`. Guard `@grd1` is a typing condition, it helps Rodin to infer the type
    of `u1` and `u2`. `@act1` adds the pair `u1↦u2` to the set of existing chats.
    `@act2` makes the content associated with the chat between `u1` and `u2` empty.
    Notice that event `create-chat-session` does not create a chat for `u2` to chat
    with user `u1`.


    ![image](images/pg34_2.png)


    Event `select-chat` implements US-02\. `@act1` uses the relational overriding
    operator `⊗` instead of the set union operator `∪`, in this way `u1` can have
    an active chat session only with one user. `@grd4` implements a defensive style
    of programming as explained before. `@grd3` makes sure that a muted chat session
    is never active. `@grd1` is a typing guard. It typesets `u1` and `u2`. `@grd2`
    implements the first `Given` condition in US-02, and guard `@grd4` implements
    the second one. `@act1` uses the overriding operator `⊗` instead of the union
    operator `∪` to make sure we don’t break `@inv5` so that active remains a function.
    Had we added `u1 ↦ u2` to `active` using the union operator `∪`, we would have
    probably ended up with `active` mapping `u1` to two different users. Rodin would
    have detected this mistake by generating an unprovable PO.


