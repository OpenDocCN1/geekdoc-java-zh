    ## Author’s Biography


    **Néstor Cataño Collazos** is a software engineer, computer scientist, and enthusiastic
    formal methods tool developer. His main research area is the use of formal methods
    for software engineering. Néstor specializes in program specification and verification
    using `JML` and design-by-contract, and in a formal method called `EVENT B`. His
    main goal is to build Formal Methods tools that increase people’s trust in the
    correct behavior of Software Systems. His main tool contributions are the design
    and implementation of the `EVENTB2JAVA` and `EVENTB2JML` code generators, the
    design and implementation of the `EVENTB2DANY` Proof Obligation generator, and
    the design and implementation of the Chase syntactic checker of `JML`’s `assign`
    clause. Néstor’s research work with `EVENTB2DANY` was funded by Microsoft Research
    through the `SEIF` program in 2011\. He has worked in academia since 2004 and
    regularly teaches software engineering, formal methods, and programming courses
    to graduate and undergraduate students.


    Dr. Collazos earned a Master Degree and a Ph.D. in Computer Science from The University
    Paris 7\. He is currently taking part in the Master in Information and Cybersecurity
    at UC Berkeley.

