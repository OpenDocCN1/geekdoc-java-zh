    `EVENT B` 实现了两种类型的蓝图细化：`水平细化`（上述）和`垂直细化`（Abrial, 2009）。水平细化在文献中也被称为叠加（superposition）。水平细化为系统添加状态迁移或丰富现有的迁移。当模型中考虑了所有软件需求时，水平细化阶段即完成。通过水平细化，蓝图可以：


    • 强化事件守卫，

    • 添加新的事件守卫，

    • 为某些事件添加更多动作，或

    • 添加更多事件。


    垂直细化是`数据细化`。它没有向系统增加细节，而是将模型转换为可以容易实现的形式。例如，垂直细化可以将有限集转换为`Boolean arrays`。我们将在第
    3.6 节中展示一个垂直细化的具体示例，其中集合转换为序列。


    垂直细化的一个关键方面是定义`粘接不变性`（gluing invariant）^(2)，它通过陈述两个状态模型组合行为的属性，将系统的抽象状态与系统的具体状态连接起来。虽然水平和垂直细化可以在单个细化步骤中结合使用，但最后的单一垂直细化步骤通常通过代码生成工具的帮助来实现（Cataño
    and Rivera, 2016; Cataño et al., 2017）。


    我们在下面列出了基于 `EVENT B` 的软件开发方法论步骤。在 `EVENT B` 中，软件开发最终产生一个“构造正确”（correct-by-construction）的程序，这取决于在定义最后一个模型细化后可能使用的代码生成器的完备性，即一个满足最抽象
    `EVENT B` 蓝图所有不变性属性的程序。


    1. 使用 `EVENT B` 编写系统的初始蓝图（机器）。初始蓝图充当我们想要建模的系统的最抽象视图。

    2. 进行完备性证明，证明初始蓝图中的每个事件都符合不变性属性，例如使用`Rodin platform`。

    3. 编写针对蓝图的模型细化。该细化可以是水平细化、垂直细化，也可以是两者的结合。

    4. 进行一致性证明，证明蓝图细化是对蓝图的正确细化。

    5. 根据需要重复上述两个步骤。

    6. 针对最终的模型细化实现代码或通过工具生成代码。


    上述最抽象机器的定义及其所有细化都是基于现有的软件需求文档。`Rodin tool` 为 `EVENT B` 和 `EVENT B` 模型细化定义提供支持（Abrial
    et al., 2010）。`Rodin` 在每个细化阶段生成 `POs`。`Rodin` 带有各种半自动定理证明器，协助证明卸载过程。


    ## 2.4 一种软件需求早期验证方法论


    软件需求的早期验证在软件工程中至关重要，因为它能最大限度地减少软件设计错误的数量，从而防止实现过程中重复相同的错误。形式化规范是软件需求验证的关键。形式化规范在软件开发中至少可以以两种方式使用（Almeida
    et al., 2011）。它们可以用于模型验证，即检查规范是否具有特定的行为。或者，它们可以用于验证目的，即检查或强制程序实现与其规范之间的形式关系。在模型验证过程中，例如，可以将规范转换为可执行规范或稍后可以执行的程序。这通常被称为（规范）`动画`（animation）；它是通过将规范转换为可执行格式、执行它，然后根据某些预期行为检查其行为来实现的。规范到程序的转换可以手动完成，也可以通过工具完成，例如使用代码生成器。或者，可以结合两种方法，例如，将形式化规范连续细化（Abrial
    and Hallerstede, 2007）为更详细的规范，最终移植到代码中，例如使用代码生成器（Cataño and Rivera, 2016; Cataño
    et al., 2017）。对于软件需求验证目的，生成的代码并不是最终的软件实现，而仅仅是一个用于单元测试以发现缺陷的原型。因此，如果某些单元测试失败，则需要重新检查并演进系统的非正式和形式化规范。


    ![image](img/pg17_1.png)


    图 2.2：软件需求的验证方法。


    上述方法遵循了图 2.2 所示的模型验证方法。简而言之：(a) 我们编写软件需求文档；(b) 我们手动将其转换为形式化规范；(c) 我们按需细化形式化规范；(d)
    我们自动为形式化规范生成原型实现；(e) 我们最后对原型进行缺陷单元测试。如果某些单元测试失败，则重新检查并演进非正式和形式化规范。


    更具体地说，我们用自然语言编写一份软件需求文档（非正式规范），其中包含以用户故事（US）形式编写的功能需求，用户故事是格式为“作为一个 `<Role>`，我想实现
    `<Goal/Desire>` 以便 `<Why>`”的文本模板。虽然用户故事是敏捷方法的典型特征，但我们在这里使用它们是因为它们的语法与我们要转换过去的形式化语言（`EVENT
    B`）的语法非常相似。一个用户故事包含一些应据此进行验证的验收标准。一个验收标准包含三个部分：一个 `Given` 部分，描述功能何时可能被触发/执行（取决于系统的内部状态）；一个
    `When` 部分，告诉我们何时执行该功能（取决于用户的决策）；以及一个 `Then` 部分，说明功能执行时系统状态如何变化。


    在写完所有用户故事后，我们手动将其转换为用 `EVENT B` 编写的形式化规范。因此，`Given` 部分被形式化为事件守卫，`When` 部分是执行的事件本身，而
    `Then` 部分被形式化为一组事件动作。


    第 3.9 节 展示了一个关于如何实现这种需求早期验证方法的完整示例。


    ## 2.5 构造正确


    图 2.2 重点关注使用形式化方法进行模型验证（与使用形式化方法进行程序验证相对）。形式化方法为模型验证问题提供了两种解决方案。形式化规范本身就是程序并可以直接执行；或者从规范产生实现，通常通过各种细化步骤，在这种情况下需要证明每一步的正确性。这种方法通常被称为“构造正确”（Correctness-by-Construction）（Hall,
    2002; Hall and Chapman, 2002）。我们的模型验证方法属于后一种解决方案，因此我们需要验证我们方法中的每个细化步骤。


