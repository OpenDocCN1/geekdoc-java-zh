    Software testing has had a major impact on software development for the past decades.
    It has shaped the way people think about the task of software construction. People
    are not surprised to get to implement software that is infested with bugs. They
    expect that bugs will be decanted once the software implementation phase finishes.
    This book uses a different approach; our starting point is that we can and should
    write software that is correct from the very early stages of software development.
    Nonetheless, we use testing to animate the software and to check if its running
    behavior matches its expected behavior.


    Our software construction return to mathematics is based on the idea of assigning
    meaning to software. The idea is to build software the same way that mathematical
    proofs are conducted, guaranteeing that software product lives up to some intended
    meaning. The particular mathematical formalism and language we have chosen is
    called `EVENT B`, which originated from the `Z` formalism. Although `EVENT B`
    shares essentially the same modeling language for stating state properties as
    `Z`, `EVENT B` and `Z` offer different modeling mechanisms that are specialized
    in distinct mathematical aspects. `EVENT B` and `Z` are both models for state
    transition systems. `EVENT B`’s language for expressing the dynamic behavior of
    state machines is based on events. On the other hand, `Z` uses a rich schema calculus
    mechanism for expressing the dynamic behavior of models. `Z Schema calculus and
    `EVENT B` events coupled with model refinement are different mechanisms. `Z` also
    offers refinement, but in practice, `Z` focuses more on formal specification and
    `EVENT B` focuses more on model refinement and coding (whereas it is manually
    written or tool-generated). Another major difference between `EVENT B` and `Z`
    is in the undertaking and use of invariants. In `EVENT B`, each event definition
    produces proof obligations that attest to the correctness of machine invariants.
    These invariants might encode safety properties. On the other hand, in `Z`, invariants
    are incorporated into the model definitions, altering their meanings. They do
    not generate proof obligations.


    The main motivation for using mathematical formalisms in software development
    is economical. The cost of fixing software design flaws after the completing of
    a software product is so high that it is vital to come up with ways to detect
    software design flaws in the early stages of software development, for instance,
    during the software requirements, the analysis activity, or during software design,
    before coding starts. The approach to software construction presented in this
    book is based on the idea of program refinement and correctness-by-construction.


    The book presents a case study of software development of a chat system with `EVENT
    B` and a case study of formal proof of properties of a social network. We hope
    you enjoy the book as much as we enjoyed writing it.


    # CHAPTER 1


    ## Introduction


    This book is a practical guide for the software development of `JAVA` programs
    with `EVENT B` with the `EVENTB2JAVA` tool. `EVENT B` is a formal language for
    the design of systems by the use of discrete mathematics. The `EVENT B` language
    is based on set theory and predicate logic. It includes a large set of operations
    over sets and relations for modeling software systems. It is a simple model for
    `state machines`, which capture the idea that a system progresses through a set
    of states by responding to a set of events or actions. Additionally, `EVENT B`
    mathematical language permits the definition of invariants, and tool supporting
    the language can then be used to check if the system attests to the property or
    not.


    This book presents two software examples with `EVENT B`, a chat application similar
    to `WHATSAPP` (`https://www.whatsapp.com/`) and the `Poporo` social network. For
    the chat system, we include basic functionality for chatting, forwarding messages,
    deleting them, and checking if users are actively chatting or not. Poporo is a
    logical formalisation of a typical social network that includes functionality
    similar to `Facebook’s`. It additionally includes functionality related to privacy
    and ownership of social network content.


    [Chapter 2](#10_Chapter02.xhtml) introduces `EVENT B`’s syntax, including notations
    used for sets, relations, and events. A more complex notation is introduced on-the-fly,
    in the following chapters of the book, as they will require. [Chapter 3](#11_Chapter03.xhtml)
    presents the analysis and design of the chat system in `EVENT B`. This is a complete
    `JAVA` software development example that goes from software requirements to a
    close-to-implementation `EVENT B` model. We use the `EVENTB2JAVA` `JAVA` generator
    (Cataño and Rivera, 2016) to produce `JAVA` code for the `EVENT B` model of the
    chat system. The generated `JAVA` code is mainly used for validating the correctness
    of the software requirements of the chat system. The `JAVA` implementation could
    be used as a final implementation of the chat system, however, people might attempt
    to produce a manual implementation that is faster than the code produced by the
    `EVENTB2JAVA` `JAVA` code generator.


    [Chapter 3](#11_Chapter03.xhtml) also shows how software requirements can be validated
    early in the software development process. To validate software requirements,
    the chapter follows the methodology described in [Section 2.4](#10_Chapter02.xhtml_ch2_4).
    The methodology (and `EVENT B` in general) advocates for the construction of software
    that is `correct-by-construction`. [Chapter 3](#11_Chapter03.xhtml) does not emphasize
    on the process of making sure that the produced software is correct-by-construction.
    This endeavor is rather left to [Chapter 4](#12_Chapter04.xhtml). [Chapter 4](#12_Chapter04.xhtml)
    is dedicated to mathematical proof, so it focuses on the use of particular analysis
    and techniques to discharge Proof Obligations (`POs`) that are generated to attest
    to the correctness of `EVENT B` models. Proving `POs` is conducted with the `Rodin`
    toolset (Abrial et al., 2010).


    This book is targeted to a diverse audience of readers, spanning from Software
    Engineering professionals with experience in programming but scarce knowledge
    in Discrete Mathematics to experts in Formal Methods who are looking for real-life
    formal software development examples. The examples are self-contained. The book
    is also targeted to academic teachers who want to introduce Discrete Mathematics
    to undergraduate Computer Science or Software Engineering students, or to students
    looking for material that supplements their courses. The book assumes the reader
    has basic programming skills in `JAVA` or a similar Object-Oriented programming
    language.


    # CHAPTER 2


    ## An Overview of EVENT B


    In this chapter, we give a broad view of the `EVENT B` `formal method`. The expression
    `formal method` refers to a direct technique for building `dependable` systems.
    Dependability is the ability of a system to defensively provide a particular service
    during a period of time. A formal method provides ways to integrate properties
    into the system design and to mathematically prove system compliance with them.
    `EVENT B` is based on Action Systems (Back and Sere, 1991), a formalism describing
    the behavior of a system by the (atomic) actions that the system carries out.
    An Action System describes the state space of a system and the possible actions
    that can be executed in it.

