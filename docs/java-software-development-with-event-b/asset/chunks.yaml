    ### 3.6 EVENT B 中的 MACHINETWO


    机器 `machine2` 为我们的 WhatsApp2 EVENT B 模型添加了实现细节。该机器的目标是让 EVENT B 模型保持接近实现的状态，以便使用
    `EVENTB2JAVA` 工具翻译为 JAVA (Cataño and Rivera, 2016)。细化机器的变量可能会出现在细化机器的不变性中。当发生这种情况时，不变性被称为*粘合不变性*（gluing
    invariant），因为它关联了抽象（细化）机器与细化机器的状态空间。到目前为止，内容、用户和聊天内容被建模为集合。我们希望通过粘合不变性将它们建模为序列。


    在 EVENT B 中，自然数的一个段可以使用 `a..b` 表示法表示，它定义了从 `a` 到 `b`（包含边界）的自然数集。


    ![image](img/pg44_1.png)


    因此，我们可以使用 `1..n` 表示法将类型为 `T` 且大小为 `n` 的序列建模为从 `1..n` 到 `T` 的全函数。通过要求序列为*全函数*，我们强制其定义域没有空洞。


    ![image](img/pg44_2.png)


    变量 `contents` 将 `content` 编码为序列。`csize` 代表 `contents` 中内容项的数量。`content` 是 `contents`
    的类型。`contents` 的定义域是 `1..csize`，因此当 `csize` 为 `0` 时，`contents`为空。


    ![image](img/pg44_3.png)


    接下来，我们选择将 `chatcontent` 实现为变量 `screen`。这个细化变量使得发送的内容有序的，但内容的发送者或接收者不是。这是因为我们主要使用
    `screen` 来按顺序显示交换的内容，这使得用户对不需要排序，只需要内容项排序。


    ![image](img/pg44_4.png)


    下方展示了细化版本 `chatting`。当 `u1` 正在与 `u2` 聊天时，哪些会话应该被添加到 `toread`？应该添加 `u2↦u1`，因为内容
    `c` 已从 `u1` 发送到了 `u2`，除非 `u2↦u1` 已在 `active` 中。这通过表达式 `({u2↦u1} ∖ active)` 建模。当该对处于
    `inactive` 状态时，我们也应该将对 `u2↦u1` 添加到 `toread`。这通过表达式 `({u2↦u1} ∩ inactive)` 建模。但如果是如果是的话，我们需要从
    `inactive` 中删掉 `u2↦u1`。后者通过 `@actr12` 实现。为了让内容按顺序显示，用户对不需要排序，只需要内容项排序。`k` 是 `screen`
    中的位置。`@grdr21` 和 `@grdr22` 确保了 `machine1` 存在。`@actr23` 增加了内容。


    ![image](img/pg44_5.png)


    事件 `delete-content` 声明了两个参数 `i` 和 `k`，分别代表 `screen` 中的位置。`@grdr21` 检查 `contents(i)
    = c`。`@grdr22` 检查 `c` 是否存在。`@actr21` 从 `screen` 中删除 `k`。


    ![image](img/pg45_1.png)


