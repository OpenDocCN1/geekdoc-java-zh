    `EVENT B` implements two types of blueprint refinements, `horizontal refinement`
    (described above) and `vertical refinement` (Abrial, 2009). Horizontal refinement
    is also called superposition in literature. Horizontal refinements add state transitions
    to the system or enrich existing transitions. The horizontal refinement stage
    is complete when all the software requirements are considered in the model. Through
    horizontal refinement a blueprint can:


    • strengthen an event guard,

    • add new event guards,

    • add more actions to some events, or

    • add more events.


    Vertical refinement is `data refinement`. It does not add more details to the
    system, but it transforms the model into something that can easily be implemented.
    For instance, vertical refinement can transform finite sets into `Boolean arrays`.
    We present a concrete example of vertical refinement in [Section 3.6](#11_Chapter03.xhtml_ch3_6)
    whereby sets are transformed into sequences.


    A key aspect of a vertical refinement is the definition of a `gluing invariant`^([2](#10_Chapter02.xhtml_rfn2_2))
    that bridges the abstract state of the system to the concrete state of the system
    by stating properties of the combined behavior of both state models. Although
    horizontal and vertical refinements can be combined together in a single refinement
    step, a final vertical refinement single step is typically realized with the aid
    of a code generation tool (Cataño and Rivera, 2016; Cataño et al., 2017).


    We enumerate below the steps of a software development methodology based on `EVENT
    B`. In `EVENT B`, software development ends up with a program that is correct-by-construction,
    module the soundness of a code generator that might be used after the definition
    of the last model refinement, that is, a program that fulfils all the invariant
    properties of the most abstract `EVENT B` blueprint.


    1. An initial blueprint (machine) of the system is written in `EVENT B`. The initial
    blueprint plays the role of the most abstract view of the system that we want
    to model.

    2. Soundness proofs that demonstrate that each event in the initial blueprint
    adheres to the invariant properties are conducted, for instance, by using the
    `Rodin platform`.

    3. A model refinement for the blueprint is written. The refinement can be a horizontal
    or a vertical refinement, or can combine both.

    4. Consistency proofs that demonstrate that the blueprint refinement is a correct
    refinement of the blueprint are conducted.

    5. The two previous steps are iterated as many times as desired.

    6. Code is implemented or tool generated for the final model refinement.


    The definition of the most abstract machine above and all its refinements are
    based on an existing software requirements document. The `Rodin tool` provides
    support for `EVENT B` and `EVENT B` model refinement definition (Abrial et al.,
    2010). `Rodin` generates `POs` in each refinement stage. `Rodin` comes with various
    semi-automatic theorem provers that assist in the process of proof discharging.


    ## 2.4 A METHODOLOGY FOR EARLY VALIDATION OF SOFTWARE REQUIREMENTS


    Early validation of software requirements is of paramount importance in Software
    Engineering as it minimizes the number of software design errors, hence, preventing
    the implementation from repeating the same errors. Formal specifications are key
    to the verification of software requirements. Formal specifications can be used
    in at least two ways in software development (Almeida et al., 2011). They can
    be used for model validation, that is, to check if the specification possesses
    a particular behavior. Or, they can be used for verification purposes, that is,
    to check or to enforce a formal relationship between the program implementation
    and its specification. During the model validation process, one can, for example,
    transform a specification into an executable specification or into a program that
    can be executed later on. This is often called (specification) `animation`; it
    is achieved by transforming the specification into an executable format, executing
    it, and then checking its behavior against some expected behavior. The transformation
    of a specification into a program can be performed manually or through the use
    of a tool, for example, using a code-generator. Or, it can combine both approaches,
    for instance, the formal specification is successively refined (Abrial and Hallerstede,
    2007) into a more detailed specification to be finally ported into code, for instance,
    by using a code generator (Cataño and Rivera, 2016; Cataño et al., 2017). For
    software requirement validation purposes, the code generated is not meant to be
    a final software implementation, but merely a prototype that one unit-tests for
    flaws. Hence, if some unit-test fails, then the informal and the formal specifications
    of the system are revisited and evolved.


    ![image](images/pg17_1.png)


    Figure 2.2: Validation approach of software requirements.


    The methodology described above follows the model validation approach that is
    presented in [Figure 2.2](#10_Chapter02.xhtml_fig2_2). In short: (a) we write
    a software requirements document; (b) we manually port them to formal specifications;
    (c) we refine the formal specifications as desired; (d) we automatically generate
    a prototype implementation for the formal specifications; (e) and we finally unit-test
    the prototype for flaws. If some unit-test fails, then informal and the formal
    specifications are revisited and evolved.


    More concretely, we write a software requirements document in natural language
    (the informal specification) that includes functional requirements written as
    User Stories (US), which are textual templates of the form “as a `<Role>`, I want
    to `<Goal/Desire>` so as to `<Why>`.” Although USs are typical of Agile methodologies,
    we use them here as their syntax closely follows the syntax of the formal language
    to which we are going to port them (`EVENT B`). A US includes some Acceptance
    criteria against which it should be validated. An acceptance criterion has three
    components, a `Given` part that describes when the functionality may be triggered/executed
    (which depends on the internal state of the system), a `When` part that tells
    us when the functionality is to be executed (which depends on the user’s decision),
    and a `Then` part that tells how the state of the system changes when the functionality
    executes.


    After having written all the USs, we manually port them to formal specifications
    written in `EVENT B`. Therefore, the `Given` part is formalized as an event guard,
    the `When` part is the event itself that is executed, and the `Then` part is formalized
    as a set of event actions.


    [Section 3.9](#11_Chapter03.xhtml_ch3_9) presents a complete example on how this
    methodology for early validation of requirements is implemented.


    ## 2.5 CORRECTNESS-BY-CONSTRUCTION


    [Figure 2.2](#10_Chapter02.xhtml_fig2_2) focuses on the use of Formal Methods
    for model validation (as opposed to using Formal Methods for program verification).
    Formal Methods provide two types of solutions to the problem of model validation.
    The formal specification is a program and can be executed directly, or some implementation
    is produced from the specification, probably through various derivation steps,
    in which case one needs to justify the correctness of each step. This approach
    is often referred to as Correctness-by-Construction (Hall, 2002; Hall and Chapman,
    2002). Our model validation approach fits the latter solution so we need to validate
    every derivation step in our approach.

