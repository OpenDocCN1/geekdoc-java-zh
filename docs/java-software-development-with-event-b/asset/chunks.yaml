    ![image](img/pg46_1.png)


    ### 3.7 聊天系统的实现


    EVENT2JAVA 将 EVENT B 机器翻译为 JAVA 类。在翻译机器时，EVENT2JAVA 不仅考虑机器提供的信息，还考虑机器“看到”的上下文。细化机器的翻译与抽象机器相同，因为
    Rodin 正确将抽象机器组件添加到细化机器的内部表示中。EVENT2JAVA 除了生成 JAVA 代码外还生成 JML 规范。JML 是一种 JAVA 接口规范语言。它旨在表示
    JAVA 类的行为，并使用特殊注释标记包含在 JAVA 源文件中。我们这里对 WhatsApp 实现的介绍主要关注 JAVA。


    EVENT2JAVA 只将不变性翻译为 JML 规范。常量的翻译包含 JAVA 部分和 JML 部分。EVENT B 逻辑谓词被翻译为通过 `BSet` 和
    `BRelation` 类编写的 JAVA 谓词，分别在 JAVA 中实现集合和关系。细化和扩展事件的翻译方式与抽象事件相同。每个事件都被翻译为一个独立的
    JAVA 类。每个事件的翻译包含指向机器类的对象引用。标准（非初始化）事件的翻译包含一个 `guard-event` 方法用于测试 `event` 的守卫是否成立，以及一个
    `run-event` 方法模拟 `event` 的执行。


    我们在下方展示了 EVENT2JAVA 为事件 `add-user` 生成的代码。下方的 `guard-add-user` 方法实现了事件 `add-user`
    的守卫，`run-add-user` 方法实现了其动作。


    ![image](img/pg46_2.png)

