    ## 2.3 使用 EVENT B 进行软件开发


    使用 EVENT B 进行软件开发遵循软件开发的*伞兵策略*（parachute strategy），该策略首先从非常抽象和简单的角度考虑系统，进行广泛的基础性观察，然后添加细节，直到完成系统的全部功能。使用
    EVENT B 进行软件开发（Abrial, 2010）从定义我们想要建模的系统的初始*蓝图*开始。蓝图代表了未来的系统实现。蓝图提供了对未来系统某些方面的洞察，但并非全部。


