  trans: '

    过去的几十年里，软件测试对软件开发产生了重大影响。它塑造了人们对软件构建任务的思考方式。人们对于实现充满漏洞的软件并不感到意外。他们预想在软件实现阶段结束后，漏洞会被剔除。本书采用了一种不同的方法；我们的出发点是，我们可以也应该在软件开发的极早期就编写出正确的软件。尽管如此，我们仍然使用测试来赋予软件活力，并检查其运行行为是否符合预期行为。


    我们的软件构建回归数学是基于赋予软件意义的理念。这种理念是按照进行数学证明的方式来构建软件，确保软件产品符合某些预期的含义。我们选择的特定数学形式化语言被称为
    `EVENT B`，它源于 `Z` 形式化。虽然 `EVENT B` 与 `Z` 在描述状态属性的建模语言上本质上相同，但 `EVENT B` 和 `Z`
    提供了不同的建模机制，专门用于处理不同的数学方面。`EVENT B` 和 `Z` 都是状态转换系统的模型。`EVENT B` 用于表达状态机动态行为语言基于事件。另一方面，`Z`
    使用丰富的模式演算演算（schema calculus）机制来表达模型的动态行为。`Z` 模式演算与 `EVENT B` 事件结合模型精化是不同的机制。`Z`
    也提供精化，但在实践中，`Z` 更侧重于形式化规范，而 `EVENT B` 更侧重于模型精化和编码（它是手动编写或由工具生成的）。`EVENT B` 和 `Z`
    之间的另一个主要区别在于不变式的承担和使用。在 `EVENT B` 中，每个事件定义都会产生证明义务，以证明机器不变式的正确性。这些不变式可能编码安全属性。另一方面，在
    `Z` 中，不变式被纳入模型定义，改变了它们的含义。它们不会产生证明义务。


    在软件开发中使用数学形式化的主要动机是经济考虑。在完成软件产品后修复软件设计缺陷的成本极高，因此在软件开发的早期检测软件设计缺陷的方法至关重要，例如在软件需求阶段、分析活动期间或编码开始之前的软件设计阶段。本书介绍的软件构建方法基于程序精化和“构造即正确”（correctness-by-construction）的理念。


    本书展示了一个使用 `EVENT B` 开发聊天系统的案例研究，以及一个社交网络属性形式化证明的案例研究。我们希望你们喜欢这本书，就像我们喜欢写下它一样。


    # 第 1 章


    ## 引言


    本书是使用 `EVENT B` 和 `EVENTB2JAVA` 工具开发 `JAVA` 程序的实用指南。`EVENT B` 是一种利用离散数学进行系统设计的形式化语言。`EVENT
    B` 语言基于集合论和谓词逻辑。它包含了一系列针对集合和关系的操作，用于软件系统进行建模。它是`状态机` 的简单模型，捕捉了系统通过响应一组事件或动作在了一组状态之间演进的思想。此外，`EVENT
    B` 数学语言允许定义不变式，然后可以使用支持该语言的工具来检查系统是否符合该属性。


    本书介绍了两个使用 `EVENT B` 的软件示例：一个类似于 `WHATSAPP` (`https://www.whatsapp.com/`) 的聊天应用程序以及
    `Poporo` 社交网络。对于聊天系统，我们包含了聊天、转发消息、删除消息以及检查用户是否正在聊天的基本功能。Poporo 是一个典型社交网络的逻辑形式化，包含了类似于
    `Facebook` 的功能。它还包含了与社交网络内容隐私和所有权相关的功能。


    第 2 章 介绍了 `EVENT B` 的语法，包括用于集合、关系和事件的符号。更复杂的符号将在本书后续章节中根据需要即时引入。第 3 章 演示了使用 `EVENT
    B` 对聊天系统进行分析和设计。这是一个完整的 `JAVA` 软件开发示例，从软件需求一直到接近近于实现的 `EVENT B` 模型。我们使用 `EVENTB2JAVA`
    `JAVA` 代码生成器（Cataño and Rivera, 2016）为聊天系统的 `EVENT B` 模型生成 `JAVA` 代码。生成的 `JAVA`
    代码主要用于验证聊天系统软件需求的正确性。该 `JAVA` 实现可以作为聊天系统的最终实现，然而，人们可能会尝试产生一种比 `EVENTB2JAVA` `JAVA`
    代码生成器所产生的代码更快的手动实现。


    第 3 章 还展示了如何在软件开发过程早期验证软件需求。为了验证软件需求，该章遵循了第 2.4 节 中描述的方法。该方法（以及通用的 `EVENT B`）主倡构建“构造即正确”的软件。第
    3 章并没有强调确保生成的软件是“构造即正确”的过程。这一努力更多留给了第 4 章。第 4 章专注于数学证明，因此它重点关注使用特定的分析和技术来消除证明
    `EVENT B` 模型正确性的证明义务（POs）。证明 `POs` 使用 `Rodin` 工具集进行（Abrial et al., 2010）。


    本书面向多样化的读者群体，从具有编程经验但离散数学知识匮乏的软件工程专业人士，到寻找真实形式化软件开发示例的形式化方法专家。示例是自给自足的。本书还针对想要向本科计算机科学或软件工程专业的学生介绍离散数学的学术教师，或者正在寻找补充课程材料的学生。本书假设读者在
    `JAVA` 或类似的面向对象语言方面具有基础编程技能。


    # 第 2 章


    ## EVENT B 概述


    在本章中，我们给出 `EVENT B` `形式化方法` 的广义视图。“形式化方法”一词指的是构建`可靠`（dependable）系统的直接技术。可靠性是系统在特定时间内防御性地提供特定服务的能力。形式化方法提供了将属性集成到系统设计中并从数学上证明系统符合这些属性的方法。`EVENT
    B` 基于动作系统（Action Systems，Back and Sere, 1991），一种通过系统执行的（原子）动作描述系统行为的形式化方法。动作系统描述了系统的状态空间以及可以在其中执行的可能动作。

