    我们随后为 `chatting-first-time` 和 `chatting` 的新版本生成代码，并修改了 `testChatting()` 测试以使用
    `chatting-first-time` 代替 `chatting`。第一个 `assertTrue` 指令检查内容 `c1` 对 `Me` 可见，第二个指令检查它对
    `You` 可见。这次这两个测试都成功了，因此 `US-03a` 和 `US-03b` 是正确的。


    ![image](img/pg56_1.png)


    ## 3.10 经验教训


    ### 3.10.1 事件：CREATE-CHAT-SESSION


    如果在事件 `create-chat-session` 中（如见文第 2.9 节）添加守卫 `Me↦You ∈ active` 会怎样？在添加上述守卫后，Rodin
    会自动释放所有相关的 PO（后置证明）。是否使 `Me↦You ∈ active` 的结果实际上与 `create-chat-session` 与机器事件（如
    `chatting` 和 `select-chat`）的交互有关。如果 `create-chat-session` 不使 `Me↦You ∈ active`，则
    `select-chat` 应该在开始聊天之前执行。EVENT B 模型的事件交互分析通常可以使用 PROB 模型检查器（Leuchel and Butler,
    2003）进行。PROB 用于检查死锁：它会检查在执行任何机器事件后，系统是否能够继续进展。


    ### 3.10.2 事件：CHATTING


    下方是事件 `chatting` 的抽象版本（在 `MachineZero` 中定义的版本）。关于这个抽象版本，我们需要做的第一个决定是：是否想在 `You`
    和 `Me` 之间的聊天中添加内容项 `c`（除了 `Me` 和 `You` 之间的聊天之外）。如果我们想这样做，应该像我们之前做的那样，将下方的 `@act3`
    的第二行扩展为 `You ↦ (chatcontent(You) ∪ {c ↦ {Me}})`。直观上，添加这一行意味着 `Me` 发送给 `You` 的内容
    `c` 不仅被 `Me` 看到，也被 `You` 看到。然而，如果我们这样扩展 `@act3`，Rodin 证明器将生成一个 PO，要求 `You` 必须在
    `dom(chatcontent)` 中，以便子表达式 `chatcontent(You)` 是类型正确的。这一要求可以通过向 `chatting` 事件添加事件守卫
    `@grd6 You ∈ dom(chatcontent)` 轻松地解决。该方案的缺点是，当 `You` 尚未向任何人（而不是向 `Me`）发送任何内容时，`@grd6`
    并不成立。


    ![image](img/pg57_1.png)


    上述缺点表明，可以在 `You` 首次被系统时添加默认的 `chat-content` 关联。下方的事件 `add-user` 将用户 `u` 添加到现有用户集合中。集合表达式
    `USER\user` 返回所有尚未添加到系统的用户集合。动作 `@act2` 对于所有现有内容的集合为用户 `u` 添加默认的 `chat-content`
    关联。在这种情况下，`∅` 是用户的空集。下方的 `@act2` 的正确性由 Rodin 证明器通过自动释放所有相关 PO 确立；特别是，`@act2` 遵循第
    3.4 节中的 `@inv4`，该定义要求确保 `users` 和 `content` 之间的偏函数关系。


    ![image](img/pg57_2.png)


    当我们下次创建一个新的内容项时，由 `@act2` 编码的关联会发生什么？下方显示了事件 `add-content`。对于每一个现有用户，下方的 `@act2`
    将新内容 `c` 关联到用户空集，换句话说，内容项 `c` 显示为由整个用户集合（变量 `user`）发送给任何人。


    总结聊天事件，如果我们想在 `Me ↦ You` 聊天之外，还想在 `You ↦ Me` 聊天中添加内容项 `c`，那么我们将面临一项计算开销的任务：每当我们向系统添加一个用户时，我们都需要为每个现有内容项关联
    `∅`，而且每当我们需要添加一个新内容项 `c` 时，我们都需要将每一个用户关联到 `{c ↦ ∅}`。这种关于将聊天内容关联到 `You ↦ Me` 的复杂性的分析通常并不复杂；这种分析可以通过仔细的代码检查或测试来完成。但在
    EVENT B 中编写聊天系统的形式化规范迫使我们进行代码检查，并且使用 Rodin 定理证明器可以确保在用 Rodin 自动检查 EVENT B 规范时无需花费精力编写适当的测试场景。


    注意，在聊天中如下表示 `@act3` 是不可通的，因为最后一个覆盖表达式忘记了 `chatcontent(You)`，这等同于删除了它。Rodin 无法发现这个问题，特别是是关于第
    3.4 节中的不变性 `@inv4`，因为下方为 `You` 的新关联无论如何都是偏函数。只有领域专家才能发现这一点，他们知道每当内容项发送给某人时，就会删除该人的聊天。


    ### 3.10.3 事件：DELETE-CONTENT 和 REMOVE-CONTENT


    `delete-content` 和 `remove-content` 是我们系统中两个微妙的功能。`delete-content` 不从 `You ↦ Me`
    聊天中移除 `c`。在什么情况下应该向 `delete-content` 添加 `@act2 content := content\{c}`？Rodin 将生成一个不可证明的
    PO。该 PO 涉及第 3.3 节中的 `@inv4`。需要证明对于 `Me` 之外的任何用户，`chatcontent(Someone)` 都是从 `content`
    的偏函数，这是可能的，因为 Someone 之前发送（转发或广播）过 c。


    ![image](img/pg59_1.png)


    解决此问题的方法是将内容表示如下。然而，这样计算 `chatcontent` 的值需要遍历两次用户和一次内容，取决于 `chatcontent` 使用的类型结构，可能会耗时。


    ![image](img/pg59_2.png)


    注意，如果 `Me` 与 `You` 聊天，`You` 与 `Another` 聊天，且 `Me` 向 `You` 发送 `c`，`You` 向 `Another`
    发送 `c`，则用参数 `Me`、`You` 和 `c` 调用 `remove-content` 不会从 `You` 和 `Another` 之间的聊天中移除
    `c`，而仅从 `Me` 和 `You` 之间的聊天中移除。因此，`remove-content` 没有实现第二个动作 `@act2 content :=
    content\{c}`。为了表示内容的新值，我们可以采用上述方法，并在 `remove-content` 事件中添加以下行。


    ## 4 Poporo 社交网络


    本章介绍了一个名为 *Poporo* 的社交网络的完整 EVENT B 形式化模型。Poporo 是一种黄金制成的容器，供前哥伦布时期（哥伦布之前）的美洲居民用于社交以及与古代神灵交流。Poporo
    被认为具有神秘的社交交流能力。这些神秘交流能力可能归于石灰和碎可卡叶的混合物，这些物质被倒入 Poporo 中。Poporo 属于 Chibcha、Muisca、Quimbaya
    和 Calima 前哥伦布文化。


    ![image](img/pg61_1.png)


    图 4.1：Muisca Poporo。

