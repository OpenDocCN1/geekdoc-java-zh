    ## 4.2 POPORO’S FORMALIZATION IN EVENT B


    Context `ctx` below defines the carrier sets for the persons and the content items
    in the social network. `PERSON` and `CONTENT` are uninterpreted sets, and hence
    they’re not constrained to contain elements of any particular type.


    ![image](images/pg66_1.png)


    FUN-1 is about a static aspect of social networks that has to do with users and
    content. We use `person` to model users, and `content` to represent social network
    content. `person` and `content` are subsets of the two carrier sets defined in
    `ctx`. The label used in each invariant below help PO generators to map the invariant
    to a particular PO.


    ![image](images/pg66_2.png)


    FUN-2 is related to the ownership of social network content. One can think of
    several possible definitions for the ownership of content; the one we selected
    here involves network content and people. One can define `owner` as a relation
    between `content` and `person`, but this would allow, for instance, several persons
    to own the same network content, which is not what we want to model here. One
    should thus model `owner` as a function. If we model `owner` as a `partial function`
    from `content` to `person`, then we would permit some content to exist that is
    not owned by anyone in the social network, which does not comply with the typical
    behavior social networks have. Therefore, we choose to model `owner` as a `total
    function`. We also choose `owner` to be `surjective`. This ensures that each person
    has at least one owned content item. We show the definition of `owner` below.


    ![image](images/pg67_1.png)


    We use a fresh label for our third machine invariant. As said before, labels enable
    automated tools to generate distinctive POs. [Section 4.4](#12_Chapter04.xhtml_ch4_4)
    presents an example of how an invariant PO is proven using Rodin.


    The static part of FUN-3 involves page content and people. We use a relation `page`
    from `content` to `person` to model page content (see `@inv4` below). `page` is
    a `total surjective` relation. It associates every element in its range with at
    least one element in its domain (surjective). It further associates each content
    item in its domain with at least one person in its range (total). Therefore, each
    content item is in someone’s page, and every person has at least one content item
    on their page.


    We could have defined `page` as a relation from `person` to `content` instead.
    However, we want our definitions to be as uniform as possible. For instance, `page`’s
    definition is uniform with respect to `owner`’s definition; they share the same
    domain and range types. Uniformedness is useful when one has to compose different
    relations, or state properties of the inverse of some relation with respect to
    another, or state a set inclusion property between two relations.


    ![image](images/pg67_2.png)


    FUN-3 also involves a dynamic part. It tells about the user’s ability to upload
    content to the network. Dynamic behavior is implemented with the aid of events.
    The event `upload` below implements the dynamic part of FUN-3. The event takes
    two parameters, `c` and `p`. The two event guards are the typing conditions for
    the two parameters, respectively. `@grd1` checks that `p` is an existing person,
    and `@grd2` checks that `c` is a fresh content. Event `upload` includes three
    actions. In `EVENT B`, event actions must assign into a set of different variables,
    and the execution of the event actions together are assumed to take no time; they
    are `atomic`. The three actions modify `content`, `owner`, and `page`, respectively.


    ![image](images/pg67_3.png)


    ## 4.3 INVARIANT PO


    A PO describes what should be proven for a model. Invariant POs are generated
    automatically. A PO is a `sequent` formed of `hypotheses` and a `goal`. Of particular
    interest for us are `invariant proof obligations`. The execution of machine events
    must comport with machine invariants. Hence, for each event definition, invariant
    proof obligations are generated.


    ![image](images/pg68_1.png)


    Figure 4.2: Invariant PO rule.


    Rule `INV` shows the invariant PO rule for events. `I(s, c, v*)` is the machine
    invariant, which depends on all sets `s` and constants `c` defined in the machine
    context, and the machine variables `v`. Event guard `G` additionally depends on
    the set of event parameters `x`. One must prove that the modified invariant `I(s,
    c, E(s, c, v, x))` holds. The modified invariant accounts for the effect produced
    by the execution of the event actions, hence, one must prove the machine invariant
    holds after replacing the set of machine variables `v` by expression `E`. Notation
    `v′` is used for the value of `v` after the execution of the event, that is, the
    value of `v` in the post-state.


    Which POs should one discharge to ensure event `upload` complies with `@inv3`?
    Invariants are assumed to hold before the execution of the event and must be proven
    to be correct after its execution. Invariant `@inv3` states that `owner` is a
    total surjective function. One must prove that if `owner` was a total surjective
    function before event `upload` executes, then it continues to be a total surjective
    function after it executes. One must prove that `owner`, after adding the pair
    `c↦p` to it, is a total surjective function that goes from the modified `content`
    to `person`.


    To discharge this PO, one must reason for parts. The modified `owner` is a function
    since it was a function before the event executes, and the fresh content `c` is
    not in its domain. The modified `owner` is a total function since it is a function,
    it was initially total, and it sets an image for a new element added to its domain.
    The `owner` is surjective because it was surjective before the event executes,
    and the pre-image of `p` is `c`.


    ![image](images/pg69_1.png)


    Figure 4.3: Invariant PO for owner.

