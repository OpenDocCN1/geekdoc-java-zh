    \ Event B 进行 Java 开发\n*实用指南*\nNéstor Cataño Collazos\nGoogle, Inc.\n*软件工程合成系列讲座\
    \ #5*\n\n![Image](img/pub.png)\n\n## 摘要\n在软件产品完成后修复软件设计缺陷的成本极高，因此在软件开发的早期阶段检测软件设计缺陷至关重要，例如在软件需求阶段、分析活动期间或编码开始之前的软件设计阶段。软件需求存在歧义或相互矛盾的情况并不罕见。由于软件需求通常用自然语言编写，而自然语言与任何形式化语义挂钩，这加剧了歧义性。缓解软件需求歧义的一种方法是将其语法限制在样板（即带有占位符的文本模板）中。然而，由于非正式需求不具备任何特定的语义，因此无法证明关于它们（或关于它们试图描述的系统）的任何本质属性。形式化方法是解决这一问题的替代方案。它们提供了一系列数学技术和数学工具，用于在软件开发的早期验证软件需求。本书是使用形式化方法开发软件的现场证明。我们使用的特定形式化方法是\
    \ `EVENT B` 和细化演算。简而言之：(i) 以用户故事（User Stories）的形式编写软件需求；(ii) 将它们迁移到形式化规范中；(iii)\
    \ 根据需要对其进行细化；(iv) 以原型的形式实现；最后 (v) 对它们进行一致性测试。如果某些单元测试失败，则重新审并演进软件系统的非正式和形式化规范。\n\
    \n本书介绍了一个使用 `EVENT B` 开发聊天系统的案例研究，以及一个社交网络属性的形式化证明的案例研究。\n\n## 关键词\n构造性正确性、离散数学、`EVENT\
    \ B`、形式化方法、`Java`、编程、细化、软件工程、验证\n\n## 目录\n- **前言**\n- **1 引言**\n- **2 EVENT B\
