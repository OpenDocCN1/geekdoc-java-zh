    | G(c,v) | 逻辑谓词 |

    | v | 互不交的机器变量（子）集 |

    | E(c,v) | 表达式集合 |


    ### 示例 12. 聊天系统：add-user


    我们在下文中展示了事件 `add-user` 的定义，它向聊天系统添加一个新用户。事件守卫 `@grd1` 保证用户 `u` 是一个新用户。动作 `@act1`
    将 `u` 添加到用户集中。动作 `@act2` 将 `u` 的聊天内容初始化为 `∅`（空集）。


