    机器包含了变量、不变变量和事件的定义。`Poporo` 机器可以看到上下文 `ctx`。该上下文包含了常量、载体集、公理和定理的定义。常量和变量代表 `EVENT
    B` 模型的静态部分，而事件构成了其动态部分，因此它们可能会修改（机器）状态变量。因此，`Poporo` 机器可以访问 `ctx` 中定义的所有常量定义、公理的定理，就像它们在本地声明的一样。该机器声明了四个变量，即
