    [Figure 4.1](#12_Chapter04.xhtml_fig4_1) presents a typical Muisca’s Poporo. The
    presented social network is named Poporo in honor of these first Amerindian cultures
    that gathered and socialized together.


    [Section 2.3](#10_Chapter02.xhtml_ch2_3) presents a series of steps of software
    development methodology based on `EVENT B`. These steps offer a supplementary
    view of the early validation methodology presented in [Section 2.4](#10_Chapter02.xhtml_ch2_4).
    We show those steps again below.


    1. An initial blueprint (`machine`) of the system is written in `EVENT B`. The
    initial blueprint plays the role of the most abstract view of the system that
    we want to model.

    2. Soundness proofs that demonstrate that each event in the initial blueprint
    adheres to the invariant properties are conducted, for instance, by using the
    `Rodin` platform.

    3. A model refinement for the blueprint is written. You can refine your model
    horizontally, vertically or combine both.

    4. Consistency proofs that demonstrate that the blueprint refinement is a correct
    refinement of the blueprint are conducted.

    5. The two previous steps are iterated as many times as desired.

    6. Code is implemented or tool generated for the final model refinement.


    Whereas [Chapter 3](#11_Chapter03.xhtml) is dedicated to steps 1 and 3, this chapter
    is rather dedicated to steps 2 and 4. This chapter shows how to discharge (prove)
    some typical POs for Poporo semi-automatically in `Rodin`. `Rodin` includes a
    plug-in called `EVENTB2JAVA` (Cataño et al., 2015) that generates `JAVA` code
    for `EVENT B` models automatically.


    [Table 4.1](#12_Chapter04.xhtml_tab4_1) shows a simplified model for social networking
    in `EVENT B`. Our complete formalization for social networking is called `Poporo`.
    It shares many features with existing well-known social networking web sites like
    Facebook and others, and additionally, all its components are formalized in predicate
    logic. The `Poporo` machine includes definitions for variables, invariants, and
    events. The `Poporo` machine sees the context `ctx`. The context includes definitions
    for constants, carrier sets, axioms, and theorems. Constants and variables represent
    the static part of an `EVENT B` model, whereas events constitute its dynamic part,
    and thus they might modify (machine) state variables. Thus, the `Poporo` machine
    can access all the constant definitions, axioms, and theorems defined in `ctx`
    as if they were declared locally within it. The machine declares four variables,
    namely `person`, `content`, `owner`, and `page`. The variable `person` represents
    the set of all persons of the social network. The variable `content` represents
    the set of all the content items of the social network, for instance, pictures,
    text messages, and videos. A variable `owner` models who owns which content, and
    `page` stores the contents of each person’s home page. `Poporo` declares four
    invariants. The first two invariants typeset variables `person` and `content`.
    Elements of these variables are taken from carrier sets `PERSON` and `CONTENT`,
    respectively.


    The third invariant in [Table 4.1](#12_Chapter04.xhtml_tab4_1) states that `owner`
    is a total surjective function from `content` to `person`. The total condition
    ensures that some person owns every content item, and the surjective condition
    ensures that every person owns some content item. The fourth invariant declares
    that `page` is a total surjective relation between `content` and `person`.


    The `initialization` event gives initial values to the machine variables. Poporo
    initializes all the machine variables to the empty set, denoted `∅`. The event
    `upload` of the social network uploads certain content `c` to the page of person
    `p`. Variables `c` and `p` are parameters of the event `upload`. Guards are logical
    predicates formed of constants, machine variables, sets, and event parameters.


    Table 4.1: A simplified version of the Poporo abstract machine


    ![image](images/pg63_1.png)


    `upload`’s guards are labeled `@grd1` and `@grd2`. The first guard typesets parameter
    `c` and the second one variable `p`. The first guard checks that `c` is a fresh
    content, and the second guard checks that `p` is an existing person. `upload`’s
    actions are labeled `@act1`, `@act2`, and `@act3`. Each event action must assign
    to a different machine variable. The first action adds content item `c` to `content`.
    The second action adds the pair `c↦p` to `owner`. Thus, person `p` becomes the
    owner of the fresh content item `c`. The third action adds content item `c` to
    the page of person `p`. Event guards play the role of event pre-conditions. Events
    do not have an explicit notation for a variable post-condition, nevertheless,
    in `EVENT B`, the use of a variable on the right-hand side of an assignment denotes
    the value of the variable in the pre-state of the event, and its use on the left-hand
    side of an assignment denotes its value in the post-state of the execution of
    the event.


    ## 4.1 POPORO’S GENERAL STRUCTURE


    Poporo’s most abstract functionality is described in [Table 4.2](#12_Chapter04.xhtml_tab4_2).
    Its third column tells which requirements are related to which `EVENT B` machine
    or refinement. This basic model considers an abstract machine and one single machine
    refinement. The single refinement machine sees permissions on content items on
    top of what the abstract machine already sees. [Table 4.3](#12_Chapter04.xhtml_tab4_3)
    shows an extension of the basic model that is slightly discussed here. The extended
    model sees friendship relationships, the wall, and a chatting room.


    | Table 4.2: Poporo’s initial model |


    | **Model** | **What does the model see?** | **Requirements** |

    | :--- | :--- | :--- |

    | **Poporo abstract machine** | Users, content, owner | FUN-1, FUN-2, FUN-3 |

    | **Refinement 1** | Permissions | SEC-1, SEC-2, FUN-4,INV-1, INV-2 |


    | Table 4.3: Poporo’s extended model |


    | **Model** | **What does the model see?** |

    | :--- | :--- |

    | **Refinement 2** | Principal and secondary content |

    | **Refinement 3** | Friendship relations (best friends, social friends, acquaintances)
    |

    | **Refinement 4** | The wall |

    | **Refinement 5** | The chatting room |


    [Table 4.4](#12_Chapter04.xhtml_tab4_4) below summarizes the notation that we
    will be using in this chapter for writing requirements. This notation differs
    from the notation used in [Chapter 3](#11_Chapter03.xhtml) in which we use USs
    to write requirements. `FUN` is the set of functional requirements. `SEC` is the
    set of non-functional requirements related to security and privacy aspects of
    the Poporo social network. `INV` is the set of safety properties of Poporo. Each
    requirement is composed of two parts, the software requirement itself, and prose
    that conveys intended design decisions.


    | Table 4.4: Requirement’s notation |


    | :--- | :--- |

    | **FUN** | Requirements about the functionality of the system |

    | **SEC** | Requirements about privacy and security |

    | **INV** | Invariant property |


    This separation between prose and requirement has two purposes. Prose helps new
    readers to get acquainted with the system; it also helps frequent readers to read
    the requirements quickly. The requirement uses mathematical notation that is more
    suitable for expert readers. We write prose in a grey color.


    In what follows, we present Poporo’s abstract machine software requirements. [Table
    4.5](#12_Chapter04.xhtml_tab4_5) shows Poporo’s functional requirements. `FUN-1`
    states that the system should model users and data. The second requirement tells
    us that ownership should be modeled by the system state, and this requirement
    and the third one state that the system must dynamically be able to upload data.
    The fourth functional requirement describes a common feature in social network
    whereby content streaming can be made visible or invisible to someone’s page.
    This requirement models the situation when one wants to switch on or off people’s
    updates.


    | Table 4.5: Poporo’s functional requirements |

