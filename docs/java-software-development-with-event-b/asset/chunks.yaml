    该聊天应用程序实现了删除交换内容的两种不同行为：“为我删除内容”和“为所有人删除内容”。如果内容发送者想要删除某些交换内容，她可以从自己的聊天记录中删除或从内容接收者的聊天记录中删除。相反，内容接收者只能从自己的聊天记录中删除内容。这两种行为分别由
    `US-04a` 和 `US-04b` 描述。


    删除内容是一种在逻辑上难以编码的细微功能，因为很容易破坏不变性。例如，如果一个人从聊天的一侧删除了内容而另一侧没有删除，就会破坏任何强制双方读取相同内容的不变性约束。


    | `US-04a` | `delete-content` |

    | :--- | :--- |

    | `delete-content` | 作为用户，我想删除在聊天会话期间与你交换的一些内容，以便让我的聊天界面保持整洁 |

    | **验收准则** | `Given`: 内容存在 `When`: 我决定删除我收到的内容 `Then`: 我的内容被删除 |


    | `US-04b` | `remove-content` |

    | :--- | :--- |

    | `remove-content` | 作为用户，我想移除在聊天会话期间与你交换的一些内容，以便让我的聊天界面保持整洁 |

    | **验收准则** | `Given`: 内容存在 `When`: 我决定移除我发送的内容 `Then`: 该内容从我以及任何接收过该内容的用户处被移除
    |


    聊天会话及相关内容也可以被删除。`US-05` 未说明的是，如果我和你之间的会话被删除，你看到的内容会发生什么？内容也会从你那里被删除吗？无论谁将内容发送给谁，删除我和你之间的聊天会话都不会删除你看到的内容，然而，存在一个
    `remove-content` 用户用例，可以同时删除双方的内容。


    | `US-05` | `delete-chat-session` |

    | :--- | :--- |

    | `delete-chat-session` | 作为用户，我想删除我和你之间的聊天会话 |

    | **验收准则** | `Given`: 我和你之间存在聊天会话 `When`: 我选择删除唯一的活动聊天会话 `Then`: 聊天会话及其相关内容均被删除
    |


    当聊天会话被静音时，两个聊天用户之间的通信均被禁用。尽管如此，之后可以启用通信。这由 `US-06` 描述。


    | `US-06` | `mute-chat` |

    | :--- | :--- |

    | `mute-chat` | 作为用户，我想静音一个聊天会话，以便防止我和你之间的通信 |

    | **验收准则** | `Given`: 我和你之间存在聊天会话 `When`: 我决定静音我和你之间的聊天会话 `Then`: 该聊天会话被静音，且不允许我向静音用户发送信息或反之亦然
    |


    `US-07` 有关重新建立静音会话中两个用户之间的通信。只有静音会话的用户才能取消静音。


    | `US-07` | `unmute-chat` |

    | :--- | :--- |

    | `unmute-chat` | 作为用户，我想取消我和你之间聊天会话的静音，以便重新与你建立通信 |

    | **验收准则** | `Given`: 我和其他之间的聊天会话已静音 `Given`: 我静音了我和你之间的聊天会话 `When`: 我选择取消静音某个聊天会话
    `Then`: 我和你之间的通信被重新建立，即我和你之间的聊天恢复静音状态 |


    `US-08` 和 `US-09` 描述了某些内容被发送给一组用户的情况；转发内容需要我与该组用户之间对应的聊天会话存在，如果这些会话尚不存在，广播将创建新的聊天会话。


    | `US-08` | `broadcast` |

    | :--- | :--- |

    | `broadcast` | 作为用户，我想向一组用户广播某些内容，以便我快速与他们所有人通信 |

    | **验收准则** | `When`: 我决定向一组用户广播某些内容 `Then`: 该内容被发送给组中的所有用户 |


    | `US-09` | `forward` |

    | :--- | :--- |

    | `forward` | 作为用户，我想向一组用户转发某些内容，以便我快速与他们所有人通信 |

    | **验收准则** | `Given`: 我和其他用户之间存在对应的聊天会话 `When`: 我决定向一组用户转发某些内容 `Then`: 该内容被发送给组中的所有用户
    |


    `US-10` 是 `US-02` 的对应项；取消选择聊天需要该会话处于活动状态。


    | `US-10` | `unselect-chat` |

    | :--- | :--- |

    | `unselect-chat` | 作为用户，我想取消选择我和你之间的聊天会话，以便与另一个用户聊天 |

    | **验收准则** | `Given`: 我和你之间存在聊天会话 `Given`: 我和你之间的聊天会话处于活动状态 `When`: 我决定取消选择与你的聊天
    `Then`: 我和你之间的聊天会话变为非活动状态 |


    注意，`select-chat` 和 `unselect-chat` 可以在不要求聊天分别处于非活动状态或活动状态的情况下编写。考虑到最终的编码，这两个事件最终可以通过添加一个相应的检查
    `if` 条件来编码，该条件在不满足时不执行任何操作。与相反，我们在用户用例中施加了这些 `Given` 条件，并最终体现在各自的 `EVENT B` 中。


    在 EVENT B 中建模系统时，除了机器的核心功能外，还应该编写一系列限制并决定系统行为的不变性。


    ### 表 3.2: MachineZero 的不变性


    | # | 不变性 |

    | :--- | :--- |

    | 1 | 用户在整个系统中被唯一标识 |

    | 2 | 内容在整个系统中被唯一标识 |

    | 3 | 聊天会话在整个系统中被唯一标识 |

    | 4 | 一个聊天会话恰好关联两个用户 |

    | 5 | 两个用户之间最多建立一个聊天会话 |

    | 6 | 两个用户之间的聊天会话可能有一组关联内容，供其中一个或双方均可用 |

    | 7 | 只有当会话的用户之一向对方发送了内容或反之时，内容才会与聊天会话关联 |

    | 8 | 活跃和静音是互斥的概念。即系统绝不会进入用户 A 静音用户 B 且正与其进行活动聊天的状态 |

    | 9 | 聊天会话并不一定是对称的。即 A 创建与 B 聊天的会话这一事实并不意味着 B 创建与 A 聊天的会话 |

    | 10 | 活动聊天会话并不一定是对称的。即 A 正在与 B 聊天这一事实并不意味着 B 正在与 A 聊天 |

    | 11 | 绝不存在与没有聊天会话的用户对而关联的聊天内容 |

    | 12 | 可以创建多个聊天会话，但每个用户最多只能有一个（或没有）活动状态的聊天会话 |

    | 13 | 与静音用户的通信是不可行的：无法从或向静音聊天会话进行内容交换 |


