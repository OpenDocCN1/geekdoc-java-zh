    A relation is just a set of pairs and thus a user page can be defined as `page
    ≙ {(John, Photo1), (John, Video1), (Mary, Photo1), (Mary, Video2)}` whereby `John`
    has two content items, `Photo1` and `Video1`, `Mary` has the same photo as `John`,
    but has a different video on her page. The domain of `page` is `dom(page) ≙ {John,
    Mary},` and its range is `ran(page) ≙ {Photo1, Video1, Video2}`. Notice the use
    of the symbol “`≙`” for “is defined as” or “is written as”, which should not be
    confused with the symbol `“=` a Boolean operator used for “equals to”.


    We can enforce a stricter definition for user pages by enforcing that every user
    has (at least) one content. This is achieved by either asserting the invariant
    `person = dom(page)` or, equivalently, by making `page` a total relation `page
    ∈ person  content`. Likewise, one can enforce the property that any content is
    in someone’s page by asserting the invariant `content = ran (page)` or, equivalently,
    by declaring `page` as a surjective relation `page ∈ person  content`. Finally,
    we can enforce both properties by declaring `page` as a total surjective relation
    `page ∈ person  content`.


    In a social network some users can own certain content, for instance, if a user
    uploads some content to their page, then the user becomes the owner of the said
    content. We can model content ownership by introducing a total function from content
    to users as `owner ∈ content → person`. The fact that `owner` is total ensures
    that every content has an owner, and the fact that it is a function ensures that
    the owner is unique. If we further make `owner` surjective then we force every
    person to own some (at least one) content: `owner ∈ content ↠ person`.


    We can then define a hierarchy of permission over content, the `viewp` permission
    indicates that a user can view or read some content, and the `editp` permission
    that she can modify it.


