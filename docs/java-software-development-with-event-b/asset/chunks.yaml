    ## 4.4 DISCHARGING POS IN RODIN


    [Figure 4.4](#12_Chapter04.xhtml_fig4_4) shows the event `delete` as defined in
    `Poporo`’s abstract machine in Rodin. An existing content item `c`, a set of content
    items `cts`, and their owner `ow` parameterise the event `delete`. The event deletes
    `c` (*principal content*) and `cts` (*associated secondary content*). The bottom
    right part of the figure shows the Symbols toolbox for writing standard EVENT
    B mathematical symbols. Discharged (proven) POs are depicted in green (left-hand
    toolbox), undischarged in red, and unattempted POs in brown color. Rodin uses
    different *Perspectives*. The upper-right part of the figure shows that the current
    perspective is the *Event B perspective*.


    One can either manually switch to a particular perspective (*Window, Open Perspective*)
    or undertake an action that makes the Rodin IDE switch to a default perspective
    for the performed action. If we double-click a PO (shown on the left panel), then
    it is open in the *Proving Perspective* of Rodin. Rodin comes with a list of predefined
    provers. A particular prover may or may not succeed to discharge a particular
    PO, and hence one is forced to use a different prover or to attempt to discharge
    the PO manually.


    The bottom part of [Figure 4.4](#12_Chapter04.xhtml_fig4_4) shows the various
    provers shipped with Rodin^([6](#12_Chapter04.xhtml_rfn4_6)). The `PP` prover
    is a third-party prover from the AtelierB tool. `nPP` is a native prover to Rodin.
    A *lasso* operation adds more hypotheses to the current proof that share common
    variables between the goal and the selected hypotheses. Provers can be used with
    different forces. `p0` (`PP` with force 0) feeds the `PP` prover with the selected
    hypotheses and with the current goal. `p1` (`PP` with force 1) performs a lasso
    operation before passing the hypotheses and goal to `PP`. `nPP` can be used with
    different forces too. The Rodin manual recommends the use of `nPP` before attempting
    any proof with `PP`. The `ML` prover is useful to discharge proofs that involve
    arithmetic.


    ![image](images/pg70_1.png)


    Figure 4.4: Rodin IDE.


    Next, We show how to discharge a PO in Rodin. The example is an invariant PO for
    event `delete`. The PO is generated to attest compliance of event delete to machine
    invariant `@inv4` in [Section 4.2](#12_Chapter04.xhtml_ch4_2). The proof is conducted
    with Rodin version 3.2.


    ![image](images/pg70_2.png)


    Figure 4.5: `@inv4` invariant PO for event `delete`.


    `nPP` and `PP` both fail to discharge the PO automatically. We adopt the following
    approach to discharge this PO. We strengthen the hypotheses, and then we undertake
    the proof by parts. Strengthening the hypotheses boils down to proving an intermediate
    result. Undertaking a proof by parts boils down to applying the divide-and-conquer
    principle. If we want to prove that some relation is *total surjective*, we first
    prove that it is *total*, then we prove that it is *surjective*, and finally we
    build on these two independent proofs.


    The command `ah` of Rodin adds a new hypothesis to the list of hypotheses of a
    proof. The hypothesis, an auxiliary result, must be proven correct first. We add
    the auxiliary result below, a weaker version of our main goal above. `nPP` discharges
    the auxiliary result automatically. The result is hence added to the main goal
    as a sixth hypothesis.


    ![image](images/pg71_1.png)


    After proving the previous auxiliary result, we split the main proof into two
    parts; we first prove the *total* part of the goal and then the *surjective* part.
    We add the hypothesis below that accounts for the total part of the main goal.


    ![image](images/pg71_2.png)


    `nPP` and `PP` both fail to discharge this hypothesis automatically, and hence
    we decided to help the prover do its job by adding a yet simpler hypothesis on
    top of the previous one, which `nPP` discharges straightforwardly. The result
    below is added as the seventh hypothesis of the proof of the hypothesis above.
    Calling `nPP` with selected hypotheses sixth and seventh henceforth discharges
    the result above.


    ![image](images/pg71_3.png)


    We add the hypothesis below that accounts for the surjective part of the main
    goal, which again `nPP` and `PP` both fail to discharge.


    ![image](images/pg71_4.png)


    We hence add the following hypothesis, which is proven with `PP`. The hypothesis
    above is discharged with `nPP` by selecting the sixth hypothesis and the hypothesis
    below.


    ![image](images/pg71_5.png)


    Surprisingly, after having proven the total and surjective parts, Rodin provers
    still fail to discharge the main proof. The problem is caused by the expression
    `{c} ∪ cts`, which Rodin attempts to simplify. We eliminate the noise caused by
    that expression with the aid of the command `ae` (added expression). We tell Rodin
    to see `{c} ∪ cts` as a whole indivisible expression. After that, `nPP` discharges
    the main goal with the selected hypotheses.


    ## 4.5 POS FOR QUANTIFIED EXPRESSIONS


    Discharging POs that involve universally or existentially quantified properties
    is often complex since provers cannot instantiate quantifiers automatically, in
    general. We show a small example of how a universally quantified invariant is
    proven. We model an invariant property that says people can only own content items
    that exist in their pages, and we present two equivalent versions of that invariant:
    invariant `@inv51` uses set operations; and invariant `@inv52` uses a universally
    quantified expression.


    ![image](images/pg72_1.png)


    We are interested in discharging the PO generated for `@inv52` with respect to
    event `hide` below, which hides a content item `c` from the page of a user `p`.


    ![image](images/pg72_2.png)


    Following up the invariant PO rule in [Figure 4.2](#12_Chapter04.xhtml_fig4_2)
    in [Section 4.3](#12_Chapter04.xhtml_ch4_3), a *sequent* is formed with hypotheses
    that account forinv52` and the guards of the event `hide`, and the goal of the
    sequence is a modified version of `@inv52` that accounts for the state changes
    introduced by the event actions. [Figure 4.6](#12_Chapter04.xhtml_fig4_6) shows
    the sequent. Hypothesis 1 is `@inv52`, hypotheses 2 to 5 are the event guards.
    Rodin automatically instantiates the goal (a universally quantified invariant)
    and applies modus ponens, hence the hypothesis number 6. The latter hypothesis
    types `c1` and `p1`.


    ![image](images/pg73_1.png)


    Figure 4.6: PO for event hide as per `@inv52`.


    To discharge this PO one should instantiate the first hypothesis with appropriate
    values. One needs two values of type `content` and `person` such that the mapping
    from the latter to the former is an element of `owner`. After the instantiation
    of this hypothesis with `c1` and `p1`, `nPP` discharges the PO automatically.
    However, had we defined `@inv52` as `@inv51`, the prover would have discharged
    the underlying PO without human intervention.


    ## 4.6 STRENGTHENING THE SPECIFICATION


    This section partially shows the development of the first refinement machine in
    [Table 4.2](#12_Chapter04.xhtml_tab4_2). The refinement involves requirements
    SEC-1, SEC-2, FUN-4, INV-1, and INV-2. SEC-1 and SEC-2 refer to the static part
    of the refinement machine; they extend Poporo’s abstract machine to model access
    permissions. We use two relations `viewp` and `editp` as below to represent *view*
    and *edit* permissions. Note that labels in the refinement machine are different
    to the labels in the refined machine. This allows tools like Rodin to generate
    POs for invariants.

