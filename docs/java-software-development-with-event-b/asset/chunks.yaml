    ### Example 9. Relational and Functional Overriding


    The overriding `r⊕q` of a relation `r` by a relation `q` returns a relation formed
    taking all the pairs of `q` and adding all the pairs of `r` whose first elements
    are not in the domain of `q`. Overriding is particularly important when both `r`
    and `q` are functions as it returns another function that updates all the elements
    in the domain of `q`. One can update the owner `ow` of a content item `c` through
    the assignment `owner(c) ≔ ow` or using the function expression `owner⊕{c↦ow}`.


