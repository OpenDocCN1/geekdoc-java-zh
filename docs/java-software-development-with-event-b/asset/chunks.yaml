    For the concrete event `delete-principal`, and for the abstract event `delete`
    and the abstract event guard `@grdr12`, Rodin generates the following `GRD` PO
    as `delete-principal/grdr12/GRD`. The two first hypotheses below are the concrete
    event guards, and the goal is the abstract event guard. We have intentionally
    omitted other hypotheses here. The second hypothesis says that `owner(c)` owns
    principal content other than `c`. This hypothesis directly entails the goal. Notice
    that `@grdr11` is entailed by `@grdr21` and `@invr17`, `@grdr13` is entailed by
    `@invr18`, and `@grdr14` is entailed by `@invr18` and `@grdr11`.


    ![image](images/pg79_3.png)


    Figure 4.10: Guard PO for event `delete-principal`.


    PO rule `SIM` ensures that the actions of the abstract event are correctly simulated
    by the actions of the concrete event. Concrete actions must not contradict the
    abstract ones, they must be stronger.


    ![image](images/pg80_1.png)


    Figure 4.11: Simulation PO.


    Actions of event delete are entailed by actions in the event `delete-principal`
    as we selected to repeat the actions of the former within the latter. Rodin generates
    other types of POs that we do not mention here, for instance, feasibility POs
    that ensure that proper values exist that make the concrete event guard true.


    - To install the most basic Rodin provers, on needs to add the Update Site [http://methode-b.com/update_site/atelierb_provers](http://methode-b.com/update_site/atelierb_provers).

    - Details on `refines` and `extends` are given in [Section 4.8](#12_Chapter04.xhtml_ch4_8).

    - “Concrete event” means the event in the concrete (refinement) machine, and the
    “abstract event” means the event in the abstract (refined) machine.


    # CHAPTER 5


    ## Conclusion


    The cost of fixing software design flaws after the completing of a software product
    is so high that it is vital to come up with ways to detect software design flaws
    in the early stages of software development before system coding starts. This
    is the motivation of this book as oftentimes software requirements are ambiguous,
    hence they contradict each other. This ambiguity is exacerbated by the fact that
    software requirements are typically written in natural language, which is not
    tied to any formal semantics. This book uses a palliative idea to deal with the
    ambiguity of software requirements: it restricts the syntax of software requirements
    to User Stories, textual templates with placeholders. However, as informal requirements
    (User Stories) do not enjoy any particular semantics, no essential properties
    about them (or about the system they attempt to describe) can be proven easily.
    Therefore, requirements are ported into `EVENT B` where we undertake mathematical
    proofs in Rodin to check their soundness.


    This book is oriented to software developers who seek to increase their background
    in formal methods to develop software based on mathematical utilities. The book
    is divided into three main parts. The first is about `Event B`—a formal methods
    language that is based on discrete mathematics and predicate calculus. The second
    part of the book presents a case study on the software development of a chat system
    in `EVENT B`. The chat is composed of three main models that stem from an abstract
    functionality to a code related functionality. We unit-tested the code generated
    for the chat system and discovered several inconsistencies in the original model
    that we corrected with the aid of the Rodin platform and its underlying provers.
    The third part of the book presents the Poporo social network. This part does
    not focus on software development but on the formal proof of invariant properties.


    We use a systematic approach for the early validation of software requirements
    which is based on the extensive use of formal methods techniques. This validation
    approach works on top of the refinement calculus mechanism of `EVENT B` and employs
    correctness-by-construction and deductive proof techniques with the `RODIN` platform.
    In short, software requirements are modeled as `USs`, then ported to `EVENT B`
    specifications, whose specification is refined as desired within the Rodin platform
    where generated `POs` are discharged. From the `EVENT B` formal specification,
    code is generated, simulated, and validated for flaws. Two types of validations
    are carried out. First, a sanity check of the formal specification is carried
    out to validate if the generated code can be used in standard scenarios. This
    process can result in the definition of new events. It can also result in the
    redefinition of event guards or the introduction of additional invariants. Second,
    code is generated from the formal specification. One can then write unit tests
    to simulate the generated code, and validate it against the informal requirements
    (the `USs`).


    From a research and experimental viewpoint significant challenges and questions
    rest to be addressed to make the type of work presented in this book more cost-effective.


    - How can we (semi-) automatically port `USs` to `EVENT B` syntax?

    - How can we improve Rodin provers so that the rate of `POs` discharged automatically
    is increased?

    - How can we generate unit tests automatically (from `EVENT B` specifications
    or code)?


    The success of formal methods largely depends on the implementation of tools that
    assist users in the use of mathematical techniques that increase their trust in
    the software users want to develop. The `EVENTB2JAVA` code generator that’s used
    in this book helped us increase our trust in the software requirements of the
    chat system, checking inconsistencies in the software requirements specifications
    that otherwise, through code inspection, would be impossible to check. The `EVENTB2JAVA`
    tool does not generate optimal code but code that is correct. It is future work
    to improve the implementation of the tool to generate code that can serve as final
    system implementation. In particular, logical expressions in `EVENT B` that appear
    repeated within the definition of an event are translated and evaluated repeatedly
    in `JAVA`.


    One major frustration in our work is the inadequate tool support for verifying
    `JAVA` programs with respect to the `JML` specifications that are generated by
    `EVENTB2JAVA`. Existing verification tools such as `KeY` and `Krakatoa` cannot
    handle the full syntax of `JAVA` and `JML`, particularly with regard to generics.
    We would like to undertake a case study on replacing parts of the code generated
    by `EVENTB2JAVA` with bespoke implementation and then verifying those implementations
    against the generated `JML` specifications. However, performing such verification
    without adequate tool support is time consuming and prone to error.


    `EVENTB2JAVA` translates `EVENT B` axioms as `JML` invariants. These axioms determine
    the possible values that constants can take. However, `EVENTB2JAVA` cannot (yet)
    automatically generate values for constants that satisfy the axioms. We plan to
    investigate translating the `EVENT B` definitions of constants and axioms to the
    input language of the `Z3` SMT solver, and then use `Z3` to find values for the
    constants.


    ## Bibliography


    - Abrial, J.-R. (2009). Faultless systems: Yes we can! *IEEE Computer*, 9(42),
    30–36\. DOI: 10.1109/MC.2009.283\.

    - Abrial, J.-R. (2010). *Modeling in Event B: System and Software Design*. New
    York: Cambridge University Press. DOI: 10.1017/CBO9781139195881\.

    - Abrial, J.-R. and Hallerstede, S. (2007). Refinement, decomposition, and instatiation
    of discrete models: Application to Event B. *Fundamenta Informaticae*, 77, 1–28\.

    - Abrial, J.-R., Butler, M., Hallerstede, S., Son Hoang, T., Mehta, F., and Voisin,
    L. (2010). Rodin: An open toolset for modeling and reasoning in Event B. *Software
    Tools for Technology Transfer*, 12, 447–466\. DOI: 10.1007/s10009-010-0145-y.

