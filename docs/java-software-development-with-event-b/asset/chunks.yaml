    ### 3.6 MACHINETWO IN EVENT B


    Machine `machine2` adds implementation details to our EVENT B model of WhatsApp2.
    The goal of this machine is to leave the EVENT B model in a way that is close
    to implementation for it to be translated to JAVA using the `EVENTB2JAVA` tool
    (Cataño and Rivera, 2016). Variables of a refined machine can appear in an invariant
    of a refinement machine. When this happens, the invariant is called a *gluing
    invariant* as it relates the state space of the abstract (refined) machine with
    the state space of the refinement machine. Until now, content, users, and chat
    content have been modeled as sets. We want to model them as sequences through
    the use of gluing invariants.


    In EVENT B, a segment of natural numbers can be expressed using the `a..b` notation,
    which defines the set of natural numbers between `a` and `b` inclusive.


    ![image](images/pg44_1.png)


    We can hence use the `1..n` notation to model a sequence of type `T` and size
    `n` as a total function from `1..n` to `T`. By requiring sequence to be a *total
    function* we enforce it to have no holes in its domain.


    ![image](images/pg44_2.png)


    Variable `contents` encode `content` as a sequence. `csize` represents the number
    of content items in `contents`. `content` is the type of `contents`. The domain
    of `contents` is `1..csize`, hence, when `csize` is `0`, `contents` is empty.


    ![image](images/pg44_3.png)


    Next, we choose to implement `chatcontent` as the variable `screen`. This refined
    variable makes content-sent sequential but not the sender or the receiver of the
    content. This is because we mainly use `screen` to display content exchanged in
    an orderly fashion, for which the pair of users do not need to be ordered, just
    the content items.


    ![image](images/pg44_4.png)


    We present the refined version of `chatting` below. When `u1` is chatting with
    `u2`, which chat sessions should be added to `toread`? It should be added `u2↦u1`
    since a content `c` has been sent from `u1` to `u2`, except in the case that `u2↦u1`
    is in `active`. This is modeled by the expression `({u2↦u1} ∖ active)`. We should
    also add the pair `u2↦u1` to `toread` when the pair is `inactive`. This is modeled
    by the expression `({u2↦u1} ∩ inactive)`. But then, if that is the case, we need
    to drop out `u2↦u1` from `inactive`. The latter is achieved by `@actr12`.


    For the content to be displayed in an orderly fashion, the pair of users do not
    need to be ordered, just the content items. `k1` is the position of `c` in `screen`.
    The last conjuncts of `@grdr21` and `@grdr22` together ensure `machine1` exists.
    Action `@actr22` increases the number of content items. Action `@actr23` adds
    `c` at position `csize+1`.


    ![image](images/pg44_5.png)


    Event `delete-content` declares two parameters, `i` and `k`, which represent the
    position of `c` in `screen`, respectively. `@grdr21` checks that `contents(i)
    = c`. `@grdr22` checks that `c` is present. `@actr21` deletes `k` from `screen`.


    ![image](images/pg45_1.png)


    The remaining events of `machine2` are defined similarly. For instance, `forward`
    and `broadcast` are defined similar to `chatting`, and `delete-chat-session` similar
    to `delete-content`.


    We present below the concrete version of `add-user` event as defined in machine2.
    `screen(u)` is made empty as seen by every `user` in the system. ![image](images/pg46_1.png)


    ### 3.7 THE IMPLEMENTATION OF THE CHAT SYSTEM


    EVENTB2JAVA translates an EVENT B machine into a JAVA class. In translating a
    machine, EVENT2JAVA not only considers the information provided by the machine,
    but also the contexts the machine “sees.” Refinement machines are translated in
    the same way as abstract machines since Rodin properly adds abstract machine components
    to the internal representation of the refining machine. EVENTB2JAVA generates
    JML specifications in addition to the JAVA code. JML is an interface specification
    language for JAVA. It is designed to represent the behavior of JAVA classes, and
    it is included directly in JAVA source files using special comment markers. Our
    presentation of WhatsApp implementation here focuses on JAVA mainly.


    EVENTB2JAVA translates Invariants only as JML specifications. The translation
    of constants includes a JAVA part and a JML part. EVENT B logical predicates are
    translated to JAVA predicates written with the aid of classes `BSet` and `BRelation`,
    implementing sets and relations in JAVA, respectively. Refining and extending
    events are translated in the same manner as abstract events. Each event is translated
    to a separate JAVA class. The translation of each event includes an object reference
    to the machine class. The translation of a standard (non-initializing) event includes
    a `guard-event` method that tests if the guard of the `event` holds, and a `run-event`
    method that models the execution of `event`.


    We show below the code that EVENTB2JAVA generates for event `add-user.` Method
    `guard-add-user` below implements the guard of event `add-user` and method run-add-user
    its actions.


    ![image](images/pg46_2.png)

