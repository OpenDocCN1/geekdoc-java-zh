    `create-chat-session` can be refined as many times as necessary. We refine it
    horizontally below (the clause `extends` in `EVENT B`) by adding more observations
    or details about creating chat sessions. Our refinement specification below observes
    active and inactive chat-sessions. `active` is a function that keeps track of
    active chat sessions. It is a function because only one chat session per user
    can be active, in other words, a user can actively be chatting to not more than
    one user. `inactive` keeps track of inactive chat sessions. Action `@actr12` makes
    the chat session added by `@act1` in the refined event active. Concepts such as
    active or inactive are not part of the most abstract formal specification of the
    chat application, but rather of its first refinement.


    ![image](images/pg23_1.png)


    We show below the example of a unit test that partially validates `US-01`. `Class
    Pair` is a utility class. It encodes pairs of elements of any type. `Me` and `You`
    are integer variables defined globally as class attributes, initialized with values
    `1` and `2`, respectively. Hence, `a` is the pair `Me ↦ You` and `b` is the pair
    `You ↦ Me`. The first `assertTrue` instruction checks that `add-user` correctly
    adds `Me` to `user`. The second one checks that `You` is added to `user`. The
    third one checks that the pair `a` is correctly added to `chat`. Following the
    `Then` part of `US-01`, the last assert instruction checks that `b` is not added
    to variable `chat`.


    ![image](images/pg23_2.png)


    The symbol `↦` is called maplet, which reads “maps to”, hence `u1` maps to `u2`.


    Gluing invariants are discussed in [Section 3.6].


    A “prover” is a tool similar to a “proof-assistant”; typically, proof assistants
    give feedback on the proof process and can backtrack to a previous state of the
    proof, whereas provers just try to apply a tactic that will eventually succeed
    or fail.


    # CHAPTER 3


    ## Software Development of a Chat System with EVENT B


    We wrote software requirements for a chat application that includes some of the
    functionality typically found in WhatsApp ([https://www.whatsapp.com/android/](https://www.whatsapp.com/android/)).
    When writing a model for a software system in EVENT B one should write an abstract
    machine and then successively write refinement machines. For each refinement machine
    POs are to be discharged in the Rodin platform to ensure that each machine is
    a proper refinement of the most abstract machines. Only once all the machines
    are written and all the POs are discharged one can consider the underlying system
    has completely been modeled. [Chapter 4] discusses techniques for discharging
    POs.


    We elicited the requirements for the chat application from our own experience
    using (the SmartPhone version of) WhatsApp. User Stories relate to the structure
    of the EVENT B model and the hierarchy of its machines. [Table 3.1] presents that
    hierarchy. The abstract machine (MachineZero) observes basic functionality for
    chat sessions. The first machine refinement includes functionality to check whether
    chat content (text, video, picture) can be read or not. The second machine refinement
    adds implementation details. For instance, it represents content as a sequence
    (rather than a set) of content items. This is important for us because the graphical
    interface of a chat session can be implemented as an ordered sequence of content
    items that reads from the beginning to the end. Additionally, it would help us
    state a property that says that for any chat session, the chat content reads the
    same as seen by the two chat members. This is an invariant property that we model
    here but it is not a property of the SmartPhone version of WhatsApp.


    | Table 3.1: Machines hieraarchy for chat application |


    | Machine | Observations |

    | :--- | :--- |

    | MachineZero | The abstract machine, the basic functionality for chat sessions
    |

    | MachineOne | First refinement, it introduces read and unread status |

    | MachineTwo | Second refinement, it encodes a vertical refinement |


    [Table 3.1] presents the hierarchy of machines of the chat system. The abstract
    machine observes basic functionality for chat sessions including the functionality
    for creating a chat session, selecting or un-selecting a chat, chatting, deleting
    content (text, video, photos), removing content, deleting a chat session, muting
    and un-muting a chat, and broadcasting and forwarding network content. The first
    machine refinement includes functionality to check whether chat content has been
    read or not. The second machine refinement adds implementation details, for instance,
    it represents content as a sequence (rather than a set) of content items. This
    is important for us because the graphical interface of a chat session should be
    implemented as an ordered sequence of content items that reads from the beginning
    to the end. Additionally, it would help us state a property that says that for
    any chat session the chat content as seen by one of the two chat members reads
    the same as it is seen by the other chat member. This is an invariant property.
    This invariant property, in particular, is not a property of the SmartPhone version
    of WhatsApp.


    [Section 3.1] presents the software requirements for MachineZero in [Table 3.1],
    [3.2] the software requirements for MachineOne, and [3.3] for MachineTwo, respectively.
    [Sections 3.4], [3.5], and [3.6] present the formalisation of these software requirements
    in EVENT B.


    ### 3.1 MACHINEZERO


    The abstract machine MachineZero contains 10 USs, from US-01–US-10.


    US-01 describes the functionality for creating a chat session between “Me” and
    “You.” The chat may not exist.


    | US-01 | create-chat-session |

    | :--- | :--- |

    | create-chat-session | As a user, I want to select a chat session so that I can
    start chatting with You |

    | Acceptance criterion | `Given`: A chat session between Me and You does not exist
    `When`: I decide to create a chat session with You `Then`: A chat session between
    Me and You is created, but not between You and Me |


    US-02 describes the functionality for selecting a chat session. The effect of
    having two `Given` conditions is the condition obtained as the conjunction of
    both.


    | US-02 | select-chat |

    | :--- | :--- |

    | select-chat | As a user, I want to create a chat session so as to communicate
    with You |

    | Acceptance criterion | `Given`: A chat session between Me and You exists `Given`:
    A chat session between Me and You is not active `When`: I select my chat with
    You `Then`: The chat session between Me and You is made active |


    US-03 describes the chatting functionality whereby Me chats with You. Sent content
    is made available to both of the users Me and You.


    | US-03 | chatting |

    | :--- | :--- |

    | chatting | As a user, I want to send You some content during a chat session
    with You to express my ideas |

    | Acceptance criterion | `Given`: The chat session between Me and You is active
    `When`: I chat with You `Then`: The chat content is made available to Me as well
    as to You |

