    - **5 结论**\n- **参考文献**\n- **作者简介**\n\n## 前言\n本书通过通过数学手段解释软件工程任务的论述。我们使用的特定形式化方法是谓词演算。本书从介绍关系和函数等谓词演算对象，以及操作这些对象的所有底层操作开始，并示例了如何组合它们来建模软件。使用数学（特别是谓词演算）建模软件的根本原因是它允许我们对想要构建的软件进行推理；我们感兴趣的是验证构建的软件是否符合某些属性，这些属性通常集中在软件需求文档中。\n\
