  raw: 'Software testing has had a major impact on software development for the past
    decades. It has shaped the way people think about the task of software construction.
    People are not surprised to get to implement software that is infested with bugs.
    They expect that bugs will be decanted once the software implementation phase
    finishes. This book uses a different approach; our starting point is that we can
    and should write software that is correct from the very early stages of software
    development. Nonetheless, we use testing to animate the software and to check
    if its running behavior matches its expected behavior.


    Our software construction return to mathematics is based on the idea of assigning
    meaning to software. The idea is to build software the same way that mathematical
    proofs are conducted, guaranteeing that software product lives up to some intended
    meaning. The particular mathematical formalism and language we have chosen is
    called EVENT B, which originated from the Z formalism. Although EVENT B shares
    essentially the same modeling language for stating state properties as Z, EVENT
    B and Z offer different modeling mechanisms that are specialized in distinct mathematical
    aspects. EVENT B and Z are both models for state transition systems. EVENT B’s
    language for expressing the dynamic behavior of state machines is based on events.
    On the other hand, Z uses a rich schema calculus mechanism for expressing the
    dynamic behavior of models. Z Schema calculus and EVENT B events coupled with
    model refinement are different mechanisms. Z also offers refinement, but in practice,
    Z focuses more on formal specification and EVENT B focuses more on model refinement
    and coding (whereas it is manually written or tool-generated). Another major difference
    between EVENT B and Z is in the undertaking and use of invariants. In EVENT B,
    each event definition produces proof obligations that attest to the correctness
    of machine invariants. These invariants might encode safety properties. On the
    other hand, in Z, invariants are incorporated into the model definitions, altering
    their meanings. They do not generate proof obligations.


    The main motivation for using mathematical formalisms in software development
    is economical. The cost of fixing software design flaws after the completing of
    a software product is so high that it is vital to come up with ways to detect
    software design flaws in the early stages of software development, for instance,
    during the software requirements, the analysis activity, or during software design,
    before coding starts. The approach to software construction presented in this
    book is based on the idea of program refinement and correctness-by-construction.


    The book presents a case study of software development of a chat system with EVENT
    B and a case study of formal proof of properties of a social network. We hope
    you enjoy the book as much as we enjoyed writing it.


