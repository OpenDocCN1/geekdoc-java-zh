    `page` 的定义保持一致，从而能够使用 `⊂` 或 `⊆` 等操作符直接比较页面内容和内容权限。


    ![image](img/pg74_1.png)


    `INV-1` 在两个访问权限之间引入了静态层级关系，而 `INV-2` 描述了系统的一个安全属性，即内容项的所有者可以用任何可能的方式访问它。


    ![image](img/pg74_2.png)


    细化机必须与其抽象模型（抽象机器）保持明显的行为关系。这种关系通过一个**粘合不变性**（gluing invariant）属性进行建模，该属性将细化机的变量与被细化机的变量关联起来。简单来说，一个细化模型应该能够替换被细化的（抽象）模型，而让用户察觉到任何变化。接下来，我们描述关于粘合不变性的一些属性。


    *   粘合不变性定义在细化机中。

    *   粘合不变性将细化机的状态与被细化机的状态关联起来。

    *   粘合不变性必须被细化机的事件保持，因此，粘合不变性产生了细化机必须验证的证明目标（POs）。

    *   当细化事件 `refines` 或 `extends` 一个抽象（被细化）事件时，具体事件必须符合通过粘合不变性到达被细化机不变性。


    我们引入了一个粘合不变性，将细化机中的查看权限与被细化机中的页面内容关联起来：对个人内容的查看权限都定义在其页面现有的内容之上。注意，不需要添加类似的将编辑权限与页面内容关联的不变性；该不变性可以从不变性
    `@invr13` 和 `@invr16` 推导出。


    ![image](img/pg75_1.png)


    `FUN-4` 指的是细化机的动态部分，我们编写了一个 `grant-view-permission` 事件。`@grd1` 和 `@grd2` 类型化将授予权限的内容
    `c` 和人员 `p`。`@grd3` 表达了一种防御性的规范编写风格：我们想要授予那些尚未拥有这些权限的内容项权限。`@grd4` 的作用是保持 `@invr16`。由于我们正在向
    `viewp` 添加元素，我们要么向 `page` 添加相同的元素，要么要求该元素存在于 `page` 中，正如我们所做的那样。


    ![image](img/pg75_2.png)


    Poporo 实现了一些删除网络内容的功能。`delete` 事件从网络中的所有页面删除内容项 `c` 和 `cts` 中的所有内容项。当我们细化对系统的观察时，`cts`
    的含义将变得清晰（参见第 4.7 ）。`@grdr11` 类型化 `c`。`@grdr12` 防止事件导致 `owner(c)` 的页面为空。`@grdr13`
    类型化 `cts`。


    第 4.7  显示了主要内容和次要内容的观察。第 4.8  显示了为了确保进一步观察（细化）正确而生成的证明目标。


    ![image](img/pg75_3.png)


    ## 4.7 进一步强化


    我们增加了对页面字段的观察。每个内容项都属于某个字段。内容字段模拟了社交网络中的典型情况，即人们对某些内容项进行评论。评论是一个字段或次要内容项，而被评论的内容项是主内容项。字段属于一个唯一的主内容，就像照片属于唯一的照片专辑一样。删除一个主内容项意味着删除它的所有字段，就像删除照片专辑会删除其所有照片，或者删除一个内容项将迫使人们移除所有内容项评论。其所有者只能删除主内容项。表达式
    `field∼[{c}]` 返回所有主内容为 `c` 的次要内容项。接下来将给出主内容和次要内容的定义。


    ![image](img/pg76_1.png)


    可以使用 `refines` 或 `extends` 关键字对事件进行细化。这两种机制是相似的。扩展事件隐含地包含了被扩展事件的参数、守卫和动作；细化事件则不包含。细化事件还可以为抽象事件的每个消失的参数声明一个见证（使用
    `with` 子句）。被细化（抽象）事件中参数 `x` 的见证是在细化（具体）事件中声明的属性 `P(x)`，通常写作：“`with @x P(x).`”。


    ![image](img/pg77_1.png)


    `delete-principal` 事件细化 `delete` 事件。参数 `cts` 是一个消失的抽象参数，我们在具体事件中使用带有 `with` 子句将其建模为
    `field∼[{c}]`。因此，参数 `c` 是主内容，`cts` 是它的所有字段。抽象事件的三个动作在具体事件中重复出现，但没有显式显示。具体事件中的第四和第五个动作编写是为了不破坏不变性
    `@invr13` 和 `@invr16`。


    可以使用 `extends` 关键字以更简洁的方式对相同事件进行建模。然而，`refines` 关键字为（数据）细化提供了更多可能性。如果我们定义了一个具体的机器不变性，将
    `content` 或 `page` 与状态关联起来，我们就不需要重复前三个动作，而是可以通过粘合不变性来表达它们。细化事件的定义产生了关于事件充分性和正确性的证明目标。第
    4.8  解释了为 `delete-principal` 生成的证明目标。


    ## 4.8 细化证明目标


    细化 PO 是为了证明细化事件的正确性而生成的。图 4.7](#12_Chapter04.xhtml_fig4_7) 中的细化不变性 PO 规则与图 4.2](#12_Chapter04.xhtml_fig4_2)所示的
    `INV` 规则相似，但图 4.7](#12_Chapter04.xhtml_fig4_7) 包含了抽象和具体机器不变性。具体机器不变性 `J` 分别依赖于抽象和具体机器变量
    `v` 和 `w`。`H` 是具体事件守卫，`y` 是事件参数集。


    ![image](img/pg78_1.png)


    图 4.7：细化事件的不变性 PO


    不变 PO 根据可能破坏不变性的特定事件动作生成。例如，Rodin 为 `delete-principal` 事件生成了下面的 `delete-principal/invr18/INV`，对应不变性
    `@invr18` 和动作 `@actr27`。下方的第一个假设是具体机器不变性。第二个和第三个假设是具体事件守卫。目标是修改后的机器不变性。关于 `cts`
    的见证谓词在目标中被展开。抽象机器不变性没有显式包含在假设，但在目标工具中被展开。


    Rodin 的 *lasso* 功能允许用户像第 4.4 节 所示那样查看生成的所有假设。我们也没有显示其他具体机器不变性，因为它们不需要来通过 PO。


    ![image](img/pg79_1.png)


    图 4.8：delete_principal 的不变性 PO


    下面的 `GRD` PO 规则证明了每当具体事件被启用时，抽象事件必须被启用的义务。具体事件守卫必须比抽象事件守卫强。


    ![image](img/pg79_2.png)


    图 4.9：事件细化的守卫 PO


