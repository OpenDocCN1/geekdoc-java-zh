    ## 3.10 LESSONS LEARNED


    ### 3.10.1 EVENT CREATE-CHAT-SESSION


    What if one adds the guard `Me↦You ∈ active` to the event `create-chat-session`
    in [Section 2.9](#10_Chapter02.xhtml_ch2_9)? After adding the aforesaid guard,
    Rodin discharges all the related POs automatically. The consequences of making
    or not `Me↦You ∈ active` are rather related to the `create-chat-session`’s interactions
    with other machine events such as `chatting` and `select-chat`. If `create-chat-session`
    does not make `Me↦You ∈ active` then `select-chat` should execute afterwards,
    before start chatting. The analysis of the event interaction of an EVENT B model
    can typically be performed using the PROB model checker (Leuchel and Butler, 2003).
    PROB checks for deadlocks: it checks if after executing any of the machine events,
    the system can make progress or not.


    ### 3.10.2 EVENT CHATTING


    The abstract version of the event `chatting` is presented below (the version defined
    in `MachineZero`). Regarding this abstract version, the first decision we need
    to make is whether or not we want to add content item `c` to the chat between
    `You` and `Me` (in addition to the chat between `Me` and `You`). If we want to
    do so, we should extend the second line of `@act3` below with `You ↦ (chatcontent(You)
    ∪ {c ↦ {Me}})` as we have done. Intuitively, adding this line means that the content
    `c` sent by Me to You is not only seen by Me but also by `You`. However, if we
    choose to extend `@act3` that way, Rodin provers would generate a PO `You` must
    be in the `dom(chatcontent)` so that sub-expression `chatcontent(You)` is well-typed.
    This requirement can easily be solved by adding an event guard `@grd6 You ∈ dom(chatcontent)`
    to the `chatting` event. The downside of this solution is that `@grd6` does not
    hold the first time when `You` has not yet sent any content to anyone (not just
    to `Me`).


    ![image](images/pg57_1.png)


    The above downside suggests that one could add default `chat-content` associations
    the first time `You` is added to the system. The event `add-user` below adds user
    `u` to the set of existing users. Set expression `USER\user` returns the set of
    all the users that have not yet been added to the system. Action `@act2` adds
    default `chat-content` associations for user `u` with respect to the set of all
    the existing content. `∅` is the empty-set of users in this case. The soundness
    of `@act2` below is established by Rodin provers by discharging all the associated
    POs automatically; in particular, `@act2` adheres to `@inv4` in [Section 3.4](#11_Chapter03.xhtml_ch3_4)
    which requires the definition to ensure a partial-function relationship between
    `users` and `content`.


    ![image](images/pg57_2.png)


    What would happen with the association encoded by `@act2` above the next time
    that we create a new content item? Event `add-content` is shown below. For each
    and every existing user, `@act2` below associates the fresh content `c` to the
    empty-set of users, in other words, content item `c` appears as been sent by the
    whole set of users (variable `user`) to no one.


    Summing up on the chatting event, if we wanted to add content item `c` to the
    chat `You ↦ Me` in addition to the chat `Me ↦ You`, then we would incur into a
    computationally expensive task: we would need to associate `∅` to every existing
    content item every time we add a user to the system, and we would need to associate
    every single user to `{c ↦ ∅}` every time we needed to add a fresh content item
    `c`. This type of analysis on the complexity of associating chat content to `You
    ↦ Me` is not very intricate, in general; this analysis can be performed through
    careful code inspection or testing. But, writing the formal specification of our
    chatting system in EVENT B forces us to do code-inspection, and having Rodin theorem
    provers ensures that all cases are considered when performing automatic checking
    of EVENT B specifications with Rodin, without having to put effort into writing
    appropriate test scenarios.


    Notice that expressing `@act3` in chatting as below does not work since the last
    overriding expression forgets about `chatcontent(You)`, which amounts to deleting
    it. This issue cannot be spotted by Rodin, in particular regarding invariant `@inv4`
    in [Section 3.4](#11_Chapter03.xhtml_ch3_4), as the new association for You below
    would be a partial function anyway. This can only be spotted by a domain expert
    who knows that deleting a person’s chat whenever a content item is sent to them.


    ### 3.10.3 EVENTS DELETE-CONTENT AND REMOVE-CONTENT


    `delete-content` and `remove-content` are two of the subtlest functionalities
    of our system. `delete-content` does not remove `c` from chat `You ↦ Me`. Under
    which circumstances should one add `@act2 content := content\{c}` to `delete-content`?
    Rodin will generate an unprovable PO. The PO relates to `@inv4` in [Section 3.3](#11_Chapter03.xhtml_ch3_3).
    One would need to demonstrate that for any user other than `Me` the range of `chatcontent(Someone)`
    is a partial function from `content` to `ℙ(user)`, which is not possible because
    Someone had sent (forwarded or broadcasted) c previously.


    ![image](images/pg59_1.png)


    A turn-around to this problem is to express content as below. However, to calculate
    the value of `chatcontent` that way one should traverse user twice and content
    once, which might be time-consuming depending on the type structure used for `chatcontent`.


    ![image](images/pg59_2.png)


    Notice that if `Me` is chatting with `You`, and `You` with `Another`, and `Me`
    sends `c` to `You`, and `You` sends `c` to `Another`, calling `remove-content`
    with parameters `Me`, `You`, and `c` does not remove `c` from the chat between
    `You` and `Another`, but only from the chat between `Me` and `You`. For this reason,
    `remove-content` does not implement a second action `@act2 content := content\{c}`.
    To express the new value of content we can adopt the same approach as above and
    add the following line to the event `remove-content`.


    ## 4 The Poporo Social Network


    This chapter presents a complete EVENT B formal model of a social networking site
    called *Poporo*. A Poporo is a receptacle made of gold, used by pre-Columbian
    (before Christopher Columbus) Amerindians to socialize and communicate with ancient
    gods. Poporos were believed to have mystical and social communication powers.
    These mystical communication powers are arguably due to a mixture of quicklime
    and mashed coca leaves substances that were poured into the Poporos. Poporos belong
    to the Chibcha, Muisca, Quimbaya, and Calima pre-Columbian cultures.


    ![image](images/pg61_1.png)


    Figure 4.1: Poporo Muisca.

