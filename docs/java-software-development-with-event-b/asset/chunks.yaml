    **Preface**


    This book is a discourse explaining the software engineering task by means of
    mathematics. The particular formalism that we use is called predicate calculus.
    The book starts by introducing predicate calculus objects such as relations and
    functions and all the underlying operations used to manipulate these objects,
    giving examples of how they can be composed together to model software. The fundamental
    reason of using mathematics, and, in particular, predicate calculus to model software
    is that it allows us to reason about the software we want to build; we are interested
    in being able to verify if the software we build adheres to certain properties,
    which are typically condensed in a software requirements document. This is not
    an easy task and the main motivation behind our actions is to build correct software,
    software that enjoys those properties described in the software requirements document.'
