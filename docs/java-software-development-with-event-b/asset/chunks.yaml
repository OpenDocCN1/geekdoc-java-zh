    We manually translate USs to formal specifications in EVENT B. Our first validation
    check is carried out with Rodin’s type-checker, which checks for each EVENT B
    model that all its variables, constants, events, and the rest of its constructs
    are well typed. Rodin raises an error in case it cannot infer the type of any
    construct. The second validation check is achieved through the generation of POs
    that attest to the correctness of the EVENT B model. Rodin generates several types
    of POs (Cataño and Rivera, 2012). It generates a feasibility PO for each action
    of every event stating that a solution (a program) for the assignment exists.
    It also generates Os that relates a blueprint and its refinement. For instance,
    simulation POs ensure that abstract event actions are correctly simulated by concrete
    actions. Rodin provers are semi-automatic in that they only assist users in discharging
    the POs.


    The last validation check relies on the soundness of the code generator. The translation
    from EVENT B to JAVA (or any other implementation language) must be sound in order
    for the JAVA program to attest to the formal specification written in EVENT B.
    A formal soundness proof for the code generation performed by `EVENTB2JAVA` has
    already been conducted (Cataño and Nishi, n.d.).


    ## 2.6 RODIN


    Rodin is an Eclipse-based platform that provides support to EVENT B, e.g., for
    writing EVENT B models, defining safety invariant properties, and for discharging
    POs using back-end provers.([3](#10_Chapter02.xhtml_rfn2_3)) Rodin is available
    at [https://sourceforge.net/projects/rodin-b-sharp/](https://sourceforge.net/projects/rodin-b-sharp/).
    The standard way of installing plug-ins in Rodin is through the menu Help, `Install
    New Software`…, `Add`…, and then adding an Update Site. To conduct proofs in Rodin,
    one must install the Atelier B provers (the Update Site is [http://methode-b.com/update_site/atelierb_provers](http://methode-b.com/update_site/atelierb_provers)).
