    # 第 5 章


    ## 结论


    软件产品完成后修复软件设计缺陷的成本极高，因此在系统编码开始之前的软件开发早期，找到检测软件设计缺陷的方法至关重要。这是本书的动机，因为软件需求往往是模糊的，从而导致它们相互矛盾。这种模糊性由于软件需求通常用自然语言编写（不关联任何形式化语义）而加剧。本书使用了一种缓解思路来处理软件需求的模糊性：它将软件需求的语法限制为用户故事（User
    Stories），即带有占位符的文本模板。然而，由于非形式化需求（用户故事）不具备任何特定的语义，因此关于它们（或它们试图描述的系统）的任何本质属性都无法被证明。因此，需求被迁移到
    `EVENT B`，我们在 Rodin 中进行数学证明以检查其完备性。


    本书面向希望增加形式化方法背景、以基于数学工具开发软件的软件开发者。全书分为三个主要部分。第一部分关于 `Event B`——一种基于离散数学和谓词演算的形式化方法语言。书的第二部分介绍了在
    `EVENT B` 中开发聊天系统的案例研究。聊天系统由三个主要模型组成，从抽象功能到代码相关功能。我们对为聊天系统生成的代码进行了单元测试，发现了原始模型中的几处不一致之处，并在
    Rodin 平台及其底层证明器的帮助下进行了了正。书的第三部分介绍了 Poporo 社交网络。这部分的重点不在于软件开发，而是不变性属性的形式化证明。


    我们使用了一种系统的方法对软件需求进行早期验证，该方法基于对形式方法技术的广泛使用。这种验证方法建立在 `EVENT B` 的细化演算机制之上，并利用 `RODIN`
    平台的构造正确（correctness-by-construction）和演绎证明技术。简而言之，软件需求被建模为 `USs`，然后迁移到 `EVENT B`
    规范，在 Rodin 平台上按需细化规范并消除生成的 `POs`。从 `EVENT B` 形式化规范生成代码、模拟并验证缺陷。执行了两种验证：首先，对形式化规范进行健全检查，以验证生成的代码是否可以在标准场景中使用。这一过程可能导致定义新事件，也可能重新定义事件守卫或引入额外的不变量。其次，从形式化规范生成代码。人们可以编写单元测试来模拟生成的代码，并根据非形式化需求（`USs`）对其进行验证。


    从研究和实验的角度来看，仍有重大挑战和问题需要解决，以使书中介绍的工作类型更具成本效益。


    - 我们如何能（半）自动地将 `USs` 迁移到 `EVENT B` 语法？

    - 我们如何改进 Rodin 证明器，以提高 `POs` 的自动消除率？

    - 我们如何自动生成单元测试（从 `EVENT B` 规范或代码）？


    形式方法的成功在很大程度上取决于工具的实现，这些工具辅助用户使用数学技术，从而增加他们对想要开发的软件的信任。书中使用的 `EVENTB2JAVA` 代码生成器帮助我们增加了对聊天系统软件需求的信任，检查了软件需求规范中的不一致之处，而这些不一致性通过代码检查是不可能发现的。`EVENTB2JAVA`
    工具生成的不是最优代码，而是正确的代码。改进该工具的实现以生成可作为最终系统实现的代码是未来工作的方向。特别是 `EVENT B` 中定义中重复出现的逻辑表达式在
    `JAVA` 中被反复翻译和评估。


    我们在工作中一个主要的困扰是对于 `EVENTB2JAVA` 生成的 `JML` 规范支持不足。现有的验证工具（如 `KeY` 和 `Krakatoa`）无法处理
    `JAVA` 的完整语法，特别是泛型。我们希望对 `EVENTB2JAVA` 生成的部分代码进行自定义实现，并根据 `JML` 对这些实现进行验证。然而，在缺乏工具支持的情况下进行这种验证是非常耗时且容易出错的。


    `EVENTBJAVA` 将 `EVENT B` 公理翻译为 `JML` 不变量。这些公理决定了常量可能的取值。`EVENTBJAVA` 目前尚未自动生成满足公理的值。我们计划将
    `EVENT B` 的常量和公理定义翻译为 `Z3` SMT 求解器的输入语言，然后使用 `Z3` 寻找值。


