    `bool`、`true` 和 `false` 是布尔谓词，而 `BOOL` 是一个包含两个常量 `TRUE` 和 `FALSE` 的枚举类型。我们可以引入一个变量
    `friend ∈ (person ↔︎ person) ↔︎ BOOL`，并通过 `friend ≔ friend ∪ {(John ↦ Mary) ↦
    TRUE}` 将 `Mary` 添加为 `John` 的朋友。也可以通过赋值 `friend(John ↦ Mary) ≔ bool(friend(Peter
    ↦ Sara) = TRUE)`，在 `Sara` 是 `Peter` 的朋友的情况下让 `Mary` 成为 `John` 的朋友。友谊并不一定是自反关系。也就是说，`John
    ↦ Mary ∈ friend` 事实并不意味着 `Mary ↦ John ∈ friend`。


    ### 示例 9. 关系与函数的覆盖


    关系 `q` 对关系 `r` 的覆盖 `r⊕q` 返回一个新关系，该关系的形成方式是取 `q` 的所有元素对，并添加所有第一个元素不在 `q` 域中的 `r`
    的元素对。当 `r` 和 `q` 都是函数时，覆盖操作尤为重要，因为它返回另一个更新了 `q` 域中所有元素的函数。可以通过赋值 `owner(c) ≔ ow`
    或使用函数表达式 `owner⊕{c↦ow}` 来更新内容项 `c` 的所有者 `ow`。


    ### 示例 10. 编辑权限


    移除某些内容项 `c` 上所有的 `edit` 权限。


    ![image](img/pg10_1.png)


    ### 示例 11. 事件


    我们在下文中展示了用于事件的标准语法；此外，表 2.3 解释了每个事件构造的含义。事件守卫 `G(c,v)` 分别依赖于机器常量 `c`、机器变量 `v`
    和事件参数 `x`。如果事件守卫成立，则该事件被启用，并与其他许多事件竞争执行权。事件的主体由可能的许多个事件赋值组成，形式为 `v ≔ E(c,v)`，其中
    `c` 是机器常量集合，`v` 是机器变量的子集，`E` 是一个表达式。我们在此使用 `≔` 语法进行确定性赋值，但也可以是一系列非确定性赋值。符号 `skip`
    代表空动作集。它不影响机器状态。在执行 `skip` 后，状态保持不变。


