- fmt: "\nThe chat application implements two different behaviors for deleting exchanged\
    \ content: “Remove Content for Me” and “Remove Content for Everyone.” If the content\
    \ sender wants to delete some exchanged content, she can remove it from his chat\
    \ or the chat of the content recipient. On the other hand, the content recipient\
    \ can only delete the content from her chat. These two behaviors are described\
    \ by `US-04a` and `US-04b`, respectively. \n\nErrasing content is the type of\
    \ subtle functionality that is always difficult to encode in logic as one can\
    \ easily break invariants. For instance, if one deletes content from one side\
    \ of the chat and not from the other side, one would break any invariant enforcing\
    \ that both sides of any should read the same.\n\n| `US-04a` | `delete-content`\
    \ |\n| :--- | :--- |\n| `delete-content` | As a user, I want to delete some content\
    \ exchanged with You during a chat session so that I unclutter my chat |\n| **Acceptance\
    \ criterion** | `Given`: The content exists `When`: Me decides to delete the content\
    \ that she has received `Then`: Me’s content is deleted |\n\n| `US-04b` | `remove-content`\
    \ |\n| :--- | :--- |\n| `remove-content` | As a user, I want to remove some content\
    \ exchanged with You during a chat session so that I unclutter my chat |\n| **Acceptance\
    \ criterion** | `Given`: The content exists `When`: Me decides to remove the content\
    \ that she has sent `Then`: The content is removed from Me and anyone to whom\
    \ Me has sent the content |\n\nChat sessions and associated content can be deleted\
    \ as well. What `US-05` does not state is what would happen with the content seen\
    \ by You if the session between Me and You is deleted. Will the content be deleted\
    \ from You as well? Deleting a chat session between Me and You does not delete\
    \ the content as seen by You, regardless of who sent the content to whom, however,\
    \ a `remove-content` US exists that deletes the content both sides.\n\n| `US-05`\
    \ | `delete-chat-session` |\n| :--- | :--- |\n| `delete-chat-session` | As a user,\
    \ I want to delete the chat session between Me and You |\n| **Acceptance criterion**\
    \ | `Given`: A chat session between Me and You exists `When`: I select to delete\
    \ the only active chat session `Then`: The chat session is deleted as well as\
    \ its associated content |\n\nWhen a chat session has been muted, communication\
    \ between the two chat users is disabled both ways. Nevertheless, communication\
    \ can be enabled later on. This is described by `US-06`.\n\n| `US-06` | `mute-chat`\
    \ |\n| :--- | :--- |\n| `mute-chat` | As a user, I want to mute a chat session\
    \ so that I can prevent commu-nication between Me and You |\n| **Acceptance criterion**\
    \ | `Given`: A chat session between Me and You exists `When`: I decide to mute\
    \ the chat session between Me and You `Then`: The chat session is muted and no\
    \ communication from Me to the muted user or vice-versa is permitted |\n\n`US-07`\
    \ is about to re-establish communication between two users of a muted chat. Only\
    \ the user who muted the chat can unmute it.\n\n| `US-07` | `unmute-chat` |\n\
    | :--- | :--- |\n| `unmute-chat` | As a user, I want to unmute the chat session\
