    我们想在 EVENT B 中对字典进行建模。为了简单起见，假设一个单词恰有一个含义，并且我们只感兴趣向字典中添加单词。变量 `word` 是单词集合，`meaning`
    是单词含义的集合。`dictionary` 是从 `word` 到 `meaning` 的部分函数。因此，一个单词有一个含义，但可能存在单词没有含义的情况。


