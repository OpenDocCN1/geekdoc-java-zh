    我们手动将用户用例（USs）翻译为 EVENT B 中的形式化规范。我们的第一次验证是通过 Rodin 的类型检查器进行的，它会检查每个 EVENT B 模型中的所有变量、常量、事件以及其他构造是否都类型正确。如果
    Rodin 无法推断出任何构造的类型，它将抛出错误。第二次验证通过生成证明义务项（POs）来实现，以证明 EVENT B 模型的正确性。Rodin 会生成几种类型的
    PO（Cataño and Rivera, 2012）。它为每个事件的每个动作生成一个可行性 PO，说明该赋值存在一个解（程序）。它还会生成与蓝图及其细化版本相关的
    PO。例如，模拟 PO 确保抽象事件动作被具体动作正确地模拟。Rodin 证明器是半自动的，它们仅协助用户完成 PO 的证明。


    最后一次验证依赖于代码生成器的完备性。从 EVENT B 到 JAVA（或任何其他实现语言）的翻译必须是完备的，以便 JAVA 程序能够证明其在 EVENT
    B 中编写的形式化规范。针对 `EVENTB2JAVA` 执行的代码生成，已经进行了形式化的完备性证明（Cataño and Nishi, n.d.）。


    ## 2.6 RODIN


    Rodin 是一个基于 Eclipse 的平台，为 EVENT B 提供支持，例如编写 EVENT B 模型、定义安全不变性属性以及使用后端证明器完成 PO。（3）。Rodin
    可以在 [`sourceforge.net/projects/rodin-b-sharp/`](https://sourceforge.net/projects/rodin-b-sharp/)
    获取。在 Rodin 中安装插件的标准方法是通过菜单 Help（帮助）、`Install New Software`……、`Add`……，然后添加一个更新站点（Update
    Site）。要在 Rodin 中进行证明，必须安装 Atelier B 证明器（更新站点为 [`methode-b.com/update_site/atelierb_provers`](http://methode-b.com/update_site/atelierb_provers)）。强烈建议使用
    Camille 来编写和编辑 EVENT B 机器（更新站点为 [`www.stups.hhu.de/camille_updates`](http://www.stups.hhu.de/camille_updates)）。


    ## 2.7 JML


    JML 是一种 JAVA 接口规范语言。它旨在指定 JAVA 类的行为，并使用特殊的注释标记 `//@` 和 `/*@ */` 直接包含在 JAVA 源代码文件中。JML
    表达式是 Java 表达式的超集，增加了诸如用于逻辑蕴含的 `==>`、用于存在性量化的 `\exists` 以及用于全称量化的 `\forall` 等符号法。


    JML 类规范可以包含不变性子句（在类的每个可见状态下必须满足的断言）、`initially` 子句（指定每个类构造函数的后置状态必须满足的条件）以及历史约束（使用关键字
    `constraint` 指定，与不变性相似，但额外具有了关联方法的前置状态和后置状态的能力）。具体的 JML 规范可以直接写在 JAVA 类的字段上。


    JML 为 JAVA 方法提供了前置-后置风格的规范来描述软件契约。JML 使用关键字 `requires` 表示方法的的前置条件，`ensures` 表示方法的正常后置条件，`assignable`
    和 `modifies` 表示帧条件（从方法的前置状态到后置状态值可能发生变化的位置列表）。前置状态是方法进入时的状态，后置状态是方法退出时的状态。`normal
    behavior` 方法规范规定，如果方法的前置条件在方法的前置状态下成立，则它将始终在正常状态下终止，并且后置条件下成立。在 JML `ensures`
    子句中，关键字 `\old` 用于指示必须在方法的前置状态下求值的表达式——所有其他表达式都在后置状态下求值。`\old` 关键字也可以用于历史约束，提供了一种方便的方法来指定（例如）字段的后置值始终等于前置值，从而使字段变为常量。


    ## 2.8 EVENTB2JAVA


    EVENT B 规范编写在 Rodin 工具集中，Rodin 是一个开源 Eclipse IDE，提供了一套用于处理 EVENT B 的工具：一个编辑器、一个证明生成器和多个证明器（Abrial
    et al., 2010）。目前存在多种用于 EVENT B 的代码生成器，它们可以接收 EVENT B 蓝图并生成如 C 或 JAVA 等主流编程语言的代码。


    我们使用 `EVENTB2JAVA` 为我们展示的 EVENT B 规范生成代码。在本书中，`EVENTB2JAVA` 是一个 Rodin 插件，因此 EVENT
    B 建模和代码生成是在 Rodin 中完成的。`EVENTB2JAVA` 依赖于两个建模 JAVA 类和关系的主要类，即 `BSet` 和 `BRelation`。`BSet`
    类依赖于 JML 的 `JMLEqualsSet` 类提供的功能来实现其自身的功能。`JMLEqualsSet` 使用 `equals` 方法比较集合中的元素，并且不对添加到集合中的元素进行克隆。`BSet`
    使用类型为 `JMLEqualsSet` 的字段 `elems` 来查询和更改集合的状态。常量 `EMPTY` 用于表示 EVENT B 的 `∅`。方法
    `insert` 向集合中添加元素，`method` 检查元素是否已存在于集合中。


    ![image](img/pg20_1.png)


    `BRelation` 类实现为 `BSet<Pair<K, V>>`。这遵循 EVENT B 的语义，即关系是元素对的集合。`BRelation` 包含一个编码空关系的常量
    `EMPTY`。


    ![image](img/pg21_1.png)


    ## 2.9 一个聊天应用程序


    我们在这里展示了我们在第 3 章中完整开发的示例部分。该示例关于一个聊天应用程序。我们在这里使用它来展示我们的思路。用户用例 US-01 提出了一个非正式需求，描述了创建聊天会话的功能。该聊天可能尚不存在。


    | US-01 | create-chat-session |

    | :--- | :--- |

    | **create-chat-session** | 作为用户，我想创建一个聊天会话，以便与你通信 |

    | **Acceptance criterion** | `Given`: 我和你之间不存在聊天会话；`When`: 我决定与你创建一个聊天会话；`Then`:
    我和你之间创建了聊天会话，但你和我之间没有 |


    US-01 在 EVENT B 中被形式化编码为下文的 `create-chat-session` 事件。该事件为用户 `Me` 与用户 `You` 创建聊天会话。符号
    `∈` 是集合成员操作（属于），`user` 是注册了聊天应用程序的用户集合。符号 `∧` 是逻辑与运算符。`▷` 是范围限制操作。表达式 `{Me} ▷
    active` 返回一个由 `active` 中第一个分量属于单集 `{Me}` 的元素对组成的关系。`Me ↦ You` 是一个元素对，`chat` 是一个跟踪可用聊天会话的数学关系。事件守
    `@grd2` 形式化了 US-01 中所示的 `Given` 条件。`@act1` 编码了 `Then` 表达式；将元素对 `Me ↦ You` 添加到现有集合中。Guard
    `@grd1` 是类型条件，它帮助 Rodin 的类型检查器推断 `Me` 和 `You` 的类型。


