    ### Example 11. Events


    We present below the standard syntax used for events; additionally [Table 2.3](#10_Chapter02.xhtml_tab2_3)
    explains what each event construct means. The event guard `G(c,v)` depends on
    machine constants `c`, the machine variables `v`, and the event parameters `x`,
    respectively. If an event guard holds, then the event is enabled, and it competes
    with many other events to execute. The body of an event is composed of potentially
    many event assignments of the form `v ≔ E(c,v)`, where `c` is the set of machine
    constants, `v` is a subset of machine variables, and `E` is an expression. We
    use here `≔` syntax for deterministic assignments, but it can be a series of non-deterministic
    assignments. The symbol `skip` represents the empty set of actions. It does not
    affect the machine state. The state remains unchanged after `skip` is executed.


    ![image](images/pg11_1.png)


    | Table 2.3: The Syntax for events |

    | Element | Definition |

    | :--- | :--- |

    | name | The name of the event |

    | x | Event parameters, a set of variables |

    | G(c,v) | Logical predicate |

    | v | A disjoint (sub-) set of machine variables |

    | E(c,v) | Sets of expressions |


