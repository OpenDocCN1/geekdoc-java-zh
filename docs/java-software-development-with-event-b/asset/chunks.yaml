    **2.3** **SOFTWARE DEVELOPMENT WITH EVENT B**


    Software development with EVENT B follows the *parachute strategy* for software
    development in which systems are first considered from a very abstract and simple
    point of view, with broad fundamental observations, and then details are added
    to it until to complete the full functionality of the system. Software development
    with EVENT B (Abrial, 2010) starts with the definition of an initial *blueprint*
    of the system we want to model. This blueprint represents the future system implementation.
    Blueprints give insight on some but not all the aspects of the future system.
    A blueprint goes through a series of stages called *refinements* (Abrial and Hallerstede,
    2007). A blueprint refinement adds details to the blueprint. Refinements provide
    a hierarchical organisation of the blueprints. The design of the initial system
    blueprint and its subsequent refinements are based on the description contained
    in an existing software requirements document. Each stage of the organization
    of a blueprint serves a different purpose. At higher (more abstract) levels, blueprints
    are used to state key system properties. At lower (more concrete) levels, blueprints
    implement the system behavior. It is crucial that the initial blueprint and its
    refinements are consistent with each other, and that they are coherent with respect
    to the system specification. A refinement step generates POs. A PO is a proof
    that the blueprint refinement is a refinement of the blueprint. POs guarantee
    that the blueprint and its refinement are models of the same system. By discharging
    (proving) POs one enforces a Correct-by-Construction (CbC) discipline of software
    development (Hall, 2002; Hall and Chapman, 2002).'
