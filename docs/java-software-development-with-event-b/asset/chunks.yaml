    each refinement is a faithful model of the previous machine so that all machines
    satisfy the correctness properties of the original.


    Table 2.1: A simplified version of the abstract machine of the chat system


    ![image](images/pg4_1.png)


    [Table 2.1](#10_Chapter02.xhtml_tab2_1) presents a simplified version of an EVENT
    B model of the chat system. The four invariants typeset the four machine variables.
    The machine variables store the users and the contents currently in the network,
    chat sessions, and a variable that keeps track of which chat sessions are currently
    active, respectively. A chat session for a user `u1` is active if `active(u1)`
    exists. Since `active` is a function (the symbol `⇸` in `@inv4` is used for *partial
    functions*), if that element exists, then it is unique. On the other hand, `chat`
    is just a relation (the symbol `↔︎`) so it should be applied to (evaluated over)
    a set and produces a set of elements. We use square brackets rather than parentheses
    for applying a relation, hence, `chat[{u1}]` returns the set of elements with
    whom any member of the singleton set `{u1}` is chatting with.


    The `initialization` event gives initial values to the state variables (also called
    machine variables). The `create-chat-session` event is triggered when any user
    wants to create a chat session between two users `u1` and `u2`. Guard `@grd2`
    forbids `create-chat-session` from adding an existing chat session. Action `@act1`
    modifies the chat to contain the pair of elements `u1↦u2`^([1](#10_Chapter02.xhtml_rfn2_1)),
    for which we could have used the more standard notation `(u1, u2)`.


    Action `@act1` makes the chat `u1 ↦ u2` active for `u1`.


    The construct “`any` x `where` G(s,c,v,x) `then` v `≔` A(s,c,v,x) `end`” specifies
    a non-deterministic event that can be triggered in a state where the event guard
    G(s, c, v, x) holds for some bounded value x, sets s, constants c, and machine
    variables v. When the event is triggered, a value for x satisfying guard G(s,
    c, v, x) is non-deterministically chosen and the event action v `≔` A(s, c, v,
    x) is executed with x bound to that value. For any x chosen, the new values of
    the state variables computed by the action of the event maintain the invariant
    properties of the machine. The semantics of events thus models a system that is
    controlled by interactions from the environment (i.e., user actions) that may
    occur at any time.


    The example in [Table 2.1](#10_Chapter02.xhtml_tab2_1) uses the Rodin tool (Abrial
    et al., 2010) notation, where predicates on different lines are implicitly conjoined
    and actions on different lines are executed simultaneously. EVENT B includes logical
    notations for conjunction (`∧`), disjunction (`∨`), negation (`¬`), and implication
    (`⇒`). It also includes notation for universal (`∀`) and existential (`∃`) quantification.


    **2.1 RELATIONS AND FUNCTIONS**


    Functions and relations are in the core of EVENT B’s language. EVENT B provides
    some predefined sets, for instance, the empty set `∅`, the set of natural numbers
    `ℕ`, the set of positive numbers `ℕ1`, and the set of integers `ℤ`. It also provides
    common operations overs sets such as `∩`, `∪`, and `∖` for intersection, union,
    and set difference, respectively. The symbol `ℙ` is used for the *power-set* of
    a set, and the symbol `×` is used for the *cross product* between two sets.


    Any EVENT B relation is encoded as a set of pairs. The first elements of the pairs
    are part of the *source* or *domain* of the relation, and the second element of
    each pair is a member of the *target* or *range* of the relation. A function is
    a relation such that no two distinct pairs contain the same element. In other
    words, any element of the source is mapped to at most one element of a target.


    Let us suppose that `f` is a relation with domain `A` and range `B`, denoted `f:
    A ↔︎ B`. If `f` is a function defined for *all* values of `A`, we say that `f`
    is a *total* function, and we write `f: A → B`. If `f` is defined for some values
    of `A`, we say that `f` is a *partial* function, and we write `f: A ⇸ B`. If `f`
    is a function such as no element in the range of `f` is associated with more than
    one element in the domain of `f`, then we say that `f` is a *one-to-one* or *injective*
    function, and we write `f: A ↣ B`. If `f` is a function whose range is `B`, we
    say that `f` is an *onto* or *surjective* function, and we write `f: A ↠ B`. If
    `f` is both one-to-one and onto, we say that `f` is a `bijection`, and we write
    `f: A ⤖ B`.


    ![image](images/pg6_1.png)


    Figure 2.1: Types of mathematical functions.


    [Figure 2.1](#10_Chapter02.xhtml_fig2_1) shows a hierarchy of types of relations
    and functions. Any function is a relation. Functions can be *total* or *partial*.
    Every total function is a partial function. Functions can be *injective* or *surjective*.
    Some surjective functions are partial and other ones are total. Some injective
    functions are partial and other ones are total. Bijective functions are surjective
    and injective functions. Some bijective functions are partial and other ones are
    total.


    **Example 1\. Facebook**


    Let us suppose that we want to identify the most basic logical structures of a
    model for Facebook (sets, relations, functions). We are interested in modeling
    users, social network content, user’s pages, content ownership, and permissions
    on content. We want to model two types of permissions, namely, *view* and *edit*
    permissions. Pages can be modeled as a relationship from persons to contents:
    `page ∈ person ↔︎ content`. This declaration states that page is an element of
    all the possible set of relations that can be formed of elements of persons in
    the domain and network content in the range of the relation.'
