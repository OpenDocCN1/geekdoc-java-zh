    In [Section 2.4](#10_Chapter02.xhtml_ch2_4), we introduced a methodology for the
    early validation of software requirements. Therefore, USs are ported to a formal
    model in EVENT B, then the EVENTB2JAVA code generator is used to generate a prototype
    JAVA implementation of the EVENT B model, which is unit-tested to validate the
    USs and the formal model.


    Our main goal here is to check US-03 (the chatting event functionality) for flaws.
    Therefore, we unit-test the JAVA code that EVENTB2JAVA generates for event `chatting`,
    we check if the code can be exercised (executed) properly and under which conditions,
    and, if necessary, we evolve the US and the EVENT B model. Right until now we
    have essentially encoded each and every US as an event. We bring below US-03,
    which has already been presented in [Section 3.1](#11_Chapter03.xhtml_ch3_1).
    US-03 describes the chatting functionality through which “Me” chats with “You”.
    According to US-03, chat content is made available to these two users.


