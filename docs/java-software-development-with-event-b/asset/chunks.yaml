    `create-chat-session` 可以根据需要进行多次细化。我们在下方对其进行了水平细化（通过 `EVENT B` 中的 `extends` 子句），添加了更多关于创建聊天会话的观测或细节。我们下方的细化规范观测了活跃和非活跃的会话。`active`
    是一个跟踪活跃会话的函数。之所以是一个函数是因为每个用户只能有一个活跃的会话，换句话说，一个用户正在聊天的用户不超过一个。`inactive` 跟踪非活跃的会话。动作
    `@actr12` 使由 `@act1` 在细化事件中添加的会话变为活跃状态。活跃或非活跃等概念并不属于聊天应用的最抽象形式规范的一部分，而是其第一次细化的部分。


    ![image](img/pg23_1.png)


    我们在下方展示了一个用于部分验证 `US-01` 的单元测试示例。`Class Pair` 是一个工具类。它编码了任何类型元素的成对。`Me` 和 `You`
    是作为类属性全局定义的整数变量，分别初始化为值 `1` 和 `2`。因此，`a` 是元对 `Me ↦ You`，`b` 是元对 `You ↦ Me`。第一个
    `assertTrue` 指令检查 `add-user` 是否正确地将 `Me` 添加到 `user` 中。第二个检查 `You` 是否被添加到 `user`
    中。第三个检查元对 `a` 是否正确地添加到 `chat` 中。遵循 `US-01` 的 `Then` 部分，最后一个断言指令检查 `b` 是否没有添加到变量
    `chat` 中。


    ![image](img/pg23_2.png)


    符号 `↦` 被称为映射符号（maplet），读作“映射到”，因此 `u1` 映射到 `u2`。


    **粘接不变性在[第 3.6 节]中讨论。


    “证明器”（prover）是一种类似于“证明助手”的工具；通常，证明助手会对证明过程提供反馈并可以回溯到证明的先前状态，而证明器只是尝试应用一种最终会成功或失败的策略。


    # 第 3 章


    ## 使用 EVENT B 开发聊天系统的软件


    我们为一个聊天应用程序编写了软件需求，其中包含了一些 WhatsApp 中常见的功能（[`www.whatsapp.com/android/`](https://www.whatsapp.com/android/)）。在用
    EVENT B 编写软件系统模型时，应当先编写一个抽象机器，然后依次编写细化机器。对于每个细化机器，需要在 Rodin 平台上消除证明责任项（POs），以确保每台机器都是对最抽象机器的恰当细化。只有当所有机器都编写完成且所有
    POs 都已消除后，才能认为底层系统已完全建模。[第 4 章] 讨论了消除 POs 的技术。


    我们根据自己使用（手机版）WhatsApp 的经验提取了聊天应用程序的需求。用户故事（User Stories）与 EVENT B 模型结构及其机器的层级结构相关。[表
    3.1] 展示了这种层级结构。抽象机器（MachineZero）观测了聊天会话的基本功能。第一个机器细化包含了检查聊天内容（文本、视频、图片）是否可以被读取的功能。第二个机器细化增加了实现细节。例如，它将内容表示为内容项的序列（而不是集合）。这对我们来说很重要，因为聊天会话的图形界面可以实现为从头到尾读取的内容项有序序列。此外，它可以帮助我们陈述一个属性，即对于任何聊天会话，聊天内容对于两个聊天成员来说是一致的。这是一个不变性属性，我们在这里对其进行了建模，但它并不是
    WhatsApp 手机版本的属性。


    | 表 3.1: 聊天应用程序的机器层级结构 |


    | 机器 | 观测 |

    | :--- | :--- |

    | MachineZero | 抽象机器，聊天会话的基本功能 |

    | MachineOne | 第一次细化，引入了已读和未读状态 |

    | MachineTwo | 第二次细化，它编码了一个垂直细化 |


    [表 3.1] 展示了聊天系统机器的层级结构。抽象机器观测了聊天会话的基本功能，包括创建聊天会话、选择或取消选择聊天、聊天、删除内容（文本、视频、照片）、移除内容、删除聊天会话、静音和取消取消以及广播和转发网络内容。第一个机器细化包含了检查聊天内容是否已被读取的功能。第二个机器细化增加了实现细节，例如，它将内容表示为内容项的序列（而不是集合）。这对我们来说很重要，因为聊天会话的图形界面应该实现为从头到尾读取的内容项有序序列。此外，它可以帮助我们陈述一个属性，即对于任何聊天会话，两个聊天成员之一看到的聊天内容与另一名成员看到的内容相同。这是一个不变性属性。这种不变性属性，特别不是
    WhatsApp 手机版本的属性。


    [第 3.1 节] 分别展示了 [表 3.1] 中 MachineZero 的软件需求、[3.2] MachineOne 的软件需求以及 [3.3] MachineTwo
    的软件需求。[第 3.4 节]、[第 3.5 节] 和 [第 3.6 节] 展示了这些软件需求在 EVENT B 中的形式化。


    ### 3.1 MACHINEZERO


    抽象机器 MachineZero 包含 10 个用户故事，从 US-01 到 US-10。


    US-01 描述了在“我”和“你”之间创建聊天会话的功能。聊天可能不存在。


    | US-01 | create-chat-session |

    | :--- | :--- |

    | create-chat-session | 作为用户，我想选择一个聊天会话，以便与你开始聊天 |

    | 验收准则 | `Given`: 我和你之间不存在聊天会话 `When`: 我决定与你创建一个聊天会话 `Then`: 我和你之间创建了聊天会话，但你和我之间没有创建
    |


    US-02 描述了选择聊天会话的功能。具有两个 `Given` 条件的效果是这两个条件的交集所得到的条件。


    | US-02 | select-chat |

    | :--- | :--- |

    | select-chat | 作为用户，我想创建一个聊天会话，以便与你通信 |

    | 验收准则 | `Given`: 我和你之间存在聊天会话 `Given`: 我和你之间的聊天会话未活跃 `When`: 我选择与你的聊天 `Then`:
    我和你之间的聊天会话变为活跃 |


    US-03 描述了“我”与“你”聊的功能。发送的内容对“我”和“你”两个用户可用。


    | US-03 | chatting |

    | :--- | :--- |

    | chatting | 作为用户，我想在与你的聊天会话期间向你发送内容以表达我的想法 |

    | 验收准则 | `Given`: 我和你之间的聊天会话是活跃的 `When`: 我与你聊天 `Then`: 聊天内容对我以及对你可用 |


