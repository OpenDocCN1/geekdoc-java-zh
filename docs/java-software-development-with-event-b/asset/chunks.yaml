    Update Site is [http://www.stups.hhu.de/camille_updates](http://www.stups.hhu.de/camille_updates)).


    ## 2.7 JML


    JML is an interface specification language for JAVA. It is designed for specifying
    the behavior of JAVA classes, and is included directly in JAVA source files using
    special comment markers `//@` and `/*@ */`. JML expressions are a superset of
    Java expressions, with the addition of notations such as `==>` for logical implication,
    `\exists` for existential quantification, and `\forall` for universal quantification.


    JML class specifications can include invariant clauses (assertions that must be
    satisfied in every visible state of the class), `initially` clauses (specifying
    conditions that the post-state of every class constructor must satisfy), and history
    constraints (specified with the keyword `constraint`, that are similar to invariants,
    with the additional ability to relate pre- and post-states of a method). Concrete
    JML specifications can be written directly over fields of the JAVA class.


    JML provides pre-post style specifications for JAVA methods describing software
    contracts. JML uses keywords `requires` for method pre-conditions, `ensures` for
    normal method post-conditions, and `assignable` and `modifies` for frame conditions
    (lists of locations whose values may change from the pre-state to the post-state
    of a method). The pre-state is the state on method entry and the post-state is
    the state on method exit. A `normal behavior` method specification states that
    if the method pre-condition holds in the pre-state of the method, then it will
    always terminate in a normal state, and the post-condition will hold in this state.
    In a JML `ensures` clause, the keyword `\old` is used to indicate expressions
    that must be evaluated in the pre-state of the method—all other expressions are
    evaluated in the post-state. The `\old` keyword can also be used in history constraints,
    providing a convenient way to specify (for example) that the post-state value
    of a field is always equal to the pre-state value, thus making the field a constant.


    ## 2.8 EVENTB2JAVA


    EVENT B specifications are written in the Rodin toolset, an open-source Eclipse
    IDE that provides a set of tools for working with EVENT B: an editor, a proof
    generator, and several provers (Abrial et al., 2010). Various code generators
    for EVENT B exist that take an EVENT B blueprint and generate code in mainstream
    programming languages such as C or JAVA.


    We use `EVENTB2JAVA` to generate code for the EVENT B specifications that we present.
    In this book, `EVENTB2JAVA` is a Rodin plugin so EVENT B modeling and code generation
    are carried out from Rodin. `EVENTB2JAVA` relies on two major classes modeling
    the behavior of classes and relations in JAVA, namely `BSet` and `BRelation`.
    Class `BSet` relies on the functionality provided by the `JMLEqualsSet` class
    of JML to implement its own functionality. `JMLEqualsSet` uses a method `equals`
    to compare elements in the set and does not clone elements that are added to it.
    `BSet` uses a field `elems` of type `JMLEqualsSet` to query and change the state
    of the set. Constant `EMPTY` is used to represent the `∅` of EVENT B. Method `insert`
    adds an element to the set and `method` has checks if an element already exists
    in the set or not.


    ![image](images/pg20_1.png)


    Class `BRelation` is implemented as `BSet<Pair<K, V>>`. This follows EVENT B’s
    semantics whereby relations are set of pairs. `BRelation` includes a constant
    `EMPTY` that encodes an empty relation.


    ![image](images/pg21_1.png)


    ## 2.9 A CHAT APPLICATION


    We show here some parts of an example that we fully develop in [Chapter 3](#11_Chapter03.xhtml).
    The example is about a chat application. We use it here to showcase our ideas.
    User Story US-01 presents an informal requirement that describes the functionality
    used for creating a chat session. The chat may not yet exist.


    | US-01 | create-chat-session |

    | :--- | :--- |

    | **create-chat-session** | As a user, I want to create a chat session so as to
    communicate with You |

    | **Acceptance criterion** | `Given`: A chat session between Me and You does not
    exist`When`: I decide to create a chat session with You`Then`: A chat session
    between Me and You is created, but not between You and Me |


    US-01 is encoded formally in EVENT B as the event `create-chat-session` below.
    The event creates a chat session for user `Me` to chat with user `You`. The symbol
    `∈` is the set membership operation (is a member of), user is the set of users
    who have signed-up to the chat application. The symbol `∧` is the logical conjunction
    operator. `▷` is the range restriction operation. Expression `{Me} ▷ active` returns
    a relation formed from a pair of elements in active whose first component belongs
    to the singleton set `{Me}`. `Me ↦ You` is a pair of elements, and chat is a mathematical
    relation that keeps track of the chat sessions currently available. Event guard
    `@grd2` formalizes the `Given` condition shown in US-01. `@act1` encodes the `Then`
    expression; it adds the pair of elements `Me ↦ You` to the set of existing chats.
    Guard `@grd1` is a typing condition, it helps Rodin’s type-checkers infer the
    type of `Me` and `You`.


    ![image](images/pg22_1.png)

