  md: '# Editions of Livy


    The contribution made by Gronovius in the seventeenth century was as outstanding
    as that of Sigonius in the sixteenth, though Heinsius (ed. Leiden, 1634) deserves
    an honourable mention; in the seventeenth century the Netherlands, particularly
    the University of Leiden, became the leading century of classical scholarship.
    Gruter''s edition of 1607–8 was a landmark in introducing chapter divisions, the
    basis for a standardized reference system; the credit for section numbers belongs
    to Drakenborch.¹17


    # GRONOVIUS TO DRAKENBORCH


    The seventy years between the death of Gronovius and the appearance of the first
    volume of Drakenborch''s Variiorum edition in 1738 (it consisted of seven volumes,
    the last published in 1746) saw only ten new editions.¹⁸ Potential editors were,
    perhaps, deterred by the authority of Gronovius. The two most important were those
    of Hearne (1708, the first ever published in Oxford) and Crévrier (1735–42); a
    second edition was published in 1748–8 and, as Walker observed,¹⁹ it is pity that
    Drakenborch was unable to take account of it; a school followed in 1768–9. Hearne
    cited a number of Oxford manuscripts (see Drakenborch vi. 322, Mommsen, Analecta
    Luijiana, 35), of which, New College 279, is a primary witness for the \psi group
    in the


    1654 is a reprint, his second in 1664–5 (Gronovius died in 1671; the editions
    of 1678 and 1678–9 are reprints, the latter with revisions by the younger Gronovius
    and containing his notes). The edition published in Amsterdam in 1661, was by
    Drakenborch (vi. 340) to be ''ex reecence J. Fr. Gronovius; is a reprint of 1635.


    ¹⁷ Drakenborch missed the one edition at Dordrecht in 1711, held by the British
    Library.


    ¹⁸ Drakenborch describes both the edition of 1607–8 himself, and the unauthorized
    reprint published at Paris in 1625 as if he had seen them (cf. p. 164); Walters,
    Co II (1917), implies that the chapter divisions are to in the 1612 edition (cf.
    vii. 339) he was unaware of the latter and makes clear that he had not himself
    seen those of 1609 and 1619). It also, seems, Gruter who first divided the works
    of Tacitus into chapters; cf. S. J. V. Malloch in R. Hunter and S. P. Oakley (eds.),
    Latin Literature and its Transmission (Cambridge, 2016), 233.


    ¹⁹ Supplementary Annotations on Livy (Glastow, 1882), pp. xif f. (describing Drakenborch
    as German).


