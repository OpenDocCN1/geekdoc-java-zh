  md: '# 218


    # Liviana


    whatever to do with *pudet*; it is aseverative that demands a pronoun: "ohne die
    Stütze eines Pronomens nur vor- und nachklassisch", K-St. i, 797;


    For some 380 years the transmitted reading did not trouble editors and critics.
    The aseverative usage was recognized, *nae*, often being spelt nae. The first
    scholar to perceive a problem was Haase in 1839:5-believing, it seems, that *nae*
    was the transmitted orthography, he proposed *nam*. In 1851, in Teubner edition,
    Weissenborn deined, it could have originated from the preceding syllable (i.e.
    *-nt*); he did not mention that, according to Drakenborch, had already been omitted
    in two manuscripts (neither possessing authority), Holkam 354 and 351.3. I can
    confirm the former and since it is considerably older than the latter, written
    in 1409, further enquiry is unnecessary. One can only speculate whether the scribe''s
    eye moving from deliberate or inadvertent, *nae* to *nt*.


    A year later, F. L. Lentz, in a Königsberg Gymnasialprogramm added *cas* after
    *nae*. Since my (and, no doubt, the same was for Watt) only source for this information
    is the note by Hertz in the (introductory) apparatus to volume iii of his Livy
    (1862), I have no means of knowing his reasons, but certainly, I ought not have
    implied that he was worried by the lack of after *podere* (for which see TLL x2/2473.
    72 ff., not citing any examples from L.) and since he added a demonstrative pronoun,
    it can be regarded as virtually certain that he was motivated by the belief that
    aseverative *nae* was always immediately followed by a personal or demonstrative
    pronoun. As to reference to Damsti, (implausible) argument that the remark was
    of general application and it was only in the next sentence that Cato returns
    to talking about the women.


    Hertz did not accept Lentz''s conjecture, in him published a year after that Hertz,
    Madvig did so, and he was followed by all editors to and including McDonald. They
    probably thought that, between *ne* and *simul*, such an omission was easy. None
    of them, realized that there was no secure instance of *nae* without a pronoun,
    there was not at all of that being is.


    +   4 TLL ix/1.279.57 say *nae non in cod. vel edd. minimae fide*.


    +   5 F.G.H.C. Haase, Professor Reise Vorlesungen über lateinische Sprachwissenschaft.
