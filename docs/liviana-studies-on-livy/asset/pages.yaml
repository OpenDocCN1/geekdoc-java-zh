    supplementation, except when the supplement required is obvious; (3) passages
    where the apparatus is long and/or complex. In a number of cases, particularly
    obelized passages, I have little or nothing to add to previous discussions and
    my aim is merely to elucidate the difficulty and help the reader understand the
    apparatus; in obelized passages I refrain from saying on each occasion that I
    see no alternative to baring the dagger.


    I began on this chapter waiting for the various stages of the production process
    of my edition. Inevitably, it disclosed a number of errors and omissions in my
    apparatus, most of which I was able to correct at copy-editing, first proof, or
    revises stage. By the time I returned the revises, I had reached book 24 ch. 16
    and refrained from sending further corrections to the Press, which might have
    merely introduced error. The vast majority of the additions and corrections listed
    in Ch. 13 (which also relate to the text), therefore, concern the rest of book
    24 and book 25; I also mention them here in the discussion of the passage concerned
