    # Lovato Lovati and the $\alpha(a)$ Group of Fourth Decade Manuscripts


    In the preface of the fourth decade (p. vii) I argued, following Reeve (RFIC 114
    (1986), 138), that since five manuscripts assigned by McDonald to his $\alpha$
    codices deterioriores, labelled $\alpha(a)$ by Reeve (Holkam 344, Leipzig, Univ.
    Rep. 1.1, Paris, BNF Lat. 5740, St. Pietro C 132, and Wolfenbüttel Holm. 46),
    have a text of Liv ending not, like most manuscripts, at 40. 37 but at 40. 12.
    is imponerent Macedoniae regen² and this text was known to the pre-humanist Lovato
    Lovati in the thirteenth century,³ the $\alpha$ manuscripts cannot derive, as
    McDonald thought, from $\phi$ (the lost source of London, B Harl. 2493 (A), Paris,
    BNF Lat. 5690 (P), and El Escorial R. 1. 4 (E)), variants in the margin of $\phi$,
    and Petrarch’s corrections in A. The matter is discussed by Bernard Mineo in his
    Budé edition of book 32 (Paris, 2003), pp xxx–xxix, xli–xiii, which I now consider
    in detail.


    Billovich evidence for the terminal point of Lovato’s text is a note in the margin
    of a manuscript of Justin, London, BL Add. 19906;⁴ opposite the sentence iterge
    Persus, percepta aegritudine coti diem absentem Demetrium eum primum et inuinism
    post


    +   ¹ OCT of books 31–35, pp. xxx–xxvi.

    ² Originally in the case of the Holm and Vatican manuscripts; the remainder, together
    with 37, 59.2 qui... 38. 17 naturum esse, omitted by the $\alpha(a)$ manuscripts,
    was added from another $\alpha$ source; the Vatican manuscript also adds 33. 8.
    4 legum... 9 t nemis nisi, omitted by all the $\alpha(a)$ manuscripts.

    ³ G. Billovich, JW 14 (1951), 208, La tradizione del testo di Livio e le origini
    dell''umanesimo (Padua, 1981), 6–282–308.

    ⁴ Billovich (op. cit., 7) was almost certainly to think that the manuscript itself
    was written by Lovato; see M. Peletoti, IMU 50 (2009), 8–18, M. D. Reeve, Manuscripts
    and Methods (Rome, 2011), 21–3.'
