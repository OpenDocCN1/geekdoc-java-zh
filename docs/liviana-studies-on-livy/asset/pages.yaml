    Before proceeding further, it may be helpful to set out the historical background.6
    Lorenzo Valla was born c.1460, entered the priesthood, and made an unsuccessful
    attempt to become one of the apostolic secretsaries. In 1430 he left Rome for
    Lombardy, where he had the protection of the Visconti; in 1435 he joined the court
    of Alfonso V of Aragon, who was engaged in conquering the Kingdom of Naples, a
    task he completed with the capture of Naples itself in 1443; he remained with
    Alfonso until 1447.7


    Alfonso, a man of culture, had gathered together a number of humanists, including
    Antonio Beccaddi, called Panormita,8 and Bartolomeo Facio. Valla had earlier been
    a friend of the reformer, but they quarrelled in 1432, though a brief reconciliation
    followed. The quarrel with Valla (whom Valla consistently calls ''Fatuus'') resulted
    from criticisms Valla had made of Facio''s de bello Veneto, which the latter had
    asked to read. Subsequently, Valla gave Facio a copy of two works of his own,
    on the Tarquins and the rhetorica ad Herennium, which Valla passed to Panormita,
    who made a copy, itself copied by others; Facio and Panormita spread the claim
    that Valla had committed a solecism, writing parcurus instead of parusus. Valla
    replies that he had himself marked the word with the sign he always used to doubt
    about.10 Later, Valla gave Alfonso a draft of the first three books of a biography
    of Alfonso’s father Ferdinand, a preliminary to a biography of Alfonso himself,
    which which hoped to be entrusted (and eventually). Alfonso also put them in his
    library until he had time to read them; Valla claims that Facio and Panormita
