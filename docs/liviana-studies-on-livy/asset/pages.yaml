    As will be seen, in the fourth decade there is a gap of c.25 between the last
    editions of books 31–4 and those of books 36–40, in the fifth of nearly thirty
    years between the editions of books 43–5 and those of books 41–2; my own experience,
    having used these volumes over a period of fifty years, is that the later ones,
    unsurprisingly, display a degree of depth and maturity lacking in the earlier
    ones.


    A totally new edition was produced, between 1883 and 1907, by Anton Zingerle,
    mentioned above for his collation of the Vienna manuscript of books 41–5. That
    apart, he appears to have relied on existing reports of manuscript readings (with
    detailed discussions in *epile momenta*³⁷ to book 21 and *prolegomena* of books
    22 and 23) of books 21–3, but since the title pages describe them as volume 2,
    he evidently intended to produce an edition of the whole of Holy. So too Luh,
    whose edition of books 21–5 and *editio minor* of books 26–30 are entitled volumes
    3 and 4 respectively.


    As well as editions, completed or planned, of all the surviving books, there were
    also, particularly in Germany and Britain, a very large number of texts, notes,
    of one or more books, mainly designed for use in schools.³⁸ The most popular books,
