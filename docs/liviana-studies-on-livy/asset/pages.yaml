  md: 'altered to the nonsensical *noctu* by both C and the corrector of R, passing
    from the latter into almost all other manuscripts (Drakenborch cites *nae tu*
    from Berlin, Staatsbibliothek Lat. F 27). The corrector of C read just *tu*, and
    he could have been right, *no* arising from the preceding *-nt*. Certain examples
    of *ne* + pronoun, however, are 5. 9. 5 *ne ego libenter experirir*, 9. 19. 10
    *ille saepe*, and 28. 42. 2 *ne tibi*, P. Corneli. Haase also mentioned 30. 14.
    7, where where P has *multo*, the Spirensian tradition *ut multo*, and Rhenanus
    proposed, quite uncompellingly, changing *ut* to *nae*.


    It seems, then, that there are six passages where the manuscripts present asseverative
    *ne*, in three of which it is followed by a pronoun. Of the other three, two can
    plausibly, but not certainly, be emended to produce a pronounn. As to 34. 6. 16,
    the conjecture which has held the field since Madvig involves a pronoun not otherwise
    attested in the construction and no alternative has palaeographical plausibility.
    All three occur in speeches and it could be that Liv had heard *ne* used without
    a pronoun in the courts or rhetorical schools, and decided to adopt it in speeches
    in his history.'
