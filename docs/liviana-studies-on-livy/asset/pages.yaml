    # DRAKENBORCH TO KREYSSIG


    Drakenborch''s edition was a major landmark and for a long time remained the basis
    of study. As far books 1–32 and 34–40. 37. are concerned, even when the manuscripts
    possessing authority had been identified, editors'' reports of *deterioriores*
    / *recentiores* (including those he had taken from earlier editors) derived, without
    checking, entirely from Drakenborch; exceptions are the Budé of the third decade
    and mine of the fourth. And since Drakenborch''s notes repeat, verbatim and in
    most cases, earlier scholars, from Valla to the younger Gronius, had written,
    as well as making previously unpublished notes by Gebhard,^{21} and others, it
    did not seem necessary to consult the original publication. Drakenborch''s text,
    moreover, acquired such authority that for the next hundred years editors—who
    made improvements—described their as being *ex recensione A. Drakenborchii*.


    Before Kreyssig, editors who consulted manuscripts which ever came easily to hand,
    often naturally, those written in the fourteenth and fifteenth centuries. Sometimes
    they did indeed light on manuscripts which had possessed authority and feature
    in modern stemma. Thus, in the first decade, Groonites cites C, H, L, and M;^{22}
    in the third decade Oakley''s, Drakenborch and R were known to the elder Gronius,
    D to the younger, M and D to Drakenborch. By comparison, the fourth decade editors
    and critics before Kreyssig, who had this on the Bamberg manuscript,^{23}


