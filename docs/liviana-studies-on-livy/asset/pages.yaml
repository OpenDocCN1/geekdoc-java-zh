  md: '# Preface


    WHEN, in the autumn of 2012, following the publication of A Commentary on Livy,
    Books 41–45, I submitted to OUP a proposal to produce an OCT of books 21–5, I
    said that as the apparatuses of OCTs are normally briefer than of Teubner editions,
    I should not be able to cite as many conjectures as I had in my editions of books
    31–45. One of the Press’s readers observed that some recent OCTs did have substantial
    apparatus and Hilary O''Shea suggested that conjectures excluded from the apparatus
    might in a companion volume, published contemporaneously. It soon became clear,
    however, that by itself such conjectures would be nowhere long enough to fill
    a viable volume, but could be accommodated in an appendix to the OCT itself. Stephen
    Oakley suggested that a companion volume might contain a justification of some
    of my editorial decisions. At first I was reluctant to embark (‘in this late season’,
    as Ronald Sym used to say) on what might appear on books 21–5, but was later attracted
    by the idea, the work to be on the scale of Hugh Lloyd-Jones and Nigel Wilson’s
    Sophia and Wilson’s Aristophanea (the title, suggested by Hilary O''Shea) rather
    than of Stephen Heyworth’s Cynthia, but to appear some time after the OCT, rather
    than contemporaneously. Then since, companion volumes have accompanied the OCTs
    of Herodotus, Caesar Comile, and Suetonius, by Nigel Wilson, Cynthia Damian, and
    Bob Kaster respectively.


    The textual discussions (which I index by reference rather than page number) occupy
    the bulk of the volume, and are preceded by a survey of the editing of Livy from
    the editio princeps to the present day. The next seven chapters also concern books
    21–5: a discussion of the annotations in London, BL Harley 2493 which I ascribed
    to ‘A’ rather than to Valla, five cases where I provide details deliberately omitted
    from the apparatus of the OCT (readings of the Puteaneus excluded in accordance
    with the rules described on pp. xx–xii of the OCT, identification of the manuscripts
    described merely as ‘det(t), and precise references for the conjectures ascribed
    to Weissenborn, Madvig, and H. J. Müller), and add corrigenda to the OCT. Then
    come four chapters in which I return to my commentaries on'
