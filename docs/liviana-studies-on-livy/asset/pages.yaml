  md: '# The Annotations of ‘A’ in BL Harley 2493


    misunderstood the procedure followed in their apparatus.$^{42}$ I list, with explanation,
    the passages concerned (adding 23. 32. 1, which she does not mention), referring
    to Conway–Walters as ‘C–W’.


    +   21. 28. 5. C–W attribute uadam to Valla, who has the transmitted uado in his
    lemma and says merely credo destestuat; uadam appears first in the Aldine edition.


    +   21.56.1. C–W attribute additus nouus to A$^V$ Valla. In the Antidotum the
    lemma is quoque terror and Valla proposes additus quoque error: A has additus
    nouus terror, with transposition marks (perhaps by Valla) above the first two
    words.


    +   22. 23. 6. Regolios accuses C–W of wrongly attributing in milites to Valla:
    he does indeed say (sc. muto) milite in milites, but the lemma is in mil and Valla
    clearly did not intend to delete in. In fact, C–W should not have included in,
    which is not in doubt, in their note. Regolios also complains that C–W do not
    mention Valla’s change of sex libras: that because the latter is the reading of
    P and Valla’s emendation is, therefore, of no concern to an editor of Livy.


    +   22. 29. 4. Valla altered ab minim to ab minim, but the 1532 edition wrongly
    omitted minim (and changed ab to a). That explains, Regolios says, why C–W do
    not attribute the reading to Valla, though since $a(b)$ minimis is a correction
    of (the transmitted *animis*) in M and C, they would not necessarily have felt
    obliged to do so (A appears to have had the transmitted animis, corrected to minimis,
    in my view by Petrach; C–W attribute the correction to A$^s$, i.e. to an uncertain
    corrector, but had they knew the true text of the Antidotum, they would probably
    have cited it and attributed to both Valla and A’).


    +   22. 38. 9. Valla proposed quomo quodammod or quod aliquis (the transmitted
    dux is omitted in the lemma). The 1532 edition has quodo uel quodammod, quid est
    aliquus dix, and C–W say quodo (uel ut A$^v$ quodammod quis).


    +   22. 46. Valla proposed ante alias or inter alia ipsa, but the 1532 edition
    printed ante alia sue inter alia and this is what C–W report.


    > 42 In his apparatus he refers to C–W ‘Ox’.'
