  md: '# ADDENDA ET CORRIGENDA


    ch. 1. See also P. Assenmaker and S. Paternotte, Tite-Live, une histoire des livres

    (Namur, 2017); I have reviewed this work in Histos 12 (2018), liii-lix.


    p. 5 n. 17. The 1628 edition is posthumous: Gruter died in 1627.


    p. 14. See on p. 221.


    p. 52. Add ’**2. 16** †diunis † carminibus praefarentur.


    From the list of exceptions to the crux at the beginning of 217.


    No totally convincing solution to the crux be found. With P’s reading

    there is no dative to give with *cordi esse*; it cannot be *diunis carminibus*
    and that

    cannot go with *praefarent* as a plain ablative (nor does L. esse elsewhere call
    the

    Sylline books *diunis carmina*. The likelihood, though, is that diunis- ceals
    or diuis and that e should be added before carminibus.


    *praefari* is frequently used in religious contexts, there is no parallel

    for its meaning ‘announce the details of a ceremony to be performed’ (cf. TLL

    x/2. 650. 14 f.). Since however, *praecie* occurs in precisely this state at 43.
    13.

    8 and L. employs praefari on eleven other occasions, there is no good reason

    to doubt it (*Gronvius* proved proferentur, a verb L. never uses’)


