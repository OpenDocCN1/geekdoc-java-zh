  md: '# 10


    # Weissenborn


    WEISSBORN’s Teubner edition of Livy was first published in 1850– and was divided
    into six parts: (i) books 1–6, (ii) books 7–10, *periodchae* of books 21–23, (iii)
    books 24–30, (iv) books 31–8, (v) books 39–45, *periodchae* of books 46–140 *sic*,
    (vi) fragments and index. In the copy to which I have constant access, in the
    University of Manchester Library, parts i and ii, with the dates 1867 and 1866
    respectively, have *iterum recognit Wilh. Weissenborn* on the title page, parts
    iii–iv, with the dates 1868, 1866 respectively, *recognout Wilh. Weissenborn*.
    Engelmann–Preuss (372) similarly indicate that Weissenborn published a second
    edition of only parts i and ii (he died in 1878); for part i they have ‘1850’,
    for the other parts ‘1851’), followed by ‘1873’ for parts iv and v, ‘1874’ for
    the other parts: evidently these letters are the last reprint before 1878 (Klussmann
    513) lists the revision of Weissenborn’s edition by M. Müller (for books 4–38)
    and Hereraus (for books 39–40)). I am unaware of earlier than any copy of Weissenborn’s
    second edition of parts i and ii with a date earlier than mentioned above.


    Weissenborn’s first edition of parts 21–3 is a rarity, but there is a copy in
    the Library of All Souls College, Oxford. Hertz cited readings as ‘W’ if they
    are found in both the Teubner edition and the first edition of the text with commentary
