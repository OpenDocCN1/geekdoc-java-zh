  md: '# Preface


    and editions of books 31–45: the textual problem at 34. 16, the text of the fourth
    decade known to the pre-humanist Lovato Lovati, and further addenda and corrigenda
    to both the Teubner edition of the fourth decade and the commentaries on books
    38–40 and 41–5. Finally, a brief note corrects an error in what I said about Livy
    in the note on Sisenna 26F92 in the third volume of Fragments of the Roman Historians.


    For the third time, I have been fortunate enough to have my work copy-edited by
    Leofanc Holford-Strevens, who has, of course, made a much better book. Earlier,
    it was greatly improved by the suggestions made by the Press’s readers.


    Once again, I must thank everyone from the Press who contributed to the publication
    of the book, particularly Commissioning Editor Charlotte Loveridge, Assistant
    Commissioning Editor Georgina Leighton, and Production Editors Gemma Wilkins and
    Eleanor Chilvers. I must also thank Carolyn McAndrew, who proofread the book for
    OUP.


    The textual discussions have benefited from frequent conversations, both face
    to face and electronic, with Jim Adams. The book was composed almost entirely
    in the University of Manchester Library; I am, once again, very grateful to the
    staff of the main library and the John Rylands Library for their help and patience.
    I must also thank the Library based members of the University’s IT services for
    their prompt and friendly assistance with computer problems.


    At the end of the Preface to my edition of books 21–5, I said that if it had been
    the practice for OCTs to carry dedications, I would have dedicated it to my fourth
    grandchild. I do so now.


    J. B.


    Manchester

    March 2018'
