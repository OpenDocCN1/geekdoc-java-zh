    # THE HAVERCAMPIANUS


    At p. xviii n. 57 of my edition I said that Drakenborch’s Havercampianus

    could not be identified. When I wrote that, I was not aware, as I ought

    to have been (or perhaps had forgotten), at RFIC 115 (1987), 45–16

    Reeve had identified it as London, BL Burney 201, referring to A. G.

    Watson, Dated and Datable Manuscripts in the British Museum (London,

    1979), i. 98. Watson does not mention the Havercampianus (nor does

    the British Museum catalogue of the Burney manuscripts, published'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Codices deterioriores 185


    in 1840)¹ says that Burney 201 ends Finis. Die 24 dieسمبر 1464 and earlier parts
    of the manuscript were written by different hands; Drakenbrock, however, while
    reporting the rest of the subcription in identical terms (apart from differences
    in capitalization), gives the year 1460, and this, no doubt, is the reason that
    nobody before Ree made the identification.


    My initial reaction was that it was a sheer, if extraordinary, coincidence that
    two different manuscripts of the third decade should have almost identical subscriptions,
    or perhaps, that they were written by the same scribe, who finished the copying
    of a manuscript of Livy before Christmas, but decided that I would collate Burney
    201 against Drakenbrock''s reports of the Havercamianus. I soon discovered, that
    the task was unnecessary.


    Drakenbrock refers back to his list of the manuscripts of the first decade which
    he used (vi. 321), also is the fragment Havercamianus, as does Burney 201, pages
    of books 1 and 2 (1. 3.4 creuerant maxime–7.9 postquam facinus, 30.1 mons et quo–33.
    1. 1 omnem Rom, 2. 25. 3 casa parumper–32. 12 mentes hominin, 40.12 aedicatunque
    est (sc)–47. 6 castra ad omnem, 55.1–tus editur to the end of the book (Oakley
    i. 258, saying that it is Drakenbrock’s *fragmentum*, followed by, with the exception
    of 5. 2.12 usparte to 10. 12 million and 10. 20. 9–que to the end of the book,
    the full text of books 3–10 (Oakley calls the *fragmentum* ‘21.1’, the text of
    books 3–10 ‘21.2’. This is followed, by 109r to 258r, in a different hand, another
    text of the whole of the first decade (not mentioned by Drakenbrock or Oakley).
    The third decade occupies ff. 266⁶ to 417⁷.


    ‘1460’, therefore, is an error by Drakenbrock. Perhaps the British Library will
    free to insert a note in the manuscript indicating that it belonged to Siwart²
    Havercamianus, a scholar of some importance, and referring to Drakenbrock’s use
    of it.


    In the second edition of *Emendations Luilianae* (p. 312) Madvig noted that his
    conjecture <et> castra at 22. 60. 26 was the reading of the Havercamianus (it
    is not cited by Drakenbrock); and suggests that he was aware of its identity and
    had used it in the British Museum (I can confirm that it is the reading of Burney
    201).


    +   ¹ Catalogue of Manuscripts in the British Museum, new series, i (London, 1840).

    ² The name varies between Siwart, Sivert, and Sigebertus; at ed. p. viii n. 7
    I called him Sigebert, on the basis of Sigebertus Drakenbrock.'
