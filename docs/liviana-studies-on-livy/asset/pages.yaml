    p. 517. 44. 17. Tansey, op. cit. (on 39. 32. 6, 8) argues from Plut. *Paull.*
    6, mor. 197f that Paullus had stood unsuccessfully for the consulship of 171 Plutarch,
    however, seems to be talking about a time before the war with Perseus, which would
    have been illegal under the *lex Genucia*, banning iteration before the expiry
    of a full ten years first holding the office (7. 42. 2). Livy clearly knew nothing
    of a defeat on the eve of the war and Plutarch has probably conflated Paullus’
    earlier defeats (vol. iii. 330–1), which he failed to mention, with the expression
