  md: '# 1


    # # Editions of Livy


    UNTIL the advent of the compressed and highly abbreviated Gothic script, no more
    than ten books of Livy could normally be fitted into a single parchment codex
    (the ancestor of the Spireisian tradition, containing, with the exception of book
    33, books 26–40, was an apparent exception, though it is conceivable that it was
    split into two volumes, each consisting of seven books); for that reason the story
    of the transmission of each of the surviving parts of his history (books 1–10,
    21–30, 31–40, 41–5) is different. When the *editio princeps* was published at
    Rome in 1469 or 1470, only books 1–32 and 34–40. 37 were known. Book 33 came to
    light in two stages, from 17. 6 onwards in the Mainz edition of 1519, which also
    contained the final part of book 40, the first third of the book in an edition
    published in Rome in 1616. Books 41–5 were first published in the Basle (Froben)
    edition of 1531.


    # # INCUNABLES


    Drakenborch lists eighteen commentaries (i.e. editions published in the fifteenth
    century), three published in Rome, six in Venice, three in


