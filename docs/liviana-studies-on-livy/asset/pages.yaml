    in the article (280,18), they describe Haase’s conjecture ‘uix reict’


    K–St (loc. cit.) give no examples of ne without a pronoun, but it is quite likely
    by ‘nachklassisch’ that they mean 26. 31 and 34. 4.16 (they often speak of L.
    as a post-classical writer). In the former of OCT and Conway and johnson


    ea uos rata habeatis, patres conscripti, necne, magis rei publicae interess mea.


    Thus all editors since Weissenborn. P has ne and necne was read by the Aldine,
    followed by subsequent editors J. Gronius argued for the restoration of nae (Conway
    and Johnson) wrongly attributed necne to Holkham 349 and 350, misunderstanding
    that two manuscripts omitted ne; a similar misunderstanding, it seems, by Hertz).
    With ne, ea uos rata habeatis depends on interest with an ellipse of ut: there
    is no parallel for this with interesse (cf. TLL vii/1.2290. 3 ff.), but of ut
    is frequent in Livy (cf. vol. 2, 12) and in itself it is unobjectionable. With
    necne, there is ellipse of interesse (cf. TLL vii/1.2285. 60 ff.). ne produces
    a disjointed sentence, the exclamation coming between the subordinate and main
    clauses. It is not, however, out of place in Marcellius emotional.


    The only passage of Livy cited by K–St is 26. 6. 15 ne perditas res Campanorum
    narras, and here too the text is not certain. P has not'
