  md: '# APPENDIX: bonum/malum publicum


    AT FRHist 3. 464, in the commentary on Sisenna 26F92, for which I was responsible,
    it is stated that Livy uses only mala publica, rather than the singular malum
    publicum. In fact the coupling occurs only twice in Livy, malum publicum (nom.)
    at 4. 44. 9 and publicis malis (abl.) at 30. 44. 9. He uses bonum publicum, always
    in either the dative or the ablative, on seven occasions (2. 44, 3. 9. 38. 11,
    27. 6. 8, 28. 41. 1, 2, 33. 46. 8, 34. 5. 8). pessimo publico (abl.) occurs at
    2. 1. 3, showing that it is publicum, not bonum/malum which is substantivized.
    See also Oakley''s note on 9. 38. 11 (iii. 490).'
