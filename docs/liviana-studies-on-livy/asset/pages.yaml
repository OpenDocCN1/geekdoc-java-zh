    # The Problem of 34. 4. 16


    Ne simul pudere quod non oportet cooperit, quod oportet non pudibet.

    e B$ : na<m> Haase (130) : nae <eas> Lentz (H) : om. Weiss.


    Thus the text and apparatus of my Teubner edition of Livy''s fourth decade, published
    in 1991. In my commentary,¹ I wrote:


    ne: ''indeed''. Cf. K-St, i. 795 ff.

    <eas>: I am not convinced that Lentz''s supplement is necessary.

    Cf. iii. 19. 7, 52. 7, Damsté, Mnemosyne n.s. xlii (1915), 163.


    About a year after the publication of my edition, G. S. Watt² compiled a series
    of notes on it, not intended for publication.³ On 34. 4 16 wrote as follows: “I
    am not convinced that Lentz''s supplement is necessary”, says Briscoe, referring
    to two passages in which pudet is used absolute. But Lentz''s reason for inserting
    eas has nothing


    ¹ Vol. ii. 54.

    ² Professor of Humanity (i.e. Latin) at the University of Aberdeen from 1952 until
    1979, edited the OCIs of Cicero''s correspondence for Atticus books 9-16, edited
    by D. R. Shackleton Bailey), as well as a Teubner edition of Velleius Paterculus
    (1988, 2nd ed.). He died in 2002; see the obituary by R. G. M. Nisibet, PBA 124
    (2004), 359–72.

    ³ He sent them to Harry Jocelyn, who had Watt his copy of my edition. Jocelyn,
    after some hesitation, gave them to me. In Sending Watt my response, I wrote “I
    am very grateful to you for your comments on my Livy edition, which Jocelyn has
    passed to me. I feel bound to say, however that I would have preferred if you
    had sent them directly to me, rather than communicate them to Jocelyn, as if you
    were reporting to a Headmaster on the delinquencies of one of his pupils; Watt
    replied “I sent comments to Jocelyn because he was the only copy of your edition
    which I have seen; I wanted to show my gratitude to him by proving that I had
    actually read it”. Afterwards we corresponded in friendly terms.'
