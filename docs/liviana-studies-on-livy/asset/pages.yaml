    # H. J. Müller


    Following Weissenborn''s death in 1878, H. J. Müller (‘H.J.M.’ in my edition)
    undertook a revision of the former’s edition with commentary (‘W–M’ in my edition).
    The seventh edition of books 21–3 was published in 1882 (21–2; a digitized version
    is available via SOLO and 1883 (23). The eighth edition of books 21 and 22 appeared
    in 1888 and 1891 respectively, followed by a digital version of book 22 is available
    at archive.org.), followed by a ninth edition in 1900 and 1905 respectively; Müller
    died in 1913 (*see JPhV* 39 (1913, n. 1)) and Rossbach produced a tenth edition
    of book 21 in 1921. There were two further editions of books 24 and 25, the fourth
    in 1880 and the fifth in 1895. The reprint of the whole work (1962) naturally
    contained the latest revision in each case.


    Between 1885 and 1913, with the exception of 1880 and 1886, Müller published an
    annual report on Work on Livy in the Jahrberichte zu Berlin (*JPhV*), often proposing
    newendations in the course of commenting on the conjectures of others, and also
    listing new readings adopted in his revisions of Weissenborn, in some cases the
    source of my knowledge about these editions. I give references to JPhV (by year
    alone) only when, as far as I know, the conjecture does not appear in any of his
    editions. In all other cases, I indicate (‘W–M’ by a numeral, except that in books
    24 and 25 ‘W–M’ indicates the fifth edition) the earliest edition, of those accessible
    to me or whose readings are reported in *JPhV*, in which it appears. Müller also
    published school editions of books 24 (1878) and 25 (1879); *see JPhV* 4 (1878),
    67–8, 5 (1879), 145–8: Luchs’s reports are of these; his editions of books 21–2
    (1882), 23–4 (1883), and 25–6 (1881) (reported by Klussmann, 514) contain, with
    a few variations, the texts of the latest W–M editions: *cf. JPhV* 8 (1882), 277.
    ‘C–W’ indicates a reading attributed to Müller by Conway and Walters but'
