    # Madvig


    I use ''em.'' to indicate conjectures to be found in the second edition of Emendations
    Liuiane (Copenhagen, 1877). The majority of them are also in the first edition
    (Copenhagen, 1860),¹ in the first or second edition of his text (1862, 1872);¹
    ''em.'' indicates a conjecture found only in the first edition, ''em.'' followed
    by a page number that Madvig discusses the passage of text order. In the case
    of a conjecture found only in one or more of Madvig''s text, I indicate which
    by its date: 1862, 1872, 1880, 1886; when the conjecture appears in the preface
    to the edition, but is not printed in the text, I add ''praef.'' to the date.
    The 1862 edition is held by the British Library and is available online at archive.org.
    The 1872 edition is held by the British Library.¹ The 1880 edition is held by
    the Bodleian and Sackler Libraries in Oxford, and is available online via SOLO,
    the unified catalogue of all Oxford libraries. The 1886 edition is held by the
    Bodleian Library in Oxford, the Institute of Classical Studies in London, and
    the John Rylands Library in Manchester, and is available online at archive.org.
    ''Ingerselv'' indicates a conjecture found in Ingers''s edition of books 21–3.³


