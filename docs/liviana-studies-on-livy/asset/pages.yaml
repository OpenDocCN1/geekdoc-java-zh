  md: '23. 30. The 1532 edition attributes primum magistratum (in fact found in the
    Milan edition of 1495 and adopted by C–W) to Facio and Panormita. Regoliosi prints
    the manuscript reading magistratum, but on this occasion has no entry in his apparatus.


    23. 32. 1 (not mentioned by Regoliosi). See p. 96

    23. 13. Valla proposed (correctly, apart from the two words) that he thought to
    have made it two meddiuctus: the 1532 edition has mediuticus uel distintuticus
    (C–W report ‘medis uel medias tuticus, ascrib-ing medix tuticus to Lipsius).


    23. 47. 8. This item concerns an emendation of Facius and Panormita, not Valla:
    they proposed quam uera sit, but it was omitted in the 1532 edition. Editors Stroth
    have adopted it, giving the credit to Gronovius.


    24. 4. 3. C–W wrongly attribute Valla Andranadorum et Zoulum, the reading of both
    the 1532 edition and the editio princeps of Livy.


    24. 38. 2. C–W attribute possit, the reading of the 1532 edition to Valla, who
    in fact proposed posset; he also entered the latter in A, ascribed to Aˢ (see
    on 22. 29. 4 above).


    24. 45. 3. Regoliosi accuses C–W of wrongly attributing resurgere ab stirpibus
    to Valla. They in fact say ‘resurgere ab stirpibus Valla et Weissenben. (resurgerecurs
    Valla)’: they mean, that is, resurgere ab stirpibus is a combination of the readings
    of Valla and Weissenborn.


    25. 4. 9. Valla proposed rogauerunt, which he also entered in A (attributed to
    Aˢ by C–W). The 1532 edition printed uocauerunt and C–W therefore attribute rogauerunt
    to Gronovius.


    25. 6. 7. This again concerns Facio and Panormita, to whom C–W assign a proposal
    to change nisi to sit, found in the 1532 edition but not in the manuscripts.'
