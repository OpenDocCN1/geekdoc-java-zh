  md: '# Liviana


    The second Lieben edition (Fr.2), published at Basle in 1535, added no further
    text, but significantly increased the evidence for what was already known. In
    the first decade Rhenanus (in books 1–6) and Gelenius (in books 7–10) cited readings
    from two manuscripts, both probably at Worms, one of which was closely related
    to the Medice MS whose authority is to that of all other Carolingian manuscripts.¹12
    In books 26–40 (Rhenanus in books 26–30, Gelenius in books 31–2 and 34–40) they
    cited readings from a manuscript at Speyer which was to give its name to the tradition
    rivalling that of the Puteanus in books 26–30.¹13 Gelenius, moreover, corrected
    many of Carbach’s readings of Mg and added variants which the latter missed.


    # FR.2 TO SIGONIUS


    Drakenbrock lists twenty-four editions published between 1537 and 1572. By far
    the most important are the last three, the editions of Sigonius published at Venice
    in 1555, 1556, and 1572 respectively.¹14 Sigonius was able to use his historical
    knowledge, and particularly his work on the res Fasti, to correct many of the
    proper names, both personal and geographical, which had been corrupted in the
    course of transmission.¹15 He also used one or more manuscripts to correct the
    text, though it is not possible to identify it/them.


