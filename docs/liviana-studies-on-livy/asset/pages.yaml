    # Liviana


    etiam suspect reddere (Justin 2. 8) Lovato wrote hic deific T. Livius under which
    he drew a line (see Billanovich’s pl. 1, opposite p. 32). Billanovich wrote (op.
    cit., 10) ‘subito sotto di questa nota, all''altezza di reddere’, tira una linea:
    con la quale aveva voluto indicare che proprio a questo punto terminava il testo
    della decade che era riuscito a conquistare. Mineo (without specific acknowledgement,
    though he gives the reference to Billanovich in his n. 42) renders this as c’est
    à ce précis du récit qu''indiquait en note: hic deific T. Livius et juste en dessous,
    à la hauteur de reddere, il tirait une ligne, comme souligner que se terminait
    le texte de IV avait requis à retrouver. But Billanovich saw the note as Lovato’s
    text was of the manuscripts which terminated at 40. 12. 15, and as he thought
    it by Bencius of Alexandria ended ‘vers’ 40. 5, and even thought it contained
    book 33 (Mineo, p. xli; he thought of talks of codex of Mussato having previously
    referred to the latter: Mussato was a pupil of Lovato who had read all three decades
    of Livy, and it is likely enough that he used Lovato’s manuscript, but there is
    no evidence concerning his knowledge of book 40; see Billanovich, 10–14).


    Mineo, though to admit to Livy’s narrative n’avance entre les chapitres 5 et 15’
    and concludes that ‘Opposition entre le terme de texte décrit par Livato e celui
    de Bencius ne doust pas necessairement incontournable. That is indeed the case.
    Following reddere Justin nunc amicitiam Romanum, nunc proletinem patri obietare.
    ad postremum insibi sib ea eo poratas configit, cui rei probationem immidit indices,
    testes suborn, et facinus quod obitmit indices. quibus rebus compulsio ad patricidium
    patrem, funestam omnem regiam factiam. The last sentence summarizes what stands
    in Livy 40. 20–28, but the rest is not a very accurate representation of chs.
    6 to 13. (Justin, of course, may have represented Trogus): most of Livy’s account
    consists of the speeches of Philip V, Perseus, and Demetrius, based on Polybius
    but no doubt containing a considerable amount of elaboration, and Justin and Livy
    in detail, could well have placed his note where he did, even if he had a text
    of Livy which ended at 40. 12. 15. What is more, it is far from that he intended
    the note to be keyed specifically to reddere rather than as a general indication
    of the terminal point of his text. Billanovich’s interpretation of the import
    of the line underneath the note is equally uncertain: it may have been meant only
    for emphasis.'
