    The last two-thirds of the nineteenth century were the great age of German editing,
    with increasing understanding of the primary manuscripts. Alschefski (1841–6;
    first and three decades only) used M and P in books 1–10, the Puteanus, M, and
    C in books 21–30, and was followed by Weissenborn in his Teubner (1850–1); for
