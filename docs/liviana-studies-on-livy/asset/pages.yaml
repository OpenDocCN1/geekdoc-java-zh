    in 1540 (a reprint of this edition was published in Turin in 1962). In 1542 Gryphius
    included them in his edition of Livy (also published at Lyon), and he was followed
    by many subsequent editors, culminating in Drakenbrock, who made the first entry
    in his commentary on the relevant passages.$^{39}$ Most subsequent editors, presumably,
    demonstrated their knowledge from Drakenbrock. Conway, however, claims to have
    taken from Gruter’s Frankfurt edition of 1628, which does not in fact contain
    them$^{40}$ he no doubt the edition of 1612, Walters (CQ 11 (1917), 57) says he
    had used; Gruter included them in his first edition (1607–8)$^{41}$ listing them
    with the chapter numbers he had introduced (cf. p. 5). By basing her edition on
    the manuscripts, Regolius was to demonstrate mistakes in Conway–Walters’ apparatus;
    in other cases, though, the error is due to Conway–Walters themselves, while in
    three Regolius


    > $39$ Regolius, pp.xxiv–xxvii, but her statement (p.xxvi) that the emendations
    accompagnano quali le seguendi liviane a una classica del Drakenbrock’ is a considerable
    exaggeration.


    > $40$ Conway–Walters, p. xii. The 1609 edition, also, does not contain them.


    > $41$ I am grateful to the Library of Worcester College, Oxford, for allowing
    me to consult their copy of this edition, which is not held by the Bodleian, the
    British Library, or the John Rylands Library (cf. p. 188 n. 4).'
