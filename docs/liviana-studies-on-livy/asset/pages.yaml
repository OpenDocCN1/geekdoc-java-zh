    # THE TWENTIETH AND TWENTY-FIRST CENTURIES:

    OCTS, BUDÉS, AND TEUBNERS


    The early years of the twentieth century saw no change in Germany. In Britain,
    where no original edition of the whole had appeared since of Hearne, work was
    under on an Oxford Classical Text edition, edited by R. S. Conway, Hulme Professor
    of Latin at Manchester, and C. F. Walters, Professor of Classics at King’s College,
    London. The first volume, containing books 1–5, was published in 1914, the second
    (books 6–10) in 1919. Walters became ill in 1921 and died in 1927: the third volume
    (books 21–5) appeared in 1929 under the names of Walters and Conway (in that order,
    as in vol. ii, for which Walters had been mainly responsible) and with ego in
    the apparatus designating Walters, but this should be seen as a mark of respect
    by Conway; he was confessed responsible for the preface and clearly so the final
    form of the apparatus.


    These three volumes follow the same pattern and suffer from the same, largely
    a result of editors’ hostility to stemmatics. (Walters once wrote (CQ 2 (1908),
    213) ‘but further in stemma-making I decline to go, for “stemma quid faciant?”
    except much stereotyped mischief.’⁴⁰ They did not produce a stemma, and did not
    use sign to indicate the census of groups of manuscripts, citing manuscripts individually,
    including those which were eliminable, and often in an illogical order. in addition,
    they cluttered up their apparatus with unnecessary information; in addition, they
    frequently included otiose value judgements on conjectures (bene, optime—the latter
    sometimes of something they did not print—male, *frusta*) and facetious comments.
    Their reports of the readings of manuscripts and early editions, moreover, were
    frequently inaccurate, and recent scholars have discovered.


    After Walters’s death, Conway co-opted S. K. Johnson (his colleague at Manchester
    from 1924 to 1927, subsequently Professor of Classics at Swansea (1927–33) and
    Newcastle (from 1933), as co-editor of books 26–30;⁴¹ Johnson was assigned the
    compilation of the apparatus, with


