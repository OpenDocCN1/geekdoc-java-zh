    readings belongs to the Ascension (particularly that of 1513, but a number in
    that of 1510⁸, Aldine (1518–20), Mainz (1519), and Basle (1531, 1535)⁹ editions.


    As mentioned, the Mainz edition was the first to hitherto unknown parts of the
    fourth decade, from a now lost manuscript, containing 33. 17. 6 *his partes* (a
    corruption of *ius facius*) to the end of the decade, discovered by Nicolaus Carbach
    (ius) (1485–1534) in the Cathedral library at Mainz (Latin Mogontiacum or Moguntia),
    hence the sigla ''Mg'' for the manuscript and ''Mod'', for the edition; at the
    end of the edition Carbach added ‘Annotata e uesto codices’ where the reading
    of his manuscript differed from that of previous editions (his point of reference
    was the Ascension of 1513).¹ On some occasions Mog has a novel reading which does
    not appear in Carbach''s *Annotata*: it is uncertain whether these conjectures
    or were fact taken from Mg. Some of Carbach''s misreadings of Mg were quickly
    corrected, by juncture, in the Aldine edition.


    In the Froben edition of 1531 (Fr.1) Gnaeus published books 41–5, from the unica
    manuscript, now in Vienna, which he had found at Lorsch for years earlier.¹¹ Almost
    immediately texts of the new material appeared from the Ascension (1531; a new
    edition had been published the previous year), Juntine (1532, from both Florence
    and Venice: the first had been published at Florence in 1522), and Aldine (1533)
    presses. Fr.1 also contains many, frequently correct, readings in the first, third,
    and fourth decades; in the latter correct some of the errors in Mg (or in Carbach''s
    reports of Mg), but all due to juncture: there is no reason to think that they
    derive from Mg itself (though Mainz is less than 300 km north of Basle, as the
    Rhine flows).


