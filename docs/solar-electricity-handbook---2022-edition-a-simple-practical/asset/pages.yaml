    | Ave month temp | 50°F/10°C | 62°F/12°C | 70°F/21°C | 84°F/29°C | 93°F/34°C |
    106°F/41°C | 109°F/43°C | 106°F/42°C | 95°F/35°C | 85°F/29°C | 71°F/22°C | 62°F/11°C
    |

    | Likely of roof-mounted solar array (Temp x 1.4) | | | | -4.2% | -8% | -8% |
    -5% | -3.5% | -3.5% | -2.5% | | |

    | Performance for roof - mounted solar | | | | | -2.2% | -3.2% | -3.5% | -3.5%
    | -3.2% | | |

    | Likely pole-mounted temperature of solar array (Temp x 1.2) | | | | | | | |
    | | | |


    The Performance Impact calculations in 3 rows and 5 in the table are calculated
    using the following formula:


    > (Estimated Solar Panel Temp °C - 25°C) x (-Temp Coefficient of Power Rating)


    So, for July, the calculation for roof-mounted solar was (41°C - 25°C) x (-0.5)
    = -8%\u2013


    For around five months of the year, the ambient temperature in Austin is greater
    than 25°C/77°F. During these months, the higher temperature will lower much efficiency
    when producing power from a solar array. If you are designing a system that must
    operate at maximum efficiency during the height of summer, you will need to increase
    the size of your solar panels by the percentages shown, to handle this performance
    difference.


    You can find the ambient temperature for your location by visiting The Weather
    Channel website at www.weather.com. This site provides average monthly temperatures
    for towns and cities across the world, in your choice of Fahrenheit or Celsius.


    Our example holiday project is in the United Kingdom, where the temperature is
    below 25°C for most of the year. In addition, our solar design will produce more
    power than we need during the summer months. As a result, we can ignore temperature
    in our particular project.


    # Working out an approximate cost


    It is worth stressing that these figures are only approximate at this stage. We
    have not yet taken into account the site itself and we are assuming that shading
    will not be an issue.'
