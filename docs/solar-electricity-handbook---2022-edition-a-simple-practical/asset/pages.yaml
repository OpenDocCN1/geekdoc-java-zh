    and difficult to install.


    Realistically, due to cable sizing, we are going to use either 24 volts or 48
    volts for our solar electric system.


    # Mixing and matching solar panels


    When specifying your solar array, you should keep to one type of panel rather
    than mixing and matching them. If you use a 100-watt array, you could create this
    with one 100-watt solar panel, two 50-watt solar panels or five 20-watt solar
    panels.


    If you wish to use different solar panels in your array, you can do so by running
    two sets of panels in parallel with each other and connecting them to a controller
    that can handle more than one, or by using more than one. This can be a useful
    way of creating the right wattage system, rather than spending money buying bigger
    solar panels that generate more power than you need.


    The result is slightly more complicated wiring, but it is often a more cost-effective
    solution to do this than to buy a larger capacity solar array than you need. There
    are two ways of connecting two solar panels of different sizes to the same. The
    next two show systems running at 12 volts, using two sized panels to create a
    140-watt peak system:


    # Single Controller system'
  merge: -1
  pgno: 94
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_95_0.png)


    This system uses a single controller. The controller has two separate input feeds.
    The two solar panels work independently of each other and the controller handles
    the mismatch in power output. This is the best solution for handling mis-matched
    solar panels.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_95_1.png)


    # Twin controller system


    This system uses two controllers. The second controller is used to provide additional
    power to the batteries for the smaller solar panel. Both controllers charge the
    same battery bank.


    These solutions are effective if you are planning to start small and add to your
    solar energy system when needs and budget allows. It means you can collect an
    assortment of solar panels over time and put them to good use within your solar
    energy system.


    If you end up with two different models of solar panels with identical ratings,
    put them on their separate circuits. Solar panels from different manufacturers
    are not all identical in their operating voltages or performances, so putting
    two different makes and models of solar panel on the same circuit is likely to
    compromise the performance of both panels, even if the specification of the two
    panels is similar.


    If you buy multiple controllers for your solar system, to handle different makes,
    and sizes of solar panel, you only need one main controller to handle the power
    output from the batteries. Your other controllers can be much cheaper and simpler
    pieces of equipment as they are only handling the power feed into the batteries.
    If you wish, you can even use a simple regulator that simply cuts off when the
    batteries are full, although these are usually not as efficient as a proper solar
    inverter.


    As discussed on page 132, not all solar panels are 12-volt panels. Many solar
    panels are now designed predominantly for grid-tie installation only and are available
    in many different voltage configurations. Solar panels'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'with voltage ratings of up to 120 volts are on the market, although the most
    common are 12-volt and 24-volt panels.


    In the past, the voltage of your solar array had to match the voltage of your
    battery system. If you had a 12-volt battery, you had to have a 12-volt solar
    panel to charge it. Likewise, if you had a 48-volt battery, you had to have several
    solar panels connected in series to match the 48-volt battery system.


    That is still the case with many solar controllers. However, it is now possible
    to buy controllers that can handle much higher voltages from a solar array, and
    convert this to a lower voltage on a battery system. This gives you far greater
    flexibility when designing your system: you can use a few larger, higher voltage
    solar panels to produce the power you need, then use a controller to drop the
    voltage down to a suitable voltage for your battery pack.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_96_0.png)


    Above: Vicron Energy do range of solar charge controllers that can work with high
    voltage solar arrays and reduce the voltage to a lower level for charging batteries.
    For example, the MPPT 150/45 charger shown above can work with a solar array of
    up to 150V/50A and can drop the voltage down to either 12, 24, 36 or 48-volts
    for the battery bank.


    These new controllers work well for stepping down the voltage. For instance, you
    could have a solar array that produces a 100–150 watts, charging a 12-volt or
    24-volt battery bank. However, these controllers cannot work the other way around:
    you cannot use them to charge a 24-volt battery pack from a single 12-volt solar
    panel, for example.


    If your stand-alone solar electric systems run at a voltage other than 12 volts,
    you could either install multiple solar panels 24-volt solar array, or choose
    higher-voltage solar panels. For example, if you wanted a 200-watt solar array,
    you could achieve this in many ways:


    +   * Using two 12-volt, 100-watt solar panels, connected in series

    * Using one 24-volt, 200-watt solar panel


    When choosing a solar array, you need to consider:


    +   * The physical size: will it fit into the space available?

    * The support structure: ready-made supports may only fit certain combinations
    of panels

    * How much cabling you will need to assemble the array

    * The system voltage


    # Batteries'
