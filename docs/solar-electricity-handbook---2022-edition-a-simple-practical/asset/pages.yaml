  md: '# In conclusion


    +   - Solar electricity can be a great source of power where your power requirements
    are modest, there is no other source of electricity easily available and you have
    a good amount of sunshine.

    - Solar electricity is not the same as solar heating.

    - Solar panels absorb photons from sunlight to generate electricity. Direct sunlight
    generates the most electricity, but solar still generates power on dull days.

    - Solar electricity will not generate enough electricity to power the average
    family home all the time, unless major economies in the household power requirements
    are made.

    - Larger solar electric systems have a comparatively high capital cost, but the
    ongoing maintenance costs are very low.

    - Smaller solar electric system can be extremely cost-effective to buy and install,
    even when compared to a conventional electricity supply.

    - It can be much cheaper using solar electricity at a remote building, rather
