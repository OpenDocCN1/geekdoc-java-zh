  md: '# Detailed Design


    By now, you know what components you are going to use for your solar project.
    The next step is to work on your detailed design and create a picture of what
    you want to build. Even for simple projects, it makes sense to draw up a diagram
    before installation.


    There are many benefits of drawing a wiring diagram:


    +   - It ensures nothing has been overlooked

    - It will assist in the cable sizing process

    - It helps ensure nothing gets forgotten in the installation (especially where
    there is a group of people working together on site)

    - It provides useful documentation for maintaining the system in the future


    The wiring diagram will be different for each installation and vary depending
    on what components are used. Read the product documentation for each component
    for information on how it must be wired.


    If you have not yet chosen your exact components at this stage, draw a general
    diagram but make sure that you flesh this out into a detailed document before
    the installation goes ahead.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_120_0.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# A sample wiring diagram for a simple stand-alone lighting system


    When drawing up your wiring diagrams, you will need to remember the following:


    # Safety is designed in


    It is easy to forget that solar energy can be dangerous. We are working with electricity
    and whilst any individual component may only be low-voltage, some of the currents
    involved can be quite significant. Connecting multiple solar panels or batteries
    together in series very quickly creates a high voltage. Safety must be taken into
    account during the detailed design phase of the project, as well as during installation.


    When designing the system, ask yourself this question:


    > What’s the worst that can happen?”


    Solar energy systems are relatively straightforward and the design of all the
    components you will use will keep risks to an absolute minimum. Nevertheless,
    there are potential risks. If you are aware of these risks, you can take steps
    to eradicate them in your design.


    # What is the worst that can happen with a solar installation?


    With solar energy, we will be working in a few risk areas. Namely, DC ethics from
    the solar array, high currents from batteries, AC electrics if you are using an
    inverter, and high temperatures from the solar panels themselves. You may also
    be working at height if installing panels on a roof.


    Each of these risk areas can cause problems, both in isolation and when combined.
    It is worth considering these risks to ensure that you can exclude many of them
    as possible.


    # Grounding your electrics


    Except for a very small system, such as rigging up a light in a shed, a solar
    energy system should always be unearthed (ground). This means running a wire from
    a negative terminal to an earthing rod (known as a grounding rod in North America)
    that is rammed into the ground.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'An earthing rod (grounding rod) is a 1m (3 foot) long metal pole, typically
    made of copper. They are available from all electrical wholesalers and builders''
    merchants.


    Connections to a ground prevent build-up of static electricity and can help prevent
    contact with high voltages if the circuit gets damaged.


    If you are connecting a solar array to a home, you should always include a ground
    connection from the solar array itself. While it is optional in other cases, it
    is always a good idea to include a ground from a solar array, where the array
    is capable of generating more than 200 watts. You must also earth the battery
    bank, as they are capable of delivering very high currents.


    If you are using both AC and DC electrics in your system, you must have a separate
    ground for each system.


    # Grounding a system where you cannot connect to the ground


    There may be instances where you are building a system where no connection to
    the ground is possible. For instance, a portable solar charging unit that can
    be carried anywhere, or a solar powered boat.


    Typically, these designs are very small, using only DC electrics and running only
    a few amps of current. If your solar array is less than 100 watts, your system
    runs at 12 volts and you are drawing less than 10 amps of current, you are unlikely
    to need a common earth for all your components.


    For larger systems, a ground plane is often used. A ground plane is a high-capacity
    cable connected to the negative pole on the battery, to which every other component
    requiring a ground is also connected. A thick, heavy-duty battery interconnection
    cable is often used as a ground plane cable, with thinner wires connecting to
    this ground plane cable from every other component requiring an earth.


    As an alternative to a high-capacity cable, depending on what you are installing
    your solar system on, you can use a metal frame as the common ground for your
    system. In standard car electrics, for example, the ground plane is the car body
    itself.


    # DC Electrics'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Direct current electricity typically runs at relatively low voltages. We are
    all familiar with AA batteries and low-voltage transformers used for charging
    up devices such as mobile phones. We know that if we touch the positive and negative
    nodes on an AA battery we are not going to electrocute ourselves.


    However, direct current electricity can be extremely dangerous, even at comparatively
    low voltages. A small number of people are killed every year by licking 9-volt
    batteries, because of the electric j they receive. Scale that up to an industrial
    grade heavy-duty 12-volt traction battery, capable of delivering over 1,000 amps
    of current, or a solar array capable of producing hundreds of volts on an open
    circuit, and it is easy to see that there is a real risk involved with DC electronics.


    If you are electrocuted with AC power, the alternating current means that whilst
    the shock can be fatal, the most likely outcome is that you will be thrown back
    and let go. If you are electrocuted with DC power, there is a constant charge
    running through you. This means you cannot let go. If you are electrocuted with
    very high current DC, the injury is more likely to be fatal than a similar shock
    with AC power.


    Because of the low current from a single solar panel, you are unlikely to notice
    any jolt if you short-circuit the panel and your fingers get in the way. However,
    wire multiple solar panels together and it is a different story. Four solar panels
    connected in series produce a nominal 48 volts. The peak voltage is nearer 80–100
    volts. At this level, a shock could prove fatal for a young child or an elderly
    person.


    The current thinking with grid-tie solar systems is to connect many solar panels
    together in series, creating a very high-voltage DC circuit. Whilst there are
    some (small) efficiency benefits of running the system at very high voltage, there
    are risks as well, both during the installation and the ongoing maintenance of
    the system.


    There are issues with the 12-volt batteries too. Industrial grade, heavy-duty
    batteries can easily deliver a charge of 1,000 amps for a short period. Short
    out a battery with a spanner and it will be red hot in just a few seconds. In
    fact, the current delivery is so great it is possible to weld metal using a single
    12-volt battery.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'The big risk with DC electric is electrocuting yourself (or somebody else)
    or causing a short circuit, which in turn could cause a fire. Solar panels generate
    electricity all the time, often including a small current at night, and cannot
    be switched off. Therefore, there need to be manual DC circuit breakers (also
    called isolation switches) to isolate the solar panels from the rest of the circuit,
    plus a good ground and a ground fault protection system to automatically switch
    off the system should have a short circuit.


    If your system is running at a high voltage, you may want to consider multiple
    DC circuit breakers/ isolation switches between individual solar panels. This
    means that, as well as shutting off the overall circuit, you can reduce the voltage
    of the solar array down to that of a single panel or a small group of panels.
    This can be of benefit when maintaining the solar array, or in the case of an
    emergency.


    A short in a solar array can happen for many reasons. Sometimes it is because
    of a mistake during installation, but it can also occur because of general wear
    and tear (especially with installations where the tilt of the solar panels is
    adjusted regularly) or due to animal damage as bird nesting corroding cables or
    junction boxes, or a fox chewing through a cable.


    Short circuits can also occur where you are using unsuitable cabling. Solar interconnection
    cabling is resistant to UV rays and high temperatures, and the shielding is usually
    reinforced to reduce the risk of animal damage. Always use solar interconnection
    cabling for wiring your array and for the cabling between the array and your solar
    controller or inverter.


    When a short circuit does occur, there is often not a complete loss of power.
    Instead, power generation drops as resistance builds up. There is a build-up of
    heat at the point of failure. If you have a ground fault protection system such
    as an RCD or GFI in the system should switch itself off automatically at this
    point, before any further damage is caused.


    If you do not have a ground fault protection system in place, the heat build-up
    can become quite intense, in some cases as high as several hundred degrees. There
    have been documented instances where this heat build-up started a fire.


    If a fire does break out, you need to be able to isolate the system as quickly
    as possible. A solar array cannot be switched off as it always generates'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'power whenever there is light. Consequently, there have been cases where the
    fire brigade has not been able to put out a fire generated by a fault in a solar
    array because there has been no way of switching it off. Isolating the solar array
    quickly using a DC circuit breaker resolves this problem.


    Remember that even if you isolate the solar array, you are still generating power
    within the solar array. If you have many solar panels, the voltage and the current
    can still be quite considerable. The ability to shut down the array by fitting
    DC circuit breakers or contactors within the array can significantly reduce this
    power, rendering the system safer if there is an emergency.


    # AC electric


    AC electrical safety is the same as household electrical safety. It is high-voltage
    and in most countries you are not allowed to work with it unless you are suitably
    qualified.


    You will need to install two AC isolation switches: one switch between the inverter
    and the distribution panel to isolate the solar system completely, and one switch
    between your grid-feed and your distribution panel to isolate your system from
    the grid if you are running a grid-tie system.


    If you are planning a grid-tie installation, you will need to speak with your
    electricity supplier, as there will often be additional requirements that you
    will need to incorporate. Your inverter will need to be a specific grid-tie system
    that switches off in the case of a grid power cut. This ensures that power is
    not fed back into the grid from your solar system in the case of a power failure,
    which could otherwise prove fatal for an engineer working on restoring power.


    # High temperatures


    We have already touched on the risk of high temperatures with a solar array. Solar
    panels are black and face the sun, consequently they can therefore get very hot
    on a bright day. Certainly hot enough to fry an egg and definitely hot enough
    to burn skin.


    So sure your solar array is installed in a place where it cannot be touched by
    curious children. If the solar panels are close to the ground, make there is some
    protection to keep people away from it.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'The high temperatures become more of a problem if there is a fault within the
    solar array or with the wires running between solar panels. If a cable or a solar
    panel becomes damaged, there can be significant heat build-up. As already mentioned,
    this heat build-up can lead to a fire.


    A residual current device (RCD), otherwise known as a ground fault interrupter
    (GFI) should avert this problem, allowing you to investigate the issue before
    significant damage occurs. However, manual DC circuit breakers should also be
    installed to override the system in case of an emergency.


    # Think safety


    That is the end of the safety lecture for now. I will touch on safety again when
    we come to installation, but for now, remember that safety does not happen by
    accident. Consider the safety aspects when you are designing your system and you
    will end up with a safe system. The additional cost of a few AC and DC circuit
    breakers, an earthen rod/ grounding rod, an RCD/GFI and getting the right cables
    is not going to break the bank. It is money well worth spending.


    # Solar array design


    All solar panels in an array must face in the same direction. This ensures each
    cell receives the same amount of light, which is important for optimum power production.


    Sometimes, you may want to install solar panels in different locations, such as
    on two different pitches of roof. In this instance, you need to keep the two banks
    of solar panels separate, running them as two separate arrays, either by feeding
    them into an inverter or controller that can handle more than one solar input,
    or by feeding them into two separate inverters or controllers.


    If you wish to mix and match different sizes of solar panel, you will also need
    to set these up in separate arrays and wire these separately, either using an
    inverter or controller that can handle more than one solar input, or two separate
    inverters or controllers.


    If you are designing a grid-tie system, where you are considering different sizes
    or orientations of solar panels, you should seriously consider a micro-'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'inverter system where each solar panel has its own inverter.


    # Solar array design – stand-alone systems


    If you have more than one solar panel and you are running your solar electric
    system at 12 volts, then you will need to wire your panels together in parallel
    to increase your capacity without increasing the overall voltage, or use a solar
    charge controller that can accept a much higher input voltage and drop the voltage
    to match the battery.


    If you are running your battery pack at higher voltages, you either need to buy
    higher-voltage solar panels, or you will need more than one solar panel, wired
    in series to increase the voltage of the solar panels to the voltage of your overall
    system:


    +   - For a 24-volt battery system, you have the choice of using 24-volt solar
    panels, or two 12-volt solar panels connected in series

    - For a 48-volt battery system, you can use one 48-volt solar panel, two 24-volt
    solar panels connected in series, or four 12-volt solar panels connected in series


    Once you have reached the voltage that you want, you can then run the panels both
    in series and in parallel, connecting strings of panels together in series to
    reach your desired voltage, and then connecting multiple strings in parallel to
    increase your capacity:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_127_0.png)


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_127_1.png)'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'A sample diagram of a 24-volt array where two sets of two 12-volt solar panels
    are connected in series to create a 24-volt array and the two arrays are then
    connected in parallel to create a more powerful 24-volt array.


    # Solar array design – grid-tie systems with micro-inverters


    If you are designing a grid-tie system using micro-inverters, your design is extremely
    simple. Each solar panel becomes a self-sufficient solar energy system, each feeding
    power into its own micro-inverter. The micro-inverters convert the energy to AC
    and feed it into the main AC circuit.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_128_0.png)


    # Solar array design – grid-tie systems with a single inverter


    If you are designing a grid-tie system with a single inverter, you will typically
    be connecting all your solar panels in series and then feeding this high-voltage
    DC power into an inverter.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_128_1.png)


    A simplified block diagram of a typical grid-tie system using a single inverter.
    The residual current device (RCD) provides ground fault protection. In the United
    States, RCD is known as a ground fault interrupter (GFI)'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Because of the very high DC voltages involved, additional safeguards are necessary.
    The solar array must always be grounded, there must be a DC circuit breaker (also
    known as an isolation switch) installed between the solar array and the inverter
    and there must be a DC residual current device/ground fault interrupter installed
    to shut down the solar array in the case of a short circuit.


    In the diagram below, there are sixteen 250Wp solar panels connected in series.
    This is a fairly typical installation for a residential property, creating a 4kWp
    system. Assuming each solar panel produces a 24-volt output, this system will
    run at a nominal 384 volts, with a peak power in the region of 640 volts and an
    open circuit voltage of up to 832 volts.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_130_0.png)


    Above: A sample block diagram for a grid-tie system


    This system would be legal in Europe, but breaks building regulations in the United
    States which disallows any system that has the potential to run at over 600V.
    Consequently, this system would more typically be installed with'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'the solar array split into two smaller strings and running with a grid-tie
    inverter capable of accepting two separate solar inputs.


    In Europe, voltages of up to 1,000V are allowed. However, the dangers of such
    high voltages means that even in Europe, it is common practice to split solar
    arrays to reduce voltages down to 500-600V where possible. In general, this means
    that you will not want to connect more than twenty 12-volt solar panels or ten
    24-volt solar panels in series, to ensure that you stay well below this level.


    If you are running close to the 600V limit in the United States or 1,000V limit
    in Europe, there are three options:


    +   - Install a multi-string system, using either an inverter that handles more
    than one solar feed, or by using two separate inverters

    - Install a micro-inverter system

    - Wire your solar panels in a parallel/series hybrid


    For more information about open circuit voltages, refer back to page 124. To recap
    on multi-string systems, refer back to the section on Multiple strings on page
    127.


    # Batteries


    Batteries are wired in a similar way to your solar array. You can wire multiple
    12-volt batteries in parallel to build a 12-volt system with higher energy capacity,
    or you can wire multiple batteries in series to build a higher-voltage system.


    When wiring batteries together in parallel, it is important to wire them up so
    that you take the positive connection off the first battery in the bank and the
    negative connection off the last battery in the bank.


    This ensures equal energy drain and charging across the entire battery bank. If
    you use the same battery in the bank for negative and positive connections to
    the controller and inverter, you drain this first battery faster than the rest
    of the batteries in the bank. The first battery also gets the biggest recharge
    from the solar array.


    This shortens the life of the battery and means all the batteries in the bank
    end up out of balance. Other batteries in the bank never get fully charged by'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'the solar array, as the first battery will report being fully charged first
    and the controller will then switch the power off rather than continuing to charge
    the rest of the batteries in the bank. The result is that the batteries end up
    with a shorter lifespan.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_132_0.png)


    How to wire batteries in parallel: the diagram on the left, where power feed for
    both positive and negative is taken off the first battery in the bank, shows how
    *not* to do it – it will lead to poor battery performance and premature battery
    failure. The diagram on the right, where the positive feed is taken off the first
    battery in the bank and the negative feed is taken off the last battery in the
    bank, is **correct** and will lead to a more balanced system with a significantly
    longer life.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'As discussed on the chapter on site surveys, the location of your batteries
    needs to fit the following criteria:


    +   * Water- and weather-proof

    * Not affected by direct sunlight

    * Insulated to protect against extremes of temperature

    * Facilities to ventilate gases (specifically with regards to lead acid batteries)

    * Protected from sources of ignition

    * Because of the extremely high potential currents involved with lead acid batteries,
    the batteries must be in a secure area away from children and pets.


    You need to ensure that your batteries are accessible for regular checks and maintenance.
    Many deep-cycle batteries require watering several times each year and connections
    must be checked regularly to ensure they have not corroded.


    If you are installing batteries inside, batteries are often mounted on heavy-duty
    racking, which is then made secure using an open-mesh cage, or in a dedicated
    battery box.


    If you are installing your batteries in an area that can get very cold or very
    hot, you should also insulate your batteries. Most batteries perform at their
    best between 15-28°C (59-77°F). Very few batteries will work at all below 0°C
    (32°F) or above 45°C (113°F). Extreme temperatures adversely affect the performance
    of batteries, so if your batteries are likely to be in an area where the temperature
    drops below 8°C (46°F) or rise above 30°C (86°F), you should consider providing
    insulation. If the temperature is likely to drop below freezing, you must provide
    it.


    Both the process of charging and discharging a battery generates a certain amount
    of heat, which means that for most applications where the batteries are in use
    for most of the time, extreme cold is not such a big issue. Ensuring batteries
    are not placed on a cold concrete floor (a wood base is much warmer) can make
    a big difference to winter performance. Likewise, if you are designing a system
    that is rarely used in the depths of winter, ensuring the batteries remain above
    0°C (32°F) is not such a big issue as the low temperatures are unlikely to cause
    permanent damage to the batteries.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'Excessive heat in the height of summer is more of an issue. For this reason,
    placing batteries in a loft or roof-space is not always a good idea as these areas
    can easily reach 50–60°C (122–140°F), even in relatively cool climates, unless
    air extraction is built into the roof space to keep temperatures under control.
    Installing batteries into a dedicated battery box, or into a garage, is a far
    better solution.


    Creating an insulated environment for batteries helps with both extremes of temperature.
    You can use polystyrene (Styrofoam) sheets underneath and around the sides of
    the batteries to keep them insulated. Alternately, foiled bubble-wrap insulation
    (available from any DIY store in the insulation section) is even easier to use
    and has the benefit that it does not disintegrate if you ever get battery acid
    splashed on it.


    Never insulate the top of the batteries, as this will stop them from venting properly
    and may cause shorts in the batteries if the insulating material you use is conductive.


    If you are using batteries that can vent hydrogen, you need to create a design
    that allows the hydrogen to escape. Hydrogen rises rapidly from the batteries
    and can easily get trapped in a roof-space where it can become dangerous if it
    can build up. As mentioned in the section on Venting Hydrogen from Lead Acid batteries
    on page 154, you need to ensure that hydrogen can vent safely out of a building,
    and fit hydrogen alarms in a roof space above a battery pack inside a building.


    # Controller


    A controller will have connections to the solar array, to the battery bank and
    to DC loads. Although controllers tend not to have the same heat problems as inverters,
    they can get warm in. Make sure they are installed in an area with good ventilation
    around them and in a location where they can be easily checked.


    # Inverter


    Where an inverter is used in a stand-alone or grid fallback system, it is connected
    directly to the battery bank and not through the controller.


    Make sure that you design your system so that the inverter is in a well-ventilated
    area, as they can generate a fair amount of heat. Most inverters are'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'around 97% efficient, with the extra 3% lost in heat. Whilst this may not sound
    a lot, it can add up if the inverter is boxed in: a 4kW inverter can easily generate
    120W of heat per hour when running at peak performance in the summer. Over the
    period of a few hours, this can easily be enough to cause the inverter to overheat
    and shut down.


    Consider the weight of the inverter. Also ensure that it is installed in a location
    where it can be easily checked. Most inverters incorporate a small display that
    allows you to monitor system performance.


    # Devices


    Devices are connected to the inverter if they require grid-level voltage, or to
    the controller if they are low-voltage DC devices. They are never connected directly
    to the solar array or the batteries.


    # Specific for a grid fallback system


    Because a grid fallback system usually does not connect your solar energy system
    to the grid, you are less restricted to the components you can use.


    You must still adhere to wiring legislation for your country. In some countries
    (such as the United Kingdom, for instance) this can mean having the final connection
    into your building electricity supplied by a fully qualified electrician, but
    this is significantly cheaper than having a grid-tie system installed and inspected.


    The design for a grid fallback system is very similar to a stand-alone solar system,
    i.e. solar panels, solar controller and batteries. The only difference is what
    happens after the batteries. The advantage of a grid fallback system is that it
    can work in three ways. It can provide power for an entire building, it can provide
    power for specific circuits within a building or it can provide power for a single
    circuit within a building.


    More information and a sample circuit diagram for grid fallback configurations
    are shown in Appendix B.


    # Circuit protection


    Circuit protection is required in any system to ensure the system shuts down safely
    in the event of a short circuit. It is as valid on low-voltage systems as'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'it is on high-voltage systems.


    A low-voltage system can cause major problems simply because of the huge current
    that a 12-volt battery can generate. A deep-cycle lead acid battery can produce
    more than 1,000 amps in a short burst, which can easily cause a severe shock and
    even death or serious injury in some cases.


    In the case of a short circuit, your wiring will get extremely hot and start melting
    within seconds unless suitable protection has been fitted. This can cause fire
    or burns, and necessary protection should be fitted to ensure that no damage to
    the system occurs as a result of an accidental short circuit.


    # Earthing (grounding)


    In all systems, the negative terminal on the battery should be adequately earthed
    (referred to as grounded in North America). If there is no suitable earth available,
    a grounding rod or ground plane should be installed.


    # DC circuit protection


    For very small systems generating less than 100 watts of power, the fuse built
    into the controller will normally be sufficient for basic circuit protection,
    although an external fuse is generally recommended. In a larger system, where
    feed for DC devices does not go through a controller, a fuse should be incorporated
    on the battery positive terminal.


    Where you fit a fuse to the battery, you must ensure that all current from the
    battery must pass through that terminal. In DC systems with multiple circuits,
    it is advisable to fit fuses to each of these. If you are using 12 volts or 24
    volts, you can use the same fuses and circuit breakers as you would for normal
    domestic power circuits. For higher-voltage DC systems, you must use special DC
    fuses.


    When connecting devices to your DC circuits, you do not need to include a separate
    earth (ground) for each device, as the negative is already earthed at the batteries.


    Fit an isolation switch (DC disconnect switch) between your solar array and your
    inverter or controller. Fit a second isolation switch between your batteries and
    your controller and inverter. Unless your controller or inverter already incorporates
    one, you should fit a DC residual current device/'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'ground fault interrupter between your solar array and your controller or inverter.


    # AC circuit protection


    AC circuits should be fed through a distribution panel (otherwise known as a consumer
    unit). This distribution panel should be earthed (grounded) and should incorporate
    an earth leakage trip with a residual current device (RCD), otherwise known as
    a ground fault interrupter.


    As you will have earthed your DC components, you must use a separate earth (ground)
    for AC circuits. You must also install an AC disconnect switch (isolation switch)
    between your inverter and your distribution panel. In the case of a grid-tie system,
    this is normally a legal requirement, but it is a good practice anyway.


    The wiring in the building should follow normal wiring practices. You should use
    a qualified electrician for installing and signing off all grid-level voltage
    work.


    # Cable sizing and selection


    Once you have your wiring diagram, it is worth making notes on cable lengths for
    each part of the diagram, and making notes on what cables you will use for each
    part of the installation.


    # Sizing your cables


    This section is repeated from the previous chapter. I make no apologies for this,
    as cable sizing is one of the biggest mistakes that people make when installing
    a solar electric system.


    Low-voltage systems lose a significant amount of power through cabling. This is
    because currents (amps) are higher to make up for the lack of voltage. Ohms tells
    us that the power lost through the cable is proportional to the square of the
    current: the higher the current, the greater the energy loss. To overcome this
    energy loss, we must either increase the voltage or use thicker cables.


    Wherever you are using low-voltage cabling (from the solar array to the controller,
    and to all low-voltage DC equipment) you need to ensure you are'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'using the correct size of cable. If the cable size is too small, you will get
    a significant voltage drop that can cause your system to fail. Your cables can
    also get hot, and in extreme cases, could melt or start a fire. Never use smaller
    cable, as this could cause some of your devices not to work properly.


    # Protecting cable runs


    When planning cable layouts, you need to ensure they are protected from unwanted
    attention from animals and children and from possible vandalism.


    Rats and foxes chewing through cable insulation can be a big problem in some installations.
    This can be resolved by using rodent protecting cabling. Using conduit is often
    a good idea as well, especially if you can use steel conduit or thin-wall electrical
    metallic tubing (EMT) to protect cables.


    # Designing your system to keep your cable runs as short as possible


    If you have multiple devices running in different physical areas, you can have
    multiple cable runs running in parallel to keep the cable runs as short as possible,
    rather than extending the length of one cable to run across areas.


    By doing this, you achieve two things. Firstly, you are reducing the overall length
    of each cable and secondly, you are splitting the load between more than one circuit.
    The benefit of doing this is that you can reduce the thickness of each cable required,
    which can make installation easier.


    If you are doing this in a house, you can use a distribution panel (otherwise
    known as a consumer unit) for creating each circuit.


    In the holiday home, for instance, it would make sense to run the upstairs lighting
    on a different circuit to the downstairs lighting. Likewise, it would make sense
    to run separate circuits for powering appliances upstairs and downstairs.


    In the case of the holiday home, by increasing the number of circuits it becomes
    possible to use standard 2.5mm domestic ‘twin and earth’ cable for wiring the
    house, rather than more specialist cables. Not only does this simplify the installation,
    it keeps costs down.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Selecting solar cable


    A common fault with poorly-designed or poorly-installed solar energy systems is
    under-performance where there is no clear source for the problem. In particular,
    this tends to occur around two to three years after the system was first installed.


    The source of the problem is often either bird droppings or UV damage on cables
    leading from the solar panels to the inverters. This is usually caused by not
    using solar interconnection cables, which have a much tougher insulation that
    is UV protected, designed to withstand high temperatures and can withstand acidic
    bird droppings.


    It is vital that you use specific solar interconnection cable to connect your
    solar panels together and for linking your solar panels to your inverter or controller.
    If you are not sure, look for cable that conforms to the UL 4703 or UL 854 (USE-2)
    specification for PV cabling. This is available from all solar equipment suppliers.


    # Controller cable


    When calculating the thickness of cable to go between the controller and the battery,
    you need to take the current flow into the battery from the solar array as well
    as the flow out of it (peak flow into the battery is normally much higher than
    flow out).


    # Battery interconnection cables


    You can buy interconnection cables with the correct battery terminal connectors
    from your battery supplier. Because the flow of current between batteries can
    be very significant indeed, I tend to use the thickest interconnection cables
    I can buy for connection between batteries.


    # Some example designs


    As ever, a picture can be worth a thousand words, so here are some basic designs
    and diagrams to help you give a clearer understanding of how you connect a solar
    electric system together.


    # The Garden Shed'
  merge: -1
  pgno: 139
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_140_0.png)


    The first example is a very simple solar installation: a small solar panel, light
    with light switch, and a simple intruder alarm – perfect for a beach hut, garden
    shed or a small lock-up garage. A system like this could be put together for under
    £80 or $100. Because it is a small system, you may choose not to fit an isolation
    switch, although it is a good idea to do so. Because the system is very small,
    I have decided only to fit a fuse between the controller and the battery.


    # The electric riverboat


    This is a project that I made around fifteen years ago from a lightweight boat
    with tiny cabin. Electric boats are terrific on the river – they’re quiet enough
    not to disturb the wildlife whenever you get up close. Thanks to the torque from
    the motor, you only need a very small motor, with a 200W motor giving similar
    performance to a 2-3hp outboard. I used an ammeter for a rev counter, allowing
    me to drive economically or on full power, and at the time I used a voltmeter
    as a rudimentary fuel gauge. If I were doing the same build today, I would use
    a proper battery monitor as the fuel usage, as this would be far more accurate
    and cost a similar amount to a voltmeter.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_141_0.png)


    # # Small off-grid building


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_141_1.png)


    Now we have a more complex build, that would be suitable for a small building
    with a 1-2kW peak power draw and a 3-4kWh battery storage. We’ve connected four
    solar panels in parallel, connected to a combined inverter/controller that handles
    the solar input, the battery management, and the AC power generation.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'The batteries are connected in parallel. Notice that the negative and positive
    connections from the battery to the inverter/controller are taken from opposite
    ends of the battery pack. This ensures the current pull on the batteries is balanced
    across the entire pack and significantly extends the life of the batteries.


    There is both manual and automatic circuit protection at every stage:


    +   * There is a DC Ground Fault Interrup/RCD between the solar panels and the
    inverter/controller.

    * A fuse provides over-current protection for the batteries.

    * The distribution panel will contain circuit breakers and GFI/RCD protection
    on individual circuits.

    * The solar panels, batteries, controller, ground fault interrupter, and distribution
    panel are all connected to a common earth/ground point.

    * There are manual shut-off switches for the solar array, the batteries and between
    the inverter and distribution panel.


    When you are getting to this size of system, it is time to call in the professionals.
    A professional electrician will be required to oversee the whole installation
    to ensure safety. As soon as a solar energy system is mounted to a building other
    than a garden shed, or incorporates an inverter, there are legal requirements
    for installation that must be adhered to.


    # # The Holiday Home


    Finally, here is the wiring diagram for the holiday home. We have four solar panels,
    connected in series of two, to create a 24V input into our controller.


    The batteries are also connected in two parallel banks with two batteries in each
    bank.


    As with the previous example, there is both manual and automatic circuit protection
    at each stage:


    +   * There is a DC Ground Fault Interrup/RCD between the solar panels and the
    inverter/controller.

    * A fuse provides over-current protection for the batteries.

    * There is a second DC Ground Fault Interrup/RCD between the controller and the
    distribution panel.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   - The distribution panel has DC circuit breakers on individual circuits
    to provide over-current protection. As this system is a low voltage DC system,
    rather than AC, specialist circuit breakers are required within the distribution
    panel.


    +   - The solar panels, batteries, distribution panel and ground fault interrupters
    are all connected to a common earth/ground point.


    +   - There are manual shut-off switches for the solar array, the batteries and
    between the controller and the distribution panel.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_143_0.png)'
  merge: -1
