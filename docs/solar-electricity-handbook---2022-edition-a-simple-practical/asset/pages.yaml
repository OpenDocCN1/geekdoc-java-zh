  md: '# Why choose to consider solar electric system?


    There are many reasons to installing a solar electric system:


    +   * Where there is no other source of electrical power available, or where the
    cost of installing conventional electrical power is too high.

    * Where other sources of electrical power are not reliable. For example, when
    power cuts are an issue and a solar system can act as a cost-effective contingency.

    * When a solar electric system is the most convenient and safest option. For example,
    installing low voltage solar lighting in a garden or providing courtesy lighting
    in a remote location.

    * When you can become entirely self sufficient with your own electrical power.

    * When you want a mobile power source – such as in a caravan, travel trailer,
    recreational vehicle or boat.

    * When there is sufficient financial incentive in electricity being purchased
    from your electricity supplier to justify the investment.

    * Once installed, solar power provides virtually free without damaging the environment.


    # Cost-justifying solar


    The true cost of installing a solar electric system depends on various factors:


    +   * The power of the sun at your location at different times of the year.

    * How much energy do you need to generate?

    * How good is your site for capuring sunlight?


    Despite the huge drop in prices over the past ten years, solar electric systems
    can have a higher capital cost than some others. For example, a small generator
    will be cheaper to buy than an equivalent solar panel, a controller, and inverter.
    However, when considering the running costs, solar invariably wins out. To make
    a comparison with alternative power sources, you will sometimes need to calculate
    a payback of costs over time to justify the initial cost of a solar electric system.


    On all best of installations, you will need to carry out a survey on your site
    and carry out some of the design work before you can ascertain the total cost
    of installing a photovoltaic system. Do not panic, as this is frightening as it
    is. It is not difficult; I cover it in detail in later chapters. Then you can
    use this to put together a cost-justification on your project to compare with
    the alternatives.


    # Solar power and wind power


    Small-scale wind turbines have a reputation for being inefficient and poor electricity
    generators. While this is to an extent, the real issue with wind power is extremely
    difficult to harness effectively, and almost impossible to do so in-city and urban
    environments. Their bad reputation comes from bad installations in the wind environment
    rather than the turbines themselves.


    Wind power generation is extremely site specific. At ground rarely produces power
    as it is broken by its surroundings: buildings, trees and even the ground. To
    get real power, you need to be above turbulent air and free-flowing air above
    the ground. This free-flowing air, known as laminar, is the source of power that
    can be tapped to generate electricity.


    For a wind turbine, you must mount them at height, so the blades can cut through
    the laminar air. Generally, this means the bottom of the blade should be at least
    10m (32 feet) higher than its surroundings in an area away from buildings or tall
    trees, and from busy roads.


    You also need good wind speeds. Wind turbines may spin but not generate any electricity
    in a light breeze. You usually need a wind speed of 5m/s (just 10 knots or 11mph)
    to get a wind turbine to generate power. There are various wind speed databases
    on the web where you can enter your location and find the average wind speeds
    for your area, broken by month.


    If you live on a windswept farm or close to the coast, and you can mount a wind
    turbine 10-15m (32-48 feet) higher than any nearby buildings or trees, a wind
    turbine may work for you. If you live in a build-up area or close'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'trees or main roads, or you cannot mount the turbine at height, a wind turbine
    is unsuitable.


    If you want to see the power of the wind yourself, fly a kite. Getting the kite
    off the ground into the air is tricky – the kite doesn''t want to fly, moves slowly
    through the air, and easily crashes. Get the kite higher up into the laminar layer
    as it soars and swings with flies. In a clear field, a kite will usually start
    performing when it is around 10m (32 feet). If you are close to trees or buildings,
    you will have to fly much higher than those trees or buildings to get the same
    effect. A lightweight kite cannot capture enough power from the wind to fly to
    rooftop height, what chance does wind turbine have?


    Be wary of about ''special'' wind turbines that claim to generate power in turbulent
    air. The turbines themselves spin, but the raw material (i.e., power in the wind)
    simply does not exist and therefore there is little power to generate electricity.
    The claims are usually unsubstantiated with no real-world evidence to demonstrate
    they generate usable amounts of electricity.


    There are many examples of misselling and badly designed systems: a few before
    writing this edition of the book, I visited a good friend who had installed a
    wind turbine on the side of her house. In six months of production, the system
    had produced 3.5KWh of electricity – insufficient to even power its own controller
    system.


    In the right environment, and when by a reliable installer, wind turbines can
    be a good alternative to solar, arguably their best when implemented together
    with a solar system. A small wind turbine can generate electricity in a breeze,
    both day and night, and generates more energy in the Winter and Spring when solar
    generation. Consequently, wind turbines and solar panels can complement each other
    well in the right application.


    # Generators


    Off-grid power can be relied upon throughout the year, many people combine solar
    with batteries, and a generator to provide back-up power, particularly during
    the winter months. When running a diesel or petrol generator may not be the most
    environmentally friendly form of power generation, when used to supplement solar,
    they can be both cost-effective and a reliable source of power. Furthermore, the
    generator set up be optimized to recharge batteries as well as provide instantaneous
    power, the generator can be tuned to run at its peak performance settings, running
    for short periods of time and generating power as efficiently as possible.


    # Fuel cells


    As an alternative to generators, fuel cells can be a good way to supplement energy,
    especially for electric projects that require additional power in the winter months,
    when solar energy is at a premium.


    A fuel cell works like a generator. It uses a fuel mixture such as methanol, hydrogen,
    or zinc to create electricity. Fuel cells create electricity through chemical
    reactions rather than burning fuel. These chemical reactions are far carbon-efficient
    than a generator. They are extremely quiet, although rarely completely silent,
    and produce water as their output. This makes them suitable for indoor use with
    little or no ventilation.


    Unfortunately, fuel cells are expensive to buy and run and are therefore still
    a niche application for the time being. It is generally accepted that the costs
    for fuel cells are likely to drop tenfold now and 2035. If this happens, fuel
    cells will be a comparable cost to generators today.


    # Solar electricity and the environment


    Emissions and the environmental impact of power generation is high on the agenda
    of all nations. Since the COP21 Climate Summit held in Paris during December 2015,
    countries are committed to hitting its targets. And despite President Trump’s
    most recent changes of policy, the world remains largely untouched in its commitment
    to improving our environment. To achieve these goals, there must be a shift away
    from traditional power generation towards greener energy production.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The energy industry is responding. China is building and installing two grid-scale
    wind turbines per hour, the United Kingdom is shutting down its coal-fired power
    stations ahead of schedule and many countries have committed to eradicating fossil
    fuels from their power mix over the next five years.


    No power generation is entirely environmentally friendly. Hydro-electric power
    stations have an impact on water resources and impacts local wildlife. Wind turbines
    account for bird deaths every year. Building hydro, wind or solar equipment has
    a carbon footprint that must be accounted for. Yet this environmental impact is
    a tiny fraction of the carbon footprint with more traditional power generation
    technologies.


    Once installed, a solar electricity system is a low-carbon electricity generator.
    The sunlight is free and the system maintenance is extremely low. A there carbon
    footprint has been quite high, mainly due to the relatively small volumes of panels
    being manufactured and the chemicals required for the “doping” of the silicon
    in panels.


    Thanks to improved manufacturing techniques and higher volumes, the carbon footprint
    of solar panels is much lower. You can easily offset the carbon footprint of building
    solar panels by the energy generated within one and two years, or with the very
    latest thin-film solar panels can recoup their carbon footprint in as little as
    six months.


    Therefore, a solar electricity system that can run a complete stand-alone system
    can reduce your carbon footprint, compared to taking the same power from the grid.


    The same is true of grid-tie solar. In the past, power companies have struggled
    to integrate renewable energy into the mix of power generation sources. This means
    while the energy produced by solar panels was non polluting, it did not necessarily
    mean there was an equivalent drop in carbon production at a coal or gas-fired
    station.


    That is no longer the case. Power companies have become better at predicting weather
    conditions in advance and tuning the general mix of generators to take advantage
    of renewable energy sources. This has ensured a genuine carbon reduction in our
    energy mix.


    Of course, the warmer the climate, the greater benefit energy consumption tends
    to occur on sunny days as people try to keep cool with air conditioning. In peak,
    electricity demand occurs at the same time as peak energy production from a solar
    array, and a grid-tie solar system can be a perfect fit.


    If you live in a climate with less sunshine, the peak energy demand often occurs
    in the evening, but if you want to maximize the carbon benefit of installing a
    solar system, you should try to achieve the following:


    +   - Use the power you generate for yourself

    - Use energy for high load applications such as clothes washing

    - Reduce your power consumption from the grid during times of peak demand

    - Store some of the solar energy production using batteries and use it in the
    evening


    # Environmental efficiency: comparing supply and demand


    There is an online calculator to map your electricity usage over a period and
    compare it with the amount of sunlight available. Designed specifically for grid-tie,
    this calculator shows how a fit solar energy is in terms of supply and demand.


    While this online calculator is not a substitute for a detailed electrical usage
    survey and research into the exact source of the electricity supplied to you at
    your location, it will give you a indication of the likely environmental performance
    of a solar energy system.


    To use this online calculator, collate information about your electricity usage
    for each month of the year. You usually find this information on your electricity
    bill or by accessing your electricity account online. Visit www.SolarElectricityHandbook.com,
    follow the links to the Grid-Tie Solar Calculator in the Online Calculators section.'
