  md: '# A Final Word


    It is twenty-five years since I built my first solar energy system. Since then,
    I have not always been working with solar technology full time, but it is a technology
    I come back to time and time again in my role as a technology developer, and my
    enthusiasm for solar is as strong now as it has always been.


    Solar electric power is an excellent and practical resource. It can be harnessed
    relatively easily and effectively. It inspires people and is making a huge contribution
    to transforming lives around the world.


    From an enthusiast''s perspective, designing and building a solar electric system
    from scratch is interesting, educational and fun. If you are tempted to have a
    go, start with something small like a shed light, and feel free to experiment
    with different ideas.


    If you are a professional architect or builder, you should now have a clear idea
    of how solar energy can be used in your projects, along with its benefits and
    its drawbacks.


    There is a wow-factor about connecting a solar panel to a light bulb for the first
    time and watching it light up. Even though you know it is going to work, there
    is something almost magical about watching a system that generates electricity
    seemingly from thin air!


    Teaching children about solar electricity is also fun. There are small solar powered
    kits suitable for children. These can be assembled by little fingers and they
    teach the fundamentals of electricity and solar power in a fun and interesting
    way.


    Solar is making the seemingly impossible possible for the first time. In 2011
    and 2012, I was involved in a project to provide solar power to remote villages
    in Africa, providing a reliable source of electricity for lighting, communications
    and the ability to store medication safely at chilled temperatures. We installed
    systems in Ethiopia, Uganda and the Sudan. Total cost for all the equipment for
    an entire Kenya wide system is less than $2,000. It is a tiny cost for revolutionizing
    an entire village.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'In 2014, my solar project was working on a solar electric delivery van for
    use in big cities. The prototype vehicle was so efficient it provided a solar-only
    range of around 15 miles (25km) in dull overcast winter conditions in London,
    or up to over 100 miles of solar range in California on a summer day. More recently,
    I led a research and development team developing solar battery systems and the
    next generation of solar panels. Our product Battery LITE became selling solar
    battery system in the United Kingdom. Today, I am working on battery storage systems
    as a way of rapidly charging electric vehicles. Again, solar is an integral part
    of our new system. Solar technology is constantly evolving and improving. It is
    an exciting industry to be a part of.


    If I have inspired you to do something with solar energy yourself, then it has
    served its purpose. I wish you the very best for your project.


    All the best


    Michael Boxwell

    January, 2022'
  merge: -1
  pgno: 198
