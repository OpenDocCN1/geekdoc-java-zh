- img_proc: true
  md: '# Understanding the Components


    Once you have completed your site survey, you know how much power you need to
    generate, the suitability of your site and approximately how much it is going
    to cost you. You now need to look at the different technologies and products that
    are available, to see what best suits you and your application.


    Your choice of components and the design of your system will depend on whether
    you are designing a stand-alone system (which also includes grid fallback and
    grid failover systems), or a grid-tie system that exports energy to the grid.


    Because there are differences in the design of stand-alone and grid-tie systems,
    I have split this into four chapters. The first chapter looks at components that
    are common to both grid-tie systems and stand-alone systems. The next chapter
    looks specifically at what you require for grid-tie systems. The third chapter
    looks specifically at stand-alone systems and systems that incorporate their own
    battery store, while the fourth chapter looks at the component certification and
    regulations you need to take into account when selecting solar energy equipment.


    # How to use these chapters


    These three chapters will go into much more detail about the different options
    available to you. There is an extensive choice of solar panels, batteries, controllers,
    inverters and cables.


    These chapters explain the technology in a lot more detail, so you can go and
    talk sensibly to suppliers and understand what they are saying.


    # Common components for all systems


    Core to all solar energy systems are the solar panels themselves. Most panels
    can be used for either grid-tie or stand-alone, and although recently many manufacturers
    have released higher-voltage solar panels designed specifically for grid-tie applications,
    the criteria for choosing one solar panel over another remains the same.


    # Solar panels


    There are three technologies used for producing solar panels. Each has its set
    of benefits and disadvantages.


    For the purpose of this handbook, I am ignoring the expensive cells used on satellites
    and in research laboratories and focusing on the photovoltaic panels that are
    commercially available at reasonable cost.


    # Amorphous solar panels


    The cheapest solar technology is amorphous solar panels, also known as thin-film
    solar panels.


    These panels have had bad reputation in the past, with poor product reliability
    and questionable lifespan. This has often been down to the chemicals used in older
    designs of panel breaking under extremes of temperature over a period of a few
    years, or the poor quality of materials used in the production of cheap panels.


    Thankfully, this technology has matured significantly over the past few years
    and amorphous solar is now regarded as highly reliable, with significant benefits
    over traditional solar panels. Big manufacturers such as Sanyo and Sharp now manufacture
    high-quality amorphous solar panels, along with some exceptionally good specialist
    manufacturers such as Solar Frontier and Uni-Solar. Some manufacturers now offer
    a ten or twenty-year warranty on amorphous panels.


    On paper, amorphous solar panels are the least-efficient panels available, converting
    around 6-8% of available sunlight to electricity. This means you need twice as
    much space available for installing solar panels compared to crystalline panels.


    However, amorphous panels are good at generating power even on overcast and extremely
    dull days. In general, they are far better in extreme temperature conditions,
    with significantly less power loss at higher temperatures'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'than other solar panel technologies.


    Unlike other solar panel technologies, amorphous solar panels provide excellent
    performance when partially shaded. Whilst a best-case scenario is to eliminate
    shading whenever and wherever possible, amorphous panels continue to operate at
    a high level of efficiency even part of the array is in shade.


    Amorphous panels can also be manufactured into a shape or mounted on a curved
    surface. They can be made to hard-wearing to be fitted onto surfaces that can
    be walked on. A few solar manufacturers have started manufacturing solar roof
    tiles (or shingles), so new-build houses can incorporate solar into the structure
    of the roof.


    This combination makes amorphous panels suitable for integration into consumer
    products such as mobile phones and laptop computers, such as the roof of an RV
    or caravan, where the manufacturer has no control over where the products are
    placed or how they are used.


    Amorphous panels are the cheapest panels and several manufacturers are now screen-printing
    low-cost amorphous solar films. Between 2008 and 2013, amorphous solar panels
    dropped by around 30% each year. While the prices are dropping more slowly, the
    success of amorphous panels has been a big factor of dividing the costs of the
    entire industry.


    Because of their efficiency, amorphous solar panel has to be much larger than
    the equivalent polycrystalline solar panels. As a result, amorphous solar panels
    can only be used where there is no size restriction on the solar array or where
    the overall power requirement is low.


    In terms of environmental impact, amorphous panels tend to have a much lower carbon
    footprint of production, compared to other solar panels. A typical carbon payback
    for an amorphous solar panel would be in the region of 12–30 months.


    Most amorphous solar panels have comparatively low power outputs. These panels
    can work for smaller installations of up to 300-watt outputs, but not so for larger
    installations where numbers of panels will be required and the additional expense
    in mounting and wiring adding these panels starts to outweigh their cost advantage.


    Consequently, amorphous solar panels are often suited to OEM applications, as
    an energy built into a manufactured product, or for large-scale commercial installations
    where the panels are incorporated into the structure of a roof-space on a new
    building.


    Some of the most exciting advances in solar technologies over the past three years
    have come from amorphous technology. Products as diverse as mobile phones, laptop
    computers, clothing and roofing materials all have amorphous solar panels built
    into them. An exciting technology, amorphous solar is going to get better and
    better over the coming years.


    # Polycrystalline solar panels


    Polycrystalline solar panels are made from multiple solar cells, each made from
    silicon crystals. They are far more efficient than amorphous solar panels in direct
    sunlight, with efficiency levels of 12–17%.


    Consequently, polycrystalline solar panels are often around one-third of the size
    of an equivalent amorphous panel, which can make them easier to fit in many installations.


    Polycrystalline solar panels often come with a 25-year performance warranty and
    a life expectancy of longer. Commercial solar panels only became available in
    the mid-1970s and many of these panels are still perfectly functional and in use
    to today.


    The manufacturing process for polycrystalline solar cells is complex. As a result,
    polycrystalline solar panels are expensive to purchase, costing around 15% more
    than amorphous solar. The environmental impact of production is also higher than
    amorphous panels, with a typical carbon payback of 2–5 years.


    Polycrystalline solar cells are dark and are typically produced with either a
    white or silver frame. This makes it difficult to blend the panels into their
    surroundings, which can be an issue for some applications.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Prices for polycrystalline solar panels are dropping, thanks to the increase
    in manufacturing capacity over the past few years and the increasing popularity
    for larger screen televisions, which use the same specification glass. Between
    2007 and 2014, prices dropped by roughly 25-30% in 2015 and 2016, prices dropped
    a further 10-15%. Since they have stayed relatively static and are expected to
    remain at their current level for the next few years.


    # Monocrystalline solar panels


    Monocrystalline solar panels are made from multiple smaller solar cells, each
    made from a single wafer of silicon crystal. These are among the most efficient
    panels available today, with efficiency of 15-20%.


    Monocrystalline solar panels have the same characteristics as polycrystalline
    solar panels. Because of their efficiencies, they are the smallest panels (per
    watt) available. The cells themselves are a uniform black and produced with a
    black frame. They have a smarter appearance than the polycrystalline panels and
    are very popular with homeowners.


    Monocrystalline solar panels are the most expensive solar panels to manufacture
    and therefore to. However, the prices are still competitive, costing around 10%
    more than the equivalent polycrystalline solar panels.


    # Hybrid solar panels


    Hybrid solar panels provide efficiency of 18–22% in optimum conditions, but really
    benefit from optimal conditions where the real world performance can be 10-20%
    better than other solar panels.


    The downside is price. Price-wise, hybrid solar panels are expensive, around twice
    the price of monocrystalline panels. Unless space is such a prism that the price
    difference can be justified, hybrid solar panels are usually ruled out on economic
    grounds.


    # Solar Panel sizes and power outputs


    Individual amorphous solar panels usually have a power output between 5Wp and
    100Wp. A 100Wp solar panel will measure around 150cm x 100cm (60 x 40 inches).


    Polycrystalline and monocrystalline solar panels have higher power outputs. The
    smallest panels tend to have a power output of 20Wp, while the largest will typically
    have a power output around 350-400Wp.


    The commonly used crystalline panels tend to be the 250Wp panels, which measure
    approximately 160cm x 100cm (64 x 40 inches). The reason this size has become
    popular is that it is proved to be the most cost effective to manufacture: larger
    panels require more complex glass manufacturing capabilities, whilst smallest
    panels have low cost savings to manufacture. Consequently, the cheapest for most
    applications are 250Wp polycrystalline or monocrystalline panels, often costing
    around as much as a 280-300Wp.


    # Which solar panel technology is best?


    For most applications, monocrystalline panels offer the best solution, with reasonable
    value for money, compact size, good overall performance and smart appearance.


    Amorphous panels can be a good choice for smaller installations where space is
    not an issue. They are usually not practical for generating more than 100-300
    watts of power because of their overall size, unless you have an extremely large
    area that you can cover with solar panels.


    # What to look for when choosing a solar panel


    Not all solar panels are created equal, and it is worth buying a quality branded
    product over an unbranded one. Cheaper, unbranded solar panels may not live up
    to your expectations, especially when collecting energy on cloudy days.'
