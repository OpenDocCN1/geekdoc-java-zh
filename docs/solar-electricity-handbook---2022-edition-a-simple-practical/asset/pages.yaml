    - In several States of the United States, including California, there are tax
    rebates for solar energy, whether they are installed for residential, commercial
    or agricultural purposes. There are also rebates for solar installations for low-income
    families and for multi-family housing projects. The exact detail of these schemes
    does vary between counties and states.

    - There are lots of grants and financial incentives offered at state and country
    level. Check the online Database of State Incentives for Renewables and Efficiency
    (dsireusa.org) for more information.


    # ## United Kingdom


    +   - The United Kingdom Rural Development Programme introduced a new programme
