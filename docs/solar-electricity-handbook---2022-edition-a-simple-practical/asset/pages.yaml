    \ across the sky for different times of the year. The blue line path at the top\
    \ of the chart shows the path of the sun at the height of summer (summer solstice),\
    \ while the blue line path at the bottom of the chart shows the path of the sun\
    \ at the depths of winter (winter solstice).\n are a number of sources for sun\
    \ charts. In the United Kingdom, the Microgeneration Certificate Scheme publish\
    \ a sun chart that must be used if you are planning to install a system that can\
