  md: '# # Four Solar PV Configurations


    There are four different configurations you can choose from when creating a solar
    electricity installation. These are stand-alone (sometimes referred to as off-grid),
    grid-tie, grid-tie with power backup (also known as grid interactive) and grid
    fallback. Here is a brief introduction to these different configurations:


    # ## Stand-alone/off-grid


    Until ten years ago, stand-alone solar photovoltaic installations were the most
    popular type of solar installation. Solar photovoltaics were originally created
    for this purpose, providing power at a location where there is no other source
    of power.


    Whether providing a light shed, providing power for a pocket computer, powering
    an off-grid home or providing electricity to an entire village in Africa, stand-alone
    systems fundamentally all work in the same way. The solar panel generates power,
    the energy is stored in a battery and used as required.


    Stand-alone systems can be a very cost-effective way of generating electricity,
    particularly when the overall electricity demand is comparatively low. Care must
    be made when designing a stand-alone system to ensure that there is enough energy
    through the system: a system works well in the summer months and fails to work
    in the winter of life unless


    Almost everyone can benefit from a stand-alone solar system for something, even
    if it is as mundane as providing an outside light somewhere. If you are planning
    on something much bigger and grand, it is often a good idea to start with a very
    small and simple stand-alone system first. Learn the basics and then progress
    from there


    # ## Examples of simple stand-alone systems


    +   * Vending machines


    ByBox is a manufacturer of electronic lockers, typically situated at shopping
    malls and food services and used for delivering parcels to be collected by customers.


    One of the biggest issues with electronic lockers has been finding suitable locations
    to place them where a power source is available. ByBox overcame this issue by
    building an electronic locker with a solar roof to provide permanent power to
    the locker.


    The solar roof provides power to a set of batteries inside the locker. When not
    in use, the locker itself is in standby mode, consuming minimal power. When a
    customer wishes to use the locker, they press the START button


    The benefit to ByBox is twofold. Firstly, they can install a locker bank in any
    location, without any dependence on a power supply. Secondly, the cost of solar
    panels and controllers is often less than the cost of installing a separate electricity
    supply, even if there is one nearby


    # ## Recreational vehicles


    Recreational vehicles and caravanning are on the increase, and solar energy is
    changing the way people spend their free time.


    In the past, RV owners stayed on camp sites with access to electricity and other
    facilities. RVs become more luxurious, people now choosing to travel to more remote
    locations and live entirely ‘off-grid’, using solar energy to provide electricity
    everywhere. Solar provides all the comforts of home, whilst holidaymakers the
    freedom to stay wherever they want.


    # ## Grid-tie


    Grid-tie is now hugely popular in Europe, North America and Australia. This is
    due to the availability of grants to reduce the installation costs, the ability
    to earn money through feed-in tariffs and the opportunity to sell electricity'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'back into the electricity companies, as explained in the chapter on Cost-justifying
    solar starting on page 17.


    In a grid-tie, your home runs on solar power during the day. Any surplus energy
    that you produce is then fed into the grid. In the evenings and night, you buy
    power from the electricity companies in the usual way.


    The benefit of grid-tie solar installations is they reduce your reliance on the
    electricity companies, ensure more of your electricity is produced in an environmentally
    efficient way and save money on buying electricity.


    One disadvantage of most grid-tie systems is if there is a power cut, your solar
    array is also cut. By itself, you do not have additional energy security by installing
    a grid-tie solar system.


    Grid-tie can work well in hot, sunny climates, where power demand for electricity
    from the grid often coincides with the sun shining, to the high power demand of
    air conditioning units. Grid-tie also works where the owners use the most of the
    powers themselves


    # An example of a grid-tie system


    Si Gelatos is a Florida-based ice-cream producer. They installed their solar factory
    roof in 2007 to offset the energy used in running freezers


    "Running industrial freezers is extremely expensive and consumes a lot of power,"
    Dan Foster of Si Gelatos. "We could not hope to generate all our power from solar,
    but we felt it important to reduce our overall power demand and allow us to do
    that."


    Cold storage facilities consume most of their power during the day in the summer,
    when solar is running at its peak. Since installing solar power, Si Gelatos has
    seen its overall energy consumption drop by 40% and now takes hardly any power
    from the utility during peak times


    "Solar has three things for our business," says Dan. "Firstly, it is a very visible
    sign for our staff that we are serious about the environment. In this turn has
    made our employees aware that they need to do their bit by making lights and energy
    are switched off when they are not needed. It shows our customers for the environment,
    which has been good for goods and sales. Thirdly, and most importantly, we''re
    genuinely making a real contribution to the environment, reducing our electricity
    demand at the time of day when everyone else''s demand for electricity is as high."


    # Grid-tie with power backup (grid interactive)


    Grid-tie with power backup – also known as a grid interactive system combines
    a grid-tie installation with a bank of batteries.


    As grid-tie, the concept is to use your power from solar when the sun shines and
    sell to the power companies. Unlike a standard grid-tie system, however, a battery
    provides contingency for power cuts so you can continue to use power from your
    system.


    Typically, you would set up circuits within your building that will continue to
    receive power during a power outage. This ensures essential power remains available
    for running lights, refrigeration and heating controllers, while whilst is not
    wasted on nonessential items like televisions and radios.


    While the grid is available, a grid-interactive system is configured to provide
    power to the whole house, the solar and batteries providing much of the power
    and the supplement when needed.


    If there is potential for power to be lost for several days, it is also possible
    to design a system to incorporate other power generators into a grid interactive
    system, such as a generator. This would allow a grid interactive system to work
    as a highly efficient uninterruptible power supply (UPS) for extended periods
    of time.


    The cost of a grid-tie system with power backup is higher than a standard grid-tie
    system, because of the additional cost of batteries and battery controllers. Typically,
    having power backup will add 35–50% of additional costs over a standard grid-tie
    system if using lithium batteries, or between 20–25% of additional costs if using
    lead acid batteries.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'As with normal grid-tie systems, it is possible to surplus power back to the
    utility companies in some countries, allowing you to earn an income from your
    solar energy system.


    There is ever growing number of off-the-shelf grid-tie battery systems now becoming
    available, the Tesla Powerwall home battery being the most well known. Most battery
    systems for residential use can store between four and six kilowatt-hours of energy.


    # An example of a grid interactive system


    Grid interactive systems are gaining popularity with rural farms in the United
    Kingdom, where even short power blackouts can cause significant disruption.


    Traditionally, farmers have counted on using this to provide light and power.
    However, between 2009 and 2011, when the UK Government offered large incentives
    for installing solar power, many farmers fitted grid interactive systems onto
    their buildings, providing them with an income by selling electricity to the electricity
    utility companies and giving them backup power in case of a power blackout.


    The additional cost of installing a grid interactive system over a standard grid-tie
    system is more than offset by low running costs and ease of use. Farmers do not
    need to buy and run generators, and the system is almost maintenance-free. This
    is a big contrast with generator systems, which need to be tested and regularly
    to ensure they are working effectively.


    # Grid fallback


    With a grid fallback system, the solar arrays generate power which turn charge
    a battery bank. Energy is taken from the battery and run power one or more circuits.
    When the batteries are depleted, the system switches back to the grid supply until
    the batteries can be recharged by the solar array.


    The advantage of grid fallback systems is that they mean that specific circuits
    can be run entirely from solar, only switching back to the grid when the batteries
    are depleted. In many cases, this never happens, and you have the benefit of an
    off-grid system with the added confidence that the grid is as a backup. The disadvantage
    of grid fallback systems is if the circuits are overloaded and the fallback system
    cannot cope with the whole load, they switch out completely so that all the power
    comes from the grid until the power demand is demanded.


    Grid fallback systems used to be one of my preferred solutions for small solar
    energy systems where overall demand for energy was low and installation costs
    were a primary concern. However, as costs for grid-interactive systems continue
    to fall, the benefits of the grid interactive systems make grid-fallback systems
    less attractive.


    # An example of a grid fallback system


    Commercial battery storage systems for grid-tie solar installations tend to be
    expensive. Systems like the Tesla Powerwall allow with solar already installed
    on their homes to incorporate battery storage in their existing systems, but at
    a significant cost.


    At of 2015, I was asked to design a battery storage system that was significantly
    cheaper than existing designs, focusing on providing customer savings through
    powering the lighting circuits in home. The resulting design, called Battery LITE,
    stores energy from the solar panels each day to provide all the lighting needs
    for a large home.


    Designed to work with an existing grid-tie system or to be included as part of
    a new installation, Battery LITE allows residential PV customers to use their
    solar energy to provide free lighting both day and night on top of their existing
    benefits.


    The system proved to be an outstanding success, saving customers significant money
    on their existing electricity bills. It became the best-selling battery system
    in the United Kingdom in its first year of sales.


    # Grid failover


    You can configure a grid fallback system as a grid failover system.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Grid failover system kicks in when there is a power failure from your main
    electricity supply. In effect, it is an uninterruptible power supply, generating
    its power from solar energy.


    The benefit of this configuration is that if you have a power cut, you have contingency
    power. The disadvantage of this configuration is that you are not using power
    for your day-to-day use.


    Although in Europe and America, grid failover systems used to be more common in
    countries where power failures are commonplace. In Africa and in many parts of
    Asia, grid failover systems reduce the reliance on generators for lighting and
    basic needs.


    However, in most cases, customers have found that a grid failback or grid interactive
    system is more suitable for their needs. I am aware of two grid failover systems
    that have been installed in the past. Both have since been reconfigured as grid
    failback systems.


    # Grid-type systems from stand-alone


    Stand-alone and smaller grid failback systems run at low voltages, typically between
    12 and 48 volts. This is because batteries are low-voltage units and building
    a stand-alone system at a low voltage is a simple, flexible and safe approach.


    Gridsystems tend to be larger installations, often generating several kilowatts
    of electricity each hour. The electricity is required as a high-voltage supply,
    it is more efficient to connect multiple solar panels together to produce a high
    voltage circuit, rather than use an inverter to step up the voltage. This high-voltage
    DC power is converted into an AC power by a grid-tie inverter.


    Grid-tie systems link multiple solar panels together to produce a solar array
    of several hundred volts before running to the inverter, or have a small inverter
    connected to each panel to create a high-voltage AC supply from each panel.


    The benefit of high voltage is efficiency. There is less power loss running high-voltage,
    low-current electricity through cables than


    smaller stand-alone battery-based systems, low-voltage is the best solution, as
    the battery banks tend to work as low-voltage stores. For grid-tie systems where
    energy is not stored in a battery bank, the higher-voltage systems are the best
    solution. For grid-tie with battery storage, most systems create a hybrid with
    high-voltage power generation from the solar panels and a low or medium-voltage
    battery system. Neither approach is inherently ''better'', it all depends on the
    type of system you are designing.


    # In conclusion


    +   - Solar can be used in many ways and for applications.

    - Stand-alone systems are the simplest and easiest to understand. They tend to
    be comparatively small systems, providing where no power source is easily available.

    - With grid-tie, your solar system generates electricity that is then used normally.
    Any excess electricity is produced onto the grid.

    - Grid-tie power (also known as grid interactive) provides you with the benefits
    of a grid-tie system with the added benefit that power remains available even
    if electricity is cut off.

    - Grid failback systems often have more common in stand-alone systems than grid-tie
    systems. In design they are very similar to stand-alone systems, with an inverter
    running from a bank of batteries and an automatic transfer switch to switch power
    between the solar energy system and the grid power supply.

    - Grid failover systems are relatively rare. They are most used to provide uninterruptible
    power supplies using solar as the backup source.

    - Grid-tie systems have a different design to stand-alone systems. They tend to
    be higher-voltage systems, whereas stand-alone systems run at lower voltages.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# PV System Components


    Before I get into the detail about planning and designing solar electric systems,
    it is worth describing all the different components of a system and explaining
    how they fit together. Once you read this chapter, you will have a reasonable
    grasp of how a solar energy system fits together. I will not go into too much
    detail at this stage, simply providing an overview for now. The detail can come
    later.


    # Solar panels


    The heart of a solar electric system is the solar panel itself. There are various
    types of solar panel, which I describe later.


    Solar panels, or more accurately, *photovoltaic* panels, generate electricity
    from the sun. The more powerful the sun''s energy, the more power you get, although
    solar panels continue to generate small amounts of electricity in the shade. Most
    solar panels are made up of individual solar cells connected together. A typical
    solar cell will only produce half a volt, so by connecting them in series inside
    the panel, a useful voltage is achieved.


    Most small solar panels — rated 150Wp or below — are rated as 12-volt solar panels,
    whilst larger solar panels are 24-volt panels. A 12-volt solar panel produces
    14–18 volts when put under load. This allows a single panel to charge up a 12-volt
    battery. Incidentallyally, if you connect a voltmeter to a solar panel when it
    is not under load, you may see voltage readings of up to 26 volts. This is normal
    in an ''open circuit'' on a solar panel. As soon as you connect the panel into
    circuit, this voltage level will drop to 14–18 volts.


    Solar panels can be linked together to create a solar array. Connecting multiple
    panels allows you to produce a higher current or run at a higher voltage:


    +   - Connecting panels in series makes an array at higher voltages. Typically,
    12, 24 or 48 volts in a standalone-system, several hundred volts in a grid-tie
    system

    - Connecting panels in *parallel* allows a solar array to produce more power while
    maintaining the same voltage as the individual panels

    - When you connect multiple panels together, the power of the overall system increases,
    irrespective of whether they are connected in series or in parallel


    In a solar array where the solar panels are connected in series (as shown in the
    diagram below), you add the voltages of each panel together and add the wattage
    of each panel together to calculate the maximum amount of power and voltage the
    solar array will generate.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_28_0.png)


    A solar array made of four solar panels connected in series. If each individual
    panel is rated as a 12-volt, 12-watt panel, this solar array would be rated as
    a 48-volt, 48-watt array with a'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1 amp current.


    In a solar array where the panels are connected in parallel (as shown in the diagram
    below), you take the average voltage of all the solar panels and you add the wattage
    of each panel to calculate the maximum amount of the solar array will generate.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_29_0.png)


    A solar array made of four solar panels connected in parallel. With each panel
    rated as a 12-volt, 12-watt panel, this solar array would be rated as a 12-volt,
    48-watt array with a 4 amp current.


    I will go into more detail later about choosing the correct voltage for your system.


    # Batteries


    Solar panels rarely power electrical equipment. This is because the amount of
    power the solar array collects varies depending on the strength of the sun. This
    makes the power source too variable for most electrical equipment to cope with.


    If you are storing your energy, this energy is stored in batteries. As well as
    allowing flexibility as to when you use your energy, the batteries provide a constant
    power source for your electrical equipment.


    There are different battery technologies available for solar energy storage. Traditionally,
    ''deep cycle'' acid batteries have been used. These batteries look like car batteries
    but have a different internal design. This design allows them to be heavily discharged
    and recharged several hundred times over. More recently, lithium-ion batteries
    have become more popular than thanks to their longer life and better performance.


    Most lead acid batteries are 6-volt or 12-volt batteries, whilst lithium-ion battery
    modules are typically 12-volt or 24-volt. Like solar panels, these can be connected
    to form a larger battery bank. Like solar panels, multiple batteries used in series
    increase the capacity and the voltage of a battery bank. Multiple batteries connected
    in parallel increase the capacity while keeping the voltage the same.


    Lead acid battery systems have the benefit of simplicity, safety and price. They
    are robust and can be adapted to most applications. Lithium-ion batteries are
    vastly more volatile and expensive and require significantly better control to
    keep them safe. Typically lithium-ion battery systems designed for solar are pre-configured
    by the manufacturer to a specific capacity and performance. These systems provide
    a safe way of storing energy but may limit you in how you use the battery storage.


    Both types of batteries are discussed in much greater detail in later chapters
    of the book.


    # Controller


    If you are using batteries, your solar electric system is going to require a controller
    to manage the flow of electricity (the current) into and out of the battery.


    If your system overcharges the batteries, this will damage and eventually destroy
    them. Likewise, if your system completely discharges the batteries, this will
    rapidly deplete destroy them. A solar controller prevents this from happening.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'There are a few instances where a small solar electric system does not require
    a controller. An example of this is a small ''battery top-up'' solar panel that
    is used to keep a car battery in peak condition when the car is not being used.
    These solar panels are too small to damage the battery when the battery is fully
    charged.


    In other cases a solar electric system will require a controller to manage the
    charge and discharge of batteries and keep them in good condition.


    # # Inverter


    The electricity generated by a solar electric system is direct current (DC). Electricity
    from the grid is high-voltage alternating current (AC).


    If you are planning to run equipment that runs from grid-voltage electricity from
    your solar electric system, you may need an inverter to convert the DC to AC and
    convert the voltage to the same voltage as you get from the grid.


    There are two options for an inverter: you can have one central inverter in your
    solar system, either connecting directly to the solar array in a grid-tie system
    or to the battery pack in an off-grid system. Alternatively, you can have a ''micro
    inverter'' where each panel has its own inverter and a separate inverter controller
    manages all the different inverters in your system to provide a harmonized high
    voltage output.


    Solar panels with micro-inverters are typically used with grid-tie systems and
    are not suitable for systems with battery backup. For grid-tie systems, they offer
    significant benefits over the more traditional ''big box'' inverter, although
    the up-front cost is higher.


    Inverters are a big subject all on them. I will come to describe them in much
    more detail later in the book.


    # # Electrical devices


    The final element of your solar electric system are the devices you plan to power.
    Theoretically, anything that you can power with electricity can be powered by
    solar. However, many electrical devices are very hungry, making them running on
    solar very expensive.


    Of course, this may not be so of an issue if you are installing a grid-tie system.
    If you have energyintensive appliances that you use for short periods, the impact
    to your system is low. In comparison, running high-power appliances on an off-grid
    system means you must have a more powerful off-grid solar energy system to cope
    with the peak demand.


    # # Low-voltage devices


    Most off-grid solar systems run at low voltages. Unless you are planning a pure
    grid-tie installation, you may wish to consider running at least some of your
    devices directly from your DC supply rather than through an inverter. This has
    the benefit of greater efficiency.


    Thanks to caravans and boating communities, lots of equipment is available to
    run from a 12-volt or 24-volt supply. Light bulbs, refrigerators, ovens, kettles,
    toasters, coffee machines, hairdryers, vacuum cleaners, televisions, radios, air
    conditioning units, washing machines and laptop computers are all available to
    run on 12volt or 24-volt power.


    In addition, to the recent uptake in solar installations, specialist manufacturers
    are building ultralowenergy appliances, such as refrigerators, freezers and washing
    machines, specifically for people installing solar and wind turbine systems.


    You can charge most portable items such as MP3 players and mobile phones from
    a 12-volt supply, either directly, or by using a step-down transformer.


    # # Grid-voltage devices'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'If running everything at low voltage is not an option, or if you are using
    a grid-tie system, you use an inverter to run your electrical devices.


    # Connecting everything together


    A stand-alone system


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_31_0.png)


    The simplified block diagram above shows a simple stand-alone solar electric system.
    Whilst the detail will vary, this design forms the basis of most stand-alone systems
    and is typical of the installations you will find in recreational vehicles, caravans,
    boats and buildings that do not have a conventional power supply.


    This design provides both low-voltage DC power for running smaller electrical
    devices and appliances such as laptop computers and lighting, plus a higher-voltage
    AC supply for running larger devices such as larger televisions and kitchen appliances.


    In this diagram, the arrows show the flow of current. The solar panels provide
    the energy, which is fed into the solar controller. The solar controller charges
    the batteries. The controller also supplies power to the low-voltage devices,
    using either the solar panels or the batteries as the source of this power.


    The AC inverter takes its power directly from the battery and provides the grid-voltage
    AC power supply.


    # A grid-tie system using a single central inverter'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_32_0.png)


    The simplified block diagram shows a simple grid-tie system, typical of the type
    installed in many homes today. The solar panels are connected to the grid-tie
    inverter, which feeds the energy into the main supply. Electricity can be used
    by devices in the building or fed back onto the grid, depending on demand.


    The grid-tie inverter monitors the power feed from the grid. If it detects a power
    cut, it also cuts power from the solar panels to ensure that no energy is fed
    back onto the grid.


    The solar meter records how much energy is generated by the solar panels. The
    grid-tie meter monitors how much energy is taken from the grid. Some grid tie
    meters also record how much is fed back into the grid using the solar energy system.


    # grid-tie system using multiple micro-inverters


    A grid-tie system using micro-inverters is similar to the one above, except that
    each solar panel is connected to its own inverter, and the inverters themselves
    are daisy-chained together, converting the low-voltage DC power from each solar
    panel into a grid-voltage AC power supply.'
  merge: -1
