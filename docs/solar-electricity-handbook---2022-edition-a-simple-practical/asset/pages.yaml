    One year later, oil prices more than doubled to $45, increased to $58 per barrel
    by the time I came to the 2018 edition of this book, and $85 per barrel one year
    later.


    During the early stage of the COVID-19 pandemic, oil prices collapsed after nation
    went into lockdown. At one-point, oil prices dropped below zero as producers were
    unable to find storage facilities for their products.


    Right now, in 2022, oil prices are trading around $74 – from $51 a year ago but
    fluctuated between $38 and $102 in the past quarter alone. As ever, oil remains
    highly volatile, and the ongoing pandemic is destabilizing more than ever. The
    changes in oil prices makes and breaks economies, with countries like Russia and
    Saudi Arabia on an economic knife-edge to fluctuate oil prices. It is you and
    me who pick the bill.


    Most countries recognize the problem of price instability and have implemented
    renewable energy schemes to reduce our reliance on fossil fuels. Yet this comes
    at a price. Investment in new power stations and technologies for energy production
    is expensive. Many countries, including the United Kingdom, Australia, and the
    United States, have faced changes and suffered from decades of under investment
    into new technologies. This is now changing, the costs for these changes are huge
    and reflected in the price we are paying for our energy.


    In the United Kingdom, average consumer gas and electricity prices today are three
    times higher than were ten years ago and are predicted to rise a further 50% in
    the next few months. Most energy experts predict above-inflation rises for the
    next decade or more as the country phases out old coal-fired power station and
    replaces them with new power sources. In the United States, energy prices for
    the home has almost doubled over the same period. New taxes for average electricity
    consumption in states such as Alabama, Texas and'
