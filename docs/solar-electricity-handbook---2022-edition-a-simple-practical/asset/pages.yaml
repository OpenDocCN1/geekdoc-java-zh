- img_proc: true
  md: '# The next step


    Once you have your wiring diagram, it is time to start adding cables, battery
    terminal clamps, fuses, isolation switches, earthing rods (referred to as grounding
    rods in North America) and, in this case, a distribution panel (otherwise known
    as a consumer unit) to your shopping list. It can help to add more detail to your
    wiring diagram as well, noting the locations of appliances and sockets, and the
    lengths of cables at each point.


    # Solar frame mounting


    As discussed in the section in Solar panel mounting, starting on page 109, there
    are off-the-shelf solar array frames available, and your solar panel supplier
    will be able to advise you about your best solution.


    Sometimes, these are not suitable for your project. In this case, you will either
    fabricate something yourself (angle iron is a useful material for this job) or
    get a bespoke mounting specifically for you.


    Solar panels in themselves are not heavy, but you do need to consider the effect
    of wind loads on your mounting structure. If the wind can blow underneath the
    solar array it will generate a ‘lift’, attempting to pull the array off the framework.
    However, a gap beneath the solar array is useful to ensure the array itself does
    not get too hot. This is especially important in warm climates, where the efficiency
    of the solar panels themselves drops as they get hotter.


    Making the mounting is strong enough is especially important as the solar array
    itself is normally mounted at an optimal angle to capture the midday sun. This
    often means that, even if you are installing your solar array onto an existing
    roof, you may want to install the solar panels at a slightly different angle to
    the roof itself to get the best performance out of your system.


    It is therefore imperative that your solar array mounting frame is strong enough
    to survive 20 years plus in a harsh environment and can be secured


    If you are mounting your solar array on a roof, you must be certain that your
    roof is strong enough to take this. If you are not certain about this, ask a'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'builder, structural surveyor or architect to assess your roof.


    If you are planning to mount your solar array on a pole or on ground-mounted frame,
    you will need to make plans for some good strong foundations. Hammering some tent
    pegs into the ground to hold a ground-mounted frame will not last five minutes
    in a strong wind, and a pole will quickly blow down if you only use a bucket of
    cement to it in place.


    You should build a good foundation consisting of a strong concrete base on a compacted
    hardcore sub-base to hold a ground-mounted frame, and the frame itself should
    be anchored using suitable ground anchors, bolted using 25cm–30cm (10”–12”) bolts.


    For a pole, follow the advice given by the manufacturers. Typically, they need
    to be set in a concrete foundation that is at least 3 feet (1m) deep, and often
    quite significantly more.


    To mount your solar panels onto your frame, make use high-tensile bolts and self-locking
    nuts to prevent loosening due to wind vibration.


    If your solar array is going to be easily accessible, you may wish to consider
    an adjustable solar mounting system so you can adjust the tilt throughout the
    year. You can then capture more winter sun, and decrease the tilt during the spring
    and summer to improve performance during those seasons.


    For the holiday home project, the solar array is to be fitted to a specially constructed
    garden store with an angled roof. The benefit of this approach is that we can
    build the store at the optimum position to capture the sun. We can also install
    the batteries and solar controller very close to the solar array. In other words,
    we are creating an ‘all in one’ power station.


    There are many regional shed and garden building manufacturers who will build
    a garden store like this to your specification. A good quality store, as long
    as it is treated 2–3 years, will easily last 25–30 years.


    If you go this route, make sure your chosen manufacturer knows what you are planning
    to use it for. You need to specify the following things:


    +   - The angle of the roof must be accurate to have the solar panels in their
    optimum position'
  merge: -1
  pgno: 145
- img_proc: true
  md: '+   - The roof itself must be reinforced to be able to take the additional
    weight and potential wind lift of the solar array

    - The floor of the garden store (where the batteries are stored) must be made
    of wood. Batteries do not work well on a concrete base in winter

    - There must be ventilation built into the store to allow the hydrogen gas generated
    by the batteries to disperse safely through the top of the roof

    - The door to the garden store itself should be large enough for you to easily
    install, check and maintain the batteries

    - You should consider insulating the floor, walls and ceiling in the garden store,
    either using polystyrene (Styrofoam) sheets or loft insulation. This will help
    keep the batteries from getting too cold in winter or too hot in summer


    A garden store will still require a solid concrete foundation. Consideration of
    rainwater runoff is also important, to ensure the garden store does not end up
    standing in a pool of water.


    # Roof mounting solar PV


    Roof-mounting kits are available from solar panel suppliers. These are made of
    roof hooks that fit to the roof trusses underneath the tiles, to which mounting
    rails are attached. Typically two mounting rails are required for each row of
    solar panels. Clamps are then used to clamp the solar panels to the mounting rails.


    # Roof Hooks


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_146_0.png)


    To install solar panels onto an existing tiled roof, individual tiles are slid
    out and a roof hook is fitted beneath the tile, mounting directly onto the underlying
    roof truss. Once mounted, the original tile can be slid back into'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'position. Depending on the type of tile and the roof hook design, it may be
    necessary to chisel out part of the underside of the tile to achieve a good fit.


    # Mounting Rails


    Mounting rails are then fitted horizontally across the roof, bolted to the roof
    hooks using locking nuts to ensure they cannot work loose over time. Two rows
    of mounting rails are used to hold each row of solar panels.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_147_0.png)


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_147_1.png)


    # Solar Panel Clamps


    Solar Panel Clamps are then slid into place along the mounting rails. These are
    used to clamp the edges of each solar panel into position.


    These clamps are used to clamp the sides of the solar panels. When fitted between
    panels, they can clamp against two panels holding both in position. It is important
    to use the correct clamps that are specifically designed for solar installations:
    panels themselves are heavy and as they are mounted'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'above the roof, they are subject to buffeting and the risk of being lifted
    off the roof in stormy weather.


    Your solar panels are likely to be in place for decades, and the single biggest
    point of failure of roof mounted systems is usually found in using the wrong clamps
    to hold the solar panels in position. Solar panel clamps are sprung mounted to
    ensure they cannot work loose over time.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_148_0.png)


    Finally, the first solar panel can be fitted into position.


    Four clamps are used to hold a solar panel into position. However, each clamp
    can hold two solar panels down when the panels are next to each other.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_149_0.png)


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_149_1.png)


    # Planning the installation


    By now, you should have a complete shopping list for all the components you need.
    You should know where everything is to be positioned and what you need to to proceed.


    Before placing any equipment orders, go back to your site and check everything
    one last time. Make sure that where you planned to site your array, controller,
    batteries and so on is still suitable and that you have not overlooked anything.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'Once you are entirely satisfied that everything is right, place your orders
    for your equipment.


    Bear in mind that some specialist equipment is often only built to order and may
    not be available straight away. If you require bespoke items such as solar mounting
    frames, or as in the case of the holiday home, a complete garden store made up
    for mounting the solar panels and holding the batteries and controller, take into
    account that this could take a few weeks to be built for you.


    # In conclusion


    +   - The detailed design ensures you have not overlooked any area of the design


    +   - Consider the safety aspects of your system in your design. At each stage,
    ask yourself “What is the worst that can happen?” and then design around the problems


    +   - The wiring diagram helps you envisage how the installation will work


    +   - You need to keep cable runs as short as practically possible. You can do
    this by running several cables in parallel, either directly from the controller,
    through a junction box or through a distribution panel


    +   - Splitting the cables into parallel circuits also means you may reduce the
    current load on each circuit, thereby reducing resistance and improving the efficiency
    of your system


    +   - If you are using an inverter to grid-level voltages, a qualified electrician
    is required to handle the electrical installation. However, your wiring diagram
    will help your electrician to envisage how your solar electric system should work


    +   - You need to design your battery storage area to ensure your batteries can
    perform to the best of their ability'
  merge: -1
