  md: '# A Brief Introduction to Electricity


    Before we can start playing with solar power, we need to talk about electricity.
    To be more precise, we will need to talk about voltage, current, resistance, power
    and energy.


    Having these terms clear in your head will help you to understand your solar system.
    It will also give you confidence that you are doing the right thing when it comes
    to designing and installing your system.


    # Don''t panic


    If you have not looked at electric what do you think since you were learning physics
    at school, some of the principles of electricity can be a bit daunting to start.
    Do not worry if you do not fully grasp everything on your first read.


    There are few calculations that I show on the next pages, but I am not expecting
    to remember them all! Whenever I use these calculations later in the book, I show
    all my workings and, of course, you can refer to this chapter as you gain more
    knowledge on solar energy.


    Furthermore, the website that accompanies this book includes several online tools
    that you can use to work through most of the calculations involved in designing
    a solar electric system. You will not be spending hours with a slide-rule and
    re of paper working all out by yourself.


    # A brief introduction to electricity


    When you think of electricity, what do you think? Do you think of a battery that
    is storing electricity? Do you think of giant overhead pylons transporting electricity?
    Do you think of power stations that are generating electricity? Do you think of
    a device like a kettle or television or electric motor that is consuming electricity?


    The word electricity covers several physical effects, all of which are related
    but distinct from each other. These are electric charge, electric current, electric
    potential and electromagnetism.


    +   - An electric charge is a build-up of electrical energy. It is measured in
    coulombs. You can witness an electric charge in static electricity or in a lightning
    strike. A battery stores electric charge

    - An electric current is the flow of an electric, such as the flow of electricity
    through a cable. It is measured in amps

    - An electric potential refers to the potential difference in electrical energy
    between two points, such as the positive potential and the negative potential
    of a battery. It is measured in volts. The greater the electric potential (volts),
    the greater capacity work for the electricity has

    - Electromagnetism is the relationship between electricity and magnetism, which
    enables electrical energy to be generated from mechanical energy (such as in a
    generator) and enables mechanical energy to be generated from electrical energy
    (such as in an electric motor)


    # How to measure electricity


    Voltage refers to the potential difference between two points. A good example
    of this is an AA battery: the voltage is the difference between the positive terminal
    and the negative end of the battery. Voltage is measured in volts and has the
    symbol ''V''.


    Current is the flow of electrons in a circuit. Current is measured in amps (A)
    and has the symbol ''I''. If you check a power supply, it will typically show
    the current on the supply itself.


    Resistance is the opposition to an electric current in the material. Resistance
    is measured in ohms and has the symbol ''R''.


    Power measures the rate of energy conversion. It is measured in watts (W) and
    has the symbol ''P''. You will see watts when buying a kettle or vacuum cleaner:
    the higher wattage, the more the device consumes and the faster (hopefully) it
    does its job.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Energy refers to the capacity for work: power multiplied by time. Energy has
    the symbol ''E''. Energy is usually measured in joules (a joule equals one watt-second),
    but electrical energy is usually shown as watt-hours (Wh), or kilowatt-hours (kWh),
    where 1 kWh = 1000 Wh.


    # volts, amps, ohms, watts and watt-hours


    # Volts


    ```

    Current x Resistance = Volts

    I R = V

    ```


    Voltage is equal to current multiplied by resistance. This calculation is known
    as Ohm''s Law. With power calculations, you can express this calculation in different
    ways. If you know volts and current, you can calculate resistance. If you know
    volts and resistance, you can calculate current:


    ```

    Volts ÷ Resistance = Current

    V ÷ R = I

    Volts ÷ Current = Resistance

    V ÷ I = R

    ```


    # Power


    ```

    Volts x Current = Power

    V x I = P

    ```


    Power is volts multiplied by current and is measured in watts. A 12-volt circuit
    with a 4-amp current equals 48 watts of power (12 x 4 = 48).


    Based on this calculation, we can work out voltage if we know power and current,
    and current if we know volts and power:


    ```

    Power ÷ Current = Volts

    P ÷ I = V

    ```


    Example: A 48-watt motor with a 4-amp current is running at 12 volts.


    ```

    48 watts ÷ 4 amps = 12 volts

    Current = Power ÷ Volts

    I = P ÷ V

    ```


    Example: a 48-watt motor with a 12-volt supply requires a 4-amp current.


    ```

    48 watts ÷ 12 volts = 4 amps

    ```


    Power (watts) is also equal to the square of the current multiplied by the resistance:


    ```

    Current² x Resistance = Power

    P² x R = P

    ```


    # Energy


    Energy is a measurement of power over time. It shows how much power is used, or
    generated, by a device, typically over a period of an hour. In electrical systems,
    it is measured in watt-hours (Wh) and kilowatt-hours (kWh).'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'A device that uses 50 watts of power, an energy demand of 50Wh per hour. A
    solar panel that can generate 50 watts of power per hour, has an energy creation
    potential of 50Wh per hour.


    However, because solar energy generation is so variable, based on temperature,
    weather the time of day and so on, a watt-peak (Wp) rating is used specifically
    for solar systems. A watt-peak rating shows how much power can be generated by
    a solar panel at its peak rating. It has been introduced to highlight the fact
    that the amount of energy a solar panel can generate is variable and to remind
    that a solar panel rated at 50 watts is not going to be producing 50 watts of
    energy every hour of every single day.


    # Direct Current and Alternating Current


    Two types of current can flow through an electrical circuit. Direct Current is
    a constant flowing in one direction, moving from the high voltage (positive) power
    source to the low voltage (negative) power source. Batteries and solar panels
    work on direct circuits.


    Altern current is a stream of charges reverse direction rapidly. The current switches
    directions several times each second. This cycle of switching is called frequency
    and is measured in Hertz (Hz). The faster this cycle of switching, the higher
    the frequency. Grid electricity works on AC power. AC power in Europe cycles around
    fifty times a second (50 Hz), while in the United States, AC power cycles sixty
    times a second (60 Hz).


    # Low current and high current systems


    When we are designing systems, generally we want to keep the currents as low as
    possible. If we put too much current through a circuit, the energy lost by this
    current increases exponentially. This current heat and reduces the overall efficiency
    of the system. This resistance builds up over distance, which means that the higher
    the current, the more issues you have with power, particularly over a long cable
    run.


    For example, let us say that we have 12v, 200W solar panels that we wish to combine
    by a battery. We have the choice of connecting them in a series, to create a 24v,
    200-watt circuit, or connect them in parallel to create a 12v, 200-watt circuit:


    +   - A 12-volt 200W solar panel has a current flow of 8.3 amps (100 watts ÷ 12
    = 8.3 amps).

    - If we connect the two solar panels in series, the solar array has a current
    flow of 8.3 amps (200 watts ÷ 24 = 8.3 amps).

    - If we connect the two solar panels in parallel, the solar array has a current
    flow of 16.6 amps (200 watts ÷ 12 = 16.6 amps).


    It is better to double the voltage rather than double the current. Of course,
    there are exceptions to this rule. For instance, if you want to use your system
    for 12 volts, then you may decide to use thicker cables and keep cables to a minimum.
    This limit limits the overall size of your system, but this may not matter. So
    long as you are aware of the problems and design them, there is nothing wrong
    with this approach.


    # A word for non-electricians


    Realistically, if you are new to electrical systems, you should not be planning
    to install a big solar energy system yourself. If you want a low-voltage system
    to mount on the roof of a barn, garden shed or if you want to play with the technology
    and have some fun, then great, this book will tell you everything you need to
    know. However if your level of electrical knowledge is wiring a plug or replacing
    a fuse, you should not be thinking of physically wiring and installing a system
    yourself without learning about electrical systems and electrical safety first.


    Furthermore, if you are planning to install a solar system to the roof of a house,
    that in many countries, you will need to have electrical qualifications to carry
    out even simple household wiring and the work you'
