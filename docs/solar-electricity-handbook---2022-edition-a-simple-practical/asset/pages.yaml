  md: 'So long as they come from a reputable brand, second-hand solar panels are extremely
    good value for money and even old panels that are 25–30 years old still give many
    more years of useful service. Although good quality solar panels should provide
    at least 25 years service, nobody knows how much longer they will last. The early
    commercially available solar panels (which are now over forty years old) are still
    working effectively, typically working around 70% of their capacity.


    There are, a few points to look out for if you are considering second-hand solar
    PV panels:


    +   - Never buy a multi-meter with you test them outside to make sure you are
    getting a reasonable voltage and wattage rating

    - Check the panels and reject any with chipped or broken glass. Also reject any
    panels where the cells are themselves peeling away from the glass or have condensation
    between the glass and the solar cell

    - The efficiency of older solar PV is significantly lower around 5–6%, compared
    to 13-24% efficiency levels today. Ten ten years ago, the best solar panels were
    rated 10–12% efficiency. Consequently, a solar PV from the early 1980s is likely
    to be three times less efficient as an equivalent modern crystalline panel


    These second-hand panels will not have any of the safety certifications that you
    get with new solar panels. This may cause issues with building regulations or
    building insurance, if you are installing these as a part of a new solar installation.


    # Concentrated Photovoltaics and Solar Concentrators


    Concentrated Photovoltaics (CPV) technology uses Fresnel lenses and mirrors to
    concentrate a area of sunlight onto a smaller area of photovoltaic cells. They
    do this by refracting the light to concentrate it and increase the intensity of
    sunlight in a smaller area.


    By concentrating the sunlight into a smaller area and increasing the solar irradiance,
    significantly more energy can be captured by the solar panel, improving its efficiency
    quite immensely.


    However, there are problems with this technology. Specifically, the heat build-up
    is quite considerable and, in testing, many solar panels have been destroyed by
    the excessive heat generated by the concentrated sunlight. This is especially
    true of Fresnel lenses by enthusiastic amateurs.


    The panels need to be large and bulky. Due to the heat build-up, they also need
    to be very carefully mounted, with adequate ventilation over the panel.


    There are now a few solar concentrators on the market, but the technology has,
    and by large, been overtaken by the events. The logic behind their design was
    that solar panels were expensive and lenses and mirrors were cheap. The price
    of solar has dropped so much over the past few years, the economics for solar
    concentrators no longer add up.


    A few installations use mirrors or polished metal to reflect sunlight back onto
    solar panels and therefore increasing the solar irradiance. However, you must
    take care to ensure that the reflected light does not dazzle anyone.


    # Solar panel mountings


    You can choose to fabricate your own windings for your solar panels if you are
    planning a stand-alone system, but it is far more common to purchase the mountings
    at the same time as purchasing your solar panels. The main options for solar panels
    are roof mounting, frame mounting or pole mounting.


    # How are solar panels mounted to a frame


    Some solar panels – typically up to 40wp capacity – often incorporate plastic
    frames with holes for bolting the panels to the frame. Most solar panels, however,
    are clamped to a frame. The frame is typically made up of two mounting rails.
    Clamps are used to mount the solar panels to the rails. The rails in turn are
    mounted onto a roof using roof hooks, or part of a larger structure for ground
    mounting or for mounting on a pole.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'Self-locking nuts should be used to ensure the panels remain firmly clamped.
    Solar panels suffer from wind buffing over time, which can loosen bolts. Some
    frame clamps are designed to vibrate tighter with buffering, reducing the risk
    of panel damage over time.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_77_0.png)


    # Roof Mounting


    In a roof mounting system, the rails are mounted onto the roof using roof hooks.
    Roof hooks mount directly onto the roof trusses underneath the roof tiles. To
    install them, individual tiles are slid out from the roof and the roof hooks are
    mounted to the roof truss underneath. The tiles are then slid back into position.


    # Frame Mounting


    For ground mounting, or mounting onto a flat roof, solar panels are typically
    installed onto a freestanding frames, or on a mounted plastic tray.


    A freestanding frame can fit just one solar panel, or multiple panels together.
    The benefit of freestanding frames is that the angle of the solar panels can be
    adjusted for the location to make the best use of the sunlight. Some freestanding
    frames allow the angle of the solar panels to be adjusted throughout the year
    to get the best performance from the available sunlight. Freestanding frames need
    to be anchored to whatever they are mounted onto. Mounted on the ground frames
    are typically mounted onto concrete foundations, whereas they are mounted onto
    a flat roof, mounting bolts are often required to penetrate the roof. The mountings
    must be fairly substantial to counter wind buffeting that can lift the panels
    if not securely bolted.


    Molded plastic trays are often much easier to install than freestanding frames.
    The solar panels are mounted onto the trays and the trays are weighed down with
    ballast – usually in the form of bags of sand. This has the benefit that you do
    not need to mount the solar panels to a building, speeding up the installation
    process. The trays are moulded for particular angles and you buy the plastic tray
    that best suits your application.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_77_1.png)'
