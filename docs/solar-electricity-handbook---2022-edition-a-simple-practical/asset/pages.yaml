  md: 'If you are planning to do the physical installation yourself, a solar electric
    system consisting of solar array, controller and tie-breaker costs £1.50–£2.50
    (£2–3.50 US) per watt, +/- 15%.


    A grid-tie system is cheaper to install than a stand-alone system, as you do not
    need to budget for batteries. You will, however, need a qualified electrician
    to certify the system before use. In most countries, you will also need all the
    components used in your solar system to be certified as suitable for grid installation.
    If you are planning grid-tie, budget £0.80–£1.50 (£1–$2 US) per watt, +/- 15%.


    For our holiday home, we need 320 watts of solar electricity if we tilt the panels
    towards the sun, or 456 watts if we mount the panels flat. Our rough estimate
    suggests a total system cost of £500–£800 (£650–£1050 US), +/- 15% for tilted
    panels, or £685–£1150 ($890–$1500 US) +/- 15% for a flat panel installation.


    If you remember, the cost to connect this holiday home to a conventional electricity
    supply was £4,500 ($7,200). Therefore, installing solar is the cheaper option
    for providing electricity for our home.


    # What if the figures do not add?


    In some installations, you will get to this stage and find out that a solar system
    is unsustainable. This is not uncommon. A wise is to calculate the viability of
    using 100% solar energy at an industrial unit once, and come up with a ballpark
    figure of £33m (around $54m).


    When this happens, you can do one of two ways: walk away, or go back to your original
    scope and see what can be changed.


    The best thing to do is to look at the original power analysis and see what you
    can make. Look at the efficiencies of the equipment you are using and see if you
    can make savings using lower-energy equipment or changing the way equipment is
    being used.


    If you are absolutely determined to implement a solar electric system, there is
    usually a way to do it. However, you may need to be ruthless with what you leave
    out.


    In the example of the industrial unit, the underlying requirement was to provide
    emergency lighting and power for a cluster of servers if there was a power cut.
    The cost for implementing this system was £32,500 ($52,000), which was comparable
    to installing and maintaining on-site energy generators and UPS equipment.


    # Working out dimensions


    Now we know the capacity of the solar panels, we can work out an approximate size
    of our solar array. This is extremely useful information to carry out our site
    survey as the solar panels must go somewhere. We need to be able to find enough
    space for where they will receive uninterrupted sunshine in a location.


    There are two main technologies of solar panels on the market, amorphous and crystalline.
    I will explain the characteristics and the advantages and disadvantages of each
    type.


    For the purposes of working out how much space you''re going to fit the solar
    panels, you need to know that a 1m² (approximately 9.9 square foot) amorphous
    solar panel generates 60 watts, whilst a 1m² crystalline panel generates in the
    region of 100 watts,


    Therefore, for our holiday home, we are looking for a location where we can fit
    5 and 7.6m² (49–75 square feet) of amorphous solar panels or 2–3m (20–29 square
    feet) of crystalline solar panels.


    # In conclusion


    +   - By calculating the amount of solar energy theoretically available at our
    site, we can calculate ballpark costs for our solar electric system

    - There are various inefficiencies that must be considered when planning your
    system. If you do not take these into account, your system may not generate enough
    power'
