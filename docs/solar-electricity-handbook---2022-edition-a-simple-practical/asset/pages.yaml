    \ this protractor to check the field of view, using the pencil as an 'aimer' to\
    \ measure the angle of nearby obstacles relative to your location.\n\nAbove: A\
    \ sun chart diagram, produced by the University of Oregon Solar Radiation Monitoring\
    \ Laboratory.\n\n![](img/8de3cfd6267fee6ad3673ab029eccca3_64_1.png)\n\nWhen stand\
    \ at the location where you are planning to install your solar panels. Use a compass\
    \ to identify magnetic south (magnetic North in the Southern Hemisphere). Then\
    \ working from east to west, identify any obstacles between 90% of south (i.e.\
    \ between 90° and 270°) on your compass. Measure the angle of the top of each\
    \ obstacle using your clinometer, and measure the width of the obstacle in degrees\
    \ using your compass."
  merge: -1
