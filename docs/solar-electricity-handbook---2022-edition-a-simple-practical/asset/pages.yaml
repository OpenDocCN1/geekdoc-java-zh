    # Shading issues on roofs


    Sometimes, roofs can have shading issues of their own. Chimneys, television aerials
    and satellite dishes or vents in the roof can either cause problems with fitting
    the solar panels or cast shade across the solar panels at different times of the
    day. Sometimes, these problems are easily resolved, moving an aerial is a relatively
    straightforward job, for example. However, if there is a chimney on the roof that
    is likely to cast a shadow across your solar panels, you will need to ensure enough
    space between your panels and the chimney to ensure that shadows are kept to absolute
    minimum.


    # Measuring the available roof-space


    You will need to measure and record the overall roof-space available for your
    solar array. There are various ways of doing this, but the easiest is to measure
    the footprint of the building at ground floor level, measure the height of the
    roof from within the attic space and then calculate the size of the roof from
    this


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_57_0.png)


    If your roof looks like the one above, you have a gabled roof, which is the easiest
    type to measure.

    From ground floor level, measure the length of the house (a) and the depth of
    the house (b).


    Now measure the height of the roof, from the bottom of the roof to the top (c).
    This is usually easiest to do within the building, going up into the attic space.


    You can now calculate the slope of the roof, using the following formula:


    ```

    slope = \sqrt{c^2 \times (1/2 \times b)^2}

    ```


    It is recommended that you use either inches or cm for your measurements. For
    example, if your house is 1000cm long and 500cm deep, and the height of your roofspace
    is 250cm, type this into your scientific calculator:'
  merge: -1
