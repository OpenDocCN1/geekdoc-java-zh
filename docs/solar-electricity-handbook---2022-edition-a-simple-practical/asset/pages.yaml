    # Temperature impact on solar performance in Austin, Texas during the summer months


    By way of example, here is a table for Austin in Texas. This shows average air
    temperatures for each month of the year, the estimated solar panel temperature
    for the hottest months of the year and the impact on the solar performance, assuming
    a coefficient of power rating of 0.5%.


    | Jan | Feb | Mar | Apr | May | Jun | Jul | Aug | Sep | Oct | Nov | Dec |

