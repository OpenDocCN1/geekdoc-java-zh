  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_33_0.png)


    # # In conclusion


    +   * There are various components that make up a solar electric system

    * Multiple solar panels can be joined together to create a more powerful solar
    array.

    * In a stand-alone system, the electricity is stored in batteries to provide an
    energy store and provide a more constant power source. A controller manages the
    batteries, ensuring the batteries do not get overcharged by the solar array and
    are not over-discharged by the devices taking current from them

    * An inverter takes the DC current from the solar energy system and converts it
    into a grid-voltage AC current that is suitable for running devices that require
    grid power

    * Generally, it is more efficient to use the electricity as a DC supply than an
    AC supply'
