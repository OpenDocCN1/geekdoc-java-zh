    # Additional Factors


    # Reducing the impact of fluctuating energy prices


    The world faces an energy crisis. Traditional forms of electricity production,
    using coal, oil or gas, are rising and many cases are now out of control. The
    cost to everyone is even bigger. Fossil fuel prices fluctuate uncertainty, and
    the security of our energy supplies is a constant fear, responsible for more wars
