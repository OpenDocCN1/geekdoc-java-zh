    The volatility in the market has proven difficult to predict. In 2016, oil prices
    were as little as $22 per barrel. Oil experts were predicting a cheap glut of
    oil for the rest of the decade. Industry analyses were predicting that oil would
    remain the cheapest form of energy for many years to come and share in solar companies
