    # Solar panels and shade'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'The biggest negative impact on solar energy production is shade. Even if only
    a very small amount of your solar array is in shade, the impact on the performance
    of your whole system can have a very big effect.


    Unlike thermal (hot water) systems, the loss of power through shading is much
    greater than the amount of the panel that is in shade. With solar thermal systems,
    if 5% of the panel is in shade, you lose 5% of the power production.


    Depending on the exact circumstances, if only 5% of a photovoltaic solar panel
    is in shade, it is possible to lose 50-80% of power production from your entire
    solar array.


    For this reason, it is highly important that your solar system remains out of
    shade throughout the day wherever possible. Sometimes this is not possible, and
    it requires some additional design work to keep the effect of shade on you to
    a minimum.


    I cover shade in much more detail in the next chapter, giving an explanation of
    why shade has such a big impact on energy production. For now, it is important
    to know that shading can significantly affect the amount of energy you get from
    your solar energy.


    # Solar array power point efficiencies


    Now we have the theoretical size of our solar panels. We have not taken into account
    the efficiencies of the panels themselves the efficiencies of the controller or
    inverter that handles them.


    Solar panels are rated on their ''peak power output''. Peak power on a solar panel
    in bright sunlight is normally generated between 14 and 20 volts. This voltage
    can go up and down quite significantly, depending on the amount of sunlight.


    This swing gets much higher if you have multiple solar panels connected together
    in series – or if you are using a higher-voltage solar panel. It is common for
    a solar array with fifteen or twenty panels connected in series to have voltage
    swings of several hundred volts when a cloud obscures the sun for a few seconds!


    In terms of the amount of energy you can capture, as opposed to what the solar
    array collects, this method can reduce the efficiency of a solar array by 25%.


    A better solution is to use controllers and inverters that incorporate Maximum
    Power Point Tracking (MPPT). Maximum power point tracking adjusts the voltage
    from a solar panel to provide the correct voltage for the batteries or for the
    inverter


    Maximum power point trackers are 90-95% efficient. Over the past five years, the
    price of MPPT controllers and inverters has dropped and the availability has increased
    to the point where it is almost always worth buying an MPPT controller and inverter
    for all the very modest and smallest solar installations.


    Incidentally, you only need an MPPT inverter for grid-tie systems where you are
    powering the inverter directly from the solar panels. You do not require an MPPT
    inverter if you are planning to run the inverter into a battery bank.


    To account for power point efficiencies, you need to divide your calculation by
    0.9 if you plan to use a MPPT controller, or by 0.75 if you use a non-MPPT controller
    or inverter:


    | Non MPPT controller/inverter calculation | MPPT controller/inverter calculations
    |

    | Flat solar Solar panel | Flat solar Solar panel |'
