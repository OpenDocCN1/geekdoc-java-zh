  md: '# # Planning, regulations and approvals


    Depending on where you live around the world, there are different planning requirements,
    regulations and approvals needed for installing a solar energy system. Some countries
    have no regulation in place; other countries have extremely tight regulations.
    In some countries, change between regions.


    Consequently, it is impossible to provide every bit of relevant information here.
    You will be able to find information from your local authority and electricity
    providers. Additionally, we provide much of this information on [SolarElectricityHandbook.com](https://www.SolarElectricityHandbook.com).


    Wherever you live around the world, if you are unsure about building and electrical
    regulations and approvals in your area, check with an expert or ask the relevant
    authorities. Ignorance is never an excuse. In the case of a solar installation,
    the people you need to ask your local planning office, buildings insurance provider
    and, if you are building a grid-tie system, use your local electricity company.
    Not only will they be to help ensure you do not fall foul of any regulation; you
    will often find they are helpful and useful source of information.


    # # National and international standards for solar components


    In the United States, Canada, Australia and Europe, solar panels and inverters
    must comply with specific standards to be used in a grid-tie system. The units
    are tested to ensure they conform to these standards before they are allowed on
    sale.


    Across Europe, solar panels and inverters must conform to IEC 61215 or IEC 61646.
    Grid-tie inverters must conform to IEC 62109. Some European countries have additional
    certification. In Germany, grid-tie inverters must have a VDE126 certification,
    while in the United Kingdom, grid-tie inverters that produce more than 16 amps
    of power (3.6KW) must have G98 certification, and larger inverters have G99 certification.
    Also in the United Kingdom, solar panels and inverters must be certified by the
    Micro generation Certificate Scheme (MCS) to be eligible for export payments.


    In the United States, solar cables and inverters must have UL certification. Solar
    panels must conform to UL 1703. Grid-tie inverters must conform to UL 1741 and
    solar cabling must conform to UL 654 (US-2). If you are using batteries in your
    design, the batteries must conform to UL 1989, UL 2054, UL-SU 2580 or UL-SL 1973.


    It is worth noting that, in all regions, no differentiation is made between grid-tie
    solar and stand-alone systems for component selection. If you are building a solar
    energy system that is to be fitted to a building, your system must use certified
    components with building and electrical safety regulations in these regions. If
    you use unapproved equipment in a grid-tie system in these countries, you will
    not be able to connect your system to the grid. You are also likely to be in contravention
    of building regulations and may invalidate your building insurances.


    # # Installation regulations


    In many countries, the United States, Canada, Australia, New Zealand and most
    of the European Union, you cannot work on building electrics unless you are a
    qualified electrician. Some countries allow you to work on electricity, but your
    work must be checked and certified by a qualified electrician before commissioning.
    In Maine, low-voltage DC circuits are excluded from this legislation, but that
    is the'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'case. For example, Australia stringent standards for extra-low voltage installations,
    including for stand alone\and mobile applications.


    In many countries, there are additional qualifications for electricians that allow
    them to install and certify solar

    energy systems. In most cases, it is not a legal requirement to have this additional
    training. However, if you wish

    get access to government subsidies, feed-in tariffs or renewable energy certificates,
    you will almost certainly nehave your system installed, or at least checked, tested
    and certified, by solar installation specialists.

    This is entirely the case in the United Kingdom and Australia. In the United States,
    subsidies vary from state to

    state, and from county to county.


    As well as electrical safety regulations, there are often regulations for the
    fitting of the solar panels themselves, if

    t are mounted onto a building. Buffeting with wind can be an issue with solar
    panels. In extreme

    conditions, badly installed solar panels can be damaged, or can cause damage to
    the roofs they are fitted to.

    Consequently, it is legion in many countries, including most of Europe, that states
    that solar panels must

    not be fitted within 30cm – 12 inches – of the edge of a roof.


    # Getting your electricity supplier involved


    If you are planning a grid-tie system, it is worth speaking to your electricity
    supplier involved in your project.

    Sometimes they have their own requirements or lists of approved equipment. They
    often have specialists you can

    speak to, who can give you extra advice and support. In some parts of the world,
    your electricity company will

    need to be involved while your system is being installed, replacing your current
    electricity meter with a

    specific import/export meter and carrying the final inspection before approving
    your system.


    Some electricity companies will only accept feed-ins from professional solar PV
    installers. Almost all

    electricity providers insist that the installation is inspected and signed off
    by a certified solar installer before they

    will accept your connection to the grid.


    # In conclusion


    +   - There are different rules and regulations for installing solar power around
    the world

    - There are many standards, covering both the actual physical hardware and how
    it is installed

    - You must comply with the building regulations and electrical regulations in
    force in your region

    - You will be able to find help by talking to your local planning office and your
    electricity provider. You

    will also need to talk to your building insurance company'
