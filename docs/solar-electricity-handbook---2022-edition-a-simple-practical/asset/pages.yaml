  md: '# Cost-justifying solar


    Creating energy with solar is not only environmentally friendly, it can also be
    good for your bank account too. Whether you want to offset your electricity bill
    in your home or business, or if you want to avoid the high cost of connection
    to the electricity grid for a new building, solar can often save you.


    Unfortunately, most of the subsidies and grants that were available a few years
    ago are no longer available although there are some exceptions. However, there
    are other financial incentives that help cost-justify solar. In most cases, these
    incentives are alone sufficient to pay for your solar installation over a period
    of years. This can make them a sound long-term investment, particularly in comparison
    to bank interest rates in years.


    There are three ways to cost-justify solar installations:


    +   * Generating income by selling your electricity

    * Saving money by using your own electricity rather than buying it

    * Reduced cost for installing solar rather than paying for a conventional connection
    or grid upgrade


    There are additional factors that can help installing solar:


    +   * Reducing the impact of fluctuating energy prices

    * Greater reliance on electricity in the future (such as switching to heat pumps
    for heating homes and using vehicles)


    Finally, whilst subsidies and grants that were available a few years ago have
    now ceased, there are a few schemes that are still open.


    # Cost Justifications


    # Selling your electricity


    Home-based systems


    Firstly, if you are building a grid-tie system, you can sell your surplus electricity
    production back to the electricity companies. Schemes vary from country to country
    and in the size of your system. For a household system, you will usually receive
    a wholesale price by your electricity supplier.


    Most rooftop PV systems can be few fully justified by selling surplus electricity
    back to the grid. At best it can contribute towards the cost of the system but
    could take 20-30 years to pay off the cost of the system by itself.


    In general, unless solar is combined with batteries or the homeowner has specific
    uses for electricity, households export half the electricity they produce.


    Home based systems in the United Kingdom


    In the United Kingdom, you can export electricity using the Government-backed
    Smart Export Guarantee. You choose which electricity supplier you wish to sell
    to, and the system is monitored using your smart meter. Export prices are based
    on the wholesale price of electricity, rather than the retail price, and vary
    dramatically between suppliers, so it is best to shop around.


    Assuming a 4kW solar array on a house and the electricity produced by the solar
    array is exported, households could expect to create an income of between £75-125
    a year from selling their surplus electricity.


    Home based systems in the United States


    In the United States, the payback system is called net metering, where customers
    get compensated for exporting electricity to the grid.


    Net metering is not available everywhere in the United States, but is now mandatory
    in 44 states, with voluntary schemes elsewhere. Deals vary dramatically. In most
    states, net metering ensures solar owners are paid retail rates'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'for the electricity they produce. In few states, however, solar owners are
    only paid wholesale prices for their electricity, so you will need to check the
    situation in your location first.


    In southern states where net metering pays retail prices, a home with a 4kW solar
    array exporting half their electricity generation could expect to generate between
    $200-300 a year by selling their surplus electricity.


    # Solar farms and large commercial systems


    For larger systems, such as a solar farm or solar panels on the roof of a large
    commercial building such as a warehouse or factory, you will likely sign a multi-year
    contract with a supplier to sell your electricity. These can be either a fixed
    amount per kWh or a fluctuating amount depending on the demand for electricity
    in your area. At periods of high supply and low demand, your electricity can be
    virtually worthless. At other times, your electricity generation will sell for
    a considerable premium.


    In the United Kingdom, the scheme is called the Power Purchase Agreement (PPA).
    You can sign PPAs with electricity suppliers, aggregators or PPA Specialists.
    Prices do vary dramatically between suppliers, so it is worth shopping for the
    best deal.


    In the United States, there are different schemes in different parts of the country.
    Schemes are typically offered by the local electricity utility


    Where prices fluctuate according to supply and demand, it can make sense to combine
    a solar farm with battery, storing energy when electricity prices are low and
    selling when they are high. Until recently, the economics for batteries has been
    borderline, but with the recent increases in wholesale prices brought by high
    gas prices across Europe, the benefits of this are now clearer.


    Finally, there are schemes in both Europe and the United for Renewable Energy
    Certificates, which are awarded for every MWh of electricity produced. These are
    tradable certificates that can be sold to companies or users who wish to demonstrate
    their use of renewable resources which is often a legal requirement. In the United
    States, these are known as Renewable Energy Certificates (REC) or Renewable Certificates
    of Origin (REGO) and in Australia they are known as Small-scale Technology Certificates
    (STC). In the UK and across the EU, they are known as Renewable Energy Certificates


    Generally, you can expect a well-designed solar farm in the right location in
    the UK to have a payback of eight years and twelve years, and an operational lifetime
    of at least twenty-five years. In the US, payback will depend on your location:
    in the northern states, payback is comparable to the UK. In the southern states,
    payback is between five and seven years.


    # Using your electricity rather than buying it


    For most people, a solar installation is cost justified through the savings made
    from buying electricity from the grid.

    This works better when you are a homeowner, or a business such as a farm, warehouse,
    or factory. In a home environment, a 4kW solar array can easily save $400-650
    off your electricity bill each year if you use half the energy you produce. If
    you use all that, saving can be considerably higher, and is achievable, particularly
    if your PV system is combined with a battery, or if you use a heat-pump to heat
    or cool your home, or if you drive an electric car and charge it during the day.


    In a commercial environment, PV can be more cost-effective. Most businesses are
    actively active during the day, when solar is most productive. Many businesses,
    variable tariffs for their purchased electricity depending on supply and demand
    and these often coincide with peak production times for solar. Additionally, there
    is usually significantly more roof space for installing solar than there is in
    a home, and installing larger systems is more cost effective than smaller ones.


    As rough guide, a 50kW solar array, mounted to a south-facing warehouse or factory
    roof in the UK, could save £30,000 to install. If 75% of the electricity generated
    by the solar array was used by the business, a saving of around £5,500-6,500 per
    year on the electricity costs for the business may be expected.


    # Installing electricity to a new building'
