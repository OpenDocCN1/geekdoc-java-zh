  md: 'Measure the length and the width of the building (measurements a and b) from
    ground floor level, but well as measuring the height of the roof from within the
    attic, you also need to measure the length of the roof between the hip ends (measurement
    d).


    You then calculate the slope of the roof in the same way as you would for a gable
    roof, as shown on the previous page.


    To calculate the overall length of the roof available, you then do two calculations,
    one for the roof between the hip ends (measurement d), one for the hip ends of
    the building and then add both together.


    In this example, if the house is 1000cm long (a) and 500cm deep (b), the roof
    height is 250cm (c) and the length between the hips is 500cm (d):


    +   - Calculate your slope using the equation on the previous page (slope = 353.5cm).
    Then subtract 60cm – 24 inches if using inches – from this figure to take into
    account that you cannot fit solar panels too close to the either or the bottom
    of the roof (353.5 – 60 – 293.5cm).

    - Calculate the roof space between the hips (500cm x 293.5cm)

    - Subtract (d) from (a) to work out the overall length of the hip ends, then subtract
    30cm to take account that you cannot fit solar panels too close to the edge of
    the roof.

    - Multiply this figure by half the slope (470cm x 146.75cm)


    This will give you an approximate size that you can use for working out how many
    solar panels will then fit on your.


    In some cases, you will have a pyramid roof, as shown over the page, or may wish
    to fit solar panels onto the hip-end of a roof, in which case you have a fully
    triangular roof to work with. In this scenario, it is best to do your measurements
    inside the attic.


    Again, the calculations for working out how many solar panels will fit on this
    type of roof can get convoluted, again, there is an easy calculation which is
    used by many installers for working out how many solar panels can be fitted.


    Measure 120cm (48 inches) down from the top of the roof along the pitch of the
    roof, and measure the width of the roof at this point. Deduct 60cm (24 inches)
    from this measurement to take account that you cannot fit solar panels too close
    to the edge of the roof.'
