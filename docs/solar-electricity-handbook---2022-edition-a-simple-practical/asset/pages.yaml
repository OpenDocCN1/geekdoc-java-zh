  pgno: 79
- img_proc: true
  md: 'If you are planning to wire your solar array in parallel rather than series,
    you need to ensure that your solar array cables cope with the current that you
    are going to be generating through your solar array. If you are designing a parallel
    system, I explain how you can calculate the size of cable required in the chapter
    on stand-alone system components, on page 131.


    # Solar array connectors


    There are standard connectors for connecting solar panels together. For most solar
    panels, the standard connector is the MC4 connector, as shown in the pictures
    over the page. The MC4 connector comes as male and female components that clip
    firmly together, creating a weathight seal.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_80_0.png)


    Above: The MC4 male and female connectors lock together to create a weathight
    seal.


    For very small solar panels, such as the 5W–50W panels used for outbuildings and
    the like, the alternative S-S connectors are common. These are cheap and simple
    connections that are suitable for 12V systems only, and are typically used where
    only one or two panels are being used, with shorter cable lengths of up to 3 metres
    (10 feet).


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_80_1.png)


    Like the MC4 connections, S-S connectors form a long lasting weathert seal. Unlike
    the MC4 connections, they do not lock together and can be easily pulled apart.
    They are fit for purpose for very small installations and have the benefit of
    being very easy to use.


    # Fuses and isolation switches


    The ability to isolate parts of the system is important, especially while installing
    the system and carrying out maintenance. Even comparatively low voltages can be
    dangerous to work on.


    Even small stand-alone systems should incorporate fuses and switches at critical
    paths in the system. This allows the system to shut down automatically if there
    is an overload or a short circuit, or to be manually switched off if there is
    problem. It is far better to blow a cheap fuse than to fry a battery or an expensive
    solar controller. At the very least, you should have:'
  merge: -1
  pgno: 80
- img_proc: true
  md: '+   - An isolation switch between the solar array and the solar controller
    or solar inverter, so that the power

    generation from the solar panel can be switched off.


    +   - A quick-blow fuse between the battery pack and the solar controller.


    +   - An isolation switch and a quick-blow fuse between the battery pack and anything
    that is taking power

    from the batteries (such as an inverter).


    +   - If you are using an inverter, an isolation switch must also be fitted to
    the AC side of the system.


    Even if you are only installing a very small solar energy system, provide a shed
    light for example, adding these

    fuses and switches is important. For systems running at 12V that can only generate
    or less than 100W of

    power, the switches can be low-cost home light switches and automotive blade fuses.
    For anything larger,

    specialist DC isolation switches and fuses will be required.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_81_0.png)


    If your solar panels are mounted away from your inverter or controller, it is
    a good idea to have an isolation

    switch fitted next to the solar panels, as well as one fitted next to the inverter
    or controller. You can then easily

    disconnect the solar panels from the rest of the system for maintenance or in
    case of an emergency.


    Ensure that the isolation switch you choose is capable of handling high-current,
    high voltage DC circuits, with

    contacts that will not arc. AC isolation switches are not suitable and should
    be avoided at all costs. Suitable DC

    isolation switches are available from any solar supplier and are not expensive
    to buy.


    If you are planning a grid-connected system, you will need AC isolation switches
    to allow you to disconnect the

    inverter from the grid system. You will require an isolation switch next to the
    inverter, and a second one next to the

    distribution panel.


    # The importance of using the correct cables, connectors, and

    isolation switches


    Solar arrays are often very high voltage. Even a small off-grid isolation can
    have voltages of 100–150V,

    whilst a larger residential installation can easily have a voltage as high as
    500–900V on a bright day.


    Unlike electricity from the grid, that uses an alternating current, solar electricity
    is a direct current. If you get

    electric shock from an alternating current, the likelihood is that the force of
    the jolt will throw you back, thereby'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'ensuring you only receive a momentary shock. With a direct current electric
    shock, you will not be thrown back. Instead, your muscles are more likely to lock
    you into the same position. You are therefore much more likely to be electrocututed
    for longer, which poses a greater risk.


    Because of the high voltages, the electricity can arc across wide gaps between
    cables. I have seen an arc of 10-15cm (4-6 inches) when somebody disconnected
    solar array connectors without breaking the circuit through an isolation switch.


    For some reasons, you must use isolation switches that are rated for high voltage
    DC connections. Usual residential isolation switches are designed for AC power,
    which will not arc, and are entirely unsuitable.

    The and connectors have a harsh life. They are usually outside and exposed to
    withstand harsh weather, intense UV light, heat, cold and potential attack from
    rodents and small animals, and are expected to last between 30 and 40 years. Do
    not be tempted to use non-standard cables or connectors for your solar installation,
    no matter how small your system is. The cost of getting right in terms of cables,
    connectors and switches is low, and the potential risks of using unsuitable cables,
    connectors or isolation switches is not worth taking.


    # # Ground fault protection


    Ground fault protection ensures that if there is a short within the solar array,
    the current flow is cut off immediately. This averts the risk of damage to either
    the controller or the solar array, and significantly reduces the risk of electrocution.


    Ground fault protection works by measuring the current entering and exiting a
    circuit. If everything is working correctly, the current should equal the current
    out. However, if there is a ''leak'' or a partial short circuit, the system will
    see a difference in current and immediately shut down. A partial short circuit
    could occur if a solar panel was broken or if somebody touched an exposed panel.


    Most inverter and solar controllers incorporate ground fault protection, using
    a *Residual Current Device (RCD)* built into the unit (note: RCDS are known as
    *Ground Fault Interrupters - GFIs* in the United States and Canada). Many experts
    say that it is prudent to install a separate ground fault protector, even if the
    controller or inverter has ground fault protection in. As the cost of an RCD or
    GFI is low and the benefits they provide are high, this is good advice.


    You will require separate ground fault protection for your DC and AC circuits:


    +   - For anything larger 100wp solar panel systems, and for all systems mounted
    to a building, you should install ground fault protection between your solar panels
    and your controller or inverter

    - If you are installing a DC power supply into a building for running appliances,
    you must install ground fault protection between your controller and this power
    supply

    - If you are using an inverter, you should install ground fault protection between
    your inverter and any load


    There are specific RCD units for DC circuits and they are stocked by solar panel
    suppliers.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Components for Grid-Tie systems


    Before discussing the components required for a grid-tie system in more detail,
    it is useful to look at how a grid-tie system is configured.


    There are three basic designs for grid-tie solar energy systems:


    +   - Single string in-series systems

    - Multiple string in-series systems

    - Micro-inverter systems


    # Single string in-series systems


    Multiple solar panels connected in series is called a ''string'' of panels. For
    grid-tie systems, a single string of solar panels is the most popular configuration
    for a grid-tie system today. Solar panels are connected together in series, producing
    a high-voltage DC power. This is then fed into a central inverter to convert the
    power into an AC source, which in turn is connected into the standard building
    electrical system:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_83_0.png)


    A simplified block diagram showing the basic layout of a high voltage in-series
    solar energy system


    This design is the most cost-effective design for grid-tie systems. It is relatively
    straightforward to install, maintain, and components are readily available. By
    running the solar array at high voltage, it is also very efficient, with minimal
    losses through the array itself and allowing the inverter to run at a very high
    level of efficiency. This is why this design is so popular within the grid-tie
    industry.


    This high-voltage DC power has the benefit of great efficiency, but comes with
    a number of significant safety risks. Voltages as high as 600 volts in North America
    and 1,000 volts in Europe are common. These voltages can easily be fatal on contact.


    These high voltages can cause significant problems if there is damage to the wiring
    between solar panels, either due to a mistake during installation, through animal
    damage, or simply wear over time. If a damaged cable generates a high-voltage,
    direct current electric arc while the panels are in direct sunlight, the immensely
    high temperatures can easily melt metal and be a potential fire hazard.


    When connected in series, the solar array is only as strong as its weakest link.
    This is a significant disadvantage of in-series connection. If you have a damaged
    solar panel, shade blocking light to a few solar cells, or a damaged cable, the
    output of the entire solar array drops to the output of weakest link.


    # Multiple string in-series systems


    It is for these reasons that multiple string in-series systems are becoming more
    popular. Multi-string inverters allow you to connect more than one string of solar
    panels. These two strings work as separate arrays, but feed the power through
    the same inverter.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Solar panels connected in series


    # Parallel feeds into inverter


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_84_0.png)


    Solar panels connected in series


    A simplified block diagram showing the basic layout of a low-voltage solar energy
    system where multiple strings of solar panels are connected in parallel


    Because you have two separate strings as independent solar arrays, you can have
    two different sizes of array with different solar panels, or have the mounts mounted
    on different roofs or at different orientations. If one is partially shaded, the
    performance does not impact the second array.


    This design used to be more expensive than a single string of solar panels because
    it required a more expensive grid-tie inverter that could accept multiple strings
    of solar panels. However, over the past two years, the price of these inverters
    has dropped significantly and there is now little difference in cost between a
    grid-tie inverter that can accept one two strings of solar panels.


    This approach is cost effective and gaining popularity over the single-string
    systems. Multiple string systems are particularly beneficial in the following
    situations:


    +   - Where you wish to fit two different sizes of solar panels

    - Fitting solar panels facing at different orientations, such as on a roof that
    has two different pitches

    - Resolving shading issues. Solar panels that are in shade at certain times of
    the day can be put onto a separate string so as not to affect the output of the
    system


    # Micro-inverter systems


    Micro-inverter systems have been around for a few years now, but until recently
    had not gained popularity due to their higher cost.


    However, with the huge growth in the popularity of grid-tie systems around the
    world, micro-inverter systems have become far more widespread as the benefits
    of this technology have become more apparent. For micro-inverter systems are dropping
    fast, although they are still more expensive than single inverter systems.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_84_1.png)


    A simplified block diagram showing the basic layout of a micro-inverter system


    In a micro-inverter system, each solar panel has its own inverter, converting
    its output to AC power. In effect, each solar panel becomes its own independent
    solar energy system.


    In most micro-inverter systems, the inverter itself is mounted outside, bolted
    to the frame that also holds the solar panel in place. The individual solar panels
    are connected to an AC power cable that runs alongside the solar array'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'and feeds directly into the building''s electrical system.


    There are some significant benefits of micro-inverter systems over other forms
    of grid-tie systems:


    +   * As each solar panel runs as an independent unit, if one panel is under-performing,
    either because of damage or simplicity because it is shaded, it does not affect
    the output from any of the other panels

    * Because there is no high-voltage DC power running from one panel to the next,
    safety is less of an issue

    * Installation, fault-finding and maintenance also become significantly easier

    * It is easy to expand your grid-tie system in the future, as budget allows

    * More flexible solar panel installation – you can have solar panels mounted in
    different locations and facing in different directions


    While today, series-connected solar systems with a central inverter are still
    the standard model for installing grid-tie systems, the industry is moving towards
    micro-inverter technology as for a better model.


    Now you have a clearer idea of how a grid-tie system is put together, it is time
    to look at the components available in more detail.


    # Grid-tie solar panels


    In the past, when most solar energy systems were stand-alone systems, almost every
    solar panel you buy was rated for a 12-volt output. While this is still true for
    smaller panels, there are now higher-voltage configurations available for larger
    panels.


    As grid tie systems become more popular, higher-voltage solar panels have become
    available. Many solar panels of 150W capacity and are rated for a 24-volt output
    and many manufacturers are now building solar panels with rated outputs of between
    48 volts and 120 volts.


    These voltages are well suited to grid-tie installations. By running your solar
    array at a higher voltage, you can keep the current flow low, which improves the
    efficiency of the overall system.


    # Grid-tie inverters


    Grid-tie inverters convert the DC power from your solar energy system into AC
    power, and convert the voltage to the same as the grid. This allows you to connect
    your system to the grid, enabling you to become a mini power station and supply
    your electricity to electricity companies.


    You cannot use an ordinary inverter for grid-tie applications. There are a number
    of reasons for this:


    +   * Grid-tie inverters have to work in conjunction with the grid, to be able
    to export electricity to it. AC pure sine waveform generated by the inverter has
    to be perfectly coordinated with the waveform from the grid

    * There is an additional safety feature for grid-tie inverters to cut off the
    solar array if the grid shuts down

    * Grid-tie inverters are connected directly to the solar panels. In an in-series
    system, this means the input voltage from the panels can fluctuate, often jumping
    or dropping by several hundred volts in an instant. Non grid-tie inverters cannot
    cope with such massive voltage jumps

    * In many countries, grid-tie inverters must be certified for use with the grid


    There are a number of things to consider when choosing a grid-tie inverter:


    +   * Input voltage

    * Power rating

    * Power tracking

    * How many strings the inverter can support

    * Diagnostics and reporting information

    * Inbuilt safety systems'
  merge: -1
  pgno: 85
- img_proc: true
  md: '+   - Installation options and operating environment

    - Certification and local regulations


    # # Input voltage


    Inverters have a large voltage range to cope with the high fluctuation of voltage
    that a solar array provides. From this voltage range, it is possible to identify
    how many solar panels the inverter can cope with, when connected in series.


    Most guest-grid inverters for rooftop installations are designed to work with
    a range between 50 volts and 500 volts per string.


    The rated voltage of a solar panel is not the maximum voltage that the solar panel
    can generate. The voltage from a single-12 volt solar panel can fluctuate anywhere
    from 12 volts on a dull day, up to 20 volts in intense overhead sunlight. If you
    have a 48-volt solar panel, or four 12-volt solar panels connected in series,
    the voltage swing can be between 48 and 88 volts.


    Additionally, a solar panel can produce significantly higher voltages in an open
    circuit – i.e. when the solar array is generating power but the power is not being
    used. Depending on your solar panel, a 12-volt solar panel to generate 26 volts
    in an open circuit.


    As you can see from the table below, the higher the nominal voltage of your solar
    array, the greater the fluctuation can be:


    | Number of 12-volt solar panels | Nominal solar voltage | Low voltage on dull
    day | Peak voltage in intense sunlight | Maximum circuit voltage |

    |---|---|---|---|---||

    | 1 | 12-volt | 12 volts | 20 volts | 26 volts |

    | 2 | 24-volt | 24 volts | 40 volts | 52 volts |

    | 4 | 48-volt | 48 volts | 80 volts | 104 volts |

    | 6 | 72-volt | 72 volts | 120 volts | 156 volts |

    | 8 | 96-volt | 96 volts | 160 volts | 208 volts |

    | 10 | 120-volt | 120 volts | 200 volts | 260 volts |

    | 15 | 180-volt | 180 volts | 300 volts | 390 volts |

    | 20 | 240-volt | 240 volts | 400 volts | 520 volts |

    | 25 | 300-volt | 300 volts | 500 volts | 650 volts |

    | 30 | 360-volt | 360 volts | 600 volts | 780 volts |

    | 35 | 420-volt | 420 volts | 700 volts | 910 volts |

    | 40 | 480-volt | 480 volts | 800 volts | 1040 volts |


    Note: the maximum open-circuit voltage allowable in the United States for grid-tied
    systems is 600 volts, while in Europe it is advisable that your system does not
    exceed 1000 volts (although 1,500 volts is becoming more common for large solar
    farms). You must ensure that your system never exceeds this.


    As you can see from this table, if a cloud blocks the sun on an overcast day,
    you can see a drop of several hundred volts in an instant. When the cloud passes,
    the voltage surges back up.


    It is important to ensure that the solar panel will work with the voltage of your
    solar array and not the nominal voltage of your array. If you exceed the peak
    voltage of your inverter, the inverter will shut down to avoid damage. In extreme
    cases, you could damage your inverter by exceeding voltage ratings.


    As well as looking at the maximum input voltage, you need to look at the minimum
    input voltage as well. If the overall voltage of the system drops below the minimum
    input voltage, the inverter switches off. The solar panels will still generate
    energy, but the energy generated is limited. A minimum input voltage will mean
    mean power generation at the start and end of each day and will ensure greater
    power generation in winter months, particularly'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'in overcast conditions. Finding an inverter with the widest range of input
    voltages will give you the greatest flexibility in designing your system.


    In addition to the standard input voltage range, your inverter will also show
    a maximum voltage rating. This maximum voltage rating relates to the maximum open
    circuit voltage of your solar array. You must ensure that the open circuit voltage
    of your array does not exceed the maximum voltage of your inverter.


    # Power rating


    There are two power ratings on a grid-tie inverter:


    +   * Input power rating – the minimum and maximum amount of power the inverter
    can accept from the solar array

    * Output power rating – the maximum amount of power and current the inverter can
    generate as an AC output


    # Input power rating


    The input power ratings show the minimum and maximum range the inverter can work
    in. With the main, the wider range, the more efficient your inverter is.


    The specification on an inverter will typically show three figures for power rating:


    +   * A nominal power rating, shown in wats

    * A minimum and maximum power range

    * A start-up power rating


    The nominal power rating shows the maximum amount of power that the inverter can
    convert into an AC output. If you exceed this on your solar array, the additional
    power will be lost and converted into heat. Excess this for long and your inverter
    may shut down to avoid overheating.


    The minimum power rating shows the minimum amount of power that your solar array
    must generate for the inverter to start producing. The maximum power rating shows
    the maximum amount of power that can be fed into the inverter before risk damaging
    your inverter.


    The start-up power rating is the minimum amount of power the solar array requires
    to power itself. If the solar array produces less than this amount of power, the
    inverter will switch off.


    # Output power rating


    The output power rating is the maximum continuous AC power that the inverter can
    generate. The output power information will show nominal output power in watts,
    the maximum current in amps and the alternating current frequency.


    For North America, the grid voltage is nominal at 110 volts, with a frequency
    of 60Hz. For the majority of the rest of the world, the grid voltage is nominal
    at 230 volts, with a frequency of 50Hz. In cases, it is not to get variation in
    voltage and frequency.


    The output power rating shows the maximum efficiency rating of the inverter, as
    a percentage. This rating is usually in the range of 90-94% with grid-tie inverters.
    If you are shopping on a device, you must check this rating as some grid-tie inverters
    may be much less efficient.


    It is uncommon for a solar array to have a peak wattage higher than the power
    rating from the inverter. In the United Kingdom companies selling residential
    solar energy systems will offer a 4kW system as their largest. However, the electricity
    companies have said that any system providing more than 16 amps must go prior
    approval from the District Network Operator (DNO), which typically takes up to
    eight weeks and can cost in region of £500. 16 amps at a nominal 230V equates
    to 3.6kW. 4.6kW residential systems installed in the United Kingdom therefore
    fit an inverter with a 3.6kW maximum power rating, 3.6kW to comply with this directive.
    Due to the climate in the United Kingdom, a solar array with a 4kW rating is unlikely
    to generate more than 3.8kW at any one time. In real terms, the customer is not
    losing out in real world power generation.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_87_0.png)'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Power tracking


    As discussed on page 70, the efficiency of the solar array depends on how efficiently
    the fluctuating voltage is handled by your inverter.


    If you are purchasing a grid-tie inverter, you should invest in one that incorporates
    maximum power point tracking (MPPT). Maximum power point tracking can provide
    an additional 15–20% of energy. MPPT is the norm, but there are a few older designs
    of inverter that occasionally pop up for sale at bargain prices online. No matter
    how cheap these non-MPPT inverters, the performance loss rarely makes them a worthwhile
    investment.


    # Multiple strings


    Multi-string systems were discussed on page 120. Many inverters now allow two
    of solar panels to be connected to the same inverter. Some allow three or four
    strings to be connected, although these tend to be more expensive.


    # Diagnostics and reporting information


    Almost all inverters provide a level of diagnostics and reporting information,
    each using a small display built into the unit itself, a series of LEDs on the
    front panel or a separate plug monitoring unit.


    Many inverters have a built-in internet connection, allowing them to connect to
    a wireless network. Your system can provide you with updates via e-mail, a built-in
    website, or even send updates to your mobile phone. In many cases, these can be
    remotely monitored by the solar inverter supplier, who can notify you if you have
    any issues with your system.


    If you have a micro-inverter system, the diagnostics and reporting system is a
    separate box, which is either connected to the AC power at where the solar array
    connects to your distribution panel, or it communicates wirelessly to ensure that
    you have one central point for monitoring your inverters.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_88_0.png)


    This is one of my test solar energy systems, being monitored online. The website
    allows me to see how much power is being generated at any time as well as the
    overall energy generation of my system on a daily, weekly or monthly basis.'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'As a bare minimum, you want an inverter that can tell you if your system is
    working and provide you with an indication of what may be the problem if a fault
    is detected. The diagnostics should be able to give you enough information to
    identify a fault with your system, such as:


    +   - Insufficient or excess power from the solar array

    - Grid connection issues

    - Grid voltage or frequency issues

    - Overheating


    Most inverters provide with much more information, allowing you to see the voltage
    and current from your solar array, current power generation, daily power generation
    and lifetime power generation.


    # Built-in safety


    Most inverters incorporate safety shutdown. It is common for inverters to have
    ground protection built in. As mentioned in the previous chapter, even if an inverter
    provides this, it is still good practice to install additional ground fault protection
    when you design your system. This is incorporated into your system using a Residual
    Current Device (RCD). RCDs are Ground Fault Interceptors (GFIs) in the United
    States and Canada.


    A grid-tie inverter will monitor the power and shut down if it detects a power
    cut (sometimes referred to as “Island Protection”). This power shutdown ensures
    that your solar energy does not continue to feed into the grid if there is a power
    cut. This is a necessary safety requirement. If workers are attempting to repair
    a power outage, they risk electrocution if power is being fed into the grid from
    your solar array while they are working.


    Inverters should also shut down if the internal temperature gets too high.


    # Installation options and operating environment


    Inverters are heavy. They need to be mounted securely on a wall or bolted to the
    floor. They can generate lots of heat, especially when close to their rated output,
    and require good airflow around the units to keep them cool.


    You can purchase inverters for either indoor or outdoor installation. If you are
    looking at installations outdoors, check that the unit is sealed against dust
    and water ingress, rated to at least IP64.


    Overheating inverters are the one reason for grid-tie systems failing. As an inverter
    gets hotter, it provides less power, and if the temperature continues to rise,
    it will eventually shut down to avoid permanent damage. When choosing an inverter,
    check its operating parameters and how you can ensure your system remains within
    these limits.


    Inverters are often installed in attics. While this can be a very good idea, attics
    can get hot in summer months. In the United Kingdom where hot days are a rarity,
    attic temperatures can reach 55°C (122–131°F) in some instances. Most inverters
    are getting to their upper limit of operating temperature at this sort of level.


    Inverters should always be installed in a well-ventilated area, away from the
    ceiling and with a clearance around each side, the top and the bottom. They can
    be installed in a sealed cupboard. Inverters have the option of an external heat
    sink or temperature-controlled cooling fans to keep the inverter cool.


    Some inverters make a small amount of noise. This is typically a continuous low-level
    hum. It is only noticeable if the surrounding area is quiet. For this reasons,
    inverters are not usually installed inside the living space in a home or in an
    office environment. Instead, consider installing your inverter in a garage or
    on an outside wall of your building.


    Occasionally, the sound made by the inverter has to resonate with the wall, amplifying
    the sound and making it unpleasant to live. This can occur if the inverter is
    mounted on an outside wall. This is a very rare occurrence but is most likely
    to occur if you are planning to mount your inverter onto a wall of solid concrete.
    The solution is to dampen the mounting between the inverter and the wall or floor
    that the inverter'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'is mounted on. There is a very effective product called Green Glue, produced
    by the Green Glue Company (www.GreenGlueCompany.com) that is applied between the
    wall and the inverter. When it is compressed by remointing the inverter, the glue
    spreads out to form a sound isolation barrier that is particularly effective at
    blocking low-resonance vibrations.


    # Buying from eBay


    I do not advocate against eBay, unless you really know what you are looking at.
    Unfortunately, there are lots of so called ''bargains'' to trap the unwary, often
    selling non-approved inverters, or bundled deals advertised as ''micro grid-tie
    systems'' that are claimed to be suitable for amateur installation. Often the
    inverter plugs into the household electricity supply through a normal domestic
    power socket, and the sellers claim you can use the system to sell power back
    to the utility company and run your electricity meter backwards.


    These systems are highly dangerous. The equipment has inevitably not been certified
    for grid-tie use. More importantly, the use of these systems is illegal in the
    United States, Canada, Australia and across the European Community, because the
    way the inverters connect to the household electricity supply, using a domestic
    power plug in reverse.


    This means that the household plug has grid-level AC power running through it,
    with life high voltage current running through the prongs of the plug. This is
    extremely high risk and directly contravenes basic electrical safety legislation.
    The catastrophic and potentially fatal results should somebody unplug the cable
    and accidentally touch the unshielded plug do not bear thinking about.


    These cables have been nicknamed ''widow makers'', with good cause. They are potential
    killers. Never design any electrical system that risks grid-level AC power running
    through exposed connectors. Your life, and the lives of the people around you
    are worth far more than saving a small amount of money.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Components for Stand-Alone Systems


    If you are designing a stand-alone system, there is a lot more design work and
    planning involved than there is for a similarly sized grid-tie system. It is more
    critical to make sure your stand-alone system works. A grid-tie system will not
    let you down if you do not generate enough energy, a stand-alone system will.


    As well as considering and planning all the physical side of fitting the panels,
    routing the cabling, and handling the safety aspects, you will also need to consider
    the voltage that your system will run at and design a battery system to store
    your energy.


    # Calculate your optimum voltage


    Solar panels and batteries are normally both 12 volts, so logically you would
    think that it would make the most sense to run your system at 12 volts.


    For small systems, you would be right. However, there are some limitations of
    12-volt systems. Therefore, we now need to identify the optimum voltage for your
    system.


    If you are not comfortable with volts, watts, currents, and resistance, now would
    be a good time to re-read Chapter 2: A Brief Introduction to Electricity.


    # Voltages and current


    Current is calculated as watts divided by volts. When you run at low voltages,
    current is much higher than when you run at higher.


    Take a normal household low-energy light bulb as an example. A 12W light bulb
    running from grid-level voltages is consuming 12 watts of power per hour. The
    current required to power this bulb at 230 volts is 0.05 amps (12W ÷ 230V = 0.05
    amps) and at 110 volts is 0.1 amps (12W ÷ 110V = 0.1 amps).


    If you run the same wattage light bulb from a 12-volt battery, you are still consuming
    12 watts of power hour, but this time the current is 1 amp (12W ÷ 12V = 1 amp).
    If you run the same wattage light bulb from a 24-volt battery, you halve the power,
    Now you only require ½ amp (12W ÷ 24V = ½ amp).


    "So what? I hear you. "Who cares? At the end of the day, we''re using the same
    amount of energy, whatever the voltage.


    The issue is resistance. Resistance is the opposition to an electrical current
    in the material the current is running through. Think of it as friction on the
    movement of electrons through a wire. By increasing voltage, you can reduce your
    current and thereby reduce energy loss.


    You can counter the resistance by using thicker cabling, but you get to the point
    where the size of the cabling becomes impractical. At this point, it is time to
    change to a higher voltage.


    # What voltages can I run at?


    It used to be that your system – both the energy generation and the energy usage
    – had to run at the same voltage. For example, if you had a string of four 12V
    solar panels, your solar array would run at 48V, and your battery and inverter
    had to run at 48V.


    Whist this still often the case, it no longer has to be. You can now use solar
    controllers that can take a string of solar panels at a higher DC voltage and
    steps this down to a lower voltage for charging one or more batteries at 12V,
    24V or 48V. The maximum DC voltage from the solar array can be as high as 150V,
    depending on the solar controller used.


    This allows you the opportunity to use the larger capacity, higher voltage solar
    panels usually found on grid-tie installations and use them in a stand-alone application.'
