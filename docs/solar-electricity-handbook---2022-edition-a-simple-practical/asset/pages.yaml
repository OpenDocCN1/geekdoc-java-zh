  md: '# Using solar irradiance to give you an approximate guide for the required
    power capacity of your solar array


    In the same way that you can work out how much energy a solar panel will generate
    per day, you can use solar irradiance to give you an approximate guide for the
    required capacity of solar array that you need.


    I say an approximate guide, because the actual capacity will also need to take
    into account:


    +   - The peculiarities of your site

    - The location and angles of your solar panels

    - Any obstacles blocking the sunlight at different times of day


    I cover this in the next chapter when I look out at the site. Nevertheless, it
    can be useful to carry out this calculation to establish a ballpark cost for your
    solar electric system. The calculation is simple. Take the figure calculated for
    your total number of watt-hours per day and divide it by the solar irradiance
    for the worst month that you require your system to work.


    Using our holiday home as an example, we can calculate our watt-hours per day
    of 695W/day and divide this by the worst month on our irradiance chart (December).
    To see how this doing based on our performances:


    | Flat | 695 ÷ 0.159 watts | If we our panels laid flat, we would need a 1,159Wp
    solar array to power our home in December. |

    | Upright | 695 ÷ 1.01 688 watts | Mounted vertically on a wall, the solar panels
    could generate the same amount of power with a 688Wp array. |

    | 38° angle | 695 ÷ 1.05 661 watts | Angled towards the equator, we could generate
    the same amount of power with a 661Wp solar array. |

    | 23° angle Best winter tilt | 695 ÷ 1.08 643 watts | With the optimum winter
    tilt, we can use a 643Wp solar array. |

    | 53° angle Best summer | 695 ÷ 0.97 716 watts | Angled towards the summer sun,
    we would require a 716Wp solar array to provide power in December. |

    | Adjusted Monthly | 695 ÷ 1.08 643 watts | With the tilt of the solar panel adjusted
    each month, we can use a 643Wp solar array, the same as the |'
