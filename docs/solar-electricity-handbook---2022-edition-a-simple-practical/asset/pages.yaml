- img_proc: true
  md: 'Now mark the height and width of the obstacle on your sun chart and block off
    this area on the chart. For example, if a nearby building is between 120–150°
    on the compass and a 15° elevation, you would block off this area on the chart
    (shown in yellow, below):


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_65_0.png)


    You may have more than one obstacle to mark off in this way.

    If the obstacle creating the shade is within ten metres (33 feet) of the proposed
    location, you then need to draw a shade circle around the obstacle on the chart
    to reflect the more severe impact that items will have on the solar panel performance.


    In the example, if the building creating the shade is more than ten metres away,
    we do need nothing more with the chart. However, if the building is closer, we
    must then draw a circle from the bottom line of the chart to the height of the
    obstacle, from the center of the obstacle:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_65_1.png)


    Once you have completed marking all the shade, you must count all the squares
    that have been blocked out by the obstacles. If only a partial square is covered,
    include it in your count.


    Ignore any squares below the blue line path for the winter solstice, or any squares
    above the blue line path for the summer solstice. Also ignore any squares more
    than 90° away from south (or north, if you are in the Southern Hemisphere).'
