  md: '# The Design Process


    No matter what solar energy system is, for there are seven steps in the design
    of every successful solar PV installation:


    +   - Scope the project

    - Calculate the amount of energy you need

    - Calculate the amount of solar energy available

    - Survey your site

    - Size up your solar electric system

    - Select the right components and work out full costs

    - Produce the detailed design


    The design process can be made more complicated, or simplified, based on the size
    of the project. If you are simply installing an off-the-shelf shed for light,
    you can probably complete the project in ½ hour. If you are looking to install
    a solar electric system in a business to provide emergency site power in the case
    of a power cut, your design work is likely to take several days.


    Whether your solar electric system is going to be large or small, whether you
    are buying an off-the-shelf solar lighting kit or designing something from scratch,
    it is worth following this basic design process every time. This is true even
    if you are installing an off-the-shelf system. This ensures that you will always
    get the best from your solar system and will provide you with the reassurance
    that your solar energy will achieve everything you need to do.


    # Online tools to help you


    Once you have scoped your project, the Solar Electricity Handbook, which you can
    find at www.SolarElectricityHandbook.com, includes several online tools and calculators
    that will help you carry out much of the design work.


    The solar irradiance tables and solar angular calculators allow you to work out
    how much solar energy is available at your location, the off-grid project analysis
    and grid-project analysis questionnaires will each generate and e-mail to you
    a full report for your proposed system, calculating the size of system you require
    and providing a cost estimate.


    Of course, there is a limit to how much a set of online tools can help. You will
    still need to carry out a survey and go through components selection and detailed
    design yourself, but these tools will allow you to try different configurations
    and play out “what if” scenarios quickly and easily.


    # Solar energy and emotions


    Design can often seem to be a purely analytical and rational process. It should
    not be. All great designs start with a dream.


    For many people, choosing solar energy is often an emotional decision. They want
    a solar energy system for reasons other than just the purely. Some people want
    solar energy because they want to ‘do their bit’ for the environment, others want
    the latest technology, or want to use solar simple because it can be done. Others
    want solar energy because they see the opportunity to earn money. I suspect that
    for most people, the reasons are a combination of the above.


    It is important that the emotional reasons for wanting something are not ignored.
    We are not robots and our emotions should be celebrated, not suppressed. The Wright
    brothers built the first aircraft because they wanted to reach the sky. NASA sent
    a man to the moon because they wanted to go further than anyone had ever done
    before. Neither undertaking could be regarded as purely rational; they were the
    results of big dreams.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'It is important to acknowledge that there are often hidden reasons for wanting
    solar energy. Sadly, these reasons often do not make it onto a sheet of paper
    in a design document or onto a computer spreadsheet. Sometimes, the person making
    the decision for buying solar energy is secretly worried that if they voice their
    dreams, they will appear in some way irrational.


    The reality is that it is often a good thing if there is an emotional element
    to wanting a solar energy system. By documenting these reasons, you will end up
    with a better solution. For instance, if the environmental benefits are top of
    your agenda, you will use your solar energy system in a different way to somebody
    who is looking at solar purely as a business investment.


    By acknowledging these reasons and incorporating them into the design of your
    system, you will end up with a far better system. Not only will you have a system
    that works in a practical sense, but you will also achieve your dream.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# # Scoping the Project


    As any project, before you start, you need to know what you want to achieve. In
    fact, it is one of the most important parts of the whole project. Get it wrong
    and you will end up with a system that will not do what you need it to.


    It is usually best to keep your scope simple to start with. You can then flesh
    it out with more detail later.


    Here are some examples of a suitable scope:


    +   * To power a light and a burglar alarm in a shed on an allotment

    * To provide power for lighting, a kettle, a radio and some handheld power tools
    in a workshop that has no conventional connection

    * To provide enough power for lighting, refrigeration and a TV in a holiday caravan

    * To provide lighting and power to run four laptop computers and the telephone
    system in an office during a power cut

    * To change up an electric bike between uses

    * To provide an off-grid holiday home with its entire electricity requirements

    * To reduce the carbon footprint of a house or business

    * To run an electric car entirely on solar


    From your scope, you can start this to find out some initial estimates on power
    requirements.


    As mentioned in the previous chapter, I have created two Solar Project Analysis
    tools, for grid-tie systems and off-grid systems. You can find both these tools
    on my website Solar.ElectricityHandbook.com. You will still need to collect the
    basic information to work with, but all the hard work is done for you. You will
    need to produce a complete project scope, work out the likely performance of your
    solar energy system and provide ballpark estimates.


    For the next few chapters, I am going to use the example of providing a small
    off-grid holiday home with its entire electricity requirements.


    This is a big project. If you have little or no experience of solar electric systems
    or household electricity you would be best starting with something smaller. Going
    completely off-grid is an ambitious project, but for the purposes of teaching
    solar electric system design, it is a perfect example as it requires a detailed
    design that covers all aspects of designing a solar energy system.


    # # Designing grid-tie or grid fallback systems


    For our sample project, grid-tie is not an option as we are using solar power
    as an alternative to connecting our system to the electricity grid.


    However, grid-tie is a popular option, especially in the United States and across
    Europe. This was, in part, due to the generous subsidies offered over the past
    years. Most of these have come to an end or have been significantly reduced, grid-tie
    remains popular with businesses and home-owners.


    In terms of scoping the project, it makes little difference whether you are planning
    a grid-tie or grid fallback system or the steps you need to go through are the
    same. The only exception, of course, is that you do not need to consider battery
    efficiencies with grid-tie.


    The biggest difference with a grid-tie or grid fallback system is that you do
    not have to rely on your solar system providing you with all your electricity
    requirements as you will not be plunged into darkness if you use more electricity
    than you generate.


    This means you can start with a small grid-tie or grid system and expand it as
    funds allow.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Despite that, it is still a good idea to go through a power analysis as part
    of the design. Even if you do not intend to produce all the power you need with
    solar, having a power analysis will allow you to benchmark your system and help
    you size your grid-tie system if you aim to reduce your carbon footprint by providing
    the electricity companies with as much power as you can buy.


    Most grid-tie systems are sized to provide more power than you need during the
    summer and less than you need during the winter. Over a period of a year, the
    aim is to generate as much power as you use, although on a month-by-month basis
    this may not always be the case.


    Many solar companies can tell you this provides you with a ‘carbon neutral’ system
    as you are selling your excess power to the electricity companies and buying the
    same amount of electricity when you need it.


    If this is what you are planning to do with your grid-tie system, your scope is
    much simpler. You need to get your electricity bills for the past year and make
    a note of how much electricity you have used over the year. Divide this figure
    by the number of days in the year to work out a daily energy usage and ensure
    your system generates this as an average over the period of a year.


    Because you are not generating electricity during the winter months in a carbon
    neutral grid-tie system, you need fewer solar panels than you would need to create
    an entirely stand-alone system.


    # Comparing supply with demand


    If you are designing a grid-tie system, it can be interesting to compare the supply
    of solar energy with your electricity usage pattern. By comparing supply with
    demand, you can see how closely solar energy production matches your usage and,
    in turn, can be used as an indicator to identify how environmentally beneficial
    solar energy is for.


    To do this, you need to ascertain your monthly electricity usage for each month
    of the year. Your electricity supplier may already provide you with this information
    on your electricity bill. If not, you should be able to request this from them.


    Once you have this information, visit www.SolarElectricityHandbook.com and fill
    in the Grid-Tie Solar Project Analysis, including your individual monthly consumption
    figures. In the report that is e-mailed to you, you will see a chart that how
    to see your electricity usage maps onto solar production.


    This report will also provide you with an approximate estimate for the carbon
    footprint for each kilowatt-hour of electricity you produce from your solar array,
    based on the production and installation of your solar array and the likely amount
    of energy it will generate during its lifetime.


    Based on this, it is possible to see whether solar energy is likely to produce
    real-world environmental savings.


    # Fleshing out the scope


    Now we know the scope of our project, we need to quantify exactly what we need
    to achieve and work out some estimates for energy consumption.


    Our holiday home is a small two-bedroom cottage with a solid fuel ever and boiler.
    The cost of connecting the cottage to the grid is £4,100 (around $6,520) and I
    suspect that solar power could work significantly cheaper.


    The cottage is used in the spring, summer and autumn, with only a few weekend
    visits during the winter. Electricity is required for lighting in each room, a
    courtesy light in the porch, a fridge in the kitchen and a small television in
    the sitting room. There also needs to be surplus electricity for charging a mobile
    phone or MP3 player and for the occasional use of a laptop computer.


    Now we have decided what devices we need to power, we need to find out how much
    energy each device needs and estimate the daily usage of each item.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'To keep efficiency and costs low, we are going to work with low-voltage electricity
    wherever possible. The benefits of using low-volt devices rather than higher grid-voltage
    AC are twofold:


    +   - We are not losing efficiency by converting low-volt DC electronics to grid-voltage
    AC electrics through an inverter.


    +   - Many electronic devices, like smaller televisions, music systems, computer
    games consoles and laptop computers, require a transformer to reduce the power
    down to a low DC current, creating a second level of inefficiency


    Many household devices, like smaller televisions, music systems, computer games
    consoles and laptop computers, have external transformers. It is possible to buy
    transformers that run on 12-volt or 24-volt electric than the AC voltages we get
    from the grid. This is the most efficient way of providing low-voltage power to
    these devices.


    There can be disadvantages of low-voltage configurations, and they are not the
    right approach for every project:


    +   - If running at 12-24 volts requires a significant amount of additional rewiring,
    the cost of carrying the out the rewiring can be much higher than that of an inverter
    and a slightly larger solar array


    +   - If the cable between your batteries and your devices is too long, you will
    get more power losses through the cable at lower voltages than you will at higher
    voltages


    If you already have wiring in place to work at grid-level voltages, it is often
    more appropriate to run a system at grid voltage, than rewiring the whole system
    at low voltage. If you have no wiring in place, running the system at 12 or 24
    volts is even more suitable.


    # Producing a power analysis


    The next step is to investigate your power requirements by carrying out a power
    analysis, where you measure your power consumption in watt-hours.


    You can find the wattage of household appliances in one of ways:


    +   - Check the rear of the appliance, or on the power supply

    - Check the product manual

    - Measure the watts using a watt meter

    - Find a ballpark figure for similar items


    Often a supply will show an output current in amps rather than the number of watts
    the device consumes. If the power supply also shows the output wattage, you can
    work out the wattage by multiplying the voltage by the current (amps):


    Power (watts) = Volts x Current (amps)

    nP = V x I


    For example, if you have a mobile phone charger that uses 1.2 amps at 5 volts,
    you can multiply 1.2 amps by 5 to work out the number of watts. In this example,
    it equals 6 watts of power. If I plugged this charger for one hour, I would use
    6 watt-hours of energy.


    A watt meter, like the example shown below, is a useful tool for measuring the
    energy requirements of any device that runs on high-voltage AC power from the
    grid. The watt meter plugs into the wall socket and the appliance plugs into the
    watt meter. An LCD display on the watt meter displays the amount of power the
    device is using. This is the most accurate way of measuring your true power consumption.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_39_0.png)


    A ballpark figure for similar devices is the least accurate way of finding out
    the power requirement and should only be done as a last resort. A list of power
    ratings for some common household appliances is included in Appendix A.


    Once you have a list of the power requirements for each electrical device, draw
    up a table listing each device, whether the device uses 12-volt or grid voltage,
    and the power requirement in watts.


    Then estimate how long you will use each device each day and multiply the watts
    by hours to create a total watt-hour energy requirement for each item.


    You should also factor in any ''phantom loads'' on the system. A phantom load
    is the name given to devices that use power even when they are switched off. Televisions
    in standby mode are one example, but any device that has a power supply built
    into the plug also has a phantom load. These items should be unplugged or switched
    off the when not in use. However, you may wish to factor in a small amount of
    power for items in standby mode, to factor in the times you forget to switch something
    off.


    If you have a gas-powered central heating system, remember that most central heating
    systems have an electric pump and the central heating controller will require
    electricity as well. A typical central heating pump uses between 25 and 60 watts
    of power, which can easily add up to 500-800 watt-hours per day, while a central
    heating controller can use between 2 and 24 watt-hours a day.


    Once complete, your power analysis will look like this:


    | Device | Voltage | Power (watts) | Hours per day | Watt-hours per day |

    |---|---|---|---||

    | Living room | 12V | 11W | 5 | 55Wh |'
  merge: -1
  pgno: 39
- img_proc: true
  md: '| lighting | 12V | 11W | 2 | 22Wh |

    |---|---|---|---|---|n| Hallway lighting | 12V | 8W | ½ | 4Wh |

    | Bathroom lighting | 12V | 11W | ½ | 17Wh |

    | Bedroom 1 lighting | 12V | 11W | 1 | 11Wh |

    | Bedroom 2 lighting | 12V | 11W | ½ | 17Wh |

    | Porch light | 12V | 8W | ½ | 4Wh |

    | Small fridge | 12V | 24W | 288Wh |

