    # # Grant Schemes, Low Interest Loans and Tax Rebates


    Grant schemes, low interest loans and tax rebates are paid directly out of government
    funds. Consequently, they can be unpopular with some politicians and the wider
    electorate, who often resist tax-payers money being used as a green energy subsidy.


    Grants for installing solar are becoming rarer, although a few schemes are still
