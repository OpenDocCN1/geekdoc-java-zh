    # # Hydrogen Sensors and Alarms


    While venting hydrogen is not a big issue, the consequences of getting it can
    be huge. If you have a battery box with adequate ventilation, the likelihood of
    a hydrogen explosion is remote. Furthermore, most hydrogen explosions are tiny
    (rarely more than a pop). However, a large quantity of hydrogen building up in
    a room or inside a battery enclosure can have catastrophic consequences.


    To reduce this, if you are installing lead acid batteries in a building, or in
    a boat or recreational vehicle, consider installing two alarms - one at the top
    of the battery enclosure and one at the ceiling in the room. These alarms will
    trigger if the hydrogen concentration goes beyond 1% (hydrogen is not dangerous
    in air). If the alarm triggers, you need to disconnect the battery pack and ventilate
    the area before there is any danger. With a smoke alarm in your home, the likelihood
    you will need them is remote. But the peace of mind they can provide is huge.


    # # Solar controller


    The solar controller looks after the batteries and stops either being overcharged
    by the solar array or overloaded by the devices running off them.


    Many solar controllers also include an LCD status screen so you can check the
    current charge and see how much power the solar array is generating. More expensive
    solar controllers may have the option of a WiFi or Bluetooth link and an app to
    run on your mobile phone, so you can monitor the performance of your system.


    Your choice of solar controller will depend on following:


    +   - System voltage

    - The type of batteries you are using (particularly important if you plan to use
    lithium batteries)

    - The current of the solar array (measured in amps)

    - The maximum current of the load (measured in amps)

    - The level of detail you require from the status display


    All the very cheap solar controllers provide basic information on an LCD screen
    that allows you to see how much power you have generated to how much energy you
    are using and can also show the current charge stored in the battery. Some controllers
    include more detailed information that allow you to check daily how your power
    generation and usage compares.


    # # Balancing the batteries


    Another important function of a solar controller is to manage the charge in each
    battery and ensure each battery is properly charged.


    As batteries get older, the charge of each battery will start to vary. This means
    that some batteries will charge and discharge at different rates to others. If
    over time, the overall life of the batteries will deteriorate.


    Intelligent solar controllers can manage these variations by balancing, or equalizing,
    the batteries they are charging. Most controllers, you need to manually activate
    a balance as a routine inspection.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Allow for expansion


    When looking at solar controllers, it is worth buying one with a higher current
    rating than you need.


    This allows you extra flexibility to add additional loads or additional panels
    to your solar array in the future without the additional additional expense of
    replacing your solar controller.


    # Maximum power point tracking


    More expensive solar controllers incorporate a technology called maximum power
    point tracking (MPPT). An MPPT controller adjusts the voltage received from the
    solar array to provide the optimum voltage for charging the batteries without
    significant loss of watts from the voltage conversion.


    If you have an MPPT controller, you can capture around 20% of the power generated
    by the solar array compared to a more basic controller.


    If you have less than 120W of solar panels, it can work out cheaper to buy solar
    panels rather than spend the extra money on an MPPT controller. However, prices
    continue to fall and, and if you have the choice, a controller with maximum power
    point tracking is a worthwhile investment.


    # Ground fault protection


    Many solar controllers include ground fault protection. In the case of a short
    from the solar array, a Residual Current Device (RCD) will cut off the current
    flow between the solar array and the controller, averting the risk of damage to
    either the controller or the solar array.


    In the United States and Canada, RCDs are also known as Ground Fault Interrupters
    (GFIs).


    For any larger than 100-watt solar panel systems, and for all systems mounted
    to a building, you need to incorporate a separate RCD/GFI into your system if
    you do not have ground fault protection built into your controller.


    # Backup power


    Some controllers have the capability to start an emergency generator if the batteries
    run too low and the solar array is not providing enough power to cope with the
    load. This can be a useful facility for sites where the system must not fail at
    any time, or for coping with unexpected loads.


    While this may not seem so environmentally friendly, many generators are now available
    that run on bio-diesel or bio-ethanol. Alternatively, you can use an environmentally
    friendly fuel cell system instead of a generator. This tends to run on bio-methanol
    or use clean energy and water oxygen.


    # Using multiple controllers


    Sometimes it is better to have multiple controllers on your solar energy system.
    For instance, you may want to install panels in different locations or facing
    in different directions, or if you have mismatched solar panels that you want
    to use (see page 136 for a block diagram).


    Multiple controllers are not option with lithium-ion batteries but can be a useful
    solution with lead acid batteries. If you need to use multiple controllers, only
    one needs to have the expensive features such as battery balancing. The other
    controllers can be much simpler regulators that simply provide an additional charge
    to the batteries and switch when the batteries are fully charged.


    An alternative solution to multiple controllers is to have one controller that
    can handle feeds from more than one solar array. This can work well if you only
    need two strings of solar panels or are working with lithium-ion batteries.


    # Inverters


    We are not using an inverter with our holiday home, but many solar applications
    require an inverter to switch the voltage to grid-level AC current.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'An inverter for stand-alone systems is a different piece of equipment to a
    grid-tie solar inverter. With a grid-tie inverter, your power is feeding into
    the grid and must in conjunction with the grid. The inverter connects directly
    to your solar panels and switches off when the solar panels no longer produce
    energy.


    With a stand-alone system, your power is entirely separate from the grid. The
    inverter connects to your battery bank and switches off when the battery bank
    is running low on charge.


    There are three things to consider when purchasing an inverter:


    +   - Battery bank voltage

    - Power rating

    - Waveform


    # Battery bank voltage


    Different inverters require a different input voltage. Smaller inverters, providing
    up to 3kW of power, are available for 12-volt systems. Larger inverters require
    higher voltages.


    # Power rating


    The power rating is the maximum continuous power that the inverter can supply
    to all the loads on the system. You can calculate this by adding the wattages
    of all the devices that are switched on at any time. It is worth adding a margin
    for error to this figure. Inverters will not run beyond their maximum continuous
    power for long periods.


    Most inverters have a peak power rating as well as a continuous power rating.
    This peak power rating allows for additional loads for short periods of time,
    which is useful for some electrical equipment that uses an additional burst of
    power when switched on (refrigeration equipment, for example).


    Always go for a bigger power rating than you actually need. Inverters get hot
    when they get close to their maximum load for long periods of time. Many professionals
    recommend that you buy an inverter that has a continuous power rating is at least
    one third higher than you plan to use.


    # Waveform


    Waveform relates to the quality of the alternating current (AC) signal that an
    inverter provides.


    Lower-cost inverters provide a modified sine wave (sometimes advertised as a quasi-sine
    wave). More expensive inverters provide a pure sine wave.


    Modified sine wave inverters tend to be considerably cheaper and tend to have
    a higher peak power rating.


    However, some equipment may not operate correctly with a modified sine wave. Power
    supplies, such as those used for laptop computers and portable televisions, may
    not work at all, while some systems emit a buzz when run from a modified sine
    wave inverter.


    These faults are eliminated with a pure sine wave inverter, which produces AC
    electricity with an identical waveform to the standard domestic electricity supply
    provided by the grid.


    # Combined Controller/Inverters


    It is now possible to combine controller/inverter systems that manage the battery
    system and create AC power. They have two main benefits over individual controllers
    and inverters:


    +   - There is one system managing the batteries, rather than two

    - Reduced wiring complexity


    # Installation options and operating environment


    Small inverters with a continuous power rating of less than 3kW are lightweight
    units and are often simply placed on a shelf or a desk. Medium-sized inverters
    tend to be heavy units that need to be mounted securely on a wall. Larger inverters,
    rated at 10kW or above, may be bolted to the floor.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Many inverters generate a significant amount of heat, especially when running
    close to their rated output, and require good airflow around the unit.


    Most off-grid inverters are designed to be installed. Outdoor inverters are available,
    but they are expensive and may be difficult to source. If you are looking at installing
    an inverter outdoors, check that the inverter is sealed against dust and water
    ingress, rated to at least IP64.


    Overheating inverters is the number reason for any solar system failing. As an
    inverter gets hotter, it may provide less power, and if the temperature continues
    to rise they will eventually shut down to avoid damage. When choosing an inverter,
    check its operating temperatures and consider how you can ensure your system remains
    within these limits.


    Inverters should be installed in a well-ventilated area, away from the ceiling
    and with a clearance each side, the top and the bottom. They cannot be installed
    in a sealed cupboard. Some inverters have the option of an external heat sink,
    or temperature-controlled cooling fans to keep the inverter cool.


    If your inverter is producing more than 500 watts it is likely to have a very
    small amount of noise. This is typically a continuous-low hum. This is usually
    noticeable if the surrounding area is quiet. However, for reason, inverters are
    not usually installing the living space in a room or in an office. Instead, consider
    installing your inverter in a garage, or on an outside wall of your building.


    Occasionally, with larger inverters, the sound made by the inverter has been known
    to resonate with the wall, or the wall of a garage. This is a rare occurrence
    but it is likely if you are planning to mount your inverter onto an outside wall
    made of solid contact. The solution is to dampen the mounting between the inverter
    and the wall. There is a very effective called Green Glue, produced by the Green
    Glue Company (www.GreenGlueCompany.com) that is applied between the wall and the
    inverter. When it is compressed by remouting the inverter, the glue spreads out
    to form a sound barrier that is particularly effective at blocking low-resonance
    vibrations.


    # Bigger inverter systems


    The sky is the limit with inverter sizes: I have personally worked with multiple
    inverter systems that can generate a megawatt in power. Three phase inverters
    are available, as inverters that can work at much higher voltages up to 33,000
    volts in some cases. Some of these inverters are designed to work only in conjunction
    with the grid, whilst are ''grid forming'', creating their microgrid.


    Many of these inverters are designed to work in parallel, so that you can scale
    them up to your requirements. Some systems, such as the Victron Quattro or SMA
    Sunnyboy systems give you a huge amount of flexibility; you can configure your
    system so that it runs in conjunction with the grid, or forms its own microgrid
    if there is no grid connection. They can dynamically switch between the two if
    you wish. You can use three inverters to create a three-phase output. You can
    use multiples of these inverters to increase power generation from 3kW up to 200kW
    and beyond. You can choose to export energy back to the grid or reserve it for
    your own use.


    Whilst these inverters are not typically designed for home use, they do uses in
    industry, or for specialist applications for backup power or supporting a weak
    or unreliable grid.


    # Ground fault protection


    Most inverters now include ground fault protection. All inverters must be grounded.
    If your chosen grid-tie inverter does not incorporate ground fault protection,
    you need to incorporate this into your system using a Residual Current Device
    (RCD). RCDS are known as Ground Fault Interrupters (GFIs) in the United States
    and Canada.


    # Cables


    It is easy to overlook them, but cables have a vital part in ensuring a successful
    solar electric system. There are three different sets of cables that you need
    to consider:'
  merge: -1
  pgno: 109
- img_proc: true
  md: '+   - Solar array cables

    - Battery cables

    - Appliance cabling


    Solar array cabling has already been discussed (page 114). For stand-alone systems,
    the battery and appliance cabling also needs to be correctly specified.


    For all cabling, make sure that you always use cable that can cope with the maximum
    amount of current (amps) that you are planning to work with.


    Remember that you may wish to expand your system at some point in the future.
    Use a higher ampere cable than you need to make future expansion as simple as
    possible.


    # Battery cables


    Battery cables are used to connect batteries to the solar controller and to the
    inverter. They are also used to connect multiple batteries together.


    Battery interconnect cable is available ready-made up from battery suppliers,
    or you can make them up yourself. You should always ensure that you use the correct
    battery to connect a cable to a battery.


    # Appliance cabling


    If you are using an inverter to run your appliances at grid-level voltage, you
    can use standard domestic wiring, in the same way as you would wire them for connection
    to AC power.


    If you are running cabling for 12-volt or 24-volt operation, you can connect your
    devices using the same wiring structure as you would use for grid-level voltage,
    although you may need to use larger cables to cope with the higher current.


    In a house, you would typically have a number of circuits for electrical equipment.
    One for downstairs, one for upstairs lights, one for an electric cooler and two,
    three for appliances, depending on the size of the house. This has the benefit
    of keeping each individual cable run as short as possible, as well as reducing
    the current that each circuit needs to handle.


    As we have learned, low-voltage systems lose a significant amount of power through
    cabling. The reason for this is that the current (amps) is much higher and the
    power loss through the cable is proportional to the square of the current. You
    therefore need to keep your cable runs as short as possible, especially the cable
    runs with the highest current throughput.


    I have already mentioned how you can calculate suitable cable thicknesses for
    your solar array earlier in this chapter. Use the same calculation for calculating
    cable thicknesses for appliance cabling.


    # Plugs and sockets


    For 12-volt or 24-volt circuits with a current of less than 20 amps, you can use
    the standard switches and lights sockets as you do for normal domestic power.


    However, you must not use the domestic plugs and sockets for attaching low-voltage
    devices to your voltage circuit. If you do, you run the risk that your low-voltage
    devices could accidentally be plugged into a high-voltage circuit, which could
    have disastrous consequences.


    Instead, you have the choice of using non-standard plugs and sockets or of using
    the same 12-volt plugs and sockets as used in caravans and boats. These low-voltage
    sockets do not need to have a separate earth ground, as the negative cable should
    be earthed (grounded) on a DC circuit system.


    # Appliances


    So far, I have talked about 12-volt appliances, but you can buy most low-voltage
    appliances for either 12-volt or 24-volt and a lot of them are switchable between
    12 and 24 volts.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'Compared to appliances from grid-level voltages, you often pay more for low-voltage
    appliances. This is not always the case, however, and with careful shopping around,
    items like televisions, DVD players, radios and laptop computers need not cost
    anything more than buy standard versions.


    # Lighting


    12-volt and 24-volt lighting is often chosen for off-grid solar systems, due to
    the lower power consumption of the lower-voltage lighting. You can buy low-voltage,
    energy-saving bulbs and strip lights, both of which provide the same quality of
    light as conventional lighting. LED lights have vastly improved over the past
    five years, giving an excellent quality of light and using very little power.
    Filament bulbs are also available in lowvoltage forms, and although these are
    not very energy-efficient, they provide an excellent quality of light.


    You can buy of 12-volt lighting from ordinary hardware stores. Many kitchen and
    bathroom lights work at low voltage and work just well from a 12-volt battery
    supply as they run from the 12-AC transformers typically used with this lighting.
    Diach fluorescent lamps, halogen spots, strip lamps and LED lights often at 12
    volts give you an excellent choice. Buying these from a hardware store rather
    than from a specialist supplier can also save a considerable amount of money.


    # Refrigeration


    A selection of refrigerators are available that will run from 12-volt and 24-volt
    power supplies. Some refrigerators will run on low-voltage DC and grid-level AC
    voltage, and some can run from a bottled gas supply as well.


    Unlike other devices you use, refrigerators need to run all the time. This means
    that, although power consumption can be low, the overall energy consumption is
    comparatively high.


    There are three types of low-voltage refrigerator appliance:


    +   * **Absorption fridges** are commonly found in caravans and use 12-volt, grid-level
    voltage and bottled gas to power the fridge. These are very efficient when powered
    by gas, but efficiency when powered on lower voltage varies considerably for different
    models

    * **Peltier effect coolers** are not really fridges in their own right; they are
    portable coolers, of the type often seen in car shops and 12-volt in-accessory
    shops. Whilst these are cheap, most of them are not very efficient. Avoid using
    these for solar applications

    * **Compressor fridges** use the same technology as refrigerators in the home.
    They are the most efficient for lowvoltage operation. They are more expensive
    than other types but their efficiency is significantly better. Many models now
    consume less than 5 watts of electricity per hour


    You can choose to use a standard domestic fridge for solar power check the supplier
    of your inverter to make sure the inverter is suitable. However, they are typically
    not as efficient as a 12-volt/24-volt compressor. Domestic fridges tend to have
    a very high starting current, which can cause problems with inverters.


    A few manufacturers now produce refrigerators that are specifically designed to
    work with solar power. Companies such as Waeco, Sundander and Shoreline produce
    a range of refrigerators and freezers suitable for home, medical and business
    use.


    If you wish to use a standard domestic fridge, speak the supplier of your inverter
    to make sure the inverter is suitable. Many refrigerators have a very high start-up
    current and you may need to buy a larger inverter that can handle this demand.


    # Microwave ovens


    Standard domestic microwave ovens consume more power than their rated power as
    their official rated output is output, not input. You will find the input power
    on the power label on the back of the unit, or you will be able to measure it
    using a watt meter.


    Typically, the input power for a microwave oven is 50% higher than its rated power.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'Low-voltage microwave ovens are available, often used in caravans (travel trailers)
    and recreational vehicles (RVs). They tend to be slightly smaller than normal
    domestic microwaves and have a lower power rating, so cooking times will increase,
    but they are much more energy-efficient.


    # Televisions, DVDs, computer games consoles and music


    Flat screen LCD and DVD players designed for 12-volt or 24-volt operation are
    available from boating, camping and leisure stores. These tend to be quite expensive,
    costing as much as 50% more than equivalent domestic televisions and DVD players.


    However, many domestic TLC (with screens up to 24-inch) and DVD players often
    have external power supplies and many of them are rated for a 12-volt input. Some
    investigations at your local electric store will allow you to identify suitable
    models.


    If you want to use one of these, it is worth buying a 12-volt power regulator
    to connect between the television and your battery. Batteries vary between 11.6
    volts and 13.6 volts, which is fine for most equipment designed for 12-volt electronics,
    but could damage more sensitive equipment. Power regulators fix the voltage at
    exactly 12 volts, ensuring that this equipment can be damaged by fluctuations
    in voltage.


    Many power regulators will also allow you to run 12-volt devices from a 24-volt
    circuit, and are much more efficient than traditional transformers.


    Power regulators also allow you to switch from one voltage to other voltages,
    if required. For example, the Sony PlayStation 3 games console uses 8.5 volts,
    and with a suitable power regulator you can power one effectively from 12-volt
    batteries.


    Power regulators can step up voltages as well as step down. A suitable power regulator
    can switch the voltage from a solar battery bank to an output voltage between
    12½ and 40 volts, depending on the specification of the regulator.


    This means that many household items with external power supplies, such as smaller
    televisions, laptop computers, DVD players, music systems and computer games,
    but name a few, can be connected directly to your solar power system.


    # Music systems


    Like televisions and DVD players, many music systems have an external power supply,
    and a power regulator can be used in place of the external power supply to power
    a music system.


    Alternatively, you can build your own built-in music system using in-car components.
    This can be very effective, in terms of sound quality and with the added benefit
    that you can hide the speakers in the ceiling.


    Using a music system with an inverter that has a modified sine wave can be problematic.
    Music systems designed to run at grid-level voltages to work on a pure sine wave
    system may buzz or hum if used with a modified sine wave inverter.


    # Dishwashers, washing machines and tumble dryers


    Dishwashers, washing machines and tumble dryers tend to be very hungry. There
    are small washing machines, twin tubs and cool-air dryers available run on low
    voltage, but these are really only suitable for small amounts of washing. They
    may be fine in a holiday home or in a small house for one person, but are not
    suitable for the weekly use of a family of four.


    If you need to run a washing machine from a solar electric system, you are going
    to need an inverter to run it. The amount of energy that washing machines consume
    really vary from one to the next. An energy-efficient model may only use 1,100
    watts, whereas an older model may use almost three times that.


    The same is true for dishwashers. Energy-efficient models may only use 500 watts,
    whereas older models may use near 2,500 watts. If you need to run a dishwasher,
    you will need to use an inverter.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Tumble dryers are hugely inefficient and should be avoided if possible. Most
    of them use between 2,000 and 3,000 watts of electricity and run for at least
    one hour per drying cycle.


    There are various alternatives to tumble dryers. These range from the traditional
    clothes line or clothes airer to the more high-tech low-energy convection heating
    dryers that can dry your clothes in half an hour with minimal amounts of power.


    If you must have a tumble dryer, you may wish to consider a bottled gas tumble
    dryer. These are more energy-efficient than electric tumble dryers and will not
    put such a strain on your solar electric system.


    # Air conditioning systems


    Over the past couple of years, several manufacturers have been launching solar
    powered air conditioning and cooling systems. Air conditioning has traditionally
    been very hungry. For this reason, solar powered air conditioning has been unaffordable,
    a large solar array has been required simply to run the compressors.


    In response, manufacturers have developed more efficient air conditioning systems,
    designed to run from a DC power source. Companies such as Solar AC, Securus, Sunsource,
    Sedna Air, Hitachi and LG all supply air conditioning units designed to work with
    solar energy.


    Other manufacturers have developed evaporative coolers that use a fraction of
    the power of an air conditioning unit. Whilst these air coolers do not provide
    the ''instant chill'' factor of a full air conditioning system, by running constantly
    when the sun is shining, they can provide very comfortable living and working
    environment at a fraction of the cost of full air conditioning.


    # Reputable name and brands


    Most manufacturers are not household names, and as such it is difficult for some
    outside the industry to know which brands have the best reputation.


    Of course, this is a subjective list and since because a manufacturer does not
    appear on this list, it does not mean the brand, or the product is not good.


    # Solar panel manufacturers and brands


    Canadian Solar, Clear Skies, EP, Evergreen, G.E. Electric, Hitachi, ICP, JA Solar,
    Samsung, Sanyo, Sharp, Suntech, Trina, Uni-solar.


    # Solar inverter manufacturers and brands


    Apollo Solar, Blue Sky, Enphase, Ever Solar, Exletech, Frunius, Kato, Magnum,
    Mastervolt, Morningstar, Outback, PowerFilm, PWed, SMA, Solarlecta, Sterling,
    Stella, SMA SunnyBoy, Vic, Xantre.


    # Battery manufacturers and brands


    East Penn, Chloride, Crown, EnerSys, Elite, Giant, GreenPower, ManBatt, Newmax,
    Northstar, Odyssey, Optima, Panasonic, Wagner, Tanya, Trojan, US Battery, Yuasa.


    # Shopping list for the holiday home


    Because our electric system is being installed in the garden, 10 metres (32 feet)
    away from the house, we have worked out that we need to run our system at 24 volts
    rather than 12 volts, due to the higher levels of losses in the system.


    I have already calculated that I need 320 watts of power from my solar array at
    24 volts. To achieve this, I need to connect at least two 12V solar panels to
    create a minimum of 24V for my system, or use one larger 24V panel.


    There are various options available to make a 320-watt, 24-volt solar array. After
    checking with several suppliers, I have come up with the following options:


    +   - Buy one 320Wp solar panel for a total of 320 watts of power – total cost
    £120 ($155 US)'
  merge: -1
  pgno: 113
