  md: 'For a roof-top installation, if the average temperature at a particular time
    of year is 25°C/77°F or above, multiply this temperature in Celsius by 1.4 to
    get a likely solar panel temperature. For a pole-mounted installation, multiply
    your air temperature by 1.2 to calculate the likely solar panel temperature. Increase
