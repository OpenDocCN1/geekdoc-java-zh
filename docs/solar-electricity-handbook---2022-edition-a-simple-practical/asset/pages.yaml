- img_proc: true
  md: '+   The built inverter can only take a power demand between 600 and 800 watts.
    More than this at any one time and you start taking electricity from the grid
    to make up the shortfall. So if you want to boil a kettle, cook in an electric
    oven or on an electric hob or power an electric heater, you will not be using
    your battery system to provide all the power.


    Commercially available battery systems are very expensive, three to four times
    the cost of designing and building your own. Economically, their benefits are
    rarely justifiable unless significant grants are available to help their adoption.
    Such benefits are available in California, with the Self-Generation Incentive
    Program (SGIP) and Hawaii, with their self supply tariff.


    # Designing and building your battery pack


    There are a lot of choices when choosing a battery system. Traditionally, lead
    batteries were used for energy storage, while most recently lithium-ion batteries
    have become more popular, thanks to their lighter weight, more compact size and
    more flexible charging and discharging characteristics.


    Whatever battery system you decide, battery systems must be carefully designed
    in order to get the best performance. Poorly designed battery systems may work
    fine when installed, but are more likely to fail prematurely, leaving you with
    an unsteady system and the cost of replacing failing batteries.


    Lead acid batteries usually come as 2-volt, 6-volt or 12-volt batteries, lithium
    batteries usually come as 3.2V, 12V, 24V or 48V packs. Batteries can be connected
    in series to increase the voltage, or in parallel to keep the same voltage but
    increase the capacity.


    The capacity of a battery is measured in amp-hours. The amp-hour rating shows
    how many hours the battery will take a specific drain; for instance, a 100-amp-hour
    battery has a theoretical capacity to power a 1-amp device for 100 hours, or a
    100-amp device for 1 hour.


    I say theoretical, because the reality is that all batteries provide more energy
    when discharged. A 100-amp-hour battery will often provide 20-25% less power if
    discharged over a five-hour period, compared to discharge over a twenty-hour period.


    No battery should be run flat. A minimum of 20% state of charge (SOC) should always
    be maintained in a battery to ensure the battery is not damaged. For overall battery
    life, you should design your system so that the battery charge rarely goes below
    50%.


    Incidentallyally, use use two different measurements to show the amount of energy
    remaining in a battery. Some manufacturers give a ''state of charge'' percentage,
    where 20% SOC means there is 20% energy remaining within the battery. Others give
    a ''depth of discharge'' percentage, where 20% DOD means that 20% of the energy
    has been taken out of the battery (i.e. there is 80% energy left in battery).
    When you are reading battery specifications, make sure you know which measurement
    is referred to.


    # Types of lead acid batteries


    There are four types of lead acid battery:


    +   - ''Wet'' batteries require checking and topping up with distilled water

    - Lead carbon batteries, require no maintenance and provide superior performance,
    but at a higher cost

    - AGM batteries require no maintenance but have a shorter overall life and are
    less suitable for demanding applications

    - Gel batteries are also maintenance-free and provide a good overall life. They
    can be placed on their side or used on the move


    In the past, most installers have recommended industrial quality ''wet'' batteries
    for all solar installations. These provide the best long-term performance and
    the lowest cost. Often called traction batteries as they are heavy-duty batteries
    used in electric vehicles), the latest designs can have a lifespan of 15–20 years
    for a solar installation.


    However, one of the latest innovations with lead acid batteries is the introduction
    of carbon to the negative plates inside the battery. These lead carbon batteries
    (also known as Lead Carbon or ALC batteries) have'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'significantly extended lifespan and performance of lead acid batteries, making
    them comparable to lithium batteries. Unlike lithium batteries, they can be charged
    and discharged more rapidly than other lead acid batteries. They continue to perform
    well at sub-zero temperatures and do not require expensive and complicated thermal
    management. The disadvantage of lead carbon batteries is that they have a higher
    voltage drop-off as the charge drops, which can cause problems for some applications.


    A lower cost option to the industrial-quality traction battery is the leisure
    battery, as used in caravans and boats. These are typically AGM batteries. Their
    lifespan is considerably shorter than traction batteries, requiring replacement
    after 5-6 years and less intensive in applications.


    Gel batteries can provide an excellent, maintenance-free alternative to wet batteries
    for smaller applications and the latest gel batteries suitable for higher-drain
    applications as well as smaller systems.


    Not all batteries are the same. From my experience, the very best battery manufacturers
    for solar energy installations are Trojan, Crown, Northstar and Enersys.


    # Types of Lithium-ion battery


    The benefits of lithium-ion batteries over lead acid batteries are they are lighter,
    take less space, can be regularly discharged to 20% state of charge and will not
    deteriorate as quickly as most lead acid batteries over time.


    Many of these advantages are diminishing when compared to the lead carbon batteries
    that can now match the lifetime of lithium-ion batteries at a significantly lower
    cost.


    Like lead batteries, lithium-ion batteries also come in different forms, the most
    common ones are:


    +   - Lithium-ion Cobalt Oxide (LiCoO2), usually called Lithium Cobalt, the cheapest
    batteries, often found in laptops and mobile phones. They have the shortest life
    and are not suitable for most solar energy storage applications.

    - Lithium-ion Manganese Oxide (LiMnO2), usually called Lithium Manganese which
    can be charged and discharged much quicker than Lithium Cobalt and have a longer
    life.

    - Lithium-ion Manganese Cobalt Oxide (LiMnCoO), usually called NMC batteries,
    and their close cousins the Lithium Nickel Cobalt Aluminum Oxide (LiNiCoOAO),
    or NCA batteries, which are the latest development of Lithium Manganese batteries.
    They have a high power density, meaning the battery stores more energy than batteries
    of the same size and weight. They are chemically most common batteries used for
    energy storage, but also used by Tesla in their electric vehicles.

    - Lithium-ion Phosphate (LiFePO4), usually called Lithium Phosphate, are heavier
    and bulkier than most lithium-ion batteries, but are also capable of providing
    larger amounts of power over short periods of time. They are less tolerant of
    low temperatures, performing poorly at freezing temperatures.


    There are other lithium-ion technologies, including Lithium Titanate, Lithium
    Salt, Lithium Graphite and Lithium Air, but these are either very specialist or
    still at the experimental stages.


    You may also hear about Lithium Polymer batteries, referred to as LiPo batteries.
    Lithium Polymer is not a chemistry by itself, rather is a way of manufacturing
    batteries in a pouch design. Most batteries advertised as Lithium Polymer batteries
    are Lithium Cobalt batteries.


    The biggest issue with all lithium-ion batteries is that they require careful
    management. Lithium ion batteries must be paired with a suitable battery management
    system (BMS) that manages the currents flows in'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'out of the battery, monitors internal battery temperatures and ensures the
    safety of the overall system.


    Lith ion batteries can be destroyed or damaged by incorrect charging or discharging.
    Most of them become unstable if they overheat, which can happen by charging or
    discharging the batteries too quickly, or by overcharging them when they are close
    to being fully charged, or by discharging them at a high voltage, or through a
    short-circuit. An unstable lithium-ion battery can catch fire or explode. Because
    all lithium-ion batteries contain oxygen, putting out a lithium-ion fire is difficult,
    and it can spread very quickly from one battery to the whole pack.


    Do not be tempted to mix and match lithium-ion batteries and charge controllers.
    The charge controller you purchase must have the capability of charging lithium
    batteries and match with the BMS in the battery. Furthermore, some of the cheap
    lithium-ion battery systems that are found on Ebay do not come with a BMS of their
    own or have an inadequate BMS that does not protect the batteries sufficiently,
    particularly if they are being charged using solar rather than from the manufacturers
    onion charger.


    If you are considering lithium-ion, it is vital that you choose a battery with
    good BMS, plus a solar controller that can operate with the lithium-ion battery
    pack you choose. It is common for solar controller manufacturers to provide their
    own lithium-ion battery packs or provide a list of improved lithium-ion batteries
    to work with.


    If considering a lithium-ion battery solution, you will need to ensure that you
    have the right environment to keep them in: they must be kept in conditions with
    an ambient temperature of 5° and 35°C (41°F–95°F).


    # Battery configurations


    You can use one or more batteries for power storage. Like solar panels, you can
    wire your batteries in parallel to increase their capacity or in series to increase
    their voltage.


    It is important that you use the same specification and size of batteries to make
    up your battery bank. Mixing battery capacities and types will mean that some
    batteries will never get fully charged and some batteries will be discharged more
    than they should. As a result, mixing battery capacities and types can significantly
    shorten the lifespan of the entire battery bank.


    # Battery lifespan


    Batteries do not last forever, and at some stage in the life of your solar electric
    system, you will need to replace them. Obviously, we want to have a battery system
    that will last as long as possible and so we need to find out about the lifespan
    of the batteries we use.


    There are two ways of measuring the lifespan of a battery, both of which tell
    you something different about the battery.


    +   - Cycle Life is expressed as a number of cycles to a particular depth of discharge

    - Life in Float shows how many years the battery will last if it is stored, charged
    regularly, but never used


    # Cycle life


    Every time you discharge and recharge a battery, you cycle that battery. After
    a number of cycles, the chemistry in the battery will start to degrade and eventually
    the battery will need replacing.


    The cycle life will show how many cycles the battery will last before they need
    to be replaced. The life is shown as a ''depth of discharge'' (DOD), and the manufacturers
    will normally provide a graph or a table showing cycle life versus depth of discharge.


    Typical types that you will see for cycle life may like this:


    | Lead Carbon battery | Lead Acid Gel battery | Lithium-ion battery |

    |---|---|---||

    | 20% DOD | 9,000 cycles | 2,000 cycles | 9,000 cycles |

    | 40% DOD | 6,000 cycles | 1,400 cycles | 6,000 cycles |'
  merge: -1
  pgno: 100
- img_proc: true
  md: '| 50% DOD | 5,000 cycles | 1,200 cycles | 5,000 cycles |

    | 80% DOD | 2,000 cycles | 700 cycles | 2,000 cycles |


    As you can see, the battery will last much longer if you keep your depth of discharge
    low. For this reason, it can be better to use a larger battery, or bank of batteries,
    rather than a smaller set of batteries. Most experts recommend that you install
    enough batteries to ensure that your system does not usually discharge your batteries
    50% of their capacity using lead acid batteries, or 75% of their capacity using
    lithium-ion.


    There are other benefits of large battery banks, to:


    +   * You have more flexibility with your energy usage: Even if you use more electricity
    for a few days than you originally planned for, you know you can do without running
    out of energy.

    * Batteries degrade over time: a battery reaching the end of its life may have
    70-80% of the capacity of a new battery. By over-specifying the battery pack,
    it won''t let you down in years to come as the batteries age.


    # Holdover


    When considering, you need to consider how long you want your system to work when
    the solar array is not providing any charge at all. This span is called *holdover*.


    Unless you live inside the Arctic or Antarctic Circles (which of both provide
    excellent solar energy during their respective summers), there is no such a day
    without sun. Even in the depths of winter, you will receive some charge from your
    solar array every day.


    You may find there days when the solar array does not provide all the energy you
    need. It is therefore important to consider how many days you want the batteries
    to be able to provide power, for the solar array not generating all the energy
    you need.


    For most applications, a figure between three days and five days is usually sufficient.


    In our holiday we are deliberately not providing enough energy for the system
    to run 24/7 during the winter months. During the winter, we want the batteries
    to provide enough power to last a long weekend. The batteries will then be recharged
    when the holiday home is no longer occupied and the solar panel can gradually
    recharge the system.


    For this purpose, we have erred on the side of caution and suggested a five-day
    holdover period for our system.


    # Calculating long a set of batteries will last


    Calculating how long a set of batteries will last for your application is not
    a precise science. It is impossible to predict the number of discharges, as this
    will depend on the conditions the batteries are kept in and how you use the system
    over a period of years.


    Nevertheless, we can come up with a good prediction for how long the batteries
    should last. This calculation will allow you to identify the type and size of
    batteries you should be using.


    First, write down your daily energy requirements. In the case of our holiday home,
    we are looking at a daily requirement of 695 watt-hours.


    Then, consider the holdover. In this case, we want to provide five days of power.
    If we multiply 695 watt-hours by 5 days, we get a storage requirement of 3,475
    watt-hours of energy.


    Batteries are rated in amp-hours rather than watt-hours. To convert watt-hours
    to amp-hours, we divide the watt-hour by the battery voltage.


    If we are planning to run our system at 12 volts, we divide 3,475 by 12 to get
    290 amp-hours at 12 volts. If we are planning to run our system at 24 volts by
    wiring two batteries in series, we divide 3,475 by 24 to get 145 amp-hours at
    24 volts.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'We do not want to completely discharge our batteries, this will damage them.
    So we need to look at our cycle life to see how many cycles we want. We then use
    this to work out the capacity of the batteries we need.


    On a daily basis during the spring, summer and autumn, we are expecting the solar
    to recharge the batteries every single day. It is unlikely that the batteries
    will be discharged by more than 10-20%. However, during the winter months, we
    will have a situation where the batteries get run down over a period of several
    days before the solar panels can get them back up again.


    For four months of the year, we need to take the worst-case scenario where the
    batteries may get discharged up to 80% of discharge over a five day period and
    then recharged by the solar.


    If we use lithium-ion or lead carbon batteries, the batteries will allow us to
    do this around 2000 times before they come to the end of their life. If we use
    use acid gel batteries, the cycle life is closer to 700 cycles.


    2,000 cycles multiplied by 5 days = 10,000 days = 700 cycles multiplied by 5 days
    = 3,500 days = 116 months. As this scenario will only happen during the four months
    from November to February, lead carbon or lithium batteries will last us for forty
    years before reaching the end of their cycle life, which will last almost twenty
    years.


    In reality, the Life in Float Figure (i.e the maximum shelf-life) for batteries
    is likely to be around twenty years, which in instance they will fail before they
    reach their cycle life.


    Based on our energy requirements of 145 amp-hours at 24 volts, and a maximum discharge
    of 80%, we calculate that we need a battery capacity of 145 ÷ 0.8 = 181.25 amp-hours
    at 24 volts.


    # Second-hand lead acid batteries


    There is a supply of second-hand lead acid batteries available. These are available
    as ex-UPS batteries (UPS = Uninterruptible Power Supplies) or ex-electric vehicle
    batteries.


    While these will not have the lifespan of new batteries, they can be extremely
    to buy, often selling at their scrap value. If you are working a tight budget
    and your power demands are not great, this is a very good way to save money.


    Bear in mind that the technology in lead acid batteries has improved massively
    over the past three years, which means that older batteries will have a much shorter
    cycle life and overall lifespan when compared with the latest technology batteries.
    However, if you can get second-hand batteries for scrap value, you are effectively
    getting energy storage for free, and that can be hard to argue!


    Do not ''mix and match'' different models and models of batteries. Use the same
    model and model throughout your battery bank. I would also advise against using
    a mixture of new and used batteries. This is a false economy as the life of new
    batteries may be compromised by the older ones. If you are considering second-hand
    batteries, find out how many cycles they have had and how deeply they have been
    discharged. Many UPS batteries have been hardly cycled and have rarely been discharged
    during their lives.


    If buying ex-electric vehicle batteries, remember they have a very hard life with
    heavy loads. However, electric vehicle batteries can continue to provide good
    service for lower-demand applications. If your load is less than 1kW and you have
    enough batteries to ensure they discharge slowly over several years, these batteries
    can provide good service.


    If possible, try and test second-hand batteries before you buy them. Ensure they
    are fully charged, and then use a battery tester to see how they perform.


    If your second-hand batteries have not been cycled many times, the chances are
    they will not have a very long cycle life when you first get them. To ''wake them'',
    connect a solar controller or an inverter to them and put a low-power device to
    the battery to drain it to around 20% state of charge. Change the battery up again
    using a trickle charge and repeat.


    After three deep cycles, you will have recovered much of the capacity of your
    second-hand batteries.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'If using second-hand batteries, expect them to provide half of their advertised
    capacity. So if they are advertised as 100-amp-hour batteries, assume they will
    only give you 50 amp-hours of use. In the case of ex-electric vehicle batteries,
    assume only one-third capacity.


    The chances are, they will give you more than this, but it is better to be happy
    with the performance of second-hand batteries than to be disappointed that they
    are not as new ones.


    # Second hand lithium-ion batteries


    Second hand lithium-ion batteries are also available, but these should be avoided
    unless you really understand what you are doing, or working with a lithium-ion
    professional who can configure the whole battery system for you. As lead acid
    batteries, buying second hand lithium ion batteries can save money, but it is
    an extremely area and not to be tackled in-depth battery system knowledge.


    # Building your battery bank


    Because we are running our system at 24 volts, we will need two-12-volt batteries
    in series to create our battery bank.


    We therefore need two 12-volt batteries of 181.25 amp-hours to create the desired
    battery bank.


    It is unlikely that you will go finding a battery of exactly 181.25 amp-hours,
    so we will need to find a battery that is at least 181.25 amp-hours in size.


    When looking for batteries, you will need to consider the weight of the batteries.
    A single 12-volt lead acid battery of that size will weigh in the region of 60kg
    (over 130 pounds), whilst a lithium-ion battery will weigh around 35-40kg (77-88
    pounds).


    Safely moving a battery of size that is not easy. You do not want to injure yourself
    in the process. A better solution may be to buy multiple smaller batteries and
    connect them together to provide the required capacity.


    Because lead acid batteries contain acid, they should be installed in a battery
    tray, so that any acid leaks may be contained. In Australia and Canada, regulations
    state that all batteries must be enclosed in a ventilated, lockable and vermin-proof
    enclosure.


    As it is not possible to buy 181.25 amp-hour batteries, I have decided to use
    four 100-amp-hour 12-volt batteries, giving me a battery bank with a total capacity
    of 200 amp-hours at 24 volts.


    12-volt, 100-amp-hour batteries are still not lightweight. They can easily weigh
    30kg (66 pounds) each, so do not be afraid to use more, lighter-weight batteries,
    if you are all at concerned.


    To build this battery bank, you can use four 100-amp-hour, 12-volt batteries,
    with two sets of batteries connected in series, and then connect both series in
    parallel, as shown below:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_103_0.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'This design uses four 100-amp-12V batteries. I have paired the batteries to
    make two sets of 100-hour 24V batteries, and then connected each pair in parallel
    to provide a 200-amp-hour capacity at 24 volts.


    If I were putting together a 12-volt battery system instead of a 24-volt battery
    system, I could wire together multiple 12-volt batteries in parallel to provide
    the higher capacity without increasing the voltage:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_104_0.png)


    Four 100-amp-hour 12V batteries connected in parallel to provide a 400-amp-hour
    12V battery bank.


    # Battery safety


    Battery safety is an area that must be carefully considered for your installation.
    This is particularly true of lead acid batteries, as they contain highly corrosive
    acid and vent explosive gas during their charging cycles.

    Wet lead acid traction batteries regularly need their water levels topped up as
    well, which can lead to accidental acid splashes.


    In addition, there is the very real risk of shorting a battery by accidentally
    dropping a spanner or wrench and shorting across its two terminals. This and spanner
    can turn red in less than a second, as well as potentially causing permanent damage
    to your battery.


    So well as the handling issues of moving heavy, batteries into position, you will
    need to carefully consider the battery maintenance aspects and consider how hydrogen
    can safely vented and be expelled from the area.


    I will go into more detail about handling batteries and ensuring you don''t accidentally
    short circuits when building your battery pack during the chapter on installation.
    However, the aspect of hydrogen venting has to be covered in the design phase
    of your system, so I shall cover this now.


    # Venting Hydrogen from Lead Acid batteries


    Different batteries vent different amounts of hydrogen. Lead acid batteries, such
    as gel and AGM batteries, should never vent hydrogen unless they become decharged,
    at which point a small amount of hydrogen may vent. Lead acid batteries will vent
    every time they charge, particularly as the batteries near fully charged. The
    amount of hydrogen that will vent will vary depending on the size of the battery,
    the exact chemistry and amount of current you are using, a rough rule of thumb
    is to assume a worst case of 0.011 cubic meters of hydrogen could be released
    from every kWh of "watt hour battery storage during the final three hours of the
    charging cycle. One kWh of battery storage equals 85Ah 12V battery or 170Ah 6V
    battery.


    Hydrogen cannot be seen, nor can it be smelled. It is an explosive gas that can
    explode when it reaches 4% concentration in air. It is generally accepted that
    1% is the ''safe'' level of hydrogen in an environment.


    Thankfully, hydrogen is very easy to extract. As one of the smallest and lightest
    molecules, it will naturally rise up and away from the batteries. It will then
    dissipate quickly into the atmosphere. However, there can be a problem with hydrogen
    getting trapped in places where it is in the case of a roof or in the corner of
    a room.


    If you only have one or two batteries in a large room, you need not to worry about
    the amount of hydrogen that can be released from the batteries is too small to
    worry about. However, if you have a larger battery bank, you need to consider
    how to vent hydrogen outside the building.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'There are different ways of doing this: natural convection, creating a passive
    ventilation system with no moving parts, or a vented fan solution. Vented fan
    solutions cause their own problems, in particular what happens if the fan fails,
    and the turbulence caused by the fans can create unexpected hydrogen pockets elsewhere
    in the battery enclosure. For these reasons, a passive ventilation system is usually
    recommended for lead battery storage solutions.


    # The principles of natural convection


    Natural convection is the process of moving liquid or gas simply by taking advantages
    of the different densities of the liquid or gas, either by driving gases between
    or through temperature differences within the gas.


    For example, we know that warm air rises and cold air drops to the bottom of a
    container. Because we are working with different gases, we can use the same principles
    when extracting hydrogen from batteries.


    Hydrogen is significantly lighter than air and will always rise to the top of
    a chamber. Heavier gases, such as air, will sink downwards below the hydrogen.
    When the temperature of the hydrogen and the temperature of the surrounding air
    is different, the hydrogen will move upwards at a rate of 20 metres per second
    (65 feet per second).


    # Using natural convection to extract hydrogen


    The best approach using natural convection is to build a battery box with a sloping,
    hinged lid. The underside of the lid should have no traps. At the top of the battery
    box, a PVC pipe can be fitted into the lid creating a chimney. This chimney can
    then be vented to the outside.


    As hydrogen vents from the batteries, it will immediately rise to the top of the
    battery box and be directed by the slope of the lid to the PVC pipe.


    The diameter of the PVC pipe can be calculated based on the speed of the hydrogen
    and the estimated worst case for hydrogen production from the batteries. The calculation
    for the pipe diameter is:


    ```

    0.011 / Total kWh of batteries x 1000

    nn x 20m/s

    ```


    Extraction diameter in cm = \ divide the answer by 24.


    If you only have 1 kWh of battery storage, the answer for your calculation is
    that you need a pipe with a minimum diameter of 0.42cm (1/4 inch). If you have
    8kWh of battery storage, the calculation suggests that you need a pipe with a
    minimum diameter of 1.19cm (just 1/2 inch).


    There is a safety issue with small extraction pipes: they can easily get blocked,
    and the gas release can be hampered by the friction against the surface. Consequently,
    it is recommended that you have a minimum extraction pipe size of at least 1.25cm
    (1/2 inch) for any battery box intake and that you increase the size of the pipe
    by at least 20% beyond the calculated value. If you have a large value, you will
    also need to increase the size of the pipe by at least 50% to account the reduction
    in airflow caused by the grille.


    If you are extracting gas from inside the battery box, you need to replace it
    with something else: fresh air from the surrounding area. You will typically do
    this with vents near the bottom of the battery box. Because the flow of air into
    the box will be slower than the rate of hydrogen out of it, the size of the intake
    vents needs to be correspondingly:


    ```

    0.011 / Total kWh of batteries x 1000

    nn x 1m/s

    ```


    Intake vent diameter in cm = \sqrt


    Before you panic that you must all these calculations yourself, there is a table
    that shows the minimum intake and extraction pipe diameters for the battery sizes
    you are to be working with:


    | Total Battery pack size (kWh) | Extraction pipe minimum internal diameter |
    Inlet vent internal diameter |

    |---|---||

    | 1kWh | | |'
