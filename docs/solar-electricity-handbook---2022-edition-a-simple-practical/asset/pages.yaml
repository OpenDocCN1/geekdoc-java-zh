- img_proc: true
  md: '# Surveying Your Site


    The survey is one of the most important aspects of designing a successful solar
    system. It will identify if your site is suitable for solar. If it is, the survey
    identifies the ideal position to install your solar system, ensuring that you
    get the best value for money and the best possible performance.


    # What we want to achieve


    For a solar electric system to work well, we need the site survey to answer two
    questions:


    +   - Is there anywhere on the site that is suitable for positioning our solar
    array?

    - Do nearby obstacles such as trees and buildings shade too much sunlight?


    The first question might sound soft deaf, depending on your project, it can make
    the difference between a solar energy system being viable or not.


    By answering the second question, you can identify how much of the available sunlight
    you will be able to capture. It is vitally that you understand one reason for
    solar energy failing to reach expectations is blocking out sunlight, which dramatically
    reduces the efficiency of the system.


    To answer this question, we need to be able to plot the position of the sun through
    the different times of the year. During the winter, the sun is lower in the sky
    than it is during the summer months. It is important to ensure that the solar
    array can receive direct sunlight throughout the day during the winter.


    # What you will need


    You will need a compass, a protractor, a spirit level and a tape measure.


    Inevitably a ladder is required if you are planning to mount the solar array on
    a roof. A camera can also be useful for photographing the site. If you have an
    iPhone or an Android cell phone, you can also download cheap software that will
    help you identify the path of the sun across the sky and assist with obstacle
    analysis.


    I also find useful to get some cardboard boxes. Open them out and cut them into
    the rough size of your proposed solar array. This can help you when finding a
    location for your solar panels. It is far easier to envisage what the installation
    will look like and it can help identify any issues that you might have missed.


    If you have never done a solar survey before, it does help if you visit the site
    on a sunny day.


    Once you have more experience with doing solar surveys, you will find it does
    not actually make much difference whether you do your site survey on a sunny day
    or an overcast day. As part of the site survey, we manually plot the sun''s position
    across the sky, so once you have more experience, weather makes little difference
    to the quality of the survey.


    # First impressions


    When you arrive at the site, the first thing to check is the layout of the site
    gives it access to sunlight.


    We use a more scientific approach for checking for shade later, but a quick look
    first highlights problems without needing to carry out a more in-depth survey.


    If you are in the Northern Hemisphere, look from east, through south and to the
    west to ensure there are no obvious obstructions that block the sunshine, such
    as trees and other buildings. If you are in the Southern Hemisphere, you need
    to check from east, north to west for obstructions. If you are standing on the
    equator, the sun passes overhead, so only obstructions in the east and west are
    important.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Be careful not to look directly at the sun, even for a few moments, whilst
    you are carrying out this survey. Even in the middle of winter, retina burn can
    cause permanent damage to your eyesight.


    Look around the site and identify all the different options for positioning the
    solar array. If you are considering mounting your solar array on a roof, remember
    that the world looks a very different place from a roof-top, and obstructions
    are a problem standing on the ground look very different when you are at roof
    height.


    # Drawing a rough sketch of the site


    It can be helpful to draw up a rough sketch of the site. It does not to be exact,
    but it can be a useful tool to have, both during the site survey and when you
    are designing your system.


    Include all properties and trees that are close to your site and not just on your
    land. Include trees that are too small to worry about now but become a problem
    in a few years'' time. Also make a note of which way is north.


    # Positioning the solar array


    Your task is to identify the best location for your solar array. Whilst you may
    already have a good idea where you want to install your panels, it is always a
    good idea to consider the different options available to you.


    As discovered in the last chapter, solar arrays perform better when tilted towards
    the sun.


    If you are planning to install solar energy for a building, then the roof of the
    building can be a suitable place to install the solar array. This is effective
    if the roof is south-facing or if the roof is flat and you can fit the panels
    using angled mounts.


    Other alternatives are to mount solar panels on a wall. This can work well with
    longer, slimmer panels that can be mounted at an angle without protruding too
    far out from the wall. Alternatively, solar panels can be grounded or mounted
    on a pole.


    When considering a position for your solar array, you need to consider how easy
    it is going to be to clean the solar panels. Panels do not need to be spotless,
    but dirt and grime will reduce the efficiency of your solar system over time,
    so you are looking at mounting solutions it definitely consider how you can access
    your panels to give them a quick wash every few months.


    # Roof-mounting


    If you are planning to mount your solar array on a roof, you need to gain access
    to the roof to check its suitability.


    Use a compass to check the direction of the roof. You will always get the best
    performance if your roof is south (in the northern hemisphere), but you can still
    get reasonable performance if your roof is east or west facing.


    You will also need to find out of the pitch of the roof. Professionals use a tool
    called *Roof Angle Finder* to calculate low-cost tools available from builders''
    merchants. Use the angle finder under the rafters underneath the roof and finder
    will show you the angle in degrees.


    Alternatively, you can calculate the angle using a protractor at the base of a
    roof underneath the roof or download an angle finder onto your mobile phone and
    use that.


    Solar panels themselves are not heavy: 15–20 kilograms (33–44 pounds) at most.
    Yet multiple panels are combined with a frame, especially if that are angled,
    the overall weight can become quite significant. A typical 4kW grid-system, made
    up of sixteen 250W solar panels can often weigh in of 360kg (almost 800 pounds).


    Check the structure of the roof. Ensure that it is strong enough to take the solar
    array and ascertain what you will need. It is difficult to provide general advice
    on roof structures and fixtures. There are so many different'
