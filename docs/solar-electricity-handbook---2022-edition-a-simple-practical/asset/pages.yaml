    But remember our scope. We only want to use the home full time from March to October.
    The electric system only needs to provide electricity for a long weekend during
    the winter. This means that, so long as our batteries are big enough to provide
    electrical power for a few days, it does not matter if the solar power in winter
    is not enough to provide constant use. As soon as we close the holiday home again,
    the solar panels will recharge the batteries.


