    | Laptop computer | 12V | 40W | 1 | 40Wh |

    | Charging cellphones | 12V | 5W | 4 | 20Wh |

    | Phantom loads | 12V | 1W | 24 | 24Wh |

    | Total Energy Requirement a day (watt-hours) | | | | 662Wh |


    # # A word of warning


    In the headlong enthusiasm for implementing a solar electric system, it is very
    easy to underestimate the amount of electricity you might need at this stage.


    To be sure that you do not leave out anything which you regret later, I suggest
    you have a break at this point. Then return and review your power analysis.


    It can help to show this to somebody to get their input as well. It is very easy
    to get emotionally involved in your solar project. Having a second pair of eyes
    can make a world of difference to make sure you are not overlooking something.


    # # When we are ready to proceed


    We now know exactly how much energy we need to provide one day of power. For our
    holiday example, that equates to 662 watt-hours per day.


    We still need to take the efficiency of the overall system into account. Batteries,
    inverters and resistance in the circuits all reduce the efficiency of our solar
    electric system. We must consider these inefficiencies and add them to our power
    analysis.


    # # Calculating inefficiencies


    Batteries do not return 100% of the energy used to charge them. The Charge Cycle
    Efficiency of the battery measures the percentage of energy available from the
    battery compared to the amount of energy used to charge it.


    Charge cycle efficiency is not a fixed figure, as the efficiency can vary depending
    on how quickly you charge and discharge the battery. Most solar applications do
    not stress batteries and the standard charge cycle efficiencies are usually sufficient.


    Approximate quality cycle efficiencies are normally available from the battery
    manufacturers. However, for industrial quality ''traction'' batteries, you can
    assume 95% efficiency, whilst gel batteries and leisure batteries are usually
    in the region of 90%.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'If you are using an inverter in your system, you need to factor in the inefficiencies
    of the inverter. Again, the actual figures should be available from the manufacturer
    but typically, you will find that an inverter is around 90% efficient.


    # Adding the inefficiencies to our power analysis


    In our holiday home example, there is no inverter. If there were, we would need
    to add 10% for inverter inefficiencies for every grid-powered device.


    We are using batteries. We need to add 5% to the total energy requirement to take
    cycle efficiency into account.


    5% of 662 equals 33 watts. This adds to our power analysis, and our total watt-hour
    requirement becomes 695 watt-hours per day.


    # When do you need to use the solar system?


    It is important to work out at what times of year you will be using your solar
    electric most. For instance, if you are planning to use your system full through
    the depths of winter, your solar electric system needs to be able to provide all
    electricity even during the days of winter.


    A holiday home is often in regular use during the spring, summer and autumn, but
    left empty for periods of time during the winter.


    This means that during winter, we do not need our solar electric system to provide
    enough electricity for full occupancy. We need enough capacity in the batteries
    to provide enough electricity for, say, the occasional weekend. The solar array
    can recharge the batteries again, once the home is empty.


    We might also decide that if we need additional electricity in winter, we could
    have a small standby generator on hand to give the batteries a boost charge.


    For the purposes of our holiday home, our system must provide enough electricity
    for full occupancy from March to October and occasional use from November until
    February.


    # Keeping it simple


    You have seen what needs to be considered when creating a power analysis and calculating
    the inefficiencies. If you are planning to use our tools to help you power them,
    now is the time to use them.


    Visit SolarElectricityHandbook.com and follow the links to either the Off-Grid
    or Grid-Tied Solar Project Analysis tools, which can be found in the Online calculators.
    This will allow you to enter your devices on the power analysis, select the months
    you want your system to work and select location from a worldwide list. The system
    will automatically e-mail you a detailed solar analysis report with all the calculations
    worked out for you.


    # Improving the scope


    Based on the work done, it time to put more detail on our original scope. Originally,
    our scope looked like this:


    Provide an off-grid holiday home with its entire electricity requirements.


    Now the improved scope has become:


    Provide an off-grid holiday home with its entire electricity requirements, providing
    power for lighting, refrigeration, TV, laptop computer and various sundries, which
    equals 695 watt-hours of electricity consumption per day.


    The system must provide enough power for occupation from March until October,
    plus occasional use during the winter.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'There is now a focus for the project. We know what we need to achieve for a
    solar electric system to work. Now we need to go to the site and see if what we
    want to do is achievable.


    # In conclusion


    +   - Getting the right is important for the whole project

    - Start by keeping it simple and then flesh it out by calculating the energy requirements
    for all the devices you need to power

    - If you are designing a grid-tie system, you do not need to go into so much detail,
    you can get the usage information from your electricity company. It is probably
    included on your electricity bill

    - If you are designing a grid-tie system, you can make a reasonable estimate of
    its environmental benefit by comparing solar energy supply with your demand on
    a month-by-month basis

    - Remember to factor in ''phantom loads''

    - Because solar electric systems run at low voltages, running your devices at
    low voltage is more efficient than inverting the voltage to grid levels first

    - Thanks to the popularity of caravans and boats, there is a large selection of
    12-volt appliances available. If you are planning a stand-alone or grid fallback
    system, you may wish to use these in your solar electric system rather than less
    efficient grid-voltage appliances

    - Even if you are planning a grid-tie system, it is still useful to carry out
    a detailed power analysis

    - Remember to factor in inefficiencies for batteries and inverters

    - Consider the times of year that you need to use your solar electric system the
    project needs to achieve to be successful

    - Once you have completed this stage, you will know'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Calculating Solar Energy


    The next two chapters are just as useful for people wishing to install a solar
    hot water system as they are for people wishing to install solar electricity.


    Whenever I refer to solar panel or solar array (multiple solar electric panels)
    in these two chapters, the information is equally valid for solar electricity
    and solar hot water.


    # What is solar energy?


    Solar energy is the combination of hours of sunlight you get at your site and
    the strength of sunlight. It varies depending on the time of day and where you
    live.


    This combination of hours and strength of sunlight is called solar insulation
    or solar irradiance, and the results can be expressed as watts per square meter
    (W/m²) or more, in kilowatts per square metre over the period of a day (kWh/m²/day).
    One square meter is equal to 9.9 feet.


    # Why is this useful?


    Photovoltaic panels quote the expected number of watts, based on a solar array
    of 1,000 watts per square metre. This figure is often shown as a watts-peak (Wp)
    and shows how much power the solar panel can produce in ideal conditions. A solar
    irradiance of 1,000 watts per square metre is what you could expect to receive
    at noon in the middle of summer. It is not an average reading that you could expect
    to achieve on a daily basis.


    However, once you know the solar irradiance for your area, quoted as a daily average
    (i.e. the number of kilowatt hours per square metre per day), you can multiply
    this by the wattage of the solar panel to give you an idea of the daily amount
    of energy you can expect your solar panels to provide.


    # Calculating solar irradiance


    Solar irradiance varies significantly from one place to another and changes throughout
    the year. To come up with reasonable estimates, you will need irradiance for each
    month of the year for your specific location.


    Thanks to NASA, calculating your own surface of the earth is simple. NASA''s network
    of weather satellites has been monitoring the solar irradiance across the surface
    of the earth for many decades. Their figures take into account the atmospheric
    conditions, cloud cover and temperature, and are based on sample readings every
    three hours for a quarter of a decade. They cover the entire globe.


    The Solar Electricity Handbook has incorporated this information across the entire
    world. Select your current location and you can find the irradiance for your area.
    You can access this solar irradiance by visiting http://www.SolarElectricityHandbook.com
    and following the links to calculators and resources.


    Using the information here, here are the solar irradiance for London in the United
    Kingdom, on a month-by-month basis. This shows the average daily irradiance, based
    on mounting the solar array flat on the ground:


    | Jan | Feb | Mar | Apr | May | Jun | Jul | Aug | Sep | Oct | |

    |---|---|---|---|---|---|---|---|---|---||

    | Flat | 0.75 | 1.37 | 2.31 | 3.57 | 4.59 | 4.86 | 4.82 | 4.20 | 2.81 | 1.69 |
    0.92 |


    These figures show how many hours of midday sun we get over the period of an average
    day of each month. In the chart above, you can see that in December we get the
    equivalent of 0.6 of an hour of midday sun (36 minutes), whilst in June we get
    the equivalent of 4.86 hours of midday sunlight (4 hours and 50 minutes).


    # Capturing the power of the sun''s energy'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'The tilt of a solar panel has an impact on how much sunlight you capture: mount
    the solar panel flat against a wall or flat on the ground and you will capture
    less sunlight throughout the day than if you tilt the solar panels to face the
    sun.


    The figures above show the solar irradiance in London, based on the amount of
    sunlight shining on a single square metre of the ground. If you mount your solar
    panel at an angle, tilted towards the sun, you can capture more sunlight and therefore
    generate more power. This is especially true in the winter months, when the sun
    is low in the sky.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_44_0.png)


    The reason for this is the intensity of the sunlight. When the sun is high in
    the sky the intensity of sunlight is high. When the sun is low in the sky the
    sunlight is spread over a greater surface area:


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_44_1.png)


    This diagram shows the different intensity of light depending on the angle of
    sun in the sky. When the sun is directly overhead, a 1m-wide shaft of sunlight
    will cover a 1m-wide area on the ground. When the sun is low in the sky – this
    example, I am using an angle of 30° towards the sun – a 1m-wide shaft of sunlight
    will cover a 2m-wide area on the ground. This means the intensity of the sunlight
    is half as much when the sun is at an angle of 30° compared to the intensity of
    the sunlight when the sun is directly overhead.


    # The impact of tilting solar panels on solar irradiance'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'If we tilt solar panels towards the sun, it means we can capture more of the
    sun''s energy to convert into electricity. Often the angle of this tilt is determined
    by the angle of an existing roof. However, for every location there are optimal
    angles to mount your solar array, to capture as much energy as possible.


    Using London as an example, this chart shows the difference in performance of
    solar panels, based on the angle at which they are mounted. The angles I have
    shown on the ground, the angle fixed against a wall, and mounted at different
    angles to get the optimal amount of solar irradiance at different times of the
    year (I explain the relevance of these specific angles in a moment):


    | Jun | Feb | Mar | Apr | May | Jun | Jul | Aug | Sep | Oct | Nov |

    |---|---|---|---|---|---|---|---|---|---||

    | FLAT | | | | | | | | | | |

    | 0.75 | 1.37 | 2.31 | 3.57 | 4.59 | 4.86 | 4.82 | 4.20 | 2.81 | 1.69 | 0.92 |

    | UPRIGHT | | | | | | | | | | |

    | 1.20 | 1.80 | 2.18 | 2.58 | 2.70 | 2.62 | 2.71 | 2.80 | 2.47 | 2.07 | 1.43 |

    | BEST ALL YEAR PERFORMANCE – 38° TILT | | | | | | | | | | |

    | 1.27 | 2.04 | 3.76 | 4.17 | 4.20 | 4.25 | 4.16 | 3.26 | 2.41 | 1.53 |

    | BEST WINTER PERFORMANCE – 23° TILT | | | | | | | | | | | |

    | 1.30 | 2.03 | 2.62 | 3.34 | 3.66 | 3.69 | 3.76 | 3.73 | 3.06 | 2.27 | 1.56 |

    | SUMMER PERFORMANCE – 53° TILT | | | | | | | | | | | |

    | 1.19 | 1.95 | 2.77 | 3.84 | 4.52 | 4.63 | 4.66 | 4.41 | 3.31 | 2.33 | 1.43 |

    | ADJUSTING THE TILT THROUGHOUT THE YEAR FOR OPTIMAL PERFORMANCE | | | | | | |
    | | | | |

    | 22° tilt | 30° tilt | 38° tilt | 46° tilt | 52° tilt | 62° tilt | 54° tilt |
    46° tilt | 38° tilt | 30° tilt | 22° tilt |


    Note: All angles are given in degrees from vertical and are location specific.


    Look at the difference in performance based on the tilt of the solar panel. Look
    at the difference in the depths of winter and in the height of summer,


    It is easy to see that some angles provide better performance in winter; others
    provide better performance in summer, while others provide a good compromise all-year
    solution.


    # Calculating the optimal tilt for solar panels


    Because of the 23° tilt of the earth relative to the sun, the optimum tilt of
    your solar panels will vary throughout the year, depending on the season. In some
    installations, it is feasible to adjust the tilt of the solar panels each month,
    which in others it is necessary to have the array fixed in position.


    To calculate the optimum tilt of your solar panels, you can use the following:


    +   - 90° – your latitude = optimum year-round setting


    This angle is the tilt for fixed solar panels for all-year power generation. This
    does not mean that you will get the maximum power output every single month, instead
    means that across the whole year, this tilt will give you the best compromise,
    generating electricity every year round.


    # Getting the best from solar panels at different times of the year


    Depending on how you want to use solar energy, you may choose to use a different
    tilt to improve output at a given point in the year. Each month of the year, the
    angle of the sun changes by 7° – higher'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'in the summer and in the winter. By adjusting the tilt of your solar panel
    to track the sun, you can tweak the performance of your system according to your
    requirements.


    You may want to do this for several reasons:


    +   * For a stand-alone, off-grid system, you often need to get as much power
    generation during the winter months as possible to counter the reduction in natural
    light

    * When installing a grid-tie system in a cool climate, the focus is on reducing
    your carbon footprint, you can choose to boost your electricity production in
    winter, to offset the amount of electricity you need to buy when demand is at
    its highest

    * When installing a grid-tie system where the focus is on making the most profit
    by seling your power, you can choose to tilt your solar panels at a summer setting
    and produce the maximum amount of energy possible over the course of the year


    You can see this optimum angle (rounded to the nearest whole degree) on the bottom
    of the table on the previous page.


    # Optimal winter settings


    Here is an example of how you could tweak your summer settings. Performance of
    a solar system is at its worst during the winter months. However, by tilting your
    panels to capture as much of the sunlight as possible during the winter, you can
    significantly boost the amount of power you generate at that time.


    Based on the Northern Hemisphere, an optimum tilt for solar panels is the optimum
    angle for November and January. For the Southern Hemisphere, the optimum winter
    tilt is May and July:


    > 90° – latitude + 15.6° = optimum winter setting


    As you can from the table on the previous page, if you tilt your solar panels
    at this angle, you will sacrifice some of your power generation capability during
    the summer months. However, as you are generating so more power during the summer
    than you are in the winter, this may not be an issue.


    More importantly, by leaving the panels on a flat surface, you are almost doubling
    the amount of power you can generate during the bleakest months of the year. This
    means you can reduce the number of solar panels you need to install.


    # Optimum summer settings


    If you wish to get the best output of your system overall, you will find that
    you will get slightly more energy, measured over the course of the whole year,
    by angling your solar panels to an optimum summer time tilt.


    In warm climates, maximum energy consumption is during hot weather, angling your
    panels to get the maximum amount of sunlight during the height of summer can be
    the best solution, financially and environmentally.


    For Northern Hemisphere countries, the optimum time tilt is the optimum angle
    for May and July. For Southern Hemisphere countries, the optimum summer time tilt
    is the optimum angle for November and January:


    > 90° – latitude + 15.6° = optimum summer setting


    # Positioning your solar panels


    Regardless of where you live, the sun always rises from the east and sets in the
    west. If you live in the Northern Hemisphere, solar panels will always work best
    if they are south-facing. In the Southern Hemisphere, solar panels work best if
    they are north-facing.


    However, it is not always possible to position your solar panels so they are aligned
    perfectly to towards the midday sun. For instance, if you want to install solar
    panels on the roof of the house, and the roof faces east/west, then your panels
    will inevitably be less efficient.


    Thanks to improved solar panel design over the past decade, this is not as big
    a problem as was once. Whilst the figure vary slightly in different parts of the
    world, from one solar panel manufacturer to another'
