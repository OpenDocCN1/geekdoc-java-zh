- img_proc: true
  md: 'For either a stand-alone or grids fallback system, the most common voltages
    to run your batteries are at 12 volts, 24 volts or 48 volts.


    As a rule, the most efficient way to run an electrical circuit is to keep your
    voltage high and your current low. That is why the grid runs at high voltages
    It is the only way to keep losses to a minimum over long distances. 12-volt and
    24-volt systems are far cheaper to implement than higher voltage systems, as the
    components are more readily available, and at a lower cost. 12-volt and 24-volt
    devices and appliances are also easily available, whereas 48-volt devices and
    appliances are rarer.


    If you are designing and building your own system, it is unusual to go beyond
    48 volts for the battery storage on stand-alone systems. While you can go high,
    inverters and controllers at other voltages will be extremely expensive and only
    suitable for specialist applications.


    # How to work out voltage you should be running at


    Your choice of voltage is determined by the amount of current (amps) that you
    are generating with your solar array or by the amount of current (amps) that you
    are using in load at any one time.


    To cope with bigger currents, you need bigger cabling and a more powerful solar
    controller. You will also have greater resistance in longer runs of cabling, reducing
    the efficiency of your system, which in turn means you need to generate more power.


    In our system, we are proposing a 12m (40 feet) long run from the solar array
    to the house, plus cabling within the house.


    Higher currents can reduce the lifespan of your batteries. This is a consideration
    where the current drain or charge from a battery is likely to exceed $1/10$ of
    its amp-rating.


    We will look at battery sizing, as current draw is a factor in choosing the right
    size of battery. It may be that you need to look at more one voltage option at
    this stage, as 12 volt and 24-volt, and decide which one is right for you in the
    design process. Finally, if you are planning to use an inverter to convert your
    voltage to a grid-level AC voltage, 12-volt inverters tend to have a lower power
    rating than 24-volt or 48-volt inverters. This can limit what you can achieve
    with 12 volts.


    To solve these problems, you can increase the voltage of your system. If you double
    the voltage, you will have your current.


    There are no hard and fast rules on what voltage to work on for what current,
    typically, if the thickness of cable required to carry your current has cross
    greater than 6mm² (or an AWG of 9 or below), it is time to consider increasing
    the voltage. I will explain how to calculate the required thickness of cable shortly.


    # How to calculate your current


    As explained in Chapter 2, it is very straightforward to work out your current.
    Current (amps) equals power (watts) divided by volts:


    > Power ÷ Volts = Current


    P ÷ V = I


    Go back to your analysis (Example 1 is on page 54) and add up the amount of power
    (watts) your system will consume if you switch on every electrical item at the
    same time. In the case of your holiday home, if I had everything switched on the
    same time, I would be consuming 169 watts of electricity.


    Using the holiday home as an example, let us calculate the current based on both
    12 volts and 24 volts, to give a good idea of what the different currents look
    like.


    Using the above formula, 169 watts divided by 12 volts equals 14.08 amps. 169
    watts divided by 24 volts equals 7.04 amps.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'Likewise, we need to look at the solar array and work out how amps the array
    is providing to the system. We need a 320-watt solar array. 320 watts divided
    by 12 volts equals 26.67 amps. 320 watts divided by 24 volts equals 13.33 amps.


    # Calculating cable thicknesses


    I will go into more detail on cabling later, but for now, we need to ascertain
    the thickness of cable we will need for our system.


    For our holiday home, we need a 12m (40 ft) cable to run from the solar controller
    to the house itself. Inside the house, there will be different circuits for lighting
    and appliances, but the longest cable run inside the house is a further 10m (33
    ft).


    That means the longest cable run is 22m (72½ ft) length. You can work out the
    required cable size using the following calculation:


    ```

    (L x I 0.8) ÷ V = CT


    L Cable length in metres (one metre is 3.3 feet)

    I Current in amps

    V System voltage (e.g. 12V or 24V)

    CT Cross-sectional area of the cable in mm²

    ```


    So calculating the cable thickness for a 12-volt system:


    (22 x 14.08A x 0.8) ÷ 12 = 20.652mm²


    Here is the same calculation for a 24-volt system:


    (22m x 7.04A x 0.8) ÷ 24 = 5.155mm²


    And just for sake of completeness, here is the same calculation for a 48-volt
    system:


    (22m x 3.52A x 0.8) ÷ 48 = 1.633mm²


    # Converting wire sizes:


    To convert cross-sectional area to American Gauge or to work out the diameter
    in inches or millimetres, use the following table:


    | Cross-Sectional Area (mm²) | American Wire Gauge (AWG) | Diameter (inches) |
