- img_proc: true
  md: '# Installation


    Congratulations on getting this far. If you are doing this for real, you will
    now have a garage or garden shed full of solar panels, batteries, cables, controllers,
    isolation switches, mounting brackets and RCDs. The planning stage is over and
    the fun is about to begin.


    Before you get your screwdriver and drill out, there are just a few housekeeping
    items to get out of the way first...


    # Safety


    First, there are a few safety points to be aware of. Some of these may not be
    relevant to you, but read them first, just to make sure. Remember, you are working
    with electricity, dangerous chemicals and heavy but fragile objects. It is better
    to be safe than sorry.


    # Your First Aid kit


    You will need a good First Aid kit on hand, including some items that you will
    not normally have in a regular First Aid kit. Most specifically, you will need
    an eye-wash and a wash kit or gel that can be applied to skin in case of contact
    with battery acid.


    # Chemical clean-up kit


    If you will be working with lead acid batteries that contain chemicals that are
    hazardous to health. You will require the following:


    +   - A chemical clean-up kit suitable for cleaning battery acids in the case
    of a spill

    - A supply of strong polythene bags

    - A good supply of rags/ disposable wipes to mop up any battery spillages


    Chemical clean-up kits and chemical First Aid kits are available from most battery
    wholesalers and industrial tool suppliers. They only cost a few pounds. You probably
    will not need them, but if nothing else, buy you peace of mind.


    # Considering the general public'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'If you are working in an area where the general public has access, you should
    use barriers or fencing, and signage to cordon off the area. Clear diversion signage
    should explain an alternative route.


    In this scenario, I would recommend employing a professional team of builders
    to carry out the installation work on your behalf. They will already understand
    the implications of working in a public area and the relevant Health and Safety
    regulations.


    Even if you do not have to consider the general public, you should still consider
    the people around you. Children love to get involved with these sorts of projects
    and there really can be some safety issues involved. Keep children out of the
    way, and let anyone in the vicinity know that you are working with high voltages
    and to keep away.


    # Working at height


    You are very likely to be working at height and quite possibly crawling around
    on slanted rooftops.


    Make sure you are using suitable climbing equipment (ladders, crawler boards,
    safety, scaffolding). You can hire anything that you do not have at reasonable
    prices.


    If you have any concerns about working at heights, or if you are working beyond
    your area of competence at any time, remember there is no shame in hiring a professional.
    A professional builder can fit a solar array to a roof in 2–3 hours. This is typically
    less than half the time it takes an amateur DIY enthusiast.


    # Handling


    Batteries, large inverters and solar arrays can be heavy. Solar panels themselves
    may not be heavy in their own right, but when several of them are mounted on a
    frame and then lifted they are heavy, bulky and fragile.


    Moving and installing much of this equipment is a two-person job as a minimum.
    More people can be useful when lifting a solar array into position.


    # Working with batteries'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'Lead acid batteries are extremely heavy, in some cases weighing as much as
    an adult. Use proper lifting gear to move them, and look after your back.


    Heavier batteries quite often have hoops in the top case. To lift a battery, I
    tend to use a piece of rope threaded through these hoops to create a carrying
    handle. This means I can carry a battery close to the ground and reduce the need
    to bend over lift it.


    Lead acid batteries contain acid. Unless they are gel batteries, the acid is in
    liquid form. It is extremely corrosive and extremely dangerous to health. Splashes
    of liquid from the batteries can cause severe chemical burns and must be dealt
    with immediately.


    When working with lead acid batteries, stay safe:


    +   - ALWAYS wear protective clothing, including overalls, eye protection (either
    protective glasses or a full-face shield) and protective gloves. I would also
    advise you to wear steel toe-capped shoes

    - Keep batteries upright at all times

    - Do not drop a battery. If you do, the likelihood is that the battery has been
    damaged. In the worst-case scenario, the casing could be cracked or broken

    - If you drop a battery, place it immediately in a spill tray (a heavy-duty deep
    greenhouse watering tray can be used if necessary) and check for damage and leaks

    - If you have a damaged battery, both the battery and the spill tray must be double-bagged
    in sealed polythene bags and marked as hazardous waste

    - If you have a spilling from a battery, mop up the spillage immediately using
    rags or disposable wipes. Place these rags in a polythene bag, seal and mark it
    as hazardous waste

    - If any spilling from a battery comes into contact with clothing, remove clothing
    immediately and dispose of it in polythene bags

    - If any spilling from a battery comes into contact with the eyes, wash repeatedly
    with eye-wash and seek urgent medical help

    - If any spilling from a battery comes into contact with the skin, wash off immediately
    with water, apply an anti-acid wash, cream or gel to stop burning and then seek
    urgent medical help'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   - If you end up with battery acid in your mouth, wash your mouth out with
    milk. DO NOT swallow the milk. Spit it out. Then seek urgent medical help


    +   - Do not smoke near batteries, and ensure that the area where you are storing
    the batteries are ventilated


    +   - Prevent arcing or short circuits on battery terminals. Batteries can provide
    a huge current very quickly. Should you short-circuit a battery with a spanner,
    the spanner is likely to be red within a few seconds and could easily lead to
    fire or explosion. Remove any rings, bracelets or watches you may be wearing and
    keep tools a safe distance away from batteries


    # Gloves


    You need two different sets of gloves for installing your solar array. Chemical
    gloves for moving batteries and electrical protection gloves for wiring your solar
    system. When choosing suitable chemical gloves for working with batteries, consider
    the following:


    +   - The gloves need to be quite strong, as lifting and moving batteries is hard
    on gloves


    +   - A good grip is important


    +   - Buy a glove with a medium or long cuff length, to protect both the hands
    and forearms


    +   - The gloves should be made of a suitable material to protect against battery
    acid


    The Health and Safety Executive website suggest that 0.4mm-thick neoprene gloves
    will give suitable protection through a full shift. If you do splash your gloves
    while working with batteries, make sure you wash them or replace them immediately,
    to avoid transferring it to other parts of your body.


    Electrically insulated protection gloves give protection when working with high
    voltages. These are vitally important when working with high-voltage solar arrays
    and are recommended for all installations.


    Electrically insulated gloves come with different ratings to provide protection
    at different voltages:'
  merge: -1
  pgno: 155
- img_proc: true
  md: '+   - Class 00 gloves provide protection for up to 500 volts

    - Class 0 gloves provide protection for up to 1,000 volts

    - Class 1 gloves provide protection for up to 7,500 volts


    For most solar installations, Class 00 or Class 0 are the most appropriate. Remember
    that the open circuit voltage of a solar array can be more than double the nominal
    voltage of the solar array: twenty solar panels in series may only have a nominal
    voltage of 240 volts, but the open circuit voltage could be over 500 volts.


    Like chemical gloves, choose gloves with a medium or long cuff length to protect
    both your hands and forearms. If your electrically insulated gloves are splashed
    with battery acid, remove and replace the gloves immediately.


    All electrically insulated gloves should be visually inspected and checked for
    tears and holes before use. Class 1–3 gloves require full electrical testing every
    six months.


    # Electrical safety


    I make no apologies for repeating my mantra about electrical safety. Electrical
    safety is extremely important when installing a solar electric system.


    Solar panels generate electricity whenever they are exposed to sunlight. The voltage
    of a solar panel on an ‘open’ circuit is significantly higher than the system
    voltage. A 12-volt solar panel can generate a 22–26 volt current when connected.


    Connect several solar panels in series and the voltage can get to dangerous levels
    very quickly. A 24-volt solar array can generate 45–55 volts, which can provide
    a nasty shock in the wrong circumstances, while a 48-volt solar array can easily
    generate voltages of 90–110 volts when not connected. These voltages can be lethal
    to anyone with a heart condition, or to children, the elderly or pets.


    Solar systems produce DC voltage. Unlike AC voltage, if you are electrocuted from
    a direct current, you will not be able to let go.


    Batteries can produce currents measuring thousands of amps. A short circuit will
    generate huge amounts of heat very quickly and could result in fire or'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'explosion. Remove any rings, bracelets or watches you may be wearing and keep
    tools away from batteries.


    The output from an inverter is AC grid-level voltage and can be lethal. Treat
    it with the same respect as you would any other grid-level electricity supply.


    If you are connecting an inverter into a household electrical system, you must
    use a qualified electrician to certify your installation.


    # Assembling your toolkit


    As well as your trusty set of DIY tools, you will need an electrical meter or
    voltmeter to test your installation at different stages. You should use electrically
    screwdrivers whilst wiring up the solar array, and a test circuit tester can be
    useful.


    There are a few sundries that you ought to have well:


    +   - Cable ties are very useful for holding cables in place. They can keep cable
    runs tidy and are often good for temporary as well as permanent use

    - A water- and dirt-repellent glass polish or wax, for cleaning solar panels

    - Petroleum jelly is used on electrical connections on solar panels and batteries
    to seal them from moisture and to ensure a good connection


    # Preparing your site


    As mentioned in the previous chapter, you may need to consider foundations for
    ground- or pole-mounting a solar array, or strengthening an existing roof structure
    if you are installing your solar array on a roof.


    If you are installing your batteries in an area where there is no suitable earth
    (ground), you should install an earthing rod (grounding rod) as close to the batteries
    as is practical.


    # Testing your solar panels'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'Now the fun begins. Start by unpacking your solar PV panels and carry out a
    visual inspection to make sure they are not damaged in any way.


    Chipped or cracked glass can significantly reduce the performance of the solar
    panels, so they should be replaced if there is any visible damage to the panel.
    Damage to the frame is not a problem, so as long as the damage will not allow
    water ingress to the panel and does not stop the solar panel from being securely
    mounted in position.


    Next, check the voltage on the panel using your multi-meter, to set to an appropriate
    DC voltage range.


    Solar PV panels generate a much higher voltage on an ‘open’ circuit (i.e. when
    the panel is not connected to anything) when they do connected to a ‘closed’ circuit.
    Do not be surprised if your multi-meter records an open voltage of 20–26 volts
    for a single panel.


    # Grounding (earthing) your system


    It is vitally important that every metal part of your solar energy system is grounded
    to a common grounding point. This includes the metal frame on your solar panels
    and the roof mounting system itself, as well as inverters and controllers and
    any metalwork used on either the solar mounting system or battery bank. Solar
    panels and batteries connected in series can quickly build up to dangerously high
    DC voltages and the risk of fluctuating voltages on metal components within the
    system is very real. I have measured 300V voltage on an ungrounded metal shelving
    unit that held the batteries. Whilst the metal frame wasn’t live, it had been
    magnetized by the current flow through the cabling. These levels of voltages are
    dangerous and can only be eliminated through grounding (earthing) every metal
    component within your system.


    # Installing the solar array


    # Cleaning the panels


    It is a good idea to clean the glass on the front of the panels first, using a
    water- and dirt-repellent polish or wax. These glass polishes ensure that rain
    and dirt do not stick to the glass, thereby reducing the performance'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'of your solar array. They are available from any DIY store and car accessories
    stores.


    # Assembly and connections


    Some roof-mounted solar mounting kits are designed to be fitted to your roof before
    fitting the solar panels. Others are designed to have the solar panels mounted
    to the fixing kits before being mounted to the roof.


    With a pole-mounted system, you typically erect your pole first and then fit the
    solar panels once the pole is in position. A ground-based mounting system is the
    easiest to install, as there is no heavy lifting.


    Typically, you mount and wire the solar panels at the same time. If you are stepping
    up the voltage of your solar system by wiring the panels in series, wire the required
    number of panels in series first (i.e. sets of two panels for 24 volts, sets of
    four for 48 volts).


    Once you have wired a set of panels in series, test them using your multi-meter,
    to a voltage setting to check that you have the expected voltage (20 volts plus
    for a 12-volt system, 40 volts plus for a 24-volt system and 80 volts plus for
    a 48-volt system). Take care when taking these measurements, as 40 volts and above
    can give a nasty shock in the wrong circumstances.


    Once you have wired each series correctly, make up the parallel connections and
    test the entire array using your multi-meter, set to the appropriate voltage setting.


    If you have panels of different capacities, treat the different sets of panels
    as separate arrays. Do not wire panels of different capacities together, either
    in series or parallel. Instead, connect the arrays together to the controller.


    Once you have completed testing, make the array safe so that no one can get an
    electric shock by accident from the system. To do this, connect the positive and
    negative cables from the solar array together to short-circuit the array. This
    will not damage the array and could prevent a nasty shock.


    # Roof-mounting a solar array


    If you are roof-mounting a solar array, you will normally have to fit to a rail
    or mounting to the roof before attaching the solar array.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'Once this is in place, it is time to fit the array itself. Make sure you have
    enough people on hand to be able to lift the array onto the roof without twisting
    or bending it. Personally, I would always leave this job to professional builders,
    but the best way seems to be to have two ladders and people lifting the array
    up between them, one on each ladder, or using scaffolding.


    # # Final wiring


    Once your solar array is in position, route the cable down to where the solar
    controller is to be installed. For safety purposes, ensure that the cables to
    the solar array remain short whilst you do.


    If you are installing a DC isolation switch and a residual current device (known
    as a ground fault uninterrup in North America), install them between the solar
    array and the controller.


    Once you have the cables in position, un-short the positive and negative cables
    and check with a meter to ensure you have the expected voltage readings. Then
    short the cables again until you are ready to install the solar controller.


    # # Installing the batteries


    # # Pre-installation


    Before installing the batteries, you may need to give them a refresher charge
    before using them for the first time.


    You can do this in one of two ways. You can use a battery charger to charge up
    the batteries, or you can install the system and then leave the solar panels to
    fully charge up the batteries for a day or so before commissioning the rest of
    the system.


    Put a sticker on each battery with an installation date. This will be useful in
    years to come for maintenance and troubleshooting.


    # # Positioning the batteries


    The batteries need to be positioned so they are upright, cannot fall over and
    are away from members of the public, children and any sources of ignition.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'For insulation and heating purposes, batteries should not be stood directly
    on a concrete floor. During the winter months, a slab of concrete can get extremely
    cold and its cooling effects can have detrimental effects on batteries. I prefer
    to mount batteries on a wooden floor or shelf.


    # Ventilation


    If there is little or no ventilation in the area where the batteries are situated,
    this must be implemented before the batteries are sited.


    As batteries vent hydrogen, which is lighter than air, the gas will rise up. The
    ventilation should be designed so that the hydrogen is vented out of the battery
    area as it rises.


    # Access


    It is important that the battery area is easily accessible, not just for installing
    the batteries (remembering that the batteries themselves are heavy), but also
    for routinely checking the batteries.


    # Insulation


    As mentioned earlier, if you are installing your batteries in an area that can
    get very cold or very hot, you should insulate your batteries.


    Polystyrene (Styrofoam) sheets or foil-backed bubble-wrap can be used underneath
    and around the sides of the batteries to keep them insulated. DO NOT INSATE THE
    TOP OF THE BATTERIES as this will stop them from venting properly and may cause
    shorts in the batteries if the insulating material you use is conductive.


    # Connections


    Once the batteries are in place, wire up the interconnection leads between the
    batteries to form a complete battery bank.


    Always use the correct terminals for the batteries you are using and make sure
    the cables provide a good connection. You should use battery interconnection cables
    professionally manufactured for the batteries you are using.


    Use petroleum jelly around mountings to seal and ensure a good connection.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'Next, add an earth (ground) to the negative terminal. If there is no earth
    already available, install an earthing rod (grounding rod) as close as possible
    to the batteries.


    Now check the outputs at either end of the batteries using a multi-meter to ensure
    you are getting the correct voltage. A fully-charged battery should be showing
    a charge of around 13–14 volts per battery.


    # Installing the control equipment


    The next step is to install the solar controller and the power inverter if you
    are using one. Mount them close to the batteries. Ideally they should be mounted
    within a metre (3 feet), to keep cable runs as short as possible.


    Most solar controllers include a small LCD display and a number of buttons to
    configure the controller. Make sure the solar controller is easily accessible
    and that you can read the display.


    Some solar controllers that work at multiple voltages have a switch to set the
    voltage you are working at. Others are auto-sensing. Either way, check your documentation
    to make sure you install the solar controller in accordance with the manufacturer’s
    instructions. If you have to set the voltage manually, make sure you do this now,
    rather than when you have wired up your system.


    Inverters can get very hot in use and adequate ventilation should be provided.
    They are normally mounted vertically on a wall, to provide natural ventilation.
    The installation guide that comes with your particular make of inverter will tell
    you what is required.


    Some inverters require an earth (ground) in addition to the earth on the negative
    terminal on the battery. If this is the case, connect a 2.5mm² green-yellow earth
    cable from the inverter to your earth rod (ground rod).


    If you are installing a DC isolation switch between the solar panels and your
    control equipment, connect that up first and make sure that it is switched off.


    Once you have mounted the controller and inverter, connect the negative cables
    to the battery, taking care that you are connecting the cables to the'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'correct polarity. Then un-short the positive and negative cables from the solar
    array and connect the negative cable from the solar array to the solar controller,
    again taking care to ensure the cable is connected to the correct polarity.


    Now double-check the wiring. Make sure you have connected the cables to the right
    places. Double-check that you have connected your negative cable from your solar
    array to the negative input connection on your solar controller. Then double-check
    that you have connected your negative cable from your battery to the negative
    battery input on your solar controller and your inverter.


    Now do the same with all your ground (earth) connections. Is your system correctly
    grounded to the same grounding point? Are all metal frames and components grounded?


    Once you are happy that everything is safe, only then should you start wiring
    your positive connections.


    Start with the battery connection. If you are planning to install a fuse and DC
    isolation switch into this cable, make sure that your fuse and switch work for
    both the solar controller and the inverter (if you are using one). Connect the
    inverter and the solar controller ends first and double-check that you have got
    your wiring correct, both visually and by checking voltages with a volt meter,
    before you connect up the battery bank.


    Finally, connect the positive connection from your solar array to the solar controller.
    At this point, your solar controller should power up and you should start reading
    charging information from the screen.


    Congratulations. You have a working solar power station!


    # Installing a grid-tie system


    Before starting to install your grid-tie system, you must have already made arrangements
    with your electricity provider for them to set you up as a renewable energy generator.


    Regulations and agreements vary from region to region and from electricity provider
    to electricity provider, but at the very least they will need to install'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'an export meter to your building to accurately meter how much energy you are
    providing. They will also ask for an inspection certificate from a qualified electrician,
    to confirm that the work has been done to an acceptable standard.


    Physically, installing a grid-tie system is very similar to installing any other
    solar energy system, except, of course, you do not have any batteries to work.


    However, you do have to be careful while wiring up in the high-voltage solar array.
    When the solar array is being connected you can have a voltage build-up of several
    hundred volts, which can easily prove fatal. If building a high-voltage array,
    cover the solar panels while you are working on them and wear electrically insulated
    gloves at all times.


    # Commissioning the system


    Once you have stopped dancing around the garden in excitement, it is time to test
    what you have done so far and configure your solar controller.


    # Programming your solar controller


    The type of solar controller you will have determine exactly what you need to
    configure. It may be that you do not need to configure anything at all, but either
    way you should check the documentation that came with the solar controller to
    see what you need to do.


    Typically, you will need to tell your solar controller what type of batteries
    you are using. You may also need to tell your solar controller the maximum and
    minimum voltage levels to show when the batteries are fully charged or fully discharged.
    You should have this information from your battery supplier, or you can normally
    download full battery specification sheets from the internet.


    # Testing your system


    You can test your solar controller by checking the positive and negative terminals
    on the output connectors on the controller using your multi-meter. Switch the
    multi-meter to DC voltage and ensure you are getting the correct voltage out of
    the solar controller.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'If you have an inverter, plug a simple device such as a table lamp into the
    AC socket and check that it works.


    If your inverter does not work, switch it off and check your connections to the
    battery. If they are all in order, check again with a different device.


    # Charging up your batteries


    If you have not carried out a refresher charge on your batteries before installing
    them, switch off your inverter and leave your system for at least 24 hours to
    give the batteries a good charge.


    # Connecting your devices


    Once you have your solar power station up and running and your batteries are fully
    charged, it is time to connect your devices.


    If you are wiring a house using low-voltage equipment, it is worth following the
    same guidelines as you would for installing grid-voltage circuits.For low-voltage
    applications, you do not need to have your installation tested by a qualified
    electrician, but many people choose to do so to make sure there are no mishaps.


    The biggest difference between AC wiring and DC wiring is that you do not need
    to have a separate earth (ground) with DC electric, as the negative connection
    is earthed at the battery and, if you are using one, at the distribution panel.


    If you are using 12-volt or 24-volt low-voltage circuits, you can use the same
    distribution panels, switches and light fittings as you would in a gridhome. As
    already suggested, do not use the same power sockets for low-voltage appliances
    as you use for grid-powered appliances. If you do, you run the risk that low-voltage
    appliances could be plugged directly into a high-voltage socket, with disastrous
    consequences.


    # In conclusion


    +   - Once you have done all your preparation, the installation should be straightforward'
  merge: -1
  pgno: 165
- img_proc: true
  md: '+   - Heed the safety warnings and make sure you are prepared with the correct
    safety clothing and access to chemical clean-up and suitable First Aid in case
    of acid spills

    - Solar arrays are both fragile and expensive. Look after them

    - The most likely thing that can go wrong is wiring up something wrongly. Double-check
    each connection


    +   - Check each stage by measuring the voltage with a multi-meter to make sure
    you are getting the voltage you expect. If you are not, inspect the wiring and
    check each connection in turn'
  merge: -1
  pgno: 166
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 167
- img_proc: true
  md: '#  # Troubleshooting


    Once your solar electric system is in place, it should give you many years of
    untroubled service. If it does not, you will need to troubleshoot the system to
    find out what is going wrong and why.


    # ## Keep safe


    All the safety warnings that go with installation also relate to troubleshooting.
    Remember that solar arrays will generate electricity almost all the time (except
    in complete darkness), and batteries do not have an ‘off’ switch.


    # ## Common faults


    Unless you keep an eye on your solar energy system, problems can often go undetected
    for months. Only if you have a stand-alone system and the power switches off will
    you you find out that you have a problem.


    The faults are typically to be found in one of the following areas:


    +   - Excessive power usage – i.e. you are using more power than you anticipated

    - Insufficient power generation – i.e. you are not generating as much power as
    you expected

    - Damaged wiring/ poor connections

    - Weak batteries

    - Obstructions (shading)

    - Faulty earth (ground)

    - Inverter faults

    - Solar panel failure

    - Solar panel mounting failure


    Obstructions have been covered in the chapter on surveying your site, starting
    on page 87. Other faults are covered below.


    # ## Excessive power usage'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'This is the most common reason for solar electric systems failing, where the
    original investigations underestimated the amount of power that was required.


    Almost all solar controllers provide basic information on an LCD screen that allows
    you to see how much power you have generated compared to how much energy you are
    using, and shows the amount of charge currently stored in the battery bank. Some
    solar controllers include more detailed information that allows you to check on
    a daily basis how your power generation and power usage compares.


    Using this information, you can check your power drain to see if it is higher
    than you originally expected.


    If you have an inverter in your system, you will also need to measure this information
    from your inverter. Some inverters have an LCD display and can provide this information,
    but if your system does not provide this, you can use a plug-in watt meter to
    measure your power consumption over a period of time.


    If your solar controller or your inverter does not provide this information, you
    can buy a multi-meter with data logging capabilities. These will allow you to
    measure the current drain from the solar controller and/or your inverter over
    a period of time (you would typically want to measure this over a period of a
    day).


    Attach the multi-meter across the leads from your batteries to your solar controller
    and inverter. Log the information for at least 24 hours. This will allow you to
    identify how much power is actually being used.


    Some data logging multi-meters will plot a chart showing current drain at different
    times of the day, which can also help you identify when the drain is highest.


    # Solutions


    If you have identified that you are using more power than you were originally
    anticipating, you have three choices:


    +   * Reduce your power load

    * Increase the size of your solar array'
  merge: -1
  pgno: 169
- img_proc: true
  md: '+   - Add another power source (such as a fuel cell, wind turbine or generator)
    to top up your solar electric system when necessary


    # Insufficient power generation


    If you have done your homework correctly, you should not have a problem with insufficient
    power generation when the system is relatively new.


    However, over a period of a few years, the solar panels and batteries will degrade
    their performance (batteries more so than the solar panels), whilst new obstructions
    that cut out sunlight may be causing problems.


    You may also be suffering with excessive dirt on the solar panels themselves,
    which can significantly reduce the amount of energy the solar array can generate.
    Pigeons and cats are the worst culprits for this!


    Your site may have a new obstruction that is blocking sunlight at a certain time
    of day. For example, a tree that has grown substantially since you carried out
    the original site survey.


    Alternatively, you may have made a mistake with the original site survey and not
    identified an obstruction. Unfortunately, this is the most common mistake made
    by inexperienced solar installers. It is also the most expensive problem to fix.
    This is why carrying out the site survey is so important.


    To identify if your system is not generating as much power as originally expected,
    check the input readings on your solar controller to see how much power has been
    generated by your solar panels on a daily basis. If your solar controller cannot
    provide this information, use a multi-meter with data logger to record the amount
    of energy captured by the solar panels over a three-to-five day period.


    # Solutions


    If you have identified that you are not generating as much power as you should
    be, start by checking your solar array. Check for damage on the solar array and
    then give the array a good wash with warm, soapy water and polish using a water-
    and dirt-repellent glass polish or wax.


    Check all the wiring. Make sure there is no unexplained high resistance in any
    of the solar panels or on any run of wiring. It could be a faulty'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'connection or a damaged cable that is causing the voltage problems.


    Carry out another site survey and ensure there are no obstructions between the
    solar array and the sun. Double-check that the array itself is in the right position
    to capture the sun at solar noon. Finally, check that the array is at the optimum
    angle to collect sunlight.


    If you are experiencing these problems only at a certain time of the year, it
    is worth adjusting the angle of the solar panel to provide the maximum potential
    power generation during this time, even if this means compromising power output
    at other times of year.


    Check the voltage at the solar array using a multi-meter. Then check again at
    the solar controller. If there is a significant voltage drop between the two,
    the resistance in your cable is too high and you are losing significant efficiency
    as a result. This could be due to an inadequate cable installed in the first place,
    or damage in the cable. If possible, reduce the length of the cable and test again.
    Alternatively, replace the cable with a larger and better quality cable.


    If none of that works, you have three choices:


    +   - Reduce your power load


    +   - Increase the size of your solar array


    +   - Add another power source (such as a fuel cell, wind turbine or generator)
    to top up your solar electric system when necessary


    # Damaged wiring/ poor connections


    If you have damaged wiring or a poor connection, this can have some very strange
    effects on your system. If you have odd symptoms that do not seem to add up to
    anything in particular, then wiring problems or poor connections are your most
    likely culprit.


    Examples of some of the symptoms of a loose connection or damaged wiring are:


    +   - A sudden drop in solar energy in very warm or very cold weather. This is
    often due to a loose connection or damaged wiring in the solar array or between
    the solar array and the solar controller'
  merge: -1
  pgno: 171
- img_proc: true
  md: '+   Sudden or intermittent loss of power when you are running high loads. This
    suggests a loose connection between batteries, or between the batteries and solar
    controller or inverter


    +   Sudden or intermittent loss of power on particularly warm days after the solar
    array has been in the sun for a period of time. This suggests a loose connection
    somewhere in the array, a damaged panel or high resistance in a cable


    +   Significantly lower levels of power generation from the solar array suggest
    a loose wire connection or a short circuit between solar panels within the array


    +   A significant voltage drop on the cable between the solar array and the solar
    controller suggests either an inadequate cable or damage to the cable itself


    +   Likewise, a significant voltage drop on the cable between the solar controller
    and your low-voltage devices suggests an inadequate cable or damage to the cable
    itself


    +   If you find a cable that is warm to the touch, it suggests the internal resistance
    in that cable is high. The cable should be replaced immediately


    Unfortunately, diagnosing exactly where the fault is time-consuming. You will
    require a multi-meter, a test light and plenty of time.


    Your first task is to identify which part of the system is failing. A solar controller
    that can tell you inputs and outputs is useful here. The information from this
    will tell you whether your solar array is underperforming or the devices are just
    not getting the power they need.


    Once you know which part of the system to concentrate on, measure the resistance
    of each cable using the ohm setting on your multi-meter. If the internal resistance
    is higher than you would expect, replace it. If any cable is excessively hot,
    replace it. The problem could be caused either by having an inadequate cable in
    the first place (i.e. too small) or internal damage to the cable.


    Next, check all the connections in the part of the system you are looking at.
    Make sure the quality of the connections is good. Make sure that all cables'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'are terminated with proper terminators or soldered. Make sure there is no water
    ingress.


    # Weak battery


    The symptoms of a weak battery are that either the system does not give you much
    power as you need, or you get intermittent power failures when you switch on a
    device.


    In extreme cases, a faulty battery can actually reverse its polarity and pull
    the efficiency of the entire bank.


    Weak battery problems show themselves in cold weather and when the batteries are
    discharged to below 50–60% capacity. In warm weather, or when the batteries are
    charged up, weak batteries can quite often continue to give good service for many
    months or years.


    If your solar controller shows that you are getting enough power from your solar
    array to cope with your loads, your most likely suspect is a weak battery within
    your battery bank, or a bad connection between batteries.


    Start with the cheap and easy stuff. Clean all your battery terminals, check your
    battery interconnection cables, make sure the cable terminators are fitting tightly
    on the batteries and coat each terminal with a layer of petroleum jelly to ensure
    good connectivity and protection from water ingress.


    Then check the water levels in your batteries (if they are ‘wet’ batteries). Top
    up as necessary.


    Check to make sure that each battery in your battery bank is showing a similar
    voltage. If there is a disparity of more than 0.7 volts, it suggests that you
    may need to balance your batteries.


    If, however, you are seeing a disparity on one battery of 2 volts or over, it
    is likely that you have a failed cell within that battery. You will probably find
    that this battery is also abnormally hot. Replace that battery immediately.


    If your solar controller has the facility to balance batteries, then use this.
    If not, top up the charge on the weaker batteries, using an appropriate battery'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'charger, until all batteries are reading a similar voltage.


    If you are still experiencing problems after carrying out these tests, you will
    need to run a load test on all your batteries in turn. To do this, make sure all
    your batteries are fully charged up, disconnect the batteries from each other
    and use a battery load tester (you can hire these cheaply from tool companies).
    This load tester will identify any weak batteries within your bank.


    # Changing batteries


    If all your batteries are several years old and you believe they are getting to
    the end of their useful lives, it is probably worth replacing the whole bank in
    one go. Badly worn batteries and new batteries do not necessarily mix well, because
    of the voltage difference. If you mix new and used, you can easily end up with
    a bank where some of the batteries never fully charge.


    If you have a bank of part-worn batteries and one battery has failed prematurely,
    it may be worth finding a second-hand battery of the same make and model as yours.
    Many battery suppliers can supply you with second-hand batteries. Not only are
    they much cheaper than new, but because the second-hand battery will also be worn,
    it will have similar charging and discharging characteristics to your existing
    bank, which can help it bed down into your system.


    If you cannot find a part-worn battery, you can use a new one, but make sure you
    use the same make and model as the other batteries in your bank. Never mix and
    match different models of batteries, as they all have slightly different characteristics.


    If you add a new battery to a part-worn bank, you may find the life of the new
    battery is less than you would expect if you replaced them all. Over a few months
    of use, the performance of the new battery is likely to degrade to similar levels
    to the other batteries in the bank.


    Before changing your battery, make sure that all of your batteries (both new and
    old) are fully charged.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Put a label on the new battery, noting the date it was changed. This will come
    in useful in future years when testing and replacing batteries.


    Once you have replaced your battery, take your old one to your local scrap merchants.
    Lead acid batteries have a good scrap value and they can be 100% recycled to make
    new batteries.


    # Inverter issues


    The symptoms of inverter issues can include:


    +   - Buzzing or humming sounds from some electronic equipment when powered from
    the inverter

    - Failure of some equipment to run from the inverter

    - Regular tripping of circuits

    - Sudden loss of power


    If you are experiencing buzzing or humming sounds from electronic equipment when
    powered from the inverter, or if some equipment is not running at all, it suggests
    that the inverter is not producing a pure AC sine wave. If you have a grid-tie
    system, the AC pure sine waveform generated by the inverter may not be perfectly
    coordinated with the waveform from the grid. This would suggest poor quality power
    from the grid, a grounding issue or a faulty inverter.


    If you have a stand-alone system and have purchased a modified sine wave inverter
    (quasi-sine wave), it may be that you cannot resolve these issues without replacing
    the inverter. Some electronic equipment, such as laptop computers and portable
    televisions, may not work at all using a modified sine wave inverter, whilst other
    equipment will emit a buzz when run from these inverters.


    If you have sudden and unexplained tripping of circuits when running from an inverter,
    or experience sudden loss of power, there are a number of things to check:


    +   - Does the tripping occur when a heavy-load appliance such as a fridge switches
    itself on or off?

    - Does the tripping occur when the inverter cuts in at the start of the day or
    when it cuts out at the end of the day?'
  merge: -1
  pgno: 175
- img_proc: true
  md: '+   - Does the tripping occur more often on very warm days or after heavy rain?


    Unfortunately, circuit tripping and sudden power loss often only occurs when a
    combination of events occur, which can make diagnosis time-consuming and difficult
    to get right.


    The most common reasons for circuit tripping or sudden power loss are temperature-related
    issues. Inverters can generate a huge amount of heat. The hotter they get, the
    less power they produce. If the inverter is running too hot, a sudden peak demand
    can be enough to shut the inverter down momentarily. If the inverter runs too
    hot for too long, it will shut down for a longer period of time to cool.


    If this is the case, you are going to have to provide your inverter with more
    ventilation. If you cannot keep it, it may also mean that you require a more powerful
    inverter to cope with the load.


    If the issue occurs during rain or on very hot days, you may also have a grounding
    problem. Check the inverter with a PAT tester to ensure that you are not getting
    a ground leakage from the inverter itself. If you are, check all the connections
    from the DC input of your inverter.


    # Solar Panel Failure


    Solar panel failures are rare, but they can happen. The symptoms are that you
    get a significant drop of power generation for no apparent reason. This power
    drop will usually be significantly more than you may expect from one panel. This
    is because the drop of performance in one panel impacts the performance of the
    whole string that all the panels in the string underperform.


    Unfortunately, diagnosing which solar panel has failed is not easy: partially
    because the solar panels themselves are inaccessible and getting to the cables
    is not always easy.


    Firstly, isolate the solar array from your inverter/controller. Remember that
    the voltages in a closed circuit can easily run into hundreds of volts and you
    do not want to get electrocuted by disconnecting or connecting cabling or'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'changing a panel. Make sure you are using appropriate electrical gloves when
    checking, disconnecting or connecting cabling.


    To identify a fault with a solar panel, firstly clean each of the solar panels
    so there is no dirt on any of the panels. If you find that one of the panels is
    excessively dirty (pesky pigeons!), you may have found your problem already.


    Whilst you are cleaning the panels, carry out a visual inspection. Is there a
    damaged panel, chipped glass or signs of water ingress? If so, you''ve found your
    fault. Replace the panel.


    Now check the wiring. Is there damage to any of the cables between the panels?
    Is one of the connectors damaged? If so, replace the damaged wiring.


    If you can not find any obvious reason for a fault, you now need to delve more
    deeply into the system. For the next step you will need a sunny day with minimal
    cloud. This is because a faulty panel often shows its weakness during brighter
    conditions and not on a duller day.


    Disconnect the cabling between all the solar panels. Now measure the voltage from
    each of the panels in turn. If you have a faulty panel, one of the panels will
    be showing a significantly lower voltage. Replace the panel and then reconnect
    each of the panels in your array.


    If you still cannot identify which solar panel is at fault, the final step is
    to reconnect the array, missing out one solar panel in turn. You can then measure
    the overall voltage of the whole array. When you have isolated the faulty panel,
    you will see a significantly higher voltage from the rest of the system.


    # Solar Panel Mounting Failure


    If properly installed, solar panel mounting failures are thankfully very rare.
    However, wind buffeting can eventually have an affect, particularly on panels
    at the end of a string. Because solar panels have an airbag between them, there
    is the risk of high winds lifting the end panels off the roof, which in turn can
    damage the solar mounting frame, causing other panels to become unstable.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'Due to the design of solar panel mounting systems, it is thankfully rare that
    such a failure would create major damage to the roof, beyond damage to a few tiles,
    but large, heavy solar panels flying through the air is not a good thing!


    The most likely failure point on a solar panel mounting system is the solar panel
    clamp. These hold the solar panel to the mounting frame and are subject to micro-vibrations
    and buffeting from the wind on the solar panels. This wind buffeting is more likely
    to occur at the edges of the roof and therefore impact the solar panels at the
    end of the string first.


    Prevention is better than cure and thankfully, a visual inspection of a solar
    array from ground level is often enough to provide early warning that an end solar
    panel is becoming loose: if the solar panel at the end of the string is slanting
    at a different angle to the rest of the panels, it is the first sign that a clamp
    is working loose.


    The solution is to replace the offending clamp and check the tightness of all
    the other clamps across the complete solar array.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# # Maintaining Your System


    There is very little maintenance to be carried out on a solar electric system.
    There are some basic checks that should be carried out on a regular basis. Typically
    these should take no more than a few minutes to carry out.


    # ## As required


    +   - Clean the solar array. This takes very little effort as unless you live
    in a very dry and dusty part of the world, the rain will usually do a very good
    job of washing your solar panels clean on a regular basis

    - Telescopic window cleaner kits are available to clean solar arrays mounted on
    lower sections of a roof. If you can easily access the panels, a dirt- and rain-repellent
    glass polish can keep your solar array cleaner for longer

    - If you have a thick layer of snow on your solar array, brush it off! A thick
    blanket of snow quickly stops your solar array from producing any energy at all


    # ## Every month


    +   - If your solar controller or inverter includes a display that shows power
    input and power output, check the performance of your solar array. Check that
    it is in line with your expectations for the time of year. It is worth keeping
    a log of the performance so you can compare it from one year to the next

    - If there is an unexplained drop in performance, clean the solar array, visually
    check the condition of the cables and balance the batteries. If the performance
    does not improve, follow the troubleshooting guide for further assistance


    # ## Every three months


    +   - Visually check to ensure that the end solar panels are not working loose
    (see section on Solar Panel Mounting Failure on page 225)

    - Check the ventilation in the battery box

    - Check the battery area is still weatherproof and there are no leaks from the
    batteries'
  merge: -1
  pgno: 179
- img_proc: true
  md: '+   Clean dirt and dust off the top of batteries

    Visually check all the battery connectors. Make sure they are tightly-fitting.
    Clean and protect them with petroleum jelly where required

    Check the electrolyte level in batteries and top up with distilled water where
    required


    # Every six months


    +   If you have a multi-battery system and your solar controller has the facilities
    to do so, balance the battery bank

    Once the batteries are balanced, use a volt meter or multi-meter to check the
    voltage on each individual battery. Ensure the voltages are within 0.7 volts of
    each other

    If one or more battery has a big difference in voltage, follow the instructions
    on weak batteries in the troubleshooting section of this book


    # Every year


    +   If you have a battery bank with more than two batteries, swap the order of
    the batteries in your bank. Place the batteries that were in the middle of your
    bank at either end and the batteries that were at either end of your bank in the
    middle. Then balance them

    This will ensure that all the batteries get even wear throughout their lifetime
    and thereby increase the overall lifespan of the batteries

    If you are able to easily access the solar panels, check the mounting clamps are
    tight


    # At the start of each winter


    +   Check that the insulation around the batteries

    Check that the area around the batteries is free of rodents. Mice and rats like
    to keep warm, and insulation around batteries is a tempting target. If they found
    your batteries, they are likely to gnaw the cabling as well

    Clean the solar array to ensure you get the best possible performance at the worst
    time of the year'
  merge: -1
  pgno: 180
