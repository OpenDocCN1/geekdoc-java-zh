    # # Using solar irradiance to work out how much energy a solar panel will generate


    Based on these figures, we can calculate on a monthly basis how much power a solar
    panel will give us per day, multiplying the monthly solar irradiance figure by
    the stated wattage of the panel:


    Solar irradiance x Wattage (the solar panel watt-peak rating) = Watts per day


    As we know, the solar irradiance figure depends on the month and the angle for
    the solar panel. Assuming we have a 20W solar panel, mounted flat on the roof,
    here are the calculations for December and June:


    | | December | June |

    |---|---||

    | Flat | 0.60 x 20W = 12 Wh of energy per day | 4.86 x 20W = 97 Wh of energy per
    day |


    As you can see, there is a big difference in the amount of energy you can generate
    in the middle of summer, compared to winter. In this example, over eight times
    the amount of energy is generated in the height of summer compared to the depths
    of winter.


    Here are some calculations again, but with the solar panels angled at 38° for
    best all-year performance. Note the significant improvement in winter performance
    and the slightly reduced summer performance:


    | | December | June |

    |---|---||

    | 38° angle | 1.05 x 20W = 21 Wh of energy per day | 4.20 x 20W = 84 Wh of energy
    per day |'
