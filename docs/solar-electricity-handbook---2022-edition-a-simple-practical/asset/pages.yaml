  md: 'Left: A simple mounting frame for a single solar panel.


    Right: The PV-Pod uses water as a ballast, simplifying installation.


    # # Pole Mounting


    Pole mounting your solar array can be a practical option and can often be cheaper
    than roof mounting. Some pole mounted systems are designed to mount existing poles,
    such as lampposts, and suitable for one or two solar panels, other systems are
    designed to be dedicated solar mounting systems and can mount multiple solar panels.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_78_0.png)


    Some freestanding frames, as as these from Crown International, allow you to adjust
    the panel tilt across the year.


    Some pole mounted systems are designed to be easily adjusted, so that the angle
    of the panels can be adjusted throughout the year to get the maximum power generation
    from the available sunlight. This can significantly increase the amount of power
    generation from your solar array over a period of a year.


    The size and thickness of the pole depends on the number of panels required and
    the height of the pole. The pole must be anchored into the ground, set into concrete.
    The depth of the foundation must be at least half the height of the pole above
    ground. For example, if your pole mounting is going to be 2 metres (around 7 feet),
    the depth of the hole must be 1 metre (3⅓ feet).


    # # Solar Trackers


    Solar panels generate the most energy when they are facing directly at the sun.
    Solar trackers are mounted on a pole mounted system to move the panels throughout
    the day to capture the maximum amount of sunlight.


    Some solar trackers simply move the angle of the panels from left to right (single-axis
    trackers), whilst more advanced trackers adjust both the panels throughout the
    day to capture the maximum amount of sunlight.


    Whilst solar tracker manufacturers can claim a performance benefit of 35-50% for
    their products, most installers report a performance benefit of 30% (/5%) for
    single-axis trackers, and around 40% (/5%) for double-axis trackers. The performance
    improvements are better during the summer months, when energy capture can be increased
    by as much as 55%, whilst during the winter months, energy capture is improved
    by 15–20%.


    Solar trackers work using sensors and electric motors, consuming a small amount
    of electricity. The amount of energy they capture is a fraction of the additional
    energy they capture from the sun''s rays.


    Consequently, adding solar tracking for a solar array can have significant real
    performance improvements. This explains their popularity with large solar farms.
    However, for smaller installations, their benefits need to be weighed against
    their costs. Unless space is premium, buying many more solar panels can work out
    than buying a smaller array and installing solar tracking.


    # # Mounting solar on vehicles


    If you want to install solar panels on a vehicle, such as a caravan/travel or
    recreational vehicle, you need to take airflow into account. You need to reduce
    the drag of the solar panels on the roof of your vehicle, ensuring there is adequate
    airflow around the solar panels to reduce the risk of heat build-up. If you do
    not'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'airflow account, you may have additional wind noise when your vehicle is in
    motion, or at worst the risk of having the solar panels ripped off by the wind.


    There are two main options for fitting solar onto a vehicle. The first is to bond
    flexible solar panels directly onto the roof of the vehicle. Which works best
    is bonding onto a metal surface rather than glass fibre or plastic as the metal
    surface acts as a heat-sink allowing the solar panel to dissipate heat.


    The second option is to mount your solar panels to a spoiler mounting. These mounts
    deflect the air over the solar panel, leaving an air gap behind the panel to ensure
    the panel does not overheat.


    These spoilers are often specific, so make sure your supplier can provide them
    for the solar panels you are planning to buy. These mountings are typically bonded
    onto the roof of the vehicle, using a high strength glue such as Sikaflex 252.
    Once the glue is dry, this creates an extremely strong and permanent mounting
    for the panels that will be easily strong enough to withstand the high-speed wind
    buffeting from a moving vehicle.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_79_0.png)


    Left: Vehicle spoiler mounting.

    Right: A single 80W solar panel mounted with spoiler mountings.


    # # Single panel installations for outbuildings


    If you are planning to fit one panel to an outbuilding, such as a garden shed,
    you can buy plastic corner mountings that can either be bonded or screwed into
    place. These mountings are like vehicle spoiler mountings and are used in the
    same way.


    # # Fabricating your own mounting


    Some people choose to fabricate their own mounting for their solar panels. I have
    done this occasionally, although I usually purchase ready-made mountings. Incidentally,
    if you are fitting solar panels to a building, you must always use a professional
    mounting system.


    If you are designing your own mounting, the design must consider wind load, so
    that it is not damaged or destroyed in high winds. If you are using larger solar
    panels - up to 100W panels - an air gap is enough to avoid excessive heat build-up.
    Around 2-5cm (3/4 - 1 inch) is sufficient. For larger panels, an air gap of 5-8cm
    (2-3 inches) is recommended.


    You will need to make sure that your mounting is strong enough to anchor to the
    ground or heavy enough that it does not move in high winds. Due to the design
    of a solar panel, wind blows underneath the panel through the air gap, which creates
    an area of pressure underneath the panels, creating a lift effect, like that of
    an aircraft wing. Properly secured solar panels can be lifted off their mountings,
    or pull them with mountings, in high winds. You need to ensure that the mountings
    can withstand a lifting force up to twice the force of the solar panels they are
    holding.


    # # Solar array cables


    Solar array cables connect your solar panels together and connect your solar array
    to the solar controller. These cables are often referred to as ''array interconnects''.
    You can purchase them already made up to specified lengths or make them up yourself.
    The cables are extremely heavy duty and resistant to high temperatures and ultra-violet
    light. They also have a tough, extra-thick insulation to make them less prone
    to animal damage.'
