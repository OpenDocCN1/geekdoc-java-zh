- img_proc: true
  md: 'If you are spending a lot of money buying a solar system that needs to last
    many years, it is advisable to purchase from a known brand such as Eco Future,
    Kyocera, Panasonic, Hyundai, Mitsubishi, Solar Frontier or Sharp. My personal
    recommendation is Eco Future monocrystalline solar panels, or Solar Frontier amorphous
    panels. I have found these to be particularly good.


    # ## Buying solar panels


    Not all energy systems have to last ten or twenty years. If you are looking for
    a, cheap system to provide power to an RV or caravan, or if your requirements
    are modest, such as installing a light in a shade, buying a cheap solar panel
    may be the right option for you.


    The quality of the cheap solar panels has improved significantly over the past
    years. Six or seven years ago, buying a cheap, Chinese-made product was for disaster.
    Many of the cheap panels were poorly assembled, allowing water to seep through
    the frames and damaging the solar cells. A lot of used glass panel, a thin, low-grade
    glass that clouded over time and is often chipped or broken. The cells used by
    these manufacturers were often sub-standard reject cells and often degraded quickly.


    Thankfully, most of these problems are now resolved and if you buy a cheap solar
    panel on ebay, you are likely to have a good product that will reliably generate
    power for five to ten years, and in all probability a longer. If you are buying
    a solar panel that you have never heard of, here is a checklist of things to look
    for:


    # ## Bigger than what you''ll need


    If you are buying very cheap solar panel, you are likely to be saving as much
    as 50% of the price when compared to buying a branded product. However, expect
    it to degrade much quickly than a branded unit, and not expect it to quite to
    be efficient


    To counter this, buy a panel with a higher rating (often shown as a watt peak,
    WP, rating) that you might need, or add solar panels if you are purchasing an
    extra array. Aim for 15% more power than you would otherwise have bought. You
    will still save a lot of money, but you will have an extra bit of assurance that
    the system will be up to the task.


    # ## Warranty


    With cheap panels, you''re not going to get a twenty-five year warranty, but you
    should expect a one-or-two year warranty with any panel you buy. Check to see
    exactly what the warranty offers.


    You are looking for a warranty that guarantees a minimum output under controlled
    conditions. The standard across the industry is to guarantee 80% of the quoted
    output under controlled conditions.


    If you have a warranty claim, also check to see how you can claim on that warranty.
    Shipping a broken solar panel way around the world and paying for return carriage
    is to cost as much as buying a new solar panel.


    # ## Glass


    Some cheap solar panels are cheap because they have skipped on the glass. Always
    make sure that the solar panels you are using tempered glass.


    Tempered, or toughened, glass is around eight times stronger than plate glass.
    It is far more robust. If your glass is chipped on panel, you will immediately
    see a significant drop in power output. If water gets into the panel itself, it
    can create a short circuit and becomes a fire hazard. Water and electricity do
    not mix.


    It is also worth investing in solar panels that use self-cleaning glass. Self-cleaning
    glass has a low-friction coating that ensures the panels are washed every time
    it rains. This ensures your panels remain clean and more efficient in every day
    conditions.


    # ## Second-hand PV panels


    From time to, second-hand solar panels appear for sale. They appear on eBay or
    are sold by solar equipment suppliers or building salvage yards.'
