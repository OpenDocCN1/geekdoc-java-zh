  md: '# Who this book is aimed at:


    If you simply want to gain an understanding about solar electricity works, then
    this handbook will provide you with everything you need to know.


    If you are planning to install your own stand-alone solar power system, this handbook
    is a comprehensive source of information that will help you understand solar and
    guide you in the design and installation of your own solar electric system.


    Solar has a big application for integrating into electrical products such as mobile
    phones, laptop computers and portable radios. While light electric cars can use
    solar energy to provide some of their power requirements, depending on the application.
    If you are a designer, looking to see how you can integrate solar into your product,
    this book will give you a grounding in the technology that you will need to get
    started.


    If you are specifically looking to install a grid-tie system, i.e a solar energy
    system will feed electricity back to your local power grid, this book will provide
    you with a good foundation and will allow you to carry out the design of your
    system. You will still need to check the local planning laws and any other local
    legislation surrounding the installation of solar. In some cases, you will need
    to be certified to carry out the physical installation of a grid-tie system. You''ll
    also need a good understanding of electrical systems, with the relevant qualifications
    to carry out the work.


    If you are planning to install larger, commercial-size systems, or hoping to install
    grid-tie solar systems professionally, then this book will serve as a good introduction,
    but you will need to grow your knowledge further. This book gives you the knowledge
    you need to get started, but there are special skills required when designing
    and implementing larger scale systems that go far beyond what is expected for
    smaller systems and the scope of this book.


    If you are a hobbyist planning your own solar installation, it will help you if
    you do DIY projects. While a familiarity with wiring is also of benefit for smaller
    projects and you will require a thorough understanding of electrical systems,
    and the qualifications to carry out electrical installations, if you are planning
    a larger project such as powering a house with solar.


    # The rapidly changing world of solar energy


    I implemented my first solar energy system in 1997. Back then, the largest panels
    I could buy were 100W. Each panel was 9% efficient. The cost for the ten panels
    I needed to create my 1kW array was almost £10,000 (around $13,000).


    Today, solar panels can be up to 24% efficient. They have a higher capacity, a
    longer life expectancy and they are cheaper. If I were to recreate my first 1kW
    array using larger, modern solar panels, the panel price would be £400 ($520).
    Ignoring 25 years of inflation, that is a 96% drop in the price for a solar panel!


    Of course, there is the installation cost than just the solar panels alone. Cabling,
    wiring, batteries, mounting brackets and time all these prices have increased
    in the past twenty years, but the facts remain that solar has transformed from
    an obscure niche to mainstream energy generation because of incredible leaps in
    the technology that has made solar more efficient and more affordable.


    I wrote the first edition of this book in 2009. This 2022 edition is the fifteenth
    edition. Most editions have included significant rewrites to keep up with the
    pace of change, and this edition is no exception.


    The rapid improvement in the technology and the freefall in costs have transformed
    the industry. Systems that were completely unaffordable or impractical seven or
    eight years ago are now cost-effective and achievable.


    Solar panels available today generate more power, they''re more robust and better
    value for money than ever before. storage has become more reliable and cheaper.
    For many applications, solar is now the most cost-effective way to generate electricity.'
