- img_proc: true
  md: 'Based on this, you can see that our obstacle either fully or partially covers
    twelve squares. Each square that you count is equivalent to 1% of lost solar irradiation.
    So for our chosen location, we can calculate that there is approximately a 12%
    loss due to shading.


    As a rough rule of thumb, if you find a location with no shading whatsoever, you
    are doing very well. Anything less than 10% energy loss is usually regarded as
    very good, whilst any location with more than 25% shading can mean significant
    extra costs involved in building your solar system.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_66_0.png)


    # Professional tools for obstacle analysis


    The paper and pencil approach I have described works extremely well, but requires
    a bit of practice and can be time consuming. If you are planning to do several
    solar installations, investing in an obstacle analysis tool or phone app is worth
    your spending.


    In the past, a crafted Solar Pathfinder was one of the best tools you could get.
    This was a plastic unit with an angle chart mounted on the top. A glass dome was
    then placed on top of the chart. You would mount the unit to a tripod at the desired
    location. Obstacles were reflected in the glass bubble and would allow you to
    manually plot the obstacles on the chart and manually work out your shading issues.


    The Solar Pathfinder is surprisingly effective, as it can be easily moved around
    to find the best location for solar panels. Many professional solar installers
    still use a Solar Pathfinder for quick checks, despite using more expensive and
    advanced electronic equipment to provide a more detailed analysis.


    Some suppliers can rent you a Solar Pathfinder for a daily or weekly fee and can
    do the calculations for you you have plotted the obstacles.


    Today are electronic systems that use GPS, tilt switches and accelerometers to
    do this electronically. They are expensive to buy or rent on a daily basis. They
    provide comprehensive solar analysis, however, and if you plan to take up solar
    installations professionally, they are a worthwhile investment.


    The best known is the Asset from Wiley Electronics and the SunEye from Solmetric.
    My personal preference is SunEye, as I find the unit simpler, but both products
    do a similar job.


    # Mobile phone and tablet applications


    Whilst solar pathfinders are very good, these tools are overkill for smaller solar
    installations and are often complicated to use. Frankly, modern smartphones provide
    the processing power and functionality to do a similar job. A few companies have
    now developed solar analysis software to run on their mobile phones. Use the phone''s
    built-in GPS, compass, accelerometer and camera to record a complete shade analysis
    in a matter of few moments.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Some of these applications are free, whilst cost a small amount of money. Two
    products that I have used are Solmetric IPV, running on iPhone, and Solar Shading,
    running on Android devices. Solmetric IPV costs $29.99 and handles your obstacle
    tracking, automatically providing charts showing your shading analysis throughout
    the year. The detail of reporting is not as great as of the other electronic tools,
    but more professionals are now using this system. It provides many of the functions
    that you get with a more expensive system, but in a package that is easier to
    use and far cheaper to buy.


    You can find out more about Solmetric IPV from http://www.solmetric.com and the
    software can be downloaded from iTunes website.


    Solar Shading is produced by Convex Metrics. Costing $15 on the Android Market,
    this application provides you with a complete shading analysis throughout the
    day, presenting the information in easy-to-read charts.


    # Considering the future


    You do need to consider the future when installing a solar electric system. The
    system will have a lifetime of at least 20 years, as far as possible you need
    ensure that the system will be effective for that length of time.


    When scanning the horizon, remember trees and hedges will grow during the lifetime
    of the system. A small spruce in a garden could grow into a monster in the space
    of a few years, and if that is a risk, it is best to know about it now, rather
    than have a hasty surprise few years down the line.


    See if there is any planned work that may overshadow your site and try to assess
    the likelihood of future work that could have an impact on shading.


    It is also worth noting if fog or heavy mist is a problem at certain times of
    day. The efficiency of your solar array will be compromised if the site has regular
    problems with heavy mist.


    # What if there are shading obstructions?


    Once you have identified shading issues, you can design your system around them.
    There are various ways of countering shading issues.


    Unless you have significant shading issues, you can design the problems using
    one of the options described below, or by using a combination of options to come
    up with a workable solution. Over the past few years, I have designed many shade-tolerant
    systems, systems that are designed to work in an entirely shaded environment all
    year.


    # Increasing the number of solar panels


    If you have the space, the first option is to increase the number of solar panels
    you install to control the periods of shading. Thanks to the falling price of
    solar panels, this can be the cheapest solution to the problem.


    This is not always possible, either because of space or cost restrictions. Also,
    it is not the most efficient way of getting around the problem.


    # Panel orientation


    If shade affects you at a particular time of day, consider angling your solar
    panels away from the obstruction. This will increase your effectiveness during
    the unobstructed parts of the day and remove or reduce the impact of the obstruction
    in the first place. The reduction in power generation from angling the panels
    away from due south is less than the impact on shading if you can eliminate the
    shade problem.


    # Choice of solar panel


    Another option is to use amorphous (thin-film) solar panels. Amorphous solar panels
    do not suffer from cell reversal in the same way as crystalline solar panels,
    and could provide far better shade.


    Because of their lower efficiency levels, you will need around twice as much space
    to install amorphous solar panels. If space is no issue, using amorphous solar
    panels is likely to be the simplest and most cost-effective solution for stand-alone
    solar installations.


    Sharp, Mitsubishi, Uni-Solar, Solar Frontier and Sanyo now manufacture high-quality
    amorphous solar panels that offer excellent performance and reliability.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Use micro-inverters


    If you are building a grid-tie system, the best solution is to use micro-inverters,
    where each panel has its own power inverter and a full solar energy system in
    its own right.


    With a micro-inverter system, each solar panel runs entirely independently of
    every other solar panel. If shade affects one panel, none of the others is affected
    in any way.


    Using micro-inverters also means that you can have solar panels facing different
    directions from each other. For instance, if you are installing solar panels on
    a roof and your roof pitches and angles, you can choose to install your solar
    array on more than one part of the roof using a micro-inverter system.


    This approach gives you greater flexibility as to where you mount solar panels.
    It may even be possible to avoid shading issues altogether.


    # Design a multi-string solar array


    Instead of designing your system to have one set of solar panels connected in
    series, you can design your system to have multiple series of solar panels. Inverters
    and controllers are available that would allow you to have multiple strings of
    solar panels, or you can have a controller or inverter for each individual string.


    In effect, this means you end up with two smaller solar power systems, rather
    than one. This may mean you can face your two different sets of solar arrays at
    different angles, giving you the opportunity to mount them in entirely different
    locations if you wish.


    In this scenario, you can design your system so that partial shading will only
    affect one of your strings rather than your entire array. With micro-inverters,
    such an approach may even allow you to avoid the shading issue altogether.


    # If all else fails...


    Sometimes it is not possible, or not cost-effective, to design around shading.
    In this scenario, it requires a rethink of what you can achieve using solar.


    This is an issue that I had with my previous home. My house was on the edge of
    ancient woodland. For most of the year, my home was almost entirely shaded by
    the tall trees that surround it. Even in the height of summer, the sun did not
    reach my garden mid-afternoon.


    This shading meant I could never run my home completely from solar power. However,
    I designed a smaller solar energy system that provided me with enough energy to
    run my lighting and provide backup power in case of a power cut.


    I achieved this by installing amorphous solar panels onto the back of my home,
    facing south-west to catch the afternoon and evening sun. Despite receiving very
    little sunlight, this system provided enough to provide me with lighting and power
    requirements throughout the year, even in the depths of winter.


    # Positioning batteries, controllers and inverters


    You need to identify a suitable location for batteries, controllers and inverters
    within your system. This could be a room within a building, or in an attic space,
    in a garage or garden shed, or in a waterproof housing.


    It is important to keep all the battery close together, to keep the cables as
    short as possible. For ''hardware'', I am referring to the solar array itself,
    batteries, controller and inverter.


    For the batteries, inverter and controller, you are looking for a location that
    fits the following criteria:


    +   - Waters- and weather proof

    - Not affected by direct sunlight

    - Insulated to protect against extremes of temperature

    - Facilities to ventilate gases from the batteries

    - Protected from sources of ignition

    - Away from children, pets and rodents'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Lead acid batteries give off very small quantities of hydrogen charging. Hydrogen
    is explosive. You must ensure that wherever your batteries are stored, the area
    receives adequate external ventilation to ensure these gases cannot build up.
    You should also consider fitting a hydrogen alarm to warn you of any build-up
    of hydrogen over a period of time.


    Lithium-ion batteries are very susceptible to extremes of heat and may catch fire
    if overheated. For reason, lithium-ion batteries are usually installed on an inside
    wall in a garage or in a home where heat build is much less of a problem. Lithium
    batteries should not be installed in an attic space.


    Because of the extremely high potentials introduced solar PV, the ancillary equipment
    must be in a secure area away from children and pets.


    This ancillary equipment can be quite heavy. A residential inverter will typically
    weigh between 15-20kg(33-44 pounds), whilst a residential battery controller will
    weigh around 10-15kg (22-23 pounds). A 4kWh lithium-ion battery system will weigh
    between 60-100kg (132-220 pounds), whilst a similar lead acid battery system will
    weigh around 120kg (265 pounds).


    Most commonly, residential sized controllers and inverters are wall mounted, often
    in a garage or inside a loft, whilst industrial scale systems are floor mounted.
    Batteries are often mounted on heavy duty racking, or in a purpose built battery
    enclosure.


    # Cabling


    While you are on site, consider routes for cables, especially the heavy-duty cables
    that link the solar array, controller, batteries and inverter together. Try to
    keep cable lengths as short as possible, as longer cables mean lower efficiency.
    Measure the lengths of these cables so that you can ascertain the correct specification
    for cables when you start planning the installation.


    Back to our holiday home. Based on previous calculations, the holiday home needs
    a solar array capable of generating 320 watt-hours of energy, if we angle the
    array towards the sun. This solar array will take up approximately 2m² (18 sq.
    ft) of surface area.


    Our site survey for the holiday home showed the main pitch of the roof facing
    east to west. This is not ideal for solar array. The eastern side of the roof
    has a chimney. There is shade from a tall tree that obscures part of the west-facing
    part of the roof. There is no space on the gable of the roof to fit the required
    solar panels.


    # Site survey for the holiday home'
