    \ wide sun charts from the University of Oregon Solar Radiation Monitoring Laboratory\
    \ web site at https://sunchart.oregon.edu/SunChartProgram.php.\nOnce you have\
    \ got your sun chart, you will require a compass and a clinometer. If you do not\
    \ have one, you can download one onto a smartphone or tablet, or make one using\
