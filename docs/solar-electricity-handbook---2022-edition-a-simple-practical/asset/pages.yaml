  md: 'California have recently been introduced, and penalize a lot of homeowners.
    The outlook for the next ten years suggests prices could easily double again.


    It is because of this constant increase in energy prices that could become effective,
    for both home and small business owners for commercial and industrial users, too.
    In both Europe and the US, many hotel and restaurant chains are now choosing to
    install solar on their roofs and there is a renewed interest in solar farms, with
    typical paybacks of eight years in Northern Europe and five years in Southern
    Europe and the southern states in the USA.


    # Greater reliance on electricity in the future


    In the drive to reduce our carbon footprint, we are moving away from gas and towards
    electricity for more of our energy use. Building heating is moving from gas towards
    electric heat; cars and buses are becoming electric. With retail electricity costs
    significantly higher than gas, the cost of bills is becoming more difficult. Installing
    solar can make a significant difference, making a long-term and constant saving
    on energy bills.


    # Solar PV and heat-pumps


    Combining heat-pumps with solar is a good idea. In the UK, gas prices have traditionally
    been around quarter of the price of electricity, which is why gas is used to heat
    most people''s homes. Heat pumps are typically around 300-350% efficient at heating
    homes (they don''t generate heat themselves; they capture the heat from outside
    air, compress it to increase the temperature and release it into the home). A
    heat pump might be more expensive than using gas, but far far cheaper than using
    electricity.


    Combining a heat pump with solar, and controlling the timing of the heating system,
    means that the cost of running a heat pump drops substantially. In some instances,
    and with a well-designed system, it is capable of covering the entire running
    cost of the heat pump for 9-10 days of the year and contributes towards the costs
    for the remaining 2-3 months. We see examples where an annual heating and hot-water
    bill for a four-bedroom home has dropped from £1900 a year to £385, thanks to
    a well-designed solar PV and heat-pump system.


    # Solar PV and electric cars


    Electric cars are now gaining market, thanks to the greater variety of models
    and government incentives. Many countries now have timetables for phasing out
    conventional cars.


    Based on real-world driving, a typical family sized electric car can travel around
    3½ miles (5.6km) on one kWh of electricity. Smaller cars are closer to 5 miles
    (9.6km) and larger cars are around 2.9 miles (4.6km) per kWh. In the UK, the average
    car drives for 20 miles each day. In the US, the figure is 37 miles.


    This means that a typical EV will use between 4-7kWh of energy per day in the
    UK and 7-12kWh in the US. Depending on where you are, and the time of year it
    will depend on how much energy you will be able to use for charging your car.
    If you charge during the day, you will usually find that your car will be able
    to use more of your excess solar production. This maximises your savings and is
    a far more cost-effective solution than purchasing an additional battery for the
    home.


    At home, electric cars are charged from an AC power source, using a dedicated
    charging point. There are now plenty of solar-enabled EV charging points that
    prioritise the use of excess solar energy to charge your car. These charge points
    allow you to override the solar only setting for charging your much more quickly
    but allow the car to be tricked over a longer period purely from excess solar
    energy when time is not important. SolarEdge, Zappi, Wallbox, Snapee and Vivint
    all provide EV chargers that link into your solar array.


    # Financial Incentives


    In the early 2010s, many countries have brought in subsidy packages, grants, and
    other financial incentives to encourage the uptake of solar. Prices have fallen,
    however, many of these subsidies now have been scaled back or withdrawn completely.'
