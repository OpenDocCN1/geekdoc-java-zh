- img_proc: true
  md: '```

    $2 5 0 \wedge 2 X ( \{ - 5 X 5 0 0 \} ) \wedge 2 =$

    ```


    Height of Roof C


    Depth of House b


    In this example, the answer is 353.5cm. This means the slope of your roof (measurement
    d in the diagram at the top of the page) is 353.5cm (139 inches).


    You now need to deduct some of this space. It is never advisable to fit solar
    panels right to the edge of a roof. In some countries, such as the United Kingdom,
    there is a minimum space around the panels that must be left.


    The reason for this is wind loading. The effects of wind speed and pressure on
    roof-mounted solar panels can mean that solar panels mounted too close to the
    edge of a roof either cause damage to the solar panels or to the roof in extreme
    weather conditions. Consequently, it is widely recommended that solar panels are
    not fitted within 30cm (12 inches) of any roof. In the United Kingdom, this has
    been written into building regulations and are a legal requirement for professional
    installations.


    Therefore, you should now subtract 60cm (24 inches) from both the length of the
    building (a) and the slope.


    You now know the amount of roof space you have available: the length of the building
    (a) multiplied by the slope of the roof. So in the example above, the total available
    roof space is 9940cm by 293.5cm.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_58_0.png)


    If you have a hip roof, like the one shown above, your calculation will be a little
    more complicated. A hip roof is a type of roof where all the sides slope downwards
    to the walls. An absolutely accurate calculation to work out precisely the amount
    of space available with a hipped roof can get very convoluted. However, there
    is a quick and simple ready-reckoner calculation that is accurate enough unless
    you are trying to squeeze every last solar panel onto the roof.'
