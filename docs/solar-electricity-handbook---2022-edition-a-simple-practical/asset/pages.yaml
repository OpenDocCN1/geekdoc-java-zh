  md: 'Government incentives to promote renewable energy sources have also changed
    how people install solar. In countries like Germany, the United Kingdom, Spain
    and in the southern states of the United States, residential solar has become
    a common sight over the past ten years. Solar is making a big impact in the way
    that countries generate electricity. In several countries across Europe, solar
    panels are producing as much as 50% of the nation''s energy during peak production
    periods in summer.


    Over the coming years, all the signs are that the technology and industry will
    continue to evolve at a similar pace. In the 2012 edition I claimed that solar
    is the cheapest form of electricity generator by 2015, traditionally low-cost
    electricity generators such as coal-fired power plants. I was wrong. We reached
    cross-over point in many parts of the world by the middle of 2013. Solar farms
    are becoming a common sight, not just in wealthy parts of the world with hot,
    sunny climates such as in California and the southern part of Europe, but also
    in where weather is less predictable in India and China, where solar was unaffordable
    luxury only two or three years ago.


    Between 2009 and 2014, prices of solar panels fell freely, dropping by as much
    as one-third each year. Since then, solar panels have continued to fall by around
    10% per year. Consequently, the cost of a solar panel today is ¹1/th of its price
    in 2009.


    As prices have fallen and efficiencies improved, solar energy has incorporated
    into every everyday device such as laptop computers, mobile phones, backpacks,
    and clothing. Meanwhile, solar is causing a revolution for large areas of Asia
    and Africa, where communities are now gaining access to electricity for the first
    time.


    As an easy-to-use and low-carbon energy generator, solar is without equal. Its
    potential for changing the way we think about energy in the future is huge. For
    families and businesses in rural African and Asian villages, it is creating a
    revolution and saving lives.


    # Solar electricity and solar heating


    Solar electricity is produced from sunlight on photovoltaic solar panels. This
    is different from solar hot water or heating systems, where the power of the sun
    is used to heat water or air.


    Solar heating systems are beyond the remit of this book. That, there is some useful
    information on surveying and positioning your solar panels in this book that is
    relevant to both solar photovoltaics and solar heating systems.


    If you are planning to use solar power to generate heat, heating systems are far
    more efficient than solar electricity, requiring fewer panels to generate the
    same amount of energy.


    Solar electricity is often referred to as photovoltaic solar, or PV. For the purposes
    of this book, whenever I refer to solar panels I am talking about photovoltaic
    panels for generating electricity, and not heating systems.


    # The source of solar power


    Deep in the centre of the sun, intense nuclear activity generates huge amounts
    of radiation. In this turn, radiation generates light called photons. These photons
    have no physical mass of their own but carry huge amounts of energy and momentum.


    Different photons carry different wavelengths of light. Some photons will be non-visible
    (infra-red and ultra-violet), while others will be visible (as white light).


    Over time, photons push out from the centre of the sun. It can take one million
    years for a photon to push out to the surface from its core. Once they reach their
    surface, these photons rush at a speed of 670 miles per million. They reach earth
    in eight minutes.


    On their journey to the sun, photons can collide and be deflected by other particles
    and are destroyed on contact with anything that can absorb radiation, generating
    heat. Your body absorbs photons from the sun. That is why you feel warm on a sunny
    day.'
