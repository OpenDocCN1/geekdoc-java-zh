- img_proc: true
  md: 'Our atmosphere absorbs many of these photons before they reach the surface
    of the earth. That is one of the two reasons that the sun feels so much hotter
    in the middle of the day. The sun is overhead, and the photons have to travel
    through a thinner layer of atmosphere to reach us, compared to the end of the
    day when the sun is setting, and the photons have to travel through a much thicker
    layer of atmosphere.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_7_0.png)


    This is also one of the two reasons why a sunny day in winter is so much colder
    than in summer. In winter, when your location on the earth is tilted away from
    the sun, the photons must travel through a much thicker layer of atmosphere to
    reach us. The other reason that the sun is hotter during the middle of the day
    than at the end is because the intensity of photons is much higher at midday.
    When the sun is low in the sky, these photons are spread over a greater distance
    simply by the angle of you relative to the earth.


    # The principles of solar electricity


    Two layers of a semi-conducting material are combined to create this effect. One
    layer must have a depleted number of electrons. When exposed to sunlight, the
    layers of material absorb the photons. This excites the electrons, causing some
    of them to ''jump'' from one layer to the other, generating an electrical charge.


    Solar panel generate electricity using the photovoltaic effect, a phenomenon discovered
    in 1839 when Edmond Becquerel, a French physicist, observed that certain materials
    produced an electric current when exposed to light.


    The semi-conducting material used to build a solar cell is cut into very thin
    wafers. Some of these wafers are ''doped'' to contaminate simply by three things.
    thereby creating an electron imbalance in the wafers. The wafers are then aligned
    together to make a solar cell. Conductive metal strips attached to the cell take
    the electrical current.


    When a photon hits the cell, it can do one of three things. It can be absorbed
    by the cell, reflected off it or pass through it. When a photon is absorbed by
    the silicon, an electrical current is generated. The more photons (i.e. the greater
    intensity of light) that are absorbed by the solar cell, the greater the current
    generated.


    Solar cells generate most of their electricity from direct sunlight. However,
    they also generate electricity on cloudy days and some systems can generate very
    small amounts of electricity on bright moonlight nights.


    Individual cells typically generate only tiny amounts of electrical energy. To
    make useful amounts of electricity, these cells are connected together to make
    a solar module, otherwise known as a solar panel, or to be more precise, a photovoltaic
    module.


    # Understanding the terminology


    In this book, I use various terms such as ''solar electricity'', ''solar energy''
    and ''solar power''. Here is what I mean when I am talking about these terms:'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Solar power means for generating heat or electrical power from the sun.


    Solar energy refers to either heat or electrical energy generated from the sun.


    Solar electricity refers to generating electrical power using photovoltaic solar
    panels.


    Solar heating refers to generating hot water or warm air using solar heating panels
    or ground-source heat pumps.


    # Setting expectations for solar electricity


    Solar power is a useful way of generating reasonable amounts of electricity, so
    as long as there is a good amount of sunlight and your location is relatively
    free from obstacles such as trees and other buildings that will shade the solar
    panel from the sun.


    Solar can be used in various ways. For instance, you can use solar power as the
    only source for electricity, in which case you need to ensure that your panels
    provide enough energy to handle all your requirements, and you will need batteries
    to store the energy. Alternatively, you can use solar power to supplement your
    electricity supply, such as installing on the roof of your home, using solar power
    during the day and your existing electricity supply for each night.


    When it first became involved in the mid-1990s, many applications were edited
    to add power generation for a specific application, such as a transmitter on the
    top of a hillside where electricity was not unthinkable, or to add electricity
    to a product, such as a pocket calculator or a torch. Installing solar into a
    building was also unthinkable because of the cost, and when solar was installed,
    it was usually to provide specific circuits within the house, such as lighting,
    rather than incorporated into the entire household circuits.


    Today, the main uses for solar are either on a building to supplement an existing
    electricity connection, or in huge solar farms, generating electricity to feed
    the main electricity grid, or in combination with a battery bank.


    # Solar as your only source of electricity


    If you are looking to use solar as your only source of electricity, you need to
    take a good look at your consumption and see how you can keep demand to a minimum.
    In a home environment, it is quite tricky to do this without making changes. As
    others change, it is very easy to underestimate how much electricity we use, and
    solar power can end up becoming very expensive if you want to match your typical
    energy consumption without making to savings.


    Of course, it is possible to put in a cheap and simple solar energy system, which
    doesn''t cost a fortune and can give you decades of reliable service. Some examples
    include:


    +   - Installing a light or a power source somewhere where it is tricky to get
    a standard electricity supply, such as in the garden, or remote gate

    - Creating a reliable and continuous power source where the standard electricity
    supply is unreliable because of regular power cuts

    - Building a mobile power source that you can take with you, as a power source
    for whilst camping, working on DIY projects or working on a building site


    The amount of energy you need to generate has a direct bearing on the size and
    cost of a solar electric system. The more electricity you need, the more difficult
    and expensive your system will become.


    If your requirements for electricity are to run a few loads, to run relatively
    low-power electrical equipment such as a laptop computer, a small TV, a compact
    fridge and a few other bits and pieces, then if you have a suitable location you
    can achieve what you want with solar.


    On the other hand, if you want to run high power equipment such as fan heaters,
    washing machines and power tools, you are likely to find that the costs will get
    out of control.


    As I mentioned earlier, solar electricity is not well suited to generating heat.
    Heating rooms, cooking and heating water all take up significant amounts of energy.
    Using electricity to generate this heat is extremely inefficient.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Instead of using solar electricity to generate heat, you should consider a
    solar hot water heating system, and heating and cooking with gas or solid fuels.


    It is not normally possible to power the average family purely on solar electricity
    without making any cuts in your current electricity consumption. Most houses do
    not have enough roof space for all the panels that would be required. Cost is
    also a factor. If you are planning to go entirely off-grid, it is usually a good
    idea to evaluate your electricity usage and make savings before you proceed.


    Most households and businesses are very inefficient with their electrical usage.
    Spending some time identifying where electricity is wasted and eliminating this
    waste is an absolute necessity if you want to implement solar electricity-effectively.


    This is especially true if you live in climates, such as Northern Europe or Canada,
    where the winter months produce much lower levels of solar energy. In the United
    Kingdom, for instance, the roof of the average-sized home is not large enough
    to hold all the panels that would be required to provide the electricity used
    by the average household in the months of winter, making energy savings essential.


    For other applications, a solar installation is much more cost-effective. In instance,
    no matter what country you live in, providing electricity for a small holiday
    is well within the capabilities of a solar system, so as heating and heating are
    catered for using gas or solid fuels and it is in a sunny position with little
    or no shade. In this scenario, a solar electric system may be more cost-effective
    than installing a conventional electricity system if the house is off-grid and
    not close to a grid electricity connection.


    If your requirements are modest, such as providing a light for a lock-garage or
    a stable for horses, there are off-the-shelf packages to do this for a very reasonable
    cost. £200–£260 ($30–$130) will provide you with a system big for lighting large
    stables or workshops.


    This is far cheaper than installing an electricity supply into a building, which
    can be expensive when a local supply is available just outside the door.


    Low-cost solar panels are also ideal for charging batteries in cars and recreational
    vehicles or on boats, ensuring that the batteries get a trickle charge between
    trips and keeping the batteries in tip-top condition whilst the caravan or boat
    is not in use.


    # Solar as a supplemental power source


    Most solar installations in Europe and North America today are rooftop installations
    on homes. In these systems, the solar panels generate electricity, which is used
    within the home during the day with any excess energy being fed into the grid
    and by other homes nearby. These systems are called ''grid-tie'' systems.


    Grid-tied solar systems effectively create a micro power station that provides
    energy not just for yourself, but for your local community. Electricity can be
    used by other people as well.


    There are a few variations on this. For example, you can install a battery so
    that excess electricity produced during the day can be stored in a battery for
    overnight use. This reduces your personal dependence on the grid, while providing
    the assurance you will not run out of energy.


    When configuring solar as a supplemental power source, the size of your solar
    installation is far less critical. Instead, you can choose the size of system
    based on the amount of space available, or by the budget available for your project.


    Payback for these systems varies considerably based on where you live, how much
    sunlight you get and how much electricity you use during the day. If you are home-based,
    have air conditioning or electric heating, or can charge an electric car during
    the day, a solar installation that should last many decades can pay for itself
    in little as four to six years. For most people, payback takes a longer, but a
    typical home solar installation will usually pay for itself in around seven to
    ten years.'
