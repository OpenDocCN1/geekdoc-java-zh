  md: '![](img/8de3cfd6267fee6ad3673ab029eccca3_60_0.png)


    Then measure a further 100cm (40 inches) down the pitch of the roof and measure
    the width of the roof at this second point. Again, deduct 60cm (24 inches) from
    this measurement.


    Continue measuring at 100cm (40 inch) intervals down to the bottom of the roof.


    You have a good idea of how many rows of solar panels you can fit in and the width
    of each row.


    # Ground-mounting


    If you want to mount your solar array on the ground, you will need a frame onto
    which you can mount your solar panels. Most solar suppliers can supply suitable
    frames or you can fabricate your own on site.


    There are benefits for a ground-mounted solar array. You can easily keep the panels
    clean and use a frame to change the angle of the array at different times of year
    to track the height of the sun in the sky.


    Take a note of ground conditions, as you will need foundations for your frame.


    Incidentally, you can buy ground-mounted solar frames that can also move the panel
    to track the sun across the sky during the day. These Solar Trackers can increase
    the amount of sunlight captured by around 15-20% in winter and up to 55% in summer.


    Unfortunately, at present, commercial solar trackers are expensive. Unless space
    is an absolute premium, you would be better to spend your money on a bigger solar
    array.


    However, for a DIY engineer who likes the idea of a challenge, a solar tracker
    that moves the array as it moves across the sky during the day could be a useful
    and interesting project to do. There are various sites on the internet, such as
    instructables.com, where hobbyists have built their own solar trackers and provide
    instructions on how to make them.


    # Pole-mounting'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Another option for mounting a solar panel is to affix one on a pole. Because
    of the weight and size of the solar panel, you will need an extremely good foundation
    and a heavyweight pole, to withstand the wind.


    You can mount up to 600-watt arrays using single-pole mountings. Larger arrays
    can be pole-mounted frames constructed using two or four poles.


    Most suppliers of solar panels and associated equipment can provide suitable poles.


    # Splitting the solar array into several smaller arrays


    It may be that when you get to the site, you find that there is no space available
    that will allow you to install all the solar panels you need. If this is the case,
    it is possible to split your single solar array into several smaller arrays. This
    means, for instance, you could have two sets of panels mounted on different roof
    pitches, or some mounted on a roof and from some pole.


    If you do this, you are creating two separate solar energy systems, which you
    then have to link together. For a grid-tie system, you would require either a
    micro-inverter system or an inverter that can accept inputs from more than one
    solar array. For a stand-alone system, you would need a battery controller for
    each separate solar array.


    # Identifying the path of the sun across the sky


    Once you have identified a suitable position for your solar array, it is time
    to be a little more scientific in ensuring there are no obstructions that block
    sunlit at different times of the day, or at certain times of the year.


    The path of the sun across the sky changes throughout the year. This is why carrying
    out a site survey is so important as you cannot just check to see where the sun
    is shining today. The height and position of the sun constantly changes throughout
    the year.


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_61_0.png)


    Figure 4: This chart shows the different paths of the sun from sunrise to sunset
    times of the year from the Northern Hemisphere. The intersection between N, S,
    E and W is your location.


    Each year, there are two days in the year when the day is exactly twelve hours
    long. These two days are 21st March and 21st September, the solar equinoxes. On
    these equinoxes the sun rises due east of the equator and sets west of the equator.
    At solar noon on the equinox, exactly six hours after the sun has risen, the angle
    of the sun is 90° minus the local latitude.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'In the Northern Hemisphere (i.e. north of equator), the longest day of the
    year is 21° June and the shortest day of the year is 21° December. These two days
    are the summer and winter solstices respectively.


    On the summer solstice, the angle of the sun is 23.5° higher than it is on the
    equinox, whilst the winter solstice angle is 23.5° lower than on the equinox.


    These two extremes are due to the tilt of the earth, relative to its orbit around
    the sun. In the Northern Hemisphere, the summer solstice occurs when the North
    Pole is tilted towards the sun, and the winter solstice occurs when the North
    Pole is tilted away from the sun.


    We will take London in the United Kingdom as an example. London’s latitude is
    51°. On the equinox, the angle of the sun at noon will be 39° (90° – 51°). On
    the summer solstice, the angle will be 62.5° (39° + 23.5°) and on the winter solstice,
    it will be 15.5° (39° – 23.5°).


    ![](img/8de3cfd6267fee6ad3673ab029eccca3_62_0.png)


    For more detailed information on sun heights on a monthly basis, or for information
    for other countries, visit www.SolarElectricityHandbook.com and follow the link
    to the solar panel angle calculator.


    # # Shading


    As mentioned in the previous chapter, shading can have a very significant impact
    on the performance of your solar energy system. Even a tiny amount of shading
    can have a huge impact on the energy that system is able to generate. Therefore,
    it is important that your solar array remains shade-free whenever possible.


    Being entirely shade free is often impossible to achieve. If so, reducing shade
    to an absolute minimum by carefully evaluating your site is important.


    # # Why shading is a problem


    Unlike solar (hot water) systems, the loss of power through shading is much greater
    than the amount of the panel that is in shade. With solar systems, if only 5%
    of the panel is in shade, you lose less than 5% of the power production. As mentioned
    earlier, the difference is significantly more with photovoltaic cells. Shading
    can bring power generation down by as much as 80%, even if the amount of the panel
    in shade is small.


    The reason for this is in the construction of the solar panel string. A crystalline
    solar panel is made up of individual solar cells. Typically, each of these cells
    generates ½ volt of potential energy. These cells are connected in series to increase
    the voltage to a more useful level inside the solar panel. Each individual solar
    panel has one or more strings of cells.


    Because these strings are connected in series, a solar panel is only as good as
    its weakest cell. If one cell produces a weak output, all the other cells within
    the string are compromised as well. This means that if you have a “soft shade”
    such as a distant tree branch, creating a soft dappled shade across just one or
    two cells on a solar panel, the effect can be to reduce the output of the whole
    string to a similar level to a dull, overcast day.


    Worse happens when you have a more direct shade, creating a bigger contrast between
    light and shade. Even one cell is in complete shade and the remainder are in bright
    sunlight, the shaded cell short-circuits the'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'flow of electrons within the cell goes into reverse.


    However, because the cell is connected in series with the other cells in the panel,
    current is forced through the reversed cell. In this scenario, the reversed cell
    absorbs the power produced by the other cells in the panel, generating heat and
    creating a hotspot in the solar panel.


    The amount of power that is absorbed by a single reversed cell is disproportionate
    to the amount of a single cell can generate. A single cell may only produce ½
    volt of potential energy, but can absorb 6–8 volts when it has gone into reverse.


    If unchecked, a solar cell left in this state can easily be destroyed. The hot
    spot generated by the blocked cell can quickly reach dangerous temperature levels,
    and amateur-built solar panels have been known to burst into flames precisely
    for this reason.


    Thankfully, solar panel manufacturers have a solution to this problem to avoid
    the panel itself becoming damaged. All professionally manufactured crystalline
    solar panels have in-built protection to route power around a string of cells
    where one or more of the cells are in reversal


    If your solar panel has only one single string of solar cells within it, this
    effectively means the entire panel is bypassed and produces no power at all. If
    your solar panel has two strings of solar cell, it means the power output of the
    panel is halved


    Because a solar array is typically put together by installing multiple solar panels
    in series, the effects of shading on just part of one panel impacts the performance
    of the entire solar array.


    # Analysing shading


    When analysing shading, there are two different types of shading to be concerned
    with. Hard shading refers to an object, such as a building or tree within 10 metres
    (33 feet) of your proposed location that creates shading. Soft shading refers
    to object beyond 10 metres of your location. Soft shading from objects that are
    further away still diffused light to reach the solar panel and have less of an
    effect on performance throughout the day.


    You can carry out this analysis in various ways. You can use a sun path diagram
    with compass and pencil, a professional obstacle analysis tool or download a solar
    shading application onto your mobile phone or tablet.


    # Using a sun path diagram with compass


    This is the simplest way to identify shading issues with solar. Used properly,
    it is an accurate way to identify shading issues with your proposed system.


    A sun path diagram shows the location of the sun at different hours of the day
    for different months of the year. The vertical axis shows the height of the sun
    in the sky, whilst the horizontal axis shows the direction of the sun (the azimuth).
    The diagram can be used to identify when nearby objects will cast a shadow across
    a solar panel.'
