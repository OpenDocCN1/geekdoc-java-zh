- img_proc: true
  md: "There are several options when it comes to batteries, and plenty of specialist\
    \ battery suppliers who can advise you on the best options for your solar installation.\
    \ The two main battery technologies you will come across are lead-acid and lithium.\n\
    \nLead acid batteries are the more established of the two technologies. Many people\
    \ write them off as out-of-date, whereas in fact lead acid batteries have evolved\
    \ significantly over the past years and remain the best option for most people.\n\
    \nLithium batteries are much more expensive than lead acid batteries, but they\
    \ often have a longer lifespan and are much more efficient in terms of energy\
    \ storage. However, they are far more volatile than lead acid batteries. They\
    \ require specialized charging and must never be allowed to overheat. Get things\
    \ wrong with a lithium battery pack and you run the risk of fire. If you search\
    \ on Google or YouTube for 'lithium battery fire', you will quickly see examples\
    \ of what go wrong with lithium-ion batteries when they overheat as a consequence\
    \ of being charged, discharged or stored incorrectly.\n\nI have worked with different\
    \ lithium-ion over the past years, starting with handheld computers in the mid-1990s\
    \ and more recently with electric vehicles and solar installations. I have witnessed\
    \ first hand difficulties that manufacturers have with building reliable lithium-ion\
    \ systems.\n\nConsequently, if you are considering going the lithium-ion route,\
    \ you should buy a complete battery management solution, comprising of the solar\
    \ charge controller, the batteries and the inverter. Do not mix and match components\
    \ and do not build your own lithium-ion battery pack from individual lithium-ion\
    \ cells.\n\n# Buying a complete battery pack\n\nOver the past two years, several\
    \ companies have begun offering complete battery packs for solar energy systems.\
    \ Products such as the Tesla Powerwall have received a lot of interest in solar\
    \ energy storage and new products are being launched all the time.\n\nMost of\
    \ these battery systems are expensive, proprietary systems consisting of a battery\
    \ pack, the control electronics and their inverter. They are designed to work\
    \ with a grid-tie system. They need to be on the advantages of being able to use\
    \ your own electricity in the evenings as well as the day, or for the peace of\
    \ mind of providing a power backup in case of a power failure.\n\nWhile they are\
    \ good in their own way, most of the systems are relatively inflexible. You have\
    \ a battery pack of a fixed size and you are limited to the inverter provided.\
    \ Most of the battery systems have a storage capacity of 4kWh and a maximum power\
    \ drain in the range of 600 – 800 watts.\n\nThese systems are designed to implement\
    \ a grid-tie system. In many cases, the battery systems are electrically separate\
    \ from the solar array, charging up from an AC power source and releasing power\
    \ through their own inverter. Most offer the facility to provide power in the\
    \ event of a power cut, although this requires a manual change-over. None of the\
    \ mainstream systems are suitable for off-grid systems.\n\nTheir inflexibility\
    \ can cause some real-world issues that reduces their benefits for many people:\
    \ \n\n+   * Batteries usually take precedent over electrical demands within the\
    \ home. If the batteries need recharging during the daytime, they will charge\
    \ up from the available solar energy before other electrical demands are made.\
    \ Most suppliers claim that their batteries only charge up when electrical demand\
    \ is low, but, if there is insufficient solar energy to charge both the batteries\
    \ and run the electricity within the home over a period of a day, the batteries\
    \ will take precedent.\n* Batteries can only charge if there is sufficient energy\
    \ being produced to charge the batteries. This is not an issue with large solar\
    \ arrays in sunny climates like California, but in the United Kingdom, for example,\
    \ where most residential solar arrays are rated as 4kWp or less, there is insufficient\
    \ energy being produced by the solar array during the winter to recharge a 4kWh\
    \ battery pack on a daily basis. This means that the batteries may not receive\
    \ a full charge every day during the winter, and the solar energy produced by\
    \ your system is exclusively used to charge the batteries on these days."
