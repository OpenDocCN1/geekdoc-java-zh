    we would require a 298Wp solar array to provide power in October |

    | Adjusted Monthly | 695 ÷ 2.41 = 288 watts | With the tilt of the solar panel
    adjusted each month, we can use a 288Wp solar array, the same as the best year-round
    tilt settings |


    This chart tells us that we require a solar array with a generation capacity of
    between 288Wp and 411Wp, depending on the tilt of the solar panels. Compared to
    our earlier calculations for generating power throughout the year, it is much
