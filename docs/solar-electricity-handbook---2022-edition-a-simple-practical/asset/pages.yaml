  md: '# Introducing Solar Energy


    Ninety-three million miles from Earth, our sun is 1,300,000 times the size of
    our planet. with a diameter of 865,000 miles, a surface temperature of 5,600°C
    (over 10,000°F) and a core temperature of 15,000,000°C, it is a huge mass of nuclear
    activity, releasing photons that bathe our planet with light and provide us with
    all the energy we need to live.


    Our planet is incapable of generating energy by itself. Either directly or indirectly,
    our sun provides all the energy we have and supports all of earth. It''s a huge
    energy source. Without it, our world would be nothing more than a frozen wasteland
    of rock.


    Finding ways to harness the sun''s energy and using it to power electrical is
    a terrific idea. There are no ongoing electricity bills, no reliance on a power
    socket, simply a free and everlasting source of energy that does not harm the
    planet. Of course, the reality is a little different from that and solar energy
    will not work for everyone. Yet generating electricity from sunlight is a powerful
    resource, with applications and benefits throughout the world.


    How does it work? What is it suitable? What are the limitations? How much does
    it cost? How do you install it? This book answers all the questions and shows
    you how to use the power of the sun to generate electricity yourself.


    Along the way, I will also expose a few myths about some of the wider claims made
    about solar energy and I will show you where solar power may only be part of the
    solution.


    I will keep the descriptions as straightforward as possible. There are some simple
    mathematics and science involved. It is essential to plan a solar installation
    successfully. However, there are plenty of short-cuts, and we have created a set
    of online calculators, available for free at www.SolarElectricityHandbook.com,
    to keep things simple.


    The book includes example projects to show how you can use solar energy. Some
    of these are very straightforward, as providing electrical light for a shed or
    garage, for example, fitting a solar panel to the roof of a caravan or boat. Others
    are more complicated, as installing photovoltaic solar panels to a house.


    I also show some rather unusual examples, such as the possibilities for solar
    electric motorbikes and cars. These are examples of what can be achieved using
    solar power, along with a little ingenuity and determination.


    I have used one example throughout the book: providing solar-generated electricity
    for a holiday home which does not have access to an electricity supply from the
    grid. I have created this example to show the issues and pitfalls that you may
    encounter along the way, based on real life issues and practical experience.


    A website accompanies this book. It has lots of useful information, along with
    a suite of online energy calculators that will simplify the cost analysis and
    design processes. The website is at www.SolarElectricityHandbook.com.'
