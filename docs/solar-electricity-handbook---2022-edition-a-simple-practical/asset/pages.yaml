- img_proc: true
  md: '# The effects of temperature on solar panels


    Solar panels will generate less power when exposed to high temperatures compared
    to when they are in a cooler climate. Solar PV systems can offer more electricity
    on a day with a cloud and hazy sun when the sun is blazing and the temperature
    is high.


    When solar panels are given a wattage rating, they are tested at 25°C (77°F) against
    a 1,000 W/m² light source. At a cooler temperature, the solar panel will generate
    more electricity, at a warmer temperature the same solar panel will generate less.


    As solar panels are exposed to the sun, they heat up, mainly due to the infrared
    radiation they are absorbing. As solar panels are dark, they can heat up quite
    considerably. In a climate, a solar panel can easily heat up to 80–90°C (160–175°F).


    Solar panel manufacturers provide information to show the effects of temperature
    on their panels. A temperature coefficient of power rating, it is shown as a percentage
    of total power reduction per 1% increase in temperature.


    Typically, this will be in the region of 0.5%, which means for every 1°C increase
    in temperature, you will lose 0.5% efficiency of your solar array, and for every
    1° decrease in temperature you will improve the efficiency of your solar array
    by 0.5%.


    Assuming a coefficient of power rating of 0.5%, this is the impact on a 100W panel
    at different temperatures:


    | Panel output | 0°C | 5°C | 15°C | 25°C | 35°C | 45°C | 55°C | 65°C | 75°C |
    85°C |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | % gain/ loss | 110W | 105W | 100W | 95W | 90W | 85W | 80W | 75W | 70W | -5%
    | -10% | -20% |


    In northern Europe and Canada, high temperature is not a significant factor when
    designing a solar system. However, in southern states of America and in Africa,
    India, Australia and the Middle East, where temperatures are significantly above
    25°C (77°F) for much part of the year, the solar panels may be an important factor
    when planning your system.


    If you are designing a system for all-round use, then in fact a slight dip at
    the height of summer is probably not an issue for you. If that is the case, you
    do not need to consider temperature within the design of your system and you can
    find the information on the next page.


    If your ambient temperature is high during the times of year you need to get maximum
    performance from your solar panels, you can help reduce the temperature of solar
    panels by ensuring a free flow of air above and below the panels. If you are planning
    to mount your solar panels on a roof, make sure there is a gap of 7–10cm (3–4
    inches) below the panels, to allow a flow of air around them. Alternatively, you
    can consider mounting the panels on a pole, which will also aid cooling.'
  merge: -1
  pgno: 51
