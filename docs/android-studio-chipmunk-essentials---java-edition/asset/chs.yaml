  \ 67-3 中标记为 `A` 的菜单中选择正在运行的应用：\n\n![](img/as_database_inspector.jpg)\n图 67-3\n\n\
  从 `Databases` 面板 (`B`) 双击产品以查看当前存储在数据库中的表行。启用 `Live updates` (`C`)，然后使用正在运行的应用向数据库中添加更多记录。关闭\
  \ `Live updates` 以便表格不再处于只读状态，双击表行的单元格并在按下按键之前更改其值。返回正在运行的应用并搜索该产品，以确认对检查器所做的更改已保存到数据库表中。最后，点击下方的查询按钮（如图\
  \ 67-4 中的箭头所示）以显示新的查询标签页 (`A`)，确保选择了 `product_database` (`B`) 并在查询字段 (`C`) 中输入 SQL\
  \ 语句：\n\n![](img/as_database_inspector_query.jpg)\n图 67-4\n\n行列表应该会更新，以反映 SQL 查询的结果\
  \ (`E`)。\n\n### 67.16 总结\n\n本章演示了如何使用 Room 持化库在 `SQLite` 数据库中存储数据。完成的项目利用 `repository`（存储库）将\
  \ `ViewModel` 与所有数据库操作分离，并演示了 `entities`（实体）、`DAO` 以及数据库实例的创建，包括对异步任务的使用。\n\n###\
  \ 68. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（也称为“云存储”）被广泛采用以存储用户文件和数据。驱动这一增长的因素有两个。其一是，大多数移动设备现在都提供持续的高速互联网连接，从而使得数据传输既快速又廉价。第二个因素是，与传统的计算机系统（如台式式机和笔记本电脑）相比，这些移动设备在内部存储资源方面受到限制。例如，今天一个高规格的\
  \ Android 平板具有 128GB 的存储容量。与带有 750GB 硬盘驱动的中端笔记本系统相比，对文件进行无缝远程存储是许多移动应用的关键需求。为了承认这一事实，Google\
  \ 在 Android 4.4 SDK 部分中引入了 `Storage Access Framework`（存储访问框架）。本章将为下一章中名为“Android\
  \ 存储访问框架示例”的更详细的教程做准备。\n\n#### 68.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework`\
  \ 提供了一个直观的用户界面，允许用户在 Android 应用内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过使用此浏览界面（也称为选择器），用户可以例如浏览其所选文档提供者托管的文件（如文档、音频、图像和视频）。例如图\
  \ 68-1 显示了选择器界面显示了由文档提供者服务托管的文件集合：\n\n![](img/as3.0_storage_demo_picker.jpg)\n图\
  \ 68-1\n\n文档提供者可以从云端服务到运行与客户端应用程序在同一设备上的本地文档提供者不等。在编写本文时，兼容 `Storage Access Framework`\
  \ 的最著名的文档提供者是 `Box`，以及意乎意料的 `Google Drive`。其他云存储提供者和应用开发者很快可能也会提供符合 `Storage Access\
  \ Framework` 的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\n通过一组 `Intents`，Android\
  \ 开发者只需几行代码即可将这些存储功能整合到应用中。从开发者的角度来看，`Storage Access Framework` 一个特别引人注目的方面是，用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用内使用框架实现了存储功能，它将与所有文档提供者配合工作而无需任何代码修改。\n\
  \n#### 68.2 使用存储访问框架\n\nAndroid 包含一组 `Intents`，旨在将 `Storage Access Framework` 的功能集成到\
  \ Android 应用中。这些 intent 向用户显示 `Storage Access Framework` 选择器用户界面，并通过调用启动 intent\
  \ 的 activity 的 `onActivityResult()` 方法将交互结果返回给应用。当调用 `onActivityResult()` 方法时，它会将所选文件的\
  \ `Uri` 以及一个指示操作成功或与否的值一起传递过来。\n\n`Storage Access Framework` intent 可以总结如下：\n\n\
  - `ACTION_OPEN_DOCUMENT`：为用户提供访问选择器界面的权限，以便从设备上配置的文档提供者选择文件。所选文件以 `Uri` 对象的形式返回给应用程序。\n\
  - `ACTION_CREATE_DOCUMENT`：允许用户选择文档提供者、该提供者存储上的位置以及新文件的文件名。一旦选择，该文件将由 `Storage Access\
  \ Framework` 创建，并将文件的 `Uri` 返回给应用程序进行进一步处理。\n\n#### 68.3 过滤选择器文件列表\n\n当启动 intent\
  \ 时，选择器用户界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下代码配置 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n```\n\n\n\n\n\n启动上述意图（intent）后，将显示选择器用户界面，允许用户浏览并选择由可用文档提供程序托管的任何文件。一旦用户选择了文件，应用程序将以\
  \ `Uri` 对象的形式获得该文件的引用。随后，应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，即并非文档提供程序列出的所有文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改意图，在选择器中排除此类文件。例如：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\n```\n\n当现在显示意图时，无法使用 `openFileDescriptor()`\
  \ 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许根据文件类型限制可供选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供程序中选择图像文件的选项。这是通过配置意图对象以设置用户可以选择的文件\
  \ MIME 类型来实现的。例如，以下代码指定了只有图像文件适合在选择器中选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步完善以限制选择为 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能会被进一步限制为仅支持播放基于 MP4 的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在处理存储访问框架（Storage Access Framework）时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上找到以下列表：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理意图结果\n\n由于我们启动了将返回结果的意图，因此需要使用 `registerForActivityResult()` 方法（在“Android\
  \ 显式意图 – 示例示例”章节中介绍）来创建一个启动器并声明一个 lambda 表达式来处理返回的数据，例如：\n\n```java\nActivityResultLauncher<Intent>\
  \ startOpenForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 在此处从 Uri 读取文件内容\n            }\n        }\n    });\n```\n\n一旦声明，可以如下所示配置并启动意图：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 68.5\
  \ 读取文件内容\n\n读取文档提供程序托管的文件内容所需的准确步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，并将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示该文件将用于读取。其他选项是用于写入访问的“w”和用于读写访问的“rwt”，其中文件中的现有内容将被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作，并需要使用 `InputStream` 对象。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对该行进行某些操作\n}\ninputStream.close();\n\
  ```\n\n### 68.6 写入文件\n\n向文档提供程序托管的打开文件写入内容与读取类似，不同之处使用的是输出流而不是输入流。例如，以下代码向目标文件的输出流写入文本：\n\
  \n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n    FileOutputStream fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对文件的写入权限。随后使用该文件描述符来获取输出流的引用。在关闭文件描述符和输出流之前，将内容（在本例中为文本）写入输出流。\n\
  \n### 68.7 删除文件\n\n文件是否可以从存储中删除取决于文件提供程序是否支持删除。假设允许删除，可以在指定的 `Uri` 上执行操作：\n\n```java\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n## 68.8 获取文件的持久访问权限\n\n当应用程序通过存储访问框架访问文件时，该访问将一直有效，直到运行应用程序的\
  \ Android 设备重启。可以通过“获取” `Uri` 的必要权限来获得特定文件的持久访问权限。例如，以下代码为 `fileUri` 实例持久化了读写权限：\n\
  \n```java\nfinal int takeFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且应用程序保存了该 `Uri`，用户在设备重启后无需重新从选择器界面选择文件。\n\n\
  如果在任何时间不再需要持久权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法释放它们：\n\n```java\n\
  final int releaseFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 68.9 总结\n\n\n\n\n\n思考近年来人们对“存储”的认知是如何变化的是非常有趣的。 “存储”一词曾与大容量内置硬盘等同，而现在，它同样可能指代托管在远程云端并通过互联网连接访问的存储空间。随着资源受限、内部存储容量最小的“始终在线”移动设备的普及，这种情况正变得日益普遍。\n\
  \nAndroid 存储访问框架（Storage Access Framework）为用户和应用程序开发者提供了一种简单的机制，可以无缝访问存储在云端的文件。通过使用一组意图（intents）以及用于选择文档提供和文件的内置用户界面，现在可以用少量代码将全面的云存储集成到\
  \ Android 应用程序中。\n\n# 69. Android 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云存储访问集成到 Android\
  \ 应用程序中的过程。它由一个选择器用户界面和一组新意图组成，可以轻松地在 Android 应用程序中构建对 `Google Drive` 和 `Box` 等文档提供程序的文件访问。在上一章介绍了\
  \ Android 存储访问框架的基础知识后，本章将创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\n## 69.1 关于存储访问框架示例\n\
  \n在本章创建的 Android 应用程序将是一个基础的文本编辑器，旨在将文本文件远程创建并存储到云存储服务中。在实践中，该示例可以与任何兼容存储访问框架的云文档存储提供程序一起工作，但为了本示例，假设使用\
  \ `Google Drive`。\n\n在功能方面，该应用程序将向用户提供一个多行文本视图，可以在其中输入和编辑文本，并有一组按钮允许创建、打开和保存基于存储的文本。\n\
  \n## 69.2 创建存储访问框架示例\n\n从欢迎界面选择`New Project`（新建项目）选项，在出现的新项目对话框中，点击`Next`（下一步）按钮之前选择`Empty\
  \ Activity`（空活动）模板。\n\n在`Name`字段中输入 `StorageDemo` 并指定包名为 `com.ebookfrenzy.storagedemo`。在点击`Finish`（完成）按钮之前，将`Minimum\
  \ API level`（最低 API ）设置为`API 26: Android 8.0 (Oreo)`，并将`Language`（语言）菜单设置为`Java`。按照[11.8\
  \ 将项目迁移到 View Binding]章节中的通常步骤为项目添加 view binding 支持。\n\n## 69.3 设计用户界面\n\n用户界面需要由三个\
  \ `Button`（按钮）视图和一个 `EditText`（编辑框）视图组成。在`Project`工具窗口中，导航到位于`app -> res -> layout`的`activity_main.xml`布局文件并双击将其加载到`Layout\
  \ Editor`（布局编辑器）工具中。在工具的`Design`（设计）模式下，选择并删除`Hello World!` `TextView` 对象。\n\n在布局的左上角拖动并放置一个`Button`控件，在释放控件之前，显示左侧和顶部的虚线边距指南。放置第二个`Button`，使中心和顶部的边距指南出现。然后放置第三个`Button`\
  \ 控件，使顶部和右侧的边距指南出现。\n\n将三个按钮的文本属性分别更改为“New”（新建）、“Open”（打开）和“Save”（保存）。接下来，放置`Plain\
  \ Text`（纯文本）控件，使其水平居中并位于中间`Button`的下方，以便用户界面布局与[图 69-1]所示匹配。使用`Layout Editor`工具栏中的`Infer\
  \ Constraints`（推断约束）按钮添加任何缺失的约束。\n\n选择布局中的`Plain Text`控件，删除当前的文本属性设置使字段初始为空，并将`ID`设置为`fileText`，记住将所有字符串属性提取到资源值中：\n\
  \n![](img/as_4.1_storage_demo_ui.jpg)\n\n图 69-1\n\n使用`Attributes`（属性）工具窗口，配置`Button`控件上的`onClick`属性，分别调用名为`newFile`、`openFile`和`saveFile`的方法。\n\
  \n## 69.4 添加活动启动器\n\n按照“Android 显式意图 – 实例示例”章节概述的步骤，我们需要从开始注册活动启动器以处理文件内容的创建、打开和保存。在`MainActivity.java`文件中，如下为三个操作中的每一个操作添加一个启动器：\n\
  \n```java\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\nActivityResultLauncher<Intent> startOpenForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle here\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        }\n    );\n\nActivityResultLauncher<Intent> startSaveForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            writeFileContent(currentUri);\n                   \
  \     } catch (IOException e) {\n                            // Handle here\n  \
  \                      }\n                    }\n                }\n           \
  \ }\n        }\n    );\n\nActivityResultLauncher<Intent> startCreateForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        }\n    );\n```\n\n## 69.5 创建新的存储文件\n\n\n\n\n\
  当选中 `New` 按钮时，应用程序需要触发一个配置为 `ACTION_CREATE_DOCUMENT` 的意图（intent），用于创建一个具有纯文本 MIME\
  \ 类型的文件。在设计用户界面时，`New` 按钮被配置为调用名为 `newFile()` 的方法。在该方法内部需要启动相应的意图。\n\n在 `MainActivity.java`\
  \ 文件中，如下所示实现该方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public void newFile(View\
  \ view)\n    {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startCreateForResult.launch(intent);\n    }\n\n.\n\n.\n\n}\n```\n\n此代码创建了一个新的\
  \ `ACTION_CREATE_INTENT` `Intent` 对象。随后对该意图进行配置，以便返回可以使用文件描述打开的文件（通过 `Intent.CATEGORY_OPENABLE`\
  \ 类别设置）。\n\n接下来，代码指定要打开的文件应具有纯文本 MIME 类型，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。\n\n当执行此方法且意图已完成分配的任务时，将调用\
  \ `startCreateForResult()` lambda 表达式，并传入新创建文档的 `Uri`。\n\n编译并运行应用程序，选择 `New` 按钮。存储访问框架（Storage\
  \ Access Framework）随后应显示下载用户界面，如图 69-3 所示：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\
  \n图 69-2\n\n选择上方指定的菜单按钮，选择 `Drive` 选项，然后选择 `My Drive`，并导航到你 Google Drive 存储上的合适位置以保存文件。在选择器界面底部的文本框中，在选择\
  \ `Save` 选项之前，将名称从“newfile.txt”更改为合适的名称（但保留 `.txt` 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\
  \n图 69-3\n\n一旦创建了新文件，应用程序应返回主活动，通知面板中可能会出现一条显示为“1 file uploaded”的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 69-4\n\n此时，应该可以在浏览器窗口中登录你的 Google Drive 账户，并在请求的位置找到新创建的文件。如果文件丢失，请确保运行应用程序的\
  \ Android 设备已连接到活跃互联网。也可以通过运行 Google Drive 应用来验证设备对 Google Drive 的访问权限，该应用在许多 Android\
  \ 设备上默认安装，并可以从 Google Play 商店下载。\n\n### 69.6 保存到存储文件\n\n现在应用程序能够创建新的基于存储的文件了，下一步是添加能够将用户输入的任何文本保存到文件的功能。用户界面被配置为当用户选中\
  \ `Save` 按钮时调用 `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将导致选择器用户界面出现，使用户可以选择存储文本的文件。由于我们只处理纯文本文件，因此需要配置意图以将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其如下所示添加到 `MainActivity.java`\
  \ 类文件中：\n\n```java\npublic void saveFile(View view)\n{\n    Intent intent = new\
  \ Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent)\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 调用了名为 `writeFileContent()` 的方法，并传入要写入文本的文件的\
  \ `Uri`。继续留在 `MainActivity.java` 文件中，现在实现该方法，使其如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                this.getContentResolver().\n    \
  \            openFileDescriptor(uri, \"w\");\n            FileOutputStream fileOutputStream\
  \ =\n                new FileOutputStream(pfd.getFileDescriptor());\n          \
  \  String textContent =\n                binding.fileText.getText().toString();\n\
  \            fileOutputStream.write(textContent.getBytes());\n            fileOutputStream.close();\n\
  \            pfd.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n\n.\n}\n```\n\n该方法首先从用户选择的文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此描述符以写模式（`w`）打开。然后使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑框对象中提取，并在文件描述符和流关闭之前写入输出流。代码还处理了文件写入过程中可能遇到的\
  \ `IO` 异常。\n\n添加新方法后，编译并运行应用程序，在视图中输入一些文本并选择 `Save` 按钮。从选择器界面找到之前创建的 Google Drive\
  \ 文件，将文本保存到该文件。返回浏览器窗口中的 Google Drive 账户并选择文本文件。该文件现在包含了 Android 设备上 `StorageDemo`\
  \ 应用程序输入的文本。\n\n### 69.7 打开并读取存储文件\n\n在编写了创建和保存文件的代码后，最后的任务是添加从存储器打开并读取文件的功能。这涉及编写\
  \ `openFile()` 点击事件处理方法，并实现它以启动 `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void\
  \ openFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startOpenForResult.launch(intent);\n}\n```\n\n下一个任务是实现由 `startOpenForResult()`\
  \ lambda 调用的 `readFileContent()` 方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \n.\n\n.\n\nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport\
  \ java.io.InputStreamReader;\n\n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n.\n\n    private String readFileContent(Uri uri) throws IOException\
  \ {\n        InputStream inputStream =\n            this.getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n\n.\n\n.\n}\n```\n\n\n\n该方法首先提取所选文本文件的描述符并以读取方式打开。随后打开与 `Uri` 关联的输入流，并将其作为\
  \ `BufferedReader` 实例的输入源。接着，读取文件中的每一行并将其存储在 `StringBuilder` 对象中。一旦读取完所有行，将同时关闭输入流和文件描述符，并将文件内容作为\
  \ `String` 对象返回。\n\n## 69.8 测试存储访问应用程序\n\n编码阶段完成后，该应用程序现已准备好进行全面测试。首先，在配置了您的 Google\
  \ 账户身份的 Android 设备或 AVD（Android 虚拟机）上启动应用程序，并选择“新建”（New）按钮。在生成的存储选择器界面中，选择一个 Google\
  \ Drive 位置，并将文本文件命名为 `storagedemo.txt`，然后选择文件名字段右侧的保存（Save）选项。\n\n当返回您的应用程序时，寻找文件上传通知，然后在文本区域输入一些文本，然后选择“保存”（Save）按钮。从选择器中选择之前创建的\
  \ `storagedemo.txt` 文件，将内容保存到文件中。返回应用程序后，删除文本并选择“打开”（Open）按钮，再次选择 `storagedemo.txt`\
  \ 文件。当控制返回应用程序时，文本视图应已填充文本文件的内容。\n\n需要注意的是，如果 Android 设备缺少活跃的互联网连接，存储访问框架（Storage\
  \ Access Framework）会将存储文件缓存缓存。然而，一旦重新建立连接，任何缓存数据将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口中登录您的\
  \ Google Drive 账户，导航到 `storagedemo.txt` 文件并点击它以查看内容，一切顺利的情况下，它应该包含应用程序保存的文本。\n\n\
  ## 69.9 总结\n\n本章详细介绍了如何创建一个 Android Studio 应用程序示例，该程序表现为一个非常基础的文本编辑器，旨在使用 Android\
  \ 存储访问框架利用云存储创建、保存和打开文件。\n\n## 70. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\
  \n智能手机和平板的主要用途之一是提供在线内容的访问。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\nAndroid SDK 包含了两个类，它们在开发应用程序时使在\
  \ Android 设备上实现视频播放变得极其简单。本章将在创建视频播放应用程序之前，对这两个类——`VideoView` 和 `MediaController`——进行概述。\n\
  \n### 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android 应用程序中显示视频最简单的方法是使用 `VideoView`\
  \ 类。这是一个视觉组件，当它被添加到 Activity 的布局中时，提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n- H.263\n\
  - H.264 AVC\n- H.265 HEVC\n- MPEG-4 SP\n- VP8\n- VP9\n\n`VideoView` 类有一系列广泛的方法，可以调用这些方法来管理视频播放。一些较常用的方法如下：\n\
  \n- `setVideoPath(String path)` – 指定要播放的视频媒体的路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地视频文件。\n\
  - `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但它接受 `Uri` 对象作为参数而不是字符串。\n\
  - `start()` – 开始视频播放。\n- `stopPlayback()` – 停止视频播放。\n- `pause()` – 暂停视频播放。\n- `isPlaying()`\
  \ – 返回一个布尔值，指示视频当前是否正在播放。\n- `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备就绪播放时调用回调方法。\n- `setOnErrorListener(MediaPlayer.OnErrorListener)` – 允许在视频播放期间发生错误时调用回调方法。\n\
  - `setOnCompletionListener(MediaPlayer.OnCompletionListener)` – 允许在视频结束时调用回调方法。\n\
  - `getDuration()` – 返回视频持续时间。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回 -1。\n-\
  \ `getCurrentPosition()` – 返回一个指示当前播放位置的整数值。\n- `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控件。\n\n### 70.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行直到结束。这个问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例上来解决。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后或/向前快进）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控件在开始播放时会短暂出现，随后用户可以通过点击实例所锚定的视图在任何时间点重新恢复控件。\n\
  \n该类的一些关键方法如下：\n\n- `setAnchorView(View view)` – 指定控制器要锚定的视图。这指定了控件在屏幕上的位置。\n- `show()`\
  \ – 显示控件。\n- `show(int timeout)` – 控件按指定的持续时间（毫秒）显示。\n- `hide()` – 向用户隐藏控制器。\n-\
  \ `isShowing()` – 返回一个布尔值，指示控件是否对用户可见。\n\n### 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，用于\
  \ `VideoView` 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n在欢迎界面选择新建项目（New Project）选项，并在生成的项目对话框中选择空\
  \ Activity（Empty Activity）模板，然后点击下一步（Next）按钮。\n\n在 Name 字段中输入 `VideoPlayer`，并将 `com.ebookrenzy.videoplayer`\
  \ 指定包名。在点击完成（Finish）按钮之前，将 Minimum API level 设置为 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单改为 Java。按照 11.8 节迁移项目到 View Binding 的步骤启用项目的视图绑定。\n\n### 70.4 设计 VideoPlayer\
  \ 布局\n\n主 Activity 的界面将仅由 `VideoView` 类的实例组成。使用 Project 工具窗口找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件，双击它，将 Layout Editor 工具切换到 Design 模式并删除默认的 `TextView`\
  \ 组件。\n\n从 Palette 面板的 Widgets 分类将 `VideoView` 实例拖到布局中，使其填充可用画布区域，如图 70-1 所示。使用\
  \ Attributes 面板，将 `layout_width` 和 `layout_height` 属性分别更改 `match_constraint` 和 `wrap_content`。此外，移除连接\
  \ `VideoView` 底部到父 `ConstraintLayout` 底部的约束。最后，将组件的 ID 改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)Figure\
  \ 70-1\n\n### 70.5 下载视频文件\n\n由 VideoPlayer 应用播放的视频是一个以 MPEG-4 格式编码的短动画电影片段。使用网络浏览器导航到以下\
  \ URL 以播放视频：\n\n`https://www.ebookfrenzy.com/android_book/movie.mp4`\n\n\n\n\n在浏览器窗口内，右键点击视频播放区域，选择保存或下载视频到本地文件的选项，并选择合适的临时文件系统位置，将文件命名为\
  \ `movie.mp4`。\n\n在 `Android Studio` 中，在 `Project` 工具窗口中找到 `res` 文件夹，右键点击它并选择 `New\
  \ -> Directory` 菜单选项，在名称字段中输入 `raw`，然后点击 `OK` 按钮。使用操作系统的文件导航器，找到上述下载的 `movie.mp4`\
  \ 文件并将其复制。返回 `Android Studio`，右键点击新创建的 `raw` 目录并选择 `Paste` 选项将视频文件复制到项目中。添加完成后，`raw`\
  \ 文件夹应与 `Project` 工具窗口中的图 70-2 一致：\n\n![](img/as_3.6_video_player_raw_file_added.jpg)\n\
  \n图 70-2\n\n## 70.6 配置 VideoView\n\n下一步是为 `VideoView` 配置要播放视频的路径，然后开始播放。这将在主活动初始化时执行，因此将\
  \ `MainActivity.java` 文件加载到编辑器中并按照下面的代码列表进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.widget.VideoView;\n\nimport android.net.Uri;\n\n.\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    private VideoView videoView;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        configureVideoView();\n\
  \    }\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        binding.videoView1.start();\n    }\n}\n```\n\n这段代码的作用是获取布局中 `VideoView`\
  \ 实例的引用，为其分配一个指向位于 raw 资源目录中的电影文件的 `URI` 对象，然后开始播放视频。\n\n在物理 Android 设备上运行应用程序以测试它。应用程序启动后，在视频内容开始播放之前可能会有短暂的缓冲延迟（图\
  \ 70-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\n图 70-3\n\n这展示了将视频播放集成到 Android\
  \ 应用程序中多么简单。本示例到目前为止的所有内容都是通过一个 `VideoView` 实例和三行代码实现的。\n\n## 70.7 在 Video View\
  \ 中添加 MediaController\n\n目前 `VideoPlayer` 应用程序中，用户没有办法控制播放。如之前所述，这可以使用 `MediaController`\
  \ 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.videoplayer;\n\n.\n.\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    private VideoView videoView;\n\n    private MediaController mediaController;\n\
  .\n.\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改后应用程序时，点击 `VideoView` 画布将导致媒体控件出现在视频播放上方。这些控件应该包含一个进度条以及快进、后回和播放/暂停按钮。控件从视图中消失后，可以通过再次点击\
  \ `VideoView` 画布随时恢复。只需多加三行代码，我们的视频播放器现在就有了如图 70-4 所示的媒体控件：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 70-4\n\n## 70.8 设置 onPreparedListener\n\n作为处理视频视频媒体的最后一个示例，现在将扩展活动，以演示配置监听器的机制。在这种情况下，将实现一个监听器，旨在将视频时长作为消息在\
  \ Android Studio Logcat 面板中输出。该监听器还将配置视频播放循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n.\n\nimport android.util.Log;\nimport android.media.MediaPlayer;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    private VideoView videoView;\n\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n    private void configureVideoView() {\n  \
  \      binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n      \
  \              + getPackageName() + \"/\" + R.raw.movie));\n        MediaController\
  \ mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(new\
  \ MediaPlayer.OnPreparedListener() {\n            @Override\n            public\
  \ void onPrepared(MediaPlayer mp) {\n                mp.setLooping(true);\n    \
  \            Log.i(TAG, \"Duration = \" + binding.videoView1.getDuration());\n \
  \           }\n        });\n        binding.videoView.start();\n    }\n}\n```\n\n\
  现在在视频开始播放之前，Logcat 面板中将出现如下所示的消息，视频结束后将重启：\n\n`11-05 10:27:52.256 12542-12542/com.ebookfrenzy.videoplayer\
  \ I/VideoPlayer: Duration = 13504`\n\n## 70.9 总结\n\nAndroid 设备是交付内容的优秀平台，特别是视频媒体。如本章所述，Android\
  \ SDK 提供了两个类即 `VideoView` 和 `MediaController`，它们使得将视频播放集成到 Android 应用程序变得非常简单，通常只需要几行代码。\n\
  \n# 71. Android 画中画模式\n\n在之前的章节中介绍 Android 多任务处理时，简要提到了画中画（PiP）模式，但没有进行详细介绍。画中画模式主要用于视频播放，它允许活动屏幕缩小并放置在屏幕上的任何位置。在这种状态下，活动继续运行，无论设备上运行任何其他活动，窗口都保持可见。这允许用户例如在检查电子邮件或处理电子表格等任务时继续观看视频播放。\n\
  \n本章将提供画中画模式的概述，然后在下一章中为 VideoPlayer 项目添加画中画支持。\n\n## 71.1 画中画功能\n\n正如本章后面解释并在下一章中演示的，通过运行应用程序内部\
  \ API 调用将活动放入画中画模式。进入画中画模式时，可以指定配置选项来控制 PiP 窗口的宽高比，并定义包含在窗口内的活动屏幕区域。例如图 71-1 显示了画中画模式下的视频播放活动：\n\
  \n![](img/Image24273.jpg)\n\n图 71-1\n\n\n\n\n图 71-2 显示了用户点击后的 PiP 模式窗口。在此模式下，窗口会变得更大，并在中心包含一个全屏操作按钮，点击该按钮会将窗口恢复到全屏模式；同时，右上角会有一个退出按钮，用于关闭窗口并将应用程序置于后台。添加到\
  \ PiP 窗口的任何自定义操作也会在此模式显示时呈现在屏幕上。在图 71-2 中，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 71-2\n\n本章的剩余部分将概述如何在 Android 应用内部启用和管理 PiP 模式。\n\n## 71.2 启用画中画模式\n\nPiP 模式目前仅支持运行\
  \ `API 26`（即 Android 8.0（Oreo）或更高版本的设备。实现 PiP 模式的第一步是在项目的清单文件（manifest）中启用它。通过向每个需要\
  \ PiP 支持的 activity 元素添加以下行，可以按 activity 基础配置 PiP 模式：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\"\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 启用该 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 activity 能够处理配置更改。如果没有此设置，每当 activity 进入或退出 PiP 模式时，activity 都会重新启动，导致视频在切换期间从头重新播放。\n\
  \n## 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类来定义，可以使用 `Builder` 类创建其实例，如下：\n\
  \n```java\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder().build();\n\
  ```\n\n上述代码创建了一个具有定义特殊参数的默认 `PictureInPictureParams` 实例。可以使用以下可选方法调用来自定义参数：\n\n\
  - `setActions()` – 用于定义在 activity 处于 PiP 模式时可以在 PiP 窗口内执行的操作。操作将在本章稍后详细介绍。\n- `setAspectRatio()`\
  \ – 声明 PiP 窗口显示的首选宽高比。该方法接受一个 `Rational` 对象作为参数，该对象包含宽/高的比例。\n- `setSourceRectHint()`\
  \ – 接受一个 `Rect` 对象作为参数，定义要在 PiP 窗口中显示的 activity 屏幕区域。\n\n例如，下面的代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。在宽高比的情况下，它是使用 `VideoView` 实例的宽度和高度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                                    videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \          .setAspectRatio(rational)\n              .setActions(actions)\n     \
  \         .build();\n```\n\n一旦定义，可以随时使用 `setPictureInPictureParams()` 方法设置 PiP 参数，如下：\n\
  \n```java\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\n##\
  \ 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams`\
  \ 对象，可以将 activity 画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n```\n\n\
  如果不需要参数，只需按照上一节所述创建一个默认的 `PictureInPictureParams` 对象即可。如果之前使用 `setPictureInPictureParams()`\
  \ 方法设置了参数，则这些参数将与调用 `enterPictureInPictureMode()` 方法时指定的参数合并。\n\n## 71.5 检测画中画模式变化\n\
  \n当 activity 进入 PiP 模式时，隐藏任何不必要的视图非常重要，这样视频才可见。当 activity 重新进入全屏时，需要恢复任何隐藏的界面组件。这些任务和其他模式切换任务可以通过重写\
  \ `onPictureInPictureChanged()` 方法来完成。\n\n```java\n@Override\npublic void onPictureInPictureChanged(boolean\
  \ isInPictureMode) {\n    super.onPictureInPictureChanged(isInPictureMode);\n  \
  \  if (isInPictureMode) {\n        // 进入了画中画模式\n    } else {\n        // 进入了全屏\n\
  \    }\n}\n```\n\n## 71.6 添加画中画操作\n\n当用户点击 PiP 窗口时，画中画操作将以图标的形式出现。实现 PiP 是一个多步骤过程，从实现一种让\
  \ PiP 窗口通知 activity 已选择操作的方法开始。通过在 activity 内部设置广播接收器（broadcast receiver）来实现。\n\n\
  下面的代码段演示了 `Intent`、`PendingIntent` 和 `RemoteAction` 对象以及 `PictureInPictureParams`\
  \ 的创建：\n\n```java\nfinal ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  Intent actionIntent = new Intent(\"MY_ACTION\");\nfinal PendingIntent pendingIntent\
  \ =\n    PendingIntent.getBroadcast(MyActivity.this,\n    REQUEST_CODE, actionIntent,\
  \ FLAG_IMMUTABLE);\nfinal Icon icon = Icon.createResource(MyActivity.this,\n   \
  \ R.drawable.action_icon);\n\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \    \"My Action Title\",\n    \"My Action Description\",\n    pendingIntent);\n\
  \nactions.add(remoteAction);\n\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n\
  \              .setActions(actions)\n              .build();\n\nsetPictureInPictureParams(params);\n\
  ```\n\n## 71.7 总结\n\n画中画模式（PiP mode）是 Android 8.0 引入的一种多任务功能，专门设计允许用户在执行其他应用程序和\
  \ activity 任务时，视频仍在小窗口中继续播放。在使用 PiP 模式之前，必须先在清单文件中启用需要 PiP 支持的 activity。\n\nPiP\
  \ 模式行为通过 `PictureInPictureParams` 类的实例进行配置，并在 activity 内部通过调用 `enterPictureInPictureMode()`\
  \ 方法启动。在 PiP 模式下，应只有视频可见，因此需要隐藏任何其他用户界面元素，直到选择全屏模式。\n\n\n\n\n当用户点击画中画（PiP）窗口时，PiP\
  \ 操作将以图标的形式叠加在窗口上。选中后，这些操作将触发 Activity 内部的行为。PiP 窗口通过广播接收器（broadcast receivers）和等待意图（pending\
  \ intents）通知 Activity 操作。\n\n# 72. Android 画中画教程\n\n接上前面的章节，本章将基于现有的 `VideoPlayer`\
  \ 项目并进行增强，以添加对画中画的支持，包括检测 PiP 模式的变化，以及添加一个用于显示当前运行视频信息的 PiP 操作。\n\n## 72.1 在 Manifest\
  \ 中添加画中画支持\n\n在 Android 应用项目向添加 PiP 支持的第一步是在项目的 Manifest 文件中启用它。打开 `manifests ->\
  \ AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\"\
  .MainActivity\"\n  android:supportsPictureInPicture=\"true\"\n  android:configChanges=\"\
  screenSize|smallestScreenSize|screenLayout|orientation\"\n  android:exported=\"\
  true\">\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n## 72.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ Activity 的布局仅包含一个 `VideoView` 实例。现在向布局中添加一个按钮，用于切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板拖入 `Button` 对象到布局中，使其位置如图 72-1 所示：\n\n![](img/as_4.1_video_plater_pip_ui.jpg)\n\
  \n图 72-1\n\n更改按钮上的文本使其显示为“Enter PiP Mode”（进入 PiP 模式），并将其提取为名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的\
  \ ID 改为 `pipButton` 并配置按钮调用名为 `enterPipMode` 的方法。\n\n## 72.3 进入画中画模式\n\n现在需要在 `MainActivity.java`\
  \ 类文件中添加 `enterPipMode` onClick 回调方法。找到该文件，在代码编辑器中打开并如下添加该方法：\n\n```java\nimport\
  \ android.app.PictureInPictureParams;\nimport android.util.Rational;\n\npublic void\
  \ enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \            binding.videoView1.getHeight());\n    PictureInPictureParams params\
  \ =\n            new PictureInPictureParams.Builder()\n                .setAspectRatio(rational)\n\
  \                .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n\
  \    binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView` 宽和高的 `Rational` 对象。接着，使用 `PictureInPictureParams\
  \ Builder` 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比传递。由于视频在 PiP 模式下不需要显示按钮，因此将其设置为不可见。视频播放控件也被隐藏，以确保视频视图在\
  \ PiP 模式下不会被遮挡。\n\n在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，在点击 PiP 模式按钮之前等待视频开始播放。视频应该缩小并出现在\
  \ PiP 窗口中，如图 72-2 所示：\n\n![](img/as_3.6_video_player_action_bar.jpg)\n\n图 72-2\n\
  \n虽然视频现在于 PiP 窗口中播放，但大部分视图被标准的 Android 栏（action bar）遮挡了。要移除它需要更改 Activity 的应用程序主题样式。在\
  \ Android Studio 中，找到并编辑 `app -> res -> values -> themes.xml` 文件，修改 `AppTheme` 元素以使用\
  \ `NoActionBar` 主题：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- Base application theme. -->\n    <style name=\"Theme.VideoPlayer\" parent=\"\
  Theme.MaterialComponents.DayNight.NoActionBar\">\n        <!-- Primary brand color.\
  \ -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n        <item\
  \ name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n```\n\n对\
  \ `themes.xml (night)` 资源重复此步骤。编译并运行应用，将视频播放进入 PiP 模式，并注意操作栏不再出现在窗口中：\n\n![](img/as_3.6_video_player_no_action_bar.jpg)\n\
  \n图 72-3 点击 PiP 窗口使其增大，然后点击窗口中心出现的全屏标记。尽管 Activity 回到了全屏状态，但请注意按钮和媒体控件仍然保持隐藏状态。显然，需要在项目中添加一些代码来检测\
  \ Activity 内部发生 PiP 模式的时机。\n\n## 72.4 检测画中画模式\n\n如上一章所述，PiP 模式的变化是通过重写受影响 Activity\
  \ 内部 `onPictureInPictureMode()` 方法来检测的。在这种情况下，需要编写该方法，以便能够检测 Activity 是正在进入还是退出\
  \ PiP 模式，并采取适当行动重新激活 PiP 按钮和播放控件。继续留在 `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n\
  @Override\npublic void onPictureInModeChanged(boolean isInPictureInMode) {\n   \
  \ super.onPictureInModeChanged(isInPictureInMode);\n    if (isInPictureInMode) {\n\
  \    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n        binding.videoView1.setController(mediaController);\n\
  \    }\n}\n```\n\n当调用该方法时，会传递一个 `Boolean` 值，指示 Activity 现在是否处于 PiP 模式。上述方法中的代码简单检查此值以决定是否显示\
  \ PiP 按钮并重新激活播放控件。\n\n## 72.5 添加广播接收器\n\n项目的最后一步是在 PiP 窗口中添加一个操作。该操作目的是显示一个包含当前播放视频名称的\
  \ `Toast` 消息。这需要在 PiP 窗口和 Activity 之间进行通信。实现这一点的简单方法是在 Activity 内部实现广播接收器（broadcast\
  \ receiver），并使用等待意图（pending intent）从 PiP 窗口向 Activity 广播消息。这些步骤每次 Activity 进入 PiP\
  \ 模式时都需要执行，因此代码需要添加到 `onPictureInModeChanged()` 方法中。找到该方法并开始通过添加代码来创建意图过滤器（intent\
  \ filter）并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\nimport\
  \ android.content.Context;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInModeChanged(boolean isInPictureInMode)\
  \ {\n        super.onPictureInModeChanged(isInPictureInMode);\n        if (isInPictureInMode)\
  \ {\n            IntentFilter filter = new IntentFilter();\n            filter.addAction(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n            receiver = new BroadcastReceiver()\
  \ {\n                @Override\n                public void onReceive(Context context,\
  \ Intent intent) {\n                    Toast.makeText(context, \"Favorite Home\
  \ Movie Clips\", Toast.LENGTH_LONG).show();\n                }\n            };\n\
  \            registerReceiver(receiver, filter);\n        } else {\n```\n\n\n\n\n\
  ```java\nbinding.pipButton.setVisibility(View.VISIBLE);\nbinding.videoView1.setMediaController(mediaController);\n\
  if (receiver != null) {\n    unregisterReceiver(receiver);\n}\n```\n\n## 72.6 添加\
  \ PiP 动作\n\n在实现广播接收器后，下一步是创建一个 `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的动作。为了本例的演示，将使用一个名为\
  \ `ic_info_24dp.xml` 的图像图标文件。该文件可以在以下 URL 提供的源码下载包的 `project_icons` 文件夹中找到：\n\n\
  [`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
