  \n\n\n\n```xml\n<string name=\"app_name\">WebPrint</string>\n<string name=\"action_settings\"\
  >Settings</string>\n<string name=\"print_string\">Print</string>\n</resources>\n\
  ```\n\n接下来，将 `app` -> `res` -> `menu` -> `menu_main.xml` 文件加载到菜单编辑器中，切换到 `Code`\
  \ 模式并将 `Settings` 菜单选项替换为 `print` ：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
