  \ 72.8 总结\n\n本章演示了 Android 的画中画支持，包括启用和进入 PiP 模式，以及广播接收器和等待意图的使用。\n\n## 73. Android\
  \ 中的运行时权限\n\n### 73.1 理解普通和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来实现安全性。在 Android 6\
  \ 引入之前，权限总是在应用安装时请求的。例如，`图 73-1` 显示了通过 Google Play 安装应用期间请求各种权限的典型界面。\n\n![](img/Image2425.jpg)\n\
  \n图 73-1\n\n对于许多类型的权限，这种场景对于 Android 6.0 或更高版本的应用仍然适用。这些权限被称为**普通权限**，仍需用户在安装时接受。第二类权限被称为**危险权限**，也必须像普通权限一样在清单文件中声明，但必须在首次启动时向用户请求。当发出此类请求时，它将以如\
  \ `图 73-2` 所示的对话框形式出现：\n\n![](img/Image2444.jpg)\n\n图 73-2\n\n属于危险类的权限完整列表包含在 `表\
  \ 73-1` 中：\n\n| 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDAR,WRITE_CALENDAR\
  \ |\n| 摄像头 | CAMERA |\n| 联系 | READ_CONTACTS,WRITE_CONTACTS,GET_ACCOUNTS |\n| 位置\
  \ | ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION |\n| 麦风 | RECORD_AUDIO |\n| 电话 |\
  \ READ_PHONE_STATE,CALL_PHONE,READ_CALL_LOG,WRITE_CALL_LOG,ADD_VOICEMAIL,USE_SIP,PROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMS,RECEIVE_SMS,READ_SMS,RECEIVE_WAP_PUSH,RECEIVE_MMS\
  \ |\n| 存储 | READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE |\n\n表 73-1\n\n### 73.2\
  \ 创建权限示例项目\n\n\n\n\n\n从欢迎屏幕选择 New Project（新建项目）选项，在出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ `Empty Activity`（空活动）模板。\n\n在 `Name` 字段中输入 `PermissionDemo` 并指定 `com.ebookfrenzy.permissiondemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n### 73.3 检查权限\n\nAndroid 支持库（Android Support Library）包含许多方法，可用于在\
  \ Android 应用的代码中查找和管理危险权限（dangerous permissions）。无论应用运行的 Android 版本如何，这些 API 调用都是安全的，但只有在在\
  \ Android 6.0 或更高版本的系统上执行时，它们才会执行有意义的任务。\n\n在应用尝试使用需要批准危险权限的功能之前，无论之前是否已授予权限，代码都必须检查该权限是否已授予。这可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查权限是否已被授予，并返回匹配\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予应用录制音频的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_permission_demo);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n\n        if (permission !=\
  \ PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG, \"Permission to record\
  \ denied\");\n        }\n    }\n}\n```\n\n在运行 Android 6.0 之前的版本的设备或模拟器上运行应用，并检查\
  \ Android Studio 中的 Logcat 输出。应用启动后，Logcat 输出应包含“Permission to record denied”消息。。\n\
  \n编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 `app -> manifests` 下），并添加以下行来请求录制权限：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemoactivity\"\
  \ >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\
  \    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n编译并运行应用一次，注意这次没有出现拒绝权限的消息。显然，在旧版本 Android 版本上请求此权限所需要的所有工作都已完成。然而，在运行 Android\
  \ 6.0 或更高版本的设备或模拟器上运行应用，你会发现尽管权限已添加到 manifest 文件中，检查结果仍然报告权限被拒绝。这是因为 Android 6 及更高版本要求应用还必须在运行时请求危险权限。\n\
  \n## 73.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后将调用一个名为\
  \ `onRequestResult()` 的方法。`requestPermissions()` 方法的参数是当前活动的引用，连同所请求权限的标识符以及一个请求代码（request\
  \ code）。请求代码可以是任何整数，用于标识是哪个请求触发了 `onRequestResult()` 方法的调用。修改 `MainActivity.java`\
  \ 文件以声明请求代码，并在权限检查失败时请求权限：\n\n```java\nimport androidx.core.app.ActivityCompat;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ String TAG = \"PermissionDemo\";\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n\n    @Override\n    private void setupPermissions() {\n        int permission\
  \ = ContextCompat.checkSelfPermission(this,\n                Manifest.permission.RECORD_AUDIO);\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\");\n            makeRequest();\n        }\n   \
  \ }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        String permissions[], int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE:\
  \ {\n            if (grantResults.length == 0\n                    || grantResults[0]\
  \ != PackageManager.PERMISSION_GRANTED) {\n                Log.i(TAG, \"Permission\
  \ has been denied by user\");\n            } else {\n                Log.i(TAG,\
  \ \"Permission has been granted by user\");\n            }\n        }\n    }\n}\n\
  ```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行应用，注意会出现如图 73-3 所示的请求录音权限的对话框：\n\n![](img/as_permission_dialog.jpg)\n\
  \n图 73-3\n\n点击应用按钮，检查 Logcat 面板是否出现了“Permission has been granted by user”消息。\n\n\
  一旦用户授予了请求的权限，在后续调用应用时，`checkSelfPermission()` 调用将返回 `PERMISSION_GRANTED` ，直到用户卸载并重装应用或在设置中更改应用权限。\n\
  \n\n\n\n\n最好是将解释包含在一个独立的对话框中，该对话框可以在请求对话框呈现给用户之前显示。这引出了问题：何时显示此解释对话框？Android 文档建议，只有当用户之前拒绝过权限且提供了一种方法来识别这种情况时，才显示解释对话框。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true`；如果之前没有请求过权限，则返回 `false`。在结果为 `true` 的情况下，应用程序应该显示一个包含权限所需的对话框，并在用户阅读并关闭该对话框后，应重复权限请求。\n\
  \n要在示例应用程序中添加此功能，请修改 `onCreate()` 方法如下所示：\n\n```java\nimport android.app.AlertDialog;\n\
  import android.content.DialogInterface;\n\nprivate void setupPermissions() {\n \
  \   int permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.RECORD_AUDIO);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        Log.i(TAG,\
  \ \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    new DialogInterface.OnClickListener() {\n           \
  \             public void onClick(DialogInterface dialog, int id) {\n          \
  \                  makeRequest();\n                        }\n                 \
  \   });\n            AlertDialog dialog = builder.create();\n            dialog.show();\n\
  \        } else {\n            makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示解释。如果用户之前拒绝了请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在该按钮上配置了监听器，以便在点击按钮时调用 `makeRequest()` 方法。如果之前没有请求过权限，代码将直接跳转到请求权限。\n\
  \n### 73.6 测试权限应用程序\n\n在进行测试的 Android 6 或更高版本的设备或模拟器会话上，启动“设置”应用，选择“应用”选项，并滚动到选择\
  \ PermissionDemo 应用程序。在应用设置屏幕上，点击“卸载”按钮从设备中移除该应用。\n\n再次运行应用程序，当权限请求对话框出现时，点击“不允许”。停止并重启应用程序，验证解释对话框是否出现。点击“确定”按钮，当权限请求对话框再次出现时，点击“在使用应用期间允许”。\n\
  \n返回“设置”应用，选择“应用”选项并再次从列表中选择 PermissionDemo 应用程序。一旦列出应用设置，请验证“权限”部分是否列出了“麦克风”权限：\n\
  \n![](img/as_permission_microphone.jpg)\n\n图 73-4\n\n## 73.7 总结\n\n在 Android 6.0\
  \ 之前，应用程序请求访问某些功能的权限的唯一步骤是在应用程序的清单文件（manifest file）中添加适当的行。用户将在安装应用程序时被提示批准该权限。\n\
  \n### 74. 使用 MediaPlayer 和 MediaRecorder 进行音频录制和播放\n\n音频录制和播放可以使用多种不同的技术实现。一种方案是使用\
  \ `MediaPlayer` 类，它与 `MediaRecorder` 类一样，提供了许多可供的方法。\n\n#### 74.1 播放音频\n\n`MediaPlayer`\
  \ 类关联有一系列可以调用的方法。其中一些关键方法的子集如下：\n\n- `create()`：被调用以创建类的新实例。\n- `setDataSource()`：设置要播放音频的源。\n\
  - `prepare()`：指示播放器准备好开始播放。\n- `start()`：开始播放。\n- `pause()`：暂停播放。可以通过调用 `resume()`\
  \ 方法恢复播放。\n- `stop()`：停止播放。\n- `setVolume()`：接收两个浮点数参数，指定左通道和右通道的播放音量。\n- `resume()`：恢复之前暂停的播放会话。\n\
  - `reset()`：重置媒体播放器的状态。本质上是将实例重置为未初始化状态。最少，一个重置的播放器需要重新设置源并调用 `prepare()` 方法。\n\
  - `release()`：在不再需要播放器实例时调用。此方法确保播放器所持有的任何资源都会被释放。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer`\
  \ 类的实例，设置要播放的音频源，然后调用 `prepare()` 随后调用 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer\
  \ = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n#### 74.2 使用 MediaRecorder\
  \ 类录音录视频\n\n与音频播放一样，录制可以使用多种不同的技术实现。一种方案是使用 `MediaRecorder` 类，它与 `MediaPlayer` 类一样，提供了许多可供的方法：\n\
  \n- `setAudioSource()`：指定要录制的音频源（对于设备麦克风，这通常是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()`：指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`：指定录制的音频或视频存储的格式（例如\
  \ `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`：指定用于录制音频的编码器（例如\
  \ `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()`：配置录制的音频或视频的文件路径。\n- `prepare()`：准备\
  \ `MediaRecorder` 实例以开始录制。\n- `start()`：开始录制过程。\n\n\n\n\n\n- `stop()` – 停止录制过程。一旦录制机停止，在重新启动之前需要进行完全重新配置和准备。\n\
  - `reset()` – 重置录制机。实例在重新启动之前需要进行完全重新配置和准备。\n- `release()` – 在不再需要录制机实例时应调用此方法。该方法确保实例持有的所有资源都得到释放。\n\
  \n使用此类的典型实现将设置源、输出格式、编码格式以及输出文件。然后将调用 `prepare()` 和 `start()` 方法。当录制结束时将调用 `stop()`\
  \ 方法，随后调用 `reset()` 方法。当应用不再需要录制机实例时，建议调用 `release()` 方法：\n\n```java\nMediaRecorder\
  \ mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  .\nmediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release(); own```\n\
  \n要录制音频，应用程序清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml own<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如名为 \"在 Android 中请求运行时权限\"\
  \ 的章节概述的，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用启动时必须对对麦克风访问进行特定请求，相关步骤将在本章稍后介绍。\n\n\
  ## 74.3 关于示例项目\n\n本章的剩余部分将通过创建一个示例应用程序来实现，旨在演示如何使用 `MediaPlayer` 和 `MediaRecorder`\
  \ 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用（以麦克风为例）时，在应用代码中尝试访问它之前，检查该功能的可用性是非常重要的。因此，在本章中创建的应用还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 74.4 创建 AudioApp 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”（空活动）模板。\n\n在 `Name`（名称）字段输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为 `API 26`：Android 8.0\
  \ (Oreo)，并将 Language（语言）菜单更改为 Java。按照第 11.8 节将项目迁移到视图绑定 节概述的步骤为项目添加视图绑定支持。\n\n###\
  \ 74.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口中选择 `activity_main.xml` 文件，并在 Design（设计）模式下的\
  \ Layout Editor 工具中选择“Hello World!” TextView 并将其从布局中删除。\n\n向布局上拖入三个 `Button` 视图。按钮的布局对本示例来说并不重要，尽管图\
  \ 74-1 显示了使用垂直链的建议布局。\n\n配置按钮显示读取 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们赋予视图\
  \ ID `playButton`、`recordButton` 和 `stopButton`。\n\n选择播放按钮，并在 Attributes（属性）面板中配置\
  \ `onClick` 属性，以便用户选择时调用名为 `playAudio` 方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio`\
  \ 的方法。\n\n![](img/as_3.5_audioapp_ui.jpg)\n\n图 74-1\n\n## 74.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录制音频会导致\
  \ Android 系统抛出异常。因此，在进行此类尝试之前检查麦克风的存在至关重要。有多种方法可以实现，包括检查设备的物理存在。一种更简单且更有可能在不同 Android\
  \ 设备上可行的方法是询问 Android 系统是否安装了特定功能的包。这涉及创建 `Android PackageManager` 类的实例，然后调用该对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例的目的，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以调用它来检查麦克风是否存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并进行修改以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    protected boolean hasMicrophone()\
  \ {\n        PackageManager pmanager = this.getPackageManager();\n        return\
  \ pmanager.hasSystemFeature(\n            PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 74.7 初始化 Activity\n\n下一步是修改 activity 以执行若干任务。在 `MainActivity.java`\
  \ 文件中，按如下修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.IOException;\n\
  import android.media.MediaRecorder;\nimport android.media.MediaPlayer;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static MediaRecorder mediaRecorder;\n    private static\
  \ MediaPlayer mediaPlayer;\n    private static String audioFilePath;\n    private\
  \ boolean isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        audioSetup();\n    }\n\n    private void\
  \ audioSetup() {\n        if (!hasMicrophone()) {\n            binding.stopButton.setEnabled(false);\n\
  \            binding.playButton.setEnabled(false);\n            binding.recordButton.setEnabled(false);\n\
  \        } else {\n            binding.playButton.setEnabled(false);\n         \
  \   binding.stopButton.setEnabled(false);\n        }\n        audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\";\n    }\n}\n```\n\n添加的代码首先获取用户界面中三个按钮视图的引用。接下来，调用之前实现的 `hasMicrophone()`\
  \ 方法来确定设备是否包含麦克风。\n\n下一行代码需要更多的解释：\n\n`audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\"`\n\n\n\n\n\n这段代码的目的是识别设备上外部存储的位置（尽管在许多 Android 设备上它实际上是设备内部的，但被称为“外部存储”），并利用该位置创建一个名为\
  \ `maudio.3gp` 的文件路径，音频录制将存储在该文件中。`getExternalFilesDir()` 方法的参数是所需的存储类型（在本例中，我们请求的是音乐目录的路径，尽管也有播客、有声书、电影、图片等其他选项可用）。\n\
  \n在处理外部存储操作时，重要的是要意识到应用程序的此类活动需要在应用程序清单文件（manifest file）中请求权限。例如：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n```\n\n## 74.8\
  \ 实现 `recordAudio()` 方法\n\n当用户点击录制（Record）按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置\
  \ `MediaRecorder` 实例，包含有关音频源、输出格式和编码以及音频存储文件位置的信息。最后，需要调用 `MediaRecorder` 对象的 `prepare()`\
  \ 和 `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下方法实现：\n\n```java\npublic void\
  \ recordAudio (View view)\n{\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n      mediaRecorder = new MediaRecorder();\n      mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \      mediaRecorder.setOutputFormat(\n              MediaRecorder.OutputFormat.THREE_GPP);\n\
  \      mediaRecorder.setOutputFile(audioFilePath);\n      mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \      mediaRecorder.prepare();\n    } catch (Exception e) {\n          e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 74.9 实现 `stopAudio()` 方法\n\n`stopAudio()`\
  \ 方法负责启用播放（Play）按钮，禁用停止（Stop）按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如下列表所示，并应添加到\
  \ `MainActivity.java` 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n  \
  \  binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \    if (isRecording)\n    {\n      binding.recordButton.setEnabled(false);\n  \
  \    mediaRecorder.stop();\n      mediaRecorder.release();\n      mediaRecorder\
  \ = null;\n      isRecording = false;\n    } else {\n      mediaPlayer.release();\n\
  \      mediaPlayer = null;\n      binding.recordButton.setEnabled(true);\n    }\n\
  }\n```\n\n## 74.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法只需创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 74.11 配置和请求权限\n\n在测试应用程序之前，必须在应用程序的清单文件中请求适当的权限。具体而言，应用程序需要录制音频和访问外部存储（SD\
  \ 卡）的权限。在 Project（项目）窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加两个权限标签：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\npackage=\"com.ebookrenzy.audioapp\"\
  \ >\n  <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
  \ />\n  <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<application\n\
  ```\n\n上述步骤将确保当应用安装在运行 Android 6.0 之前的版本的设备上时，用户能够启用这些权限。麦克风和外部存储访问在 Android 中被归类为“危险权限”，因为它们让应用程序有潜力损害用户的隐私。因此，为了让示例应用程序在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在运行时专门地请求这两个权限。编辑 `MainActivity.java` 文件，并从添加一些导入指令和常量开始，作为所请求权限的请求码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n  private static int RECORD_REQUEST_CODE = 101;\n\
  \  private static int STORAGE_REQUEST_CODE = 102;\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和对应的请求标识作为参数。在\
  \ `MainActivity.java` 类中，如下实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \          permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n      ActivityCompat.requestPermissions(this,\n          new String[]{permissionType},\
  \ requestCode);\n    }\n}\n```\n\n使用本书“在 Android 中进行运行时请求”章节概述的步骤，上述方法在请求之前验证指定的权限尚未授予，并将识别码作为参数传递。当被处理后，将在\
  \ Activity 上调用 `onRequestPermissions()`，传递识别码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按如下实现此方法：\n\n```java\n@Override\npublic void onRequestPermissions(int requestCode,\n\
  \          String permissions[], int[] grantResults) {\n    super.onRequestPermissions(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n      case RECORD_REQUEST_CODE:\
  \ {\n        if (grantResults.length == 0\n            || grantResults[0] !=\n \
  \           PackageManager.PERMISSION_GRANTED) {\n          binding.recordButton.setEnabled(false);\n\
  \          Toast.makeText(this,\n              \"Record permission required\",\n\
  \              Toast.LENGTH_LONG).show();\n        } else {\n          requestPermission(\n\
  \              Manifest.permission.WRITE_EXTERNAL_STORAGE,\n              STORAGE_REQUEST_CODE);\n\
  \        }\n        return;\n      }\n      case STORAGE_REQUEST_CODE: {\n     \
  \   if (grantResults.length == 0\n            || grantResults[0] !=\n          \
  \  PackageManager.PERMISSION_GRANTED) {\n          binding.recordButton.setEnabled(false);\n\
  \          Toast.makeText(this,\n              \"External Storage permission required\"\
  ,\n              Toast.LENGTH_LONG).show();\n        }\n      }\n    }\n  }\n```\n\
  \n\n\n\n上述代码通过检查请求标识符代码，在检查是否授予了相应的权限之前，识别出哪一个权限请求已返回。如果用户授予了访问麦克风的权限，代码将继续请求访问外部存储。如果任一权限被拒绝，将向用户显示一条消息，指示应用程序将无法运行。在这两种情况下，录制按钮也会被禁用。\n\
  \n在测试应用程序之前，最后需要做的工作是在应用启动时调用新添加的 `requestPermission()` 方法来请求麦克风访问。在 `MainActivity.java`\
  \ 文件中，按照如下所示修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    audioFilePath =\n           \
  \ Environment.getExternalStorageDirectory()\n                .getAbsolutePath()\n\
  \                + \"/myaudio.3gp\";\n    requestPermission(Manifest.permission.RECORD_AUDIO,\n\
  \            RECORD_REQUEST_CODE);\n}\n```\n\n### 74.12 测试应用程序\n\n在带有麦克风的 Android\
  \ 设备上编译并运行应用程序，允许请求的权限并点击录制（Record）按钮。录制完成后，点击停止（Stop）然后点击播放（Play），此时录制的音频应通过设备扬声器回放。如果在\
  \ Android 6.0 或更高版本上运行，请注意应用程序在首次启动时会请求使用外部存储和录制音频的权限。\n\n## 74.13 总结\n\nAndroid\
  \ SDK 为音频录制和播放提供了多种机制。本章以 `MediaPlayer` 和 `MediaRecorder` 类的形式查看了其中两种。在涵盖了使用这些技术的理论之后，本章详细介绍了如何创建一个用于录制并然后回放音频的示例应用程序。在\
  \ Android 中处理音频的过程中，本章还研究了在尝试录制音频之前，确保运行应用程序的设备具有麦克风的步骤。还涵盖了以 SD 卡形式使用外部存储的内容。\n\
