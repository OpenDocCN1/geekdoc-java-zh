- "# Android Studio Chipmunk 核心指南 - Java 版\n\n\n\n![](img/java_chipmunk_front_cover_large.png)\n\
  \n\n\n\n\n\n\n\n\n索引\n\n目录\n\n1. 引言\n\n\n\n\n\n本书已针对 Android Studio Chipmunk 进行了完全更新，目标是教你如何使用\
  \ Java 编程语言开发 Android 应用程序。\n\n从基础知识开始，本书概述了设置 Android 开发和测试环境所需的步骤大纲。书中包含了对 `Android\
  \ Studio` 的概述，涵盖了工具窗口、代码编辑器和 `Layout Editor` 工具等领域。在介绍 Android 架构之后，将深入探讨如何使用 `Android\
  \ Studio` 环境设计 Android 应用程序和用户界面。\n\n书中章节还涵盖了 Android 架构组件，包括视图模型（view models）、生命周期管理、`Room`\
  \ 数据库访问、`Database Inspector`、应用导航、活动数据（live data）和数据绑定（data binding）。\n\n书中还涵盖了如\
  \ `intents` 等更高级的话，以及触摸屏处理、手势识别以及音频的录制和播放。本书的版本还涵盖了打印、过渡以及对折叠屏设备的支持。\n\n还详细介绍了材料设计（material\
  \ design）的概念，包括悬浮按钮、`Snackbars`、标签页界面、卡片视图（card views）、导航抽屉和折叠工具栏的使用。\n\n书中还详细介绍了\
  \ `Android Studio Chipmunk` 和 Android 的其他关键特性，包括 `Layout Editor`、`ConstraintLayout`\
  \ 和 `ConstraintSet` 类、`MotionLayout Editor`、视图绑定（view binding）、约束链（constraint chains）、屏障（barriers）和直接回复通知。\n\
  \n章节还涵盖了 `Android Studio` 的高级功能，如 `App Links`、`Dynamic Delivery`、`Gradle` 构建配置以及将应用提交到\
  \ `Google Play Developer Console`。\n\n假设你已经具有一些 Java 编程经验，准备好下载 `Android Studio`\
  \ 和 `Android SDK`，拥有 Windows、Mac 或 Linux 系统，并且对要开发的应用有一些想法，你就可以开始了了。\n\n## 1.1 下载代码示例\n\
  \n书中包含示例的源代码和 `Android Studio` 项目文件可以在以下地址下载：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n从代码示例将项目加载到 `Android Studio` 的步骤如下：\n\n1. 在 `Welcome to Android Studio` 对话框中，点击\
  \ `Open` 按钮选项。\n2. 在项目选择对话框中，导航并选择包含要导入项目的文件夹，然后点击 `OK`。\n\n## 1.2 反馈\n\n我们希望你对购买本书感到满意。如果你在书中发现任何错误，或有任何意见、问题或考虑，请通过以下邮箱与我们联系-feedback@ebookfrenzy.com。\n\
  \n## 1.3 勘误\n\n虽然我们尽力确保书中内容的准确性，但涵盖如此规模和复杂性的书籍不可免会包含一些错误和疏忽。书中任何已知问题将与解决方案一起列在以下\
  \ URL 中：\n\n[`www.ebookfrenzy.com/errata/chipmunkjava.html`](https://www.ebookfrenzy.com/errata/chipmunkjava.html)\n\
  \n如果你发现勘误表中未列出的错误，请通过电子邮件向我们的技术支持团队 feedback@ebookfrenzy.com 告知我们。他们将为你提供帮助，并努力解决你可能遇到的任何问题。\n\
  \n# 2. 设置 Android Studio 开发环境\n\n在开始开发 Android 应用程序之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装\
  \ `Android Studio` 集成开发环境 (IDE)，它还包括 Android 软件开发包 (`SDK`) 和 `OpenJDK` Java 开发环境。\n\
  \n本章将涵盖在 Windows、macOS 和 Linux 系统上安装 Android 应用开发所需组件的步骤。\n\n## 2.1 系统要求\n\nAndroid\
  \ 应用开发可以在任何一种系统类型上进行：\n\n*   Windows 8/10/11 64 位\n*   运行在 Intel 或 Apple 芯片上的 macOS\
  \ 10.14 或更高版本\n*   配备 Intel i5 或更高处理器的 Chrome OS 设备\n*   带有 2.31 或更高版本 GNU C 库 (`glibc`)\
  \ 的 Linux 系统\n*   至少 8GB 内存（见下文）\n*   约 8GB 可用磁盘空间\n*   最低屏幕分辨率 1280 x 800\n\n尽管\
  \ `Android Studio` 可以在具有 8GB 内存的电脑上运行，但在包含更多内存的系统上性能将大大。如果你计划使用 Android 虚拟设备模拟器\
  \ (`AVD`) 测试应用，这将特别是一个问题。\n\n## 2.2 下载 Android Studio 程序包\n\n开发 Android 应用的大部分工作将使用\
  \ `Android Studio` 环境完成。书的内容和示例是基于 `Android Studio Chipmunk 2021.2.1` 并使用 Android\
  \ API 32 `SDK` 创建的，在编写时，这些是当前版本。\n\n然而，`Android Studio` 频繁更新，因此自本书出版以来可能已经发布了新版本。\n\
  \n可以从主下载页面下载最新版本的 `Android Studio`，可以通过以下 URL 找到：\n\n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果此页面提供了下载较新版本 `Android Studio` 的说明，请注意本书与软件之间可能存在细微差异。如果这些差异成为问题，网络搜索“Android\
  \ Studio Chipmunk”可以提供旧版本的选项。或者，访问以下网页查找 `Android Studio Chipmunk 2021.2.1`：\n\n\
  [`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n## 2.3 安装 Android Studio\n\n下载完成后，安装 `Android Studio` 的具体步骤取决于执行安装的操作系统。\n\n###\
  \ 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 `Android Studio` 安装执行文件（命名为 `android-studio-<version>-windows.exe`）并双击启动安装程序，如果弹出用户账户控制对话框，点击“是”。\n\
  \n一旦出现 `Android Studio` 安装向导，按照各个屏幕配置安装以满足你的需求，包括安装 `Android Studio` 文件系统位置以及是否供其他用户使用。在提示选择要安装的组件时，确保选中了\
  \ `Android Studio` 和 `Android Virtual Device` 选项。\n\n虽然对 `Android Studio` 的安装位置没有严格规定，本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio`，并且 Android `SDK` 包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置好选项后，点击 `Install` 按钮开始安装。\n\n在带有开始菜单的 Windows 版本中，可以从安装期间添加的项目项目中启动新安装的\
  \ `Android Studio`。可以通过导航到 `Android Studio\\bin` 目录，右键点击 `studio64` 可执行文件，并选择“固定到任务栏”菜单选项将其固定到任务栏，以便于访问。\n\
  \n### 2.3.2 在 macOS 上安装\n\nmacOS 版本的 `Android Studio` 以磁盘镜像 (`.dmg`) 文件的形式下载。一旦下载了\
  \ `android-studio-<version>-mac.dmg` 文件，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n\n\n\n\
  \n![](img/as_dmg_drag_to_applications.jpg)\n\n图 2-1\n\n要安装此包，只需将 Android Studio\
  \ 图标拖动到“应用程序”（Applications）文件夹中。Android Studio 包将随后安装到系统的应用程序文件夹中，此过程通常需要几秒钟即可完成。\n\
  \n要启动 Android Studio，请使用 Finder 窗口在应用程序文件夹中找到可执行文件并双击它。\n\n为了以后以后访问该工具，可以从 Finder\
  \ 窗口将 Android Studio 图标拖动并释放到 Dock（程序坞）上。\n\n### 2.3.3 在 Linux 上安装\n\n下载好 Linux\
  \ 版 Android Studio 包后，打开终端窗口，切换到准备安装 Android Studio 的目录并执行以下命令：\n\n```bash\nunzip\
  \ /<path to package>/android-studio-ide-<version>-linux.zip\n```\n\n请注意，Android\
  \ Studio 压缩包将安装到名为 `android-studio` 的子目录中。因此，假设上述命令是在 `/home/demo` 下执行的，软件包将解压到\
  \ `/home/demo/android-studio`。\n\n要启动 Android Studio，请打开终端窗口，切换到 `android-studio/bin`\
  \ 子目录并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux 系统上运行时，可能在运行 Android\
  \ Studio 之前需要安装一些 32 位支持库。在 Ubuntu 上，可以使用以下命令安装这些库：\n\n```bash\nsudo apt-get install\
  \ libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386\n```\n\n在基于\
  \ Red Hat 和 Fedora 的 64 位系统上，使用以下命令：\n\n```bash\nsudo yum install zlib.i686 ncurses-libs.i686\
  \ bzip2-libs.i686\n```\n\n## 2.4 Android Studio 设置向导\n\n如果您是首次安装 Android Studio，在设置过程开始后出现的初始对话框可能类似于下方图\
  \ 2-2 所示：\n\n![](img/as_no_sdk_found.jpg)\n\n图 2-2\n\n如果出现此对话框，点击“下一步”（Next）按钮以显示\
  \ SDK 组件设置对话框（图 2-3）。在此对话框中，点击“下一步”按钮之前，请确保已选择 Android SDK 选项以及最新的 API 包：\n\n![](img/as_install_sdk.jpg)\n\
  \n图 2-3\n\n点击“下一步”后，Android Studio 将下载并安装 Android SDK 和工具。\n\n如果您之前安装过旧版本的 Android\
  \ Studio，在首次启动此新版本时，可能会出现一个对话框，提供从之前的 Android Studio 版本导入设置的选项。如果您有以前版本的设置并希望将其导入到最新安装中，请选择相应的选项和位置。或者，指示您不需要导入任何之前的设置并点击“确定”（OK）按钮继续。\n\
  \n完成这些初始设置步骤后，点击“完成”（Finish）按钮显示“欢迎 Android Studio”界面：\n\n![](img/as_bumble_bee_welcome.jpg)\n\
  \n图 2-4\n\n## 2.5 安装额外的 Android SDK 包\n\n到目前为止执行的步骤安装了 Android Studio IDE 和当前的默认\
  \ Android SDK 包集。在继续之前，值得花时间验证已安装了哪些包，并安装任何缺失或更新的包。\n\n此任务可以通过点击欢迎对话框中的“更多操作”（More\
  \ Actions）链接并从下拉菜单中选择“SDK 管理”（SDK Manager）选项来完成。一旦调用，将显示设置对话框中的 Android SDK 界面，如图\
  \ 2-5 所示：\n\n![](img/android_studio_sdk_manager.jpg)\n\n图 2-5\n\n首次安装 Android Studio\
  \ 之后，可能只安装了最新发布的 Android SDK 版本。要安装旧版本的 Android SDK，只需选择对应版本的复选框并点击“应用”（Apply）按钮即可。\n\
  \n本书中的大多数示例都将支持低至到 Android 8.0 (Oreo) 的旧版本 Android。这是为了确保应用程序运行在广泛的 Android 设备上。在\
  \ SDK 版本列表中，启用 Android 8.0 (Oreo) 侧的复选框并点击“应用”按钮。在生成的确认对话框中，点击“确定”按钮安装 SDK。随后的对话框将在执行安装前寻求对许可和条款的接受。安装完成后，点击“完成”。\n\
  \n最新 SDK 也可能列出可用更新。要访问有关准备更新的包的详细信息，请启用屏幕右下角的“显示包详情”（Show Package Details）选项。这将显示与图\
  \ 2-6 所示类似的信息：\n\n![](img/Image2471.jpg)\n\n图 2-6\n\n上图强调了可用更新。要安装更新，请启用项目名称左侧的复选框并点击“应用”按钮。\n\
  \n除了 Android SDK 包外，还安装了几个用于构建 Android 应用程序的工具。要查看当前安装的包并检查更新，请留在 SDK 设置界面并如图 2-7\
  \ 所示选择“SDK 工具”（SDK Tools）标签页：\n\n![](img/as_sdk_tools.jpg)\n\n图 2-7\n\n在 Android\
  \ SDK Tools 界面中，确保以下包已列为“已安装”（Installed）：\n\n* Android SDK Build-tools\n* Android\
  \ Emulator\n* Android SDK Platform-tools\n* Google Play Services\n* Intel x86 Emulator\
  \ Accelerator (HAXM)\n* Google USB Driver（仅限 Windows）\n* Layout Inspector image\
  \ for API\n\n注意：Intel x86 Emulator Accelerator (HAXM) 无法安装在 Apple 芯片 Mac 上。\n\n\
  如果上述任何包列为“未安装”或需要更新，只需选择这些包旁的复选框并点击“应用”按钮启动安装过程。如果出现 HAXm 设置对话框，选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n\
  \n图 2-8\n\n安装完成后，检查包列表并确保所选包现在列为“已安装”。如果有未安装的，确保已选择并再次点击“应用”按钮。\n\n## 2.6 使 Android\
  \ SDK 工具命令行可用\n\n大多数情况下，Android SDK 的底层工具是在 Android 环境内部访问的。尽管如此，某些情况下，从命令提示符或终端窗口调用这些工具将很有用。为了让您开发的操作系统能够找到这些工具，有必要将它们添加到系统的\
  \ PATH 环境变量。\n\n无论操作系统如何，PATH 变量都需要配置包含以下路径（其中 `<path_to_android_sdk_installation>`\
  \ 代表安装 Android SDK 的文件系统位置）：\n\n* `<path_to_android_sdk_installation>/sdk/tools`\n\
  * `<path_to_android_sdk_installation>/sdk/tools/bin`\n* `<path_to_android_sdk_installation>/sdk/platform-tools`\n\
  \nSDK 在您系统上的位置可以通过启动 SDK 管理并参考设置面板顶部的“Android SDK 位置”（Android SDK Location）字段来确定，如图\
  \ 2-9 所示：\n\n![](img/as_sdk_location.jpg)\n\n图 2-9\n\n确定 SDK 的位置后，将此添加到 PATH 变量的步骤取决于操作系统：\n\
  \n####2.6.1 Windows 8.1\n\n\n\n\n\n1. 在启动屏幕上，将鼠标移动到屏幕右下角，从弹出的菜单中选择`Search`。在搜索框中输入`Control\
  \ Panel`。当`Control Panel` 图标出现在结果区域时，点击它以在桌面上启动该工具。\n\n2. 在`Control Panel` 中，使用`Category`\
  \ 菜单将显示更改为`Large Icons`。从图标列表中选择标记为`System` 的项。\n\n3. 在`Environment Variables`对话框中，在`System`变量列表中找到`Path`变量，选中它并点击`Edit…`\
  \ 按钮。在编辑对话框中使用`New` 按钮向路径添加三个新项。例如，假设 Android SDK 安装在`C:\\Users\\demo\\AppData\\\
  Local\\Android\\Sdk`，则需要添加以下项目：\n\n```\nC:\\Users\\demo\\AppData\\Local\\Android\\\
  Sdk\\platform-tools\nC:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\tools\nC:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk\\tools\\bin\n```\n\n4. 点击每个对话框中的`OK` 并关闭系统属性控制面板。\n\
  \n通过按下键盘上的`Windows + R`并在`Run`对话框中输入`cmd`来打开命令提示符窗口。在`Command Prompt`窗口中输入：\n\n\
  ```\necho %Path%\n```\n\n返回的路径变量值应包含 Android SDK 平台工具文件夹的路径。通过尝试如下运行`adb`工具来验证`platform-tools`值是否正确：\n\
  \n```\nadb\n```\n\n该工具在执行时应输出命令行选项列表。\n\n同样，通过尝试运行`AVD Manager`命令行工具来检查工具路径设置（如果`avdmanager`工具报告\
  \ Java 问题，请担心——稍后会处理）：\n\n```\navdmanager\n```\n\n如果其中一个或两个命令都出现了类似下面的消息，那么很可能是向`Path`环境变量中添加了错误的路径：\n\
  \n```\n'adb' is not recognized as an internal or external command,\noperable program\
  \ or batch file.\n```\n\n### 2.6.2 Windows 10\n\n右键点击`Start`菜单，从弹出的菜单中选择`Settings`，并在`Find\
  \ a setting`文本框中输入“Edit the system environment variables”。在`System Properties`对话框中，点击`Environment\
  \ Variables...` 按钮。按照 Windows 8.1 列出的步骤操作，从第 3 步开始。\n\n### 2.6.3 Windows 11\n\n\
  右键点击任务栏上的`Start`图标，从弹出的菜单中选择`Settings`。当`Settings`对话框出现时，向下滚动列表并选择“About”选项。在`About`屏幕上，从`Related\
  \ links`部分选择`Advanced system settings`。当`System Properties`窗口出现时，点击`Environment\
  \ Variables...` 按钮。按照 Windows 8.1 列出的步骤操作，从第 3 步开始。\n\n### 2.6.4 Linux\n\n在 Linux\
  \ 上，此配置通常可以通过向家目录下的`.bashrc`文件添加命令来实现（具体细节可能取决于所使用的特定 Linux 发行版）。假设 Android SDK\
  \ 程序包安装在`/home/demo/Android/sdk`，则`.bashrc`文件中的`export`行内容如下：\n\n```\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/tools:/home/demo/Android/sdk/tools/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n注意，上述命令将`android-studio/bin`目录添加到`PATH`变量中。这将允许无论在终端窗口中当前目录是什么，都可以执行`studio.sh`脚本。\n\
  \n### 2.6.5 macOS\n\n在 macOS 上可以使用多种技术来修改`$PATH`环境变量。认为最干净的方法是在`/etc/paths.d`目录下创建一个新文件，其中包含要添加到`$PATH`的路径。假设\
  \ Android SDK 位置为`/Users/demo/Library/Android/sdk`，可以通过在`/etc/paths.d`目录下创建一个名为`android-sdk`的新文件并包含以下行：\n\
  \n```\n/Users/demo/Library/Android/sdk/tools\n/Users/demo/Library/Android/sdk/tools/bin\n\
  /Users/demo/Library/Android/sdk/platform-tools\n```\n\n注意，由于这是一个系统目录，在创建文件时必须使用`sudo`命令。例如：\n\
  \n```\nsudo vi /etc/paths.d/android-sdk\n```\n\n## 2.7 Android Studio 内存管理\n\nAndroid\
  \ Studio 是一个大型复杂的软件应用程序，由许多后台进程组成。尽管 Android Studio 过去因性能不佳而受到批评，但谷歌在最近的发布中显著改进了性能并在并在新版本中继续这样做。这些改进包括允许用户配置\
  \ Android Studio IDE 以及用于构建和运行应用的后台进程所使用的内存量。这允许软件利用具有更大内存的系统。\n\n如果你在运行 Android\
  \ Studio 的系统具有足够的空闲内存来增加这些值（此功能仅适用于具有 5GB 或更多内存的 64 位系统），并且发现 Android Studio 性能似乎有所下降，那么尝试这些内存设置可能是值得的。Android\
  \ Studio 还可能通过类似所示的对话框通知你可以提高性能：\n\n![](img/as_3.5_increase_memory_notification.jpg)\n\
  \n图 2-10\n\n要查看并修改当前配置，选择`File -> Settings...`（macOS 上为`Android Studio -> Preferences...`）菜单，并在生成的对话框中，选择左侧导航面板`System\
  \ Settings`下的`Memory Settings`选项，如图 2-11 所示。\n\n在更改内存分配时，务必不要分配超过需要或系统无法承受的内存。\n\
  \n![](img/as_settings.jpg)\n\n图 2-11\n\n## 2.8 更新 Android Studio 和 SDK\n\nAndroid\
  \ Studio 和 Android SDK 不定期发布新版本。新版本的 SDK 使用 Android SDK Manager 安装。Android Studio\
  \ 通常会在有可用更新时通知你。\n\n要手动检查 Android Studio 更新，在 Android Studio 主窗口中使用`Help -> Check\
  \ for Updates...`菜单选项（macOS 上为`Android Studio -> Check for Updates...`）。\n\n## 2.9\
  \ 总结\n\n在开发 Android 应用程序之前，第一步是设置适用于开发的环境。这包括 Android SDK 和 Android Studio IDE（它包含\
  \ OpenJDK 开发环境）。在本章中，我们涵盖了在 Windows、macOS 和 Linux 上安装这些包的步骤。\n\n# 3. 在 Android Studio\
  \ 中创建示例应用\n\n本书的前几章节涵盖了配置使用 Android Studio IDE 开发 Android 应用程序所需环境的步骤。在进入更高级的主题之前，现在是验证所有所需的开发包都已安装并运行良好的时机。实现这一目标最佳方法是创建一个\
  \ Android 应用程序并编译运行它。本章将介绍如何使用 Android Studio 创建一个应用程序项目。\n\n## 3.1 关于项目\n\n\n\n\
  \n\n在本章中创建的项目是一个初级的货币汇率转换器（事实上，它设计得非常简单，只支持从美元转换为欧元，并使用估算的汇率进行转换）。该项目还将使用 Android\
  \ Studio 最基础的项目模板之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因为尝试一次性引入过多的概念（例如推荐的 App\
  \ 架构和 Android 架构组件）让初学者感到无从从。在遵循本章的教程时，请放心，此示例项目中所使用的所有技术和代码将在后续章节中进行更详细的介绍。\n\n\
  ## 3.2 创建新的 Android 项目\n\n应用开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，请先启动 Android\
  \ Studio，如图 3-1 所示的“欢迎来到 Android Studio”界面：\n\n![](img/as_welcome_screen.jpg)\n\n\
  图 3-1\n\n一旦出现此窗口，Android Studio 就已准备好创建新项目。要创建新项目，只需点击 `New Project`（新项目）选项即可显示新项目向导的第一个界面。\n\
  \n## 3.3 创建 Activity\n\n第一步是为应用定义要创建的初始 Activity 类型。提供的选项可以为手机和平电脑、Wear OS、电视、Android\
  \ 音频或 Android Things 创建项目。在开发 Android 应用时，可以使用不同的 Activity 类型，其中许多将在后面的章节中详细介绍。然而，为了本示例，只需在\
  \ Templates（模板）面板中选择 `Phone and Tablet`（手机和平电脑）选项，然后选择创建 `Empty Activity`（空 Activity）选项。`Empty\
  \ Activity` 选项会创建一个由单个 `TextView` 对象组成的模板用户界面。\n\n![](img/as_select_empty_activity.jpg)\n\
  \n图 3-2\n\n选中 `Empty Activity` 后，点击 `Next`（下一步）继续配置项目。\n\n## 3.4 定义项目和 SDK 设置\n\n\
  在项目配置窗口（[图 3-3）中，将 `Name`（名称）字段设置为 `AndroidSample`。应用名称是在 Android Studio 内部引用和标识应用的名称，也是如果完成的应用要在\
  \ Google Play 商店中销售时将使用的名称。\n\n`Package name`（包名）用于在 Android 应用生态系统中唯一地标识应用。虽然它可以设置为任何唯一标识你应用的字符串，但传统上，它是基于域名的反转\
  \ URL，后面加上应用的名称。例如，如果你的域名是 `www.mycompany.com`，且应用命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n`com.mycompany.androidsample`\n\n如果你没有域名，可以在 `Company Domain`（公司域名）字段中输入任何其他字符串，或者为了测试之目的可以使用\
  \ `example.com`，但在发布应用之前需要更改它：\n\n`com.example.androidsample`\n\n`Save location`（保存位置）设置将默认位于你主目录下名为\
  \ `AndroidStudioProjects` 的文件夹中，可以通过点击包含当前路径设置的字段右侧的文件夹图标进行更改。\n\n将 `minimum SDK`（最低\
  \ SDK）设置设置为 `API 26: Android 8.0 (Oreo)`。除非某个必要功能仅在较新版本中可用，否则此书中创建的大多数项目将使用此最低 SDK。这里的目标是使用最新的\
  \ Android SDK 构建应用，同时保留与运行旧版本 Android 的设备的兼容性（在此情况下，最可追溯到 Android 8.0）。`Minimum\
  \ SDK` 设置下方的文本将概述目前运行该应用的 Android 设备百分比。点击 `Help me choose`（帮助我选择）按钮（在[图 3-3]中突出显示）查看仍在使用的各种\
  \ Android 版本的完整分类：\n\n![](img/as_new_project_settings.jpg)\n\n图 3-3\n\n最后，将 `Language`（语言）菜单更改为\
  \ `Java` 并点击 `Finish`（完成）启动项目创建过程。\n\n## 3.5 修改示例应用\n\n此时，Android Studio 已创建一个最小的示例应用项目并打开了主窗口。\n\
  \n![](img/as_4.1_main_window.jpg)\n\n图 3-4\n\n新创建的项目和关联文件的引用列位于主项目窗口左侧的 `Project`（项目）工具窗口。`Project`\
  \ 工具窗口有多种显示信息的模式。默认情况下，此面板应处于 `Android` 模式。此设置由面板顶部的菜单控制，如[图 3-5]所示。如果面板当前不是 `Android`\
  \ 模式，请使用菜单切换模式：\n\n![](img/as_project_tool_window_menu.jpg)\n\n图 3-5\n\n## 3.6 修改用户界面\n\
  \n我们的 Activity 用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目文件层次结构的 `app -> res ->\
  \ layout` 下。一旦在 `Project` 工具窗口中找到它，双击该文件将其加载到出现在 Android Studio 主窗口中心面板中的用户界面 `Layout\
  \ Editor`（布局编辑器）工具中：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n`Layout Editor`\
  \ 窗口顶部工具栏上有一个菜单（在上方图中设置为 `Pixel`），它反映在 `Layout Editor` 面板中的设备视觉表示上。点击此菜单可以选择广泛的其他设备选项。\n\
  \n要在横屏和竖屏之间切换设备显示，请直接使用设备选择菜单左侧显示 ![](img/as_4.1_orientation.jpg) 图标的下拉菜单。使用夜晚按钮\
  \ ![](img/as_night_mode.jpg)` 开启或关闭夜晚模式。\n\n如屏幕所示，内容布局已经包含了一个显示“Hello World!”消息的标签。面板左侧运行着调色板，包含了用于构建用户界面的不同用户界面组件类别，例如按钮、标签和文本字段。然而需要注意的是，并不是所有用户界面组件对用户可见的。其中一个类别是布局。Android\
  \ 支持多种布局，为视觉用户界面组件在屏幕上的定位和管理提供不同程度的控制。虽然从用户界面的视觉表示很难判断，但当前设计是使用 `ConstraintLayout`\
  \ 创建的。可以通过查看 `Component Tree`（组件树）面板中的信息来确认这一点，该面板默认位于 `Layout Editor` 面板的左下角，如[图\
  \ 3-7]所示：\n\n![](img/as_4.1_component_tree.jpg)\n\n图 3-7\n\n从组件树层次结构中可以看出，用户界面布局由一个\
  \ `ConstraintLayout` 父对象和一个 `TextView` 子对象组成。\n\n\n\n\n\n在继续之前，请检查布局编辑器（Layout Editor）的自动连接（Autoconnect）模式是否已启用。这意味着当组件添加到布局时，布局编辑器将自动添加约束条件，以确保组件在不同的屏幕尺寸和设备方向上正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect`按钮出现在布局编辑器的工具栏中，用一个磁铁图标表示。当被禁用时，磁铁图标上会出现一条斜线（见图\
  \ 3-8）。如有必要，请通过点击此按钮重新启用自动连接模式。\n\n![](img/as_autoconnect_button.jpg)\n\n图 3-8\n\
  \n修改应用的下一步是向布局中添加一些额外的组件，其中第一个是`Button`（按钮），用户点击以启动货币转换。\n\n`Palette`（调色板）面板由两列组成，左列包含视图组件分类列表。右列列出当前所选类别中包含的组件。例如，在图\
  \ 3-9 中，当前在 `Buttons` 类别中选中了 `Button` ：\n\n![](img/as_4.1_palette.jpg)\n\n图 3-9\n\
  \n点击并拖动 `Buttons` 列表中的 `Button` 对象，并将其释放到用户界面设计的水平中心，使其位于现有 `TextView` 小部件下方：\n\n\
  ![](img/as_4.1_androidsample_button_added.jpg)\n\n图 3-10\n\n下一步是更改当前由 `Button` 组件显示的文本。位于设计区域右侧的面板是\
  \ `Attributes`（属性）面板。该面板显示分配给布局中当前选中组件的属性。在此面板中，在 `Common Attributes`（常用属性）部分找到\
  \ `text` 属性，并将当前值从“Button”更改为“Convert”，如图 3-11 所示：\n\n![](img/as_4.1_text_attribute.jpg)\n\
  \n图 3-11\n\n第二个文本属性旁边有一个扳手，允许设置文本属性，该属性仅在布局编辑器工具中显示，而在运行时不会显示。这对于测试视觉组件和布局在不同设置下的行为非常有用，而无需反复运行应用。\n\
  \n万一自动连接系统未能设置所有布局连接，点击 `Infer constraints`（推断约束）按钮（图 3-12）为布局添加任何缺失的约束：\n\n![](img/as_4.1_infer_button.jpg)\n\
  \n图 3-12\n\n此时，重要的是说明位于布局编辑器工具右上角的警告按钮，如图 3-13 所示。显然，这表示布局存在潜在问题。要查看任何问题的详情，请点击该按钮：\n\
  \n![](img/as_3.6_layout_warnings.jpg)\n\n图 3-13\n\n点击后将出现一个面板（图 3-14），描述问题的性质并提供一些可能的纠正措施：\n\
  \n![](img/as_hardcoded_text.jpg)\n\n图 3-14\n\n目前列出的唯一警告如下：\n\n硬编码字符串 \"Convert\"\
  ，应使用 @string 资源\n\n这条 I18N（国际化）消息告诉我们，项目未来的国际化存在一个潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告提醒我们，在开发 Android 应用程序时，应尽可能将文本字符串等属性和值以资源的形式存储。这样做允许通过修改资源文件来更改应用程序的外观，而无需更改应用程序源代码。这在将用户界面翻译成不同的口语时特别有价值。如果用户界面中的所有文本都包含在单个资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件以包含在应用程序中。这使得可以在不修改任何源代码的情况下针对多种语言。在本例中，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击 Issue Explanation（问题说明）面板中的 `Fix`（修复）按钮以显示\
  \ Extract Resource（提取资源）面板（图 3-15）。在此面板中，将资源名称字段更改为 `convert_string`，并在点击 `OK` 按钮之前将资源值保留为\
  \ Convert。\n\n![](img/as_4.1_extract_resource.jpg)\n\n图 3-15\n\n下一个要添加的小部件是 `EditText`\
  \ 小部件，用户将其中输入要转换的美元金额。从 `Palette` 面板中，选择 `Text` 类别，点击并拖动 `Number (Decimal)` 组件到布局中，使其水平居中并位于现有\
  \ `TextView` 小部件上方。选中该小部件后，使用 `Attributes` 工具窗口将 `hint` 属性设置为“dollars”。点击警告图标并将字符串提取到名为\
  \ `dollars_hint` 的资源。\n\n本章稍后编写的代码将需要访问用户输入 `EditText` 字段的美元值。它将通过引用分配给布局中小部件的 `id`\
  \ 来实现。Android Studio 分配给小部件的默认 `id` 可以在布局中选中时进行查看和更改，如图 3-16 所示：\n\n![](img/as_4.0_textview.jpg)\n\
  \n将 `id` 更改为 `dollar_text`，并在命名对话框中点击 `Refactor`（重构）按钮。这将确保项目中的任何引用都自动更新为新 id：\n\
  \n![](img/as_4.1_rename_dialog.jpg)\n\n图 3-17\n\n点击 `Infer constraints` 按钮添加任何缺失的布局约束。此时，布局应类似于图\
  \ 3-18 所示：\n\n![](img/as_4.1_androidsample_ui.jpg)\n\n图 3-18\n\n### 审查布局和资源文件\n\n\
  在继续下一步之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过布局编辑器工具修改 `activity_main.xml` 文件对用户界面进行了一些更改。事实上，布局编辑器所做的只是提供了一种编辑文件\
  \ XML 内容的方式。在实践中，没有理由不直接修改 XML 来更改用户界面，在某些情况下，这实际上比使用布局编辑器工具更快。在布局编辑器面板的右上角有三个按钮，如下方图\
  \ 3-19 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\n图 3-19\n\n默认情况下，编辑器处于\
  \ Design 模式，仅显示布局的视觉表示。最左侧的按钮将切换到 Code 模式显示布局的 XML，而中间按钮将进入 Split 模式，同时显示布局和 XML，如图\
  \ 3-0 所示：\n\n![](img/as_4.1_split_mode.jpg)\n\n图 3-20\n\n从 XML 文件的结构可以看出，用户界面由 `ConstraintLayout`\
  \ 组件组成，该组件又是 `TextView`、`Button` 和 `EditText` 对象的父级。我们还可以看到，例如 `Button` 的 `text`\
  \ 属性被设置为我们的 `convert_string` 资源。\n\n\n\n\n当 XML 布局发生更改时，这些更改将反映在布局画布上。也可以在布局画布面板内对布局进行视觉化修改，更改将显示在\
  \ XML 列表中。要查看此效果，请切换到分屏（Split）模式，并修改 XML 布局以将 `ConstraintLayout` 的背景颜色更改为如下红色调：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\"\n    android:background=\"#ff2438\" >\n\n\
  </androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n注意，布局颜色会实时更改以匹配 XML\
  \ 文件中的新设置。同时请注意，XML 编辑器中包含颜色设置行的左侧边距（也称为槽位 gutter）处会出现一个红色红色方块。这是一个视觉提示，表示已在该属性上设置了红色。点击红色方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_color_chooser.jpg)\n\n图 3-21\n\n在继续之前，请从布局文件中删除背景属性，以便背景恢复到默认设置。\n\
  \n最后，使用项目（Project）面板找到 `app` -> `res` -> `values` -> `strings.xml` 文件，并双击它将其加载到编辑器中。目前\
  \ XML 的内容如下：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n作为资源实际应用的演示，将当前分配给 `convert_string` 资源的字符串值更改为“Convert\
  \ to Euros”，然后通过选择编辑器面板中布局文件的选项页返回布局编辑器（Layout Editor）工具。注意布局已获取了该字符串的新资源值。\n\n\
  访问 XML 文件中引用的资源值还有一种快速方法。在分屏（Split）或代码（Code）模式下的布局编辑器工具中，点击 `@string/convert_string`\
  \ 属性设置使其高亮，然后在键盘上按 `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后将打开 `strings.xml`\
  \ 文件并带您进入文件中声明该资源的行。利用此机会将字符串资源还原为原始的“Convert”文本，并添加以下附加字符串资源项，该项稍将在应用代码中引用：\n\n\
  ```xml\n<resources>\n    <string name=\"convert_string\">Convert</string>\n    <string\
  \ name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\">No\
  \ Value</string>\n</resources>\n```\n\n资源字符串也可以 Android Studio 的翻译编辑器（Translations\
  \ Editor）进行编辑。要打开此编辑器，右键点击 `app` -> `res` -> `values` -> `strings.xml` 文件并选择 `Open\
  \ editor`（打开编辑器）菜单选项。将在 Android Studio 窗口的主面板中显示翻译编辑器：\n\n![](img/as_3.6_translations_editor.jpg)\n\
  \n图 3-22\n\n此编辑器允许编辑分配给资源键的字符串，并管理多种语言的翻译。\n\n## 3.8 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，这样当用户在\
  \ `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在 `TextView` 上。这涉及在 `Button` 部件上实现一些事件处理。具体来说，需要对\
  \ `Button` 进行配置，以便在触发 `onClick` 事件时调用应用代码中的某个方法。事件处理可以通过多种不同的方式实现，并将在后续标题为 Android\
  \ 事件处理概述与示例 的章节中进行详细介绍。将布局编辑器返回设计（Design）模式，在布局编辑器中选择 `Button` 部件，引用属性（Attributes）工具窗口，并如下所示指定名为\
  \ `convertCurrency` 的方法：\n\n![](img/as_3.6_set_onclick.jpg)\n\n图 3-23\n\n注意，`onClick`\
  \ 属性的文本字段现在用红色边框高亮，警告我们按钮已配置为调用一个尚不存在的方法。要解决这个问题，双击项目工具窗口（`app` -> `java` -> `<package\
  \ name>` -> `MainActivity`）中的 `MainActivity.java` 文件将其加载到代码编辑器，并在类文件中添加 `convertCurrency`\
  \ 方法的代码，使其内容如下，请注意还需要导入一些额外的 Android 包：\n\n```java\npackage com.ebookfrenzy.androidsample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.view.View;\nimport android.widget.EditText;\nimport android.widget.TextView;\n\
  import java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n## 3.9 总结\n\n设置 Android 开发环境并不复杂，但涉及许多步骤。在完成这些步骤后，值得运行一个示例以确保环境正确安装和配置。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探索了尽可能使用资源的重要性，特别是在字符串值的情况下，并简要接触了布局的主题。最后，我们在\
  \ `Button` 上添加了 `onClick` 事件，并连接到一个实现的方法，该方法用于从 `EditText` 组件中提取用户输入，将美元转换为欧元，然后将结果显示在\
  \ `TextView` 上。\n\n由于应用程序已准备好测试，下一章将详细介绍设置用于测试的模拟器的必要步骤。\n\n\n\n\n\n虽然 Android Studio\
  \ 预览面板（Preview panel）允许我们查看正在设计的布局并使用交互模式测试基本功能，但为了完全测试其是否正常工作，仍然需要编译并运行整个应用程序。可以通过在物理设备上安装并运行，或者在\
  \ Android 虚拟设备（`AVD`）模拟器环境中运行来对 Android 应用程序进行测试。在使用 `AVD` 之前，必须先创建并配置它以匹配特定设备型号的规格。在本章中，我们将以\
  \ `Pixel 4` 手机作为示例，演示如何创建这样一个虚拟设备。\n\n# 4.1 关于 Android 虚拟设备\n\n`AVDs` 本质上是模拟器，允许在无需将应用程序安装到物理\
  \ Android 设备上的情况下对 Android 应用程序进行测试。`AVD` 可以配置为模拟各种硬件特性，包括屏幕大小、内存容量，以及是否存在如摄像头、`GPS`\
  \ 导航支持或加速度计等功能。作为 Android Studio 标准安装的一部分，系统安装了多个模拟器模板，允许为一系列不同的设备配置 `AVDs`。通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，可以创建自定义的配置，以匹配任何物理\
  \ Android 设备。\n\n`AVD` 会话可以作为独立窗口出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 `AVDs` 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）进行创建和管理，它可以使用命令行模式，也可以使用更易用户的图形用户界面。创建新\
  \ `AVD` 的第一步是启动 `AVD Manager`。这可以通过在 Android Studio 环境的主窗口中选择 `Tools` -> `Device\
  \ Manager` 菜单选项来实现。\n\n启动后，管理器将以工具窗口的形式显示，如图图 4-1 所示：\n\n![](img/as_avd_manager.jpg)\n\
  \n图 4-1\n\n要添加新的 `AVD`，首先确保在点击 `Create device` 按钮之前选中了 `Virtual` 标签页，以打开虚拟设备配置对话框：\n\
  \n![](img/as_avd_manager_select_hardware.jpg)\n\n图 4-2\n\n在对话框中，执行以下步骤创建一个兼容 `Pixel\
  \ 4` 的模拟器：\n\n1. 从 `Category` 面板中选择 `Phone` 选项，显示可用的 Android 手机 `AVD` 模板列表。\n2.\
  \ 选择 `Pixel 4` 设备选项并点击 `Next`。\n3. 在 `System Image` 界面，选择最新版本的 Android。注意，如果尚未安装系统镜像，`Release\
  \ Name` 旁边将提供 `Download` 链接。点击此链接在选择它之前下载并安装系统镜像。如果所需的镜像未在列表中，点击 `x86 Images`（如果你运行的是带有\
  \ Apple 芯片的 Mac，则点击 `ARM` images）或 `Other images` 标签页以查看备选列表。\n4. 点击 `Next` 继续，并在\
  \ `name` 字段中输入描述性名称（例如 `Pixel 4 API 32`），或直接接受默认名称。\n5. 点击 `Finish` 创建 `AVD`。\n\
  6. `AVD` 创建完成后，现在可以关闭 `Device Manager` 了。如果以后需要对 `AVD` 进行修改，只需重新打开 `Device Manager`，从列表中选择该\
  \ `AVD`，并点击 `Actions` 列中的铅笔图标来编辑设置。\n\n## 4.2 启动模拟器\n\n要对新创建的 `AVD` 模拟器进行测试运行，只需从\
  \ `Device Manager` 中选择模拟器并点击启动按钮（`Actions` 列中的三角形）。模拟器将嵌入到 Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于\
  \ `AVD` 及其运行所在系统的配置：\n\n![](img/as_emulator_tool_window.jpg)\n\n图 4-3\n\n要隐藏和显示模拟器工具窗口，请点击\
  \ `Emulator` 工具窗口按钮（如上方标记的 A 所示）。点击标签旁边的“`x`”关闭按钮 (B)退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签页表示。例如，图\
  \ 4-4 显示了一个具有两个模拟器会话的工具窗口：\n\n![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n\
  \n图 4-4\n\n要在会话之间切换，只需点击相应的标签页。\n\n虽然模拟器可能默认以竖屏方向显示，但此或其他默认选项可以更改。在 `Device Manager`\
  \ 中，选择新的 `Pixel 4` 项目，并点击设备行 `Actions` 列中的铅笔图标。在配置界面中，找到 `Startup orientation` 部分并更改设置。退出并重启模拟器会话使更改生效。关于模拟器的更多细节请参阅下一章\
  \ 使用和配置 Android Studio AVD 模拟器”。\n\n为了在本章的下一节节省时间，请在继续之前保持模拟器运行。\n\n## 4.3 在 AVD\
  \ 中运行应用程序\n\n配置好 `AVD` 模拟器后，之前章节中创建的示例 `AndroidSample` 现在可以编译并运行了。将 `AndroidSample`\
  \ 项目加载到 Android Studio 后，确保新创建的 `Pixel 4` `AVD` 显示在设备菜单中（如图 4-5 标记 A 所示），然后点击由三角形表示的运行按钮，或选择\
  \ `Run` -> `Run ‘app’` 菜单选项：\n\n![](img/as_avd_run_target.jpg)\n\n图 4-5\n\n设备菜单\
  \ (A) 可选择不同的 `AVD` 实例或物理设备作为运行目标，并在多个设备上运行。该菜单还提供了访问 `Device Manager` 以及设备配置和排排除选项：\n\
  \n![](img/as_run_target_menu.jpg)\n\n图 4-6\n\n一旦应用程序安装并运行，第一个 fragment 的界面将出现在模拟器中（fragment\
  \ 是 Android 项目的可重用部分，由界面布局和部分代码组成，该主题将在 Android 简介 中介绍）：\n\n![](img/as_sample_running.jpg)\n\
  \n图 4-7\n\n如果活动没有自动启动，请检查模拟器应用上是否出现了启动图标。如果是，只需点击启动应用程序。一旦运行过程开始，`Run` 工具窗口将变为可用。`Run`\
  \ 工具窗口会在应用程序安装和启动期间显示诊断信息。图 4-8 显示了典型应用程序启动时的 `Run` 工具窗口输出：\n\n![](img/as_4.1_run_tool_window.jpg)\n\
  \n图 4-8\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供信息，这些信息将有助于隔离问题原因。\n\n假设应用程序加载到模拟器并按预期运行，我们已经安全地验证了\
  \ Android 开发环境已正确安装和配置。现在应用程序运行时，尝试进行温度转换以验证应用程序是否按预期工作。\n\n## 4.4 在多个设备上运行\n\n\
  上方图 4-6 所示的运行菜单包含一个在多个模拟器和设备上并行运行应用程序的选项。选中后，该选项将显示如图 4-9 所示的对话框，提供系统上配置的所有 `AVDs`\
  \ 以及任何连接的物理设备的列表。在点击 `Run` 按钮之前，勾选要目标模拟器或设备旁复选框：\n\n![](img/as_4.1_multiple_devices.jpg)\n\
  \n\n\n\n\n图 4-9\n\n点击 Run（运行）按钮后，Android Studio 将在选定的模拟器和设备上启动应用。\n\n## 4.5 停止正在运行的应用\n\
  \n要停止正在运行的应用，只需点击位于主工具栏上的停止按钮，如图 4-10 所示所示：\n\n![](img/as_4.1_stop_button.jpg)\n\
  \n图 4-10\n\n您也可以使用 Run（运行）工具窗口终止应用。首先，通过在应用运行时变为窗口工具栏按钮来显示 Run 工具窗口。一旦 Run 工具窗口出现，点击下方图\
  \ 4-11 所示中高亮显示的停止按钮：\n\n![](img/as_4.1_stop_button_run_window.jpg)\n\n图 4-11\n\n\
  ## 4.6 支持深色主题\n\nAndroid 10 引入了备受期待的深色主题，Android Studio 项目默认启用了该功能支持。若要在 AVD 模拟器中测试深色主题，请在模拟器运行的\
  \ Android 实例中打开 Settings（设置）应用。在 Settings 应用中，选择 Display（显示）类别并如图 4-12 所示启用 Dark（深色）主题选项，以便使屏幕背景变为黑色：\n\
  \n![](img/as_avd_dark_theme_setting.jpg)\n\n图 4-12\n\n启用深色主题后，运行 AndroidSample 应用，并注意它以深色主题显示，包括黑色背景和按钮上的紫色背景，如图\
  \ 4-13 所示：\n\n![](img/as_eandroid_sample_running_dark.jpg)\n\n图 4-13\n\n在继续操作之前，返回\
  \ Settings 应用并关闭深色主题模式。\n\n## 4.7 在独立窗口中运行模拟器\n\n到本章为止，我们仅将模拟器作为嵌入在 Android Studio\
  \ 主窗口内的工具窗口使用。若要在独立窗口中运行模拟器，请选择 `File -> Settings...` 菜单选项（macOS 上为 `Android Studio\
  \ -> Preferences...`），在偏好设置对话框的左侧导航面板导航到 `Tools -> Emulator`，并禁用 `Launch in a tool\
  \ window` 选项：\n\n![](img/as_avd_separate_window_setting.jpg)\n\n图 4-14\n\n禁用该选项后，点击\
  \ `Apply` 按钮然后点击 `OK` 提交更改，通过点击上方标记为 B 的图 4-3 标签上的关闭按钮退出当前模拟器会话。\n\n再次运行示例应用，此时模拟器将作为一个独立窗口出现，如下所示：\n\
  \n![](img/as_android_emulator_standalone.jpg)\n\n图 4-15\n\n选择独立模式还是工具窗口模式取决于个人喜好。如果您喜欢模拟器运行在工具窗口中，请返回设置屏幕并重新启用\
  \ `Launch in a tool window` 选项。然而，在确定独立模式之前，请记住可以通过点击模拟器工具栏中的设置按钮（由齿轮图标表示）并选择 `View\
  \ Mode -> Float` 菜单选项，将模拟器工具窗口从 Android Studio 主窗口分离：\n\n![](img/as_avd_float_mode.jpg)\n\
  \n图 4-16\n\n## 4.8 启用设备框架\n\n模拟器可以配置为带有（图 4-17）或不带设备框架（图 4-15）的外观。\n\n![](img/as_eandroid_sample_running_device_frame.jpg)\n\
  \n图 4-17\n\n要更改设置，请打开 Device Manager（设备管理器），从列表中选择 AVD，并点击 Actions 列中的铅笔图标编辑设置。在设置屏幕上，找到并更改\
  \ `Enable Device Frame` 选项：\n\n![](img/as_avd_device_frame_setting.jpg)\n\n图 4-18\n\
  \n## 4.9 AVD 命令行创建\n\n如所述，除了图形用户界面外，还可以直接从命令行创建新的 AVD。这是通过使用 `avdmanager` 工具结合某些命令行选项实现的。一旦启动，该工具将在创建新\
  \ AVD 之前提示额外信息。\n\n`avdmanager` 工具需要访问 Java 运行时环境 (JRE) 才能运行。如果在尝试运行 `avdmanager`\
  \ 时出现错误消息指示找不到 `java` 命令，则可以配置运行命令的命令提示符或终端窗口以使用与 Android Studio 捆的 OpenJDK 环境。首先按照以下方式识别\
  \ OpenJDK JRE 的位置：\n\n1. 启动 Android Studio 并打开书中之前创建的 `ComposeDemo` 项目。\n2. 选择 `File\
  \ -> Settings...` 菜单选项（macOS 上为 `Android Studio -> Preferences...`）。\n3. 导航到 `Build,\
  \ Execution, Deployment` 部分，并选择 `Build Tools` 类别下的 `Gradle` 选项。\n4. 点击 `Gradle JDK`\
  \ 设置并记录 Android Studio 默认 JDK 的路径：\n\n![](img/as_gradle_jdk_setting.jpg)\n\n图 4-19\n\
  \n在 Windows 上，在运行 `avdmanager` 的命令提示符窗口中执行以下命令（其中 `<path to jre>` 为 JRE 路径）：\n\n\
  ```bash\nset JAVA_HOME=<path to jre>\n```\n\n在 macOS 或 Linux 上，执行以下命令：\n\n```bash\n\
  export JAVA_HOME=\"<path to jre>\"\n```\n\n假设已配置了 Android SDK 环境变量，通过在终端运行以下命令可以获取可用的\
  \ AVD 列表：\n\n```bash\navdmanager list\n```\n\n上述命令输出将包含系统中可用的 Android SDK 版本。例如：\n\
  \nAvailable targets:\n----------\nid: 1 or \"android-29\"\n     Name: Android API\
  \ 29\n     Type: Platform\n     API level: 29\n     Revision: 1\n----------\nid:\
  \ 2 or \"android-26\"\n     Name: Android API 26\n     Type: Platform\n     API\
  \ level: 26\n     Revision: 1\n\n`avdmanager` 工具还允许从命令行创建新的 AVD。例如，要使用 API 29 设备的\
  \ x86 ABI 创建名为 `myAVD` 的新 AVD，可以使用命令：\n\n```bash\navdmanager create avd -n myAVD\
  \ -k \"system-images;android-29;google_apis;x86\"\n```\n\n该工具将根据创建设备配置所需的规格创建新 AVD。一旦从命令行创建了新的\
  \ AVD，在点击刷新按钮之前，它不会显示在 Android 设备管理器中。\n\n除了创建新的 AVD 之外，还可以从命令行执行其他任务。例如，可以使用 `list\
  \ avd` 命令行参数获取当前可用的 AVD：\n\n```bash\navdmanager list avd\n```\n\nAvailable Android\
  \ Virtual Devices:\n   Name: Pixel_XL_API_28_No_Play\n  Device: pixel_xl (Google)\n\
  \      Path: /Users/neilsmyth/.android/avd/Pixel_XL_API_28_No_Play.avd\n   Target:\
  \ Google APIs (Google Inc.)\n      Based on: Android API 28 Tag/ABI: google_apis/x86\n\
  \  Skin: pixel_xl_silver\n  Sdcard: 512M\n\n同样，要删除现有的 AVD，只需使用删除选项：\n\n```bash\n\
  avdmanager delete avd -n <avd name>\n```\n\n\n\n\n\n`config.ini` 文件包含了设备配置设置，例如在\
  \ AVD 创建过程中指定的显示尺寸和内存。这些设置可以直接在配置文件中进行更改，并在 AVD 下次被调用时将采用这些更改。\n\n`<avd name>.ini`\
  \ 文件包含了对目标 Android SDK 的引用以及 AVD 文件的路径。请注意，`config.ini` 文件中 `image.sysdir` 更改也需要反映在该文件的目标值中。\n\
  \n### 4.11 移动和重命名 Android 虚拟设备\n\n可以使用 `avdmanager` 工具的 `move avd` 参数从命令行更改 AVD\
  \ 的当前名称或文件位置。例如，若要将名为 `Pixel4` 的 AVD 重命名为 `Pixel4a`，可以执行以下命令：\n\n```\navdmanager\
  \ move avd -n Pixel4 -r Pixel4a\n```\n\n要物理移动与 AVD 关联的文件，应使用以下命令语法：\n\n```\navdmanager\
  \ move avd -n <avd name> -p <path to new location>\n```\n\n例如，将 AVD 从当前的文件系统位置移动到\
  \ `/tmp/Pixel4Test`：\n\n```\navdmanager move avd -n Pixel4 -p /tmp/Pixel4Test\n\
  ```\n\n注意，在执行移动 AVD 的命令之前，目标目录不能已经存在。\n\n### 4.12 总结\n\n典型的应用开发过程遵循编码、编译和在测试环境中运行循环。Android\
  \ 应用可以在物理 Android 设备上测试，也可以使用 Android 虚拟设备 (AVD) 模拟器进行测试。AVD 使用 Android Studio Device\
  \ Manager 工具创建和管理，该工具可以作为命令行工具使用，也可以通过图形界面使用。在创建 AVD 以模拟特定的 Android 设备模型时，虚拟设备的硬件规格应配置为与物理设备匹配。\n\
  \nAVD 模拟器可以以独立窗口的形式显示，也可以嵌入到 Android Studio 主用户界面中。\n\n# 5. 使用和配置 Android Studio\
  \ AVD 模拟器\n\n在下一章探索在物理 Android 设备上测试之前，本章将花一些时间提供 Android Studio AVD 模拟器的概述，并突出许多可以在独立模式和工具窗口模式下用于自定义环境的配置功能。\n\
  \n## 5.1 模拟器环境\n\n当在独立模式下启动时，模拟器会在加载过程中显示初始启动屏幕。加载完成后，将出现模拟器主窗口，其中包含选择设备类型的表示（对于图\
  \ 5-1，这是一个 Pixel 4 设备）：\n\n![](img/android_12_avd_running_standalone.jpg)\n\n图 5-1\n\
  \n窗口右侧边缘是工具栏，提供了快速访问模拟器控制和配置选项的功能。\n\n## 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的系列选项访问。\n\
  \n![](img/as_3.5_avd_toolbar.jpg)\n\n图 5-2\n\n工具栏中的每个按钮都有关联的键盘快捷键，可以通过鼠标指针悬停在按钮上并等待工具提示出现，或者通过扩展控制面板的帮助选项来识别。\n\
  \n虽然工具栏中的许多选项都是自言易懂，但为了完整起见，将对每个选项进行介绍：\n\n-   **退出 / 最小化** – 工具栏最顶部的“x”按钮在选中时会退出模拟器会话，而“-”选项会最小化整个窗口。\n\
  -   **电源** – 电源按钮模拟物理 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。点击并按此按钮将启动设备的“关机”请求序列。\n\
  -   **音量增大 / 减小** – 两个控制模拟器环境中播放音频音量的按钮。\n-   **向左/向右旋转** – 模拟设备在竖屏和横屏方向之间旋转。\n\
  -   **截图** – 截取设备屏幕当前显示内容的屏幕。截取的图像存储在在本章稍后概述的扩展控制面板设置屏幕中指定的位置。\n-   **缩放模式** – 此按钮切换进入和退出缩放模式，其细节将在本章稍后介绍。\n\
  -   **返回** – 执行标准的 Android“返回”导航以返回上一个屏幕。\n-   **主页** – 显示设备主屏幕。\n-   **概览** – 模拟选择标准的\
  \ Android“概览”导航，该界面显示设备上当前运行的应用。\n-   **折叠设备** – 模拟折叠设备的折叠和展开。此选项仅在模拟器正在运行折叠设备系统镜像时可用。\n\
  -   **扩展控制** – 显示扩展控制面板，允许配置如模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别等选项。\n\n## 5.3 在缩放模式下工作\n\
  \n位于模拟器工具栏中的缩放按钮用于切换进入和退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，且鼠标指针悬停在设备屏幕上将显示为放大镜。点击左键将导致显示相对于屏幕上的选定点进行放大，重复点击将增加缩放级别。相反，点击右键将减小缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮时，视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条移动屏幕可视区域。\n\
  \n## 5.4 调整模拟器窗口大小\n\n模拟器窗口（以及相应的设备表示）的大小可以通过点击并拖动任何角或侧边随时更改。\n\n## 5.5 扩展控制选项\n\
  \n扩展控制工具按钮将显示如图 5-3 所示的面板。默认将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n![](img/as_avd_location.jpg)\n\
  \n图 5-3\n\n### 5.5.1 位置\n\n位置控制允许以十进制或度分坐标将模拟位置信息发送到模拟器。位置信息可以是单个位置，也可以代表设备移动的点序列，后者通过\
  \ GPS 交换（GPX）或 Keyhole 标记语言（KML）格式的文件提供。或者，可以使用集成 Google Maps 面板视觉上选择单点或旅行路线。\n\n\
  ### 5.5.2 显示\n\n除了模拟器屏幕显示的主显示器外，显示选项允许在同一个 Android 实例运行额外的显示器。这对于测试如 Microsoft Surface\
  \ Duo 等双屏应用非常有用。这些额外的屏幕可以配置为所需的尺寸，并出现在与主屏幕相同的模拟器窗口中。\n\n### 5.5.3 蜂窝\n\n可以在蜂窝设置屏幕内更改模拟的蜂窝连接类型。提供了用于模拟不同网络类型（GSM、EDGE、HSDPA\
  \ 等）的选项，以及一系列语音和数据场景，如漫游和拒绝访问。\n\n### 5.5.4 电池\n\n可以在扩展控制屏幕的此面板上模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及当前连接了\
  \ AC 充电器。\n\n### 5.5.5 摄像头\n\n\n\n\n\n当处于激活状态时，模拟器会模拟一个 3D 场景。这表现为一个虚拟建筑的内部，通过按住\
  \ `Option` 键（Windows 上为 `Alt`）并使用鼠标指针和键盘键，你可以在模拟器内录制视频或在拍摄照片之前对其中进行导航。此扩展配置选项允许上传不同的图像以显示在虚拟环境中。\n\
  \n### 5.5.6 电话\n手机扩展控制功能在模拟器中提供了两个非常简单但实用的模拟功能。第一个选项允许模拟来自指定电话号码的入电电话。这在测试应用如何处理此类高层中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与在现实世界中一样，这些消息会出现在 `Message` 应用中，并触发模拟器内的标准通知。\n\n### 5.5.7\
  \ 方向键\n方向键（`D-Pad`）是一组内置在 Android 设备中或通过外部连接（如游戏控制器）的额外控件，用于提供方向控制（左、右、上、下）。方向键设置允许在模拟器中模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供了一个按钮用于启动模拟器上的 `Voice\
  \ Assistant`（语音助手）。\n\n### 5.5.9 指纹\n许多 Android 设备现在配备了内置指纹检测硬件。AVD 模拟器使得测试指纹认证成为可能，无需在带有指纹传感器的物理设备上测试应用。如何在模拟器中配置指纹测试的细节将在本章详细介绍。\n\
  \n### 5.5.10 虚拟传感器\n虚拟传感器选项允许模拟加速度计和磁力计，通过 `yaw`、`pitch` 和 `roll` 设置来模拟设备的物理运动效果，如旋转、移动和倾斜。\n\
  \n### 5.5.11 快照\n快照包含当前运行的 AVD 会话状态，可以被保存并快速恢复，从而轻松将模拟器恢复到精确状态。快照将在本章后后部分介绍。\n\n\
  ### 5.5.12 录制与播放\n允许将模拟器屏幕和音频录制并保存为 `WebM` 或 `animated GIF` 格式。\n\n### 5.5.13 Google\
  \ Play\n如果模拟器运行安装了 Google Play 服务的 Android 版本，此选项将显示当前的 Google Play 版本，并提供将模拟器更新到最新版本的选项。\n\
  \n### 5.5.14 设置\n设置面板提供了一小组配置选项。使用此面板为工具栏和扩展控制面板选择更深的主题，指定保存屏幕截图的文件系统位置，配置 `OpenGL`\
  \ 支持级别，并配置模拟器窗口显示在桌面其他窗口之上。\n\n### 5.5.15 帮助\n`Help` 屏幕包含三个子面板，列出了键盘快捷键列表、访问模拟器在线文档的链接、报告文件\
  \ Bug 和发送反馈的链接，以及模拟器版本信息。\n\n## 5.6 使用快照\n当模拟器首次启动时，它会执行冷启动，就像通电的物理 Android 设备一样。由于操作系统需要加载并启动所有后台进程，此冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器都经历这个过程，系统被配置为每次退出时都自动保存模拟器当前状态的快照（称为\
  \ `quick-boot snapshot`，快速启动快照）。下次启动模拟器时，`quick-boot snapshot` 将加载到内存中并从上次停止的地方继续执行，允许模拟器在冷启动完成所需的一部分时间内重启。\n\
  \n扩展控制面板的 `Snapshots` 屏幕可用于在模拟器执行期间任何一点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。从屏幕内部，可以使用\
  \ `Take Snapshot` 按钮（在 图 5-4 中标记为 A）拍摄快照。要恢复现有的快照，从列表 (B) 中选择它并点击屏幕底部的 `run` 按钮\
  \ (C)。还提供了选项来编辑 (D) 快照名称和描述，并删除 (E) 当前选中的快照：\n\n![](img/as_emulator_snapshot.jpg)\n\
  \n图 5-4\n\n`Settings` 选项 (F) 提供了自动保存 `quick-boot snapshots` 的选项（默认情况下，模拟器会在每次退出时询问是否保存\
  \ `quick boot snapshot`）以及重新加载最近的快照。若要强制模拟器会话执行冷启动而不是使用之前的 `quick-boot snapshot`，打开\
  \ `AVD Manager`（`Tools -> AVD Manager`），点击模拟器 `Actions` 列中的向下箭头并选择 `Cold Boot Now`\
  \ 菜单选项。\n\n![](img/as_avd_cold_boot.jpg)\n\n图 5-5\n\n## 5.7 配置指纹模拟\n模拟器允许配置多达 10\
  \ 个模拟指纹，用于测试 Android 应用中的指纹认证。要配置模拟指纹，首先要启动模拟器，打开 `Settings` 应用，并选择 `Security &\
  \ Location`（安全与位置）选项。\n\n在 `Security` 设置屏幕中，选择 `Use fingerprint` 选项。在生成的信息屏幕上点击\
  \ `Next` 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置一种备份解锁方法（例如 `PIN`）。点击 `Fingerprint\
  \ + PIN` 按钮，并在提示时选择设备启动时不需要 `PIN`。输入并确认合适的 `PIN`，通过接受默认选项完成 PIN 输入过程。\n\n继续后续屏幕，直到\
  \ `Settings` 应用请求指纹。此时显示扩展控制对话框，在左侧面板中选择 `Fingerprint` 类别，并确保主设置面板选取了 `Finger 1`：\n\
  \n![](img/Image2468.jpg)\n\n图 5-6\n\n点击 `Touch the Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加：\n\
  \n![](img/Image2478.jpg)\n\n图 5-7\n\n要添加更多指纹，点击 `Add Another` 按钮并在扩展面板中选择另一个手指，然后再次点击\
  \ `Touch the Sensor` 按钮。\n\n## 5.8 工具窗口模式下的模拟器\n正如在前章（在 Android Studio 中创建 Android\
  \ Virtual Device）中概述，Android Studio 可以配置为以嵌入工具窗口启动模拟器，使其不会在独立窗口中出现。在此模式下运行时，独立模式下提供的相同控件将在工具栏中提供，如图\
  \ 5-8 所示：\n\n![](img/as_avd_internal_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详情与独立模式一致）：\n\
  \n• `Power`\n\n• `Volume Up`\n\n• `Volume Down`\n\n• `Rotate Left`\n\n• `Rotate\
  \ Right`\n\n• `Back`\n\n• `Home`\n\n• `Overview`\n\n• `Screenshot`\n\n• `Snapshots`\n\
  \n• `Extended Controls`\n\n## 5.9 总结\nAndroid Studio 包含一个 Android 虚拟机模拟器环境，旨在使无需在物理\
  \ Android 设备上运行即可更容易地测试应用程序。本章对模拟器进行了简要介绍，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\n\n\n\n\
  \n# 6. Android Studio 用户界面概览\n\n虽然急于运行上一章中创建的示例应用程序非常诱人，但这样做涉及到使用 Android Studio\
  \ 用户界面的某些方面，这些内容最好在之前对其进行描述。\n\nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上其用法是直观的。尽管如此，现在花时间熟悉\
  \ Android Studio 用户界面的布局和组织结构，将大大缩短本书后续章节的学习曲线。基于此，本章将提供构成 Android Studio 环境的各个区域和组件的初步概述。\n\
  \n## 6.1 欢迎界面\n\n欢迎界面（图 6-1）在 Android Studio 运行且当前没有打开任何项目时显示（可以通过选择 `File -> Close\
  \ Project` 菜单选项随时关闭打开的项目）。如果在项目仍打开时退出了 Android Studio，该工具在下次启动时将跳过欢迎界面，自动打开之前活动的项目。\n\
  \n![](img/as_bumble_bee_welcome_with_recent.jpg)\n\n图 6-1\n\n除了最近项目列表外，欢迎界面还提供了执行各种任务的选项，如打开和创建项目，以及访问当前受版本控制的项目。此外，`Customize`\
  \ 屏幕提供了更改 IDE 和编辑器共同使用的主题和字体设置的选项。可以通过 `Plugins` 选项查看、安装和管理 Android Studio 插件。点击如图\
  \ 6-2 所示所示的菜单按钮，可以使用更多选项：\n\n![](img/as_bumble_bee_welcome_menu.jpg)\n\n图 6-2\n\n\
  ## 6.2 主窗口\n\n当创建新项目或打开现有项目时，将出现 Android Studio 主窗口。当同时打开多个项目时，每个项目将分配其自己的主窗口。窗口的精确配置将取决于上次打开项目时显示了哪些工具和面板，但通常类似于图\
  \ 6-3。\n\n![](img/as_4.2_main_window_labelled.jpg)\n\n图 6-3\n\n主窗口的各种元素可以总结如下：\n\
  \n*   **A – 菜单栏** – 包含用于在 Android Studio 环境中执行任务的系列菜单。\n*   **B – 工具栏** – 一系列用于频繁操作的快捷键。工具栏按钮提供了快速访问一组菜单栏操作的方法。可以通过右键点击工具栏并选择\
  \ `Customize Menus and Toolbars…` 菜单选项对工具栏进行自定义。如果工具栏可见，可以使用 `View -> Appearance\
  \ -> Toolbar` 菜单选项显示。\n*   **C – 导航栏** – 导航栏提供了一种在组成项目的文件和文件夹之间移动的方便方法。点击导航栏中的元素将下拉菜单，列出该位置的子文件夹和文件供选择。同样，点击类名将显示列出该类中方法的菜单。从列表中选择一个方法将跳转到代码编辑器中的相应位置。使用\
  \ `View -> Appearance -> Navigation Bar` 菜单选项隐藏或显示此栏。\n*   **D – 编辑器窗口** – 编辑器窗口显示开发者正在工作的文件内容。然而，在此处显示的内容取决于上下文。例如，编辑代码时，将显示代码编辑器。另一方面，处理用户界面布局文件时，将显示用户界面\
  \ Layout Editor 工具。当打开多个文件时，每个文件都由位于编辑器顶部的标签页表示，如图 6-4 所示。\n\n![](img/as_4.1_editor_File_tabs.jpg)\n\
  \n图 6-4\n*   **E – 状态栏** – 状态栏显示关于项目和 Android Studio 活动的信息消息，以及位于最左角的工具菜单按钮。鼠标悬停在状态栏条目上将提供该字段的描述。许多字段是可交互的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  *   **F – 项目工具窗口 (Project Tool Window)** – 项目工具窗口提供了项目文件结构的层次概述，允许对特定文件和文件夹进行导航。可以使用工具栏以不同的方式显示项目。默认设置是\
  \ `Android view`，这是本书其余部分主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中提供的许多工具窗口之一。\n\n\
  ## 6.3 工具窗口\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，启用后它们会显示在主窗口的底部和侧边。将鼠标指针悬停在状态栏最左角的按钮上（图\
  \ 6-5）而无需点击鼠标按钮，即可访问工具窗口快速访问菜单。\n\n![](img/android_studio_tool_window_menu.jpg)\n\
  \n图 6-5\n\n从快速访问菜单中选择项目将导致相应的工具窗口在主窗口内出现。\n\n或者，可以通过点击状态栏中的快速访问菜单图标显示一组工具窗口栏。这些栏显示在主窗口的左侧、右侧和底部（如图\
  \ 6-6）中的箭头所示），并包含显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏上的按钮将隐藏它们。\n\n![](img/as_4.1_tool_window_bars.jpg)\n\
  \n图 6-6\n\n点击按钮将显示工具窗口，再次点击将隐藏窗口。带有数字前缀的按钮（例如 `1: Project`）表示按下键盘上的 `Alt` 键（macOS\
  \ 为 `Command` 键）配合相应的数字也可以显示工具窗口。\n\n按钮在工具窗口栏中的位置指示了窗口将出现在窗口的一侧。可以通过点击并拖动按钮到其他窗口栏的位置来更改这些位置。\n\
  \n每个工具窗口在顶部都有自己的工具栏。这些工具栏内的按钮随工具而异，但所有工具窗口都包含一个由齿轮图标表示的设置选项，允许更改窗口的各个方面图 6-7 显示了项目视图工具窗口的设置菜单。\n\
  \n![](img/as_project_tool_menu.jpg)\n\n图 6-7\n\n所有窗口在工具栏的最右侧还有一个按钮，提供了另一种隐藏工具窗口视图的额外方法。对工具窗口内的项目进行搜索可以简单完成，只需通过点击该窗口使其获取焦点，然后输入搜索词（例如项目工具窗口中的文件名）。搜索框将出现在窗口的工具栏中，并高亮显示匹配结果的项。\n\
  \nAndroid Studio 提供了广泛的工具窗口，其中最常用的如下：\n\n\n\n\n\n- **应用检查器 (App Inspector)** - 提供对\
  \ `Database`（数据库）和 `Background Task`（后台任务）检查器的访问。`Database Inspector` 允许你在应用运行时检查、查询和修改数据库。`Background\
  \ Task Inspector` 允许对使用 `WorkManager` 创建的后台工作任务进行监控和管理。\n- **构建 (Build)** - 构建工具窗口在项目进行编译和打包时显示构建过程的信息，并显示遇到的任何错误详细信息。\n\
  - **构建变体 (Build Variants)** – 构建变体工具窗口提供了一种为当前应用程序项目配置不同构建目标的快速方法（例如，为应用程序的调试和发布版本配置不同的构建，或针对不同设备类别配置多个构建）。\n\
  - **设备文件浏览器 (Device File Explorer)** - 通过 `View -> Tool Windows -> Device File Explorer`\
  \ 菜单访问，该工具窗口提供了直接访问当前连接的 Android 设备或模拟器文件系统的权限，允许浏览文件系统并将文件复制到本地文件系统。\n- **设备管理器\
  \ (Device Manager)** - 提供对 `Device Manager` 工具窗口的访问，可以在其中添加、删除和管理物理 Android 设备连接和模拟器。\n\
  - **模拟器 (Emulator)** - 如果启用了在工具窗口中运行模拟器的选项（如标题为 “在 Android Studio 中创建 Android 虚拟设备\
  \ (AVD)” 的章节所示），则此处包含 `AVD` 模拟器。\n- **事件日志 (Event Log)** - 事件日志窗口显示与在 Android Studio\
  \ 内执行的事件和活动相关的消息。例如，项目的成功构建或应用程序正在运行等信息将在此工具窗口中报告。\n- **收藏 (Favorites)** - 可以将各种项目项添加到收藏列表中。例如，在项目视图中右键点击文件，可以访问\
  \ `Add to Favorites`（添加到收藏）菜单选项。同样，通过在 `Structure`（结构）工具窗口中右键点击源文件中的方法，可以将其添加收藏。添加到收藏列表的任何内容都可以通过此\
  \ `Favorites` 工具窗口访问。\n- **Gradle** - `Gradle` 工具窗口提供了构成项目构建配置的 `Gradle` 任务视图。该窗口列出了参与将项目各种元素编译为可执行应用程序的任务。右键点击顶层\
  \ `Gradle` 任务并选择 `Open Gradle Config`（打开 Gradle 配置）菜单选项，可以将当前项目的 `Gradle` 构建文件加载到编辑器中。本书稍后将详细介绍\
  \ `Gradle`。\n- **布局检查器 (Layout Inspector)** - 提供构成用户界面布局的组件层级的可视 3D 渲染。\n- **Logcat**\
  \ - `Logcat` 工具窗口提供了对运行应用程序监控日志输出的访问，此外提供了拍摄应用程序截图、视频以及停止和重启进程的选项。\n- **问题 (Problems)**\
  \ - 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带您进入问题文件所在的位置。\n- **分析器 (Profiler)** - `Android\
  \ Profiler` 工具窗口提供了识别运行应用中性能问题的实时监控和分析工具，包括 CPU、内存和网络使用。此选项在应用程序当前运行时变为可用。\n- **项目\
  \ (Project)** - 项目视图提供了构成项目的文件结构概述，允许在文件之间快速导航。通常，在项目视图中双击文件将导致该文件加载到相应的编辑工具中。\n\
  - **资源管理器 (Resource Manager)** - 用于添加和管理项目包含的资源和资产（如图像、颜色和布局文件）。\n- **运行 (Run)**\
  \ - 当应用程序当前运行时，运行工具窗口变为可用，并提供运行结果视图以及停止或重启运行进程的选项。如果应用程序在设备或模拟器上无法安装和运行，此窗口通常会提供与问题相关的诊断信息。\n\
  - **结构 (Structure)** - 结构工具提供了编辑器中当前显示的源文件结构的高级视图。这些信息包括文件中的 `classes`（类）、`methods`（方法）和\
  \ `variables`（变量）等项。从结构列表中选择一个项将带您进入编辑器窗口中源文件的对应位置。\n- **终端 (Terminal)** - 提供对运行\
  \ Android Studio 的系统的终端窗口访问。在 Windows 系统上，这是 `Command Prompt`（命令提示符）界面，而在 Linux\
  \ 和 macOS 系统上，它呈现为 `Terminal` 提示符。\n- **TODO** - 如如所示，该工具提供了一个查看项目中尚未完成项的地方。Android\
  \ Studio 通过扫描构成项目的源文件并查找匹配指定 `TODO` 模式的注释来编译此列表。可以通过选择 `File -> Settings…` 菜单选项（macOS\
  \ 为 `Android Studio -> Preferences...`）并导航到 `Editor`（编辑器）下的 `TODO` 页面来查看和更改这些模式。\n\
  \n### 6.4 Android Studio 快捷键\n\nAndroid Studio 包含了大量的键盘快捷键，旨在执行常用任务时节省时间。可以在 Android\
  \ Studio 项目窗口中通过选择 `Help -> Keymap Reference`（帮助 映射参考）菜单选项查看并打印完整的键盘快捷键映射列表。您还可以通过选择\
  \ `File -> Settings...` 菜单选项（macOS 为 `Android Studio -> Preferences...`）并点击 `Keymap`（映射）项来列出和修改键盘快捷键，如下方的图\
  \ 6-8 所示：\n\n![](img/as_keymap_settings.jpg)\n\n图 6-8\n\n### 6.5 切换器和最近文件导航\n\n\
  在 Android Studio 主窗口导航的另一种实用机制是使用 `Switcher`（切换器）。通过 `Ctrl-Tab` 键盘快捷键访问，切换器会作为一个列出工具窗口和当前打开文件的面板出现（见图\
  \ 6-9）。\n\n![](img/as_4.2_switcher.jpg)\n\n图 6-9\n\n显示后，只要按住 `Ctrl` 键，切换器将可见。在按住\
  \ `Ctrl` 键的同时反复按下 `Tab` 键会在选项之间循环，而释放 `Ctrl` 键会将当前选中的项显示在主窗口中。\n\n除了切换器，`Recent\
  \ Files` 面还提供了最近打开文件的导航（见图 6-10）。可以使用 `Ctrl-E` 键盘快捷键（macOS 为 `Cmd-E`）访问。显示后，可以使用鼠标指针选择选项，或者使用键盘方向键滚动文件名和工具窗口选项。按下\
  \ `Enter` 将将当前选中的项。\n\n![](img/as_4.0_recent_files.jpg)\n\n图 6-10\n\n### 6.6 更改\
  \ Android Studio 主题\n\nAndroid Studio 环境的整体主题可以通过欢迎界面的 `Configure -> Settings` 选项，也可以通过主窗口的\
  \ `File -> Settings…` 菜单选项（macOS 为 `Android Studio -> Preferences...`）更改。\n\n一旦显示设置对话框，在左侧面板中选择\
  \ `Appearance & Behavior`（外观与行为）选项，随后选择 `Appearance`（外观），然后在更改 `Theme` 设置之前点击 `Apply`（应用）按钮。可用的主题取决于平台，但通常包括\
  \ `Light`、`IntelliJ`、`Windows`、`High Contrast` 和 `Darcula` 等选项。图 6-11 显示了选定 `Darcula`\
  \ 主题的主窗口示例：\n\n![](img/as_3.6_darcula.jpg)\n\n图 6-11\n\n\n\n\n若要使 Android Studio\
  \ 主题与操作系统的亮/深色模式设置同步，请启用“与操作系统同步”（Sync with OS）选项，并使用下拉菜单控制每个模式下使用的主题：\n\n![](img/as_theme_configuration.jpg)\n\
  图 6-12\n\n## 6.7 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配有自己的主窗口，该窗口反过来由菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口组成。工具窗口出现在主窗口的侧边和底部，可以通过状态栏中的快速访问菜单或通过可选的工具窗口栏进行访问。\n\
  \n在 Android Studio 中，有极少数的操作是可以通过键盘快捷键触发的。可以随时从 Android Studio 主窗口访问默认键盘快捷键的键位映射（keymap）。\n\
  \n# 7. 在物理 Android 设备上测试 Android Studio 应用程序\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现很多工作，但在物理\
  \ Android 设备上进行真实的应用测试是不可替代的，而且某些某些 Android 功能仅在物理设备上可用。\n\n与 AVD 实例和连接的 Android\
  \ 设备之间的通信均由 Android 调试桥 (ADB) 处理。在本章中，我们将解释如何配置 `adb` 环境，以便在基于 macOS、Windows 和 Linux\
  \ 的系统上对 Android 设备启用应用程序测试。\n\n## 7.1 Android 调试桥 (ADB) 概述\n\nADB 的主要目的是促进开发系统（在此例中为\
  \ Android Studio）与 AVD 模拟器以及 Android 设备之间的交互，以便运行和调试应用程序。ADB 允许你通过 WiFi 网络或直接使用\
  \ USB 线缆连接到设备。\n\nADB 由一个客户端、一个运行在开发系统后台的服务器进程，以及一个运行在 AVD 或真实 Android 设备（如手机和平板）上的守护进程后台进程组成。\n\
  \nADB 客户端可以有多种形式。例如，客户端以名为 `adb` 的命令行工具形式提供，位于 Android SDK 的 `platform-tools` 子目录中。同样，Android\
  \ Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数获取当前活跃的虚拟或物理设备列表。以下命令输出表示系统上存在一个\
  \ AVD，但没有物理设备：\n\n```bash\n$ ad devices\nList of devices attached\nemulator-5554\
  \ device\n```\n\n## 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 ADB 连接到 Android 设备之前，必须先配置设备以允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板设备上，实现此目的步骤如下：\n\n1. 打开设备上的 `Settings`设置应用，并选择 `About tablet`关于平板电脑（或\
  \ `About phone`关于手机）选项（在某些 Android 版本中，可以在 `Settings` 的 `System`系统）页面找到）。\n2. 在\
  \ `About`关于）屏幕上，滚动到 `Build number`版本号）字段并点击七次，直到出现指示开发者模式已启的消息。如果 `About` 屏幕上没有列出\
  \ `Build number`，则可以通过 `Software information`软件信息）选项可用。或者，如果可用，展开列表中的 `Advanced`高级）部分。\n\
  \n![](img/as_3.2_build_number.jpg)\n图 7-1\n\n3. 返回主 `Settings` 屏幕，注意标题为 `Developer\
  \ options`开发者选项）的新选项的出现（在较新的 Android 版本中，此选项列在 `System` 设置屏幕上）。选择此选项，并在生成的屏幕上找到如图\
  \ 7-2 所示的 `USB debugging`USB 调试选项：\n\n![](img/android_12_enable_debugging.jpg)\n\
  图 7-2\n\n4. 启用 `USB debugging`USB 调试选项，并在并在请求确认时点击 `Allow`允许按钮。\n\n此时，设备已配置为接受来自通过\
  \ USB 连接的开发系统上的 `adb` 的调试连接。剩下的工作是配置开发系统以便在连接时检测到设备。虽然这是一个相对简单的过程，但涉及的步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。请注意，以下步骤假设 Android SDK 的 `platform-tools` 目录已包含在操作系统的 `PATH`\
  \ 环境变量。\n\n### 7.2.1 macOS ADB 配置\n\n要在 macOS 系统上配置 `ADB` 环境，请使用 USB 线将设备连接到计算机系统，打开终端窗口并执行以下命令重启\
  \ `adb` 服务：\n\n```bash\n$ adb kill-server\n$ adb start-server\ndaemon not running.\
  \ starting it now on port 5037 *\ndaemon started successfully *\n```\n\n一旦服务器成功运行，执行以下命令以验证设备已检测到：\n\
  \n```bash\n$ adb devices\nList of devices attached\n74CE000600000001 offline\n```\n\
  \n如果设备被列为 `offline`离线，请前往 Android 设备并检查是否存在图 7-3 所示的请求`Allow USB debugging`允许 USB\
  \ 调试的对话框。在点击`OK`确定之前，勾选`Always allow from this computer`始终允许来自此计算机旁的复选框。\n\n![](img/Image2856.jpg)\n\
  图 7-3\n\n重复执行 `adb devices` 命令现在会将设备列为可用：\n\n```bash\n$ adb devices\nList of devices\
  \ attached\n015d41d4454bf80c device\n```\n\n如果设备未被列出，尝试注销并重新登录 macOS 桌面，如果问题仍然存在，请重启系统。\n\
  \n### 7.2.2 Windows ADB 配置\n\n配置 Windows 系统连接 Android 设备的第一步是在系统上安装相应的 USB 驱动程序。安装的\
  \ USB 驱动取决于 Android 型。如果您拥有 Google 设备（如 Pixel 手机），则需要安装并配置 Google USB 驱动程序。实现此操作的详细步骤列在以下网页：[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于 Google USB 驱动程序不支持的 Android 设备，需要下载制造商提供的驱动程序。可以在线获取驱动程序列表以及安装信息：[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n驱动程序安装且设备现在被识别为正确的类型后，打开命令提示符窗口并执行以下命令：\n\n```bash\nadb devices\n```\n\n此命令应输出连接设备的信息，如下所示：\n\
  \n```\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备列为 `offline`或`unauthorized`未授权，请查看设备屏幕并检查是否存在图\
  \ 7-3 所示的请求`Allow USB debugging`允许 USB 调试的对话框。在点击`OK`确定之前，勾选`Always allow from this\
  \ computer`始终允许来自此计算机旁的复选框。重复执行 `adb devices` 命令现在会将设备列为就绪：\n\n```bash\nList of\
  \ devices attached\nHT4CTJT01906 device\n```\n\n如果设备未被列出，执行以下命令重启 `ADB` 服务：\n\n\
  ```bash\nadb kill-server\nadb start-server\n```\n\n如果设备仍然未被列出，尝试执行以下命令：\n\n```bash\n\
  android update adb\n```\n\n### 7.2.3 Linux adb 配置\n\n\n\n\n在本章中，我们将再次使用 Ubuntu Linux\
  \ 作为参考示例，介绍在 Linux 上配置 `adb` 以连接到物理 Android 设备进行应用测试。\n\n在 Ubuntu Linux 上进行物理设备测试需要安装一个名为\
  \ `android-tools-adb` 的包，这反过来要求 Android Studio 用户必须是 `plugdev` 组的成员。这是大多数 Ubuntu\
  \ 版本用户账户的默认设置，可以通过运行 `id` 命令进行验证。如果列表中没有显示 `plugdev` 组，请运行以下命令将您的账户添加到组组：\n\n```bash\n\
  sudo usermod -aG plugdev $LOGNAME\n```\n\n在满足组成员要求后，可以通过执行以下命令安装 `android-tools-adb`\
  \ 包：\n\n```bash\nsudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu\
  \ 系统。系统重启后，打开终端窗口，启动 `adb` 服务并检查连接的设备列表：\n\n```\n$ adb start-server\n* daemon not\
  \ running. starting it now on port 5037 *\n* daemon started successfully *\n$ adb\
  \ devices\nList of devices attached\n015d41d4454bf80c offline\n```\n\n如果设备显示为 offline（离线）或\
  \ unauthorized（未授权），请检查 Android 设备并检查图 7-3 所示的请求允许 USB 调试权限的对话框。\n\n## 7.3 解决 USB\
  \ 连接问题\n\n如果您无法通过上述步骤成功连接到设备，请显示运行目标菜单（图 7-4）并选择“排除设备连接”（Troubleshoot Device Connections）选项：\n\
  \n![](img/as_pair_devices_troubleshooting.jpg)\n\n图 7-4\n\n连接助手将扫描设备并报告问题及解决方案。\n\
  \n## 7.4 在 Android 设备上启用无线调试\n\n按照上述 7.2 节的第 1 至 3 步操作，这次启用图 7-5 所示的“无线调试”选项：\n\n\
  ![](img/android_12_enable_wifi_debugging.jpg)\n\n图 7-5\n\n接下来，点击上面的“无线调试”项以显示图 7-6\
  \ 所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\n图 7-6\n\n\
  如果您使用的设备带有摄像头，请选择“通过二维码配对设备”（Pair device with QR code），否则选择“通过配对码配对设备”（Pair device\
  \ with pairing code）。根据您的选择，设置应用将启动摄像头会话，或显示如图 7-7 所示的配对码：\n\n![](img/as_pair_devices_code.jpg)\n\
  \n图 7-7\n\n选择好选项后，返回 Android Studio，从运行目标菜单中选择如图 7-8 所示的“使用 WiFi 配对设备”（Pair Devices\
  \ Using WiFi）选项：\n\n![](img/as_pair_devices_wifi_menu.jpg)\n\n图 7-8\n\n在配对对话框中，根据您之前在设备设置应用中的选择，选择“使用二维码配对”或“使用配对码配对”：\n\
  \n![](img/as_pair_devices_qr_code.jpg)\n\n图 7-9\n\n使用 Android 设备扫描二维码，或将设备屏幕上显示的配对码输入\
  \ Android Studio 对话框（图 7-10）中以完成配对过程：\n\n![](img/as_pair_devices_wifi_enter_code.jpg)\n\
  \n图 7-10\n\n如果配对过程失败，请尝试重启开发系统和 Android 设备并重试。\n\n## 7.5 测试 adb 连接\n\n假设在所选开发平台上已成功配置\
  \ `adb`，下一步是尝试在设备上运行“在 Android Studio 中创建示例 Android 应用”章节中创建的测试应用。启动 Android Studio，打开\
  \ `AndroidSample` 项目，并验证设备是否如图 7-11 所示高亮显示在设备选择列表中：\n\n![](img/android_12_device_in_menu_scaled.jpg)\n\
  \n图 7-11\n\n从列表中选择设备并点击运行按钮（位于设备菜单右侧的绿色箭头按钮）以安装并运行应用。\n\n## 7.6 总结\n\n虽然 Android\
  \ 虚拟设备（AVD）模拟器提供了一个很好的测试环境，但请记住，没有什么可以替代确保应用在物理 Android 设备上正确运行。毕竟，这才是应用在现实世界中使用的地方。\n\
  \n默认情况下，Android Studio 环境未配置为将 Android 设备作为目标测试设备。因此，必须执行一些步骤，以便通过 USB 线缆或 WiFi\
  \ 网络从 Android Studio 开发环境直接将应用加载到 Android 设备上。实现此目标的具体步骤取决于所使用的开发平台。在本章中，我们涵盖了适用于\
  \ Linux、macOS 和基于 Windows 平台的步骤。\n\n# 8. Android Studio 代码编辑器的基础\n\n为 Android 开发应用涉及大量的编程工作，这在定义上涉及在编辑器窗口内编写代码。不意外的是，使用\
  \ Android Studio 的大部分时间都在编辑器窗口内编辑代码。\n\n现代代码编辑器需要的远超基础的输入和删除。今天代码编辑器的实用性通常取决于减少输入所需的量、大文件的导航易用性以及编辑器检测并突出显示编程错误的能力。正如本章将所示，这些只是编辑器卓越表现的少数领域之一。\n\
  \n虽然本章并非编辑器功能的详尽概述，但旨在提供该工具关键功能的指南。经验程序员会发现，某些功能在今天大多数编辑器中都是通用的，而许多是此环境特有的。\n\n\
  ## 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio 编辑器出现在主窗口中心。例如图\
  \ 8-1 显示典型的编辑器会话：\n\n![](img/as_code_editor_labelled.jpg)\n\n图 8-1\n\n组成编辑器窗口的元素总结如下：\n\
  \nA – 文档标签 – Android Studio 能够同时打开多个文件进行编辑。每打开一个文件，它都会被分配一个位于编辑器窗口顶部标签栏的显示文件名的文档标签。当空间不足以显示所有标签时，标签栏的最右角会出现一个小小的下拉菜单。点击此菜单将列出其他文件列表。标签中文件名下方的波浪线表示文件中的代码包含需要解决的一个或多个错误，解决这些问题后才能编译和运行项目。\n\
  \n切换文件只需点击相应的标签，或使用 `Alt-Left` 和 `Alt-Right` 快捷键。也可以通过切换器机制（通过 `Ctrl-Tab` 快捷键访问）进行文件间的导航。\n\
  \n要将编辑器面板从 Android Studio 主窗口分离并使其在单独窗口中显示，请点击标签将其拖动到主窗口之外的桌面区域。要将编辑器返回主窗口，点击分离编辑器窗口中的文件标签，并将其拖放到主窗口中原始的编辑器标签栏上。\n\
  \n\n\n\n### B – 编辑器行槽区域\n行槽区域被编辑器用于显示信息图标和控件。在此行槽区域显示的某些典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认是开启的，但可以通过在行槽上点击鼠标右键并选择\
  \ `Show Line Numbers`（显示行号）菜单选项来将其禁用。\n\n### C – 代码结构位置\n编辑器底部的此栏显示了光标当前相对于代码整体结构的位置。例如，在图所示，该栏表示当前正在编辑\
  \ `convertCurrency` 方法，且该方法包含在 `MainActivity` 类中。\n\n![](img/as_4.2_code_location.jpg)\n\
  \n图 8-2\n\n双击栏中的任意元素将把光标移动到代码文件中相应的位置。例如，双击 `convertCurrency` 条目将把光标移动到源代码中 `convertCurrency`\
  \ 方法的顶部。同样，点击 `MainActivity` 条目将弹出一个可供选择的可用代码导航点列表：\n\n![](img/as_4.2_code_location_menu.jpg)\n\
  \n图 8-3\n\n### D – 编辑器区域\n这是用户显示、输入和编辑代码的主要区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\n### E –\
  \ 验证与标记侧边栏\nAndroid Studio 整合了一项称为“代码即时代码分析”的功能。这本质上意味着当您输入代码时，编辑器会分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会实时更新，显示随着代码添加而发现的错误和警告数量。点击此指示器将显示一个弹出窗口，其中包含编辑器中代码所发现的问题摘要，如图图\
  \ 8-4 所示：\n\n![](img/as_4.2_code_editor_warning_errors.jpg)\n\n图 8-4\n\n可以使用上下箭头在代码中的错误位置之间移动。绿色勾号表示未检测到任何警告或错误。\n\
  \n侧边栏还会在使用相同颜色编码的检测到问题的位置显示标记。当代码行在编辑器区域中可见时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_warning_box.jpg)\n\
  \n图 8-5\n\n当代码行已滚动出编辑器视图区域时，将鼠标指针悬停在该代码行的标记上，将显示一个“透镜”覆盖层，其中包含问题所在的代码块（图 8-6），允许无需滚动到编辑器中的该位置即可查看：\n\
  \n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分上都会出现一个透镜，其中包含源文件中该位置的代码。\n\
  \n### F – 状态栏\n虽然状态栏实际上是主窗口的一部分而非编辑器，但它包含了一些关于当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号将显示 `Go to Line`（转到行）对话框。\n\n在提供了组成 Android Studio\
  \ 编辑器的元素概述后，本章的其余部分将更详细地探讨编辑环境的关键功能。\n\n## 8.2 分割编辑器窗口\n默认情况下，编辑器将显示一个显示当前所选文件内容的面板。在同时处理多个源文件时，一个特别实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，可以在编辑器窗口内的文件标签上点击右键，选择\
  \ `Split Vertically`（垂直拆分）或 `Split Horizontally`（水平拆分）菜单选项。例如，图 8-7 显示了拆分器的操作，编辑器被拆分为三个面板：\n\
  \n![](img/Image2467.jpg)\n\n图 8-7\n\n可以通过在相应的标签上点击右键并选择 `Change Splitter Orientation`（更改拆分器方向）菜单选项随时更改拆分面板的方向。重复这些步骤可以取消单个面板的分拆，此时从菜单选择\
  \ `Unsplit`（取消拆分）选项。可以通过右键点击任何标签并选择 `Unsplit All`（取消所有拆分）选项来移除所有拆分面板。\n\n窗口分割可用于不同的文件，或为同一个文件提供多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n## 8.3 代码补全\nAndroid Studio 编辑器对 Java 编程语法以及构成 Android SDK 的类和方法拥有大量的内置知识，还拥有您自己的代码库的知识。随着代码的输入，编辑器会扫描正在输入的内容，并在适当的情况下就完成语句或引用可能需要的内容提供建议。当编辑器检测到代码补全建议时，将出现一个包含建议列表的面板。例如，在图\
  \ 8-8 中，编辑器正为一个 `String` 声明的开头提供可能的结果：\n\n![](img/Image2477.jpg)\n\n图 8-8\n\n如果没有没有一个自动补全建议是正确的，只需继续输入，编辑器将在适当的情况下继续精炼建议。要接受最顶部的建议，只需按下键盘上的\
  \ `Enter` 或 `Tab` 键。要选择不同的建议，使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键。\n\n可以使用 `Ctrl-Space`\
  \ 快捷序列手动调用补全建议。这在更改编辑器中的单词或声明时非常有用。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供了一种名为“智能补全”的系统。智能补全通过\
  \ `Shift-Ctrl-Space` 快捷序列调用，选中后将根据代码的当前上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space` 快捷序列将从更广泛的范围内提供更多建议。\n\
  \n代码补全对许多程序员来说可能是个人喜好问题。考虑到这一事实，Android Studio 对自动补全设置提供了高水平的控制。可以通过选择 `File ->\
  \ Settings…`菜单选项（macOS 为 `Android Studio -> Preferences…`）并在设置面板中选择 `Editor -> General\
  \ -> Code Completion` 来查看和修改这些设置，如图图 8-9 所示：\n\n![](img/as_3.6_code_completion_preferences.jpg)\n\
  \n图 8-9\n\n## 8.4 语句补全\nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以自动填充方法和循环语句等项的括号和大括号。语句补全通过\
  \ `Shift-Ctrl-Enter`（macOS 为 `Shift-Cmd-Enter`）快捷序列调用。考虑以下代码：\n\n```\nmyMethod()\n\
  ```\n\n\n\n\n\n将此代码输入到编辑器后，触发语句补全将导致编辑器自动为方法添加大括号：\n\n```\nmyMethod() {\n\n}\n```\n\
  \n### 8.5 参数信息\n\n你也可以要求编辑器提供关于方法接收的参数参数的信息。当光标置于方法调用调用的括号之间时，按下 `Ctrl-P`（macOS\
  \ 上为 `Cmd-P`）组合快捷键将显示该方法已知接受的参数，并对最可能的建议进行**加粗**显示：\n\n![](img/Image2491.jpg)\n\n\
  图 8-10\n\n### 8.6 参数名提示\n\n代码编辑器可以配置为在方法调用中显示参数名提示。例如图 8-11 显示了调用 `Snackbar` 类的\
  \ `make()` 和 `setAction()` 方法时的参数名提示：\n\n![](img/Image2499.jpg)\n\n图 8-11\n\n此模式的设置可以通过选择\
  \ `File -> Settings` 菜单（macOS 上为 `Android Studio -> Preferences`）选项，然后在左侧面板中选择 `Editor\
  \ -> Inlay Hints -> Java` 来配置。在生成的屏幕上，从列表中选择 `Parameter Hints` ，并启用或禁用 `Show parameter\
  \ hints` 选项。要调整提示设置，点击 `Exclude list...` 链接并进行任何调整。\n\n### 8.7 代码生成\n\n除了输入代码时进行补全外，编辑器在某些条件下还可以为你生成代码。如图\
  \ 8-12 所示的可用代码生成选项列表，可以在当光标位于文件中需要生成代码的位置时，使用 `Alt-Insert`（macOS 上为 `Cmd-N`）键盘快捷键来访问。\n\
  \n![](img/as_3.4_code_editor_generate.jpg)\n\n图 8-12\n\n为了示例，请考虑一种情况：我们希望在项目中的 `Activity`\
  \ 准备被操作系统销毁时收到通知。正如本书随后的章节将概述的那样，这可以通过重写 `Activity` 超类的生命周期方法 `onStop()` 来。要让 Android\
  \ Studio 为此生成一个存根方法（stub method），只需从代码生成列表中选择 `Override Methods…` 选项，并从可用方法的列表中选择\
  \ `onStop()` 方法：\n\n![](img/as_3.6_override_methods.jpg)\n\n图 8-13\n\n选中要重写的方法后，点击\
  \ `OK` 将在 Java 源文件的当前光标位置生成该存根方法，如下：\n\n```java\n@Override\nprotected void onStop()\
  \ {\n    super.onStop();\n}\n```\n\n### 8.8 代码折叠\n\n一旦源文件达到一定大小，即使是格式化最整齐、组织最良好的代码也可能变得难以处理和难以导航。Android\
  \ Studio 认为，并不总是需要让每个代码块的内容始终可见。通过使用 Android Studio 编辑器的代码折叠功能，可以使代码导航变得更容易。代码折叠通过出现在源文件编辑器行槽中每个代码块开头和结尾的标记来控制。例如图\
  \ 8-14 显示了当前未折叠的方法声明的开始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n\n图 8-14\n\
  \n点击这些标记中的任意一个都会折叠语句，只显示签名行，如图 8-15 所示：\n\n![](img/Image2533.jpg)\n\n图 8-15\n\n\
  要展开已折叠的代码段，只需点击编辑器行槽中的 `+` 标记。要在不展开的情况下查看隐藏代码，请将鼠标指针悬停在“{…}”指示器上，如图 8-16 所示。编辑器随后将显示包含折叠代码块的透镜覆盖层（lens\
  \ overlay）：\n\n![](img/Image2540.jpg)\n\n图 8-16\n\n文件中的所有代码块都可以使用 `Ctrl-Shift-Plus`\
  \ 和 `Ctrl-Shift-Minus` 键盘组合键进行折叠或展开。\n\n默认情况下，Android Studio 编辑器会在打开源文件时自动折叠某些代码。要配置这种情况的条件，选择\
  \ `File -> Settings…`（macOS 上为 `Android Studio -> Preferences…`）并在生成的设置面板中选择 `Editor\
  \ -> General -> Code Folding` 条目（图 8-17）：\n\n![](img/as_3.6_code_folding_preferences.jpg)\n\
  \n图 8-17\n\n### 8.9 快速文档查询\n\n通过将光标置于所需文档的声明上并按下 `Ctrl-Q` 键盘快捷键（macOS 上为 `Ctrl-J`），可以访问上下文相关的\
  \ Java 和 Android 文档。这将显示一个包含该项目相关参考文档的弹出窗口。例如图 8-18 显示了 `FloatingActionButton` 类的文档。\n\
  \n![](img/Image2557.jpg)\n\n图 8-18\n\n显示后，可以根据需要移动屏幕上的文档弹出窗口。\n\n### 8.10 代码重格式化\n\
  \n通常，Android Studio 编辑器会根据缩进、间距和语句的嵌套自动格式化代码。在需要格式化代码行的情况下（例如，从网站粘贴代码时），编辑器提供了格式化代码的功能，选择后以匹配主流样式。\n\
  \n要格式化代码，按下 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）组合键显示 `Reformat Code` 对话框（图 8-19）。这提供了格式化所选代码、整个源文件或仅更改代码的选择。\n\
  \n![](img/reformat_dialog.jpg)\n\n图 8-19\n\n完整的代码样式偏好可以在项目设置内更改。选择 `File -> Settings`\
  \ 菜单（macOS 上为 `Android Studio -> Preferences`）并在左侧面板中选择 `Code Style` 以访问支持的编程和标记语言列表。选择一种语言将提供大量的格式样式选项，所有选项都可以根据代码样式进行修改。例如，要调整上述对话框中\
  \ `Rearrange code` 选项的设置，展开 `Code Style` 部分，选择 `Java`，然后在 Java 设置中选择 `Arrangement`\
  \ 标签页。\n\n### 8.11 查找示例代码\n\nAndroid Studio 编辑器提供了访问与当前列表相关的示例代码的方法。这对于学习如何使用特定的\
  \ Android 类或方法非常有用。要查找示例代码，高亮编辑器中的方法或类名，右键点击它并选择 `Find Sample Code` 菜单选项。`Find Sample\
  \ Code` 面板（图 8-20）出现在编辑器下方，列出匹配的示例。从列表中选择示例会将相应的代码加载到右侧面板：\n\n![](img/Image2571.jpg)\n\
  \n图 8-20\n\n### 8.12 Live 模板\n\n当你编写 Android 代码时，你会发现有一些经常使用的常用结构。例如，一个常见的需求是使用\
  \ `Toast` 类向用户显示弹出消息。Live 模板是常用代码结构的集合，可以通过输入初始字符后按一个特殊键（默认设置为 `Tab` 键）在编辑器中输入模板代码。要体验这一操作，请在代码编辑器中输入\
  \ `toast` 然后按 `Tab` 键，Android Studio 将在光标位置插入以下代码并准备好编辑：\n\n```java\nToast.makeText(\"\
  \", \"\", Toast.LENGTH_SHORT).show();\n```\n\n\n\n\n\n要列出和编辑现有模板、更改特殊键或添加自己的模板，请打开\
  \ `Preferences` 对话框，并在左侧导航面板的 `Editor` 部分选择 `Live Templates`：\n\n![](img/as_4.0_live_templates.jpg)\n\
  \n图 8-21\n\n使用上方图 8-21 中标记为 `A` 的按钮来添加、删除、复制或重置模板。要修改模板，请从列表 (`B`) 中选择它并更改标记为 `C`\
  \ 的面板中的设置。\n\n## 8.13 总结\n\nAndroid Studio 编辑器投入大量精力减少编写代码所需的输入量，并使代码更容易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器窗口拆、代码折叠、重格式、文档查询和实时模板。\n\
  \n# 9. Android 架构概述\n\n到目前为止，本书已经采取了步骤来建立适用于使用 `Android Studio` 开发 Android 应用的环境。通过创建\
  \ `Android Studio` 应用项目，也迈出了应用开发流程的第一步。\n\n然而，在进一步研究 Android 应用开发的实际问题之前，了解 `Android\
  \ SDK` 以及通用的 Android 开发的一些较为抽象的概念至关重要。现在清晰地理解这些概念将为构建进一步知识提供坚实的基础。\n\n本章从 Android\
  \ 架构概述开始，并在本书的接几章中继续，目标是提供 Android 开发基础知识的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid\
  \ 以软件栈的形式结构化，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构可以通过图 9-1 所示的视觉方式进行最佳表示。软件栈的每一层以及每层中的相应元素都是紧密集成并经过仔细调的，旨在为移动设备提供最优的应用开发和执行环境。本章其余部分将逐步介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel` 开始。\n\n![](img/Image2438.jpg)\n\n图 9-1\n\n##\
  \ 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈底部，在设备硬件和 Android 软件栈上层之间提供了一个抽象层。该内核基于\
  \ Linux 版本 `2.6`，提供了抢式多任务处理，以及内存、进程和电源管理等底层核心系统服务，还为设备显示、WiFi 和音频等硬件提供了网络栈和设备驱动程序。\n\
  \n原始的 `Linux` 内核由 Linus Torvalds 于 1991 年开发，并与自由软件基金会的 Richard Stallman 开发的一系列工具、实用程序和编译器结合，创建了名为\
  \ `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是从这些基础架构衍生而来的，例如 `Ubuntu` 和红帽企业 Linux（Red Hat\
  \ Enterprise Linux）。\n\n然而，需要注意的是，Android 仅使用 `Linux` 内核。尽管如此，值得注意的是，`Linux` 内核最初是为桌面电脑和服务器形式的传统计算机设计的。事实上，`Linux`\
  \ 现在最广泛地部署在任务关键的企业服务器环境中。我们在 Android 软件栈的核心发现这种软件，这既证明了今天移动设备的强大，也证明了 `Linux` 内核的效率和性能。\n\
  \n## 9.3 Android 运行时 – ART\n\n当 Android 应用在 `Android Studio` 中构建时，它会被编译成一种中间字节码格式（称为\
  \ `DEX` 格式）。当应用程序随后加载到设备时，`Android Runtime` (`ART`) 使用一种称为提前编译（Ahead-of-Time, `AOT`）的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行和链接格式\
  \ (`ELF`)。\n\n之后每次启动应用程序时都会运行 `ELF` 可执行版本，从而获得更快的应用程序性能和更长的电池寿命。\n\n这与旧版 Android\
  \ 实现使用的即时编译（Just-in-Time, `JIT`）方法形成对比，后者每次启动应用程序时在虚拟机 (`VM`) 中翻译字节码。\n\n## 9.4\
  \ Android 库\n\n除了一组标准的 Java 开发库（提供对字符串处理、网络和文件操作等通用任务的支持）外，Android 开发环境还包含 `Android\
  \ Libraries`。这些是专门用于 Android 开发的 Java 库。此类库的示例包括应用框架库，以及便于用户界面构建、图形绘制和数据库访问的库。\n\
  \n以下是 Android 开发者可用的一些核心 Android 库的摘要：\n\n- `android.app` – 提供应用模型的访问，是所有 Android\
  \ 应用的基石。\n- `android.content` – 促进应用程序与应用组件之间的内容访问、发布和消息传递。\n- `android.database`\
  \ – 用于访问内容提供者发布的数据，包括 `SQLite` 数据库管理类。\n- `android.graphics` – 一种底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n\
  - `android.hardware` – 提供了访问加速度计和光传感器等硬件的 API。\n- `android.opengl` – 指向 `OpenGL\
  \ ES` 3D 图形渲染 API 的 Java 接口。\n- `android.os` – 为应用程序提供标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n\
  - `android.media` – 提供播放音频和视频的类。\n- `android.net` – 提供访问网络栈的 API。包括 `android.net.wifi`，提供对设备无线栈的访问。\n\
  - `android.print` – 包括一组允许从 Android 应用内部将内容发送到配置的打印机的类。\n- `android.provider` –\
  \ 一组便利类，提供对 Android 内容数据库的访问，例如日历和联系应用维护的数据库。\n- `android.text` – 用于在设备显示器渲染和处理文本。\n\
  - `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期时间操作。\n- `android.view` – 应用用户界面的基础构建块。\n\
  - `android.widget` - 一个丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在在应用程序中构建网页浏览功能的类。\n\n在涵盖了 Android 运行时的 Java 库之后，现在该将注意力转向 Android 软件栈这一层中的\
  \ C/C++ 库了。\n\n### 9.4.1 C/C++ 库\n\n在前节概述的 Android 运行时核心库是基于 Java 的并并编写 Android\
  \ 应用的开发者提供主要的 API。然而，需要注意的是，核心库并没有执行许多实际工作，事实上它们仅仅是一组 C/C++ 库的 Java “包装器”（wrappers）。例如，当调用\
  \ `android.opengl` 库在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++ 库，而该库又与底层的 `Linux`\
  \ 内核协作工作以完成绘制任务。\n\n\n\n\nC/C++ 库包含了广泛且多样的功能，包括 2D 和 3D 图形绘制、安全套接层 (SSL) 通信、SQLite\
  \ 数据库管理、音视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准 C 系统库 (`libc`) 的实现。\n\n在实践中，典型的 Android\
  \ 开发者仅通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用 Android 原生开发包 (`NDK`) 实现，其目的是通过\
  \ Java 原生接口 (`JNI`) 从 Java 代码中调用非 Java 或 Kotlin 语言（如 C 和 C++）的原生方法。\n\n## 9.5 应用程序框架\n\
  \n应用程序框架是一组服务，它们共同构成了 Android 应用程序运行和管理的环境。该框架实现了这样一个概念：Android 应用程序是由可重用、可交换和可替换的组件构建的。这一概念更进一步，应用程序还可以发布其能力以及任何相关数据，以便其他应用程序发现并重用它们。\n\
  \nAndroid 框架包含以下关键服务：\n\n- `Activity Manager` – 控制应用程序的生命周期和活动栈的所有方面。\n- `Content\
  \ Providers` – 允许应用程序发布并与其他应用程序共享数据。\n- `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - `Notifications Manager` – 允许应用程序向用户显示警报和通知。\n- `View System` – 一个可扩展的视图集合，用于创建应用程序用户界面。\n\
  - `Package Manager` – 应用程序借此查找设备上已安装的其他应用程序信息的系统。\n- `Telephony Manager` – 向应用程序提供设备上可用电话服务的信息，例如状态和订阅者信息。\n\
  - `Location Manager` – 提供对位置服务的访问，允许应用程序接收有关位置更改的更新。\n\n## 9.6 应用程序\n\n位于 Android\
  \ 软件栈顶端的是应用程序。它们包含了特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序。\n\
  \n## 9.7 总结\n\n良好的 Android 开发知识基础需要对 Android 的整体架构有理解。Android 以软件栈架构的形式实现，由 Linux\
  \ 内核、运行时环境及相应的库、一个应用程序框架以及一组应用程序组成。应用程序主要使用 Java 或 Kotlin 编写，并在 Android Studio 构建环境中编译为字节码格式。当应用程序随后安装到设备上时，这些字节码由\
  \ Android 运行时 (`ART`) 编译为 CPU 使用的原生格式。Android 架构的关键目标是性能和效率，涵盖了应用程序的执行以及应用程序设计中的重用实现。\n\
  \n# 10. Android 应用程序的剖析\n\n无论你之前的编程经验是基于 Windows、macOS、Linux 甚至 iOS，Android 开发很有可能与你以前遇到的任何东西都完全不同。\n\
  \n因此，本章的目的是提供对 Android 应用程序架构背后高层概念的理解。为此，我们将详细探讨用于构建应用程序的各种组件以及允许这些组件协作以创建一个协作应用程序的机制。\n\
  \n### 10.1 Android Activities\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象编程语言的人熟悉将应用程序功能元素封装在类中的概念，然后将其实例化为对象并进行操作以创建应用程序。由于\
  \ Android 应用程序用 `Java` 和 `Kotlin` 编写，情况依然如此。然而， Android 将可重用组件的概念提升到了更高的水平。\n\n\
  Android 应用程序通过组合一个或多个被称为 `Activities` 的组件创建的。Activity 是应用程序功能的单个独立模块，通常直接对应单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能有一个显示当天设置预约的\
  \ Activity 屏幕。该应用程序还可能使用第二个 Activity，它由一个用户可以在其中输入新预约的屏幕组成。\n\nActivity 被设计为完全可重用和可交换的构建块，可以在不同的应用程序之间共享。例如，现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个应用程序，该程序也有发送电子邮件消息的需求。开发者无需为新应用程序专门开发一个邮件编写 Activity，而可以直接使用现有电子邮件应用程序中的\
  \ Activity。\n\nActivity 是作为 `Android Activity` 类的子类创建的，并且必须实现为与应用程序中的其他 Activity\
  \ 完全独立。换句话说，共享的 Activity 够依赖于在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个 Activity\
  \ 不能直接调用另一个 Activity 的方法或访问其实例数据。相反，这是通过使用 `Intents` 和 `Content Providers` 实现的。\n\
  \n默认情况下，Activity 无法向调用它的 Activity 返回结果。如果需要此功能，则必须将该 Activity 特地启动为源 Activity 的子\
  \ Activity。\n\n### 10.2 Android Fragments\n\n如上所述，Activity 通常代表应用中的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个相应的\
  \ Activity 类文件来构建该 Activity。然而，更好的替代方案是将 Activity 拆分为不同的部分。这些部分中的每个部分被称为一个 fragment，每个\
  \ fragment 都由用户界面布局的一部分和一个匹配的类文件组成（声明为 `Android Fragment` 类的子类）。在这种情况下，Activity\
  \ 仅仅变成一个容器，在其中嵌入一个或多个 fragment。\n\n事实上，fragment 为让每个用户界面屏幕由单独的 Activity 表示提供了一种高效的替代方案。相反，一个应用可以由单个\
  \ Activity 组成，在不同的 fragment 之间切换，每个 fragment 代表一个不同的应用屏幕。\n\n### 10.3 Android Intents\n\
  \nIntent 是一个 Activity 启动另一个 Activity 并实现构成应用程序的 Activity 之间流转的机制。Intent 由对要执行的操作的描述以及可选的执行执行数据组成。\n\
  \nIntent 可以是显式的，即通过引用类名请求启动特定的 Activity；也可以是隐式的，通过陈述要执行的操作类型或提供要执行该操作的特定类型数据。在隐式\
  \ Intent 的情况下，Android 运行时将使用被称为 `Intent Resolution` 的过程选择最匹配 `Intent` 所指定标准的 Activity。\n\
  \n### 10.4 Broadcast Intents\n\n\n\n\n\n另一种类型的 `Intent` 是 `Broadcast Intent`（广播意），它是一种系统范围内的意图，发送给所有注册了“感兴趣”广播接收器（Broadcast\
  \ Receiver）的应用程序。例如，Android 系统通常会发送广播意来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\n\
  `Broadcast Intent` 可以是普通的（异步的），即它在几乎相同的时间内被发送给所有感兴趣的广播接收器；也可以是有序的，即它一次发送给一个接收器，由接收器对其进行处理，然后决定是中止还是允许传递给下一个广播接收器。\n\
  \n### 10.5 广播接收器\n\n广播接收器是应用程序能够响应 `Broadcast Intents` 的机制。`Broadcast Receiver`\
  \ 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指明它感兴趣的广播类型。当匹配的意图被广播时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒钟的时间来完成对其要求的任何任务（例如启动 `Service`、更新数据或向用户发送通知），然后返回。广播接收器在后台运行，并且没有用户界面。\n\
  \n## 10.6 Android 服务\n\nAndroid Services 是在后台运行且没有用户界面的进程。它们可以从活动（activities）、`Broadcast\
  \ Receivers`或其他 `Services` 启动并随后管理。`Android Services` 适用于应用程序需要继续执行任务但一定不需要用户可见用户界面的情况。虽然\
  \ `Services` 缺乏用户界面，但它们仍然可以使用通知（notifications）和吐司（toasts，即屏幕上出现但不中断当前可见活动的小型通知消息）来通知用户事件，并且能够发布\
  \ `Intents`。\n\nAndroid 运行时赋予 Service 的优先级高于许多其他进程，只有在系统为了释放资源的最后手段下，才会将其终止。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次可用，它将自动重启。`Service` 可以通过声明自己在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现。这仅适用于终止会对用户体验产生不利的情况（例如，如果用户正在收听由 `Service` 流出的音频）。\n\n`Service` 可能作为实际解决方案的示例情况包括（如提到的）：当应用程序不再活动时仍应继续的音频流，或者当股票达到指定价格时需要通知用户的股票跟踪应用程序。\n\
  \n## 10.7 内容提供者\n\nContent Providers 实现了一种在应用程序之间共享数据的机制。任何应用程序都可以通过实现 `Content\
  \ Provider` 为其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 `Content Provider`\
  \ 定义的通用资源标识符 (`URI`) 提供。数据可以以文件或整个 SQLite 数据库的形式进行共享。\n\n原生 Android 应用程序包含许多标准的\
  \ `Content Providers`，允许应用程序访问联系人和媒体文件等数据。Android 系统上当前提供的 `Content Providers` 可以使用\
  \ `Content Resolver` 定位。\n\n## 10.8 应用程序清单\n\n将组成应用程序的各种元素结合在一起的是 `Application Manifest`（应用程序清单）文件。在这个基于\
  \ XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供和权限。\n\n## 10.9 应用程序资源\n\n除了清单文件和包含字节码的\
  \ `Dex` 文件，Android 应用程序包通常还包含一组资源文件。这些文件包含了用户界面中显示的资源，如字符串、图像、字体和颜色，以及用户界面布局的 XML\
  \ 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n## 10.10 应用程序上下文\n\n当应用程序编译时，会创建一个名为\
  \ `R` 的类，其中包含对应用程序资源的引用。应用程序清单文件和这些资源创建了所谓的 `Application Context`（应用程序上下文）。该上下文由\
  \ `Android Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文中调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 总结\n\n可以通过多个不同的元素组合创建一个 Android 应用程序。在本章中，我们提供了活动（Activities）、片段（Fragments）、服务（Services）、意图和广播接收器的层级概述，以及清单文件和应用程序资源的概述。\n\
  \n通过以活动和意图的形式创建单独的、独立的功能模块，促进了最大程度的复用互操作性，而应用程序之间的数据共享则通过实现内容提供者来实现。\n\n虽然活动专注于用户与应用程序交互的区域（一个活动本质等同于单个用户界面，通常由一个或多个片段组成），但后台处理通常由\
  \ `Services` 和 `Broadcast Receivers` 处理。\n\n构成应用程序的组件在清单文件中为 Android 运行时进行了概述，该文件与应用程序资源相结合，代表了应用程序的上下文。\n\
  \n本章涵盖了许多内容，对普通开发者来说很可能是新的。然而，在随后的章节中将对这些概念进行深入探索和实际使用，以确保为构建您自己的应用程序奠定坚实的知识基础。\n\
  \n## 11. Android 视图绑定概述\n\n开发 Android 应用的重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的选项，特别强调一种名为视图绑定（view\
  \ binding）的选项。在涵盖视图绑定的基础之后，本章将概述将 AndroidSample 项目转换为这种方法的必要更改。\n\n## 11.1 通过 ID\
  \ 查找视图\n\n正如 Android 应用程序剖析章节概述的，构成应用程序的所有资源都编译到一个名为 `R` 的类中。这些资源中包含了定义布局的资源。`R`\
  \ 类中名为 `layout` 的子类，它包含布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如当从 `EditText`\
  \ 视图中读取输入的值或更改 `TextView` 上显示的内容时。\n\n在引入 Android Studio 3.6 之前，从应用程序代码内部访问视图的唯一选项是编写代码通过\
  \ `findViewById()` 方法根据其 ID 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n\n\n\
  \n虽然通过 ID 查找视图仍然是一种可行的选择，但它存在一些局限性，`findViewById()` 最大的缺点是可能会获取到一个尚未在布局中创建的视图引用，这会导致在尝试访问视图属性时抛出空指针异常。\n\
  \n从 Android Studio 3.6 开始，已经可以通过视图绑定（view binding）的形式提供从应用代码访问视图的替代方法。\n\n## 11.2\
  \ 视图绑定 (View Binding)\n\n当在应用模块中启用视图绑定时，Android Studio 会为该模块内的每个布局文件生成一个绑定类。使用此绑定类，可以从代码内部访问布局视图而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”（camel case），并在末尾附加“Binding”单词。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命命名为 `ActivityMainBinding`。\n\nAndroid Studio Chipmunk\
  \ 在项目模板中使用视图绑定方面存在不一致。例如，我们在创建 `AndroidSample` 项目时使用的空活动（Empty Activity）模板没有使用视图绑定。另一方面，基础活动（Basic\
  \ Activity）模板是使用视图绑定实现的。如果你使用的模板没有使用视图绑定，那么了解如何将该项目从合成属性（synthetic properties）迁移出来是非常重要的。\n\
  \n## 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 `AndroidSample` 项目转换为使用视图绑定代替\
  \ `findViewById()` 来练习迁移到视图绑定。\n\n首先启动 Android Studio 并打开在在 Android Studio 中创建示例\
  \ Android 应用章节中创建的 `AndroidSample` 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须对需要视图绑定的每个模块的\
  \ `build.gradle` 文件进行更改。对于 `AndroidSample` 项目，这需要对 `Gradle Scripts -> build.gradle\
  \ (Module: AndroidSample.app)` 文件进行细微更改。将此文件加载到编辑器中，找到 `android` 部分并添加如下项以启用 `viewBinding`\
  \ 属性：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n\
  \    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n完成此更改后，点击编辑器面板顶部的\
  \ `Sync Now` 链接，然后使用 `Build` 菜单清理并重新构建项目，以确保生成了绑定类。下一步是在代码中使用该绑定类。\n\n## 11.5 使用视图绑定\n\
  \n此过程的第一步是“膨胀”（inflate）视图绑定类，以便我们可以访问布局中的根视图。该根视图将用作布局的内容视图。\n\n执行这些任务的逻辑位置是在与布局相关的活动的\
  \ `onCreate()` 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n要切换到使用视图绑定，需要导入视图绑定类并如下如下修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类名为 `ActivityMainBinding`。请注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域名，则需要更改下面的导入语句以反映这一点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们有了绑定的引用，可以如下所示通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(euroValue.toString());\n\
  \    } else {\n        binding.textView.setText(R.string.no_value_string);\n   \
  \ }\n}\n```\n\n编译并运行应用，验证货币转换过程是否像以前一样正常工作。\n\n## 11.6 选择选项\n\n尽管在空活动模板中没有采用视图绑定，但\
  \ Google 强烈建议尽可能使用视图绑定。事实上，对合成属性的支持现在已经弃用，并可能在未来的发布中被移除。因此，在开发自己的项目时，应该使用视图绑定。\n\
  \n## 11.7 书中的视图绑定\n\n本书中任何依赖未实现视图绑定的项目模板的章节将首先进行迁移。然而，与其在每次执行迁移时都重复步骤，这些章节将引导你回到这里重温记忆（别担心，几个章节之后，必要的更改就会顺理成章）。为了帮助这一过程，下面的部分更简洁地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 编辑项目窗口列出的 `Gradle Scripts\
  \ -> build.gradle (Module: <project name>.app)` 模块级脚本文件，`<project name>` 是项目名称（例如\
  \ `AndroidSample`）。\n2. 找到文件的 `android` 部分并添加如下项以启用 `viewBinding` 属性：\n\n```gradle\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n}\n```\n3. 点击编辑器顶部的\
  \ `Sync Now` 链接以这些新的构建设置重新同步项目。\n4. 编辑 `MainActivity.java` 文件并按如下所示修改（其中 `<reverse\
  \ domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 `androidsample`），`<binding\
  \ name>` 是对应布局资源文件的绑定名称（例如 `activity_main.xml` 的绑定为 `ActivityMainBinding`）：\n\n\
  ```java\nimport android.view.View;\nimport com.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = <binding name>.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n5. 通过绑定对象的属性按名称访问视图。\n\
  \n## 11.9 总结\n\n\n\n\n在 Android Studio 3.6 引入之前，在 App 代码中访问布局视图需要使用 `findViewById()`\
  \ 方法。现在提供了一种名为视图绑定（view bindings）的替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对对应布局中每个视图的绑定，比\
  \ `findViewById()` 方法提供的选项提供了更安全的选择。然而，从 Android Studio Chipmunk 版本开始，某些项目模板默认未启用视图绑定，需要通过额外的步骤来在每个项目模块中手动启用并配置支持。\n\
  \n# 12. 了解 Android 应用程序和 Activity 生命周期周期\n\n在之前的章节中，我们已经学习了 Android 应用程序运行在进程中，并且它们由活动（activities）、服务（services）和广播接收器（broadcast\
  \ receivers）形式的多个组件组成。本章的目标是通过查看 Android 运行时系统中应用程序和 Activity 的生命周期来扩展这些知识。\n\n\
  无论对于如今的移动设备与过去的桌面系统相比拥有多少内存和计算能力的讨论有多沸沸扬扬，请记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍然被认为是“资源受限”的，特别是在内存方面。因此，Android\
  \ 系统的一项关键职责是确保有效地管理这些有限资源，并确保操作系统及其运行的应用程序始终对用户保持响应。为了实现这一点，Android 对对运行应用程序的进程以及组成这些应用程序的单个组件的生命周期和状态拥有完全控制权。\n\
  \n因此，开发 Android 应用程序的一个重要因素是理解 Android 的应用程序和 Activity 生命周期管理模型，以及应用程序如何应对在其执行生命周期内可能施加于它的状态变化。\n\
  \n## 12.1 Android 应用程序与资源管理\n\n每个运行的 Android 应用程序都被操作系统视为一个独立的进程。如果系统识别到设备上的资源正达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前正在运行进程的优先级和状态，结合这些因素创建出 Google 所谓的“重要性层级”（importance\
  \ hierarchy）。然后，系统将从最低优先级开始，按照层级关系逐个向上终止进程，直到系统释放了足够的资源以供其运行。\n\n## 12.2 Android\
  \ 进程状态\n\n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其托管的应用程序中排名最高的活动组件定义。如 图 12-1\
  \ 所示，进程在任何时刻都可以处于以下五种状态之一：\n\n![android_process_priorities.png](img/Image24381.jpg)\n\
  \n图 12-1\n\n### 12.2.1 前台进程 (Foreground Process)\n\n这些进程被赋予最高优先级。在任何时刻，活跃的前台进程可能只有一个或两个，这些通常是系统最后被终止的进程。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n* 托管一个用户正在交互的 Activity。\n* 托管一个与用户正在交互的 Activity 连接的 Service。\n* 托管一个通过调用 `startForeground()`\
  \ 指明终止将破坏用户体验的 Service。\n* 托管一个正在执行其 `onCreate()`、`onResume()` 或 `onStart()` 回调函数的\
  \ Service。\n* 托管一个正在执行其 `onReceive()` 方法的广播接收器。\n\n### 12.2.2 可见进程 (Visible Process)\n\
  \n包含对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的 Activity 对用户可见，但另一个 Activity（例如部分屏幕或对话框）处于前台时。如果一个进程托管的\
  \ Service 本身绑定到一个可见或前台 Activity，该进程也具备可见状态的资格。\n\n### 12.2.3 Service 进程 (Service\
  \ Process)\n\n包含已启动且正在执行的 Service 的进程。\n\n### 12.2.4 后台进程 (Background Process)\n\
  \n包含一个或多个当前对用户不可见的 Activity，且未托管符合 Service 进程状态的 Service 的进程。如果需要为更高优先级的进程释放额外内存，落此类类别的进程面临很高的终止风险。Android\
  \ 维护着后台进程的动态列表，按时间顺序终止进程，使得最久未在前台的进程首先被杀死。\n\n### 12.2.5 空进程 (Empty Process)\n\n\
  空进程不再包含任何活跃的应用程序，并保留在内存中，准备好为新启动的应用程序提供托管。这在某种程度上为了等乘客到达而让公交车敞门并保持引擎运行。此类进程显然被认为是最低优先级，是释放资源时第一个被杀死的。\n\
  \n## 12.3 进程间依赖关系\n\n关于确定最高优先级进程的情况比上一节描述的要稍微复杂，简单的原因是进程之间往往是相互依赖的。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程提供服务（例如，作为前台进程的内容提供者的 Service 进程）。根据基本规则，Android 文档规定，一个进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期\n\n正如我们之前确定的，Android 进程的状态在很大程度上取决于组成其托管应用程序的 Activity 和组件的状态。因此，重要的是，这些\
  \ Activity 在应用程序的执行生命周期内也会经过不同的状态。Activity 的当前状态在某种取决于它在所谓的“Activity 栈”（Activity\
  \ Stack）中的位置。\n\n## 12.5 Activity 栈\n\n对于在 Android 设备上运行的每个应用程序，运行时系统都维护着 Activity\
  \ 栈。当应用程序启动时，该应用程序启动的第一个 Activity 会被放入栈中。当启动第二个 Activity 时，它被放置在栈顶，而先前的 Activity\
  \ 则被向下推。位于栈顶的 Activity 被称为活跃（或运行中）Activity。当活跃 Activity 退出时，它从栈中弹出，栈中紧邻其下方的 Activity\
  \ 变成当前的活跃 Activity。例如，栈顶的 Activity 可能会退出，是因为它负责的任务已经完成。或者，用户可能选择了屏幕上的“返回”按钮以回到上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并被销毁。Android Activity 栈的视觉表示如 图 12-2 所示。\n\n\
  \n\n如图像所示，当新活动启动时，它们会被推入栈的顶部。当前活跃活动位于栈的顶部，直到它被新活动推入栈的下方，或者在它退出或用户导航到上一个活动时从栈中弹出。如果资源变得受限，运行时将杀死活动，从栈底的活动开始。\n\
  \n`Activity Stack`（活动栈）就是编程术语中所所谓的“后进先出”（LIFO）栈，因为最后一个被推入栈的项是第一个被弹出栈的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n## 12.6 活动状态\n\n在应用程序执行的整个过程中，活动可以处于若干不同状态之一：\n\n-   **活跃 / 运行中（Active\
  \ / Running）** – 该活动位于 `Activity Stack` 顶部，是设备屏幕上可见的前台任务，拥有焦点并且当前正在与用户交互。在资源短缺的情况下，这种活动最不容易被终止。\n\
  -   **已暂停（Paused）** – 该活动对用户可见，但当前没有焦点（通常是因为该活动被当前活跃活动部分遮挡）。已暂停的活动保留在内存中，保持连接到窗口管理器，保留所有状态信息，并且当移动到\
  \ `Activity Stack` 顶部时可以快速恢复到活跃状态。\n-   **已停止（Stopped）** – 该活动当前对用户不可见（换句话说，它在设备显示上被其他活动完全遮挡）。与已暂停的活动一样，它保留了所有状态和成员信息，但在低内存情况下，其被终止的风险更高。\n\
  -   **已杀死（Killed）** – 该活动已被运行时系统终止以释放内存，不再存在于 `Activity Stack` 中。如果应用程序需要，则必须重启此类活动。\n\
  \n## 12.7 配置更改\n\n到本章为止，我们已经了导致 Android 活动状态改变的两种原因，即活动在前台和后台之间的移动，以及运行时系统终止活动以释放内存。事实上，还有第三种场景，即活动状态在这种情况下会发生剧烈变化，这涉及到设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如在竖屏和横屏之间旋转设备方向，或更改系统字体设置）都会导致活动被销毁并重新创建。背后的原理是此类更改会影响用户界面布局等资源，而简单地销毁并重建受影响的活动是活动响应配置更改的最快方式。然而，也可以配置活动，使其在响应特定配置更改时不会被系统重启。\n\
  \n## 12.8 处理状态更改\n\n即使没有别的，从本章也应该很清楚，应用程序以及根据定义包含在其中的组件在整个生命周期内将经历许多状态的转换。特别重要的一点是，这些状态更改（包括完全终止在内）是\
  \ Android 运行时根据用户操作和设备上资源的可用性强加给应用程序的。\n\n但在实践中，这些状态更改并非完全在没有通知的情况下强加的，在大多数情况下，应用程序会收到运行时系统的更改通知，并获得相应反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个并发运行应用程序的假象。\n\
  \nAndroid 提供了两种方法来处理应用内对象生命状态的变化。一种方法涉及响应操作系统的状态更改方法调用，将在下一章“处理 Android 活动状态更改”中详细介绍。\n\
  \n一种新方法，也是 Google 推荐的方法，涉及 Jetpack Android 组件包含的生命周期类，这些类在“使用 Jetpack 构建现代 Android\
  \ 应用架构`中引入，并在“与 Android 生命周期感知组件配合`章节中进行了更详细的解释。\n\n## 12.9 总结\n\n移动设备通常被认为是资源受限的，特别是内存容量方面。因此，Android\
  \ 操作系统的主要职责之一是确保应用程序以及整个操作系统对用户保持响应。\n\n应用程序托管在 Android 的进程中。每个应用程序又由活动和 `Services`\
  \ 服务组件组成。\n\nAndroid 运行时系统有权终止进程和单个活动以释放内存。运行时在判断一个进程是否为合适的终止候选时会考虑进程状态。进程的状态很大程度上取决于该进程托管的活动状态。\n\
  \n本章的核心信息是，应用程序在执行生命周期内会经历各种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。不直接与用户交互的进程和活动被运行时系统终止的风险更高。因此，Android\
  \ 应用开发的一个基本元素是应用程序具备响应操作系统状态更改通知的能力。\n\n## 13. 处理 Android 活动状态更改\n\n根据“理解 Android\
  \ 应用和活动生命周期`章节中概述的信息，现在显而易见，构成应用程序的活动和片段在应用程序的生命周期内会经历各种不同的状态。从一个状态到另一个状态的更改是由 Android\
  \ 运行时系统强加的，因此在很大程度上不受活动本身的控制。然而，这并不意味着应用程序无法响应这些更改并采取适当行动。\n\n### 13.1 新旧生命周期技术\n\
  \n直到最近，为应用构建生命周期感知能力有一种标准方法。这是本章介绍的方法，涉及在活动或片段实例中实现一组方法（每个生命周期状态对应一个），当对象的生命周期状态更改时，操作系统会调用这些方法。这种方法自\
  \ Android 操作系统早期以来一直没有变化，虽然今天仍然是一个可行的选择，但它确实有一些局限性，将在本章后续部分进行解释。\n\n\n\n\n\n随着 Jetpack\
  \ Android 架构组件生命周期类（lifecycle classes）的引入，现在有了更好的生命周期处理方法。这种现代生命周期管理方法（结合 Jetpack\
  \ 组件和架构指南）将在随后的章节中详细介绍。然而，出于几个原因，理解传统的生命周期方法仍然很重要。首先，作为一名 Android 开发人员，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中的一些。更重要的是，理解处理生命周期的旧方法将为你以后在书后面开始学习新方法提供良好的知识基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n在极少数情况下，应用程序中的 activity 和 fragment 分别是作为 Android\
  \ `AppCompatActivity` 类和 `Fragment` 类的子类创建的。\n\n例如，考虑在“在 Android Studio 中创建示例 Android\
  \ 应用”中创建的 `AndroidSample` 项目，并随后将其转换为视图绑定（view binding）。将此项目加载到 Android Studio 环境中，并找到\
  \ `MainActivity.java` 文件（位于 `app -> java -> com -> <your domain> -> androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容应如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(\n                    binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \                    String.format(Locale.ENGLISH,\"%f\", euroValue));\n       \
  \ } else {\n            binding.textView.setText(R.string.no_value_string);\n  \
  \      }\n    }\n}\n```\n\n当项目创建时，我们指示 Android Studio 同时也创建一个名为 `MainActivity.java`\
  \ 的初始 activity。如上述代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的引用文档可以发现它本身也是 `Activity` 类的子类。这可以在 Android Studio 编辑器中使用 `Hierarchy` 工具窗口进行进行验证。当将\
  \ `MainActivity.java` 文件加载到编辑器中时，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。层级工具窗口随后将会出现，显示所选类的类层次结构。如图\
  \ 13-1 所示，`AppCompatActivity` 显然继承自 `FragmentActivity` 类，而 `FragmentActivity` 最终本身也是\
  \ `Activity` 类的子类：\n\n![](img/as_3.6_class_heirachy.jpg)\n\n图 13-1\n\n`Activity`\
  \ 和 `Fragment` 类包含一系列方法，旨在由 Android 运行时调用，以便在对象状态发生时通知该对象。在本章中，我们将这些方法称为生命周期方法。activity\
  \ 或 fragment 类只需要重写这些方法并在它们内部实现必要的功能，以对状态变化做出相应反应。\n\n其中一个方法的方法名为 `onCreate()`，再次回到上面的代码段，我们可以看到该方法已经在\
  \ `MainActivity` 类中为我们重写并实现。在随后的章节中，我们将详细探索 `onCreate()` 以及 `Activity` 类和 `Fragment`\
  \ 类的其他相关生命周期方法。\n\n## 13.3 动态状态 vs. 持久化状态\n\n生命周期管理的关键目标是确保 activity 的状态在适当的时间被保存和恢复。当我们在此语境下讨论状态时，我们指的是当前存储在\
  \ activity 中的数据以及用户界面的外观。例如，activity 可能会在内存中维护一个数据模型，该模型需要保存到数据库或文件中。这种状态信息因为从应用程序的某次调用持续存在，因此被称为持久化状态（persistent\
  \ state）。\n\n用户界面的外观（例如输入到字段中尚未提交给应用程序的文本）被称为动态状态（dynamic state），因为它通常只在应用程序的单次调用期间保留。理解这两种状态之间的区别很重要，因为它们的保存方式以及保存的原因都不同。\n\
  \n保存持久化状态的目的是避免 activity 在后台被运行时系统杀死而导致的数据丢失。另一方面，保存动态状态的原因稍微复杂一些。例如，一个应用程序包含一个\
  \ activity（我们将其称为 `Activity A`），该 activity 包含一个文本字段和一些单选按钮。在使用应用程序的过程中，用户在文本字段中输入了一些文本，并在单选按钮上进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ activity，导致 `Activity A` 被推入 Activity 栈并放置在后台。一段时间后，运行时系统确定内存不足，因此杀杀了 `Activity\
  \ A` 以释放资源。然而，对于用户而言，`Activity A` 只是被放置在了后台，并且随时可以移动到前台。当返回 `Activity A` 到前台时，用户会很合理地预期输入的文本和单选按钮的选择已被保留。然而，在这种情况下，`Activity\
  \ A` 的新实例将被创建，如果动态状态没有被保存和恢复，则之前的用户输入将丢失。因此，保存动态状态的主要目的是提供前台和后台 activity 之间无缝切换的感知，无论\
  \ activity 是否实际上被杀死并重启。保存持久化和动态状态的机制在本章的后续章节中将变得更加清晰。\n\n## 13.4 Android 生命周期方法\n\
  \n如前文所述，`Activity` 和 `Fragment` 类包含许多生命周期方法，在实例状态更改时作为事件处理程序。Android `Activity`\
  \ 类和 `Fragment` 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)`：当 activity\
  \ 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个 `Bundle` 对象作为参数，该对象可能包含来自 activity 之前调用的动态状态信息（通常与用户界面状态有关）。\n\
  - `onRestart()`：当 activity 在之前被运行时系统停止后准备重新启动时调用。\n\n\n\n\n\n### 生命周期方法\n\n- `onStart()`\
  \ – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用，此方法通知 activity 它即将对用户可见。如果 activity\
  \ 移动到 activity 栈的顶部，则在此调用之后将调用 `onResume()`；如果它被另一个 activity 压到栈底，则将调用 `onStop()`。\n\
  - `onResume()` – 表示 activity 现在处于 activity 栈的顶部，并且是用户当前正在与之交互的 activity。\n- `onPause()`\
  \ – 表示之前的 activity 即将成为前台 activity。取决于 activity 是返回前台还是对用户不可见，此调用之后将调用 `onResume()`\
  \ 或 `onStop()` 方法。在此方法中可以采取措施存储尚未被应用保存的持久化状态信息。为了避免切换 activity 时的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应该停止任何\
  \ CPU 密集型任务（如动画）。\n- `onStop()` – activity 现在不再对用户可见。此调用之后可能出现两种后续场景：如果 activity\
  \ 再次移动到前台，则调用 `onRestart()`；如果 activity 正在被终止，则调用 `onDestroy()`。\n- `onDestroy()`\
  \ – activity 即将被销毁，可能是因为 activity 已完成任务并调用了 `finish()` 方法而主动结束，也可能是因为运行时正在终止它以释放内存或由于配置更改（如设备方向改变）。需要注意的是，activity\
  \ 终止时并不总是会调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且该 activity 已指示不进行重启时调用。该方法接收一个\
  \ `Configuration` 对象，该对象概述了新的设备配置，然后由 activity 负责对更改做出响应。\n\n### Fragment 生命周期方法\n\
  \n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()` - 当 fragment 分配给一个 activity 时调用。\n\
  - `onCreateView()` – 调用以创建并返回 fragment 的用户界面布局层级结构。\n- `onActivityCreated()` - 与\
  \ fragment 关联的 activity 的 `onCreate()` 方法已执行完毕。\n- `onViewStatusRestored()` - fragment\
  \ 保存的视图层级结构已恢复。\n\n### 动态状态管理\n\n除了上述生命周期方法外，还有两个专门用于保存和恢复 activity 动态状态的方法：\n\n\
  - `onRestoreInstanceState(Bundle savedInstanceState)` – 当 activity 从之前的调用（已保存状态）中重启时，此方法在调用\
  \ `onStart()` 方法后立即调用。与 `onCreate()` 一样，此方法传递一个包含之前状态数据的 `Bundle` 对象。此方法通常用于以下情况：即在\
  \ `onCreate()` 和 `onStart()` 中完成 activity 初始化后，恢复之前的状态更具意义的场景。\n- `onSaveInstanceState(Bundle\
  \ outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面相关）。该方法传递一个 `Bundle` 对象，状态应保存到该对象中，随后当\
  \ activity 重启时，该对象将通过之传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，此方法仅在运行时确定需要保存动态状态时才会被调用。\n\
  \n在重写上述方法时，请记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类相应方法的调用。例如，下面的方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例该方法的调用：\n\n```java\nprotected void onRestart() {\n\
  \    super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n```\n\n在方法重写中未进行此父类调用会导致运行时在执行期间抛出异常。虽然在\
  \ `onRestoreInstanceState()` 和 `onSaveInstanceState()` 方法中调用父类是可选的（例如，在实现自定义的保存和恢复行为时可以省略），但使用它们有显著的优势，该主题将在[“保存和恢复\
  \ Android Activity 状态”]章节中进行介绍。\n\n### 13.5 生命周期\n\n最后一个要涵盖的主题涉及整个可见和前台生命周期的概述，activity\
  \ 或 fragment 在执行期间将经过这些生命周期：\n\n- **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从初始调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- **可见生命 (Visible Lifetime)**\
  \ – 涵盖了调用 `onStart()` 到 `onStop()` 之间的执行期间。在此期间，activity 或 fragment 对用户可见，尽管它可能不是用户当前正在与之交互的对象。\n\
  - **前台生命 (Foreground Lifetime)** – 指调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\n\
  需要注意的是，一个 activity 或 fragment 在整个生命周期内可能会多次经过前台和可见生命。\n\n生命周期和生命周期方法的概念如图 13-2 所示：\n\
  \n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\n## 13.6\
  \ 折叠屏设备与多恢复\n\n如前所述，当一个 activity 移动到前台并是用户当前正在与之交互的 activity 时，它被认为处于恢复状态。在标准设备上，应用在任何时候只能有一个\
  \ activity 处于恢复状态，所有其他 activity 可能处于暂停或停止状态。\n\n一段时间以来，Android 一直包含了多窗口支持，允许多个 activity\
  \ 同时出现在分屏或自由布局中。虽然此功能最初用于大屏幕平板设备，但随着折叠屏设备的推出，它可能会变得流行。\n\n在运行 Android 10 且启用多窗口支持的设备上（大多数折叠屏设备如此），多个应用\
  \ activity 同时处于恢复状态（这种概念被称为多恢复），允许这些可见 activity 在另一个 activity 获得焦点时继续运行（例如流媒体内容或更新视觉数据）。尽管多个\
  \ activity 可以处于恢复状态，但这些 activity 中仅有一个会被视为顶部恢复 activity（换句话说，就是用户最近交互的 activity）。\n\
  \nactivity 可以通过实现 `onTopResumedActivityChanged()` 回调方法来接收获得或丢失顶部恢复状态的通知。\n\n## 13.7\
  \ 禁用配置更改重启\n\n\n\n\n\n正如本章开头提到的，生命周期方法已经使用了多年，直到最近，它们一直是处理活动（activity）和片段（fragment）生命周期状态变化的机制。然而，这种方法存在缺点。\n\
  \n生命周期方法的一个问题是，它们没有为活动或片段在应用执行过程中的任何特定点轻松发现其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，这些方法没有提供一种简单的方法，让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为应用中的许多其他对象都可能受到特定活动或片段生命周期状态变化的影响。\n\
  \n生命周期方法仅在 `Fragment` 和 `Activity` 类的子类中可用。因此，无法构建真正感知生命期的自定义类。\n\n最后，生命周期方法导致大多数生命周期处理代码被写在活动或片段内部，这可能导致复杂且易出错的代码。理想情况下，这些代码大部分应该位于受状态变化影响的其他类中。例如，一个流媒体视频应用可能包含一个专门用于管理输入流的类。如果应用在主活动停止时需要暂停流，那么执行该操作的代码应该位于流媒体类中，而不是主活动中。\n\
  \n所有这些问题以及更多问题通过使用感知生命期的组件得以解决，这一主题将从名为 Jetpack 现代 Android 应用架构的章节开始。\n\n## 13.9\
  \ 总结\n\n所有活动都源自 Android `Activity` 类，该类反包含许多生命周期方法，运行时系统在活动状态更改时调用这些方法。同样，`Fragment`\
  \ 类也包含许多类似的方法。通过重写这些方法，活动和片段可以对状态变化做出响应，并在必要时采取步骤保存并恢复活动及程序的当前状态。生命周期状态可以被认为有两种形式。持久状态（persistent\
  \ state）是指在应用调用之间需要存储的数据（例如存储到文件或数据库）。另一方面，动态状态（dynamic state）与用户界面的当前显示有关。\n\n\
  虽然生命周期方法有很多局限性，可以通过感知生命期的组件避免，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法非常重要。\n\n在本章中，我们强调了活动可用的生命周期方法，并涵盖了活动生命期的概念。在下一章通过示例理解\
  \ Android 活动状态变化中，我们将实现一个示例应用程序，将这些理论付诸实践。\n\n### 14. 通过示例理解 Android 活动状态变化\n\n\
  之前的章节已经详细讨论了构成 Android 应用的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用程序，将处理活动状态变化的理论付诸实践。该示例应用程序的目的是为活动提供在\
  \ Android 运行时通过各种不同状态的真实世界演示。在下一章保存和恢复 Android 活动的状态中，本章中构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n#### 14.1 创建状态变化示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，并在必要时，使用 `File ->\
  \ Close Project` 菜单选项关闭任何当前打开的项目，以便出现欢迎界面。\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。项目创建过程完成后，`StateChange` 项目应列在 Android Studio 主窗口左侧的 `Project`\
  \ 工具窗口中。使用第 11.8 将项目迁移到 View Binding 节中概述的步骤将项目转换为使用视图绑定。\n\n接下来的操作涉及设计活动的用户界面。它存储在名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有，请在项目工具窗口中导航到它，可以在\
  \ `app -> res -> layout` 文件夹中找到它。一旦找到，双击该文件即可将其加载到 Android Studio Layout Editor\
  \ 工具中。\n\n![](img/as_4.2_statechange_layout_editor.jpg)\n\n图 14-1\n\n### 14.2 设计用户界面\n\
  \n当用户界面布局加载到 `Layout Editor` 工具后，现在是为示例应用程序设计用户界面了。与用户界面设计中当前存在的“Hello World!” `TextView`\
  \ 不同，活动实际上需要一个 `EditText` 。在 `Layout Editor` 画布上选择 `TextView` 对象并按键盘上的 `Delete`\
  \ 键将其从设计中删除。\n\n从 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，从文本组件列表中点击并拖动 `Plain\
  \ Text` 组件到设备屏幕的可视表示上。将组件移动到屏幕中心，使指南线出现，然后将其放置在位置，使布局类似于图 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\
  \n图 14-2\n\n在使用 `EditText` 控件时，必须为视图指定 `inputType`。这简单地定义了用户输入的文本或数据类型。例如，如果将 `inputType`\
  \ 设置为 `Phone`，用户将被限制在视图中输入数字。或者，如果将 `inputType` 设置为 `TextCapCharacters`，输入将默认为大写字母。输入类型也可以组合。\n\
  \n为了本示例的目的，我们将设置 `inputType` 以支持通用文本输入。为此，选择布局中的 `EditText` 控件，并在 `Attributes` 工具窗口中找到\
  \ `inputType` 条目。点击当前设置左侧的标志图标打开选项列表，在列表中关闭 `textPersonName` 并启用 `text`，然后点击 `Apply`\
  \ 按钮。\n\n默认情况下，`EditText` 显示内容为“Name”的文本。留在 `Attributes` 面板中，从 `text` 属性字段中删除此内容，使布局中的视图为空。\n\
  \n在继续之前，点击布局编辑器工具栏上的 `Infer Constraints` 按钮以添加任何缺失的约束。\n\n#### 14.3 重写活动生命周期方法\n\
  \n\n\n\n\n此时，项目包含一个名为 `MainActivity` 的单一活动，它派自 Android 的 `AppCompatActivity` 类。该活动的源代码包含在\
  \ `MainActivity.java` 文件中，该文件已经在编辑器会话中打开，并在编辑器标签栏中以标签页的形式显示。如果文件未打开，请在 Project 工具窗口面板中（`app\
  \ -> java -> com -> ebookfrenzy -> statechange -> MainActivity`）导航到它并双击将其加载到编辑器中。\n\
  \n到目前为止，活动重写的唯一周期方法是 `onCreate()` 方法，该方法已实现为在设置活动的用户界面之前调用父类的方法实例。我们现在将修改此方法，使其在每次执行时都能在\
  \ Android Studio 的 Logcat 面板中输出诊断消息。为了实现这一点，我们将使用 `Log` 类，这要求导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n\n.\n\nimport android.util.Log;\n\nimport androidx.annotation.NonNull;\n\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private static final String\
  \ TAG = \"StateChange\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Log.i(TAG, \"onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 快捷键生成，如标题为[Android Studio 代码编辑器基础]](#Code_Editor.xhtml__idTextAnchor193)的章节概述所示。请注意，如果方法是自动生成的，仍然需要手动添加\
  \ `Log` 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n### 14.4 过滤 Logcat 面\n\n\
  在 `MainActivity.java` 的重写方法中添加代码的作用是将日志信息输出到 Logcat 工具窗口。此输出可以配置为显示与设备或模拟器会话的所有事件，或者限制为与当前选定应用相关的事件。输出还可以进一步限制为仅匹配特定过滤器的日志事件。\n\
  \n显示 Logcat 工具窗口并点击过滤器菜单（标记为图 14-3 中的 B）以查看可用选项。当此菜单设置为“Show only selected application”（仅显示选定应用）时，Logcat\
  \ 面板中将仅显示与标记为 A 的菜单应用相关的消息。相反，选择“No Filters”（无过滤器）将显示由设备或模拟器生成的所有消息。\n\n![](img/as_4.0_statechange_logcat.jpg)\n\
  \n图 14-3\n\n在运行应用程序之前，值得演示创建一个过滤器，当被选中时，它将进一步限制日志输出，确保只显示包含我们在活动中声明的标签的日志消息。\n\n\
  从过滤器菜单 (B) 选择 Edit Filter Configuration（编辑过滤器配置）菜单选项。在 Create New Logcat Filter\
  \ 对话框（图 14-4）中，将过滤器命名为 `Lifecycle`，并在 Log Tag 字段输入在 `MainActivity.java` 中声明的 Tag\
  \ 值（在上面的代码示例中为 `StateChange`）。\n\n![](img/2459)\n\n在 Package Name 字段中输入包标识，更改完成后，点击\
  \ OK 创建过滤器并关闭对话框。现在应该选中新创建的过滤器，而不是列出 No Filters。\n\n### 14.5 运行应用程序\n\n为了获得最佳效果，应用程序应在物理设备或模拟器上运行。在设备配置并连接到开发环境后，点击\
  \ Android Studio 工具栏上绿色三角形表示的运行按钮，如下方的图 14-5 所示，选择 Run -> Run 菜单选项或使用键盘快捷键 `Shift+F10`：\n\
  \n![](img/as_3.5_run_state_app.jpg)\n\n如果你尚未配置设备，请从 Choose Device 对话框中选择物理设备或模拟器。在\
  \ Android Studio 构建应用程序并将其安装到设备上后，它应该启动并在前台运行。查看 Logcat 面板可以显示到为止触发了哪些方法（确保选中了上一节创建的\
  \ Lifecycle）：\n\n![](img/2476)\n\n图 14-6\n\n### 14.6 测试活动\n\n随着诊断功能的正常工作，现在是时候通过操作应用程序来获得对活动周期的理解了。首先，考虑\
  \ Logcat 面板中的初始日志序列：\n\n`onCreate`\n`onStart`\n`onResume`\n\n显然，初始状态更改正如理解 Android\
  \ 应用生命周期所示。但注意，并没有调用 `onRestoreInstanceState()`，因为 Android 运行时检测到在这种没有没有恢复的状态。\n\
  \n点击设备显示底部状态栏上的主图标，并注意日志中报告的方法调用序列如下：\n\n`onPause`\n`onStop`\n`onSaveInstanceState`\n\
  \n在这种情况下，运行时注意到活动不再处于前台，用户不可见，并停止了活动，但并未为活动提供保存动态状态的机会。取决于运行时最终销毁了活动还是仅重新启动了它，当用户返回活动时，活动将通过\
  \ `onRestart()` 调用通知其已重启，或者将再次经历创建序列。\n\n正如理解 Android 应用生命周期所述，活动的销毁和重建可以通过对设备进行配置更改（例如旋转屏幕）来触发。要观察此操作，只需在\
  \ StateChange 应用程序处于前台时旋转设备。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。该按钮位于设备或模拟器屏幕的底部，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n\n\n\n日志中产生的方法调用序列如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在 activity 被销毁和重启之前，已经给了它一个保存状态的机会。\n\n### 14.7 总结\n\n\
  “一画胜千言”这句古谚语在学习新编程范式的示例中也同样适用。在本章中，我们创建了一个 Android 应用程序示例，目的是为了演示 activity 可能会经历的不同生命周期状态。在本章的项目开发过程中，我们还查看了从\
  \ activity 内部生成诊断性日志信息的机制。\n\n在下一章中，我们将扩展 `StateChange` 示例项目，用以演示如何保存和恢复 activity\
  \ 的动态状态。\n\n# 15. 保存和恢复 Android Activity 的状态\n\n如果前面的几个章节已经实现了目标，那么现在对于在 activity\
  \ 的生命周期中的特定点保存并恢复用户界面状态的重要性，应该会变得更清晰一些。\n\n在本章中，我们将扩展在 “通过示例学习 Android Activity\
  \ 状态变化” 中创建的示例应用程序，以演示当 activity 被运行时系统销毁并重建时，保存和恢复状态涉及的步骤。\n\n保存和恢复动态状态的关键组件涉及使用\
  \ Android SDK 中的 `Bundle` 类，这个主题在本章中也会介绍。\n\n## 15.1 保存动态状态\n\n正如我们所学的，activity\
  \ 有机会通过运行时系统调用 activity 实现的 `onSaveInstanceState()` 方法来保存动态状态信息。作为该方法的参数，传递进来的是一个\
  \ `Bundle` 对象的引用，该方法需要向该对象中存储任何需要保存的动态数据。随后，运行时系统将代表 activity 保存该 `Bundle` 对象，并在调用\
  \ activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法时，分别将其作为参数传递给这些方法。然后，可以在这些方法内部从\
  \ `Bundle` 对象中检索数据，并使用它们来恢复 activity 的状态。\n\n## 15.2 用户界面状态的默认保存\n\n在上一章中，`StateChange`\
  \ 示例应用程序的诊断输出显示，当运行它的设备发生旋转到足以触发方向变化时，activity 会经历一系列状态变化。\n\n再次启动 `StateChange`\
  \ 应用程序，这次在执行设备旋转之前，在 `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击位于状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中将出现以下状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 activity 被销毁和重建。然而，对运行中应用程序的用户界面进行检查，应该发现输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 activity 已被销毁并重建，且我们没有添加任何特定的代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图控件已经实现了在 activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是，activity\
  \ 中的中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法必须包含对父类相应方法的调用：\n\
  \n```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n可以通过 XML 布局文件通过将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的状态自动保存。为了演示，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在 activity\
  \ 重启时不保存和恢复状态，请比编辑 `activity_main.xml` 文件，使视图的条目如下（注意，可以通过点击 Layout Editor 面板底部的\
  \ Text 标签直接编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n做出更改后，运行应用程序，输入文本并旋转设备，以验证在继续之前文本已不再被保存和恢复。\n\n## 15.3 Bundle\
  \ 类\n\n对于需要保存用户界面视图组件所提供的默认功能之外状态的情况，`Bundle` 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始值的形式，也可以任何实现\
  \ Android `Parcelable` 接口的对象的格式。已经有许多类实现了 `Parcelable` 接口。自定义类可以通过实现 `Parcelable`\
  \ 接口定义的方法集来变为“可序列化的”，这些方法的详情可以在 Android 文档中找到：\n\nhttps://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，用于获取和设置各种数据类型的键值对，包括原始类型和对象（如 `String` 和 `CharSequence`）。\n\n\
  出于本示例的目的，并且在已经禁用了 `EditText` 视图文本自动保存的情况下，我们需要确保用户输入到 `EditText` 字段的文本被保存到 `Bundle`\
  \ 对象中，并在随后进行恢复。这将通过分别使用 `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法演示如何在\
  \ Android 应用程序中手动保存和恢复状态。\n\n## 15.4 保存状态\n\n扩展 `StateChange` 应用程序的第一步是确保用户输入的文本是从\
  \ `MainActivity` activity 的 `onSaveInstanceState()` 方法中的 `EditText` 组件中提取的，然后以键值对的形式保存到\
  \ `Bundle` 对象中。\n\n为了从 `EditText` 对象中提取文本，我们需要在用户界面中识别该对象。显然，这涉及到桥接 activity 的 Java\
  \ 代码（包含在 `MainActivity.java` 源文件中）与用户界面 XML 表示（包含在 `activity_main.xml` 资源文件中）之间的差距。为了提取输入到\
  \ `EditText` 组件的文本，我们需要获取该用户界面对象的访问。\n\n\n\n\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，`Layout\
  \ Editor` 工具会根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则在类型名称后面会跟上顺序数字（尽管开发者可以、也应该将其更改为更具意义的内容）。通过在\
  \ Android Studio 主窗口中选定 `activity_main.xml` 文件并显示 `Layout Editor` 工具时，检查 `Component\
  \ Tree` 面板可以看到，`EditText` 组件被分配了 `id` `editText`：\n\n![](img/as_4.1_state_change_component_tree.jpg)\n\
  \n图 15-1\n\n现在，我们可以通过对象的 `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来会返回当前文本：\n\n\
  ```\nCharSequence userText = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle`\
  \ 对象的 `putCharSequence()` 方法保存文本，在调用时传递键（该键可以是任何字符串值，但在本例中，我们将其声明为“savedText”）和\
  \ `userText` 对象作为参数：\n\n```\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将以上内容整合在一起，我们在 `MainActivity.java` 文件中得到了一个修改后的 `onSaveInstanceState()` 方法，内容如下：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\n.\n\n.\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n.\n\n.\n\n.\n\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n.\n.\n```\n\n\
  既然已经采取了保存状态的步骤，下一步是确保在需要时恢复它。\n\n### 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择使用\
  \ `onCreate()` 或 `onRestoreInstanceState()`。使用哪种方法取决于 的性质。在执行完活动初始化任务后最适合恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更为合适。为了本示例的目的，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后，我们可以使用对象的对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText =\n               savedInstanceState.getCharSequence(\"\
  savedText\");\n    binding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\
  \n剩下的工作就是再次构建并运行 `StateChange` 应用程序。运行并处于前台时，触摸 `EditText` 组件并输入一些文本，然后在将设备旋转到另一种方向之前进行操作。虽然之前的文本更改会丢失，但得益于我们在本章中为活动添加的代码，新文本将保留在\
  \ `editText` 组件中。\n\n在验证代码按预期执行后，请注释掉这两个方法中的 `super.onSaveInstanceState()` 和 `super.onRestoreInstanceState()`\
  \ 调用，重新启动应用，并注意在设备旋转后文本仍然保留。默认的保存和恢复系统本质上被自定义实现所取代，从而提供了一种在活动内动态且选择地保存和恢复状态的方法。\n\
  \n### 15.7 总结\n\n在 Android 应用程序中保存和恢复动态状态只需在相应的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由 `Activity`\
  \ 超类自动处理。在其他情况下，通常涉及在 `onSaveInstanceState()` 方法中提取值和设置，并将数据以键值对的形式保存在运行时系统传递给活动的\
  \ `Bundle` 对象中。\n\n可以通过在活动的 `onCreate()` 或 `onRestoreInstanceState()` 方法中从 `Bundle`\
  \ 对象中提取值并根据存储的值更新活动，从而恢复状态。\n\n在本章中，我们使用了这些技术来更新 `StateChange` 项目，使 `Activity` 能够在活动销毁及随后的重建过程中保留更改。\n\
  \n# 16. 理解 Android 视图、视图组和布局\n\n除了可能收听流媒体音频外，用户与 Android 设备的交互本质上主要是视觉和触觉的。所有这些交互都通过设备上安装的应用程序的用户界面进行，包括内置应用程序和用户安装的任何第三方应用程序。因此，开发\
  \ Android 应用程序的关键要素涉及用户界面的设计和创建，这并不意外。\n\n在本章中，将涵盖 Android 用户界面结构的主题，并概述组成用户界面的不同元素；即\
  \ `Views`（视图）、`View Groups`（视图组）和 `Layouts`（布局）。\n\n### 16.1 为不同的 Android 设备设计\n\
  \n“Android 设备”一词涵盖了大量具有不同尺寸和分辨率的平板电脑和智能手机产品。因此，应用程序用户界面现在必须仔细设计，以确保尽可能广泛的设备上正确显示。其关键部分是确保用户界面布局能够正确调整大小。这在很大程度上可以通过仔细的规划和使用布局管理器来实现。\n\
  \n同样重要的是，大多数 Android 智能手机和平板电脑可以在竖屏和横屏模式下持有。良好的用户界面应该能够适应变化并在每个方向下做出合理的布局调整。\n\n\
  ### 16.2 视图与视图组\n\n用户界面中的所有项都是 `View` 类的类（具体来说是 `android.view.View`）。Android SDK\
  \ 提供了一系列预构建视图，用于构建用户界面。典型示例包括 `Button`、`CheckBox`、`ProgressBar` 和 `TextView` 类。此类视图也被称为控件或组件。对于\
  \ SDK 提供的控件无法满足的需求，可以通过扩展现有类，或者直接在 `View` 类之上构建全新的组件来创建新视图。\n\n视图也可以由多个其他视图组成（其他称为复合视图）。此类视图派自\
  \ Android `ViewGroup` 类（`android.view.ViewGroup`），该类本身也是 `View` 的子类。此类视图的一个示例是 `RadioGroup`，旨在包含多个\
  \ `RadioButton` 对象，使得在任何时间只有一个处于“开启”状态。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\n###\
  \ 16.3 Android 布局管理器\n\n上一节讨论的控件式视图外，SDK 还包含一组被称为布局的视图。布局是容器视图（因此派自 `ViewGroup`），其唯一设计目的是控制子视图在屏幕上的位置。\n\
  \n\n\n\n\nAndroid SDK 包含了以下布局视图，这些视图可以用于 Android 用户界面的设计：\n\n- `ConstraintLayout`\
  \ – 引入自 Android 7 引入，建议对于大多数布局需求使用此布局管理器。`ConstraintLayout` 允许通过为每个子视图分配简单的约束设置，来定义布局中视图的位置和行为。该布局的灵活性允许快速快捷地创建复杂布局，而无需在其他布局类型内部进行层嵌套，从而提高了布局性能。`ConstraintLayout`\
  \ 还紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，它是书中大多数示例的优选布局。\n\n- `LinearLayout` – 根据选择的方向（orientation）将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该视图相对于其他子视图占据布局空间的比例。\n\
  \n- `TableLayout` – 将子视图以行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子视图表示，该子视图又包含每个单元格的视图对象。\n\
  \n- `FrameLayout` – `FrameLayout` 的目的是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将堆叠显示，并位于布局区域的左上角。可以通过设置每个子视图的重力（gravity）值来实现各个单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值使其位于容器 `FrameLayout` 视图的垂直中心位置。\n\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许通过在子视图上指定对齐方式和边距（margins），使子视图相对于彼此以及相对于容器布局视图进行定位。例如，可以将子视图 A 配置为位于容器 `RelativeLayout`\
  \ 视图的垂直和水平中心点。另一方面，视图 B 也可以被配置为在布局视图中水平居中，但位于视图 A 顶部上方 30 像素处，从而产生相对于视图 A 的垂直位置。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout`\
  \ 管理器可能特别有用。\n\n- `AbsoluteLayout` – 允许将子视图放置在容器布局视图内特定的 X 和 Y 坐标上。不建议使用此布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\
  \n- `GridLayout` – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直覆盖多个单元格，从而允许快速快捷地实现广泛的布局选项。`GridLayout`\
  \ 组件之间的间隔可以通过在相邻单元格中放置名为 `Space` 的特殊类型视图来实现，也可以通过设置边距（margin）参数来实现。\n\n- `CoordinatorLayout`\
  \ – 作为 Android 5.0 的 Android 设计支持库的一部分引入，`CoordinatorLayout` 专门用于协调应用程序屏幕顶部应用栏（app\
  \ bar）与其他视图元素的显示和行为。当使用 Basic Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将从标题为 “使用浮动操作按钮和 Snackbar” 的章节开始进行更详细的介绍。\n\n在考虑在 Android 应用程序的用户界面中使用布局时，值得记住，正如下一节将概述的，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n### 16.4 视图层级\n\n用户界面中的每个视图都代表显示器上的矩形区域。视图负责在该矩形内绘制的内容，并对响应发生在屏幕该区域的事件（例如触摸事件）。\n\
  \n用户界面屏幕由一个视图层级组成，根视图位于树的顶部，子视图位于下方的分支。容器视图的子视图显示在其父视图之上，并被限制在父视图显示区域的边界内。例如，考虑\
  \ 图 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上包含了许多布局视图，这些视图控制着可见视图的位置。图\
  \ 16-2 显示了用户界面的另一种视图，这次突出了布局视图与子视图之间的关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\n\
  正如之前讨论的，用户界面是以视图层级的形式构建的，顶部有一个根视图。由于是如此，我们也可以以 图 16-3 所示的视图树的形式来可视化上述用户界面示例：\n\n\
  ![](img/Image2815.jpg)\n\n图 16-3\n\n视图层级图可能提供了对 图 16-1 所示的用户界面中各种视图之间关系的最清晰概述。当用户界面显示给用户时，Android\
  \ 运行时会遍历视图层级，从根视图开始沿树向下移动，并渲染每个视图。\n\n### 16.5 创建用户界面\n\n在对视图、布局和视图层级概念有更清晰的理解后，接几章将重点关注创建\
  \ Android 活动界面的步骤。\n\n### 16.6 总结\n\nAndroid 应用程序用户界面中的每个视图都代表显示器上的矩形区域。视图负责该矩形内显示的内容，并负责处理在该边界内发生的事件。多个视图可以组合在一起创建一个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（该类本身也是 `android.view.View` 的子类）。用户界面是由视图层级形式构建的视图组成的。\n\
  \nAndroid SDK 提供了一系列预构建的视图可用于创建用户界面。这些包括文本字段和按钮等基本组件，还包括一系列用于控制子视图位置的布局管理器。如果提供的视图无法满足特定需求，可以创建自定义视图，方法可以是扩展或组合现有视图，或者通过子类\
  \ `android.view.View` 创建一个全新的视图类。\n\n\n\n\n\n很难想象出一个不需要某种形式用户界面的 Android 应用程序概念。大多数\
  \ Android 设备都配备了触摸屏和键盘（虚拟或物理键盘），点击和滑动是用户与应用程序之间交互的主要形式。这些交互无一不通过应用程序的用户界面进行。\n\n\
  一个设计且实现良好的用户界面是创建一个成功且受欢迎的 Android 应用程序的重要因素，根据单个应用程序的设计需求，它可以从简单到极其复杂不等。无论复杂程度如何，`Android\
  \ Studio Layout Editor` 工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础活动（Basic Activity）与空活动（Empty\
  \ Activity）模板\n\n正如标题为“Android 应用程序剖析章节中所述，Android 应用程序由一个或多个活动（activity）组成。活动是应用程序功能的一个独立模块，通常直接对应于单个用户界面屏幕。因此，在使用\
  \ `Android Studio Layout Editor` 时，我们始终是在为某个活动编写布局方案。\n\n在创建新的 `Android Studio`\
  \ 项目时，可以使用许多不同的模板作为主 Activity 用户界面的起点。这些模板中最基础的是 `Basic Activity` 和 `Empty Activity`\
  \ 模板。尽管它们初看之下非常相似，但这两个选项之间实际上存在显著差异。要在布局编辑器中查看这些差异，请使用 `View Options` 菜单启用 `Show\
  \ System UI`，如下方的图 17-1 所示：\n\n![](img/as_4.1_layout_editor_system_ui.jpg)\n图 17-1\n\
  \n`Empty Activity` 模板创建一个单一的布局文件，该文件包含一个 `ConstraintLayout` 管理器实例，其中包含一个 `TextView`\
  \ 对象，如图 17-2 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n图 17-2\n\n另一方面，`Basic\
  \ Activity` 模板由多个布局文件组成。顶层布局文件具有 `CoordinatorLayout` 作为根视图、一个可配置的应用程序栏（也称为 action\
  \ bar），它显示在设备屏幕的顶部（在图 17-3 中标记为 A），以及一个悬浮按钮（标记为 B 的邮件按钮）。除了这些项目外，`activity_main.xml`\
  \ 布局文件还引用名为 `content_main.xml` 的第二个文件，该文件包含内容布局（标记为 C）：\n\n![](img/as_4.1_basic_activity_ui.jpg)\n\
  图 17-3\n\n`Basic Activity` 包含两个屏幕的布局，两者都包含一个按钮和一个文本视图。该模板的目的是演示如何在应用内的多个屏幕之间实现导航。如果运行一个使用\
  \ `Basic Activity` 模板且未修改的应用程序，将出现这两个屏幕中的第一个（在图 17-4 中标记为 A）。点击 `Next` 按钮将导航到第二个屏幕\
  \ (B)，而第二个屏幕反过来又包含一个返回到第一个屏幕的按钮：\n\n![](img/as_4.1_layout_editor_basic_navigation.jpg)\n\
  图 17-4\n\n此应用程序行为使用了两个 Android 特性，即 `fragments`（片段）和 `navigation`（导航），这两个特性将分别从标题为\
  \ Android Fragment 简介和导航 架构组件概览的章节开始介绍。\n\n`content_main.xml` 文件包含一个名为 `Navigation\
  \ Host Fragment`（导航主机片段）的特殊片段，允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置在视图中切换不同的内容。在\
  \ `Basic Activity` 模板的情况下，`nav_graph.xml` 文件被配置为根据用户选择的 `Next` 和 `Previous` 按钮，在\
  \ `fragment_first.xml` 和 `fragment_second.xml` 文件中定义的用户界面布局之间进行切换。\n\n显然，如果你在活动中既不需要悬浮按钮也不需要菜单，不需要\
  \ `CoordinatorLayout` 提供的特殊应用程序栏行为（例如在某些滚动操作期间使应用程序栏和工具栏折叠的选项，该主题在标题为“使用 AppBar\
  \ 和折叠工具栏布局”的章节中涵盖过），那么 `Empty Activity` 模板是有用的。然而，`Basic Activity` 的用处在于它默认提供了这些元素。事实上，使用\
  \ `Basic Activity` 模板创建一个新活动并删除你不需要的元素，通常比使用 `Empty Activity` 模板并手动实现折叠工具栏、菜单或悬浮按钮等行为要快得多。\n\
  \n由于本书中的并非所有示例都需要 `Basic Activity` 模板的功能，因此本章中的大多数示例将使用 `Empty Activity` 模板，除非示例需要\
  \ `Basic Activity` 模板提供的某项或某些功能。\n\n为了日后参考，如果你需要菜单但不需要悬浮按钮，请使用 `Basic Activity`\
  \ 并按照以下步骤删除悬浮按钮：\n\n1. 在 `Project` 工具窗口的 `app -> res -> layout` 下，双击主 `activity_main.xml`\
  \ 布局文件，以将其加载到 `Layout Editor` 中。当布局加载到 `Layout Editor` 工具中后，选择悬浮按钮并按下键盘上的 `Delete`\
  \ 键将其从布局中移除。\n\n\n\n\n\n### 4.\n最后一个任务是从 `FirstFragment` 类中移除一些代码，以便 `Button` 视图在点击时不再导航到现已不存在的第二个碎片（fragment）。找到\
  \ `FirstFragment.java` 文件，双击它将其加载到编辑器，并删除 `onViewCreated()` 方法中的代码，使其内容如下所示：\n\n\
  ```java\npublic void onViewCreated(@NonNull View view, Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \                   .navigate(R.id.action_FirstFragment_to_SecondFragment);\n  \
  \      }\n    });\n}\n```\n\n## 17.2 Android Studio 布局编辑器\n\n正如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，你可以从调色板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图被放置在画布上，就可以对其进行移动、删除和调整大小（受限于父视图的约束）。此外，可以使用属性（Attributes）工具窗口修改与所选视图相关的各种属性。\n\
  \n在底层，布局编辑器工具实际上会构建一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行，称为设计（Design）、代码（Code）和拆（Split）模式。\n\
  \n## 17.3 设计模式\n\n在设计模式下，可以通过直接操作视图调色板和布局的图形表示来视觉化操作用户界面。图 17-5 展示了 Android Studio\
  \ 布局编辑器工具在设计模式下的关键区域：\n\n![](img/as_4.2_layout_editor_labelled.jpg)\n\n图 17-5\n\n\
  **A – 调色板 (Palette)** – 调色板提供了对 Android 提供的系列视图组件的访问。这些组件按类别分组，以便导航。可以通过从调色板中拖拽视图组件并将其掉到布局上所需的位置来向布局中添加项。\n\
  \n**B – 设备屏幕 (Device Screen)** – 设备屏幕提供了正在设计的用户界面布局的可视化“所见即所得”表示。该布局允许对设计进行直接操作，允许对视图进行选择、删除、移动和调整大小。可以使用工具栏上的菜单随时更改布局所代表的设备模型。\n\
  \n**C – 组件树 (Component Tree)** – 正如上一节（理解 Android 视图、视图组和布局）所述，用户界面是使用分级结构构建的。组件树提供了用户界面设计层级的视觉概览。从组件树中选择元素将导致布局中相应的视图被选中。同样，从设备屏幕布局中选择视图将选中组件树层级结构中的该视图。\n\
  \n**D – 属性 (Attributes)** – 调色板中列出的所有组件视图都有一组关联的属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，从而进行更改。\n\
  \n**E – 工具栏 (Toolbar)** – 布局编辑器工具栏提供了各种选项的快速访问，包括但不限于放大和缩小设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局中选择相关视图类型时，这些按钮将会出现。\n\n**F – 模式切换控制\
  \ (Mode Switching Controls)** – 这三个按钮提供了用于布局编辑器工具的设计、代码和拆模式之间切换的方法。\n\n**G - 缩放和平移控制\
  \ (Zoom and Pan Controls)** - 此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动以寻找放大时被遮挡的区域。\n\n##\
  \ 17.4 调色板\n\n布局编辑器调色板组织为两个面板，旨在方便查找和预览要添加到布局设计中的视图组件。类别面板（在图 17-6 中标记为 A）列出了 Android\
  \ SDK 支持的不同视图组件类别。当从列表中选择一个类别时，第二个面板 (B) 将更新并显示属于该类别的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要将组件从调色板添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置并放到位即可。\n\n可以通过点击调色板工具栏中的搜索按钮（在图\
  \ 17-6 上方标记为 C）并输入组件名称，在当前选择的类别内启动特定组件的搜索。随着字符的输入，匹配的结果将实时在组件列表中显示。如果你不确定组件所在的类别，只需在搜索之前或搜索期间选择“全部（All）”类别即可。\n\
  \n## 17.5 设计模式与布局视图\n\n默认情况下，布局编辑器将以设计模式出现，如上文图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击图\
  \ 17-7 所示的切换控件随时选择设计模式：\n\n![](img/as_4.0_layout_editor_button.jpg)\n\n图 17-7\n\n\
  当布局编辑器处于设计模式时，可以通过两种不同的方式查看布局。上文图 17-5 所示的是设计视图，它显示了布局在运行的应用程序中的外观。另一种被称为蓝图（Blueprint）的模式可以替换设计视图，也可以与设计视图同时显示。图\
  \ 17-8 所示的工具栏菜单提供了显示设计、蓝图或视图的选项。还有调整色盲的设置。\n\n![](img/as_blueprint_menu.jpg)\n\n\
  图 17-8\n\n显示布局视图、设计视图或两者取决于个人喜好。一种好的方法是同时显示两者，如图 17-9 所示：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  \n图 17-9\n\n## 17.6 夜间模式\n\n要在设计期间以夜间模式查看布局，请选择下方图 17-10 所示菜单并将设置更改为“夜间（Night）”：\n\
  \n![](img/as_4.2_layout_editor_night_menu.jpg)\n\n图 17-10\n\n## 17.7 代码模式\n\n在使用\
  \ Android Studio 布局编辑器工具时，重要的是记住它实际上只是为创建 XML 布局资源文件提供了一种易于操作的方法。在设计过程的任何时候，只需点击布局编辑器工具面板右上角的“代码（Code）”按钮，即可查看并直接编辑底层\
  \ XML，如图 17-11 所示：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\n图 17-11\n\
  \n\n\n\n\n图 17-12 显示了代码模式下的 Android Studio 布局编辑器工具，允许通过修改 XML 来更改用户界面声明：\n\n![](img/as_3.6_layout_editor_code_mode.jpg)\n\
  ```\n\n图 17-12\n\n## 17.8 分屏模式 (Split Mode)\n\n在分屏模式下，编辑器并排显示 `Design`（设计）和 `Code`（代码）视图，允许通过设计画布可视化地修改用户界面，也可以直接修改\
  \ XML 声明。要进入分屏模式，点击下方 图 17-13 所示的中间按钮：\n\n```![](img/as_4.1_layout_split_button.jpg)\n\
  ```\n\n图 17-13\n\n对 XML 的任何更改都会自动反映在设计画布上，反亦然。图 17-14 显示了分屏模式下的编辑器：\n\n```![](img/as_4.1_layout_split_mode.jpg)\n\
  ```\n\n图 17-14\n\n## 17.9 设置属性 (Attributes)\n\n`Attributes`（属性）面板提供了当前选中组件的所有可用设置。例如，图\
  \ 17-15 显示了 `TextView` 控件的属性：\n\n```![](img/as_4.1_layout_attributes.jpg)\n```\n\
  \n图 17-15\n\n`Attributes` 工具窗口被分为以下不同部分：\n\n- `id` - 包含 `id` 属性，定义了在应用源代码中引用当前选中对象的名称。\n\
  - `Declared Attributes`（已声明属性） - 包含所有已分配数值的属性。\n- `Layout`（布局） - 定义当前选中视图对象相对于屏幕以及布局中其他对象的定位和大小的设置。\n\
  - `Transforms`（变换） - 包含允许当前选中对象进行旋转、缩放和偏移（相对于当前位置的偏移）的控件。\n- `Common Attributes`（常用属性）\
  \ - 当前所选视图对象类通常需要更改的属性列表。\n- `All Attributes`（所有属性） - 当前选中对象所有可用属性的完整列表。\n\n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用可以使用 `Resources`（资源）对话框来帮助选择合适的属性值。要显示该对话框，只需点击该按钮。此按钮的外观会变化，取决于相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的 图 17-16 所示：\n\n```![](img/as_3.4_resource_extracted.jpg)\n\
  ```\n\n图 17-16\n\n对于具有有限有效选项的属性，将呈现一个下拉菜单（图 17-17），可以从中进行选择。\n\n```![](img/as_4.0_type_face_menu.jpg)\n\
  ```\n\n图 17-17\n\n可以点击滴管图标（如上方 图 17-16 中 `backgroundTint` 字段所示）来显示颜色选择调板。同样，当此位置出现旗帜图标时，点击它可以显示该属性的可用列表，而图像图标会打开资源管理器面板，允许为该属性选择图像和其他资源类型。\n\
  \n## 17.10 变换 (Transforms)\n\n`Attributes` 工具窗口内的 `transforms` 面板（图 17-18）提供了一系列控件和属性，用于控制当前选中对象在旋转、透明度（用于视图的淡入和淡出）、缩放（大小）和平移（相对于当前位置的偏移）方面的视觉效果：\n\
  \n```![](img/as_4.1_layout_editor_transforms.jpg)\n```\n\n图 17-18\n\n该面板包含视图的视觉表示，该表示随属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n## 17.11 工具可见性切换 (Tools Visibility Toggles)\n\n当在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性都以\
  \ `android:` 前缀开头。这表示这些属性是在 `android` 命名空间内设置的，并在应用运行时生效。例如，来自布局文件的以下摘录在 `Button`\
  \ 视图上设置了多种属性：\n\n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  Button\"\n```\n\n除了 `android` 命名空间外，Android Studio 还提供了 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器预览中生效。在设计布局时，例如，你可能发现\
  \ `EditText` 视图显示某些文本很有帮助，但要求视图在运行时保持为空。你可以使用 `tools` 命名空间如下设置：\n\n```xml\n<EditText\n\
  \    android:id=\"@+id/editTextName\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\n    android:inputType=\"\
  text\"\n    tools:text=\"Sample Text\"\n```\n\n这种工具属性在 `Attributes` 工具窗口中通过扳手图标进行设置，如下方的\
  \ 图 17-19 所示：\n\n```![](img/as_4.1_text_tools.jpg)\n```\n\n图 17-19\n\n工具属性在设计过程中更改视图的可见性时特别有用。布局可能包含一个在运行时根据用户操作显示或隐藏的视图。为了模拟隐藏视图，可以向视图添加以下工具属性：\n\
  \n```xml\ntools:visibility=\"invisible\"\n```\n\n使用 `invisible` 设置时，尽管视图不再可见，但它仍然存在于布局中并占据原来的空间。要让布局表现得视图不存在一样，应将可见性属性设置为\
  \ `gone`：\n\n```xml\ntools:visibility=\"gone\"\n```\n\n在上面的示例中，可见性设置仅适用于布局编辑器，对运行的应用没有影响。要在布局编辑器和运行的应用中控制可见性，应使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑\
  \ XML 布局文件是一个复杂的过程。为了方便更改这些设置，Android Studio 在布局编辑器组件树面板中提供了一组切换。要访问这些控件，点击面板中对应视图右侧的边缘。例如，图\
  \ 17-20 显示了名为 `myButton` 的 `Button` 视图的工具可见性控件：\n\n```![](img/as_4.2_layout_tools_visibility.jpg)\n\
  ```\n\n图 17-20\n\n这些切换控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `unset`、`visible`、`invisible`\
  \ 和 `gone` 选项。当设置冲突的属性时（例如 `android` 命名空间切换设置为 `visible`，而 `tools` 值为 `invisible`），`tools`\
  \ 命名空间在布局预览中具有优先级。当做出切换选择时，Android Studio 会自动为布局文件中的 XML 元素添加相应的属性。\n\n除了组件树面板中的可见性切换外，布局编辑器还包含工具可见性和位置切换按钮，如下方高亮的\
  \ 图 17-21 所示：\n\n```![](img/as_4.1_layout_editor_tools_toggle.jpg)\n```\n\n图 17-21\n\
  \n\n\n\n\n此按钮用于切换当前工具的可见性设置。例如，如果上方显示的 `Button` 视图当前的工具可见性属性被设置为 `gone`，则切换此按钮将使其变为可见。这使得在视图添加到布局或从布局中移除时，能够方便地检查布局行为。此切换功能对于检查布局中的视图是否正确约束也非常有用，该主题将在题为“在\
  \ Android Studio 中使用 ConstraintLayout 指南的章节中进行介绍。\n\n## 17.12 转换视图\n\n将布局中的视图从一种类型更改为另一种类型（例如将\
  \ `TextView` 转换为 `EditText`）可以在 Android Studio 布局编辑器中轻松实现，只需在屏幕布局内或 `Component tree`（组件树）窗口中对视图点击右键，，并选择\
  \ `Convert view...`（转换视图...）菜单选项（见图 17-22）：\n\n![](img/as_layout_convert_view.jpg)\n\
  \n图 17-22\n\n选中后，将弹出一个对话框，其中包含兼容的视图类型列表，选中的对象可以转换为这些类型。例如，图 17-23 显示了现有 `TextView`\
  \ 视图可以转换的类型：\n\n![](img/as_3.2_convert_layout_textview.jpg)\n\n图 17-23\n\n此技术也适用于将布局从一种类型转换为另一种类型（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 17.13 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，可能会出现这样的情况：用户界面中要显示的内容在应用完成并运行之前是不可用的。这有时会导致很难从布局编辑器内部评估布局在应用运行时外观。为了解决这个问题，布局编辑器允许指定示例数据，用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在应用运行时不会显示。可以通过直接编辑布局的\
  \ `XML`，或者通过视觉方式使用设计时助手（在设计区域的小部件上点击右键并选择 `Set Sample Data`（设置示例数据）菜单选项）来配置示例数据。设计时助手面板将为所选视图项显示一组预配置的示例数据选项，包括各种配置下文本和图像的组合。例如，图\
  \ 17-24 显示了在选择在 `RecyclerView` 列表中显示示例数据时显示的示例数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在随后的题为“布局编辑器示例数据教程的章节中。由于示例数据是作为\
  \ `tools` 属性实现的，因此预览中内数据的可见性可以使用上文图 17-21 中高亮显示的切换按钮进行控制。\n\n## 17.14 创建自定义设备定义\n\
  \n布局编辑器工具栏中的设备菜单（见图 17-25）提供了一个预配置的设备类型列表，选中后它们将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android\
  \ Studio 环境中配置过的任何 `AVD` 实例也会列在列表中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项，并按照题为“在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)的章节概述的步骤进行。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n## 17.15 更改当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单中选择 `Custom`（自定义）选项，点击设备屏幕右下角的缩放句柄（见图\
  \ 17-26）并拖动以选择另一种设备显示格式。随着屏幕调整大小，将出现标记指示可选的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n## 17.16 布局验证（多预览）\n\n布局验证（也称为多预览）选项允许用户界面布局在多个 Pixel 尺寸的屏幕上同时进行预览。要访问多预览，点击\
  \ Android Studio 主窗口右上角附近的标签页，如图 17-27 所示：\n\n![](img/as_4.0_layout_validation_tab.jpg)\n\
  \n图 17-27\n\n一旦加载，该面板将如图 17-28 所示显示，在多个设备屏幕配置上渲染布局：\n\n![](img/as_layout_validation.jpg)\n\
  \n图 17-28\n\n## 17.17 总结\n\n开发 Android 应用的关键部分涉及创建用户界面。在 Android Studio 环境中，这是通过布局编辑器工具完成的，该工具有三种模式。在设计（Design）模式下，从调板中选择组件并放置在代表\
  \ Android 设备的布局上，使用属性列表进行配置。在代码（Code）模式下，可以直接编辑表示用户界面的 `XML`。另一方面，拆分（Split）模式允许通过视觉方式和直接编辑\
  \ XML 来创建布局。这些模式结合提供了一个广泛且直观的用户界面设计环境。\n\n布局验证面板允许在各种设备尺寸上快速预览用户界面布局。\n\n# 18. ConstraintLayout\
  \ 使用指南\n\n正如题为“理解视图、分组和布局”的章节所示，Android 提供了多种布局管理器用于设计用户界面。从 Android 7 开始，Google\
  \ 引入了一种布局，旨在解决旧布局管理器的缺点。这种名为 `ConstraintLayout` 的新布局将简单、灵活且灵活的布局系统与 Android Studio\
  \ 布局编辑器中强大的功能相结合，以便创建能够适应不同屏幕尺寸和方向变化的响应式用户界面布局。\n\n本章将概述 `ConstraintLayout` 的基本概念，下一章将详细介绍如何在\
  \ Android Studio 布局编辑器中使用 `ConstraintLayout` 创建基于约束的布局。\n\n## 18.1 ConstraintLayout\
  \ 如何工作\n\n与其他所有布局一样，`ConstraintLayout` 负责管理它包含的视觉组件（也称为小部件）的定位和尺寸行为。它是根据设置在每个小部件上的约束连接来执行此操作的。\n\
  \n为了充分理解并使用 `ConstraintLayout`，理解以下关键概念至关重要：\n\n•Constraints（约束）\n\n•Margins（边距）\n\
  \n•Opposing Constraints（对向约束）\n\n•Constraint Bias（约束偏移）\n\n•Chains（链）\n\n•Chain\
  \ Styles（链样式）\n\n•Guidelines（辅助线）\n\n•Groups（组）\n\n•Barriers（障壁）\n\n•Flow（流式）\n\n\
  ### 18.1.1 Constraints（约束）\n\n\n\n\n\n约束（Constraints）本质上是一组规则，规定了组件相对于其他组件、容器 `ConstraintLayout`\
  \ 边界以及称为指南线（guidelines）的特殊元素的对齐和间距方式。约束还决定了 Activity 的界面布局如何响应设备方向的变化，或者在不同屏幕尺寸的设备上显示时的响应。为了充分配置，组件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和平垂直平面上都解析其位置。\n\n### 18.1.2 外边距 (Margins)\n\n外边距（margin）是一种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右侧边缘的外边距约束来实现，并将其连接到父级 `ConstraintLayout` 对应的边，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，每个约束连接都关联有一个外边距值，该值规定了组件距离父布局两侧的固定距离。在这种配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接指定的，分别距离父级 `ConstraintLayout` 的顶部和右侧边缘 20 和 15 个设备无关像素 (dp)。\n\n\
  虽然上述配置在某些情况下是可以接受的，但它并没有让 `ConstraintLayout` 布局引擎调整组件位置以响应设备旋转并支持不同尺寸屏幕。为了向布局中添加这种响应性，必须实现对立约束（opposing\
  \ constraints）。\n\n### 18.1.3 对立约束 (Opposing Constraints)\n\n在单个组件上沿同一轴运行的两个约束被称为对立约束。换句话说，左侧和右侧都有约束的组件被认为具有水平对立约束。例如，图\
  \ 18-2 展示了在之前的布局中同时添加水平和垂直对立约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对立约束，组件的定位将基于百分比而不是坐标。例如，组件不再是固定在距离布局顶部\
  \ 20dp 处，而是被放置在布局顶部 30% 的位置。在不同的方向上以及在更大或更小的屏幕上运行时，`Button` 将始终相对于父布局尺寸处于相同的位置。\n\
  \n现在重要的是要理解，图 18-2 中概述的布局不仅是通过对立约束实现的，还通过应用约束偏置（constraint bias）实现的。\n\n### 18.1.4\
  \ 约束偏置 (Constraint Bias)\n\n现在已经确定 `ConstraintLayout` 中的组件可能会受到对立约束连接。默认情况下，对立约束是相等的，导致相应的组件在对立轴上居中。例如，图\
  \ 18-3 显示了一个使用对立的水平和垂直约束在容器 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在存在对立约束的情况下调整组件位置，`ConstraintLayout` 实现了一个名为约束偏置（constraint bias）的功能。约束偏置允许组件沿对立轴的定位向某一约束偏移指定的百分比。例如，图\
  \ 18-4 显示了之前的约束布局，具有 75% 的水平偏置和 10% 的垂直偏置：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\
  \n下一章标题为《在 Android Studio 中使用 ConstraintLayout 的指南，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android\
  \ Studio 布局编辑器工具中的。然而，还需要涵盖 `ConstraintLayout` 类的另外几个领域。\n\n### 18.1.5 链 (Chains)\n\
  \n`ConstraintLayout` 链（chains）为将两个或多个组件的布局行为定义为一个组提供了一种。链可以在垂直或水平轴上声明，并配置为定义链中组件的间距和大小。\n\
  \n当组件通过双向约束相互连接在一起时，它们就成了链。例如，图 18-5 展示了三个这样链在一起的组件：\n\n![](img/Image24681.jpg)\n\
  \n图 18-5\n\n链中的第一个元素是链头（chain head），在垂直链中对应顶部的组件，或者在水平链中对应左侧的组件。整个链的布局行为主要通过在链头组件上设置属性来配置。\n\
  \n### 18.1.6 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为由应用于链头组件的链样式（chain style）设置决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n-   **散布链 (Spread Chain)** – 链中的组件均匀分布在可用空间上。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\
  \n图 18-6\n\n-   **内部散布链 (Spread Inside Chain)** – 链中的组件在链头和链的最后一个组件之间均匀分布。链头和最后一个不包含在间距内。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n-   **权重链 (Weighted Chain)** – 允许通过权重属性定义链中每个组件占据。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n-   **压缩链 (Packed Chain)** – 组成链的组件聚集在一起没有任何间距。可以使用偏置来控制链相对于父元素的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n## 18.2 基线对齐 (Baseline Alignment)\n\n到为止，本章仅提到了相对于组件侧边的约束（通常称为侧边约束）。然而，一种常见的需求是组件相对于其显示的内容对齐，而不是组件本身。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐。\n\n例如，假设之前的图 18-1 需要一个 `TextView` 组件放置在 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 基线对齐。这意味着 `Button` 的文本需要与 `TextView` 内的文本垂直对齐。此布局的额外约束需要如图 18-10\
  \ 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button` 的基线垂直对齐，并在水平上距离\
  \ `Button` 对象左边缘 40dp。\n\n## 18.3 配置组件尺寸 (Configuring Widget Dimensions)\n\n控制组件的尺寸是界面设计过程中的关键要素。`ConstraintLayout`\
  \ 提供了可以在单个组件上设置的选项来管理尺寸行为。这些设置为高度和宽度维度单独配置：\n\n-   **固定 (Fixed)** – 组件固定到指定的尺寸。\n\
  \n\n\n\n\n- 约束（Constraints）\n\n- `Match Constraint` – 允许布局引擎调整组件的大小以满足现有的约束。它也被称为\
  \ `AnySize` 或 `MATCH_CONSTRAINT` 选项。\n- `Wrap Content` – 组件的大小由其包含的内容（即文本或图形）决定。\n\
  \n## 18.4 引导线辅助（Guideline Helper）\n\n引导线（Guidelines）是 `ConstraintLayout` 中可用的特殊元素，为约束的连接提供额外的目标。在\
  \ `ConstraintLayout` 实例中可以添加多个引导线，这些引导线可以被配置为水平或垂直方向。一旦添加，就可以从布局中的组件到引导线建立约束连接。这在多个组件需要沿某个轴线对齐时特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿着一条垂直引导线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n## 18.5 组辅助（Group Helper）\n\n`ConstraintLayout` 的这一功能允许将组件放入逻辑组中，并作为一个单一实体控制这些组件的可见性。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改组实例的可见性属性（`visible`、`invisible` 或 `gone`）将应用到所有组内成员。这使得通过更改单个属性就能轻松隐藏和显示多个组件。单个布局可以包含多个组，一个组件也可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后声明的组具有优先权。\n\n## 18.6 屏障辅助（Barrier Helper）\n\n与引导线类似，屏障（Barriers）是可用于约束布局内视图的虚拟视图。与引导线一样，屏障可以是垂直或水平的，并且一个或多个视图可以被约束在上面（为了避免混淆，这些将被称为受约束视图）。然而，与引导线在布局中保持固定位置不同，屏障的位置是由一组所谓的参考视图（reference\
  \ views）定义的。引入屏障是为了解决经常涉及的视图重叠问题。例如，考虑下方的图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n上述布局需要注意的关键点是 `View 3` 的宽度设置为匹配约束模式，且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现，增加\
  \ `View 1` 的宽度将产生缩小 `View 3` 宽度的预期效果：\n\n![](img/Image25331.jpg)\n\n图 18-13\n\n\
  但是，如果增加的是 `View 2` 的宽度而不是 `View 1`，就会出现问题：\n\n![](img/Image25401.jpg)\n\n图 18-14\n\
  \n显然，由于 `View 3` 只受 `View 1` 约束，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\n解决这个问题的方法是添加一个垂直屏障并将\
  \ `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个视图中最宽的一个，从而导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n## 18.7\
  \ 流辅助（Flow Helper）\n\n`ConstraintLayout Flow` 辅助允许视图组以流式网格样式布局进行显示。与 `Group` 辅助一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大组件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括散布（spread）、内部散布（spread inside）和打包（packed）选项。\n\n图 18-16 表示了使用 `Flow`\
  \ 辅助实例在水平模式且无换行设置的情况下定位的五个大小相同的按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\
  \n图 18-17 显示了相同的按钮在水平流配置中，并将换行设置为每第三个组件后换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了将换行设置为使用“内部散布”的链模式的按钮（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap`（间隙）属性，以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\
  \n作为对 `Flow` 辅助灵活性的最后的演示，图 18-19 显示了五个大小不一的按钮，配置为水平打包模式，并每三个组件换行。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0`，网格内容已右对齐（`0.0` 将导致左对齐，而 `0.5` 将居中网格内容）：\n\n![](img/as_4.1_flow_right.jpg)\n\
  \n图 18-19\n\n## 18.8 比例\n\n组件的可以使用比例设置定义。例如，组件可以使用比例进行约束，使得无论缩放行为如何，其宽度都是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 优势\n\n`ConstraintLayout` 提供了一种灵活性，允许在需要嵌套多个布局的情况下，通过单个布局实例实现许多旧布局的功能。这通过允许设计所谓的“扁平化”或“浅层”布局层级，避免了布局嵌套固有的问题。\n\
  \n`ConstraintLayout` 的实现也是为了解决目前存在的各种 Android 设备尺寸问题。`ConstraintLayout` 的灵活性使得设计响应并适应运行应用程序设备的用户界面变得更容易。\n\
  \n最后，正如在如何在 Android Studio 中使用 ConstraintLayout 章节中将演示的那样，Android Studio 布局编辑器已针对基于\
  \ `ConstraintLayout` 的用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout`\
  \ 是随 Android 7 引入的，但它是作为支持库从主 Android SDK 中提供的，并向下兼容到 API  9 (Gingerbread)。这使得使用这种新布局的应用程序可以在较旧版本的\
  \ Android 设备上运行。\n\n## 18.11 总结\n\nConstraintLayout 是随 Android 7 引入的布局管理器。它旨在简化创建适应市场上许多\
  \ Android 设备尺寸和方向的灵活布局。ConstraintLayout 使用约束来控制组件相对于父 `ConstraintLayout` 实例、引导线、屏障以及布局中其他组件的对齐和定位。ConstraintLayout\
  \ 是新创建的 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以非常地实现复杂的响应式用户界面。\n\
  \n\n\n\n\n正如前面的章节中多次提到的那样，Google 对 Android Studio 布局编辑器工具进行了重大更改，其中许多更改仅是为了支持使用\
  \ `ConstraintLayout` 进行用户界面布局设计。既然上一章已经概述了 `ConstraintLayout` 的基本概念，本章将更详细地探讨这些概念，同时概述布局编辑器如何允许设计和实现基于\
  \ `ConstraintLayout` 的用户界面。\n\n## 19.1 设计与布局视图\n\n标题为 Android Studio 布局编辑器工具指南的章节解释了\
  \ Android Studio 布局编辑器工具提供了两种方式来以“设计”（Design）和“布局”（Layout，也称为蓝图）视图的形式查看活动的用户界面布局。这些布局视图可以单独显示，也可以像图\
  \ 19-1 所示那样并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n`Design`\
  \ 视图（位于上图左侧）呈现了布局的“所见即所得”表示，其中布局的外观与其在运行的应用中的显示完全一致。另一方面，`Layout` 视图显示蓝图风格的视图，其中组件由阴影轮廓表示。如上方的图\
  \ 19-1 所示，`Layout` 视图还显示了约束连接（在这种情况下，使用了用于将按钮居中布局的对立约束）。当选择布局中的特定组件或鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观可以使用图 19-3 所示的 `View Options`（视图选项）菜单进行更改：\n\n![](img/as_layout_view_options.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局的两种模式外，布局编辑器工具还提供了三种建立特定布局设计所需约束的不同方法。\n\n## 19.2 自动连接模式\n\
  \n“自动连接”（Autoconnect）顾其实名，它会在项目添加到布局中时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮启用或禁用 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect_button.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法根据组件的位置以及该组件与父布局两侧以及布局中其他元素的距离，来决定建立的最佳约束。如果任何自动约束连接未能提供预期的效果，可以在本章稍后提到的进行手动修改。\n\
  \n## 19.3 推断模式\n\n推断模式（Inference mode）使用涉及算法和概率的启发式方法，在组件已添加到布局后自动实现约束连接。这种模式通常用于关闭了\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下将对象添加到布局中的情况。这允许通过从调色板将对象拖放到布局画布上，并进行尺寸和位置更改，直到布局符合要求从而简单地设计布局。本质上，这涉及到在不担心约束的情况下“绘制”布局。推断模式也可以在设计过程任何时候使用，以填充布局中缺失的约束。\n\
  \n点击 `Infer constraints`（推断约束）按钮（图 19-5）会自动向布局添加约束：\n\n![](img/as_layout_infer_button.jpg)\n\
  \n图 19-5\n\n与 `Autoconnect` 模式一样，布局编辑器工具始终存在推断错误约束的可能性，尽管这些可以手动修改和修正。\n\n## 19.4\
  \ 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解布局编辑器工具中组件周围出现的各种句柄将很有帮助。例如，考虑图 19-6 所示的组件：\n\
  \n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n显然，弹簧状的线条 (A) 代表从组件侧边到目标的已建立约束连接。对象每个角上的小正方形标记\
  \ (B) 是缩放句柄，点击并拖动时可调整组件尺寸。位于组件每侧的小圆圈句柄 (C) 是侧边约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接约束的元素（例如辅助线或父布局侧边或其他组件的侧边），如图\
  \ 19-7\n\n图 19-7\n\n如果将约束线拖到组件并释放但未附加到约束句柄，布局编辑器将显示一个包含可以附加约束的侧边的菜单。在图 19-8 中，例如，约束可以附加到目标组件的顶部或底部：\n\
  \n![](img/as_4.1_constraint_between_widgets.jpg)\n\n图 19-8\n\n额外的标记指示基线约束的锚点，其中使用组件内部的内容（而非外部边缘）作为对齐点。要显示此标记，只需右键点击组件并选择\
  \ `Show Baseline`显示基线）选项。要从句柄建立约束连接，只需将鼠标悬停在句柄上直到其高亮，然后点击并拖到目标（如图 19-9 所示的另一个组件的基线锚点）。\n\
  \n![](img/as_baseline_constraint.jpg)\n\n图 19-9\n\n要隐藏基线锚点，再次右键点击组件并选择 `Hide Baseline`选项。\n\
  \n## 19.5 在检查器中添加约束\n\n可以使用图 19-10 所示的位于属性窗口的 `Inspector`（检查器）面板为 Android Studio\
  \ 布局编辑器中的视图添加约束。中间的正方形代表当前选视图，正方形周围的区域代表对应侧边的约束（如果有）：\n\n![](img/as_3.5_constraint_attributes.jpg)\n\
  \n图 19-10\n\n视图侧边缺失约束由一条指向带有加号的蓝色圆圈的虚线表示（如图中视图底部边缘所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将添加连接到它认为的布局中最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n可以通过显示属性窗口的 `Constraints`（约束）部分来查看当前选中组件上配置的约束列表，如下方的图 19-11\
  \ 所示：\n\n![](img/as_3.5_attributes_constraints_list.jpg)\n\n图 19-11\n\n\n\n\n\n\
  点击列表中的约束将选中设计布局中的该约束。\n\n## 19.7 删除约束\n\n要删除单个约束，只需在设计布局内或 `Attributes` 工具窗口中选择该约束，使其高亮（例如，在图\
  \ 19-12 中所示，最右侧的约束已被选中），然后按下键盘上的 delete 键。该约束将从布局中移除。\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  图 19-12\n\n另一种选项是按住 `Ctrl` 键（macOS 上为 `Cmd`）并将指针悬停在约束锚点上，在它变为红色后点击锚点：\n\n![](img/as_4.1_constraint_delete.jpg)\n\
  图 19-13\n\n或者，通过右键点击组件并选择 `Clear Constraints of Selection`（清除选择约束）菜单来移除组件上的所有约束。\n\
  \n要移除布局中每个组件的所有约束，请使用图 19-14 中高亮的工具栏按钮：\n\n![](img/as_layout_delete_constraints.jpg)\n\
  图 19-14\n\n## 19.8 调整约束偏置\n\n在上一章中，概述了使用偏置（bias）设置来倾向于一个相对约束而非另一个约束的概念。`Android\
  \ Studio Layout Editor` 工具中的偏置是通过 `Attributes` 工具窗口中的 `Inspector` 进行调整的，如图 19-15\
  \ 所示。图中箭头指示的两个滑块用于控制当前所选组件的垂直和水平相对约束的偏置。\n\n![](img/as_3.2_constraint_bias_sliders.jpg)\n\
  图 19-15\n\n## 19.9 理解 ConstraintLayout 边距\n\n约束可以与边距结合使用，在组件与其他元素（如另一个组件、辅助线或父布局的边缘）之间实现固定间隙。例如，考虑图\
  \ 19-16 中应用于 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n图 19-16\n\
  \n按照当前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该组件具有相对的水平约束，表明 `ConstraintLayout`\
  \ 布局引擎在运行时组件的实际位置方面具有一定的裁量权。这使得布局具有灵活性，适应不同的屏幕尺寸和设备方向。水平偏置设置还能控制组件的位置一直直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他地方布局的变化时，组件也无法移动到间隙内。在图\
  \ 19-18 中，右侧约束现在包含 50dp 的边距，即使偏置仍设置为 100%，组件也无法移动进此处。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  图 19-18\n\n组件上的现有边距值可以在 `Inspector` 内部进行修改。如图 19-19 所示，正使用下拉菜单将当前所选组件的右侧边距更改为 16dp。或者，点击当前值也可以在字段中输入数字。\n\
  \n![](img/as_3.2_constraint_set_margins.jpg)\n图 19-19\n\n新约束的默认边距可以随时使用图 19-20 中高亮的工具栏中的选项进行更改：\n\
  \n![](img/as_layout_margin_button.jpg)\n图 19-20\n\n## 19.10 相对约束和偏置的重要性\n\n正如上一章所讨论的，在使用\
  \ `ConstraintLayout` 时，相对约束、边距和偏置是 Android 响应式布局设计的基石。当组件被约束而没有相对约束连接时，这些约束本质上是边距约束。这在\
  \ `Layout Editor` 工具中通过实直线配合边距测量值在视觉上标出，如图 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\
  图 19-21\n\n上述约束本质上将组件固定在那个位置。结果是，如果将设备旋转到横屏方向，组件将不再可见，因为垂直约束将其推出了设备屏幕的顶边缘（如图 19-22\
  \ 所示）。如果在比设计时更小的设备上运行应用，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  图 19-22\n\n当实现相对约束时，约束连接由类似弹簧的波浪线表示（弹簧的比喻表示组件的位置未固定在绝对的 `X` 和 `Y` 坐标上）：\n\n![](img/as_4.1_constraints_constrained.jpg)\n\
  图 19-23\n\n在上述布局中，垂直和水平偏置设置配置为组件始终位于距离底部 90% 和距离左侧边缘 35% 处。因此，在旋转后，组件相对于屏幕尺寸仍然可见：\n\
  \n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n图 19-24\n\n在设计响应式且自适应的用户界面布局时，手动设计布局和对自动创建的约束进行修正时，考虑到偏置和相对约束很重要。\n\
  \n## 19.11 配置组件尺寸\n\n`ConstraintLayout` 内部内部尺寸也可以通过 `Inspector` 配置。正如上一章概述，组件尺寸可以设置为\
  \ wrap content（包裹内容）、fixed（固定）或 match constraint（匹配约束）模式。当前所选组件每个维度的现有设置显示在 `Inspector`\
  \ 中代表组件的正方形内，如图 19-25 所示：\n\n![](img/as_3.2_constraint_widget_dimensions.jpg)\n\
  图 19-25\n\n在上述图中，水平和垂直维度都设置为 wrap content 模式（由向内的箭头指示）。检查器使用以下视觉指示器来表示三种维度模式：\n\n\
  | 固定尺寸 |\n| 匹配约束 |\n| 包裹内容 |\n\n要更改当前设置，只需点击指示器即可循环切换三种不同的设置。当布局编辑器中视图的维度设置为 match\
  \ constraint 模式时，视图相应的边将用类似弹簧的波浪线绘制而不是普通的直线。例如，在图 19-26 中，仅视图的宽度被设置为匹配约束：\n\n![](img/Image2855.jpg)\n\
  图 19-26\n\n\n\n\n\n此外，可以通过 `Expand horizontally`（水平扩展）和 `Expand vertically`（垂直扩展）选项，将组件的大小水平或垂直方向扩展到约束以及布局中其他组件允许的最大值。这些选项可以通过右键点击布局中的组件，并在弹出的菜单中选择\
  \ `Organize`（组织）选项来访问（图 19-27）。使用时，当前选中的组件将水平或垂直方向增大尺寸以填充其周围的可用空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n## 19.12 设计时工具定位\n\n名为“Android Studio 布局编辑器工具指南”的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器内的可见性属性。在后台，Android\
  \ Studio 还会使用 `tools` 属性在组件放置于布局中但没有约束时将它们保持在相应位置。例如，想象在禁用自动连接模式时将一个 `Button` 放置到布局中。虽然该组件在预览画布中看起来位置正确，但在运行应用时，它将出现在屏幕的左上角。这是因为组件没有约束来告诉父布局\
  \ `ConstraintLayout` 应该将其放置在哪里。\n\n组件在布局编辑器中显示位置正确的原因是 Android Studio 设置了绝对的 `X`\
  \ 和 `Y` 定位 `tools` 属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，内容可能如下：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。一种快速识别哪些组件缺少约束而无需等待应用运行的实用技巧，是点击图 19-28 中高亮的按钮来切换工具位置的可见性。任何跳转到左上角的组件都没有被完全约束，它们正通过临时的\
  \ `tools` 绝对 `X` 和 `Y` 定位属性保持位置。\n\n![](img/as_4.1_toggle_tools_positions.jpg)\n\
  \n图 19-28\n\n## 19.13 添加指南线\n\n指南线（Guidelines）提供了约束可以在其锚定的额外元素。可以通过右键点击布局并选择 `Vertical\
  \ Guideline`（垂直指南线）或 `Horizontal Guideline`（水平指南线）菜单选项，或者使用如图 19-29 所示的工具栏菜单选项来添加指南线：\n\
  \n![](img/as_layout_guidelines_button.jpg)\n\n图 19-29\n\n或者从 `Palette`（调色板）的 `Helpers`\
  \ 部分拖动水平和垂直 `Guidelines`，将其释放到布局画布或 `Component Tree`（组件树）面板上：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n一旦添加，指南线将在布局中以虚线形式出现，可以通过点击并拖动该线来轻松移动。要建立到指南线的约束连接，点击组件的约束句柄，并在释放前将其拖动到指南线。在图\
  \ 19-31 中，两个 `Buttons` 的左侧通过约束连接到一条垂直指南线。\n\n垂直指南线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平指南线为距离顶部或底部）。例如，上图中的垂直指南线距离父布局左边缘\
  \ `96dp`。\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-31\n\n或者，指南线可以定位为父布局总宽度或高度的百分比。要在这三种模式之间切换，请选择指南线并点击指南线顶部或起始处的圆圈（取决于指南线是垂直还是水平）。例如，图\
  \ 19-32 显示了一个基于百分比定位的指南线：\n\n![](img/as_4.1_constraint_guideline_percentage.jpg)\n\
  \n图 19-32\n\n## 19.14 添加屏障\n\n屏障（Barriers）可以通过右键点击布局并在 `Add helpers...` 菜单中选择 `Vertical\
  \ Barrier`（垂直屏障）或 `Horizontal Barrier`（水平屏障）选项，或使用之前在图 19-29 中所示的工具栏菜单选项。或者，在 `Palette`\
  \ 的 `Helpers` 部分找到 `Barrier` 类型，并将其拖放到布局画布或 `Component Tree` 面板上。\n\n一旦向布局添加了屏障，它将作为\
  \ `Component Tree` 面板中的项出现：\n\n![](img/as_4.2_barrier_added.jpg)\n\n图 19-33\n\n\
  要将视图作为引用视图（换句话说，控制屏障位置的视图），只需将视图从 `Component Tree` 拖到屏障。在图 19-34 中，`textView1` 和\
  \ `textView2` 已分配为 `barrier1` 的引用：\n\n![](img/as_4.2_barrier_children.jpg)\n\n图\
  \ 19-34\n\n添加引用视图后，需要配置屏障指定相对于这些视图的方向。这是在 `Component Tree` 中选择屏障时在 `Attributes`\
  \ 窗口定义的屏障方向设置：\n\n![](img/as_4.1_barrier_direction.jpg)\n\n图 19-35\n\n下图显示了一个包含屏障的布局，`textView1`\
  \ 和 `textView2` 作为引用视图，`textview3` 作为约束视图。由于屏障从引用视图的 `end` 推向约束视图，屏障方向已设置为 `end`：\n\
  \n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n## 19.15 添加分组\n\n要向布局添加\
  \ `Group`（分组），右键点击布局并在 `Add helpers` 菜单中选择 `Group` 选项，或使用之前在图 19-29 中所示的工具栏选项。或者，在\
  \ `Palette` 的 `Helpers` 部分找到 `Group` 项目，并将其拖放到布局画布或 `Component Tree` 面板上。\n\n要向分组添加组件，在\
  \ `Component Tree` 中选择它们并将其拖到 `Group` 项上。图 19-37 示例显示了三个选中的组件被添加到分组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\
  \n图 19-37\n\n分组引用的任何组件将在 `Component Tree` 中的分组项下方以*斜体*形式显示，如图 19-38 所示。要从分组中移除组件，只需选择它并按下键盘删除键：\n\
  \n![](img/as_4.1_group_widget_list.jpg)\n\n图 19-38\n\n一旦组件分配给分组，使用 `Attributes`\
  \ 工具窗口的 `Constraints` 部分来修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n\n图 19-39\n\
  \n## 19.16 使用 Flow 助手\n\nFlow 助手可以像之前概述其他助手一样通过菜单或 `Palette` 添加。与 `Group` 助手一样（图\
  \ 19-37），通过将组件从 `Component Tree` 拖动到 `Flow` 实例来添加。在添加 `Flow` 助手并分配组件后，在 `Component\
  \ Tree` 中选择它，并使用 `Attribute` 工具窗口的 `Common Attributes` 部分来配置流布局行为。\n\n\n\n\n\n![](img/as_4.1_flow_attributes.jpg)\n\
  \n图 19-40\n\n# 19.17 组件组对齐与分布\n\n当在布局中选中两个或多个组件时，Android Studio 布局编辑器工具提供了一系列对齐和分布操作。只需按住\
  \ Shift 并点击要包含在操作中的每个组件，然后在布局上点击右键，并从 `Align`（对齐）菜单显示的多个选项中进行选择：\n\n![](img/as_layout_align_menu.jpg)\n\
  \n图 19-41\n\n如下面的图 19-42 所示，这些选项也可以通过布局编辑器工具栏上的 `Align` 按钮访问：\n\n![](img/as_4.1_constraints_align_menu.jpg)\n\
  \n图 19-42\n\n同样，`Pack`（打包）菜单（图 19-43）可以用于共同重新定位所选组件，使它们在垂直或水平方向上紧凑排列。它通过更改组件的绝对\
  \ `x` 和 `y` 坐标来实现，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上均匀间隔开，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n\n# 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一或多个其他 Android 布局类（例如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，布局编辑器工具提供了一个将用户界面转换为使用\
  \ `ConstraintLayout` 的选项。\n\n当布局编辑器工具打开并处于设计模式时，`Component Tree`（组件树）面板显示在 `Palette`（调面板）下方。要将布局转换为\
  \ `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它并选择 `Convert <current layout>\
  \ to Constraint Layout` 菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\
  \n图 19-44\n\n选择此菜单选项后，Android Studio 将选定的布局转换为 `ConstraintLayout`，并使用推理来建立约束，以匹配原始布局类型的布局行为。\n\
  \n# 19.19 总结\n\n重新设计的布局编辑器工具结合 `ConstraintLayout`，使得在 Android Studio 中设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束、间距（margins）和偏移（bias）的概念，同时探索了基于\
  \ `ConstraintLayout` 的设计如何集成到布局编辑器工具中。\n\n# 20. 在 Android Studio 中处理 ConstraintLayout\
  \ Chains 和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键功能，并概述了在 Android Studio 布局编辑器中基于\
  \ `ConstraintLayout` 的用户界面设计的最佳实践。虽然 `ConstraintLayout` 链（chains）和比例（ratios）的概念在名为\
  \ Android ConstraintLayout 指南的章节中已经概述，但我们尚未讨论如何在布局编辑器中使用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout`\
  \ 类时创建和管理链和比例的实际步骤。\n\n## 20.1 创建链\n\n链可以通过向 Activity 的 XML 布局资源文件添加几行代码来实现，也可以通过布局编辑器的某些链特定功能来实现。\n\
  \n考虑一个由三个 `Button` 组件组成的布局，这些组件被约束为位于 `ConstraintLayout` 父容器的左上、顶中和右上角，如图图 20-1\
  \ 所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\n图 20-1\n\n为了表示这样的布局，XML\
  \ 资源布局文件可能包含以下按钮组件条目：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\" />\n<Button\n    android:id=\"@+id/button3\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\" />\n```\n\n按照目前的配置，没有双向约束将这些组件组合成链。要解决这个问题，需要从\
  \ `button1` 的右侧到 `button2` 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧添加额外的约束：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n  \
  \  android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改，这些组件现在具有了双向水平约束。这本质上构成了一个 ConstraintLayout 链，在布局编辑器中通过链连接视觉化表示，如下面的图\
  \ 20-2 所示。注意，在此配置下，链默认使用了分布链样式。\n\n![](img/as_4.1_layout_horizontal_chain.jpg)\n\
  \n图 20-2\n\n## 20.2 更改链样式\n\n如果没有配置链样式，ConstraintLayout 将默认使用分布链样式。可以通过右键点击链中的任何组件并选择\
  \ `Cycle Chain Mode`（循环链模式）菜单选项来更改链样式。每次点击该菜单选项，样式就会在分布、内部分布和打包（packed）的设置之间切换。\n\
  \n或者，也可以在 Attributes 工具窗口中指定样式，展开 `layout_constraints` 属性，并根据链的方向更改 `horizontal_chainStyle`\
  \ 或 `vertical_chainStyle` 属性：\n\n\n\n\n\n![](img/as_4.1_chain_style_attribute.jpg)\n\
  \n图 20-3\n\n## 20.3 链内部扩散样式 (Spread Inside Chain)\n\n图 20-4 展示了使用上述技术将链样式更改为“链内部扩散”样式的效果：\n\
  \n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\n图 20-4\n\n## 20.4\
  \ 紧凑链样式 (Packed Chain)\n\n使用相同的技术，将`chain style`属性更改为`packed`，会导致布局发生变化，如图 20-5\
  \ 所示：\n\n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n## 20.5\
  \ 带有偏置的紧凑链 (Packed Chain with Bias)\n\n紧凑链的定位可能会应用`bias`值的影响。`bias`可以是`0.0`到`1.0`之间的任何值，其中`0.5`代表父级的中心。`Bias`通过选择链头控件并在属性（Attributes）面板中为`layout_constraintHorizontal_bias`或`layout_constraintVertical_bias`属性赋值来控制。图\
  \ 20-6 显示了一个水平偏置设为`0.2`的紧凑链：\n\n![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n## 20.6 加权链 (Weighted Chain)\n\n最后要探索的链区域涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占空间。加权链仅可以使用`spread`链样式实现，并且链中任何响应`weight`属性的控件必须将其相应的维度属性（垂直链为`height`，水平链为`width`）配置为`match\
  \ constraint`模式。控件维度的`match_constraint`模式可以通过选择控件、显示属性面板并将维度更改为`match_constraint`（等同于`0dp`）来配置。例如，在图\
  \ 20-7 中，按钮的`layout_width`约束被设置为`match_constraint`（`0dp`），表示该控件的宽度将根据当前的约束设置来确定：\n\
  \n![](img/as_3.5_chain_match_constraints.jpg)\n\n图 20-7\n\n假设已选择了`spread`链样式，并且所有三个按钮都配置为宽度设置为匹配约束，则链中的控件将等宽扩展以填充可用空间：\n\
  \n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\n图 20-8\n\n每个控件相对于链中其他控件所占空间的大小可以通过向控件添加`weight`属性来控制。图\
  \ 20-9 显示了将`button1`的`layout_constraintHorizontal_weight`属性设为`4`，以及在`button2`和`button3`上均设为`2`的效果：\n\
  \n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\n图 20-9\n\n由于这些权重值，`button1`占据了一半的空间（`4/8`），而`button2`和`button3`各占了空间的四分之一（`2/8`）。\n\
  \n## 20.7 使用比例 (Working with Ratios)\n\nConstraintLayout`ratios`允许控件的一个维度相对于其另一个维度（也称为宽高比例）进行调整。例如，可以将比例设置应用于`ImageView`，以确保其宽度始终是高度的两倍。\n\
  \n维度比例约束通过将受约束的维度设置为`match constraint`模式，并将该控件上的`layout_constraintDimensionRatio`属性配置为所需的比例来配置。该比例值可以指定为`float`值或`width:height`比例设置。例如，下面的\
  \ XML 代码段为`ImageView`控件配置了`2:1`的比例：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"100dp\"\n    android:id=\"@+id/imageView\"\n\
  \    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为`match\
  \ constraint`时如何配置比例。当两个维度都设置为`match constraint`模式时，也可以应用比例。这涉及到在比例前加上`H`或`W`，以指示哪个维度相对于另一个维度是约束的。\n\
  \n例如，考虑以下`ImageView`对象的 XML 代码段：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    android:id=\"@+id/imageView\"\n  \
  \  app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintRight_toRightOf=\"\
  parent\"\n    app:layout_constraintLeft_toLeftOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintDimensionRatio=\"W:2:1\" />\n```\n\n\n\n\n\n\
  项目创建流程完成后，Android Studio 主窗口将会出现，我们准备好创建一个新的活动（Activity）。这是一次非常有价值的练习，因为在开发 Android\
  \ 应用程序的过程中，有很多需要从零开始创建新实例。\n\n首先，使用快捷键 `Alt-1/Cmd-1` 显示 `Project` 工具窗口（如果它尚未显示）。一旦显示了\
  \ Android 的层级结构，点击 `Project` 窗口中条目右侧的右箭头将其展开。此的目标是访问项目层级结构中的 `app -> java -> com\
  \ -> ebookfrenzy -> layoutsample` 文件夹。包名可见后，对其点击右键，并如图图 21-1 所示选择 `New -> Activity\
  \ -> Empty Activity` 选项。或者，选择 `New -> Activity -> Gallery...` 选项以浏览可用模板，并在 `New\
  \ Android Activity` 对话框中选择。\n\n![](img/Image2435.jpg)\n\n图 21-1\n\n在弹出的 `New Android\
  \ Activity` 对话框中，将新活动命名为 `MainActivity`，将布局命名为 `activity_main`。该活动自然需要一个布局资源文件，因此确保\
  \ `Generate a Layout File` 选项已启用。\n\n为了让应用程序能够在设备上运行，它需要指定一个活动作为启动活动（launcher activity）。如果没有启动活动，操作系统将不知道在应用程序首次启动时启动哪个活动，导致应用程序启动失败。由于此示例只有一个活动，它需要被指定为应用程序的启动活动，因此在点击\
  \ `Finish` 按钮之前，确保 `Launcher Activity` 选项已启用。\n\n此时，Android Studio 应该已向项目中添加了两个文件。活动的\
  \ Java 源代码文件位于 `app -> java -> com -> ebookfrenzy -> layoutsample` 文件夹。\n\n此外，用户界面的\
  \ XML 布局文件应该已创建在 `app -> res -> layout` 文件夹中。注意，此活动选择了 `Empty Activity` 模板，因此布局完全包含在\
  \ `activity_main.xml` 文件中，没有独立布局文件。此外，由于我们不会编写任何代码来访问用户界面布局中的视图，因此没有必要将项目转换为支持视图绑定（view\
  \ binding）。\n\n最后，新活动应该已添加到 `AndroidManifest.xml` 文件中并指定为启动活动。清单文件可以在项目窗口的 `app\
  \ -> manifests` 文件夹下找到，并包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ xmlns:tools=\"http://schemas.android.com/tools\"\n    package=\"com.ebookfrenzy.layoutsample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.LayoutSample\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".MainActivity\"\n         \
  \   android:exported=\"true\" >\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n### 21.3 准备布局编辑器环境\n\n找到并双击 `app -> res\
  \ -> layout` 文件夹中的 `activity_main.xml` 布局文件，将其加载到 `Layout Editor` 工具中。由于本教程法获得使用约束（constraints）的经验，请使用\
  \ `Layout Editor` 工具栏上的按钮关闭 `Autoconnect`（自动连接）功能。禁用后，按钮上将出现一条划线，如图图 21-2 所示：\n\n\
  ![](img/as_layoutsample_autoconnect_off.jpg)\n\n图 21-2\n\n如果 `Autoconnect` 按钮右侧的默认边距值未设置为\
  \ `8dp`，请点击它并在生成的面板中选择 `8dp`。\n\n用户界面设计还将利用 `ImageView` 对象来显示图像。在继续之前，应该将此图像添加到项目中，以便在章节后续部分使用。该文件名为\
  \ `galaxysys6.png`，可以从以下 URL 提供的示例代码下载中的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n在 Android Studio 中，显示 `Resource Manager` 工具窗口（`View -> Tool Windows -> Resource\
  \ Manager`）。在系统中找到 `galaxysys6.png` 图像并将其拖到 `Resource Manager` 上。在生成的对话框中，点击 `Next`\
  \ 然后点击 `Import` 按钮添加图像。图像现在应该出现在 `Resource Manager` 中，如图图 21-3 所示：\n\n![](img/as_resource_manager)\n\
  \n图 21-3\n\n该图像也将出现在项目的 `res -> drawables` 部分：\n\n![](img/Image245.jpg)\n\n### 21.4\
  \ 向用户界面添加控件\n\n从 `Common` 类别中，将 `ImageView` 对象拖到显示器的中心。注意，虚线表示显示器的轴线。当居中后，释放鼠标按钮将视图置于位置。\n\
  \n一旦放入布局，`Resources` 对话框将出现寻找要显示的图像。在对话框顶部的搜索栏中输入 `galaxy` 以定位 `galaxys6.png` 资源，如图图\
  \ 21-5 所示：\n\n![](img/as_5.jpg)\n\n图 21-5\n\n选择图像并点击 `OK` 将其分配给 `ImageView`。如有需要，使用调整柄调整\
  \ `ImageView` 的大小并将其重新放置在布局中心。此时布局应与图图 21-6：\n\n![](img/as_3.5.layout_sample_imageview_added.jpg)\n\
  \n图 21-6\n\n在调色板的 `Common` 部分点击并拖入 `TextView` 对象，并定位使其位于 `ImageView` 上方，如图图 21-7\
  \ 所示。使用 `Attributes` 面板，展开 `Common Attributes` 部分中的 `textAppearance` 项，将 `textSize`\
  \ 属性更改为 `24sp`，将 `textAlignment` 设置为 `center`，并将 `text` 更改为 `Samsung Galaxy S6`。\n\
  \n![](img/as_3.5.layout_sample_textview_added.jpg)\n\n图 21-7\n\n接下来在布局底部添加三个 `Button`\
  \ 控件，并将这些视图的 `text` 属性设置为 `Buy Now`、`Pricing` 和 `Details`。完成的布局现在应该与图图 21-8：\n\n\
  ![](img/as_4.1_layout_sample_ui.jpg)\n\n图 21-8\n\n此时，控件尚未充分约束，以便布局引擎能够在运行时确定控件的位置和大小。如果现在运行程序，所有控件将位于显示器的左上角。\n\
  \n在布局中添加控件后，使用 `Layout Editor` 工具栏上的设备旋转按钮（如图图 21-9 中的箭头所示）在横向模式下查看用户界面：\n\n![](img/as_4.2_layout_rotate.jpg)\n\
  \n图 21-9\n\n\n\n\n由于缺少约束，导致布局无法适应设备方向的变化，使得内容未居中，并且部分图像以及三个按钮都位于屏幕的可视区域之外。显然，为了将其转变为一个响应式用户界面，仍需进行一些工作。\n\
  \n## 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸的布局的关键。首先，将布局旋转回竖屏，并选择位于 `ImageView` 之上的\
  \ `TextView` 小部件。选中该小部件后，如图 21-10 所示，从 `TextView` 的左侧、右侧和顶部建立到父级 `ConstraintLayout`\
  \ 对应边的约束：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\
  \n在 `TextView` 小部件设置好后，选择 `ImageView` 实例，并在左侧和右侧建立相对的约束，每个约束都连接到父布局的对应边。接下来，建立从\
  \ `ImageView` 顶部到 `TextView` 底部的约束连接，以及从 `ImageView` 底部到中间 `Button` 小部件顶部的约束。如有必要，点击并拖动\
  \ `ImageView`，使其保持在布局的垂直中心位置。\n\n在保持 `ImageView` 选中状态的情况下，使用属性面板中的 `Inspector` 将\
  \ `ImageView` 的顶部和底部边距分别更改为 `24` 和 `8`，并将小部件的高度和宽度维度属性均改为 `match_constraint`，以便小部件将调整大小以匹配约束。这些设置将允许布局引擎在需要适应布局变化时放大或缩小\
  \ `ImageView` 的尺寸：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n图 21-12\
  \ 显示了 `ImageView` 相对于布局中其他元素的当前实现的约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后一个任务是为三个 `Button` 小部件添加约束。在本例中，按钮将以链（chain）的形式排列。首先，通过点击图 21-2 中突出显示的工具栏按钮，在\
  \ `Layout Editor` 中开启 `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后按住 Shift 点击另外两个按钮，以便三个按钮都被选中。右键点击\
  \ `Buy Now` 按钮，并在弹出的菜单中选择 `Chains` -> `Create Horizontal Chain`（创建水平链）选项。默认情况下，链将使用\
  \ `spread` 样式显示，这是本例的正确行为。\n\n最后，在 `Buy Now` 按钮底部和布局底部之间建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如图\
  \ 21-13 所示被约束住：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\n图 21-13\n\n## 21.6\
  \ 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式，并验证布局是否适应新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具提供了一个设计用户界面布局的有用视觉环境，但在涉及测试时，运行中的应用测试是不可替代的。在物理\
  \ Android 设备或模拟器会话上启动应用，验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图 21-14 显示了横屏模式下的运行应用：\n\
  \n![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要进行定位、约束并设置属性即可。\n\
  \n## 21.7 使用布局检查器\n\n可以随时使用 `Layout Inspector` 工具查看组成用户界面布局的组件层级结构。要访问这些信息，应用必须运行在运行\
  \ `Android API 29` 或更高版本的设备或模拟器上。一旦应用运行，选择 `Tools` -> `Layout Inspector` 菜单选项，然后使用下方图\
  \ 21-15 中标记为 A 的菜单选择要检查的进程。\n\n一旦检查器加载，最左侧的面板 (B) 显示组成用户界面布局的组件层级结构。中间面板 (C) 显示布局设计的视觉表示。点击视觉布局中的小部件将导致该项在层级列表中高亮，从而易于找到视觉组件相对于整个布局层级结构的位置。\n\
  \n最后，最右侧的面板（在图 21-15 中标记为 D）包含当前所选组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，点击标记为 E 的按钮。这将显示层级结构的“爆炸式”表示，以便对其进行旋转和检查。这对于识别遮挡视图等任务非常有用：\n\
  \n![](img/as_4.1_layout_inspector_spacing.jpg)\n\n图 21-16\n\n使用上方图中拖动渲染内容进行三维旋转。点击标记为\
  \ E 的按钮返回 2D 视图。\n\n## 21.8 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout`\
  \ 紧密集成。本章通过示例用户界面概述了如何使用 `Layout Editor` 添加小部件和设置约束来实现基于 `ConstraintLayout` 的用户界面。本章还介绍了\
  \ `Layout Inspector` 工具，它对于分析用户界面的结构非常有用。\n\n## 22 Android Studio 中的手动 XML 设计\n\n\
  虽然使用 Android Studio 设计布局大大提高了效率，但仍然可以通过手动编辑 XML 创建布局。本章将介绍 Android XML 布局的基础。\n\n\
  ### 22.1 手动创建 XML 布局\n\nXML 布局的结构实际上简单，遵循视图树的分级方法。XML 文件的第一行应该包含以下标准声明：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\n之后应该是布局的根元素，通常是一个容器视图。它由起始标签和结束标签以及需要在视图上设置的任何属性表示。例如，以下\
  \ XML 定义了一个 `ConstraintLayout` 视图根元素，分配了 ID `activity_main` 并设置了 `match_parent`\
  \ 属性，以填充设备显示的所有空间：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\">\n```\n\n\n\n\n```xml\ntools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素在每个侧都配置了 `16dp`（密度无关像素）的内边距。Android 布局中的任何间距规范必须使用以下单位之一：\n\
  \n*   `in` – 英寸。\n*   `mm` – 毫米。\n*   `pt` – 点（1/72 英寸）。\n*   `dp` – 密度无关像素。一种基于设备显示物理密度相对于\
  \ `160dpi` 显示基准计算的抽象测量单位。\n*   `sp` – 缩放无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n*   `px`\
  \ – 实际屏幕像素。不建议使用它，因为不同的显示器每英寸像素数不同。请优先使用 `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout`\
  \ 父容器的子元素必须嵌套在起始和结束标签之间。在接下来的示例中，添加了一个 `Button` 控件作为 `ConstraintLayout` 的子元素：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\" />\n\
  </androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距而缩进了\
  \ `16dp`）。然而，如果在按钮两侧添加了相反的约束，它将显示在布局正中央：\n\n```xml\n<Button\n    android:text=\"\
  @string/button_string\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:id=\"@+id/button\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n注意，每个约束都连接到名为\
  \ `activity_main` 的元素上，在这种情况下，它是父级 `ConstraintLayout` 实例。\n\n要向布局中添加第二个控件，只需将其嵌入\
  \ `ConstraintLayout` 元素的体部中。例如，下面的修改为布局添加了一个 `TextView` 控件：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingTop=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\"\n \
  \       app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"@string/button_string\"\n   \
  \     android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\
  \n        android:id=\"@+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n（注：原文在最后一个示例中包含冗余/冲突的 XML；上述结构已经过清理以保持清晰度。）\n\n\n\n\n\n到本书为止，所有的用户界面设计任务都是使用\
  \ Android Studio Layout Editor 工具完成的，无论是使用文本模式还是设计模式。编写 XML 资源文件或使用 Android Studio\
  \ Layout Editor 的替代方案是编写 Java 代码，以直接创建、配置和操作构成 Android Activity 用户界面的视图对象。在本章的上下文中，我们将在描述视图属性以及布局约束的创建与管理等一些关键概念之前，先探索使用\
  \ Java 代码创建用户界面的某些优势和缺点。\n\n在下一章节中，将创建并使用一个示例项目，用以演示这种创建 Android 用户界面的方法中所涉及的一些典型步骤。\n\
  \n## 23.1 Java 代码与 XML 布局文件\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google\
  \ 在 Android 文档中花费了大量篇幅来赞扬 XML 资源优于 Java 代码的优点。正如上一章所讨论的，XML 方法的一个关键优势包括能够使用 Android\
  \ Studio Layout Editor 工具，该工具本身会生成 XML 资源。另一个优势是，一旦创建了应用程序，可以通过修改 XML 文件来对用户界面屏幕进行更改，从而避免了重新编译应用程序的必要性。此外，即使是手写\
  \ XML 布局，也可以使用 Android Studio Layout Editor 工具的预览功能获取用户界面外观的即时反馈。为了测试由 Java 创建的用户界面外观，开发者不可避免地将反复循环编写代码、编译和测试的循环来完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 优于 XML 资源文件最显著的优势体现在处理动态用户界面时。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是那些每次调用\
  \ Activity 之间不太发生显著更改的布局。相反，Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次执行 Activity\
  \ 时显示不同的情况下尤为有用。\n\n当需要在 Activity 运行时对基于静态 XML 资源的布局进行实时的动态更改时，在 Java 代码中操作用户界面组件的知识也会有用。\n\
  \n最后，某些开发者无论后一种方法提供的优势，简单地倾向于编写 Java 代码而不是使用布局工具和 XML。\n\n## 23.2 创建视图\n\n如前所述，Android\
  \ SDK 包含了一个视图类工具箱，旨在满足大多数基本的用户界面设计需求。在 Java 中创建视图仅是创建这些类的实例，并将与该视图关联的 Activity 引用作为参数传递。\n\
  \n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 Activity 的 `setContentView()` 方法显示给用户。可以通过调用对象的\
  \ `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的 ID。对于在\
  \ Java 中创建的视图也遵循相同的规则。因此，对于后续 Java 代码中需要某些类型访问的任何视图，必须为其分配一个 ID。这是通过调用相关视图对象的 `setId()`\
  \ 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象将如何显示或行为。属性的示例包括显示在\
  \ `Button` 对象上的文本，或者 `ConstraintLayout` 视图的背景颜色。Android SDK 内部每个视图类都拥有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用它，将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法来设置。\n\n## 23.4 约束集\n\n虽然属性设置是视图内部的并决定了视图的显示和行为，但约束集用于控制视图相对于其父视图和其他兄弟视图的显示。每个\
  \ `ConstraintLayout` 实例都关联有一组约束，定义了其子视图如何定位和受限。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行诸如对 `ConstraintLayout` 实例创建、配置和应用约束等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到\
  \ `ConstraintSet` 对象中，并用于将相同的约束应用于其他布局（可以或不带修改）。\n\n`ConstraintSet` 实例的创建就像任何其他\
  \ Java 对象一样：\n\n```\nConstraintSet set = new ConstraintSet();\n```\n\n一旦创建了约束集，就可以在实例上调用方法来执行广泛广泛的任务。\n\
  \n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()` 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中\
  \ `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT,\n           editText1.getId(), ConstraintSet.RIGHT, 70);\n\
  ```\n\n### 23.4.2 应用布局约束\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout` 实例才能生效。约束集通过调用 `applyTo()`\
  \ 方法应用，并传递要应用设置的布局引用：\n\n```\nset.applyTo(myLayout);\n```\n\n### 23.4.3 父约束连接\n\n\
  也可以通过引用 `ConstraintSet.PARENT_ID` 常量在子视图与其父 `ConstraintLayout` 之间建立连接。在以下示例中，配置约束集将\
  \ `Button` 视图的顶部连接到父布局的顶部，间距为 100dp：\n\n```\nset.connect(button1.getId(), ConstraintSet.TOP,\n\
  \           ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n```\n\n### 23.4.4\
  \ 尺寸约束\n\n可以使用许多方法控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将 `ImageView`\
  \ 实例的垂直尺寸限制为最大 250dp：\n\n```\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移\n\n\n\n\
  \n正如“Android Studio 中使用 ConstraintLayout 指南”章节概述的，当视图具有对立的约束时，它将沿着约束的轴居中（即水平方向或垂直方向）。这种居中位置可以通过在特定的约束轴上应用偏移（bias）来调整。当使用\
  \ Android Studio 布局编辑器时，这可以通过属性（Attributes）工具窗口中的控件来实现。然而，在处理约束集（constraint set）时，可以使用\
  \ `setHorizontalBias()` 和 `setVerticalBias()` 方法添加偏移，并引用视图 ID 和作为 0 到 1 之间的浮点数值的偏移值。\n\
  \n例如，下面的代码将 `Button` 的左侧和右侧约束到父布局的相应侧，在应用 25% 的水平偏移之前执行：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT,\n              ConstraintSet.PARENT_ID, ConstraintSet.LEFT,\
  \ 0);\n\nset.connect(button1.getId(), ConstraintSet.RIGHT,\n              ConstraintSet.PARENT_ID,\
  \ ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\
  \n### 23.4.6 对齐约束\n\n对齐也可以使用约束集来应用。Android Studio 布局编辑器中提供的完整对齐选项也可以通过 `centerVertically()`\
  \ 和 `centerHorizontally()` 方法使用约束集进行配置，这两个方法都会根据配置的对齐方式接受各种参数。此外，可以使用 `center()`\
  \ 方法将一个视图在两个其他视图之间居中。\n\n在下面的代码中，`button2` 的位置设置使其与 `button1` 水水平上对齐：\n\n```java\n\
  set.centerHorizontally(button2.getId(), button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\
  \n`ConstraintLayout` 实例的当前约束集可以使用 `clone()` 方法复制到约束集对象中。例如，下行代码将名为 `myLayout` 的\
  \ `ConstraintLayout` 实例的约束设置复制到约束集对象：\n\n```java\nset.clone(myLayout);\n```\n\n\
  一旦复制，可以将约束集直接应用到另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\n```java\nConstraintSet set\
  \ = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集中创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int\
  \ leftSide, int rightId,\n                      int rightSide, int[] chainIds, float[]\
  \ weights, int style);\n```\n\n根据上述语法，下面的示例创建了一个从 `button1` 开始并以 `button4` 结束的水平扩散链（spread\
  \ chain）。在这些视图之间是 `button2` 和 `button3`，它们的权重都设置为零：\n\n```java\nint[] chainViews\
  \ = {button2.getId(), button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT,\n                          button4.getId(), ConstraintSet.RIGHT,\n\
  \                          chainViews, chainWeights,\n                         \
  \ ConstraintSet.CHAIN_SPREAD);\n```\n\n可以通过将要移除的视图 ID 传递给 `removeFromHorizontalChain()`\
  \ 或 `removeFromVerticalChain()` 方法来从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()`\
  \ 方法将视图添加到现有的链中。在这两种情况下，方法接受的参数是新视图要插入的视图之间的 ID，如下所示：\n\n```java\nset.addToHorizontalChain(newViewId,\
  \ leftViewId, rightViewId);\n```\n\n### 23.4.9 指南线（Guidelines）\n\n使用 `create()`\
  \ 方法向约束集中添加指南线，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()` 或 `setGuidelinePercent()`\
  \ 方法进行定位。在下面的代码中，创建了一个垂直指南线并将其定位在父布局宽度的 50% 处：\n\n```java\nset.create(R.id.myGuideline,\
  \ ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button1.getId(), R.id.myGuideline, ConstraintSet.LEFT, 0);\n\
  set.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从视图中移除约束，并将视图\
  \ ID 和锚点作为参数。同样，通过在 `clear()` 调用中引用视图，可以一步移除视图上的所有约束：\n\n```java\nset.clear(button.getId());\n\
  ```\n\n### 23.4.11 缩放\n\n可以使用 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接受要执行操作的视图以及表示缩放的浮点值。在下面的代码中，按钮对象被缩放为其宽度的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 分别在 X 或 Y\
  \ 轴旋转视图，这两个方法都必须传递视图 ID 和表示旋转角度的浮点值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。下面的代码将按钮绕 500, 500 处的中心点沿 Y 轴旋转 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n## 23.5 总结\n\n编写 XML 资源文件或使用 Android Studio\
  \ 布局编辑器之外，还可以使用 Java 代码动态创建 Android 用户界面。在 Java 代码中创建布局包括创建视图实例并设置属性以定义所需的显示和行为。\n\
  \n视图相对于 `ConstraintLayout` 父视图以及任何兄弟视图的位置和大小是通过使用约束集定义的。约束集由 `ConstraintSet` 实例表示，一旦创建，就可以通过各种方法调用来执行建立连接、控制视图大小行为和创建链等任务。\n\
  \n在本章介绍 `ConstraintSet` 类的基础知识后，下一章将通过教程把这些功能应用于实际开发。\n\n# 24 Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 Java 代码创建和修改用户界面布局的基础概念，涉及 `ConstraintLayout` 和 `ConstraintSet`\
  \ 类。本章将通过创建一个完全用 Java 代码创建的示例布局，将这些概念付诸实践。\n\n## 24.1 在 Android Studio 中创建示例项目\n\
  \n启动 Android Studio，从欢迎界面选择 New Project 选项，在出现的新项目对话框中选择 Empty Activity 模板，然后点击\
  \ Next 按钮。\n\n\n\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n一旦项目完成，`MainActivity.java` 文件将自动加载到编辑面板中。正如我们预期的那样，Android\
  \ Studio 创建了一个模板 Activity 并重写了 `onCreate()` 方法，这为添加 Java 代码创建用户界面提供了理想的位置。\n\n##\
  \ 24.2 向 Activity 中添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除此行：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n下一次修改是向活动添加一个包含单个 `Button`\
  \ 视图子控件的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后，需要将\
  \ `Button` 视图作为子添加到 `ConstraintLayout` 视图中，而视图通过调用活动实例的 `setContentView()` 方法显示：\n\
  \n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，必须向构造方法传递创建对象时的上下文，在本例中，它是当前活动。由于上述代码位于活动类内部，因此通过标准的\
  \ `this` 关键字引用上下文：\n\n```java\nButton myButton = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上均可）。启动后，可见结果是在\
  \ `ConstraintLayout` 视图的左上角出现一个没有文本的按钮，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n\
  图 24-1\n\n## 24.3 设置视图属性\n\n为了本次练习，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button`\
  \ 视图在黄色背景上显示为“Press Me”文本。这两项任务都可以通过如文代码片段所示，在 Java 代码中对视图上设置属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将将其作为\
  \ `String` 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，并修改它以为“Press\
  \ Me”字符串添加资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书剩余部分重复此步骤，许多后续代码示例将直接在代码中输入字符串。\n\
  \n一旦字符串存储为资源，就可以如下方式从代码内部访问：\n\n```java\ngetString(R.string.press_me);\n```\n\n\
  创建字符串资源后，在 `configureLayout()` 方法中添加代码以设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n现在编译并运行应用程序时，布局将反映这些设置。\n\n## 24.4 创建视图 ID\n\n布局将包含一个 `Button` 和一个 `EditText`。在\
  \ `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一 ID。此过程的第一步是创建一个资源文件。右键点击 `app -> res ->\
  \ values`，选择 `New -> Resource File` 选项并将文件命名为 `id`。创建资源文件后，编辑它使其内容如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <id name=\"myButton\"\
  \ />\n    <id name=\"editText\" />\n</resources>\n```\n\n在教程的此时，只创建了 `Button`，因此编辑\
  \ `configureLayout()` 方法将 ID 分配给对象：\n\n```java\nprivate void configureLayout() {\n\
  \    Button myButton = new Button(this);\n    myButton.setText(R.string.press_me);\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout` 视图将 `Button` 视图放置在左上角。要指示布局将按钮放置在不同位置（在本例中为水平和垂直居中），有必要创建一个\
  \ `ConstraintSet` 实例，使用适当设置对其进行初始化，并将其应用于父布局。对于此示例，需要配置按钮，使其宽度和高度限制为文本的大小并在父布局中居中：\n\
  \n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\nprivate void\
  \ configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(R.string.press_me);\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    setContentView(myLayout);\n\n    ConstraintSet\
  \ set = new ConstraintSet();\n    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.START, myLayout.getId(), ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, myLayout.getId(), ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, myLayout.getId(), ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, myLayout.getId(), ConstraintSet.BOTTOM, 0);\n\n    set.applyTo(myLayout);\n\
  }\n```\n\n配置好初始约束后，编译并运行应用程序，验证 `Button` 视图现在是否出现在布局中央：\n\n## 24.6 添加 EditText 视图\n\
  \n布局中下一个添加的项是 `EditText` 视图。第一步是创建 `EditText` 对象，为其分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。实现这些步骤的代码更改现在需要对\
  \ `configureLayout()` 方法进行如下修改：\n\n\n\n\n\n```java\nprivate void configureLayout()\
  \ {\n\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText myEditText = new EditText(this);\n    myEditText.setId(R.id.myEditText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(myEditText);\n    setContentView(myLayout);\n\
  }\n```\n\n`EditText` 控件的大小应根据其显示的内容进行调整，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处.在 `configureLayout()`\
  \ 方法中添加代码使其如下如下：\n\n```java\nset.connect(myButton.getId(), ConstraintSet.START,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.END,\n            ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n\
  set.connect(myButton.getId(), ConstraintSet.TOP,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\n\
  \                    ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(),\n\
  \                    ConstraintSet.WRAP_CONTENT);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.START,\n            ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\n\
  \            myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n\
  ```\n\n运行测试应用程序后，应显示 `EditText` 字段位于按钮上方，并留有 70dp 的间距。\n\n## 24.7 将密度无关像素 (dp) 转换为像素\
  \ (px)\n\n本次练习的下一个任务是将 `EditText` 视图的宽度设置为 200dp。正如名为\"Android Studio 布局编辑器 ConstraintLayout\
  \ 教程”的章节所述，在用户界面布局中设置尺寸和位置时，使用密度无关像素 (dp) 比使用像素 (px) 更好要使用 `dp` 设置位置，需要在运行时将 `dp`\
  \ 值转换为 `px` 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在该类中添加以下代码：\n\n```java\n\
  package com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\nimport\
  \ android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        int px = (int) TypedValue.applyDimension(\n                TypedValue.COMPLEX_UNIT_DIP,\
  \ value,\n                r.getDisplayMetrics());\n        return px;\n    }\n}\n\
  ```\n\n## 25.1 引入应用更改 (Apply Changes)\n\n在 Android Studio 的早期版本中，每次项目发生更改后都需要编译代码、将其转换为\
  \ Dex 格式并安装到设备上。完成这些步骤后，应用最终准备就绪。花费一分钟或更长时间并不罕见。\n\n## 25.2 理解应用更改选项\n\nAndroid\
  \ Studio 提供了三种对运行中的应用程序应用更改的方法，分别为“运行应用 (Run App)”、“应用更改并重启活动 (Apply Changes and\
  \ Restart Activity)”和“应用代码更改 (Apply Code Changes)这些选项可以总结如下：\n\n- **运行应用**：停止当前运行的应用并重启它。如果自启动以来项目未发生任何更改，此选项将仅重启应用。相反，如果项目发生了更改，Android\
  \ Studio 将在启动之前重新构建并将应用安装到设备或模拟器上。\n- **应用更改**：当对项目进行的更改仅涉及对现有方法体的修改，或者添加了新类或方法时，可以使用此选项。选中后，更改将应用到运行中的应用，无需重启应用或当前运行的活动。然而，当对任何项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类和其他结构性代码更改。\n\
  - **应用更改并重启活动**：选中后，此模式将动态应用项目内的任何代码或资源更改，并重启活动，而无需重新安装或重启应用。与“应用代码更改”选项不同，当项目代码和资源发生更改时，可以使用此选项。\n\
  \n## 25.3 使用应用更改\n\n现在已经涵盖了一些使用 Android Studio 的基本概念，现在是引入“应用更改”功能的好时机。正如所有经验丰富的开发者所知，等待应用编译的每一秒钟都是编写和完善代码的时间。\n\
  \n\n\n\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，它可以像往常一样使用工具栏上的运行（在图 25-1 中标记为 A）或调试（B）按钮来启动：\n\
  \n![](img/as_3.6_run_debug_toolbar_buttons.jpg)\n\n图 25-1\n\n在应用程序启动并运行后，运行按钮上的图标将更改，表示应用程序正在运行，并且\
  \ `Apply Changes`（应用更改）、`Restart Activity`（重启活动）和 `Apply Code Changes`（应用代码更改）按钮将如下方图\
  \ 25-2 所示启用：\n\n![](img/as_3.5_apply_changes_labelled_buttons.jpg)\n\n图 25-2\n\n\
  如果选择其中一个 `Apply Changes` 按钮后无法应用更改，Android Studio 将显示一条指示失败的消息并附带说明。例如图 25-3 显示了在对资源文件进行更改后选择\
  \ `Apply Code Changes` 选项时 Android Studio 显示的消息：\n\n![](img/as_apply_changes_resource_error.jpg)\n\
  \n图 25-3\n\n在这种情况下，解决方案是使用 `Apply Changes` 和 `Restart Activity` 选项（提供了相应的链接）。同样，当尝试应用涉及添加或删除方法的更改时，会出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击 `Run App`\
  \ 按钮以重新安装并启动应用程序。在这些情况下，作为手动手动选择正确选项的替代方案，可以配置 Android Studio 自动回退到执行 `Run App`\
  \ 操作。\n\n### 25.4 配置 Apply Changes 回退设置\n\n`Apply Changes` 回退设置位于 Android Studio\
