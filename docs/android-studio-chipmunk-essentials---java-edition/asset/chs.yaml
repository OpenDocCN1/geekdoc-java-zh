  \ Studio Primary/Detail Flow 教程\n\n本章将解释 Primary/Detail 界面设计概念，然后详细探讨 Android Studio\
  \ 包含的 Primary/Detail Flow 模板元素。我们将创建一个示例应用程序，演示修改模板以满足开发人员特定需求的步骤。\n\n### 51.1 \
  \ Primary/Detail Flow\n\nPrimary/Detail flow 是一种界面设计概念，其中向用户显示项目列表（称为主列表）。当选择列表中的某项时，与该项目相关的额外信息将在详细窗格中呈现给用户。\n\
  \n\n\n\n在横屏模式的平板电脑尺寸 Android 设备上，主列表显示在屏幕左边缘的窄垂直面板中。显示器的其余部分分配给详情面板，这种布局被称为双窗格模式（two-pane\
  \ mode）。例如，图 51-1 展示了主/详情双窗格布局，其中列出了主项目，并将项目一的内容显示在详情面板中：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  \n图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情面板则显示在独立的屏幕上，当从主列表中选择项目时该屏幕就会出现。在这种模式下，详情屏幕包含一个返回主列表的操作栏（action\
  \ bar）条目。例如，图 51-2 展示了在 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/as_detail_flow_phone.jpg)\n\
  \n图 51-2\n\n## 51.2 创建主/详情流 Activity\n\n在本章的下一节中，将详细介绍组成主/详情流模板的各个元素。实现此点的最佳方法是使用主/详情流模板创建一个项目，并在学习信息时使用它。该项目随后将作为章节末尾教程的基础。\n\
  \n虽然项目创建向导包含了选择主/详情流模板的选项，但在项目创建后添加 Activity 可以在配置模板方面获得更大的灵活性。\n\n从欢迎界面选择 `New\
  \ Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前先选择 `No Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `PrimaryDetailFlow`，并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。\n\
  \n项目创建完成后，在 Project（项目）工具窗口中，右键点击 `app` -> `java` -> `com` -> `ebookfrenzy` -> `primarydetailflow`\
  \ 项，并选择 `New` -> `Activity` -> `Primary/Detail Flow` 菜单选项。\n\n新建 Android Activity\
  \ 屏幕（图 51-3）提供了配置将在主/详情活动中显示的对象的机遇。在本章稍后的教程中，主列表将包含许多网站名称，选择这些名称时，会将选定的网站加载到详情面板中的\
  \ web view 中。考虑到这些需求，将 `Object Kind` 字段设置为 `“Website”`，并将 `Object Kind Plural` 设置为\
  \ `“Websites”`。\n\n![](img/as_4.2_primary_detail_flow_new_activity.jpg)\n\n图 51-3\n\
  \n在点击 Finish 按钮之前，请确保已启用 `Launcher Activity` 选项并将 `Source Language` 菜单设置为 `Java`。\n\
  \n## 51.3 修改主/详情流模板\n\n虽然主/详情流模板的结构初看起来可能令人困惑，但正如将要所示的，对于许多主/详情实现需求，模板提供的大部分功能可以保持不变。\n\
