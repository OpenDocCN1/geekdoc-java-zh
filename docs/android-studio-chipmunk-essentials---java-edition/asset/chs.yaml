  图 51-6\n\n### 51.10 总结\n\n用户界面由一个主列表组成，选择后会显示详细信息。WebsiteDetail 是 Android 提供的一个模板，可以快速方便地创建。正如本章所示，通过对默认文件进行一些修改，就可以实现广泛的功能。\n\
  \n---\n\n# 52. Intent 概述\n\n到本书的现在，应该清楚 Android 应用程序是由一个或多个活动组成的。然而，尚未详细涵盖的一个领域是活动触发另一个活动的机制。正如在“Android\
  \ 应用结构”章节（#App_Anatomy.xhtml__idAnchor249）中概述的，这主要通过 Intent 实现。\n\n在接下来的章节中通过一些\
  \ Android 示例实现之前，本章的目标是通过显式 Intent 和隐式 Intent 以及对过滤器的介绍来提供 Intent 的概述。\n\n## 52.1\
  \ Intent 概述\n\nIntent (`android.content.Intent`) 是活动可以启动另一个活动的消息系统。活动可以，例如，发布意图请求启动同一个应用程序内的另一个活动。然而，Intent\
  \ 也超出了这一概念，允许活动请求设备上任何已注册并配置了权限的服务。考虑例如，应用程序中的一个需要加载并显示网页的活动。与其让应用程序包含执行此任务的第二个活动，代码只需向\
  \ Android 运行时发送意图，请求任何注册了显示网页能力的活动。运行时系统会将请求与可用活动进行匹配，并启动匹配项，或者在存在多个匹配时允许用户决定使用哪一个活动。\n\
  \nIntent 还允许从发送活动向接收活动传输数据。在之前概述的场景中，例如，发送活动需要将要显示的 URL 发送给第二个活动。同样，接收活动也可以配置为在完成所需任务后返回数据给发送活动。\n\
  \n## 52.2 显式 Intent\n\n\n\n\n\n显式意图（Explicit intent）通过引用目标 Activity 的组件名称（实际上是类名）请求启动特定的活动。这种方法在启动与发送方位于同一应用程序中的\
  \ Activity 时最为常见（因为应用程序开发者已知类名）。\n\n显式意图是通过创建 `Intent` 类的实例来发出的，传入 Activity 上下文（context）和要启动的\
  \ Activity 的组件名称。然后调用 `startActivity()` 方法并将 `intent` 对象作为参数传递。例如，以下代码片段发布了一个启动类名为\
  \ `ActivityB` Activity 的意图：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  startActivity(i);\n```\n\n可以通过调用意图对象的 `putExtra()` 方法，在启动之前将数据添加到意图对象中，从而将其传输到接收的\
  \ Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向意图添加了键名为 `\"myString\"` 和 `\"myInt\"` 的\
  \ `String` 值和整数值：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\ni.putExtra(\"\
  myString\", \"This is a message for ActivityB\");\ni.putExtra(\"myInt\", 100);\n\
  startActivity(i);\n```\n\n目标 Activity 作为 `Bundle` 对象的一部分接收数据，该对象可以通过调用 `getIntent().getExtras()`\
  \ 获取。`Activity` 类的 `getIntent()` 方法返回启动该 Activity 的意图，而 `Intent` 类的 `getExtras()`\
  \ 方法返回一个包含数据的 `Bundle` 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n```java\nBundle extras =\
  \ getIntent().getExtras();\nif (extras != null) {\n    String myString = extras.getString(\"\
  myString\");\n    int myInt = extras.getInt(\"myInt\");\n}\n```\n\n当使用意图启动同一应用程序内的其他\
  \ Activity 时，必须将这些 Activity 列在应用程序清单文件（manifest file）中。以下 `AndroidManifest.xml`\
  \ 内容正确适用于一个包含名为 `ActivityA` 和 `ActivityB` Activity 的应用程序：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 52.3 从 Activity\
  \ 返回数据\n\n如上一节示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个 Activity（我们称为 `ActivityA`）。然而，可以通过将\
  \ `ActivityB` 启动为 `ActivityA` 的子 Activity（sub-activity）来实现这一点。通过创建 `ActivityResultLauncher`\
  \ 实例来启动子 Activity。通过调用 `registerForActivityResult()` 方法创建 `ActivityResultLauncher`\
  \ 实例，并以 lambda 表达式的形式传递回调处理程序。当子 Activity 返回时，该处理程序会被调用并传递返回数据。一旦创建了 `ActivityResultLauncher`\
  \ 实例，可以使用 `intent` 参数调用它来启动子 Activity。创建 `ActivityResultLauncher` 实例的代码如下：\n\n```java\n\
  ActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n   \
  \ new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器就绪，可以如下调用它并传递要启动的意图：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n要向父级\
  \ Activity 返回数据，子 Activity 必须实现 `finish()` 方法，其目的是创建一个包含数据的新 `intent` 对象，然后调用封装\
  \ Activity 的 `setResult()` 方法，传递结果代码和包含数据的 `intent`。结果代码通常是 `RESULT_OK` 或 `RESULT_ANCELED`，但也可以根据开发者的需求自定义值。如果子\
  \ Activity 崩溃，父级 Activity 将接收到 `RESULT_ANCELED` 代码。例如，以下代码说明了典型的子 Activity `finish()`\
  \ 方法：\n\n```java\npublic void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"\
  returnString\", \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n\
  \    super.finish();\n}\n```\n\n## 52.4 隐式意图（Implicit Intents）\n\n与引用要启动的 Activity\
  \ 类名的显式意图不同，隐式意图通过指定要执行的操作和接收 Activity 处理的数据类型来识别要启动的 Activity。例如，操作类型类型以 `URI`\
  \ 对象形式的网页 URL，将指示 Android 系统搜索并启动一个具备浏览器能力的 Activity。以下隐式意图在 Android 设备上执行时，会导致指定的网页在浏览器\
  \ Activity 中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"\
  https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n当上述隐式意图由 Activity\
  \ 发布时，Android 系统将搜索设备上能够处理 `http` 方案数据及 `ACTION_VIEW` 请求的 Activity。在系统使用隐式意图启动 Activity\
  \ 之前，该 Activity 必须经过验证或由用户启用。如果未满足其中任一条件，将无法启动该 Activity。在探索这些选项之前，我们首先需要讨论意图过滤器（intent\
  \ filters）。\n\n## 52.5 使用意图过滤器\n\n意图过滤器是 Activity 向 Android 意图解析过程声明支持的操作和数据处理能力的机制。这些声明还包含了执行链接验证所需的设置。以下\
  \ `AndroidManifest.xml` 文件演示了名为 `MyWebView` 的应用中名为 `WebActivity` 的 Activity 的配置，其包含了适当的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity\n        android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n\n\n\n\n此清单文件配置了\
  \ `WebActivity` 活动，当意图（intent）包含 `https://www.ebookfrenzy.com` URL 时，将响应来自另一个活动的隐式意图并启动该活动。例如，以下代码将启动\
  \ `WebActivity` 活动（假设用户已验证或启用了 `MyWebView` 应用支持链接）：\n\n```\nIntent intent = new\
  \ Intent(Intent.ACTION_VIEW,\n        Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n\nstartActivity(intent);\n```\n\n## 52.6 自动链接验证\n\n使用网页链接在 Android 设备上启动活动被认为具有潜在的安全风险。为了最大限度地降低这种风险，用于启动意图的链接必须经过自动验证，或者由用户在设备上手动添加为支持的链接。要启用自动验证，必须在目标活动中相应的意图声明中如下将\
  \ `autoVerify` 设置为 `true`：\n\n```xml\n<intent-filter android:autoVerify=\"true\"\
  >\n\n.\n.\n</intent-filter>\n```\n\n接下来，需要将链接 URL 与应用所在的网站关联。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接文件（Digital Assets Link）并将其安装在网站的 `.well-known` 文件夹实现的。\n\n数字资产链接文件包含一个关系语句（relation\
  \ statement），允许目标应用使用网站的链接 URL 启动，以及一个目标语句（target statement），声明配套应用的包名和该项目的 SHA-256\
  \ 证书指纹。一个典型的资产链接文件例如所示：\n\n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n  \"target\": {\n    \"namespace\": \"android_app\",\n    \"package_name\":\
  \ \"com.ebookfrenzy.mywebview\",\n    \"sha256_cert_fingerprints\":\n    [\"<在此处输入您的证书指纹>\"\
  ]\n  }\n}]\n```\n\n注意你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成它：\n\n`https://developers.google.com/digital-asset-links/tools/generator`\n\
  \n在开发 Android 应用时，`namespace` 值始终设置为`“android_app\"`，而 `package_name` 对应于由意图启动的应用包名。最后，证书指纹是用于构建应用的哈希值。当你测试应用时，这将是包含在\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <您的用户名>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在此处找到文件：\n\n`$HOME/.android/debug.keystore`\n\
  \n一旦找到文件，可以在终端或命令提示符窗口中运行以下命令获取 SHA 256 指纹：\n\n```bash\nkeytool -list -v -keystore\
  \ <在此处输入 debug.keystore 文件的路径>\n```\n\n提示密码时，输入`“android\"`，随后将出现包含 SHA 256 指纹的输出：\n\
  \n```\n.\n.\nCertificate fingerprints:\nSHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\n\
  SHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  .\n.\n```\n\n当你准备好构建应用的发布版本时，需要确保已将发布版的 SHA 256 指纹添加到资产文件中。生成发布版 keystore 文件的详细信息请参见[“创建、测试和上传\
  \ Android App Bundle”]章节。一旦拥有了发布版 keystore 文件，对其运行上述 `keytool` 命令以获取指纹。\n\n一旦你将数字资产文件放在网站的正确位置，在设备或模拟器上安装应用并等待\
  \ 30 秒以验证链接。要检查验证状态，在命令或终端提示符中运行以下命令：\n\n```bash\nadb shell pm get-app-links --user\
  \ cur com.example.mywebview\n```\n\n输出结果应包含链接已验证的确认：\n\n```\ncom.example.mywebview:\n\
  \    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n    www.ebookfrenzy.com:\n      User 0: {= true}\n\
  ```\n\n## 52.7 手动启用链接\n\n在无法通过上述步骤进行自动验证的情况下，唯一的选择是请求用户手动启用链接。这涉及启动目标应用的“默认打开”界面，用户可以在其中启用链接。由于突然出现“默认打开”界面可能会让用户感到困惑，建议显示解释性对话框。\n\
  \n为了提供用户手动启用链接的选项，在尝试启动意图之前需要执行以下代码：\n\n```java\n// 此处为显示需要启用链接的对话框的代码\nIntent intent\
  \ = new Intent(Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n        Uri.parse(\"\
  package:com.ebookfrenzy.mywebview\"));\nstartActivity(intent);\n```\n\n## 52.8 检查意图可用性\n\
  \n假设某个活动可以处理特定的意图是不明智的，特别是因为缺少匹配的操作通常会导致应用程序崩溃。坦率地说，可以在意图发送到运行时系统之前识别其可用性。可以使用以下方法来识别指定意图操作类型的活动可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntentActivities(intent,\n\
  \            PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n\
  }\n```\n\n## 52.9 总结\n\n\n\n\n意图（Intent）是一个 Android Activity 启动另一个 Activity 的消息机制。显式意图（Explicit\
  \ intent）通过类名引用接收 Activity 来指定要启动的特定 Activity。显式意图通常（但并非限于）用于启动同一应用程序内的 Activity。隐式意图（Implicit\
  \ intent）指定了要执行的操作和要处理的数据类型，并允许 Android 运行时找到匹配的 Activity 进行启动。隐式意图通常用于启动位于不同应用程序的\
  \ Activity。\n\n在使用隐式意图时，安全限制要求包含意图目标 Activity 的 App 在启动意图之前，必须先经过自动验证或由用户手动启用。自动验证涉及在链接\
  \ URL 对应的网站上放置数字资产链接（Digital Assets Link）文件。\n\nActivity 可以通过键值对的形式将数据封装在意图对象中，并发送给接收\
  \ Activity。只有当 Activity 作为发送 Activity 的子 Activity 启动时，才能从其返回数据。\n\nActivity 通过在应用清单文件中指定意图过滤器（intent-filters），向\
  \ Android 意图解析过程宣告其功能。发送和接收 Activity 都必须请求适当权限以执行诸如访问设备联系人数据库或互联网等任务。\n\n在涵盖了意图的理论后，接下来的章节将在\
  \ Android Studio 中创建一些示例，将显式和隐式意图付诸实践。\n\n# 53. Android 显式意图 – 实例演示\n\n标题为 Android\
  \ 意图概述的章节涵盖了使用意图启动 Activity 的理论。本章通过创建一个示例应用程序将该理论付诸实践。\n\n在本章中创建的 Android Studio\
  \ 应用项目将演示如何使用显式意图启动 Activity，包括在发送和接收 Activity 之间传输数据。下一章(Android Implicit Intents\
  \ – 实例演示)将演示隐式意图的使用。\n\n## 53.1 创建显式意图示例应用程序\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中选择“Empty\
  \ Activity”模板，然后点击“Next”（下一步）按钮。\n\n在`Name`字段中输入 `ExplicitIntent` 并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为 `API 26`：Android 8.0\
  \ (Oreo)，并将语言菜单设置为 Java。按照第 11.8 将项目迁移到 View Binding 节概述的步骤，将项目转换为使用 view binding。\n\
  \n## 53.2 设计 MainActivity 的用户界面布局\n\n`MainActivity` 的用户界面将由一个 `ConstraintLayout`\
  \ 视图组成，其中包含分别名为 `editText1`、`textView1` 和 `button1` 的 `EditText` 视图。使用 Project 工具窗口找到\
  \ `MainActivity` 的 `activity_main.xml` 资源文件（位于 `app -> res -> layout` 下），并双击将其加载到\
  \ Android Studio 布局编辑器工具中。选择并删除默认的“Hello World!” `TextView`。\n\n从调板中拖入 `TextView`\
  \ 小部件并将其放置在布局中心，并使用 Attributes（属性）工具窗口分配 ID 为 `textView1`。\n\n从调板中拖入 `Button` 对象并将其置于水平居中，且位于\
  \ `TextView` 底部边缘下方。更改文本属性使其显示为“Send Text”，并配置 `onClick` 属性以调用名为 `sendText` 的方法。\n\
  \n接下来，添加一个 Plain Text（纯文本）对象，使其水平居中并位于 `TextView` 顶部边缘上方。使用 Attributes 工具窗口移除分配给文本属性的“Name”字符串，并将\
  \ ID 设置为 `editText1`。布局完成后，点击工具栏上的 Infer constraints（推断约束）按钮以添加适当的约束：\n\n![](img/Image24342.jpg)\n\
  \n图 53-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send Text”字符串提取到名为 `send_text` 的资源中。布局完成后，用户界面应该类似于图\
  \ 53-2 所示所示：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n\n图 53-2\n\n## 53.3 创建第二个\
  \ Activity 类\n\n当用户触摸“Send Text”按钮时，将发出一个意图，请求启动第二个 Activity，用户可以在其中输入响应。因此，下一步是创建第二个\
  \ Activity。在 Project 工具窗口中，右键点击位于 `app -> java` 下的 `com.ebookfrenzy.explicitintent`\
  \ 包名，并选择 `New -> Activity -> Empty Activity` 菜单选项显示如图 53-3 所示的新 Android Activity\
  \ 对话框：\n\n![](img/as_4.2_intent_new_java_activity.jpg)\n\n图 53-3\n\n在 `Activity\
  \ Name` 和 `Title` 字段中输入 `SecondActivity`，并将布局文件命名为 `activity_second`，将语言菜单设置为 Java。由于该\
  \ Activity 在应用程序启动时不启动（它将在点击按钮时通过 `MainActivity` 的意图启动），因此在点击“Finish”按钮之前确保禁用 Launcher\
  \ Activity 选项是重要的。\n\n## 53.4 设计 SecondActivity 的用户界面布局\n\n第二个 Activity 用户界面所需的元素是纯文本\
  \ `EditText`、`TextView` 和 `Button` 视图。根据这些要求，将 `activity_second.xml` 布局加载到布局编辑器工具中并添加视图。\n\
  \n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `return` 的方法，且 `TextView` 和 `EditText` 视图分别分配了\
  \ `textView2` 和 `editText2`。完成后，布局应类似于图 53-4 所示。注意按钮上的文本（显示为“Return”）已提取到名为 `return_text`\
  \ 的字符串中。\n\n布局完成后，点击 Infer constraints 按钮为布局添加必要的约束：\n\n![](img/as_4.jpg)\n\n##\
  \ 53.5 检查应用清单\n\n为了让 `MainActivity` 能够使用意图启动 `SecondActivity`，有必要在 `AndroidManifest.xml`\
  \ 文件中存在 `SecondActivity` 条目。在 Project 窗口找到该文件（`app -> manifests`），双击将其加载到编辑器中并验证\
  \ Android Studio 是否已添加了该 Activity 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.explicitintent\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity\n        \
  \    android:name=\".SecondActivity\"\n            android:exported=\"true\" />\n\
  \        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"\
  true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n随着清单文件中创建并列出了第二个活动，现在是在向 `MainActivity` 类中编写一些代码来发出意图（intent）了。\n\n###\
  \ 53.6 创建意图（Intent）\n\n`MainActivity` 的目标是在用户点击“发送文本”（Send Text）按钮时创建并启动一个 `intent`。在意图创建过程中，用户在\
  \ `EditText` 视图中输入的字符串将以键值对的形式添加到意图对象中。在创建 `MainActivity` 的用户界面布局时，按钮对象已配置为在用户“点击”时调用名为\
  \ `sendText()` 的方法。现在需要将该方法添加到 `MainActivity` 类的 `MainActivity.java` 源文件中，如下所示：\n\
  \n```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n.\n\nimport android.content.Intent;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public\
  \ void sendText(View view) {\n        Intent i = new Intent(this, SecondActivity.class);\n\
  \        String myString = binding.editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循了“Android Intent 概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前活动和 `SecondActivity`\
  \ 的类名作为参数传递。接下来，将输入 `EditText` 对象的文本以键值对的形式添加到意图对象，并通过调用 `startActivity()` 启动意图，并将意图对象作为参数传递。\n\
  \n编译并运行应用程序，点击“发送文本”按钮启动 `SecondActivity`，并使用返回按钮（位于屏幕底部的工具栏中）返回 `MainActivity`。\n\
  \n### 53.7 提取意图数据\n\n现在 `SecondActivity` 已经从 `MainActivity` 启动，下一步是从意图中提取包含的 `String`\
  \ 类型数据值，并将其赋值给 `SecondActivity` 用户界面中的 `TextView` 对象。这涉及到除了将活动适配以使用视图绑定（view binding）之外，还需要在\
  \ `SecondActivity.java` 源文件的 `SecondActivity` 的 `onCreate()` 方法中添加一些代码：\n\n```java\n\
  package com.ebookfrenzy.explicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\npublic\
  \ class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器中或物理 Android\
  \ 设备上编译并运行应用程序。在点击“发送文本”按钮之前，在 `MainActivity` 的文本框中输入一些文本。该消息现在应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n### 53.8 将 SecondActivity 作为子活动启动\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，必须将 `SecondActivity` 作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，在 `SecondActivity` 返回时调用。此回调将提取 `SecondActivity`\
  \ 返回的数据并显示在 `textView1` 上。\n\n对 `registerForActivityResult()` 的调用返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 内部调用它来启动意图。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\n.\n\
  .\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  .\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startForResult.launch(i);\n    }\n}\n.\n```\n\n### 53.9 从子活动返回数据\n\
  \n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而 `MainActivity` 反过来也已修改以处理来自 `SecondActivity`\
  \ 返回的数据。剩下的只需修改 `SecondActivity.java` 以实现 `finish()` 方法，并为 `returnText()` 方法添加代码，该方法在点击“返回文本”按钮时被调用。`finish()`\
  \ 方法在活动退出时触发（例如当用户选择设备上的返回按钮时）：\n\n```java\npublic void returnText(View view) {\n\
  \    finish();\n}\n\n@Override\npublic void finish() {\n    Intent data = new Intent();\n\
  \    String returnString = binding.editText2.getText().toString();\n    data.putExtra(\"\
  returnData\", returnString);\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n`finish()` 方法需要做的只是创建一个新的 `intent`，将返回数据作为键值对添加，然后调用 setResult()` 方法传递结果代码和意图对象。`returnText()`\
  \ 方法简单地调用了 `finish()` 方法。\n\n## 53.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段中输入一个问题并点击“发送文本”按钮。当\
  \ `SecondActivity` 出现时，在 `EditText` 视图中输入文本，并使用返回按钮或“返回文本”按钮返回 `MainActivity`，响应应该出现在文本视图对象中。\n\
  \n## 53.11 总结\n\n在上一节中涵盖了意图的基础知识后，本节的目标是通过在 Android Studio 中创建一个应用程序项目，来演示显式意图的使用，以及父活动与子活动之间数据传输的概念。\n\
  \n下一节将通过一个示例演示隐式意图的实际操作。\n\n### 54. Android 隐式意图 – 实例详解\n\n在本节中，我们将在 Android Studio\
  \ 中创建一个应用程序项目，用于演示隐式意图的实际实现。目标是创建并发送一个请求加载并显示特定网页内容的请求。由于示例应用程序本身不包含执行此任务的活动，我们将发出一个隐式意图，以便\
  \ Android 意图解析算法识别并启动另一个应用程序中的合适活动。\n\n\n\n\n# 54.1 创建 Android Studio 隐式许可示例项目\n\
  \n在欢迎界面选择 `New Project`（新建项目），在弹出的新项目对话框中，点击 `Next` 按钮之前，选择 `Empty Activity` 模板。\n\
  \n在 `Name` 字段中输入 `ImplicitIntent`，并将包名指定为 `com.ebookfrenzy.implicitintent`。由于此示例将使用较新\
  \ Android 版本才有的功能，在点击 `Finish` 按钮之前，请将 `Minimum API level` 设置更改为 `API 31: Android\
  \ 12.0 (S)`，并将 `Language` 菜单改为 `Java`。\n\n## 54.2 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个\
  \ `ConstraintLayout` 和两个 `Button` 对象组成。在 `Project` 工具窗口中，找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件并双击它将其加载到 `Layout Editor`（布局编辑器）工具中。\n\n删除默认的 `TextView`，并在开启\
  \ `Autoconnect`（自动连接）模式的情况下在布局中放置 `Button` 控件，使其显示如下所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\
  \n图 54-1\n\n将按钮上的文本分别设置为 `Open Web Page` 和 `Enable Links`，并将文本提取到字符串资源。\n\n依次选择每个\
  \ `Button`，使用 `Attributes`（属性）工具窗口配置 `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink`\
  \ 的方法。\n\n# 54.3 创建隐式许可\n\n如上所述，隐式许可将在名为 `showWebPage()` 的方法内部创建并发布，该方法反过来需要在 `MainActivity`\
  \ 类中实现，其代码位于 `MainActivity.java` 源文件中。在 `Project` 工具窗口中找到该文件并双击它将其加载到编辑面板。加载后，修改代码以添加\
  \ `showWebPage()` 和 `enableLink()` 方法以及一些必要的 `import` 语句：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_implicit_intent);\n    }\n\n    public\
  \ void showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务实际上非常简单。首先，创建一个新的 `intent` 对象。然而，代码并没有指定许可的类名，而是使用 `ACTION_VIEW` 选项指示了许可的性质（向用户显示某些内容）。`intent`\
  \ 对象还包含一个包含要显示的 URL 的 `URI`。这告诉 Android 许可解析系统，该活动正在请求显示网页。然后通过调用 `startActivity()`\
  \ 方法发布该许可。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，运行后，触摸 `Show Web Page` 按钮。触摸时，应该出现一个浏览器视图并加载\
  \ URL 指定的网页。此时，一个成功的隐式许可已执行完毕。\n\n# 54.4 添加第二个匹配活动\n\n本章的剩余部分将用于演示当设备上安装了多个符合隐式许可要求的活动时产生的结果。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。首先在\
  \ `Android Studio` 中创建一个新项目，应用程序名称设置为 `MyWebView`，使用在本章早些时候创建 `ImplicitIntent` 项目时相同的\
  \ SDK 配置选项，并再次选择 `Empty Activity`。\n\n如果你有一个可以托管 `Digital Asset Links`（数字资产链接）文件的网站，并想尝试自动验证（auto\
  \ verification），请在指定包名时使用您的网站 URL。例如，如果您的网站托管在 `www.mycompany.com`，则包名需要设置为如下：\n\
  \n`com.mycompany.mywebview`\n\n如果你没有网站或不打算使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\
  \n点击 `Finish` 创建项目，然后按照第 11.8 节将项目迁移到 View Binding 节所述将项目转换为使用视图绑定（view bindings）。\n\
  \n# 54.5 将 WebView 添加到 UI\n\n新 `MyWebView` 项目中包含的唯一活动的用户界面将由 Android `WebView` 控件的实例组成。在\
  \ `Project` 工具窗口中，找到 `activity_main.xml` 文件（该文件包含活动的用户界面描述），双击它将其加载到 `Layout Editor`\
  \ 工具中。\n\n在 `Layout Editor` 工具的 Design 模式下，选择默认的 `TextView` 控件并使用键盘删除键将其从布局中移除。\n\
  \n从调板的 `Widgets` 部分将 `WebView` 对象拖放到现有的 `ConstraintLayout` 视图上，如图：\n\n![](img/as_implicit_intent_ui.jpg)\n\
  \n图 54-2\n\n在继续之前，将 `WebView` 的 ID 更改为 `webView1` 并使用任何缺失的约束。\n\n## 54.6 获取许可\n\n\
  当创建显示浏览器窗口的隐式许可时，网页的 URL 将封装在许可对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从许可中提取此\
  \ `Uri`，将其转换并赋值给 `WebView`。为了实现这一点，修改 `MainActivity.java` 文件如下：\n\n```java\npackage\
  \ com.ebookfrenzy.mywebview;\n\nimport java.net.URL;\nimport android.net.Uri;\n\
  import android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(),\n                    data.getHost(),\n\
  \                    data.getPath());\n        } catch (Exception e) {\n       \
  \     e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 方法的新代码执行了以下任务：\n- 获取触发此活动的许可引用\n- 从许可中提取 `Uri`\
  \ 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到网络视图，在此过程中将 `URL` 转换为 `String`\n\n\
  # 54.7 修改 MyWebView Manifest 文件\n\n在测试 `MyWebView` 之前，必须对 `MyWebView`清单文件进行若干更改。首先，该活动需要访问互联网的权限（因为它需要加载网页）。通过向清单文件中添加适当的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，检查 `MyWebView` 项目 `AndroidManifest.xml` 文件中 `intent-filter` 部分的内容，将显示以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n\n\n\n在上述 XML 中，`android.intent.action.MAIN` 条目表示该活动在没有任何数据输入的情况下启动时是应用程序的入口。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该活动应该列在设备的应用程序启动器屏幕中。\n\n由于该活动不需要作为应用程序的入口启动，无法在没有数据输入（在此情况下为 URL）的情况下运行，且不需要显示在启动器中，因此清单文件中不需要为此活动设置\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` 活动的意图过滤器（intent filter）需要修改，以表明它可以处理针对\
  \ `http` 数据方案的 `ACTION_VIEW` 意图操作。\n\nAndroid 要求任何处理隐式意图但不包含 `MAIN` 和 `LAUNCHER`\
  \ 条目的活动必须在意图过滤器中包含所谓的 `able` 和 `default` 类别。因此，修改后的意图过滤器部分应如下，其中 `<website url>`\
  \ 被替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你在创建 `MyWebView` 项目时使用的包名：\n\n```xml\n<intent-filter\
  \ android:autoVerify=\"true\">\n    <action android:name=\"android.intent.action.VIEW\"\
  \ />\n    <category android:name=\"android.intent.category.BROWSABLE\" />\n    <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n    <data android:scheme=\"\
  https\" />\n    <data android:host=\"<website url>\"/>\n</intent-filter>\n```\n\n\
  汇总这些要求得到了如下完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过双击 Project 工具窗口中的文件名，将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载完成，请修改 XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对清单文件进行适当的修改后，新活动已准备好安装到设备上。\n\
  \n### 54.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动可以作为隐式意图的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件既不包含\
  \ `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER` 设置，需要指示 Android\
  \ Studio 仅安装但不启动应用。要配置此行为，请如[图 54-3]所示，从工具栏中选择 app -> `Edit configurations…` 菜单。\n\
  \n## 54.9 测试应用程序\n\n通过双击 Project 工具窗口中的文件名，将 `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载完成，请修改\
  \ XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对清单文件进行适当的修改后，新活动已准备好安装到设备上。\n\n### 54.10 手动启用链接\n\
  \n对清单文件进行适当的修改后，新活动已准备好安装到设备上。\n\n### 54.11 自动链接验证\n\n如果你选择为 MyWebView 包名使用你自己的网站\
  \ URL，现在可以执行自动链接验证的额外步骤。首先从你一直测试的设备或模拟器上卸载 MyWebView 应用。在 Digital Asset Links 文件放置于网站后，我们将重新安装应用以触发验证过程。\n\
  \n## 54.12 总结\n\n\n\n\n隐式意图提供了一种机制，允许一个活动请求另一个活动的服务，这只需指定操作类型，以及（可选的）执行该操作所需的数据。然而，要成为隐式意图的目标候选者，该活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，包括适当的权限和意图过滤器。包含目标活动的应用程序还必须通过数字资产链接（Digital\
  \ Asset Links）文件进行验证或由用户手动启用。\n\n在本章中，我们创建了一个示例来演示隐式意图的发送、能够处理此类意图的示例活动的创建，以及链接验证过程。\n\
  \n# 55. Android 广播意图与广播接收器\n\n意图（Intent）除了提供了启动应用程序活动的机制外，还被用于向系统的其他组件广播系统级消息。这涉及`Broadcast\
  \ Intents”（广播意图）和`Broadcast Receivers”（广播接收器）的实现，两者都是本章的主题。\n\n## 55.1 广播意图概述\n\n\
  广播意图是 `Intent` 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或\
  \ `sendOrderedBroadcast()` 方法进行广播（后者在需要广播结果时使用）。除了在应用程序组件之间提供消息和事件系统外，广播意图还被 Android\
  \ 系统用于通知感兴趣的应用程序有关关键系统事件（例如外部电源或耳机的连接或断开）。\n\n在创建广播意图时，除了可选的数据和类别字符串外，它必须包含一个操作字符串（action\
  \ string）。与标准意图一样，数据使用意图对象的 `putExtra()` 方法结合键值对被添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()`\
  \ 方法分配给广播意图。\n\n用于标识广播事件的操作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行早于\
  \ 3.0 的 Android 版本的设备上成功启动相应的广播接收器。然而，在较新版本的 Android 中，该意图将不会被广播接收器接收。这是因为 Android\
  \ 3.0 引入了一种启动控制安全措施，防止通过意图启动已停止应用程序的组件。如果应用程序刚刚安装且之前从未启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。然而，为了解决这个问题，可以在发送意图之前向其添加一个标记，以指示允许该意图启动停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照此处对上代码段的适配方式中使用：\n\n```\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 55.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `AndroidBroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。然后，可以在代码中注册广播接收器（例如在活动内部），也可以在清单文件中注册。注册实现的一部分涉及创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串实现的。当检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟的时间在返回之前执行任何必要的任务。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android 运行时系统将在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码概述了一个模板广播接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \n    public MyReceiver() {\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在检测到\n        // 广播时，在此处实现要执行的代码\n    }\n\
  }\n```\n\n在清单文件内中注册广播接收器时，必须为接收器添加一个 `<receiver>` 条目。\n\n以下示例清单文件注册了上述示例广播接收器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.example.broadcastdetector.broadcastdetector\"\
  \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk\
  \ android:minSdkVersion=\"17\" />\n    <application android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\" >\n        <receiver android:name=\"\
  MyReceiver\" />\n    </application>\n</manifest>\n```\n\n在早于 8.0 的 Android 版本上运行时，与接收器关联的意图过滤器可以放在清单文件的接收器元素内，如下所示：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须使用 `Activity` 类的 `registerReceiver()` 方法结合适当配置的 `IntentFilter`\
  \ 对象在代码中注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法来注销它，并传递接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n必须记住，某些系统广播意图只有当接收器在代码中注册而非清单文件中注册时才能被检测到。可以在在线查看\
  \ Android `Intent` 类文档获取系统广播意图及相应要求的详细概述：\n\n[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 55.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起活动无法从获取该广播的广播接收器接收结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。\n\n\n\n\n\n`sendOrderedBroadcast()` 方法的调用包含多个参数，其中包含一个指向另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器处理完\
  \ `intent` 后，该接收器将收到通知；同时也包含一组数据引用，这些接收器可以将结果数据放入其中。当所有广播接收器都获得了机会处理广播后，结果接收器的 `onReceive()`\
  \ 方法将被调用并传递结果数据。\n\n## 55.4 粘性广播意图 (Sticky Broadcast Intents)\n\n默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理就会消失。然而，可以将广播意图定义为“粘性”（sticky）。粘性意图及其包含的数据在执行完成后仍保留在系统中。粘性广播意图中存储的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，使用通常的参数（指向广播接收器和意图过滤器对象的引用）。许多 Android 系统广播都是粘性的，一个典型的例子是与电池电量状态相关的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将要移除的广播意图的引用作为参数传递。\n\n## 55.5 广播意图示例\n\
  \n本章的剩余部分将实现一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序，用于发送自定义广播意图。随后将创建一个相应的广播接收器，当检测到广播时，它会在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器，以检测系统关于外部电源已从设备断出的通知。\n\n## 55.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Activity` 模板。\n\n\
  在 `Name` 字段中输入 `SendBroadcast`，并指定包名为 `com.ebookfrenzy.sendbroadcast`。点击 `Finish`（完成）按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改 `Java`。\n\
  \n一旦创建了新项目，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml` 布局文件，并在\
  \ `Design` 模式下使用 `Layout Editor` 工具，将 `TextView` 对象替换为 `Button` 视图，并设置 `text` 属性显示为“Send\
  \ Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取到命名为 `send_broadcast` 的资源中。\n\n在布局仍选中按钮的情况下，在\
  \ Attributes 面板中找到 `onClick` 属性，并将其配置为调用名为 `broadcastIntent` 的方法。\n\n## 55.7 创建并发送广播意图\n\
  \n创建了 `SendBroadcast` 应用程序的框架后，现在是时候实现发送广播意图的代码了。这涉及实现之前指定的作为用户界面 `Button` 视图 `onClick`\
  \ 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此实例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章随后的部分创建广播接收器类时，意图过滤器声明必须与此\
  \ action 字符串匹配。\n\n发送广播意图的应用程序创建此结束。剩下的就是构建匹配的广播接收器。\n\n## 55.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子自\
  \ `BroadcastReceiver` 超类的新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从生成的菜单中，选择\
  \ `New -> Other -> Broadcast Receiver` 选项，将类命名为 `MyReceiver` 并确保勾选 `Exported` 和\
  \ `Enabled` 选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类能够接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\
  \n一旦创建，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: This method is called when the BroadcastReceiver\
  \ is receiving\n        // an Intent broadcast.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n如代码所示，Android Studio 为类生成了一个模板，并为 `onReceive()`\
  \ 方法生成了一个存根。需要对类进行一些更改以实现所需的行为。在 `MyReceiver.java` 文件中，因此修改代码如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: This method\
  \ is called when the BroadcastReceiver is receiving\n        // an Intent broadcast.\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \     Toast.makeText(context, \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n\n广播接收器的代码现在完成了。\n\n## 55.9 注册广播接收器\n\n项目需要公示广播接收器的存在，并包含一个意图过滤器来指定接收器感兴趣的广播意图。在上上一节创建\
  \ `BroadcastReceiver` 类时，Android Studio 已在清单文件中添加了 `<receiver>` 元素。因此，剩下的是在 `MainActivity.java`\
  \ 文件中添加代码创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n.\n\
  \n.\n\nimport android.content.BroadcastReceiver;\nimport android.content.IntentFilter;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n    BroadcastReceiver\
  \ receiver;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        configureReceiver();\n    }\n\n    private void configureReceiver() {\n\
  \        IntentFilter filter = new IntentFilter();\n        filter.addAction(\"\
  com.ebookfrenzy.sendbroadcast\");\n        receiver = new MyReceiver();\n      \
  \  registerReceiver(receiver, filter);\n    }\n\n.\n\n.\n}\n```\n\n在不再需要接收器时，注销广播接收器也是重要的：\n\
  \n```java\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n   \
  \ unregisterReceiver(receiver);\n}\n```\n\n## 55.10 测试广播示例\n\n\n\n\n要测试广播发送端和接收端，请在设备或\
  \ AVD 上运行 `SendBroadcast` 应用并等待它显示在屏幕上。运行后，点击按钮，此时应该弹出一个显示“Broadcast Intent Detected.”的吐司（toast），持续几秒钟后消失。\n\
  \n## 55.11 监听系统广播\n\n本示例的最后一个阶段是修改广播接收器的意图过滤器（intent filter），使其也能监听当外部电源断开设备时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n              \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种广播意图，因此最好修改代码，使当前意图的动作字符串也显示在吐司消息中。该字符串可以通过调用作为\
  \ `onReceive()` 方法参数传递的 `intent` 对象的 `getAction()` 方法获取：\n\n```java\npublic void\
  \ onReceive(Context context, Intent intent) {\n    String message = \"Broadcast\
  \ intent detected \"\n                     + intent.getAction();\n    Toast.makeText(context,\
  \ message,\n             Toast.LENGTH_LONG).show();\n}\n```\n\n重新安装修改后的 `SendBroadcast`\
  \ 程序包来测试接收器。在 `SendBroadcast` 应用中点击按钮现在应该产生一个包含自定义动作字符串的新消息：\n\n`Broadcast intent\
  \ detected com.ebookfrenzy.sendbroadcast`\n\n接下来，拔掉当前为 Android 设备供电的 USB 连接器，此时接收器将在吐司消息中报告以下内容。如果应用运行在模拟器上，请显示扩展控制，选择\
  \ Battery（电池）选项并将 Charger（充电器）连接设置为 None。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免设备每次断开电源时都出现此消息，请启动设备上的 Settings（设置）应用并选择 Apps（应用）选项。在生成的列表中选择 `SendBroadcast`\
  \ 应用并点击 Uninstall（卸载）按钮。\n\n## 55.12 总结\n\n广播意图是一种机制，可以发布意图供 Android 系统上的多个组件消费。通过注册\
  \ `Broadcast Receiver`（广播接收器）来检测广播，接收器被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器在检测到匹配意图并被系统唤醒之前保持休眠。Android\
  \ 系统也使用广播意图来发布事件通知，例如低电警告或外部电源的连接或断开。\n\n除了提供广播意图和接收器的概述外，本章还通过示例演示了发送广播意图以及实现监听自定义和系统广播意图的接收器。\n\
  \n## 56. Java Threads、Handlers 和 Executors 概述\n\n下一章将是系列章节中的第一个，旨在介绍使用 Android Services\
  \ 在后台执行应用任务。然而，如果不首先 get Android Android 应用中线程的基本概念，就不可能理解实现服务涉及的步骤。因此，线程、线程处理器和执行服务是本章的主题。\n\
  \n## 56.1 线程概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程内的微进程，其目的是使应用程序内部至少表现出并行执行路径的效果。\n\
  \n### 56.2 应用主线程\n\n当 Android 应用首次启动时，运行时系统会创建一个单线程，所有应用组件默认将在该线程中运行。此线程通常被称为主线程（main\
  \ thread）。主线程的主要作用是在事件处理方面处理用户界面，并与用户界面中的视图进行交互。在应用内启动的任何额外组件默认也会运行在主线程上。\n\n应用程序中任何使用主线程执行耗时任务的组件都将导致整个应用程序看起来像锁定了，直到任务完成。这通常会导致操作系统向用户显示“应用未响应（Application\
  \ is not responding）”的警告。显然，这对于任何应用程序来说都不是理想的行为。这可以通过将将要执行的任务在单独线程中启动来避免，允许主线程不受阻碍地继续处理其他任务。\n\
  \n### 56.3 线程处理器 (Thread Handlers)\n\n显然，Android 开发的关键规则之一是绝不要在应用的主线程上执行耗时操作。第二个同样重要的规则是，在独立线程中的代码在任何情况下都绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内执行。之所以这样做，是因为 Android UI 工具包不是线程安全的。在多个线程内部与非线程安全的代码工作通常会导致间歇性问题和不可预测的应用行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主线程同步来实现。这通过在主线程中创建一个 handler 来实现，handler 反而接收来自另一个线程的消息并并更新用户界面。\n\
  \n## 56.4 线程示例\n\n本章的剩余部分将通过一些简单的示例提供对线程的入门介绍。第一步将强调在离开主线程的独立线程中执行耗时任务的重要性。\n\n\
  启动 Android Studio，从欢迎界面选择 New Project（新建项目）选项，在生成的项目对话框中，在点击 Next（下一步）按钮之前选择 Empty\
  \ Activity 模板。\n\n在 Name（名称）字段中输入 `ThreadExample`，并指定 `com.ebookfrenzy.threadexample`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单改为\
  \ Java。按照第 11.8 节 Migrating a Project to View Binding（将项目迁移到 View Binding）中的步骤将项目转换为使用\
  \ view binding。\n\n## 56.5 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 Layout Editor（布局编辑器）工具中。选择默认的\
  \ TextView 组件并在 Properties（属性）工具窗口中将视图的 ID 更改为 `myTextView`。\n\n在用户界面上添加一个 `Button`\
  \ 视图，位于现有 `TextView` 对象正下方，如图 56-1 所示。添加按钮后，点击工具栏上的 Infer Constraints（推断约束）按钮以添加缺失的约束。\n\
  \n将文本更改为“Press Me”并提取为名为 `press_me` 的资源。在布局中仍选中按钮视图时，找到 `onClick` 属性并输入 `buttonClick`\
  \ 作为方法名。\n\n![](img/as_4.2_threadexample_ui.jpg)\n\n图 56-1\n\n\n\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板中，并为 `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在在\
  \ `TextView` 对象上显示不同文本之前简单暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来像冻结了。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序为无响应，如图\
  \ 56-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\n图 56-2\n\n显然，`buttonClick()`\
  \ 方法中任何需要时间完成的任务都需要在单独线程中执行。\n\n## 56.6 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式来简化 `runnable` 的声明。此更改将导致以下声明：\n\n```java\nRunnable runnable =\
  \ () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while\
  \ (System.currentTimeMillis() < endTime) {\n        synchronized (this) {\n    \
  \        try {\n                wait(endTime - System.currentTimeMillis());\n  \
  \          } catch (Exception e) {\n            }\n        }\n    }\n};\nThread\
  \ myThread = new Thread(runnable);\nmyThread.start();\n```\n\n现在运行应用程序时，点击按钮会导致延迟在一个新的线程中执行，从而留出主线程继续处理用户界面。事实上，每次点击按钮都会创建一个新线程，允许任务并发执行。仔细检查用于\
  \ `buttonClick()` 方法的更新代码，可以发现更新 `TextView` 的代码已被移除。正如之前所说的，从主线程以外的线程更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，将需要为该线程实现一个 `Handler`。\n\n## 5.7 实现线程 Handler\n\n\
  线程 Handler 在应用程序的主线程中实现，主要用于响应由在应用程序进程内的其他线程发送的消息对用户界面进行更新。Handler 继承自 `Handler`\
  \ 类，可以通过指定要由线程执行的 `Runnable` 来使用，也可以通过重写 `Handler` 子类中的 `handleMessage()` 回调来使用，该回调将在线程向\
  \ handler 发消息时被调用。\n\n为了本例的目的，将实现一个 `handler` 以从之前创建的线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android 编辑器并修改代码，为 activity 添加一个 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个 `handler`，并在该 handler\
  \ 中实现了 `handleMessage()` 回调，当线程向 handler 发送消息时该回调将被调用。在此实例中，代码仅在用户界面的 `TextView`\
  \ 对象上显示一个字符串。现在只需修改在 `buttonClick()` 方法中创建的线程，在延迟完成后向 `handler` 发送消息：\n\n```java\n\
  public void buttonClick(View view) {\n    Runnable runnable = () -> {\n        long\
  \ endTime = System.currentTimeMillis() + 20 * 1000;\n        while (System.currentTimeMillis()\
  \ < endTime) {\n            synchronized (this) {\n                try {\n     \
  \               wait(endTime - System.currentTimeMillis());\n                } catch\
  \ (Exception e) {\n                }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了 `handler` 的 `sendEmptyMessage()`。由于 handler 目前对对收到的消息不做任何操作，它发送的是空消息。编译并运行应用程序，并在执行时点击按钮。20\
  \ 秒后新文本将出现在 `TextView` 中。\n\n## 5.8 向 Handler 传递消息\n\n虽然上一个示例触发了 `handleMessage()`\
  \ 回调，但它没有利用消息对象发送数据。在教程的此阶段，将进一步修改示例以在线程和 handler 之间传递数据。首先，`buttonClick()` 方法中更新的线程将从系统获取日期和时间并将将其存储在\
  \ `Bundle` 中。然后调用 handler 的 `obtainMessage()` 来获取消息对象。最后，在通过调用 handler 对象的 `sendMessage()`\
  \ 发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View view) {\n \
  \   Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n\n\n\n接下来，更新处理器的 `handleMessage()` 方法，以从消息中的 `bundle` 对象提取日期和时间字符串，并将其显示在\
  \ `TextView` 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮现在是否会在线程结束后在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n# 56.9 Java Executor 并发性\n\n在本章到目前为止，我们只查看了直接创建和管理\
  \ Java 线程。虽然对于简单的多线程任务这种方法是可以接受的，但在处理涉及大量线程的复杂情况时，这可能被证明是不够的。例如，启动和停止线程涉及到系统开销。因此，创建和销毁大量线程的应用程序面临着性能下降的风险。基础线程\
  \ API 也没有提供用于调度或重复任务执行、或从任务中返回结果的预构建选项。\n\n通过使用 Java 并发框架的 `Executor` 类（属于 `java.util.concurrent`\
  \ 包的一部分），可以克服直接处理线程的缺点。该框架允许创建活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以被重用于其他任务，而无需不断地创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态，以及调度任务在超时后或按重复的时间间隔运行。\n\n\
  ## 56.10 使用 Runnable 任务\n\n探索此框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable(){\n        public void run(){\n            long\
  \ endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程上执行。然而，对方法的更改需要一些解释。首先，从\
  \ `Executors` 实例获取 `ExecutorService` 实例的引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个仅包含一个线程的池。可以通过以下方式请求具有指定线程数量的池：\n\n`ExecutorService executor = Executors.newFixedThreadPool(10);`\n\
  \n接下来，通过调用执行器实例的 `submit()` 方法在线程上启动一个 `Runnable` 任务：\n\n`executor.submit(new Runnable(){\
  \ public void run(){ long endTime = System.currentTimeMillis() + 20 * 1000; } });`\n\
  \n注意，上述声明可以通过转换为 lambda 来简化：\n\n`executor.submit(() -> { long endTime = System.currentTimeMillis()\
  \ + 20 * 1000; });`\n\n从现在起，任务将一直运行到完成。然而，执行器服务将继续运行。如果你不再需要该服务，则应该关闭它。\n\n### 5.11\
  \ 关闭 Executor Service\n\n`ExecutorService` 提供了几项启动关闭的技巧。要通知服务在当前正在运行的任务完成后应关闭，应按如下所示调用\
  \ `shutdown()`：\n\n`executor.shutdown();`\n\n另一方面，调用 `shutdownNow()` 会停止服务上运行的所有任务，并取消对待处理任务的处理：\n\
  \n`executor.shutdownNow();`\n\n### 5.12 使用 Callable 任务和 Futures\n\n如前所述，`ExecutorService`\
  \ 支持名为 `Callable` 的可调用任务，该任务能够在任务完成后返回结果。运行在单独线程上的任务预计需要一些时间才能完成（否则，它们最初可能根本不需要在单独线程上运行）。这产生了一个问题：如何将结果返回到启动任务的线程代码中？这是通过\
  \ `Future` 类型实现的，它代表在未来某个时刻将提供的值。\n\n当执行可调用任务时，它会返回一个 `Future` 实例，应用程序随后可以使用它在任务完成后获取结果。要查看此操作，首先开始编辑\
  \ `activity_main.xml` 文件，添加一个标记为“Status”的额外按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 的方法：\n\n![](img/as_4.2_threadexample_status_button.jpg)\n图 56-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务配置为通过 `Future` 变量返回 `String` 值：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public buttonClick(View view) {\n       \
  \ ExecutorService executor = Executors.newSingleThreadExecutor();\n        future\
  \ = executor.submit(new Callable<String>() {\n            public String call() {\n\
  \                long endTime = System.currentTimeMillis() + 10 * 1000;\n      \
  \          while (System.currentTimeMillis() < endTime) {\n                    synchronized\
  \ (this) {\n                        try {\n                            wait(endTime\
  \ - System.currentTimeMillis());\n                        } catch (Exception e)\
  \ {\n                        }\n                    }\n                }\n     \
  \           return \"Task Completed\";\n            }\n        });\n        executor.shutdown();\n\
  \    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future` 包并声明一个存储字符串值的 `Future` 变量外，对启动任务的方式也进行了更改：\n\
  \n`future = executor.submit(new Callable<String>() {`\n\n这里的关键点是，我们不再向执行器服务提交 `Runnable`\
  \ 任务，而是传递一个 `Callable` 任务（声明为返回 `String` 值）。同样注意任务的结果被赋值给 `Future` 变量。最后，添加了返回语句以返回字符串值：\n\
  \n`return \"Task Completed\";`\n\n### 5.13 处理 Future 结果\n\n`buttonClick()` 方法现在配置为启动一个\
  \ `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果可用。一种方案是调用 `Future` 变量的\
  \ `get()` 方法。由于该方法在执行失败或被中断时能够抛出异常，因此必须在 try/catch 语句中执行，如下所示：\n\n```java\nString\
  \ result = null;\ntry {\n```\n\n\n\n\n\n```java\nresult = future.get();\n\n} catch\
  \ (ExecutionException | InterruptedException e) {\n    e.printStackTrace();\n}\n\
  ```\n\n遗憾的是，`get()` 方法将阻塞当前线程，直到正在运行的任务完成，这违背了最初在单独线程中运行任务的初衷。另一个选项是为 `get()` 方法提供一个超时时间，之后它将返回控制权。例如，以下代码会导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n然而，更好的替代方案是调用 `Future` 实例的 `isDone()` 方法来检查状态，并在任务完成后调用 `get()` 方法。要实现这种行为，请在\
  \ `MainActivity.java` 文件中添加如下 `statusClick()` 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if (future.isDone()) {\n        String\
  \ result = null;\n        try {\n            result = future.get(3, TimeUnit.SECONDS);\n\
  \        } catch (ExecutionException | InterruptedException | TimeoutException e)\
  \ {\n            e.printStackTrace();\n        }\n        binding.myTextView.setText(result);\n\
  \    } else {\n        binding.myTextView.setText(\"Waiting\");\n    }\n}\n```\n\
  \n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，`TextView` 中将显示“Waiting”消息。一旦任务完成，`isDone()`\
  \ 方法将返回 `true` 值，调用 `get()` 方法并将任务返回的字符串（“Task Complete”）显示在 `TextView` 上。\n\n##\
  \ 56.14 任务调度\n\n最后要涵盖的内容涉及使用 `ExecutorService` 来调度任务执行。这涉及到使用 `ScheduledExecutorService`\
  \ 实例，通过传递 `Runnable` 任务并调用 `schedule()` 方法。例如，以下代码在可选的 30 秒延迟后调度任务，并访问剩余延迟：\n\n\
  ```java\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
  Runnable task = () -> {\n    // 在此处执行任务\n};\nScheduledFuture<?> future = executor.schedule(task,\
  \ 30, TimeUnit.SECONDS);\nlong delayRemaining = future.getDelay(TimeUnit.SECONDS);\n\
  ```\n\n同样，`ScheduledExecutorService` 可用于在初始延迟后定期间隔重复执行任务。例如，以下代码在 30 秒初始延迟后每 10\
  \ 秒执行一次任务：\n\n```java\nexecutor.scheduleAtFixedRate(task, 30, 10, TimeUnit.SECONDS);\n\
  ```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成都会启动下一个任务实例。要指定任务结束与下次执行开始之间的固定时间，请使用\
  \ `scheduleWithFixedDelay()` 方法。在示例中，第一个任务在 0 秒延迟后调度，每个后续执行在上任务完成 10 秒后进行：\n\n```java\n\
  executor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\n## 56.15\
  \ 总结\n\n本章的目标是提供 Android 应用的线程概述。当应用首次启动时，运行时系统创建一个主线程，所有随后启动的应用组件都在其中运行。主线程的主要作用是处理用户界面，因此在该线程中执行任何耗时任务都会导致应用看起来卡死。因此，将可能需要时间完成的任务在单独线程中启动是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程对用户界面进行更改。可以通过在主线程中创建一个 `handler` 来实现用户界面更改，从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java 并发框架的执行器服务（executor services）。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果返回以及执行调度。\n\
  \n# 57. Android 服务概述\n\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与广播接收器（旨在快速执行任务后退出）不同，服务设计用于执行需要长时间才能完成的任务（例如通过互联网连接下载文件或向用户流传输音乐），但这些任务不需要用户界面。在本章中，将涵盖可用不同类型的概述，包括启动服务（started\
  \ services）、绑定服务（bound services）和意图服务（intent services）。在涵盖这些基础后，后续章节将介绍多个服务的运行示例。\n\
  \n## 57.1 启动服务 (Started Services)\n\n启动服务由其他组件（如 Activity 或广播接收器）启动，并可能无限期，直到服务停止或被\
  \ Android 系统销毁以释放资源。如果启动它的应用程序不再处于前台，服务将继续运行。\n\n默认情况下，服务将在启动它的应用程序相同的主线程中运行（称为本地服务）。因此，确保任何\
  \ CPU 密集型任务都在新线程中执行是非常重要的。指示服务在单独的进程中运行（因此称为远程服务）需要在清单文件（manifest）中更改配置。\n\n除非服务被专门配置为私有（再次通过清单文件中的设置），否则该服务由同一\
  \ Android 设备上的其他组件启动。这是通过使用 Intent 机制实现的，就像一个 Activity 启动另一个 Activity 一样。\n\n启动服务通过调用\
  \ `startService()` 方法启动，传递一个识别启动服务的对象作为参数。当启动服务完成任务后，它应该通过调用 `stopSelf()` 停止自己。或者，运行的服务可以通过另一个组件通过调用\
  \ `stopService()` 方法停止，传递匹配的 Intent 作为参数。服务被 Android 系统赋予高优先级，通常是释放资源时最后被终止的之一。\n\
  \n## 57.2 意图服务 (Intent Service)\n\n如前所述，服务默认在启动它的组件相同的主线程中运行。因此，需要由服务执行的任何 CPU 密集型任务应在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个派生自 `Service` 类的便利类，它设置了一个工作线程来处理后台任务，并以异步方式处理每个请求。一旦服务处理了所有队列请求，它将直接退出。使用\
  \ `JobIntentService` 类仅需要实现 `onHandleWork()` 方法，其中包含每个请求要执行的代码。\n\n\n\n\n对于不需要对请求进行同步的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务则需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n## 57.3\
  \ 绑定服务 (Bound Service)\n\n绑定服务与启动服务（started service）类似，区别在于启动服务通常不会返回结果，也不允许与启动它的组件进行交互。相反，绑定服务允许启动组件与服务进行交互并从服务处接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨进程边界进行。例如，一个\
  \ activity 可能会启动一个服务来处理音频播放。该 activity 极可能包含一个用户界面，为用户提供暂停播放或跳到下一曲目的的控制控件。同样，服务很可能需要向调用的\
  \ activity 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一曲目的详情。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到同一个服务。当客户端不再需要服务绑定时，应调用 `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，Android\
  \ 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用 `startService()` 来启动。一旦启动，组件就可以通过 `bindService()`\
  \ 调用绑定到它。当绑定服务通过调用 `startService()` 启动时，即使在最后一个客户端从其取消绑定后，它仍将继续运行。\n\n绑定服务必须包含 `onBind()`\
  \ 方法的实现，该方法在服务首次创建时以及其他客户端随后绑定到运行中的服务时都会被调用。该方法的目的是向绑定的客户端返回一个类型为 `IBinder` 的对象，该对象包含了客户端与服务进行通信所需的信息。\n\
  \n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务之间是位于相同进程还是不同的进程中，以及服务是否对客户端私有。本地通信可以通过扩展 `Binder`\
  \ 类并在 `onBind()` 方法中返回一个实例来实现。另一方面，进程间通信需要 `Messenger` 和 `Handler` 的实现。这两种方法的详细细节将在后面的章节中介绍。\n\
  \n## 57.4 服务的结构 (The Anatomy of a Service)\n\n如前所述，服务必须被创建为 Android `Service` 类（更具体说是\
  \ `android.app.Service`）或其子类（如 `android.app.IntentService`）。在子类化过程中，根据所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\
  \n- `onStartCommand()` – 当其他组件通过调用 `startService()` 方法启动服务时，会调用此方法。对于绑定服务，不需要实现此方法。\n\
  - `onBind()` – 当组件通过调用 `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象以促进与客户端的通信。对于启动服务，此方法必须实现并返回\
  \ `NULL` 值。\n- `onCreate()` – 旨在用于执行初始化任务的地方，该方法在调用 `onStartCommand()` 或首次调用 `onBind()`\
  \ 方法之前立即被调用。\n- `onDestroy()` – 当服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `JobIntentService`\
  \ 子类。此方法被用于处理服务的逻辑。它在与主应用程序分离的线程中执行。\n\n注意，`IntentService` 类包含了其对 `onStartCommand()`\
  \ 和 `onBind()` 回调方法的自己的实现，因此在子类中不需要实现这些方法。\n\n## 57.5 控制已销毁服务的重启选项\n\n`onStartCommand()`\
  \ 回调方法要求返回一个整数值，以定义如果服务被 Android 运行时系统销毁，应该发生什么。这些方法的可能返回值如下：\n\n- `START_NOT_STICKY`\
  \ – 指示系统，在服务被销毁的情况下，除非有等待递送的意图（intents），否则不应重启服务。\n- `START_STICKY` – 表示如果服务是在 `onStartCommand()`\
  \ 方法返回后被销毁的，则尽快重启服务。如果没有等待递送的意图，则用 `NULL` 意图值调用 `onStartCommand()` 回调方法。销毁时正在处理的意图将被丢弃。\n\
  - `START_REDELIVER_INTENT` – 表示如果服务在从 `onStartCommand()` 回调方法返回后被销毁，则应重启服务并将当前意图重新递送给\
  \ `onStartCommand()` 方法，随后是任何待处理的意图。\n\n## 57.6 在 Manifest 文件中声明服务\n\n为了使服务可用，它必须首先在清单文件中声明。这涉及在现有的\
  \ `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下\
  \ XML 片段所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/ic_launcher\"\n\
  \    android:label=\"@string/app_name\" >\n    <activity\n        android:label=\"\
  @string/app_name\"\n        android:name=\".MainActivity\" >\n        <intent-filter>\n\
  \            <action android:name=\"android.intent.action.MAIN\" />\n          \
  \  <category android:name=\"android.intent.category.LAUNCHER\" />\n        </intent-filter>\n\
  \    </activity>\n    <service android:name=\".MyService\">\n</application>\n```\n\
  \n默认情况下，服务是公开的，以便包之外的组件访问。要使服务变为私有，必须在 `<service>` 元素中将 `android:exported` 属性声明为\
  \ `false`。例如：\n\n```xml\n<service android:name=\"MyService\"\n    exported=\"false\"\
  >\n</service>\n```\n\n在使用 `JobIntentService` 时，清单中的服务声明还必须如下所示请求 `BIND_JOB_SERVICE`\
  \ 权限：\n\n```xml\n<service\n    android:name=\".MyJobIntentService\"\n    android:permission=\"\
  android.permission.BIND_JOB_SERVICE\" />\n```\n\n正如讨论过的，服务默认在与调用组件相同的进程中运行。强制服务在自己的进程中运行，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个以冒号 (:) 开头的进程名称：\n\n```xml\n<service\
  \ android:name=\".MyService\"\n    exported=\"false\"\n    android:process=\":myprocess\"\
  >\n</service>\n```\n\n冒号前缀表示新进程对本地应用程序专用。然而，如果进程名是以小写字母而不是冒号开头，则该进程将是全局的，供其他组件使用。\n\
  \n最后，通过为 activity 定义的相同的过滤器机制，服务还可以向设备上的其他应用程序宣告其功能。有关意图过滤器的更多细节，请参考“Android 意图概览”章节。\n\
  \n\n\n\n\n# 57.7 在系统启动时启动服务\n\n由于服务具有后台属性，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver）来实现，配置意图过滤器（intent filter）来监听系统的 `android.intent.action.BOOT_COMPLETED`\
  \ 意图。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。请注意，为了运行，此类广播接收器需要请求 `android.permission.RECEIVE_BOOT_COMPLETED`\
  \ 权限。\n\n## 57.8 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否处于前台状态，即使启动服务的组件被销毁，它也会继续运行。\n\
  \n服务派自 Android `Service` 类，并分为启动服务（started services）和绑定服务（bound services）两类。启动服务会一直运行直到它们被停止或销毁，并且它们本身并不提供与其他组件进行交互或数据交换的内在机制。另一方面，绑定服务为其他客户端组件提供了通信接口，通常一直运行到最后一个客户端从服务中解绑为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。远程服务可以通过对应用程序清单文件中对应的\
  \ `<service>` 条目进行细小的配置更改，在单独进程中启动。\n\n`IntentService` 类（其本身是 Android `Service`\
  \ 类的子类）提供了一种方便的机制，用于在单独的辅助线程中处理异步服务请求。\n\n# 58. 实现一个 Android 启动服务 – 实例示例\n\n上一章涵盖了大量与\
  \ Android 服务相关的信息，到此时，服务的概念可能显得有些无从从。为了强化上一章的信息，本章将通过一个 Android Studio 教程，旨在逐步引入启动服务实现的概念。\n\
  \n在本章中，将创建一个示例应用程序并将其作为实现 Android 服务的的基础。在第一个实例中，将使用 `IntentService` 类创建服务。随后，将扩展此示例以演示演示\
  \ `Service` 类的用法。最后，将实现使用 `Service` 类时在独立线程中执行任务的步骤。在本章涵盖了启动服务之后，下一章题为“Android 本地绑定服务\
  \ – 实例示例”，将侧重于绑定服务的实现和客户端与服务的通信。\n\n## 58.1 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，选择\
  \ `Empty Activity` 模板然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `ServiceExample` 并指定 `com.ebookfrenzy.serviceexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。按照第 11.8 节“迁移项目到 View Binding”中的概述修改项目以支持 view binding。\n\
  \n## 58.2 设计用户界面\n\n在 Project 工具窗口中找到并加载 `activity_main.xml` 文件（app -> res -> layout\
  \ -> activity_main.xml）。右键点击“Hello World!” `TextView`，从弹出的菜单中选择 `Convert view...`选项。在转换对话框中，选择\
  \ `Button` 视图然后点击 `Apply`。选择新按钮，将文本更改为“Start Service”，并将字符串提取到命名为 `start_service`\
  \ 的资源中。在仍选中新 `Button` 的情况下，在 Attributes 面板中找到 `onClick` 属性并分配一个名为 `buttonClick`\
  \ 的方法。\n\n## 58.3 创建服务类\n\n在编写任何代码之前，第一步是向项目添加一个新类来包含服务。在本教程中演示的第一种类型的服务将基于 `JobIntentService`\
  \ 类。正如上一章（“Android 服务概述”）所述，`JobIntentService` 类的目的是为开发者提供一种方便的机制，用于在调用应用程序的独立线程中异步执行任务的服务。\n\
  \n在 Project 工具窗口中，右键点击 app -> java 下的 `com.ebookfrenzy.serviceexample` 包名，选择 `New\
  \ -> Java Class` 菜单选项向项目添加新类。在生成的对话框中，将新类命名为 `MyJobIntentService`。最后，创建新类。\n\n在\
  \ Android Studio 编辑器中检查新的 `MyJobIntentService.java` 文件，内容应如下：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\npublic class MyJobIntentService {\n\n}\n```\n\
  \n需要修改该类使其派自 `JobIntentService` 类。在派生 `JobIntentService` 时，类必须重写 `onHandleWork()`\
  \ 方法。因此，修改 `MyJobIntentService.java` 文件中的代码，使其如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport android.content.Intent;\nimport androidx.core.app.JobIntentService;\nimport\
  \ androidx.annotation.NonNull;\n\npublic class MyIntentService extends JobIntentService\
  \ {\n\n    @Override\n    protected void onHandleWork(@NonNull Intent intent) {\n\
  \n    }\n}\n```\n\n此时只需在 `onHandleWork()` 方法中实现一些代码，以便服务在调用时实际执行某些操作。通常，这将涉及执行需要一些时间完成的任务，例如下载大文件或播放音频。为了本示例的目的，处理器将简单的睡眠\
  \ 3 秒，向 Android Log 面板输出消息：\n\n```java\npackage com.ebookrenzy.serviceexample;\n\
  \nimport android.util.Log;\n\npublic class IntentService extends JobIntentService\
  \ {\n    private final String TAG = \"Service\";\n    @Override\n    protected void\
  \ onHandleWork(@NonNull intent) {\n        Log.i(TAG, \"Job started\");\n      \
  \  int i = 0;\n        while (i <= 3) {\n            try {\n                Thread.sleep(1000);\n\
  \                i++;\n            } catch (Exception e) {\n        }\n        Log.i(TAG,\
  \ \"Service running\");\n    }\n}\n```\n\n## 58.4 将服务添加到清单文件\n\n在可以调用服务之前，必须先将其添加到所属的应用程序清单文件中。至少这涉及添加\
  \ `<service>` 元素以及服务的类名和 `BIND_JOB_SERVICE` 权限请求。\n\n双击当前项目的 `AndroidManifest.xml`\
  \ 文件（app -> manifests）将其加载到编辑器中，并按照所示修改 XML 添加服务元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.serviceexample\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.ServiceExample\" >\n        <activity\n\
  \            android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n```xml\n<category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n</intent-filter>\n</activity>\n<service\n    android:name=\".MyJobIntentService\"\
  \n    android:permission=\"android.permission.BIND_JOB_SERVICE\" />\n</application>\n\
  </manifest>\n```\n\n## 58.5 启动服务\n\n现在服务已经实现并在清单文件中进行了声明，下一步是添加代码以便在点击按钮时启动服务。找到并将\
  \ `MainActivity.java` 文件加载到编辑器器中，并实现 `buttonClick()` 方法以添加启动服务的代码：\n\n```java\n\
  package com.ebookfrenzy.serviceexample;\n\nimport android.content.Intent;\nimport\
  \ static androidx.core.app.JobIntentService.enqueueWork;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    static final int SERVICE_ID = 1001;\n\n    public\
  \ void buttonClick(View view) {\n        Intent intent = new Intent();\n       \
  \ enqueueWork(this, MyJobIntentService.class, SERVICE_ID, intent);\n    }\n}\n```\n\
  \n代码声明了一个服务 ID（可以是任何整数值），用于标识该服务。接下来，实现了 `buttonClick()` 方法，调用 `JobIntentService`\
  \ 类的 `enqueueWork()` 方法来提交服务进行执行。\n\n# 58.6 测试 IntentService 示例\n\n这个基于 `IntentService`\
  \ 的服务示例现在已完成并准备好测试。由于服务显示的消息将出现在 `Logcat` 面板中，因此在 Android Studio 环境中配置此项至关重要。\n\n\
  首先，在显示 `Logcat` 工具窗口之前，点击面板右上角的菜单（该菜单目前可能显示为 Show only selected application）。从此菜单中，选择\
  \ `Edit Filter Configuration`（编辑过滤器配置）选项。\n\n在 `Create New Logcat Filter` 对话框中将过滤器命名为\
  \ `ServiceExample`，并在 `Log Tag` 字段中，输入在 `MyIntentService.java` 中声明的 `TAG` 值（在上面的代码示例中，该值为\
  \ `ServiceExample`）。\n\n更改完成后，点击 `OK` 按钮创建过滤器并关闭对话框。新创建的过滤器现在应该是 Android 工具窗口选中状态。\n\
  \n配置好过滤器后，在物理设备或 AVD 模拟器话上运行应用程序，点击 `Start Service` 按钮。注意，“Job Service Started”消息会出现在\
  \ `Logcat` 面板中。注意，应用程序启动后可能需要将过滤器菜单设置改回 `ServiceExample`：\n\n```\n2021-01-14 14:20:05.630\
  \ 7193-7265/com.example.serviceexample I/ServiceExample: Job Service started\n```\n\
  \n在接下来的 30 秒内，`Service Running` 信息将每隔 10 秒出现一次。需要注意的是，此执行是在主线程之外的线程中进行的，使得应用程序可以自由响应用户并执行其他任务。\n\
  \n# 58.7 使用 Service 类\n\n虽然 `JobIntentService` 类允许用极少的代码实现服务，但在某些情况下，需要 `Service`\
  \ 类的灵性和同步特性。正如本章将显而易见的，这涉及到一些额外的编程工作来实现。\n\n为了避免一次性引入过多概念，并为了演示在与调用应用程序相同的线程中执行耗时服务任务的固有风险，这里创建的示例服务将不会在新线程中运行服务任务，而是依赖应用程序的主线程。在服务内部创建和管理新线程将在教程的下一阶段进行介绍。\n\
  \n## 58.8 创建新服务\n\n为了本示例，将向项目添加一个继承自 `Service` 类的新类。因此，在 Project 工具窗口中右键点击 `app\
  \ -> java` 下列出的包名，选择 `New -> Service -> Service` 菜单选项。创建一个名为 `MyService` 的新类，并勾选\
  \ `Exported` 和 `Enabled` 选项。\n\n创建一个运行服务的最小要求是实现 `onStartCommand()` 回调方法，该方法会在服务启动时被调用。此外，`onBind()`\
  \ 方法必须返回 `null` 值，以指示 Android 系统这不是一个绑定服务。为了本示例，`onStartCommand()` 方法将循环 3 次，并在每次循环迭代时睡眠\
  \ 10 秒。为了完整性，新的 `MyService.java` 文件中还将实现 `onCreate()` 和 `onDestroy()` 方法的存根版本，如下所示：\n\
  \n```java\npackage com.ebookfrenzy.serviceexample;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.util.Log;\n\
  \npublic class MyService extends Service {\n    public MyService() {\n    }\n\n\
  \    static final String TAG = \"ServiceExample\";\n\n    @Override\n    public\
  \ void onCreate() {\n        Log.i(TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public int onStartCommand(Intent intent, int flags, int startId) {\n      \
  \  Log.i(TAG, \"onStartCommand \" + startId);\n        int i = 0;\n        while\
  \ (i <= 3) {\n            try {\n                Thread.sleep(10000);\n        \
  \        i++;\n            } catch (Exception e) {\n                Log.i(TAG, \"\
  Service running\");\n            }\n        }\n        return START_STICKY;\n  \
  \  }\n\n    @Override\n    public IBinder onBind(Intent arg) {\n        Log.i(TAG,\
  \ \"onBind\");\n        return null;\n    }\n\n    @Override\n    public void onDestroy()\
  \ {\n        Log.i(TAG, \"onDestroy\");\n    }\n}\n```\n\n服务实现后，将 `AndroidManifest.xml`\
  \ 文件加载到编辑器中，验证 Android Studio 是否已为新服务添加了条目，其内容如下：\n\n```xml\n<service\n    android:name=\"\
  .MyService\"\n    android:enabled=\"true\"\n    android:exported=\"true\" >\n```\n\
  \n## 58.9 启动服务\n\n编辑 `MainActivity.java` 文件并修改 `buttonClick()` 方法以启动 `MyService`\
  \ 服务：\n\n```java\npublic void buttonClick(View view) {\n    Intent intent = new\
  \ Intent(this, MyService.class);\n    startService(intent);\n}\n```\n\n`buttonClick()`\
  \ 方法只是创建新服务的意对象并启动它。\n\n## 58.10 运行应用程序\n\n运行应用程序并在加载后点击 `Start Service` 按钮。在 `Logcat`\
  \ 工具窗口中（使用之前创建的 `ServiceExample` 过滤器），将出现日志消息表明 `buttonClick()` 方法已被调用，onStartCommand()`\
  \ 方法中的循环正在执行。\n\n在最后一个循环消息出现之前，尝试第二次点击 `Start Service` 按钮。注意按钮是没有响应的。大约 20 秒后，系统可能会显示一个包含“ServiceExample\
  \ isn’t responding”消息的警告对话框。这是因为应用程序的主线程正被执行循环任务的服务阻塞。\n\n# 58.11 为服务添加多线程\n\n正如\
  \ Java 线程、Handlers 和执行器的基本概述 中所述，当 Android 应用程序首次启动时，运行时系统创建一个单线程，所有应用程序组件默认将在该线程中运行。该线程通常被称为主线程。\n\
  \n\n\n\n\n如上一节所示，任何在主线程上执行耗时操作的组件都会导致应用程序在任务完成之前无响应状态。因此，Android 提供了一个允许应用程序创建和使用额外线程的\
  \ API，这并不意外。在独立于主线程的线程中执行的任务本质上是在后台执行的。此类线程通常被称为后台线程或工作线程。\n\n修改 `MyService.java`\
  \ 文件中的 `onStartCommand()` 方法，如下所示在独立线程中执行任务：\n\n```java\n@Override\npublic int onStartCommand(Intent\
  \ intent, int flags, int startId) {\n    Log.i(TAG, \"Service onStartCommand \"\
  \ + startId);\n    Runnable runnable = () -> {\n        int i = 0;\n        while\
  \ (i <= 3) {\n            try {\n                Thread.sleep(10000);\n        \
  \        i++;\n            } catch (Exception e) {\n            }\n            Log.i(TAG,\
  \ \"Service running \" + startId);\n        }\n    };\n    Thread serviceThread\
  \ = new Thread(runnable);\n    serviceThread.start();\n    return Service.START_STICKY;\n\
  }\n```\n\n现在运行应用程序，应该可以多次点击“启动服务”（Start Service）按钮。这样做时，Logcat 输出应显示有多个任务在同时运行：\n\
  \nI/ServiceExample: Service onStartCommand 1\nI/ServiceExample: Service onStartCommand\
  \ 2\nI/ServiceExample: Service onStartCommand 3\nI/ServiceExample: Service running\
  \ 1\nI/ServiceExample: Service running 2\nI/ServiceExample: Service running 3\n\n\
  由于服务现在在主线程之外处理请求，应用程序对用户和 Android 系统都保持响应状态。\n\n## 58.12 总结\n本章通过了一个使用 `IntentService`\
  \ 和 `Service` 类实现 Android 启动服务（started service）的示例。该示例还演示了在服务中使用异步任务，以避免应用程序的主线程变得无响应。\n\
  \n# 59. Android 本地绑定服务 – 实例详解\n\n正如前几章详细概述的那样，绑定服务（bound services）与启动服务（started\
  \ services）不同，它们提供了一种实现 Android 服务与一个或多个客户端组件之间通信的机制。本章的目标是在[Android 服务概述（An Overview\
  \ of Android Services）#Started_Service.xhtml__idTextAnchor1127]提供的绑定服务概述基础上，开始对本地绑定服务的实际实例实现。\n\
  \n## 59.1 理解绑定服务\n与启动服务一样，提供绑定服务允许应用程序在后台执行任务。然而，与启动服务不同的是，多个客户端组件可以绑定到一个绑定服务上，并且一旦绑定，就可以可以使用不同的机制与该服务进行交互。\n\
  \n绑定服务是作为 Android `Service` 类的子类创建的，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的第一个绑定请求将导致调用该服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法的 `ServiceConnection` 子类，这两个方法将分别在客户端-服务器连接建立或断开时被调用。在\
  \ `onServiceConnected()` 方法中，将传递给该方法的是一个 `IBinder` 对象，该对象包含了客户端与服务进行交互所需的信息。\n\n\
  ## 59.2 绑定服务的交互选项\n实现客户端组件与绑定服务之间交互有两种推荐机制。如果绑定服务是本地的且与客户端组件属于同一个应用程序（也就是说，它在同一个进程中运行并且对其他应用程序中的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后通过 `onBind()` 方法返回此 `Binder` 对象的实例，随后供客户端组件使用以直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是应用程序本地的情况下（也就是说，它在与客户端组件不同的进程中运行），最好使用 `Messenger/Handler` 实现方案来实现交互。\n\
  \n在本章的剩余部分中，将创建一个示例，旨在演示创建、启动和与本地私有绑定服务交互的步骤。\n\n## 59.3 本地绑定服务示例\n在本章剩余部分创建的示例应用程序将由单个\
  \ Activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间并将该信息返回到显示该信息的 Activity。从欢迎屏幕上选择新建项目（New Project），在新项目对话框中选择空活动（Empty\
  \ Activity）模板。在 Name 字段中输入 `LocalBound`，并指定 `com.ebookrenzy.localbound` 为包名。在点击完成（Finish）按钮之前，将最低\
  \ API 级别改为 API 26：Android 8.0 (Oreo)，并将语言设置为 Java。使用 11.8 将项目迁移到 View Binding 中的步骤将项目迁移到\
  \ view binding。项目创建完成后，下一步是添加一个新类来作为绑定服务。\n\n## 59.4 向项目添加绑定服务\n要向项目添加新类，请在 Project\
  \ 窗口中右键点击包名（位于 app -> java -> ebookrenzy -> localbound 下），并选择 New -> Service ->\
  \ Service 菜单选项。指定 `BoundService` 为类名，并在点击 Finish 创建类之前，确保选中了 Exported（导出）和 Enabled（启用）选项。Android\
  \ Studio 将 `BoundService.java` 文件加载到编辑器，内容如下：\n\n```java\npackage com.ebookrenzy.localbound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\n\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n    public BoundService() {\n   \
  \ }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        // TODO:\
  \ 返回通往服务的通道\n        throw new UnsupportedException(\"Not yet implemented\");\n\
  \    }\n}\n```\n\n## 59.5 实现 Binder\n如前所述，本地绑定服务通过向客户端传递配置适当的 `Binder` 对象来与绑定客户端通信。这是通过在绑定服务类内部创建一个\
  \ `Binder` 子类并通过扩展添加一个或多个可以由客户端调用的方法来实现的。大多数情况下，这仅涉及实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问并调用服务内部的方法。\n\
  \n因此，为了本示例，需要对在前节创建的模板 `BoundService` 类进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法只需返回当前服务对象的实例引用（由 `this` 关键字表示）。根据这些要求，编辑 `BoundService.java` 文件并进行如下修改：\n\
  \n```java\npackage com.ebookrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n```\n\n\n\n\n\n```java\n    private\
  \ final IBinder myBinder = new MyLocalBinder();\n\n    public BoundService() {\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: Return the communication channel to the service.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder\
  \ {\n        BoundService getService() {\n            return BoundService.this;\n\
  \        }\n    }\n}\n```\n[/content]\n\n对类进行更改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder`\
  \ 的新子类（命名为 `MyLocalBinder`）。该类包含一个方法，其唯一目的是返回 `BoundService` 类当前实例的引用。创建了 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用时返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \           new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n                    \
  \           Locale.US);\n        return (dateformat.format(new Date()));\n    }\n\
  \n    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n此时，绑定服务已经完成，并准备好添加到项目清单文件中。在\
  \ Project 工具窗口中找到并双击 LocalBound 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，请验证\
  \ Android Studio 是否已按照如下所示添加了服务的 `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.localbound\" >\n    <application\n  \
  \      android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".BoundService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\" >\n        </service>\n        <activity\n\
  \            android:name=\".MainActivity\" >\n            <intent-filter>\n   \
  \             <action android:name=\"android.intent.action.MAIN\" />\n         \
  \       <category android:name=\"android.intent.category.LAUNCHER\" />\n       \
  \     </intent-filter>\n        </activity>\n    </application>\n</manifest>\n```\n\
  \n下一阶段是在 activity 中实现必要的代码，以绑定到服务并调用 `getCurrentTime()` 方法。\n\n## 59.6 将客户端绑定到服务\n\
  \n在本教程中，客户端是运行应用程序的 `MainActivity` 实例。如前所述，要成功绑定到服务并接收由服务的 `onBind()` 方法返回的 `IBinder`\
  \ 对象，有必要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final ServiceConnection myConnection = new ServiceConnection() {\n\
  \        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法的参数是服务的 `onBind()` 方法返回的 `IBinder` 对象。该参数被强制转换为 `MyLocalBinder`\
  \ 类型的对象，然后调用 binder 对象的 `getService()` 方法以获取服务实例的引用，随后将其赋值给 `myService`。使用一个布尔标志来表示连接是否已建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法并将布尔标志位设置为 false。\n\n建立连接后，下一步是修改 activity\
  \ 以绑定到服务。这涉及创建一个 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()`\
  \ 方法中执行：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n## 59.7 完成示例\n\n剩下的就是实现一种调用\
  \ `getCurrentTime()` 方法并将结果显示给用户的机制。按照惯例，Android Studio 已为 activity 创建了一个模板 `activity_main.xml`\
  \ 文件，其中仅包含一个 `TextView`。将此文件加载到 Layout 编辑器中，使用 Design 模式选择 `TextView` 组件并将 ID 更改为\
  \ `myTextView`。在 `TextView` 下方添加一个 `Button` 视图，并将按钮上的文本改为“Show Time”，将文本提取到名为 `show_time`\
  \ 的字符串资源。完成这些更改后，布局应如图 59-1 所示。如果缺少任何约束，点击 Layout 编辑器中的 Infer Constraints 按钮。\n\n\
  完成用户界面设计，选择 `Button` 并配置 `onClick` 属性以调用 `showTime` 方法。\n\n最后，编辑 `MainActivity.java`\
  \ 文件中的代码来实现 `showTime()` 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()`\
  \ 方法，现在可以通过 `myService` 引用从 activity 中调用），并将生成的字符串分配给 `TextView`：\n\n\n\n\n\n```java\n\
  TextView myTextView = findViewById(R.id.myTextView);\nmyTextView.setText(currentTime);\n\
  ```\n\n## 59.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦界面可见，点击按钮并注意文本视图已更改为显示当前日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法来执行任务并将结果返回给活动（activity）。\n\
  \n## 59.9 总结\n\n当绑定的服务是本地的且对应用程序私有时，该应用程序内的组件可以与服务进行交互，而无需诉助于进程间通信（IPC）。通俗地说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含一个指向运行中服务实例的引用。客户端组件实现一个 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法在服务连接和断开时被调用。前一种方法接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\n## 60 Android 远程绑定服务 – 实例教程\n\n\
  在这一关于 Android 服务的最后一章中，将开发一个示例应用程序，以演示使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n## 60.1 客户端与远程服务的通信\n\n正如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，对于远程服务，这种方法是不可通的，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n对于远程服务，必须创建一个 `Messenger` 和 `Handler` 配置，以允许消息在客户端和服务之间的进程边界上进行传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，该实例在接收到来自客户端的消息时会被调用。在初始化方面，`Handler` 的的任务是创建一个 `Messenger` 对象，该对象反过来创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象来创建 `Messenger` 对象的实例，随后将消息发送给服务处理器。客户端每发送一次消息，处理器的\
  \ `handleMessage()` 方法就会被调用一次，并传递消息对象。\n\n本章创建的示例将包含一个在单独进程中运行的和一个绑定服务。`Messenger/Handler`\
  \ 机制将用于向服务发送一个字符串，服务将在 `Toast` 消息中显示该字符串。\n\n## 60.2 创建示例应用程序\n\n从欢迎界面选择 `New Project`get，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `RemoteBound`，并指定包名为 `com.ebookfrenzy.remotebound`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n## 60.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击将其加载到\
  \ Layout Editor 工具中。在 Layout Editor 工具的 `Design` 模式下，右键点击默认的 `TextView` 实例，选择 `Convert\
  \ view...` 菜单选项，从弹出的对话框中选择 `Button` 视图并点击 `Apply`。将按钮的 `text` 属性更改为“Send Message”，并将字符串提取到名为\
  \ `send_message` 的新资源中。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n## 60.4\
  \ 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在 Project 工具窗口中右键点击包名（位于 `app -> java` 下），并选择 `New\
  \ -> Service -> Service` 菜单选项向项目添加新类。指定 `RemoteService` 为类名，并在点击 `Finish` 创建类之前，确保选中了\
  \ `Exported` 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类。这是通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现的。该将在接收到来自客户端的消息时被调用。它将接收一个 `Message` 对象作为参数，包含客户端需要传递给服务的任何数据。在本例中，这将包含一个要显示给用户的字符串的\
  \ `Bundle` 对象。实现后，`RemoteService.java` 文件中修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.widget.Toast;\nimport android.os.Messenger;\n\npublic class RemoteService\
  \ extends Service {\n\n    public RemoteService() {\n\n    }\n\n    class IncomingHandler\
  \ extends Handler {\n\n        @Override\n        public void handleMessage(Message\
  \ msg) {\n            Bundle data = msg.getData();\n            String dataString\
  \ = data.getString(\"MyString\");\n            Toast.makeText(getApplicationContext(),\
  \ dataString, Toast.SHORT).show();\n        }\n    }\n\n    @Override\n    public\
  \ IBinder onBind(Intent intent) {\n        // TODO: Return the communication\n \
  \       throw new UnsupportedException(\"Not implemented\");\n    }\n}\n```\n\n\
  处理器后，服务中的唯一任务是修改 `onBind()`，使其返回一个包含处理器引用的 `IBinder` 对象：\n\n```java\nfinal Messenger\
  \ myMessenger = new Messenger(new IncomingHandler());\n\n@Override\npublic IBinder\
  \ onBind(Intent intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码的第一行创建了处理器的实例，并将其传递给\
  \ `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用 messenger 的 `getBinder()` 方法以返回其 binder。\n\
  \n## 60.5 在 Manifest 中配置远程服务\n\n为了准确展示客户端与远程之间的通信，有必要配置服务在与应用程序部分独立的进程中运行。这通过清单文件中\
  \ `<service>` 标签内的添加 `android:process` 属性来实现。为了启动远程服务，还需要为服务提供意图过滤器（intent filter）。实现此操作需要修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\">\n\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\">\n        </service>\n\n        <activity android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n## 60.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法。同样，与本地服务相同，`onServiceConnected()`\
  \ 方法将接收来自远程服务 `onBind()` 方法返回的 `IBinder` 对象，该对象将用于向服务器处理器发送消息。在本示例中，客户端是 `MainActivity`，其代码位于\
  \ `MainActivity.java`。加载此文件并进行修改，以添加 `ServiceConnection` 类、一个用于存储接收到的 `Messenger`\
  \ 对象引用的变量，以及一个用于指示连接是否建立的 `Boolean` 标志：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.os.RemoteException;\nimport android.content.ComponentName;\nimport\
  \ android.content.Context;\nimport android.content.Intent;\nimport android.os.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n        new ServiceConnection() {\n            public void onServiceConnected(\n\
  \                    ComponentName className,\n                    IBinder service)\
  \ {\n                myService = new Messenger(service);\n                isBound\
  \ = true;\n            }\n            public void onServiceDisconnected(\n     \
  \               ComponentName className) {\n                myService = null;\n\
  \                isBound = false;\n            }\n        };\n}\n```\n\n接下来，需要添加一些代码来绑定到远程服务。这涉及创建一个与清单文件中声明的服务意过滤器匹配的\
  \ `intent`，然后调用 `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数提供。为了本示例的目的，这些代码将在\
  \ Activity 的 `onCreate()` 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_remote_bound);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n                     \
  \          RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n## 60.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法被配置为当用户触摸界面上的按钮时被调用。此方法需要检查服务是否连接，创建一个包含要显示字符串的 `bundle` 对象，将其添加到 `Message`\
  \ 对象中并发送到服务器：\n\n```java\npublic void sendMessage(View view) {\n    if (!isBound)\
  \ return;\n    Message msg = Message.obtain();\n    Bundle bundle = new Bundle();\n\
  \    bundle.putString(\"MyString\", \"Message Received\");\n    msg.setData(bundle);\n\
  \    try {\n        myService.send(msg);\n    } catch (RemoteException e) {\n  \
  \      e.printStackTrace();\n    }\n}\n```\n\n完成代码更改后，编译并运行应用程序。加载后，触摸用户界面上的按钮，此时应该出现一个显示“Message\
  \ Received”的 `Toast` 消息。\n\n## 60.8 总结\n\n要实现客户端与远程绑定服务之间的交互，必须实现处理器/消息框架。该技术背后的概念在本章中已经涵盖，并实现了一个示例应用程序，该程序用于演示客户端与绑定服务之间的通信，每个服务都运行在独立的进程中。\n\
  \n# 61 通知教程\n\n通知提供了一种应用程序在未运行或当前处于后台时向用户传达消息的方法。例如，消息应用可能会发布通知让用户知道新消息已到达。通知可以分为本地通知和远程通知。本地通知是由运行在设备上的应用程序本身触发触发的。相反，远程通知由远程服务器启动并递送到设备上供用户展示。\n\
  \n通知显示在从屏幕状态栏下拉的通知栏中，每条通知都可以包含某些操作，例如打开发送通知的应用程序的按钮。Android 还支持直接回复（Direct Reply）通知，此功能允许用户直接在通知面板中输入并提交对通知的回复。\n\
  \n本章的目标是概述并演示 Android 应用中本地通知的实现。下一章（“Android 直接回复通知教程”）将涵盖直接回复通知的实现。\n\n## 61.1\
  \ 通知概览\n\n当 Android 设备上启动通知时，它会以图标的形式显示在状态栏中。例如，图 61-1 显示了一个带有多个通知图标的状态栏：\n\n![](img/Image24253.jpg)\n\
  图 61-1\n\n要查看通知，用户只需从状态栏开始向下划动的动作来拉下通知栏，如图 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  图 61-2\n\n在运行 Android 8 或更高版本的设备上，长按应用程序启动图标将显示与该程序关联的所有待处理通知，如图 61-3 所示：\n\n![](img/Image2442.jpg)\n\
  图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有待查看通知时，应用程序启动图标上会出现该点。典型的通知只会显示消息，并在点击时启动发布通知的应用程序。通知还可以包含操作按钮，点击后可以执行对应程序的特定任务。例如，图\
  \ 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存传入的消息。\n\n//Image2450.jpg)\n图 61-4\n\n用户还可以在通知中输入内联文本回复并发送给应用程序，如下图\
  \ 61-5 所示。这允许用户无需将相应的程序调到前台即可对通知做出响应。\n\n![\n图 61-5\n\n本章剩余部分将介绍创建和发布包含操作简单通知的步骤。直接回复支持的主将在后续题为“Android\
  \ 直接回复通知教程”的章节中涵盖。\n\n## 61.2 创建 NotifyDemo 项目\n\n从欢迎屏幕上选择新项目选项，并在弹出的新项目对话框中选择 Empty\
  \ Activity 模板，然后点击 Next 按钮。\n\n\n\n\n\n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n## 61.3 设计用户界面\n\n主活动（main activity）将包含一个按钮，其目的是创建并发出意图（intent）。在\
  \ `Layout Editor` 工具中定位并加载 `activity_main.xml` 文件，删除默认的 `TextView` 组件。\n\n在启用 `Autoconnect`\
  \ 的情况下，从面板中拖放 `Button` 对象到布局画布的中心，如图图 61-6 所示。\n\n在布局中选中 `Button` 组件后，使用 `Attributes`\
  \ 面板配置 `onClick` 属性以调用名为 `sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\
  \n图 61-6\n\n选中 `Button` 组件，在 `Attributes` 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取为字符串资源。\n\
  \n## 61.4 创建第二个 Activity\n\n为了本示例的目的，应用将包含第二个 Activity，该活动将由用户从通知内部启动。通过右键点击位于 `app\
  \ -> java` 下的 `com.ebookfrenzy.notifydemo` 包名，向项目添加此新活动，选择 `New -> Activity -> Empty\
  \ Activity` 菜单选项显示 `New Android Activity` 对话框。\n\n在 `Activity Name` 字段中输入 `ResultActivity`，并将布局文件命名为\
  \ `activity_result`。由于此活动不会在应用程序启动时启动（它将通过通知内部的意图启动），因此在点击 `Finish` 按钮之前，确保禁用了 `Launcher\
  \ Activity` 选项是重要的。请参考章节 11.8 将项目迁移到 View Binding 中的步骤，为 `build.gradle` 和 `ResultActivity.java`\
  \ 文件添加 view binding 支持（请注意，绑定名称将是 `ActivityResultBinding` 而不是 `ActivityMainBinding`）。\n\
  \n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），并拖放 `TextView` 组件，使其位于布局中心。编辑\
  \ `TextView` 的文本，使其显示为“Result Activity”，并将属性值提取为字符串资源。\n\n## 61.5 创建通知通道\n\n在应用发送通知之前，它必须先创建一个通知通道（notification\
  \ channel）。通知通道由一个 `ID`（用于在应用内唯一标识通道）、一个 `channel name`（通道名称）和一个 `channel description`（通道描述）组成（只有后两个会被用户看到）。通道通过配置\
  \ `NotificationChannel` 实例并将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法创建。对于此示例，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager = (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(\n                \"com.ebookfrenzy.notifydemo.news\"\
  ,\n                \"NotifyDemo News\",\n                \"Example News Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id, String name,\
  \ String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n该代码声明并初始化了一个 `NotificationManager` 实例，并名称和描述创建一个低重要级别（其他还有高、最小和无）的新通道。通道还添加了一系列可选设置，以自定义用户接收通知到达的提醒方式。这些设置适用于发送到此通道的所有通知。最后，通过将通知通道传递给通知管理器的\
  \ `createNotificationChannel()` 方法来创建通道。\n\n代码完成后，在运行 Android 10 或更高版本的设备或模拟器上编译并运行应用。应用启动后，将其置于后台并打开\
  \ `Settings`（设置）应用。在 `Settings` 应用中，选择 `Apps & notifications`，然后选择 `App info`。在\
  \ `App info` 屏幕上找到并选择 `NotifyDemo` 项目，在随后的屏幕上点击 `Notifications`。通知屏幕应列出 `NotifyDemo\
  \ News` 为用户处于激活状态：\n\n![](img/as_3.5_notifications_enabled.jpg)\n\n图 6-7\n\n在继续之前，检查\
  \ `Advanced` 设置以确保应用已启用通知点（dots）和气泡（bubbles）。虽然这不是本示例的要求，但值得注意的是，可以通过调用通知管理器的 `deleteChannel()`\
  \ 方法从应用内部删除通道，传递要删除通道的 `ID`：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteChannel(channelID);\n```\n\n## 6.6 创建并发布通知\n\n通知使用\
  \ `Notification.Builder` 类创建，并必须包含图标、标题和内容。打开 `MainActivity.java` 文件并按所示实现 `sendNotification()`\
  \ 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\nimport android.view.View;\n\
  \npublic void sendNotification(View view) {\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification = new Notification.Builder(MainActivity.this, channelID)\n\
  \            .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n}\n```\n\n一旦构建了通知，就需要使用\
  \ `NotificationManager` 实例的 `notify()` 方法进行发布。将访问 `NotificationManager` 并发布通知的代码按所示添加到\
  \ `sendNotification()` 方法中：\n\n```java\nprotected void sendNotification(View view)\
  \ {\n    int notificationID = 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification = new Notification.Builder(MainActivity.this, channelID)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You've\
  \ received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。该 ID 可以任何整数，并可能在以后用于更新通知。\n\n\
  \n\n\n\n编译并运行应用，点击主活动上的按钮。当通知图标在状态栏中出现时，从状态栏向下拖动以查看完整通知：\n\n![](img/Image2481.jpg)\n\
  \n图 61-8\n\n点击并向右滑动通知，然后选择设置齿轮图标以查看有关该通知的附加信息：\n\n![](img/as_3.5_notification_settings.jpg)\n\
  \n图 61-9\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的主屏幕，并注意 `NotifyDemo` 启动图标上出现了一个通知点，如 图 61-10\
  \ 所示：\n\n![](img/Image24991.jpg)\n\n图 61-10\n\n如果没有出现圆点，请在 `Settings`（设置）应用中检查 `NotifyDemo`\
  \ 的通知选项，以确认已按照本章前面的介绍启用了通知点。如果圆点仍未出现，请长按设备主屏幕的空白区域，从弹出的菜单中选择 `Home Settings`（主屏幕设置）选项，并启用\
  \ `Notification dots`（通知点）选项。\n\n长按启动器图标将显示一个包含通知的弹出窗口：\n\n![](img/as_3.5_notifydemo_long_press_popup.jpg)\n\
  \n图 61-11\n\n如果一个应用有多个待处理通知，长按菜单弹出窗将包含通知数量（如上图所示所示）。此数字可以在构建通知时通过调用 `setNumber()`\
  \ 方法在应用内部进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现，无论从何处访问，点击通知都没有效果。下一步是配置通知，以便在点击时启动一个活动（activity）。\n\n## 61.7 从通知启动活动\n\
  \n理想情况下，通知应该允许用户执行某些形式的操作，例如启动相应的应用，或者响应通知采取其他形式的操作。一个常见的需求是，当用户点击通知时，简单启动属于应用的活动。\n\
  \n这种方法需要启动一个活动并配置一个 `Intent` 来启动该活动。假设应用中包含一个名为 `ResultActivity` 的活动，该 intent 的创建方式如下：\n\
  \n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\
  然后需要将此 intent 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计用于将 intent 传递给其他应用程序，本质上是授予这些应用程序在未来某个时间点执行该\
  \ intent 的权限。在这种情况下，`PendingIntent` 对象被用于为通知系统提供一种方法，在用户点击通知面板时启动 `ResultActivity`\
  \ 活动：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    );\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\
  \n将这些更改整合在一起，得到了一个修改后的 `sendNotification()` 方法，其内容如下：\n\n```java\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n            PendingIntent.getActivity(\n                    this,\n       \
  \             0,\n                    resultIntent,\n                    PendingIntent.FLAG_UPDATE_CURRENT\n\
  \            );\n    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n\
  \    Notification notification = new Notification.Builder(MainActivity.this, CHANNEL_ID)\n\
  \            .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n编译并运行应用，点击按钮并显示通知抽屉。然而，这次点击通知将导致 `ResultActivity` 启动。\n\n## 61.8 为通知添加操作\n\
  \n另一种为通知添加交互性的方法是创建操作（actions）。它们显示为通知消息下方的按钮，并编写为在用户点击时触发特定的 intent。如果将以下代码添加到\
  \ `sendNotification()` 方法中，这将添加标记为“Open”（打开）的操作按钮，它将启动引用的 intent：\n\n```java\nfinal\
  \ Icon icon = Icon.createResource(MainActivity.this, android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n    .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法并运行应用。发布通知并注意通知中的 Open 操作（取决于 Android 版本，可能需要下拉通知面板才能显示该操作）：\n\
  \n![](img/as_3.5_notification_with_action.jpg)\n\n图 61-12\n\n点击操作将触发 pending intent\
  \ 并启动 `ResultActivity`。\n\n## 61.9 堆叠通知\n\n如果一个应用倾向于定期通知，可能会导致这些通知迅速占用状态栏和通知抽屉，为用户提供欠佳的体验。对于新闻或消息应用尤为如此，它们每当有突发新闻或联系人新消息时都会发送通知。请考虑图\
  \ 61-13 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 61-13\n\n现在想象如果有十条甚至二十条新消息。为了避免此类问题，Android\
  \ 允许通知打包在一起。\n\n要堆叠通知，可以通过 `setGroup()` 方法指定每个通知属于同一个组，并发布一个额外的摘要通知。例如，以下代码创建并发布了上方图\
  \ 61-13 所示的三个通知，但将它们打包在同一个组中。该代码还发布了一个作为摘要的通知：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\nNotification.Builder builderSummary =\n    new Notification.Builder(this,\
  \ channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n       \
  \ .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have 3 new\
  \ messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  \nNotification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n```\n\n\n\n\n\n```java\n\
  .setContentTitle(\"New Message\")\n    .setContentText(\"You have a new message\
  \ from Kassidy\")\n    .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder builder2\
  \ =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0\
  \ = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\nint notificationId3\
  \ = 103;\n\nnotificationManager.notify(notificationId1, builder1.build());\nnotificationManager.notify(notificationId2,\
  \ builder2.build());\nnotificationManager.notify(notificationId3, builder3.build());\n\
  notificationManager.notify(notificationId0, builderSummary.build());\n```\n\n当代码执行时，尽管应用程序实际上发布了四条通知，但状态栏中只会出现一个通知图标。在通知栏中，会显示一条摘要摘要通知，列出每个组包通知中的信息：\n\
  \n![](img/Image2528.jpg)\n图 61-14\n\n在通知条目上继续向下滑动，面板会展开并显示每个组包通知的详情：\n\n![](img/Image2536.jpg)\n\
  图 61-15\n\n## 61.10 总结\n\n通知为应用程序提供了一种在未运行或当前处于后台时向用户传递消息的方法。通知显示在状态栏和通知栏中。本地通知由运行的应用在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n本章所示，可以通过利用操作（actions）、意图（intents）和\
  \ `PendingIntent` 类，配置为用户提供选项（例如启动活动或保存消息）。通知组包（Notification bundling）提供了一种将通知分组的机制，为发布大量通知的应用程序提供了更好的体验。\n\
  \n# 62. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 7 中引入的一项功能，允许用户在通知中输入文本并将其发送到与通知关联的应用程序。这使用户无需启动应用程序内的活动即可直接在通知中回复消息。本章将基于上一章学到的知识，创建一个使用此通知特性的示例应用程序。\n\
  \n#### 62.1 创建 DirectReply 项目\n\n从欢迎屏幕上选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”模板。\n\n在“Name”（名称）字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将最低 API 级别设置设置为 `API 31: Android 12`，并将语言菜单更改为 `Java`。按照第\
  \ 11.8 迁移项目到 View Binding 概述的步骤修改项目以支持 view binding。\n\n#### 62.2 设计用户界面\n\n将 `activity_main.xml`\
  \ 布局文件加载到布局工具。在启用 Autoconnect（自动连接）的情况下，在现有的“Hello World!”标签下方添加一个 `Button` 对象，如图\
  \ 62-1 所示。在布局中选中 `Button` 控件后，使用 Attributes（属性）工具窗口将 `onClick` 属性设置为调用一个名为 `sendNotification`\
  \ 的方法。如有必要，使用 Infer Constraints（推断约束）按钮为布局添加任何缺失的约束。在继续之前，选择“Hello World!” `TextView`，将\
  \ `id` 属性更改为 `textView`并将按钮上的文本修改为“Notify”。\n\n![](img/as_4.1_direct_reply_ui.jpg)\n\
  图 62-1\n\n#### 62.3 创建通知通道\n\n如上一章示例所示，在发送通知之前必须创建一个通道。编辑 `MainActivity.java` 文件并添加以下代码创建新通道：\n\
  \n```java\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        notificationManager = (NotificationManager)\
  \ getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(channelID,\
  \ \"DirectReply News\", \"Example Channel\");\n    }\n\n    protected void createNotificationChannel(String\
  \ id, String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createChannel(channel);\n    }\n}\n```\n\
  \n#### 62.4 构建 RemoteInput 对象\n\n在通知中实现直接回复的关键元素是 `RemoteInput` 类。之前的章节介绍了 `PendingIntent`\
  \ 类，并解释了它如何允许应用程序创建一个意图，然后授予其他应用程序或服务从外部启动该意图的能力。在名为 Android 通知教程的章节中，创建允许从通知内部启动原始应用程序活动的等待意图。`RemoteInput`\
  \ 类允许将用户输入请求连包含在 `PendingIntent` 对象中。\n\n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这是通过使用\
  \ `RemoteInput.Builder()` 方法实现的。构建 `RemoteInput` 对象时，需要一个键字符串，用于从生成的意图中提取输入。该对象还需要一个标签字符串，显示在通知的文本输入字段中。编辑\
  \ `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。注意还添加了一些在后续章节中将使用的导入指令和变量：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.view.View;\nimport\
  \ android.app.PendingIntent;\nimport android.app.RemoteInput;\nimport android.content.Intent;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static final int notificationId = 101;\n    private static\
  \ final String KEY_TEXT_REPLY = \"key_text_reply\";\n    private NotificationManager\
  \ notificationManager;\n    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n```\n\n\n\n\n```java\nString\
  \ replyLabel = \"Enter your reply here\";\n\nRemoteInput remoteInput =\n    new\
  \ RemoteInput.Builder(KEY_TEXT_REPLY)\n        .setLabel(replyLabel)\n        .build();\n\
  }\n```\n\n现在 `RemoteInput` 对象已经创建并使用键和标签字符串初始化，它需要被放置在通知操作（notification action）对象中。然而在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n## 62.5 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android\
  \ 通知教程章节中概述的步骤相同，不同之处在于意图（intent）将配置为启动 `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建\
  \ `PendingIntent`：\n\n```java\npublic void sendNotification(View view) {\n    String\
  \ replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput =\n     \
  \       new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_MUTABLE\n            );\n}\n```\n\n## 62.6 创建回复操作\n\
  \n内联回复将可以通过通知中的操作按钮进行访问。现在需要创建此操作，并为其配置图标、显示在按钮上的标签、`PendingIntent` 对象以及 `RemoteInput`\
  \ 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport android.graphics.drawable.Icon;\n\
  import android.app.Notification;\nimport android.graphics.Color;\nimport androidx.core.content.ContextCompat;\n\
  \npublic void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n                .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_UPDATE_CURRENT\n\
  \            );\n    final Icon icon =\n            Icon.createWithResource(MainActivity.this,\n\
  \            android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n            new Notification.Action.Builder(\n                icon,\n     \
  \           \"Reply\", resultPendingIntent)\n                .addRemoteInput(remoteInput)\n\
  \                .build();\n}\n```\n\n在教程的这一阶段，我们已经构建并准备好使用 `RemoteInput`、`PendingIntent`\
  \ 和 `Notification` 对象。下一阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n        PendingIntent.getActivity(\n \
  \           this,\n            0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \        );\n    final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n\
  \        android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n        new Notification.Action.Builder(\n            icon,\n            \"\
  Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n      \
  \      .build();\n    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n            R.color.design_default_color_primary))\n\
  \            .setSmallIcon(\n            android.R.drawable.ic_dialog_info)\n  \
  \          .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build();\n    NotificationManager\
  \ notificationManager =\n        (NotificationManager)\n        getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，测试点击按钮是否成功发布了通知。当查看通知栏时，通知应该如图 62-2 所示：\n\n![](img/as_4.1_direct_reply_notification.jpg)\n\
  图 62-2\n\n点击“回复”（Reply）操作按钮，输入字段将出现并显示创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_4.1_direct_reply_enter.jpg)\n\
  图 62-3\n\n输入一些文本并点击位于输入字段末端的发送箭头。\n\n## 62.7 接收直接回复输入\n\n现在通知已成功向用户获取输入，应用需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本显示在\
  \ Activity 界面的 `TextView` 控件上。\n\n当用户输入文本并点击发送按钮时，通过 `PendingIntent` 对象包含的 `intent`\
  \ 启动 `MainActivity`。该意图中包含了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()`\
  \ 方法将返回启动该 Activity 的 `intent` 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法，反将返回一个包含回复文本的\
  \ `Bundle` 对象，可以从中提取文本并赋值给 `TextView` 控件。这导致 `MainActivity.java` 文件中的 `onCreate()`\
  \ 方法被修改为如下内容所示：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    createNotificationChannel(channelID, \"DirectReply News\",\n          \
  \  \"Example News Channel\");\n    handleIntent();\n}\n\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.getCharSequence(\n\
  \            KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板内输入并发送一些文本。注意 `MainActivity`\
  \ 中的 `TextView` 控件已更新以显示所输入的内联文本。\n\n## 62.8 更新通知\n\n在通知中发送回复后，你可能注意到进度指示在通知面板中继续旋转，如图\
  \ 62-4 所示：\n\n![](img/Image24491.jpg)\n图 62-4\n\n通知显示此指示器是因为它正在等待 Activity 的响应，以确认收到发送的文本。执行此任务的推荐方法是更新通知显示一条新消息，表明回复已接收并处理。由于原始通知在发布时已分配了\
  \ ID，因此可以再次使用它进行更新。向 `handleIntent()` 方法添加以下代码以执行此任务：\n\n```java\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n```\n\n\n\n```java\nBundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n\nif (remoteInput != null) {\n  \
  \  String inputString = remoteInput.getCharSequence(\n            KEY_TEXT_REPLY).toString();\n\
  \    binding.myTextView.setText(inputString);\n    Notification repliedNotification\
  \ =\n            new Notification.Builder(this, channelID)\n                .setSmallIcon(\n\
  \                        android.R.drawable.ic_dialog_info)\n                .setContentText(\"\
  Reply received\")\n                .build();\n    notificationManager.notify(notificationId,\n\
  \            repliedNotification);\n}\n```\n\n最后一次测试应用程序，并验证在内联回复文本发送后进度器是否消失，以及出现了一个新面板表示回复已收到：\n\
  \n![](img/Image2457.jpg)\n\n图 62-5\n\n## 62.9 总结\n\n直接回复通知功能允许用户在通知内输入文本，并通过通过 `intent`\
  \ 传递给相应应用程序的 activity。直接回复是通过 `RemoteInput` 类实现的，该类的实例可以嵌入到操作（action）中，并与通知一起打包。在处理直接回复通知时，让\
  \ `NotificationManager` 服务知道回复已接收并处理非常重要。实现这一点的最佳方法是使用最初发布通知时提供的 `notification ID`\
  \ 直接更新通知消息。\n\n# 63. 折叠屏设备与多窗口支持\n\n无论我们是否准备好，折叠屏设备都会到来（对于第一代三星 Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了准备这类新类型的设备，注意应该采取的一些额外步骤非常重要的，以确保你的应用程序在折叠屏设备上运行时运行正常。幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在于\
  \ Android 中。\n\n### 63.1 折叠屏与多窗口支持\n\n当应用程序在折叠屏设备上运行时，它可能会与其他应用程序共享屏幕，并遇到重大的配置更改（例如当用户折叠或展开显示器时屏幕尺寸的变化）。如果你的应用程序已经设计为可以处理设备方向的变化，那么它很可能能够处理由屏幕折叠引起的变化。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备上同时显示多个 activity。Android\
  \ 中的多窗口支持提供了三种不同的窗口支持形式。\n\n**分屏模式**适用于大多数手机、折叠屏和平板设备，它提供了一个分屏环境，其中两个 activity 并排显示或一个在上在上。它提供了一个可移动的分割线，当用户拖动它时，会调整给每个相邻\
  \ activity 的屏幕百分比：\n\n![](img/Image2427.jpg)\n\n图 63-1\n\n**自由窗口模式**（Freeform mode）为大屏幕设备提供了一个窗口化环境，目前由设备制造商决定是否启用。自由窗口模式与分屏模式的不同之处在于，它允许每个\
  \ activity 在独立的、可调整大小的窗口中显示，并且不限于显示两个 activity。例如，图中显示了一个处于自由窗口模式的设备，其中 `Calculator`\
  \ 和第二个应用程序显示在两个独立的窗口中：\n\n![](img/Image2436.jpg)\n\n图 63-2\n\n**画中画支持**（Picture-in-picture\
  \ support）顾如其名，允许用户在执行其他任务时在较小的窗口中继续播放视频，该主题将在题为“Android 画中画模式”的章节开始讨论。\n\n### 63.2\
  \ 使用折叠屏模拟器\n\n尽管在编写时，市场上还没有可以进行应用测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择\
  \ `Tools -> AVD Manager` 菜单选项，点击 `Create Virtual Device` 按钮，并在硬件选择屏幕上，选择如下所示的 `Foldable`\
  \ 选项之一：\n\n![](img/3.5_foldable_emulator.jpg)\n\n图 63-3\n\n在选择折叠屏后，继续创建过程，选择 `Android\
  \ 10 API 29` 或更高版本作为系统镜像。一旦模拟器启动运行，工具栏上将出现额外的按钮，允许模拟器在折叠和展开的配置之间切换：\n\n![](img/3.5_foldable_emulator_fold_button.jpg)\n\
  \n图 63-4\n\n### 63.3 进入多窗口模式\n\n可以通过显示 `Overview screen`（概览屏幕）、长按工具栏中列出的应用应用图标，并如下所示选择\
  \ `Split screen`（分屏）菜单选项进入分屏模式：\n\n![](img/3.5_split_screen_button.jpg)\n\n图 63-5\n\
  \n进入分屏模式后，`Overview button` 将变为显示两个矩形（标记为 A），当前 activity 将占据屏幕部分 (B)，`Overview screen`\
  \ 将出现在屏幕的相邻部分，允许选择第二个 activity 进行显示 (C)：\n\n![](img/3.5_split_screen_select_second_app.jpg)\n\
  \n图 63-6\n\n一旦选择了第二个应用，屏幕将被平分。要退出分屏模式，只需将分离两个 activity 的分割线拖动到远端，使一个 activity 占据整个屏幕，或者长按\
  \ `Overview button` 直到它恢复为单个方块。\n\n### 63.4 启用并使用自由窗口支持\n\n尽管在所有设备上都未获得官方支持，但在大屏幕设备和模拟器上启用自由窗口模式。要启用此模式，请在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings global enable_freeform_support 1\n```\n\n\
  在做出此更改后，可能需要重启设备才能生效。一旦启用，在长按应用图标时，`Overview screen` 中会出现一个额外的选项，如下所示：\n\n![](img/3.5_freeform_button.jpg)\n\
  \n图 63-7\n\n### 63.5 检查自由窗口支持\n\n正如本章早期概述，Google 将启用自由窗口多窗口模式的选择交给了各个 Android 设备制造商。由于只有在大屏幕上使用自由窗口才有意义，因此无法保证在可能运行应用的每个设备上都有自由窗口。幸运的是，如果设备上不支持自由窗口，系统所有特定的自由窗口方法和属性都会被忽略，因此在非自由窗口设备上使用它们不会导致应用程序崩溃。然而，可能会出现需要检测设备是否支持自由窗口多窗口模式的情况。幸运的是，这可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查自由窗口多窗口支持并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 63.6\
  \ 在应用程序中启用多窗口支持\n\n\n\n\n\n`android:resizableActivity` 清单文件设置控制了应用是否支持多窗口行为。此设置可以在应用程序级别或单个\
  \ activity 级别进行配置。例如，以下代码片段配置了名为 `MainActivity` 的 activity，使其支持分屏和自由窗口多窗口模式：\n\n\
  ```xml\n<activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 `false` 将防止该 activity 在分屏或自由窗口模式下出现，且相应的按钮将不会出现在应用程序的“概览（Overview）”菜单中。在分屏配置中，选择一个禁用多窗口支持的\
  \ activity 作为第二个 activity，将显示一条消息，指示该应用可能不支持多窗口模式。\n\n## 63.7 指定多窗口属性\n\n`<layout>`\
  \ 元素提供了若干属性，用于指定 activity 在启动到多窗口模式时的尺寸和位置。当 activity 在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性指定：\n\
  \n- `android:defaultWidth` – 指定 activity 的默认宽度。\n- `android:defaultHeight` – 指定\
  \ activity 的默认高度。\n- `android:gravity` – 指定 activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n请注意，上述属性仅在 activity 在自由窗口模式下显示时才生效。以下示例配置了 activity 以特定的高度和宽度显示在屏幕起始边缘的顶部：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定 activity 在分屏视图或自由窗口模式下可以缩减的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定 activity 在分屏或自由窗口模式下可以缩减的最小高度。\n- `android:minimalWidth`\
  \ - 指定 activity 在分屏或自由窗口模式下可以缩减的最小宽度。\n\n当用户滑动分屏分割线超出最小高度或宽度边界时，系统将停止调整收缩中 activity\
  \ 的布局，并简单地裁剪用户界面为相邻的 activity 留出空间。\n\n以下清单文件片段为 activity 实现了最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n             android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n##\
  \ 63.8 在 Activity 中检测多窗口模式\n\n在某些情况下，activity 需要检测其当前是否正以多窗口模式显示给用户。可以通过调用 `Activity`\
  \ 类的 `isInMultiWindowMode()` 方法来获取当前状态。调用此方法时，它会返回一个 `true` 或 `false` 值，取决于该 activity\
  \ 当前是否处于全屏状态：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity 正在多窗口模式运行\n\
  } else {\n    // Activity 不在多窗口模式\n}\n```\n\n## 63.9 接收多窗口通知\n\n如果 activity 重写了\
  \ `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，当\
  \ activity 退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n\
  @Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,\n \
  \                                    Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // Activity 进入多窗口模式\n   \
  \ } else {\n        // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如“处理 Android Activity\
  \ 状态更改”章节概述的，为了跟踪 activity 获取和失去顶层状态的过程，可以实现 `onMultiWindowModeChanged()` 方法，例如：\n\
  \n```java\n@Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,\n\
  \                                     Configuration newConfig) {\n    // ...\n \
  \   if (isInMultiWindowMode) {\n        // Activity 现在是顶层 activity\n    } else {\n\
  \        // Activity 不再是顶层 activity\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在清单文件中启用以下属性，也可以利用多恢复（multi-resume）功能：\n\
  \n```xml\n<meta-data android:name=\"android.allow_resumed_activities\" android:value=\"\
  true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在“Android Intents – 一个工作示例”中，创建了一个示例应用，其中\
  \ activity 使用 intent 启动第二个 activity。默认情况下，通过 intent 启动的 activity 被认为与源 activity\
  \ 位于同一个任务栈中。然而，通过向 intent 传递适当的标志，可以将 activity 启动到新的任务栈中。\n\n当多窗口模式下的 activity 在同一个任务栈中启动另一个\
  \ activity 时，新 activity 将替换分屏或自由窗口中的源 activity（用户可以通过返回键回到源 activity）。然而，如果在分屏模式下启动到新的任务栈，第二个\
  \ activity 将出现在源 activity 的相邻窗口，从而同时查看两个 activity。在自由窗口模式下，启动的 activity 将独立于源 activity\
  \ 显示。\n\n要将 activity 启动到新的任务栈，必须在启动前对 intent 设置以下标志：\n\n- `Intent.FLAG_ACTIVITY_ADJENT`\n\
  - `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n- `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n以下示例配置并启动了一个位于独立窗口的第二个\
  \ activity：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJENT\
  \ |\n          Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n          Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.11 配置自由窗口 activity 的尺寸和位置\n\n默认情况下，自由窗口模式下启动到不同任务栈的\
  \ activity 将位于屏幕中心，尺寸由系统决定。通过 `ActivityOptions` 类向 intent 传递边界设置，可以控制此窗口的位置和维度。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置代表 activity 窗口的左 (X)、顶 (Y)、右 (X) 和底 (Y) 坐标。以下示例创建了一个 `Rect` 对象，其左上角位于坐标\
  \ (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100, 800, 900, 700);\n\
  ```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法使用 `Rect` 设置进行初始化：\n\
  \n\n\n\n\n`ActivityOptions options = ActivityOptions.makeBasic();`\n\n`ActivityOptions\
  \ bounds = options.setLaunchBounds(rect);`\n\n最后，`ActivityOptions` 实例被转换为 `Bundle`\
  \ 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n结合这些步骤后，代码序列如下：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\
  i.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\nRect rect = new Rect(100, 800, 900,\
  \ 700);\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源活动处于自由窗口模式（freeform mode）时，通过 `intent` 启动第二个活动，新活动窗口将按照 `Rect` 对象中定义的区域和尺寸出现。\n\
  \n### 63.12 总结\n\nAndroid 7 引入了多窗口支持，这种系统允许屏幕上同时显示多个活动。这一功能现在成了为折叠屏设备提供支持的基础。多窗口支持提供了三种模式：分屏（split-screen）、自由窗口（freeform）和画中画（picture-in-picture）。在分屏模式下，屏幕被水平或垂直分为两个窗格，每个窗格显示一个活动。自由窗口模式仅支持某些\
  \ Android 设备，它允许每个活动出现在独立的、可移动且可调整大小的窗口中。正如本文所述，Android SDK 提供了许多方法和属性设置，用于在应用内检测、响应和控制多窗口行为。\n\
  \n## 64. Android SQLite 数据库概览\n\n不需要至少存储一些持久化数据的移动应用程序是寥寥无几的。数据库的使用是大多数应用的一个基本方面，涵盖了从几乎完全由数据驱动的应用，到仅需要存储少量数据（如游戏的当前得分）的应用。\n\
  \n当考虑到典型的 Android 应用具有某种瞬性的生命周期时，持久化数据存储的重要性变得更加尤为明显。由于 Android 运行时系统始终存在终止应用程序组件以释放资源的风险，因此，一个避免数据丢失的全面数据存储策略是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将提供与 Android 操作系统绑定的 SQLite 数据库管理系统的概述，并概述 Android SDK 提供的类，以便在 Android 应用内部实现基于\
  \ SQLite 的持久化数据库存储。然而，在深入探讨 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n###\
  \ 64.1 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基础层的数据结构。每个数据库可以包含多个表，每张表都设计用于存储特定类型的信息。例如，数据库可以包含一个客户表（customer\
  \ table），其中包含特定业务每位客户的名称、地址和电话号码。同一个数据库可能还包含一个产品表（products table），用于存储该业务销售商品的描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库内必须是唯一的。表名称一旦分配给数据库中的表，除非在另一个数据库的上下文中，否则不能用于另一个表。\n\
  \n### 64.2 引入数据库架构（Schema）\n\n数据库架构（Database Schemas）定义了存储在数据库表中的数据的特征。例如，客户数据库表的架构可能会定义客户名称是一个长度不超过\
  \ 20 个字符的字符串，并且客户电话是一个特定格式的数值数据字段。\n\n架构还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n###\
  \ 64.3 列和数据类型\n\n在此阶段，开始将数据库表视为类似于电子表格（数据存储在行和列中）将是有帮助的。\n\n每一列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每列反过来被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值型数据。\n\n### 64.4 数据库行\n\n保存到表中的每个新记录都存储在某行（row）中。每一行反过来由与保存记录关联的数据列组成。\n\
  \n再次考虑本章前面描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每列都包含每位客户的数据（名称、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行对应的列中。\n\
  \n行有时也被称为记录（records）或条目（entries），这些术语通常可以互换。\n\n### 64.5 引入主键\n\n每个数据库表都应该包含一个或多个列，这些列可唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。例如，一个表可以使用银行账户列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地标识表中的某特定行。如果没有主键，将无法检索或删除表中的某特定行，因为无法确定选择了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个姓“Smith”的客户，会产生什么问题。如果没有一种保证的方法来标识特定行，就无法确保访问了正确的数据。\n\
  \n主键可以由表中的单列或多列组成。为了符合单列主键的标准，没有两个行包含相同的主键值。当使用多个列构造主键时，单个列的值不需要唯一，但所有列的值组合必须是唯一的。\n\
  \n### 64.6 什么是 SQLite？\n\nSQLite 是一个嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是典型的例子）是独立运行并与需要数据库访问的应用程序协作的服务器进程。SQLite 被称为嵌入式，是因为它是以库的形式提供并链接到应用程序中的。因此，后台没有运行的独立数据库服务器。所有的数据库操作通过调用\
  \ SQLite 库包含的函数在应用程序内部处理。\n\nSQLite 的开发者已将该技术投入公共领域，结果它现在成为了一种广泛部署的数据库解决方案。\n\n\
  SQLite 使用 C 语言编写，因此 Android SDK 提供了围绕底层数据库接口的 Java 基“封装器”。这本质上由一组类组成，可以在应用程序的 Java\
  \ 或 Kotlin 代码中创建并管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参阅 `[`www.sqlite.org`](https://www.sqlite.org)`。\n\
  \n### 64.7 结构化查询语言 (SQL)\n\n\n\n\n\n在 SQLite 数据库中使用一种名为结构化查询语言（Structured Query\
  \ Language）的高级语言访问数据。它通常缩写为 `SQL`，读音为 \"sequel\"。`SQL` 是绝大多数关系型数据库管理系统使用的标准语言。`SQLite`\
  \ 基本遵循 `SQL-92` 标准。\n\n`SQL` 本质上是一种非常简单且易于使用的语言，专门设计用于读取和写入数据库数据。由于 `SQL` 包含一组少量的关键字，因此可以快速学习。此外，大多数\
  \ DBMS 实现之间的 `SQL` 语法大体相同，因此在学习了一个系统的 `SQL` 之后，你的技能很可能会迁移到其他数据库管理系统。\n\n虽然本章将用到一些基础的\
  \ `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。不过，还有许多其他资源可以提供比我们在此单章节中能提供的详尽多的 `SQL` 概述。\n\n\
  ## 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对通用数据库（特别是 `SQLite`）不熟悉的读者来说，直接开始创建一个使用\
  \ `SQLite` 的 Android 应用程序可能会有些令畏。幸运的是，Android 预装了 `SQLite`，其中包含一个交互式环境，可以在连接到运行中的\
  \ Android AVD 模拟器实例的 `adb shell` 会话中发布 `SQL` 命令。这既是学习 `SQLite` 和 `SQL` 的有效方法，也是识别运行在模拟器中的应用程序创建的数据库问题的价值工具。\n\
  \n要启动交互式 `SQLite` 会话，首先运行 AVD 会话。这可以通过在 Android Studio 中启动 Android 虚拟设备管理器（`Tools`\
  \ -> `AVD Manager`）、选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 运行，打开终端或命令提示符窗口，并使用 `adb`\
  \ 命令行工具如下连接到模拟器（注意 `-e` 标志指示工具查找可以连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n```\n\
  \n连接后，shell 环境将提供一个命令提示符，您可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/\
  \ su\nroot@android:/ #\n```\n\n如果出现指示不允许超级用户权限的消息，可能是该 AVD 实例包含了 Google Play 支持。要解决此问题，请创建一个新的\
  \ AVD，并在“选择设备定义”屏幕上，选择一个在“Play Store”列中没有标记的设备。\n\n存储在 `SQLite` 数据库中的数据实际上存储在运行应用程序的\
  \ Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data/<package name>/databases/<database\
  \ filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp` 的应用程序创建一个名为 `mydatabase.db`\
  \ 的数据库，则设备上的文件路径如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了练习的目的，请在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于某些 `SQLite` 实验的子目录结构：\n\n\
  ```bash\ncd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\n\
  mkdir databases\ncd databases\n```\n\n为数据库文件创建了合适的位置后，按如下方式启动交互式 `SQLite` 工具：\n\n\
  ```bash\nroot@android:/data/data/databases # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n\
  SQLite version 3.8.10.2 2015-05-20 18:17:19\nEnter \".help\" for usage hints.\n\
  sqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行如创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含存储 ID、名称、地址和电话号码字段的新表，需要以下语句：\n\
  \n```sql\ncreate table contacts (_id integer primary key autoincrement, name text,\
  \ address text, phone text);\n```\n\n注意，表中的每行都应该有一个对该行唯一的的主键。在上面的示例中，我们将 `_id` 字段指定为主键，将其声明为\
  \ `integer` 类型，并要求 `SQLite` 在每次添加新行时自动增加数字。这是确保每行都具有唯一主键的常用方法。在大多数其他平台上，主键名称的选择是任意的。然而，在\
  \ Android 中，必须将键命名为 `_id`，以便使用所有的 Android 数据库相关类完全访问数据库。剩余的字段每个都被声明为 `text` 类型。\n\
  \n要列出当前选择数据库中的表，使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n从 `sqlite3` 交互式环境退出：\n\n```sql\nsqlite> .exit\n```\n\n## 64.9 Android Room\
  \ 持久库\n\n`SQLite` 如前所述，是用 C 语言编写的，而 Android 应用主要使用 Java 或 Kotlin 开发。为了弥补过去这种“语言差距”，Android\
  \ SDK 包含了一组位于 `SQLite` 数据库管理系统之上的类。虽然这些类在 SDK 中仍然可用，但使用这些类仍然需要编写大量的代码，并且没有利用新的架构指南和功能（如\
  \ LiveData 和生命周期管理）。为了解决这些缺点，Android Jetpack 组件包含了 `Room` 持久库。该库在 `SQLite` 数据库系统之上提供了一个高级接口，使其能够以少量代码在\
  \ Android 设备上本地存储数据，同时符合现代应用程序架构的建议。\n\n## 64.10 总结\n\n`SQLite` 是一个轻量级的嵌入式关系型数据库管理系统，作为\
  \ Android 框架的一部分，为 Android 应用程序实现组织的持久化数据存储提供了机制。与 `Room` 持久库结合时，Android 提供了一种在\
  \ Android 内部实现数据存储的现代方式。\n\n\n\n\n\n# 65. Android Room 持久化库\n\nRoom 持久化库包含在 Android\
  \ Architecture Components 中，专门设计用于更更容易地为 Android 应用添加数据库存储支持，并且这种方式符合 Android 架构指南。在上一章中涵盖了\
  \ SQLite 数据库的基础知识后，本章将探索基于 Room 的数据库管理的基本概念、在 Android 应用中实现 Room 支持的协作关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的章节将通过示例\
  \ Room 数据库项目的形式将这些理论付诸实践。\n\n## 65.1 重新审视现代应用架构\n\n名为[“使用 Jetpack 构建现代 Android 应用架构”]的章节介绍了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。[图\
  \ 65-1]中所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  在本书之前的章节中已经详细介绍了该架构的顶三层，现在是时候在 Room 持久化库背景下探索仓库（Repository）和数据库架构层了。\n\n## 65.2\
  \ Room 数据库持久化的关键元素\n\n在本书章稍后进入详细讨论之前，首先值得总结使用 Room 持久化库处理 SQLite 数据库涉及的关键元素：\n\n\
  ### 65.2.1 仓库 (Repository)\n\n如之前所述，仓库模块包含了直接处理应用使用的所有数据源所需的所有。这避免了 UI 控制器和 `ViewModel`\
  \ 包含直接访问数据库或网络服务的代码。\n\n### 65.2.2 Room 数据库\n\n`room database` 对象提供了底层 SQLite 数据库的接口。它还为仓库提供了访问数据访问对象\
  \ (`DAO`) 的权限。一个应用应该只有一个 `room database` 实例，该实例可以用于访问多个数据库表。\n\n### 65.2.3 数据访问对象\
  \ (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除所需的 SQL 语句。这些 SQL 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\
  \n### 65.2.4 实体 (Entities)\n\n实体是定义数据库中表模式的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表模式外，实体类还包含提供访问这些数据字段的\
  \ getter 和 setter 方法。`DAO` 响应 SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。然后将调用 getter 方法来从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用在对象上配置值，然后调用在 `DAO` 中声明的 `insert` 方法，传递要保存的实体实例。\n\n### 65.2.5 SQLite\
  \ 数据库\n\n负责存储和提供数据访问的实际 SQLite 数据库。应用代码（包括仓库）绝永远不应直接访问此底层数据库。所有的数据库操作都是通过使用 `room\
  \ database`、`DAOs` 和实体的组合完成的。\n\n[图 65-2]中的架构图说明了这些不同元素相互交互以在 Android 应用中提供基于 Room\
  \ 的数据库存储的方式：\n\n![](img/room_architecture_diagram.jpg)\n\n图 65-2\n\n上述架构图中的数字编号连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并在传递给 `DAO`\
  \ 用于搜索和插入操作之前在它们上配置数据。\n3. 仓库调用 `DAO` 上的方法，并传递要插入到数据库的实体，并在响应搜索查询时接收返回的实体实例。\n4.\
  \ 当 `DAO` 有结果要返回给仓库时，它将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 SQLite 数据库的所有低级交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久化库访问数据库的关键元素的基本概述后，现在是时候详细地探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n## 65.3 理解实体\n\n每个数据库表都将有一个关联的实体类。该类定义了表的模式，其形式为标准的 Java 类，并穿插了一些特殊的\
  \ Room 注解。一个声明存储在数据库表中数据的 Java 类示例可能如下所示：\n\n```java\npublic class Customer {\n\n\
  \    private int id;\n    private String name;\n    private string address;\n\n\
  \    public Customer(String name, String address) {\n        this.id = id;\n   \
  \     this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public String getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现方式，上面的代码声明了一个基础 Java 类，其中包含若干代表数据库字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类还没有实体。为了使该类成为实体并使其在 SQL 语句可用，需要添加如下 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n \
  \   @ColumnInfo(name = \"customerName\")\n    private String name;\n\n    private\
  \ String address;\n\n    public Customer(String name, String address) {\n      \
  \  this.id = id;\n        this.name = name;\n        this.address = address;\n \
  \   }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public String getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n\n\n\n\n```java\n@ColumnInfo(name\
  \ = \"customerId\")\nprivate int id;\n```\n\n为客户名称字段也分配了一个列名。但注意，地址字段没有分配列名。这意味着地址数据仍将存储在数据库中，但在\
  \ SQL 语句中不需要引用它。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解即可：\n\n```java\n@Ignore\n\
  private String myString;\n```\n\n最后，对 `id` 变量的 setter 方法进行了修改，以防止分配 `null` 值：\n\n\
  ```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n实体类中还可以包含注解，以使用关系型数据库中被称为“**外键**的概念来与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在一个名为\
  \ `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys =\
  \ {@ForeignKey(entity = Customer.class,\n        parentColumns = \"customerId\"\
  ,\n        childColumns = \"buyerId\",\n        onDelete = ForeignKey.CASCADE,\n\
  \        onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当父记录被删除或更新时要采取的操作。可选选项有\
  \ `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT` 和 `SET_NULL`。\n\n### 65.4 数据访问对象\n\
  \n数据访问对象（DAO）提供了访问存储在 SQLite 数据库中的数据的方法。`DAO` 被声明为标准的 Java 接口，并带有一些额外的注解，将特定的 SQL\
  \ 语句映射到方法，这些方法可以由仓库调用。\n\n第一步是创建接口并使用 `@Dao` 注解将其声明为 DAO：\n\n```java\n@Dao\npublic\
  \ interface CustomerDao {\n}\n```\n\n接下来，添加包含 SQL 语句和相应方法名的条目。例如，下面的声明允许通过调用名为 `getAllCustomers()`\
  \ 的方法检索 `customers` 表中的所有行：\n\n```java\n@Dao\npublic interface CustomerDao {\n \
  \   @Query(\"SELECT * FROM customers\")\n    LiveData<List<Customer>> getAllCustomers();\n\
  }\n```\n\n注意，`getAllCustomers()` 方法返回一个 `List` 对象，其中包含从数据库表中检索到的每条记录的 `Customer`\
  \ 实体对象。DAO 还利用了 `LiveData`，以便仓库能够观察到数据库的变化。\n\n参数也可以传递给方法，并在相应的 SQL 语句中引用。考虑下面的\
  \ DAO 声明，它会搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是实体类中分配给列的名称）：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，方法接收了一个字符串值，该值随后通过在变量名前前加上冒号（`:`）被包含在 SQL 语句中。\n\n\
  可以使用 `@Insert` 方便注解声明一个基础的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer customer);\n\
  ```\n\n这被称为方便注解，因为 Room 持久化库可以推断传递给 `addCustomer()` 方法的 `Customer` 实体将要插入数据库中，而无需提供\
  \ SQL 插入语句。也可以在单个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n下面的 DAO 声明删除所有匹配提供的客户名称的记录：\n\n```java\n@Query(\"DELETE FROM\
  \ customers WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\n作为使用\
  \ `@Query` 注解执行删除的替代方案，也可以使用 `@Delete` 方便注解。在下面的示例中，所有与传递给 `deleteCustomers()` 方法的实体集匹配的\
  \ `Customer` 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供了类似的行为：\n\n```java\n@Update\npublic\
  \ void updateCustomers(Customer... customers);\n```\n\n此类数据库操作的 DAO 方法也可以声明为返回一个\
  \ `int` 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer...\
  \ customers);\n```\n\n### 65.5 Room 数据库\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，并作为嵌入\
  \ Android 操作系统的实际 SQLite 数据库之上的层。该类负责创建并返回新的 Room 数据库实例，并提供与数据库关联的 DAO 实例的访问。\n\n\
  Room 持久化库提供了一个数据库构建器来创建数据库实例。每个 Android 应用应该只有一个 Room 数据库实例，因此最好在类内部实现防御性代码，以防止创建多个实例。\n\
  \n下面的代码列表列出了与示例客户表一起使用的 Room 数据库实现：\n\n```java\nimport android.content.Context;\n\
  import android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Customer.class},\
  \ version = 1)\npublic class CustomerRoomDatabase extends RoomDatabase {\n    abstract\
  \ CustomerDao dao();\n    private static CustomerRoomDatabase INSTANCE;\n    static\
  \ CustomerRoomDatabase getDatabase(Context context) {\n        if (INSTANCE == null)\
  \ {\n            synchronized (CustomerRoomDatabase.class) {\n                if\
  \ (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            CustomerRoomDatabase.class, \"customer_database\")\n\
  \                            .build();\n                }\n            }\n     \
  \   }\n        return INSTANCE;\n    }\n}\n```\n\n注意上述示例中重要的区域是类上方声明数据库工作实体的注解、检查类是否已创建实例的代码，以及为实例分配的名称\
  \ `customer_database`。\n\n### 65.6 仓库\n\n仓库负责获取 Room 数据库实例，使用该实例访问 DAO，然后调用 DAO\
  \ 方法执行数据库操作。一个为配合 Room 数据库设计的典型构造函数可能如下：\n\n```java\npublic class CustomerRepository\
  \ {\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase db;\n\
  \    public CustomerRepository(Application application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n\n}\n```\n\n一旦仓库访问了 DAO，就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` DAO 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，重要的是，除非该方法返回 `LiveData`\
  \ 实例（它会自动在单独线程上运行查询），否则无法在应用程序的主线程上执行操作。事实上，尝试这样做会导致应用程序崩溃，并产生以下诊断输出：\n\n```\n无法在主线程上访问数据库，因为它可能会长时间锁定\
  \ UI\n```\n\n\n\n\n\n由于某些数据库事务可能需要较长的时间才能完成，因此在单独线程线程运行操作可以避免应用出现假死状态。正如“Android\
  \ Room 数据库与仓库教程”章节将展示的，这个问题可以通过使用 Java 线程来轻松解决（如需更多信息或回顾如何使用线程，请参阅“Java 线程、Handlers\
  \ 和执行器基础概述”章节）。\n\n## 65.7 内存数据库\n\n本章概述的示例涉及对 SQLite 数据库的使用，该数据库以数据库文件的形式保存在于 Android\
  \ 设备的持久性存储中。这确保了即使应用程序进程终止，数据仍然存在。\n\nRoom 数据库持久化库还支持内存数据库。这些数据库完全存储在内存中，并在应用程序终止时丢失。与内存数据库配合工作，唯一需要的更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。以下代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                 CustomerRoomDatabase.class, \"customer_database\"\
  )\n                                 .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                         CustomerRoomDatabase.class)\n        \
  \                                 .build();\n```\n\n## 65.8 数据库检查器\n\nAndroid Studio\
  \ 包含一个 Database Inspector（数据库检查器）工具窗口，允许对与运行应用相关的 Room 数据库进行查看、搜索和修改，如图图 65-3 所示：\n\
  \n![](img/as_database_inspector_window.jpg)\n\n图 65-3\n\n数据库检查器的用法将在“Android Room\
  \ 数据库与仓库教程”章节中介绍。\n\n## 65.9 总结\n\nAndroid Room 持久库包含在 Android 架构组件中，并作为底层 SQLite\
  \ 数据库之上的抽象层。该库的设计旨在符合 Android 架构指南的同时，使数据库操作变得更容易。本章介绍了在 Android 应用项目项目中构建基于 Room\
  \ 的数据库存储所需的相互作用的不同元素，包括实体（entities）、仓库（repositories）、数据访问对象（DAO）、注解和 Room Database\
  \ 实例。\n\n在涵盖了 SQLite 和 Room 架构组件的基础知识后，下一步是创建一个将这些理论付诸实践的示例应用。由于示例应用程序的用户界面需要基于表单布局，下一章“Android\
  \ TableLayout 和 TableRow 教程”）工作时，原计划是它将包含为 Room 数据库示例应用设计用户界面布局的步骤。然而，很快变得明显，实现用户界面的方法是使用\
  \ Android TableLayout 和 TableRow 视图，而且该主题值得作为一个独立的章节。因此，本章将专门关注下一章要完成的数据库应用程序的用户界面设计，并在此过程中花一些时间介绍\
  \ Android Studio 中表格布局的基本概念。\n\n### 66.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout`\
  \ 容器视图的目的是允许用户界面元素以行和列组成的表格格式组织在屏幕上。`TableLayout` 中的每一行都由一个 `TableRow` 实例占据，而 `TableRow`\
  \ 又被划分为多个单元格，每个单元格包含一个子视图（该单元格本身可以是一个包含多个子视图的容器）。\n\n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸展（或两者兼有），以便它们的大小相对于父\
  \ `TableLayout` 发生变化。此外，单个单元格可以配置为跨多列。\n\n考虑图 66-1 所示的用户界面布局：\n\n![](img/as_4.1_room_demo_ui.jpg)\n\
  \n图 66-1\n\n从布局的视觉外观来看，很难识别出设计界面时使用的 `TableLayout` 结构。然而，图 66-2 所示的层次树使得结构稍微更容易理解一些：\n\
  \n![](img/as_4.2.jpg)\n\n图 66-2\n\n显然，布局由一个父 `LinearLayout` 视图和其 `TableLayout` 及\
  \ `RecyclerView` 子视图组成。`TableLayout` 包含三个 `TableRow` 子视图，代表表格中的三行。`TableRows` 包含两个子视图，每个子视图代表表格单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子视图。\n\n### 66.2 创建 Room 数据库项目\n\n创建 Room 数据库项目\n\n从欢迎界面选择 New\
  \ Project（新建项目）菜单选项，在出现的新项目对话框中，点击 Next（下一步）按钮之前，选择 Fragment + ViewModel 模板。\n\n\
  在 Name（名称）字段中输入 `RoomDemo` 并指定 `com.ebookrenzy.room` 为包名。在点击 Finish（完成）按钮之前，将 Minimum\
  \ API（最低 API 级别）改为 26: Android 8.0 (Oreo)，并将 Language（语言）菜单改为 Java。\n\n### 66.3\
  \ 转换为 LinearLayout\n\n转换为 LinearLayout\n\n在 Project（项目）窗口中（app -> res -> layout）找到\
  \ `main_fragment.xml` 文件，并双击将其加载到 Layout Editor 工具。默认情况下，Android Studio 使用 `ConstraintLayout`\
  \ 作为根布局元素。这需要转换为垂直方向的 `LinearLayout`。在 Design 模式下的 Layout Editor 中，找到 `ConstraintLayout`\
  \ 组件并右键点击它以显示图 66-3 所示的菜单，然后选择 Convert view...（转换视图...）选项：\n\n![](img/as_4.1_room_demo_convert_view.jpg)\n\
  \n图 66-3\n\n在出现的对话框（图 66-4）中，点击 Apply（应用）按钮之前，选择转换为 `LinearLayout`：\n\n![](img/as_4.1_room_demo_convert_linear.jpg)\n\
  \n图 66-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平 `LinearLayout`，因此在 Component\
  \ Tree 窗口中选择布局组件，参考 Attributes（属性）窗口并将 `orientation`（方向）属性更改为垂直：\n\n![](img/as_3.4_linearlayout_change_orientation.jpg)\n\
  \n图 66-5\n\n转换完成后，从布局中删除默认的 `TextView` 小部件。\n\n### 66.4 在用户界面中添加 TableLayout\n\n\
  在用户界面中添加 TableLayout\n\n留在 `main_fragment.xml` 文件中并参考 Palette（调色板）中的 Layouts（布局）类别，拖放并释放\
