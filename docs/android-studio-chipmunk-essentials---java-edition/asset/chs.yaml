  \n## 75.1 Google Maps 的元素\n\nGoogle Maps API 由以下核心元素组成，这些元素在地图上提供功能：\n\n- **GoogleMap**：在\
  \ Android 应用程序，它负责下载地图瓦片并响应地图的控件。\n- **MapView**：`View` 的子类，用于在布局中绘制地图。\n- **SupportFragment**：`Fragment`\
  \ 的子类，允许在片段中使用地图。\n- **Marker**：通过 `addMarker` 方法添加，在地图上标记位置。Marker 的位置通过 Longitude\
  \ 和 Latitude 定义。\n- **Shapes**：通过绘制线条、多边形和圆形在地图上实现，使用了 `Polyline`、`Polygon` 和 `Circle`\
  \ 类。\n- **UiSettings**：该类提供了对地图控件的控制，例如控制是否显示缩放、当前位置和指南。\n- **My Location Layer**：启用后，地图上会显示一个按钮，点击后地图中心位于用户的当前地理位置。用户静止时用蓝色标记表示，移动时则用箭头指示方向。\n\
  \n熟悉 Google Maps API 的最佳方法是通过示例。本章的剩余部分将创建一个示例并突出 API 的关键区域。\n\n### 75.2 创建 Google\
  \ Maps 项目\n\n在欢迎界面选择 New Project，在出现的新项目对话框中选择 Google Maps Activity 模板，然后点击 Next\
  \ 按钮。\n\n在 Name 字段输入 MapDemo，并指定包名为 `com.ebookfrenzy.mapdemo`。在点击 Finish 按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\n###\
  \ 75.3 获取开发者签名\n\n在应用程序可以使用 Google Maps Android API 之前，必须先在 Google APIs Console\
  \ 中进行注册。在注册之前，必须识别与开发环境相关的开发者签名（也称为 SHA-1 指纹）。它包含位于主目录下 .android 子目录中的 keystore\
  \ 文件，可以使用 Java SDK 提供的 `keytool` 工具获取。然而，为了简化过程，当在创建项目期间选择 Google Maps 选项时，Android\
  \ Studio 会项目中添加一些额外文件。其中一个文件名为 `google_maps_api.xml`，位于项目的 `app -> res -> values`\
  \ 文件夹。\n\n`google_maps_api.xml` 文件包含一个指向 Google Developer 控制的链接。复制此链接并粘贴到浏览器窗口。加载后，将出现类似下面的页面：\n\
  \n![](img/Image24274.jpg)\n\n图 75-1\n\n\n\n在点击 `Continue` 按钮之前，请确认菜单已设置为 `Create\
  \ a new project`。一旦 API 已启用，点击 `Create API Key` 按钮。稍等片，新项目将被创建并出现一个面板（图 75-2），为应用程序提供\
  \ API 密钥。\n\n![](img/Image24364.jpg)\n\n图 75-2\n\n复制此密钥，返回 Android Studio，并将 API\
  \ 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分：\n\n```xml\n<string name=\"google_maps_key\"\ntemplateMergeStrategy=\"\
  preserve\" translatable=\"false\">YOUR_KEY_HERE</string>\n```\n\n### 75.4 添加 Apache\
  \ HTTP 遗留库需求\n\n由于此示例项目将为 Android 9.0 或更高版本的 Android 构建，因此需要在 `AndroidManifest.xml`\
  \ 文件的 `<application>` 节点内添加以下声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MapDemo\">\n    <uses-library\n       \
  \ android:name=\"org.apache.http.legacy\"\n        android:required=\"false\" />\n\
  ```\n```\n\n### 75.5 测试应用程序\n\n运行应用程序测试以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果未显示地图，请检查以下区域：\n\n*   如果应用程序运行在模拟器上，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择\
  \ `Tools -> Android -> AVD Manager` 菜单选项更改 AVD 配置的当前操作系统，点击 AVD Actions 列中的铅笔图标，然后点击当前\
  \ Android 版本旁边的 `Change…` 按钮。在系统镜像对话框中，选择一个包含 Google APIs 的目标。\n*   检查 `Logcat`\
  \ 输出，查看任何与 Google Maps API 身份验证问题相关的内容。这通常意味着 API 密钥输入错误，或者应用程序包名与生成 API 密钥时指定的包名不匹配。\n\
  *   在 Google API 控制台中验证 Google Maps Android API 是否已在服务面板中启用。\n\n### 75.6 理解地理编码和反向地理编码\n\
  \n如果不先介绍地理编码（Geocoding）主题，就无法谈论地图和地理位置。地理编码最好的描述是将基于文本的地理位置（例如街道地址）转换为以经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类实现地理编码。例如，可以向 `Geocoder` 类的实例传递代表位置的字符串（如城市名称、街道地址或机场代码）。`Geocoder`\
  \ 将尝试找到匹配的位置，并返回一个可能匹配位置字符串的 `Address` 对象列表，这些对象按顺序排序，最匹配的项位于列表的 0 位置。随后可以从 `Address`\
  \ 对象中提取各种信息，包括潜在匹配项的经纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航天博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\ntry\
  \ {\n    geocodeMatches =\n        new Geocoder(this).getFromLocationName(\n   \
  \         \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意传递了值 `1`。上面的代码是基于文本的正向地理编码（forward-geocoding）示例。正如名称所示，反向地理编码（reverse-geocoding）涉及将坐标转换为可读的字符串。例如，考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\ndouble latitude;\ndouble longitude;\nList<Address>\
  \ geocodeMatches = null;\ntry {\n    geocodeMatches =\n        new Geocoder(this).reverseGeocode(38.887425,\
  \ -77.020029, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n\
  \    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    latitude =\
  \ geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n在这种情况下，`Geocoder` 对象通过 `reverseGeocode()` 方法使用经度和纬度值进行初始化。再次，仅请求单个结果。然后从生成的\
  \ Address 对象中提取地址信息。需要注意的是，地理编码实际上并不是在 Android 设备上执行的，而是在服务器上执行，设备在需要翻译时连接到服务器，随后返回结果。\n\
  \n### 75.7 在应用程序中添加地图\n\n向应用程序添加地图简单的方法是在用户界面布局文件中指定它。以下布局文件显示了在 `activity_maps.xml`\
  \ 文件中添加的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\
  \n    tools:context=\".MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n### 75.8 请求位置权限\n\n正如在 Android 中请求运行时权限 章节所述，某些权限被归类为危险权限，对于 Android\
  \ 6.0 或更高版本需要特殊处理。其中一种权限允许应用程序识别用户的当前位置。默认情况下，Android Studio 已在 `AndroidManifest.xml`\
  \ 文件中放置了位置权限请求。找到项目工具窗口中 app -> manifests 下的该文件，并找到以下权限行：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n```\n\n这将确保在旧版本 Android\
  \ 上安装应用程序时，能够获得提供位置信息权限的机会，但为了完全支持 Android 6.0 或更高版本，应用程序必须在运行时专门请求此权限。为了实现这一点，需要在\
  \ `MapsActivity.java` 文件中添加一些代码。\n\n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage\
  \ com.ebookfrenzy.mapdemo;\n```\n\n\n\n\n```java\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\npublic class MapsActivity extends FragmentActivity\
  \ implements OnMapReadyCallback {\n    private static final int LOCATION_REQUEST_CODE\
  \ = 101;\n    private GoogleMap mMap;\n}\n```\n\n接下来，需要向类中添加一个方法来向用户请求特定的权限。留在 `MapsActivity.java`\
  \ 类文件中，按照如下方式实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    ActivityCompat.requestPermissions(this,\n            new\
  \ String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应时，活动将调用 `onRequestPermissionsResult()`\
  \ 方法。继续留在 `MapsActivity.java` 文件中，现在实现该方法，使其内容如下：\n\n```java\n@Override\npublic\
  \ void onRequestPermissionsResult(int requestCode, String permissions[], int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    switch (requestCode) {\n        case LOCATION_REQUEST_CODE: {\n           \
  \ if (grantResults.length == 0\n                    || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n                Toast.makeText(this,\n                        \"Unable to show\
  \ location - permission required\",\n                        Toast.LENGTH_LONG).show();\n\
  \            } else {\n                SupportMapFragment mapFragment =\n      \
  \                  (SupportMapFragment) getSupportFragmentManager()\n          \
  \                  .findFragmentById(R.id.map);\n                mapFragment.getMapAsync(this);\n\
  \            }\n        }\n    }\n}\n```\n\n如果用户没有授予权限，应用程序将显示一条消息，指示无法显示当前位置。另一方面，如果已授予权限，地图将刷新，以便为显示位置标记提供机会。\n\
  \n## 75.9 显示用户的当前位置\n\n一旦授予了适当权限，可以通过获取与显示的地图相关的 `GoogleMap` 对象的引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法且传入 `true` 值，从而在地图上显示用户的当前位置。\n\n当地图准备好显示时，会调用 活动的 `onMapReady()` 方法。当在上面的 `onRequestPermissionsResult()`\
  \ 方法中刷新地图时，该方法也会被调用。默认情况下，Android Studio 已经实现了此方法，并添加了一些代码将地图对准澳大利亚，并在悉尼市上方放置了一个标记。找到并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，以移除此模板代码，并添加代码在启用显示用户当前位置之前检查位置权限已授予。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户发出请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加标记并移动相机\n    LatLng sydney =\
  \ new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n            mMap.setMyLocationEnabled(true);\n        } else {\n          \
  \  requestPermission(Manifest.permission.ACCESS_FINE_LOCATION, LOCATION_REQUEST_CODE);\n\
  \        }\n    }\n}\n```\n\n现在运行应用程序时，将出现图 75-3 所示的对话框请求权限。如果授予权限，地图上将出现一个蓝点，指示设备的当前位置。\n\
  \n## 75.10 更改地图类型\n\n通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法并传入以下值之一，可以动态修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`: 没有地图瓦片的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`: 由经典道路地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`: 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`: 显示带有道路地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`: 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改，可以将地图切换到卫星模式：\n\
  \n```java\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.setMyLocationEnabled(true);\n    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\
  \ LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n       \
  \   xmlns:map=\"http://schemas.android.com/apk/res-auto\"\n          android:id=\"\
  @+id/map\"\n          android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"hybrid\"\n          android:name=\"com.google.android.gms.maps.SupportFragment\"\
  />\n```\n\n## 75.11 向用户显示地图控件\n\nGoogle Maps API 提供了一些可以可选显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮和指南针。\n\
  \n是否显示比例控件和指南针可以通过编程或 XML 资源来控制。要编程配置控件，必须获取与 `GoogleMap` 对象相关的 `UiSettings` 对象引用：\n\
  \n```java\nimport com.google.android.gms.maps.UiSettings;\n\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\n```\n\n通过调用 `UiSettings` 对象的 `setZoomControlsEnabled()`\
  \ 方法启用或禁用比例控件。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n```\n\n\
  或者，可以在 XML 资源文件的 map 元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针只有在地图相机偏离默认方向旋转时才会出现。\n\n“我的位置”按钮只有在本章之前启用我的位置模式时才会出现。即使在这种模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法防止按钮出现。\n\n## 75.12 处理地图手势交互\n\
  \nGoogle Maps Android API 能够响应不同的用户交互。这些交互可以用于更改显示的地图区域、缩放级别，甚至是视角（以便为某些城市显示地图区域的\
  \ 3D 表示）。\n\n### 75.12.1 地图缩放手势\n\n\n\n\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings`\
  \ 对象的 `setZoomGesturesEnabled()` 方法来启用或禁用与地图缩放相关的手势。例如，以下代码禁用了我们示例地图的缩放手势：\n\n```java\n\
  UiSettings mapSettings;\nmapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中，通过将 `map:uiZoomGestures` 属性设置为 `true` 或 `false` 也可以实现相同的效果。\n\
  \n启用后，当用户在屏幕上进行缩捏合手势时，将发生缩放。同样地，双击会放大，而双指轻触会缩小。另一方面，单指缩放手势是通过轻触两次但不释放第二次点击，然后沿屏幕上向上或向下滑动手指来分别进行放大和缩小。\n\
  \n## 75.12.2 地图滚动/平移手势\n\n滚动（或平移）手势允许用户通过单指在屏幕上拖动地图从而在地图上移动。可以通过代码中调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法在内部启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，也可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动功能。\n\n## 75.12.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动它们来调整倾斜角度，从而改变投影的角度。可以通过调用 `UiSettings` 实例的\
  \ `setTiltGesturesEnabled()` 方法启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setTiltGesturesEnabled(true);\n\
  ```\n\n也可以在 XML 布局资源文件中使用 `map:uiTiltGestures` 属性启用或禁用倾斜手势。\n\n## 75.12.4 地图旋转手势\n\
  \n通过在屏幕上放置两个手指并进行圆周运动，当启用地图旋转手势时，用户可以旋转地图的朝向。这种手势支持在代码中通过调用 `UiSettings` 实例的 `setRotateGesturesEnabled()`\
  \ 方法启用或禁用，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setRotateGesturesEnabled(true);\n```\n\n也可以在 XML 布局资源文件中使用 `map:uiRotateGestures`\
  \ 属性启用或禁用旋转手势。\n\n## 75.13 创建地图标记点\n\n标记点（Markers）用于通知用户地图上的位置，其形式可以是标准图标或自定义图标。标记点还可以包含一个标题（title）和可选的文本（称为摘要\
  \ snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击标记点时，将出现一个信息窗口显示有关标记点位置的额外信息。\n\n标记点由 `Marker`\
  \ 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。作为该方法的参数传递的是 `MarkerOptions`\
  \ 类的实例，它包含了标记点所需的各种选项，如标题和摘要文本。标记点的位置通过指定纬度和经度值定义，这些值也包含在 `MarkerOptions` 实例中。例如，以下代码向地图上的特定位置添加了一个包含标题、摘要和位置的标记点：\n\
  \n```java\nimport com.google.android.gms.maps.model.Marker;\nimport com.google.android.gms.maps.model.LatLng;\n\
  import com.google.android.gms.maps.model.MarkerOptions;\n\n...\n\nLatLng position\
  \ = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new MarkerOptions()\n\
  \                .position(position)\n                .title(\"Museum\")\n     \
  \           .snippet(\"National Air and Space Museum\"));\n```\n\n执行上述代码将将标记指定的位置，点击该位置时将显示一个包含标题和摘要的信息窗口，如图\
  \ 75-4 所示：\n\n![](img/Image24513.jpg)\n\n图 75-4\n\n## 75.14 控制地图相机\n\n由于 Android\
  \ 设备的屏幕是平坦的，而地球是球体，Google Maps Android API 使用墨卡托投影在平面表面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google\
  \ Maps Android API 允许在应用程序内部实时更改相机的目标、缩放（zoom）、方位（bearing）和倾斜（tilt）：\n\n- **目标 (Target)**：地图在设备显示器内的中心位置，用经纬度指定。\n\
  - **缩放 (Zoom)**：以级别指定的相机缩放级别。缩放级别增加 `1.0` 会使显示的地图宽度翻倍。\n- **倾斜 (Tilt)**：相机的视角角度，指定为跨越可视地图区域正上方弧线的位置，从弧顶开始以度测量。\n\
  - **方位 (Bearing)**：地图的朝向，以从北方向顺时针方向的角度测量。\n\n为了在相机变化时获得平滑的动画效果，可以使用 `animateCamera()`\
  \ 方法代替 `moveCamera()`。`CameraUpdateFactory` 方法摘要如下：\n\n- `CameraUpdateFactory.zoomIn()`：放大一级。\n\
  - `CameraUpdateFactory.zoomOut()`：缩小一级。\n- `CameraUpdateFactory.zoomTo(float)`：将缩放级别更改为指定值。\n\
  - `CameraUpdateFactory.zoomBy(float)`：按量增加缩放级别。\n- `CameraUpdateFactory.zoomBy(float,\
  \ Point)`：按指定值增加或减少缩放。\n- `CameraUpdateFactory.newLatLng(LatLng)`：更改相机的纬度和经度。\n\
  - `CameraUpdateFactory.newLatLngZoom(LatLng, float)`：更改相机的纬度、经度和缩放。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`：将相机移动到指定的位置。可以使用\
  \ `CameraPosition.Builder()` 获取 `CameraPosition` 实例。\n\n例如，上述代码使用动画放大相机：\n\n```java\n\
  mMap.animateCamera(CameraUpdateFactory.zoomIn());\n```\n\n另一方面，以下代码在不使用动画的情况下将相机移动到新位置并将缩放调整为\
  \ 10：\n\n```java\nprivate static final LatLng position = new LatLng(38.8874245,\
  \ -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position, 10));\n\
  ```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建一个具有目标、缩放、方位和倾斜更改的 `CameraPosition`\
  \ 对象。然后使用动画将更改更改到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n            .target(position)\n            .zoom(50)\n\
  \            .bearing(70)\n            .tilt(25)\n            .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n\
  ```\n\n## 75.15 总结\n\n\n\n\n\n本章概述了构成 Google Maps Android API 的关键类和方法，并概述了准备开发环境和应用程序项目以使用该\
  \ API 的步骤。\n\n# 76. 使用 Android 打印框架进行打印\n\n随着 Android 4.4 KitKat 的发布，从 Android 应用程序内部打印内容已成为可能。后续章节将更详细地探讨为自己的应用程序添加打印支持的选项，但本章将重点关注\
  \ Android 目前提供的提供的各种打印选项以及启用这些选项的步骤。在介绍这些初始主题后，本章将概述 Android 开发者在为应用程序构建打印支持时可以使用的各种打印功能。\n\
  \n## 76.1 Android 打印架构\n\nAndroid 打印由打印框架（Printing framework）提供。简单来说，该框架由一个 `Print\
  \ Manager`（打印管理器）和若干打印服务插件组成。`Print Manager` 负责处理来自设备应用程序的打印请求，并与设备设备上的打印服务插件交互，从而确保打印请求得到执行。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他打印机类型的打印服务插件（如果尚未安装）也可以从\
  \ Google Play 商店获取。目前适用于 HP、爱普、三星和佳能打印机的打印服务插件，未来可能会发布其他打印机制造商的插件，尽管 Google Cloud\
  \ Print 服务插件也可以用于从 Android 设备打印到几乎任何类型和型号的打印机。出于本书的目的，我们将使用 `HP Print Services Plugin`\
  \ 作为参考示例。\n\n## 76.2 打印服务插件\n\n打印服务插件的目的是让应用程序能够打印到通过局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\
  \n通过加载 Google Play 应用程序并搜索“Print Service Plugin”，可以验证 Android 设备上是否存在 `Print Service\
  \ Plugin`。一旦该插件在 Play 商店中列出，如果该插件尚未安装，则可以通过选择 `Install`（安装）按钮进行安装。例如，图 76-1 显示了\
  \ Google Play 中的 HP 打印服务插件。\n\n打印服务插件将自动检测当前 Android 设备所连接的网络上的兼容打印机，并在从应用程序进行打印时将它们列为选项。\n\
  \n![](img/as_4.1_hp_printer_plugin.jpg)\n\n图 76-1\n\n## 76.3 Google Cloud Print\n\
  \nGoogle Cloud Print 是 Google 提供的一服务，允许您从任何具有互联网连接的地方通过网络将内容打印到自己的打印机上。Google Cloud\
  \ Print 支持云就绪（Cloud Ready）和经典（Classic）打印机形式的各种设备和打印机型号。云就绪打印机内置了通过网络进行打印的技术。提供云就绪打印机的制造商包括兄弟、佳能、戴尔、爱普、HP、柯达和三星。要确定您的打印机是否既是云就绪又受\
  \ Google Cloud Print 支持，请查看以下 URL 中的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的非云就绪打印机，Google Cloud Print 通过在连接经典打印机的计算机系统上（直接连接或通过家庭或办公室网络）安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用登录 Android 设备时相同的 Google 账户 ID 登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您从设备上的 Android 应用程序进行打印时，它们将列为打印目标选项。\n\n##\
  \ 76.4 打印到 Google Drive\n\n除了支持物理打印机外，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，选择打印面板中的\
  \ `Save to Google Drive`（保存到 Google Drive）选项。打印内容将被转换为 PDF 文件并保存到与设备上当前激活的 Google\
  \  ID 关联的 Google Drive 云存储中。\n\n## 76.5 保存为 PDF\n\nAndroid 提供的打印选项允许将打印内容作为 PDF\
  \ 文件本地保存到 Android 设备上。一旦选择，该选项将要求指定 PDF 文件名以及保存文档的设备位置。\n\n在测试自己的 Android 应用程序的打印功能时，保存为\
  \ PDF 和 Google Drive 选项在节约纸张方面非常有价值。\n\n## 76.6 从 Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序应将打印选项放在溢出菜单（Overflow\
  \ menu）中。许多与 Android 绑定的应用程序现在都包含了“打印...”菜单选项。例如，图 76-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享...”选项来访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n\n图 76-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android\
  \ 打印屏幕，显示如图 76-3 所示的打印内容预览：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 76-3\n\
  \n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 76-4\n\nAndroid 打印面板提供了纸张大小、颜色、方向和份数等常用的打印选项。可以通过点击当前打印机或\
  \ PDF 输出访问其他打印目标选项。\n\n## 76.7 构建打印支持的选项\n\n打印框架提供了许多为 Android 应用程序构建打印支持的选项。这些选项可以分类如下：\n\
  \n### 76.7.1 打印\n\n正如名称所示，此选项允许在 Android 应用程序中集成图像打印。在应用程序中添加此功能时，第一步是创建一个 `PrintHelper`\
  \ 类的实例：\n\n```\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n接下来，可以通过调用\
  \ `PrintHelper` 实例的 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT`（适应）：图像将缩放到适应纸张尺寸，而不任何裁剪或更改比例。这通常会导致在一个维度出现空白。\n\
  - `SCALE_MODE_FILL`（填充）：图像将缩放以填充纸张尺寸，必要时进行裁剪以避免打印输出中出现空白。\n\n在没有设置缩放模式的情况下，系统默认使用\
  \ `SCALE_MODE_FILL`。例如，以下代码将之前声明的 `PrintHelper` 实例缩放设置为适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项来实现的：\n\
  \n- `COLOR_MODE_COLOR`（彩色）：指示以彩色打印图像。\n\n\n\n\n\n- `COLOR_MODE_MONOCHROME` – 表示图像将以黑白模式打印。\n\
  \n打印框架默认使用彩色打印，除非按照如下方式指定了单色选项：\n\n```java\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作仅需提供一个待打印的图像，并调用 `PrintHelper` 实例的 `printBitmap()` 方法。该方法需要传递一个表示分配给打印任务名称的字符串，以及图像的引用（以\
  \ `Bitmap` 对象或图像的 `Uri` 形式形式）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ R.drawable.oceanscene);\nimagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n\
  ```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n## 76.7.2 创建并打印 HTML\
  \ 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 内容的简单方法。这些内容可以是由网站上托管的页面 URL 引用的 HTML\
  \ 内容，也可以是在应用程序内动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类经过扩展，以支持在极少代码要求的进行打印。\n\
  \n在动态创建 HTML 内容时（与加载和打印现有网页不同），该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view 客户端，以便在 HTML 加载到 `WebView` 后启动打印任务。在配置好 web view 客户端后，HTML 会被加载到 `WebView`\
  \ 中，此时将触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent() {\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url) {\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument =\n        \"<html><body><h1>Android\
  \ Print Test</h1><p>\"\n        + \"This is some sample content.</p></body></html>\"\
  ;\n    webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\"\
  , null);\n    myWebView = webView;\n}\n```\n\n该方法首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法内部，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载由 `WebView` 实例处理（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理器方法，用于调用名为\
  \ `createWebPrintJob()` 的方法。当所有 HTML 内容都加载到 web view 时，`onPageFinished()` 回调方法将被自动调用。这确保了在内容准备绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\
  \n接下来，会创建一个包含某些 HTML 的字符串作为内容。然后将其加载到 web view 中。一旦 HTML 加载完成，`onPageFinished()`\
  \ 方法将触发。最后，该方法存储了 web view 对象的引用。如果没有这一关键步骤，将存在极大风险，即 Java 运行时系统假设应用程序不再需要该 web\
  \ view 对象并将其丢以释放内存（Java 术语中称为垃圾回收），导致打印任务在完成之前就已终止。\n\n此示例中剩下的工作是按如下实现 `createWebPrintJob()`\
  \ 方法：\n\n```java\nprivate void createWebPrintJob(WebView webView) {\n    PrintManager\
  \ printManager = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter = webView.createPrintAdapter(\"MyDocument\"\
  );\n    String jobName = getString(R.string.app_name) + \" Document\";\n    PrintJob\
  \ printJob = printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法仅用于获取 `PrintManager` 服务的引用，并指示 web view 创建打印适配器。创建一个新字符串来存储打印任务名称。最后，通过调用管理器的\
  \ `print()` 方法启动打印任务，传递任务名称、适配器和一组打印属性。如果需要，可以自定义打印属性以指定分辨率（每英寸点）、边距和颜色选项。\n\n##\
  \ 76.7.3 打印网页\n\n打印网页的步骤与上述概述的步骤相似，不同在于传递给 web view 的要打印网页的 URL 而不是动态创建的 HTML，例如：\n\
  \n```java\nmyWebView.loadUrl(\"https://developer.android.com/index.html\");\n```\n\
  \n同样重要的是，只有当页面在加载后需要自动打印时，才需要配置 `WebViewClient`。如果打印是由用户在页面加载后选择菜单选项启动的，则应用程序代码中仅需包含\
  \ `createWebPrintJob()` 方法中的代码。下一章名为“Android HTML 和 Web 内容打印示例”，它将演示这样一个场景。\n\n\
  ## 76.7.4 打印自定义文档\n\n虽然打印框架引入的 HTML 和 Web 打印功能为应用程序内部打印内容提供了方便路径，但显然对于更高级的打印需求，这些选项过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上进行打印。\n\
  \n与可以相对实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，将在本书的“Android 自定义文档打印指南”章节中概述。这些步骤可以总结如下：\n\
  \n- 连接到 Android 打印管理器\n- 创建继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 创建 `PdfDocument`\
  \ 实例来表示文档页\n- 获取 `PdfDocument` 实例的页引用，每个页都关联有一个 `Canvas` 实例\n- 在页面画布上绘制内容\n- 通知打印框架文档已准备绪可以打印\n\
  \n\n\n\n\n上述步骤中概述的自定义打印适配器需要实现若干方法，Android 系统会在打印过程中调用这些方法来执行特定任务。其中最重要的方法是 `onLayout()`\
  \ 方法，它负责根据用户更改的纸张大小或页面方向等设置来重新排列文档布局；以及 `onWrite()` 方法，它负责渲染要打印的页面。本主题将在标题为“Android\
  \ 自定义文档打印指南的章节中详细介绍。\n\n## 76.8 总结\n\nAndroid SDK 包含了从运行中的应用程序内部打印内容的能力。打印输出可以重定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 直到云端。从 Android 应用开发人员的角度来看，可以通过 `Printing` 框架在应用程序中使用这些功能。目前为止，最容易实现的打印选项是涉及图像和\
  \ `HTML` 格式内容的。然而，更高级的打印可以使用框架的自定义文档打印功能来实现。\n\n## 77. Android HTML 和 Web 内容打印示例\n\
  \n如前一章节“使用 Android 打印框架进行打印”所述，Android `Printing` 框架可以用于打印网页和动态创建的 `HTML` 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差异。本章将通过创建两个示例应用程序来使这两种打印选项更加清晰。\n\
  \n### 77.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择 `New Project`get，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `HTMLPrint` 并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 菜单设置为 Java。\n\n### 77.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建 `HTML` 内容并以打印任务的形式发送到\
  \ `Printing` 框架。\n\n首先找到 `MainActivity.java` 文件（位于 Project 工具窗口的 `app -> java ->\
  \ com -> ebookfrenzy -> htmlprint` 下），并将其加载到编辑面板中。加载完成后，修改代码使其读取如下述列表所示：\n\n```java\n\
  package com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.webkit.WebView;\n\nimport android.webkit.WebViewClient;\n\
  \nimport android.webkit.WebResourceRequest;\n\nimport android.print.PrintAttributes;\n\
  \nimport android.print.PrintDocumentAdapter;\n\nimport android.print.PrintManager;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n\n    }\n\n    private void printWebView() {\n       \
  \ WebView webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                           WebResourceRequest request) {\n    \
  \            return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ = \"<html><body><h1>Android Test</h1><p>This is sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithURL(null, htmlDocument, \"text/html\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前，选择`Basic\
  \ Activity` 模板。\n\n在`Name`字段中输入`WebPrint`，并指定`com.ebookfrenzy.webprint`为包名。在点击“Finish”（完成）按钮之前，将`Minimum\
  \ API level`设置设置为`API 26: Android 8.0 (Oreo)`，并将`Language`菜单设置为`Java`。\n\n## 77.4\
  \ 移除悬浮操作按钮\n\n选择`Basic Activity` 模板提供了一个上下文菜单和一个悬浮操作按钮。由于应用不需要悬浮操作按钮，可以在继续之前将其移除。将`activity_main.xml`\
  \ 布局文件加载到`Layout Editor`布局编辑器）中，选择悬浮操作按钮并按键盘`Delete`键将该对象从布局中删除。编辑`MainActivity.java`\
  \ 文件，从`onCreate` 方法中删除悬浮操作按钮的代码，如下所示：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Action\", null).show();\n        }\n    });\n}\n```\n\
  \n## 77.5 移除导航功能\n\n正如“Android Studio 布局编辑器工具指南”概述的，`Basic Activity`模板包含多个片段和按钮，用于在不同片段之间导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后将会产生问题。在继续教程之前，按照以下方式修改项目：\n\
  \n1. 在`Project`工具窗口中，导航到并双击`app -> res -> navigation -> nav_graph.xml`文件，将其加载到`navigation\
  \ editor`导航编辑器中。\n2. 在编辑器中，选择图面板中的`SecondFragment`条目，按键盘删除键将其从图中删除。\n3. 找到并删除`SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和`fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 找到`FirstFragment.java`文件，双击它将其加载到编辑器，并从`onViewCreated()`方法中的代码，使其内容如下：\n\
  \n```java\npublic void onViewCreated(@NonNull View view, Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \               .navigate(R.id.action_FirstFragment_to_SecondFragment);\n      \
  \  }\n    });\n}\n```\n\n5. 编辑`MainActivity.java`文件并移除以下导航代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
