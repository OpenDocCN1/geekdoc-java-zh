  \n## 25.7 使用 Apply Changes 和 Restart Activity\n\n任何资源更改都要求使用 `Apply Changes` 和 `Restart\
  \ Activity` 选项。在 Android Studio 中选择 app -> res -> layout -> fragment_first.xml 布局文件。在\
