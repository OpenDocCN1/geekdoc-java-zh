  \ 的方法。该方法的实现方式与之前的 `HTMLPrint` 项目使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \    .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter printAdapter\
  \ =\n            webView.createPrintDocumentAdapter(\"MyDocument\");\n        String\
  \ jobName = getString(R.string.app_name) +\n            \" Print Test\";\n     \
  \   printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  \    }\n}\n```\n\n代码更改完成后，在运行 Android 5.0 或更高版本的物理 Android 设备或模拟器上运行该应用程序。一旦成功启动，应该能看到\
  \ `WebView` 并加载了指定的网页。页面加载后，从溢出菜单 ( ) 中选择 `Print` 选项，并使用生成的打印面板将网页打印到合适的目标地。\n\n\
  ## 77.10 总结\n\nAndroid 打印框架包含了 `WebView` 类的扩展，使得在 Android 应用程序内部打印基于 HTML 的成为可能。这些内容可以是应用程序在运行时动态创建的\
  \ HTML 内容，也可以是加载到 `WebView` 实例中的现有网页。对于动态创建的 HTML，使用 `WebViewClient` 实例是关重要的，这可以确保在\
  \ HTML 完全加载到 `WebView` 之前不会开始打印。\n\n### 78. Android 自定义文档打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或\
  \ HTML 标记的形式，Android 打印框架使得在应用程序中构建打印支持相对容易。更高级的打印需求可以通过利用打印框架的自定义文档打印功能来满足。\n\n\
  #### 78.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（canvases）来表示页面。虽然听起来足够简单，但实际上需要执行许多步骤，可以总结如下：\n\
  \n- 实现继承自 `PrintDocumentAdapter` 的自定义打印适配器子类\n- 获取 `PrintManager` 的引用\n- 创建 `PdfDocument`\
  \ 实例\n- 向 `PdfDocument` 中添加页面\n- 获取 `Canvas` 对象\n- 在画布上绘制内容\n- 将文档写入目标地\n- 通知打印框架文档已准备就绪\n\
  \n在本章中，将提供这些步骤的概述，然后提供一个详细的教程来演示如何在 Android 应用程序中实现自定义文档打印。\n\n##### 78.1.1 自定义适配器\n\
  \n打印适配器的作用是为打印框架提供要打印的内容，并确保其根据用户的偏好（如纸张大小和方向）进行正确的格式化。在打印 HTML 和图像时，大部分工作是由作为打印框架一部分提供的适配器完成的。例如，在打印网页时，当我们调用\
  \ `WebView` 实例的 `createPrintDocumentAdapter()` 方法时，为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，由应用程序开发人员设计打印适配器并实现绘制和格式化内容的代码。\n\
  \n\n\n\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n在 `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，并在 `Design`\
  \ 模式下，选择并删除“Hello World!” `TextView` 对象。从调色板的 `Form Widgets` 部分拖放一个 `Button` 视图，并并将其放置在布局视图的中心。选中\
  \ `Button` 视图后，将 `text` 属性更改为“Print Document”，并将该字符串提取到新的资源中。完成后，用户界面布局应与图 78-1\
  \ 所示所示匹配：\n\n![](img/as_4.1_custom_print_ui.jpg)\n\n图 78-1\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。在\
  \ `Attributes` 工具窗口中，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n### 78.3 创建自定义打印适配器\n\
  \n在 Android 应用程序内部打印自定义文档的大部分工作涉及涉及自定义打印适配器的实现。此示例将需要一个实现了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n\n.\n\nimport android.os.CancellationSignal;\n\nimport android.os.ParcelFileDescriptor;\n\
  \nimport android.print.PageRange;\n\nimport android.print.PrintAttributes;\n\nimport\
  \ android.print.PrintDocumentAdapter;\n\nimport android.content.Context;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter\n    {\n        Context context;\n        MyPrintDocumentAdapter(Context\
  \ context)\n        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \                           PrintAttributes newAttributes,\n                   \
  \                         CancellationSignal cancellationSignal,\n             \
  \                               LayoutResultCallback callback,\n               \
  \                             Bundle metadata) {\n        }\n        @Override\n\
  \        public void onWrite(final PageRange[] pageRanges,\n                   \
  \                         final ParcelFileDescriptor destination,\n            \
  \                                final CancellationSignal\n                    \
  \                        cancellationSignal,\n                                 \
  \           final WriteResultCallback callback) {\n        }\n    }\n.\n\n.\n\n\
  }\n```\n\n目前该新类包含一个构造构造函数方法，该方法会在创建类的新实例时被调用。构造函数接受调用方法的 context 作为参数，并将其存储，以便稍后在两个回调方法中引用。在建立类的框架后，下一步是开始实现两个回调方法，从\
  \ `onLayout()` 开始。\n\n### 78.4 实现 onLayout() 回调\n\n继续留在 `MainActivity.java` 文件中，开始添加\
  \ `onLayout()` 方法代码所需的某些导入语句：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n\nimport android.print.PrintDocumentInfo;\nimport android.print.pdf.PrintedDocument;\n\
  import android.graphics.PdfDocument;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类，声明在 `onLayout()` 方法中使用的变量：\n\
  \n```java\npublic static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  {\n    Context context;\n    int pageHeight;\n    int pageWidth;\n    PdfDocument\
  \ myPdfDocument;\n    int totalpages = 4;\n.\n}\n```\n\n注意，为了本示例，将打印一个四页文档。在更复杂的情况下，应用程序可能需要根据内容的数量和布局相对于用户的纸张尺寸和方向，动态计算要打印的页数。\n\
  \n声明变量后，按照以下代码实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                                            PrintAttributes newAttributes,\n\
  \                                            CancellationSignal cancellationSignal,\n\
  \                                            LayoutResultCallback callback,\n  \
  \                                          Bundle metadata) {\n    myPdfDocument\
  \ = new PrintedDocument(context, newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n                .Builder(\"print_output.pdf\"\
  ).setContentType(\n                    PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \                .setPageCount(totalpages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n    }\n}\n```\n\n显然，此方法正在执行相当多的任务，每项任务都需要详细解释。\n\n首先，以\
  \ `PdfDocument` 类实例的形式创建一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时传入的参数之一是 `PrintAttributes`\
  \ 类型的对象，包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置。这些设置在创建 PDF 文档时与之前由构造方法存储的 context 一起使用：\n\n\
  `myPdfDocument = new PrintedDocument(context, newAttributes);`\n\n该方法随后使用 `PrintAttributes`\
  \ 对象提取文档页的高度和宽度。这些维度在对象中以千分之一英寸的形式存储。由于本示例中稍后使用这些值的方法以 1/72 英寸为单位，因此在存储之前对其进行了转换：\n\
  \n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000 * 72;`\n\n`pageWidth\
  \ = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\n尽管此示例没有利用颜色选择，但此属性可以通过调用\
  \ `PrintAttributes` 对象的 `getColorMode()` 方法获取，该方法将返回 `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME`\
  \ 之一的值。\n\n当调用 `onLayout()` 方法时，会传入一个 `LayoutResultCallback` 类型的对象。该对象允许方法通过一组方法向打印框架通信状态信息。例如，如果用户取消了打印过程，就会调用\
  \ `onLayout()` 方法。进程已取消的事实通过 `CancellationSignal` 参数中的设置来指示。如果检测到取消，`onLayout()`\
  \ 方法必须调用 `LayoutResultCallback` 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消。\n\
  \n\n\n\n\n当布局工作完成后，需要调用 `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传递两个参数。第一个参数的类型为\
  \ `PrintDocumentInfo` 对象，其中包含了要打印文档的信息。这些信息包括用于 PDF 文档的名称、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个\
  \ `Boolean` 值，表示自上一次调用 `onLayout()` 方法以来，布局是否发生了变化：\n\n```java\nif (totalpages >\
  \ 0) {\n    PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n        \
  \    .Builder(\"print_output.pdf\")\n            .setContentType(\n            \
  \    PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n            .setPageCount(totalpages);\n\
  \    PrintDocumentInfo info = builder.build();\n    callback.onLayoutFinished(info,\
  \ true);\n} else {\n    callback.onLayoutFailed(\"Page count is zero.\");\n}\n```\n\
  \n如果页数为 0，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()` 方法向打印框架（Printing\
  \ framework）报告此失败。调用 `onLayoutFinished()` 方法通知打印框架布局工作已完成，从而触发调用 `onWrite()` 方法。\n\
  \n## 78.5 实现 onWrite() 回调方法\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架文档已准备好进行打印。完成后，`onWrite()`\
  \ 方法的读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \              pageHeight, i).create();\n            PdfDocument.Page page =\n \
  \                   myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \                destination.getFileDescriptor()));\n    } catch (IOException e)\
  \ {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法首先循环遍历文档中的每一页。然而，重要的是要考虑到用户可能并没有请求打印构成文档的所有页面。事实上，打印框架的\
  \ UI 面板提供了指定打印特定页面或页码范围的选项。图 78-2 显示了配置为打印文档第 1-4 页、第 9 页以及第 11-13 页的打印面板。\n\n![](img/Image24365.jpg)\n\
  图 78-2\n\n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取步骤以确保打印用户指定的页面。为了实现这一点，打印框架通过参数传递了一个\
  \ `PageRange` 对象的数组，指示要打印的页面范围。在上面的 `onWrite()` 实现中，对每个页都会调用名为 `pagesInRange()`\
  \ 的方法，以验证该页是否在指定的范围内。`pagesInRange()` 方法的代码将在本章稍后实现。\n\n```java\nfor (int i = 0;\
  \ i < totalpages; i++) {\n    if (pageInRange(pageRanges, i)) {\n```\n\n对于每个在任何指定范围内的页面，都会创建一个新的\
  \ `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()` 方法存储的高度和宽度值将作为参数传递，以便页面尺寸与用户选择的打印选项相匹配：\n\
  \n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth, pageHeight, i).create();\n\
  PdfDocument.Page page = myPdfDocument.startPage(newPage);\n```\n\n与 `onLayout()`\
  \ 方法一样，`onWrite()` 方法也需要响应取消请求。在这种情况下，代码在关闭并取消 `myPdfDocument` 变量之前，会通知打印框架取消已执行：\n\
  \n```java\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印过程没有被取消，该方法就会调用 `myPdfDocument` 对象的 `finishPage()` 方法之前，调用一个方法在当前页面上绘制内容。\n\n\
  ```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n`drawPage()`\
  \ 方法负责将内容绘制到页面，并在 `onWrite()` 方法完成后实现。\n\n当所需的页面已添加到 PDF 文档后，将使用作为 `onWrite()` 方法参数传递的文件描述符写入文档。如果由于原因写入操作失败，该方法将通过调用\
  \ `WriteResultCallback` 对象的 `onWriteFailed()` 方法来通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，`WriteResultCallback`\
  \ 对象的 `onWriteFinished()` 方法用于通知打印框架文档已准备好打印。\n\n## 78.6 检查页面在范围内\n\n正如概述，当调用 `onWrite()`\
  \ 方法时，它接收一个 `PageRange` 对象的数组，指示要打印的页面范围。`PageRange` 类设计用于存储页面范围的起始和结束页，这些可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法访问。\n\n在上一节实现 `onWrite()` 方法时，我们调用了一个名为 `pageInRange()`\
  \ 的方法，该方法将 `PageRange` 对象的数组和页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在范围内，可以在 `MainActivity.java`\
  \ 类中的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n.\n.\n    private boolean pageInRange(PageRange[]\
  \ pageRanges, int page) {\n        for (PageRange pageRange : pageRanges) {\n  \
  \          if ((page >= pageRange.getStart()) &&\n                (page <= pageRange.getEnd()))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n.\n.\n}\n```\n\n## 78.7 在页面画布上绘制内容\n\n\n\n\n我们现在已经到了需要编写代码在页面上绘制内容的阶段，以便这些内容准备好打印。所绘制的内容完全取决于具体的应用程序，并且仅限于使用\
  \ `Android Canvas` 类能够实现的功能。然而，为了本示例的考虑，我们将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用一个名为\
  \ `drawPage()` 的方法，该方法接受代表当前页的 `PdfDocument.Page` 对象和一个表示页码的整数作为参数。在 `MainActivity.java`\
  \ 文件中，该方法的实现方式如下所示：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\
  \nimport android.graphics.Canvas;\n\nimport android.graphics.Color;\n\nimport android.graphics.Paint;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n\n.\n\n    public static\
  \ class MyPrintDocumentAdapter extends PrintDocumentAdapter\n    {\n.\n\n.\n\n \
  \       private void drawPage(PdfDocument.Page page, int pagenumber) {\n       \
  \     Canvas canvas = page.getCanvas();\n            pagenumber++; // 确保页码从 1 开始\n\
  \            int titleBaseLine = 72;\n            int leftMargin = 54;\n       \
  \     Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n   \
  \         paint.setTextSize(40);\n            canvas.drawText(\n               \
  \ \"Test Print Document Page \" + pagenumber,\n                leftMargin,\n   \
  \             titleBaseLine,\n                paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify that custom document\
  \ printing works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber\
  \ % 2 == 0)\n                paint.setColor(Color.RED);\n            else\n    \
  \            paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(pageInfo.getPageWidth()/2f,\n                pageInfo.getPageHeight()/2f,\n\
  \                150,\n                paint);\n        }\n.\n}\n```\n\n代码中的页码计数从\
  \ `0` 开始。由于文档从 `1` 开始，该方法首先对页码进行增。然后获取与页面相关的 `Canvas` 对象的引用，并声明了一些边距和基线值：\n\n```java\n\
  Canvas canvas = page.getCanvas();\npagenumber++;\nint titleBaseLine = 72;\nint leftMargin\
  \ = 54;\n```\n\n接下来，代码创建了 `Paint` 和 `Color` 对象用于绘制，设置了字体大小并绘制了包含当前页码的页面标题：\n\n```java\n\
  Paint paint = new Paint();\npaint.setColor(Color.BLACK);\npaint.setTextSize(40);\n\
  canvas.drawText(\"Test Print Document Page \" + pagenumber,\n    leftMargin,\n \
  \   titleBaseLine,\n    paint);\n```\n\n随后缩小了字体大小并在标题下方绘制了一些正文：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that custom document printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇是偶后，该方法获取了页的高度和宽度，然后使用这些信息将圆置于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \    pageInfo.getPageHeight()/2,\n    150,\n    paint);\n```\n\n在画布上绘制完成后，该方法将控制权返回给\
  \ `onWrite()` 方法。\n\n### 78.8 开始打印任务\n\n当点击“Document”按钮时，将调用 `printDocument()` 事件处理器。在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.java` 中，特别注意确保将其放置在 `PrintDocumentAdapter` 类之外：\n\n```java\npackage\
  \ com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.print.PrintManager;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    public void printDocument(View view) {\n        PrintManager printManager\
  \ = (PrintManager) getSystemService(Context.PRINT_SERVICE);\n        String jobName\
  \ = getString(R.string.app_name) + \" Document\";\n        printManager.print(jobName,\
  \ new MyPrintDocumentAdapter(this), null);\n    }\n}\n```\n\n### 78.9 测试应用程序\n\n\
  在运行 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“Document”按钮启动打印任务，并为输出选择合适的目标（“保存为\
  \ PDF”选项是避免纸张和墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形的 4 个页面。例如，图 78-3 显示了作为 PDF 文件查看并准备保存的文档四页。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每项设置更改都应该反映在打印输出中，这表明自定义打印适配器运行正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 78-3\n\n### 78.10 总结\n\n虽然自定义文档打印比 Android 打印框架的 HTML 和图像打印更复杂，但它为从 Android\
  \ 应用程序打印复杂内容提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义打印适配器类，使其不仅能够在文档页面上绘制内容，还能在用户更改纸张大小和页面范围等打印设置时做出正确响应。\n\
  \n# 79. Android App Links 简介\n\n随着技术的发展，网页内容和移动内容之间的传统界限正变得模糊。这种趋势在渐进 Web 应用中尤为明显，这类应用的外观和行为非常像传统的移动应用。\n\
  \n另一个趋势是让移动应用内部的内容可以通过网页搜索和 URL 链接被发现。在 Android 应用开发背景下，App Links 特性专门用于让用户即使在没有安装应用程序的情况下也能更容易地发现并访问存储在\
  \ Android 应用的内容。\n\n## 79.1 Android App Links 概览\n\n\n\n\n应用链接（App link）是一种标准的 HTTP\
  \ URL，旨在作为从外部源（如网站或应用）直接链接到应用内特定位置的便捷方式。应用链接（也称为深度链接 deep links）主要用于鼓励用户与应用交互，并允许用户共享应用内容。\n\
  \n应用链接的实现是一个多步骤过程，涉及在项目清单（manifest）中添加意图过滤器（intent filters）、在关联 Activity 中实现链接处理代码，以及使用数字资产链接文件（digital\
  \ asset links files）将应用与基于 Web 的内容关联。\n\n这些步骤可以通过手动修改项目内容来完成，也可以使用 Android Studio\
  \ App Links 助手（App Links Assistant）自动完成。\n\n本章剩余部分将从项目需要更改的角度概述应用链接的实现。下一章（“Android\
  \ Studio App Links 教程”](#App_Links_Tutorial.xhtml__idTextAnchor1500)）将演示如何使用 App\
  \ Links 助手来实现相同的效果。\n\n## 79.2 应用链接意图过滤器\n\n应用链接 URL 需要映射到应用项目中的特定 Activity。这通过向项目的\
  \ `AndroidManifest.xml` 文件中添加意图过滤器来实现，这些过滤器设计用于响应 `android.intent.action.VIEW` 操作来启动\
  \ Activity。意图过滤器声明在要启动的 Activity 元素内部，并且包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时，启动名为 `MyActivity` 的 Activity：\n\n```xml\n\
  <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter\
  \ android:autoVerify=\"true\">\n        <action android:name=\"android.intent.action.VIEW\"\
  \ />\n        <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \      <category android:name=\"android.intent.category.BROWSABLE\" />\n       \
  \ <data\n            android:scheme=\"http\"\n            android:host=\"www.example.com\"\
  \n            android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的 `order` 属性进行指定，如下所示：\n\n```xml\n<application>\n\
  \    <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n.\n.\n```\n\n`intent`-`filter`\
  \ 将导致应用链接启动正确的 Activity，但仍需要在目标 Activity 中实现代码以恰当地处理该意图。\n\n## 79.3 处理应用链接意图\n\n\
  在大多数情况下，启动的 Activity 需要获取应用链接 URL，并根据 URL 的结构采取特定操作。接上例示例，当通过包含路径 `/welcome/newuser`\
  \ 的 URL 启动 Activity 时，其显示的内容可能与通过路径设置为 `/welcome/existinguser` 的 URL 启动时不同。\n\n\
  当 Activity 由链接启动时，它会接收到一个 `intent` 对象，该对象包含有关启动 Activity 的操作数据，包括一个包含应用链接 URL 的\
  \ `Uri` 对象。在 Activity 的初始化阶段，可以添加代码如下所示提取这些数据：\n\n```java\nIntent appLinkIntent\
  \ = getIntent();\nString appLinkAction = appLinkIntent.getAction();\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来决定在 Activity\
  \ 内要执行的操作。在下面的代码示例中，使用 URL 的最后一个组件来识别是否应该为新用户或现有用户显示内容：\n\n```java\nString userType\
  \ = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\")) {\n   \
  \ // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 79.4 将应用与网站关联\n\n在应用链接生效之前，应用链接\
  \ URL 需要与该应用链接的基础网站进行关联。这通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的 `.well-known`\
  \ 文件夹来实现。注意，数字资产链接仅适用于基于 https 的网站。\n\n数字资产链接文件包含一个关系声明（relation statement），允许目标应用使用网站链接\
  \ URL 启动，以及一个目标声明（target statement），声明该项目的配套应用包名和 SHA-256 证书指纹。典型的资产链接文件可能如下：\n\n\
  ```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n\
  \    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\": \"\
  <app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here>\"] }}]\n```\n\n`assetlinks.json` 文件可以包含多个资产链接，允许单个网站与多个应用关联。\n\n## 79.5\
  \ 总结\n\nAndroid App Links 允许通过网站链接启动应用 Activity。应用链接通过在项目清单中使用意图过滤器和 Activity 中的意图处理代码相结合来实现。此外，通过使用数字链接文件还可以关联链接中使用的域名。\n\
  \n## 80 Android Studio App Links 教程\n\n本章的目标是为应用链接和 App Links 助手提供实操演示。本章将为现有应用添加应用链接支持，允许通过\
  \ URL 启动 Activity。\n\n### 80.1 关于示例应用\n\n本章使用的项目名为 `AppLink`，是一个旨在让用户查询地标信息的基础应用。该应用通过标准的内容提供类访问\
  \ SQLite 数据库。应用提供了一个现有数据库，包含了伦敦旅游景点的记录。除了现有数据库条目外，应用还允许用户添加和删除地标描述。在当前形式下，应用允许搜索现有记录并添加新记录。项目由两个名为\
  \ `AppLinkActivity` 和 `LandmarkActivity` 的 Activity 组成。`AppLinkActivity` 是应用启动时的主\
  \ Activity。该 Activity 允许用户输入搜索标准并向数据库添加新记录。当搜索找到匹配记录时，会启动 `LandmarkActivity` 并显示相关地标的信息。\n\
  \n### 80.2 数据库模式\n\n示例应用的数据位于名为 `landmarks.db` 的文件中，位于项目层次结构的 `app` -> `assets`\
  \ -> `databases` 文件夹中。数据库包含一个名为 `locations` 的表，其结构见表 80-1](#App_Links_Tutorial.xhtml__idTextAnchor1505)：\n\
  \n 列 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| _id | String | 主索引，此列包含唯一标识数据库中地标的字符串值。\
  \ |\n| title | String | 地标名称（例如伦敦桥）。 |\n| description | String | 地标的描述。 |\n| personal\
  \ | Boolean | 表明该记录是私人的还是公共的。用户添加的所有记录此值均设为 true。数据库提供的现有记录设为 false。 |\n\n表 80-1\n\
  \n\n\n\n\n# 80.3 加载并运行项目\n\n项目位于位于 URL 的示例源码下载包的 `AppLinking` 文件夹中：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将出现下方图 80-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 80-1\n\n在目前的实现中，地标是使用位置 ID 进行定位的。默认数据库配置当前包含两个由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的记录。在 ID 字段中输入 `londonbridge` 并点击 `Find` 按钮来测试搜索功能。当找到匹配的记录时，将启动第二个活动（`LandmarkActivity`）并传递有关要显的记录的信息。这些信息以以添加到\
  \ `Intent` 对象的额外数据（extra data）的形式存在。`LandmarkActivity` 使用这些信息从数据库提取记录，并使用图 80-2\
  \ 所示的屏幕向用户显示。\n\n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 80-2\n\n# 80.4\
  \ 添加 URL 映射\n\n现在应用已经加载到 Android Studio 并通过了测试，项目已准备好添加应用链接支持。目标是让 `LandmarkActivity`\
  \ 屏幕在响应应用链接点击时启动并显示信息。这是通过将 URL 映射到 `LandmarkActivity` 实现的。在本例，URL 的格式如下：\n\n`http://<website\
  \ domain>/landmarks/<landmarkId>`\n\n在完成所有步骤后，例如以下 URL 将导致应用显示伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，请开始使用 `Tools -> App Links Assistant` 菜单选项打开 `App Links Assistant`。打开后，助手程序将如图\
  \ 80-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 80-3\n\n点击 `Open URL\
  \ Mapping Editor` 按钮开始将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在图 80-4 中高亮）来添加新的 URL：\n\n![](img/Image2473.jpg)\n\
  \n图 80-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入你网站的 URL。如果你没有自己的网站来用于此教程，你仍然可以使用\
  \ `http://www.example.com` 遵循本章的大部分内容，但无法测试需要 Digital Asset Links 文件存在的功能。\n\n`Path`\
  \ 字段（在下方图 80-5 中标记为 A）是声明 URL 路径组件的地方。路径必须以 `/` 为前缀，因此在此字段中输入 `/landmarks`。\n\n\
  `Path` 菜单 (B) 提供以下三个路径匹配选项：\n\n-   `path` – URL 必须完全匹配 URL 的路径组件才能启动活动。例如，如果路径设置为\
  \ `/landmarks`，则 `http://www.example.com/landmarks` 将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ 的 URL 将不被视为匹配。\n-   `pathPrefix` – 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如\
  \ `http://www.example.com/landmarks/londonbridge` 仍被视为匹配）。\n-   `pathPattern` –\
  \ 允许使用基本正则表达式和通配符形式的模式匹配来来指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\n由于此例中的路径是地标 ID 组件的前缀，请选择\
  \ `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity` 作为响应应用链接启动的活动：\n\
  \n![](img/Image24811.jpg)\n\n图 80-5\n\n在完成对话框中的设置后，点击 `OK` 按钮提交更改。通过在映射屏幕的 `Check\
  \ URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为上方 `Host` 字段中指定的域名），检查 URL 格式是否正确并分配给适当的活动：\n\
  \n`http://<your domain>/landmarks/toweroflondon`\n\n如果配置正确，`LandmarkActivity` 将被列为映射的活动：\n\
  \n![](img/Image2489.jpg)\n\n图 80-6\n\n最新版本的 Android 要求必须同时为 HTTP 和 HTTPS 协议声明 App\
  \ Links，即使只使用了其中一个。因此，在继续下一步之前，请重复上述步骤将 HTTPS 版本的 URL 添加到列表中。下一步也将在 `App Links Assistant`\
  \ 的 URL 映射屏幕中执行。# 80.5 添加意图过滤器\n\n如上一节所述，需要意图过滤器允许目标活动在响应应用点击时启动。事实上，当添加 URL 映射时，意图过滤器已自动添加到项目文件中。在\
  \ `App Links Assistant` 中选中 URL 映射，向下滚动屏幕直到意图过滤器部分可见。预览应包含修改后的 `AndroidManifest.xml`\
  \ 文件：\n\n![](img/Image2496.jpg)\n\n图 80-7\n\n虽然 Links Assistant 为我们添加了意图过滤器，但它可能没有包含处理应用链接所需的\
  \ `autoVerify` 设置。打开 `manifests -> AndroidManifest.xml` 文件，如下所示将此设置添加到两个意图过滤器：\n\
  \n```xml\n<intent-filter autoVerify=\"true\">\n    <data\n        scheme=\"http\"\
  \n        host=\"www.ebookfrenzy.com\"\n        pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  \n<intent-filter autoVerify=\"true\">\n    <data\n        scheme=\"https\"\n   \
  \     host=\"www.ebookfrenzy.com\"\n        pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  \n# 80.6 添加意图处理代码\n\n之前的步骤确保了响应相应的应用链接时启动正确的活动。下一步是在 `LandmarkActivity` 类中处理意图，以便从数据库提取并向用户显示记录。在对\
  \ `LandmarkActivity.java` 文件中的代码进行更改之前，查看现有代码区域是值得的。在代码编辑器中打开 `LandmarkActivity.java`\
  \ 文件并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前的内容如下：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n\nprivate void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在目前的格式下，代码期望在 `Intent` 包的额外数据中找到地标\
  \ ID。由于活动现在也可以通过应用链接启动，需要更改此代码以处理这两种情况。从删除 `onCreate()` 方法中对 `handleIntent()` 的调用开始：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n}\n```\n\n\n\n\n\
  要添加初始的 App 链接意图处理代码，返回 App Links Assistant 面板并点击步骤 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，在点击\
  \ `Insert Code` 按钮之前，选择 `LandmarkActivity` 项：\n\n![](img/Image2504.jpg)\n\n图 80-8\n\
  \n返回 `LandmarkActivity.java` 文件并注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android Studio\
  \ 无法完成请求，您可以手动添加此代码）：\n\n```java\n// ATTENTION: This was auto-generated to handle\
  \ app links.\n\nIntent appLinkIntent = getIntent();\n\nString appLinkAction = appLinkIntent.getAction();\n\
  \nUri appLinkData = appLinkIntent.getData();\n```\n\n此代码访问了 `Intent` 对象并提取了 Action\
  \ 字符串和 `Uri`。如果活动启动是由 App 链接的结果，则 action 字符串将被设置为 `android.intent.action.VIEW`，这与添加到清单文件（manifest\
  \ file）中的意图过滤器（intent filter）中声明的 action 相匹配。相反，如果活动是通过主活动中 `findLandmark()` 方法的标准意图启动代码启动的，则\
  \ action 字符串将为 `null`。通过检查赋值给 action 字符串的值，可以编写代码识别活动启动的方式并采取适当的操作：\n\n```java\n\
  .\n.\n\nimport android.net.Uri;\n\n.\n.\n\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n.\n.\n    // ATTENTION:\
  \ This was auto-generated to handle app links.\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    String landmarkId = appLinkData.getLastPathSegment();\n    if (landmarkId !=\
  \ null) {\n        displayLandmark(landmarkId);\n    }\n}\n```\n\n剩下的工作是在方法中添加一些额外代码以识别\
  \ App 链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n.\n.\n    // ATTENTION: This was auto-generated\
  \ to handle app links.\n    Intent appLinkIntent = getIntent();\n    String appLinkAction\
  \ = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                displayLandmark(landmarkId);\n\
  \            }\n        }\n    } else {\n        handleIntent(appLinkIntent);\n\
  \    }\n}\n```\n\n如果 action 字符串不 `null`，则会在提取 `Uri` 路径的最后一个组件之前进行检查以验证其是否设置为 `android.intent.action.VIEW`。随后，该组件将用于执行数据库查询的地标\
  \ ID。相反，如果 action 字符串为 `null`，则调用现有的 `handleIntent()` 方法从意图数据中提取 ID。\n\n### 80.7\
  \ 测试应用\n\n在设备或模拟器上运行应用，并确保仍然可以搜索示例地标。我们现在已成功为应用添加了 App 链接支持。如果您为 App 链接指定了了自己的网站\
  \ URL，我们现在可以通过创建并安装数字资产链接文件（Digital Asset Links file）将示例更进一步。\n\n### 80.8 创建数字资产链接文件\n\
  \n正如“Android Intent 概述”章节概述出的，为了完全支持 App 链接，我们需要在 App 链接引用的网站上安装数字资产链接文件。首先按照“Android\
  \ Intent 概述”中列出的步骤找到您的 `debug.keystore` 文件并识别您的 SHA256 指纹。\n\n接下来在 浏览器中打开以下页面：\n\
  \n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n页面加载后，在 Hosting site domain 字段输入您的网站 URL，将 `com.ebookfrenzy.applinking` 作为 App\
  \ 包名，并将您的 SHA256 指纹输入到 App package fingerprint (SHA256) 字段：\n\n![](img/asset_file_generator.jpg)\n\
  \n图 80-9\n\n点击 Generate 按钮显示生成的语句，并将其放在您 Web 服务器的 `.well-known` 目录下。返回生成器页面并点击 Test\
  \ 按钮验证文件是否位于正确位置。测试成功后，将出现类似的输出：\n\n![](img/asset_file_test.jpg)\n\n图 80-10\n\n\
  假设测试成功，我们现在准备好尝试该应用了。\n\n### 80.9 测试应用\n\n在设备或模拟器上运行应用，并确保仍然可以搜索示例地标。我们现在已成功为应用添加了\
  \ App 链接支持。如果您为 App 链接指定了了自己的网站 URL，我们现在可以通过创建并安装数字资产链接文件将示例更进一步。\n\n### 80.10 总结\n\
  \n本章演示了在 Android 应用项目内实现 App 链接支持的步骤。本章涵盖的内容包括在 Android Studio 中使用 App Link Assistant、意图过滤器（intent\
  \ filters）、使用数字资产链接文件处理网站关联以及 App Link 测试。\n\n### 81 Android 生物识别认证教程\n\n许多设备现在已内置触控传感器，用于识别用户并提供如使用指纹识别的设备内功能。指纹识别当然是许多不同身份验证方法之一，包括密码、PIN\
  \ 码以及最近的脸部识别。\n\n尽管目前市场上只有少数 Android 设备提供脸部识别，但预计这在不久的将来将变得更加常见。考虑到这一点，Google 已开始从以指纹为中心的应用身份验证方法转向一种不那么特定性的方法，称为生物识别认证。在\
  \ Android 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但这将随着 Android 操作系统和 SDK 的未来发布和更新而改变。\n\n### 81.1\
  \ 生物识别概述\n\n生物认证的关键组件是 `BiometricPrompt` 类。该类执行了许多在早期 Android 版本中需要编写代码完成的工作，包括显示标准对话框引导用户完成认证过程、执行认证并将结果报告给应用。该类还处理了多次失败的认证尝试，并在用户再次尝试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个关联的 `Builder` 类，用于配置和创建 `BiometricPrompt` 实例，包括定义在生物识别对话框中显示的文本以及对对话框中出现的取消按钮（也称为负按钮）进行自定义。\n\
  \n\n\n\n在涵盖了这些基础知识后，本章的剩余部分将通过一个示例项目实现基于指纹的生物识别认证。\n\n## 81.2 创建生物识别认证项目\n\n从欢迎界面选择\
  \ `New Project` ，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 29: Android 9.0 (Pie)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n## 81.3 配置设备指纹认证\n\n指纹认证仅适用于包含触摸传感器的设备，并且这些设备已采取适当的配置步骤来保护设备并注册了至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参考标题为使用和配置\
  \ Android Studio AVD 模拟器的章节。要在物理设备上配置指纹认证，首先打开 `Settings` 应用并选择 `Security` 选项。在\
  \ `Security` 设置屏幕内，选择 `Fingerprint` 选项。在弹出的信息屏幕上点击 `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置一种备用锁屏解锁方法（例如\
  \ `PIN number`）。如果锁屏尚未受保护，请按照步骤配置 `PIN`、`pattern` 或 `password` 安全。\n\n锁屏受保护保护后，继续进入指纹检测屏幕，并在提示时触摸传感器（图\
  \ 81-1），如果需要，重复此过程以添加额外的指纹。\n\n![](img/Image24256.jpg)\n\n图 81-1\n\n## 81.4 在 Manifest\
  \ 文件中添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中，找到并编辑\
  \ `app -> manifests -> AndroidManifest.xml` 文件，按如下方式添加权限请求：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.biometricdemo\">\n    <uses-permission\n       \
  \ android:name=\"android.permission.USE_BIOMETRIC\" />\n```\n\n## 81.5 设计用户界面\n\n\
  为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml` 布局资源文件，将其加载到\
  \ `Layout Editor` 工具中。\n\n删除示例 `TextView` 对象，从调色板的 `Common` 类别拖拖并释放一个 `Button` 对象，将其放置在布局画布的中心。使用\
  \ `Attributes` 工具窗口，将按钮上的 `text` 属性更改为“Authenticate”，并将字符串提取到资源。最后，配置 `onClick`\
  \ 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 81-2 所示所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\
  \n图 81-2\n\n## 81.6 添加 Toast 方便方法\n\n在示例代码的各个点，应用将被设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的方便方法。该方法将接受单个 `String` 值并以 `Toast` 消息的形式显示给用户。现在编辑\
  \ `MainActivity.java` 文件并如下所示添加此方法：\n\n```java\nimport android.widget.Toast;\n\n\
  private void notifyUser(String message) {\n    Toast.makeText(this,\n          \
  \        message,\n                  Toast.LENGTH_LONG).show();\n}\n```\n\n## 81.7\
  \ 检查安全设置\n\n在本章早些时候，已采取步骤在要测试应用的设备或模拟器上配置锁屏并注册指纹。然而，在应用中包含防御性代码是非常重要的，以确保在尝试请求指纹认证之前已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证是否已为应用配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private Boolean checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        PackageManager packageManager = this.getPackageManager();\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock security not enabled\");\n            return\
  \ false;\n        }\n        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.USE_BIOMETRIC)\
  \ != PackageManager.PERMISSION_GRANTED) {\n            notifyUser(\"Finger authentication\
  \ permission not enabled\");\n            return false;\n        }\n        if (packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT))\
  \ {\n            return true;\n        }\n        return true;\n    }\n}\n```\n\n\
  上述代码首先使用 `Keyguard` 管理器验证是否已配置备用锁屏解锁方法（也就是说，可以使用 `PIN` 或或其他认证方法作为指纹认证的替代方案）。如果锁屏未受保护，代码将向用户报告问题并返回方法。该方法在使用管理器验证设备上是否有指纹认证之前，检查用户是否已启用生物识别权限。\n\
  \n## 81.8 配置认证回调\n\n配置生物识别提示对话框时，需要分配一组认证回调方法，以便通知应用认证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 实例中。继续留在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，实现相应的方法：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\
  \ CharSequence errString) {\n            notifyUser(\"Authentication error: \" +\
  \ errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\
  \ CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode, helpString);\n\
  \        }\n        @Override\n        public void onAuthenticationFailed() {\n\
  \            super.onAuthenticationFailed();\n        }\n    };\n}\n```\n\n\n\n\n\
  \n```java\npublic void onAuthenticationSucceeded(\n    BiometricPrompt.AuthenticationResult\
  \ result) {\n    notifyUser(\"Authentication Succeeded\");\n    super.onAuthenticationSucceeded(result);\n\
  }\n};\n```\n\n# 81.9 添加 CancellationSignal\n\n一旦启动，生物识别身份验证过程将独立于应用程序运行。为了给应用程序提供取消操作的方法，需要创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别身份验证过程。可以使用此 `CancellationSignal` 实例在必要时取消该过程。取消信号实例可以配置一个监听器，该监听会在取消完成时被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(new\n\
  \            CancellationSignal.OnCancelListener() {\n        @Override\n      \
  \  public void onCancel() {\n            notifyUser(\"Cancelled via signal\");\n\
  \        }\n    });\n    return cancellationSignal;\n}\n```\n\n# 81.10 启动生物识别提示\n\
  \n剩下的工作是在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt` 实例并启动身份验证。添加 `authenticateUser()`\
  \ 方法如下：\n\n```java\nimport android.view.View;\nimport android.content.DialogInterface;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\"This app uses biometric authentication to protect your\
  \ data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  new DialogInterface.OnClickListener() {\n                @Override\n           \
  \     public void onClick(DialogInterface dialogInterface, int i) {\n          \
  \          notifyUser(\"Authentication cancelled\");\n                }\n      \
  \      })\n            .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n                                     getAuthenticationCallback());\n\
  }\n```\n\n`BiometricPrompt.Builder` 类用于创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，这些文本将显示在提示框中。负按钮通过\
  \ `this.getMainExecutor()` 和 `DialogInterface.OnClickListener` 进行配置。调用 `BiometricPrompt.authenticate()`\
  \ 方法时传入了 `getCancellationSignal()`、`getMainExecutor()` 和 `getAuthenticationCallback()`。\n\
  \n# 81.11 测试项目\n\n现在项目已完成，请在物理设备上运行应用或使用模拟器测试生物识别功能。（注：原文此处包含占位符/图像，逻辑保持不变）。\n\n\
  # 81.12 总结\n\n本章概述了如何将生物识别验证集成到 Android 项目中。涉及使用 `BiometricPrompt` 类，一旦配置了适当的文本和回调，它会自动处理大部分身份验证过程。\n\
  \n# 82 创建、测试和上传 Android Bundle\n\n一旦完成 Android 应用程序的开发工作并在多种设备上通过测试，下一步是准备将应用程序提交到\
  \ Google Play。\n\n## 82.1 发布准备流程\n\n到本书的目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，构建通过\
  \ Google Play 向客户发布的应用程序包则需要采取一些额外的步骤。第一个要求是应用程序必须以发布（release）模式而非调试（debug）模式编译。其次，应用程序必须使用私钥进行签名。最后，应用程序必须打包成\
  \ Android App Bundle（Android 应用包）。\n\n虽然这些任务都可以在 Android Studio 环境之外执行，但使用 Android\
  \ Studio 的构建机制可以更方便地完成。不过，重要的是进一步了解 Android App Bundles。\n\n## 82.2 Android App\
  \ Bundles\n\n当用户从 Google Play 安装应用时，应用将以 APK 文件的形式下载。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ Android Studio 3.2 引入之前，开发者会使用 Android Studio 生成一个或多个 APK 文件并将其上传到 Google Play。\n\
  \n\n\n\n通用 APK 选项虽然减轻了开发者的负担，导致了一个完全意料之外的问题。通过分析应用安装指标，Google 发现安装 APK 文件越大（这会导致下载时间变长和设备存储空间占用增加），应用收到的转化率就越低。转化率的计算方式为：在\
  \ Google Play 上查看该应用后，完成应用安装的用户所占的百分比。事实上，Google 估计 APK 文件大小每增加 6MB，该应用的转化率就会下降\
  \ 1%。\n\nAndroid App Bundle（Android 应用包）通过提供一种方法解决了这两个问题：该方法允许开发者在 Android Studio\
  \ 内部创建一个单一包，并让 Google Play 为每个单独支持的配置自动生成自定义的 APK 文件（这一概念被称为“动态交付”，Dynamic Delivery）。\n\
  \nAndroid App Bundle 本质上是一个 ZIP 文件，包含了为应用项目内已支持的设备和语言区域构建 APK 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示器、处理器架构和语言区域。利用这些信息，将相应的预先生成的 APK 文件传输到用户的设备上。\n\n动态交付的另一个优点是可以将应用拆分为多个模块，称为“动态功能模块”，每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的\
  \ APK 文件中，并且只有在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建“即时动态功能模块”，这些模块可以在设备上立即运行，而无需安装整个应用。这些主题将从标题为\
  \ “Android 动态功能模块概述 的章节开始进行更详细的介绍。\n\n尽管仍然可以从 Android Studio 生成 APK 文件，但应用包（app\
  \ bundles）现在是上传应用到 Google Play 的推荐方式。\n\n## 82.3 注册 Google Play 开发者控制账户\n\n提交应用的第一步是创建一个\
  \ Google Play 开发者控制账户。要执行此操作，请导航至 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。注意，注册需要支付一次性 25 美元的费用。一旦应用开始销售，Google 将保留与该应用相关的所有收入的 30%。\n\n创建账户后，下一步是收集有关应用的信息。为了将应用推向市场，需要以下信息：\n\
  \n* 标题 – 应用标题。\n* 短描述 – 描述应用的最多 80 个单词的内容。\n* 完整描述 – 描述应用的最多 4000 个单词的内容。\n* 截图\
  \ – 最多 8 张应用运行截图（至少需要两张）。Google 建议提交应用在 7 英寸或 10 英寸平板上运行的截图。\n* 语言 – 应用语言（默认为美式英语）。\n\
  * 推广文本 – 当你的应用出现在 Google Play 环境内的特殊促销活动中时使用的文本。\n* 应用类型 – 你的应用是被视为游戏还是应用程序。\n*\
  \ 类别 – 最能描述你应用的类别（例如：金融、健康与健身、教育、体育等）。\n* 地区 – 你希望你的应用可以购买的地理位置。\n* 联系详情 – 用户可以通过哪些方式与你联系以获取应用支持。选项包括网页、电子邮件和电话。\n\
  * 定价与发布 – 关于应用价格以及要在哪些地理位置营销和销售的信息。\n\n收集上述信息后，点击 Google Play Console 中的 `Create\
  \ app`（创建应用）按钮开始创建过程。\n\n## 82.4 在控制台中配置应用\n\n当首次点击 `Create app` 按钮时，将显示应用详情和声明屏幕，如下方的图\
  \ 82-1 所示：\n\n![](img/as_4.1_play_create_app.jpg)\n\n图 82-1\n\n一旦应用条目完全配置，点击 `Create\
  \ app` 按钮（在上图中突出显示）来添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial setup`（初始设置）部分并展开步骤列表以配置应用商店列目信息：\n\
  \n![](img/as_4.1_play_app_initial_steps.jpg)\n\n图 82-2\n\n按照链接列表操作并为你的应用提供所需信息，并确保在每一步都保存更改。\n\
  \n## 82.5 启用 Google Play 应用签名\n\n直到最近，Google Play 的上传都是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到\
  \ Google Play 控制台。虽然此选项仍然可用，但现在上传文件的推荐方法是使用被称为“Google Play 应用签名”的过程。对于新创建的应用，这涉及加入\
  \ Google Play 应用签名，然后生成一个上传密钥，用于在 Android Studio 内部对应用包文件进行签名。当上传 Android Studio\
  \ 生成的应用包文件时，Google Play 控制台会移除上传密钥，然后使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，则需要一些额外的步骤来启用\
  \ Google Play 签名，这些将在本文末尾介绍。\n\n在 Google Play 控制台中，从“所有应用”（All Apps）屏幕（通过左侧导航面板顶部的选项访问）选择新添加的应用条目，展开\
  \ `Setup`（设置）部分（在图 82-3 中标记为 A），并选择 `App Signing`（应用签名）选项（B）。\n\n![](img/as_4.1_play_signing.jpg)\n\
  \n图 82-3\n\n点击 `Create release`（创建发布）按钮（C）加入 Google Play 应用签名。现在准备好创建应用的测试版本。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包过程的一部分。\n\n## 82.6 创建密钥文件\n\n要创建密钥文件，选择 Android\
  \ ` Build -> Generate Signed Bundle / APK…` 菜单选项，显示生成签名包或 APK 向导，如图 82-4 所示：\n\n\
  ![](img/android_studio_3.2_select_app_bundle.jpg)\n\n图 82-4\n\n在点击 `Next` 按钮之前，确认已选择\
  \ `Android App Bundle` 。\n\n如果你已有现有的发布密钥文件，在下一个屏幕上点击 `Choose existing…`（选择现有）并导航并选择该文件。如果你尚未创建密钥文件，点击\
  \ `Create new…`（新建）以显示 `New Key Store`（新密钥库）对话框（图 82-5）。点击 `Key store path` 右侧的按钮，导航到文件系统上的合适位置，为密钥文件命名（例如\
  \ `release.keystore.jks`），并点击 `OK` 按钮。\n\n\n\n\n“新建密钥库”（New Key Store）对话框分为两个部分。顶部部分与密钥库文件有关。在此部分，在\
  \ `Password` 和 `Confirm` 字段中输入强密码以保护密钥库文件。对话框的下半部分与将存储在密钥库文件上传密钥有关。\n\n![](img/Image2483.jpg)\n\
  \n图 82-5\n\n在“新建密钥库”对话框的 `Certificate`（证书）部分，输入以下详细信息：\n\n-   引用密钥的别名（Alias）。这可以是任何字符序列，但系统仅使用前\
  \ 8 个字符。\n-   一个足够强的密码来保护密钥。\n-   密钥的有效期年数（Google 建议有效期超过 25 年）。\n\n此外，必须为剩余字段中的至少一个字段提供信息（例如，您的姓和名，或组织名称）。\n\
  \n![](img/Image24921.jpg)\n图 82-6\n\n输入信息后，点击 `OK` 按钮继续创建包（bundle）。\n\n## 82.7 创建\
  \ Android App Bundle\n\n下一步是指示 Android Studio 以发布模式构建应用包文件，然后使用新创建的私钥对其签名。此时，`Generate\
  \ Signed Bundle or APK` 对话框应仍显示，密钥库路径、密码和密钥别名字段已填充信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  图 82-7\n\n确保启用 `Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（参见图\
  \ 82-8）。在此屏幕中，检查 `Destination Folder:` 设置，以验证生成应用包文件的位置是否可以接受。如果偏于其他位置，点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n图 82-8\n\n点击 `Finish` 按钮并等待\
  \ `Gradle` 系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹选项，或将文件加载到 `APK Analyzer`\
  \ 中：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n图 82-9\n\n此时，应用已准备好提交到\
  \ Google Play。点击 `locate` 链接打开文件系统浏览器窗口。文件应命名为 `bundle.aab`，并位于项目文件夹的 `app/release`\
  \ 子目录，除非指定了其他位置。\n\n在此过程中生成的私钥应在签名和发布未来应用时使用，因此，应将其保存在安全的地方并进行可靠的备份。\n\n## 82.8\
  \ 生成测试 APK 文件\n\n此阶段的可选步骤是从应用包生成 APK 文件，并在设备或模拟器会话上安装并运行它们。Google 提了一个名为 `bundletool`\
  \ 的命令行工具，专门为此目的设计，可以从以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 格式提供，可以如下所示从命令行执行（请注意版本号自本书出版以来可能发生了变化）：\n\n```\njava\
  \ -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具内可用的所有选项。要从应用包生成 APK 文件，使用 `build-apks`\
  \ 选项。要生成可以安装到设备或模拟器上的 APK 文件，还需要对文件进行签名。为了实现这一点，请包含 `--ks` 选项以指定在本节之前创建的密钥库文件路径，并带有\
  \ `--ks-key-alias` 选项以指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标记来指定生成 APK 文件的路径（称为 `APK\
  \ Set`）。该文件不能已经存在，并且必须具有 `.apks` 文件名扩展名。将这些要求结合起来，得到以下命令行（允许您的操作系统路径结构之间存在差异）：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，在将 APK 文件生成到指定的 APK Set 文件之前，将出现提示要求输入密钥库密码。APK Set 文件仅是包含从应用包生成的所有\
  \ APK 文件的 ZIP 文件。\n\n要将相应的 APK 文件安装到连接的设备或模拟器上，请使用类似下面的命令：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别适用于连接设备的相应 APK 文件并安装它们，以便启动和测试应用。\n\
  \n也可以从 APK Set 中提取适用于连接设备的 APK 文件而无需安装它们。此过程的第一步是获取连接设备的规范：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成如下 JSON 文件：\n\n```json\n\
  {\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"],\n  \"screenDensity\"\
  : 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用该规范文件来提取 APK 文件：\n\n```\njava -jar\
  \ bundletool-all-0.9.0.jar extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks\
  \ --device-spec=/tmp/device.json\n```\n\n执行后，通过 `--output-dir` 指定的目录将包含 APK 文件。\n\
  \n将 Android 应用引入市场的下一步是提交到 Google Play 以供测试。\n\n## 82.9 将应用包上传到 Google Play Console\n\
  \n返回 Google Play Console，选择“内部测试”选项（图 82-10 中的 A 位置），然后点击“创建版本”按钮（B）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\
  图 82-10\n\n在生成的屏幕上，点击“继续”按钮（如下所示）确认使用 Google Play 应用签名，然后将由 Android Studio 生成的文件拖入上传投放点（B）：\n\
  \n![](img/as_4.1_play_upload_bundle.jpg)\n图 82-11\n\n上传完成后，向下滚动屏幕输入发布名称和可选的发布说明。发布名称可以是帮助您识别版本的任何信息，且对用户不可见。\n\
  \n应用包文件上传后，Google Play 将生成所有测试所需的 APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”按钮。设置保存后，点击“查看版本”按钮。\n\
  \n## 82.10 探索应用包\n\n在审核屏幕上，点击上传应用包右侧的箭头，如图 82-12 所示：\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n\
  图 82-12\n\n在生成的面板中，点击“探索包”链接加载应用包资源器。这提供了有关应用包支持的 API 级别、屏幕布局和平台的摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\
  图 82-13\n\n点击“转到设备目录”链接将显示支持 APK 文件的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  图 82-14\n\n\n\n\n此时，应用程序已准备好进行测试，但在控制台中设置好某些测试人员之前，无法发布。\n\n## 82.11 管理测试人员\n\n\
  如果应用仍处于内部测试（Internal）、Alpha 或 Beta 测试阶段，可以通过以下方式指定授权测试人员列表：在 Google Play 控制台中选择该应用，点击导航面板中的\
  \ `Internal testing`（内部测试），然后选择 `Testers`（测试人员）选项卡，如图 82-15\n\n图 82-15\n\n要添加测试人员，点击\
  \ `Create email list`（创建电子邮件列表）按钮，命名列表并手动或通过上传 `CSV` 文件指定测试用户的电子邮件地址。\n\n现在可以从屏幕上复制\
  \ `Join on the web` URL 并提供给测试用户，以便他们接受测试邀请并下载应用。\n\n## 82.12 发布应用进行测试\n\n现在已经创建了内部版本并添加了测试人员列表，应用已准备好发布进行测试。留在内部测试界面中，在点击最近创建版本的\
  \ `Edit` 按钮之前，选择 `Releases`（发布）选项卡：\n\n![](img/as_4.1_play_ready_for_rollout.jpg)\n\
  \n图 82-16\n\n在审核界面上，滚动到底部并点击 `Start rollout to Internal testing`（开始发布内部测试）按钮。在版本处理稍作等待后，应用即可供指定用户下载和测试。\n\
  \n## 82.13 上传新的 App Bundle 版本\n\n为您的应用程序上传的第一个 app bundle 文件版本号始终为 `1`。如果尝试上传另一个具有相同版本号的包文件，控制台将拒绝该文件并显示以下错误：\n\
  \n`You need to use a different version code for your APK because you already have\
  \ one with version code 1.`\n\n要解决这个问题，需要增加嵌入到包文件中的版本号。这在项目模块级的 `build.gradle` 文件中进行，如图\
  \ 82-17 中高亮所示：\n\n![](img/Image2561.jpg)\n\n图 82-17\n\n默认情况下，该文件内容通常如下：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 31\n    defaultConfig {\n        applicationId \"com.example.myapplication\"\n\
  \        minSdkVersion 26\n        targetSdkVersion 31\n        versionCode 1\n\
  \        versionName \"1.0\"\n    }\n}\n```\n\n要更改版本号，只需更改 `versionCode` 旁边声明的数字。要更改显示给应用程序用户的版本名称，请更改\
  \ `versionName` 字符串。例如：\n\n```gradle\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  完成这些更改后，重新构建 APK 文件并再次上传。\n\n## 82.14 分析 App Bundle 文件\n\nAndroid Studio 提供了分析 app\
  \ bundle 文件内容的能力。要分析包文件，选择 `Android Studio Build -> Analyze APK…` 菜单选项，导航并选择要审查的包文件。一旦加载到工具中，将显示有关包的原始大小和下载大小的信息，以及包的文件结构列表，如图\
  \ 82-18 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n\n图 82-18\n\n选择\
  \ `classes.dex` 文件将在下面板中显示该文件的类结构。在此面板中，可以探索单个类的详细信息，一直到类内方法的级别：\n\n![](img/Image2583.jpg)\n\
  \n图 82-19\n\n同样，在列表中选择资源或图像文件将在下面板中显示文件内容。可以通过点击 `Compare with previous APK…`（与之前的\
  \ APK 比较……）按钮并选择第二个包文件来查看两个包文件之间的大小差异。\n\n## 82.15 总结\n\n一旦应用项目完成或准备好进行用户测试，就可以将其上传到\
  \ Google Play 控制台并发布到生产环境、内部、Alpha 或 Beta 测试。在应用应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于\
  \ Play 商店的截图。随后，在 Android Studio 中生成一个发布版 Android App Bundle 文件并使用上传密钥对其进行签名。包文件上传后，Google\
  \ Play 会移除上传密钥并将其替换为安全存储的应用签名密钥，应用即可准备好发布。\n\n可以随时通过加载到 Android Studio APK Analyzer\
  \ 工具中来查看包文件的内容。\n\n## 83. Android 内购计费概述\n\n在 Android 和 iOS 等操作系统的移动应用早期，最常见的盈利方法是收取下载和安装应用的预付费用。另一种收入机会很快以在应用中嵌入广告的形式引入。现在最常见且最丰厚的选择可能是安装应用后向用户收取购买应用内物品的费用。这通常表现为访问游戏中的更高等级、获取虚拟商品或货币，或者订阅杂志或报纸中的高级内容。\n\
  \nGoogle 通过 Google Play In-App Billing API 和 Play 控制台支持内购计费的集成。本章将提供内购计费的概述，并概述在\
  \ Android 项目中集成该功能的步骤。在探索这些主题后，下一章将引导您创建一个包含内购购买功能的示例应用。\n\n### 83.1 为内购计费准备项目\n\
  \n在应用中构建内购计费需要 Google Play 控制台帐户，其细节已在之前的创建、测试和上传 App Bundle 章节中介绍。您还需要注册商户并配置支付设置。这些设置可以通过导航到\
  \ Play 控制台中的 `Setup -> Payments profile` 找到。请注意，商户注册并非在所有国家可用。详情请参考页面：https://support.google.com/googleplay/android-developer/answer/9306917\n\
  \n随后需要将应用上传到控制台并启用内购。然而，除非在模块级 `build.gradle` 文件中添加了 Google Play Billing Library，否则控制台不会为应用激活内购支持：\n\
  \n```gradle\ndependencies {\n    implementation 'com.android.billingclient:billing:<latest\
  \ version>'\n}\n```\n\n一旦添加了库并将应用上传到控制台，下一步是添加供用户购买的应用内产品或订阅。\n\n### 83.2 创建应用产品和订阅\n\
  \n产品和订阅是通过 Play 控制台导航面板中 `Monetize`（变现）部分下的选项进行创建和管理的，如下方图 83-1](##In-App_Overview.xhtml__idTextAnchor1574）所示：\n\
  \n![](img/play_console_monetization.jpg)\n\n图 83-1\n\n每个产品或订阅都需要 ID、标题、描述和价格信息。购买分为消耗性（用户每次需要时必须购买，例如游戏虚拟货币）、非消耗性（用户只需购买一次，例如内容访问）和订阅制几类。消耗性和非消耗性产品统称为管理产品。\n\
  \n\n\n\n\n订阅适用于销售需要按定期续订的项目，例如访问新闻内容或 App 的高级功能。在创建订阅时，会定义一个基础方案，指定价格、续订周期（按月、按年等）以及是否自动续订。还可以为用户提供优惠活动，并提供预购订阅的选项。\n\
  \n### 83.3 结算客户端初始化\n\n您的应用与 Google Play 结算库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以调用的方法，用于执行同步和异步的与结算相关的活动。在初始化计费用客户端时，需要为它提供一个 `PurchasesUpdatedListener`\
  \ 回调处理句的引用。客户端将调用此处理程序以通知您的应用任何购买活动的结果。为了避免重复通知，建议每个应用仅保留 `BillingClient` 实例。\n\n\
  可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，并传入当前的 activity 或 fragment 上文。然后通过 `setListener()`\
  \ 方法将购买更新处理程序分配给客户端：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ =\n    new PurchasesUpdatedListener() {\n        @Override\n        public void\
  \ onPurchasesUpdated(BillingResult billingResult,\n                List<Purchase>\
  \ purchases) {\n            if (billingResult.getResponseCode() ==\n           \
  \         BillingClient.BillingResponseCode.OK\n                    && purchases\
  \ != null) {\n                // 购买(s)成功\n                for (Purchase purchase\
  \ : purchases) {\n                    // 处理购买\n                }\n            }\
  \ else if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                //在此处处理错误\n\
  \            }\n        }\n};\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n### 83.4 连接到 Google Play 结算库\n\n成功创建结算客户端后，下一步是初始化与 Google Play\
  \ 结算库的连接。要建立此连接，需要调用结算客户端实例的 `startConnection()` 方法。由于连接是异步执行的，需要实现一个 `BillingClientStateListener`\
  \ 处理程序以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()` 方法。如果与结算库的连接丢失，将调用此方法，用于向用户报告问题并重试连接。\n\
  \n一旦完成设置和连接任务，`BillingClient` 实例将调用 `onBillingSetupFinished()` 方法，该方法可以检查客户端是否就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(\n            @NonNull BillingResult\
  \ billingResult) {\n        if (billingResult.getResponseCode() ==\n           \
  \     BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else\
  \ {\n            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 现有的连接\n    }\n});\n```\n\n### 83.5 显示可用产品\n\n一旦结算环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详细信息。这是通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法实现的，并传入一个配置适当的 `QueryDetailsParams`\
  \ 实例，其中包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，受管理产品使用 `ProductType.INAPP`）：\n\n```java\n\
  billingClient.queryProductDetailsAsync(queryProductDetailsParams,\n    new ProductDetailsListener()\
  \ {\n        public void onProductDetailsResponse(\n                @NonNull BillingResult\
  \ billingResult,\n                @NonNull List<ProductDetails> productDetailsList)\
  \ {\n            if (!productDetailsList.isEmpty()) {\n                // 处理产品列表\n\
  \            } else {\n                // 无匹配产品\n            }\n        }\n    }\n\
  });\n```\n\n`queryProductDetailsAsync()` 方法传递了一个 `ProductDetailsListener` 处理程序，该处理程序会被调用并传入一个包含匹配产品信息的\
  \ `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取如产品名称、标题、价格和优惠详情等信息。\n\n### 83.6 启动购买流程\n\
  \n一旦用户查询并选择了购买的产品或订阅，购买流程就准备好启动了。我们通过调用 `BillingClient` 的 `launchBillingFlow()`\
  \ 方法来实现这一点，并将当前 activity 以及配置了所购项目 `ProductDetail` 对象的 `BillingFlowParams` 实例作为参数传入：\n\
  \n```java\nBillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n\
  \        .setProductDetailsList(\n            ImmutableList.of(\n              \
  \  BillingFlowParams.ProductDetailsParams.newBuilder()\n                    .setProductDetails(productDetails)\n\
  \                    .build()\n            )\n        )\n    .build();\nbillingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n```\n\n购买操作的成功与否将通过本章之前概述的 `PurchasesUpdatedListener` 回调处理程序进行报告。\n\
  \n### 83.7 完成购买\n\n当购买成功时，`PurchasesUpdatedListener` 处理程序将收到一个包含每个项目 `Purchase`\
  \ 对象的列表。你可以通过调用 `Purchase` 实例的 `getPurchaseState()` 方法来验证该项目已被购买：\n\n```java\nif\
  \ (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成\n\
  } else if (purchase.getPurchaseState() == Purchase.PurchaseState.PENDING) {\n  \
  \  // 待处理中\n}\n```\n\n注意，只有在初始化期间调用 `enablePendingPurchases()` 方法，您的应用才会支持待处理购买。待处理购买将一直持续直到用户完成支付流程。\n\
  \n当非消耗性项目的购买完成后，需要对其进行确认以防止向用户发放退款。这需要项目的购买令牌，令牌通过调用 `Purchase` 对象的 `getPurchaseToken()`\
  \ 方法获取。该令牌与 `AcknowledgeResponseListener` 一起用于创建 `AcknowledgePurchaseParams` 实例。受管理的购买和订阅通过调用\
  \ `BillingClient` 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\nAcknowledgePurchaseParams\
  \ acknowledgePurchaseParams =\n    AcknowledgePurchaseParams.newBuilder()\n    \
  \    .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\n\nAcknowledgeResponseListener\
  \ acknowledgePurchaseResponseListener =\n    new AcknowledgeResponseListener() {\n\
  \        @Override\n        public void onAcknowledgePurchaseResponse(\n       \
  \         @NonNull BillingResult billingResult) {\n            // 检查确认结果\n     \
  \   }\n    };\n\nbillingClient.acknowledgePurchase(acknowledgePurchaseParams, acknowledgePurchaseResponseListener);\n\
  ```\n\n\n\n\n对于消耗型物品，当物品被消耗后，您需要通知 Google Play，以便用户可以重新购买。这需要一个配置好的 `ConsumeParams`\
  \ 实例（其中包含一个购买令牌）、一个 `ConsumeResponseListener`，并调用结算客户端的 `consumeAsync()` 方法：\n\n\
  ```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n       \
  \     .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n                                  @NonNull String purchaseToken)\
  \ {\n        if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.OK)\
  \ {\n            // 消耗成功\n        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams,\
  \ listener);\n```\n\n### 83.8 查询之前的购买记录\n\n在处理应用内购买时，常见的需求是需要检查用户是否已购买某个产品或订阅。通过调用\
  \ `BillingClient` 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户之前购买的所有特定类型（非消耗型或活跃订阅）的购买列表。例如，以下代码获取了所有之前购买过的非消耗型物品列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  billingClient.queryPurchasesAsync(queryPurchasesParams,\n    new PurchasesResponseListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                                             @NonNull List<Purchase>\
  \ list) {\n            // 处理购买列表\n        }\n    });\n```\n\n要获取活跃订阅的列表，请将 `ProductType`\
  \ 值从 `INAPP` 更改为 `SUBS`。\n\n另一种，要获取过去的购买列表（包括活跃、已过期、已取消和已消耗的项目），请调用 `BillingClient`\
  \ 的 `queryPurchaseHistoryAsync()` 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams\
  \ =\n    QueryPurchaseHistoryParams.newBuilder()\n            .setProductType(BillingClient.ProductType.INAPP)\n\
  \            .build();\nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n\
  \    new PurchaseHistoryResponseListener() {\n        @Override\n        public\
  \ void onPurchaseHistoryResponse(@NonNull BillingResult billingResult,\n       \
  \                                      @NonNull List<PurchaseHistoryRecord> list)\
  \ {\n            // 处理购买历史\n        }\n    });\n```\n\n### 83.9 总结\n\n应用内购买通过向用户出售虚拟产品和订阅，提供了从\
  \ Android 应用内部产生收入的方式。在本章中，我们探索了托管商品和订阅，并解释了消耗型和非消耗型产品之间的区别。使用 Google Play 应用内结算库为应用添加应用内购买支持，这涉及创建和初始化结算客户端，并调用其方法来执行如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个教程，演示如何在\
  \ Android Studio 中添加应用内购买。\n\n# 84. 应用内购买教程\n\n在上一章中，我们探索了如何在 Android Studio 中添加应用内购买。本章将展示具体是如何添加应用内购买的。\n\
  \n#### 84.1 关于应用内购买\n\n该项目的简单概念是一个必须进行应用内购买的应用程序。本教程将展示如何在 Google Play 控制台中添加应用内购买。\n\
  \n### 84.2 创建 InAppPurchase 项目\n\n本次练习的第一步是创建一个新项目。首先启动 Android Studio，选择 New Project。在新项目对话框中，选择\
  \ Empty Activity 模板。在 Name 字段中输入 InAppPurchase，并指定一个唯一标识您的应用的包名（package name）。在点击\
  \ Finish 按钮之前，将 Minimum API 设置为 API 26: Android 8.0。\n\n#### 84.3 向项目添加库\n\n在开始编写代码之前，需要向项目配置中添加一些库，其中之一是标准的\
  \ Android 结算客户端库。在项目的后续部分，我们还需要使用 Google Guava Java 库中的 `ImmutableList` 类。现在通过通过修改\
  \ Gradle Scripts -> `build.gradle (Module: InAppPurchase.app)` 文件来添加这些库：\n\n```gradle\n\
  dependencies {\n    implementation 'com.android.billingclient:billing:5.0.0'\n \
  \   implementation 'com.google.guava:guava:24.1-jre'\n    implementation 'com.google.guava:guava:27.0.1-android'\n\
  }\n```\n\n添加库后，点击编辑器面板顶部的 Sync Now 链接以提交更改。\n\n### 84.4 设计用户界面\n\n用户界面将由现有的 `TextView`\
  \ 和两个 Button 组成。在编辑器中加载 `activity_main.xml` 文件，将两个 Button 视图拖放到布局中，使其中一个位于 `TextView`\
  \ 之上，另一个位于下方。选择 `TextView` 并 id 属性更改为 `statusText`。\n\n点击工具栏上的 Clear Constraints\
  \ 按钮，并按住 Shift 点击选择所有视图。右键点击最顶部的 Button 视图，选择 Center -> Horizontally in Parent 菜单选项。重复此步骤，这次选择\
  \ Chains -> Create Vertical Chain。更改顶部按钮的文本属性使其显示“Consume Purchase”，将 id 更改为 `consumeButton`，并将\
  \ enabled 属性设置为 false。此外，配置 `onClick` 属性以调用名为 `consumePurchase` 的方法。\n\n选择最底部的按钮并重复上述步骤，这次将文本设置为“Buy\
  \ Product”，id 更改为 `buyButton`，`onClick` 回调设置为 `makePurchase`，并将 enabled 属性设置为 false。完成后，该布局应与图\
  \ 84-1 所示。\n\n\n\n\n按照创建、测试和上传 Android App Bundle 章节中列出的步骤操作，登录 `Play Console`，创建一个新应用，并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回\
  \ Android Studio 并为该项目生成一个已签名的发布版应用包（app bundle）。一旦生成包文件，将其上传到内部测试轨道并发布进行测试。\n\n\
  现在应用已经出现在 Google Play 商店中，我们准备好为该项目创建一个应用内商品了。\n\n## 84.6 创建应用内商品\n\n在 `Play Console`\
  \ 中选中应用后，向下滚动左侧面板中的选项列表，直到 `Monetize`（变现）部分出现在视野中。在该部分中，如图 84-2 所示，选择 `Products`\
  \ 下的 `In-app products`（应用内商品）选项：\n\n![](img/play_console_monetization1.jpg)\n\n\
  图 84-2\n\n在 `In-app products` 页面上，点击 `Create product`（创建商品）按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 84-3\n\n在新商品屏幕上，在保存新商品之前输入以下信息：\n\n- `Product ID`: `one_button_click`\n- `Name`:\
  \ `A Button Click`\n- `Description`: 这是一个测试应用内商品，允许按钮被点击一次。\n- `Default price`:\
  \ 设置为你偏好货币的最低可能价格。\n\n## 84.7 启用许可测试人员\n\n在测试应用内计费时，能够在不花费任何资金的情况下进行测试购买是有用的。这可以通过为内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样就不会被收费。\n\
  \n在 `Play Console` 中，返回主屏幕并选择 `Setup -> License testing`（设置 -> 许可测试）选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 84-4\n\n在 `license testing` 屏幕中，添加内部测试轨道所需的测试人员，将 `License response`（许可响应）设置设置为\
  \ `RESPOND_NORMALLY`（正常响应），并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\
  \n图 84-5\n\n现在应用和应用内商品已在 `Play Console` 中设置完毕，我们可以开始向项目添加代码了。\n\n## 84.8 初始化计费客户端\n\
  \n编辑 `MainActivity.java` 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\nimport androidx.annotation.NonNull;\n\
  import android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private BillingClient billingClient;\n    private ProductDetails productDetails;\n\
  \    private Purchase purchase;\n    static final String TAG = \"InAppPurchaseTag\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n            .setListener(purchasesUpdatedListener)\n\
  \            .enablePendingPurchases()\n            .build();\n        billingClient.startConnection(new\
  \ BillingClientStateListener() {\n            @Override\n            public void\
  \ onBillingSetupFinished(@NonNull BillingResult billingResult) {\n             \
  \   if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnSetupFinish connected\");\n            \
  \        queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnSetupFinish failed\");\n                }\n            }\n            @Override\n\
  \            public void onBillingDisconnected() {\n                Log.i(TAG, \"\
  OnSetupFinish connection lost\");\n            }\n        });\n    }\n```\n\n当应用启动时，`onCreate()`\
  \ 方法现在将调用 `billingSetup()`，反而创建一个新的计费客户端并尝试连接到 Google Play Billing 费库。当连接尝试完成后，将调用\
  \ `onBillingSetupFinished()` 监听器并输出指示连接尝试成功或失败的 Logcat 信息。最后，我们还实现了 `onBillingDisconnected()`\
  \ 回调，如果 Google Play 计费连接丢失，该回调将被调用。如果连接成功，将调用名为 `queryProduct()` 的方法。此方法和分配给计费客户端的\
  \ `purchasesListener` 现在都需要被添加。\n\n## 84.9 查询商品\n\n为了确保商品可以购买，我们需要创建一个带有在 `Play\
  \ Console` 中指定的商品 ID 的 `QueryDetailsParams` 实例，并将其传递给计费客户端的 `queryDetailsAsync()`\
  \ 方法。这要求我们添加 `onProductDetails()` 回调，在其中我们将检查商品是否存在，提取商品名称并将其显示在 `TextView` 上。现在我们已经获取了商品详情，可以安全地启用购买按钮。在\
  \ `MainActivity.java` 文件中，添加 `queryProduct()` 方法，其内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryDetailsParams\
  \ queryProductDetailsParams =\n        QueryDetailsParams.newBuilder()\n       \
  \     .setProductList(\n                ImmutableList.of(\n                    QueryDetailsParams.Product.newBuilder()\n\
  \                        .setProductId(\"one_button_click\")\n                 \
  \       .setProductType(BillingClient.ProductType.INAPP)\n                     \
  \   .build()))\n            .build();\n    billingClient.queryDetailsAsync(\n  \
  \      queryProductDetailsParams,\n        new ProductDetailsListener() {\n    \
  \        public void onProductDetails(\n                @NonNull BillingResult billingResult,\n\
  \                @NonNull List<ProductDetails> productDetails) {\n             \
  \   if (!productDetails.isEmpty()) {\n                    productDetails = productDetails.get(0);\n\
  \                    runOnUiThread(() -> {\n                        binding.buyButton.setEnabled(true);\n\
  \                        binding.statusText.setText(productDetails.getName());\n\
  \                    });\n                } else {\n                    Log.i(TAG,\
  \ \"onProductDetails: No products\");\n                }\n            }\n      \
  \  }\n    );\n}\n```\n\n这里使用的许多代码在上一章中已经熟悉。监听器代码检查是否找到了匹配查询标准的商品。然后从第一个匹配的商品中提取\
  \ `ProductDetails` 对象，存储在 `productDetails` 变量中，并将名称属性显示在 `TextView` 上。\n\n注意的是，当我们启用购买按钮并在状态\
  \ `TextView` 上显示商品名称时，我们调用了 `runOnUiThread()`。这是因为监听器没有在主线程运行，因此无法安全地对用户界面进行更改。\n\
  \n## 84.10 启动购买流程\n\n当用户点击购买按钮时，将调用名为 `makePurchase()` 的方法来启动购买流程。现在我们可以按照如下添加此方法：\n\
  \n```java\npublic void makePurchase(View view) {\n    BillingFlowParams billingFlowParams\
  \ =\n        BillingFlowParams.newBuilder()\n            .setProductDetailsParamsList(\n\
  \                ImmutableList.of(\n```\n\n\n\n\n\n```java\nBillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \    .setProductDetails(productDetails)\n    .build()\n)\n)\n.build();\n\nbillingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n```\n\n### 84.11 处理购买更新\n\n购买过程的结果将通过初始化阶段分配给 `billingClient`\
  \ 的 `PurchaseUpdatedListener` 报告给应用。请按照以下方式添加此处理器：\n\n```java\nprivate final PurchasesUpdatedListener\
  \ purchasesUpdatedListener = new PurchasesUpdatedListener() {\n    @Override\n \
  \   public void onPurchasesUpdated(BillingResult billingResult, List<Purchase> purchases)\
  \ {\n        if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK\
  \ && purchases != null) {\n            for (Purchase purchase : purchases) {\n \
  \               completePurchase(purchase);\n            }\n        } else if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.USER_CANCELED) {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n        } else {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Error\");\n        }\n    }\n};\n```\n\n如果用户取消购买或发生其他错误，该处理器将输出日志消息。然而，成功的购买将调用一个名为\
  \ `completePurchase()` 的方法，并传入当前的 `Purchase` 对象。请按照下文概述添加此方法：\n\n```java\nprivate\
  \ void completePurchase(Purchase item) {\n    purchase = item;\n    if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED)\n        runOnUiThread(() -> {\n        \
  \    binding.consumeButton.setEnabled(true);\n            binding.statusText.setText(\"\
  Purchase Complete\");\n        });\n}\n```\n\n此方法在验证产品确实已购买且支付仍处于挂起状态之前会存储购买信息。随后将启用“消耗（consume）”按钮并通知用户购买成功。\n\
  \n### 84.12 消耗产品\n\n现在用户可以点击“消耗”按钮了，下一步是确保产品被消耗，这样在点击另一个按钮进行购买之前，只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams = ConsumeParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\
  \ @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n                runOnUiThread(() ->\
  \ {\n                    binding.consumeButton.setEnabled(false);\n            \
  \        binding.statusText.setText(\"Purchase consumed\");\n                });\n\
  \            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建了一个 `ConsumeParams` 实例并使用当前购买的购买令牌（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）对其配置。声明了一个处理器，以便在消耗成功时禁用消耗按钮并更新状态文本。最后，调用 `billingClient`\
  \ 的 `consumeAsync()` 方法，并传入消耗参数和监听器的引用。\n\n### 84.13 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到\
  \ Play Console。由于我们已经上传了版本 1，我们首先需要增加 `build.gradle`（模块: `InAppPurchase.app`）文件中的版本号：\n\
  \n```gradle\ndefaultConfig {\n    applicationId \"com.ebookrenzy.inapppurchase\"\
  \n    minSdk 26\n    targetSdk 32\n    versionCode 2\n    versionName \"2.0\"\n\
  }\n```\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle”章节中的步骤生成新的应用 bundle，将其上传到内部测试轨道并分发给测试人员。使用测试轨道链接，在已登录其中一个测试账户的设备或模拟器上安装该应用。应用启动后，它应该在短时间延迟后在\
  \ `TextView` 上显示产品名称并启用购买按钮。点击购买按钮将如图 84-6 所示开始购买流程：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  图 84-6\n\n点击购买按钮以使用测试卡完成购买，并等待“消耗购买（Consume Purchase）”按钮被启用。在点击此按钮之前，尝试再次购买该产品，并验证无法购买，因为你已经拥有该产品。\n\
  \n点击“消耗购买”按钮，等待 `TextView` 上出现“购买已消耗（Purchase consumed）”消息。产品消耗后，现在应该可以再次购买它。\n\n\
  ### 84.14 故障排除\n\n如果你在购买过程中遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 Android Studio，并从 Logcat\
  \ 面板中选择该设备。在 Logcat 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的额外信息，一个实用的技巧是从\
  \ `BillingResult` 实例中访问调试消息，例如：\n\n```java\nelse if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG, \"onPurchasesUpdated:\
  \ Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n注意，只要你在模块级 `build.gradle` 文件中保持应用版本号不变，现在应该可以直接在设备或模拟器上运行修改后的应用，而无需重新打包上传。\n\
  \n如果没有看到测试支付卡，请确保设备上的用户账户已添加到许可测试人员列表中。如果应用运行在物理设备上，请尝试在模拟器上运行。如果所有方法都失败，你可以输入有效的支付方式进行测试购买，然后通过\
  \ Play Console 主页上的订单管理界面进行退款。\n\n### 84.15 总结\n\n在本章中，我们创建了一个演示如何向应用添加内购购买的项目。这包括在\
  \ Google Play Console 中创建产品，以及编写代码初始化并连接计费客户端、查询可用产品，最后购买并消耗产品。我们还解释了如何向 Play Console\
  \ 添加许可测试人员，以便在测试时无需付费即可进行购买。\n\n# 85 Android 动态功能模块概述\n\n正如在前章所述，应用 bundle 和动态交付的引入显著减少了用户在安装\
  \ Android 应用时需要下载的应用包文件的大小。尽管最初是为了为每种可能的设备配置生成单独的包，但动态交付的另一个关键优势是将应用分成多个按需安装的动态功能模块。\n\
  \n在本章中，我们将开始探索动态功能模块的基本概念，为下一章的详细实践示例做准备。\n\n\n\n\n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许将组成 Android 应用的不同功能封装在独立的模块中，只有当用户需要这些功能时，这些模块才会被下载并安装到设备上。例如，一个新闻新闻类应用可能包含新闻和讨论功能。在这种情况下，该应用默认可能只安装新闻功能，并将讨论功能拆分成一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问过该功能，该模块将永远不会被安装，从而确保应用仅使用绝对最少的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和时机具有完全的控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常用的功能。\n\
  \n动态功能模块还可能被指定为“即时”（instant）模块。这取代了早版本 Android 发布中的“即时应用”（Instant App）概念，并允许在不安装应用的情况下在设备上运行动态功能模块。这使得应用可以在\
  \ Google Play 商店中显示“立即尝试”按钮，或者通过点击网络 URL 在设备上即时启动。\n\n## 85.2 动态功能模块架构\n\nAndroid\
  \ 从设计之初就考虑了模块化，特别是在 `Intents` 和 `Activities` 概念方面。动态功能将这种哲学推向了逻辑终，允许应用在用户需要的时候仅安装用户需要的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块是使用拆分 APK 文件（split APK files）构建的，这些文件允许多个 APK 文件组合形成单个应用。\n\n正如我们在创建、测试和上传\
  \ Android App 包 中中学到的，动态交付和应用包的工作原理是生成一个自定义的 APK 文件，该文件仅包含在特定设备配置上运行应用所需的所需的字节码和资源。在这种情况下，应用仍然通过单个\
  \ APK 文件进行安装，尽管该文件是为用户的设备定制的。\n\n相比之下，动态功能模块的工作原理是将应用拆分为多个称为拆分 APK 文件的 APK 文件。\n\
  \n当应用使用拆分 APK 文件时，只有基础模块（base module）在应用首次下载时被安装。基础模块通过一个可启动的活动（activity）作为应用的入口，并包含应用基础功能的字节码和资源，以及应用其他部分所需的配置和构建资源。例如，基础模块清单（manifest）文件包含了与应用绑定的任何动态功能模块清单文件的合并。此外，所有动态功能模块的版本号由基础模块构建配置文件中的版本代码（version\
  \ code）设置决定。\n\n基础模块还包含应用包中包含的动态功能模块列表，所有动态功能模块必须在它们的构建配置将基础模块列为依赖项。\n\n每个动态功能以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定功能的任何其他资产（如图像或数据文件）。\n\
  \n当用户从应用商店请求安装应用时，商店将为该模块生成基础 APK 文件，其中包含所有设备配置通用的字节码和资源，以及一组专门为用户设备配置的配置 APK 文件。同样，安装动态功能模块的请求除了生成相应的配置\
  \ APK 文件外，还会生成动态功能 APK 文件，如下图 85-1（Dynamic_Feature_Modules.xhtml__idTextAnchor1606）所示：\n\
  \n![](img/android_dynamic_feature_diagram.jpg)\n\n图 85-1\n\n## 85.3 创建动态功能模块\n\n\
  可以通过添加全新的新模块或迁移现有模块将动态功能添加到项目。。要添加新模块，只需选择 Android Studio 的 `File -> New -> New\
  \ Module...` 菜单选项。在弹出的对话框中，根据左侧面板选择 `Dynamic Feature Module`动态功能模块）或 `Instant Dynamic\
  \ Feature Module`即时动态功能模块）选项，取决于你正在创建的动态功能类型：\n\n![](img/as_4.2_add_dynamic_feature.jpg)\n\
  \n图 85-2\n\n选择合适的动态功能选项后，为模块命名并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将无法构建）。\n\
  \n再次点击 `Next` 按钮配置按需（On-Demand）选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\
  \n图 85-3\n\n当启用 `Fusing`（融合）选项时，在运行旧版本 Android（Android 4.4 API 20 或更早版本）的设备上，该模块将与基础\
  \ APK 一起下载，这些版本早于动态交付的引入。`Module Title` 字符串长度可达 50 个字符，Google Play 在消息和通知中向用户描述该功能时将使用。\n\
  \n`Install-time inclusion`（安装时包含）菜单提供了控制模块按需安装条件的选项，而不是包含在用户设备上的初始安装中。该菜单提供以下选项：\n\
  \n- `Do not include module at install time (on-demand only)` - 安装时不包含模块（仅按需） - 无论设备配置和用户国家如何，在应用请求之前，模块都不会被安装。\n\
  - `Include module at install time` - 安装时包含模块 - 禁用所有设备和国家的按需动态安装。模块将在应用安装设备的同时安装。\n\
  - `Only include module at install-time for devices with specified features` - 仅针对指定功能的设备安装时包含\
  \ - 对于符合标准的设备配置和国家，模块将在安装时包含。所有其他国家和设备配置将使用按需。选择此选项时，会出现额外选项允许输入设备功能。在图 85-4（Dynamic_Feature_Modules.xhtml__idTextAnchor1608）中，例如，该模块将在具有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，模块将按需动态安装：\n\
  \n![](img/as_4.2_dynamic_feature_device_features.jpg)\n\n图 85-4\n\n其他标准如国家和 API\
  \ 级别必须在项目清单（AndroidManifest.xml）文件中声明。例如，以下条将禁用法国用户和运行早于 API 21 的 Android 版本的动态功能安装：\n\
  \n```xml\n<dist:conditions>\n  <dist:user-countries exclude=\"true\">\n   <dist:country\
  \ code=\"FR\"/>\n  </dist:user-countries>\n  <dist:min-sdk value=\"21\"/>\n</dist:conditions>\n\
  ```\n\n## 85.4 将现有模块转换为动态交付\n\n如果应用包含一个适合动态交付的现有功能，可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\
  \n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\n图 85-5\n\n在此项目中，`app` 模块将作为基础模块，而\
  \ `secondfeature` 模块是转换为动态功能模块的理想人选。\n\n\n\n要将应用中的现有模块转换为动态功能模块，请先编辑模块级 `build.gradle`\
  \ 文件（在上面的示例中为 `Gradle Scripts -> `build.gradle (Module: secondfeature)`），并将其修改为使用\
  \ `com.android.dynamic-feature` 而不是 `com.android.application` 插件，同时更改依赖关系，使模块仅依赖于基础（app）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\napply plugin: 'com.android.dynamic-feature'\n\
  \ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.0.2'\n    api 'androidx.constraintlayout:constraintlayout:1.1.3'\n\
  \    testImplementation 'junit:junit:4.12'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑模块的 `AndroidManifest.xml` 文件并按如下方式进行修改（注意在本示例中，这是一个按需模块，而不是即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\">\n```\n\n注意 `title` 属性引用了字符串资源，该资源也需要在 `strings.xml`\
  \ 文件中声明。该属性强制要求使用字符串资源而不是硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle\
  \ (Module: app)`）以引用动态功能模块，并将 Play Core Library 作为依赖项：\n\n```gradle\napply plugin:\
  \ 'com.android.application'\n\nandroid {\n    compileSdkVersion 29\n    dynamicFeatures\
  \ = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.5.0'\n\
  }\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication` 的子类：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n# 85.5 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行任务，例如检查模块是否已经安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都是使用\
  \ Play Core Library 提供的 API 完成的，大部分这些 API 调用涉及使用 `SplitInstallManager` 实例，该实例可以通过如下方式创建：\n\
  \n```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块的列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n可以通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法来安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n        SplitInstallRequest\n            .newBuilder()\n          \
  \  .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ FailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，模块安装将开始。或者，也可以通过向 `deferredInstall()`\
  \ 方法传递功能名称数组来执行延迟安装，如下所示：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n虽然无法跟踪延迟安装的状态，但可以通过向 `manager` 添加监听器来跟踪非延迟安装：\n\
  \n```java\nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitSessionState state) {\n \
  \       if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    // 需要用户确认\n                    break;\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    // 正在下载模块\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    // 正在安装下载的模块\n                    break;\n                case\
  \ SplitInstallSessionStatus.DOWNLOADED:\n                    // 模块下载完成\n       \
  \             break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    // 模块已安装\n                    break;\n                case\
  \ SplitInstallSessionStatus.CANCELED:\n                    // 用户取消了下载\n        \
  \            break;\n                case SplitInstallSessionStatus.PENDING:\n \
  \                   // 安装已延迟\n                    break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    // 安装失败\n                    break;\n            }\n      \
  \  }\n    }\n};\n```\n\n一旦实现了监听器，需要将其注册到 `SplitInstallManager` 实例中，并在不再需要时注销。\n\n\
  ```java\nmanager.registerListener(listener);\nmanager.unregisterListener(listener);\n\
  ```\n\n# 85.6 处理大型功能模块\n\nAndroid 系统在未获得用户许可的情况下不允许下载大于 10MB 的动态功能。当请求下载大型功能时，监听器会被调用并传递\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，应用负责显示确认对话框，并可以选择实现 `onActivityResult()` 方法以识别用户是批准还是拒绝了下载。\n\
  \n```java\nprivate static final int REQUEST_CODE = 101;\n\nSplitInstallStateUpdatedListener\
  \ listener = new SplitInstallStateUpdatedListener() {\n    @Override\n    public\
  \ void onStateUpdate(SplitSessionState state) {\n        if (state.sessionId() ==\
  \ mySessionID) {\n            switch (state.status()) {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    try {\n                        manager.startConfirmationDialogForResult(state,\
  \ MainActivity.this, REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        // 请求失败\n                    }\n              \
  \      break;\n            }\n        }\n    }\n};\n```\n\n\n\n上述代码启动了一个意图，该意图将显示内置确认对话框。此意图将向\
  \ `onActivityResult()` 方法返回结果代码，其实现方式如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准安装\n        } else\
  \ {\n            // 用户拒绝安装\n        }\n    }\n}\n```\n\n如果用户批准请求，动态功能模块将自动下载并安装。\n\
  \n## 85.7 总结\n\n动态功能模块允许 Android 应用被划分为独立的功能模块，这些模块在用户需要时按需下载。动态功能模块也可以配置为即时功能（instant\
  \ features）。即时功能可以在无需在设备安装应用的情况下运行，用户可以通过应用商店页面上的“立即尝试”按钮或通过网络 URL 访问。\n\n动态功能的实现涉及将应用拆分为一个基础模块（base\
  \ module）和一个或多个动态功能模块。可以在 Android Studio 中创建新的动态功能模块，也可以通过对项目配置进行少量更改，将现有模块转换为动态功能模块。\n\
  \n一旦向应用添加了动态功能模块，这些模块的下载和管理将由应用通过 Play Core 库的 `SplitInstall` 类来处理。\n\n# 86. Android\
  \ Studio 动态功能教程\n\n在上一节涵盖了 Android 动态交付和动态功能的基本概念后，本章将以示例项目的形式这些理论付诸实践。在本章创建的应用将包含两个\
  \ Activity，第一个将作为应用的基础模块，而第二个将指定为动态功能，以便从运行中的应用内部按需下载。本教程将包括在 Android Studio 内部创建动态模块的步骤、将应用包上传到\
  \ Google Play 商店进行测试，以及使用 Play Core 库下载和管理动态功能的步骤。本章还将探索延迟动态功能安装的使用。\n\n## 86.1\
  \ 创建 DynamicFeature 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，选择 `Empty Activity`\
  \ 模板并点击 `Next`（下一步）按钮。\n\n在 `Name` 字段中输入 `DynamicFeature`，并指定在 Google Play 生态系统中唯一标识应用的包名（例如\
  \ `com.<your company>.dynamicfeature`）。在点击 `Finish`（完成）按钮之前，将 Minimum API level\
  \ 设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。\n\n## 86.2 为项目添加动态功能支持\n\n\
  在开始实现应用之前，需要对项目进行两个更改以添加对动态功能的支持。由于项目将大量使用 Play Core 库，需要在构建配置中添加指令以包含此库。在 Android\
  \ Studio 中，打开应用层级的 `build.gradle` 文件（`Gradle Scripts -> build.gradle (Module: DynamicFeature.app)`），找到\
  \ `dependencies` 部分并按照如下方式添加 Play Core 库（请记住，该库现在可能有更更新的版本）：\n\n```gradle\ndependencies\
  \ {\n    implementation 'com.google.android.play:core:1.10.3'\n}\n```\n\n一旦下载了动态功能模块，用户很可能需要立即访问组成该功能的代码和资源资产。然而，默认情况下，新安装的功能模块在应用重启之前对应用的其他部分是不可用的。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。目前实现此目标最简单的方法是在主 `AndroidManifest.xml` 文件（也称为基础模块清单文件）中将应用声明为\
  \ `SplitCompatApplication` 的子类，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.dynamicfeature\">\n<application\n        android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n## 86.3 设计 Base\
  \ Activity 用户界面\n\n此时，项目包含一个 Activity，它将作为应用基础模块的入口。该基础模块将负责请求、安装和管理动态功能模块。\n\n\
  为了演示动态功能的使用，基础 Activity 将由一系列按钮组成，允许安装、启动和删除动态功能模块。用户界面还将包含一个用于显示动态功能状态信息的 `TextView`。\n\
  \n根据这些要求，将布局编辑器加载 `activity_main.xml` 文件，删除默认的 `TextView` 对象，并实现设计使其类似于图 86-1。通过选择所有对象、右键点击\
  \ TextView 并选择 `Center -> Horizontally`（水平居中）选项开始应用布局约束，从而将所有对象约束在水平中心。\n\n在所有对象仍被选中的情况下，再次右键点击\
  \ TextView，这次选择 `Chains -> Vertical Chain`（垂直链）选项。在继续之前，将所有按钮文本字符串提取到资源，并配置三个按钮分别调用名为\
  \ `launchFeature`、`installFeature` 和 `deleteFeature` 的方法。\n\n## 86.4 添加动态功能模块\n\n\
  要向项目添加动态功能模块，选择 `File -> New -> New Module...` 选项，在生成的对话框中，从左面板选择 `Dynamic Feature`。在主面板中，将模块命名为\
  \ `my_dynamic_feature`，并将最小 API 设置更改为 `API 26: Android 8.0 (Oreo)`，以便与基础模块选择的 API\
  \ 级别匹配，如图 86-2 所示。\n\n再次点击 `Next` 按钮配置按需选项，确保启用了 `Fusing` 选项。在 `Module Title` 字段中输入文本“My\
  \ Example Dynamic Feature”。为了本示例，在点击 `Finish` 按钮提交更改并将动态功能模块添加到项目之前，将安装时包含菜单设置为\
  \ `Do not include module at install time (on-demand only)`（安装时不包含该模块）。\n\n## 86.5\
  \ 查看动态功能模块\n\n在继续下一步之前，值得花些时间查看 Android Studio 对项目所做的更改。理解这些更改在解决问题以及将现有应用功能转换为动态功能时都很有用。\n\
  \n首先参考 Project 工具窗口，那里将出现一个代表新动态功能模块文件夹的新条目。\n\n\n\n\n请注意，该功能拥有自己的子结构，包括一个清单文件、一个可以添加代码和资源的包以及一个\
  \ `res` 文件夹。打开并查看 `AndroidManifest.xml` 文件，它应该包含在功能创建过程中选择的属性设置，包括按需（on-demand）、融合（fusing）和功能标题值：\n\
  \n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n特别感兴趣的一点是，模块标题字符串是作为字符串资源存储的，而不是直接输入清单文件中。这是标题字符串的前提条件，可以在基础模块的\
  \ `strings.xml` 文件（`app -> res -> values -> strings.xml`）中找到并在必要时进行修改。\n\n动态功能模块的构建配置可以在\
  \ Gradle Scripts -> `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件中找到，内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 32\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件中的关键条目的是应用 `com.android.dynamic-feature` 插件，这确保了该模块被视为动态功能，以及 `implementation`\
  \ 行，表示该功能依赖于基础（`app`）模块。\n\n基础模块的 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: DynamicFeature.app)`）也包含一个列出动态功能模块的新条目。在查看文件时，添加指令以启用视图绑定（view binding）支持：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n    dynamicFeatures = [':my_dynamic_feature']\n\
  }\n```\n\n向项目添加的任何额外动态功能也需要在此处引用，例如：`dynamicFeatures = [\":my_dynamic_feature\"\
  , \":my_second_feature\", ...]`\n\n## 86.6 添加动态功能 Activity\n\n从上方图 86-4 所示的 Project\
  \ 工具窗口中可以清楚看到，此时动态功能模块除了一个清单文件外没有其他内容。下一步是向模块中添加一个 activity，以便该功能在从基础模块启动时能够执行某些操作。在\
  \ Project 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity ->\
  \ Empty Activity` 菜单。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout File`选项，但在点击\
  \ `Finish` 按钮之前禁用 `Launcher Activity`选项。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  图 86-5\n\n一旦将 activity 添加到模块中，编辑 `AndroidManifest.xml` 文件并修改它以添加意图过滤器（intent filter），该过滤器允许基础模块启动该\
  \ activity（将 `<com.yourcompany>` 替换为在 Google Play 上使您的应用唯一的所选包名）：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\" android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <action android:name=\"com.yourcompany.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件的 `dependencies`\
  \ 部分以包含 Google Play 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.10.1'\n\
  }\n```\n\n为了能够动态模块内部访问资源，需要在 `FeatureActivity` 中调用 `SplitCompat.install()` 方法。编辑\
  \ `MainActivity.java` 文件并如下修改 `onCreate()` 方法，包括添加视图绑定的更改：\n\n```java\nimport android.view.View;\n\
  import com.google.android.play.core.splitcompat.SplitCompat;\nimport <com.yourcompany>.dynamicfeature.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n```\n\n如果不执行此步骤，通常会在启动动态功能时导致崩溃，出现类似的错误：\n`AndroidRuntime: java.lang.RuntimeException:\
  \ Unable to start activity ComponentInfo{com.ebookfrenzy.my_dynamic_feature/FeatureActivity}:\
  \ android.content.res$NotFoundException: Resource ID #0x80020000`\n\n通过将 `activity_feature.xml`\
  \ 文件加载到布局编辑器并添加显示“My Dynamic Module”文本的 `TextView` 对象来完成该功能：\n\n![](img/as_3.4_dynamic_feature_ui.jpg)\n\
  图 86-6\n\n## 86.7 实现 launch() 方法\n\n项目完成后，现在是使用 Play Core 库开始处理动态功能了。第一步是实现 `launch()`\
  \ 方法，其目的是使用意图（intent）启动动态功能 activity。然而，启动尚未安装的动态功能中的 activity 会导致应用程序崩溃。因此，`launch()`\
  \ 方法需要一些防御性代码以确保动态功能已安装。为了实现这一点，我们需要创建一个 `SplitInstallManager` 类实例并调用该对象的 `getInstalledModules()`\
  \ 方法检查 `my_dynamic_feature` 模块是否已安装。如果已安装，则可以安全地启动模块中的 activity，否则需要在状态 `TextView`\
  \ 上向用户显示消息。在 `MainActivity.java` 文件中，对类进行以下更改：\n\n```java\nimport android.content.Intent;\n\
  import com.google.android.play.core.splitinstall.SplitInstallManager;\nimport com.google.android.play.core.splitinstall.SplitInstallManagerFactory;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private SplitInstallManager manager;\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallManagerFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n```\n\n\n\n\n```java\nIntent i = new Intent(\n    \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\nstartActivity(i);\n} else {\n    binding.statusText.setText(\"Feature not yet\
  \ installed\");\n}\n}\n\n.\n.\n}\n\n## 86.8 上传 App Bundle 进行测试\n\n现在已准备好进行第一阶段的测试。这涉及生成一个发布版本的\
  \ app bundle 并将其上传到 Google Play Console。实现这一步骤的步骤在[创建、测试和上传 Android App Bundle]章节中已概述，但可以总结如下：\n\
  \n1. 登录 Google Play Console 并创建一个新应用。\n2. 按照步骤在标题、描述、分类和图像资源方面配置应用（示例图像资源可以在随本书附带示例代码下载的\
  \ `image_assets` 文件夹中找到），并保存草稿设置。同时，确保为该 bundle 启用 Google Play 应用签名。\n3. 使用 Android\
  \ Studio 中的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成带签名的发布版 app bundle。\n\
  4. 在 Google Play Console 中，从左侧导航面板中选择 `Testing` -> `Internal testing` 选项。\n5. 在内部测试界面上，点击\
  \ `Create Release` 按钮并点击 `Continue` 以接受 Google 管理密钥签名任务的选项。将上方生成的 app bundle 文件拖放到上传框中并点击\
  \ `Save`。\n6. 切换到内部测试界面内的 `Testers` 标签卡，添加将用于在一个或多个物理设备上测试应用的账户邮箱地址。\n7. 返回 `Releases`\
  \ 标签卡并点击 `Edit` 按钮。滚动到结果页底部并点击 `Review release` 按钮。\n8. 在确认屏幕上，点击 `Start rollout\
  \ to Internal testing` 按钮。应用将显示为 `Pending publication`（等待发布）。\n\n一旦发布发布以进行测试，通知将发送给内部测试轨道上的所有用户，要求他们加入应用的测试轨道。或者，复制\
  \ `Testers` 屏幕上列出的 URL 并将其发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接将启动 Play Store 应用并打开 DynamicFeature\
  \ 应用的下载页面，如图 86-7 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\n图 86-7\n\
  \n点击按钮安装应用，然后打开它并点击 `Launch Feature` 按钮。动态功能尚未安装的事实应该反映在状态文本中。\n\n# 86.9 实现 installFeature()\
  \ 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个 `SplitInstallRequest`\
  \ 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示指示安装请求状态的 `Toast` 消息。留在 `MainActivity.java`\
  \ 文件中，如下所示添加 `installFeature()` 方法：\n\n```java\nimport android.widget.Toast;\nimport\
  \ com.google.android.play.core.splitinstall.SplitInstallRequest;\nimport com.google.android.play.core.tasks.OnFailureListener;\n\
  import com.google.android.play.core.tasks.OnSuccessListener;\n\npublic void installFeature(View\
  \ view) {\n    SplitInstallRequest request =\n        SplitInstallRequest\n    \
  \        .newBuilder()\n            .addModule(\"my_dynamic_feature\")\n       \
  \     .build();\n    manager.startInstall(request)\n        .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n            @Override\n            public void\
  \ onSuccess(Integer sessionId) {\n                Toast.makeText(MainActivity.this,\n\
  \                    \"Module installation started\",\n                    Toast.LENGTH_SHORT).show();\n\
  \            }\n        })\n        .addOnFailureListener(new OnFailureListener()\
  \ {\n            @Override\n            public void onFailure(Exception exception)\
  \ {\n                Toast.makeText(MainActivity.this,\n                    \"Module\
  \ installation failed\" + exception.toString(),\n                    Toast.LENGTH_SHORT).show();\n\
  \            }\n        });\n}\n```\n\n编辑 `Gradle Scripts` -> `build.gradle` (Module:\
  \ `DynamicFeature.app`) 文件并增加 `versionCode` 和 `versionName` 的值，以便可以将新版本的应用 bundle\
  \ 上传进行测试：\n\n```gradle\nandroid {\n    versionCode 2\n    versionName \"2.0\"\n\
  }\n```\n\n重复此步骤，以在 `Gradle Scripts` -> `build.gradle` (Module: `DynamicFeature.my_dynamic_feature`)\
  \ 中声明一个匹配的版本号。\n\n生成一个包含更改的新 app bundle，然后返回 Google Play Console 中该应用的 `Testing`\
  \ -> `Internal testing` 页面，并点击图 86-8 中高亮的 `Create new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\
  \n图 86-8\n\n按照步骤上传新的 app bundle 并发布到内部测试。在测试设备上，打开 Google Play Store 应用并确保 `Install`\
  \ 按钮已变为 `Update` 按钮（如果还没有，请关闭 Store 应用并在几分钟后重试）并更新到新版本。一旦更新完成，运行应用，点击 `Install Feature`\
  \ 按钮并检查 `Toast` 消息以确保安装成功启动。在下载功能时，屏幕顶部的状态栏将短暂出现下载图标。下载完成后，点击 `Launch Feature` 按钮显示动态功能。\n\
  \n如果安装失败或应用崩溃，通常可以通过 `LogCat` 输出识别原因。要查看此输出，请将设备连接到开发计算机，打开终端或命令行窗口并执行以下命令：\n\n\
  ```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的异常或诊断错误。\n\
  \n## 86.10 添加监听器\n\n为了更详细地跟踪动态功能的安装进度，可以为应用添加 `SplitInstallStateUpdatedListener`。由于可能同时安装多个功能模块，需要添加代码来跟踪分配给安装过程会话\
  \ ID。首先添加一些导入，在 `MainActivity.java` 文件中声明包含当前会话 ID 的变量，并修改 `installFeature()` 方法以便每次启动安装时存储会话\
  \ ID 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallSessionState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallStatus;\nimport\
  \ java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   ActivityMainBinding binding;\n    SplitInstallManager manager;\n    int mySessionId\
  \ = 0;\n\n    public void installFeature(View view) {\n        manager.registerListener(listener);\n\
  \        // ... rest of the implementation\n    }\n}\n```\n\n\n\n\n接下来，实现监听器代码，使其内容如下：\n\
  \n```java\nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitInstallSessionState state)\
  \ {\n        if (state.sessionId() == mySessionId) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.DOWNLOADING:\n             \
  \       long size = state.totalBytesToDownload();\n                    long downloaded\
  \ = state.bytesDownloaded();\n                    binding.statusText.setText(String.format(Locale.getDefault(),\n\
  \                            \"%d of %d bytes downloaded.\", downloaded, size));\n\
  \                    break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    binding.statusText.setText(\"Installing feature\");\n     \
  \               break;\n                case SplitInstallSessionStatus.DOWNLOADED:\n\
  \                    binding.statusText.setText(\"Download Complete\");\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    binding.statusText.setText(\"Installed - Feature is ready\"\
  );\n                    break;\n                case SplitInstallSessionStatus.CANCELED:\n\
  \                    binding.statusText.setText(\"Installation cancelled\");\n \
  \                   break;\n                case SplitInstallSessionStatus.PENDING:\n\
  \                    binding.statusText.setText(\"Installation pending\");\n   \
  \                 break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    binding.statusText.setText(\"Installation Failed. Error code:\
  \ \" + state.errorCode());\n            }\n        }\n    }\n};\n```\n\n该监听器捕获许多常见的安装状态并据此更新状态文本，提供有关下载大小和已下载字节总数的信息。在继续之前，添加\
  \ `onPause()` 和 `onResume()` 生命周期方法，以确保在应用处于活跃状态时注销监听器：\n\n```java\n@Override\n\
  public void onResume() {\n    manager.registerListener(listener);\n    super.onResume();\n\
  }\n\n@Override\npublic void onPause() {\n    manager.unregisterListener(listener);\n\
  \    super.onPause();\n}\n```\n\n通过增加模块 `build.gradle` 文件中的版本号、生成并上传新的发布应用 bundle\
  \ 并进行发布来测试监听器代码是否正常。如果设备上已安装了动态功能模块，`Play Core` Library 将忽略再次下载该模块的尝试。因此，为了完全测试监听器，必须在安装更新后的版本之前从\
  \ Play Store 卸载应用。要查看 Play Store 将安装哪个版本，请向下滚动应用页面到 `About app`，选择它并在下图所示的 `App\
  \ Info` 部分检查 `Version` 字段：\n\n如果仍列出之前的版本，请退出应用并等待几分钟后再检查。一旦列出新版本，请完成安装，打开应用并检查在下载动态功能模块时状态文本是否已得到相应的更新。\n\
  \n### 使用延迟安装 (Deferred Installation)\n\n延迟安装会导致动态功能模块在后台下载，并将根据操作系统的决定完成。当启动延迟安装时，监听器将带有待定（pending）状态被调用，但其他无法追踪进度。要尝试延迟安装，请修改\
  \ `installFeature()` 方法如下所示：\n\n```java\npublic void installFeature(View view) {\n\
  \    manager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"));\n}\n```\n\n\
  注意，`deferredInstall()` 方法传递了一个数组，允许延迟多个模块的安装。\n\n### 移除动态模块\n\n此项目的最后一个任务是在 `MainActivity.java`\
  \ 文件中按如下实现 `deleteFeature()` 方法：\n\n```java\nimport java.util.Collections;\n\npublic\
  \ void deleteFeature(View view) {\n    manager.deferredUninstall(Collections.singletonList(\"\
  my_dynamic_feature\"));\n}\n```\n\n该功能的移除将在操作系统在需要额外存储空间时在后台执行。与 `deferredInstall()`\
  \ 方法一样，可以在单次调用中调度多个功能的移除。\n\n### 总结\n\n本章完成了一个示例应用的创建，该应用旨在演示如何在 Android 应用中使用动态功能模块。涵盖的话题包括动态功能模块的创建，以及使用\
  \ `Play Core` Library 的类和方法来安装和管理动态功能。\n\n# 使用 Material Design 3 主题 (Working with\
  \ Material Design 3 Theming)\n\nAndroid 应用的外观旨在符合 Material Design 定义的一系列指南。Material\
  \ Design 由 Google 开发，旨在为不同的应用之间提供设计的一致性，同时允许应用开发者在颜色、字体和形状选择上包含他们自己的品牌设计（这一概念被称为\
  \ Material 主题）。除了设计指南外，Material Design 还包含了一套用于设计用户界面布局的 UI 组件，其中许多组件我们在整本书中一直在使用。\n\
  \n在本章中，我们将概述主题化在 Android Studio 项目中是如何工作的，并探索如何修改为新项目提供的默认设计配置，以满足您的品牌需求。\n\n###\
  \ Material Design 2 与 Material Design 3\n\n在开始之前，重要的是，Google 目前正在从 Material Design\
  \ 2 过渡到 Material Design 3，并且使用 Android Studio Chipmunk 创建的项目默认使用 Material Design\
  \ 2，除非在创建新项目时选择了 Basic Activity (Material3) 模板。Material Design 3 为 Material You\
  \ 提供了基础，这是 Android 12 中引入的一项功能，允许应用自动调整主题元素，以配合用户在设备上配置的偏好。例如，Material Design 3\
  \ 提供的动态颜色支持允许应用中使用的颜色自动适应，以补充用户的壁纸选择。\n\n### 理解 Material Design 主题\n\n我们当然知道，Android\
  \ 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们专门在 XML 布局资源文件中或通过编写代码覆盖颜色属性，否则所有这些组件都使用默认颜色显示。这些默认颜色由项目主题定义。主题由了一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，并被分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都被编写为使用主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 小部件的前景和背景颜色）。因此，我们可以通过更改分配给特定主题槽的颜色来简单地更改应用的主题。当应用运行时，在渲染用户界面时，新的默认颜色将作为所有小部件的默认值。\n\
  \n\n\n\n\n在探索 Material Design 3 之前，我们首先需要查看 Material Design 2 如何在 Android Studio\
  \ 项目中使用。应用项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application` 元素的属性，例如：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyDemoApp\">\n        <activity\n.\n\
  .\n```\n\n如之前讨论的，所有与项目主题相关的文件都包含在 `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml`\
  \ 文件中，如图 图 87-1 所示：\n\n![](img/as_theme_files_in_project_tool_window.jpg)\n\n图 87-1\n\
  \n主题本身声明在 themes 文件夹下的两个 `themes.xml` 文件中。这些资源文件声明了不同的调色板，包含 Material 主题颜色槽，供设备在亮色模式或深色模式时使用。注意，每个文件中\
  \ `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- Base 应用主题。 -->\n    <style name=\"\
  Theme.MyDemoApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\">\n\
  \        <!-- 主品牌色。 -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/white</item>\n        <!-- 次要品牌色。 -->\n       \
  \ <item name=\"colorSecondary\">@color/teal_200</item>\n.\n.\n```\n\n这些颜色槽（也称为颜色属性）被\
  \ Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽被用作 Material Button 组件的背景颜色。分配给槽的实际颜色在\
  \ `colors.xml` 资源文件中声明如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <color name=\"purple_200\">#FFBB86FC</color>\n    <color name=\"\
  purple_500\">#FF6200EE</color>\n    <color name=\"purple_700\">#FF3700B3</color>\n\
  \    <color name=\"teal_200\">#FF03DAC5</color>\n    <color name=\"teal_700\">#FF018786</color>\n\
  \    <color name=\"black\">#FF000000</color>\n    <color name=\"white\">#FFFFFFFF</color>\n\
  </resources>\n```\n\n例如，`colorPrimary` 槽被分配了颜色 `purple_500`，而该颜色又分配了 RGB 颜色值 `FF6200EE`。\n\
  \n创建自定义主题仅需编辑这些文件以使用不同的颜色设置。这些更改将作为 Material 组件的默认颜色使用。\n\n## 87.4 Material Design\
  \ 3 主题设计\n\nMaterial Design 3 (MD3) 仍然使用 `colors.xml` 和 `themes.xml` 文件，但为 MD3 组件提供了更广泛的颜色槽供使用。事实上，MD3\
  \ 提供了 25 多个颜色槽用于自定义应用主题。颜色的名称也不同，因为它们描述的是颜色的用途而不是颜色本身。在 Material Design 2 中，例如我们有一个命名为\
  \ `purple_500` 的颜色：\n\n```xml\n<color name=\"purple_500\">#FF6200EE</color>\n```\n\
  \n反过来，它被用于亮色模式 `themes.xml` 文件中的 `colorPrimary` 主题槽：\n\n```xml\n<item name=\"colorPrimary\"\
  >@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary` 从紫色改为红色。当然，我们只需要将一种红色深色的\
  \ RGB 值分配给 `purple_500` 颜色声明。遗憾的是，我们现在有了一个名称暗示它是紫色的红色声明。唯一的选择是向 `colors.xml` 文件为红色添加一个新条目，然后将其分配给\
  \ `themes.xml` 文件中的 `colorPrimary` 槽。这种方法可行，但为了实现这一点，我们必须编辑颜色和主题文件。在 MD3 中，颜色名称不再引用它们代表的实际颜色。MD3\
  \ 主题文件中的 `colorPrimary` 槽声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\"\
  >#B82000</color>\n```\n\n我们现在可以更改此颜色的 RGB 颜色值，而保持 `themes.xml` 文件不变，且无需在 `colors.xml`\
  \ 中创建新的颜色元素。 \n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml` 中创建新的颜色元素。\
  \ \n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\"\
  >#B82000</color>\n```\n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml`\
  \ 中创建新的颜色元素。 \n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml` 中创建新的颜色元素。\
  \ \n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml` 中创建新的颜色元素。 \n\
  \n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需在 `colors.xml` 中创建新的颜色元素。 \n\n\
  在 `themes.xml` 文件中启用。。以下是来自 MD3 `themes.xml` 文件的片段：\n\n```xml\n<resources>\n   \
  \ <style name=\"Theme.MyApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- \n -->\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_primary</item>\n  \
  \      <item name=\"colorPrimaryContainer\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_primary</item>\n  \
  \  </style>\n</resources>\n```\n\nMD3 中的颜色槽被分组为主要、次要、三级、错误、背景和表面。这些槽由一个基础颜色和一个“之上”颜色组成的对。特定组件使用的分组会有不同。例如，按钮组件使用\
  \ `colorPrimary` 作为背景颜色，使用 `colorOnPrimary` 作为内容（即文本或图标）。另一方面，浮动操作按钮（ActionButton）使用\
  \ `colorPrimaryContainer` 作为背景。通过更改布局编辑器中的颜色设置可以快速识别正确的分组。\n\nMD2 和 MD3 之间最大的区别是支持动态颜色和\
  \ Material You，这些将在下一章“Material Design 3 主题与动态颜色”中介绍。注意，动态颜色只有当用户在设备设置应用程序的壁纸和样式部分将其启用时才会生效。\n\
  \n## 87.5 构建自定义主题\n\n正如我们目前所看到的，实现主题的代码工作相对简单。然而，困难的部分通常是选择一组组成主题的互色。幸运的是，Google\
  \ 开发了一个工具，方便为应用程序设计自定义主题。该工具被称为 Material Theme Builder，地址为：\n\n[`material-foundation.github.io/material-theme-builder`](https://material-foundation.github.io/material-theme-builder)\n\
  \n在工具内部，选择 Custom 选项卡（如 图 87-2 中的 A），通过点击颜色矩形显示颜色选择对话框，为主颜色键（B）选择颜色。一旦选择了颜色，主题面板（C）将更改以反映所有\
  \ MD3 颜色槽的推荐颜色。次要、三级和中性槽生成的颜色可以通过点击圆圈（D）并在颜色选择面板中选择不同的颜色来覆盖。\n\n要将主题整合到设计中，点击导出按钮（E）并选择\
  \ Android 视图（XML）选项。下载后，可以使用 `colors.xml` 和 `themes.xml` 文件替换项目中的现有文件。注意，导出的两个 `themes.xml`\
  \ 文件中的主题名称需要更改以匹配您的项目。\n\n## 87.6 总结\n\n\n\n\nMaterial Design 提供了指南和组件，定义了 Android\
  \ 应用的外观和呈现方式。通过设计指定应用显示时应使用的颜色、字体和形状的主题，可以对应用进行个性品牌化。Google 目前正在引入 `Material Design\
  \ 3`，它取代了 `Material Design 2` 并支持包括动态颜色在内的 `Material You` 新功能。为了设计您自己的主题，Google\
  \ 还提供了 `Material Theme Builder`，它可以减轻选择互补主题颜色的任务。一旦使用该工具设计好主题，就可以导出相应的文件并在 Android\
  \ Studio 项目中使用。\n\n# 88. 从 Material Design 2 迁移到 Material Design 3\n\n本章将演示如何将 Android\
  \ Studio 项目从 `Material Design 2` 迁移到 `Material Design 3`，并集成一个使用 `Material Theme\
  \ Builder` 工具生成的自定义主题。教程还将演示如何为应用添加支持并测试 `Material You` 动态主题颜色。\n\n## 88.1 创建 ThemeMigration\
  \ 项目\n\n在欢迎界面上选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前，选择 `Empty\
  \ Activity`（空活动）模板。\n\n在 `Name`（名称）字段中输入 `ThemeMigration`，并指定 `com.ebookfrenzy.thememigration`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n## 88.2 设计用户界面\n\n主活动将包含一个简单的布局，其中包含一些用户界面组件，让我们能够看到切换到\
  \ `Material Design 3` 的效果以及本章之后进行的主题工作。关于 `MD3` 组件的信息，请参考以下网页：\n\nhttps://material.io/blog/migrating-material-3\n\
  \nhttps://material.io/blog/migrating-material-3\n\n布局将在 `activity_main.xml` 文件中设计，该文件目前包含单个\
  \ `Text` 视图。在布局编辑器中打开此文件，删除 `Text` 视图，禁用 `Autoconnect`（自动连接）模式（在图 88-1 中标记为 `A`），并点击按钮清除布局中的所有约束（`B`）。\n\
  \n![](img/as_theme_demo_disable_autoconnect.jpg)\n\n图 88-1\n\n从 `Palette`（调色板）的\
  \ `Buttons` 部分，将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将 `FloatingActionButton`\
  \ 拖到布局画布上，使其位于 `Button` 组件下方。当提示选择显示在 `FloatingActionButton` 上的图标时，从资源工具窗口选择 `ic_lock_power_off`\
  \ 图标，如图 88-2 所示：\n\n![](img/as_theme_demo_select_icon.jpg)\n\n图 88-2\n\n将 `Chip`\
  \ 小部件的文本属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，使布局图\
  \ 88-3 左侧所示：\n\n![](img/as_theme_demo_layout.jpg)\n\n图 88-3\n\n要设置上图中蓝图视图所示的约束，选择所有组件，右键点击\
  \ `Chip` 视图，并在生成的菜单中选择 `Chains -> Create Vertical Chain`（链 -> 创建垂直链）。重复此步骤，这次选择\
  \ `Center -> Horizontally in Parent`（居中 -> 在父布局中水平）菜单选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面与上方图\
  \ 88-3 显示。布局使用了 `Material Design 2` 组件。下一步是将主题迁移到 `Material Design 3`。\n\n## 88.3\
  \ 迁移到 Material Design 3\n\n要切换到 `Material Design 3` 组件，我们做的只是编辑位于 `app -> res ->\
  \ values -> themes` 下的两个 `themes.xml` 文件。第一个 `themes.xml` 中 `style` 元素的 `name` 属性需要更改如下：\n\
  \n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!--\
  \ Base application theme. -->\n    <style name=\"Theme.ThemeMigration\" parent=\"\
  Theme.Material3.Light\">\n```\n\n同样，对 `themes.xml (night)` 文件进行以下更改，以便将深模式迁移到 `MD3`：\n\
  \n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!--\
  \ Base application theme. -->\n    <style name=\"Theme.ThemeMigration\" parent=\"\
  Theme.Material3.Dark\">\n```\n\n进行更改后，再次运行应用，注意下方图 88-4 所示 `MD2` 和 `MD3` 之间的外观差异：\n\
  \n![](img/as_theme_demo_md2_vs_md3.jpg)\n\n图 88-4\n\n现在我们已经将项目迁移到 `MD3`，下一步是创建一个自定义主题并将其应用到项目中。\n\
  \n## 88.4 构建新主题\n\n项目主题将使用 `Material Theme Builder` 设计和生成。打开浏览器窗口并导航到以下 URL 以访问构建工具：\n\
  \nhttps://material-foundation.github.io/material-theme-builder/\n\nhttps://material-foundation.github.io/material-theme-builder/\n\
  \n一旦加载了构建器，选择屏幕顶部的 `Custom`（自定义）按钮，然后点击 `Primary` 圆圈显示颜色选择器。\n\n![](img/as_theme_builder_change_color.jpg)\n\
  \n图 88-5\n\n在 `Your Theme` 面中审查配色方案，并进行必要的调整直到您对颜色满意。主题准备好后，点击右上角的 `Export`（导出）按钮并选择\
  \ `Android (XML)` 选项。提示时，将文件保存到计算机合适的位置。主题将保存为名为 `material-theme.zip` 的压缩文件。\n\n\
  使用相应的操作系统工具解压主题文件，应包含以下文件夹和文件：\n\n- `values/colors.xml`：颜色定义。\n- `values/themes.xml`：亮模式主题。\n\
  - `values-night/themes.xml`：深模式主题。\n\n现在主题文件已经生成，需要将其集成到 Android Studio 项目中。\n\n\
  ## 88.5 将主题添加到项目\n\n将新主题添加到项目之前，我们需要先删除旧的 `MD2` 主题文件。如果 `Project` 工具窗口处于 `Project\
  \ Files` 模式，这样做更容易。切换模式，使用下所示 `Project` 工具窗口顶部的菜单并选择 `Project Files` 选项：\n\n![](img/as_theme_demo_project_files_menu.jpg)\n\
  \n图 88-6\n\n选择 `Project Files` 模式后，导航到 `app -> src -> main -> res -> values` 文件夹，并选择删除\
  \ `colors.xml` 和 `themes.xml` 文件。同样，删除 `values-night` 文件夹中的 `themes.xml` 文件。\n\n\
  打开操作系统的文件导航工具，找到新主题 `values` 文件夹中的 `colors.xml` 和 `themes.xml` 文件，将其复制并粘贴到 `Project`\
  \ 工具窗口的 `values` 文件夹中。重复此步骤复制 `values-night` 文件夹中的 `themes.xml` 文件，这次粘贴到 `values-night`\
  \ 文件夹。\n\n将 `Project` 工具窗口切换回 `Android` 模式，此时值资源部分应与图 88-7 匹配：\n\n![](img/as_theme_demo_vales_resources_tree.jpg)\n\
  \n图 88-7\n\n审查两个 `themes.xml` 文件，如果 `colorInversePrimary` 和 `colorShadow` 项显示为红色（表示它们未解析），请在继续之前从文件中删除这些行。\n\
  \n接下来，修改亮色 `themes.xml` 文件以匹配当前项目：\n\n```xml\n<resources>\n    <style name=\"Base.Theme.ThemeMigration\"\
  \ parent=\"Theme.Material3.Light.NoActionBar\">\n```\n\n\n\n\n\n```xml\n<item name=\"\
  colorPrimary\">@color/md_theme_light_primary</item>\n<item name=\"colorOnPrimary\"\
  >@color/md_theme_light_onPrimary</item>\n... ...\n</style>\n<style name=\"Theme.ThemeMigration\"\
  \ parent=\"Base.Theme.ThemeMigration\" />\n</resources>\n```\n\n重复这些步骤对 `themes.xml`\
  \ (night) 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或再次运行应用，以确认用户界面现在已使用自定义主题颜色进行渲染。\n\
  \n### 88.6 启用动态颜色支持\n\n为了测试动态颜色，应用程序需要在运行 Android 12 或更高版本且壁纸设置正确的设备或模拟器上运行。在设备或模拟器上，启动\
  \ `Settings` 应用并从选项列表中选择 `Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上，点击更改壁纸选项（在图 88-8 中标记为\
  \ A），并选择一张与你的主题颜色有显著差异的壁纸图像。选择后，将该壁纸分配到主屏幕。\n\n返回 `Wallpaper & styles` 屏幕，在尝试不同的颜色方案按钮（C）之前，确保已选择\
  \ `Wallpaper colors`（壁纸颜色）选项（B）。每点击一个选项，壁纸示例都会发生变化以反映选择：\n\n![](img/compose_theme_wallpaper_and_styles.jpg)\n\
  \n图 88-8\n\n要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用启用动态颜色支持，需要在自定义\
  \ `Application` 实例的 `onCreate()` 方法中调用它。首先，在项目的 `app -> java -> com -> ebookfrenzy\
  \ -> thememigration` 下创建一个新的 Java 类文件，命名为 `ThemeMigrationApplication.java`，并对其进行修改如下：\n\
  \n```java\npackage com.ebookfrenzy.thememigration;\n\nimport android.app.Application;\n\
  import com.google.android.material.color.DynamicColors;\n\npublic class ThemeMigrationApplication\
  \ extends Application {\n    @Override\n    public void onCreate() {\n        super.onCreate();\n\
  \        DynamicColors.applyToActivitiesIfAvailable(this);\n    }\n}\n```\n\n创建自定义\
  \ `Application` 类后，我们现在需要配置项目使用此类而不是默认的 `Application` 实例。要此操作，编辑 `AndroidManifest.xml`\
  \ 文件并添加引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.thememigation\">\n    <application\n        android:name=\"\
  .ThemeMigrationApplication\"\n        android:allowBackup=\"true\"\n... ...\n```\n\
  \n构建并运行应用，注意布局现在正在使用与壁纸颜色匹配的主题。将 `ThemeMigration` 应用置于后台，返回 `Wallpaper & styles`\
  \ 设置屏幕并选择不同的壁纸。再次将 `ThemeMigration` 应用带到前台，此时它将已动态地调整以匹配新的壁纸。\n\n### 88.7 总结\n\n\
  在本章中，我们演示了如何将 Android Studio 项目从 Material Design 2 迁移到 Material Design 3。项目还利用了\
  \ Material Theme Builder 设计了自定义主题，并解释了将生成题文件集成到旧项目中的步骤。最后，本章演示了如何实现和使用 Android 12\
  \ 的 Material You 动态颜色功能。\n\n---\n\n# 89. Android Studio 中的 Gradle 概述\n\n到目前为止，人们在很大程度上认为\
  \ Android Studio 会自动采取必要的步骤来编译和运行创建的应用程序项目。Android Studio 一直通过名为 `Gradle` 的系统在后台实现这一点。\n\
  \n现在是时候查看如何使用 `Gradle` 来编译并打包应用程序项目的各种元素，并开始探索当在 Android Studio 中构建项目有更高级的需求时如何配置此系统了。\n\
  \n### 89.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，它允许通过一组构建配置文件对项目构建方式进行配置和管理。这包括定义如何构建项目、项目成功构建需要满足哪些依赖项，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令行的环境，可以通过插件集成到其他环境中。在 Android\
  \ Studio 的情况下，`Gradle` 集成是通过适当命名的 Android Studio 插件提供的。\n\n尽管 Android Studio 插件允许在\
  \ Android Studio 启动和管理 `Gradle` 任务，但仍然可以使用 `Gradle` 命令行封装器来构建基于 Android Studio 的项目，包括在未安装\
  \ Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 Groovy 编程语言的 `Gradle` 构建文件和脚本中。\n\n###\
  \ 89.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android 应用程序项目带来了许多强大的功能。一些关键功能如下：\n\
  \n### 89.2.1 合理默认\n\n`Gradle` 实现了一个被称为“约定优于配置”（convention over configuration）的概念。这简单意味着\
  \ `Gradle` 拥有一套预定义的合理默认配置设置，除非它们被构建文件中的设置覆盖，否则将使用它们。这意味着可以使用最少的配置完成构建。只有当默认配置不能满足构建需求时，才需要对构建文件进行更改。\n\
  \n### 89.2.2 依赖项\n\n`Gradle` 的另一个核心领域是依赖项。例如，考虑 Android Studio 项目中的一个模块，它触发了加载另一个模块的请求。第一个模块实际上对第二个模块有依赖关系，因为如果在运行时无法找到并启动第二个模块，应用程序将失败。这种依赖可以在第一个模块的\
  \ Gradle 构建文件中声明，以便将第二个模块包含在构建中，或者在无法找到或构建第二个模块时标记错误。其他依赖项示例是项目编译运行所需的库和 JAR 文件。\n\
  \n`Gradle` 依赖项可以分类为本地或远程。本地依赖项引用执行构建的计算机本地文件系统上的项。远程依赖项引用位于远程服务器（通常称为仓库）上的项。\n\n\
  Android Studio 项目使用另一个名为 Maven 的项目管理工具处理远程依赖项。如果在 Gradle 构建文件中使用 Maven 语法声明了远程依赖项，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，以下依赖声明会导致从\
  \ Google 仓库将 AppCompat 库添加到项目中：\n\n```gradle\nimplementation 'androidx.appcompat:appcompat:1.2.0'\n\
  ```\n\n### 89.2.3 构建变体\n\n\n\n\n\n除了依赖项，`Gradle` 还为 Android Studio 项目提供了构建变体（build\
  \ variant）支持。这允许从单个项目构建应用程序的多个变。Android 运行在许多不同的设备上，涵盖了各种类型的处理器和屏幕尺寸。为了尽可能覆盖广泛的设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个适用于手机的用户界面版本，另一个适用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中现在是可以实现的。\n\n### 89.2.4 Manifest 清目项\n\n每个 Android\
  \ Studio 项目都关联着一个 `AndroidManifest.xml` 文件，其中包含了有关应用程序的配置详细信息。在 `Gradle` 构建文件中可以指定多个清单项（manifest\
  \ entries），这些条目会在项目构建时自动生成到清单文件中。此功能与构建变体功能互补，允许为每个构建变体配置不同的应用版本号、应用 ID 和 SDK 版本信息等元素。\n\
  \n### 89.2.5 APK 签名\n\n名为创建、测试和上传 Android App Bundle 的章节介绍了如何使用 Android Studio 环境创建签名的发布\
  \ APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在 `Gradle` 构建文件中，以便可以从命令行生成签名的 APK 文件。\n\
  \n### 89.2.6 ProGuard 支持\n\n`ProGuard` 是 Android Studio 自带的一个工具，它可以优化、收缩和混淆 Java\
  \ 字节码，使其更高效且更难被反向工程（即他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle` 构建文件提供了控制在构建应用程序时是否对其运行\
  \ `ProGuard` 的能力。\n\n### 89.3 属性（Property）与设置（Settings）Gradle 构建文件\n\n`gradle` 构建配置由一组配置、属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含与 Java 虚拟机 (`JVM`) 使用的命令行标志相关的晦涩设置、项目是否使用 `AndroidX` 库以及 Kotlin 编码风格的支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n另一方面，`settings.gradle` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应该搜索哪些在线仓库，以及项目名称。一个典型的\
  \ `settings.gradle` 文件内容如下：\n\n```gradle\npluginManagement {\n    repositories {\n\
  \        gradlePluginPortal()\n        google()\n        mavenCentral()\n    }\n\
  }\n\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n\
  \    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name\
  \ = \"AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n### 89.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，由模块、库、清单文件和\
  \ `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle` 构建文件。该文件列为 `build.gradle` (Project: `<project\
  \ name>`)，可以在项目工具窗口中找到，如图 89-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\n\
  图 89-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```gradle\n//顶层构建文件，你可以在此处添加所有子项目/模块通用的配置选项。\n\
  \nplugins {\n    id 'com.android.application' version '7.1.0-rc01' apply false\n\
  \    id 'com.android.library' version '7.1.0-rc01' apply false\n}\n\ntask clean(type:\
  \ Delete) {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件仅声明使用 `jcenter` 仓库获取远程库，并声明构建依赖于\
  \ Gradle 的 Android 插件。在大多数情况下，没有必要对此构建文件进行任何更改。\n\n### 89.5 模块级 Gradle 构建文件\n\n\
  Android Studio 应用程序项目由一个或多个模块组成。例如，有一个名为 `GradleDemo` 的假设应用程序项目，它包含两个名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要它们自己的 `Gradle` 构建文件。从项目结构来看，这些文件的位置如下：\n\n* `Module1/build.gradle`\n\
  * `Module2/build.gradle`\n\n默认情况下，`Module1.build.gradle` 文件将类似于下面的列表所示：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdk 32\n\
  \    defaultConfig {\n        applicationId \"com.ebookfrenzy.demoapp\"\n      \
  \  minSdkVersion 26\n        targetSdkVersion 32\n        versionCode 1\n      \
  \  versionName \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n    compileOptions {\n        sourceCompatibility\
  \ JavaVersion.VERSION_8\n        targetCompatibility JavaVersion.VERSION_8\n   \
  \ }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.4.1'\n\
  \    implementation 'com.google.android.material:material:1.5.0'\n    implementation\
  \ 'androidx.constraintlayout:constraintlayout:2.1.3'\n    testImplementation 'junit:junit:4.13+'\n\
  \    androidTestImplementation 'androidx.test.ext:junit:1.1.3'\n    androidTestImplementation\
  \ 'androidx.test.espresso:espresso-core:3.4.0'\n}\n```\n\n从文件内容可以看出，构建文件首先声明了使用\
  \ Android 插件：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n```\n\
  \n文件的 `android` 部分随后阐明了构建 `Module1` 时使用的 SDK 版本：\n\n`compileSdk 32`\n\n`defaultConfig`\
  \ 部分中声明的项定义了在构建期间要生成到模块 `AndroidManifest.xml` 中的元素。这些设置可以在构建文件中进行修改，它们取自最初创建模块时在\
  \ Android Studio 中输入的设置：\n\n```gradle\ndefaultConfig {\n    applicationId \"com.ebookfrenzy.demoapp\"\
  \n    minSdkVersion 26\n    targetSdkVersion 32\n    versionCode 1\n    versionName\
  \ \"1.0\"\n    testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n}\n```\n\n`buildTypes` 部分包含了在构建应用程序发布版本时，是否以及如何运行 `ProGuard` 的指令：\n\n```gradle\n\
  buildTypes {\n    release {\n        minifyEnabled false\n        proguardFiles\
  \ getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n\
  \    }\n}\n```\n\n按照目前的配置，构建 `Module1` 时不会运行 `ProGuard`。要启用 `ProGuard`，需要将 `minifyEnabled`\
  \ 项从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在项目的模块目录下找到。\n\n由于此文件中没有声明 `debug`\
  \ `buildType`，将使用默认值（不带 `ProGuard` 构建，使用调试密钥签名并启用调试符号）。\n\n名为 `productFlavors` 的额外部分也可以包含在模块构建文件中，以启用多个构建变体。\n\
  \n接下来，包含了指令，用于指定构建项目时使用的 Java 编译器版本：\n\n```gradle\ncompileOptions {\n    sourceCompatibility\
  \ JavaVersion.VERSION_8\n}\n```\n\n\n\n\n\n```gradle\n    targetCompatibility JavaVersion.VERSION_1_8\n\
  }\n```\n\n最后，`dependencies` 部分列出了模块依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从 Android 仓库包含的\
  \ Android 库：\n\n```\nimplementation 'androidx.core:core-ktx:1.7.0'\nimplementation\
  \ 'androidx.appcompat:appcompat:1.4.1'\n```\n\n注意，依赖声明包含了版本号，用于指示应该包含哪个版本的库。\n\n\
  ## 89.6 在构建文件中配置签名设置\n\n本书中“创建、测试和上传 Android App Bundle”章节涵盖了使用 Android Studio 用户界面设置密钥和生成签名发布版\
  \ APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings` 节中声明。例如：\n\n```gradle\n\
  \    defaultConfig {\n\n    }\n    signingConfigs {\n        release {\n       \
  \     storeFile file(\"keystore.release\")\n            storePassword \"your keystore\
  \ password here\"\n            keyAlias \"your key alias here\"\n            keyPassword\
  \ \"your key password here\"\n        }\n    }\n    buildTypes {\n\n    }\n}\n```\n\
  \n上面的示例直接将密钥密码信息嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\n```gradle\nsigningConfigs\
  \ {\n    release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your key alias here\"\n\
  \        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n```\n\n另一种方法是配置构建文件，使得\
  \ `Gradle` 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n    release {\n       \
  \ storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLIne(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 89.7 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个 `Gradle` 包装工具，用于允许从命令行调用\
  \ `Gradle` 任务。该工具位于每个项目文件夹的根目录下。虽然该包装器在 Windows 系统上是可以执行的，但在 Linux 和 macOS 上使用之前，需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要该包装器的项目目录并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有了执行权限，则需要将该文件的位置添加到你的 `$PATH` 环境变量中，或者在名称前加上缀\
  \ `./` 来运行。例如：\n\n```bash\n./gradlew tasks\n```\n\n`Gradle` 通过许多不同的任务来构建项目构建。可以通过在项目目录下运行以下命令来获取当前项目可用任务的完整列表（如果在\
  \ macOS 或 Linux 上运行，请记住在命令前加上 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的调试发布版项目，请使用\
  \ `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\
  \n```bash\ngradlew assembleRelease\n```\n\n## 89.8 总结\n\n在大多数情况下，Android Studio\
  \ 在后台执行应用构建，无需开发人员的干预。此构建过程使用 `Gradle` 系统处理，这是一个自动化构建工具包，旨在允许通过一组构建配置文件来配置和管理项目构建的方式。虽然\
  \ `Gradle` 的默认行为对于许多基础项目构建需求已经足够，但对于复杂的项目，配置构建过程的需求是不可避免的。本章在 Android Studio 项目的背景下概述了\
  \ `Gradle` 构建系统和配置文件。\n\n## 索引\n\n### 符号\n\n- `<application>` 475\n- `<fragment>`\
