  \ 工具窗口将所有对象的 `textSize` 属性设置为 18sp：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\
  \n图 66-9\n\n在继续之前，请务必将上述步骤中添加的所有 `text` 属性提取到字符串资源中。\n\n### 66.6 向布局中添加按钮栏\n\n下一步是在父\
  \ `LinearLayout` 视图中添加一个 `LinearLayout (Horizontal)` 视图，其位于 `TableLayout` 视图的正下方。首先点击\
  \ `Component Tree` 中 `TableLayout` 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从布局编辑器调色板的 `Layouts`\
  \ 部分拖入一个 `LinearLayout (horizontal)` 实例，将其直接释放到 `Component Tree` 面板中 `TableLayout`\
  \ 条目的下方，并将 `layout_height` 属性更改为 `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.jpg)\n\
  \n图 66-10\n\n将三个 `Button` 对象拖放到新的 `LinearLayout` 中，并为每个按钮分配分别读取“Add”、“Find”和“Delete”的字符串资源。这种类型的按钮栏布局中的按钮通常应以无边框样式显示。对于每个按钮，使用\
  \ `Attributes` 工具窗口将样式设置为 `Widget.AppCompat.Button.Borderless`，并将 `textColor` 属性设置为\
  \ `@color/black`。将按钮的 ID 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\n![](img/as_3.4_change_button_style.jpg)\n\
  \n图 66-11\n\n在 `Component Tree` 中选中新的水平 `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，使按钮在显示区域水平居中。\n\
  \n### 66.7 添加 RecyclerView\n\n在 `Component Tree` 中，点击新添加的水平 `LinearLayout` 条目右侧的展开箭头以折叠所有子项。\n\
  \n从调色板的 `Containers` 部分拖入一个 `RecyclerView` 实例并将其释放到 `Component Tree` 中，使其如 图 66-12\
  \ 所示位于按钮栏 `LinearLayout` 下方。确保 `RecyclerView` 是父垂直 `LinearLayout` 视图的直接子项，而不是水平按钮栏\
  \ `LinearLayout` 的子项。\n\n![](img/as_3.6_tablelayout_recyclerview.jpg)\n\n图 66-12\n\
  \n在布局中选中 `RecyclerView`，将视图的 ID 更改为 `product_recycler`并将 `layout_height` 属性设置为 `match_parent`。在继续之前，检查\
  \ `Component Tree` 面板中的布局层次结构是否与下图所示：\n\n![](img/as_4.1_room_demo_views.jpg)\n\n\
  图 66-13\n\n### 66.8 调整布局边距\n\n最后只需调整一些布局边距。首先点击 `Component Tree` 面板中的第一个 `TableRow`\
  \ 以使其选中。按住键盘上的 `Cmd/Ctrl` 键并点击第二个和第三个 `TableRow`、水平 `LinearLayout` 以及 `RecyclerView`。在\
  \ `Attributes` 面板中找到 `layout_margin` 类别，并将值更改为 10dp，如 图 66-14 所示：\n\n![](img/as_3.4_layout_margin.jpg)\n\
  \n图 66-14\n\n设置边距后，用户界面应如 图 66-1 所示。\n\n### 66.9 总结\n\nAndroid `TableLayout` 容器提供了排列视图的方式。虽然\
  \ `TableLayout` 是整体容器，但其中的行通过 `TableRow` 实例实现。在本章中，我们在 Android Studio 中设计了用户界面。下一章将为该用户界面添加功能，以实现数据库能力。\n\
  \n# 67. Room 数据库与存储库教程\n\n本章将 Room Persistence Library 章节中学的知识与上一章创建的项目相结合，提供一个实现\
  \ SQLite 数据库存储的详细教程。遵循 Android 架构指南，项目将使用视图模型和存储库。教程将使用 Room Persistence Library\
  \ 中涵盖的所有元素，包括实体、数据访问对象（DAO）、Room 数据库和异步查询。\n\n### 67.1 关于 RoomDemo 项目\n\n上一章创建的用户界面布局是创建一个用于存储产品名称和数量的基础应用程序的第一步。完成后，该程序将提供添加、删除和搜索数据库项的功能，同时显示数据库中存储的所有产品的可滚动列表。当添加或删除数据库项时，此产品列表将自动更新。\n\
  \n### 67.2 修改构建配置\n\n首先，启动 Android Studio 并打开上一章的 RoomDemo 项目。在向项目中添加任何新类之前，第一步是向构建添加一些额外的库，包括\
  \ Room 持久库。现在也是在 `build.gradle` 中启用视图绑定（view binding）的好时机。定位并编辑模块级 `build.gradle`\
  \ 文件（app -> Gradle Scripts -> build.gradle (Module: RoomDemo.app)）并修改如下：\n\n```gradle\n\
  android {\n    buildFeatures {\n```\n\n\n\n\n```gradle\nandroid {\n    viewBinding\
  \ true\n}\n\ndependencies {\n    implementation \"androidx.recyclerview:recyclerview:1.2.1\"\
  \n    implementation \"androidx.room:room-runtime:2.4.1\"\n    implementation \"\
  androidx.fragment:fragment-ktx:1.4.1\"\n    annotationProcessor \"androidx.room:room-compiler:2.4.1\"\
  \n}\n```\n\n## 67.3 构建实体 (Entity)\n\n该项目将通过创建实体来定义数据库的模式。实体将包含一个整数类型的 `id`、一个存储产品名称的字符串列以及另一个整数\
  \ `quantity`。`id` 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :--- | :--- |\n\
  | productId | Integer / 主键 / 递增 |\n| pname | String |\n| productquantity | Integer\
  \ |\n\n在工具窗口中右键点击 `app` -> `java` -> `com` -> `ebookfzy` -> `roomdemo` 条目并选择 `New\
  \ -> Java Class` 选项。为实体添加一个类文件。在新的类对话框中将类命名为 `Product`，在列表中选择 `Class` 并按回键生成文件。\n\
  \n当 `Product.java` 文件在编辑器中打开时，对其进行修改：\n\n```java\npackage com.ebookfzy.roomdemo;\n\
  \npublic class Product {\n    private int id;\n    private String name;\n    private\
  \ int quantity;\n\n    public Product(String name, int quantity) {\n        this.name\
  \ = name;\n        this.quantity = quantity;\n    }\n\n    public int getId() {\n\
  \        return id;\n    }\n\n    public String getName() {\n        return name;\n\
  \    }\n\n    public int getQuantity() {\n        return quantity;\n    }\n\n  \
  \  public void setId(int id) {\n        this.id = id;\n    }\n\n    public void\
  \ setName(String name) {\n        this.name = name;\n    }\n\n    public void setQuantity(int\
  \ quantity) {\n        this.quantity = quantity;\n    }\n}\n```\n\n该类现在有了数据库表列对应的\
  \ getter 和 setter 方法。在添加注解之前，该类不会成为实体。在编辑器中打开类文件的情况下，添加注解和相应的导入语句：\n\n```java\n\
  package com.ebookfzy.roomdemo;\n\nimport androidx.annotation.NonNull;\nimport androidx.room.ColumnInfo;\n\
  import androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\n@Entity(tableName\
  \ = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n}\n\
  ```\n\n这些注解将其声明为名为 `products` 的实体，并为 `id` 和 `name` 变量分配列名。`id` 列也被配置为主键并自动生成。由于主键永远不能为空，因此应用\
  \ `@NonNull` 注解。由于在 SQL 查询中不需要引用 `quantity` 列，因此未为其分配列名。\n\n## 67.4 创建数据访问对象 (DAO)\n\
  \n定义产品实体后，下一步是创建 DAO 接口。再次引用工具窗口，右键点击 `app` -> `java` -> `com` -> `ebookfzy` ->\
  \ `roomdemo` 条目并选择 `New -> Java Class` 选项。在新的类对话框中，在 `Name` 字段输入 `ProductDao` 并从列表中如图\
  \ 67-1 所示选择 `Interface`。\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n\n图 67-1\n\
  \n点击 OK 生成新接口，并将 `ProductDao.java` 文件加载到代码中进行以下更改：\n\n```java\npackage com.ebookfzy.roomdemo;\n\
  \nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\nimport androidx.room.Insert;\n\
  import androidx.room.Query;\nimport java.util.List;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n   \
  \ void deleteProduct(String name);\n\n    @Query(\"SELECT * FROM products\")\n \
  \   LiveData<List<Product>> getAllProducts();\n}\n```\n\nDAO 实现了从 products 数据库中插入、查找和删除记录的方法。插入方法传递包含要存储数据的\
  \ `Product` 实体对象，而查找和删除记录的方法传递包含要操作产品名称的字符串。`getAllProducts()` 方法返回包含数据库中所有记录的 `LiveData`\
  \ 对象。此方法将用于保持接口中的 `RecyclerView` 列表。\n\n## 67.5 添加 Room 数据库\n\n在将仓库添加到项目之前的最后一项任务是实现\
  \ Room 数据库。向项目中添加一个名为 `RoomDatabase` 的新类，这次使用 `Class` 选项。文件生成后，使用“Android 持久库”章节概述的步骤对其进行修改：\n\
  \n```java\npackage com.ebookfzy.roomdemo;\n\nimport android.content.Context;\nimport\
  \ androidx.room.Database;\nimport androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\
  \n@Database(entities = {Product.class}, version = 1)\npublic abstract class RoomDatabase\
  \ extends RoomDatabase {\n    public abstract ProductDao dao();\n    private static\
  \ RoomDatabase INSTANCE;\n\n    static RoomDatabase getDatabase(Context context)\
  \ {\n        if (INSTANCE == null) {\n            synchronized (RoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            RoomDatabase.class,\n                            \"\
  product_database\").build();\n                }\n            }\n        }\n    \
  \    return INSTANCE;\n    }\n}\n```\n\n## 67.6 添加仓库 (Repository)\n\n向项目添加一个名为 `ProductRepository`\
  \ 的新类，并选择 `Class` 选项。仓库类将负责代表 `ViewModel` 与数据库进行交互，并需要提供使用 DAO 插入、删除和查询产品记录的方法。除了\
  \ `getAllProducts()` DAO 方法返回 `LiveData` 对象外，这些数据库操作需要在单独线程上执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加 handler 代码以将搜索结果返回给仓库：\n\n```java\npackage com.ebookfzy.roomdemo;\n\nimport\
  \ android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\nimport\
  \ java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n\n    Handler\
  \ handler = new Handler(Looper.getMainLooper()) {\n        @Override public void\
  \ handleMessage(Message msg) {\n            searchResults.setValue(results);\n \
  \       }\n    };\n}\n```\n\n\n\n\n\n`ProductRepository` 类现在需要提供一些可以供 `ViewModel`\
  \ 调用以启动这些操作的方法。然而，为了实现这一点，仓库需要通过 `ProductRoomDatabase` 实例获取 `DAO` 引用。为 `ProductRepository`\
  \ 类添加一个构造方法来执行这些任务：\n\n```java\nimport android.app.Application;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n    private final\
  \ ProductDao productDao;\n\n    public ProductRepository(Application application)\
  \ {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，就可以按照如下方式将方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> {\n            productDao.insertProduct(newproduct);\n    });\n    executor.shutdown();\n\
  }\n\npublic void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n            productDao.deleteProduct(name);\n    });\n\
  \    executor.shutdown();\n}\n\npublic void findProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \            results = productDao.findProduct(name);\n            handler.sendEmptyMessage(0);\n\
  \    });\n    executor.shutdown();\n}\n```\n\n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在在\
  \ `findProduct()` 方法中，会向 `handler` 发送一条消息，指示新结果已可用。\n\n完成仓库类还剩最后一项任务。用户界面布局中的 `RecyclerView`\
  \ 需要能够实时更新存储在数据库中的当前产品列表。`ProductDao` 类已经包含一个名为 `getAllProducts()` 的方法，该方法使用 SQL\
  \ 查询选择所有数据库记录并将它们封装在 `LiveData` 对象中返回。仓库需要在初始化时调用一次此方法，并将结果存储在一个 `LiveData` 对象中，该对象可以被\
  \ `ViewModel` 观察，进而被 UI 控制器观察。一旦完成此设置，数据库表每发生变化，UI 控制器观察者都会收到通知，`RecyclerView` 就可以更新最新的产品列表。在\
  \ `ProductRepository.java` 文件中，添加一个 `LiveData` 变量并在构造方法中调用 DAO 的 `getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用以获取 `allProducts` 和 `searchResults`\
  \ live 数据对象引用的方法：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n\
  \    return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n## 67.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供\
  \ UI 控制器可以利用的方法和 `LiveData` 对象，以保持用户界面与底层数据库同步。正如在 `ProductRepository.java` 中实现的那样，仓库构造方法需要访问应用上下文以便获取\
  \ Room 数据库实例。为了让 `ViewModel` 内部可以访问应用上下文，`ViewModel` 需要继承 `AndroidViewModel` 的子类。因此，首先开始编辑\
  \ `MainViewModel.java` 文件（位于 `app -> java -> com -> ebookfrenzy -> roomdemo -> ui.main`），并将类更改为\
  \ `AndroidViewModel` 并实现构造方法：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.app.Application;\nimport androidx.lifecycle.AndroidViewModel;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.lifecycle.MutableLiveData;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.ui.main.ProductRepository;\n\
  import java.util.List;\n\npublic class MainViewModel extends AndroidViewModel {\n\
  \    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel(Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造方法本质上创建了一个仓库实例，然后使用它来获取结果和 live 数据对象的引用，以便它们可以被 UI 控制器观察。现在\
  \ `ViewModel` 中剩下的所有工作是实现 UI 控制器响应点击调用的方法：\n\n```java\nMutableLiveData<List<Product>>\
  \ getSearchResults() {\n    return searchResults;\n}\n\nLiveData<List<Product>>\
  \ getAllProducts() {\n    return allProducts;\n}\n\npublic void insertProduct(Product\
  \ product) {\n    repository.insertProduct(product);\n}\n\npublic void findProduct(String\
  \ name) {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String\
  \ name) {\n    repository.deleteProduct(name);\n}\n```\n\n## 67.8 创建产品项布局\n\n数据库中的每个产品名称将出现在\
  \ `RecyclerView` 列表中。这需要一个包含 `TextView` 的布局资源文件用于列表中的每一行。现在通过右键点击项目窗口中的 `app ->\
  \ res -> layout` 并选择 New -> Layout resource file 添加此文件。将文件命名为 `product_list_item`并在点击\
  \ OK 创建文件之前将根元素更改为 `LinearLayout`。在布局编辑器加载文件后，在设计模式下，从调板中拖出一个 `TextView` 对象到布局中，它将默认出现在布局顶部：\n\
  \n![image/as_3.5_roomdemo_item_layout.jpg)\n图 67-2\n\n在布局中选中 `TextView`，使用属性窗口将视图的\
  \ ID 设置为 `product_row`并将 `layout_height` 设置为 `30dp`。选择组件树中的 `LinearLayout` 并将 `layout_height`\
  \ 属性设置为 `wrap_content`。\n\n## 67.9 添加 RecyclerView 适配器\n\n正如使用 RecyclerView 和 CardView\
  \ Widget](#RecyclerView.xhtml__idTextAnchor967）章节详细概述的，`RecyclerView` 实例需要一个适配器类来提供要显示的数据。现在通过右键点击项目窗口中的\
  \ `app -> java -> com -> ebookfrenzy -> roomdemo -> ui.main` 项并选择 New -> Java Class...\
  \ 类。在对话框中，将类命名为 `ProductListAdapter`并在列表中选择 Class，然后按回车键。将生成的 `ProductListAdapter.java`\
  \ 类加载到编辑器后，按如下方式实现类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\n```\n\n\n\n\n### 67.10 准备 Main Fragment\n\n最后一个需要修改的组件是\
  \ `MainFragment` 类，它需要为 `Button` 视图配置监听器，并为位于 `ViewModel` 类中的 `live data` 对象配置观察器。在添加这些代码之前，需要进行一些准备工作，包括添加一些导入、变量以及获取视图\
  \ ID 的引用。我们还需要修改 fragment 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\
  \n```java\nimport com.ebookfrenzy.roomdemo.databinding.MainFragmentBinding;\n\n\
  public class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater,\n                               @Nullable ViewGroup container,\n   \
  \                            @Nullable Bundle savedInstanceState) {\n        return\
  \ inflater.inflate(R.layout.main_fragment, container, false);\n        binding =\
  \ MainFragmentBinding.inflate(inflater, container, false);\n        return binding.getRoot();\n\
  \    }\n\n    @Override\n    public void onDestroyView() {\n        super.onDestroyView();\n\
  \        binding = null;\n    }\n\n    @Override\n    public void onActivityCreated(@Nullable\
  \ savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      listenerSetup();\n        observerSetup();\n        recyclerViewSetup();\n\
  \    }\n}\n```\n\n在代码的不同阶段，应用需要清空用户界面中的产品信息。为了避免重复，请添加以下 `clearFields()` 函数：\n\n\
  ```java\nprivate void clearFields() {\n    binding.productID.setText(\"\");\n  \
  \  binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\"\
  );\n}\n```\n\n在应用构建和测试之前，需要将从 `onActivityCreated()` 方法中调用的三个方法添加到类中。\n\n## 67.1\
  \ 添加按钮监听器\n\n该 fragment 的用户界面布局包含三个按钮，每个按钮在被用户点击时都需要执行特定的任务。编辑 `MainFragment.java`\
  \ 文件并添加 `listenerSetup()` 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \nprivate void listenerSetup() {\n    binding.addButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            String\
  \ name = binding.productName.getText().toString();\n            String quantity\
  \ = binding.productQuantity.getText().toString();\n            if (!name.equals(\"\
  \") && !quantity.equals(\"\")) {\n                Product product = new Product(name,\
  \ Integer.parseInt(quantity));\n                mViewModel.insertProduct(product);\n\
  \                clearFields();\n            } else {\n                binding.productID.setText(\"\
  Incomplete information\");\n            }\n        }\n    });\n    binding.findButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            mViewModel.findProduct(binding.productName.getText().toString());\n\
  \        }\n    });\n    binding.deleteButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \            clearFields();\n        }\n    });\n}\n```\n\n`addButton` 监听器执行了一些验证，以确保用户同时输入了名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体（注意：数量字符串被转换为整数以匹配实体数据）。在清空字段之前，会调用 `insertProduct()` 方法。`findButton`\
  \ 和 `deleteButton` 将产品名称传递给 `findProduct()` 或 `deleteProduct()` 方法。\n\n## 67.2 添加\
  \ LiveData 观察器\n\n用户界面现在需要添加观察器，以保持与 `ViewModel` 中 `searchResults` 和 `allProducts`\
  \ `live data` 的同步。保持在 `Mainfragment.java` 文件中，如下实现 `observer` 方法：\n\n```java\nimport\
  \ androidx.lifecycle.Observer;\nimport java.util.List;\nimport java.util.Locale;\n\
  \nprivate void observerSetup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            adapter.setProductList(products);\n   \
  \     }\n    });\n    mViewModel.getSearchResults().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            if (products.size() > 0) {\n          \
  \      binding.productID.setText(String.format(Locale.US, \"%d\", products.get(0).getId()));\n\
  \                binding.productName.setText(products.get(0).getName());\n     \
  \           binding.productQuantity.setText(String.format(Locale.US, \"%d\", products.get(0).getQuantity()));\n\
  \            } else {\n                binding.productID.setText(\"No Match\");\n\
  \            }\n        }\n    });\n}\n```\n\n“all products”观察器仅将当前的产品列表传递给 `RecyclerViewAdapter`\
  \ 的 `setProductList()` 方法，从而更新显示列表。\n\n“search results”观察器检查数据库中是否至少找到了一个匹配项，从列表中提取第一个匹配的\
  \ `Product` 实体对象，获取该对象的数据，并在必要时进行转换，将其赋值给布局中的 `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品\
  \ ID `TextView` 上的消息通知用户。\n\n### 67.13 初始化 RecyclerView\n\n添加最后的设置方法来初始化并配置 `RecyclerView`\
  \ 和适配器：\n\n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport\
  \ androidx.recyclerview.widget.RecyclerView;\n```\n\n\n\n\n```java\nprivate void\
  \ recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n        new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n### 67.14 测试 RoomDemo\
  \ 应用\n\n在设备或模拟器上编译并运行该应用，添加一些产品并确保它们自动出现在 `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否相应更新。最后，输入一个现有产品的名称，从数据库中删除它，并确认它已从\
  \ `RecyclerView` 中移除。\n\n### 67.15 使用数据库检查器 (Database Inspector)\n\n正如之前在“Android\
  \ 持化库”中所概述的，可以使用 `Database Inspector` 工具检查与运行应用关联的 Room 数据库的内容，并进行细微的数据更改。在使用 `RoomDemo`\
