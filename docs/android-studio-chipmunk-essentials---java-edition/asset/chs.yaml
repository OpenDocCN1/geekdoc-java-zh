  \ Settings`中概述的回退选项。注意请求失败了，因为此更改涉及了项目资源。点击 `Apply Changes and Restart Activity`\
  \ 按钮，并验证活动已重启并在 `TextView` 部件上显示了新文本。\n\n## 25.8 使用 Run App\n\n如前所述，方法的更改需要重新安装和应用程序。为了体验这一点，编辑\
  \ `MainActivity.java` 文件，在 `onCreate` 方法之后添加一个方法：\n\n```java\npublic void demoMethod()\
  \ {\n}\n```\n\n使用 `Apply Changes` 按钮并确认更改已应用。接下来，删除该方法，并验证点击任一 `Apply Changes` 按钮将导致请求失败。运行应用程序的唯一方法是点击\
  \ `Run App` 按钮。\n\n## 25.9 总结\n\nApply Changes 是 Android Studio 的一项功能，旨在加速开发应用程序时的代码、构建和运行周期。Apply\
  \ Changes 能够在许多情况下无需重新安装或重启应用程序即可推送更改。Apply Changes 根据更改的性质提供不同级别的支持。\n\n# 26 事件处理概述与示例\n\
  \n之前的章节涵盖了许多关于用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面交互如何触发底层活动执行。换句话说，我们从之前的章节知道如何创建一个包含按钮视图的用户界面，但不知道在点击它时会发生什么。\n\
  \n因此，本章的主要目标是提供 Android 应用程序事件处理的概述，并结合 Android Studio 示例项目。\n\n## 26.1 理解事件\n\n\
  Android 事件可以以各种形式存在，但通常是对外部操作的响应。最常见的事件形式（特别是对于平板电脑和智能手机）涉及某种形式的交互。此类事件属于输入事件范畴。Android\
  \ 框架维护一个事件队列，事件在发生时会被放入队列。然后，按照先进先出（FIFO）原则从队列中移除事件。对于输入事件（如触摸屏幕），事件将传递给位于屏幕上触摸发生位置的视图。除了事件通知外，视图还会接收到有关事件性质的范围信息（取决于事件类型）。\n\
  \n\n\n\n为了能够处理传递过的事件，视图必须设置一个事件监听器。所有用户界面组件都派生自 `View` 类，它包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的调。例如，如果一个按钮要响应点击事件（等同于用户触摸并松开按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过对目标视图的 `setOnClickListener()` 方法进行调用来完成）并实现相应的\
  \ `onClick()` 回调方法。如果在屏幕上按钮视图的位置检测到“点击”事件，则当该事件从事件队列中移除时，Android 框架将调用该视图的 `onClick()`\
  \ 方法。当然，任何为了响应按钮点击而执行的任务或应被调用的其他方法，都应该在 `onClick()` 回调方法的实现中完成。\n\n## 26.2 使用 `android:onClick`\
  \ 资源\n\n在详细探索事件监听器之前，值得注意的是，当只需要在用户在界面上“点击”按钮视图时调用回调方法，系统提供了一种快捷方式。考虑一个包含名为 `button1`\
  \ 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用活动类中声明的名为 `buttonClick()` 方法。实现此行为只需编写 `buttonClick()`\
  \ 方法（该方法接收触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行代码即可。例如：\n\n```xml\n<Button\n \
  \     android:id=\"@+id/button1\"\n      android:layout_width=\"wrap_content\"\n\
  \      android:layout_height=\"wrap_content\"\n      android:onClick=\"buttonClick\"\
  \n      android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理器提供的选项范围，而事件处理器是本章其余部分的话题。正如后续章节概述的那样，`onClick`\
  \ 属性在涉及 fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当在设备屏幕布局选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n## 26.3 事件监听器和回调方法\n\n在本章稍后概述的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。在在此之前，值得花些时间概述\
  \ Android 框架中提供的事件监听器以及每个监听器关联的回调方法。\n\n*   `onClickListener`: 用于检测点击式事件，即用户触摸然后释放由视图占据的设备显示区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n*   `onLongClickListener`: 用于检测用户在视图上长时间保持触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n*   `onTouchListener`: 用于检测与触摸屏的任何形式的接触，包括单个或多次触摸以及手势动作。与\
  \ `onTouch()` 回调对应，此主题将在“Android 触摸和多点事件处理”章节中进行详细地介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n*   `onCreateContextMenuListener`: 监听由于长按产生的上下文菜单创建。对应于 `onCreateContextMenu()`\
  \ 回调方法。回调方法接收菜单、接收事件的视图和一个菜单上下文对象。\n*   `onFocusChangeListener`: 检测当由于与轨迹球或导航键交互导致焦点移出当前视图的情况。对应于\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示焦点是否获得或丢失的 `Boolean` 值传递。\n*   `onKeyListener`:\
  \ 用于检测当视图拥有焦点时按下设备上的按键。对应于 `onKey()` 回调方法。传递的参数是接收事件的视图、被按下物理键的 `KeyCode` 以及 `KeyEvent`\
  \ 对象。\n\n## 26.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个 Android Studio 项目的创建，用于演示事件监听器和相应回调方法的实现，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图，以指示事件已处理。\n\
  \n从欢迎界面选择 New Project（新建项目）选项，在出现的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty Activity（空活动）模板。\n\
  \n在 `Name` 字段中输入 `EventExample` 并指定 `com.ebookfrenzy.eventexample` 为包名。在点击 Finish（完成）按钮之前，将最小\
  \ API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照节 [11.8 Migrating a\
  \ Project to View Binding] 中概述的步骤，将项目转换为使用 `view binding`。\n\n## 26.5 设计用户界面\n\n\
  示例中 `MainActivity` 类的用户界面布局将由一个 `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图\
  \ 26-1 所示。\n\n![](img/as_4.1_event_example_ui.jpg)\n图 26-1\n\n找到并选择 Android Studio\
  \ 创建的 `activity_main.xml` 文件（位于项目窗口的 `app -> res -> layouts`），双击将其加载到布局编辑器。\n\n\
  确保 Autoconnect（自动连接）已启用，然后从调色板中拖入 `Button` 组件，并移动使其位于布局的水平中心且位于 `TextView` 组件的下方。当位置正确后，将组件放置到位，以便自动连接系统添加相应的约束。\n\
  \n选择“Hello World!” `TextView` 组件，并使用属性面板将其 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的\
  \ ID 改为 `myButton`。\n\n点击布局编辑器工具栏上的 Infer Constraints（推断约束）按钮来添加任何缺失的约束。\n\n选中 `Button`\
  \ 组件，使用属性面板将 `text` 属性设置为 `Press Me`。使用布局编辑器右上角的黄色警告按钮（图 26-2），显示警告列表并点击 Fix（修复）按钮，将按钮上的文本字符串提取到名为\
  \ `press_me` 的资源中：\n\n![](img/as_layout_warning_icon.jpg)\n图 26-2\n\n## 26.6 事件监听器和回调方法\n\
  \n布局完成后，下一步是注册事件监听器和回调方法。\n\n在本示例中，需要为 `myButton` 视图注册 `onClickListener`。这是通过对按钮视图调用\
  \ `setOnClickListener()` 方法来实现的，传递一个新的 `onClickListener` 对象作为参数，并实现 `onClick()`\
  \ 回调方法。由于这是一个只需要在活动创建时执行一次的任务，良好的位置是 `MainActivity` 类的 `onCreate()` 方法。\n\n\n\n\n\
  如果 `MainActivity.java` 文件已经在编辑器会话中打开，请通过点击编辑器面板中的标签页来选择它。或者，通过在项目工具窗口中导航到 `(app\
  \ -> java -> com -> ebookfrenzy -> eventexample -> MainActivity)` 来找到它，并双击将其加载到代码编辑器中。加载后，找到模板\
  \ `onCreate()` 方法并对其修改以获取按钮视图的引用，注册事件监听并实现 `onClick()` 回调方法：\n\n```java\npackage\
  \ com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n                }\n            }\n        );\n    }\n}\n```\n\n上述代码现在已经在按钮上注册了事件监听器并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有任何指示表明安装在按钮上的事件监听器正在工作，因为目前在 `onClick()` 回调方法体内尚未实现任何代码。本示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要进行一些额外的代码更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n        new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \          binding.statusText.setText(\"Button clicked\");\n            }\n    \
  \    }\n    );\n}\n```\n\n通过在 AVD 模拟器或物理 Android 设备上编译并运行应用程序，完成本教程的这一阶段。在触摸并松开按钮视图（也称为“点击”）时，文本视图应该改变并显示“Button\
  \ clicked”文本。\n\n## 26.7 消费事件\n\n在视图上检测标准点击（相对于长点击）是事件处理的一个非常简单的情况。现在示例将扩展为包含对长点击事件的检测，长点击事件在用户点击并按住屏幕上的视图时发生，从而涵盖了事件消费的主题。\n\
  \n考虑本章上部分 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完成后它不会向 Android 框架返回任何值。\n\n另一方面，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是向 Android 运行时指示回调是否消费了该事件。如果回调返回\
  \ `true` 值，框架将丢弃该事件。相反，如果回调返回 `false` 值，Android 框架将认为该事件仍然有效，并因此将其传递给同一视图上注册的下一个匹配的事件监听器。\n\
  \n与许多编程概念一样，这通过示例演示最好。第一步是为按钮添加长点击的事件监听器和回调：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n            }\n        }\n    );\n    binding.myButton.setOnLongClickListener(\n\
  \        new Button.OnLongClickListener() {\n            public boolean onLongClick(View\
  \ v) {\n                binding.statusText.setText(\"Button clicked\");\n      \
  \          return true;\n            }\n        }\n    );\n}\n```\n\n## 26.8 总结\n\
  \n如果用户界面包含的视图不对用户交互做出任何响应，那么用户界面就毫无用处。Android 通过事件监听器和回调方法的概念弥合了用户界面与后端代码之间的差距。`View`\
  \ 类定义了一组事件监听器，可以注册在视图对象上。每个事件监听器都有关联的回调方法。\n\n当用户界面中的视图上发生事件时，该事件被放入事件队列，并由 Android\
  \ 运行时按照先先出的原则进行处理。如果发生事件的视图注册了与事件类型匹配的监听器，则会调用相应的回调方法。该代码会在返回之前执行 activity 所需要的任何任务。某些回调方法需要返回\
  \ `Boolean` 值，以指示事件是否需要传递给视图上注册的其他事件监听器，还是被系统丢弃。\n\n## 27 Android 触摸和多点事件处理\n\n\
  大多数 Android 设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸转换为运行中的 Android 应用程序内动作的机制。然而，触摸事件处理远比响应视图对象上的单指点击要复杂得多。例如，大多数\
  \ Android 设备可以同时检测到多个触摸。触摸也不局限于设备显示器上的某一点。当然，触摸可以是动态的，当用户在屏幕表面滑动一个或多个接触点时。\n\n\n\
  \n\n本章将解释涉及运动的触摸处理，并探索并发触摸拦截的概念。识别手势的主题将在下一章介绍。\n\n## 27.1 拦截触摸事件\n\n可以通过注册 `onTouchListener`\
  \ 事件监听器并实现相应的 `onTouch()` 回调方法由视图拦截触摸事件。下面的代码确保了名为 `myLayout` 的视图上的任何触摸操作都会调用 `onTouch()`\
  \ 方法：\n\n```java\nbinding.myLayout.setOnTouchListener(\n    new ConstraintLayout.OnTouchListener()\
  \ {\n        public boolean onTouch(View v, MotionEvent m) {\n            // 在此处执行任务\n\
  \            return true;\n        }\n    }\n);\n```\n\n正如代码所示，`onTouch()` 回调需要返回一个\
  \ `Boolean` 值，指示 Android 运行时是将事件传递给其他监听器还是丢弃。方法传递了 `MotionEvent` 类型的对象。\n\n## 27.2\
  \ MotionEvent 对象\n\n传递 `onTouch()` 回调方法的 `MotionEvent` 对象是获取事件信息的关键。对象中包含的信息包括触摸的位置以及执行的操作类型。`MotionEvent`\
  \ 对象也是处理多触摸的关键。\n\n## 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。可以通过调用传递 `onTouch()`\
  \ 回调方法的 `MotionEvent` 对象的 `getAction()` 方法获取事件相关的动作类型。当视图上发生第一次触摸时，`MotionEvent`\
  \ 对象将包含动作类型 `DOWN` 以及触摸的坐标。当该触摸离开屏幕时，会生成 `ACTION_UP` 事件。在 DOWN 和 UP 事件之间的任何任何运动将由\
  \ `ACTION_MOVE` 事件表示。\n\n当视图上同时执行多个触摸时，这些触摸被称为指针（pointers）。在多触摸场景中，指针分别以 `ACTION_POINTER_DOWN`\
  \ 和 `ACTION_POINTER_UP` 开始结束。要识别触发事件的指针索引，必须调用 `MotionEvent` 对象的 `getAction()` 回调方法。\n\
  \n## 27.4 处理多触摸\n\n名为“Android 事件处理概述与示例”的章节开始在单个触摸事件的狭范围内探索事件处理。实践中，大多数 Android\
  \ 设备具有响应连续触摸的能力（但重要的是，可以检测到的同时触摸数量取决于设备）。\n\n如前所述，在多触摸情况下，每次触摸都被 Android 框架视为一个指针。每个指针又通过索引值引用并分配一个\
  \ ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()` 方法获取指针的数量。当前指针列表中特定索引的指针 ID\
  \ 可以通过调用 `MotionEvent getPointerId()` 方法获取。例如，下面的代码片段获取了指针计数以及索引为 0 的指针的 ID：\n\n\
  ```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int pointerCount =\
  \ m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n    return true;\n\
  }\n```\n\n注意，当 `onTouch` 监听器触发时，指针计数始终大于等于 1（因为回调的触发必须至少发生一次触摸）。\n\n视图上的触摸（特别是涉及屏幕运动的触摸）会在与屏幕接触点释放之前产生系列事件。因此，应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的\
  \ ID 不会从一个事件变为另一个事件，但重要的是记住索引值会随着其他触摸事件的到来和离开而改变。因此，在处理跨事件的触摸手势时，必须使用 ID 值作为触摸引用，以确保跟踪的是同一个触摸。当调用需要索引值的方法时，应通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸的 ID 转换为相应的索引值来获取。\n\n## 27.5 多触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪跨布局视图移动的两个触摸手势。当每个触摸触发时，坐标、索引和 ID 将显示在...\n\n\n\n\n```java\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    binding.activityMain.setOnTouchListener(\n\
  \        new ConstraintLayout.OnTouchListener() {\n            public boolean onTouch(View\
  \ v, MotionEvent m) {\n                handleTouch(m);\n                return true;\n\
  \            }\n        }\n    );\n}\n```\n\n在测试应用程序之前的最后一个任务是实现由监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++)\n    {\n  \
  \      int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id\
  \ = m.getPointerId(i);\n        int action = m.getActionMasked();\n        int actionIndex\
  \ = m.getActionIndex();\n        String actionString;\n        switch (action)\n\
  \        {\n            case MotionEvent.ACTION_DOWN:\n                actionString\
  \ = \"DOWN\";\n                break;\n            case MotionEvent.ACTION_UP:\n\
  \                actionString = \"UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_POINTER_DOWN:\n                actionString = \"PNTR DOWN\"\
  ;\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n   \
  \             actionString = \"PNTR UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n         \
  \       break;\n            default:\n                actionString = \"\";\n   \
  \     }\n        String touchStatus = \"Action: \" + actionString + \" Index: \"\
  \ + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，花时间系统地梳理这段代码，以突出所执行的任务。代码首先获取用户界面中两个\
  \ `TextView` 对象的引用，并识别当前有多少个活跃的指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取触摸的 `X` 和 `Y`\
  \ 坐标，以及相应的 `ID`、动作类型和动作索引。最后，声明了一个字符串变量 `actionString` ：\n\n```java\nfor (int i\
  \ = 0; i < pointerCount; i++) {\n    int x = (int) m.getX(i);\n    int y = (int)\
  \ m.getY(i);\n    int id = m.getPointerId(i);\n    int action = m.getActionMasked();\n\
  \    int actionIndex = m.getActionIndex();\n    String actionString;\n```\n\n由于动作类型等于整数值，因此使用\
  \ `switch` 语句将动作类型转换为更有意义的字符串，并将其存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch\
  \ (action)\n{\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\"\
  ;\n        break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\"\
  ;\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString\
  \ = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n  \
  \      actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定该字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\n\
  else\n    binding.textView2.setText(touchStatus);\n```\n\n## 27.8 运行示例应用程序\n\n编译并运行应用程序，启动后，在屏幕上尝试单点和多点触摸实验，并注意文本视图更新以反映事件，如图\
  \ 27-3 所示。在模拟器上运行时，可以通过按住 `Ctrl`（macOS 上为 `Cmd`）键同时点击鼠标按钮来模拟多点（注意，如果模拟器在工具窗口中运行，模拟多点可能无效）：\n\
  \n![](img/as_4.1_motion_event_running.jpg)\n\n图 27-3\n\n## 27.9 总结\n\nActivity 通过注册\
  \ `onTouchListener` 事件监听器并实现 `onTouch()` 回调方法来接收触摸事件通知。当该方法被 Android 运行时调用时，会被传递一个\
  \ `MotionEvent` 对象。该对象包含了有关触摸的信息。\n\n\n\n\n\n检测常见手势的基本步骤如下：\n\n1.  声明一个实现了 `GestureDetector.OnGestureListener`\
  \ 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是所属的 activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n\n2.  创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递。。\n\
  \n3.  可选地调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以根据需要启用双击检测。\n\
  \n4.  在所属的 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来必须调用 `GestureDetectorCompat`\
  \ 实例的 `onTouchEvent()` 方法并将当前的运动事件对象作为参数传递给该方法。一旦实现，结果是在应用程序代码中的一组方法，当检测到特定类型的手势时，这些方法将被调用。随后可以实现这些方法中的代码，以执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分，我们将通过创建一个示例项目，来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类当前支持的全范围常见手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎屏幕上选择 New Project 选项，在生成的新项目对话框中，点击\
  \ Next 按钮之前选择 Empty Activity 模板。\n\n在 Name 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单更改为 Java。\n\n按照第 11.8 Migrating a Project to View Binding 节所述，调整项目以使用 view binding。\n\
  \n一旦创建了新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml` 文件并双击它以将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” TextView 组件，并在 Attributes\
  \ 工具窗口中输入 `gestureStatusText` 作为 ID。\n\n## 28.3 实现监听器类\n\n如前所述，有必要创建一个实现了 `GestureDetector.OnGestureListener`\
  \ 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener` 接口。虽然这可以是一个全新的类，但在当前\
  \ activity 类中实现它也是完全有效的。因此，为了本示例，我们将修改 `MainActivity` 类以实现这些监听器接口。编辑 `MainActivity.java`\
  \ 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\nimport android.view.GestureDetector;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity\n        implements\
  \ GestureDetector.OnGestureListener,\n        GestureDetector.OnDoubleTapListener\n\
  {\n.\n.\n}\n```\n\n声明该类实现了监听器接口要求在类中也实现相应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport android.view.MotionEvent;\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener {\n.\n.\n\n    @Override\n    public boolean\
  \ onDown(MotionEvent event) {\n        binding.gestureStatusText.setText (\"onDown\"\
  );\n        return true;\n    }\n\n    @Override\n    public boolean onFling(MotionEvent\
  \ event1, MotionEvent event2,\n                            float velocityX, float\
  \ velocityY) {\n        binding.gestureStatusText.setText(\"onFling\");\n      \
  \  return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                           float distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"\
  onScroll\");\n        return true;\n    }\n\n    @Override\n    public void onPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onPress\");\n    }\n\n \
  \   @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onSingleTapUp\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onDoubleTap(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onDoubleTap\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onDoubleEvent(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onDoubleEvent\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onTapConfirmed(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onTapConfirmed\");\n        return true;\n    }\n.\n.\n}\n```\n\n注意，这些方法中的许多一个返回\
  \ `true`。这向 Android 框架指示事件已被消费，不需要传递给下一个处理器。\n\n## 28.4 创建 GestureDetector 实例\n\n\
  在 activity 类更新实现监听器接口后，下一步是创建 `GestureDetectorCompat` 实例。由于只需要在 activity 创建时执行一次，代码的最佳位置是\
  \ `onCreate()` 方法。由于我们还想检测双击，代码需要调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()`\
  \ 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n\n.\n}\n```\n\n## 28.5 实现 onTouchEvent() 方法\n\n如果此时编译并运行应用程序，在设备上执行手势都不会发生任何事情。这是因为还没有添加代码来拦截触摸事件并将传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，必要重写 activity 类中的 `onTouchEvent()` 方法，并实现使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，留在 `MainActivity.java` 文件中，实现此方法使其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 28.6 测试应用程序\n\
  \n\n\n\n\n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意，文本视图会更新以反映事件，如图\
  \ 28-1 所示：\n\n![](img/Image2425.jpg)\n\n图 28-1\n\n## 28.7 总结\n\n用户与设备触摸屏显示之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间的交互方法。虽然一个手势可以由几乎任何动作序列组成，但有一套广泛使用的手势，触摸屏设备的用户对此非常熟悉。通过使用\
  \ Android `GestureDetector` 类，可以在应用程序中轻松地检测到许多所谓的“常用手势”。在本章中，我们已经从理论和示例项目实现两个概述了该技术的使用。\n\
  \n在本章涵盖了常用手势之后，下一章将介绍检测更广泛类型的手势，包括具备设计和检测自定义手势的能力。\n\n# 29. 在 Android 上实现自定义手势和缩放识别\n\
  \n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，手势理论上可以涉及 Android 设备显示器上的几乎任何触摸动作序列。由于这一事实，Android\
  \ SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其详细细节是本章的主题。\n\n### 29.1 Android\
  \ Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后这些手势存储在与 Android 应用程序包捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用作为\
  \ Android SDK 部分的示例包中自带的 `Gesture Builder` 应用程序。创建手势文件涉及启动 `Gesture Builder` 应用程序（在物理设备或模拟器上），并“画出”应用程序需要检测的手势。一旦设计好手势，包含手势数据的文件就可以从设备或模拟器的\
  \ SD 卡中提取出来，并添加到应用程序项目中。在应用程序代码中，该文件随后被加载到 `GestureLibrary` 类的实例中，可以在那里用它搜索用户在设备显示器上执行的任何手势的匹配项。\n\
  \n### 29.2 GestureOverlayView 类\n\n为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView`\
  \ 类。这是一个透明视图，可以放置在用户界面其他视图之上，唯一目的是检测手势。\n\n### 29.3 检测手势\n\n通过加载使用 `Gesture Builder`\
  \ 应用创建的手势文件，然后在 `GestureOverlayView` 类的实例上注册 `GesturePerformedListener` 事件监听器来检测手势。然后声明外围类同时实现\
  \ `OnGesturePerformedListener` 接口以及该接口所需的相应 `onGesturePerformed` 回调方法。如果监听器检测到手势，Android\
  \ 运行时系统将触发对 `onGesturePerformed` 回调方法的调用。\n\n### 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed`\
  \ 回调方法，并作为参数传递检测到手势的 `GestureOverlayView` 对象的引用，以及一个包含手势信息的 `Gesture` 对象。\n\n访问\
  \ `Gesture` 对象后，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中的手势进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测得分，报告用户执行的手势与手势文件条目匹配的概率。预测得分为 1.0 或更高通常认为文件中存储的手势与用户在设备显示器上执行的手势之间良好匹配。\n\
  \n### 29.5 安装和运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用允许捕和保存手势动作的应用程序。虽然 Google\
  \ 最初提供了一个此类用途的应用程序，但它在较新版本的 Android 上没有得到充分维护。幸运的是，可以通过 `Gesture Builder Tool` 应用程序获得替代方案，该程序可以通过\
  \ Google Play 商店获取：\n\nhttps://play.google.com/store/apps/details?id=migueldp.runeforge\n\
  \n### 29.6 创建手势文件\n\n一旦 `Gesture Builder Tool` 加载，点击设备屏幕底部的 `Create New Gesture`\
  \ 按钮，并如图 29-1 所示在灰色画布上使用圆形动作“画出”手势。假设手势显示正确（由设备屏幕上的黄线表示），点击 `save` 按钮将手势添加到手势文件中，在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，`Gesture Builder\
  \ Tool` 将显示当前定义的手势列表，此时它将仅包含新的 Circle Gesture。\n\n### 29.7 创建示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `CustomGestures` 并指定 `com.ebookfzy.customgestures` 为包名。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 26`: Android 8.0 (Oreo)，并将 `Language` 菜单设置为 `Java`。根据 11.8\
  \ 项目迁移到 View Binding 节中的步骤修改项目以使用 view binding。\n\n### 29.8 从 SD 卡提取手势文件\n\n由于手势是在\
  \ `Gesture Builder` 应用程序中创建的，它们被添加到运行应用程序的模拟器或设备存储中名为 `gesture.txt` 的文件中。然而，在将此文件添加到\
  \ Android Studio 项目之前，必须先将其从设备存储提取并保存到本地文件系统。最简单的方法是使用 Android Studio `Device File\
  \ Explorer` 工具窗口。使用 `View -> Tool Windows -> Device File Explorer` 菜单显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 选项并将文件保存到临时位置，命名为 `gestures`。\n\n![](img/as_gesture_file_in_explorer.jpg)\n\
  \n图 29-2\n\n一旦手势文件创建并从设备存储中提取，就可以作为资源文件添加到 Android Studio 项目中。\n\n## 29.9 将手势文件添加到项目\n\
  \n\n\n\n\n在 Android Studio Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），并在弹出的菜单中选择\
  \ `New -> Directory`。在 `New Directory` 对话框中，输入 `raw` 作为文件夹名称并按下键盘上的回车键。使用适用于你类型操作系统的相应文件管理器工具，找到之前从设备存储中提取出的手势文件，并将其复制并粘贴到\
  \ Project 工具窗口中新建的 `raw` 文件夹中。\n\n## 29.10 设计用户界面\n\n此示例应用需要一个用户界面，该界面包含一个 `ConstraintLayout`\
  \ 视图，在其上方叠加一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它将其加载到 Layout Editor 工具中，并选择并删除默认的 `TextView` 控件。\n\n切换到布局编辑器的 Code 模式并修改\
  \ XML，使其内容如下如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 29.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码以便在活动启动时加载该文件。为了本项目，，实现此目的的代码将添加到位于\
  \ `MainActivity.java` 源文件的 `MainActivity` 类中，如下所示：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \nimport android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ = GestureLibraries.fromRawResource(this,\n                R.raw.gestures);\n \
  \       if (!gLibrary.load()) {\n            finish();\n        }\n    }\n}\n```\n\
  \n除了必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary` 实例，并将 raw 资源文件夹中的手势文件内容加载其中。活动类也修改为实现\
  \ `OnGesturePerformedListener` 接口，这要求实现 `onGesturePerformed` 回调方法（该方法将在章的后续章节中创建）。\n\
  \n## 29.12 注册事件监听器\n\n为了让活动接收到用户在屏幕上执行手势的通知，必须在 `gLayout` 视图上注册 `OnGesturePerformedListener`\
  \ 事件监听器，可以使用下面的代码所示使用 `findViewById` 方法获取其引用：\n\n```java\nprivate void gestureSetup()\
  \ {\n    gLibrary = GestureLibraries.fromRawResource(this,\n            R.raw.gestures);\n\
  \    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView gOverlay\
  \ = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformed(this);\n}\n\
  ```\n\n## 29.13 实现 onGesturePerformed 方法\n\n在首次运行应用程序之前，剩下的工作就是实现 `onGesturePerformed`\
  \ 方法。当在 `GestureOverlayView` 实例上执行手势时，将调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \nimport android.gesture.Prediction;\nimport android.widget.Toast;\nimport android.gesture.Gesture;\n\
  import java.util.ArrayList;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements OnGesturePerformedListener {\n    private GestureLibrary gLibrary;\n\
  \n    public void onGesturePerformed(GestureOverlayView overlay, Gesture gesture)\
  \ {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n}\n```\n\n当 Android 运行时检测到手势叠加对象上的手势时，就会调用\
  \ `onGesturePerformed` 方法。传递的参数是检测到手势的 `GestureOverlayView` 对象引用以及一个 `Gesture` 类型的对象。`Gesture`\
  \ 类用于持有定义特定手势的信息（基本上是描述路径的点）。\n\n## 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行，并在屏幕上执行圆形手势。执行后，应该会出现包含检测到的手势名称的\
  \ toast 通知。注意，当手势被识别时，会在屏幕上用亮黄色线条勾勒，而叠加层不确定的手势显示为淡黄色线条。这在开发期间很有用，但对于实际应用可能并不理想。因此，显然还有一些配置工作要做。\n\
  \n## 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色。用于绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n\n\n\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们是在 `ConstraintLayout` 视图的白色背景上以白色绘制的）。\n\
  \n### 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明覆盖层，可以放置在其他视图之上。这引出了问题：当识别出手势时，手势覆盖层拦截的事件是否传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性来控制。当设置为 `true`\
  \ 时，当识别出手势时，手势事件不会传递给底层视图。当在可能配置为响应特定手势而滚动的视图上执行手势时，此设置特别有用。将此属性设置为 `true` 可以避免手势同时被解释为让底层视图向特定方向滚动的指令。\n\
  \n### 检测缩放手势\n\n在讨论通用触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节概述的步骤来创建并检测各种手势，但实际上，使用目前为止讨论的技术无法检测缩放手势（即使用手指进行拉伸和收缩动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势的最简单方法是使用 Android 的 `ScaleGestureDetector` 类。通常情况下，检测缩放手势涉及以下三个步骤：\n\n1.\
  \ 声明一个实现 `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 在封装的 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分中，我们将创建一个示例来演示缩放手势识别的实现。\n\n### 缩放手势示例项目\n\n从欢迎屏幕选择 `New Project`\
  \ 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `PinchExample`\
  \ 并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置更改为\
  \ `API 26: Android 8.0 (Oreo)`并将语言菜单更改为 `Java`。按照 11.8 Migrating a Project to View\
  \ Binding 中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView`\
  \ 对象并使用 Attributes 属性窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android\
  \ Studio 编辑器并按如下修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\nimport\
  \ android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ =\n                new ScaleGestureDetector(this,\n                        new\
  \ MyOnScaleGestureListener());\n    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent\
  \ event) {\n        scaleGestureDetector.onTouchEvent(event);\n        return true;\n\
  \    }\n\n    public class MyOnScaleGestureListener extends SimpleOnScaleGestureListener\
  \ {\n\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n\n\n\n`Fragment` 是应用程序用户界面及其相应行为的自包含、模块化部分，可以嵌入到\
  \ activity（活动）中。Fragments 可以在应用程序设计阶段被组合以创建一个 activity，并在应用程序运行时添加到或从 activity 中移除，从而创建一个随动态变化的用户界面。\n\
  \nFragments 仅可以作为 activity 的一部分使用，不能被实例化为独立的应用程序元素。尽管如此，fragment 可以被认为是一个功能性的“子活动”，其生命周期与完整的\
  \ activity 类似。\n\nFragments 以 XML 布局文件的形式存储，可以通过以下两种方式添加到 activity 中：在 activity\
  \ 的布局文件中放置适当 `<fragment>` 元素，或者直接通过 activity 类实现中的代码进行添加。\n\n## 30.2 创建 Fragment\n\
  \n构成 fragment 的两个组件是 XML 布局文件和对应的 Java 类。fragment 的 XML 布局文件采用与任何其他 activity 布局相同的格式，并且可以包含布局管理器和视图的任何组合和复杂性。例如，下面的\
  \ XML 布局用于一个由具有红色背景的 `ConstraintLayout` 组成的 fragment，其中包含一个白色前景的 `TextView`：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment 布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n    \
  \           ViewGroup container,\n               Bundle savedInstanceState) {\n\
  \        // 此 fragment 的布局\n        binding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()`\
  \ 方法外，该类还可以重写标准的生命周期方法。一旦 fragment 布局和类创建完成，fragment 就可以在应用程序 activity 中使用。\n\n\
  ## 30.3 使用布局 XML 文件将 Fragment 添加到 Activity\n\n可以通过编写 Java 代码或将 fragment 嵌入 activity\
  \ 的 XML 布局文件将其纳入 activity 中。无论使用哪种方法，需要注意的关键点是，当使用支持库以兼容旧版本的 Android 发布时，任何使用 fragment\
  \ 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\n\
  package com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.view.Menu;\n\npublic class MainActivity extends FragmentActivity\
  \ {\n// ...\n}\n```\n\nFragments 使用 `FragmentContainerView` 类被嵌入到 activity 布局文件中。下面的示例布局嵌入了上一节中创建的\
  \ fragment：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/fragment2\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        android:name=\"com.example.myfragmentdemo.FragmentOne\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n`<fragment>`\
  \ 元素中的关键属性是 `android:name`（必须引用与 fragment 关联的类）和 `tools:layout`（必须引用包含布局的 XML 文件）。一旦添加到\
  \ activity 的布局，就可以在 Android Studio 编辑器中查看和操作 fragments。\n\n## 30.4 在代码中添加和管理 Fragments\n\
  \n通过 activity 布局文件向 activity 添加 fragment 虽然方便，但代价是 activity 无法在运行时移除 fragment。为了实现运行时对\
  \ fragments 的完全动态控制，这些 activity 必须通过代码添加。这样做的好处是可以在应用程序运行时添加、移除甚至替换其他 fragment。\n\
  \n当使用代码管理 fragments 时，fragment 本身仍然由 XML 布局文件和相应的类组成。区别在于在 activity 中操作 fragment。使用代码向\
  \ activity 添加 fragment 有一套标准的步骤序列：\n\n1. 创建 fragment 类的实例。\n2. 将任何额外的 intent 参数传递给类实例。\n\
  3. 获取 fragment 器的实例引用。\n4. 在 fragment 器实例上调用 `beginTransaction()` 方法。这将返回一个 `FragmentTransaction`\
  \ 实例。\n5. 调用 fragment 事务实例的 `add()` 方法，将包含 fragment 的视图资源 ID 和 fragment 类实例作为参数传递。\n\
  6. 调用 fragment 事务的 `commit()` 方法。\n\n例如，下面的代码添加了由 `FragmentOne` 类定义的 fragment，使其显示在\
  \ ID 为 `LinearLayout1` 的容器中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\n\
  firstFragment.setArguments(getIntent().getExtras());\nFragmentManager fragManager\
  \ = getSupportFragmentManager();\nFragmentTransaction transaction = fragManager.beginTransaction();\n\
  transaction.add(R.id.LinearLayout1, firstFragment);\ntransaction.commit();\n```\n\
  \n上述代码为了清晰起见，将每个步骤分成了独立的语句。然而，最后四行可以缩减为一行代码如下：\n\n```java\ngetSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n\n\n\n一旦将 fragment 添加到容器中，后续可以通过调用片段事务实例的 `remove()`\
  \ 方法来移除，该方法需要传递要移除的 fragment 实例的引用：\n\n```\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用片段事务实例的 `replace()` 方法将一个 fragment 替换为另一个。该方法的参数是包含该 fragment 的视图\
  \ ID 以及一个新 fragment 的实例。被替换的 fragment 也可以被置于所谓的“回退栈”（back stack）中，这样当用户返回时，可以快速恢复它。这通过在调用\
  \ `commit()` 方法之前，调用片段事务对象的 `addToBackStack()` 方法来实现：\n\n```java\nFragmentTwo secondFragment\
  \ = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n# 30.5 处理 Fragment\
  \ 事件\n\n正如之前讨论的，fragment 非常像一个子 activity，它有自己的自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本视图）能够像普通\
  \ activity 一样产生事件。这产生了一个问题：哪一个类接收来自 fragment 中视图的事件；是 fragment 本身，还是嵌入该 fragment\
  \ 的 activity？这个问题的答案取决于事件处理器是如何声明的。\n\n在标题为 \"Android 事件处理概述与示例\" 的章节中，讨论了两种处理事件的方法。第一种方法涉及在\
  \ activity 代码中配置事件监听器和回调方法。例如：\n\n```java\nbinding.button.setOnClickListener(\n\
  \    new Button.OnClickListener() {\n        public void onClick(View v) {\n   \
  \         // 当按钮被点击时\n            // 要执行的代码\n        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nfragment\
  \ 中视图生成的事件的通用规则是：如果是在 fragment 类中通过事件监听器和回调方法的方法声明了事件监听器，那么该事件将由 fragment 首先处理。然而，如果使用了\
  \ `android:onClick` 资源，事件将直接传递给包含 fragment 的 activity。\n\n# 30.6 实现 Fragment 通信\n\
  \n一旦一个或多个 fragment 被嵌入 activity 中，很可能需要在 fragment 与 activity 之间、以及两个 fragment 之间进行某种形式的通信。事实上，良好的实践要求\
  \ fragment 之间不要直接相互通信。所有通信都应该通过封装它们的 activity 进行。\n\n为了让 activity 与 fragment 通信，activity\
  \ 必须通过分配的 ID 标识 fragment 对象。一旦获取了引用，activity 就可以直接调用 fragment 对象的公共方法。\n\n反向通信（从\
  \ fragment 到 activity）稍微复杂一些。首先，fragment 必须定义一个监听接口，然后在 activity 类中实现该接口。例如，以下代码在名为\
  \ `ToolbarFragment` 的 fragment 类上声明了一个名为 `ToolbarListener` 的接口。代码还声明了一个变量，稍后存储对\
  \ activity 的引用：\n\n```java\npublic class ToolbarFragment extends Fragment {\n  \
  \  ToolbarListener activityCallback;\n    public interface ToolbarListener {\n \
  \       public void onButtonClick(int position, String text);\n    }\n.\n.\n}\n\
  ```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现一个名为 `onButtonClick` 的回调方法，该方法接受一个整数和一个\
  \ `String` 作为参数。\n\n接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity\
  \ 关联时，Android 系统会自动调用此方法。该方法被传递了包含该 fragment 的 activity 的引用。该方法必须存储该 activity 的本地引用，并验证它是否实现了\
  \ `ToolbarListener` 接口：\n\n```java\n@Override\npublic void onAttach(Context context)\
  \ {\n    super.onAttach(context);\n    try {\n        activityCallback = (ToolbarListener)\
  \ activity;\n    } catch (ClassCastException e) {\n        throw new ClassCastException(activity\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n（注：原文在 `onAttach` 块中存在一些混乱的逻辑；我在保持按照标准工程实践检查转换的语义意图的同时，清理了结构）。\n\
  \n下一步是从 fragment 内部调用 activity 的回调方法。这种情况何时以及如何发生完全取决于情况。例如，以下代码调用了回调：\n\n```java\n\
  activityCallback.onButtonClick(position, text);\n```\n\n剩下的就是修改 activity 类以使其实现\
  \ `ToolbarListener`。例如：\n\n```java\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n    public void onButtonClick(String\
  \ text, int position) {\n        // 实现回调方法的代码\n    }\n}\n```\n\n# 30.7 总结\n\nFragments\
  \ 为创建可重用的用户界面布局和行为模块提供了一种强大的机制。可以通过将 fragment 添加到 activity 的布局文件中，或者通过编写代码在运行时管理\
  \ fragment，来利用 fragment。在代码中添加到 activity 的 fragment 可以在运行时动态移除和替换。fragment 之间的所有通信都应该通过嵌入它们的\
  \ activity 进行。\n\n# 31. 在 Android Studio 中使用 Fragments - 示例\n\n在上一章节探讨了 fragment\
  \ 的整体理论后，本章的目标是使用 Android Studio 创建一个示例 Android 应用程序，演示创建和使用 fragment 的实际步骤，以及在\
  \ activity 中实现 fragment 之间的通信。\n\n## 31.1 关于示例 Fragment 应用\n\n\n\n\n在本章创建的应用程序将包含一个\
  \ Activity 和两个片段（Fragment）。第一个片段的用户界面将包含一个工具栏，由一个 `EditText` 视图、一个 `SeekBar` 和一个\
  \ `Button` 组成，它们包含在一个 `ConstraintLayout` 视图中。第二个片段将仅包含一个 `TextView` 对象，同样包含在一个 `ConstraintLayout`\
  \ 视图中。\n\n这两个片段将嵌入到应用程序的主 Activity 中，并实现通信机制：当点击第一个片段中的按钮时，输入到 `EditText` 视图中的文本将显示在第二个片段的\
  \ `TextView` 上，其字体大小由第一个片段中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在在较版本的 Android 上运行，因此还有必要使用相应的\
  \ Android 支持库。\n\n## 31.2 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段输入 `FragmentExample`，并指定\
  \ `com.ebookfrenzy.fragmentexample` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。按照节 11.8\
  \ 迁移项目到 View Binding 中列出的步骤修改项目以使用 view binding。\n\n返回 `Gradle Scripts -> build.gradle\
  \ (Module: FragmentExample.app)` 文件，并在 dependencies 部分添加以下指令（请注意，现在可能有更新版本的库）：\n\
  \n```gradle\nimplementation 'androidx.navigation:navigation-fragment:2.4.0'\n```\n\
  \n# 31.3 创建第一个片段布局\n\n下一步是为将在 Activity 中使用的第一个片段创建用户界面。\n\n该用户界面将由一个 XML 布局文件和一个片段类组成。虽然可以手动添加，但让\
  \ Android Studio 为我们创建会更快。在项目工具窗口中，找到 `app -> java -> com -> ebookfrenzy -> fragmentexample`\
  \ 条目并对其右键点击。在弹出的菜单中，选择 `New -> Fragment -> Gallery...` 选项，显示下方所示 图 31-1  中的对话框：\n\
  \n![](img/as_4.2_fragment_gallery.jpg)\n\n图 31-1\n\n在点击 `Next` 按钮之前选择 `Fragment\
  \ (Blank)` 模板。在后续屏幕上，将片段命名为 `ToolbarFragment`，布局文件命名为 `fragment_toolbar`：\n\n![](img/as_4.2_new_fragment_java.jpg)\n\
  \n图 31-2\n\n使用 Design 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器中，右键点击组件树（Component Tree）面板中的\
  \ `FrameLayout` 条目，选择 `Convert FrameLayout to ConstraintLayout` 菜单选项，接受确认对话框中的默认设置。将\
  \ `id` 从 `frameLayout` 改为 `constraintLayout`。选择并删除默认的 `TextView`，向布局添加一个 `Plain\
  \ EditText`、`Seekbar` 和 `Button`，并将视图 ID 分别更改为 `editText1`、`button1` 和 `seekBar1`。\n\
  \n将按钮上的文本改为“Change Text”，将文本提取到名为 `change_text` 的字符串资源中，并移除 `EditText` 视图中的 `Name`\
  \ 文本。最后，将 `Seekbar` 的 `layout_width` 属性设置为 `match_constraint`，并将左右边缘的边距设置为 `16dp`。\n\
  \n使用 Infer constraints（推断约束）工具栏按钮添加任何缺失的约束，此时布局应与 图 31-3 所示：\n\n![](img/as_4.1_toolbar_fragment_ui.jpg)\n\
  \n图 31-3\n\n# 31.4 将片段迁移到 View Binding\n\n与 `Empty Activity` 模板一样，当向项目添加新片段时，Android\
  \ Studio 不会启用 view binding 支持。因此，在继续本教程的下一步之前，我们需要执行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件，并按如下所示导入片段的绑定类：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（这包括添加 `onDestroyView()` 方法以确保在片段销毁时移除绑定引用）：\n\
  \n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // 加载此片段的布局\n    return inflater.inflate(R.layout.fragment_toolbar, container,\
  \ false);\n    binding = FragmentToolbarBinding.inflate(inflater, container, false);\n\
  \    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView() {\n\
  \    super.onDestroyView();\n    binding = null;\n}\n```\n\n一旦完成这些更改，片段即可开始使用 view\
  \ binding。\n\n## 31.5 添加第二个片段\n\n重复创建工具栏片段的步骤，添加另一个名为 `TextFragment` 的空片段，布局文件命名为\
  \ `fragment_text`。再次将 `FrameLayout` 容器转换为 `ConstraintLayout`（将 `id` 改为 `constraintLayout2`）并移除默认的\
  \ `TextView`。\n\n从调色板拖入 `TextView` 小部件并将其放在布局中心，使用约束按钮添加任何约束。将 `TextView` 的 `id`\
  \ 改为 `textView2`，文本改为“Fragment Two”，并将 `textAppearance` 属性修改为 `Large`。\n\n完成后，布局应与\
  \ 图 31-4 所示：\n\n![](img/as_4.0_fragment_text_layout.jpg)\n\n图 31-4\n\n重复上一节中的步骤，将\
  \ `TextFragment` 类迁移以使用 view binding：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentTextBinding;\n\
  \nprivate FragmentToolbarBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // 加载此片段的布局\n    return inflater.inflate(R.layout.fragment_text, container,\
  \ false);\n    binding = FragmentTextBinding.inflate(inflater, container, false);\n\
  \    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView() {\n\
  \    super.onDestroyView();\n    binding = null;\n}\n```\n\n# 31.6 将片段添加到 Activity\n\
  \n应用程序的主 Activity 关联了一个名为 `activity_main.xml` 的 XML 布局文件。在本例中，片段将使用此文件中的 `<fragment>`\
  \ 元素添加到 Activity 中。使用项目工具窗口，导航到 `FragmentExample` 项目的 `app -> res -> layout` 部分，并双击\
  \ `activity_main.xml` 文件将其加载到 Android Studio 布局编辑器中。\n\n在 Design 模式下，选择并删除布局中的默认\
  \ `TextView` 对象，并选择调色板中的 `Common` 类别。从视图列表中拖入 `FragmentContainerView` 组件并将其释放到布局上，使其水平居中并放置在虚线出现在顶部边距的位置：\n\
  \n![](img/as_3.5_fragment_example_add_fragment.jpg)\n\n图 31-5\n\n将片段释放到布局后，将弹出对话框，显示当前项目中可用的片段，如\
  \ 图 31-6 所示：\n\n![](img/as_4.1_fragment_list.jpg)\n\n图 31-6\n\n\n\n\n从列表中选择 `ToolbarFragment`\
  \ 条目并点击 OK 按钮关闭 Fragments 对话框。添加后，点击布局编辑器右上角的红色警告按钮以显示警告面板。列表中将列出一条“unknown fragments”消息，表示布局编辑器工具需要知道在预览期间应该显示哪个\
  \ fragment。如图 31-7 所示，点击错误消息中的 `[Pick Layout...]` 链接：\n\n![](img/as_unkown_fragment.jpg)\n\
  \n图 31-7\n\n在弹出的对话框（图 31-8）中，选择 `fragment_toolbar` 条目，并在点击 OK 按钮之前执行：\n\n![](img/as_select_fragment.jpg)\n\
  \n图 31-8\n\n选中 fragment 后，将 `layout_width` 属性更改为 `match_constraint`，使其占据整个屏幕宽度。从调色板中点击并拖动另一个\
  \ `FragmentContainerView` 条目，并使其水平居中并位于第一个 fragment 底部下方。当出现提示时，从 fragment 对话框中选择\
  \ `TextFragment` 条目，然后点击 OK 按钮。再次显示错误面板并点击 `Use @layout/fragment_text` 选项。使用 `Infer\
  \ constraints` 按钮建立任何缺失的布局约束。\n\n注意，fragment 现在已显示在布局中，如图 31-9 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\
  \n图 31-9\n\n在继续下一步之前，在布局中选择 `TextFragment` 实例，并在属性（Attributes）工具窗口中将 fragment 的\
  \ ID 更改为 `text_fragment`。\n\n### 31.7 让 Toolbar Fragment 与 Activity 通信\n\n当用户触摸\
  \ toolbar fragment 中的按钮时，该 fragment 类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送给文本\
  \ fragment。正如“Android Fragments 简介”中概述，fragment 之间不应直接通信，而应该使用嵌入它们的 activity 作为中间媒介。\n\
  \n此过程的第一步是确保 toolbar fragment 响应按钮点击。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本示例，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并进行修改，使其如下列表所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\nimport android.content.Context;\n\nimport android.widget.SeekBar;\n\n\
  public class ToolbarFragment extends Fragment implements\nSeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n.\n\n.\n\n@Override\n    public\
  \ void onViewCreated(@NonNull View view,\n             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        binding.seekBar1.setOnSeekBarChangeListener(this);\n\
  \        binding.button1.setOnClickListener(new View.OnClickListener() {\n     \
  \       public void onClick(View v) {\n                buttonClicked(v);\n     \
  \       }\n        });\n    }\n    public void buttonClicked (View view) {\n   \
  \ }\n    @Override\n    public void onProgressChanged(SeekBar seekBar, int progress,\n\
  \             boolean fromUser) {\n        seekvalue = progress;\n    }\n    @Override\n\
  \    public void onStartTouch(SeekBar arg0) {\n    }\n    @Override\n    public\
  \ void onStopTouch(SeekBar arg0) {\n    }\n}```\n\n在继续之前，我们需要花些时间解释上述代码。首先，该类被声明为实现了\
  \ `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个 `SeekBar` 实例，fragment 需要在用户滑动滑条更改字体大小时接收通知。实现\
  \ `OnSeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTouch()` 和 `onStopTouch()`\
  \ 方法。这些方法已经实现，但实际上仅需要 `onProgressChanged()` 方法来执行任务，在本例中，是将新值存储在类开头声明的名为 `seekvalue`\
  \ 的变量中。此外，还声明了一个变量，用于存储对 `EditText` 对象的引用。\n\n添加 `onViewCreated()` 方法是为了在按钮上设置 `OnClickListener`，它被配置为在检测到点击事件时调用名为\
  \ `buttonClicked()` 的方法。该方法也已实现，尽管此时它什么都不做。\n\n此过程的下一阶段是设置监听器，允许 fragment 在按钮被点击时调用\
  \ activity。这遵循了上一章概述的机制：\n\n```java\npublic class ToolbarFragment extends Fragment\n\
  \    implements SeekBar.OnSeekBarChangeListener {\n    private static int seekvalue\
  \ = 10;\n ToolbarListener activityCallback;\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n    @Override\n\
  \    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\n\
  \                + \" must implement ToolbarListener\");\n        }\n    }\n}\n\
  .\n\n.\n    public void buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\n\
  \            binding.editText1.getText().toString());\n    }\n}\n```\n\n上述实现将导致在用户点击按钮时调用属于\
  \ activity 的 `onButtonClick()` 方法。因此，剩下的工作是声明 activity 类实现了 `ToolbarListener` 并实现\
  \ `onButtonClick()` 方法。\n\n由于在较旧 Android 版本中使用 Android 支持库来支持 fragment，activity\
  \ 还需要更改为自 `FragmentActivity` 而不是 `AppCompatActivity`。将这些要求结合起来得到了 `MainActivity.java`\
  \ 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport androidx.fragment.app.FragmentActivity;\n\nimport android.os.Bundle;\n\n\
  public class MainActivity extends FragmentActivity implements ToolbarListener {\n\
  \n.\n\n.\n    public void onButtonClick(int fontsize, String text) {\n}\n}\n```\n\
  \n### 31.8 让 Activity 与 Text Fragment 通信\n\n正如“Android Fragments 简介”概述，activity\
  \ 可以获取 fragment 类实例的引用并调用其公共方法与 fragment 通信。因此，我们现在将在 `TextFragment` 类中实现一个名为 `changeTextProperties()`\
  \ 的公共方法，它接收一个字体大小整数和一个新文本的字符串作为参数。该方法将使用这些值来修改 `TextView` 对象。在 Android Studio 编辑面板中，找到并修改\
  \ `TextFragment.java` 文件以添加此新方法：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n```\n\n\n\n\n\n```java\npublic class TextFragment extends Fragment {\n\
  \n    public void changeTextProperties(int fontsize, String text)\n    {\n     \
  \   binding.textView2.setTextSize(fontsize);\n        binding.textView2.setText(text);\n\
  \    }\n}\n```\n\n当 `TextFragment` 片被放置在 activity 的布局中时，它被赋予了一个名为 `text_fragment`\
  \ 的 ID。通过这个 ID，activity 现在可以获取片段实例的引用，并在对象上调用 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并按照如下所示修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment =\n    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n## 31.9 测试应用程序\n\
  \n现在该项目的编码工作已经完成，最后的任务是运行应用程序。当应用程序启动时，主 activity 将启动，并相应创建并显示两个片段。当用户触摸工具栏片段中的按钮时，activity\
  \ 的 `onButtonClick()` 方法将由工具栏片段调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。随后，activity\
  \ 将调用第二个片段的 `changeTextProperties()` 方法，修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n## 31.10 总结\n\n本章的目标是创建一个示例项目，该项目专门用于演示在 Android 应用程序中使用片段的步骤。涵盖的主题包括：使用\
  \ Android Support Library 以兼容在引入片段之前的 Android 版本，在 activity 布局中包含片段，以及片段间通信的实现。\n\
  \n## 32 使用带有 Jetpack 的现代 Android 应用架构\n\n直到最近，Google 并没有建议构建 Android 应用程序的特定方法，而是提供工具和开发包，让开发者自行决定哪种方法最适合特定的项目或个人编程风格。这种情况在\
  \ 2017 年随着 Android Architecture Components 的引入而发生了改变，这些组件在 2018 年发布时成为了 Android\
  \ Jetpack 的一部分。\n\n本章目的是提供 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节中进行详细介绍，并通过实际示例进行演示。\n\
  \n### 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android Architecture\
  \ Components 和 Android Support Library 以及同一组建议如何构建 Android 应用程序的指南组成。Android Architecture\
  \ Components 的设计目的是为了让在开发 Android 应用程序时执行常用任务变得更快、更简单，同时也符合架构指南的核心原则。\n\n虽然本书书将涵盖所有的\
  \ Android Architecture Components，但本章的目标是介绍关键的架构指南以及 `ViewModel`、`LiveData`、`Lifecycle`\
  \ 组件，同时介绍数据绑定（Data Binding）和存储库（Repositories）的使用。\n\n在继续之前，理解 Jetpack 的应用开发方法并非强制性的，这一点很重要。尽管我们强调了一些多年来流行的其他技巧的缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 似乎采取了这样的立场：虽然开发应用程序没有对错之分，但有一种被推荐的方法。\n\n## 32.2\
  \ “旧”架构\n\n在标题为 在 Android Studio 中创建 Android 示例应用程序 的章节中，创建了一个 Android 项目，该项目由单个\
  \ activity 组成，包含了所有显示和管理用户界面的代码，以及应用程序的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，应用程序由多个\
  \ activity（应用中的每个屏幕各对应一个）组成，每个 activity 类在某种程度上都混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用程序生命周期相关的问题（例如，用户每次旋转设备时\
  \ activity 都会被销毁并重建，导致未保存到某种持久化存储的应用程序数据丢失），以及诸如导航效率低下等问题（为用户访问的每个应用屏幕启动一个新的 activity）。\n\
  \n### 32.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单 activity 应用程序，其中不同的屏幕作为内容加载到同一个\
  \ activity 中。\n\n现代架构指南还建议将应用程序中不同职责区域划分到完全独立的模块中（Google 将此概念称为“关注点分离”）。这种方法的关键之一是\
  \ `ViewModel` 组件。\n\n### 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用程序与用户界面相关的数据模型和逻辑，与负责实际显示、管理用户界面以及与操作系统交互的代码离开来。这样设计后，应用程序将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n实际上，`ViewModel` 只感知数据模型和相应的逻辑。它对用户界面无所知，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供。同样，当用户在用户界面的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责的分离解决了与 UI 控制器周期相关的问题。无论 UI 控制器在应用程序生命周期内被重建多少次，`ViewModel` 实例都会保留在内存中，从而保持数据一致性。例如，activity\
  \ 使用的 `ViewModel` 将保留在内存中，直到 activity 完全结束（在单 activity 应用程序中，这意味着应用程序退出）。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n## 32.5 LiveData 组件\n\n考虑一个显示实时数据（如股票当前价格）的应用程序。应用程序可能会使用某种形式的股票价格网络服务持续更新\
  \ `ViewModel` 中的数据模型以最新信息。显然，如果这些实时数据不能及时显示给用户，其作用就很小。UI 控制器确保在用户界面中显示最新数据的方法有两种。一种方案是控制器持续检查\
  \ `ViewModel` 以判断数据自上次显示以来是否发生了变化。然而，这种方法的问题在于效率低下。为了维持数据馈送的实时性，UI 控制器必须在循环中运行，持续检查数据变化。\n\
  \n更好的解决方案是在 `ViewModel` 中的特定数据项发生变化时，UI 控制器接收通知。这是通过使用 `LiveData` 组件实现的。`LiveData`\
  \ 是一个数据持有者，允许值变为可观察的。简单来说，可观察对象具有在其数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel` 内数据匹配的问题。\n\
  \n\n\n\n这意味着，例如，一个对 `ViewModel` 值感兴趣的 UI 控制器可以设置观察者，当该值更改时，观察者将收到通知。在我们假设的应用程序中，例如，股价将被封装在\
  \ `ViewModel` 中的一个 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。当该方法由数据变化触发时，将从\
  \ `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 32-2\n\n\
  `LiveData` 实例也可以被声明为可变的，允许观察者实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个值，该值需要覆盖存储在\
  \ `ViewModel` 中的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity 包含一个\
  \ `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 生命周期周期状态的变化并做出相应响应。如果 activity 暂停（可能是应用被置于后台），`LiveData`\
  \ 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便\
  \ activity 拥有最新的值。同样，`LiveData` 实例将知道 activity 被销毁并移除观察者以释放资源。\n\n到此为止，我们只讨论了 UI\
  \ 控制器使用观察者的情况。在实践中，观察者可以用于任何符合 Jetpack 生命周期管理方法的对象中。\n\n### 32.6 ViewModel 存档状态\n\
  \nAndroid 允许用户将运行中的应用置于后台，并在在设备上执行其他任务（包括运行其他应用）后再次返回。当设备资源不足时，操作系统将通过终止后台应用进程来纠正这一问题，从最久未使用的应用开始。然而，当用户返回到已终止的后台应用时，无论它是否被终止，它都应该显示为与被置于后台时相同的状态。在与\
  \ `ViewModel` 关联的数据方面，可以通过利用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在系统发起的进程终止时恢复，该主题将在本章节后续标题为\
  \ “Android ViewModel 存档状态教程” 中介绍。\n\n### 32.7 LiveData 和数据绑定\n\nAndroid Jetpack\
  \ 包含了 `Data Binding Library`，它允许 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并编写设置和获取文本属性的代码以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值直接在 XML 布局文件中被引用，避免了编写代码来保持布局视图更新的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据将从标题为 “Android Jetpack 数据绑定概述” 的章节开始进行更详细的介绍。\n\n## 32.8 Android 生命周期\n\
  \n从 Android 组件创建到其被销毁之间的时间被称为生命周期。在生命周期期间，组件将在不同的生命周期状态之间切换，这通常是在操作系统的控制下并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并从该状态循环通过包括创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android Framework 类和组件允许其他对象访问它们的当前状态。生命周期观察者也可以被使用，以便对象在另一个对象的生命周期状态变化时接收通知。这是\
  \ `ViewModel` 组件在背后使用的技术，用于识别观察者何时已重启或被销毁。此功能不仅限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的一组生命周期的类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为 `lifecycle-aware`（生命周期感知的），而提供其生命周期状态访问的对象被称为 `lifecycle-owners`（生命周期所有者）。生命周期将在标题为\
  \ “使用 Android 生命周期感知组件” 的章节中进行更详细的介绍。\n\n### 32.9 存储库模块\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些源的代码与\
  \ `ViewModel` 分离开是非常重要的。否则，这样做将违反关注点分离原则。为了避免将此功能与 `ViewModel` 混合，Google 的架构指南建议将此代码放在单独的\
  \ Repository（存储库）模块中。\n\nRepository 不是一个 Android 组件，而是由应用开发者创建的 Java 类，负责与各种数据源建立接口。该类随后为\
  \ `ViewModel` 提供一个接口，允许该数据存储在模型中。\n\n![](img/Jetpack_diagram_4.jpg)\n\n图 32-4\n\n\
  ### 32.10 总结\n\n直到最近，Google 倾向于不推荐任何特定的应用结构方法。随着 Jetpack 的引入，情况现在发生了变化，Jetpack 由一套工具、组件、库和架构指南组成。Google\
  \ 现在建议将应用项目划分为若干单独的模块，每个模块负责一个特定的功能区域，即所谓的“关注点分离”。\n\n特别是，指南建议将应用的视图数据模型与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集代码应该构建在独立的\
  \ 模块中，而不是与 ViewModel 绑定。\n\nAndroid Jetpack 包含了 Android 架构组件，这些组件专门设计用于以便更容易开发符合建议指南的应用。本章介绍了\
  \ `ViewModel`、`LiveData` 和生命周期组件。这些内容将从下一章开始进行更详细的介绍。书中未提到的其他架构组件将在书中后半部分介绍。\n\n\
  # 33 Android Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念并概述了现代 Android\
  \ 应用架构的基础。Jetpack 本质上定义了一 set 建议，描述了 Android 应用项目应该如何构建，同时提供了一套库和组件，使其更容易符合这些指南，目标是用更少的代码和更少的错误开发可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步引导你创建一个使用 `ViewModel` 组件的示例应用项目。该示例将在下一章通过引入 `LiveData`\
  \ 和数据绑定支持来进一步增强。\n\n## 33.1 关于项目\n\n\n\n\n\n在标题为在 Android Studio 中创建一个 Android 示例的章节中，创建了一个名为\
  \ `AndroidSample` 的项目，该应用的所有代码都被封装在主 `Activity` 类文件中。在随后的章节中，我们创建了一个 AVD 模拟器并用它运行了应用。在应用运行时，我们亲身经历了以这种方式开发应用时会发生的问题：当设备旋转时，`TextView`\
  \ 小部件显示的数据会丢失。\n\n本章将实现相同的货币转换器应用，但这次将使用 `ViewModel` 组件并遵循 Google 应用架构指南，以避免 `Activity`\
  \ 生命周期带来的复杂性问题。\n\n# ## 33.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如果有必要，使用\
  \ `File -> Close Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n在创建 `AndroidSample` 项目时，选择了\
  \ `Empty Activity` 模板作为项目的基础。然而，对于此项目，将使用 `Fragment + ViewModel` 模板。这将生成一个结构符合架构指南的\
  \ Android Studio 项目。\n\n从欢迎界面选择 `New Project`选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Fragment\
  \ + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo` 并指定 `com.ebookfrenzy.viewmodeldemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。编辑 `build.gradle (Module: ViewModelDemo.app)` 文件，启用 `view\
  \ binding` 并点击编辑器面板顶部的 `Sync Now` 链接：\n\n```\nandroid {\n    buildFeatures {\n \
  \       viewBinding true\n    }\n}\n```\n\n# ## 33.3 审查项目\n\n当使用 `Fragment + ViewModel`\
  \ 模板创建项目时，其结构在许多方面与创建 `AndroidSample` 项目时使用的 `Empty Activity` 有不同。该项目的关键组件如下：\n\n\
  ### ### 33.3.1 主 Activity\n\n首先需要注意的是，主 activity 的用户界面已经过结构化处理，允许单个 activity 作为容器，用于最终完成应用最终所需的所有屏幕。activity\
  \ 的主用户界面布局位于 `app -> res -> layout -> main_activity.xml` 文件中，并以 `FrameLayout` 的形式提供空容器空间（在图\
  \ 33-1 中突出），屏幕内容将出现在其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n### ### 33.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，它将在运行时由应用启动时显示的第一个屏幕的内容替换。该内容通常以\
  \ `Fragment` 的形式存在，由一个 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 为此目的创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> fragment_main.xml` 找到，加载到布局编辑器时，它将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 包含一个显示文本“MainFragment”的 `TextView`，但其他已准备好被修改以包含第一个应用屏幕的布局。此时，值得花时间查看 Android\
  \ Studio 已经生成的将此 fragment 显示在 activity 容器区域内的代码。\n\n将 `FrameLayout` 占位符替换为 fragment\
  \ 的过程从 `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）开始。关键代码出现在该类的\
  \ `onCreate()` 方法中，并将容器 ID（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main_activity);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow();\n    }\n}\n```\n\n伴随 fragment\
  \ 代码可以在 `MainFragment.java` 文件（`app -> <package name> -> ui.main -> MainFragment`）中找到。类文件中包含\
  \ `onCreateView()` 方法，该方法在 fragment 创建时被调用。此方法膨胀 `fragment_main.xml` 布局文件，使其显示在主\
  \ activity 布局的容器区域内：\n\n```\n@Override\npublic View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n    return inflater.inflate(R.layout.fragment_main, container, false);\n}\n\
  ```\n\n### ### 33.3.3 ViewModel\n\nactivity 的 `ViewModel` 包含位于 `app -> java -> ui.main\
  \ -> MainViewModel` 的 `MainViewModel.java` 文件。它被声明为 `ViewModel` 架构类的子类，并准备好被修改以存储应用的数据模型：\n\
  \n```\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    //\n}\n```\n\n# ## 33.4 设计\
  \ Fragment\n\n下一步是设计 fragment 的布局。在项目窗口中找到 `fragment_main.xml` 并双击将其加载到布局编辑器。布局加载后，选择现有的\
  \ `TextView` 小部件并使用属性窗口将 id 更改为 `resultText`。\n\n从调色板中拖入 `Number (Decimal)` 视图并将其置于现有\
  \ `TextView` 之上。在布局中选中该视图，引用属性窗口并将 id 更改为 `dollarText`。\n\n向布局拖入 `Button` 小部件使其位于\
  \ `TextView` 下方，并将文本属性改为“Convert”。当按钮仍被选中时，将 id 属性改为 `convertButton`。此时，布局应如图 33-3\
  \ 所示（注意这三个视图使用了垂直链进行约束）：\n\n![](img/as_4.2_viewmodel_ui.jpg)\n\n图 33-3\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\
  \n# ## 33.5 实现 ViewModel\n\n完成用户界面布局后，需要在 view model 中创建应用的数据模型。在项目窗口中找到 `MainViewModel.java`\
  \ 文件，双击将其加载到代码编辑器，并修改类如下所示：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult() {\n        return result;\n    }\n}\n```\n\
  \n\n\n\n\n该类声明了变量用于存储当前的美元字符串值以及转换后的金额，并配备了获取（getter）和设置（setter）方法以访问这些数据值。当调用 `setAmount()`\
  \ 方法时，它会将当前的美元金额作为参数并将其存储在局部变量 `dollarText` 中。美元字符串值会被转换为浮点数，乘以一个虚拟的汇率，并将生成的欧元值存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法简单地返回赋值给 `result` 变量的当前值。\n\n## 33.6 将 Fragment\
  \ 与 ViewModel 关联\n\n显然，Fragment（片段）需要某种方式来获取 `ViewModel` 的引用，以便能够访问模型并观察数据变化。`Fragment`\
  \ 或 `Activity` 通过 `ViewModelProvider` 类的实例来维护其所依赖的、用于数据的 `ViewModels` 引用。\n\n在 `Fragment`\
  \ 内部，使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。当调用时，类初始化器会接收当前 `Fragment`\
  \ 或 `Activity` 的引用，并如下所示返回一个 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，就可以在该实例上调用 `get()` 方法，并传递所需的特定 `ViewModel` 类。提供程序将随后创建该 `ViewModel` 类的新实例，或者返回一个已存在的实例：\n\
  \n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\
  \n编辑 `MainFragment.java` 文件，并验证 Android Studio 是否已经在 `onActivityCreated()` 方法中包含了此步骤（尽管为了简洁，操作是在单行代码中完成的）：\n\
  \n```java\nviewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\
  \n访问模型视图后，现在向 `Fragment` 中添加代码开始处理数据模型。\n\n## 33.7 修改 Fragment\n\n现在需要更新 fragment\
  \ 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前美元值并显示转换后的货币金额。\n\
  \n在标题为“在 Android Studio 中创建一个 Android 应用”的章节中，`Button` 控件的 `onClick` 属性被用于指定用户点击按钮时要调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 上的方法，不能用于调用 `Fragment` 中的方法。为了克服这一局限性，我们需要向 `Fragment` 类中添加一些代码，在按钮上设置\
  \ `onClick` 监听器。执行此操作的代码可以如下文所示添加到 `MainFragment.java` 文件的 `onActivityCreated()`\
  \ 方法中。在进行这些更改的同时，我们转换 fragment 以使其使用视图绑定（view binding）：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater,\n              \
  \               @Nullable ViewGroup container,\n                             @Nullable\
  \ Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n        binding = MainFragmentBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        mViewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        binding.convertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n                // 后续实现\n            }\n        });\n    }\n}\n```\n（注：源代码中提供的代码块是碎片化的；我已根据提供的文本重构了其逻辑结构。）\n\
  \n## 33.8 访问 ViewModel\n\n添加监听器后，放置在 `onClick()` 方法中的任何代码都会在点击按钮时被调用。当按钮被点击时，`onClick()`\
  \ 方法需要从 `EditText` 读取当前值，确认字段不为空，然后调用 `ViewModel` 的 `setAmount()` 方法。随后该方法需要调用 `getResult()`\
  \ 方法并将结果显示在 `TextView` 上。\n\n由于项目尚未使用 `LiveData`，因此在每次 Fragment 创建时，都有必要从 `ViewModel`\
  \ 获取最新值。在 `MainFragment.java` 文件中，实现这些需求：\n\n```java\nimport java.util.Locale;\n\
  \n@Override\npublic void onActivityCreated(@Nullable savedInstanceState) {\n   \
  \ super.onActivityCreated(savedInstanceState);\n    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    binding.convertButton.setOnClickListener(new View.OnClickListener() {\n   \
  \     @Override\n        public void onClick(View v) {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH, \"%s\"\
  , binding.dollarText.getText().toString()));\n                binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        }\n    });\n}\n```\n\n## 33.9 测试项目\n\n完成项目开发的这一阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击转换按钮。转换后的金额应显示在\
  \ `TextView` 上，这表明 UI 控制器和 ViewModel 的重构似乎是有效的。\n\n当运行原始的 AndroidSample 应用时，旋转设备会导致\
  \ `resultText` TextView 控件上的值丢失。现在用 ViewModelDemo 应用重此此测试，注意旋转后当前的欧元值仍然保留。这是因为当\
  \ Fragment 被销毁和重建时，ViewModel 仍然留在内存中，并且在 `onActivityCreated()` 方法中添加了代码，每次 Fragment\
  \ 重启时使用 `ViewModel` 的结果数据值更新 TextView。\n\n## 33.10 总结\n\n在本章中，我们回顾了书中早期的 AndroidSample\
  \ 项目，并创建了一个符合 Android Jetpack 架构指南的项目版本。章节概述了 Fragment + ViewModel 项目的结构，并解释了基于单一\
  \ Activity 使用 Fragment 在单个 Activity 布局中显示不同屏幕的概念。示例项目还演示了使用 ViewModel 将数据处理与界面相关代码分离。最后，章节展示了\
  \ ViewModel 方法如何避免处理 Fragment 和 Activity 生命周期时出现的一些问题。\n\n34\\. 一个 Android Jetpack\
  \ LiveData 教程\n\n\n\n\n上一章开始了设计符合推荐 Jetpack 架构指南的应用程序的过程。这些初始步骤涉及选择 `Fragment+ViewModel`\
  \ 项目模板，并在 `ViewModel` 实例中为应用用户界面实现数据模型。\n\n本章将通过使用 `LiveData` 架构组件来进一步增强应用设计。一旦在本章中为项目添加了\
  \ `LiveData` 支持后，接下来的章节（从“Android Jetpack Data Binding 概述”开始）将利用 Jetpack Data Binding\
  \ 库从项目中消除更大量的代码。\n\n## 34.1 LiveData - 回顾\n\n`LiveData` 在之前标题为使用 Jetpack 构建现代 Android\
  \ 应用架构的章节中介绍。如前所述，`LiveData` 组件可以作为 ViewModel 中数据值的包装器。一旦包含在 `LiveData` 实例中，这些变量对应用中的其他对象（通常是\
  \ UI 控制器，如 `Activities` 和 `Fragments`）即可观测。这允许 UI 控制器在底层 `LiveData` 值发生变化时接收到通知。通过创建\
  \ `Observer` 类的实例并定义一个在 `LiveData` 值变化时被调用的 `onChange()` 方法来设置观察者。一旦创建了 `Observer`\
  \ 实例，就可以通过调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData` 对象上。\n\n`LiveData` 实例可以使用\
  \ `MutableLiveData` 类声明为可变的，从而允许 `ViewModel` 和 UI 控制器对底层数据值进行更改。\n\n## 34.2 在 ViewModel\
  \ 中添加 LiveData\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo` 项目，并打开 `MainViewModel.java`\
  \ 文件，该文件目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult() {\n        return result;\n    }\n}\n```\n\
  \n本章此阶段的目标是将 `result` 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在每次用户请求货币转换时都能更改值）。首先修改该类，使其内容如下所示，请注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.valueOf(dollarText)*rate;\n    }\n\n    public Float getResult()\
  \ {\n        return result;\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的 `LiveData` 实例中，`setAmount()`\
  \ 和 `getResult()` 方法都 {进行修改。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为 `result` 变量赋值了。相反，必须调用\
  \ `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()` 方法被声明为返回 `Float` 值，现在需要更改为返回\
  \ `MutableLiveData` 对象。完成这些剩余更改后，得到如下类文件：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result = Float.valueOf(dollarText)*rate;\n\
  \        result.setValue(Float.parseFloat(dollarText)*rate);\n    }\n\n    public\
  \ MutableLiveData<Float> getResult() {\n        return result;\n    }\n}\n```\n\n\
  ## 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在本例中，它是 `MainFragment`\
  \ 类。找到 `MainFragment.java` 类（`app` -> `java` -> `<package name>` -> `MainFragment`），双击它将其加载到编辑器中并修改\
  \ `onActivityCreated()` 方法以创建一个名为 `resultObserver` 的新 `Observer`：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo.ui.main;\nimport androidx.lifecycle.Observer;\n\n\
  @Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState) {\n\
  \    binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\", mViewModel.getResult()));\n\
  \    final Observer<Float> resultObserver = new Observer<Float>() {\n        @Override\n\
  \        public void onChanged(@Nullable Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n}\n```\n\n`resultObserver` 实例声明了 `onChange()`\
  \ 方法，该方法被调用时会接收当前结果，然后将其转换为字符串并显示在 `resultText` TextView 上。下一步是将观察者添加到 `result`\
  \ `LiveData` 对象中，可以通过调用 `ViewModel` 对象的 `getResult()` 方法获取引用。由于更新 `resultText` TextView\
  \ 现在是 `onChange()` 回调方法的职责，现在可以删除执行此任务的现有代码行：\n\n```java\n@Override\npublic void\
  \ onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", mViewModel.getResult()));\n    final Observer<Float> resultObserver = new\
  \ Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n    mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View v) {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  , binding.dollarText.getText()));\n                binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        }\n    });\n}\n```\n\n编译并运行应用，在美元字段中输入数值，点击转换按钮并验证转换后的欧元金额是否显示在\
  \ TextView 上。这确认了观察者收到了结果值已变化的通知，并调用了 `onChange()` 方法显示最新数据。\n\n\n\n\n\n注意在上述 `onActivityCreated()`\
  \ 方法的实现中，负责在每次调用该方法时显示当前结果值的代码行已被移除。最初之所以放置此代码是为了确保如果 `Fragment` 因为任何原因被重建，显示的值也不会丢失。由于\
  \ `LiveData` 会监控其观察者的生命周期状态，这一步已不再是必要的。当 `LiveData` 检测到 UI 控制器被重建时，它会自动触发任何相关的观察者并提供最新的数据数据。你可以通过在\
  \ `TextView` 对象上显示欧元数值时旋转设备并确认该值没有丢失来验证这一点。\n\n在继续下一个章节之前，请关闭项目，复制 `ViewModelDemo`\
  \ 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便稍后查看保存 ViewModel 状态时使用。\n\n## 34.4 总结\n\
  \n本章演示了如何使用 Android `LiveData` 组件来确保显示给用户的数据始终与存储在 `ViewModel` 中的数据匹配。这个相对简单的过程包括将\
  \ `ViewModel` 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置一个订阅该 `LiveData` 值的观察者。每当 `LiveData`\
  \ 值发生变化时，观察者就会收到通知，且 `onChanged()` 方法会被调用并传递更新后的值。\n\n为项目添加 `LiveData` 支持在某种程度上简化了项目设计。通过使用\
  \ Data Binding Library（数据绑定库），还可以实现额外且重大的改进，细节将在下一章节中介绍。\n\n# 35. Android Jetpack\
  \ Data Binding 概述\n\n在标题为使用 Jetpack 构建现代 Android 应用架构的章节中，我们引入了 Android Data Binding（数据绑定）的概念，并简要解释了如何使用它直接将用户界面布局中的视图连接到应用中其他对象中的方法和数据，而无需编写代码。本章将提供更多关于数据绑定的详细信息，重点解释在\
  \ Android Studio 项目中如何实现数据绑定的。下一章节的教程（“Android Jetpack Data Binding 教程”）将提供一个数据绑定运行的实际示例。\n\
  \n## 35.1 数据绑定概述\n\n数据绑定支持由 Android Jetpack Data Binding 库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图连接到存储在应用代码中的数据（通常位于\
  \ `ViewModel` 实例中）。数据绑定还提供了一种方便的方法，将 `Button` 控件等用户界面控件映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听器方法。\n\n数据绑定与 `LiveData` 组件结合使用时变得异常强大。例如，考虑一个绑定到 `ViewModel` 中 `LiveData`\
  \ 变量的 `EditText` 视图。通过这种连接，`ViewModel` 中数据值的任何变化将自动显示在 `EditText` 视图中，当使用双向绑定时，输入\
  \ `EditText` 的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻可能是，除了初始设置绑定所需的代码外，不需要其他代码即可实现。\n\
  \n传统上，将 `Button` 控件等交互式视图连接到 UI 控制器中的方法需要开发者编写代码来实现监听器方法，以便在点击按钮时调用。数据绑定使得这变得非常简单，只需在布局\
  \ XML 文件的 `Button` 中引用要调用的方法即可。\n\n### 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来看起来可能有些无从心，但分开来看，这些实际上是非常简单的步骤，一旦完成，在节省编码工作量方面是非常值得的。在本章的剩余部分，将详细介绍这些元素中的每一个。在涵盖这些基础知识后，下一章节将通过详细的教程实际操作演示这些步骤。\n\
  \n### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须先配置为使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，这只需要在模块级\
  \ `build.gradle` 文件中添加几行代码（项目工具窗口 Gradle Scripts 下列出的 `build.gradle` (Module: app)）即可实现。以下列出了启用了数据绑定的部分构建文件：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        dataBinding = true\n    }\n\
  }\n```\n\n### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在 XML 布局文件中。在这些布局文件之一中的视图可以利用数据绑定之前，布局文件必须先转换为数据绑定布局文件。\n\
  \n正如书的前面提到的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。该根视图总是以布局容器的形式存在，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，如 `ViewModelDemo` 项目中的 `main_fragment.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了使用数据绑定，布局层次结构必须有一个布局组件作为根节点，反而成为当前视图的父级。在上述示例的情况下，这需要对布局文件进行以下更改：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n#### 35.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明与布局中视图绑定的项目中的类（例如 `ViewModel`\
  \ 或 UI 控制器）。在声明这些类之后，布局文件还需要一个变量名称，以便在绑定表达式引用这些实例。\n\n这是通过使用 `data` 元素实现的，示例所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n```\n\n\n\n\n\n```xml\n\
  <xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n   \
  \     <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n...\n</layout>\n```\n\n上述 `data` 元素声明了一个类型为 `MainViewModel` 的新变量 `myViewModel`（请注意，在声明变量时，必须声明\
  \ `MyViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类随后可以在布局文件的其他绑定表达式中引用。例如，如果你有一个类，其中包含一个在值显示给用户之前需要对该值调的方法，可以按如下方式导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n对于绑定布局文件中 `data` 元素中引用的每个类，Android Studio\
  \ 会自动生成对应的绑定类。该类是 `AndroidDataBinding` 类的子类，并将根据布局文件名使用首字母大写规则并添加 `Binding` 后缀进行命名。因此，名为\
  \ `main_fragment.xml` 的布局文件的绑定类将被命名为 `MainFragmentBinding`。该绑定类包含了布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍需要编写代码根据对应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过使用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“填充”（inflate）用户界面布局文件。这仅意味着代码打开布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现 `Activity` 类，实现此目的的代码可以在 `onCreate()` 方法中找到，其读取如下：\n\
  \n```java\nsetContentView(R.layout.activity_main);\n```\n\n在 `Fragment` 的情况下，这发生在\
  \ `onCreateView()` 方法中：\n\n```java\nreturn inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n```\n\n在 `Activity` 类中创建绑定类实例只需将此初始化代码修改如下：\n\n```java\nActivityMainBinding\
  \ binding;\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n在 `Fragment` 的情况下，代码读取如下：\n\n```java\nMainFragmentBinding binding;\n\
  binding = DataBindingUtil.inflate(\n    inflater, R.layout.main_fragment, container,\
  \ false);\nbinding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn\
  \ view;\n```\n\n## 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，该元素包含变量元素，变量元素由变量名和要建立绑定的类类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要额外的步骤，将应用中使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法完成的，该实例的引用在上一章中获取：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get();\nbinding.setVariable(viewModel, mViewModel);\n\
  ```\n\n上述示例中的第二个变量引用 `uiController` 作为一个 `Fragment`。在这种情况下，它将如下进行绑定：\n\n```java\n\
  binding.setVariable(uiController, this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了视图如何与绑定数据交互。例如，`TextView`\
  \ 可能会声明其 `text` 属性设置为存储在 `viewModel` 中的值。\n\n绑定表达式以 `@` 符号开头，后跟由花括号 `{}` 包的表达式。例如，考虑一个包含名为\
  \ `result` 变量的 `ViewModel` 实例。假设该值为 `String`，它在布局文件中的声明如下：\n\n```xml\n<TextView\n\
  \    android:id=\"@+id/resultText\"\n    android:layout_width=\"wrap_content\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:text=\"@{viewModel.result}\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n在上面的 XML 中，`text` 属性设置为存储在 `viewModel.result` 属性中的值。\n\n然而，假设\
  \ `result` 在模型中存储为 `Float` 值而不是 `String`。如果是这样，上述表达式将导致编译错误。显然，在 `TextView` 显示它之前，需要将\
  \ `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准 Java 类完成转换的必要步骤：\n\n```xml\nandroid:text=\"\
  @{String.valueOf(viewModel.result)}\"\n```\n\n在进行此更改后运行时，需要注意 Android Studio 控制台可能会出现以下警告：\n\
  \n`warning: myViewModel.result.getValue() is a boxed field but needs to be unboxed\
  \ to execute String.valueOf(viewModel.result.getValue()).`\n\nJava 值可以是原始值的形式，例如\
  \ `boolean` 类型（称为拆箱），也可以包装在 Java 对象中，例如 `Boolean` 类型并通过该对象的引用访问（即装箱）。拆箱过程是从对象中提取原始值的过程。\n\
  \n为了避免此消息，请如下所示使用 `safeUnbox()` 调用包裹引起的操作：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(viewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值后包含“dollars”单词，可以使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(viewModel.result))\
  \ + \" dollars\"}'\n```\n\n\n\n\n注意，由于追加的结果字符串被包裹在双引号中，因此表达式现在使用单引号封装以避免语法错误。\n\n\
  表达式语法还允许声明三元语句。在以下表达式中，视图将根据结果值是否大于 10 来显示不同的文本。\n\n```\n@{myViewModel.result >\
  \ 10 ? \"Out of range\" : \"In range\"}\n```\n\n表达式还可以构造用以访问数据数组中的特定元素：\n\n```\n\
  @{myViewModel.resultsArray[3]}\n```\n\n### 35.2.7 绑定表达式（双向）\n\n到目前为止涵盖的表达式类型被称为单向绑定。换句话说，布局会随着对应值的变化而不断更新，但从布局内部对值进行的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，一个 `EditText` 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式相似，不同在于它以\
  \ `@=` 开头。例如：\n\n```\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件与监听器绑定\n\n绑定表达式还可以用于响应视图上的事件来触发方法调用。例如，一个 `Button` 视图可以配置为点击时调用某个方法。在标题为“在 Android\
  \ Studio 中创建 Android 示例”的章节中，例如，按钮的 `onClick` 属性被配置为调用应用主 Activity 中一个名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，其表示如下：\n\n```\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法在以下行中声明：\n\n```java\npublic void convertCurrency(View view) {\n\n.\n.\n}\n```\n\
  \n注意，这种类型的方法调用始终会传递一个发生事件视图的引用。在数据绑定中，可以使用以下表达式相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n另一个选项（也是一个提供向方法传递参数的功能）被称为监听器绑定。以下表达式使用这种方法在同一个\
  \ `viewModel` 实例上调用一个无参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n\
  ```\n\n以下表达式调用了一个需要三个参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result,\
  \ 10, \"A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查看在线\
  \ Android 文：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n## 35.3 总结\n\nAndroid 数据绑定提供了一个系统，可以在用户界面布局中的视图与应用架构与其他对象的数据和方法之间建立连接，而无需编写代码。完成一些初始配置步骤后，数据绑定仅涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定响应用户界面中按钮点击等事件而引起的方法。\n\
  \n# 36. Android Jetpack 数据绑定教程\n\n到目前为止，本书已经涵盖了现代 Android 应用架构的基本概念，并详细地查看了 `ViewModel`\
  \ 和 `LiveData` 组件。上一节也涵盖了数据绑定的概念，现在将在本章中使用它进一步修改 `ViewModelDemo` 应用。\n\n## 36.1\
  \ 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中在在本章结束时不再需要的所有代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并进行如下修改：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\n.\n.\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ mViewModel;\n.\n.\n    @Override\n    public void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      final Observer<Float> resultObserver = new Observer<Float>() {\n        \
  \    @Override\n            public void onChanged(@Nullable final Float result)\
  \ {\n                binding.resultText.setText(String.format(Locale.ENGLISH, \"\
  %.2f\", result));\n            }\n        };\n        mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n        binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n            @Override\n            public void onClick(View v) {\n        \
  \        if (!binding.dollarText.toString().equals(\"\")) {\n                  \
  \  mViewModel.setAmount(String.format(Locale.ENGLISH, \"%s\", binding.dollarText.getText()));\n\
  \                } else {\n                    binding.resultText.setText(\"No Value\"\
  );\n                }\n            }\n        });\n    }\n}\n```\n\n接下来，编辑 `MainViewModel.java`\
  \ 文件并继续按如下删除（同样注意 `dollarText` 到 `LiveData` 的转换）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    public MutableLiveData<Float> result\
  \ = new MutableLiveData<>();\n    public void setAmount(String value) {\n      \
  \  this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n虽然在实现数据绑定的过程中我们会添加额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n## 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 项目中启用它。这需要在 Gradle Scripts -> `build.gradle (Module:\
  \ ViewModelDemo.app)` 文件中添加新属性。\n\n在 `build.gradle` 文件中，添加以下元素以启用项目的数据绑定：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n\
  \        viewBinding true\n        dataBinding true\n    }\n}\n```\n\n添加条目后，编辑器屏幕顶部会出现一个带有\
  \ Sync Now 链接的黄色条。点击该链接以新的构建配置设置重新同步项目。\n\n## 36.3 添加布局元素\n\n正如“Android Jetpack\
  \ 数据绑定概述”所示，为了能够数据绑定，布局层次结构必须有一个布局组件作为根视图。这需要对 `main_fragment.xml` 布局文件（app -> res\
  \ -> layout -> main_fragment.xml）进行以下更改。在布局编辑器工具中打开此文件，切换到 Code 模式并进行这些更改：\n\n\n\
  \n\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n完成这些更改后，切换回设计（Design）模式。注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 36-1\
  \ 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\n图 36-1\n\n编译并运行应用，验证布局元素的添加没有以任何方式改变用户界面的外观。\n\
  \n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加 `<data>` 元素。在本例中，布局将绑定到 `MainViewModel`，因此请编辑\
  \ `main_fragment.xml` 文件，并按照如下所示添加数据元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    </data>\n\
  \    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"@+id/main\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n再次编译并运行应用，以确保这些更改生效。\n\n## 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java`\
  \ 文件中的代码以膨胀数据绑定。实现这一方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  \npublic class MainFragment extends Fragment {\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container,\n                    \
  \        @Nullable Bundle savedInstanceState) {\n        binding = MainFragmentBinding.inflate(inflater,\
  \ container, false);\n        binding = DataBindingUtil.inflate(inflater, R.layout.main_fragment,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码简单地膨胀了 `main_fragment.xml` 布局（换句话说，创建了包含所有视图对象的布局），并返回了根视图（顶层容器）的引用。数据绑定库包含一个工具类，它提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时，还会返回布局数据绑定的实例。新代码调用此方法并将类引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(inflater,\
  \ R.layout.main_fragment, container, false);\n```\n\n`binding` 对象只需要在 fragment 存在时保留在内存中。为了确保\
  \ fragment 在消失时销毁实例，将当前 fragment 声明为绑定的生命周期所有：\n\n```java\nbinding.setLifecycleOwner(this);\n\
  return binding.getRoot();\n```\n\n## 36.6 将 ViewModel 实例分配给数据变量\n\n此时，数据绑定知道它将绑定到一个类型类型的实例，但尚未连接到实际的\
  \ `MainViewModel` 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局中声明的变量。由于 `ViewModel`\
  \ 的引用是在 `onActivityCreated()` 方法中获取的，因此在该处进行赋值是合理的：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel = ViewModelProvider(this).get(MainViewModel.class);\n\
  \    binding.setVariable(myViewModel, mViewModel);\n}\n```\n\n如果 Android Studio\
  \ 报告 `myViewModel` 未定义，请使用 `Build -> Make Project` 重新构建项目以强制生成该类。完成这些更改后，下一步开始向数据绑定布局的视图中插入一些绑定表达式。\n\
  \n## 36.7 添加绑定表达式\n\n第一个绑定表达式将 `resultText` `TextView` 绑定到模型中的结果值。编辑 `main_fragment.xml`\
  \ 文件，找到 `resultText` 元素并修改 `text` 属性，使元素如下：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/resultText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"MainFragment\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条指示用户输入值的消息。然而，如果结果不为零，则将该值转换为字符串，并与单词“euros”拼接后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相反，`dollarValue` `EditText` 视图需要使用双向绑定，以便可以使用用户输入的最新值更新数据模型，并在生命周期事件（例如由设备旋转触发）时在视图中重新显示当前值。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    android:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n添加初始绑定表达式后，现在编写一个方法在用户点击\
  \ `Button` 组件时执行转换。\n\n## 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法来执行转换计算，并将欧元值放入\
  \ `result` `LiveData` 变量中。在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n     \
  \       (!dollarValue.getValue().equals(\"\"))) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```\n        rate);\n\n        } else {\n \
  \           result.setValue(0F);\n        }\n    }\n}\n```\n\n请注意，在没有有效的金额的情况下，`result`\
  \ `LiveData` 变量将被赋值为零值。这确保了赋值给 `resultText` `TextView` 的绑定表达式在用户未输入任何值时会显示“Enter\
  \ value”（输入值）消息。\n\n## 36.9 添加监听器绑定\n\n在测试项目之前的最后一步是在布局文件中的 `Button` 元素添加监听器绑定表达式，以便在点击按钮时调用\
  \ `convertValue()` 方法。再次在代码模式下编辑 `main_fragment.xml` 文件，找到 `convertButton` 元素并添加如下\
  \ `onClick` 项：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  77dp\"\n    android:onClick=\"@{() -> myViewModel.convertValue()}\"\n    android:text=\"\
  Convert\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ## 36.10 测试应用\n\n编译并运行应用，测试在金额字段中输入值并点击 Convert 按钮，是否会在 `TextView` 上显示正确的结果（连同“euros”后缀），以及在金额字段为空时尝试转换，是否会显示“Enter\
  \ value”提示。此外，验证用户界面中显示的信息在设备旋转后是否仍被保留。\n\n## 36.11 总结\n\n本章的主要目标是完成设置项目以使用数据绑定的步骤，并演示单向、双向绑定和监听器绑定表达式的使用。本章还提供了一个实用示例，说明了通过使用数据绑定结合\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接，可以节省多少代码编写。\n\n# 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保存与恢复，在于应用被置于后台后，能够从外观和行为上为用户提供连续性。用户已经习惯了可以在不同应用之间切换，并在返回原始应用时，发现它仍处于切换前的完全相同的状态。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”章节中所述的，当用户将应用置于后台时，如果资源受限，该应用就有可能被操作系统终止。当用户尝试将已终止的应用返回前台时，Android\
  \ 会简单地在新进程中重新启动该应用。由于这对用户来说是不可见的，因此应用有责任将其恢复到最初置于后台时的状态，而不是以其“初始启动”状态呈现。对于基于 `ViewModel`\
  \ 的应用，这种行为很大程度上可以通过 `ViewModel- Saved State` 模块来实现。\n\n## 37.1 理解 ViewModel 状态保存\n\
  \n如前面的章节所述，`ViewModel` 为应用开发带来了许多益处，包括设备旋转等配置更改发生时的 UI 状态恢复。为了看到实际效果，请运行 `ViewModelDemo`\
  \ 应用（如果你尚未创建项目，请从随书的示例代码下载中加载到 `ViewModelDemo_LiveData` 项目）。\n\n运行后，输入一个金额并将其转换为欧元。在美元和欧元值都显示的情况下，旋转设备或模拟器，并注意在应用响应方向变化后，两个值仍然可见。\n\
  \n遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍在运行的情况下，点击设备主页按钮将 `ViewModelDemo` 应用置于后台，然后通过打开 Android\
  \ Studio 中的 `Logcat` 工具窗口并点击如图 37-1 所示的 `terminate` 按钮将其终止（不要点击 Android Studio 工具栏上的停止按钮）：\n\
  \n![](img/as_3.5_logcat_terminate.jpg)\n\n图 37-1\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要直接从\
  \ Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所期的连续性。\n\n## 37.2 实现 ViewModel 状态保存\n\n基础的 `ViewModel` 状态保存通过引入 `ViewModel\
  \ Saved State` 库得以。保存状态的关键是 `SavedStateHandle` 对象，它允许数据的保存和恢复。`SavedStateHandle`\
  \ 包含一个键值映射，允许对值的保存和恢复。\n\n该库本质上扩展了 `ViewModel` 类，使其包含通过后台进程终止及随后的重新启动来维护状态的能力。为了支持保存状态，需要声明一种不同的\
  \ `ViewModel` 子类，在这种情况下，它包含一个 `SavedStateHandle` 实例。一旦声明，就可以通过包含 `SavedStateHandle`\
  \ 创建这种类型的 `ViewModel` 实例。考虑以下来自标准 `ViewModel` 的代码片段：\n\n```java\npackage com.ebookrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  \npublic class MainViewModel extends ViewModel {\n}\n```\n\n创建此类类的实例的代码可能如下：\n\n\
  ```java\nprivate MainViewModel mViewModel;\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，用于保存状态的 `ViewModel` 子类需要声明如下：\n\n```java\npackage com.ebookrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  }\n```\n\n当创建上述 `ViewModel` 的实例时，必须向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory = new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n## 37.3\
  \ 保存和恢复状态\n\n可以通过 `SavedStateHandle` 实例 `set` 方法在 `ViewModel` 内部保存对象或值，提供检索时引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当配合 `LiveData` 对象时，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前保存的值，再次引用相应的键：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n\n\n\n\n- `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回一个包含保存状态中所有键的字符串集合。\n\n## 37.4\
  \ 为 ViewModelDemo 项目添加对保存状态的支持\n\n在涵盖了 ViewModel 状态状态的基础的基础知识后，可以扩展 `ViewModelDemo`\
  \ 应用以包含此支持。首先，在 Android Studio 中加载在“Android Jetpack LiveData 教程”中创建的 `ViewModelDemo_LiveData`\
  \ 项目（示例代码中也有该项目的副本），打开 `build.gradle`（Module: ViewModelDemo.app）文件并添加 Saved State\
  \ 库依赖（一如既往地，检查是否有更新的库版本）：\n\n```gradle\ndependencies {\n    implementation \"androidx.savedstate:savedstate:1.1.0\"\
  \n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.4.0\"\
  \n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接受并存储一个 `SavedStateHandle` 实例。同时导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明一个键字符串常量并修改结果 `LiveData` 变量，使得值现在从构造函数中的保存状态获取：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n    private SavedStateHandle savedStateHandle;\n\
  \    private MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ MainViewModel(SavedStateHandle savedStateHandle) {\n        this.savedStateHandle\
  \ = savedStateHandle;\n        result = savedStateHandle.getLiveData(RESULT_KEY);\n\
  \    }\n}\n```\n\n在保持 `MainViewModel.java` 文件不变的情况下，修改 `setAmount()` 方法，包含在每次计算新欧元金额时保存结果值的代码：\n\
  \n```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n\
  \    result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 `ViewModel`\
  \ 的更改后，打开 `MainFragment.java` 文件并进行以下更改，以便在创建 ViewModel 的过程中包含 Saved State 工厂实例：\n\
  \n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n        new SavedStateViewModelFactory(\n\
  \            getActivity().getApplication(),this);\n    mViewModel = new ViewModelProvider(this,\
  \ factory).get(MainViewModel.class);\n}\n```\n\n完成更改后，构建并运行应用并进行货币转换。当屏幕 UI 填充了美元和欧元值时，将应用置于后台，从\
  \ Logcat 工具窗口中终止它，然后从设备或模拟器屏幕上重新启动。重启后，之前的货币金额应仍然显示在 `TextView` 和 `EditText` 组件中，确认状态已成功保存并恢复。\n\
  \n## 37.5 总结\n\n一个设计良好的应用程序在从后台恢复时，应该始终向用户呈现相同的状态，无论期间包含应用的进程是否被操作系统终止。在处理 `ViewModels`\
  \ 时，可以通过利用 `ViewModel` Saved State 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受 `SavedStateHandle`\
  \ 实例，该实例可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在后台终止期间自动保存并恢复状态。\n\n# 38. 使用 Android 生命周期感知组件\n\n早之前标题为“理解 Android\
  \ 应用和 Activity 生命周期`的章节描述了使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将处理状态的负担放在了\
  \ UI 控制器上（为了简洁省略了文字）。\n\n## 38.1 生命周期感知\n\n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称该对象是生命感知的。某些\
  \ Android 组件（`LiveData` 是一个很好的例子）已经是生命感知的。通过实现 `LifecycleObserver` 接口也可以可以将任何类配置为生命感知。\n\
  \n## 38.2 生命周期所有者\n\n生命感知组件只能观察作为生命所有者的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个辅助\
  \ `Lifecycle` 对象，该对象负责存储组件的当前状态并为生命观察者提供状态信息。大多数 Android Framework 组件（如 activity\
  \ 和 fragment 类）都是生命所有者。也可以通过 `LifecycleRegistry` 类并实现 `LifecycleObserver` 接口将自定义类配置为生命所有者。例如：\n\
  \n```java\npublic class SampleOwner implements LifecycleOwner {\n    private LifecycleRegistry\
  \ lifecycleRegistry;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        lifecycleRegistry = new\
  \ LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public Lifecycle\
  \ getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\n除非生命所有者是另一个生命感知组件的子类，否则该类需要通过调用\
  \ `LifecycleRegistry` 类的方法来自己触发生命周期状态的变化。`markState()` 方法可以用于通过传递新的状态值来触发生命周期状态变化：\n\
  \n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n\n\n\n上述调用将导致调用相应的事件处理程序。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态发生变化）。例如：\n\n```\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期观察者\n\n为了让感知生命周期的组件观察生命周期所有者（lifecycle owner）的状态，它必须实现 `DefaultLifecycleObserver`\
  \ 接口，并对其需要观察的任何生命周期变化事件进行重写。\n\n```java\npublic class SampleObserver implements\
  \ DefaultLifecycleObserver {\n\n    // 生命周期事件方法重写写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到由\
  \ `Lifecycle` 对象维护的观察者列表中。\n\n```\ngetLifecycle().addObserver(new SampleObserver());\n\
  ```\n\n如果观察者不再需要跟踪生命周期状态，也可以随时从 `Lifecycle` 对象中移除。\n\n图 38-1 阐述了提供生命周期感知能力的关键元素之间的关系：\n\
  \n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\n## 38.4 生命周期状态和事件\n\n当生命周期所有者的状态发生变化时，对应的\
  \ `Lifecycle` 对象将更新为新状态。在任何时刻，生命周期所有者都处于以下五种状态之一：\n\n* `Lifecycle.State.INITIALIZED`\n\
  * `Lifecycle.State.CREATED`\n* `Lifecycle.State.STARTED`\n* `Lifecycle.State.RESUMED`\n\
  * `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle` 对象将在已添加到列表的观察者上触发事件。在生命周期观察者中可以重写以下事件方法：\n\
  \n* `onCreate()`\n* `onResume()`\n* `onPause()`\n* `onStop()`\n* `onStart()`\n*\
  \ `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()` 方法：\n\n```java\n\
  @Override\npublic void onResume(@NonNull LifecycleOwner owner) {\n    // 响应 Resume\
  \ 状态事件执行任务\n}\n```\n\n图 38-2 中的流程图阐述了生命周期所有者的状态变化序列，以及在每个状态转换之间在观察者上触发的生命周期事件：\n\
  \n![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n## 38.5 总结\n\n本章介绍了生命周期感知的基础知识以及包含在\
  \ Android Jetpack 中的 Android Lifecycle 包的类和接口。该包包含许多用于创建生命周期所有者、生命周期观察者和感知生命周期组件的类和接口。生命周期所有者分配有一个\
  \ `Lifecycle` 对象，该对象维护所有者状态的记录和订阅观察者的列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便其对变化做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何与感知生命周期的组件工作以及创建这些组件，包括生命周期观察者和所有者的创建，以及对生命周期状态变化和事件的处理。\n\
  \n# 39. Android Jetpack 生命周期感知感知教程\n\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目内实现此点的关键类和接口。本章将在此知识的基础上，通过构建一个\
  \ Android Studio 项目，旨在突出生命周期感知的实际应用。\n\n## 39.1 创建示例生命周期项目\n\n从欢迎界面选择 `New Project`\
  \ 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入\
  \ `LifecycleDemo`，并指定 `com.ebookfrenzy.lifecycledemo` 为包名。在点击 `Finish` 按钮之前，将最小\
  \ API 级别（Minimum API level）设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。\n\n\
  ## 39.2 创建生命周期观察者\n\n如前所述，activity 和 fragment 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中这一点，本教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com` -> `ebookfrenzy`\
  \ -> `lifecycledemo`，并在生成的菜单中选择 `New` -> `Java Class...`。在新类对话框中，将类命名为 `DemoObserver`\
  \ 并按下键盘上的 Return 键创建 `DemoObserver.java` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.lifecycledemo;\n\npublic class DemoObserver {\n\n}\n```\n\n保持在编辑器中，修改类文件以声明它将实现\
  \ `DefaultLifecycleObserver` 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.DefaultLifecycleObserver;\n\npublic class DemoObserver\
  \ implements DefaultLifecycleObserver {\n\n}\n```\n\n下一步是重写 `DefaultLifecycleObserver`\
  \ 类的生命周期方法。为了本示例，所有的事件都将被处理，每个事件都会向 Logcat 面板输出一条消息显示事件类型。按照下方列表更新观察者类：\n\n```java\n\
  package com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  import androidx.lifecycle.LifecycleOwner;\nimport androidx.annotation.NonNull;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n    private String\
  \ LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onStart\");\n    }\n\n    @Override\n    public void onResume(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onResume\");\n    }\n\n    @Override\n    public\
  \ void onPause(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onPause\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainFragment` 类。\n\n##\
  \ 39.3 添加观察者\n\n观察者通过调用生命周期所有者 `Lifecycle` 对象的 `addObserver()` 方法来添加，该对象的引用通过调用\
  \ `getLifecycle()` 方法获取。编辑 `MainFragment.java` 类文件并在 `onActivityCreated()` 方法中添加代码以添加观察者：\n\
  \n```java\n.\n.\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n.\n.\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n在创建观察者类并添加到生命周期所有者的 `Lifecycle` 对象后，该应用就可以进行测试了。\n\
  \n## 39.4 测试观察者\n\n由于 `DemoObserver` 类向 Logcat 控制台输出诊断信息，如果配置了过滤器只显示 DemoObserver\
  \ 消息，将更容易看到输出。使用之前在 “Android Activity 状态示例” 中概述的步骤，在运行应用之前为与 DemoObserver 标签的消息配置过滤器。\n\
  \n应用成功启动后，Logcat 输出应指示以下生命周期状态变化和事件：\n\nonCreate\n\nonStart\n\nonResume\n\n在应用仍在运行时，执行设备旋转以触发\
  \ fragment 的销毁和重建，产生以下额外的输出：\n\n\n\n\n\n`onPause`\n`onStop`\n`onDestroy`\n`onCreate`\n\
  `onStart`\n`onResume`\n\n在进入本章的下一节之前，请花些时间将应用的输出结果与上一章中图 38-2 的流程图进行对比。\n\n## 39.5\
  \ 创建生命所有者\n\n本章的最后一个任务是创建一个自定义的生命所有者（Lifecycle Owner）类，并演示如何在类内部触发事件并修改生命状态。\n\n\
  在 Project 工具窗口中右键点击 app -> `java` -> `com` -> `ebookfrenzy` -> `lifecycledemo` 项，并选择\
  \ `New -> Java Class...` 菜单选项。在 Create Class 框中将类命名为 `DemoOwner`，然后按回车键。新的 `DemoOwner.java`\
  \ 文件加载到代码编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport\
  \ androidx.lifecycle.Lifecycle;\n\nimport androidx.lifecycle.LifecycleOwner;\n\n\
  import androidx.lifecycle.LifecycleRegistry;\n\nimport org.jetbrains.annotations.NotNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量来存储\
  \ `LifecycleRegistry` 引用，一个构造函数来初始化 `LifecycleRegistry` 实例并添加 `getLifecycle()` 方法：\n\
  \n```java\npublic class DemoOwner implements LifecycleOwner {\n    private final\
  \ LifecycleRegistry lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    }\n\n    @NotNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，该类需要通知注册表生命状态的变化。可以通过 LifecycleRegistry 对象的 `markState()` 方法标记状态，也可以使用 `handleLifecycleEvent()`\
  \ 方法触发生命周期事件。自定义类中什么构成状态变化取决于类的用途。在本示例中，我们将添加一些方法，在调用它们时只需触发生命周期事件：\n\n```java\n\
  private LifecycleRegistry lifecycleRegistry;\n\n    public void startOwner() {\n\
  \        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n   \
  \ }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NotNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n```\n\n`DemoOwner` 类中的最后一个更改是添加 `DemoObserver`\
  \ 类作为观察者。此调用将在构造函数中如下执行：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainFragment.java` 文件加载到代码编辑器，找到 `onActivityCreated()` 方法，并添加代码创建 `DemoOwner`\
  \ 类的实例并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然一个观察者可以用于多个所有者，但在这种情况下移除是为了避免在\
  \ Logcat 工具窗口中出现重复且混淆的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    demoOwner\
  \ = new DemoOwner();\n    demoOwner.startOwner();\n    demoOwner.stopOwner();\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n## 39.6 测试自定义生命所有者\n\
  \n最后一次构建并运行应用，参考 Logcat 工具窗口并确认观察者按照以下顺序检测到创建、开始和停止生命周期事件：\n\n`onCreate`\n`onStart`\n\
  `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，“已创建”（created）状态的变化仍然被触发了。事实上，这些变化是在所有者实例首次被创建时以及随后在处理\
  \ `ON_STOP` 事件时自动触发的。\n\n## 39.7 总结\n\n本章提供了在 Android 应用中实现生命周期感知相关步骤的实实践演示。这包括生命周期观察者的创建，以及基础生命周期所有者类的设计与实现。\n\
  \n# 40. 导航架构组件概述\n\n如今很少有 Android 应用仅包含单个屏幕。事实上，大多数应用由多个屏幕组成，用户通过屏幕手势、按钮点击和菜单选择在屏幕间进行导航。在引入\
  \ Android Jetpack 之前，应用内的导航实现很大程度上是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入以及 Android Studio 中对导航图（navigation graphs）的支持，这种情况得到了显著改善。\n\n## 40.1\
  \ 理解导航\n\n每个应用都有一个主屏幕，它在应用启动以及任何启动屏（splash screen）显示后出现（启动屏是应用加载时临时显示的品牌界面）。从这个主屏幕开始，用户通常会执行会导致其他屏幕出现的任务。这些屏幕通常以应用内其他\
  \ Activity 和 Fragment 的形式存在。例如，一个消息应用可能有一个列出当前消息的主屏幕，用户可以从该屏幕导航到另一个访问联系人列表或设置屏幕。联系人列表屏幕反又允许用户导航到可以添加新用户或更新现有联系人的屏幕。在图形上，应用的导航图可以如图\
  \ 40-1 所示表示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为目的地（destination），通常是一个\
  \ Fragment 或 Activity。Android 导航架构使用导航栈（navigation stack）跟踪用户在应用目的地之间的路径。当应用首次启动时，主屏幕是第一个放入栈的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入主目的地之上。当用户导航到其他屏幕时，它们也会推入栈。例如，图\
  \ 40-2 显示了假设的消息应用在用户启动应用并导航到“添加联系人”屏幕后，导航栈的状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键返回屏幕时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户已从“添加联系人”屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n所有涉及目的地之间导航和管理导航栈的工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n\n\n\n使用 Navigation Architecture 组件为 Android 项目添加导航是一个简单的过程，它涉及导航宿（navigation\
  \ host）、导航图（navigation graph）、导航动作（navigation actions）以及编写少量代码以获取导航控制器实例的引用并与其进行交互。\n\
  \n## 40.2 声明导航宿\n\n导航宿仅仅是一个特殊的 fragment（`NavHostFragment`），它嵌入到 activity 的用户界面布局中，作为用户导航目标地的占位符。例如，图\
  \ 40-4 显示了一个典型的 activity 屏幕，并突出了由导航宿 fragment 表示的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\
  \n图 40-4\n\n在 Android Studio 布局编辑器中，可以通过从调板的容器（Containers）部分拖放实例，或者通过以下手动编辑 XML，将\
  \ `NavHostFragment` 放入 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿 fragment 元素的注意点在于：`name` 属性对 `NavHostFragment`\
  \ 的引用、`defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity 启动时，此导航宿\
  \ fragment 将被导航图中指定的首页目的地替换。当用户在应用屏幕之间导航时，宿 fragment 将被目标地的相应 fragment 替换。\n\n##\
  \ 40.3 导航图\n\n导航图是一个 XML 文件，包含了包含在应用导航中的目的地。除了这些目的地外，该文件还包含了定义目的地之间导航的导航动作，以及用于从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图并实现动作。\n\n图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表 (A)\
  \ 提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中对应的目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的一个对话框，显示了用户界面布局的表示形式。在例例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 表示导航动作连接。通过将鼠标指针悬停在起点边缘直到出现圆圈，然后从圆圈点击并拖动到目的地来添加动作。属性面板\
  \ (D) 允许查看和修改当前选中目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可以选择将现有的\
  \ fragment 或 activity 作为目的地，也可以创建新的空白 fragment 。组件树面板 (F) 提供了导航图的层级概览。\n\n可以通过将编辑器切换到代码（Code）模式查看并修改导航图的底层\
  \ XML。以下 XML 列表表示图 40-5 所示的目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookf.navigation.demo.MainFragment\"\
  \n        android:label=\"mainFragment\"\n        tools:layout=\"@layout/fragment_main\"\
  >\n        <action\n            android:id=\"@+id/mainToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookf.navigation.demo.SecondFragment\"\n        android:label=\"\
  secondFragment\"\n        tools:layout=\"@layout/fragment_second\" />\n</navigation>\n\
  ```\n\n如有必要，导航图也可以拆分到多个文件中以改进组织结构并促进重用。以这种方式结构化时，嵌套图会被嵌入到根节点。要创建嵌套图，只需对要嵌套的目的地按\
  \ Shift+点击，在第一个目的地上右键并选择“移动到嵌套图（Move to Nested Graph）-> 新图”。随后嵌套图将作为新节点出现。要访问嵌套图，只需双击嵌套图节点将其加载到编辑器。\n\
  \n## 40.4 获取导航控制器\n\n从目的地之间的导航通常会响应应用内的某种事件，例如点击按钮或选择菜单。在触发导航动作之前，代码必须先获取控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可用于访问 activity\
  \ 的控制器。注意，为了让代码工作，activity 必须包含导航宿：\n\n```java\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种情况下，方法调用传递了 activity 的引用以及 activity 布局中嵌入的导航宿\
  \ ID。\n\n或者，可以通过将任何视图传递给方法来识别与其关联的导航控制器：\n\n```java\nNavController controller =\
  \ Navigation.findNavController(binding.button);\n```\n\n最后选项是通过调用 `NavHostFragment`\
  \ 类的 `findNavController()` 方法并传递 fragment 的引用来查找 fragment 的导航控制器：\n\n```java\nNavController\
  \ controller = NavHostFragment.findNavController(fragment);\n```\n\n## 40.5 触发导航动作\n\
  \n一旦找到控制器，就可以调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\n```java\ncontroller.navigate(R.id.goToContactsList);\n\
  ```\n\n动作的 ID 在导航图编辑器中选中动作连接时的属性面板中定义。\n\n## 40.6 传递参数\n\n\n\n\n在导航操作过程中，可以使用导航图文件中声明的参数将数据从一个目的地传递到另一个目的地。一个参数由名称、类型和可选的默认值组成，并可以在\
  \ XML 中手动添加，也可以在图表中选择动作箭头或目的地时使用属性（Attributes）面板添加。例如，在图 40-6 中，声明了一个名为 `contactsCount`\
  \ 的整数参数，其默认值为 0：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n添加后，参数将放置在接收目的地的\
  \ XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n   \
  \ android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"contactsCount\"\n        android:defaultValue=0\n      \
  \  app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入\
  \ `Bundle` 对象中，在动作期间将其传递给目的地，然后在目的地处进行解包并提取参数。\n\n这种特定方法的主要缺点是它不是“类型安全的”。换句话说，如果接收目的地将参数处理为与其声明不同的类型（例如将字符串视为整数），那么此错误将不会被编译器捕获，并可能在运行时引发问题。\n\
  \n更好的选择（也是本书所采用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它会自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 的参数传递方法将在下一章进行描述和演示（“Android Jetpack 导航组件教程”）。\n\n## 40.7 总结\n\n在 Android 应用用户界面的语境下，`Navigation`（导航）一词指的是用户在不同屏幕之间来回的能力。曾经实现导航非常耗时且难以组织，现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更容易。\n\n应用中的不同屏幕被称为目的地（destinations），通常由碎片（fragments）或活动（activities）表示。所有应用都有一个主目的地，包括应用首次加载时显示的屏幕。该布局的内容区域被一个导航宿主碎片（navigation\
  \ host fragment）取代，当用户导航应用时，该碎片会与其他目的地碎片进行切换。导航路径由导航图文件定义，该文件由目的地和连接它们的动作以及在目的地之间传递的任何参数组成。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码内部启动导航动作的方法。\n\n# 41. Android Jetpack 导航组件教程\n\
  \n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航绘图功能集成，从而为实现 Android 应用屏幕之间的导航提供了一种简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，并利用这些导航功能实现一个包含多个屏幕的示例应用。除了演示 Android Studio 导航图编辑器的使用外，示例项目还将实现使用类型安全的参数在源屏幕和目的地屏幕之间传递数据。\n\
  \n## 41.1 创建 NavigationDemo 项目\n\n从欢迎界面选择“新建项目”（New Project）选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前，选择“Fragment\
  \ + ViewModel”模板。\n\n在 `Name` 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将最低 API 设置更改为 `API 26`：Android 8.0 (Oreo)，并将语言（Language）菜单设置为\
  \ Java。\n\n## 41.2 向构建配置中添加导航\n\n默认情况下，新的 Android Studio 项目不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用\
  \ 级别的 `build.gradle` 文件。在项目工具窗口找到该文件（Gradle Scripts -> `build.gradle (Module: NavigationDemo.app)`），双击将其加载到代码编辑器中，并修改依赖部分以添加导航库。同时，利用此机会为该模块启用视图绑定（view\
  \ binding）：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n\
  \    }\n}\n...\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment:2.4.2'\n\
  \    implementation 'androidx.navigation:navigation-ui:2.4.2'\n}\n```\n\n注意，自本书出版以来，这些库可能已经发布了更新版本。要识别并使用更高版本的库，请将上述行添加到构建文件中，然后打开“项目结构”（Project\
  \ Structure）对话框（File -> Project Structure...）。在项目结构对话框中，选择“建议”（Suggestions）选项以显示可用更新。如果有新的库版本，点击“更新”（Update）按钮以确保在\
  \ `build.gradle` 文件中使用这些最新版本，然后点击“应用”（Apply）按钮：\n\n![](img/as_3.4_project_structure_suggestions.jpg)\n\
  \n图 41-1\n\n在文件中添加导航依赖项后，点击“立即同步”（Sync Now）链接以重新同步构建配置。\n\n## 41.3 创建导航图文件\n\n在构建配置中添加了导航库后，现在可以向项目中添加导航图文件了。正如“导航架构组件概述所示，这是一个\
  \ XML 文件，包含了用户可以导航的碎片和活动，以及执行转换的动作和在目的地之间传递的任何数据。\n\n在项目工具窗口中找到 `res` 文件夹（app ->\
  \ res），右键点击它并选择“New -> Android Resource File”（新建 资源文件）：\n\n![](img/as_3.2_navigation_menu.jpg)\n\
  \n图 41-2\n\n选择菜单项后，会出现“新建资源文件”对话框。在此对话框中，将文件命名为 `navigation_graph`，并在点击确定按钮创建文件之前，如图\
  \ 41-3 所示，将资源类型菜单更改为 Navigation。\n\n![](img/as_3.2_navigation_resource_file.jpg)\n\
  \n图 41-3\n\n导航图资源文件添加到项目后，它将出现在主面板，等待添加目的地。将编辑器切换到“代码”模式，并在添加任何目的地之前检查表的 XML：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n\n</navigation>\n```\n\n将编辑器切换回“设计”模式，注意目的地面板的“宿主”（Host）部分指示项目中未检测到任何导航宿主碎片：\n\
  \n![](img/as_4.1_navigation_no_hosts.jpg)\n\n图 41-4\n\n在向导航图添加任何目的地之前，下一步是向项目添加一个导航宿主碎片。\n\
  \n## 41.4 声明导航宿主\n\n\n\n\n\n对于此项目，导航宿片段（navigation host fragment）将包含在主 Activity\
  \ 的用户界面布局中。这意味着导航图中的目标片段（destination fragments）将出现在主 Activity 中目前由 `main_fragment.xml`\
  \ 布局占据的内容区域。在 Project 工具窗口中找到主 Activity 布局文件（`app -> res -> layout -> main_activity.xml`）并将其加载到布局编辑器。\n\
  \n在布局编辑器的设计（Design）模式下，从调色板（Palette）的 Containers 部分拖入 `NavHostFragment` 元素，将其释放到布局的容器区域，如图\
  \ 41-5 所示：\n\n![](img/as_3.6_add_navfragment.jpg)\n\n图 41-5\n\n在弹出的 Navigation Graphs\
  \ 对话框中，选择创建的 `navigation_graph.xml` 文件并点击 OK。\n\n在布局中选中新添加的 `NavHostFragment` 实例，使用属性（Attributes）窗口将其\
  \ ID 更改为 `demo_host_fragment`。\n\n将布局编辑器切换到代码（Code）模式并查看 XML 文件。注意编辑器已正确配置 `navGraph`\
  \ 属性以引用 `navigation_graph.xml` 文件，且 `defaultNavHost` 属性已设置为 true：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n由于在主 Activity 布局文件中配置了 `NavHostFragment`，需要从 `MainActivity.java`\
  \ 类中移除一些代码，以防止 Activity 加载 `main_fragment.xml` 文件。加载此文件，找到 `onCreate()` 方法并移除负责显示主片段的代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.main_activity);\n\
  \    if (savedInstanceState == null) {\n        // getSupportFragmentManager().beginTransaction()\n\
  \        //         .replace(R.id.container, MainFragment.newInstance())\n     \
  \   //         .commit\n\n返回 `navigation_graph.xml` 文件，确认已检测到 `NavHostFragment`\
  \ 实例（可能需要关闭并重新打开文件才能显示）：\n\n![](img/as_4.1_navigation_host_added.jpg)\n\n图 41-6\n\
  \n## 41.5 添加导航目标\n\n现在是在导航图中添加第一个目标了。由于项目已经有了第一个屏幕的片段（`main_fragment.xml`），这将是添加到图中第一个目标。点击图\
  \ 41-7 所示的 New Destination 按钮来选择或创建目标：\n\n![](img/as_4.1_navigation_add_destination.jpg)\n\
  \n图 41-7\n\n选择 `main_fragment` 作为目标，使其出现在图中：\n\n![](img/as_4.1_navigation_first_fragment_added.jpg)\n\
  \n图 41-8\n\n位于目标上首页图标表示这是起始目标（start destination）。这意味着当包含 `NavHostFragment` 的 Activity\
  \ 创建时，该目标将是第一个显示的。要将起始目标更改另一个目标，请在图中选中节点并点击工具栏上的首页按钮。\n\n通过将编辑器切换到代码模式查看导航图的 XML\
  \ 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/main_fragment\">\n    <fragment\n        android:id=\"\
  @+id/main_fragment\"\n        android:name=\"com.frenzy.navigation.ui.MainFragment\"\
  \n        android:label=\"main\"\n        tools:layout=\"@layout/main_fragment\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少还需要另一个目标。切换回设计模式并点击 New Destination 按钮，这次选择\
  \ Fragment 模板，并将新片段命名为 `SecondFragment`。在项目重新构建的简短等待后，新片段将作为另一个目标出现，如图 41-9 所示：\n\
  \n![](img/as_3.2_navigation_destination.jpg)\n\n图 41-9\n\n## 41.6 设计目标布局\n\n在添加用于目标间跳转的操作之前，现在是为目标片段添加一些用户界面组件的好时机。首先，双击\
  \ `mainFragment` 目标，使 `main_fragment.xml` 文件加载到布局编辑器。选中并删除当前的 `TextView` 控件，然后将\
  \ `Button` 和 `EditText` 控件拖放到布局中，使其看起来像图 41-10 所示：\n\n![](img/as_4.1_navigation_demo_ui.jpg)\n\
  \n图 41-10\n\n视图位置确定后，点击工具栏上的约束按钮为布局添加任何缺失的约束。选择 `EditText` 视图并使用属性窗口删除默认的“Name”文本，并将\
  \ ID 更改为 `userText`。\n\n返回 `navigation_graph.xml` 文件，双击 `secondFragment` 目标将 `fragment_second.xml`\
  \ 文件加载到布局编辑器，然后选中并删除的 `TextView` 实例。在组件树（Component Tree）面板中，右键点击 `FrameLayout` 并选择\
  \ `Convert from FrameLayout to ConstraintLayout...` 选项，在转换对话框中接受默认设置：\n\n![](img/as_3.2_navigation_convert_framayout.jpg)\n\
  \n图 41-11\n\n使用属性窗口将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`。由于片段布局管理器已转换为更灵活的\
  \ `ConstraintLayout`，拖入一个新的 `TextView` 控件使其位于布局中心，并点击约束按钮添加任何缺失的约束。选中新的 `TextView`，使用属性面板将\
  \ ID 更改为 `argText`。\n\n## 41.7 为导航图添加操作\n\n现在两个目标已添加到图中并设计了相应的用户界面布局，项目现在需要一种让用户从主片段导航到第二个片段的方法。这将通过向图中添加操作来实现，随后可以在应用代码中引用它。\n\
  \n要建立以主片段为起点、第二个片段为终点的操作连接，打开导航图并将鼠标指针悬停在 `mainFragment` 目标右边缘的垂直中心，此时会出现圆圈，如图 41-12\
  \ 高亮所示：\n\n![](img/as_4.1_navigation_connection_circle.jpg)\n\n图 41-12\n\n\n\n\n\
  点击圆内并拖动生成的线条到 `secondFragment` 目标：\n\n![](img/as_4.1_navigation_connecting.jpg)\n\
  图 41-13\n\n释放线条以建立起点和目的地之间的动作连接，此时线条将变为箭头，如图 41-14 所示：\n\n![](img/as_4.1_navigation_connected.jpg)\n\
  图 41-14\n\n随时可以通过选中动作连接并按下键盘上的 `Delete` 键来删除它。在选中箭头后，检查 `Attributes` 工具窗口中可用的属性，并将\
  \ `ID` 更改为 `mainToSecond`。代码代码引用该动作的 ID。将编辑器切换到 `Code` 模式，注意该动作已包含在 XML 中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n### 41.8 实现 OnFragmentInteractionListener\n\n在添加代码触发动作之前，需要修改\
  \ `MainActivity` 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白 fragment\
  \ 时在 `SecondFragment` 类中生成的。为了符合该接口，activity 需要实现一个名为 `onFragmentInteraction()`\
  \ 的方法，该方法用于实现 fragment 与 activity 之间的通信。\n\n编辑 `MainActivity.java` 文件并修改如下：\n\n\
  ```java\nimport android.net.Uri;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements SecondFragment.OnFragmentInteractionListener {\n    @Override\n   \
  \ protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main_activity);\n    }\n    @Override\n    public\
  \ void onFragmentInteraction(Uri uri) {\n    }\n}\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener`\
  \ 未定义（某些版本的 Android Studio 会自动添加，而其他版本则不会），请编辑 `SecondFragment.java` 文件并如下所示添加：\n\
  \n```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n```\n\n### 41.9 为目标 Fragment 添加 View Binding 支持\n\n由于我们需要访问 fragment\
  \ 布局中的某些视图，因此需要修改当前代码以启用 view binding 支持。从编辑 `MainFragment.java` 文件并进行以下更改：\n\n\
  ```java\nimport com.ebookfrenzy.navigationdemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n    @Nullable\n    @Override\n \
  \   public View onCreateView(@NonNull inflater, @Nullable ViewGroup container, @Nullable\
  \ Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n        binding = MainFragmentBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n    @Override\n    public void\
  \ onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n \
  \   }\n```\n\n对 `SecondFragment.java` 文件重复上述步骤，这次引用 `FragmentBinding`。\n\n### 41.10\
  \ 触发动作\n\n现在动作已添加到导航图中，下一步是在主 fragment 中添加一些代码，以便在点击 `Button` 控件时触发动作。找到 `MainFragment.java`\
  \ 文件，将其加载到代码编辑器中并修改 `onActivityCreated()` 方法，以获取按钮实例的引用，并配置 `OnClickListener` 实例以便在用户点击按钮时调用：\n\
  \n```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n    @Override\n    public void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      binding.button.setOnClickListener(new View.OnClickListener() {\n        \
  \    @Override\n            public void onClick(View view) {\n                Navigation.findNavController(view).navigate(R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n上述代码获取导航控制器的引用并在该实例上调用 `navigate()`\
  \ 方法，传递动作的资源 ID 作为参数。\n\n编译并运行应用，验证点击主 fragment 中的按钮是否跳转到第二个 fragment。\n\n### 41.11\
  \ 使用 Safeargs 传递数据\n\n目标是将主 fragment 中 `EditText` 视图输入的文本传递到第二个 fragment，并在 `TextView`\
  \ 控件上显示。如上一章所述，Android Navigation 组件支持两种传递数据的方法。本章将类型安全的传递。\n\n使用 `safeargs` 的第一步是在\
  \ Gradle 配置中添加 `safeargs` 插件。使用 Project 工具窗口定位并编辑项目级 `build.gradle` 文件（`Gradle Scripts`\
  \ -> `build.gradle (Project: NavigationDemo)`），如下所示添加插件依赖（再次提醒现在可能有更新版本）：\n\n```gradle\n\
  // 顶层构建文件，可为所有子项目/模块添加配置选项。\nbuildscript {\n    dependencies {\n        classpath(\"\
  androidx.navigation:navigation-safe-args-gradle-plugin:2.5.0-rc01\")\n    }\n}\n\
  plugins {\n    id 'com.android.application' version '7.2.0' apply false\n    id\
  \ 'com.android.library' version '7.2.0' apply false\n    id 'org.jetbrains.kotlin.android'\
  \ version '1.6.10' apply false\n}\n```\n\n接下来，编辑模块级 `build.gradle` 文件（`Gradle Scripts`\
  \ -> `build.gradle (Module: App)`），如下所示应用插件，并在提示时重新同步项目：\n\n```gradle\nplugins {\n\
  \    id 'com.android.application'\n    id 'androidx.navigation.safeargs'\n}\n\n\
  android {\n// ...\n}\n```\n\n\n\n\n下一步是定义目标接收的任何参数，在本例中，目标是第二个片段（fragment）。编辑导航图，选择\
  \ `secondFragment` 目标，并在属性（Attributes）工具窗口中定位到 `Arguments` 部分。点击 `+` 按钮（在图 41-15\
  \ 中突出显示）为目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n\n图 41-15\n\n点击\
  \ `+` 按钮后，将出一个对话框，在其中输入参数的名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，并在默认值字段中输入\
  \ `No Message`：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n\n图 41-16\n\
  \n新配置的参数将如下所示出现在 `navigation_graph.xml` 文件的 `secondFragment` 中：\n\n```xml\n<fragment\n\
  \    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigation.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \ />\n        android:defaultValue=\"No Message\"\n</fragment>\n```\n\n下一步是向 `MainFragment.java`\
  \ 文件添加代码，以从 `EditText` 视图提取文本并在导航动作期间将其传递给第二个片段。这将涉及使用由 `safeargs` 插件自动生成的特殊导航类。目前，导航涉及\
  \ `MainFragment` 类、`SecondFragment` 类、名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\
  \n当项目构建时，`safeargs` 插件将生成以下附加类，用于在导航过程中传递接收参数：\n\n- `MainFragmentDirections` - 此类表示导航动作的起点（使用导航源类名并在末尾附加“Directions”进行命名），并提供对动作对象的访问。\n\
  - `ActionMainToSecond` - 代表执行转换的的类（根据导航图文件中分配给动作的 ID 命名，前缀为“Action”）。该类包含目标上配置的每个参数的\
  \ setter 方法。例如，由于第二个片段目标包含一个名为 `message` 的参数，该类包含一个名为 `setMessage()` 的方法。配置完成后，将此类的的一个实例传递给导航控制器的\
  \ `navigate()` 方法以导航到目标。\n- `SecondFragmentArgs` - 在目标片段中用于访问从起点传递的参数的类（使用导航目标类名并在末尾附加“Args”命名）。该类包含传递给目标的每个参数的\
  \ getter 方法（即 `getMessage()`）。\n\n使用这些类，可以如下所示修改 `MainFragment.java` 文件中 `onActivityCreated()`\
  \ 方法内的 `OnClickListener` 代码，以从 `EditText` 控件中提取当前文本，将其应用于动作并启动到第二个片段的转换：\n\n```java\n\
  binding.button.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        Navigation.findNavController(view).navigate(\n\
  \                R.id.mainToSecond);\n        MainFragmentDirections.MainToSecond\
  \ action =\n                MainFragmentDirections.mainToSecond();\n        action.setMessage(binding.userText.getText().toString());\n\
  \        Navigation.findNavController(view).navigate(action);\n    }\n});\n```\n\
  \n上述代码获取了动作对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果\
  \ Android Studio 报告 `MainFragmentDirections` 未定义，使用 `Build -> Make Project` 菜单选项重新构建项目以生成该类。\n\
  \n剩下的只需修改 `SecondFragment.java` 类文件，在执行导航后接收参数并显示在 `TextView` 控件上。对于此示例，实现这些任务的代码将使用\
  \ `onStart()` 周期方法添加。编辑 `SecondFragment.java` 文件并添加此方法，使其读取如下：\n\n```java\n@Override\n\
  public void onStart() {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.text.setText(message);\n}\n\
  ```\n\n上述方法中的代码首先获取 args 对象的引用。接下来，调用 `SecondFragmentArgs` 的 `fromBundle()` 方法来提取消息。由于示例中的参数命名为\
  \ `message`，因此该字符串将显示在 `TextView` 上。编译并运行应用，在点击按钮之前输入一些文本。当第二个片段出现时，`TextView` 现在应该显示在主片段中输入的文本。\n\
  \n### 总结\n\n本章提供了一个如何使用 Navigation Component 结合 Android 导航图编辑器实现 Android 应用导航的实用示例。涵盖的主题包括包含现有和新目的的导航图的创建、在\
  \ Activity 中嵌入主机片段、编写触发导航事件的代码以及目标之间的参数传递。\n\n# MotionLayout 简介\n\n`MotionLayout`\
  \ 类为布局中的视图添加动画效果提供了一种简单的方法。本章将从 `MotionLayout` 的概述开始，介绍 `MotionScenes`（运动场景）、`Transitions`（过渡）和\
  \ `Keyframes`（关键帧）的概念。在这些基础知识后，接下来的两个章节（Android MotionLayout 教程 和 MotionLayout 关键循环教程）将提供\
  \ `MotionLayout` 动画的更多细节和示例。\n\n## MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局中视图从一个状态转换到另一个状态的动画。`MotionLayout`\
  \ 可以例如在指定时间内实现一个 `ImageView` 实例从屏幕左上角移动到右下角的动画。除了视图的位置，其他属性的变化也可以进行动画，例如颜色、大小或旋转角度。这些状态变化也可以进行插值（使得视图在动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间的直线执行，也可以通过位于起点和终点之间不同位置的路径来实现。`MotionLayout` 还支持使用触摸和滑动来启动和控制动画。\n\
  \n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写代码。这些 XML 声明可以在 Android Studio 代码编辑器中手动实现、使用\
  \ MotionLayout 编辑器视觉化实现，或者结合这两种方法。\n\n\n\n\n\n在实现动画时，用户界面中常用的 `ConstraintLayout`\
  \ 容器必须首先转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右键点击 `ConstraintLayout` 并选择 `Convert\
  \ to MotionLayout` 菜单来实现）。`MotionLayout` 还需要 2.0.0 版本的 `ConstraintLayout` 库。\n\n\
  不足意外，作为 `ConstraintLayout` 的子类，`MotionLayout` 支持 `ConstraintLayout` 的所有布局功能。因此，对于任何不需要动画的视图，在使用\
  \ `MotionLayout` 时，可以以完全相同的方式设计用户界面布局。\n\n对于需要动画的视图，会声明两个 `ConstraintSets` 来定义视图在动画开始和结束时的外观和位置。`transition`\
  \ 定义了关键帧，用于在这些开始和结束状态之间对目标视图应用额外效果，并带有用于启动和控制动画的点击和滑动处理程序。\n\n开始和结束的 `ConstraintSets`\
  \ 以及过渡（transitions）都声明在一个 `MotionScene` XML 文件中。\n\n## 42.3 MotionScene\n\n正如我们在前面的章节中看到的，XML\
  \ 布局文件包含了配置呈现给用户的用户的静态视图的外观和布局行为所需的信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（句话说，将被动画化的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个独立的\
  \ XML 文件中，称为 `MotionScene` 文件（之所以这样做是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入到布局 XML\
  \ 文件中，包含开始和结束的 `ConstraintSets` 以及 `Transition` 声明（文件可以包含多个 `ConstraintSet` 对和 `Transition`\
  \ 声明，允许将不同的动画作用于用户界面布局中的特定视图）。\n\n下面的列表显示了 `MotionScene` 文件的模板：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上面的 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），它们目前还没有包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的开始和结束点，并包含一个空的 `KeyFrameSet` 元素，准备好填充额外的动画关键帧条目。`Transition`\
  \ 元素还包含一个毫秒级的 `duration` 属性，用于控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的移动。例如，可以让开始和结束集合声明屏幕上的相同位置，然后使用过渡来动画其他属性的变化，如缩放和旋转角度。\n\
  \n## 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许在定位、尺寸以及与父布局和其他视图的关系方面，将全套\
  \ `ConstraintLayout` 设置应用于视图。此外，在 `ConstraintSet` 声明中还可能包含以下属性：\n\n- `alpha`\n-\
  \ `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n\
  - `translationY`\n- `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，为了在动画期间将视图旋转 180°，可以在开始和结束约束中声明以下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        .\n\
  \        .\n        motion:layout_constraintStart_toStartOf=\"parent\"\n       \
  \ android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet\
  \ android:id=\"@+id/end\">\n    <Constraint\n        .\n        .\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上面的更改告诉 `MotionLayout` 视图将从 0° 开始，然后在动画期间旋转完整的 180°，最后以倒置状态停止。\n\n## 42.5\
  \ 自定义属性\n\n除了上面列出的标准属性外，还可以指定范围的自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上可用的几乎任何属性都可以指定为自定义属性以包含在动画中。要识别属性名称，请从目标视图类的文档中查找\
  \ getter/setter 名称，删除 get/set 前缀并将剩余的第一个字母转为小写。例如，为了在代码中更改 `Button` 视图的背景颜色，我们可能会如下调用\
  \ `setBackgroundColor()` setter 方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下列表中的相应类型声明值：\n\n\
  - `motion:customBoolean` - 布尔属性值\n- `motion:customColorValue` - 属性值\n- `motion:customDimension`\
  \ - 维度属性值\n- `motion:customFloatValue` - 浮点属性值\n- `motion:customIntegerValue` -\
  \ 整数属性值\n- `motion:customStringValue` - 字符串属性值\n\n例如，颜色设置需要使用 `customColorValue`\
  \ 类型：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\n\
  \    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，下面的 `MotionScene` 文件片段除了将背景颜色从绿色变为红色外，还为视图声明了开始和结束约束：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_absoluteX=\"\
  21dp\"\n        android:id=\"@+button\"\n        motion:constraintTop_toTopOf=\"\
  parent\"\n        motion:constraintStart_toStartOf=\"parent\" >\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet android:id=\"\
  @+id/end\">\n    <Constraint\n        android:layout_width=\"wrap_content\"\n  \
  \      android:layout_height=\"wrap_content\"\n        motion:layout_absoluteY=\"\
  21dp\"\n        android:id=\"@+button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n## 42.6 触发动画\n\n如果没有某种形式的事件告诉 `MotionLayout` 启动动画，`MotionScene` 文件中的任何设置都不会对布局产生任何影响（例外是视图将根据开始\
  \ `ConstraintSet` 中的设置进行定位）。\n\n\n\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动手势（`OnSwipe`）来启动。`OnClick`\
  \ 处理器会导致动画开始并运行到完成，而 `OnSwipe` 则会同步动画，使其沿着时间轴来回移动以匹配触摸动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了选项，用于配置动画如何对不同方向的拖拽做出反应，以及滑动动作锚定在目标视图的哪侧。这允许例如向左的拖拽动作使视图向相应方向移动，同时防止向上运动导致视图向侧面移动（除非这确实是你需要的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 包含在 `MotionScene` 文件的 `Transition` 元素中。在两种情况下，都必须指定视图 ID。例如，要实现一个锚定在名为\
  \ `button` 的视图底部并响应向下拖拽动作的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition` 元素中：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，为同一个按钮添加一个 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\n\
  \    motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已设置为切换（toggle）模式。这种模式以及其他可用选项可以总结如下：\n\
  \n- `toggle`: 动画化到相反状态。例如，如果视图当前处于过渡的起始点，它将过渡到结束点，反之亦然。\n- `jumpToStart`: 立即更改到开始状态，没有动画。\n\
  - `jumpToEnd`: 立即更改到结束状态，没有动画。\n- `transitionToStart`: 带有动画过渡到开始状态。\n- `transitionToEnd`:\
  \ 带有动画过渡到结束状态。\n\n## 42.7 弧线运动 (Arc Motion)\n\n默认情况下，视图位置的移动将在起点和终点之间沿直线移动。要将运动改为弧线路径，只需在起始约束内如所示使用\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧线是凹的还是凸的：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n```...\n``` \n\n图 42-1 展示了 `startVertical` 和 `startHorizontal`\
  \ 弧线与默认直线运动的对比：\n\n![](img/motionlayout_arcMotion_three.jpg)\n\n图 42-1\n\n## 42.8\
  \ 关键帧 (Keyframes)\n\n为止列出的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。换句话说，如果旋转属性在终点设置为 180°，则旋转将在动画开始时并在到达终点时完成。因此，无法配置旋转在动画进行到\
  \ 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，这种效果可以使用关键帧（Keyframes）实现。\n\n关键帧用于定义动画过程中发生状态变化的中间点。例如，可以声明关键帧，使视图的背景颜色在动画进行到\
  \ 50% 处过渡为蓝色，在 75% 处变为绿色，并在动画结束时变回原始颜色。关键帧实现在 `MotionScene` 文件的 `Transition` 元素中，并嵌入在\
  \ `KeyFrameSet` 元素中。\n\n`MotionLayout` 支持几种类型的关键帧，可以总结如下：\n\n### 42.8.1 属性关键帧 (Attribute\
  \ Keyframes)\n\n属性关键帧（使用 `KeyAttribute` 声明）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持上述为\
  \ `ConstraintSets` 列出的相同属性集，并结合了指定更改在动画时间轴何处生效的能力。例如，以下关键帧声明将导致按钮视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐倍增：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:targetId=\"@+id/button\"\n            motion:framePosition=\"\
  50\"\n            motion:scaleX=\"2.0\" />\n        <KeyAttribute\n            motion:targetId=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            motion:scaleY=\"\
  2.0\" />\n    </KeyFrameSet>\n</Transition>\n```\n\n### 42.8.2 位置关键帧 (Position Keyframes)\n\
  \n位置关键帧（`KeyPosition`）用于修改视图在起点和终点之间移动时的路径。通过在时间轴上的不同点放置位置，可以对动画应用任何复杂程度的路径。使用 `x`\
  \ 和 `y` 坐标声明，这些坐标相对于以下坐标系之一声明：\n\n- `parentRelative`: `x` 和 `y` 坐标相对于父视图。\n- `deltaRelative`:\
  \ 不相对于父视图，`x` 和 `y` 坐标相对于起点和终点。例如，起点为 (0, 0)，终点为 (1, 1)。记住 `x` 和 `y` 坐标可以是负数。\n\
  - `pathRelative`: `x` 和 `y` 坐标相对于路径，起点和终点之间的直线作为图表的 X 轴。再次，坐标以百分比表示（0.0 到 1.0）。这与\
  \ `deltaRelative` 坐标空间相似，但考虑了路径的角度。坐标可以是负数。\n\n例如，以下 `ConstraintSets` 定义了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将跨越屏幕直线移动，如\
  \ 图 42-5 所示：\n\n![](img/motionlayout_straight_path.jpg)\n\n图 42-5\n\n然而，假设视图需要遵循下方\
  \ 图 42-6 所示的路径：\n\n![](img/motionlayout_wave_path.jpg)\n\n图 42-6\n\n为了实现此点，可以在过渡中如下声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:targetId=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n<KeyPosition\n    motion:targetId=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n\n\n\n上述元素使用\
  \ `pathRelative` 坐标系统在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位置位于 (0.75,\
  \ -0.3)。这些位置关键帧可以可视化如下方的 图 42-7 所示：\n\n![](img/motionlayout_curve_path.jpg)\n\n\
  图 42-7\n\n### 42.9 时间线性度\n\n在没有任何额外设置的情况下，上述的动画将以恒定速度执行。要更改动画的速度（例如使其加速和减速），可以在\
  \ `ConstraintSet` 或 `Keyframe` 中使用过渡缓动属性（`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在立方贝塞尔曲线（cubic\
  \ Bézier curve）上绘制点来定义线性线性度，例如：\n\n```xml\n.\n.\n      motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n      motion:transitionEasing=\"cubic(0.2, 0.7, 0.3, 1)\"\n      android:rotation=\"\
  360\">\n.\n.\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下 URL 上的在线曲线生成器：\n\n[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\
  \n然而，对于大多数需求，可以使用内置的标准、加速（accelerate）和减速（decelerate）值来指定缓动：\n\n```xml\n.\n.\n  \
  \    motion:layout_constraintBottom_toBottomOf=\"parent\"\n      motion:transitionEasing=\"\
  decelerate\"\n      android:rotation=\"360\">\n.\n.\n```\n\n### 42.10 KeyTrigger\n\
  \n触发关键帧（`KeyTrigger`）允许在动画到达动画时间轴内的指定帧位置时，调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画是向前运行还是反向运行调用不同的方法。假设有一个按钮在动画移动超过时间轴的\
  \ 20% 时变得可见。`KeyTrigger` 将按如下方式在 `Transition` 元素的 `KeyFrameSet` 中实现，并使用 `onPositiveCross`\
  \ 属性：\n\n```xml\n.\n.\n    <KeyFrameSet>\n          <KeyTrigger\n              motion:framePosition=\"\
  20\"\n              motion:onPositiveCross=\"show\"\n              motion:motionTarget=\"\
  @id/button\"/>\n.\n.\n```\n\n同样，如果动画反向运行并掉到 10% 以下时隐藏同一个按钮，可以使用 `onNegativeCross`\
  \ 属性添加第二个关键触发器：\n\n```xml\n<KeyTrigger\n      motion:framePosition=\"20\"\n    \
  \  motion:onNegativeCross=\"show\"\n      motion:motionTarget=\"@id/button2\"/>\n\
  ```\n\n如果动画使用切换动作（toggle action），只需使用 `onCross` 属性即可：\n\n```xml\n<KeyTrigger\n \
  \     motion:framePosition=\"20\"\n      motion:onCross=\"show\"\n      motion:motionTarget=\"\
  @id/button2\"/>\n```\n\n### 42.11 Cycle 和 Time Cycle 关键帧\n\n虽然位置关键帧可以用于向动画添加中间状态，但如果需要实现大量的重复位置和变化，这将很快变得非常麻烦。对于需要重复执行具有可预测状态变化的情况，MotionLayout\
  \ 包含了 `Cycle`（循环）和 `Time Cycle`（时间循环）关键帧，这一主题将在名为 “A MotionLayout KeyCycle Tutorial”\
  \ 的章节中详细介绍。\n\n### 42.12 从代码启动动画\n\n到本章为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 处理程序来控制动画。也可以通过调用\
  \ `MotionLayout` 实例上的方法从代码内部启动动画。例如，以下代码将为名为 `motionLayout` 的布局运行耗时为 2000ms 的从开始到结束的过渡：\n\
  \n```java\nmotionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n\
  ```\n\n在没有额外设置的情况下，用于动画的起始和结束状态将是 `MotionScene` 文件中 `Transition` 声明中声明的状态。要使用特定的起始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时通过其 ID 引用它们即可：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n要在动画运行时监控其状态，请如下所示为 `MotionLayout` 实例添加监听器：\n\
  \n```java\nMotionLayout.TransitionListener transitionListener = new MotionLayout.TransitionListener()\
  \ {\n    @Override\n    public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId) {\n        // 当过渡开始时调用\n    }\n    @Override\n    public void onTransitionChange(MotionLayout\
  \ motionLayout, int startId, float progress) {\n        // 每次属性发生变化时调用。跟踪进度\n  \
  \  }\n    @Override\n    public void onTransitionCompleted(MotionLayout motionLayout,\
  \ int endId) {\n        // 当过渡完成时调用\n    }\n    @Override\n    public void onTransitionTrigger(MotionLayout\
  \ motionLayout, int triggerId, boolean positive, float progress) {\n        // 当跨越触发关键帧阈值时调用\n\
  \    }\n};\nmotionLayout.setTransitionListener(transitionListener);\n```\n\n###\
  \ 42.13 总结\n\nMotionLayout 是 `ConstraintLayout` 的子类，专门设计用于为布局添加动画效果。MotionLayout\
  \ 通过动画由起始和结束集定义的两个状态来工作。可以使用关键帧在这些状态之间添加额外的动画效果。动画可以通过 `OnClick` 或 `OnSwipe` 处理程序触发，也可以通过\
  \ `MotionLayout` 实例的方法调用触发。\n\n### 43 Android MotionLayout 编辑器\n\n在学习了 MotionLayout\
  \ 的基础知识后，本章将提供在示例项目中尝试 MotionLayout 的机会。除了继续探索 MotionLayout 的主要功能外，本章还将引入 MotionLayout\
  \ 编辑器，并探索如何使用它视觉构建和修改动画。本章创建的项目将使用起始和结束 ConstraintSets、手势处理器以及属性。\n\n#### 43.1 创建\
  \ MotionLayout 项目\n\n点击欢迎屏幕上的 New Project 按钮，在新项目对话框中选择 Empty Activity 模板，然后点击 Next\
  \ 按钮。\n\n在 Name 字段输入 MotionLayoutDemo 并指定 com.ebookzy.motionlayout 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\
  \n\n\n\n\n此文件包含一个顶层 `MotionScene` 元素，其中包含 `ConstraintSet` 和 `Transition` 项，这些项将定义在主布局中执行的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及一个初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 MotionLayout 编辑器中进行的任何更改将存储在此文件中。同样，也可以直接编辑此文件，以便在 MotionLayout 编辑器之外实现和修改动画设置。在本教程中，将主要使用\
  \ MotionLayout 编辑器界面来实现动画。然而，在每个阶段，我们都会花时间回顾这些更改是如何反映在底层 `MotionScene` 文件中的。随着章节的进行，你会发现\
  \ `MotionScene` XML 语法实际上非常简单且易于学习。\n\n本教程的第一阶段将演示如何使用 MotionLayout 对 `Button` 对象制作动画，包括运动（包括跟随路径）、旋转和尺寸缩放。\n\
  \n### 43.3 配置起始和结束约束\n\n将 `activity_main.xml` 文件加载到 MotionLayout 编辑器后，请确保选中了 Motion\
  \ Layout 框（在下方图 43-5 中标记为 E），然后在从调色板拖放并释放 `Button` 视图到布局画布的左上角之前，删除默认的 `TextView`，如图\
  \ 43-4 所示：\n\n![](img/as_4.1_motion_layout_button_added.jpg)\n\n图 43-4\n\n选中按钮后，使用属性工具窗口将\
  \ `id` 改为 `myButton`。\n\n如上一章所述，MotionLayout 动画主要是指定视图如何在两个状态之间切换的案例。因此，实现动画的第一步是指定定义这些状态的约束。对于此示例，起始点将是布局视图的顶部中央。要配置这些约束，请在编辑器窗口中选择起始约束集项（在图\
  \ 43-5 中标记为 A）：\n\n![](img/as_4.0_motionlayout_editor_start_labeled.jpg)\n\n图 43-5\n\
  \n当选中起始框时，所有的约束和布局更改都将应用于起始点约束集。如要返回整个整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\n\
  接下来，在 `ConstraintSet` 列表中选择 `myButton` 项 (B)。注意，Source（源）列显示按钮是根据布局文件中的约束定位的。相反，我们希望按钮根据起始约束集进行定位。在仍选中\
  \ `myButton` 项的情况下，点击编辑按钮 (C) 并从菜单中选择 `Create Constraint`（创建约束），之后按钮项将指示该视图将根据起始约束集进行定位：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\n图 43-6\n\n起始约束集需要将按钮放置在布局顶部，并带有\
  \ 8dp 的偏移且水平居中。在 `myButton` 仍被选中的情况下，使用属性工具窗口对视图的顶部、左侧和右侧设置约束如下：\n\n![](img/as_4.0_motionlayout_start_constraints.jpg)\n\
  \n图 43-7\n\n选择结束约束集项（在上方图 43-5 中标记为 D），并重复步骤以创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 8p\
  \ 的偏移：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\n图 43-8\n\n配置好起始和结束约束后，打开\
  \ `activity_main_scene.xml` 文件，并注意约束已添加到文件中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    .\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTopTopOf=\"parent\"\n      \
  \      motion:layout_marginTop=\"8dp\"\n            motion:layout_constraintStartStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_EndOf=\"parent\"/>\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            motion:layout_marginBottom=\"8dp\"\n            motion:layout_constraintStartStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_EndOf=\"parent\"/>\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n同样注意 `Transition` 元素已预配置为在 1000 毫秒内在起始和结束点之间进行动画。尽管我们尚未添加操作来启动过渡，但仍然可以在\
  \ MotionLayout 编辑器中预览动画。\n\n### 43.4 预览 MotionLayout 动画\n\n为了在不构建和运行应用程序的情况下预览动画，请在\
  \ MotionLayout 编辑器中选择下方图 43-9 中标记为 A 的过渡箭头。这将动画时间轴面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  \n图 43-9\n\n要测试动画，点击滑块 (C) 并沿着时间轴移动。随着滑块移动，布局中的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮 (E) 执行完整动画，以不同的速度重复动画（向前、向后或往反复）。\n\
  \n### 43.5 添加点击手势\n\n虽然已经创建了简单的 MotionLayout 动画过渡，但我们仍然需要一种从运行程序内部启动动画的方法。这可以通过分配点击或滑动处理器来实现。对于此示例，我们将配置在用户点击按钮时启动动画。在\
  \ MotionLayout 编辑器中，如果时间轴动画当前处于循环运行，请先暂停。接下来，选择上方图 43-9 中标记为 A 的过渡箭头，在属性工具窗口中找到\
  \ OnClick 属性部分，并点击图 43-10 中箭头所示的 + 按钮：\n\n![](img/as_4.0_motionlayout_onclick_add.jpg)\n\
  \n图 43-10\n\nOnClick 面板会出现第一个空属性。对于属性名，输入 `targetId`，对于值字段输入按钮的 id (`@id/myButton`)。再次点击\
  \ + 按钮，这次在属性名字段中输入 `app:clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n![](img/as_4.0_motionlayout_onclick_actions.jpg)\n\
  \n图 43-11\n\n\n\n\n在此示例中，请选择切换（toggle）操作。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与图 43-12\
  \ 所示所示匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 43-12\n\n再次打开 `activity_main_scene.xml`\
  \ 文件并检查在 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"\
  @id/myButton\"\n        motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n\
  在设备或模拟器上编译并运行应用，确认点击按钮是否会导致它在 MotionScene 文件中定义的起始点和终点之间来回转换。\n\n### 43.6 为过渡添加属性关键帧\n\
  \n到目前为止，示例项目仅演示了按钮视图从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴内的点，使其他属性生效。例如，可以定义一个\
  \ `KeyAttribute`，使得视图移动到时间轴 30% 处时，其尺寸必须增加 50%。对于此示例，我们添加添加一个位于动画中点的旋转效果。\n\n首先，在\
  \ MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接箭头以显示时间轴，然后点击图 43-13 中高亮的按钮：\n\
  \n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n\n图 43-13\n\n从菜单中，选择\
  \ `KeyAttribute` 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n\
  \n图 43-14\n\n一旦选中，将出现图 43-15 所示的对话框。在对话框中，确保选中了 ID 选项并引用了 `myButton`。在位置字段中，输入 50（这以百分比指定，0\
  \ 是起始点，100 是终点）。最后，从属性下拉菜单中选择旋转（rotation）项，然后点击 `Add` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\
  \n图 43-15\n\n一旦添加了 `KeyAttribute`，时间轴内会出现一个该属性的行。点击该行将其高亮，然后点击该行最左侧的展开箭头以展开属性过渡图。注意，时间轴上会出现一个小的菱形标记（如下方的图\
  \ 43-16 所示），表示关键帧的位置。图表表示效果的线性度。在这种情况下，按钮将平稳地旋转到指定的度数，在关键帧位置处达到最大旋转。当它到达终点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_4.0_motionlayout_timeline_graph.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴中选择它，然后参考 Attributes 工具窗口。在 `KeyAttribute` 面板中，将旋转属性更改为 360 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\
  \n图 43-17\n\n通过来回移动滑块并观察按钮在穿过布局画布中的动画路径时的旋转情况，检查该属性是否正常工作。参考 `activity_main_scene.xml`\
  \ 文件，它现在应该如下所示：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\
  \n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"1000\">\n \
  \   <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"@+id/myButton\"\
  \n            motion:framePosition=\"50\"\n            android:rotation=\"360\"\
  \ />\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"@+id/myButton\"\n     \
  \   motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n使用过渡滑块或通过编译并运行应用来测试动画，验证按钮现在在动画期间会旋转。\n\
  \n### 43.7 为过渡添加自定义属性 (CustomAttribute)\n\n`KeyAttribute` 属性仅限于内置效果，如调整大小和旋转。通过声明\
  \ `CustomAttributes` 也可以进行额外的更改。与存储在 `Transition` 元素中的 `KeyAttributes` 不同，`CustomAttributes`\
  \ 位于起始和结束约束集中。因此，它们只能在起始点和终点声明。\n\n对于此示例，我们将配置按钮从红色逐渐变为绿色。首先，在图 43-18 中选择起始集，然后选择\
  \ `myButton` 视图：\n\n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\n图 43-18\n\
  \n参考 Attributes 窗口，点击 `CustomAttributes` 部分的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_attr_add.jpg)\n\
  \n图 43-19\n\n在生成的对话框中（图 43-20），将属性类型更改为 `Color` 并在 Name 字段输入 `backgroundColor`。最后，将其设置为\
  \ `#F0A1F`：\n\n![](img/as_4.0_motionlayout_attr_color.jpg)\n\n图 43-20\n\n点击 OK 提交更改，然后选择图\
  \ 43-18 中标记的结束集，重复上述步骤添加属性，这次指定 `#33CC3`。使用滑块或运行应用确保按钮在动画期间变化。这些 Attributes 的添加将反映在\
  \ `activity_main_scene.xml` 文件中：\n\n```xml\n<ConstraintSet id=\"@+id/start\">\n\
  \    <Constraint id=\"@+id/myButton\">\n        <CustomAttribute attributeName=\"\
  backgroundColor\" attributeValue=\"#F0A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet id=\"@+id/end\">\n    <Constraint id=\"@+id/myButton\">\n     \
  \   <CustomAttribute attributeName=\"backgroundColor\" attributeValue=\"#33CC3\"\
  \ />\n    </Constraint>\n</ConstraintSet>\n```\n\n### 43.8 添加位置关键帧 (Position Keyframes)\n\
  \n本教程的最后一个任务是为动画路径添加两个位置关键帧（`KeyPosition`），为动画引入一些横向运动。在 MotionLayout 编辑器中显示时间轴的情况下，点击上方图\
  \ 43-13 中的按钮创建一个关键帧，并从下方图 43-21 所示的菜单中选择 `KeyPosition` 选项：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\
  \n图 43-21\n\n在生成的对话框中，按照图 43-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n\
  \n图 43-22\n\n点击 `Add` 按钮提交更改，然后重复上述步骤添加配置如下的第二个位置关键帧：\n\n- Position: 75\n- Type:\
  \ `parentRelative`\n- PercentX: 0.85\n- PercentY: 0.75\n\n完成这些更改后，`activity_main_scene.xml`\
  \ 文件中的 `transition` 元素将添加以下关键帧条目：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n \
  \       motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"25\"\
  \n        motion:keyPositionType=\"parentRelative\" />\n</KeyFrameSet>\n```\n\n\n\
  \n\n```xml\nmotion:percentX=\"0.15\"\nmotion:percentY=\"0.25\" />\n<KeyPosition\n\
  \    motion:motionTarget=\"@+id/myButton\"\n    motion:framePosition=\"75\"\n  \
  \  motion:keyPositionType=\"parentRelative\"\n    motion:percentX=\"0.85\"\n   \
  \ motion:percentY=\"0.75\" />\n</KeyFrameSet>\n```\n\n最后一次测试应用，验证按钮现在遵循下方所示的路径，同时仍在旋转并改变颜色：\n\
  \n![](img/as_4.0_motionlayout_zig_zag.jpg)\n图 43-23\n\n位置关键帧由预览画布中表示运动路径的虚线上的菱形标记表示，如\
  \ 图 43-24 所示（如果标记不可见，请确保在预览中选中了 `Button` 视图）：\n\n![](img/as_4.1_motion_layout_position_markers.jpg)\n\
  图 43-24\n\n要在视觉上调整关键帧的位置，只需点击标记并将其拖到新位置。随着标记移动，Motion Layout 编辑器将显示一个网格以及当前的 x 和\
  \ y 坐标：\n\n![](img/as_4.1_motion_layout_position_marker_drag.jpg)\n图 43-25\n\n##\
  \ 43.9 总结\n\n本章介绍了 Android Studio 内置的 `MotionLayout` 编辑器，并探索了如何使用它为 Android 应用的用户界面添加动画，而无需手动编写\
  \ XML 声明。本章涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在 `MotionScene` 文件中创建起始和结束约束集以及过渡，以及添加\
  \ `OnClick` 处理器。此外还涵盖了动画预览器、自定义属性和位置关键帧的使用。\n\n## 44. MotionLayout 关键帧循环教程\n\n之前的章节介绍并演示了使用\
  \ `MotionLayout` 容器结合 Android Studio `MotionLayout` 编辑器的功能将动画集成到 Android 应用用户界面面的概念。标题为\
  \ “MotionLayout 简介” 的章节简要提到了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现涉及大量重复状态更改的动画。\n\
  \n本章将更详细地介绍循环关键帧，然后演示如何在使用 Android Studio 和循环编辑器的示例项目中使用它们。\n\n### 44.1 循环关键帧概览\n\
  \n显然，位置关键帧可以用于向动画时间轴添加中间状态更改。虽然这对于较少的状态更改效果良好，但如果要实现大量的状态更改，操作起来将非常繁琐。例如，为了在点击按钮时让它抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和逆时针旋转。同样，在视图跨越屏幕移动时实现弹跳效果也是一项同样耗时的任务。\n\
  \n对于需要重复执行状态更改的情况，`MotionLayout` 包含了 `Cycle`（循环）和 `Time Cycle`（时间循环）关键帧。两者都执行相同的任务，区别在于\
  \ `KeyCycle` 帧基于动画路径中的帧位置，而 `KeyTimeCycles` 是基于每秒循环次数（Hz）的时间的。\n\n使用这些 `KeyCycle`\
  \ 帧，动画时间轴本质上被划分为若干子部分（称为循环），每个部分包含一个或多个波形，定义了视图属性在整个时间轴上如何被修改。创建一个 `KeyCycle` 循环，需要以下信息：\n\
  \n- **目标视图 (target view)**：要进行更改的视图的 id。\n- **帧位置 (frame position)**：循环开始的时间轴位置。\n\
  - **波周期 (wave period)**：循环中包含的波形数量。\n- **属性 (attribute)**：要被波形修改的视图属性。\n- **波偏移\
  \ (wave offset)**：相对于关键帧基准按指定量偏移循环。\n- **波形 (wave shape)**：波的形状（正弦、余弦、锯齿波、方波、三角形、弹跳或反锯齿波）。\n\
  \n考虑以下循环关键帧集：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"\
  0\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\
  \n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n</KeyFrameSet>\n\
  ```\n\n上述关键帧集将时间轴划分为四个相等的循环。每个循环配置为包含一个正弦波，以调整按钮的 `translationY` 属性。如 图 44-1 所示，其中圆点代表关键帧位置：\n\
  \n![](img/as_4.0_keycycle_simple.jpg)\n图 44-1\n\n目前的实现中，每个循环包含一个波。假设在这些均匀分布的波中，我们从最后一个循环中需要四个波。这可以通过增加最后一个\
  \ `KeyCycle` 元素的 `wavePeriod` 属性轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  50dp\"/>\n```\n\n进行此更改后，帧集可以如下波的形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\
  图 44-2\n\n到目前为止，本章的示例一直正弦波。事实上，在 `MotionLayout` 中处理循环关键帧时有许多不同的波形。例如，图 44-3 展示了将所有循环关键帧的\
  \ `waveShape` 属性更改为锯齿波形状的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 44-3\n\n\
  除了正弦和锯齿波，`MotionLayout` 还支持三角形、方波、弹跳和反锯齿波形。\n\n在上述示例中，每个循环在 Y 轴的相同范围内移动按钮。然而，假设我们需要第二个循环沿正\
  \ Y 轴移动更大的距离。这涉及对第二个循环的 `waveOffset` 属性进行调整：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  25\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\
  \n通过此更改，我们得到一个时间轴类似于 图 44-4：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n图 44-4\n\
  \n现在，第二个循环期间按钮的运动在 Y 轴上的范围大约在 0 到 150dp 之间。如果我们仍然需要范围的低端与其他波匹配，我们当然可以为 `translationY`\
  \ 值增加 100dp：\n\n```xml\n<KeyCycle\n```\n\n\n\n\n\n```xml\nmotion:framePosition=\"\
  25\"\nmotion:target=\"@+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"\
  100dp\"\nmotion:waveShape=\"sin\"\nandroid:translationY=\"150dp\"/>\n```\n\n此更改现在为我们提供了以下波形：\n\
  \n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\n图 44-5\n\n## 44.2 使用循环编辑器\
  \ (Cycle Editor)\n\n虽然并不复杂，但通过直接在 `MotionScene` 文件中编辑 XML `KeyCycle` 条目来获取所需的精确循环配置可能需要一些时间。针对这一点，Google\
  \ 的 Android 工程师开发了 `Cycle Editor`。这是一个独立的 Java 工具，目前尚未成为 Android Studio 的一部分。`Cycle\
  \ Editor` 允许你可视化地设计和测试循环关键帧集。\n\n`Cycle Editor` 工具以 Java 归档（jar）文件的形式提供，这需要在你的开发系统中安装\
  \ Java 运行环境。安装 Java 的步骤取决于你的操作系统。\n\n一旦安装了 Java，即可从以下 URL 下载 `CycleEditor.jar` 文件：\n\
  \nhttps://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar\n\
  \n下载完成后，打开命令提示符或终端窗口，切换目录到 `jar` 文件所在位置并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将出现如图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n图\
  \ 44-6\n\n上图中标记为 A 的面板显示关键帧集的 XML，可以直接编辑，也可以使用 B 面板中的控件进行编辑。C 面板显示循环以波形形式呈现的渲染结果。遗憾的是，在进行更改时，它不会进行实时重绘。相反，必须通过选择\
  \ `File -> Parse XML` 菜单选项来刷新。当点击 B 面板中的播放按钮时，标记为 D 的面板将显示循环动画的实时渲染。`Examples` 菜单提供了一系列示例关键帧集，这些既可以用于学习，也可以作为你自己动画的基础。\n\
  \n为了演示循环关键帧（Cycle Keyframe）和循环编辑器（Cycle Editor）的使用，本章剩余部分将创建一个基于 `KeyCycle` 的动画效果示例项目。\n\
  \n## 44.3 创建 KeyCycleDemo 项目\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并指定 `com.ebookfrenzy.keycycledemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ `Java`。\n\n当布局编辑器处于 Design 模式并打开了 `activity_main.xml` 文件时，右键点击 `ConstraintLayout`\
  \ 条目并选择 `Convert to MotionLayout` 菜单选项：\n\n![](img/as_4.0_motionlayout_conversion1.jpg)\n\
  \n图 44-7\n\n做出选择后，点击确认对话框中的 `Convert` 按钮。\n\n## 44.4 配置起始和结束约束\n\n本教程的目标是让按钮从设备屏幕的一侧移动到另一侧，包括导致视图沿\
  \ `Y-axis` 上下移动的 `KeyCycle` 效果。第一步是配置起始和结束约束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器中，选择并删除默认的 `TextView`。在调色板拖入 `Button` 视图之前，确保选择了下方图 44-9 中的 E 的 `Motion Layout`\
  \ 框，使其垂直居中并位于画布的左边缘：\n\n![](img/as_4.1_keycycledemo_button_added.jpg)\n\n图 44-8\n\
  \n要配置起始点的约束，选择编辑器中标记为图 44-9 A 的起始约束条目：\n\n![](img/as_4.0_keycycle_editor_labelled.jpg)\n\
  \n图 44-9\n\n接下来，选择 `Constraint` 列表中的按钮条目。在按钮条目仍选中的状态下，点击按钮 (C) 并选择 `Create Constraint`。在按钮仍选中的状态下，使用\
  \ `Attributes` 工具窗口为视图的顶部和底部设置约束：\n\n![](img/as_4.0_keycycle_start_constraint.jpg)\n\
  \n图 44-10\n\n选择上方标记为图 44-9 D 的结束约束条目，重复步骤创建一个新约束，这次在顶部、底部和右侧设置：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  \n图 44-11\n\n## 44.5 创建循环\n\n下一步是使用 `Cycle Editor` 生成动画的循环关键帧。在 `Cycle Editor` 运行时，参考下方图\
  \ 44-12 所示的控制面板：\n\n![](img/as_4.0_keycycle_control_panel.jpg)\n\n图 44-12\n\n使用标记为\
  \ A 的菜单将要修改的属性从 `rotation` 更改为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制 (B) 选择循环\
  \ 0，以便面板中的其他更改将应用到第一个循环。将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`，如图 44-13\
  \ 所示（移动滑块时参考 `XML` 面板查看精确的 `translationY` 值）：\n\n![](img/as_4.0_keycycle_editor_cycle_0.jpg)\n\
  \n图 44-13\n\n要查看图中的更改，选择 `File -> Parse XML` 菜单选项。使用表 44-1 列出的值配置 `KeyFrames` 1\
  \ 到 4（注意你已经配置了 `KeyCycle` 0 列的设置）：\n\n| KeyCycle 0 | KeyCycle 1 | KeyCycle 2 | KeyCycle\
  \ 3 | KeyCycle 4 |\n| :--- | :--- | :--- | :--- | :--- |\n| Position | 0 | 25 |\
  \ 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60 | 60 | 150\
  \ | 60 | 60 |\n\n完成这些更改后，关键帧 XML 如下：\n\n```xml\n<KeySet>\n  <KeyCycle\n    motion:framePosition=\"\
  0\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"60dp\"/>\n  <KeyCycle\n\
  \    motion:framePosition=\"25\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"\
  2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"50\"\n    motion:target=\"@+id/button\"\
  \n    motion:wavePeriod=\"3\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"150dp\"/>\n  <KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"60dp\"/>\n  <KeyCycle\n\
  \    motion:framePosition=\"100\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"\
  1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n查看带有新循环的图表，选择 `File -> Parse XML` 菜单选项以刷新波形，该波形现在应该如图\
  \ 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\n图 44-14\n\
  \n## 44.6 预览动画\n\n\n\n\n\n现在可以在 Cycle Editor（循环编辑器）工具内部预览基于循环的动画。点击播放按钮（在图 44-15\
  \ 中标记为 A）启动动画。要将循环与水平移动结合，将第二个菜单 (B) 从 `Stationary`（静态）更改为 `West`（西）或 `East`（东）。此外，花些时间实验时间和线性的设置（C\
  \ 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\n### 图 44-15\n\n## 44.7 向\
  \ MotionScene 中添加 KeyFrameSet\n\n在 `Cycle Editor` 中，从 XML 面板选中并复制 `KeyCycle` 元素，并将它们粘贴到\
  \ `Android Studio` 中 `res -> xml -> activity_main_scene.xml` 文件的 `Transition` 部分，使其放置在现有的\
  \ `KeyFrameSet` 标记之间。同时请注意增加的持续时间设置以及为了启动动画而添加的 `OnClick` 处理器：\n\n```xml\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n        \
  \    motion:framePosition=\"0\"\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:wavePeriod=\"1\"\n            motion:waveOffset=\"0dp\"\n \
  \           motion:waveShape=\"sin\"\n            android:translationY=\"60dp\"\
  />\n        <KeyCycle\n            motion:framePosition=\"25\"\n.\n.\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/button\"\n              motion:clickAction=\"\
  toggle\" />\n.\n.\n```\n\n在继续之前，检查每个目标属性是否已正确声明。在编写时，`Cycle Editor` 使用的是过时的 `motion:target`\
  \ 标签。例如：\n\n`motion:target=\"@+id/button\"`\n\n需要将这五个 `KeyCycle` 条目中的每一个都更改如下所示：\n\
  \n`motion:motionTarget=\"@+id/button\"`\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮开始并查看动画。\n\
  \n请注意，`KeyCycle` 的波形也可以在 `Android Studio MotionLayout` 编辑器中查看，如下方的图 44-16 所示：\n\n\
  ![](img/as_4.0_keycycle_motionlayout_timeline_waves.jpg)\n\n### 图 44-16\n\n`KeyCycle`\
  \ 帧集不限于每个动画只有一个。例如，将以下 `KeyFrameSet` 添加到 `activity_main_scene.xml` 文件的 `Transition`\
  \ 部分，以便为按钮在移动时添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"\
  0\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\
  \n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"\n        android:rotation=\"80\"/>\n    <KeyCycle\n\
  \        motion:framePosition=\"50\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"150dp\"\n        android:rotation=\"45\"/>\n\
  \    <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"\n    \
  \    android:rotation=\"80\"/>\n    <KeyCycle\n        motion:framePosition=\"100\"\
  \n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n\
  \        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n</KeyFrameSet>\n```\n\n## 44.8 总结\n\n\
  循环关键帧提供了一种构建涉及大量状态变化的帧动画的有用方法。正如本章概述的，通过使用 Cycle Editor 应用可以显著简化生成这些循环关键帧的过程。\n\n\
  ## 45 使用悬浮操作按钮和 Snackbar\n\n本章的目标之一是提供 Material Design（材料设计）概念的概述。Material 设计最初作为\
  \ Android 5.0 的一部分引入，是一套设计指南，规定了 Android 用户界面以及运行在 Android 上的应用的外观和行为。\n\n作为实现材料设计概念的一部分，Google\
  \ 还引入了 Android Design Support Library（Android 设计支持库）。该库包含许多不同的组件，允许将材料设计的许多关键功能构建到\
  \ Android 应用中。这些组件中的两个——悬浮操作按钮和 `Snackbar` 也将在本章中介绍，并在随后的章节中介绍许多其他组件。\n\n## 45.1\
  \ Material Design\n\nAndroid 环境的整体外观由 Material 设计原则定义。Material 设计由 Google 团队创建，规定了\
  \ Android 用户界面以及运行在其上的应用在行为、阴影、动画和样式方面以何种方式呈现。材料设计的一个原则是用户界面元素看起来具有物理深度，并且感觉是由物理材料构造而成的。例如，通过使用阴影效果，按钮似乎浮在其所在的布局之上。\n\
  \nMaterial 设计还规定了许多标准用户界面元素的布局和行为。一个关键例子是位于屏幕顶部的应用栏的外观，以及它相对于活动主体内的滚动活动应该如何表现。\n\
  \n事实上，Material 设计涵盖了从推荐颜色样式到对象动画方式的广泛领域。材料设计概念和指南的完整描述可以通过链接获取，它是所有 Android 开发者的推荐阅读材料：\n\
  \n[`material.io/design/introduction`](https://material.io/design/introduction)\n\
  \n## 45.2 设计库\n\n实现采用设计原则的 Android 应用所需的许多构建模块包含在 Design Support Library 中。该库包含一组用户界面组件，可以包含在\
  \ Android 应用中以实现材料设计的外观、感觉和行为。该库中的两个组件——悬浮操作按钮和 Snackbar 将在本章中介绍，而其他将在后续章节介绍。\n\n\
  ### 45.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一个浮在应用用户界面上方的按钮，通常用于推广用户界面屏幕中最常见的操作。例如，悬浮操作按钮可能会放置在屏幕上，允许用户向联系列表添加条目或从应用内发送电子邮件。图\
  \ 45-1 例如，突出了允许用户在标准 Android 电话应用中显示键盘的悬浮操作按钮：\n\n![](img/phone_app.jpg)\n\n###\
  \ 图 45-1\n\n\n\n\n\n为了符合材料设计指南，在使用悬浮按钮（Floating Action Buttons）时应遵循若干规则。悬浮按钮必须是圆形的，尺寸可以是\
  \ 56 x 56dp（默认）或 40 x 40dp（微型）。在手机上，按钮应距离屏幕边缘至少 16dp，在桌面电脑和平板设备上至少为 24dp。无论大小如何，按钮必须包含一个大小为\
  \ 24x24dp 的内部图标，并且建议每个用户界面只包含一个悬浮按钮。\n\n悬浮按钮可以带有动画效果，或者设计为触碰时变形为其他项目。例如，悬浮按钮可以在点击时旋转，或者变形为其他元素，如工具栏或相关操作列表面板。\n\
  \n## 45.4 Snackbar\n\nSnackbar 组件提供了一种以面板形式出现在屏幕底部的方式向用户展示信息的方法，如图 45-2 所示。Snackbar\
  \ 实例包含一条简短的文本消息和一个可选的操作按钮，用户点击该按钮将执行某项任务。显示后， Snackbar 将自动超时，也可以由用户通过滑动操作手动移除。在\
  \ Snackbar 出现期间，应用将继续运行并以正常方式响应用户交互。\n\n![](img/Image2434.jpg)??\n\n图 45-2\n\n在本章的剩余部分，将创建一个示例应用程序，该程序将利用悬浮按钮和\
  \ Snackbar 的基本功能向项目列表添加项目。\n\n## 45.5 创建示例项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前，选择“Basic\
  \ Activity (Material3)”模板。\n\n在 Name 字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ Language 菜单设置为 `Java`。\n\n## 45.6 审查项目\n\n由于选择了 Basic Activity 模板，该 activity 包含四个布局文件。`activity_main.xml`\
  \ 文件由一个 `CoordinatorLayout` 布局组成，其中包含应用栏、Material 工具栏和悬浮按钮的条目。\n\n`content_main.xml`\
  \ 文件代表 activity 内容区域的布局，并包含一个 `NavHostFragment` 实例。该文件通过以下 include 指令嵌入到 `activity_main.xml`\
  \ 文件中：\n\n```xml\n<include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml`\
  \ 文件中的悬浮按钮元素内容如下：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明了按钮将出现在屏幕的右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识表示（在此情况下被设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准 drawable 内置邮件图标的形式。\n\
  \n空白模板还配置了悬浮按钮，当用户点击时显示 Snackbar 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中找到，内容如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n该代码通过视图绑定（view binding）访问悬浮按钮，并为其添加了一个\
  \ `onClick` 处理程序，在点击按钮时调用。此方法简单地显示了一个配置了消息但没有操作的 Snackbar 实例。\n\n当项目编译并运行后，悬浮按钮将出现在屏幕底部，如图\
  \ 45-3 所示：\n\n![](img/as_default_fab.jpg)\n\n图 45-3\n\n点击悬浮按钮将触发 `onClick` 处理方法，导致\
  \ Snackbar 出现在屏幕底部：\n\n![](img/as_default_fab_snackbar.jpg)\n\n图 45-4\n\n## 45.7\
  \ 移除导航功能\n\n如“A Guide to the Android Studio Layout Editor Tool”概述，Basic Activity\
  \ 模板包含多个 fragment 和按钮，用于在不同 fragment 之间导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后会导致问题。在继续教程之前，按照以下方式修改项目：\n\
  \n1. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在 Component Tree（组件树）面板中选择 `SecondFragment` 条目，按下键盘删除键将其从图中移除。\n3. 找到并删除\
  \ `SecondFragment.java` (`app -> java -> SecondFragment`) 和 `fragment_second.xml`\
  \ (`app -> res -> layout -> fragment_second`) 文件。\n4. 找到 `FirstFragment.java` 文件，双击它加载到编辑器，并修改\
  \ `onViewCreated()` 方法代码如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(view).navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \    }\n});\n```\n\n## 45.8 更改操作按钮\n\n由于示例的目标是配置悬浮按钮向列表添加项目，因此当前显示的按钮图标需要更改为指示执行的操作。用于按钮的图标名为\
  \ `ic_add_entry.png`，可以在此处 URL 下载的示例文件夹中找到：[`www.ebookfrenzy.com/retail/chipjava.php`](https://www.ebookfrenzy.com/retail/chipjava.php)\n\
  \n在文件系统中找到该图像。右键点击 Project 工具窗口中的 `app -> res -> drawable` 条目并选择菜单中的 Paste 以将文件添加到文件夹：\n\
  \n![](img/as_added.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml` 文件，将图标源从 `@android:drawable/ic_dialog_email`\
  \ 更改为 `@drawable/ic_add_entry`：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的内部图标已变为加号。\n\
  \n我们也可以通过向 `OnClickListener` 添加代码，让悬浮按钮在点击时执行任何操作。例如，`MainActivity.java` 文件的以下更改将在每次点击按钮时调用名为\
  \ `displayMessage()` 的方法来显示吐司消息：\n\n```java\n.\n.\nimport android.widget.Toast;\n\
  .\n.\nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        displayMessage(\"Fab clicked\");\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Action\", null).show();\n    }\n});\n```\n.\n.\n\n\
  \n\n\n\n```java\npublic void displayMessage(String message) {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n\
  }\n```\n\n## 45.9 为 Snackbar 添加动作\n\n也可以向 `Snackbar` 添加一个动作，该动作在用户点击时会执行特定任务。编辑\
  \ `MainActivity.java` 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”（我的动作）的动作，该动作配置了一个名为\
  \ `actionOnClickListener` 的 `onClickListener`，它会显示一条吐司消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"My Action\", actionOnClickListener).show();\n    }\n\
  });\n```\n\n在 `MainActivity.java` 文件中添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    displayMessage(\"\
  Action clicked\");\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Action Complete\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n    }\n};\n```\n\n运行应用并点击悬浮动作按钮（FAB），此时吐司消息和 `Snackbar` 应该都会出现。当\
  \ `Snackbar` 可见时，点击 `Snackbar` 中的 \"My Action\" 按钮，并验证 `Snackbar` 上的文字已变为“Action\
  \ Complete”（动作已完成）：\n\n![](img/as_fab_action_clicked.jpg)\n\n图 45-6\n\n## 45.10\
  \ 总结\n\n本章在通过使用这些功能的示例项目之前，对 Material Design（材料设计）、悬浮动作按钮和 `Snackbar` 提供了概概述。\n\n\
  悬浮动作按钮和 `Snackbar` 都是 Android 用户界面实现 Material Design 方法的一部分。悬浮动作按钮提供了一种在 Android\
  \ 应用特定屏幕内推广最常用操作的方法。`Snackbar` 则为应用程序提供了一种向用户展示信息并允许用户对信息采取操作的方法。\n\n## 46. 使用 TabLayout\
  \ 组件创建标签页界面\n\n上一章概述了 Android 中 Material Design 的概念，并介绍了设计支持库提供的两个组件：悬浮动作按钮和 `Snackbar`。本章将演示如何使用设计库的另一个组件\
  \ `TabLayout`，它可以与 `ViewPager` 类结合使用，在 Android Activity 中创建一个基于标签页的界面。\n\n## 46.1\
  \ ViewPager2 简介\n\n尽管 `ViewPager2` 不属于设计支持库的一部分，但在与 `TabLayout` 组件结合使用来实现标签页用户界面时，它是一个非常有用的辅助类。`ViewPager2`\
  \ 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局片段（layout fragment）表示。与 `ViewPager2` 关联的片段由 `FragmentPagerAdapter`\
  \ 类的实例管理。\n\n至少分配给 `ViewPager2` 的分页适配器必须实现两个方法。第一个方法命名为 `getItemCount()`，必须返回可显示给用户的所有页面片段总数。第二个方法\
  \ `createFragment()` 接收一个页码，并必须返回相应的、准备好向用户显示的片段对象。\n\n### 46.2 TabLayout 组件概述\n\
  \n如前所述，`TabLayout` 是作为 Material Design 引入的组件之一，包含在设计支持库中。`TabLayout` 的目的是向用户提供一行标签，用户可以通过选择这些标签来显示不同的页面。标签可以是固定的，也可以是可滚动的，用户可以向左或向右滑动以查看当前屏幕无法显示的更多标签。标签上显示的信息可以是文本、图像或文本与图像的组合。例如，[图\
  \ 46-1] 显示了一个包含四个显示图像标签的应用标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n另一方面，[图 46-2]\
  \ 显示了一个 `TabLayout` 配置，它由四个显示文本的标签组成且采用滚动配置：\n\n![](img/Image24341.jpg)\n\n图 46-2\n\
  \n本章的剩余部分将通过创建一个示例项目，逐一演示如何将 `TabLayout` 组件与 `ViewPager2` 以及四个片段一起使用。\n\n### 46.3\
  \ 创建 TabLayoutDemo 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，选择 `Basic Activity\
  \ (Material3)` 模板然后点击 Next（下一步）按钮。\n\n在 Name 字段中输入 `TabLayoutDemo`，并指定 `com.ebookfrenzy.tablayoutdemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为\
  \ Java。\n\n一旦项目创建完成，将 `content_main.xml` 加载到 Layout Editor 工具中，选择 `NavHostFragment`\
  \ 对象并将其删除。由于我们不会使用 Basic Activity 模板的导航功能，请编辑 `MainActivity.java` 文件并修改 `onCreate`\
  \ 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarNavController(this, navController);\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                    .setAction(\"Action\", null).show();\n        }\n    });\n\
  }\n```\n\n最后，删除 `onSupportNavigateUp()` 方法：\n\n```java\n@Override\npublic boolean\
  \ onSupportNavigateUp() {\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment);\n    return NavigationUI.navigateUp(navController, appBarConfiguration)\
  \ || super.onSupportNavigateUp();\n}\n```\n\n## 46.4 创建第一个片段\n\n`TabLayout`上的每个标签在选中时都会显示不同的片段。通过在\
  \ Project 工具窗口中右键点击 `app -> java -> com -> ebookfrenzy -> tablayoutdemo` 项并选择 `New\
  \ -> Fragment -> Fragment (Blank)` 来创建第一个片段。在对话框中，在 Fragment Name 字段中输入 `Tab1Fragment`，在\
  \ Fragment Layout Name 字段中输入 `fragment_tab1`。点击 Finish 按钮创建新片段：\n\n![](img/as_4.2_new_fragment_java.jpg)\n\
  \n图 46-3\n\n编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有自动添加，请按如下添加 `OnFragmentInteractionListener`\
  \ 接口声明：\n\n```java\n...\nimport android.net.Uri;\n...\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n...\n```\n\n将新创建的 `fragment_tab1.xml` 文件（位于 `app -> res -> layout`）加载到\
  \ Layout Editor 中，右键点击 Component Tree 面中的 `FrameLayout` 项并选择 `Convert FrameLayout\
  \ to ConstraintLayout` 菜单选项。在对话框中，点击 OK 之前确认所有转换选项均已选中。将布局的 ID 更改为 `constraintLayout`。\n\
  \n\n\n\n一旦布局已转换为 `ConstraintLayout`，请从布局中删除 `TextView`。从调色板（Palette）中找到 `TextView`\
  \ 控件，将其拖放并放置在布局的中心。编辑该对象的文本属性，使其显示为“Tab 1 Fragment”，并将该字符串提取为名为 `tab_1_fragment`\
  \ 的资源，此时布局应与图 46-4 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n\n图 46-4\n\
  \n## 46.5 复制片段（Fragments）\n\n到目前为止，项目包含了四个必需片段中的一个。与其使用之前的步骤创建其余三个片段，不如复制第一个片段来更快。每个片段都由一个布局\
  \ XML 文件和一个 Java 类文件组成，这两个文件都需要复制。\n\n在项目（Project）工具窗口中右键点击 `fragment_tab1.xml`\
  \ 文件，并在弹出的菜单中选择 `Copy`（复制）选项。再次右键点击布局项，这次选择 `Paste`（粘贴）选项。在弹出的对话框中，点击 `OK` 按钮之前将新布局文件命名为\
  \ `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml` 文件，并将 Text View 文本更改为“Tab 2 Fragment”，按照通常步骤将该字符串提取为名为\
  \ `tab_2_fragment` 的资源。\n\n要复制 `Tab1Fragment` 类文件，右键点击 `app -> java -> com -> ebookfrenzy\
  \ -> tablayoutdemo` 下列出的类并选择 `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 项并选择 `Paste`。在\
  \ `Copy Class` 对话框中，在 `New name:` 字段中输入 `Tab2Fragment` 并点击 `OK`。编辑新的 `Tab2Fragment.java`\
  \ 文件并更改类名，然后修改 `onCreateView()` 方法以加载 `fragment_tab2` 布局文件：\n\n```java\n@Override\n\
  public View onCreateView(LayoutInflater inflater, ViewGroup container,\n       \
  \                  Bundle savedInstanceState) {\n    // 载此片段的布局\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ container, false);\n}\n```\n\n再次执行上述复制步骤两次，为其余两个片段创建片段布局和类文件。完成这些步骤后，项目结构应与图 46-5\
  \ 一致：\n\n![](img/as_4.2_tablayout_project_files.jpg)\n\n图 46-5\n\n## 46.6 添加 TabLayout\
  \ 和 ViewPager2\n\n片段创建过程完成后，下一步是向主活动布局文件添加 `TabLayout` 和 `ViewPager2`。编辑 `activity_main.xml`\
  \ 文件，并按照下方 XML 列表添加这些元素。注意，`TabLayout` 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager2` 放置在\
  \ `AppBarLayout` 之后：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:fitsSystemWindows=\"true\"\n    tools:context=\".MainActivity\">\n\
  \    <com.google.android.material.appbar.AppBarLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:fitsSystemWindows=\"\
  true\">\n        <com.google.android.material.appbar.MaterialToolbar\n         \
  \   android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\" />\n        <com.google.android.material.tabs.TabLayout\n\
  \            android:id=\"@+id/tabLayout\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"wrap_content\"\n           \
  \ app:tabMode=\"fixed\"\n            app:tabGravity=\"fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \    <androidx.viewpager2.widget.ViewPager2\n        android:id=\"@+id/view_pager\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/app_scrolling_view_behavior\"\
  \ />\n    <include layout=\"@layout/content_main\" />\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_marginEnd=\"@dim/fab_margin\"\n        android:layout_marginBottom=\"\
  16dp\"\n        app:src=\"@android:drawable/ic_dialog_email\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n## 46.7 创建 Pager Adapter\n\n此示例将使用 `ViewPager2` 方案来处理分配给 `TabLayout` 的片段。在布局文件中添加了\
  \ `ViewPager2` 后，需要向项目添加一个子自 `FragmentAdapter` 的新类，用于管理当用户选择标签项时显示的片段。\n\n在项目窗口中右键点击\
  \ `com.ebookfrenzy.tablayoutdemo` 项并选择 `New -> Java Class` 选项向项目添加新类。在新类对话框中，在 `Name:`\
  \ 字段中输入 `TabPagerAdapter`，选择列表中的 `Class` 项并按 `Return` 键。编辑 `TabPagerAdapter.java`\
  \ 文件，内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return Tab1Fragment();\n\
  \            case 1:\n                return Tab2Fragment();\n            case 2:\n\
  \                return Tab3Fragment();\n            case 3:\n                return\
  \ Tab4Fragment();\n            default:\n                return null;\n        }\n\
  \    }\n    @Override\n    public int getItemCount() {\n        return tabCount;\n\
  \    }\n}\n```\n\n该类声明为扩展 `FragmentAdapter` 类，并实现了一个构造函数，允许在创建实例时传递所需的页面数量。`createFragment()`\
  \ 方法会在需要特定页面时调用。最后，`getItemCount()` 方法简单返回通过对象实例传递的计数。\n\n## 46.8 执行初始化任务\n\n剩余的任务涉及初始化\
  \ `TabLayout`、`ViewPager2` 和 `TabPagerAdapter` 实例，并让主活动类实现四个片段的片段监听器。编辑 `MainActivity.java`\
  \ 文件，内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport android.net.Uri;\n\
  import com.google.android.material.tabs.TabLayoutMediator;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements\n    Tab1Fragment.OnInteractionListener,\n\
  \    Tab2Fragment.OnInteractionListener,\n    Tab3Fragment.OnInteractionListener,\n\
  \    Tab4Fragment.OnInteractionListener {\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        configureTabLayout();\n    }\n\n    protected void\
  \ configureTabLayout() {\n        for (int i = 0; i < 4; i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  \        }\n        final TabPagerAdapter adapter = new TabPagerAdapter(\n     \
  \       this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \    }\n}\n```\n\n\n\n\n```java\nnew TabLayoutMediator(binding.tabLayout, binding.viewPager,\n\
  \    (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  }\n\n@Override\npublic void onFragmentInteraction(Uri uri) {\n}\n\n.\n.\n}\n```\n\
  \n代码首先创建了四个标签，并将它们添加到 `TabLayout` 实例中，如下：\n\n```java\nfor (int i = 0; i < 4; i++)\
  \ {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n}\n```\n\n接下来，创建一个\
  \ `TabPagerAdapter` 类的实例。请注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout` 组件的标签数量。然后将\
  \ `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n    (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类实例来连接\
  \ `TabLayout` 和 `ViewPager2` 对象：\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n    (tab, position) -> tab.setText(\"Tab \" + (position +\
  \ 1) + \" Item\")).attach();\n```\n\n该类确保 `TabLayout` 标签与当前选中的片段保持同步。此过程的一部分是确保在每个标签上显示正确的文本。在这种情况下，文本被配置为读取“Tab\
  \ <n> Item”，其中 `<n>` 被替换为当前所选标签的编号。\n\n## 46.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择一个标签会导致相应的片段出现在屏幕的区域区域：\n\
  \n![](img/as_tablayout_running.jpg)\n\n图 46-6\n\n## 46.10 定制 TabLayout\n\n此示例项目中的\
  \ `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于标签较少且标题短的情况。当使用固定模式时，标签数量更多或标题较长可能会迅速变成问题，如图\
  \ 46-7 所示：\n\n![](img/as_tablayout_running_clipped.jpg)\n\n图 46-7\n\n为了让标签适应可显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行明显被截断了，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到滚动模式（scrollable mode）。在这种模式下，标题以全长度、单行格式显示，允许用户通过滑动水平滚动可用项目，如图\
  \ 46-8 所示：\n\n![](img/as_tablayout_running_scrollable.jpg)\n\n图 46-8\n\n要将 `TabLayout`\
  \ 切换到滚动模式，只需将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”更改为“scrollable”即可：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 以控制标签项的显示以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在较宽的显示器（如横屏平板）上更为明显。例如，设置为“fill”时，项目将均匀分布在\
  \ `TabLayout` 的宽度上，如图 46-9 所示：\n\n![](img/as_tablayout_fill.jpg)\n\n图 46-9\n\n将属性值更改为“center”将导致项目相对于标签栏的中心进行定位：\n\
  \n![](img/as_tablayout_center.jpg)\n\n图 46-10\n\n## 46.11 总结\n\n`TabLayout` 是 Android\
  \ Material 设计实现引入的组件之一。`TabLayout` 组件的目的是展示一系列标签项，这些项在被选中时会向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。与\
  \ `ViewPager2` 类和片段结合使用时，可以轻松地创建标签布局，每个标签项的选择都会显示不同的片段。\n\n# 47. 使用 RecyclerView\
  \ 和 CardView 控件\n\n`RecyclerView` 和 `CardView` 控件共同工作，为用户提供可滚动的信息列表，其中信息以单个卡片的形式呈现。在进行设计和实现之前，本章将介绍这两个类的详细信息。\n\
  \n## 47.1 RecyclerView 概述\n\n与章节使用悬浮操作按钮和 Snackbar 中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许向用户展示信息。然而，`RecyclerView` 相比 `ListView` 具有许多优势。特别是 `RecyclerView` 在管理视图方面要高效得多，它通过重用滚动出屏幕的列表项现有视图，而不是创建新视图（这就是“recycler/回收器”名称的由来）。这既提高了性能，又减少了列表使用的资源。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器，用以控制向用户展示列表项的方式：\n\n- `LinearLayoutManager`：列表项以水平或垂直列表的形式呈现。\n\
  \n![](img/Image2427.jpg)\n\n图 47-1\n\n- `GridLayoutManager`：列表项以网格格式呈现。这种管理器适用于列表项大小一致的情况。\n\
  \n![](img/Image2436.jpg)\n\n图 47-2\n\n- `StaggeredGridLayoutManager`：列表项以交错网格格式呈现。这种管理器适用于列表项大小不一致的情况。\n\
  \n![](img/Image2443.jpg)\n\n图 47-3\n\n对于三种内置管理器都无法提供所需布局的情况，可以通过子类 `RecyclerView.LayoutManager`\
  \ 类来实现自定义的布局管理器。\n\n`RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类的实例创建的。`ViewHolder`\
  \ 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\n\n\n\n将 `RecyclerView`\
  \ 添加到布局中，简单来说就是在要在其显示的 activity 的 XML 内容布局文件中添加适当的元素即可。例如：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主 activity 布局文件的 `CoordinatorLayout` 中，并与 `AppBar`\
  \ 和 `Toolbar` 在一起。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时，它们会滚出屏幕（该主题在“Working\
  \ with the AppBar and Collapsing Toolbar Layouts”章节中会有更详细的介绍）。\n\n## 47.2 CardView\
  \ 概述\n\n`CardView` 类是一种用户界面视图，允许使用卡片隐喻以分组的形式呈现信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角。例如[图\
  \ 47-4]显示了三个配置好的 `CardView` 实例，它们显示一个由一个 `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/Image24512.jpg)\n\
  \n图 47-4\n\n用 `CardView` 实例呈现的用户界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂性的布局，可以使用标准的布局管理器如 `RelativeLayout` 和 `LinearLayout`。接下来的 XML 布局文件表示了一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。该卡片被配置为提升以创建阴影效果并带有圆角显示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_margin=\"5dp\"\n    card_view:cardCornerRadius=\"12dp\"\n \
  \   card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"4dp\">\n   \
  \ <RelativeLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\" >\n        <ImageView\n       \
  \     android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \n            android:id=\"@+id/item_image\"\n            android:layout_alignParentLeft=\"\
  true\"\n            android:layout_alignParentTop=\"true\"\n            android:layout_marginRight=\"\
  16dp\" />\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n\
  当与 `RecyclerView` 结合创建一个可滚动的卡片列表时，recyclerView 的 `onCreateViewHolder()` 方法会加载卡片的布局文件，将其分配给\
  \ `ViewHolder` 实例并返回给 `RecyclerView` 实例。\n\n## 47.3 总结\n\n本章介绍了 Android `RecyclerView`\
  \ 和 `CardView` 组件。`RecyclerView` 提供了一种资源高效的方法用于在 Android 应用中滚动视图列表。当以卡片形式呈现组数据（如姓名和地址列表）时，`CardView`\
  \ 非常有用。正如之前概述的，并在下一章的教程演示的那样，`RecyclerView` 和 `CardView` 结合使用时特别别有用。\n\n# 48. Android\
  \ RecyclerView 和 CardView 教程\n\n在本章中，将创建一个示例项目，同时利用 `CardView` 和 `RecyclerView`\
  \ 组件来创建一个滚动的卡片列表。完成后的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片会向用户显示消息。\n\n## 48.1\
  \ 创建 CardDemo 项目\n\n从欢迎屏幕上选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Basic\
  \ Activity (Material3)` 模板。在 `Name` 字段中输入 `CardDemo`，并指定 `com.ebookrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`并将\
  \ `Language` 设置为 `Java`。\n\n## 48.2 修改 Basic Activity 项目\n\n由于选择了 `Basic Activity`，布局包含一个悬浮操作按钮，但该项目并不需要。将\
  \ `activity_main.xml` 布局文件加载到布局编辑器，选择悬浮操作按钮并按键盘删除。编辑 `MainActivity.java` 文件，在 `onCreate`\
  \ 方法中移除悬浮操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n此外，移除 `onSupportNavigateUp()` 方法，然后打开\
  \ `content_main.xml` 文件并从布局中删除 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`。\n\
  \n## 48.3 设计 CardView 布局\n\n卡片内部视图的布局将定义在一个独立的 XML 布局文件中。在 Project 工具窗口中右键点击 `app\
  \ -> res -> layout` 项，选择 `New -> Layout Resource File` 菜单选项。在新资源对话框中，在 `File name:`\
  \ 字段输入 `card_layout`，并在点击 `OK` 按钮之前在根元素字段输入 `androidx.cardview.widget.CardView`。\n\
  \n将 `card_layout.xml` 文件加载到布局编辑器，切换到 Code 模式并修改布局如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"\
  #81C784\"\n    app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n  \
  \  app:contentPadding=\"4dp\" >\n```\n\n\n\n\n```xml\n<android:id=\"@+id/relativeLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:padding=\"16dp\">\n    <ImageView\n        android:id=\"@+id/itemImage\"\
  \n        android:layout_width=\"100dp\"\n        android:layout_height=\"100dp\"\
  \n        app:layout_constraintLeft_toLeftOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n    <TextView\n\
  \        android:id=\"@+id/itemTitle\"\n        android:layout_width=\"236dp\"\n\
  \        android:layout_height=\"39dp\"\n        android:layout_marginStart=\"16dp\"\
  \n        android:textSize=\"30sp\"\n        app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n        app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n\
  \        app:layout_constraintTop_toTopOf=\"parent\" />\n    <TextView\n       \
  \ android:id=\"@+id/itemDetail\"\n        android:layout_width=\"236dp\"\n     \
  \   android:layout_height=\"16dp\"\n        android:layout_marginStart=\"16dp\"\n\
  \        android:layout_marginTop=\"8dp\"\n        app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n        app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n\
  \        app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板的 `Containers` 部分将 `RecyclerView` 对象拖放并到布局中，使其位于屏幕中心，此时它将自动调整大小以填充整个屏幕。使用\
  \ `Infer constraints`（推断约束）工具栏按钮为视图添加任何缺失的布局约束。使用 `Attributes` 窗口，将 `RecyclerView`\
  \ 实例的 ID 更改为 `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\
  \n### 48.5 添加图片文件\n\n除了两个 `TextView` 之外，卡片布局还包含一个 `ImageView`，Recycler 适配器已配置为显示图像。在测试项目之前，必须添加这些图片。项目将使用的图片命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n在操作系统的文件导航器中找到这些图片，选择并复制这八张图片。在 Project 窗口中右键点击 `app` -> `res` -> `drawable` 项，选择\
  \ `Paste`（粘贴）将文件添加到文件夹中：图 48-1\n\n### 48.6 创建 RecyclerView 适配器\n\n如上一章所述，`RecyclerView`\
  \ 需要适配器来处理列表项的创建。在 Project 窗口中右键点击 `app` -> `java` -> `ebookfrenzy` -> `demo` 项，并选择\
  \ `New` -> `Java Class` 选项将此新类添加到项目中。在新类对话框中，在 `Name` 字段输入 `RecyclerAdapter`，并在列表中选择\
  \ `Class`，然后按回车键创建新的 Java 文件。\n\n编辑 `RecyclerAdapter.java` 文件以添加一些导入语句并声明该类继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供显示的数据，不如在适配器中添加一些基础数组作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.demo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    private String[] titles = {\"One\", \"Two\", \"Three\", \"Four\", \"Five\"\
  , \"Six\", \"Seven\", \"Eight\"};\n    private String[] details = {\"one details\"\
  , \"two details\", \"three details\", \"four details\", \"five details\", \"six\
  \ details\", \"eight details\"};\n    private int[] images = { \n        R.drawable.android_image_1,\n\
  \        R.drawable.android_image_2,\n        R.drawable.android_image_3,\n    \
  \    R.drawable.android_image_4,\n        R.drawable.android_image_5,\n        R.drawable.android_image_6,\n\
  \        R.drawable.android_image_7,\n        R.drawable.android_image_8 \n    };\n\
  }\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要自己实现 `ViewHolder` 类，并配置以引用 `card_layout.xml`\
  \ 文件中的视图元素。继续在 `RecyclerAdapter.java` 文件中如下实现该类：\n\n```java\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n\n    static class\
  \ ViewHolder extends RecyclerView.ViewHolder {\n        ImageView itemImage;\n \
  \       TextView itemTitle;\n        TextView itemDetail;\n\n        ViewHolder(View\
  \ itemView) {\n            super(itemView);\n            itemImage = itemView.findViewById(R.id.itemImage);\n\
  \            itemTitle = itemView.findViewById(R.id.itemTitle);\n            itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n        }\n    }\n}\n```\n\n### 48.7\
  \ 初始化 RecyclerView 组件\n\n到此时，项目包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个\
  \ `RecyclerView` 适配器。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView`\
  \ 对象。为了本例而言，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局选项。\n\n\n\n\n这里有一处复杂之处，因为我们需要能够使用\
  \ view binding 来从 `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在\
  \ `content_main.xml` 布局文件中，而该文件又被包含在 `activity_main.xml` 文件中。为了能够访问 `content_main.xml`\
  \ 文件，我们需要在它被包含时为它分配一个 id。要做到这一点，请编辑 `activity_main.xml` 文件并修改 `include` 元素，使其内容如下：\n\
  \n```xml\n<include\n    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\"\
  \ />\n```\n\n为被包含的文件分配了 id 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n现在编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.appcompat.widget.Toolbar;\n\
  import androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  import android.view.View;\nimport android.view.Menu;\nimport android.view.MenuItem;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n### 48.8 测试应用程序\n\n在物理设备或模拟器会上编译并运行应用，滚动列表中的不同卡片项目：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n### 48.9 响应卡片选择\n\n项目的最后一个阶段是使列表中的卡片可选，这样点击卡片就会触发应用内的事件。在本示例中，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，为每个项目视图分配一个 `onClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明，使其内容如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体内部，现在可以添加代码来显示消息，指示卡片已被点击。鉴于点击产生的操作可能取决于点击了哪张卡片，因此识别被选中的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获得。留在 `RecyclerAdapter.java`\
  \ 文件中，向 `onClick` 处理程序中添加代码，使其内容如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用点击时的 material design 涟波效果。这仅涉及在 `card_layout.xml`\
  \ 文件中的 `CardView` 实例中添加一些属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView  xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n \
  \   app:cardRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    android:contentPadding=\"\
  4dp\"\n    android:clickable=\"true\"\n    android:foreground=\"?attr/selectableItemBackground\"\
  >\n```\n\n## 4.10 总结\n\n本章介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动列表的步骤。示例还涵盖了对列表项的点击检测，包括识别选中的项目以及启用涟波效果视觉反馈。\n\
  \n## 布局编辑器示例教程\n\n在上章节中创建的 CardDemo 项目提供了一个很好的例子，说明了在完成应用并测试之前，很难从布局编辑器内部准确判断用户界面将是种样子。当用户界面中要显示的内容只有在用户拥有应用后才会生成或获取时，这个问题经常发生。\n\
  \n长期以来，Android Studio 布局编辑器一直提供了指定简单属性的功能，这些属性仅在设计布局时有效。例如，一个仅限设计时的字符串可以分配给布局编辑器中的\
  \ `TextView`，但它在应用运行时不会显示。随着 Android 布局编辑器中引入示例数据支持，这一功能得到了极大的扩展，并将在本章中使用它。\n\n\
  ### A.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图 49-1）与上一章末尾测试的运行应用几乎没有相似之处。然而在此之前，值得注意的是，布局编辑器有一组预配置的示例数据模板，可以在设计用户界面时使用。要查看其中一些示例的效果，请将\
  \ `content_main.xml` 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data` 菜单选项以显示设计视图属性面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\n\
  图 49-2\n\n将模板更改为 Email Client 选项并将项目计数更改为 12，注意 `RecyclerView` 会变化以显示来自模板的数据：\n\n\
  ![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\n图 49-3\n\n\n\n\n这些模板可以用于在无需任何额外工作的情况下显示示例数据，并且通常提供了完成布局设计所需的数据。然而在本示例中，将使用示例数据来显示\
  \ `RecyclerView` 中的卡片，就像它们在运行应用程序中的预期显示一样。在布局编辑器仍加载着 `content_main.xml` 文件的情况下，切换到代码（Code）模式并找到\
  \ `RecyclerView` 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，它们用于列表中显示 12 个项目，每个项目都使用名为 `recycler_view_item.xml`\
  \ 文件包含的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然涵盖所有这些设置超出了本书的范围，但可以在以下 URL 找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引用的 `recycler_view_item.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目工具窗口（Project tool\
  \ window）中找到。\n\n切换回设计（Design）模式，在选中 `RecyclerView` 的情况下，使用设计时视图属性（Design-time View\
  \ Attributes）面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目被删除，同时 `content_main.xml`\
  \ XML 文件中的两行 `tools` 属性也将随之被删除（如果 Android Studio 未能自动删除这些行，则可以在代码视图中手动删除）。\n\n要切换到使用卡片布局来显示示例数据，请添加一个\
  \ `listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView` 后，在属性（Attributes）工具窗口中搜索\
  \ `listitem` 属性，并在属性字段中如图 49-4 所示输入 `@layout/card_layout`：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\
  图 49-4\n\n切换回设计模式，注意每个列表项现在都显示了卡片布局，尽管还没有任何图像且使用的是示例文本数据：\n\n![](img/as_3.6_recyclerview_sample_data_car_layout.jpg)\n\
  图 49-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板示例数据形式，也可以是专门为此项目添加的自定义示例数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器中，选中 `ImageView` 并按照本章之前所述显示设计时视图属性面板。从 `srcCompat`\
  \ 菜单中，选择下方图 49-6 所示的内置背景/风景图集：\n\n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\
  \n图 49-6\n\n接下来，右键点击 `itemTitle` TextView 对象，选择“设置示例数据”（Set Sample Data）菜单选项，并在设计时属性面板中选择\
  \ `cities` 文本选项。对 `itemDetail` 视图重复此步骤，这次如图 49-7 所示选择 `full_names` 选项：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\
  图 49-7\n\n在设计模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\n\
  ![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\n图 49-8\n\n## 49.2 使用自定义示例数据\n\
  \n本章的最后一步是演示如何在布局编辑器中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目工具窗口中，右键点击 `app`\
  \ 项并选择“新建 -> 示例数据目录”（New -> Sample Data Directory）菜单选项，此时项目工具窗口将出现一个名为 `sampledata`\
  \ 的新目录。如果新文件夹不可见，将项目工具窗口从 Android 模式切换到 Project 模式，并在图 49-9 所示的 `CardDemo -> app`\
  \ 下找到该文件夹：\n\n![](img/as_4.2_sample_data_folder.jpg)\n图 49-9\n\n右键点击 `sampledata`\
  \ 目录，创建一个名为 `images` 的子目录，并按照上一章概述的步骤将 Android 图像复制粘贴到新文件夹中。再次显示 `ImageView` 的设计时视图属性面板，这次点击“浏览”（Browse）链接并在资源对话框中选择新添加的\
  \ Android 图像（如果图像文件夹未出现，请尝试重建项目）：\n\n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\
  \n图 49-10\n\n创建示例数据后，剩下的只需在 `card_layout.xml` 文件中如下所示引用它们：\n\n```xml\n<TextView\n\
  \    android:id=\"@+id/itemTitle\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  39dp\"\n    android:layout_marginStart=\"16dp\"\n    app:layout_constraintLeft_RightOf=\"\
  id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:id=\"\
  @+id/itemDetail\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  16dp\"\n    android:layout_marginStart=\"16dp\"\n    android:layout_marginTop=\"\
  8dp\"\n    app:layout_constraintLeft_RightOf=\"id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  id/itemImage\"\n    app:layout_constraintTop_toBottomOf=\"id/itemTitle\"\n    tools:text=\"\
  @sample/items\" />\n```\n\n## 49.3 总结\n\n本章演示了在布局编辑器中使用示例数据，以为用户界面的运行时外观提供更真实的表示。本教程涵盖的步骤包括对现有示例数据模板的使用以及自定义示例数据的集成。\n\
  \n# 50. 使用 AppBar 和可折叠工具栏布局\n\n\n\n\n\n在本章中，我们将探索自定义 Activity 布局中应用栏（app bar）并使其对屏幕上其他视图发生的滚动事件做出响应的方法。通过结合\
  \ `CoordinatorLayout` 与 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用栏显示图像，并在视图中执行淡入淡出动画。例如，可以配置列表的向上滚动动作，使应用\
  \ bar 从视图中退回，并在执行向下滚动动作时重新出现。\n\n本章将从概述组成应用栏的元素开始，然后详细介绍各种应用 bar 配置的示例。\n\n## 50.1\
  \ AppBar 的结构\n\n应用 bar 是应用程序运行时显示在屏幕顶部的区域，它可以配置为包含各种不同的项目，包括状态栏、`toolbar`、`tab bar`（标签栏）和一个弹性空间区域。例如，图\
  \ 50-1 显示了一个包含状态栏、`toolbar` 和 `tab bar` 的应用栏：\n\n![](img/Image24271.jpg)\n\n图 50-1\n\
  \n 弹性空间区域可以使用空白背景颜色填充，或者如图 50-2 所示，显示在 `ImageView` 对象上的图像：\n\n![](img/Image24361.jpg)\n\
  \n图 50-2\n\n正如本章其余部分将演示的，如果 Activity 用户界面布局的主内容区域包含可滚动内容，则可以配置应用栏元素，使其随着屏幕内容的滚动而进行展开和收缩。\n\
  \n## 50.2 示例项目\n\n为了本示例，将对前面的章节中创建的 `CardDemo` 项目进行修改，该项目名为“Android RecyclerView\
  \ 和 CardView 教程”。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用程序，并注意当向上滚动列表时，`toolbar`\
  \ 保持可见，如图 50-3 所示：\n\n![](img/as_card_demo_app_bar.jpg)\n\n图 50-3\n\n第一步是进行一些配置更改，使\
  \ `toolbar` 在向上滚动运动期间收缩，并在向下滚动时展开。\n\n## 50.3 协调 RecyclerView 和 Toolbar\n\n将 `activity_main.xml`\
  \ 文件加载到布局编辑器工具中，切换到代码模式并查看 XML 布局设计，其层级结构由图 50-4 所示所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 50-4\n\n层级结构的顶层是 `CoordinatorLayout`，顾其名，它协调其包含的各种子视图元素之间的交互。例如在“使用悬操作按钮和 Snackbar”中所示，`CoordinatorLayout`\
  \ 会自动将悬操作按钮向上滑动，以容纳 `Snackbar` 的出现，然后在该栏消失后将按钮移回下方。\n\n同样地，`CoordinatorLayout` 还可以用于根据视图层级结构中某些视图的滚动动作，使应用栏的元素滑入或滑出视图。在图\
  \ 50-4 所示的布局层级中，其中一个元素是 `ConstraintLayout`。为了实现这种协调行为，必须在发生滚动的元素上以及与其协调滚动的元素上都设置属性。\n\
  \n在滚动元素（在本例中为 `RecyclerView`）上，必须将 `android:layout_behavior` 设置为 `appbar_scrolling_view_behavior`。在\
  \ `content_main.xml` 文件中，找到顶层的 `ConstraintLayout` 元素，并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。要让 `toolbar` 响应发生在 `RecyclerView` 中的滚动事件，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给此属性的值取决于所需的交互性质，并且必须由以下一个或多个项组成：\n\n- `scroll` – 表示该视图将被滚出屏幕。如果不设置此项，在滚动事件期间，该视图将固定在屏幕顶部。\n\
  - `enterAlways` – 与 `scroll` 选项结合使用时，向上滚动动作将导致视图退回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n-\
  \ `enterAlwaysCollapsed` – 设置在视图上时，该视图在向下滚动动作达到限制之前将不会从收缩状态展开。\n- `exitUntilCollapsed`\
  \ – 设置后，视图在向上运动期间将收缩，直到达到最小高度。在滚动方向改变之前将保持在该高度。\n\n为了本示例，将在 `Toolbar` 上如下设置 `scroll`\
  \ 和 `enterAlways` 选项：\n\n```xml\n<com.google.android.material.appbar.MaterialToolbar\n\
  \    android:id=\"@+id/toolbar\"\n    android:layout_width=\"match_parent\"\n  \
  \  android:layout_height=\"?attr/actionBarSize\"\n    app:layout_scrollFlags=\"\
  scroll|enterAlways\" />\n```\n\n设置好属性后，再次运行应用程序并在 `RecyclerView` 中进行向上滚动动作。这应该导致\
  \ `toolbar` 收缩出视图（图 50-5）。向下滚动动作应导致 `toolbar` 重新出现。\n\n![](img/as_collapsed_toolbar.jpg)\n\
  \n图 50-5\n\n## 50.4 引入 CollapsingToolbar Layout\n\n`CollapsingToolbarLayout` 容器通过提供更丰富的选项和对响应协调滚动动作的应用栏及其子元素收缩的控制级别，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加，并提供了如在工具栏收缩和展开时自动调整工具栏标题字体大小的功能。视差模式（parallax mode）允许应用栏中的指定内容在收缩时淡出，而固定模式（pin\
  \ mode）则允许应用栏元素在收缩期间保持在固定位置。\n\n还有遮罩（scrim）选项，用于指定工具栏在收缩序列期间过渡的颜色。\n\n为了看到这些功能的效果，将修改\
  \ `activity_main.xml` 文件中包含的应用栏，使用 `CollapsingToolbarLayout` 类，并添加一个 `ImageView`\
  \ 以更好地演示视差模式的效果。\n\n\n\n\n将 `activity_main.xml` 文件加载到 Layout Editor 工具的代码模式中，并修改布局如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:fitsSystemWindows=\"true\"\n    tools:context=\".MainActivity\">\n\
  \    <com.google.android.material.appbar.AppBarLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:fitsSystemWindows=\"\
  true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n \
  \           android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                app:layout_scrollFlags=\"scroll|enterAlways\"\n               \
  \ app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n除了向上述布局中添加新元素外，还删除了背景颜色属性。此更改的优点是提供了一个透明工具栏，允许应用栏中显示更多的图像。\n\n使用你操作系统的文件系统，在代码示例的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并复制它。在 Project 窗口中右键点击 `app` -> `res`\
  \ -> `drawable` 项，并从生成的菜单中选择粘贴。运行时，应用栏应如图 50-7 所示：(image/card_demo_app_image.jpg)\n\
  \n向上滚动列表将导致应用栏逐渐折叠。在收缩过程中，图像将淡变为 `scrim` 属性定义的颜色，同时标题字体大小将按相应比例缩小，直到只看到工具栏：(image/card_demo_app_image_collapsed.jpg)\n\
  \n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也将移出视图），这是因为 `activity_main.xml` 文件中的灵活区域被配置为使用\
  \ `pin` 模式：`app:layout_collapseMode=\"pin\"`。如果折叠模式设置为 `parallax`，工具栏将随视图一起收回。继续向上滚动动作将导致工具栏折叠，只留状态栏可见：(image/card_demo_app_image_hidden.jpg)\n\
  \n由于 `CollapsingToolbarLayout` 元素的 `scrollFlags` 属性包含了 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。要固定工具栏使其在向上滚动动作过程中不再移出视图，请将\
  \ `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的 `layout_scrollFlags` 属性中的\
  \ `enterAlways` 替换为 `exitUntilCollapsed`，如下所示：\n\n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \    android:id=\"@+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\
  \n    android:fitsSystemWindows=\"true\"\n    app:expandedTitleMarginBottom=\"30dp\"\
  \n    app:expandedTitleMarginStart=\"15dp\"\n    app:expandedTitleMarginEnd=\"64dp\"\
  >\n```\n\n## 50.5 修改标题和 Scrim 颜色\n\n作为最后一个任务，编辑 `MainActivity.java` 文件并在 `onCreate()`\
  \ 方法中添加一些代码，以更改折叠布局实例上的标题文本，并设置不同的 scrim 颜色（注意，scrim 颜色也可以在布局资源文件中设置）：\n\n```java\n\
