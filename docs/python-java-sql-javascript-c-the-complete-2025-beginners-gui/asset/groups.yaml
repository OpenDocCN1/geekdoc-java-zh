    成绩：A\");\n} else if (score >= 80) {\n    console.log(\"成绩：B\");\n} else {\n  \
    \  console.log(\"成绩：C 或以下\");\n}\n```\n\n#### 三元运算符（更短的 If-Else）\n\n与其编写完整的 if-else\
    \ 语句，不如使用三元运算符处理简单条件：`let message = (age >= 18) ? \"Adult\" : \"Minor\"; console.log(message);`\n\
    \n### 2. 循环 (For 和 While)\n\n循环允许你重复某些操作，而无需多次编写相同的代码。\n\n#### For 循环（适用于已知重复次数的情况）\n\
    \n```javascript\nfor (let i = 1; i <= 5; i++) {\n  console.log(\"Count:\", i);\n\
    }\n```\n\n输出：\nCount: 1\nCount: 2\nCount: 3\nCount: 4\nCount: 5\n\n#### While\
