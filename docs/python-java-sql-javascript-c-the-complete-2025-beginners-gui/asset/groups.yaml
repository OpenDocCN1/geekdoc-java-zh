    of data the variable will hold.


    +   2. **Name (Identifier)** - The unique name assigned to the variable.


    +   3. **Value** - The actual data stored in the variable.


    Declaring Variables


    To declare a variable in Java, follow this format: int age = 25; // A variable
    named age storing an integer double price = 99.99; // A floating-point number
