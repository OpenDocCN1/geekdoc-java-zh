    ```\n\n```java\n        root.getChildren().add(btn); \n        Scene scene = new\
    \ Scene(root, 300, 200);\n        primaryStage.setTitle(\"JavaFX App\");\n   \
    \     primaryStage.setScene(scene); \n        primaryStage.show();\n}\n```\n\n\
    ```java\n    public static void main(String[] args) {\n        launch(args);\n\
