    \  <div class=\"container\">\n    <h2>Weather App</h2>\n    <input type=\"text\"\
    \ id=\"cityInput\" placeholder=\"Enter city\">\n    <button id=\"getWeather\"\
    >Get Weather</button>\n    <p id=\"weatherResult\"></p>\n  </div>\n  <script src=\"\
    script.js\"></script>\n</body>\n</html>\n```\n\n### 2. 使用 CSS 样式\n\n```css\nbody\
    \ {\n  font-family: Arial, sans-serif;\n  text-align: center;\n}\n\n.container\
    \ {\n  max-width: 400px;\n  margin: 0 auto;\n}\n```\n\n### 3. 编写 JavaScript 获取数据\n\
    \n```javascript\ndocument.getElementById(\"getWeather\").addEventListener(\"click\"\
    , function() {\n  let city = document.getElementById(\"cityInput\").value;\n \
    \ let apiKey = `YOUR_API_KEY`;\n  let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;\n\
    \n  fetch(url)\n    .then(response => response.json())\n    .then(data => {\n\
    \      let temp = data.main.temp;\n      let description = data.weather[0].description;\n\
    \      document.getElementById(\"weatherResult\").innerHTML = `Temp: ${temp}°C\
    \ Condition: ${description}`;\n    })\n    .catch(error => alert(\"City not found!\"\
    ));\n});\n```\n\n此脚本获取指定城市的天气。\n\n## JavaScript 框架简介 (React, Vue.js)\n\n随着 JavaScript\
    \ 应用复杂性的增加，**React 和 Vue.js** 等框架会让开发变得更快、更高效。\n\n### 1. 什么是 React？\n\nReact 是由\
