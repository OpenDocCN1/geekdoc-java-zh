    \ 10 + 5; // 加法\nlet difference = 10 - 5; // 减法\nlet product = 10 * 5; // 乘法\n\
    let quotient = 10 / 5; // 除法\nlet remainder = 10 % 3; // 余数（模）\n```\n\n#### 比较运算符\n\
    \n用于比较值：\n\n```javascript\nconsole.log(10 > 5); // true\nconsole.log(10 < 5);\
    \ // false\nconsole.log(10 == \"10\"); // true（检查值，不检查类型）\nconsole.log(10 ===\
    \ \"10\"); // false（检查值和类型）\n```\n\n使用 === 代替 == 以避免意外的类型转换。\n\n#### 逻辑运算符\n\n\
    用于做出决策：\n\n```javascript\nconsole.log(true && false); // false (与运算符 AND)\nconsole.log(true\
    \ || false); // true (或运算符 OR)\nconsole.log(!true); // false (非运算符 NOT)\n```\n\
    \n## 条件语句和循环\n\n### 1. 条件语句 (If-Else)\n\n程序经常需要做出决策。If-Else 语句允许 JavaScript 根据条件执行不同的代码。\n\
    \n示例：\n\n```javascript\nlet age = 18;\nif (age >= 18) {\n    console.log(\"你是一个成年人.\"\
