    \ 继承\n\n继承是面向对象编程（OOP）的核心特征之一，允许你基于现有类创建新类。\n\n新类（称为派生类）从现有类（称为基类）继承属性和行为。这让你能够重用代码并扩展功能。\n\
    \n例如，假设我们有一个 `Vehicle` 类，我们创建一个继承自 `Vehicle` 的 `Car` 类。我们不需要重写公共属性；可以直接继承它们。\n\
    \n这里有一个示例：\n\n```cpp\nclass Vehicle {\npublic:\n    string color;\n    int speed;\n\
