    \n## 第19 章：JavaScript 实战 - 动手项目\n\n在本章中，我们将把你学到的所有 JavaScript 知识通过真实世界的项目付诸实践。理论很重要，但应用所学知识是巩固技能的最佳方式。我们将构建三个动手项目，这些项目将带给你在实际场景中使用\
