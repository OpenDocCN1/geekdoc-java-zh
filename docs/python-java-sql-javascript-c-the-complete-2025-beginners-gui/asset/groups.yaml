    \      <button onClick={() => setCount(count - 1)}>Decrease</button>\n    </div>\n\
    \  );\n}\n\nexport default Counter;\n```\n此 React 组件允许用户增加或减少计数。\n\n### 2. 什么是\
    \ Vue.js？\n\nVue.js 是另一个流行的 JavaScript 框架，轻量且**易学**。它支持双向数据绑定，非常适合中小型应用。\n\n简单的\
    \ Vue 应用示例\n\n```html\n<div id=\"app\">\n  <h2>Counter: {{ count }}</h2>\n  <button\
    \ @click=\"count++\">Increase</button>\n  <button @click=\"count--\">Decrease</button>\n\
    </div>\n<script src=\"https://cdn.jsdelivr.net/npm/vue@2\"></script>\n<script>\n\
    new Vue({\n  el: \"#app\",\n  data: {\n    count: 0\n  }\n});\n</script>\n```\n\
    此 Vue.js 应用与 React 示例类似，但实现更加简单。\n\n## 结论\n\n"
