    \ API 开发简单的天气应用** – 与 API 交互以动态获取显示数据。\n- **项目 3：JavaScript 框架简介 (React, Vue.js)**\
    \ – 体验专业开发中使用的现代 JavaScript 框架。\n\n## 创建交互式待办事项列表\n\n**待办事项列表 (To-Do List)** 是最适合初者的项目之一，因为它教会了**事件处理、DOM\
    \ 操作和本地存储**——这些都是核心的 JavaScript 技能。在这个项目的结束时，你将拥有一个功能完整的**任务管理应用**，用户可以在其中添加、删除和保存任务。\n\
    \n### 1. 设置 HTML\n\n我们从一个简单的结构开始，包括：\n- 用于输入任务的**输入字段**\n- 用于添加任务的**按钮**\n- 用于显示任务的**列表**\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    <title>To-Do List</title>\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n\
    <body>\n  <div class=\"container\">\n    <h2>To-Do List</h2>\n    <input type=\"\
    text\" id=\"taskInput\" placeholder=\"Add a new task\">\n    <button id=\"addTask\"\
    >Add Task</button>\n    <ul id=\"taskList\"></ul>\n  </div>\n  <script src=\"\
    script.js\"></script>\n</body>\n</html>\n```\n\n### 2. 使用 CSS 样式\n\n为了让它看起来整洁，添加一个简单的\
    \ CSS 文件：\n\n```css\nbody {\n  font-family: Arial, sans-serif;\n  text-align:\
    \ center;\n}\n\n.container {\n  max-width: 400px;\n  margin: 0 auto;\n}\n\nul\
    \ {\n  list-style-type: none;\n  padding: 0;\n}\n\nli {\n  border-bottom: 1px\
    \ solid #ddd;\n  display: flex;\n  justify-content: space-between;\n  padding:\
