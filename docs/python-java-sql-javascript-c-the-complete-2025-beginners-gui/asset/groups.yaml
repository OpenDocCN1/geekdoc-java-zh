    # # Chapter 8: Object-Oriented Programming in Java


    Java is one of the most widely used programming languages in the world, and one
    of the key reasons for its popularity is its object-oriented programming (OOP)
    model. OOP allows developers to write code that is organized, reusable, and easy
    to maintain. This chapter will cover Classes, Objects, and Methods, Inheritance,
    Encapsulation, Abstract Classes and Interfaces, and Working with Java Collections—all
    fundamental OOP concepts that will help you write better Java programs.


    # ## Classes, Objects, and Methods


    At the heart of Java’s object-oriented approach are classes, objects, and methods.
    To understand how they work, imagine a blueprint for a house. The blueprint (class)
    defines how the house should be built, but the actual house (object) is constructed
    based on that blueprint.


    # ## What is a Class?'
- md: "\nA class in Java is like a blueprint that defines the structure and behavior\
    \ of objects. It contains variables (also known as fields or attributes) and methods\
    \ (functions that perform operations).\n\nHere’s a simple Java class:\n\n```java\n\
    class Car {\n\n    String brand;\n\n    int speed;\n\n    void drive() {\n   \
    \     System.out.println(brand + \" is driving at \" + speed + \" km/h\");\n \
    \   }\n}\n```\n\n# What is an Object?\n\nAn object is an instance of a class.\
    \ It is a real entity created using the class blueprint.\n\n```\nHere’s how we\
    \ create an object of the Car class:\npublic class Main {\n\n    public static\
    \ void main(String[] args) {\n\n        Car myCar = new Car(); // Creating an\
    \ object\n        myCar.brand = \"Toyota\";\n\n        myCar.speed = 120;\n\n\
    \        myCar.drive(); // Calling a method \n    }\n}\n```\n\n# What are Methods?\n\
    \nMethods are functions inside a class that define the behavior of objects. In\
    \ the above example, drive() is a method that prints a message. Methods help organize\
    \ code and avoid repetition.\n\n# Method Parameters and Return Values\n\nMethods\
    \ can also take parameters and return values: class MathOperations {\n\n```java\n\
    int add(int a, int b) {\n\n    return a + b;\n}\n}\n```\n\nCalling the method:\n\
    \nMathOperations math = new MathOperations(); int result = math.add(5, 10);\n\n\
    System.out.println(result); // Output: 15\n\n# Inheritance and Encapsulation\n\
    \nOOP provides features like inheritance and encapsulation, which make code more\
    \ structured, reusable, and secure.\n\n# What is Inheritance?\n\nInheritance allows\
    \ one class to inherit properties and methods from another class. This reduces\
    \ code duplication and improves reusability.\n\n# Example of Inheritance\n\n```java\n\
    class Animal {\n    void makeSound() {\n        System.out.println(\"Animal makes\
    \ a sound\"); \n    }\n}\n\nclass Dog extends Animal {\n    void bark() {\n  \
    \      System.out.println(\"Dog barks\"); \n    }\n}\n```\n\nUsing inheritance:\n\
    \n```java\npublic class Main {\n\n    public static void main(String[] args) {\n\
    \    Dog myDog = new Dog(); myDog.makeSound(); // Inherited method\n    myDog.bark();\
    \ // Own method\n    }\n}\n```\n\nThe Dog class inherits makeSound() method from\
    \ the Animal class, making the code more efficient and organized.\n\n# What is\
    \ Encapsulation?\n\nEncapsulation means hiding data inside a class and allowing\
    \ controlled access using getters and setters.\n\n# Example of Encapsulation\n\
    \n```java\nclass BankAccount {\n    private double balance; public void setBalance(double\
    \ amount) {\n\nif (amount > 0) {\n    balance = amount;\n}\n```\n\n```java\npublic\
    \ double getBalance() {\n    return balance;\n}\n```\n\nEncapsulation protects\
    \ data from being accessed or modified directly.\n\n# Abstract Classes and Interfaces\n\
    \nSometimes, you want to create a class that only provides structure without implementing\
    \ full functionality. Java allows this through abstract classes and interfaces.\n\
    \n# Abstract Classes\n\nAn abstract class is a class that cannot be instantiated\
    \ (you cannot create an object of it). It often contains abstract methods that\
    \ must be implemented by its subclasses.\n\nExample of an Abstract Class\n\n```java\n\
    abstract class Animal {\n    abstract void makeSound(); // Abstract method\n \
    \   void sleep() {\n        System.out.println(\"Sleeping...\");\n    }\n}\n\n\
    class Cat extends Animal {\n    void makeSound() {\n        System.out.println(\"\
    Meow\");\n    }\n}\n}\n```\n\nUsing the abstract class:\n\n```java\npublic class\
    \ Main {\n\n    public static void main(String[] args) {\n\n    Cat myCat = new\
    \ Cat();\n\n    myCat.makeSound(); // Output: Meow\n    myCat.sleep(); // Output:\
    \ Sleeping...\n\n    }\n}\n```\n\n# Interfaces\n\nAn interface is like a contract\
    \ that defines what a class should do, but not how.\n\nExample of an Interface\n\
    \n```java\ninterface Vehicle {\n\n  void start();\n\n}\n```\n\n```java\nclass\
    \ Car implements Vehicle {\n\n  public void start() {\n    System.out.println(\"\
    Car is starting...\"); \n  }\n}\n```\n\nInterfaces allow **multiple inheritance**\
    \ in Java because a class can **implement multiple interfaces.**\n\n# Working\
    \ with Java Collections\n\nJava provides the **Collections Framework**, which\
    \ includes **powerful data structures** for handling large amounts of data efficiently.\n\
    \n# Common Java Collections\n\n1. ArrayList - Stores dynamic lists of elements.\n\
    2. LinkedList - Stores data as linked nodes.\n3. HashMap - Stores key-value pairs.\n\
    4. HashSet - Stores unique elements.\n\n# Example of an ArrayList\n\n```java\n\
    import java.util.ArrayList;\n\npublic class Main {\n\n    public static void main(String[]\
    \ args) {\n\n        ArrayList<String> names = new ArrayList<>();\n        names.add(\"\
    Alice\");\n\n        names.add(\"Bob\"); names.add(\"Charlie\");\n\n        for\
    \ (String name : names) {\n            System.out.println(name);\n        }\n\
    \    }\n}\n```\n\n# Example of a HashMap\n\n```java\nimport java.util.HashMap;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        HashMap<String,\
    \ Integer> ageMap = new HashMap<>();\n        ageMap.put(\"Alice\", 25);\n   \
    \     ageMap.put(\"Bob\", 30);\n\n        System.out.println(ageMap.get(\"Alice\"\
    )); // Output: 25\n    }\n}\n```\n"
