    \ = \"Red\";\n    myCar.make = \"Toyota\";\n    myCar.speed = 0;\n    myCar.accelerate();\n\
    \    myCar.honk();\n}\n```\n\n在这种情况下，`Car` 类**继承**了 `Vehicle` 类的 `color`、`speed`\
    \ 和 `accelerate()` 方法。这意味着 `Car` 对象拥有 `Vehicle` 的所有属性，也可以具有额外的功能，例如 `honk()` 方法。\n\
    \n# 指针与动态内存分配\n\n在 C++ 中，**指针**是存储另一个变量内存地址的变量。指针允许你访问并修改存储在该地址的值。这对于内存管理特别有用。\n\
    \n让我们来看一个指针的示例：\n\n```cpp\nint main() {\n    int a = 10;\n    int* ptr = &a; //\
    \ ptr 存储 a 的地址\n    *ptr = 20; // 通过 ptr 修改 a 的值\n    cout << \"Value of a: \"\
    \ << a << endl;\n}\n```\n\n在 C++ 中，**动态内存分配**允许你在运行时分配内存。这是通过 `new` 和 `delete`\
    \ 运算符来实现的。当数据大小预先未知时，这非常有用。\n\n```cpp\nint main() {\n    int* ptr = new int; //\
    \ 在堆上分配内存\n    *ptr = 50;\n    cout << *ptr << endl;\n    delete ptr; // 释放内存以防止泄漏\n\
    }\n```\n\n"
