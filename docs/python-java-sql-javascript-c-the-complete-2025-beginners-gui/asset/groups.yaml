    \n# 为什么要使用 JavaFX？\n\nJavaFX 广泛用于跨平台 GUI 应用，原因如下：\n- 它具有现代、时尚的 UI 和流畅的动画。\n- 它使用\
    \ FXML，这是一种基于 XML 的标记语言，可以将 UI 设计与逻辑分离。\n- 它支持 CSS 样式，使得自定义应用程序外观变得简单。\n- 它能与其他\
