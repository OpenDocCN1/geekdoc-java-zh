    `int age = 25; // 一个存储整数的、名为 age 的变量`\n`double price = 99.99; // 一个浮点数`\n`boolean\
    \ isFun = true; // 一个存储 true/false 的布尔值`\n\n## Java 中的数据类型\n\nJava 有两大类数据类型：\n\
    1. **基本数据类型** - 内置类型，如 `int, double, char, boolean` 等。\n2. **引用数据类型** - 使用类创建的自定义对象和数组。\n\
    \n以下是 Java 基本类型的详细介绍：\n\n| 数据类型 | 说明 | 示例 |\n| --- | --- | --- |\n| byte | 8 位整数，用于小数字\
    \ | byte b = 100; |\n| short | 16 位整数，范围比 byte 稍大 | short s = 32000; |\n| int\
    \ | 32 位整数，常用于整数 | int x = 200000; |\n| long | 64 位整数，用于大数字 | long l = 9000000000L;\
    \ |\n| float | 32 位浮点数，用于小数值 | float f = 5.75f; |\n| double | 64 位浮点数，比 float\
    \ 更精确 | double d = 19.99; |\n| char | 存储单个字符 | char letter = ''; |\n| boolean\
    \ | 存储 true 或 false | boolean isJavaGood = true; |\n\n## Java 中的运算符\n\n运算符用于对变量和值进行操作。Java\
    \ 有若干种类型的运算符：\n- 算术运算符：+, -, *, /, %\n- 关系（比较）运算符：==, !=, >, <, >=, <=\n- 逻辑运算符：&&,\
    \ ||, !\n- 赋值运算符：=, +, -=, *, /=, %, 等\n\n算术和逻辑运算符的示例：`int a = 10, b = 5;`\n\n\
    ```java\nSystem.out.println(a + b); // 15\nSystem.out.println(a > b && b < 20);\
    \ // true \n```\n\nJava 强制类型安全，这意味着你不能将 int 值赋值给 boolean 变量或对不兼容的类型执行操作。\n\n##\
    \ 控制流（if 语句、循环）\n\nJava 提供了控制流语句来帮助决策和重复任务。\n\n### 条件语句 (if, else, switch)\n\n\
    ## if 语句\n\nif 语句仅在条件求为真时执行代码。\n\n```java\nint age = 18;\nif (age >= 18) {\n \
    \   System.out.println(\"You are an adult.\");\n}\n```\n\n## if-else 语句\n\n如果条件为假，则执行\
    \ else 块。\n\n```java\nint age = 16;\nif (age >= 18) {\n    System.out.println(\"\
    You can vote.\");\n} else {\n    System.out.println(\"You are too young to vote.\"\
    );\n}\n```\n\n## switch 语句\n\n在处理多个可能值时，switch 语句比多个 if-else 条件更清晰。\n\n```java\n\
    int day = 3;\nswitch (day) {\n    case 1: System.out.println(\"Monday\"); break;\
    \ \n    case 2: System.out.println(\"Tuesday\"); break; \n    case 3: System.out.println(\"\
    Wednesday\"); break; \n    default: System.out.println(\"Invalid day\");\n}\n\
    ```\n\n## Java 中的循环\n\n循环允许我们多次执行代码。\n\n### for 循环\n\n用于已知迭代次数的情况。\n\n```java\n\
    for (int i = 0; i < 5; i++) {\n    System.out.println(\"Iteration: \" + i);\n\
    }\n```\n\n### while 循环\n\n用于迭代次数未知的情况。\n\n```java\nint count = 0;\nwhile (count\
    \ < 5) {\n    System.out.println(\"Count: \" + count);\n    count++;\n}\n```\n\
    \n### do-while 循环\n\n类似于 while，但会在检查条件之前执行。\n\n```java\nint number = 10;\ndo {\n\
    \    System.out.println(\"Number: \" + number);\n} while (number < 5);\n```\n\n\
    ## Java 中的方法\n\n**方法**是执行特定任务的代码块。\n\n### 定义方法\n\n```java\npublic class Main {\n\
    \    static void greet() {\n        System.out.println(\"Hello, World!\");\n \
    \   }\n\n    public static void main(String[] args) {\n        greet(); // 调用方法\n\
    \    }\n}\n```\n\n### 带参数和返回类型的方法\n\n```java\npublic class Calculator {\n    static\
    \ int add(int a, int b) {\n        return a + b;\n    }\n\n    public static void\
    \ main(String[] args) {\n        int sum = add(5, 10);\n        System.out.println(\"\
    Sum: \" + sum);\n    }\n}\n```\n\n## Java 中的异常处理\n\n异常在程序运行出错时发生。如果不处理异常，程序将会崩溃。\n\
    \n### Try-Catch 块\n\ntry 块包含可能异常的代码，而 catch 块处理异常。\n\n```java\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
