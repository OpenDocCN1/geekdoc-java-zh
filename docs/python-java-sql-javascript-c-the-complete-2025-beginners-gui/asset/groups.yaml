    \ catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    Index out of range\");\n        } finally {\n            System.out.println(\"\
    This block always runs.\");\n        }\n    }\n}\n```\n\n## throw 和 throws 关键字\n\
    \n- throw 用于手动生成异常。\n- throws 声明一个方法可能会抛出异常。\n\n```java\npublic class Test {\n\
    \    static void checkAge(int age) throws IllegalArgumentException {\n       \
    \ if (age < 18) throw new IllegalArgumentException(\"Not eligible\");\n    }\n\
    \n    public static void main(String[] args) {\n        checkAge(16); // 将抛出一个异常\n\
    \    }\n}\n```\n\n这些 Java 基础概念是编写高效程序的基础。掌握变量、控制流、方法和异常处理将使你能够编写出整洁、结构化良好的 Java\
    \ 程序。\n\n## 第 8 章：面向对象的 Java \n\nJava 是世界上最流行的编程语言之一，其受欢迎的主要原因之一是它的面向对象编程（OOP）模型。OOP\
    \ 允许开发者编写组织、可重用且易于维护的代码。本章将涵盖类、对象和方法、继承、封装、抽象类和接口以及 Java 集合的使用——这些都是帮助你编写 Java\
