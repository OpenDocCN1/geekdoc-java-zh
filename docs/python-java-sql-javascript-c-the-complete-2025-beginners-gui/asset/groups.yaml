    # Understanding Databases and Relational Models


    A **database** is an organized collection of data. Think of it as a digital filing
    cabinet where information is stored and can be retrieved when needed. The structure
    and organization of a database determine how efficiently data can be accessed,
    modified, and maintained.


    # Types of Databases:


    +   1. **Relational Databases (SQL-Based)** - These databases use **tables** to
    store data in a structured format, with rows representing records and columns
    representing attributes. Examples include **MySQL, PostgreSQL, and Oracle.**

    2. **NoSQL Databases** - These databases store data in **key-value pairs, documents,
    graphs, or wide-column stores** instead of tables. Examples include MongoDB, Cassandra,
    and Redis.**

    3. **Flat-File Databases** - Simple text-based storage systems, often used for
    small-scale applications. Examples include CSV and JSON files.'
  - '[PAGE 116]


    For this book, we will focus on **relational databases**, as they are the most
    widely used and rely on SQL for data management.


    # # Understanding the Relational Model


    The **relational model** is based on the concept of **tables (relations)**. Each
    table consists of **rows (records)** and **columns (fields/attributes).**


    For example, consider an **Employee Table** in a company''s database:


    | Employee_ID | Name | Age Department | Salary |

    | --- | --- | --- | --- |

    | 101 | Alice | 30 HR | 50000 |

    | 102 | Bob | 35 IT | 70000 |

    | 103 | Charlie | 28 Marketing | 55000 |'
  - '[PAGE 117]


    # # Key Concepts in Relational Databases:


    +   - **Primary Key** - A unique identifier for each record in a table. Example:
    Employee_ID uniquely identifies each employee.


    +   - **Foreign Key** - A column in one table that references a primary key in
    another table to establish relationships. Example: Department_ID in an Employee
    table may reference a Departments table.


    +   - **Normalization** - The process of structuring data to **reduce redundancy**
    and **improve consistency.**


    +   - **Indexes** - Special lookup tables that speed up queries in large databases.


    Relational databases allow **data integrity**, meaning data remains accurate,
    consistent, and reliable. They also support powerful **querying and reporting**
    capabilities, making them ideal for complex applications.


    **Understanding the relational model is crucial because it forms the foundation
    of SQL-based databases.**'
