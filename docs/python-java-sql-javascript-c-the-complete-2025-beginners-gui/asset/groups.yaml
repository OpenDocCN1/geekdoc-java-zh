    \  System.out.println(\"Cannot divide by zero!\");\n        }\n    }\n}\n```\n\
    \n### Finally 块\n\n无论是否发生异常，finally 块都会执行。\n\n```java\npublic class Main {\n \
    \   public static void main(String[] args) {\n        try {\n            int[]\
