    \n# 构造函数、析构函数与继承\n\n## 构造函数\n\n构造函数是 C++ 中一种特殊的函数类型，当从类创建对象时会被自动调用。它的主要目的是用默认值或用户定义的值初始化对象的成员变量（属性）。\n\
    \n考虑这样一种场景：你想创建一个类的对象，并想确保它已经设置了一些初始值。构造函数会自动处理这个问题。\n\n这里有一个示例：\n\n```cpp\nclass\
