    # 了解数据库与关系模型


    **数据库**是组织良好的数据集合。你可以将其想象成一个数字档案柜，其中存储了信息并在需要时可以检索。数据库的结构和组织决定了访问、修改和维护数据的效率。


    # 数据库的类型：


    - 1. **关系型数据库（基于 SQL）** - 这些数据库使用**表格**以结构化格式存储数据，其中行表示记录，列表示属性。示例包括 **MySQL、PostgreSQL
    和 Oracle。**

    - 2. **NoSQL 数据库** - 这些数据库使用**键值对、文档、图谱或宽列存储**来存储数据，而不是表格。示例包括 MongoDB、Cassandra
    和 Redis。

    - 3. **平文件数据库** - 简单的基于文本的存储系统，通常用于小型应用程序。示例包括 CSV 和 JSON 文件。


    在本书中，我们将重点关注**关系型数据库**，因为它们是使用最广泛的数据库，并且依赖 SQL 进行数据管理。


    # 了解关系模型


    **关系模型**基于**表（关系）**的概念。每张表都由**行（记录）**和**列（字段/属性）**组成。


    例如，考虑公司数据库中的**员工表**：


    | Employee_ID | Name | Age | Department | Salary |

    | --- | --- | --- | --- | --- |

    | 101 | Alice | 30 | HR | 50000 |

    | 102 | Bob | 35 | IT | 70000 |

    | 103 | Charlie | 28 | Marketing | 55000 |


    # 关系型数据库的核心概念：


    - **主键 (Primary Key)** - 用于标识表表中每条记录的唯一标识符。例如：Employee_ID 唯一标识每位员工。

    - **外键 (Foreign Key)** - 一个表中的列，通过引用另一表中的主键来建立关系。例如：员工表中的 Department_ID 可能引用部门表。

    - **规范化 (Normalization)** - 对数据进行结构化以**减少冗余**并**提高一致性**的过程。

    - **索引 (Indexes)** - 特殊的查找表，可加速大型数据库中的查询。


    关系型数据库允许**数据完整性**，这意味着数据保持准确、一致且可靠。它们还支持强大的**查询和报告**功能，使其成为复杂应用程序的理想选择。


    **理解关系模型是至关重要的，因为构成了基于 SQL 的数据库的基础。**


    # 安装 MySQL 和 PostgreSQL


    在开始使用 SQL 之前，你需要一个数据库管理系统（DBMS）来存储和管理你的数据。两个最流行的开源 SQL 数据库是 MySQL 和 PostgreSQL。


    ## MySQL vs PostgreSQL：你应该选择哪一个？


    两者都是极佳的选择，但存在关键区别：


    | 特性 | MySQL | PostgreSQL |

    | --- | --- | --- |

    | 性能 | 密集型操作速度更快 | 更适合复杂查询和写密集型工作负载 |

    | 可扩展性 | 自定义有限 | 通过自定义函数具有高度可扩展性 |


    | ACID 合规性 | MySQL | PostgreSQL |

    | --- | --- | --- |

    | 引擎 | 部分符合（使用 InnoDB 引擎） | 完全符合 |

    | 使用场景 | 适用于 Web 应用和 CMS 平台（如 WordPress） | 数据分析、企业级应用的理想之选 |


    对于 Web 应用，通常首选 MySQL。对于复杂的数据处理和分析，PostgreSQL 是更好的选择。


    # 如何安装 MySQL


    Windows 安装：


    1. 下载 MySQL - 访问官方网站：https://dev.mysql.com/downloads/

    2. 运行安装程序 - 选择“MySQL Installer for Windows”并按照向导进行设置。

    3. 选择组件 - 选择“Server”（服务器）、“Workbench”（GUI 工具）和“Shell”（命令行）。

    4. 配置服务器 - 设置 root 密码，选择默认设置并完成安装。

    5. 验证安装 - 打开 MySQL Workbench 并连接到服务器。


    Mac 安装（通过 Homebrew）：


    1. 打开终端并输入：`brew install mysql`

    2. 启动 MySQL：`brew services start mysql`


    Linux 安装（Ubuntu/Debian）：


    1. 更新包列表：`sudo apt update`

    2. 安装 MySQL：`sudo apt install mysql-server`

    3. 安全配置：`sudo mysql_secure_installation`


    # 如何安装 PostgreSQL


    Windows 安装：


    1. 下载 PostgreSQL - 访问官方网站：https://www.postgresql.org/download/

    2. 运行安装程序 - 按照向导进行设置。

    3. 选择组件 - 选择服务器、工具和命令行界面。

    4. 配置服务器 - 设置密码和端口。

    5. 验证安装 - 使用 pgAdmin 连接。


    Mac 安装（通过 Homebrew）：


    1. 打开终端并输入：`brew install postgresql`

    2. 启动 PostgreSQL：`brew services start postgresql`


    Linux 安装（Ubuntu/Debian）：


    1. 更新包列表：`sudo apt update`

    2. 安装 PostgreSQL：`sudo apt install postgresql`

    3. 验证：`sudo -u postgres psql`


    '
