    \n# 构建一个简单的 JavaFX \n\n一个基础的 JavaFX 程序遵循以下步骤：\n1. 设置主类：每个 JavaFX 都继承 `Application`\
    \ 类。\n2. **创建阶段 (Stage)**：阶段代表应用程序窗口。\n3. **定义场景 (Scene)**：场景承载所有的 UI 元素（按钮、文本字段等）。\n\
