    \n# 数据的过滤与排序\n\n现在你已经了解了如何检索和处理数据，下一步是**优化你的查询**，以提取**仅相关信息**。这就是过滤和排序大显用场。\n\n\
    ## 1. 使用 WHERE 子句过滤数据\n\n过滤可以帮助你**缩小**结果范围，仅保留特定特定条件。\n\n示例：\n\n```\nSELECT *\
    \ FROM employees WHERE salary > 50000; 这将只返回工资超过 $50,000 的员工。\n```\n\n你也可以使用**多个条件：**\
    \ SELECT * FROM employees WHERE department = 'IT' AND salary > 60000; 这将检索工资**高于\
    \ $60,000** 的员工。\n\n如需进行灵活过滤，请使用 **OR：** SELECT * FROM employees WHERE department\
    \ = 'Sales' OR department = 'Marketing'; 这将返回**销售部或市场部**的所有员工。\n\n# 2. 使用 ORDER\
    \ BY 对数据进行排序\n\n排序让你的数据**更具读性**。你可以按**升序 (ASC)** 或**降序 (DESC)** 顺序排序。\n\n示例：\n\
    \n```\nSELECT * FROM employees ORDER BY name ASC; 这按字母顺序对员工进行排序。\n```\n\n```\n\
    SELECT * FROM employees ORDER BY salary DESC; 这按**工资从高到低**排序员工。\n```\n\n如果你想设置多个排序条件，可以这样做：SELECT\
    \ * FROM employees ORDER BY department ASC, salary DESC; 这先按部门安排员工，然后在每个部门内部按工资从高到低排序。\n\
    \n# 聚合函数与分组\n\n在处理大量数据时，你通常需要汇总信息。聚合函数有助于高效地分析和解释数据。\n\n# 1. 常用聚合函数\n\nSUM():\
    \ 求加值\n\n```\nSELECT SUM(salary) FROM employees WHERE department = 'IT'; 这返回所有\
    \ IT 员工的工资工资。\n```\n\nAVG(): 计算平均值\n\n```\nSELECT AVG(salary) FROM employees;\
    \ 这计算所有员工的**平均工资**。\n```\n\nMAX() 和 MIN(): 查找最高和最低值\n\n```\nSELECT MAX(salary)\
    \ FROM employees; 这提供了**最高工资**。\n\nSELECT MIN(salary) FROM employees; 这提供了**最低工资**。\n\
    ```\n\nCOUNT(): 计数记录\n\n```\nSELECT COUNT(*) FROM employees WHERE department =\
    \ 'Finance'; 这**统计了财务部有多少名员工**。\n```\n\n# 2. 使用 GROUP BY 对数据进行分组\n\n有时，你想按**类别**汇总数据。\n\
    **GROUP BY** 子句可以实现这一点。\n\n# 示例：\n\n```\nSELECT department, AVG(salary) FROM employees\n\
    GROUP BY department; 这计算**每个部门的平均工资**。\n```\n\n# 使用 COUNT() 的示例：\n\n```\nSELECT\
    \ department, COUNT(*) FROM employees\nGROUP BY department; 这统计了每个部门**有多少员工**。\n\
    ```\n\n- **重要说明：** 如果你使用 GROUP BY，SELECT 中的每一列必须**要么分组，要么经过聚合**。\n\n精通这些 SQL 基础知识将赋予你**高效控制和分析数据的能力**。无论是查询记录、插入新数据、更新信息还是删除过时的条目，这些技能构成了数据库操作的**基础**。\n\
    \n一旦你熟悉了这些概念，下一步就是编写更高级的查询，结合多个表、优化性能并自动化重复任务。\n\n现在是时候动手操作了——打开数据库开始练习吧！\n\n\
    # 第 13 章：高级 SQL 概念\n\n# 理解连接与关系\n\n在操作数据库时，高效地检索数据与正确存储数据同样重要。大多数现实应用都涉及多个表，为了理解数据，你必须理解如何将它们链接在一起。这就是连接（Joins）和关系（Relationships）发挥作用的地方。\n\
    \n# 1. 什么是表关系？\n\nSQL 中的关系指的是两个或多个表通过公共字段连接的方式。最常见的关系有：\n\n- 一一 (1:1) - 表 A 中的单条记录与表\
    \ B 中的一条记录相关。例如：国家与其首都。\n- 一对多 (1:M) - 表 A 中的一条记录与表 B 中的多条记录相关。例如：客户与其订单。\n- 多对多\
    \ (M:M) – 表 A 中的一条记录与表 B 中的多条记录相关，反之亦然。例如：学生与课程（一个学生可以参加多门课程，一门课程有很多学生）。\n\n#\
    \ 2. 理解 SQL 连接 (Joins)\n\nSQL 连接帮助你以意义的方式从多个相关表中检索数据。你将频繁使用的连接共有四类型：\n\n## a)\
    \ INNER JOIN（内连接）\n\n这是最常用的连接。它根据公共字段返回两个表之间匹配的记录。\n\n示例：假设你有两个表，Customers（客户）和\
    \ Orders（订单），只想检索下过订单的客户。\n\n```\nSELECT Customers.CustomerID, Customers.Name,\
    \ Orders.OrderID, Orders.Amount FROM Customers\nINNER JOIN Orders ON Customers.CustomerID\
    \ = Orders.CustomerID; 这将只返回下过至少订单的客户。\n```\n\n## b) LEFT JOIN（左连接，或 LEFT OUTER\
    \ JOIN）\n\n这从左表检索所有记录，并返回右表的匹配记录。如果没有匹配，则右表将返回 NULL 值。\n\n```\nSELECT Customers.CustomerID,\
    \ Customers.Name, Orders.OrderID, Orders.Amount FROM Customers\nLEFT JOIN Orders\
    \ ON Customers.CustomerID = Orders.CustomerID; 此查询返回所有客户，即使他们没有下过订单。\n```\n\n\
    ## c) RIGHT JOIN（右连接，或 RIGHT OUTER JOIN）\n\n与 LEFT JOIN 类似，但它返回右表的所有记录和左表的匹配记录。\n\
    \n```\nSELECT Customers.CustomerID, Customers.Name, Orders.OrderID, Orders.Amount\
    \ FROM Customers\nLEFT JOIN Orders ON Customers.CustomerID = Orders.CustomerID;\
    \ 此查询返回所有客户，即使他们没有下过订单。\n```\n\n## d) FULL JOIN（全连接，或 FULL OUTER JOIN）\n\nFULL\
    \ JOIN 返回两个表的所有记录，在没有匹配的地方填充 NULL。\n\n```\nSELECT Orders.OrderID, Orders.Amount,\
    \ Customers.CustomerID, Customers.Name FROM Orders\nRIGHT JOIN Customers ON Orders.CustomerID\
    \ = Customers.CustomerID; 显示所有订单，即使没有对应的客户（在设计良好的数据库中不会这种情况）。\n```\n\n# 3. 何时使用连接？\n\
    \n- 当只需要匹配记录时使用 INNER JOIN。\n- 当需要一个表的所有记录即使另一个表没有匹配时使用 LEFT JOIN。\n- 当右表优先时使用\
    \ RIGHT JOIN。\n- 当你需要全部时使用 FULL JOIN。\n\n# 用于性能的索引\n\n数据库在处理数百万记录时会变慢。这就是索引用用——它帮助数据库更快地定位和检索数据，就像书的索引一样。\n\
    \n# 1. 什么是索引？\n\n索引是一种特殊的查找表，数据库利用它加速数据检索。与其扫描所有行，索引可以直接跳转到所需的记录。\n\n# 2. SQL\
    \ 中的索引类型\n\na) 主键索引（聚集索引）\n\n- 主键会自动创建一个聚集索引。\n- 它根据索引物理地安排表中的数据。\n\n```\nCREATE\
    \ INDEX idx_customer ON Customers(CustomerID);\n 这加速了通过 CustomerID 搜索客户的查询。\n\
    ```\n\nb) 非聚集索引（Non聚集索引）\n\n- 非聚集索引保持一个独立的结构，带有指向实际数据的指针。\n- 适用于搜索不是主键的列。\n\n\
    ```\nCREATE INDEX idx_lastname ON Customers(LastName);\n 这有助于经常按 LastName搜索的查询运行更快。\n\
    ```\n\nc) 复合索引（Composite Index）\n\n- 多列的索引，用于优化涉及这些列的搜索。\n\n```\nCREATE INDEX\
    \ idx_name_city ON Customers(LastName, City);\n 这加速了同时过滤姓和城市的查询。\n```\n\n# 3.\
    \ 何时使用索引？\n\n- 在大表上使用索引以提高查询速度。\n- 在 WHERE、ORDER BY 或 JOIN 条件中频繁使用的列上使用。\n- 避免过多索引——它们会减慢\
    \ INSERT 和 UPDATE 操作。\n\n"
