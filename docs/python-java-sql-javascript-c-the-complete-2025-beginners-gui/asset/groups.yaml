    \n继承允许一个类从另一个类继承属性和方法。这减少了代码重复并提高了重用性。\n\n# 继承示例\n\n```java\nclass Animal {\n\
    \    void makeSound() {\n        System.out.println(\"Animal makes a sound\");\
    \ \n    }\n}\n\nclass Dog extends Animal {\n    void bark() {\n        System.out.println(\"\
    Dog barks\"); \n    }\n}\n```\n\n使用继承：\n\n```java\npublic class Main {\n\n   \
    \ public static void main(String[] args) {\n    Dog myDog = new Dog(); myDog.makeSound();\
    \ // 继承的方法\n    myDog.bark(); // 自有的方法\n    }\n}\n```\n\nDog 类继承了 Animal 类的 makeSound()\
    \ 方法，使得代码更高效、更有组织。\n\n# 什么是封装？\n\n封装意味着将数据隐藏在类内部，并允许 getter 和 setter 进行受控访问。\n\
    \n# 封装示例\n\n```java\nclass BankAccount {\n    private double balance; public void\
    \ setBalance(double amount) {\n\nif (amount > 0) {\n    balance = amount;\n}\n\
    ```\n\n```java\npublic double getBalance() {\n    return balance;\n}\n```\n\n\
    封装保护数据不受直接访问或修改。\n\n# 抽象类和接口\n\n有时，你想创建一个只提供结构而不实现完整功能的类。Java 通过抽象类和接口允许这一点。\n\
    \n# 抽象类\n\n抽象类是一种无法实例化的类（你不能创建它的对象）。它通常包含子类必须实现的抽象方法。\n\n抽象类示例\n\n```java\nabstract\
    \ class Animal {\n    abstract void makeSound(); // 抽象方法\n    void sleep() {\n\
    \        System.out.println(\"Sleeping...\");\n    }\n}\n\nclass Cat extends Animal\
    \ {\n    void makeSound() {\n        System.out.println(\"Meow\");\n    }\n}\n\
    }\n```\n\n使用抽象类：\n\n```java\npublic class Main {\n\n    public static void main(String[]\
    \ args) {\n\n    Cat myCat = new Cat();\n\n    myCat.makeSound(); // 输出: Meow\n\
    \    myCat.sleep(); // 输出: Sleeping...\n\n    }\n}\n```\n\n# 接口\n\n接口像一份合同，定义了类应该做什么，但不定义怎么做。\n\
    \n接口示例\n\n```java\ninterface Vehicle {\n\n  void start();\n\n}\n```\n\n```java\n\
    class Car implements Vehicle {\n\n  public void start() {\n    System.out.println(\"\
    Car is starting...\"); \n  }\n}\n```\n\n接口允许 Java 中的**多重继承**，因为一个类可以**实现多个接口**。\n\
    \n# 使用 Java 集合\n\nJava 提供了**集合框架 (Collections Framework)**，它包含了**强大的数据结构**，用于高效处理大量数据。\n\
    \n# 常见的 Java 集合\n\n1. ArrayList - 存储动态元素列表。\n2. LinkedList - 以节点的形式存储数据。\n3. HashMap\
    \ - 存储键值对。\n4. HashSet - 存储唯一元素。\n\n# ArrayList 示例\n\n```java\nimport java.util.ArrayList;\n\
    \npublic class Main {\n\n    public static void main(String[] args) {\n\n    \
    \    ArrayList<String> names = new ArrayList<>();\n        names.add(\"Alice\"\
    );\n\n        names.add(\"Bob\"); names.add(\"Charlie\");\n\n        for (String\
    \ name : names) {\n            System.out.println(name);\n        }\n    }\n}\n\
    ```\n\n# HashMap 示例\n\n```java\nimport java.util.HashMap;\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        HashMap<String, Integer>\
    \ ageMap = new HashMap<>();\n        ageMap.put(\"Alice\", 25);\n        ageMap.put(\"\
    Bob\", 30);\n\n        System.out.println(ageMap.get(\"Alice\")); // 输出: 25\n\
    \    }\n}\n```\n"
