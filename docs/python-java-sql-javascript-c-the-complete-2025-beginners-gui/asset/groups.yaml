    # Chapter 6: Introduction to Java


    # What is Java?


    Java is a **high-level, object-oriented programming language** that has been around
    since 1995. It was developed by **Sun Microsystems** (now owned by **Oracle Corporation**)
    with one primary goal: **write once, run’anywhere (WORA)**. This means that a
    Java program written on one system can run on any other system that supports Java,
    without needing modifications.


    Java powers **millions of applications worldwide, enterprise-level systems and
    web applications to Android apps and embedded devices**. Some of the most well-known
    platforms—like **LinkedIn**, **Netflix, and Amazon**—use Java at their core.


    The beauty of Java lies in its **simplicity, security, and platform independence**.
    Unlike lower-level languages like C or C++, Java handles **memory management automatically
    through** garbage collection, reducing the risk of memory leaks. It is also **highly
    scalable**, making it an excellent choice for large projects.


    Key Features of Java:


    +   **Object-Oriented**: Everything in Java revolves around objects and classes,
    making it easy to design and maintain applications.


    +   **Platform-Independent**: Thanks to the **Java Virtual Machine (JVM)**, Java
    code can run on any operating system.'
