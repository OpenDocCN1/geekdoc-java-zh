    ## 第 28 章：职业路径与获得科技工作


    科技行业是目前增长最快、回报最丰厚的职业领域之一。凭借正确的技能和策略，你可以获得高薪工作、进行远程办公，甚至开启你**自己的**自由职业业务。然而，竞争非常激烈，公司正在寻找不仅懂编程，还能**高效地解决现实世界问题**的程序员。


    在本章中，我将带你了解通获得科技工作的三个关键方面：**创建强大的作品集、寻找自由职业和全职工作机会，以及准备代码面试。**这些步骤将为你提供一幅进入并在该行业蓬勃发展的**清晰路线图**。


    ## 如何创建一个强大的编程作品集


    编程作品集是你找工作时**最强大的工具**。与在纸上列出技能的传统简历不同，作品集能**展示你的实战能力**。它能让雇主在面试你之前看到你能够完成的工作类型。


    ### 为什么你需要作品集？


    大多数公司针对单个职位发布会收到数百份申请。一个结构良好的作品集可以帮助你脱颖而出。如果你没有相关的工作经验，你的作品集可以证明你的能力，让雇主相信你有能力胜任该职位。


    ### 作品集中应该包含什么


    #### 1. 一个整洁且专业的网站

    - 你的作品集应该托管在个人网站上。

    - 使用 GitHub Pages、Netlify 或简单的 WordPress 站点。

    - 确保网站整洁、易于导航且组织良好。


    #### 2. 展示技能的项目

    - 重点关注质量而非数量。与其包含 10 个微小且杂乱的项目，不如包含 3-5 个结构良好且展示你最佳水平的项目。

    - 如果你申请的是后端职位，请展示 API 项目和数据库驱动的应用。

    - 如果你是前端开发者，请突出具有整洁用户界面（UI）且视觉良好的 Web 应用。


    #### 3. 项目描述和源代码

    - 每个项目都应该有一个简短描述，说明它的功能以及使用了哪些技术。

    - 包含 GitHub 仓库链接，以便雇主检查源代码。


    #### 4. 简短介绍和联系方式

    - 为自己写一段简短的介绍——你是谁、你的技术栈以及你热爱什么。

    - 添加联系详情或表单，以便招聘人员方便地联系你。


    #### 5. 证言或贡献

    - 如果你参与过开源项目或帮助他人完成过项目，请包含他们提供的推荐或反馈。

    - 这将增加你的信誉，并证明你能够与他人协作。


    一个强大的作品集不仅能帮你找到工作，还能帮助你谈判更高的薪水，因为雇主会看到你的能力。


    ## 在哪里寻找自由职业和全职科技工作


    现在你已经有了一个坚实的作品集，是时候开始寻找机会了。无论你想找全职职位还是自由职业任务，都有许多公司和客户正在积极招聘程序员。


    ### 寻找全职科技工作的最佳平台


    1. [LinkedIn](https://www.linkedin.com/)

    - 创建一个强大的 LinkedIn 简介并用与你的技能相关的关键词进行优化。

    - 与招聘人员建立联系并直接在平台上申请科技工作。

    2. [Indeed](https://www.indeed.com/)

    - 全球最大的科技职位搜索搜索引擎之一。

    - 根据职位类型、薪资范围和位置应用过滤器。

    3. [AngelList](https://angel.co/)

    - 最适合寻找提供远程工作或股权激励的初创公司科技工作。

    - 初创公司通常会招聘表现出潜力的新手。

    4. [Stack Overflow Jobs (https://stackoverflow.com/jobs/)]

    - 公司专门为开发者和工程师发布职位列表。

    - 包含全球公司的远程工作机会。


    ### 寻找自由职业编程工作的最佳平台


    1. [Upwork (https://www.upwork.com/)

    - 适合长期自由职业项目。

    - 客户寻找拥有强大作品集的开发者。

    2. [Fiverr (https://www.fiverr.com/)]

    - 非常适合短期项目、修复 Bug 和小型编码任务。

    - 你可以为客户提供自定义的服务包。

    3. [Toptal](https://www.toptal.com/)

    - 针对高技能开发者的高端自由职业平台。

    4. [Freelancer (https://www.freelancer.com/)]

    - 与 Upwork 类似但有竞赛机制。

    5. [RemoteOK (https://remoteok.io/)

    - 最适合远程全职和自由职业机会。


    自由职业技巧：从小型项目开始以建立信誉。保持专业并交付高质量的工作。


    ## 准备代码面试


    一旦你开始接到面试电话，下一步就是做好准备。科技面试通常包括技术问题、代码挑战和行为问题。


    ### 第一步：了解面试流程 大多数公司遵循以下流程：

    1. 电话筛选——招聘人员询问你的背景和经验。

    2. 技术评估——在 HackerRank、LeetCode 或 CodeSignal 等平台上解决代码挑战。

    3. 现场编码面试——在解决问题的同时实时解释你的思路。

    4. 系统设计面试（针对高级职位）——为现实问题设计软件解决方案。

    5. 终行为面试——关于团队合作、问题解决和工作经验的问题。


    ### 第二步：掌握数据结构和算法学习数组、字符串、链表、哈希表和树。

    - 理解排序算法（快速排序、合并排序）。

    - 练习动态规划和递归。

    - 使用 LeetCode、HackerRank 和 CodeWars 进行练习。


    ### 第三步：练习系统设计（针对高级职位）

    - 学习可扩展性、微服务和数据库。

    - 在 YouTube 上观看系统设计面试教程。


    ### 第四步：行为面试准备

    - 准备回答此类问题：“请讲述一次你解决复杂问题的经历。”

    - “描述你参与的一个项目以及面临的挑战。”

    - 使用 STAR 法（情境、任务、行动、结果）来回答。


    面试成功的终极技巧：每天练习编码以保持敏锐。

    - 模拟面试有助于缓解焦虑。

    - 保持自信并清晰沟通。


    ## 结语


    获得科技工作需要坚实的作品集、持续的职位申请和充分的面试准备。无论你想找全职职位还是自由职业，遵循这些步骤都将带你通向成功的道路。不断学习、改进并建立人脉，很快你就能获得梦寐以求的工作。


