    \ {\n    cout << \"Car destroyed!\" << endl;\n  }\n};\n\nint main() {\n    Car\
    \ myCar(\"Red\", \"Toyota\", 0); // The destructor is automatically called here\n\
    }\n```\n\nIn the above example, when the myCar object goes out of scope (at the\
    \ end of the main() function), the destructor ~Car() is called, and the message\
    \ \"Car destroyed!\" is printed.\n\n## Inheritance\n\nInheritance is one of the\
    \ key features of OOP that allows you to create a new class based on an existing\
