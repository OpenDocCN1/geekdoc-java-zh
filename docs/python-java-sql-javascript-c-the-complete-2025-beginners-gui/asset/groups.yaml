- md: "\n```javascript\nconsole.log(`My name is ${name} and I am ${age} years old.`);\
    \ This method eliminates the need for string concatenation (+), making code cleaner\
    \ and easier to read.\n```\n\n## Multiline Strings with Template Literals\n\n\
    let message = `This is a multiline string in JavaScript`; console.log(message);\
    \ Using backticks, JavaScript now supports multiline strings without needing \\\
    n or concatenation.\n\n## 2. Destructuring Assignment\n\nDestructuring allows\
    \ you to extract values from arrays or objects into separate variables with minimal\
    \ code.\n\n### Array Destructuring\n\n```javascript\nconst numbers = [1, 2, 3];\
    \ const [a, b, c] = numbers; console.log(a); // Output: 1\n```\n\n```javascript\n\
    console.log(b); // Output: 2\n\nconsole.log(c); // Output: 3\n```\n\n### Object\
    \ Destructuring\n\n```javascript\nconst person = { name: \"Alice\", age: 30 };\
    \ const { name, age } = person; console.log(name); // Output: Alice\nconsole.log(age);\
    \ // Output: 30\n```\n\nDestructuring **reduces redundancy** and makes variable\
    \ extraction **more readable.**\n\n## Modules and Async/Await\n\n- 1. JavaScript\
    \ Modules (import/export)\n\nBefore ES6, JavaScript used **global variables**\
    \ or libraries like RequireJS for modular programming. Now, **ES6 modules** allow\
    \ developers to break code into reusable files.\n\n### Exporting a Module (math.js)\n\
    \n```javascript\nexport const add = (a, b) => a + b; export const subtract = (a,\
    \ b) => a - b;\n```\n\n### Importing a Module (app.js)\n\n```javascript\nimport\
    \ { add, subtract } from './math.js'; console.log(add(5, 3)); // Output: 8\n\n\
    console.log(subtract(5, 3)); // Output: 2\n```\n\n**Modules organize code, improve\
    \ reusability, and enhance maintainability.**\n\n## 2. Async/Await - Handling\
    \ Asynchronous Code\n\nBefore **async/await**, JavaScript used **callbacks and\
    \ Promises**, which often led to **callback hell** (nested functions that are\
    \ hard to read).\n\n### Example of a Promise-Based Function\n\n```javascript\n\
    function fetchData() {\n  return new Promise((resolve) => {\n    setTimeout(()\
    \ => resolve(\"Data received\"), 2000); \n  });\n}\n```\n\nfetchData().then((data)\
    \ => console.log(data)); // Output after 2 sec: Data received With async/await\
    \ handling asynchronous code becomes simpler and more readable.**\n\n### Example\
    \ Using Async/Await\n\n```javascript\nasync function fetchData() {\n  let data\
    \ = await new Promise((resolve) => {\n    setTimeout(() => resolve(\"Data received\"\
    ), 2000); \n  });\n  console.log(data); \n}\n\nfetchData();\n```\n\n- The **await\
    \ keyword pauses** execution until the Promise resolves.\n- **async/await** makes\
    \ **asynchronous code look synchronous**, improving readability.\n\nModern JavaScript\
    \ (ES6 and beyond) has **transformed the language, making it more efficient, readable,\
    \ and powerful. Features like let/const, arrow functions, template literals, destructuring,\
    \ modules, and async/await** have simplified coding for developers. Mastering\
    \ these concepts will **enhance your JavaScript skills and make you a more competent\
    \ developer.**\n\nNow that you understand these modern JavaScript features, you’re\
    \ one step closer to writing cleaner, more efficient code. Keep practicing, and\
    \ soon, these will become second nature to you!\n\n## Chapter 19: JavaScript in\
    \ Action - Hands-On Projects\n\nIn this chapter, we will take everything you've\
    \ learned about JavaScript and put it into practice with real-world projects.\
    \ Theory is important, but applying what you've learned is the best way to solidify\
    \ your skills. We will build three hands-on projects that will give you confidence\
    \ and experience working with JavaScript in practical scenarios.\n\n- **Project\
    \ 1: Creating an Interactive To-Do List** – Learn how to manipulate the DOM and\
    \ store data.\n- **Project 2: Developing a Simple Weather App Using an API** –\
    \ Work with APIs to fetch and display data dynamically.\n- **Project 3: Introduction\
    \ to JavaScript Frameworks (React, Vue.js)** – Get a taste of modern JavaScript\
    \ frameworks used in professional development.\n\n## Creating an Interactive To-Do\
    \ List\n\nA **To-Do List** is one of the best beginner projects because it teaches\
    \ **event handling, DOM manipulation, and local storage**—all essential JavaScript\
    \ skills. By the end of this project, you will have a fully functional **task\
    \ management app** where users add, remove, and save tasks.\n\n### 1. Setting\
    \ Up the HTML\n\nWe start with a simple structure that includes:\n- **input field**\
    \ to type tasks\n- **A button** to add tasks\n- **A list** to display tasks\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    <title>To-Do List</title>\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n\
    <body>\n  <div class=\"container\">\n    <h2>To-Do List</h2>\n    <input type=\"\
    text\" id=\"taskInput\" placeholder=\"Add a new task\">\n    <button id=\"addTask\"\
    >Add Task</button>\n    <ul id=\"taskList\"></ul>\n  </div>\n  <script src=\"\
    script.js\"></script>\n</body>\n</html>\n```\n\n### 2. Styling with CSS\n\nTo\
    \ make it look neat, add a simple CSS file:\n\n```css\nbody {\n  font-family:\
    \ Arial, sans-serif;\n  text-align: center;\n}\n\n.container {\n  max-width: 400px;\n\
    \  margin: 0 auto;\n}\n\nul {\n  list-style-type: none;\n  padding: 0;\n}\n\n\
    li {\n  border-bottom: 1px solid #ddd;\n  display: flex;\n  justify-content: space-between;\n\
    \  padding: 10px;\n}\n\nbutton {\n  cursor: pointer;\n}\n```\n\n### 3. Writing\
    \ JavaScript for Functionality\n\nNow, let's write JavaScript to add interactivity:\n\
    \n```javascript\ndocument.getElementById(\"addTask\").addEventListener(\"click\"\
    , function() {\n  let taskInput = document.getElementById(\"taskInput\").value;\n\
    \  if (taskInput === \"\") return;\n\n  let taskList = document.getElementById(\"\
    taskList\");\n  let li = document.createElement(\"li\");\n  li.innerHTML = `${taskInput}\
    \ <button onclick=\"deleteTask(this)\">X</button>`;\n  taskList.appendChild(li);\n\
    \  taskInput.value = \"\";\n});\n\nfunction deleteTask(button) {\n  button.parentElement.remove();\n\
    }\n```\n\nThis script allows users to add tasks and delete them.\n\n## Developing\
    \ a Simple Weather App Using an API\n\nWe will use OpenWeather API to fetch real-time\
    \ data and display it.\n\n### 1. Setting Up the HTML\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n<title>Weather App</title>\n\
    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <div class=\"\
    container\">\n    <h2>Weather App</h2>\n    <input type=\"text\" id=\"cityInput\"\
    \ placeholder=\"Enter city\">\n    <button id=\"getWeather\">Get Weather</button>\n\
    \    <p id=\"weatherResult\"></p>\n  </div>\n  <script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\n\n### 2. Styling with CSS\n\n```css\nbody {\n  font-family:\
    \ Arial, sans-serif;\n  text-align: center;\n}\n\n.container {\n  max-width: 400px;\n\
    \  margin: 0 auto;\n}\n```\n\n### 3. Writing JavaScript for Fetching Data\n\n\
    ```javascript\ndocument.getElementById(\"getWeather\").addEventListener(\"click\"\
    , function() {\n  let city = document.getElementById(\"cityInput\").value;\n \
    \ let apiKey = `YOUR_API_KEY`;\n  let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;\n\
    \n  fetch(url)\n    .then(response => response.json())\n    .then(data => {\n\
    \      let temp = data.main.temp;\n      let description = data.description[0];\n\
    \      document.getElementById(\"weatherResult\").innerHTML = `Temp: ${temp}°C\
    \ Condition: ${description}`;\n    })\n    .catch(error => alert(\"City not found!\"\
    ));\n});\n```\n\nThis script fetches the weather for a given city and displays\
    \ the temperature and condition.\n\n## Introduction to JavaScript Frameworks (React,\
    \ Vue.js)\n\nAs JavaScript applications grow in complexity, frameworks like **React\
    \ and Vue.js** make development faster and more efficient.\n\n### 1. What is React?\n\
    \nReact is a **component-based UI framework** developed by Facebook. It simplifies\
    \ building **interactive web applications** by managing the UI efficiently.\n\n\
    Example: A Simple Counter in React\n```javascript\nimport React, { useState }\
    \ from 'react';\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\
    \  return (\n    <div>\n      <h2>Counter: {count}</h2>\n      <button onClick={()\
    \ => setCount(count + 1)}>Increase</button>\n      <button onClick={() => setCount(count\
    \ - 1)}>Decrease</button>\n    </div>\n  );\n}\n\nexport default Counter;\n```\n\
    This React component allows users to increment or decrement a counter.\n\n###\
    \ 2. What is Vue.js?\n\nVue.js is another popular JavaScript framework that is\
    \ lightweight and **easy to learn**. It allows for two-way data binding and is\
    \ great for small to medium-sized applications.\n\nExample: A Simple Vue App\n\
    ```html\n<div id=\"app\">\n  <h2>Counter: {{ count }}</h2>\n  <button @click=\"\
    count++\">Increase</button>\n  <button @click=\"count--\">Decrease</button>\n\
    </div>\n<script src=\"https://cdn.jsdelivr.net/npm/vue@2\"></script>\n<script>\n\
    new Vue({\n  el: \"#app\",\n  data: {\n    count: 0\n  }\n});\n</script>\n```\n\
    This Vue.js application works similarly to the React example but is even simpler\
    \ to implement.\n\n## Conclusion\n"
