    \n### 声明变量\n\nJavaScript 提供了三种声明变量的方式：\n- var（旧且过时，请避免使用）\n- let（推荐用于会改变的变量）\n\
    - const（用于不应该改变的值）\n\n示例：\n\n```javascript\nlet name = \"Alice\"; // 以后可以改变\n\
    const age = 30; // 这将始终保持 30\n\nvar city = \"New York\"; // 在现代 JavaScript 中避免使用\
    \ var\n```\n\n使用 let 和 const 代替 var，因为 var 存在作用域问题，可能会在较大的程序中导致 bug。\n\n### 2.\
