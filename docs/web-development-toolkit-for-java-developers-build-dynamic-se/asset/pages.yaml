    # Formatting tags


    The JSP Standard Tag Library (JSTL) adds essential features to JSP that enable
    JSP programming without the need for embedded Java code. It is a collection of
    standard JSP tags that perform several common tasks.


    This frees us from having to develop custom tags for these tasks, or from using
    a mix of tags from several organizations to do our work. The formatting JSTL provides
    support for internationalization, which is to enable the formatting of data (dates,
    numbers, time) in different locales.


    Before using the formatting JSTL, the following directive needs be added to the
    JSP page:


    ```

    <@ taglib prefix="fmt" uri="http://java.sun.com/jsp/jstl/fmt" %>

    ```


    # fmt:formatNumber ()


    The <fmt:formatNumber> tag is flexible and capable of formatting a numeric value
    in a locale-sensitive or custom format as a number, currency, or percent.


    The syntax is as follows:


    ```

    <fmt:formatNumber [value=numeric value]\n[type="currency|percent"]\n[pattern="pattern"]

    [currencyCode="currency code"]\n[currencySymbol="currency symbol"]\n[groupingUsed="true|false"]\n[maxIntegerDigits="max
    integer digits"]\n[minIntegerDigits="min integer digits"]\n[maxFractionDigits="max
    fractional digits"]\n[minFractionDigits="min fractional digits"]\n[var="variable
    name"]

    ```'
  merge: -1
