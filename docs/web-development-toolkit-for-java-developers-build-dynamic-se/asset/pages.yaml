    The difficulties include the following:


    +   - The design issues caused when using the <head> tag instead of <h:head>

    - The no-action of commands if not surrounded with the <h:form> tag

    - Missing exception handling for AJAX requests

    - Converters of list data types

    - The handling of view expired exceptions

    - Using the <html> tag to define composite components and include files, which
    could lead to an unconventional HTML DOM structure

    - The resources that complicated CSS files use as references

    - The difficulty of using Java classes to create composite components


    Many JSF developers are compelled to employ third-party solutions and workarounds
    to fix these problems. But using non-standard libraries and APIs results in significant
    maintainability problems.


    # Performance Tuning


    Although JSF has been designed on a high level of abstraction and a long list
    of fancy features, it includes many serious performance issues, such as the following:


    +   - When we add images, css, javascript, etc. they add overhead in JSF components
    tree. JSF has some configurations that can be used for performance tuning, including
    refresh-period and project-stage context parameters.

    - Due to the absence of transparent and standard caching functions for user-interface
    resources they are handled less frequently in the component JSF tree'
