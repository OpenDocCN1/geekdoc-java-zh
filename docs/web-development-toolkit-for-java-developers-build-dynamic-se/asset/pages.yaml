  md: '# Setting the random status codes: setStatus


    To set the status code of response explicitly, we can use the setStatus method.
    The method can take an integer number representing the status code as an argument,
    and a constant is defined in the HttpServletResponse to present each status code.
    For the sake of readability, it is always preferable to use the constants in the
    programmingprogramming. The name of each constant starts with SC, indicating the
    status code, followed by the underscore and the message; for example, 404 represents
    file not found, the equivalent constant in HttpServletResponse SC_NOT_FOUND.


    # Setting 302 and 404 status codes: sendRedirect and sendError


    In general, we can set the status code by calling the response.setStatus(int)
    method, but there are two other shortcut methods we can use to perform the common
    operations of sending an error and redirecting:


    ```

    public void sendRedirect(String url)

    ```


    The 302 status code gives the browser to connect to a new location. The sendRedirect
    method generates a 302 response along with a Location header giving the URL of
    the new resource to access. The URL can be either an absolute or relative URL.
    The system automatically translates the relative URL into the absolute URL by
    puttingURL in the location header.


    ```

    public void sendError(int code, String message)

    ```


    This method is used to set the status code and error message to the client, for
    example, the 404-status code is used when the required resource is not found on
    the server. the sendError method sends a status code with a brief message that
    is formed and sent to the client.


    To send the output, the server has to call the setStatus or sendError method first.


    # HTTP 1.1 status codes


    The status codes fall in five major categories:


    +   100–199: The code falling in this range provides information that the client
    should respond with some other action.


    +   200–299: The code falling in this range indicates that the request was successful.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '+   300–399: The code falling in this range is used to indicate that the required
    resource has been relocated, and it generally includes a location header indicating
    the new address of the resource.


    +   400–499: The code falling in this range indicates the client-side errors.


    +   500–599: The code falling in this range mention the server-side errors.


    The most common status code used are explained as follows:


    +   100 (Continue): This status code is used to indicate whether a client can
    continue to follow an up resource or not. If the server sends 100 as a status
    code, it means the client can send the request; otherwise, the server will use
    the 417-status code to tell the client that it will not accept the resource.


    +   200 (OK): This status code is used to indicate that everything is fine, and
    the document follows for the GET and POST request.


    +   202 (Accepted): This status header tells that the request is under process
    and is not completed yet.


    +   204 (No Content): This status code is used to suggest that the required resource
    is not updated, and the previous resource can be used as it. This is useful when
    the user reloads the page frequently and the server wants to notify that the page
    is already new and not be changed.


    +   205 (Reset Content): This status code is used to reset the form fields and
    clear the form. The document is not new, but the form fields are cleared.


    +   301 (Moved Permanently): This status code indicates that the requested resource
    has been permanently moved to a new location, and the new URL for the resource
    is given in the Location response header. The browsers should consider the new
    URL for the required resource.


    +   302 (Found): This status code is similar to 301, where the required resource
    is moved to the new location but only temporarily. The location header should
    be read for the temporary replacement, not a permanent one.


    +   303 (See Other): This status code indicates in when the original request for
    the resource was POST, the new document should be retrieved with GET.


    +   304 (Not Modified): This status code indicates that the file is not modified.


    +   307 (Temporary Redirect): This status code indicates temporary redirection
    of the required resource. It is similar to 302, but it is used to suggest the
    browser that follows redirected GET but not POST request.


    +   400 (Bad Request): This status code indicates wrong syntax in the client request.'
