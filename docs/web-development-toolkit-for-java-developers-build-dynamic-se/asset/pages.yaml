    # c:choose, c:when, and c:otherwise


    The <c:choose> tag works like a Java switch statement in that lets you choose
    a number of alternatives. While the switch statement has case statements, the
    <c:choose> tag has <c:when> tags. Just as the <c:choose> has <c:otherwise> as
    the default clause to specify a default action, the <c:choose> tag does not have
    any attribute. The <c:when> tag has one attribute, which is listed below. The
    <c:otherwise> tag does not have any attribute.


    The <c:when> tag has the following attributes:


    | Attribute | Description |

    |---|---|

    | test | Condition to evaluate |


    Table 10.5: Attributes of the <c:when> tag


