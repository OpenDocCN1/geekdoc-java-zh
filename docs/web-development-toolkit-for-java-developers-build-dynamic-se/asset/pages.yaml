  md: '# lib folder


    +   - The lib directory contains all JAR files used by your web application.

    - This directory most often contains third-party libraries that your application
    is using.

    - You can also place your own classes into a JAR file and place it here rather
    than putting those classes in the classes directory.


    # WAR file


    A WAR file is simply a packaged web directory or archive file like ZIP or RAR.
    It will store JSP, servlets, classes, meta data information, images, source, tag
    libraries. Its standard file extension is .war. WAR files are used to package
    web modules, and they are for web applications deployed to a server. For example,
    an application for stock trading might be distributed in an archive file called
    *Stocktrading.war* file.


    The WAR file is a standard format for web applications that has specific directories
    and specific files.


    This includes a WEB-INF directory, a WEB-INF/web.xml file used to describe the
    application, a WEB-INF/lib directory for JAR files used by the application, and
    a WEB-INF/classes directory for class files that are not distributed in a JAR.
    JSP, HTML pages, images, java classes, and many more components of the application
    can be packaged as a single file distributed.


    # Deployment descriptor


    The web.xml file is the deployment descriptor of the web application and contains
    mapping for servlets (prior to 3.0), welcome pages, security configurations, session
    timeout settings, and so on.


    # Model View Controller (MVC) Overview


    The Model-View-Controller (MVC) is an architectural pattern that separates an
    application into three main logical components:


    +   - A model represents the underlying logical structure of data in a software
    application and the high-level class associated with it. This object model does
    not contain any information about the user interface.

    - A view represents the user interface using which the users can view and submit
    data.'
