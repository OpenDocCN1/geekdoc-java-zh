  md: '# CHAPTER 10

    Overview of JSP

    Standard Tag Library

    (JSTL)


    # Introduction


    This chapter covers the tag library specially designed to work with HTML-like
    syntax to achieve various functionality related to programming, database, XML,
    etc. It covers the usage and syntax of tags with examples.


    # Structure


    The chapter includes the following topics:


    +   - Introduction to JSTL

    - Core tag library

    - SQL tags

    - XML tags

    - JSTL functions

    - Formatting tags'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Objectives


    After studying this chapter, you should be able to understand and use remadeym
    library for various purposes. The built in functions will help programmers code
    easily with HTML like tags work with complex functions.


    # Introduction to JSTL


    JSTL stands for JSP Standard Tag Library. JSTL is a collection of the standard
    JSP tags, which includes the core functionality to control the JSP page behavior.
    JSTL tags can be used for iteration and control statements, and for maintaining
    XML documents, internationalization tags, and SQL tags. It also provides a framework
    for integrating the custom tags with the JSTL tags. In the previous chapters,
    we saw the use of JSP tags and JSP EL to perform complex actions in a simple way
    using Java language in HTML. But when it comes to nested loops, they have lot
    of SQL statements we cannot skip writing core Java in HTML. That is where use
    of JSP is misused it has to include a lot of Java in HTML which is not a good
    programming practice. To avoid this problem, the JSTL library was introduced to
    perform complex tasks in a simple way using HTML-like tags that perform the core
    language functionality well.


    # Installing JSTL library


    JSTL is part of the Java EE API and is included in most servlet containers. But
    to use JSTL in our JSP pages, we need to download the JSTL jars for your servlet
    container. You need to include these libraries in your web application project
    WEB-INF/lib JSTL jars are container specific, for example, in Tomcat, we need
    to include jstl.jar and standard.jar JAR files in project build path. If there
    are not present in the container lib directory you should include them in your
    application. To begin working with JSTL tags you need to install the JSTL library.
    If you are using the Apache Tomcat container, follow these two steps:


    +   - Download the binary distribution from Apache Standard Taglib and unpack
    the compressed file. You can find the link from https://tomcat.apache.org/taglibs/index.html.

    - Use the Standard Taglib from the Jakarta Taglibs distribution, simply copy the
    JAR files in the lib directory to your application''s webapps/ROOT/WEB-INF/lib
    directory.

    - To use any of the libraries, you must include a <taglib> directive at the top
    of each JSP that uses the library.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Classification of the JSTL tags


    JSTL includes a wide variety of tags that fit into discrete functional areas.
    To reflect this and give each area its own namespace, JSTL is exposed as multiple
    tag libraries. The URIs for the libraries are as follows:


    +   - Core: http://java.sun.com/jsp/jstl

    - XML: http://java.sun.com/jsp/jstl/xml

    - Internationalization: http://java.sun.com/jsp/jstl/fmt

    - SQL: http://java.sun.com/jsp/jstl/sql

    - Functions: http://java.sun.com/jsp/jstl/functions


    The tags include the functionalities listed in Table 10.1:


    | Tag Group Name | Functionality Provided | Prefix |

    | --- | --- | --- |

    | Core | Variable support, Flow control, URL management | c |

    | XML | Core, Flow control, Transformation | x |

    | I18N | Locale, Message formatting, Number and date formatting | fmt |

    | Database | SQL connection and writing queries | sql |

    | Functions | Message formatting, number and date formatting, etc. | fn |


    Table 10.1: JSTL tag groups based on functionalities


    The JSTL represents a set of tags to simplify the JSP development, which includes
    the following advantages:


    +   - Fast development

    - Code reusability

    - No need to use scriptlet tag


    # Core tag library


    JSTL Core provides several core tags, such as Iteration, conditional logic, catch
    exception, URL forward, and Redirect, to support some basic scripting tasks. To
    use core tags, we need to define tag library first; the following is the syntax
    to include a tag library using the taglib directive:


    ```

    Syntax: <@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core%>

    ```'
