  md: '# Reading input in multiple character sets:

    setCharacterEncoding


    When the request parameters are read, they are interpreted using the server’s
    current character set. We can use the setCharacterEncoding method of ServletRequest.


    We may have a situation where the request parameters are required to be read in
    more than one character set. In this case, we cannot use setCharacterEncoding
    with the name of one character set, so we have two options to continue with: one
    is to read the parameter in one character set and convert it to that another,
    and the second is to use an autodetect option with some character sets.


    For the first approach, we can read the parameter using getBytes to read the raw
    bytes and then pass the bytes to the String constructor. The following code shows
    the steps to carry out this approach. In this example, we read and convert the
    parameter to Japanese language:


    ```

    String firstNameEncoding = request.getParameter("firstName");

    String firstName = new String(firstNameEncoding.getBytes(), "Shift_JIS");

    ```


    The second approach allows you to autodetect the character set. For example, to
    allow input in either English or Japanese, you might use the following:


    ```

    request.setCharacterEncoding("JISAAutoDetect");

    ```


    ```

    String firstName = request.getParameter("firstName");

    ```


    # Reading form data


    Using the preceding methods, we will demonstrate examples to understand the usage
    of these methods.'
