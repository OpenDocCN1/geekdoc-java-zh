  md: '# Preface


    Web development is one of the most demanding skills required in the field of computer
    application. Java supports the development of web application using simple model
    view controller as well as with support of advance frameworks based on java language.


    This book takes a practical approach for web application development using java,
    it covers the tokens of concepts required to develop a web application. It covers
    the practical aspects of programming using simple examples.


    This book is divided into 14 chapters. Database connectivity from java, JSP and
    servlets, JSF, web services, Spring boot and aspect-oriented concepts.


    Chapter 1: Database Connectivity From Java- The chapter covers the use of JDBC
    API, explain the major components of JDBC API, list and explain the types of driver
    to communicate with the database.


    Chapter 2: Performing Insert, Update, Delete and Select Operations- The chapter
    covers the steps used to access a database from a java application. JDBC API components
    with its methods are described briefly to understand the purpose and syntax before
    using them to build a program. The basic database operations like insert records,
    update records, selecting records, traversing on ResultSet, deleting records,
    etc. are covered with suitable examples.


    Chapter 3: Creating Properties File and Performing Batch Operations- The chapter
    covers the steps to create a properties file and access it in a java code. The
    use of properties file can be for different purposes we use it to hold the database
    specific key and value pairs. The other part of chapter covers the concept of
    batch processing with the transactions and shows the concept of how to manually
    rollback and commit using the SavePoint. It also shows that instead of executing
    a program for one query, one can add the queries to batch and execute the batch
    single time, so it save time and effort, for example if you want to enter five
    records then have five insert queries added to a single batch and execute this
    batch once.


    Chapter 4: Web Components and Web Application Directory Structure- This chapter
    covers the fundamentals knowledge required to understand client server communication,
    it includes the understanding of web client, server and protocols'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'used in the communication. The chapter covers a brief overview of TCP/IP and
    HTTP protocols with their role in web client server communication. The role of
    container is explained in brief and the details of how a web directory structure
    is organized with the goal of making a web archive file. In the end of the chapter
    MVC design pattern is briefly described.


    # Chapter 5: Servlet Programming.** This chapter covers servlet introduction,
    role and tasks of servlet, working of servlet, servlet life cycle, generate plain
    text and html responses. Understand the generation of implicit and explicit data
    by understanding request and response headers, and its methods


    # Chapter 6: Managing Advanced Features in Servlet- This chapter covers advance
    features that can be managed using servlets, the major features include managing
    cookies and sessions.


    # Chapter 9: Understand Model, View and Controller Pattern- In this chapter we
    cover the concept of model, view and controller in the development of the application.
    The MVC pattern suggest the separation of code based on the different role and
    purpose, so the error solving and managing of code become easier as the application
    size and complexity increases. Servlet is good at processing, JSP is good at presentation,
    and bean class and database can be used to represent the entity class. Technologies
    can be optimized in using it for right purpose, so Servlet is used as a Controller,
    JSP is used as a View layer, and Java Beans are used as Model layer.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Chapter 10: Overview of JSP Standard Tag Library (JSTL)- In this chapter we
    cover the concept of using an external library that support various functions
    required during programming. The use of these functions shows how easy it is with
    lesser programing we can continue to work without compromising functionalities.


    Chapter 11: Outline of JSF for Building Component-Based, Event-Oriented Web Interfaces-
    In this chapter we cover the concept of using JSF, we compare its benefit over
    JSP, and explore the syntax and application of it.


    Chapter 12: Working with Web Services (SOAP and RESTful)- In this chapter we cover
    the concept of web services both SOAP based and RESTful services.


    Chapter 13: Aspect-Oriented Approach with Spring Framework- In this chapter we
    cover the aspect-oriented approach and explore the Spring Framework.


    Chapter 14: Introduction to Spring Boot- In this chapter we cover the syntax and
    application of Spring Boot.'
