  md: "# HTTP headers\n\nIn the client-server communication process, various request\
    \ and response headers are used. The basic steps in communication are listed as\
    \ follows:\n\n+   - Type the Uniform Resource Identifier (URI) in the address\
    \ bar of the browser to identify a given resource. Then, the connection is established.\n\
    - Send the HTTP messages; these messages include the:\n  - Requests from client\
    \ to server\n  - Responses from server to client\n\nHTTP-message = <Request> |\
    \ <Response> ; HTTP/1.1 messages\n\nHTTP requests and HTTP responses use a generic\
    \ message format of RFC 822 for transferring the required data. This generic message\
    \ format consists of the following items:\n\n+   - Message Start-Line\n- Header\
    \ Fields\n- Message Body\n\n# Message start-line\n\nA start-line will have the\
    \ following generic syntax:\n\n+   - start-line = Request-Line | Status-Line\n\
    \nThe examples of start-line in case of request and response:\n\n+   - GET /hello.htm\
    \ HTTP/1.1: This is the Request-Line sent by the client.\n- HTTP/1.1 200: This\
    \ is the Status-Line sent by the server.\n\n# Header fields\n\nThere are four\
    \ types of HTTP message headers:\n\n+   - General-header: These fields have general\
    \ applicability for both request and response messages, for example, Date.\n-\
    \ Request-header: These header fields have applicability only for request messages,\
    \ for example, User-Agent.\n- Response-header: These header fields have applicability\
    \ only for response messages, for example, Accept-Ranges."
