  md: '# Commit and rollback


    Once you are done with your changes and want to commit the changes, call the commit()
    method on the Connection object, as follows:

    conn.commit();


    Otherwise, to roll back updates to the database made using the Connection named,
    use the following code:

    conn.rollback();


    The below table lists various methods used to perform transaction management:


    | Method | Description |

    |---|---||

    | void status() | setAutoCommit(boolean) It is true by default, which means each
    transaction is committed by default. |

    | void commit() | Commits the transaction. |

    | void rollback() | Cancels the transaction. |


    > Table 3.3: Methods to manage transactions in your own way


    This table covers the methods to manage transactions. The setAutoCommit method
    can be used to set the committed mode to true or false; and to save or cancel
    the transaction, the commit and rollback methods can be used.


    # Savepoints


    When you set a savepoint, you define a logical rollback point within a transaction.
    If an error occurs you save a savepoint, you can use the rollback method to undo
    either the changes or only the changes made after the savepoint.


    The Connection object has two new methods that help you manage savepoints:


    +   - setSavepoint(String savepointName): It defines a new savepoint and also
    returns a Savepoint object.

    - releasesSavepoint(SavepointsavepointName): It deletes a savepoint.


    # Batch processing in JDBC


    Instead of executing a single query, we can execute a batch (group) of queries
    for faster performance. The java.sql.Statement and java.sql.PreparedStatement
    interfaces provide methods for batch processing.'
