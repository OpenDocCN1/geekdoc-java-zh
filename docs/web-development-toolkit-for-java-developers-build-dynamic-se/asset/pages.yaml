  md: 'e. Resultant Servlet for DisplayDetails.jsp


    In the DisplayDetails.jsp, we write the code to instantiate the bean object, read
    the request parameters and set the bean properties using the JSP scriptlet; after
    the properties are set, we write the code to access the properties using the getter
    methods in the JSP expression. In this example, we are creating, assigning and
    retrieving beans core Java syntax.


    # JSP syntax for creating and accessing beans


    JSP provides three main components to create bean, and to assign and retrieve
    values of a bean. They are listed as follows:


    jsp:useBean


    +   - This element is used to build a new bean.


    +   - It is normally used as follows:

    Syntax: <jsp:useBean bean="beanName" class="package.Class" />


    jsp:getProperty


    +   - This element is used to read and output the value of a bean property.


    +   - Reading a property is a shorthand notation for calling a method of the getXxx
    form. This element is used as follows:

    Syntax: <jsp:getProperty name="beanName" property="propertyName" />


    jsp:setProperty


    +   - This element is used to assign a value to the bean property, and it is equivalent
    to calling a setter method of the setXxx form.


    +   - This element is used as follows:

    Syntax: <jsp:setProperty name="beanName" property="propertyName" value="propertyValue"
    />


    # Creating beans


    The jsp:useBean action lets load a bean to be used in the JSP. Beans provide a
    very useful capability because they exploit the reusability of Java classes without
    sacrificing the convenience that JSP adds over servlets.


    The jsp:useBean action tag is used to locate or instantiate a bean class. If the
    bean object of the Bean class is already created, it doesn''t create the bean
    depending on the scope. But if object of bean is not created, instantiates the
    bean. The simplest syntax for specifying that a bean should be used is the following:

    <jsp:useBean id="name" class="package.Class" />


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_224_0.png)'
