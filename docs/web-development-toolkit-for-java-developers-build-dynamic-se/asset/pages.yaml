    Fortunately, JSP has a nice solution to this problem. It lets you associate a
    property with a request parameter and automatically perform type conversion from
    strings to numbers, characters, and boolean values. Instead of using the value
    attribute, use name to parse an input parameter.


    The value of the requested parameter is automatically used as the value of the
    bean property, and type conversions from String to primitive types (byte, int,
    double, etc.) and wrapper classes (Byte, Integer, Double, etc.) are automatically
    performed. For example, setting the semester property can be simplified to the
    following:


    ```

    <jsp:setProperty name="s1" property="semester" param="studentsemester" />

    ```


    You can simplify the code略 if the request parameter and the property name are
    the same. In that case, you can omit param as in the following example:


    ```

    <jsppropertyname="s1" property="semester" />

    <-- param="semester" is assumed. -->

    ```


