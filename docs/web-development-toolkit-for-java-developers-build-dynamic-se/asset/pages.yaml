    # The include directive


    This constructs insert JSP code into the main page before main page is translated
    into a servlet. Its main advantage is that it is powerful: the included code can
    contain JSP constructs like field definitions and content-type settings that affect
    the main page as a whole. Its main disadvantage is that it is hard to maintain;
    you have to update the main page whenever any of the included pages changes. We
    can include files at page translation time with the include directive. Reserve
    the **include directive (<@ include %>)** for cases in which the included file
    defines fields or methods that the main'
