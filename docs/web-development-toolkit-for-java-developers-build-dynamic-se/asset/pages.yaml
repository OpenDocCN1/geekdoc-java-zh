  md: '```

    [result=""]

    [xml=""]

    [doc=""]

    [xmlSystemId=""]

    [docSystemId=""]

    [xslt=""]

    [xsltSystemId=""]]

    JSP body content

    </x:transform>

    ```


    # Attributes:


    +   - var: Name of the exported scoped variable for the transformed XML document;
    the type of the scoped variable is org.w3c.dom.Document

    - scope: Scope of the variable specified in the var attribute; it can be page,
    request, session, or application

    - result: Result Object that captures or processes the transformation result

    - xml: Deprecated; use the doc attribute instead

    - doc: Source XML document to be transformed (If exported by <x:set>, it must
    correspond to a well-formed XML document, not a partial document.)

    - xmlSystemId: Deprecated; use the docSystemId attribute instead

    - docSystemId: The system identifier (URI) for parsing the XML document

    - xslt: java.xml.transform.Source Transformation stylesheets as a String, Reader,
    or Source object

    - xsltSystemId: The system identifier (URI) for parsing the XSLT stylesheet


    # Example:


    ```

    <x:transform xml="${books}" xslt="${xslt}">

    10.4.8:param tag

    ```


    The <x:param> tag is used along with the transform to add a parameter to the transformer.
    The syntax is as follows:


    ```

    <x:param name="parameter name">

    [value="parameter value"]

    JSP body content

    </x:param>

    ```'
