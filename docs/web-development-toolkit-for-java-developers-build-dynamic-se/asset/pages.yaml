  md: '# Web Development Toolkit for Java Developers


    In this example, we showed how ternary operators can be used to execute based
    on some condition. We combined styling with cascading style sheets applied internally
    using a class selector, for pass, fail and all grades, and then we read the marks
    and apply the style for font color and boldness; if marks are not 35, we apply
    the fail class; otherwise, we apply the pass class. Likewise, for each grade,
    we apply different color set in each class; if grade is AA, we apply the gradeaa
    class; for grade BB, we apply the gradebb class; for grade CC, we apply the gradecc
    class; for grade DD, we apply the graded class; and for grade FF, we apply the
    gradeff class, conditionally using the nested ternary operator.


    # Using Functions


    JSP EL allows to use functions in expressions as well. These functions are defined
    in the custom tag libraries. A function usage has the following syntax:


    ```

    $$(ns:func(param1, param2, ...))

    ```


    Where ns is the namespace of the function, func is the name of the function and
    param1 is the first parameter value. For example, the fn:length function, which
    is part of the JSTL library, can be used as follows to get the length of a string:


    ```

    ${fn:length("Get my length")}

    ```


    To use a function any tag library (standard or custom), you must install that
    library on your server and must include the library in JSP using the <taglib>
    directive as explained in the JSTL


    # Conclusion


    In this chapter, we covered the concept of bean class; how to create and use it
    in a simple Java application and in a web application; how to use jsp:useBean,
    jsp:getProperty and jsp:setProperty. We covered the sharing of beans in different
    locations request, session and application. In the second half of this chapter,
    we studied the usage of expression language, which is a short and easy way to
    invoke Java code without writing core Java syntax in HTML.


    The next chapter covers the concept of MVC pattern and how it can be implemented
    using JSP, servlets and beans.


    # Points to remember


    +   - Beans provide a very useful capability because they let you exploit the
    reusability of Java classes without sacrificing the convenience that JSP adds
    over servlets alone.'
