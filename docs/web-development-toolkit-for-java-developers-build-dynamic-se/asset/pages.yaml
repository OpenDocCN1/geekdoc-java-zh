    # Undertow server


    Another embedded server provided by spring boot is undertow server, which is managed
    by JBoss. It has Http and web socket support and provides servlets 4.x support.
    Before adding Undertow server in the application, remove any other added server
    to avoid conflict between the servers:


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-web</artifactId>

    <exclusions>

    <exclusion>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    </dependency>

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-undertow</artifactId>

    </dependency>

    ```


    We can customize the behavior of the Undertow server by setting different properties
    in the properties file.


