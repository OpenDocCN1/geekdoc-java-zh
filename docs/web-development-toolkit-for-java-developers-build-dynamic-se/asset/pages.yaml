    # JSP scriptlets


    If you want to do something more complex than giving the value of a simple expression,
    JSP scriptlets let you insert arbitrary code into the servlet''s _jspService method
    (which is called by service). Scriptlets have the following form:


    ```

    <% Java Code %>

    ```


    Scriptlets have access to the session automatically defined variables as expressions
    (request, response, session, out, etc.). So, for example, if you want to explicitly
    send output to the resultant page, you could use the out variable, as in the following
    example:


    ```

    <% String queryData = request.getQueryString();

    out.println("Attached GET data: " + queryData); %>

    ```


    In this particular instance, you could have accomplished the same effect more
    easily by using a combination of a scriptlet and a JSP expression, as follows:


    ```

    <% String queryData = request.getQueryString(); %> Attached GET data:

    <%= queryData %>

    ```


    Alternatively, you could have used a single JSP expression, as follows:


    ```

    Attached GET data: <%= request.getQueryString() %>

    ```


    In general, however, scriptlets can perform several tasks that cannot be accomplished
    with expressions alone. These tasks include setting response headers and status
    codes, invoking side effects like writing to the server log or updating a database,
    or executing code that contains loops, conditionals, or other complex constructs:


    ```

    <% response.setContentType("application/msword"); %>

    ```'
