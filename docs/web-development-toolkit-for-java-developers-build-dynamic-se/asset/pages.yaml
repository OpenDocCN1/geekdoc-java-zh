  md: '+   Communications support: The container provides an easier way for servlets
    to communicate with the web server. A ServerSocket is not required to build and
    listen on a particular port. The API used to handle the communication makes it
    easy to work between the server and the application code. We need to provide the
    business logic as per the requirements.


    +   Lifecycle management: The container manages the servlet upon its creation
    and manages all its phases until it is alive. It takes care of loading the classes,
    instantiating the servlets, invoking the servlet methods, and making servlet instances
    eligible for garbage collection.


    +   Multithreading support: A new thread is created by the container for handling
    every servlet request it receives. When the servlet is done processing the request,
    the thread terminates.


    +   Declarative security: A container provides a deployment descriptor file to
    configure the major settings related to application.


    +   JSP support: JSP are nothing but Java inside HTML. A container translates
    JSP into Java automatically.


    # Role of container in handling the request


    When a request is made from a client to the web server, it passes the request
    to a web container. Then, it''s the web container''s job to find the correct resource
    to handle the request (servlet or JSP) and then use the response from the servlet
    or JSP to generate the response and provide it to web server. Then, the web server
    sends the response to the client. When the web container gets the request, if
    it''s for the servlet, the container creates two objects: HttpServletRequest and
    HttpServletResponse. Then, it finds the correct servlet based on the URL and creates
    a thread for the request. Next, it invokes the service() method and based on the
    HTTP request service() method invokes doGet() or doPost() methods. Servlet methods
    generate the dynamic page and write it to response. Once the servlet thread completes,
    the container converts the response to HTTP'
