  md: 'The syntax is as follows:

    <x:if select="XPath expression">

    [var="variable name"]

    [scope="page|request|session|application"]

    JSP body content

    </x:if>


    # Attribute:


    +   - **select:** If the condition is true, it processes its body; else, the body
    is ignored.

    - **var:** It is the variable that holds the result (true or false) of the test
    condition evaluation. This variable can be used for future test conditions (depending
    on the scope of the variable), avoiding reevaluation of the test condition.

    - **scope:** This is the scope of the variable specified in the var attribute.
    This can be page, request, session, or application.


    Example:


    <x:if select=''Solan''>

    Book is written by Solan.

    </x:if>


    <x:if select=''Willcox''>nBook is written by Willcox.

    </x:if>


    # x:forEach tag


    The <x:forEach> tag is used for iterating over collections based on XPath expressions.


    The syntax is as follows:

    <x:forEach select="XPath expression">

    [begin="begin index"]

    [end="end index"]

    [step="step size"]

    [var="variable name"]

    [varStatus="status variable name"]

    JSP body content

    </x:forEach>'
  merge: -1
