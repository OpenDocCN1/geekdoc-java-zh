  pgno: 224
- img_proc: true
  md: "This statement usually means “instantiate an object of the class specified\
    \ by class and bind it to a variable in jspService with the name specified by\
    \ id. For example, the following JSP action:\n\n```\n<useBean id=\"s1\" Class=\"\
    studentinformation.StudentBean\" />\n```\n\nIt can be thought of as equivalent\
    \ to the following scriptlet:\n<% studentinformation.StudentBean s1 = new studentinformation.StudentBean();\
    \ %>\n\nHere are the attributes of jsp:useBean tag:\n\n+   **id**: It is used\
    \ to identify the bean in the specified scope.\n- **scope**: It represents the\
    \ scope of the bean. It may be a page, request, session, or application. The default\
    \ scope is page.\n  - **page**: It specifies that you can use this bean within\
    \ the JSP page. The default scope is page.\n  - **request**: It specifies that\
    \ you can use this bean from any JSP page that processes the same request. It\
    \ has a wider scope than page.\n  - **session**: It specifies that you can use\
    \ this bean from any JSP page in the same session, regardless of whether or not\
    \ it processes the same request. It has wider scope than request.\n  - **application**:\
    \ It specifies that you can use this bean from any JSP page in the application.\
    \ It has wider scope than session.\n- **class**: It instantiates the specified\
    \ bean class (that is, creates an object of the bean class) but must have no-arg\
    \ or no constructor and must be abstract.\n- **type**: It provides the bean data\
    \ type if the bean already exists in the scope. It is mainly used with class or\
    \ beanName attribute. If you use it without class or beanName, no bean is instantiated.\n\
    - **beanName**: It instantiates the bean using the java.beans.Beans.instantiate()\
    \ method.\n\n# # Retrieving values from beans\n\nOnce you have a bean, you can\
    \ output its properties with jsp:getProperty, which takes a name attribute that\
    \ should match the id given in jsp:useBean and a property attribute that names\
    \ the property of interest."
