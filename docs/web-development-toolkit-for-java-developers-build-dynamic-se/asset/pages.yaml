    # JDBC transactions


    In JDBC, the Connection interface provides methods to manage a transaction. If
    your JDBC Connection is in auto-commit mode, which is by default, then every SQL
    statement is committed to the database upon its completion. That may be fine for
    simple applications, but there are three reasons why you may want to turn off
    the auto-commit and manage your own transactions:


    +   * To increase performance

    * To maintain the integrity of business processes

    * To use distributed transactions


    To enable manual transaction support instead of the auto-commit mode that the
    JDBC driver uses by default, use the Connection object''s setAutoCommit() method.


    ```

    con.setAutoCommit(false);

    ```'
