  md: '# sql:update tag


    The **<sql:update>** executes an SQL update statement specified either via an
    attribute or embedded in the body of the tag. An update tag can have nested param
    tags to **pass** parameters to the SQL statement.


    The syntax is as follows:


    ```

    <sql:update [var=variable name]

    [scope="page|request|session|application"]

    [sql="SQL update statement"]

    [dataSource="DataSource">

    JSP body

    </sql:update>

    ```


    Attribute(s):


    +   - **var**: The variable that contains the result of the SQL update statement

    - **scope**: Scope of the variable specified in the var attribute; it can be page,
    request, session, or application

    - **sql**: The SQL update statement to execute

    - **dataSource**: The DataSource for the database to be accessed


    Example:


    ```

    <sql:update>

    UPDATE orders SET deliver_date = ?

    WHERE order_id = ?

    <sql:param value="${param.deliver_date}\ />

    <sql:param value="${param.order_id}\ />

    </sql:update>

    ```


    # sql:param tag


    The **<sql:param>** is a body tag to a query or update tag. It is used to pass
    parameters to an SQL statement.'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'The syntax is as follows:


    ```

    <sql:param [value="parameter value"]

    JSP body

    </sql:param>

    ```


    # Attribute:


    +   - **value**: No (the parameter value for the SQL statement)


    Example:


    ```

    <sql:query sql="select * from bookstore where price > ?">

    <sql:param value="${lowPrice}"/>

    </sql:query>

    ```


    # sql:dateParam tag


    The <sql:dateParam> is a body tag to query or update tag. It is used to pass java.util.Date
    parameters to an SQL statement.


    The syntax is as follows:


    ```

    <sql:dateParam value="date type value"

    [type=date|time|timestamp] />

    ```


    # Attribute:


    +   - **value**: The parameter value for the SQL statement; it can be a date,
    time, or timestamp

    - **type**: The type of parameter; it can be date, time, or timestamp


    Example:


    ```

    <sql:query sql="select * from employee where join_date > ?">

    <sql:dateParam value="${cutoff_date}" type="date"

    </sql:query>

    ```


    # sql:transaction tag


    The <sql:transaction> tag will have nested SQL tags and cause them to be executed
    as a transaction. The syntax is as follows:


    ```

    <sql:transaction dataSource="DataSource">

    [isolation="read_committed|read_uncommitted|repeatable

    read|serializable"] >

    JSP body

    </sql:transaction>

    ```'
