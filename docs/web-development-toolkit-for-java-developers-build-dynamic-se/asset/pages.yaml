  md: '# Basics of Java Server Pages (JSP)


    Use of the contentTypeattribute takes one of the following two forms:


    ```

    <@ page contentType="MIME-Type" %>

    <@ page contentType="MIME-Type"; charset=Character-Set %>

    ```


    For example, the directive:


    ```

    <@ page contentType="application/vnd.ms-excel" %> has the same basic

    effect as the scriptlet

    <% response.setContentType("application/vnd.ms-excel"); %>

    ```


    The first difference between the two forms is response.setContentType uses

    explicit code (an approach some developers try to avoid), whereas the page

    directive uses only JSP syntax.


    The second difference is that directives are parsed specially; they don''t directly

    become _jspService_ code at the location they appear. This means response.

    setContentType can be invoked conditionally, whereas the page directive cannot

    be.


    Unlike servlets, for which the default MIME type is text/plain, the default

    for JSP pages is text/html (with a default character set of ISO-8859-1).


    If you want to change both the content and the character set, you can do the

    following:


    ```

    <@ page contentType="someMimeType"; charset=someCharacterSet" %>

    ```


    However, if you only want to change the character set, it is simpler to use the

    pageEncoding attribute. For example, Japanese JSP pages might use the following:


    ```

    <@ page pageEncoding="Shift_JIS" %>

    ```


