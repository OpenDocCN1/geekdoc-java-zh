- img_proc: true
  md: 'forward should be called before the response has been committed to the client
    (before response body output has been flushed). If the response has already been
    committed, this method throws an IllegalStateException. Uncommitted output in
    the response buffer is automatically cleared before the forward.


    The request and response parameters must be either the same objects as were passed
    to the calling servlet''s service method or subclasses of the HttpServletRequestWrapper
    or ServletResponseWrapperclasses that wrap them.


    Parameters:


    +   - request: A ServletRequest object that represents the request the client
    makes of the servlet


    +   - response: A ServletResponse object that represents the response the servlet
    returns to the client


    Throws:


    +   - ServletException: If the target resource throws this exception


    +   - java.io.IOException: If the target resource throws this exception


    +   - java.lang.IllegalStateException: If the response was already committed


    +   - Include method: It includes the content of a resource (servlet, JSP page,
    HTML file) in the response.


    Syntax:


    ```

    public void include(ServletRequest request, ServletResponse response) throws ServletException,
    java.io.IOException

    ```


    It includes the content of a resource (servlet, JSP page, HTML file) in the response.
    In essence, this method enables programmatic server-side includes.


    The ServletResponse object has its path elements and parameters remain unchanged
    from the caller’s. The included servlet cannot change the response status code
    or set headers; any attempt to make a change is ignored.


    The request and response parameters must be either the same objects as were passed
    to the calling servlet''s service method or subclasses of the HttpServletRequestWrapper
    or ServletResponseWrapperclasses that wrap them.'
