  md: '# Objectives


    After studying this chapter, you should be able to understand the concepts of
    model, view and controller, along with their implementation using JSP, servlets
    and JavaBeans. You will also understand the purpose and application of sharing
    the beans in various scope.


    # Understanding the use of technology


    Technology helps us develop applications to fulfill user requirements, and selecting
    the right approach to develop the application will help the team to maintain the
    software easily. One such approach in developing applications very effectively
    is known as the design pattern.


    # Design pattern


    A design pattern is a general reusable solution to a commonly occurring problem
    within a given context in software design. A design pattern isn''t a finished
    design that can be transformed directly into code. It is a description or template
    for how to solve a problem that can be used in several situations. Design patterns
    were started as best practices that were applied again and again to solve similar
    problems encountered in different contexts. They become popular after they were
    collected in a formalized form in the Gang of Four book in 1994. Originally published
    with C++ and Smalltalk code samples, design patterns are very popular in Java
    and C# can be applied in all object-oriented languages. In functional languages
    like Scala, certain patterns are not necessary anymore.


    # Uses of design patterns


    Understanding and applying design patterns has various benefits; the following
    points mention the usage of design patterns:


    +   Design patterns help in organizing the code in a structured way, which helps
    improve the development process in terms of speed of development and locating
    issues generated during the implementation. The pattern provides code readability
    and maintenance in a well-organized way.


    +   Design patterns provide the solution not for a specific problem in a particular
    domain; they provide a general solution in a well-defined, documented structured
    way to a broader range of problems.


    +   Different design patterns are developed for different purposes, so programmers
    can identify the right design pattern for solving their problems. Common design
    patterns are improved over a period, making them more useful and stronger.'
  merge: -1
