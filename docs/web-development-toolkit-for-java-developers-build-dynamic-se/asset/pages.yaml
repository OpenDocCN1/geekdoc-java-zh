  md: 'In this example, we created a small MVC application for bank customer balance
    inquiry. The requirement is to create a form to enter the customer id; if the
    user is bank customer, based on the balance, the page is viewed in the browser.
    If the customer''s balance is negative, then the view for Negative balance is
    selected; if the customer balance is positive and more than 10,000 INR, the view
    for Regular customer is selected; if the balance is 10,000 or more, the view for
    prestigious/elite customer is selected. In this example, we have created the following
    classes and JSP pages:


    +   - **Index html**: HTML page to input the customer ID

    - **BankCustomer class**: Bean class to manage the customer details; it acts as
    a model layer

    - **ShowBalance class**: Servlet to listen and process the request, set and share
    bean, and navigate to correct view layer

    - **UnknownCustomer.jsp, NegativeBalance.jsp, RegularCustomer.jsp, EliteCustomer.jsp**:
    JSP pages to render in the browser as a view layer to display the information
    to the user


    The application flow is as shown in the below :


    | Client enters | Index.html | Customer''s details stored as HashMap Objects |

    | :--- | :--- | :--- |

    | customer id | | |

    | it reads the customer id | Servlet | Customer Bean |

    | | | Servlets gets the customer details from bean, shares it, selects the right
    view and navigate |


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_305_0.png)


    **Example 2**: In this example, we include database part to store the customer
    details in the table instead of `HashMap`. We insert the customer details and
    search the customers. We create a bean class **Customer** to get and set the values
    of customer, and a servlet'
