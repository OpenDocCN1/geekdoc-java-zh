    CONTENT="5; URL=http://host/path/">


    This is put in the HEAD section of the HTML page rather than as an explicit header
    from the server. This usage came because automatic reloading or forwarding is
    something often desired by authors of static HTML pages. For servlets, however,
    setting the header directly is clearer and easier.


    # Retry-after


    This header can be used in conjunction with a 503 (Service Unavailable) response
    to tell the client how soon it can repeat its request.


    # Set-Cookie


    The Set-Cookie header specifies a cookie associated with the page. Each cookie
    requires a separate Set-Cookie header.


    # WWW-Authenticate


    This header includes a 401 (Unauthorized) status code. It tells the browser what
    authorization type (BASIC or DIGEST) and realm the client should supply in its
    Authorization header.


    # Conclusion


    The chapter covered the concept of servlet and its vital role in handling the
    web application. It also covered the request and response headers of HTTP, and
    how the HTML form data can be accessed in native Java environment.


    The next chapter covers advanced features like session management, handling cookies,
    etc. from servlets.


    # Points to remember


    +   - A servlet life cycle can be defined as the process from its creation till
    its destruction.

    - The servlet is initialized by calling the init () method.

    - The servlet calls the service() method to process a client''s request.

    - The servlet is terminated by calling the destroy() method.

    - The request headers provide the methods to read the headers for processing them.'
