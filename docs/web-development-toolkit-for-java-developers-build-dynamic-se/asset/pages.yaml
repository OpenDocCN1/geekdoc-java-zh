- img_proc: true
  md: "# Attribute:\n\n+   * **select**: This is the XPath expression to be evaluated.\n\
    * **begin**: This is the start index for the iteration.\n* **end**: This is the\
    \ end index for the iteration.\n* **step**: This is the size of the index increment\
    \ iterating over the collection. The iteration will process every step item of\
    \ the collection, starting from the begin index (or first item if begin is not\
    \ specified). For example, if step is 5, the index is incremented by 5 every iteration.\n\
    * **var**: This is the name of the variable in which the current iteration is\
    \ stored.\n* **varStatus**: This is the name of the variable in which the status\
    \ of the iteration is stored:\n    * **current =>**: Retrieves the current item\
    \ in the iteration\n    * **index =>**: Retrieves the index of the current round\
    \ of the iteration\n    * **count =>**: Retrieves the **count** of the current\
    \ round of the iteration\n    * **first =>**: Returns true for the first item\
    \ in the iteration\n    * **last =>**: Returns true for the last item in the iteration\n\
    \    * **begin =>**: Returns the value of the **begin** attribute for the associated\
    \ tag, or null if no **begin** attribute was specified\n    * **end =>**: Returns\
    \ the value of the **end** attribute for the associated tag, or null if no **end**\
    \ attribute was specified\n    * **step =>**: Returns the value of the **step**\
    \ attribute for the associated tag, or null if no **step** attribute was specified\n\
    \nExample:\n\n```\n<ul>\n<x:forEach select=\"${list}\" var=\"item\">\n  <li><x:out\
    \ value=\"${item}\"/>/></li>\n</x:forEach>\n</ul>\n```\n\n# x:choose, x:when,\
    \ x:otherwise tags\n\nThe **x:choose>** action enables you to provide handling\
    \ for a set of mutually exclusive conditions instead of just one."
  merge: -1
  pgno: 355
- img_proc: true
  md: "# Overview of JSP Standard Tag Library (JSTL) 329\n\nThe syntax is as follows:\n\
    \n```\n<x:choose>\n<x:when select=\"XPath expression\">\n  JSP body\n</x:when>\n\
    ...\n<x:otherwise>\n  JSP body\n</x:otherwise>\n</x:choose>\n```\n\nUnlimited\
    \ <x:when> actions may exist within a <x:choose> action to provide handling for\
    \ a wide range of conditions. The <x:otherwise> action may appear only once it\
    \ covers all remaining alternatives and must therefore, appear after <x:when>\
    \ actions.\n\nAttribute:\n\n+   - select: If the test is true, it processes the\
    \ tags body.\n\nExample:\n\n```\n<x:choose>\n<x:when select=\"author = 'Solan\"\
    >\n  Book is written by Solan.\n</x:when>\n<x:when select=\"author = 'Willcox\"\
    >\n  Book is written by Willcox.\n</x:when>\n<x:otherwise>\n  The book writer\
    \ is unknown.\n</x:otherwise>\n</x:choose>\n```\n\n# x:transform tag\n\nThe <x:transform>\
    \ tag conducts a transformation given a source XML document and an XSLT stylesheet.\n\
    \nThe syntax is as follows:\n\n```\n<x:transform [var=variable name]\n[scope=\"\
    page|request|session|application\"]\n```"
