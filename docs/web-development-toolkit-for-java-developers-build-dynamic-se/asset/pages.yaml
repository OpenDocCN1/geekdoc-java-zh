    # Database connectivity


    Spring data provides support for relational database and NoSQL database. While
    creating a new application, the main concern should be the business logic, not
    the routine and repetitive tasks. The Java Persistent API, known as JPA, and the
    Spring Data JPA are commonly used to simplify the database operations.


    Spring Data JPA is a layer built on the top of JPA, so it uses all the features
    defined in the JPA, like managing entities, association mappings, and writing
    queries. Apart from using JPA features, it provides new features like implementing
    repository pattern with no or far less code, forming database queries using method
    name, and so


    # Spring data repository


    Spring JPA provides Crud, Paging and sorting, and JPA repository:


    +   - CrRepository: This repository offers elementary operations to create, read,
    update, and delete records. The most common methods it includes findOne(), findAll(),
    save(), and delete().

    - PagingAndSortingRepository: It extends CrRepository and provides the findAll
    methods to retrieve or sort data in a paginated order.

    - JpaRepository: It extends CrRepository and PagingAndSortingRepository. It offers
    new methods like flush() to clear the context:


    ```

    <dependency>

    <groupId>org.springframework.data</groupId>

    <artifactId>spring-data-jpa</artifactId>

    <version>2.2.3.RELEASE</version>

    </dependency>

    ```'
