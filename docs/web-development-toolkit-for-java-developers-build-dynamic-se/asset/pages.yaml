  md: '# The JSP page interface


    According to JSP specification, all the generated servlet classes must implement
    the JspPage interface. It extends the Servlet interface. It provides two life
    cycle methods:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_161_0.png)


    Figure 7.2: JspPage Interface


    Methods of JSP page interface:


    +   - **public void jspInit()**: is invoked only once during the life cycle of
    the JSP when JSP page is requested firstly. It is used to perform initialization
    and is the same as the `init()` method of Servlet interface.

    - **public void jspDestroy()**: is invoked only once during the life cycle of
    the JSP before the JSP page is destroyed. It can be used to perform cleanup operation.


    # The HttpJspPage interface


    The HttpJspPage interface provides the one life cycle method of JSP. It extends
    the JspPage interface.


    Method of **HttpJspPage** interface is **public void _jspService()**, which is
    invoked each time a request for the JSP page comes to the container. It is used
    to process the request. The underscore `_` signifies that you cannot override
    this method.


    # Overview of JSP


    JSP pages are translated into servlets. So, fundamentally, any task JSP pages
    perform could be accomplished by servlets. However, this underlying equivalence
    does not mean that servlets and JSP pages are equally appropriate in all'
