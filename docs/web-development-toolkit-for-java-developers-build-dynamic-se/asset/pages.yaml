    the following are a few maintenance problems with the include directive:


    +   - With the include directive <%@include ... %>, if the included file changes,
    the JSP files that it use may need to be updated.

    - Servers are required to detect when JSP page changes and translate it into a
    new servlet before handling the next request.


    # The file attributes


    The file attribute used to indicate the file content is to be taken and added
    in the main file; the syntax is as follows:


    ```

    <@include file="file name" %>

    ```


    The file content is added during page translation.


    # XML syntax for the include directive


    The XML-compatible equivalent of the following:


    ```

    <@ include file="..." %>

    jsp:directive.include file="..." />

    ```


