  md: '# Objectives


    After reading this chapter, you should be able to use events in JSF, grasp MVC,
    and construct dynamic web apps using JSF.


    # Introduction to JSF


    Compared to the technologies available at the time like PHP, ASP, Perl, and early,
    CGI scripts; Java Servlets were a fairly clean approach. Although it gained a
    lot of popularity, it began to lose its usefulness as most online applications
    needed to generate quite bit HTML code inside Java.


    Due to this, a new industry standard known as JavaServer Pages (JSP) was developed
    in 1999. JSP changed the era of dynamic markup generation Java classes to writing
    Java code using scriptlets HTML pages.


    JSP and Servlets coexisted and were widely used at all application levels. Most
    applications were created so that JSP handled dynamic view management while Servlets
    handled business logic. The model view and controller helped the business logic
    and the presentation code be separated in the different parts of code.


    The technical needs for these applications, were numerous and time-consuming for
    the application developers to manually address. These requirements included separation
    of concerns for data, business logic, presentation of data, navigating among pages,
    defining overall connection and flow, using various user interface components
    to increase usability and make validations easier and more manageable. As a result,
    numerous frameworks and APIs have been developed by vendors, communities, and
    third-party organizations to address these problems. The most common among them
    are the Struts framework, the facility of layout management using Tiles, creating
    highly scalable web applications using Tapestry, and the Spring MVC framework.


    Sun chose to start from scratch with a new technology in 2004, which became known
    as JSF 1.0. Later versions, JSF 1.1 and 1.2, were released in 2006 and included
    all the functionalities that had become standard for the majority of web applications.


    In JSF 1.2, there were performance issues and security vulnerabilities, and IDE
    integration was not supported, so it was not so common and easily accepted.


    JSF 2.0 was released to fix the performance issues and flow with new capabilities
    and improvements, such as the choice of Facelets as the default template engine
    and JSP and support for GET requests, AJAX, and many more. Later, JSF 2.1 was
    made available. The version that is accessible right now is 2.2, which was released
    in 2013. Many JSF versions were created since its inception, and JFS is now often
    used for dynamic web applications.'
  merge: -1
