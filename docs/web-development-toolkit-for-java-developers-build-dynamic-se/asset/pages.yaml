  md: "# Handling Beans and Using Expression Language\n\n+   i. Page 2 accessed for\
    \ first time and refreshed, so the count of all the pages has increased:\n\n![](img/a0bb0a9553a3974c2aa1136b93fa2374_246_0.png)\n\
    \nFigure 8.44: Page 2 accessed for the first time and refreshed, so the count\
    \ of all the pages has increased\n\nIn this example, the page accessed for the\
    \ first time is set to the property of pagename, and the first page that executes\
    \ creates the object then the other pages use this object. when the different\
    \ pages are accessed, the counter increments, but the first page page name remains\
    \ the same as it is set only once and shared in the application scope.\n\n# Unshared\
    \ bean in Page scope\n\nPage scope means the JSP object can be accessed only from\
    \ within the page where it was created. The default scope for JSP objects created\
    \ using the <jsp:useBean> tag is page. JSP implicit objects out, exception, response,\
    \ pageContext, config and page have page scope.\n\n**Example 1:** In this example,\
    \ we create a bean class MusicBean with properties musicgenre and artistname.\
    \ We create a JSP to instantiate and access it in a page scope. The value of bean\
    \ is preserved only for the current request; it is not preserved between multiple\
    \ requests.\n\n+   a. Index of page application, index.html\n\n```\n01. <html>\n\
    02. <head>\n03. <title>TODO add a title</title>\n04. <meta name=\"UTF-8\" content=\"\
    width=device-width, initial-scale=1.0\">\n05. </head>\n06. <body>\n07. <h2>\n\
    08. Page scope sharing. <br/></h2>\n09. \n10. <form action=\"pagescoparing.jsp\"\
    >\n11. Music Genre <input type=\"text\" name=\"musicgenre\"/><br>\n12. Artist\
    \ <input type=\"text\" name=\"artistname\"/><br>\n13. <input type=\"submit\" Value=\"\
    Submit\"/><br>\n14. </form>\n15. \n16. </body>\n17. </html>\n```\n\n![](img/a0bb0a9553a3974c2aa1136b93fa2374_246_1.png)"
