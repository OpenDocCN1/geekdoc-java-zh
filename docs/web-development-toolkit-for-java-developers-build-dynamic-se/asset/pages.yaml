  md: "```\n[scope=\"page|request|session|application\"]\nJSP body\n<fmt:formatNumber>\n\
    ```\n\n# Attributes:\n\n+   - value: The numeric value to be formatted\n- type:\
    \ Specifies whether the numeric value is to be formatted as a number, currency,\
    \ or a percent\n- pattern: Patterns as specified by the java.text.DecimalFormat\
    \ class\n- currencyCode: Currency codes as defined by the ISO 4217 standard; this\
    \ is applicable only when the type attribute is currency\n- currencySymbol: This\
    \ is applicable only when the type attribute is currency; it is used to override\
    \ the defaults\n- groupingUsed: Specifies whether the output format contains any\
    \ grouping separators; will be commas, periods or spaces depending on the local\
    \ language\n- maxIntegerDigits: Maximum number of digits in the integer portion\
    \ of the formatted output\n- minIntegerDigits: Minimum number of digits in the\
    \ integer portion of the formatted output\n- maxFractionDigits: Maximum number\
    \ of digits in the fractional portion of the formatted output\n- minFractionDigits:\
    \ Minimum number of digits in the fractional portion of the formatted output\n\
    - var: Variable that contains the formatted numeric value as a string\n- scope:\
    \ Scope of the var variable; an optional attribute that can be page, request,\
    \ session, or application\n\nVarious symbols can be used to form the custom pattern,\
    \ as listed here:\n\n+   - Ø: Digit\n- #: Digit, zero indicates absent\n- .: Decimal\
    \ separator or monetary decimal separator\n -: Minus sign\n- ,: Grouping separator"
