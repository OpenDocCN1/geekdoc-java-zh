    # Introduction to RequestDispatcher interface


    We are using the method of RequestDispatcher interface in servlet to apply the
    concept of navigation; in this section, we will discuss the syntax and usage of
    methods provided by this interface.


    In the java.servlet package, there is an interface named RequestDispatcher; it
    defines an object that receives requests from the client and sends them to any
    resource (as a servlet, HTML file, or JSP file) on the server. The servlet container
    creates the RequestDispatcher object, which is used as a wrapper around a server
    resource located at a particular path or given by a particular name. This interface
    is intended to wrap servlets, but a servlet container can create RequestDispatcher
    objects to wrap any type of resource.


    The interface consists of two methods:


    +   Forward method: It forwards a request from a servlet to another resource (servlet,
    JSP file, or HTML file) on the server.


    Syntax:


    ```

    public void forward(ServletRequest request, HttpServletResponse response) throws
    SQLException, java.io.IOException

    ```


    It forwards a request from a servlet to another resource (servlet, JSP file, or
    HTML file) on the server. This method allows one servlet to do preliminary processing
    of a request and another resource to generate the response.


    For a RequestDispatcher obtained via getDispatcher(), the ServletRequest object
    has its path elements and parameters adjusted to match the path of the target
    resource.'
