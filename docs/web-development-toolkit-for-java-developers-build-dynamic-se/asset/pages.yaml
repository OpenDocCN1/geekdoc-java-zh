    # c:url and c:param tags


    The <c:url> tag formats a URL into a string and stores it into a variable. This
    is mainly used when we need to open a JSP page based on the user input or based
    on the value of a variable. It converts a relative url into an application context''s
    url. This tag automatically performs URL rewriting when necessary. The var attribute
    specifies the variable that will contain the formatted URL. The JSTL url tag is
    just an alternative method of writing the call to the response.encodeURL() method.
    The only real advantage that the url tag provides proper URL encoding, including
    any parameters specified by children param tag.


    The <c:url> tag has the following attributes:


    | Attribute | Description |

    |---|---|

    | Value Base URL context / followed by the name of a local web application |

    | var Name of the variable to expose the processed URL |

    | scope Scope of the variable to expose the processed URL |


    Table 10.9: Attributes of the <c:url> tag'
