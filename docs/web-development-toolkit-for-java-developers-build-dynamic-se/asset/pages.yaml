  md: "# Overview of JSP Standard Tag Library (JSTL)\n\nAttribute:\n\n+   - var: The\
    \ variable that contains the result of the SQL query statement\n- scope: Scope\
    \ of the variable specified in the var attribute; it can be page, request, session,\
    \ or application\n- sql: The SQL query statement to execute\n- startRow: The starting\
    \ row for the returned result\n- maxRows: The maximum number of rows to return;\
    \ the default is no maximum limit\n- dataSource: A DataSource that was configured\
    \ using the </sql:setDataSource> action\n\nExample:\n\n```\n<sql:query var=\"\
    sqlresult\" sql=\"select * from bookstore where price < ?\">\n    dataSource=\"\
    jdbc:mysql://localhost:3306/customerdb,com.mysql.jdbc.Driver,root\">\n    <sql:param\
    \ value=\"${price}\" />\n</sql:query>\n```\n\nThe result of the query (here, sqlresult)\
    \ is of the javax.servlet.jsp.jstl.sql.Result type. From this, you can retrieve\
    \ data with core JSTL.\n\nInformation to retrieve:\n\n+   - rows: Returns the\
    \ result of the query as an array of SortedMap objects\n- rowsByIndex: Returns\
    \ the result of the query as an array of arrays\n- columnNames: Returns the names\
    \ of the columns in the result as a String array\n- rowCount: Returns the number\
    \ of rows in the cached ResultSet\n- limitedByMaxRows: Returns true if the query\
    \ was limited by a maximum row setting\n\nAn example of how to use this:\n\n```\n\
    <c:forEach var=\"row\" items=\"${sqlresult.rows}\">\n    <td><c:out value=\"${row.fieldName}\"\
    /></td>\n    <td><c:out value=\"${row.fieldName2}\"/></td>\n```"
