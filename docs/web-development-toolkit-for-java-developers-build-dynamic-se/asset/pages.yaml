  md: '# Objectives


    You should be able to distinguish between SOAP-based and RESTful services, apply
    logic to decide when to use SOAP-based or RESTful services, and comprehend the
    Java API to carry out the implementation of web services after reading this chapter.
    You should also be able to understand the service-oriented architecture; the role
    and applications of web services; and how to create, consume, and deploy the web
    services.


    # Service-oriented architecture


    A service-oriented architecture (SOA) is a design pattern whose purpose is to
    create distributed systems that offer services to other applications. It is a
    concept and is not limited to any programming language or platform.


    A service is a standalone module, a function that represents a unit of functionality.
    A service can exchange information from another service. It is independent in
    behavior and uses a loosely coupled, message-based communication model to communicate
    with applications and other services.


    # Service connections


    The following figure shows the communication between the consumer and the service
    provider. The consumer sends a request, processes it and sends the service response.
    The service connection is established between the consumer and the provider.


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_407_0.png)


    # Service-oriented terminologies


    The following terms are the major concepts used in service-oriented architecture:


    +   - Services: They are small modules created to provide some functionality.

    - Service provider: It provides a mechanism to use the service.

    - Service consumer: It is a client that requests to use the service; it can be
    an application or another service.'
