    # # HTML and HTTP


    Web server and web client are separate software, so there should be some common
    language for communication. HTML is the common language between the server and
    the client, and it stands for HyperText Markup Language.


    The web server and the client needs a common communication protocol; HTTP is the
    communication protocol between the server and the client, and it runs on top of
    the TCP/IP communication protocol.


    # # Understanding the HTTP


    HTTP is the foundation for data communication for the **World Wide Web** (that
    is, internet) since 1990. There are three basic features that make HTTP a simple
    but powerful protocol:


    +   * **HTTP is connectionless:** The HTTP client, i.e., a browser, initiates
    an HTTP request, and then the client disconnects from the server and waits for
    a response. The server processes the request and re-establishes the connection
    with the client to send a response.


    +   * **HTTP is media independent:** It means any type of data can be sent by
    HTTP as long as the client and the server know how to handle the data content.
    Both the client and the server need to specify the content type using'
