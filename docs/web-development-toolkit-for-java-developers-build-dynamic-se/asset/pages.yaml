  md: 'And possibly a few server-specific entries:


    +   Never write JSP code that relies on any server-specific classes being imported
    automatically; doing so makes your code nonportable.


    +   Use of the import attribute takes one of the following two forms:

    <@ page import="package.class" %>n<@ page import="package.class1,...,package.classN"
    %>


    +   For example, the following directive signifies that all classes in java.utilpage
    should be used without explicit package identifiers.

    <@ page import="java.util.*" %>


    +   The import attribute is the only page attribute that is allowed to appear
    multiple times within the same document.


    +   Although page directives can appear anywhere within the document, it is traditional
    to place import statements near the top of the document or just before the first
    place that the referenced package is used.


