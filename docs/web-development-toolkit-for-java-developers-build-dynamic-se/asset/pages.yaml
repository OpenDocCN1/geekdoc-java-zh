  md: '# Customer details are displayed using the preceding page:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_314_0.png)


    Figure 2.29: Bank application with database execution flow


    In this example, we integrate the database concept discussed in Chapter 2, Performing
    Insert, Update, Delete and Select Operations and Chapter 3,Creating Properties
    File and Performing Batch Operations . Instead of using a HashMap of customers
    to hold the Customer details, we create a Table in Oracle and create a SqlConnection
    class to handle the driver, establish the connection and queries to handle the
    database. We create a search form to input the customer ID; then, customer ID
    is read by the servlet and passed to the database method to search and return
    the customer details; if customer is not found in the database, the unknown customer
    page is displayed in the browser, and if the customer is found from the database,
    based on the balance of customer, the regular customer or elite customer is displayed
    in the browser. The insert page is used to input the customer data and pass to
    servlet, whose role is to call the database query to insert the data. In the servlet’s
    method, the method to connect the database is called in the init method, as the
    connection is to be established only once, and the query to process the request
    is written in the processrequest method, which is called in doGET and doPost methods.'
