  md: '```

    long currentTime = System.currentTimeMillis();

    long tenMinutes = 10*60*1000; // In milliseconds

    response.setDateHeader("Expires", currentTime + tenMinutes);

    ```


    Also, see the max-age value of the Cache-Control.


    # Last-modified


    This very useful header indicates when the document was last changed. The client
    can then cache the document and supply a date by an If-Modified-Since request
    header in later requests.


    # Location


    This header, which should be included with all responses that have a status code
    in the 300s, notifies the browser of the document address. The browser automatically
    reconnects to this location and retrieves the new document. This header is usually
    indirectly, along with a 302-status code, by the sendRedirect method of HttpServletResponse.


    # Pragma


    Supplying this header with a value of no-cache instructs HTTP 1.0 clients to cache
    the document. However, support for this header was inconsistent with HTTP 1.0,
    so expires with a date in the past is used instead. In HTTP 1.1, Cache-Control:
    no-cache is a more reliable replacement.


    # Refresh


    This header indicates how soon (in seconds) the browser should ask for an updated
    page. For example, to tell the browser to ask for a new copy in 30 seconds, you
    would specify a value of 30 with the following:


    ```

    response.setHeader("Refresh", 30);

    ```


    Instead of having the browser reload the current page, you can specify the page
    to load by adding a semicolon and a URL after the refresh time. For example, to
    tell the browser to go to http://host/path after 5 seconds, you would write the
    following:


    ```

    response.setHeader("Refresh", "5; URL=http://host/path/");

    ```


    This setting is useful for "splash screens" on which an introductory image or
    message is displayed briefly before the real page is loaded.'
