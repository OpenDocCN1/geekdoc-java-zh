  md: "# Conclusion\n\nIn this chapter, we covered the concept of model, view and\
    \ controller in the development of the application. The MVC pattern suggests the\
    \ separation of code based on the different role and purpose, so the error solving\
    \ and managing of code become easier as the application size and complexity increase.\
    \ Servlet is good at processing, JSP is good at presentation, bean class and database\
    \ can be used to represent the entity class. Technologies can be optimized in\
    \ using it for right purpose, so Servlet as a Controller, JSP is used as a View\
    \ layer and, Java Beans are used as Model layer.\n\nThe next chapter covers the\
    \ use of JSP Standard Tag library for performing various operations using functions\
    \ provided by this library.\n\n# Points to remember\n\nIn the MVC pattern implemented\
    \ using servlets and JSP, the role of model is performed by bean class, the role\
    \ of controller is performed by servlet and the role of presentation layer is\
    \ performed by JSP page.\n\nWe are using the method of RequestDispatcher interface\
    \ in servlet to apply the concept of navigation.\n\n# Multiple choice questions\n\
    \n+   1. Servlets are not good in which of these?\n   a. Data processing\n   b.\
    \ Communicating with databases\n   c. Invoking business logic\n   d. Presentation\
    \ by building HTML to represent the results of requests\n\n+   2. The key motivation\
    \ behind the MVC approach is the desire to separate the code that creates and\
    \ manipulates the data from the code that presents the data.\n   a. True\n   b.\
    \ False\n   c. Not sure"
  merge: -1
