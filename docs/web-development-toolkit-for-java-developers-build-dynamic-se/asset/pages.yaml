    origin\", origin);\n    RequestDispatcher dispatcher = request.getRequestDispatcher(\"\
    collections.jsp\");\n    dispatcher.forward(request, response);\n  }\n```\n```\n\
    \nFigure 8.73: Servlet for creating and sharing the objects known as \"scoped\
