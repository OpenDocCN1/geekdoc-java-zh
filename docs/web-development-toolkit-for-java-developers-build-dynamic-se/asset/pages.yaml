  md: '# Outline of JSF for Building Component-Based, Event-Oriented Web Interfaces


    User interface design and web programming are done using JavaServer Faces

    )User interface design and web programming are done using JavaServer Faces (JSF).
    It is used to create dynamic content for web pages and to perform user validation
    and dynamic page refreshing. Although JSF offers built-in support for these activities,
    making the development process quicker and simpler, all these functionalities
    can be offered with other technologies like servlets.


    Since Java EE 5, JSP has been a part of specification. JSF features a defined
    life cycle for processing requests, an expandable architecture for user interfaces,
    and a robust event handling system. With the help of these characteristics, Java
    EE-based apps use the Rapid Application Development (RAD) principles that are
    typical of traditional UI development.


    The Model, View, and Controller (MVC) paradigm is effectively implemented by JSF
    technology. For instance, pure servlet and JSP technologies combine the programming
    (Model and Controller) logic with the HTML presentation (View) logic. This calls
    for the designer of the application''s HTML Layout to also be a programmer, or
    vice versa. The designer of a JSF application uses XML-like elements, the majority
    of which are analogous to HTML tags and some of their characteristics. The Java
    programmer creates JavaBeans, which represent the Model and Controller logic.
    Only a limited selection of bean properties (variables in the source code), which
    the designer binds to the designed pages, are provided by the programmer.


    JSF is used to create component-based and event-driven web pages to access server-side
    data and logic. JSF is an XML document that holds the page in hierarchically ordered
    tags, and JSF is an HTML page with server-side capabilities. The Java objects
    that support JSF components have full Java capabilities, including access to remote
    APIs and databases, and are independent of the HTML.


    JSF''s primary goal is to integrate various technologies like HTML, CSS, JavaScript,
    etc., which are the most common client-side aspects, so that programmers may create
    web interfaces with little to no interaction with these platforms.


    # Web interfaces in JSF


    The main concept of JSF is to turn functionality into reusable parts, so JSF components
    are used for this purpose.


    JSF pages can be used within JSF; Facelets are made specifically for JSF interface
    definition, and they are XHTML pages. Using Facelets, you may build a component
    tree that serves as the framework for a JSF user interface by using XML elements.n
    JSF user interface by using XML elements.


    The key components of a straightforward JSF page created with Facelets are shown
    in listing 1. In this example, we''re using a bean that has been put in scope
    via CDI to access Java''s server-side functionality.'
