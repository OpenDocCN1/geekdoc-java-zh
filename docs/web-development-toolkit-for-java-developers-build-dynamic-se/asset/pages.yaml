    # # Conclusion


    The chapter introduced the fundamentals of web services and discussed comprehending
    various service kinds, producing web services, utilizing web services, and evaluating
    the interoperability offered by web services.


    The use and applications of the spring framework will be covered in the next chapter.


    # # Points to remember


    +   - Web services are self-sufficient; no additional software is needed.

    - A programming language with XML /HTML support is needed on the client side for
    client support. A web server and a SOAP server are required on the server side.

    - Client and server are just aware of messages since they are loosely connected;
    a low level of coordination enables more flexible reconfiguration.

    - Web services are distributed, located, and called using well-established, minimal
    internet standards.

    - Different environments and languages may be used to implement the client and
    server.

    - Workflow approaches can be used to combine web services and carry out higher-level
    business operations.

    - Web service binding and discovery can be automated with UDDI and WSDL.'
