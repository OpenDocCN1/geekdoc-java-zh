  md: '# Attributes


    +   * value: The date/time to be formatted

    * type: Specifies whether the data to be formatted contains a date, time, or

    * dateStyle: Formatting style used for dates; valid style values are defined by
    the java.text.DateFormat class (that is, default, short, medium, long, and full);
    valid only if the type attribute is date or both

    * timeStyle: Formatting style used for time values; valid style values are defined
    by the java.text.DateFormat class (that is, default, short, medium, long, and
    full); valid only if the type attribute is time or both

    * pattern: Custom formatting pattern for dates and times; patterns are specified
    by the java.text.SimpleDateFormat class

    * timeZone: Time zone to be used for the time information

    * var: Variable containing the parsed date/time value; variable is of type java.util.Date

    * scope: Scope of the var variable; an optional attribute that can be page, request,
    session, or application


    Various symbols are used to form a pattern for date / time component


    # G: Era designer


    y: Year


    Y: Week year, A week can be different from the calendar year depending on which
    day the first of January falls.


    M: Month in year


    w: Week in year


    W: Week in month


    D: Day in year


    d: Day in month


    F: Day of week in month


    E: Day name in month


    u: Day number of week (1 = Monday, ..., 7 = Sunday)


    a: Am/pm marker'
