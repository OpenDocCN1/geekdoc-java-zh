  md: '# 28 Web Development Toolkit for Java Developers


    When driver class is not found, the ClassNotFoundException is thrown; after the
    driver file is added, any problem in connecting to database or any communication
    with database is handled by SQLException. Note that it is good practice to write
    the code in try catch block as the code throws an exception. Also, we can include
    a finally block to place the cleanup code. Use intermediate System.out.println
    statements to debug when you find an exception. After successful execution of
    the program, remove the unnecessary unnecessary.


    The mentioned program, when executed successfully, will create a table named contact_info
    in Oracle. Once the program is executed and the table is created, you cannot execute
    it again, as it will try to create a table again. It have already created one,
    and objects with the same name cannot be created, so an SQLException will be thrown.
    Programmers, it is our responsibility to check the name of the table before we
    create it. So, we can alter the generic code and add to check whether the table
    exists. If it exists, we want to delete it and then create our new table. We can
    use the getTables method of DatabaseMetaData to know whether the table exists.
    The following code snippet shows how to create a table in Oracle after checking
    the table:


    ```

    01. DatabaseMetadata dbm = conn.getMetaData();

    02. ResultSet rs = dbm.getTables(null, null, "CONTACT_INFO", null);\n03.

    04. if (rs.next()) {

    05.

    06. System.out.println("Table exists");

    07. stmt.execute("DROP TABLE CONTACT_INFO");

    08.

    09. System.out.println("Table does not exist");

    10. System.out.println("Table \n" + create_query);

    11.

    12. Boolean flag = stmt.execute(create_query);

    13. System.out.println("Table created successfully"); }

    ```


    Figure 2.18: Check the existence of table using DatabaseMetaData


    If the table exists, the ResultSet object retrieves the value and the table is
    dropped and then created; otherwise, the table is created properly.


