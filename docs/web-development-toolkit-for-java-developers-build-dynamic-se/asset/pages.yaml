    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_460_0.png)


    Figure 13.5: Scope of bean


    We can set the scope of bean as prototype using the following syntax:

    <bean id="accountService" class="com.package.DefaultAccountService"

    scope="prototype"/>

    <bean id="accountService" class="com.package.DefaultAccountService"

    singleton="false"/>


    After the use of beans, they should be removed from the scope and all the resources

    should be released; this is the programmer’s responsibility.


    # The request scope


    In request scope, a bean for each HTTP request is created; we set it as shown
    here:

    <bean id="loginAction" class="com.mybean.LoginAction" scope="request"/>'
