  md: '# CHAPTER 1

    Database Connectivity

    From Java


    # Introduction


    Handling data is very important for any programming language or application. Therefore,
    understanding how to access the database from the language is very significant.
    There are different approaches to access the database from a Java application.
    This chapter covers the major components and their structures, so one can understand
    and use them for accessing database from the application. Based on the requirements
    of accessing the database, one can select a different driver to handle the database.
    The chapter shows the merits and demerits of using different types of drivers
    so that one can select the right driver while programming the application for
    database usage.


    # Structure


    In this chapter, we will cover the following topics:


    +   - Introduction to JDBC API

    - Core components of JDBC API

    - JDBC drivers

    - Types of JDBC drivers

    - Summary'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Objectives


    The chapter covers the concept of drivers, types of drivers and core components
    of JDBC. The understanding of these components will help one select the right
    type of driver for establishing the database connectivity based on one’s requirement.


    # Introduction to JDBC


    Java application programming interface is a list of all classes that are part
    of the Java Development Kit (JDK). These preprint classes provide a tremendous
    amount of functionality to a programmer. To connect any database and access data
    from Java environment, the support of Java Database Connectivity (JDBC) API is
    provided to the programmers. Using the JDBC API, you can access virtually any
    data source, from relational databases to different files. The JDBC API comprises
    two packages:


    +   - java.sql

    - javax.sql


    You automatically get both packages when you download the Java Standard Edition
    (Java SE) 8. To use the JDBC API with a particular database management system,
    you need a JDBC technology-based driver to mediate between JDBC technology and
    the database.


    Java JDBC is a Java library to connect and execute query with the database.


    JDBC API uses JDBC drivers to connect with the database; refer to Figure 1.1:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_29_0.png)


    The JDBC library includes APIs for performing the basic operations like the following:


    +   - Query the database: Read the data from the database.

    - Query the database and result set meta data: The database metadata contains
    information about the database itself, for instance, information about the tables
    defined the columns in each table, the data types, etc.

    - Update the database: Write data to the database, which includes adding new records
    or modifying the existing records.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '* **Perform transactions:** A transaction groups multiple updates and possible
    queries, into a single action. Either all the actions are executed or none of
    them are.


    # # Core components of JDBC API


    The JDBC API provides the interfaces and classes that allow you to perform the
    operations required to connect and communicate with a database from a Java application.
    The components include the following:


    +   * **DriverManager:** This class manages a list of database drivers.


    +   * **Driver:** This interface handles communications with the database server.
    A JDBC driver is a collection of Java classes that enables you to connect to a
    certain database. A JDBC driver implements many of the JDBC interfaces, hide the
    complexity of connecting to a database.


    +   * **Connection:** After the JDBC driver is loaded and initialized, we need
    to connect to the database; this interface has all methods for contacting a database.
    All communication with the database is done with a proper connection. An application
    can have more than one connection open to a database at time.


    +   * **Statement:** Objects created from this interface are used to submit the
    SQL statements to the database. A Statement is what you use to execute queries
    and updates against the database. There are a few types of statements that we
    use as per our requirements, but each statement corresponds to a single query
    or update at a time.


    +   * **ResultSet:** These objects hold data retrieved from a database after executing
    an SQL query using Statement objects. The result obtained after executing a query
    is held and allowed for navigation using the ResultSet.


    +   * **SQLException:** This class handles any errors that occur in a database
    application. The following are the core components of JDBC API.


    The below figure shows the major components used in establishing the database
    connection.


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_30_0.png)


    Figure 1.2: Core components of JDBC API'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'The Java application communicates with the core components to load the Driver,
    and then it establishes a connection, creates a statement, executes it, retrieves
    the ResultSet, traverses and processes the result. If anything goes wrong during
    the database communication after loading the driver, SQLException are thrown based
    on the type of error.


    # JDBC drivers


    JDBC drivers implement the defined interfaces in the JDBC API for interacting
    with your database server. JDBC driver implementations vary because of the wide
    variety of operating systems and hardware platforms on which Java operates. Sun
    has divided the JDBC implementations into four categories:


    +   - Type 1: JDBC-ODBC (Open Database Connectivity) Bridge

    - Type 2: Native-API driver

    - Type 3: Network-Protocol driver (Middleware driver)

    - Type 4: Database-Protocol driver (Pure Java driver)


    # Types of JDBC drivers


    There are different types of drivers available for establishing the database connection;
    let''s look at them.


    # Type 1: JDBC-ODBC Bridge


    It requires you to configure a Data Source Name (DSN) on your system. A type 1
    JDBC driver consists of a Java part that translates the JDBC interface calls to
    ODBC calls. An ODBC driver then calls the ODBC driver of the given database. Type
    1 drivers were mostly used when there were no type 4 drivers (all Java drivers).


    Advantages


    +   - Easy to use

    - Can be easily connected to any database


    Disadvantages


    +   - Performance degraded because JDBC method call is converted into the ODBC
    function calls.

    - The ODBC driver needs to be installed on the client machine.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Following is the flowchart of Type 1 Driver:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_32_0.png)


    Figure 1.3: Type 1 Driver


    # Type 2: Native-API driver


    A type 2 JDBC driver is like a type 1 driver, except the ODBC part is replaced
    with a native code part instead. The native code part is targeted at a specific
    database product, and JDBC API calls are converted into native C/C++ API calls.


    # Advantage


    +   - Performance upgraded than JDBC-ODBC bridge driver


    # Disadvantage


    +   - The Native driver needs to be installed on each client machine.


    +   - The Vendor client library needs to be installed on the client machine.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Web Development Toolkit for Java Developers


    Following is the flow chart of Type 2 Driver:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_33_0.png)


    Figure 1.4: Type 2 Driver


    # Type 3: Network-Protocol


    JDBC clients use standard network sockets. A type 3 JDBC driver is an all-Java
    driver that sends JDBC interface calls to an intermediate server. The intermediate
    server connects to the database on behalf of the JDBC driver.


    # Advantage


    +   - No client-side library is required because of the application server.


    # Disadvantages


    +   - Network support is required on the client machine.

    - It requires database-specific coding in the middle tier.

    - Maintenance of NetworkProtocol driver becomes costly.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Following is the flow chart of Type 3 Driver:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_34_0.png)


    Figure 1.5: Type 3 Driver


    # # Type 4: DatabaseProtocol driver


    It communicates directly with the vendor''s database through socket connection.
    A type 4 JDBC driver directly is an all-Java driver that connects directly to
    the database. It is implemented for a specific database product.


    # Advantages


    +   - Better performance than all other drivers

    - No software required at client or server side


    # Disadvantages


    +   - Drivers depend on the database.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'Following is the flow chart of Type 4 Driver:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_35_0.png)


    Figure 1.6: Type 4 Driver


    Which driver should be used?


    +   * If you are accessing one type of database, such as Oracle, Sybase, or IBM,
    the preferred driver type is 4.

    * If your Java application is accessing multiple types of databases at the same
    time, type 3 is the preferred driver.

    * Type 2 drivers are useful in situations where a type 3 or type 4 driver is not
    available for your database yet.

    * The type 1 driver is not considered a deployment-level driver and is typically
    used for deployment and testing purposes only.

    * Apart from the four drivers listed by the sun recently, there is a type 5 driver.


    # Type 5 JDBC Drivers


    Type 5 JDBC drivers offer the same client-side, single tier, 100% Java architecture
    of type 4 JDBC drivers address the limitations of many of the type 4 JDBC drivers
    available today. Progress DataDirect is the only vendor of Type 5 JDBC drivers.
    It offers superior application performance and scalability, codeless enhancement
    and all-in-one deployment.'
  merge: -1
