    with the use of a YAML or properties file.


    Configuration of the application is provided in a type-safe way.


    Spring boot logging is managed by default.


    Spring boot applications are secure because authentication on various endpoints
    is provided by default.


    # Spring boot advantages and disadvantages


    Spring boot mainly aims to increase productivity by reducing the development and
    testing time and increasing productivity.


    # Advantages


    +   - It is easy to integrate the spring boot application with spring jdbc, orm,
    data. security, etc.


    +   - It provides embedded HTTP servers to develop and test the applications.


    +   - It provides CLI (Command Line Interface) tool to develop and test Spring
    boot (Java or Groovy) Applications from command prompt very easily and quickly.


    +   - It provides multiple plugins to develop and test Spring boot applications
    very easily using build tools like Maven and Gradle.


    +   - It provides many plugins to work with embedded and in-memory databases easily.


    # Disadvantage


    +   - It is a time-consuming process to convert existing or legacy Spring Framework
    projects into Spring boot applications.'
