  md: '# Handling Beans and Using Expression Language


    **Example 1:** In this example, we take three beans classes: *TimeTable, Faculty*
    and *CourseDetails*; each class carries the following properties:


    +   - The *Faculty* bean class contains the *facultyId* and *facultyName* properties.

    - The *CourseDetails* bean class contains the *programName, semesterNumber, courseId*
    and *courseName* properties.

    - The *TimeTable* bean class contains the *dayofweek, dateofweek, hourfoundday,
    faculty* and *course* are of type *Faculty* and *CourseDetails* class.


    We create an input form to enter the timetable details; a servlet reads the data
    and sets the properties of various beans classes; and then shares the bean object
    in the request scope navigates to a JSP page that retrieves the bean properties
    expression language and displays them.


