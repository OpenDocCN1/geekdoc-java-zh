    # Introduction


    The chapter explains the importance and requirement of JSF over JSP and servlets.
    JSF uses web interfaces to bind data dynamically with easy, component-based integration.
    The chapter also covers web interfaces used in JSF; the separation of concerns
    using MVC design pattern; and the use of PrimeFaces and DataList to handle database,
