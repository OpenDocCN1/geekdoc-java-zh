  md: "# MVC design pattern\n\nMVC stands for Model-View-Controller, and this pattern\
    \ is used to separate the application’s concerns. Thus, every layer in MVC is\
    \ assigned with a unique responsibility. So, the view is for the look and feel\
    \ for positioning what the end user will actually see. The model supplies the\
    \ data and business logic. The controller is actually the heart of MVC, as it\
    \ deals with invoking the right view and deciding the navigational part in traversing\
    \ the application. The controller has to coordinate with the model and view layers.\n\
    \n# Need for MVC\n\nThe MVC architectural pattern is not directly related to web\
    \ applications. In fact, it’s quite common in Smalltalk applications, which generally\
    \ have nothing to do with the web. MVC is concerned with separating responsibilities\
    \ in web applications. Allowing a JSP page to handle the responsibilities of receiving\
    \ the request, executing some business logic, and then determining the next view\
    \ to display can make for an unattractive JSP page, not to mention the maintenance\
    \ and extensibility problems this entanglement causes. Application development\
    \ and maintenance are much easier if the different components of a web application\
    \ have clear and distinct responsibilities. The following lists mention the need\
    \ for MVC pattern in an application:\n\n+   - Servlets are good at data processing:\
    \ reading and checking data, communicating with databases, invoking business logic,\
    \ and so on. JSP pages are good at presentation: building HTML to represent the\
    \ results of requests. This chapter describes how to combine servlets and JSP\
    \ pages to make best use of the strengths of each technology.\n- Servlets are\
    \ great when your application requires a lot of real programming to accomplish\
    \ this task. But generating HTML with servlets can be tedious and can yield a\
    \ result that is hard to modify. That’s where JSP comes in. It lets you separate\
    \ much of the presentation from the dynamic content. That way, you can write the\
    \ HTML in the normal manner, using HTML-specific tools and putting your web content\
    \ developers to work on your JSP documents.\n\n+   - The assumption behind a JSP\
    \ document is that if you want to give totally different results depending on\
    \ the data that you receive:\n  - Scripting expressions, beans, and custom tags,\
    \ although extremely powerful and flexible, don’t overcome the limitation that\
    \ the JSP page defines a relatively fixed, top-level page appearance."
  merge: -1
