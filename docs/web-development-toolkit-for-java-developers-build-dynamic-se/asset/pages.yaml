  md: "We have used jsp:useBean to create objects, which are bound to local variables\
    \ in\nthe _jsp method. With the scope attribute, we can change the behavior of\n\
    the local variables depending on one of the four locations.\n\n+   - Page scope\n\
    \  - <jsp:useBean ... scope=\"page\" />\n  - This is the default value; we get\
    \ the same behavior if we omit the scope attribute entirely.\n  - The page scope\
    \ indicates that in addition to binding to a local variable, the bean object should\
    \ be placed in the CallbackContext object for the duration of the current request.\n\
    \  - Storing the object there means that servlet code can access it by calling\
    \ getAttribute on the predefined pageContext variable.\n  - Since every page and\
    \ every request has a different Page, using scope=\"page\" (or omitting scope)\
    \ indicates that the bean is not shared and thus, a new bean will be created for\
    \ each request.\n- Request scope\n  - <jsp:useBean ... scope=\"request\" />\n\
    \  - This value signifies that in addition to binding to a local variable, the\
    \ bean object should be placed in the HttpServletRequest object for the duration\
    \ of the current request, where it is available by means of the getAttribute method.\n\
    \  - Although at first glance, it appears that this scope also results in shared\
    \ beans, two JSP pages or a JSP page share request objects when you use jsp:include,\
    \ jsp:forward, or the include or forward methods of RequestDispatcher.\n  - Storing\
    \ values in the request object is common when the MVC (Model 2) architecture is\
    \ used.\n- Session scope\n  - <jsp:useBean ... scope=\"session\" />\n  - This\
    \ value means that in addition to binding to a local variable, the bean will be\
    \ stored in the HttpSession object associated with the current request, where\
    \ it can be retrieved with getAttribute."
  merge: -1
  pgno: 240
- img_proc: true
  md: "214 Web Development Toolkit for Java Developers\n\n+   - Thus, this scope lets\
    \ JSP pages easily perform session tracking.\n\n+   - Application scope\n  <jsp:Bean\
    \ ... scope=\"application\" />\n\n+   - This value means that in addition being\
    \ bound to a local variable, the bean will be stored in the ServletContext available\
    \ through the predefined application variable or by a call to getServletContext.\n\
    \n+   - The ServletContext is shared by all servlets and JSP pages in the web\
    \ application.\n\n+   - Values in the ServletContext can be retrieved with the\
    \ getAttribute method.\n\nWhen we store beans in different scopes, we have to\
    \ be sure to use different names for each bean. Otherwise, servers can get confused\
    \ and retrieve the incorrect bean.\n\n# Creating beans conditionally\n\n+   -\
    \ To make bean sharing more convenient, you can conditionally evaluate bean-related\
    \ elements in two situations:\n\n+   - First, a jsp:Bean element results in a\
    \ new bean being instantiated only if no bean with the same id and scope is found.\
    \ If a bean with the same id and scope is found, the preexisting bean is simply\
    \ bound to the variable referenced by.\n\n+   - Second, instead of <jsp:bean ...\
    \ />, you can use <jsp:bean ...>statements</jsp:useBean>.\n\n+   - The point of\
    \ using the second form is that the statements the jsp:bean start and end tags\
    \ are executed only if a new bean is created, not if an existing bean is used.\n\
    \n+   - As jsp:Bean invokes the default (zero-argument) constructor, you frequently\
    \ need to modify the properties after the bean is created.\n\n+   - Example 1:\
    \ We take a bean, namely, PageAccess, which has two properties: count and pagename.\
    \ The count property records cumulative access counts to any set of related pages\
    \ and thus, should be executed for all requests. The pagename property stores\
    \ the name of the first page that was accessed and thus, should be executed only\
    \ by the page that is first accessed. To fulfill these two properties, we place\
    \ the jsp:setProperty statement that updates the count property in unconditional\
    \ code, and we place the jsp:setProperty statement for pagename between the start\
    \ and end tags of jsp:useBean."
  merge: -1
