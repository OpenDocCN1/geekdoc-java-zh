  md: '# Handling the data from the client-side data


    To read the data from the client side, use the FORM element to create an HTML
    form. Use the ACTION attribute to designate the address of the servlet or JSP
    page that will process the results; you can use an absolute or relative URL. For
    example: <FORM ACTION="..."></FORM>


    If ACTION is omitted, the data is submitted to the URL of the current page.


    Use input to collect user data. Place the elements between the start and end tags
    of the FORM element and give each input element a NAME. Textfields are the most
    common input element; they are created with the following:


    ```

    <INPUT TYPE="TEXT" NAME="...\>

    ```


    Place a submit button near the bottom of the form. Consider the following example:


    ```

    <INPUT TYPE="SUBMIT">

    ```


    When the button is pressed, the servlet designated by the form''s ACTION is invoked.
    With GET requests, a question mark and value pairs are attached to the end of
    the URL, where the names come from the NAME attributes in the HTML input elements
    and the values come from the user. With POST requests, the data is sent, but by
    a separate request line instead of being attached to the URL. Extracting the needed
    information from this form data is traditionally one of the most tedious parts
    of server-side programming. You have to invoke the data either from getTotalMethod,
    and then read the request parameters and parse them if required.


    # Methods to read the data


    This section explains the methods used to read the data.


    # Reading single values: getParameter


    To read a request (form) parameter, you simply call the getParameter method of
    HttpServletRequest, supplying the case-sensitive parameter name as an argument.
    You supply the parameter name exactly as it appeared in the HTML source code,
    and you get the result exactly as the user entered it; URL-decoding is done automatically.
    Unlike many alternatives to servlet technology, you use getParameter exactly the
    same way when the data is sent by GET (that is, from within doGet method) as when
    it is sent by POST (that is, from within doPost); the servlet knows which request
    method the client used and automatically uses the appropriate method to read the
    data. An empty String is returned if the parameter exists but has no value (that
    is, the user left the corresponding textField when submitting the form), and null
    is returned if there was no such parameter.'
