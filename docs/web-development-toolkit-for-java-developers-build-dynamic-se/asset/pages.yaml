  md: 'It is always a good practice to handle the exceptions in the Java code, but
    these attributes can be used for debugging purposes during the development and
    testing phase, where several pages can generate the exception and one designated
    page catches and displays the exceptions.


    # The isThreadSafe attribute**


    The **isThreadSafe** attribute controls whether the servlet that results from
    the JSP page will allow concurrent access (the default) or guarantee that no servlet
    instances processes more than one request at a time (**isThreadSafe="false"**


    Use of the isThreadSafe attribute takes one of the following forms:


    ```

    <%@ page isThreadSafe="true" %> <-- Default --%

    <%@ page isThreadSafe="false" %>

    ```


    Do not use **isThreadSafe**. Use synchronization instead.


    **Example 1:** We have a counter that is incremented on every user request, as
    a thread is created to handle each request. We want to make sure only one thread
    at a time is incrementing and accessing the **counter** variable.


    +   - JSP code to increment a counter by multiple threads without applying mutual
    exclusion:


    ```

    01. <% private int count = 0; %>

    02. <%%

    03.     out.println("Counter is : "+count);

    04.     count = count + 1;

    05. %>

    ```


    Figure 7.47: JSP code to increment a counter by multiple threads


    +   - JSP code to increment a counter by multiple threads applying mutual exclusion:


    ```

    01. <% private int count = 0; %>

    02. <%%

    03.     synchronized(this)

    04.     {

    n05.         out.println("Counter is : "+count);

    06.         count = count + 1;

    07.     }

    08. %>

    ```


    Figure 7.48: JSP code to increment a counter by multiple threads applying mutual
    exclusion'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Using the synchronized method, only one thread at a time will execute the code
    written within the code, so mutual exclusion is applied to deal with the problems
    faced due to concurrency.


    # The extends attribute


    The extends attribute designates the superclass of the servlet that will be generated
    for the JSP page. It takes the following form:

    <@ page extends="package.class" %>


    This attribute is normally reserved for developers or vendors that implement fundamental
    changes to the way in which pages operate (for example, to add in personalization
    features).


    # The language attributes


    The language attribute is intended to specify the scripting language being used,
    as follows:

    <@ page language="c" %>

    We don''t use this attribute since Java is both the default and the only legal
    choice.


    # Include files


    JSP has two main capabilities for including external files into a JSP document:


    +   - The jsp:include action

    - The include directive


    # The jsp:include action


    jsp:include action lets you include the output of a page at request time. The
    main advantage is that it saves you from changing the main page when the included
    pages change. Another advantage is that since it includes the output of the secondary
    page, not the secondary page''s actual code as with the include directive, the
    included pages cannot use any JSP constructs that affect the main page as a whole.


    jsp:include lets insert any of the following into the JSP output:


    +   - The content of an HTML page

    - The content of a plain text document

    - The output of a JSP page

    - The output of a servlet'
