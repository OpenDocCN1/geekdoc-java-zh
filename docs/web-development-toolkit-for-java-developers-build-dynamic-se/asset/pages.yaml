  md: '240 Web Development Toolkit for Java Developers


    +   header and headerValues: These objects allows us to access the complete HTTP
    request header values. We can use a dot notation or [] to access the properties.
    The dot notation cannot be used when the value after the dot would be a constant
    value and not a name of property. To access the Accept header


    User Agent: ${header["user-agent"]}


    +   Cookie: This object allows you to refer to the incoming cookies. To access
    the value, we can use the value property and the getValue method of the Cookie
    class. To access the cookie named mycookie, we can write the code as follows;
    it will display the value of cookie found or display nothing if the cookie not
    found.


    Cookie Value: ${cookie.mycookie.value}


    +   pageScope, requestScope, sessionScope, and applicationScope: These objects
    allow us to specify where the system should search for the scoped variables. For
    example, with $(commonvariable), the system searches for commonvariable in the
    PageContext, HttpServletRequest, HttpSession and ServletContext, returning the
    first it finds. But if we use ${sessionScope.commonvariable}, the system searches
    only in HttpSession. To access the scoped commonvariable from ServletContext,
    we can write the code as follows:


    CommonScopedVariable: ${applicationScope.commonvariable}


