  md: "jsp:include action includes the output of a secondary page when the main page\
    \ is requested. Although the output of the included pages cannot contain JSP,\
    \ the pages can be the result of resources that servlets or JSP to create the\
    \ output. So, the URL that refers to the included resource is interpreted in the\
    \ normal manner by the server and thus, can be a servlet or JSP page. The server\
    \ runs the included page in the usual way and places the output into the main\
    \ page.\n\n# The page attributes\n\nYou designate the included page with the page\
    \ attribute, as follows. This attribute is required; it should be a relative URL\
    \ referencing the resource whose output should be included.\n\n```\n<jsp:include\
    \ page=\"relative-path-to-resource\" />\n```\n\nRelative URLs that do not start\
    \ with a slash are interpreted relative to the location of the main page. Relative\
    \ URLs that start with a slash are interpreted relative to the base web application,\
    \ not relative to the server root.\n\n# The flush attribute\n\nIn addition to\
    \ the required page attribute, jsp:include has a second attribute: flush, as shown\
    \ below. This attribute is optional. It specifies whether the output stream of\
    \ the main page flushes before the inclusion of the page (the default is false).\n\
    \n```\n<jsp:include page=\"relative-path-to-resource\" flush=\"true\" />\n<jsp:param>\
    \ element\n```\n\nThe included page uses the same request object as the originally\
    \ requested page. As a result, the included page normally sees the same request\
    \ parameters as the main page. If, however, you want to add or replace those parameters,\
    \ you can use the jsp:param element (which has name and value attributes) to do\
    \ so. For example, consider the following snippet:\n\n```\n<jsp:include page=\"\
    secondary.jsp\">\n<jsp:param name=\"coursname\" value=\"java\" />\n</jsp:include>\n\
    ```\n\nNow, suppose that main page is invoked by means of http://localhost:8084/IncludeAction/mainpage.jsp?classname=mca.\n\
    \nIn such case, the following list summarizes the results of various getParameter\
    \ calls:\n\n+   - In main page (mainpage.jsp):\n  request.getParameter(\"classname\"\
    ) returns \"mca\".\n  request.getParameter(\"coursname\") returns null."
