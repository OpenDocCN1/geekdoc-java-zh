    # # Spring boot starter web


    The starter web can be configured for easy web development. We need to add the
    following dependency to the pom.xml file:


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-web</artifactId>

    <version>2.2.2.RELEASE</version>

    </dependency>

    ```


    As default values, the spring web uses MVC and Rest, and it uses tomcat as embedded
    server. Using starter web dependency, add all the dependencies for the web development
    and reduce the build time. The starter web depends on the following:


    +   - org.springframework.boot:spring-boot-starter

    - org.springframework.boot:spring-boot-starter-tomcat

    - org.springframework.boot:spring-boot-starter-validation

    - com.fasterxml.jackson.core:jackson-databind

    - org.springframework.framework:spring-web

    - org.springframework.framework:spring-webmvc


    By default, the following tomcat server dependency is set up with the spring boot
    starter:


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    <version>2.0.0.RELEASE</version>

    ```'
