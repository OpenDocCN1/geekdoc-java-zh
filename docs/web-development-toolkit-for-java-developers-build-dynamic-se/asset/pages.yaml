    \nFigure 8.99: JSP page to display the bean properties using expression language\n\
    \nIn this example, we use the servlet to read the request parameters and set the\
    \ bean properties. After setting the beans, we share the timetable bean t in the\
    \ request scope, and navigate to the JSP page to display the bean properties using\
    \ the expression language. We use ${t.dateofweek} to access the dateweek property\
    \ from the TimeTable class; ${t.programName} to access the program property of\
    \ the CourseDetails class, with the property of the TimeTable class. Note that\
    \ in this example, we did set the value and read the request parameter to set\
    \ the dayofweek property, as we use a String array to get the day of week name,\
    \ and by using it.\n\n# Using Operators\n\nVarious operators are supported in\
    \ expression language notation. The different operators are listed as follows:\n\
    \n+   * Arithmetic operators\n    - o +, -, *, / and div,% and mod.\n* Relational\
    \ operators\n    - o == eq, != and ne, < lt, and gt, <= and le, and >=\n* Logical\
    \ operators\n    - o &&, ||, |, or !, not\n    - These are the standard logical\
    \ AND, OR, and NOT operators.\n* The empty operator\n    - empty"
