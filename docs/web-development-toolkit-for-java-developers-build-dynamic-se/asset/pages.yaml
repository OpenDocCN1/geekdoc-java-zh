  md: 'Working with Web Services (SOAP and RESTful)


    those involving business transactions, and those accessed by banks and government
    organizations, are SOAP-based.


    # SOAP web services benefits


    SOAP offers the following benefits:


    +   - WS security: WS Security is a type of security that SOAP defines.


    +   - Independent of programming language and platform: SOAP web services can
    be created in any language and run on any platform.


    # Problems with SOAP web services


    +   - Slow: In order to be read, SOAP requires an XML format that must be parsed.
    It outlines several requirements that must be met while creating SOAP applications.
    As a result, it is slow and uses up more resources.


    +   - WSDL dependent: SOAP relies on WSDL as its only method of service discovery.


    # RESTful web services


    Representational State Transfer is the abbreviation for REST. REST is not a protocol
    but an architectural approach. URIs are used to identify groups of resources that
    make up REST-based (''RESTful'') web services. Every process and document is represented
    as a web resource with its URL. The actions that can be defined in an HTTP header
    affect these online pages. None of the WSDL, SOAP, or WS-* standards are utilized.
    Instead, any format, including XML, JSON, and HTML, can be used for message exchange.
    A web browser can frequently act as the client. The REST protocol is HTTP. There
    are only four options: GET, POST, PUT, and DELETE. Requests can be bookmarked,
    and replies can be changed. A network administrator can quickly understand and
    find what is going on the network. For applications where HTTP is the right protocol
    and additional security is not required beyond provided by the HTTP infrastructure,
    REST is a suitable solution. REST services are still capable of providing complex
    functionality. Amazon, Flickr, and Google Maps offer all RESTful web services.
    You can integrate services from third parties like Facebook and Zillow into your
    own applications using the Software as a Service (SaaS) capabilities of the NetBeans
    IDE.


    # Advantages of RESTful web services


    +   - Quick: Because there is no rigid specification as there is with SOAP, RESTful
    web services are quick, and less bandwidth and resources are used.'
