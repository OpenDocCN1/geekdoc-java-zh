    \ we need to note three things about XML:\n\n+   - XML element names can contain\
    \ colons. The element name is not jsp:include; in fact, the XML-compatible version\
    \ of all standard JSP elements starts with the JSP prefix (or namespace).\n- XML\
    \ tags are case-sensitive. Be sure to use jsp:include in all lower case.\n- XML\
    \ tags must be explicitly closed. In XML, all elements are container elements,\
    \ and end tags are never optional.\n\n**Example 1:** To understand the use of\
