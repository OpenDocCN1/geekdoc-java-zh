- img_proc: true
  md: '# Objectives


    After studying this chapter, you should be able to understand the Spring boot
    basics and its core architecture. You should be familiar with how to create projects
    and know basic annotations used in spring boot. Additionally, you should have
    gained knowledge of spring boot properties and dependencies, and know how to handle
    the database connectivity.


    # Basics of Spring boot


    Spring is one of the most commonly used frameworks for developing Java-based applications
    as it provides the facility of dependency injection and inversion of control that
    supports the development of loosely coupled applications. Spring has many modules,
    and one of them is Spring boot, which allows us to build stand-alone applications
    with almost no configurations. It is mainly used to develop simple restful services.
    Spring boot is a way to provide rapid application development using the Spring
    framework. It is a module built as part of the Spring framework and can be used
    to develop stand-alone well as web applications. Spring boot provides support
    for dependency injection; it has a very good database transaction management capabilities
    and provides easy integration with other Java framework like JPA, Hibernate, JPA,
    ORM, and so on. Using spring framework can help reduce development cost and time
    of the application. Spring boot provides opinionated development approach, and
    it reduces lots of import statements, XML and extra annotation-based configuration.
    Following is the list of main features provided by Spring boot:


    +   - Web application can be developed quickly and easily using this module. The
    application can use in-built servers like Tomcat, Jetty, or Undertow. The starter
    web module of spring boot can be used to develop and deploy the application quickly.

    - The Spring Application class is used to bootstrap a Spring application by calling
    the main method and static run() method.

    - Spring boot uses event handling by providing various listeners to handle the
    events.

    - We can access and manage spring boot applications remotely by enabling the administrator-related
    features.

    - Spring boot allows us to provide various configurations that allow the same
    application to work with a heterogenous platform, providing configuration in YAML
    file.'
  merge: -1
  pgno: 485
