    # Generate the server response


    The response code sent by the server specifies the type of operation performed
    by the server. The server responses can be accessed by various methods. The HTTP
    status line consists of various fields like version, status code and a message.
    All messages are set for each status code, so the server just need to set the
    right status code, and the message is set automatically. By default, the status
    code 200 is set, so servlets need not specify; but in case a different status
    code is to be set, the servlet can use the response.setStatus, response.sendRedirect,
    or response.sendError method for setting the specific status code.'
