  md: '# Assigning all properties of bean with input parameter values


    Associating a property with a request parameter saves you the bother of performing
    conversions for many of the simple built-in types. JSP lets you take the process
    one step further by associating all properties with identically named request
    parameters. All you have to do is to use "*" for the property parameter. We can
    replace the code at-code as follows:


    ```

    01. <jsp:useBean id="s1" class="studentInformation.StudentBean"/>

    02. <jsp:setProperty name="s1" property="name" />

    03. <jsp:setProperty name="s1" property="program" />

    04. <jsp:setProperty name="s1" property="semester" />

    05. <jsp:setProperty name="s1" property="marks1" />

    06. <jsp:setProperty name="s1" property="marks2" />

    07. <jsp:setProperty name="s1" property="marks3" />

    ```


    Figure 8.33: Replacing the code


    With the following code:


    ```

    01. <jsp:useBean id="s1" class="studentInformation.StudentBean"/>

    02. <jsp:setProperty name="s1" property="*" />

    ```


    Figure 8.34: Replace the code with this


    This approach lets define simple beans whose properties correspond to the request
    parameters and get populated automatically. Although this approach is simple,
    following three things should be taken of:


    +   * No action is taken when an input parameter is missing.

    * Automatic type conversion does not guard against illegal values as effectively
    as manual type conversion.

    * Bean property names and request parameters are case sensitive.


    # Sharing Beans in different scopes


    The availability of a JSP object for use from a particular place of the application
    is defined as the scope of JSP object. Every object created in a JSP page will
    have a scope. Object scope in JSP is segregated into four parts: page, request,
    session, and application.'
