  md: '# Functional operations


    Functional operations contain the following:


    +   -Transport:** This operation takes care of transfer of request from the consumer
    to the provider and the response from the provider to the consumer.

    - **Service communication protocol:** It gives the specification for communication
    between the consumer and the provider.

    - **Service description:** It gives the details of the service and data required
    to start the service.

    - **Service:** It is the functionality.

    - **Business process:** It provides the list of services to be called in a particular
    order with the specific rules to meet the business requirements.

    - **Service registry:** It contains the details of data used by service providers
    to publish their services.


    # Qualitative operations


    The qualitative operations include the following:


    +   - **Policy:** It specifies the set of protocols using which the providers
    and consumers can communicate.

    - **Security:** It specifies the set of protocols that are used to provide identification
    and authorization.

    - **Transaction:** It is used to provide consistent result; it ensures that if
    more than one service are used, all of them are executed in the required order,
    so the results are complete and correct.

    - **Management:** It specifies the set of attributes used to manage the services.


