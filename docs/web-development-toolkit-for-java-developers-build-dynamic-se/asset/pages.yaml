  md: '@SpringBootApplication: Instead of using different annotations for component
    scan, configuration and allowing autoconfiguration, we can use this annotation
    to specify the run method.


    @RequestMapping: It is applied for mapping of the requests for a class and method.
    The annotation offers various elements one can use or omit as per requirement;
    the most used elements include header, method, params, path, and value.


    @GetMapping: It is used to map the HTTP GET requests on the specific method as
    web service endpoints. It can be used as a short way to indicate the Get request
    instead of using RequestMapping and indicating the Get method request.


    @PostMapping: It is used to map the HTTP POST requests on the specific method
    as web service endpoints. It can be used as a short way to indicate the Post request
    instead of using RequestMapping and indicating the Post method request.


    @PutMapping: It is used to map the HTTP PUT requests on the specific method as
    web service endpoints. It can be used as a short way to indicate the Put request
    instead of using RequestMapping and indicating the Put method request.


    @DeleteMappingMapping: It is used to map the HTTP DELETE requests on the specific
    method as web service endpoints. It is an alternative of using RequestMapping
    and indicating the Delete method request.


    @PatchMapping: It is used to map the HTTP PATCH requests on the specific method.
    It can be used as a short way to indicate the Patch request instead of using RequestMapping
    and indicating the Patch method request.


    @RequestBody: It is used to map the request body with an object in a method parameter.


    @ResponseBody: It is used to bind the value that is returned by a method to the
    response body. It translates an object into JSON or XML format.


    @PathVariable: It is used to retrieve the values from the URI generally used with
    web services. Multiple path variables can be used in a method.


    @RequestParam: It is used to retrieve the query parameters from the URL; we can
    specify default values in case the query parameter is missing.'
