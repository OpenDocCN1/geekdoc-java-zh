  md: 'The library files for the spring modules are in the spring framework’s dist
    directory. These JAR files are our focus. These JAR files will be copied into
    our development environment. The following JAR files make up the Spring framework:
    spring-aop.jar, spring-beans.jar, spring-context.jar, spring-context-support.
    spring-core.jar, spring-jdbc.jar, spring-jms.jar, spring-orm.jar, spring-test.jar,
    spring-tx.jar, spring-web.jar, spring-webmvc-portlet.jar, and spring-webmvc-strut.
    The lib directory, which holds the library files needed by the application, is
    another crucial directory.


    # # IoC container


    Beans are created and configured using a bean factory. In addition to doing that,
    an application context offers the infrastructure necessary to enable many enterprise-specific
    capabilities like transactions and AOP. The IoC container for the Spring Framework
    is built on top of the beans and context packages that are part of the org.springframework
    package. The BitmapFactory interface offers a sophisticated setup system that
    can handle objects of any kind. On top of the BeanFactory, the ApplicationContext
    interface offers new features, including event handling, managing resource bundles,
    and application-specific features like WebApplicationContext for usage in online
    applications. It also makes it simpler to integrate with Spring’s AOP features.


    # # Containers and beans


    Spring containers manage objects using beans. The BitmapFactory interface is used
    to store and maintain the beans. It finds or creates objects, configures those
    objects, and assembles the dependencies between those components. The XmlBeanFactory
    class uses the XML configuration to create a fully organized application:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_451_0.png)


    Figure 13.3: XML configuration metadata creating organized application'
