  md: '# Objectives


    After studying this chapter, you should be able to access the database and perform
    basic operations like creating a table, inserting records in the table, altering
    it, deleting the records, updating the records, and performing the basic database
    tasks from the Java program.


    # Steps to access the database from Java application


    These are the steps involved in building a JDBC application:


    +   - Import the packages

    - Register the JDBC driver

    - Open a connection

    - Create a statement

    - Execute a query

    - Extract data from result set

    - Clean up the environment


    # Import the packages


    To use the classes and interfaces provided by API, java.lang is the package in
    which our desired functionality falls. By default, java.lang is imported in the
    application, so all the other packages have to be imported explicitly. To use
    the JDBC API, we need to import java.sql or javax.sql, as they provide the primary
    and necessary classes for establishing the connection and communicating with the
    database. The import statement is as follows:


    ```

    import java.sql. *;

    ```


    It is a bad practice to write ''*'' after the package name; instead, write the
    name of classes required to use as part of application programming.


    # Register the JDBC driver


    We need to register the driver to initialize communication with the database.
    This step causes the JVM to load the desired driver implementation into memory
    so that it can fulfill your JDBC requests.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Performing Insert, Update, Delete and Select Operations


    You must register the driver in your program before you use it. Registering the
    driver is the process by which the Oracle driver''s class is loaded into the memory
