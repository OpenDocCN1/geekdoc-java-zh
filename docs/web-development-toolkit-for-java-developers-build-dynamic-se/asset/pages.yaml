    # MetaData


    Metadata refers to data about data. To get details about the results received
    after executing query, we use the ResultSetMetadata; likewise, to receive more
    information about the database being used, we can use DatabaseMetaData. These
    are provided as interfaces, with several methods that we can explore and use for
    our purpose.


