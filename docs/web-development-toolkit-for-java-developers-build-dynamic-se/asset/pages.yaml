    # Introduction


    The chapter focuses on understanding a design pattern for developing code with
    a concern of separation of model, design and view that is shortly known as MVC
    pattern.. The chapter shows the implementation of this pattern using servlets,
    beans and JSP.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - Understanding the use of technology

    - MVC design pattern, need for MVC and MVC frameworks

    - Implementing MVC with Servlets and JSP

    - Introduction to RequestDispatcher interface

