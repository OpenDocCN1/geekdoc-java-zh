    \ initial-scale=1.0\">\n</head>\n<body>\n  <h1><a href=\"Collections\">Accessing\
    \ Collections</a></h1><br>\n</body>\n</html>\n```\n```\n\nFigure 82: Index for\
    \ the page to invoke the servlet\n\n+   b. Servlet for creating and sharing objects\
    \ known as scoped variables\n\n```\n```java\npackage core;\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport java.util.ArrayList;\nimport java.util.HashMap;\n\
    import javax.servlet.RequestDispatcher;\nimport javax.servlet.ServletExceptionException;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import java.util.Map;\nimport java.util.Collections;\npublic class Collections\
    \ extends HttpServlet {\n  @Override\n  protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse response) throws ServletException, IOException\
    \ {\n    List<String> artists = new ArrayList<>(Arrays.asList(\"Abbey Lincoln\"\
    , \"Lincoln Richard\"));\n    List<String> genres = new ArrayList<>(Arrays.asList(\"\
    Rhythm and Blues\", \"Jazz\"));\n    HashMap<String, String> origin = new HashMap<>();\n\
    \    origin.put(\"Music\", \"United States and United Kingdom\");\n    origin.put(\"\
    Rhythm and Blues\", \"African-American communities\");\n    origin.put(\"Jazz\"\
    , \"African-American\");\n    origin.put(\"Blues\", \"United States\");\n    request.setAttribute(\"\
