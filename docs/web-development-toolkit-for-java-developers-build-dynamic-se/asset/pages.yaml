  md: "# AOP terminologies\n\nThe following section covers the most common terminologies\
    \ used in the AOP.\n\n# Aspects\n\nThe cross-cutting tasks are known as an aspect;\
    \ for example, in the following code, logging and transaction management are the\
    \ aspects:\n\n```\npublic void businessOperation(BusinessData data){\n  // Logging\n\
    \  logger.info(\"Business Method Called\");\n  // Transaction Management Begin\n\
    \  transaction.begin();\n  // Do the original business operation here\n  transaction.end();\n\
    }\n```\n\n# JoinPoint\n\nJoin Points defines the various execution points where\
    \ an aspect can be applied, as shown here:\n\n```\npublic void someBusinessOperation(BusinessData\
    \ data){\n  //Method Start -> Possible aspect code here like logging.\n  try{\n\
    \    // Original Business Logic.\n  }catch(Exception exception){\n    // Exception\
    \ -> Aspect code here when some exception is raised.\n  }finally{\n    // Final\
    \ -> Even possible to have aspect code at this point too.\n  }\n  // Method End\
    \ -> Aspect code here in the end of a method.\n}\n```\n\nWe can define multiple\
    \ execution points, and an aspect need not be applied to all the Join Points.\n\
    \n# Pointcut\n\nJoin Points are the logical points wherein a particular aspect\
    \ or a set of aspects can be applied. A pointcut or a pointcut definition will\
    \ tell exactly which join points the aspects will be applied. Let us understand\
