    # Spring boot embedded web server


    An application has an embedded server by default. The benefit of an embedded server
    is that we do not need to install the server before deploying the application.
    Tomcat is the default embedded server with spring boot. Spring Boot also supports
    two other embedded servers: Jetty Server and Undertow Server.


    # Using another embedded web server


    For basic applications, the spring boot starter uses tomcat as a default server,
    but we can also use jetty or undertow server. For reactive applications, the starter-webflux
    includes Reactor Netty by including starter-reactor-netty, but we can also use
    starter-tomcat, starter-jetty, or starter-undertow instead.


    # Jetty server


    Jetty is another embedded server supported by Spring Boot. It is an HTTP server
    and Servlet container that can be used to generate static and dynamic content.
    Generally, it is used when more machine communication is required. Add spring
    boot jetty dependency in the pom.xml file to use the jetty server. We need to
    remove the default or any other servlet container before adding the jetty server
    so that we do not face server conflicts.


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-web</artifactId>

    <exclusions>

    <exclusion>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    </dependency>

    ```'
