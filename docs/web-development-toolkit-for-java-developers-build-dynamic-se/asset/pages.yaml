    CallableStatement, and PreparedStatement interfaces define the methods and properties
    that enable you to execute SQL or PL/SQL commands and receive data from your database.
    They also define methods that help bridge data type differences between Java and
    SQL data types used in a database. Below table provides the types of Statements
    available:


    | Interfaces | Recommended use |

    | --- | --- |

    | Statement | It is used for general-purpose access to your database and is useful
    when you are using static SQL statements at runtime. The Statement interface cannot
    accept parameters |

    | PreparedStatement | Use this when you want to plan the SQL statements many times.
    The PreparedStatement interface accepts input at runtime |

    | CallableStatement | Use when you want to access the database stored procedures.
    The CallableStatement interface can also accept runtime input parameters.|


