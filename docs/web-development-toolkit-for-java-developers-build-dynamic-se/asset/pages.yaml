    # The import attributes


    +   - It lets you specify the packages that should be imported by the servlet
    into which the JSP page gets translated.

    - This allows you to call Java code indirectly and develop separate utility classes.

    - Insert into JSP page only the Java code needed to invoke the utility classes.

    - These utilities must use packages, and the JSP page should use the import attribute.

    - When you use utility classes, remember that they should always be in packages.

    - Packages are a good strategy on any large project because they help protect
    against name conflicts.

    - With JSP, however, packages are absolutely required. The reason is that, in
    the absence of packages, classes you reference are assumed to be in the same package
    as the current class.

    - By default, the servlet imports the following:


    ```

    java.lang.*

    javax.servlet.*

    javax.servlet.jsp.*

    javax.servlet.http.*

    *?

    ```'
