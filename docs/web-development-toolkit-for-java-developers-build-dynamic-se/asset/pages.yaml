    # Handling the request headers


    This category of methods provides a way to read and process the request headers.


    # Methods to read the request headers


    To read the headers, we should provide the name of header we wish to read in the
    getHeader() method. For example, if wish to access the Connection header, we may
    access it through request.getHeader("Connection"). Apart from the getHeader, we
    can access some headers directly with better methods specially created to access
    the headers.


    The following is a list of a few methods for such headers:


    +   * getCookies: This method returns the content of the Cookie header as an array
    of Cookie object.


    +   * getAuthType and getRemoteUser: These methods are used to divide the Authorization
    header into small parts.


    +   * getContentLength: This header is used to retrieve the length of content
    and return a value in integer for the header.


    +   * Content-Length.getContentType: This header is used to retrieve the Content-Type
    header as a String.'
