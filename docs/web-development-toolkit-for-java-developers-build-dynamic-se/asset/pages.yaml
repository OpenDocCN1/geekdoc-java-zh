    # Dependency management


    Dependencies and configuration are managed automatically in Spring boot. With
    each new version, the list of dependencies supported are updated. Spring boot
    automatically updates the version of dependencies we need not provide of the time.
    When Spring boot version is updated, all the dependencies are updated automatically.
    All the configuration of starter parent is adopted by the Maven project, which
    generally includes Java compiler version, dependency section, spring boot dependencies
    POM, plugin configuration, resource filtering, and UTF source encoding.


    # Inheriting starter parent


    The following code shows how the parent inherits by default when we configure
    the project:


    ```

    <parent>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-parent</artifactId>

    <version>2.2.2.BUILD-SNAPSHOT</version>

    <relativePath/>

    </parent>

    ```


    We can use the <properties> tag to override already injected dependency with the
    new values for the same dependency; for example, to manage Java version, we can
    use the <java.version> tag.'
