    the JSP page,that access and display the scoped variables using expression language.


    The syntax of accessing scoped variables using expression language is easy to
    use, and it provides two benefits: you need not write the scope of the object/variable
    you are wishing to access, you need not write core Java syntax even though you
    are using core Java.


    # Retrieving Collections


    The JSP 2.0 expression language lets you access different types of collections:


    +   - For instance, if attribute Name is a scoped variable referring to an array,
    List, or Map, you access an item in the collection with the syntax ${attributeName[keyName]}.


    +   - If the scoped variable is an array, the entry name is the index, and the
    value is obtained with theArray[index].


    For example, if artistnames refers to an array of Strings, ${artistnames[0]} would
    output the first item in the array.


    +   - If the scoped variable is an object that implements the List interface,
    the item name is the index, and the value is obtained with listobject.get(index).


    For example, if musicgenre refers to ArrayList, ${musicgenre[0]} would output
    the first item in the ArrayList.


    +   - If the scoped variable is an object that implements the Map interface, the
    entry name is the key, and the value is obtained with mapobject.get(key).'
