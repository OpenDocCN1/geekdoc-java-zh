  md: '434    Web Development Toolkit for Java Developers


    The loginAction bean has a scope for HTTP request, so whatever changes we make
    are applied to a single request; they will not affect other requests that use
    instances from the loginAction bean. The bean will be destroyed after the request
    has been processed.


    # The session scope


    In session scope, a bean is defined for the lifetime of a session, as shown here:


    ```

    <bean id="userPreferences" class="com.mybean.UserPreferences" scope="session"/>

    ```


    The userPreferences is created in the session scope, so it is available between
    the request throughout the single session. When the session expires, the bean
    is destroyed.


    # The global session scope


    In global session, the bean is defined for multiple sessions in the ApplicationContext,
    as shown here:


    ```

    <bean id="userPreferences" class="com.mybean.UserPreferences" scope="globalSession"/>

    ```


    The bean defined in this scope is accessed across multiple sessions.


    # Custom scopes


    We can define our own scope; the interface org.springframework.beans.factory.config.Scope
    is used to create the bean. The following methods provide the handling of beans
    in custom scope:


    +   - Object get (String name, ObjectFactory objectFactory): It returns the object
    from the given scope.

    - Object remove (String name): It is used to remove the bean from the defined
    scope.

    - void registerDestructionCallback(String name, Runnable destructionCallback):
    It is used when the scope is destroyed or specific object is destroyed in the
    scope.

    - String getConversationId(): It is used to get an identifier for the given scope.'
