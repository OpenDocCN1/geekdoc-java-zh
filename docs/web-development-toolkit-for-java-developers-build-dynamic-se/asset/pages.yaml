    in Table 2.5:


    | Sr.no. | Methods and description |

    | --- | --- |

    | 1 | public void beforeFirst(): Moves the cursor before the first row |

    | 2 | public void afterLast(): Moves the cursor just after the last row |

    | 3 | public boolean first(): Moves the cursor to the first row |

    | 4 | public void last(): Moves the cursor to the last row |

    | 5 | public boolean absolute(int row): Moves the cursor to the specified row
    |

    | 6 | public boolean relative(int row): Moves the cursor to the given number of
    rows forward or backward from where it is currently pointing |

    | 7 | public boolean previous(): Moves the cursor to the previous row and returns
    false if the previous row is off the set |

    | 8 | public boolean next(): Moves the cursor to the next row and returns false
    if there are no more rows in the result set |

    | 9 | public int getRow(): Returns the row number that the cursor is pointing
    to |

    | 10 | public void moveToInsertRow(): Moves the cursor to a special row in the
    result set that can be used to insert a new row into the database; the cursor
    location is remembered |

    | 11 | public void moveToCurrentRow(): Moves the cursor back to the current row
    if the cursor is currently at the insert row; otherwise, this method does nothing
    |


    Table 2.5: Navigation methods provided by ResultSet'
