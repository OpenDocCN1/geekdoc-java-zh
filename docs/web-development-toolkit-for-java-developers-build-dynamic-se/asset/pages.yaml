    # Events in JSF


    JSF is a component-based MVC framework and an event handling framework. This means
    interactions with users and components are handled using events. By separating
    event creation from event handling code, events should offer a clear separation
    of concerns. Server-side events and client-side events are the two categories
    into which JSF events fall. Java programmers would write an event generator or
    listener whose purpose is to establish the next step and keep an eye out for life
    cycle events. The server''s event handlers are transparently translated to client-side
    events, such as a user pressing a button in the browser. The actual wiring of
    the events is mostly done by the JSF framework.


