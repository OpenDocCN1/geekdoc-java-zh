  md: '+   * To simplify these expressions, you can use several predefined variables
    (or implicit objects).


    +   * There is nothing magical about these variables; the system simply tells
    you what it names it use for the local variables in _jspService (the method that
    replaces doGet in servlets that result from JSP pages).


    +   * JSP changes the method name from doGet to _jspService and uses a Jspwriter
    instead of a PrintWriter.


    +   * We can use lists of predefined implicit objects in the JSP expressions and
    scriptlets to perform various operations easily.


    You are supplied with eight automatically defined local variables in _jspService,
    sometimes called implicit objects:


    +   * request


    +   * response


    +   * out


    +   * session


    +   * application


    +   * config


    +   * pageContext


    +   * page


    +   * request: This variable is the HttpServletRequest associated with the request;
    it gives you access to the request parameters, the request type (for example,
    GET or POST), and the incoming HTTP headers (for example, cookies).


    +   * response: This variable is the HttpServletResponse associated with the response
    to the client.


    +   * out: This variable is the Writer used to send output to the client. The
    out variable is used almost exclusively in scriptlets since JSP expressions are
    automatically placed in the output stream and thus, rarely needed to refer to
    explicitly.


    +   * session: This variable is the HttpSession object associated with the request.


    +   * application: This variable is the ServletContext as obtained by getServletContext.Servlets,
    and JSP pages can store persistent data in the ServletContext object rather than
    instance variables.


    +   * config: This variable is the ServletConfig object for this page.'
