  md: "# Attribute:\n\n+   - **dataSource**: The DataSource for the database to be\
    \ accessed\n\n+   - **isolation**: Isolation level for the transaction; it can\
    \ be **read_committed, read_uncommitted, repeatable_read**, or\n\n+   - **serializable**:\
    \ This is an optional attribute that defaults to the **DataSource** isolation\
    \ level\n\nExample:\n\n```\n<sql:transaction>\n  <sql:update sql=\"update bookstore\
