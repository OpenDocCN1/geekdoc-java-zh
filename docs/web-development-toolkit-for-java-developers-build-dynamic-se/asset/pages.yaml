    # Sending cookies to the client


    Sending cookies to the client invokes three steps:


    +   - The first step is to create a cookie object by calling the parameterized
    constructor with the cookie name and value.

    - The second step is to set the maximum age of the cookies; to save the cookie
    on disk rather than keeping it in memory, you can specify the time interval in
    seconds using setAge.

    - The third step is to place the cookie in the Http response header using the
    addCookie method.


    To apply the first step for creating the cookie, we can call the constructor to
    pass the cookie name and value, for example, to create a cookie name userID with
    a value user1, we can use the parameterized constructor as follows:

    `Cookie c = new Cookie("userID", "user1");`


    # Setting the maximum age


    When we create it and send it to the browser, it is preserved in the browser''s
    memory and removed when the user closes the browser, so it is stored for the current
    session. To store the cookie on disk, we can setMaxAge by specifying time in seconds,
    for example, to store the cookie for 1 week, we can write the method as

    `c.setMaxAge(60*60*24*7);`

    Setting the maximum age to 0 instructs the browser to delete the cookie.


    # Placing the Cookie in the Response Headers


    We can send the cookie using the addCookie method. Here''s an example:

    `Cookie userCookie = new Cookie("user", "uid");`

    `userCookie.setMaxAge(60*60*24*365); // Store cookie for 1 year

    `response.addCookie(userCookie);`'
