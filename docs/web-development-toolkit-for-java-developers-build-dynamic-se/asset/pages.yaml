    # HTTP request headers


    The request headers allow the servlets to perform a number of operations; here
    are a few of the most commonly used headers:


    +   * Accept-Charset: This header lists the character sets that are allowed to
    be used by the browser.


    +   * Accept-Encoding: This header is used to specify the encoding type to process
    the content. It suggests the encoding that the client can handle. The server can
    process this header by encoding the page with the formats specified by the client
    and sending the Content-Encoding response header to specify that it is applied.
    This header is useful when sending gzip or compress values.


    +   * Accept-Language: If the server can produce output in more than one language,
    then this header can be used to mention the client’s preferred language.


    +   * Authorization: This header can be used by the clients to identify themselves
    when they are accessing password-protected web pages.'
