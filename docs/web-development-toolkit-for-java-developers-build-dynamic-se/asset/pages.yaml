  md: '+   * Connection: This header is used to handle persistent HTTP connections,
    which means the client can retrieve multiple files with a single socket connection.
    This saves the overhead of several independent connections. With HTTP 1.1. onward,
    the connection is persistent by default; we must specify the close value to change
    it.


    +   * Content-Length: This header is used when user POST request, it gives the
    size of the POST data in bytes.


    +   * Cookie: This header returns the cookies to the servers that were previously
    sent to the client; instead of the header, we can use the request.getCookies()
    method, which gives the values directly; otherwise, in reading the header, we
    need to perform low-level parsing.


    +   * Host: This header specifies the host and port number as provided by the
    original URL; due to virtual hosting, it may happen that the server could not
    reply.


    +   * If-modified-since: This header is used to specify that the client wants
    the page only if the page is changed after the specified date. If the page is
    not modified, the server sends the status code of 304, which means “not modified”.
    This header is useful when the browser wants to reload the cache only when updated.
    Generally, servlets use the getLastModified method to retrieve the data automatically.


    +   * If-Unmodified-Since: This header specifies that the document should be retrieved
    if it is older than the specified date. Generally, the If-Modified-Header is used
    when we use the GET request, and If-Unmodified-Since is used when we use the PUT
    request.


    +   * Referer: This header stores the predecessor url from the request for the
    current page came in. For example, the user has opened the Google page link and
    searched for a particular content in Java; now, if the user opens any page from
    the search result list, the referrer page for the current page will be the URL
    of Google. This header is used to note the hierarchy of pages visited by the user.


    +   * User-Agent: This header is used to identify the browser or client used to
    request the server.'
