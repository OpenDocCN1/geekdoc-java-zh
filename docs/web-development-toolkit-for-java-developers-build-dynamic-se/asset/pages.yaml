  md: '# Extracting data from result set


    The SQL statements that read from a database query return the data in a result
    set. The java.sql.ResultSet interface represents the result set of a database
    query. A ResultSet object maintains a cursor that points to the current row in
    the result set. The term resultSet refers to row and column data contained in
    a ResultSet object. The methods of the ResultSet interface can be divided into
    three categories:


    +   - Navigational methods

    - Get methods

    - Update methods


    The cursor is movable based on the properties of the ResultSet. These properties
    are designated when the corresponding Statement that generates the ResultSet.
    JDBC provides the following connection methods to create statements with the desired
    ResultSet:


    ```

    createStatement(int RType, int RSConcurrency)

    prepareStatement(String SQL, int RType, int RSConcurrency)

    prepareCall(String sql, int RType, int RSConcurrency)

    ```


    In the first method, the first argument indicates the type of a ResultSet object,
    and the second argument is one of two ResultSet constants for specifying whether
    a result set is read-only ordatable. The possible RType are given as follows.
    If you do not specify any ResultSet type, you will automatically get one of TYPE_FORWARD_ONLY..


    | Type | Description |

    | ResultSet.TYPE_FORWARD_ONLY | The cursor can only move forward in the result
    set. |

    | ResultSet.TYPE_SCROLL_INSENSITIVE | The cursor can scroll forward and backward,
    and the result set is not influenced by the changes occurred in the database after
    the result set was created. |

    | ResultSet.TYPE_SCROLL_SENSITIVE | The cursor can scroll forward and backward,
    and the result set is influenced by the changes occurred in the database after
    the result set was created.. |


    Table 2.3: Types of ResultSet'
