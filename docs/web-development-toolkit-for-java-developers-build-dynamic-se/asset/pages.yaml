    # SQL tags


    The JSP Standard Tag Library (JSTL) adds essential features to JSP that enable
    JSP programming without the need for embedded Java code. It is a collection of
    standard JSP tags that perform several common tasks. This frees us from having
    to develop custom tags for these tasks, or from using a mix of tags from several
    organizations to do our work.


    The SQL JSTL contains tags for interacting with relational databases. This can
    be, for instance, MySQL, PostgreSQL, Oracle or Microsoft SQL server. The SQL JSTL
    tags are designed for lightweight web application concerning database access.
    Writing queries using SQL is easy, but complex queries are more flexible through
    database access, for example JDBC.


    Before using the SQL JSTL, the following directive needs to be added to the JSP
    page: `<@ taglib prefix="sql" uri="http://java.sun.com/jsp/jstl/sql" %>`


    # setDataSource tag


    The **setDataSource** provides a DataSource for connecting to a database used
    by all actions in the SQL tag library. The syntax is as follows:


    ```

    <setDataSource [var=variable name]>

    [scope="page|request|session|application"]

    [driver="JDBC driver"]

    [url="JDBC URL for database"]

    [user="Username to connect to the database"]

    ```'
  merge: -1
  pgno: 346
- img_proc: true
  md: '[password="Password to connect to the database"]

    [dataSource="DataSource"]


    # Attribute:


    +   - var: Variable that contains the specified DataSource

    - scope: Scope of the variable specified in the var attribute; it can be page,
    request, session, or application

    - driver: JDBC driver class name

    - url: JDBC URL for database

    - user: Username to connect to the database

    - password: Password to connect to the database

    - dataSource: The DataSource for the database to be accessed


    Example:


    ```

    <sql:setDataSource

    var="dataSource"

    driver="org.acme.sql.driver"

    url="jdbc:mssql://localhost/tempDB"

    user="Dan"

    password="pwd"/>

    ```


    # sql:query tag


    The <sql:query> executes an SQL query statement. It’s possible to pass strings
    of SQL to the tag either through body content or using an SQL attribute.


    The syntax is as follows:


    ```

    <sql:query var="variable name"

    [scope="page|request|session|application"]

    [sql="SQL query statement"]\n[startRow="starting row"]\n[maxRows="maximum number
    of rows"]\n[dataSource="DataSource"]

    ```


    JSP body (Instead of using the SQL attribute, the SQL query statement can be entered
    here):


    ```

    </sql:query>

    ```'
