  md: '+   - What if you need complex reasoning just to determine the type of data
    that applies to the current situation?


    +     - JSP is poor at this type of business logic.


    +   - The solution is to use both servlets and JSP.


    +   - In this approach, known as the Model View Controller (MVC) or Model 2 architecture,
    you let each technology concentrate on what it excels at.


    +     - The original request is handled by a servlet.


    +     - The servlet invokes the business-logic and data-access code and creates
    beans to represent the results (that''s the model).


    +     - Then, the servlet decides which JSP page is appropriate to present those
    results and forwards the request there (the JSP page is the view).


    +     - The servlet decides what business logic code applies and which JSP page
    present the results (the servlet is the controller).


    # MVC frameworks


    The key motivation behind the MVC approach is the desire to separate the code
    that creates and manipulates the data from the code that presents the data. The
    basic tools needed to implement this presentation-layer separation are standard
    in the servlet API. However, in very complex applications, a more elaborate MVC
    framework is beneficial. The most popular of these frameworks is Apache Struts.
    Although Struts is useful and widely used, you should not feel that you must use
    Struts in order to apply the MVC approach. For simple and moderately complex applications,
    implementing MVC from scratch with RequestDispatcher is straightforward and flexible.


    # Implementing MVC with servlets and JSP


    The most important point about MVC is the idea of separating the business logic
    and data access layers from the presentation layer. To implement the MVC pattern,
    we use servlets, JSP and Java bean class. The role of the model is performed by
    bean class, the role of the controller is performed by servlet, and the role of
    the presentation layer is performed by JSP page.


    The following steps are performed to achieve the MVC pattern.


    +   - List of steps to implement the MVC pattern.


    +     - Create beans to handle the data


    +     - Use a servlet to listen to and process the requests'
