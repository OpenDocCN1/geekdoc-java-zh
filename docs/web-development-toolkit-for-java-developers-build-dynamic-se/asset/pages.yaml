  md: '# Project preparation and environment setup


    Numerous configurations, libraries, and setups are required for developing new
    JSF applications. Since they are already included with any Java EE compliant application
    server, the JSF libraries (that is, API and implementation) exist solely during
    compilation phase. On the contrary, JSF libraries must be included in the project
    class-path for servlets containers like Jetty and Tomcat, which results in a portability
    problem. The following configurations need to be in Web.xml file:


    +   - JSF Servlets

    - Map JSF pages

    - Encoding servlets to solve encoding issues (in the case of Tomcat and Jetty)

    - Set project mode

    - Set JSF time zone to system time zone

    - Handle view expired exception by setting the compatibility mode


    Beans.xml must add CDI support and CDI API and implementation to the project-class
    path in case of servlet containers.


    # Pages prototype and design


    When traditional desktop and outdated web apps were still being developed, it
    was simple for business analysts to create application prototypes using any modelling
    tool, such as Microsoft Visio. The emergence of new web design and user experience
    trends like responsive, lightweight, flat, and metro designs has significantly
    altered this though. Since UI designs have evolved into one of the determining
    factors of awarding criteria in many software projects, these trends have made
    it necessary to create a comprehensive application prototype in the early stages
    of projects, sometimes evens before awarding.


    In JSF applications, this can be done in one of three ways:


    +   - JSF components and themes: The simplest method for implementing the prototype
