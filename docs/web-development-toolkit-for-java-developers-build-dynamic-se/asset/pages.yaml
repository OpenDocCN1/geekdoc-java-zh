  md: '# Web service interoperability


    Web services typically operate without on a variety of platforms, apps, and coding
    languages. One of the main objectives of web services is interoperability. Although
    they can help, web service standards cannot guarantee interoperability. To achieve
    complete interoperability, a number of challenges and considerations must be handled.
    A web service has a wide range of potential clients and providers. Other services
    may end up as clients of other services. The success of the service depends on
    enabling clients based on various implementations of the standards to communicate
    with it. Here, we''ll create basic mathematical operations like addition and subtraction
    using **JSimpCalcWebService**, a Java web service. The process for calling these
    web service methods through the **JSimpimpCalcWebServiceSite** ASP.net application
    will then be examined. We need to use two IDEs to construct the distinct applications.
    In this example, the asp.net client calls the Java web service.


    # Creating web service using Java


    Basic steps for creating a service are listed as follows:


    +   - Select a new project of type web application

    - Create a new web service and add operations and implement them

    - Deploy and test the web service


    **Select a new project of type web application**


    +   - In Netbeans IDE, select the **New Project** under **File** menu. The **New
    Project** wizard opens.

    - In the categories, select **Web** and **Web application** from project section
    and then press the **Next** button.'
