  md: '# x:out tag


    The <x:out> tag is used to output the result of an expression. It functions like
    the <% ... => JSP syntax. The syntax is as follows:


    <x:out select="XPath expression" escapeXml="true|false" /> /


    Attribute:


    +   - select: The XPath expression to be evaluated; the result of the expression
    is output to the page


    +   - escapeXml: Determines whether the <, >, " and '' characters in the resultant
    string should be converted to their corresponding character entity codes


    Example:


    ```

    <x:forEach select="$doc/customers/customer" >

    <x:out select="firstName" />

    </x:forEach>

    ```


    # x:parse tag


    The <x:parse> tag is used to parse XML data specified either via an attribute
    or in the tag body. The syntax is as follows:


    ```

    <x:parse [var="variable name"]

    [varDom="variable name"]

    [scope="page|request|session|application"]

    [scopeDom="page|request|session|application"]

    [doc="XML document"]

    [systemId="system identifier URI"]

    [filter="filter"]

    JSP body content

    </x:parse>

    ```


    Attribute:


    +   - var: A variable that contains the parsed XML data; the type of this data
    is implementation dependent; use this or varDom


    +   - varDom: Variable that contains the parsed XML data; the type of this data
    is org.w3c.dom.Document


    +   - scope: Scope of the variable specified in the var attribute; it can be page,
    request, session, or application, and defaults to page if not specified'
  merge: -1
  pgno: 352
- img_proc: true
  md: '+   - scopeDom: Scope of the variable specified in the varDom attribute; it
    can be the page, request, session, or application, and defaults to page if not
    specified


    +   - doc: XML document to be parsed


    +   - systemId: The system identifier URI for parsing the document


    +   - filter: The filter to be applied to the source document


    Example:


    ```

    <c:import url="customers.xml" var="xml" />

    <x:parse doc="${xml} var="doc" />

    ```


    # x:set tag


    The <x:set> tag sets a variable or a property to the value of an expression. The
    syntax is as follows:


    ```

    <x:set [var="variable name"]

    [value="expression"]

    [target="JavaBean or Map object name"]

    [property="target property name"]

    [scope="page|request|session|application"]

    JSP body

    </x:set>

    ```


    Attribute:


    +   - var: The variable that is set to the value of the expression


    +   - value: The expression to be evaluated


    +   - target: The target object (JavaBean or Map object) whose property is set


    +   - property: Name of the property to be set in the target attribute


    +   - scope: Scope of the variable specified in the var attribute; it can be page,
    request, session, or application


    Example:


    ```

    <x:set var="counter" value="${counter + 1}"/>

    ```


    # x:if tag


    The <x:if> tag evaluates a test condition. If it is true, it processes its body;
    else, the body is ignored.'
