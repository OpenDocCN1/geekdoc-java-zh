  md: '# Default values are displayed on the page


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_249_0.png)


    In JSP page, the values between the request is not preserved; the default value
    set is displayed.


    Here, we show that the value placed in page scope is not shared between the request;
    it is only available for the current request. As the default scope is page, skipping
    the scope attribute in the **jsp:useBean** will set the scope to page.


    # Sharing bean in Request scope


    A JSP object created using **request** scope can be accessed from any page that
    serves that request. More than one page can serve a single request. The JSP object
    will be bound to the **request** object. Implicit object request has the **request**
    scope.


    **Example 1:** In this example, we use the same bean class **MusicBean** with
    properties **musicgenre** and **artistname**. We create a JSP page to instantiate
    bean and access it in a request scope. The value of bean is preserved among the
    two pages: the main page and the intermediator included page; the value of bean
    is not preserved between multiple page requests. We use the same bean class listed
    earlier, so the code for it is not included here.


    +   a. Index page of application, **index.html**'
