  md: "# Using a custom scope\n\nWhen we create a new custom scope, we have to explicitly\
    \ inform the container; the **ConfigurableBeanFactory** interface provides a method\
    \ to register the new custom scope:\n\n```\nvoid registerScope(String scopeName,\
    \ Scope scope);\n```\n\nThe first argument is the name associated with a scope,\
    \ and the second argument is the instance of the custom scope that we want to\
    \ register and use. The following code is used to register the custom scope:\n\
    \n```\nScope customScope = new ThreadScope();\nbeanFactory.registerScope(thread,\
    \ scope);\n```\n\nWe can create bean definitions for the custom scope, as follows:\n\
    \n```\n<bean id=\"...\" class=\"...\" scope=\"thread\"/>\n```\n\nWe can register\
    \ the custom scope programmatically and also using declarative architecture, as\
    \ shown here:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"\
    http://www.springframework.org/schema/beans\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxmlns:aop=\"http://www.springframework.org/schema/aop\"\nsi:schemaLocation=\"\
    http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-2.0.xsd\n\
    http://www.springframework.org/schema/aop http://www.springframework.org/schema/aop/aop-2.0.xsd\"\
    >\n```\n\n```\n<bean class=\"org.springframework.beans.factory.config.CustomConfiguration\"\
    >\n  <property name=\"scopes\">\n    <map>\n      <entry key=\"thread\">\n   \
    \     <bean class=\"com.example.ThreadScope\"/>\n      </entry>\n    </map>\n\
    \  </property>\n</bean>\n\n<bean id=\"book\" class=\"com.example.Book\" scope=\"\
    thread\"/>\n```"
