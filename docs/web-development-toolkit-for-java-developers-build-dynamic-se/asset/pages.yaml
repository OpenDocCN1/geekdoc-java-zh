  md: "Here, we use the Scanner class of util package to input from console and assign\
    \ the values to the properties of a bean class using the setter methods. Later,\
    \ we retrieve the properties of a bean using the getter methods. Apart from parameterized\
    \ constructors, we can use setter methods to assign values to the properties of\
    \ a class. This is an example of using simple bean class to make a separate reusable\
    \ component in a Java application.\n\n# Advantages of using Java bean\n\nFollowing\
    \ are the advantages of using Java bean:\n\n+   Although it is true that beans\
    \ are merely Java classes that are written in a standard format, there are several\
    \ advantages to their use.\n\n+   With beans in general, visual manipulation tools\
    \ and other programs can automatically discover information about classes that\
    \ follow this format, and can create and manipulate the classes without the user\
    \ having to explicitly write any code.\n\n+   In JSP in particular, of JavaBeans\
    \ components provides three advantages over scriptlets and JSP expressions that\
    \ refer to normal Java classes:\n    - No Java syntax\n    - Simpler object sharing\n\
    \    - Convenient correspondence between request parameters and object properties\n\
    \n+   A software component architecture provides standard mechanisms to deal with\
    \ software building blocks. The following list enumerates some of the specific\
    \ benefits that Java technology provides for a component developer:\n    - A Bean\
    \ obtains all the benefits of Java's write-once, run- anywhere paradigm.\n   \
    \ - The properties, events, and methods of a Bean that are exposed to an application\
    \ builder tool can be controlled.\n    - A Bean may be designed to operate correctly\
    \ in different locales, which makes it useful in global markets.\n    - Auxiliary\
    \ software can be provided to help a person configure a Bean. This software is\
    \ only needed when the design-time parameters for that component are being set.\
    \ It does not need to be included in the runtime environment.\n    - The configuration\
    \ settings of a Bean can be saved in persistent storage and restored later."
