    # Data sharing in request scope


    With request-based sharing, the servlet stores the beans in the HttpServletRequest,
    where they are accessible only to the destination JSP page.


    +   - Servlet

    Object value = new ValueObject(...);

    request.setAttribute("key", value); RequestDispatcher dispatcher = request.getRequestDispatcher("/WEB-INF/Page.jsp");
    dispatcher.forward(request, response);


    +   - JSP Page

    <jsp:bean id="key" type="somePackage.ValueObject" scope="request" />

    <jsp:getProperty name="key" property="someProperty" />


    # Data sharing in session scope


    With session-based sharing, the servlet stores the beans in the HttpSession, where
    they are accessible to the same client in the destination JSP page or in other
    pages.


    +   - Servlet

    Object value = new ValueObject(...);

    HttpSession session = request.getSession();

    session.setAttribute("key", value);

    RequestDispatcher dispatcher = request.getRequestDispatcher("/WEB-INF/Page.jsp");nddispatcher.forward(request,
    response);'
