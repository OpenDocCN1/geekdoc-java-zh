    ] where Jazz is one of the music genres. It will give you the value as origin\
    \ of Jazz music, that is, African-American.\n\nExample 1: In this example, we\
    \ are sharing the objects in different scopes from a servlet and accessing them\
    \ in a JSP page using the expression language syntax for scoped variables.\n\n\
