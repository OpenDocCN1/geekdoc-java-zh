    # # Objectives


    After studying this chapter, you should be able to understand the concept of properties
    file; use properties file in program code; perform batch transactions; apply commit,
    rollback and generate save points; and perform all operations on transactions.


    # # Introduction to properties file


    The java.util.Properties class represents a persistent set of properties properties
    object contains key and value pair as a string. The Properties class is the subclass
    of Hashtable. It can be used to get property value based on the property key.


    The main advantage of using properties file is that if any information is changed
    from the file, we don''t need to recompile the Java class. It is used to store
    information that is to be changed frequently.


    # # Constructors and methods of properties class


    The Properties class provides methods to get data from properties file and store
    data into properties file. Moreover, it can be used to get the properties of application
    currently executing Properties defines an instance variable, which holds a default
    property list associated with a Properties object.


    +   Constructors: The following listed constructors are invoked to instantiate
    the properties object:


    +   Properties(): This creates a Properties object that has no default values.


    +   Properties(Properties propDefault): This creates an object that uses propDefault
    for its default value.'
