  md: '+   Based on the essential Spring capabilities, Spring includes an MVC application
    framework. This framework offers several views, including JSP, velocity, and tiles.


    # Spring introduction


    Spring is used to develop applications that can support transaction management,
    web services, mailing facilities, and persistence database operations, and perform
    all routine tasks with minimum configurations.


    # Spring architecture


    There are seven different modules that are well-organized and form the Spring
    architecture:


    +   Spring AOP: This layer offers the Declarative enterprise services like EJB
    declarative services. It manages the Declarative transaction management, which
    expands on Spring''s transaction abstraction.


    +   Spring ORM: This layer offers access to databases. For well-known objectrelational
    mapping APIs like JDO, Hibernate, and Ibatis, it offers integration layers.


    +   Spring Web: This layer offers the Spring web application development stack,
    which contains Spring MVC, and includes the Spring Web module.


    +   Spring DAO: This layer offers data access support to standardize the data
    access work that uses JDBC, Hibernate, or JDO.


    +   Spring Context: This layer offers support for message sources, the observer
    design pattern, and the capability for application objects to access resources
    using a unified API; this package expands upon the beans package.


    +   Spring Web MVC: This layer provides the MVC implementations for web applications.


    +   Spring Core: This layer provides the basic and important functionalities.


    The characteristics of dependency injection are provided by this component. BeanFactory
    offers a factory that isolates your actual programme logic from dependencies like
    object initialization, creation, and access.


    The following diagram represents the components that forms the framework:'
