  md: '# URL encoding


    By default, servlet containers (engines) use cookies as the underlying mechanism
    for session tracking. We can use URL rewriting instead. The core session tracking
    code does not need to change at all, but lots of other code has to change. In
    particular, if any of your pages contain links that redirect to your own site,
    you have to explicitly add the session data to the URL. Now, the servlet API provides
    methods to add this information to whatever you specify. The problem is that you
    must call all these methods; it is not technically feasible for the system to
    examine the output of all of your servlets and JSP pages, figure out which parts
    contain hyperlinks to your site, and modify them. You must tell it URLs to modify.
    This requirement means you cannot have static HTML pages if you use URL rewriting
    for session tracking, or at least you cannot have static HTML pages that refer
    to your own site. This is a significant burden in many applications but the worth
    in it is few.


    If you use URL rewriting for session tracking, most or all your pages will have
    to be dynamically generated. You cannot have any static HTML pages that contain
    hyperlinks to dynamic pages at your site. There are two possible situations in
    you may use URLs that refer to your own site.


    The first one is where the URLs are embedded in the web page that generates. These
    URLs should be passed through the encodeURL method of HttpServletResponse. The
    method determines whether URL rewriting is currently in use and appends the session
    information only if necessary. The URL is returned unchanged otherwise.


    Here''s an example:


    We can use encodeRedirect method to get the URL of our own site when we are using
    sendRedirect.call String originalURL = someURL;


    ```

    String encodedURL = response.encodeRedirectURL(originalURL);

    response.sendRedirect(encodedURL);

    ```


    If you think there is a reasonable likelihood that your web application will eventually
    use URL rewriting instead of cookies, it is good practice to plan ahead and encode
    URLs that reference your own site.'
