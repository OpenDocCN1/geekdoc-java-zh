  md: '# The beans


    ```

    <import resource="resources/messageSource.xml"

    <import resource="/resources/themeSource.xml"

    <bean id="bean1" class="..."/>

    <bean id="bean2" class="..."/>

    </beans>

    ```


    The beans are handled by the container, and they are identified by ID or name
    attribute, as shown here:


    ```

    <bean id="bookBean" class="examples.BookBean"/>

    <bean name="libraryBean" class="examples.ExampleLibraryBean"/>

    ```


    # Using the container


    The Bean methods can be used in XML format:


    ```

    BeanFactory factory = new XmlBeanFactory(is);

    InputStream factory = new FileInputStream("beans.xml");

    ```


    Following methods are provided by the interface to manage the beans:


    ```

    boolean containsBean(String)

    Object getBean(String)

    Object getBean(String, Class)

    class getType(String name)

    boolean isSingleton(String)

    String[] getAliases(String)

    ```


    The first method returns Bean values based on the occurrence of the bean present
    in BeanFactory. The second method returns bean on the occurrence of the bean or
    throws an exception. The third method returns a bean or throws an exception when
    the casting of bean fails. The fourth method returns the bean class or throws
    an exception. The fifth method returns Bean value when the bean is mapped in the
    singleton scope or throws an exception. The sixth method returns the alias name
    for the given bean.


