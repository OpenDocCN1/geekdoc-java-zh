  md: '# Overview of session tracking


    HTTP is a stateless protocol: each time a client retrieves a web page, the client
    opens a separate connection to the web server, and the server does not automatically
    maintain contextual information about the client. Even with servers that support
    persistent (keep-alive) HTTP connections and keep sockets open for multiple requests
    that occur in rapid succession, there is no built-in support for maintaining contextual
    information. This lack of context causes several difficulties. For example, when
    clients at an online store add an item to their shopping carts, how does the server
    know what''s already in the carts? Similarly, when clients decide to proceed to
    checkout, how can the server determine which previously created shopping carts
    are theirs? These questions seem very simple, yet, because of the inadequacies
    of HTTP, answering them is surprisingly complicated.


    There are three typical solutions to: manage the stateless properties of the protocol.
    cookies, URL rewriting, and hidden forms. The following subsections quickly summarize
    what would be required if you had implement session tracking yourself (without
    using the built-in session-tracking API) for each of the three ways.


    # Cookies


    You can use cookies to store an ID for a shopping session; with each subsequent
    connection, you can look up the current session ID and use it to extract information
    about that session from a lookup table on the server machine. So, there would
    really be two tables: one that associates session IDs with user tables, and the
    user tables themselves use user-specific data. For example, on the initial request,
    a servlet could do something like the following:


    ```

    String sessionID = makeUniqueString();

    HashMap sessionInfo = new HashMap();

    HashMap globalTable = findTableStoringSessions();

    globalTable.put(sessionID

    ```


    In later requests, the server could use the globalTable hash table to associate
    a session ID from the JSESSIONID cookie with the sessionInfo hash table of user-specific
    data.


    Using cookies in this manner is an excellent solution and is the most widely used
    approach for session handling. Still, it is nice that servlets have a higher-level
    API that handles all this and the following tedious tasks:'
  merge: -1
  pgno: 146
- img_proc: true
  md: '120 Web Development Toolkit for Java Developers


    +   - Extracting the cookie that stores the session identifier from the other
    cookies

    - Determining when idle sessions have expired and reclaiming them

    - Associating the hash tables with each request

    - Generating the unique session identifiers


    # # URL rewriting


    With this approach, the client appends extra data on the end of each URL. That
    identifies the session, and the server associates that identifier with user-specific
    data it has stored. For example, with `http://host/path.html;jsessionid=s123`,
    the session is attached as `jsessionid=s123`, so s123 is the ID that uniquely
    identifies the table of data associated with that user.


    URL rewriting is a moderately good solution for session tracking and also has
    the advantage that it works when browsers do not support cookies or when the user
    has disabled them. However, if implement session tracking yourself, URL rewriting
    has the same drawback as cookies, the server-side program has a lot of straightforward
    but tedious process to do. Even with a high-level API that handles most of the
    details for you, you must be careful that every URL that references your site
    is returned to the user (even by indirect means that location fields in server
    redirects) has the extra information appended. This restriction you cannot have
    any static HTML pages on your site (at least not any links back to dynamic pages
    at the site). So, every page must be dynamically generated with servlets or JSP.
    Even when all the pages are dynamically generated, if the user leaves the session
    and comes back via a bookmark or link, the session information can be lost because
    the store link contains the wrong identifying information.


    # # Hidden form fields


    HTML forms can have an entry that looks as follows:


    ```

