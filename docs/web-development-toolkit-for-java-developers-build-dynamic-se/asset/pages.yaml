    # c:catch tag


    The c:catch tag acts like the try/catch construct in Java, except that in the
    case of c:catch, there is no try. If you surround part of the page that may throw
    an exception with the c:catch tag and an exception occurs, the page will still
    render up until the point where the exception occurred and then continue rendering
    from the c:catch end tag on.


    You can store the thrown exception in a page scope specified by the optional var
    attribute. The c:catch tag should be used only for debugging or experimentation.
    Exception handling should be part of the business logic code generally using core
    Java, not in the JSP page.'
