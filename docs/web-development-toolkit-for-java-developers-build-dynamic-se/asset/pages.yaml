  md: '# Session tracking in servlets


    The HttpSession API provides a very good way of session tracking with a high lever
    interface that is built on the top of cookies or URL rewriting. Most servers have
    support for session tracking with cookies, and most of them can move to URL rewriting.
    Using the servlets will provide an easy way to manage session without explicitly
    manipulating cookies or the values that are appended to the URL. With servlets,
    different scopes are provided to store the information regarding each session.


    Using session handling through servlets is very simple, and it has four basic
    steps:


    +   * Accessing the session object associated with the current request. request.getSession
    to get an HttpSession object, which is a simple hash table for storing user-specific
    data.


    +   * Looking up information associated with a session. Call getAttribute on the
    HttpSession object, cast the return value to the appropriate type, and check whether
    the result is null.


    +   * Storing information in a session. Use setAttribute with a key and a value.


    +   * Discarding session data. Call removeAttribute to discard a specific value.
    Call invalidates to discard an entire session. Call logout to log the client out
    of the web server and invalidate all sessions associated with user.


    # Accessing the session object associated with the current request


    Sessions are of type HttpSession, but they are just hash tables that can store
    arbitrary user objects (each associated with a key). You look up the HttpSession
    object by calling the getSession method of HttpServletRequest, as follows:

    HttpSession session = request.getSession();


    The working of session tracking fetches the user ID from a cookie or attached
    URL data, and then the ID is used as a key to find the user in the previously
    created HttpSession objects. This is done by invoking the getSession method. If
    no session is found in an incoming cookie or attached URL information, and if
    cookies are being used (the default situation), the system creates a new empty
    session. The system also creates an outgoing cookie named JSESSIONID with a unique
    value representing the session ID. So, although you call getSession on the request,
    the call can affect the response. Consequently, you are permitted to call request.getSession
    only when it would be legal to set HTTP response headers: before any document
    content has been sent (that is, flushed or committed) to the client.'
