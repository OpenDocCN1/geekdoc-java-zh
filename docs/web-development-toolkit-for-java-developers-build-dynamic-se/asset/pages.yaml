  md: '# Handling Beans and Using Expression Language


    Instead of using jsp:getProperty, you could use a JSP expression and explicitly
    call a method on the object with the variable name specified by the id attribute.


    For example, assuming that the Book class is a String property called title and
    that you''ve created an instance called book1 using the jsp:bean example given
    earlier in this section, you could insert the value of the title property into
    the JSP page in either of the following two ways:


    ```

    <jsp:getProperty name="s1" property="id" />

    <% s1.getId() %>

    ```


    # Assigning values to beans


    To modify properties, you normally use jsp:setProperty. This action has several
    forms, but with the simplest form, you supply three attributes: name (which should
    match the ID given by jsp:bean), property (the name of the property to change),
    and value (the new value).


    An alternative to the jsp:setProperty action is to use a scriptlet that explicitly
    calls methods on the bean object. For example, given the book1 object shown earlier
    in this section, you could use either of the following two forms to modify the
    property:


    ```

    <jsp:setProperty name="s1" property="program" value="MSCIT" />

    <% s1.setTitle("MSCIT") %>

    ```


