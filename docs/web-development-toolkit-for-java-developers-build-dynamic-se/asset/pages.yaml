    # Annotations


    Annotations provide extra information about the program; annotation is a form
    of metadata that can be provided at class and method level. It is not part of
    program logic, but it provides important information regarding configuration,
    data management, and so on from the program. Following is the list of most common
    annotations in the spring boot:


    | | |

    |---||

    | 1 | @Required: It is applied on the method specially the setter, method, indicating
    that the bean value must be retrieved at the time of configuration, otherwise
    it throws an exception. |

    | 2 | @Autowired: This annotation can be applied to the setter method, variable
    and constructor. It looks for a similar datatype and matches the field. |

    | 3 | @Configuration: It is applied to the class that is used as a source of a
    bean definition. |

    | 4 | @ComponentScan: It is used to scan a package for beans. We can specify the
    current and base package to scan for Spring Components. |

    | 5 | @Bean: It is used at the method level and is used as a substitute for XML
    bean tag to create a bean. |

    | 6 | @Component: It is a class-level annotation. When this annotation is found
    in the classpath, the framework finds it and configures in the application context
    as Spring Bean. |

    | 7 | @Controller: It is a class-level annotation. It is used to handle web requests
    and map them using the control string, which suggests route to redirect. |

    | 8 | @Service: It is used to indicate the class that applies the business logic.
    |

    | 9 | @Repository: It is applied to class to hold the Data Access Object to perform
    all operations related to the database. |

    | 10 | @EnableAutoConfiguration: The bean that is present in the classpath is
    configured automatically and it also configure to run the methods. |'
