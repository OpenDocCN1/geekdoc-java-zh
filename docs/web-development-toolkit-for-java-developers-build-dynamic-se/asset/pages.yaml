  md: '# Objectives


    After studying this chapter, you should be able to understand the concept of Java
    server pages. You should also gain the knowledge of JSP tags and its applications
    and be able to perform basic web page design using JSP.


    # Java Server Pages


    Java Server Pages (JSP) technology enables you to mix regular, static HTML with
    dynamically generated content. You simply write the regular HTML in the normal
    manner, using webpage-building tools. In servlets, we write HTML inside Java,
    and in JSP, we write Java inside HTML. JSP pages are translated into servlets,
    the servlets are compiled, and it is the compiled servlets that execute at request
    time. So, writing JSP is just another way of writing servlets.


    Servlets are convenient and efficient to execute. They can customize their behavior
    based on cookies, track user-specific data with the session-tracking API and talk
    to relational databases with JDBC. But Servlets are not good in writing a lot
    of HTML as one cannot use standard HTML tools, so it is difficult for non-Java
    developers to write code.


    # JSP life cycle


    JSP pages follow these phases:


    +   * Translation of JSP page

    * Compilation of JSP page

    * Class loading (class file is loaded by the classloader)

    * Instantiation (object of the generated servlet is created)

    * Initialization (the jspInit() method is invoked by the container)

    * Request processing (the _jspService() method is invoked by the container)

    * Destroy (the jspDestroy() method is invoked by the container)'
