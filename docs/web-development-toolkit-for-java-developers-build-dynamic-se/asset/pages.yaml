  md: '# Objectives


    After studying this chapter, you should be able to understand the role of servlet
    in web programming, know and implement various phases of execution of a servlet,
    and manage client- and server-side data using HTTP headers.


    # Basics of the servlet


    Initially, when web pages were developed, they were static in nature, meaning
    the pages were developed first and deployed; they were merely for the purpose
    of reading, and user activities had no effect on the design or development of
    web pages. Then came the era of dynamic pages, where the pages need to be generated
    ahead of time; they are now generated on requests given by users, so the response
    is generated based on the request given by the client. In this chapter, we will
    look at how these pages can be developed using servlets.


    Servlet is a special Java program that is used to handle and process the client
    request, prepare the response, and send it back to the client, as illustrated
    in Figure 5.1:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_109_0.png)


    Figure 5.1: Client-Server Communication in a web-based application


    # Role of servlets


    The servlet is used to perform the following tasks:


    +   - Read the request that is sent by the client and handle it; the request is
    sent as a form.

    - Read the data sent as content in a form and HTTP headers.

    - Handle the request and generate the desired output as response data, which may
    require the use of database, beans, web services, etc.

    - Apart from response data, send the header data, which may include header information.'
