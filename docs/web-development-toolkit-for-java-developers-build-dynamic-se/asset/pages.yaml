    # Key terms


    +   - Services: They are self-contained modules that can be used by one or more
    published interfaces.

    - Service provider: It implements a service specification.

    - Service consumer: It requests to call a service provider. A service consumer
    can be another service or an end user application.

    - Service locator: It acts as a registry and is responsible for examining service
    provider interfaces and service locations.

    - Service broker: It is a service provider that pass service requests to one or
    more additional service providers.


