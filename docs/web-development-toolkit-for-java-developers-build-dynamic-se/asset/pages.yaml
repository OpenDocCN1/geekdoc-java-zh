  md: 'are normally based on in-memory cookies, not persistent cookies, so there is
    no expiration date. Even if you intercepted the JSESSIONID cookie and sent it
    out with an expiration date, browser sessions and server sessions are two distinct
    things.


    # Types of sessions


    By default, session tracking is based on cookies that are stored in the browser''s
    memory, not written to disk. Thus, unless the server explicitly reads the incoming
    JSESSIONID cookie, sets the maximum age and path, and sends it back out, the browser
    results in the session broken: the client will not be able to access the session
    again. The problem, however, is that the server does not know that the browser
    was closed and thus, it has to maintain the session in memory until the inactive
    interval has been exceeded.


    Consider a physical shopping trip to a Walmart store. You browse around and put
    items in a physical shopping cart, leave shopping cart at the end of an aisle
    while you look for another item. A clerk walks up and sees the shopping cart.
    Can they resolve the items in it? No—you are probably still shopping and will
    come back for the soon. What if you realize you have lost your wallet, so you
    get in your car and drive home? Can the clerk resolve the items in your shopping
    cart now? Again, no—the clerk presumably does not know that you have left the
    store. So, what can the clerk do? They can keep an eye on the card, and nobody
    has touched it for some time, then they can conclude that it is abandoned and
    take the items out of it. The only exception is if you brought the cart to him
    and said, "I''m sorry, I left my wallet at home, so I have to leave.


    The analogous session in the servlet world is one in which the server is trying
    to decide whether it can throw away your HttpSession object. Because you are not
    currently using the session does not mean the server can throw it away. Maybe
    you will be back (submit a new request) soon? If you quit your browser, causing
    the browser-session cookies to be lost, the session is effectively broken. But,
    as with of getting in your car and leaving Walmart, the server must wait for some
    time to see if the session has been abandoned. Sessions automatically become inactive
    when the time between client accesses exceeds the interval specified by `setMaxInactiveInterval`.
    When this happens, objects stored in the HttpSession object are removed (unbound).
    Then, if objects implement the `HttpSessionListener` interface, they are automatically
    notified. The only exception to the server waits until session timeout rule is
    invalid or logout is called. This is akin to explicitly telling the Walmart clerk
    that you are leaving, so the server can immediately remove all the items from
    the session and destroy the session object.'
