  md: '# fmt:message


    The **fmt:message>** tag displays a localized message. The body can contain a
    nested **fmt:param** tag to pass parameterized values to the message.


    The syntax is as follows:


    ```

    <fmt:message [key="message key"]

    [bundle="localization bundle where key is looked up"]

    [var="variable that stores localized message"]

    [scope="page|request|session|application"]

    JSP body

    </fmt:message>

    ```


    # Attribute


    +   - **key**: The message key corresponding to the message

    - **bundle**: The localization context in which the message key is looked up

    - **var**: The variable that stores the localized message

    - **scope**: The scope of the **var** variable; it is an optional attribute and
    can be page, request, session, or application


    Example:


    ```

    <fmt:bundlebasename="mess.messages">

    <fmt:message key="key.welcome"/><br/>

    <fmt:message key="key.description"/>

    </fmt:bundle>

    ```


    # fmt:requestEncoding


    The **fmt:requestEncoding>** tag is used to specify the character encoding of
    the request and to decode the incoming forms data entered by the user. It is used
    if the encoding used is different from the ISO-8859-1.


    The syntax is as follows:


    ```

    <fmt:requestEncoding [value="character encoding name"] />

    ```


    # Attribute


    **value**: The name of the character encoding for the request. Examples of request
    encodings include UTF-8 and ISO-8859-1.


    Example:


    ```

    <fmt:requestEncoding value="UTF-8"/>

    ```'
