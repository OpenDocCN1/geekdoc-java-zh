    being removed implements HttpSessionBindingListener, its valueUnbound method is
    called.


    ```

    public void invalidate()

    ```


    This method invalidates the session and unbind all objects associated with it.
    Use this method with caution; remember that sessions are associated with users
    (that is, clients), not with individual servlets or JSP pages. So, if you invalidate
    a session, you might be destroying data that another servlet or JSP page is using:


    ```

    public void logout()

    ```


    This method logs the client out of the web server and invalidates all sessions
    associated with that client. The scope of logout is the same as the scope of authentication.
    For example, if the server implements single sign-on, calling logout logs the
    client out of all web applications on the server and invalidates all sessions
    (associated with the client:'
