  md: '+   With the **include** directive, the included file is permitted to contain
    JSP code, as such response header settings and field definitions that affect the
    main page.


    # # Forwarding requests with jsp:forward


    You use **jsp:include** to combine output from the main page and the auxiliary
    page. Instead, you can use **jsp:forward** to obtain the complete output from
    the auxiliary page. Using **jsp:forward**, you can select the view dynamically
    based on some conditions.


    **Example 1**: In this case, we have a login page, users username and password;
    if the username and password are valid, the view layer selected is **successe.jsp**
    if the username or password is invalid, the view layer selected is **error.jsp**.


    +   Login to enter the credentials **index.html**


