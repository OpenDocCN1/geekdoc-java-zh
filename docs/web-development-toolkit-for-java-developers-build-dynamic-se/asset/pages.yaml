  md: 'services are agnostic of language and platform. Developers of web services
    have access to several programming models that are divided into two groups, both
    of which are supported by the IDE. There are mainly two types of web services:


    +   - SOAP-based implementation


    +   - RESTful-based implementation


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_411_0.png)


    +   - SOAP/WSDL-based: Traditional web service models expose web service interfaces
    through URL-enabled WSDL documents, a kind of XML. The subsequent message exchange
    uses SOAP, a different XML document format.


    +   - REST-based: Web services can now be created and communicated using REpresentational
    State Transfer. Resources in REST have URIs and can be modified via HTTP header
    actions.


    # SOAP-based web services


    It is a web service access protocol over the XML standard. A W3C recommendation
    for inter-application communication is SOAP. It is independent of both platforms
    and languages. You can communicate with other programming language applications
    by utilizing SOAP. Java utilities use Java code in the web service to generate
    a WSDL file for SOAP-based web services. The WSDL is available online and is used
    by who want to use the service using a client. The format of the messages is SOAP.
    Particularly in terms of security, the variety of actions that can be passed in
    SOAP is wider than what is accessible in REST. Heavyweight applications that use
    complex operations and applications needing advanced security, reliability, or
    other WS-* standards-supported characteristics use SOAP-based web services. When
    a transport protocol other than HTTP must be used, SOAP and REST are also appropriate.
    Numerous web services provided by Amazon, notably'
  merge: -1
