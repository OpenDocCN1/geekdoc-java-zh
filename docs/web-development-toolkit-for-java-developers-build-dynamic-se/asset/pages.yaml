    # Introduction


    This chapter gives basic knowledge of how to use the Spring framework so that
    one can understand and use the framework to its best. It is important to understand
    the spring architecture and its directory structure to start working with the
    spring application, and this chapter gives a brief introduction to it. The other
    significant concepts include dependency injection, creating and understanding
    bean and bean scopes, applying validation, and performing internationalization.


    # Structure


    In this chapter, the following topics will be covered:


    +   - Software framework

    - Spring introduction

