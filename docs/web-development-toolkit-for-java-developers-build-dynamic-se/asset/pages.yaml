    unlike switch, multiple expressions can be tested in the <c:when> tag; and like
    switch statement, if all options are wrong, the default value is selected using
    the <c:otherwise> tag.


    # c:forEach and c:forTokens tags


    The <c:forEach> tag in JSTL is used for executing the same set of statements for
    a finite number of times. It''s similar to the for, while, and do-while loop in
    Java. This is used when we need to perform and execute a set of statements again
    and again for a specified number of times. The <c:forEach> tag has the following
    attributes:


    | Attribute | Description |

    |---|---|

    | items | Information to loop over |

    | begin | Element to start with (0 = first item, 1 = second item, ...) |

    | end | Element to end with (0 = first item, 1 = second item, ...) |

    | step | Process every step items |

    | var | Name of the variable to expose the current item |

    | varStatus | Name of the variable to expose the loop status |


    Table 10.6: Attributes of <c:forEach> tag'
