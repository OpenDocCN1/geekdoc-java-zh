  md: '# Spring boot starters


    Spring Boot comes with a number of starters that are used to add JAR files in
    the classpath. The built-in starters make the development faster and easier. The
    Spring boot starter always begin with the keyword Spring-boot-starter, followed
    by the type of starter. For example, if we want to use Spring and JPA for database
    access, we can use the spring-boot-starter-data-jpa dependency in pom.xml file
    of the project.


    # External starters


    We can use external starters in our project. These external starters start with
    the name of the Project. For example, if the third-party project name is HelloWorld,
    then the dependency name will be Hello-spring-boot-starter.


    The org.springframework.boot group provides the starters; following is the list
    of the most common starters:


    +   - spring-boot-starter-thymeleaf: It gives a view layer using the thymeleaf
    views.

    - spring-boot-starter-data-couchbase: It allows us to use the couchbase database.

    - spring-boot-starter-artemis: It is used for JMS messaging.

    - spring-boot-starter-web-services: It is used for web services.

    - spring-boot-starter-mail: It is used to support email sending.

    - spring-boot-starter-data-redis: It is used to set Redis key-value data store.

    - spring-boot-starter-web: It is used for creating and RESTful applications using
    spring MVC. Generally, it uses Tomcat as the default embedded container.

    - spring-boot-starter-data-gemfire: It is used to GemFire distributed data store.

    - spring-boot-starter-activemq: It is used in JMS messaging using Apache ActiveMQ.

    - spring-boot-starter-data-elasticsearch: It is used in search and analytics engine
    with Spring Data Elasticsearch.

    - spring-boot-starter-integration: It is used for Spring integration.'
