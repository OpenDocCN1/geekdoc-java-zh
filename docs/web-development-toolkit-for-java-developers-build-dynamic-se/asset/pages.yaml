    # Bean definition inheritance


    A child bean can inherit the parent bean attribute values. We can use the parent
    attribute to indicate the parent value to be used in the child bean, as shown
    here:


    ```

    <bean id="inheritedTestBean" abstract="true" class="org.springframework.beans.TestBean">

    <property name="name" value="parent"/>

    <property name="age" value="50"/>

    </bean>

    ```


    ```

    <bean id="inheritsWithDifferentClass" class="org.springframework.beans.DerivedTestBean"
    parent="inheritedTestBean" init-method="initialize">

    <property name="name" value="override"/>

    </bean>

    ```


    The child bean must be compatible with the parent and accept the parent’s property
    values.


    The following code shows the use of parent child property values usage:


    ```

    <bean id="inheritedTestBeanWithoutClass" abstract="true">

    <property name="name" value="parent"/>

    <property name="age" value="50"/>

    </bean>

    ```


    ```

    <bean id="inheritsWithClass" class="org.springframework.beans.DerivedTestBean"
    parent="inheritedTestBeanWithoutClass" init-method="initialize">

    <property name="name" value="override"/>

    </bean>

    ```'
