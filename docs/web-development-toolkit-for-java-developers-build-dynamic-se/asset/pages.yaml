  md: '# Spring boot architecture


    There are different layers in the Spring boot architecture, and each layer communicates
    with the other layers. There are four layers in Spring boot, as follows:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_487_0.png)


    Figure 14.1: Spring boot architecture


    +   - Presentation layer: The presentation layer is the view layer that manages
    and authenticates the requests, translates the JSON parameter to an object, and
    transfers it to the business layer.


    +   - Business layer: The business layer is concerned with business logic authorization
    and validation. It consists of classes and services provided by data access layer.


    +   - Persistence layer: The persistence layer consists of data storage part,
    and manages and translates objects to from the database.


    +   - Database layer: In the database layer, the basic CRUD (create, retrieve,
    update, delete) operations are performed.


    # Creating projects


    There are different ways in which Spring boot applications can be created; the
    following section covers the most common approaches used to create Spring projects:


    +   - Spring Initializer is used to generate the directory structure of Spring
    boot application; it is a handy tool provided by Pivotal web service. It provides
    API for developing projects with metadata.


    +   - Spring Tool Suite is the IDE to develop Spring applications. It is an Eclipse-based
    development environment and provides a ready-to-use environment'
