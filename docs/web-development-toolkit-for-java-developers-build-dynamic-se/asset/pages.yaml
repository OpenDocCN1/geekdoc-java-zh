    which is replaced by short and easy syntax of expression language.


    # ## Retrieving Bean properties


    Using expression language, we can access the bean properties with very easy and
    short notation; the general syntax is as follows:

    \${object.propertyName}


    For example, we have a class MusicBean, with properties musicgenre and artistname.
    In a servlet, we create the object mbean and share it in the request scope with
    the keyname m; to access the object in the JSP page, we can simple write ${m.musicgenre}.
    Instead of expression language, if we use scriptlet, then we have to import package,
    create object, find the attribute, and then invoke the getter method for the required
    property. If we use jsp:bean, we then mention the scope from which we want to
    find the bean and then use jsp:getProperty to access the values; using expression
    language syntax makes it easy to work in a simple and compact way.


    When a bean has properties that point to another bean class, we can use the dot
    operator multiple times to access the last property:

    \${object.propertyObject.propertyName}


    Finally, note that the expression language lets you replace dot notation with
    array notation (square brackets).

    So, for example, you can replace the following:

    \${name.property} with ${name["property"]}


    The second form is rarely used with bean properties. However, it does have two
    advantages:


    +   - It lets compute the name of the property at request time. With the array
    notation, the value inside the brackets can itself be a variable; with dot notation
    the property name must be a literal value.


    +   - The array notation lets you use values that are illegal as property names.
    This is of no use when accessing bean properties, but it is very useful when accessing
    collections or request headers.'
