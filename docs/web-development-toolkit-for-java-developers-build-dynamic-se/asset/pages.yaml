    In general, primitive attributes merely have to be of type object (that is, they
    can be anything other than null or primitive like int, double, or boolean). However,
    some application servers support distributed web applications in which an application
    is shared across a cluster of servers. Session tracking needs to still work in
    such a case, the system needs to be able to move session objects from machine
    to machine. Thus, if you run in an environment and mark your web application as
    being distributable, we must implement the Serializable interface.


    # Discarding session data


    When you are done with a user''s session data, you have three options:


    +   - Remove only the data that your servlet created. You can call removeAttribute("key")
    to discard the value associated with the specified key. This is the most common
    approach.

    - Delete the whole session (in the current web application). You can call invalidate
    to discard an entire session. Just remember that doing so causes all of user''s
    session data to be lost, not the session data that your servlet or JSP page created.
    So, all the servlets and JSP pages in a web application have to agree on the cases
    for which invalidate may be called.

    - Log the user out and delete sessions belonging to them. Finally, in servers
    that support servlets 2.4 and JSP 2.0, you can call logout to log the client out
    of'
