  md: "# Attribute:\n\n+   * name: The name of the parameter\n* value: The value for\
    \ the parameter\n\nExample:\n\n```\n<x:transform xml=\"${doc}\" xslt=\"${stylesheet}\"\
    >\n  <param name=\"id\" value=\"${idvalue}\" />\n</x:transform>\n```\n\n# JSTL\
    \ functions\n\nThe JSP Standard Tag Library (JSTL) adds essential features to\
    \ JSP programming without the need for embedded Java code. It is a collection\
    \ of standard JSP tags that perform several common tasks. This frees us from having\
    \ to develop custom tags for these tasks, or from using a mix of tags from several\
    \ organizations to do our work.\n\nThe Function JSTL contains a number of string\
    \ manipulation functions. These include functions for splitting and concatenating\
    \ strings, returning substrings, and determining whether a string contains a specified\
    \ substring.\n\nBefore using the JSTL, the following directive needs to be added\
    \ to the JSP page:\n<%@ taglib prefix=\"fn\" uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ %>\n\nThe equivalent XML syntax used in tag files for this directive is as:\n\
    <jsp:directive.taglib prefix=\"fn\" uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ />\n\n# fn:contains() function\n\nThe fn:contains() function checks whether\
    \ the given string is present in the input as substring. It does a case-sensitive\
    \ check, which means it considers the case while checking for the substring.\n\
    \nSyntax:\n\n```\nboolean contains(String inputstring, String checkstring)\n```\n\
    \nThe return type of this function is boolean. It returns true when the checkstring\
    \ is present in inputstring, else it returns false. It has two string arguments\
    \ – first has input string and second argument has the string that needs to be\
    \ checked in input string."
