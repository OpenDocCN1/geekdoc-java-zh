    +   Next, you must present users with an interface that lists the open functions
    that the endpoint implementation class exposes.


    +   Using the classes where endpoint implementation is done and the wsgen tool,
    the linking of client and JAX-WS runtime is done.


    +   The server''s implementation of JAX-WS is provided by the wsgen utility in
    conjunction with the Application Server.


    The steps for creating the web service and client are as follows:


    +   Write the code for the implementation class and compile it.


    +   Use wsgen to generate the classes that are required to implement the service.


    +   Create a web archive by putting all the files into it.


    +   Install the WAR file.


    +   Write the code for the client.


    +   Use the wsimport tool for creating and compiling the web service artefacts
    needed to connect to the service.


    +   Compile and run the client.


    # Creating a web service


    In this section, we will create a project and then create a web service in it.


    # Choosing a container


    Either a web container or an EJB container can be used to deploy your web service.
    Your choice of implementation will determine this. Use a web container regardless
    of whether you are developing a Java EE application because you may include EJBs
    in an application. Create an application rather than an EJB module, for instance,
    if you intend to deploy to the Tomcat Web Server, which only has a web container.'
