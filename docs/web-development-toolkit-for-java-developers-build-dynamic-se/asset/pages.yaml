  md: '# Overview of JSP Standard Tag Library (JSTL) 349


    +   - E: Separates mantissa and exponent in scientific notation; need not be quoted

    in prefix or suffuffix


    +   - \; Separates positive and negative subpatterns


    +   - %: Multiply by 100 and show as percentage


    +   - u2030: Multiply by 1000 and show as per mille value


    +   - u00A4: Currency sign, replaced by currency symbol; replaced by

    international currency symbol if doubled; if present in a pattern, the monetary

    decessor separator is instead of the decimal separator


    +   - '''': To quote special characters in a prefix or suffix, for example, ''##

    formats 123 to #123; to create a single quote itself, use in two row: #

    ''oc''


    Example:


    ```

    <@page contentType="text/html" pageEncoding="UTF-8%">

    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    <%@ taglib prefix="fmt" uri="http://java.sun.com/jsp/jstl/fmt" %>

    <!DOCTYPE html>

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>formatTag</title>

    </head>

    <body>

    <c:set var="cost" value="234,234"/>

    <fmt:formatNumber type="number" minIntegerDigits="3" value="${cost}"/>

    Percent with maximum integer digits 2

    <fmt:formatNumber type="percent" minIntegerDigits="2" value="${cost}"/>

    Using pattern:

    <fmt:formatNumber type="number" pattern="#,##0" value="${cost}"/>

    Using variable and maximum integer digits 3 :

    <fmt:formatNumber type="number" minIntegerDigits="3" value="${cost}" var="value"
    scope="page"/>

    ${value}

    </body>

    </html>

    ```


