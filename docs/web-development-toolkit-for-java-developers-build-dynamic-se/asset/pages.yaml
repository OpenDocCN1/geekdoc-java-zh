    \ bookstore set price = price-? isbn_no = ?\">\n    <sql:param value=\"${price_reduction}\"\
    />\n    <sql:param value=\"${id}\"/>\n  </sql:update>\n</sql:transaction>\n```\n\
    \n# # XML tags\n\nThe **JSP Standard Tag Library (JSTL)** adds essential features\
    \ to JSP that enable programming without the embedded Java code. It is a collection\
    \ of JSP tags that perform several common tasks. This frees us from having to\
