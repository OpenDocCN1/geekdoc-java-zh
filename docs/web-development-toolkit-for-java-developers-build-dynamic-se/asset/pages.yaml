    # Using Implicit objects


    Implicit objects are the Java objects that make JSPContainer available to the
    developers in each page, and the developer can call them directly without explicitly
    declared. JSP Implicit Objects are also pre-defined variables. Using expression
    language, we can access the following implicit variables:


    +   *pageContext: The pageContext object refers to the PageContext of the current
    page. The PageContext class, in that, has request, response, session, out, and
    servletContext properties (i.e., getRequest, getResponse, getSession, getOut,
    and getServletContext methods). To access and display the current session ID,
    we can write the following code:


    +   *param paramValues: These allow us to access the request parameter value using
    param and the array of request values using paramValues. To read a request parameter,
    namely, firstName, we can write the code as follows:


    Current Session ID : ${pageContext.session.id}


    First Name : ${param.firstName}'
