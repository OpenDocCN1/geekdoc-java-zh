  md: '# CHAPTER 14

    Introduction to Spring Boot


    # Introduction


    Spring boot is a framework used to bootstrap and develop spring applications very
    easily and quickly. It provides annotation-based configuration default configuration
    to avoid lots of boilerplate code and configuration. It also provides the opinionated
    development approach to quick start applications. Spring boot takes less development
    and testing time compared to Spring framework, so it is mostly used when rapid
    application development is required.


    # Structure


    In this chapter, we will learn the following topics:


    +   - Basics of Spring boot

    - Creating a project

    - Annotations

    - Dependency management

    - Database connectivity'
