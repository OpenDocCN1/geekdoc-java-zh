    #  Spring boot application properties


    All application-specific configuration can be provided in the application properties
    Many properties have default value, many of them have Boolean values and many
    of them have specific values. We can define our own properties files as per our
    requirement. By specifying different properties, we can run the application in
    different environments. So, we use this file to configure the application by in-built
    properties; we can also customize it by defining our own properties. The following
    code shows the example of the application.properties file:


    ```

    #Set application name

    spring.application.name = firstApplication

    # set port number

    server.port = 8085

    ```


    Here, we are setting the application name and port number for the application;
    we use the # symbol for adding comments in the file.


    # YAML properties file


    Another way to configure the application properties is through the YML file. We
    can configure all the properties in the application.yml file and place it in the
    classpath.'
