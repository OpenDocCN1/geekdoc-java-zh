- img_proc: true
  md: 'Parameter names are case sensitive; consider the following example:


    ```

    request.getParameter("paramname1") and request.

    getParameter("paramName1") are not interchangeable.

    ```


    # Reading multiple values: getParameterValues


    When there are many parameters to be read from the form, we can use the

    getParameterValues method. It returns the array of all the values, instead of

    reading the parameters by one using getParameter, which returns a value for

    each parameter, we can read an array of values. If the parameter names do not
    exist,

    thegetParameterValues method will return null. In the case of single parameter

    value, it will return an array with one element, so we can use this method when
    we

    reading multiple form values.


    # Accessing parameter names:

    getParameterNames and getParameterMap


    When we write the servlet code, we assume the parameters names, but if we don''t

    know them, it becomes a problem to access the parameter value. So, the solution

    is to use the getParameterNames method to get the list of parameter names in the

    enumeration. Each value received in the Enumeration can be cast to String

    and then used in the getParameter or getParameterValues method. If there are

    no parameters in the current request, getParameterValues will return an empty

    enumeration list. Then, we can use the Enumeration interface and the methods

    provided by the interface, for example, the hasMoreElements and nextElement

    methods, to iterate and get the values in a loop.


    # Accessing the form data : getReader or

    getInputStream


    In the previous section, we looked at how to read individual or multiple parameters.

    In this section, we will study another approach to read the form parameters using
    a

    stream and then parse the raw data. This can be achieved through the getReader
    or

    getInputStream method. Reading the raw data is difficult as there is no delimiter

    u to separate each parameter value, and the URL is also replaced by ASCII or ISO

    Latin characters. Parsing of raw data is useful when we need to parse the data

    manually, for example the data comes from a custom client than by an HTML

    form or an uploaded file, then parsing

    is necessary as servlet doesn''t have API support to read a file.'
