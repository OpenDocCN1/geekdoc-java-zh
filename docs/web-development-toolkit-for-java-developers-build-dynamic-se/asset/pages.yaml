  md: 'designers. JSP 2.0 introduced a shorthand language for evaluating and outputting
    the values of Java objects that are stored in standard locations. The JSP 2.0
    expression language lets you simplify the presentation layer by replacing hard-to-maintain
    Java scripting elements with short and readable entries.


    The general syntax of expression language is ${expression}.


    If the given attribute is not found or expression returns null instead of throwing
    any exception. For arithmetic operations, EL treats null as 0 and for logical
    operations, EL treats null as false.


    # Retrieving scoped variables


    In the previous sections, we covered instantiating a bean object, assigning and
    retrieving bean value, and sharing the bean in different scopes available. Like
    a bean, we can share any object or variable in the available scopes. Generally,
    the sharing of object will be done by servlet when we apply the MVC pattern, and
    the JSP will access it.


    To allow the JSP page to access the object, the servlet needs to use the setAttribute
    method to store the data in one of the scopes available:


    +   - HttpServletRequest

    - HttpSession

    - ServletContext


    The objects/variables stored in these scopes are known as scoped variables, and
    the expression language provides a short and easy way to access them.


    When the JSP needs to find the object to access from the different scopes, we
    need to use the findAttribute method. For example, to find an object/variable,
    namely, objectName, from the JSP page, we need to <%pageContext findAttribute("objectName")%>
    or use jsp:bean, <jsp:bean id="objectName" type="somePackage.SomeClass" scope="...",,
    and then <%objectName%> the equivalent expression language syntax is ${objectName}.


    The general syntax for accessing the scoped variables using expression language
    is as follows:


    ${scoped variable}


    Example 1: We share three variables in the three different scopes with different
    names and then share variables with the same name in all the three scopes to show
    how to access them:'
