  md: 'Outline of JSF for Building Component-Based, Event-Oriented Web Interfaces
    367


    interface. JSF builds a component tree that outputs HTML depending on the data
    present in Java objects using XML tags or annotations. With JSF 2.3, annotations
    can now be used to specify JSF components instead of JSF metadata. Without modifying
    any XML, a JSF app may be built and deployed.


    # Structure of a JSF application


    JavaFaces needs a common directory structure and metadata, just like'' Pages and
    the Servlet API. They are distributed in .war format. The .war file''s structure
    is comparable to that of a servlet or JSP application. It has a web-app directory
    that houses the markup files for the application and a /WEB-INF directory that
    displays the metadata for the application.


    Glassfish is a Java EE container and can execute JSF, but for server-side Java
    technologies like JSF and others, Tomcat is a well-liked container.


    # MVC in JSF


    JSF uses the Model-view-controller (MVC) design pattern. In the MVC approach,
    the three UI concerns are divided into independent components to make them easier
    to handle. In general, the controller sets up the model and directs the user to
    the appropriate view, while the view is in charging of data in the model.


    The Faceslet with its set of XML tags serves as the view in a JSF implementation.
    These specify how the user interface is laid out. The use of JSF on the serverside
    is where Java classes support UI components. With JSF 2.3, managed annotations
    are revealed by CDI. Developers create a context with CDI and then inject things
    into it. The annotation syntax is a little different for those who are used to
    managed beans, but the semantics are exactly the same.


    # Controller beans


    The controller component of the MVC equation is provided by controller beans in
    JSF 2.3. The model is provided via regular Java objects, also known as POJOs or
    Plain Old Objects. The controller beans'' process flow is as follows:


    +   * Select the correct user request

    * Prepare the model''s POJOs

    * Render the Faceslet using view model


    The component tree and model are then combined by JSF to produce the HTML output.
    Listing 2 demonstrates how to use CDI to define the JavaBean object from listing
    1: cdi-api-1.2.jar is assumed to be one of the application''s dependencies in
    this listing.'
