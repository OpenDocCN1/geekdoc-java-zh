  md: '# Basics of Java Server Pages (JSP)


    A declaration has the following form:


    <! Field or Method Definition %>


    Since declarations do not generate output, they are normally used in conjunction
    with JSP expressions or scriptlets. In principle, JSP declarations can contain
    field (instance variable) definitions, method definitions, inner class definitions,
    or even static initializer blocks: anything that is legal to put inside a class
    definition but outside any existing methods.


    Example 1: To declare a method and use it in an expression


