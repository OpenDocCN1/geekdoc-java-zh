    # fn:indexOf()


    The fn:indexOf() function is used for determining the start position (index) of
    a string in the provided string.


    Syntax:


    intIndexOf(String, String )


    The return type of this function is int. It returns the starting position (or
    index) of the second string (second argument of the function) in the first string
    (first argument of the function).


    The function returns -1 when the string is not found in the input string. It is
    case sensitive and treats uppercase and lowercase characters of the same letter
    as different. It returns the index of the first occurrence, which means if the
    string is present in input more than once, then the function would return the
    index of the first occurrence.'
