    - Aspect-oriented programming


    # # Objectives


    After studying this chapter, you should be able to understand the basic concepts
    of spring framework and apply them to create the application using these concepts.
    You should also be able to understand basic application structure, create beans
    and keep them in required scopes, apply dependency injections using different
    approaches, apply validations, and understand aspect-oriented programming.


    # # Software framework


    The purpose of a framework is to provide basic functionalities in terms of different
    project structures, drag and drop pallets, autogen of basic routine code in a
    default structure based on the type of file, provide easy compile and build facility,
    etc. These functionalities enable programmers to develop the applications easily
    with less effort and time needed for writing and creating the routine code.


    Application frameworks offer several advantages:


    +   - Already existing code can be reused, which saves a lot of time and money.

    - Based on functionality, different teams can work parallel; for example, software
    framework configuration and application development teams can work separately.

    - Security is implicitly provided by the framework, mostly with the use of secure
    session management and escaping database input.

    - Low-level tasks are taken by care of the framework.

    - Frameworks offer all the basic and advance operations, for example, a application
    framework mostly offers session management, validations, configuring payment gateways,
    etc.

    - Frameworks can assist in programming design patterns.

    - Application functionality can be enhanced automatically, without writing extra
    code when the framework is upgraded.

    - The software framework provides several facilities in software development,
    so it saves lots of time and effort of the programmers.'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'There are also a few drawbacks of using a framework:


    +   - When common code is used, performance can be degraded sometimes.


    +   - To use the framework effectively, prior knowledge of using its feature to
    the best is required.


    +   - Functionality that needs to bypass or work around deficiencies in a framework
    can cause more programming issues when developing the full functionality in the
    first place. This is not the fault of the framework, but few frameworks are more
    generally suited and flexible than others.


    +   - Bugs and security issues in a framework can affect every application using
    that framework.


    +   - When working with a framework for the first time, one may find difficult
    to understand how to develop an application using it, but once the flow and structure
    of framework is understood, it allows faster development with less effort.


    +   - The framework needs to be extended with specific code to develop specific
    software.


    Types of Java frameworks:


    +   - The Java collection framework consists of various classes and interfaces
    that are used to perform operations on various data.


    +   - A Java logging framework is used to record transactions; the most common
    framework includes JCL, log4j, etc.


    +   - Several frameworks have been developed for the Java platform, like servlets
    API, JSP, Struts, Tiles, and Spring Framework.


    +   - The Java Media Framework (JMF) enables adding audio, video and other media
    to the Java applications and applets.


    +   - Spring is a data persistence framework.


    +   - Spring framework allows us to handle transactions, so programmers need not
    perform low-level programming.


    +   - Spring provides strong database error handling support by giving JDBC exception
    handling facility, which allows us to identify and handle database exceptions.


    +   - Hibernate is a strong feature while developing web application; spring provides
    integration with Hibernate, so it eases many tasks.


    +   - Spring framework works on the concept of aspect-oriented programming.'
