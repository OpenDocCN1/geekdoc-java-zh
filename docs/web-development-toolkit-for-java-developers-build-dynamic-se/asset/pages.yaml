  md: '# taglib directive


    This directive allows user to use custom tags in JSP. We will discuss custom tags
    in detail in the upcoming JSP tutorials. The taglib directive helps you declare
    custom tags in JSP page.


    Syntax of Taglib Directive:


    ```

    <@taglib uri="taglibURI" prefix="tag prefix="">

    ```


    Where URI is uniform resource locator that is used to identify the location of
    custom tag, and tag prefix is a string that can identify the custom tag in the
    location.


    Example to include the JSTL library:


    ```

    <@taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core">

    ```


    Invalid credentials are entered, and the error.jsp page is selected. If you are
    writing XML-compatible JSP pages, you can use an alternative XML-compatible syntax
    for directives, as long as you do not mix the XML syntax and the classic syntax
    in the same page.


    These constructs take the following form:


    ```

    <jsp:directive.directiveType attribute="value" />

    ```


    For example, the XML equivalent of the following:


    ```

    <@ page import="java.io.*" > is

    <jsp:directive.page import="java.io.*" />

    ```


    # Conclusion


    In this chapter, we covered the basic syntax of JSP. JSP is used to write Java
    in HTML, but how, and how much we matters a lot. So, understanding the basic scripting
    languages like scriptlets, expressions and declarations are very important. Then,
    we looked at the usage of directives like like page, include and taglib directive.
    Additionally, we covered the include action, param element, forward action, and
    the XML syntax of using all the JSP tokens.


    In the next chapter, we will discuss the once of accessing JSP syntax using expression
    language, and we will explore JavaBeans functionality.


    # Points to remember


    +   - Java Server Pages (JSP) technology enables you to mix regular, static HTML
    with dynamically generated content.'
