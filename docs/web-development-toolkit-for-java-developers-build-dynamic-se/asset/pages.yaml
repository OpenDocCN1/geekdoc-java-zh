  md: '# Web Development Toolkit for Java Developers


    To generate servlet in NetBeans, you can select the JSP page and right-click on
    it; then, select view; notice that the servlet will be generated only if the JSP
    has been successfully compiled and executed:


    ![](img/a0bb0a9553a3974c2aa1136b93fa2374_185_0.png)


    Figure 7.34: Snapshot of generate servlet from JSP as a view in NetBeans


    When you want to generate dynamic content using JSP in a format other than HTML,
    you can use both page directive with the contentType attribute and the setContentType
    response method. However, when you know the type in advance, you should use page
    directive with the contentType attribute, and when the format of output, that
    is, the content type, is based on user choice or some situation, it is preferable
    to use the response.setContentType method.


    # The session attributes


    The session attribute controls whether the page participates in HTTP sessions.
    Of this attribute takes one of the following two:


    ```

    <@ page session="true" %> <-- Default --%

    <@ page session="false" %>

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'A value of true (the default) signifies that the predefined variable session
    (of HttpSession) should be bound to the existing session if one exists; otherwise,
    a new session should be created and bound to session.


    A value of false means that no sessions will be automatically created and that
    attempting to access the variable session will result in errors when the JSP page
    is translated into a servlet.


    # The isELIgnored attribute


    The isELIgnored attribute controls whether the JSP 2.0 expression language (EL)
    is ignored (true) or evaluated normally (false). This attribute is new in JSP
    2.0; it is illegal to use it in a server that supports only JSP 1.2 or earlier.
    Use of this attribute takes one of the following two forms:


    ```

    <% page isELIgnored="false" %>

    <% page isELIgnored="true" %>

    ```


    Expressions in the JSP take the ${expression} attributes


    # The buffer and autoFlush attributes


    The buffer attribute specifies the size of the buffer used by the out variable,
    which is of type almost. The use of this attribute takes one of the two forms:


    ```

    <% page buffer="sizekb" %>

    <% page buffer="none" %>

    ```


    Servers can use a larger buffer than you specify, but not a smaller one. The default
    buffer size is server-specific but must be at least 8 kilobytes.


    # The info attributes


    The info attribute defines a string that can be retrieved from the servlet using
    the getServlet method. Its uses the following form:


    ```

    <% page info="Message" %>

    ```


    # The errorPage and isErrorPage attributes


    The errorPage attribute indicates whether the current page can act as the error
    page for another JSP page. The use of isErrorPage takes one of the following forms:


    ```

    <% page errorPage="true" %>

    <% page errorPage="false" %> <%-- Default --%>

    ```'
