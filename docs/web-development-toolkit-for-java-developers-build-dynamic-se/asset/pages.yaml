    # Managing cookies


    A web server sends bits of text information to the browser, and the browser uses
    the same information when visiting that site; this textual information is called
    cookie. By using cookies, the users visiting site can be provided with several
    services. Cookies are useful in providing various benefits, as listed here:


    +   - They help in recognizing a user during an e-commerce session. As HTTP is
    stateless when a user makes a request, it is not known that name user has made
    the request; keep-alive connections could be applied only to the requests generated
    in near time sessions. Cookies can be read and manipulated for further processing.


    +   - Cookies are useful in remembering usernames and passwords. They let user
    log in to a site automatically, ensuring convenience for users of unshared computers.


    +   - When a user sets certain preferences while accessing the sites, cookies
    can be used to remember customizing sites.


    +   - While browsing, displaying advertisement based on users’ choice is one of
    the marketing practices, cookies can be used for that, to let the site remember
    which topics interest users and show advertisements relevant to those interests.


    +   - Cookies ensure convenience for the users and help add value to the site
    owners.


    +   - Cookies do not create any security threat by reading its values and interpreting
    it; they cannot be used to insert viruses or launch denial of service attacks.
    Also, they do not occupy much space. Yes, but cookies can present a threat by
    remembering the previously searched pages; the type of data accessed or searched
    by users is known, and advertisements can be shown based on that; users may not
    like this in case they view or search for personal or sensitive data. Due to privacy
    issues, some users turn off the cookies so that sensitive data is not open for
    somebody to access it.


    # Sending and receiving cookies


    Servlet can use the Cookie constructor to send cookies to the client. Apart from
    it, any attribute can be set by calling the set method for that attribute, like
    cookie.'
