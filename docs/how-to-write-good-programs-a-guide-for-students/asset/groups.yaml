    9.1 When You Can’t Run Your Program Yet


    103


    Debugging situations divide into two classes, depending on


    whether you can run the program at all, or not.


    **9.1**** When You Can’t Run Your Program Yet**


    If your compiler, interpreter or IDE is telling you there is a


    problem which makes it impossible to run your program, then


    almost certainly it will also be making some attempt to help you


    to understand where and what the bug is, by giving you some kind


    of error message or marker.


    Such error messages can (notoriously) be confusing, however.


    It is a difficult job to ensure that every error message clearly and


    correctly indicates what the problem is. It’s even more difficult to


    design error messages that will be helpful even to a programmer


    who is only just getting started. So very likely it’s not you – the error


    message really is hard to understand – but cut the tool developers


    some slack. If you read an error message and have no idea what


    it’s trying to tell you, you will probably not be the first person with


    that problem. Try a search, copying and pasting the error message


    directly from where you see it into your search bar:


    *your\_language the\_error\_message*


    for example


    python TypeError: unsupported operand type(s)


    Here are a few examples coming from a Java compiler.


    **Examples of Java error messages**


    error: ’(’ expected


    error: reached end of file while parsing


    error: cannot find symbol


    error: unexpected type'
