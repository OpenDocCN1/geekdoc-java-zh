    ## 12 How to Score Well in Coursework


    This chapter focuses on what we might call the mark-mercenary aspects of being
    a student. Its principal aim is not to make you a better programmer, as such.
    It’s to help you maximise the number of marks you get on a coursework assignment,
    wherever your programming skills are at the time. However, there is one way in
    which it may help you grow as a programmer. If you make sure that you get as many
    marks as your current programming skills will let you get, any places where you
    *do* lose marks should correspond to things that you genuinely don’t fully understand
    yet. That means that the feedback you get should be well targeted: you won’t just
    read it and think “oh yes, I know that”, but instead, you will be able to learn
    from it. Moreover, I notice that, as an educator, I have been unable to prevent
    some of this chapter slipping into “how to learn as much as possible from coursework”.


    ### 12.1 Seven Golden Rules


    1. Start early. Most things take longer than you think, and there may well be
    “waiting” time involved, e.g. where you discover one evening that you need to
    talk to an instructor who won’t be available until the following afternoon.


    Students often wonder whether they can start their assignment early – “do we have
    all the material yet?” The simplest way to deal with that is to ask. Keeping well
    up with the course material will also help, as it will help you to be sure that,
    when you encounter something that doesn’t look familiar, you definitely haven’t
    met it yet.


    Remember that you can be proactive and look things up even if they haven’t come
    up in class yet, and that’s often a useful thing to do.


    “Pulling an all-nighter” near the deadline has its attractions, especially if
    you can do so in a lab full of other people doing the same; it can lead to a feeling
    of camaraderie and even of euphoria once you finally complete the exercise. But
    it really, truly isn’t a good way to optimise either your mark or your learning.
    When you are very tired, you make mistakes, and you also fail to store things
    you learn in long-term memory.


    2. Read the question. I know, I know, you’ve been told this before. In programming
    assignments, it has several aspects. There are book-keeping things like ensuring
    that you know whether, when and how you must hand the work in, and whether there
    are rules about things like what your files must be called. Those things apply
    to any kind of coursework, not only programming assignments. On the other hand,
    in a programming assignment, the details, of what your program must do, assume
    huge importance. You can’t just read the description the way you’re reading this
    book: you will need to look at it word by word, and make sure you follow the instructions
    *precisely*.


    3. Follow all the advice in Chapter 7, to test your work and make sure you’ve
    done it right.


    4. If you encounter something you don’t understand, in the sense that you think
    the question you are being asked is ambiguous or vague, make the issue concrete
    by programming it in two ways. Sometimes, as you try to do this, you will find
    that in reality only one of the two ways makes sense. If that happens, you have
    solved your own problem. If you do end up with two interpretations that seem equally
    plausible, you can ask your instructor which way is what they want. For an instructor,
    a question of the form “do you want X, or Y?” is easier to understand and answer
    clearly than a question like “what does this mean?”


    5. Follow all the advice in Chapter 8, so that you get any part marks that may
    be going. This applies especially if a large part of your mark will come not from
    automated tests, but from a human reading your code. Any human doing that is likely
    to be busy and tired, and anything you can do to make it easier for them to see
    what’s right about your answer is likely to help you maximise your mark.


    6. Don’t cheat! Even if you get away with it this time – and you may not – you’ll
    harm your learning and put yourself in a worse position going forward.


    7. Do hand the work in on time.


    ### 12.2 Lab Exercises


    What I mean by “lab exercises” here is: relatively small, straightforward programming
    exercises intended to help an individual learn a programming language. Typically
    a lab exercise does not invite much creativity: what you have to do is tightly
    specified, and is straightforward once you are familiar with the language. A first
    programming course often includes a sequence of such exercises, covering whatever
    features of the language are included in the course. They may be marked for credit
    or not, and model solutions may or may not be available.


    We start with these because of their special character: they are so valuable to
    your learning that doing them will help maximise your marks on whatever other
    assessment there is, even if they don’t attract credit in themselves.


    **Tip**


    If you don’t have a sequence of exercises like this that you must do, find one.
    For example, choose a textbook for your language which includes many small exercises,
    and do them.


    The reason is simple: you cannot learn by reading about it, watching someone else
    do it, or actually doing it. Beyond the Golden Rules, how can you maximise your
    marks? I recommend:


    - I’ve read the question and started.

    - I’ve written some code.

    - It does the right thing.

    - I’ve found reference material.

    - I’ve understand every line.

    - My code is perfect.


    ### 12.3 Individual Projects


    An individual project is a piece of coursework that affords you more creativity:
    you have considerable choice about what software does and how.


    To maximise your marks, first find out everything you about how marks will be
    allocated and what the criteria are. For example, do you have to write a report,
    do a demonstration, submit the code? Are you allowed or encouraged to find and
    build on other software, or not? Are you supposed to demonstrating particular
    skills or kinds of learning?


    Once you have whatever information available, you may find yourself disappointed
    that there isn’t much. The more flexibility there is in the task, the more difficulty
    instructors will have giving marks. Paradoxically, in that case you will usually
    maximise your mark – and certainly get the most benefit – if you worry about marks
    as little as you can. Approach the project in a way that interests you, and try
    to get engrossed in it. I recommend estimating how much time you should spend,
    and then tracking the time you do spend explicitly. This is because open-ended,
    long-term tasks can be hard to balance against smaller exercises with tight deadlines.
    It is common for students to find that, somehow, the task without a looming deadline
    never gets a look-in. Finally, avoid spending a lot of time on things that are
    not programming – designing graphic art for an app, for example – unless you enjoy
    it enough to be able to count that time as recreation, or have personal reasons
    for wanting to learn skills outside those that are being examined.


    ### 12.4 Team Working


    Working in teams is a common part of programming coursework, and it comes in many
    flavours. You may be assigned to a team, or allowed to group yourselves into teams;
    you may self-organise or be managed by someone else; you may or may not have to
    reflect on the experience.


    My main advice here is to take the whole exercise with a large grain of salt:
    working in a group with other students is almost nothing like working with a team
    of colleagues in a real software development situation. In particular, you may
    hate the former and nevertheless love the latter, so don’t worry if you hate the
    coursework team experience!

    '
