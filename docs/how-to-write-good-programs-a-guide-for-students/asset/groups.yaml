    ## 15.5 编程语言理论


    随着你学习的深入，高级编程语言理论书籍开始变得触手可及。其中最著名的之一是 Benjamin Pierce 的书籍《类型与编程语言》(Types and Programming
    Languages)；如果你对数学感兴趣，并想了解类型系统，这本书非常值得一读。我喜欢的另一本书是 Glynn Winskel 的《编程语言的形式化语义首页Formal
    Semantics of Programming Languages)。不过，该类书籍可能非常有挑战性，因此在购买之前，请先在图书馆或书店翻阅，确保你清楚自己在面对什么。


    ## 参考文献


    - Brambilla, Marco, Jordi Cabot, and Manuel Wimmer. *实践中的模型驱动软件工程》(Model-Driven
    Software Engineering in Practice). Morgan and Claypool, 2017.

    - Beck, Kent. *极速开发：拥抱变化》(Extreme Programming Explained: Embrace Change). Addison-Wesley,
    1999.

    - Bentley, Jon. *更多编程珍珠》(More Programming Pearls), 影刻版. Addison-Wesley Professional,
    1988.

    - Bentley, Jon. *编程珍珠》(Programming Pearls), 第2版. Dorling Kindersley, 2006.

    - Bloch, Joshua. *Java Java》(Effective Java). Addison-Wesley Professional, 2017.

    - Brooks, Frederick P. Jr. *人月神话：软件工程论文》(The Mythical Man-Month: Essays on Software
    Engineering),周年版. Addison Wesley, 1995.

    - Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. *Perl编程》(Programming
    Perl), 第4版. O’Reilly Media, 2012.

    - Corbyn, Zoë. 采访：玛格丽特·哈密尔顿：“他们担心男人会反叛，但他们没有。”《卫报》(The Guardian), 2019年7月. www.theguardian.com/technology/2019/jul/13/margaret-hamilton-computer-scientist-interview-software-apollo-missions-1969-moon-landing-nasa-women.

    - Dijkstra, Edsger W. *结构化编程笔记》(Notes on Structured Programming), 技术报告 70-WSK-03,
    第2版, 1970年4月. www.cs.utexas.edu/users/EWD/ewd02xx/EWD249.PDF.

    - DeMarco, Tom and Timothy Lister. *人机：高效的项目与团队》(Peopleware: Productive Projects
    and Teams). Addison-Wesley, 2016.

    - Feynman, Richard P. 货物崇拜科学(Cargo cult science)。《工程与科学》(Engineering and Science),
    37(7), 1974年6月. http://calteches.library.caltech.edu/51/2/CargoCult.htm. 加州理工学院1974年毕业演讲。

    - Fowler, Martin. *重构：改进现有代码的设计》(Refactoring: Improving the Design of Existing
    Code). Addison-Wesley, 1999.

    - Gamma, Erich, Richard Helm, Ralph Johnson, and John Vlissides. *设计模式：可重用对象软件的基础》(Design
    Patterns: Elements of Reusable Object-Oriented Software). Addison-Wesley, 1994.

    - Heinlein, Robert A. *月球是个严酷的老娘》(The Moon Is a Harsh Mistress). G. P. Putnam’s
    Sons, 1966.

    - Hoare, Tony. 皇帝的新装衣(The emperor’s old clothes)。《ACM通信》(Communications of the
    ACM), 24(2):75–83, 1981年2月.

    - Hunt, Andrew and David Thomas. *实战程序员》(The Pragmatic Programmer). Addison-Wesley,
    1999.

    - Knuth, Don. 关于 van Emde Boas 构造优先队列的笔记：递归的启发性使用, 1977年3月. 通过 https://staff.fnwi.uva.nl/p.vanemdeboas/knuthnote.pdf
    获取。

    - Krishnamurthi, Shriram. *编程语言：应用与解释》(Programming Languages: Application and
    Interpretation), 第2版. http://cs.brown.edu/courses/cs173/2012/book/, 2017.

    - Martin, Robert C. *洁净代码：敏捷软件工手手册》(Clean Code: A Handbook of Agile Software Craftsmanship).
    Prentice Hall, 2008.

    - McConnell, Steve. *代码完全手册》(Code Complete). Microsoft Press, 2004.

    - McDowell, Gayle Laakmann. *程序员面试题》(Cracking the Coding Interview). CareerCup,
