    ## 10.4 提升你的技能


    **懒惰**（Laziness）我曾有一位数学老师，常说“数学是偷懒的艺术”，因为数学中很大程度上关于寻找更简单的方法来解决问题，而如果你按照显而易见的方法去做，就会变得非常困难。


    这是一个类似的观点：优秀的程序员会思考如何为未来为自己节省工作，因此以一种尽可能容易更改的方式编写程序。更进一步，优秀的程序员会充分利用高质量的库：如果别人已经写好了你必须写的代码，你可能完全可以省去编写整个程序的精力。


    **急躁**（Impatience）是懒惰的必要制衡。它是一种驱使你提高程序效率的特质，针对你目前相关的任何效率。例如，当你的程序运行时间超过了理应当的时间时，这种特质会迫使你去调查原因（时间效率）。它也是一种让你意识到，如果为了这一个真正的原因就必须在五个地方修改代码，这种做法是无法忍受的，因此你最好改进它的设计，让你以后再也不需要那那样做（维护效率）。


    **傲慢**（Hubris）意味着过分的自大。这种特质让你想要写出如此完美的程序以至于所有人都会赞叹，并带给你你可以做到的信心。


    在写作期间，YouTube上有一段名为“霍比特人会成为伟大的程序员”的视频，其中拉里·沃尔（Larry Wall）解释说，程序员应该具备他归于霍比特人的特征：


    - 以一种非常勤奋的方式懒惰；

    - 以一种非常有耐心的方式急躁；

