    # 4 如何理解你的语言


    对于初级编程学者来说，使用开源软件的直接优势是：它们通常是免费的，² 而且如果你愿意，你可以查看源代码并从中学习。以后，你可能希望向开源项目做出贡献：请参见第
    15 章。


    ## 4.4 历史、社区与动力你的你的语言有多老了？它是谁设计的？它是用来做什么的？如果你正在上一门编程入门课程，有一个问题是：你使用的是一种主要用于教学的语言，还是一种被专业人员广泛使用的语言？我们在本书中讨论的大多数语言在这两种环境下都可以，但你可能遇到过像
    Scratch 这样的教育语言，或者基于 Logo 的龟图形语言；你现在可能正在学习 Alice。类似的问题适用于你正在使用的工具：例如，你可能正在为 Java
    使用面向教育的 IDE BlueJ。这些类别之间的界限确实变得模糊，成功的语言会超越其原本的小众领域：例如 BASIC，这种设计于 20 世纪 60 年代初的语言，名字意思是“初学者通用符号指令代码”（Beginner’s
    All-purpose Symbolic Instruction Code），但它的 Visual Basic 方言后来也被专家和初学者广泛使用。


    很有可能，你的语言会被一些专业开发者使用。为了做什么呢？阅读它的维基百科页面，或者搜索谁在使用*你的语言*，会让你找到一些信息（可能还有一些关于*语言大战*的例子）。在这个过程中，你可能会发现关于你语言周围*社区*的一些事情。也许你的语言是一种*脚本语言*，通常用于自动化执行原本需要由人类手动完成的任务序列。


    ² 在你不需要为它付钱的情况下：你可能想查一下“自由软件”（free software）的不同含义。


    ## 4.5 范式


    这些是解释型语言：Python 通常被认为是一种脚本语言，尽管如今它也被用于许多其他用途。或者你的语言可能主要用于网络服务、人工智能、数据科学、嵌入式编程或统计学。哪些网站有关于它最实用的问答合集？把它们收藏起来！


    我们将某些内容留到了最后，而这些内容在编程语言的比较讨论中通常会被优先。传统上，编程语言根据人们编写这些语言时倾向的主要思维方式进行分组——即根据*范式*进行分组。通常识别出的四种主要范式是：


    - 指令式（Imperative）。程序命令计算机执行一件事，然后执行另一件事。数据以*可变状态*的形式存储，即具有可以更改的值的变量。示例语言：C。

    - 面向对象（Object-oriented）。程序以对象的形式组织。每个对象封装（*encapsulates*）一些数据，并可以响应某些请求（*消息*），从而承担某些责任。示例语言：Java。

    - 函数式（Functional）。程序员不只将函数看作代码片段，而是将其看作是独立的实体——即数据——它们可以在程序中传递。例如，一个函数可以作为参数传递给另一个函数，就像整数可以传递一样。（人们有时说函数是“一等公民”。）避免了可变状态。示例语言：Haskell。

    - 逻辑式（Logic）。编写程序涉及指定事实以及关于事实如何从其他事实得出的规则，然后提出一个问题。示例语言：Prolog。


    然而，现实生活并不像这样整洁，有些人认为用范式的角度思考并没用。当你使用一种以上语言进行编程时，你自然会将你最喜欢的思维方式（受过去编程经验的影响）引入到你采用的每种语言中。某些语言——事实上
    Python 就是一个例子——具有特征的混合，使得它们难以分类。有时，一个在某个范式中良好开始的语言随着时间的推移而改变，以便于以其他地方开始的风格进行编程。例如，Java
    8 版本引入了新功能，使得以函数式风格编程更加实用。


    这是否意味着你可以只挑选你喜欢的编程方式，然后在任何语言中以这种方式编程呢？在某种程度上你*可以*，但这可能不是最好的方法。例如，你可以用函数式风格编写 C
    程序，但因为 C 对函数式编程的支持并不很好，你的程序不太可能是*好的*。很容易出错，而且对于任何读者（包括以后的你）来说，都很难理解。尝试顺着你所选语言的特性（无论它是否由你选择的）：从该语言专家典型的编写方式中学习。也就是说，学习在你的语言中进行*地道的*（idiomatically）编写。同时，对你遇到的不同编程风格的良好特性保持警觉，并准备在*适当的地方*利用它们。


    **提示**


    为了帮助你感受你的语言中什么是良好的、地道的代码，请找一个规模较大、声誉良好的代码库。查看它，并记住在你学习语言的过程中定期回来查看。如果你在这个阶段无法详细理解它，请不要担心。如果你对对诸如“函数应该有多长？”、“我应该如何给类型名称大写？”等问题，可以查阅它。


    例如，标准库是由专家编写的，他们期望自己的代码会被许多其他专家检查，因此它们往往是良好的——尽管不是特别对初学者友好——的代码。


    - Java：Java 开发工具的 OpenJDK 版本源代码位于 http://hg.openjdk.java.net/jdk/jdk/。在左侧菜单中寻找“browse”（浏览）选项。

    - Haskell：如果你使用 Hoogle (https://hoogle.haskell.org/) 查找一个函数，在其名称右侧有一个源代码的链接。

    - Python：如果你使用来自 https://docs.python.org/3/library/ 的文档，你会在大多数页面顶部看到源代码的链接。


    你的特定语言的书籍或文档应该提供大量的代码示例。


    ## 5 如何使用最佳工具


    在计算的早期，程序以打卡片的形式存在，必须输入计算机，编程是一项缓慢的工作。自然地，理解计算机能力的编程人员希望计算机能帮助编程工作变得更简单、更快、更可靠。如今，有一系列广泛且不断变化的工具来支持软件开发过程。某些工具——例如编译器——执行明确的任务；其他工具，特别是集成开发环境，整合了许多功能并为它们提供统一的界面。学会良好地使用工具是编写良好程序的重要部分。


    编程课程在工具使用的教学方面差异很大。你可能会被精确告知使用什么以及如何使用，也可能会得到使用某种工具的建议，但由自己发现它的功能，或者你可能完全自力更生。自然地，在学习特定工具是课程的一部分的任何程度上，你都需要这样做；但对可用工具有一个更宽泛的视角也是有用的。当你在课程之外编程时，你可能能够选择你喜欢的工具。如果你计划从事软件开发行业，你将需要适应工作场所使用的任何工具集。


    正如我们在书的其余部分将看到的，适当工具贯穿整个软件开发过程中提供帮助：从启动一个新的编程项目，到编辑、编译、运行，


