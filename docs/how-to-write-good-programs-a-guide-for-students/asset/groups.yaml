    ## 6.6 备份与云存储


    **提示**


    如果你发现自己不忍删除一段目前对你没用的代码，因为你认为你以后*会*需要它——例如，它解决了一个你预计会再次遇到的问题，而且你为了正确实现它曾查阅了一些复杂的内容——那么请务必将其保存。只要不要把它保存在一个它毫无用处的程序内部即可。我有时会创建一个名为
    `CuttingRoomFloor`（剪辑室）的子文件夹，用来存放可能有用代码片段。


    **6.6 备份与云存储**


    创建文件的副本或使用版本控制系统，是防止因误操作删除了导致程序丢失的有效方法。但如果文件的副本（或版本控制系统的中央仓库）都存储在你正在工作的这台电脑上，然后这台电脑坏了、丢失或被盗窃了呢？为了恢复你的工作，你需要以某种方式对它进行*备份*：也就是说，在另一台电脑或某些外部介质上应该有重要文件的副本。如果你使用的是大学或学院提供的电脑，很有可能——但并非绝对！——你的文件可能正在自动为你备份，并且在发生灾难时有计算支持人员可以为你恢复。如果你使用的是自己的设备，则需要自行安排以减少丢失重要工作的风险。与版本控制一样，方法有很多，从完全手动的（例如，养成一种习惯，每次完成一次工作后就将文件复制到挂在钥匙扣上的
    USB 闪盘中）到完全自动的。你可以搜索 *your_operating_system* 自动备份来查找选项。现在许多人依赖通过某种方式将文件存储在*云端*——也就是说，存储在通过互联网访问的别人的电脑上。Google、Microsoft、Dropbox
    以及其他公司提供基础的免费服务：你可以将程序保存在一个自动复制到他们服务器的目录中，然后通过登录该服务的账户，你可以在互联网的任何地方访问它们。这在日常生活中非常方便，特别是如果你经常使用几台不同的电脑，并希望在其中任何一台上都能编写代码，同时也能在灾难发生时为你提供保障。


    **提示**


    依赖于你记住要做某事（如复制文件或运行备份服务）的备份计划，一旦你忘记了就是毫无用处。如果你选择了一个不是完全自动的计划，请思考如何将必要的行动转化为一种*感觉*像自动那样的习惯，也许可以通过将新行动与你已经经常执行的活动联系起来。


    版本控制系统让你能够轻松回到任何之前提交（checked in）的早期版本；云服务让你能够从任何电脑轻松找回当前版本。如果你想结合这些优势呢？显而易见的想法是将版本控制仓库放在云端——但是，特别是当有多个人使用该仓库时，这可能是危险的，因为这些服务并非为此种用途设计的，可能会导致仓库损坏。更好的主意是使用
    GitHub 或另一个专门的云端版本控制系统。它们的*存在意义*（raison d’être）让团队从世界任何地方进行协作，但你也可以将它们用于课程作业等单人项目。


    然而，有一点警告：如果你决定使用像 GitHub 这样可能让其他人获取到你文件的的系统，你必须仔细考虑谁应该有权访问什么内容。例如，如果你正在完成一项会被评估的练习，你通常不允许让其他人访问你的答案——这会助长作弊，而且受到的惩罚与使用别人的答案一样严重。考官通常认为，了解谁有权访问你的文件是你的责任，所以请务必确保这一点！


    有些人人喜欢建立一个公开访问的代码仓库，可以在求职申请等场合展示它。这是一个主意，但如果你在学会了编写更好的代码后发现那里还留着旧代码，可能会适得其反——而且一旦你把东西传到网上，你就无法保证它永远消失！考虑一些更谨慎的替代方案，例如将代码样本直接发送给希望他们看到的人。


    **提示**


    对于让不认识的人看到你的代码要谨慎。


    ## 7 如何测试你的程序


    你已经写了足够多的程序使其能够运行；那么你如何判断它是正确的，以便在不正确时修复它呢？嗯，运行它，看看它是否符合你的预期。对于一个非常简单的程序，这可能就没别的说了。


    **Python 示例**


    ```python

    print("Hello, World!")

    ```


    我们运行程序，观察到它打印了“Hello, World!”，并得出它是正确的结论。


    但我们在这里做了什么呢？我们隐含地理解了：

    - 程序运行不需要提供任何命令行参数或其他任何特定的上下文；

    - 它应该做的是打印“Hello, World!”。


    **术语：规范（Specification）**


    程序的规范是对它应该做什么的描述。它可以非常详细，具体说明它做什么；也可以比较笼统，只提供你需要的内容。


    ### 7.1 手动测试


    只要你知道如何运行程序（包括如何设置它的上下文——例如给它任何参数），并且知道如何观察它的运行，你就可以进行系统测试。你不需要任何特殊工具；一个文本文件或一张纸就可以。只需列出一个测试列表：描述上下文以及所需的结果。例如，假设你写了一个比
    Hello World 稍微复杂的一点程序，名为 `greeter`，它应该接收一个参数并打印“Hello”以及该参数。


    **测试列表**


    - greeter Rahul 输出 Hello Rahul

    - greeter sue 输出 Hello sue

    - greeter Jane Smith 输出 Hello Jane

    - ...


    现在，系统地测试你的程序包括按照列表为每个测试运行一次程序，提供适当的上下文并检查结果是否正确。在编写测试时，你可能会发现自己在脑海中对程序形成了一个简要的描述。面板中的第三个测试表明，我们最初对程序的描述并不详细：假设我们那个测试是正确的，当我们给
    `greeter` 程序参数 Jane Smith 时，它应该打印 Hello，而不是 Hello Jane Smith。这就是你需要留意的细节类型。在澄清这一点之后，我们可能会有一个更精确的规范，例如“程序输出‘Hello’，跟着输入的第一个单词，完全按照给定的方式”。


    **术语：测试（Test）**


    程序的测试是运行程序的特定上下文，包括任何必要的数据，以及对程序在该上下文中应该做什么的规范。


    **提示**


    每当你写下程序的规范时，如果以后程序的预期行为发生了变化，请务必保持其更新！


    '
