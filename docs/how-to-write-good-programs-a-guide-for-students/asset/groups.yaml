    10 How to Improve Your Program


    This is not always possible, however. Sometimes you find that your


    program needs to be restructured, and that doing the restructuring


    in small, refactoring steps will take you through states where the


    program is less clear than it is now. It is then tempting to abandon


    the refactoring discipline and make all your changes at once, as


    fast as possible. But even here, refactoring will help you to avoid


    getting into a buggy mess. What you should do is to make sure


    you understand where you are going before you start, and avoid


    starting until you have a suitable chunk of time available to you,


    so that you can take the program all the way through to its better


    structure without having to leave it in a working, but unsatisfactory,


    state. You may like to write yourself design notes or draw a picture


    to explain the final state you are heading for, to minimise the risk


    of losing your way once you start editing the code.²


    **When is the program good enough?**


    It really depends on the context. It is very satisfying to take a


    piece of code all the way to your idea of perfection, and the


    more often you mindfully do that, the better you will get at


    writing code which is good the first time. However, you will


    not have time to take every piece of code you ever write to


    perfection. More interestingly, what “perfect” is depends on


    what you need to do with the code: however you structure your


    code, some changes to the functionality will be easier to make


    than others.* The perfect structuring is the one that best supports*


    *the change that actually turns out to be required* – which, in real


    life, you can’t predict with certainty! As a matter of pride, try


    to leave your code clean, readable, and in a state to support


    changes you can reasonably foresee: but don’t agonise over it.


