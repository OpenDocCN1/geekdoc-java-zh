    7 How to Test Your Program


    • “Every bug found in testing is one the customer doesn’t find.”


    *Anon.*


    For people who have customers they care about, this idea can


    help motivate them to get into the right frame of mind. Of


    course, it’s only really true if you go on to fix the bug, and keep


    it fixed* . . .* which is one reason for doing* systematic* testing.


    When you’re a student, you may find it useful to think of the


    person who is going to mark your work as the customer.


    • “Program testing can be used to show the presence of bugs,


    but never to show their absence!”


    *Edsger Dijkstra* (Djikstra, 1970)


    The philosophical point here is that if your program has


    infinitely many possible inputs, and you only run finitely


    many tests, then in principle, it might still fail on some input


    you haven’t tested. To be sure that your program works on


    every input, you have to study the code of the program and


    prove that it is correct. There’s a large field of study of


    software testing concerned with how to pick enough of the


    right tests to be sure that if certain kinds of bug existed in


    the program, we would find them. For a start, you’d like to


    have every line of your code, that could ever be run, run in


    the process of doing some test – otherwise, a line that was


    missed out might contain a bug.


    • “Beware of bugs in the above code; I have only proved its


    correctness, not tried it.”


    *Don Knuth* (Knuth, 1977)


    This tongue-in-cheek antidote to the Dijkstra quotation


    above reminds us that proof, like programming, is a human


    activity. Unfortunately, there can be bugs in your proof, just


    as there can be bugs in your program. Especially, it’s easy to


    incorporate the same mistaken assumptions into both!'
