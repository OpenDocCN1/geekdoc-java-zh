    测试、调试和改进你的程序。在本章的剩余部分，我们将讨论工具如何支持程序的各种*编写*等方法。在此过程中，我们将讨论可能引导你选择工具的因素。


    ## 5.1 使用最基础的工具


    到为止，我们假设你正在使用一个文本编辑器来编写程序，然后从操作系统的命令行编译并运行该程序。这样做的好处是它易于理解哪个工具执行了什么任务——相比之下，更复杂的工具有时会让人感到困惑。一个好主意是*能够*仅使用比纯文本编辑器稍不复杂的工具来编写、编译、测试和运行你的程序——一个*笨编辑器*（dumb
    editor），即一个没有任何支持编程的特殊功能的编辑器——以及一个命令行，即使你并没有选择在日常工作中那样操作。


    强大且可扩展的文本编辑器（如 Emacs 和 Atom）通常具有扩展，可以让它们支持各种语言的编程。例如，在 Emacs 中，你应该在*python 模式*下使用编辑器编辑
    Python 程序，只要你为 Python 文件使用标准的扩展名 `.py`，你可能会发现编辑器会自动进入这种模式。你注意到的最明显的一点是你可以获得了自动的*语法高亮*，这在语言的关键词（例如
    `if`）与你选择的变量名之间提供了视觉上的区别。请注意，尽管这些视觉效果看起来与你在文字处理器中产生的相似，但在这里是编辑器*计算*出在何处使用何种效果。程序文件中并没有存储任何关于这些视觉效果的指令，程序文件仍然只是纯文本，你可以在任何文本编辑器中打开它。


    编辑器模式（可以非常简单，也可以非常强大）对人们来说比专业的开发工具更容易编写，因此即使对于不常用的编程语言，它们通常也是可用的。此外，有些人更倾向于能够从一个程序运行他们的整个生活。例如，我使用
    Emacs 管理邮件、撰写论文、组织文件以及大部分的日常编程——尽管对于 Java，我发现从 Emacs 切换到专业的 IDE 是值得的。


    ## 5.2 什么是 IDE？


    在第 3 章中，我们引入了*集成开发*环境*（integrated development environment）这一术语，将其定义为“一个支持开发程序整个过程的应用程序”。这有点模糊，事实上，IDE
    的功能也各不相同。你可能期望一个 IDE 至少支持你的程序的编写、编译（如果这与你的语言相关）、运行、测试（第 7 章）和调试（第 9 章）。通常，IDE
    会向你呈现一个图形化前端，其背后是你可以从命令行使用的相同工具：例如，IDE 可能会有一个测试你程序的菜单项，该项在后台会调用一个你也可以选择直接调用的测试工具。然而，将许多单独工具集成在一个应用程序中具有许多优点。


    - 它们可以以一种一致的、易于使用的方式呈现给你；你可以从菜单中调用它们，而不需要记住每个工具的名称。良好的界面设计还可以让你通过探索界面来轻松发现功能。

    -   IDE 可以跟踪你的工作流——例如，如果你尝试运行一个自你上次保存以来就编辑过的程序，IDE 可能会询问你是否想先保存工作。

    -   IDE 可以为你提供一个工具的输出与你可能想要做的后续操作之间的智能链接。例如，如果编译你的程序显示第 13 行有错误，点击错误消息可能会将 IDE
