  - '[PAGE 144]


    10.1 Maintainability


    135


    being maintained is not really the program, but the* relationship*


    between the program and its environment, which includes the


    people, processes, software and hardware that the program must


    interact with. Whenever something in the environment changes, the


    program may need to change, in order to maintain the relationship.


    For example, it’s normal to have to change a program from time to


    time to keep track of new versions of the programming language.


    It’s even more common for the needs of the users to change over


    time. Stretching the definition, even fixing bugs can be seen as


    a kind of maintenance. The easier it is to effect any necessary


    changes, the more maintainable we say your program is.


    When you’re new to programming, especially in the artificial


    setting of a beginners’ programming course, you are relatively


    isolated from these concerns. Most likely, you’ll be given a clearly


    described problem to solve, and nothing about it will change while


    you do it. Even so, thinking about maintainability is a good habit


    to get into, because the same properties that make code easy to


    maintain also help to get it correct.


    The first stage of ensuring maintainability is following the guide-


    lines we discussed in Chapter 8 for making your program clear.


    That’s because any kind of maintenance to a program involves


    someone being able to understand how it works* now*, so that


    they can confidently change it. If your program is difficult to


    understand, they may find themselves guessing about what the


    program currently does, or about what it is supposed to do, which


    makes the process of changing it less reliable.


    **Tip**


    Even if you are confident you are the only person who will ever


    need to change your program, it still pays to work on its clarity.


    You might be surprised by how fast you forget what was in your


    head when you wrote it!'
