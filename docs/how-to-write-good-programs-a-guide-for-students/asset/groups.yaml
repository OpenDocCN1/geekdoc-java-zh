- md: "\n## 9.4 If All Else Fails\n\nfollowing your explanation – or even was capable\
    \ of following your explanation. The logical conclusion, which, surprisingly,\
    \ turns out to hold, is that it is almost as effective to explain your program\
    \ to a cardboard cutout of your tutor – or even to an *imaginary* cardboard cutout\
    \ of your tutor – as to your real-life tutor. You’ll feel daft, but give it a\
    \ go.\n\n## 9.4 If All Else Fails\n\nSometimes, however, you find the only sensible\
    \ reaction to your problem is “don’t start from here”. If trying to localise and\
    \ understand your bug reveals to you that your program is a horrible mess that\
    \ you can’t understand, you could consider:\n\n- starting again from scratch,\
    \ this time testing as you go (see Chapter 7) and keeping your program clear (Chapter\
    \ 8);\n- refactoring (more on how to do this in Chapter 10).\n\n### Terminology:\
    \ Refactoring\n\nTo *refactor* a program is to change it without changing its\
    \ functionality. You might do this to make the program easier to understand or\
    \ easier to change.\n\nThis is not the ideal time for refactoring – ideally, you\
    \ would start with a program *you* completely understood, but wanted to improve,\
    \ e.g. to make it easier for *other people*, or yourself at a later date, to understand\
    \ – but sometimes it may be the best of a bad bunch of options. When I have lost\
    \ a thing, and have failed to find it in the first few places I look, I often\
    \ take this as a sign that I need to calm down and tidy up generally. Almost always,\
    \ this is as efficient as any other way of finding the lost item, and it improves\
    \ my environment as well. Sometimes the analogous strategy works in programming.\n\
    \n**Tip**\n\nIf what you have is a mess of spaghetti code that doesn’t work, any\
    \ way of recovering is going to feel challenging. Don’t despair, it happens to\
    \ pretty much every beginning some time, and motivates the development of good\
    \ habits to stop it happening again! Do consider getting a cup of coffee at this\
    \ stage, or going for a walk, or even getting some sleep and coming back to the\
    \ problem when you’re rested.\n\n## 9.5 Removing the Bug\n\nMost bugs are blessedly\
    \ easy to remove, once you fully understand what and where they are.\n\n**Tip**\n\
    \nEven if, in the course of localising your bug, you make a change to the program\
    \ that seems to make it go away, make sure you fully understand, before you move\
    \ on.\n\nOne reason for this tip is that the process of understanding a bug, especially\
    \ in code you wrote, is usually educational. Does the existence of the bug point\
    \ at something you do not quite understand about the language? Regard your bug\
    \ as a learning opportunity, and get all the value you can from it. For example,\
    \ in our Haskell example, a poor way to use the bug arising from a use of Integer\
    \ where Int was expected would be just to see that the error message says something\
    \ about Int and change Integer to Int; a better way is to look up the difference\
    \ between Integer and Int and understand it once and for all. If Kasia in our\
    \ story earlier had moved on as soon as she observed that deleting the semi-colon\
    \ fixed her problem, she might have ended up with a confused feeling that semi-colons\
    \ were sometimes problematic. Such lurking confusions sap your confidence.\n\n\
    Another reason is that the bug is not the same thing as the indicator that told\
    \ you there was a bug. If you edit the program without fully understanding what\
    \ the problem was, you may make the indicator go away, without having fixed the\
    \ real problem. You may then have a program that still has a bug, but has a different,\
    \ less natural one that will be harder to debug when it does eventually come to\
    \ light. For example, in Python, suppose you had written\n\n**Python example**\n\
    \n```python\ndef get_data(file_name):\n    with open(file_name) as file:\n   \
    \     data = file.read()\n        # etc: code to work with the data...\n```\n\n\
    and everything was going well, until you accidentally called the function with\
    \ a file name that did not exist. At this point, an exception (a FileNotFoundError)\
    \ would be raised. You *could* modify the code to this:\n\n**Python example (don’t\
    \ do this!)**\n\n```python\ndef get_data(file_name):\n    try:\n        with open(file_name)\
    \ as file:\n            data = file.read()\n            # etc: code to work with\
    \ the data...\n    except:\n        pass\n```\n\nwhich has the effect of making\
    \ the function do nothing at all, not even complain, if the file does not exist.\
    \ The symptom, namely the raised exception, goes away. However, this is a **REALLY\
    \ BAD** **IDEA**. The next time the function is called on a non-existent file\
    \ name, you may be much further on with your development, and it may be less obvious\
    \ to you what has happened. Perhaps some code far away in your program will mysteriously\
    \ fail, and the root cause may be hard to determine. Instead, handle the error\
