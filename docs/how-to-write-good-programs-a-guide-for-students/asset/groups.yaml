  mdcn: "\n\n## 9.4 如果万事无策\n\n遵循你的解释——或者你甚至能够跟上你的解释。逻辑上的结论（令人惊讶的是，这个结论成立的）是：向你导师的纸板模型解释你的程序——甚至向一个*想象中*的你导师纸板模型解释——与向现实生活中的导师解释几乎一样有效。你会觉得自己很傻，但还是试一试吧。\n\
