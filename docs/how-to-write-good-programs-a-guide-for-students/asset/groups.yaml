    \n*重构*一个程序是在不改变其功能的情况下改变它。你可能这样做是为了让程序更容易理解或更易修改。\n\n这并不是重构的理想时机——理想情况下，你应该从一个*你*完全理解但想要改进的程序开始，例如为了让*其他人*或你以后的自己更容易理解——但有时，这可能是一堆堆糟糕的选项中最好的一个。当我丢失了某件东西，并且在寻找的前几个地方没有找到它时，我通常将其视为一个需要冷静并进行常规整理的信号。几乎总是，这比任何其他寻找丢失物品的方法都有效，而且还能改善我的环境。有时类似的策略在编程中也有效。\n\
    \n**提示**\n\n如果你手里的是一堆无法运行的乱条代码（spaghetti code），任何恢复方法都会让你感到挑战性。不要绝望，几乎每个新手在某个时候都会遇到，而且这激励了养成良好的习惯以防止其再次发生！在这个阶段，考虑去喝杯咖啡、散散步，甚至睡一觉，等休息好后再回到问题上。\n\
