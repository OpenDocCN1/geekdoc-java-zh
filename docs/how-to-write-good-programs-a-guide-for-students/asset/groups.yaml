    \ being. On the plus side, your question is likely to reach more people, more\
    \ quickly, than you can talk to face to face – so the chance is higher that one\
    \ of them will be able and willing to help. Less obviously, the process of turning\
    \ your problem into a clear, succinct textual question often helps you clarify\
    \ your thinking. It’s not at all uncommon to find that, in the process of working\
    \ out how to ask your question, you answer it for yourself. (This is a similar\
    \ phenomenon to the cardboard debugging process that we discussed in Chapter 9.)\
    \ On the minus side, you have to take the time to do the writing – which will\
    \ be harder, the more confused you are – and you may have to wait for a response.\n\
    \n**Tip**: Even when you are writing only for people on the same course as you,\
    \ write carefully, and give relevant detail. For example, don’t just say “it doesn’t\
    \ work” or “it gives an error” – say exactly how it doesn’t work, or exactly what\
    \ error you see.\n\nShould you turn to the wider internet? There are sites like\
    \ StackOverflow¹ that are set up for programmers to ask questions about programming.\
    \ I’d urge you to be cautious about this, as an early-stage student. It’s likely\
    \ that your question can be sorted out by reading standard documentation, or has\
    \ been asked before, and the denizens of StackOverflow can be impatient with such\
    \ questions.\n\nHowever, “be cautious” doesn’t mean never do it: it just means\
    \ take care to be asking a question which is as clear and precise as possible.\
    \ Don’t ask “why doesn’t this work?”, for example; say “I expect this code to\
    \ return 4 on input 1, but instead it returns 3 – why?” Say what standard resources\
    \ you have consulted and why closely related questions don’t answer yours. Do\
    \ include an example of the code feature you’re talking about – perhaps an example\
    \ of code whose behaviour you don’t fully understand, or an example of code you\
    \ think should work but doesn’t – but make sure this piece of code is a true MNWE\
    \ (see above), so that experts can understand as quickly as possible what the\
    \ essential point you’re stuck on is.\n\nFor a lot more discussion of what constitutes\
    \ a well-asked question, I recommend you read the most famous Smart Questions\
    \ guide, “How to ask questions the smart way” (Raymond, 2014). Finally, a trivial\
    \ point that seems to get overlooked:\n\n**Tip**: Any time you send someone your\
    \ code, post it on a forum, etc., copy in your actual program text, rather than\
    \ including an image of it! Most people, in helping you, will want to try out\
    \ your code, or their modified version of it, in their own tool: you need to allow\
    \ them to copy and paste, not retype.\n\n### 11.2.5 Help to Get Started\n\nWhat\
    \ if it’s not that you have a problem with a program you have written, but rather\
    \ that you have no idea how to even get started, so that when you think about\
    \ asking someone else, you can’t really even work out what question to ask? This\
    \ tends to be a problem that afflicts beginners, which experienced programmers\
    \ often have trouble helping with, because they have long forgotten ever feeling\
    \ that way. The positive way to think about this is that, one day, this feeling\
    \ will be a distant memory for you too.\n\nIn the meantime, what can you do? Perhaps\
    \ you’d like to reread Chapter 3, especially Section 3.5. But maybe you feel as\
    \ though you were fine with small problems, but now you’re facing a more challenging\
    \ task and you don’t know how to get started with that? One thing is to polish\
    \ off any easy bits: reduce the part you can’t do to something as small as possible.\n\
    \n**Tip**: “When faced with something you do not understand, it is worth to see\
    \ if you can find a simpler version of it.”\n"
