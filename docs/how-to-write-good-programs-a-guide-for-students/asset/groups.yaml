    ## 14 如何选择编程语言


    你对数据在计算机内存中存储方式的直觉。它仍然是嵌入式系统中一种流行的语言。如果你对硬件感兴趣，你很可能学习它。


    **C++** 在 C 语言之上构建了面向对象的特性。它比 Java 更难编写，但即使在今天，它的效率更高。如果 C++ 是适合你的语言，你可能不需要我来解释为什么了。


    **Fortran** 追溯到 20 世纪 50 年代，现在被认为是一种过时的语言。然而，它在科学计算中仍然被广泛使用。


    **Haskell** Haskell 是最成熟的函数式语言之一。它拥有强大的静态类型系统，可以帮助你避免许多种 bug。它是许多编程语言理论专者的首选语言。这有优缺点：优点是学习
    Haskell 会让你接触到许多高级特性和研究成果；而缺点是可能很难为简单的问题获得简单的答案，而且编译器和库往往会发生快速且不可预测的变更。


    **Java** Java 是一种非常广泛使用的、健壮的语言，有工具、书籍、教程等的良好支持。它在企业系统中特别流行，即支持复杂组织业务流程的系统。它可能很冗长。


    **JavaScript** 是 Web 应用的自然选择。有大量的框架和库，因此学习 JavaScript 的过程可以说更多是关于学习它的某些框架。JavaScript
    是动态类型的，但如果这对你来说是个问题，你可能想考虑 TypeScript，它本质上是 JavaScript 的静态类型变体，可以编译为 JavaScript。请注意，“JavaScript”中的“Java”本质上是为了历史营销原因：当
    JavaScript 在 1995 年出现时，Java 还是新颖且时尚的。这两种语言非常完全不同。


    ### 14.2 你可能会遇到的一些语言


    **MATLAB** 是一种用于数值计算的语言，被科学家和工程师广泛使用。与此列表中的大多数语言不同，它没有开源实现。


    **Perl** Perl 的全称是 Practical Extraction and Report Language（实用提取和报告语言），或者是 Pathologically
    Eclectic Rubbish Lister（病态折衷垃圾列表器）。Perl 的格言是“实现某件事有多种方法”。一旦你熟悉了这门语言，它对于许多任务都非常方便，特别是那些涉及与操作系统交互和处理字符串的任务。但在你的
    Perl 程序中追踪 bug 可能很困难。我热爱 Perl（这正是它出现在列表中的原因：它通常不作为第一门编程语言教授，尽管你可能在几乎任何地方遇到它），但除非你有现有的
    Perl 代码需要维护，否则我很难说服你现在学习它。至少考虑考虑改用 Python。


    **PHP** 是一种脚本语言，广泛用于 Web 开发（特别是服务器端脚本）。它很容易上手，在必须涵盖大量内容的 Web 应用课程中很流行。它有声认为是一种倾向于鼓励编写不可维护、不安全代码的语言——但这可能有些不公平，尤其是该语言的最近版本已经有所改进。


    **Prolog** 是一门老语言，正随着 AI 热潮而复兴。它具有与 Haskell 等函数式语言相似的模式匹配功能，但除此之外与此列表中的任何其他语言感觉都很不同：它被描述为一种逻辑编程语言，基本思想是先编码一些事实，然后对这些事实提问。


    **Python** 从某些标准衡量，Python 是最流行的入门编程语言。我仍然相当愤恨 Python 夺走了曾经属于 Perl 的语言生态系统位置，Perl
    是我一直最喜欢的语言之一。但不可否认，Python 相比 Perl 有许多优势。也许总结差异最简单的方法是指出，“Python 之禅”²中包含的原则之一是“执行某事应该有一种——且最好只有一种——明显的方法”。³


    Python 非常容易上手，非常流行，并且是一门良好的通通用语言。它不是静态类型的，这意味着如果你的程序变得巨大且复杂，你可能会后悔。它是数据科学和机器学习的流行语言，并具有良好的字符串处理功能。它的流行意味着任何事情都有相应的库和框架。Python
    2 版本和 3 版本之间存在显著差异，所以请务必知道你要使用哪一个。


    **R** 是一门对数据进行统计的语言。它提供了方便的绘图和分析设施。与有时用于相同任务的 MATLAB 不同，它是一种开源语言。


    **Racket/Scheme** Scheme 被广泛用教学语言，但在商业上并不那么流行，它是 Lisp 家族的函数式语言。Racket 最初是 Scheme
    一个版本的重命名，现在更流行。它具有极简主义的语言设计哲学，如果你对编程语言的工作原理感兴趣，这是一门很好的学习语言。


    由于所有这些语言都被广泛使用，且其中大多数经常作为入门编程语言，因此它们中都有很好的教学材料。尝试一下吧！


    ### 14.3 语言不断变化的格局


    前一节中的所有语言都追溯到上个世纪。但新语言一直在被发明，我还有许多其他可以提到的语言。你可能想搜索一下那些工作你感兴趣的人和组织使用了哪些语言。TIOBE
    指数⁴ 尝试定期更新语言流行程度的总结——但意所当然的是，它的方法论是有争议的。最重要的是要意识到，如果你计划从事涉及编程的职业，你学习的第一门语言不太可能是你一生中使用最多的那一个。在你的第一门语言中学习编写良好的程序很重要，但将自己推向在尚未学习的语言中编写良好程序的道路同样重要。


    ## 15 如何超越这本书


    本书针对从事早期编程课程的学生及其老师，我希望你发现它很有用。一旦你彻底吸收了它的内容，下一步该做什么？


    ### 15.1 编写更多程序


    你当然可以直接写一个你觉得感兴趣的程序。如果你想让你的练习更有结构性，你可以考虑：


    - 在线编码挑战和竞赛，例如在 HackerRank¹ 上找到的——这些提供多种语言，你可以竞争性地做，也可以只是为了好玩；

    - 参与外展活动，例如帮助学校儿童的编程俱乐部：不得不解释事情对你自己的理解非常有益；

    - 参加黑客松（hackathons）——通常由大型雇主或大学协会组织的高强度、小组编程活动——如果你足够幸运在这些活动发生的地方，可以听讲座等；

    - 为开源项目做贡献：欢迎新人的项目通常有论坛或“参与我们”页面或类似的内容来帮助你入门，网站 UpForGrabs² 汇集了此类项目的链接。


    本章的其余部分是关于书籍的。如果你可以使用大学图书馆，你可能在那里找到大部分书籍。


    '
