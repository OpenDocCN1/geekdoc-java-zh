    游戏”），你可以搜索 *programming language* your_task 来获取一些可以考虑的语言想法。


    **术语：图灵机**


    1936 年，艾伦·图灵描述了一种计算机的简单数学模型，我们现在为了纪念他将其称为*图灵机*。*图灵可计算函数*是指可以使用这种机器表达的数学函数（从输入到输出的映射）。你可能会认为你对编程语言的选择会对你能够表达的函数产生重要影响。令人惊讶的是，事实并非如此。尽管编程语言在可以*方便地*表达的内容方面有所不同，但现代编程语言在原则上的表达能力并不比非常老的语言，甚至不比图灵机强。我们把任何可以编写所有图灵可计算函数的语言称为图灵完备语言。


