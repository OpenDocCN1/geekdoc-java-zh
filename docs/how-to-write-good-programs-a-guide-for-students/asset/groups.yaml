    8 如何让你的程序更清晰


    我们将在第 10 章回来讨论当你需要时*你*可以如何改进程序的结构，第 15 章将讨论超出本书范围之外的资源。


    尽管如此，本章中的许多建议从一开始就易于遵循。如果你养成选择具有信息量名称、清晰布局代码以及良好利用注释的习惯，你将节省时间和精力的。


    **9**

    如何调试你的程序


    所以，你的程序有一个 bug（错误）。


    **术语：Bug**


    程序中的 bug 是程序中的某些错误：通常是一个微小的、特定的东西，你可以随心所欲地把它想象成缩在你代码行上的昆虫，即使你还不知道是哪一行或哪种昆虫。“bug”一词用于小错误或故障，它的出现早于计算机，但计算先驱格蕾丝·霍珀（Grace
    Hopper）曾著名地讲述一个故事，关于从早期机电计算机（哈佛 Mark II）中发现的一只真蛾，它当时干扰了程序的运行。


    更正式地说，我们有时会谈论故障（faults）、错误（errors）和失败（failures），每个术语的含义略有不同。你可能会发现查一下这些很有趣。不过，现在用“bugs”就可以了。


    首要任务是：你*如何*知道*你的程序有一个 bug？可能是你的编译器、解释器或 IDE 在你甚至运行程序之前就告诉你存在问题。或者也可能是当你运行程序时，它的行为不正确：也许测试失败了、程序崩溃，或者你没有看到预期的结果。


    调试有四个步骤要经过——还有一个额外的第五步，这对于将自己成为一个*优秀*的程序员至关重要。


    101

    102

    9 如何调试你的程序


    1. *识别*出存在 bug。恭喜你，你已经完成了这一步。这可能感觉不像是什么成就，但它确实是。例如，如果你没有费心编译你的程序，或者没有在那个输入上运行你的程序，也许你还没有实现这一点。

    2. *定位* bug。即，找出程序中哪个位置出现了问题。

    3. *理解* bug。即，准确地找出问题究竟是什么。

    4. *移除* bug。即，修改程序使其至少在这一点上是正确的（并且将保持正确，因为你有一个适当的测试来防止回归）。

    5. 额外步骤：尽可能确保你的程序中没有其他类似的 bug，甚至更好，确保你以后在处理的任何程序中都永远不会引入类似的 bug。


    定位和理解 bug 往往是并肩的：你可能开始对 bug 在哪里有一个大致的想法，但只有当你准确地理解了哪里出了什么问题后，你可能才能精确地理解它具体在何处。我们将在这里谈讨论一些常规技术：如果这些技术还不够且你需要帮助，你可能还想看看第
    11 章，特别是关于如何构建一个*最小的**不可运行示例*的内容。


    **提示**


    当你尝试定位和理解 bug 时，*使用所有可用的信息*。经常，学生观察到某些东西不起作用——有编译时错误或运行时错误，或者测试失败——但他们没有关注特定的错误信息，或者检查哪个测试失败了以及如何失败的。这些信息看起来可能令畏，但不要被它吓跑。如果你每次都尝试，就会很快学会解释它。


    9.1 当你还无法运行程序时


    103

    调试情况分为两类，取决于你是否可以运行程序。


    **9.1 当你还无法运行程序时**


    如果你的编译器、解释器或 IDE 在你甚至运行程序之前就告诉你存在问题，这使得你无法运行程序，那么它几乎也会尝试帮助你理解哪里以及是什么，通过提供某种错误消息或标记。


    然而，此类错误消息（众所周知）令人困惑。确保错误消息能够清晰且正确地指示问题是什么是一项困难的工作，即使对于一个刚开始学习的程序员来说也是如此。所以，当你读到错误消息并完全不知道它在表达什么时，很可能是工具太宽容了——错误消息确实很难理解。如果你尝试将你看到的错误消息直接复制粘贴到搜索栏中，你可能会成为第一个遇到这种问题的人。如果你每次都尝试，就会很快学会解释它：*你的错误消息*，例如
    python TypeError: unsupported type(s)。这里有几个来自 Java 编译器的示例。


    **Java 错误消息示例**


    - error: ’’ expected

    - error: reached end of file while parsing

    - error: cannot find symbol

    - error: unexpected type


    113

    104

    9 如何调试你的程序


    幸运的是，编译器除了基础错误消息外，还会提供一些额外信息——通常是错误出现在文件的指示，但通常还有其他信息，例如编译器找不到*什么*符号。


    **提示**


    当错误消息给出一个行号时，先看那一行——但记住错误可能出现在程序的更早位置，直到在给定的行号处才检测到。例如，某一行缺少分号可能会导致在下一行报告错误。


