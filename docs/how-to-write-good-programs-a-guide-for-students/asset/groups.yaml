    102


    9 How to Debug Your Program


    1.* Recognising* that there is a bug at all. Congratulations, you’ve


    done that one. It may not feel like much of an achievement,


    but it is. If you had, for example, not bothered to compile your


    program, or not run your program on that input, perhaps you


    wouldn’t have achieved it.


    2.* Localising* the bug. That is, working out where in your program


    there is a problem.


    3.* Understanding* the bug. That is, working out exactly what the


    problem is.


    4.* Removing* the bug. That is, changing the program so that, at least


    in this one respect, it is correct (and will stay correct, because you


    have a suitable test to prevent regression).


    5. The bonus step: as far as possible, ensuring that there are no


    other similar bugs in your program, and even better, that you


    never introduce a similar bug into any program you work on in


    future.


    Localising and understanding the bug often go together: you


    may start out with a rough idea of where the bug is, but you may


    only get to understand precisely where it is once you understand


    exactly what’s wrong. We’ll talk about some routine techniques


    here: if they aren’t enough and you need help, you may also want to


    look at Chapter 11, especially concerning how to build a* minimal*


    *non-working example*.


    **Tip**


    As you try to localise and understand a bug,* use all the infor-*


    *mation available*. Too often, students observe that something


    doesn’t work – there is a compile-time or run-time error, or


    a failed test – but they do not pay close attention to the


    specific error message, or check which test fails and how. The


    information may look intimidating, but don’t be put off. You


    will quickly learn to interpret it if you try every time.'
