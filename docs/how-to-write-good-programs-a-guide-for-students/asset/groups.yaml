    ## 8.5 Structure and Idiom


    99


    This advice about high-level structuring may seem unsatisfactory because it is
    hard to decide which structure is best without considerable experience; you will
    inevitably learn partly from your mistakes. It turns out that a common concrete
    sign of possible problems with your current structure is that your lines of code
    get too long.


    **How long should a line of code be?**


    If you find yourself resizing a window, or scrolling horizontally, in order to
    see the whole of a line of your code, it is probably too long to comprehend efficiently.
    Even if you succeed in adjusting your own environment so that you can see the
    whole line, you may well be causing difficulty for someone else who has to read
    your code in future. Projects, and sometimes whole language communities, develop
    conventions about the maximum length of a line: for example, Python’s PEP 8 prescribes
    that no line should be longer than 79 characters.


    One way to tackle long lines is to split them. If you do this, consult your body
    of reputable code in your language to see what the conventions are about where
    a line may be split. Usually, though, a too-long line of code is a sign of an
    underlying problem, and it is better to fix that. Ask yourself:


    - Is a name too long? If so, do not just abbreviate it: think about whether there
    is a better, shorter name. If not, perhaps the thing named should be split up?

    - Has your logical structure become too deeply nested (e.g. do you have an if
    inside an if inside an if) so that the line starts with a lot of whitespace? If
    so, do not just reduce your indentation width: think about how you could improve
    the structure. Perhaps there is a chunk of nested code that should be a separate
    function?

    - Do you have a complex expression involving several operators, functions or messages?
    These are often hard to understand however they are laid out; consider constructing
    your result in stages, naming the intermediate results carefully.


    100

    8 How to Make Your Program Clear


    We will come back in Chapter 10 to discuss how* you can improve the structure
    of your program when you need to, and Chapter 15 discusses resources beyond the
    scope of this book.


    Still, much of the advice in this chapter is easy to follow from the beginning.
    If you get into the habit of choosing informative names, laying out your code
    clearly, and making good use of comments, you will save yourself time and stress.


    **9**

    How to Debug Your Program


    So your program has a bug.


    **Terminology: Bug**


    A bug in a program is something wrong with it: usually a small, specific thing
    which you might whimsically picture as an insect curled up on a line of your code,
    even if you don’t yet know which line or which insect. The term “bug” for a small
    error or glitch pre-dates computers, but the computing pioneer Grace Hopper famously
    used to tell a story about an actual moth recovered from an early electromechanical
    computer (the Harvard Mark II) where it was interfering with the operation of
    a program.


    More formally, we sometimes talk about faults, errors and failures, with each
    term meaning something subtly different. You might find it interesting to look
    that up. “Bugs” will do for now, however.


    First things first: how do you*know* your program has a bug? It might be that
    your compiler, interpreter or IDE is telling you there is a problem, before you
    even get to run your program. Or it might be that when you run the program, it
    does not behave correctly: perhaps a test fails, the program crashes, or you do
    not see what you expect to see.


    Debugging has four steps to go through – and then a bonus fifth step, which is
    crucial to turning yourself into a* good* programmer.


    101

    102

    9 How to Debug Your Program


    1. *Recognising* that there is a bug at all. Congratulations, you’ve done that
    one. It may not feel like much of an achievement, but it is. If you had, for example,
    not bothered to compile your program, or not run your program on that input, perhaps
    you wouldn’t have achieved it.

    2. *Localising* the bug. That is, working out where in your program there is a
    problem.

    3. *Understanding* the bug. That is, working out exactly what the problem is.

    4. *Removing* the bug. That is, changing the program so that, at least in this
    one respect, it is correct (and will stay correct, because you have a suitable
    test to prevent regression).

    5. The bonus step: as far as possible, ensuring that there are no other similar
    bugs in your program, and even better, that you never introduce a similar bug
    into any program you work on in future.


    Localising and understanding the bug often go together: you may start out with
    a rough idea of where the bug is, but you may only get to understand precisely
    where it is once you understand exactly what’s wrong. We’ll talk about some routine
    techniques here: if they aren’t enough and you need help, you may also want to
    look at Chapter 11, especially concerning how to build a* minimal* *non-working
    example*.


    **Tip**


    As you try to localise and understand a bug,* use all the information available*.
    Too often, students observe that something doesn’t work – there is a compile-time
    or run-time error, or a failed test – but they do not pay close attention to the
    specific error message, or check which test fails and how. The information may
    look intimidating, but don’t be put off. You will quickly learn to interpret it
    if you try every time.


    9.1 When You Can’t Run Your Program Yet


    103

    Debugging situations divide into two classes, depending on whether you can run
    the program at all, or not.


    **9.1 When You Can’t Run Your Program Yet**


    If your compiler, interpreter or IDE is telling you there is a problem which makes
    it impossible to run your program, then almost certainly it will also be making
    some attempt to help you to understand where and what the bug is, by giving you
    some kind of error message or marker.


    Such error messages can (notoriously) be confusing, however. It is a difficult
    job to ensure that every error message clearly and correctly indicates what the
    problem is. It’s even more difficult to design error messages that will be helpful
    even to a programmer who is only just getting started. So very likely it’s not
    you – the error message really is hard to understand – but cut the tool some slack.
    If you read an error message and have no idea what it’s trying to tell you, you
    will probably be the first person with that. Try a search, copying and pasting
    the error message directly from where you see it into your search bar: *your language
    error message* for example python TypeError: unsupported type(s) Here are a few
    examples coming from a Java compiler.


    **Examples of Java error messages**


    - error: ’’ expected

    - error: reached end of file while parsing

    - error: cannot find symbol

    - error: unexpected type


    113

    104

    9 How to Debug Your Program


    Fortunately, the compiler gives, along with the basic error message, some further
    information – usually an indication of where in the file the error arose, but
    often other information as well, such as *what* symbol it was that the compiler
    couldn’t find.


    **Tip**


    When an error message gives a line number, look at that line first – but bear
    in mind that the error may be earlier in your program, and only have detected
    further on, at the given line number. For example, a missing semi-colon on one
    line may cause an error to be reported on the next line.


    **Terminology: Errors compared with warnings**


    Sometimes your compiler will give you a message involving the word “error”, like
    those given above. Other times you may see messages involving the word “warning”
    instead. There is an important difference. An *error* is something you must fix
    before you go on – typically it prevented your file from compiling at all. A *warning*
    is an indication that the compiler has detected something which *probably* an
    indication that you’ve done something wrong. For example, compilers will often
    warn if they discover that your program contains unreachable code.


    You*can* ignore a warning, or even instruct the compiler not to give warnings
    – but it’s usually a good idea not to. Some compilers are better than others at
    giving warnings that genuinely do indicate problems. If you get a kind of warning
    you haven’t seen before, it’s definitely worth spending a few minutes on investigating
    what’s causing it and whether you can fix it. For example, in the case of unreachable
    code, you can delete it (or comment it out, if you think you might need it again
    in a moment). Often there will be an obvious problem – a mistyped word or a missing
    bracket, for example – on or around the line number.

