    6 How to Make Sure You Don’t Lose Your Program


    - retrieve a history of all the versions you’ve checked in, with their

    comments (particularly useful if you go back to a program you

    were working on a while ago);

    - recover any past version you want.


    Most of the systems you’ll come across these days have many

    more features than these. For example, they keep track of a related

    family of files, and let you check them all in together – this becomes

    crucial when you work on systems with large numbers of files.


    They usually have facilities to let teams of people work together on

    large systems, with some hope of not interfering with one another’s

    changes. The use of such facilities is beyond the scope of this book,

    though. Summarising very briefly, version control systems have

    been through three generations:


    - First generation: simple single-user systems. The only one you

    are likely to come across these days is RCS, which is installed on

    most Unix systems. It is so ancient that people may laugh if you

    tell them that is what you are using, but it does everything you

    need as a beginner!


    - Second generation: more complex systems that support multiple

    users, all working with the same files that are stored in a single

    central repository. SVN, short for Subversion, is the most used

    today. It is available on all the operating systems you are likely to

    use. You can use it from the command-line, or you might prefer to

    interact with it via a client that offers a graphical interface (such

    as TortoiseSVN on Windows, or Versions on a Mac). Command-line use may be a little
    less intuitive to start with, but may make

    it easier to transfer your understanding from one platform to

    another.


    - Third generation: distributed systems, allowing each user to have

    their own repository so that they can continue to work even

    when they are not all connected to the internet. Git is the best

    known, and is available on all major platforms; again there

    is a command-line interface and a choice of graphical clients.

    Familiarity with Git will help you if you want to make use of

    open-source projects stored on GitHub, which is a Git-based

    hosting service – you can even store your own code there (more

    on this in Section 6.6).


    If you are using an IDE (Chapter 5) you are likely to find that

    it has version control, based on SVN or Git, integrated in it: using

    this is likely to be easier than using a standalone version control

    client.


    **Tip**


    While you just want a version control system for your course

    exercises, simple beats full-featured; on the other hand, life is

    a lot easier if someone nearby is familiar with the system you

    choose to use, so consider asking around and going with what

    other people use.


    Whatever you use, go through a tutorial carefully, and try out

    the tool with some dummy files, before you trust it with your

    important files. Searching for *name_of_version_control_system* tutorial

    will find you one.


    ## 6.5 Managing Code that Is Not in Use


    It’ll often happen that you write a section of code, and then discover you don’t
    want it in your program, for example because

    you think of a better way to solve the problem. Particularly when you’re

    a beginner, it can also happen that your code doesn’t do what

    you think it should do, and you don’t quite understand why, and

    you decide to implement the functionality a different way instead.


    What do you do with the code now it’s no longer useful? You could

    just delete it, or you could comment it out.


    **Terminology: Commenting out**


    To *comment out* code is to hide it from the compiler

    and interpreter, while leaving it in the program for a

    human reader.


    Languages typically have a character, or character sequence,

    which tells the compiler or interpreter “ignore the rest of this line”.

    (The main purpose of the syntax is, of course, to allow you to write

    natural language comments, which we’ll discuss in Chapter 8.)


    In Java, C, and many other languages the character syntax is //;

    in Python, Perl, and various others it’s #; in Haskell it’s --; etc.

    You can just type the comment characters at the beginning of

    each line you want to comment out, but that gets tedious fast if

    you want to comment out more than a line or two. There are two

    alternatives.


    1. In an IDE, you can typically select a block of code, and then

    use a menu item or key combination that acts on the selection to

    insert the comment character at the beginning of every line in the

    block. Selecting a commented block to *uncomment* by removing

    the comment characters works similarly. The IDE will typically

    use a different font or colour to display commented-out lines, so

    that they are easily distinguished from active lines of code, too.

    This method is easy provided your tool offers the facility. It also

    has the advantage that there is no confusion about whether a

    line of code is commented out or not, and it avoids any difficulty

    with nested comments and similar issues.


    2. Your language may have a second comment syntax, specifically

    for multi-line comments. This means that there is some special

    combination of characters that marks the beginning of a

    comment, and a different special combination that marks the

    end of a comment. Everything that follows the begin-comment

    sequence is ignored, until the end-comment sequence is found.

    In Java, C, and etc., the beginning and end are /* */;

    in Haskell, it’s --. Python does not have a true-line

    comment syntax. The advantage of this method is that it gives

    an easy way to comment out large blocks of code. However,

    if you are using an IDE which makes clear, e.g. using a colour change,

    that some code is commented out, it may not be visually

    obvious.


    Once you know how to comment out, should you do that,

    or should you delete it? The advantage of commenting out is

    that if a few minutes you realise you want it, you can always

    get back if you need it. My preference is generally for

    these two ways of commenting out.


    How to decide? I recommend asking yourself *how sure you are*

    that you won’t need it. If you are pretty sure, go ahead and

    delete it. If you think very well may, comment it out for now,

    but remember to think about it again a bit: don’t let commented-out

    code sit around, getting in the way, for weeks. This is where a

    version control is is – if you have that code in

    (maybe commented out, you can get it back if you it.


    **Terminology: Dead or unreachable code**


    A section of your program code is *unreachable* if it can never be

    executed. For example, if you write a function as part of


    program, but your program never calls it (nor makes it available

    for a client program to call) then that function is unreachable.


    You may hear *dead code* used as a synonym for unreachable

    code. Some sources use it, instead, to refer to code that* is

    executed, but does not contribute to the intended behaviour of

    the program. For example, if your program calls a function, but

    never uses the result of the function, then the function may

    be considered dead, but not unreachable.


    Tidy up as you go. For example, if you write a function and

    then don’t call it from anywhere, get rid of that code, at least by

    commenting out, unless you know *for sure* that it will be used

    shortly. You might be tempted to think that it’s doing no harm to

    leave the code there; after all, if it isn’t called, any bug in it

    isn’t exercised, so does it matter? However, unused code gets in your

    way and can be confusing. For example, when you search for a bug,

    you may waste time looking at that code, even though it can’t possibly

    be the cause of the bug. Even if you are using an IDE which makes

    clear, e.g. using a colour change, that some code is unreachable,

    it still gets in the way by taking up screen space that could be

    better used. Get rid of it. As the agile programming people say,

    YAGNI.¹


    ¹ You Ain’t Gonna Need It.

