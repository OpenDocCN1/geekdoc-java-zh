- md: "\n## 5 How to Use the Best Tools\n\nare available on many platforms, and Visual\
    \ Studio (Microsoft\nand Apple operating systems). There are many others, free\
    \ and\ncommercial, including some written specifically to help students\n(e.g.\
    \ BlueJ for Java). The choice is also dependent on what programming language you’re\
    \ working in. Java is by far the best \nsupported by IDEs.\n\nThe most popular\
    \ IDEs, such as Eclipse, also support ecosystems of* plug-ins*: that is, they\
    \ have an extension mechanism which\nlets people other than the original developers\
    \ of the IDE extend the\nIDE’s capabilities in whatever direction they desire\
    \ – from imposing custom layout styles to integrating with tools for modelling\
    \ and verification. This is usually not a job for a beginning programmer,\nbut\
    \ if you ever wish your IDE did something that it does not do,\nremember that,\
    \ in a year or two’s time when you’re looking for an interesting project* . .\
    \ .*\n\n## 6 How to Make Sure You Don’t Lose Your Program\n\nHave you ever had\
    \ the experience of working on something for a significant length of time, and\
    \ then losing it entirely when a program crashed or a connection was lost? Or\
    \ simply because you closed a window you shouldn’t have closed? Or because you\
    \ thought you didn’t need a certain chunk of it, and deleted it, only to realise\
    \ a moment later that you did need it? Whether we’re talking about an essay, your\
    \ latest social media post or a program, it’s really annoying. Fortunately, it’s\
    \ largely avoidable.\n\nMaking sure you don’t lose your program, or valuable sections\
    \ of it, is partly a matter of using the right tools, and partly a matter of developing\
    \ habits that will save you from your own mistakes. People often have strong views\
    \ on the right way to do it, but in truth, there are many ways that work, each\
    \ with its own pros and cons.\n\nThe key tool is, of course, the one you’re using\
    \ to write the program. Whether that’s an editor or an integrated development\
    \ environment (see Chapter 5), make sure you understand what it can do for you.\n\
    \n### 6.1 Immediate Recovery: Undo\n\nThe most important facility that helps you\
    \ recover, immediately, from momentary mistakes, is the* undo* feature. Most of\
    \ the tools you’d consider these days have “infinite” undo – that is, you can\
    \ undo not just your last edit, but the one before that and so on, even back to\
    \ the state the file was in when you loaded it into the editor. They typically\
    \ have a corresponding* redo* feature, for when you accidentally undo too far.\
    \ These can be extremely useful, but they can also be a little confusing, especially\
    \ when you are feeling stressed because you’ve realised you messed something up.\n\
    \n**Tip**\nExperiment with the undo and redo features of your editor before you\
    \ actually need them.\n\nIf it turns out you’re using a tool that has no undo/redo\
    \ facility, or only has one level, i.e you can only undo the last edit* . . .*\
    \ seriously consider switching to another tool, if you can. If you don’t have\
    \ a choice, pay even more attention to the rest of this chapter.\n\n### 6.2 Basic\
    \ Disaster Recovery: Files\n\nComputers have primary storage, usually called*\
    \ memory*, and secondary storage, usually* disk*. When you open a program file\
    \ in your editor, relevant data from disk is copied into memory. As you program,\
    \ what you see on the screen in front of you is the state of what’s in memory.\
    \ It can be different from what’s on disk, because as you work on the program,\
    \ you change the state of the copy that is in memory, but not the state of the\
    \ copy that is on disk. When you save the file, the version in memory replaces\
    \ the version on disk, so that the two become the same again. Since you are gradually\
    \ improving your program, this is generally a good thing, and I suggested earlier\
    \ that you train your fingers into saving often.\n\nHowever, if you find yourself\
    \ with a disastrously broken version of your program in front of you – for example,\
    \ perhaps you just accidentally deleted a huge chunk – the very last thing you\
    \ want to do is to have this version replace what is on disk, so at this moment,\
    \ do not save! Think carefully. Can you use undo to get back to a good state?\
    \ If so, do so. Or, did you save recently, so that you are confident that the\
    \ version on disk is pretty close to what you want? In that case, close your file*\
    \ without* saving, and reopen it from disk. If it is a long time since you saved\
    \ the file to disk, though, using the version on disk may not help: you may have\
    \ done a lot of work that is not recorded in either version. At this point it\
    \ helps to know about an often-overlooked but occasionally useful feature that\
    \ most tools have: autosaving. That is, every few minutes or after a certain number\
    \ of key strokes, they save a version of your program, not onto the file you got\
    \ it from (saving to that is under your explicit control) but somewhere else.\
    \ In the days when tools were less reliable than they are now, this feature was\
    \ introduced to guard against the editor crashing. These days, it’s more likely\
    \ to be useful when you make a mistake. See what your tool does or can do, either\
    \ by searching autosave* your\\_toolname* or by browsing your filespace. You may\
    \ find that in the same place where your program file lives, there is another\
    \ file with a variant of its name which is the autosaved file, or you may find\
    \ that your tool uses a different directory or folder to store its autosaved files\
    \ in.\n\nIf you do something wrong in a file and want to go back to an earlier\
    \ version, but for some reason you can’t do so using undo, try this:\n\n1. Take\
    \ your hands off the keyboard and mouse. Doing nothing is not going to make matters\
    \ worse: anything you do without thinking it through might. Especially, saving\
    \ the current, wrong, version of your file may destroy useful information on disk,\
    \ so don’t do that!\n2. Think: might the current version on disk be at least a\
    \ bit useful? Or, given what you know about your tool, might there be a useful\
    \ autosaved version of the file?\n3. Use a file browsing application to go back\
    \ and see. If you find a version you think might be useful, make a copy with a\
    \ new name so that your tool will not overwrite it.\n4. Once you’re sure you’ve\
    \ got useful versions, go back to your tool.\n5. You can do the merging by hand,\
    \ just copying and pasting, look at all the versions, and merge them appropriately.\n\
    \n### 6.3 Avoiding Disaster: Saving Versions\n\nWhen you are solving a problem,\
    \ you typically do so in many stages, solving gradually more. Sometimes your attempt\
    \ at the next stage fails, and you may even break something that was working before.\
    \ You can save yourself the frustration of “going backwards” in this way, by developing\
    \ a reliable “ratchet” technique that means you can always return to the best\
    \ state you have reached.\n\n**Story**\nJennifer is doing an exercise in many\
    \ parts, all of which involve improving file.hs. She edits customer.hs until she\
    \ has Part A of the question done to her satisfaction. Before starting Part B,\
    \ she saves a copy with the name customerADone.hs. (She makes it a read-only file,\
    \ having previously made the mistake of accidentally carrying on editing in the\
    \ file that was supposed to be safe copy.) Then she goes back to editing customer.hs\
    \ to work on Part B. Once that’s done, she saves the new version as PartsAandBDone.hs,\
    \ and goes back to editing customer.hs, and so on. If got totally confused while\
    \ working on Part C, she knows she could always discard her unsuccessful work\
    \ on Part C, copy PartsAandBDone.hs to customer.hs, and start Part C again. As\
    \ it happens, she never does get confused this time, but she feels safer knowing\
    \ that the saved versions are there.\n\nThe more confidence you can arrange to\
    \ have in the correctness of your saved versions, the more useful they will be\
    \ to you. At a minimum, you should check that your editor and the compiler don’t\
    \ find any errors in them (apart, perhaps, from errors that simply show you haven’t\
    \ solved the whole problem yet – though see Chapter 3 for how to minimise those\
    \ by getting to compiling code as soon as possible by writing the outsides first).\
    \ It’s also a good idea to test your program before you save each version – see\
    \ Chapter 7 for more on this.\n\n### 6.4 Automating the Process: Using a Version\n\
    \n**Control System**\n\nOnce you get into the habit of saving versions of your\
    \ file, like this, you will quickly realise that it would be helpful to have some\
    \ tool support for the process. This is the job of a* version control system*.\
    \ Even a simple, single-user version control system will let you:\n\n-* check\
    \ in* a new version whenever you wish;\n-* associate comments with the new version,\
    \ e.g. to record what this version achieves;\n"
