    ## 15.5 Programming Language Theory


    As you learn more, advanced programming language theory books begin to become
    accessible to you. One of the best known is Benjamin Pierce’s book *Types and
    Programming Languages*; if you’re mathematically inclined, and want to know about
    type systems, this is well worth a read. Another of my favourites is Glynn Winskel’s
    *Formal Semantics of Programming Languages*. Books in this category can be seriously
    challenging, though, so do browse in a library or bookshop to ensure you know
    what you are getting into, before you buy.


    ## Bibliography


    - Brambilla, Marco, Jordi Cabot, and Manuel Wimmer. *Model-Driven Software Engineering
    in Practice*. Morgan and Claypool, 2017.

    - Beck, Kent. *Extreme Programming Explained: Embrace Change*. Addison-Wesley,
    1999.

