    8 How to Make Your Program Clear


    - More specifically, a contract that a chunk of code is guaranteed

    to obey.


    **Terminology: Contract**


    A *contract* for a piece of code is a precise expression

    of something about how the code is supposed to behave.


    A function or method may be given a *pre-condition* and/or

    a *post-condition*. The pre-condition says what the code is

    allowed to assume is true before it is executed; this must,

    therefore, be ensured by any caller of the code. The post-

    condition says what the code will ensure is true after it has

    been executed (provided its pre-condition was satisfied). A

    part of the program that contains some data – such as a class,

    or a loop – may be given an *invariant*, which says something

    must be true “always” (strictly speaking: at certain important

    points, such as the start of the loop, or when a method of an

    object of the class is called).


    For example, if you are writing a function that takes an integer

    argument i, but you have decided (perhaps because it is part of

    the specification of an exercise you are doing) that the function

    will only handle positive integers, you might write


    Precondition: i > 0


    as a comment to warn readers about the assumption.


    - Design notes. For example, if you tried coding something

    the obvious way, found that was too slow, and found a less

    obvious way that was better, you might include a comment to

    explain that.


    - Notes to self. For example, if you have an idea about how you

    might want to improve the program in future, but you don’t want

    to make the improvement right now, you might write a comment

    to remind yourself.


    ## 8.3 Names


    **Tip**


    Names are absolutely crucial. Good choice of names will help

    you, and everyone else, to read the code, and hence reduce the

    number of comments that you need to write.


    Let us start with the part that is easiest to get right: use the-

    conventions that are standard in your language, when you decide

    how to capitalise your names and how to handle names that consist

    of several words joined together. Having a fixed set of conventions

    that you always follow makes you – and anyone else who has to

    edit your program – much less likely to mistype a name, e.g. writing

    do_something when it should have been doSomething. It makes

    it possible to remember a name by how it sounds; you don’t have

    to remember how the words are put together, if by convention

    that is always done the same way. Therefore, pay attention to what

    these conventions are. For example, Java’s conventions include the

    following.


    - Classes begin with a capital letter, e.g. Customer.

    - Attribute names are lower case, e.g. name.

    - Method names are in what is called *camel case*², e.g. doSomething.

    - Classes and attributes are named with nouns or noun phrases. Class names are
    almost³ always singular (Customer, not Customers): the name describes an object
    of the class, not the

    collection of all objects of the class.


    ² Think about the humps! In Python, appropriately, we write method names

    in *snake case*, e.g. do_something, instead.


    ³ The exception is when a single object is best described by a plural noun. E.g.
    a single object of class Preferences might describe all of one user’s

    preferences.


    - Methods are named with verbs, or verb phrases, e.g. doSomething, getName, setName.


    Towards the end of this list we are starting to get to less trivial

    matters: how do you choose a name so that it conveys information

    optimally to the reader? A reasonable question to ask yourself

    is: is there a name that would tell the reader more of what they

    need to know? Do not duplicate type information: avoid calling

    a string variable theString, for example. If you’re working in a

    language where types are explicit in the program text, such a name

    is entirely redundant; and even if you are not, you can probably

    do better. Think about what the thing you are naming is representing. If you were
    explaining the code to someone, what would

    you say about this thing? Can the words you would say become

    its name?


    It is better to use a whole word as a name than an abbreviation,

    unless you are sure that the abbreviation is so standard that every-

    one reading the program will know what it means and expect it

    to be used. This is especially important if there are many related

    names in your program.


    For example, suppose “customer” occurs as part of the name of

    many things in your program, and is sometimes, but not always,

    abbreviated to cust. Then inevitably, a programmer working

    with the code will sometimes guess wrongly whether or not to

    abbreviate it this time. It would be even worse if “customer” were

    abbreviated to cst in a context where “cost” was also sometimes

    involved!


    In order to resist the temptation to abbreviate, learn good ways

    to avoid typing long names too often. An IDE, or a sophisticated

    editor with its autocompletion feature (see Chapter 5), can help

    here. For example, in Eclipse, Ctrl-Space will (usually!) attempt to

    complete the thing you started typing. In Emacs, Meta-/ will do the

    same, rather less intelligently.


    At the same time as avoiding confusing abbreviations, you need to

    stop your lines of code getting unmanageably long, like this:


    **Java example (don’t do this!)**

    verySpecialCustomer.lookupHomeOrHomeBusinessAddress(preferredCustomerId,monthOfTheYear);


    How do you reconcile these conflicting forces? You could solve

    the physical problem of the line being too long by splitting it: see

    the panel at the end of this chapter for more on that. However,

    that would not solve the real problem: the reason why this line is

    too long is that the names are too complex. The key is to choose

    exactly the right names, and to structure your program in such a

    way that everything*has* a name that feels right without being too

    long. That thought takes us beyond local considerations towards

    overall software design; we will have a little more to say about this

    in Chapter 10.


    The further away from its definition the name might have to be

    interpreted, the more important it is that it be informative. Suppose

    you write a function that, because of the rules of the programming

    language, can only be called from inside a particular section,

    it is fine to use single letters. On the other hand, if your function

    can be used anywhere in the program, it better have a meaningful name. I did

    this in the example that opened this chapter, where I chose to use

    a as the name of my setRating method. I could have used a meaningful

    name such as newRating, and some people would consider that better; it’s arguable.
    One thing that is not controversial, is that the use of l as an argument name
    in the “bad” example is awful, because it is too easily confused with digit 1;
    similarly, avoid O and o.

    Adopt any standard conventions that exist in your language about

    which single letters to use in contexts. Typically, i, j, k, n are

    integers, especially loop variables and/or indexes into arrays. s is

    often a string. If you are programming with the head and tail of a

    list, the name for the tail is often the plural form of the head,

    e.g. (x:xs).


    **Tip**


    It is normal to realise, part of the way through writing a

    program, that there is a better name than the one you first

    chose. Welcome this: it’s a sign that you are improving your

    understanding of the problem and the program that solves it.

    Learn good ways to change the name of a variable, for when you

    realise the name isn’t very good. Again, an IDE can make your

    life much easier. In Eclipse, the Refactor menu includes a Rename

    option that works quite intelligently. In an editor, the find-and-

    replace feature is often convenient enough, especially if the name

    you’re trying to change isn’t too short.


