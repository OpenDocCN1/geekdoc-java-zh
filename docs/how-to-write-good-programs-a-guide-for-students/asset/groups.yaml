    values that are special in the task description, or in your solution.


    For example, if your function takes x as input and has an if


    statement that is supposed to do something different depending


    on whether x is less than 100 or greater, make sure you test with


    99, 100 and 101.


    • Think about the classes of inputs: are they all represented? For


    example, if oddness and evenness matters in your program, do


    you have a test of an odd number and an even number?


    • Think about the classes of expected behaviour: are they all repre-


    sented? For example, if your program should return a boolean,


    do you have tests that should return false, as well as tests that


    should return true? (This is curiously easy to forget: it’s a kind of


    *positive bias*.)


    • Whenever you discover a bug in your program, make sure you


    keep a test that would have caught that bug, i.e. that the buggy


    program fails but the fixed program passes. This makes sure you


    never re-introduce the bug. Running such tests is called* regression*


    *testing*: a* regression* is when something goes wrong that used to


    work properly.


    • Test things that should not happen: for example, does your


    program react as well as you want it to, if the user does something


    wrong, like giving input of the wrong type?


    Paradoxically, a successful test is one that finds a bug – because


    any programmer sometimes introduces bugs, and the aim of testing'
