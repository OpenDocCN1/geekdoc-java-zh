- md: "\n## 3 How to Get Started\n\nat once. Let’s look at the Fizz Buzz Python example.\
    \ Suppose you\n\nthink you know how to print the numbers from 1 to n: check that,\n\
    \nbefore you worry about the Fizz and Buzz replacement. You might\n\nimprove your\
    \ function to:\n\n**Python example**\n\n```python\ndef fizz_buzz(n):\n    for\
    \ i in range(1, n):\n        print(i)\n```\n\nAs it happens, there is already\
    \ a tiny mistake here. If you\n\nrun the code now, before there are more complicated\
    \ matters to\n\ndistract you, you will quickly see it: Python’s range function\n\
    \niterates from its lower bound to *one less than* its upper bound, so\n\nfizz_buzz(100)\
    \ will only print the numbers from 1 to 99. We\n\nneed range(1, n+1) instead.\
    \ This is the kind of thing that is easy\n\nto miss if you only check the behaviour\
    \ at the end.\n\nOf course it is always up to you how much code you write\n\n\
    before you check again. Inevitably, sometimes your checking will\n\nshow that\
    \ you have made a mistake: my recommendation is to\n\nkeep your coding steps small\
    \ enough that you are unlikely to\n\nhave made *two* mistakes since your last\
    \ check. It is much easier\n\nto find a single mistake than several that might\
    \ have interacting\n\neffects. Try completing a version of the Fizz Buzz exercise\
    \ in your\n\nlanguage now.\n\n### Skeletons and specifications\n\nWhy does it\
    \ help to work from the outside in? Because the out-\n\nside is usually crucial\
    \ to the *specification* of what you have to do.\n\nFor example, when writing\
    \ a function, the most important thing\n\nto understand is what information goes\
    \ *in* – the arguments, and\n\ntheir types – and what information must come *out*\
    \ – the return\n\nvalue, and its type, plus any other effects your function must\n\
    \nhave. Get the relationship between those right, and you’ve done\n\nit. The outside\
    \ world – the *clients* of your function – will not\n\ncare how you implemented\
    \ the function, provided that when\n\nthey give suitable arguments they get a\
    \ suitable result. This is\n\n*abstraction*, and it’s a key part of programming.\
    \ We’ll return to\n\nthis idea in Chapter 10.\n\nAs you bring your program closer\
    \ to completion, save a version\n\nevery time you have got another small thing\
    \ working. Ideally,\n\ndo this by checking your code into a version control system\
    \ (see\n\nChapter 6), but an alternative is to save copies of your program\n\n\
    file, with informative names to remind you which version is which.\n\nThat way\
    \ you can try things out, secure in the knowledge that if\n\nsomething goes wrong\
    \ you haven’t lost much – you can go back to\n\na recent working state.\n\n##\
    \ 3.5 What to Do If You Get Confused\n\nSometimes you may find you can get the\
    \ skeleton of your code\n\nwritten easily enough, but you feel stumped when it\
    \ comes to\n\ngoing on from there. Perhaps the instructions are confusing, or\n\
    \nperhaps you understand what they mean but have no idea how to\n\nfulfil them.\n\
    \nOne thing I like to do if I am outside my comfort zone is to\n\nmake notes on\
    \ my progress. I often do this by having a file called\n\nnotes.txt in the same\
    \ directory where I am writing the program,\n\nand writing notes to myself in\
    \ this as I go. What I write depends on\n\nwhat it is about the task that seems\
    \ tricky. Faced with a large-scale\n\nproblem where I understand what I have to\
    \ do but am not sure how\n\nbest to write a program to do it, I might write *design\
    \ notes*, planning\n\nout the structure of the code or an *algorithm* (computational\n\
    \nrecipe) I will use. However, generally – and especially for student\n\nbeginners\
    \ – my experience is that it usually works better to develop\n\nthe program itself\
    \ iteratively, testing as you go and improving the\n\nstructure of the program\
    \ as your understanding of the problem and\n\nsolution deepens. In notes.txt I\
    \ more often describe my current\n\nstate of understanding. For example, I might\
    \ write:\n\n**Notes**\n\nFunction foo^a is supposed to do something with strings\
    \ . . .*\n\nI don’t understand the explanation in general . . .* but at least\n\
    \nif it gets a string with only one letter in, it should return True if\n\nthe\
    \ letter is a vowel and False otherwise.\n\na Why foo? See the box at the end\
    \ of this chapter.\n\nEven if I’m wrong about that – I’ve misinterpreted the question\
    \ –\n\nthe fact of typing it prompts me to think about what I do and don’t\n\n\
    understand, and gives me a record of where I got to and what I was\n\nassuming\
    \ at the time, which may be useful later.\n\nWhen confusion threatens, it often\
    \ helps to make your hypothe-\n\nses explicit and test them. For example, if you\
    \ have the feeling that\n\nyour program works OK on simple inputs but has some\
    \ problem\n\nthat’s affecting more complicated inputs, ask yourself what exactly\n\
    \nyou mean by “simple inputs”. Write it down:\n\n**Notes**\n\nHypothesis: the\
    \ program always works correctly on strings with\n\njust one character.\n\nThen\
    \ test your hypothesis with some specific one-character\n\nstrings. Include some\
    \ you think might be tricky, such as a space\n\nor punctuation character. Either\
    \ your program does always behave\n\ncorrectly on one-character strings, in which\
    \ case you can con-\n\nfidently go on to sorting out the bigger issue, or it doesn’t.\
    \ If\n\nit doesn’t, you can now work on the problem of making your\n\nprogram\
    \ the right thing on one-character strings, which is easier\n\nto think about.\
    \ **Tip** Always work on the easiest problem. Once you’ve solved that part, you\
    \ are in a position to ask yourself. Writing automated tests, as discussed in\
    \ Chapter 7, is a really good way to keep track of what works, and what doesn’t,\
    \ may help. Especially when you’re very tired, it’s remarkably easy to get yourself\
    \ into a state where you think certain thing works, but you’re not. If not, you\
    \ can probably at least get yourself into one of two situations:\n\n- There is\
    \ something that you do not understand about what the program is supposed to do.\
    \ Cut it down to the simplest possible case. Are you unsure whether an input is\
    \ allowed at all? Or are there two behaviours that might be expected under particular\
    \ circumstances, and you’re not sure which is right? Reread the problem statement\
    \ with that specific question in mind. If it’s still not clear, it’s probably\
    \ time to ask someone else.\n- There is some specific problem with your program:\
    \ it gives you an error message, or it does not behave the way you expect on some\
    \ input. That is, it contains a bug*. This is the topic of Chapter 9.\n\nEither\
    \ way, analysing your problem is a big step towards solving it. Try to avoid simply\
    \ asking to see a solution: instead, asking for the precise bit of help that will\
    \ let you complete your own solution will serve you better in the long run, and\
    \ be much more satisfying.\n\n### Foo, bar, baz, mung, froboz\n\nThese are names\
    \ commonly used to stand in place of the actual names of functions, variables,\
    \ etc. in conversation, when the actual names are not important, or yet decided.\
    \ For example, if you are discussing how function calling works, you might say,\
    \ “Suppose a function foo calls a function bar . . .*”: here what you are about\
    \ to say applies when any function calls any other function, but you need some\
