  - '[PAGE 83]


    74


    7 How to Test Your Program


    **Terminology: System test**


    A* system test* tests a whole system, using the same interface that


    the system’s users will eventually use. It checks that the system


    as a whole meets its specification.


    To do system testing, we need to run the whole program from


    the outside – invoke it as a user would, give it input as a user


    would, and see whether the outputs and behaviour are what we


    expect. For simple programs you can often do that by using another


    program to start yours, capturing the output, and comparing the


    results. Scripting languages with good string handling facilities, like


    Python or Perl, are good language choices for the testing program.


    Just for fun, here’s an example of using a small program in Perl to


    test a small program that’s written in Python.


    **Perl example**


    $argument = ''Jane'';


    $expected = ''Hello Jane'';


    chomp ($result = \`python greeter.py $argument\`);


    ($result eq $expected)


    or die "Got $result, expected $expected";


    print "Test passed";


    Here the expression in backticks ‘*. . .*‘ invokes the Python pro-


    gram, with the argument we’re testing it on, exactly as we’d do man-


    ually on the command line, and the result is saved in the variable


    $result. (The chomp just removes the newline that finishes the


    program’s output, saving us from having to include that in every


    expected.) Then we compare the actual result with the expected


    result, and complain if the two are different. We show just one test'
