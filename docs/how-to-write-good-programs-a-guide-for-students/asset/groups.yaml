    # How to Write Good Programs

    A Guide for Students


    Perdita Stevens


    ![](img/bbd5a79fa1de374b80fd37c357254796_1_0.png)


    language: to become a good programmer you have to become expert

    at debugging, testing, writing clear code and generally unsticking

    yourself when you get stuck, while to do well in a programming course

    you have to learn to score highly in coursework and exams.


    Featuring tips, stories and explanations of key terms, this book

    teaches these skills explicitly. Examples in Python, Java and Haskell

    are included, helping you to gain transferable programming skills

    whatever language you are learning. Intended for students in Higher

    or Further Education studying early programming courses, it will help

    you succeed in, and get the most out of, your course and support you in

    developing the software engineering habits that lead to good programs.


    **Perdita Stevens** is a professor at the University of Edinburgh and

    has taught programming and software engineering in many languages

    to students ranging from first-year undergraduates to established

    professional software developers. She previously co-authored* *Using*

    *UML: Software Engineering with Objects and Components* (1998) and

    received a 10-year Most Influential Paper award and a Best Paper

    award at the MODELS conference in 2017 for her work on bidirectional

    transformations.


