    How to Improve Your Program


    We have talked about how to debug your program (Chapter 9)


    and about the basics of making your program clear and read-


    able (Chapter 8). What else could we mean by “improving” your


    program?


    We’re touching here on* design*. In software engineering, design is


    about building software that not only meets the requirements, but


    does so in the best possible way. There are many ways we can judge


    how good a design is. Two of them are:


    • how* maintainable* your program is;


    • how* efficient* your program is.


    Let’s discuss these aspects in turn, and then we’ll discuss how you


    can get to there from here. That is, if your program works, but you


    decide it could, and should, be more maintainable or more efficient,


    how can you safely improve it, without breaking it in the process?


    To do that you use the technique (briefly mentioned in Chapter 9)


    called* refactoring*.


