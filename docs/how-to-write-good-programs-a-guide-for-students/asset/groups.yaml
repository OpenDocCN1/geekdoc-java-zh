    ## 12.5 演示 (Demonstrations)


    175 获得分的关键在于理解分数是如何分配的。每个人的分数仅取决于共同开发的软件质量吗？还是有某种机制旨在确保每个团队成员都做出了贡献？有时，你可能被要求估算每个团队成员付出了多少精力，这些估计可能会影响分数的分配，例如。


    学生团队往往会发现其中有一一两个成员的实力（无论是技能还是投入程度上）远强于其他成员，以至于最大化软件编写质量的方法，就是让他们带领团队中的其他成员，由他们编写或重写全部或大部分的软件。这种情况对每个人来说都很难处理。如果你是团队中实力强大的成员之一，你需要决定自己愿意在自己的“公平份额”之外多做什么程度。如果你能诚实地说，替他们做工作不会对你同事的分数产生帮助，那就越好了。如果你在这种情况下是团队中实力较弱的成员之一，记住长远来看很重要：你*不仅*想在这个练习中获得高分，你还想提高自己的技能。因此，确保自己编写了相当数量的程序，即使你有一位可以做得更好的团队成员。


    为了大家的利益，团队应该尝试确保成员之间互相教如何解决问题，而不仅仅是解决问题。这有助于任何时候被教的成员，但可能对负责教学的团队成员帮助更大。“学习某东西最好的方法是教它”这句老生调是有其原因的：它是绝对真理。更广泛地说，团队内部友好且合作的互动有助于你提高人际交往技巧，这也是这次练习的目的之一。


    你可能被要求演示你的代码运行情况，并与人讨论，这作为过程的一部分。这可以是有趣的，特别是当你做了一些令你自豪的决定时：你将有机会引起评分者可能会忽略的内容的关注。这也可能给你提供一个很好的机会，提到任何你想获得特定反馈的方面。


    如果不需要产生书面作品，可能很难说服自己花时间准备演示是有必要的。为了确保体验顺利，请务必检查以下几点：


    1. 演示在什么时候、哪里进行？

    2. 谁需要现场？例如，在团队项目中，是团队里的所有人，还是只需要一个人演示？

    3. 关于时时间和格式，你们被告知了什么？例如，如果你必须预计划演示，它必须有多长，必须涵盖哪些内容？

    4. 你将使用与你习惯的相同的计算机和软件环境吗？如果有任何细微差别，如果可能，请先在演示环境中进行练习——很容易被细节难住，例如没有可用的你常用的 IDE。

    5. 如果你必须将笔记本电脑连接到数据投影仪，你知道如何成功连接吗——例如，如果你需要特殊的适配器，你手里有一个吗？

    6. 演示本身（而不是你所演示的程序）是否会被评分？如果是，你对评分标准了解多少？


    请注意，要求学生演示其代码运行的原因之一，是为了获得对学生确实编写了代码的信心：其基本假设是，如果（并且仅当）他们编写了代码，他们将能够解释代码是如何运行的。这是可以争论的——但无论如何，确保你理解代码是如何运行的是一件好事！


    向他人（例如同学）提前预演演示是一个非常好的主意；许多人发现演示是非常紧张的，而练习是平复紧张最好的方法。随着你的练习，你可能会发现一些想要改进的小细节；例如，当你尝试向别人解释你的代码时，你可能会发现代码写得并没有预想中那么清晰。


    **提示**

    永远不要假设你最后做的某个改动“绝不可能产生任何影响”。如果你更改了程序的*任何*部分，请重新运行一遍演示，以检查一切是否仍按照你的预期正常工作。


    ## 12.6 反思性写作 (Reflective Writing)


    如果你被要求写关于做编程练习的经历，你可能会感到惊讶，但这种情况经常发生。至于演示，原因之一是课程组织者担心你是否真的写了你所提交的代码。他们认为，通过让你写下这段经历，可以降低你只是抄代码或购买代码的风险。从不那么愤俗的角度来说，这类写作练习也旨在通过反思和将任何教训显性化，帮助你巩固从编程中学到的知识。


    当然，你必须遵循关于要包含内容的任何指令。但通常，评分者会寻找至少这三点：


    - 一些足够具体的内容，使其与你的代码相关而非他人的代码。所以，请提及你代码的结构元素名称，并解释为什么要这样结构。

    - 一些证明你学到了东西的证据，并且你知道那是什么。所以，说出你学到了什么！

    - 清晰的写作——不仅因为清晰的写作更容易让评分者阅读，还因为清晰写作的能力是整个课程试图给你的关键“可迁移技能”。


    每个人对反思性写作的体验不同。如果你发现它确实能帮助你巩固脑中中学到的知识，请记住这一点。在这种情况下，也许你可能想定期进行一些反思性写作，即使没有要求？有些人喜欢为这类事情准备一个学习日志。另一些则宁愿在冰冷的糖浆中划水也不愿做这种事。


