    ## 10.4 Improving Your Skills


    **Laziness** I once had a mathematics teacher who used to say “Mathematics is
    the art of being lazy”, because so much of mathematics is about finding easy ways
    to do things that would be hard if you did them the obvious way.


    It’s a similar idea: a great programmer thinks about how they can spare themselves
    work in future, and so writes the program in a way which will be as easy to change
    as possible. Even better, the great programmer makes full use of high-quality
    libraries: if someone else has already written the code you would have to write,
    you may save the effort of writing the program at all.


    **Impatience** is the necessary counterweight to laziness. It is the quality that
    drives you to improve the efficiency of your program, for any kind of efficiency
    that’s relevant to you at present. It is, for example, the quality that forces
    you to investigate when your program runs for longer than it reasonably should
    take (time efficiency). It is also the quality that tells you it is intolerable
    to have to change your code in five places for what is really only one reason,
    so that you had better improve its design so that you never have to do that again
    (maintainer efficiency).


    **Hubris** means excessive pride. This is the quality that makes you want to write
    programs so good that everyone will admire them, and gives you confidence that
    you can.


    At the time of writing, there is a video on YouTube entitled “Hobbits Would Make
    Great Programmers” in which Larry Wall explains that programmers should have the
    characteristics he attributes to hobbits:


    - lazy in a very industrious way;

    - impatient in a very patient way;

    - proud in a very humble way.


    ## 11 How to Get Help (without Cheating)


    What do you do when you’re totally confused or stuck? Your program doesn’t work,
    and you don’t understand why, or you don’t understand even how to start your next
    exercise. What now?


    The first rule is


    **Don’t Panic!**


    I apologise if that, or anything else in this chapter, seems patronizing; but
    the fact is, many students in this situation *do* panic. They may give up, failing
    to submit coursework or going into exams knowing that they will fail, or dropping
    out of their courses. Some may cheat: they may copy someone else’s answers, or
    even get someone else to do the work for them.


    Here’s what to do instead. First, identify what kind of problem you have.


    1. Have you been struggling for weeks, maybe getting by with a lot of help from
    friends, or by looking at model answers, but have you now hit a wall?

    2. Or are you generally doing fine, but feeling confused at the moment?


    For example, are you confident that you completely understand the last program
    you wrote, and that you could write it again from scratch without help? If yes,
    you are likely to be in the second situation; if no, you may be in the first.


    ### 11.1 Solving a General Problem


    **Tip**

    The learning skills you will practise as you sort yourself out are very important
    ones. They are more important than any individual programming skill, and will
    help you learn the next programming skill more easily and with less stress. So
    don’t see the time you spend on sorting yourself out as wasted – it may be the
    best time you spend.


    Let’s discuss how to tackle the more serious situation first.


    If you are out of your depth and it’s not just the current programming exercise
    you can’t do, but the previous one and maybe the one before that, you need to
    take radical action. Look back through the exercises you’ve been set, or the exercises
    in your textbook, going backwards in time towards when you began learning the
    language. Stop when you find a collection of exercises that you’re *sure* you’re
    *completely* confident about, or at the beginning if that never happens (in that
    case, take the very first set of exercises in what follows). If in doubt, start
    at the easier set.


    **Programming exercises**

    You need a graded sequence of programming exercises, because you cannot learn
    to program without programming. You are probably given one as part of your course,
    but if not, find a textbook or an online course for your language that includes
    exercises.


    (“But I don’t have time for this! My coursework is due in [time]!” Yes, you do.
    This process will get you unstuck. If you’re in a significant mess, you can’t
    submit your coursework honestly without doing something like this, and submitting
    it dishonestly will land you in worse trouble. Bear with me.)


    Now, without looking at any previous answer you or anyone else *created*, do an
    exercise from this set. Next you need to check your answer. If you have tests
    available, or an automatic marker, run them, and be satisfied only if they show
    no problems. Otherwise, look at a model answer if you have one: but *first*, search
    your innermost being for the answer to this question: *Do you completely understand
    every line you wrote?* and proceed only after you’ve answered that question with
    “yes”.


    The reasoning is that if you honestly answer “yes”, then you should be in good
    shape to understand any respect in which the model answer differs from your answer,
    and see whether yours is equally correct or not.


    If – which is quite likely – you find that you have some uncertainty even at this
    level where you thought you were completely confident, congratulate yourself on
    having discovered that. Make a mental note that sometimes your brain fools you
    into thinking you thoroughly understand something, when you don’t (this is normal).
    Go back as far as you need to.


    Right, now you’re either right back at the start, or you’re at a point where you
    *know* you can do the work up to the point where you are. Now you go forwards,
    but you need to try not to skip over things you don’t understand, or you’ll be
    no better off. The level of risk you undertake may depend on your circumstances,
    though.


    **Catching up properly** If you can possibly find the time, go forward from here
    with the mindset that, this time, you’re going to understand *everything* fully.
    Take the next chunk of your course, after the bit you definitely get. Maybe that’s
    the next week, or the next chapter. Reread your notes, watch any relevant videos,
    read relevant sections of the textbook. As you do this, make a list of points
    you don’t yet fully understand. Follow them up, if necessary using the techniques
    in Section 11.2 below. Once you feel confident, tackle one or two problems from
    the next set of exercises. You do not necessarily need to redo every exercise
    from every set, but you do need to get to the point where you feel confident that
    you could. Perhaps you might choose which exercises to tackle randomly, in order
    to avoid subconsciously avoiding the hard ones. Keep going forward on a solid
    base. This is a great thing to do with a peer: you might try pair programming
    your way through some past exercises, taking it in turns to be the one at the
    keyboard.


    **Terminology: Pair programming**

    *Pair programming* is when two people program together at one computer. One of
    them is in charge of the actual typing, while the other acts as lookout: is the
    program going in the right direction, and are there any rocks ahead? That is,
    is the person typing following a strategy that will lead to a good program, and
    are there any problems or bugs?


    Pair programming is a practice which is sometimes used by professional programmers
    (especially in agile development), because, even though it takes more time, it
    can lead to higher-quality programs. As a student, you may find it a good way
    to learn.


    **Skimming** If you’re really, really pushed for time, you can try taking a shortcut
    like this, but be aware that it has risks and may backfire. Go forward identifying
    the *key points* of the material, and checking that you understand them, but being
    prepared to skip over things that don’t seem relevant to the exercise you’re stuck
    on. For example, if you find a section of your notes that’s about how to read
    from standard input, and your exercise doesn’t require doing that, you could skip
    that section for now. Do, however, make a note to remind yourself to go back to
    it later.


    Compared with catching up properly, skimming can save you time, but the risk is
    that you may not be reliable at identifying what’s relevant – later material tends
    to depend on earlier material in ways that aren’t always completely obvious.

    '
