    **9.4**** If All Else Fails**


    Sometimes, however, you find the only sensible reaction to your


    problem is “don’t start from here”. If trying to localise and under-


    stand your bug reveals to you that your program is a horrible mess


    that you can’t understand, you could consider:


    • starting again from scratch, this time testing as you go (see


    Chapter 7) and keeping your program clear (Chapter 8);


    • refactoring (more on how to do this in Chapter 10).


    **Terminology: Refactoring**


    To* refactor* a program is to change it without changing its


    functionality. You might do this to make the program easier


    to understand or easier to change.


    This is not the ideal time for refactoring – ideally, you would


    start with a program* you* completely understood, but wanted to


    improve, e.g. to make it easier for* other people*, or yourself at a


    later date, to understand – but sometimes it may be the best of a


    bad bunch of options. When I have lost a thing, and have failed


    to find it in the first few places I look, I often take this as a sign


    that I need to calm down and tidy up generally. Almost always,


    this is as efficient as any other way of finding the lost item, and


    it improves my environment as well. Sometimes the analogous


    strategy works in programming.'
