    **5**


    How to Use the Best Tools


    In the earliest days of computing, programs took the form of


    punched cards that had to be fed into a computer, and program-


    ming was slow work. Naturally, the programmers, who understood


    the power of computers, wanted computers to help make the


    work of programming easier, faster and more reliable. These days,


    there is a wide – and constantly changing – assortment of tools


    to support the software development process. Some tools – e.g.


    compilers – perform a clearly delineated task; others, especially


    *integrated development environments*, bring together many capabil-


    ities and present a uniform interface to them. Learning to make


    good use of tools is an important part of learning to write good


    programs.


    Programming courses vary a lot in how much instruction they


    give on tool use. You may be told precisely what to use and how, or


    you may get a suggestion of what tool to use but be left to find out


    about its capabilities yourself, or you may be completely on your


    own. Naturally, to whatever extent learning to use a particular tool


    is part of your course, you need to do that; but it is also useful


    to have a broader view of what is available. When you program


    outside or beyond your course, you may be able to choose the


    tools you prefer. If you plan a career in software development,


    you will need to be able to adapt to whatever tool set is in use


    in the organisation where you work. Widening your experience is


    worthwhile, both to let you make good choices when you can, and


    to give you the skills to fit in when you must.


