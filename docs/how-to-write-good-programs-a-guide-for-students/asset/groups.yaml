- md: "\n## 7.4 What Tests Should You Have?\n\n- If the task description included\
    \ some examples to explain what was wanted, you should definitely include those\
    \ examples in your test set.\n- Include the simplest possible inputs to your program.\
    \ If your program takes an integer, what should it return if you give it 0? 1?\
    \ −1? If it takes a string, what should it do with the empty string? With a single-character\
    \ string?\n- Are any values obviously risky, i.e. do they feel like inputs likely\
    \ to expose a problem? These are often those that are at or close to values that\
    \ are special in the task description, or in your solution. For example, if your\
    \ function takes x as input and has an if statement that is supposed to do something\
    \ different depending on whether x is less than 100 or greater, make sure you\
    \ test with 99, 100 and 101.\n- Think about the classes of inputs: are they all\
    \ represented? For example, if oddness and evenness matters in your program, do\
    \ you have a test of an odd number and an even number?\n- Think about the classes\
    \ of expected behaviour: are they all represented? For example, if your program\
    \ should return a boolean, do you have tests that should return false, as well\
    \ as tests that should return true? (This is curiously easy to forget: it’s a\
    \ kind of *positive bias*.)\n- Whenever you discover a bug in your program, make\
    \ sure you keep a test that would have caught that bug, i.e. that the buggy program\
    \ fails but the fixed program passes. This makes sure you never re-introduce the\
    \ bug. Running such tests is called *regression testing*: a regression is when\
    \ something goes wrong that used to work properly.\n- Test things that should\
    \ not happen: for example, does your program react as well as you want it to,\
    \ if the user does something wrong, like giving input of the wrong type?\n\nParadoxically,\
    \ a successful test is one that finds a bug – because any programmer sometimes\
    \ introduces bugs, and the aim of testing is to detect them as soon as possible.\
    \ When you write tests, you should be trying to get your program to misbehave.\
    \ This can be quite hard – if you wrote the program, it’s natural to want it to\
    \ succeed and the subconscious temptation is to give it easy tests!\n\nIf you’re\
    \ doing a course, you might like to imagine your mean instructor trying to take\
    \ marks off you. If you find the bugs first, your instructor will not. Often,\
    \ even in settings where it would not be allowed to show your code to another\
    \ student, it will be allowed to show your tests to one another. Could you get\
    \ together with some friends and pool your tests, making it a friendly competition\
    \ to cause each other’s programs to misbehave?\n\n### The Lauren bug\n\nMargaret\
    \ Hamilton, who worked on the Apollo space missions and led the team developing\
    \ software for the first moon landing, has one of the earliest stories about how\
    \ vital it can be to test what should not happen. She tells in an interview (Corbyn,\
    \ 2019) how she once took her small daughter Lauren to work with her, and Lauren,\
    \ pressing keys randomly, caused a mission simulation to crash by invoking a procedure\
    \ at the wrong point. Hamilton was concerned that an astronaut might do the same\
    \ thing for real, and thought the software should be changed to prevent it. Senior\
    \ people at MIT and NASA said that real astronauts would never make such a mistake\
    \ – until they did, at which point the software was changed!\n\n## 7.5 When Should\
    \ You Write Tests?\n\nSome expert readers will complain that I should have introduced\
    \ testing much earlier. The reason I chose not to is that in order to write tests\
    \ you have to be able to program a bit; you have to start somewhere. Now that\
    \ you have the skills to write tests, though, you should seriously consider adopting\
    \ test-driven development and using it for the rest of your life.\n\n## 7.6 Property-Based\
    \ Testing\n\n### Terminology: Test-driven development\n\n*Test-driven development*\
    \ (TDD) goes like this:\n\n1. Write a test that you would like to pass, but fails.\n\
    2. Write just enough code to make all the tests pass.\n3. Improve the code if\
    \ possible, and check that the tests still pass.\n\nYou do this from the very\
    \ beginning – so the very first code you write is a test – and repeat until the\
    \ program is finished, i.e. it passes every test it should pass and cannot be\
    \ improved.\n\nBy writing the test before you write the code that it is testing,\
    \ you check that you understand exactly what the code should do. By writing just\
    \ one test at a time, you keep your increments small, so that if you make a mistake\
    \ it is easy to understand and fix. By rerunning all of the tests each time, you\
    \ ensure that you don’t break previously working code.\n\nPeople who adopt TDD\
    \ are often evangelical about it, and you will even hear it said that it is irresponsible\
    \ to use any other approach. Still, many expert and professional developers do\
    \ not use it. I think, in reality, that how well it works depends more on what\
    \ code you are writing, and in what environment, than the evangelists sometimes\
    \ acknowledge. Perhaps, too, part of the reason it isn’t universal yet is that\
    \ some people actively enjoy debugging their code. Using TDD makes you less likely\
    \ to introduce bugs into code.\n\n### 7.6 Property-Based Testing\n\nAn approach\
    \ that began in the world of Haskell but has been spreading to other languages,\
    \ is known as property-based testing. The original tool is QuickCheck, for Haskell.\
    \ The idea is that your program, given some specification, is automatically checked\
    \ using inputs. If your program has a bug, there is a decent chance that QuickCheck\
    \ will find it by, say, 10,000 inputs, at least one of them will demonstrate the\
    \ bug.\n\nGenerally, such simple, partial properties can be easy to write and\
    \ very useful for catching the kind of errors programmers typically make. Suppose\
    \ someone misunderstands the specification, and instead of returning a list of\
    \ the prime factors with multiplicity, their factor returns a list of the distinct\
    \ prime factors, so that given 18 it returns [2,3]. When I wrote that buggy factor\
    \ and used QuickCheck to check the property prop\\_factor, I saw:\n\n**Haskell\
    \ example**\n\n```haskell\nimport Test.QuickCheck\n\n-- function factor omitted\n\
    \nprop_factor :: Int -> Bool\nprop_factor i = product (factor i) == i\n```\n\n\
    The function prop\\_factor takes an integer, and returns true if, on that integer,\
    \ function factor returns a list which satisfies a basic property: multiplying\
    \ together the supposed prime factors does produce the original integer. If some\
    \ test of this property fails, there is definitely a problem with the function.\
    \ However, prop\\_factor does not catch all possible problems that the function\
    \ could have. For example, it does not check that the elements of the list that\
    \ factor returns are really prime numbers. Indeed, the factor function that simply\
    \ returned the one-element list containing just its input would always pass.\n\
    \n- “A successful test is one that finds a bug.”\n  *Anon.*\n\nYou need to put\
    \ yourself into the frame of mind where you *want* your program to fail – otherwise,\
    \ you risk only writing the tests that your program will pass, which is pointless.\n"
  mdcn: '


    ## 7.4 你应该进行哪些测试？


    - 如果任务描述中包含了一些示例来解释需求，你绝对应该将这些示例包含在你的测试集中。

    - 为你的程序包含尽可能简单的输入。如果你的程序接收一个整数，当你给它 0、1 或 -1 时，它应该返回什么？如果它接收一个字符串，它应该如何处理空字符串？单字符字符串又该如何处理？

    - 是否某些值显然是有风险的，即：它们感觉像是可能暴露问题的输入值？这些值通常是那些处于或接近任务描述或你的解决方案中特殊值边界的数值。例如，如果你的函数接受
    `x` 作为输入，并有一个 `if` 语句旨在根据 `x` 是否小于 100 或大于 100 执行不同的操作，请确保你测试了 99、100 和 101。

    - 考虑输入的类别：它们都覆盖了吗？例如，如果奇偶性在你的程序中很重要，你是否准备了针对奇数和偶数的测试？

    - 考虑预期行为的类别：它们都覆盖了吗？例如，如果你的程序应该返回一个布尔值，你是否既有应该返回 `false` 的测试，也有应该返回 `true` 的测试？（这奇怪地容易被忘记：这是一种*正偏偏*。）

    - 每当你发现程序中存在 bug 时，务确保保留一个能够捕获该 bug 的测试，即：有错误的程序失败而修复后的程序通过的测试。这确保了你永远不会再次引入该
    bug。运行此类测试被称为*回归测试*：当原本运行正常的东西出现问题时，就发生了回归。

    - 测试不应该发生的情况：例如，如果用户执行了错误操作（如提供错误类型的输入），程序的反应是否符合你的预期？


    与其矛盾的是，一个成功的测试是能发现 bug 的测试——因为任何程序员有时都会引入 bug，而测试的目标就是尽早检测它们。当你编写测试时，你应该尝试让你的程序表现异常。这可能相当困难——如果你是你自己写的程序，自然会希望它成功，而潜意识里的诱惑就是给它一些轻而通过的测试！


    如果你正在上某门课程，你可能会想象你那位刻板的老师正试图扣你的分。如果你先发现了 bug，老师就不会发现。通常，即使在不允许向另一名学生展示代码的环境下，也允许互相展示测试。你不能和朋友们聚在一起汇总你们的测试，把它变成一场友好的竞争，让对方的程序产生异常吗？


    ### Lauren bug


    玛格丽特·汉密尔顿（Margaret Hamilton）曾参与阿波罗太空任务，并领导了开发首次登月软件的团队，她拥有关于“测试那些不应该发生的情况有多重要”的最早故事之一。她在一次采访（Corbyn,
    2019）中提到，她一次带着小女儿 Lauren 去上班，Lauren 随机按下按键，在错误点调用了一个过程，导致任务模拟崩溃。汉密尔顿担心航员在现实中可能会做同样的事，认为应该修改软件来防止这种情况发生。MIT
    和 NASA 的高层曾说真正的航员永远不会犯这种错误——直到他们真的犯了，那时软件才被修改了！


    ## 7.5 你应该什么时候编写测试？


    一些专家读者会抱怨，我应该更早地引入测试。我选择不这样做的原因是，为了编写测试，你必须具备编程能力；你必须从某个地方开始。既然你现在已经拥有了编写测试的技能，你应该认真考虑采用测试驱动开发，并在余生中中使用它。


    ## 7.6 基于属性的测试


    ### 术语：测试驱动开发


    *测试驱动开发*（TDD）的流程如下：


    1. 编写一个你希望通过但目前会失败的测试。

    2. 编写恰好的代码让所有测试通过。

    3. 如果可能，改进代码，并检查测试是否仍然通过。


    你从最开始就这样做——所以你写的第一行代码是一个测试——并重复这一过程，直到程序完成，即它通过了所有应该通过的测试，且无法进一步改进。


    通过在编写被测试的代码之前先编写测试，你确保了自己完全理解代码应该做什么。通过一次只写一个测试，你保持了增量是微小的，这样即使你犯了错误，也容易理解和修复。通过每次重新运行所有测试，你确保了不会破坏之前运行正常的代码。


    采用 TDD 的人往往对其如传教徒一般，你甚至会听到有人说使用任何其他方法都是负责任的。尽管如此，许多专家和专业开发者并不使用它。我认为，现实中，它的效果在很大程度上取决于你正在编写什么样的代码以及在什么环境下编写，比传教士有时承认的要多。也许，它尚未普及的原因之一是，有些人实际上非常喜欢调试自己的代码。使用
    TDD 会让你不太可能在代码中引入 bug。


    ### 7.6 基于属性的测试


    一种起源于 Haskell 世界但已扩展到其他语言的方法被称为基于属性的测试（property-based testing）。原始工具是针对 Haskell
    的 QuickCheck。其核心思想是：在给定规范的情况下，使用输入自动对程序进行检查。如果你的程序有 bug，QuickCheck 有很大概率通过例如 10,000
    个输入发现它，即其中至少有一个输入就能演示该 bug。


    通常情况下，这种简单的、部分的属性很容易编写，并且对于捕捉程序员通常会犯的错误非常有用。假设某人误解了规范，他们没有返回包含重因数的质因数列表，他们的函数反而返回了互不相同的质因数列表，因此给定
    18 时它返回了 [2,3]。当我写了那个有错误的函数并使用 QuickCheck 检查属性 `prop_factor` 时，我看到了：


    **Haskell 示例**


    ```haskell

    import Test.QuickCheck


    -- 省略 factor 函数


    prop_factor :: Int -> Bool

    prop_factor i = product (factor i) == i

    ```


    函数 `prop_factor` 接收一个整数，如果在该整数上，函数 `factor` 返回的列表满足一个基础属性，则返回 `true`：即假设的质因数的乘积确实等于原始整数。如果该属性的某个测试失败，说明函数确实存在问题。然而，`prop_factor`
    并没有捕获函数可能存在的所有问题。例如，它没有检查 `factor` 返回的列表中的元素是否真的是质数。事实上，一个简单返回包含输入本身的单元素列表的 `factor`
    函数总是通过的。


    '
