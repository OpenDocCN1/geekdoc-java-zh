    **Terminology: Null pointer exception**


    In Java (and related languages such as C and C++),* null pointer*


    *exceptions*, abbreviated NPEs, are the commonest cause of


    crashes. An NPE arises when your code attempts to dereference


    a reference – we may equivalently say, follow a pointer – whose


    value is null. What does this mean? A reference (or pointer) is


    a name which can be used to refer to a piece of state, e.g. an


    object. To dereference (or follow) it is to use the name to access


    the state, e.g. send a message to the object. Problems arise


    if your code does this when, in fact, the reference does not


    currently name any state at all – that is, when the reference is


    null. Because nothing sensible can be done – you can’t send


    a message to an object that isn’t there – an exception will be


    raised, and (unless your code also* catches* the exception and


    does something to recover) your program will crash.


    A particularly useful kind of error output that you may see


    following a crash – but one that beginners often find intimidating,


    and therefore fail to use to full advantage – is a stack trace.


    **Terminology: Stack trace**


    A stack trace is an ordered list of all the methods or functions


    that the program has entered, but not exited.


    The first thing to do is to check that you understand which


    order the list is given in. The most recently entered function may'
