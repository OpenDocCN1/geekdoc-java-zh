- md: "\n## 7 How to Test Your Program\n\n- “Every bug found in testing is one the\
    \ customer doesn’t find.”\n*Anon.*\n\nFor people who have customers they care\
    \ about, this idea can help motivate them to get into the right frame of mind.\
    \ Of course, it’s only really true if you go on to fix the bug, and keep it fixed*\
    \ . . .* which is one reason for doing*systematic* testing. When you’re a student,\
    \ you may find it useful to think of the person who is going to mark your work\
    \ as the customer.\n\n- “Program testing can be used to show the presence of bugs,\
    \ but never to show their absence!”\n*Edsger Dijkstra* (Djikstra, 1970)\n\nThe\
    \ philosophical point here is that if your program has infinitely many possible\
    \ inputs, and you only run finitely many tests, then in principle, it might still\
    \ fail on some input you haven’t tested. To be sure that your program works on\
    \ every input, you have to study the code of the program and prove that it is\
    \ correct. There’s a large field of study of software testing concerned with how\
    \ to pick enough of the right tests to be sure that if certain kinds of bug existed\
    \ in the program, we would find them. For a start, you’d like to have every line\
    \ of your code, that could ever be run, run in the process of doing some test\
    \ – otherwise, a line that was missed out might contain a bug.\n\n- “Beware of\
    \ bugs in the above code; I have only proved its correctness, not tried it.”\n\
    *Don Knuth* (Knuth, 1977)\n\nThis tongue-in-cheek antidote to the Dijkstra quotation\
    \ above reminds us that proof, like programming, is a human activity. Unfortunately,\
    \ there can be bugs in your proof, just as there can be bugs in your program.\
    \ Especially, it’s easy to incorporate the same mistaken assumptions into both!\n\
    \n## 8 How to Make Your Program Clear\n\nIn discussing what a “good program” is\
    \ (Chapter 2), we claimed it should be clearly written. It is natural that when\
    \ you start to learn to program, you focus on making your program correct. You\
    \ may find yourself resenting any suggestion that your correct program could still\
    \ be improved: if it does what it is supposed to do, isn’t that all that matters?\
    \ In this chapter we explain why it is very much in your interest to write your\
    \ code as clearly as possible, and discuss how to do so.\n\n### 8.1 How Will Writing\
    \ Clear Code Help You?\n\nWe said that a program is a set of instructions for\
    \ a computer, and of course it is that – but even more importantly, the program\
    \ is an explanation for a human reader of what the computer is being instructed\
    \ to do. That reader might be you, as you initially write the code; someone trying\
    \ to mark your code, or give you help with it; or someone (perhaps you, later)\
    \ trying to improve it or extend it. The better your code communicates what the\
    \ computer will do, the easier all of these tasks will be.\n\n**Tip**\nAlways\
    \ make your code as easy to read as you can. Even if you have to spend some time\
    \ clarifying it, you will save time overall, as it becomes easier to keep your\
    \ code correct.\n\nAt the beginning of their programming lives, people usually\
    \ under-estimate the importance of this topic. There is a tendency to think that,\
    \ since you are a beginner and not using advanced features of the language, any\
    \ code that you can write will automatically be easy for an expert – or for you,\
    \ on a later occasion – to read. However, when you write code, you may be holding\
    \ in mind a lot of information, accumulated as you consider the problem and how\
    \ to solve it. Someone reading the code later does not start with the same mental\
    \ state. Moreover, the feeling that you understand what you have written can be\
    \ misleading: striving to write your code as clearly as possible will minimise\
    \ the risk that you have overlooked some mistake.\n\nConsider a simple Java exercise:\
    \ the setAgeRating method in a Film class. Any Film has an ageRating which has\
    \ to be one of 12, 15 or 18. This setAgeRating method takes an integer argument.\
    \ If the argument is one of 12, 15, 18, then this is to be saved as the new value\
    \ of the Film’s ageRating. Otherwise, the method is supposed to do nothing.\n\n\
    Here’s an example¹ of how *not* to write this method:\n\n**Java example (don’t\
    \ do this!)**\n```java\npublic void setAgeRating(int l){\n    if(l==12){\n   \
    \     this.ageRating= 12;}\n    else if(l == 15)\n    {this.ageRating =15;}\n\
    \    else{this.ageRating = 18;}\n}\n```\n1 Adapted from real student code by improving\
    \ it.\n\nHere’s a better (though arguably still imperfect) version.\n\n**Java\
    \ example**\n```java\npublic void setAgeRating(int a) {\n    if (a == 12 || a\
    \ == 15 || a == 18) {\n        this.ageRating = a;\n    } // otherwise, do nothing\
    \ at all.\n}\n```\n\nBefore you read on, compare the two versions. What problems\
    \ can you see with the first?\n\n### 8.2 Comments\n\nWe will start with the topic\
    \ of comments, because it seems to be what people ask of first, to make your code\
    \ clearer. In the example above, I chose to include a comment “otherwise, do nothing\
    \ at all.” Why? Because I found it slightly surprising that, if you were not 12,\
    \ 15 or 18, we were supposed to do nothing – I added a comment. This is to some\
    \ extent a matter of choice: if you find this helps you to think straight, go\
    \ ahead. But the secondary issue is that sometimes people write comments while\
    \ their understanding of it is still changing.\n\n**Tip**\nDon’t write too many\
    \ comments, especially early on. The reason is two-. The most important is that\
    \ people often write comments to explain lines of code that are unclear to them.\
    \ It’s much better to rewrite the code, paying attention to issues discussed in\
    \ this chapter, rather than adding a comment.\n\n“If the code and the comments\
    \ disagree, both are probably wrong.” own*Norm Schryer* (attributed, Bentley,\
    \ 1988)\n\nBear this in mind when you read other people’s code, but especially\
    \ when you write yours. A question which you will encounter early on is: what\
    \ should you assume about the readers? Should you assume they are experts in the\
    \ language, for example? If you are programming while taking a programming course,\
    \ you, yourself, are probably the most important reader.\n\nAn implication of\
    \ this is that it’s OK to write comments that someone who was more expert in the\
    \ language than you would not need. People often sneeze at comments that explain\
    \ how a language feature is being used, on the grounds that you should be able\
    \ to assume the reader is competent. Indeed it’s easy to go too far, and end up\
    \ with code like:\n\n**Java example (don’t do this!)**\n```java\ni++; // add 1\
    \ to i\n```\nThat really is excessive. However, I have found that when I learn\
    \ a new programming language, it’s often helpful to add a comment the first time\
    \ I use a tricky language feature or library function. If I avoid doing so, too\
    \ often I end up forgetting about it and having to look it up again order to understand\
    \ my own code. I tend to see such comments as temporary, and for my eyes only,\
    \ and I take pleasure in deleting such comments later, once I’m confident I have\
    \ internalized the point in question. This brings us to the observation that there\
    \ are different kinds of comments which serve different purposes. You may find\
    \ it helpful to distinguish them in your mind. We just discussed comments whose\
    \ purpose is to support someone new to the language or software environment. Other\
    \ kinds of comments include:\n\n- Documentation of chunks of code. For example,\
    \ you might write a comment above a function definition to explain what the function\
    \ does, or close to a calculation to explain why this is the right calculation\
    \ to do.\n"
