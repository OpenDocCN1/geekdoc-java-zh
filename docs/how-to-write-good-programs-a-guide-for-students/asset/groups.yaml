    ## 6.6 Backups and the Cloud


    **Tip**


    If you find yourself reluctant to delete a chunk of code that is not useful to
    you right now because you think you *are* going to need it – for example, it solves
    a problem you expect to have again, and you had to look up something tricky to
    get it right – then by all means do save it. Just don’t save it inside a program
    where it is useless. I sometimes make a subfolder called CuttingRoomFloor for
    possibly useful snippets.


    **6.6 **Backups and the Cloud**


    Making copies of your files, or using a version control system, can be an effective
    way to guard against losing your program because of your own accidental deletions.
    But what if the copies of the files, or the central repository of your version
    control system, are all stored on the same computer that you are working on, and
    then this computer dies, or is lost or stolen? In order to recover your work,
    you need it to be *backed up* in some way: that is, there needs to be a copy of
    the important files on some other computer, or on some external medium. If you
    are using a computer that is provided by your university or college, it is likely
    – but not certain! – that your files are automatically being backed up for you,
    and that there are computing support staff who can restore them for you if disaster
    strikes. If you are using your own equipment, you need to make your own arrangements
    to reduce the risk that you lose important work. As with version control, there
    is a range of approaches, from the fully manual – e.g. you get into the habit
    of copying your files onto a USB stick that you keep on a keyring, every time
    you finish a work session – to the fully automated. You could search automatic
    backup *your_operating_system* for options. Today many people rely on storing
    their files* in the *cloud* in some way – that is, on someone else’s computer
    that you access via the internet. Google, Microsoft, Dropbox and others offer
    basic free services: you can keep your programs in a directory that gets automatically
    copied to their servers, and then, by logging into your account with the service,
    you can access them from anywhere on the internet. This can be very convenient
    day to day, especially if you regularly use several different computers and want
    to be able to work on your code on any one of them, as well as saving you in the
    case of disaster.


    **Tip**


    Backup plans that rely on you remembering to do something, such as copy your files
    or run the backup service, are useless if you do not remember. If you choose a
    plan that is not fully automatic, think about how you can turn the necessary actions
    into a habit that *feels* automatic, perhaps by connecting the new action with
    something you already do regularly.


    A version control system lets you easily get back any earlier version you checked
    in; a cloud service lets you easily get back the current version from any computer.
    What if you want to combine these advantages? The obvious idea is to keep your
    version control repository in the cloud – but, especially if more than one person
    is using the repository, this can be dangerous because the services are not designed
    for this use, and corruption of the repository can result. A better idea is to
    use GitHub or another dedicated cloud-based version control system. Their *raison
    d’être* is to let teams of people collaborate from anywhere in the world, but
    you can use them for single-person projects such as coursework too.


    However, one word of warning: if you decide to use a system, such as GitHub, that
    has the potential to make your files available to other people, you must think
    carefully about who should have access to what. For example, if you are working
    on an assessed exercise, you will normally not be allowed to give anyone else
    access to your solution – that would facilitate cheating, and is often penalised
    just as heavily as using someone else’s solution. Examiners usually take the view
    that it is your responsibility to understand who has access to your files, so
    make sure you do!


    Some people like to build up a publicly accessible repository of their code, which
    they can point at in job applications, etc. That’s an idea, but it can backfire
    if you end up with old code still around after you’ve learned to write better
    – and once you put something on the internet, you can’t guarantee it ever goes
    away! Consider more cautious alternatives, such as sending samples of your code
    direct to people you’d like to see them.


    **Tip**


    Be cautious about letting people you don’t know see your code.


    ## 7 How to Test Your Program


    You’ve written enough of your program that it’s possible to run it; how do you
    find out whether it’s right, so that you can fix it if it isn’t? Well, you run
    it, and see if it does what you expect. For a really simple program, that may
    be all there is to say.


    **Python example**


    ```python

    print("Hello, World!")

    ```


    We run the program, observe that it prints “Hello, World!”, and conclude that
    it is correct.


    What did we do there, though? We implicitly understood:

    - that the program did not need to be given any command-line arguments, or any
    other specific context, in order to operate;

    - that what it was supposed to do was to print “Hello, World!”


    **Terminology: Specification**


    A specification for a program is a description of what it should do. It may be
    very detailed, saying exactly what it do; or it may be loose, giving only what
    you need.


    ### 7.1 Manual Testing


    Provided you know how to run your program, including how to setup its context
    – for example, give it any arguments – you know how to observe what it does, you
    can do systematic testing. You do not need any special tools; a text file or a
    piece of paper will do. Just write down a list of tests: describe the context,
    and the required results. For example, suppose you have written a program slightly
    more than Hello World, called greeter, that is supposed to take an argument and
    print out “Hello” followed by that.


    **List of tests**


    - greeter Rahul outputs Hello Rahul

    - greeter sue outputs Hello sue

    - greeter Jane Smith outputs Hello Jane

    - ...


    Now, systematically testing your program consists of going down the list and running
    your program once for each test, giving the appropriate context and checking for
    correct results. As you write the tests, you will probably find yourself mentally
    formulating a concise description of what the program does. The third test in
    the panel shows that our initial description of the program was not fully detailed:
    assuming we got that test correct, when we give the greeter program the argument
    Jane Smith it is supposed to print Hello, not Hello Jane Smith. This is the kind
    of detail you will need to be careful about. After clarifying that, we might have
    a more precise specification, such as “the program outputs “Hello” followed by
    the first word of the input, exactly as given”.


    **Terminology: Test**


    A test for a program is a specific context in which to run the program, including
    any necessary data, together with a specification of what the program should do
    in that context.


    **Tip**


    Any time you do write down your program’s specification, be sure to keep it up
    to date, if the intended behaviour of the program changes later!

