    **术语：语法和语义**


    简单来说，编程语言的语法*告诉你在该语言中哪些内容是合法的。只有当程序在语法上是正确的，询问它做什么或意味着什么才有意义——即，什么是语义*。


    即使是微小的错误，例如将括号放在错误的位置或漏掉分号，也可能让你的程序完全失效：计算机没有理解你意图的能力，无论这在人类看来多么而易见。相反，它会给出语法错误*。好消息是，这些错误通常很容易修复——只要你一次处理一个，这就是为什么你应该利用每一个机会检查你的代码到目前是否正常。


