    **Terminology: Pair programming**


    *Pair programming* is when two people program together at one


    computer. One of them is in charge of the actual typing, while


    the other acts as lookout: is the program going in the right


    direction, and are there any rocks ahead? That is, is the person


    typing following a strategy that will lead to a good program,


    and are there any problems or bugs?


    Pair programming is a practice which is sometimes used by pro-


    fessional programmers (especially in agile development), because,


    even though it takes more time, it can lead to higher-quality


    programs. As a student, you may find it a good way to learn.


