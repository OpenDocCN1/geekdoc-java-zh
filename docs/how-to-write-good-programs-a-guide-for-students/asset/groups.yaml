    **Tip**


    As a beginning programmer you will seldom have to worry


    about the time and space efficiency of code you write. It’s


    almost always better to focus on giving your program clear,


    readable structure.


    If you are writing code that will operate on a lot of data, or


    execute a large number of times, then you may need to worry


    about your choice of algorithm. However, programmers worrying


    too much about efficiency is a more common problem than pro-


    grammers worrying too little about it. In everyday cases, standard


    libraries, optimising compilers and intelligent run-time infrastruc-


    ture will usually do a better job than you will of optimising your


    program for speed or space use. The difference between a million


    executions of a five-line loop and a thousand executions of it is


    *usually* not important.


    So, get your program correct and clear first. Only worry about


    efficiency when you know you have a problem with it – your code


    does not run fast enough, or it uses too much space.


    Then ask yourself:


    • Are you using the most appropriate components from a standard


    library?


    • Is your program doing unnecessary work?


    • (For time efficiency) Is it repeating work whose results it should


    save the first time, and look up later?


    • (For space efficiency) Is it saving work to look up later, when it


    would be better just to redo the work if it’s needed again?


    There may be particular things that, even as a beginner, you


    need to be aware of in your programming language: for example,


    if you are programming in Haskell, you will need to pay attention


    to whether you use foldl or foldr, and in Java, you may soon


