- md: "\n4 How to Understand Your Language\n\nwe experiment with is “Hello, World!”.\
    \ A “Hello World” program in a language is a program which prints out “Hello,\
    \ World!” when you run it. Our program will do slightly more.\n\n**Python example**\n\
    \n```python\nx = 5\ny = 2\nz = \"Hello, World!\"\nprint(x)\nprint(y)\nprint(z)\n\
    print(x/y)\nprint(x/z)\n```\n\nNo types are given explicitly in this program,\
    \ but they are there: if you try running it, you will get an error at the last\
    \ line, something like\n\n`TypeError: unsupported operand type(s) for /: 'int'\
    \ and 'str'`\n\nOnce you think about what the program is doing on that line, this\
    \ is easy to understand, whether or not you “speak” Python. Variables x and y\
    \ hold integers; variable z holds a string. We don’t have to say that: the language’s\
    \ type inference* works it out. Any of x, y and z can be printed. It makes sense\
    \ to divide an integer by an integer (even though, note, the result is not an\
    \ integer any longer). However, it does not make sense to divide an integer by\
    \ a string. The interpreter does not even try: instead, it tells you that you\
    \ have got something wrong.\n\nLanguages differ in how they treat information\
    \ about the types of values. If we write the same program in Java, it looks like\
    \ this:\n\n4.2 Types\n\n**Java example**\n\n```java\nint x = 5;\nint y = 2;\n\
    String z = \"Hello, World!\";\nSystem.out.println(x);\nSystem.out.println(y);\n\
    System.out.println(z);\nSystem.out.println(x/y);\nSystem.out.println(x/z);\n```\n\
    \n(as usual, we omit the lines that show this code placed inside a method inside\
    \ a class). This is very similar to the Python example: compiling it will give\
    \ an error at the final line, because you can’t divide an integer by a string.\
    \ Whereas in the Python case, the earlier, unproblematic print statements were\
    \ carried out before the interpreter encountered the nonsensical instruction to\
    \ print x/z, in the Java case, since compilation does not succeed, none of the\
    \ instructions can be carried out until the problem is fixed and the program is\
    \ recompiled.\n\nApart from the System.out.println verbiage, the biggest difference\
    \ between this version and the Python one is that here we have to give the types\
    \ of the variables x, y, z in the program text. (There is still some type inference\
    \ going on, though: for example, we do not have to say what type the expression\
    \ x/y has. By the way, if you’re learning Java: what type* does* it have? Removing\
    \ the last line and wrapping this code in a method in a class, compile and run\
    \ it. Did it print what you expected?)\n\nIn Haskell, it is rather unidiomatic¹\
    \ to write anything of the sort, but we can, if we insist:\n\n¹ That is, the code\
    \ does not abide by the conventions usually followed by Haskell experts, e.g.\
    \ including types for top-level functions.\n\n**Haskell example**\n\n```haskell\n\
    f _ =\n  do print x\n  print y\n  print z\n  print (x/y)\n  print (x/z)\n  where\
    \ x = 5\n        y = 2\n        z = \"Hello, World!\"\n```\n\nAs with Java, we\
    \ won’t be able to compile this – let alone invoke function f to run the code\
    \ – until we get rid of the nonsensical line about x/z. Just as in the Python\
    \ example, we did not have to write any types; they are inferred. Here, however,\
    \ type inference is done as part of the compilation phase. We cannot execute any\
    \ of the program until the types of all of it make sense.\n\n**Tip**\n\nIf you\
    \ are learning a language other than Python, Java or Haskell, try writing a version\
    \ of this program in your language now.\n\nWe cannot really think without types:\
    \ even programs written in apparently untyped languages have implicit type information.\
    \ Even if, in your language, you are not forced to write down information about\
    \ what you expect types to be, it is wise to clarify your expectations in your\
    \ own head. Sometimes it is useful to write them down, even if you don’t have\
    \ to: it can help you, and other readers of your program, understand what’s going\
    \ on. One of the ways in which our Haskell example was unusual was that it did\
    \ not specify the type of function f.\n\nAll the examples above used built-in\
    \ types for strings and integers. All major languages have these types built in.\
    \ To write real programs you also have to be able to define your own types, and\
    \ languages differ in how you do that.\n\nAll the examples also demonstrated*\
    \ polymorphism*: that is, we could use the same function to print things of several\
    \ different types. Printing is the commonest situation where language designers\
    \ feel obliged to provide polymorphism. Whether, and how, you can write your own\
    \ polymorphic functions – that is, functions that work on arguments of several\
    \ different types – is another axis on which programming languages differ. Indeed,\
    \ it is a particularly interesting one, as there are different kinds of polymorphism.\
    \ Try searching polymorphism* your\\_language* if you want to know more about\
    \ this.\n\n## 4.3 Structure\n\nIn beginners’ course, the way in which large programs\
    \ are structured may be invisible to you. You will probably write small programs\
    \ to start with; All serious programs, though, have to have structure. They have\
    \ to be split into parts, so that teams of people can work on different parts.\
    \ The structure of a program is what makes it possible to make a change without\
    \ having to understand the entire program. When you define function (or method,\
    \ or procedure) in your language, the aim is that a reader can understand what\
    \ function will do, just by reading its body. This sounds very basic, but it could\
    \ not be taken for granted – search structure if you would like to read about\
    \ early history of structure.\n\nYour language may provide classes, modules, packages,\
    \ or several of these. Very likely these higher-level structures will be used\
    \ to provide libraries* which make it easier for you to write programs.\n\nAn\
    \ intimately related issue is the scope of names. Many things in programs – variables,\
    \ functions and classes, for example – are given names. The scope* of a name for\
    \ a thing means where, in the program, the name can be used to refer to the thing.\n\
    \nGlobal scope may sound convenient, but there is an important disadvantage: if\
    \ you need to understand the role this thing plays – to work out whether a change\
    \ you have in mind will break anything – you have to read the whole program. Therefore,\
    \ programming languages allow named things to have smaller scopes. For example,\
    \ a variable might be local to a function, so that it can only be referred to\
    \ inside that function’s definition. The details are subtle and vary between languages.\n\
    \nA standard library* for a language is one that is maintained along with the\
    \ basic software implementing the language, and distributed with it, so that it\
    \ is always available to someone programming in the language.\n\nStandard libraries\
    \ provide things which are frequently needed, such as code for finding a pattern\
    \ in a string, collections that can be sorted efficiently, user interface components,\
    \ etc. If your language has a standard library, becoming familiar with it is an\
    \ integral part of learning to program well in the language.\n\nA software* library*\
    \ provides functionality designed to be used in many other programs. \n\nSoftware\
    \ is* open-source* when it is made available under licensing conditions that allow\
    \ anyone to view the source code, modify it, and redistribute their modified version.\
    \ Typically, there are conditions, such as that the modified software must itself\
    \ be made available with the same licence.\n"
  mdcn: "\n\n4 如何理解你的语言\n\n我们实验的程序是“Hello, World!”。一种语言中的“Hello World”程序是指在你运行时会打印出“Hello,\
    \ World!”的程序。我们的程序会稍微多一点。\n\n**Python 示例**\n\n```python\nx = 5\ny = 2\nz = \"\
    Hello, World!\"\nprint(x)\nprint(y)\nprint(z)\nprint(x/y)\nprint(x/z)\n```\n\n\
    这个程序没有显式地给出类型，但它们确实存在：如果你尝试运行它，会在最后一行得到一个错误，类似于\n\n`TypeError: unsupported operand\
    \ type(s) for /: 'int' and 'str'`\n\n一旦你思考了那一行在做什么，无论你是否“精通”Python，这都很容易理解。变量\
    \ x 和 y 存储整数；变量 z 存储一个字符串。我们不需要说出来：语言的类型推断* 机制会帮你搞定。x、y 和 z 中的任何一个都可以打印。将一个整数除以另一个整数是有意义的（尽管请注意，结果不再是整数了）。然而，将一个整数除以字符串是没有意义的。解释器甚至不会尝试：相反，它会告诉你你错了。\n\
    \n语言在处理值类型信息方面存在差异。如果我们用 Java 编写相同的程序，它看起来像这样：\n\n4.2 类型\n\n**Java 示例**\n\n```java\n\
    int x = 5;\nint y = 2;\nString z = \"Hello, World!\";\nSystem.out.println(x);\n\
    System.out.println(y);\nSystem.out.println(z);\nSystem.out.println(x/y);\nSystem.out.println(x/z);\n\
    ```\n\n（像往一样，我们省略了将此代码放在类方法中的行）。这与 Python 示例非常相似：编译它会在最后一行产生错误，因为你不能将整数除以字符串。而在\
    \ Python 的情况下，之前的、没有问题的打印 语句在解释器遇到打印 x/z 的无意义指令之前已经执行了；在 Java 中，由于编译没有成功，在修复问题并重新编译程序之前，任何指令都无法执行。\n\
    \n除了 `System.out.println` 的冗长写法外，这个版本与 Python 版本最大的区别在于，我们必须在程序文中给出变量 x、y、z 的类型。（尽管仍然存在一些类型推断：：例如，我们不需要说明表达式\
    \ x/y 是什么类型。顺便说一下，如果你正在学习 Java：它*到底*是什么类型*？删除最后一行并将这段代码封装在类的方法中，编译并运行它。它打印了你预期的内容吗？）\n\
    \n在 Haskell 中，编写此类代码相当是不符合惯例的¹，但如果我们坚持的话，也可以这样做：\n\n¹ 也就是说，该代码没有遵守 Haskell 专家通常遵循的规范，例如为顶层函数包含类型。\n\
    \n**Haskell 示例**\n\n```haskell\nf _ =\n  do print x\n  print y\n  print z\n  print\
    \ (x/y)\n  print (x/z)\n  where x = 5\n        y = 2\n        z = \"Hello, World!\"\
    \n```\n\n和 Java 一样，在我们去掉那行关于 x/z 的无意义代码之前，我们将无法编译这段代码——更不用说调用函数 f 来运行代码了。就像 Python\
    \ 示例一样，我们不需要编写任何类型；它们是被推断出来的。然而，在这里，类型推断是在编译阶段完成的。在所有类型都变得合理之前，我们无法执行程序的任何部分。\n\
    \n**提示**\n\n如果你正在学习 Python、Java 或 Haskell 以外的语言，尝试现在用你的语言编写一个该程序的版本。\n\n如果没有类型，我们实际上无法思考：即使是使用看似无类型的语言编写的程序也包含隐含的类型信息。即使在你的语言中，你不需要强制写下关于你预期的类型的信息，在自己的脑海中明确你的预期也是明智的。有时将它们写下来是有用的，即使你不需要：这可以帮助你以及程序的其他读者理解发生了什么。我们的\
    \ Haskell 示例不寻之处之一是没有指定函数 f 的类型。\n\n上述所有示例都使用了字符串和整数的内置类型。所有主流语言都内置了这些类型。要编写真正的程序，你还需要能够定义自己的类型，而语言在实现这一点上有所不同。\n\
    \n所有的示例还展示了*多态性*：也就是说，我们可以使用同一个函数打印几种不同类型的对象。打印是语言设计者觉得有义务提供多态性的最常见情况。你是否以及如何编写自己的多态函数——即可以处理多种不同类型参数的函数——是编程语言差异的另一个维度。事实上，这是一个特别有趣的维度，因为存在不同类型的多态性。如果你想了解更多关于这的信息，可以尝试搜索*你的语言的多态性*。\n\
    \n## 4.3 结构\n\n在初学者课程中，大型程序的结构方式对你来说可能是不可见的。你可能会从编写小型程序开始；但是，所有正式程序都必须有结构。它们必须被分成若干部分，以便团队成员可以处理不同的部分。程序的结构使得在不需要理解整个程序的情况下进行修改成为可能当你在语言中定义函数（或方法、过程）时，目标是读者只需通过阅读函数体就能理解该函数将做什么。这听起来非常基础，但并不是理所当然的——如果你想阅读结构的早期历史，请搜索结构。\n\
    \n你的语言可能提供类、模块、包或这些中的几种。这些高级结构很可能被用于提供库*，这让你编写程序变得更加容易。\n\n与之紧密相关的问题是名称的作用域。程序中的许多事物——例如变量、函数和类——都被赋予了名称。一个事物的名称的作用域*是指在程序的哪个位置可以使用该名称指代该事物。\n\
    \n全局作用域听起来很方便，但有一个重要的缺点：如果你需要理解这个事物所扮演的角色——为了判断你脑海中的更改是否会破坏某些东西——你需要阅读整个程序。因此，编程语言允许命名的事物具有更小的作用域。例如，一个变量可以是函数局部的，因此它只能在该函数的定义内部被引用。这些细节非常微妙，并且不同语言之间有所不同。\n\
    \n语言的标准库*是指与实现语言的基础软件一起维护并随之分发的库，以便任何使用该语言编程的人始终可以使用它。\n\n标准库提供了经常需要的东西，例如在字符串中查找模式的代码、可以高效排序的集合、用户界面组件等。如果你的语言有标准库，熟悉它是学习在该语言进行良好编程的不可或缺的一部分。\n\
    \n"
