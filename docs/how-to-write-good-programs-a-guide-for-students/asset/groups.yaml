    11 How to Get Help (without Cheating)


    a small, simple program that doesn’t work* in the same way as a*


    *program you care about* turns out to be useful.


    **Terminology: Minimal non-working example**


    A minimal non-working example (MNWE) – for a particular


    problem – is the smallest, simplest program you can construct


    that still has the problem.


    A small, simple program is easier for you to understand, so


    there’s a good chance that once you look carefully at it, you’ll be


    able to work out what’s wrong. Having a MNWE is even more


    important if you ask someone else for help – the less they have to


    read that’s not relevant to the problem, the more quickly and easily


    they can understand what’s going on and help you, and the more


    likely it is that they will be willing to do so.


    To build it, take a copy of your program that contains a problem,


    and start cutting and commenting parts out. Each time you make


    a change, do whatever you need to do – e.g. recompile, rerun – to


    check that the problem is still there. Concretely, I suggest starting


    with the part of the program that you are* most* confident is not


    relevant to the problem. Comment it out, replacing it with a


    dummy if necessary. For example, if you are commenting out


    the body of a piece of code that should return an integer, and


    you believe it doesn’t matter (for your problem) what integer it


    returns, you might comment out the actual calculation and put in


    a statement returning 0 instead. Reprocess the program and check


    that, as expected, the problem still occurs. Having checked that,


    delete the commented out code. This helps to make the code you’re


    looking at get visually simpler, which in turn makes it more likely


    that you’ll understand what’s going on.


    It may happen that at some point, you remove some code


    you expected to be irrelevant, and to your surprise, the problem


    vanishes or changes. Such a surprise may well help you progress'
- md: "\n## 11.2 Solving a More Specific Problem\n\n165 towards understanding – but\
    \ this is why you should check frequently that you have not inadvertently made\
    \ the problem go away. What usually happens is that somewhere in the process of\
    \ making your MNWE, you come to understand what’s going on. Sometimes this understanding\
    \ arrives like a thunderbolt. Other times, it’s more that once your example gets\
    \ really simple, you can see that the problem *must* lie with some particular\
    \ language or library feature. Then you read the documentation of that feature\
    \ carefully, and learn how to fix your own problem. \n\nIf that doesn’t happen,\
    \ though, and you keep on simplifying the program until any further simplification\
    \ makes the problem disappear, you are still a lot further on than you were, because\
    \ now you have a small program whose behaviour you don’t understand in quite a\
    \ simple way, and you can take it to someone who might be able to help. As it’s\
    \ now a long way away from an actual answer to a coursework question, you’ll probably\
    \ feel comfortable sharing it with a fellow student who might understand it better\
    \ than you do (check local policies, though!). Alternatively, if you take it to\
    \ an instructor, they are likely to be able to give you help quickly and easily,\
    \ because your example is no longer cluttered with things that are irrelevant\
    \ to your problem.\n\n### 11.2.4 Asking for Help\n\nMore generally, when should\
    \ you ask for help, and from whom? If you’re stuck on a specific exercise that\
    \ will be assessed, you may first need to check what kind of help or discussion\
    \ with others is permitted. Most likely, if the exercise is formative (usually:\
    \ not for credit) some level of discussion with your peers will be allowed, but\
    \ if it is summative (for credit) you’ll usually be expected to do it entirely\
    \ alone. \n\nIf you are allowed to discuss it with peers, this can be very constructive.\
    \ However, it can also lead you to think you understand more than you do, so be\
    \ careful. There’s a big gap, in practice, between being able to understand when\
    \ someone else tells you how to solve a problem, and being able to come up with\
    \ the solution for yourself. So don’t get too dependent on help from others, and\
    \ look for opportunities to give help as well as take it.\n\nMany courses offer\
    \ some kind of course forum, where students are encouraged to ask for help. This\
    \ has advantages and disadvantages compared with talking directly to another human\
    \ being. On the plus side, your question is likely to reach more people, more\
    \ quickly, than you can talk to face to face – so the chance is higher that one\
    \ of them will be able and willing to help. Less obviously, the process of turning\
    \ your problem into a clear, succinct textual question often helps you clarify\
    \ your thinking. It’s not at all uncommon to find that, in the process of working\
    \ out how to ask your question, you answer it for yourself. (This is a similar\
    \ phenomenon to the cardboard debugging process that we discussed in Chapter 9.)\
    \ On the minus side, you have to take the time to do the writing – which will\
    \ be harder, the more confused you are – and you may have to wait for a response.\n\
    \n**Tip**: Even when you are writing only for people on the same course as you,\
    \ write carefully, and give relevant detail. For example, don’t just say “it doesn’t\
    \ work” or “it gives an error” – say exactly how it doesn’t work, or exactly what\
    \ error you see.\n\nShould you turn to the wider internet? There are sites like\
    \ StackOverflow¹ that are set up for programmers to ask questions about programming.\
    \ I’d urge you to be cautious about this, as an early-stage student. It’s likely\
    \ that your question can be sorted out by reading standard documentation, or has\
    \ been asked before, and the denizens of StackOverflow can be impatient with such\
    \ questions.\n\n¹ https://stackoverflow.com\n\nHowever, “be cautious” doesn’t\
    \ mean never do it: it just means take care to be asking a question which is as\
    \ clear and precise as possible. Don’t ask “why doesn’t this work?”, for example;\
    \ say “I expect this code to return 4 on input 1, but instead it returns 3 – why?”\
    \ Say what standard resources you have consulted and why closely related questions\
    \ don’t answer yours. Do include an example of the code feature you’re talking\
    \ about – perhaps an example of code whose behaviour you don’t fully understand,\
    \ or an example of code you think should work but doesn’t – but make sure this\
    \ piece of code is a true MNWE (see above), so that experts can understand as\
    \ quickly as possible what the essential point you’re stuck on is.\n\nFor a lot\
    \ more discussion of what constitutes a well-asked question, I recommend you read\
    \ the most famous Smart Questions guide, “How to ask questions the smart way”\
    \ (Raymond, 2014). Finally, a trivial point that seems to get overlooked:\n\n\
    **Tip**: Any time you send someone your code, post it on a forum, etc., copy in\
    \ your actual program text, rather than including an image of it! Most people,\
    \ in helping you, will want to try out your code, or their modified version of\
    \ it, in their own tool: you need to allow them to copy and paste, not retype.\n\
    \n### 11.2.5 Help to Get Started\n\nWhat if it’s not that you have a problem with\
    \ a program you have written, but rather that you have no idea how to even get\
    \ started, so that when you think about asking someone else, you can’t really\
    \ even work out what question to ask? This tends to be a problem that afflicts\
    \ beginners, which experienced programmers often have trouble helping with, because\
    \ they have long forgotten ever feeling that way. The positive way to think about\
    \ this is that, one day, this feeling will be a distant memory for you too.\n\n\
