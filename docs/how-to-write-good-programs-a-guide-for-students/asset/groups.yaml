    **8**


    How to Make Your Program Clear


    In discussing what a “good program” is (Chapter 2), we claimed it


    should be clearly written. It is natural that when you start to learn


    to program, you focus on making your program correct. You may


    find yourself resenting any suggestion that your correct program


    could still be improved: if it does what it is supposed to do, isn’t


    that all that matters? In this chapter we explain why it is very much


    in your interest to write your code as clearly as possible, and discuss


    how to do so.


    **8.1**** How Will Writing Clear Code Help You?**


    We said that a program is a set of instructions for a computer, and


    of course it is that – but even more importantly, the program is


    an explanation for a human reader of* what the computer is being*


    *instructed to do*. That reader might be you, as you initially write the


    code; someone trying to mark your code, or give you help with it;


    or someone (perhaps you, later) trying to improve it or extend it.


    The better your code communicates what the computer will do, the


    easier all of these tasks will be.


    **Tip**


    Always make your code as easy to read as you can. Even if you


    have to spend some time clarifying it, you will save time overall,


    as it becomes easier to keep your code correct.


