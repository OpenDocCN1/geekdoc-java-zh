    **8.3**** Names**


    **Tip**


    Names are absolutely crucial. Good choice of names will help


    you, and everyone else, to read the code, and hence reduce the


    number of comments that you need to write.


    Let us start with the part that is easiest to get right: use the


    conventions that are standard in your language, when you decide


    how to capitalise your names and how to handle names that consist


    of several words joined together. Having a fixed set of conventions


    that you always follow makes you – and anyone else who has to


    edit your program – much less likely to mistype a name, e.g. writing


    do\_something when it should have been doSomething. It makes


    it possible to remember a name by how it sounds; you don’t have


    to remember how the words are put together, if by convention


    that is always done the same way. Therefore, pay attention to what


    these conventions are. For example, Java’s conventions include the


    following.


    • Classes begin with a capital letter, e.g. Customer.


    • Attribute names are lower case, e.g. name.


    • Method


    names


    are


    in


    what


    is


    called


    *camel*


    *case*²


    e.g.


    doSomething.


    • Classes and attributes are named with nouns or noun phrases.


    Class names are almost³^ always singular (Customer, not


    Customers): the name describes an object of the class, not the


    collection of all objects of the class.


    2 Think about the humps! In Python, appropriately, we write method names


    in* snake case*, e.g. do\_something, instead.


    3 The exception is when a single object is best described by a plural noun.


    E.g. a single object of class Preferences might describe all of one user’s


