    \*Main> quickCheck prop\_factor


    \*\*\* Failed! Falsifiable (after 7 tests):


    4


    \*Main>


    That is, QuickCheck had to run a total of seven tests, but it only


    showed me one example of an input that makes the test fail: 4,


    where the buggy factor will return \[2\], instead of the correct


