    ## 5 如何使用最佳工具


    这些工具在许多平台上可用，例如 Visual Studio（适用于微软和苹果操作系统）。还有许多其他工具，包括免费和商业性的，其中一些是专门为学生编写的（例如用于
    Java 的 BlueJ）。选择也取决于你正在使用的编程语言。Java 是到目前为止 IDE 支持得最完善的语言。


    最流行的 IDE（如 Eclipse）还支持*插件*生态系统：也就是说，它们拥有一种扩展机制，允许 IDE 原始开发人员以外的人员能够根据他们意愿的任何方向来扩展
    IDE 的功能——从应用自定义布局样式到与建模和验证工具集成。这通常不是初级程序员要做的工作，但如果你以后希望你的 IDE 能完成某件它目前无法做到的事情，请记住，一年或两年后当你正在寻找一个有趣的项目*
    . . .* 的时候……


    ## 6 如何确保你不会丢失程序


    你是否曾有过这样的经历：对某项工作投入了很长时间，然后因为程序崩溃或连接丢失而完全丢失了它？或者仅仅是因为你关闭了一个不该关闭的窗口？又因为你认为不需要某一部分内容并将其删除了，结果在片刻之后才意识到你需要它？无论我们谈论的是文章、最新的社交媒体动态还是程序，这都非常令人懊恼。幸运的是，这在很大程度上是可以避免的。


    确保你不会丢失程序或其有价值的部分，部分取决于是否使用了正确的工具，部分取决于养成能够保护你免于自己犯错误的习惯。人们对于正确的处理方法往往有强硬的观点，但事实上，有许多有效的方法，每种方法都有自己的优缺点。


    关键工具当然是你用来编写程序的工具。无论是编辑器还是集成开发环境（见第 5 章），请确保你了解它能为你做些什么。


    ### 6.1 即时恢复：撤销


    帮助你从瞬时错误中立即恢复的最重要功能是*撤销*（undo）功能。如今你考虑的大多数工具都有“无限”撤销——也就是说，你不仅可以撤销上一次编辑，还可以撤销上上次，以此类推，甚至可以回到文件加载到编辑器时的状态。它们通常还有一个相应的*重做*（redo）功能，以防你不小心撤销得太远。这些功能可能非常有用，但也可能让人有些困惑，尤其是当你意识到自己搞砸了某些事情而感到压力时。


    **提示**

    在实际需要之前，先尝试你编辑器的撤销和重做功能。


    如果你发现你使用的工具没有撤销/重做功能，或者只有一个级别（即你只能撤销上一次编辑* . . .*），如果可能，请认真考虑切换另一个工具。如果你没有选择，请更加关注本章的其余部分。


    ### 6.2 基础灾难恢复：文件


    计算机有主存储（通常称为*内存*）和次级存储（通常称为*磁盘*）。当你在编辑器中打开一个程序文件时，磁盘上的相关数据会被复制到内存中。当你编写程序时，你在屏幕上看到的是内存中内容的状态。它可能与磁盘上的内容不同，因为在你编写程序时，你改变的是内存中副本的状态，而不是磁盘上副本的状态。当你保存文件时，内存中的版本将替换磁盘上的版本，使两者再次变得一致。由于你正在不断改进你的程序，这通常是一件好事，我之前建议过要养成频繁保存的习惯。


    然而，如果你发现面前有一个灾难性损坏的程序版本——例如，可能你刚刚不小心删掉了一大块内容——你最不想做的事情就是让这个版本替换磁盘上的内容，所以此时，千万不要保存！仔细考虑。你可以使用撤销来回到良好状态吗？如果是，就这样做。或者，你最近保存过，所以确信磁盘上的版本非常接近你想要的结果？如果是这样，请*不保存*直接关闭文件，并从磁盘重新打开。不过，如果距离上次保存文件到磁盘已经过了很长时间，使用磁盘上的版本可能没有帮助：你可能已经做了很多工作，但在任何一个版本中都没有被记录。此时，了解大多数工具都具有的一个经常被忽视但偶尔有用的功能会有帮助：自动保存（autosaving）。也就是说，每隔几分钟或在按下一定次数按键后，它们会保存一个程序的版本，并不是到你获取它的文件（保存到该文件由你显式控制），而是保存到其他地方。在工具没有现在这么可靠的时代引入这个功能是为了防止编辑器崩溃。如今，它可能在你犯错时更有用。看看你的工具在做什么或可以做什么，可以通过搜索你的工具name，或者通过查看文件。如果你发现你在某个文件上做了错误，并想回到某个早期的版本，你可能会发现你在同一个位置有一个有用的版本。你可能会发现，在保存文件之前创建一个新的版本是很有用的。


    ### 6.3 避免灾难：保存版本


    当你解决问题时，通常是分阶段进行的，逐步解决。有时你下一个阶段的尝试失败了，你甚至破坏了之前运行良好的东西。通过这种方式养成可靠的“棘轮”技术，可以让你自己总能回到最好的状态。


    **故事**

    Jennifer 正在做一项包含多个部分的练习，都涉及 file.hs。她编辑 customer.hs 直到对部分 A 满意。在开始部分 B 之前，她保存了一个命名为
    customerADone.hs 的副本。（由于之前犯过错误，她现在将其设为只读。）然后她回到 customer.hs 编辑部分 B。一旦完成，她将新版本保存为
    PartsAandBDone.hs，然后回到 customer.hs，以此类推。如果在处理部分 C 时完全搞乱了，她知道自己可以放弃部分 C 的失败工作，将
    PartsAandBDone.hs 复制为 customer.hs重新开始部分 C。事实上，她这次从没有搞乱，但知道保存好的版本就在那里让她感到更安全。


    你对保存版本的正确性越有信心，它们对你就越有用。至少，你应该检查你的编辑器和编译器没有在其中发现任何错误（除了那些仅仅表明你尚未解决整个问题的错误——尽管请参见第
    3 章如何通过尽早编译代码来减少此类错误）。在保存每个版本之前测试你的程序也是一个好主意——详见第 7 章。


    ### 6.4 自动化流程：使用版本控制


    **控制系统**


    一旦你养成了这样保存文件版本的习惯，你很快就会发现某些工具支持这一过程会有帮助。即使是简单的单用户版本控制系统也能让你：


    -* 提交（check in）一个新版本；

    -* 与新版本关联注释，例如记录此版本实现了什么；


    '
