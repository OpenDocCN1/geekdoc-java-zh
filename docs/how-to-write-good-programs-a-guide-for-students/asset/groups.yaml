    A very reasonable first reaction to coming across the idea of a


    program being maintainable is confusion. Lines of code don’t wear


    out and need retyping – semi-colons don’t drop off the ends from


    time to time – so what are we talking about? The term* maintenance*


    has stuck since the early days of programming, and probably


    came in by analogy with manufacturing physical goods. The thing


