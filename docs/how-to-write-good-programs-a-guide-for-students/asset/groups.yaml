    **9**


    How to Debug Your Program


    So your program has a bug.


    **Terminology: Bug**


    A bug in a program is something wrong with it: usually a


    small, specific thing which you might whimsically picture as an


    insect curled up on a line of your code, even if you don’t yet


    know which line or which insect. The term “bug” for a small


    error or glitch pre-dates computers, but the computing pioneer


    Grace Hopper famously used to tell a story about an actual


    moth recovered from an early electromechanical computer (the


    Harvard Mark II) where it was interfering with the operation


    of a program.


    More formally, we sometimes talk about faults, errors and


    failures, with each term meaning something subtly different.


    You might find it interesting to look that up. “Bugs” will do


    for now, however.


    First things first: how do you* know* your program has a bug? It


    might be that your compiler, interpreter or IDE is telling you there


    is a problem, before you even get to run your program. Or it might


    be that when you run the program, it does not behave correctly:


    perhaps a test fails, the program crashes, or you do not see what


    you expect to see.


    Debugging has four steps to go through – and then a bonus fifth


    step, which is crucial to turning yourself into a* good* programmer.


    101'
