    \ (condition)` 部分后面没有像她那样加分号。嗯，她一直认为每行末尾必须有一个分号——而且认为，她想，如果加分号是错误，她的代码就不应该通过编译，所以这不可能是错误——这难道是那种你加或不加某个东西都没有区别的情况？为了妥起见，她还是尝试删除了原始代码中的分号，结果奇迹地，它运行正常了。\n\
    \n她在接下来的操作中展现了她成为优秀程序员的决心。她没有只是继续练习，而是决定花几分钟时间来理解发生了什么。为什么删掉分号就解决了她的问题？她决定在一个独立的、不受任何精灵相关内容干扰的程序中调查\
    \ `if` 语句后的分号。代码是这样的：\n\n117\n\n9.2 当你的程序运行但行为异常\n\n**Java 示例（不要这样做！）**\n\n```java\n\
    public class IfFalse {\n    public static void main(String[] args) {\n       \
    \ if (false);\n        {\n            System.out.println(\"yay, got here!\");\n\
    \        }\n    }\n}\n```\n\n在玩了这个程序后，她回到了她的 Java 教书，并在网上花了一段时间阅读关于“块”（blocks）和“空语句”（empty\
    \ statements）的文章，最终对 Java 中分号的作用有了理解比开始时要深刻得多。\n\n请注意，我们并没有详细说明 Kasia 看到的与她的预期之间具体有何不同。这是因为在这个虚构的案例中，她并没有进行太多的分析。另一种方法是不修改代码，而是非常仔细观察发生了什么，并思考这与代码之间的关系。也许通过这样做，Kasia\
    \ 可能会意识到她的旋转命令总是被执行的，而不仅仅是在某些随机选择的场合。然而，取决于系统其余行为的复杂程度，特别是其中随机性的程度，这可能比她所做的要困难。\n\
    \n118\n\n9 如何调试你的程序\n\n### 9.2.1 特殊情况：不终止和崩溃\n\n**当你的程序永远运行**\n你启动程序，预计它会运行一会儿并给出结果，结果相反，它运行但没有停止。要么没有任何可见的变化，要么你有一了无尽的输出流。你需要手动停止程序，可以通过在\
    \ IDE 中按下相应的按钮，或者直接使用操作系统，例如在 Linux 系统中按下 `Control-C`，或者杀死运行该程序的命令行窗口。\n\n通常，这标志着你的程序包含一个无限循环（或无限的递归调用流）。请仔细检查循环条件或导致递归的逻辑。问问自己：我为什么期望这个过程会结束？如果你没有立即发现问题——特别是当存在有多个循环且你不确定是哪一个导致了问题时——那么在调试器中追踪程序执行或插入打印语句（print\
    \ statements）可以帮助你看到哪里出了问题。\n\n你遇到的可能并不是真正的不终止，而是一个极其低的程序，它执行的工作比你预期的要多——它最终会完成，但要等到下周中，甚至更糟。幸运的是，这类问题在早期编程练习题中很少见：\n\
    \n**当你的程序崩溃**\n你启动程序，预计它会运行一会儿并给出结果，结果相反，它由于某种错误停止了。这通常是一个晦涩的信息。取决于你使用的语言，这可能是未处理的异常、段错误（segmentation\
    \ fault）、内存溢出、栈溢出或其他。我们将它们称为“崩溃”。\n\n119\n\n9.2 当你的程序运行但行为异常\n\n120\n\n9 如何调试你的程序\n\
    \n**空指针异常 (Null pointer exception)**\n在 Java（以及相关语言）中，NPE 是崩溃 Common原因。当你的代码尝试使用一个值为\
    \ `null` 的引用时就会产生 NPE。这意味着什么？因为引用没有指向任何状态，你的程序将会崩溃。\n\n**堆栈跟踪 (Stack trace)**\n\
    堆栈跟踪是程序进入但尚未退出的函数有序列表。首要工作是理解列表提供的顺序。最近进入的函数可能位于顶部（Java 常见）或底部（Python 常见）。这是崩溃发生的地方。堆栈跟踪的另一端是程序开始时调用的函数。列表中的下一行是调用它的函数，行号显示了调用它的位置，以此此类推。\n\
    \n通常 bug 位于最近的函数中（在示例中是 `findCustomer`），但并不总是如此。特别是如果你发现最近的调用不是你写的代码，而是标准库或基础设施函数，千万不要受诱惑去怀疑它们！这可能意味着你的代码错误地调用了库函数（例如使用了无效参数），导致随后引发了问题。查看堆栈跟踪中最近的关于你代码的地方，并从那里开始处理。\n\
    \n121\n\n**9.3 纸板调试**\n\n这种实用的技巧有很多名称，例如“小黄鸭调试”（rubber duck debugging）；我称其为“纸板调试”，因为这是我第一次学到的名称——而且还没有橡皮鸭厂家给我提供过什么诱人的赞助。\n\
    \n关键的观察结果是，当你无法理解为什么程序不正常工作时，向他人详细解释它为什么应该能工作，这通常非常有帮助。例如，你可能会向同伴或你课程的导师解释它。然而，下一个重要的观察是，当你这样做时，通常是你自己（而不是其他人）突然发现问题所在。\n\
    \n"
