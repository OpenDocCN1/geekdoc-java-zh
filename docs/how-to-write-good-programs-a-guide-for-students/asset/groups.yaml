    ## 3 如何入门


    （到目前为止，Python 和 Haskell 达成了一致——真不错！）


    Jupyter notebooks¹ 提供的体验与使用交互式提示符相似。笔记本可以将格式化文本和代码混合，这使其成为导师指导学生编程早期阶段的方便方法。它也是分享数据及其处理方式的一种流行方式。然而，Jupyter
    notebooks 对于严肃的代码开发并不方便，除非你正在参加支持它的课程，否则我不建议采用它们。


    ### 3.2.2 使用文本编辑器


    交互式提示符本身只足够用于非常基础的探索，例如，你想尝试单行程序代码的效果。下一步是将你的程序保存到一个文件中，并使用文本编辑器对其进行编辑。（稍后，你可以在交互式提示符中加载该文件以测试并改进你的代码。）如果你已经有了喜欢的文本编辑器，打开它，直接跳到下一节*
    . . .*


    *. . .* 但现如今，许多编程初学者都有过所谓的 WYSIWYG（所见即所得）文字处理器（如 Microsoft Word）的经验，但不熟悉文本编辑器。文字处理器和文本编辑器之间的界限可能会模糊，但从根本上说，文本编辑器是将文件视为字符列表来操作的。当你在文本编辑器中保存文件时，你确切知道自己保存的是什么，因为这就是你在文本编辑器中看到的字符列表。


    文字处理器即使操作一个基本上只是文本的文档，也会保存大量更多关于你希望文本外观的信息*：例如，你选择了哪些字体。结果是，你将来通常必须在同一个文字处理器中打开由该文字处理器编写的文件。文本编辑器保存的是纯文本文件，该文件可以被任何其他文本编辑器读取和编辑。编程工具要求纯文本文件作为程序输入，尽管此类文件通常被赋予特定的后缀，如
    .java、.hs 或 .py，而不是 .txt，以指示文件中的内容实际上是特定语言的程序。


    **组织你的文件**


    文件被分组为层级的——树状的——目录*或文件夹*（你可能会遇到其中一个或两个术语，取决于你的操作系统：它们的意思相同）。从起，你至少会有一个主目录；你可以创建自己的子目录来组织你的文件。


    例如，如果你正在上一门名为“编程 1”的课程，你可能会发现在主目录下创建一个名为 Programming1 的子目录，并将为该课程编写的所有程序都放在那里是方便的。当你开始做该课程的练习
    3 时，你可能想为 Programming1 创建一个名为 Exercise3 的新子目录，用于那些特定的程序文件。如果你通过命令行调用某个工具（例如编辑器），你需要确保你正处于你想要执行的操作的正确*当前目录中，以便工具能够找到你想处理的文件，而无需你为它提供复杂的路径。如果你对这些还不熟悉，请使用以下搜索词：


    - 命令行* 你的操作系统*

    - 切换目录* 你的操作系统*


    每台现代计算机都预装了至少一个可用文本编辑器。在 Windows 上，你会找到记事本（Notepad）；在 Mac 上，是 TextEdit；在 Linux
    上，是 vi 或（如果可用，更好的²）Emacs。你可以直接用现有的任何工具开始。稍后，你可以切换到你喜欢的任何文本编辑器——除了 Emacs 之外，Atom
    和 Sublime 是许多平台上流行的选择，在 Windows 上，许多开发者喜欢 Notepad++——或者切换到集成开发环境（IDE）（参见第 5 章）。你可以使用菜单选项打开和保存文件，如何进行基础编辑可能非常显而易见。一旦你遇到问题，搜索
    *你的编辑器名称* 教程是一个明智的举。


    ### 3.3 理解你需要做什么


    在早期的编程练习中，你可能会得到一个模板文件，其中已经包含部分程序。在这种情况下，你不需要编写整个程序，只需要填入一些缺失的部分。例如，在 Haskell
    课程早期，你可能会得到以下文件：


    **Haskell 示例**


    ```haskell

    say :: Integer -> String

    say = undefined


    main :: IO()

    main = mapM_ putStrLn $ map say [1..100]

    ```


    以及指令


    **Fizz Buzz 练习**


    你的 Haskell 程序应该打印数字 1 到 100，每个数字占一行，但满足：


    - 每个能被 3 整除的数字必须替换为“Fizz”；

    - 每个能被 5 整除的数字必须替换为“Buzz”；

    - 每个能被 3 和 5 整除的数字必须替换为“FizzBuzz”。


    你被赋予函数 main，它将依次对每个数字应用 say 函数并打印结果。你的任务是编写函数 say。例如


    - say 1 返回“1”

    - say 10 返回“Buzz”

    - say 30 返回“FizzBuzz”


    使用模板文件是因为你无法一次教或学所有内容；在这个示例中，main 的定义涉及了你通常在 Haskell 课程第一周学不到的内容。尽管如此：


