    How to Go Beyond This Book


    This book has been aimed at students and their teachers engaged


    in early programming courses, and I hope you have found it useful.


    Once you’ve thoroughly absorbed its content, what next?


    **15.1**** Doing More Programming**


    You can, of course, simply go ahead and write a program you find


    interesting. If you want a bit more structure to your practice, you


    might consider


    • online coding challenges and contests, such as those found at


    HackerRank¹^ – these are available in multiple languages, and you


    can do them competitively or just for fun;


    • getting involved in outreach activities, e.g. helping with a coding


    club for school children: having to explain things is excellent for


    your own understanding;


    • attending hackathons – intense, group programming events often


    organised by large employers or university societies – talks, etc.,


    if you are lucky enough to be somewhere where these happen;


    • contributing to an open-source project: projects that welcome


    newcomers often have a forum or a Get Involved page or similar


    to help you get started, and the website UpForGrabs²^ collates


