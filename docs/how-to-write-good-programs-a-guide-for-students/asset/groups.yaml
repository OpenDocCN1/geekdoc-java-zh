    ## 3 How to Get Started


    (So far, Python and Haskell agree – good!)


    Jupyter notebooks¹ give a somewhat similar experience to using an interactive
    prompt. A notebook can mix formatted text and code, which makes it a convenient
    way for instructors to guide students through the early stages of programming.
    It’s also a popular way to share data and ways of processing it. However, Jupyter
    notebooks are not very convenient for serious code development, and I would not
    advise adopting them unless you are on a course which supports it.


    ### 3.2.2 Using a Text Editor


    An interactive prompt, on its own, is only good enough for very basic exploration,
    such as where you want to try out the effect of just one line of program code.
    The next step up is to save your program in a file, and edit it using a text editor.
    (Later, you may load your file at the interactive prompt to test and improve your
    code.) If you already have a favourite text editor, open it, and skip on to the
    next section* . . .*


    *. . .* but these days, many people who are new to programming have experience
    with so-called WYSIWYG word processors such as Microsoft Word, but not with text
    editors. The line between word processors and text editors can get blurred, but
    fundamentally, a text editor operates on a file as a list of characters. When
    you save a file in a text editor, you know exactly what you’re saving, because
    it’s the same list of characters you see in the text editor.


    A word processor, even operating on a document that is basically just text, saves
    a lot more information about how you want the text to look*: what fonts you have
    chosen, for example. The effect is that you usually have to open a file that has
    been written by a word processor in that same word processor in future. A text
    editor saves a plain text file, which can be read and edited by any other text
    editor. Programming tools expect plain text files as their program inputs, although
    such files are usually given a specific suffix such as .java, .hs, or .py, instead
    of .txt, to indicate that what’s in the file is, in fact, a program in a specific
    language.


    **Organising your files**


    Files are grouped into a hierarchical – tree-shaped – system of directories* or
    folders* (you may meet either or both terms, depending on your operating system:
    they mean the same thing). You will have, at least, a home directory to begin
    with; you can create your own subdirectories to organise your files.


    For example, if you are doing a course called Programming 1, you might find it
    convenient to create a subdirectory of your home directory called Programming1
    and keep all the programs you write for this course in there. When you start working
    on Exercise 3 for the course, you might like to create a new subdirectory of Programming1,
    called Exercise3, for those specific program files. If you run a tool, such as
    an editor, by invoking it from a command line, you will need to make sure that
    you are in the right* current directory for what you want to do, so that the tool
    finds the files you want to work on, without you having to give it complex directions
    to them. If this is not already familiar to you, use search terms such as


    - command line* your\_operating\_system*

    - change directory* your\_operating\_system*


    Every modern computer comes with at least one text editor already available. On
    Windows, you’ll find Notepad; on a Mac, TextEdit; on Linux, vi or (better, if
    available²) Emacs. You may as well start with whatever you have. Later, you can
    either switch to any text editor you prefer – besides Emacs, Atom and Sublime
    are popular ones available on many platforms, and on Windows many developers like
    Notepad++ – or to an integrated development environment (IDE) (see Chapter 5).
    You can open and save a file using menu options, and it will probably be pretty
    obvious how to do basic editing. As soon as you have trouble, searching *your\_editor\_name*
    tutorial is a good move.


    ### 3.3 Understanding What You Have to Do


    In an early programming exercise, you may be given a template file that contains
    some of the program already. In this case, instead of having to write the whole
    program, you simply have to fill in some missing bits. For example, early in a
    Haskell course, you might be given the following file:


    **Haskell example**


    ```haskell

    say :: Integer -> String

    say = undefined


    main :: IO()

    main = mapM_ putStrLn $ map say [1..100]

    ```


    and the instruction


    **Fizz Buzz exercise**


    Your Haskell program should print out the numbers 1 to 100, each on a new line,
    except that:


    - each number that is divisible by 3 must be replaced by “Fizz”;

    - each number that is divisible by 5 must be replaced by “Buzz”;

    - each number that is divisible by both 3 and 5 must be replaced by “FizzBuzz”.


    You are given the function main which will apply the function say to each number
    in turn, and print the results. Your task is to write the function say. For example


    - say 1 returns “1”

    - say 10 returns “Buzz”

    - say 30 returns “FizzBuzz”


    Template files are used because you can’t teach, or learn, everything at once;
    in this example, the definition of main involves things you would not normally
    learn in the first week of a Haskell course. Still:


    **Tip**


    Whenever you are given code to use, take advantage of the chance to learn from
    it. How much can you understand?


    ### 3.4 Writing Your Program


    **Terminology: Syntax and semantics**


