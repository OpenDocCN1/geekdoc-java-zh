    ## 4 如何理解你的语言


    在第 14 章中，我们将讨论如何为特定任务选择合适的编程语言。然而，在本章中，我们将假设你没有选择余——你必须学习一种由他人选择的语言。尽管如此，你仍然需要对所有*编程语言*的版图了解什么，以及你的语言是如何融入其中的？


    你可能会反对说，这并不是本章的主题：理解你的语言不应该就是学习如何用它来理解和编写程序吗？嗯：不，不仅如此。了解关于设计该语言时所做的决策也是很有用的：它如何以及为何与其他语言有不同之处。如果是别人为你挑选了这门语言来学习，他们为什么要选这一个？为什么学习这门语言对你来说特别有价值？


    尽管如此，人们的学习方式各不相同，有些人可能希望现在跳过这一章。没关系——但请之后再回来。


    如果你还在这里，你可能会问的问题（问你的老师，问问你最喜欢的搜索引擎）包括：


    - 这门语言是为了什么种任务开发的？什么时候？是谁开发的？

    - 现在谁在用它？用来做什么？

    - 使用这种语言的人群是一个什么样的社区？他们在在线上哪里聚集？

    - 你的语言是编译的还是解释的？

    - 它施加了什么种类型规范？

    - 你的语言中的程序具有什么高级结构？

    - 人们遵守哪些约定？你会惊讶于像单词如何大写这样的事情，在帮助语言专家快速理解你的程序，以及让你自己看起来像个懂这门语言的人方面是是么重要！关于许多其他事情也有约定，从程序部分在专家决定拆分它们之前倾向于多长，到使用了哪些库。


    让我们讨论一下其中一些问题。我们将从更具体的问题开始，之后再讨论更社会属性的问题。


    ### 4.1 编译或解释


    对于已经知道答案的人来说，这个问题似乎很愚蠢——因此，他们可能会忘记告诉你答案——一旦我写好了程序，我该如何让它运行？


    1. 你直接运行它。

    2. 你先编译它，然后运行它。


    这是一种简化，尽管它是很有用的，因为编译活动的存在与否往往会对你用某种语言编程的感受产生巨大影响。让我们先给出简化的解释，然后再讨论它是如何过度简化的。


    “你直接运行它”适用于某些语言，例如 Python、JavaScript（注意：尽管名字相似，但与 Java 无关！）、PHP 和 Perl，它们是*解释型*。这意味着有另一个被称为解释器的程序，它读取你的程序并按照其说明操作。如果你的程序某处有问题，导致该部分无法被解释，解释器在运行该部分时会给出某种错误信息并停止。然而，到那时它可能已经运行了程序的早期部分。


    “你先编译它，然后运行它”适用于某些语言，例如 Java、Haskell 以及 C 的所有变体（C++, C#）、Objective-C 等，它们是*编译型*。这意味着有另一个被称为编译器的程序，它读取你的程序并将其翻译成一种更原始的形式。你程序中的某些类型错误可以在编译过程中检测到。如果没有发现此类错误，你就会得到一个编译后的程序，它保存为一个独立的文件，然后你可以像上面那样运行它。因为部分工作已经由编译器完成，编译后的程序运行速度通常比具有相同功能的解释型程序更快。通常更重要的是，因为编译器检查了某些类型的错误，你获得了一个保证：如果你的程序编译正确，那么你可以确定该类错误不存在。编译器执行的主要错误检查类型被称为*类型检查*：我们将在
    4.2 节中对类型进行讨论。


    **故事**


    1978 年，Robin Milner 发表了一个关于他定义的编程语言核心的定理，该语言被称为 ML；这门语言影响了 Haskell 和许多后来的语言。该定理可以总结为“类型良好的程序不会出错”。也就是说，他证明了如果你的程序通过了编译，就不需要测试它。


    ### 4.2 类型


    如果你在数学或科学课回答问题时曾被提醒过“写上单位”，那么你就遇到过类型（types）。可以说，如果你看过婴儿使用形状分类器，你也遇到过了！程序中值的*类型*告诉了你关于你可以对其合法操作些什么的信息。为了知道在特定语境下使用它是有意义的，你需要了解关于该值的什么信息？


    **术语：类型检查**


    *类型检查*是检查程序各部分的形状是否正确匹配的过程：例如，一个设计为只接受整数的函数永远不会被赋予字符串作为输入。如果这是作为编译的一部分完成的，被称为*静态类型检查*；如果在运行时完成，则被称为*动态类型检查*。许多语言使用静态和动态类型检查的混合。


    '
