    11 如何寻求帮助（而不通过作弊）


    ## 11.2 解决更具体的问题


    如果你一直表现良好，但现在感到困惑，那么很好地处理这种情况就是确保你未来不会陷入更具普遍性问题的关键。


    第一步是分析是什么困惑了你。如果你的问题是编译时错误或运行时错误，或者是程序给出意料之外结果的某个特定案例，那么第 9 章讨论的技巧可能就是你需要的。如果你的程序有时正常工作，但并非总是如此，那么按照第
    7 章的描述，对其进行系统测试是下一步。


    ### 11.2.1 从错误消息获取帮助及利用错误消息帮助


    如果你的问题是*不断*收到某种特定的错误消息，这表明语言中某些内容是你系统性地不理解，该？在第 9 章中，我们简要提到，对于你不理解的错误消息，有用的方法之一（可能出乎你的意料）是将其粘贴到你最喜欢的搜索引擎中。你的语言越流行，这种方法就越有效，但如果你足够幸运，它会直接带你进入一个或多个页面，那里会有热心的人解释它的确切含义，以及如何修复产生它的问题。然而，也有一些理由需要警惕。


    - 不要陷进“兔子洞”太深。某些错误消息出现在各种情况下，你很容易陷入试图理解某人关于为什么*别人*会收到特定错误消息的讨论中，而*你*是因为不同的原因才收到它的。

    - 对你你不完全理解的解决方案要小心。如果你将他人的代码粘贴到你的程序中，可能会让情况恶化。查看某个可能的解决方案在你的上下文中是否有效是有用的，但务必在程序中使用注释清晰地界定你从别处获得的代码。如果你正在提交代码进行评估，这很可能也是强制要求的。

    - 如果你将在无法访问互联网的情况下接受评估，请注意不要过度依赖这种方法或任何其他基于搜索的技术。


    你可以做的另一件事是尝试分析*为什么*你不理解那条消息。错误消息往往难以理解的原因之一是，由于它们写得非常简练，使用了语言专家理解但初学者不理解的术语。如果你能识别出一个你不理解的术语，那么查阅它（在语言文档中，或再次在你最喜欢的搜索引擎中查找）可能很有帮助。


    例如，这里是 C 编译器有时产生的错误消息：


    `foo.c:8: error: lvalue required as left operand of assignment`


    它完全合逻辑，并且可能非常有帮助——*前提*是你知道 C 中“lvalue（左值）”、“operand（操作数）和“assignment（赋值）”的含义。


    ### 11.2.2 寻找解释和有用的代码


    有时，当你与某个问题斗争时，你可能会想到你绝不可能是第一个遇到它的人。搜索可能是有成效的，但我们在讨论搜索错误消息时提到的注意事项也适用于这里。你想做的事情越通用，你使用的语言被越广泛使用，搜索就越可能有帮助。例如，搜索
    `java read from file` 会对一个让 Java 新手臭名昭彰的问题给出良好的解释。


    当你进行此类搜索时，你可能会遇到一段代码，从上下文（也许是教程或论坛上的问题回答）来看，它对你可能很有用。即使允许，复制粘贴此类代码通常是不明智的。更好的做法是仔细阅读它以增强自己的理解，然后将其放在一边，利用你的新理解来编写自己的代码。这减少了你粘贴自己并不真正理解的代码的风险，从而导致得到一个你不理解的程序：这是一种负担。如果你确实复制了粘贴，或者你对是否已完全理解所发现的内容有任何疑问，请始终添加注释说明你从哪里找到了你所遵循的建议，以及你从哪里获得了代码；将来你可能想要再次阅读某些附带的解释。


    **提示**

    注意你在网上找到的材料的日期，并警惕其可能是为了你语言的旧版本编写的可能。


    使用标准库是利用你没有编写的代码最安全的方法。如果你的功能在这样的库中，你应该始终避免编写它自己的版本（除非那是你正在做的练习的特定目的）。如果你的语言有标准库，请花时间浏览一下标准库的文档：用好它可以节省你大量的精力。


    使用非标准库——即你可以将其导入程序中并加以利用的代码库，但它并不是任何使用该语言的人都能自动获得的——是一个有趣的中间案例，特别是当你发现自己可以选择这样做，也可以编写（或复制）你自己的代码来实现该库可以实现的功能时，尤为如此。使用库的优势是关注点分离：它帮助你的代码专注于其任务。缺点是你对该库有依赖。如果该库消失或损坏，你就有问题了。


    ### 11.2.3 为复杂程序寻求帮助


    假设你的程序已经到了这样一个阶段：复杂到无法指望别人阅读，但你又完全卡住了：你不理解。如果你有几百行代码，并且意识到它是一团乱码，那么从空白开始可能是最快的。然而，重新开始并不总是正确答案；有时它是不实际的，有时看起来又是没必要的。


    **术语：最小工作示例 (Minimal-working example)**

    针对特定问题的最小工作示例（MNWE）是你能构建的仍然存在该问题的最小、最简单的程序。一个小的、简单的程序更容易让你理解，所以很有可能一旦你仔细观察它，你就能弄清楚那里是怎么回事。如果你向别人寻求帮助，拥有一个
    MNWE 更加重要——他们阅读的与问题无关的内容越少，他们就能越快速越容易地理解情况并帮助你，而且他们越可能愿意这样做。


    **制作最小工作示例**

    要构建它，请取一个包含问题的程序副本，并开始删除和注释部分。每次当你做出更改时，执行你需要做的一切——例如重新编译、重新运行——以检查问题是否仍然存在。具体来说，我建议从程序中你*最*确定与问题无关的部分开始。将其注释掉，必要时用占位符替换。例如，如果你正在注释掉一段应该返回整数的代码体，并且你认为返回什么整数（对你的问题而言）并不重要，你可能会注释掉实际计算，并改用一条返回
    0 的语句。重新处理程序并检查正如预期的那样，问题仍然发生。在检查之后，删除被注释的代码。这有助于让你正在查看的代码在视觉上变得更简单，从而让你更有可能理解那里是怎么回事


    可能会在某一点，你移除了某些你认为无关的代码，令你惊讶的是，问题消失了或发生了变化。这种惊喜可能很好帮助你取得进展。


