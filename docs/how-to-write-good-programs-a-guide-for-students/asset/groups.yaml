    \ she decides to take a few minutes to understand what was happening. Why does\
    \ removing her semi-colon fix her problem? She decides to investigate semi-colons\
    \ after ifs in a separate, free-standing program that isn’t complicated by any\
    \ of the sprite stuff. Here it is:\n\n117\n\n9.2 When Your Program Runs but Behaves\
    \ Wrongly\n\n**Java example (don’t do this!)**\n\n```java\npublic class IfFalse\
    \ {\n    public static void main(String[] args) {\n        if (false);\n     \
    \   {\n            System.out.println(\"yay, got here!\");\n        }\n    }\n\
    }\n```\n\nAfter playing with this she goes back to her Java textbook and spends\
    \ a bit of time on the web reading about blocks and empty statements, and ends\
    \ up understanding a lot more about the role of semi-colons in Java than she did\
    \ to start with.\n\nNotice that we didn’t say much about exactly how what Kasia\
    \ saw differed from what she expected. That’s because in this fictitious case,\
    \ she didn’t analyse that much. A different approach would have been not to alter\
    \ the code at all, but instead, to watch very carefully what happened and think\
    \ about the relationship with the code. Perhaps by doing that Kasia could have\
    \ realised that her turn command was always being executed, not only on some randomly\
    \ chosen occasions. However, depending on how complicated the rest of the behaviour\
    \ of the system was, and especially on how much randomness there was in it, that\
    \ might have been harder than what she did.\n\n118\n\n9 How to Debug Your Program\n\
    \n### 9.2.1 Special Cases: Non-termination and Crashes\n\n**When Your Program\
    \ Runs for Ever**\nYou start your program, expecting it to run for a moment and\
    \ give a result, and instead, it runs but does not terminate. Either nothing visible\
    \ happens, or you have an endless stream of output. You will need to stop the\
    \ program manually, either by pressing the appropriate button in your IDE, or\
    \ by using the operating system directly, e.g. hitting Control-C in a Linux system,\
    \ or killing the command window in which it is running.\n\nUsually this is a sign\
    \ that your program contains an endless loop (or an endless stream of recursive\
    \ calls). Check the loop conditions, or the logic that leads to recursion, carefully.\
    \ Ask yourself: why do I expect this process ever to finish? If you do not immediately\
    \ see the problem – especially if there is more than one loop and you are not\
    \ sure which one is causing the problem – then either tracing the program execution\
    \ in a debugger, or inserting print statements, can help you see what is going\
    \ wrong.\n\nIt is possible that what you have is not true non-termination, but\
    \ a very inefficient program that is doing more work than you expected – it would\
    \ finish eventually, but not until the middle of next week, or worse. Fortunately\
    \ such problems are rare in early programming exercise solutions:\n\n**When Your\
    \ Program Crashes**\nYou start your program, expecting it to run for a moment\
    \ and give a result, and instead, it stops with some kind of error. This is often\
    \ a cryptic message. Depending on your language this might be an unhandled exception,\
    \ a segmentation fault, an out of memory error, a stack overflow, or something\
    \ else. We will call them “crashes”.\n\n119\n\n9.2 When Your Program Runs but\
    \ Behaves Wrongly\n\n120\n\n9 How to Debug Your Program\n\n**Null pointer exception**\n\
    In Java (and related languages), NPEs are the common cause of crashes. An NPE\
    \ arises when your code attempts to use a reference whose value is null. What\
    \ does this mean? Because the reference does not point to any state, your program\
    \ will crash.\n\n**Stack trace**\nA stack trace is an ordered list of all the\
    \ functions that the program has entered, but not exited. The first thing to do\
    \ is to understand which order the list is given. The most recently entered function\
    \ may be at the top (usual in Java) or the bottom (usual in Python). This is the\
    \ one where the crash occurred. At the other end of the stack trace is whatever\
    \ function was invoked at the very start. The next line in the list is the function\
    \ that called it, and the line number shows where it was called, and so on.\n\n\
    Usually the bug is located in the most recent function (findCustomer in our example),\
    \ but not always. Especially, if you see that the most recent calls are not to\
    \ code you wrote, but to standard library or infrastructure functions, don’t be\
    \ tempted to suspect them! What it probably means is that your code invoked a\
    \ library function incorrectly, e.g. with invalid arguments, which later caused\
    \ a problem. Look at the most recent place in the stack trace that is about your\
    \ code, and work from there.\n\n121\n\n**9.3 Cardboard Debugging**\n\nThis useful\
    \ technique is known by many names, including for example “rubber duck debugging”;\
    \ I call it “cardboard debugging” because that’s the name I first learned for\
    \ it – and because no rubber duck manufacturer has made me a tempting sponsorship\
    \ offer yet.\n\nThe key observation is that when you can’t understand why your\
    \ program isn’t working, it often helps to explain, in detail, to someone else,\
    \ why it should work. You might, for example, explain it to a peer or to a tutor\
    \ on your course. However, the next important observation is that when you do\
    \ this, it will usually be you, not the other person, who suddenly sees what the\
    \ problem is.\n"
