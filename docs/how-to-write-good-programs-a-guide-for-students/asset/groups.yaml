    11 How to Get Help (without Cheating)


    ## 11.2 Solving a More Specific Problem


    If you have been doing fine, but are feeling confused right now, then

    handling the situation well is the key to ensuring that you do not

    end up with a more general problem in future.


    The first step is to analyse what it is that’s confusing. If your

    problem is a compile-time or run-time error, or a particular case

    where your program gives surprising results, the techniques discussed-ed in Chapter
    9 are probably what you want. If you have

    a program that works properly sometimes, but not always, then

    systematically testing it, as described in Chapter 7, is the next step.


    ### 11.2.1 Getting Help from and with Error Messages


    What if your problem is that you *keep* getting a particular kind

    of error message, suggesting that there’s something about the

    language that you systematically don’t understand? In Chapter 9

    we briefly mentioned that one of the most useful things you can

    do with an error message you don’t understand is, surprisingly

    perhaps, paste it into your favourite search engine. This works

    better the more popular your language is, but if you’re lucky, it will

    take you straight to one or more pages where some helpful people

    explain exactly what it means and how to fix the problems that give

    rise to it. However, there are some reasons to be wary.


    - Don’t go too far down a rabbit hole. Some error messages arise in

    a wide variety of circumstances, and it’s easy to get sucked into

    trying to understand a discussion about why someone *else* gets a

    certain error message, while *you* get it for a different reason.

    - Be careful with solutions you do not fully understand. If you

    paste someone else’s code into your program, you can make

    matters worse. It can be useful to see whether or not a possible

    solution works in your context or not, but always delimit code

    you got from elsewhere clearly in your program with comments.

    If you are submitting code for assessment, this may well be

    required anyway.

    - If you will be being assessed in a situation where you won’t have

    access to the internet, beware of getting too dependent on this,

    or any other search-based, technique.


    The other thing you can do is try to analyse *why* you don’t

    understand the message. One of the reasons why error messages

    are so often hard to understand is that they are written tersely,

    using terminology that experts in the language understand but

    that beginners do not. If you can identify a piece of terminology

    you’re not understanding, then looking it up (in the language

    documentation, or in your favourite search engine again) may

    well help.


    For example, here’s an error message of a kind that C compilers

    sometimes produce:


    `foo.c:8: error: lvalue required as left operand of assignment`


    It makes perfect sense and is likely to be very helpful –*provided*

    that you know what the terms “lvalue”, “operand” and “assignment-ment” mean in
    C.


    ### 11.2.2 Finding Explanations and Helpful Code


    Sometimes as you struggle with a problem it may occur to you that

    you cannot possibly be the first person to encounter it. A search

    may be fruitful, but the caveats mentioned when we discussed

    searching for error messages apply here too. The more generic the

    thing you want to do, and the more widely used your language, the

    more likely it is that searching will help. For example, searching

    `java read from file`

    yields good explanations of something that is notorious for tripping-up newcomers
    to Java.


    When you do such a search, you may well come across a piece

    of code that appears, from the context – perhaps a tutorial or an

    answer to a question on a forum – to be likely to be useful to you.

    Copy-pasting such code is usually unwise even if it is permitted.

    It is better to read it carefully to enhance your own understanding,

    then put it aside and use your new understanding to write your own

    code. This reduces the risk that you copy-paste code that you do not

    really understand, and hence end up with a program that you do

    not understand: this is a liability. If you do copy-paste, or if you

    are in any doubt about whether you have completely understood

    what you found, always add comments to indicate where you found

    the suggestion you are following, and what code you got from

    where; you might want to go back and read some accompanying

    explanation again in future.


    **Tip**

    Look out for dates on material you find online and be alert

    to the possibility that it is written for an old version of your

    language.


    Using standard libraries is the safest way to make use of code

    you did not write. If the functionality you want is in such a library,

    you should always avoid writing your own version of it (unless

    that is the specific point of an exercise you are doing). Spend

    some time browsing the documentation of the standard library, if

    your language has one: good use of it can save you vast amounts

    of effort.


    Using a non-standard library – that is, a library of code that

    you can import into your program and make use of, but that is

    not automatically available to anyone using your language – is an

    interesting intermediate case, especially when you find you have

    a choice of either doing that or writing (or copying) your own code

    to do what the library could do. The advantage of using

    the library is separation of concerns: it helps your code stay

    focused on its task. The disadvantage is that you have a

    dependency on the library. If the library disappears or breaks

    you have a problem.


    ### 11.2.3 Getting Help with a Complex Program


    Suppose you have got a stage where your program is too

    complex to expect anyone else to read, but you are totally

    stuck: you you do not understand. If you have

    few hundred lines of code, and you realise it is a nasty

    mess of code, it may be quickest to start from a blank.

    Starting again is not always the right answer, however;

    sometimes it is impractical, and sometimes it seems

    unnecessary.


    **Terminology: Minimal-working example**

    A minimal-working example (MNWE) – for a particular

    problem – is the smallest, simplest program you can construct

    that still has the problem. A small, simple program is easier for you to understand,
    so there’s a good chance that once you look carefully at it, you’ll

    able to work out what’s on. Having a MNWE is even more

    important if you ask someone for help – the less they have to read that is not
    relevant to the problem, the more quickly and easily they can understand what’s
    on and help you, and the more likely it is that they will be willing to do.


    **Making a minimal-working example**

    To build it, take a copy of your program that contains a problem,

    and start cutting and commenting parts out. Each time you make

    a change, do whatever you need to do – e.g. recompile, rerun – to

    check that the problem is still there. Concretely, I suggest

    starting with the part of the program that you are* most* confident is not irrelevant
    to the problem. Comment it out, replacing it with a

    dummy if necessary. For example, if you are commenting out

    the body of a piece of code that should return an integer, and

    you believe it doesn’t matter (for your problem) what integer it

    returns, you might comment out the actual calculation and put in

    a statement returning 0 instead. Reprocess the program and check

    that, as expected, the problem still occurs. Having checked that,

    delete the commented out code. This helps to make the code you’re

    looking at get visually simpler, which in turn makes it more likely

    that you’ll understand what’s


    It may happen that at some point, you remove some code

    you expected to be irrelevant, and to your surprise, the problem

    vanishes or changes. Such a surprise may well help you progress.

