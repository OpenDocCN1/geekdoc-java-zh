- md: "\n## 9.6 After Removing the Bug\n\nBy programming defensively, you ensure that\
    \ you cannot be blamed for a problem that is not your fault. If you check a pre-condition\
    \ and complain immediately if your code is being called with arguments it should\
    \ not have to handle, you avoid the risk that your code malfunctions on the argument\
    \ it was not designed to handle and somebody later blames you for this. Of course,\
    \ often you will be the author of both caller and callee, in which case the benefit\
    \ to you is that defensive programming makes it easier to identify where a problem\
    \ begins.\n\nMore generally, what you need to defend against, and how, depends\
    \ on the circumstances. Sometimes – for example, in many safety-critical situations\
    \ – it is important to enable the program to keep running, even if something unexpected\
    \ happens; you might supply sensible default values for missing data, for example,\
    \ in order to defend against the program crashing or showing unpredictable behaviour.\
    \ At other times, it is better to stop the program immediately a problem occurs,\
    \ emitting a useful diagnostic message; this defends against hard-to-track-down\
    \ misbehaviour that the problem might cause later.\n\nStudents often worry that\
    \ by inserting checks that shouldn’t really be necessary because they should always\
    \ succeed (if everything else in the program is correct), they are bloating their\
    \ programs and making them inefficient. Don’t worry about this. Most such checks\
    \ are very quick, and modern compilers are pretty good at optimising out checks\
    \ that are truly unnecessary. Human brain power is a much more limited resource,\
    \ and that’s what you should be trying to save.\n\nThat said, if you, and every\
    \ other reader of the code, can *easily* and *confidently* see that a check is\
    \ not required, then there is no virtue in including it. This is a kind of code\
    \ sense.\n\n## 10 How to Improve Your Program\n\nWe have talked about how to debug\
    \ your program (Chapter 9) and about the basics of making your program clear and\
    \ readable (Chapter 8). What else could we mean by “improving” your program?\n\
    \nWe’re touching here on *design*. In software engineering, design is about building\
    \ software that not only meets the requirements, but does so in the best possible\
    \ way. There are many ways we can judge how good a design is. Two of them are:\n\
    \n- how *maintainable* your program is;\n- how *efficient* your program is.\n\n\
    Let’s discuss these aspects in turn, and then we’ll discuss how you can get to\
    \ there from here. That is, if your program works, but you decide it could, and\
    \ should, be more maintainable or more efficient, how can you safely improve it,\
    \ without breaking it in the process? To do that you use the technique (briefly\
    \ mentioned in Chapter 9) called *refactoring*.\n\n### 10.1 Maintainability\n\n\
    A very reasonable first reaction to coming across the idea of a program being\
    \ maintainable is confusion. Lines of code don’t wear out and need retyping –\
    \ semi-colons don’t drop off the ends from time to time – so what are we talking\
    \ about? The term *maintenance* has stuck since the early days of programming,\
    \ and probably came in by analogy with manufacturing physical goods. The thing\
    \ being maintained is not really the program, but the *relationship* between the\
    \ program and its environment, which includes the people, processes, software\
    \ and hardware that the program must interact with. Whenever something in the\
    \ environment changes, the program may need to change, in order to maintain the\
    \ relationship. For example, it’s normal to have to change a program from time\
    \ to time to keep track of new versions of the programming language. It’s even\
    \ more common for the needs of the users to change over time. Stretching the definition,\
    \ even fixing bugs can be seen as a kind of maintenance. The easier it is to effect\
    \ any necessary changes, the more maintainable we say your program is.\n\nWhen\
    \ you’re new to programming, especially in the artificial setting of a beginners’\
    \ programming course, you are relatively isolated from these concerns. Most likely,\
    \ you’ll be given a clearly described problem to solve, and nothing about it will\
    \ change while you do it. Even so, thinking about maintainability is a good habit\
    \ to get into, because the same properties that make code easy to maintain also\
    \ help to get it correct.\n\nThe first stage of ensuring maintainability is following\
    \ the guidelines we discussed in Chapter 8 for making your program clear. That’s\
    \ because any kind of maintenance to a program involves someone being able to\
    \ understand how it works *now*, so that they can confidently change it. If your\
    \ program is difficult to understand, they may find themselves guessing about\
    \ what the program currently does, or about what it is supposed to do, which makes\
    \ the process of changing it less reliable.\n\n**Tip** \nEven if you are confident\
    \ you are the only person who will ever need to change your program, it still\
    \ pays to work on its clarity. You might be surprised by how fast you forget what\
    \ was in your head when you wrote it!\n\nThe next stage of ensuring maintainability\
    \ is to think about what changes are most likely to be required in future, and\
    \ structure the program so as to make those changes as easy as possible. This\
    \ may sound as though it requires a crystal ball, and indeed it is not always\
    \ easy. You may guess that if your program talks about three kinds of widget,\
    \ then it is quite likely that a fourth kind of widget might be required in future.\
    \ Whether that is really true, though, is not something you can work out just\
    \ by looking at your program: it depends on the real world.\n\n#### 10.1.1 Eliminating\
    \ Duplication\n\n**The “Write Once!” rule**\n\nThe idea is that each thing – let’s\
    \ say, each independent decision – ought to be incorporated just once into the\
    \ program. That way, if this decision needs to be changed later, there is only\
    \ one place in the program that needs to be changed. This is easier than changing\
    \ several places, and avoids the risk that you accidentally miss out one of the\
    \ places that should be changed.\n\nThis is not precise – it is only a rule of\
    \ thumb – because it is not always obvious what constitutes a “thing” that should\
    \ be recorded just once. Some cases are very clear. Suppose a large chunk of code\
    \ is repeated, exactly, three times in your program, and under all circumstances\
    \ that you can imagine, any change that had to be made to one of the copies would\
    \ have to be made to all three. Then the decisions incorporated in that code are\
    \ written three times, for no good reason. You should definitely look for a way\
    \ to remove the duplication, perhaps by making the chunk of code into the body\
    \ of a function that can be called three times.\n\nHowever, with smaller chunks\
    \ of code it becomes important to ask yourself whether they will really always\
    \ be the same – they record the same decision – or whether they just happen to\
    \ be the same at the moment.\n\nHere’s a simple example.\n\n**Java example (before\
    \ refactoring)**\n\n```java\nif (noItems > 10) {\n    basketKind = \"big\";\n\
    \    sorted = 1;\n} else if (noItems > 5) {\n    basketKind = \"medium\";\n  \
    \  sorted = 1;\n} else {\n    basketKind = \"small\";\n    sorted = 1;\n}\n```\n\
    \nThere are quite a few things wrong with this! Rather than fix them all at once,\
    \ though, we pick one aspect to improve first. Here we see that one line,\n\n\
    `sorted = 1;`\n\noccurs three times. Suppose that, in context, we understand that\
    \ this genuinely is duplication of a decision: if one of these lines changed (say,\
    \ we changed sorted to decided, or we changed its type to boolean so that it would\
    \ have to be set to true instead of to 1), all three would have to change. We\
    \ can change the code to have that line only once, without changing anything about\
    \ how it behaves. This is an example of a refactoring. Here’s the code after that\
    \ one change.\n"
  mdcn: "\n\n## 9.6 移除 Bug 之后\n\n通过防御性编程，你可以确保自己不会因为并非你所引起的问题被埋责。如果你检查了前置条件，并在代码被传入了它不应要处理的参数时立即报错，你就能避免代码在未设计用于处理的参数上发生故障，并导致事后有人因此指备你的风险。当然，通常你可能既是调用者也是被调用者的作者，在这种情况下，对你有利的处是防御性编程让你更容易识别问题从何处开始。\n\
    \n更广泛地说，你需要防御的内容以及如何防御，取决于具体情况。在某些情况下——例如，在许多安全关键的场景中——即使发生了意外情况，让程序继续运行也是至关重要的；例如，你可能会为缺失的数据提供合理的默认值，以防止程序崩溃或表现出不可预测的行为。在其他时候，当发生问题时立即停止程序并发出有用的诊断信息会更好；这可以防止问题稍后可能导致难以追踪的错误行为。\n\
    \n学生经常担心，通过插入那些本不真正需要的检查（如果程序中其他部分都是正确的，这些检查应该总是成功的），会使程序臃肿并降低效率。不用担心这个。大多数此类检查都非常快，而现代编译器非常擅长优化那些真正不必要的检查。人类的大脑力是一个受限得多的资源，这才是你应该努力节省的。\n\
    \n话虽如此，如果你以及代码的每一位读者都能*轻松*且*确信*地看到某个检查不是必需的，那么包含它就没有意义了。这是一种代码感。\n\n## 10 如何改进你的程序\n\
    \n我们已经讨论了如何调试你的程序（第 9 章）以及让程序变得清晰易读的性知识（第 8 章）。除此之外，我们所谓的“改进”你的程序还能指什么呢？\n\n我们在这里触及了*设计*。在软件工程中，设计是关于构建不仅满足需求，而且以最好的方式实现需求的软件。我们有很多方法可以判断一个设计的好坏，其中两种是：\n\
    \n- 你的程序的*可维护性*如何；\n- 你的程序的*效率*如何。\n\n让我们逐讨论这些方面，然后讨论如何从这里到达那里。也就是说，如果你的程序可以运行，但你认为它可以且应该更具可维护性或效率，你该如何在不破坏程序的情况下安全地改进它？为了做到这一点，你需要使用（第\
    \ 9 章简要提到过的）称为*重构*的技巧。\n\n### 10.1 可维护性\n\n遇到“程序是可维护的”这个想法时，非常合理的反应是困惑。代码行不会磨损需要重新输入——分号也不会偶尔从末尾掉落——所以我们在谈论什么？*维护*（maintenance）这个术语从编程早期一直存在，可能是通过类比物理商品的制造引入的。被维护的并不是程序本身，而是程序与其环境之间的*关系*，这包含了程序必须交互的人员、流程、软件和硬件。每当环境中的某些事物发生变化时，程序可能需要改变以维持这种关系。例如，不时地更改程序以跟踪编程语言的新版本是正常的。用户的需求随着时间的推移而变化更为常见。扩大定义，甚至修复\
    \ Bug 可以被看作是一种维护。实施任何必要更改越容易，我们越说你的程序具有可维护性。\n\n当你刚开始编程时，特别是在初学者编程课程的虚拟环境中，你与这些考虑是相对隔绝的。很可能，你会被赋予一个描述清晰的问题去解决，在你执行过程中它不会发生任何变化。尽管如此，养成考虑维护性的习惯也是好习惯，因为让代码易于维护的属性也有助于保证正确。\n\
    \n确保可维护性的第一阶段是遵循我们在第 8 章讨论的让程序清晰的指南。这是因为对程序的任何维护都涉及到有人能够理解它*现在*是如何工作的，以便他们确信地更改它。如果你的程序难以理解，他们可能会发现自己在猜测程序正在做什么，或者它应该做什么，这会让更改过程变得不可靠。\n\
    \n**提示** \n即使你确信自己是唯一一个需要更改程序的人，努力提高清晰度也是值得的。你可能会惊讶于自己对自己写代码时脑子里的内容遗忘得有多快！\n\n\
    确保可维护性的下一个阶段是考虑未来最可能需要更改，并构造程序以使这些更改尽可能容易。这听起来似乎需要一个水晶球，而且事实上这并不总是容易的。你可能会猜到，如果你的程序涉及到三种小部件（widget），那么未来很可能需要第四种小部件。然而，这是否真的\
    \ true并不是通过观察程序就能判断出来的：它取决于现实世界。\n\n#### 10.1.1 消除重复\n\n**“只写一次！”规则**\n\n这个想法是，每一件事——比说，每一个独立的决策——都应该只在程序中包含一次。这样，如果以后需要更改该决策，程序中只有一个地方需要更改。这比更改多个地方要容易，并且避免了你不小心漏掉某一个需要更改的地方的风险。\n\
    \n这并不精确——它只是一个经验法则——因为并不总是清楚什么构成了一个应该只记录一次的“东西”。有些情况非常明确。假设一段代码块在程序中完全重复了三次，在你可以想象的所有情况下，对其中一个副本的任何更改都必须对所有三个进行更改。那么该代码中包含的决策被写了三次，毫无理由。你应该寻找一种消除重复的方法，也许是将该代码块封装成可以调用三次的函数体。\n\
    \n然而，对于较小的代码块，重要的是问自己它们是否真的总是保持相同——它们记录相同的决策——还是它们在目前恰好是相同的。\n\n这里有一个简单的示例。\n\n\
    **Java 示例（重构前）**\n\n```java\nif (noItems > 10) {\n    basketKind = \"big\";\n\
    \    sorted = 1;\n} else if (noItems > 5) {\n    basketKind = \"medium\";\n  \
    \  sorted = 1;\n} else {\n    basketKind = \"small\";\n    sorted = 1;\n}\n```\n\
    \n这段代码有很多问题！不过，我们并不一次性修复所有问题，而是先选择一个方面进行改进。在这里我们看到有一行代码，\n\n`sorted = 1;`\n\n\
    出现了三次。假设在语境中，我们理解这确实是决策的重复：如果这些行中的某一个发生了变化（例如，我们将 sorted 更改为 decided，或者将其类型更改为布尔值，以便它必须设置为\
    \ true 而不是 1），那么三个地方都必须更改。我们可以更改代码让该行只出现一次，而不改变它的任何行为。这是一个重构的示例。这里是该一次更改后的代码。\n\
    \n"
