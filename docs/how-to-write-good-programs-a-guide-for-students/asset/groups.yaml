    **Is it the compiler that’s wrong?**


    No. Well, almost certainly no. After twenty-five years of teach-


    ing programming, on and off, I recently had a case where a


    first-year undergraduate student had a problem understand-


    ing a compiler’s error message and it* did* turn out to be a


    (known) compiler bug. However, I’ve lost track of how many


    times new students have suspected a compiler bug that wasn’t


    there. Unless you just wrote the compiler – in which case


    you’re not what I mean by a “new student” anyway – assume


    it is correct.


    **9.2**** When Your Program Runs but Behaves Wrongly**


    Suppose your code compiles and runs – but it doesn’t do what you


    expect. Perhaps it yields a wrong result, causes confusing behaviour


    of some interface, or prints something you don’t expect; perhaps it


    even crashes or seems to run for ever. What then?


    The first thing is to look for the simplest case where the program


    doesn’t do the right thing. Preferably, write an automated test that


    fails, exercising your program in this simplest case: but if you


    are not yet writing automated tests, making a note, and running


    the test manually, will do for now. Getting this test to pass is


    a concrete goal to aim for. As mentioned in Chapter 7, keeping


    it in the set of tests that you run regularly in future will ensure


    that you do not re-introduce the same bug, that is, it will prevent


    *regression*.'
