    8.5 Structure and Idiom


    99


    This advice about high-level structuring may seem unsatisfac-


    tory because it is hard to decide which structure is best without


    considerable experience; you will inevitably learn partly from your


    mistakes. It turns out that a common concrete sign of possible


    problems with your current structure is that your lines of code get


    too long.


    **How long should a line of code be?**


    If you find yourself resizing a window, or scrolling horizontally,


    in order to see the whole of a line of your code, it is probably too


    long to comprehend efficiently. Even if you succeed in adjusting


    your own environment so that you can see the whole line, you


    may well be causing difficulty for someone else who has to read


    your code in future. Projects, and sometimes whole language


    communities, develop conventions about the maximum length


    of a line: for example, Python’s PEP 8 prescribes that no line


    should be longer than 79 characters.


    One way to tackle long lines is to split them. If you do


    this, consult your body of reputable code in your language


    to see what the conventions are about where a line may be


    split. Usually, though, a too-long line of code is a sign of an


    underlying problem, and it is better to fix that. Ask yourself:


    • Is a name too long? If so, do not just abbreviate it: think about


    whether there is a better, shorter name. If not, perhaps the


    thing named should be split up?


    • Has your logical structure become too deeply nested (e.g. do


    you have an if inside an if inside an if) so that the line


    starts with a lot of whitespace? If so, do not just reduce your


    indentation width: think about how you could improve the


    structure. Perhaps there is a chunk of nested code that should


    be a separate function?


    • Do you have a complex expression involving several opera-


    tors, functions or messages? These are often hard to under-


    stand however they are laid out; consider constructing your


    result in stages, naming the intermediate results carefully.'
