    **7**


    How to Test Your Program


    You’ve written enough of your program that it’s possible to run


    it; how do you find out whether it’s right, so that you can fix it if


    it isn’t? Well, you run it, and see if it does what you expect. For a


    really simple program, that may be all there is to say.


    **Python example**


    print("Hello, World!")


    We run the program, observe that it prints “Hello, World!”, and


    conclude that it is correct.


    What did we do there, though? We implicitly understood


    • that the program did not need to be given any command-line


    arguments, or any other specific context, in order to operate;


    • that what it was supposed to do was to print “Hello, World!” to


    the usual place where we expect to see program output (known


    as* standard out*).


    **Terminology: Specification**


    A* specification* for a program is a description of what it is


    supposed to do. It may be very detailed, saying exactly what the


    program should do under any circumstances; or it may be* loose*,


    giving only a small part of the information the programmer


    will need.


