    ## 13.5 如果单选择题呢？


    这些题目最可能暴露任何问题。根据你所使用的语言、环境以及你自己的专业知识，你可能会编写自动化测试，也可能只是在示例用例上手动运行程序。


    **13.5**** 如果单选择题呢？**


    由于要求你实际编写程序的编程考试通常很难批改，你可能会发现自己参加的是单选择考试。这些题目可能很直观，考察与你在其他类型考试中使用的相同技能。或者，它们可能被特意选中，以考察你对语言冷门知识的了解。不要假设因为是单选择就意味着它很容易：设计出任意难度的单选择题是完全可能的！如果你有往年试卷，试着做一道。弄清楚考试对错误答案的规定是什么——是会扣分（如果是的话，你不应该猜），还是不扣分（如果是的话，你大可以去猜）？


    **提示**


    尝试自己给自己出题。更好的办法是，和一群朋友一起这样做，交换题目并讨论答案。你将不仅能洞察可以出哪些问题，还能洞察你自己理解和不理解什么。


    ## 14 如何选择编程语言


    如果你是一个学生——或者说，如果你是一个老师！——你通常无法选择在某个投入的课程中使用哪种编程语言。到目前，我希望你已经掌握了一些掌握指定语言的技巧，无论它是什么。但是，如果你在项目中使用什么语言上有选择，或者在下一个学习哪种编程语言上有选择呢？许多因素可能会影响你的决定，从你想编写的程序性质，到你自己的心态状态。


