    80


    7 How to Test Your Program


    inputs, and the outputs are automatically checked using some kind


    of specification, which you give as a* property* that the function’s


    input and output should satisfy. If your program has a bug that


    means the property can fail on some input, there’s a decent chance


    that when the random tester throws, say, 10,000 inputs at your


    program, at least one of them will demonstrate the bug. The clever


    part comes next: the testing tool then goes through a simplification


    process aimed at finding the simplest way to cause that buggy


    behaviour, and that’s what it shows you, for you to debug.


    The property you test might be very basic (very* loose* or impover-


    ished), e.g. it might just capture that the program should not crash.


    Or it might be extremely sophisticated, laying out the relationship


    between the input and the output in detail. In practice, it is rare to


    test a perfectly detailed property, because the task of writing one


    tends to be as hard as, and closely related to, the task of writing


    the program. Generally, the property only captures some of the


    information about what the program should do, so if the property


    is true, it doesn’t guarantee that the program is correct: there might


    still be a bug that this property cannot expose, no matter how many


    inputs are tested. However, if the property turns out to be* false*, it


    does show that there’s a problem.


    Here’s an example. Suppose our function factor is supposed


    to take a positive integer and return a list of its prime factors


    (with multiplicity, so that, for example, factor 18 might return


    \[2,3,3\]). We could test it like this:


    **Haskell example**


    import Test.QuickCheck


    \-- function factor omitted...


    prop\_factor :: Int -> Bool


    prop\_factor i = product (factor i) == i


    The function prop\_factor takes an integer, and returns true if,


    on that integer, the function factor returns a list which satisfies a


    basic reasonableness property: multiplying together the supposed'
  - '[PAGE 90]


    7.6 Property-Based Testing


    81


    prime factors does produce the original integer. If some test of


    this property fails, there is definitely a problem with the factor


    function. However, prop\_factor does not catch all possible prob-


    lems that the factor function could have. For example, it does


    not check that the elements of the list that factor returns are


    really prime numbers. Indeed, the factor function that simply


    returned the one-element list containing just its input would always


    pass. Nevertheless, such simple, partial testing properties can be


    easy to write and very useful for catching the kind of errors


    programmers typically make. Suppose someone misunderstands


    the specification, and instead of returning a list of the prime


    factors with multiplicity, their factor returns a list of the* distinct*


    prime factors, so that given 18 it returns \[2,3\]. When I wrote


