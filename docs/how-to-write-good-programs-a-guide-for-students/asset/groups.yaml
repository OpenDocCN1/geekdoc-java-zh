    112


    9 How to Debug Your Program


    •* single-stepping* – that is, letting the program execute one line at


    a time, e.g. so that you can check which way it goes at an if


    statement; or


    • examining the values of variables.


    A little exploration of the interface will probably reveal how


    to use these. Many debuggers have lots of more sophisticated


    features, but you don’t need them for now. When you do feel like


    investigating, see if there’s a tutorial for the specific debugger you’re


    using.


    To get maximum benefit, you need to learn not just the mechan-


    ics of using a debugger, but also how to use a debugger effectively.


    Forming a hypothesis first, and then testing it, is a useful technique


    here. For example, if you are about to step through a line that


    calculates a value,* first* ask yourself what you expect the value to be,


    *then* do the step and check whether it is. If you just wait for some-


    thing surprising to happen, it’s remarkably easy not to notice where


    the trouble begins. It’s fine, of course, to run the debugger several


    times, first to get an overview of what’s happening, and then, more


    carefully, to understand important sections of it in detail.


    **Changing the Program to Understand It**


    What can you do if you can neither find a usable debugger, nor get


    your program to print an informative string when it gets to an infor-


    mative place in the computation? You could consider rewriting it


    into more inspectable pieces, to understand what’s going on.


    We are not talking, here, about the kind of restructuring that


    improves your program overall. This is not a good time to under-


    take that kind of work: since you are starting with a program whose


    behaviour you don’t fully understand, changing it radically may


    leave you more confused. It is better to make minimal, careful


    changes at this stage, and accept that you may need to undo them


    after you have understood the bug. For example, if you have an


    encapsulated (hidden) function which you suspect may be the cause


    of the problem, make a copy of it that’s out in the open, and try it


    out separately.'
