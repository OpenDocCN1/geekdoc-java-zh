    \ a function or method is defined in the language, and that you have understood\
    \ the type. That’s something, and if you are writing for marks, getting this right\
    \ may already earned you a few.\n\n**Tip**\n\nUnlike humans, who may not even\
    \ consciously notice typos in what we read, computers can be completely flummed\
    \ by the smallest of errors. Get into the habit of checking that you haven’t mis-spelled\
    \ something, or put an uppercase letter where there should be a lowercase one\
    \ or vice versa.\n\n## 3.4.2 Making Progress Towards Fully Correct Code\n\nNext,\
    \ go on to understanding what the actual functionality you have to implement is.\
    \ Again, do not feel you have to get it all correct.\n"
  mdcn: "\n\n## 3 如何开始\n\n**Java 示例**\n\n```java\npublic class MyClass {\n\n}\n```\n\
    \n在许多语言中，你现在已经有了一个合法的程序，即使你所写的内容内部是空的，就像刚才那个例子一样。在 Haskell 中，了解特殊值 `undefined`\
    \ 是很有用的，它的作用正如其名称所示，例如：\n\n**Haskell 示例**\n\n```haskell\nmyFunction :: String\
    \ -> String\nmyFunction = undefined\n```\n\n我们之前已经在 Fizz Buzz 模板文件中见过 `undefined`\
    \ 了。Python 的 `pass`（我们稍后会看到）具有类似的作用。\n\n检查你到目前的语法是否正确：如果你正在使用编译型语言，请编译程序；否则，请按照某种特定语言的说明运行它。当然，这同时也检查了你是否知道如何编译或运行程序。如果有错误，越早发现就越容易修复。如果没有错误，做得好！\n\
    \n在学习一门语言的刚开始，遇到一系列没有人预警过你的问题是很常见的，因为你所犯的错误对于有该语言经验的人来说是根根不会发生的。如果这种情况发生在你身上，不要气馁！利用每一个机会检查你的工作，基础知识很快也会变成你的本能。\n\
    \n## 3.4 编写你的程序\n\n**故事**\n\nLeslie 正在上一门 Haskell 课程。她看到题目上写着：\n\n*编写一个函数 max，接收两个整数并返回较大的那个。*\n\
    \n她记得有人告诉过，当你在 Haskell 中写函数时，应该先给出它的类型，然后是定义。她还记得——因为这看起来很惊讶——一个带有两个输入的函数的类型中有两个箭头.^a\n\
    \n她将：\n\n```haskell\nmax :: integer -> integer -> integer\n```\n\n输入到被告诉使用的环境\
    \ GHCi 中，并按了回车。\n\n遗憾的是，她收到了错误信息：\n\n```\n<interactive>:8:1: error:\nNo instance\
    \ for (Ord integer1) arising from a use of ‘max’\nPossible fix:\nadd (Ord integer1)\
    \ to the context of an expression type signature:\nforall integer1. integer1 ->\
    \ integer1 -> integer1\nIn the expression: max :: integer -> integer -> integer\n\
    In an equation for ‘it’: it = max :: integer -> integer -> integer\n```\n\n这对她来说没什么意义，但她并没有慌张。她首先意识到，她把\
    \ `integer` 写成了本该写 `Integer` 的。大小写通常是重要的！修正为：\n\n```haskell\nmax :: Integer ->\
    \ Integer -> Integer\n```\n\n这是因为*严格来说*，任何 Haskell 函数都恰恰好有一个输入！提供“第一个”输入会产生一个能够接受“第二个”输入的函数。如果你想了解更多，请查阅*柯里化*(currying)。\n\
    \n……遗憾的是，这给了她另一个错误信息。噢，她该怎么办？\n\n她转向她的 Haskell 教科书，发现书中提到了在命令行与 GHCi 交互，但大部分建议在文件中编写代码，然后用\
    \ `:load` 加载文件。她尝试了。\n\n```\nPrelude> :load \"max.hs\"\n```\n\n接下来她发现：\n\n```\n\
    max.hs:1:1: error:\nThe type signature for ‘max’ lacks an accompanying binding\n\
    (The type signature must be given where ‘max’ is declared)\n|\n1 | max :: Integer\
    \ -> Integer -> Integer\n|   ^^^^^^^^\n[1 of 1] Compiling Main\n( max.hs, interpreted\
    \ )\nFailed, no modules loaded.\n```\n\n她认为这意味着她不仅要声明类型，还要定义该函数。她在文件中添加了一个定义：\n\
    \n```haskell\nmax :: Integer -> Integer -> Integer\nmax x y\n  | x >= y = x\n\
    \  | otherwise = y\n```\n\n（幸运的是她记得被告诉要用空格而不是制表符）但得到了：\n\n```\nPrelude> :reload\n\
    max.hs:7:1: error:\nparse error (possibly incorrect indentation or mismatched\
    \ brackets)\n[1 of 1] Compiling Main\n( max.hs, interpreted )\nFailed, no modules\
    \ loaded.\nPrelude>\n```\n\n她觉得这没什么帮助，尤其是当她的程序少于 7 行时，所以很难看出“7:1”是什么意思。尽管如此，她并没有慌张，最终她注意到自己只是在最后一行漏掉了一个\
    \ `=` 号。她把它补上，一切就正常了。\n\n对 Leslie 来说这并不是一次愉快的经历，但至少，通过检查自己在输入 4 行（而不是 40 行）后操作是正确的，她让她更容易解决问题。\n\
    \n你必须编写的某些命名代码可能是*函数*，或者是类的*方法*。一个*纯*函数——就像故事中的 max——本质上是数学函数的程序版本，你可能已经见过它被标示为一个框，带有一个或多个箭头进入，一个箭头出去，如图\
    \ 3.1 所示。\n\n无论框内部进行什么计算以从输入产生输出，它与世界的其余部分都是隔离的：函数 max 像一个墙壁不可渗透的*黑盒*。然而，取决于你使用的语言，你编写的函数或方法可能是*不纯的*：也就是说，它可能会访问输入以外的数据，或者它可能有其他*影响*，例如更改屏幕显示的内容。你可以将这种不纯性为图3.1\
    \ 中的框的墙壁并不完全实心。\n\n除了获取函数名称外，你还需要确保你的函数是正确的。正如我们所说的，在面向对象的编程中我们常说“函数”而不是“方法”。一个（纯的）函数：\n\
    \n| max |\n| x |\n| y |\n| max(x, y) |\n\n图 3.1。在 Python 示例中，如果我们写写一个接收整数且不返回任何内容的函数，我们可能会写：\n\
    \n```python\ndef fizz_buzz(n):\n    pass\n```\n\n`pass` 在这里的意思是“什么都不做”，它的存在是因为\
    \ Python 中不能有空的函数体。如果你恰好不知道 `pass`，你可能会写 `print(1)` 之类的；我们在这个阶段还没有担心函数做什么。如果你正在编写一个需要返回值的函数，你需要返回某些东西，可能是正确的类型，才能让它运行。在\
    \ Fizz Buzz Haskell 示例中，你可能会把给你的 `undefined` 函数替换为这个：\n\n**Haskell 示例**\n\n```haskell\n\
    say :: Integer -> String\nsay n = \"1\" -- TODO\n```\n\n诚承认，这比模板中的版本有一点进步，但至少，通过返回一个固定的字符串值，我们写了一个输入是正确的函数。“TODO”是一个注释*：包含它对计算机来说没有区别，但会提醒你还没有完成。我们将在第8章详细讨论注释。\n\
    \n另一个例子：如果你被要求写一个接收 double 并返回 int 的公共方法，你可以写：\n\n```java\npublic int calculate(double\
    \ d) {\n    return 0; // TODO\n}\n```\n\n再次，检查你的代码是否可以无错误编译。\n\n一旦你到了这一步，你就已经证明了你知道如何在语言中定义函数或方法，并且你理解了类型。这已经了，如果你是为了分数而写，做到这一点可能已经让你得了些分。\n\
    \n**提示**\n\n不像人类可能不会无意识地注意到我们阅读内容中的拼写错误，计算机会被微小的错误完全搞乱。养成检查你是否拼错了单词，或者在应该用小写字母的地方使用了大写或反之的习惯。\n\
    \n## 3.4.2 向完全正确的代码迈进\n\n接下来，去理解你必须实现的实际功能。再次，不要觉得你必须一次性全部做正确。\n\n"
