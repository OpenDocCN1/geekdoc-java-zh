    45


    These are interpreted languages: Python is usually considered a


    scripting language, although these days it is also used for many


    other purposes. Or perhaps your language is mostly used for web


    services, or in AI, or data science, or embedded programming, or


    statistics. Which websites have the most useful bodies of questions


    and answers about it? Bookmark them!


    **4.5**** Paradigms**


    We have left until last something which comparative discussions


    of programming languages sometimes take first. Traditionally,


    programming languages have been divided into groups according


    to the main way in which people writing in those languages tend


    to think – that is, according to* paradigm*. The four main paradigms


    usually identified are:


    • Imperative. The program orders the computer to do one thing,


    then another thing. Data is stored in the form of* mutable state*,


    i.e. variables which have values that can be changed. Example


    language: C.


    • Object-oriented. The program is organised in terms of objects.


    Each object wraps up (*encapsulates*) some data, and can respond


    to certain requests (*messages*), thereby fulfilling some responsi-


    bilities. Example language: Java.


    • Functional. The programmer thinks of functions not just as bits


    of code, but as concrete things in their own right – as data – which


    can be passed around the program. For example, a function


    can be passed as an argument to another function, just as an


    integer might be. (People sometimes say functions are “first-


    class citizens”.) Mutable state is avoided. Example language:


    Haskell.


    • Logic. Writing a program involves specifying facts, and rules


    about how facts follow from other facts, and then asking a


    question. Example language: Prolog.'
