    might be an unhandled exception, a segmentation fault, an out of


    memory error, a stack overflow, or something else. (We will call


    them all “crashes”in what follows.) The effect is the same: no result,


    and a possibly cryptic message about what went wrong. You can


    follow a similar procedure to the one described for compile-time'
