    10


    ## 2 What Are Good Programs?


    You will often hear people talk as though they think


    **Criterion 3**


    *Good programs are concise?*


    This one is sort of true – clearly written programs do tend to be concise, not
    least because they tend to avoid code duplication. That is, they deliver a lot
    of functionality in a small number of lines of code. However, this is not a good
    thing to aim for *in its own right* – rather, it should be a consequence of writing
    clear, correct code.


    It often happens that people over-value making their code concise, and end up
    making it less clear than it could have been.


    If you are in the main target group for this book, and are taking a programming
    course, you probably cannot avoid this definition:


    **Criterion 4**


    Good programs get high marks.


    This is the specific topic of Chapters 12 and 13. Of course, it is to be hoped
    that high marks are a side-effect of your programs being good in other respects*
    . . .*


    Many other criteria matter sometimes: good programs often need to be fast, portable,
    flexible, testable, memory-efficient, parallelisable, and so on. We will look
    at some of these briefly in Chapter 10, but for the most part, specifically addressing
    these criteria is beyond the scope of this book: rather, we will emphasise that
    keeping your program correct and clear is the key to achieving all of them. Our
    final chapters, Chapters 14 and 15, may help to lead you into those more advanced
    areas.


    ### 2.1 Ethics


    As a counterweight to the “get high marks” criterion let us finish this chapter
    on a serious note. Computers are everywhere these days, and this means that qualities
    of programs influence everything from whether our games are fun, via whether our
    privacy is preserved, to whether we live or die. Writing good programs really
    matters. Because of this, professional software developers – and others – are,
    increasingly, expected to abide by written codes of practice. These say more than
    just “write good programs”, although absorbing the content of this book is a big
    step in the right direction. Ethical programming includes being honest about the
    extent to which you can be confident that your program is good, and adhering to
    quality control processes that ensure that if a mistake has been made – everybody
    makes mistakes – it is found and rectified before it causes harm. It also includes
    being a decent human being: for example, the software industry has a sexism problem,
    and you should strive to be part of the solution.


    For more information, including codes of professional practice, search programming
    ethics


    ## 3 How to Get Started


    In this chapter we assume you are about to do the first exercise in a programming
    course, or, perhaps, are starting to teach yourself a new language. In any case,
    you are about to create a program. You may have been given step-by-step instructions,
    but read this chapter all the same: it will set those instructions in context,
    and point out things that are easy to miss.


    ### 3.1 What Is a Program Anyway?


    **Terminology: Program**


    A *program* is a set of instructions that you would like a computer to follow.


    Arguably, it’s better to think of the program as being *an instruction* which
    may have complex structure. We’re definitely not using the word “set” here in
    the same way you may have encountered it in mathematics: rather, we’re using it
    in an everyday English sense. Other examples of sets of instructions are cooking
    recipes, or the leaflets you get with Lego kits or self-assembly furniture. However,
    while those are typically simple lists of instructions, telling you to do one
    thing, then another, a program can have more interesting structure. The way the
    parts of a program combine to make a whole is one of the things that varies between
    languages, and that you have to learn in the setting of a particular language.


    ### 3.2 What Do You Need?


    A computer is a machine: it will follow your instructions blindly, with total,
    stupid obedience. Before it can do so, though, your instructions will be translated
    (by other programs, including a *compiler* or an *interpreter*), from the form
    in which you write them (the program), into a form which is capable of affecting
    the computer hardware (ultimately, binary code, zeroes and ones).


    That translation process – about which we will have more to say in Chapter 4 –
    naturally makes your life much more convenient; it is much easier to write in
    a modern programming language than in binary code. However, the very convenience
    of it may tempt you to forget how stupid the computer really is. If one of the
    translation steps involves rejecting most of your mistakes, it’s easy to end up
    thinking that if the program gets to the point of being run, that means that the
    computer “understood” it, will “see what you mean”, will do something sensible.
    That’s an illusion – one that can be helpful, but that you need to see as fiction.


    A computer (even with all its software running) is not an intelligence: not a
    friend, not a foe. It is just a machine. Learning to program involves understanding
    how to make that machine do what you want it to do.


    So, a program is a set of instructions, which will eventually be translated into
    a form that can be run on computer hardware. You will need:


    1. a way to express the instructions; even2. a way to get them on computer hardware.


    Let’s consider the second point first. Unless this has already been done for you,
    or you are using a purely online system, you will probably need to install some
    software for your language by downloading something from the web. Precisely what
    you have to do depends on the language you are learning and on the computer you
    are using.


    **Tip**


    Some languages (at the time of writing, Python is a notable example) have significantly
    different versions. A program that is correct in one version of the language might
    be incorrect in another. Check you are installing the version version your course
    uses.


    Next, you need a way to express your instructions. It’s just possible you’re using
    a graphical language such as Scratch, in which case you’ll do this by manipulating
    elements in an application. Usually, though, you will type your instructions:
    we’ll say you’re going to write a program. Where do you type, though? There are
    three main possibilities:


    1. at an interactive prompt;

    2. into a file created with a text editor;

    3. into a file held in an integrated development environment (IDE).


    **Terminology: Integrated development environment**


    An *integrated development environment* or IDE is an application that supports
    the whole process of developing a program. IDEs are covered in Chapter 5: in this
    chapter we will discuss the more elementary options.


    #### 3.2.1 Using an Interactive Prompt


    In some languages – including Python and Haskell, but not Java – you may start
    off exploring your language at some kind of interactive prompt, sometimes called
    a read-eval-print loop or REPL. After installing your language, you start its
    interactive tool, perhaps by typing a command at an operating system command line.
    The result is that you get a language-level interactive prompt.


    Do not confuse the two kinds of prompt: they understand different inputs. The
    operating system command line understands, for example, the instruction to start
    an application. The language-level interactive prompt expects something that makes
    sense in the programming language context. Here is an example of interacting with
    Python, and with Haskell, at their interactive prompts (“*. . .*” represents some
    output that isn’t interesting, and will depend on your machine):


    **Python example**


    Python 3.7.3 [...]


    >>> 3+4


    7


    >>>


    **Haskell example**


    GHCi, version 8.4.3: [...]


    Prelude> 3+4


    7


    Prelude>

