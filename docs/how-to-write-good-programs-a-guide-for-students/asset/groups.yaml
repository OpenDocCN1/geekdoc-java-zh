    **13**


    How to Score Well in a Programming Exam


    Like the chapter on scoring well in an assignment, this one focuses


    on how you can maximise your marks, given your current state of


    competence. It’s a good chapter to reread a day or two before the


    exam.


    A “programming exam” could mean a traditional pencil and


    paper exam where you have to write code on paper, or it could mean


    an exam where you will write a program, on a computer, under


    exam conditions. Personally I really dislike the former, because


    it feels* so* unnatural; but computerised programming exams are


    quite hard to organise, so you may still encounter paper-based


    programming exams. Stretching a point, it could even mean a


    multiple-choice exam that tests your knowledge of programming.


    While the basic task of learning to program is the same regard-


    less of how it will be examined, knowing what kind of assessment


    to expect can help you to organise your knowledge in an accessible


    way, to maximise your performance. Much of the preparation you


    will need to do is the same, regardless of the exam type, but this


    chapter will also have some specific pointers for each kind of exam.


    **13.1**** Preparing for the Exam**


    There are two main things you need to do well in advance of the


    exam: find out all about what to expect, and practise. Past papers,


    for similar assessments at your institution, are an important tool


    for both. If there is a plentiful supply of past papers, use one recent


    paper for understanding what to expect, reserving a different one


    for practising.


