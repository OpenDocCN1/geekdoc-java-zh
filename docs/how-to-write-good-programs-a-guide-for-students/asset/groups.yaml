    ## 4 How to Understand Your Language


    In Chapter 14 we’ll talk about how to choose an appropriate

    programming language for a given task. In this chapter, though,

    we’ll start with the assumption that you don’t have a choice –

    you have to learn a language chosen by someone else. What do

    you nevertheless need to understand about* the landscape of all

    *programming languages*, and how your language fits into it?


    You may object that that’s not what the title of this chapter is

    about: isn’t understanding your language just learning to under-

    stand, and write, programs in it? Well: no, not only that. It’s also

    useful to understand something about the decisions that were taken

    in designing it: how, and why, it differs from other languages. If

    someone else chose this language for you to learn, why did they

    choose this one? Why will learning this language, in particular, be

    valuable to you?


    That said, people learn in different ways, and some people may

    wish to skip this chapter for now. Feel free – but do come back to

    it later.


    If you’re still here, questions you might ask (ask your instructor,

    ask your favourite search engine) include:


    - What kind of task was this language developed for? When, and

    by whom?

    - Who uses it now, and for what?

    - What kind of community is there of people who use this lan-guage? Where do they
    hang out online?

    - Is your language compiled or interpreted?

    - What kind of type discipline does it impose?

    - What high-level structure do programs in your language have?

    - What conventions do people obey? You’d be surprised how

    important things like how words are capitalised can be, in terms

    of helping experts in the language quickly understand your

    program, and in terms of making you look like someone who

    knows the language! There are also conventions about many

    other things, from how long parts of the program tend to get

    before an expert would decide to split them up, to which libraries

    are used.


    Let’s discuss some of these questions. We’ll start from the

    more concrete questions, and come to the more sociological

    ones later.


    ### 4.1 Compilation or Interpretation


    A question which can seem silly to people who already know

    the answer – and to which, therefore, they may forget to tell you the

    answer – is: once I have written my program, how do I get it to run?


    1. You just run it.

    2. You compile it, then run it.


    This is a simplification, although it’s a useful one because the

    presence or absence of a compilation activity tends to make a big

    difference to how it feels to program in a language. Let us give the

    simplified explanation first, before addressing the ways in which it’s

    an over-simplification.


    “You just run it” applies to languages, for example Python,

    JavaScript (NB nothing to do with Java, despite the similar name!),

    PHP and Perl, which are*interpreted*. That means that there is some

    other program, called an interpreter, which reads your program

    and does what it says. If there is a problem somewhere in your pro-gram which
    means that part of the program cannot be interpreted,

    the interpreter will give some kind of error message, and stop, when

    it gets to that part. However, by then it may already have run the

    earlier parts of the program.


    “You compile it, then run it” applies to languages, for example

    Java, Haskell and all variants of C (C++, C#), Objective-C, etc.),

    which are*compiled*. That means that there is some other program,

    called a compiler, which reads your program and translates it into

    a more primitive form. Some kinds of error in your program

    can be detected in the process of compilation. If no such errors

    are discovered, then you end up with a compiled program, saved

    as a separate file, which you can then run, as above. Because

    some of the work has been done by the compiler, the compiled

    program usually runs faster than an interpreted program with the

    same functionality. What is often more important is that, because

    the compiler has checked for certain kinds of error, you get

    a guarantee: if your program compiles correctly, then you can be sure

    that that kind of error is absent. The main kind of error-checking

    the compiler does is called*type-checking*: we will have more to say

    about types in Section 4.2.


    **Story**


    In 1978, Robin Milner published a theorem about the core of

    the programming language he defined, which is called ML; this

    language has influenced Haskell and many later languages. The

    theorem can be summarised as “well-typed programs cannot

    go wrong”. That is, he proved that if your program

    accepted, there was no need to test it.


    ### 4.2 Types


    If you have ever been reminded to “show the units” in your answer

    to a problem in a mathematics or science class, you have met types.

    Arguably, if you’ve ever watched a baby using a shape-sorter, you

    have, too! The type* of a value in a program tells you something

    about what you can legitimately do with it. What do you need to

    know about a value in order to know that it makes sense to use it

    in a particular context?


    **Terminology: Type-checking**


    *Type-checking* is the process of checking that the shapes of the

    pieces of a program fit together properly: for example, that a

    function that has been designed to accept only integers is never

    given strings as its input. If this is done as part of compilation, it

    is called*static type-checking*; if it is done at run-time, it is called*dynamic
    type-checking*. Many languages use a mixture of static

    and dynamic type-checking.

    '
