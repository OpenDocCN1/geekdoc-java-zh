    \                    ^\nExerciseOne.java:4: error: reached end of file while parsing\n\
    }\n                               ^\n3 errors\n```\n\n幸运的是，当他只读第一条错误信息时，他发现它很清楚地告诉了他问题是什么：编译器在文件的第\
    \ 2 行期待一个左圆括号，甚至有一个脱号（^）指出了第 2 行的具体位置。他发现自己不小心打成了一个左大括号。\n\n他只修改了这一个字符，保存了文件，并再次尝试编译。所有三个错误信息都消失了，所以他可以继续写了。\n\
    \n类型错误（Type errors）是一种常见的编译时错误——语言的类型系统越强大（即它能排除的问题越多），这类错误就越常见。如果像 Haskell 那样，类型系统非常复杂，错误信息有时很难解释，因为它们可能提到了你尚未遇到过的类型系统特征。我们在第\
    \ 3 章的故事中见过这样的例子。记住，如果卡住了，可以在网上搜索该错误信息。不过，更多时候，错误信息会用你能理解的术语告诉你是问题所在。让我们来看几个例子。\n\
    \n假设你正在编写一个 Haskell 函数 `triangle`，它应该接收一个整数（假设为 n）并返回第 n 个三角形数，即前 n 个正整数的和。利用\
    \ Haskell 使用 `[1..]` 表示无界自然数列表 1, 2, 3, 4, ... 的能力，你可能会先写：\n\n**Haskell 示例（不要这样做！）**\n\
    \n```haskell\ntriangle :: Integer -> Integer\ntriangle n = sum (take n [1..])\n\
    ```\n\n但你会得到一个编译时错误\n\n```text\ntake.hs:2:24: error:\n- Couldn’t match expected\
    \ type ‘Int’ with actual type ‘Integer’\n- In the first argument of ‘take’, namely\
    \ ‘n’\nIn the first argument of ‘sum’, namely ‘(take n [1 ..])’\nIn the expression:\
    \ sum (take n [1 ..])\n|\n2 | triangle n = sum (take n [1..])\n|\n           \
    \    ^\n```\n\n这告诉你函数 `take` 期待一个 `Int` 类型的参数，而你给的是一个 `Integer` 类型的参数。可能的错误根源是你没有意识到\
    \ Haskell 有两种不同的整数类型，一种用于机器整数，另一种用于任意精度计算：但一旦你读了错误信息，这很容易查。\n\n在任何语言中，类型错误的另一个常见是参数顺序错误。假设你写了：\n\
    \n**Haskell 示例（不要这样做！）**\n\n```haskell\ntriangle :: Int -> Int\ntriangle n = sum\
    \ (take [1..] n)\n```\n\n是因为你误认为 `take` 要求整数参数在列表参数之后，而不是之前。你会得到一个错误“Couldn’t\
    \ match expected type ‘[Int]’ with actual type ‘Int’”，随后像之前一样，会给出关于问题发生位置详尽信息。一旦你读到\
    \ `take` 函数接收的是一个整数而它期待的是整数列表（在 Haskell 中记为 [Int]），交换参数只需转瞬之间。\n\n**Haskell 示例**\n\
    \n```haskell\ntriangle :: Int -> Int\ntriangle n = sum (take n [1..])\n```\n\n\
    ## 9.2 当你的程序运行但行为错误时\n\n如果你也花一点时间思考*为什么*参数是那个顺序，可能对你以后有帮助。在这种情况下，在语法上让列表放在最后是方便的，因为这使得在列表被许多函数反复处理的流水线上下文中，更易使用\
    \ `take`。即使你没有想出解释，思考过它可能帮助你记住参数顺序！\n\n**是编译器错了吗？**\n\n不。嗯，几乎肯定不是。在断断教学编程的二十五年里，我最近遇到一个案例，一个大一学生在理解编译器的错误信息时遇到困难，结果确实是一个（已知的）编译器\
    \ Bug。然而，我不知道有多少新学生怀疑过不存在的编译器 Bug。除非是你刚写的编译器——如果是这样，你也不是我所说的“新学生”了——否则假设它是正确的。\n\
    \n假设你的代码通过编译并运行——但它没有按照你的预期运行。也许它产生了错误的结果，导致某些接口出现困惑的行为，或者打印了你不预期的内容；它甚至可能崩溃或看起来运行无止。该怎么办？\n\
    \n首先是寻找程序没有做正确操作的最简单用例。最好是编写一个失败的自动化测试，在最简单的用例中测试你的程序：但如果你现在还没有写自动化测试，目前做个记录并手动运行测试也足够了。让这个测试通过是一个可以追求的明确目标。正如第\
    \ 7 章提到的，未来将它保留在以后定期运行的测试集里，可以确保你不会再次引入相同的 Bug，也就是说，它可以防止*回归*（regression）。\n\n"
