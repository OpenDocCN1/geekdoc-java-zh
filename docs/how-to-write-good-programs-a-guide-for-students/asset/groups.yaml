    ## 10 How to Improve Your Program


    that the structural chunks of the program often correspond to real-world objects.
    These are not necessarily physically real things, but they are *domain concepts*:
    things that have meaning to the customer, so that they are referred to by nouns,
    such as Account, Customer, Transaction. A set of changes in the real world, which
    causes changes in the program, is likely to centre around one domain concept.
    Because the code that corresponds to this concept is all in one chunk of the program,
    the chances are good that we only have to modify that one chunk. By contrast,
    if we structure the program according to the steps of what it has to do, it’s
    more likely that several steps, each using that same domain concept, all have
    to change.


    **Tip**


    Choosing good names for chunks of your program can drive the process of improving
    its structure. For example, if you find it difficult to name a function because
    it does two unrelated things, split the function into two, each with a good name.


    When you look at a program and see that all its names are perfectly apt, and yet
    quite short, it is tempting to think that the programmer was lucky. Fancy finding
    that the domain concepts were so easy to describe clearly and concisely, you may
    think! In fact, it may be that what you are seeing is the end point of a process
    of improvement. Perhaps the programmer chose maximally descriptive names, even
    if they were long, and then looked at the over-long names as a sign that the structure
    of the program was not yet ideal. Refactoring – e.g. splitting non-cohesive units,
    or pulling out common superclasses or repeated subroutines – then enabled the
    improvement of the names. For a fuller discussion on using good naming to drive
    the process of design improvement, see J. B. Rainsberger’s blog (Rainsberger,
    2013).


    ## 10.2 Efficiency


    A large and challenging part of computer science relates to minimising the computational
    resources required to carry out some calculation.


    **Terminology: Moore’s Law**


    *Moore’s Law* is the empirical observation, first made by Gordon Moore in 1965,
    that the number of transistors on a chip seemed to double every year.


    Moore’s Law has had many variants: the details do not matter so much as the essence,
    which is exponential growth in computing power (since, roughly, the number of
    transistors controls how much computation the chip can do in a given time). Although
    stories about the end of Moore’s Law are becoming increasingly common, the landscape
    of software engineering, so far, has been shaped by this reality: that computers
    get better much faster than our ability to program them does. One effect is that
    computer scientists think in terms of “big O”. It is usually not worth a programmer
    spending a lot of effort working out how to make a program run twice as fast,
    or in half as much memory: if that is all that is needed, buying a better computer
    is cheaper than paying the programmer.


    **Story**


    Early in my time as a professional software developer, I had to learn Perl, and
    I did so with the help of the “pink camel book”, which was the first edition of
    *Programming Perl*. (It was called because it was pink, and had a camel on the
    front; sadly, the camel itself was not pink.) In the back of this book was a section
    about how to write efficient programs in Perl, which made a deep impression on
    me because it helped me make sense of some arguments between more experienced
    colleagues.


    Its point was that there are many different kinds of efficiency we might aim for.
    The two that people usually think about are *time efficiency*, which is about
    making your program run as fast as possible, and *space efficiency*, which is
    about how to make it run using as small an amount of memory as possible. However,
    in practice, the things you do to increase those two kinds of efficiency can be
    in conflict: for example, you might make your program faster by caching some intermediate
    results, which makes it use more memory. So far so pedestrian. The mind-blowing
    part was that it also identified – as the best kind of joke, the kind with a serious
    point – several other kinds of efficiency, such as “programmer efficiency”, which
    is about not wasting your time and effort, and “user efficiency”, which is about
    not wasting the time and effort of the people who will use your program. It pointed
    out that the phenomenon of reducing one kind of efficiency as you strive for another
    exists there, too. For example, if you care most about making life easy for users
    of your program, you may provide a carefully thought-out interface to it, whereas
    if you care most about making your own life easy, you may just do whatever is
    quickest for you. Neither of these is always right: it depends on the circumstances.


    What the section did not discuss, but perhaps should have done, was *Pareto efficiency*.
    If you have a choice of two approaches in mind, and one of the approaches is more
    efficient in one of the ways you care about without being less efficient in *any
    of them*, it’s a no-brainer to pick that approach. The special thing about *maintain
    efficiency* is that it is a prerequisite to improving your program in any other
    way.


    **Tip**


    As a beginner you will seldom have to worry about efficiency. It’s almost always
    better to focus on clear first. Only worry about efficiency when you know you
    have problem with it – your code does not run fast enough, or it uses too much
    space. Then ask yourself:


    - Are you using the most appropriate components from standard library?

    - Is your program doing unnecessary work?

    - (For time efficiency) Is it repeating work which should save the first time?

    - (For space efficiency) Is it saving work when needed again?


    There may be particular things that, even as a beginner, you need to be aware
    of your language: for example, if you are programming in Haskell, you will need
    to pay attention to whether you use foldl or foldr, and in Java, you may soon
    learn to build large strings using StringBuilder instead of just String.


    To go further you need some understanding of *complexity*. That’s beyond the scope
    of this book. Here let us just say: some tasks, like sorting, have been the subject
    of exhaustive study and it is well known how to write code to do them. Rather
    than writing your own code to carry out such a task, you should use code from
    an appropriate library, which is likely to be more efficient than what you will
    write (and will be correct, as well). Unless you are doing an exercise where the
    point is to implement a sorting algorithm, don’t implement your own sorting algorithm.
    Similarly, if your code uses data structures like dictionaries or hash tables,
    don’t write your own. It’s well worth spending some time becoming familiar with
    what is in the standard libraries, so that you understand which components to
    use when.


    **Coding interviews**


    Curiously, a tradition has emerged that major tech companies’ recruitment procedures
    involve asking candidates to solve small computer programming problems in highly
    constrained situations, such as writing the code on a white board. The problems
    have to be able to be stated and solved succinctly, without a lot of explanation
    of customer requirements, so they tend to focus on data structures and algorithms.
    What distinguishes a good solution from a mediocre one tends to be the time and
    space needed. Thus, even though, if you get the job, it may turn out to be rare
    for you to worry about such things, they may be important for getting the job.
    Pay close attention when you take an algorithms class, and if you are preparing
    for such an interview, consider a specialist book such as Gayle McDowell’s *Cracking
    the Coding Interview*. Always write clear code, so that you can maximise the impact
    of your efficient code.

