    ## 11.2 解决更具体的问题


    向理解迈出了 165 步——这就是为什么你应该经常检查自己是否无意中让问题消失了。通常发生是，在创建 MNWE（最小不可复现示例）的过程中某处，你理解了发生了什么。有时，这种理解会如霹雳般降临。其他时候，更多的是一旦你的示例变得非常简单，你就能发现问题*一定*出在某个特定的语言或库特性上。然后，你仔细阅读该特性的文档，学习如何修复自己的问题。


    然而，如果这种情况没有发生，你继续简化程序，直到任何进一步的简化导致问题消失，那么你仍然比以前进步得得多，因为现在你拥有了一个小程序，你无法用简单的方式理解它的行为，但你可以把它交给可能能够帮助你的人。由于现在离课程作业的实际答案还很远，你可能很乐意和同学分享，他们可能比你更理解它（不过，请检查当地政策！）。或者，如果你把它交给老师，他们很可能快速、轻松地为你提供帮助，因为你的示例不再充满了与你的问题无关的内容。


    ### 11.2.4 寻求帮助


    更通地说，你应该何时寻求帮助，向谁寻求？如果你卡在某项将被评估的特定练习上，你可能首先需要检查允许什么样的帮助或与人的讨论。很可能，如果练习是形成性的（通常：不计分），将允许与同伴进行某种程度的讨论，但如果它是总结性的（计分），你通常被要求完全独立完成。


    如果你被允许与同学讨论，这非常有建设性。然而，它也可能让你认为自己理解的比实际的要多，所以要小心。在实践中，当别人告诉你如何解决问题时你能理解，与你自己想出解决方案之间存在巨大的鸿沟。所以，不要过度依赖他人的帮助，也要寻找提供帮助和接受帮助的机会。


    许多课程提供某种课程论坛，鼓励学生在其中寻求帮助。与直接与人类交流相比，这有优缺点。优点是，你的问题可能比你面对面交流更快地接触更多的人——因此其中某人能够并愿意帮助的机会更高。不那么而易见的是，将你的问题转化为清晰、简洁的文本问题的过程通常有助于你理清思路。在思考如何提问的过程中，发现自己自己回答了问题，这完全并不罕见。（这与我们在第
    9 章讨论的纸板调试过程是类似的现象。）缺点是，你必须花时间写作——你越困惑，写作就越困难——而且你可能需要等待回复。


    **提示**：即使只是写给同一门课程的人看，也要仔细书写并提供相关的细节。例如，不要只说“它不起用”或“它报错了”——要说明具体是如何不起工作的，或者看到的错误具体是什么。


    你应该转向更广泛的互联网吗？有像 StackOverflow¹ 这样的网站供程序员提编程问题。作为一名新手，我敦促你谨慎。你的问题很可能通过阅读标准文档解决，或者之前已经被问过，而
    StackOverflow 的居民对这类问题可能不耐烦。


    ¹ https://stackoverflow.com


    然而，“谨慎”并不意味着永远不要这样做：它只是意味着提一个尽可能清晰精确的问题。例如，不要问“为什么这个不起用？”要说“我期望这段代码在输入 1 时返回 4，但实际上返回了
    3 —— 为什么？”说明你咨询了哪些标准资源，以及为什么密切相关的问题没有回答你的问题。要包含你所讨论的代码特性的示例——也许是一个你不完全理解其行为的代码示例，或者一个你认为应该运行但没有运行的代码示例——但要确保这段代码是一个真正的
    MNWE（见上文），以便专家能尽可能快地理解你卡住的关键点是什么。


    关于什么构成一个好问题的更多讨论，我建议你阅读最著名的“智能问题”指南《如何明智地提问》（Raymond, 2014）。最后，有一个似乎被忽略的微要要点：


    **提示**：每当你向某人发送代码、发布在论坛上等时，请复制实际程序文本，而不是包含它的图片！大多数人在帮助你时，都想在他们自己的工具中尝试你的代码或他们修改后的版本：你需要允许他们复制和粘贴，而不是重新输入。


    ### 11.2.5 帮助开始


    如果不是你写的程序有问题，而是你根本不知道该如何开始，以至于当你考虑向别人求助时，你甚至无法想出该问什么问题？这通常是困扰初学者的问题，经验丰富的程序员往往很难帮助，因为他们早已忘记了有那种感觉。对此种积极的思考方式是，总有一天，这种感觉对你来说也将是一个遥远的记忆。


    在此期间，你可以做什么？也许你想重读第 3 章，特别是第 3.5 节。但也许你觉得处理小问题没问题，但现在面临一项更具挑战性的任务，你不知道如何开始？一件事是完善任何简单的部分：将你不会做的部分减少到尽可能小。


    **提示**：“当你面对你不理解的东西时，值得看看你是否能找到更简单的版本。”

    '
