    - Oram, Andy and Greg Wilson, 编辑. *美妙的代码：顶级程序员解释他们的思维方式》(Beautiful Code: Leading
    Programmers Explain How They Think). O’Reilly Media, 2007.

    - Pierce, Benjamin C. *类型与编程语言》(Types and Programming Languages). MIT Press, 2002.

    - Rainsberger, J. B. 结束一场古老的战斗, 2013年12月. https://blog.thecodewhisperer.com/permalink/putting-an-age-old-battle-to-rest.

