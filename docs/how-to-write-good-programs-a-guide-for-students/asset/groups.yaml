    ## 15.2 特定编程语言


    你可能在读本书的同时，一直在使用一本关于你所选编程语言的入门书籍。大多数书籍从最基础开始介绍所选语言，并包含一些关于在该特定语言中编写良好程序的内容。每种热门语言的这类书籍非常多，我不会尝试推荐特定的书籍。事实上，因为书籍之多，你通常会发现可以根据自己的喜好来选择书籍风格。有些人喜欢短小、精炼、每个点只解释一次的书；另一些人则喜欢论述性的、反复回到重要话题并包含大量练习的书。浏览、阅读评论、寻求建议，并挑选你最喜欢的。


    专注于如何成为某门语言优秀程序员的书籍相对较少。其中一本就是 Joshua Bloch 的 **Effective Java*》。一旦你理解了 Java 的基础，这本书将会非常有帮助。


    ## 15.3 通用编程


    有大量针对专业程序员的书籍，这些现在对你可能很有用。以下是我几本最喜欢的书。


    - Robert C. Martin（被称为“鲍鲍叔”）编写的 **洁代码：敏捷软件工艺手册》（*Clean Code: A Handbook of Agile
    Software Craftsmanship*）。他作为活跃的顾问，在网上也有很多资料；你可以搜一下。

    - Andrew Hunt 和 David Thomas 的书籍 **实用主义程序员》（*The Pragmatic Programmer*）也包含了很多优秀内容。其副标题“从行者到大师”很好地说明了它的目标受众——你应该是一个相当称职的程序员才能从中获益良——尽管需要注意的是，不仅仅是男性可以精通编程！我相信这本书的第一版向编程领域引入了第
    10 章提到的“kata”术语。

    - 另一本针对经验丰富的程序员的流行书籍是 Steve McConnell 的 **代码完备》（*Code Complete*）。


    完全不同的是由 Andy Oram 和 Greg Wilson 编辑的章节集 **优美代码：顶级程序员解释他们如何思考*》（*Beautiful Code:
    Leading Programmers Explain How They Think*）。这些章节对这一简要任务采用了多种不同的方法；你一定会发现其中一些非常具有启发性。


    稍微偏向算法（尽管现在已过时）的是 Jon Bentley 的经典著作 **编程秘籍》（*Programming Pearls*）和 **更多编程秘籍》（*More
    Programming Pearls*）。你可能喜欢 Gayle McDowell 的 **破解面试算法》（*Cracking the Coding Interview*），因为它包含许多具有挑战性的小型编程问题，即使你并没有在准备面试。


    ## 15.4 软件工程


    “软件工程”是我们用来指代所有有助于确保我们拥有符合需求的软件的进程和技能的术语。这个术语可能由 Margaret Hamilton，她在 20 世纪 60
    年代初领导了一个为阿波罗 11 号太空任务开发软件的团队。它通过在 1968 年和 1969 年北约软件工程会议的标题中使用而广为人知。其意图是唤起一种基于数学、以系统且可靠的方式构建软件的理念。构建软件的人将是工程师，这暗示了他们接受过某种严谨的教育，可能获得了某种职业证书。这始终是愿景多于现实——软件的这种“软性”意味着人们一直都在没有此类教育的情况下构建了软件。尽管如此，我们无疑希望拥有良好的工程，而朝这一目标的重要一步是理解如何编写良好的程序，正如本书以及上一节中提到的书籍中所讨论的那样。


    超越编程，软件工程还涉及许多其他活动。有整个领域研究如何管理系统的需求，包括调和不同人需求之间的冲突；你如何确保已经进行了足够的测试以确信你的系统是正确的；特别是，你如何设计系统，以便在周围世界变化时能够保持其可用性。变化是软件工程困难的根源。我们在第
    10 章中提到过，你应该尝试将程序中会同时变化的项放在较近的地方。这个思想在设计模式领域已升为一种艺术形式；经典书籍就是所谓的“四人帮”书籍（Gamma et
    al., 1994）。


    为了清晰地思考设计，我们需要一种方法来表示我们需要关注的信息，同时忽略掉系统中所有其他与当前无关的其他信息。例如，在思考面向对象系统的设计结构时，我们可能会使用一张图表，显示系统中的类以及它们之间的关系，但省略类中方法具体作用的所有细节。这同样适用于软件开发的许多其他重要方面：为了思考某一个方面，我们需要一种显示我们所需信息的表示，同时排除掉我们不需要的内容。这种表示方法被称为“模型”。


    ### 术语：模型


    模型是系统某个层面的抽象的、通常是图状的表示。


    对模型的使用日益增加，我认为在未来的几十年里它将变得更加重要。我的第一本书 **使用 UML》（*Using UML*）是关于统一建模语言的，这种语言现在作为一种描述系统设计的图表方式已无处不在。然而，那种语言非常复杂且可能令人沮丧。建模的未来似乎涉及更多更简单的建模语言，它们可能是图表的也可能是文本的，以及处理它们的工具。近年来，关于模型驱动工程的书籍大量出现。我最喜欢的之一是
    Marco Bramilla 等人的 **实践中的模型驱动软件工程》（*Model-Driven Software Engineering in Practice*）。


    ## 15.5 编程语言理论


    我们目前讨论过的这类书籍都没有很好做的是比较语言，并讨论它们的设计及其属性。这是一个迷人的话题，理解它的某些知识可以帮助你成为更好的程序员。此外，你可能会发现自己某天正在设计一种语言——领域特定语言变得越来越常见，因此会有比以前更多的程序员发现自己参与了语言设计（至少是简单语言的设计）。


    一个很好的起点是 Shriram Krishnamurthi 的书籍 **编程语言：应用与解释》（*Programming Languages: Application
    and Interpretation*）。通过仔细地引导你为某种语言编写解释器，它帮助你理解语言设计中的许多选择点。

