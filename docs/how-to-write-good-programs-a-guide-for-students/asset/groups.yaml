    **4.4**** History, Community and Motivation**


    How old is your language? Who designed it? What is it used for? If


    you are doing a beginners’ programming course, one question is:


    are you using a language that is used mostly for teaching, or one


    that is also widely used by professional developers? The languages


    we discuss most in this book are used in both settings, but you


    may have come across educational languages such as Scratch, or


    some language for turtle graphics based on Logo; you may now be


    learning Alice. Similar questions apply to the tooling you are using:


    for example, you might be using the education-focused IDE BlueJ,


    for Java. The lines between categories do get blurred, and successful


    languages outgrow their niches: for example BASIC, the name of


    a language designed in the early 1960s, stands for Beginner’s All-


    purpose Symbolic Instruction Code, but its Visual Basic dialect


    went on to be very widely used by experts as well as beginners.


    Most likely, your language is used by some professional devel-


    opers. To do what? Reading its Wikipedia page, or searching


    who uses* your\_language*


    will find you some information (and possibly some examples of the


    *language wars*). In the process, you may find out something about


    the* community* surrounding your language. Perhaps your language


    is a* scripting language*, often used for automating sequences of


    tasks that would otherwise have to be done manually by humans.


