    **Terminology: Framework**


    Like a library, a framework provides functionality designed to


    be used in many other programs. The difference is that using


    a framework exerts more control over the structure of your


    program than using a library does. Rather than calling library


    functions when you choose, you write functions (e.g. tests, in


    the case of JUnit) that the framework code will call. This is the


    Hollywood Principle: “don’t call us, we’ll call you”.


