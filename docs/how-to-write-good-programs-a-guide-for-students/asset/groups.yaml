    8 如何让你的程序清晰


    - 更具体地说，是指一段代码保证遵守的契约。


    **术语：契约（Contract）**


    一段代码的*契约*是对该代码预期行为的某种精确表达。


    一个函数或方法可能被赋予一个*前置条件*（pre-condition）和/或一个*后置条件*（post-condition）。前置条件说明了代码在执行之前允许假设为真的内容；因此，这必须由代码的任何调用者来确保。后置条件说明了代码在执行后将确保真实的内（前提是已满足前置条件）。程序中包含某些数据的部分——例如类或循环——可能会被赋予一个*不变性*（invariant），它说明某些内容“始终”必须为真（严格来说：在某些重要的点，例如循环的开始时，或者当调用该类对象的方法时）。


    例如，如果你正在编写一个接受整数参数 `i` 的函数，但你决定（可能因为这是你正在做的某项练习的规范）该函数仅处理正整数，你可能会写下


    前置条件：i > 0


    作为一条注释来提醒读者注意这一假设。


    - 设计笔记。例如，如果你尝试用显而易见的方法编码发现速度太慢，然后发现了一种不那么明显但更好的方法，你可以包含一条注释来解释这一点。


    - 给自己的备注。例如，如果你对未来可能如何改进程序有一个想法，但你现在不想进行改进，你可能会写一条注释来提醒自己。


    ## 8.3 命名


    **提示**


    命名至关重要。良好的命名将帮助你以及其他人阅读代码，从而减少你需要编写的注释数量。


    让我们从最容易做好的部分开始：当你决定如何大写名称以及如何处理由多个单词组成的名称时，请使用你语言中的标准约定。拥有一套始终遵循的固定约定可以让你——以及任何需要编辑你程序的人——写错名称的概率降低得多，例如在应该写
    `doSomething` 的地方写成 `do_something`。它使得根据发音来记住名称成为可能；如果按照约定这总是以相同的方式完成，你就不需要记住单词是如何组合的。因此，请注意这些约定。例如，Java
    的约定包括以下内容。


    - 类以大写字母开头，例如 `Customer`。

    - 属性名使用小写，例如 `name`。

    - 方法名使用所谓的*驼峰命名法*（camel case）²，例如 `doSomething`。

    - 类和属性用名词或名词短语命名。类名几乎³总是单数（`Customer` 而不是 `Customers`）：该名称描述的是类的一个对象，而不是类的所有对象的集合。


    ² 想想那些驼峰！在 Python 中，相应地，我们使用*蛇形命名法*（snake case）编写方法名，例如 `do_something`。


    ³ 例外当单个对象最适合用复数名词描述时。例如，`Preferences` 类的单个对象可能描述一个用户的所有偏好。


    - 方法用动词或动词短语命名，例如 `doSomething`、`getName`、`setName`。


    在列表的末尾，我们开始涉及到一些不那么显易的问题：如何选择一个名称以便向读者优化地传递信息？可以问自己的一个合理问题是：是否有一个名称可以告诉读者更多他们需要知道的信息？不要重复类型信息：例如，避免将字符串变量命名为
    `theString`。如果你在一个类型在程序文中是显式的语言中工作，这样的名称完全是多余的；即使你不是，可能也可以做得更好。考虑你正在命名的事物代表了什么。如果你向某人解释代码，你会对这个东西说什么？你所说的话能变成它的名称吗？


    使用完整的单词作为名称比使用缩写更好，除非你确定缩写是如此标准，以至于阅读程序的人都会知道它的意思并期望它被使用。如果你的程序中有许多相关的名称，这一点尤为重要。


    例如，假设“customer”出现在你程序中许多事物的名称中，有时（但并非总是）缩写为 `cust`。那么不可避免地，处理代码的程序员有时会错误地判断这次是否应该缩写。如果在一个有时涉及“cost”的语境下将“customer”缩写为
    `cst`，情况会变得更糟糕了！


    为了抵制缩写的诱惑，请学习避免频繁输入长名称的好方法。IDE 或具有自动补全功能的编辑器（见第 5 章）可以在此处提供帮助。例如，在 Eclipse 中，`Ctrl-Space`
    会（通常！）尝试补全你开始输入的内容。在 Emacs 中，`Meta-/` 会做同样的事，只是智能性稍差。


    在避免混淆的缩写的同时，你还需要防止你的代码行变得长到无法管理，像这样：


    **Java 示例（不要这样做！）**

    `verySpecialCustomer.lookupHomeOrHomeBusinessAddress(preferredCustomerId,monthOfTheYear);`


    你如何协调这些冲突的力量？你可以通过拆分行来解决行过长的物理问题：请看本章末尾的面板获取更多信息。然而，这解决不了真正的问题：这一行太长的原因是名称太复杂。关键在于选择完全正确的名称，并以这种方式组织程序，使得*每个*事物都有一个感觉合适且不会太长的名称。这种思考将我们带离局部考虑，转向整体的软件设计；我们将在第
    10 章中对此进行更多说明。


    名称距离其定义越远，它的信息量就就越重要。假设你写了一个函数，由于编程语言的规定，它只能从特定区域内部调用，那么使用单个字母是可以的。另一方面，如果你的函数可以在程序的任何地方使用，那么它最好有一个有意义的名称。我在本章开头的示例中就是这样做，我选择使用
    `a` 作为我的 `setRating` 方法的名称。我本可以使用 `newRating` 这样有意义的名称，一些人会认为那样更好；这是有争议的。有一点是不具争议的，即在“坏”示例中使用
    `l` 作为参数名是糟糕的，因为它太容易与数字 `1` 混淆；同样，避免 `O` 和 `o`。

    采纳你语言中存在的任何关于在语境中使用哪些单个字母的标准约定。通常，`i`、`j`、`k`、`n` 是整数，特别是循环变量和/或数组索引。`s` 通常是字符串。如果你在使用列表的头部和尾部进行编程，尾部的名称通常是头部的复数形式，例如
    `(x:xs)`。


    **提示**


    在编写程序的过程中，发现比你最初选择的更好的名称，这是正常的。欢迎这种情况：这标志着你对问题以及解决该问题的程序的理解正在提高。学习更改变量名称的好方法，以备你发现名称不太好时使用。再次，IDE
    可以让你的生活变得得多。在 Eclipse 中，重构（Refactor）菜单包含一个运行非常智能的命名（Rename）选项。在编辑器中，查找和替换功能通常足够方便，特别是当你尝试更改的名称不是太短时。


    ## 8.4 布局与空白


    为程序使用标准、一致的布局。这是使用 IDE（见第 5 章）真正有帮助的地方之一。在 Eclipse 中，使用 Source 菜单上的 Format 选项来实现这一点。如果你想或需要，你可以在设置中更改该修复代码格式的许多方面。


    然而，自动固定布局的优势在于，它可以减轻你决定如何排格式的负担：它可以为你提供一个足够一致以满足最挑剔的同事的布局，即使你本人倾向于更灵活。这里有一个经典的例子。在那些大括号包裹代码块的语言中，关于它们的位置有一个问题。有些程序员会写


