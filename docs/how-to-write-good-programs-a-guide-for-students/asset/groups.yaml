    **Tip**


    If you find yourself reluctant to delete a chunk of code that is


    not useful to you right now because you think you* are* going


    to need it – for example, it solves a problem you expect to


    have again, and you had to look up something tricky to get it


    right – then by all means do save it. Just don’t save it inside a


    program where it is useless. I sometimes make a subfolder called


    CuttingRoomFloor for possibly useful snippets.


    **6.6**** Backups and the Cloud**


    Making copies of your files, or using a version control system, can


    be an effective way to guard against losing your program because of


    your own accidental deletions. But what if the copies of the files,


    or the central repository of your version control system, are all


    stored on the same computer that you are working on, and then this


    computer dies, or is lost or stolen? In order to recover your work,


    you need it to be* backed up* in some way: that is, there needs to be


    a copy of the important files on some other computer, or on some


    external medium. If you are using a computer that is provided by


    your university or college, it is likely – but not certain! – that your


    files are automatically being backed up for you, and that there are


    computing support staff who can restore them for you if disaster


    strikes. If you are using your own equipment, you need to make


    your own arrangements to reduce the risk that you lose important


    work. As with version control, there is a range of approaches, from


    the fully manual – e.g. you get into the habit of copying your files


    onto a USB stick that you keep on a keyring, every time you finish


    a work session – to the fully automated. You could search


    automatic backup* your\_operating\_system*'
