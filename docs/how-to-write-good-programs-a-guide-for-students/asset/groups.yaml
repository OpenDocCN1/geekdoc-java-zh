    教程就能找到一个。


    ## 6.5 管理未使用的代码


    经常会发生这种情况：你写了一段代码，然后发现你不想在程序中保留它，例如因为你想到了解决该问题的更好方法。特别是当你是一个初学者时，也可能出现代码运行并没有按照你预期的那样运行，而你不完全理解原因，于是决定用另一种方式实现该功能。


    对于不再实用的代码该怎么办？你可以直接删除它，也可以将其注释掉。


    **术语：注释掉 (Commenting out)**


    *注释掉*代码是从编译器和解释器中隐藏，同时将其保留在程序中供人类读者阅读。


    语言通常有一个字符或字符序列，告诉编译器或解释器“忽略此行的剩余部分”（当然，语法的主要目的是允许你编写自然语言注释，我们将在第 8 章讨论。）


    在 Java、C 和许多其他语言中，字符语法是 //；在 Python、Perl 以及其他各种语言中是 #；在 Haskell 中是 -- 等。你只需要在你想要注释掉的每一行开头输入注释字符即可，但如果你想注释掉超过两行的代码，很快就会变得繁琐。有两种替代方案。


    1. 在 IDE 中，你通常可以选择一段代码，然后使用对该选择生效的菜单项或键组合，在块中每行的开头插入注释字符。选择已注释的代码块通过删除注释字符来*取消注释*（uncomment），原理类似。IDE
    通常会使用不同的字体或颜色来显示注释掉的行，以便它们与活跃的代码行容易区分来。只要你的工具提供这种功能，这种方法就很简单。它的优点是不会对某行代码是否被注释掉产生疑问，并且避免了嵌套注释和类似问题的困难。


    2. 你的语言可能还有第二种注释语法，专门用于多行注释。这意味着有一些特殊的字符组合标记注释的开始，另一个不同的特殊组合标记注释的结束。注释开始序列之后的一切都会被忽略，直到找到注释结束序列。在
    Java、C 等语言中，开始和结束是 /* */；在 Haskell 中是 --。Python 没有真正的单行注释语法。这种方法的优点是它为注释掉大块代码提供了一种简单的方法。然而，如果你使用的
    IDE 能清晰地（例如通过改变颜色）显示某些代码已被注释掉，那么它在视觉上可能并不明显。


    一旦你学会了如何注释掉，你应该这样做，还是删除它？注释掉的优点是，如果你在几分钟后发现需要它，你随时可以找回来。我通常倾向于这两种注释的方式。


    如何决定？我建议问问自己*你有多大确定*自己不再需要它。如果你很确定，尽管删除它。如果你觉得很有可能需要，先把它注释掉，但记得再想一想：不要让注释掉的代码在那儿碍事好几周。这就是版本控制用用的地方——如果你有这些代码（可能被注释掉了），你可以把它们找回来。


    **术语：死代码或不可达代码 (Dead or unreachable code)**


    如果程序代码的一个部分永远无法被执行，那么它就是*不可达的*。例如，如果你在程序中写了一个函数，但你的程序从未调用它（也没有让客户端程序调用），那么该函数就是不可达的。


    你可能会听到*死代码*（dead code）作为不可达代码的同义词。有些来源用它来指代*被执行*但对程序的预设行为没有贡献的代码。例如，如果你的程序调用了一个函数，但从不使用该函数的结果，那么该函数可能被认为是死代码，但不是不可达。


    边写边清理。例如，如果你写了一个函数然后没有从任何地方调用它，就删掉那些代码，至少通过注释掉，除非你*确定*它很快就会被使用。你可能想认为把代码留在那儿没有害；毕竟，如果它没被调用，它中的任何
    bug 都没有被触发，所以这重要吗？然而，未使用的代码会阻碍你的工作并可能引起困惑。例如，当你寻找 bug 时，你可能会浪费时间看那段代码，尽管它不可能是
    bug 的原因。即使你使用的 IDE 能清晰地（例如通过改变颜色）显示某些代码是不可达的，它仍然会通过占用可以更好使用的屏幕空间来碍事。删掉它。正如敏捷编程的人们所说，YAGNI.¹


    ¹ You Ain’t Gonna Need It（你不会需要的）。

    '
