- md: "\n## 1 Introduction\n\n### 1.1 Who Is This Book For?\n\nThis book will not\
    \ teach you any particular programming language – for that you will need a different\
    \ book, a course, or an online tutorial, and there are plenty to choose from.\
    \ This book will help you in the process of learning any programming language,\
    \ and especially, it will help you to learn to write it *well*, and with deep\
    \ understanding that you can also transfer to your next language. It covers things\
    \ that programming courses tend to assume students will pick up by osmosis, but\
    \ that are often, in practice, stumbling blocks. Unlike books aimed at professionals,\
    \ which assume you can always express what you want to express in the language,\
    \ this book will help you develop ways of getting unstuck, unconfused and debugged.\n\
    \nYou’ll learn to write code that you can understand and modify not only when\
    \ you are at your cleverest, but also when you’re not. This will lower your stress\
    \ levels. It’ll let you be lazy, in the best possible way.\n\nThere’s a certain\
    \ satisfaction in doing a thing well, though: that’s how the virtuous circle works.\n\
    \nRobert Martin, in his wonderful book for professional software developers, *Clean\
    \ Code*, talks about programmers needing to have “code sense”. Code sense is what\
    \ lets a seasoned professional tell good code from bad, and, much harder, systematically\
    \ develop good code. If you are starting out with programming, this is what you\
    \ need to develop. You won’t develop it in a day, a week, or a year, but, by paying\
    \ attention in the way this book aims to encourage, you will gradually increase\
    \ your code sense.\n\n**1.1 Who Is This Book For?**\n\nIf you are learning to\
    \ program, this book is for you.\n\nIf you are helping other people to learn to\
    \ program, this book is for you.\n\nIf you are a professional programmer, this\
    \ book is not intended for you – but you are welcome to read it anyway. Perhaps\
    \ you would like to recommend it to someone. I’d welcome your comments.\n\n###\
    \ 1.2 About the Boxes\n\nWe use various kinds of boxes. There are tips, like this\
    \ one:\n\n**Tip**\nA note on spelling. If you spell in British English, you may\
    \ expect the spelling “programme” rather than “program”. However, by convention,\
    \ when we write about computer programs, we use the American spelling. Very, very\
    \ occasionally this is useful disambiguation; computer science events may involve\
    \ both programs and a programme.\n\nExplanations of terms, like this:\n\n**Terminology:\
    \ Coding, programming, software engineering**\nThey overlap, and are in increasing\
    \ order of sophistication. A software engineer can program, and a programmer can\
    \ code, but not necessarily the other round. A coder might only translate precise\
    \ English instructions into a programming language. A programmer takes responsibility\
    \ for deciding what to write and when it is good. A software engineer typically\
    \ works as part of a team, and solves real-world problems with high-quality software.\
    \ After absorbing the content of this book, you will be well equipped to progress\
    \ to software engineering: more on that in Chapter 15.\n\n**Story**\nThere are\
    \ stories like this: Some people are hooked by programming from the very first\
    \ time they meet the idea. I wasn’t one of those. I thought it was cute that you\
    \ could do things like writing programs to output a list of prime numbers, but\
    \ I was never interested in writing video games, which, when I was young, looked\
    \ like the only thing you could do with a computer. The first program I really\
    \ cared about was one I wrote when I was doing my PhD in mathematics. I had a\
    \ conjecture that was true for all integers ($n > 2$), but the collection of mathematical\
    \ structures to check it got too tedious to do by hand. So I wrote a program to\
    \ check my conjecture, and was quite easily able to find out that my conjecture\
    \ was true, at least, for all $n$ up to 10,000. Of course that wasn’t a proof,\
    \ but it gave me confidence to look for a proof, and eventually, I found one.\
    \ And of course there are examples of programs. Here’s one in Python:\n\n**Python\
    \ example**\n```python\nprint(\"Hello, World!\")\n```\n\nNote that programs are\
    \ not always complete. For example, code has to be inside a method inside a class,\
    \ but I usually omit lines that show that, rather than something like:\n\n**Java\
    \ example**\n```java\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nDo\
    \ not worry if any of the program examples do not immediately sense to you, but\
    \ do have a look at them. This book is supposed to support whatever language you\
    \ are learning – only occasionally are there points that are really specific to\
    \ one language. You will probably find that you can get the gist of an example\
    \ in a language you do not know, if you read it in conjunction with the surrounding\
    \ text. Learning to think beyond the confines of whatever language you are studying\
    \ at present and to transfer your skills between languages, is an important part\
    \ of becoming a good developer. If you are at the beginning of a programming career,\
    \ the language you will use most may not even been invented yet. I have chosen\
    \ to include examples in Java, Python and Haskell: these are all common languages\
    \ for early programming courses, and they contrast interestingly with one another,\
    \ so that between them they allow to cover a lot of ground. In order to guide\
    \ you to further reading, there are often suggestions for things to put into your\
    \ favourite search engine\n\n### 1.3 Structure of This Book\n\nThe nature of learning\
    \ to program is that you will improve many skills in parallel; yet the nature\
    \ of a book is that chapters need topics. I have tried to include many cross-references\
    \ between the chapters, while leaving you plenty of freedom to dip into the book\
    \ as and when you wish.\n\nChapters 1 (you’re reading that now) to 3 get us going.\
    \ Chapter 4 will help you to place the language you are learning in the landscape\
    \ of all languages. Chapters 5 to 11 are the heart of the book; you’re likely\
    \ to flip between these chapters frequently. Chapters 12 and 13 are specifically\
    \ about how to do well in a programming course; you might skip these entirely\
    \ if, for example, you are teaching yourself to program. Chapters 14 and 15 are\
    \ the farewell chapters, setting the scene for what I hope will be your lifetime\
    \ of writing good programs.\n\n### 1.4 Acknowledgements\n\nI am very grateful\
    \ to all of my students, colleagues and friends who have commented on drafts of\
    \ this book, including the following: Alejandra Amaroño; Paul Anderson; Julian\
    \ Bradfield; Robin Bradfield; Carina Fiedler; Vashti Galpin; Lilia Georgieva;\
    \ Jeremy Gibbons; Kris Hildrum; Lu-Shan Lee; James McKinna; Greg Michaelson; Hugh\
    \ Pumphrey; Don Sannella; Jennifer Tenzer; Tom Ward.\n\nThanks are also due to\
    \ all at Cambridge University Press, especially my editor David Tranah, and to\
    \ the anonymous readers for helpful suggestions.\n\nOf course, all remaining errors\
    \ are mine. Feedback would be most welcome.\n\n*Perdita Stevens*\nphowto@stevens-bradfield.com\n\
    \n## 2 What Are Good Programs?\n\nA book that discusses how to write good programs\
    \ had better say what good programs are. That depends quite a lot on the context,\
    \ and we’ll have more to say about that in Chapter 10: but for now, let us begin\
    \ at the beginning with the least controversial criterion.\n\n**Criterion 1**\n\
    \nGood programs do what they are supposed to do.\n\nThat is, they are *correct*.\
    \ If your program does the wrong thing, it isn’t good – yet. This is the main\
    \ topic of much of this book, especially Chapters 7 and 9.\n\nWhenever you need\
    \ to change your program, though – whether that’s because it doesn’t do what it\
    \ should do yet, or because what it should do has changed since you first wrote\
    \ it – you will care about some further criteria.\n\n**Criterion 2**\n\nGood programs\
    \ are clearly written.\n\nThat is, they are as easy to read and understand as\
    \ they can be. This is the topic of Chapter 8 – and throughout the book, we will\
    \ be discussing how writing your program clearly helps you to make it correct.\n"
  mdcn: "\n\n## 1 引言\n\n### 1.1 本本书是给谁看的？\n\n这本书不会教你任何特定的编程语言——对于这一点，你需要另一本书、课程或在线教程，而且这类资源多得得挑选。这本书将在你学习任何编程语言的过程中为你提供帮助，特别是，它将帮助你学会写*好*代码，并对其有深度的理解，这种理解你也可以迁移到下一种语言中。它涵盖了编程课程通常假设学生会通过潜移默化学会的内容，但在实践中，这些往往是绊脚石。与专业人士的书籍不同（后者假设你总能用语言表达出你想表达的内容），此书将帮助你开发出突破困局、消除困惑和调试的方法。\n\
    \n你将学会编写那些不仅在你头脑清醒时可以理解和修改，甚至在你状态不佳时也能理解的代码。这将降低你的压力水平。它能让你以最好的方式变得“懒”。\n\n不过，把一事情做好确实有一种成就感：这就是良性循环的原理。\n\
    \n罗伯特·马丁（Robert Martin）在他为专业软件开发者编写的精彩著作《整洁代码》（*Clean Code*）中谈到了程序员需要具备“代码感”（code\
    \ sense）。代码感让老练的专业人士区分好代码和坏代码，更难的是，能够系统地开发好代码。如果你刚开始学习编程，这就是你需要培养的。你不会在一天、一周或一年内培养出它，但通过本书旨在鼓励的那种关注方式，你将逐渐增加你的代码感。\n\
    \n**1.1 本本书是给谁看的？**\n\n如果你正在学习编程，这本书是写给你的。\n\n如果你正在帮助他人学习编程，这本书是写给你的。\n\n如果你是一名专业程序员，这本书并不是为你准备的——但无论如何欢迎你的阅读。也许你想向某人推荐它。我欢迎你的评论。\n\
    \n### 1.2 关于这些框\n\n我们使用了各种类型的框。这里有提示，像这一个：\n\n**提示 (Tip)**\n关于拼写的说明。如果你使用英式英语，你可能预期拼写为“programme”而不是“program”。然而，根据惯例，当我们谈论计算机程序时，我们使用美式拼写。在极少数情况下，这种区分有助于消除歧义；计算机科学活动可能同时涉及\
    \ programs（程序）和一个 programme（计划/节目）。\n\n术语解释，像这个：\n\n**术语：编码 (Coding)、编程 (programming)、软件工程\
    \ (software engineering)**\n它们有重叠，且复杂程度按顺序递增。软件工程师可以编程（program），程序员可以编码（code），但并不一定反亦然。编码者（coder）可能只将精确的英语指令翻译成编程语言。程序员（programmer）负责决定写什么以及什么时候写得好。软件工程师通常作为团队的一部分工作，用高质量的软件解决现实世界的问题。在吸收本书的内容后，你将完全能够进步到软件工程：更多内容将在第\
    \ 15 章中讨论。\n\n**故事 (Story)**\n有这样的故事：有些人从第一次接触到这个想法起就被编程迷住了。我不是其中之一。我觉得能写个程序来输出质数列表之类的事情很酷，但我从未对写视频游戏感兴趣，而在在我年轻的时候，写视频游戏看起来是你在电脑上做的唯一事情。我真正关心的第一个程序是我在读数学博士时写的一个。我有一个猜想对于所有整数（$n\
    \ > 2$）都是成立的，但检查它的数学结构集合太枯燥了，无法用手完成。于是我写了一个程序来检查我的猜想，并很容易地发现我的猜想是正确的，至少对于所有直到\
    \ 10,000 的 $n$ 如此。当然，这并不是一个证明，但它给了我寻找证明的信心，最终，我找到了一个。当然，这里也有程序示例。这里有一个 Python\
    \ 示例：\n\n**Python 示例**\n```python\nprint(\"Hello, World!\")\n```\n\n注意，程序并不总是完整的。例如，代码必须在类中的方法内部，但我通常会省略显示这些内容的行，而不是像：\n\
    \n**Java 示例**\n```java\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n如果任何程序示例你没有立即理解，请不要担心，但请过来看一眼它们。本书旨在支持你正在学习的任何语言——只有少数点是真正针对某种特定语言的。你可能会发现，如果你结合上下文阅读，即使是一个你不熟悉的语言的示例，也能掌握其精髓。学会跳出你目前所学语言的限制，并在语言之间迁移技能，是成为优秀开发者的重要部分。如果你处于编程生涯的起点，你将最常用的语言可能还没有被发明。我选择包含\
    \ Java、Python 和 Haskell 的示例：这些都是早期编程课程的常用语言，而且它们之间形成了有趣的对比，因此在它们之间可以涵盖大量内容。为了引导你进一步阅读，书中经常会提供一些在你最常用的搜索引擎中搜索内容的建议。\n\
    \n### 1.3 本书的结构\n\n学习编程的本质在于你会并行提高许多技能；然而，书籍的本质是章节需要主题。我尝试在章节之间包含许多交叉引用，同时留出足够的自由，让你随时随地翻阅本书。\n\
    \n第 1 章（你现在正在读）到第 3 章带我们入门。第 4 章将帮助你将正在学习的语言放在所有语言的版图中。第 5 章到第 11 章是的核心；你可能会频繁在这些章节之间切换。第\
    \ 12 章和第 13 章专门关于如何在编程课程中表现优异；如果你是自学编程，你可能完全跳过这些章节。第 14 章和第 15 章是告别章节，为你希望的一生都在编写良好的程序奠定基础。\n\
    \n### 1.4 致谢\n\n我非常感谢所有对本书草稿提供意见的学生、同事和朋友，包括：Alejandra Amaro; Paul Anderson; Julian\
    \ Bradfield; Robin Bradfield; Carina Fiedler; Vashti Galpin; Lilia Georgieva;\
    \ Jeremy Gibbons; Kris Hildrum; Lu-Shan Lee; James McKinna; Greg Michaelson; Hugh\
    \ Pumphrey; Don Sannella; Jennifer Tenzer; Tom Ward。\n\n感谢剑桥大学的所有人员，特别是我的编辑 David\
    \ Tranah，以及提供帮助的匿名读者。\n\n当然，剩下的错误都是我的。非常欢迎反馈。\n\n*Perdita Stevens*\nphowto@stevens-bradfield.com\n\
    \n## 2 什么是好程序？\n\n一本讨论如何编写好程序的书籍最好说明什么是好程序。这在很大程度上取决于上下文，我们将在第 10 章中详细讨论；但现在，让我们从最没有争议的标准开始吧。\n\
    \n**标准 1**\n\n好程序执行了它们应该做的事情。\n\n也就是说，它们是*正确的*。如果你的程序做了错的事，它就不好——至少目前。这是本书大部分内容的主题，特别是第\
    \ 7 章和第 9 章。\n\n然而，每你需要更改程序时——无论是因为它还没有做到它该做的事，还是因为自你第一次写它以来它该做的事发生了变化——你都会关注一些进一步的标准。\n\
    \n**标准 2**\n\n好程序写得清晰。\n\n也就是说，它们尽可能地易于阅读和理解。这是第 8 章的主题——在整本书中，我们将讨论清晰地编写程序如何帮助你变得正确。\n\
    \n"
