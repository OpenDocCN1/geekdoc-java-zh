    ## 14 How to Choose a Programming Language


    your intuition for how data is stored in the computer’s memory. It is still a
    popular language for embedded systems. If you are interested in hardware, you
    are very likely to need to learn it.


    **C++** layers object-oriented features on top of C. It is harder to write in
    than Java, but even today it is more efficient. If C++ is the right language for
    you, you probably don’t need me to explain why that is.


    **Fortran** dates back to the 1950s and is now thought of as an old-fashioned
    language. However, it is still widely used in scientific computing.


    **Haskell** Haskell is one of the best established functional languages. It has
    a powerful static type system which can help you to avoid many kinds of bug. It
    is the language of choice for many experts in programming language theory. This
    has pluses and minuses: a plus is that learning Haskell will make many advanced
    deatures and a body of research available to you, while a minus is that it can
    be hard to get simple answers to simple questions, and that the compilers and
    libraries tend to change fast and unpredictably.


    **Java** Java is a very widely used, robust language, well-supported by tools,
    books, tutorials, etc. It is especially popular for enterprise systems, that is,
    for systems that support the business process of complex organisations. It can
    be verbose.


    **JavaScript** is a natural choice for web applications. There is a huge range
    of frameworks and libraries, so that the process of learning JavaScript is arguably
    more about learning some of its frameworks. JavaScript is dynamically typed, but
    if that is a problem for you you might want to consider TypeScript, which is essentially
    a statically typed variant of JavaScript, which compiles down to JavaScript. Be
    aware that the “Java” in “JavaScript” is there essentially for historical marketing
    reasons: when JavaScript came out, in 1995, Java was new and fashionable. The
    two languages are very different.


    ### 14.2 A Few Languages You May Encounter


    **MATLAB** is a language for numerical computing, widely used by scientists and
    engineers. Unlike most of the languages in this list, it has no open-source implementation.


    **Perl** Perl stands for practical extraction and report language, or for pathologically
    eclectic rubbish lister. A Perl motto is “There’s more than one way to do it.”
    Once you know the language well, it is extremely convenient for many tasks, especially
    those that involve interacting with the operating system and manipulating strings.
    But it can be difficult to track down bugs in your Perl programs. I love Perl
    (which is really why it’s in this list: it’s not commonly taught as a first programming
    language, though you may come across it in passing, almost anywhere) but I find
    it hard to argue for you learning it now, unless you have existing Perl code to
    maintain. Do at least consider using Python instead.


    **PHP** is a scripting language, widely used for web development (especially server-side
    scripting). It is easy to get started with, and is popular in web applications
    courses that have to cover a lot of ground. It has a reputation as a language
    which tends to encourage the writing of unmaintained, insecure code – but this
    may be somewhat unfair, especially as recent versions of the language have improved.


    **Prolog** is an old language which is having a resurgence with the AI boom. It
    has similar pattern-matching to functional languages like Haskell, but otherwise
    feels quite different from any of the other languages in this list: it’s described
    as a logic programming language, and the fundamental idea is that you encode some
    facts and then ask questions about them.


    **Python** By some measures Python is the most popular first programming language.
    I still rather resent Python for stealing the place in the language ecosystem
    that used to be occupied by Perl, one of my all-time favourite languages. There’s
    no denying, though, that Python has many advantages over Perl. Perhaps the easiest
    way to summarise the difference is to point out that one of the principles included
    in the Zen of Python² is “There should be one – and preferably only one – obvious
    way to do it.”³


    Python is very easy to get started with, very popular, and a good all-purpose
    language. It’s not statically typed, which means you may regret it if your program
    gets big and complicated. It’s a popular language for data science and for machine
    learning, and has good facilities for manipulating strings. Its popularity means
    that there are libraries and frameworks for everything. There are significant
    differences between Python versions 2 and 3, so be sure you know which you are
    to use.


    **R** is a language for doing statistics with data. It provides convenient facilities
    for graphing and analysis. Unlike MATLAB, which is sometimes used for the same
    tasks, it is an open-source language.


    **Racket/Scheme** Widely used as a teaching language, but not so popular commercially,
    Scheme is a functional language from the Lisp family. Racket, originally a renaming
    of a version of Scheme, is now more popular. It has a minimalist language design
    philosophy, and is a good language to learn if you’re interested in how programming
    languages work.


    Since all of these languages are widely used, and most of them often act as first
    programming languages, there is good teaching material in all of them. Experiment!


    ### 14.3 The Changing Landscape of Languages


    All of the languages in the previous section date back to the last century. But
    new languages are being invented all time, and there are many other ones I could
    have mentioned, too. You might like to search which languages are used by people
    and organisations whose work you find interesting. The TIOBE index⁴ attempts a
    regularly updated summary of the popularity of languages – but, unsurprisingly,
    its methodology is contested. Above all, be aware that if you plan to have a career
    that involves programming, the language you learn first is unlikely to be the
    one you use most in your life. It is important to learn to write good programs
    in your first language, but it is equally important to set yourself on the path
    towards writing good programs in languages that have not yet been.


    ## 15 How to Go Beyond This Book


    This book has been aimed at students and their teachers engaged in early programming
    courses, and I hope you have found it useful. Once you’ve thoroughly absorbed
    its content, what next?


    ### 15.1 Doing More Programming


    You can, of course, simply go ahead and write a program you find interesting.
    If you want a bit more structure to your practice, you might consider


    - online coding challenges and contests, such as those found at HackerRank¹ –
    these are available in multiple languages, and you can do them competitively or
    just for fun;

    - getting involved in outreach activities, e.g. helping with a coding club for
    school children: having to explain things is excellent for your own understanding;

    - attending hackathons – intense, group programming events often organised by
    large employers or university societies – talks, etc., if you are lucky enough
    to be somewhere these happen;

    - contributing to an open-source project: projects that welcome newcomers often
    have a forum or a Get Involved page or similar to help you get started, and the
    website UpForGrabs² collates links to such projects.


    The rest of this chapter is about books. If you have access to a university library,
    you are likely to find most of them there.

