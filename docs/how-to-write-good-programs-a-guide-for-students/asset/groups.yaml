    ## 13 How to Score Well in a Programming Exam


    ### 13.1.1 Finding Out What to Expect


    First – as early as you like – look at a past paper, without reading it in detail.
    How long is it? What *kind* of questions are being asked? What is the rubric (i.e.
    what choice of questions, if any, do you have)? What is the pass mark? Is there
    a mark, short of 100%, that you personally would be comfortable with? How much
    of the paper would you have to do perfectly in order to score that mark?


    Next, look in more detail at the style of question being asked. Are there many
    short questions, or just one or two long ones? Do you have to write whole programs,
    or program snippets? Are there questions that ask you to use a specific programming
    language-feature, such as recursion? Make sure, in that case, that you haven’t
    got into the habit of “programming around” something you don’t understand. In
    real life it’s often possible to be a (fairly) productive programmer in a language
    while avoiding some feature you don’t like, but here you’re trying to maximise
    your mark.


    What, if anything, are you allowed to take in with you? Exams vary from completely
    “closed book”, where you can take in nothing, through intermediate situations
    where you might be allowed only a clean copy of a course book, to completely “open
    book” exams where you can take in anything you like on paper, and (for computer-based
    exams) perhaps even a USB stick. If you are allowed to take things in, think about
    what will be useful.


    What are the rules concerning asking questions in the exam? Is there a mechanism
    for asking for clarification if you think a question is unclear? (Where I work,
    it is possible to ask the invigator to contact the person who set the exam with
    a clarification question, but I advise students against doing this unless they
    really cannot proceed without more input. Especially, if other people in the room
    appear unconcerned, you can probably save yourself time and stress by reading
    the paper again with minute attention, and answering your own question!)


    Finally, a meta-level question: how closely will the real paper resemble the past
    papers? In your institution, does the exam setter have a great deal of freedom
    to decide to set a different style of paper this time, or is it safe to assume
    that the paper you will sit will be very similar in style to the ones you have
    seen?


    ### 13.1.2 Practising a Past Paper


    When you have, in principle, learned (almost) all of the material that will be
    examined, it’s good to do a past paper. You probably don’t have many representative
    papers to use (courses, and indeed programming languages, tend to change over
    the years) so it’s important to make the best use of them. It’s a waste, for example,
    to read all the available papers before you attempt to do one under exam conditions,
    because then you rob yourself of the chance to practise reading an unfamiliar
    paper under time pressure.


    **Tip**

    Even though it’s scary and you may feel you know you won’t do well, do a past
    paper under the same conditions you’ll encounter in the real thing.


    If you find the paper quite doable, great. If you find the paper very difficult
    when you do it in this way, that’s great too – it gives you lots of useful information.
    Did you run out of time, or run out of questions you could attempt? Which parts,
    if any, could you do? Where did you get stuck? If you think carefully about these
    questions, you are well-placed to target your remaining work. In rather concrete
    subjects, like programming, it’s common to get stuck on small points in exams,
    so a practice in which you identify and remove such small sticking-points can
    be really worthwhile.


    There may or may not be model solutions and/or examiner’s notes available for
    a past paper. These can be useful, but on no *account* look at them until you
    have tried the paper yourself. It is easy to fool yourself into mistaking “I can
    read the model solution” for “I could have written the model solution.” You need
    to be able to write good code, not just read it!


    **Tip**

    “The first principle is that you must not fool yourself – and you are the easiest
    person to fool.”

    *Richard Feynman* (Feynman, 1974)


    ### 13.1.3 Planning for the Exam


    If the exam is open book: plan what to take with you. (Maybe this book!) Make
    sure you know your way around whatever you take – this is not a good time to try
    using something you’re not familiar with. Don’t take too much; when you’re nervous,
    you don’t want to be faffing with too much paper.


    Ask yourself: What will you have trouble remembering? Make a list of reminders
    and take it in with you, if that’s allowed, or else memorise it.


    Bearing in mind the information you gathered about the exam, develop a strategy
    about whether you should work as fast as possible to at least attempt everything
    on the paper, or whether it’s better to work meticulously to do part of the paper
    perfectly, even at the expense of not finishing.


    ### 13.2 In the Exam


    When you first open the paper, read through it quickly to make sure nothing is
    different from what you expect. If you are writing on paper, make sure you understand
    the expectations: do you have to get syntax perfectly, or do you only have to
    have the right idea? If you are writing on paper, it is painful to mark code that
    is not clear, so keep your code clear. Don’t invite those mistakes by poor indentation
    or badly chosen variable names.


    ### 13.3 Specific Points for Paper


    If you are doing a paper-based exam, it is essential to read the questions carefully.
    If you are unsure how it will be marked, for example, if you submitted code that
    didn’t compile correctly, would it get an automatic zero (because it wouldn’t
    be possible to run the automated tests on it) or would a human marker look at
    it and maybe give it some marks? If you are writing on paper, make sure you have
    the opportunity to ask informally.


    Hoare’s two ways to construct design:


    Tony Hoare famously wrote in “The Emperor’s Clothes” that “there are two ways
    of constructing design: One way is to make it so simple that there are no deficiencies
    and the other way is to make it so complicated that there are none.” Always, but
    especially in a paper exam, you should use the former – more difficult – approach.


    ### 13.4 Specific Points for Computer-Based Exams


    Writing code on a computer is more natural than writing it on paper, but programming
    exams on computer may still have artificial constraints unlike you’ve encountered.
    Such programming exams often differ from assignments in that they have to be marked
    very fast, and very reliably, in large numbers. They are highly likely to be marked,
    at least in part, by automated tests. Things you need to check include:


    - What computing environment will you be in? Will you be expected to do the exam
    on a laptop of your own, maybe with special software that you’ll have to install?
    Or will you have to work on a lab machine? What tools will be available to you?
    How will you submit your work?

    - You will probably not be allowed access to the internet: but will you be provided
    with any libraries or documentation?

    - What are the basic marking guidelines? For example, if you submitted code that
    didn’t compile correctly, would it get an automatic zero (because it wouldn’t
    be possible to run the automated tests on it) or would a human marker look at
    it and maybe give it some marks?


    In exam, keep your code clear. You are under stress and more likely than usual
    to make mistakes. Don’t invite those mistakes by poor indentation or badly chosen
    variable names. Even if your work will be marked purely by a computer, ensuring
    your code stays readable will help you to read it as you check it, debug it and
    try to improve it. You have time for this: provided you’ve practised the techniques
    beforehand, they won’t slow you down.


    Test your work. If you are given tests, use those first. Use any examples in the
    question paper. Then, create extra examples of your own, following the hints in
    Chapter 7 to pick the inputs.

