    \ Fizz Buzz 练习。\n\n### 骨架与规范\n\n为什么从外向内工作有帮助？因为外部通常对你必须要做的事情的*规范*至关重要。例如，在编写函数时，最重要的事情理解哪些信息是*输入*的——参数以及它们的类型——以及哪些信息必须*输出*——返回值、它的类型，加上你的函数可能产生的任何其他影响。处理好这些之间的关系，你就成功了。外部世界——即你函数的*调用者*——不会关心你是如何实现函数的，只要当他们提供合适的参数时，就能得到合适的结果。这就是*抽象*，它是编程的关键部分。我们将在第\
    \ 10 章回到这个观点。\n\n当你的程序接近完成时，每当你让另一个小功能运行时，就保存一个版本。理想情况下是将代码提交到版本控制系统（参见第 6 章），但另一种方法是保存程序文件的副本，并使用具有信息性的名称来提醒你哪个是哪个。这样你就可以放心地尝试各种尝试，因为即使出了问题你也不会丢失太多——你可以回到最近的运行状态。\n\
    \n## 3.5 如果你困惑了该\n\n有时你可能会发现自己很容易写出代码的骨架，但在继续往下写时感到无从下手。也许是指令令人困惑，或者也许你理解了它们的意思，但不知道如何实现它们。\n\
    \n当我处于舒适区之外，我喜欢做的一件事是对我的进度做笔记。我经常通过在编写程序的同一目录下创建一个名为 `notes.txt` 的文件，并在编写过程中给自己写笔记。我写的内容取决于任务中哪些部分看起来很棘手。面对一个大型问题，如果我理解自己需要做什么，但不确定如何编写程序来完成它，我可能会写下*设计笔记*，规划代码的结构或我将使用的*算法*（计算配方）。然而，通常情况下——特别是对于学生初学者——我的经验是，迭代开发程序本身通常更好，边写边测试，并随着对问题和解决方案理解的加深，不断改进程序的结构。在\
    \ `notes.txt` 中，我更多地描述目前的理解状态。例如，我可能会写：\n\n**笔记**\n\n函数 `foo^a` 应该对字符串做某些事情……*\n\
    \n我不理解通俗的解释……*但至少如果输入一个只有一个字母的字符串，如果该字母是元音，它应该返回 True，否则返回 False。\n\na 为什么是 foo？参见本章末尾的框。\n\
    \n即使这一点我可能错了——我误解了问题——打出字来促使我思考我理解和不理解什么，并记录了我进展到了哪里以及当时假设了什么，这在以后可能有用。\n\n当困惑带来威胁时，明确你的假设并进行测试通常会有帮助。例如，如果你觉得你的程序在简单输入上运行良好，但某些问题影响了更复杂的输入，问问自己所谓的“简单输入”到底是指什么。把它写下来：\n\
    \n**笔记**\n\n假设：程序在单个字符的字符串上始终运行正常。\n\n然后用一些特定的单字符字符串测试你的假设。包括一些你认为可能棘手的，例如空格或标点符号。你的程序要么在单字符字符串上总是表现正常（如果是这样，你就可以放心地去解决更大的问题），要么不是。如果不是，你现在就可以处理让程序在单字符字符串上表现正确的问题，这更容易思考。**提示**\
    \ 总是处理最简单的问题。一旦你解决了那部分，你就可以问自己了。正如第 7 章讨论的，编写自动化测试是跟踪哪些有效、哪些无效的非常好方法，可能会有帮助。特别是当你非常疲劳时，极很容易进入一种状态：你认为某些东西是有效的，但实际上并没有。如果没有，你可能至少可以让自己处于两种情况之一：\n\
    \n- 你对程序应该做的某些事情不理解。将其简化到最简单的情况。你不确定是否允许某种输入吗？或者在特定情况下可能会有两种预期行为，而你不确定哪种是正确的？带着这个特定问题重读问题描述。如果仍然不清楚，可能是时候问问别人了。\n\
    - 你的程序有些特定问题：它给了你一个错误信息，或者在某些输入上的行为不符合你的预期。也就是说，它包含一个 bug*。这是第 9 章的主题。\n\n无论如何，分析你的问题都是解决它的一大步。尝试避免直接请求解决方案：相反，请求能让你完成自己解决方案的精确帮助，长远来看对你更有帮助，也更有成就感。\n\
    \n### Foo, bar, baz, mung, froboz\n\n这些是对话中常用的用于代替函数、变量实际名称的名称，当实际名称并不重要或尚未决定时。例如，当你讨论函数调用如何工作时，你可能会说，“假设一个函数\
    \ foo 调用函数 bar . . .*：这里你要说的适用于任何函数调用另一个函数，但我们需要给它们起些名字，以便以后引用这些函数。此类名称被称为元语法（metasyntactic）。根据长期传统，foo\
    \ 和 bar 是程序员调用的前两个；这些名称可能是军事俚语缩写 F*** Up Beyond All Recognition 的变体。之后，关于使用哪些名称有几种分歧的传统（而且\
    \ froboz 通常被拼写为 frobozz）。识别并使用常用的元语法变量名可能有助于你留下一比实际经验更丰富的印象！然而，在程序中使用它们作为实际名称通常是一个坏主意——我们将在第\
    \ 8 章中讨论为什么选择有意义的名称是重要的。\n\n"
