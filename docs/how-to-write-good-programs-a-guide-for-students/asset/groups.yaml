    ## 12.5 Demonstrations


    175 The key to maximising your marks is to understand how marks will be allocated.
    Does everyone’s mark depend only on the quality of the jointly developed software,
    or is there some mechanism intended to enforce that every team member contributes?
    Sometimes you may be asked to estimate how much effort each team member has put
    in, and the estimates may affect the distribution of marks, for example.


    Student teams often find themselves with one or two members who are so much stronger
    (either in skills or in dedication) than the rest that the way to maximise the
    quality of the software that gets written is to allow them to carry the rest of
    the team, writing or rewriting all or most of the software. This situation is
    difficult for everyone to handle. If you are one of the strong team members, you
    will need to decide how far you are willing to do more than your “fair share”.
    If you can truthfully say that it won’t help your teammates’ scores for you to
    do the work for them, so much the better. If you are one of the weaker team members
    in this situation, it is important to remember the long view: you don’t *only*
    want a good mark for this exercise, you also want to improve your own skills.
    So make sure you get to do a decent amount of the programming, even if you have
    a team member who could do it faster.


    For everyone’s benefit, the team should try to ensure that members teach one another
    how to solve problems, rather than just solving them. This helps the members being
    taught at any moment, but it may help the team members doing the teaching even
    more. The saying “the best way to learn something is to teach it” is a cliché
    for a reason: it’s absolutely true. More generally, friendly and cooperative interactions
    within the team help you to improve your interpersonal skills, which will be part
    of the point of the exercise.


    You may be expected to demonstrate your code working, and discuss it with someone,
    as part of the process. This can be fun, especially if you made some decisions
    that you are proud of: you’ll get a chance to draw attention to things that, otherwise,
    a marker might simply overlook. It may also give you a good opportunity to mention
    anything you want specific feedback on.


    It can be difficult to convince yourself that it’s necessary to spend time preparing
    for a demonstration, if there isn’t a piece of written work to produce. For a
    smooth experience, do check the following:


    1. When and where is your demonstration?

    2. Who needs to be there? E.g. in the case of a team project, everyone on the
    team, or just one person to demonstrate?

    3. What have you been told about the timing and format? E.g. if you have to pre-plan
    a demonstration, how long must be be and what must it cover?

    4. Will you use a computer and software environment identical to what you’ve been
    used to? If there are any differences at all, do practise beforehand on the demonstration
    environment, if you possibly can – it’s easy to be tripped up by details, such
    as not having your usual IDE available.

    5. If you will have to connect a laptop to a data projector, do you know how to
    do this successfully – for example, if you need a special adapter, do you have
    one?

    6. Is the demonstration itself (as opposed to the program you are demonstrating)
    assessed, and if so, what do you know about the criteria?


    Be aware that part of the reason for asking a student to demonstrate their code
    working is to gain confidence that the student genuinely wrote the code: the underlying
    assumption is that someone will be able to explain how the code works if (and
    only if) they wrote it. This is debatable – but in any case, being sure you understand
    how your code works is a good thing!


    Practising the demonstration beforehand to someone else, such as a fellow student,
    is a very good idea; many people find it quite nerve-racking to demonstrate, and
    practice is the best way to calm nerves. As you practise you are likely to find
    small things you want to improve; for example, if you try explaining your code
    to someone else, you may well notice ways in which it is not as clearly written
    as it could be.


    **Tip**

    Never assume that some last-minute change you made “could’t possibly make any
    difference”. If you change *anything* about your program, run through the demonstration
    again to check that everything still works as you expect.


    ## 12.6 Reflective Writing


    You may be surprised if you are asked to write about your experience doing a programming
    exercise, but this happens quite often. As for demonstrations, one reason for
    it is that the people running the course are worried about whether you really
    wrote the code you submitted. They think that by getting you to write about the
    experience, they reduce the risk that you just copied the code, or bought it.
    Less cynically, such writing exercises also aim to help you consolidate what you
    have learned from the programming, by reflecting on it and making any lessons
    explicit.


    Of course you have to follow any instructions you’re given about what to include.
    Typically, though, a marker will be looking for at least these three things:


    - Some content that is sufficiently specific that it goes with your code and not
    with someone else’s. So, mention your code’s structural elements by name, and
    explain why you structured your code that way.

    - Some evidence that you learned something, and that you know what that is. So,
    say what you learned! For example, describe a problem you had, how you solved
    it, and what you now understand that would help you not to have the same problem
    again.

    - Clear writing – not only because clear writing is easier for the marker to read,
    but also because the ability to write clearly is a key “transferable skill” that
    the course as a whole is probably trying to give you. You don’t need to produce
    a literary masterpiece, but do read your work aloud, preferably to someone else,
    before you submit it, to check that it makes sense and you haven’t missed out
    words (which is surprisingly easy to do). Run a spell-checker, too.


    People differ in how they experience reflective writing. If you find that it genuinely
    helps you to fix what you have learned in your head, remember that. In that case,
    perhaps you would like to do a little reflective writing regularly, even when
    it isn’t required? Some people like to keep a Learning Diary for such things.
    Others would rather paddling in ice-cold treacle than do such a thing. Only you
    know how you feel about it!


    ## 13 How to Score Well in Course Exam


    Like the chapter on scoring well in assignment, this one focuses on how you can
    maximise your marks, given your current state of competence. It’s a good chapter
    to reread a day or two before the exam.


    ### 13.1 Preparing for the Exam


    There are two main things you need to do well in advance of the exam: find out
    all about what to expect, and practise. Past papers, for similar assessments at
    your institution, are an important tool for both. If there is a plentiful supply
    of past papers, use one recent paper for understanding what to expect, reserving
    a different one for practising.

