    10 How to Improve Your Program


    **Tip**


    Even if doing daily katas doesn’t sound like your kind of


    thing, you might want to redo an old exercise occasionally.


    Consider:


    • getting out a solution you wrote before, and improving it in


    some way; or


    • redoing the exercise* without* looking at your old solution, and


    then comparing your new solution with the old one. Did you


    find the exercise easier this time, or solve it better in some way?


    Or, perhaps, is there something you need to remind yourself


    of, from earlier in the course?


    You can also use your katas as a basis for variation, modifying


    the exercise or the rules you set yourself about how to solve it. If


    you usually use a loop in your kata, can you write a version with


    recursion? Suppose you needed to add some flexibility, e.g. to vary


    the rules for when to print Fizz and when Buzz? If you start to use a


    new tool such as an IDE, programming your kata in it will help you


    to get used to the tool. When you start to learn a new programming


    language, programming your existing katas in the new language


    will be a useful next step after writing a Hello World program,


    supporting your developing understanding of the similarities and


    differences between the languages.


    **Laziness, impatience and hubris?**


    Another of the jokes with a serious point behind them that


    Larry Wall, the designer of Perl, is known for is this: he wanted


    to encourage programmers to develop the three most important


    qualities of a great programmer, viz. laziness, impatience and


    hubris. How could these possibly be good things to aim for, as


    you improve your program?'
