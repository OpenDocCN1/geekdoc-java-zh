    9.2 When Your Program Runs but Behaves Wrongly


    113


    Suppose you are trying to debug this function, which, let’s say, is


    part of an exercise about decoding a ciphertext.


    **Haskell example**


    possibilities :: String -> \[(Int, String)\]


    possibilities str


    \= \[(i, rotate i str) | i <- \[0..25\], isPossible (rotate i str)\]


    where isPossible str = str == "AND" && str == "THE"


    It calls on another function rotate, which we’ll suppose you’re


    not suspicious of. rotate replaces each character in a string by the


    character that is a given number of places away in the alphabet, e.g.


    rotate 1 "CAT" will return "DBU", because D is 1 place after C


    in the alphabet, etc.. The possibilities function is supposed


    to test each possible rotation value, from 0 to 25, on a given string,


    and keep the rotation value and resulting string only if the decoded


    version is “AND”or “THE”. You can probably immediately see the


    problem, but suppose, for a moment, that you couldn’t. You look at


    the first line of the possibilities definition, and it seems to be


    OK …but there’s still a bug; even when you run possibilities


    on the plain string “AND”, it returns an empty list of possibilities!


    You finally suspect that the problem is the isPossible function,


    but it’s late and you stare at it without seeing a problem. If only you


    could test isPossible separately* . . .* but it’s encapsulated inside


    the definition of possibilities.


    Just fix it so that it isn’t, then:


    **Haskell example**


    isPossible str = str == "AND" && str == "THE"


    possibilities :: String -> \[(Int, String)\]


    possibilities str


    \= \[(i, rotate i str) | i <- \[0..25\], isPossible (rotate i str)\]'
