    9.2 When Your Program Runs but Behaves Wrongly


    111


    **Logging**


    A less crude alternative to using print statements is to use a


    logging framework, such as Log4j in Java or logger in Python.


    Such frameworks have a learning curve, but once learned, they


    give you an easy way to turn all your debugging messages on,


    or off, together.


    **Interactive Debugging**


    Sometimes understanding your bug is easiest if you can interact


    with the program from the inside, rather than running it as though


    you were a normal user of the program. For example, if there is a


    function which, in normal operation, is called by another part of


    your program, with a complex argument, you may want to call it


    manually with a simple argument, or with a succession of different


    arguments, to clarify whether it does what it should. If you have


    an interactive prompt, you may be able to load your program at


    the prompt, and have considerable freedom to explore. This is the


    commonest way to debug Haskell code. It is also possible, although


    not quite so convenient, in Python (using the code module).


    A more sophisticated approach, requiring a little more invest-


    ment up front but with the potential to save you time in the long


    run, is to use a* debugger*.


    A debugger is a specific program whose aim is, as the name sug-


    gests, to help you get rid of bugs. Most languages have debuggers


    available, but they’re often not taught in beginners’ programming


    courses, because they can be quite forbidding at first. A debugger


    might be a standalone tool, or might be built into your IDE if


    you’re using one.


    The basic features you need to be able to use are:


    • setting a* breakpoint* – that is, arranging that every time the flow


    of control gets to a certain line, the execution will stop, so that


    you can try:'
