    ## 13 如何在编程中中高分


    ### 13.1.1 了解预期情况


    首先——只要你觉得早——看一眼过去的试卷，但不要仔细阅读。它有多长？问的是什么*类型*的问题？评分标准是什么（即：你有哪些题目可选，如果有的话）？及格线是多少？除了100%之外，是否有哪个你个人觉得可以接受的分数？为了得到那个分数，你需要完美完成试卷的多少部分？


    接下来，详细观察题目的风格。是有很多短题，还是只有一两道大题？你需要编写整个程序，还是代码片段？是否有要求你使用特定的编程语言特性（如递归）的题目？在这种情况下，请确保你没有养成对于你不理解的东西采取“绕路”式编程的习惯。在现实生活中，你完全可以在某种语言中通过避免你不喜欢的特性来成为一名（相当）高效的程序员，但在这里，你的目标是分数最大化。


    你允许带什么进去？考试形式各异，从完全的“闭卷”（什么都不能带），到中间状态（可能只允许带一份干净的教材复印件），再到完全的“开卷”（可以带任何你喜欢的纸质材料，且对于机考，可能还可以带一个U盘）。如果允许带东西进去，考虑一下哪些东西是有用的。


    关于考试中提问有什么规定？如果你认为某个题目不清楚，是否有要求说明的机制？（在我工作的地方，可以要求监考老师联系出题人进行说明，但我建议学生不要这样做，除非你真的没有更多信息就无法进行下去。特别是如果房间里的其他人看起来无忧无虑，你可能可以通过极其细致地重新读一遍试卷，并回答自己的问题来节省时间并减轻压力！）


    最后，是一个元级别的问题：真正的试卷与旧试卷的相似程度有多大？在你的机构中，出题人是否有很大的自由决定这次出一套风格不同的试卷，还是可以假设你参加的考试在风格上与你看过的题目非常相似？


    ### 13.1.2 练习旧卷


    当你从原则上学习了（几乎）所有将要考的内容时，做一份旧卷是很有好的。你可能没有多少代表性的试卷可以使用（课程，事实上编程语言也会随着时间的推移而变化），因此充分利用它们至关重要。例如，在尝试在考试条件下完成之前读完所有可用试卷是浪费的，因为这剥夺了你自己在时间压力下阅读陌生试卷的机会。


    **提示**

    尽管这很令人害怕，而且你可能觉得自己表现不好，但请在真实考试的条件下做一份旧卷。


    如果你发现试卷挺好做的，那太好了。如果你通过这种方式发现试卷非常困难，那也很棒——它给了你很多有用信息。你是用尽了时间，还是用光了你可以尝试的题目？哪些部分（如果有）你可以做？你在哪里卡住了？如果你能仔细思考这些问题，就能很好地针对剩下的工作制定目标。在编程这样相当具体的学科中，考试中经常会在小点上卡住，因此一次能够识别并消除此类小卡点的练习是非常有值的。


    旧卷可能有也可能没有标准答案和/或阅卷者注释。这些可能有用，但在你自己尝试过试卷之前，*绝不要*看它们。你很容易欺骗自己，把“我能看懂标准答案”误认为是“我能写出标准答案”。你需要能够写出好的代码，而不仅仅是读懂它！


    **提示**

    “第一原则是你绝不能欺骗自己——而你是最容易被欺骗的人。”

    *理查德·费曼* (Feynman, 1974)


    ### 13.1.3 考试计划


    如果是开卷考试：计划带什么进去。（也许是这本书！）确保你对带的任何东西都如指——现在不是尝试使用你不熟悉的东西的时机。不要带太多；当你紧张时，你不想在这么多纸张上浪费精力。


    问问自己：哪些内容是你会难以记起的？列一份提醒清单，如果允许的话带进去，否则就把它背下来。


    记住你收集的关于考试的信息，制定一个策略：是应该尽可能快地工作以至少尝试试卷上的所有题目，还是最好细致地工作以完美完成部分题目，即使是以无法完成全部为代价的。


    ### 13.2 考试中


    当你第一次打开试卷时，快速读一遍，确保没有内容与你的预期不符。如果你是在纸上书写，确保你理解了要求：你必须获得完美的语法正确，还是只需要正确的思路？如果你是在纸上书写，标记不清晰的代码是很痛苦的，所以保持你的代码清晰。不要因为缩进不当或变量命名不当而引入那些错误。


    ### 13.3 纸笔考试的具体要点


    如果你参加的是纸笔考试，务必仔细阅读题目。如果你不确定如何评分，例如，如果你提交的代码没有正确编译，它会得到零分吗（因为无法对其运行自动测试），还是阅卷者会查看并可能给你一些分数？（注：此处原文逻辑似乎有重复或表述偏差，译文已根据语境调整）。如果你是在纸上书写，请确保你有非正式提问的机会。


    霍尔关于设计的两种方式：


    托尼·霍尔在《皇帝的新装》中著名地写道：“设计构造有两种方法：一种方法是使其简单到完全没有缺陷，另一种方法是使其复杂到完全没有缺陷。”任何时候，特别是在纸笔考试中，你应该采用前者——更困难（实现）的方法。


    ### 13.4 机考的具体要点


    在计算机上写代码比在纸上更自然，但计算机编程考试可能包含你从未遇到的人为限制。此类编程考试与作业的不同之处在于，它们必须非常快速、非常可靠地进行大量评分。它们极可能由自动测试评分。你需要检查的事项包括：


    - 你处于什么样的计算环境中？你是否需要在自己的笔记本电脑上参加考试，可能还需要你自己安装特殊软件？还是你需要在实验室机器上工作？哪些工你可用？你如何提交你的作品？

    - 你可能不被访问互联网：但会为你提供任何库或文档吗？

    - 基本评分标准是什么？例如，如果你提交的代码没有正确编译，它会得到零分吗（因为无法对其运行自动测试），还是阅卷者会查看并可能给你一些分数？


    测试你的作品。如果给出了测试，先使用它们。使用试卷中的任何例子。然后，自己创建额外的示例，遵循第 7 章的提示来选择输入。


