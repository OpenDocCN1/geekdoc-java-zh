    4 How to Understand Your Language


    However, real life is nothing like as neat as this, and some people


    argue that it isn’t useful to think in terms of paradigms. As you


    program in more than one language, you naturally import your


    favourite ways of thinking – influenced by your past programming


    experience – into each language you adopt. Some languages –


    Python is an example, in fact – have a mixture of features that


    makes them hard to classify. And sometimes a language that begins


    neatly in one paradigm may change, over time, to make it easier to


    program in a style that began elsewhere. For example, Java version


    8 introduced new features that made it more practical to program


    in a functional style.


    Does this mean you can just pick your favourite way to program


    and then program that way in any language? To some extent you


    *can*, but it’s unlikely to be the best approach. For example, you can


    write a C program in a functional style, but, because C doesn’t


    support functional programming very well, your program is not


    likely to be* good*. It will be all too easy to make mistakes, and


    all too hard for any reader (including you, later) to understand


    the program. Try to go with the grain of your chosen language


    (whether or not it was chosen by you): learn from the way experts


    in that language typically write. That is, learn to write* idiomatically*


    in your language. At the same time, be alert to the good features


    of different programming styles you come across, and be ready to


    make use of them* where appropriate*.


    **Tip**


    To help you get a feel for what is considered good, idiomatic


    code in your language, find a fairly large, highly reputable body


    of code. Look at it and remember to come back to it at intervals


    as you learn the language. Don’t worry if you can’t understand


    it in detail at this stage. Consult it if you ever wonder about


    such things as “how long should a function be?”, “how should


    I capitalise the name of a type?”, etc.'
