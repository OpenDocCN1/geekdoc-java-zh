    10 How to Improve Your Program


    called because it was pink, and had a camel on the front; sadly,


    the camel itself was not pink.) In the back of this book was


    a section about how to write efficient programs in Perl, which


    made a deep impression on me because it helped me make sense


    of some arguments between more experienced colleagues.


    Its point was that there are many different kinds of efficiency


    we might aim for. The two that people usually think about are


    *time efficiency*, which is about making your program run as fast


    as possible, and* space efficiency*, which is about how to make it


    run using as small an amount of memory as possible. However,


    in practice, the things you do to increase those two kinds of


    efficiency can be in conflict: for example, you might make your


    program faster by caching some intermediate results, which


    makes it use more memory. So far so pedestrian. The mind-


    blowing part was that it also identified – as the best kind of


    joke, the kind with a serious point – several other kinds of


    efficiency, such as “programmer efficiency”, which is about not


    wasting your time and effort, and “user efficiency”, which is


    about not wasting the time and effort of the people who will use


    your program. It pointed out that the phenomenon of reducing


    one kind of efficiency as you strive for another exists there,


    too. For example, if you care most about making life easy for


    users of your program, you may provide a carefully thought-out


    interface to it, whereas if you care most about making your own


    life easy, you may just do whatever is quickest for you. Neither


    of these is always right: it depends on the circumstances.


    What the section did not discuss, but perhaps should have


    done, was* Pareto efficiency*. If you have a choice of two


    approaches in mind, and one of the approaches is more efficient


    in one of the ways you care about* without being less efficient in*


    *any of them*, it’s a no-brainer to pick that approach.


    The special thing about* maintainer efficiency* is that it is a


    prerequisite to improving your program in any other way.'
