    9.6 After Removing the Bug


    133


    By programming defensively, you ensure that you cannot be


    blamed for a problem that is not your fault. If you check a pre-


    condition and complain immediately if your code is being called


    with arguments it should not have to handle, you avoid the risk


    that your code malfunctions on the argument it was not designed


    to handle and somebody later blames you for this. Of course, often


    you will be the author of both caller and callee, in which case the


    benefit to you is that defensive programming makes it easier to


    identify where a problem begins.


    More generally, what you need to defend against, and how,


    depends on the circumstances. Sometimes – for example, in many


    safety-critical situations – it is important to enable the program to


    keep running, even if something unexpected happens; you might


    supply sensible default values for missing data, for example, in


    order to defend against the program crashing or showing unpre-


    dictable behaviour. At other times, it is better to stop the program


    immediately a problem occurs, emitting a useful diagnostic mes-


    sage; this defends against hard-to-track-down misbehaviour that


    the problem might cause later.


    Students often worry that by inserting checks that shouldn’t


    really be necessary because they should always succeed (if every-


    thing else in the program is correct), they are bloating their pro-


    grams and making them inefficient. Don’t worry about this. Most


    such checks are very quick, and modern compilers are pretty good


    at optimising out checks that are truly unnecessary. Human brain


    power is a much more limited resource, and that’s what you should


    be trying to save.


    That said, if you, and every other reader of the code, can* easily*


    *and confidently* see that a check is not required, then there is no


    virtue in including it. This is a kind of code sense.'
