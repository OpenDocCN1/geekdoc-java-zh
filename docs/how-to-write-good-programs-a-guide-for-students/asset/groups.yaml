    **The Lauren bug**


    Margaret Hamilton, who worked on the Apollo space missions


    and led the team developing software for the first moon landing,


    has one of the earliest stories about how vital it can be to test


    what should not happen. She tells in an interview (Corbyn,


    2019) how she once took her small daughter Lauren to work


    with her, and Lauren, pressing keys randomly, caused a mission


    simulation to crash by invoking a procedure at the wrong point.


    Hamilton was concerned that an astronaut might do the same


    thing for real, and thought the software should be changed


    to prevent it. Senior people at MIT and NASA said that real


    astronauts would never make such a mistake – until they did,


    at which point the software was changed!


    **7.5**** When Should You Write Tests?**


    Some expert readers will complain that I should have introduced


    testing much earlier. The reason I chose not to is that in order to


    write tests you have to be able to program a bit; you have to start


    somewhere. Now that you have the skills to write tests, though, you


    should seriously consider adopting test-driven development and


    using it for the rest of your life.'
