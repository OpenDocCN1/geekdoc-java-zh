    4 How to Understand Your Language


    For you as a beginning programmer, the immediate advantages of using open-source
    software are that it is usually free,² and that you can, if you wish, look at
    the source code to learn from it. Later you may wish to contribute to an open-source
    project: see Chapter 15.


    ## 4.4 History, Community and Motivation


    How old is your language? Who designed it? What is it used for? If you are doing
    a beginners’ programming course, one question is: are you using a language that
    is used mostly for teaching, or one that is also widely used by professional developers?
    The languages we discuss most in this book are used in both settings, but you
    may have come across educational languages such as Scratch, or some language for
    turtle graphics based on Logo; you may now be learning Alice. Similar questions
    apply to the tooling you are using: for example, you might be using the education-focused
    IDE BlueJ, for Java. The lines between categories do get blurred, and successful
    languages outgrow their niches: for example BASIC, the name of a language designed
    in the early 1960s, stands for Beginner’s All-purpose Symbolic Instruction Code,
    but its Visual Basic dialect went on to be very widely used by experts as well
    as beginners.


    Most likely, your language is used by some professional developers. To do what?
    Reading its Wikipedia page, or searching who uses *your language* will find you
    some information (and possibly some examples of the *language wars*). In the process,
    you may find out something about the *community* surrounding your language. Perhaps
    your language is a *scripting language*, often used for automating sequences of
    tasks that would otherwise have to be done manually by humans.


    ² In the sense that you do not pay money for it: you might like to look up the
    different meanings of “free software”.


    ## 4.5 Paradigms


    These are interpreted languages: Python is usually considered a scripting language,
    although these days it is also used for many other purposes. Or perhaps your language
    is mostly used for web services, or in AI, or data science, or embedded programming,
    or statistics. Which websites have the most useful bodies of questions and answers
    about it? Bookmark them!


    We have left until last something which comparative discussions of programming
    languages sometimes take first. Traditionally, programming languages have been
    divided into groups according to the main way in which people writing in those
    languages tend to think – that is, according to *paradigm*. The four main paradigms
    usually identified are:


    - Imperative. The program orders the computer to do one thing, then another thing.
    Data is stored in the form of *mutable state*, i.e. variables which have values
    that can be changed. Example language: C.

    - Object-oriented. The program is organised in terms of objects. Each object wraps
    up (*encapsulates*) some data, and can respond to certain requests (*messages*),
    thereby fulfilling some responsibilities. Example language: Java.

    - Functional. The programmer thinks of functions not just as bits of code, but
    as concrete things in their own right – as data – which can be passed around the
    program. For example, a function can be passed as an argument to another function,
    just as an integer might be. (People sometimes say functions are “first-class
    citizens”.) Mutable state is avoided. Example language: Haskell.

    - Logic. Writing a program involves specifying facts, and rules about how facts
    follow from other facts, and then asking a question. Example language: Prolog.


    However, real life is nothing like as neat as this, and some people argue that
    it isn’t useful to think in terms of paradigms. As you program in more than one
    language, you naturally import your favourite ways of thinking – influenced by
    your past programming experience – into each language you adopt. Some languages
    – Python is an example, in fact – have a mixture of features that makes them hard
    to classify. And sometimes a language that begins neatly in one paradigm may change,
    over time, to make it easier to program in a style that began elsewhere. For example,
    Java version 8 introduced new features that made it more practical to program
    in a functional style.


    Does this mean you can just pick your favourite way to program and then program
    that way in any language? To some extent you *can*, but it’s unlikely to be the
    best approach. For example, you can write a C program in a functional style, but,
    because C doesn’t support functional programming very well, your program is not
    likely to be *good*. It will be all too easy to make mistakes, and all too hard
    for any reader (including you, later) to understand the program. Try to go with
    the grain of your chosen language (whether or not it was chosen by you): learn
    from the way experts in that language typically write. That is, learn to write
    *idiomatically* in your language. At the same time, be alert to the good features
    of different programming styles you come across, and be ready to make use of them
    *where appropriate*.


    **Tip**


    To help you get a feel for what is considered good, idiomatic code in your language,
    find a fairly large, highly reputable body of code. Look at it and remember to
    come back to it at intervals as you learn the language. Don’t worry if you can’t
    understand it in detail at this stage. Consult it if you ever wonder about such
    things as “how long should a function be?”, “how should I capitalise the name
    of a type?”, etc.


    Standard libraries, for example, are written by experts who expect their code
    to be inspected by many other experts, so they tend to be good – though not especially
    beginner-friendly – code.


    - Java: the OpenJDK version of the Java Development Kit has source code at http://hg.openjdk.java.net/jdk/jdk/.
    Look for the “browse” entry in the left-hand menu.

    - Haskell: if you use Hoogle (https://hoogle.haskell.org/) to look up a function,
    there is a link to its source code to the right of its name.

    - Python: if you use the documentation available from https://docs.python.org/3/library/
    for the standard library, you will see links to source code near the top of most
    pages.


    Your language-specific book or documentation should provide plenty of examples
    of simpler code.


    ## 5 How to Use the Best Tools


    In the earliest days of computing, programs took the form of punched cards that
    had to be fed into a computer, and programming was slow work. Naturally, the programmers,
    who understood the power of computers, wanted computers to help make the work
    of programming easier, faster and more reliable. These days, there is a wide –
    and constantly changing – assortment of tools to support the software development
    process. Some tools – e.g. compilers – perform a clearly delineated task; others,
    especially integrated development environments, bring together many capabilities
    and present a uniform interface to them. Learning to make good use of tools is
    an important part of learning to write good programs.


    Programming courses vary a lot in how much instruction they give on tool use.
    You may be told precisely what to use and how, or you may get a suggestion of
    what tool to use but be left to find out about its capabilities yourself, or you
    may be completely on your own. Naturally, to whatever extent learning to use a
    particular tool is part of your course, you need to do that; but it is also useful
    to have a broader view of what is available. When you program outside or beyond
    your course, you may be able to choose the tools you prefer. If you plan a career
    in software development, you will need to be able to adapt to whatever tool set
    is in use in the organisation where work. Widening your experience is worthwhile,
    both to let you make good choices when you can, and to give you the skills to
    fit in when you must.


    As we shall see in the rest of the book, appropriate tools can help you throughout
    the process of developing software: from starting a new programming project, through
    editing, compiling, running,

