    String. Such things are part of learning to write idiomatic code


    in your language.


    To go further you need some understanding of* computational*


    *complexity*. That’s beyond the scope of this book. Here let us just


    say: some tasks, like sorting collections, have been the subject of


    exhaustive study and it is very well known how to write code to


    do them efficiently. Rather than writing your own code to carry


    out such a task, you should use code from an appropriate library,


    which is likely to be much more efficient than what you will write


    yourself (and will already be correct, as well). Unless you are doing


    an exercise where the point is to implement a sorting algorithm,


    don’t implement your own sorting algorithm. Similarly, if your


    code uses data structures like dictionaries or hash tables, don’t write


    your own, unless that’s the focus of what you’re doing. It’s well


    worth spending some time becoming familiar with what is in the


    standard libraries available to you, so that you understand which


    components to use when.


    **Coding interviews**


    Curiously, a tradition has emerged that major tech companies’


    recruitment procedures involve asking candidates to solve small


    computer programming problems in highly constrained situa-


    tions, such as writing the code on a white board. The problems


    have to be able to be stated and solved succinctly, without a lot


    of explanation of customer requirements, so they tend to focus


    on data structures and algorithms. What distinguishes a good


    solution from a mediocre one tends to be the time and space


    needed. Thus, even though, if you get the job, it may turn out


    to be rare for you to have to worry about such things, they may


    be important for getting the job. Pay close attention when you


    take an algorithms class, and if you are preparing for such an


    interview, consider a specialist book such as Gayle McDowell’s


    *Cracking the Coding Interview*. Always write clear code, so that


    you can maximise the impact of your efficient code.'
- md: "\n## 10.3 Refactoring\n\nSee this as the game that it is. You are being asked\
    \ to behave like a peacock showing off its tail: the tail is not, in itself, all\
    \ that important, but the mate has to choose somehow, and the tail is the chosen\
    \ criterion.\n\nSuppose you’ve realised that your program, although correct, could\
    \ use some improvement. Maybe you need to remove some duplicated code, or maybe\
    \ you have to replace the use of a dictionary you implemented yourself by the\
    \ use of a more efficient one from a library. What do you do?\n\nSounds like a\
    \ trick question, doesn’t it? Why wouldn’t you just start editing your program,\
    \ and stop when you’ve changed it? The reason to be careful is that you have already\
    \ debugged your program, and you don’t want to have to do so again. To keep your\
    \ stress levels low, you want to go from a working program to a better-designed\
    \ working program, without spending too much time with a non-working program in\
    \ between. Refactoring – “improving the design of existing code” (Fowler, 1999)\
    \ – helps you do this.\n\nTo begin with, you need a method for establishing confidence\
    \ that the program is correct, which you can carry out now, and repeat on future\
    \ versions of the program, as needed. That is, you need to be able to test your\
    \ program, as discussed in Chapter 7.\n\n**Tip**\n\nEven if you are impatient\
    \ to go on and improve your program, it really is worthwhile to take the time\
    \ to make sure you have a good set of tests.\n\nNext, your aim is to change your\
    \ program in steps that are as small as you can manage, testing after each step.\
    \ It’s a bit like the game you may have played as a child where you have to change\
    \ one word into another word by changing one letter at a time, making a real word\
    \ after every change. Figure 10.1 illustrates the process.\n\nThis way of working\
    \ is great for keeping your stress levels low: you can arrange that you always\
    \ know what you’re doing and never make a change that breaks your program. It’s\
    \ especially useful if you are not sure how much time you will be able to spend\
    \ working on the program, because every few minutes, your program returns to a\
    \ fully working state, so you can stop whenever you need to.\n\nHow large your\
    \ improvement steps should be is something you will learn through experience.\
    \ You should usually find that all your tests pass first time, after each improvement\
    \ step. If you slip into expecting that some test will fail, perhaps you might\
    \ find it more efficient overall to take smaller steps. Considering our Python\
    \ shopping example, some people would go all the way between our initial two versions\
    \ in one go. Others might include an intermediate step, perhaps something like\
    \ this:\n\n**Python example (mid refactoring)**\n\n```python\ndef total(basket,\
    \ country):\n    total = 0\n    for item in basket:\n        total += price(item)\n\
    \        if total > 10: #free shipping offer\n            return total\n     \
    \   else:\n            total += shipping_cost(basket, country)\n    return total\n\
    \ndef shipping_cost(basket, country):\n    if country == \"UK\" and weight(basket)\
    \ <= 1:\n        return STANDARD_UK_SHIPPING\n    else:\n        raise NotImplementedError\n\
    ```\n\nNotice that we not only run the existing set of tests after each improvement,\
    \ but also ask ourselves whether there are enough tests, each time. You might\
    \ decide to add specific tests for the new shipping_cost function, for example\
    \ – although, if you are following a test-driven development approach (as discussed\
    \ in Chapter 7), you will already have written them, before you wrote the function\
    \ itself, as part of the “improve program” step.\n\nIdeally, each refactoring\
    \ step makes the program better, so that whenever you stop, the program is the\
    \ best that it has been so far.\n\nThis is not always possible, however. Sometimes\
    \ you find that your program needs to be restructured, and that doing the restructuring\
    \ in small, refactoring steps will take you through states where the program is\
    \ less clear than it is now. It is then tempting to abandon the refactoring discipline\
    \ and make all your changes at once, as fast as possible. But even here, refactoring\
    \ will help you to avoid getting into a buggy mess. What you should do is to make\
    \ sure you understand where you are going before you start, and avoid starting\
    \ until you have a suitable chunk of time available to you, so that you can take\
    \ the program all the way through to its better structure without having to leave\
    \ it in a working, but unsatisfactory, state. You may like to write yourself design\
    \ notes or draw a picture to explain the final state you are heading for, to minimise\
    \ the risk of losing your way once you start editing the code.\n\n**When is the\
    \ program good enough?**\n\nIt really depends on the context. It is very satisfying\
    \ to take a piece of code all the way to your idea of perfection, and the more\
    \ often you mindfully do that, the better you will get at writing code which is\
    \ good the first time. However, you will not have time to take every piece of\
    \ code you ever write to perfection. More interestingly, what “perfect” is depends\
    \ on what you need to do with the code: however you structure your code, some\
    \ changes to the functionality will be easier to make than others. The perfect\
    \ structuring is the one that best supports* the change that actually turns out\
    \ to be required – which, in real life, you can’t predict with certainty! As a\
    \ matter of pride, try to leave your code clean, readable, and in a state to support\
    \ changes you can reasonably foresee: but don’t agonise over it.\n\n² If you are\
    \ fluent in Java, you might like to read Chapter 14 of *Clean Code*, which goes\
    \ through an example of such a refactoring. The chapter is more than 50 pages\
    \ long, though, which is why there is no such example here!\n\n## 10.4 Improving\
    \ Your Skills\n\nStretching the title of this chapter a little, what – beyond\
    \ “absorb everything this book says”! – can you do to improve your skills, and\
    \ hence improve *all* your programs? Let us look at one specific habit that you\
    \ might find worth adopting. It is the use of katas.\n\n### Terminology: Kata\n\
    \nA kata is an exercise, performed repeatedly in order to improve one’s skills.\n\
    \nThe term originates in martial arts; Dave Thomas first introduced the idea of\
    \ katas as programming exercises in *The Pragmatic Programmer*, and the idea has\
    \ been taken up by others since. Other martial arts terms have also been imported\
    \ into the world of programming: if you find there is a coding dojo near you,\
    \ you might like to go there to do your katas.\n\nIf you are on a programming\
    \ course, you may feel you have enough exercises to be going on with: why would\
    \ you want more? The key is the word *repeatedly*. Instead of just doing a succession\
    \ of different exercises, you adopt one and do it frequently. Fizz Buzz, which\
    \ we considered in Chapter 3 and earlier in this chapter, is suitable. As you\
    \ repeat an exercise you have done before, you focus on writing the program perfectly,\
    \ thinking about each small choice. Just as the movements of your body become\
    \ second nature if you do the same exercise repeatedly, the elements of programming\
    \ your kata should soon feel very familiar. Even though you know how to solve\
    \ the problem, you don’t take shortcuts: for example, you should still write tests\
    \ for the program and use them as you work. Indeed, the use of katas goes well\
    \ with test-driven development, and one of the things you might like to explore\
    \ is some ways of solving your problem are easier to test as you go.\n\n**Tip**\n\
    \nEven if doing daily katas doesn’t sound like your kind of thing, you might want\
    \ to redo an old exercise occasionally. Consider:\n\n- getting out a solution\
    \ you wrote before, and improving it in some way;\n- redoing the exercise without\
    \ looking at your old solution, and then comparing your new solution with the\
    \ old one. Did you find the exercise easier this time, or solve it better in some\
    \ way?\nOr, perhaps, is there something you need to remind yourself of, from earlier\
    \ in the course?\n\nYou can also use your katas as a basis for variation, modifying\
    \ the exercise or the rules you set yourself about how to solve it. If you usually\
    \ use a loop in your kata, can you write a version with recursion? Suppose you\
    \ needed to add some flexibility, e.g. to vary the rules for when to print Fizz\
    \ and when Buzz? If you start to use a new tool such as an IDE, programming your\
    \ kata in it will help you to get used to the tool. When you start to learn a\
    \ new programming language, programming your existing katas in the new language\
    \ will be a useful next step after writing a Hello World program.\n\n**Laziness,\
    \ impatience and hubris?**\n\nAnother of the jokes with a serious point behind\
    \ them that Larry Wall, the designer of Perl, is known for is this: he wanted\
    \ to encourage programmers to develop the three most important qualities of a\
    \ great programmer, viz. laziness, impatience and hubris. How could these possibly\
    \ be good things to aim for, as you improve your program?\n"
  mdcn: "\n\n## 10.3 重构\n\n将此看作一场游戏吧。你被要求表现得像一只正在炫耀尾巴的孔雀：尾巴本身并不重要，但配偶必须以某种方式进行选择，而尾巴就是被选中的标准。\n\
    \n假设你已经意识到你的程序虽然是正确的，但还有改进空间。你可能需要移除一些重复的代码，或者你可能必须将自己实现的字典替换为库中一个更高效的字典。你该怎么办？\n\
    \n听起来像是一道陷题，不是吗？为什么你不直接开始编辑你的程序，并在修改完成后停止呢？保持谨慎的原因在于，你已经对程序进行过调试，你不想再做一遍。为了保持压力水平处于低位，你希望从一个运行良好的程序变成一个设计更好的良好程序，而在过程中不要花太多时间处理一个无法运行的程序。重构——“改进现有代码的设计”（Fowler,\
    \ 1999）——可以帮助你实现这一点。\n\n首先，你需要一种方法来建立对程序正确的信心，你现在可以执行这种方法，并在需要时未来的程序版本中重复。也就是说，你需要能够测试你的程序，正如第\
    \ 7 章所讨论的。\n\n**提示**\n\n即使你急于继续并改进你的程序，但花时间确保你拥有一组良好的测试也是非常值得的。\n\n接下来，你的目标是以尽可能小且你能掌握的步骤来更改程序，每一步之后都进行测试。这有点像你小时候可能玩过的一种游戏，你必须一次改变一个字母，将一个单词变成另一个单词，每次更改后都变成一个真实的单词。图\
    \ 10.1 说明了这一过程。\n\n这种工作方式对于保持低压力水平非常有帮助：你可以安排自己始终知道自己在做什么，并且永远不会做出破坏程序的更改。如果你不确定自己能花多少时间在程序上工作，这尤为有用，因为每隔几分钟，你的程序就会回到完全正常的状态，所以你可以根据需要随时停止。\n\
    \n改进步骤应该有多大，你将通过经验来学习。你通常会发现，在每个改进步骤之后，所有的测试都能一次通过。如果你陷入了预期某些测试会失败的心理，也许你可能会发现整体上采取更小的步骤会更高效。考虑我们的\
    \ Python 购物示例，有些人会一次性完成我们最初两个版本之间的所有工作。另人可能会包含一个中间步骤，也许像这样：\n\n**Python 示例（重构中）**\n\
    \n```python\ndef total(basket, country):\n    total = 0\n    for item in basket:\n\
    \        total += price(item)\n        if total > 10: # 免运费优惠\n            return\
    \ total\n        else:\n            total += shipping_cost(basket, country)\n\
    \    return total\n\ndef shipping_cost(basket, country):\n    if country == \"\
    UK\" and weight(basket) <= 1:\n        return STANDARD_UK_SHIPPING\n    else:\n\
    \        raise NotImplementedError\n```\n\n注意，我们不仅在每次改进后运行现有的测试集，而且每次都问自己测试是否足够。你可能会决定为新的\
    \ `shipping_cost` 函数添加特定的测试，例如——尽管，如果你遵循测试驱动开发方法（正如第 7 章所讨论的），你在编写函数本身之前就已经写好了它们，并将其作为“改进程序”步骤的一部分。\n\
    \n理想情况下，每个重构步骤都让程序变得更好，这样无论你何时停止，程序都是到目前为止最好的状态。\n\n然而，这并不总是可能的。有时你会发现程序需要重新结构，而通过小的重构步骤进行这种结构调整会让你处于程序比现在不清晰的状态。这时，你很想放弃重构的纪律，尽可能快地完成所有更改。但即使在这里，重构也会帮助你避免陷入充满\
    \ Bug 的混乱。你应该做的是在开始之前确保你要去哪里，并且在你有足够的时间之前开始，这样你就可以将程序一直引导到更好的结构，而必让它处于一种可以运行但不令人满意的状态。你可能喜欢自己写设计笔记或画一张图来解释你正在追求的最终状态，以降低一旦编辑代码后丢失方向的风险。\n\
    \n**程序什么时候足够好？**\n\n这真的取决于上下文。将一段代码一直带到你理想中的完美是非常令人满意的，你越有意识地这样做，你编写初次就很良好的代码的能力就越强。然而，你没有时间把你写过的每一段代码都达到完美。更有趣的是，“完美”取决于你对代码要做什么：无论你如何组织代码，对功能的某些更改都会比其他更改更容易实现。完美的结构是能够最好*支持*实际所需的更改的那种——而在现实生活中，你无法确定地预测这一点！出于自豪感，尽量保持你的代码整洁、可读，并处于支持你可以合理预见的更改的状态：但不要为此纠结。\n\
    \n² 如果你精通 Java，你可能喜欢阅读《整洁代码》第 14 章，书中介绍了这种重构的示例。不过，该章节超过了 50 页，这就是为什么没有此类示例的原因。\n\
    \n## 10.4 提高你的技能\n\n稍微扩展一下章节的标题——你可以做什么来提高技能？让我们看看你可能发现值得采纳的一个习惯。\n\n### 术语：Kata\n\
    \nKata 是一种为了提高技能而反复进行的练习。\n\n该术语源于武术；Dave Thomas 在《实战程序员》中首次引入了 Kata 作为编程练习，后来被其他人所采用。其他的武术术语也被引入了编程世界：如果你发现附近有道场，你可能喜欢在那里练习\
    \ Kata。\n\n如果你在参加编程课程，你可能觉得有足够的练习了：为什么你想要更多？关键在于*反复*。与其完成一系列不同的练习，不如采用一个并频繁地执行。我们在第\
    \ 3 章和本章前面的部分考虑过的 Fizz Buzz 就很。当你重复以前做过的练习时，你专注于完美地编写程序。就像如果你反复练习身体动作它们会变成本能一样，编程的元素很快应该感觉非常熟悉。即使你知道如何解决问题，你也没有走捷径：例如，你应该为程序编写测试并在工作时使用它们。事实上，Kata\
    \ 的使用与测试驱动开发非常契合，你可能喜欢探索的问题之一是解决问题的方法在进行时更容易测试。\n\n**提示**\n\n即使每天做 Kata 听起来不像你的风格，你可能想偶尔重做旧练习。考虑：\n\
    \n- 拿出一个你以前写的解决方案，并以某种方式改进它；\n- 在不看旧解决方案的情况下重新练习，然后将新方案与旧方案进行比较。你是否发现这次更容易了，或者在某些方面解决得更好？\n\
    或者，也许，你有什么从课程早期需要提醒自己的事？\n\n"
