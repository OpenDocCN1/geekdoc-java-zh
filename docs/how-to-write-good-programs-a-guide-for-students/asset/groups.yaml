    # 如何编写优秀的程序

    学生指南


    Perdita Stevens


    ![](img/bbd5a79fa1de374b80fd37c357254796_1_0.png)


    语言：要成为一名优秀的程序员，你必须成为调试、测试、编写清晰代码以及通常在陷入困境时如何让自己摆脱困境的专家；而要在编程课程中取得优异成绩，你则必须学习如何在课程作业和考试中获得高分。


    本书通过提供技巧、故事和关键术语的解释，显式地教授了这些技能。书中包含了 Python、Java 和 Haskell 的示例，帮助你无论学习何种语言，都能获得可迁移的编程技能。本书面向在高等教育或进阶教育阶段学习早期编程课程的学生，将帮助你从课程中取得成功并获得最大收益，同时支持你培养通往良好程序的软件工程习惯。


    **Perdita Stevens** 是爱丁堡大学的教授，曾向从大一学生到资深专业软件开发人员等各种学生教授过多种语言的编程和软件工程。她曾合著了*Using
    UML: Software Engineering with Objects and Components*（1998年），并因在双向变换方面的工作在2017年的MODELS会议上获得了“十年影响力论文奖”和“最佳论文奖”。


