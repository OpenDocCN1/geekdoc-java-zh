    9 How to Debug Your Program


    Fortunately, the compiler gives, along with the basic error mes-


    sage, some further information – usually an indication of where in


    the file the error arose, but often other information as well, such as


    *what* symbol it was that the compiler couldn’t find.


    **Tip**


    When an error message gives a line number, look at that line


    first – but bear in mind that the error may be earlier in your


    program, and only have been detected further on, at the given


    line number. For example, a missing semi-colon on one line may


    cause an error to be reported on the next line.


    **Terminology: Errors compared with warnings**


    Sometimes your compiler will give you a message involving the


    word “error”, like those given above. Other times you may see


    messages involving the word “warning” instead. There is an


    important difference. An* error* is something you must fix before


    you go on – typically it has prevented your file from compiling


    at all. A* warning* is an indication that the compiler has detected


    something which is* probably* an indication that you’ve done


    something wrong. For example, compilers will often warn if


    they discover that your program contains unreachable code.


    You* can* ignore a warning, or even instruct the compiler not to


    give warnings – but it’s usually a good idea not to. Some compil-


    ers are better than others at giving warnings that genuinely do


    indicate problems. If you get a kind of warning you haven’t seen


    before, it’s definitely worth spending a few minutes on investi-


    gating what’s causing it and whether you can fix it. For example,


    in the case of unreachable code, you can delete it (or comment


    it out, if you think you might need it again in a moment).


    Often there will be an obvious problem – a mistyped word or


    a missing bracket, for example – on or around the line number'
- md: "\n## 9.1 When You Can’t Run Your Program Yet\n\ngiven in the error message.\
    \ Sometimes, however, either the compiler will give no line number, or it will\
    \ indicate a line that really looks perfectly fine to you. Now you benefit if\
    \ you’ve been compiling as you go, or having your IDE do it for you. If you have\
    \ a good idea of what has been changed or added since the last time there was\
    \ no error, look suspiciously at those parts.\n\nIf you still don’t see the problem,\
    \ try commenting out code – replacing it with simpler code as necessary, e.g.\
    \ replacing a complex calculation of an integer with constant 1 – until you do\
    \ get a clean compilation, or, failing that, until you get a different error message.\n\
    \n**Tip**\n\nSave a copy of your code before you do this, or make any other changes\
    \ that you aren’t sure will help, so that if an hour later you find a tiny change\
    \ that fixes the problem, you don’t have to do a lot of work undoing all the other\
    \ changes you tried.\n\nIt can help to understand something about the activities\
    \ that are undertaken in compiling your program text, starting from the text file\
    \ that you typed, and ending up with an executable program. At this stage, a very\
    \ rough idea will do. In particular, it is useful to understand whether an error\
    \ arose during parsing, or whether your program parsed correctly but some problem\
    \ turned up at a later stage.\n\n**Terminology: Parsing**\n\n*Parsing* of a program\
    \ text is the process of building a structured representation of the program (an\
    \ *abstract syntax tree*). This involves splitting the text up into chunks such\
    \ as keywords, names and operators (*lexing*), and then checking that these chunks\
    \ fit together in the way the language definition requires.\n\nIf you have an\
    \ error message that tells you there was a problem parsing your program, you do\
    \ not need to check more sophisticated issues like whether you are providing functions\
    \ with arguments of the right types; your mistake will be something more basic,\
    \ where your text somehow failed to match the patterns of the language definition.\
    \ (This description is necessarily a bit vague, since we are not going into what\
    \ parsing does in detail.)\n\nIt is common that several error messages arise from\
    \ the same error: don’t assume seven error messages means seven separate errors!\
    \ Almost always, the first error message is the most useful one.\n\n**Story**\n\
    \nDmitri starts to do a Java exercise. Following the advice in Chapter 3 he writes\
    \ only a few lines before he first compiles: just the outer wrapper of his class\
    \ and its main function, without any functionality yet.\n\n**Java example (don’t\
    \ do this!)**\n\n```java\npublic class ExerciseOne {\n    public static void main\
    \ {String[] args) {\n\n    }\n}\n```\n\nHe’s surprised to find that when he compiles\
    \ he already gets *three* error messages:\n\n```text\njavac ExerciseOne.java\n\
    ExerciseOne.java:2: error: '(' expected\npublic static void main {String[] args)\
    \ {\n                               ^\nExerciseOne.java:2: error: ';' expected\n\
    public static void main {String[] args) {\n                               ^\n\
    ExerciseOne.java:4: error: reached end of file while parsing\n}\n            \
    \                   ^\n3 errors\n```\n\nFortunately, when he reads just the first\
    \ error message, he finds it tells him rather clearly what the problem is: the\
    \ compiler expected an opening round bracket, in line 2 of his file, and there’s\
    \ even a caret (^) to show exactly where in line 2. He sees that he had accidentally\
    \ typed an opening curly bracket instead.\n\nHe changes just this one character,\
    \ saves the file, and tries the compilation again. All three error messages disappear,\
    \ so he’s in a good state to continue.\n\nType errors are a common kind of compile-time\
    \ error – and the more powerful the language’s type system is, i.e. the more problems\
    \ it can rule out, the more common they are. If, as in Haskell, the type system\
    \ is very sophisticated, the error messages are sometimes hard to interpret, because\
    \ they may mention features of the type system that you have not yet met. We saw\
    \ an example of this in the story in Chapter 3. Remember the option of searching\
    \ for the error message online, if you get stuck. More often, though, the error\
    \ message will tell you what the problem is in terms you can understand. Let us\
    \ look at a couple of examples.\n\nSuppose you are writing a Haskell function\
    \ `triangle` which is supposed to take an integer, say n, and return the nth triangle\
    \ number, which is the sum of the first n positive integers. Making use of Haskell’s\
    \ ability to use `[1..]` to represent the unbounded list of natural numbers 1,\
    \ 2, 3, 4, ... , you might first write:\n\n**Haskell example (don’t do this!)**\n\
    \n```haskell\ntriangle :: Integer -> Integer\ntriangle n = sum (take n [1..])\n\
    ```\n\nbut you would get a compile-time error\n\n```text\ntake.hs:2:24: error:\n\
    - Couldn’t match expected type ‘Int’ with actual type ‘Integer’\n- In the first\
    \ argument of ‘take’, namely ‘n’\nIn the first argument of ‘sum’, namely ‘(take\
    \ n [1 ..])’\nIn the expression: sum (take n [1 ..])\n|\n2 | triangle n = sum\
    \ (take n [1..])\n|\n               ^\n```\n\nThis tells you that the function\
    \ take expects an argument of type Int, while you are giving it an argument of\
    \ type Integer. Most likely, the root cause of the error is that you did not realise\
    \ Haskell has two different integer types, one for machine integers and one for\
    \ arbitrary precision arithmetic: but this is easy to look up, once you read the\
    \ error message.\n\nAnother common cause of type errors, in any language, is getting\
    \ arguments in the wrong order. Suppose you wrote\n\n**Haskell example (don’t\
    \ do this!)**\n\n```haskell\ntriangle :: Int -> Int\ntriangle n = sum (take [1..]\
    \ n)\n```\n\nthrough mistakenly thinking take wanted its integer argument after\
    \ its list argument, instead of before. You would get an error “Couldn’t match\
    \ expected type ‘[Int]’ with actual type ‘Int’”, followed, as before, by exhaustive\
    \ information about where the problem arose. Once you read that the take function\
    \ is being given an integer where it expects a list of integers (notated [Int]\
    \ in Haskell), it is the work of a moment to swap the arguments.\n\n**Haskell\
    \ example**\n\n```haskell\ntriangle :: Int -> Int\ntriangle n = sum (take n [1..])\n\
    ```\n\n## 9.2 When Your Program Runs but Behaves Wrongly\n\nIt may help you in\
    \ future if you also take a moment to think about *why* the arguments are in that\
    \ order. In this case, it is syntactically convenient to have the list come last,\
    \ because this makes it easier to use take in contexts where a list is repeatedly\
    \ processed, in a pipeline, by many functions. Even if you do not come up with\
    \ an explanation, having thought about it may help you to remember the argument\
    \ order!\n\n**Is it the compiler that’s wrong?**\n\nNo. Well, almost certainly\
    \ no. After twenty-five years of teaching programming, on and off, I recently\
    \ had a case where a first-year undergraduate student had a problem understanding\
    \ a compiler’s error message and it *did* turn out to be a (known) compiler bug.\
    \ However, I’ve lost track of how many times new students have suspected a compiler\
    \ bug that wasn’t there. Unless you just wrote the compiler – in which case you’re\
    \ not what I mean by a “new student” anyway – assume it is correct.\n\nSuppose\
    \ your code compiles and runs – but it doesn’t do what you expect. Perhaps it\
    \ yields a wrong result, causes confusing behaviour of some interface, or prints\
    \ something you don’t expect; perhaps it even crashes or seems to run for ever.\
    \ What then?\n\nThe first thing is to look for the simplest case where the program\
    \ doesn’t do the right thing. Preferably, write an automated test that fails,\
    \ exercising your program in this simplest case: but if you are not yet writing\
    \ automated tests, making a note, and running the test manually, will do for now.\
    \ Getting this test to pass is a concrete goal to aim for. As mentioned in Chapter\
    \ 7, keeping it in the set of tests that you run regularly in future will ensure\
    \ that you do not re-introduce the same bug, that is, it will prevent *regression*.\n"
  mdcn: "\n\n## 9.1 当你还无法运行程序时\n\n错误信息中通常给出了提示。然而，有时编译器要么没有给出行号，要么指向了一行在你看来看起来完全没问题的代码。现在，如果你一直在边写边编译，或者让你的\
    \ IDE 为你完成编译，那么你就会受益。如果你对上次没有错误以来更改或添加了哪些内容很有了，那么请怀疑地检查那些部分。\n\n如果你仍然看不到问题所在，尝试注释掉代码——根据需要将其替换为更简单的代码，例如，将一个复杂的整数计算替换为常量\
    \ 1——直到你获得通过的编译，或者在失败的情况下，直到你得到不同的错误信息。\n\n**提示**\n\n在执行此操作之前，请保存一份代码副本，或者进行任何其他你不确定是否有帮助的更改，这样如果你一小时后发现了一个可以修复问题的微小改动，就不需要花费大量工作来撤销所有其他尝试过的更改。\n\
    \n了解编译你的程序文本时所进行的活动可能会有所帮助，这些活动从你输入的文本文件开始，到生成可执行程序结束。在这个阶段，只需要有一个粗略的想法即可。特别是，了解错误是在解析（parsing）期间产生的，还是你的程序解析正确但问题在后续阶段出现，是有用的。\n\
    \n**术语：解析（Parsing）**\n\n程序文本的*解析*是构建程序结构化表示（一个*抽象语法树*）的过程。这涉及到将文本分成块，如关键字、名称和操作符（*词法分析/lexing*），然后检查这些块是否以语言定义要求的方式组合在一起。\n\
    \n如果你收到的错误信息告诉你在解析程序时出现问题，你就不需要检查更复杂的问题，例如你是否为函数提供了正确类型的参数；你的错误将是更基础的，即你的文本以某种方式未能匹配语言定义的模式。（这个描述不可避免地有些模糊，因为我们不会详细讨论解析的具体作用。）\n\
    \n多个错误信息源于同一个错误是常见的现象：不要假设七条错误信息意味着七个独立的错误！几乎总是，第一个错误信息是最有用的。\n\n**故事**\n\nDmitri\
    \ 开始做一个 Java 练习。遵循第 3 章的建议，他在第一次编译之前只写了几行代码：只是类的外层封装和它的 main 函数，还没有任何功能。\n\n**Java\
    \ 示例（不要这样做！）**\n\n```java\npublic class ExerciseOne {\n    public static void\
