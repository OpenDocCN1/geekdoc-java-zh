- md: "\n##10 How to Improve Your Program\n\n**Java example (after one refactoring\
    \ step)**\n\n```java\nif (noItems > 10) {\n    basketKind = \"big\";\n} else if\
    \ (noItems > 5) {\n    basketKind = \"medium\";\n} else {\n    basketKind = \"\
    small\";\n}\n\nsorted = 1;\n```\n\nThe second version looks neater and is shorter\
    \ – but that isn’t really the point. The point is that it no longer contains the\
    \ same line of code several times. Now if we decide to change the name or type\
    \ of the variable sorted, we only have to change it in one place, not several.\
    \ That’s quicker and easier, and, even more importantly, we’re more likely to\
    \ get it right. Bugs that are introduced by changing one copy of some duplicated\
    \ code but not another copy are a real pain, and we can avoid them by avoiding\
    \ duplicating code.\n\n**Tip**\n\nA word of warning: while eliminating duplicate\
    \ code is often useful, you should be cautious if you find yourself getting too\
    \ proud of how short your program is. In many cases, a shorter program can be\
    \ *less* maintainable than a longer one, because it can be harder to understand,\
    \ and dependencies between its parts may be more intricate.\n\nConsider the following\
    \ example of a solution to the Fizz Buzz problem, in Haskell. It is the shortest\
    \ we have seen yet – but you will have to be quite a Haskell wizard to understand\
    \ how it works, and even so, how long does it take you?\n\n**Haskell example**\n\
    \n```haskell\nmain :: IO ()\nmain = h (zipWith3 g (f 3 \"Fizz\") (f 5 \"Buzz\"\
    ) [1..100])\nwhere\n  f n s = cycle (replicate (n-1) \"\" ++ [s])\n  g s t n =\
    \ head (filter (not . null) [s ++ t, show n])\n  h = putStr . unlines\n```\n\n\
    Now, how about this, only slightly longer, version?\n\n**Haskell example**\n\n\
    ```haskell\nsay :: Integer -> String\nsay i | (i `mod` 3 == 0) && (i `mod` 5 ==\
    \ 0) = \"FizzBuzz\"\n      | i `mod` 3 == 0 = \"Fizz\"\n      | i `mod` 5 == 0\
    \ = \"Buzz\"\n      | otherwise = show i\n\nmain :: IO()\nmain = putStr $ unlines\
    \ $ map say [1..100]\n```\n\nEven if you are not learning Haskell, you can see\
    \ how the structure of the second version matches the structure of the problem.\
    \ The function say computes the string that should result from a single integer;\
    \ then these results are put together in main.\n\n**Magic constants**\n\nA *magic\
    \ constant* is a literal value that occurs in your program. Examples include 3,\
    \ 5, “Fizz” and “Buzz” in our Fizz Buzz programs, and the special threshold values\
    \ 5 and 10 for noItems in the Java example we just saw.\n\nIt is often – but not\
    \ always! – better to replace these literal values by named constants, which are\
    \ assigned values elsewhere in the program. Our Java example might become\n\n\
    **Java example (after two refactoring steps)**\n\n```java\nif (noItems > LARGE_NUMBER_OF_ITEMS)\
    \ {\n    basketKind = \"big\";\n} else if (noItems > MEDIUM_NUMBER_OF_ITEMS) {\n\
    \    basketKind = \"medium\";\n} else {\n    basketKind = \"small\";\n}\n\nsorted\
    \ = 1;\n```\n\nThis is arguably clearer, but it is less self-contained: to understand\
    \ it fully, you have to look up the values of those constants. Here are some factors\
    \ to bear in mind as you think about the costs and benefits of replacing a literal\
    \ value by a named constant.\n\n- How often is the literal value used (for exactly\
    \ the same purpose, so that changing one instance of it would definitely require\
    \ changing all of them) in the program? The more often it is used – especially\
    \ if the uses are widely spread in the program – the more you will gain from using\
    \ a named constant instead; you will be reducing the risk that someone accidentally\
    \ changes some but not all of the instances.\n- How likely is it that the literal\
    \ value will have to be changed? The more likely it is, the more you might gain\
    \ by using a named constant, whose value could be changed just once, where it\
    \ is defined. On the other extreme, most programs will use the literal value 0\
    \ in roles where it will definitely never change; there is nothing to be gained\
    \ from replacing these uses by a named constant.\n- Can you give the constant\
    \ a name which will explain why this literal value is used? If so, using a named\
    \ constant may make the code easier to understand. For example, DAYS_IN_WEEK might\
    \ sometimes give more readable code than 7.\n- Can you give the constant a name\
    \ which will minimise copying errors? For example, rather than repeatedly using\
    \ 3.1415926535, using the named constant PI saves programmers from typos and from\
    \ using inconsistent precision.\n\nDo not mechanically use a named constant to\
    \ replace every literal value in your program: do so only when the benefit is\
    \ worth the cost.\n\n### 10.1.2 Choice of Abstraction\n\nSoftware design is largely\
    \ about choosing a good *structure* for your program. For example, you might introduce\
    \ a subroutine, which you call multiple times, to avoid duplicating code. *Abstraction*\
    \ is more than this, though. Choosing a set of abstractions is about providing\
    \ a conceptual way in to your program: you identify certain things that the reader\
    \ should focus on, and you choose those things carefully to be the things they\
    \ need to know about, and need to use, in order to understand the program and\
    \ make foreseeable changes to it. The collection of names in your program should\
    \ constitute a usable vocabulary for talking about what the program does in the\
    \ world.\n\nFor example, it can be useful to separate some lines of code off into\
    \ a new function. This can be worthwhile even if that function will be called\
    \ only once, if you can give the function a good name that explains what it does.\
    \ The reason is that if you, or someone else, come along later looking for a bug\
    \ in the code, you may be able to avoid looking at those lines of code, if you’re\
    \ confident that the problem is nothing to do with that aspect of what the program\
    \ does. You’re saying something like: the reader needs to know that there is a\
    \ function called this, but they probably don’t need to look at the details of\
    \ what it does: they can simply assume that the name is a reasonable description.\n\
    \nSuppose at some early stage of doing an exercise, you have this code:\n\n**Python\
    \ example (before refactoring)**\n\n```python\ndef total(basket, country):\n \
    \   total = 0\n    for item in basket:\n        total += price(item)\n    if total\
    \ > 10: #free shipping offer\n        return total\n    if country == \"UK\" and\
    \ weight(basket) <= 1:\n        total += STANDARD_UK_SHIPPING\n    else:\n   \
    \     raise NotImplementedError\n    return total\n```\n\nThe program isn’t finished,\
    \ as we see from the NotImplementedError: it raises an exception when circumstances\
    \ arise that it cannot yet deal with. However, it is already getting to be a bit\
    \ of a mess. Perhaps before you go on to handle the other cases, you might refactor\
    \ the program into:\n\n**Python example (after refactoring)**\n\n```python\ndef\
    \ total(basket, country):\n    total = basket_total(basket)\n    if total > 10:\
