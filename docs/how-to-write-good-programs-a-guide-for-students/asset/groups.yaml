- md: "\n## 9.6 After Removing the Bug\n\ninstead of expecting perfection from it,\
    \ try to establish habits that will support you in writing correct code.\n\nCuriously,\
    \ simply knowing that you sometimes introduce a certain kind of bug will help\
    \ you to avoid doing so. At least subconsciously, you will have a mental inventory\
    \ of things to look out for, when you scan a chunk of code to check it’s what\
    \ you intended, or when something isn’t working as you expect. Your checking may\
    \ be more reliable if you make this inventory explicit in the form of a checklist.\
    \ It might include, for example:\n\n- Are all names that appear in the specification\
    \ exactly correct?\n- Are all loop bounds correct?\n- Are array sizes correct?\n\
    - Are all array indexes correct?\n- Do I check for errors, or handle exceptions,\
    \ arising from code I call?\n- Do I have any null pointer errors (dereferencing\
    \ things that might be null)?\n- Do loops and recursions always terminate as they\
    \ should?\n- …\n\n**Tip**\n\nConsider keeping such a checklist, and each time\
    \ you remove a bug, think about whether there is something you should add to the\
    \ list.\n\nSometimes you may be able to adopt a coding habit that will help you\
    \ to avoid certain kinds of bugs. Let us consider some common bugs and how to\
    \ avoid them, in more detail.\n\n**Avoiding Non-termination** If your language\
    \ offers you a choice of for loops and while loops, you should usually prefer\
    \ for loops. This may seem counter-intuitive, as while loops are at least as powerful:\
    \ it is always possible to rewrite code that uses a for loop so that it uses a\
    \ while loop instead². However, a common bug is *accidental non-termination*:\
    \ when a loop, that should be executed only a finite number of times, is repeated\
    \ for ever. In practice you are more likely to introduce this bug into a while\
    \ loop than into the equivalent for loop. Why is this? It is because the syntax\
    \ of the for loop explicitly shows the loop variable, which is changed each time\
    \ you go round the loop, and the finite set it runs over. For example:\n\n**Python\
    \ example**\n```python\nfor i in range(0, 5):\n    # do some things...\n    #\
    \ i is never changed inside the loop\n```\n\nBy contrast, in a while loop you\
    \ have to manage the change yourself in code that is inside the loop. Here is\
    \ the while equivalent of the for loop above:\n\n**Python example**\n```python\n\
    i = 0\nwhile (i < 5):\n    # do some things...\n    i += 1\n```\n\nwhile loops\
    \ are convenient when, at the time of entering the loop, it is not possible to\
    \ know – to write an expression for – how many times the loop should be iterated.\
    \ For example, here is some code that finds the highest power of 2 that divides\
    \ an integer, composite:\n\n**Python example**\n```python\nn = composite\npower\
    \ = 0\nwhile (n % 2 == 0):\n    power += 1\n    n /= 2\nprint(\"2 to the power\"\
    , power, \"divides\", composite)\n```\n\nThis extra flexibility can be very useful,\
    \ but if you don’t need it, then it is just an opportunity to forget to change\
    \ your loop variable.\n\n**Tip**\n\nUse for unless there is a good reason why\
    \ you need the flexibility of while.\n\nA habit that may prevent you from accidentally\
    \ writing non-terminating while loops is to document *why* the loop should terminate,\
    \ in a comment. What you write does not have to be super-formal to be valuable.\
    \ In the last example, you might write “n halves until it is odd”.\n\nSimilar\
    \ considerations apply to recursive code: if you write code that may call itself,\
    \ and you expect it to terminate, you must think about how you know that it will.\
    \ Here is a Haskell equivalent of the last example:\n\n**Haskell example**\n```haskell\n\
    powerOf2In :: Integer -> Integer\npowerOf2In n | n `mod` 2 > 0 = 0\n| otherwise\
    \ = 1 + (powerOf2In (n `div` 2))\n```\n\nIn this recursive code, we explicitly\
    \ give the base case: that is, there is a line of code to say what happens when\
    \ we cannot divide n by 2 any more, because it is odd. This style may help you\
    \ to think about termination. It does not guarantee that your base case will ever\
    \ be reached, however – you still have to think about that!\n\n**Avoiding Null\
    \ Pointer Exceptions** When your code accepts a reference, there may be no alternative\
    \ to checking (e.g. using an isNull function) that it is not null, before you\
    \ *dereference* it – that is, use it to access what it points at. Occasionally,\
    \ though, you can avoid the risk of dereferencing it, using a trick such as this\
    \ one: when you want to compare a known object, such as a literal string, with\
    \ an object that might be null, call the equals method on the known object:\n\n\
    **Java example**\n```java\n// String s might be null\ns.equals(\"foo\"); // might\
    \ give NPE\n\"foo\".equals(s); // may look odd, but cannot give NPE\n```\n\nTo\
    \ help yourself and anyone else who writes code that interacts with yours, when\
    \ you write methods that return objects, document whether they might, or will\
    \ never, return null. As a matter of style, prefer to write methods that guarantee\
    \ not to return null when you have a choice. You might like to look up how to\
    \ use *annotations* such as @NotNull, which can also help.\n\n**Avoiding Off-by-one\
    \ Errors** These can occur in any programming language.\n\n**Terminology: Off-by-One\
    \ error**\n\nAn *off-by-one error* is a bug in the logic of a program, where some\
    \ numeric value differs, by one, from a correct value.\n\nA common cause is writing\
    \ < where you meant ≤ or similar, which is particularly often a problem in loop\
    \ bounds. Where you can, iterate over a collection, rather than using a loop variable\
    \ that you do not need. For example, in Java this:\n\n**Java example**\n```java\n\
    for (String s : args)\n{\n    // things that use s\n}\n```\nis safer than this:\n\
    \n```java\nfor (int i = 0; i < args.length; i++)\n{\n    String s = args[i];\n\
    \    // things that use s\n}\n```\nbecause if there is no integer i in the code\
    \ you cannot do the wrong thing with it! As with the discussion of for versus\
    \ while loops, the safer version is less flexible; sometimes you will need access\
    \ to an explicit loop variable. Make a habit, though, of using the safer version\
    \ unless you need the flexibility.\n\nOff-by-one errors can also arise when you\
    \ index into arrays or lists. In many languages the first element of an array\
    \ is at index 0, not index 1, which can take a while to get used to after a lifetime\
    \ of counting from 1!\n\n**Avoiding Accidental Assignment** Finally let us return\
    \ to the =/== problem which we considered earlier. Here’s a trick that some people\
    \ like. When you want to compare things, it’ll often be the case that one of them\
    \ is a thing you can assign to, and one of them isn’t. For example, in Java you\
    \ might write\n\nx = 0\n\nbut you can’t write\n\n0 = x\n\nbecause 0 is a constant.\
    \ You can use this fact to your advantage, by making a habit of writing constants\
    \ on the left-hand of comparisons. If you miss out one of the equals signs in\n\
    \nx == 0\n\nyou will get code that makes sense, but does not do what you intended.\
    \ If, on the other hand, you accidentally miss out one of the equals signs in\n\
    \n0 == x\n\nthe compiler will point out your mistake, because 0 = x isn’t valid\
    \ code.\n\n² In Java, and many other languages, you can also always rewrite code\
    \ that uses a while loop to use a for loop instead, so the two kinds of loop are\
    \ formally interchangeable.\n"
  mdcn: "\n\n## 9.6 修复 Bug 之后\n\n与其期望代码完美，不如尝试建立能够帮助你编写正确代码的习惯。\n\n奇奇的是，仅仅知道自己有时会引入某种类型的\
    \ bug，就能帮助你避免引入它。至少在潜意识中，当你扫描一段代码以检查它是否符合你的预期，或者当某些功能运行不符合预期时，你心中会有一份需要注意的事项的清单。如果你能以检查清单（checklist）的形式将这份清单显式化，你的检查可能会更加可靠。例如，它可能包括：\n\
    \n- 规范中出现的所有名称是否完全正确？\n- 所有的循环边界是否正确？\n- 数组大小是否正确？\n- 所有的数组索引是否正确？\n- 我是否检查了所调用的代码产生的错误，或处理了异常？\n\
    - 我是否有空指针错误（解引用了可能为空的内容）？\n- 循环和递归是否总是能如预期般终止？\n- …\n\n**提示**\n\n考虑维护这样一份清单，并且每当你修复一个\
    \ bug 时，思考一下是否应该向列表中添加新内容。\n\n有时，你可能养成某种编码习惯，帮助你避免某些类型的 bug。让我们详细考虑一些常见的 bug 以及如何避免它们。\n\
    \n**避免非终止** 如果你使用的语言提供了 `for` 循环和 `while` 循环的选择，你通常应该优先选择 `for` 循环。这看起来可能违背直觉，因为\
    \ `while` 循环至少同样强大：始终可以将使用 `for` 循环的代码重写为使用 `while` 循环²然而，一种常见的 bug 是*意外非终止*：当一个本应该执行有限次数的循环无限持续下去。在实践中，你在\
    \ `while` 循环中引入这种 bug 的概率比在等效的 `for` 循环中。为什么呢？因为 `for` 循环的语法显式显示了循环变量（每次循环时都会改变）以及它运行的有限集合。例如：\n\
    \n**Python 示例**\n```python\nfor i in range(0, 5):\n    # do some things...\n \
    \   # i 在循环内部永远不会改变\n```\n\n相比之下，在 `while` 循环中，你必须在循环内部的代码中手动管理变化。以下是上述 `for`\
    \ 循环的等 `while` 写法：\n\n**Python 示例**\n```python\ni = 0\nwhile (i < 5):\n    # do\
    \ some things...\n    i += 1\n```\n\n当在进入循环时无法确定（即写出一个表达式）循环应该迭代多少次时，`while` 循环非常方便。例如，这里有一段寻找整除一个整数的最高\
    \ 2 幂的代码，它是复杂的：\n\n**Python 示例**\n```python\nn = composite\npower = 0\nwhile (n\
    \ % 2 == 0):\n    power += 1\n    n /= 2\nprint(\"2 to the power\", power, \"\
    divides\", composite)\n```\n\n这种额外的灵活性可能非常有用，但如果你不需要它，它就变成了一个忘记改变循环变量的机会。\n\n\
    **提示**\n\n除非有充分的理由需要 `while` 的灵活性，否则请使用 `for`。\n\n一种可以防止你意外写出非终止 `while` 循环的习惯，是在注释中记录循环*为什么*应该终止。你写的内容不一定非常正式也能很有价值。在最后一个例子中，你可能会写“n\
    \ 不断减半直到它变成奇数”。\n\n类似的考虑也适用于递归代码：如果你编写了可能会调用自身的代码，并且你期望它会终止，你必须思考你是如何知道它会终止的。这里是最后一个例子的\
    \ Haskell 等写法：\n\n**Haskell 示例**\n```haskell\npowerOf2In :: Integer -> Integer\n\
    powerOf2In n | n `mod` 2 > 0 = 0\n| otherwise = 1 + (powerOf2In (n `div` 2))\n\
    ```\n\n在这个递归代码中，我们显式给出了基础情况（base case）：即有一行代码说明当我们无法再将 n 除以 2（因为它是奇数）时发生什么。这种风格可能帮助你思考终止问题。然而，它并不保证你的基础情况会被触发——你仍然必须考虑到！\n\
    \n**避免空指针异常** 当你的代码接收一个引用时，在*解引用*它（即使用它来访问它指向的内容）之前，可能没有办法检查它是否不空（例如使用 `isNull`\
    \ 函数）。不过，偶尔你可以使用像下面这样的小技巧来规避解引它的风险：当你想要将一个已知对象（例如字面量字符串）与一个可能为空的对象进行比较时，对已知对象调用\
    \ `equals` 方法：\n\n**Java 示例**\n```java\n// String s might be null\ns.equals(\"\
    foo\"); // 可能导致 NPE\n\"foo\".equals(s); // 看起来很奇怪，但不会导致 NPE\n```\n\n为了帮助你自己以及任何编写与你的代码交互代码的人员，当你编写返回对象的方法时，请记录它们可能返回或永远不会返回\
    \ `null`。从风格上来说，在你有选择的情况下，优先编写保证不返回 `null` 的方法。你可能想查查如何使用*注解*（annotations），如 `@NotNull`，这也有帮助。\n\
    \n**避免差一错误（Off-by-one Errors）** 这些错误可能发生在任何编程语言中。\n\n**术语：差一错误 (Off-by-One error)**\n\
    \n*差一错误*是程序逻辑中的一种 bug，其中某些数值与正确值相差了 1。\n\n一种常见原因是把 `<` 写成了 `<=` 或类似的符号，这在循环边界问题中尤为常见。在可能的情况下，直接遍历集合，而不是使用你不需要的循环变量。例如，在\
    \ Java 中，这种：\n\n**Java 示例**\n```java\nfor (String s : args)\n{\n    // things\
    \ that use s\n}\n```\n\n比这种：\n\n```java\nfor (int i = 0; i < args.length; i++)\n\
    {\n    String s = args[i];\n    // things that use s\n}\n```更安全，因为代码中没有整数 `i`，你就无法用它做错！与\
    \ `for` 和 `while` 循环的讨论一样，安全的版本活性较低；有时你确实需要显式的循环变量。尽管如此，养成使用安全的版本的习惯。\n\n差一错误也发生在访问数组或列表时。在许多语言中，数组的第一个索引是\
    \ 0 而不是 1，这对于从小从 1 开始计数的人来说需要时间适应！\n\n**避免意外赋值** 最后，让我们回到之前考虑过的 `=` 和 `==` 问题。这里有一些人喜欢的技巧。当你想要比较事物时，通常是其中一个是可以赋值的，而另一个不是。例如，在\
    \ Java 中你可能会写\n\nx = 0\n\n但你不能写\n\n0 = x\n\n因为 0 是常量。你可以利用这一事实来让自己处于优势，即养成将常量写在比较左侧的习惯。如果你在\
    \ `x == 0` 中漏掉了一个等号，你得到的是逻辑通顺但不符合你预期的代码。相反，如果你不小心在 `0 == x` 中漏掉了一个等号，编译器会指出你的错误，因为\
    \ `0 = x` 不是有效的代码。\n\n² 在 Java 以及许多其他语言中，你始终可以将使用 `while` 循环的代码重写为使用 `for` 循环，因此两种循环在形式上是互换的。\n\
    \n"
