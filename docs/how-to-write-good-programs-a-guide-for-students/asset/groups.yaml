    testing, debugging and improving your program. In the rest of this

    chapter, we will discuss the ways in which tools can support the

    basic*writing* of a program. On the way, we will discuss the factors

    that may guide you in choosing a tool.


    ## 5.1 Using the Most Basic Tools


    Until now, we have assumed you are using a text editor to write

    your program, and then compiling and running the program from

    the operating system’s command line. This has the advantage that

    it makes it easy to understand which tool does what task – by con-rast, the more
    sophisticated tools can sometimes be mystifying.

    It is a good idea to be*able* to write, compile, test and run your

    program using nothing more complex than a plain text editor –

    a*dumb editor*, one that does not have any special features for

    supporting programming – and a command line, even if you don’t

    choose to work that way day-to-day.


    Powerful, extensible text editors, such as Emacs and Atom, often

    have extensions to let them support programming in various lan-guages. For example,
    in Emacs you should edit a Python program

    using the editor in*python mode*, and provided that you use the

    standard extension .py for your Python files, you will probably find

    that the editor enters this mode automatically. The most obvious

    thing you will notice is that you get automatic*syntax highlighting*,

    which gives a visual difference between, for example, keywords in

    the language, such as if, and variable names that you chose.

    Note that, even though the visual effects can look similar to what you

    might produce in a word processor, here the editor*computes* what

    effects to use where. No instructions about these visual effects are

    stored in the program file, which is still just plain text that you can

    open in any text editor.


    Editor modes, which can be quite simple or very powerful, are

    easier for people to write than specialist development tools, so

    they are typically available even for less common programming

    languages. Moreover, some people prefer being able to run their

    whole lives from one program. I, for example, use Emacs for

    managing my mail, writing my papers, organising my files, and

    most of my day-to-day programming – though for Java, I find it

    worthwhile to switch out of Emacs to a specialist IDE.


    ## 5.2 What Is an IDE?


    In Chapter 3 we introduced the term*integrated development

    *environment* as “an application that supports the whole process of

    developing a program”. This is a bit vague, and indeed, IDEs differ

    in their capabilities. You may expect an IDE to support at least

    writing, compiling (if that’s relevant to your language), running,

    testing (Chapter 7), and debugging (Chapter 9) your program.

    Typically the IDE presents you with a graphical front-end,

    behind which are the same tools you could use from the command

    line: for example, the IDE might have a menu item for testing

    your program, which, behind the scenes, invokes a testing tool

    you could also choose to invoke directly. However, there are a

    number of benefits to the integration of many individual tools in

    one application.


    - They can be presented to you in a consistent, easy-to-use way; you can invoke
    them from menus instead of having to remember

    individual tool names. Good interface design can also make it

    easy for you to discover capabilities by exploring the interface.

    - The IDE can keep track of your workflow – for example, if you

    try to run a program which you have edited since you last saved

    it, the IDE will probably ask you whether you want to save your

    work first.

    - The IDE can provide you with intelligent links between the

    output of one tool and what you are likely to want to do next.

    For example, if compiling your program reveals that there is an

    error on line 13, clicking on the error message may position the

    IDE’s editor at line 13.

    - The IDE will have a notion of*project*: that is, of a collection of

    files that go to make up a complete program. To begin with, your

    programs may just be single files, and the notion of project will

    not seem useful. Later, though, a project might include multiple

    files of code, tests, some resources that the program needs at run-time (such
    as images for use in the program’s user interface),

    a record of what external libraries the program needs, a*build*

    *file* which specifies dependencies between the files and how they

    are combined into running software, etc. The IDE’s ability to

    help manage these files and their dependencies can then be very

    helpful.


    You can simply use an IDE as a text editor, and then compile

    and run your program using menu items.


    **Tip**


    Make sure you know the keyboard shortcut for saving your

    program, so that you don’t have to go to a menu every time.

    More generally, think about how to use the tool in a way which

    is efficient and comfortable for you. Programming, especially for

    many hours a day, can lead to repetitive strain injury (RSI); simple

    steps like knowing the keyboard shortcuts, for the things you do

    most often, can help a lot.


    Here are some of the most useful capabilities that an IDE will

    probably offer you, besides basic editing.


    **Offering Constructive Criticism** You may find that the way the IDE

    points out mistakes you have made in your program is more helpful

    than the way the compiler or interpreter does so: for one thing, it

    will at least try to give you a visual indication of where in your

    program the error is.


    For example, if you edit Java code using Eclipse, and you make

    a syntax error, you will see a red cross in the left margin and a red

    squiggly line under part of your code. (Eclipse actually compiles

    your code*incrementally*, which is why it can show you errors almost

    immediately after you make them.)


    I recommend that whenever you see such an error indicator, you

    fix the problem immediately. Under no circumstances should you

    use the IDE’s settings to turn off the error indicators, as one student

    I encountered did: the errors are still there, even if you make the red

    marks go away!


    The tool may offer*quick fixes*: that is, if you hover over or click

    on an error indicator, there may be a menu of changes that may fix

    the error, which the tool can then apply automatically. These are

    worth considering, although the tool is not all that intelligent, and

    the right thing to do may not be one of the suggestions.


    **Keeping Your Work Neat** A capability the IDE will offer, that

    beginners often under-value, is to help lay out your code consis-tistently. You
    will probably find that you can select a region of code

    and choose a menu item called something like Format, to make

    lines of code line up where they should, and so on. We will discuss

    this, and why it is important, in Chapter 8. The very short version

    is that it makes your code easier to read, and makes you more likely

    to notice when what you wrote is not what you intended.


    **Saving You Typing** More of a mixed blessing is the IDE’s ability

    to save you typing parts of your code, for example by auto-completing

    long function names, or by telling you what pieces of syntax make

    sense to put next in a given context.


    **Terminology: Autocompletion**


    *Autocompletion* – sometimes called*code completion* or*content*

    *assist* – is when the IDE saves you typing. For example, if

    you have typed enough of a function name that there is only one

    function you could mean, the IDE may be able to insert the rest.

    Or, it may pop up a menu for you to choose between possible

    functions. Try hitting the TAB key, or Ctrl and the space bar

    together, and see if anything happens. Searching

    autocomplete your IDE*

    will give you fuller information about what’s available.


    ## 5.3 Looking Forward


    To begin with, you may be content to use just the most basic

    features of a tool that has been recommended to you. It is common,

    however, to find that an IDE you have been using for years has

    features that would have been fantastically useful to you, if only

    had knew they existed. For example, IDEs often integrate with

    various build systems, with version control systems (Chapter 6),

    and with public repositories like GitHub. When you have time, see

    if the tool has a tutorial, perhaps accessible via a Help menu, that

    may tell you about such things.


    Once you’re feeling quite confident with programming, experi-

    menting with different IDEs can be worthwhile; you may well find

    one you prefer to the one your programming course told you to

    use, either because it has extra features that you value, or because

    you find it more usable. Try searching

    best ide your language*

    and browsing reviews, to decide what to try. Some common IDEs

