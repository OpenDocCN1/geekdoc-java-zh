    70


    7 How to Test Your Program


    **List of tests**


    1. greeter Rahul outputs Hello Rahul


    2. greeter sue outputs Hello sue


    3. greeter Jane Smith outputs Hello Jane


    4.* . . .*


    Now, systematically testing your program consists of going


    down the list and running your program once for each test, giving


    the appropriate context and checking for correct results.


    As you write the tests, you will probably find yourself mentally


    formulating a concise description of what the program does. The


    third test in the panel shows that our initial description of the


    program was not fully detailed: assuming we got that test correct,


    when we give the greeter program the argument Jane Smith it


    is supposed to print Hello Jane, not Hello Jane Smith. This


    is the kind of detail you will need to be very careful about. After


    clarifying that, we might have a more precise specification, such


    as “the program outputs “Hello” followed by the first word of the


    input, exactly as given”. A precise specification may be really useful


    if you have to change the program in future. Once you’ve gone to


    the trouble of getting it clear in your head, consider putting it into


    your program as a comment. In this case, the comment has the


    effect of telling anyone reading your code that it is deliberate that


    it only prints the first word of the argument.


    **Tip**


    Any time you do write down your program’s specification, be


    sure to keep it up to date, if the intended behaviour of the


    program changes later!'
- md: "\n## 7.2 Basic Automated Testing\n\n71\n\nEven if your program is capable of\
    \ taking several inputs without restarting, for example using a loop, do start\
    \ your program afresh for each test. Otherwise there may be some state that is\
    \ set up by one test and then used in another. If you want to test how your program\
    \ behaves when it’s given several inputs in one run, that’s a separate test.\n\
    \n## 7.2 Basic Automated Testing\n\nRunning your program by hand for each test,\
    \ and comparing the results with what you expect by eye each time, gets tedious\
    \ very fast. The next step is to get the computer to do some of the tedious bits.\n\
    \nThere are different ways to do this, and you won’t want to go far along this\
    \ route before moving to using a proper testing framework (which we will discuss\
    \ in Section 7.3 below), otherwise, you’ll find yourself writing your own testing\
    \ framework. Still, it can be a good way to get started.\n\nThe first thing you\
    \ need is an automatic way to run exactly the code you want to test. That’s easiest\
    \ if it’s simply a function. Then what a test has to do is to call your function,\
    \ with some arguments if appropriate, compare what the function returns with what\
    \ it should return, and complain if the two are different. Here is a classic way\
    \ to do that in Python. The function we are testing is called greeter. Its source\
    \ is not shown below, but it takes one string argument. Each test is just a function.\
    \ `test_greeter_one_word` invokes the greeter function with the argument “Jane”,\
    \ and asserts that the result should be “Hello Jane”. Many languages have a built-in\
    \ assert statement (or function) that works like this: it can be very useful.\
    \ Python’s `assert` takes an extra argument which is a string to be printed if\
    \ the test fails.\n\n72 7 How to Test Your Program\n\n**Python example**\n\n```python\n\
    def test_greeter_one_word():\n    assert greeter(\"Jane\") == \"Hello Jane\",\
    \ \\\n        \"Should be Hello Jane\"\n\ndef test_greeter_two_words():\n    assert\
    \ greeter(\"Jane Smith\") == \"Hello Jane\", \\\n        \"Should be Hello Jane\"\
    \n\nif __name__ == \"__main__\":\n    test_greeter_one_word()\n    test_greeter_two_words()\n\
    \    print(\"Tests passed\")\n```\n\nThings get only slightly more complicated\
    \ when you want to test functions which are methods of a class. Let us look at\
    \ the use of a “testing main” in Java. Your first few programs in Java may well\
    \ have all their code inside a main method, like this:\n\n**Java example**\n\n\
    ```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nIf, however,\
    \ you’ve gone to the next stage and written a class with some actual behaviour\
    \ – e.g. some instance methods – you can use the main method to create an instance\
    \ of the class and try out the methods. For example:\n\n73 7.2 Basic Automated\
    \ Testing\n\n**Java example**\n\n```java\npublic class SomeClass {\n    // constructor\
    \ and various methods...\n    public static void main(String[] args) {\n     \
    \   SomeClass objectToTest = new SomeClass();\n        int result1 = objectToTest.firstMethod();\n\
    \        if (result1 != 42) {\n            // print that something went wrong\n\
    \        }\n        // and so on\n    }\n}\n```\n\nIf you wrote several classes,\
    \ you can even give each of them its own testing main.\n\nThe testing main was\
    \ useful for testing methods within your program, but it did not let you see the\
    \ behaviour of your program as a whole – if you’re using the main method for testing,\
    \ you’re not using it for its intended purpose of starting the whole program running.\
    \ We might say, a testing main is more useful for unit testing than for system\
    \ testing.\n\n**Terminology: Unit test**\n\nA *unit test* tests some particular\
    \ unit of a program – e.g. a class – using a well-defined interface to that unit.\
    \ It checks that that unit, considered in isolation from the rest of the program,\
    \ meets its specification.\n\n74 7 How to Test Your Program\n\n**Terminology:\
    \ System test**\n\nA *system test* tests a whole system, using the same interface\
    \ that the system’s users will eventually use. It checks that the system as a\
    \ whole meets its specification.\n\nTo do system testing, we need to run the whole\
    \ program from the outside – invoke it as a user would, give it input as a user\
    \ would, and see whether the outputs and behaviour are what we expect. For simple\
    \ programs you can often do that by using another program to start yours, capturing\
    \ the output, and comparing the results. Scripting languages with good string\
    \ handling facilities, like Python or Perl, are good language choices for the\
    \ testing program. Just for fun, here’s an example of using a small program in\
    \ Perl to test a small program that’s written in Python.\n\n**Perl example**\n\
    \n```perl\n$argument = 'Jane';\n$expected = 'Hello Jane';\nchomp($result = `python\
    \ greeter.py $argument`);\n($result eq $expected)\nor die \"Got $result, expected\
    \ $expected\";\nprint \"Test passed\";\n```\n\nHere the expression in backticks\
    \ `...` invokes the Python program, with the argument we’re testing it on, chomp\
    \ just removes the newline that the result is saved in, and complain if the two\
    \ are different.\n\n84 7.3 Proper Testing\n\n75 7 How to Test Your Program\n\n\
    Things get only slightly more complicated when you want to test functions which\
    \ are methods of a class. Let us look at the use of a “testing main” in Java.\
    \ Your first few programs in Java may well have all their code inside a main method,\
    \ like this:\n\n**Java example**\n\n```java\npublic class HelloWorld {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Hello, World!\"\
    );\n    }\n}\n```\n\nIf, however, you’ve gone to the next stage and written a\
    \ class with some actual behaviour – e.g. some instance methods – you can use\
    \ the main method to create an instance of the class and try out the methods.\
    \ For example:\n\n**Java example**\n\n```java\npublic class SomeClass {\n    //\
    \ constructor and various methods...\n    public static void main(String[] args)\
    \ {\n        SomeClass objectToTest = new SomeClass();\n        int result1 =\
    \ objectToTest.firstMethod();\n        if (result1 != 42) {\n            // print\
    \ that something went wrong\n        }\n        // and so on\n    }\n}\n```\n\n\
    If you wrote several classes, you can even give each of them its own testing main.\n\
    \nThe testing main was useful for testing methods within your program, but it\
    \ did not let you see the behaviour of your program as a whole – if you’re using\
    \ the main method for testing, you’re not using it for its intended purpose of\
    \ starting the whole program running. We might say, a testing main is more useful\
    \ for unit testing than for system testing.\n\n**Terminology: Unit test**\n\n\
    A *unit test* tests some particular unit of a program – e.g. a class – using a\
    \ well-defined interface to that unit. It checks that that unit, considered in\
    \ isolation from the rest of the program, meets its specification.\n\n**Terminology:\
    \ System test**\n\nA *system test* tests a whole system, using the same interface\
    \ that the system’s users will eventually use. It checks that the system as a\
    \ whole meets its specification.\n\nTo do system testing, we need to run the whole\
    \ program from the outside – invoke it as a user would, give it input as a user\
    \ would, and see whether the outputs and behaviour are what we expect. For simple\
    \ programs you can often do that by using another program to start yours, capturing\
    \ the output, and comparing the results. Scripting languages with good string\
    \ handling facilities, like Python or Perl, are good language choices for the\
    \ testing program. Just for fun, here’s an example of using a small program in\
    \ Perl to test a small program that’s written in Python.\n\n**Perl example**\n\
    \n```perl\n$argument = 'Jane';\n$expected = 'Hello Jane';\nchomp($result = `python\
    \ greeter.py $argument`);\n($result eq $expected)\nor die \"Got $result, expected\
    \ $expected\";\nprint \"Test passed\";\n```\n\nHere the expression in backticks\
    \ `...` invokes the Python program, with the argument we’re testing it on, chomp\
    \ just removes the newline that the result is saved in, and complain if the two\
    \ are different.\n\n## 7.3 Proper Testing\n\nOnce upon a time, in fact until the\
    \ late 1990s, programmers used to develop their own code for managing tests. In\
    \ large organisations like the one I worked for in the early 1990s, there was\
    \ often some kind of testing framework – maintained “in house”, That meant at\
    \ least that we didn’t have to develop the same code again, every time we started\
    \ new project. Perhaps there were other testing frameworks available, but none\
    \ of them were famous, and as a young developer I didn’t come across them.\n\n\
    Then came JUnit, the first popular testing framework. JUnit supports unit testing\
    \ for Java; since what it does is really not rocket science, and it proved useful,\
    \ there are now versions for many popular languages (and some unpopular ones).\
    \ Try searching unit testing your language and see what comes up; if there’s a\
    \ thing called something described being for your language, it’ll probably be\
    \ similar to JUnit for Java. JUnit makes it easy to write unit tests for Java\
    \ programs, and then provides a framework for running the tests, which is incorporated\
    \ into most IDEs. You’ll typically get a simple graphical interface showing a\
    \ green bar if all your tests pass, and a red bar if some don’t, together with\
    \ a way to get to the test that failed and the code it failed on. Going into detail\
    \ here is beyond the scope of this book, but there are some good JUnit and it’s\
    \ well worth learning. Unfortunately, while using JUnit is simple, really understanding\
    \ how the JUnit framework works requires a more in-depth knowledge of Java than\
    \ you’ll get in an introductory course, so you may have to take some things on\
    \ trust.\n\n**Terminology: Framework**\n\nLike a library, a framework provides\
    \ functionality designed to be used in many other programs. The difference is\
    \ that using a framework exerts more control over the structure of your program\
    \ than using a library does. Rather than calling library functions when you choose,\
    \ you write functions (e.g. tests, in the case of JUnit) that the framework code\
    \ will call. This is the Hollywood Principle: “don’t call us, we’ll call you”.\n\
    \n1 One I like is www.vogella.com/tutorials/JUnit/article.html, or for a gentler\
    \ introduction, you might try www.tutorialspoint.com/junit/.\n"
  mdcn: "\n\n## 7.2 基础自动化测试\n\n71\n\n即使你的程序能够在不重新启动的情况下接受多次输入（例如使用循环），对于每个测试，也请从头启动你的程序。否则，可能会出现某些状态被一个测试设置，然后在另一个测试中使用的情况。如果你想测试程序在单次运行中接收多个输入时的行为，那是一个独立的测试。\n\
    \n## 7.2 基础自动化测试\n\n为每个测试都手动运行程序，并每次都肉眼对比结果与你的预期，这很快就会变得非常枯燥。下一步是让计算机来完成一些枯燥的工作。\n\
    \n实现这一目标有多种方法，在转向使用适当的测试框架之前，你可能不想深入研究这条路线（我们将在下文第 7.3 节讨论），否则，你会发现自己正在编写自己的测试框架。尽管如此，这也可以是一个很好的入门方法。\n\
    \n你首先需要的是一种自动的方法来运行你想要测试的代码。如果这只是一个函数，那就最简单了。这时测试需要做的就是调用你的函数（在适当的情况下传入一些参数），将函数的返回值与预期的返回值进行比较，如果两者不同则报错。这里是用\
    \ Python 实现这一点的点的经典方法。我们要测试的函数名为 `greeter`。它的源代码在此未显示，但它接受一个字符串参数。每个测试都只是一个函数。`test_greeter_one_word`\
    \ 用参数“Jane”调用 `greeter` 函数，并断言结果应该是“Hello Jane”。许多语言都有内置的 `assert` 断言语句（或函数），其工作原理如下：它非常有用。Python\
    \ 的 `assert` 接受一个额外的参数，这是一个在测试失败时要打印的字符串。\n\n72 7 如何测试你的程序\n\n**Python 示例**\n\n\
    ```python\ndef test_greeter_one_word():\n    assert greeter(\"Jane\") == \"Hello\
    \ Jane\", \\\n        \"Should be Hello Jane\"\n\ndef test_greeter_two_words():\n\
    \    assert greeter(\"Jane Smith\") == \"Hello Jane\", \\\n        \"Should be\
    \ Hello Jane\"\n\nif __name__ == \"__main__\":\n    test_greeter_one_word()\n\
    \    test_greeter_two_words()\n    print(\"Tests passed\")\n```\n\n当你想要测试类类的方法时，情况会变得稍微复杂一点。让我们看看\
    \ Java 中“测试主函数”（testing main）的使用。你在 Java 中的前几个程序可能所有代码都在一个 `main` 方法中，如下所示：\n\n\
    **Java 示例**\n\n```java\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n然而，如果你已经进入了下一阶段并编写了一个具有某些实际行为的类（例如某些实例方法），你可以使用\
    \ `main` 方法创建该类的实例并尝试这些方法。例如：\n\n73 7.2 基础自动化测试\n\n**Java 示例**\n\n```java\npublic\
    \ class SomeClass {\n    // 构造函数和各种方法...\n    public static void main(String[]\
    \ args) {\n        SomeClass objectToTest = new SomeClass();\n        int result1\
    \ = objectToTest.firstMethod();\n        if (result1 != 42) {\n            //\
    \ 打印发生了错误\n        }\n        // 等此类推\n    }\n}\n```\n\n如果你写了几个类，甚至可以为每个类提供它自己的测试主函数。\n\
    \n测试主函数对于测试程序内部的方法很有用，但它不能让你看到程序的整体行为——如果你使用 `main` 方法进行测试，你就没有按照它启动整个程序的预期目的使用它。我们可以说，测试主函数对于单元测试比对于系统测试更有用。\n\
    \n**术语：单元测试**\n\n*单元测试*（*unit test*）使用指向该单元的定义良好的接口来测试程序的某个特定单元——例如一个类。它检查该单元在与程序其余部分隔离（孤立考虑）时，是否符合其规格说明。\n\
    \n74 7 如何测试你的程序\n\n**术语：系统测试**\n\n*系统测试*（*system test*）使用系统用户最终将使用的相同接口来测试整个系统。它检查系统整体是否符合其规格说明。\n\
    \n要进行系统测试，我们需要从外部运行整个程序——像用户一样调用它，像用户一样给它输入，并查看输出和行为是否是我们的预期。对于简单的程序，你通常可以使用另一个程序来启动你的程序，捕获输出并比较结果。具有良好字符串处理能力的脚本语言（如\
    \ Python 或 Perl）是编写测试程序的良好语言选择。为了好玩，这里有一个使用 Perl 小程序测试用 Python 编写的小型程序的示例。\n\n\
    **Perl 示例**\n\n```perl\n$argument = 'Jane';\n$expected = 'Hello Jane';\nchomp($result\
    \ = `python greeter.py $argument`);\n($result eq $expected)\nor die \"Got $result,\
    \ expected $expected\";\nprint \"Test passed\";\n```\n\n在这里，反引号 `...` 中的表达式调用了\
    \ Python 程序，并带有我们对其测试的参数，`chomp` 只是移除结果保存时的换行符，如果两者不同则报错。\n\n84 7.3 正确的测试\n\n\
    75 7 如何测试你的程序\n\n当你想要测试类的方法时，情况会变得稍微复杂一点。让我们看看 Java 中“测试主函数”的使用。你在 Java 中的前几个程序可能所有代码都在一个\
    \ `main` 方法中，如下所示：\n\n**Java 示例**\n\n```java\npublic class HelloWorld {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Hello, World!\"\
    );\n    }\n}\n```\n\n然而，如果你已经进入了下一阶段并编写了一个具有某些实际行为的类（例如某些实例方法），你可以使用 `main` 方法创建该类的实例并尝试这些方法。例如：\n\
    \n73 7.2 基础自动化测试\n\n**Java 示例**\n\n```java\npublic class SomeClass {\n    // 构造函数和各种方法...\n\
    \    public static void main(String[] args) {\n        SomeClass objectToTest\
    \ = new SomeClass();\n        int result1 = objectToTest.firstMethod();\n    \
    \    if (result1 != 42) {\n            // 打印发生了错误\n        }\n        // 等此类推\n\
    \    }\n}\n```\n\n如果你写了几个类，甚至可以为每个类提供它自己的测试主函数。\n\n测试主函数对于测试程序内部的方法很有用，但它不能让你看到程序的整体行为——如果你使用\
    \ `main` 方法进行测试，你就没有按照它启动整个程序的预期目的使用它。我们可以说，测试主函数对于单元测试比对于系统测试更有用。\n\n**术语：单元测试**\n\
    \n*单元测试*（*unit test*）使用指向该单元的定义良好的接口来测试程序的某个特定单元——例如一个类。它检查该单元在与程序其余部分隔离（孤立考虑）时，是否符合其规格说明。\n\
    \n**术语：系统测试**\n\n*系统测试*（*system test*）使用系统用户最终将使用的相同接口来测试整个系统。它检查系统整体是否符合其规格说明。\n\
    \n要进行系统测试，我们需要从外部运行整个程序——像用户一样调用它，像用户一样给它输入，并查看输出和行为是否是我们的预期。对于简单的程序，你通常可以使用另一个程序来启动你的程序，捕获输出并比较结果。具有良好字符串处理能力的脚本语言（如\
    \ Python 或 Perl）是编写测试程序的良好语言选择。为了好玩，这里有一个使用 Perl 小程序测试用 Python 编写的小型程序的示例。\n\n\
    **Perl 示例**\n\n```perl\n$argument = 'Jane';\n$expected = 'Hello Jane';\nchomp($result\
    \ = `python greeter.py $argument`);\n($result eq $expected)\nor die \"Got $result,\
    \ expected $expected\";\nprint \"Test passed\";\n```\n\n在这里，反引号 `...` 中的表达式调用了\
    \ Python 程序，并带有我们对其测试的参数，`chomp` 只是移除结果保存时的换行符，如果两者不同则报错。\n\n## 7.3 正确的测试\n\n\
    在过去，，实际上直到 1990 年代末，程序员通常自己开发管理测试的代码。在 1990 年代初我工作的大型机构，通常会有某种内部维护的测试框架——这意味着至少我们每次启动新项目时不需要重复开发相同的代码。也许存在其他的测试框架，但没有一个是著名的，作为一个年轻的开发者我并没有遇到它们。\n\
    \n随后 JUnit 出现了，它是第一个流行的测试框架。JUnit 支持 Java 的单元测试；由于它所做的实际上并不复杂，而且被证明是有用的，现在有很多语言的版本（以及一些不流行的语言）。尝试搜索你语言的单元测试看看会出现什么；如果有一个被称为你语言的东西，它可能与\
    \ JUnit 类似。JUnit 让为 Java 程序编写单元测试变得简单，并提供了一个运行测试的框架，该框架集成在大多数 IDE 中。你通常会看到一个简单的图形界面，如果所有测试通过则显示绿色条，如果没有通过则显示红色条，并提供一种到达失败测试及其失败代码的方法。在这里详细介绍超出了本书的范围，但有很多很好的\
    \ JUnit 并且值得学习。遗憾的是，虽然使用 JUnit 很简单，但真正理解 JUnit 框架的工作原理需要比入门课程中学深入的 Java 知识，因此你可能需要对某些事情保持信任。\n\
    \n**术语：框架**\n\n与库一样，框架提供了设计供许多其他程序使用的功能。区别在于使用框架对程序结构的控制力比使用库更强。你不是在你选择时调用库函数，而是编写函数（在\
    \ JUnit 的例中是测试），框架代码会调用这些函数。这就是好莱坞原则：“不要叫我们，我们来叫你”。\n\n1 我喜欢的一个是 www.vogella.com/tutorials/JUnit/article.html，或者对于更温和的介绍，你可以尝试\
    \ www.tutorialspoint.com/junit/。\n\n"
