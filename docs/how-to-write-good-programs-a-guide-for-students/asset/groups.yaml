    **13.5**** What about Multiple Choice Exams?**


    Since programming exams where you actually write programs are quite tricky to
    mark, you may find you’re being examined by a multiple choice exam instead. The
    questions may be straightforward, examining the same kind of skills you’d use
    in another kind of exam. Or, they may be chosen to examine your knowledge of dark
    corners of the language. Don’t assume that because it’s multiple choice it’ll
    be easy: it’s possible to set arbitrarily difficult multiple choice exams! If
    you have past papers available, try one out. Find out what the exam’s policy is
    on wrong answers – are they penalised, in which case you shouldn’t guess, or not,
    in which case you might as well?


    **Tip**


    Try setting your own questions. Even better, do this with a group of friends,
    swap questions, and discuss the answers. You will gain insight both into what
    questions can be asked, and into what you do and don’t understand.


    ## 14 How to Choose a Programming Language


    If you’re a student – or, indeed, a teacher! – you will often have no choice about
    what programming language to use in a course you are committed to. By now, I hope
    you have some techniques for getting to grips with the prescribed language, whatever
    it is. What if you do have a choice of what language to use for a project, though,
    or a choice of what programming language to learn next? Many factors may influence
    your decision, from the nature of a program you want to write, to your own state
    of mind.


    ### 14.1 Questions to Consider


    **Are You Choosing Just for Yourself?** Or are you writing a program with someone
    else, or that someone else will have to maintain in future? You may have to take
    other people’s needs and preferences into account.


    **What Is the Task?** Each language is better for some tasks than others. Actually,
    though, this isn’t as big a factor as you might think. All the languages you are
    likely to consider are Turing complete, so you can, in principle, program anything
    you like in them. However, depending on the tools and libraries available, some
    may be more practical than others. If you can describe the general area of a relevant
    task (say “data analysis” or “VR game”) in a few words, you might search *programming
    language* your_task*" to get some ideas of languages to consider.


    **Terminology: Turing machine**


    In 1936, Alan Turing described a simple mathematical model of a computer, which
    we now call, in his honour, the *Turing machine*. The *Turing-computable functions*
    are the mathematical functions (the mappings from input to output) that can be
    expressed using such a machine. You might expect that your choice of programming
    language would have an important effect on which functions you could express.
    Remarkably, this turns out not to be so. Although programming languages differ
    in what can be *conveniently* expressed, modern programming languages do not have,
    in principle, any more expressive power than very old ones, or even than Turing
    machines. We call any language in which you can program all the Turing-computable
    functions *Turing complete*.


    **Which Language(s) Do You Know Already?** This factor can operate either way.
    You may prefer to use a language you’re already familiar with, even if it isn’t
    ideal for the task, so that you can focus on things other than the nitty gritty
    of how you make the machine do what you want. However, it can be more fun to use
    a language that’s new to you, and – especially early in your programming life
    – it may be positively sensible to take the opportunity to widen your range. Writing
    a program you want written is the best way to develop fluency in a language. It’ll
    take a bit longer than if you do it in a language you already know, of course,
    but you may learn more in the process.


    **How Long Will the Program Need to Last?** If it must last for many years, you
    may prefer to use a long-established language with a reputation for maintaining
    backwards compatibility, like Java, rather than a fast-moving language in which
    old programs often have to be changed if they are to work with the latest version
    of the language, like Haskell.¹ Note, though, that you don’t always know how long
    your program will last. If it turns out to be useful, it may last much longer
    than you expect!


    **Story**


    I once wrote a program that was intended to be used only for a few months. This
    was in the early 1990s, and, alongside colleagues at the company where I was working
    at the time, I had just been trained on what we needed to do to make sure that
    our code still worked after the year 2000 – that is, how to make it “Y2K compliant”.
    Just for fun, I made sure my code was Y2K compliant and added a comment that said
    so, even though there was no expectation it would still be in use in the year
    2000. Many years later, after I had left the company, I met someone who worked
    there, having arrived after I left. She knew my name because she had seen it in
    a program. You’ve guessed it – it was that program, which was still in use many
    years after I would have expected it to be retired.


    **Do You Plan to Distribute It?** If you want other people to be able to compile
    and/or run your program, you need pay attention to how easy it will be for them.
    What will they need in the way of compiler, run-time software, libraries, etc.,
    and how likely are they to have the necessary things installed already? Will you
    need to provide instructions? Are there other dependencies or constraints? For
    example, what are you assuming about what operating system these people will be
    using?


    **What Kind of Libraries or Components Will You Need?** E.g. does your program
    need a graphical user interface (GUI), or to use a database? Check that good,
    suitable software that interacts well with your language exists. For example,
    if you want your program to have a GUI, search *gui* your_language*" Be quite
    cautious: sometimes you may find that there is a library, but that it is out of
    date, poorly documented, or hard to use. Unless you are really looking for a challenge,
    you should look for evidence that plenty of other people currently use the software
    you are considering.


    **What Kind of Mistakes Are Most Important to Guard Against?** This question,
    and its implications, are harder to get a handle on than some of the others, but
    are worth thinking about. For example, if your program will manipulate complex
    data structures, you may find the security of static type-checking important.
    On the other hand, if your program will involve a frequently changing interaction
    at the command line and lots of file handling, it might be more important to you
    that your language has convenient operating system interaction and string manipulation
    features.


    ## 14.2 A Few Languages You May Encounter


    Here is a list of just a few languages, focusing on the ones you are most likely
    to need to learn for university study. Perhaps you might challenge yourself to
    learn a little of each? Any such list is bound to be incomplete and controversial,
    however. If you come across a language that interests you, do not be put off learning
    it by the fact that it is not included here!


    **C** C is a low-level language, in the sense that it is “close to the machine”:
    every computer has a C compiler. It may be a good choice if you want to understand
    how your program really works; for example, by learning about pointer arithmetic,
    you can


    ¹ Strictly speaking, Haskell – the official language – has been very stable; what
    changes often is the commonly used Glasgow Haskell Compiler.

