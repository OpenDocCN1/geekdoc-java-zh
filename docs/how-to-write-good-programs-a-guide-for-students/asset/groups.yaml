    ## 15.2 Specific Programming Languages


    You have probably been using an introductory book on your chosen programming language
    alongside this one. Most books treat their chosen language starting at the very
    basics, and include some material on how to write good programs in that specific
    language. There are so many of these books for each popular language that I’m
    not going to attempt to recommend specific ones. Indeed, because there are so
    many, you will usually find that you can indulge your own preferences for book
    style. Some people like short, terse books that explain each thing once. Others
    prefer discursive books that return to important topics and include lots of exercises.
    Browse, read reviews, ask for recommendations, and pick your favourite.


    There are fewer books that focus on how to become an excellent programmer in some
    language. One such is Joshua Bloch’s *Effective Java*. Once you have understood
    the basics of Java, this will be very useful.


    ## 15.3 Programming Generally


    There’s a plethora of books aimed at professional programmers, which may now be
    useful to you. Here are a few of my favourites.


    - *Clean Code: A Handbook of Agile Software Craftsmanship* by Robert C. Martin,
    known as “Uncle Bob”. Active as a consultant, he also has a lot of material online;
    have a search.

    - Andrew Hunt and David Thomas’s book *The Pragmatic Programmer* also includes
    lots of good stuff. Its subtitle “from journeyman to master” is a good indication
    of its target audience – you should already be a somewhat competent programmer
    to get much out of it – though it should be noted that it’s not only men who can
    master programming! I believe it was the first edition of this book that introduced
    the term “kata”, mentioned in Chapter 10, to programming.

    - Another popular book aimed at experienced programmers is Steve McConnell’s *Code
    Complete*.


    Rather different is the collection of chapters edited by Andy Oram and Greg Wilson,
    *Beautiful Code: Leading Programmers Explain How They Think*. The chapters take
    a variety of different approaches to the brief: you’ll certainly find some of
    them thought-provoking.


    Somewhat more algorithm-focused, though now dated, are Jon Bentley’s classic *Programming
    Pearls* and *More Programming Pearls*. You might enjoy Gayle McDowell’s *Cracking
    the Coding Interview* for its challenging small programming problems, even if
    you are not preparing for an interview.


    ## 15.4 Software Engineering


    “Software engineering” is the term we use for all the processes and skills that
    contribute to ensuring that we have software available that meets our needs. The
    term seems probably to have been coined by Margaret Hamilton, who led a team developing
    software for the Apollo 11 space mission, in the early 1960s. It was popularised
    by its use in the titles of the NATO Conferences on Software Engineering in 1968
    and 1969. The intention was to conjure up an idea of software being built in a
    systematic, reliable way, based on mathematics. The people building the software
    would be engineers, with the connotation that they would have undergone a certain
    kind of rigorous education, probably leading to a professional certificate. This
    was always more aspiration than reality – the very softness of software has always
    meant that people have built software without such an education. Nevertheless,
    we undoubtedly want well-engineered software, and an important step towards that
    is to understand how to write good programs, as discussed in this book and in
    those mentioned in the previous section.


    Going beyond programming, software engineering also involves many other activities.
    There are whole fields that study how you manage the requirements of a system,
    including reconciling the conflicts between what different people want; how you
    can be sure you have done enough testing to be confident that your system is correct;
    and especially, how you can design the system so that it will be possible to maintain
    its usefulness while the world around it changes. Change is the root of the difficulty
    of software engineering. We mentioned in Chapter 10 that you should try to place
    things that will change at the same time close together in your program. This
    idea has been raised to an art form in the field of design patterns; the classic
    book is the so-called Gang of Four book (Gamma et al., 1994).


    In order to think clearly about design, we need a way to represent the information
    that we need to focus on, while leaving out all the other information about the
    system which is irrelevant right. For example, while thinking about the design
    structure of an object-oriented system, we might use a diagram that shows the
    classes in a system and the relationships between them, but leaves out all the
    detail of what the methods in the classes do. The same applies to many of the
    other important aspects of software development: in order to think about one aspect,
    we need a representation that shows the information we need, while leaving out
    what we do not need. Such a representation is called a model.


    ### Terminology: Model


    A model is an abstract, usually graphical, representation of some aspect of the
    system.


    The use of models has been gradually increasing, and I think will become even
    more important in decades to come. My first book, *Using UML*, was about the Unified
    Modeling Language, which is now ubiquitous as a diagrammatic way to describe the
    design of systems. However, that language is complicated and can be frustrating.
    The future of modelling seems likely to involve more, simpler modelling languages,
    which may be diagrammatic or textual, together with tools that process them. A
    plethora of books about model-driven engineering have been appearing in the last
    years. One of my favourites is *Model-Driven Software Engineering in Practice*
    by Marco Bramilla et al.


    ## 15.5 Programming Language Theory


    What none of the kinds of books we’ve discussed so far do much of, is comparing
    languages, and discussing their design and their properties. This is a fascinating
    topic, and understanding something about it can help you become a better programmer.
    Moreover, you may find yourself designing a language some day – domain-specific
    languages are becoming more common, so more programmers will find themselves involved
    in language design, at least of simple languages, than hitherto.


    A great place to start is Shriram Krishnamurthi’s book *Programming Languages:
    Application and Interpretation*. By carefully guiding you through writing an interpreter
    for a language, it helps you understand many of the choice points in language
    design.

