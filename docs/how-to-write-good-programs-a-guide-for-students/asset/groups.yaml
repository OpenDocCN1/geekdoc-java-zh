    ## 12 如何在作业中获得高分


    本章重点关注我们所谓的学生身份中“计金佣兵”的一方面。它的主要目的并不是为了让你成为更优秀的程序员，而是帮助你在任何课程作业中获得尽可能多的分数，无论你当时的编程水平处于什么程度。然而，这确实有一种方式可以帮助你作为一名程序员而成长。如果你确保自己拿到了当前编程水平所能拿到的最高分，那么任何你*确实*丢分的地方都应该对应于你尚尚未完全理解的内容。这意味着你获得的反馈应该是很有针对性的：你不会只是读完它并想“噢
    是的，我知道那个”，而是能够从中学习。此外，我注意到，作为一名教育工作者，我没能防止本章的某些内容滑向“如何从作业中学习尽可能多的知识”。


    ### 12.1 七条黄金法则


    1. **尽早开始。** 大多数事情花费的时间比你想象的要长，而且可能涉及到“等待”时间，例如，你在某个晚上发现自己需要联系一位讲师，但他要等到第二天下午才有空。


    学生经常会想他们是否可以早点开始作业——“我们拿到所有材料了吗？”处理这个问题最简单的方法就是问。紧跟课程进度也会很有帮助，因为它能帮你确保当你遇到看起来不熟悉的东西时，你确实还没有接触过它。


    记住，即使某些内容还没有在课上讲，你也可以主动去查阅，这通常是很有用的做法。


    在截止日期前“通宵”有其吸引力，特别是如果你能在一个挤满了其他人在做同样事情的实验室里这样做时；当你最终完成练习时，它会带来一种同病相怜的感觉，甚至是愉悦感。但这真的、真的不是优化你的分数或学习的好方法。当你非常疲惫时，你会犯错，而且无法将学到的东西存入长期记忆中。


    2. **阅读题目。** 我知道，我知道，你以前被告诫过这了。在编程作业中，它有几个方面的意义。包括一些管理方面的事务，比如确保你知道是否、何时以及如何必须提交作业，以及是否有关于文件命名的之类的规则。这些事情适用于任何类型的作业，而不仅仅是编程作业。另一方面，在编程作业中，程序必须做到的细节具有极其重要的意义。你不能像读这本书一样去读描述：你需要逐字查看，并确保你*精确地*遵循这些指令。


    3. **遵循第 7 章中的所有建议**，测试你的工作并确保你做对了。


    4. **如果你遇到你不理解的内容**，即你认为被问的问题具有歧义或模糊性，请通过两种方式对其进行编程来使问题具体化。有时，当你尝试这样做时，你会发现现实中只有这两种方法中的一种是合理的。如果发生了这种情况，说明你已经解决了自己的问题。如果你最终得两种两种看起来同样合理的解释，你可以询问你的讲师哪种是他们想要的。对于讲师来说，像“你想要
    X 还是 Y？”这样的问题比“这是什么意思？”更容易理解并给出清晰的回答。


    5. **遵循第 8 章中的所有建议**，以便你获得任何可能存在的步骤分。这在你的分数很大一部分不是来自自动化测试，而是来自人类阅读你的代码时尤为适用。任何这样做的人都可能很忙且很累，任何能让他们更容易看到你答案中正确之处的做法都可能帮助你获得最高分。


    6. **不要作弊！** 即使你这次侥幸通过了——虽然你可能不会——你也会损害自己的学习，并让自己以后处于更糟的境地。


    7. **准时提交作业。**


    ### 12.2 实验室练习


    我在这里所说的“实验室练习”是指：相对较小、直接的编程练习，旨在帮助个人学习编程语言。通常，实验室练习不需要太多的创造力：你需要做的事情是严格指定的，一旦你熟悉了语言，它就很直观。第一门编程课程通常包含系列这样的练习，涵盖课程中包含的所有语言特性。它们可能计分也可能不计分，答案可能提供也可能不提供。


    从这些练习开始是因为它们具有特殊性：它们对你的学习非常有价值，完成这些练习将帮助你在任何其他评估中获得最高分，即使它们本身不产生学分。


    **提示**


    如果你没有这样一组必须完成的系列练习，请去找一组。例如，选择一本包含许多小型练习的编程语言教材，并完成它们。


    原因很简单：你无法通过阅读关于它的内容、看别人做或实际上自己去做来学习。除了黄金法则之外，如何如何最大化你的分数呢？我建议：


    - 我已经读了题目并开始做了。

    - 我写了一些代码。

    - 它运行结果是正确的。

    - 我找到了参考资料。

    - 我理解了每一行代码。

    - 我的代码是完美的。


    ### 12.3 个人项目


    个人项目是一项让你拥有更多创造力的作业：对于软件做什么以及如何做，你拥有相当大的选择权。


    为了获得最高分，首先弄清楚分数如何分配以及标准是什么。例如，你是否必须写报告、进行演示、提交代码？你是否被或鼓励寻找并构建其他软件？你是否应该展示特定的技能或学习能力？


    一旦你获取了所有所有可用信息，你可能会发现标准并不多。任务的灵活性越高，讲师评分的难度就越大。自相矛盾的是，在这种情况下，如果你越少担心分数，通常越能获得高分——而且能获得最大的收益。以你感兴趣的方式处理项目，并尝试让自己投入其中。我建议估计你应该花费的时间，然后明确跟踪你实际花费的时间。这是因为开放式的、长期任务很难与有严格截止日期的小型练习取得平衡。学生经常发现，由于某种原因，没有迫在眉睫的任务永远不会被考虑。最后，避免在非编程的事情上花费大量时间——例如为应用程序设计图形艺术——除非你足够喜欢它并可以将这段时间算作休闲，或者你有个人原因想要学习考试之外的技能。


    ### 12.4 团队协作


    团队协作是编程作业的常见部分，它有许多形式。你可能被分配到一个团队，或者允许自己分组；你可能是自我组织，也由他人管理；你可能需要对这段经历进行反思。


    我在这里主要的建议是对整个练习持审慎态度：与其他学生合作工作与在真实的软件开发环境中与同事团队合作完全不同。特别是，你可能讨厌前者但却热爱后者，所以如果你讨厌作业中的团队体验，不要担心！


    '
