- md: "\n## 8.4 Layout and Whitespace\n\n93\n\n**Java example**\n\n```java\npublic\
    \ String getName() {\n    return name;\n}\n```\n\nwhile others prefer\n\n**Java\
    \ example**\n\n```java\npublic String getName()\n{\n    return name;\n}\n```\n\
    \nThe computer does not care. Few readers really care.*But* if a single program\
    \ ends up with an inconsistent mixture of these two styles, it becomes subtly\
    \ harder to read, and to edit correctly. When you are a student, the best advice\
    \ is not to mess with the settings.\n\nSimilarly, you will find there are conventions\
    \ about where to put spaces within lines of code: compare, among many other possibilities:\n\
    \n**Java example (don’t do this!)**\n\n```java\nint i = f(7);\nint i=f(7);\nint\
    \ i = f( 7);\nint i=f( 7 ) ;\n```\n\nAgain, the point is not that any of these\
    \ is objectively better than any other, though you will sometimes find people\
    \ who will argue it. The point is that people will find the code more readable\
    \ if it uses one convention, consistently. (The first line in the example above\
    \ is normal in Java.)\n\nHere is a version of the opening example in which I have\
    \ swapped the terrible name l for a and fixed the layout, but changed nothing\
    \ else:\n\n**Java example**\n\n```java\npublic void setAgeRating(int a) {\n  \
    \  if (a == 12) {\n        this.ageRating = 12;\n    } else if (a == 15) {\n \
    \       this.ageRating = 15;\n    } else {\n        this.ageRating = 18;\n   \
    \ }\n}\n```\n\nHave you spotted the correctness problem yet?\n\nDifferent languages\
    \ have different conventions, which may be more or less uniformly followed. Unlike\
    \ many languages, Python has a single, widely followed style guide, PEP 8, written\
    \ by the developers of the language. Carefully written, with many examples, it\
    \ tells you everything you might want to know about how to format and lay out\
    \ Python code. If your language has such a style guide, use it! Otherwise, as\
    \ we advised in Chapter 4, pick a body of reputable code in your language to use\
    \ as a comparator.\n\n**Tip**\n\nRemember that it’s possible that code written\
    \ by your instructors is not setting a good example! If they teach several languages,\
    \ with conflicting conventions, their fingers may be confused.\n\n8.4 Layout and\
    \ Whitespace\n\n95\n\n**Tabs and spaces**\n\nA common source of confusion, which\
    \ can be a root cause of layout problems, is confusion concerning how and when\
    \ to use tab characters and space characters as whitespace in program text.\n\n\
    Usually, you get a space character when you hit the space bar on your keyboard,\
    \ and you get a tab character when you hit the tab key (which is usually on the\
    \ far left of the keyboard, looking something like →). If you are not familiar\
    \ with both, have a play in a plain text file. You will probably find that the\
    \ visual effect of starting a line with a tab character is similar to that of\
    \ starting it with some number of space characters, usually 2 or 4. (A tab character\
    \ in the middle of a line has more interesting behaviour.) However, what is placed\
    \ in the text file is different. A tab is a single character, which just happens\
    \ to be displayed like a number of space characters.\n\nThe problems begin when\
    \ you mix tabs and spaces. Let us suppose that you are working in an editor with\
    \ “tab width” 4 – that is, where one tab character at the beginning of a line\
    \ is displayed the same way as four space characters. Now, if you write one line\
    \ beginning with a tab character, and the next line beginning with four space\
    \ characters, they will line up neatly. If, however, you then open the same file\
    \ in an editor with tab width 2, the lines will no longer start in the same position.\n\
    \nIn an attempt to be helpful, IDEs and programming modes in editors may intercept\
    \ your keystrokes and do something different from what you expect. For example,\
    \ in Python, whitespace is significant, and spaces are preferred to tabs (e.g.\
    \ PEP 8 tells you to use spaces). For this reason, the Python mode in Emacs will\
    \ insert four space characters, not one tab character, when you type the tab key.\
    \ Similarly, Haskell is sensitive to how code is indented, and a good rule of\
    \ thumb is to make sure that your Haskell files contain space characters, not\
    \ tab characters. By contrast, the meaning of a Java program does not depend at\
    \ all on the whitespace in it, and Java programmers quite commonly use tabs.\n\
    \nIf you get strange layout behaviour when you look at the same file in two different\
    \ ways, it is worth suspecting that there may be tab characters in the file which\
    \ are being rendered as different numbers of spaces. How you test and fix this\
    \ depends on exactly what tools you are using: Atom, for example, has a Show Invisibles\
    \ setting which helpfully makes the difference between tabs and spaces visible.\n\
    \nAmusingly, a 2017 survey^a^ found that “coders who use spaces for indentation\
    \ make more money than ones who use tabs, even if they have the same amount of\
    \ experience”.\n\nAs a general rule, I recommend you use spaces rather than tabs:\
    \ given that today’s tools can insert the right number of spaces automatically,\
    \ tab characters are more trouble than they are worth. Before you get into the\
    \ habit of touching the tab, check that it inserts spaces. If not, change your\
    \ editor or IDE.\n\n## 8.5 Structure and Idiom\n\n97\n\nProgramming languages\
    \ are used by communities. So far we have talked only about small, local aspects\
    \ of your program, clarity is a major concern. Early in a programming course,\
    \ you are likely to be told how to make decisions what modules or classes to write,\
    \ which pieces of functionality to place where, and how to manage the flow of\
    \ control and data. Once you are making these at larger scales, think about what\
    \ a reader, trying to understand some aspect of your program, will need to understand,\
    \ and try to place the relevant pieces of code close together.\n\n**Terminology:\
    \ Idiom**\n\nAn idiom in a given language is a way to solve a common problem that\
    \ is normally used by people. For example, there are many ways to swap values\
    \ of a and b. In Python, the idiomatic way to do this is:\n\n**Python example**\n\
    \n```python\na, b = b, a\n```\n\nThis short, simple solution takes advantage of\
    \ the way Python is defined (specifically, its order of evaluation). Watch out\
    \ for idioms in your language, in any languages you may know.\n\n**Terminology:\
    \ Spaghetti code**\n\nImagine printing out your program and drawing lines on the\
    \ printout to represent the flow of control; for example, if one function calls\
    \ another, you draw a line from the call to the definition of the function being\
    \ called. If the resulting collection of lines is complicated and tangled, you\
    \ have spaghetti code. The origin of the term is unclear. My father, W.G.R. Stevens,\
    \ recalls using it when he was a programmer in the 1960s, and having to explain\
    \ to a colleague^a^ that he was not referring to short lengths of spaghetti tinned\
    \ in tomato sauce, which were the commonest form of spaghetti in England at that\
    \ time, but rather, to proper long spaghetti that you would get in a packet, or\
    \ in an Italian restaurant!\n\n^a C.B.B. Grindley, who later wrote about it in\
    \ a paper I have sadly been unable to trace\n^4 If you have not yet spotted the\
    \ bug in the “bad” version, now is the time to ask yourself: what happens if we\
    \ give argument 7 to the method? And what was supposed to happen?\n"
