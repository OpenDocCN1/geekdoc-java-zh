    that the structural chunks of the program often correspond to real-


    world objects. These are not necessarily physically real things, but


    they are* domain concepts*: things that have meaning to the customer,


    so that they are referred to by nouns, such as Account, Customer,


    Transaction. A set of changes in the real world, which causes


    changes in the program, is likely to centre around one domain


    concept. Because the code that corresponds to this concept is all


    in one chunk of the program, the chances are good that we only


    have to modify that one chunk. By contrast, if we structure the


    program according to the steps of what it has to do, it’s more likely


    that several steps, each using that same domain concept, all have


    to change.


    **Tip**


    Choosing good names for chunks of your program can drive


    the process of improving its structure. For example, if you


    find it difficult to name a function because it does two


    unrelated things, split the function into two, each with a


    good name.


    When you look at a program and see that all its names are


    perfectly apt, and yet quite short, it is tempting to think that the


    programmer was lucky. Fancy finding that the domain concepts


    were so easy to describe clearly and concisely, you may think! In


    fact, it may be that what you are seeing is the end point of a pro-


    cess of improvement. Perhaps the programmer chose maximally


    descriptive names, even if they were long, and then looked at the


    over-long names as a sign that the structure of the program was


    not yet ideal. Refactoring – e.g. splitting non-cohesive units, or


    pulling out common superclasses or repeated subroutines – then


    enabled the improvement of the names. For a fuller discussion on


    using good naming to drive the process of design improvement, see


    J. B. Rainsberger’s blog (Rainsberger, 2013).'
