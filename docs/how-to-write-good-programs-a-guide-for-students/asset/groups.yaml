    **7.2**** Basic Automated Testing**


    Running your program by hand for each test, and comparing the


    results with what you expect by eye each time, gets tedious very


    fast. The next step is to get the computer to do some of the


    tedious bits.


    There are different ways to do this, and you won’t want to go far


    along this route before moving to using a proper testing framework


    (which we will discuss in Section 7.3 below), otherwise, you’ll find


    yourself writing your own testing framework. Still, it can be a good


    way to get started.


    The first thing you need is an automatic way to run exactly


    the code you want to test. That’s easiest if it’s simply a func-


    tion. Then what a test has to do is to call your function, with


    some arguments if appropriate, compare what the function returns


    with what it should return, and complain if the two are dif-


    ferent. Here is a classic way to do that in Python. The func-


    tion we are testing is called greeter. Its source is not shown


    below, but it takes one string argument. Each test is just a func-


    tion. test\_greeter\_one\_word invokes the greeter function


    with the argument “Jane”, and* asserts* that the result should be


    “Hello Jane”. Many languages have a built-in assert statement


    (or function) that works like this: it can be very useful. Python’s


    takes an extra argument which is a string to be printed if the


    test fails.'
