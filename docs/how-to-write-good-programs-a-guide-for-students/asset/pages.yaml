    **Terminology: Turing machine**


    In 1936, Alan Turing described a simple mathematical model


    of a computer, which we now call, in his honour, the* Turing*


    *machine*. The* Turing-computable functions* are the mathematical


    functions (the mappings from input to output) that can be


    expressed using such a machine. You might expect that your


    choice of programming language would have an important


    effect on which functions you could express. Remarkably, this


    turns out not to be so. Although programming languages differ


    in what can be* conveniently* expressed, modern programming


    languages do not have, in principle, any more expressive power


    than very old ones, or even than Turing machines. We call any


    language in which you can program all the Turing-computable


    functions* Turing complete*.


    **Which Language(s) Do You Know Already?** This factor can operate


    either way. You may prefer to use a language you’re already familiar


    with, even if it isn’t ideal for the task, so that you can focus on


    things other than the nitty gritty of how you make the machine do


    what you want. However, it can be more fun to use a language that’s


    new to you, and – especially early in your programming life – it may


    be positively sensible to take the opportunity to widen your range.


    Writing a program you want written is the best way to develop


    fluency in a language. It’ll take a bit longer than if you do it in


    a language you already know, of course, but you may learn more


    in the process.


    **How Long Will the Program Need to Last?** If it must last for


    many years, you may prefer to use a long-established language with


    a reputation for maintaining backwards compatibility, like Java,


    rather than a fast-moving language in which old programs often


    have to be changed if they are to work with the latest version of'
