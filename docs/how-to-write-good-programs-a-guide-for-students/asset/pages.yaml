    How to Get Started


    In this chapter we assume you are about to do the first exercise in


    a programming course, or, perhaps, are starting to teach yourself


    a new language. In any case, you are about to create a program.


    You may have been given step-by-step instructions, but read this


    chapter all the same: it will set those instructions in context, and


    point out things that are easy to miss.


    **3.1**** What Is a Program Anyway?**


    **Terminology: Program**


    A* program* is a set of instructions that you would like a com-


    puter to follow.


    Arguably, it’s better to think of the program as being* an* instruc-


    tion which may have complex structure. We’re definitely not using


    the word “set” here in the same way you may have encountered it


    in mathematics: rather, we’re using it in an everyday English sense.


    Other examples of sets of instructions are cooking recipes, or the


    leaflets you get with Lego kits or self-assembly furniture. However,


    while those are typically simple* lists* of instructions, telling you to


    do one thing, then another, a program can have more interesting


    structure. The way the parts of a program combine to make a whole


    is one of the things that varies between languages, and that you


    have to learn in the setting of a particular language.


    12'
