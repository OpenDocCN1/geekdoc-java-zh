    8 How to Make Your Program Clear


    **Tip**


    Don’t write too many comments, especially early on.


    The reason is two-fold. The most important is that people often


    write comments to explain lines of code that are unclear to them. If


    the code is unclear because it isn’t written in the best possible way,


    it’s much better to rewrite the code, paying attention to the other


    issues discussed in this chapter, rather than adding a comment.


    The best way to write code is: so lucidly that it does not need


    comments.


    A secondary issue is that sometimes people write fully docu-


    mented code while their understanding of it is still changing fast.


    This is to some extent a matter of personal choice: if you find


    this helps* you* to think straight, go ahead. But if you’re writing


    comments that are aimed at someone else (a future maintainer, or


    someone marking your code) then it’s often more efficient to write


    comments when your code is approaching steady state. Comments


    that are out of date can be positively harmful.


    **Tip**


    “If the code and the comments disagree, both are probably


    wrong.”


    *Norm Schryer* (attributed, Bentley, 1988)


    Bear this in mind when you read other people’s code, but


    especially when you write your own!


    A question which you will encounter early on is: what should you


    assume about the readers of your code? Should you assume that


    they are experts in the programming language, for example? There’s


    no substitute for thinking about who really will be reading the code.'
