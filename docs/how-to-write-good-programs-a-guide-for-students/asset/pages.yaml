    **1.2**** About the Boxes**


    We use various kinds of boxes. There are tips, like this one:


    **Tip**


    A note on spelling. If you spell in British English, you may


    expect the spelling “programme”rather than “program”. How-


    ever, by long convention, when we write about computer pro-


    grams, we use the American spelling. Very, very occasionally


    this is useful disambiguation; computer science events may


    involve both programs and a programme. Normally, it’s just one


    of those things you have to know.


    Explanations of terms, like this:


    **Terminology: Coding, programming, software engineering**


    *Coding*,* programming* and* software engineering* overlap, and


    all involve giving a computer instructions. They are in


    increasing order of sophistication. A software engineer can


    program, and a programmer can code, but not necessarily


    the other way round. A coder might only translate precise


    English instructions into a programming language. A pro-


    grammer takes responsibility for deciding what to write and


    when it is good. A software engineer typically works as part


    of a team, and solves real-world problems with high-quality


    software.


    After absorbing the content of this book, you will be well


    equipped to progress to software engineering: more on that in


    Chapter 15.'
