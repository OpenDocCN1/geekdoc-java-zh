    9 How to Debug Your Program


    Once you have that simplest case, commit to fixing the bug in


    that case before you worry about any other case. You need to


    understand what your program does in this case, and how it’s


    different from what you want. Perhaps there is a problem with the


    flow of control, e.g. because you have got the wrong expression in


    an if statement so a section of code gets executed when it should


    not, for example; or perhaps your code sets a value that is not


    the one you intended. Whatever the issue is, you need to look in


    detail at what your program does – concretely, in this simplest


    buggy case – to find out precisely where, and how, something


    goes wrong.


    **Inserting Print Statements**


    This is usually the easiest way to proceed. Probably – at least if


    you are using an imperative language – you will have been taught


    how to print a string to the console (to “standard out”, abbreviated


    “stdout”) early in your course. You can use that to help understand


    what’s going on. For example, if you have written some code which


    you think should do the right thing, but it doesn’t seem to be


    working, is that code section ever run? Or is there some earlier


    problem that means the computer doesn’t ever reach that section


    of code? You can find out by putting a print statement at the


    beginning of the section, e.g.


    print("Got here!")


    Doing this also helps to detect a surprisingly common problem:


    when the version of your program that you are* editing* is not the


    same version that you are* running*.


    If you start to suspect that some value is incorrect, print it out


    at key points and see.


    This approach is crude, but often effective. Don’t forget to


    remove the print statements once you are confident that the aspect


    of behaviour they are checking is correct, otherwise your output


    becomes cluttered and confusing.'
