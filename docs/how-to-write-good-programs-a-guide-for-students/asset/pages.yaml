    programming skills are at the time. However, there is one way in


    which it may help you grow as a programmer. If you make sure that


    you get as many marks as your current programming skills will let


    you get, any places where you* do* lose marks should correspond to


    things that you genuinely don’t fully understand yet. That means


    that the feedback you get should be well targeted: you won’t just


    read it and think “oh yes, I know that”, but instead, you will be


