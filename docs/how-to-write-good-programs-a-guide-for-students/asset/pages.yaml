    155


    **Laziness** I once had a mathematics teacher who used to say


    “Mathematics is the art of being lazy”, because so much


    of mathematics is about finding easy ways to do things


    that would be hard if you did them the obvious way.


    It’s a similar idea: a great programmer thinks about how


    they can spare themselves work in future, and so writes


    the program in a way which will be as easy to change as


    possible. Even better, the great programmer makes full


    use of high-quality libraries: if someone else has already


    written the code you would have to write, you may save


    the effort of writing the program at all.


    **Impatience** is the necessary counterweight to laziness. It is the


    quality that drives you to improve the efficiency of your


    program, for any kind of efficiency that’s relevant to you


    at present. It is, for example, the quality that forces you


    to investigate when your program runs for longer than


    it reasonably should take (time efficiency). It is also the


    quality that tells you it is intolerable to have to change


    your code in five places for what is really only one


    reason, so that you had better improve its design so that


    you never have to do that again (maintainer efficiency).


    **Hubris** means excessive pride. This is the quality that makes


    you want to write programs so good that everyone will


    admire them, and gives you confidence that you can.


    At the time of writing, there is a video on YouTube entitled


    “Hobbits Would Make Great Programmers” in which Larry


    Wall explains that programmers should have the characteristics


    he attributes to hobbits:


    • lazy in a very industrious way;


    • impatient in a very patient way;


    • proud in a very humble way.'
