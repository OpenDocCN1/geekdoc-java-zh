    In order to think clearly about design, we need a way to represent


    the information that we need to focus on, while leaving out all


    the other information about the system which is irrelevant right


    now. For example, while thinking about the design structure of


    an object-oriented system, we might use a diagram that shows


    the classes in a system and the relationships between them, but


    leaves out all the detail of what the methods in the classes do.


    The same applies to many of the other important aspects of


    software development: in order to think about one aspect, we need


    a representation that shows the information we need, while leaving


    out what we do not need. Such a representation is called a model.


