    10 How to Improve Your Program


    The next stage of ensuring maintainability is to think about what


    changes are most likely to be required in future, and structure the


    program so as to make those changes as easy as possible. This may


    sound as though it requires a crystal ball, and indeed it is not always


    easy. You may guess that if your program talks about three kinds


    of widget, then it is quite likely that a fourth kind of widget might


    be required in future. Whether that is really true, though, is not


    something you can work out just by looking at your program: it


    depends on the real world.


    **10.1.1** Eliminating Duplication


    **The “Write Once!” rule**


    The idea is that each thing – let’s say, each independent


    decision – ought to be incorporated just once into the program.


    That way, if this decision needs to be changed later, there is


    only one place in the program that needs to be changed. This


    is easier than changing several places, and avoids the risk that


