    though there was no expectation it would still be in use in the


    year 2000. Many years later, after I had left the company, I met


    someone who worked there, having arrived after I left. She knew


    my name because she had seen it in a program. You’ve guessed


    it – it was that program, which was still in use many years after


    I would have expected it to be retired.


