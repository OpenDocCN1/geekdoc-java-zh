    choice about what programming language to use in a course you


    are committed to. By now, I hope you have some techniques for


    getting to grips with the prescribed language, whatever it is.


    What if you do have a choice of what language to use for a


    project, though, or a choice of what programming language to


    learn next? Many factors may influence your decision, from the


    nature of a program you want to write, to your own state of mind.


    **14.1**** Questions to Consider**


    **Are You Choosing Just for Yourself?** Or are you writing a program


    with someone else, or that someone else will have to maintain in


