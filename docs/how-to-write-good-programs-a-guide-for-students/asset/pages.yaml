  md: '3.2 What Do You Need?


    13


    A computer is a machine: it will follow your instructions blindly,


    with total, stupid obedience. Before it can do so, though, your


    instructions will be translated (by other programs, including a


    *compiler* or an* interpreter*), from the form in which you write


    them (the program), into a form which is capable of affecting


    the computer hardware (ultimately, binary code, zeroes and ones).


    That translation process – about which we will have more to say


    in Chapter 4 – naturally makes your life much more convenient; it


    is much easier to write in a modern programming language than


    in binary code. However, the very convenience of it may tempt


    you to forget how stupid the computer really is. If one of the


    translation steps involves rejecting most of your mistakes, it’s easy


    to end up thinking that if the program gets to the point of being


    run, that means that the computer “understood” it, will “see what


    you mean”, will do something sensible. That’s an illusion – one that


    can be helpful, but that you need to see as fiction.


    A computer (even with all its software running) is not an intel-


    ligence: not a friend, not a foe. It is just a machine. Learning to


    program involves understanding how to make that machine do


    what you want it to do.


    **3.2**** What Do You Need?**


    So, a program is a set of instructions, which will eventually be


    translated into a form that can be run on computer hardware. You


    will need


    1. a way to express the instructions;


    2. a way to get them run on the computer hardware.


    Let’s consider the second point first. Unless this has already


    been done for you, or you are using a purely online system, you


    will probably need to* install* some software for your language by


    downloading something from the web. Precisely what you have to


    do depends on the language you are learning and on the computer


    you are using. Searching'
