    **10.2**** Efficiency**


    A large and challenging part of computer science relates to min-


    imising the computational resources required to carry out some


    calculation.


    **Terminology: Moore’s Law**


    *Moore’s Law* is the empirical observation, first made by


    Gordon Moore in 1965, that the number of transistors on a


    chip seemed to double every year.


    Moore’s Law has had many variants: the details do not matter


    so much as the essence, which is exponential growth in computing


    power (since, roughly, the number of transistors controls how much


    computation the chip can do in a given time). Although stories


    about the end of Moore’s Law are becoming increasingly common,


    the landscape of software engineering, so far, has been shaped


    by this reality: that computers get better much faster than our


    ability to program them does. One effect is that computer scientists


    think in terms of “big O”.¹^ It is usually not worth a programmer


    spending a lot of effort working out how to make a program run


    twice as fast, or in half as much memory: if that is all that is needed,


    buying a better computer is cheaper than paying the programmer.


    **Story**


    Early in my time as a professional software developer, I had to


    learn Perl, and I did so with the help of the “pink camel book”,


    which was the first edition of* Programming Perl*. (It was so


    1 If you don’t yet know what that means, it doesn’t matter: the next sentence


