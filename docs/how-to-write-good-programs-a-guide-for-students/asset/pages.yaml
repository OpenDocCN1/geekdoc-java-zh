    **10.4**** Improving Your Skills**


    Stretching the title of this chapter a little, what – beyond “absorb


    everything this book says”! – can you do to improve your skills,


    and hence improve* all* your programs? Let us look at one specific


    habit that you might find worth adopting. It is the use of katas.


    **Terminology: Kata**


    A kata is an exercise, performed repeatedly in order to improve


    one’s skills.


    The term originates in martial arts; Dave Thomas first intro-


    duced the idea of katas as programming exercises in* The Pragmatic*


    *Programmer*, and the idea has been taken up by others since.


    Other martial arts terms have also been imported into the world


    of programming: if you find there is a coding dojo near you, you


    might like to go there to do your katas.


    If you are on a programming course, you may feel you have


    enough exercises to be going on with: why would you want more?


    The key is the word* repeatedly*. Instead of just doing a succession of


    different exercises, you adopt one and do it frequently. Fizz Buzz,


    which we considered in Chapter 3 and earlier in this chapter, is


    suitable. As you repeat an exercise you have done before, you focus


    on writing the program perfectly, thinking about each small choice


    you make along the way. You eliminate the stressful feeling that you


    need to get to the end in any way possible. Just as the movements


    of your body become second nature if you do the same physical


    exercise repeatedly, the elements of programming your kata should


    soon feel very familiar. Even though you know how to solve the


    problem, you don’t take shortcuts: for example, you should still


    write tests for the program and use them as you work. Indeed, the


    use of katas goes well with test-driven development, and one of the


    things you might like to explore is how some ways of solving your


    problem are easier to test as you go along than others.'
