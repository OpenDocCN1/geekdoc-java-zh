    **Terminology: Pair programming**


    *Pair programming* is when two people program together at one


    computer. One of them is in charge of the actual typing, while


    the other acts as lookout: is the program going in the right


    direction, and are there any rocks ahead? That is, is the person


    typing following a strategy that will lead to a good program,


    and are there any problems or bugs?


    Pair programming is a practice which is sometimes used by pro-


    fessional programmers (especially in agile development), because,


    even though it takes more time, it can lead to higher-quality


    programs. As a student, you may find it a good way to learn.


    **Skimming** If you’re really, really pushed for time, you can try


    taking a shortcut like this, but be aware that it has risks and may


    backfire. Go forward identifying the* key points* of the material, and


    checking that you understand them, but being prepared to skip


    over things that don’t seem relevant to the exercise you’re stuck on.


    For example, if you find a section of your notes that’s about how to


    read from standard input, and your exercise doesn’t require doing


    that, you could skip that section for now. Do, however, make a note


    to remind yourself to go back to it later.


    Compared with catching up properly, skimming can save you


    time, but the risk is that you may not be reliable at identifying what’s


    relevant – later material tends to depend on earlier material in ways


    that aren’t always completely obvious.'
