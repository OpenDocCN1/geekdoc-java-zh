    **15.4**** Software Engineering**


    “Software engineering” is the term we use for all the processes and


    skills that contribute to ensuring that we have software available


    that meets our needs. The term seems probably to have been coined


    by Margaret Hamilton, who led a team developing software for


    the Apollo 11 space mission, in the early 1960s. It was popularised


    by its use in the titles of the NATO Conferences on Software


    Engineering in 1968 and 1969. The intention was to conjure up an


    idea of software being built in a systematic, reliable way, based on


    mathematics. The people building the software would be engineers,


    with the connotation that they would have undergone a certain


    kind of rigorous education, probably leading to a professional


    certificate. This was always more aspiration than reality – the


    very softness of software has always meant that people have built


    software without such an education. Nevertheless, we undoubtedly


    want well-engineered software, and an important step towards that


    is to understand how to write* good* programs, as discussed in this


    book and in those mentioned in the previous section.


    Going beyond programming, software engineering also involves


    many other activities. There are whole fields that study how you


    manage the requirements of a system, including reconciling the


    conflicts between what different people want; how you can be


