    where your program gives surprising results, the techniques dis-


    cussed in Chapter 9 are probably what you want. If you have


    a program that works properly sometimes, but not always, then


    systematically testing it, as described in Chapter 7, is the next step.


    **11.2.1** Getting Help from and with Error Messages


    What if your problem is that you* keep* getting a particular kind


    of error message, suggesting that there’s something about the


    language that you systematically don’t understand? In Chapter 9


    we briefly mentioned that one of the most useful things you can


    do with an error message you don’t understand is, surprisingly


    perhaps, paste it into your favourite search engine. This works


    better the more popular your language is, but if you’re lucky, it will


    take you straight to one or more pages where some helpful people


    explain exactly what it means and how to fix the problems that give


    rise to it. However, there are some reasons to be wary.


    • Don’t go too far down a rabbit hole. Some error messages arise in


    a wide variety of circumstances, and it’s easy to get sucked into


    trying to understand a discussion about why someone* else* gets a


    certain error message, while* you* get it for a different reason.


    • Be careful with solutions you do not fully understand. If you


    paste someone else’s code into your program, you can make


    matters worse. It can be useful to see whether or not a possible


    solution works in your context or not, but always delimit code


    you got from elsewhere clearly in your program with comments.


    If you are submitting code for assessment, this may well be


    required anyway.'
