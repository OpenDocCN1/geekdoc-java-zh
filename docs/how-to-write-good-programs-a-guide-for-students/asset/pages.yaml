    done, was* Pareto efficiency*. If you have a choice of two


    approaches in mind, and one of the approaches is more efficient


    in one of the ways you care about* without being less efficient in*


    *any of them*, it’s a no-brainer to pick that approach.


    The special thing about* maintainer efficiency* is that it is a


    prerequisite to improving your program in any other way.'
