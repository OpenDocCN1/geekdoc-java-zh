    **15.2**** Specific Programming Languages**


    You have probably been using an introductory book on your


    chosen programming language alongside this one. Most books


    treat their chosen language starting at the very basics, and include


    some material on how to write good programs in that specific


    language. There are so many of these books for each popular


    language that I’m not going to attempt to recommend specific


    ones. Indeed, because there are so many, you will usually find that


    you can indulge your own preferences for book style. Some people


    like short, terse books that explain each thing once. Others prefer


    discursive books that return to important topics and include lots


    of exercises. Browse, read reviews, ask for recommendations, and


    pick your favourite.


    There are fewer books that focus on how to become an excellent


    programmer in some language. One such is Joshua Bloch’s* Effective*


    *Java*. Once you have understood the basics of Java, this will be very


    useful.


