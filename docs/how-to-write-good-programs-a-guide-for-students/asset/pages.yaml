    • Functional. The programmer thinks of functions not just as bits


    of code, but as concrete things in their own right – as data – which


    can be passed around the program. For example, a function


    can be passed as an argument to another function, just as an


    integer might be. (People sometimes say functions are “first-


    class citizens”.) Mutable state is avoided. Example language:


    Haskell.


    • Logic. Writing a program involves specifying facts, and rules


    about how facts follow from other facts, and then asking a


    question. Example language: Prolog.'
