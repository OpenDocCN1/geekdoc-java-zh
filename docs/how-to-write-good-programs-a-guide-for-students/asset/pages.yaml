    Introduction


    This book assumes that you are committed to learning to program,


    and want to do well. Most likely, you are taking a programming


    course in college or university. Perhaps you don’t have much expe-


    rience programming yet, or perhaps you have programmed a fair


    bit, but now you are interested in how to improve the quality of


    the programs you write. This book aims to help you learn how


    to write* good* programs, in any language. It’s the book I wish


    I’d had available to me, nearly forty years ago when I started


    programming; and the book I wish I could have recommended to


    my students, especially my first-year undergraduate students, over


    many years since.


    Let us tackle one thing head on. People sometimes talk as though


    students could be divided into programming sheep and non-


    programming goats: as though programming ability were innate.


    My experience over more than twenty-five years of teaching, and


    most current research, suggests that this is* simply not true*. I have


    lost count of the number of times I have seen students really


    struggle to begin with, perhaps even failing their first programming


    course, but go on to become excellent programmers. It also some-


    times happens that people come in feeling very confident, perhaps


    having more programming experience than most of those around


    them, and later realise that they had hardly begun to tackle the


    most interesting challenges in software development.


    Some people love programming from the very beginning. These


    people may have started coding at a young age, and often choose to


    sit up late into the night doing so. That’s great, and if you’re one of


    them, I hope you will benefit from this book. But, full disclosure:


    I was not one of those people. Indeed, when, as a child, I was first


