    **Terminology: Test-driven development**


    *Test-driven development* (TDD) goes like this:


    1. Write a test that you would like to pass, but fails.


    2. Write just enough code to make all the tests pass.


    3. Improve the code if possible, and check that the tests still


    pass.


    You do this from the very beginning – so the very first code you


    write is a test – and repeat until the program is finished, i.e. it


    passes every test it should pass and cannot be improved.


    By writing the test before you write the code that it is testing,


    you check that you understand exactly what the code should do.


    By writing just one test at a time, you keep your increments small,


    so that if you make a mistake it is easy to understand and fix. By


    rerunning all of the tests each time, you ensure that you don’t break


    previously working code.


    People who adopt TDD are often evangelical about it, and


    you will even hear it said that it is irresponsible to use any


    other approach. Still, many expert and professional developers


    do not use it. I think, in reality, that how well it works depends


    more on what code you are writing, and in what environment,


    than the evangelists sometimes acknowledge. Perhaps, too, part


    of the reason it isn’t universal yet is that some people actively


    enjoy debugging their code. Using TDD makes you less likely to


    introduce challenging bugs into your code that you can then have


