  md: '1.1 Who Is This Book For?


    3


    This book will not teach you any particular programming


    language – for that you will need a different book, a course, or an


    online tutorial, and there are plenty to choose from. This book will


    help you in the process of learning any programming language, and


    especially, it will help you to learn to write it* well*, and with deep


    understanding that you can also transfer to your next language. It


    covers things that programming courses tend to assume students


    will pick up by osmosis, but that are often, in practice, stumbling


    blocks. Unlike books aimed at professionals, which assume you


    can always express what you want to express in the language, this


    book will help you develop ways of getting unstuck, unconfused


    and debugged.


    You’ll learn to write code that you can understand and modify


    not only when you are at your cleverest, but also when you’re not.


    This will lower your stress levels. It’ll let you be lazy, in the best


    possible way.


    There’s a certain satisfaction in doing a thing well, though: that’s


    how the virtuous circle works.


    Robert Martin, in his wonderful book for professional software


    developers,* Clean Code*, talks about programmers needing to have


    “code sense”. Code sense is what lets a seasoned professional tell


    good code from bad, and, much harder, systematically develop


    good code. If you are starting out with programming, this is what


    you need to develop. You won’t develop it in a day, a week, or a year,


    but, by paying attention in the way this book aims to encourage,


    you will gradually increase your code sense.


    **1.1**** Who Is This Book For?**


    If you are learning to program, this book is for you.


    If you are helping other people to learn to program, this book is


    for you.


    If you are a professional programmer, this book is not intended


    for you – but you are welcome to read it anyway. Perhaps you would


    like to recommend it to someone. I’d welcome your comments.'
