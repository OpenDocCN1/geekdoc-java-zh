    **9.2.1** Special Cases: Non-termination and Crashes


    **When Your Program Runs for Ever** You start your program,


    expecting it to run for a moment and give a result, and instead,


    it runs but does not terminate. Either nothing visible happens, or


    you have an endless stream of output. You will need to stop the


    program manually, either by pressing the appropriate button in


    your IDE, or by using the operating system directly, e.g. hitting


    Control-C in a Linux system, or killing the command window in


    which it is running.


    Usually this is a sign that your program contains an endless loop


    (or an endless stream of recursive calls). Check the loop conditions,


    or the logic that leads to recursion, carefully. Ask yourself: why do


    I expect this process ever to finish? If you do not immediately see


    the problem – especially if there is more than one loop and you are


    not sure which one is causing the problem – then either tracing the


    program execution in a debugger, or inserting print statements, can


    help you see what is going wrong.


    It is possible that what you have is not true non-termination,


    but a very inefficient program that is doing more work than you


    expected – it would finish eventually, but not until the middle


    of next week, or worse. Fortunately such problems are rare in


    early programming exercise solutions: if you have managed to


    create one, you probably have a good idea about how. Trying your


    program on the smallest, simplest input data you can is often a


