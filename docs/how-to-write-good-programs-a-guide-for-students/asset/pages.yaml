    **Terminology: Contract**


    A* contract* for a piece of code is a precise expression


    of something about how the code is supposed to behave.


    A function or method may be given a* pre-condition* and/or


    a* post-condition*. The pre-condition says what the code is


    allowed to assume is true before it is executed; this must,


    therefore, be ensured by any caller of the code. The post-


    condition says what the code will ensure is true after it has


    been executed (provided its pre-condition was satisfied). A


    part of the program that contains some data – such as a class,


    or a loop – may be given an* invariant*, which says something


    must be true “always” (strictly speaking: at certain important


    points, such as the start of the loop, or when a method of an


    object of the class is called).


    For example, if you are writing a function that takes an integer


    argument i, but you have decided (perhaps because it is part of


    the specification of an exercise you are doing) that the function


    will only handle positive integers, you might write


    Precondition: i > 0


    as a comment to warn readers about the assumption.


    • Design notes. For example, if you tried coding something


    the obvious way, found that was too slow, and found a less


    obvious way that was better, you might include a comment to


    explain that.


    • Notes to self. For example, if you have an idea about how you


    might want to improve the program in future, but you don’t want


    to make the improvement right now, you might write a comment


    to remind yourself.'
