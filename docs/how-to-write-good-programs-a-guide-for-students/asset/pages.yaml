    What Are Good Programs?


    A book that discusses how to write good programs had better say


    what good programs are. That depends quite a lot on the context,


    and we’ll have more to say about that in Chapter 10: but for now,


    let us begin at the beginning with the least controversial criterion.


    **Criterion 1**


    Good programs do what they are supposed to do.


    That is, they are* correct*. If your program does the wrong thing,


    it isn’t good – yet. This is the main topic of much of this book,


    especially Chapters 7 and 9.


    Whenever you need to change your program, though – whether


    that’s because it doesn’t do what it should do yet, or because what it


    should do has changed since you first wrote it – you will care about


    some further criteria.


    **Criterion 2**


    Good programs are clearly written.


    That is, they are as easy to read and understand as they can be.


    This is the topic of Chapter 8 – and throughout the book, we will


    be discussing how writing your program clearly helps you to make


    it correct.


