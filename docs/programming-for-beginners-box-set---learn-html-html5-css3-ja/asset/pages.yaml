  md: '# Comments


    Comments are lines that are not executed or read as part of the program. Their
    sole purpose is to be read by users who may need additional information. You can
    include comments in your program if you want other people to gain a better understanding
    of it or you want to be reminded of what you did. In case you decide to look back
    at your program after a few years, your comments can be helpful. They can remind
    you about your thoughts during the time when you created your code.


    Consider the following example:


    ```

    <?php

    # This is a single line comment

    //This is a single line comment

    /*

    This is a

    multiple line

    comment

    */

    //This is a comment that leaves out a part of a code line

    $w = 2 /* * + 10 */ + 3;

    echo $w;

    ?>

    ```


    If you run this code, you will get an output of:


    5'
