  md: '# # Chapter 5

    HTML Attributes


    The next step in our HTML lesson, are the attributes. All HTML elements can have
    attributes.


    +   - Attributes provide additional information about an element.

    - They are always specified in the start tag of the element.

    - They come in pairs like: name="value"


    We''ll go over some general attributes in this chapter.


    +   - The HTML lang.


    ```

    ```html

    <!DOCTYPE html>

    <html lang="en-US">

    <body>

    <h1>My First Heading</h1>

    <p>My first paragraph</p>

    </body>

    </html>

    n```

    ```


    The document language can be declared in the <html> tag and it''s declared using
    the lang attribute. Declaring a language is important for accessibility applications
    and search engines.


    +   - The HTML title Attribute.


    ```

    <p title="Our title attribute">A paragraph about the title attribute. </p>

    ```


    The HTML paragraphs are defined with the <p> tag. In this example the <p> element
    has a title attribute the value of which is "Our title attribute."


    +   - The HTML href Attribute.


    HTML links are defined with the <a> tag and the link address is specified in the
    href attribute.'
