  md: 'Because search engines use your headings to index the structure and content
    of your page it is very important to use them as intended. In other words... don’t
    use them to make your text big or bold.


    HTML headings are defined with the <h1> to <h6> tags. The <h1> is the bigger one,
    and going down to <h6> which is the smallest.


    ![](img/f1f3317e3c574b724055b1c9e128d700_15_0.png)


    ```

    <h1> Heading 1</h1>

    <h2>Heading 2</h2>

    <h3>Heading 3</h3>

    <h4>Heading 4</h4>

    <h5>Heading 5</h5>

    <h6>Heading 6 </h6>

    ```


    This is how the headings look like. You can also use the <hr> tag to make a horizontal
    line to make your heading stand out.


    # Heading 1


    ```

    <h1> Heading 1</h1>

    <hr>

    ```


    Note that the <hr> tag does not have a closing tag. The horizontal tag can be
    use not only to your headlines but to paragraphs too.


    Also note that the <head> element is different than the <h1> element. The <head>
    element has nothing to do with the HTML headings. <head> elements are used to
    display meta data which is not displayed to the user.'
