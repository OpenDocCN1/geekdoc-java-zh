    way you don''t end up getting confused and overwhelmed.


    In this chapter, we''re going to talk about:


    +   - Comments

    - Literals

    - Identifiers

    - Data Types

    - Variables

    - Arrays

    - Operators

    - If-Else Statements

    - Switch Statements

    - While and For Loops


    These features are considered essential in pretty much every programming language,
    even if you''ve already taken up a programming course and see the similarities,
    remember that every programming language will have variations in the most fundamental
    data types and naming conventions. Make sure you least skim through this chapter
    if you''re sure that you''re familiar with most of the concepts in order to avoid
    confusion in the next chapters.


