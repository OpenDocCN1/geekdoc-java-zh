  md: '# Styling the Content Area


    Styling the content area is very easy with CSS3. There will be no more need for
    floating, faux column images for the background as well as clearing or collapsing
    the margins. Elements now behave like a table, making layouting easier. Check
    out the simple code below:


    ```

    #content {

    Display: table;

    }

    #mainContent {

    Display: table-cell;

    Width: 600px;

    Padding-right: 20px;

    }

    Aside {

    Display: table-cell;

    Width: 320px;

    }

    ```


    The CSS3 techniques we have used so far can then be used to style the rest of
    the sections of the blog page. This means we can finish an entire project in a
    fraction of a time it would have taken we were to use outdated techniques!


