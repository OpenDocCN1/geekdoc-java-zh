    \ into table headings with the `<th>` tag.\n\nHere's an example:\n\n```\n<table\
    \ style=\"width:100%\">\n<tr>\n  <td>John </td>\n  <td>Peter </td>\n</tr>\n<tr>\n\
    \  <td>Fema </td>\n  <td>Nikol </td>\n</tr>\n</table>\n```\n\nWe have a table\
    \ with two rows of each of containing table data.\n\nBy setting the width to 100%\
    \ we make sure that it'll always spread 100% of the browsers window. But at the\
    \ moment it doesn't really look like the tables we're used to see.\n\nWe need\
    \ to put some borders. We do that by defining the border value inside the table\
    \ tag.\n\n<table border=\"1\" style=\"width:100%\">\n\nIf you don't specify a\
    \ border the table will be displayed without one. It's a lot better and even recommended\
    \ to use CSS border properties because the HTML one is on our way out. You can\
    \ learn all about them in my upcoming book about CSS styling.\n\nThe HTML table\
    \ headings are displayed by default as bold and centered. The syntax"
