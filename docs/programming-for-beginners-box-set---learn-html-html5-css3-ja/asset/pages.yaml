  md: '# Chapter 1: Introduction to PHP


    PHP stands for PHP: Hypertext Preprocessor, an open source scripting language
    whose scripts are executed on the server. It is downloadable and available for
    free. It is ideal for web development and recommended for beginners. It can be
    embedded into HTML. In addition, it can be used for WordPress and Facebook.


    A PHP file can contain HTML, JavaScript, CSS, PHP code, and text. What differentiates
    PHP from client-side JavaScript is that the codes are executed on the server,
    which generates the HTML that is sent to the client. After running the script,
    the client receives the results even if he does not know the underlying code.
    It is possible to configure the web server for the purpose of processing HTML
    files using PHP.


    PHP is simple enough to be understood by newbies, but it also offers a lot of
    advanced features for advanced programmers. You can even start writing simple
    scripts within just a few hours.


    Note that although its creation is focused on server-side scripting, there is
    so much more you can do with it.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Why You Should Learn PHP


    You may think that learning PHP is no longer necessary if you are adept at using
    JavaScript. However, JavaScript is actually much limited compared to PHP. JavaScript
    runs in the client or browser, which means that it only knows what occurs in your
    browser and the websites that you visit.


    On the other hand, PHP runs on the same computer or server as the website that
    you go to. It has access to every file and information on that computer, which
    enables it to create custom HTML pages that it sends to your browser, run tasks,
    perform calculations, and handle cookies from that website.


    PHP can open, create, write, read, close, and delete files on the server. It can
    generate page content, collect form data, and send receive cookies. It can also
    delete, add, and modify data in the database. In addition, it can encrypt data
    as well as control user access.


    With PHP, you can output PDF files, images, and Flash movies. You are not limited
    to just HTML. You can even output texts, such as XML and XHTML. In other words,
    PHP can practically do anything. Since it is focused on server-side scripting,
    it can do anything that CGI programs can do and more.


    PHP scripts are mainly used in the following areas:


    +   - Server-side scripting.

    It is the primary target field for PHP. To make it work, you have to use a PHP
    parser, a web browser, and a web server. You can run to the web server that has
    an installed PHP. You can use the web browser to access the PHP program and view
    the PHP page. If you have just started experimenting with PHP, you can do all
    of these on your computer.


    +   - Command line scripting.

    Even if you do not have a browser or a server, you can still run PHP. You just
    need to have a PHP parser. It is recommended for scripts that are executed regularly
    using Task Scheduler for Windows or cron for Linux. You can also use these scripts
    for simple text processing.


    +   - Creating desktop applications

    While it is true that PHP is not the number one for creating desktop applications
    with graphical user interfaces, you can still use it if you want to'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'include advanced features in your applications. You can use PHP-GTK to create
    such client-side applications. Also, you can write cross-platform applications.
    PHP-GTK is actually a PHP extension and it is not available in the primary distribution.


    You can use PHP on any major operating system, including Unix, Linux, Microsoft
    Windows, RISC OS, and Mac OS X. PHP is also supported by the majority of the web
    servers that are popular today, such as Apache and IIS. Any web server that can
    use CGI binary, such as nginx and lightttpd also use PHP. PHP can serve as a CGI
    processor or a module.


    You are free to choose any web server and operating system with PHP. Moreover,
    you can choose object oriented programming, procedural programming, or a combination
    of both. PHP can autogenerate your files and save them in your system rather than
    printing them out.


    One of the main advantages of PHP is that it supports a variety of databases.
    It is very easy to write a database-enabled web page using a database specific
    extension or an abstraction layer, such as PDO. You can also connect to a database
    that supports the Open Database Connection standard through the ODBC extension.


    What''s more, PHP has support for communication with other services via protocols
    such as IMAP, LDAP, SNMP, POP3, NTTP, COM, and HTTP. You can even interact and
    open raw network sockets using a protocol of your choice. PHP supports Java installation
    as well as WDDX data exchange between all programming languages.


    PHP also features text processing, including Perl Compatible Regular Expressions
    and other tools for parsing and accessing XML files. PHP standardizes XML extensions
    as well as adds XML Reader, XML Writer, and Simple XML support.


    PHP also has added PECL extensions, such as Xdebug.'
