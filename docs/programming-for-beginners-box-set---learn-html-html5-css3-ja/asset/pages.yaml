  md: '# Built-In Higher Mathematical Functions


    In PHP, you can actually perform complicated mathematical operations, such as
    getting the square root of a particular number. Take a look at this example:


    ```

    $rootvar = sqrt(25);

    $rootvar = sqrt($number);

    ```


    Using the above example, there is no more need for you to write all the mathematical
    operators necessary to compute the square root of 25. You simply have to use the
    built-in higher mathematical function included in PHP. The square root of 25 is
    done in the first statement, while the square root of the value of the variable
    is done in the second statement.


    Aside from getting the square root, you can also perform other operations, such
    as rounding up and rounding down integers. For example, if you want to round up
    to the next integer, you can use $upnumber and ceil. Conversely, if you want to
    round down, you can use $downnumber and floor. Take a look at the following example:


    ```

    $upnumber = ceil(28.65);

    ```


    If you run the above example, you will get an output of:


    ```

    29

    ```


    because 29 is the next integer after 28. On the other hand, if you write


    ```

    $downnumber = floor(28.65);

    ```


    you will get an output of:


    ```

    28

    ```


    obviously because the closest integer to that value is 28.


    In PHP, there are a lot of mathematical functions. You can use minimum, maximum,
    and random numbers for simple mathematical operations. You can also use functions,
    such as tangent and sine, if you want to do advanced mathematics. You can even
    convert binary and octal numbers.'
