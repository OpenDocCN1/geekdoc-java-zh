  md: '# Chapter 8


    # HTML Styles


    By default all HTML elements have a default style of the background and text color.

    (white for the background and black for the text.)


    However we can change these values using the style attribute.


    Here''s an example:


    ```

    <body style="background-color:lightblue">

    <p> Showing the body style attribute </p>

    ```


    We have the style attribute followed by value for it. In our case that''s the
    background-color:lightblue.


    Shown in the browser the output looks like this:


    ![](img/f1f3317e3c574b724055b1c9e128d700_17_0.png)


    The syntax of the HTML style attribute is the following:


    **style="property : value** the <h1> and <p> attributes are the same:


    ```

    <h1 style="color:red"> This is the Heading </h1>

    <p style="color: green"> This is the paragraph </p>

    ```


    We''re putting the **style** attribute inside the opening tag with the proper
    syntax. With the **style** attribute you can also change the fonts, text size
    and alignment.


    ```

    <h1 style="font-family:georgian"> This is the Heading </h1>

    <p style="font-family: courier"> This is the paragraph </p>

    ```


    Or:'
