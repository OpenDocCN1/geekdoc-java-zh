  md: '# Chapter 7


    # HTML Paragraphs


    As you probably saw earlier the <p> element defines a paragraph.


    Now let''s make a more depth review of the paragraphs.


    We already know that they are used to display text on our web page. How this text
    is displayed on the users screen on the other hand is completely different thing.
    Some people have small screens and have bigger screens which lead to different
    display of the text. Every browser displays the text according to the screen resolution
    removing all extra spaces and lines in your code.


    In other words:


    ```

    <p> This paragraph

    contains a lot of lines in the source code

    but when you display it

    the browser will ignore them.

    </p>

    ```


    The paragraph above will show on your screen like this:


    This paragraph contains a lot of lines in the source code but when you display
    it the browser will ignore them.


    If you want to start a new line in the same paragraph you have to use the <br>
    tag. (same as the <hr> tag there is no closing tag here.) The other way of starting
    a new line is simply by closing the paragraph tag and starting a new one.


    +   - To Do....


    Write a couple of paragraphs. In the first one try the example above. Then try
    making a new paragraph and use the line break tag <br>.


    Also you can use multiple <p>.


    Let''s go to the next chapter where we''ll get familiar with HTML styles.'
