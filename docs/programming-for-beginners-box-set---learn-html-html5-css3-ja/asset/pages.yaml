  md: '# PART 2: CSS3


    # Chapter 3: What is CSS3?


    Earlier, we have mentioned that no matter how advanced HTML is, it cannot create
    a comprehensive and holistic website or application without the use of other elements.
    One of these is CSS, or Cascading Style Sheets


    “Cascading Style Sheets” is essentially a language that is used to describe the
    formatting (looks) of any document that was previously written in markup languages
    (such as HTML or XHTML). CSS is commonly used to modify the style of webpages
    and other interface written in the aforementioned languages, it may actually be
    used on any type of XML document -- even SVG, XUL, and plain XML. Along with Javascript
    and HTML, CSS is considered a cornerstone of the technology most websites use
    in order to produce visually appealing and engaging webpages, web app user interfaces,
    and even those in many mobile apps.


    CSS has been primarily designed to make separation of the document’s content from
    its presentation possible. i.e. colors, layouts, and fonts can be placed in a
    different document altogether, improving accessibility and providing more control
    and flexibility in its characteristics. This allows several HTML pages to have
    the same formats through specifying the pertinent .css file. This reduces repetition
    and complexity in the content and structure of the entire document, including
    the elimination of semantically insignificant tables (these were prevalent in
    the days when CSS was not a norm for all browsers).


    The separation between the content and formatting can also allow the programmer
    to show the same page of markups in varying styles for a variety of rendering
    methods - in print, on-screen, on Braille-based tactile devices, and when read
    by speech-based browsers on screen readers. CSS can also cause a different page
    style to display depending on the size of the screen or on the device (whether
    it is a phone, tablet, notebook, PC, etc.).'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'In addition to the above-features, the users of a page containing CSS may also
    opt to override the CSS file inside the page and use one that is stored in their
    device. If both the readers and authors do not have any CSS files specified, then
    the browser''s default style will be used. Like how CSS can influence these files
    immediately, CSS can also alter the hundreds of documents easily, by simply altering
    a few blocks or lines of code.


    The term "cascading" in CSS''s name was obtained from its behavior. The specification
    means a certain scheme that identifies priorities, determining which style rule
    will apply if more than a single rule is matched against a certain element. This
    "cascade" or weight of the rule is computed and assigned, so that its results
    become predictable.


    The specifications of CSS are also brought about by the W3C, just like in HTML.
    The Consortium even operates a CSS validation service for documents, which offers
    services for free.


    # CSS Selectors


    Selectors, in CSS parlance, are used to name which portion on the markup the specific
    style will apply to. This is done by matching the attributes and tags within the
    markup. The selectors may be applied to the following:


    +   - All elements of each certain type, such as the first-level headers or h1.

    - Elements that are identified by specific attributes, such as "id" (the identifier
    that is unique to the document), and "class" (the identifier that brings different
    elements within a document).

    - Elements in general, which still depends on how they are placed in relation
    to the others within the document tree.


    In the above areas where selectors apply, it must be remembered that IDs and classes
    are case-sensitive. These start with alphabet characters, and may include any
    alphanumeric characters as well as underscores. IDs, in particular, is only applied
    to a single instance of a single element.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'There are also pseudo-classes that CSS selectors use in order to allow formatting
    depending on the information which is not within the document tree. An example
    of a pseudo-class is “hover”, that serves to identify the content only once the
    user hovers “points to” the visible document with the mouse cursor. It is connected
    to one selector, such as in “a:hover” or “#elementid:hover”.


    The selectors can be merged in different ways to achieve a high level of flexibility
    and accuracy. There are multiple selectors that may be combined in a group to
    specify the elements by element type, location, class, ID, or a combination of
    these. The selectors’ order is also important. Consider the following:


