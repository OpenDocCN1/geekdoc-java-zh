  md: '# # Chapter 3


    # # HTML Basics


    The Hyper Text Markup Language is a set of markup tags. HTML Documents and pages
    are described by HTML tags and each HTML tag describes different document content.


    Now let''s see what these tags are all about.


    +   - All HTML documents must start with a type declaration: <!DOCTYPE html>


    This declaration says to the browser or the programmer that reads the file that
    this is HTML document.


    +   - The HTML document itself begins with `<html>` and ends with `</html>`


    As you can see we have an opening `<html>` and closing `</html>` tag. Every tag
    in HTML is closed simply by putting a `/` before the name of the tag. (There are
    exceptions to this rule. Some HTML tags do not have an `end tag`)


    +   - The visible part of the HTML document is between `<body>` and `</body>`
    tags.


    What do we mean by visible part? Let me show you a little example and I''ll explain.


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h1>My First Heading</h1>

    <p>My first paragraph.</p>

    </body>

    </html>

    ```


    So we have our declaration of HTML document followed by the opening `<html>` tag
    and then we have the `<body>` tag. Picture it like the human body for the moment.
    When you save the file and open it with your browser you''ll be able to see only'
