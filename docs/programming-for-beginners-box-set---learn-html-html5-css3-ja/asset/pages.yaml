    available for free. It makes use of Structured Query Language (SQL), which is
    the most commonly used language for accessing, managing, and adding content in
    databases. It is also known for its proven reliability, quick processing, flexibility,
    and ease of use. MySQL is a crucial part of nearly every open source PHP application.
    Some of the most popular PHP/MySQL-based scripts include Joomla, phpBB, and osCommerce.'
