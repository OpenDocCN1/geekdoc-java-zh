  md: "# The Continue Statement\n\nContinue is used to stop the current iteration\
    \ of a loop. It halts, but does not terminate it. It is also placed inside the\
    \ statement block that contains the code which the loop executes, just like break.\
    \ It is preceded by the conditional test. In a pass encountering continue statement,\
    \ the next pass begins while skipping the rest of the loop code. For:\n\n```\n\
    <?php\n$array = array (2, 4, 6, 8, 10);\nforeach ($array as $value)\n{\n    if\
    \ ($value ==4) continue;\n    echo \"The value is $value <br/>\";\n}\n?>\n```\n\
    \nIf you run this code, you will get an output of:\n\nThe value is 2\nThe value\
