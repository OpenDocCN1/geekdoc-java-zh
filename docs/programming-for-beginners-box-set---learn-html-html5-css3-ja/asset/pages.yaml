  md: '# Chapter 1: A First Look at Java


    Java is an object-oriented programming language that has a wide range of applications.
    However, if this is the first time you''ve come across Java or even programming,
    you may not be able to appreciate this definition. With that in mind, in this
    chapter we''re going to tackle programming terminologies and definitions so that
    you don''t end up overwhelmed by the succeeding chapters.


    # What is a Programming Language?


    Language, at its very core, is a way for humans to communicate. With the limited
    power of computers relative to the human brain, computers can''t easily learn
    how to interpret human language, especially with tone, facial expressions, and
    colloquialisms having the ability to give different meanings to a single statement.
    With that in mind, programming languages were born, with the complexities of the
    human language stripped leaving you with structured, rigid statements that leave
    no room for misunderstanding.


    Basically, a programming language is a way for humans to communicate with computers.


    # What is Object-Oriented Programming?


    Inheritance. One of the best ways to learn programming concepts is to connect
    them to real world examples, let''s start our discussion with inheritance using
    three simple questions:


    How would you describe a cellular phone?


    Typical answers would include: "It makes calls," "It can send text messages,"
    "It has a battery."


    How would you describe a smartphone?


    Typical answers would include: "It makes calls," "It can send text messages,"
    "It can take pictures, "It has a big screen, "It can run Facebook, Instagram,
    Twitter, and other apps, "It has a short battery life."


    How would you describe a dumb-phone?


    Typical answers would include: "It makes calls, "It can send text messages, "It
    has a long battery life, "It has an alphanumeric keypad, "It has a small screen."


    After answering these questions, you should now have a general idea of the following:'
  merge: -1
  pgno: 109
- img_proc: true
  md: '+   1. What a cellular phone''s general features are

    2. What a smartphone''s general features are

    3. What a dumb-phone''s general features are


    Which brings us to the idea of inheritance, an important concept in object-oriented
    programming. Notice how both smartphones and dumb-phones have the features of
    a cellular phone, with some additional features that merit creating a new subcategory
    that inherits all the features of a cellular phone while still being able to contain
    additional features exclusive to them.


    **Polymorphism.** As for the general features of a cellular phone that the smartphones
    and dumb-phones inherit, notice how smartphones can send text messages in a different
    manner compared to dumb-phones in terms of the available emoticons, multimedia
    capabilities, etc. This is because the changes in the implementation of the text
    messaging applications on the smartphone and dumb-phone override the default implementation
    in the original cellular phone. However, if a person asks to borrow a cellular
    phone for text messaging, you could give him a smartphone or a dumb-phone, both
    of which are acceptable despite containing differing implementations of the text-messaging
    feature. This phenomenon is known as polymorphism in the Java world; if something
    in your code asks for an object from a certain class, it''ll accept even one from
    its subclass.


    Wow! That''s quite a lot to take in! Now that we have talked about two of the
    most difficult yet important concepts in object-oriented programming, we can now
    afford to relax a bit as we cruise into the concept of classes and objects:


    **Classes.** The features you''ve listed for the cellular phone, dumb-phone, and
    smartphone basically tell you that any object manufactured with the aim of being
    considered a cellular phone, a dumb-phone, or a smartphone must contain all of
    those listed features. Classes serve as blueprints and basically tell you what
    to expect when you create an object from them.


    **Objects.** Objects are the building blocks of Java. When cellular phones, dumbphones,
    or smartphones are manufactured, they have their own memory and will eventually
    earn scratches and dents as people use them more frequently. This means that despite
    a hundred or even a million cellular phones, dumb-phones, or smartphones being
    manufactured, each one will be more unique with continued usage. In short, objects
    are the products manufactured from the blueprint (class).


    # **What is Java?**


    Like human languages, programming languages come in many different flavors, one'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'of which is Java. Being an object-oriented programming language, the concepts
    of objects, classes, inheritance, and polymorphism apply to Java as well.


    Java is one of the most popular programming languages to date. Most introductory
    programming books and courses would use Java to illustrate different concepts
    in programming because of its ease, flexibility, and wide range of applications.


    Two other programming languages that also come to mind when it comes to programming
    for the first time: C and Python. However, C lies on the more difficult side of
    the spectrum whereas Python lies on the easier side of the spectrum. Java are
    fundamentally different – C is a procedural, function-oriented language, which
    contains just the right balance of complexity and ease of learning. Also, C and
    Python means that it''s good for programs that need new functions or operations
    added easily, and Python can be procedural, object-oriented, but may give the
    beginner a scaffolding too high to learn the basics of programming.


    # Conclusion


    You''ve been given a rather quick overview on the concept of programming, the
    concepts of object-oriented programming, and Java. While this chapter is by means
    a thorough discourse in these three important topics, it should be enough to help
    you understand majority of the stuff we''re going to be talking about throughout
    this book. The next chapter is going to talk about getting your computer ready
    for writing, compiling, and running Java code, so take a break and come back when
    you''re ready to dive deeper into the world of Java.'
