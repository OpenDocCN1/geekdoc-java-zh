  md: 'could store. Java provides a lot of data types you can choose from, so it''s
    important to know the most commonly used ones:


    # **Primitive data types.** Also known as built-in data types, these are the ones
    that Java has already created simply because many programmers use them lot. Here
    are the primitive data types Java has in:


    +   - int this data type stands for "integer" and is one of the most common data
    types available. Only whole numbers can be stored and the minimum value is about
    -2^31 and the maximum value is about 2^31. If not given an initial value, it''ll
    have zero by default.

    - byte this data type is a lot smaller than int – only having possible values
    ranging from -128 to 127. This data type isn''t commonly used, except when dealing
    with large arrays that can potentially consume large amounts of memory.

    - short this data type is smaller than int but bigger than. The range of allowed
    values is from -3268 to 3267. Usually used when dealing with large arrays that
    can potentially consume large amounts of memory, but also need a wider range than
    the byte type.

    - long this data type is larger than int, having a range of allowed values from
    -9,223,372,036,845,775,808 to 9,223,372,036,845,775,807! The default value, unlike
    the previous data types, is 0L.As you can see, you''ll rarely need this range
    of values in a regular Java application, stick with the int data type unless you
    know what you''re doing.

    - float this data type lets you store numbers with decimal points. The default
    value is 0.0f.

    - double this data type is like float, but with double the precision. The default
    value is 0.0d. In most cases, double is preferred when dealing with decimal values,
    so stick with this one instead of float.

    - booleanthis is the smallest data type available, with only two possible values,
    0 or 1 , but can also be written as true or false .

    - char this data type allows you to store one character, from ‘\u000’ to ‘\ffff’.
    Basically this means you can put one number, or any other symbol that''s considered
    a 16 bit Unicode character.


    # **Non-primitive data types.** Since primitive data types are data types that
    Java already made, non-primitive data types are data types that Java didn''t make;
    rather, programmers made them for a specific Java application. This would include
    classes, arrays, and interfaces.'
  merge: -1
