    # CSS Whitespace


    In CSS, the whitespaces between the properties selectors are ignored. Consider
    the following code snippet:


    ```

    Body{overflow:hidden;background:#000000;}

    ```


    This is functionally equivalent to a similar snippet with spaces in between. Many
    programmers format CSS in such as way to give each property its own line, but
    this is only to aid in the code’s human readability (also allows faster troubleshooting
    when there is a bug on the code). When fed to a computer, all these spaces will
    be ignored.


    # Meaning of “CSS3”


    In previous CSS specifications, the structure was such that a large single specification
    that defines various features defines. CSS3 deviates from this norm in that it
    is split into several documents, called “modules”. Each of these modules add new
    capabilities, or extend the existing features defines in CSS2. CSS3 also preserves
    backward compatibility.


    Due to the modular approach, the different modules of CSS3 have different stability'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'levels and statuses. Those that have “formal recommendation status” have the
    highest stability, while those that are considered of “candidate recommendation”
    (CR) status are thought to be moderately stable.


    All due to the approach, there are some modules that have “leveled up” into level
    4 (CSS4) standing. These are very limited in number, and include Selectors, Backgrounds
    and Borders, and Image Values. There are also new functionalities such as the
    “flexbox” which is still considered “level 1”.


    # CSS Browser Support


    Not all browsers can correctly parse all CSS codes. Because of this, coding techniques
    known as “CSS hacks” can either filter or target (or both) specific browsers.
    These are generally known as CSS filters, and can be used to show or hide parts
    of the CSS to certain browsers -- achieved by exploiting the CSS handling bugs
    in each browser (or by taking advantage of the lack of support for a few parts
    of the many CSS specifications.


    Through these filters, some programmers have gone as far as delivering different
    style sheets to certain browsers. This technique will ensure that the design will
    render as the programmer expects.


    Some programmers also use CSS filters in order to prevent old browsers from seeing
    the CSS completely. This is because such old browsers are in the first place incapable
    of rendering CSS properly.


    Despite the availability of many CSS-compliant browsers, there are still a lot
    of programmers who struggle with those that do not. This turns what would have
    been a viable technology into something that is more costly and complex than is
    originally intended.


