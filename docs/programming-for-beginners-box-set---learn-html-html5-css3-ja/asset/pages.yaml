  md: "# Reading Files\n\nAfter you open a file using the function fopen ( ), you\
    \ can read it using the function fread ( ). It requires two arguments. It reads\
    \ the length bytes from the file pointer referenced by the handle. It stops reading\
    \ as soon as it has read the length bytes, reaches the end of the file, a socket\
    \ timeout occurs, or a packet becomes available.\n\nYou can use the function filesize\
    \ () to find the length of your file. It takes the file name as an argument and\
    \ returns its size in bytes. It also returns false on failure or the read string.\
    \ Take note that the function read() reads from the current position of your file\
    \ pointer. If you want to find the current position of the file pointer, you have\
    \ to use the function ftell ( ). If you want to rewind the position of the file\
    \ pointer, you have to use rewind ( ).\n\nTake a look at the following example:\n\
    \n```\n<?php\n$filename = \"testfile.txt\";\n$file = fopen($filename, \"r\");\n\
    if ($file == false) {\n    echo (\"Opening File Error\");\n    exit ( );\n}\n\
    $files = filesize($filename);\n$filetext = read($file, $files);\nfclose($file);\n\
    echo (\"The size of the file is $files bytes\");\necho (\"<pre>$text</pre>\");\n\
    ?>\n```\n\nIn the above example, the content of the text file testfile.txt is\
    \ assigned to a variable and then displayed as the output."
