    commenting the parts you want the compiler to run and the parts you want the compiler
    to ignore, respectively.

    - Giving other people, or your future self a rather thorough explanation of how
    your code works


    Number 1 is useful for debugging and tinkering with the flow of your program.
    By seeing what turning off and turning off specific parts of your program does,
    you can easily'
