  md: "# Chapter 3: Your First World Program\n\nTradition has it when you’re learning\
    \ a programming language for the first time, your first program outputs “Hello\
    \ World” to the screen. That being said, here’s the Java code for your first hello\
    \ world program:\n\n```\nclass MyFirstProgram {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nRemember\
    \ to save this file as “MyFirstProgram.java” since Java considers the name of\
    \ the Java source code to be the name of the main class of the program.\n\nBefore\
    \ running the program, let’s talk a bit about the source code. MyFirstProgram\
    \ is the program’s class, where main() is a method it contains. Inside the main()\
    \ method lies the System.out.println() function, which basically gets whatever\
    \ text you put inside and gives it to the command line or terminal to display.\n\
    \nNow that you know a bit about the source code, compile the Java source code\
