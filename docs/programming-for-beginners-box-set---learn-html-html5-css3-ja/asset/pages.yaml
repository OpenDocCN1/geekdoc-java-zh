  md: '# Chapter 4: Arrays


    An array is a special variable that stores multiple values one at a time. It is
    basically a list of items. For instance, if you want to store a list of names,
    you can store them in single variables such as:


    ```

    $name1 = "Wendy";

    $name2 = "Dawn";

    $name3 = "David";

    ```


    However, if you want to create a loop through these names, you need an array.
    Arrays can hold numerous values in one name and allow you to access these values
    when you refer to an index number.


    To put it in a much simpler perspective, an array is like a grocery list. It lets
    you store more than one item in one variable. When you create your grocery list,
    you can use separate pieces of paper for every item that you have to buy. These
    items are like the variables that you store.


    Using separate pieces of paper for your grocery items is unnecessary though. It
    is such a hassle and a total waste of paper. So, instead of doing this, you can
    just write down everything you need to buy in a single piece of paper. This single
    piece of paper is just like an array.'
  merge: -1
  pgno: 154
- img_proc: true
  md: "# How to Create an Array\n\nThe array ( ) function in PHP is used to create\
    \ arrays. Any number of comma-separated key => value pairs can be used as arguments.\
    \ For instance,\n\n```\narray (\n    key1 => value1,\n    key2 => value2,\n...\n\
    )\n```\n\nThe last array may or may not have a comma. Single-line arrays are actually\
    \ better off without commas. So instead of writing array (1, 2, ), you should\
    \ write array (1, 2). Multi-line arrays, however, are preferred to have trailing\
    \ commas because they make the addition of new elements easier.\n\nThere are actually\
    \ three types of arrays: associative, indexed, and multidimensional. Associative\
    \ arrays are arrays that have named keys. Indexed arrays are arrays that have\
    \ a numeric index. Multidimensional arrays are arrays that contain one or more\
    \ arrays.\n\nThe syntax for associative arrays is:\n\n```\narray (key => value,\
    \ key => value, etc.);\n```\n\nFor example:\n\n```\n<?php\n$price = array(\"cantaloupes\"\
    \ => \"2\", \"grapes\" => \"3\", \"strawberries\" => \"4\");\necho \"Cantaloupes\
    \ cost \" . $price['oranges'] . \". dollars each\";\n?>\n```\n\nThe syntax for\
    \ index arrays is:\n\n```\narray(value1, value2, etc);\n```\n\nThere are two ways\
    \ how you can write indexed arrays. You can allow the index to be automatically\
    \ assigned or assign it manually.\n\nTake a look at this example of an automatically\
    \ assigned index:\n\n```\n$fruits = array(\"apples\", \"bananas\", \"kiwis\");\n\
    ```"
  merge: -1
  pgno: 155
- img_proc: true
  md: "And here is = example of a manually assigned index:\n\n```\n$fruits [0] = \"\
    apples\";\n$fruits [1] = \"bananas\";\n$fruits [2] = \"kiwis\";\n```\n\nAs for\
    \ multidimensional array, here is an example of a two-dimensional array:\n\n```\n\
    <?php\n$fruits = array (\n  array(\"apples\", 10, 6),\n  array(\"bananas\", 4,\
    \ 5),\n  array(\"kiwis\", 11, 10)\n);?>\n```\n\nIn PHP 5.4, array () can be replaced\
    \ with [ ]. This is called the short array syntax.\nFor example:\n\n```\n<?php\n\
    $name = array (\n  \"Wendy\" => \"Dawn\",\n  \"Dawn\" => \"Wendy\",\n);\n```\n\
    \ncan be written like this if you are using PHP 5.4:\n\n```\n<?php\n$name = [\n\
    \  \"Wendy\" => \"Dawn\",\n  \"Dawn\" => \"Wendy\"\n];?>\n```\n\nA string or an\
    \ integer can be the key. The value can also be of any type. In addition, these\
    \ key casts are expected to occur:\n\nFloat. It is cast to an integer, truncating\
    \ the fractional part. For example, the key 9.7 is going to be stored under 9."
