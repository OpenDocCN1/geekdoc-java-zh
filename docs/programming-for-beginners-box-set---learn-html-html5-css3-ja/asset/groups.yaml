- md: "\n# Chapter 7: Opening, Reading, Writing, and Closing Files\n\n## Opening and\
    \ Closing Files\n\nIn PHP, the function fopen() is used to open files. It requires\
    \ two arguments that state the file name and the mode in which it has to operate.\n\
    \n| Mode | Purpose |\n| --- | --- |\n| r | It opens the file for the sole purpose\
    \ of reading. It positions the pointer at the start of the file. |\n| r+ | It\
    \ opens the file for both reading and writing. It positions the pointer at the\
    \ start of the file. |\n| w | It opens the file for the sole purpose of writing.\
    \ It positions the pointer at the start of the file, as well truncates it to zero\
    \ length. If there are no files, it tries to create one. |\n| w+ | It opens the\
    \ file for both reading and writing. It positions the pointer at the start of\
    \ the file, as well truncates it to zero length. If there are no files, it tries\
    \ to create one. |\n| a | It opens the file for the sole purpose of writing. It\
    \ positions the pointer at the end of the file. If there are no files, it tries\
    \ to create one. |\n| a+ | It opens the file for both reading and writing. It\
    \ positions the pointer at the end of the file. If there are no files, it tries\
    \ to create one. |\n\nThe function fopen() returns the value of false in case\
    \ opening a file does not become successful. Otherwise, it returns a file pointer\
    \ to write or read to that particular file.\n\nOnce you are done making changes\
    \ to your file, you have to close it using the function fclose(). It requires\
    \ a file pointer as an argument. It returns true if the closure is successful\
    \ and false if it is not.\n\n## Reading Files\n\nAfter you open a file using the\
    \ function fopen(), you can read it using the function fread(). It requires two\
    \ arguments. It reads the length bytes from the file pointer referenced by the\
    \ handle. It stops reading as soon as it has read the length bytes, reaches the\
    \ end of the file, a socket timeout occurs, or a packet becomes available.\n\n\
    You can use the function filesize() to find the length of your file. It takes\
    \ the file name as an argument and returns its size in bytes. It also returns\
    \ false on failure or the read string. Take note that the function read() reads\
    \ from the current position of your file pointer. If you want to find the current\
    \ position of the file pointer, you have to use the function ftell(). If you want\
    \ to rewind the position of the file pointer, you have to use rewind().\n\nTake\
    \ a look at the following example:\n\n```php\n<?php\n$filename = \"testfile.txt\"\
    ;\n$file = fopen($filename, \"r\");\nif ($file == false) {\n    echo (\"Opening\
    \ File Error\");\n    exit();\n}\n$files = filesize($filename);\n$filetext = read($file,\
    \ $files);\nfclose($file);\necho (\"The size of the file is $files bytes\");\n\
    echo (\"<pre>$filetext</pre>\");\n?>\n```\n\nIn the above example, the content\
    \ of the text file testfile.txt is assigned to a variable and then displayed as\
    \ the output.\n\n## Writing Files\n\nIf you want to write a new file or append\
    \ a text to a existing file, you can use the function `fwrite()`. It requires\
    \ two arguments to specify the file pointer and the data string to be written.\
    \ You can include a third integer argument if you want to specify the length of\
    \ the data to be written. This third integer argument is optional, though. If\
    \ you do not include any third argument, writing would stop upon reaching the\
    \ specified length.\n\nThe function `fwrite()` writes the contents of the string\
    \ to the file stream pointed to by the handle. It returns false on error or the\
    \ number of bytes. If you are using a system that differentiates between text\
    \ files and binary files, such as Windows, you should open your file with 'b'\
    \ included in the `fopen()` mode. Also, if the handle is opened in append mode,\
    \ `fwrite()` becomes atomic, except when the size of the string exceeds the block\
    \ size of the file system. There is no more need to `flock()` a resource before\
    \ you call `fwrite()`. You can write all data without any interruption.\n\nTake\
    \ a look at the following example:\n\n```php\n<?php\n$file = fopen(\"testfile.txt\"\
    , \"w\");\necho fwrite($file, \"Testing sample!\");\nfclose($file);\n?>\n```\n\
    \nIf you run the above code, you will get an output of:\n15\n\nWhy? You get 15\
    \ because *Testing sample!* has fifteen characters including spacing.\n\n## Conclusion\n\
    \nThank you again for downloading this book!\n\nI hope this book was able to help\
    \ you learn about PHP and MySQL, and how to write codes.\n\nThe next step is to\
    \ apply what you have learned in this book.\n\n![](img/f1f3317e3c574b724055b1c9e128d700_183_0.png)\n\
    \nFinally, if you enjoyed this book, please take the time to share your thoughts\
    \ and post a review on Amazon. It'd be greatly appreciated!\n\nClick here to leave\
    \ a review on Amazon.\n\nThank you and good luck!\n"
  mdcn: "\n\n# 第7 章：文件的打开、读取、写入和关闭\n\n## 打开和关闭文件\n\n在 PHP 中，使用 `fopen()` 函数来打开文件。它需要两个参数：指定文件名和操作的模式。\n\
    \n| 模式 | 目的 |\n| --- | --- |\n| r | 以只读模式打开文件。它将指针置到文件的开头。 |\n| r+ | 以读写模式打开文件。它将指针置到文件的开头。\
    \ |\n| w | 以只写模式打开文件。它将指针置到文件的开头，并将其截断为零长度。如果文件不存在，它会尝试创建一个。 |\n| w+ | 以读写模式打开文件。它将指针置到文件的开头，并将其截断为零长度。如果文件不存在，它会尝试创建一个。\
    \ |\n| a | 以追加模式打开文件。它将指针置到文件的末尾。如果文件不存在，它会尝试创建一个。 |\n| a+ | 以读写模式打开文件。它将指针置到文件的末尾。如果文件不存在，它会尝试创建一个。\
    \ |\n\n如果打开文件失败，`fopen()` 函数将返回 `false` 值。否则，它将返回一个指向该文件以进行写入或读取的文件指针。\n\n一旦你完成了对文件的修改，就必须使用\
    \ `fclose()` 函数关闭它。它需要一个文件指针作为参数。如果关闭成功则返回 `true`，否则返回 `false`。\n\n## 读取文件\n\n\
    在用 `fopen()` 函数打开文件后，你可以使用 `fread()` 函数来读取它。它需要两个参数。它从句柄引用的文件指针读取指定长度的字节。一旦读取了指定长度的字节、到达文件末尾、发生套字超时或数据包可用，读取就会停止。\n\
    \n你可以使用 `filesize()` 函数来查找文件的长度。它接受文件名作为参数，并返回以字节为单位的大小。如果失败则返回 `false`，否则返回读取字符串。请注意，`read()`\
    \ 函数是从文件指针的当前位置读取的。如果你想找到文件指针的当前位置，必须使用 `ftell()` 函数。如果你想重置文件指针的位置，必须使用 `rewind()`。\n\
    \n请看下面的示例：\n\n```php\n<?php\n$filename = \"testfile.txt\";\n$file = fopen($filename,\
    \ \"r\");\nif ($file == false) {\n    echo (\"Opening File Error\");\n    exit();\n\
    }\n$files = filesize($filename);\n$filetext = read($file, $files);\nfclose($file);\n\
    echo (\"The size of the file is $files bytes\");\necho (\"<pre>$filetext</pre>\"\
    );\n?>\n```\n\n在上面的示例中，文本文件 testfile.txt 的内容被赋值给变量，然后作为输出显示。\n\n## 写入文件\n\n如果你想写入新文件或向现有文件追加文本，可以使用\
    \ `fwrite()` 函数。它需要两个参数来指定文件指针和要写入的数据字符串。如果你想指定写入数据的长度，可以包含第三个整数参数。不过，这个第三个整数参数是可选的。如果你不包含第三个参数，写入将在达到指定长度后停止。\n\
    \n`fwrite()` 函数将字符串的内容写入句柄指向的文件流。出错时返回 `false`，否则返回写入的字节数。如果你使用的是一个区分文本文件和二进制文件的系统（例如\
    \ Windows），你应该在 `fopen()` 模式中包含 'b' 来打开文件。此外，如果句柄是以追加模式打开的，`fwrite()` 将变成原子的，除非字符串的大小超过了文件系统的块大小。在调用\
    \ `fwrite()` 之前不再需要对资源进行 `flock()`。你可以无中断地写入所有数据。\n\n请看下面的示例：\n\n```php\n<?php\n\
    $file = fopen(\"testfile.txt\", \"w\");\necho fwrite($file, \"Testing sample!\"\
    );\nfclose($file);\n?>\n```\n\n如果你运行上面的代码，将得到输出：\n15\n\n为什么？因为 *Testing sample!*\
    \ 包括空格在共有十五个字符。\n\n## 总结\n\n再次感谢下载这本书！\n\n我希望这本书能够帮助你学习 PHP 和 MySQL 以及如何编写代码。\n\
    \n下一步是应用你在书中学学到的知识。\n\n![](img/f1f3317e3c574b724055b1c9e128d700_183_0.png)\n\n\
    最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表评论。我们将不胜感激！\n\n点击此处在 Amazon 上发表评论。\n\n感谢并祝你好运！\n\
    \n"
