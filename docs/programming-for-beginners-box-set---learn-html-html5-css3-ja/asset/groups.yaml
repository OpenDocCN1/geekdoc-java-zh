    # Chapter 2: Setting Up Your Computer for Java


    Welcome back. Recall that in Chapter 1 you''ve been given an introduction to Java
    from the ground up. In this chapter, we''re going to set your computer up for
    Java so that you can write, compile, and run Java code without problems unrelated
    to the creation of code itself. At the end of this chapter, you should have all
    the tools you need to create your first Hello World program, so hang there and
    not skip this chapter unless you''re sure that you already have all the tools
    you need!


    # The Set-Up


    In any programming language, there are three things you need to have:


    +   1. Something that lets you write code

    2. Something that converts what you wrote into something the computer understands

    3. Something that runs your program


    So let''s go through them by one:


    **Something that lets you write code.** Basically we''re talking about some sort
    of text editor. The default one installed on your computer can definitely write
    Java code, but to date, only Linux operating systems have text editors that can
    syntaxhighlighting capabilities while being easy to use. Syntax highlighting basically
    means variables, class names, etc. are colored differently to make coding a lot
    easier on the eyes. That being said, here are some of the best text editors for
    writing Java code:


    +   a. Notepad++ - Notepad++ is one of the most known text editors for Windows
    because it''s free and it could run from flash drives or even from Dropbox. It
    supports a wide variety of programming languages, as the name suggests, it can
    completely replace the preinstalled notepad application. In a nutshell, it''s
    free, fast to use, and flexible, if you have a Windows system, there is no reason
    not to have this program installed.

    b. Atom - Atom is one of the most powerful text editors created for programmers,
    by programmers. A lot of programmers love this text editor because it''s highly
    customizable not only in terms of how it looks, but also how it behaves. Atom
    definitely takes longer to load Notepad++, but once it''s running, you definitely
    won''t feel a hiccup in performance. Atom runs in Windows, Mac, and Linux, if
    you''re up for a more advanced text editor packed with lots of customization options
    and neat features, try it out for yourself.

    c. Vim - Vim is known as a simpler version of Vi. A lot of advanced'
  - '[PAGE 113]


    programmers prefer this text editor because the interface is highly customizable.


    +   Eclipse – (IDE). – technically not a text editor, but an Integrated Development
    Environment. In Eclipse, you just type in your Java code while it helps you remember
    variable, function, and class names and check for errors. With a single click,
    Eclipse compiles your code and runs it. In this it''s recommended that you stick
    to using text editors so you''ll learn not to depend too much on Eclipse to complete
    and correct your code for you.


    # Something that converts what you wrote into the computer understands. We''d
    need a compiler, which converts your Java source code into something that the
    Java Virtual Machine understands (bytecode) so that it can do what it''s supposed
    to do. You''ll need to get the latest Java Development Kit (JDK) from oracle.com.
    It is free and contains a straightforward, foolproof installation scheme (for
    Windows users, you''ll need to update your PATH variable. Don''t worry though;
    instructions for doing this are also straightforward), but remember to download
    the Java Standard Edition that corresponds to your operating system.


    # Something that Runs Your Program. In terms of programming, a platform is a bunch
    of programs that help programs written in the Java programming language. Java
    contains an execution engine commonly referred to as a virtual machine, and a
    compiler that makes sure that the programs you write work the same way for computers
    with different operating systems and hardware. In nutshell, Java programs don''t
    run directly from the operating system though it appears so; they run on top of
    a platform that makes sure that the programs don''t end crashing because a user
    changed his processor or upgraded his operating system.


    # The Three Java Platforms


    There are different kinds of platforms in Java to choose from depending on the
    type of device:


    +   Java Card – this platform is new, and it applies to applets, which are tiny
    Java-based programs, to run on devices with limited memory like smart cards.

    Java Standard Edition (Java SE) – this platform is used for creating Java applications
    that can run on desktop computers and web browsers.

    Java Enterprise Edition (Java EE) – this platform is built on top of Java SE.
    From its name, it''s useful if you''re running a server, as it allows you to create
    server applications.

    Java Micro Edition (Java ME) – this platform built on top of Java SE as well.
    From its name, it''s useful if you need to create Java applications for embedded
    devices (Xlets), for mobile information devices (MIDlets), and basically any other
    devices that have limited display, storage, and power.'
