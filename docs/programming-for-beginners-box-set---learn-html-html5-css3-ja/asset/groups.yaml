    这引出了我们**继承**的概念，这是面向对象编程中的一个重要概念。注意看智能手机和功能手机都具有手机的特征，并且带有一些额外的特征，这足以创建一个子类，该子类继承手机的所有特征，同时还能包含它们特有的额外特征。


    **多态。** 至于智能手机和功能手机继承的手机通用特征，请注意智能手机在可用表情、多媒体能力等方面，发送短信的方式与功能手机有所不同。这是因为智能手机和功能手机上短信应用程序的实现发生了变化，覆盖了原始手机的默认实现。然而，如果有人请求借用手机发短信，你可以给他一部智能手机或一部功能手机，尽管它们包含的短信功能实现方式不同，但这两者都是可以接受的。这种现象在
    Java 世界中被称为多态；如果你的代码中某个部分请求某个特定类的对象，它甚至会接受来自其子类的对象。


    哇！这要吸收的信息真多！现在我们已经讨论了面向对象编程中最两个困难但也最重要的概念，我们现在可以稍微放松，进入类和对象的概念了：


    **类。** 你为手机、功能手机和智能手机列出的特征基本上是在告诉你，任何以被认为是手机、功能手机或智能手机为目标而制造的对象，都必须包含所有列出的特征。类充当了蓝图的角色，基本上告诉你当你从它们中创建对象时可以预期得到什么。


    **对象。** 对象是 Java 的构建块。当手机、功能手机或智能手机被制造时，它们有自己的内存，并随着人们频繁的使用，最终会产生划痕和凹痕。这意味着尽管制造了成百上万部手机、功能手机或智能手机，每一部随着持续的使用都会变得更加独特。简而言之，对象是从蓝图（类）制造出来的。


    # 什么是 Java？


    就像人类语言一样，编程语言有很多种类，其中一种就是 Java。作为一种面向对象的编程语言，对象、类、继承和多态的概念同样适用于 Java。


    Java 是迄今为止最受欢迎的编程语言之一。由于其易用性、灵活性和广泛的应用，大多数入门编程书籍和课程都会使用 Java 来解释编程中的不同概念。


    提到第一次编程时，还会想到的另外两种编程语言：C 和 Python。然而，C 位于光谱中较困难的一侧，而 Python 位于较容易的一侧。Java 从根本上是不同的——C
    是一种过程化的、面向函数的语言，包含了复杂性和易学性的恰好平衡。此外，C 和 Python 意味着它们对于容易添加新函数或操作的程序很好，而 Python
    可以是过程化的、面向对象的，但可能会给初学者一个过高的学习编程基础的脚手架。


    # 结论


    你已经对编程概念、面向对象编程概念以及 Java 有了相当快速的概述。虽然本章对这三个重要主题进行了详尽论述，但它足以帮助你理解我们在本书中将讨论的大部分内容。下一章将讨论如何准备你的计算机来编写、编译和运行
    Java 代码，所以请休息一下，在你准备好深入探索 Java 的世界时再回来。


    # 第 2 章：为你的计算机配置 Java 环境


    欢迎回来。记得在第 1 章中，你已经从底层了解了 Java。在本章中，我们将为你的计算机配置 Java 环境，以便你可以编写、编译和运行 Java 代码，而不会遇到与代码创建本身无关的问题。在本章结束时，你应该拥有创建第一个
