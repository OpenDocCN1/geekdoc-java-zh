  mdcn: '

    HTML 语法的声明始终为 "<!DOCTYPE html>"。请始终记住，这是不区分大小写的。由于语言是基于 SGML 的，因此来自旧版本的 doctypes
    已不再被使用。


    对于尚不支持缩短版 doctype 的旧版标记生成器，仍然可以使用 "<!DOCTYPE html SYSTEM "about:legacy-compat>"。此外，允许使用针对
    HTML4.01、HTML4、XHTML1.1 和 XHTML1 的 doctypes，但不建议这样做。


    对于那些使用 XML 媒体类型的文档，它们始终在标准模式下进行处理，因此可以使用任何 doctype 声明。


    ## SVG 和 MathML


    HTML 语法还支持在文档中使用 SVG 和 MathML 元素。"svg" 或 "math" 起始标签会使解析器切换到一种特殊的插入模式，将元素和属性放在适当的命名空间中。这在元素和属性采用混合大小写的情况下也能进行修复。它还支持像
    XML 一样的空元素语法。与之前一样，该语法是不区分大小写的。可以省略命名空间声明。


    某些元素会引起解析器切换回 HTML 模式，例如 "mtext" 和 "foreignObject"。使用这些元素时，程序员可以使用不同的 HTML 元素，或新的
    "svg" 或 "math" 元素。


    ## 语法的其他更改


    - 命名为 "&lang;" 和 "&rang;" 的字符现在展开为数学左右角括号，而不是普通的左或右指向角括号。

    - 空元素（Void elements）现在可以有一个尾随斜杠（这在 HTML4 中被称为 "EMPTY"）。

    - 与之前的 HTML4 相比，& 符号（和符号）在更多情况下可以留空不转义。

    - 不同的属性之间需要至少一个空白字符分隔。

    - 属性为空的不同属性必须重写为仅保留名称，而不带等号和值。这甚至适用于非布尔属性。

    - 与之前的 HTML 版本相比，在值处省略引号的属性允许使用更宽范围的字符集。


    - 解析器不会对属性值内的空白进行归一化。例如，"id" 属性中的头部和尾空格不会被忽略（因此现在被认为无效），而换行符现在可以在 "input" 元素的
    "value" 属性中使用，而无需使用字符引用。

    - 结束标签 "optgroup" 现在是可选的。

    - 起始标签 "colgroup" 也是可选的，可以由 HTML 解析器推断。


    ## 第 2 章：HTML5 中的语言更改


    HTML5 引入了以下元素，以提供更好的结构：


    - **Section（章节）** - 代表通用的应用程序章节或文档。为了指示文档结构，应将其与标题元素（“h1”、“h2”、“h3”等）配合使用。

    - **Article（文章）** - 代表文档内容的独立部分。这可能是一个博客或一篇新闻文章。

    - **Main（主体）** - 代表文档或应用主体的主要内容。

    - **Aside（侧边）** - 代表与页面其他内容仅部分相关的内容。

    - **Header（头部）** - 代表导航辅助或介绍部分。

    - **Footer（页脚）** - 代表页面底部的部分，可以包含关于作者的信息、版权许可信息等。

    - **Nav（导航）** - 代表用于导航的文档章节。

    - **Figure（图）** - 代表一个自包含的区域，通常包含流内容。这通常被视为单个单元，与主文档不同。

    - **Figcaption（图说明）** - 可以作为图片的说明，尽管它是完全可选的。

    - **Template（模板）** - 可用于声明不同的 HTML 片段，这些片段可以被脚本复制并插入主文档。

    - **Video and Audio（视频和音频）** - 如前所述，这些用于多媒体内容。它们还允许 Web 开发者通过 API 编写自己的界面。

    - **Track（轨道）** - 用于视频元素，提供页面内的轨道。

    - **Embed（嵌入）** - 用于插件内容。

    - **Mark（标记）** - 代表被高亮的文本，通常由于其相关性。

    - **Progress（进度）** - 代表任务的完成情况，例如下载任务。

    - **Meter（仪表）** - 代表测量值，例如范围。

    - **Time（时间）** - 代表时间或日期。

    - **Ruby / Rt / Rp** - 允许对日期进行 Ruby 注释。

    - **Bdi（双向隔离）** - 代表一组与环境隔离的双向文本。

    - **Wbr（强制换行）** - 代表换行机会。

    - **Canvas（画布）** - 用于动态图形，例如游戏或图表。

    - **Datalist（数据列表）** - 与 input 结合，创建组合框。

    - **Keygen（密钥生成）** - 用于密钥对生成。

    - **Output（输出）** - 代表计算完成后的输出类型。


    Input 元素的 Type 属性还有以下新值：


    - Search（搜索）

    - Tel（电话）

    - URL（网址）

    - Email（电子邮件）

    - Time（时间）

    - Date（日期）

    - Range（范围）

    - Number（数字）

    - Color（颜色）


    这些新类型基于用户代理（即浏览器）可以提供所需界面的想法。这种界面从日历选择器到通讯录不等。用户代理还应该向服务器提交所需的格式。这将给用户带来更好的体验。


    ## 第二部分：CSS3


    ## 第 3 章：什么是 CSS3？


    我们之前提到，无论 HTML 多先进，如果没有其他元素，无法创建一个全面的网站或应用程序。其中之一就是 CSS。


    “级联样式表”本质上是一种用于描述之前用标记语言（如 HTML 或 XHTML）编写的文档格式的语言。CSS 通常用于修改上述语言编写的网页和其他界面，它实际上可以用于任何类型的
    XML 文档——甚至是 SVG、XUL 和纯 XML。与 JavaScript 和 HTML 一起，CSS 被认为是大多数网站制作具有视觉吸引力和交互性的网页、Web
    应用以及许多移动应用程序的技术基石。


    CSS 的设计初衷是为了实现文档内容与其呈现的分离。即：颜色、布局和字体可以放在完全不同的文件中，提高了可访问性并提供了更多的控制和灵活性。这允许多个 HTML
    页面通过指定相关的 .css 文件具有相同的格式。这减少了整个文档内容的重复和复杂性，消消除了无意义的表格。


    内容与格式的分离还允许程序员根据不同的渲染方法显示相同的标记页面——例如在打印、屏幕显示、在基于盲文的触觉设备上，以及通过屏幕阅读器的语音浏览器读取时。CSS
    还可以根据屏幕大小或设备（无论是手机、平板电脑、笔记本电脑还是 PC）导致不同的页面样式。

