    \n- 布尔型 (bool) – 布尔或 bool 数据类型有两个可能的值：true（真）或 false（假）。这对于创建条件非常方便。该数据类型的默认值是\
    \ false。请注意，与 C++ 不同，C# 中的布尔值没有数值。这意味着 true 不等于 1，也不等于 0。\n\n- 字符型 (char) – 字符\
    \ char 数据类型由单个 Unicode 字符或简单的文本表示。记住，这种特定数据类型仅使用单个字符，而 string 类型不同。该数据类型的默认值是\
    \ '\\u0027'。\n\n- 整数型 (int) – 对于基础编程目的，在处理数字时你将主要依赖整数或 int 数据类型。int 数据类型被认为是有符号整数，计算机使用二补码来识别它。int\
    \ 数据类型的默认值是 0。\n\n- 字符串型 (string) – 字符串数据类型基本上是字符序列。字符串也可以包含数字。当用名称、密码、单词以及基本任何其他使用字母数字的序列存储信息时，这是理想的。\n\
    \n- 小数型 (decimal) – 记住其他数据类型（即 float 和 double）可以与具有精确小数值的整数配合使用。然而，对于人类语言中的数值概念（金钱、测量等），使用\
    \ decimal 数据类型总是简单的。对于伪影或仅用于程序内计算目的的项，有时 float 或 double 更加合适。decimal 类型的默认值是 0.0M。\n\
    \n本书中不再详细阐述的数据类型如下：\n\n- **浮点型 (float)** – float 数据类型包含 32 位浮点值。它基本上是 floating\
    \ point 的缩写，指的是数字中某处的小数点。float 数据类型最多可以有 7 位数字。\n\n- **双精度型 (double)** – double\
    \ 类型与 float 类型相同，主要区别是可以存储多达 16 位。与 float 类型不同，double 表示 64 位双精度浮点。\n\n- **长整型\
    \ (long)** – long 是一种整数数据类型（没有小数点），可能包含从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
    \ 的数字。这是 64 位有符号整数的范围。注意，表示 32 位有符号整数的 int，范围是 -2,147,483,648 到 2,147,483,647。\n\
    \n- **短整型 (short)** 与 int 和 long 数据类型相比，short 类型表示 16 位有符号整数类型，范围从 -32,768 到 32,767。\n\
    \n- **Sbyte** – sbyte 代表包中最小的类型；表示 8 位有符号整数，包含从 -128 到 127 的数字。\n\n- **Byte, Uint,\
    \ Ulong, Ushort** – 这些是 sbyte, int, long 和 short 的无符号对应项。\n\n## 输出变量\n\n下一个学习的是如何使用存储在变量中的值。例如，让我们使用变量并使用\
    \ `Console.WriteLine` 来打印它。查看下面这个为了简单目的而编写的示例：\n\n```c\nusing System;\n\nnamespace\
    \ Output\n{\n    class MainClass\n    {\n        public static void Main (string[]\
    \ args)\n        {\n            decimal pi;\n            pi = 3.1416M;\n     \
    \       /* 记住 decimal 类型包含后缀 M */\n            Console.WriteLine(\"The value of\
