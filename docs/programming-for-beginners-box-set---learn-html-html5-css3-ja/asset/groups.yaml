    \ is to <em>show</em> the concept of inheritance.</h2>\n```\n\nAs shown above,\
    \ there is no color assigned to the em element. In this case, the emphasized word\
    \ (show) will inherit the color of its parent element (h2). In the style sheet,\
    \ the h2 is endowed with the color green, so the emphasized element will have\
    \ the color green.\n"
  mdcn: "\n\n除了上述功能外，包含 CSS 的页面用户可以选择覆盖页面内的 CSS 文件，并使用存储在他们设备上的文件。如果读者和作者都没有指定任何 CSS\
    \ 文件，则将使用浏览器的默认样式。就像 CSS 能够立即影响这些文件一样，CSS 也可以通过简单的修改几块或几行代码来轻松改变数百文档。\n\nCSS 名称中的“级联”（cascading）一词源于它的行为。规范是指一种识别优先级的特定方案，用于当某个元素匹配到多个规则时，决定将应用哪种样式规则。这种规则的“级联”或或权重会经过计算并分配，从而使其结果变得可预测。\n\
    \nCSS 规范同样由 W3C 制定，就像 HTML 一样。该联盟还为文档提供 CSS 验证服务，并且是免费的。\n\n## CSS 选择器\n\n在 CSS\
    \ 术语中，选择器用于指定特定样式将应用于标记的哪些部分。这是通过匹配标记中的属性和标签来实现的。选择器可以应用于以下内容：\n\n- 每个特定类型的全部元素，例如一级标题或\
