    # 数组


    数组是一种特殊的引用类型，允许你存储一组具有相同数据类型的项。这些项被称为元素。括号的数量告诉数组有多少个维度，例如，一对括号意味着一维数组。


    # 运算符


    运算符允许你对拥有的数据进行有趣的操作。从意义上说，运算符是编程语言的动词。然而，与动词不同，运算符有优先级，这样当它们组合时，你就知道预期结果。以下是最常用运算符的快速指南，以及它们从高到低的优先级：


    | 运算符 | 作用 |

    |---|---|

    | a++ 或 --，其中 a 是变量 | 返回内部的值，然后将该值加一或减一 |

    | ++b 或 --b，其中 b 是变量 | 在返回其值之前对内部的值加一或减一 |

    | *, /, 或 % | 让两个数相乘、除法或取模 |

    | + 或 - | 让两个数相加或相减 |

    | >, >=, <, <= 或 instanceof | 除了 instanceof 之外，这里的运算符允许你比较两个数字。instanceof 另一方面，可以让你检查对象是否来自指定的类
    |

    | == 或 != | 检查两个数字是否相等 |

    | && | 组合两个表达式，只有两个表达式都为真时整个语句才为真 |

    | || | 组合两个表达式，其中一个表达式为真时整个语句就为真 |

    | ? 与 : |称为三元运算符，这对组合允许你创建单行的 else 语句 |

    | =, *=, /= +=, -= 或 %= | 等号允许你为变量赋值。其他运算符是快捷方式，让你对数字进行乘、除法、相加、相减或取模，并将结果赋值给运算符左侧的变量
    |

