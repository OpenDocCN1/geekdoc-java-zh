    \ That being said, here’s the Java code for your first hello world program:\n\n\
    ```java\nclass MyFirstProgram {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nRemember to\
    \ save this file as “MyFirstProgram.java” since Java considers the name of the\
    \ Java source code to be the name of the main class of the program.\n\nBefore\
    \ running the program, let’s talk a bit about the source code. MyFirstProgram\
    \ is the program’s class, where main() is a method it contains. Inside the main()\
    \ method lies the System.out.println() function, which basically gets whatever\
    \ text you put inside and gives it to the command line or terminal to display.\n\
    \nNow that you know a bit about the source code, compile the Java source code\
    \ using this command (If you’re using an IDE, however, you may just need to press\
    \ the “run” button for program to compile and run):\n\n```bash\njavac MyFirstProgram.java\n\
    ```\n\nThis code should not generate any errors, but if it does, go back to the\
    \ source code and check for any misspelled names, missing semicolons, and other\
    \ mistyped commands.\n\nAfter an error-free compilation, you can now run your\
    \ first Java program using the following command:\n\n```bash\njava MyFirstProgram\n\
    ```\n\nThis should result in “Hello, World!” being shown on the screen.\n\nCongratulations!\
    \ You’ve created your first program in Java! This mini chapter, while letting\
    \ you create your first program, also serves to give you a break after all the\
    \ concepts we’ve gone through the previous chapters. At this point, it’s a good\
    \ idea to take a break, and then skim through the previous chapters before proceeding\
    \ to the next, as the next chapter is to be the longest of this book.\n\n## Chapter\
    \ 4: Programming Basics\n\nWe've talked about Java being an object-oriented language,\
    \ but before we can use objects, classes, and other stuff, we have to first master\
    \ the features that Java has in common with other languages so you don't end up\
    \ overwhelmed. In this chapter, we are going to talk about:\n\n- Comments\n- Literals\n\
    - Identifiers\n- Data Types\n- Variables\n- Arrays\n- If-Else Statements\n- Switch\
    \ Statements\n- While and For Loops\n\nThese features are considered essential\
    \ in pretty much every programming language, even if you have already taken up\
    \ the fundamental naming conventions.\n\n## Comments\n\nThe comments feature is\
    \ probably one of the most important yet underrated features of the Java language.\
    \ Basically, the comments feature allows you to type in stuff that the compiler\
    \ won't run. Two of the most common uses of comments are:\n\n- “Turning off” and\
    \ “turning on” segments of code by simply commenting the parts you want the compiler\
    \ to run and parts you want to ignore.\n- Giving your future self a thorough explanation\
    \ of how your code works.\n\nNumber 1 is useful for debugging and tinkering with\
    \ the flow of your program. By seeing what turning off specific parts of your\
    \ program does, you can easily pinpoint errors and other handy stuff. Number 2\
    \ is especially useful if you're working with more than a thousand lines of code\
    \ (yes, you can have that many lines) to tell what most of the cryptic code snippets\
    \ were meant to accomplish. Imagine how hard it would be if there turned out to\
    \ be an error buried in those lines of code with no comments, it could take months,\
    \ or even years of interpreting the source code, to create new Java codes from\
    \ scratch.\n\nNow that you know the common uses of comments and why they are important,\
    \ here are the two common types of comments and how you can use them effectively\
    \ in your future Java programs:\n\nSingle liners, known as single line comments.\
    \ A single line comment is a comment that spans one line. It starts with // until\
    \ the end of the line it is in. Here's an example using a slightly modified version\
    \ of MyFirstProgram.java:\n\n```java\nclass MyFirstProgram {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n\
    \        // Outputs the \"Hello, World!\" text into the screen\n    }\n}\n```\n\
    \nAs you see, single liners are great for giving short summaries to simple functions\
    \ and procedures. They're also great for turning on and off parts of your code,\
    \ so adding // before the System.out.println() function and see what happens!\n\
    \nMultiple liners, known as multiline comments. If you needed to create length\
    \ descriptions of your program, it can be quite tedious to add the comment at\
    \ the beginning of every line. Luckily, multiple liners exist to make multiline\
    \ commenting a lot easier. It starts with /* and ends with /, with everything\
    \ in between ignored by the compiler. Here's an example further modifying MyFirstProgram.java:\n\
    \n```java\n/*\nThis program does five things:\n1. It outputs \"Hello, World\"\
    \ to the screen.\n2. It creates a variable named A and assigns it a value of 1.\n\
    3. It creates a variable named B and assigns it a value of 2.\n4. It creates a\
    \ variable named C and assigns it a value of 3.\n5. It adds A, B, and C and outputs\
    \ the result to the screen.\n*/\n\nclass MyFirstProgram {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    \
    \    int A = 1;\n        int B = 2;\n        int C = 3;\n        A + B + C;\n\
    \    }\n}\n```\n\nAfter running this program, do check if the code really does\
    \ perform what the multiline comment says it will perform. As an exercise, find\
    \ out which one of the five things it doesn't and see how you can fix the program.\n\
    \nComments are a great way to make sure that your program remains readable and\
    \ bugfree, which is why they was discussed in quite a lot of detail. The next\
    \ few sections should be fairly fast, so buckle up, as it's going to be a bumpy\
    \ and speedy ride!\n\n## Literals\n\nNowadays it's quite acceptable to say, “I\
    \ literally died when I saw this really funny video of a cat,” but back then,\
    \ the word “literally” purely meant that something was meant to be taken as is.\
    \ In the world of Java, that meaning has retained its purity, as literals are\
    \ basically taken as they are and not representations of different values. For\
    \ example:\n\n```java\nint a = 1; // 1 is a literal, but a isn't.\nint b = a +\
    \ 2; // 2 is a literal, but a and b aren't.\nint c = 1 + 2; // 1 and 2 are literals,\
    \ but c nor 1+2 aren't.\n```\n"
  mdcn: "\n\n在整本书中，我们将使用 Java SE，这只是因为你反正都要在自己的计算机上编程，所以不需要为了额外的设备来运行你的程序。此外，由于 Java\
    \ SE 是使用最广泛的 Java 平台，在这个平台上运行你的程序是有意义的。\n\n## Java 骨架\n\n在编写你的第一个 Java 程序之前，让我们来看一个\
