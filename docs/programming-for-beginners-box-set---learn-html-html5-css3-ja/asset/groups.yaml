  mdcn: "\n首先，必须定义一些关于排版、背景颜色等基本规则。让我们来看下面的 CSS 代码——你可能在 CSS2.1 中见过过这些内容。\n\n```css\n\
    /* Example CSS Reset */\n{\n  Margin: 0;\n  Padding: 0;\n}\n\n/* This code tells\
    \ the browser to render the HTML5 replacements as block */\nHeader, footer, aside,\
    \ nav, article {\n  Display: block;\n}\n\nBody {\n  Margin: 0 auto;\n  Width:\
    \ 250px;\n  Font: 12px/24px verdana, Arial;\n  Background: #000000\n}\n\nH2 {\n\
    \  Font-size: 16px;\n  Line-height: 40px;\n  Padding: 20px 0;\n}\n```\n\n```css\n\
    P {\n  Padding-bottom: 22px;\n}\n```\n\n在开始，内边距（padding）和外边距（margin）样式将通过基础规则进行重置。在生产环境中，程序员可以使用更详细的重置，但为了说明说明，这是一个简化的版本。\n\
    \n下部分告诉用户代理将新的 HTML5 元素渲染为块级（block）。虽然浏览器可以处理不支持的元素（使得 HTML5 具有向后兼容性），但它们不知道这些元素如何以默认方式渲染。这就是为什么在\
    \ CSS3 标准普及之前，我们需要指示它们如何操作。\n\n# 样式介绍\n\n我们为介绍部分做的标记非常简单，但我们可以使用一些 CSS3 让它更有吸引力。查看以下代码：\n\
    \n```css\n#intro {\n  Margin-top: 64px;\n  Padding: 40px;\n  Background: #467612\
    \ url(\"background_for_intro.png\") repeat-x;\n  Background-size: 100%;\n  Border-radius:\
    \ 22px;\n}\n```\n\n正如你可能注意到的，使用了两个新属性：`background-size`（允许程序员缩放背景图像）和 `border-radius`（为我们的元素应用圆角）。对于后者，每个角可以有不同的值。此外，程序员可以选择只圆角特定的角。\n\
    \n# 内容区域样式化\n\n使用 CSS3 对内容区域进行建模非常简单。不再需要浮动（floating）、用于背景的伪列图像，也不需要清除或收叠外边距。元素现在的行为像表格一样，使布局变得更简单。查看下面的简单代码：\n\
    \n```css\n#content {\n  Display: table;\n}\n#mainContent {\n  Display: table-cell;\n\
    \  Width: 600px;\n  Padding-right: 20px;\n}\nAside {\n  Display: table-cell;\n\
    \  Width: 320px;\n}\n```\n\n我们到为止使用的 CSS3 技术可以用于对博客页的其他部分进行建模。这意味着我们可以在比使用过时技术短得多的时间内完成整个项目！\n\
    \n# 结论\n\n再次感谢你下载本书！\n希望这本书能够帮助你学习基础的 HTML5 和 CSS3 技能。\n下一步是使用这些系统创建你自己的网站！在这个瞬息万变的世界里，跟上技术潮流是必要的。但更多地了解这项技术的运行原理，可以带你超越前沿，进入一个全新的世界！\n\
