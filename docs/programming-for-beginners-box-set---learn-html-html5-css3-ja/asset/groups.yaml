    SGML, triggering the standards-compliant rendering mode. Starting 2009, Web Forms
    2.0 is also included in HTML5 where as it was previously a separate application.


    # Browser Support


    All modern browsers support HTML5. Aside from this, all browsers (both modern
    and old) can automatically handle the unrecognized elements as inline elements.
    Due to this, older browsers can be “taught” to handle “unknown” HTML elements.
    This is when the user agents (browsers) can recognize and support elements and
    attributes from previous HTML versions.


    The HTML5 specification separates the requirements for Web developers (authors)
    and the browsers. As an example, authors are not supposed to use the “plaintext”
    and “isindex” elements, but the user agents will have able to support them in
    such a way that will be compatible with the behavior of these elements, for Web
    content compatibility.


    # The HTML Syntax


    In HTML, the programmer will have to define a “syntax”, which is referred to simply
    “HTML syntax”. One chooses the one most compatible with existing HTML4 and XHTML1
    on the Web, though it cannot be more compatible with certain SGML features of
    HHTML4 (such as shorthand markup and processing instructions) as these'
  - '[PAGE 38]


    are not usually supported by browsers. The “text/html” media type is used to serve
    the documents with the HTML syntax.


    In HTML, one also defines the detailed rules of parsing (with error handling),
    which are likewise backwards compatible with HTML4. User agents as browsers will
    have to rely on these rules for resources with the given type. Likewise, XML,
    XML can also be used as an HTML syntax. This is compatible with XHTML1 implementations
    and documents. An XML media type (such as “application/xml” or “application/xhtml+xml”)
    is used to serve documents with this syntax.


    # Character Encoding


    In HTML, Web developers also declare the character encoding. There are three different
    ways to accomplish this:


    One can do it at the transport level, through the use of the HTTP “content-type”
    header/


    One can also use a Unicode BOM (Byte Order Mark) at the beginning of the file.
    This character will provide the signature for the encoding.


    Using the “charset” attribute with a “meta> element, which will specify the encoding
    during the first 1024 bytes of the document. As an example, the UTF-8 encoding
    can be specified by typing in “<meta charset="UTF-8">”. This will replace the
    much longer “<meta http-equiv="Content-Type" content=: text/html; charset=UTF-8">”,
    even though the later syntax is still allowed.


    # Doctype


    A “Doctype” will have to be specified to make sure that the browser will render
    the page in the standard mode. The doctype will have no other purpose.'
- md: '

    The declaration for the HTML syntax is always "<!DOCTYPE html>". Always remember
    that this is case-insensitive. Doctypes coming from previous versions are no longer
    used, since the languages are SGML-based.


    For the legacy markup generators that are of yet unable to support the shortened
    doctype, "<!DOCTYPE html SYSTEM "about:legacy-compat>" can still be used. In addition,
    doctypes meant for HTML4.01, HTML4, XHTML1.1 and XHTML1 are allowed but discouraged.


    For those documents using the XML media type, they are always handled in standards
    mode so any doctype declaration can be used.


    ## SVG and MathML


    The HTML syntax also supports SVG and MathML elements to be used within the document.
    An "svg" or "math" start tag will cause the parser to change to a special mode
    of insertion, putting the elements and the attributes within the appropriate namespaces.
    This also does the fixups in case elements and attributes have a mixed case. This
    also supports empty-element syntax like XML. Like before, the syntax is case-insensitive.
    One can omit the namespace declarations.


    There are certain elements that will cause the parser to switch back to HTML mode,
    such as "mtext" and "foreignObject". When these are used, the programmer can use
    different HTML elements, or new "svg" or "math" element.


    ## Other changes in the syntax


    - The characters named "&lang;" and "&rang;" now expand to mathematical left or
    right angle brackets instead of the usual left or right pointing angle brackets.

    - Void elements can now have a trailing slash (this is known as "EMPTY" in HTML4).

    - The & sign (ampersand) can be left unescaped in more instances, compared to
    preceding HTML4.

    - The different attributes need to be separated by at least one whitespace character.

    - The different attributes with an empty value must be rewritten as just the name,
    without the equals sign and value. This applies even to attributes that are not
    boolean attributes.

    - Attributes that omit quotes for the values are allowed to use a larger character
    set compared to the preceding HTML versions.


    - The parser does not do normalization of whitespace within attribute values.
    For example, leading and trailing whitespaces in the "id" attribute are not ignored
    (and therefore now considered invalid) while newline characters may now be used
    in the "input" element’s "value" attribute without the character references.

    - The end tag "optgroup" is now optional.

    - The start tag "colgroup" is also optional, and may be inferred by the HTML parser.


    ## Chapter 2: Language Changes in HTML5


    The following elements have been introduced in HTML5, in order to provide better
    structure:


    - **Section** - This represents a generic application section or document. To
    indicate the document structure, this should be used with the header elements
    (“h1”, “h2”, “h3”, etc.).

    - **Article** - This represents an independent part of the document’s content.
    This may be a blog, or a newspaper article.

    - **Main** - This represents the main content of the document’s or application’s
    body.

    - **Aside** - This represents a part of the content that is only a bit related
    to the rest of the page’s content.

    - **Header** - This represents navigational aids or an introductory section.

    - **Footer** - This represents a section of the page at the bottom, that can contain
    information about the author, information on copyright permissions, etc.

    - **Nav** - This represents a section of the document meant for navigation.

    - **Figure** - This represents a section that is self-contained, and usually contains
    flow contents. This is usually referenced as a single unit, different from the
    main document.

    - **Figcaption** - This can be used as a caption for the figure, though it is
    completely optional.

    - **Template** - This can be used to declare different HTML fragments, which can
    be clones and inserted by script into the main document.

    - **Video and Audio** - As mentioned earlier, this is meant for multimedia content.
    They also allow web developers to script their own interface, through APIs. Used
    together with “source” elements if there are different streams available of multiple
    types.

    - **Track** - This provides tracks of text for the video elements within the page.

    - **Embed** - This is used for plugin contents.

    - **Mark** - This represents the run of text within one document that is highlighted
    or marked for reference purposes. This is usually due to its relevance in another
    context within a different context.

    - **Progress** - This will represent a task’s completion. This includes tasks
    such as downloading, or when doing a series of operations.

    - **Meter** - This represents any measurement, such as the usage of the disk.

    - **Time** - This represents the (any) time and/or date.

    - **Ruby / Rt / Rp** - This allows for Ruby annotations markup.

    - **Bdi** - This represents a group of text that will be isolated from the surroundings,
    meant for bi-directional text formatting.

    - **Wbr** - This stands for a line break opportunity.

    - **Canvas** - This is used for on-the-fly rendering of dynamic bitmap graphics,
    such as games or graphs.

    - **Datalist** - This, in combination with input''s new list attribute, can be
    used in the creation of comboboxes.

    - **Keygen** - This represents the control for a key pair generation.

    - **Output** - This will represent a type of output, such as when a calculation
    has been completed.


    The Type attribute of the Input element also has the following new values:


    - Search

    - Tel

    - URL

    - Email

    - Time

    - Date

    - Range

    - Number

    - Color


    These new types work under the idea that the user agents (i.e, browsers) can provide
    the required interface. This interface may range from a calendar date picker,
    or an integration with the address book. The user agent is also supposed to communicate
    to the server, submitting the required format. This will give the user a better
    experience, as the user will not much wait time.


    ## PART 2: CSS3


    ## Chapter 3: What is CSS3?


    Earlier, we have mentioned that no matter how advanced HTML is, it cannot create
    a comprehensive and holistic website or application without the use of other elements.
    One of these is CSS, or Cascading Style Sheets.


    “Cascading Style Sheets” is essentially a language that is used to describe the
    formatting (looks) of any document that was previously written in markup languages
    (such as HTML or XHTML). CSS is commonly used to modify the style of webpages
    and other interface written in the aforementioned languages, it may actually be
    used on any type of XML document -- even SVG, XUL, and plain XML. Along with Javascript
    and HTML, CSS is considered a cornerstone of the technology most websites use
    in order to produce visually appealing and engaging webpages, web app user interfaces,
    and even those in many mobile apps.


    CSS has been primarily designed to make separation of the document’s content from
    its presentation possible. i.e. colors, layouts, and fonts can be placed in a
    different document altogether, improving accessibility and providing more control
    and flexibility in its characteristics. This allows several HTML pages to have
    the same formats through specifying the pertinent .css file. This reduces repetition
    and complexity in the content and structure of the entire document, including
    the elimination of semantically insignificant tables (these were prevalent in
    the days when CSS was not a norm for all browsers).


    The separation between the content and formatting can also allow the programmer
    to show the same page of markups in varying styles for a variety of rendering
    methods - in print, on-screen, on Braille-based tactile devices, and when read
    by speech-based browsers on screen readers. CSS can also cause a different page
    style to display depending on the size of the screen or on the device (whether
    it is a phone, tablet, notebook, PC, etc.).

