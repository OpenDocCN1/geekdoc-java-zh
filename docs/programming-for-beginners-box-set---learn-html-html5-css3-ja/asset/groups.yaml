    if you want to write currency amounts. For example, if you write 10.00, it would
    be shown as 10. You just have to determine the exact way that you want your number
    to be displayed.


    You can use number_format to format numbers. Its general form is number_format
    (number, decimals, "decimalsep", "thousandsep")


    - number represents the number that is to be formatted. It is necessary to include
    it in all your codes.

    - decimals represents how many decimal places you desire. If you do not include
    decimals in your code, the program will automatically consider 0 to be the number
    of your decimal places. Also, number will be rounded to the integer closest to
    its value. Note that if you use decimalsep and thousandsep, you have to include
    decimals.

    - thousandsep represents the character that separates a number into thousands.
    The comma is the default for this. Note that if you use this parameter in your
    code, you also have to use thousandsep.

    - decimalsep represents the character that separates the decimal places. The decimal
    point is the default for this. Note that if you use this parameter in your code,
    you also have to use thousandsep.


    Take a look at the following examples of number_format statements together with
    their corresponding outputs:


    ```php

    $upnumber = ceil(28.65);

    ```


    If you run the above example, you will get an output of:


    ```

    29

    ```


    because 29 is the next integer after 28. On the other hand, if you write


    ```php

    $downnumber = floor(28.65);

    ```


    you will get an output of:


    ```

    28

    ```


    obviously because 28 is the closest integer to value.


    Once formatting is done, the number gets converted into a string data type. Thus,
    you should always perform your desired mathematical operation on a number before
    you decide to format it. If you need to do a complicated formatting procedure,
    you have to use sprintf and printf.


    - sprintf stores the formatted number into a variable.

    - printf directly outputs the formatted number.


    You can use both formatting statements to format numbers and character strings,
    as well as to output numbers and strings in the same output statement.

