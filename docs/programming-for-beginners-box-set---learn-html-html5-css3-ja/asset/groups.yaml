    # Chapter 2: MySQL


    MySQL is an open source Relational Database Management System (RDBMS) that is
    available for free. It makes use of Structured Query Language (SQL), which is
    the most commonly used language for accessing, managing, and adding content in
    databases. It is also known for its proven reliability, quick processing, flexibility,
    and ease of use. MySQL is a crucial part of nearly every open source PHP application.
    Some of the most popular PHP/MySQL-based scripts include Joomla, phpBB, and osCommerce.


    # So What Is MySQL Exactly?


    To understand what MySQL is, you have to know what a computer database is. Essentially,
    a computer database is a collection of data. MySQL and other specialized database
    software are simply programs that allow users to store and retrieve data efficiently.


    Specialized database software programs are used to avoid experiencing problems
    with storing and retrieving data. For instance, if you save your files using no-brainer
    file names, such as a.doc, b.doc, and c.doc, you will have a hard time looking
    for your files when you need them. You need a more efficient method for data storage.


    A database is a computer software program that is meant to store huge amounts
    of data. It is basically a structured collection of data that can be anything
    from picture galleries to shopping lists to corporate network information. With
    database software, you can keep lists that contain vital information.


    For instance, if you are running a store, using a database will help you keep
    everything organized. You can create a list of your customers and their addresses.
    If you need to obtain information from a particular customer, there is no more
    need to check your data one by one.


    In order to access, process, and add data stored in your database, you need a
    database management system like MySQL Server. Because computers are efficient
    at handling huge amounts of data, you can gain benefit from database management
    systems. They are ideal for computing, as part of applications, and as standalone
    units.


    MySQL databases are also relational. They store data in separate tables instead
    of storing all the data in a single table. Logical models with objects such as
    tables, rows, columns, and databases offer flexible programming environments.
    As a user, you can create your own rules with regard to the relationships between
    data fields, including one-to-many, one-to-one, unique, optional, required, and
    pointers between tables. Your database enforces such rules that your application
    does not duplicate, inconsistent, mission, orphan, or outdated data.


    SQL actually stands for Structured Query Language. It is defined by the ANSI/ISO
    SQL Standard, which has been existent since 1986. It is the most well-known standardized
    language for accessing databases. You may directly enter SQL to perform certain
    actions such as generating reports; embed-SQL statements into codes that were
    created using other languages; or use language-specific programming interfaces
    (APIs) that conceal SQL.


    MySQL database servers are fast, scalable, and reliable. They are also easy to
    use, which is why they can be used by beginners. They can run well on desktops
    or laptops, alongside other web servers and applications. They do not require
    much attention, which make them easy to maintain. You can also adjust your settings
    to make the most of the available memory, I/O capacity, and CPU power if you use
    a machine specifically for MySQL.


    # MySQL vs. PostgreSQL


    When it comes to open source relational database management systems, a lot of
    people experience difficulty choosing between MySQL and PostgreSQL. MySQL is the
    most well-known and commonly used RDBMS while PostgreSQL is the most advanced
    open source objective RDBMS. Both are excellent solutions that are comparable
    to proprietary database software.


    PostgreSQL, also referred to as Postgres, is an object-relational database management
    system (ORDBMS) that focuses on standards-compliance and extensibility. It stores
    data, supports the best practices, and allows for retrieval. It can also handle
    workloads, including single-machine applications and Internet-facing applications.


    Many users presume MySQL to be densely featured and similar to Oracle. Conversely,
    they presume PostgreSQL for software projects due to its ease of use and speed,
    by many developers who have a background on SQL Server and Oracle also use PostgreSQL.


    MySQL has a couple of layers, a layer for several storage engines and an upper
    layer. PostgreSQL, on the other hand, has just one storage engine. Remember that
    storage engines mostly differ in performance and functionality. Depending on what
    environment your database system runs in, you can optimize it.


    Some of the most significant features of PostgreSQL include TOAST data compression,
    parameterized and static SQL executor, improved cache management, large scalability,
    asynchronous commit, and advanced cost-based optimizer. PostgreSQL has the ability
    to decompress and compress data using a speedy compression scheme that allows
    it to fit data into a specific disk space. Compressing data is great because it
    saves disk space as reads data faster.


    Some of the core features of MySQL include a ANSI SQL 99 subset and extensions,
    table partitioning through LIST, SET, HASH, and RANGE, network protocol compression,
    built-in replication through row-change events or triggers, SQL support, cursors,
    stored procedures, updateable views, and Unicode support.


    If you are a webmaster who does not write programs for your website, you may not
    find the differences between MySQL and PostgreSQL to be such a big deal. Your
    concerns may be about MySQL because nearly all hosts have it as part of packages.


