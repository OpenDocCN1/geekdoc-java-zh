    \n专业程序员还遵循其他几个指南，这些指南与 C# 的几乎每个方面都有关。但对于初学者来说，以下是在你学习 C# 编程艺术时始终应该记住的核心实践：\n\n\
    - 不要与大括号在同一行编写任何内容\n- 不要与注释在同一行编写任何内容\n- 重点关注 1:1 规则；在单行内只写一个声明或语句\n- 始终使用缩进\n\
    - 如果 IDE 没有对行进行缩进，请使用 tab 键进行缩进\n- 确保成对的大括号对齐（左括号和右括号）\n\n## 第 3 章 – 关于数据的一切 (Chapter\
