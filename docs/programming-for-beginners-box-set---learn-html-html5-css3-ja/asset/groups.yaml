    Despite the popularity of Java as a language and a platform, there remains still
    a shortage of qualified programmers to create meaningful and useful Java applications.
    Whether you’re completely new to Java, or even to programming, or you feel that
    there’s a lot of room for improvement in your current Java programming skills,
    this book will give you a strong foundation in both programming and Java.


