  - '[PAGE 147]


    # Do you need to learn MySQL?


    Average webmasters do not need to study SQL or MySQL because the software they
    use is most likely to do the storing and retrieving of data. They just have to
    learn how to use their software. Think of MySQL and similar databases as car engines.
    There is really no need for you to learn how to design car engines just to be
    able to use cars. Similarly, there is no need for you to learn how to directly
    read and write MySQL databases to be able to blogging software.


    On the other hand, if you are a programmer, you need to study SQL to be able to
    write programs that access MySQL and other SQL databases. Of course, you also
    need to learn a suitable programming language. If you are wondering if you have
    to be a programmer to become a webmaster, the answer is no. You can be a webmaster
    without knowing how to program. You can create a website by manually coding it
    in HTML.'
