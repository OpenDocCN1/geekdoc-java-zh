    # The Basic Terms of C#


    If you have never programmed before, a lot of the terms used in the following
    chapters such as statements, parameters, expressions, methods, and classes will
    definitely be confusing to you. Here is a quick reference guide for the basic
    terms in the world of C# programming:


    +   - Class – A class is a group of methods and variables which define the behavior
    of instances, namely objects in object-oriented programming.


    +   - Method – A method in C# is similar to a function in C++. Methods contain
    specific procedures for a class. Throughout the lessons this book, many methods
    or functions will be used such as Console.WriteLine, Convert, and so on.


    +   - Object – Objects are instances that apply the specifications by a class.


    +   - Statement – Statements are the building blocks of any program. Declarations,
    expressions, iterations, initiations, and a number of other actions within a program
    are statements.


    +   - Operators – C# uses a lot of operator symbols that are similar to those
    in C++. Operators are used to perform arithmetic and logical operations between
    different data types. Some of the operators in C# are increment and decrement
    (-- and ++), multiplicative (*, /, %), additive (+ and -), and and'
- md: "several others for logical and conditional expressions.\n\n- **Variables**\
    \ – Variables are essentially just containers for specific pieces of data, which\
    \ can have different types such as *integral, floating point, decimal, Boolean,\
    \ nullable,* and *textual*. Remember that specific data types only permit specific\
    \ values.\n\n- **Expressions** – Expressions can include operators, variables,\
    \ method invocations, and values. Depending on what an expression consists of,\
    \ it may be classified as an *invocation expression, query expression, literal\
    \ expressions, and simple name expressions*. There are also expressions known\
    \ as *Lambda expressions,* which are used only for *Language-Integrated Query*\
    \ or LINQ.\n\n## Chapter 2 – The Program Structure\n\nIn this Chapter:\n\n- **The\
    \ Hello World Program**\n\n- **Understanding the C# Program Structure**\n\n- **Basic\
    \ Guidelines for Syntax (The Coding Conventions)**\n\nSometimes, the best way\
    \ to learn something you are clueless about is to jump into the action. If you\
    \ have studied other programming languages before, then you probably encountered\
    \ the Hello World program that every beginner knows. It is the simplest of all\
    \ programs with the sole function of printing the words Hello World and nothing\
    \ else.\n\nTo help you understand the program structure of C#, let us begin with\
    \ the Hello World program as an example. Here is what the Hello World program\
    \ looks like in C#:\n\n```csharp\nusing System;\n\nnamespace Test\n/* The two\
    \ lines above are Namespace Declarations */\n{\n    /* Just like in C++, brackets\
    \ are used to segregate classes and methods */\n    class MainClass\n    {\n \
    \       public static void Main (string[] args)\n        {\n            Console.WriteLine(\"\
    Hello World!\");\n            /* Feel free to edit the texts between the parentheses\
    \ and\n            quotation marks */\n        }\n    }\n}\n```\n\nBefore anything\
    \ else, remember that anything written between '/*' and '*/' are seen by the compiler\
    \ as the comments. They do not affect the program in any way and are only included\
    \ by developers for organization, so you can write anything you like within them.\
    \ Pay attention to the comments found in the code examples throughout this book\
    \ as they will denote something useful.\n\nRemember that the Hello World program\
    \ is a console application,\n\n## Namespace Declaration\n\nAt the beginning of\
    \ the program, notice how the namespace system is declared (using System;). System\
    \ is essentially a collection of codes that is called upon by the Hello World\
    \ program. Using namespaces is generally considered as a good habit for developers\
    \ since it prevents issues within the program such as name clashes.\n\nTake that\
    \ if the System namespace is not used in this program, the line Console.WriteLine\
    \ will have to be written as System.Console.WriteLine. But if you use the namespace\
    \ declaration for System, then you do not have to include System whenever you\
    \ write a Console.WriteLine function.\n\nAfter declaring the System namespace,\
    \ the program now declares a new namespace called Test (namespace Test). Remember\
    \ that Test can be any word that will describe your program. You can use something\
    \ like MyProgram or HelloWorld just for personalization, but it will not have\
    \ an effect on the program.\n\n## Class Declaration\n\nNext is the class declaration\
    \ (class MainClass). Just like the declaration of the Test namespace, you can\
    \ use any word you like to label this class. In C# programming, namespaces contain\
    \ multiple classes that, in turn, contain different methods. terms will be explained\
    \ as you go through this book. While using the same label for your namespace and\
    \ class will work with the Hello World program, you should never use similar names\
    \ when writing other programs.\n\n## The Main Method\n\nThe next statement, `public\
    \ static void Main(string[] args)`, initiates a method in the Hello World program.\
    \ In this particular line, the Main method was initialized. Always remember that\
    \ the Main method is called the entry point of C# programs because it is called\
    \ first whenever the program starts. The words public and static are modifiers\
    \ while void indicates that this method has no return value. The public modifier\
    \ basically allows the method to be called from external locations outside the\
    \ class. Static, on the other hand, makes the method a member of the class itself\
    \ and not a particular object of the class.\n\nFinally, the `(string[]) args`\
    \ defines the parameters to be included in the main method. This also allows arguments\
    \ and values to be passed over to this method. For a program like Hello World\
    \ that does not use command line arguments, you can leave the spaces between the\
    \ parentheses blank and define the main method only with `public static void Main()`.\n\
    \nThe next statement, which is included in the main method, uses the Console.WriteLine\
    \ function. It is the basic output function for C#. Whenever it is called, it\
    \ will print the text contained between the parentheses and quotation marks in\
    \ the console application.\n\n## The C# Coding Conventions\n\nOutside the required\
    \ syntax for a functional C# program, there are other standards and conventions\
    \ being followed by programmers. More specifically, there are the C# coding conventions\
    \ set by Microsoft to serve as guidelines for related documentation. These, according\
    \ to the programming community, are the good practices that you should start adapting\
    \ to as soon as you begin.\n\nWhile they sometime do not have a direct effect\
    \ on the program itself, it can make other things such as debugging, modifying,\
    \ and optimizing easier. For example, it is entirely possible to write a program\
    \ in a lateral manner. But it is considered as a bad practice because it greatly\
    \ reduces the readability of your code. As much as possible, programmers are encouraged\
    \ to write 1 statement per line.\n\nThere are several other guidelines that professional\
    \ programmers follow that are related to almost every aspect of C#. But for beginners,\
    \ here are the essential practices you should always remember as you learn the\
    \ art of C# programming:\n\n- Do not write anything in the same line as curly\
    \ braces\n- Do not write anything in the same line as comments\n- Focus on the\
    \ 1:1 rule; write only one declaration or statement in a single line\n- Always\
    \ use indentations\n- If lines are not indented by the IDE, use tab to indent\
    \ them\n- Make sure paired braces are aligned (opening and closing)\n\n## Chapter\
    \ 3 – All About Data\n\nIn this Chapter:\n\n- **The Basic Input for C#**\n- **Introduction\
    \ to Variables and Data Types**\n- **The Different Methods of Declaring Variables\
    \ and Output**\n\nThe Hello World program described in the previous chapter is\
    \ a complete program in a sense that it accomplishes what it was written to. Unfortunately,\
    \ it is not meant for something than just outputting information. Remember that\
    \ programming languages are invented so humans communicate with machines. But\
    \ what you have done so far with the Hello World program is to write something\
