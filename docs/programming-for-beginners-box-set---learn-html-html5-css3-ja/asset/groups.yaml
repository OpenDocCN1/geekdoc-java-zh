    a sense, operators are verbs of the programming language. However, unlike verbs,
    operators have an order of precedence so that when combined you''ll know what
    to expect. Here''s a quick guide for the most common operators, and their order
    of precedence from highest to lowest.


    | Operator | What it does | |

    |---|---|---|

    | a++ or--, where a is a variable name | Returns the value inside the variable,
    and then increments or decrements that value by one | |

    | ++b or -b, where b is a variable name | Increments or decrements the value inside
    the variable before returning its value. | |

    | *, /, or % | Let''s multiply, divide, or get the module of two numbers, respectively.
    | |

    | + or - | Let''s add or subtract two numbers | |

    | >, >=, <, <= or instance of | Except for instance of, the operators here allow
    you to compare two numbers. Instance of, on the other hand, lets you check whether
    or not an object came from a specified class. | |

    | == or != | Let''s check whether or not two numbers are equal. | |'
