    # If 语句\n\n如上所述，if 语句允许在发现条件为真时执行代码。其语法如下：\n\n```php\nif (condition)\n{\n    block\
    \ of code;\n}\n```\n\n请看下面的示例：\n\n```php\n<?php\n$time = date(\"Hour\");\nif ($time\
    \ < \"10\")\n{\n    echo \"Good morning!\";\n}\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\
    \nGood morning!\n\n当仅当小时或时间小于 10 时。\n\n# If... Else 语句\n\n你可以使用 if... else 语句在发现条件为真时执行代码，在发现条件为假时执行另一段代码。其语法如下：\n\
    \n```php\nif (condition)\n{\n    block of code to execute if the condition is\
    \ true;\n}\nelse{\n    block of code to execute if the condition is false;\n}\n\
    ```\n\n考虑下面的示例：\n\n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\"\
    )\n{\n    echo \"Good morning!\";\n}else{\n    echo \"Good afternoon!\";\n}\n\
    ?>\n```\n\n如果你运行这段代码，你将得到输出：\n\nGood morning!\n\n当时间小于 10 时。否则，你将得到输出：\n\nGood\
    \ afternoon!\n\n# If... Else if... Else 语句\n\n该语句用于在发现第一个条件为假时，指定新的条件进行测试。其语法如下：\n\
    \n```php\nif (condition)\n{\n  block of code to execute if the condition is true;\n\
    } else if (condition)\n{\n  block of code to execute if the condition is true;\n\
    } else\n  block of code to execute if the condition is false;\n}\n```\n\n请看下面的示例：\n\
    \n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n  echo \"Good\
    \ Morning!\";\n} else if ($time < \"20\")\n  echo \"Good afternoon!\";\n} else\n\
    {\n  echo \"Good night!\";\n}\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\nGood morning!\n\
    \n当时间小于 10 时。你将得到输出：\n\nGood afternoon!\n\n当时间小于 20 时。否则，你将得到输出：\n\nGood night!\n\
    \n# Switch 语句\n\n它用于根据给定条件执行操作。在 PHP 中，有很多种 switch语句。其语法如下：\n\n```php\nswitch\
    \ (expression) {\n    case value1:\n        block of code;\n        break;\n \
    \   case value2:\n        block of code;\n        break;\n    default:\n     \
    \   block of code;\n}\n```\n\n考虑下面的示例：\n\n```php\n<?php\n$color = \"red\";\nswitch\
    \ ($color) {\n    case \"red\":\n        echo \"The color is red!\";\n       \
    \ break;\n    case \"blue\":\n        echo \"The color is blue!\";\n        break;\n\
    \    default:\n        echo \"Color not found!\";\n}\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\
    \nThe color is red!\n\n# Break 语句\n\nbreak 语句用于退出循环或 switch语句。如果没有 break语句，无论条件是否匹配，代码将继续执行后续\
    \ case。考虑下面的示例：\n\n```php\n<?php\n$x = 2;\nswitch ($x) {\n    case 1:\n      \
