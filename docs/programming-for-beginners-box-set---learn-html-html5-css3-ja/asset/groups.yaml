    \nCSS 选择器还使用“伪类”（pseudo-classes），以便根据文档树之外的信息进行格式化。伪类的一个例子是“hover”（悬停），它的作用是仅当用户用鼠标光标“指向”可见文档时才识别该内容。它被连接到一个选择器，例如“a:hover”或\
