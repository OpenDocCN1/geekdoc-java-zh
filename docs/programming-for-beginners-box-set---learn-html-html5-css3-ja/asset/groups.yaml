    # 在你的计算机上设置 PHP


    为了开始使用 PHP，你必须寻找支持 MySQL 和 PHP 的 Web 主机。你也可以安装一个 Web 服务器，然后安装 MySQL 和 PHP。然而，如果你的服务器已经支持
    PHP，那么你就不再需要执行上述指令了。你只需要创建 .php 文件并将它们放入目录中即可。服务器将自动解析它们。你不再需要编译或安装任何东西。如今大多数
    Web 主机实际上支持 PHP，因为它是免费的。


    # 第 2 章：MySQL


    MySQL 是一个免费的开源关系型数据库管理系统 (RDBMS)。它利用结构化查询语言 (SQL)，这是访问、管理和添加数据库内容最常用的语言。它还以经过证明的可靠性、快速处理速度、灵活性和易用性而闻名。MySQL
    是几乎每个开源 PHP 应用的关键组成部分。一些最流行的基于 PHP/MySQL 的脚本包括 Joomla、phpBB 和 osCommerce。


    # MySQL 到底是什么？


    要理解 MySQL 是什么，你必须知道什么是计算机数据库。本质上，计算机数据库是数据的集合。MySQL 和其他专门的数据库软件只是允许用户高效存储和检索数据的程序。


    使用专门的数据库软件程序是为了避免在存储和检索数据时遇到问题。例如，如果你使用毫无脑筋的文件（如 a.doc、b.doc 和 c.doc）来保存文件，那么当你需要它们时，你会很难找到这些文件。你需要更高效的数据存储方法。


    数据库是一种用于存储海量数据的计算机软件程序。它基本上是一个结构化的数据集合，可以是从图片库到购物列表再到公司网络信息的任何内容。通过数据库软件，你可以维护包含重要信息的列表。


    例如，如果你正在经营一家商店，使用数据库将帮助你保持一切井井有条。你可以创建一个客户及其地址的列表。如果你需要从特定客户那里获取信息，就不需要逐个检查你的数据了。


    为了访问、处理和添加存储在数据库中的数据，你需要像 MySQL Server 这样的数据库管理系统。因为计算机擅长处理海量数据，你可以从数据库管理系统中获益。它们作为应用的一部分或作为独立单元时都是理想的选择。


    MySQL 数据库也是关系性的。它们将数据存储在单独表中，而不是将所有数据存储在单个表中。具有表、行、列和数据库等对象的逻辑模型提供了灵活的编程环境。作为用户，你可以根据数据字段之间的关系创建自己的规则，包括一对多、一对一、唯一、可选、强制以及表之间的指针。你的数据库会强制此类规则，确保你的应用程序不会产生重复、不一致、缺失、孤立或过时的数据。


    SQL 实际上代表结构化查询语言 (Structured Query Language)。它由 ANSI/ISO SQL 标准定义，该标准自 1986 年以来一直存在。它是访问数据库最著名的标准化语言。你可以直接输入
    SQL 来执行某些操作，例如生成报告；将 SQL 语句嵌入到使用其他语言创建的代码中；或者使用隐藏 SQL 的特定语言编程接口 (API)。


    MySQL 数据库服务器速度快、可扩展且可靠。它们也易于使用，这就是为什么初学者可以使用它们。它们可以在桌面电脑或笔记本电脑上良好运行，并与其他 Web 服务器和应用程序并存。它们不需要太多关注，这使得它们易于维护。如果你专门用一台机器运行
    MySQL，还可以调整设置以最大限度地利用可用内存、I/O 能力和 CPU 功率。


    # MySQL vs PostgreSQL


    涉及到开源关系型数据库管理系统时，许多人在 MySQL 和 PostgreSQL 之间选择会遇到困难。MySQL 是最知名且最常用的 RDBMS，而 PostgreSQL
    是最先进的开源目标 RDBMS。两者都是可以与专用数据库软件相媲的优秀解决方案。


    PostgreSQL 也称为 Postgres，是一种对象关系数据库管理系统 (ORDBMS)，侧重于标准兼容性和可扩展性。它存储数据、支持最佳实践并允许检索。它还可以处理工作负载，包括单机应用和面向互联网的应用程序。


    许多用户认为 MySQL 功能丰富且类似于 Oracle。相反，许多开发者由于其易用性和速度而在软件项目中使用 PostgreSQL，同时，许多具有 SQL
    Server 和 Oracle 背景的开发者也使用 PostgreSQL。


    MySQL 有几层结构：一个包含多个存储引擎的层和一个上层。相比之下，PostgreSQL 只有一个存储引擎。记住，存储引擎之间的区别主要在于性能和功能。根据你的数据库系统运行的环境，你可以对其进行优化。


    PostgreSQL 的一些重要特性包括 TOAST 数据压缩、参数化和静态 SQL 执行器、改进的缓存管理、强大的可扩展性、异步提交和先进的基于成本的优化器。PostgreSQL
    能够使用快速压缩方案解压缩和压缩数据，使其能够将数据放入特定的磁盘空间中。压缩数据是非常棒的，因为它可以节省磁盘空间并更快地读取数据。


    MySQL 的一些核心特性包括 ANSI SQL 99 子集和扩展、通过 LIST、SET、HASH 和 RANGE 进行表分区、网络协议压缩、通过行更改事件或触发器进行内置复制、SQL
    支持、游标、存储过程、可更新视图以及 Unicode 支持。


    如果你是一个不为自己的网站编写程序的网站站长，你可能不会觉得 MySQL 和 PostgreSQL 之间的差异大到程度。你可能更关注 MySQL，因为几乎所有的主机都将其作为包的一部分提供。


    <!-- no content -->


    # 第 3 章：语法、注释、大小写敏感、换行和表单


    # 语法


    你可以将 PHP 脚本放置在文档的任何位置。它们通常以 <?php 开始，以 ?> 结束。它们的文件扩展名为 .php，通常包含 PHP 脚本代码和 HTML
    标签。不要忘记使用分号 (;) 结束 PHP 语句。


    考虑以下 PHP 代码示例：


    ```php

    <?php

    echo "Testing code";

    ?>

    ```


    如果你运行这段代码，你将得到输出：


    Testing code


    # 注释


    注释是不执行或不作为程序的一部分读取的行。它们的唯一目的是供可能需要额外信息的用户阅读。如果你想让其他人更好地理解程序，或者想提醒自己做过什么，你可以在程序中包含注释。万一你决定在几年后查看你的程序，你的注释将非常有帮助。它们可以让你回起你在创建代码期间的想法。


    考虑以下示例：


    ```php

    <?php

    # 这是一个单行注释

    // 这是一个单行注释

    /*

    这是一个

    多行

    注释

    */

    // 这是一个漏掉了代码行部分内容的注释

    $w = 2 /* * + 10 */ + 3;

    echo $w;

    ?>

    ```


    如果你运行这段代码，你将得到输出：


    5


    '
