    \ The color values may be specified using keywords (such as “green”), or through\
    \ their equivalent hexadecimal value. Other values that may be used for color\
    \ include RGB values (within a 0 to 255) scale, RGBA values (those that point\
    \ out both the color and the opacity), as well as HSLA or HSL values.\n\n## Priority\
    \ Scheme (from Highest to Lowest)\n\nEarlier, we mentioned that CSS follows a\
    \ “cascading” priority scheme that follows a sort of hierarchy. Here is the scheme\
    \ of CSS priority, arranged from highest to lowest.\n\n- **Importance**: Anything\
    \ marked with the “!important” annotation will overwrite the previous priorities.\n\
    - **Inline**: A style that is applied to part of an HTML document that is annotated\
    \ with the “style” attribute.\n- **Media Type**: This is a property definition\
    \ applying to all types of media, unless something media-specific is defined.\n\
    - **User-defined**: This is available in most browsers, as almost all modern browsers\
