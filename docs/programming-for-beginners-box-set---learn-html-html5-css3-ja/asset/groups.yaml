  mdcn: "\n\n## 区分大小写\n\n在 PHP 中，函数、关键字和类是不区分大小写的。\n\n考虑这个示例：\n\n```php\n<?php\necho\
    \ \"Testing code \";\nECHO \"Testing code \";\nEcHo \"Testing code \";\n?>\n```\n\
    \n如果你运行这段代码，你将得到如下输出：\n\nTesting code Testing code Testing code\n\n然而，变量名在 PHP\
    \ 中是区分大小写的。\n\n看这个示例：\n\n```php\n<?php\n$color = \"blue\";\necho \"The sky is\
    \ is \" . $color . \"\\n\";\necho \"The sky is is \" . $cOLOR . \"\\n\";\necho\
    \ \"The sky is is \" . $COLOR . \"\\n\";\n?>\n```\n\n如果你运行这段代码，你将得到如下输出：\n\nThe\
    \ sky is blue\n\nThe sky is is\n\nThe sky is is\n\n如果你注意到，第一条语句是唯一显示变量 $color\
    \ 值的语句。这是因为 $color、$coLOR 和 $COLOR 被视为不同的变量。\n\n## 换行\n\n要创建新行，你只需要在语句后放置 `\\\
    n` 即可。\n\n看这个示例：\n\n```php\n<?php\necho \"The sky is blue. \\n\";\necho \"The\
    \ rose is red. \\n\";\n?>\n```\n\n如果你运行这段代码，你将得到如下输出：\n\nThe sky is blue.\nThe\
    \ rose is red.\n\n## 处理表单\n\nPHP 的最大优势之一是它可以处理 HTML 表单。请注意，表单元素在 PHP 脚本中是可用的。\n\
    \n## 第4 章：数组\n\n数组是一种特殊的变量，一次可以存储多个值。它本质上是一个项目列表。例如，如果你想存储一个名字列表，可以将它们存储在单个变量中，如：\n\
    \n```php\n$name1 = \"Wendy\";\n$name2 = \"Dawn\";\n$name3 = \"David\";\n```\n\n\
    但如果你想对这些名字进行循环，你就需要一个数组。数组可以在一个名称中存储许多值，并允许你在引用索引数字时访问这些值。\n\n从一个更直观的视角来看，数组就像一张购物清单。它允许你在一个变量中存储多个项目。当你创建购物清单时，可以为你每一件需要买买的物品使用单独的纸条。这些物品就像你存储的变量。\n\
    \n不过，没必要为购物物品使用单独的纸条。那样太麻烦了，完全是浪费纸。所以，与其这样做，你只需要把需要买的所有东西写在一张纸上即可。这张单纸就像一个数组。\n\
    \n## 如何创建数组\n\nPHP 中的 `array()` 函数用于创建数组。可以使用任意数量由逗号分隔的 `key => value` 对作为参数。例如：\n\
    \n```php\narray (\n    key1 => value1,\n    key2 => value2,\n    ...\n)\n```\n\
    \n最后一个数组可能有也可能没有逗号。单行数组实际上不带逗号更好。所以，与其写 `array(1, 2, )`，你应该写 `array(1, 2)`。然而，多行数组最好保留末尾逗号，因为这使得添加新元素变得更容易。\n\
    \n实际上有三种数组：关联数组、索引数组和多维数组。关联数组是具有命名键的数组。索引数组是具有数字索引的数组。多维数组是包含一个或多个数组的数组。\n\n\
    关联数组的语法为：\n\n```php\narray (key => value, key => value, etc.);\n```\n\n例如：\n\n\
    ```php\n<?php\n$price = array(\"cantaloupes\" => \"2\", \"grapes\" => \"3\", \"\
    strawberries\" => \"4\");\necho \"Cantaloupes cost \" . $price['oranges'] . \"\
    . dollars each\";\n?>\n```\n\n索引数组的语法为：\n\n```php\narray(value1, value2, etc);\n\
    ```\n\n编写索引数组有两种方法。你可以允许索引自动分配，也可以手动分配它。\n\n看这个自动分配索引的示例：\n\n```php\n$fruits =\
    \ array(\"apples\", \"bananas\", \"kiwis\");\n```\n\n这是一个手动分配索引的示例：\n\n```php\n\
    $fruits[0] = \"apples\";\n$fruits[1] = \"bananas\";\n$fruits[2] = \"kiwis\";\n\
    ```\n\n至于多维数组，这里有一个二维数组的示例：\n\n```php\n<?php\n$fruits = array (\n  array(\"apples\"\
    , 10, 6),\n  array(\"bananas\", 4, 5),\n  array(\"kiwis\", 11, 10)\n);?>\n```\n\
    \n在 PHP 5.4 中，`array()` 可以被 `[]` 取代。这被称为短数组语法。\n例如：\n\n```php\n<?php\n$name =\
    \ array (\n  \"Wendy\" => \"Dawn\",\n  \"Dawn\" => \"Wendy\",\n);\n```\n\n如果你使用的是\
    \ PHP 5.4，可以这样写：\n\n```php\n<?php\n$name = [\n  \"Wendy\" => \"Dawn\",\n  \"Dawn\"\
    \ => \"Wendy\"\n];\n?>\n```\n\n字符串或整数可以作为键。值也可以是任何类型。此外，预期会出现这些键转换：\n\n- 浮点数 (Float)。它转换为整数。\n\
