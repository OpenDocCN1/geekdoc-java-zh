    \n在前章描述的 Hello World 程序在某种意义上是一个完整的程序，因为它完成了它编写的任务。遗憾的是，它不仅仅是为了输出信息。记住，编程语言的发明是为了人类与机器的通信。但你目前为止通过\
    \ Hello World 程序所做的只是编写了重复相同的事情；没有终端用户的参与。\n\n## 基本输入 (The Basic Input)\n\nHello\
    \ World 程序还可能出现一个问题，至少说在前章的 Hello World 程序中。在某些编译器中，运行程序会导致控制台应用程序短暂闪烁后立即关闭。这是因为在\
    \ `Console.WriteLine` 函数之后没有其他内容了。一旦它完成工作，程序将自然终止。\n\n防止这种情况的一种快速简单的方法是让你的程序在结束生命周期之前等待输入，这可以通过添加函数来实现：\n\
    \n```csharp\nConsole.ReadKey();\n```\n\n你可以将此行添加到主方法中的 `Console.WriteLine` 函数之后，这意味着你不应该把它放在在该函数紧随后的大括号之后。现在，你可以让参数的空间（括号之间）为空，因为你不需要它们。\n\
    \n去尝试运行新程序。你现在应该注意到程序\n"
