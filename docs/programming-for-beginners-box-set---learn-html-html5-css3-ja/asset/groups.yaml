    -   uksort – 使用自定义比较函数按键排序数组\n-   usort – 使用自定义比较函数按值排序数组\n\n# 第 5 章：条件语句\n\n\
    条件语句用于根据各种条件执行各种操作。通常，当你编写代码时，目标是针对特定目的执行操作。在 PHP 中，你可以使用这些条件语句：\n\n-   Switch\
    \ 语句 – 允许你选择要执行的代码块\n-   If 语句 – 如果条件为真，则执行代码\n-   If... Else If... Else 语句 –\
