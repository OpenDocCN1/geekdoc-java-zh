    **一个可以让你写代码的东西。** 基本上我们说的是某种文本编辑器。计算机上默认安装的编辑器绝对可以编写 Java 代码，但到目前，只有 Linux 操作系统拥有语法高亮功能且易于使用的文本编辑器。语法高亮意味着变量、类名等以不同的颜色显示，使代码看起来对眼睛更舒服。尽管如此，这里是编写
    Java 代码的一些最佳文本编辑器：


    - a. Notepad++ - Notepad++ 是 Windows 上最著名的文本编辑器之一，因为是免费的，并且可以从闪存盘甚至 Dropbox 中运行。它支持多种编程语言，正如名称所示，它可以完全取代预装的记事本应用程序。简而言之，它是免费的、使用快速且灵活的，如果你有
    Windows 系统，没有理由不安装这个程序。

    - b. Atom - Atom 是由程序员为程序员创建的最强大的文本编辑器之一。许多程序员喜欢这个文本编辑器，因为它不仅在外观上高度可定制，在行为上也是如此。Atom
    加载确实需要更长的时间，但一旦运行，它就可以在 Windows、Mac 和 Linux 上运行。

    - c. Vim - Vim 被称为 Vi 的简化版本。许多程序员喜欢这个文本编辑器，因为界面是高度定制的。

    - d. Eclipse - (IDE)。 技术上不是文本编辑器，而是集成开发环境。在 Eclipse 中，你只需输入 Java 代码，它会帮你记住变量和函数名并检查错误。只需一下，Eclipse
    就能编译并运行你的代码。建议使用文本编辑器，不要过度依赖 Eclipse 来完成和修正你的代码。


    **一个将你写的内容转换为计算机理解的东西。** 我们需要编译器，它将 Java 源代码转换为虚拟机理解的内容（字节码），以便它执行工作。你需要从 oracle.com
    获取最新的 Java 开发工具包 (JDK)。它是免费的，并包含简单的安装方案（对于 Windows 用户，你需要更新 PATH 变量。别担心，这些操作也很简单），但请记住下载与你操作系统对应的
    Java 标准版。


    **一个运行你程序的东西。** 在编程术中，平台是一组帮助运行 Java 语言编写程序的程序。Java 包含一个通常称为虚拟机的执行引擎和一个编译器，确保你编写的程序在不同操作系统和硬件上的运行方式相同。简而言之，Java
    程序并没有直接从操作系统运行，尽管看起来如此；它们在一个平台之上，该平台确保程序不会因为用户更换处理器或升级操作系统而崩溃。


    # Java 平台


    根据设备类型，有不同的 Java 平台供选择：


    - Java Card - 这是一个新平台，适用于小型 Java 程序（applet），运行在内存限制的智能卡等设备上。

    - Java 标准版 (Java SE) - 该平台用于创建可以在桌面计算机和浏览器上运行的 Java 应用。

    - Java 企业版 (Java EE) - 该平台构建在 Java SE 之上。从名称来看，如果你运行服务器，它非常有用，因为它允许你创建服务器应用程序。

    - Java 微型版 (Java ME) - 该平台同样构建在 Java SE 之。从名称来看，如果你需要为嵌入式设备 (Xlets)、移动信息设备 (MIDlets)
    以及任何其他具有限制显示、存储和电力的设备创建 Java 应用，它非常有用。


