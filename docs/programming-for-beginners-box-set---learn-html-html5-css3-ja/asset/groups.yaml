  mdcn: "\n级别和状态。具有“正式推荐状态”的具有最高的稳定性，而被认为是“候选推荐”（CR）状态的则被认为具有中等稳定性。\n\n由于这种方法的存在，某些模块已经“升级”到了第\
    \ 4 级（CSS4）标准。这些模块非常有限，包括选择器、背景和边框以及图像值。还有一些新功能，例如“flexbox”，它仍然被认为是“1  级”。\n\n\
    ## CSS 浏览器支持\n\n并不是所有的浏览器都能正确解析所有的 CSS 代码。由于由于，被称为“CSS 骇客”（CSS hacks）的编码技术可以过滤或针对（或两者兼有）特定的浏览器。这些通常被称为\
    \ CSS 过滤器，可以向某些浏览器显示或隐藏 CSS 的部分——这是通过利用每个浏览器的 CSS 处理漏洞（或利用其对许多 CSS 规范中某些部分的缺乏支持）来实现的。\n\
    \n通过这些过滤器，一些程序员甚至已经向某些浏览器交付不同的样式表。这种技术将确保设计以程序员预期的方式进行渲染。\n\n一些程序员还使用 CSS 过滤器来防止旧浏览器看到完整的\
    \ CSS。这是因为这些旧版浏览器本身就无法正确渲染 CSS。\n\n尽管有许多符合 CSS 标准的浏览器，但仍有很多程序员在那些不符合标准的浏览器上挣扎。这使得原本可行的技术变成了比最初意图更昂贵、更复杂。\n\
    \n## 第三部分：创建一个 HTML5/CSS3 项目\n\n## 第 4 章：博客页面\n\n在本节中，我们将使用 HTML 和 CSS 概念，利用高级技术来创建一个实践项目。该项目将是创建一个博客页面。这些说明旨在展示程序员如何使用\
    \ HTML5 和 CSS3 规范构建网站（当然，假设用于查看项目的 浏览器已经实现了这些规范）。\n\n在使用 HTML 进行标记之前，确定博客页面的整体结构是重要的。你希望标题是居中还是左对齐？侧边栏应该在左边还是右边？这些决策是非常重要的。\n\
    \n让我们来看一个标记示例：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>在此处插入博客标题</title>\n\
    </head>\n<body>\n<header>\n  <h1>在此处插入页面标题</h1>\n</header>\n<nav>\n  <!-- 这里包含你的导航栏\
    \ -->\n</nav>\n<section id=\"Introduction\">\n  <!-- 这里包含你的介绍 -->\n</section>\n\
    <section>\n<!-- 这里包含博客的主要内容 -->\n</section>\n<aside>\n<!-- 这里包含你的侧边栏 -->\n</aside>\n\
    <footer>\n<!-- 这里包含你博客的页脚 -->\n</footer>\n</body>\n</html>\n```\n\n注意标记中的 HTML5\
    \ 元素：\n\n- 仅有一个文档类型声明（doctype）。\n- “header”标签包裹了所有的介绍性元素，包括 Logo 和页面标题。在其他应用程序中，这也可以包括目录，甚至甚至是搜索表单。\n\
    - `nav` 标签，用于包含不同的导航元素（包括但不限于专门的导航，如上一个/下一页链接）。\n- `section` 标签，用于表示文档中的不同部分。它可以包含不同类型的标记，而且不同部分也可以相互嵌套。\n\
    - `aside` 标签用于包裹与其主体正文相关的内容；它们也可以独立存在。这就是为什么我们使用 `aside` 来制作博客的侧边栏。\n- `footer`\
    \ 标签可以包含有关博客主要内容的更多信息（包括但不限于网站作者、相关文档链接、版权信息等）。\n\n与以前的 HTML 版本不同，我们不再使用 `div`\
    \ 标签来包含不同的部分。现在正在使用语义化标签，这使得页面对搜索引擎更加可见，并使主题在阅读器上更具可访问性。\n\n## 标记导航\n\n现在，是时候标记页面的导航部分了。这与\
    \ HTML4 或 XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav` 标签内：\n\n```\n<nav>\n\
    \  <ul>\n    <li><a href=\"#\">此博客</a></li>\n    <li><a href=\"#\">关于我们</a></li>\n\
    \    <li><a href=\"#\">存档</a></li>\n    <li><a href=\"#\">联系我们</a></li>\n    <li><a\
    \ href=\"#\">订阅</a></li>\n  </ul>\n</nav>\n```\n\n## 标记介绍部分\n\n现在，是时候标记页面的介绍部分了。这与\
    \ HTML4 或 XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav` 标签内（注：此处原文可能误为 nav，实际应为\
    \ section）：\n\n```html\n<section id=\"Introduction\">\n  <header>\n    <h2>你了解\
    \ HTML5 和 CSS3 吗？</h2>\n  </header>\n  <p>Lorem ipsum dolor sit amet...</p>\n\
    </section>\n```\n\n## 标记主要内容\n\n现在，是时候标记页面的主要内容部分了。这与 HTML4 或 XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的\
    \ `nav` 标签内：\n\n```html\n<section>\n  <article>\n    <header>\n      <a href=\"\
    #\">插入文章标题</a>/<time datetime=\"2015-06-28T15:40:21+08:00\">2015年6月28日</time>\n\
    \    </header>\n    <p>在此处插入内容。</p>\n  </article>\n</section>\n```\n\n## 标记文章\n\
    \n现在，是时候标记页面的文章部分了。这与 HTML4 或 XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav`\
    \ 标签内：\n\n```html\n<article>\n  <header>\n    <h3>在此处插入内容</h3>\n  </header>\n\
    \  <p>在此处插入内容。</p>\n</article>\n```\n\n## 标记评论\n\n现在，是时候标记页面的评论部分了。这与 HTML4 或\
    \ XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav` 标签内：\n\n```html\n<section id=\"\
    comments\">\n  <header>\n    <h4>评论区</h4>\n  </header>\n  <article>\n    <header>\n\
    \      <a href=\"#\">评论者1</a>/<time datetime=\"2015-06-28T15:40:21+08:00\">2015年6月28日</time>\n\
    \    </header>\n    <p>Lorem ipsum dolor sit amet...</p>\n  </article>\n</section>\n\
    ```\n\n## 标记评论表单\n\n现在，是时候标记页面的评论表单部分了。这与 HTML4 或 XHTML 中的完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的\
    \ `nav` 标签内：\n\n```html\n<form action=\"#\" method=\"post\">\n  <h5>输入评论</h5>\n\
    \  <p>\n    <label for=\"name\">输入你的姓名</label>\n    <input name=\"name\" id=\"\
    name\" type=\"text\" required />\n  </p>\n</form>\n```\n\n"
