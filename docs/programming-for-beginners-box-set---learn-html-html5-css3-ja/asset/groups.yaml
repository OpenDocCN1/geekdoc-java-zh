    \ args)\n{\n}\n```\n\n类基本上是方法和变量的容器。如果你还记得第 1 章中与手机、功能机手机和智能手机的类比，那么类基本上是一个蓝图，包含了特定对象是什么以及它能做什么。在代码段中，`Classname`\
    \ 基本上只是一个占位符，可以改为任何其他名称，只要文件名随之更改即可。\n\n`Classname` 内部的代码块被称为方法。方法基本上是接收某些输入、对其进行处理并响应输出（可选）的代码块。在代码段中，`main`\
    \ 是方法的句名称；`void` 是返回值（意味着它不会返回任何内容）。`main()` 接收一组描述其输入的字符串，并将其存储在一个名为 `args` 的数组中。\n\
    \n现在你已经拥有了所有需要的工具，以及对 Java 程序模板的快速概述，你准备好创建你的第一个 Java 程序了！下一章相当短，所以请尽管直接开始，看看你的第一个\
    \ Java 代码如何欢迎世界！\n\n## 第 3 章：你的第一个世界程序\n\n传统认为，当你第一次学习一种编程语言时，你的第一个程序会在屏幕上输出“Hello\
    \ World”。话虽如此，这是你的第一个 hello world 程序的 Java 代码：\n\n```java\nclass MyFirstProgram\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n记得将此文件保存为“MyFirstProgram.java”，因为 Java 将 Java\
    \ 源代码的名称视为程序主类的名称。\n\n在运行程序之前，让我们简单聊聊源代码。`MyFirstProgram` 是程序的类，而 `main()` 是它包含的一个方法。在\
    \ `main()` 方法内部是 `System.out.println()` 函数，它基本上会获取你放入其中的任何文本并将其交给命令行或终端显示。\n\n\
    现在你已经对源代码有了一定的了解，使用以下命令编译 Java 源代码（如果你使用 IDE，你可能只需要点击“运行”按钮，程序就会编译并运行）：\n\n```bash\n\
    javac MyFirstProgram.java\n```\n\n这段代码不应该产生任何错误，但如果生成了，请返回源代码检查是否有任何拼写错误的名称、缺失的分号和其他输入错误的命令。\n\
    \n无错误编译后，你现在可以使用以下命令运行你的第一个 Java 程序：\n\n```bash\njava MyFirstProgram\n```\n\n\
    这应该会在屏幕上显示“Hello, World!”。\n\n恭喜你！你创建了你的第一个 Java 程序！这个小章节虽然让你创建了第一个程序，但也起到了在你学习完之前章节中的所有概念后让你休息。此时，休息一下是个好主意，在继续下一章之前浏览一下之前的章节，因为下一章将是本书中最长的一章。\n\
    \n## 第 4 章：编程基础\n\n我们讨论过 Java 是一种面向对象的语言，但在我们使用对象、类和其他东西之前，我们必须先掌握 Java 与其他语言共同特征，这样你才不会感到无从下手。在本章中，我们将讨论到：\n\
    \n- 注释\n- 字面量\n- 标识符\n- 数据类型\n- 变量\n- 数组\n- If-Else 语句\n- Switch 语句\n- While 和\
    \ For 循环\n\n这些特征在几乎每种编程语言中都是本质，即使你已经学习了基本的命名规范。\n\n## 注释\n\n注释功能可能是 Java 语言中最重要但最被低估的功能之一。基本上，注释功能允许你输入编译器不会运行的内容。注释的两个常见用途是：\n\
    \n- 通过简单注释你想让编译器运行的部分和你想忽略的部分，来“关闭”和“开启”代码段。\n- 为未来的后的自己提供一份详尽的解释，说明你的代码是如何工作的。\n\
