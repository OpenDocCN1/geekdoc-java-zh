    By now, you should notice that the programs you have written so far in C# run
    in one direction. They travel from the first line down to the last brace. You
    are also introduced to the if-else statements in the previous chapter, which will
    check for specific conditions before running methods. This is a single step in
    the right direction when it comes to understanding flow control in C# programs.


    # What is Flow Control?


    In simple terms, you can use flow control statements to control the direction
    or course of your program. Instead of simply running each line and method from
    top to bottom, you may tell your program which specific ones to access at any
    given moment.


    The if-else statement you used in the previous chapter is an example of flow control
    that uses Boolean logic. If one condition is met, then the following methods will
    be applied. To be clear, here is the proper syntax for writing if-else statements
    in C#:


    > * Insert the methods you wish to run in case the conditions are met */


    ```

    }

    else if (“Insert secondary conditions here”)

    {

    ```'
