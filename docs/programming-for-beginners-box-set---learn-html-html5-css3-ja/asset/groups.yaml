    \    break;\n    default:\n        /* 如果 switch 语句变量不等于上述任何 case 标签，插入将发生的情况 */\n\
    \        break;\n}\n```\n\n同时请记住，你需要在每个 case 结束操作的地方插入 `break ;`。否则，程序将继续运行剩余的\
    \ case，这会违背了使用 switch 流控制语句的目的。\n\n还要注意，default case 等同于 if-else 语句中的 else 语句。\n\
    \n这里是一个简单的示例，要求用户从给定范围内输入一个数字并给出相应的响应：\n\n```csharp\nchar x;\nConsole.WriteLine(\"\
