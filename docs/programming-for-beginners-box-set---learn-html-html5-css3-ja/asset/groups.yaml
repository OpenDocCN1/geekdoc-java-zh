  - '[PAGE 110]


    +   1. What a cellular phone''s general features are

    2. What a smartphone''s general features are

    3. What a dumb-phone''s general features are


    Which brings us to the idea of inheritance, an important concept in object-oriented
    programming. Notice how both smartphones and dumb-phones have the features of
    a cellular phone, with some additional features that merit creating a new subcategory
    that inherits all the features of a cellular phone while still being able to contain
    additional features exclusive to them.


    **Polymorphism.** As for the general features of a cellular phone that the smartphones
    and dumb-phones inherit, notice how smartphones can send text messages in a different
    manner compared to dumb-phones in terms of the available emoticons, multimedia
    capabilities, etc. This is because the changes in the implementation of the text
    messaging applications on the smartphone and dumb-phone override the default implementation
    in the original cellular phone. However, if a person asks to borrow a cellular
    phone for text messaging, you could give him a smartphone or a dumb-phone, both
    of which are acceptable despite containing differing implementations of the text-messaging
    feature. This phenomenon is known as polymorphism in the Java world; if something
    in your code asks for an object from a certain class, it''ll accept even one from
    its subclass.


    Wow! That''s quite a lot to take in! Now that we have talked about two of the
    most difficult yet important concepts in object-oriented programming, we can now
    afford to relax a bit as we cruise into the concept of classes and objects:


    **Classes.** The features you''ve listed for the cellular phone, dumb-phone, and
    smartphone basically tell you that any object manufactured with the aim of being
    considered a cellular phone, a dumb-phone, or a smartphone must contain all of
    those listed features. Classes serve as blueprints and basically tell you what
    to expect when you create an object from them.


    **Objects.** Objects are the building blocks of Java. When cellular phones, dumbphones,
    or smartphones are manufactured, they have their own memory and will eventually
    earn scratches and dents as people use them more frequently. This means that despite
    a hundred or even a million cellular phones, dumb-phones, or smartphones being
    manufactured, each one will be more unique with continued usage. In short, objects
    are the products manufactured from the blueprint (class).


    # **What is Java?**


    Like human languages, programming languages come in many different flavors, one'
