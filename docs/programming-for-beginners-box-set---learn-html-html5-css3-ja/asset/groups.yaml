    # Chapter 7: Opening, Reading, Writing, and Closing Files'
  - '[PAGE 180]


    # Opening and Closing Files


    In PHP, the function fopen ( ) is used to open files. It requires two arguments
    that state the file name and the mode in which it has to operate.


    | Mode | Purpose |

    | --- | --- |

    | r | It opens the file for the sole purpose of reading. It positions the pointer
    at the start of the file. |

    | r+ | It opens the file for both reading and writing. It positions the pointer
    at the start of the file. |

    | w | It opens the file for the sole purpose of writing. It positions the pointer
    at the start of the file, as well truncates it to zero length. If there are no
    files, it tries to create one. |

    | w+ | It opens the file for both reading and writing. It positions the pointer
    at the start of the file, as well truncates it to zero length. If there are no
    files, it tries to create one. |

    | a | It opens the file for the sole purpose of writing. It positions the pointer
    at the end of the file. If there are no files, it tries to create one. |

    | a+ | It opens the file for both reading and writing. It positions the pointer
    at the end of the file. If there are no files, it tries to create one. |


    The function fopen ( ) returns the value of false in case opening a file does
    not become successful. Otherwise, it returns a file pointer to write or read to
    that particular file.


    Once you are done making changes to your file, you have to close it using the
    function fclose ( ). It requires a file pointer as an argument. It returns true
    if the closure is successful and false if it is not.'
  - "[PAGE 181]\n\n# Reading Files\n\nAfter you open a file using the function fopen\
    \ ( ), you can read it using the function fread ( ). It requires two arguments.\
    \ It reads the length bytes from the file pointer referenced by the handle. It\
    \ stops reading as soon as it has read the length bytes, reaches the end of the\
    \ file, a socket timeout occurs, or a packet becomes available.\n\nYou can use\
    \ the function filesize () to find the length of your file. It takes the file\
    \ name as an argument and returns its size in bytes. It also returns false on\
    \ failure or the read string. Take note that the function read() reads from the\
    \ current position of your file pointer. If you want to find the current position\
    \ of the file pointer, you have to use the function ftell ( ). If you want to\
    \ rewind the position of the file pointer, you have to use rewind ( ).\n\nTake\
    \ a look at the following example:\n\n```\n<?php\n$filename = \"testfile.txt\"\
    ;\n$file = fopen($filename, \"r\");\nif ($file == false) {\n    echo (\"Opening\
    \ File Error\");\n    exit ( );\n}\n$files = filesize($filename);\n$filetext =\
    \ read($file, $files);\nfclose($file);\necho (\"The size of the file is $files\
    \ bytes\");\necho (\"<pre>$text</pre>\");\n?>\n```\n\nIn the above example, the\
    \ content of the text file testfile.txt is assigned to a variable and then displayed\
    \ as the output."
  - '[PAGE 182]


    # Writing Files


    If you want to write a new file or append a text to a existing file, you can use
    the function `fwrite()`. It requires two arguments to specify the file pointer
    and the data string to be written. You can include a third integer argument if
    you want to specify the length of the data to be written. This third integer argument
    is optional, though. If you do not include any third argument, writing would stop
    upon reaching the specified length.


    The function `fwrite()` writes the contents of the string to the file stream pointed
    to by the handle. It returns false on error or the number of bytes. If you are
    using a system that differentiates between text files and binary files, such as
    Windows, you should open your file with ‘b’ included in the `fopen()` mode. Also,
    if the handle is opened in append mode, `fwrite()` becomes atomic, except when
    the size of the string exceeds the block size of the file system. There is no
    more need to `flock()` a resource before you call `fwrite()`. You can write all
    data without any interruption.


    Take a look at the following example:


    ```

    <?php

    $file = fopen("testfile.txt", "w");

    echo fwrite($file, "Testing sample!");

    fclose($file);

    ?>

    ```


    If you run the above code, you will get an output of:

    15


    Why? You get 15 because *Testing sample!* has fifteen characters including spacing.'
