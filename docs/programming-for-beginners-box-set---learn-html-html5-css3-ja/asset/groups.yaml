  mdcn: "\n\n通常我们有 <a href=\"url\"> 文本/</a>，但在情况下，我们没有放置链接文本而是放置了一张图片。因此，在链接的开始和结束标签\
    \ (`<a>`) 之间，我们放置了图像标签。\n\n我们还使用了已知的 `style` 标签来设置图片的宽度、高度和边框。\n\n我们将在下一章详细讨论图像。\n\
    \n- 待办事项...\n\n在你网页的某处放置一个指向你 Facebook 页面的链接。\n\n## 第 11 章\nHTML 图像\n\n正如你在上一章中已经看到的，HTML\
    \ 图像是使用 `<img>` 标签定义的。该标签本身是空的，它只包含属性。`<img>` 没有闭合标签。`src` 属性包含图像特定的网络地址 (URL)。\n\
    \n我们可以从本地计算机或互联网链接图像。如果你使用存储在计算机上的图片，它必须被放置在与你的 HTML 文件相同的文件夹中。\n\n无论通过哪种方式，如果发生了某些情况导致图像未能加载，准备一个备份计划总是是好的。在这种情况下，我们使用\
    \ `alt` 属性。它在图像加载失败时指定一个备用文本。\n\n语法如下：\n\n```\n<img src=\"missing.jpg\" alt=\"\
    Oops image is missing!\" style=\"width:128px; height:128px\">\n```\n\n对于我们“缺失”的图像，浏览器将显示某些内容，因为它会获取我们\
    \ `alt` 属性的值。\n\n注意，我们始终为图片的宽度和高度设置 `style`。这防止了其他样式表更改图像的原始尺寸（除非你想这么做）。样式表用于\
    \ CSS 样式设计，我们将在系列的第二书中详细讨论它们。\n\n通常，浏览器期望图像与网页位于同一个目录下。然而，如果你想使用另一个文件夹中的图像，你必须在\
    \ `src` 属性中包含文件夹名称，如下：\n\n```\n<img src=\"/images/facebooklogo.jpg\" alt=\"Oops\
    \ image is missing!\" style=\"width:128px; height:128px\">\n```\n\n我已经在上一章中向你展示了如何将图像作为链接。你只需要将图像标签嵌套在链接标签内部。\n\
    \n```\n<a href=\"www.facebook.com\">\n<img src=\"facebooklogo.jpg\" style=\"width:50px;\
    \ height:50px; border:0\">\n</a>\n```\n\n## 第 12 章\nHTML 表格\n\n表格在 HTML 中被常用。它们用\
    \ `<table>` 标签定义，并用 `<tr>` 标签分为表格行。表格行用 `<td>` 标签分为数据行，也可以用 `<th>` 标签分为表头。\n\n\
    这是一个示例：\n\n```\n<table style=\"width:100%\">\n<tr>\n  <<td>>John </td>\n  <<td>>Peter\
    \ </td>\n</tr>\n<tr>\n  <td>Fema </td>\n  <<td>>Nikol </td>\n</tr>\n</table>\n\
    ```\n\n我们有一个两行的表格，每行都包含表格数据。\n\n通过将宽度设置为 100%，我们确保它将始终占据浏览器窗口的 100%。但目前它看起来并不像我们习惯看到的表格。\n\
    \n我们需要添加一些边框。我们通过在表格标签内定义 `border` 值来实现这一点。\n\n<table border=\"1\" style=\"width:100%\"\
    >\n\n如果你不指定边框，表格将不带边框显示。使用 CSS 边框属性更好且更推荐，因为 HTML 的属性正在过时。你可以在我即将出版关于 CSS 样式的书中学习关于它们的所有知识。\n\
    \nHTML 表格头默认加粗并居中显示。它们的语法如下：\n\n```\n<table border=\"1\" style=\"width:100%;\"\
    >\n<tr>\n  <th> First Name </th>>\n  <th> Sallary </th>>\n</tr>\n<tr>\n  <td>\
    \ John </td>>\n  <td> 120 000$ </td>>\n</tr>\n<tr>\n  <td> Peter </td>>\n  <td>\
    \ 95 000$ </td>>\n</tr>\n</table>\n```\n\n![](img/f1f3317e3c574b724055b1c9e128d700_25_0.png)\n\
    \n- 待办事项...\n\n用不同的数据和边框大小创建你自己的 HTML 表格。尝试通过添加更多表格数据来让它变大。\n\n## 第 13 章\nHTML\
    \ 列表\n\nHTML 语言可以拥有无序列表、有序列表或描述列表：\n\n| 无序列表 | 有序列表 | 描述列表 |\n| --- | --- | ---\
    \ |\n| - 第一个项目 | 1. 第一个项目 | 第一个项目 |\n| - 第二个项目 | 2. 第二个项目 | 项目描述 |\n| - 第三个项目\
    \ | 3. 第三个项目 | 第二个项目 |\n| - 第四个项目 | 4. 第四个项目 | 项目描述 |\n\n**无序**列表以 `<ul>` 标签开始，每个列表项目以\
    \ `<li>` 标签开始。\n\n```\n<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n\
    </ul>\n```\n\n你可以通过在 `<ul>` 标签中嵌套 `style` 属性来更改列表的样式：\n\n```\n<ul style=\"list-style-type:square;\"\
    >\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>\n```\n*(注：原文示例处代码块似乎缺失了\
    \ style 属性，此处根据语境补充了常见逻辑或保持结构原意，按要求不翻译代码，如下：)*\n\n```html\n<ul>\n  <li>HTML</li>\n\
    \  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>\n```\n\n你可以通过在 `<ol>` 标签中嵌套 `style`\
    \ 属性来更改列表的样式：\n\n```\n<ol style=\"list-style-type:circle;\">\n  <li>HTML</li>\n\
    \  <li>CSS</li>\n  <li>JavaScript</li>\n</ol>\n```\n\n你可以通过在 `<dl>` 标签中嵌套 `style`\
    \ 属性来更改描述列表的样式：\n\n```\n<dl style=\"list-style-type:decimal;\">\n  <dt>HTML</dt>\n\
    \  <dd>HyperText Markup Language</dd>\n  <dt>CSS</dt>\n  <dd>Cascading Style Sheets</dd>\n\
    \  <dt>JavaScript</dt>\n  <dd>A programming language</dd>\n</dl>\n```\n*(注：由于原文提供的文本在列表部分仅有表格和描述，未给出具体代码块，以上翻译严格遵循文本内容。)*\n\
    \n**无序**列表以 `<ul>` 标签开始，每个列表项目以 `<li>` 标签开始。\n\n你可以通过在 `<ul>` 标签中嵌套 `style` 属性来更改列表的样式。\n\
    \n你可以通过在 `<ol>` 标签中嵌套 `style` 属性来更改列表的样式。\n\n你可以通过在 `<dl>` 标签中嵌套 `style` 属性来更改描述列表的样式。\n\
    \n"
