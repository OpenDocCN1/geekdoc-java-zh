- md: "\nIn addition to the above-features, the users of a page containing CSS may\
    \ also opt to override the CSS file inside the page and use one that is stored\
    \ in their device. If both the readers and authors do not have any CSS files specified,\
    \ then the browser's default style will be used. Like how CSS can influence these\
    \ files immediately, CSS can also alter the hundreds of documents easily, by simply\
    \ altering a few blocks or lines of code.\n\nThe term \"cascading\" in CSS's name\
    \ was obtained from its behavior. The specification means a certain scheme that\
    \ identifies priorities, determining which style rule will apply if more than\
    \ a single rule is matched against a certain element. This \"cascade\" or weight\
    \ of the rule is computed and assigned, so that its results become predictable.\n\
    \nThe specifications of CSS are also brought about by the W3C, just like in HTML.\
    \ The Consortium even operates a CSS validation service for documents, which offers\
    \ services for free.\n\n## CSS Selectors\n\nSelectors, in CSS parlance, are used\
    \ to name which portion on the markup the specific style will apply to. This is\
    \ done by matching the attributes and tags within the markup. The selectors may\
    \ be applied to the following:\n\n- All elements of each certain type, such as\
    \ the first-level headers or h1.\n- Elements that are identified by specific attributes,\
    \ such as \"id\" (the identifier that is unique to the document), and \"class\"\
    \ (the identifier that brings different elements within a document).\n- Elements\
    \ in general, which still depends on how they are placed in relation to the others\
    \ within the document tree.\n\nIn the above areas where selectors apply, it must\
    \ be remembered that IDs and classes are case-sensitive. These start with alphabet\
    \ characters, and may include any alphanumeric characters as well as underscores.\
    \ IDs, in particular, is only applied to a single instance of a single element.\n\
    \nThere are also pseudo-classes that CSS selectors use in order to allow formatting\
