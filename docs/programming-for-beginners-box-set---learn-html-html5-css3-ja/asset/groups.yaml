    # 第1章：PHP 简介


    PHP 代表 PHP: 超文本处理器（Hypertext Preprocessor），是一种在服务器上执行脚本的开源脚本语言。它是免费下载并提供的。它是 Web
    开发的理想选择，推荐初学者使用。它可以嵌入 HTML 中。此外，它还可以用于 WordPress 和 Facebook。


    PHP 文件可以包含 HTML、JavaScript、CSS、PHP 代码和文本。PHP 与客户端 JavaScript 的区别在于代码是在服务器上执行的，并生成发送到客户端的
    HTML。运行脚本后，即使客户端不知道底层代码，也能收到结果。可以配置 Web 服务器以使用 PHP 处理 HTML 文件。


    PHP 简单到新手也能理解，但它也为高级程序人员提供了许多高级功能。你甚至可以在几小时内开始编写简单的脚本。


    请注意，尽管它的创建重点是服务器端脚本编写，但你还可以用它做更多事情。


    # 为什么你应该学习 PHP


    你可能认为，如果你精通 JavaScript，学习 PHP 就不再必要了。然而，与 PHP 相比，JavaScript 实际上限制。JavaScript 运行在客户端或浏览器中，这意味着它只知道浏览器中发生的事情以及你访问的网站。


    相反，PHP 运行在你访问的网站所在的同一台计算机或服务器上。它可以访问该计算机上的每个文件和信息，这使其能够创建发送到你浏览器的自定义 HTML 页面、运行任务、执行计算并处理该网站的
    Cookie。


    PHP 可以在服务器上打开、创建、写入、读取、关闭和删除文件。它可以生成页面内容、收集表单数据并发送接收 Cookie。它还可以在数据库中删除、添加和修改数据。此外，它可以加密数据以及控制用户访问。


    通过 PHP，你可以输出 PDF 文件、图像和 Flash 电影。你不限于 HTML。PHP  主要用于以下领域：


    - 服务器端脚本。

    它是 PHP 的主要目标领域。为了让它工作，你需要 PHP 解析器、浏览器和 Web 服务器。你可以通过这些访问支持 Web 服务器运行 PHP 程序。


    - 命令行脚本。

    即使你没有浏览器或服务器，仍然可以使用 PHP。你只需要 PHP 解析器。建议使用 Windows 任务计划或 Linux 的 cron 定期运行这些脚本。你也可以用于简单的文本处理。


    - 创建桌面应用程序

    虽然 PHP 不是创建带图形界面桌面应用程序的首选，但如果你想在应用程序中包含高级功能，仍然可以使用它。你可以使用 PHP-GTK 创建此类客户端应用程序。此外，你还可以编写跨平台应用程序。PHP-GTK
    实际上是一个 PHP 扩展，在主发行版中可用。


    你可以在任何主要的操作系统上使用 PHP，包括 Unix、Linux、Microsoft Windows、RISC OS 和 Mac OS X。PHP 还受到大多数流行
    Web 服务器的支持，如 Apache 和 IIS。任何可以使用 CGI 二进制文件的 Web 服务器（如 nginx 和 lightttpd）也可以使用
    PHP。PHP 可以作为 CGI 处理器或模块。


    你可以自由选择任何 PHP Web 服务器和操作系统。此外，你可以选择对象编程、过程编程或两者的结合。PHP 可以自动生成文件并将其保存到系统中，而不是打印出来。


    PHP 的主要优势之一是支持多种数据库。使用数据库特定扩展或抽象层（如 PDO）编写启用数据库的 页面非常简单。你还可以通过 ODBC 扩展连接到支持数据库连接标准的数据库。


    此外，PHP 支持通过 IMAP、LDAP、SNMP、POP3、NTTP、COM 和 HTTP 等协议与其他服务进行通信。你甚至可以使用你选择的协议交互打开原始网络套字。PHP
    支持 Java 安装以及所有编程语言之间的 WDDX 数据交换。


    PHP 还具有文本处理功能，包括 Perl 兼容正则表达式和其他用于解析和访问 XML 文件的工具。PHP 标准化了 XML 扩展，并增加了 XML Reader、XML
    Writer 和 Simple XML 支持。


    PHP 还增加了 PECL 扩展，例如 Xdebug。


