  - '[PAGE 154]


    # Chapter 4: Arrays


    An array is a special variable that stores multiple values one at a time. It is
    basically a list of items. For instance, if you want to store a list of names,
    you can store them in single variables such as:


    ```

    $name1 = "Wendy";

    $name2 = "Dawn";

    $name3 = "David";

    ```


    However, if you want to create a loop through these names, you need an array.
    Arrays can hold numerous values in one name and allow you to access these values
    when you refer to an index number.


    To put it in a much simpler perspective, an array is like a grocery list. It lets
    you store more than one item in one variable. When you create your grocery list,
    you can use separate pieces of paper for every item that you have to buy. These
    items are like the variables that you store.


    Using separate pieces of paper for your grocery items is unnecessary though. It
    is such a hassle and a total waste of paper. So, instead of doing this, you can
    just write down everything you need to buy in a single piece of paper. This single
    piece of paper is just like an array.'
  - "[PAGE 155]\n\n# How to Create an Array\n\nThe array ( ) function in PHP is used\
    \ to create arrays. Any number of comma-separated key => value pairs can be used\
    \ as arguments. For instance,\n\n```\narray (\n    key1 => value1,\n    key2 =>\
    \ value2,\n...\n)\n```\n\nThe last array may or may not have a comma. Single-line\
    \ arrays are actually better off without commas. So instead of writing array (1,\
    \ 2, ), you should write array (1, 2). Multi-line arrays, however, are preferred\
    \ to have trailing commas because they make the addition of new elements easier.\n\
    \nThere are actually three types of arrays: associative, indexed, and multidimensional.\
    \ Associative arrays are arrays that have named keys. Indexed arrays are arrays\
    \ that have a numeric index. Multidimensional arrays are arrays that contain one\
    \ or more arrays.\n\nThe syntax for associative arrays is:\n\n```\narray (key\
    \ => value, key => value, etc.);\n```\n\nFor example:\n\n```\n<?php\n$price =\
    \ array(\"cantaloupes\" => \"2\", \"grapes\" => \"3\", \"strawberries\" => \"\
    4\");\necho \"Cantaloupes cost \" . $price['oranges'] . \". dollars each\";\n\
    ?>\n```\n\nThe syntax for index arrays is:\n\n```\narray(value1, value2, etc);\n\
    ```\n\nThere are two ways how you can write indexed arrays. You can allow the\
    \ index to be automatically assigned or assign it manually.\n\nTake a look at\
    \ this example of an automatically assigned index:\n\n```\n$fruits = array(\"\
    apples\", \"bananas\", \"kiwis\");\n```"
  - "[PAGE 156]\n\nAnd here is = example of a manually assigned index:\n\n```\n$fruits\
    \ [0] = \"apples\";\n$fruits [1] = \"bananas\";\n$fruits [2] = \"kiwis\";\n```\n\
    \nAs for multidimensional array, here is an example of a two-dimensional array:\n\
    \n```\n<?php\n$fruits = array (\n  array(\"apples\", 10, 6),\n  array(\"bananas\"\
    , 4, 5),\n  array(\"kiwis\", 11, 10)\n);?>\n```\n\nIn PHP 5.4, array () can be\
    \ replaced with [ ]. This is called the short array syntax.\nFor example:\n\n\
    ```\n<?php\n$name = array (\n  \"Wendy\" => \"Dawn\",\n  \"Dawn\" => \"Wendy\"\
    ,\n);\n```\n\ncan be written like this if you are using PHP 5.4:\n\n```\n<?php\n\
    $name = [\n  \"Wendy\" => \"Dawn\",\n  \"Dawn\" => \"Wendy\"\n];?>\n```\n\nA string\
    \ or an integer can be the key. The value can also be of any type. In addition,\
    \ these key casts are expected to occur:\n\nFloat. It is cast to an integer, truncating\
    \ the fractional part. For example, the key 9.7 is going to be stored under 9."
  - '[PAGE 157]


    String. A string that contains a valid integer is cast to the integer type. For
    example, the key 9 is going to be stored under 9 while the key 09 is not going
    to be cast since it is not a valid decimal integer.


    Bool. It is also cast to an integer. For example, the key false is going to be
    stored under 0 while the key true is going to be stored under 1.


    Null. It is cast to an empty string. For example, the key null is going to be
    stored under “ .


    Objects and arrays can never be used as keys. If you try to use them as keys,
    you will get an illegal offset type warning.


    If you declare multiple elements with the same key, the last one is going to be
    used while the others are going to be overwritten.


    Consider the following example:


    ```

    <?php

    $array = array (

    1 => "w",

    "1" => "x",

    1.5 => "y",

    true => "z",

    );

    var_dump($array);

    ?>

    ```


    If you run this code, you will get an output of:


    ```

    array (1) {

    [1] =>

    string (1) "z"

    }

    ```


    This is the resulting output because all the keys are cast to 1. For every new
    element, the value is overwritten, which is why the value “z” is left. String
    and integer keys can be contained in PHP arrays all at once since PHP cannot differentiate
    associative and indexed arrays.'
  - '[PAGE 158]


    # The Square Bracket Syntax


    The array [key] syntax can be used to access array elements. Both curly braces
    and square brackets can be used interchangeably if you want to access array elements.
    Since PHP 5.4, you can array dereference the results of method calls and function
    calls directly. In the earlier versions, you can only array dereference with the
    use of a temporary variable. Since PHP 5.5, you can already array dereference
    array literals. Then again, note that you cannot access array keys that have not
    been defined just as you cannot access any undefined variables. If you do, you
    will get an E_NOTICE-level error message and a NULL output.


    When it comes to creating or modifying arrays using square bracket syntax, you
    can explicitly set values in them. You can do this by assigning values to the
    arrays. The keys should be specified in brackets or omitted to result in empty
    brackets ([]). If you wish to change a value, you can assign another value to
    the element through its key. If you wish to remove a value pair or key, you can
    use the unset () function.


    However, the array cannot be re-indexed. If you wish to remove and shift, you
    can use the array_values () function to re-index the array. Keep in mind that
    if you do not specify any key, the maximum integer indices will be taken. This
    will result in the new key being the maximum value plus one. If there are no integer
    indices, the key is going to be zero. The maximum integer key does not have to
    exist in the array currently though. It only has to exist in the array again after
    the array gets re-indexed.


    Whenever you use a string literal array index, make sure that you do not forget
    to use quotes. Also, you should never write $foo[bar]. Instead, you should write
    $foo[''bar'']. Even though it works, it is still wrong. If you notice, it uses
    an undefined constant instead of a string. Bar is the undefined constant while
    ''bar'' is the string.'
