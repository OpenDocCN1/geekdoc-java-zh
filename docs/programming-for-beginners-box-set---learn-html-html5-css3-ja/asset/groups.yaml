    \ Java 代码。\n\n现在你已经知道了注释的常见用途以及它们为什么重要，这里有两种常见的注释类型，以及你如何在未来的 Java 程序中有效使用它们：\n\
    \n单行注释，被称为单行注释。单行注释是跨越一行的注释。它以 `//` 开始，直到它所在行的末尾。这里有一个使用稍加修改的 `MyFirstProgram.java`\
    \ 的示例：\n\n```java\nclass MyFirstProgram {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n        // 输出 \"Hello,\
    \ World!\"\n    }\n}\n```\n\n正如你所见，单行注释非常适合为简单的函数和过程提供简要总结。它们也适合开启和关闭代码部分，在 `System.println()`\
    \ 前添加注释看看发生什么！\n\n多行注释，被称为多行注释。如果你需要为程序创建长描述，在每行添加注释将非常麻烦。幸运的是，多行注释的存在使得多行注释变得简单。它以\
    \ `/*` 开始，以 `*/` 结束，之间的所有内容都被编译器忽略。这是一个进一步修改 `MyFirstProgram` 的示例：\n\n```java\n\
