  - '[PAGE 21]


    The syntax of the HTML Links:


    ```

    <a href="url">Link text</a>

    ```


    Where <a> is the link tag and href is the attribute. You''ve saw it in one of
    the previous chapters. The href attribute specifies the destination of the web
    address you want to link. The link text is the visible to the viewer part of the
    link. When the user clicks on the link text or image he''ll be redirected to another
    page.


    When you move your mouse cursor over a link two things happen:


    +   - The mouse arrow turns into hand.

    - The link element changes its color.


    By default links appear as follows in your browser:


    An unvisited link is underlined and blue.

    A visited link is underlined and purple.

    An active link is underlined and red.


    ```

    <style>

    a:link {color:#000000; background-color:transparent; text-decoration:none}

    a:visited {color:#000000; background-color:transparent; text-decoration:none}

    a:hover {color:#ff0000; background-color:transparent; text-decoration:underline}

    a:active {color:#ff0000; background-color:transparent; text-decoration:underline}

    </style>

    ```


    As you can see from the example you can change the defaults by using the style
    attribute.


    Another cool and important thing is displaying images as links. We do that like
    this:


    ```

    <a href="www.facebook.com">

    <img src="facebooklogo.jpg" style="width:50px; height:50px; border:0">

    </a>

    ```


    So what we did there:'
- md: "\nNormally we have the <a href=\"url\"> Link text/</a> but in this case instead\
    \ of link text we're putting an image. So between the opening and closing tag\
    \ of the link (<a>) we put the image tag.\n\nWe've also used the already known\
    \ style tag for the image to set the width, height and border.\n\nWe'll talk more\
    \ about the images on the next chapter.\n\n- To Do...\n\nPut a link to your Facebook\
    \ page somewhere on your web page.\n\n## Chapter 11\nHTML Images\n\nAs you've\
    \ already saw in the previous chapter, HTML images are defined with the <img>\
    \ tag. The tag by itself is empty and it contains only attributes. The <img> does\
    \ not have a closing tag. The src attribute contains the specific web address\
    \ (URL) of the image.\n\nWe can link an image from our local computer or from\
    \ the internet. If you're using a picture that's stored on your computer, it must\
    \ be placed in the same folder as your HTML file.\n\nIn both ways it's good to\
    \ have a backup plan if something happens and your image fails to load. In that\
    \ case we use the alt attribute. It specifies an alternate text if our image fails\
    \ to load.\n\nThe syntax looks like this:\n\n```\n<img src=\"missing.jpg\" alt=\"\
    Oops image is missing!\" style=\"width:128px; height:128px\">\n```\n\nWith our\
    \ \"missing\" image the browser will display something so it’ll grab the value\
    \ of our alt attribute.\n\nNotice that we’re always setting style for the width\
    \ and height of the picture. That prevents any other style sheets to change the\
    \ original size of the image (unless you want to.) Style sheets are used with\
    \ the CSS styling and we’ll talk a lot about them in the second book of the series.\n\
    \nNormally the browser expects the image to be in the same as the web page. However,\
    \ if you want to use an image from another folder, you have to include the folder\
    \ name in the src attribute like this:\n\n```\n<img src=\"/images/facebooklogo.jpg\"\
    \ alt=\"Oops image is missing!\" style=\"width:128px; height:128px\">\n```\n\n\
    I’ve already shown you how you can use an image as a link in the previous chapter.\
    \ You just have to nest the image tag inside the link one.\n\n```\n<a href=\"\
    www.facebook.com\">\n<img src=\"facebooklogo.jpg\" style=\"width:50px; height:50px;\
    \ border:0\">\n</a>\n```\n\n## Chapter 12\nHTML Tables\n\nTables are commonly\
    \ used in HTML. They are defined with the `<table>` tag and divided into table\
    \ rows with the `<tr>` tag. The table rows are divided into data rows with the\
    \ `<td>` tag and can also be divided into table headings with the `<th>` tag.\n\
    \nHere's an example:\n\n```\n<table style=\"width:100%\">\n<tr>\n  <td>John </td>\n\
    \  <td>Peter </td>\n</tr>\n<tr>\n  <td>Fema </td>\n  <td>Nikol </td>\n</tr>\n\
    </table>\n```\n\nWe have a table with two rows of each of containing table data.\n\
    \nBy setting the width to 100%, we make sure that it'll always spread 100% of\
    \ the browsers' window. But at the moment it doesn't really look like the tables\
    \ we're used to see.\n\nWe need to put some borders. We do that by defining the\
    \ border value inside the table tag.\n\n<table border=\"1\" style=\"width:100%\"\
    >\n\nIf you don't specify a border, the table will be displayed without one. It's\
    \ a lot better and even recommended to use CSS border properties because the HTML\
    \ one is on our way out. You can learn all about them in my upcoming book about\
    \ CSS styling.\n\nThe HTML table headings are displayed by default as bold and\
    \ centered. The syntax for them is as follows:\n\n```\n<table border=\"1\" style=\"\
    width:100%;\">\n<tr>\n  <th> First Name </th>\n  <th> Sallary </th>\n</tr>\n<tr>\n\
    \  <td> John </td>\n  <td> 120 000$ </td>\n</tr>\n<tr>\n  <td> Peter </td>\n \
    \ <td> 95 000$ </td>\n</tr>\n</table>\n```\n\n![](img/f1f3317e3c574b724055b1c9e128d700_25_0.png)\n\
    \n- To Do...\n\nMake your own HTML table with different data and border size.\
    \ Try making it larger by adding more table data.\n\n## Chapter 13\nHTML Lists\n\
    \nThe HTML language can have unordered lists, ordered lists or description lists:\n\
    \n| Unordered List | Ordered List | Description List |\n| --- | --- | --- |\n\
    | - The first item | 1. The first item | The first item |\n| - The second item\
    \ | 2. The second item | Description of item |\n| - The third item | 3. The third\
    \ item | The second item |\n| - The fourth item | 4. The fourth item | Description\
    \ of item |\n\nThe **unordered** lists start with `<ul>` tag and each list item\
    \ starts with the `<li>` tag.\n\n```\n<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n\
    \  <li>JavaScript</li>\n</ul>\n```\n\nYou can change the style of the list by\
    \ nesting the **style** attribute inside the `<ul>` tag. There are four types\
    \ of style for unordered list:\n\n- list-type:disc The list items will be marked\
    \ with bullets (default).\n- list-type:circle: The list items will be marked with\
    \ circles.\n- list-type:square: The list items will be marked with squares.\n\
    - list-type:none The list items will not be marked.\n\nThe syntax is the following:\n\
    \n```\n<ul style=\"list-type:disc\">\n```\n\nYou only have to change the type\
    \ at the end. The **ordered** HTML lists start with `<ol>` tag. The list items\
    \ just start with the `<li>` tag.\n\n```\n<ol>\n  <li>HTML</li>\n  <li>CSS</li>\n\
    \  <li>JavaScript</li>\n</ol>\n```\n\nHere we have five of ordered list:\n\n-\
    \ type=\"1\" The list items will be numbered with numbers (default).\n- type=\"\
    A\" The list items will be numbered with uppercase letters.\n- type=\"a\" The\
    \ list items will be numbered with lowercase letters.\n- type=\"I\" The list items\
    \ will be numbered with uppercase roman numbers.\n- type=\"i\" The list items\
    \ will be numbered with lowercase roman numbers.\n\nThe syntax is:\n\n```\n<ol\
    \ type=\"1\">\n```\n\nAnd again only have have change type at the end. The HTML\
    \ **description** lists are defined by `<dl>` tag. It’s a list with description\
    \ of each term. `<dt>` tag defines the term and `<dd>` tag defines the data.\n\
    \n```\n<dl>\n  <dt></dt>\n  <dd>- document based</dd>\n  <dt>CSS</dt>\n  <dd>-\
    \ Styling</dd>\n</dl>\n```\n\n## Conclusion\nThat was it... the HTML basics as\
