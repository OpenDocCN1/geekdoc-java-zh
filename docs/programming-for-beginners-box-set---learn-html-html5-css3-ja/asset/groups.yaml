    \n# 编写循环\n\n另一种创建变体的方法是循环只要满足条件就会一直重复。一旦条件不再满足，循环就会停止。有三种主要的循环：\n\n# While 循环\n\
    \nwhile 循环在运行之前会测试条件。利用 while 循环最简单的方法是创建一个从 10 开始倒数的程序。如下：\n\n```csharp\nint\
