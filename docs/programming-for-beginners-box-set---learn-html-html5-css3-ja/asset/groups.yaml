    # 简介


    # 第一部分：HTML5


    第 1 章 什么是 HTML5？


    第 2 章 -- HTML5 中的语言变化


    # 第二部分：CSS3


    第 3 章 什么是 CSS3？


    # 第三部分：创建一个 HTML5 和 CSS3 项目


    # 结


    # 第一部分：HTML5


    ## 第 1 章：什么是 HTML5？


    与网络上的任何核心技术一样，HTML 也在不断演进。HTML5 的主要目的是改进运行 Web 的基础语言，在增加对最新多媒体支持的同时，保持语言对人类易于阅读。它还旨在让读取它的机器（即解析器、网络浏览器等）对其有更一致的理解。HTML5
    的创建是为了能够涵盖 DOM Level 2 HTML、XHTML 1 及其直接前身版本 HTML 4。


    该语言的新版本也是为了响应 XHTML 和 HTML 在 Web 上被共同使用的这一事实，并且两者都包含了由专有软件（如浏览器本身）甚至常见做法引入的特性混合。HTML5
    也被视为定义一种标记语言的尝试，程序员可以编写 HTML 或其表兄弟 XHTML。它可能包含促进更具互操作性实现的处理模型，并引入了用于更复杂 Web 应用的标记和
    API（应用程序接口）。


    HTML5 还认为是跨平台移动应用的良好选择。许多 HTML5 特性的设计初衷是，它们能够在性能相对较低的设备上运行，例如智能手机和平板电脑。


    ## 谁创建了 HTML5？


    回到 2004 年，一个名为 WHATWG（Web 超文本应用技术工作小组）小组开始开发这项新标准。此时，HTML4.01 仍在在使用，且自千禧年以来没有更新过。同时，W3C（世界维网联盟）正专注于
    XHTML 2.0 的开发。


    HTML5 的开发被许多人比作 Adobe Flash 技术，尽管两者有很大不同。两者都可以使用缩放矢量图形，并在网页上查看音频和视频，但 Flash 拥有的许多
    HTML5 并不直接对应对应项的功能。例如，HTML5 本身无法支持动画或交互性——它应该始终用 JavaScript 或 CSS3 进行补充。


    ## 新版 HTML 有什么新内容？


    新的 HTML5 添加了不同的语法特性。其中最突出的包括以下：


    - `<video>` -- 该元素的创建目的是流媒体视频，部分替换了另一个元素 `<object>`。创建者的意图是通过在不使用插件的情况下在网站上显示视频来成为新标准。许多人将其视为此前使用
    Adobe Flash（一种专有插件）作为标准的替代方案。然而，由于权威部门对于浏览器应该支持哪些视频格式尚未达成完全共识，该元素的使用受到了阻碍。


    - `<audio>` -- 该元素表示音频流（基本上是任何声音）。它最常见的用法是从页面播放单个音频文件，并带有一个显示播放、暂停和音量控制的控件。音频元素本身包含了不同的属性，如
    `global`、`autoplay`、`preload`、`controls`、`loop`、`media`、`muted` 和 `src`。就像视频元素一样，HTML5
    的支持者们在 fact免费格式和更广泛使用的专利格式之间挣扎。


    - `canvas` -- 系统的这部分允许对位图、2D 形状和图像进行可脚本的渲染。这种过程化模型将更新位图，而不会在场景图中具有内置的术语。


    HTML5 还具有 MathML，这是一种用于数学公式的语言。这是一种数学标记语言，采用 XML 应用，用于描述符号并捕获其内容和结构。该特性的总目标是将数学公式集成到世界维网。API
    和 DOM（文档对象模型）也是语言规范中不可或缺的一部分。


    HTML5 还具有新的页面结构元素：`<section>`、`<main>`、`<article>`、`<header>`、`<aside>`、`<footer>`、`<figure>`
    和 `<nav>`。这些旨在丰富文档的语义内容。语言规范还定义了对无效文档所需的处理，以便语法错误被所有用户和符合规范的浏览器统一处理。


    HTML5 中的某些元素也发生了变化，例如 `<cite>`、`<a>` 和 `<menu>`。还有一些必须移除或更改的元素。以下是已从 HTML5 中移除但在之前的版本存在的元素列表。


    - `<acronym>` - 更改为 `<abbr>`

    - `<applet>` - 更改为 `<object>`

    - `<basefont>` - 整合到 CSS

    - `<big>` - 整合到 CSS

    - `<center>` - 整合到 CSS

    - `<dir>` - 更改为 `<ul>`

    - `<font>` - 整合到 CSS

    - `<strike>` - 整合到 CSS

    - `<tt>` - 整合到 CSS

    - `<frame>`

    - `<frameset>`

    - `<noframes>`


    可以看出 HTML5 引入了反映典型现代网站用法的元素和属性。纯粹表现性的元素（包括 `<font>` 和 `<center>`）已被完全舍弃，因为这些早已被
    CSS 取代。如前所述，随着 JavaScript 变得越来越突出，DOM 脚本也具有了新的重要。


    尽管 HTML5 语法与 SGML（标准通用标记语言）相似，但该语言不再基于后者。然而，它的设计是为了与旧版 HTML 版本中常见的解析方式向后兼容。新的引导行
    `<!DOCTYPE html>` 看起来像 SGML 的类型声明，用于触发标准兼容的渲染模式。


    ## 浏览器支持


    所有现代浏览器都支持 HTML5。除此之外，所有浏览器（无论新旧）都可以自动处理内联元素。由于这一点，旧浏览器被“教”了处理未知元素。用户代理（浏览器）可以识别并支持以前版本的元素和属性。


    HTML5 规范区分了 Web 开发者（作者）和浏览器的要求。例如，作者不应使用 `plaintext` 和 `isindex` 元素，但用户代理将能够兼容的方式支持它们。


    ## HTML 语法


    在 HTML 中，程序员必须定义一种“语法”，简单称为“HTML 语法”。选择与现有 HTML4 和 XHTML1 最兼容的语法，尽管它无法兼容某些 SGML
    特性（如简写标记和处理指令），因为这些通常不受浏览器支持。“text/html” MIME 类型用于提供 HTML 语法的文档。


    在 HTML 中，还定义了详细的解析规则（带有错误处理），这些规则同样与 HTML4 兼容。用户代理作为浏览器必须根据给定类型依赖这些规则。同样，XML 也可以作为
    HTML 语法使用。这与 XHTML1 实现和文档兼容。


    HTML 开发者还声明字符编码。有三种不同的实现方法：


    - 可以在传输层通过使用 HTTP `content-type` Header 实现

    - 也可以在文件开头使用 Unicode BOM（字节序标记）。该字符将为编码提供签名

    - 在 `<meta>` 元素中使用 `charset` 属性，在文档的前 1024 字节期间指定编码。例如，可以通过输入 `<meta charset="UTF-8">`
    来指定 UTF-8 编码。这将取代长得多的 `<meta http-equiv="Content-Type" content=: text/html; charset=UTF-8">`，尽管后者的语法仍然被允许。


    ## Doctype


    必须指定 “DOCTYPE” 以确保浏览器以标准模式渲染页面。doctype 没有其他用途。


    '
