    \ bug 时更快地排除故障）。当输入计算机时，所有这些空格都被忽略。\n\n## CSS 继承\n\n这是 CSS 中的一个关键特性，依赖于祖先树。继承是属性不仅适用于指定元素，还适用于后代的机制。通常，后代元素从任何祖先继承属性。可继承的属性包括字体、颜色、列表样式、行高、文本转换、缩进、空白空间、字间距和可见性。不可继承的属性包括边框、显示、背景、高度、宽度、浮动和清除、外边距、最小高度、最大高度、溢出、轮廓、位置、内边距、垂直对齐、文本装饰和\
    \ z-index。\n\n继承可以防止样式表中重复声明某些属性，允许程序员编写更少的代码。\n\n下面是样式表的示例：\n\n```css\nH2 {\n\
