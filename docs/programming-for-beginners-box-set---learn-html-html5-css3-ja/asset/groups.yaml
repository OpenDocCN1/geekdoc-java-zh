    \n## 字面量\n\n现在人们完全可以说“当我看到那个关于猫的超搞笑视频时，我简直死了”，但在那时，“literally（字面上地）”这个词纯粹意味着某件事是要按原意采取。在\
    \ Java 世界中，这种含义保留了它的纯洁，因为字面量基本上是按原样获取的，而不是不同值的表示。例如：\n\n```java\nint a = 1; //\
