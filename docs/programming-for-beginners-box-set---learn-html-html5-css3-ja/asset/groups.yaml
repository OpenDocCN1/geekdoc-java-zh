    # Identifiers


    We''ve talked about literals being values taken as they are, but a lot of times,
    a descriptive name like MyFavoriteNumber is a lot better than something like:
    8.162923532. Fortunately, Java allows us to name our classes, variables, methods,
    objects, etc. Basically, identifiers provide a custom way of representing values.
    If we were to represent the number 3.14, here are some of the identifier names
    allowed by Java:


    +   - Bacon

    - asdagarsf

    - pi

    - PI

    - P_I

    - PPPPPPPPPPPPPPPPPPPPPIIIIIIIIIIIIIIIIIIIIIIII

    - _PI


    Notice how the really long identifier name is allowed. You can even make it much
    longer and see how much Java could really handle! Also, note that PI is considered
    completely different from pi because Java is case sensitive. Here are the standard
    Java rules for naming stuff:


    +   1. A variable''s name can be as long as the universe allows.

    2. Only Unicode letters and digits can be used.

    3. Variable names should always start with a letter, or a "$" or "_" character.

    4. Make your variable names clear and complete.

    5. Variable names that consist of only one word should be in lowercase whereas
    names that consist of two or more words should capitalize the first letter of
    the words that come after the first one.

    6. If you''re declaring a variable that stores a value that won''t change, usually
    using the final keyword, capitalize all letters and separate words using the "_"
    character.


