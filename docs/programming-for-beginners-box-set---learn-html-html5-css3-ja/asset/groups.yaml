    \ – it sorts arrays by values with user-defined comparison functions\n\n# Chapter\
    \ 5: Conditional Statements\n\nConditional statements are used for performing\
    \ various actions for various conditions. Oftimes, when you write a code, you\
    \ aim to perform actions for specific purposes. In PHP, you can use these conditional\
    \ statements:\n\n- Switch statement – it lets you choose a block of code to execute\n\
    - If statement – it lets you execute a code if the condition is true\n- If...\
    \ Else If... Else statement – it lets you specific a new condition for testing\
    \ if the previous condition is false\n- If... Else statement – it lets you execute\
    \ a code if the condition is true, and another one if it is false\n\n# The If\
    \ Statement\n\nAs mentioned above, the if statement lets you execute a code if\
    \ your condition is found to be true. Its syntax is:\n\n```\nif (condition)\n\
    {\n    block of code;\n}\n```\n\nTake a look at the following example:\n\n```php\n\
    <?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n    echo \"Good morning!\"\
    ;\n}\n?>\n```\n\nIf you run this code, you will get an output of:\n\nGood morning!\n\
    \nif and only if the hour or time is less than 10.\n\n# The If... Else Statement\n\
    \nYou can use the if... else statement to execute a code when the condition is\
    \ found to be true, and then another code when the condition is found to be false.\
    \ Its syntax is:\n\n```php\nif (condition)\n{\n    block of code to execute if\
    \ the condition is true;\n}\nelse{\n    block of code to execute if the condition\
    \ is false;\n}\n```\n\nConsider the following example:\n\n```php\n<?php\n$time\
    \ = date(\"Hour\");\nif ($time < \"10\")\n{\n    echo \"Good morning!\";\n}else{\n\
    \    echo \"Good afternoon!\";\n}\n?>\n```\n\nIf you run this code, you will get\
    \ an output of:\n\nGood morning!\n\nif the time is less than 10. Otherwise, you\
    \ will get an output of:\n\nGood afternoon!\n\n# The If... Else if... Else Statement\n\
    \nThis statement is used to specify new conditions to test if the first condition\
    \ is found to be false. Its syntax is:\n\n```php\nif (condition)\n{\n  block of\
    \ code to execute if the condition is true;\n} else if (condition)\n{\n  block\
    \ of code to execute if the condition is true;\n} else\n  block of code to execute\
    \ if the condition is false;\n}\n```\n\nTake a look at the following example:\n\
    \n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n  echo \"Good\
    \ Morning!\";\n} else if ($time < \"20\")\n  echo \"Good afternoon!\";\n} else\n\
    {\n  echo \"Good night!\";\n}\n?>\n```\n\nIf you run this code, you will get an\
    \ output of:\n\nGood morning!\n\nif the time is less than 10. You will get an\
    \ output of:\n\nGood afternoon!\n\nif the time is less than 20. Otherwise, you\
    \ will get an output of:\n\nGood night!\n\n# The Switch Statement\n\nIt is used\
    \ to perform actions depending on the given conditions. In PHP, there are many\
    \ switch statements. Its syntax is:\n\n```php\nswitch (expression) {\n    case\
    \ value1:\n        block of code;\n        break;\n    case value2:\n        block\
    \ of code;\n        break;\n    default:\n        block of code;\n}\n```\n\nConsider\
    \ the following example:\n\n```php\n<?php\n$color = \"red\";\nswitch ($color)\
    \ {\n    case \"red\":\n        echo \"The color is red!\";\n        break;\n\
    \    case \"blue\":\n        echo \"The color is blue!\";\n        break;\n  \
    \  default:\n        echo \"Color not found!\";\n}\n?>\n```\n\nIf you run this\
    \ code, you will get an output of:\n\nThe color is red!\n\n# The Break Statement\n\
    \nThe break statement is used to exit from a loop or a switch statement. Without\
    \ a break statement, the code will continue executing the next cases regardless\
    \ of whether the condition matches. Consider the following example:\n\n```php\n\
    <?php\n$x = 2;\nswitch ($x) {\n    case 1:\n        echo \"One\";\n        break;\n\
    \    case 2:\n        echo \"Two\";\n        break;\n}\n?>\n```\n\nIf you run\
    \ this code, you will get an output of:\n\nTwo\n\n# The Continue Statement\n\n\
    The continue statement is used to skip the current iteration of a loop and move\
    \ to the next one. Consider the following example:\n\n```php\n<?php\nfor ($i =\
    \ 0; $i < 5; $i++) {\n    if ($i == 2) {\n        continue;\n    }\n    echo $i;\n\
    }\n?>\n```\n\nIf you run this code, you will get an output of:\n\n0\n1\n3\n4\n\
    \n# The Return Statement\n\nThe return statement is used to exit from a function\
    \ and optionally return a value to the caller. Consider the following example:\n\
    \n```php\n<?php\nfunction add($a, $b) {\n    return $a + $b;\n}\necho add(5, 3);\n\
    ?>\n```\n\nIf you run this code, you will get an output of:\n\n8\n"
