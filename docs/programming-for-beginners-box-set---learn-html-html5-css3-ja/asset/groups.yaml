    # Introduction


    # PART 1: HTML5


    Chapter 1 -- What is HTML5?


    Chapter 2 -- Language Changes in HTML5


    # PART 2: CSS3


    Chapter 3 -- What is CSS3?


    # PART 3: Creating an HTML5 and CSS3 Project


    Chapter 4 -- A Blog Page


    # Conclusion


    # PART 1: HTML5


    ## Chapter 1: What is HTML5?


    Like any other core technology in the Internet, HTML is also ever-evolving. The
    primary purpose of HTML5 is to improve the language that basically runs the Web,
    adding support for the latest multimedia while keeping the language easily readable
    by humans. It also aims for a more consistent understanding by the machines that
    read it, namely the parsers, web browsers, and the like. HTML5 was created to
    be able to subsume DOM Level 2 HTML, XHTML 1, and its immediate predecessor HTML
    4.


    The new version of the language was also meant to be a response to the fact that
    both XHTML and HTML are in common use on the Web, and both contain a mixture of
    features that have been introduced by proprietary software (such as browsers themselves)
    and even common practice. HTML5 is also seen as an attempt to define either markup
    language that a programmer can write either HTML or its cousin XHTML. It can include
    processing models that will encourage more interoperable implementations, and
    also introduces markups and APIs (application programming interfaces) meant for
    more complex web apps.


    HTML5 has also been seen as a good candidate for cross-platform mobile apps. A
    lot of the HTML5 features have been built with the idea that it should be able
    to run on relatively low-powered devices, such as smartphones and tablets.


    ## Who created HTML5?


    Back in 2004, work on this new standard was started by a group known as WHATWG,
    the Web Hypertext Application Technology Working Group. By this time, HTML4.01
    was still in use and has not been updated since the turn of the millennium. At
    this time as well, the W3C (the World Wide Web Consortium) was focusing on the
    development of XHTML 2.0.


    The development of HTML5 has been likened by many to the technology of Adobe Flash,
    though the two are very different. Both of these can use scalable vector graphics
    and can view audio and video on the webpages, but there are lots of capabilities
    Flash has that do not directly have HTML5 counterparts. For one, HTML5 cannot
    support animation or interactivity on its own -- it should always be supplemented
    with JavaScript or CSS3.


    ## What’s New in the New HTML?


    The new HTML5 adds different syntactic features. Among the most prominent the
    following:


    - <video> -- This element was created for the purpose of streaming videos, partially
    replacing another element, <object>. This was intended by the creators to become
    a new standard by showing videos on sites without the use of plugins. This is
    seen by many as an alternative to the previous standard of using Adobe Flash,
    which is a proprietary plugin. The use of this element is, however, hampered since
    the authorities are not yet in complete agreement as to which video formats the
    browsers should support.


    - <audio> -- This element represents an audio stream (basically any sound). Its
    most common use is the playback of a single audio file from the page, with a widget
    showing play, pause, and volume controls. In itself, the audio element contains
    different attributes such as global, autoplay, preload, controls, loop, media,
    muted, and src. Just like in the video element, the proponents of HTML5 are torn
    between using free formats and more widely-used patented formats.


    - canvas -- This part of the system allows scriptable rendering of bitmap and
    2D shapes and images. This procedural model will update a bitmap and will not
    feature a built-in term in scene graph.


    HTML5 also features MathML, a language that is used for Math formulas. This is
    a mathematical markup language that is applied XML, meant for describing notations
    and capturing their content and structure. The general aim of this feature is
    to integrate mathematical formula into the World Wide Web. APIs and DOM (Document
    Object Model) are also integral parts of the language''s specification.


    HTML5 also has new page structuring elements: <section>, <main>, <article>, <header>,
    <aside>, <footer>, <figure>, and <nav>. These are designed to enrich the documents''
    semantic content. The language''s specification also defines the needed processing
    for invalid documents, so that the errors in syntax can be uniformly treated by
    all users and conforming browsers.


    Some elements in HTML5 have also been altered, such as <cite>, <a>, and <menu>.
    There are also those that have to be removed or changed. Here is a list of some
    elements that have been removed from HTML5 but were present in the previous incarnations.


    - <acronym> - changed to <abbr>

    - <applet> - changed to <object>

    - <basefont> - integrated to CSS

    - <big> - integrated to CSS

    - <center> - integrated to CSS

    - <dir> - changed to <ul>

    - <font> - integrated to CSS

    - <strike> - integrated to CSS

    - <tt> - integrated to CSS

    - <frame>

    - <frameset>

    - <noframes>


    HTML5 can be seen to introduce elements and attributes that are reflected in typical
    modern website usage. Purely presentational elements including <font> and <center>
    have been completely dropped, since these have been superseded a long time ago
    by CSS. DOM scripting, as mentioned before, also had a renewed importance as JavaScript
    grows more prominent.


    Despite the similarity of HTML5 syntax to SGML (Standard Generalized Markup Language),
    the language is no longer based on the latter. It has been, however, meant to
    be backward compatible with the common parsing evident in older HTML versions.
    The new introductory line (!DOCTYPE html) looks like a type declaration from SGML,
    triggering the standards-compliant rendering mode. Starting 2009, Web Forms 2.0
    is also included in HTML5 where as it was previously a separate application.


    ## Browser Support


    All modern browsers support HTML5. Aside from this, all browsers (both modern
    and old) can automatically handle the unrecognized elements as inline elements.
    Due to this, older browsers can be “taught” to handle “unknown” HTML elements.
    This is when the user agents (browsers) can recognize and support elements and
    attributes from previous HTML versions.


    The HTML5 specification separates the requirements for Web developers (authors)
    and the browsers. As an example, authors are not supposed to use the “plaintext”
    and “isindex” elements, but the user agents will have able to support them in
    such a way that will be compatible with the behavior of these elements, for Web
    content compatibility.


    ## The HTML Syntax


    In HTML, the programmer will have to define a “syntax”, which is referred to simply
    “HTML syntax”. One chooses the one most compatible with existing HTML4 and XHTML1
    on the Web, though it cannot be compatible with certain SGML features of HTML4
    (such as shorthand markup and processing instructions) as these are not usually
    supported by browsers. The “text/html” media type is used to serve the documents
    with the HTML syntax.


    In HTML, one also defines the detailed rules of parsing (with error handling),
    which are likewise compatible with HTML4. User agents as browsers will have to
    rely on these rules for resources with the given type. Likewise, XML, XML can
    also be used as an HTML syntax. This is compatible with XHTML1 implementations
    and documents. An XML media type (such as “application/xml” or “application/xhtml+xml”)
    is used to serve documents with this syntax.


    ## Character Encoding


    In HTML, Web developers also declare the character encoding. There are three different
    ways to accomplish this:


    - One can do it at the transport level, through the use of the HTTP “content-type”
    header

    - One can also use a Unicode BOM (Byte Order Mark) at the beginning of the file.
    This character will provide the signature for the encoding.

    - Using the “charset” attribute with a <meta> element, which will specify the
    encoding during the first 1024 bytes of the document. As an example, the UTF-8
    encoding can be specified by typing in “<meta charset="UTF-8">”. This will replace
    the much longer “<meta http-equiv="Content-Type" content=: text/html; charset=UTF-8">”,
    even though the later syntax is still allowed.


    ## Doctype


    A “Doctype” will have to be specified to make sure that the browser will render
    the page in the standard mode. The doctype will have no other purpose.

    '
