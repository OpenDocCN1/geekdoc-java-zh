    \ CSS in such way to give each property its own line, but this is only to aid\
    \ in the code’s human readability (also allows faster troubleshooting when there\
    \ is a bug on the code). When fed to a computer, all these spaces will be ignored.\n\
    \n## CSS Inheritance\n\nThis is a key feature in CSS, relying on ancestor tree.\
    \ Inheritance serves as the mechanism by which properties are not just to specified\
    \ element, but also to descendants. In general, the descendant elements inherit\
    \ properties from any ancestor. Inheritable properties include font, color, list-style,\
