    # Introduction


    First of all I want to thank you for downloading this book and showing interest
    in the world of web development and in particular web design. The book “HTML:
    Step by Step Beginners Guide to HTML” will provide all essential information and
    training during the book which you''ll need in order to upgrade your skills later
    with other languages and even with more sophisticated HTML.


    The reason why we start our “Learn Web Design” series with HTML is because he
    is the core to every website out there. No matter how basic or sophisticated one
    website is, the HTML is always there and is essential for its existence.


    In order to perfectly understand the material we''ll go through everything from
    the absolute beginning. We''ll do some exercises because the only way to master
    programming is by constant exercise and learning.


    All the material in this book can be learned in less than a day but exercising
    and upgrading your skills later on is essential to becoming a good programmer.


