    可以应用于所有属于类“myClass”的 div 元素。\n\n## CSS 声明块\n\n“声明块”（declaration block）是一个在大括号内由一组“声明”（declarations）组成的项。声明本身由属性、冒号以及值组成。如果一个块内有多个声明，则必须使用分号分隔每个声明。\n\
    \n属性始终在语言的标准中指定。所有属性都包含一组可能的值，以及一些影响任何元素的属性（而另一些属性仅限于特定的元素组）。\n\n值可以是关键字，包括“inherit”（继承）或“center”（居中）。也可以是数值，如“80%”或“200px”。颜色值可以使用关键字（如“green”）或其等效十六进制值指定。其他可能用于颜色的值包括\
    \ RGB 值（0 到 255 比例）、RGBA 值（同时指定颜色和透明度的值），以及 HSLA 或 HSL 值。\n\n## 优先级方案（从高到低）\n\n\
    早些，我们提到 CSS 遵循一种类似于层次结构的“级联”优先级方案。这里是 CSS 优先级方案，从高到低排列：\n\n- **重要性 (Importance)**：任何标记有“!important”注释的内容都将覆盖之前的优先级。\n\
    - **内联 (Inline)**：应用到带有“style”属性注释的 HTML 文档部分的样式。\n- **媒体类型 (Media Type)**：这是适用于所有媒体类型的属性定义，除非定义了特定于媒体的内容。\n\
    - **用户定义 (User-defined)**：这在大多数浏览器中可用，因为几乎所有现代浏览器都为终端用户提供了辅助功能（用户定义的 CSS 文档）。\n\
    - **选择器特殊性 (Selector specificity)**：这是一种特定的上下文选择器，用于覆盖通用定义。\n- **规则顺序 (Rule order)**：最后一个规则声明具有更高的优先级。\n\
    - **父级继承 (Parent inheritance)**：如果没有描述属性，则将继承父元素的属性。\n- **HTML 中的 CSS 属性定义**：CSS\
