  - '[PAGE 151]


    # Case Sensitivity


    Functions, keywords, and classes are not case sensitive in PHP.


    Consider this example:


    ```

    <?php

    echo "Testing code ";

    ECHO "Testing code ";

    EcHo "Testing code ";

    ?>

    ```


    If you run this code, you will get an output of:


    Testing code Testing code Testing code


    However, variable names are case sensitive in PHP.


    Take a look at this example:


    ```

    <?php

    $color = "blue";

    echo "The sky is is " . $color . "\n";

    echo "The sky is is " . $cOLOR . "\n";

    echo "The sky is is " . $COLOR . "\n";

    ?>

    ```


    If you run this code, you will get an output of:


    The sky is blue


    The sky is is


    The sky is is


    If you notice, the first statement is the only one that displays the value of
    the variable $color. This is because $color, $coLOR, and $COLOR are treated as
    different variables.'
