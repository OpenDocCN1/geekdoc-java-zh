- md: "\nTo start off, some basic rules regarding typography, background color, and\
    \ such will have to be defined. Let's take a look at the CSS code below -- you\
    \ might recognize these from CSS2.1.\n\n```css\n/* Example CSS Reset */\n{\n \
    \ Margin: 0;\n  Padding: 0;\n}\n\n/* This code tells the browser to render the\
    \ HTML5 replacements as block */\nHeader, footer, aside, nav, article {\n  Display:\
    \ block;\n}\n\nBody {\n  Margin: 0 auto;\n  Width: 250px;\n  Font: 12px/24px verdana,\
    \ Arial;\n  Background: #000000\n}\n\nH2 {\n  Font-size: 16px;\n  Line-height:\
    \ 40px;\n  Padding: 20px 0;\n}\n```\n\n```css\nP {\n  Padding-bottom: 22px;\n\
    }\n```\n\nAt the beginning, the padding and margin-styles will be reset through\
    \ a basic rule. In the production environment, a programmer can use a more detailed\
    \ reset, but this is a simplified one for illustrative purposes.\n\nThe next part\
    \ tells the user agent to render the new HTML5 elements as a block. While browsers\
    \ are okay with elements that they don't recognize (making HTML5 considered backwards\
    \ compatible), they will not know how these will be rendered in the default manner.\
    \ That is why we need to instruct them how to do it until CSS3 standards are universal.\n\
    \n# Styling Introductions\n\nThe markup we did for our introduction is quite simple,\
    \ but we can make it more appealing with some use of CSS3. Check out the following\
    \ code:\n\n```css\n#intro {\n  Margin-top: 64px;\n  Padding: 40px;\n  Background:\
    \ #467612 url(\"background_for_intro.png\") repeat-x;\n  Background-size: 100%;\n\
    \  Border-radius: 22px;\n}\n```\n\nAs you may have noticed, a couple of new properties\
    \ are used: the background-size (that allows the programmer to scale the image\
    \ in the background) and the border-radius, that applies rounded corners to our\
    \ element. For the latter, individual corners may have different values. As well,\
    \ the programmer can choose to round out only specific corners.\n\n# Styling the\
    \ Content Area\n\nStyling the content area is very easy with CSS3. There will\
    \ be no more need for floating, faux column images for the background as well\
