  \n# 前言\n\nJava 是一种已经存在数十年的编程语言，它证明了自己作为多功能编程语言的潜力。多年来，Java 取得了巨大的进步，已成为从独立应用到移动应用等范围开发的首选编程语言之一。它不再是一个简单的客户端语言，而是更加动态，并支持应用程序服务器、嵌入式设备等的开发。本书是多年应用程序开发以及在使用\
  \ Java 每个新版本引入的功能时获得经验的。本书的目标是为初提供足够的知识来开始应用程序开发。在本书的 14 章中，你将学习以下内容：\n\n# 第 1 章：Java\
  \ 简介\n介绍面向对象编程的概念并解释 Java 如何演变为面向对象编程（OOP）语言。解释 Java 的版本和特性，以及使用 `JDK 8` 和 `JDK\
  \ 10` 创建应用程序的步骤。\n\n# 第 2 章：Java 编程结构\n讨论 Java 语言的各种编程结构，如注释、变量、数据类型和操作符。然后向你展示决策结构、循环结构和分支语句的使用。\n\
  \n# 第 3 章：Java 应用程序组件\n介绍 Java 类、对象、变量、方法、访问修饰符和构造函数。解释多态的实现、包的创建以及 `static`、`final`\
  \ 和 `this` 等关键字的使用。\n\n# 第 4 章：Java 引用类型\n讨论不同类型的 `Arrays` 和 `String` 类。然后向你展示 `StringBuilder`\
  \ 和 `StringTokenizer` 类、命令行参数和包装类的使用。\n\n# 第 5 章：子类与接口\n深入讨论 Java 中的继承概念，以及使用抽象类、嵌套类等实现继承的不同方式。然后解释接口和\
  \ Lambda 表达式。\n\n# 第 6 章：异常与正则表达式\n描述使用内置异常类和自定义异常进行异常处理。进一步进一步介绍了 `java.lang` 和\
  \ `java.util.regex` 包中的重要类。\n\n# 第 7 章：集合与流 API\n介绍更高级的特性，如带有 `java.util` 包中不同工具类和接口的\
  \ `Collections` 框架。\n\n# 第 8 章：泛型与时间 API\n描述在 Java 中使用泛型来创建泛型类、方法和集合。还介绍了为日期和时间提供更好支持的\
  \ `Time API`。\n\n# 第 9 章：Java 中的文件操作\n描述 `java.io` 包中用于文件管理的不同类型的流。此外，介绍了 `java.util.zip`\
  \ 和 `java.nio` 包中的不同类。\n\n# 第 10 章：线程与 JDBC\n解释线程的创建和多线程以提高应用程序的性能。然后描述如何使用 `JDBC`\
  \ API 连接到数据库。\n\n\n\n\n本书的代码包也托管在 GitHub，地址为 [`github.com/bpbpublications/100Plus-Solutions-in-Java-2nd-Edition`](https://github.com/bpbpublications/100Plus-Solutions-in-Java-2nd-Edition)。如果代码有更新，它将在现有的\
  \ GitHub 仓库中进行更新。\n\n我们在丰富的书籍和视频目录中提供了许多代码包，地址为 [`github.com/bpbpublications`](https://github.com/bpbpublications)。欢迎大家去看看！\n\
