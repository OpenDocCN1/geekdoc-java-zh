  2\", new Toy(1002, \"Teddy Bear\", \"White\", 40.3f));\n        toys.put(\"5\",\
  \ new Toy(1005, \"Bus\", \"Red\", 30.6f));\n        System.out.println(toys);\n\
  \        toys.remove(\"3\");\n        toys.put(\"4\", new Toy(1004, \"Rattles\"\
  , \"Multi-color\", 10.5f));\n        System.out.println(\"Toy at key 4: \"+toys.get(\"\
  4\"));\n        Object firstKey = toys.firstKey();\n        System.out.println(\"\
  First key: \"+firstKey.toString());\n        System.out.println(\"Last key: \"+(String)\
  \ (toys.lastKey()));\n        System.out.println(\"Modified Tree Map: \\n\"+toys);\n\
  \    }\n}\n```\n\n在这里，创建了一个 `TreeMap` 对象并向其添加数据。使用其方法来操作数据。代码输出所示：\n\n![](img/Figure_7.18.jpg)\n\
  \n图 7.18: TreeMap 类方法\n\n## 7.7.5 ConcurrentSkipListMap\n\n`ConcurrentSkipListMap`\
  \ 类实现了 `ConcurrentNavigableMap` 接口。它属于 `java.util.concurrent` 包。它允许在不锁定整个 map 的情况下进行修改。\n\
  \n`ConcurrentSkipListMap` 构造函数为：\n\n*   `ConcurrentSkipListMap()`: 创建一个新的空的 `Map`，元素根据键的自然顺序排序。\n\
  \n`ConcurrentSkipListMap` 类的方法为：\n\n*   `firstEntry()`: 返回 map 中最低键的数据。\n*   `lastEntry()`:\
  \ 返回 map 中最高键的数据。\n*   `ceilingEntry(K key)`: 返回大于或等于指定键的最近值，如果没有，则返回 null。\n* \
  \  `put(K key, V value)`: 在 map 中添加指定的键值值。\n*   `descendingMap()`: 返回 map 中元素的反序视图。\n\
  \n以下示例展示了 `ConcurrentSkipListMap` 的：\n\n```java\nimport java.util.concurrent.ConcurrentSkipListMap;\n\
  \npublic class CSLM {\n    public static void main(String args[]) {\n        ConcurrentSkipListMap<Integer,\
  \ String> colors = new ConcurrentSkipListMap<>();\n        colors.put(1, \"Red\"\
  );\n        colors.put(2, \"Green\");\n        colors.put(5, \"White\");\n     \
  \   colors.put(4, \"Yellow\");\n        System.out.println(\"Descending map: \"\
  \ + colors.descendingMap());\n        System.out.println(\"First entry: \" + colors.firstEntry());\n\
  \        System.out.println(\"Last entry: \" + colors.lastEntry());\n        System.out.println(\"\
  Ceiling entry for 3: \" + colors.ceilingEntry(3));\n    }\n}\n```\n\n在这里，创建了一个包含一些条目的\
  \ `ConcurrentSkipListMap` 对象。使用 `ConcurrentSkipListMap` 的方法来操作数据并显示修改后的 `Map`。代码输出所示：\n\
  \n![](img/Figure_7.19.jpg)\n\n---\n\n## 7.8 Arrays 类\n\n`java.util.Arrays` 类提供了对数组的操作方法，如排序、搜索等。常用的\
  \ `Arrays` 方法有：\n\n*   `equals(<type> arrObj1, <type> arrObj2)`: 比较两个数组的相等性。如果元素数量相同且每个元素都相同，则返回\
  \ true。\n*   `sort(<type>[] array)`: 按升序排序数组。\n*   `sort(<type>[] array, int startIndex,\
  \ int endIndex)`: 排序索引之间的数组元素。\n*   `fill(<type>[] array, <type> value)`:通过为所有元素指定值来初始化数组。\n\
  *   `fill(type[] array, int fromIndex, int toIndex, type value)`: 初始化索引之间的数组元素。\n\
  *   `copyOf(int[] original, int newLength)`: 复制指定的数组和长度。如果提供的长度较小则截断数组，如果较大则填充。\n\
  *   `copyOfRange(int[] original, int from, int to)`: 将指定数组的范围复制到新数组中。范围的初始索引 (`from`)\
  \ 必须位于零到 `original.length` 之间。\n*   `asList(T… a)`: 接收数组作为参数并创建一个实现 `List` 的包装器，将原始数组转换为列表。\n\
  *   `toString(<type>[] array)`: 返回数组内容的字符串表示。\n\n以下示例展示了 `Arrays` 的用法：\n\n```java\n\
  import java.util.Arrays;\nimport java.util.List;\n\npublic class ArraysDemo {\n\
  \    public static void main(String[] args) {\n        int nums[] = {5, 7, 2, 9,\
  \ 4, 8, 6, 5, 1};\n        // 检查数组的相等性\n        System.out.println(\"Arrays are\
  \ equal? \"+ Arrays.equals(nums, nums));\n\n        // 按升序排序特定范围的\n        //数组\n\
  \        Arrays.sort(nums, 0, 3);\n        System.out.println(\"Sorted array in\
  \ range of 0-3: \" + Arrays.toString(nums));\n\n        // 按升序排序\n        // 完整数组\n\
  \        Arrays.sort(nums);\n        System.out.println(\"Completely sorted array:\
  \ \" + Arrays.toString(nums));\n    }\n}\n```\n\n\n\n\n```java\n+ Arrays.toString(nums));\n\
  \n// 复制整个数组\nint[] copyNums = Arrays.copyOf(nums, nums.length);\n\nSystem.out.println(\"\
  Copied array: \" + Arrays.toString(copyNums));\n\n// 复制数组的指定范围\nint[] rCopyNums\
  \ = Arrays.copyOfRange(nums, 1, 4);\n\nSystem.out.println(\"Copied subarray: \"\
  \ + Arrays.toString(rCopyNums));\n\n// 用特定值填充某个范围\nArrays.fill(nums, 0, 4, 0);\n\
  System.out.println(\"Array filled with 0 from 0 to 4: \" + Arrays.toString(nums));\n\
  \n// 用特定值填充整个数组\nArrays.fill(nums, 31);\nSystem.out.println(\"Array completely filled\
  \ with 31: \" + Arrays.toString(nums));\n\n// 以字符串形式形式打印数组\nSystem.out.println(\"\
  String form of array: \" + Arrays.toString(nums));\n\nInteger nums2[] = {5, 7, 2,\
  \ 9, 4, 8, 6, 5,1};\n// 为 nums2[] 创建一个包装列表\nList<Integer> l1 = Arrays.asList(nums2);\n\
  System.out.println(\"Array as List: \" + l1);\n}\n\n}\n```\n\n在这里，通过使用不同的 `Arrays`\
  \ 类方法来创建和操作 `int` 数组。代码的输出所示：\n\n![](img/Figure_7.20.png)\n\n图 7.20：`Arrays` 类方法\n\
  \n## 7.9 集合排序\n\n可以通过使用两个接口 `Comparable` 和 `Comparator` 来对集合进行排序。\n\n#### Comparable\n\
  \n该接口属于 `java.lang` 包，用于对用户定义类的对象进行排序。它仅有一个名为 `compareTo(Object)` 的方法，并且仅支持单一排序序列。这意味着，元素只能根据单个数据成员进行排序。例如，根据\
  \ `id`、`name` 等进行排序。实现此接口的对象的列表可以通过 `Collection.sort` 或 `Arrays.sort` 方法进行自动排序。\n\
  \n例如，对于类 `C` 的每一个 `e1` 和 `e2`，`e1.compareTo(e2) == 0` 的布尔结果与 `e1.equals(e2)` 相同。这意味着自然排序与\
  \ `equals` 致的。在这里，`null` 不被任何类的实例。因此，即使 `e.equals(null)` 返回 `false`，`e.compareTo(null)`\
  \ 也会抛出 `NullPointerException`。\n\n| 注意：建议元素的自然排序应该与 `equals` 保持一致。这是因为，在没有显式比较器的情况下，使用自然排序与\
  \ `equals` 不一致的元素/键进行排序的集合和映射，会导致异常行为。 |\n\n下面的示例展示了 `Comparator` 接口的使用：\n\n```java\n\
  public class Student implements Comparable<Student> {\n    int id;\n    String name;\n\
  \    int age;\n    Student(int id, String name, int age) {\n        this.id = id;\n\
  \        this.name = name;\n        this.age = age;\n    }\n\n    @Override\n  \
  \  public int compareTo(Student s) {\n        if (age == s.age) {\n            return\
  \ 0;\n        } else if (age > s.age) {\n            return 1;\n        } else {\n\
  \            return -1;\n        }\n    }\n}\n\nimport java.util.Collections;\n\
  import java.util.ArrayList;\n\npublic class ComparableSort {\n    public static\
  \ void main(String args[]) {\n        ArrayList<Student> st = new ArrayList<>();\n\
  \        st.add(new Student(1, \"John\", 23));\n        st.add(new Student(8, \"\
  Mary\", 27));\n        st.add(new Student(3, \"Roger\", 21));\n        Collections.sort(st);\n\
  \        for (Student s : st) {\n            System.out.println(s.id + \" \" + s.name\
  \ + \" \" + s.age);\n        }\n    }\n}\n```\n\n在这里，创建了一个类型 `Student`，它实现了 `Comparable`\
  \ 接口并重写了 `compareTo()` 方法以根据 `age` 的值进行排序。创建了 `Student` 类型的 `ArrayList` 并使用 `Collections.sort()`\
  \ 方法进行排序。代码的输出所示：\n\n![](img/Figure_7.21.jpg)\n\n图 7.21：使用 `Comparable` 排序\n\n注意列表是根据\
  \ `age` 属性的值进行排序的。\n\n#### Comparator\n\n该接口属于 `java.util` 包，用于对用户定义类的对象进行排序。它提供了两个方法：`compare(Object\
  \ obj1, Object obj2)` 和 `equals(Object element)`。它允许多个排序序列，即根据任何数据成员如 `ID`、`name`\
  \ 等进行排序。\n\n下面的示例展示了 `Comparator` 接口的使用：\n\n```java\npublic class Students {\n \
  \   int id;\n    String name;\n    int age;\n    Students(int id, String name, int\
  \ age) {\n        this.id = id;\n        this.name = name;\n        this.age = age;\n\
  \    }\n}\n```\n\n创建了一个 `Students` 类，带有一个构造函数来初始化其属性：\n\n```java\nimport java.util.Comparator;\n\
  ```\n\n*(注：此处原文文本似乎不完整，已根据提供的内容翻译可见部分)*\n\n\n\n\n\n```java\nList<Order> orders =\
  \ new ArrayList<>();\n\nOrder orderP1 = new Order(\"P001\", 40, 80.50, Order.Type.PREMIUM);\n\
  Order orderN1 = new Order(\"N001\", 75, 30.30, Order.Type.NORMAL);\nOrder orderP2\
  \ = new Order(\"P002\", 50, 95, Order.Type.PREMIUM);\nOrder orderN2 = new Order(\"\
  N002\", 22, 55, Order.Type.NORMAL);\nOrder orderP3 = new Order(\"P003\", 30, 70,\
  \ Order.Type.PREMIUM);\n\norders.add(orderP1);\norders.add(orderN1);\norders.add(orderP2);\n\
  orders.add(orderN2);\norders.add(orderP3);\n\n// 按订单类型过滤 ArrayList\n// 使用 Stream\
  \ 类的 filter() 方法\nStream<Order> stream = orders.stream();\nStream premium = stream.filter((Order\
