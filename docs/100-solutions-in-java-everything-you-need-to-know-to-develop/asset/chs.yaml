  \n# 第 12 章 关于 JDK 8, 9 和 10 的更多\n\n## 介绍\n\n本章解释了 Java 8 到 10 的更多特性。它解释了 Java 8\
  \ 中引入的 `forEach()` 方法、`StringJoiner` 和并行数组排序。此外，它还解释了 Java 9 中引入的 Java 平台模块系统 (JPMS)、交互式\
  \ Java REPL `JShell` 以及 `JLink` 工具。最后，它向你介绍了 Java 10 中的局部变量类型推断和 API 变化。\n\n## 结构\n\
  \n* Java 8 的特性\n* Java 9 的特性\n* Java 10 的特性\n\n## 目标\n\n在本章中，你将学习 Java 8、9 和 10\
  \ 的特性，以创建简单高效的代码。你还将学习 Java 10 中的局部变量类型推断和 API 变化。\n\n## 12.1 Java 8 的特性\n\n之前，我们已经了\
  \ Java 8 的一些重要特性，如函数接口、lambda 表达式和默认方法。Java 8 的更多特性如下：\n\n##### `forEach()` 方法\n\
  \nJava 8 引入了 `forEach()` 方法用于 `Iterable` 接口，以便对集合中的元素。\n\n语法：\n\n```\ndefault void\
  \ forEach(Consumer<? super T> action)\n```\n\n该方法接受一个 `Consumer` 类型的参数，因此 lambda\
  \ 表达式可以传递参数。下面的示例显示了 `forEach()` 的使用：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.List;\n\npublic class forEach {\n    public static void main(String[]\
  \ args) {\n        List<String> lstColors = new ArrayList<>();\n        lstColors.add(\"\
  Red\");\n        lstColors.add(\"Green\");\n        lstColors.add(\"Blue\");\n \
  \       // 使用传统的 for 循环\n        for (String obj : lstColors) {\n            System.out.println(obj);\n\
  \        }\n        // 使用 lambda 表达式\n        lstColors.forEach(obj -> System.out.println(obj));\n\
  \        // 使用方法引用\n        lstColors.forEach(System.out::println);\n    }\n}\n\
  ```\n\n`forEachOrdered()` 方法\n\n图 11.13 显示了上述代码的输出：\n\n![](img/Figure_11.13.jpg)\n\
  \n图 11.13: 输出\n\n##### `StringJoiner` 类\n\n`StringJoiner` 类在 Java 8 中引入，用于根据分隔符连接字符串。它允许在构造函数中指定前缀和后缀。\n\
  \n```java\nimport java.util.StringJoiner;\n\npublic class StringJoinerDemo {\n \
  \   public static void main(String[] args) {\n        StringJoiner joinNames = new\
  \ StringJoiner(\",\"); // 使用逗号作为分隔符\n        // 向 StringJoiner 添加值\n        joinNames.add(\"\
  Roger\");\n        joinNames.add(\"Victor\");\n        joinNames.add(\"Mary\");\n\
  \        joinNames.add(\"Clara\");\n        System.out.println(joinNames);\n   \
  \ }\n}\n```\n\n上述代码的输出为：\n\nRoger,Victor,Mary,Clara\n\n##### `StringJoiner` 与 `StringBuilder`\n\
  \n使用 `StringBuilder`，你需要从末尾移除分隔符。然而，使用 `StringJoiner`，分隔符会自动添加。在连接字符串时非常有用。\n\n\
  ```java\nimport java.util.StringJoiner;\n\npublic class StringJvsStringB {\n   \
  \ public static void main(String[] args) {\n        String[] str = {\"John\",\"\
  Roger\",\"Clark\"};\n        // 初始化 StringJoiner 实例\n        // 指定的分隔符、前缀和后缀\n \
  \       StringJoiner sj = new StringJoiner(\":\", \"[\", \"]\");\n        // 连接字符串\n\
  \        sj.add(\"John\").add(\"Roger\").add(\"Cloud\");\n        // 将 StringJoiner\
  \ 转换为 String\n        String joinedString = sj.toString();\n        System.out.println(\"\
  Joined Strings with StringJoiner:\"+joinedString);\n\n        // 使用 StringBuilder\
  \ 类\n        // 创建 StringBuilder 对象\n        StringBuilder sb = new StringBuilder();\n\
  \        // 添加前缀\n        sb.append(\"[\");\n        // 检查字符串数组是否为空\n        if(str.length\
  \ > 0) {\n            // 添加第一个元素\n            sb.append(str[0]);\n            //\
  \ 遍历字符串数组\n            // 在每个字符串之前添加必要的分隔符\n            for (int i = 1; i < str.length;\
  \ i++) {\n                sb.append(\":\").append(str[i]);\n            }\n    \
  \    }\n        // 添加后缀\n        sb.append(\"]\");\n        // 将 StringBuilder 转换为\
  \ String\n        String finalStr = sb.toString();\n    }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(\"Joined strings with StringBuilder: \"+finalStr);\n\n}\n\n```\n\
  \n使用 `StringJoiner` 时，分隔符、前缀和后缀是在构造函数中指定的。然而，如果先使用 `StringBuilder`，会先前缀，然后遍历字符串数组并在每个元素之前添加分隔符。最后，添加后缀。\n\
  \n下面的图 12.2 将是上述代码的输出：\n\n![](img/Figure_12.2.jpg)\n\n图 12.2：StringJoiner 与 StringBuilder\
  \ 的对比\n\n## 并行数组排序\n\n这一新功能在 `Arrays` 类中引入，用于并行排序数组元素。它是通过使用名为 `parallelSort()`\
  \ 的新方法实现的，该方法已对所有基本类型和 `Comparable` 对象进行了重载。该方法使用 JSR 166 Fork/join 公共线程池来执行并行任务。下面的图\
  \ 12.3 显示了不同的 `parallelSort()` 方法：\n\n![](img/Figure_12.3.jpg)\n\n图 12.3：重载的 parallelSort()\
  \ 方法\n\n用于并行排序的算法是并行合并排序（parallel sort-merge），它将数组拆分为子数组，然后对这些子数组进行排序并合并。下面的示例展示了\
  \ `parallelSort()` 方法的使用：\n\n```java\nimport java.util.Arrays;\n\npublic class ParallelSortDemo\
  \ {\n\n    public static void main(String[] args) {\n        // 创建整数数组\n       \
  \ int[] arr = {2,7,5,8,1,0,6,9};\n\n        // 遍历数组元素\n        for (int i : arr)\
  \ {\n            System.out.print(i+\" \");\n        }\n\n        System.out.println(\"\
  \");\n\n        // 对数组元素进行并行排序\n        Arrays.parallelSort(arr);\n        System.out.println(\"\
  \\nUsing Arrays.parallelSort() 排序\");\n\n        // 遍历并打印数组元素\n        for (int\
  \ i : arr) {\n            System.out.print(i+\" \");\n        }\n    }\n}\n```\n\
  \n`parallelSort()` 方法提高了了代码的性能。下面的图 12.4 将是上述代码的输出：\n\n![](img/Figure_12.4.jpg)\n\
  \n图 12.4：并行数组排序\n\nJava 8 中还添加了其他特性，将在下节中进行解释。\n\n## 12.2 Java 9 特性\n\nJava 9 是一个重大发布，为开发者引入了许多特性。下面列出了添加到\
  \ Java 9 的一些重要新特性。\n\n### Java 平台模块系统\n\nJava 平台模块系统（JPMS）在 Java 9 中引入了一种新的编码范式，用于创建名为模块（modules）的可重用组件。它允许开发对其他模块有明确依赖关系的组件。它允许将类型和包分组到模块中，并包含必要的信息，如模块名称、依赖关系、输出、导出等。\n\
  \n#### 什么是模块？\n\n模块是相关的包、类型（如类、接口、抽象类）的集合，并包含代码以及数据和资源。它是一个自描述的资源集合，支持单一职责原则（SRP）。\n\
  \n在 Java 9 中，JDK 包和 Java SE 规范由 Oracle 公司分为两组模块：\n\n*   以 `jdk.*` 开头的 JDK 模块\n*\
  \   以 `java.*` 开头的 Java SE 模块\n\n创建名为 `java.base` 的独立基础模块，所有 JDK 模块和用户定义模块默认依赖于它。因此，它被称为“Java\
  \ 9 模块之母”。Java 9 通过创建名为模块的组件引入了模块化代码的概念。这些模块包含相关的包和类型。此外，模块包含一个名为模块描述符文件的新组件，即 `module-info.java`。其余应用程序与\
  \ Java 8 或更早版本相同。\n\n下面列出了 Java 9 模块的组件：\n\n*   一个具有名称的模块\n*   一个模块描述符\n*   一组包\n\
  *   一组类型和资源\n\n下面列出了关于 Java 9 模块的一些要点：\n\n*   模块名称必须是唯一的，且必须有一个模块描述符。\n*   模块描述符按照约定名为\
  \ `module-info.java` 的普通 `.java` 文件。\n*   模块描述符文件必须放在模块的顶层或根目录中。\n*   模块中可以有多个包和类型。但你不能在另一个模块内部创建模块。\n\
  *   JDK 9 EA 早期访问（EA）有 95 个模块。\n*   可以创建用户定义模块，且一个模块可以依赖于多个模块。\n\n与包名一样，反向域名模式也可以应用于模块名称。例如，如果你正在为\
  \ `www.abc.com` 开发模块，那么模块名称可以是 `com.abc.mod1`。\n\n#### Java 9 模块描述符\n\n模块描述符是一个普通的\
  \ `.java` 文件，其中包含模块元数据，即模块的描述。它还通过 `javac` 命令编译为 `module-info.class` 文件。\n\n语法：\n\
  \n```java\nmodule <module-name> {\n    // 模块元数据\n}\n```\n\n例如：`com.abc.mod1` 模块的\
  \ `module-info.java` 文件内容。\n\n```java\nmodule com.abc.mod1 {\n    // 元数据\n}\n```\n\
  \n#### 模块元数据\n\n模块元数据存在于模块描述文件中。它包含以下细节：\n\n*   **exports 句（导出句）**：该句用于指示模块向其他模块导出包。\n\
  \    例如：\n    ```java\n    module com.abc.mod1 {\n        exports pkg1;\n    }\n\
  \    ```\n*   **requires 句（需要句）**：该句指示模块从其他模块导入包。\n    例如：\n    ```java\n    module\
  \ com.abc.mod2 {\n        requires pkg1;\n        exports pkg2;\n    }\n    ```\n\
  \    模块 `com.abc.mod2` 导入 `com.abc.mod1` 导出的 `pkg1`。它也导出 `pkg2`。\n\n| 注意：模块描述符可以有零或多个\
  \ exports 句和 requires 句。 |\n\n早期版本中，在 IDE 中创建项目时，许多 JAR 被添加到 `CLASSPATH`。在 Java\
  \ 9 中，在 IDE 中创建项目时，许多模块被添加到 `MODULEPATH`。Java 支持 `MODULEPATH` 和 `CLASSPATH`。`CLASSPATH`\
  \ 是 JVM 或 Java 编译器编译和执行应用程序所需的内置或用户定义的类和包的位置。`MODULEPATH` 是文件夹格式提供的模块位置，即解压缩模块格式也称为模块化\
  \ JAR。\n\n### 可读性与访问性\n\n当一个模块 `Mod2` 依赖于另一个模块 `Mod1` 时，称 `Mod2` 读取 `Mod1`，或 `Mod1`\
  \ 可被 `Mod2` 读取。这种关系被称为模块间的可读性（Readability）。当 `Mod2` 与 `Mod1` 存在可读关系时，意味着 `Mod2`\
  \ 可以访问 `Mod1` 的公共 API。这被称为模块间的访问性（Accessibility）。\n\n| 注意：模块可以只有公共 API，也可以同时具有公共和私有\
  \ API。 |\n\n可读性和访问性的主要目的是实现可靠的配置和强封装。可以使用 `exports` 句、`requires` 句、`public` 修饰符和\
  \ `to` 句来实现模块之间的可读性和访问关系。\n\n#### 隐式可读性\n\n如果 `Mod2` 读取 `Mod1`  `Mod3` 读取 `Mod2`，那么\
  \ `Mod3` 也读取 `Mod1`。这种传递依赖关系被称为从 `Mod1` 到 `Mod3` 的隐式可读性。它被称为隐式依赖。模块依赖可以通过两种方式解决，如下面的图\
  \ 12.5 所示，即直接可读性或隐式可读性：\n\n![](img/Figure_12.5.jpg)\n\n图 12.5：隐式可读性\n\n下面的表 12.1\
  \ 中的代码演示了三个模块用于直接可读性和隐式可读性的 `module-info.java` 文件的结构：\n\n| 直接可读性 | 隐式可读性 |\n| :---\
  \ | :--- |\n| `module Mod1{exports pkg1;} module Mod2{requires Mod1;exports pkg2;}\
  \ module Mod3{requires Mod1;requires Mod2;exports pkg3;}` | `module Mod1{exports\
  \ pkg1;} module Mod2{requires public Mod1;exports pkg2;} module Mod3{requires Mod2;exports\
  \ pkg3;}` |\n\n\n\n\n\n# 表 12.1：`module-info.java` 文件的结构\n\n在第一情况下，模块之间的传递依赖在不使用隐式可读性的情况下解决。这意味着\
  \ `Mod3` 需要通过 `requires` 子句同时导入 `Mod1` 和 `Mod2`。然而，由于 `Mod2` 已经导入了 `Mod1`，这是没有必要的。因此，当\
  \ `Mod3` 导入 `Mod2` 时，如果它也能隐式地导入 `Mod1` 就完美。\n\n在第二情况下，模块之间的传递依赖通过使用隐式可读性来解决。因此，`Mod3`\
  \ 通过 `requires` 子句仅导入 `Mod2`，由于 `Mod2` 在导入 `Mod1` 时使用了 `public` 修饰符`Mod1` 被隐式导入。\n\
