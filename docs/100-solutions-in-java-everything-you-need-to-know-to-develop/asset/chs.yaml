  ## 2.6 常量与枚举 (Constants and enumerations)\n\nJava 常量是指一旦赋值其值就不能改变的变量。常量通过`final`关键字声明。\n\
  \n#### 语法：\n\n```java\nfinal <variable-name> = <value>;\n```\n\n#### 示例：\n\n```java\n\
  final int discount = 10;\n```\n\n在这里，变量`discount`的值被固定为`10`。由于该变量由`final`关键字指示为常量，因此稍不能被修改。\n\
  \n| 注意：当`final`关键字应用于方法时，这些方法无法被重写；如果应用于类，则该类不能被扩展。 |\n\n枚举是一种包含一组常量值集合的类类型。它也可以包含实例变量和构造函数。使用`enum`关键字定义。\n\
  \n#### 语法：\n\n```java\nenum <enum-name> {\n    constant1, constant2, . . . , constantN\n\
  }\n```\n\n与使用`new`运算符实例化的类不同，枚举是通过创建类型为`enum`的变量使用的，类似于基本数据类型。枚举通常用于`switch-case`等决策性结构。\n\
  \n#### 示例：\n\n```java\npublic class EnumDays {\n    // 定义星期几的枚举\n    enum Days {\n\
  \        Sun, Mon, Tue, Wed, Thu, Fri, Sat\n    }\n\n    public static void main(String[]\
  \ args) {\n        // 创建一个 Days 类型的变量\n        Days day = Days.Mon;\n        System.out.println(\"\
  Today is \" + day);\n    }\n}\n```\n\n## 2.7 Java 中的运算符 (Operators in Java)\n\n\
  Java 提供了用于对变量进行操作的运算符。\n\n#### 赋值 (Assignment)\n\n赋值运算符 `=` 用于将右侧的值赋给左侧。Java 支持复合赋值来赋值表达式的结果。例如：\n\
  \n```java\nint a = 10;\na += 6;\n```\n\n#### 算术 (Arithmetic)\n\n算术运算符对数值数据操作。它们也可以用于字符数据。这些是二进制运算符，意味着它们操作两个操作数。\n\
  \n下面是 Java 中的算术运算符：\n\n*   `+`: 加法\n*   `-`: 减法\n*   `*`: 乘法\n*   `/`: 除法\n*   `%`:\
  \ 取模\n\n以下示例显示了赋值和算术运算符的使用：\n\n```java\npublic class OperatorsDemo {\n    public\
  \ static void main(String[] args) {\n        int add, sub, mul, div, mod;\n    \
  \    add = 3 + 5;\n        sub = 6 - 4;\n        mul = 2 * 2;\n        div = 6 /\
  \ 3;\n        mod = 4 % 2;\n        System.out.println(\"Addition is \" + add);\n\
  \        System.out.println(\"Subtraction is \" + sub);\n        System.out.println(\"\
  Multiplication is \" + mul);\n        System.out.println(\"Division is \" + div);\n\
  \        System.out.println(\"Modulo is \" + mod);\n    }\n}\n```\n\n代码的输出所示：\n\n\
  ![](img/Figure_2.4.jpg)\n\n图 2.4: 使用算术运算符\n\n注意取模操作返回 0，因为 4 可以被 2 整除。\n\n#### 一元\
  \ (Unary)\n\n一元运算符对单个操作数操作。Java 支持不同类型的一元运算符，如下：\n\n*   `+`: 表示正值\n*   `-`: 取表达式负\n\
  *   `++`: 变量值加 1\n*   `--`: 变量值减 1\n*   `!`: 反转布尔值\n\n使用递增减运算符有两种方式，即前缀或后缀表示法。两者都会变量值加\
  \ 1。然而，前缀版本会先增加值再赋值，而后缀版本会先赋值再增加值。\n\n以下代码显示了一元运算符的使用：\n\n```java\npublic class\
  \ OperatorsDemo {\n    public static void main(String[] args) {\n        int x =\
  \ 3;\n        int y = x++;\n        int z = ++x;\n        x = -x;\n        boolean\
  \ answer = false;\n        answer = !answer;\n        System.out.println(\"Value\
  \ of y after postfix increment of x is \" + y);\n        System.out.println(\"Value\
  \ of z after prefix increment of x is \" + z);\n        System.out.println(\"Value\
  \ of x after negation is \" + x);\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  Logical complement of answer is \"+ answer);\n\n}\n\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_2.5.jpg)\n\
  \n图 2.5: 使用一元运算符\n\n### 条件/关系运算符\n\n条件运算符作用于两个操作数，以测试它们之间的关系。条件运算符的结果将为 `true` 或\
  \ `false`。以下列出了 Java 支持的条件运算符：\n\n- 等于 (`==`): 如果两个值相等，则返回 `true`，否则返回 `false`。\n\
  - 不等于 (`!`): 如果两个值相等，则返回 `true`，否则返回 `false`。（注：原文此处描述有误，通常 `!=` 才是不等于逻辑）\n- 大于\
  \ (`>`): 如果左侧的值大于右侧的值，则返回 `true`，否则返回 `false`。\n- 小于 (`<`): 如果左侧的值小于右侧的值，则返回 `true`，否则返回\
  \ `false`。\n- 大于等于 (`>=`): 如果左侧的值大于或等于右侧的值，则返回 `true`，否则返回 `false`。\n- 小于等于 (`<=`):\
  \ 如果左侧的值小于或等于右侧的值，则返回 `true`，否则返回 `false`。\n\n### 逻辑运算符\n\n逻辑运算符作用于两个布尔表达式。Java\
  \ 支持的逻辑运算符有：\n\n- 逻辑与 (`&&`): 如果两个布尔表达式都为 `true`，则返回 `true`，否则返回 `false`。\n- 逻辑或\
  \ (`||`): 如果两个操作操作为 `true`，则返回 `true`，否则返回 `false`。\n\n#### 短路行为\n\n逻辑运算符 `&&` 只有在第一个表达式为\
  \ `true` 时才会测试第二个表达式。如果第一个表达式为 `false`，它将不会检查第二个表达式。同样，逻辑运算符 `||` 只有在第一个表达式为 `false`\
  \ 时才会测试第二个表达式。如果第一个表达式为 `true`，它将不会检查第二个表达式。这被称为短路行为。\n\n以下示例展示了条件运算符和逻辑运算符的使用：\n\
  \n```java\npublic class OperatorsDemo {\n\n    public static void main(String[]\
  \ args) {\n        int num1 = 30, num2 = 23;\n        // 使用条件运算符\n        System.out.println(\"\
  num1 == num2? \"+ (num1==num2));\n        System.out.println(\"num1 != num2? \"\
  + (num1!=num2));\n        System.out.println(\"num1 > num2? \"+ (num1>num2));\n\
  \        System.out.println(\"num1 < num2? \"+ (num1<num2));\n        System.out.println(\"\
  num1 >= num2? \"+ (num1>=num2));\n        System.out.println(\"num1 <= num2? \"\
  + (num1<=num2));\n        // 使用逻辑运算符\n        System.out.println(\"Result of logical\
  \ AND is \"+((num1>num2) && (num1==num2)));\n        System.out.println(\"Result\
  \ of logical OR is \"+((num1>num2) || (num1==num2)));\n    }\n}\n```\n\n代码的输出所示：\n\
  \n![](img/Figure_2.6.jpg)\n\n图 2.6: 使用关系运算符\n\n| 注意：在同一组表达式上对逻辑 `&&` 和 `||` 操作的结果是不同的。\
  \ |\n\n### 位运算符\n\n位运算符作用于数据的二进制形式，用以修改值中的单个位。Java 支持以下位运算符：\n\n- 位与 (`&`): 作用于两个值。如果两个位都为\
  \ `1`，则返回 `1`，否则返回 `0`。\n- 位或 (`|`): 作用于两个值。如果其中一个或两个位都为 `1`，则返回 `1`，否则返回 `0`。\n\
  - 异异或 (`^`): 作用于两个值。如果两个位互补，则返回 `1`，否则返回 `0`。\n- 取反 (`~`): 作用于单个值，并反转该值的所有位。\n-\
  \ 右移 (`>>`): 作用于单个值。将所有位向右移动位置上指定的位数。保留负数的符号位。\n- 左移 (`<<`): 作用于单个值。将所有位向左移动位置上指定的位数。\n\
  \n下图显示了 8 位 位系统中数值的位表示：\n\n![](img/Figure_2.7.jpg)\n\n图 2.7: 数字 12 的 8 位表示\n\n在\
  \ 8 位系统中，每个字母、数字、符号等都以图像所示的 8 位格式表示。最右侧的位是最低位，最左侧的位是最高位。每个位的值是 $2$ 的 $0, 1, 2, \\\
  dots 7$ 次方。因此，最右侧位的值是 $2⁰$，即 $1$，而最左侧位的值是 $2⁷$，即 $128$。所有位的值之和为 $255$。由于最小值为 `00000000`\
  \ 且最大值为 `11111111`，你可以用 8 位系统表示 256 个字符。\n\n下图显示了对数字 12 和 20 进行的逻辑 `&` 操作：\n\n![](img/Figure_2.8.jpg)\n\
  \n图 2.8: 逻辑 & 操作\n\n图像显示了逻辑 `&` 运算符的使用。在这种情况下，如果两个位都为 1，则结果为 1，否则结果为 0。\n\n下图显示了对数字\
  \ 12 右移 2 位的操作：\n\n![](img/Figure_2.9.jpg)\n\n图 2.9: 右移操作\n\n图像显示了 12 右移 2 位。在这种情况下，最右侧的两个位被丢弃，所有剩余位向前移动\
  \ 2 位。由于右移而变空的左侧两个位将被设置为 0。\n\n以下代码展示了不同位运算符的使用：\n\n```java\npublic class OperatorsDemo\
  \ {\n\n    public static void main(String[] args) {\n        int x = 12; // 00001100\n\
  \        int y = 20; // 00010100\n        System.out.println(\"x & y: \" + (x &\
  \ y)); // 00000100 = 4\n        System.out.println(\"x | y: \" + (x | y)); // 00011100\
  \ = 28\n        System.out.println(\"x ^ y: \" + (x ^ y)); // 00011000 = 24\n  \
  \      System.out.println(\"Logical complement of x is \" + (~x)); // 11110011 =\
  \ -13\n        System.out.println(\"Right shift of x by 2 is \" + (x >> 2)); //\
  \ 00000011 = 3\n        System.out.println(\"Left shift of x by 2 is \" + (x <<\
  \ 2)); // 00110000 = 48\n    }\n}\n```\n\n\n\n\n运算符优先级定义了评估可能包含多个运算符的数学表达式时运算符的优先级。下表显示了运算符优先级的顺序：\n\
  \n| 顺序 | 运算符 |\n| :--- | :--- |\n| 1. | 括号 `( )` |\n| 2. | 一元运算符 `+`, `-`, `++`,\
  \ `--`, `~`, `!` |\n| 3. | 算术运算符和位移运算符 `*`, `/`, `%`, `+`, `-`, `>>`, `<<` |\n|\
  \ 4. | 关系运算符 `>`, `>=`, `<`, `<=`, `==`, `!=` |\n| 5. | 位运算运算符和逻辑运算符 `&`, `^`, `\\\
  |`, `&&`, `\\|` |\n| 6. | 三元运算符和赋值运算符 `?:`, `=`, `*=`, `/=`, `+=`, `-=` |\n\n表 2.4：运算符优先级\n\
  \n根据运算符优先级顺序，括号内的任何内容将首先求值。考虑以下表达式：\n\n`1*2+6/3 > 2 && 2<4 || 6<5`\n\n在这里，表达式中没有括号内容，也没有一元运算符。因此，根据优先级，算术运算符将首先求值：\n\
  \n`1*2+6/3`\n\n在算术运算符中，乘法和除法会在加法之前求值。结果为：\n\n`3+2`\n\n结果为：\n\n`5`\n\n所以，现在表达式变为：\n\
  \n`3>2 && 2<4 || 6<5`\n\n现在，根据优先级，关系运算符的优先级高于逻辑运算符。它们将从左到右求值。\n\n因此，结果是：\n\n`True\
  \ && True || False`\n\n最后，评估逻辑运算符，其中 `&&` 的优先级高于 `||`。因此，结果是：\n\n`True || False`\n\
  \n逻辑运算符 `||` 的最终结果是：\n\n`True`\n\n运算符结合性有助于评估具有相同优先级的多个运算符的表达式。下表了具有相同优先级的不同运算符的结合性：\n\
  \n| 运算符 | 结合性 |\n| :--- | :--- |\n| `()`, `++`, `--` | 从左到右 |\n| `++`, `--`, `+`,\
  \ `-`, `!`, `~` | 从左到右 |\n| `*`, `/`, `%`, `+`, `-` | 从右到左 |\n| `<<`, `>>` | 从左到右\
  \ |\n| `<`, `>=`, `<=`, `==`, `!=` | 从左到右 |\n| `&`, `^`, `\\|` | 从左到右 |\n| `&&`,\
  \ `\\|` | 从左到右 |\n| `?:` | 从左到右 |\n\n表 2.5：运算符结合性\n\n考虑以下表达式：\n\n`5+12-4*3`\n\n\
  由于 `*` 的优先级更高，`4*3` 先求解。结果为：\n\n`5+12-12`\n\n由于 `+` 和 `-` 优先级相同，将应用左结合性。结果为：\n\n\
  `17-12`\n\n结果为：\n\n`5`\n\n## 2.9 格式化输出\n\nJava 提供了使用 `print()`、`println()`、`printf()`\
  \ 和 `format()` 方法对输出进行格式化的方法。`print()` 和 `println()` 方法使用 `toString()` 方法以字符串格式显示字符串和数值。`println()`\
  \ 方法在打印语句末尾添加换行符 `\\n`。\n\n以下示例展示了 `print()` 和 `println()` 方法的使用：\n\n```java\npublic\
  \ class PrintMethods {\n    public static void main(String[] args) {\n        int\
  \ a = 5;\n        System.out.println(\"The value of a is \" + a + \".\");\n    \
  \    System.out.print(\"The value of a is \");\n        System.out.print(a);\n \
  \       System.out.print(\".\");\n        System.out.println(\"Done\");\n    }\n\
  }\n```\n\n代码的输出所示：\n\n![](img/Figure_2.13.jpg)\n\n图 2.13：使用 print 方法\n\n注意最后一行是在上一个打印语句旁边打印的。这是因为\
  \ `print()` 方法没有在语句末尾添加换行符，而 `println()` 会添加换行符，以便第二行在新行打印。\n\n`printf()` 方法用于使用内置的格式说明符对数值数据进行格式化并显示在控制台上，这些符如下：\n\
