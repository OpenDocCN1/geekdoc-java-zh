  \n![](img/Figure_2.16.jpg)\n\n图 2.16: 使用 if-else 结构\n\n## switch-case 语句\n\nJava\
  \ 提供了 `switch-case` 语句作为复杂的多个 if-else 语句的替代。它将变量/表达式的值与一组预定义的值进行比较。执行精确匹配范围内的语句。Java\
  \ `switch-case` 支持数字、`String`、枚举以及包装类中的对象（如 `Character`、`Byte`、`Short` 和 `Integer`）作为\
  \ `switch-case` 的变量/表达式。`switch` 语句使用 `switch` 关键字创建，后紧跟圆括号 `()` 中的变量/表达式。根据表达式的值，执行由\
  \ `case` 关键字指示的相应 `case`。每个 `case` 都由 `break` 关键字结束。如果没有一个 `case` 匹配该表达式，则执行 `default`\
  \ 情况。\n\n### 语法：\n\n```java\nswitch (<expression>) {\ncase expr1:\n    // 执行语句\n\
  \    break;\ncase expr2:\n    // 执行语句\n    break;\n. . .\ncase exprN:\n    // 执行语句\n\
  \    break;\ndefault:\n    // 执行语句\n    break;\n}\n```\n\n下面列出了 `switch-case` 语句的一些变体：\n\
  \n- Java 还允许使用带有单个 `break` 语句的多个 `case` 语句。\n\n  **语法：**\n\n```java\nswitch (<expression>)\
  \ {\ncase expr1:\ncase expr2:\ncase expr3:\ncase expr4:\n    // 执行语句\n    break;\n\
  . . .\ncase exprN:\n    // 执行语句\n    break;\ndefault:\n    // 执行语句\n    break;\n\
  }\n```\n\n- 在 Java 中，通过在父 `switch-case` 语句的特定 `case` 中嵌入一个或多个 `switch-case` 语句，可以创建嵌套的\
  \ `switch-case`。\n\n  **语法：**\n\n```java\nswitch (<expression>) {\ncase expr1:\n\
  \    switch (<expression>){\n    case exprA:\n        // 执行语句\n        break;\n\
  \    …\n    case exprN:\n        // 执行语句\n        break;\n    }\n    break;\ncase\
  \ expr2:\n    // 执行语句\n    break;\n. .\ncase exprN:\n    // 执行语句\n    break;\ndefault:\n\
  \    // 执行语句\n    break;\n}\n```\n\n接下来的示例展示了不同类型 switch case 的使用：\n\n```java\n\
  public class SwitchCaseDemo {\n    enum Days {\n    Mon, Tue, Wed, Thu, Fri, Sat,\
  \ Sun\n    }\n    public static void main(String[] args) {\n        Days today =\
  \ Days.Tue;\n        String hour = \"am\";\n        int week = 2;\n        switch\
  \ (today) {\n        case Mon:\n        case Tue:\n        case Wed:\n        case\
  \ Thu:\n        case Fri:\n            System.out.println(\"Discount scheme for\
  \ Weekdays\");\n            switch (week) {\n            case 1:\n            case\
  \ 3:\n                System.out.println(\"No discount in week 1 and 3\");\n   \
  \             break;\n            case 2:\n            case 4:\n               \
  \ System.out.println(\"20% disocount in week 2 and 4\");\n                break;\n\
  \            }\n            break;\n        case Sat:\n        case Sun:\n     \
  \       switch (hour) {\n            case \"am\":\n                System.out.println(\"\
  Discount is 40%\");\n                break;\n            case \"pm\":\n        \
  \        System.out.println(\"Discount is 20%\");\n            }\n            break;\n\
  \        default:\n            System.out.println(\"Day does not exist\");\n   \
  \         break;\n        }\n    }\n}\n```\n\n在这里，主 `switch-case` 是基于星期几的 `enum`\
  \ 创建的。对于工作日 `Mon` 到 `Fri`，有一个共同的 case，对于 `Sat-Sun` 有一个共同的 case。现在，对于工作日，有一个针对代表月份周几的整数值的嵌套\
  \ `switch case`。对于第 2 周和第 4 周，折扣为 20%，对于第 1 周和第 3 周没有折扣。同样，对于 `Sat-Sun` 使用另一个针对一天小时\
  \ `String` 值的嵌套 `switch-case`。如果小时是 `am`，折扣为 40%，如果是 `pm`，折扣为 20%。`default` 情况用于主\
  \ `switch-case`，当指定了错误的日期值时执行。\n\n代码的输出所示：\n\n![](img/Figure_2.16.jpg)\n\n图 2.16:\
  \ 使用 switch-case 结构\n\n## 循环结构\n\nJava 允许执行一组语句。\n\n### while 循环\n\n`while` 循环用于执行直到条件为假。\n\
  \n**语法：**\n\n```java\nwhile (<expression>) {\n    // 执行语句\n}\n```\n注意：如果省略大括号 `{}`，则只有下一个语句会被包含。\n\
  \n下面列出了 `while` 循环的一些变体：\n\n- **无限循环**：当条件始终为真时，无限循环持续运行。例如：\n```java\nwhile (true)\
  \ {\n    // 执行语句\n}\n```\n\n- **空循环**：没有任何执行语句的循环被称为空循环。例如：\n```java\nint i = 5;\n\
  while (i++);\n```\n\n### do-while 语句\n\n与 `while` 语句不同，`do-while` 语句允许至少执行一次。\n\n\
  **语法：**\n\n```java\ndo {\n    // 执行语句(s);\n}\nwhile (<expression>);\n```\n注意：`while`\
  \ 和 `do-while` 循环都可以嵌套循环。\n\n接下来的示例展示了不同循环的使用：\n\n```java\npublic class WhileDoWhileDemo\
  \ {\n    public static void main(String[] args) {\n        int num1=10;\n      \
  \  // 带有嵌套 if 结构的 while 循环\n        while(num1<15){\n            System.out.println(\"\
  Number is \"+num1);\n            if(num1==12){\n                System.out.println(\"\
  Warning!! The number \" + num1 +\" is not allowed\");\n            }\n         \
  \   num1++;\n        }\n        System.out.println(\"---------------------\");\n\
  \        // 空语句循环\n        int num2=20;\n        while(++num1 < --num2);\n     \
  \   System.out.println(\"Mid-point of num1 and num2 is \"+num1);\n        System.out.println(\"\
  ---------------------\");\n        int num3=20;\n        // 至少执行一次的 do-while 循环\n\
  \        // 即使条件为假\n        do{\n            System.out.println(\"The value of num3\
  \ is \"+num3);\n        }while(num3>21);\n        System.out.println(\"---------------------\"\
  );\n        //无限 while 循环\n        while(true){\n            System.out.println(\"\
  This is infinite loop\");\n        }\n    }\n}\n```\n\n\n\n\n| 注意：必须手动停止程序以停止 while\
  \ 循环的无限执行。 |\n\n代码的输出所示：\n\n![](img/Figure_2.18.jpg)\n\n图 2.18：使用 while 和 do-while\
  \ 循环\n\n## for 语句\n\n`for` 循环与 `while` 循环类似，它会执行语句直到条件为真。它用于用户已知迭代次数的情况。在执行语句之前，会检查条件。\n\
  \n语法：\n\n```java\nfor(initialization; condition; increment/decrement) {\n// execution\
  \ statement(s)\n}\n```\n\n在这里，变量的初始值、终止条件和迭代表达式在一条语句中均指定。\n\n下面列出的是 `for` 语句的一些变体：\n\
  \n-   **‘for’ 中的多个表达式**：`for` 语句允许多个初始化或增减表达式，它们用逗号（`,`）运算符分隔，并从左到右求值。例如：\n  ```java\n\
  \  int x, y, n=10;\n  for (x = 0, y = n; x <= y; x++, y--) {\n  // execution statement(s)\n\
  \  }\n  ```\n-   **在循环语句内声明控制变量**：通过在 `for` 语句的初始化时声明变量，可以限制控制变量的作用域。例如：\n  ```java\n\
  \  for (int x = 1; x<= 5; x++) {\n  // execution statement(s)\n  }\n  ```\n-   **修改后的\
  \ for 语句声明**：`for`-循环允许通过在声明语句之外声明 `for` 循环的三个部分来修改声明语句。它允许使用条件表达式来测试布尔表达式。在 `for`-循环声明语句中，初始化或迭代部分可以为空。例如：\n\
  \  ```java\n  int x = 10;\n  boolean check = false;\n  for (; !check; x--) {\n \
  \ // execution statement(s);\n  }\n  ```\n-   **无限 for 循环**：通过将所有三个表达式留空创建一个无限 `for`\
  \ 循环。例如：\n  ```java\n  for( ; ; ) {\n  // execution statement(s);\n  }\n  ```\n\
  -   **嵌套 for 循环**：Java 允许 `for` 循环嵌套。内层循环会在外层循环的每次迭代中执行。例如：\n  ```java\n  for(int\
  \ i=0;i<5;i++){\n  for(int j=0;;<2;;++){\n  // execution statement(s)\n  }\n  //\
  \ execution statement(s)\n  }\n  ```\n\n下面的示例展示了 `for`-循环的使用：\n\n```java\npublic\
  \ class ForDemo {\n  public static void main(String[] args) {\n    int i;\n    //\
  \ 包含所有声明表达式的 for 循环\n    for (i = 1; i <= 3; i++) {\n      System.out.println(\"\
  Value of i is \" + i);\n    }\n    // for 语句内的变量初始化\n    for (int j = 1; j <= 2;\
  \ j++) {\n      System.out.println(\"Value of j is \" + j);\n    }\n    // 嵌套 for\
  \ 循环\n    for (int x = 0; x < 3; x++) {\n      for (int y = 0; y <=x; y++) {\n \
  \       System.out.print(\"*\");\n      }\n      System.out.println(\"\");\n   \
  \ }\n    // for 循环中的多个声明\n    int p, q, n = 3;\n    for (p = 0, q = n; p <= n; p++,\
  \ q--) {\n      System.out.println(p + \" + \" + q + \" = \" +));\n    }\n    int\
  \ num = 1;\n    // 使用布尔变量作为条件\n    boolean check = false;\n    for (; !check; num++)\
  \ {\n      System.out.println(\"Value of num: \" + num);\n      if (num == 2) {\n\
  \        check = true;\n        System.out.println(\"Check = true. Loop terminated.\"\
  );\n      }\n    }\n  }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_19.jpg)\n\n图 19：使用\
  \ ‘for’ 循环\n\n## 增强 for 循环\n\n增强 `for` 循环在 Java SE 5 中引入，用于提高 `for` 循环的可读性以及遍历集合元素。\n\
  \n| 注意：集合类用于存储相同或不同类型的对象。例如 `ArrayList`、`LinkedList`、`HashSet` 等。 | 语法：\n\n```java\n\
  for (<type> <variable-name>: <collection-object>) {\n// block of statement\n}\n\
  ```\n\n在这里，`<type>` 表示变量的类型，`<collection>` 表示包含所有值的集合。\n\n下面的示例展示了简单 `for`-循环和增强\
  \ `for`-循环的使用：\n\n| `int num; //简单 for 循环 (int i=0;i<arr1.length; i++){num = arr1[i];}`\
  \ | // 增强 for 循环 (int i : arr1){...}`\n\n# 跳转语句\n\n跳转语句用于运行时控制循环执行。它允许根据条件跳转到循环的不同位置或跳过语句。提供此功能的关键字是\
  \ `break` 和 `continue`：\n\n-   **break 语句**：`break` 语句可以终止 `switch` 分支，也可以跳出循环到代码中的后续语句。在嵌套循环的情况下，`break`\
  \ 语句跳出当前所在的内层循环。\n-   **continue 语句**：`continue` 语句用于跳过循环内的语句并继续下一次迭代。\n\n下面的示例展示了\
  \ `break` 和 `continue` 的使用：\n\n```java\npublic class JumpStmt {\n  public static\
  \ void main(String[] args) {\n    int stopVal;\n    for (int cnt = 1; cnt <= 10;\
  \ cnt++) {\n      Scanner input = new Scanner(System.in);\n      System.out.println(\"\
  Enter any number or zero to stop:\");\n      stopVal = input.nextInt();\n      if\
  \ (stopVal == 0) {\n        System.out.println(\"Got zero. Loop terminated.\");\n\
  \        break;\n      }\n    }\n    System.out.println(\"\");\n    for (int i =\
  \ 1; i < 10; i++) {\n      if (i % 2 == 0) {\n        continue;\n      }\n     \
  \ System.out.println(\"Value of i is \" + i);\n    }\n  }\n}\n```\n\n代码的输出所示：\n\n\
  ![](img/Figure_20.jpg)\n\n图 20：使用跳转语句\n\n## 标签跳转语句\n\nJava 提供带标签的跳转语句将控制权转移到代码中的特定位置。一旦控制权转移到标签位置，代码执行将从该点恢复。\n\
  \n语法：\n\n```java\nbreak label;\ncontinue label;\n```\n\n下面的代码展示了带标签的 `break` 语句的使用：\n\
  \n```java\npublic class BreakWithLabel {\n  public static void main(String[] args)\
  \ {\n    outer:\n    for (int i = 0; i < 5; i++) {\n      for (int j = 1; j < 4;\
  \ j++) {\n        if (j == 2) {\n          System.out.println(\"Found 2. Jumping\
  \ out.\");\n          // 跳出内层循环\n          break outer;\n        }\n      }\n  \
  \  }\n    System.out.println(\"Out of outer loop\");\n  }\n}\n```\n\n在这里，`break`\
  \ 语句提供了标签 `outer`，这将打破内部循环并跳到外层循环之外。如果 `break` 语句没有提供标签，它将打破内部循环并跳到内部之外，再次执行外层循环，直到外层循环条件为真。\n\
  \n代码的输出所示：\n\n![](img/Figure_21.jpg)\n\n图 21：使用标签的 ‘break’ 语句\n\n下面的示例展示了带标签的 `continue`\
  \ 语句的使用：\n\n```java\npublic class ContinueWithLabel {\n  public static void main(String[]\
  \ args) {\n    outer:\n    for (int i = 1; i < 5; i++) {\n      for (int j = 1;\
  \ j < 5; j++) {\n        if (j > i) {\n          System.out.println();\n       \
  \   continue outer;\n        }\n        System.out.print(j);\n      }\n      System.out.println(\"\
  \\nEnd of outer loop.\");\n    }\n  }\n}\n```\n\n在内层循环中使用标签 `outer` 配合 `continue`\
  \ 语句会将控制转移到外层循环，并跳过内层循环剩余语句的执行。如果 `continue` 语句没有标签，它将在内层循环中继续直到条件为真。\n\n\n\n\n\n\
  ## 结论\n\n在本章中，你学习了注释用于记录程序，以便理解代码或逻辑。对于存储数据，Java 使用变量，它是赋予存储数据的内存位置的名称。`static`\
  \ 变量是类级变量，不需要实例即可访问。数据类型用于通知编译器变量中存储的数据类型。Java 提供了运算符来对变量中存储的数据进行操作。Java 提供了 `Scanner`\
  \ 类来从键盘接受用户输入。`if` 语句会评估条件。`switch-case` 语句是复杂的 `if-else` 语句的替代方案。Java 允许使用 `while`、`do-while`\
  \ 和 `for` 等循环结构重复执行一组语句以满足特定条件。`break` 语句用于终止 `switch case` 或跳出循环到语句。`continue`\
  \ 语句用于跳过循环内的语句并继续下一次迭代。\n\n在下一章，你将学习 Java 组件。\n\n## 单选题\n\n1. 下面哪个无效的变量名？\n    1.\
