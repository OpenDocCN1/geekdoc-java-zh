  \        System.out.println(\"Enter second number\");\n        int num2 = s.nextInt();\n\
  \        try {\n            StandardCalculator obj = new StandardCalculator();\n\
  \            obj.calculate(num1, num2);\n        } catch (StandardException e) {\n\
  \            Throwable t = e.getCause();\n            // 打印消息和原因\n            System.out.println(\"\
  Error: \" + e.getMessage());\n            System.out.println(\"Cause: \" + t);\n\
  \        } finally {\n            System.out.println(\"----------------------\"\
  );\n            System.out.println(\"All resources closed in finally block\");\n\
  \        }\n    }\n\n    public void calculate(int a, int b) throws StandardException\
  \ {\n        try {\n            int c = a / b;\n            System.out.println(\"\
  Division of \" + a + \" and \" + b + \" is \" + c);\n            int arr[] = new\
  \ int[c];\n            for (int i = 0; i <= arr.length; i++) {\n               \
  \ arr[i] = i + 1;\n            }\n        } catch (ArithmeticException e) {\n  \
  \          throw new StandardException(\"Divide by zero\", e);\n        } catch\
  \ (ArrayIndexOutOfBoundsException e) {\n            throw new StandardException(\"\
  Array Index out of bounds\", e);\n        }\n    }\n}\n```\n\n（注：原文文本后半部分出现了大量重复的乱码字符，已根据您的要求忽略这些重复内容，仅翻译了核心逻辑部分。）\n\
  \n\n\n}\n\n在这里，代码期望 `a` 的值应该大于零或等于零。如果大于零，则显示相应的消息。在 `else` 块中，`assert` 语句验证如果该值不大于零，则它应该等于零。如果值为负数，则断言失败。\n\
  \n*   **控制流不变性**：`switch` 语句等控制流不变性也可以使用断言来实现默认情况（default case）。\n\n例如：\n\n```java\n\
  public static void main(String[] args) {\n    String direction = args[0];\n    switch\
  \ (direction) {\n        case \"east\":\n            // case code\n            break;\n\
  \        case \"west\":\n            // case code\n            break;\n        case\
  \ \"north\":\n            // case code\n            break;\n        case \"south\"\
  :\n            // case code\n            break;\n        default:\n            assert\
  \ false : direction + \" is incorrect\";\n            break;\n    }\n}\n```\n\n\
  在这里，如果用户指定的方向不是选项中的之一，`default` 情况将使用 `assert` 显式返回 `false` 并显示消息。\n\n*   **前置条件**：用于前置条件的断言用于检查方法调用时必须满足的条件。不要对检查\
  \ `public` 方法的参数使用前置条件断言，因为方法本身会确保参数是恰的。\n\n例如：\n\n```java\nprivate void setInterval(int\
  \ counter) {\n    // 在私有方法中验证前置条件\n    assert counter > 0 && counter <= 1500/MAX_SPEED\
  \ : counter;\n    // 设置新的计数器\n    System.out.println(\"Interval is set to:\" + interval);\n\
  }\n```\n\n在代码中，如果 `MAX_SPEED` 的值大于 1500，或者用户指定的 `counter` 值小于零或大于除法结果的值，则断言将失败。\n\
  \n*   **后置条件**：用于后置条件的断言用于检查方法成功执行后必须满足的条件。在公共和非公共方法中都可以使用断言来检查后置条件。\n\n例如：\n\n\
  ```java\nArrayList names = new ArrayList();\n// 初始化 ArrayList 的代码。\npublic Object\
  \ remove(){\n    int size = names.size();\n    if(size == 0){\n        throw new\
  \ RuntimeException(\"Empty List\");\n    }\n    Object name = names.remove(0) ;\n\
  \    // 验证后置条件\n    assert(names.size() == size-1);\n    return name;\n}\n```\n\n\
  `remove()` 方法检查数组的大小是否为零，如果是，将抛出 `RuntimeException`。接下来，获取数组元素。现在，在返回值之前，使用断言进行检查，如果\
  \ `size()` 方法返回的值等于 `size-1`，否则断言失败并抛出 `AssertionError`。\n\n*   **类不变性**：用于类不变性的断言有助于检查类的每个实例中必须满足的条件。在任何方法完成之前和之后，不变性必须为真。例如：\n\
  \n```java\n// 如果账户有余额则返回 true\nprivate boolean hasBalance() {\n    // 检查账户是否有余额的代码\n\
  }\n```\n\n`hasBalance()` 方法用于验证在任何方法完成之前和之后都应该为真的约束。因此，每个公共方法在返回之前都应该包含 `assert\
  \ hasBalance();` 这一行。\n\n## 6.8 java.lang 包的类\n\n`java.lang` 包提供了几个类，用于执行类中的数据操作基本任务，如处理异常、线程、安全、数学等。`java.lang`\
  \ 的类自动包含在每个 Java 源文件中，代码中不需要显式的 `import` 语句。\n\n下面列出了 `java.lang` 包中一些最重要的类：\n\n\
  *   `Object`：它是类层次结构的根。\n*   `Class`：此类的实例表示运行时的类。\n*   `Enum`：它是所有枚举类的基类。\n*  \
  \ `Wrapper classes`：将原始类型封装为对象的类。\n*   `String`：它是用于创建和操作字符串及字符串字量的类。\n*   `StringBuffer`\
  \ 和 `StringBuilder`：这些类用于执行字符串操作。\n*   `Math`：此类提供了基本的数学函数，如平方根、正弦、余弦等。\n*   `Throwable`：它是异常层次结构的基类。\n\
  *   `Error`、`Exception` 和 `RuntimeException`：这些是种异常类型的基类。异常类用于抛出语言级和其他常见异常。\n* \
  \  `Comparable`：这是一个允许对象泛型比较和排序的接口。\n*   `Iterable`：这是一个允许使用增强 for 循环进行泛型迭代的接口。\n\
  *   `Thread`：它是允许操作线程的类。\n*   `Process`、`ClassLoader`、`Runtime`、`System` 和 `SecurityManager`：这些类提供了用于管理外部进程创建、类动态加载、环境时间查询以及执行安全策略的系统操作。\n\
  \n### 6.8.1 Object 类\n\n`Object` 类是 Java 类层次结构的根，因此每个类都是 `Object` 类的隐含子类并实现了它的方法。\n\
  \n下面列出了 `Object` 类的一些常用方法：\n\n*   `boolean equals(Object obj)`：如果调用 `equals()` 方法的对象与传递给\
  \ `equals()` 方法的参数相等，则返回 `true`，否则返回 `false`。\n*   `protected void finalize()`：由垃圾回收器在对象回收时调用。\n\
  *   `String toString()`：返回对象的字符串表示。\n*   `Class<? extends Object> getClass()`：返回对象的运行时类。\n\
  *   `protected Object clone()`：创建并返回对象的副本。\n*   `void notify()`：唤醒等待该对象监控器的线程。\n\
  *   `void notifyAll()`：唤醒所有等待该对象监控器的线程。\n*   `void wait()`：导致当前线程等待直到另一个线程调用 `notify()`\
  \ 或 `notifyAll()`。\n*   `void wait(long timeout)`：导致当前线程等待直到指定的时间过去或另一个线程调用 `notify()`\
  \ 或 `notifyAll()`。\n*   `void wait(long timeout, int nanos)`：导致当前线程等待直到指定的真实时间过去或另一个线程调用\
  \ `notify()` 或 `notifyAll()`。\n\n以下示例展示了 `Object` 方法的使用：\n\n```java\npublic class\
  \ ObjectClassDemo {\n    Integer val;\n\n    public ObjectClassDemo() {\n    }\n\
  \n    public ObjectClassDemo(Integer val) {\n        this.val = val;\n    }\n\n\
  \    public static void main(String[] args) {\n        // 创建 Object 类的对象\n     \
  \   ObjectClassDemo obj1 = new ObjectClassDemo(4577);\n        ObjectClassDemo obj2\
  \ = new ObjectClassDemo(4577);\n\n        System.out.println(\"String form of obj1\
  \ is \"+obj1.val.toString());\n\n        // 检查对象的相等性\n        if (obj1.equals(obj2))\
  \ {\n            System.out.println(\"Objects are equal\");\n        } else {\n\
  \            System.out.println(\"Objects are not equal\");\n        }\n\n     \
  \   obj2 = obj1; // 将 obj1 的引用赋值给 obj2\n\n        // 再次检查对象的相等性\n        if (obj1.equals(obj2))\
  \ {\n            System.out.println(\"Objects are equal\");\n        } else {\n\
  \            System.out.println(\"Objects are not equal\");\n        }\n    }\n\
  }\n```\n\n在这里，创建了两个 `Object` 类对象并检查它们的相等性。代码的输出所示：\n\n![](img/Figure_6.6.png)\n\n\
  图 6.6：Object 类方法\n\n请注意，尽管在对象实例化时传递了相同的值，第一次检查仍显示对象不相等。但在将 `obj1` 的引用赋值给 `obj2`\
  \ 后，`equals()` 方法返回 `true` 并打印 Objects are equal。\n\n### 6.8.2 Class 类\n\n\n\n\n\
  \n在 Java 程序的执行过程中，`Class` 类的实例代表了类和接口。`Class` 类没有公共构造函数，当类被类加载器加载时，JVM 会通过调用 `defineClass()`\
  \ 方法自动创建它的对象。\n\n下面列出了 `Class` 类的一些常用方法：\n\n- `static Class forName(String className)`:\
  \ 返回与字符串参数 `className` 中指定的类或接口关联的 `Class` 对象。\n- `Class[] getClasses()`: 返回一个 `Class`\
  \ 对象数组，表示作为此 `Class` 对象所代表类的成员的所有公共类和接口。\n- `String getName()`: 以 `String` 形式返回此\
  \ `Class` 对象代表的实体（类、接口、数组类、基本数据类型或 void）的名称。\n- `int getModifiers()`: 返回以整数编码的此类或接口的\
  \ Java 语言修饰符。\n- `Field getField(String name)`: 返回一个 `Field` 对象，表示此 `Class` 对象所代表的类或接口中指定的公共成员字段。\n\
  - `Method getMethod(String name, Class[] parameterTypes)`: 返回一个 `Method` 对象，表示此\
  \ `Class` 对象所代表的类或接口中指定的公共成员方法。\n- `Class[] getInterfaces()`: 返回由此对象代表的类或接口实现的接口数组。\n\
  - `URL getResource(String name)`: 查找指定名称的资源。\n- `Class getSuperclass()`: 返回表示此 `Class`\
  \ 代表的实体（类、接口、基本数据类型或 void）的父类的 `Class`。\n- `boolean isArray()`: 判断此 `Class` 对象是否代表一个数组类。\n\
  - `boolean isInstance(Object obj)`: 判断参数中指定的 `Object` 是否与此 `Class` 代表的对象兼容（赋值兼容）。\n\
  - `boolean isInterface()`: 判断指定的 `Class` 对象是否代表一个接口类型。\n- `String toString()`: 返回对象的字符串表示。\n\
  \n### 6.8.3 Math 类\n\n`Math` 类提供了用于对数据执行算术/数值操作的方法。例如，三角函数、对数函数、幂等。\n\n下面列出了 `Math`\
  \ 类的一些常用方法：\n\n- `static <type> abs(<type> a)`: 返回参数中指定类型的绝对值。该类型可以是 `double`、`float`、`int`\
  \ 或 `long`。\n- `static double ceil(double a)`: 返回大于或等于参数的最小 `double` 值。\n- `static\
  \ double floor(double a)`: 返回小于或等于参数的最大大 `double` 值。\n- `static double cos(double\
  \ a)`: 返回角度的三角余弦。\n- `static double sin(double a)`: 返回角度的三角正弦。\n- `static double\
  \ tan(double a)`: 返回角度的三角正切。\n- `static double exp(double a)`: 返回欧数 `e` 的 `double`\
  \ 值的幂次方。\n- `static double pow(double a, double b)`: 返回第一个参数的第二个参数的幂次方的值。\n- `static\
  \ double log(double a)`: 返回 `double` 值的自然对数（底为 `e`）。\n- `static <type> max(<type>\
  \ a, <type> b)`: 返回指定类型两个值中的较大者。该类型可以是 `double`、`float`、`int` 或 `long`。\n- `static\
  \ <type> min(<type> a, <type> b)`: 返回指定类型两个值中的较小者。该类型可以是 `double`、`float`、`int`\
  \ 或 `long`。\n- `static double random()`: 返回一个大于等于 `0.0` 且小于 `1.0` 的正 `double` 值。\n\
  - `static long round(double a)`: 返回最接近参数的 `long`。\n- `static int round(float a)`:\
  \ 返回最接近参数的 `int`。\n- `static double sqrt(double a)`: 返回 `double` 值正确四舍五入的正平方根。\n\
  \n以下代码展示了 `Math` 类方法的使用：\n\n```java\npublic class MathDemo {\n    static int num1\
  \ = 2, num2 = 16;\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Number 1: \" + num1);\n        System.out.println(\"Number 2: \" + num2);\n    \
  \    System.out.println(\"Max value is \" + Math.max(num1, num2));\n        System.out.println(\"\
  Min value is \" + Math.min(num1, num2));\n        System.out.println(\"Square root\
  \ of num2 is \" + Math.sqrt(num2));\n        System.out.println(\"Result of num2\
  \ to the power of num1 is \" + Math.pow(num2, num1));\n        System.out.println(\"\
  Random value generated is \" + Math.random());\n    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_6.7.png)\n\
  \n图 6.7: Math 类方法\n\n### 6.8.4 ThreadGroup 类\n\nJava 中的线程是执行程序时遵循的路径。所有 Java 程序都至少有一个线程，即\
  \ JVM 在程序启动时创建的 `main` 线程，`main()` 方法在 `main` 线程中调用。\n\n线程组（ThreadGroup）代表线程的集合，也可以包含其他线程组。一个线程组只能有一个父线程组，除了根线程组外，每个线程组都有父线程组。\n\
  \n下面是 `ThreadGroup` 类的一些方法：\n\n- `int activeCount()`: 返回线程组及其子组中的活跃线程数。\n- `int\
  \ activeGroupCount()`: 返回线程组及其子组中的活跃线程组数。\n- `int getMaxPriority()`: 返回线程组及其子组中的最大优先级。\n\
  - `String getName()`: 返回线程组的名称。\n- `ThreadGroup getParent()`: 返回线程组的父线程组。\n- `void\
  \ interrupt()`: 中断线程组及其子组中的所有线程。\n- `void destroy()`: 销毁线程组及其子组。\n- `void checkAccess()`:\
  \ 判断当前运行线程是否有权限修改此线程组。\n- `void list()`: 向标准输出打印线程组的信息。\n- `int enumerate(Thread[]\
  \ list)`: 将线程组及其子组中的活跃线程拷贝到指定的数组中。\n- `int enumerate(ThreadGroup[] list)`: 将线程组及其子组中的活跃线程组拷贝到指定的数组中。\n\
  - `boolean isDaemon()`: 判断线程组是否为守护组。\n- `boolean isDestroyed()`: 判断线程组是否已被销毁。\n\
  - `boolean parentOf(ThreadGroup g)`: 判断此组是否为参数线程组 `g` 或其祖先线程组。\n- `void setDaemon(boolean\
  \ daemon)`: 修改线程组的守护状态。\n- `void setMaxPriority(int pri)`: 设置线程组及其子组的最大优先级。\n- `String\
  \ toString()`: 返回组的字符串表示。\n\n### 6.8.5 System 类\n\n`System` 类提供了许多访问系统属性和环境变量、标准输入输出和错误流、加载文件/库等方法。\n\
  \n下面是 `System` 类的一些常用方法：\n\n- `static void arraycopy(Object src, int srcPos, Object\
  \ dest, int destPos, int length)`: 从指定的源数组从源位置拷贝数组到目标位置。\n- `static long currentTimeMillis()`:\
  \ 返回当前的毫秒数。\n- `static String getenv(String name)`: 获取指定环境变量的值。\n- `static Properties\
  \ getProperties()`: 获取当前系统属性。\n- `static void exit(int status)`: 终止当前运行 JVM。\n-\
  \ `static void gc()`: 运行垃圾回收。\n- `static void loadLibrary(String libname)`: 加载由参数\
  \ `libname` 指定系统库。\n- `static void setSecurityManager(SecurityManager s)`: 设置系统安全管理器。\n\
  \n以下示例展示了 System 类方法的使用：\n\n```java\npublic class SystemClassDemo {\n\n\n\n\n```java\n\
  static String str1[] = {\"Mon\", \"Tue\", \"Wed\", \"Thu\"};\n\nstatic String str2[]\
  \ = {\"East\", \"West\", \"North\", \"South\"};\n\npublic static void main(String[]\
  \ args) {\n    System.out.println(\"Current time in milliseconds is: \" + System.currentTimeMillis());\n\
  \    System.out.println(\"Value of Path variable is: \" + System.getenv(\"PATH\"\
  ));\n    System.arraycopy(str1, 0, str2, 0, 3);\n    System.out.println(\"Copied\
  \ array is: \");\n    for (int i = 0; i < 4; i++) {\n        System.out.println(str2[i]);\n\
  \    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_6.8.png)\n\n图 6.8: System 类方法\n\n###\
  \ 6.8.6 Runtime 类 \n\n为了让 Java 应用程序与系统环境交互，`Runtime` 类始终有一个实例。然而，应用程序无法创建创建该类的实例。\n\
  \n下面列出了 `Runtime` 类的一些常用方法：\n\n- `static Runtime getRuntime()`：返回与当前 Java 关联关联运行时对象。\n\
  - `void loadLibrary(String libname)`：加载参数中指定的库的动态库。\n- `long maxMemory()`：返回 JVM\
  \ 可能使用的最大内存量。\n- `int availableProcessors()`：返回 JVM 可用的处理器数量。\n- `long freeMemory()`：返回\
  \ JVM 中的空闲内存量。\n- `long totalMemory()`：返回 JVM 中的总内存量。\n- `Process exec(String command)`：在单独进程中执行参数中指定的字符串命令。\n\
  - `void exit(int status)`：通过启动关闭序列终止正在运行的 JVM。\n- `void halt(int status)`：强制终止正在运行的\
  \ JVM。\n- `void load(String filename)`：将参数中指定的文件名作为动态库加载。\n- `void gc()`：执行垃圾回收器。\n\
  - `void runFinalization()`：执行任何等待最终化的对象的最终化方法。\n\n## 6.9 正则表达式\n\n正则表达式用于处理文本和数据。它们通常用于定义对字符串的约束条件，例如电子邮件或密码验证。`java.util.regex`\
  \ API 用于定义搜索或处理字符串的模式。`java.util.regex` 包中用于创建正则表达式的三个主要类是：\n\n- `Pattern`\n- `Matcher`\n\
  - `PatternSyntaxException`\n\n#### 6.9.1 Pattern 类\n\n`Pattern` 类的实例是以字符串格式指定的正则表达式的编译形式。`Pattern`\
  \ 类没有任何公共构造函数，因此，它不能被实例化。它提供了重载的静态 `compile()` 方法来创建不同的模式。\n\n语法：\n`public final\
  \ class Pattern extends Object implements Serializable`\n\n`Pattern` 类方法接受正则表达式作为第一个参数，并返回\
  \ `Pattern` 类的实例。该实例被用于创建一个 `Matcher` 对象，该对象可以使用正则表达式来匹配不同的字符序列。\n\n例如：\n\n```java\n\
  import java.util.regex.Pattern;\nimport java.util.regex.Matcher;\npublic class PatternDeo\
  \ {\n    public static void main(String[] args) {\n        Pattern pt = Pattern.compile(\"\
  b*x\");\n        // 使用 Pattern 对象和要匹配的字符串创建 Matcher 对象\n        Matcher mt = pt.matcher(\"\
  bbbx\");\n        // 检查匹配项\n        boolean result = mt.matches();\n        System.out.println(\"\
  Pattern Match: \"+result);\n    }\n}\n```\n\n`Matcher` 类的 `matches()` 方法用于验证 `Pattern`\
  \ 对象指定的模式是否匹配 `matcher()` 方法指定的字符串。请注意，当正则表达式只需要使用一次时，`matches()` 方法非常有用。该方法会在单次调用中编译表达式并将其与输入序列进行匹配。代码的输出所示：\n\
  \nPattern Match: true\n\n下面列出了 `Pattern` 类的一些方法：\n\n- `matches()`：`Pattern` 类还定义了\
  \ `matches(String, CharSequence)` 方法，用于检查模式是否存在于给定的输入字符串中。例如，上一个示例中使用的三行代码可以使用 `Pattern`\
  \ 类的 `matches()` 方法简化为一条语句，如下：\n  `boolean result = Pattern.matches(\"b*x\", \"\
  bbbx\");`\n\n`Matcher` 类的 `matches()` 方法在重复匹配时效率较低，因为它不允许编译后的模式被重用。`Pattern` 类的对象是不可变的，可以被多个并发线程安全地使用，而\
  \ `Matcher` 类的实例对于此类用途是不安全的。\n\n`Pattern` 类 `matches()` 方法的另一个示例所示：\n`Pattern.matches(\"\
  \\\\d\",\"4\");`\n\n在这里，`\\d` 表示单个数字。该方法将返回 true，因为数字 4 匹配正则表达式 `\\d`。\n\n> **注意**：由于反斜杠\
  \ `\\` 字符在 Java 中有特殊含义，在指定模式时必须使用转义序列 `\\\\`，即 `\\\\d`。\n\n- `split(String)`：`Pattern`\
  \ 类的 `split()` 方法用于提取位于匹配模式两侧的文本。下面的示例显示了 `split()` 方法的使用：\n\n```java\nimport java.util.regex.Pattern;\n\
  public class SplitDemo {\n    private static final String REGEX = \":\";\n    private\
  \ static final String DIRECTION = \"East:West:North:South\";\n    private static\
  \ final String REGEX1 = \"\\\\d\";\n    private static final String DIRECTIONS =\
  \ \"East:West:North:South\";\n\n    public static void main(String[] args) {\n \
  \       Pattern obj1 = Pattern.compile(REGEX);\n        String[] directions = obj1.split(DIRECTION);\n\
  \        for (String s : directions) {\n            System.out.println(s);\n   \
  \     }\n        System.out.println(\"---------\");\n        Pattern obj1 = Pattern.compile(REGEX1);\n\
  \        String[] days = obj1.split(DIRECTIONS);\n        for (String s : days)\
  \ {\n            System.out.println(s);\n        }\n    }\n}\n```\n\n代码的输出所示：\n\n\
  ![](img/Figure_6.9.png)\n\n图 6.9: 使用 split 方法\n\n- `public String toString()`：返回模式的字符串表示。\n\
  \n#### 6.9.2 Matcher 类\n\n`Matcher` 对象通过使用 `Pattern` 对象创建，并用于执行模式与输入字符串的匹配操作。`Matcher`\
  \ 类也没有公共构造函数，因此不能实例化。\n\n`Matcher` 对象通过调用 `Pattern` 对象上的 `matcher()` 方法创建。\n\n`Matcher`\
  \ 类可以执行的三种不同匹配操作是：\n\n- 使用 `matches()` 方法将整个输入序列与模式匹配。\n- 使用 `lookingAt()` 从开始匹配输入序列。\n\
  - 使用 `find()` 方法扫描输入序列以寻找匹配模式的下一个子序列。\n\n这些方法都返回一个布尔值，指示成功或失败。关于 `Matcher` 的重要点：\n\
  \n- Matcher 在其输入的一个子集（称为区域）中进行匹配，默认情况下包含 matcher 的所有输入。\n- `region()` 方法用于修改区域。\n\
  - `regionStart()` 和 `regionEnd()` 方法用于查询区域。\n- 可以修改区域边界与选定模式构造之间的交互方式。\n- `Matcher`\
  \ 类的不同索引方法提供索引值，用于指示匹配项在输入字符串中的准确位置。\n\n`Matcher` 类实现了 `MatchResult` 接口。下面列出了 `Matcher`\
  \ 类的重要方法：\n\n- `boolean matches()`：检查正则表达式是否匹配模式。\n- `boolean find()`：查找匹配模式的下一个表达式。\n\
  - `boolean find(int start)`：从给定的起始索引查找匹配模式的下一个表达式。\n\n\n\n\n\n* `String group()`:\
  \ 返回匹配的子序列。\n* `int start()`: 返回匹配的子序列的起始索引。\n* `int end()`: 返回匹配的子序列的结束索引。\n* `int\
  \ groupCount()`: 返回匹配的子序列的总数。\n\n`matcher` 的显式状态初始为未定义，在此点尝试查询 `matcher` 匹配的任何部分将导致抛出\
  \ `IllegalStateException`。`reset()` 方法用于显式重置 `matcher`。对于新的输入序列，可以调用 `reset(CharSequence)`\
  \ 方法。当对 `matcher` 对象执行 `reset` 操作时，它的显式状态信息将被丢弃，且追加位置被设置为零。不建议在并发线程中使用 `Matcher`。\n\
  \n以下示例展示了 `Matcher` 类的用法：\n\n```java\nimport java.util.regex.Pattern;\nimport java.util.regex.Matcher;\n\
  import java.util.Scanner;\n\npublic class RegexDemo {\n    public static void main(String[]\
  \ args) {\n        String choice;\n        while (true) {\n            Scanner s\
  \ = new Scanner(System.in);\n            System.out.println(\"Enter the pattern:\"\
  );\n            String expression = s.next();\n            Pattern pt = Pattern.compile(expression);\n\
  \            System.out.println(\"Enter the string to search:\");\n            String\
  \ search = s.next();\n            Matcher mt = pt.matcher(search);\n           \
  \ boolean found = false;\n            while (mt.find()) {\n                System.out.println(\"\
  Found the pattern \"+mt.group()+\" starting at index \"\n                + mt.start()+\
  \ \" and ending at index \"+mt.end());\n                found = true;\n        \
  \    }\n            if (!found) {\n                System.out.println(\"No match\
  \ found.\");\n            }\n            System.out.println(\"Press x to exit or\
  \ y to continue\");\n            choice = s.next();\n            if (choice.equals(\"\
  x\")) {\n                System.exit(0);\n            }\n        }\n    }\n}\n```\n\
  \n代码的输出所示：\n\n![](img/Figure_6.10.png)\n\n图 6.10: Pattern 和 Matcher\n\n### 6.9.3\
  \ PatternSyntaxException\n\n`PatternSyntaxException` 对象是一个未检查异常，用于指示正则表达式模式中的语法错误。\n\
  \n## 6.10 字符类\n\n正则表达式中的字符类是一组封装在方括号内的字符，它指示这些字符将成功匹配给定输入字符串中的单个字符。\n\n下表列出了字符类中支持的正则表达式结构：\n\
  \n| 结构 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `[abc]` | 简单类 | 匹配 `a`、`b` 或 `c` |\n\
  | `[^abc]` | 取反 | 匹配除 `a`、`b` 或 `c`以外的任意字符 |\n| `[a-zA-Z]` | 范围 | 匹配从 `a` 到 `z`\
  \ 或从 `A` 到 `Z`（包含）的任何字符 |\n| `[a-d[m-p]]` | 并集 | 匹配从 `a` 到 `d` 或从 `m` 到 `p` 的任何字符：`[a-dm-p]`\
  \ |\n| `[a-z&&[def]]` | 交集 | 匹配 `d`、`e` 或 `f` |\n| `[a-z&&[^bc]]` | 差集 | 匹配从 `a`\
  \ 到 `z` 的任意字符，排除 `b` 和 `c`，即 `[ad-z]` |\n| `[a-z&&[^m-p]]` | 差集 | 匹配从 `a` 到 `z`\
  \ 的任意字符且不是 `m` 到 `p`：`[a-lq-z]` |\n\n表 6.1: 常见字符类\n\n#### 内置字符类\n\n`Pattern` API\
  \ 中有几个内置的 `Character` 类，它们为常用的正则表达式提供了快捷表示方式。下表列出了预定义的 `Character` 类：\n\n| 结构 |\
  \ 描述 |\n| :--- | :--- |\n| `.` | 匹配任意字符（可能匹配也不匹配行终止符） |\n| `\\d` | 匹配任意数字，即 `[0-9]`\
  \ |\n| `\\D` | 匹配任意非数字，即 `[⁰-9]` |\n| `\\s` | 匹配空白字符，即 `[ \\t\\n\\x0B\\f\\r]` |\n\
  | `\\S` | 匹配任意非空白字符，即 `[^\\s]` |\n| `\\w` | 匹配任意单词字符，即 `[a-zA-Z_0-9]` |\n| `\\W`\
  \ | 匹配任意非单词字符，即 `[^\\w]` |\n\n表 6.2: 预定义的字符类\n\n例如：\n\n`\\d\\d\\d[E-F]`\n\n这将匹配像\
  \ `000E`、`010F`、`384C` 等字符串。\n\n## 结论\n\n在本章中，你学习了程序中发生的任何破坏其正常执行的异常或意外事件都被称为异常。检查异常在程序中是可以预期的，并为它们提供了适当的处理器。错误和运行时异常共同构成了未检查异常。Java\
  \ 中任何类的基类都是 `Object` 类，对于所有异常类，`Throwable` 类是基类。`Exception` 类是所有检查异常和 `RuntimeException`\
  \ 的父类。`throw` 和 `throws` 句用于显式地抛出异常。\n\n### 多选择题\n\n1. `Exception` 类是 `_________`\
  \ 的子类。\n   1. `Error`\n   2. `RuntimeException`\n   3. `Throwable`\n   4. `Object`\n\
  \n2. 考虑下面的代码：\n```java\npublic static void main(String[] args) {\n    try (BufferedReader\
  \ br = new BufferedReader(new FileReader(\"myfile.txt\"))) {\n        System.out.println(br.readLine());\n\
  \    } catch (IOException e) {\n        e.printStackTrace();\n    }\n}\n```\n代码描述了什么概念？\n\
  \   1. 文件处理\n   2. try-with-resources\n   3. try-catch 块\n   4. Exception\n\n3.\
  \ `_____` 句用于列出方法可能抛出的异常。\n   1. `throw`\n   2. `throws`\n   3. `try`\n   4. `catch`\n\
  \n4. 考虑下面的代码：\n```java\nboolean result = Pattern.matches(\"b*x\", \"_____\");\n\
  ```\n哪些字符串匹配该模式？\n   1. `b`\n   2. `bbxx`\n   3. `bbbx`\n   4. `bxbx`\n\n5. 考虑下面的代码：\n\
  ```java\npublic static void main(String args[]) {\n    Scanner s = new Scanner(System.in);\n\
  \    System.out.print(\"Enter your age: \");\n    int age = s.nextInt();\n    assert\
  \ age <= 18 : \"Not valid age\";\n    System.out.println(\"Age is \" + age);\n}\n\
  ```\n假设用户输入 12，输出是什么？\n   1. 编译错误\n   2. AssertionError: Not valid age\n   3. 无输出\n\
  \   4. Age is 12\n\n## 答案\n\n1. c\n2. b\n3. b\n4. c\n5. d\n\n## 作业\n\n根据以下规范创建一个\
