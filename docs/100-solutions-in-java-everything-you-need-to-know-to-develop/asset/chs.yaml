  \ JDK 8。下载和安装 JDK 10 的步骤如下：\n\n1. 打开 JDK 10 下载页面。JDK 10 下载页面如下所示所示：\n   ![](img/Figure_1.8.jpg)\n\
  \   图 1.8: JDK 10 下载页面\n\n2. 选取“接受许可协议”单选按钮。\n\n3. 如下图所示，下载适用于 Windows 64 位系统的 JDK\
  \ 10 安装程序执行文件：\n   ![](img/Figure_1.9.jpg)\n   图 1.9: JDK 10 下载链接\n\n4. 下载完成后，双击安装程序执行文件开始安装，并按照安装向导的说明操作：\n\
  \   ![](img/Figure_1.10.jpg)\n   图 1.10: JDK 10 安装向导\n\n5. 点击“下一步”开始安装过程。\n\n  \
  \ 默认情况下，安装程序会将所有开发工具、源代码和 JRE 安装在 `C:\\Program Files\\Java` 目录下。\n\n   截图显示了包含 JDK\
  \ 8 和 JDK 10 安装文件夹以及相应 JRE 文件夹的 Java 目录：\n   ![](img/Figure_1.11.jpg)\n   图 1.11:\
  \ JDK 8 和 JDK 10 安装文件夹\n\n   后续截图显示了 JDK 8 和 JDK 10 目录的子文件夹：\n   ![](img/Figure_1.12.jpg)\n\
  \   图 1.12: JDK 8 和 JDK 10 安装结构\n\n下表提供了典型 JDK 8 安装常见目录的简要描述：\n\n| 目录 | 内容 | 描述\
