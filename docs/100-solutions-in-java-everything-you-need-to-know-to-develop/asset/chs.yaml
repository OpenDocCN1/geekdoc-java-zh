  \n将在接下来的章节中解释一些重要的类。\n\n### 9.8.1 Deflater 类\n\n`Deflater` 类用于使用 ZLIB 压缩库压缩输入流中存在的数据。\n\
  \n构造函数：\n\n*   `Deflater()`: 创建一个具有默认压缩级别的 `Deflater` 实例。\n\n下面列出了 `Deflater` 类的一些重要方法：\n\
  \n*   `deflate(byte[] buffer)`: 用压缩数据填充输出缓冲区，并返回压缩数据的实际大小。\n*   `deflate(byte[]\
  \ buffer, int offset, int len)`: 从给定的偏移量和总字节数用压缩数据填充输出缓冲区。返回压缩数据的实际大小。\n*   `setInput(byte[]\
  \ buffer)`: 设置缓冲区中用于压缩的输入数据。\n*   `setInput(byte[] buffer, int offset, int len)`:\
  \ 从给定的偏移量到字节数设置缓冲区中用于压缩的输入数据。\n*   `finish()`: 表示压缩应以输入缓冲区当前的内容结束。\n*   `end()`:\
  \ 关闭压缩器并丢弃未处理的输入。\n\n以下代码演示了 `Deflater` 的用法：\n\n```java\nimport java.io.CharArrayWriter;\n\
  import java.io.FileWriter;\n\npublic class CharArrayWriterDemo {\n    public static\
  \ void main(String args[]) {\n        try {\n            // 初始化 CharArrayWriter\
  \ 对象\n            CharArrayWriter cout = new CharArrayWriter();\n            cout.write(\"\
  Welcome to the World of Java\");\n            // 初始化 FileWriter 对象\n           \
  \ FileWriter fw1 = new FileWriter(\"D:\\\\Demos\\\\Out1.txt\");\n            //\
  \ 从字符数组写入器写入文件\n            cout.writeTo(fw1);\n            fw1.close();\n     \
  \       System.out.println(\"Task Completed\");\n        } catch (Exception e) {\n\
  \            System.out.println(\"Error: \" + e.getMessage());\n        }\n    }\n\
  }\n```\n\n`CharArrayWriter` 缓冲区中的数据通过 `writeTo()` 方法写入文件 `Out1.txt`。*(注：此处由于原文似乎存在逻辑重命名错误，如\
  \ CharArrayWriter 演示中使用了 writeTo，但根据翻译要求保留了代码块不翻译)*\n\n*(由于用户输入中存在大量重复和乱码，我将基于用户提供的待翻译文本进行干净、准确的翻译。)*\n\
  \n[content]\n\n### 9.8.2 Inflater 类\n\n`Inflater` 类使用 ZLIB 压缩库解压数据。\n\n构造函数：\n\n\
  *   `Inflater()`: 创建一个具有默认压缩级别的 `Inflater` 实例。\n\n下面列出了 `Inflater` 类的一些重要方法：\n\n\
  *   `inflate(byte[] buffer)`: 用解压数据填充输出缓冲区，并返回其实际大小。\n*   `inflate(byte[] buffer,\
  \ int offset, int len)`: 从给定的偏移量和字节数用解压数据填充输出缓冲区。\n*   `setInput(byte[] buffer)`:\
  \ 设置缓冲区中用于解压的输入数据。\n*   `setInput(byte[] buffer, int offset, int len)`: 从给定的偏移量到字节数设置缓冲区中用于解压的输入数据。\n\
  *   `end()`: 关闭解压器。\n\n以下代码演示了 `Inflater` 类的用法：\n\n```java\nimport java.util.zip.Deflater;\n\
  import java.util.zip.Inflater;\n\npublic class InflaterDemo {\n    public static\
  \ void main(String[] args) {\n        try {\n            String input = \"Example\
  \ of Inflater\";\n            // 将字符串转换为字节数组\n            byte[] inBuff = input.getBytes(\"\
  UTF-8\");\n            // 压缩字节\n            byte[] outBuff = new byte[100];\n  \
  \          Deflater d1 = new Deflater();\n            d1.setInput(inBuff);\n   \
  \         d1.finish();\n            int len = d1.deflate(outBuff);\n           \
  \ System.out.println(\"Compressed data length:\"+len);\n\n            // 解压字节\n\
  \            Inflater i1 = new Inflater();\n            i1.setInput(outBuff, 0,\
  \ outBuff.length);\n            byte[] inflated = new byte[100];\n            int\
  \ inflateLen = i1.inflate(inflated);\n            i1.end();\n\n            // 将字节转换为字符串\n\
  \            String str = new String(inflated, 0, inflateLen, \"UTF-8\");\n    \
  \        System.out.println(\"Decompressed string is: \" + str);\n        } catch\
  \ (Exception e) {\n            System.out.println(\"Error:\" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n### 9.8.3 DeflaterInputStream 类\n\n`DeflaterInputStream`\
  \ 类从输入流中读取并压缩源数据，使用“deflate”压缩格式。\n\n构造函数：\n\n*   `DeflaterInputStream(InputStream\
  \ in)`: 创建一个具有默认压缩器和缓冲区大小的输入流。\n*   `DeflaterInputStream(InputStream in, Deflater\
  \ defl)`: 创建一个具有默认缓冲区大小和给定压缩器的输入流。\n\n\n\n\n\n*   `DeflaterInputStream(InputStream\
  \ in, Deflater defl, int bufLen)`: 创建具有给定缓冲区大小和压缩器的输入流。\n\n以下是 `DeflaterInputStream`\
  \ 类的一些重要方法：\n\n*   `read()`: 从输入流中读取一个字节的压缩数据。\n*   `read(byte[] buffer, int offset,\
  \ int buffSize)`: 从指定的偏移量和字节数开始，将压缩的数据读取到字节数组中。\n*   `close()`: 在丢弃剩余未解压缩数据后关闭输入流。\n\
  *   `available()`: 在到达文件结束（EOF）后返回 0；否则每次返回 1。\n*   `long skip(long n)`: 从输入流中跳过并丢弃指定的数据。\n\
  \n以下代码演示了 `DeflaterInputStream` 类的用法：\n\n```java\nimport java.io.File;\nimport java.io.FileInputStream;\n\
  import java.io.FileNotFoundException;\nimport java.io.FileOutputStream;\nimport\
  \ java.io.IOException;\nimport java.util.zip.DeflaterInputStream;\n\npublic class\
  \ DeflaterInputStreamDemo {\n\npublic static byte[] expandBuffer(byte[] temp) {\n\
  \    byte[] temp1 = temp;\n    temp = new byte[temp.length + 1];\n    // 备份数据\n\
  \    for (int i = 0; i < temp1.length; i++) {\n        temp[i] = temp1[i];\n   \
  \ }\n    return temp;\n}\n\npublic static void main(String args[]) throws IOException\
  \ {\n    FileOutputStream fos = null;\n    try {\n        // 设置输入流\n        File\
  \ f1 = new File(\"D:/Demos/Read.txt\");\n        FileInputStream fis = new FileInputStream(f1);\n\
  \        DeflaterInputStream dis = new DeflaterInputStream(fis);\n        // 用于存储压缩后数据的字节数组\n\
  \        byte inBuff[] = new byte[0];\n        int index = -1;\n        // 从文件中读取数据\n\
  \        int read = 0;\n        while ((read = dis.read()) != -1) {\n          \
  \  inBuff = expandBuffer(inBuff);\n            inBuff[++index] = (byte) read;\n\
  \        }\n        // 将压缩数据写入文件\n        fos = new FileOutputStream(\"D:/Demos/DeflatedFile.txt\"\
  );\n        fos.write(inBuff, 0, inBuff.length);\n        System.out.println(\"\
  Compressed data written to file.\");\n        fos.close();\n        System.out.println(\"\
  Compressed data size: \" + inBuff.length);\n    } catch (FileNotFoundException e)\
  \ {\n        System.out.println(\"Error: \" + e.getMessage());\n    }\n}\n}\n```\n\
