  \ 文件中添加以下代码：\n```java\nmodule Module1 {\n    exports pkg1;\n}\n```\n模块描述符指示 `Module1`\
  \ 导出 `pkg1` 以供其他模块访问。\n\n11. 同样，在项目中创建带有 `ModClass2` 的 `Module2`，如如下图 12.14 所示：\n\
