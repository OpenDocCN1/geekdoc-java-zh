  \ `requires` 语句来定义它所依赖的所有其他模块列表。此外，为了让其他模块能够访问某个模块的包，使用了 `exports` 关键字。如果对包没有使用\
  \ `exports` 关键字，则默认情况下它会被封装在在该模块内部，如下图所示：\n\n![](img/Figure_1.5.jpg)\n\n图 1.5: 模块依赖关系\n\
  \n注意模块 `mod1` 需要模块 `mod2`。两个模块都包含被封装的包（如盾牌符号所示），因为它们没有被导出。这确保了包中的类不会被意外访问。在程序中，这可以像下面一样描述：\n\
  \n```java\nmodule mod1 {\n    exports com.mod1;\n    requires mod2;\n}\n```\n\n\
  同样，整个 Java 平台通过封装 `JDK` 的内部类实现了模块化，从而使其更加安全和灵活。与 JAR 不同，`JVM` 会验证通过 `requires` 语句指定的所有依赖模块的存在。这避免了在执行过程中由于缺失\
  \ JAR 而导致的意外错误和代码崩溃。\n\n*   **链接 (Linking)**：你可以通过仅添加执行应用程序所需的模块来创建一个最小的运行时环境。这可以通过\
  \ Java 9 提供的新工具 `jlink` 来。模块化的 `JDK` 和包含其中提到的显式依赖的模块描述文件使得创建这样的最小运行时环境成为可能。因此，你可以创建一个最小化且优化的运行时环境，并避免庞大的\
  \ JDK 安装。\n*   **JShell**：`JShell` 是 JDK 9 中一个新的读取-评估-打印循环（REPL）交互式终端。你可以从控制台启动\
  \ `jshell` 并直接从中输入和执行 Java 代码。当执行代码时，它会提供即时反馈，允许尝试和探索新的 API 和语言特性。你还可以使用交互式 shell\
  \ 在 Java 中测试正则表达式。\n*   **增强 Javadoc (Enhanced Javadoc)**：`Javadoc` 现在为 API 文档提供了内置搜索功能。此外，新的\
  \ `Javadoc` 符合 HTML5 标准，每个页面都包含了类或接口所属的 `JDK` 模块信息。\n*   **集合工厂方法 (Collection Factory\
  \ Methods)**：Java SE 9 引入了一项新功能，为如 `List`、`Set` 等集合提供了工厂方法。这有助于开发者通过单条语句快速填充集合，而不是使用多次\
  \ `add` 调用。例如，\n\n    ```java\n    Set<Integer> set1 = Set.of(3,4,5);\n    ```\n\
  \n    这些集合是不可变的，也就是说，在创建后无法向这些集合中添加项，否则将将抛出 `UnsupportedOperationException` 异常。使用工厂方法使得代码更短，并避免了特定集合类型实现部分的细节。\n\
  *   **Stream API 增强 (Enhancements in Stream API)**：Java SE 9 为 `Streams` API 增加了更多功能，允许对集合进行声明式的转换流水线处理。它在\
  \ `Stream` 接口中添加了新方法，即 `dropWhile`、`takeWhile`、`ofNullable`，并提供了 `iterate` 方法的重载版本以提供一个停止迭代的表达式。如下所示：\n\
  \n    ```java\n    IntStream.iterate(1, num -> num < 10, num -> num + 1).forEach(System.out::println);\n\
  \    ```\n\n    第二个参数中的 lambda 表达式一直返回 true，直到 `num` 变为 100，并打印从 1 到 99 的整数。\n\n\
  \    此外，可以将 `Optional` 对象转换为 `Stream` 对象。\n\n    ```java\n    Stream<Integer> num\
  \ = Optional.of(1).stream();\n    ```\n*   **私有接口方法 (Private interface methods)**：Java\
  \ SE 8 引入了接口默认方法的概念。但当时接口只允许不带任何实现的方法签名。在 Java SE 9 中，接口也可以具有带有行为的方法以及私有辅助方法，用于实现可以从多个默认方法中调用的共享代码。下面的代码解释了这一点：\n\
  \n    ```java\n    public interface Interface1 {\n        void interfaceMethodWithOnlySignature();\n\
  \        default void interfaceDefaultMethod() { initProcess(); }\n        default\
  \ void interfaceDefaultMethod1() { initProcess(); }\n        // 不属于 Interface1 暴露的公共\
  \ API 的私有方法\n        private void initProcess() {\n            System.out.println(\"\
  Initializing the Process\");\n        }\n    }\n    ```\n\n    因此，私有接口方法可以帮助使用默认方法构建\
  \ API 的实现。\n*   **HTTP/2**：Java 9 引入了使用 `HTTPClient` API 执行 HTTP 调用的新方式，以取代旧的 `HttpURLConnection`\
  \ API，该 API 也支持 `WebSockets` 和 `HTTP/2`：\n\n    ```java\n    HttpClient client =\
  \ HttpClient.newHttpClient();\n    ```\n*   **多版本 JAR (Multi-release JARs)**：Java\
  \ SE 9 引入了多版本 JAR 功能，作为解决为了后兼容而保留的弃用库导致 JAR 体巨大的解决方案。此功能允许创建类的替代版本，这些版本只有当库运行在特定版本的\
  \ Java 上才会使用。\n\n    下面的图片解释了这一点：\n\n    ![](img/Figure_1.6.jpg)\n\n    图 1.6: 多版本\
  \ JAR\n\n    图片显示了一个 `multirelease.jar` 文件，顶层有一个 `Helper` 类，以及针对 Java 9 的特定版本。这表明在运行\
