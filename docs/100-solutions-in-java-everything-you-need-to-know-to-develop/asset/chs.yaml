  \n同样，可以创建更多接口并在类中实现。\n\n### 5.4.2 接口的默认、静态和私有方法\n\n接口设计一直是一个挑战，因为对接口的任何修改/添加都需要更改所有实现类。随着应用程序的增长，实现接口的类数量也会增加，这使得在不影响许多类的情况下难以修改/扩展接口的功能。以前使用的变通方法是创建一个实现类，然后对其进行扩展，并在其他类中根据需要重写其方法。\n\
  \n在 Java SE 7 及之前的版本中，接口只有两种类型的成员：\n\n*   静态常量变量\n*   抽象方法\n\n为了同时使用抽象方法和非抽象/具体方法（带有实现的方法），抽象类是唯一的选择。随着\
  \ Java 8，Oracle 公司引入了默认方法和静态方法功能，允许在接口中具有实现的方法。\n\n\n\n\n\n默认方法（default methods）或防御方法允许向接口中添加新方法，而不影响接口现有的实现。这些默认方法包含方法定义，当实现方法的具体类未能为该方法提供实现时，该定义将作为默认实现使用。默认方法带有一个默认实现，可以被使用、重写或忽略，且不会对已实现接口的现有类造成任何问题。\n\
  \nJava 接口静态方法（static methods）用于为常用活动（如空检查、集合排序等）创建实用方法。它们还通过防止实现类重写这些方法来帮助保护代码。如下所示，使用\
  \ `default` 关键字在接口中创建默认方法。\n\n接下来的示例展示了接口中 `default` 和 `static` 方法的使用：\n\n```java\n\
  public interface ILog {\n    String MYSQL_DB_NAME = \"MySQLDb\";\n    // 抽象方法\n\
  \    void logMsg(String message);\n\n    // 默认方法\n    default void logWarning(String\
  \ message) {\n        System.out.println(\"Logging Warning: \" + message);\n   \
  \     // Connect to Database\n        // Log Warning\n        // Close Database\
  \ connection\n    }\n\n    default void logFatalError(String message) {\n      \
  \  System.out.println(\"Logging Fatal Error: \" + message);\n        // Connect\
  \ to Database\n        // Log Fatal Error\n        // Close Databse connection\n\
  \    }\n\n    // 静态方法\n    static boolean checkNull(String str) {\n        System.out.println(\"\
  Interface Check for Null\");\n        return str == null;\n    }\n}\n```\n\n`ILog`\
  \ 接口声明了一个抽象方法、两个默认方法和一个静态方法：\n\n```java\npublic class DBTransaction implements ILog\
  \ {\n    @Override\n    public void logMsg(String message) {\n        System.out.println(message);\n\
  \    }\n\n    public static void main(String[] args) {\n        System.out.println(\"\
  Connecting to: \" + ILog.MYSQL_DB_NAME);\n        DBTransaction obj = new DBTransaction();\n\
  \        obj.logMsg(\"Database Connected Successfully\");\n        obj.logFatalError(\"\
  Fatal Error while closing DB\");\n        System.out.println(\"Null check: \" +\
  \ ILog.checkNull(\"Hello\"));\n    }\n}\n```\n\n`DBTransaction` 类实现了 `ILog` 接口并重写了\
  \ `logMsg` 方法。注意，它并没有实现默认方法，而且静态方法无论如何都无法重写。因此，接口现在具有灵活性允许类无需实现接口的所有方法。\n\n`main()`\
  \ 方法创建了该类的对象，并调用了重写版本的 `logMsg` 方法以及默认方法 `logFatalError()`。它还通过直接使用 `ILog` 接口名称来访问常量变量和静态方法。代码的输出所示：\n\
  \n![](img/Figure_5.11.jpg)\n\n图 5.11：接口中的默认方法和静态方法\n\n在代码中，请注意所有 `log` 方法中为了建立连接和关闭数据库连接时创建的冗余代码。如果使用一个公共方法进行数据库连接，就可以解决这个问题，但那将是一个所有其他类都可以访问的\
  \ `public` 方法。要创建一个可重用的方法并将其设为 `private`，唯一的选择是使用带有带有处理公共代码的 `private` 方法的抽象类。\n\
  \nJava 9 通过在接口中引入 `private` 方法解决了这个问题。从 Java 9 开始，接口可以使用 `private` 访问修饰符拥有 `private`\
  \ 方法。在 Java 9 及更高版本中，接口可以拥有以下类型的成员：\n\n*   静态常量变量\n*   抽象方法\n*   默认方法\n*   静态方法\n\
  *   私有方法\n*   私有静态方法\n\n现在，`ILog` 接口的代码可以针对重用性进行优化，如下所示：\n\n```java\npublic interface\
  \ ILog {\n    String MYSQL_DB_NAME = \"MySQLDb\";\n\n    // 抽象方法\n    default void\
  \ logMsg(String message) {\n        System.out.println(\"Logging Information: \"\
  \ + message);\n        logData(message, \"Information\");\n    }\n\n    // 默认方法\n\
  \    default void logWarning(String message) {\n        System.out.println(\"Logging\
  \ Warning: \" + message);\n        logData(message, \"Warning\");\n    }\n\n   \
  \ default void logFatalError(String message) {\n        System.out.println(\"Logging\
  \ Fatal Error: \" + message);\n        logData(message, \"Fatal Error\");\n    }\n\
  \n    private void logData(String message, String type) {\n        // Connect to\
  \ Database\n        // Log Message\n        // Close Database connection\n    }\n\
  \n    // 静态方法示例\n    static boolean checkNull(String str) {\n        System.out.println(\"\
  Interface Check for Null\");\n        return str == null;\n    }\n}\n```\n\n使用 `private`\
  \ 方法 `logData()` 允许在其他日志方法中重用，并防止实现类直接访问。使用 `private` 方法有助于使默认方法变得不再臃肿且更易维护。\n\n\
  ### 5.4.3 默认方法的问题\n\n一个类可以实现多个接口，每个接口可以有不同的默认方法。然而，如果每个接口包含相同名称和签名的默认方法，代码将无法编译并引发以下错误：\n\
  \n`java: class ClassWithTwoInterfaces inherits unrelated defaults for defaultMethod()\
  \ from types Interface1 and Interface2`\n\n这是因为编译器无法确定应该使用哪一个默认方法。要解决这个问题，类可以提供默认方法的实现，以重写接口的默认方法版本。将使用重写后的版本，从而消除产生结果的歧义。\n\
  \n此外，类可以重写接口的默认方法，并使用 `super` 关键字调用原始的默认方法。但是，由于多个接口中相同名称导致的歧义，需要在调用 `super` 之前加上接口名称。即使只实现了一个接口，由于类可能也继承另一个类，这一点仍然适用。\n\
  \n例如：\n\n```java\npublic class ClassWithTwoInterfaces implements Interface1, Interface2\
  \ {\n    @Override public void abstractMethod() { // 某些实现 }\n\n    @Override public\
  \ void defaultMethod() {\n        // 调用接口的 defaultMethod\n        Interface1.super.defaultMethod();\n\
  \        Interface2.super.defaultMethod();\n    }\n}\n```\n\n现在，接口可以扩展另一个接口。如果两者都包含同名的默认方法，编译器将考虑继承树中子接口的实现。\n\
  \n例如：\n\n```java\npublic interface Interface1 {\n    default void defaultMethod()\
  \ {\n        System.out.println(\"Hello from parent Interface1\");\n    }\n}\n\n\
  public interface IChildInterface extends Interface1 {\n    default void defaultMethod()\
  \ {\n        System.out.println(\"Hello from the IChildInterface\");\n    }\n}\n\
  ```\n\n在这里，父接口和子接口都有相同的默认方法。当类实现子接口时，调用 `defaultMethod()` 将产生以下输出：\n\nHello from\
  \ the IChildInterface\n\n这意味着编译器调用了子接口的 `defaultMethod`。\n\n## 5.5 Java 函数式接口\n\n\
  一个只有一个抽象方法的接口被称为函数式接口（Functional Interface）。`@FunctionalInterface` 注解已被引入 Java 用于标记接口为函数式接口。虽然不是强制该注解，但作为最佳实践有助于避免意外添加额外的方法。如果带有\
  \ `@FunctionalInterface` 注解的接口添加了多个抽象方法，它将抛出编译错误。\n\n函数式接口最重要的优势是可以使用 Lambda 表达式来实例化它们，从而避免臃肿的匿名类实现。\n\
  \n\n\n\nJava 8 Collections API 经过重写，并添加了新的 `Stream` API，该 API 使用许多函数接口。新增了一个名为 `java.util.function`\
  \ 的新包，其中包含几个函数接口，为 lambda 表达式和方法引用提供目标类型。一些实用的 Java 8 函数接口包括 `Consumer`、`Supplier`、`Function`\
  \ 和 `Predicate`。`java.lang.Runnable` 是一个具有单个抽象方法 `run()` 的函数接口佳示例。\n\n函数接口也被称为单抽象方法（SAM）接口。它有助于实现函数式编程方法。函数接口的规则如下：\n\
  \n-   函数接口只能声明一个抽象方法。\n-   函数接口可以有任意数量的默认方法（default）和静态方法（static）。\n-   函数接口可以声明\
  \ `Object` 类的方法。\n-   只有当该接口没有任何抽象方法时，函数接口才能扩展另一个接口。\n\n下面的示例展示了函数接口的使用：\n\n```java\n\
  @FunctionalInterface\npublic interface IPrintable {\n    // 只有一个抽象方法\n    void printMsg(String\
  \ msg);\n\n    // 函数接口可以包含\n    // 任意数量的 Object 类方法。\n    int hashCode();\n    String\
  \ toString();\n    boolean equals(Object obj);\n\n    default void displayData(){\n\
  \        System.out.println(\"Hello!! This is a default method\");\n    }\n}\n```\n\
  \n函数接口 `IPrintable` 只有一个抽象方法，但具有几个隐式继承自 `Object` 类的方法。它 true 一个默认方法，并且还可以添加更多。\n\
  \n```java\npublic class Messages implements IPrintable {\n    @Override\n    public\
  \ void printMsg(String msg) {\n        System.out.println(\"Received Message: \"\
  \ + msg);\n    }\n\n    public static void main(String[] args) {\n        Messages\
  \ obj = new Messages();\n        obj.printMsg(\"Good Morning\");\n    }\n}\n```\n\
  \n`Messages` 类实现了函数接口 `IPrintable` 并重写了它的 `printMsg()` 方法。代码的输出所示：\n\n```\nReceived\
  \ Message: Good Morning\n```\n\n下面的示例演示了一个无效的函数接口：\n\n```java\ninterface IParent{\
  \ // 抽象方法\n    public void display(String msg);\n} \n\n@FunctionalInterface \ninterface\
  \ IChild extends IParent{ \n    public void displayIt();\n}\n```\n\n代码生成了编译错误，因为函数接口\
  \ `IChild` 扩展了一个带有抽象方法的接口。编译错误所示：\n\n![](img/Figure_5.12.jpg)\n\n图 5.12: 编译错误\n\n\
  下面的示例演示了一个有效的函数接口，因为它扩展了一个非函数式接口：\n\n```java\ninterface IParent{\n    // 默认方法\n\
  \    default void display(String msg){\n        System.out.println(\"Default method\
  \ of parent interface\");\n    }\n}\n\n@FunctionalInterface\ninterface IChild extends\
  \ IParent{\n    // 子接口的抽象方法\n    public void displayIt();\n}\n\npublic class TestFunctionalInterface\
  \ implements IChild{\n    @Override\n    public void displayIt(){\n        System.out.println(\"\
  Overridden method of child interface\");\n    }\n\n    public static void main(String[]\
  \ args) {\n        TestFunctionalInterface obj = new TestFunctionalInterface();\n\
  \        obj.displayIt();\n        obj.display();\n    }\n}\n```\n\n代码的输出所示：\n\n\
  ```\nOverridden method of child interface\nDefault method of parent interface\n\
  ```\n\n## 5.6 Lambda 表达式\n\nJava 是一种面向对象的编程语言，Java 中的一切只能存在于类中，并通过其对象进行访问。这同样适用于函数。一些函数式语言如\
  \ `JavaScript`、`C++` 等允许编写函数并在需要时使用。某些语言同时支持函数式编程和面向对象编程。\n\n面向对象编程是理想的，但会导致程序出现大量冗余。例如，为了创建\
  \ `Runnable` 类的实例，通常会使用如下所示的匿名类：\n\n```java\nRunnable r = new Runnable(){\n    @Override\n\
  \    public void run() {\n        System.out.println(\"This is Runnable\");\n  \
  \  }\n};\n```\n\n在上面的代码中，唯一有用的部分是 `run()` 方法的代码。其余代码仅仅是因为 Java 的编程规则。通过 Java 8 函数接口和\
  \ Lambda 表达式，可以通过移除不必要的代码语句使代码变得更短、更简洁。\n\nLambda 表达式在 `Java SE 8` 中被引入以引入函数式编程。Lambda\
  \ 表达式是一个不属于任何类的函数，它可以作为对象传递，或在需要时执行。Lambda 表达式有助于在面向对象的 Java 编程世界中直观化函数式编程。Lambda\
  \ 表达式的常见用法是回调/事件监听器或 `Streams` API 的实现。由于函数接口只有一个抽象方法，Lambda 表达式还有助于在实现函数接口时减少冗余代码。通过\
  \ Lambda 表达式，功能可以被视为方法参数或作为数据代码。\n\n### 语法\n\n`<argument> -> <body>` `\n\n例如：\n\n\
  ```java\nRunnable r1 = () -> System.out.println(\"This is Runnable\");\n```\n\n\
  在这里，`runnable` 是一个只有一个方法 `run()` 的函数接口，因此可以使用 lambda 表达式创建其实例，而不是使用臃肿的匿名类。由于 `run()`\
  \ 方法不接受任何参数，lambda 表达式也不包含任何参数。\n\n注意，如果只有一个语句需要处理，可以避免大括号 `{}`，但对于多个语句，大括号是强制性的，就像\
  \ `if-else` 块一样。\n\n### Lambda 表达式的优点：\n\n- **减少代码量**：使用 lambda 表达式代替匿名类。\n- **顺序并行支持**：从\
  \ `Stream` API 获得顺序并行操作支持。\n- **方法传递行为**：允许将功能作为参数传递。\n\n### Lambda 表达式示例\n\n下表描绘了一些\
  \ lambda 表达式及其描述：\n\n| Lambda 表达式 | 描述 |\n| :--- | :--- |\n| `() -> {}` | 无参数，空体，返回\
  \ void。 |\n| `() -> 42` | 无参数，表达式体，返回 void。 |\n| `() -> { return 42; }` | 无参数，块体，返回\
  \ void。 |\n| `() -> { System.gc(); }` | 无参数和 void 块体。 |\n| `() -> {if (true) return\
  \ 5;else {int val = 10;for (int i = 1; i <5; i++)val *= i;return val;}}` | 无参数和带有返回值的块体。\
  \ |\n| `(int x) -> x+1` | 声明类型的单个参数。 |\n| `(int x) -> { return x+1; }` | 声明类型的单个参数和块体。\
  \ |\n| `(String str) -> str.length()` | 声明类型的单个参数。 |\n| `x -> x+1` | 推断类型参数，括号可选。\
  \ |\n| `str -> str.length()` | 推断类型参数，括号可选。 |\n| `(int x, int y) -> x+y` | 多个声明类型参数。\n\
  | `(x,y) -> x+y` | 多个推断类型参数。 |\n| `(x, final y) -> x+y` | 非法：不能修改推断类型的参数。 |\n| `(x,\
  \ int y) -> x+y` | 非法：不能混合推断类型和声明类型。 |\n\n\n\n\n\n| 注：函数接口方法也可以使用大括号 {} 来实现，如下所示：\
  \ |\n\n```java\nIPrintable obj = (String msg) -> {\n    System.out.println(msg);\n\
  };\n\nobj.printMsg(\"Hello\");\n```\n\n| 注：但是，由于方法中只有一条语句，代码中已经避免了大括号 {}。 |\n\n\
  ## 方法引用和构造函数引用\n\n方法引用用于引用一个方法而不实际调用它。同样，构造函数引用用于引用一个构造函数而不创建其类型的新实例。双冒号（`::`）运算符在\
  \ `Java SE 8` 中被引入，用于方法引用以作为 Lambda 表达式的替代。\n\n例如：\n\n### 方法引用\n- `System::getProperty`\n\
  - `System.out::println`\n- `\"hello\"::length`\n\n### 构造函数引用\n- `ArrayList::new`\n\
  - `int[]::new`\n\n为了替换 Lambda 表达式，可以使用双冒号（`::`）运算符，在实现函数接口方法的所有情况下，这都是一个非常方便的快捷方式。可以通过以下方式实现：\n\
  \n- 在新类中定义一个签名与函数接口抽象方法相似的方法，并根据需要提供方法体。注意，签名应该是相同的，但方法名可以更改。\n- 使用以下语法，将实现函数接口方法的\
  \ Lambda 表达式替换为之前类中定义的方法的引用。\n\n**语法：**\n- 如果类方法是静态的，使用 `<class-name>::<method-name>`\n\
  - 如果类方法是非静态的，使用 `<instance-variable-name>::<method-name>`\n\n以下示例展示了如何使用双冒号（`::`）运算符引用一个方法而不实际调用它：\n\
  \n```java\npublic class LambdaExpDemo {\n    public static void main(String[] args)\
  \ {\n        IPrintable obj = (String msg) -> System.out.println(msg);\n       \
  \ obj.printMsg(\"Invoking printMsg of IPrintable interface\");\n        IPrintable\
  \ obj1 = LambdaExpDemo::displayMsg;\n        obj1.printMsg(\"Invoking displayMsg\
  \ of LambdaExpDemo class\");\n    }\n\n    static void displayMsg(String msg){\n\
  \        System.out.println(msg);\n    }\n}\n```\n\n`IPrintable` 是一个通过 Lambda 表达式实现的函数接口，并创建了一个实例\
  \ `obj` 来调用 `printMsg()` 方法。在代码中，创建了一个名为 `displayMsg()` 方法，其签名与 `IPrintable` 接口的\
  \ `printMsg()` 方法相同。接下来，创建 `IPrintable` 的实例 `obj2` 并使用类名 `LambdaExpDemo` 引用 `displayMsg()`\
  \ 方法。Java 编译器将参数映射到被调的方法。代码的输出所示：\n\n```\nInvoking printMsg of IPrintable interface\n\
  Invoking displayMsg of LambdaExpDemo class\n```\n\n## 总结\n\n在本章中，你学习了 Java 提供了继承概念将具有相似特征的类分组并创建类层次。在单继承中，子类只能继承一个父类/超类。要在\
  \ Java 中实现继承，通过 `extends` 关键字在两个或多个类之间创建父子关系。方法重写是一个允许创建一个与父类相同签名和返回类型的子类方法的概念。抽象类声明方法作为契约或标准，仅提供结构，而将实现留给继承类。定义在另一个类内部的类被称为嵌套类。匿名类是没有名称定义的类。接口是一种合同，为实现它的类型设置了必须遵循的标准。Java\
  \ 允许在类中实现多个接口。Lambda 表达式在 `Java SE 8` 中被加入以引入函数式编程。双冒号（`::`）运算符在 `Java SE 8` 中引入，用于方法引用以作为\
  \ Lambda 表达式的替代。\n\n在下一章，你将学习异常和正则表达式。\n\n## 单选题\n\n1. Java 不支持类的类的 _______ 继承。\n\
  \    1. 单继承\n    2. 多继承\n    3. 多级继承\n    4. 层级继承\n\n2. 考虑以下部分代码。\n   ```java\n\
  \   Employee emp = new PartTimeEmployee(\"Emp1\", \"Mark Stevens\");\n   ```\n \
  \  [假设：Employee 是超类，PartTimeEmployee 是子类]\n   代码中描述的是哪种绑定？\n    1. 静态\n    2. 动态\n\
  \    3. 都有\n    4. 以上都不是\n\n3. `Java 10` 的 Java 接口中支持以下哪种类型的方法？\n    1. 抽象 (Abstract)\n\
  \    2. 默认 (Default)\n    3. 静态 (Static)\n    4. 以上所有\n\n4. 关于函数接口的以下陈述哪句是？\n  \
  \  1. 函数接口只能声明一个抽象方法。\n    2. 函数接口可以有一个默认方法或一个静态方法。\n    3. 函数接口可以声明 Object 类的方法。\n\
  \    4. 只有当接口没有任何抽象方法时，函数接口才能扩展另一个接口。\n\n5. 匹配连线。\n   | | Lambda 表达式 | | 描述 |\n\
  \   | :--- | :--- | :--- | :--- |\n   | a. | `() -> {}` | 1. | 非：不能混合推断类型和声明类型。\
  \ |\n   | b. | `() -> { return 42; }` | 2. | 无参数，空方法体，void 返回。 |\n   | c. | `(int\
  \ x, int y) -> x+y` | 3. | 无参数，带返回值的块状方法体。 |\n   | d. | `(x, int y) -> x+y` | 4.\
  \ | 多参数声明。 |\n   1. a-2, b-3, c-4, d-1\n   2. a-3, b-4, c-1, d-2\n   3. a-4, b-1,\
  \ c-2, d-3\n   4. a-2, b-4, c-1, d-2\n\n## 答案\n1. b\n2. b\n3. d\n4. b\n5. a\n\n\
  ## 作业\n\n创建一个符合以下规格的 Java 程序：\n1. 创建名为 `Employee` 的类，带有 `id`、`name` 和 `salary` 变量并在构造函数中初始化它们。\n\
  2. 创建名为 `displayDetails()` 的方法打印这些变量的值。\n3. 创建名为 `ICalculateCommission` 的函数接口，包含一个名为\
  \ `calcCommission()` 的抽象方法，其接受一个名为 `sales` 的 float 参数并返回一个 float 值。\n4. 创建名为 `PartTimeEmployee`\
  \ 的类继承自 `Employee` 类。\n5. 声明变量 `shift` (String) 和 `sales` (float)。\n6. 创建一个接受 Employee\
  \ 类所有值以及 `shift` 和 `sales` 的构造函数。\n7. 从子类构造函数将必要值传递给父类构造函数。还要初始化 `shift` 和 `sales`\
  \ 变量。[提示：使用 super() 方法]\n8. 重写 `displayDetails()` 方法并调用父类的 `displayDetails()` 方法。还要打印\
  \ `shift` 和 `sales` 变量的值。[提示：使用 super 关键字]\n9. 在 `main` 方法中，从用户处接受 `id`、`name`、`salary`、`shift`\
  \ 和 `sales` 的输入并存储在局部变量中。[提示：使用 Scanner 类]\n10. 实例化 PartTimeEmployee 对象并将参数传递给构造函数。\n\
  11. 调用 `displayDetails()` 方法。\n12. 使用 Lambda 表达式实现函数接口 `ICalculateCommission`。\n\
  13. 在其抽象方法的实现中，根据 `sales` 的值计算佣金。如果 `sales>5000`，则佣金为 `sales` 的 20%，否则为 `sales`\
  \ 的 5%。然后返回佣金值。\n14. 调用 `calcCommission()` 方法并将从用户处接收的 `sales` 值传递给该方法。\n15. 打印由\
  \ `calcCommission()` 方法返回的佣金值。\n\n\n\n\n\n在本章中，你将学习如何使用不同的内置 `Exception` 类来处理 Java\
  \ 异常。你还将学习如何创建自定义异常以及使用断言（assertions）。此外，你将学习使用 `java.lang` 和 `java.util.regex`\
  \ 包中的重要类。\n\n## 结构\n\n在本章中，我们将学习以下主题：\n\n* Java 中的异常\n* Java 中的异常类\n* Java 中的异常处理\n\
  * 使用 `try-with-resources` 语句\n* 自定义异常\n* 包装异常（Wrapper exceptions）\n* Java 中的断言\n\
  * `java.lang` 包类\n* 正则表达式\n* 字符类\n\n## 目标\n\n在本章中，你将学习在 Java 中执行异常处理并理解内置的异常类。你将创建自定义异常并在\
  \ Java 中使用断言。此外，你将学习 `java.lang` 包并处理正则表达式。\n\n## 6.1 Java 中的异常\n\n程序中发生的任何中断其正常执行的异常或意外事件都被称为“异常”。异常可能有不同的类型和原因，例如：尝试打开一个不存在的文件、向方法传递了无效数据、网络连接错误或内存溢出错误。有关错误的信息存储在传递给运行时（runtime）的异常对象中。\n\
  \n方法中发生的异常可以通过使用发生异常类型的异常对象来抛出。运行时会查找该方法中是否存在可以处理该异常的处理器代码。如果没有找到处理器，它将搜索整个方法调用堆栈以找到合适的异常处理器。如果运行时整个调用堆栈中未找到处理器，它最终将终止程序。\n\
  \n| 注意：在另一个或多个方法内部调用方法的顺序被称为调用堆栈（call stack）。堆栈跟踪（stack trace）显示了导致异常的方法调用顺序。 |\n\
  \n例如，考虑以下部分代码：\n\n```java\npublic void methodOne(){\n    methodTwo();\n}\n\npublic\
  \ void methodTwo(){\n    methodThree();\n}\n\npublic void methodThree(){\n    //\
  \ 引起异常的代码\n}\n```\n\n如代码所示所示，`methodOne` 调用了 `methodTwo`，`methodTwo` 又调用了 `methodThree`。在这里，`methodThree`\
  \ 拥有引起异常的代码但没有任何处理器。因此，运行时将在 `methodTwo` 中然后在 `methodOne` 中查找处理器。由于没有任何一个方法拥有处理器，程序将终止。\n\
  \n如果找到了处理器，异常将被传递给可以处理它的处理器。注意，合适的处理器是指能够处理或捕获与方法抛出的相同类型异常的处理器。\n\n异常处理器的优点：\n\n\
  * 有助于将正常代码与错误处理代码分离。\n* 在方法调用堆栈的任何地方处理错误。\n* 对相似的错误类型进行分类以便通用处理器。例如，`java.io` 包中的\
  \ `IOException` 类可以处理大多数 I/O 异常。对于更具体的异常，使用的是 `IOException` 类的后类。\n\n### 6.1.1 异常的类型\n\
  \nJava 异常可能由多种原因引起，例如用户错误、逻辑错误或某些系统资源的系统性错误。因此，异常可以大致分类如下：\n\n* 编译异常（Checked exceptions）\n\
  * 运行时非检查异常（Unchecked exceptions）\n\n让我们详细查看它们。\n\n### 编译异常\n\n编译异常在程序中是可以预期的，并且提供了适当的处理器。例如，假设提示用户输入一个数字，但用户指定了一个字符串，这会导致\
  \ `java.lang.NumberFormatException`。然而，这不会致命性地影响程序，因为程序会有代码来处理此异常，并通过适当的消息通知用户。在\
  \ Java 中，除 `Error` 和 `RuntimeException` 之外，所有异常都是编译异常。\n\n下面列出了一些编译异常：\n\n* `InstantiationException`：当尝试创建抽象类的实例时发生发生。\n\
  * `InterruptedException`：当线程被中断时发生。\n* `NoSuchMethodException`：当运行时无法解析要调用哪个方法时发生。\n\
  \n### 运行时非检查异常\n\n错误和运行时异常共同形成了非检查异常：\n\n* `Errors`：错误不是由应用程序引发，而是由外部引发。例如，如果运行时由于某些硬件/系统问题无法打开系统上存在的文件，则抛出\
  \ `java.io.IOError`。错误类在 `Error` 类层次结构中提供。应用程序可以捕获此异常，也可以让程序打印堆栈跟踪并退出。\n* `Runtime\
  \ exceptions`：运行时异常是由应用程序内部引起的，但并非预期的，例如逻辑错误或对 API 的不当使用。因此，应用程序没有任何方法从此类异常中恢复。例如，用户传递了正确的值作为方法参数，但由于某些逻辑问题传递了\
  \ `null`，导致了异常。应用程序可以处理此异常，也可以消除导致异常的错误。运行时异常类由 `RuntimeException` 类层次结构提供。\n\n\
  下面列出了一些常见的非检查异常：\n\n* `ArithmeticException`：当算术表达式中出现错误时发生，例如除以零。\n* `ArrayIndexOutOfBoundsException`：当尝试访问小于\
  \ 0 或大于数组大小的索引时发生。\n* `IllegalArgumentException`：当向方法传递非法参数时发生。\n* `NegativeArraySizeException`：当数组大小小于\
  \ 0 时发生。\n* `NullPointerException`：当尝试访问空对象成员时发生。\n* `NumberFormatException`：当尝试将字符串转换为数字时发生。\n\
  * `StringIndexOutOfBoundsException`：当索引为负或大于字符串大时发生。\n\nJava 中任何类的基类都是 `Object`\
  \ 类，而对于所有异常类，`Throwable` 类都是基类。`Throwable` 类是 `Object` 类的子类。`Throwable` 类的直接子类是\
  \ `Exception` 类和 `Error` 类。\n\n下图显示了 `Throwable` 类层次结构：\n\n![](img/Figure_6.1.png)\n\
  \n图 6.1：Throwable 类层次结构\n\n\n\n\n\n*   `public String toString()`: 如果 `Throwable`\
  \ 对象是用一个非空的消息字符串创建的，则返回 `getMessage()` 方法的结果，并拼接上异常类的名称。如果 `Throwable` 对象是用空消息字符串创建的，则返回异常对象的实际类名。\n\
  *   `public void printStackTrace()`: 将方法 `toString()` 的执行结果以及堆栈跟踪信息打印到错误输出流（即 `System.err`）。\n\
  *   `public StackTraceElement[] getStackTrace()`: 返回一个数组，其中每个元素都包含方法调用堆栈跟踪的一个帧，索引\
  \ 0 是位于调用堆栈顶部的方法，最后一个元素是调用堆栈底部的方法。\n*   `public Throwable fillInStackTrace()`: 用当前的堆栈跟踪填充此\
  \ `Throwable` 对象的堆栈跟踪，并将其添加到堆栈跟踪中之前的任何信息中。\n\n`Exception` 类有多个子类，分别表示不同类型的异常，例如\
  \ `ClassNotFoundException`、`IllegalAccessException` 等。`Exception` 类的子类 `RuntimeException`\
  \ 进一步包含了子类，用于表示由于不当使用 API 而发生的异常。例如，当向方法传递错误的参数时，会发生 `IllegalArgumentException`。\n\
  \n## 6.3 Java 中的异常处理\n\n方法/构造函数可能抛出的受检异常必须在 `throws` 子句中声明。然而，对于运行时异常，编译器并没有强制要求，因为程序的任何地方都可能发生多个运行时异常，而且在每个方法中添加处理它们的代码会影响代码的清晰度。\n\
  \n例如，如果一个方法在执行前期望三个参数，与其抛出 `RuntimeException`，不如在调用方法之前检查参数。因此，如果可以从异常中恢复，可以将其变为受检异常，否则可以设为非检异常。\n\
  \n为了给任何可能导致错误的代码创建异常处理器，使用了 `try-catch` 块。\n\n### 语法：\n\n```\ntry{\n// 可能抛出异常的语句\n\
  // statement 1\n// statement 2\n}\ncatch(<exception-type> <object-name>){\n// 处理异常\n\
  }\n```\n\n可能抛出异常的语句包含在 `try` 块中。为了处理异常，提供了相应的 `catch` 块，并将异常类型对象作为参数。`catch` 块可以位于同一个方法中，也可以位于方法调用堆栈的任何更高位置。\n\
  \n为了处理多种类型的异常，一个 `try` 块后面可以跟多个 `catch` 块，每个对应每种特定的异常类型。\n\n### 语法：\n\n```\ntry\n\
  {…}\ncatch (<exception-type1> <object-name>)\n{…}\ncatch (<exception-type2> <object-name>)\n\
  {…}\n```\n\n为了确保即使发生异常，某些重要语句也能执行，Java 提供了 `finally` 块。无论是否发生异常，`finally` 块总是会被执行的。它主要用于执行清理代码，如关闭数据库连接、文件流等，以避免资源泄漏。\n\
  \n在以下情况下，`finally` 块可能不会执行：\n*   如果在执行 `try` 或 `catch` 块时 JVM 输出了。\n*   如果执行 `try`\
  \ 或 `catch` 块的线程被中断或杀死。\n\n### 语法：\n\n```\ntry{\n// 可能抛出异常的语句\n// statement 1\n\
  // statement 2\n}\ncatch(<exception-type> <object-name>){\n// 处理异常\n}\nfinally{\n\
  // 清理代码\n}\n```\n\n下面的示例展示了使用 `try-catch-finally` 块处理 Java 异常：\n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class Calculator {\n    public static void main(String[]\
  \ args) {\n        Scanner s = new Scanner(System.in);\n        System.out.println(\"\
  Enter first number\");\n        int num1 = s.nextInt();\n        System.out.println(\"\
  Enter second number\");\n        int num2 = s.nextInt();\n        Calculator obj\
  \ = new Calculator();\n        obj.calculate(num1, num2);\n    }\n\n    public void\
  \ calculate(int a, int b){\n        try{\n            int c = a / b; // line 1\n\
  \            System.out.println(\"Division of \"+a+\" and \"+b+\" is \"+c);\n  \
  \          int arr[] = new int[c];\n            for(int i=0;i<=arr.length;i++){\
  \ // line 2\n                arr[i]=i+1;\n            }\n        } catch(ArithmeticException\
  \ e){\n            System.out.println(\"Exception occurred: \"+e.getMessage());\n\
  \        }catch(ArrayIndexOutOfBoundsException e){\n            System.out.println(\"\
  Exception occurred: \"+e);\n        }finally{\n            System.out.println(\"\
  ----------------------\");\n            System.out.println(\"All resources closed\"\
  );\n        }\n    }\n}\n```\n\n\n\n\nJava SE 7 引入了单一 catch 块的概念，用于处理多个异常。当需要对多个异常显示相同或通用的消息时，它有助于避免代码重复。要为多个异常创建一个单一\
  \ catch 块，请指定用竖线（`|`）分隔的异常。\n\n### 语法\n\n```java\ncatch (ExceptionType1|ExceptionType2\
  \ ex) {\n    // handling exception\n}\n```\n\n下面的示例展示了修改后的 `Calculator` 类，用于在单个\
  \ catch 块中处理多个异常：\n\n```java\nimport java.util.Scanner;\n\npublic class Calculator\
  \ {\n    public static void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n\
  \        System.out.println(\"Enter first number\");\n        int num1 = s.nextInt();\n\
  \        System.out.println(\"Enter second number\");\n        int num2 = s.nextInt();\n\
  \        Calculator obj = new Calculator();\n        try {\n            obj.calculate(num1,\
  \ num2);\n        } catch (ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception occurred: \" + e);\n        }\
  \ finally {\n            System.out.println(\"----------------------\");\n     \
  \       System.out.println(\"All resources closed in finally block\");\n       \
  \ }\n    }\n\n    public void calculate(int a, int b) throws ArithmeticException,\
  \ ArrayIndexOutOfBoundsException {\n        if (b == 0) {\n            throw new\
  \ ArithmeticException(\"/ by zero\");\n        }\n        int c = a / b;\n     \
  \   System.out.println(\"Division of \" + a + \" and \" + b + \" is \" + c);\n \
  \       int arr[] = new int[c];\n        for (int i = 0; i <= arr.length; i++) {\n\
  \            if (i == arr.length) {\n                throw new ArrayIndexOutOfBoundsException();\n\
  \            }\n            arr[i] = i + 1;\n        }\n    }\n}\n```\n\n在这里，`main()`\
  \ 方法中的 `catch` 块已被修改，以处理用竖线（`|`）分隔的两种异常。\n\n### 6.3.3 处理异常的最佳实践\n\n下面是处理异常的最佳实践：\n\
  \n- `try` 语句必须跟跟至少一个 `catch` 块或一个 `finally` 块。\n- 使用 `finally` 块编写清理代码。\n- 避免使用\
  \ `java.lang.Exception` 或 `java.lang.Throwable` 类来捕获无法处理的异常。\n- 当发生异常时，始终在 `catch`\
  \ 块中除默认消息外提供一个适当的消息。\n- 尝试在靠近源代码的地方处理异常，以便于追踪溯源。\n- 避免重复抛出同一个异常，因为这可能会降低程序运行速度。\n\
  \n## 6.4 使用 try-with-resources 语句\n\n资源是指程序完成使用后需要关闭的任何对象。例如，JDBC 连接、`File` 资源或\
  \ `Socket` 连接。在 Java 7 之前，需要显式关闭资源，通常在 `finally` 块中关闭，因为没有自动资源管理。然而，如果忘记关闭资源，这种方法会导致内存泄漏和性能低下的。\n\
  \nJava SE 7 引入了 `try-with-resources` 语句，用于一次性声明多个资源，并确保在代码执行完成后关闭所有资源。资源是任何实现了 `java.lang.AutoCloseable`\
  \ 或 `java.io.Closeable` 接口的对象。\n\n| 注意：`Closeable` 接口扩展了 `AutoCloseable` 接口。 |\n\
  \n`Closeable` 资源是可以关闭的数据源或终目的地，而 `AutoCloseable` 接口用于在资源不再需要时关闭该资源。\n\n#### close()\
  \ 方法\n\n`Closeable` 和 `AutoCloseable` 接口的 `close()` 方法具有以下特点：\n\n- 它释放对象持有的资源，例如打开的文件。\n\
  - `Closeable` 接口的 `close()` 方法抛出 `IOException` 类型的异常。\n- `AutoCloseable` 接口的 `close()`\
  \ 方法抛出 `Exception` 异常。\n- 可以在 `AutoCloseable` 接口的子类中重写 `close()` 方法。这允许重写的 `close()`\
  \ 方法抛出专门异常（如 `IOException`），或者不抛出异常。\n\n下面的示例展示了使用 `finally` 块关闭资源：\n\n```java\n\
  static void readFile(String[] args) {\n    BufferedReader br = null;\n    try {\n\
  \        br = new BufferedReader(new FileReader(\"F:\\\\myfile.txt\"));\n      \
  \  System.out.println(br.readLine());\n    } catch (IOException e) {\n        e.printStackTrace();\n\
  \    } finally {\n        try {\n            if (br != null)\n                br.close();\n\
  \        } catch (IOException ex) {\n            ex.printStackTrace();\n       \
  \ }\n    }\n}\n```\n\n在这里，`BufferedReader` 对象在 `finally` 块中关闭。下面的示例展示了使用 `try-with-resources`\
  \ 语句自动关闭资源：\n\n```java\npublic static void main(String[] args) {\n    try (BufferedReader\
  \ br = new BufferedReader(new FileReader(\"F:\\\\myfile.txt\"))) {\n        System.out.println(br.readLine());\n\
  \    } catch (IOException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n\
  以下是 `try-with-resources` 语句的优点：\n\n- 减少代码行数。\n- 代码更具可读性且易于维护。\n- 执行自动资源管理。\n- 避免在\
  \ `finally` 块中关闭资源。\n- 允许在 `try-with-resources` 语句中通过分号分隔打开多个资源。\n\n下面的示例展示了在 `try-with-resources`\
  \ 语句中同时打开多个资源：\n\n```java\ntry (BufferedReader br = new BufferedReader(new FileReader(\"\
  F:\\\\myfile.txt\"));\n     java.io.BufferedWriter writer = java.nio.file.Files.newBufferedWriter(java.nio.file.Paths.get(\"\
  F:\\\\myfile.txt\"), java.nio.charset.Charset.defaultCharset())) {\n    System.out.println(br.readLine());\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n```\n\n在这里，`BufferedReader`\
  \ 和 `BufferedWriter` 在 `try-with-resources` 语句中关闭。注意它们是反序关闭的。\n\n#### 异常处理\n\n`try-catch-finally`\
  \ 和 try with resources 在处理异常时的不同。对于 `try-catch-finally`，当 `finally` 块抛出异常时，该异常由调用者处理。\n\
  \n## 6.5 自定义异常\n\nJava 提供了大量的内置异常。然而，某些情况下，内置异常可能无法满足代码的需求。在这种情况下，可以创建自定义异常类。自定义异常在代码可能抛出多个相关异常或需要与其他供应商抛出的异常进行区分时非常有用。\n\
  \n要创建自定义异常，该类必须继承自 `Exception` 类。\n\n### 语法\n\n```java\npublic class <exception-class-name>\
  \ extends Exception {\n    // custom coded\n}\n```\n\n下面的代码展示了自定义异常类的创建：\n\n```java\n\
  public class FileException extends Exception {\n    public FileException() {\n \
  \   }\n    // 重写 getMessage 方法\n    @Override\n    public String getMessage() {\n\
  \        return \"Could not open file\";\n    }\n}\n```\n\n`FileException` 类是继承自内置\
  \ `Exception` 类并重写其 `getMessage()` 方法的自定义异常。为了引发自定义异常，方法必须在运行时抛出异常，并由调用者处理：\n\n\
  ```java\npublic class FileManager {\n    String filepath;\n    String mode;\n\n\
  \    public FileManager() {\n    }\n\n    public FileManager(String filepath, String\
  \ mode) {\n        this.filepath = filepath;\n        this.mode = mode;\n    }\n\
  \n    // 创建抛出自定义异常的方法\n    public void openFile() throws FileException {\n     \
  \   if (filepath.equals(\"\") || mode.equals(\"\")) {\n            throw new FileException();\n\
  \        } else {\n            System.out.println(\"Openining File…\");\n      \
  \  }\n    }\n}\n```\n\n在这里，`FileManager` 类的 `openFile()` 方法在 `filepath` 或 `mode`\
  \ 值为空时抛出自定义的 `FileException`：\n\n```java\npublic class TestFileException {\n   \
  \ public static void main(String[] args) {\n```\n\n\n\n\n```java\nFileManager obj\
  \ = new FileManager(\"\",\"\");\n\ntry{\n    obj.openFile();\n}catch(FileException\
  \ e){\n    System.out.println(\"Exception occurred: \" + e.getMessage());\n}\n}\n\
  ```\n\n`main()` 方法使用空字符串作为构造函数的参数创建 `FileManager` 类对象，并在 `try` 块中调用 `openFile()`\
  \ 方法。catch 块捕获自定义异常 `FileException` 并调用重写的 `getMessage()` 方法。代码的输出所示：\n\nException\
  \ occurred: Could not open file\n\n## 6.6 包装异常\n\nJava 允许通过将一个异常封装另一个异常内部来实现异常链，而不会实际上吞掉原始异常原因。异常包装表示捕获一个异常，将其封装在不同的异常中并抛出包装异常。\n\
  \n异常链从 JDK 1.4 开始引入，为了支持该特性，Java 在 `Throwable` 类中引入了 `getCause()` 和 `initCause(Throwable)`，以及两个新构造函数\
  \ `Throwable(Throwable)` 和 `Throwable(String, Throwable)`。包装异常可以防止调用栈中较高层的代码了解调用栈底端异常的每一个细节。这是因为异常越向顶层聚合，顶层方法所需的异常声明就越多，这使得每次代码更改时管理每一个异常都非常麻烦。\n\
  \n例如，假设一个类有一个抛出 `SQLException` 的方法。现在，使用该方法的类将必须捕获该异常。以后方法变为抛出 `RemoteException`、`IOException`\
  \ 以及其他几个异常，那么这些异常都必须在调用该方法的类中分别捕获。相反，可以创建一个通用异常，例如 `MyException`，每当这些任何一个异常发生时都可以抛出它并捕获它。因此，使用该方法的代码只需要处理一个异常。\n\
  \n下面的示例展示了包装异常的使用：\n\n```java\npublic class StandardException extends Exception\
  \ {\n    public StandardException() {\n    }\n\n    public StandardException(Throwable\
  \ cause) {\n        super(cause);\n    }\n\n    public StandardException(String\
