  （注：由于原文 3.11 节后存在大量文本重复和错乱，上述翻译已根据 Markdown 结构进行了完整性处理）。\n\n## 3.12 ‘static’ 关键字\n\
  \n`static` 关键字用于变量和方法以提供类级作用域。静态变量和方法可以在创建对象的情况下直接访问。声明为 `final` 的静态变量是一个常量，其值在代码中无法更改。例如：\n\
  \n```java\nstatic int PI=14; // 静态变量\nstatic int PI=14; // 静态常量\n```\n\n`static`\
  \ 关键字也可以应用于方法和初始化块。然而，静态方法：\n\n*   它只能访问静态变量。\n*   它只能调用静态方法。\n*   它不能使用 `this`\
  \ 或 `super` 关键字。\n\n例如：\n\n```java\npublic static void main(String args[])\n// 执行语句\n\
  ```\n\n`static` 关键字可以配合初始化块在类加载时初始化静态变量。静态块在 `main()` 方法调用之前就会执行。程序中可以有多个静态块，它们可以在类的任何位置。然而，静态块只能访问在其之前声明的静态变量。\n\
  \n以下示例展示了静态变量、静态方法和静态块的使用：\n\n```java\npublic class StaticDemo {\n    static int\
  \ staticVar = 0;\n    int instanceVar = 0;\n\n    static {\n        System.out.println(\"\
  静态块执行\");\n    }\n\n    public static void staticMethod() {\n        System.out.println(\"\
  静态方法执行\");\n    }\n\n    public void display() {\n        staticVar++;\n       \
  \ instanceVar++;\n        System.out.println(\"实例变量的值为:\" + instanceVar);\n    \
  \    System.out.println(\"静态变量的值为:\" + staticVar);\n    }\n\n    public static void\
  \ main(String[] args) {\n        System.out.println(\"Main 方法执行\");\n        StaticDemo.staticMethod();\n\
  \        StaticDemo obj1 = new StaticDemo();\n        obj1.display();\n        StaticDemo\
  \ obj2 = new StaticDemo();\n        obj2.display();\n        StaticDemo obj3 = new\
  \ StaticDemo();\n        obj3.display();\n    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_3.11.png)\n\
  \n图 3.11：使用 ‘static’ 关键字\n\n注意，静态块在 `main()` 方法之前执行。此外，实例变量的值对于每个对象都是 1。但是静态变量由每个对象共享，因此下一个对象接收到上一个对象增加后的值。\n\
  \n## 3.13 Packages\n\n\n\n\n包（Packages）用于将相关的类、接口和其他应用资源作为一个单元进行组织和分组。例如，可以有一个用于存储所有源文件的包，另一个用于存储图像，还有一个用于存储第三方\
  \ API 的包。建议将类存储在包中，以便于访问和维护。此外，它有助于解决应用程序中存在同名类类时的命名冲突问题。例如，`pkg1.Test` 和 `pkg2.Test`。包对包外部的类增加了额外层级的可见性限制。\n\
  \n包名通常用小写字母编写。包可以有子包，可以通过全限定名（fully qualified name）进行访问，即 `<outer-package>.<inner-package>.<class-name>`。同一个包中的两个成员不能有相同的名称。一个\
  \ Java 包中只能有一个公共类。Java 中的内置包以标准的 `java` 或 `javax` 开头。\n\n当包中的任何类被首次调用时，整个包包都会被加载到内存中，这避免了在调用同一包的其他程序时产生不必要的磁盘\
  \ I/O。Java 平台提供了许多内置库，其中包含了用于应用程序开发的包和类。这个库被称为应用程序编程接口（API）。这些包包含了用于轻松执行常见编程任务的类。这些包被称为内置包或预定义包。例如，`java.io`\
  \ 包包含了允许文件操作的类，`java.awt` 包包含了允许创建图形用户界面（GUI）组件的类。\n\n开发者在应用开发过程中创建的自定义包被称为自定义包。例如，`com.pkg1`。通常，包名包含公司的反向域名，随后是地区和包名。例如，`com.company.region.pkg1`。\n\
  \n## 在 JDK 8 中创建包\n\n以下示例展示了如何在不使用 IDE 的情况下在 JDK 8 中创建包：\n\n1. 创建如下所示的类：\n\n```java\n\
