  \n![](img/fm1.png)\n\n# 第 9 章 Java 中的文件操作\n\n## 引言\n\n本章解释了不同类型流的使用。你将学习如何使用 `File`\
  \ 类及其成员。你还将理解 `java.io` 包中字节流和字符流的使用。此外，你将学习序列化、`Console` 类以及不同包，如 `java.util.zip`\
  \ 和 `java.nio` 包。\n\n## 结构\n\n在本章中，我们将学习以下主题：\n\n* 文件和流\n* `DataInput` 和 `DataOutput`\
  \ 接口\n* 文件名接口\n* 字节流\n* `OutputStream` 类层次\n* 字符流\n* `Writer` 类层次\n* `Console` 类\n\
  * `java.util.zip` 包\n* `java.nio` 包\n\n## 目标\n\n在本章中，你将理解数据流并使用 `File` 类。你还将学习 `DataInput`\
  \ 和 `DataOutput` 接口。你将理解 `java.io` 包的不同类以及 `nio` 包。此外，你将学习序列化以及 `Console` 类的使用。\n\
  \n## 9.1 文件和流\n\n通常，数据以文件的形式存储在设备或网络上。为了处理这些文件，Java 使用流的概念。流是数据源到目的地传输数据的序列，例如存储介质、I/O\
  \ 设备或网络上的计算机。Java 逐字节或逐字符地读取数据。因此，Java 流可以执行不同类型的 I/O 操作。\n\n流支持不同类型的数据，如字节、原始类型、本地字符等。Java\
  \ 流用于管理 I/O 操作。输入流从源读取数据到程序，输出流从程序将数据写入目的地。流还允许管理磁盘文件并在网络共享：\n\n![](img/Figure_9.1.jpg)\n\
  \n图 9.1: 流\n\n这些流的字段包括：\n\n* `in`: 代表标准输入流，从键盘或其他输入源读取数据字符。\n  `public static final\
  \ InputStream in;`\n* `out`: 代表标准输出流，在屏幕或其他输出介质上显示输出。\n  `public static final PrintStream\
  \ out;`\n* `err`: 代表标准错误流，在用户控制台上显示错误。\n  `public static final PrintStream err;`\n\
  \n使用输入输出流读写数据需要执行以下步骤：\n\n* 打开流（源可以是文件、URL、套字等）。\n* 从流读写数据。\n* 关闭流。\n\nJava 提供了输入输出流的抽象类及其子类的层次结构，以字节流的形式读写数据。`java.io`\
  \ 包提供了输入输出操作的类层次结构。重要的类如图所示：\n\n![](img/Figure_9.2.jpg)\n\n图 9.2: java.io 包的类\n\n\
  下列是 `java.io` 包的一些重要接口：\n\n* `Closeable`\n* `DataInput`\n* `DataOutput`\n* `FileFilter`\n\
  * `FilenameFilter`\n* `Serializable`\n\n### 9.1.1 File 类\n\n\n\n\n\n直接在文件系统上操作文件最重要的类是\
  \ `File` 类。`java.io.File` 类用于创建文件和目录、搜索文件、删除文件等。文件的命名约定遵循宿主操作系统的。文件的路径可以使用相对路径或绝对路径指定。`getParent()`\
  \ 方法有助于解析抽象路径的父目录。\n\n`File` 类实例是不可变的，因此，一旦 `File` 对象被创建，它所表示的抽象路径就不能被更改。`File`\
  \ 类存储文件或目录的名称和路径，并允许通过各种访问方法进行文件操作。支持的常用操作包括创建、删除、重命名、列出文件等。在执行任何操作之前，需要确定 `File`\
  \ 权限。\n\n下面列出了 `java.io.File` 类的一些重要的构造函数：\n\n- `File(String path)`：创建一个指定指定路径的\
  \ `File` 对象。\n- `File(String parent, String child)`：使用指定的父目录和子文件名参数作为路径创建一个 `File`\
  \ 对象。在这里，`parent` 指向目录，`child` 指向目录或文件。\n- `File(File obj, String filename)`：从另一个\
  \ `File` 对象和文件或目录名称创建一个 `File` 对象。\n- `File(URL obj)`：将给定的 `URL` 转换为路径并生成一个新的 `File`\
  \ 对象。\n\n下面列出了 `File` 类的的一些方法：\n\n- `boolean exists()`：检查给定的文件或目录是否存在。\n- `boolean\
  \ isFile()`：检查该对象是否为普通文件。\n- `String getPath()`：以字符串形式返回抽象路径。\n- `boolean mkdir()`：通过指定的抽象路径创建一个新目录。\n\
  - `boolean createNewFile()`：如果不存在具有相同名称的文件，则使用给定的文件名创建一个新的空文件。该方法会抛出 `IOException`\
  \ 异常。\n- `boolean renameTo(File newFile)`：使用参数中指定的新名称重重命名现有的 `File` 对象。\n- `boolean\
  \ delete()`：删除路径指向的文件。\n- `Path toPath()`：从给定的路径返回 `java.nio.file.Path` 对象。\n- `URI\
  \ toURI()`：构建一个表示给定路径的文件、`URI`。\n\n以下代码演示了 `File` 类构造函数和方法的使用：\n\n```java\nimport\
  \ java.io.File;\n\npublic class FileDemo {\n    public static void main(String[]\
  \ args) {\n        File obj = new File(\"F:/JavaDemos/FirstFile.txt\");\n      \
  \  // 下行显示了 File 类的重载构造函数\n        //File obj = new File(\"F:/JavaDemos\", \"FirstFile.txt\"\
  );\n        System.out.println(\"File exists is: \" + obj.exists());\n        System.out.println(\"\
  File is: \" + obj.isFile());\n        System.out.println(\"Path is: \" + obj.getPath());\n\
  \        System.out.println(\"Name is: \" + obj.getName());\n    }\n}\n```\n\n代码的输出所示：\n\
  \n![](img/Figure_9.3.jpg)\n\n图 9.3: File 类构造函数和方法\n\n### 9.1.2 FileDescriptor 类\n\
  \n在访问目录和文件时，操作系统会维护文件描述符。可以使用 `FileDescriptor` 类来获取这些描述符。\n\n`FileDescriptor` 类具有以下公共字段：\n\
  \n- `static final FileDescriptor in`：作为标准输入流的句柄。\n- `static final FileDescriptor\
  \ out`：作为标准输出流的句柄。\n- `static final FileDescriptor err`：作为标准错误流的句柄。\n\n下面是 `FileDescriptor`\
  \ 类的构造函数：\n\n- `FileDescriptor()`：创建一个无效的 `FileDescriptor` 对象。\n\n下面是 `FileDescriptor`\
  \ 类的重要方法：\n\n- `sync()`：清除系统缓冲区并将它们包含的内容写入实际硬件。它会抛出 `SyncFailedException` 异常。\n\
  - `valid()`：检查文件描述符是否有效。由于文件描述符与打开的文件相关，因此当文件关闭时，它们会变为无效。\n\n文件描述符通常用于创建包含它的 `FileInputStream`\
  \ 或 `FileOutputStream`。\n\n例如：\n\n```java\npublic static void main(String[] args)\
  \ throws IOException {\n    FileDescriptor desc = null; FileOutputStream out = null;\n\
  \    byte[] buff = {48,28,48,38,29};\n    try {\n        out = new FileOutputStream(\"\
  File1.txt\"); \n        desc = out.getFD(); // 将字节写入文件输出流\n        out.write(buff);\
  \ // 将数据同步到源文件\n        desc.sync(); \n        System.out.print(\"Sync Completed\"\
  );\n    } catch(Exception ex) { \n        ex.printStackTrace(); \n    } finally\
  \ {\n        // 释放资源\n        if(out!=null) out.close(); \n    }\n}\n```\n\n## 9.2\
  \ DataInput 和 DataOutput 接口\n\n数据流实现 `DataInput` 和 `DataOutput` 接口以执行 I/O 操作。这些接口允许将二进制数据转换为\
  \ Java 的原始类型，并将 UTF 8 转换为字符串，反之亦然。\n\n下面是 `DataInput` 接口中的方法：\n\n- `readByte()`：从流中读取一个字节，范围从\
  \ -128 到 127，是一个符号值。\n- `readChar()`：从流中读取一个字符。\n- `readInt()`：从流中读取四个字节并返回一个整数。\n\
  - `readDouble()`：从流中读取八字节并返回一个双精度浮点数。\n- `readBoolean()`：从流中读取一个字节并返回一个布尔值。\n- `readLine()`：读取一行，直到到达行尾或文件结束。每个字节转换为一个字符，并返回一个字符串。\n\
  - `readUTF()`：从流中读取 Java 修改后的 UTF-8 格式的字符串。如果读取字节失败或输入流关闭，将抛出 `IOException`。\n\n\
  下面是 `DataOutput` 接口的方法：\n\n- `writeByte(int value)`：向流写入一个字节值。\n- `writeChar(int\
  \ value)`：向流写入两个字节的字符。\n- `writeChars(String value)`：向流写入字符串字符。\n- `writeInt(int\
  \ value)`：向流写入表示整数的四个字节。\n- `writeDouble(double value)`：向流写入表示双精数的八字节。\n- `writeBoolean(boolean\
  \ b)`：向流写入指定的布尔值。如果值为 `true`，则写入 1；否则写入 0。\n- `writeUTF(String value)`：向流写入 Java\
  \ 修改后的 UTF-8 字符串。\n\n### 9.3 FilenameFilter 接口\n\n以下代码演示了使用 `FilenameFilter` 过滤特定扩展名的文件：\n\
  \n```java\nimport java.io.FilenameFilter;\nimport java.io.File;\n\npublic class\
  \ FilenameFilterDemo {\n    public static void main(String[] args) {\n        String\
  \ dirPath = \"F:/JavaDemos\";\n        File fObj = new File(dirPath);\n        FilenameFilter\
  \ filterObj = new FileFilter(\"txt\");\n        String[] names = fObj.list(filterObj);\n\
  \        System.out.println(\"Files count: \" + names.length);\n        System.out.println(\"\
  List of Files Found\");\n        for (int n = 0; n < names.length; n++) {\n    \
  \        System.out.println(names[n]);\n        }\n    }\n}\n\nclass FileFilter\
  \ implements FilenameFilter {\n    String fileExtn;\n    public FileFilter(String\
  \ extn) {\n        fileExtn = \".\" + extn;\n    }\n    @Override\n    public boolean\
  \ accept(File dir, String fileName) {\n        return fileName.endsWith(fileExtn);\n\
  \    }\n}\n```\n\n## 9.4 字节流\n\nJava 字节流允许按字节（8 位）执行数据输入和输出。有许多支持字节流的类。它们大致被归类为\
  \ `InputStream` 和 `OutputStream`。\n\n\n\n\n\n# 9.4.1 InputStream 类层次结构\n\n`InputStream`\
  \ 类是所有输入类的父类。它是一个抽象类，提供了读取字节、计算已读取字节数、在流中标记位置等方法：\n\n![](img/Figure_9.5.jpg)\n\n\
  图 9.5: InputStream 类层次结构\n\n列出的是 `InputStream` 类的一些重要方法：\n\n- `read()`：从输入流中读取下一个字节数据，并返回\
  \ 0 到 255 之间的 `int` 值。当遇到文件末尾时，返回 -1。\n- `available()`：返回在不阻塞阻塞的情况下可以读取的可用字节数。\n\
  - `close()`：关闭输入流并释放流占用的系统资源。\n- `mark(int n)`：在流中标记当前位置，该标记保持有效，直到读取了变量 `n` 中指定的字节数。\n\
  - `skip(long n)`：从输入流中读取数据时，跳过 `n` 个字节数据。\n- `reset()`：将读取指针重置为流中之前设置的标记。\n\n接下来的章节将解释\
  \ `InputStream` 的一些重要子类。\n\n## 9.4.1.1 FileInputStream 类\n\n`FileInputStream` 类允许从文件中读取字节。它覆盖了除\
  \ `mark()` 和 `reset()` 之外的 `InputStream` 类的所有方法。列出的是 `FileInputStream` 类的一些重要构造函数：\n\
  \n- `FileInputStream(String str)`：创建一个 `InputStream` 对象，从 `String` 参数指定的位置的文件读取字节。例如：\n\
  ```\nFileInputStream fis = new FileInputStream(\"File1.txt\");\n```\n- `FileInputStream(File\
  \ f)`：创建一个 `InputStream` 对象，从 `File` 对象参数指向的文件读取字节。\n```java\nFile f = new File(\"\
  /File1.txt\");\nFileInputStream fis = new FileInputStream(f);\n```\n- `FileInputStream(FileDescriptor\
  \ fd)`：从指定的句描述符对象创建 `FileInputStream`，用于表示文件系统中已存在的文件的连接。\n\n以下代码演示了 `FileInputStream`\
  \ 类的用法：\n\n```java\npublic class FileInputStreamDemo {\n    public static void main(String\
  \ argv[]) {\n        try {\n            FileInputStream fis = new FileInputStream(\"\
  D:/Demos/File1.txt\");\n            int ch;\n            while ((ch = fis.read())\
  \ > -1) {\n                StringBuilder buf = new StringBuilder();\n          \
  \      buf.append((char) ch);\n                System.out.print(buf.toString());\n\
  \            }\n        } catch (IOException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n该代码从 `File1.txt` 读取数据并将其存储在 `StringBuilder` 对象中，然后用于将整个数据作为字符串显示。\n\
  \n输出：\n\n![](img/Figure_9.6.png)\n\n图 9.6: FileInputStream 输出\n\n## 9.4.1.2 ByteArrayInputStream\
  \ 类\n\n`ByteArrayInputStream` 类将从流中读取的字节存储在缓冲区中。数据源通常是一个字节数组。为了跟踪要读取的字节，它维护了一个内部计数器。它覆盖了\
  \ `InputStream` 类的几个方法，如 `read()`、`skip()`、`available()` 和 `reset()`。\n\n该类的构造函数如下：\n\
  \n- `ByteArrayInputStream(byte[] b)`：创建一个以指定的字节数组作为输入源的 `ByteArrayInputStream`。\n\
  - `ByteArrayInputStream(byte[] b, int offset, int length)`：创建一个以指定的字节数组作为输入源的 `ByteArrayInputStream`。它从索引\
  \ `offset` 指定的字符开始，直到 `length` 指定的值为止。\n\n以下代码片段显示了 `ByteArrayInputStream` 类的用法：\n\
  \n```java\npublic class ByteArrayISDemo {\n    public static void main(String[]\
  \ args) {\n        String content = \"Good Morning\";\n        byte[] bytes = content.getBytes();\n\
  \        ByteArrayInputStream bais = new ByteArrayInputStream(bytes);\n        int\
  \ i = 0;\n        while ((i = bais.read()) != -1) {\n            //将字节转换为字符\n  \
  \          char ch = (char) i;\n            System.out.println(\"Read character:\
  \ \"+ch);\n        }\n    }\n}\n```\n\n上述代码的输出如下：\n\n![](img/Figure_9.7.jpg)\n\n\
  图 9.7: ByteArrayInputStream 输出\n\n## 9.4.1.3 FilterInputStream 类\n\n`FilterInputStream`\
  \ 类允许我们在传输过程中转换数据，或将输入流作为基本数据源以提供额外功能。\n\n构造函数：\n\n- `protected FilterInputStream(InputStream\
  \ in)`：创建一个并将值赋值给字段 `this.in` 的 `FilterInputStream`。\n\n列出的是 `FilterInputStream`\
  \ 类的方法：\n\n- `read()`：从输入流中读取下一个字节数据。\n- `available()`：返回可以从输入流中读取或跳过的字节数。\n- `read(byte[]\
  \ b)`：从输入流中读取字节数据到指定的字节数组中。\n- `read(byte[] b, int offset, int length)`：从输入流中读取从\
  \ `offset` 到指定长度的字节数据到指定的字节数组中。\n- `mark(int readlimit)`：标识输入流中的当前位置。\n- `markSupported()`：检查输入流是否支持\
  \ `mark` 和 `reset` 方法。\n- `close()`：关闭输入流并释放与流相关的系统资源。\n- `reset()`：将流指针重置到之前设置的标记。\n\
  - `skip(long n)`：从输入流中跳过 `n` 个字节。\n\n## 9.4.1.4 BufferedInputStream\n\n`BufferedInputStream`\
  \ 将从源读取的字节缓存在缓冲区中。从源读取的字节可以缓存在临时存储中提高读写操作的性能。这种临时存储被称为缓冲区。它允许对流进行 `skip`、`mark`\
  \ 和 `reset` 操作。内部，缓存的数据以字节数组的形式存储。\n\n构造函数：\n\n- `BufferedInputStream(InputStream\
  \ is)`：为具有默认 2048 字节大小的 `InputStream` 创建缓冲输入流。\n- `BufferedInputStream(InputStream\
  \ is, int size)`：为指定的 `InputStream` 和 `size` 创建缓冲输入流。\n\n列出的 `BufferedInputStream`\
  \ 的重要方法：\n\n- `available()`：返回可读取的字节数。\n- `mark(int num)`：在输入流中设置标记。\n- `read()`：从输入流读取数据。\n\
  - `read(byte[] b, int off, int length)`：向指定的数组读取指定的 `length` 字节。\n- `reset()`：将流指针重置到之前设置的标记。\n\
  \n以下代码演示了 `FilterInputStream` 配合 `BufferedInputStream` 的用法：\n\n```java\npublic class\
  \ FilterInputStreamDemo {\n    public static void main(String[] args) throws Exception\
  \ {\n        InputStream is = null;\n        FilterInputStream fis = null;\n   \
  \     try {\n            //实例化输入流对象\n            is = new FileInputStream(\"D:/Demos/File1.txt\"\
  );\n            fis = new BufferedInputStream(is);\n            //从过滤输入流读取并打印\n\
  \            System.out.println(\"Read character: \"+(char) fis.read());\n     \
  \       System.out.println(\"Read character: \"+(char) fis.read());\n          \
  \  // 设置一个标记\n            fis.mark(0);\n            System.out.println(\"mark set\"\
  );\n            System.out.println(\"Read character: \"+(char) fis.read());\n  \
  \          System.out.println(\"Read character: \"+(char) fis.read());\n       \
  \ } catch (IOException e) {\n            System.out.println(\"Error: \" + e.getMessage());\n\
  \        } finally {\n            if (is != null) {\n                is.close();\n\
  \            }\n            if (fis != null) {\n                fis.close();\n \
  \           }\n        }\n    }\n}\n```\n\n上述代码的输出如下：\n\n![](img/Figure_9.8.png)\n\
  \n图 9.8: FilterInputStream 和 BufferedInputStream\n\n## 9.4.1.5 ObjectInputStream\
  \ 类\n\n`ObjectInputStream` 类继承自 `InputStream` 类并实现了 `ObjectInput` 接口。该类用于反序列化由使用\
  \ `ObjectOutputStream` 写入的对象和原始数据。下图显示了 `ObjectInputStream` 类的类层次结构：\n\n![](img/Figure_9.9.png)\n\
  \n图 9.9: ObjectInputStream\n\n\n\n\n\n列出了 `ObjectInputStream` 类的构造函数：\n\n### 构造函数：\n\
  - `ObjectInputStream()`: 允许完全重新实现 `ObjectInputStream` 的子类，以避免分配当前 `ObjectInputStream`\
  \ 实现中最近使用的私有数据。\n- `ObjectInputStream(InputStream in)`: 创建一个 `ObjectInputStream`，从指定的\
  \ `InputStream` 读取序列化对象。\n\n列出了 `ObjectInputStream` 类中的方法：\n- `readByte()`: `readByte()`\
  \ 方法从输入流中读取并返回一个 `byte`。\n- `readChar()`: `readChar()` 方法从输入流中读取并返回一个 `char`。\n\
  - `readFloat()`: `readFloat()` 方法从输入流中读取并返回一个 `float`。\n- `readBoolean()`: `readBoolean()`\
  \ 方法从输入流中读取并返回一个 `boolean`。\n- `readObject()`: `readObject()` 方法从输入流中读取并返回一个对象。\n\
  \n以下代码演示了 `ObjectInputStream` 类的用法：\n\n```\n…\nFileInputStream fis = new FileInputStream(\"\
  student\");\n\nObjectInputStream ois = new ObjectInputStream(fis);\n\nStudent s\
  \ = (Student) ois.readObject();\n\nois.close();\n…\n```\n\n在这里，`FileInputStream`\
  \ 对象作为参数传递给 `ObjectInputStream` 构造函数。`readObject()` 方法从 `ObjectInputStream` 中反序列化之前序列化的对象，并在将其强制转换为适当类型后存储在\
  \ `Student` 对象 `s` 中。最后，关闭了 `ObjectInputStream`。\n\n# 9.4.2 OutputStream 类层次结构\n\
  \n`OutputStream` 是一个抽象类。它提供了向流中写入字节或字节数组的方法。`OutputStream` 类的子类包括 `ByteArrayOutputstream`、`FileOutputStream`\
  \ 等，如下所示所示：\n\n![](img/Figure_9.10.jpg)\n\n图 9.10: OutputStream 类层次结构\n\n列出了 `OutputStream`\
  \ 类的方法：\n- `write(int b)`: `write(int b)` 方法将作为参数给定的整数的指定字节写入输出流。\n- `write(byte[]\
  \ b)`: 将整个指定的字节数组参数写入输出流。\n- `write(byte[] b, int off, int len)`: 将指定的字节数组参数中从偏移量开始到指定长度的字节写入输出流。\n\
  - `flush()`: 刷新流并强制写入任何缓冲的输出字节。\n- `close()`: 关闭输出流并释放与输出流相关的任何系统资源。\n\n这里解释了 `OutputStream`\
  \ 的一些重要子类。\n\n## 9.4.2.1 FileOutputStream\n\n`FileOutputStream` 类允许向文件或文件描述符写入字节。根据底层平台，如果文件不可用，则可能会创建也可能不创建。某些平台可能允许一次仅由单个\
  \ `FileOutputStream` 打开文件进行写入，这将导致对已打开文件进行构造函数调用失败。\n\n### 构造函数：\n- `FileOutputStream(String\
  \ filepath)`: 创建一个 `FileOutputStream` 对象，向指定文件写入字节。\n- `FileOutputStream(File name)`:\
  \ 创建一个 `FileOutputStream` 对象，向 `File` 对象指示的文件写入字节。\n- `FileOutputStream(String filename,\
  \ boolean flag)`: 创建一个 `FileOutputStream` 对象，向指定文件写入字节。如果 `flag` 为 `true`，则以追加模式打开文件。\n\
  - `FileOutputStream(File name, boolean flag)`: 创建一个 `FileOutputStream` 对象，向 `File`\
  \ 对象指示的文件写入字节。如果 `flag` 为 `true`，则以追加模式打开文件。\n\n以下代码显示了 `FileOutputStream` 类的用法：\n\
  \n```java\nimport java.io.FileOutputStream;\nimport java.io.OutputStream;\n\npublic\
  \ class FileOutputStreamDemo {\n    public static void main(String[] args) {\n \
  \       try {\n            String str = \"This statement will be written to File2\"\
  ;\n            byte[] buff = str.getBytes();\n            OutputStream os = new\
  \ FileOutputStream(\"D:/Demos/File2.txt\");\n            os.write(buff);\n     \
  \       System.out.println(\"Data Written to File\");\n            os.close();\n\
  \        } catch (Exception e) {\n            System.out.println(\"Error: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n在这里，来自字符串的数据被转换为字节并存储在字节数组中。使用输出文件路径作为参数创建 `FileOutputStream`\
  \ 对象。然后使用 `write()` 方法将数组中的字节写入输出流。\n\n## 9.4.2.2 ByteArrayOutputStream 类\n\n`ByteArrayOutputStream`\
  \ 类创建一个输出流，其中数据被写入字节数组中。随着数据写入，缓冲区的大小会动态增长。即使在关闭流后，也可以访问该类的方法而不会抛出 `IOException`。\n\
  \n### 构造函数：\n- `ByteArrayOutputStream()`: 初始化一个具有 32 字节默认缓冲区大小的新 `ByteArrayOutputStream`\
  \ 对象。\n- `ByteArrayOutputStream(int size)`: 初始化一个具有指定缓冲区大小的新 `ByteArrayOutputStream`\
  \ 对象。\n\n以下列出了 `ByteArrayOutputStream` 类的一些重要方法：\n- `reset()`: 将字节数组输出流重置为零并丢弃输出流中积累的所有输出。\n\
  - `size()`: 返回缓冲区的大小。\n- `toByteArray()`: 创建一个包含到为止写入字节的新分配字节数组。\n- `writeTo(OutputStream\
  \ out)`: 将当前输出流的整个字节数组内容写入指定的输出流参数。\n- `toString()`: 将缓冲区的内容转换为字符串。使用默认字符集对字节进行解码。\n\
  \n以下代码演示了 `ByteArrayOutputStream` 的用法：\n\n```java\nimport java.io.ByteArrayOutputStream;\n\
  import java.io.OutputStream;\n\npublic class ByteArrayOS {\n    public static void\
  \ main(String[] args) {\n        try {\n            String str = \"Good Morning\"\
  ;\n            byte[] buff = str.getBytes();\n            ByteArrayOutputStream\
  \ baos = new ByteArrayOutputStream();\n            baos.write(buff);\n         \
  \   System.out.println(\"The string written to buffer: \" + baos.toString());\n\
  \        } catch (Exception e) {\n            System.out.println(\"Caught exception:\
  \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n在这里，字符串的内容转换为字节并存储在字节数组中。使用输出文件路径作为参数创建\
  \ `ByteArrayOutputStream` 对象。然后使用 `toString()` 方法打印的内容。\n\n## 9.4.2.3 FilterOutputStream\
  \ 类\n\n`FilterOutputStream` 类重写了 `OutputStream` 类的所有方法，并包含表示要过滤的底层输出流的保护 `out`。\n\
  \n### 构造函数：\n- `FilterOutputStream(OutputStream out)`: 在指定的输出流上创建一个输出过滤器。\n\n以下代码演示了\
  \ `FilterOutputStream` 类的用法：\n\n```java\nimport java.io.FileInputStream;\nimport\
  \ java.io.FilterOutputStream;\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
  import java.io.OutputStream;\n\npublic class FilterOutputStreamDemo {\n    public\
  \ static void main(String[] args) throws Exception {\n        OutputStream os =\
  \ null;\n        FilterOutputStream fos = null;\n        FileInputStream fis = null;\n\
  \        FileInputStream filis = null;\n        String s=\"Java Program\";\n   \
  \     byte buf[]=s.getBytes();\n        int i = 0;\n        char c;\n        try\
  \ {\n            // 创建输出流对象\n            os = new FileOutputStream(\"D://Demos//Write.txt\"\
  );\n            fos = new FilterOutputStream(os);\n            // 从字节数组写入输出流\n \
  \           fos.write(buf);\n            // 刷新输出流的内容\n            fos.flush();\n\
  \            // 创建输入流从文件读取\n            filis = new FileInputStream(\"D:/Demos/Write.txt\"\
  );\n            while ((i = filis.read()) != -1) {\n                // 将整数转换为字符\n\
  \                c = (char) i;\n                System.out.println(\"Character read:\
  \ \" + c);\n            }\n        } catch (IOException e) {\n            System.out.print(\"\
  Error: \"+e.getMessage());\n        } finally {\n            // 释放系统资源\n       \
  \     if (os != null) {\n                os.close();\n            }\n          \
  \  if (fis != null) {\n                fis.close();\n            }\n        }\n\
  \    }\n}\n```\n\n上述代码的输出将：\n\n![](img/Figure_9.11.jpg)\n\n图 9.11: FilterOutputStream\n\
  \n\n\n\n\n## 9.4.2.4 BufferedOutputStream 类\n\n`BufferedOutputStream` 为输出流创建一个缓冲区，允许将数据缓存到缓冲区中，以便在写入字节时提高性能。\n\
  \n### 构造函数\n\n* `BufferedOutputStream(OutputStream os)`: 为指定的 `OutputStream` 实例创建一个默认大小为\
  \ 512 字节的缓冲输出流。\n* `BufferedOutputStream(OutputStream os, int size)`: 为给定的 `OutputStream`\
  \ 实例创建一个指定大小的缓冲输出流。\n\n### 方法\n\n* `flush()`: 刷新缓冲输出流。\n* `write(int b)`: 将指定的字节写入此缓冲输出流中。\n\
  * `write(byte[] b, int off, int len)`: 从指定的字节数组中将从偏移量 `off` 开始、长度为 `len` 的字节写入缓冲输出流中。\n\
  \n以下代码演示了 `BufferedOutputStream` 类的用法：\n\n```java\nimport java.io.BufferedOutputStream;\n\
  import java.io.FileOutputStream;\n\npublic class BufferedOutputStreamDemo {\n  \
  \  public static void main(String args[]) throws Exception {\n        try {\n  \
  \          // 创建一个输出流\n            FileOutputStream fos = new FileOutputStream(\"\
  D:\\\\Demos\\\\Write1.txt\");\n            // 使用缓冲流封装输出流\n            BufferedOutputStream\
  \ bos = new BufferedOutputStream(fos);\n            String str = \"Data written\
  \ to file\";\n            byte b[] = str.getBytes();\n            // 将字节写入输出流\n\
  \            bos.write(b);\n            bos.flush();\n            bos.close();\n\
  \            fos.close();\n            System.out.println(\"Task Completed\");\n\
  \        } catch (Exception e) {\n            System.out.println(\"Error: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n## 9.4.2.5 ObjectOutputStream 类\n\n`ObjectOutputStream`\
  \ 类是 `OutputStream` 类的子类。它用于将对象和基本类型写入输出流中。\n\n### 构造函数\n\n* `ObjectOutputStream()`:\
  \ 允许完全重实现 `ObjectOutputStream` 的子类，避免分配仅供当前 `ObjectOutputStream` 实现使用的私有数据。\n* `ObjectOutputStream(OutputStream\
  \ out)`: 创建一个写入到给定 `OutputStream` 的 `ObjectOutputStream`。\n\n### 方法\n\n以下列出了 `ObjectOutputStream`\
  \ 类的重要方法：\n\n* `writeFloat(float f)`: 将浮点值写入输出流。\n* `writeObject(Object obj)`: 将指定的对象写入输出流。\n\
  * `writeObject()`: 将非静态和非瞬态（non-transient）字段写入底层输出流。\n\n以下代码演示了 `ObjectOutputStream`\
  \ 类的用法：\n\n```java\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport java.io.ObjectInputStream;\nimport java.io.ObjectOutputStream;\n\
  import java.io.Serializable;\n\npublic class ObjectOutputStreamDemo {\n    public\
  \ static void main(String[] args) {\n        // 创建输入输出流\n        FileInputStream\
  \ fis = null;\n        FileOutputStream fos = null;\n        ObjectInputStream ois\
  \ = null;\n        ObjectOutputStream oos = null;\n        try {\n            fos\
  \ = new FileOutputStream(\"D:\\\\Demos\\\\Student.txt\");\n            oos = new\
  \ ObjectOutputStream(fos);\n            // 创建一个 Student 对象用于序列\n            Student\
  \ s1 = new Student();\n            s1.lastName = \"Preston\";\n            s1.firstName\
  \ = \"Clark\";\n            s1.score = 68.7f;\n            // 将对象写入输出流\n       \
  \     oos.writeObject(s1);\n            oos.close();\n            fos.close();\n\
  \            // 初始化输入流\n            fis = new FileInputStream(\"D:\\\\Demos\\\\\
  Student.txt\");\n            ois = new ObjectInputStream(fis);\n            // 反序列化\
  \ Student 对象\n            Student s = (Student) ois.readObject();\n            System.out.println(\"\
  Deserialized Data:\\n\" + s.firstName + \" \" + s.lastName + \"\\n\" + s.score);\n\
  \        } catch (IOException | ClassNotFoundException e) {\n            System.out.println(\"\
  Exception occurred\");\n        } finally {\n            try {\n               \
  \ if (fis != null) {\n                    fis.close();\n                }\n    \
  \            if (ois != null) {\n                    ois.close();\n            \
  \    }\n            } catch (Exception e) {\n                System.out.println(\"\
  Exception while closing stream\");\n            }\n        }\n    }\n}\n\n// 创建一个实现\
  \ Serializable 的类\nclass Student implements Serializable {\n    String lastName;\n\
  \    String firstName;\n    float score;\n}\n```\n\n上述程序的输出将如下：\n\n![](img/Figure_9.12.jpg)\n\
  图 9.12: ObjectOutputStream\n\n## 9.5 序列化\n\n持久化是将数据存储到持久性存储设备的过程。Java 允许将对象持久化，并从持久性存储设备中读回。\n\
  \n序列化是将对象的状态转换为字节流的过程。当使用字节流在内存中重新创建实际 Java 对象时，称为反序列化。为了实现序列化，Java 提供了 `java.io.Serializable`\
  \ 接口，需要被序列化的类必须实现该接口。该接口没有任何方法；它仅表示该类及其子类的对象是可序列化的。然而，静态变量和瞬态（transient）变量是不可序列化的。\n\
  \n## 9.6 字符流\n\n字节流类允许对除 Unicode 字符以外的所有类型进行 I/O 操作。因此，Java 提供了字符流来处理字符数据 I/O。字符流提供了对\
  \ Unicode 字符进行读/写操作的方法，还可以处理国际化。字符流类允许对所有 Unicode 字符进行 I/O 操作。\n\n### 9.6.1 Reader\
  \ 类\n\n`Reader` 和 `Writer` 类是字符流的顶层类。`Reader` 类是一个抽象类，提供了读取字符流的方法，子类需要重写这些方法。\n\n\
  ### 构造函数\n\n* `Reader()`: 创建一个新的字符流。\n* `Reader(Object lock)`: 创建一个同步指定对象的字符流。\n\
  \n`Reader` 的所有方法都会抛出 `IOException`。以下列出了一些重要方法：\n\n* `read()`: 读取单个字符。遇到文件结束时返回\
  \ -1。\n* `read(char[] buffer, int offset, int count)`: 从 `offset` 到 `count` 读取字符到数组并返回读取的字符数。\n\
  * `read(char[] buffer)`: 读取字符到指定数组并返回读取的字符数。\n* `skip(long count)`: 跳过指定数量字符。\n\
  * `ready()`: 检查器是否就绪，如果是则返回 `true`。\n* `close()`: 关闭流并释放系统资源。\n* `markSupported()`:\
  \ 检查流是否支持 mark 操作。\n* `mark(int readAheadLimit)`: 标记流中的当前位置。\n* `reset()`: 将流指针重置到之前的\
  \ `mark()` 调用处，或如果没有调用 `mark()` 则重置到流开头。\n\n这里介绍了 `Reader` 类的一些重要子类。\n\n#### 9.6.1\
  \ CharArrayReader 类\n\n`CharArrayReader` 类继承自 `Reader` 类并允许从字符数组读取。它提供了两个从字符数组的构造函数。\n\
  \n### 构造函数\n\n* `CharArrayReader(char arr[])`: 根据指定的字符数组 `arr` 创建 `CharArrayReader`。\n\
  * `CharArrayReader(char arr[], int start, int num)`: 根据字符数组 `arr` 的子集创建 `CharArrayReader`，从索引\
  \ `start` 开始长度为 `num`。\n\n以下是 `CharArrayReader` 类的一些重要方法：\n\n* `read()`: 读取单个字符。\n\
  * `read(char[] b, int off, int length)`: 从给定的 `off` 到 `length` 读取字符到数组。\n* `skip(long\
  \ n)`: 在读取之前跳过 `n` 个字符。\n* `mark(int num)`: 标记流中的当前位置。\n* `reset()`: 将流指针重置到之前的\
  \ `mark()` 调用处，或如果没有调用 `mark()` 则重置到流开头。\n* `ready()`: 检查此流是否就绪读取。\n* `close()`:\
  \ 关闭输入流。\n\n\n\n\n\n```java\npublic class CharArrayReaderDemo {\n    public static\
  \ void main(String[] args) {\n        try {\n            // 初始化字符数组\n          \
  \  char[] buff = {'W', 'H', 'I', 'T', 'E'};\n            // 初始化字符数组读取\n        \
  \    CharArrayReader car = new CharArrayReader(buff);\n            // 检查是否就绪\n \
  \           boolean check = car.ready();\n            if (check == true) {\n   \
  \             System.out.println(\"Ready to read\");\n            } else {\n   \
  \             System.out.println(\"Not ready\");\n            }\n            int\
  \ i = 0;\n            System.out.println(\"Reading the array:\");\n            //\
  \ 调用 read() 方法\n            while ((i = car.read()) != -1) {\n                char\
  \ c = (char) i;\n                System.out.println(c);\n                // 调用 skip()\
  \ 方法\n                long c1 = car.skip(1);\n                System.out.println(\"\
  Characters Skipped: \" + c1);\n            }\n            CharArrayReader car1 =\
  \ new CharArrayReader(buff);\n            // 读取数组的一部分\n            char buff1[]\
  \ = new char[6];\n            // 从指定的偏移量和字符数将数据读入缓冲区\n            car1.read(buff1,\
  \ 1, 3);\n            int b = 0;\n            System.out.println(\"Display the remaining\
  \ array\");\n            while ((b = car1.read()) != -1) {\n                char\
  \ c2 = (char) b;\n                System.out.print(c2);\n            }\n       \
  \     System.out.println(\"\");\n        } catch (Exception e) {\n            System.out.println(\"\
  Error: \" + e.getMessage());\n        }\n    }\n}\n```\n\n上述代码的输出如下：\n\n![](img/Figure_9.14.jpg)\n\
  \n图 9.14：CharArrayReader\n\n### 9.6.1.2 FileReader 类\n\n`FileReader` 类是 `InputStreamReader`\
  \ 的子类，用于读取字符文件。它继承了 `Reader` 类以及 `InputStreamReader` 类的方法。\n\n#### 构造函数：\n\n- `FileReader(File\
  \ file)`: 给定一个要读取的 `File`，创建一个新的 `FileReader`。\n- `FileReader(FileDescriptor fd)`:\
  \ 给定一个要读取的 `FileDescriptor`，创建一个新的 `FileReader`。\n- `FileReader(String fileName)`:\
  \ 给定一个要读取的文件名，创建一个新的 `FileReader`。\n\n以下代码演示了如何使用 `FileReader` 类从文件中读取字符：\n\n```java\n\
  import java.io.FileReader;\n\npublic class FileReaderDemo {\n    public static void\
  \ main(String args[]) throws Exception {\n        try {\n            // 使用文件路径初始化\
  \ FileReader\n            FileReader fr = new FileReader(\"D:\\\\Demos\\\\File1.txt\"\
  );\n            int i;\n            // 一个一个读取字符\n            while ((i = fr.read())\
  \ != -1) {\n                System.out.print((char) i);\n            }\n       \
  \     System.out.println(\"\");\n            fr.close();\n        } catch (Exception\
  \ e) {\n            System.out.println(\"Error: \" + e.getMessage());\n        }\n\
  \    }\n}\n```\n\n数据按逐字符从文件中被读取并显示。\n\n### 9.6.2 Writer 类层次结构\n\n`Writer` 类是一个抽象类，提供了向流中写入字符的方法。子类需要重写方法以实现所需的功能：\n\
  \n![](img/Figure_9.15.jpg)\n\n图 9.15：Writer 类层次结构\n\n#### 构造函数：\n\n- `Writer()`:\
  \ 创建一个新的字符流写入器，其关键区域将在该写入器对象本身上同步。\n- `Writer(Object lock)`: 创建一个新的字符流写入器，其关键区域将在指定的对象上进行同步。\n\
  \n`Writer` 类的方法与 `OutputStream` 类的方法相同，且所有方法都会抛出 `IOException`。\n\n下列表列出了 `Writer`\
  \ 类的一些重要方法：\n\n- `write(int c)`: 写入单个字符。\n- `write(char[] text)`: 向输出流写入字符数组。\n\
  - `write(char[] text, int offset, int length)`: 从 `offset` 开始，按 `length` 指定的字符数，向输出流写入字符数组的局部。\n\
  - `write(String s)`: 向输出流写入字符串。\n- `write(String s, int offset, int length)`: 从\
  \ `offset` 开始，按 `length` 指定的字符数，向输出流写入字符串的一部分。\n- `flush()`: 刷新输出流以清空缓冲区。\n- `close()`:\
  \ 关闭输出流。\n\n#### 9.6.2.1 PrintWriter 类\n\n`PrintWriter` 类的主要用途是向控制台输出字符数据，包括 Unicode\
  \ 字符。它拥有 `PrintStream` 类的所有打印方法，但额外提供了对多字节和其他字符集的支持。\n\n#### 构造函数：\n\n- `PrintWriter(OutputStream\
  \ out)`: 从现有的 `OutputStream` 创建一个新的 `PrintWriter`。它不支持自动行刷新。\n- `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`: 从现有的 `OutputStream` 创建一个带有自动行刷新的 `PrintWriter`。\n- `PrintWriter(Writer\
  \ out)`: 创建一个不带自动行刷新的 `PrintWriter`。\n- `PrintWriter(Writer out, boolean autoFlush)`:\
  \ 创建带有自动行刷新的 `PrintWriter`。\n\n该类具有以下特点：\n\n- 它重写了 `Writer` 类的 `write` 方法。\n- 它通过\
  \ `IOException` 检查错误状态。\n- 它提供了自动行刷新功能。\n- 它支持原始类型、字符串、字符数组。\n\n`PrintWriter` 的一些重要方法如下：\n\
  \n- `print(char c)`: 打印字符。\n- `print(char[] s)`: 打印字符数组。\n- `print(int i)`: 打印整数。\n\
  - `print(float f)`: 打印浮点数。\n- `print(long l)`: 打印长整数。\n- `print(double d)`: 打印双精度浮点数。\n\
  - `print(boolean b)`: 打印布尔值。\n- `print(Object obj)`: 调用对象的 `toString()` 方法。\n- `print(String\
  \ s)`: 打印字符串。\n- `println(char c)`: 打印字符并换行。\n- `println(char[] s)`: 打印字符数组并换行。\n\
  - `println(int i)`: 打印整数并换行。\n- `println(float f)`: 打印浮点数并换行。\n- `println(long l)`:\
  \ 打印长整数并换行。\n- `println(double d)`: 打印双精度浮点数并换行。\n- `println(boolean b)`: 打印布尔值并换行。\n\
  - `println(Object obj)`: 调用对象的 `toString()` 方法并换行。\n- `println(String s)`: 打印字符串并换行。\n\
  - `println()`: 打印换行。\n- `write(char c)`: 写入单个字符。\n- `write(char[] buf)`: 写入字符数组。\n\
  - `write(int i)`: 写入整数。\n- `write(float f)`: 写入浮点数。\n- `write(long l)`: 写入长整数。\n\
  - `write(double d)`: 写入双精度浮点数。\n- `write(boolean b)`: 写入布尔值。\n- `write(Object obj)`:\
  \ 调用对象的 `toString()` 方法。\n- `write(String s)`: 写入字符串。\n- `write(String s, int off,\
  \ int len)`: 写入字符串的局部。\n\n#### 9.6.2.2 CharArrayWriter 类\n\n`CharArrayWriter` 类用于将字符写入字符数组，数组的大小会根据需要扩展。\n\
  \n#### 构造函数：\n\n- `CharArrayWriter()`: 创建一个默认大小为 32 个字符的 `CharArrayWriter`。\n- `CharArrayWriter(int\
  \ num)`: 创建一个具有指定大小缓冲的 `CharArrayWriter`。\n\n\n\n\n\n*   `reset()`: 将缓冲区中的指针重置到上一次调用\
  \ `mark()` 方法的位置，如果未设置 mark，则重置到缓冲区开头。\n*   `toCharArray()`: 返回数据的拷贝。\n*   `toString()`:\
