  \ void viewScores() {\n        System.out.println(\"The scores are listed below:\"\
  );\n        for (int i = 0; i < 5; i++) {\n            System.out.print(score[i][0]\
  \ + \" \" + score[i][1]);\n            System.out.println();\n        }\n    }\n\
  \n    public static void main(String[] args) {\n        MultiDimenArray obj1 = new\
  \ MultiDimenArray();\n        obj1.viewScores();\n    }\n}\n```\n\n\n\n\n```java\n\
  score[2][0] = 76; score[2][1] = 65;\nscore[3][0] = 60; score[3][1] = 74;\nscore[4][0]\
