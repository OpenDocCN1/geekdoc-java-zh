  \ 允许通过将一个异常封装另一个异常内部来实现异常链，而不会实际上吞掉原始异常原因。异常包装表示捕获一个异常，将其封装在不同的异常中并抛出包装异常。\n\n异常链从\
  \ JDK 1.4 开始引入，为了支持该特性，Java 在 `Throwable` 类中引入了 `getCause()` 和 `initCause(Throwable)`，以及两个新构造函数\
  \ `Throwable(Throwable)` 和 `Throwable(String, Throwable)`。包装异常可以防止调用栈中较高层的代码了解调用栈底端异常的每一个细节。这是因为，异常越向顶层聚合，顶层方法所需的异常声明就越多，这使得每次代码更改时管理每一个异常都非常麻烦。\n\
  \n例如，假设一个类有一个抛出 `SQLException` 的方法。现在，使用该方法的类将必须捕获该异常。以后如果方法变为抛出 `RemoteException`、`IOException`\
  \ 以及其他几个异常，那么这些异常都必须在调用该方法的类中分别捕获。相反，可以创建一个通用异常，例如 `MyException`，每当这些任何一个异常发生时都可以抛出它并捕获它。因此，使用该方法的代码只需要处理一个异常。\n\
  \n下面的示例展示了包装异常的使用：\n\n```java\npublic class StandardException extends Exception\
  \ {\n    public StandardException() {\n    }\n\n    public StandardException(Throwable\
  \ cause) {\n        super(cause);\n    }\n\n    public StandardException(String\
  \ message, Throwable cause) {\n        super(message, cause);\n    }\n}\n```\n\n\
  在这里，`StandardException` 类是一个带有三个重载构造函数的自定义异常类。最后一个构造函数接受一个自定义消息和作为异常原因的 `Throwable`\
  \ 对象：\n\n```java\nimport java.util.Scanner;\n\npublic class StandardCalculator {\n\
  \    public static void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n\
