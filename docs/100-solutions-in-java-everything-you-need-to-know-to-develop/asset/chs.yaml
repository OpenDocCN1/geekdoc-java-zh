  \ 输出\n\n## 11.8 国际化元素\n\n在国际化应用程序中，让不同的 GUI 组件标题（如日期、时间、数字、文本等）根据文化、地区和语言进行修改是非常重要的。\n\
  \n### 11.8.1 数字格式化\n\nJava 提供了 `NumberFormat` 调用，这些方法可以根据语言区域识别并格式化数字。下面是该类的重要方法：\n\
  \n* `public static final NumberFormat getNumberInstance()`：返回 `NumberFormat` 类的对象。\n\
  * `public final String format(double number)`：返回格式化后数字的 `String` 形式。\n* `public\
  \ static NumberFormat getNumberInstance(Locale inLocale)`：为指定的 `Locale` 返回 `NumberFormat`\
  \ 类的对象。\n\n下面的代码演示了 `NumberFormat` 类的用法：\n\n```java\nimport java.text.NumberFormat;\n\
  import java.util.Locale;\nimport java.util.Scanner;\n\npublic class FormatNumber\
  \ {\n    static public void displayNumber(Locale currentLocale) {\n        Integer\
  \ num1 = 123374;\n        Double num2 = 343847.474;\n        NumberFormat numObj;\n\
  \        String value1;\n        String value2;\n        numObj = NumberFormat.getNumberInstance(currentLocale);\n\
  \        value1 = numObj.format(num1);\n        value2 = numObj.format(num2);\n\
  \        System.out.println(\"Number Format as per \" + currentLocale + \" is \"\
  \ + value1);\n        System.out.println(\"Number format as per \" + currentLocale\
  \ + \" is \" + value2);\n    }\n\n    public static void main(String[] args) {\n\
  \        String language;\n        String country;\n        Scanner s = new Scanner(System.in);\n\
  \    }\n}\n```\n\n\n\n\n```java\nString lCode = s.next();\n\nSystem.out.print(\"\
  Enter country code: \");\n\nString cCode = s.next();\n\nif (lCode.equals(\"\") ||\
  \ cCode.equals(\"\")) {\n    language = \"en\";\n    country = \"US\";\n} else {\n\
  \    language = lCode;\n    country = cCode;\n}\n\nLocale l;\nl = new Locale(language,\
  \ country);\ndisplayCurrency(l);\n}\n\npublic static void displayCurrency(Locale\
  \ l) {\n    NumberFormat currencyFormatter;\n    String strCurrency;\n    // Create\
  \ an object of a wrapper class Double\n    Double currency = 3847.78;\n    // Retrieve\
  \ the NumberFormat instance\n    currencyFormatter = NumberFormat.getCurrencyInstance(l);\n\
  \    // Format the currency\n    strCurrency = currencyFormatter.format(currency);\n\
  \    System.out.println(\"Currency as per \" + l + \" is \" + strCurrency);\n}\n\
  }\n```\n\n输出:\n\n![](img/Figure_11.10.jpg)\n\n图 11.10: 为特定区域设置格式化货币\n\n### 11.8.4\
  \ 格式化日期\n\nJava 提供 `DateFormat` 和 `SimpleDateFormat` 类来根据指定的区域格式化日期和时间。`NumberFormat`\
  \ 类的 `format()` 方法用于将要格式化的日期作为参数。\n\n`getDateInstance()` 方法返回 `DateFormat` 类的实例。\n\
  \n语法：\n\n```java\npublic static final DateFormat getDateInstance(int style, Locale\
  \ locale)\n```\n\n在这里，\n\n- `Style`: 以整数常量指定日期的格式。\n- `locale`: 一个 `Locale` 类的对象。\n\
  \n下面列出了 `DateFormat` 对象可能使用的整数常量：\n\n- `SHORT`：完全是数字的，例如，12.20.44 或 5:20 pm\n- `MEDIUM`:\
  \ 中等格式，例如，Feb 22, 2019\n- `LONG`: 较长格式，例如，February 22, 2019\n- `FULL`: 完整规格格式，例如，Friday,\
  \ February 22, 2019 AD\n\n以下代码演示了如何根据特定区域格式化日期：\n\n```java\nimport java.text.DateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport java.util.Scanner;\n\n\
  public class FormatDate {\n    public static void main(String[] args) {\n      \
  \  String language;\n        String country;\n        Scanner s = new Scanner(System.in);\n\
  \        System.out.print(\"Enter language code: \");\n        String lCode = s.next();\n\
  \        System.out.print(\"Enter country code: \");\n        String cCode = s.next();\n\
  \        if (lCode.equals(\"\") || cCode.equals(\"\")) {\n            language =\
  \ \"en\";\n            country = \"US\";\n        } else {\n            language\
  \ = lCode;\n            country = cCode;\n        }\n        Locale l;\n       \
  \ l = new Locale(language, country);\n        displayDate(l);\n    }\n\n    public\
  \ static void displayDate(Locale l) {\n        Date today;\n        String strDate;\n\
  \        DateFormat dateFormatter;\n        dateFormatter = DateFormat.getDateInstance(DateFormat.FULL,\
  \ l);\n        today = new Date();\n        strDate = dateFormatter.format(today);\n\
  \        System.out.println(\"Date format as per \"+ l + \" is \"+strDate);\n  \
  \  }\n}\n```\n\n输出:\n\n![](img/Figure_11.11.jpg)\n\n图 11.11: 为特定区域格式化日期\n\n### 11.8.5\
  \ 格式化消息\n\n对于静态消息，翻译是简单的；但对于带有动态数据的消息，翻译到不同语言非常困难，因为这些语句在语法上可能是不正确的。\n\n例如，考虑以下英语消息：\n\
  \"Her birthday is on 05/02/2007\"\n\n该语句的法语翻译：\n\"Son anniversaire est le 05/02/2007\"\
  \n\n该语句的西班牙语翻译：\n\"Su cumpleaños es el 05/02/2007\"\n\n由于动词和动态数据的顺序在不同语言中不同，因此在这些情况下，通过拼接来形成语法正确的语句是困难的。Java\
  \ 提供了 `MessageFormat` 类来创建此类动态复合消息。要使用 `MessageFormat` 类，识别消息的静态部分和变量部分非常重要。\n\n\
  例如，考虑以下消息：\nHer birthday party is on February 05, 2019, at 6:30 PM and 10 people\
  \ are invited.\n\n这里有三个用**粗体文本**指示的变量部分。\n\n接下来，需要根据变量部分在文本中的位置创建一个带有 `{0}`、`{1}`\
  \ 等占位符的模板。这些占位符将在运行时使用 `Object` 数组被实际值替换。\n\n需要翻译的元素应该通过 `getString()` 方法从 `ResourceBundle`\
  \ 获取。使用目标区域的 `MessageFormat` 实例来格式化消息。\n\n以下代码演示了如何根据特定区域格式化消息。创建以下消息包/属性文件：\n\n\
  `MessageFormatBundle.properties`（等待，这是一个文件名，请使用反引号）\n`MessageFormatBundle.properties`\n\
  `template = Her birthday party is on {0,date,long} at {1,time,short} and {2,number,integer}\
  \ people are invited.`\n\n`MessageFormatBundle_es_CR.properties`（用于西班牙语）\n`template\
  \ = Su cumpleaños es el {0,date,long} a {1,time,short} y están invitadas {2,number,integer}\
  \ personas.`\n\n`MessageFormatBundle_ja_JP.properties`（用于日语）\n`template = Kanojo\
  \ no tanjō wa {0,date,long} no {1,time,short} de {2,number,integer} ga remasu.`\n\
  \n注意变量数据被替换。使用国际化的代码：\n\n```java\nimport java.util.Scanner;\nimport java.text.MessageFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport java.util.ResourceBundle;\n\
  \npublic class MsgDemo {\n    public static void main(String[] args) {\n       \
  \ try {\n            MessageFormat formatter = new MessageFormat(\"\");\n      \
  \      String language;\n            String country;\n            Scanner s = new\
  \ Scanner(System.in);\n            System.out.print(\"Enter language code: \");\n\
  \            String lCode = s.next();\n            System.out.print(\"Enter country\
  \ code: \");\n            String cCode = s.next();\n            if (lCode.equals(\"\
  \") || cCode.equals(\"\")) {\n                language = \"en\";\n             \
  \   country = \"US\";\n            } else {\n                language = lCode;\n\
  \                country = cCode;\n            }\n            Locale l;\n      \
  \      l = new Locale(language, country);\n            formatter.setLocale(l);\n\
  \            ResourceBundle messages = ResourceBundle.getBundle(\"MessageFormatBundle\"\
  , l);\n            // 为位置 0、1 和 2 设置值\n            Object[] messageArguments = {new\
  \ Date(), new Date(), 7};\n            formatter.applyPattern(messages.getString(\"\
  template\"));\n            String output = formatter.format(messageArguments);\n\
  \            System.out.println(output);\n        } catch (Exception e) {\n    \
  \        System.out.println(\"Error:\" + e.getMessage());\n        }\n    }\n}\n\
  ```\n\n输出:\n\n![](img/Figure_11.12.jpg)\n\n图 11.12: 为特定区域格式化消息\n\n同样，其他消息也可以根据特定区域进行格式化。\n\
  \n## 总结\n\n在本章中，你了解到设计模式是解决问题的方案、最佳实践或模板。`instanceof` 运算符用于比较对象与另一个实例以检查其类型是否相同。创建型模式提供了使用\
  \ `new` 运算符创建对象的不同方法，并隐藏了创建逻辑。结构型模式处理类和对象的组合。行为型模式处理不同对象之间的通信。委托是一个概念，允许对象将任务传递给相似类型的对象，该对象被称为委托。为了适应不同的区域和用户偏好，可以使用国际化和本地化。国际化也称为\
  \ i18n，代表第一个字母 i、最后一个字母 n 以及中间的 18 个字母。`ResourceBundle` 对象包含区域特定的对象，并用于从属性文件中检索区域特定的信息。\n\
