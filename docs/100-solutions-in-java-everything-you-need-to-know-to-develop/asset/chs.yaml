  \ \" + normal.count());\n\n// 计算所有订单的总价值\ndouble value = orders.stream().mapToDouble((Order\
  \ o) -> o.price()).sum();\nSystem.out.println(\"Total amount of orders: \" + value);\n\
  \nlong quantity = orders.stream().mapToLong((Order o) -> o.quantity()).sum();\n\
  System.out.println(\"Total quantity of orders: \" + quantity);\n}\n```\n\n在这里，创建并初始化了一个\
  \ `Order` 类型的 `ArrayList`。使用 `Stream` API 为该 `ArrayList` 创建了一个流。接下来，使用 `filter()`\
  \ 方法根据类型过滤订单。使用 `mapToDouble()` 和 `mapToLong()` 方法配合 `sum()` 分计算订单总金额和总数量。注意使用 lambda\
  \ 表达式将代码简化为单行语句。代码的输出所示：\n\n![](img/Figure_7.23.png)\n\n图 7.23: Stream API 输出\n\n\
  以下是关于 Stream API 的一些重要点：\n\n- Stream 操作主要分为两种类型：中间操作和终端操作。中间操作进一步分为两类：无状态和有状态。\n\
  - 像 `map()` 或 `filter()` 这样的中间操作会返回一个新的 `Stream`，而像 `Stream.forEach()` 这样的终端操作会产生结果/副作用。\n\
  - 一旦完成终端操作，流流水线被认为已消耗，不能再次使用。\n- 无状态操作不保留之前处理元素的状态。无状态操作的示例有 `filter()` 和 `map()`。\n\
  - 有状态操作在处理新元素时会保留之前处理元素的状态。有状态操作的示例有 `distinct()` 和 `sorted()`。\n- `Stream` API\
  \ 可以以顺序和并行方式处理 `Collection`，以支持批量数据操作。例如，可以如下所示创建顺序流和并行流：\n\n```java\nList<Order>\
  \ orders = getListOfOrders();\n// 顺序\nStream<Order> streamSeq = orders.stream();\n\
  // 并行\nStream<Order> streamPar = orders.parallelStream();\n```\n\n`Collection` 接口现在通过\
  \ `stream()` 方法提供流支持，该方法返回一个以该集合为源的顺序 `Stream`。然后可以使用该流引用来对集合执行批量数据操作。\n- `Stream`\
  \ 不修改源数据/集合。每项操作都会创建一个新的 `Stream`，而原始集合保持不变。\n- 流不能重用，因为关闭的流将像下面所示抛出 `IllegalStateException`：\n\
  \n```\nException in thread \"main\" java.lang.IllegalStateException: stream has\
  \ already been operated upon or closed\nat java.util.stream.AbstractPipeline …\n\
  ....\n```\n\n### 7.10.1 Java 9 中 Stream API 的改进\n\nJava 9 在 `Stream` API 中提供了一些新增内容和增强，列举如下。Java\
  \ 9 引入了一些实用方法，以补充 Java 8 提供的方法：\n\n- `takewhile(Predicate Interface)` 和 `dropwhile(Predicate\
  \ Interface)` 方法：这两个方法接受一个类型为谓词函数式接口的参数。正如名称所示，`takewhile()` 将接受所有值，直到谓词返回 false，而\
  \ `dropwhile()` 将丢弃所有值，直到谓词返回 false。\n\n在 Java 8 中，`filter()` 方法在匹配条件时会保留所有元素，而\
  \ `takewhile()` 则在遇到不符合条件的元素时停止。例如，一个 `Stream` 将由从该流中提取的匹配给定谓词的最长前缀组成（有序流）。\n\n\
  `Dropwhile` 会丢弃开头谓词为真的元素。例如，它将返回一个 `Stream`，由丢弃匹配给定谓词的最长前缀后该流的剩余元素组成（有序流）。在无序情况下，两者都根据其定义返回元素的子集。\n\
  \n下面的示例解释了 `takewhile()` 和 `dropwhile()` 的工作原理：\n\n```java\nimport java.util.stream.Stream;\n\
  \npublic class Java9Streams {\n    public static void main(String[] args) {\n  \
  \      Stream.of(\"h\", \"e\", \"l\", \"\", \"l\", \"o\").takeWhile(s -> !s.isEmpty()).forEach(System.out::print);\n\
  \        System.out.println(\"\");\n        Stream.of(\"h\", \"e\", \"l\", \"\"\
  , \"l\", \"o\").dropWhile(s -> !s.isEmpty()).forEach(System.out::print);\n    }\n\
  }\n```\n\n代码的输出如下：\n```\nhel\nlo\n```\n在此示例中，`takewhile()` 接收值，直到遇到空字符串时停止。`dropwhile()`\
  \ 则丢弃直到遇到空字符串。\n\n- `iterate()` 方法：`iterate()` 方法接受两个参数，一个初始化器（也称为种子），另一个是应用于上一个元素的函数以产生新元素。然而，该方法的缺点是缺少终止条件。例如：\n\
  \n```java\nStream.iterate(1, count->count+2).forEach(System.println);\n```\n\n此语句将无限执行。Java\
  \ 9 通过添加终止子句更新了 `iterate()` 方法，使其可以像循环一样工作。\n\n语法：`iterate(初始化部分; predicate 部分;\
  \ next 部分)`\n\n该 `iterate()` 方法会在 `hasNext` 部分返回 false 时停止。下面的示例展示了 `iterate()`\
  \ 方法的使用：\n\n```java\nimport java.util.stream.IntStream;\nimport java.util.stream.Stream;\n\
  \npublic class Java9Streams {\n    public static void main(String[] args) {\n  \
  \      IntStream.iterate(2, x -> x < 8, x -> x+2).forEach(System.out::println);\n\
  \    }\n}\n```\n\n在这里，值初始化为 2，每次增加 2。谓词条件指示 `x` 应该小于 8。因此，输出为 2、4 和 6。\n\n- `ofNullable()`\
  \ 方法：`ofNullable` 方法在 Java 9 中引入，用于在值为空时返回空的 Optional。这有助于避免空指针异常并减少在代码中添加大量的空值检查。如果值不为空，它返回一个包含单个元素的顺序流，否则返回一个空流。例如：\n\
  \n```java\nStream.ofNullable(100).count();\nStream.ofNullable(null).count();\n```\n\
  \nJava 8 之前\n```java\nEmployee e1= getEmployee(empId);\nStream<Roles> roles=e1==\
  \ null? Stream.empty(): e1.roles();\n```\n在这里，在操作之前进行了空值检查，因为 `getEmployee()` 方法可能返回\
  \ null。在 Java 9 中，可以通过如下所示的 `ofNullable()` 方法来避免这种情况：\n\n```java\nEmployee e1= getEmployee(empId);\n\
  Stream.ofNullable(e1).flatMap(Employee::roles)\n```\n\n\n\n\n在本章中，你学习了 `java.util`\
  \ 包提供了若干种用于不同功能的工具类和接口。集合（Collection）是一个容器对象，有助于将多个元素分组到单个单元中。`Iterable` 接口属于 `java.lang`\
  \ 包，是所有需要迭代器功能的类和接口的顶层接口。`Collection` 接口是属于集合框架的接口和类的顶层接口。Java 9 引入了工厂方法，这是一种特殊的静态方法，用于创建不可修改的/不可变的集合实例。`Lists`（列表）是有序的集合，允许包含重复值和多个\
  \ `null` 元素。`Queue`（队列）接口表示队列数据结构，通常元素按照先进先出（FIFO）的顺序排列。`Set`（集合）是一个无序且不重复的对象引用列表的集合。`Map`\
  \ 对象以键值对的形式存储数据，每个键都映射到单个值。`java.util.Arrays` 类提供了方法，用于在数组上执行排序、搜索等操作。`Comparable`\
  \ 接口属于 `java.lang` 包，而 `Comparator` 接口属于 `java.util` 包，它们用于对用户定义类的对象进行排序。Java 8\
  \ 引入了 Streams API，即 `java.util.stream` 包，允许对 Java 集合的元素进行并行处理。\n\n在下一章中，你将学习泛型（Generics）和时间\
  \ API。\n\n## 单选题\n\n1. 下列哪种集合允许重复值？\n    1. `HashSet`\n    2. `TreeSet`\n    3.\
