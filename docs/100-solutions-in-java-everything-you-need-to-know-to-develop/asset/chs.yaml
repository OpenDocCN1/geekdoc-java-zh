  \nFigure 10.9: Synchronized block\n\n### 10.6.2 Synchronized method\n\nSynchronization\
  \ can also be implemented by using a synchronized method that uses the `synchronized`\
  \ keyword. A thread that accesses the synchronized method acquires the lock and\
  \ other threads need to wait till the current thread releases the lock.\n\nThe following\
  \ code demonstrates the use of the synchronized method to prevent race conditions:\n\
  \n**[/content]**\n\n译文：\n\n```java\npublic Transaction(BankAccount a1, double amt)\
  \ {\n    this.a1 = a1;\n    amount = amt;\n    t = new Thread(this);\n    t.start();\n\
  }\n\n@Override\npublic void run() {\n    // 同步块\n    synchronized (a1) {\n     \
  \   a1.depositAmount(amount);\n        a1.showBalance();\n    }\n}\n}\n```\n\n在这里，`synchronized`\
  \ 块调用了 `depositAmount()` 方法并确保账户保持一致状态，因为同一时间只有一个线程可以访问该方法。代码的输出如下，见图 10.9：\n\n\
  ![](img/Figure_10.9.jpg)\n\n图 10.9：同步块\n\n### 10.6.2 同步方法\n\n同步也可以通过使用带有 `synchronized`\
  \ 关键字的同步方法来实现。访问同步方法的线程会获取锁，其他线程需要等待直到当前线程释放锁。\n\n以下代码演示了如何使用同步方法来防止竞争条件：\n\n```java\n\
  public class TestSynchronizedMethod {\n    public static void main(String[] args)\
  \ {\n        TrackLine obj = new TrackLine();\n        // 创建两个共享同一个 Line 对象的线程\n\
  \        Train t1 = new Train(obj);\n        Train t2 = new Train(obj);\n      \
  \  // 两个线程开始执行\n        t1.start();\n        t2.start();\n    }\n}\n\nclass TrackLine\
  \ {\n    // 如果多个线程（火车）尝试在\n    // 同一个对象上访问此同步方法\n    // 则同一时间只有一个线程能够执行它。\n    synchronized\
  \ public void getLine(Thread t) {\n        System.out.println(\"Thread \"+t.getName());\n\
  \        for (int i = 0; i < 3; i++) {\n            System.out.println(\"Accessing\
  \ line \"+i);\n            try {\n                Thread.sleep(400);\n         \
  \   } catch (Exception e) {\n                System.out.println(e);\n          \
  \  }\n        }\n    }\n}\n\nclass Train extends Thread {\n    // Line 类对象\n   \
  \ TrackLine l1;\n    Train(TrackLine line) {\n        this.l1 = line;\n    }\n \
  \   @Override\n    public void run() {\n        l1.getLine(this);\n    }\n}\n```\n\
  \n在这里，只有一个线程可以访问 `getLine()` 方法，因为它已经被同步化了。代码的输出如下，见图 10.10：\n\n![](img/Figure_10.10.jpg)\n\
  \n图 10.10：同步方法\n\n### 10.6.3 Wait-notify 机制\n\nwait-notify 机制是一种让线程等待一段时间以运行另一个线程，并在完成后唤醒它的方法。这是通过使用\
  \ `wait()` 和 `notify()` 方法来实现的，确保两个竞争线程之间资源的一致状态：\n\n- `wait()`：将当前线程置于等待状态，直到另一个线程释放对资源的锁并通知它。`wait()`\
  \ 方法只能在同步代码块中调用。\n    - `wait()`：导致当前线程无限期等待，直到另一个线程在该对象上调用 `notify()` 或 `notifyAll()`\
  \ 方法。\n    - `wait(long timeout)`：允许指定超时时间，超时后等待线程将被自动唤醒。要在超时前唤醒线程，请使用 `notify()`\
  \ 或 `notifyAll()`。\n    - `wait(long timeout, int nanos)`：与之前的 `wait()` 版本相似，不同之处在于允许指定更高精度的超时时间。总超时时间（纳秒）计算公式为\
  \ `1_000_000*timeout + nanos`。\n- `notify()`：随机通知任何一个等待获取共享资源锁的线程。线程的选择是非确定性的，并根据实现方式随机进行。\n\
  - `notifyAll()`：唤醒所有等待获取共享资源锁的线程。\n\n以下生产者-消费者示例演示了 wait-notify 机制：\n\n```java\n\
  public class Producer implements Runnable {\n    private final List<Integer> queue;\n\
  \    private final int SIZE;\n\n    public Producer(List<Integer> queue, int size)\
  \ {\n        this.queue = queue;\n        SIZE = size;\n    }\n\n    @Override\n\
  \    public void run() {\n        int counter = 0;\n        while (true) {\n   \
  \         try {\n                produce(counter++);\n            } catch (InterruptedException\
  \ ex) {\n                ex.printStackTrace();\n            }\n        }\n    }\n\
  \n    private void produce(int i) throws InterruptedException {\n        synchronized\
  \ (queue) {\n            while (queue.size() == SIZE) {\n                System.out.println(\"\
  Queue is full \" + Thread.currentThread().getName() + \" is waiting , size: \" +\
  \ queue.size());\n                queue.wait();\n            }\n            Thread.sleep(3000);\n\
  \            queue.add(i);\n            System.out.println(\"Produced: \" + i);\n\
  \            queue.notifyAll();\n        }\n    }\n}\n```\n\n`Producer` 类通过增加计数器生成数字。`produce()`\
  \ 方法包含一个同步块，一次只允许一个线程访问。`wait()` 方法让当前线程无限等待，直到收到来自 `notify()` 或 `notifyAll()` 方法的唤醒调用。`sleep()`\
  \ 方法让当前线程睡眠 3 秒。一旦当前线程完成，`notifyAll()` 方法会唤醒线程：\n\n```java\npublic class Consumer\
  \ implements Runnable {\n    private final List<Integer> queue;\n\n    public Consumer(List<Integer>\
  \ queue) {\n        this.queue = queue;\n    }\n\n    @Override\n    public void\
  \ run() {\n        while (true) {\n            try {\n                consume();\n\
  \            } catch (InterruptedException ex) {\n                ex.printStackTrace();\n\
  \            }\n        }\n    }\n\n    private void consume() throws InterruptedException\
  \ {\n        synchronized (queue) {\n            while (queue.isEmpty()) {\n   \
  \             System.out.println(\"Queue is empty \" + Thread.currentThread().getName()\
  \ + \" is waiting , size: \" + queue.size());\n                queue.wait();\n \
  \           }\n            int i = queue.remove(0);\n            System.out.println(\"\
  Consumed: \" + i);\n        }\n    }\n}\n```\n\n（注：由于您提供的文本在最后出现了重复和截断，上述翻译已涵盖了所有提供的文本内容。）\n\
  \n\n\n\n\n```java\nSystem.out.println(\"Thread 2: Holding Resource1 & 2\");\n}\n\
  ```\n\n在这里，`Thread 1`  获取了 `resource1` 然后尝试获取 `resource2`，而 `Thread 2` 则获取了 `resource2`\
  \ 然后尝试获取 `resource1`。在执行过程中，这两个线程进入了死锁状态，因为它们都在等待对方释放对资源的锁。代码的输出如图 10.13 所示：\n\n\
  ![](img/Figure_10.13.jpg)\n\n图 10.13：死锁示例\n\n在实现多线程编程时，预防死锁是非常关重要的。以下是防止死锁的一些点：\n\
  \n-   为多个线程按照定义的顺序获取锁。\n-   应避免一次性锁定多个资源。\n\n例如，在上面的代码中，如果修改了 `Thread 2` 的锁定顺序，就可以避免死锁。以下代码演示了前面代码中遇到的死锁的解决方法：\n\
  \n```java\npublic class DeadlockSolution {\n\n    public static Object resource1\
  \ = new Object();\n    public static Object resource2 = new Object();\n\n    public\
  \ static void main(String args[]) {\n        Thread1 t1 = new Thread1();\n     \
  \   Thread2 t2 = new Thread2();\n        t1.start();\n        t2.start();\n    }\n\
  \n    private static class Thread1 extends Thread {\n        @Override\n       \
  \ public void run() {\n            synchronized (resource1) {\n                System.out.println(\"\
  Thread 1: Holding Resource 1\");\n                try {\n                    Thread.sleep(10);\n\
  \                } catch (InterruptedException e) {\n                }\n       \
  \         System.out.println(\"Thread 1: Waiting for Resource 2\");\n          \
  \      synchronized (resource2) {\n                    System.out.println(\"Thread\
  \ 1: Holding Resource 1 & 2\");\n                }\n            }\n        }\n \
  \   }\n\n    private static class Thread2 extends Thread {\n        @Override\n\
  \        public void run() {\n            synchronized (resource1) {\n         \
  \       System.out.println(\"Thread 2: Holding Resource 1\");\n                try\
  \ {\n                    Thread.sleep(10);\n                } catch (InterruptedException\
  \ e) {\n                }\n                System.out.println(\"Thread 2: Waiting\
  \ for Resource 2\");\n                synchronized (resource2) {\n             \
  \       System.out.println(\"Thread 2: Holding Resource 1 & 2\");\n            \
  \    }\n            }\n        }\n    }\n}\n```\n\n对 `Resource 1` 和 `Resource 2`\
  \ 的访问顺序已被修改并保持一致，以避免死锁。代码的输出如图 10.14 所示：\n\n![](img/Figure_10.14.jpg)\n\n图 10.14：死锁解决\n\
  \n## 10.7 并发集合 API](#contents.xhtml_sc2_265a)\n\n并发集合 API 自 Java 5 起被添加到了 `java.util.concurrent`\
  \ 包中。这些 API 允许多个线程并发地访问集合。这些 API 支持同步和锁、并发集合以及线程池等功能。以下是 `java.util.concurrent`\
  \ 包中的一些重要接口：\n\n-   `BlockingQueue`：它定义了一个先进先出（FIFO）数据结构，在尝试向满队列添加元素或从空队列检索元素时会阻塞或超时。\n\
  -   `ConcurrentMap`：它是 `java.util.Map` 的子接口。它包含重要的原子操作，例如仅在键存在时才移除或替换键值对，或仅在键不存在时才添加键值对。这些原子操作有助于避免同步。\n\
  -   `ConcurrentHashMap`：它是 `ConcurrentMap` 的标准通用型实现。它是集合 `HashMap` 的并发版本。\n-   `ConcurrentNavigableMap`：它是\
  \ `ConcurrentMap` 的子接口。它支持近似匹配。\n-   `ConcurrentSkipListMap`：它是 `ConcurrentNavigableMap`\
  \ 的标准通用型实现。它是 `TreeMap` 的并发版本。\n\n以下代码演示了并发集合的使用：\n\n```java\nimport java.util.Random;\n\
  import java.util.concurrent.BlockingQueue;\nimport java.util.concurrent.LinkedBlockingQueue;\n\
  \npublic class ConcurrentCollectionExample {\n\n    static BlockingQueue<Integer>\
  \ queue1 = new LinkedBlockingQueue<>(5);\n\n    public static void main(String[]\
  \ args) throws InterruptedException {\n        int noOfProducers = 7;\n        int\
  \ noOfConsumers = 9;\n        for (int i = 0; i < noOfProducers; i++) {\n      \
  \      new Thread(new Producer(), \"PRODUCER \"+i).start();\n        }\n       \
  \ for (int i = 0; i < noOfConsumers; i++) {\n            new Thread(new Consumer(),\
  \ \"CONSUMER \"+i).start();\n        }\n        System.exit(0);\n    }\n\n    static\
  \ class Producer implements Runnable {\n        Random random = new Random();\n\
  \        @Override\n        public void run() {\n            try {\n           \
  \     int num = random.nextInt(100);\n                queue1.put(num);\n       \
  \         System.out.println(Thread.currentThread().getName() + \" produced: \"\
  \ + num + \" Queue size : \"+ queue1.size());\n                Thread.sleep(100);\n\
  \            } catch (InterruptedException ex) {\n                System.out.println(\"\
  Producer \" + Thread.currentThread().getName() + \" is interrupted.\");\n      \
  \      }\n        }\n    }\n\n    static class Consumer implements Runnable {\n\
  \        @Override\n        public void run() {\n            try {\n           \
  \     System.out.println(Thread.currentThread().getName() + \" consumed: \" + queue1.take()\
  \ + \" Queue size : \"+ queue1.size());\n                Thread.sleep(100);\n  \
  \          } catch (InterruptedException ex) {\n                System.out.println(\"\
  Consumer \" + Thread.currentThread().getName() + \" is interrupted.\");\n      \
  \      }\n        }\n    }\n}\n```\n\n\n\n\n\n从 Java 5 开始，通过提供 `java.util.concurrent.atomic`\
  \ 包增加了对单变量原子操作的支持。该包中的所有类都包含 getter 和 setter 方法，其工作方式与对 `volatile` 变量的读写类似。在 Java\
  \ 5.0 中，为 `int`、`long`、`Boolean` 和引用值增加了几个原子变量。列出如下：\n\n- `AtomicInteger`\n- `AtomicLong`\n\
  - `AtomicBoolean`\n- `AtomicReference`\n\n这些类通过 `get()`、`set()`、`getAndSet()` 和\
  \ `compareAndSet()` 等方法支持比较并交换（compare-and-set）操作。使用 `AtomicInteger` 修改后的计数器示例所示：\n\
  \n```java\npublic class AtomicCounter {\n    private final AtomicInteger count =\
  \ new AtomicInteger(0);\n\n    public int getCount(){\n        return count.get();\n\
  \    }\n\n    public int getNextCount(){\n        return count.incrementAndGet();\n\
  \    }\n\n    public int getPreviousCount(){\n        return count.decrementAndGet();\n\
  \    }\n}\n```\n\n这段代码的执行速度比 `synchronized` 版本快，并且是线程安全的。`incrementAndGet()` 和 `decrementAndGet()`\
  \ 方法是 `AtomicLong` 和 `AtomicInteger` 类支持的数值操作。这些方法分别将计数加一或减一。\n\n列出其他其他重要方法：\n\n\
  - `getAndDecrement()`：原子地将当前值减 1。\n- `getAndIncrement()`：原子地将当前值加 1。\n- `getAndAdd(int\
  \ i)`：原子地将给定的值加到当前值。\n- `addAndGet(int i)`：原子地将给定的值加到当前值。\n\n如下所示使用 `compareAndSet`\
  \ 增加计数器的代码：\n\n```java\npublic void increment(AtomicInteger integer){\n    while(true){\n\
  \        int counter = integer.get();\n        int next = counter + 1;\n       \
  \ if(integer.compareAndSet(counter, next)){\n            return;\n        }\n  \
  \  }\n}\n```\n\n代码变得复杂了，但非阻塞算法就是这样。检测到冲突并重试，直到操作成功完成。以下代码演示了多个线程访问 `AtomicInteger`\
  \ 的用法：\n\n```java\nimport java.util.concurrent.atomic.AtomicInteger;\n\npublic class\
  \ AtomicExample {\n    public static void main(String[] args) throws InterruptedException\
  \ {\n        Threads t = new Threads();\n        Thread t1 = new Thread(t, \"Thread\
  \ 1\");\n        t1.start();\n        Thread t2 = new Thread(t, \"Thread 2\");\n\
  \        t2.start();\n        t1.join();\n        t2.join();\n        System.out.println(\"\
  Thread counter = \" + t.getCounter());\n    }\n}\n\nclass Threads implements Runnable\
  \ {\n    private AtomicInteger counter = new AtomicInteger();\n\n    @Override\n\
  \    public void run() {\n        for (int i = 1; i < 5; i++) {\n            doSomething(i);\n\
  \            counter.incrementAndGet();\n        }\n    }\n\n    public int getCounter()\
  \ {\n        return this.counter.get();\n    }\n\n    private void doSomething(int\
  \ i) {\n        System.out.println(\"Processing...\");\n        try {\n        \
  \    Thread.sleep(i * 1000);\n        } catch (InterruptedException e) {\n     \
  \       e.printStackTrace();\n        }\n    }\n}\n```\n\n在这里，多个线程尝试访问原子变量 `counter`\
  \ 并使用 `incrementAndGet()` 方法增加其值。代码的输出所示图 10.16：\n\n![](img/Figure_10.16.jpg)\n\n\
  图 10.16：原子变量\n\n## 10.9 java.util.concurrent.locks 包](#contents.xhtml_sc2_268a)\n\
  \nJava 通过 `java.util.concurrent.locks` 包提供了另一种线程同步机制。它类似于 `synchronized` 块，但比 `synchronized`\
  \ 块提供了更大的灵活性。\n\n列出 `synchronized` 块和 `Lock` 的一些区别：\n\n- 线程获取 `synchronized` 块的顺序是不保证的。\n\
  - `synchronized` 块无法传递参数。因此，无法为尝试访问同步块设置超时。\n- `synchronized` 块必须完全包含在单个方法内，而 `Lock`\
  \ 可以将 `lock()` 和 `unlock()` 的调用放在不同的方法中。\n\n列出 `Lock` 接口的方法：\n\n- `lock()`：获取锁。\n\
  - `lockInterruptibly()`：获取锁，除非当前线程被另一个线程中断。\n- `newCondition()`：返回一个绑定到此 `Lock`\
  \ 实例的新 `Condition` 实例。\n- `tryLock()`：仅在调用时锁是空闲时才获取锁。\n- `tryLock(long time, TimeUnit\
  \ unit)`：如果在给定的等待时间内锁可用且当前线程未被中断，则获取锁。\n- `unlock()`：释放锁。\n\n### Lock 实现类\n\n- `ReentrantLock`\n\
  - `ReentrantReadWriteLock.ReadLock`\n- `ReentrantReadWriteLock.WriteLock`\n\n`Lock`\
  \ 是一个接口；因此，可以通过它的实现之一来使用，如下：\n\n```java\nLock lock = new ReentrantLock();\nlock.lock();\n\
  //临界区\nlock.unlock();\n```\n\n`Lock` 实例通过调用 `lock()` 方法创建并锁定，其他线程将被阻塞直到 `unlock()`\
  \ 被调用。下表显示了使用 `synchronized` 块和 `Lock` 应用的锁：\n\n| `public class Counter{private\
  \ int count = 0;public int updateCount(){synchronized(this){return count++;}}}`\
  \ | `public class Counter{private Lock lock = new ReentrantLock();private int count\
  \ = 0;public int updateCount();}}` |\n\n在第一个示例中，`updateCount()` 方法中的 `synchronized(this)`\
  \ 块确保只有一个线程可以执行 `++count`。在第二个示例中，使用了 `Lock` 而不是 `synchronized` 块来编写代码。\n\n## 10.10\
  \ Executors 和线程池](#contents.xhtml_sc2_269a)\n\n\n\n\n\n`JVM` 创建的多个活动线程可能会以快速速度消耗系统资源，导致系统内存耗尽。因此，限制创建的线程数量是非常重要的。线程池通过重用现有线程来执行新任务，从而减少了线程周期的开销。这消除了由线程创建引起的延迟，并使应用程序响应更快。\n\
  \n线程池可以如下所示使用：\n\n*   创建 `ExecutorService` 对象并向其传递一组任务。\n*   使用 `ThreadPoolExecutor`\
  \ 类设置核心池大小和最大池大小。\n\n由特定线程执行的 `Runnable` 对象是按顺序执行的。下面列出了 `Executor` 线程池工厂方法：\n\n\
  *   `newFixedThreadPool(int)`：创建一个固定大小的线程池。\n*   `newCachedThreadPool()`：创建一个在需要时创建新线程的线程池，但在之前构建的线程可用时将重用它们。\n\
  *   \n`newSingleThreadExecutor()`：创建一个单次只执行单个线程的执行器。\n\n固定池是最常见的线程池类型，允许运行特定数量的线程。如果池中所有线程都被占用，等待的任务将存放在队列中，直到某个线程空闲。以下代码演示了\
  \ `Executors` 的用法：\n\n```\nimport java.util.concurrent.ExecutorService;\nimport\
  \ java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\npublic\
  \ class ExecutorDemo {\n\n    private static ExecutorService exe1 = null;\n    private\
  \ static volatile Future task1 = null;\n    private static volatile Future task2\
  \ = null;\n    private static volatile Future task3 = null;\n\n    public static\
  \ void main(String[] args) {\n        exe1 = Executors.newFixedThreadPool(2);\n\
  \        while (true) {\n            try {\n                taskStatus();\n    \
  \            Thread.sleep(2000);\n            } catch (Exception e) {\n        \
  \        System.err.println(\"Error: \" + e.getMessage());\n            }\n    \
  \    }\n    }\n\n    private static void taskStatus() throws Exception {\n     \
  \   if (task1 == null || task1.isDone() || task1.isCancelled()) {\n            task1\
  \ = exe1.submit(new ThreadClass1());\n        }\n        if (task2 == null || task2.isDone()\
  \ || task2.isCancelled()) {\n            task2 = exe1.submit(new ThreadClass2());\n\
  \        }\n        if (task3 == null || task3.isDone() || task3.isCancelled())\
  \ {\n            task3 = exe1.submit(new ThreadClass2());\n        }\n    }\n}\n\
  \nclass ThreadClass1 implements Runnable {\n    public void run() {\n        while\
  \ (true) {\n            System.out.println(\"Executing task one\");\n          \
  \  try {\n                Thread.sleep(1000);\n            } catch (Throwable e)\
  \ {\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\n\
  class ThreadClass2 implements Runnable {\n    public void run() {\n        while\
  \ (true) {\n            System.out.println(\"Executing task two\");\n          \
  \  try {\n                Thread.sleep(1000);\n            } catch (Throwable e)\
  \ {\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\n\
  class ThreadClass3 implements Runnable {\n    public void run() {\n        while\
  \ (true) {\n            System.out.println(\"Executing task three\");\n        \
  \    try {\n                Thread.sleep(1000);\n            } catch (Throwable\
  \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
  }\n```\n\n在这里，创建了三个任务，线程池大小固定为 2。线程被前两个任务利用。在两个线程中的一个变得空闲之前，第三个任务无法执行。输出如下，见图 10.17：\n\
  \n![](img/Figure_10.17.jpg)\n\n图 10.17：`Executors` 和线程池\n\n## 10.10.2 ForkJoinPool\n\
  \nJava 7 引入了 `ForkJoinPool` 类，它是 `AbstractExecutorService` 的扩展，类似于 `ExecutorService`\
  \ 接口。然而，`ForkJoinPool` 允许任务递归将作业拆分为更小的子任务，并将其重新提交给 `ForkJoinPool`。这允许利用多个处理器，并可以大幅提升应用程序性能。\n\
  \nFork 和 Join 原理涉及两个步骤，即 `fork` 和 `join`，它们是递归执行的：\n\n*   **Fork**：在这一步中，任务被拆分为多个较小的子任务，并在多个处理器上或通过同一处理器上的不同线程并发执行（图\
  \ 10.18）：\n\n![](img/Figure_10.18.jpg)\n\n图 10.18：Fork\n\n*   **Join**：在这一步中，执行完毕的子任务可以合并（join）为一个结果。所有类型的任务可能不会返回结果。在这种情况下，任务将等待子任务完成，并进行无结果的合并。（见图\
  \ 10.19）：\n\n![](img/Figure_10.19.jpg)\n\n图 10.19：Join\n\n| 注意：将任务拆分为子任务的合理限制也称为阈值（threshold）。它取决于正在执行的工作类型。\
  \ |\n\n下面是实现 Fork 和 Join 的步骤：\n\n*   编写执行任务工作的子类代码：\n  ```\n  如果任务大于阈值\n  将任务拆分为子任务\n\
  \  ```\n*   使用 `ForkTask` 的子类来执行任务：\n  ```\n  如果任务大于阈值\n  将任务拆分为子任务\n  ```\n*  \
  \ 等待子任务的结果：\n  ```\n  调用子任务\n  ```\n*   否则：\n  ```\n  执行任务\n  ```\n以下代码演示了 Fork\
  \ 和 Join 的实现：\n\n```\nimport java.util.ArrayList;\nimport java.util.List;\nimport\
  \ java.util.concurrent.ForkJoinPool;\nimport java.util.concurrent.RecursiveAction;\n\
  \npublic class ForkJoinDemo extends RecursiveAction {\n\n    private long task =\
  \ 0;\n\n    public ForkJoinDemo(long task) {\n        this.task = task;\n    }\n\
  \n    @Override\n    protected void compute() {\n        try {\n            //负载大于\
  \ 16\n            if (task > 16) {\n                System.out.println(\"拆分任务：\"\
  \ + task);\n                List<ForkJoinDemo> lstSubtasks = new ArrayList<>();\n\
  \                lstSubtasks.addAll(createSubtasks());\n                for (RecursiveAction\
  \ subtask : lstSubtasks) {\n                    subtask.fork();\n              \
  \  }\n            } else {\n                System.out.println(\"执行任务：\" + task);\n\
  \            }\n        } catch (Exception e) {\n            System.out.println(\"\
  Exception:\" + e.getMessage());\n            e.printStackTrace();\n        }\n \
  \   }\n\n    private List<ForkJoinDemo> createSubtasks() {\n        //创建子任务\n  \
  \      List<ForkJoinDemo> subtasks = new ArrayList<>();\n        ForkJoinDemo subtask1\
  \ = new ForkJoinDemo(task / 2);\n        ForkJoinDemo subtask2 = new ForkJoinDemo(task\
  \ / 2);\n        subtasks.add(subtask1);\n        subtasks.add(subtask2);\n    \
  \    return subtasks;\n    }\n\n    public static void main(String[] args) {\n \
  \       try {\n            //将任务提交到并行度为 4 的池\n            final ForkJoinPool pool\
  \ = new ForkJoinPool(4);\n            final ForkJoinDemo obj = new ForkJoinDemo(40);\n\
  \            //调用 invoke 方法。它调用 compute()\n            System.out.println(pool.invoke(obj));\n\
  \        } catch (Exception e) {\n            System.out.println(\"Error: \" + e.getMessage());\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n在这里，将一个虚拟的任务数量传递给\
  \ `ForkJoinDemo` 类的构造函数。如果任务数量大于 16，则拆分任务，否则直接执行任务。代码的输出见图 10.20：\n\n## 10.11 Java\
  \ Database Connectivity (JDBC)\n\n数据库用于存储应用程序的数据。Java 提供了 Java 数据库连接（JDBC）应用程序接口（API），将\
  \ Java 应用程序连接到数据库。JDBC API 提供了一库和数据库驱动程序，它们在实现上与平台无关。开放数据库连接（ODBC）和 JDBC 是两种广泛使用的\
  \ API。\n\nODBC API 是微软的产品，使用结构化查询语言（SQL）从应用程序访问、查询和操作数据库。为了连接到多个数据库，可以使用驱动管理器，它管理不同的数据库驱动程序并确保调用指向正确的数据库管理系统（DBMS）。每个\
  \ DBMS 都有特定的驱动程序，例如 SQL Server 驱动程序、Oracle 驱动程序等。JDBC 是一个 Java API，用于从 Java 程序操作数据库以执行以下活动：\n\
  \n\n\n\n\n* 连接到数据库\n* 查询和更新数据库\n* 从数据库检索数据\n\n它使用 `JDBC` 驱动程序连接数据库，如图 10.21 所示：\n\
  \n![](img/Figure_10.21.jpg)\n\n图 10.21：JDBC 架构\n\n共有四种 `JDBC` 驱动，列如下：\n\n* 类型 I，`JDBC-ODBC\
  \ Bridge` 驱动：通过 `ODBC` 驱动将 `JDBC` 驱动连接到数据库。主要用于访问 `MS Access` 和 `MS SQL Server`\
  \ 等 Microsoft DBMS 产品。\n* 类型 II，`Native API-Java/ Partly Java` 驱动：通过 `JDBC` 调用访问特定数据库的原生方法。它比类型\
  \ I 快，因为 `JDBC` 调用被转换为特定数据库的调用。然而，它要求在客户端上配置原生数据库代码。\n* 类型 III，`JDBC Network-All\
  \ Java` 驱动：将 `JDBC` 调用转换为中间的、独立 DBMS 的网络协议，然后由中间层服务器转换为特定数据库的调用。客户端机器不需要安装原生软件或服务。然而，在中间层，需要执行特定数据库的代码，并带有实现中间层安全性的额外开销。\n\
  * 类型 IV，`Native Protocol-All Java`：直接将 `JDBC` 调用转换为特定数据库的网络协议，不需要在客户端上安装中间件或原生库。它是所有四种驱动中最快的。然而，由于它是特定于\
  \ DBMS 的，数据库的任何更改都需要部署针对该数据库的新类型 4 驱动。\n\n以下列出了 `JDBC` 的一些优势：\n\n* 平台无关且厂商无关，因为它支持任何用作后端存储的\
  \ DBMS。\n* 易于使用，因为它隐藏了程序与后端数据库连接的复杂性。\n* 允许使用不同 DBMS 的现有数据。\n\n## 10.11.1 JDBC API\
  \ 的类和接口\n\nJava 在 `java.sql` 包中提供了一系列类和接口用于连接和操作数据库。以下列出了 `java.sql` 包的一些接口：\n\n\
  * `Connection`：用于连接和监控数据库连接。\n* `DatabaseMetaData`：提供有关数据库的信息，如版本、表名等。它有方法获取有关架构（schemas）、表数量等信息。\n\
  * `Driver`：用于创建 `Connection` 对象。\n* `PreparedStatement`：用于执行预编译的 SQL 语句。\n* `ResultSet`：提供检索\
  \ SQL 语句返回的数据的方法。\n* `ResultSetMetaData`：用于获取有关最后一个 `ResultSet` 对象的信息。\n* `Statement`：用于执行\
  \ SQL 语句并将数据检索到 `ResultSet` 中。\n\n以下列出了 `java.sql` 包的一些类：\n\n* `Date`：提供将 SQL 日期格式转换为\
  \ Java Date 格式的方法。\n* `DriverManager`：用于处理驱动程序的加载和卸载，并与数据库建立连接。\n* `DriverPropertyInfo`：提供检索或插入驱动属性的方法。\n\
  * `Time`：提供格式化和解析时间值的操作。\n\n以下列出了 `java.sql` 包定义的异常：\n\n* `SQLException`：提供有关数据库访问错误或其他错误的信息。\n\
  * `SQLWarning`：提供有关数据库访问警告的信息。\n* `DataTruncation`：当数据值被截断时抛出。\n* `BatchUpdateException`：当在批量更新期间发生错误时抛出。\n\
  \n## 10.11.2 从 Java 程序连接到数据库\n\n图 10.22 显示了从 Java 程序连接并访问数据库的步骤：\n\n![](img/Figure_10.22.jpg)\n\
  \n图 10.22：连接数据库的步骤\n\n让我们逐个理解每个步骤。\n\n### 注册 JDBC 驱动\n\n要注册驱动程序，请使用 `DriverManager`\
  \ 类。它管理所有供 `JDBC` 客户端使用的驱动对象的引用。早先使用 `Class.forName()` 加载驱动类并将其注册到 `DriverManager`。然而，对于\
  \ `JDBC` 4.0 驱动，不再需要这样做，因为类路径中的 `JDBC` 4.0 (JDK 6) 驱动会自动加载。\n\n语法：\n\n```\nClass.forName(<protocol>)\n\
  ```\n\n例如：\n\n```\nClass.forName(\"com.microsoft.sqlserver.jdbc.SQLServerDriver\"\
  )\n```\n\n一旦成功加载驱动，就可以建立与数据库的连接。\n\n### 连接到数据库\n\n要建立数据库连接，请使用 `DriverManager.getConnection()`\
  \ 方法。它会检查所有可用驱动程序和/或指定 URL 的特定驱动程序。\n\n语法：\n\n```\nConnection con = DriverManager.getConnection(<url>,\
  \ <username>,<password>);\n```\n\n在这里：\n\n* `Connection`：持有连接详情引的对象。\n* `url`：指定连接属性，如协议、子协议等。\n\
  \  `protocol:<subprotocol>:<subname>`\n\n例如：\n\n`jdbc:odbc:sample`\n\n* `username`：用户登录名\n\
  * `password`：验证用户的密码\n\n例如：\n\n```\nConnection con = DriverManager.getConnection(\"\
  jdbc:odbc:sample\", \"sa\",\"sa\");\n```\n\n### 执行 SQL 语句\n\n可以创建 SQL 语句来从数据库中检索、插入、更新或删除数据。这是通过使用\
  \ `Statement` 对象实现的。`Connection.createStatement()` 方法用于创建 `Statement`。\n\n例如：\n\n\
  ```\nConnection con = DriverManager.getConnection(\"jdbc:odbc:sample\", \"sa\");\n\
  Statement stmt = con.createStatement();\n```\n\n使用以下三种 Statement 类型可以创建 SQL 查询：\n\
  \n* `Statement` 接口执行非参数化查询。\n* `PreparedStatement` 接口执行带参数的预编译 SQL 语句。\n* `CallableStatement`\
  \ 接口执行调用存储过程。\n\n以下列出了用于执行 SQL 语句的方法：\n\n* `executeQuery()`：执行带有 `SELECT` 子句的 SQL\
  \ 语句。以 `ResultSet` 对象的形式返回结果。SQL 查询字符串作为参数传递给方法。\n\n例如：\n\n```\nResultSet rs = stmt.executeQuery(\"\
  SELECT Name FROM Student\");\n```\n\n* `executeUpdate()`：执行 `INSERT`、`DELETE`、`UPDATE`\
  \ 以及其他定义语言（DDL）语句，如 `CREATE TABLE`、`DROP TABLE` 等。返回影响行数的整数值。\n\n语法：\n\n```\npublic\
  \ int executeUpdate(String sql) throws SQLException\n```\n\n* `execute()`：执行返回多个结果集的\
  \ SQL 语句。如果 SQL 语句生成了 `ResultSet` 对象，则返回 true。\n\n语法：\n\n```\npublic boolean execute(String\
  \ sql) throws SQLException\n```\n\n### 检索并处理结果\n\n从 `ResultSet` 对象中提取 SQL 语句的结果。它提供了检索和处理数据的方法。\n\
  \n语法：\n\n```\npublic ResultSet executeQuery(String sql) throws SQLException\n```\n\
  \n`ResultSet` 对象以表格格式存储数据，光标位于第一行之前。要遍历 `ResultSet`，使用 `next()` 方法，该方法将光标向前移动一行。如果光标位于有效位置，`next()`\
  \ 方法返回 true。如果光标位于最后一行之后，则返回 false。\n\n例如：\n\n```\nResultSet rs = stmt.executeQuery(\"\
  SELECT Name FROM Student\");\nwhile (rs.next()) {\nString studName=rs.getString(\"\
  Name\");\nSystem.out.println(studName);\n}\n```\n\n在这里，从 `ResultSet` 对象从 `Student`\
  \ 表检索姓名。然后使用 `next()` 方法遍历 `ResultSet` 并使用 `getString()` 方法显示数据。\n\n以下列出了用于检索不同类型数据的不同\
  \ 方法：\n\n* `getString()`：检索分配给 `String` 对象的字符串值（SQL 类型 `VARCHAR`）。\n* `getInt()`：检索分配给整数变量的整数值。\n\
  \n\n\n\n\n*   `getFloat()`: 获取赋值给 float 变量的浮点值。\n*   `getObject()`: 以对象的形式获取值并赋值给\
  \ `Object` 类型变量。\n\n例如：\n\n```java\nwhile (rs.next()) {\n    String name=rs.getString(\"\
  Name\");\n    int id=rs.getInt(\"StudId\");\n    float score=rs.getFloat(\"Percentage\"\
  );\n    System.out.println(id + \" \" + name + score);\n}\n```\n\n不同类型的值从 `ResultSet`\
