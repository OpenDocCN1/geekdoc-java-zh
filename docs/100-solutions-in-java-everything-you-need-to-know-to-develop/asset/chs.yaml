  \        System.out.println(\"Hello World\");\n    }\n}\n```\n\n2. 将源文件 `Hello.java`\
  \ 保存到名为 `testpkg` 的文件夹/包中。\n\n3. 打开提示符并设置 JDK 8 bin 文件夹的路径。\n\n4. 按照以下方式编译代码：\n\n\
  ```bash\njavac Hello.java\n```\n\n或者\n\n使用 `-d` 选项按以下方式编译代码：\n\n```bash\njavac -d\
  \ . Hello.java\n```\n\n其中 `-d` 表示目录，`.` 表示当前目录。该命令将创建一个名为 `testpkg` 的子文件夹并将编译后的类文件存储其中。\n\
  \n5. 从父级 `testpkg` 文件夹，使用全限定名执行类文件：\n\n```bash\njava testpkg.Hello\n```\n\n下面的截图显示了在\
