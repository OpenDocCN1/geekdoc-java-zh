  \n在本章中，你学习了任何现实世界的实体都可以描述为对象。Java 是一种流行的面向对象的、跨平台的语言。Java SE 是创建控制台或网络应用程序的基础。两个\
  \ Java SE 组件是 `JRE` 和 `JDK`。JDK 经过多年的修改，每次都增加了一些重大改进和功能。JDK 9 最重要的特性是 Jigsaw 项目，它将新的模块系统应用到\
  \ `JRE`。Java 9 模块是代码和数据的自描述集合。JDK 9 提供了一个名为 `JShell` 的新的交互式读取-打印循环（REPL）终端。JDK 10\
  \ 遵循 JDK 9 的模块模型并对功能进行了增强。\n\n在下一章中，你将学习 Java 编程结构。\n\n## 单选题\n\n1. __________ 是一种向用户隐藏实体非要细节编程概念。\n\
