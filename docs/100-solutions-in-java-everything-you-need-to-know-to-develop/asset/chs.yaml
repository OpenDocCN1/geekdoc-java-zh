  \n![](img/fm1.png)\n\n# 第 13 章 Java 11 (LTS) 及新更新](#contents.xhtml_ch13a)\n\n##\
  \ 引言](#contents.xhtml_sc2_336a\n\nJava 11 是 Java 8 之后的第一个长期支持 (LTS) 版本。它添加了一些新功能，并移除和弃用了早期版本的某些功能。Java\
  \ 12 到 16 也已发布，并包含一些新功能，同时早期的预览功能已标准化并达到生产就。\n\n## 结构](#contents.xhtml_sc2_337a)\n\
  \n以下是本章涵盖的主题：\n\n* Java 11 (LTS) 简介\n* Java 11 (LTS) 的新功能\n* Java 12 到 16 版本的特性\n\
  \n## 目标](#contents.xhtml_sc2_338a)\n\n在本章中，你将学习 Java 11 以及 JDK 中新增的特性，例如字符串和文件方法、`HTTPClient`、垃圾回收器等等。你还将学习不同的\
  \ JDK 提供者。最后，你将理解在预览版本中发布并在 Java 12 到 16 中标准化的新功能。\n\n## 13.1 Java 11 (LTS) 简介 contents.xhtml_sc2_339a\n\
  \nJDK 11 于 2018 年 9 月发布，在 Java 10 发布 6 个月后，是 Java 8 之后的第一个长期支持 (LTS) 版本。虽然从开发角度来看，Java\
  \ 11 是一个较小的版本，但它引入了许多新功能，我们将在本中进行讨论。然而，早期版本的几个特性（如 Java applets、Java Web Start、JavaFX\
  \ 等）已从 JDK 中移除。\n\n`OracleJDK` 最后一个无需许可即可商业用途的免费版本是 Java 10。从 Java 11 开始，Oracle\
  \ 不再提供免费的长期支持 (LTS)。\n\n不过，Oracle 仍然提供可以免费下载和使用的 OpenJDK 版本。除了 Oracle 之外，还有其他 OpenJDK\
  \ 提供者。\n\n### Adoptium 的 Eclipse Temurin（早期称为 AdoptOpenJDK）\n\n2017 年，由一组 Java 用户组成员、供应商和开发者（包括\
  \ RedHat、Microsoft、Pivotal、Amazon 等等）创建了一个名为 AdoptOpenJDK 的新社区。从 2021 年 8 月起，AdoptOpenJDK\
  \ 项目更名为 Eclipse Adoptium 项目。\n\nAdoptium 的免费 OpenJDK 构建版本命名为 `Eclipse Temurin`，它为不同的操作系统、版本和架构提供了更长的可用性和更新。\n\
  \n你可以从 Oracle 官方网站或 Adoptium 网站下载最新的 JDK。\n\n`[`www.oracle.com/in/java/technologies/`](https://www.oracle.com/in/java/technologies/)`\n\
  \n`[`adoptium.net/`](https://adoptium.net/)`\n\n下载 Windows 版 JDK 11 安装程序的执行文件并将其安装到你的系统中。下图显示了\
  \ JDK 11 的安装：\n\n![](img/Figure13.1.png)\n\n图 13.1：JDK 11 安装向导\n\n| 注意：你可以使用任何 IDE\
  \ 创建 Java 应用程序。在这里，我们将使用 Apache NetBeans IDE 17。你可以从 Apache NetBeans 官方网站下载。 |\n\
  \n### 13.1.1 Oracle 对比 OpenJDK contents.xhtml_sc3_340a\n\nOracle 和 OpenJDK 在几个方面存在差异，如下表所示：\n\
  \n| Oracle | OpenJDK |\n| --- | --- |\n| 每三年发布一次版本 | 每六个月发布一次版本 |\n| 为版本提供长期支持 |\
  \ 仅对版本中的更改提供支持，直到下一个版本发布 |\n| Oracle JDK 根据 Oracle 二进制代码许可协议进行许可 | OpenJDK 具有带有链接异常的\
  \ GNU 通用公共许可证 (GNU GPL) 第 2 版 |\n| Oracle 平台具有许可影响，例如 2019 年 1 月之后的 Java SE 8 公共更新在没有许可的情况下不能用于业务或商业目的\
  \ | OpenJDK 是完全开源且免费使用的 |\n| Oracle 考虑到其企业客户，更关注稳定性。因此，Oracle 在响应和 JVM 性能方面更好。 |\
  \ OpenJDK 由于频繁发布，在稳定性方面遇到更多问题，因此用户面临性能问题。 |\n| Oracle 提供 Flight Recorder、应用程序类数据共享和\
  \ Java Mission Control 等功能 | OpenJDK 提供了字体渲染器 (Font Renderer) 功能 |\n| 每三年发布一次版本\
  \ | 每六个月发布一次版本 |\n| 为版本提供长期支持 | 仅对版本中的更改提供支持，直到下一个版本发布 |\n| Oracle JDK 根据 Oracle\
  \ 二进制代码许可协议进行许可 | OpenJDK 具有带有链接异常的 GNU 通用公共许可证 (GNU GPL) 第 2 版 |\n| Oracle 平台具有许可影响，例如\
  \ 2019 年 1 月之后的 Java SE 8 公共更新在没有许可的情况下不能用于业务或商业目的 | OpenJDK 是完全开源且免费使用的 |\n| Oracle\
  \ 考虑到其企业客户，更关注稳定性。因此，Oracle 在响应和 JVM 性能方面更好。 | OpenJDK 由于频繁发布，在稳定性方面遇到更多问题，因此用户面临性能问题。\
  \ |\n| Oracle 提供 Flight Recorder、应用程序类数据共享和 Java Mission Control 等功能 | OpenJDK 提供了字体渲染器\
  \ |\n\n表 13.1：Oracle 对 OpenJDK\n\n此外，Oracle 提供了更多的垃圾回收选项和更好的渲染器。\n\n值得注意的是，随着这么多新版本的发布，出现了许多现实需求。许多遗留项目仍然停留在早期版本，如\
  \ Java 8 甚至 5 和 6。\n\n然而，Java 的特性是确保向后兼容。也就是说，用 Java 5 或 8 创建的程序可以在 Java 8 到 19\
  \ 的虚拟机上运行。但反过来不行，即使用 Java 19 功能创建的程序无法在 Java 8 上运行，因为这些功能在早期版本中不存在。因此，如果你想使用最新的\
  \ IDE 和构建工具，可以使用 Java 的最新版本，例如 Java 17 (LTS) 或 Java 19。\n\n例外是 Android 开发，它仍然需要\
  \ Java 7。但你也可以切换到 Kotlin 编程语言进行 Android 开发。\n\n## 13.2 Java 11 (LTS) 的新功能 contents.xhtml_sc2_341a\n\
  \nJava 11 提供了许多新功能，例如 String 和 Files 类的新方法、Lambda 参数的局部变量类型推断 (`var`)、Java 9 HttpClient\
  \ 的正式版、Flight Recorder 等等。\n\n让我们探索 Java 11 的一些新功能。\n\n### 13.2.1 String 类的新方法 contents.xhtml_sc3_342a\n\
  \n以下是 Java 11 添加的一些实用 String 方法。这些方法有助于减少字符串操作所需的样板代码：\n\n*   `boolean isBlank()`\n\
  \n    如果字符串为空或仅由空白代码点组成，该方法将返回 true，否则返回 false。\n\n    例如：\n\n    ```\n    System.out.println(\"\
  JavaBeans\".isBlank());\n    System.out.println(\" \".isBlank());\n    ```\n\n \
  \   输出：\n\n    ```\n    False\n    true\n    ```\n\n*   `String strip()`\n\n\n\n\
  \n\n该方法将在移除给定字符串值首部和尾的所有空格后返回一个 `String`。\n\n例如：\n\n```java\nSystem.out.println(\"\
  \ JavaBeans \".strip());\n```\n\n输出：\n`JavaBeans`\n\n同样，`stripLeading()` 和 `stripTrailing()`\
  \ 方法将分别移除头部和尾的空格。\n\n`strip` 方法的功能与 `trim()` 方法类似，但具有更精细的控制和 Unicode 支持。\n\n###\
  \ `Stream<String> lines()`\n\n此方法返回一个从字符串中提取的行 `stream`，行由行终止符分隔。\n\n行终止符可以是以下之一：`\"\
  \\n\"`、`\"\\r\"` 或 `\"\\r\\n\"`。\n\n例如：\n\n```java\nString multiline = \"Java 11\
  \ \\n \\n added \\n new string methods.\";\nList<String> lines = multiline.lines()\n\
  \    .filter(line1 -> !line1.isBlank())\n    .map(String::strip)\n    .collect(Collectors.toList());\n\
  \nSystem.out.println(lines);\n```\n\n输出：\n`[Java 11, added, new string methods.]`\n\
  \n流将按照它们出现的顺序保存行。行终止符将从每行中被移除。\n\n`lines()` 方法是 `split()` 的更好选择，因为它在分割多行输出时会提供更好的性能。\n\
  \n### `String repeat(int n)`\n\n此方法将返回一个 `string`，它是给定字符串重复 `n` 次后的拼接。（在这里，`n` 是\
  \ `repeat` 方法参数中提到的数字）\n\n例如：\n\n```java\nString song = \"Jingle Bells \".repeat(2)\
  \ + \"Jingle all the way..\";\nSystem.out.println(song);\n```\n\n输出：\n`Jingle Bells\
  \ Jingle Bells Jingle all the way..`\n\n如果给定字符串为空或计数为零，`repeat()` 方法将返回一个空字符串。\n\
  \n## 13.2.2 Files 类方法\n\nJava 11 在 `Files` 类中引入了新的静态方法 `readString` 和 `writeString`，以便更容易从文件中读写\
  \ `Strings`。\n\n例如：\n\n```java\ntry {\n    Path path1 = Paths.get(\"F:\\\\Data\"\
  );\n    // 在指定的目录下创建一个临时文件。\n    Path tempFile = Files.writeString(Files.createTempFile(path1,\"\
  hello\", \".txt\"),\"Sample file\");\n    System.out.println(\"Temp file: \" + tempFile);\n\
  \    // 从文件读取\n    String fileContent = Files.readString(tempFile);\n    System.out.println(\"\
  File content: \"+fileContent);\n} catch (IOException ex) {\n    System.out.println(\"\
  Exception occurred\");\n}\n```\n\n输出：\n`Temp file: F:\\Data\\hello18360941495042199847.txt`\n\
  `File content: Sample file`\n\n## 13.2.3 集合转换为数组\n\n`java.util.Collection` 接口添加了一个名为\
  \ `toArray(IntFunction)` 的新默认方法。它允许集合的元素在运行时传输到新创建的目标类型数组中。\n\n例如：\n\n```java\n\
  List<String> list1 = Arrays.asList(\"Java 10\", \"Java 11\");\nString[] sample =\
  \ list1.toArray(String[]::new);\nSystem.out.println(Arrays.toString(sample));\n\
  ```\n\n输出：\n`[Java 10, Java 11]`\n\n## 13.2.4 静态 ‘not’ 方法\n\nJava 11 在 `Predicate`\
  \ 接口中引入了一个静态 `not` 方法，用于对现有的谓词取反。它与 `negate()` 方法相似。\n\n为了理解 `not` 方法的必要，让我们先了解在\
  \ `Predicate.not()` 方法之前是如何实现取反的。\n\n例如：\n\n考虑一个具有 `sales` 属性和 `isEligible()` 方法的\
  \ `Employee` 类。\n\n```java\npublic class Employee {\n    private static final int\
  \ MIN_SALES = 1500;\n    public int sales;\n    public Employee(int sales) {\n \
  \       this.sales = sales;\n    }\n    // 如果销售额大于或等于最小销售额值，则员工有奖奖金\n    public\
  \ boolean isEligible() {\n        return sales >= MIN_SALES;\n    }\n}\n```\n\n\
  现在有一个包含销售记录的员工列表。\n\n```java\nList<Employee> emp = Arrays.asList(\n    new Employee(3000),\n\
  \    new Employee(1200),\n    new Employee(900),\n    new Employee(4000)\n);\n```\n\
  \n为了获取所有符合条件的员工列表，我们可以执行以下操作：\n\n```java\n// 获取大于最小销售额的销售值\nList<Employee> eligible\
  \ = emp.stream()\n    .filter(Employee::isEligible)\n    .collect(Collectors.toList());\n\
  for (Employee eligible1 : eligible) {\n    System.out.println(eligible1.sales);\n\
  }\n```\n\n输出：\n`3000`\n`4000`\n\n然而，要获取不符合条件的员工，我们必须像下面使用逻辑非 `!` 运算符对谓词进行取反。\n\n\
  ```java\n// 在没有 Predicate.not 方法的情况下管理取反\n// 获取小于最小销售额的销售值\nList<Employee> noteligible\
  \ = emp.stream()\n    .filter(Employee -> !Employee.isEligible())\n    .collect(Collectors.toList());\n\
  for (Employee noteligible1 : noteligible) {\n    System.out.println(noteligible1.sales);\n\
  }\n```\n\n输出：\n`1200`\n`900`\n\n## 13.2.5 Lambda 局部变量推断\n\nJava 11 引入了 Lambda 参数的局部变量类型推断。这允许将\
  \ `var` 作为 Lambda 参数的类型。\n\n例如：\n\n```java\n(var fName, var lName) -> fName + lName\n\
  ```\n\n此功能允许对局部变量应用修饰符，例如类型注解。\n\n```java\nList<String> list1 = Arrays.asList(\"\
  Java 10\", \"Java 11\");\nString result = list1.stream()\n    .map((@Nonnull var\
  \ x) -> x.toUpperCase())\n    .collect(Collectors.joining(\", \"));\n\nSystem.out.println(result);\n\
  ```\n\n\n\n\nJava 9 引入的 `java.net.http` 包中的 `HttpClient` 类现在已进入最终的非预览版本，并成为 Java\
  \ 11 的标准特性。\n\n新的 HTTP API 同时支持 HTTP/1.1 和 HTTP/2，且整体性能得到了全面提升。\n\n以下代码展示了标准化的 `HttpClient`\
  \ 类的用法：\n\n```java\nHttpClient httpClient = HttpClient.newBuilder()\n    .version(HttpClient.Version.HTTP_2)\n\
  \    .connectTimeout(Duration.ofSeconds(20))\n    .build();\n\nHttpRequest httpReq\
  \ = HttpRequest.newBuilder()\n    .GET()\n    .uri(URI.create(\"http://localhost:\"\
  \ + port))\n    .build();\n\nHttpResponse httpRes = httpClient.send(httpReq, HttpResponse.BodyHandlers.ofString());\n\
  \nassertThat(httpRes.body()).isEqualTo(\"Message from the server!\");\n```\n\n###\
  \ 13.2.7 运行源文件\n\nJava 源代码现在无需先编译即可执行。\n\n例如：\n\n在此之前，我们需要使用 `javac` 命令编译 `.java`\
  \ 文件，然后使用 `java` 命令运行它，如下所示：\n\n```bash\n$ javac Hello.java\n$ java Hello\n```\n\
  \n然而，现在我们可以直接使用 `java` 命令运行 `.java` 文件：\n\n```bash\n$ java Hello.java\n```\n\n###\
  \ 13.2.8 No-Op 垃圾回收器\n\nJava 11 引入了一个名为 `Epsilon` 的新垃圾回收器。它分配内存但不会实际回收任何垃圾。因此，它被称为\
  \ No-Op（无操作），适用于模拟内存溢出错误。\n\n它不适用于生产环境，但在某些用例下会非常有用：\n\n* 性能测试\n* 内存压力测试\n* VM 接口测试\n\
  * 极短寿命的任务\n\n你可以通过使用 `-XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC` 标志来启用它。\n\
  \n### 13.2.9 Flight Recorder（飞行员记录器）\n\nJava Flight Recorder (JFR) 早期是 Oracle JDK\
  \ 中的一个商业产品，现在已经在 Open JDK 中开源了。JFR 是一种分析工具，帮助从运行的 Java 应用程序中收集分析和诊断数据。\n\n由于其开销通常低于\
  \ 1%，JFR 可以用于生产环境。录制时间结束后，记录的数据将保存在 JFR 文件中。\n\n例如：\n\n要启动 60 秒的 JFR 录制，可以使用以下参数：\n\
  \n```bash\n-XX:StartFlightRecording=duration=60s,settings=profile,filename=java-test-app.jfr\n\
  ```\n\n要查看并分析数据，我们需要另一个名为 JDK Mission Control (JMC) 的工具。\n\n### 13.2.10 已移除和弃用的模块\n\
  \n随着新版本的发布，我们无法使用已移除的特性，也应该停止使用弃用的特性。\n\nJava EE 和 CORBA 的某些模块在 Java 9 中已被弃用。在 Java\
  \ 11 中，这些模块已被完全移除。由于 Java EE 技术可以在第三方网站获取，因此不需要将它们包含在 Java SE 中。\n\n以下是已移除的模块：\n\
  \n* 基于 XML 的 Web 服务 API (`java.xml.ws`)\n* Java XML 绑定架构 (`java.xml.bind`)\n* JavaBeans\
  \ 激活框架 (`java.activation`)\n* 通用注解 (`java.xml.ws.annotation`)\n* 通用对象请求代理架构 (`java.corba`)\n\
  * Java 事务 API (`java.transaction`)\n\nJDK Mission Control (JMC) 和 JavaFX 现在都作为独立/分离的模块集提供。因此，它们已从\
  \ JDK 中移除。\n\n此外，Java 11 还弃用了以下模块：\n\n* Nashorn JavaScript 引擎，包括 JJS 工具\n* 针对 JAR\
  \ 文件的 Pack200 压缩方案\n\n### 13.3 Java 12 到 16 版本的特性\n\nJava 11 (LTS) 之后是几个较小的版本。让我们来看\
  \ Java 12 到 16 版本的特性。\n\n### 13.3.1 Java 12\n\nJava 12 引入了一些新特性和一些清理。最显著的是对 Unicode\
  \ 11 支持以及预览版本中新的 switch 表达式。`finalize` 方法已从 `FileInputStream` 和 `FileOutputStream`\
  \ 中移除。\n\n### 13.3.2 Java 13\n\nJava 13 特性的完整列表可以参考 Oracle 官方网站。最重要的包括对 Unicode\
  \ 12.1 支持以及以下两个特性的改进预览版本：\n\n* **Switch 表达式（预览版）**\n  现在 switch 表达式也可以返回一个值。此外，可以使用\
  \ lambda 风格的语法来处理表达式，而不会出现贯穿/break 问题：\n\n  例如：\n\n  在 Java 13 之前，switch 语句的创建如下：\n\
  \n  ```java\n  switch(status) {\n      case PAID:\n        // 代码语句\n        break;\n\
  \      case FREE:\n        // 代码语句\n        break;\n      default:\n        // 代码语句\n\
  \  }\n  ```\n\n  使用 Java 13，switch 语句可以如下创建：\n\n  ```java\n  String type = \"PAID\"\
  ;\n  boolean value = switch (type) {\n      case \"PAID\" -> true;\n      case \"\
  FREE\" -> false;\n      default -> throw new IllegalArgumentException(\"Incorrect\
  \ Option\");\n  };\n  System.out.println(\"Selected PAID? \" + value);\n  ```\n\
  \  输出：\n  `Selected PAID? true`\n\n* **多行字符串（预览版）**\n  Java 允许如下创建多行字符串：\n\n  ```java\n\
  \  // 多行字符串\n  String s = \"第一行\\n\" +\n             \"第二行\";\n  ```\n\n  在 Java\
  \ 13 中，可以使用如下方式创建多行字符串：\n\n  ```java\n  String multilineString = \"\"\"\n      \
  \       第一行\n             第二行\n             \"\"\";\n  ```\n\n### 13.3.3 Java 14\n\
  \nJava 14 标准化了 Java 12 和 13 的预览版本并引入了新特性。让我们来看看：\n\n* **Switch 表达式（标准版）**\n  Java\
  \ 12 和 13 的 switch 表达式预览版现在已标准化。\n\n  ```java\n  String day = \"TUESDAY\";\n  int\
  \ count = switch (day) {\n      case \"MONDAY\", \"FRIDAY\", \"SUNDAY\" -> 6;\n\
  \      case \"TUESDAY\" -> 7;\n      default -> {\n          String s = day;\n \
  \         int result = s.length();\n          yield result;\n      };\n  };\n  System.out.println(\"\
  Letter count \"+count);\n  ```\n  输出：\n  `Letter count 7`\n\n* **Record（预览版）**\n\
  \  Java 14 引入了 record 类以减少大量模板代码。\n\n  在 Java 14 之前，类包含数据、getter/setter、`toString()`\
  \ 以及 equals/hashcode。例如：\n\n  ```java\n  final class Calculator {\n      public\
  \ final int a;\n      public final int b;\n      public Calculator(int a, int b)\
  \ {\n          this.a = a;\n          this.b = b;\n      }\n  }\n  ```\n\n  使用 record，代码可以这样写：\n\
  \n  ```java\n  record Calculator(int a, int b) { }\n  ```\n  | 注意：这是一个预览特性，在未来的版本中可能会修改。\
  \ |\n\n* **有用的 NullPointerException**\n  `NullPointerException` 现在会描述具体是哪个变量为空。\n\
  \n  例如：\n\n  ```java\n  participant.age = 35;\n  ```\n  ---\n  `Exception in thread\
  \ \"main\" java.lang.NullPointerException:`\n  `Cannot assign field \"age\" because\
  \ \"participant\" is null`\n\n* **instanceof 模式匹配（预览版）**\n  在早期的版本中，我们可以在 `instanceof`\
  \ 内部对对象进行强制转换：\n\n  ```java\n  if (val instanceof String) {\n      String s = (String)\
  \ val;\n      // 使用 s\n  }\n  ```\n\n  这可以在不强制转换的情况下完成：\n\n  ```java\n  if (val\
  \ instanceof String s) {\n      System.out.println(s.contains(\"Java14\"));\n  }\n\
  \  ```\n\n* **其他特性**\n  **打包工具（孵化）：** 允许通过新的孵化 `jpackage` 工具将 Java 应用程序及其所有依赖项打包成特定平台的包。\n\
  \n  * Linux: `deb` 和 `rpm`\n  * macOS: `pkg` 和 `dmg`\n  * Windows: `msi` 和 `exe`\n\
  \n\n\n\n垃圾回收器：Java 14 添加了实验性的 Z 垃圾回收器并移除了并发标记清除（CMS）垃圾回收器。\n\n### 13.3.4 Java 15\n\
  \n以下是 Java 15 的一些特性：\n\n*   **文本块 / 多行字符串（Text-Blocks / Multiline strings）**\n \
  \   Java 15 标准化了 Java 13 中引入的多行字符串实验性。\n    例如：\n    ```java\n    String text =\
  \ \"\"\"\n\n    Java 是一门面向对象的编程语言。\n\n    它有多个版本。\n\n    最新版本是 Java 19。\n\n    Java\
  \ 20 将于 2023 年 3 月发布。\n\n    \"\"\";\n\n    System.out.println(text);\n    ```\n\
  \n*   **密封类 - 预览（Sealed classes - Preview）**\n    Java 15 引入了密封类的预览版本，用于对谁允许继承你的类提供更严细的控制。\n\
  \    例如：\n    ```java\n    public abstract sealed class Vehicle\n    permits TwoWheeler,\
  \ FourWheeler {...}\n    ```\n    上述代码意味着虽然 `Vehicle` 类是公共的，但它只能被 `TwoWheeler` 和\
  \ `FourWheeler` 类子类。\n\n*   **记录与模式匹配（Records and pattern matching）**\n    Java\
  \ 14 中的 records 和模式匹配功能仍处于预览阶段，尚未最终确定。\n\n*   **移除了 Nashorn JavaScript 引擎（Nashorn\
  \ JavaScript Engine removed）**\n    在 Java 11 中被弃用的 Nashorn JavaScript 引擎在 JDK 15\
  \ 中最终被移除。\n\n*   **Z 垃圾收集准备就绪（Z Garbage collect is production ready）**\n    Z 垃圾回收器现在已准备就绪。\n\
  \n### 13.3.5 Java 16\n\n以下是 Java 16 的一些显著特性：\n\n*   **`instanceof` 的模式匹配**：传统上，`instanceof`\
  \ 运算符用于检查对象的类型，通常后跟着类型转换。这有助于在进行任何进一步处理之前提取变量的类型。\n    例如：\n    考虑如下简单的 `Vehicle`\
  \ 对象层级：\n    ```java\n    if (vehicle instanceof TwoWheeler) {\n    TwoWheeler bike\
  \ = (TwoWheeler) vehicle;\n    bike.accelerate();\n    // 其他自行车操作\n    } else if\
  \ (vehicle instanceof FourWheeler) {\n    FourWheleer car = (FourWheeler) vehicle;\n\
  \    car.brake();\n    // 其他汽车操作\n    }\n    // 针对不同车辆的其他条件语句\n    ```\n    在这里，对于每个条件块，我们都在检查\
  \ `vehicle` 参数的类型，并通过使用类型转换和声明局部变量来进行转换。稍后我们可以对该车辆类型执行相关操作。\n    这种方法虽然可行，但有几个缺点：\n\
  \    *   这种代码涉及对类型进行测试并在每个条件块中反复进行类型转换。\n    *   类型名称在每个 `if` 块中都会重复。\n    *   由于类型转换和变量声明代码过于显著，导致可读性较差。\n\
  \n    Java 16 中改进的 `instanceof` 运算符同时完成了测试参数和将其赋值给正确类型的绑定变量的任务。\n    因此，先的 `vehicle`\
  \ 示例可以写得更简洁，如下所示：\n    ```java\n    if (vehicle instanceof TwoWheeler bike) {\n\
  \    bike.accelerate();\n    } else if (vehicle instanceof FourWheeler car) {\n\
  \    car.brake();\n    }\n    ```\n    在这里，在第一个 `if` 块中，`vehicle` 对象与模式类型 `TwoWheeler\
  \ bike` 匹配。首先，我们测试 `vehicle` 是否是 `TwoWheeler` 的实例。如果是，它将被转换为 `TwoWheeler` 类型，然后我们将结果赋值给\
  \ `bike`。\n\n*   **外部链接器 API – 预览（Foreign linker API – Preview）**：这是计划中的 Java 原生接口（JNI）替代方案，允许绑定到原生库（如\
  \ C）。\n\n*   **记录与模式匹配（Records and pattern matching）**：早期版本的两个预览功能现在都已准备就绪。\n\n\
  *   **密封类（Sealed classes）**：Java 15 引入的密封类仍处于预览阶段。\n你可以参考 Oracle 官方网站上 12 到 16 版本的其他特性。\n\
  \n## 结论\n\n在本章中，你学习了 Java 11 是 Java 8 之后的第一个长期支持（LTS）版本。Java 11 是一个较小的发布，但为 `String`\
  \ 和 `Files` 类增加了实用方法。`Predicate` 的静态 `not` 方法和 lambda 参数的局部变量类型推断（`var`）有助于减少模板代码。版本\
  \ 12 到 16 了许多特性，包括新的 switch 表达式、多行字符串、模式匹配、`instanceof` 运算符、新的垃圾回收器、记录和密封类。Java\
  \ 9 的一些弃用特性在 Java 11 中被移除。\n    在下一章，你将学习 Java 17 (LTS) 以及直到 Java 19 的新更新。\n\n###\
  \ 选题\n\n1.  JDK 11 发布于 ______ 年。\n    1.  2016\n    2.  2020\n    3.  2018\n   \
  \ 4.  2022\n2.  以下哪项是 Java 13 的预览特性？\n    1.  Switch 表达式\n    2.  NullPointerExceptions\n\
  \    3.  密封类\n    4.  Records\n\n3.  下面的代码表示什么？\n    ```java\n    public abstract\
  \ sealed class Vehicle\n    permits TwoWheeler, FourWheeler {...}\n    ```\n   \
  \ 1.  `Vehicle` 类是公共的，它只能被 `TwoWheeler` 和 `FourWheeler` 类子类\n    2.  `Vehicle` 类可以被任何类子类\n\
  \    3.  `Vehicle` 类仅子类 TwoWheeler 和 FourWheeler\n4.  运行 Hello.java 的正确格式：\n   \
  \ ```java\n    public abstract sealed class Vehicle\n    permits TwoWheeler, FourWheeler\
  \ {...}\n    ```\n    1.  `Vehicle` 类是公共的，它只能被 `TwoWheeler` 和 `FourWheeler` 类子类\n\
  \    2.  `javac Hello.java`\n    3.  `java Hello.java`\n    4.  `java Hello.java`\n\
  5.  Java 16 中改进的 `instanceof` 运算符同时完成了测试参数和将其赋值给正确类型的绑定变量的任务。\n    1.  正确\n    2.\
  \  错误\n\n\n\n\n`Java` 的 `switch` 语句经历了巨大的演变。早，在 `Java 7` 中你只能比较整数，在 `Java 8` 中可以比较字符串和枚举。然而，随着\
  \ `Java 12` 的发布，`switch case` 变得更加通用，因为它允许从 `switch` 块中返回值。这使得 `switch` 语句转换成了 `switch`\
  \ 块。可以通过 `break` 关键字或箭头（->`）运算符从 `switch` 块中返回值。此外，`case` 标签现在允许包含多个值。\n\n随后，`Java\
  \ 13` 引入了 `yield` 关键字来代替 `break` 关键字进行返回值。\n\n`Java 17` 引入了 `switch` 的模式匹配功能，它允许将\
  \ `Objects` 传递给 `switch` 函数以识别特定类型。\n\n例如，考虑下面的代码：\n\n```java\npublic class Session14Code\
  \ {\n\n    public static void main(String[] args) {\n        // test the object\
  \ type\n        System.out.println(testcase(56));\n        System.out.println(testcase(\"\
  This is Java 17\"));\n        System.out.println(testcase(true));\n        Vehicle\
  \ car = new Vehicle(4584, 4);\n        System.out.println(testcase(car));\n    }\n\
  \n    public static String testcase(Object obj) {\n        // switch expression\
  \ to check the object type\n        return switch (obj) {\n            case Integer\
  \ i ->\n                \"An integer\";\n            case String s ->\n        \
  \        \"A string\";\n            case Vehicle v ->\n                \"It is a\
  \ vehicle\";\n            default ->\n                \"Not sure\";\n        };\n\
  \    }\n}\n```\n\n在这里，一个对象被传递给 `switch` 条件，然后检查该对象的类型，并相应地从 `switch case` 返回一个值。\n\
  \n语句\n`case Integer i -> \"An integer\";`\n会检查传递的对象是否为 `Integer` 类型，如果是整数则将其赋值给\
  \ `i`。通过使用箭头运算符，将返回字符串 `\"An integer\"`。\n\n我们也可以使用 `Java 13` 引入的 `yield` 关键字从 `switch`\
  \ 表达式中返回值，对于上述语句，如下所示：\n\n```java\ncase Integer i :\n    yield \"An integer\";\n\
  ```\n\n我们还可以创建一个自定义对象并将其传递给 `switch` 语句/表达式。例如，在上面的代码中，我们传递了一个 `Vehicle` 类对象，其创建方式如下：\n\
  \n```java\npublic class Vehicle {\n    private int id;\n    private int noOfWheels;\n\
  \n    public Vehicle(int id, int noOfWheels) {\n        this.id = id;\n        this.noOfWheels\
  \ = noOfWheels;\n    }\n\n    public int getId() {\n        return id;\n    }\n\n\
  \    public int getNoOfWheels() {\n        return noOfWheels;\n    }\n}\n```\n\n\
  `switch` 块中之前已经添加了 `Vehicle` 对象类型的 `case` 标签。\n\n当使用 `main()` 方法中的测试语句执行上述代码时，输出如下。\n\
  \n输出：\n```\nAn integer\nA string\nNot sure\nIt is a vehicle\n```\n\nPN: 要执行上述程序，你需要在正在使用的\
  \ IDE 中启用预览功能，或者可以在命令行中使用 `--enable-preview` 选项启用它。\n\n在 `NetBeans 17` 中，你需要将 `--enable-preview`\
  \ 添加为 VM Options，如下所示：\n\n![](img/Figure_14.1.jpg)\n图 14.1: VM options\n\n同时修改 `pom.xml`\
  \ 文件以添加 `--enable-preview` 参数标签，如下所示：\n\n![](img/Figure_14.2.jpg)\n图 14.2: 修改后的\
  \ pom.xml\n\n### 14.1.2 密封类（已定型）\n\n在 `Java 15` 中引入的 `sealed class` 功能现在 `Java 17`\
  \ 中已定型。`Sealed` 允许你对谁可以子类你的类进行限制。\n\n例如，\n\n```java\npublic abstract sealed class\
  \ Vehicle\npermits TwoWheeler, FourWheeler {…}\n```\n\n上述代码表示 `public class vehicle`\
  \ 只能被 `TwoWheeler` 和 `FourWheeler` 类子类。\n\n### 14.1.3 外接函数和内存 API - 孵化\n\n该 API\
  \ 是 `Java Native Interface` (`JNI`) 的替代品，它允许调用原生函数并访问 JVM 外部的内存。目前，它支持 `Think C`，但最终可能会支持其他语言如\
  \ `C++`、`Fortran` 等。\n\n### 14.1.4 安全管理器已弃用\n\n自 `Java 1.0` 以来一直存在的 `security manager`\
  \ 现在已被弃用，将在未来的版本中移除。\n\n### 14.2 Java 18 和 Java 19 的特性\n\n`Java 18` 和 `Java 19`\
  \ 是较小的版本发布，引入了一些高级特性。\n\n#### 14.2.1 Java 18 的特性\n\n下列表是 `Java 18` 的一些特性。\n\n- **默认\
  \ UTF-8**\n  在此之前，当对没有显式指定字符编码的文件执行任何文件操作时，使用的是操作系统的编码，例如 `Linux` 和 `macOS` 上的 `UTF-8`，以及\
  \ Windows 上的 `Windows-1252`。在 `Java 18` 中，这已设置为默认 `UTF-8`。\n\n- **简单服务器**\n  `18`\
  \ 引入了一个简单的 HTTP 服务器，可以通过 `jwebserver` 命令启动。\n  你可以在官方网站查看更多特性。\n\n#### 14.2.2 Java\
  \ 19 的特性\n\n`Java 19` 增加了若干特性，如 `Foreign and Memory API`、虚拟线程和结构化并发。然而，所有这些都处于预览模式并可能会发生变化。\n\
  \n## 总结\n\n在本章中，你了解到 `Java 17` 是 `Java 11` 之后的第一个 LTS 版本。17 增加了如 `switch` 模式匹配等特性。\n\
