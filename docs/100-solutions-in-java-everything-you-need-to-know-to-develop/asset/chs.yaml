  \ 中的命令行参数\n\n## 4.7 Java 包装类\n\nJava 为每个基本数据类型都提供了一个包装类，将基本数据类型封装成该类的一个对象。这些类提供了实用方法来操作该类型的数据。此功能还允许操作存储对象的集合。每个包装类都提供了\
  \ `valueOf()` 方法来将一种类型转换为另一种类型。\n\n`Character` 类的 `valueOf()` 方法仅接受 `char` 作为参数，而其他任何包装类都接受相应的基本类型或\
  \ `String` 作为参数。`<type>Value()` 方法可用于将对象的值作为其对应的基本类型返回。`parse<type>()` 方法返回对象的基类型类型。\n\
  \n例如：\n\n```\nbyte val = Byte.byteValue();\n```\n\n下表列出了基本数据类型和对应的包装类型：\n\n| 基本数据类型\
  \ | 包装类 |\n| :--- | :--- |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer`\
  \ |\n| long | `Long` |\n| float | `Float` |\n| double | `Double` |\n| char | `Character`\
  \ |\n| boolean | `Boolean` |\n\n表 4.3：包装类型\n\n基本类型持有一个值，而包装类型持有内存位置的引用/地址。\n\n例如：\n\
  \n基本类型：\n```\nint num = 10;\n```\n\n包装类型：\n```\nInteger num1 = new Integer(20);\n\
  ```\n\n对象的引用被赋值给引用变量 `num1`。以下代码展示了不同包装类的使用：\n\n```\npublic class WrapperDemo {\n\
  \    public void useWrappers() {\n        byte byteVal = Byte.parseByte(\"45\");\n\
  \        System.out.println(\"Byte value is \" + byteVal);\n        if (Character.isDigit('4'))\
  \ {\n            System.out.println(\"Character value is a Digit\");\n        }\n\
