  \n![](img/fm1.png)\n\n# 第 1 章 Java 简介](#contents.xhtml_ch01a)\n\n介绍\n\n本章介绍了面向对象编程的概念，并解释了\
  \ Java 如何演变为一种面向对象编程（OOP）语言。你将学习 Java 的各种版本和特性，以及安装 Java 开发工具包（JDK`）的步骤。你还将学习如何使用\
  \ `JDK` 8 和 `JDK` 10 创建应用程序。\n\n结构\n\n以下是本章涵盖的主题：\n\n* 面向对象编程简介\n* Java 编程语言\n*\
  \ Java 平台和版本\n* Java SE 平台组件\n* Java SE 版本历史\n* Java SE 9 和 Java SE 10 的特性\n* 下载并安装\
  \ `JDK` 8 和 `JDK` 10\n* 设置 `JDK` 路径\n* Java 应用程序开发\n* Java 程序的结构\n* Java 代码的编译与执行\n\
  * 使用 `JDK` 8 创建并执行 Java 程序\n* 使用 `JDK` 10 创建并执行 Java 程序\n* 在 NetBeans 中创建并执行 Java\
  \ 8 项目\n* 在 NetBeans 中创建并执行 Java 10 项目\n\n目标\n\n在本章中，你将学习面向对象编程的概念。你还将学习下载和安装 `JDK`\
  \ 8 和 `JDK` 10。最后，你将理解 Java 程序的结构，并学习在 NetBeans 中开发 Java 项目。你将学习如何下载和安装 `JDK` 8\
  \ 和 `JDK` 10。\n\n## 1.1 面向对象编程简介](#contents.xhtml_sc2_4a)\n\n随着技术的进步和软件复杂性的增加，人们发现需要一种新的且灵活的编程模式。为了创建可靠的软件、减少整体开发和维护成本，并在既定的时间范围内交付完成的软件，促成了面向对象编程模型的开发。\n\
  \n面向对象编程的核心是“对象”。任何具有特定特征和行为并可用其描述的真实世界实体都被视为对象。有多个对象具有某些共同特征，这些特征可以归类为类别或 `classes`（类）。因此，`class`\
  \ 的每一个对象都被视为该 `class` 的一个实例。在编程中，`class` 是一个包含数据（特征）和处理这些数据的方法（行为）的结构。\n\n例如，`Vehicle`（车辆）类可以拥有颜色、类型等特征，以及启动、停止、加速等行为。底图展示了\
  \ `Vehicle` `class` 的统一建模语言（UML）类图：\n\n![](img/Figure_1.1.jpg)\n\n图 1.1：类图\n\n在这里，`Fields`（字段）代表特征，`Methods`（方法）代表对象的行为。`Vehicle`\
  \ `class` 可以拥有 `Vehicle` 类型的实例，例如摩托车、自行车、汽车等。下图详细解释了这一点：\n\n![](img/Figure_1.2.jpg)\n\
  \n图 1.2：Vehicle 类对象\n\n在这里，对象 `bike`（摩托车）具有特征 `color=blue`（蓝色）和 `type=motorcycle`（摩托车），行为包括启动、停止和加速。同样，还可以有其他\
  \ `Vehicle` 类的实例，如汽车、自行车等，它们具有相同或不同的特征值，以及相似的行为。\n\n面向对象编程语言基于以下原则：\n\n*   **封装\
  \ (Encapsulation)**：封装意味着包围。因此，封装允许将数据成员和方法封装在一个名为 `class`（类）的闭合结构中。封装通过数据隐藏来确保数据安全，使使用户无法直接访问\
  \ `class` 的成员。\n*   **抽象 (Abstraction)**：抽象是一种编程概念，将实体的非要要细节从用户视图中隐藏。。例如，在洗衣机的情况下，用户只需按下数字面板上的按钮即可设置流程并启动机器。然而，洗衣机的内部运行机制对用户来说是不可知的。同样，抽象也可以在代码实现，向用户隐藏不必要的细节。\n\
  *   **继承 (Inheritance)**：继承意味着从先辈获取。例如，孩子会继承父母的某些外貌特征和行为。在编程中，继承也扮演着类似的角色。它允许我们将对象的共同特征和行为合并到一个父类\
  \ `class` 中，该 `class` 随后可以被其他类继承。开发者借此扩展并复用现有特征。新的继承类被称为子类、派生类或子类。\n*   **多态 (Polymorphism)**：多态是\
  \ poly（多）和 morph（形式）两个词的组合。多态是指具有多种形式的对象。例如，变色龙可以根据环境改变颜色以保护自己免受捕食者的侵害。在编程中，多态是指对象根据需求以不同方式表现的能力。根据使用的编程语言，多态可以通过多种方式实现。\n\
  \n## 1.2 Java 编程语言](#contents.xhtml_sc2_5a)\n\nJava 是一种流行的面向对象、平台无关编程语言。它允许开发可在不同硬件和操作系统上运行的应用程序。Java\
  \ 还为在设备上执行 Java 应用程序提供了运行时。\n\nJava 最初由 James Gosling 和 Sun Microsystems 的工程师团队于\
  \ 1991 年开发，后来被 Oracle 公司收购。它最初是为洗衣机、电视等消费级设备设计的。对于此类设备，需要一种体积较小、高效、快速且平台无关的语言。由于编译器对特定\
  \ CPU 的依赖，以及开发时间和成本较高，C 和 C++ 等语言并不理想。\n\n因此，Java 被开发为一种可以在任何平台上执行代码的可移植平台无关的语言。它最初命名为\
  \ Oak，后来更名为 Java。\n\n\n\n\n尽管 Java 的开发最初是为了满足较小设备的编程需求，但它被发现能够处理包括 Web 和移动应用在内的更大型的问题。它迅速流行，并在全球范围内被用于开发从嵌入式、桌面、Web\
  \ 到移动应用等各种应用程序。Java 可用于创建从小企业到大型企业、甚至是超级计算机的应用程序。\n\n### 1.2.1 Java 的特性和优势\n\n以下是\
  \ Java 编程语言的一些特性和优势：\n\n- 简单且健壮：Java 语法源自其前身编程语言（如 C、C++），这使得开发者能够快速学习 Java。此外，Java\
  \ 消除了指针、运算符重载、多重继承等其他特征的复杂性。相反，它通过高效的内存管理和异常处理机制使其变得更加健壮。\n\n- 面向对象：Java 基于面向对象的编程范式。因此，它非常适合开发现实世界中的应用程序。\n\
  \n- 平台无关：Java 为早期语言面临的一个大问题——代码的可移植性提供了解决方案。在编译期间，它将源代码转换为一种中间的、架构无关的格式，称为 `bytecode`（字节码）。这种\
  \ `bytecode` 可以在任何安装了 `Java Virtual Machine (JVM)` 的平台上执行。此外，甚至连语言的规范（如原始数据类型和运算符的大小）也被定义为独立于硬件的。这确保了当操作系统、处理器或系统资源发生变化时，代码能够正常运行。\n\
  \n- 安全：安全性是 Java 应用中的一个重要问题，因为它们是为多个和分布式平台设计的。Java 在应用程序开发过程中在不同层级提供安全检查。`JVM` 设计在代码执行期间应用其安全特性，以确保代码是良好且按照\
  \ Java 标准编写的。\n\n- 多线程：Java 支持开发多线程应用程序以并发执行多个任务。在多线程应用程序中，单个程序可以有多个线程独立且并发地执行任务。Java\
  \ 允许创建线程池，以便根据需要获取线程。\n\n- 分布式和动态：Java 支持分布式编程，以便在网络中部署和访问资源。它提供了若干应用程序编程接口（`APIs`）来处理网络上的远程传输和请求。Java\
  \ 还允许对类的动态执行，通过将类存储在单独的位置并在运行时动态加载必要的类来实现。\n\n- 模块化：自 Java 9 起引入了模块化概念。它本应整合到 Java\
  \ 7 和 Java 8 中，但未能实现。直到 Java 1.8，包被封装成 `JAR` 文件，这是 Java 应用程序的最终执行文件。但从 Java 9 开始引入了一种名为\
  \ `Module` 的新结构。模块与 `JAR` 文件相似，但与 `JAR` 文件不同，它还包含 `module-info.java` 文件形式的配置信息。这使得模块与\
  \ `JAR` 文件相比更加强大和灵活，因为所有的依赖项都在 `module-info.java` 文件中指定。使用 `JAR` 时，应用程序执行期间会加载整个\
  \ `JAR`，但使用模块时，只有依赖列表中的模块会被加载。这使得应用程序保持轻量级并运行得更快。\n\n## 1.3 Java 平台和版本\n\nJava 平台是一个用于\
  \ Java 应用程序的开发和执行环境，由软件和硬件组件组成。下图显示了 Java 平台的组件：\n\n![](img/Figure_1.3.jpg)\n\n\
  图 1.3：Java 平台\n\n上图描述了 Java 平台的组件。它由 `Java Runtime Environment (JRE)` 组成，其中包含 Java\
  \ 库（`Java API`）和 `Java Virtual Machine (JVM)`。在 C 和 C++ 等语言中，编译后的代码是取决于平台的，因为它们以可执行二进制代码的形式存在。然而，Java\
  \ 编译器将代码转换为中间 `bytecode`，这是一组经过优化的指令集，可以在任何具有适当 `JVM` 的机器上执行。因此，`JVM` 为 Java 代码提供了平台无关性。每个操作系统（如\
  \ Windows、Linux、Mac 等）都有自己的 `JVM`。因此，Java 代码遵循“编写一次，随处运行”的原则。\n\n`Java API/library`\
  \ 是一系列现成的可用组件的集合，如类和接口，可用于创建应用程序。例如，`Swing` 库用于创建 Java 应用程序的用户界面（UI）。Java 以多个版本发布，以满足特定类型设备和应用程序的需求。以下是不同\
  \ Java 版本的简要描述：\n\n- Java 标准版 (Java SE)：`Java SE` 是创建控制台或基于网络的应用程序的基础，主要用于桌面级计算机。它包含了核心\
  \ `APIs`，包括用于高级编程的基本类型和类，例如网络连接、安全、图形用户界面（GUI）、数据库操作和 XML 数据解析。它还提供了虚拟机、开发和部署工具，以及用于高级编程的其他工具包和库。\n\
  \n- Java 企业版 (Java EE)：`Java EE` 平台是 `Java SE` 平台的扩展。它提供了工具和 `APIs`，用于创建和部署具有复杂业务逻辑的大型、分布式、可扩展、多层、可靠的安全级应用程序。\n\
  \n- Java 微型 (Java ME)：`Java ME` 平台主要用于为手机、电视顶盒等小型设备创建嵌入式 Java 应用程序。它包含了 `Java SE\
  \ APIs` 的子集和一个较小的虚拟机，以便在内存和存储空间较小的小设备上执行 Java 程序。`Java ME` 应用通常作为 `Java EE` 平台服务的客户端。\n\
  \n- JavaFX：`JavaFX` 平台提供了轻量级的用户界面 `APIs`，用于创建使用硬件加速图形和媒体引擎的丰富应用程序。`JavaFX` 允许创建具有现代外观的高性能图形应用程序。它还提供了高级\
  \ `APIs` 来连接网络上的数据源。`JavaFX` 也可以作为 `Java EE` 平台服务的客户端。\n\n## 1.4 Java SE 平台组件\n\n\
  Java SE 平台的两个重要组件是 `Java Runtime Environment (JRE)` 和 `Java Development Kit (JDK)`。\n\
  \n`JRE` 包含了执行 Java 程序所需的所有 Java 库，而 `JDK` 包含了开发 Java 程序所需的库，并发布于 Windows、Mac OS\
  \ X、Linux 等平台。`JDK` 包含了用于开发、编译、调试等所需的工具。它也有自己的 `JRE` 用于执行和测试 Java 应用程序。下图显示了不同的\
  \ Java SE 平台组件：\n\n![](img/Figure_1.4.jpg)\n\n图 1.4：Java SE 平台\n\n以下是工具和库的简要描述：\n\
  \n- 开发工具和 API：工具和实用程序形成了 Java 开发的基础。开发工具包括 `javac` 编译器、`java` 启动器、Javadoc 文档工具等。Java\
  \ `APIs` 是用于不同功能（如网络、XML 解析、GUI 创建、数据库操作等）的可用类和接口。\n\n- 部署工具：`JDK` 提供了在目标机器上部署应用程序的软件。`Java\
  \ Web Start` 和 `Java Plug-in` 是部署工具的示例。\n\n\n\n\n- **用户界面工具包**：JDK 自带了 UI 工具包，如\
  \ `Swing`、`Java2D` 和 `Abstract Window Toolkit` (`AWT`)，用于在 Java 应用中开发图形用户界面。\n-\
  \ **集成库**：集成库如 `Java Database Connectivity` (`JDBC`)、`Java Naming and Directory\
  \ Interface` (`JNDI`) 等，提供了对数据库和远程对象的访问，用于进行数据操作和网络访问。\n- **其他基础库**：这些库包含了用于文件操作、网络、XML\
  \ 解析、安全、国际化等的 API。\n- **语言和工具库**：这些库包括 `Math`、`Collections`、`Logging`、`Regular`\
  \ 等，允许我们在 Java 程序中执行数据操作。\n\n## 1.5 Java SE 版本历史\n\nJava 标准版 (Java SE) 是一个平台，通过\
  \ JDK 提供的开发工具、API、实用程序和运行时环境来构建健壮、可靠且安全的应用程序。多年来，JDK 经过了多次修改，每个新版本都添加了一些主要的增强和新功能。下表列出了\
  \ JDK 的不同版本及其对应的特性和增强：\n\n| 特性和增强 | 代号 | 发布日期 | 特性和增强 |\n| --- | --- | --- | ---\
  \ |\n| JDK 1.0 | Oak | 1996 年 1 月 | 标准库中的包和类创建。 |\n| JDK 1.1 | - | 1997 年 2 月 |\
  \ 带有事件委托的 `AWT`、`JDBC` API、`JavaBeans`。 |\n| J2SE 1.2 | Playground | 1998 年 12 月\
  \ | 名为 `Swing` 的新 GUI API、`Reflection` API 和 `Collection` 框架。 |\n| J2SE 1.3 | Kestrel\
  \ | 2000 年 5 月 | 用于远程查找的 `JNDI`。 |\n| J2SE 1.4 | Merlin | 2002 年 2 月 | 异常链、XML 解析\
  \ API、正则表达式、基于通道的/O 和断言。 |\n| J2SE 5.0 | Tiger | 2004 年 9 月 | 新的程序结构，如 `for-each`\
  \ 循环、注解、泛型和自动装箱 (`auto-boxing`)。 |\n| Java SE 6 | Mustang | 2006 年 12 月 | 包含了脚本语言、Visual\
