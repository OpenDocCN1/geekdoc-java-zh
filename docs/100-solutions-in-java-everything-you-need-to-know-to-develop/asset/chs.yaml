  \ 第 3 章 Java 组件\n\n## 引言\n本章介绍了 Java 类和对象。你将学习类的成员，例如变量、方法、访问修饰符和构造函数。你将学习通过方法和构造函数重载来实现多态。你将理解包的创建以及\
  \ `static`、`final` 和 `this` 关键字的使用。\n\n## 结构\n在本章中，将讨论以下主题：\n* Java 类和对象\n* 访问修饰符\n\
  * 实例变量和方法\n* 构造函数\n* 初始化块\n* 可变参数方法 (Varargs)\n* 方法重载\n* 构造函数重载\n* ‘this’ 关键字\n\
  * ‘final’ 关键字\n* ‘static’ 关键字\n* 包\n\n## 目标\n在本章中，你将学习创建 Java 类和对象。你将理解使用访问修饰符来限制对类的访问。你将接触类成员、方法、构造函数，并理解如何执行方法和构造函数重载。最后，你将学习使用\
  \ `static`、`final` 和 `this` 关键字以及创建包。\n\n## 3.1 Java 类和对象\nJava 类是促进封装的结构。Java 是一种紧密封装的语言，因此在类之外不能声明任何内容，即使是\
  \ `main()` 方法也不行。在 Java 中，类也是一种数据类型，可以创建该类型的对象来访问和操作类成员。\n\n一个类由存储数据的属性/字段和对属性执行某些操作的方法组成。\n\
  \n语法：\n```java\nclass <class-name> {\n// 变量声明\n// 方法定义\n}\n```\n注意类成员被包含在花括号 `{}`\
  \ 中。类名必须遵循某些约定：\n* 类名应该是简单且有意义的名词，例如 `Calculator`。\n* 类名可以是混合大小写，但每个后续单词的首字母应该大写，例如\
  \ `ScientificCalculator`。\n* Java 关键字不能作为类名。\n* 类名不能以数字或符号开头（美元符号 ($) 或下划线 (_)），例如\
  \ `_Calc` 或 `$Calc`。\n\n以下代码显示了名为 `Calculator` 的类的声明：\n```java\nclass Calculator\
  \ {\n// 类成员\n}\n```\n在这里，类 `Calculator` 也是一种数据类型声明，之后可以创建多个对象。使用 `new` 运算符来创建类的对象或实例，它并将引用返回给表示对象的变量。该变量被称为引用变量。\n\
  \n语法：\n`<class-name> <object-name> = new <class-name> ();`\n\n例如：\n`Calculator objCalc\
  \ = new Calculator();`\n\n在这里，语句 `new Calculator()` 在运行时为 `objCalc` 分配内存，并将内存位置的引用返回给引用变量\
  \ `objCalc`。Java 允许先声明对象，后初始化/分配内存。例如：\n`Calculator objCalc;`\n\n`objCalc` 是一个尚未指向任何内存位置的引用变量。也就是说，它是\
  \ `null`。在此处尝试使用该变量会导致错误。在使用此变量之前，必须先进行初始化。例如：\n`objCalc = new Calculator();`\n\n\
  现在，已为对象分配内存，其引用存储在 `objCalc` 变量中。因此，它可以访问 `Calculator` 类的成员。\n\n## 3.2 访问修饰符\n\n\
  \n\n\n\n在 Java 中，除了在类中封装数据成员和方法外，还可以通过访问修饰符提供更进一步的访问限制。Java 提供了 `public`、`private`\
  \ 和 `protected` 访问修饰符，它们为类、字段和方法提供了不同级别的可见性。当类成员没有指定访问修饰符时，默认访问权限为包私有（default）。\n\
  \nJava 支持的访问修饰符有：\n\n*   `public`：`public` 访问修饰符使字段、方法或类对 Java 应用中相同包或另一个包中的任何类都可见。因此，它是所有访问修饰符中限制最少的。\n\
  \n    随着 JDK 9 引入 JPMS，根据 `module-info.java` 文件中 `exports` 的声明，`public` 的含义也被提升到了模块级别。在模块中，`public`\
  \ 关键字可以应用为：\n\n    *   仅在模块内可见：模块内未使用 `exports` 关键字导出的包中的 `public` 类将仅在模块内可访问。例如：\n\
  \n        ```java\n        module com.ModuleA{\n\n        }\n        ```\n\n   \
  \     在这里，由于没有导出任何包，所有类仅在 `ModuleA` 内部是公开的。\n\n    *   对所有人可见：使用 `exports` 关键字导出的模块内包中的\
  \ `public` 类可以被其他模块的类。例如：\n\n        ```java\n        module com.ModuleA{\n    \
  \    exports pkg1.test;\n        }\n\n        module com.ModuleB{\n        requires\
  \ com.ModuleA // 读取 ModuleA\n        }\n        ```\n\n        在这里，导出了 `pkg1`，因此它的公共类可以被其他模块访问。\n\
  \n    *   仅对特定模块可见：仅导出到特定模块的模块内包中的 `public` 类将仅对该模块的类可见。例如：\n\n        ```java\n\
  \        module com.ModuleA{\n        exports pkg1.test to com.ModuleB;\n      \
  \  }\n\n        module com.ModuleB{\n        requires com.ModuleA // 有效\n      \
  \  }\n\n        module com.ModuleC{\n        requires com.ModuleA // 不允许\n     \
  \   }\n        ```\n\n        在这里，`ModuleA` 只允许 `ModuleB` 访问。因此，如果 `ModuleC` 尝试访问\
  \ `ModuleA`，将会报错。\n\n*   `private`：`private` 访问修饰符用于防止访问封装类之外的字段和方法。它是所有访问修饰符中限制严格\
  \ strict。它不能应用于类和接口。从 JDK 9 开始，接口中允许使用 `private` 方法。`private` 访问修饰符通常用于具有无法直接共享的重要数据的字段。所有此类字段都声明为\
  \ `private`，并使用公共的访问器或 getter 方法来访问它们。\n\n*   `protected`：`protected` 访问修饰符用于类之间存在父子关系的情况。声明为\
  \ `protected` 的成员可以被相同包中的所有类访问，但只能被其他包中的子类访问。`protected` 关键字不能应用于类和接口，或接口的字段和方法。\n\
  \n*   `Default`（默认）：当未指定访问修饰符时应用 `default` 访问修饰符。它只允许相同包的类访问类、字段或方法。\n\n## 3.3 实例变量和方法\n\
  \n实例变量和方法是类的成员，分别定义了对象的状态和行为。可以通过创建类的对象来访问这些内容。类的每个实例都有其自己的实例变量副本，但实例方法在执行期间由所有对象共享。语法如下：\n\
  \n`<access-specifier> <data-type> <instance-variable-name>;`\n\n例如：\n\n```java\n\
  private int count;\n```\n\n实例方法用于对实例变量执行操作。语法如下：\n\n```java\n<access-specifier>\
  \ <return-type> <method-name> ([<parameters-list>,]) {\n    // 方法定义\n}\n```\n\n\
  例如：\n\n```java\npublic void add(int a, int b){\n    System.out.println(\"Sum of\
  \ a and b is \"+ (a+b));\n}\n```\n\n在这里，`add` 方法是一个公共方法且没有返回值，由 `void` 表示。它接受两个整数类型的参数。在方法体内部，打印语句显示两个参数的和，这两个参数的值将在运行时在方法调用期间由用户指定。方法名的命名规范如下：\n\
  \n*   方法名不能使用 Java 关键字。\n*   方法名不能包含空格，且不能以数字开头。\n*   方法名应该是一个简单且有意义的动词，描述其功能。\n\
  *   方法名可以以字母、下划线 (`_`) 或美元符号 (`$`) 开头。\n*   多单词的方法名第一个单词应小小写，后续单词的首字母大写，例如 `beginPayment`。\n\
  \n要从类中访问实例变量和方法，必须在 `main()` 方法中创建类的对象。必须使用对象名后跟点（`.`）运算符和方法名来调用方法。在 Java 中，方法始终从另一个方法（称为调用方法）内部被调用/执行。一旦所有被调用方法的语句执行完毕，控制权将返回到调用方法。通常，所有方法都是从类的\
  \ `main()` 方法调用的。`main()` 方法是程序的执行点。\n\n下图显示了 `Calculator` 类的类图，包含其实例变量和实例方法：\n\n\
  ![](img/Figure_3.1.jpg)\n\n图 3.1：类图\n\n以下示例展示了实例变量和方法的使用，通过类的对象：\n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class Calculator {\n    private int sum;\n    String\
  \ name;\n\n    public int add(int a, int b) {\n        sum = a + b;\n        return\
  \ sum;\n    }\n\n    public static void main(String[] args) {\n        Calculator\
  \ objCalc = new Calculator();\n        Scanner s = new Scanner(System.in);\n   \
  \     System.out.println(\"Enter your name: \");\n        objCalc.name = s.next();\n\
  \        System.out.println(\"Enter first number: \");\n        int num1 = s.nextInt();\n\
  \        System.out.println(\"Enter second number: \");\n        int num2 = s.nextInt();\n\
  \        System.out.println(\"Dear, \"+objCalc.name);\n        System.out.println(\"\
  Sum of a and b is \" + objCalc.add(num1, num2));\n    }\n}\n```\n\n在这里，`add` 方法是一个公共方法且没有返回值（注：原文代码中返回\
  \ int 但描述为 void，此处按代码逻辑翻译）。它接受两个整数作为参数。`add` 方法的返回类型为 `int`。因此，提供了一个返回 语句，将 a 和\
  \ b 的和返回给调用方法。\n\n在 `main()` 方法中，使用 `new` 关键字创建了 `Calculator` 类的对象 `objCalc`。接下来，通过\
  \ `Scanner` 类从用户处接受名称并通过 `objCalc.name` 语句存储在 `name` 变量中。从用户处接受两个数字。最后，通过调用 `add`\
  \ 方法传递两个值作为参数来计算 `sum`，即 `objCalc.add(num1,num2)`。使用 `println()` 方法将 `add` 方法返回值打印在屏幕上。\n\
  \n## 3.4 构造函数\n\n构造函数是一个与类名相同的方法。它可以有参数但不能有任何返回类型。它可以用于初始化带有默认值的变量，并用于实例化对象。一旦实例化对象，它就会自动执行。\n\
  \n构造函数可以是默认的或参数化的。\n\n语法：\n\n```java\n// 默认\n<class-name>() {\n    // 初始化语句\n}\n\
  ```\n\n```java\n// 参数化\n<class-name>([<parameter-list],){\n    // 初始化语句\n}\n```\n\
  \n如果类中没有定义构造函数，`JVM` 会调用一个隐式的无参参构造函数。默认构造函数会将创建对象的实例变量初始化为它们的默认值。例如：\n\n```java\n\
  Calculator objCalc = new Calculator();\n```\n\n\n\n\n以下示例展示了无参构造函数和参数化构造函数的使用：\n\
  \n```java\npublic class Calculator {\n    private String name;\n\n    public Calculator()\
  \ {\n        name = \"Undefined\";\n    }\n\n    public Calculator(String username)\
  \ {\n        name = username;\n    }\n\n    public static void main(String[] args)\
  \ {\n        Calculator objCalc = new Calculator();\n        System.out.println(\"\
  Your name is \" + objCalc.name);\n        Calculator objCalc1 = new Calculator(\"\
  John\");\n        System.out.println(\"Your name is \" + objCalc1.name);\n    }\n\
  }\n```\n\n在这里，有两个构造函数：一个无参构造函数，将私有变量 `name` 的值初始化为默认值；另一个构造函数接受一个 `String` 类型参数并将其赋值给\
  \ `name` 变量。\n\n在 `main` 方法中，第一个对象 `objCalc` 使用无参构造函数实例化，而第二个对象 `objCacl1` 使用参数化构造函数实例化。接下来，在屏幕上打印两个对象的\
  \ `name` 变量的值。\n\n代码的输出所示：\n\n![](img/Figure_3.3.jpg)\n\n图 3.3：使用构造函数\n\n## 3.5\
  \ 初始化块\n\nJava 允许使用初始化块作为构造函数的替代方案，用于用默认值初始化变量。在对象实例化，初始化块会在构造函数执行之前执行。\n\n以下示例展示了初始化块的使用：\n\
  \n```java\npublic class Calculator {\n    private String name;\n\n    {\n      \
  \  name = \"Unknown\";\n    }\n\n    public static void main(String[] args) {\n\
  \        Calculator objCalc = new Calculator();\n        System.out.println(\"Your\
  \ name is \" + objCalc.name);\n        objCalc.name = \"John\";\n        System.out.println(\"\
  Your name is \" + objCalc.name);\n    }\n}\n```\n\n在这里，初始化块 `{}` 初始化了变量 `name` 的值。在\
  \ `main` 方法中，实例化了对象 `objCalc` 并打印了 `name` 的值。接下来，显式地为变量 `name` 赋值，然后在屏幕上进行打印。\n\n\
  代码的输出所示：\n\n![](img/Figure_3.4.png)\n\n图 3.4：使用初始化块\n\n## 3.6 按值传递和按引用传递\n\n方法声明中指定的变量称为\
  \ `parameters`（参数），而在调用期间传递给它的实际值称为 `arguments`（参数）。在多参数的情况下，参数的类型和顺序必须与方法的参数一致。\n\
  \n参数可以是基本数据类型（如 `int`、`double` 等），也可以是引用类型（如对象、`arrays` 等）。\n\n### 3.6.1 按值传递参数\n\
  \n当按值传递参数时，参数的拷贝会从调用方法传递到被调用方法。在这种情况下，被调用方法内部对参数的任何修改都不会反映在调用方法中。\n\n以下示例展示了如何按值传递参数：\n\
  \n```java\npublic class PassByVal {\n    public void modifyVal(int val) {\n    \
  \    val = val + 10;\n    }\n\n    public static void main(String[] args) {\n  \
  \      int val = 10;\n        PassByVal obj1 = new PassByVal();\n        obj1.modifyVal(val);\n\
  \        System.out.println(\"Value of val after method invocation is \" + val);\n\
  \    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_3.5.png)\n\n注意，变量 `val` 在传递给 `modifyVal()`\
  \ 方法后值仍为 10。这是因为 `val` 是按值传递的，所以只有 `val` 值的拷贝传递给了 `modifyVal()` 方法。并没有传递实际内存地址，因此在调用\
  \ `modifyVal()` 方法后，`val` 的值保持为 10。\n\n### 3.6.2 按引用传递参数\n\n当按引用传递参数时，参数的实际内存地址会被传递给方法。这意味着，如果被调用方法修改了参数的值，该修改也会反映在调用方法中。\n\
  \n同一个对象有两个引用，即参数引用变量和参数引用变量。以下代码展示了如何按引用传递参数：\n\n```java\npublic class PassByRef\
  \ {\n    public float areaCircle(CommonVals objPi, float r) {\n        float area\
  \ = objPi.getPI() * r * r;\n        objPi.Pi = 3.15f; // modify the value of Pi\n\
  \        return area;\n    }\n\n    public static void main(String[] args) {\n \
  \       PassByRef p1 = new PassByRef();\n        CommonVals c1 = new CommonVals();\n\
  \        System.out.printf(\"Area of circle is %03.2f\", p1.areaCircle(c1, 3));\n\
  \        System.out.printf(\"\\nModified value of PI is %01.2f %n\",c1.getPI());\n\
  \    }\n}\n\nclass CommonVals {\n    float Pi = 3.14f;\n\n    public float getPI()\
  \ {\n        return Pi;\n    }\n}\n```\n\n`CommonVals` 类包含 `getPI()` 方法，它将返回变量 `Pi`\
  \ 的值。在 `PassByRef` 类中，`areaCircle()` 方法返回变量 `Pi` 的值（注：此处原文描述似乎存在逻辑错乱，已按字意翻译）。\n\n\
