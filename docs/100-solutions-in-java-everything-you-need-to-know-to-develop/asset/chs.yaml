  \  public String getModMessages() {\n        ModClass1 objMod1 = new ModClass1();\n\
  \        ModClass2 objMod2 = new ModClass2();\n        return objMod1.getMod1Msg()\
  \ + \" \" + objMod2.getMod2Msg();\n    }\n}\n```\n在这里，`Module1` 的 `pkg1` 包被导入到 `TestMod2`\
