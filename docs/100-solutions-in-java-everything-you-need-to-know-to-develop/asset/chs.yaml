  \ (`<>`)、处理一个或多个异常的单个 `catch` 块。 |\n| Java SE 8 (LTS) | | 2014 年 3 月 | 在 `Iterable`\
  \ 接口中引入 `forEach()` 方法、Lambda 表达式、Time API、支持接口中的 `default` 和 `static` 方法、`Collection\
  \ API` 的改进、函数式接口、使用 `Java Stream API` 对集合进行批量操作、并发 API、`Java I/O` 和核心 API。 |\n|\
