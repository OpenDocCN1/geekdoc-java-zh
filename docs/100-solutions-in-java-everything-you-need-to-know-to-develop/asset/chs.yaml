  obj1.viewScores();\n}\n\n}\n```\n\n在这里，声明了一个二维数组，然后在构造函数中对其实例化和初始化。数组的值通过在 `main()`\
  \ 方法中调用 `viewScores()` 方法打印。代码的输出所示：\n\n![](img/Figure_4.5.jpg)\n\n图 4.5: 二维数组\n\
  \n### 4.1.3 使用循环处理数组\n\n初始化和访问单个数组元素可能非常耗时，特别是当数组很大时。为了减少工作，Java 允许使用循环来初始化和处理数组。下面的示例展示了使用循环显示一维数组和多维数组元素：\n\
  \n```java\npublic class ArrayWithLoops {\n\nint score[];\nint scores[][];\n\npublic\
  \ ArrayWithLoops() {\nscore = new int[5];\nscore[0] = 40; score[1] = 56;\nscore[2]\
  \ = 76; score[3] = 60;\nscore[4] = 85;\nSystem.out.println(\"Scores Added to One-dimensional\
  \ Array\");\nscores = new int[5][2];\nscores[0][0] = 40; scores[0][1] = 60;\nscores[1][0]\
  \ = 56; scores[1][1] = 45;\nscores[2][0] = 76; scores[2][1] = 65;\nscores[3][0]\
  \ = 60; scores[3][1] = 74;\nscores[4][0] = 85; scores[4][1] = 90;\nSystem.out.println(\"\
  Scores Added to Two-dimensional Array\");\n}\n\npublic void viewScores() {\nSystem.out.println(\"\
  Scores of one-dimensional array are:\");\nfor (int i = 0; i < score.length; i++)\
  \ {\nSystem.out.println(score[i]);\n}\nSystem.out.println(\"Scores of two-dimensional\
  \ array are:\");\nfor (int row = 0; row < scores.length; row++) {\nSystem.out.println(\"\
  Player \" + (row + 1));\nfor (int col = 0; col < scores[row].length; col++) {\n\
  System.out.println(scores[row][col]);\n}\n}\n}\n\npublic static void main(String[]\
  \ args) {\nArrayWithLoops obj = new ArrayWithLoops();\nobj.viewScores();\n}\n\n\
  }\n```\n\n注意使用内层循环打印二维数组。对于外层循环的每次迭代，都会调用内层循环，直到遍历数组中可用列的数量（该数量通过语句 `scores[row].length`\
  \ 获取）。\n\n代码的输出所示：\n\n![](img/Figure_4.6.png)\n\n图 4.6: 在数组中使用循环\n\n### 4.2 Java\
  \ 中的 String 类\n\nJava 没有提供可以存储多个字符（即字符串）的原型类型。为了实现这一点，必须使用字符数组，如下所示：\n\n```java\n\
  char[] message = {'H','e','l,}\n```\n\n在有多个值的情况下，需要二维数组。但数组的大小在声明时是固定的，因此无法存储不同大小的字符串，例如姓名或地址等。此外，操作字符数组可能是一项繁琐的任务。\n\
  \n为了解决这个问题，Java 提供了 `String` 数据类型可以在不创建数组的情况下存储多个字符。`String` 变量是 `String` 类的实例，其值存储在双引号中，例如\
  \ Hello。\n\n也可以使用 `new` 关键字显式地创建 `String` 类的实例，如下所示：\n\n```java\nString msg = new\
  \ String();\n```\n\n要拼接字符串，Java 提供了 `+` 运算符。例如：\n\n```java\nString msg = \"Hello\"\
  ;\nString msg1 = \"World\";\nSystem.out.println(msg + msg1);\n```\n\n字符数组可以转换为字符串，如下所示：\n\
  \n```java\nchar[] msg = {'H', 'e', 'l', 'l','o'};\nString message = new String(msg);\n\
  ```\n\n`String` 类提供了几种用于字符串操作的方法。下表列出了 `String` 类常用的方法。考虑字符串 `msg=\"Hello\"`：\n\n\
  | 方法 | 说明 |\n| :--- | :--- |\n| `length(String)` | 返回字符串的长度。 |\n| `concat(String\
  \ str)` | 将参数连接到字符串。 |\n| `substring(int beginIndex, int endIndex)` | 从起始索引提取字符串部分。\
  \ |\n| `toString()` | 通过将其他数据类型转换为字符串来返回 String 对象。 |\n| `compareTo(String str)`\
  \ | 根据 Unicode 值比较两个 String 对象。 |\n| `charAt(int index)` | 获取指定索引处的字符。 |\n| `indexOf(String\
  \ str)` | 返回字符串中指定字符或字符串首次出现的索引。 |\n| `lastIndexOf(String str)` | 返回字符串中指定字符或字符串最后一次出现的索引。\
  \ |\n| `replace(char old, char new)` | 将当前字符串中所有指定字符替换替换为给定的新字符。 |\n| `toUppercase()`\
  \ | 将指定的字符串转换为大写。 |\n| `toLowercase()` | 将指定的字符串转换为小写。 |\n| `trim()` | 返回去除了当前字符串两端空白字符后的新字符串。\
  \ |\n| `equals(String str)` | 如果字符串参数等于 String 对象的值，则返回 true，否则返回 false。 |\n\n表\
  \ 4.1: String 类的方法\n\n\n\n\n```java\nSystem.out.println(\"Difference after comparison\
  \ is \" + msg.compareTo(\"World\"));\nSystem.out.println(\"Character at index 1\
  \ is:\" + msg.charAt(2));\nSystem.out.println(\"First index of character l is:\"\
  \ + msg.indexOf(\"l\"));\nSystem.out.println(\"Last index of character l is:\" +\
  \ msg.lastIndexOf(\"l\"));\nSystem.out.println(\"New string after replacement is\
  \ \" + msg.replace('o', 'a'));\nSystem.out.println(\"Uppercase String is:\" + msg.toUpperCase());\n\
  System.out.println(\"Lowercase String is:\" + msg.toLowerCase());\nString msg1 =\
  \ \" Hello \";\nSystem.out.println(\"String before trimming: \" + msg1);\nSystem.out.println(\"\
  String after trimming:\" + msg1.trim());\n}\n\npublic static void main(String[]\
  \ args) {\n    StringDemo obj = new StringDemo();\n    obj.display();\n}\n}\n```\n\
  \n该代码打印了应用于字符串 `Hello` 上的不同 `String` 类方法的输出。代码的输出所示：\n\n![](img/Figure_4.7.png)\n\
  \n图 4.7：String 类方法\n\n## 4.3 字符串数组\n\n字符串数组用于在同一个变量中存储多个字符串。字符串数组的创建方式与基本数据类型数组相同。例如：\n\
  \n```java\nString[] items = new String[5];\n```\n\n在这里，分配了内存来存储 5 个字符串的引用。要操作 `String`\
  \ 数组，可以使用 `for`、`while` 和增强 `for` 循环。\n\n以下代码展示了 `String` 数组的用法：\n\n```java\npublic\
  \ class StringArrayDemo {\n    String[] itemId = new String[5];\n\n    public StringArrayDemo()\
  \ {\n        System.out.println(\"Products Added\");\n        for (int count = 0;\
  \ count < itemId.length; count++) {\n            itemId[count] = \"Item00\" + (count+1);\n\
  \        }\n    }\n\n    public void displayProducts() {\n        System.out.println(\"\
  Products in the inventory are:\");\n        for (String item : itemId) {\n     \
  \       System.out.println(item);\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        StringArrayDemo obj = new StringArrayDemo();\n        obj.displayProducts();\n\
  \    }\n}\n```\n\n在这里，一个名为 `itemId` 的字符串数组在构造函数中通过 `for` 循环创建并初始化。增强 `for` 循环用于显示数组的元素。代码的输出所示：\n\
  \n![](img/Figure_4.8.jpg)\n\n图 4.8：字符串数组\n\n`java.lang.String` 类不能被其他类继承，因为它是一个\
  \ `final` 类。字符串是不可变的，因此当值以后不太可能发生变化时可以使用它们。但如果字符串值在以后可能会发生变化，建议使用 `StringBuilder`\
  \ 类。\n\n| 早期的 `StringBuffer` 类用于创建可变字符串，但由于使用了线程同步，效率并不高。这在增强型类 `StringBuilder`\
  \ 中得到了解决。它允许在没有同步开销的情况下修改字符串，因此在执行上要快得多。 |\n\n### 4.4 Java 中的 StringBuilder 类\n\n\
  与 `String` 对象不同，`StringBuilder` 对象是可变的。`StringBuilder` 类的不同方法允许修改字符串对象。在某些情况下，`StringBuilder`\
  \ 提供了代码更简单的优势，例如，`StringBuilder` 是连接多个字符串的更高效的选择。\n\n`StringBuilder` 类的构造函数：\n\n\
  *   `StringBuilder()`：这是默认构造函数，为 16 个字符提供空间。\n*   `StringBuilder(int capacity)`：此构造函数创建一个空对象，但为参数\
  \ `capacity` 中指定的字符数量预留空间。\n*   `StringBuilder(String str)`：此构造函数创建一个一个对象，并用指定字符串\
  \ `str` 的内容进行初始化。\n\n`StringBuilder` 类的方法如下：\n\n下表列出了 `StringBuilder` 类的方法：\n\n\
  | 方法 | 说明 |\n| --- | --- |\n| `length()` | 返回类中字符序列的长度。例如，`StringBuilder msg = new\
  \ StringBuilder(\"JPMS is \");System.out.println(msg.length()); // 返回 8 |\n| `append()`\
  \ | 在 `StringBuilder` 对象末尾附加值。它接受不同类型的参数。例如，`StringBuilder msg = new StringBuilder(\"\
  JPMS is \");System.out.println(msg.append(\"New \")); // 返回 \"JPMS is New\" |\n\
  | `insert()` | 在指定位置将一个字符串插入另一个字符串中。`insert()` 方法有多个版本如下：`StringBuilder insert(int\
  \ position, String str)```StringBuilder insert(int position, char ch)```StringBuilder\
  \ insert(int position, float f)`例如，`StringBuilder msg = new StringBuilder(\"JPMS\
  \ is \");System.out.println(msg.insert(8, \"New\")); // 返回 \"JPMS is New\" |\n|\
  \ `delete()` | 从 `StringBuilder` 对象中删除指定数量的字符。例如，`StringBuilder msg = new StringBuilder(\"\
  JPMS is New\");System.out.println(msg.delete(4,7)); // 返回 \"JPMS New\" |\n| `reverse()`\
  \ | 反转 `StringBuilder` 对象的字符。例如，`StringBuilder msg = new StringBuilder(\"JPMS is\
  \ New\");System.out.println(msg.reverse()); // 返回 \"weN si SMPJ\" |\n\n表 4.2：`StringBuilder`\
  \ 类方法\n\n以下代码展示了 `StringBuilder` 类的用法：\n\n```java\npublic class StringBuilderDemo\
  \ {\n    StringBuilder msg = new StringBuilder(\"JPMS is \");\n\n    public void\
  \ display() {\n        System.out.println(\"String length:\" + msg.length());\n\
  \        System.out.println(\"String after appending:\" + msg.append(\"New \"));\n\
  \        System.out.println(\"String after insertion:\" + msg.insert(8, \"New\"\
  ));\n        System.out.println(\"String after deletion:\" + msg.delete(4,7));\n\
  \        System.out.println(\"Reversed string:\" + msg.reverse());\n    }\n\n  \
  \  public static void main(String[] args) {\n        StringBuilderDemo obj = new\
  \ StringBuilderDemo();\n        obj.display();\n    }\n}\n```\n\n该代码打印了应用于字符串 `JPMS\
  \ is ` 上的不同 `StringBuilder` 方法的输出。代码的输出所示：\n\n![](img/Figure_4.9.png)\n\n图 4.9：StringBuilder\
  \ 类方法\n\n### 4.5 Java 中的 StringTokenizer 类\n\n`java.util.StringTokenizer` 类提供了拆分字符串为标记的方法。\n\
  \n该类的构造函数如下：\n\n*   `StringTokenizer(String str)`：使用指定的字符串创建 `StringTokenizer`。\n\
  *   `StringTokenizer(String str, String delim)`：使用指定的字符串和分隔符创建 `StringTokenizer`。\n\
  *   `StringTokenizer(String str, String delim, boolean returnValue)`：使用指定的字符串、分隔符和\
  \ `returnValue` 创建 `StringTokenizer`。如果 `returnValue` 为真，则分隔符字符也被视为标记。\n\n`StringTokenizer`\
  \ 类的方法如下：\n\n*   `hasMoreTokens()`：检查是否有更多标记。\n*   `hasMoreElements()`：类似于 `hasMoreTokens()`\
  \ 方法。\n*   `nextToken()`：从 `StringTokenizer` 对象中返回下一个标记。\n*   `nextToken(String\
  \ delim)`：根据分隔符返回下一个标记。\n*   `nextElement()`：类似于 `nextToken()` 但返回一个 `Object`。\n\
  *   `countTokens()`：返回标记的总数。\n\n以下示例展示了 `StringTokenizer` 类的用法：\n\n```java\npublic\
  \ class StringTokenDemo {\n    public static void main(String[] args) {\n      \
  \  StringTokenizer st = new StringTokenizer(\"East West North South\", \" \");\n\
  \n        while (st.hasMoreTokens()) {\n            System.out.println(st.nextToken());\n\
  \        }\n\n        StringTokenizer st1 = new StringTokenizer(\"East,West,North,South\"\
  );\n        // 打印下一个标记\n        System.out.println(\"Next token is \" + st1.nextToken(\"\
  ,\"));\n    }\n}\n```\n\n第一个 `StringTokenizer` 对象使用空格 “ ” 字符作为分隔符，而第二个对象使用逗号 “，”\
  \ 作为分隔符。代码的输出所示：\n\n![](img/Figure_4.10.jpg)\n\n图 4.10：使用 StringTokenizer\n\n###\
  \ 4.6 向 main() 方法传递参数\n\n`main()` 方法接收一个 `String` 数组作为参数。这些参数可以在运行时从命令行在类名之后指定。例如：\n\
