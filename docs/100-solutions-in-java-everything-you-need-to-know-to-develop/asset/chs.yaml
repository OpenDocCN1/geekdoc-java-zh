  \n![](img/Figure_9.20.jpg)\n\n图 9.20: `InflaterOutputStream` 类\n\n## 9.9 java.nio\
  \ 包\n\nJava 引入了新的 `java.nio.file` 包以便方便地访问文件。\n\n\n\n\n\n`java.nio` 包随 J2SE 1.4\
  \ 引入。`NIO` 代表 New Input/Output（新输入/输出）。Java SE 7 引入了 `NIO.2`，其目标与 `NIO` 相同，即改进应用程序开发中的\
  \ I/O 操作。`NIO` 提升性能取决于操作系统、数据、大规模存储、JVM 以及主机虚拟化。`java.nio` 包定义了作为数据容器的缓冲区（buffers）。\n\
  \n以下是 NIO API 的重要特性：\n\n- `Charsets`、解码器和编码器：在字节和 Unicode 字符之间转换数据。`java.nio.charset`\
  \ 包了字符集 API。它比 `getBytes()` 方法更灵活，性能更好且实现更简单。\n- `Buffers`（缓冲区）：作为数据容器，被所有 NIO API\
  \ 使用。缓冲区类定义在 `java.nio` 包中。\n- `Channels`（通道）：表示能够执行 I/O 操作的实体连接。这些是抽象的文件和套接字，并支持异步\
  \ I/O。\n- `Selectors`（选择器）和 `Selection Keys`（选择键）：与可选择通道一起定义了多路复用非阻塞 I/O。\n\n> 注意：在非阻塞\
  \ I/O 中，I/O 操作是基于事件的。发生 I/O 事件时，定义一个选择器来管理该事件，并唤醒和执行。通道和选择器 API 定义在 `java.nio.channels`\
  \ 包中。\n\n`java.nio.file` 包和 `java.nio.file.attribute` 包支持文件 I/O 并帮助访问默认文件系统。文件系统在硬盘等存储介质上存储和组织文件。每个文件在系统中都有路径，并可以轻松访问：\n\
  \n- `File systems`（文件系统）：通常，在文件系统中，文件以分级结构存储，有一个根节点，在其下不同级别创建其他子目录和文件。可能有多个根目录，路径分隔符具有不同的特性。可以通过相对或绝对路径访问文件。NIO.2\
  \ 中的 `java.nio.file.Path` 对象表示文件或目录的相对或绝对位置。在 JDK 7 之前，文件由 `java.io.File` 类表示。\n\
  - `Path`：路径从根节点开始标识文件在文件系统中的位置。某些操作系统支持单个根节点（如 Solaris），用斜杠 `/` 分隔。某些操作系统（如 Windows）支持多个根节点，每个根节点映射到一个卷，如\
  \ `E:\\`。每个文件系统使用不同的路径分隔符（分隔符）来分隔目录名。例如，Solaris 使用正斜杠 (`/`)，而 MS Windows 使用反斜杠 (`\\\
  `)。\n\n  MS Windows 路径示例：`C:\\user\\demos\\datafile`\n  Solaris 路径示例：`/home/user/demos/datafile`\n\
  \n  - 绝对路径：包含从根节点到文件或目录的完整目录列表。\n    例如：`/home/user/demos/datafile`\n  - 相对路径：不包含路径的完整目录列表。\n\
  \    例如：`user/demos/datafile`\n- `Files`：NIO.2 中访问文件的新包和类如下：\n  - `java.nio.file.Path`：使用依赖于系统的路径定位文件或目录。\n\
  \  - `Java.nio.file.Files`：使用 `Path` 对象对文件和目录执行操作。\n  - `java.nio.file.FileSystem`：提供文件系统的接口，并帮助创建\
  \ `Path` 对象以及访问文件系统的其他对象。\n\n使用 `java.io.File` 时，路径操作的方法与读写文件的方法在同一个包中。在 NIO.2 中，这些方法分别分离到\
  \ `Path` 接口和 `Files` 类中。`Path` 接口创建并控制路径，而 `Files` 类对文件执行操作。\n- `Symbolic links`（符号链接）：符号链接（symlink）是对另一个文件的引用，也称为目标。例如，Windows\
  \ 中的文件快捷方式。对符号链接的操作会自动重定向到链接的目标。在符号链接上的读/写操作等于对文件或目录的读写。然而，删除或重命名符号链接不会影响目标文件。\n\
  \n### 9.9.1 Path 接口\n\n`java.nio.file.Path` 接口对象用于定位和操作文件系统中的文件。路径由分隔符分隔的目录名和文件名组成。空路径是指只有一个元素名称路径。\n\
  \n以下是 Path 接口的一些重要方法：\n\n- 访问路径元素的方法：`getRoot()`、`getParent()`、`subpath()`、`getFileName()`。\n\
  - 合并路径的方法：`resolve()`、`resolveSibling()`。\n- 在两个路径之间构建相对路径的方法：`relativize()`。\n\
  - 比较和测试路径的方法：`startsWith()`、`endsWith()`。\n\n`Path` 对象是不可变的，一旦创建就无法更改。`java.nio.file`\
  \ 包中的另一个静态 final 类是 `Paths` 类，它只包含静态方法，这些方法从路径字符串或 URI 返回 `Path` 对象。\n\n以下代码演示了\
  \ Path 接口的使用：\n\n```java\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  \npublic class PathsDemo {\n\n    public static void main(String[] args) {\n   \
  \     Path p = Paths.get(\"D:/Demos/File.txt\");\n        System.out.println(\"\
  File Name: \" + p.getFileName());\n        System.out.println(\"Parent: \" + p.getParent());\n\
  \        System.out.println(\"Name Count:\" + p.getNameCount());\n    }\n}\n```\n\
  \n### 9.9.2 Files 类\n\n文件操作通过 `java.nio.file.Files` 类的静态方法对 `Path` 对象执行。下面章节解释了不同的文件操作：\n\
  \n#### 9.9.2.1 列出目录内容\n\n这是通过使用 `DirectoryStream` 类实现的。它允许遍历任何 `Path` 目录下的所有目录和文件。如果在遍历指定目录条目时遇到\
  \ I/O 错误，将抛出 `DirectoryIteratorException`；如果模式无效，则抛出 `PatternSyntaxException`。\n\
  \n以下代码演示了使用 `DirectoryStream` 类进行迭代：\n\n```java\nimport java.io.IOException;\nimport\
  \ java.nio.file.DirectoryIteratorException;\nimport java.nio.file.DirectoryStream;\n\
  import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  import java.util.Iterator;\n\npublic class ListDir {\n    public static void main(String[]\
  \ args) {\n        Path p = Paths.get(\"D:/Demos\");\n        try (DirectoryStream<Path>\
  \ ds = Files.newDirectoryStream(p, \"*.txt\")) {\n            for (Iterator<Path>\
  \ itr = ds.iterator(); itr.hasNext();) {\n                Path p1 = itr.next();\n\
  \                System.out.println(p1.getFileName());\n            }\n        }\
  \ catch (IOException | DirectoryIteratorException e) {\n            System.err.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n#### 9.9.2.2 创建目录和文件\n\n`createDirectory(Path dir)`\
  \ 方法用于创建新目录。`createDirectories()` 方法可以用于创建从顶到底的目录结构。例如，要创建目录结构，使用 `createDirectories()`\
  \ 方法：\n\n```java\nFiles.createDirectories(Paths.get(\"D:/Demos/dir/sample\"));\n\
  ```\n\n\n\n\n目录 `dir` 将在 Demos 内部创建，而示例目录将在 `dir` 内部创建。同样，要创建一个文件，可以使用如下所示的 `createFile()`\
  \ 方法：\n\n```\nFiles.createFile(Path dir)\n```\n\n### 9.9.2.3 检查文件或目录的存在性\n\n要检查路径是否存在，请使用\
  \ `Files` 类的以下方法：\n\n*   `exists(Path, LinkOption...opt)`: 检查给定的文件是否存在。默认情况下，它使用符号链接。\n\
  *   `notExists(Path, LinkOption...)`: 检查文件是否存在。\n\n如果 `exists()` 和 `notExists()`\
  \ 都返回 `false`，则无法验证文件的存在性。在这种情况下，文件的状态是未知的。这通常发生在程序没有访问该文件的权限时。\n\n可以使用 `isReadable(Path)`、`isWritable(Path)`\
  \ 和 `isExecutable(Path)` 方法来检查程序是否可以访问某个文件。\n\n例如：\n\n```java\nPath file = ...;\n\
  boolean isRegularExecutableFile = Files.isRegularFile(file) & Files.isReadable(file)\
  \ & Files.isExecutable(file);\n```\n\n| 注意：这些测试可能无法给出可靠的结果。 |\n\n当系统使用符号链接时，可能会通过两个不同的路径定位同一个文件。在这种情况下，可以使用\
  \ `isSameFile(Path, Path)` 方法比较两个路径，并验证它们是否指向文件系统上的同一个文件。例如：\n\n```java\nPath p1\
  \ = ...;\nPath p2 = ...;\nif (Files.isSameFile(p1, p2)) {\n    …\n}\n```\n\n###\
  \ 9.9.2.4 文件的读写操作\n\n使用 `readAllBytes` 或 `readAllLines` 方法读取文件。\n\n例如：\n\n```java\n\
  Path p1 = ….;\nbyte[] data;\ndata = Files.readAllBytes(p1);\n```\n\n要写入文件，请使用以下方法：\n\
  \n*   `write(Path p, byte[] b, OpenOption… options)`: 将字节写入文件。这里，`p` 表示文件的路径，`b`\
  \ 是要写入的字节数组，`options` 表示打开文件的模式。它会抛出 `IOException`、`UnsupportedOperationException`\
  \ 和 `SecurityException`。\n\n    下面列出了 `OpenOptions` 的标准值：\n    *   `WRITE`: 以写模式打开文件\n\
  \    *   `APPEND`: 将数据追加到文件末尾。配合 `WRITE` 或 `CREATE` 使用\n    *   `TRUNCATE_EXISTING`:\
  \ 截断文件\n    *   `CREATE_NEW`: 创建新文件\n    *   `CREATE`: 如果文件不存在则创建新文件，否则打开文件\n  \
  \  *   `DELETE_ON_CLOSE`: 在流关闭时删除文件\n*   `write(Path p, Iterable<extends CharSequence>\
  \ lines, CharSet ch, OpenOption… options)`: 向文件写入文本行。这里，`p` 表示文件的路径，`lines` 指定了一个用于迭代字符序列的对象，`ch`\
  \ 指定了用于编码的字符集，而 `options` 表示打开文件的模式。\n\n    例如：\n\n    ```java\n    Path p1 = ...;\n\
  \    byte[] data = ...;\n    Files.write(p1, data);\n    ```\n\n| 注意：`java.nio.file`\
  \ 包支持通道 I/O，它在缓冲区中移动数据并绕过某些阻碍流式 I/O 的层。 |\n\n使用 `newBufferedWriter(Path, Charset,\
  \ OpenOption...)` 方法通过 `BufferedWriter` 写入文件。`newBufferedReader(Path, Charset)`\
  \ 方法打开文件进行读取并返回 `BufferedReader` 对象，允许高效地从文件中读取。\n\n以下代码演示了如何使用缓冲流 I/O 写入和读取文件：\n\
  \n```java\nimport java.io.BufferedReader;\nimport java.io.BufferedWriter;\nimport\
  \ java.io.IOException;\nimport java.nio.charset.Charset;\nimport java.nio.file.Files;\n\
  import java.nio.file.Path;\nimport java.nio.file.Paths;\n\npublic class ReadWriteFiles\
  \ {\n    public static void main(String[] args) {\n        Charset c = Charset.forName(\"\
  US-ASCII\");\n        String str = \"Example of Read Write by using Files class\"\
  ;\n        Path p1 = Paths.get(\"D:/Demos/ReadWrite.txt\");\n        try {\n   \
  \         BufferedWriter bw = Files.newBufferedWriter(p1, c);\n            // write\
  \ to file\n            bw.write(str, 0, str.length());\n            bw.close();\n\
  \            String strRead = null;\n            // read from file\n           \
  \ BufferedReader br = Files.newBufferedReader(p1, c);\n            while ((strRead\
  \ = br.readLine()) != null) {\n                System.out.println(strRead);\n  \
  \          }\n            br.close();\n        } catch (IOException e) {\n     \
  \       System.out.println(\"Error: \" + e.getMessage());\n        }\n    }\n}\n\
  ```\n\n`newBufferedWriter()` 方法创建一个以“US-ASCII”编码的文件，而 `newBufferdReader()` 方法则从文件中读取内容。\n\
  \n### 9.9.2.5 复制文件或目录\n\n可以使用 `copy(Path, Path, CopyOption...)` 方法复制文件或目录。下面列出了复制时的一些要点：\n\
  \n*   如果目标文件存在，应使用 `REPLACE_EXISTING` 选项，否则复制将失败。\n*   在复制目录时不会移动其内容。\n*   复制符号链接时，使用\
  \ `NOFOLLOW_LINKS` 或 `REPLACE_EXISTING` 选项。\n\n下面是 `copy` 的标准选项：\n*   `COPY_ATTRIBUTES`:\
  \ 复制文件属性。\n*   `NOFOLLOW_LINKS`: 复制符号链接时不跟随链接。\n*   `REPLACE_EXISTING`: 即使目标文件存在也覆盖。\n\
  \n例如：\n\n```java\nimport static java.nio.file.CopyOption.*;\n...\nFiles.copy(source,\
  \ target, REPLACE_EXISTING);\n```\n\n下面是 `Files` 用于在文件复制的方法：\n\n*   `copy(InputStream\
  \ in, Path file, CopyOption... options)`: 从输入流复制到文件。这里，`options` 指定了如何执行复制。它会抛出\
  \ `IOException`、`SecurityException`、`FileAlreadyExistsException`、`DirectoryNotEmptyException`\
  \ 和 `UnsupportedOperationException`。\n*   `copy(Path file, OutputStream out)`: 将文件的所有字节复制到输出流。它会抛出\
  \ `IOException`。\n\n以下代码演示了使用 `copy()` 方法将输入流复制到文件：\n\n```java\nimport java.io.IOException;\n\
  import java.io.InputStream;\nimport java.net.MalformedURLException;\nimport java.net.URI;\n\
  import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  import java.nio.file.StandardCopyOption;\n\npublic class CopyDemo {\n    public\
  \ static void main(String[] args) {\n        Path p1 = Paths.get(\"D:/Demos/copy.txt\"\
  );\n        URI uri1 = URI.create(\"https://www.yahoo.com/\");\n        try (InputStream\
  \ is = uri1.toURL().openStream()) {\n            //copy input stream to file\n \
  \           Files.copy(is, p1, StandardCopyOption.REPLACE_EXISTING);\n        }\
  \ catch (MalformedURLException e) {\n            System.out.println(\"Error: \"\
  \ + e.getMessage());\n        } catch (IOException e) {\n            System.out.println(\"\
  Error: \" + e.getMessage());\n        }\n    }\n}\n```\n\n网页数据通过输入流读取并复制到文件中。输出将如下：\n\
  \n![](img/Figure_9_23.png)\n\n图 9.23：复制数据到文件\n\n### 9.9.2.6 移动文件或目录\n\n可以使用 `move(Path,\
  \ Path, CopyOption...)` 方法执行移动操作。如果目标文件存在，应使用 `REPLACE_EXISTING` 选项，否则移动将失败。移动非空目录不会移动其内容。\n\
  \n语法：\n\n```\nFiles.move(Path source, Path target, CopyOption... options)\n```\n\
  \n移动要点：\n下面列出了常用的 `CopyOption` 枚举：\n*   `REPLACE_EXISTING`: 对于非空目录，即使目标文件存在也替换目标文件。对于符号链接，它仅替换符号链接，但链接的目标不会被替换。\n\
  *   `ATOMIC_MOVE`: 作为原子文件系统操作移动文件和目录。此选项用于将文件移动到目录中。如果文件系统不支持原子移动，则抛出异常。\n\n\n\n\
  \n\n* 如果目标路径是一个空目录，如果使用了 `REPLACE_EXISTING` 选项，移动操作将成功。\n* 如果目标目录不存在，则移动操作将成功。\n\
  * 如果目标路径是一个非空目录，则抛出 `DirectoryNotEmptyException`。\n\n以下代码演示了 `Files.move()` 方法的使用：\n\
  \n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
  import java.nio.file.Paths;\nimport java.nio.file.StandardCopyOption;\n\npublic\
  \ class MoveDemo {\n    public static void main(String[] args) {\n        Path source\
  \ = Paths.get(\"D:/Demos/abc.txt\");\n        Path destination = Paths.get(\"F:/Moved/abc.txt\"\
  );\n        try {\n            Files.move(source, destination, StandardCopyOption.REPLACE_EXISTING);\n\
  \            System.out.println(\"File moved\");\n        } catch (IOException e)\
  \ {\n            System.out.println(\"Move Failed: \"+e.getMessage());\n       \
  \     e.printStackTrace();\n        }\n    }\n}\n```\n\n### 9.9.2.7 删除文件或目录\n\n\
  要删除文件、目录或链接，请使用 `delete(Path)` 方法。删除非空目录会失败，且如果删除失败将抛出异常。以下代码演示了 `delete` 方法的使用：\n\
  \n```java\nimport java.nio.file.DirectoryNotEmptyException;\nimport java.nio.file.Files;\n\
  import java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  \npublic class DeleteDemo {\n    public static void main(String[] args) {\n    \
  \    try {\n            Path p1 = Paths.get(\"F:/Moved/abc.txt\");\n           \
  \ Files.delete(p1);\n        } catch (NoSuchFileException ex) {\n            System.out.println(\"\
  No such file or directory: \" + ex.getMessage());\n        } catch (DirectoryNotEmptyException\
  \ e) {\n            System.out.println(\"Directory not empty: \" + e.getMessage());\n\
  \        } catch (Exception e) {\n            System.err.println(\"Error: \" + e.getMessage());\n\
  \        }\n    }\n}\n```\n\n`deleteIfExists(Path)` 方法删除文件。此外，如果文件不存在，则不会抛出异常。这在多个线程删除文件时非常有用。\n\
  \n### 9.9.2.8 随机访问文件\n\n`SeekableByteChannel` 接口允许顺序或随机访问文件。随机访问的步骤包括：\n* 打开文件。\n\
  * 定位到特定位置。\n* 读取/写入文件。\n\n下面是该接口的重要方法：\n* `position()`：返回通道当前的位置。\n* `position(long)`：根据参数设置通道的位置。\n\
  * `read(ByteBuffer)`：从通道读取字节到缓冲区。\n* `write(ByteBuffer)`：将缓冲区字节写入通道。\n* `truncate(long)`：截断连接到的文件。也可以截断任何实体。\n\
  \n要通过 Channel I/O 读取或写入文件，使用 `Path.newByteChannel()` 方法返回 `SeekableByteChannel`\
  \ 实例。对于锁定文件区域等高级功能，请将通道转换为 `FileChannel`。\n\n| 注意：Buffer 与通道一起使用。Buffer 作为 I/O 数据传输的源或目标。\
  \ |\n\n以下代码演示了使用 `FileChannel` 进行随机访问：\n\n```java\nimport java.io.IOException;\n\
  import java.nio.ByteBuffer;\nimport java.nio.channels.FileChannel;\nimport java.nio.file.Path;\n\
  import java.nio.file.Paths;\nimport static java.nio.file.StandardOpenOption.*;\n\
  \npublic class RandomAccessDemo {\n    public static void main(String[] args) {\n\
  \        String str = \"This is random access example\\n\";\n        byte buff[]\
  \ = str.getBytes();\n        ByteBuffer bufAlloc = ByteBuffer.allocate(10);\n  \
  \      // 将字符串存入缓冲区\n        ByteBuffer bufWrap = ByteBuffer.wrap(buff);\n     \
  \   // 设置文件的读写路径\n        Path p1 = Paths.get(\"D:/Demos/Random.txt\");\n      \
  \  // 如果不存在则创建新文件\n        try (FileChannel fc = FileChannel.open(p1, CREATE, READ,\
  \ WRITE)) {\n            // 读取文件的前 10 个字节\n            int readC;\n            do\
  \ {\n                readC = fc.read(bufAlloc);\n                // 显示读取的字符数\n \
  \               System.out.println(\"Total characters read: \" + readC);\n     \
  \       } while (readC != -1 && bufAlloc.hasRemaining());\n            // 在文件开头写入\n\
  \            fc.position(0);\n            while (bufWrap.hasRemaining()) {\n   \
  \             fc.write(bufWrap);\n            }\n            bufWrap.rewind();\n\
  \            // 移动到文件末尾并\n// 拷贝前 10 个字节\n            long length = fc.size();\n\
  \            fc.position(length - 1);\n            // 翻转缓冲区\n            bufAlloc.flip();\n\
  \            while (bufAlloc.hasRemaining()) {\n                fc.write(bufAlloc);\n\
  \            }\n            while (bufWrap.hasRemaining()) {\n                fc.write(bufWrap);\n\
  \            }\n        } catch (IOException ex) {\n            System.out.println(\"\
  Error\" + ex.getMessage());\n        }\n    }\n}\n```\n\n上述代码的输出如下：\n![图 24](img/Figure_24.jpg)\n\
  \n### 9.9.3 FileSystem 类\n\n`FileSystem` 用于监控层次结构和变化。`FileSystem` 可能是只读的。\n\n下面是该类的一些方法：\n\
  * `getUserPrincipalLookupService()`：返回用于查找用户或组的 `UserPrincipalLookupService`。\n\
  * `newWatchService()`：创建监控对象的 `WatchService`。\n* `getPath()`：转换系统路径字符串并返回 `Path`。\n\
  * `getPathMatcher()`：创建执行匹配操作的 `PathMatcher`。\n* `getFileStores()`：返回底层文件系统的迭代器。\n\
  * `getRootDirectories()`：遍历根目录。\n* `close()`：关闭文件系统。访问已关闭的文件系统将抛出 `FileSystemException`。\n\
  \n### 9.9.4 Watch 服务\n\n监控服务允许监控已注册对象的事件。例如，文件管理器可以使用监控服务监控文件的创建/删除。它可以被多个消费者并发使用。\n\
  \n以下步骤说明了如何将对象注册到监控服务：\n* 调用 `register()` 方法将 `Watchable` 对象注册到监控服务。\n* `register()`\
  \ 方法返回一个 `WatchKey` 来表示注册。\n* 当对象发生变化或事件时，将键发送或排入监控服务。\n* 每当调用 `poll()` 或 `take()`\
  \ 方法时，消费者可以获取键并处理事件。\n* 处理事件后，由消费者调用键的 `reset()` 方法来重置键。\n* 接下来，键被发送与其他事件一起重新排入队列。\n\
  \n| 注意：为了确保一次只有一个消费者处理事件，请仅在处理事件后调用键的 `reset()` 方法。调用 `close()` 方法关闭服务。当任何线程等待获取键时，将抛出\
  \ `ClosedWatchServiceException` 且服务关闭。 |\n\n以下步骤说明了如何取消对监控服务的注册：\n* 调用键的 `cancel()`\
  \ 方法取消对监控服务的注册。\n* 它将保留在队列中，直到被获取。\n\n监控目录中被修改的文件事件指示并不能保证修改该文件的程序已完成。文件可能会被其他程序更新。因此，必须协调多个程序对文件的访问，并在一个程序访问文件时锁定它。可以通过使用\
  \ `FileChannel` 类的方法来实现。协调多个程序对文件的访问，并在一个程序访问文件时锁定它。可以通过使用 `FileChannel` 类的方法来实现。\n\
  \n下面是 `WatchService` 接口的方法：\n* `poll(long timeout, TimeUnit unit)`：获取并移除下一个监控键。这可以等待到指定的等待时间。\n\
  * `take()`：获取并移除下一个 `WatchKey`。在无键存在时，它会等待。\n* `close()`：关闭监控服务。\n\n\n\n\n\n## 9.9.5\
  \ PathMatcher 接口\n\n为了在文件系统中搜索文件，可以使用 `PathMatcher` 接口。它提供了 `match` 方法来检查 `Path`\
  \ 对象是否匹配指定的字符串。\n\n### 语法\n\n`syntax: pattern`\n\n在这里，`syntax` 可以是 glob 或正则（regex）。\n\
  \n| 术语 `glob` 用于根据 Unix shell 规则查找匹配指定模式的路径名。 |\n\n以下列出了一些常用模式：\n\n* `.*.{java,class}`：识别具有扩展名的文件，扩展名为\
  \ `.java` 或 `.class`。\n* `Client.?`：识别以 `Client` 开头且带有单个字符扩展名的文件名。\n* `C:\\*`：识别以\
  \ `c:\\` 开头的路径，后跟跟任意数量的字符。例如 Windows 平台上的 `c:\\test` 或 `c:\\Java`。\n* `*.java`：识别具有\
  \ `.java` 扩展的文件名。\n* `*.*`：识别包含点的文件。\n\n以下列出了解释 glob 模式的一些规则：\n\n* `*`：表示单个或零个字符。\n\
  * `**`：表示零个或多个字符。\n* `?`：表示恰好一个字符。\n* `\\`：表示转义字符，可以作为特殊字符使用。\n* `[]`：表示方括号名称内的单个字符。例如，`[abc]`\
  \ 匹配 `a`、`b` 或 `c`。\n* `-`：连字符表示范围。例如：`[a-g]`\n* 括号内的 `*`、`?` 和 `\\` 字符匹配自身。\n \
  \   | 注意：在执行匹配操作时，文件名开头的点被视为普通字符。 |\n* `{}`：字符表示一个子模式组，如果组中的任何子模式匹配，则该组匹配。\n\n逗号用于分隔子模式，且组不能嵌套。\n\
  \n要通过递归遍历目录来搜索文件，请使用 `match` 方法检查 `Path` 是否匹配指定的字符串。要获取 `PathMatcher` 实例，请使用 `FileSystems`\
  \ 类的工厂方法。要遍历文件树，请实现 `FileVisitor` 接口，该接口提供了表示遍历过程中各种情况的方法，如下：\n\n* `preVisitDirectory()`：在访问目录之前调用\n\
  * `postVisitDirectory()`：在目录中的所有条目都被访问之后调用\n* `visitFile()`：在访问文件时调用\n* `visitFileFailed()`：当无法访问文件时调用\n\
  \n`SimpleFileVisitor` 类是 `FileVisitor` 接口的实现。它可以被进一步扩展，并且可以重写需要的方法。以下代码演示了 `PathMatcher`\
  \ 和 `SimpleFileVisitor` 类的用法：\n\n```java\nimport java.io.IOException;\nimport java.nio.file.FileSystems;\n\
  import java.nio.file.FileVisitResult;\nimport static java.nio.file.FileVisitResult.CONTINUE;\n\
  import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.PathMatcher;\n\
  import java.nio.file.Paths;\nimport java.nio.file.SimpleFileVisitor;\nimport java.nio.file.attribute.BasicFileAttributes;\n\
  \npublic class SearchFile {\n\n    public static void main(String[] args) throws\
  \ IOException {\n        Path p1;\n        p1 = Paths.get(\"D:/Test\");\n      \
  \  PathMatcher pm1 = FileSystems.getDefault().getPathMatcher(\"glob:\" + \"*.txt\"\
  );\n        FindFile f1 = new FindFile(p1, pm1);\n        try {\n            Files.walkFileTree(p1,\
  \ f1);\n            f1.finished();\n        } catch (IOException ex) {\n       \
  \     System.out.println(ex);\n        }\n    }\n}\n\nclass FindFile extends SimpleFileVisitor<Path>\
  \ {\n    private final PathMatcher matcher;\n    private int count;\n\n    public\
  \ FindFile(Path path, PathMatcher matcher) {\n        this.matcher = matcher;\n\
  \    }\n\n    private void find(Path file) {\n        Path pName = file.getFileName();\n\
  \        // 检查匹配路径\n        if (pName != null && matcher.matches(pName)) {\n   \
  \         count++;\n            System.out.println(file);\n        }\n    }\n\n\
  \    void finished() {\n        System.out.println(\"Matched: \" + count);\n   \
  \ }\n\n    @Override\n    public FileVisitResult visitFile(Path file, BasicFileAttributes\
  \ attr) {\n        find(file);\n        return CONTINUE;\n    }\n\n    // 在每个目录进行模式匹配\n\
  \    @Override\n    public FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes\
  \ attrs) {\n        find(dir);\n        return CONTINUE;\n    }\n\n    @Override\n\
  \    public FileVisitResult visitFileFailed(Path file, IOException exc) {\n    \
  \    System.err.println(exc);\n        return CONTINUE;\n    }\n}\n```\n\n以下将是输出：\n\
  \n![](img/Figure_9.25.jpg)\n\n图 9.25: PathMatcher 输出\n\n## 结论\n\n在本章中，你学习了当在访问目录和文件时，操作系统会维护文件描述符。`DataInput`\
  \ 和 `DataOutput` 接口分别提供了将二进制数据转换为 Java 原始类型以及将 UTF-8 转换为字符串（反之亦然）的方法。`FileInputStream`\
  \ 类允许从文件中读取字节。`ByteArrayInputStream` 使用缓冲区存储从流中读取的字节。`FilterInputStream` 类在数据传输过程中转换数据或通过使用输入流提供额外功能。\n\
  \n\n\n\n\n* 如果用户选择“列出文件（List files）”，程序应询问需要列出文件的目录完整路径。接下来，它将询问文件扩展名。例如 `txt`、`java`\
  \ 等。\n* 根据输入的值，应列出该类型的文件。\n* 如果用户选择“退出”（Exit），程序将终止。程序将递归地显示菜单，直到用户选择“退出”为止。\n\n\
