  \n`https://discord.bpbonline.com`\n\n![](img/fm1.png)\n\n# 第 4 章：Java 参考类型\n\n##\
  \ 引言\n\n本章解释了不同类型的数组和 `String` 类。你将学习如何使用 `StringBuilder` 和 `StringTokenizer` 类、命令行参数以及包装类。你还将理解自动装箱（autoboxing）和拆箱（unboxing）的概念。\n\
  \n## 结构\n\n在本章中，我们将学习以下主题：\n\n* Java 数组\n* Java 中的 String 类\n* 字符串数组\n* Java 中的\
  \ StringBuilder 类\n* Java 中的 StringTokenizer 类\n* 向 `main()` 方法传递参数\n* Java 包装类\n\
  \n## 目标\n\n在本章中，你将学习创建不同类型的数组并处理 `String` 类。你还将学习使用 `StringBuilder` 和 `StringTokenizer`\
  \ 来操作字符串。此外，你将学习处理包装类并理解自动装箱和拆箱。\n\n## 4.1 Java 数组\n\nJava 数组用于在同一个变量中存储多个相同类型的值。数组中的值数量是固定的，并且存储在连续内存位置的单一类型。它可以存储的值的数量在数组创建时指定，之后在代码中无法修改。\n\
  \nJava 中的数组有以下两种类型：\n\n* 一维数组\n* 多维数组\n\n下图显示了数字数组的结构：\n\n![](img/Figure_4.1.jpg)\n\
  \n图 4.1: 数组元素组织\n\n如图所示，数组元素排列在连续的内存位置中。数组的每个元素都通过其索引访问。数组索引从 0 开始，最后一个索引是 `array\
  \ size-1`。在这里，数组的大小为 5，即它最多可以存储 5 个元素。因此，第一个元素位于索引 0，最后一个元素位于索引 `size-1 = 5-1 =\
  \ 4`。根据图片，索引 4 处值为 88，它是数组的最后一个或第 5 个值。\n\n数组是存储相同类型多个元素的优化方式，因为只有在数组使用时才会为数组分配内存。\n\
  \n### 4.1.1 一维数组\n\n一维数组在垂直表示时，具有单列多行数据。每个元素都通过数组的名称和其索引来访问。例如，考虑下面所示的学生数组：\n\n\
  ![](img/Figure_4.2.png)\n\n图 4.2: 一维数组\n\n数组 `score` 在方括号 `[]` 中声明声明大小为 5。因此，它最多可以容纳\
  \ 5 个值。使用数组名称和相应的索引来访问任何值。例如，要访问值 85，语法是 `score[4]`。注意，最后一个索引是 4，即 `size-1`。因此，尝试访问\
  \ `score[5]` 将引发错误/异常。\n\n在 Java 中创建一维数组必须经过声明、实例化和初始化。\n\n**声明语法：**\n\n```\ndatatype[]\
  \ <array-name>;\n```\n\n**实例化语法：**\n```\ndatatype[] <array-name> = new datatype[size];\n\
  ```\n\n**初始化**\n\n数组可以以两种方式初始化：\n\n**在声明期间：**\n```java\nint[] score = {40, 56, 76,\
  \ 60, 85};\n```\n注意，在创建时初始化数组时没有指定大小，也没有使用 `new` 运算符。\n\n**在声明和实例化之后：**\n```java\n\
  int[] score = new int[5];\nscore[0] = 40;\nscore[1] = 56;\nscore[2] = 76;\nscore[3]\
  \ = 60;\nscore[4] = 85;\n```\n\n下面的示例展示了一维数组的使用：\n\n```java\npublic class OneDimenArray\
  \ {\n    int[] score[];\n\n    public OneDimenArray() {\n        score = new int[5];\n\
  \        score[0] = 40;\n        score[1] = 56;\n        score[2] = 76;\n      \
  \  score[3] = 60;\n        score[4] = 85;\n    }\n\n    public void viewScores()\
  \ {\n        System.out.println(\"The scores are listed below:\");\n        System.out.println(score[0]\
  \ + \"\\n\" + score[1] + \"\\n\" + score[2] + \"\\n\" + score[3] + \"\\n\" + score[4]);\n\
  \    }\n\n    public static void main(String[] args) {\n        OneDimenArray obj1\
  \ = new OneDimenArray();\n        obj1.viewScores();\n    }\n}\n```\n在这里，一维数组在 `main()`\
  \ 方法中被声明、实例化并初始化。代码的输出所示：\n\n![](img/Figure_4.3.png)\n\n图 4.3: 一维数组\n\n### 4.1.2\
  \ 多维数组\n\n多维数组是数组的数组。下面的图显示了一个多维数组：\n\n![](img/Figure_4.4.jpg)\n\n图 4.4: 多维数组\n\n\
  数组 `score` 在方括号 `[][]` 中声明大小为 5x2。因此，它可以最多容纳 5 行 2 列。使用数组名称和相应的索引来访问任何值。例如，要访问值\
  \ 85，语法是 `score[4][0]`。\n\n在 Java 中创建多维数组必须经过声明、实例化和初始化。\n\n**声明语法：**\n```\ndatatype[][]\
  \ <array-name>;\n```\n\n**实例化语法：**\n```\ndatatype[][] <array-name> = new datatype[rows][columns];\n\
  ```\n\n**初始化**\n\n多维数组可以以两种方式初始化：\n\n**在声明期间：**\n```java\nint[][] score = {{40,60},\
  \ {56,45}, {76,65}, {60,74}, {85,90}};\n```\n注意，在创建时初始化数组时没有指定大小。此外，行之间用逗号分隔。\n\n\
  **在声明和实例化之后：**\n多维数组可以通过访问每个元素在创建和实例化后初始化。\n\n```java\nint[][] score = new int[5][2];\n\
  score[0][0] = 40; score[0][1] = 60;\nscore[1][0] = 56; score[1][1] = 45;\nscore[2][0]\
  \ = 76; score[2][1] = 65;\nscore[3][0] = 60; score[3][1] = 74;\nscore[4][0] = 85;\
  \ score[4][1] = 90;\n```\n\n下面的示例展示了多维数组的使用：\n\n```java\npublic class MultiDimenArray\
  \ {\n    int score[][];\n\n    public MultiDimenArray() {\n        score = new int[5][2];\n\
  \        score[0][0] = 40; score[0][1] = 60;\n        score[1][0] = 56; score[1][1]\
