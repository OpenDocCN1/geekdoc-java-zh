  \n图 12.21：帮助命令\n\n要退出 `JShell`，可以使用 `/exit` 命令或 `Ctrl + D`：\n\n![](img/Figure_12.22.jpg)\n\
  \n图 12.22：退出命令\n\n## 用于链接的 JLink 工具\n\n引入 `JLink` 命令行工具是为了创建自定义的 JRE。通常情况下，执行 Java\
  \ 程序时，你会使用默认的 JRE，它包含了无数个预定义的 Java `.class` 文件。\n\n例如，考虑以下简单程序：\n\n```java\nclass\
  \ Hello{\npublic static void main(String[]args) {\nSystem.out.prinltn(\"Hello World\"\
  );\n}\n}\n```\n\n现在，为了运行这个小型程序，你需要安装包含大量 `.class` 文件的默认 JRE。然而，运行这个小型程序时，需要的 `.class`\
  \ 文件只有 `Hello.class`、`String.class`、`System.class` 和 `Object.class`。\n\n如果使用默认 JRE\
  \ 执行这个简单的 Hello world 程序，将加载 4300 多个预定义的 Java `.class` 文件，这在当前情况下是不需要的。此外，对于一个简单的\
  \ 1 KB 代码，JRE 的大小将达到 203 MB。这是对内存的不必要浪费并会影响性能。而且，它不适用于内存极小的微服务开发，对 IoT 设备也没有用。\n\
  \n然而，从 Java 9 开始，引入了 `jlink` 工具来创建一个仅包含执行应用程序所需的类类的微型自定义 JRE。这有助于节省内存并提高性能。通过 Jlink，你可以只链接所需的模块并创建你自己的\
  \ JRE。\n\n例如，假设 `Hello.java` 文件位于名为 `Module1` 的模块中的 `pkg` 文件夹中。现在，我们只需要 `String.class`、`System.class`\
  \ 和 `Object.class` 文件。这些 `.class` 文件是 `java.lang` 包的一部分，该包存在于 `java.base` 模块中。因此，执行你的程序只需要两个模块：`Module1`\
  \ 和 `java.base`，你可以创建自己的最小 JRE 来运行程序。`java.base` 模块存在于 `java\\jdk-9\\jmods` 路径。\n\
  \n因此，为了创建一个最小 JRE，你需要将 `java.base` 模块拷贝到包含 `Hello.class` 文件的文件夹中。现在使用以下命令创建自己的 JRE：\n\
  \n```bash\njlink –module-path out –add-modules module1,java.base –output myjre\n\
  ```\n\n该命令创建了 `myjre` 文件夹，它是最小的自定义 JRE，可以使用 `java` 命令执行该程序：\n\n```bash\ncd myjre\n\
  cd bin\njava -m module1/pkg.Test\n```\n\n## 12.3 Java 10 特性\n\nJava 10 在范围、影响和未来性变化方面是发布最快的。下面列出了\
  \ Java 10 的一些重要新特性。\n\n### 局部变量类型推断\n\nJava 10 增加了局部变量类型推断功能，以支持对带有初始化器的局部变量进行类型推断。局部类型推断的使用限于以下场景：\n\
  \n*   带有初始化器的局部变量\n*   增强型 for 循环的索引\n*   在 for 循环中声明的局部变量\n\n以下示例解释了局部类型推断的使用：\n\
  \n```java\nvar digits = List.of(4, 3, 5, 2, 6); // 推断出的值\n\n// 增强 for 循环的索引\nfor\
  \ (var num : digits) {\n    System.out.println(num);\n}\n\n// 在循环中声明的局部变量\nfor (var\
  \ i = 0; i < digits.size(); i++) {\n    System.out.println(numbers.get(i));\n}\n\
  ```\n\n在这里，变量 `var` 的类型是根据赋值给它的数据类型推断出来的。因此，类型推断是指编译器通过查看方法调用和声明来确定类型参数的能力。保留类型名\
  \ `var` 用于带有初始化器的局部变量声明。\n\n对于带有初始化器的局部变量声明，我们现在可以使用保留的类型名 `var`。\n\n例如：\n\n```java\n\
  var lst = new ArrayList<String>(); // 推断为 ArrayList<String>\nvar str = list.stream();\
  \ // 推断为 Stream<String>\n```\n\n显式类型（Manifest typing）是对声明的变量类型进行显式标识。这在 Java 10\
  \ 之前的版本中就已经规定了。例如：\n\n```java\nList<Fruits> fruit = List.of(new Fruit());\n```\n\
  \n在这里，`List<Fruit>` 是显式类型，必须声明以识别变量的类型。\n\n**显式类型**：对每个声明的变量进行显式的类型识别称为显式类型划分。例如，如果变量\
  \ `actors` 将存储 `Actors` 的 `List`，那么它的类型 `List<Actor>` 就是显式类型，并且必须在 Java 10 之前（如文文所述）进行声明：\n\
  \n然而，在 Java 10 中，可以如下所示使用保留的类型名 `var` 来完成：\n\n```java\nvar fruit = List.of(new Fruit());\n\
  ```\n\n### 了解局部变量类型推断的工作原理\n\n当编译器解析 `var` 语句时，它会查看声明的右侧，称为初始化器。根据这个右侧（RHS）表达式，它推断出类型。然而，这并不意味着\
  \ Java 现在是动态类型语言。它仍然是一门静态类型语言。\n\n例如，考虑以下代码：\n\n```java\nprivate static void read()\
  \ throws IOException {\n    var fname = \"Test.txt\";\n    var line = \"\";\n  \
  \  var fread = new FileReader(fname);\n    var bread = new BufferedReader(fread);\n\
  \    …\n}\n```\n\n现在，当发生类型推断时，反编译后的代码如下：\n\n```java\nprivate static void read()\
  \ throws IOException {\n    String fname = \"Test.txt\";\n    String line = \"\"\
  ;\n    FileReader fread = new FileReader(fname);\n    BufferedReader bread = new\
  \ BufferedReader(fread);\n    …\n}\n```\n\n在这里，`var` 的类型是根据赋值给它的数据类型推断出来的。因此，类型推断是指编译器通过查看方法调用和声明来确定类型参数的能力。保留类型名\
  \ `var` 用于带有初始化器的局部变量声明。\n\n对于带有初始化器的局部变量声明，我们现在可以使用保留的类型名 `var`。\n\n例如：\n\n```java\n\
  var lst = new ArrayList<String>(); // 推断为 ArrayList<String>\nvar str = list.stream();\
  \ // 推断为 Stream<String>\n```\n\n显式类型是对声明的变量类型进行显式标识。这在 Java 10 之前的版本中就已经规定了。例如：\n\
  \n```java\nList<Fruits> fruit = List.of(new Fruit());\n```\n\n在这里，`List<Fruit>`\
  \ 是显式类型，必须声明以识别变量的类型。\n\n**显式类型**：对每个声明的变量进行显式的类型识别称为显式类型划分。例如，如果变量 `actors` 将存储\
  \ `Actors` 的 `List`，那么它的类型 `List<Actor>` 就是显式类型，并且必须在 Java 10 之前（如下文所述）进行声明：\n\n\
  然而，在 Java 10 中，可以如下所示使用保留的类型名 `var` 来完成：\n\n```java\nvar fruit = List.of(new Fruit());\n\
  ```\n\n### 理解局部变量类型推断的工作原理\n\n当编译器解析 `var` 语句时，它会查看声明的右侧，称为初始化器。根据这个右侧（RHS）表达式，它推断出类型。然而，这并不意味着\
  \ Java 现在是动态类型语言。它仍然是一门静态类型语言。\n\n例如，考虑以下代码：\n\n```java\nprivate static void read()\
  \ throws IOException {\n    var fname = \"Test.txt\";\n    var line = \"\";\n  \
  \  var fread = new FileReader(fname);\n    var bread = new BufferedReader(fread);\n\
  \    …\n}\n```\n\n现在，当发生类型推断时，反编译后的代码如下：\n\n```java\nprivate static void read()\
  \ throws IOException {\n    String fname = \"Test.txt\";\n    String line = \"\"\
  ;\n    FileReader fread = new FileReader(fname);\n    BufferedReader bread = new\
  \ BufferedReader(fread);\n    …\n}\n```\n\n在这里，`var` 的类型是根据赋值给它的数据类型推断出来的。因此，类型推断是指编译器通过查看方法调用和声明来确定类型参数的能力。保留类型名\
  \ `var` 用于带有初始化器的局部变量声明。\n\n对于带有初始化器的局部变量声明，我们现在可以使用保留的类型名 `var`。\n\n例如：\n\n```java\n\
  var lst = new ArrayList<String>(); // 推断为 ArrayList<String>\nvar str = list.stream();\
  \ // 推断为 Stream<String>\n```\n\n显式类型是对声明的变量类型进行显式标识。这在 Java 10 之前的版本中就已经规定了。例如：\n\
  \n```java\nList<Fruits> fruit = List.of(new Fruit());\n```\n\n在这里，`List<Fruit>`\
  \ 是显式类型，必须声明以识别变量的类型。\n\n**显式类型**：对每个声明的变量进行显式的类型识别称为显式类型划分。例如，如果变量 `actors` 将存储\
  \ `Actors` 的 `List`，那么它的类型 `List<Actor>` 就是显式类型，并且必须在 Java 10 之前（如下文所述）进行声明：\n\n\
  然而，在 Java 10 中，可以如下所示使用保留的类型名 `var` 来完成：\n\n```java\nvar fruit = List.of(new Fruit());\n\
  ```\n\n\n\n\n\n(变量初始化为 'null')\n\n1 个错误\n\n*   `var` 无法用于数组。\n\n```java\nvar fruitArr[]\
  \ = new Fruit[10];\n```\n\n上述语句将产生如下所示的错误：\n\n```\nLocalTypeInference.java:52: error:\
  \ 'var' is not allowed as an element type of an array\nvar fruitArr[] = new Fruit[10];\n\
  ^\n```\n1 个错误\n\n*   `var` 不由方法引用、数组初始化器和 Lambda 表达式组成的复合表达式（poly expressions）。这些也会触发错误。这是因为在解析\
  \ Lambda 表达式、数组初始化器和方法引用的类型时，编译器会引用表达式所在方法的左侧（LHS）表达式或该方法的参数定义。但 `var` 使用的是右侧（RHS）表达式。这会导致循环引用并生成编译时错误。\n\
  \n### Lambda 表达式\n```java\nvar min = (a, b) -> a < b ? a : b;\n```\n错误：\n```\nLocalTypeInference.java:59:\
  \ error: cannot infer type for local variable min\nvar min = (a, b) -> a < b ? a\
  \ : b;\n^\n```\n（lambda 表达式需要显式的目标类型）\n1 个错误\n\n### 方法引用\n```java\nvar minimum =\
  \ Math::min;\n```\n错误：\n```\nLocalTypeInference.java:65: error: cannot infer type\
  \ for local variable minimum\nvar minimum = Math::min;\n^\n```\n（方法引用需要显式的目标类型）\n\
  1 个错误\n\n### 数组初始化器\n```java\nvar numbers = {4,5,2,6,3};\n```\n错误：\n```\nLocalTypeInference.java:71:\
  \ error: cannot infer type for local variable numbers\nvar nums = {4,5,2,6,3};\n\
  ^\n```\n（数组初始化器需要显式的目标类型）\n1 个错误\n\n*   `var` 可以用于匿名类类型。匿名类类型不能有名称，使用变量用于匿名类类型允许为声明局部类的单例实例提供简写。下面的示例展示了变量\
  \ `runThread` 用于实现 `Runnable` 的匿名类：\n\n```java\nvar t1 = new Runnable() {\n    @Override\n\
  \    public void run() {\n        var digits = List.of(4, 3, 5, 2, 6);\n       \
  \ for (var num : digits) {\n            System.out.println(num);\n        }\n  \
  \  }\n};\n\nrunThread(t1);\n```\n\n因此，引入 `var` 有助于减少代码、提高代码清晰度并提升开发者体验。\n\n### API\
  \ 变更\n\nJava 10 添加和删除了几个 API。在 Java 9 中，引入了增强型弃用机制（enhance deprecation），其中某些 API\
  \ 被标记在未来的发布版本中移除。下面列是 Java 10 中移除的一些 API。\n\n#### 字段\n`java.lang.SecurityManager.inCheck`\n\
  \n#### 方法\n* `java.lang.Runtime.getLocalizedInputStream(java.io.InputStream)`\n\
  * `java.lang.Runtime.getLocalizedOutputStream(java.io.OutputStream)`\n* `java.lang.SecurityManager.inClass(java.lang.String)`\n\
  * `java.lang.SecurityManager.classDepth(java.lang.String)`\n* `java.lang.SecurityManager.getInCheck()`\n\
  * `java.lang.SecurityManager.inClassLoader()`\n* `java.lang.SecurityManager.classLoaderDepth()`\n\
  * `java.lang.SecurityManager.currentClassLoader()`\n* `java.lang.SecurityManager.currentLoadedClass()`\n\
  \nJava 10 总共添加了 73 个新 API。下面解释了一些显著的内容。`copyOf(Collection)` 方法被添加到 `List`、`Map`\
  \ 和 `Set` 接口中，返回一个包含给定条目的不可变 `List`、`Map` 和 `Set`。这意味着，如果之后修改了 `List`，更改将不会反映。\n\
  \n`Collectors` 类引入了方法用于收集不可修改的集合，如 `Set`、`List` 和 `Map`。下面的示例展示了 `copyOf()` 方法的使用：\n\
  \n```java\nList<String> seasons = new ArrayList<>();\nseasons.add(\"Winter\");\n\
  seasons.add(\"Summer\");\nSystem.out.println(seasons); // 输出 [Winter, Summer]\n\n\
  // 新 API - 从 List 创建一个不可修改的 List\nList<String> copySeasons = List.copyOf(seasons);\n\
  System.out.println(copySeasons); // 输出 [Winter, Summer]\n\n// copySeasons.add(\"\
  Spring\"); // 生成 UnsupportedOperationException\nseasons.add(\"Spring\");\nSystem.out.println(seasons);//\
  \ 输出 [Winter, Summer, Spring]\nSystem.out.println(copySeasons); // 输出 [Winter, Summer]\n\
  ```\n\n下面的示例展示了 `toUnmodifiableList()` 的使用：\n\n```java\n// 新 API - Collectors.toUnmodifiableList\n\
  List<String> lstCollect = seasons.stream().collect(Collectors.toUnmodifiableList());\n\
  // lstCollect.add(\"Autumn\"); // 生成 UnsupportedOperationException\n```\n\n还引入了其他新特性，例如基于时间的版本控制、`Optional`\
  \ API 的 `orElseThrow()` 方法、替代内存设备上的堆分配等，这些超出了本书的范围。\n\n## 结论\n在本章中，你学习了 Java 8 中引入了新的\
  \ `forEach()` 方法来遍历元素。它定义在 `Stream` 和 `Iterable` 接口中。`StringJoiner` 类被添加到 `java.util`\
  \ 包中，用于构建由分隔符分隔的字符序列。\n\n## 结论\n在本章中，你学习了 Java 8 中引入了新的 `forEach()` 方法来遍历元素。它定义在\
