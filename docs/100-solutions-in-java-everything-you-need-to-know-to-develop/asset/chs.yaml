  \n![](img/fm1.png)\n\n# 第 10 章：线程与 JDBC\n\n## 引言\n\n本章引入了线程以及用于创建和管理线程的 `Thread`\
  \ 类。它还解释了线程状态、多线程、并发和死锁。Java 提供了 Java 数据库连接 (JDBC) API 来将 Java 应用程序连接到数据库。你将学习如何使用\
  \ JDBC 接口来查询数据库并执行事务。\n\n## 结构\n\n在本章中，我们将学习以下主题：\n\n* 线程 (Threads)\n* `Thread`\
  \ 类\n* `Runnable` 接口\n* 守护线程 (Daemon threads)\n* 多线程\n* 线程同步\n* 并发集合 API\n* 原子变量\n\
  * `java.util.concurrent.locks` 包\n* 线程执行器与线程池\n* Java 数据库连接 (JDBC)\n* `DatabaseMetaData`\n\
  * `ResultSetMetaData`\n* 使用 `CallableStatement` 对象执行存储过程\n* 可滚动的 `ResultSet`\n*\
  \ 批量更新\n* 事务\n* `RowSet` 接口\n\n## 目标\n\n在本章中，你将学习创建和管理线程，理解线程状态，并通过多线程与多个线程协同工作。你还将理解并发和死锁的概念。此外，你将学习\
  \ Java 数据库连接 (JDBC) API，并使用 JDBC 接口查询数据库。\n\n## 10.1 线程\n\n在 Java 编程语境中，线程是程序执行的路径。对于每个程序，至少存在一个由\
  \ `JVM` 创建的线程，称为 `Main` 线程。它在程序启动时调用 `main()` 方法。线程带有其自身的运行时资源独立运行。它是应用程序执行特定任务的最小执行单元。可以同时执行多个线程，以便在应用程序中并发管理多个任务。\n\
  \n线程共享 CPU 时间并在进程内顺序执行。在单线程应用程序中，一次只有一个线程处于激活状态。然而，一个多线程应用程序可以在一个应用程序内同时执行多个任务的任务。线程可以创建子线程或子线程，如果一个线程被阻塞，另一个线程可以开始执行。与进程不同，线程之间相互依赖，并协助其他线程完成任务。\n\
  \n线程允许应用程序中的多个任务进行并行处理，例如滚动多张图片、模式、带图像音频等。Java 允许通过扩展 `Thread` 类或实现 `Runnable` 接口来创建线程。\n\
  \n### 10.1.1 Java 线程状态和生命周期\n\n线程在其生命周期内经历不同的阶段，如图 10.1 所示：\n\n![](img/Figure_10.1.jpg)\n\
  \n图 10.1：线程生命周期的阶段\n\n同一时刻，线程只能处于一种状态。\n\n| 注意：这些状态是虚拟机状态，与任何操作系统的线程状态无关。 |\n\n\
  * **New (新建)**：一个新创建但尚未启动的线程，即尚未存活。在启动线程之前尝试调用任何方法都将抛出 `IllegalThreadStateException`\
  \ 异常：\n\n```\nThread t = new Thread();\n```\n\n* **Runnable (可运行)**：当对该线程调用 `start()`\
  \ 方法时，线程进入可运行状态。在此状态下，该线程被认为在 `JVM` 中执行。在这里，线程被分配了运行的所有资源，因为它具备运行条件，但可能根据调度程序分配的优先级尚未开始运行。当它正在运行时，它会执行\
  \ `run()` 方法的指令：\n\n```\nThreadClass t = new ThreadClass();\nt.start();\n```\n\n\
  * **Blocked (阻塞)**：处于阻塞状态的线程是存活的，但由于正在等待某些资源的监视器锁（monitor lock），无法运行。调用 `sleep()`、`wait()`\
  \ 或 `suspend()` 方法会将线程于阻塞状态。\n\n| 注意：监视器是一个想象的盒子，只有通过获取共享资源的锁，一次才能由单个线程访问它。 |\n\n\
  * **Waiting (等待)**：在此状态下，线程无限地等待另一个线程执行特定操作。要将线程放入等待状态，需要调用 `wait()` 方法；要将其带回可运行状态，需要调用\
  \ `notify()` 或 `notifyAll()` 方法。\n\n* **Timed_Waiting (超时等待)**：在此状态下，线程等待另一个线程执行操作的时间为特定的等待时间。\n\
  \n* **Terminated (已终止)**：已完成 `run()` 方法执行并退出的线程处于此状态。已终止的线程无法回到可运行状态。对已终止的线程尝试 `start()`\
  \ 方法将抛出异常。\n\n## 10.2 Thread 类\n\n`Thread` 类属于 `java.lang` 包，用于创建和控制线程。要创建一组线程，通过将\
  \ `ThreadGroup` 作为参数传递给构造函数来实现。创建线程的另一种方法是实现 `Runnable` 接口。每个线程都有优先级，优先级高的线程先于优先级低的线程执行。\n\
  \n`JVM` 在调用 `exit()` 方法或所有守护线程死亡时停止线程执行。以下是 `Thread` 类的构造函数：\n\n* `Thread()`：无参数构造函数。\n\
  * `Thread(Runnable r)`：创建一个其 `run()` 方法被调用的线程。\n* `Thread(String name)`：创建一个具有指定名称的线程。\n\
  * `Thread(Runnable r, String name)`：创建一个具有指定名称且其 `run()` 方法被调用的线程。\n* `Thread(ThreadGroup\
  \ group, String threadName)`：在指定的 `group` 中创建一个具有指定名称的线程。\n* `Thread(ThreadGroup\
  \ group, Runnable r)`：在指定的 `group` 中创建一个其 `run()` 方法被调用的线程。\n* `Thread(ThreadGroup\
  \ group, Runnable r, String name)`：在指定的 `group` 中创建一个具有指定名称且其 `run()` 方法被调用的线程。\n\
  \n以下是 `Thread` 类的一些方法：\n\n* `static Thread currentThread()`：返回当前线程对象的引用。\n* `static\
  \ int activeCount()`：返回程序中活动线程的数量。\n* `static boolean interrupted()`：检查当前线程是否被中断。\n\
  * `boolean isAlive()`：检查此线程是否存活。\n* `boolean isInterrupted()`：检查此线程是否被中断。\n* `void\
  \ join()`：等待此线程死亡。\n* `void setName(String name)`：将此线程的名称更改为指定的名称。\n* `ThreadGroup\
  \ getThreadGroup()`：返回此线程所属的线程组。\n\n以下代码演示了通过扩展 `Thread` 类创建新线程：\n\n```java\npublic\
  \ class ThreadClassDemo extends Thread {\n    String threadName;\n\n    public void\
  \ run() {\n        int num = 0;\n        while (num <= 3) {\n            //显示活动线程数\n\
  \            System.out.println(\"Active thread count:\"+Thread.activeCount());\n\
  \            //显示当前运行的线程\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nthreadName\
  \ = Thread.currentThread().getName();\n\nnum++;\n\nSystem.out.println(\"Current\
  \ thread is \"+threadName);\n\nif (threadName.equals(\"T1\")) {\n    System.out.println(\"\
  This is Thread 1\");\n} else {\n    System.out.println(\"Unknown thread\");\n}\n\
  \n}\n\n}\n\npublic static void main(String args[]) {\n    ThreadClassDemo obj =\
  \ new ThreadClassDemo();\n    obj.setName(\"T1\");\n    //Checks if threads are\
  \ alive\n    System.out.println(\"Current thread is alive? \"+Thread.currentThread().isAlive());\n\
  \    System.out.println(\"Thread T1 is alive? \"+obj.isAlive());\n    // invokes\
  \ the start method on the thread object\n    obj.start();\n    System.out.println(\"\
  Current thread is alive? \"+Thread.currentThread().isAlive());\n    System.out.println(\"\
  Thread T1 is alive? \"+obj.isAlive());\n}\n\n}\n```\n\n代码的输出如图 10.2 所示：\n\n![](img/Figure_10.2.jpg)\n\
  \n图 10.2：使用线程类创建的线程\n\n### 10.2.1 Thread 类的方法\n\n用于操作线程及其生命周期的重要 `Thread` 类方法列举如下：\n\
  \n*   `getName()`：帮助获取当前线程的名称。\n    ```java\n    Thread t = Thread.currentThread();\n\
  \    System.out.println(\"Name = \" + t.getName());\n    ```\n*   `start()`：为新创建的线程对象分配系统资源并执行其\
  \ `run()` 方法。它能将线程变为可运行状态。\n    ```java\n    NewThread t = new NewThread():\n  \
  \  t.start();\n    ```\n*   `run()`：它执行当前线程对象的指令。`run()` 方法不接受任何参数，不返回任何值也不抛出任何异常：\n\
  \    ```java\n    class Thread1 implements Runnable {\n    // . .\n    public void\
  \ run() {\n        System.out.println(\"Executing run method.\");\n    }\n    //\
  \ . .\n    }\n    ```\n*   `sleep()`：此方法根据指定的毫秒或纳秒时间挂起当前线程的执行。这允许其他线程利用处理器时间来执行它们的任务。它会抛出\
  \ `InterruptedException`。\n    语法：\n    ```java\n    void sleep(long millis)\n \
  \   ```\n    例如：\n    ```java\n    try{\n        t1.sleep (10000);\n    } catch\
  \ (InterruptedException e)\n    {}\n    ```\n    线程已休眠 10000 毫秒。\n*   `interrupt()`：此方法在任务完成之前中断线程执行。如果线程被\
  \ `wait()`、`join()` 或 `sleep()` 方法阻塞，则会引发 `InterruptedException`。\n\n### 10.2.2\
  \ 线程优先级\n\nJava 允许设置线程的优先级，以确保程序中的多个线程可以共享资源来完成任务。线程调度器可以根据线程优先级确定线程的执行顺序。所有线程默认具有相同的优先级。当一个线程被创建时，它继承父线程的优先级。\n\
  \n可以使用 `setPriority()` 方法设置线程的优先级。优先级指定为 1 到 10 之间的整数，其中 10 最高，1 最低。默认优先级为 5。超出范围的值会抛出\
  \ `IllegalArgumentException`。`Thread` 类还提供了一些代表值 1、5 和 10 的静态常量。它们分别是 `MIN_PRIORITY`、`NORM_PRIORITY`\
  \ 和 `MAX_PRIORITY`。主线程的优先级为 5，即 `Thread.NORM_PRIORITY`。\n\n调度器借助线程优先级管理线程执行。通常情况下，优先级高的线程会先执行。\n\
  \n### 10.2.3 线程优先级的方法\n\nJava 提供了为线程分配和检索优先级的方法：\n\n*   `setPriority()`：此方法用于更改线程的优先级。新创建的线程继承父线程的优先级。`setPriority()`\
  \ 方法通过接受 1 到 10 之间的整数值来更改当前优先级。例如：\n    ```java\n    Thread t1 = new Thread(\"Worker\
  \ thread\");\n    t1.setPriority(6);\n    ```\n*   `getPriority()`：此方法用于获取任何线程的当前优先级值。它以整数值返回优先级。例如：\n\
  \    ```java\n    System.out.println(\"Thread priority is \"+t1.getpriority());\n\
  \    ```\n\n    以下代码演示了线程优先级的实现：\n    ```java\n    public class ThreadPriorityDemo\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Main thread started\");\n        One t1 = new One();\n        Two t2 = new Two();\n\
  \        Three t3 = new Three();\n        t3.setPriority(Thread.MAX_PRIORITY); //\
  \ priority = 10\n        t2.setPriority(t1.getPriority() + 1); // default priority\
  \ + 1 = 6\n        t1.setPriority(Thread.MIN_PRIORITY); // priority =l\n    }\n\
  \    ```\n\n## 10.3 Runnable 接口\n\n`Runnable` 接口是创建线程的另一种方式。实现类必须重写 `run()` 方法。通过使用\
  \ `Runnable` 接口，实现类获得了继承其他类的灵活性。\n\n使用 `Runnable` 创建新线程的步骤：\n1.  声明类并实现 `Runnable`。\n\
  2.  实现 `run()` 方法。\n3.  实例化类。\n4.  将其对象传递给 `Thread` 类构造函数。\n5.  在线程对象上调用 `start()`\
  \ 方法。\n\n以下代码演示了通过实现 Runnable 接口创建线程：\n```java\npublic class RunnableInterfaceDemo\
  \ {\n    public static void main(String[] args) {\n        // 实例化\n        Thread1\
  \ objT1 = new Thread1();\n        // 将对象传递给 Thread 类构造函数\n        Thread t = new\
  \ Thread(objT1);\n        // 调用 start 方法\n        t.start();\n    }\n}\n\n// 声明类并实现\
  \ Runnable\nclass Thread1 implements Runnable {\n    String tName; // 存储线程名称\n \
  \   // 实现 run() 方法\n    @Override\n    public void run() {\n        int tCount =\
  \ 1; // 存储线程计数\n        while (tCount < 5) {\n            tName = Thread.currentThread().getName();\n\
  \            System.out.println(\"Thread name = \"+tName);\n            tCount++;\n\
  \        }\n    }\n}\n```\n\n代码的输出如下，见图 10.3 ：\n\n![](img/Figure_10.3.jpg)\n\n图\
  \ 10.3：线程优先级\n\n## 10.4 守护线程\n\n守护线程是一种低优先级的服务提供线程，它在后台运行并为用户线程提供服务。守护线程的特点：\n\n\
  *   依赖于用户线程。\n*   当所有用户线程死亡后，JVM 会终止守护线程。\n*   为用户线程的后台支持任务提供服务。\n\n多个守护线程会在后台自动运行，例如\
  \ gc、finalizer 等。如果没有用户线程，JVM 会终止守护线程。\n\n用于守护线程的 `Thread` 类方法：\n\n\n\n\n\n*   `setDaemon(boolean\
  \ value)`: 用于将用户线程转换为守护线程（Daemon thread）。当将 `true` 的 `Boolean` 值作为参数传递给此方法时，默认的用户线程将被转换为守护线程。\n\
  *   `isDaemon()`: 用于验证当前线程是否为守护线程。如果线程是守护线程，则返回 `true`，否则返回 `false`。\n\n下面的演示展示了守护线程方法的使用：\n\
  \n```java\npublic class DaemonThreadDemo extends Thread {\n\n    public void run()\
  \ {\n        //check 守护线程的存在性\n        if (Thread.currentThread().isDaemon()) {\n\
  \            System.out.println(\"Daemon thread at work\");\n        } else {\n\
  \            System.out.println(\"User thread at work\");\n        }\n    }\n\n\
  \    public static void main(String[] args) {\n        // 创建线程对象\n        DaemonThreadDemo\
  \ t1 = new DaemonThreadDemo();\n        DaemonThreadDemo t2 = new DaemonThreadDemo();\n\
  \        DaemonThreadDemo t3 = new DaemonThreadDemo();\n        t1.setDaemon(true);//\
  \ 将 t1 设置为守护线程\n        //启动线程\n        t1.start();\n        t2.start();\n     \
  \   t3.start();\n    }\n}\n```\n\n代码的输出如图图 10.5 所示：\n\n![](img/Figure_10.5.jpg)\n\
  \n图 10.5：守护线程\n\n## 10.5 多线程\n\n程序的两个或多个部分的并发执行被称为多线程。它类似于多任务处理。它允许创建多个一个线程来并行执行多个任务，即并发地执行多个任务。\n\
  \n多线程的特点如下：\n\n*   执行和管理多个并发任务。\n*   根据优先级区分任务。\n*   允许用户在程序执行后台任务时与应用程序进行交互。\n\n\
  多线程和多任务处理存在以下区别：\n\n*   多线程允许两个或多个线程在同一个进程内同时执行。多任务允许两个进程并发执行。\n*   与多任务相比，由于线程是轻量级的且共享执行地址空间，多线程的开销更小。\n\
  *   在多任务处理中，进程需要自己的地址空间。\n*   进程之间的上下文切换比线程间的通信开销更大。\n\n以下是多线程的一些优点：\n\n*   由于减少了\
  \ CPU 空闲时间，提高了性能。\n*   任务的并行处理导致可扩展性增加。\n*   由于线程共享数据，程序的执行速度更快。\n\n可以使用 `Thread`\
  \ 类和 `Runnable` 接口来实现多线程，如下面程序所示：\n\n```java\npublic class MultithreadingDemo extends\
  \ Thread {\n\n    String name;\n\n    @Override\n    public void run() {\n     \
  \   while (true) {\n            name = Thread.currentThread().getName();\n     \
  \       System.out.println(name);\n            try {\n                Thread.sleep(500);\n\
  \            } catch (InterruptedException e) {\n                break;\n      \
  \      }\n        }\n    }\n\n    public static void main(String args[]) {\n   \
  \     MultithreadingDemo t1 = new MultithreadingDemo();\n        MultithreadingDemo\
  \ t2 = new MultithreadingDemo();\n        t1.setName(\"Thread1\");\n        t2.setName(\"\
  Thread2\");\n        t1.start();\n        t2.start();\n        System.out.println(\"\
  Total threads in execution: \" + Thread.activeCount());\n    }\n}\n```\n\n在这里，两个线程都尝试访问处理器时间，并通过\
  \ `sleep()` 方法进行管理，这允许另一个线程在之前的线程挂起运行时运行。代码将无限运行直到用户手动停止程序执行。代码的输出如图图 10.6 所示：\n\
  \n![](img/Figure_10.6.jpg)\n\n图 10.6：多线程\n\n一旦线程执行停止，就无法通过调用 `start()` 方法重启。在已运行的线程上尝试调用\
  \ `start()` 会抛出 `IllegalThreadStateException` 异常。\n\n> 注意：即使应用程序删除了对线程的所有引用，如果未能调用\
  \ `start()` 方法，该线程对象也不会被纳入垃圾回收。因此，建议在线程执行完成后将线程对象的引用设置为 `null`。\n\n### 10.5.1 isAlive()\
  \ 方法\n\n`isAlive()` 方法用于确定当前线程仍在运行。确保在主线程退出之前所有子线程已终止是非常重要的。这可以通过对线程对象调用 `isAlive()`\
  \ 方法来实现。如果 `isAlive()` 返回 `true`，则线程正在运行。返回 `false` 值表示该线程处于新状态或终止状态。\n\n下面的代码演示了\
  \ `isAlive()` 方法的使用：\n\n```java\npublic class IsAliveDemo extends Thread {\n\n \
  \   public void run() {\n        System.out.println(\"Hello\");\n        try {\n\
  \            Thread.sleep(300);\n        } catch (InterruptedException ie) {\n \
  \       }\n        System.out.println(\"World\");\n    }\n\n    public static void\
  \ main(String[] args) {\n        IsAliveDemo t1 = new IsAliveDemo();\n        IsAliveDemo\
  \ t2 = new IsAliveDemo();\n        System.out.println(\"T1 is alive? \"+t1.isAlive());\n\
  \        System.out.println(\"T2 is alive? \"+t2.isAlive());\n        t1.start();\n\
  \        t2.start();\n    }\n}\n```\n\n代码的输出如图图 10.7 所示：\n\n![](img/Figure_10.7.jpg)\n\
  \n图 10.7：使用 isAlive() 方法\n\n### 10.5.2 join() 方法\n\n`join()` 方法让当前线程等待，直到被调用的线程终止。它有两个重载版本：\n\
  \n*   `join(long millis)`：等待指定的毫秒数，直到被调用的线程终止。\n*   `join(long millis, int nanos)`：等待指定的毫秒数和纳秒数，直到被调用的线程终止。\n\
  \n下面的代码演示了 `join()` 方法的使用：\n\n```java\npublic class JoinMethodDemo extends Thread\
  \ {\n\n    public void run() {\n        System.out.println(\"Hello\");\n       \
  \ try {\n            Thread.sleep(300);\n        } catch (InterruptedException ie)\
  \ {\n        }\n        System.out.println(\"World\");\n    }\n\n    public static\
  \ void main(String[] args) {\n        JoinMethodDemo t1 = new JoinMethodDemo();\n\
  \        JoinMethodDemo t2 = new JoinMethodDemo();\n        t1.start();\n      \
  \  t2.start();\n    }\n}\n```\n\n在这里，`join()` 方法在线程 `t1` 上调用。它确保在 `t2` 开始之前 `t1`\
  \ 终止。代码的输出如图图 10.8 所示：\n\n![](img/Figure_10.8.jpg)\n\n图 10.8：join 方法\n\n## 10.6\
  \ 线程同步\n\n有时，当多个线程同时访问共享资源时，会导致竞态条件（race condition）。例如，当两个或多个线程尝试读写同一个文件时，会导致竞态条件并使文件处于不稳定状态。为了避免竞态条件，Java\
  \ 提供了 `synchronized` 关键字来创建同步块和同步方法。\n\nJava 中的同步是通过使用称为监视器（monitor）的代码实现的，监视器由互斥锁（mutex）保护。\n\
  \n### 10.6.1 同步块\n\n同步块是写在大括号中的带有 `synchronized` 关键字的代码段。一次只有一个线程可以通过获取锁来访问此代码。在当前线程释放锁之前，其他线程无法访问该块。此锁基于获取它的对象，而不是方法。\n\
  \n下面的代码演示了同步块的创建：\n\n```java\npublic class TestSynchornizedBlock {\n    public static\
  \ void main(String[] args) {\n        BankAccount accObj = new BankAccount();\n\
  \        Transaction t1 = new Transaction(accObj, 30000.00);\n        Transaction\
  \ t2 = new Transaction(accObj, 6000.00);\n    }\n}\n\nclass BankAccount {\n    double\
  \ balance = 800.0;\n\n    public void depositAmount(double amount) {\n        balance\
  \ = balance + amount;\n    }\n\n    public void showBalance() {\n        System.out.println(\"\
  Balance:\" + balance);\n    }\n}\n\nclass Transaction implements Runnable {\n  \
  \  double amount;\n    BankAccount a1;\n    Thread t;\n}\n```\n\n\n\n\n\n```java\n\
  public Transaction(BankAccount a1, double amt) {\n    this.a1 = a1;\n    amount\
  \ = amt;\n    t = new Thread(this);\n    t.start();\n}\n\n@Override\npublic void\
  \ run() {\n    // Synchronized block\n    synchronized (a1) {\n        a1.depositAmount(amount);\n\
  \        a1.showBalance();\n    }\n}\n}\n```\n\n在这里，`synchronized` 块调用了 `depositAmount()`\
  \ 方法并确保账户保持一致状态，因为同一时间只有一个线程可以访问该方法。代码的输出如下，见图 10.9：\n\n![](img/Figure_10.9.jpg)\n\
  \n图 10.9：同步块\n\n### 10.6.2 同步方法\n\n同步也可以通过使用带有 `synchronized` 关键字的同步方法来实现。访问同步方法的线程会获取锁，其他线程需要等待直到当前线程释放锁。\n\
  \n以下代码演示了如何使用同步方法来防止竞争条件：\n\n```java\npublic class TestSynchronizedMethod {\n  \
  \  public static void main(String[] args) {\n        TrackLine obj = new TrackLine();\n\
  \        // 创建两个共享同一个 Line 对象的线程\n        Train t1 = new Train(obj);\n        Train\
  \ t2 = new Train(obj);\n        // 两个线程开始执行\n        t1.start();\n        t2.start();\n\
  \    }\n}\n\nclass TrackLine {\n    // 如果多个线程（火车）尝试在\n    // 同一个对象上访问此同步方法\n   \
  \ // 则同一时间只有一个线程能够执行它。\n    synchronized public void getLine(Thread t) {\n     \
  \   System.out.println(\"Thread \"+t.getName());\n        for (int i = 0; i < 3;\
  \ i++) {\n            System.out.println(\"Accessing line \"+i);\n            try\
  \ {\n                Thread.sleep(400);\n            } catch (Exception e) {\n \
  \               System.out.println(e);\n            }\n        }\n    }\n}\n\nclass\
  \ Train extends Thread {\n    // Line 类对象\n    TrackLine l1;\n    Train(TrackLine\
  \ line) {\n        this.l1 = line;\n    }\n    @Override\n    public void run()\
  \ {\n        l1.getLine(this);\n    }\n}\n```\n\n在这里，只有一个线程可以访问 `getLine()` 方法，因为它已经被同步化了。代码的输出如下，见图\
  \ 10.10：\n\n![](img/Figure_10.10.jpg)\n\n图 10.10：同步方法\n\n### 10.6.3 Wait-notify\
  \ 机制\n\nwait-notify 机制是一种让线程等待一段时间以运行另一个线程，并在完成后唤醒它的方法。这是通过使用 `wait()` 和 `notify()`\
  \ 方法来实现的，确保两个竞争线程之间资源的一致状态：\n\n- `wait()`：将当前线程置于等待状态，直到另一个线程释放对资源的锁并通知它。`wait()`\
  \ 方法只能在同步代码块中调用。\n    - `wait()`：导致当前线程无限期等待，直到另一个线程在该对象上调用 `notify()` 或 `notifyAll()`\
  \ 方法。\n    - `wait(long timeout)`：允许指定超时时间，超时后等待线程将被自动唤醒。要在超时前唤醒线程，请使用 `notify()`\
  \ 或 `notifyAll()`。\n    - `wait(long timeout, int nanos)`：与之前的 `wait()` 版本相似，不同之处在于允许指定更高精度的超时时间。总超时时间（纳秒）计算公式为\
  \ `1_000_000*timeout + nanos`。\n- `notify()`：随机通知任何一个等待获取共享资源锁的线程。线程的选择是非确定性的，并根据实现方式随机进行。\n\
  - `notifyAll()`：唤醒所有等待获取共享资源锁的线程。\n\n以下生产者-消费者示例演示了 wait-notify 机制：\n\n```java\n\
  public class Producer implements Runnable {\n    private final List<Integer> queue;\n\
  \    private final int SIZE;\n\n    public Producer(List<Integer> queue, int size)\
  \ {\n        this.queue = queue;\n        SIZE = size;\n    }\n\n    @Override\n\
  \    public void run() {\n        int counter = 0;\n        while (true) {\n   \
  \         try {\n                produce(counter++);\n            } catch (InterruptedException\
  \ ex) {\n                ex.printStackTrace();\n            }\n        }\n    }\n\
  \n    private void produce(int i) throws InterruptedException {\n        synchronized\
  \ (queue) {\n            while (queue.size() == SIZE) {\n                System.out.println(\"\
  Queue is full \" + Thread.currentThread().getName() + \" is waiting , size: \" +\
  \ queue.size());\n                queue.wait();\n            }\n            Thread.sleep(3000);\n\
  \            queue.add(i);\n            System.out.println(\"Produced: \" + i);\n\
  \            queue.notifyAll();\n        }\n    }\n}\n```\n\n`Producer` 类通过增加计数器来生成数字。`produce()`\
  \ 方法有一个同步块，同一时间只能由一个线程访问。`wait()` 方法让当前线程无限等待，直到收到 `notify()` 或 `notifyAll()` 方法的唤醒调用。`sleep()`\
  \ 方法让当前线程睡眠 3 秒。一旦当前线程完成，`notifyAll()` 方法会唤醒线程：\n\n```java\npublic class Consumer\
  \ implements Runnable {\n    private final List<Integer> queue;\n\n    public Consumer(List<Integer>\
  \ queue) {\n        this.queue = queue;\n    }\n\n    @Override\n    public void\
  \ run() {\n        while (true) {\n            try {\n                consume();\n\
  \            } catch (InterruptedException ex) {\n                ex.printStackTrace();\n\
  \            }\n        }\n    }\n\n    private void consume() throws InterruptedException\
  \ {\n        synchronized (queue) {\n            while (queue.isEmpty()) {\n   \
  \             System.out.println(\"Queue is empty \" + Thread.currentThread().getName()\
  \ + \" is waiting , size: \" + queue.size());\n                queue.wait();\n \
  \           }\n            int i = queue.remove(0);\n            System.out.println(\"\
  Consumed: \" + i);\n        }\n    }\n}\n```\n\n`Producer` 类通过增加计数器生成数字。`produce()`\
  \ 方法包含一个同步块，一次只允许一个线程访问。`wait()` 方法让当前线程无限等待，直到收到来自 `notify()` 或 `notifyAll()` 方法的唤醒调用。`sleep()`\
  \ 方法让当前线程睡眠 3 秒。一旦当前线程完成，`notifyAll()` 方法会唤醒线程：\n\n```java\npublic class TestWaitNotify\
  \ {\n    public static void main(String[] args) {\n        List<Integer> queue =\
  \ new ArrayList<>();\n        int SIZE = 5;\n        Thread producer = new Thread(new\
  \ Producer(queue, SIZE), \"Producer\");\n        Thread c1 = new Thread(new Consumer(queue),\
  \ \"Consumer-1\");\n        Thread c2 = new Thread(new Consumer(queue), \"Consumer-2\"\
  );\n\n        producer.start();\n        c1.start();\n        c2.start();\n    }\n\
  }\n```\n\n`TestWaitNotify` 类在同一个队列上创建了一个生产者和两个消费者线程。`wait()` 和 `notifyAll()` 方法帮助同步对资源的访问。注意：代码输出每次都不同，因为线程是随机访问资源的。\n\
