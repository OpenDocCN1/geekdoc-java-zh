  ## 9.8.4 DeflaterOutputStream 类\n\n`DeflaterOutputStream` 类以 deflate 压缩格式读取并压缩源数据。随后，它将压缩数据写入输出流。它也是\
  \ `GZIPOutputStream` 和 `ZipOutputStream` 等压缩类的基类。\n\n### 构造函数\n\n*   `DeflaterOutputStream(OutputStream\
  \ in)`: 创建具有默认压缩器和缓冲区大小的输出流。\n\n以下是 `DeflaterOutputStream` 类的重要方法：\n\n*   `write(int\
  \ buffer)`: 向输出流写入一个字节的压缩数据。\n*   `write(byte[] buffer, int offset, int buffSize)`:\
  \ 从偏移量到指定的大小，向输出流写入一个压缩数据的字节数组。\n*   `deflate()`: 向输出流写入下一块压缩数据。\n*   `close()`:\
  \ 在写入剩余压缩数据后关闭输出流。\n*   `finish()`: 在不关闭输出流的情况下，完成向输出流写入压缩数据的操作。\n\n以下代码演示了 `DeflaterOutputStream`\
  \ 类的用法：\n\n```java\nimport java.io.File;\nimport java.io.FileInputStream;\nimport\
  \ java.io.FileOutputStream;\nimport java.util.zip.DeflaterOutputStream;\n\npublic\
  \ class DeflaterOutputStreamDemo {\n\npublic static void main(String args[]) {\n\
  \    try {\n        // 设置输入流\n        File f1 = new File(\"D:/Demos/Read.txt\");\n\
  \        FileInputStream fin = new FileInputStream(f1);\n        System.out.println(\"\
  Original file size: \" + f1.length());\n        // 设置输出流\n        File fout = new\
  \ File(\"D:/Demos/DeflatedData.txt\");\n        FileOutputStream fos = new FileOutputStream(fout);\n\
  \        DeflaterOutputStream defOs = new DeflaterOutputStream(fos);\n        //\
  \ 读取数据并写入\n        // 压缩数据到输出文件\n        int data = 0;\n        while ((data = fin.read())\
  \ != -1) {\n            defOs.write(data);\n        }\n        defOs.close();\n\
  \        fin.close();\n        System.out.println(\"Compressed data length: \" +\
  \ fout.length());\n    } catch (Exception e) {\n        e.printStackTrace();\n \
  \   }\n}\n}\n```\n\n## 9.8.5 InflaterInputStream 类\n\n`InflaterInputStream` 类读取压缩数据并在\
  \ deflate 压缩格式进行解压。\n\n### 构造函数\n\n*   `InflaterInputStream(InputStream in)`: 创建具有默认解压器和缓冲区大小的输入流。\n\
  \n以下是 `InflaterInputStream` 类的一些重要方法：\n\n*   `read()`: 从输入流中读取一个字节的解压数据\n*   `read(byte[]\
  \ buffer, int offset, int buffSize)`: 从给定偏移量开始将给定大小的解压数据读取到字节数组中。\n\n以下代码演示了 `InflaterInputStream`\
  \ 类的用法：\n\n```java\nimport java.io.File;\nimport java.io.FileInputStream;\nimport\
  \ java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.util.zip.InflaterInputStream;\n\
  \npublic class InflaterInputStreamDemo {\n\npublic static void main(String args[])\
