  \n图 10.35：使用`PreparedStatement`对象的批更新\n\n下面的示例演示了如何使用`CallableStatement` 对象执行批更新：\n\
  \n```sql\n/*\nCreate the below-stored procedure in SQL Server\nCreate procedure\
