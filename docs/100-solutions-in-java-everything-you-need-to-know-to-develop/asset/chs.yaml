  \n![](img/fm1.png)\n\n# 第 2 章 Java 编程结构\n\n## 引言\n本章将向你介绍 Java 语言中不同的编程结构，例如注释、变量、数据类型和运算符。它解释了如何格式化输出以及如何使用\
  \ `Scanner` 类获取用户输入。此外，它还向你介绍用于操纵和处理用户输入的各种决策结构、循环结构和分支语句。\n\n## 结构\n在本章中，我们将学习以下主题：\n\
  * Java 注释\n* Java 变量\n* Java 数据类型\n* 类型转换\n* 字面量和转义序列\n* 常量和枚举\n* Java 运算符\n* 运算符优先级和结合性\n\
  * 输出的格式化\n* 用于输入的 `Scanner` 类\n* 决策结构\n* 循环结构\n* 跳跃语句\n\n## 目标\n在本章中，你将学习使用注释、变量、常量和枚举。你还将处理数据类型和运算符。此外，你将学习使用不同的决策结构、循环结构和分支语句。\n\
  \n## 2.1 Java 注释\n注释用于对程序进行说明，以便理解代码或逻辑。它们会被编译器忽略，仅用于描述程序的操作。\n\nJava 支持三种类型的注释，将在接下来的节中进行解释。\n\
  \n### 单行注释\n单行注释用于描述单行代码。\n\n语法：\n```\n// 注释文本\n```\n\n示例：\n```\n// 定义主方法\npublic\
  \ static void main(String args[]){\n}\n```\n\n单行注释可以用以下两种方式使用：\n* 行首注释：放置在代码之前\n\
  * 行尾注释：放置在同一行代码的末尾\n\n示例：\n```\n// 定义主方法\npublic static void main(String args[]){\n\
  } // 主方法结束\n```\n\n### 多行注释\n多行注释写在多行上。它以 `/*` 符号开始，以 `*/` 符号结束。这两个符号之间的所有内容会被编译器忽略。\n\
  \n示例：\n```\n/*\n* 主方法是 Java 程序的\n* 执行点\n*/\npublic static void main(String args[]){\n\
  }\n```\n\n### Javadoc 注释\nJavadoc 注释样式通常用于对程序的类、方法等建立文档。Javadoc 注释以 `/**` 开始，以 `*/`\
  \ 符号结束。注释可以跨多行，符号之间的所有内容会被编译器忽略。`javadoc` 命令用于生成 Javadoc 注释。\n\n示例：\n```\n/**\n\
  * 这是主方法，是程序的执行点。\n* @param args 未使用。\n* @return 无。\n*/\npublic static void main(String\
  \ args[]){\n}\n```\n在这里，`@param` 和 `@return` 是 Javadoc 注释识别的内置标签示例。\n\n## 2.2 Java\
  \ 中的变量\n任何程序最基本的实现都是存储和操作数据。Java 支持不同类型的数据，如数字、字符、布尔值等。为了存储这些类型的值，Java 使用变量，变量是提供存储数据的内存位置的名称。根据存储的数据类型，变量可以不同的数据类型。Java\
  \ 是强类型的，因此在编译期间，会检查每个变量所存储的类型。如果发现类型不匹配，将产生编译错误。\n\n语法：\n```\ndatatype variableName;\n\
  ```\n* `datatype`: Java 支持的任何类型。\n* `variableName`: 有效的变量名。\n\n示例：\n```\n…\nint\
  \ userId;\nString password;\n…\n```\n在这里，声明了两个变量，即 `userId` 和 `password`。`userId`\
  \ 是整数类型，`password` 是 `String` 类型。根据数据类型为变量分配内存。在代码中使用变量之前，必须先声明它。\n\n变量名需要遵循一些命名规范，如下：\n\
  * 变量名不能是 Java 关键字，例如 `static`、`void`、`public`、`int` 等。\n* 变量名可以包含 Unicode 字母、数字、下划线（`_`）和美元符号（`$`）。\n\
  * 变量名必须以字母、美元符号（`$`）或下划线（`_`）开头。\n* 变量名区分大小写；因此 `number` 不等于 `Number`。\n* 单单词变量名应小写开头，例如\
  \ `password`。\n* 多单词变量名的每个单词的首字母应大写，例如 `firstName`。\n\n下表列了一些有效和无效的变量名：\n\n| 有效\
  \ | 无效 |\n| :--- | :--- |\n| `firstName` | `totalscore` |\n| `_15_years` | `Integer`\
  \ |\n| ` ` | `4years` |\n| `$paid_amount` | ` ` |\n| `$$a` | ` ` |\n\n表 2.1：有效和无效的变量名\n\
  \n变量可以在声明时或声明后赋值，如下：\n```\n// 两个 Integer 变量\nint a,b;\n// 初始化变量 a 和 b\na=20;\nb=10;\n\
  \n// 在同一语句中声明一个变量并初始化两个\nint x = 4, y, z = 10;\n\n// 声明并初始化变量\nbyte age = 20;\n\n\
  // 声明并初始化多个相同的值\nint val1 = val2 = 10;\n```\n\n### 变量类型\nJava 支持实例变量、静态变量和局部变量。\n\
  * 实例变量可以通过类的实例来访问。每个实例都有独立的实例变量副本。\n* 静态变量不需要实例即可访问，因为它们是类级变量。使用 `static` 关键字声明静态变量，所有实例共享该变量的副本。\n\
  * 局部变量在块或方法内部声明，无法在外部访问。\n\n| 注意：块以 ‘{’ 开始，以 ‘}’ 大括号符号结束。 |\n\n下图显示了实例变量和静态变量的使用：\n\
  ![](img/Figure_2.1.jpg)\n\n图 2.1：实例和静态变量\n\n在这里，变量 `num` 是实例变量，`count` 是静态变量。对象\
  \ `object1` 和 `object2` 拥有变量 `num` 值的独立副本。但 `count` 变量的值对于两个对象来说是相同的，因为它是一个静态变量。\n\
  \n\n\n\n实例变量的生命周期持续到对象的存在，静态变量的生命周期持续到类的存在。方法级变量的生命周期取决于方法的执行。这些变量在方法执行期间分配内存，并在方法执行完成后销毁。另一组变量是传递给方法的参数，它们存储执行过程中传递给方法的值。\n\
  \n以下示例展示了 Java 程序变量的不同作用域：\n\n```java\npublic class Calculate{\n    // 类级作用域变量\n\
  \    int a, b;\n    static int count; \n    public static void main(String args[]){\n\
  \        int x; // 方法级作用域变量\n        {\n            int y=10; // 块级作用域变量\n     \
  \   }\n        // 以下语句报错\n        // 因为 y 在此处不可访问\n        System.out.println(\"\
  Value of y is \"+y); \n    }\n}\n```\n\n注意：在 `println()` 方法中，语句 `Value of y is`\
  \ 使用连接运算符（`+`）与变量 `y` 拼接。如果 `y` 的值是可以访问的，输出将是 `Value of y is 10`。\n\n## 2.3 Java\
  \ 中的数据类型\n\n数据类型用于告知编译器变量中存储的数据类型。Java 支持不同的数据类型，这些类型大致分为基本数据类型和非基本（引用）数据类型。\n\n\
  ### 基本数据类型\n\n基本数据类型是 Java 中内置的类型，一次可以存储一个单一值。Java 支持多种基本类型，大致分为以下四类：\n\n*   **整数\
  \ (Integer)**：这些类型存储有符号整数。该类中的类型包括 `byte`、`short`、`int` 和 `long`。\n\n注意：有符号整数可以存储正值也可以存储负值，例如\
  \ `-20`。\n\n下表描述了四种整数类型：\n\n| 整数类型 | 描述 | 位大小 | 默认值 | 范围默认值 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| `byte` | 存储少量数据。用于从网络文件流传输数据。用于处理原始二进制数据。 | 8 位(1 字节) | 0 |\
  \ -128 到 127 |\n| `short` | 使用最少的数据类型。存储如 Id 等较小的数字。 | 16 位(2 字节) | 0 | -32,768\
  \ 到 32,767 |\n| `int` | 最常用。存储整数。最高效的数据类型。用于存储工资、发票金额等。 | 32 位(4 字节) | 0 | -2,147,483,648\
  \ 到 2,147,483,647 |\n| `long` | 用于比 int 类型更大的数字。例如，大型科学计算的结果。 | 64 位(8 字节) | 0L\
  \ | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n\n表 2.2：整数数据类型\n\n\
  **浮点数 (Float)**：浮点类型存储浮点数或具有小数精度的实数。Java 支持的浮点类型为 `float` 和 `double`。下表给出了浮点类型的简要描述：\n\
  \n| 浮点类型 | 描述 | 位大小 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| `float` | 支持单精度值。用于存储精度较低的数字。例如，float\
  \ PI, area; | 32 位(4 字节) | 0.0f |\n| `double` | 支持双精度值。用于需要更高精度的较大数学计算。例如，double\
  \ bigData; | 64 位(8 字节) | 0.0d |\n\n表 2.3：浮点型数据类型\n\n注意：在 Java 中，所有数值类型都是有符号的，也就是说它们同时存储正值和负值。每种类型的大小都是相同的，并且在所有平台上都是标准化的。\n\
  \n*   **字符 (Character)**：字符类型用于存储如字母和数字等符号。它只支持一种类型，`char`。\n    *   **位大小**：16\
  \ 位（2 字节）Unicode 字符\n    *   **范围**：0 (`\\u0000`) 到 65,535 (`\\uffff`)\n    *  \
  \ **默认值**：0 (`\\u0000`)\n    例如，\n    `char gender = 'M';`\n\n*   **布尔 (Boolean)**：布尔类型用于表示真或假。它只支持一种类型，`Boolean`。它的大小为\
  \ 1 位，默认值为 `false`。\n    例如，\n    `boolean selected = true;`\n\n### 非基本数据类型\n\n\
  Java 还支持几种非基本和引用类型，即 `String`、`Array`、`Class`、`Interface` 等。\n\n*   **字符串 (String)**：`String`\
  \ 类定义在 `java.lang` 包中，用于存储字符序列，也称为字符串。基本数据类型中没有支持在变量中存储多个字符。`String` 类提供了这一功能。\n\
  \    例如，\n    `String str = \"Stores a string\";`\n    在这里，`str` 不是基本类型变量，而是 `String`\
  \ 类型的对象。值指定在双引号内。`str` 变量的值指定在双引号内。\n\n*   **引用类型 (Reference types)**：Java 还支持几种非基本和引用类型，即\
  \ `String`、`Array`、`Class`、`Interface` 等。\n    *   **字符串**：`String` 类定义在 `java.lang`\
  \ 包中，用于存储字符序列，也称为字符串。基本数据类型中没有支持在变量中存储多个字符。`String` 类提供了这一功能。\n        例如，\n   \
  \     `String str = \"Stores a string\";`\n        在这里，`str` 不是基本类型变量，而是 `String`\
  \ 类型的对象。值指定在双引号内。\n    *   **引用类型**：Java 还支持几种非基本和引用类型，即 `String`、`Array`、`Class`、`Interface`\
  \ 等。\n        *   **字符串**：`String` 类定义在 `java.lang` 包中，用于存储字符序列，也称为字符串。基本数据类型中没有支持在变量中存储多个字符。`String`\
  \ 类提供了这一功能。\n            例如，\n            `String str = \"Stores a string\";`\n\
  \            在这里，`str` 不是基本类型变量，而是 `String` 类型的对象。值指定在双引号内。\n        *   **数组**：引用类型表示值。\n\
  \        *   **类**：它封装了数据。\n        *   **接口**：它包含抽象方法。\n\n以下示例展示了不同类型的使用：\n\n```java\n\
  package mypkg;\n\npublic class Customer {\n    public static void main(String[]\
  \ args) {\n        // 声明变量\n        int custId; // 整数\n        float payableAmt;\
  \ // 浮点型\n        // 声明并初始化变量\n        double creditScore = 45679.89; // 双\n   \
  \     char premiumCust = 'Y'; // 字符\n        boolean paymentStatus = false; // 布尔\n\
  \        String address = \"10, Park\"; // 字符串\n\n        // 初始化变量\n        custId\
  \ = 100;\n        payableAmt = 1047.50f;\n\n        // 输出变量\n        System.out.println(\"\
  Customer Id: \" + custId);\n        System.out.println(\"Address: \" + address);\n\
  \        System.out.println(\"Order Amount: \" + payableAmt);\n        System.out.println(\"\
  Premium Customer?: \" + premiumCust);\n        System.out.println(\"Credit Score:\
  \ \" + creditScore);\n        System.out.println(\"Payment Status: \" + paymentStatus);\n\
  \    }\n}\n```\n\n在这里，声明并初始化了不同类型的变量。注意根据它们存储值的类型使用了有意义的名称。\n\n## 2.4 类型转换\n\nJava\
  \ 支持通过类型转换功能将一种类型转换为另一种类型。类型转换分为两种：\n\n*   **隐式类型转换**：当将某种类型的数据赋值给相同或更大类型的变量时，会导致较小到大类型的隐式或自动转换。这被称为类型提升，即使表达式中的一个操作数是较大的，整个表达式的结果也会被提升为较大的类型。\n\
  \    例如，\n    `int num = 20;`\n    `double numD = num; // 将整数赋值给双`\n\n*   **显式类型转换**：Java\
  \ 支持将类型转换为低类型，但以丢失精度为代价。这被称为显式转换。\n    例如，\n    `float numF = 45.65f;`\n    `int\
  \ num = (int) numF; // 将浮点值转换为整数类型`\n    在这里，`numF` 的小数部分将丢失，结果保存在整数类型变量 `num` 中。\n\
  \n## 2.5 字面量和转义序列\n\n赋值给变量的值称为字面量。下面列出了赋值给相应类型变量的不同字面量：\n\n\n\n\n\n*   **整数字面量 (Integer\
  \ literals)**：整数字面量可以是任何整数。基数为 10 的`0`到`9`之间的十进制，例如`40`；基数为 2 的二进制，即`0`和`1`，例如`0c01001`；基数为\
  \ 16 的十六进制，即数字`0`到`9`和字母`A`到`F`，例如`0x1d`。\n\n*   **浮点字面量 (Floating-point literals)**：浮点字面量带有小数部分的数字，如`2.9`、`2.11`等。数字末尾的`E`或`e`表示幂。例如`8.37E6`、`e+394`等。\n\
  \n*   在 Java SE 7 中增加了对数字字面量下划线 `_` 字符的支持，以提高大数字的可读性。然而，数字不能以下划线开头或结尾。下划线不能放在浮点数的小数点旁边、后缀\
  \ `L` 或 `F` 之前，或者二进制/十六进制符号如 `b` 或 `x` 的前后。一些下划线的有效使用示例有`9449_3848_3948_2944L`、`2.43_37F`、`0b11010111_11100100_00010111`。下划线的无效使用示例有`_3837`、`2_.43_37F`、`0x_83`。\n\
  \n*   **字符字面量 (Character literals)**：字符字面量可以是字母或数字等符号，并单单引号，例如`c`、`$`等。对于不能包含单引号的字符，使用转义序列。\n\
  \n*   **布尔字面量 (Boolean literals)**：布尔字面量只有两个值，`true`和`false`。\n\n*   **空字面量 (Null\
  \ literals)**：空字面量赋值给未指向任何内存地址的引用变量。这意味着变量仍然没有引用任何对象。例如`Vehicle bike = null;`。\n\
  \n*   **字符串字面量 (String literals)**：`String`字面量是双引号内的字符序列，例如`\"This is a string literal\"\
  `、`\"One\\nTwo\"`等。\n\n### 转义序列 (Escape sequences)\n\n转义序列用于表示无法直接作为值传递给字符串的字符。它由反斜杠\
  \ `\\` 表示，表示其后的所有内容都有特殊含义。例如换行符或制表符。同样，Java 中具有特殊含义的字符如`\\`或`\"`也需要转义序列。它们还用于提供格式化输出。下面出了\
  \ Java 支持的转义序列：\n\n*   `\\b`: 退格\n*   `\\t`: 水平制表符\n*   `\\n`: 换行\n*   `\\'`: 单引号\n\
  *   `\\\\`: 反斜杠\n*   `\\r`: 回车\n*   `\\\"`: 双引号\n*   `\\f`: 分页符\n*   `\\xxx`: `000`到`0377`之间的八进制值`xxx`\n\
  *   `\\xxxx`: 编码为`xxxx`（具有一到四个十六进制数字）的 Unicode\n\n以下代码显示了不同转义序列的使用：\n\n```java\n\
  package mypkg;\n\npublic class EscapeSequenceEx {\n\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"Using \\t Escape Sequence Tab and \\n New\
  \ Line\");\n        System.out.println(\"This is Escape Sequence for \\\"Double\
  \ Quotes\\\" in Java\");\n        // 使用十六进制转义序列打印'JAVA'\n        System.out.println(\"\
  \\u004A\\u0041\\u0056\\u0041\");\n        // 使用八进制转义序列为字符'a'打印'Year'\n        System.out.println(\"\
  Ye\\141r \\\"2018\\\" \");\n    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_2.3.jpg)\n\
