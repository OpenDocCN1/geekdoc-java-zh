  \n图 3.7：方法重载\n\n## 3.9 构造函数重载\n\nJava 允许类构造函数的重载，以便初始化不同类型和数量的变量。当实例化对象时，编译器会调用与传递参数的数量、类型和顺序匹配的构造函数。以下示例展示了构造函数重载的实现：\n\
  \n```java\npublic class Customer {\n    String custId, address;\n    float orderAmt;\n\
  \    int itemCount;\n\n    public Customer() {\n        custId = \"C000\";\n   \
  \     address = \"undefined\";\n        orderAmt = 0.0f;\n        itemCount = 0;\n\
  \    }\n\n    public Customer(String id, String addr) {\n        custId = id;\n\
  \        address = addr;\n    }\n\n    public Customer(String id, float amount,\
  \ int quantity) {\n        custId = id;\n        orderAmt = amount;\n        itemCount\
  \ = quantity;\n    }\n\n    public void displayDetails() {\n        System.out.println(\"\
  Customer Id: \" + custId);\n        System.out.println(\"Address: \" + address);\n\
  \        System.out.println(\"Order amount $: \" + orderAmt);\n        System.out.println(\"\
  Item count: \" + itemCount);\n    }\n\n    public static void main(String[] args)\
  \ {\n        Customer c1 = new Customer();\n        c1.displayDetails();\n     \
  \   System.out.println(\"---------------------------\");\n        Customer c2 =\
  \ new Customer(\"C001\", \"Sandra Park\");\n        c2.displayDetails();\n     \
  \   System.out.println(\"---------------------------\");\n        Customer c3 =\
  \ new Customer(\"C002\", 456.50f, 30);\n        c3.displayDetails();\n    }\n}\n\
  ```\n\n在这里，使用了三个重载构造函数来初始化 `Customer` 类的不同变量。在 `main()` 方法中，创建了三个对象，通过根据各自的类型、顺序和序列传递参数来调用相应的构造函数。代码的输出所示：\n\
  \n![](img/Figure_3.8.png)\n\n图 3.8：构造函数重载\n\n注意，对于未指定值的变量，将显示其数据类型的默认值。\n\n## 3.10\
  \ ‘this’ 关键字\n\n`this` 关键字用于引用正在调用其方法或构造函数的当前对象。它可以在实例方法或构造函数中使用。以下示例展示了此 `this`\
  \ 关键字的使用：\n\n*   从具有相同名的参数为变量赋值，即解决命名冲突。\n*   从一个构造函数调用另一个构造函数。\n\n```java\npublic\
  \ class Area {\n    int length;\n    int width;\n\n    public Area() {\n       \
  \ length = 4;\n    }\n\n    public Area(int width) {\n        this(); // 调用默认构造函数\n\
  \        this.width = width; // 解决名称冲突\n    }\n\n    public void calcArea() {\n\
  \        System.out.println(\"Area is \" + (length * width));\n    }\n\n    public\
  \ static void main(String[] args) {\n        Area objRect = new Area(3);\n     \
  \   objRect.calcArea();\n    }\n}\n```\n\n在程序中，`this` 关键字用于参数化构造函数中调用默认构造函数，并从同名的参数为变量\
  \ `width` 赋值。代码的输出所示：\n\n![](img/Figure_3.9.png)\n\n图 3.9：使用 ‘this’ 关键字\n\n## 3.11\
  \ ‘final’ 关键字\n\n`final` 修饰符用于限制变量、方法或类的修改。声明为 `final` 的变量将变成常量，其值在代码之后无法更改。例如：\n\
  \n```java\nfinal float PI = 3.14;\n```\n\n声明为 `final` 的方法不能在子类中被重写，以防止修改方法的定义。例如：\n\
  \n```java\nfinal float getDiscount(float sales){\n    // 执行语句\n}\n```\n\n| 一个 `final`\
  \ 方法不能被声明为 `abstract`（抽象的），否则它无法被重写。`abstract` 关键字用于方法和类。`abstract` 方法不能有体，`abstract`\
  \ 类不能实例化且必须被继承。因此，任何声明为 `abstract` 的内容都不能使用 `final` 修饰符。 |\n\n声明为 `final` 的类不能被继承，`final`\
  \ 类的变量和方法也是隐式的 `final` 的。这种类变成了一个标准类，必须按原样使用。例如：\n\n```java\npublic final class\
