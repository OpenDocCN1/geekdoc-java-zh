  ![](img/Figure_7.26.jpg)\n图 7.26: 查看特定物品\n\n# 8 泛型和时间 API\n\n## 引言\nJava 中的泛型允许类使用参数来指定它所处理的对象类型。本章介绍了泛型的概念，它为管理日期和时间提供了支持。\n\
  \n## 结构\n在本章中，我们将通过以下主题：\n*   泛型\n*   泛型类和方法\n*   类型推断\n*   在泛型和非泛型类中使用泛型构造函数\n\
  *   在集合中使用泛型\n*   在泛型中使用通配符\n*   在异常中使用泛型\n*   泛型的继承\n*   类型擦除\n\n## 目标\n在本章中，你将学习泛型并创建泛型类和方法。你还将学习在集合和异常中使用泛型。此外你将通过继承实现泛型。你还将理解类型擦除配合时间\
  \ API。\n\n## 8.1 泛型\n泛型允许类使用参数来指定它所处理的对象类型。这些参数的类型/值是在运行时指定的。泛型允许避免类型不一致和显式类型转换，从而在编译时防止\
  \ `ClassCastException`。这是因为类型的正确性在编译时会被检查。\n\n对于非泛型集合，提取元素需要显式类型，并有 `ClassCastException`\
  \ 的风险。使用泛型，集合类型直接指定给编译器，有助于在插入和提取期间进行一致的检查。\n\n非泛型集合示例：\n```java\nLinkedList list1\
  \ = new LinkedList();\nlist1.add(1);\nInteger num = (Integer) list1.get(0);\n```\n\
  \n泛型代码示例：\n```java\nLinkedList<Integer> list = new LinkedList<>();\nlist.add(1);\n\
  Integer num = list.get(0);\n```\n在这里，泛型用于识别集合支持的类型，以便值的正确性在编译时得到检查，从而避免在提取时需要显式转换。\n\
  \n关于泛型的重要点：\n*   泛型为代码增加了类型安全。\n*   允许动态绑定。\n*   它有助于在编译时发现并修复错误。\n\n\n\n\n*   通过减少歧义和对显式类型转换的需求来简化代码。\n\
  *   它不支持泛型构造函数。\n*   它不支持键和值类型不同的变量。\n\n## 8.2 泛型类和方法\n\n泛型类用于为一组相关的类型创建一个通用类型。实际类型在类的实例化期间确定确定。泛型类的声明与非泛型类相似，后面紧跟一个在角括号\
  \ `<>` 中指定的类型参数。\n\n语法：\n\n```\nclass class-name <Type> {...}\n```\n\n类型参数的值可以是类、接口或除原始类型以外的任何其他类型。通过创建泛型类，可以存储不同类型的对象。此外，一个类允许允许用逗号分隔的多个类型参数，因此，它也被称为参数化类。\n\
  \n泛型类可以具有带有类型参数的泛型方法。然而，泛型方法也可以是非泛型类的一部分。类型参数的使用支持多态性，并可用于方法重载。方法也可以返回泛型数据。\n\n\
  语法：\n\n```\npublic<T> void display(T[] val)\n```\n\n类型变量可以是任何非原始类型，如类、数组、接口，甚至是另一个类型变量。类型参数名称通常是单个大写字母。下面列了一些常用的类型参数名称：\n\
  \n*   `K` - 键 (Key)\n*   `T` - 类型 (Type)\n*   `V` - 值 (Value)\n*   `N` - 数字 (Number)\n\
  *   `E` - 元素 (Element)\n*   `S, U, V` 等。\n\n在 Java SE 7 及更高版本中，调用泛型类的构造函数时，使用空类型参数括号\
  \ `<>`（称为菱形运算符）来替换所需的类型参数。示例：\n\n```\nTestClass<String> testObj = new TestClass<>();\n\
  ```\n\n下面的示例展示了泛型类、方法和返回类型的使用：\n\n```java\nimport java.util.LinkedList;\n\npublic\
  \ class Toys<T> {\n    private LinkedList<T> toyList = new LinkedList<>();\n\n \
  \   public void addToy(T item) {\n        toyList.addLast(item);\n    }\n\n    public\
  \ T removeToy() {\n        return toyList.removeFirst();\n    }\n\n    public boolean\
  \ checkEmpty() {\n        return (toyList.isEmpty());\n    }\n\n    public String\
  \ viewToys(){\n        return toyList.toString();\n    }\n\n    public static void\
  \ main(String[] args) {\n        Toys<String> toyObj = new Toys<>();\n        toyObj.addToy(\"\
  Barbie\");\n        toyObj.addToy(\"Teddy Bear\");\n        System.out.println(\"\
  Toy list: \"+toyObj.viewToys());\n        System.out.println(\"First Toy: \"+toyObj.removeToy());\n\
  \    }\n}\n```\n\n在这里，创建了一个带有类型参数的泛型类 `Toys`。方法 `addToy()` 和 `removeToy()` 用于接受和返回类型为\
  \ `T` 的参数。当使用 `String` 类型创建 `Toys` 类实例时设置该类型。代码的输出所示：\n\n![](img/Figure_8.1.jpg)\n\
  \n图 8.1: 泛型类和泛型方法\n\n泛型类可以有两个或多个类型参数，如下所示：\n\n```java\nimport java.util.LinkedList;\n\
  \npublic class Toys<T,U> {\n    private U title;\n    private LinkedList<T> toyList\
  \ = new LinkedList<>();\n\n    public void addTitle(U title){\n        this.title=title;\n\
  \    }\n\n    public U showTitle(){\n        return title;\n    }\n\n    public\
  \ void addToy(T item) {\n        toyList.addLast(item);\n    }\n\n    public T removeToy()\
  \ {\n        return toyList.removeFirst();\n    }\n\n    public boolean checkEmpty()\
  \ {\n        return (toyList.isEmpty());\n    }\n\n    public String viewToys(){\n\
  \        return toyList.toString();\n    }\n\n    public static void main(String[]\
  \ args) {\n        Toys<String,String> toyObj = new Toys<>();\n        toyObj.addTitle(\"\
  Toys List\");\n        System.out.println(toyObj.showTitle());\n        toyObj.addToy(\"\
  Barbie\");\n        toyObj.addToy(\"Teddy Bear\");\n        System.out.println(toyObj.viewToys());\n\
  \        System.out.println(\"First Toy: \"+toyObj.removeToy());\n    }\n}\n```\n\
  \n在这里，创建了一个带有两个参数的泛型类，并在 main 方法中实例化期间指定了数据类型。第一个参数 `T` 用于指定 `LinkedList` 的类型，参数\
  \ `U` 用于指定变量 `title` 的类型。代码的输出：\n\n![](img/Figure_8.2.jpg)\n\n图 8.2: 多个泛型参数\n\n\
  ## 8.3 类型推断\n\n类型推断允许通过让 Java 编译器确定参数类型来调用相应的泛型方法。推断算法确定了以下内容：\n\n*   参数的类型。\n*\
  \   返回值的类型。\n*   适用于所有参数的最特定类型。\n\n从 Java SE 7 开始，调用构造函数时不再需要指定类型参数。\n\n示例：\n\n\
  ```\nMap<String, List<String>> map1 = new HashMap<String, List<String>>();\n```\n\
  \n相反，使用了空类型参数集（`<>`）。\n\n## 8.4 使用泛型构造函数和非泛型类\n\n可以使用泛型构造函数，泛型方法是非泛型类的一部分。示例：\n\n\
  ```\nclass Sample<T> {\n    // ...\n    Sample(T t) {\n        // ...\n    }\n}\n\
  ```\n\n类型变量可以是任何非原始类型，如类，数组，接口，甚至是另一个类型变量。类型参数名称通常是单个大写字母。下面列出了一些常用的类型参数名称：\n\n\
  *   `K` - 键\n*   `T` - 类型\n*   `V` - 值\n*   `N` - 数字\n*   `E` - 元素\n*   `S, U, V`\
  \ 等。\n\n## 8.5 泛型与集合\n\n集合是管理一组对象的，并使用泛型。下面的示例展示了泛型集合：\n\n```java\nimport java.util.List;\n\
  import java.util.ArrayList;\nimport java.util.Iterator;\n\npublic class GenericCollection\
  \ {\n    public static void main(String[] args) {\n        List<String> items =\
  \ new ArrayList<>();\n        items.add(\"I01\");\n        items.add(\"I02\");\n\
  \        items.add(\"I03\");\n        System.out.println(\"Item Numbers\");\n  \
  \      Iterator<String> value = items.iterator();\n        while (value.hasNext())\
  \ {\n            String itemObj = value.next();\n            System.out.println(itemObj);\n\
  \        }\n    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_8.3.jpg)\n\n图 8.3: 泛型集合\n\
  \n对泛型集合使用无效值会导致编译错误，所示：\n\n![](img/Figure_8.4.jpg)\n\n图 8.4: 泛型集合的无效值\n\n## 8.6\
  \ 泛型中的通配符\n\n当对参数化类型的类型信息很少或没有时，Java 允许在泛型中使用通配符。问号 `?` 符号在泛型中被称为通配符。它可以表示参数、字段、局部变量的类型，有时作为返回类型。\n\
  \n下面列出了泛型中使用的通配符类型：\n\n*   上界通配符：这些通配符可以用于放宽变量限制。例如，创建一个操作不同类型列表（如 `List<Integer>`、`List<Double>`\
  \ 等）的方法，可以使用上界通配符 `?`。它后面必须紧跟 `extends` 关键字以及其上界。\n\n    示例：\n\n`public static void\
  \ add(List<? extends Number> list)`\n\n下面的代码演示了上界通配符的使用：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class UpBoundWildcard {\n    public static void\
  \ main(String[] args) {\n        // Integer List - 上界\n        List<Integer> intList\
  \ = Arrays.asList(5, 2, 4, 6);\n        System.out.println(\"Sum is:\" + sumList(intList));\n\
  \n        // Double list\n        List<Double> doubleList = Arrays.asList(3.5, 2.8,\
  \ 5.5);\n        System.out.println(\"Sum is:\" + sumList(doubleList));\n    }\n\
  \n    public static double sumList(List<? extends Number> list) {\n        double\
  \ sum = 0;\n        for (Number n : list) {\n            sum += n.doubleValue();\n\
  \        }\n        return sum;\n    }\n}\n```\n\n\n\n\n```java\nprivate static\
  \ double sumList(List<? extends Number> list) {\n    double sum = 0.0;\n    for\
  \ (Number i : list) {\n        sum += i.doubleValue();\n    }\n    return sum;\n\
  }\n```\n\n在这里，创建了两个名为 `intList` 和 `doubleList` 的列表来存储相应类型的集合。这些对象被传递给 `sum` 方法，该方法有一个扩展\
  \ `Number` 类型的通配符 `?`。这意味着传递给方法的列表可以是该类型的任何字段或子类。在这种情况下，`Integer` 和 `Double` 是 `Number`\
  \ 类的子类。\n\n输出：\n![](img/Figure_8.5.jpg)\n\n图 8.5: 上界通配符\n\n### 下界通配符\n这些通配符使用字符\
  \ (`?')` 后紧跟 `super` 关键字，然后是跟其下界：`<? super A>`。\n\n#### 集合类型 `<? super A>`\n下面的示例展示了下界通配符的使用：\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\n\npublic class LoBoundWildcard\
  \ {\n    public static void main(String[] args) {\n        //Integer 列表 - 下界\n \
  \       List<Integer> intList = Arrays.asList(2, 8, 5, 6);\n        displayList(intList);\n\
  \        //Number 列表\n        List<Number> numList = Arrays.asList(2.5, 8.2, 5.6,\
  \ 6.4);\n        displayList(numList);\n    }\n\n    public static void displayList(List<?\
  \ super Integer> list) {\n        System.out.println(list);\n    }\n}\n```\n\n在这里，传递给\
  \ `displayList()` 方法的参数可以是 `Integer` 或 `Integer` 的父类。在这种情况下，它是 `Number` 类。例如，如果传递了\
  \ `Double` 类参数，将抛出编译错误，因为 `Double` 不是 `Integer` 类的父类。\n\n输出：\n![](img/Figure_8.6.png)\n\
  \n图 8.6: 下界通配符\n\n| 注意：你可以为通配符指定上界或下界，但不能两者都指定。 |\n\n*   **无界通配符**：无界通配符类型通过使用通配符字符\
  \ (`?`) 来指定。例如，`List<?>` 表示未知类型的列表。\n\n下面的示例展示了无界通配符的使用：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.List;\n\npublic class UnboundWildcard {\n    public static void\
  \ main(String[] args) {\n        //Integer 列表\n        List<Integer> intList = Arrays.asList(3,\
  \ 8, 5);\n        //Double 列表\n        List<Double> doubleList = Arrays.asList(2.4,\
  \ 1.2, 6.5);\n        displayList(intList);\n        displayList(doubleList);\n\
  \    }\n\n    private static void displayList(List<?> list) {\n        System.out.println(list);\n\
  \    }\n}\n```\n\n在这里，`displayList()` 方法中指定了一个泛型列表参数。这意味着它可以接受任何类型的列表。从 `main()`\
  \ 方法中，`Integer` 和 `Double` 列表作为参数传递给 `displayList()` 方法。由于 `List` 使用了无界 (`?`) 通配符，两个列表都将被该方法处理。\n\
  \n输出：\n![](img/Figure_8.7.jpg)\n\n图 8.7: 无界通配符\n\n## 8.7 在异常中使用泛型\n异常处理通过识别和处理错误来确保代码的顺利运行。`try-catch`\
  \ 语句的 `catch` 子句可以处理匹配给定类型的异常。然而，编译器无法验证 `catch` 子句中指定的异常参数类型以确保它匹配未知类型的异常。这是因为异常仅在运行时被抛出和捕获，且\
  \ `catch` 子句不能包含通配符或类型变量。此外，无法创建 `Throwable` 类的泛型子类，因为运行时异常无法在保持编译时参数完整的情况下捕获。然而，类型参数可以使用方法签名中的\
  \ `throws` 子句。\n\n下面的代码演示了泛型类型与异常的使用：\n\n```java\npublic interface Calculator<X\
  \ extends Throwable> {\n    public void calc(Integer args) throws X;\n}\n\npublic\
  \ class TestCalculator implements Calculator<ArrayIndexOutOfBoundsException> {\n\
  \    @Override\n    public void calc(Integer args) throws ArrayIndexOutOfBoundsException\
  \ {\n        int arr[] = new int[5];\n        for (int i = 0; i < args; i++) {\n\
  \            arr[i] = i;\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        TestCalculator obj = new TestCalculator();\n        obj.calc(6);\n\
  \    }\n}\n```\n\n在这里，代码在 `Calculator` 接口方法签名的 `throws` 子句在使用类型变量。`TestCalculator`\
  \ 类将类型参数识别为 `ArrayIndexOutOfBoundsException`，该异常将从 `calc()` 方法抛出。\n\n上述代码段的输出如下：\n\
  \n![](img/Figure_8.8.jpg)\n\n图 8.8: 使用泛型的异常处理\n\n## 8.8 结合继承实现泛型\n在实现继承时可以使用泛型。类可以继承泛型类，并为类型参数设置值以及添加新的类型参数。以下是规则：\n\
  \n*   类不能继承自参数化类型。\n*   泛型类型可以用于继承。\n\n下面的示例展示了在继承中使用泛型：\n\n```java\npublic class\
  \ Employee<T> {\n    T empObj;\n    Employee(T obj) {\n        empObj = obj;\n \
  \   }\n    // 返回 empObj\n    T getObj() {\n        return empObj;\n    }\n}\n\n\
  public class TestEmployee<T, V> extends Employee<T> {\n    V valObj;\n    TestEmployee(T\
  \ obj, V obj2) {\n        super(obj);\n        valObj = obj2;\n    }\n\n    V getob2()\
  \ {\n        return valObj;\n    }\n\n    public static void main(String args[])\
  \ {\n        TestEmployee<String, Float> emp1;\n        emp1 = new TestEmployee<>(\"\
  Part Time\", 2000f);\n        System.out.println(\"Employee Type: \" + emp1.getObj());\n\
  \        System.out.println(\"Salary: \" + emp1.getob2());\n    }\n}\n```\n\n在这里，子类\
  \ `TestEmployee` 是泛型类 `Employee` 的实例。以下是输出：\n\n![](img/Figure_8.9.jpg)\n\n图 8.9:\
  \ 泛型的继承\n\n## 8.9 类型擦除\nJava 引入泛型是为了在编译时提供更高的类型安全。泛型是由 Java 编译器通过类型擦除实现的。也就是说，\n\
  \n*   它将泛型类型中的所有类型参数替换为边界，如果类型参数无界，则被替换为 `Object`。\n*   随后产生的字节码仅普通的类、接口和方法。\n*\
  \   在需要时插入类型转换以维护类型安全。\n*   它生成桥接方法以保持多态性。\n\n类型擦除用于确保不为参数化类型创建新类。这样，泛型就不会产生运行时开销。例如，参数化类型\
  \ `List<String>` 被转换为 `List`。\n\n## 8.10 时间 API\n长期以来，Java 开发者深受 Java API 对日期和时间支持不足之苦。例如，`java.util.Date`\
  \ 和 `SimpleDateFormatter` 等类不是线程安全的，这导致了许多并发问题和糟糕的 API 设计，普通开发者难以处理。这导致了对第三方日期时间库的使用。为了解决这些问题并为日期和时间提供更好的支持，Java\
  \ 在 SE 8 中引入了新的时间 API。这些功能被包含在新的 Java SE 8 包 `java.time` 中。\n\n#### LocalDate 和\
  \ LocalTime 类\n`LocalDate` 和 `LocalTime` 是时间 API 中最重要的类。它们代表了观察者上下文的日期和时间，例如每天使用的日历或时钟。`LocalDateTime`\
  \ 类是通过配对 `LocalDate` 和 `LocalTime` 创建的复合类。\n\n`java.time` 包重点：\n\n*   **本地（Local）**：日期时间\
  \ API 被简化，没有了处理时区的复杂性。\n*   **时区（Zoned）**：日期时间 API 已针对处理不同的时区进行了专门化。\n\n\n\n\n\n\
  ```java\nimport java.time.LocalDate;\nimport java.time.LocalTime;\nimport java.time.LocalDateTime;\n\
  import java.time.Month;\n\npublic class TimeDemo {\n    public static void main(String[]\
  \ args) {\n        TimeDemo obj = new TimeDemo();\n        obj.displayLocalDateTime();\n\
  \    }\n\n    public void displayLocalDateTime() {\n        // Get the current date\
  \ and time\n        LocalDateTime currentTime = LocalDateTime.now();\n        System.out.println(\"\
  Current Date and Time: \" + currentTime);\n        LocalDate dt1 = currentTime.toLocalDate();\n\
  \        System.out.println(\"Current Date: \" + dt1);\n        Month month = currentTime.getMonth();\n\
  \        int day = currentTime.getDayOfMonth();\n        int seconds = currentTime.getSecond();\n\
  \        System.out.println(\"Month: \" + month + \" Day: \" + day + \" Seconds:\
  \ \" + seconds);\n        LocalDateTime dt2 = currentTime.withDayOfMonth(10).withYear(2017);\n\
  \        System.out.println(\"Time with Month and Year: \" + dt2);\n        //31\
  \ May 2017\n        LocalDate dt3 = LocalDate.of(2017, Month.MAY, 31);\n       \
  \ System.out.println(\"Date: \" + dt3);\n        //20 hour 10 minutes\n        LocalTime\
  \ time1 = LocalTime.of(20, 10);\n        System.out.println(\"Time: \" + time1);\n\
  \        //parsing a string\n        LocalTime time2 = LocalTime.parse(\"20:15:30\"\
  );\n        System.out.println(\"Time from String: \" + time2);\n    }\n}\n```\n\
  \n该代码展示了使用 `LocalDate`、`LocalTime` 和 `LocalDateTime` 类的不同方法。输出将如下：\n\n![](img/Figure_8.10.png)\n\
  \n图 8.10：时间 API\n\n### 8.10.1 ZonedDateTime API\n\n当需要指定时区时，使用如下示例所示的 `ZonedDateTime`\
  \ API：\n\n```java\nimport java.time.ZonedDateTime;\nimport java.time.ZoneId;\nimport\
  \ java.time.LocalTime;\n\npublic class ZonedTimeDemo {\n    public static void main(String\
  \ args[]) {\n        ZonedTimeDemo obj = new ZonedTimeDemo();\n        obj.displayZonedDateTime();\n\
  \    }\n\n    public void displayZonedDateTime() {\n        ZonedDateTime dt1 =\
  \ ZonedDateTime.parse(\"2017-12-20T10:15:30+05:30[Asia/Bangkok]\");\n        System.out.println(\"\
  Date Time of Asia/Bangkok zone: \" + dt1);\n        ZoneId zid = ZoneId.of(\"Europe/Berlin\"\
  );\n        LocalTime now1 = LocalTime.now(zid);\n        System.out.println(\"\
  Time in Zone Id \" + zid + \" is \" + now1);\n        ZoneId currentZone = ZoneId.systemDefault();\n\
  \        System.out.println(\"Current Zone: \" + currentZone);\n    }\n}\n```\n\n\
  代码使用区域 ID 来显示特定时区的时间。输出将如下：\n\n![](img/Figure_8.11.jpg)\n\n图 8.11：时区日期\n\n### 8.10.2\
  \ ChronoUnit 枚\n\nJava SE 8 增加了 `java.time.temporal.ChronoUnit` 枚举，以取代旧 API 中用于表示日、月、年等的整数值：\n\
  \n```java\nimport java.time.LocalDate;\nimport java.time.temporal.ChronoUnit;\n\n\
  public class ChronoUnitDemo {\n    public static void main(String args[]) {\n  \
  \      ChronoUnitDemo obj = new ChronoUnitDemo();\n        obj.displayChromoUnits();\n\
  \    }\n\n    public void displayChromoUnits() {\n        //Get the current date\n\
  \        LocalDate today = LocalDate.now();\n        System.out.println(\"Current\
  \ date: \" + today);\n        //在当前日期增加 2 周\n        LocalDate next2Week = today.plus(2,\
  \ ChronoUnit.WEEKS);\n        System.out.println(\"Week after next week: \" + next2Week);\n\
  \        //在当前日期增加 1 个月\n        LocalDate nextMonth = today.plus(1, ChronoUnit.MONTHS);\n\
  \        System.out.println(\"Next month: \" + nextMonth);\n        //在当前日期增加 1\
  \ 年\n        LocalDate nextYear = today.plus(1, ChronoUnit.YEARS);\n        System.out.println(\"\
  Next year: \" + nextYear);\n        //在当前日期增加 10 年\n        LocalDate nextDecade\
  \ = today.plus(1, ChronoUnit.DECADES);\n        System.out.println(\"Date after\
  \ ten years: \" + nextDecade);\n    }\n}\n```\n\n该代码展示了使用 `ChronoUnit` 常量来显示日期、月份等内容。\n\
  \n输出：\n\n![](img/Figure_8.12.jpg)\n\n图 8.12：ChronoUnit 枚举\n\n### 8.10.3 Period 和\
  \ Duration 类\n\nJava SE 8 引入了两个特殊的类来管理时间差：\n\n- `Period`：管理基于日期的持续时间。\n- `Duration`：管理基于时间的持续时间。\n\
  \n以下程序展示了在时间 API 中对 period 和 duration 使用：\n\n```java\nimport java.time.temporal.ChronoUnit;\n\
  import java.time.LocalDate;\nimport java.time.LocalTime;\nimport java.time.Duration;\n\
  import java.time.Period;\n\npublic class PeriodDurationDemo {\n    public static\
  \ void main(String args[]) {\n        // 示例实现逻辑\n    }\n}\n```\n\n这里，`Period` 和\
  \ `Duration` 类用于识别日期之间的差异。输出将如下：\n\n![](img/Figure_8.13)\n\n图 8.13：和 Duration 类\n\
  \n### 8.10.4 TemporalAdjusters 类\n\nJava API 提供了 `TemporalAdjusters` 类来执行日期计算。例如，获取下一个周三。以下是\
  \ `TemporalAdjusters` 的用法：\n\n```java\nimport java.time.temporal.TemporalAdjusters;\n\
  import java.time.DayOfWeek;\nimport java.time.LocalDate;\n\npublic class TemporalAdjustersDemo\
  \ {\n    public static void main(String args[]) {\n        TemporalAdjustersDemo\
  \ obj = new TemporalAdjustersDemo();\n        obj.testAdjusters();\n    }\n\n  \
  \  public void testAdjusters() {\n        LocalDate today = LocalDate.now();\n \
  \       System.out.println(\"Current date is \" + today);\n        //获取下一个周三\n \
  \       LocalDate nextWed = today.with(TemporalAdjusters.next(DayOfWeek.WEDNESDAY));\n\
  \        System.out.println(\"Next Wednesday is on \" + nextWed);\n        //获取本月的第一个周六\n\
  \        LocalDate firstDay = LocalDate.of(today.getYear(), today.getMonth(), 1);\n\
  \        System.out.println(\"First date of current month: \" + firstDay);\n   \
  \     //获取本月的第二个周六\n        LocalDate secondSaturday = firstDay.with(TemporalAdjusters.nextOrSame(DayOfWeek.SATURDAY)).with(TemporalAdjusters.next(DayOfWeek.SATURDAY));\n\
  \        System.out.println(\"Second Saturday is on \" + secondSaturday);\n    }\n\
  }\n```\n\n这里，`TemporalAdjusters` 类用于获取星期以及本月的第二个周六。输出将如下：\n\n![](img/Figure_8.14)\n\
  \n图 8.14：TemporalAdjusters 类\n\n### 8.10.5 向后兼容\n\nJava 为原始的 `Date` 和 `Calendar`\
  \ 对象增加了 `toInstant()` 方法，允许将它们转换为新的日期时间 API。`ofInstant(Instant, ZoneId)` 方法用于获取\
  \ `LocalDateTime` 或 `ZonedDateTime` 对象。\n\n以下程序展示了为了向后兼容使用 `ofInstant()` 方法：\n\n\
  ```java\nimport java.time.LocalDateTime;\nimport java.time.ZonedDateTime;\nimport\
  \ java.util.Date;\nimport java.time.Instant;\nimport java.time.ZoneId;\n\npublic\
  \ class ToInstantDemo {\n    public static void main(String args[]) {\n        ToInstantDemo\
  \ obj = new ToInstantDemo();\n        // 测试向后兼容\n        obj.testBC();\n    }\n\n\
  \    public void testBC() {\n        Date today = new Date();\n        System.out.println(\"\
  Current date is \" + today);\n        //获取当前日期的毫秒级量\n        Instant now = today.toInstant();\n\
  \        ZoneId thisZone = ZoneId.systemDefault();\n        LocalDateTime lDT =\
  \ LocalDateTime.ofInstant(now, thisZone);\n        System.out.println(\"Local date\
  \ and time is \" + lDT);\n        ZonedDateTime zDT = ZonedDateTime.ofInstant(now,\
  \ thisZone);\n        System.out.println(\"Zoned date and time is \" + zDT);\n \
  \   }\n}\n```\n\n该代码展示了为了与原始 `Date` 和 `Calendar` 对象实现向后兼容而使用 `toInstant()` 方法的用处。\n\
  \n\n\n\n\n## 结论\n\n在本章中，你学习了 Java 支持泛型（generics）概念，通过泛型，可以使用运行时指定类型/值的参数，使类能够指定它可以处理的对象类型。泛型集合还需要特定类型的元素，该类型由类型参数指明。泛型类用于为一组相关类型创建一个通用类型。类型变量可以是任何非原始类型，如类、数组、接口，甚至是另一个类型变量。类型推断（Type\
  \ inference）允许 Java 编译器确定参数的类型，从而调用合适的泛型方法。泛型类和非泛型类都可以使用泛型构造函数。为了对日期和时间提供更好的支持，Java\
  \ 在 Java SE 8 中引入了新的日期和时间 API。`LocalDate` 和 `LocalTime` 是时间 API 中最重要的类。它们代表了从观察者角度的日期和时间。`Period`\
  \ 类管理基于日期的长时间，而 `Duration` 类管理基于时间的时间。Java 为原始的 `Date` 和 `Calendar` 对象添加了 `toInstant()`\
  \ 方法，允许将其转换为新的日期-时间 API。\n\n在下一章中，你将学习 Java 中的文件操作。\n\n## 多选题\n\n1. 在 Java SE 7\
