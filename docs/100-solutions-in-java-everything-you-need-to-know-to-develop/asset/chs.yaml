  \ value is a Letter\");\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        if (args.length == 2) {\n            //将字符串转换为基本类型 int\n    \
  \        int a = Integer.parseInt(args[0]);\n            int b = Integer.parseInt(args[1]);\n\
  \            System.out.println(\"Sum of \" + a + \" and \" + b + \" is \" + (a\
  \ + b));\n        } else {\n            System.out.println(\"Not enough data to\
  \ process\");\n        }\n        WrapperDemo obj = new WrapperDemo();\n       \
  \ obj.useWrappers();\n    }\n}\n```\n\n`useWrappers()` 方法展示了 `parseByte()`、`isDigit()`\
