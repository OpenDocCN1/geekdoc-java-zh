  \n# 第 5 章：子类与接口\n\n## 引言\n\n本章介绍了 Java 中继承的概念以及不同类型的继承。你将学习通过使用抽象类、嵌套类、方法重写等实现继承的不同方法。你还将学习如何使用接口和\
  \ Lambda 表达式。\n\n## 结构\n\n在本章中，我们将学习以下主题：\n\n* Java 中的继承\n* 抽象方法和抽象类\n* 嵌套类\n* 接口\n\
  * Java 函数式接口\n* Lambda 表达式\n\n## 目标\n\n在本章中，你将理解继承的概念并实现不同类型的继承。你还将理解方法重写，以及如何与抽象类和嵌套类工作。此外，你将学习如何与接口和\
  \ Lambda 表达式工作。\n\n## 5.1 Java 中的继承\n\nJava 提供了继承的概念，将具有相似特征的类进行组合并创建类层次结构。将共同的特征和行为组合到单个类中，称为超类或父类，而所有继承了这些特征和行为的类称为子类或子类。\n\
  \n子类继承所有私有成员以外的成员和方法。父类的构造函数不被继承，但可以直接从子类构造函数调用，或通过 `super()` 调用。子类将拥有其自己的特征以及从父类继承的特征。在子类中声明与父类相似的成员将导致父类成员被隐藏。\n\
  \n下图显示了 Java 中不同类型的继承：\n\n![](img/Figure_5.1.jpg)\n\n图 5.1：继承的类型\n\nJava 中不同的继承类型如下：\n\
  \n* 单继承继承：在单继承中，子类只能继承自一个父类/超类。\n* 多级继承：在多级继承中，子类继承自一个父类，该父类本身可以继承另一个单类。\n* 层次结构继承：在层次结构继承中，父类/超类可以有多个子类，这些子类反过来在不同层级可能有其他子类。\n\
  * 多重继承：在多重继承中，子类可以继承多个父类/超类。由于名为“菱形问题”的问题，Java 不支持类的多继承。\n* 菱形问题是指当一个抽象类 `A` 被两个子类\
  \ `B` 和 `C` 继承时的情况。假设该抽象类有一个名为 `test()` 的方法。该方法将在两个子类中都被重写。现在，另一个类 `D` 继承了两个具有相同名称和签名的\
  \ `test()` 方法的子类。在这种情况下，子类对象中将创建两个 `test()` 方法的副本。当创建子类对象来访问 `test()` 方法时，编译器面临模糊的境地，无法决定调用哪种方法。这个问题在\
  \ Java 中被称为菱形问题，如下所示：\n\n```\n|   A   /\\   B C   \\/   D  |\n\n```\n\nJava 以接口的形式为菱形问题提供了解决方案。可以通过在类中实现多个接口来模拟多重继承。你还可以使用\
  \ Java 8 在接口中引入的默认方法。\n\n### 5.1.1 创建子类\n\n为了在 Java 中实现继承，通过 `extends` 关键字在两个或多个类之间创建父子关系。\n\
  \n语法：\n\n```java\npublic class <child-class-name> extends <parent-class-name>{\n\
  \    // 子类成员\n}\n```\n\n要访问父类构造函数，使用了 `super()` 方法。以下示例显示了 Java 中单继承的实现：\n\n```java\n\
  public class Shape {\n    private final float PI = 3.14f;\n    protected float width;\n\
  \    private String shape;\n\n    public Shape(String shape) {\n        this.shape\
  \ = shape;\n    }\n\n    public void area(float length) {\n        switch (shape.toLowerCase())\
  \ {\n            case \"circle\":\n                System.out.println(\"圆形的面积是 \"\
  \ + (PI * length * length));\n                break;\n            case \"square\"\
  :\n                System.out.println(\"正方形的面积是 \" + (length * length));\n     \
  \           break;\n            case \"rectangle\":\n                System.out.println(\"\
  矩形的面积是 \" + (length * width));\n                break;\n            case \"triangle\"\
  :\n                System.out.println(\"三角形的面积是 \" + (1 / 2 * length * width));\n\
  \                break;\n        }\n    }\n}\n\npublic class Rectangle extends Shape\
  \ {\n    public Rectangle() {\n        super(\"rectangle\");\n        width = 20;\n\
  \    }\n\n    public void drawRect() {\n        System.out.println(\"正在画矩形\");\n\
  \    }\n}\n\npublic class TestShapes {\n    public static void main(String[] args)\
  \ {\n        Rectangle obj = new Rectangle();\n        obj.drawRect();\n       \
  \ obj.area(40);\n    }\n}\n```\n\n代码的输出所示：\n\n![](img/Figure_5.2.jpg)\n\n图 5.2：单继承\n\
  \n同样，可以从 `Shape` 类继承更多的类，如 `Circle`、`Triangle` 等，以实现层次结构继承。此外，可以创建 `Rectangle` 类的子类来实现多级继承。下图描述了这一概念：\n\
  \n![](img/Figure_5.3.jpg)\n\n图 5.3：单继承、层次继承和多级继承\n\n例如：\n\n```java\npublic class\
  \ Circle extends Shape{\n    // 类代码\n}\n\npublic class Parallelogram extends Rectangle{\n\
  \    // 类代码\n}\n```\n\n| 注意：Java 不支持多重继承。例如，以下是不允许的。public classA extends classB,\
  \ classC{// 类代码 } |\n\n### 5.1.2 方法重写\n\n方法重写是一个允许在子类中创建一个与父类方法具有相同签名和返回类型的方法的概念。这允许子类修改或增强父类方法的功能，而无需为它使用新名称。方法重写也是在\
  \ Java 中实现多态的方法之一。\n\n\n\n\n请注意，重写方法必须与父类具有相同的签名（名称、类型和参数数量）以及返回类型。重写方法的访问修符不能比父类方法的访问修符弱。\n\
  \n有时，子类可能需要使用父类方法的功能以及其重写版本的功能。这可以通过使用 `super` 关键字调用父类方法来实现，即 `super.parentMethodName`。同样，如果子类有一个与父类数据成员同名的数据成员，可以使用\
  \ `super` 关键字访问父类成员，即 `super.parentVariableName`。\n\n下面的示例展示了方法重写和 `super` 关键字的使用：\n\
  \n```java\npublic class Employee {\n    private String id, name;\n    private float\
  \ salary;\n\n    public Employee(String id, String name, float salary){\n      \
  \  this.id=id;\n        this.name=name;\n        this.salary=salary;\n    }\n\n\
  \    public void displayDetails(){\n        System.out.println(\"Employee id: \"\
  + id);\n        System.out.println(\"Employee name: \"+ name);\n        System.out.println(\"\
  Salary : $\"+salary);\n    }\n}\n```\n\n`Employee` 类是父类，在参数化构造函数中初始化私有变量，并有一个显示详情的方法：\n\
  \n```java\npublic class ContractEmployee extends Employee{\n    int duration;\n\n\
  \    public ContractEmployee(String id, String name, float salary, int duration){\n\
  \        super(id,name,salary);\n        this.duration=duration;\n    }\n\n    //\
  \ overridden method\n    @Override\n    public void displayDetails(){\n        System.out.println(\"\
  Employee Details\");\n        super.dispalyDetails();\n        System.out.println(\"\
  Contract duration: \"+duration+\" months\");\n    }\n}\n```\n\n`ContractEmployee`\
  \ 类继承了 `Employee` 类，并通过使用 `super()` 方法调用父类构造函数来初始化父类变量。它还初始化了自己的变量 `duration`。`displayDetails()`\
  \ 方法在 `ContractEmployee` 类中被重写了。为了使用父方法的功能，使用了 `super` 关键字来调用父类的 `dispalyDetails()`\
  \ 方法。\n\n| 注意：`@Override` 是一个注解，用于通知编译器该方法是从父类重写的。 |\n\n```java\npublic class TestEmployee\
  \ {\n    public static void main(String[] args) {\n        ContractEmployee emp1\
  \ = new ContractEmployee(\"Emp1\",\"John Smith\", 4000f, 6);\n        emp1.displayDetails();\n\
  \    }\n}\n```\n\n`TestEmployee` 类创建了一个 `ContractEmployee` 类对象，并通过向构造函数传递适当的参数来初始化变量。该对象调用了\
  \ `displayDetails()` 方法。注意，由于对象是 `ContractEmployee` 类的，调用的是子类的 `displayDetails()`\
  \ 方法而不是父类的：\n\n![](img/Figure_5.4.png)\n\n图 5.4：方法重写\n\n### 5.1.3 静态绑定与动态绑定\n\n\
  在编译期间对方法和方法调用进行的绑定称为静态/早期绑定，在运行时称为动态/晚期绑定。所有的静态方法调用都在编译时解析，实例方法则在运行时解析。Java 变量访问也遵循静态绑定。\n\
  \n下表列出了静态绑定和动态绑定之间的区别：\n\n| 静态绑定 | 动态绑定 |\n| --- | --- |\n| 在编译时实现。 | 在运行时实现。 |\n\
  | 适用于 private、static 和 final 方法及变量。 | 适用于基于运行时对象类型的虚方法。 |\n| 使用对象/类的类型进行绑定。 | 使用引用类型来解析绑定。\
  \ |\n| 适用于重载方法。 | 适用于重写方法。 |\n\n表 5.1：静态绑定与动态绑定的区别\n\n#### 区分引用类型和对象类型\n\n对象类型由赋值运算符左侧的类名指示，例如\
  \ `Employee objEmp`。引用类型由右侧被调用的构造函数所在的类指示，例如 `Employee objEmp = new Employee()`。\n\
  \n在这种情况下，对象类型和引用类型是相同的。然而，Java 允许赋值继承层次结构中不同类的引用。例如，`Employee objEmp1 = new ContractEmployee()`。这里，对象类型是\
  \ `Employee`，但引用类型是 `ContractEmployee()`。因此，在运行时，对方法或变量的任何调用都被认为来自 `ContractEmployee()`\
  \ 类，而不是 `Employee` 类。\n\n可以将子类的实例转换为其父类类型，这被称为向上转型（upcasting）。例如：\n\n```java\nContractEmployee\
  \ objCE = new ContractEmployee();\nEmployee objEmp = objCE; // upcasting\n```\n\n\
  在向上转型时，父对象无法访问子类特有的成员。\n\n也可以将父引用转换回子类型，这被称为向下转型（downcasting）。然而，向下转型需要通过在括号 `()`\
  \ 中指定子类名来进行显式类型转换。\n\n例如：\n\n```java\nContractEmployee emp = (ContractEmployee)\
  \ objEmp; // downcasting\n```\n\n下面的示例修改了 `TestEmployee` 类以演示引用类型和对象类型之间的区别：\n\n\
  ```java\npublic class TestEmployee {\n    public static void main(String[] args)\
  \ {\n        Employee emp1 = new Employee(\"Emp1\", \"John Smith\", 4000f);\n  \
  \      emp1.displayDetails();\n        System.out.println(\"--------------\");\n\
  \        Employee emp2 = new ContractEmployee(\"Emp2\", \"Mark Stevens\", 2000f,\
  \ 6);\n        emp2.displayDetails();\n    }\n}\n```\n\n`TestEmployee` 类创建一个 `Employee`\
  \ 类对象，并通过向构造函数传递适当的参数来初始化变量。该对象调用了 `displayDetails()` 方法。注意，由于对象是 `ContractEmployee`\
  \ 类，的是子类的 `displayDetails()` 方法而不是父类的：\n\n![](img/Figure_5.4.png)\n\n图 5.4：对象类型与引用类型\n\
  \n### 5.2 抽象方法和类\n\nJava 允许创建声明方法的类，并将实现留给继承类。此类方法是通过使用 `abstract` 关键字创建的。抽象方法没有任何方法定义，并以分号结束。\n\
  \n语法：\n\n`abstract <return-type> <method-name>(<parameter-list>);`\n\n例如：\n\n```java\n\
  abstract void display();\n```\n\n带有抽象方法的类被视为抽象类。它作为继承类的基类。具体的行为由子类实现。\n\n语法：\n\n\
  ```java\nabstract class <class-name>\n{\n    // fields\n    // concrete methods\n\
  \    // abstract methods\n    abstract <return-type> <method-name>(<parameter-list>);\n\
  }\n```\n\n下面的示例展示了抽象类中抽象方法的创建实现：\n\n```java\npublic abstract class Shape{\n    private\
  \ float PI = 3.14;\n\n    // concrete method\n    public float getPI(){\n      \
  \  return PI;\n    }\n\n    // abstract method\n    public abstract void calculateArea();\n\
  }\n```\n\n`Shape` 是一个抽象类，包含一个具体方法和一个抽象方法：\n\n```java\npublic class Rectangle extends\
  \ Shape {\n    private float length, width;\n\n    public Rectangle(float length,\
  \ float width) {\n        this.length = length;\n        this.width = width;\n \
  \   }\n\n    @Override\n    public void calculateArea() {\n        System.out.println(\"\
  Length: \" + length);\n        System.out.println(\"Width: \" + width);\n      \
  \  System.out.println(\"Area of rectangle: \" + (length * width));\n    }\n}\n```\n\
  \n`Rectangle` 类继承抽象类 `Shape` 并根据其需求实现了 `calculateArea()` 方法。同样，可以从 `Shape` 类继承更多类，例如\
  \ `Circle`、`Square` 等，并且这些这些类都可以按照自己的方式实现 `calcualteArea()` 方法：\n\n\n\n\n\n代码的输出所示：\n\
  \n![](img/Figure_5.6.png)\n\n图 5.6: 抽象类和抽象方法\n\n## 5.3 嵌套类\n\n在另一个类内部定义的类称为嵌套类。\n\
  \n语法：\n\n```java\nclass Outer{\n  ...\n  class Nested{\n    ...\n  }\n}\n```\n\n\
  嵌套类具有以下优势：\n\n*   根据相关功能对类进行逻辑分组。\n*   增强了顶层类的封装性，例如，`ClassA` 和 `ClassB`。也就是说，`ClassB`\
  \ 可以嵌套在 `ClassA` 内部，使得 `ClassB` 可以访问 `ClassA` 的私有成员。\n*   通过将代码放置在与其使用位置的地方，提高了代码的可读性和可维护性。\n\
  \n嵌套类大致分类为：\n\n### 非静态嵌套类或内部类\n非静态内部类被声明为外部类或包围类的成员。内部类可以直接访问外部类的所有成员，包括私有成员。外部类无法访问内部类的任何成员。内部类可以声明为\
  \ `public`、`private`、`protected`、`abstract` 或 `final`。\n\n要访问内部类，必须像下面所示先创建一个外部类的实例：\n\
  \n`OuterClass.InnerClass objInner = objOuter.new InnerClass();`\n\n```java\npublic\
  \ class OuterClass {\n  String outerVariable;\n  public void outerMethod(String\
  \ message) {\n    System.out.println(\"Message received: \" + message);\n  }\n \
  \ class InnerClass {\n    public String sayHello() {\n      // 从内部类调用外部类方法\n   \
  \   outerMethod(\"Good Morning\");\n      // 从内部类初始化外部类变量\n      outerVariable =\
  \ \"Hello!!\";\n      return outerVariable;\n    }\n  }\n}\n```\n\n`InnerClass`\
  \ 可以访问 `OuterClass` 的所有成员：\n\n```java\npublic class TestNestedClasses {\n  public\
  \ static void main(String[] args) {\n    OuterClass objOuter = new OuterClass();\n\
  \    // 使用 OuterClass 对象实例化 InnerClass 对象\n    OuterClass.InnerClass objInner =\
  \ objOuter.new InnerClass();\n    System.out.println(objInner.sayHello());\n  }\n\
  }\n```\n\n`TestNestedClasses` 类创建了一个 `OuterClass` 对象，并使用它来实例化 `InnerClass` 对象的。\n\
  \n代码的输出所示：\n\n![](img/Figure_5.7.jpg)\n\n图 5.7: 内部类\n\n### 静态嵌套类\n静态嵌套类以与静态变量和方法相同的方式从外部类访问。静态嵌套类不能直接引用类的类的变量或方法，只能通过对象引用引用。静态嵌套类也是一种顶层类，只是它嵌套在另一个顶层类内部。静态嵌套类可以是\
  \ `public`、`protected`、`private`、`default/package-private`、`final` 和 `abstract`。要访问静态嵌套类，请使用完全限定类名。\n\
  \n例如：\n\n`OuterClass.StaticNestedClass`\n\n下面的示例展示了静态内部类的用法：\n\n```java\npublic\
  \ class OuterClass {\n  String outerVariable;\n  public void outerMethod(String\
  \ message) {\n    System.out.println(\"Message received: \" + message);\n  }\n \
  \ public static void outerMethod1(){\n    System.out.println(\"Outer class static\
  \ method\");\n  }\n  static class InnerClass {\n    public static void sayHello()\
  \ {\n      outerMethod1();\n      System.out.println(\"Greetings from Inner class\"\
  );\n    }\n  }\n}\n```\n\n静态 `InnerClass` 无法访问外部类的实例方法和变量，但它可以访问静态方法和变量：\n\n```java\n\
  public class TestNestedClasses {\n  public static void main(String[] args) {\n \
  \   OuterClass objOuter = new OuterClass();\n    objOuter.outerMethod(\"Good Morning\"\
  );\n    OuterClass.InnerClass.sayHello();\n  }\n}\n```\n\n`TestNestedClasses` 类创建了一个\
  \ `OuterClass` 对象来访问静态的 `InnerClass`。代码的输出所示：\n\n![](img/Figure_5.8.png)\n\n图 5.8:\
  \ 静态嵌套类\n\n### 局部类\n定义在代码块（如构造函数、初始化块或方法体）内部的嵌套类称为局部类。局部内部类是特定块的一部分，而不是外部类的一部分。因此，它不能使用任何访问修饰符，但仍然仍然访问外部类的所有成员，包括在它定义作用域中声明的\
  \ final 变量：\n\n```java\npublic class OuterClass {\n  String outerVariable;\n  public\
  \ void outerMethod(String message) {\n    class LocalInner {\n      public String\
  \ getMessage() {\n        return \"Hello!! \";\n      }\n    }\n    LocalInner obj\
  \ = new LocalInner();\n    System.out.println(obj.getMessage() + \"Message received:\
  \ \" + message);\n  }\n  public static void outerMethod1() {\n    System.out.println(\"\
  Outer class static method\");\n  }\n}\n```\n\n`LocalInner` 类定义在 `OuterClass` 类的\
  \ `outerMethod()` 方法内部。该方法创建了局部类的对象来访问 `getMessage()` 方法：\n\n```java\npublic class\
  \ TestNestedClasses {\n  public static void main(String[] args) {\n    OuterClass\
  \ objOuter = new OuterClass();\n    objOuter.outerMethod(\"Good Morning\");\n  }\n\
  }\n```\n\n`TestNestedClasses` 类创建了一个 `OuterClass` 对象并使用它调用了 `outerMethod()`。代码的输出所示：\n\
  \nHello!! Message received: Good Morning\n\n\n\n\n接口（interface）是一种约，规定了实现它的类型所必须遵循的标准。它是实现多重继承的一种变通方法。接口也是与接口名称同名的\
  \ `.java` 文件。接口的字节码也会像普通类一样被转换为 `.class` 文件。\n\n然而，与类不同，接口不能有构造函数，因此无法实例化。接口的方法是隐式抽象的（abstract）。接口的字段必须是\
  \ `static` 且 `final` 的；它不能拥有实例字段。接口不是被类扩展的，而是被类实现的。一个类可以实现多个接口。一个接口可以扩展多个接口。\n\n\
  在 Java SE 7 之前，接口仅支持方法声明，即不带方法体的方法。然而，随着 Java SE 8 引入了默认方法（default methods），在 Java\
  \ 9 中引入了私有方法（private methods）。\n\n接口不用于实现继承层次结构。相反，它们用于将公共方法分组，不同的实体可以根据需要对这些方法进行实现，即使它们不是该接口的类型。按照命名规范，接口名称通常会带有前缀字母\
  \ `I`，以区分接口的 `.java` 文件和类的 `.java` 文件。接口名称使用 `CamelCase`（驼峰命名），每个单词的首字母大写。接口名称应该体现其执行的功能。\n\
  \n例如：\n\n```java\ninterface IEnumerable\ninterface IComparable\n```\n\n### 语法\n\
  ```java\n<visibility> interface <interface-name> extends <other-interfaces, … >\n\
  {\n    // 声明常量\n    // 抽象、默认、私有方法\n}\n```\n\n例如：\n\n```java\npublic interface ITestInterface\
  \ extends Interface1{\n    static final int num;\n    public void interfaceMethod();\n\
  }\n```\n\n实现接口的类必须实现所有抽象方法，否则必须被标记为抽象（abstract）。如果实现接口的类被声明为抽象，则其一个子类必须实现未实现的方法。如果抽象类的没有任何子类实现接口方法，则这些子类也必须标记为抽象。\n\
  \n### 语法\n```java\nclass <class-name> implements <Interface1>,…\n{\n    // 类成员\n\
  \    // 接口的重写方法\n}\n```\n\n要在 NetBeans 中创建新接口，右键点击一个包并选择 `New | Java Interface`。为它提供名称并点击\
  \ Finish。\n\n以下示例展示了接口的使用：\n\n```java\npublic interface IProduct {\n    static final\
  \ String PRODUCTZONE = \"CA-LA\";\n    public void addProductDetails();\n    public\
  \ void showProductDetails(String prodID);\n}\n```\n\n接口 `IProduct` 声明了一个 `static\
  \ final` 变量两个抽象方法：\n\n```java\npublic class TShirts implements IProduct {\n    String\
  \ tshirts[];\n\n    @Override\n    public void addProductDetails() {\n        tshirts\
  \ = new String[3];\n        tshirts[0] = \"T-shirt A, Red color, Brand A\";\n  \
  \      tshirts[1] = \"T-shirt B, Blue color, Brand B\";\n        tshirts[2] = \"\
  T-shirt C, Black color, Brand C\";\n        System.out.println(\"Product details\
  \ added\");\n    }\n\n    @Override\n    public void showProductDetails(String prodID)\
  \ {\n        System.out.println(\"TShirt Details\");\n        for (String details:tshirts)\
  \ {\n            System.out.println(details);\n        }\n    }\n\n    public void\
  \ showTShirtSizes(){\n        System.out.println(\"T-shirt Sizes\");\n        System.out.println(\"\
  Large\");\n        System.out.println(\"Medium\");\n        System.out.println(\"\
  Small\");\n    }\n}\n```\n\n`TShirts` 类实现了 `IProduct` 接口并实现了两个方法 `addProductDetails()`\
  \ 和 `showProductDetails()`：\n\n```java\npublic class TestProducts {\n    public\
  \ static void main(String[] args) {\n        System.out.println(IProduct.PRODUCTZONE\
  \ + \" Zone\");\n        obj = new TShirts();\n        obj.addProductDetails();\n\
  \        System.out.println(\"-------------------\");\n        obj.showProductDetails(\"\
  T001\");\n        System.out.println(\"-------------------\");\n        obj.showTShirtSizes();\n\
  \    }\n}\n```\n\n`TestProducts` 类创建了 `TShirts` 类的对象并调用了两个重写的实现方法以及类特定的方法。注意 `PRODUCTZONE`\
  \ 常量是通过接口名称直接调用的。代码的输出所示：\n\n![](img/Figure_5.9.jpg)\n\n图 5.9: 实现接口\n\n同样，可以为任何类型的产品（如玩具、材料、文具等）创建更多类，这些类可以实现\
  \ `IProduct` 接口。\n\n### 5.4.1 实现多个接口\n\nJava 不支持类的多重继承。作为变通方法，它允许类中实现多个接口来模拟多重继承。\n\
