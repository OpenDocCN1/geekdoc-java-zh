  \ 对象用于调用存储过程。该过程可以带或不带结果参数进行调用，这类似于过程的 `OUT` 参数。使用问号 `?` 占位符表示参数。\n\n语法：\n`{call\
  \ procedure_name}`\n\n语法：\n`{call procedure_name[(?, ?, ...)]}`\n\n语法：\n`{? = call\
  \ procedure_name[(?, ?, ...)]}`\n\n| 注意：大括号内的代码是存储过程的转义语法。它由驱动程序转换为数据库所使用的原生 SQL。\
  \ |\n\n`CallableStatement` 继承自 `Statement` 和 `PreparedStatement` 接口。get 器方法（即 `get<Type>`）用于获取\
  \ `OUT` 参数值。`prepareCall()` 方法用于创建 `CallableStatement` 对象。\n\n语法：\n`CallableStatement\
  \ cst = cn.prepareCall(\"{call functionname(?, ?)}\");`\n\n例如：\n`CallableStatement\
  \ cs = cn.prepareCall( \"{call empSalaries(?)}\");`\n\n在这里，`empSalaries(?)` 存储过程通过单个占位符进行调用，该占位符可以是\
  \ `IN`、`OUT` 或 `IN/OUT` 参数。它没有任何结果参数。设置方法（即 `set<Type>`）用于指定 `IN` 参数的值。\n\n在调用存储过程之前，需要使用\
  \ `registerOutParameter()` 方法注册 `OUT` 参数。以下代码演示了如何使用 `CallableStatement` 调用 `Show_Students`\
  \ 存储过程：\n\n```java\nimport java.sql.CallableStatement;\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.ResultSet;\n\npublic class SPDemo\
  \ {\n    public static Connection conn = null;\n\n    public static void main(String[]\
  \ args) {\n        try {\n            String dbURL = \"jdbc:sqlserver://SQLS:1433;\
  \ databaseName=MyDB;integratedSecurity=true;\";\n            conn = DriverManager.getConnection(dbURL);\n\
  \            CallableStatement cst = conn.prepareCall(\"{call Show_Students}\");\n\
  \            ResultSet rs = cst.executeQuery();\n            System.out.println(\"\
  StudId\\tStudName\\tPercentage\");\n            while (rs.next()) {\n          \
  \      System.out.println(rs.getInt(1) + \"\\t\" + rs.getString(2) + \"\\t\\t\"\
  \ + rs.getFloat(3));\n            }\n        } catch (Exception e) {\n         \
  \   System.out.println(\"\");\n            e.printStackTrace();\n        }\n   \
  \ }\n}\n```\n\n在这里，使用 `prepareCall()` 方法来调用 `Show_Students` 存储过程。代码的输出所示图 10.30：\n\
  \n![](img/Figure_10.30.jpg)\n\n图 10.30：CallableStatement 输出\n\n以下代码演示了如何使用 `registerOutParameter()`\
  \ 方法：\n\n```sql\n/*\n-- 在你的数据库中创建下面的参数化过程\n-- 该过程使用 max 函数查找最大百分比\n-- 并作为 OUT 参数返回给调用者\n\
  Create procedure findMaxPer\n@per_max float OUT\nas\nselect @per_max = max(Percentage)\
  \ from Student\n*/\n```\n\nimport java.sql.CallableStatement;\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\n\npublic class SPDemo1 {\n    public static void\
  \ main(String[] args) {\n        try {\n            Connection conn;\n         \
  \   String dbURL = \"jdbc:sqlserver://SQLS:1433; databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            CallableStatement\
  \ cstmt = conn.prepareCall(\"{call findMaxPer(?)}\");\n            cstmt.registerOutParameter(1,\
  \ java.sql.Types.FLOAT);\n            float maxPer = cstmt.getFloat(1);\n      \
  \      System.out.println(\"Maximum Percentage is \" + maxPer);\n        } catch\
  \ (Exception e) {\n            System.out.println(\"\");\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n在这里，`?` 占位符用于 `OUT` 参数，即存储过程中查询返回的最大百分比。使用 `execute()`\
  \ 方法执行查询。输出将如下所示：\n\nMaximum Percentage is 78.6\n\n下面列出了一些带有 `IN` 和 `OUT` 参数的存储过程的更多示例。\n\
  \n*   带有 `IN` 参数的示例：\n\n```sql\n/*\n-- 在你的数据库中创建下面的参数化过程\n-- 该过程取 student id 为参数\n\
  -- 并返回学生的百分比\nCreate procedure Display_Student(@StudId int)\nas\nselect Percentage\n\
  from Student\n*/\n```\n\n```java\nCallableStatement cst = cn.prepareCall(\"{call\
  \ Display_Student(?)}\");\ncst.setInt(1, 5);\nResultSet rs = cst.executeQuery();\n\
  while (rs.next()) {\n    System.out.println(\"Name:\" + rs.getString(1));\n    System.out.println(\"\
  Percentage:\" + rs.getFloat(2));\n}\n```\n\n*   带有 `IN` 和 `OUT` 参数的示例：\n\n```sql\n\
  /*\n-- 在你的数据库中创建下面的参数化过程\n-- 该过程取 baseline 为参数\n-- 并返回大于 baseline 的最小百分比\nCreate\
  \ procedure findPercent(@baseline int, @per_min int OUT)\nas\nselect @per_min =\
  \ min(Percentage) from Student\n*/\n```\n\n```java\nCallableStatement cstmt = conn.prepareCall(\"\
  {call findPercent(?,?)}\");\ncstmt.setInt(1, 40);\ncstmt.registerOutParameter(2,\
  \ java.sql.Types.INTEGER);\ncstmt.execute();\nint per = cstmt.getInt(2);\nSystem.out.println(\"\
  Smallest Percentage greater than 40 is \" + per);\n```\n\n### 10.15 Scrollable ResultSet\n\
  \n`ResultSet` 对象以行和列的形式包含查询结果。默认情况下，`ResultSet` 只能正向遍历。然而，可以向向遍历 `ResultSet`，并将光标移动到特定行。此外，还可以插入、更新和删除行。\n\
  \n下面列出了 `ResultSet` 的特性：\n\n*   Scrollable：光标可以在结果集中向前也可以向后移动。\n*   Updatable：`ResultSet`\
  \ 对象可以更新，更改可以保存到数据库。这包括插入新行、更新和删除行。\n*   Holdable：在 `COMMIT` 后保持光标打开。\n\n以下是创建可滚动\
  \ `ResultSet` 的方法：\n\n1.  `public Statement createStatement(int resultSetType, int\
  \ resultSetConcurrency) throws Exception`\n\n    在这里，\n\n    *   `resultSetType`：可以是\
  \ `ResultSet.TYPE_FORWARD`、`ResultSet.TYPE_SCROLL_SENSITIVE` 或 `ResultSet.TYPE_SCROLL_INSENSITIVE`。\n\
  \    *   `resultSetConcurrency`：指示结果集是只读还是可更新的。常量值 `ResultSet.CONCUR_READ_ONLY`\
  \ 或 `ResultSet.CONCUR_UPDATABLE`\n\n        例如：\n        ```java\n        Statement\
  \ stmt = conn.createStatement(\n        ResultSet.TYPE_SCROLL_INSENSITIVE,ResultSet.CONCUR_READ_ONLY);\n\
  \        ResultSet rs = stmt.executeQuery(\"SELECT * FROM STUDENT\");\n        ```\n\
  \n2.  `public CallableStatement prepareCall(String sql, int resultSetType, int resultSetConcurrency)\
  \ throws SQLException`\n\n    例如：\n    ```java\n    CallableStatement cstmt = conn.prepareCall(\"\
  ? =call StudentDetail(?, ?)\", ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
  \    ```\n\n下面是结果类型的不同静态常量：\n\n*   `TYPE_FORWARD_ONLY`：光标在 `ResultSet` 中只能正向移动。这是默认类型。这种类型的光标对打开时对数据库进行的更改不敏感。\n\
  \n    例如：\n    ```java\n    PreparedStatement pstmt = cn.prepareStatement\n    (\"\
  SELECT * FROM STUDENT WHERE STUDID = ?\",\n    ResultSet.TYPE_FORWARD_ONLY, ResultSet.CONCUR_READ_ONLY);\n\
  \    ```\n\n\n\n\n\n- `TYPE_SCROLL_INSENSITIVE`: 游标可以通过各种方式在结果集中进行滚动。这种类型的游标对打开期间数据库所做的的更改不敏感。\n\
  \n例如：\n```java\nPreparedStatement pstmt = cn.prepareStatement(\"SELECT * FROM STUDENT\
  \ WHERE STUDID = ?\", ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
  ```\n\n- `TYPE_SCROLL_SENSITIVE`: 游标可以通过各种方式在结果集中进行滚动。这种类型的游标对打开期间数据库所做的的更改非常敏感。当游标来回移动时，这些更改将反映出来。\n\
  \n例如：\n```java\nPreparedStatement pstmt = cn.prepareStatement(\"SELECT * FROM STUDENT\
  \ WHERE STUDID = ?\",ResultSet.TYPE_SCROLL_SENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
  ```\n\n并发表示两个或多个事件并行发生。`ResultSet` 对象的并发类型可以设置，以指示其是否可更新。下面列出了指定并发类型的常量值：\n\n- `CONCURRENCY.READ_ONLY`:\
  \ 结果集不能被修改，因此不可更新。\n- `CONCURRENCY.UPDATABLE`: 允许对结果集执行插入、更新和删除操作，并且更改将保存到数据库中。\n\
  \n下面列出了可滚动结果集的重要游标定位方法：\n\n- `next()`: 将游标从 `ResultSet` 中的当前位置向前移动一行。如果游标位于有效行上，则返回\
  \ `true`，否则返回 `false`。\n- `previous()`: 将游标从 `ResultSet` 中的当前位置向后移动一行。如果游标位于有效行上，则返回\
  \ `true`，否则返回 `false`。\n- `first()`: 将游标移动到 `ResultSet` 的第一行。如果游标位于第一行，则返回 `true`。如果\
  \ `ResultSet` 为空，则返回 `false`。\n- `last()`: 将游标移动到 `ResultSet` 的最后一行。如果游标位于最后一行，则返回\
  \ `true`。如果 `ResultSet` 为空，则返回 `false`。\n- `beforeFirst()`: 将游标移动到 `ResultSet` 第一行之前。\n\
  - `afterLast()`: 将游标移动到 `ResultSet` 最后一行之后。\n- `relative(int rows)`: 将游标相对于 `ResultSet`\
  \ 中的当前位置移动。如果游标位于有效行上，则返回 `true`，否则返回 `false`。对于 `row` 值为 `0`，此方法没有作用。对于正的 `row`\
  \ 值，游标向前移动相应的行数。对于负的 `row` 值，游标向后移动相应的行数。如果 `rows` 的数量小于计数，则它的操作类似于 `afterLast()`。\n\
  - `absolute(int row)`: 将游标移动到 `row` 值指定的行。如果游标位于有效行上，则返回 `true`，否则返回 `false`。对于\
  \ `row` 值为 `0`，此方法的操作类似于 `beforeFirst`。对于正的 `row` 值，游标位于从开始计算的第几行（第一行编号为 1）。对于负的\
  \ `row` 值，游标位于从末尾计算的第几行。\n\n### 在 ResultSet 对象上执行插入、更新和删除操作\n\n可滚动且可更新的结果集允许对 `ResultSet`\
  \ 对象进行遍历、插入和修改。`updateXXX()` 方法用于修改现有行中的数据。可以通过以下步骤在 `ResultSet` 对象上执行插入、更新和删除操作：\n\
  \n1. 定位游标\n2. 更新列\n3. 提交行\n\n以下示例演示了如何在 `ResultSet` 对象中插入新行：\n\n```java\nimport\
  \ java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
  import java.sql.Statement;\n\npublic class InsertRowExample {\n    public static\
  \ void main(String[] args) {\n        try {\n            Connection conn;\n    \
  \        String dbURL = \"jdbc:sqlserver://localhost:1433;databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            //创建一个可更新的结果集\n\
  \            Statement stmt = conn.createStatement(ResultSet.TYPE_SCROLL_SENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n            ResultSet rs = stmt.executeQuery(\"\
  SELECT StudId, StudName, Percentage FROM Student\");\n            rs.moveToInsertRow();\n\
  \            // 设置新行的值\n            rs.updateInt(1, 7);\n            rs.updateString(2,\
  \ \"William\");\n            rs.updateFloat(3, 10.5f);\n            //提交将新行到结果集\n\
  \            rs.insertRow();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \            System.out.println(\"Exception\" + e.getMessage());\n        }\n  \
  \  }\n}\n```\n新行已插入并保存到数据库中，如图 10.31 所示。\n\n![](img/Figure_10.31.jpg)\n图 10.31:\
  \ 在 ResultSet 中插入行\n\n以下代码演示了如何在 `ResultSet` 对象中更新行：\n\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.Statement;\n\
  \npublic class UpdateRowExample {\n    public static void main(String[] args) {\n\
  \        // TODO 在此处编写代码应用逻辑\n        try {\n            Connection conn;\n    \
  \        String dbURL = \"jdbc:sqlserver://localhost:1433;databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            //创建一个可更新的结果集\n\
  \            Statement stmt = conn.createStatement(ResultSet.TYPE_SCROLL_SENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n            ResultSet rs = stmt.executeQuery(\"\
  SELECT StudId, StudName, Percentage FROM Student\");\n            //移动到第一行\n   \
  \         rs.first();\n            rs.updateString(2, \"Patrick\");\n          \
  \  rs.updateFloat(3, 85.6f);\n            //提交更新\n            rs.updateRow();\n\
  \        } catch (Exception e) {\n            System.out.println(\"\");\n      \
  \      e.printStackTrace();\n        }\n    }\n}\n```\n学生 ID 为 4 的行已更新并保存到数据库中，如图\
  \ 10.32 所示。\n\n![](img/Figure_10.32.jpg)\n图 10.32: 在 ResultSet 中更新行\n\n以下代码演示了如何在\
  \ `ResultSet` 对象中删除行：\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  import java.sql.ResultSet;\nimport java.sql.Statement;\n\npublic class DeleteRowDemo\
  \ {\n    public static void main(String[] args) {\n        try {\n            Connection\
  \ conn;\n            String dbURL = \"jdbc:sqlserver://localhost:1433;databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            //创建一个可更新的结果集\n\
  \            Statement stmt = conn.createStatement(ResultSet.TYPE_SCROLL_SENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n            ResultSet rs = stmt.executeQuery(\"\
  SELECT * FROM Student\");\n            //移动到结果集的最后一行\n            rs.last();\n \
  \           //提交删除\n            rs.deleteRow();\n        } catch (Exception e) {\n\
  \            System.out.println(\"\");\n            e.printStackTrace();\n     \
  \   }\n    }\n}\n```\n最后一行（在本例中为 StudId=7）已删除，更改保存到数据库中，如图 10.33 所示。\n\n![](img/Figure_10.33.jpg)\n\
  图 10.33: 在 ResultSet 中删除行\n\n### 批量更新\n\n批量是一组组合一起处理的语句。批量更新功能允许将多个更新命令作为一个单元或批次进行处理。`Statement`、`PreparedStatement`\
  \ 以及 `CallableStatement` 对象都可用于提交批量更新。批量更新本质上有助于提高性能。使用 `Statement` 接口实现批量更新的步骤如下：\n\
  \n- 禁用自动提交模式：`conn.setAutoCommit(false);`\n- 创建 `Statement`/`PreparedStatement`/`CallableStatement`\
  \ 实例：`Statement stmt = conn.createStatement();`\n- 将查询添加到批量中：\n  `stmt.addBatch(\"\
  INSERT INTO STUDENT VALUES (10, 'Michael')\");`\n  `stmt.addBatch(\"INSERT INTO\
  \ STUDENT VALUES (11, 'Willy')\");`\n- 执行批量：`int[] count = stmt.executeBatch();`\n\
  - 提交数据库中的更改：`conn.commit();`, `conn.setAutoCommit(true);`\n- 从批量中移除命令：`stmt.clearBatch();`\n\
  \n以下演示展示了如何使用 `Statement` 对象执行批量更新：\n\n\n\n\n\n```java\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.Statement;\n\npublic class StmtBatchUpdate\
  \ {\n\n    public static void main(String[] args) {\n        try {\n           \
  \ Connection conn;\n            //Get a connection\n            String dbURL = \"\
  jdbc:sqlserver://SQLS:1433; databaseName=MyDB;integratedSecurity=true;\";\n    \
  \        conn = DriverManager.getConnection(dbURL);\n            conn.setAutoCommit(false);\n\
  \            Statement st = conn.createStatement();\n            st.addBatch(\"\
  INSERT INTO Student VALUES (7, 'Stephen',65.8)\");\n            st.addBatch(\"INSERT\
  \ INTO Student VALUES (8, 'Vereonica',77.2)\");\n            st.addBatch(\"INSERT\
  \ INTO Student VALUES (9, 'Stella',58.6)\");\n            int[] updateCount = st.executeBatch();\n\
  \            conn.commit();\n            for (int i = 0; i <updateCount.length;\
  \ i++) {\n                System.out.println(\"Update count for statement \"+ (i+1)\
  \ +\" is \"+ updateCount[i]);\n            }\n            conn.setAutoCommit(true);\n\
  \            st.clearBatch();\n        } catch(Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n批语句被插入到数据库中。代码的输出如图图 10.34 所示：\n\n![](img/Figure_10.34.jpg)\n\
  \n图 10.34：使用`Statement`对象的批更新\n\n下面的示例演示了如何使用`PreparedStatement` 对象执行批更新：\n\n```java\n\
  import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.PreparedStatement;\n\
