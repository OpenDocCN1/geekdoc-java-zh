  图 10.36：使用`CallableStatement`对象的批更新\n\n## 10.17 事务\n\n事务是指一组作为一个单元共同执行的语句。事务的锁机制允许保持表中数据的完整性。事务可以被提交也可以被回滚。\n\
  \n下面列出了事务的 ACID 属性：\n\n-   **原子性 (Atomicity)**：该属性保证了所有语句要么全部执行，要么都不执行。\n-   **一致性\
  \ (Consistency)**：该属性确保数据库从一个有效状态转换到另一个有效状态。\n-   **隔离性 (Isolation)**：该属性确保并发事务之间互不干扰。\n\
  -   **持久性 (Durability)**：该属性确保一旦事务提交，即使在发生系统故障的情况下，它也会保持提交状态。\n\n下面列出了在 Java 中实现事务的重要步骤：\n\
  \n1. **启动事务**：使用 `setAutoCommit(false)` 禁用自动提交模式。\n2. **执行事务**：执行你的 SQL 语句。\n3.\
  \ **使用保存点 (Savepoint)**：使用 `setSavepoint(name)` 创建一个可以回滚的点。\n4. **关闭/提交事务**：使用 `commit()`\
  \ 提交更改，或使用 `rollback(name)` 回滚到保存点。\n\n下面的示例演示了在 Java 中使用 `Savepoint` 实现事务：\n\n\
  ```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.PreparedStatement;\n\
  import java.sql.SQLException;\nimport java.sql.Savepoint;\n\npublic class TransactionExample\
  \ {\n\n    public static void main(String[] args) throws SQLException {\n      \
  \  Connection conn = null;\n        Savepoint svpt = null;\n        try {\n    \
  \        String dbURL = \"jdbc:sqlserver://SQLS:1433; databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            conn.setAutoCommit(false);\n\
  \            PreparedStatement pst = conn.prepareStatement(\"INSERT INTO Student\
  \ VALUES (?,?,?)\");\n            pst.setInt(1, 14);\n            pst.setString(2,\
  \ \"Paul\");\n            pst.setFloat(3, 46.7f);\n            pst.executeUpdate();\n\
  \            svpt = conn.setSavepoint(\"SAVEPOINT_1\");\n            pst.setInt(1,\
  \ 15);\n            pst.setString(2, \"Jennifer\");\n            pst.setFloat(3,\
  \ 68.9f);\n            pst.executeUpdate();\n            pst.setInt(1, 16);\n  \
  \          pst.setString(2, \"Katie\");\n            pst.setFloat(3, 70.5f);\n \
  \           pst.executeUpdate();\n            conn.commit();\n            pst.close();\n\
  \            conn.close();\n        } catch (Exception e) {\n            try {\n\
  \                if (svpt == null) {\n                    // 在保存到 Student 表时发生 SQLException\n\
  \                    conn.rollback();\n                    System.out.println(\"\
  JDBC 事务回滚成功\");\n                } else {\n                    // 向 Student 表插入第二个记录时发生异常\n\
  \                    // 我们可以通过回滚到保存点来忽略它\n                    conn.rollback(svpt);\n\
  \                    System.out.println(\"JDBC 事务回滚到保存点\");\n                  \
  \  // 现在提交\n                    conn.commit();\n                }\n            }\
  \ catch (SQLException e1) {\n                System.out.println(\"回滚时的 SQLException\"\
  \ + e1.getMessage());\n            }\n            e.printStackTrace();\n       \
  \ }\n    }\n}\n```\n\n在这里，代码在事务中执行了三条插入语句。在第一条语句之后创建一个保存点。如果在第二或第三条语句执行期间发生任何异常，将被\
  \ catch 块捕获，并回滚到保存点，仅提交第一条语句。如果所有语句都执行成功，表将更新新记录。\n\n## 10.18 RowSet 接口\n\n\n\n\n\
  \n`RowSet` 接口是 `javax.sql` 包的扩展，派生自 `ResultSet` 接口。与 `ResultSet` 类似，`RowSet` 也包含来自表格化数据源的一组行。`RowSet`\
  \ 中的字段/属性可以通过相应的 getter 和 setter 方法进行操作。\n\n`RowSet` 事件模型允许将通知发送到所有实现了 `RowSetListener`\
  \ 接口并注册了监听 `RowSet` 对象事件（如更新、删除等）的组件。\n\n以下是 `RowSet` 对象和 `ResultSet` 对象之间的一些比较点：\n\
  \n* 某些供应商未在 DBMS 或驱动程序中提供可滚动/可更新的结果集支持。相反，`RowSet` 对象为任何类型的 DBMS 或驱动程序提供了可滚动性和可更新性。\n\
  * 由于 `RowSet` 对象类似于一个 JavaBeans 组件，因此它可以被用于通知其他已注册的 GUI 组件发生了变化。\n\n### `RowSet`\
  \ 对象的特征：\n\n* 游标可以移动到特定行。\n* 允许使用 Java 命令代替 SQL。\n\n### 10.18.1 RowSets 的类型\n\n\
  根据与数据库连接的持续时间，RowSets 广泛分为已断开和已连接。下面将进行讨论：\n\n* **已断开 RowSet (Disconnected RowSet)**：`RowSet`\
  \ 对象仅连接到数据源以从 `ResultSet` 读取或写入数据。一旦完成读/写操作，`RowSet` 对象就会与数据源断开。\n* **已连接 RowSet\
  \ (Connected RowSet)**：`RowSet` 对象通过 JDBC 驱动连接到关系型数据库，并在 `RowSet` 对象的生命周期内保持连接。\n\
  \n以下是 `RowSet` 接口的重要子接口：\n\n* `JdbcRowSet`\n* `CachedRowSet`\n* `WebRowSet`\n* `JoinRowSet`\n\
  * `FilteredRowSet`\n\n`[图 10.38]` 显示了 `RowSet` 层次结构：\n\n![](img/Figure_10.38.jpg)\n\
  \n图 10.38：RowSet 层次结构\n\n自 JDK 7 起引入 `javax.sql.rowset` 包的 `RowSetFactory` 和 `RowSetProvider`\
  \ 接口允许创建不同的 `RowSet` 实现：\n\n```\nRowSetFactory rowsetFactory = RowSetProvider.newFactory();\n\
  ```\n\n以下是 `RowSetFactory` 接口创建各种 `RowSet` 实现的方法：\n\n* `createJdbcRowSet()`\n* `createCachedRowSet()`\n\
  * `createWebRowSet()`\n* `createJoinRowSet()`\n* `createFilteredRowSet()`\n\n###\
  \ 10.18.2 已连接 RowSets\n\n唯一的已连接 `RowSet` 实现是 `JdbcRowSet`。它提供了几种连接到数据库的方法，并允许将不可滚只读的\
  \ `ResultSet` 转换为可滚动且可更新的对象。\n\n以下是 `JdbcRowSet` 接口的一些重要方法：\n\n* `setUserName(String\
  \ user)`：将用户名设置为指定值。\n* `setPassword(String pass)`：将数据库密码设置为指定值。\n* `setURL(String\
  \ url)`：将 URL 设置为指定值以建立连接。\n* `setCommand(String sql)`：将命令属性设置为给定的 SQL 查询。\n* `execute()`：使用\
  \ `RowSet` 对象的属性建立到数据库的连接。它执行命令属性中设置的查询，并将结果结果集对象中的数据读取到行集对象中。\n* `commit()`：持久化自上一次\
  \ commit/rollback 调用以来所做的所有更改。释放 `RowSet` 对象封装的连接对象当前持有的所有数据库锁。\n* `rollback()`：撤销当前事务中执行的所有更改。释放\
  \ `RowSet` 对象包含的连接对象所持有的任何数据库锁。\n\n`JdbcRowSet` 接口的标准实现是 `JdbcRowSetImpl` 类。\n\n\
  ```\nJdbcRowSet jrs = new JdbcRowSetImpl(rs);\n```\n\n以下是 `JdbcRowSetImpl` 类的构造函数：\n\
  \n* `JdbcRowSetImpl()`：创建一个默认的 `JdbcRowSet` 对象。\n* `JdbcRowSetImpl(Connection con)`：为有效连接创建一个默认的\
  \ `JdbcRowSet` 对象。该 `RowSet` 对象作为所创建的结果集对象的代理。\n* `JdbcRowSetImpl(String url, String\
  \ user, String password)`：创建一个带有指定 URL、用户名和密码的 `JdbcRowSet` 对象。\n* `JdbcRowSetImpl(java.sql.ResultSet\
  \ res)`：创建一个作为指定结果集对象封装的 `JdbcRowSet` 对象。\n\n| 注意：在 JDBC 驱动程序属性无效或数据库访问错误的情况下，所有构造函数都会抛出\
  \ `java.sql.SQLException` |\n\n以下是默认 `JdbcRowSet` 对象的一些特征：\n\n* 数据中不显示被删除的行。\n*\
  \ 驱动程序执行 `RowSet` 命令所需的时间没有限制。\n* `RowSet` 可能包含的行数没有限制。\n* `RowSet` 的列可能包含的字节数没有限制。\n\
  * 它具有可滚动游标，且不显示其他用户对数据库的更改。\n* 它不显示未提交的数据，因此消除了脏读问题。\n* 使用空的 `HashTable` 对象来存储设置的参数。\n\
  \n以下是创建 `JdbcRowSet` 对象的几种方法：\n\n* **使用默认构造函数**\n```\nJdbcRowSet jrs = new JdbcRowSetImpl();\n\
  jrs.setUsername(\"admin\");\njrs.setPassword(\"admin\");\njrs.setUrl(\"jdbc:protocol:datasourceName\"\
  );\njrs.setCommand(\"Select * from Student\");\njrs.execute();\n```\n使用了默认构造函数并设置了属性。\n\
  \n* **使用 ResultSet 对象**\n```\nStatement stmt = conn.createStatement();\nResultSet\
  \ rs = stmt.executeQuery(\"Select * from Student\");\nJdbcRowSet jrs = new JdbcRowSetImpl(rs);\n\
  ```\n通过 `Statement` 执行了查询并初始化了 `RowSet`。\n\n* **使用 RowSetFactory 接口**\n```\nRowSetFactory\
  \ rsFactory = RowSetProvider.newFactory();\nJdbcRowSet jrs = rsFactory.createJdbcRowSet();\n\
  jrs.setUrl(\"jdbc:driver-name...\");\njrs.setUsername(\"username\");\njrs.setPassword(\"\
  password\");\njrs.setCommand(\"select * from Student\");\njrs.execute();\n```\n\
  使用 `RowSetFactory` 实例创建了 `JdbcRowSet` 对象。\n\n以下是 `JdbcRowSetImpl` 类的一些重要方法：\n\n\
  * `absolute(int row)`：将游标移动到 RowSet 中的指定行。\n* `first()`：将游标移动到 `RowSet` 对象的第一行。\n\
  * `last()`：将游标移动到 `RowSet` 中的最后一行。\n* `beforeFirst()`：将游标移动到 `RowSet` 对象的第一行之前。\n\
  * `afterLast()`：将游标移动到 `RowSet` 对象在最后一行之后。\n* `isFirst()`：如果游标在 `RowSet` 的第一行，则返回\
  \ true。\n* `isLast()`：如果游标在 `RowSet` 的最后一行，则返回 true。\n* `isBeforeFirst()`：如果游标在\
  \ `RowSet` 的第一行之前，则返回 true。\n* `isAfterLast()`：如果游标在 `RowSet` 的最后一行之后，则返回 true。\n\
  * `insertRow()`：将插入行的内容插入 `RowSet` 以及数据库中。向所有监听器发送行已更改的通知。\n* `updateRow()`：用 `RowSet`\
  \ 当前行的新内容更新数据库。向所有监听器发送行已更改的通知。\n* `deleteRow()`：从 `RowSet` 对象以及数据库中删除当前行。向所有监听器发送行已更改的通知。\n\
  * `previous()`：将游标移动到 `RowSet` 中当前行之前的上一行。\n* `next()`：将游标移动到 `RowSet` 中当前行之后的下一行。\n\
  \n\n\n\n* `moveToCurrentRow()`: 将光标移动到记录的位置。主要用于在 `RowSet` 对象中插入新行时。\n* `moveToInsertRow()`:\
  \ 将光标移动到 `RowSet` 对象的插入行。\n* `updateInt(int column, int i)`: 使用给定的 `int` 值更新指定的列。\n\
  * `updateString(int column, String str)`: 使用给定的字符串值更新指定的列。\n* `updateDate(int column,\
  \ java.sql.Date date)`: 使用参数中提供的日期值更新指定的列。\n\n以下代码演示了如何使用 `JdbcRowSet` 对象插入数据：\n\
  \n```java\nimport com.sun.rowset.JdbcRowSetImpl;\nimport java.sql.Connection;\n\
  import java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.Statement;\n\
  import javax.sql.rowset.JdbcRowSet;\n\npublic class JdbcRowSetExample {\n\n    public\
  \ static Statement stmt;\n    public static Connection conn;\n\n    public static\
  \ void main(String[] args) {\n        try {\n            String dbURL = \"jdbc:sqlserver://SQLS:1433;\
  \ databaseName=MyDB;integratedSecurity=true;\";\n            conn = DriverManager.getConnection(dbURL);\n\
  \            Statement stmt = conn.createStatement(ResultSet.TYPE_SCROLL_SENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n            ResultSet rs = stmt.executeQuery(\"\
  Select * from Student\");\n            JdbcRowSet jrs = new JdbcRowSetImpl(rs);\n\
  \n            // insert row using JdbcRowSet\n            jrs.moveToInsertRow();\n\
  \            jrs.updateInt(\"StudId\", 17);\n            jrs.updateString(\"StudName\"\
  , \"Rosie\");\n            jrs.updateFloat(\"Percentage\", 77.4f);\n           \
  \ jrs.insertRow();\n        } catch (Exception e) {\n            System.out.println(e.getMessage());\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n新行将被插入到表中。同样，可以像所示所示更新和删除行：\n\
  \n```java\n// update row using JdbcRowSet\njrs.absolute(3); // jump to row 3 in\
  \ the RowSet\njrs.updateFloat(3, 67.5f); //update percentage (column number 3) of\
  \ student in row 3\njrs.updateFloat(\"Percentage\", 77.5f); //update percentage\
  \ of student in row 3\njrs.updateRow();\n\n// delete row using JdbcRowSet\njrs.last();\n\
  jrs.deleteRow();\n```\n\n## 10.18.3 断开型 RowSets (Disconnected RowSets)\n\n由于低带宽网络和资源限制，数据库连接可能会中断。在这种情况下，断开型\
  \ `RowSet` 非常有用，因为它不需要与数据库保持连接，并且可以离线操作。断开型 `RowSet` 对存储在内存/缓存中的数据操作，而不是直接操作数据库。断开型\
  \ `RowSet` 的示例是 `CachedRowSet`。所有其他断开型 `RowSets` 都派自 `CachedRowSet`。它可以向关系型数据库读取/存储数据，也可以指向具有键列的任何表格格式数据源。\n\
  \n除了 `JdbcRowSet` 的功能外，它可以在断开状态下对数据进行操作。在内部，它使用读取器和写入器对象通过 `SyncProvider` 实现对数据源执行读/写操作。以下是创建\
  \ `CachedRowSet` 对象的方法：\n\n* 使用默认构造函数\n  ```java\n  CachedRowSet crs = new CachedRowSetImpl();\n\
  \  ```\n  `CachedRowSetImpl` 类是 `CachedRowSet` 接口的标准实现。在这里，默认的 `SyncProvider` 通过\
  \ `CachedRowSetImpl` 默认构造函数传递给 `CachedRowSet` 实例：\n  ```java\n  crs.setUsername(\"\
  admin\");\n  crs.setPassword(\"admin\");\n  crs.setUrl(\"jdbc:protocolName:datasourceName\"\
  );\n  crs.setCommand(\"Select * from Student\");\n  crs.execute();\n  ```\n  设置了用户名、密码、URL\
  \ 和命令属性，并调用 `execute()` 方法来处理命令。\n\n* 使用 `SyncProvider` 实现\n  ```java\n  CachedRowSet\
  \ crs = new CachedRowSetImpl(com.myJava.providers.HighAvailabilityProvider);\n \
  \ ```\n  `SyncProvider` 实现的全限定名作为参数传递给 `CachedRowSetImpl` 构造函数。使用适当的 setter 方法配合命令设置连接属性：\n\
  \  ```java\n  crs.setCommand(\"select * from STUDENT\");\n  ```\n  在更新的情况下，必须设置键列。例如：\n\
  \  ```java\n  int[] keys = {2, 3};\n  crsStudent.setKeyColumns(keys);\n  ```\n \
  \ 调用 `execute()` 方法后，必须将断开型 `RowSet` 对象中的更改保存到数据源。这通过调用 `CachedRowSet` 对象上的 `acceptChanges()`\
  \ 方法来实现。\n\n`CachedRowSet` 对象是可滚动和可更新的。它使用 `next()`、`previous()`、`last()`、`absolute()`\
  \ 和 `first()` 等方法向前或向后移动。\n\n以下演示展示了 `CachedRowSet` 的用法：\n\n```java\nimport com.sun.rowset.CachedRowSetImpl;\n\
  import javax.sql.rowset.CachedRowSet;\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
  \npublic class CachedRowSetDemo {\n    // ... (代码部分保持不变)\n}\n```\n\n\n\n\n1. 哪种方法为新创建的线程对象分配系统资源？\n\
