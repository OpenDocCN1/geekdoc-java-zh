  \ JDK 9 的模块模型，并对 JDK 9 的功能进行了增强。JDK 10 并没有相比 JDK 9 带来任何重大变化或改进，但它是 Oracle 的六个月发布周期中的第一个版本。作为短期支持版本，JDK\
  \ 10 的公共更新六个月后结束。下一个版本 JDK 11 计划于 2018 年 9 月发布，并将是一个长期支持 (LTS) 版本。\n\n以下是 Java SE\
  \ 10 的新功能和增强：\n\n*   **应用程序类共享 (Application Data-Class Sharing)**：此 JDK 增强提案 (JEP)\
  \ 是现有 CDS 功能的扩展，允许将应用程序类存储到共享存档中以提高。\n*   **G1 的并行全 GC (Parallel full GC for G1)**：全\
  \ GC 改进了 F1 垃圾回收器的最坏延迟。\n*   **垃圾回收器接口 (Garbage collector interface)**：JDK 10 引入了垃圾回收器（GC）接口以提高不同垃圾回收器的源码隔离。\n\
  *   **将多个 JDK 仓库合并为单一仓库 (Combine the multiple JDK repositories into a single repository)**：此功能的引入是为了简化开发。\n\
  *   **局部变量类型推断 (Local-variable type inference)**：此增强允许将类型推断扩展到带有初始化器的局部变量声明。它还向\
  \ Java 引入了 `var`。\n*   **线程回调 (Thread callbacks)**：JDK 10 允许通过在线程上执行回调来停止单个线程，而不是停止所有线程或不停止。\n\
  *   **基于时间的发布版本 (Time-based release versioning)**：它为 Java SE 平台和 JDK 的版本方案引入了新的基于时间的发布版本。\n\
  *   **其他特性**：几个其他高级特性包括：\n\n    *   JDK 中默认的根证书机构 (CA) 证书集。\n    *   允许在用户指定的替代内存设备上启用堆分配。\n\
  \    *   在 Linux/x64 平台上使用基于 Java 的 JIT 编译器 Graal 作为实验性 JIT 编译器。\n    *   增强 java.util.Locale\
  \ 及相关 API 以实现 Unicode 扩展。\n\n### 1.7 下载并安装 JDK 8 和 JDK 10\n\n为了理解旧 JAR 基于和新模块基于\
  \ JDK 的区别，请从 Oracle 官方下载页面并安装 Windows 版的 JDK 8 和 JDK 10。\n\n\n\n\n\nJDK 8 下载页面如下截图所示：\n\
