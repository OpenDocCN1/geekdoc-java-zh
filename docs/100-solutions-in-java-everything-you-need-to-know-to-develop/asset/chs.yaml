  \            String dbURL = \"jdbc:sqlserver://SQLS:1433; databaseName=MyDB;integratedSecurity=true;\"\
  ;\n            conn = DriverManager.getConnection(dbURL);\n            conn.setAutoCommit(false);\n\
  \            PreparedStatement pst = conn.prepareStatement(\"INSERT INTO Student\
  \ VALUES (?,?,?)\");\n            // set the parameter values\n            pst.setInt(1,\
  \ 10);\n            pst.setString(2, \"Michael\");\n            pst.setFloat(3,\
  \ 78f);\n            pst.addBatch();\n            pst.setInt(1, 11);\n         \
  \   pst.setString(2, \"Cooper\");\n            pst.setFloat(3, 66.6f);\n       \
  \     pst.addBatch();\n            int[] updateCount = pst.executeBatch();\n   \
  \         for (int i = 0; i <updateCount.length; i++) {\n                System.out.println(\"\
  Update count for statement \"+ (i+1) +\" is \"+ updateCount[i]);\n            }\n\
  \            conn.commit();\n            conn.setAutoCommit(true);\n           \
  \ pst.clearBatch();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
