  \ JVM。它还包含开发、执行、测试、调试和文档 Java 应用所需的工具和程序。 |\n| conf | 配置文件 | 这些文件包含用户可配置的选项，可以通过编辑来配置安全算法、修改访问权限并设置\
  \ Java 密码扩展 (JCE) 策略文件以限制 JDK 的加密强度。 |\n| include | C 头文件 | 包含支持使用 JNI 和 JVM 调试器接口进行\
  \ C 语言原生代码编程的头文件。 |\n| jmods | 编译后的 Java 模块 | 包含供 `jlink` 创建自定义运行时使用的编译 Java 模块。\
  \ |\n| legal | 版权和许可文件 | 包含每个模块的许可和版权文件，以及以 `.md` (markdown) 文件形式呈现的第三方公告。 |\n|\
  \ lib | 附加库 | 包含 JDK 运行所需的额外类库和支持文件。这些不能在外部使用。 |\n\n表 1.3: JDK 10 安装目录内容\n\n## 1.8\
  \ 设置 JDK 路径](#contents.xhtml_sc2_12a)\n\n为了使用 JDK，必须在名为 `PATH` 的系统环境变量中设置 `bin`\
  \ 文件夹的路径。`PATH` 变量指向可执行文件（`javac.exe` 和 `java.exe`），以便可以在任何目录下执行这些命令，而无需指定完整路径。\n\
  \n要在命令行窗口中设置 `PATH` 变量，请输入以下命令：\n\n```cmd\nC:\\>set path=<drivename>:<installation_folder>\\\
  bin\n```\n\n例如：\n\n```cmd\nC:\\>set path=C:\\Program Files\\Java\\jdk1.8.0_45\\\
  bin\n```\n\n同样，设置 JDK 10 版本的 `bin` 目录路径。\n\n要在系统（Windows 10）上永久设置 `PATH` 变量，请按照以下步骤操作：\n\
  \n右键点击此电脑 | 属性 | 高级系统设置 | 高级选项卡 | 点击环境变量：\n\n![](img/Figure_1.13.jpg)\n\n图 1.13:\
  \ 设置 PATH 环境变量\n\n1. 在“系统变量”部分，选择 `PATH` 变量并点击“编辑”按钮进入 JDK 安装路径。\n2. 点击“新建”输入 `bin`\
  \ 文件夹的路径：\n3. `C:\\Program Files\\Java\\jdk1.8.0_45\\bin`\n4. 点击“确定”保存更改。\n\n同样，JDK\
  \ 10 版本的 `bin` 目录路径也可以永久设置在环境变量中。\n\n## 1.9 Java 应用开发](#contents.xhtml_sc2_13a)\n\
  \n即使在发布二十年后，Java 的流行依然在上升。Java 在不同领域仍然是选择语言，并继续快速发展。Java 语言可用于开发应用程序，包括：\n\n* 控制台和窗口桌面应用\n\
  * 使用 Servlets、Java Server Pages (JSP)、Java Server Faces (JSF) 等组件的 Web 应用，它们在浏览器中运行。\n\
  * 使用 Enterprise JavaBeans (EJB) 组件的企业级应用用于分布式计算。\n* 用于托管和部署 Web 及企业应用的 Web 服务器和应用服务器。\n\
  * 为手机等小型设备创建的应用。\n* 用于电子设备的嵌入软件。\n* 涉及科学计算和数学运算的科学应用。例如，MATLAB 等应用使用 Java 作为交互界面以及核心系统的一部分。\n\
  \n应用程序可以使用简单的文本编辑器（例如记事本）或使用集成开发环境 (IDE)来创建，IDE 为 Java 应用开发提供了编辑器、编译器、调试器等必要工具。流行的\
  \ IDE 包括 NetBeans、Eclipse、IntelliJ 以及用于移动应用的 Android Studio 等。\n\n\n\n\n\n### Java\
  \ 语言基础\n\n-   包语句（package statement）：Java 中的包类似于命名空间，用于存储具有相似功能的类。`package` 关键字用于指示后续文本是该类所属的包的名称。在\
  \ Java 中，类始终位于一个包中。如果没有指定包，则该类属于默认包。内置包的示例有 `java.swing`、`java.io` 等。与 GUI 相关的类存储在\
  \ `java.swing` 包中，与输入/输出功能相关的类存储在 `java.io` 包中，以此此类推。\n\n-   导入语句（import statement）：`import`\
  \ 语句用于在 Java 类中引入外部包和类。为了使用来自另一个包的类，必须使用 `import` 关键字对其进行导入。然而，某些包在 Java 程序中是默认包含的，即\
  \ `java.lang`。使用这些包中的类时不需要显式导入。此外，不需要导入同一个包中的类，也不需要导入使用全限定名调用的类。例如，`java.io.File\
  \ f1 = new java.io.File(\"myfile\");`。\n\n-   类声明语句（class declaration statement）：Java\
  \ 类声明通过 `class` 关键字后跟类名来标识。`public` 关键字的使用表示类对包内部和外部其他类的可见性。\n\n-   变量（Variables）：Java\
  \ 程序中的变量代表实体的属性，也被称为字段（fields）。实例变量是指那些类的实例或对象拥有该变量私有拷贝的变量。\n\n-   方法（Methods）：Java\
  \ 程序中的方法代表对象在数据上执行的行为或功能。实例方法可以通过创建类的对象来调用。\n\n-   构造函数（Constructors）：Java 程序中的构造函数是特殊方法，其名称与类名相同。它们在创建对象期间被调用，通常用于初始化类的数据成员。\n\
  \n要要创建一个 Java 程序，可以使用任何文本编辑器（如记事本）。创建 Java 程序的基本步骤如下：\n\n1. 创建一个类并以 `.java` 扩展名保存它。\n\
  2. 编译 `.java` 文件。\n3. 构建并执行 Java 程序。\n\n下面的代码演示了一个简单的 Java Hello World 程序。它是在 Windows\
  \ 操作系统系统的记事本编辑器中编写的：\n\n```java\npublic class Hello {\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n类声明由访问修饰符、`class`\
  \ 关键字、类名以及大括号 `{ }` 组成。Java 是一种强封装的语言；因此，任何内容不能放在类之外。在示例中，类名是 `Hello`。类内部是 `main()`\
  \ 方法，它是程序的入口，也就是说每个 Java 程序的执行都是通过调用 `main()` 方法开始的。\n\n#### 语法：\n```java\npublic\
  \ static void main(String[] args) {\n    // 代码语句\n}\n```\n\n下面是程序中重要关键字的简要描述：\n\n\
  -   `public`：允许 JVM 访问 `main()` 方法。\n-   `static`：允许在不创建实例的情况下访问类的方法。\n-   `void`：表示\
  \ `main()` 方法返回的数据类型。数据类型 `void` 表示该方法不返回任何值。\n-   `args`：存储在命令行传递的参数的字符串数组。\n\n\
  | 注意：`String` 类是 Java 内置的类和数据类型，允许变量存储一组字符。 |\n\n在 `main()` 方法中，通过使用 `System.out.println()`\
  \ 语句指定程序的实际功能。\n\n`println()` 方法接收一个 `String` 参数并将其显示在控制台上。`System` 类是 Java 中预定义的类，允许访问控制台等系统资源。关键字\
  \ `out` 代表连接到控制台的输出流。\n\n将文件保存为 `Hello.java`。要保存 `Hello.java` 程序，点击记事本中的“文件 | 另存为”，并在文件名框中输入\
  \ `Hello.java`。引号可以避免将文件保存为扩展名为 `HelloWorld.java.txt`。\n\n## 1.11 Java 代码编译与执行\n\
  \n带有 `.java` 扩展名的 Java 程序通过 `javac` 编译器转换为带有 `.class` 扩展名的字节码文件。生成的 `.class` 文件可以在具有相应\
  \ JVM 的平台上执行，如下图所示：\n\n![](img/Figure_1.15.jpg)\n图 1.15: Java 代码编译\n\n下图显示了在代码执行期间\
  \ JRE 的任务：\n\n![](img/Figure_1.16.jpg)\n图 1.16: Java 代码执行\n\n编译器生成的 `.class` 文件不依赖于目标系统的硬件或软件平台。包含主类的\
  \ `.class` 文件被传递给 JVM。在 JVM 内部，文件通过以下某些组件：\n\n-   类加载器（Class loader）：一旦主类被 JVM 加载到内存中，程序中引用的其他类通过类加载器加载。\n\
  -   字节码验证器（Bytecode verifier）：字节码验证器检查已加载类的字节码是否存在任何损坏的指令。字节码验证器执行的检查包括：\n    -\
  \   使用前的变量初始化。\n    -   方法调用和对象引用类型应当匹配。\n    -   没有违反访问私有数据和方法的规则。\n    -   对局部变量的访问在运行时栈范围内。\n\
  \n如果上述检查任何一个失败，验证器将不允许类加载。接下来，字节码由解释器执行。\n\n-   即时编译（JIT）编译器：从 Java 2.0 开始，在运行时包含了\
  \ JIT 编译器以提高速度。JIT 编译的工作是将字节码转换为本地代码或特定于平台的代码。\n\n## 1.12 使用 JDK 8 创建并执行 Java 程序\n\
  \n在 JDK 8 及之前的版本中，使用内置的 `javac` 编译源文件 `Hello.java`，如截图所示：\n\n![](img/Figure_1.17.png)\n\
  图 1.17: 使用 javac 编译 Java 代码\n\n首先，进入保存 `Hello.java` 文件的文件夹，然后执行 `javac` 命令。命令将在当前目录下生成一个名为\
  \ `Hello.class` 的文件并在运行时使用。\n\n| 注意：路径已设置为 JDK 8 版本的 bin 文件夹。 |\n\n在当前目录使用 `dir`\
  \ 命令查看 `javac` 命令生成的 `.class` 文件，如下：\n\n![](img/Figure_1.18.jpg)\n图 1.18: 生成字节码\
  \ Hello.class\n\n下表列出了 `javac` 命令可以使用的一些选项：\n\n| 选项 | 说明 |\n| --- | --- |\n| `-classpath`\
  \ | 指定导入类的位置并覆盖 `CLASSPATH` 环境变量的设置。 |\n| `-d` | 用于指定 javac 编译器生成的类的目标目录。例如，`javac\
  \ -d F:\\ Hello.java` 将 F 盘生成并保存 `Hello.class` 文件。 |\n| `-g` | 用于打印所有的调试信息，而不是默认的行号和文件名。\
  \ |\n| `-verbose` | 在编译类时实时显示消息。 |\n| `-version` | 显示版本信息。 |\n| `-sourcepath` |\
  \ 指定输入源文件的位置。 |\n| `-help` | 显示用法的标准选项列表。 |\n\n表 1.4：javac 命令选项\n\n`.class` 文件使得\
  \ Java 代码能够实现“编写一次，到处运行”。现在使用 Java 解释器程序 `java.exe` 来解释并将字节码转换为机器码以执行程序。`java` 命令接收类文件名作为参数进行执行。\n\
  \n\n\n\n\n以下截图显示了使用 `java` 命令执行 `Hello.class` 文件的过程：\n\n![](img/Figure_1.19.jpg)\n\
  \n图 1.19：使用 `java` 命令执行 Java 代码\n\n下表列出了 `java` 命令可用的一些选项：\n\n| 选项 | 说明 |\n| :---\
  \ | :--- |\n| `classpath` | 指明导入类的位置，并覆盖 `CLASSPATH` 环境变量的设置 |\n| `-v` 或 `-verbose`\
  \ | 用于显示关于每个加载的类和每个编译源文件的额外信息 |\n| `-version` | 显示版本信息并退出 |\n| `-jar` | 使用 `JAR`\
  \ 文件的名称而不是类文件 |\n| `-help` | 显示帮助信息并退出 |\n| `-X` | 显示非标准选项信息并退出 |\n\n表 1.5：`java`\
  \ 命令的选项\n\n### [1.13] 使用 JDK 10 创建并执行 Java 程序\n\n在 `JDK` 8 之前，开发者通常使用 `src/main/java`\
  \ 目录结构作为源目录。例如，主类文件 `Hello.java` 通常存在于包 `com.pkg1.app` 中，整体路径为 `src/main/java/com/pkg1/app/Hello.java`。到目前为止这是组织代码传统模式。然而，从\
  \ `Java SE 9` 开始引入新的 `JPMS` 特性后，代码的结构化和编写模式被修改了。\n\n`Java 9` 模块是代码数据的自描述集合。它可以包含多个包，这些包反过来可能包含一个或多个类、接口等。模块还可能包含资源文件、属性文件等。要创建一个完整的应用程序，需要集成这样一个模块的集合。每个模块都是具有更大部分结构的构建块。简而言之，现在不再是创建一个巨大的\
  \ Java 项目，而是可以创建多个模块化的功能单元，这些单元可以集成在一起形成一个应用程序，并且也可以重用用于其他应用程序。\n\n在 `JDK 10` 中创建并执行\
  \ Java 程序，请执行以下步骤：\n\n1. 创建一个具有唯一名称的模块，例如 `moduleone`。\n2. 为模块创建一个根文件夹——每个模块都需要执行此操作。模块根文件夹的名称应与模块相同。因此，在这种情况下，模块的根文件夹将是\
  \ `moduleone`。\n3. 将模块代码添加到模块根文件夹内部。从模块根文件夹开始创建包。例如，在模块文件夹 `moduleone` 内部创建包层级 `mypkg\\\
  util`，并在 `com.mypkg.util` 包中添加类 `Hello.java`。在这种情况下，文件夹结构如下所示：\n\n![](img/Figure_1.20.jpg)\n\
  \n图 1.20：Java 应用程序的模块化结构\n\n在 `JDK 8` 之前，包直接存储在源文件夹下，而从 `JDK 9` 开始，包现在存储在模块根文件夹下。从模块根文件夹开始，结构与之前的版本相同。\n\
  \n#### Java SE 8 及更早版本的步骤如下所示：\n\n1. 创建一个或多个源文件夹。\n2. 在源文件夹中，创建与包名匹配的包文件夹。\n3. 将\
  \ `.java` 源文件放在相应的包文件夹中。\n\n#### Java SE 9 及更高版本的步骤如下所示：\n\n1. 创建一个或多个源文件夹。\n2.\
  \ 在每个源文件夹中，为每个模块创建一个模块文件夹。\n3. 在模块文件夹中，创建与包名匹配的包文件夹。\n4. 将 `.java` 源文件放在相应的包文件夹中。\n\
  \n创建一个模块描述符文件，其中包含模块的元数据，即它、导出和依赖项。将文件直接保存在模块根文件夹中，命名为 `module-info.java`。例如，模块\
  \ `moduleone` 的模块描述符所示：\n\n```java\nmodule moduleone {\n  // module exports and\
  \ dependencies\n}\n```\n\n文件以关键字 `module` 开头，表示后续文本是模块名称。模块名称应与模块根文件夹的名称相同。在括号内，指定了模块的依赖和导出。\n\
  \n带有模块描述符的最终文件夹结构如下所示：\n\n![](img/Figure_1.21.jpg)\n\n图 1.21：Java 模块的模块描述符\n\n注意，模块描述符文件是一个\
  \ `.java` 文件，但它并不遵循 Java 语言的类命名规范。也就是说，Java 类型名称不允许连字符（`-`）。此外，`.java` 文件的名称应与文件中声明的公共类型名称匹配，这在模块描述符名称中没有被遵守。这类似于自\
  \ `Java 1.5` 以来在 `Java` 中使用的 `package-info.java` 文件，尽管没有广泛使用。这些文件被故意赋予了无效的 Java\
  \ 类型名称，以指示它们的特殊用途并将它们与应用程序中的其他 Java 文件区分开。\n\n以下是 `Hello.java` 源文件和 `module-info.java`\
  \ 模块描述符的代码：\n\n```java\n//Hello.java\npackage mypkg.util;\n\npublic class Hello\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Hello World!\");\n    }\n}\n\n// module-info.java\nmodule moduleone {\n}\n```\n\n\
  以下截图显示了使用 `JDK 10` 编译和执行 `Hello.java`文件的过程：\n\n![](img/Figure_1.22.jpg)\n\n图 1.22：使用\
  \ JDK 10 编译并执行 Java 代码\n\n\n\n\n\n### 3. 安装完成后，启动 NetBeans 8.1 并按图所示点击 `File | New\
  \ Project`：\n\n![](img/Figure_1.25.jpg)\n\n图 1.25：在 NetBeans 8.1 中创建新项目\n\n将打开“新建项目”窗口。\n\
  \n### 4. 从 Categories（类别）面板中选择 `Java`，并在 Projects（项目）面板中选择 `Java Application`，如下所示：\n\
  \n![](img/Figure_1.26.jpg)\n\n图 1.26：新项目对话框\n\n### 5. 点击 Next（下一步）。\n\n### 6. 在\
  \ Name and Location（名称和位置）屏幕中，指定名称、保存位置以及主类文件的名称，如下所示：\n\n![](img/Figure_1.27.jpg)\n\
  \n图 1.27：新建 Java 对话框\n\n默认情况下，它将应用程序的名称作为包名和主类文件名称。可以根据需要进行更改。\n\n### 7. 点击 Finish（完成）。这将创建一个新项目，其文件夹层次结构和主类文件如下所示：\n\
