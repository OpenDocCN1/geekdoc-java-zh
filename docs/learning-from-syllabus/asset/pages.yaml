  md: 'Very few who lived through those times would have thought that only a few later
    most user-driven services would be acquired by a small number of successful companies
    and not be shut down. Or, that Google would decide not to include the biggest
    hashtag-driven platform, into its search index and the search results on its first
    page would only come from a handful of suspects: media conglomerates, Wikipedia,
    Facebook, LinkedIn, Amazon, Reddit, Qora. Or, that Twitter would become the main
    channel for the racist, misogynist, fascist escapades of the President of United
    States.


    This internet naivety—stoked by an equally enthusiastic, venture-capital-backed
    startup culture—was not just naivety. This was also a period of massive experimental
    use of these emerging platforms. Furthermore, this world would merit to be revisited
    and researched. In this text, however, we can only hint to this: contextualize
    how the hashtag as the user-driven web lost still succeed in propagating political
    mobilizations in the network environment. Some will say that this propagation
    is nothing but reflection of the internet as a propaganda machine, and there''s
    no denying that hashtags serve as a propaganda function. However, it equally matters
    that hashtags retain the capacity to shape coordination and self-organization,
    and are therefore a reflection of the internet as an organization machine.


    As mentioned, #Syllabus as a media object is an ordered list of links to resources.
    In the long history of knowledge retrieval systems and attempts to help users
    find information from big archives, the internet in the tradition of the card
    catalog in libraries, charts in the music industry, and mixtapes in popular culture,
    helping people tell their stories of what is relevant and what isn''t through
    an ordered sequence of items. The list (as a format) with the hashtag find themselves
    in the list (pun intended) of the most iconic media objects of the internet. In
    the network media environment, being smart in creating new lists became the way
    to displace old lists of relevance, the way to dismantle cantons, the way to learn.
    The way to become relevant.


    # The Academic Syllabus Migrates Online


    #Syllabus interventions are a challenge issued by political struggles to educators
    as they expose a fundamental contradiction in the operations of academia. While
    critical pedagogies of yesteryear''s social movements become integrated into the
    education system, the radical lessons that these pedagogies teach students don''t
    easily reconcile with experience: professional practice courses, the rhetoric
    of employability and community internships, what they learn is merely instrumental,
    leaves them wondering how on earth they are to apply their Marxism or freedom
    to their everyday life?


    Cognitive dissonance is at the basis of degrees in the liberal arts. And to make
    worse, the marketization of higher education, the growing fees and the privatization
    of research has placed universities in a position where they are increasingly
    struggle to provide institutional space for critical interventions in social reality.
    As universities become more dependent on the ''customer satisfaction'' of their
    students for survival, they steer away from heated political topics or from supporting
    faculty members who might decide to engage with them. Borrowing the words of Stefano
    Harney and Fred Moten,'
