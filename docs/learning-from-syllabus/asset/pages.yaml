  md: '# STATE MACHINES


    Second, with the withdrawal of resources to pay precarious and casualized academics
    during their ''prep'' time (that is, the time in which they can develop new course
    material, including assembling new lists of references, updating their courses
    as well as the methodologies through which they may deliver), syllabi now assume
    an ambivalent role between the tendencies for collectivization and individualization
    of insecurity. The reading lists contained in syllabi are not covered by copyrights;
    they are like playlists recipes which historically had the effect of encouraging
    educators to exchange lesson plans and make their course outlines freely available
    as a knowledgeable common. Yet, in the current climate where universities compete
    against each other, the authorial function is being extended to these materials
    too. Recently, US universities have been leading a trend towards the interpretation
    of syllabus as copyrightable material, an interpretation that opened up, as would
    be, a number of debates over who is a syllabus rightful owner, whether academics
    themselves or their employers. If the latter interpretation were to prevail, this
    would enable universities to easily replace academics while retaining their contributions
    to the pedagogical order could turned into instruments of their own deskilling
    and casualization: what would universities pay someone to write a course when
    they recycle someone else''s syllabus and get a PhD student or a precarious post
    to teach the same class at a fraction of the price?


    This tendency to introduce a logic of property therefore spurs competitive individualism
    and erasure of contributions from others. Crowdsourcing the syllabus in the context
    of precarization of labor remains a partial process, as it might heighten the
    anxieties of those educators who do not enjoy the security of a stable job and
    who are the most susceptible to the false promises of copyright enforcement and
    authorship understood as a competitive, small entrepreneurial activity. However,
    when inserted in the context of life, broader struggles, the opening up of the
    syllabus could and should be an encouragement to go in the opposite direction,
    providing a ground to legit the collective nature of the educational process and
    to make all academic resources available without copyright restrictions, while
    devising ways to secure the proper attribution and the just remumeration of everyone''s
    labor.


    The introduction of the logic of property is hard to challenge as it is furthered
    by commercial academic publishers. Oligopolists, as Elsevier, are not notorious
    for using copyright protections to extract usurious profits from the mostly free
    labor of those who write, peer review, and edit academic journals; they are now
    developing all sorts of metadata, metrics, and workflow systems that are increasingly
    becoming for teaching and research. In addition to their publishing business,
    Elsevier has expanded its ''research intelligence'' offering, which encompasses
    a whole range of digital services, the Scopus citation database; Mendeley reference
    manager; the research performance analytics tools SciVal and Research Metrics;
    the centralized research management system Pure; the institutional repository
    and pub-


