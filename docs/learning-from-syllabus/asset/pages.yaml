  md: '# LEARNING FROM #SYLLABUS


    VALERIA GRAZANO, MARCELL MARS, TOMISLAV MEDAK


    > The syllabus is the manifesto of the 21st century.

    Sean Dockray and Benjamin Forster


    # #Syllabus Struggles


    In August 2014, Michael Brown, an 18-year-old boy living in Ferguson, Missouri,
    was fatally shot by police officer Darren Wilson. Soon after, the civil protests
    denouncing police brutality and institutional racism began to mount across the
    United States, Dr. Marcia Chatelain, Associate Professor of History and African
    American Studies at Georgetown University, launched an online call urging other
    academics and teachers ‘to devote the first day of classes to a conversation with
    Ferguson and ‘to recommend texts, collaborate on conversation starters, and inspire
    dialogue about some aspect of the Ferguson crisis.¹² Chatel did so using the hashtag
    #FergusonSyllabus.


    Also in August 2014, using the hashtag #gamergate, groups of users on 4Chan, Twitter,
    and Reddit instigated a misogynistic harassment campaign against game developers
    Zoe Quinn and Brianna Wu, media critic Anita Sarkesian, as well as a number of
    other female and feminist game producers, journalists, and critics. In the following
    weeks, *The New Inquiry* editors and contributors compiling a reading list and
    issued a call for suggestions for their ‘TNI Syllabus: Gaming and Feminism.³


    In June 2015, Donald Trump announced his candidacy for President of the United
    States. In the weeks that he became the Republican nominee, and *The Chronicle
    of Higher Education* introduced the syllabus “Trump 101”⁴-History N.D. Connolly
    and Keisha N. Black, claim “Trump 101 inadequate, ‘a mock college syllabus’⁵[...]from
    a numerous omissions and inaccuracies’⁶ failing to include ‘contributions of scholars
    of color and address the critical issues of Trump’s racism, sexism, and xenophobia.’
    They assembled *Trump Syllabus 2.0*⁷ Soon after, in response to a video with which
    Trump engaged ‘an extremely low conversation about women’ with TV host Billy,
    Laura Cielokkowski put together a ‘R Culture Syllabus’⁸


