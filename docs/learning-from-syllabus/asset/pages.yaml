    # Learning from #Syllabus


    What we have learned from the #Syllabus phenomenon?


    The syllabus is the manifesto of the 21st century.


    Political struggles against structural discrimination, oppression, and violence
    in the

    present are continuing the legacy of critical pedagogies of earlier social movements

    that coupled the process of political subjectivation with that of collective education.
    students

    into the fold of their struggles. By creating effective pedagogical movements,
    movements have brought educators

    to the context of our new network environment,

    political struggles have produced a new media object: #Syllabus, a crowdsourced
    list

    of resources—historic and present—relevant to a case. By doing so, these struggles

    adapt, resist, and live in again the networks dominated by techno-capital, with

    all of the difficulties and contradictions that entails.


    What we have learned from the academic syllabus migrating online?


    In the contemporary university, critical pedagogy is clashing head-on with the
    digiti-

    z of higher education. Education that should empower and research that should

    emancipate are increasingly left in the cold due to the data-driven marketization

    of education, short-cutting the goals of teaching and research to satisfy the
    fluctuat-

    dands of market force and financial success. Resistance against the cap-

    tata, research workflows, and scholarship by means of digitalization is a key

    struggle for the future of mass intellectuality beyond exclusions of class, disability,

    gender, and race.


    What we have learned from #Syllabus as a media object?


    As old formats transform into new media objects, the digital network en-

    fines in which these new media objects try to adjust, resist, and live. A

    right intuition can intervene and change the landscape—not necessarily for the
    good,

    particularly if the imperatives of capital accumulation and social control prevail.

    we need to re-appropriate the process of production and distribution of #Syllabus

    as a media object in its totality. We need to build tools to collectively control
    the work-

    flows that are becoming the infrastructures on top of which we collaboratively
    produce

    knowledge that is vital for us to adjust, resist, and live. In order to successfully
    inter-\vene in the world, every aspect of production and distribution of these
    new media ob-

    jects becomes relevant. Every single aspect counts. The order of items in a list
    counts.

