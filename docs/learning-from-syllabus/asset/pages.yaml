- pgno: 8
  md: '# ACTIONS


    ‘policy posits curriculum study’,16 creating the paradoxical situation wherein
    today’s universities are places in which it is possible to do everything except
    study. Harney and Moten propose instead the re-appropriation of the diffuse practice
    of knowledge generation stems from the collective processes of self-organization
    and commenting. As Moten puts it: ‘When I talk about the way we use the people.,
    I think we are committed to the idea that what you do with other people.’17 And
    it is the practice of sharing a common repertoire–that Harvey call ‘rehearsal’18—that
    is truly constitutive of a crowdsourced #Syllabus.


    This contradiction and the tensions it brings to contemporary neoliberal academia
    can be symptomatically observed in the recent evolution of the traditional academic
    syllabus. As a consequence of (some) critical pedagogies incorporated into the
    teaching process and universities striving to reduce their liability, academia
    become increasingly complex and extensive documents. They are now understood as
    a ‘social contract’ between the teachers and their students, and ‘terms of service’19
    the institution providing educational services and the students increasingly framed
    as sovereign consumers making choices in the market of educational services. The
    growing official impact of the syllabus has had the effect that educators have
    to reflect on how the syllabus translates the power dynamics into their classroom.
    For instance, the critical pedagogy Adam Heidenberg-Bruno has demanded that the
    syllabus be reconceived as a manifesto20–a document making these concerns explicit.
    And indeed, many academics have started to experiment with the form and purpose
    of the syllabus, opening it up to a process of co-conceptualization with students,
    proposing ‘the other syllabus’21 to disrupt asymmetries.


    At the same times, universities are surprisingly moving their syllabus online.
    A migration that can be read as indicative of three larger shifts in academia.


    First, the push to make syllabus available online, in the US, reinforces the differential
    effects of reproduction economy. It is the Ivy League universities and their professorial
    system that harness the syllabus to advertise the identity of their scholarship,
    the underfunded public universities and junior academics are burdened with teaching
    the required expertise. This practice is tied in academia of the different valuation
    between what is considered to be labor of production (research) and that of social
    reproduction (teaching). The low esteem (and corresponding lower rewards and remuneration)
    for the kinds of intellectual labor that can be considered labors of care–editing
    journals, reviewing papers or marking, for instance—fits perfectly well with the
    entrenched legacies of the academic institution.


