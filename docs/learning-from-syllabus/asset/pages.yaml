    # #Syllabus in Historical Context: Social Movements and Self-Education


    When Professor Chatelain launched her for #FergusonSyllabus, she was mainly addressing
    a community of fellow educators:


    I know Ferguson would be a challenge for teachers: When schools opened across
    the country, how were they going to talk about what happened? My idea was simple,
    but resonated across the country: Reach out to the educators who use Twitter.
    Ask them to committing about Ferguson on the first day of classes. Suggest a book,
    an article, a film, a song, a piece of artwork, or an assignment that speaks to
    some aspect of Ferguson. Use the hashtag: #FergusonSyllabus.


    Her call had a much greater resonance than she had originally anticipated as it
    reached the limits of the academic community. #Syllabus had a significant impact
    in shaping the analysis and the response to the shooting of Michael Brown, and
    in inspiring the many other #Syllabus calls that followed.


    TheSyllabus phenomenon comprises different approaches and modes of operation.
    In some cases, the material is clearly claimed as the creation of an individual,
    as in the case of #BlackLivesMatterSyllabus, which is prefaced on the project''s
    landing page by a warning to readers ''material claimed in this syllabus should
    not be duplicated without proper citation and attribution.''¹⁰ A different position
    on intellectual property is embraced by #Syllabus interventions that have a more
    choosing manner. #StandingRockSyllabus, for instance, introduced as a crowd-sourced
    process and as a useful ‘tool’ to access research usually kept behind paywalls.¹¹⁹


    The different workflows, modes of engagement, and positioning in relation to intellectual
    property make #Syllabus readable as symptomatic of the multiplicity that composes
    social movements. There is something old school—quite literally—about the idea
    of calling a ‘syllabus’; certain quaintness, evoking thoughts of teachers and
    homework. This is worthy of investigation especially contrasted with the attention
    dedicated to other online cultural phenomena as much as a few feeds. Could it
    be that


