  md: '# ACTIONS


    In April 2016, members of the Standing Rock Sioux tribe established the Sacred
    Stone Camp started the protest against the Dakota Access Pipeline, the construction
    of which threatened the only water supply at the Standing Rock Reservation. The
    protest at the site of the pipeline became the largest gathering of native Americans
    in the last 100 years and earned significant international support for their ReZpect
    Our Water Campaign. As the struggle between protestors and the armed forces unfolded,
    a group of Indigenous scholars, activists, and supporters of the struggles of
    First Nations people and people of color, gathered under the name NYC Stands for
    Standing Rock Committee, put together #StandingRockSyllabus.


    The list of online syllabi created in response to political struggles has continued
    to grow, and present includes many examples:


    +   All Monuments Must Fall Syllabus

    #BlkwomensSyllabus

    #BLMSyllabus

    #BlackIslamamSyllabus

    #CharlestonSyllabus

    #ColinKaepernickSyllabus

    #ImmigrationSyllabus

    Puerto Rico Syllabus (#PRSYyllabus)

    #SayHerNameSyllabus

    Syllabus for White People to Educate People Writing about Tech

    Syllabus: Women and Gender Non-Conforming People Writing about

    #WakandaSyllabus

    What To Do Instead of Calling the Police: A Guide, A Syllabus, A Conversation,
    A Process

    #YourBaltimoreSyllabus


    It would be to compile a comprehensive list of all the online syllabi that have
    been created by social justice movements in the last five years, especially but
    not exclusively, those initiated in North America in the context of feminist and
    anti-racist activism. What is now widely spread phenomenon, these political struggles
    use social networks and resort to the hashtag template #_Syllabus to issue calls
    for the bottom-up aggregation of resources necessary for political analysis and
    pedagogy centering on their concerns. For this reason, we will call this phenomenon
    #Syllabus.


    During the same years that saw the spread of the #Syllabus phenomenon, university
    course syll have also been transitioning online, often in a top-down process initiated
    by academic institutions, which has seen the syllabus a contested document in
    the midst of increasing casualization of teaching labor, expansion of copyright
    pro-tections, and technology-driven marketization of education.


    In what follows, we retrace the development of the online syllabus in both of
    these contexts, to investigate the politics in this new media object. Our argument


