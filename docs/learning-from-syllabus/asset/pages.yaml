  md: '# ACTIONS


    lishing platform Wordpress; and, but not least, grant discovery and funding flows
    Funding Institutional and Elsevier Funding Solutions. Given how central digital
    services are becoming in today''s universities, whoever owns these platforms is
    the university.


    Third, the migration online of the academic syllabus falls into larger efforts
    by universities to ''disrupt'' the educational system through digital technologies.
    The introduction of virtual learning environments has led to lesson plans, slides,
    notes, and syllabi becoming items to be deposited with the institution. The doors
    of public higher education are being opened to commercial qualification providers
    by the rise in metrics-based management, digital planning of university services,
    and transformation of students into consumers to make ''real-time'' decisions
    on how to spend their student debt.23 Such neoliberalization masquerading digitization
    is now more evident than the hype that was generated around Massive Open Courses
    (MOOCs), exactly at the height of the economic crisis.


    MOOCs developed gradually from the Massachusetts Institute of Technology''s (MIT)
    initial experiments with opening its teaching materials to the public OpenCourseWare
    Project in 2001. By 2011, MOOCs were lauded as a full-democratization of access
    to ''Ivy-League-caliber education for the world''s people.124 And yet, the promise
    quickly followed by extremely low completion rates (as low as 5%),26 Belief that
    in five years there will be no more than 10 institutions globally delivering higher
    education,26 by the end of 2023 Sebastian Thun (Google''s celebrated roboticist
    who 2012 founded the for-profit MOOC platform Udacity), had to adapt as Udacity
    offered a ''loousy product'' that proved to be a total failure ''students from
    difficult neighborhoods, without good access to computers, and with all kinds
    of challenges in their lives.''127 Aaron Barry has thus rightly argued:


    > [MOOCs] demonstrate that the technology is not good at: accreditation and merit
