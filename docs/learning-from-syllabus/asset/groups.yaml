    # 从教学大纲中学习


    VALERIA GRAZIANO, MARCELL MARS, TOMISLAV MEDAK


    > 教学大纲是21世纪的宣言。

    > Sean Dockray 和 Benjamin Forster


    ## 教学大纲的斗争史


    2014年8月，居住在密苏里州费格逊的18岁男孩迈克尔·布朗（Michael Brown）被警察达伦·威尔逊（Darren Wilson）击毙。不久后，反对警察暴力和制度性种族主义的民议活动在美国范围内开始蔓延。乔治敦大学历史与非洲裔研究副教授
    Marcia·Chatelain博士发起了一项在线号召，敦促其他学者和教师“将课程的第一天留给与费格逊的对话”，并“推荐文本、合作制定讨论话题，并激发关于费格逊危机某些方面的对话”。¹²
    Chatel通过使用 #FergusonSyllabus 标签实现了这一行动。


    同样在2014年8月，使用 #gamergate 标签，4Chan、Twitter和Reddit 上的用户群体发起了一场针对女性开发者的骚扰活动，对象包括游戏开发者
    Zoe Quinn 和 Brianna Wu、媒体评论家 Anita Sarkesian，以及其他女性和女性主义游戏制作人、记者和评论家。在随后的几周内，《新调查》（The
    New Inquiry）的编辑和贡献者编写了一份阅读清单，并就他们的“TNI教学大纲：游戏与女性主义”³征求建议。


    2015年6月，唐纳德·特朗普宣布竞选美国总统。在他成为共和党候选人的几周内，《高等纪事》（The Chronicle of Higher Education）介绍了教学大纲“特朗普101”（Trump
    101）⁴。但历史学家 N.D. Connolly 和 Keisha N. Black 声称，“‘特朗普101’是不够的，‘一个拙劣的大学教学大纲’⁵……‘存在大量的遗漏和错误’⁶，未能包含‘有色人种学者的贡献，并解决特朗普种族主义、性别歧视和排外主义等关键问题”。他们汇编了《特朗普教学大纲2.0》（Trump
    Syllabus 2.0）⁷。不久后，针对特朗普在电视节目主持人 Billy 的一段视频中对女性进行的“极低水平的对话”，Laura Cielokkowski
    整理了一份“R文化教学大纲”（R Culture Syllabus）⁸


    - 1 Sean Dockray, Benjamin Forster,‘The #FergusonSyllabus’,*Dissent Magazine*,
    *README.md*, *Hyperradians*, 2018年2月15日, https://samit-dat.github.io/hyperheadings//

    - 2 Marcia Chatelain,‘Teaching #FergusonSyllabus’, 2014年11月28日, https://www.dissentmagazine.org/blog/teaching-ferguson-syllabus//

    - 3 ‘TNI Syllabus: Gaming and Feminism’,*The New Inquiry*, 2014年9月2日, https://thenewiring.com/tnni-syllabus-gaming-and-feminism-/

    - 4 ‘Trump 101’,*The Chronicle of Higher Education*, 2016年6月19日, https://www.chronicle.com/article/Trump-syllabus-236842/

    - 5 N.D. Connolly and Keisha N. Black,‘Trump Syllabus 2.0’,Public Books, 2016年6月28日,
    https://www.publicbooks.org/trump-syllabus-2-0/

    - 6 Laura Cielokkowski,‘R Culture Syllabus’,*Public Books*, 2016年10月15日, https://www.publicbooks.org/rape-culture-syllabus/


    ## 行动


    2016年4月，斯坦立洛克苏鲁族（成员建立了圣石营（Sacred Stone Camp），开始反对达科他访问输油管道（Dakota Access Pipeline）的抗议，该管道的建设威胁到了斯坦立洛克保留区唯一的水源。管道场地的抗议活动成为过去100年来美国人最大的集会，并为他们的“尊重水”（ReZpect
    Our Water）运动赢得了国际支持。随着抗议者与武装力量斗争的展开，一群本土学者、活动人士以及第一民族和有色人种斗争的支持者以“纽约支持斯坦立洛克委员会”的名义聚集在一起，制定了
    #StandingRockSyllabus。


    响应政治斗争而创建的在线教学大纲列表继续增长，目前包括许多例子：


    - 所有纪念碑必须倒塌教学大纲 (All Monuments Must Fall Syllabus)

    - #BlkwomensSyllabus（黑女性大纲）

    - #BLMSyllabus

    - #BlackIslamamSyllabus

    - #CharlestonSyllabus（查尔斯顿事件）

    - #ColinKaepernickSyllabus

    - #ImmigrationSyllabus（移民大纲）

    - 波多黎哥教学大纲 (#PRSYyllabus)

    - #SayHerNameSyllabus

    - 为白人教育写作科技的人的教学大纲

    - 关于女性和性别非规范者写作科技的教学大纲

    - #WakandaSyllabus（瓦坎达大纲）

    - 除了报警还该做什么：一份指南、一份大纲、一次对话、一个过程

    - #YourBaltimoreSyllabus（你的巴尔的摩大纲）


    将过去五年中由社会正义运动创建的所有在线教学大纲汇编成一份详尽列表，特别但不限于在北美女性主义和反种族主义活动背景下发起的那些。这种现在广泛传播的现象是：这些政治斗争利用社交网络，并求助于使用
    #_Syllabus 标签模板发布号召，以便自下而上聚合针对他们关注问题的政治分析和教学所需的资源。出于这一原因，我们将这种现象称为 #Syllabus（教学大纲）。


    在 #Syllabus 现象传播的同年几年，大学课程大纲也在向在线转型，通常是由学术机构发起的自上而下的过程，这使得教学大纲在日益增加的非正式化中成为一份充满争议的文献。


    在下文中，我们回溯了这两种背景下在线教学大纲的发展，以研究这一新对象。


    > #StandingRockSyllabus'', NYC Stands with Standing Rock, 2016年10月11日, https://nycstandswithrock.wordpress.com/standingrocksyllabus/


    一方面，#StandingRockSyllabus 将当代问题命名为教学性的；另一方面，它也暴露了学术现实。结合自身的处境，探讨激进教学如何增长和发展。


    ## 教学大纲的背景背景：社会运动与自我教育


    当 Chatelain 教授发起 #FergusonSyllabus 时，她主要针对教育群体：


    我知道费格逊对老师们来说将是一个挑战：当全美开学时，他们该如何讨论？我的想法很简单，但引起了全国共鸣：向教育者们伸手。推荐一本书、一篇文章、一部电影、一首歌、一件艺术品或一项关于费格逊某些方面的作业。使用标签
    #FergusonSyllabus。


    她的号召产生的反响远超预期，因为它触及了学术界。#Syllabus 对枪击事件以及后续许多 #Syllabus 号召产生了重大影响。


    这种现象包含了不同的方法和模式。在某些情况下，材料被明确归为个人创作，例如 #BlackLivesSyllabus，该项目在其主页的开头警告读者：“本大纲中的材料在没有适当引用和说明的情况下不得复制。”¹⁰
    不同的知识产权立场被 #Syllabus 干预所接纳。例如 #StandingRockSyllabus 被介绍为一种众包过程，并是获取通常被付费墙限制的研究的有用工具。¹¹


    不同的工作流、互动模式以及与知识产权的定位，使得 #Syllabus 成为构成社会运动的多样性象征。使用“教学大纲”一词本身带有某种老派色彩——从字面上讲如此；某种古朴感，引发了对老师和作业的思考。这值得调查，尤其是与投入到少数信息流中的其他在线文化现象相比。这可能是


