    那些经历过那段时光的人中，很少有人想到，后来只有极少数由用户驱动的服务会被少数几成功的公司收购而非被关闭。或者，Google 会决定不将最大的标签（hashtag）驱动的平台纳入其搜索索引，而其搜索首页的搜索结果将仅来自少数几个嫌疑对象：媒体巨头、维基百科、Facebook、LinkedIn、Amazon、Reddit、Qora。又或者，Twitter
    将成为美国总统进行种族主义、厌视女性和法西斯主义行径的主要渠道。


    这种互联网式的天真——受到同样热情的、由风险资本支持的初创企业文化的助长——不仅仅是天真。这也是一个对这些新兴平台进行大规模实验性使用的时期。此外，这个世界值得重新审视和研究。然而，在本文中，我们只能暗示这一点：即标签作为一种迷失的用户驱动型网页遗迹，是如何在网络环境中依然成功传播政治动员的。有些人会说，这种传播无非是互联网作为宣传机器的反映，不可否认，标签确实发挥着宣传功能。然而，标签保留塑造协调和自我组织的能力同样重要，因此它们是互联网作为组织机器的反映。


    如所述，#Syllabus 作为一种媒介对象，是一个指向资源链接的有序列表。在知识检索系统尝试帮助用户从大型档案中寻找信息的漫长历史，互联网继承了图书馆卡片目录、音乐行业图表和流行文化中混音磁带（mixtapes）的传统，帮助人们通过有序的项目序列讲述关于什么是相关的、什么是不相关的故事。列表（作为格式）与标签发现自己进入了列表（此处是双关语）互联网中最具标志性的媒体对象之中。在网络媒体环境中，明智地创建新列表变成了取代旧的相关性列表的方式、拆解州份（cantons）的方式、学习的方式。以及变得相关的方式。


    # 学术大纲迁移在线


    #Syllabus 的干预是政治斗争向教育工作者提出的挑战，因为它们揭示了学术界运作中的一个根本矛盾。当过去社会运动中的批判性教学法被整合到教育体系中时，这些教学法教学生的激进课程与经验并并不容易调和：专业实践课程、就业能力的修辞和社区实习，他们学到的知识仅仅是工具性的，这让他们怀疑自己究竟如何将他们的马克思主义或自由理念应用于日常生活？


    认知失调是文文学科学位的基础。更糟糕的是，高等教育的市场化、不断增加的费用以及研究的私有化，使大学处于一种境地，即日益难以为社会现实的批判性干预提供制度空间。随着大学越来越依赖学生的“客户满意度”来生存，它们避开了激烈的政治话题，或不再支持可能决定参与这些话题的教职员工。借用
    Stefano Harney 和 Fred Moten 的话：


    # 行动


    ‘政策设定课程研究’16，创造了一种悖论的情况，即当今大学是可以做除研究之外的任何事情的地方。Harney 和 Moten 提议重新占有源自自我组织和评论集体过程的知识生成的弥散实践。正如
    Moten 所说：“当我谈论我们使用人们的方式时，我认为我们致力于‘你与他人所做的事’这一理念。”17。正是共享共同剧目储备——Harvey 称之为‘排练’18——的实践，才是众包
    #Syllabus 真正的构成要素。


    这种矛盾以及它给当代新自由主义学术界带来的紧张，可以从传统学术大纲的近期演变中观察到症状。由于（某些）批判性教学法被纳入教学过程，以及大学努力减少责任，学术界变成了日益复杂和详尽的文档。它们现在被理解为教师与其学生之间的“社会合同”，以及提供教育服务的机构的“服务条款”19，而学生日益被界定为市场中做出选择的主权消费者。大纲日益增长的影响使得教育工作者反思大纲如何将权力动态转化为课堂。例如，许多学者开始实验重新构建大纲的形式和目的20。与此同时，大学正将大纲在线化，提出“另一种大纲”21
    以打破不对称。


    其次，随着资源的撤回，大纲在集体化之间之间了一种矛盾的角色。这种迁移可以解读为学术界的三大更大转变。


    - 16 Harvey and Fred Moten, The Undercommons: Fugitive Planning & Black Study,
    New York: Autonomedia, 2013, p. 81.

    - 17 Harvey and Moten, The Undercommons, p. 110.

    - 18 Harvey and Moten, The Undercommons, p. 110.

    - 19 Angela Jenkins, ‘It’s In The Syllabus’, Teaching Tools,

    - 20 Adam Heidenberg-Bruno, ‘Syllabus as Manifesto: A Critical Approach’, Hybrid
    Pedagogy

    - 21 Lucy E. Bailey, ‘The Other Syllabus’, Feminist Seminar


    物产权逻辑的引入很难挑战，因为有商业学术出版商的推动。垄断者（如 Elsevier）不仅于利用版权保护来从那些编写、同行评审和编辑学术期刊的大多数免费劳动中榨取高额利润。


    - Vincent Larivière, Stephanie Haufen, and Philippe Monge, ''The Oligopoly of
    Academic Publishers in the Digital Era'', PLoS ONE 10.6 (10 June 2015).


