  mdcn: '


    一种实用的、新颖的格式正是为了这种特征而设计的：它连接了早于文化的旧教学传统与技术？


    #Syllabus（教学大纲）确实可以被分析为属于一个长期教学工具谱系，这些工具由社会运动创造，旨在培养政治主体化过程并构建集体意识。激进活动人士和激进组织者一次又一次地创建并使用各种媒体对象——如传单、小册、食谱、读物或宣言——以促进共同的政治分析并煽动群众运动。


    在美国背景下，反种族主义运动历史上非常强调批判性教育学和自学。1964年，联邦组织委员会（各项民权倡议的联盟）和学生非暴力协调委员会（SNCC）在密西西比州建立了一个由41所替代学校组成的网络。最近，自由图书馆项目（Freedom
    Library Project）——一项源于 #FergusonSyllabus 旨在为缺乏资金的教学倡议提供资金的活动——提到了此作为灵感来源。1964年的“自由夏季计划”将数百名活动人士、学生和学者（其中许多人是白人）从该国家北部带来，教授歧视性的州立学校不会向黑人学生提供的课题和问题。根据SNCC的一份报告，自由学校的建立基于一种信念：“教育——解放和利用这些事实——是民主的基础”，11，这种信念在当代
    #Syllabus 倡议的精神中得到了呼响。


    鲍勃·摩西斯（Bob Moses）是一位民权运动领袖，曾担任密西西比州文学计划的负责人，他回忆起当时运动对这种教学方法的兴趣，即将教学材料的制作作为一种教学工具：


    > 我获得了一个文本并和一些成年人一起使用……并注意到他们无法处理它，因为图片不符合他们的认知……这让我开始思考开发一些更接近人们正在做的事物。我感兴趣的想法是训练SNCC的工作人员，与我们合作的人们一起开发材料。,12


    对他而言，我们所创建的材料的实际使用并不比共同制作教学材料的过程重要。这种对可以被称为“教学的教育学”，或者更准确地说是“准备教学材料的教育学”的关注，在当前的
    #Syllabus 倡议中也是一种相关的机制，因为他们的众筹鼓励不同类型的人贡献他们认为对更广泛运动相关的资源。


    除了激进黑人组织的至关意义外，另一个可以将 #Syllabus 置于其中的谱系是国际女性主义运动，特别是70年代由塞尔尔玛·詹姆斯（Selma James）和西尔维亚·费德里西奇（Silvia
    Federici）发头的“家务工资”（Wages for Housework）运动。该运动强调了没有报酬的生殖劳动为资本剥削提供了基础。他们想鼓励女性去自然化并质疑被接受的劳动分工（留在家庭之外的工作与家庭范围内的爱劳动），讨论了诸如“作为社会化家务的卖淫”和“强制绝育”等影响贫困且往往带有种族特征女性的禁忌话题。家务工资运动的组织工作以政治教育学为核心。他们理解教育学需要：


    > {有可用的文献和其他材料来解释我们的目标，且都用女性能理解的语言编写。我们还需要不同类型的文件，一些是理论性的，另一些是关于斗争的信息。对于从未有过任何政治经验的女性，拥有文件是非常重要的。这就是为什么我们的首要任务是创作一本我们可以大量免费分发的普及小册——因为女性没有钱.³


    家务工资运动面临的障碍重重，首先是如何接触分散的家庭主妇群体，以及如何让作为革命运动核心的诉求对不同群体都触手可及。为了应对这些挑战，组织者开发了创新的通信策略和教学工具，包括获得主流媒体报道的策略、翻译成不同语言的小册和传单¹14、布鲁林的一家店面商店，以及当地活动中的宣传桌。


    自由学校和家务工资运动只是社会运动内部发展出的批判性教育学的例子之一。#Syllabus 现象显然处于我们历史的谱系中，但我们也强调了它与其出现的当代背景相关的其重要性。#Syllabus
    承认，自70年代以来——以及学生参与抗议并对其他政治运动表示团结——例如马克思主义理论、女性研究、性别研究和非裔美国研究，加上最初在批判性教育学中开发的一些原则，已经整合到教育系统中。许多
    #Syllabus 倡议的发起者是黑人学者，这一事实说明了这种斗争成就的历史性转变。然而，这些教育者感到非常有必要在学术之外启动他们的活动，同时也揭示了他们在当前的私有化和教育复合体内部遭遇的困难。


    + 1 Daniel Perelstein, ‘Teaching Freedom’: SNCC and the Creation of the Mississippi
    Freedom Schools’, History of Education 30.3 (Autumn 1990): 302.

    + 12 Perelstein, ‘Teaching Freedom’: 306.

    + 13 Silvia Federici and Karen Austen (eds) 编 The Wages for Housework Committee
    1972-1977: History, Theory and Documents. New York: Autonomia, 2017: 37.

    + 14 一些传单和小册已由 MayDay Rooms 数字化，这是一个与社交媒体、实验文化以及边缘化传单和群体的激进表达相关的历史避风港——位于伦敦，可以在他们的在线存档找到：''Wages
    for Housework: Pamphlets — Flyers — Photographs, MayDay Rooms, http://maydayrooms.org/archives/


    # 作为媒体对象的教学大纲


    除了在历史遗产中的语境化外，有必要将 #Syllabus 作为一个独立的新对象进行讨论，以充分理解它对未来的意义。如果我们要描述这个对象，#Syllabus
    将是一个关于政治和斗争的有序列表。然而，正如我们看到的，#Syllabus 并不遵循严格的格式。学术大纲通常也不包含目标、时间表、课程和考试。脱离了这些制度性要求，#Syllabus
    通常只是一个列表和一个标签（hashtag）。阅读列表为理解什么是相关内容提供了资源，而标签则提供了一种传播相关内容的方式。列表和标签都是当代（互联网）文化的特殊性和形式特征。


    互联网发展的不同阶段以不同的方式处理相关信息的可发现性问题。在早期，Gopher 协议将信息组织成分层文件树。随着广域网（WWW）时代的到来，Yahoo 试图聘请专家将互联网分类并编成链接目录。这在一段时间内似乎是一个成功的方法，但随后
    Google（成立于1998年）出现，并开始使用链接网页谱来排名网页对搜索查询的重要性。


    2005年，克莱尔·谢基（Clay Shirky）写了文章《本体论被夸估了：类别、链接与标签》，源于他早早的演讲《民俗分类与标签：用户分类的兴起》。谢基用
    Yahoo 对 WWW 的分类尝试，对比了任何试图将海量异构信息分类为单一分层系统的尝试。在他的话中：“[Yahoo] 错过了……那就是如果你有足够的链接，就不再需要层级。没有书架。没有文件系统。链接本身就足够。”这些话引起了许多人的共鸣。通过遵循简单的格式规则，我们这些被《时代》杂志评为2006年年度人物的互联网用户，证明了集体编写一部有史以来最大的百科全书是完全可能的。


    + 15 Clay Shirky, ‘Ontology Is Overrated: Categories, Links, and Tags’, 2005,
    shirky.com/writings/herecomeeverybody/ontology.overrated.html.


