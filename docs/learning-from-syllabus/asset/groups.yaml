    librarians and radical educators.


    # #Syllabus in Historical Context: Social Movements and Self-Education


    When Professor Chatelain launched her for #FergusonSyllabus, she was mainly addressing
    a community of fellow educators:


    I know Ferguson would be a challenge for teachers: When schools opened across
    the country, how were they going to talk about what happened? My idea was simple,
    but resonated across the country: Reach out to the educators who use Twitter.
    Ask them to committing about Ferguson on the first day of classes. Suggest a book,
    an article, a film, a song, a piece of artwork, or an assignment that speaks to
    some aspect of Ferguson. Use the hashtag: #FergusonSyllabus.


    Her call had a much greater resonance than she had originally anticipated as it
    reached the limits of the academic community. #Syllabus had a significant impact
    in shaping the analysis and the response to the shooting of Michael Brown, and
    in inspiring the many other #Syllabus calls that followed.


    TheSyllabus phenomenon comprises different approaches and modes of operation.
