    culture as pedagogical in nature, on the other hand, it also exposes academicized
    critical pedagogy and intellectuality as insufficiently political in relation
    to social reality. Situating our own stakes as both activists and academics in
    the present debate, we explore some ways in which the radical politics of #Syllabus
