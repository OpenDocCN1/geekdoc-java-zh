    landing page by a warning to readers ''material claimed in this syllabus should
    not be duplicated without proper citation and attribution.''¹⁰ A different position
    on intellectual property is embraced by #Syllabus interventions that have a more
    choosing manner. #StandingRockSyllabus, for instance, introduced as a crowd-sourced
    process and as a useful ‘tool’ to access research usually kept behind paywalls.¹¹⁹


    The different workflows, modes of engagement, and positioning in relation to intellectual
