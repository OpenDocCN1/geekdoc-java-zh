    # # Syllabus as a Media Object


    Besides its contextualization within the historical legacy of previous grassroots
    movements, it is also necessary to discuss #Syllabus as a new media object in
    its right, in order to fully grasp its relevance for the future politics of knowledge
    production and transmission.


    If we were describe this object, a #Syllabus would be an ordered list of links
    to scholarly texts, news reports, and audiovisual media, mostly aggregated through
    a participatory and iterative process, and created in response to political events
    indicating classes of structural oppression. Still, as we have seen, #Syllabus
    as a media object doesn''t follow a strict format. It varies based on the initial
    vision of its initiators, political causes, and social composition of the relevant
    struggle. Nor does it the format of traditional academic syllabus. A list of learning
    resources is at the heart of any syllabus, a boilerplate university syllabus typically
    includes objectives, a timetable, attendance, coursework, and examination of the
    grading system used for the given course. Relieved of these institutional requirements,
    the #Syllabus typically only a reading list and a hashtag. The reading list provides
    resources for understanding what is relevant to the here and now, while the hashtag
    provides a way to disseminate edit and teach what is relevant to the here and
    now. Both the list and the hashtag are specificities and formal features of the
    contemporary (internet) culture and mere further exploration in the social dynamics
    at play in #Syllabus initiatives.


    The different phases of the internet''s development approached the problem of
    the discoverability of relevant information in different ways. In the early days,
    the Gopher protocol organized information into a hierarchical file tree. With
    the era of Wide Web (WWW), Yahoo tried to employ experts to classify and catalog
    the internet into a directory of links. That seemed to be a successful approach
    for a while, but then Google (founded in 1998) came along and started to use a
    webgraph of links to rank the importance of web pages to a search query.


    In 2005, Clay Shirky wrote the essay ‘Ontology is Overrated: Categories, Links
    and Tags’ from his earlier talk ‘Folksonies and Tags: The Rise of User-De Classification’.
    Shirky used Yahoo''s attempt to categorize the WWW against any attempt to classify
    a vast heterogeneous body of information into a single hierarchical categorical
    system. In his words: ''[Yahoo] missed [...] that, if you''ve enough links, you
    don''t need the hierarchy anymore. There is no shelf. There is no file system.
    The links alone are enough.’ Those words resonated with many. By following simple
    formatting rules, we the internet users, whom Time magazine named Person of the
    Year in 2006, proved that it is possible to collectively write the largest encyclopedia
    ever. But, even beyond that, and as per Shirky''s argument, if enough of us organized
    our own snippets of the vast body of the internet, we could replace old canons,
    hierarchies, and ontologies with folksonomies, social bookmarks, and (hash)tags.


    15 Clay Shirky, ‘Ontology Is Overrated: Categories, Links, and Tags’, 2005, shirky.com/writings/herecomeeverybody/ontology.overrated.html.'
