    ecology.


    #Syllabus can be conceived as a recursive process of versioning lists, pointing
    to textual, audiovisual, or other resources. With all of the linked resources
    publicly accessible to all; with all of the lists editable by all; with all of
    edits attributable to their contributors; with all versions, all linked resources,
    all attributions preservable by all, just an autonomous ecology can be made for
    #Syllabus. In fact, Dean Gray, Benjamin Forster, and Public Office have already
    proposed such a methodology in their Hyperreadings, a forkable readme plaintext
    document on Github. They write:


    A text that by its nature points to other texts, the syllabus is already a relational
    document acknowledging its own position within a living field of knowledge. It
    is decidedly not self-contained, however it often circulates as if it were.


    If a syllabus circulated as a HyperReadings document, then could point directly
    to the texts and media it aggregates. But just easily as it circulates, a HyperReadings
    syllabus could be forked into new versions: the syllabus is changed because there
    is a new essay, or because of a political disagreement, or because following the
    syllabus produced new suggestions. These forks become a family tree where one
    can branch and trace epistemological mutations.30


    It is in line with this vision, which we share with the HyperReadings crew, and
    in line with all, as we animate librarians, activists, and educators, make our
    promise beyond the limits of this text.


    The workflow that we are bootstrapping here will keep in mind every aspect of
    the syllabus (order, timestamp, contributor, version changes), allowing diversity
    via forking and branching, and making sure that every reference listed in a syllabus
    will find its reference in a catalog which will lead to the actual material, in
    digital form, needed for the syllabus.


    Against the enclosures of copyright, we will continue building shadow libraries
    and archives of struggles, providing access to resources needed for the collective
    processes of education.


    Against the corporate platforming of workflows and metadata, we will work with
    social movements, political initiatives, educators, and researchers to aggregate,
    annotate, version, and preserve lists of resources.


    Against the activism of academia, we will take care of the material conditions
    that are needed for such collective thinking to take place, both on- and offline.'
  md: "\n# ACTIONS\n\npublishing platform Wordpress; and, but not least, grant discovery\
    \ and funding flows Funding Institutional and Elsevier Funding Solutions. Given\
    \ how central digital services are becoming in today's universities, whoever owns\
    \ these platforms is the university.\n\nThird, the migration online of the academic\
    \ syllabus falls into larger efforts by universities to 'disrupt' the educational\
    \ system through digital technologies. The introduction of virtual learning environments\
    \ has led to lesson plans, slides, notes, and syllabi becoming items to be deposited\
    \ with the institution. The doors of public higher education are being opened\
    \ to commercial qualification providers by the rise in metrics-based management,\
    \ digital planning of university services, and transformation of students into\
    \ consumers to make 'real-time' decisions on how to spend their student debt.23\
    \ Such neoliberalization masquerading digitization is now more evident than the\
    \ hype that was generated around Massive Open Courses (MOOCs), exactly at the\
    \ height of the economic crisis.\n\nMOOCs developed gradually from the Massachusetts\
    \ Institute of Technology's (MIT) initial experiments with opening its teaching\
    \ materials to the public OpenCourseWare Project in 2001. By 2011, MOOCs were\
    \ lauded as a full-democratization of access to 'Ivy-League-caliber education\
    \ for the world's people.124 And yet, the promise quickly followed by extremely\
    \ low completion rates (as low as 5%),26 Belief that in five years there will\
    \ be no more than 10 institutions globally delivering higher education,26 by the\
    \ end of 2023 Sebastian Thun (Google's celebrated roboticist who 2012 founded\
    \ the for-profit MOOC platform Udacity), had to adapt as Udacity offered a 'loousy\
    \ product' that proved to be a total failure 'students from difficult neighborhoods,\
    \ without good access to computers, and with all kinds of challenges in their\
    \ lives.'127 Aaron Barry has thus rightly argued:\n\n> [MOOCs] demonstrate that\
    \ the technology is not good at: accreditation and merit rewards self learners\
    \ who have the resources and privilege that allow them to pursue for their own\
    \ sake [...] MOOCs are also a really poor to make educational resources available\
    \ to underserved and underprivileged communities, which has been the historical\
    \ mission of public education.28\n\nIndeed, the 'historical mission of public\
    \ education' was always and remains to be today highly contested terrain—the very\
    \ idea of a good public being under attack by dominant managerial techniques that\
    \ refine it driving, Randy Martin aptly called the 'financialization of daily\
    \ life.'¹29 The failure of MOOCS finally points to a broader question, also impacting\
    \ the vicissitudes of #Syllabus: Where will actual study practices find refuge\
    \ in the social, so the social is made productive for capital all times? Where\
    \ will study 'take place', in the literal sense of the phrase, claiming the resources\
    \ that it needs for co-creation in time, labor, and love?\n\n# Learning from #Syllabus\n\
    \nWhat we have learned from the #Syllabus phenomenon?\n\nThe syllabus is the manifesto\
    \ of the 21st century.\n\nPolitical struggles against structural discrimination,\
    \ oppression, and violence in the present are continuing the legacy of critical\
    \ pedagogies of earlier social movements that coupled the process of political\
    \ subjectivation with that of collective education. students into the fold of\
    \ their struggles. By creating effective pedagogical movements, movements have\
    \ brought educators to the context of our new network environment, political struggles\
    \ have produced a new media object: #Syllabus, a crowdsourced list of resources—historic\
    \ and present—relevant to a case. By doing so, these struggles adapt, resist,\
    \ and live in again the networks dominated by techno-capital, with all of the\
    \ difficulties and contradictions that entails.\n\nWhat we have learned from the\
    \ academic syllabus migrating online?\n\nIn the contemporary university, critical\
    \ pedagogy is clashing head-on with the digitalization of higher education. Education\
    \ that should empower and research that should emancipate are increasingly left\
    \ in the cold due to the data-driven marketization of education, short-cutting\
    \ the goals of teaching and research to satisfy the fluctuating demands of market\
    \ force and financial success. Resistance against the captata, research workflows,\
    \ and scholarship by means of digitalization is a key struggle for the future\
    \ of mass intellectuality beyond exclusions of class, disability, gender, and\
    \ race.\n\nWhat we have learned from #Syllabus as a media object?\n\nAs old formats\
