  mdcn: "\n\n# 行动\n\n发布平台 Wordpress；而且重要的是，为资金机构和爱思唯资金解决方案（Elsevier Funding Solutions）提供发现和资金流。鉴于数字服务在当今大学中变得如此核心，谁拥有这些平台，谁就拥有了大学。\n\
    \n第三，学术大纲的在线迁移，属于大学通过数字技术“颠覆”教育系统的更大努力的一部分。虚拟学习环境的引入导致教学计划、幻灯片、笔记和教学大纲变成了必须向机构提交的条目。随着基于指标的管理兴起、大学服务的数字化规划，以及学生转变为消费者，公共高等教育的大门正向商业资质提供者开放，使他们能够对如何支用学生贷款做出“实时”决策。23\
    \ 这种伪装成数字化的新自由主义化，现在比经济危机高峰时期对大规模开放课程（MOOCs）所产生的炒作更为显而易。\n\nMOOCs 是从马萨诸塞理工学院（MIT）2001年向公众开放其教学材料的开放课程项目（OpenCourseWare\
    \ Project）逐渐发展而来的。到2011年，MOOCs 被誉为为世界人民提供“常春藤盟级教育”的完全民主化。124 然而，这种承诺很快随之而来的是极低的完成率（低至5%），26\
    \ 认为在五年内全球将只有不超过10家提供高等教育的机构，26 到2023年底，塞巴斯蒂安·图恩（2012年创立营利性 MOOC 平台 Udacity 的著名机器人专家）不得不做出调整，因为\
    \ Udacity 提供的“糟糕的产品”被证明是彻底的失败，“对于那些来自困难贫困社区、没有良好电脑访问且生活中面临各种挑战的学生来说”。127 因此，Aaron\
    \ Barry 理直地论证道：\n\n> [MOOCs] 表明技术并不擅长：认证和奖励那些拥有资源和特权、允许他们为了自身利益而追求学习的自学者……MOOCs\
    \ 在向资源匮乏和弱势社区提供教育资源方面也非常糟糕，而这本是公共教育的历史使命。28\n\n事实上，“公共教育的历史使命”过去是、现在仍然是一个极具争议的领域——良好的公共理念本身正受到主导管理技术的攻击，这些技术精炼了它的驱动力，兰迪·马丁恰切地将其称为“生活的金融化”。¹29\
    \ MOOCs 的失败最终指向了一个更广泛的问题，也影响着 #Syllabus 的变迁：真正的学习实践将在社会中寻找避难所，以便社会在任何时候都能为资本产生生产力？学习在字面意义上“发生”在哪里，以获取它在时间、劳动和爱中进行共同创造所需的资源？\n\
    \n# 从 #Syllabus 中学习\n\n我们从 #Syllabus 现象中学习到了什么？\n\n教学大纲是21世纪的宣言。\n\n当下反对结构性歧视、压迫和暴力的政治斗争，延续了早期社会运动中批判性教学的遗产，这些运动将政治主体化过程与集体教育相结合，将学生纳入他们斗争的怀抱。通过创建有效的教学运动，这些运动将教育者带入我们新的网络环境中；政治斗争产生了一个新的媒体对象：#Syllabus，一个与案例相关的资源（历史和现状）众包列表。通过这种方式，这些斗争在由技术资本主导的网络中适应、反抗并再次生存，带着随之而来的所有困难和矛盾。\n\
    \n我们从学术大纲在线迁移中学习到了什么？\n\n在当代大学中，批判性教学正与高等教育的数字化发生正面碰撞。本应赋能的教育和本应解放的研究日益由于教育数据驱动的市场化而被冷落，缩短了教学和研究的目标，以满足市场力量和财务成功的波动的需求。通过数字化对捕获成果、研究工作流和学术进行反抗，是未来大众智力的一场关键斗争，超越了阶级、残障、性别和种族的排斥。\n\
    \n我们从作为媒体对象的 #Syllabus 中学习到了什么？\n\n随着旧格式转化为新的媒体对象，数字网络定义了我们在由技术资本主导的网络中适应、反抗并再次生存，带着随之而来的所有困难和矛盾。我们需要重新获取\
    \ #Syllabus 作为媒体对象的生产和分发过程。随着旧格式转化为新的媒体对象，数字网络定义了我们在这里启动的工作流，该工作流将考虑大纲的每一个方面（顺序、时间戳、贡献者、版本更改），通过分叉和分支允许多样性，并确保教学大纲中列出的每个引用都能在目录中找到对应，从而引导至大纲所需的数字形式的实际材料。\n\
    \n23 Ben Williamson, 'Number Crunching: Transforming Higher Education into \"\
    Performance Data\", Medium, 16 August 2018, https://www.medium.com/ubssrief/number-crunching-transforming-higher-education-into-performance-data-9c23dec64cf7.\n\
    \n24 Max Martin, 'Udacity's Sebastian Thun, Godfather Of Free Online Courses',\
    \ FastCompany, 14 November 2013, https://www.fastcompany.com/302147/udacity-sebastian-thun-uphill-climb/\n\
    \n25 (The Rise and Fall) of the MOOCs', Oxbridge Essays, 14 November 2017, https://www.oxbridgeessays.com/blog/rise-fall-mooc/\n\
    \n26 Steven Lequart, 'The Stanford Education Course Could Help Higher Learning\
    \ Forward', Wired, March 2012, https://www.wired.com/2012/03/ff/aaiclis/\n\n27\
    \ Chalkin, 'Udacity's MOOC Moment and the End of Reform', Liberal Education 99.4\
    \ (Fall 2013),\n\n28 Aaron Barry, https://www.aacu.org/publications-periodicals/mooc-moment-and-end-reform.\n\
