  md: '# Framing and messaging


    Mass movements are successful when groups that dislike each other join together
    for the common good.

    Chris Hedges, ex-New York Times journalist, who covered revolutions and uprisings
    for 20 years


    This booklet is primarily focused upon the organisational and action design for
    societal and political transformation. The other side of the equation is the way
    in which we communicate what our demands are and why it vital we succeed. Messaging
    and framing are central to any successful plan.


    # Reformist framing of solutions must end


    The bit-by-bit reformist framing of change is both immoral and ineffective as
    it puts political ideology before scientific facts. This may be justifiable if
    we are in a period of reformist possibility, but that window is now closed. We
    are now in a new political context where telling the truth is both effective and
    moral. This is a switch from a degenerative post-modernism where ''presentation''
    takes priority over actuality. It is replaced by a new realism which now provides
    the best path to create the massive structural changes that are required. The
    key example here was the decision by Extinction Rebellion to make ''Tell the Truth''
    their first demand. This kick-started a social movement.


    In terms of the actual threat to life, this new approach enables us to engage
    in a straightforward risk analysis which happens routinely in other areas of social
    and economic life but not in the area of climate change. This means taking a scientifically
    measured level of the threat and then multiplying it by the probability that it
    will happen, which gives a risk assessment.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Of course, the method cannot be totally accurate, but we have no better means
    of assessing risk. In the case of climate breakdown, we are looking at a high
    probability of the death of billions of people in the next generation or two.
    The reformist denial of this reality is catastrophically irresponsible. In the
    last century, such levels of denial in facing the truth have led to appalling
    atrocities of communism and fascism.


    # Telling the truth as a revolutionary act


    This simple act of telling the truth allows the Rebellion to engage the media
    with the narrative that they are simply acting appropriately in the face of the
    same ignorance and denial that led to World War II. By denying the reality, we
    face ‘climate appeement’. This means insisting on speaking the truth without interruption
    during interviews and insisting on giving time for listeners to process the emotional
    impact of realising the extent of the terrible political corruption that claims
    to be ‘solving the climate crisis’. A key approach to communicating this reality
    is to use direct actions when speaking to the media.


    Some options:


    +   * Walk out of the interview after making a short statement.

    * Insist on silence after telling the interviewer we are heading towards mass
    extinction and that we are all going to die unless urgent action is

    * Simply repeat a repeated short sentence about the reality we face over and again
    again regardless of what the interviewer says.

    * Refuse to leave the studio until removed by security as a protest on the media
    coverage of climate change, but to go peacefully when removed.


    All of these moves aim to prevent journalists and presenters from avoiding the
    true horror of mass extinction. Actions speak louder than a thousand words, and
    we need to see the media as a place for system change rather than for pseudo-
    rationalist debate about false gradualist improvements. Without painful emotional
    engagement, there will be no real commitment to drastic action, and thus no real
    change. Only when the rules of media'
