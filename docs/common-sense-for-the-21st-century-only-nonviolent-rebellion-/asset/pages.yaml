    power up to the binary tipping point where on the one side nothing happens, and
    on the other side everything happens. From the government refusing to agree to
    serious policy change to the point where it calls for negotiations with a nonviolent
    rebellion


    We won’t agree to any compromise that allows the incompetent and corrupted political
    class to remain in power. They are forced to choose between either agreeing to
    our demands or repressing the actions and protests with the risk that this inspires
    more people to join the Rebellion and take to the streets.


    Our aim is to gather enough resources to reach this critical point where we force
    the hands of the politicians to make the choice: agree to give up power or repress
    us.


