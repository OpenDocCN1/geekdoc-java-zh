  md: '# Introduction


    It is time to grow up and see the world as it is. There are some things which
    are undeniably real, there are some things we cannot change, and one of those
    are the laws of physics. Ice melts when the temperature rises. Crops die in a
    drought. Trees burn in forest fires. Because these things are real, we can also
    be certain about what the future holds. We are now heading into a period of extreme
    ecological collapse.


    Whether or not this leads to the extinction of the human species largely depends
    upon whether revolutionary changes happen within our societies in the next decade.
    This is not a matter of ideology, but simple maths and physics.


    The United Nations has estimated that we need to reduce carbon emissions by half
    within a decade to have a 50% chance of avoiding global catastrophe. Of course,
    this is likely to be an underestimation as recent science shows permafrost melting
    90 years earlier than forecasted and Himalayan glaciers melting twice as fast
    as expected. Feedbacks and locked-in heating will take us over 2°C (35.6°F) even
    before we factor in additional temperature rises from human caused emissions over
    the next ten years.


    In short, we are fucked – the only question is by how much and how soon? Do we
    accept this fate? I suggest we do not. Many self-respecting people who can overcome
    the human failing to disbelieve what they don''t like, now accept what is obvious
    looking at the natural science. But they have yet to work through the political
    and social implications. This booklet sets out what is now obvious from a social
    scientific point of view: societies will not change with the necessary speed without
    rebellions and a revolutionary'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'transformation of our societies and politics. This is not a matter of one’s
    political party preferences. It is a matter of basic structural sociology. Institutions,
    like animal species, have limits to how fast they can change. To get rapid change
    they have to be replaced with new social systems of policy, practice and culture.
    It is a terrible and painful realisation, but it is time to accept our reality.
    Just because we don’t like something does not mean it is not true.


    All of this is common sense.


    In 1776, Thomas Paine wrote a pamphlet titled Common Sense to tell the American
    population what they privately knew but did not have the courage to declare openly:
    they needed to declare independence from the British Crown. It was read by 10%
    of the population and is credited with transforming the resolve of many Americans
    to strike out into the political unknown.


    Likewise, my proposition in this booklet is a Common Sense for the 21st century.
    I declare what we already know: things cannot carry on as they are. Only a revolution
    of society and the state – a similar turn that Paine urged the Americans to take
    into the political unknown – can save us now.


    This is the first step in transformation: accepting the truth as it is. Climate
    and ecological breakdown will kill us all in the near term unless we act as if
    the truth is real.


    In this booklet, I explain the social implications – the reformist political culture
    of both left and right in neoliberal society is not fit for purpose. To put it
    bluntly, NGOs, political parties and movements which have brought us through the
    last 30 years of age failure – a 60% rise in global CO₂ emissions since 1990 –
    are now the biggest block to transformation.


    They offer gradual solutions which they claim will work. It is time to admit that
    this is a lie. They are diverting popular opinion and the public’s attention and
    energy away from the task at hand: radical collective action against the political
    regime which is planning our collective suicide.'
