  md: 'The science matters. The Intergovernmental Panel on Climate Change (IPCC) reported
    in October 2018 that we have to reduce carbon emissions by 40% in the next 12
    years to have a 50% chance of avoiding ‘catastrophe’.4 And yet in 2018 emissions
    went up from an increase of 1.6% in 2017 to an increase of 2.7%. Carbon dioxide
    levels went up by 3.5 parts per million (ppm) in the past year to reach 415 ppm.
    This means we are now only ten years away from an overall 450 ppm of CO2 equivalents
    (all green-house gases combined), the level equivalent to 2°C (35.6°F) average
    temperature rise.


    Let’s be frank about what ‘catastrophe’ actually means in this context. We are
    looking here at the slow and agonizing suffering and death of billions of people.


    A moral analysis might go like this: one recent scientific opinion stated that
    at 5°C (41°F) above the pre-industrial mean temperature, we are looking at an
    ecological system capable of sustaining just one billion people.5 That means 6-7
    million people will have died within the next generation or two. Even if this
    figure is wrong by 90%, 600 million people will face starvation and death in the
    next 40 years. This is 12 times worse than the death toll (civilians and soldiers)
    of World War II and many times the death toll of every genocide known to history.
    It is 12 times worse than the horror of Nazism and Fascism in the 20th century.


    This is what our genocidal governments around the world are willingly allowing
    to happen. The word ‘genocide’ might seem out of context here. The word is often
    associated with ethnic cleansing or major atrocities like the Holocaust. However,
    the Merriam-Webster dictionary definition reads ‘the deliberate and systematic
    destruction of a racial, political, or cultural group’.


    With many governments knowing the impact of climate change but continuing to support
    the fossil fuel industry, the result will be the destruction of many nations,
    species and cultures. There is no greater crime. Let us bear this reality continually
    in mind as we address the question of the necessary societal and political response.'
