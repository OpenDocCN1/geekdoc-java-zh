  md: '# ‘Tell the Truth and act as if that truth is real’


    The statement ‘Tell the Truth and act as if that truth is real’ is an extreme
    violation of the reformist paradigm. For reformism you only tell the truth to
    the extent that you think people can cope with it, and you only act on it to the
    extent that you think you can win (in a gradualist way).


    This is how reformism ends up in a morally and spiritually bad place – lying and
    holding back actions which are now justified. So what is the revolutionary alternative?'
