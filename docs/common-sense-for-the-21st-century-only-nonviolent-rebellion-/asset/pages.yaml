  md: '# About the author


    In April 2018, Roger Hallam met with a group of 15 activists, environmentalists,
    and scientists in a café in Bristol, among them Gail Bradbrook and Simon Bramwell.
    Together they founded Extinction Rebellion. A former organic farmer and long-time
    climate change activist, Hallam has been on successful hunger strikes, been arrested
    ten times and has served a prison term, all in the service of preventing a climate
    catastrophe.'
