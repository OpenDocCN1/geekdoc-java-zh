    pay increases without the need for direct action. Choosing the nearest potential
    allies first is the ideal starting point, then move onto the rest.


    The starting point then would be the NGOs with their massive resources and promotion
    of methods of campaigning, which are now discredited as being ineffective and
    too slow. Several of these are on board, and adopt the new strategy of promoting
