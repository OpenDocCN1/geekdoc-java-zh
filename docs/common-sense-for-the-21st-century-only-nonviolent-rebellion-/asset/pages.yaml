- img_proc: true
  md: 'engagement are broken can we create effective communication that reaches hearts
    and minds.


    That said, if and when a journalist or editor is willing to give us an hour to
    carefully outline the full magnitude of mass extinction and the social scientific
    evidence for rebellion as the most effective response, then we should of course
    take this opportunity. We are not against having a serious discussion, but rather
    against spaces which have no interest in such discussion.


    Media and messaging working groups should have the merit to recruit speakers and
    train them in disruptive action, which sends out what should be our central message:
    ‘We are different from them (the status quo or regime), we are not afraid of them,
    and you don’t need to be afraid either. Rise up and exercise your freedom. Come
    down to the occupations and become a human being, not someone living within a
    media and politically constructed “post-truth” world.


    These media appearances have the potential to go viral and thus can have as much
    influence as the civil disobedience on the ground. This new opening for direct
    action is then a vital additional front which needs to be central to the overall
    strategy.


    # Internal messaging – the value of diversity


    Research shows that members of a social group or network tend to have irrational
    ‘in and out group’ emotions and reactions that consciously or unconsciously prevent
    them working with people who are not like themselves. This problem is unlikely
    to resolve itself. To build a mass movement, we inevitably need to bring people
    together who ordinarily don’t want to mix. There are several effective approaches
    to this central problem of effective mobilisation:


    +   Make all campaign spaces as friendly as possible on a personal level. This
    means maximising face-to-face human connection as a counterbalance to any perceived
    alienating group identity. People should be explicitly welcomed into the meeting
    space. They should then sit in small mixed groups in meetings and be given time
    to get to know'
