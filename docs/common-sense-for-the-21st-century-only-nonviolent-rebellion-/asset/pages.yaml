    are based around short two-minute personal testimonials and smaller break-out
    groups through which concerned citizens will create a new vision of the social
    and political transition needed to address the crisis.


    Taking over large public spaces to have these assemblies would create dramatic
    political theatre, particularly if they happen in the context of disruptive and
    sacrificial direct actions. All this bottom-up political energy would be funnelled
    into a new revolutionary agenda, ‘We have had enough of politics as usual, and
    we want a new political system’.


    This new political awakening is legitimised through the demand for a National
    Citizens’ Assembly, a formalised gathering of ordinary people selected in a systematic,
    randomised way from all sectors of the general population. The framing could be:
    ‘The people have better ideas about what’s needed than the politicians, so let
    the people decide’. A national'
