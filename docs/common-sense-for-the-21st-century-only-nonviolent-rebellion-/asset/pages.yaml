  md: 'We must therefore avoid the simplistic idea that if we close down the country
    we will win. Disruption has to be combined with our willingness to show our vulnerability
    and to suffer. The disruption then simply sets the stage for the symbolism of
    fearless sacrifice. It is the sacrifice which brings about the social change not
    the disruption in itself. This is the case particularly when the young and the
    old take part, as sacrificial action by both groups creates greater public interest
    and sympathy than the ‘usual suspects’ – young men. This is the key reason why
    direct actions should be designed in an open way which are accessible to the two
    groups.


    # Creating a mass civil disobedience event in the capital city


    The most effective act of mass civil disobedience is to have a significant number
    of people (at least 5,000–10,000 initially) occupy public spaces in a capital
    city for several days to weeks. Again, this is not so much because of the material
    disruption that is caused, but rather the symbolic impact of mass sacrificial
    actions at the heart of national power, the site of the governing and media elites.


    The precise design for the event will need to be made on the basis of the numbers
    willing to take part, the political context, and the expected police response.
    Groups should aim to get 20,000 people to central points near government buildings
    for several days.


    There are two basic designs:


    +   1. They would occupy public parks and bring tents to stay overnight. Each
    day there would be a public programme of discussions and assemblies, workshops,
    picnics, speakers, and entertainment. Think of a festival! On day two they would
    occupy several key junctions for a day – at least 1,000 people at each. The strategy
    depends on the police allowing this to happen (see analysis below). On the third
    day, they would return to the junction and stay there permanently, putting up
    their tents, with a continuing festival programme.


    +   2. A second option is that people would occupy the road junctions in a central
    location in the capital city from day one and stay there until everyone is arrested.'
