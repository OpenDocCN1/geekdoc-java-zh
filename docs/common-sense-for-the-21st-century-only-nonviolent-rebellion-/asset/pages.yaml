  md: '# A new transition movement: if governments don’t listen, then the people will
    act


    Building on the existing Transition Network, a major people’s movement is needed
    to organise the mitigation of climate change, ecological restoration as well as
    preparation and adaptation to the coming changes.* We need programmes like TransitionLab.earth
    that are focused on volunteerism at high levels such as engineering and actioning
    solutions rather than more policy ‘think tanks’. For instance, inventors could
    research and develop battery technology and give away the patents for free. In
    fact, all beneficial research needs to be part of the Commons – for free and unrestricted
    use.


    An expert group of data scientists could develop artificial intelligence to help
    predict the worst affected areas of the UK, then engineers could design systems
    to mitigate the impact. Efforts like this are underway all over the world, but
    need to be central platforms that citizens can engage with.


    A Lab should be created, made up of scientists, engineers and other Earth-enhancing
    experts to advise and respond to questions and take direction from Citizens’ Assemblies.
    Based on this collaborative work, the Assemblies would then go on to organise
    people into a Citizen Voluntary Service. Critically, the Lab would not be a government-
    funded or be a corporate entity. It would be a service for the people and by the
    people, rather than waiting for government to pass policy and commission agencies
    to work. The work starts now.


    # Rapid-transition working groups


    Groups organised specifically to push urgent transition could focus on some of
    the following issues:


    > The economy of change. Economists, in consultation with renewable energy specialists,
    transport experts, biologists, natural scientists and so on, will work on the
    cost of converting the world economy to avoid collapse. Where does that money
    come from? We could start with tax evaders, the reduction of military spending
    and fossil fuel subsidies.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Preparing communities – the physicalities. Flood-prediction projects are an
    example of communities getting prepared; they are starting in India as awareness
    grows about the Himalayan glaciers melting and monsoons becoming chaotic and extreme.
    But there will be other adaptation techniques that apply more relevantly in different
    parts of the world. Independent scientists and experts in the Lab would be part
    of a Wikipedia-type model of open, public ownership of the Great Transition.


    Preparing communities for resilience in the Great Transition. The social implications
    of climate breakdown are immense. Work needs to be put in now to developing and
    maintaining sustainable communities; no one will survive alone. Our way of life
    will change not only from lack of the usual resources, but also from the inevitable
    growing climate refugee crisis.


    Food. How do we feed the world in the event of mass collapse of insects, ecosystems,
    and so on? Red meat consumption will need to decrease rapidly and great effort
    put into improving their ravaged soils. The whole population will need to become
    more familiar with growing their food wherever they can, in addition to new farming
    methods and eco-enhancing systems.


    None of these issues are addressed by any trustworthy entity. Global trust in
    the UN has reduced significantly, tech companies aren’t doing enough, and governments
    are reluctant communicators. However, we have models: Vox, Now This and The Projects
    are great examples of using social media to spread critical information about
    important issues. In the mainstream media, David Attenborough and Brian Cox have
    captured the imagination of the world on the subjects of science and protecting
    nature. The transition movement needs to learn from these communicators.


    # Global voluntary service for transition


    In the worst-case scenario, we may need to start building on the great work of
    the Transition Towns initiative on a massive scale. This could be part of the
    work of Citizens’ Assemblies which would organise a voluntary scheme for anyone
    who wishes to lend their skills towards some of the following:'
  merge: -1
  pgno: 78
- img_proc: true
  md: '+   - Flood defences

    - Pre- and post-climate change planning

    - Sustainable communities

    - Renewable energy

    - Disaster preparation, prevention and recovery


    This is essentially the work of local councils and authorities. However, where
    gaps exist, a transition voluntary scheme would supplement and help.


    The transition has to be imagined, visualised, planned and actualised. There is
    no time to lose. It will require new institutions – a parallel social revolution
    to the political revolution we need to transform the state. Again following ‘business-as-usual’
    is no longer an option. We have to be realistic – everything has to change.


    # Conclusion


    It is clear from the above, necessarily sketchy description that defining what
    we need to do is relatively easy. The big issue is, will we choose to do it?


    We must put our bodies on the line and refuse to accept extinction. We are not
    naive as to what this will take. It will mean shutting down cities, shutting down
    companies and if necessary, shutting down parts of the economy. We will be forced
    to do this because the physics requires it. The path we are on goes off a cliff.
    Transition is the only way.


    It is completely realistic to prevent extinction.


    We plan to do so.


    > * Transition Network is a movement of communities coming together to reimagine
    and rebuild our world. See https://transitionnetwork.org.'
