    it means thousands of people learn about a proposed act of mass civil disobedience,
    which makes it more effective.


    It is important to understand why this is important and that it has no bearing
    on the moral debate about whether the police is good or bad. That is a separate
    question and one on which we don''t need to have any collective position. The
    key question is how we can make direct action work to the extent that it creates
    openings for the radical structural changes everyone wants?


    # Proactive and respectful police engagement


    A proactive approach to the police is an effective way of enabling mass civil
    disobedience in the present context. This means police as soon as they arrive
    on the scene and saying two things clearly: ‘This is a nonviolent peaceful action’,
    and ‘We respect that you have to do your job here’. We have repeated evidence
    that this calms down police officers opening the way to subsequent civil interactions.


    The Extinction Rebellion actions have consistently treated the police in a polite
