    # Children’s Crusade, 1963


    Another inspiration is the American movement for black civil rights in the 1960s
    which organised a number of dramatically successful campaigns. One of the most
    famous was the Birmingham, Alabama, campaign of 1963 which shows key elements
    which are promoted in this booklet. The aim was to desegregate the city through
    a nonviolent direct action.


    After failing to make an impression with Martin Luther King, Jr., going to jail
    and the subsequent difficulties of mobilising the adult black residents of the
    city, the idea was hatched to involve the city’s children and young people in
    an ongoing escalation of mass participation civil disobedience. The dilemma action
    design involved thousands of pupils and students leaving school to illegally march
    through the centre of the city. Word spread via local radio stations and meetings
    which promoted the methods of civil disobedience.


    ‘D-Day’ was set response when the mass action would begin. The authorities opted
    for a repression response, arresting 1,000 protesters on the first day and 3,000
    on the second day. This triggered a classic example of the backfiring effect.
    Thousands more children left their classes to protest and fill the jails.


    ‘The fear had gone,’ as one officer reported. After a week there was no end to
    the mass protest. The authorities had lost control, and the opposition collapsed.
    Decades of segregation policies were overturned in a week. This is the power of
    mass civil disobedience. The classic film Mighty Times: The Children’s March (viewable
    on YouTube) is required watching to see these explosive dynamics in action.


    # Jana Andolan II, Nepal


    One of the most recent examples of successful nonviolent civil disobedience is
