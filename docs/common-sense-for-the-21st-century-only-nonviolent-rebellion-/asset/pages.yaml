  md: '# Reformism vs political revolution


    # Reformism to revolution


    The political culture of Western democracies has changed from a reformist to a
    revolutionary structure. It is no longer possible to save our society through
    small incremental steps, as happens with reform. Mass political disruption is
    now required. This is a sociological observation rather than an ideological assertion
    – that is, it is based upon evidence. The evidence can be found in the devastating
    failures of the reformist political class to correctly predict the outcome of
    a whole series of political contests in recent years.


    Arguably this failure started with the Arab Spring and the assumption that the
    Arab people would never rise up against dictatorship, still, win. Then we had
    the meteoric rise of left-wing parties in Greece and Spain – from effectively
    zero support to 30% to 40% support in two years. Then there was the ‘intense embarrassment’
    of the Corbyn and the ability of the Sanders campaign to mobilise 2 million people
    for political revolution in the US. We should also mention the darker side – the
    total ‘surprise’ of Trump.


    The approach of reformism (and am not making any ultimate moral judgement here)
    is that progress is maximised by making small demands and small ‘asks’ of your
    supporters. The logic is that this is more ‘credible’ because it makes some progress
    rather than none. The argument then is that making radical or even revolutionary
    demands is not credible and therefore leads nowhere and thus is ineffective compared
    with the reformist approach.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'This is true in a reformist political context where the common view is that
    society is mostly stable, and the problems that exist can be sorted out by gradualist
    campaigns that make small demands, issue by issue.


    The problem is that, sociologically speaking, not all contexts display signs of
    a reformist political culture. Such a phenomenon is evidenced by mass disillusionment
    and distrust towards the political class and a high level of social repression.
    People conform but don''t want to. This then explains the error of conventional
    analysts, as to predict the results of public votes. On the surface things look
    like a reformist political context nothing revolutionary is happening because
    of the repression, and they presume it''s business as usual.6


    What happens then is when this repression finds an outlet there is a non-linear
    political event, an event that doesn''t follow a logical straight line. Politicians
    like Corbyn offer radical programmes which we are told are not ‘credible’, but
    the possibility for change provides the outlet and pathway, and people are drawn
    to the opening in vast numbers.


    Extinction Rebellion was set up in April 2018 to ‘Tell the Truth and act as that
    truth is real’ on the climate and ecological emergency. Again, this was not a
    credible approach, and the same thing happened, but in the political campaigning
    and social movement sphere, rather than the party-political sphere. The structural
    analysis is the same. Extinction Rebellion said what a lot of people were thinking
    and proposed a pathway to action: ‘We are facing extinction due to the ecological
    crisis and that we should take radical collective action, which means engaging
    in a rebellion against the government.’


    A conventional view – for example, the one I got from the chief executive of Greenpeace
    I met two years ago – was that such an approach lacked ‘credibility’ and, therefore,
    would fail. This view is encased in the reformist space which has dominated politics
    from 1989 until the 2007 financial crisis.


    Times have changed.'
