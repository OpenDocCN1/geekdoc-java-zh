  md: 'This leads to the grave conclusion that the probability of organising a political
    revolution to remove the corrupt political class has a higher chance (if small
    or indeterminate) of succeeding than the chance that the political class will
    respond effectively to the climate crisis (zero chance, as evidenced by the last
    30 years). The penny has finally dropped. The corrupt system is going to kill
    us all unless we rise up. This then is the central meta-strategic point of this
    booklet.


    # The failure of reformism


    Whilst there is no one clear moment we can point to, there are a number of factors
    that contributed to the disastrous delay in addressing climate change, and nearly
    all of them are linked to the emerging neoliberal political economy of the 1980s,
    the financial power and political influence of the fossil fuel industry and flawed
    thinking about how to solve the crisis within the existing political systems.


    One example of a proposal was the 700-page Stern Review published in 2007, written
    by Nicholas Stern and his colleagues at the London School of Economics Granth
    Research Institute. One of the central ideas proposed by Stern was called the
    ''discount rate'' of mitigation costs. This idea suggested that it was possible
    to act on climate change further in the future as technology developed and renewables
    became cheaper.


    Stern would later adjust the discount (or savings) rate he originally suggested
    but the flaw at the heart of the discount rate was that it assumed perfect political
    and economic conditions. For example, it assumed the political willingness to
    invest in new technology in addition to providing large subsidies to renewable
    energy, green transport and less polluting industries. This did not happen because
    the fossil fuel industry created social and political discord by funding anti-climate
    change science groups which manufactured doubt about human influence on the climate.


    The same naïve assumption of perfect conditions can be found in the structure
    of the United Nations Framework on Climate Change (UNFCCC) which uses a consensus
    decision-making system allowing small groups of countries to veto any decision.
    Additionally, the UNFCCC never became an effective governance system to make commitments
    legally'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'binding. This meant a positive outcome relied on rational economic and political
    decision-making processes in an irrational world.


    The UNFCCC assumed that world leaders would support and ratify the outcome from
    the UN Paris Agreement of 2016 as well as the beneficial economic conditions needed
    to finance the transition from fossil fuels. Yet the 9/11 attacks, subsequent
    wars and the financial crash had already pushed the growing climate crisis over
    the political agenda. The result was the weak Paris voluntary agreement that is
    being ignored by the US, Russia and many other governments.


    # The EU cap and trade system: more flawed political economy


    More utopian thinking can be found in the foundation of ‘step-by-step’ gradual
    reform processes like the EU cap and trade system whereby high carbon industries
    were forced to pay for emissions. However, a major flaw in the policy made the
    system ineffective. By allowing all high emitters a free carbon allowance to start
    with, it gave many corporations time to move their production facilities to China
    without penalty. Others simply paid the fines.


    All of these examples relied on the good will of politicians, the good will of
    corporations, pure rationalism and perfect national and international conditions.
    None of these transpired and the reformist process had no plan B. Meanwhile, the
    political systems that are supposed to protect us became increasingly ‘bought’
    by the fossil fuel lobby whilst simultaneously exploiting concerns about the environment
    to obtain votes from centrist voters.


    Needing to keep voters, and having their hands tied by powerful interests, governments
    worldwide are seemingly unable to make the necessary changes. That’s why a Rebellion
    is necessary.'
