- img_proc: true
  md: '+   • Electrify everything we can and ration the supply of fossil fuels including
    petrol for cars.


    +   • Mandate a compound 10% per year reduction in plane travel for the first
    5 years and achieve this through taxes, which can then be used to invest in alternatives
    including rail infrastructure.


    +   • Incentivize carbon sequestration on a large scale by establishing a system
    to pay farmers and landowners for increasing soil carbon, which also enhances
    soil quality.


    +   • Drive changes in diet that reduce emissions and enhance health through policy,
    including pricing and public education like successful World War II campaigns
    and Meat Free Monday.


    +   • Scale up standards for the built environment with zero-carbon housing and
    transit-oriented development. Subsidise energy efficiency retrofits in low- income
    housing.


    +   • Use demand management to match energy use with availability.


    # The economics: can we afford all this?


    That’s an odd question. We face the collapse of the global economy and civilisation
    with the potential for the extinction of much of life on earth, and we ask if
    we can afford to stop that? Do we think carrying on with collapse might be cheaper?


    Yes, we can afford this, and it’s actually not that expensive. Government has
    considerable financing powers to make sufficient funds available. As argued in
    Randers and Gilding’s ‘One Degree War Plan’, a carbon tax of $20 per tonne, rising
    by $20 each year for 5 years to $100, would raise around $800 billion in the first
    year and around $4 trillion by year 5. This would be approximately 1–3% of GDP.
    That is just one of the many mechanisms available. Money raised should be used
    to fund the emergency response and to alleviate the resulting hardship – primarily
    among the poor.


    Such an economic mobilisation has many potential benefits, including increased
    equality, higher employment and the integration and social cohesion of society.'
