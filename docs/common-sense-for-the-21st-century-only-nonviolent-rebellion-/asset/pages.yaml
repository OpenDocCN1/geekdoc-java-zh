  md: '# Accepting the truth is the first step


    # What is the ‘truth’?


    We have to start with what is true. One of the main problems we have experienced
    with climate change and environmental activism is that people rarely seem to talk
    about empirical reality (i.e. the latest science) and thus aren’t even aware of
    how desperate the situation actually is. We have even ‘chosen’ to rubbish the
    science and the scientists because they are not telling us things we want to hear,
    so it’s easier for us to believe they are wrong.


    This is a form of denial that many do not realise they have fallen victim to.


    Campaigners often believe they know the magnitude of the problem we face. However,
    ‘knowing’ is not a binary concept when it comes to grief-inducing catastrophic
    information. You think you know it but then you realise you haven’t processed
    it emotionally. You think it emotionally but then you realize you haven’t done
    it sufficiently. This leads to a form of ‘unconscious denial’ which in turn leads
    to a form of personal protectionism.


    People live with their unconscious denial because to accept the truth and act
    it was like real might endanger their relationships with family, friends and co-workers
    (see Professor Dan Kahan’s research from Yale on science communication).³ The
    issue of climate change became a taboo issue which led to a default of inaction
    from the general public beyond basic recycling activities.


    # A quick update on the latest science'
  merge: -1
