  md: '# Why a Rebellion?


    Earth, we have a problem to solve


    Societies around the world did not allow the current ecological collapse. Governments
    did. Since the 1990s, a false narrative was promoted around the world that individuals
    should take responsibility for their ‘carbon footprint’. Or that ‘it’s the corporations’,
    the fossil fuel and other only polluting industries, that are to blame. Yet governments
    are the only institutions with the power and the responsibility to protect us
    from harm. But they haven''t used power.


    In the UK and around the globe, people have inherited a governmental system and
    a civil society community of environmental NGOs unable to address the threat we
    now face to the continued existence of humankind. Government is something created
    by society to protect us from such threats, yet it has failed.


    We need to rescue the concept of revolution from a rigid left-wing political ideology
    and reconnect with a more open, popular 19th century tradition which demands we’ve
    had enough of corruption and the gross abuse of power. The problem resides with
    the state and its capture by the corporate business class.


    There is no avoiding the following analysis: the world’s present political systems
    have facilitated a 60% increase in global emissions since the beginning of the
    crisis in 1990 and have no ability to stop a continued rise in CO₂, let alone
    create the political will to massively reduce levels (40% in the next ten years
    according to the UN October 2018 report).'
