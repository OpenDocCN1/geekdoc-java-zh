  md: '# Building alliances


    Join the Rebellion!


    Potential political and cultural allies should be lobbied and briefed in the months
    before the Rebellion. The message should promote the three key motivators for
    revolution in contemporary Western democracies: 1. accelerating climate and ecological
    crisis, 2. extreme inequality and 3. corrupt politicians and governments. This
    is a crucial movement- building challenge and is vital to mass mobilisation. The
    Rebellion has to morph at the last moment into a general rebellion against ‘all
    government failures’ in order to catch the regime off guard.


    This prevents any opposition from framing us as just ‘environmental’ protestors’
    and therefore be dismissed as a ‘special interest’ group. A key miscalculation
    which elites repeatedly made with uprisings is that they think it is just about
    one issue or group, not anticipating how rapidly it can change into a general
    rebellion against the all-encompassing illegitimacy of corrupt elite power. Our
    plan must include actions to proactively promote this overarching narrative.


    Decentralised direct actions build the credibility with which to approach potential
    allies. It is not a matter of just presenting arguments but showing you walk your
    talk. Movement-building actions should take place in all the cities and towns
    around the country, aiming to build a ‘movement of movements’. Hundreds of local
    groups can then approach local potential allies with offers of talks and joint
    workshops.


    The approach should be that we all need to work together because we all know the
    political system is not working and now it is going to take us to our deaths with
    the climate crisis. We need to rebel before it is too late.'
