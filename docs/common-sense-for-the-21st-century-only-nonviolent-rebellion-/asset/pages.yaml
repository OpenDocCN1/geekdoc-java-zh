    # Political allies


    Environmental NGOs – such as Avaaz, Friends of the Earth and Greenpeace – are
    potential partners for mass civil disobedience actions. However, if they do not
    initially come on board, it may take a well-designed directaction campaign which
    minimises the chances of alienation (by finding common ground) while maximising
    the chances of cooperation. This will be done by a ‘maximum respect and maximum
    disruption’ process.


    The framing is positive: ‘They have done great activism in the past, but now it’s
    time to change’, combined with short noisy occupations combined with media-attracting
    symbolic actions. These actions could be linked to a specific demand: that the
    institution or group declare a climate emergency and provide specific resources
    for mass civil disobedience. They can do an allied action at the same time and/or
    join in the main Rebellion activities. The time for joint meetings and joint statements
    is over. We need concrete commitments to support the Rebellion.


    The key aim here is to create a domino effect. The Independent Workers’ Union
    of Great Britain (IWGB) achieved this in wages in their confrontation with exploitative
    courier companies for better wages. They used nonviolent disruptive action to
