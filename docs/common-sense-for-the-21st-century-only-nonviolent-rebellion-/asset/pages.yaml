    of the demographic composition of the country. This proposal then is both concrete
    and democratic.


    The National Citizens’ Assembly will become the new governing body of the UK and
    will deal with the climate crisis. It will make decisions on the following:


    +   - Legislation to transform the economy and society to respond to the existential
    climate and ecological emergency.

    - Other social legislation which follows the will of the assembly rather than
