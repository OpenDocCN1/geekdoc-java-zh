    激进直接行动从定义上来说是一种排他性的行为——并非每个人都能或愿意这样做。但它也是结构性变革发生的途径。然而，我们需要向那些激进的“左翼”批评者论证，我们必须包含那些无法参与激进直接行动的人。我们应该使用一种新的普遍主义语言，以马丁·路德·金的演讲为主要例，说明如何重新夺民族自豪感的框架，以建立一个广泛的大众公民不合作联盟。


    这里的观点虽然困难，但有效性所在之处不容置疑。任务是反复强调，我们需要一场集中在单一事件——“反叛”上的大规模、高参与度的公民不合作。如果我们对面临的生态危机真相认真的，我们必须对有效的组织和反叛同样同样的严谨。良好且周全地完成任务是我们的道德义务。


    ## 正确的反叛后处理


    ### 公民大会（Citizens’ Assemblies）


    反叛后成功的关键是将爆发出的激进政治能量转化为一种做出集体国家决策的合法手段。公民大会机制的精彩之处在于，它同时诉诸自由主义和革命性的价值观。它是可行的，过去一二十年的应用已经证明了这一点。


    它是深层民主且大众的（涉及普通人），因此任何民主主义者或自由主义者都无法反对它——这与革命性左翼精英为了建立社会主义社会而消除民主程序的危险形成了对比（这种事发生过并经历过了！）。同时，它让革命者留在了阵营，因为它创造了一个论坛，让知情的审议和理性最终有空间击胜大资金的权力和腐败。


    而且理由正充分，我们可以预测，大会的结果将比传统的、愤世嫉俗的评论员所预测的要进步和理性得多；不，我们不想让富权阶级剥夺我们的劳动果实，我们也不想我们的孩子死于气候灾难，非常感谢。。


    于是，这一提议兼顾了两者的优势。它提出了一个受社会科学证据支持¹²的清晰且可信的解决方案。我们已经证实，当一个社会达到极端不平衡的节点时，只有革命性的事件才能成功地使其重新定位。这种重新定位通过将通常的“胜者全制”民主变为产生共同决策的抽签制度（sortition
    system）来实现具体化，从而为解决政治核心问题：“谁来做决定？”提供了一条清晰的反叛后解决路径。


    一个能让自由主义和革命性群体都满意的解决方案是必要的。只有当这两种政治取向结盟时，精英才会倒台。我们策略的关键部分将是将该计划推销给关键的自由主义精英“叛变者”，以及将领导动荡的1%的普通人口。


    #### 公民大会的更多细节


    公民大会通过抽签程序（即从社会各个领域随机选择公民）选产生，在过去几年中变得非常流行，特别是关于英国脱欧本可以更有效地进行审议。从本质上说，它们是原始民主观念的根源。作为公民大会的一部分，被选中的公民对某个问题有了360度的理解，这使他们比政治家更有能力做出决策，因为政治家受到游说者攻势和职业主义考量的影响，这两者都会让他们偏离为全所有人寻求最佳结果的明智选择这一简单问题。


    公民大会允许普通公民了解并决定那些对于担心选民反响的政治家来说往往难以处理的问题。2016年爱尔兰公民大会就是一个很好的例子，说明了一个本可能摧毁政治生涯的问题是如何通过99名随机选择的公民被采纳并审议的，并成功废除了一部魔化女性并剥夺她们对自身身体做决定权的古老法律。


    在气候崩溃以及社会如何避免其最坏影响的情况下，公民大会是我们唯一真正民主的希望。那些被证明是必要的转型，对于任何提出所需变革的政党来说都意味着政治死亡。它是当今被企业俘获的、破碎的民主的解药，并预示着一个真正由人民运行、为人民运行，并将所有人的福祉作为核心运营原则的未来。


    ## 权力转型


    反叛后的计划需要详细的推演才能具有公信力。我建议可以有一个通向永久新宪法安排的过渡期。为此，将建立一个由专业人士创建且透明的国家公民大会（NCA），其中可能包含1000人，固定期限为两年。它将建立地区和城市公民大会，以促进权力的去中心化。


    国家公民大会将处理社会和政治立法，制定应对气候危机的紧急措施。它还将制定一部新宪法，确保此类大会成为我们政治生活的常态。


    ## 连续性至上


    英国在结构结构性变革时刻避免大规模流血的政治传统，可以通过以下方式创造某种连续性来延续。在过渡时期，议会可以仍然存在，但将采用比例代表制。它将对NCA起到咨询作用，其关系类似于目前贵族院与下议院的关系。


    可以建立一个流程，由NCA在政策专家和律师的帮助下产生一份法案，然后发送给下议院进行辩论和批准。如果被拒绝，NCA可以在三个月后将其发回。这一过程可以重复。然后，NCA将拥有最终的颁布权。这里的关键设计点在于最终权力属于NCA。


    这个想法是让宪法中拥有像18、19世纪那样的某些“尊严”部分。在18世纪，君主仍掌握控制权，但权力传递给了贵族。随后下议院接管了贵族院，并在19世纪变得日益民主。我们应该提供一种满足对不可估量的仪式感和传统连续性需求的方法，使权力实现民主化。我们可以在巴西的阿雷格港通过世界上最成功的参与政治系统中看到这一过程的复制。社区大会选出任期一年的代表共同制定预算。草案预算被制定，然后返回大会进行反馈。然后制定最终预算并提交给惯常市会，市会必须同意该预算。从技术上讲，大会没有宪法权力，市会拥有主权，但市员们知道真正的权力属于大会的力量，因此绝不会否认这一点。


    贵族院和女王可以拥有一个仪式性的角色。这可以由NCA决定。保留下议院也是必要的，以克服传统主义的反对（尤其是来自工党的）。


    ## 推动奥弗顿窗口：失败为成功奠定基础


