  - '[PAGE 81]


    also intricately connected social beings. We will therefore stand together and
    survive, or die separately.


    In the West, the discovery of this middle ground gave birth to our most glorious
    political discovery – the assertion of a set of universal rights and obligations
    which act as a bulwark against both individualist narcissism and murderous autocracy.
    In this booklet, I assert along with Thomas Paine who inspired the title, the
    people come first against any special interest – whether that is a tyrannical
    monarchy or a corrupted merchant class.* The people have the right to decide,
    and in return, the people need to step up to their obligations. Rights and responsibilities
    go hand in hand.


    And so again today there is a need for us to step up and make the sacrifices that
    our forefathers made many times before to win the freedoms we enjoy. We are about
    to lose them if we do not wake up and act. This will necessitate giving up jobs
    and taking time away from our families. It requires pain and suffering because
    no common good has ever been created without those things – especially as we enter
    our darkest hour. This is what growing up means: to see a situation as it is than
    how you would like it to be and respond in a responsible manner.


    A Rebellion, as outlined in this booklet, is not a consumer choice – not an act
    of possession or enactment of an identity. If it is, then it will fail miserably.
    It can only work as an act of universal service and duty – a fulfilment of our
    civic and republican tradition which pulled us out of the dark ages and lives
    of impoverishment. It is a rugged, anti-utopian liberalism that asserts the truth
    that power corrupts, and that ‘absolute power corrupts absolutely’. It was always
    thus and will be.


    Our absolute power over nature has so thoroughly corrupted us that we are now
    intent on destroying that part of nature which is our children. Their blood on
    the pavements; their body parts in the streets. Let us be clear that this is what
    is coming down the tracks if we fail in our duty. This is what social breakdown
    looks like – quite simply a living hell for the billions of our young people.


    The situation is serious – deadly serious. The propositions in this booklet are
    serious. This is not an academic exercise. I have been arrested many'
  - '[PAGE 82]


    times, and I''ve been to prison and I expect the need for this sacrifice to continue.


    This is where we are now. What is proposed in this booklet is not certain, but
    based upon the evidence it is our best bet. We can no longer afford the luxury
    or indulgence of hoping for perfect political and economic conditions. Ignoring
    the social science on how to bring about rapid and radical political change is
    as immoral and criminal as ignoring the climate science.


    We can delude ourselves if we so wish, but we can be assured the next generation
    will be free of such delusions. They will be in the middle of the chaos of ecological
    collapse. They will want the prosecution of those who created the hell they will
    face. Think on that. Feel it in your body. And then act.


    Friends, there are no easy options anymore. There is only one way that leads to
    true self-respect – and that is Rebellion.


    # Let’s get to it.


    Roger Hallam


    > * For more information about Thomas Paine’s Common Sense, see Wikipedia.'
