    nonviolent way through mass civil disobedience – but one way or another it is
    coming, racing down the tracks.


    > Lock-ons are tactics used by individuals to make it harder for police to remove
    them from the scene of an action. This might be locking themselves to buildings
    with bike locks or glue.

    > † A dilemma is a type of nonviolent civil disobedience designed to create a
    ''response dilemma'' or ''lose–lose'' situation for public authorities by forcing
    them to either concede some public space to protesters or make themselves look
    absurd or heavy-handed by acting against the protest.


    ## Building alliances


    Join the Rebellion!


    Potential political and cultural allies should be lobbied and briefed in the months
    before the Rebellion. The message should promote the three key motivators for
    revolution in contemporary Western democracies: 1. accelerating climate and ecological
    crisis, 2. extreme inequality and 3. corrupt politicians and governments. This
    is a crucial movement-building challenge and is vital to mass mobilisation. The
    Rebellion has to morph at the last moment into a general rebellion against ‘all
    government failures’ in order to catch the regime off guard.


    This prevents any opposition from framing us as just ‘environmental’ protestors’
    and therefore be dismissed as a ‘special interest’ group. A key miscalculation
    which elites repeatedly made with uprisings is that they think it is just about
    one issue or group, not anticipating how rapidly it can change into a general
    rebellion against the all-encompassing illegitimacy of corrupt elite power. Our
    plan must include actions to proactively promote this overarching narrative.


    Decentralised direct actions build the credibility with which to approach potential
    allies. It is not a matter of just presenting arguments but showing you walk your
    talk. Movement-building actions should take place in all the cities and towns
    around the country, aiming to build a ‘movement of movements’. Hundreds of local
    groups can then approach local potential allies with offers of talks and joint
    workshops.


    The approach should be that we all need to work together because we all know the
    political system is not working and now it is going to take us to our deaths with
    the climate crisis. We need to rebel before it is too late.


    Once we have established the credibility of our strategy and ways of working,
    we can build support through two key developments: working with other groups and
    organising People''s Assemblies.


    ## Approaching NGOs and political groups


    First, we can work with allied non-governmental organisations (NGOs) and radical
    political networks to hold joint actions and occupations. This would build the
    narrative of the connections between the ecological catastrophe, gross inequality
    and corrupted democracy. Practical cooperation and joint trust-building local
    actions will build the foundations for the strategic plan of the ''movement of
    movements'' rebellion in the capital city.


    ## People''s Assemblies


    Second, and more structurally, we need to organise hundreds of People’s Assemblies
    on the theme of ‘How to solve the ecological crisis’, or more simply, ‘What is
    going on with the climate crisis and everything else?’ People’s Assemblies are
    similar to Citizens’ Assemblies, but without the process of sortition. Experts
    from around the world can help train facilitators and support groups towards central
    importance.


    The assemblies have an attractive format which draws in ordinary people. They
    are based around short two-minute personal testimonials and smaller break-out
    groups through which concerned citizens will create a new vision of the social
    and political transition needed to address the crisis.


    Taking over large public spaces to have these assemblies would create dramatic
    political theatre, particularly if they happen in the context of disruptive and
    sacrificial direct actions. All this bottom-up political energy would be funnelled
    into a new revolutionary agenda, ‘We have had enough of politics as usual, and
    we want a new political system’.


    This new political awakening is legitimised through the demand for a National
    Citizens’ Assembly, a formalised gathering of ordinary people selected in a systematic,
    randomised way from all sectors of the general population. The framing could be:
    ‘The people have better ideas about what’s needed than the politicians, so let
    the people decide’. A national assembly could then be set up to provide a living
    example of how we can organise our political life in a way which is truly democratic
    and inclusive.


    ## Political allies


    Environmental NGOs – such as Avaaz, Friends of the Earth and Greenpeace – are
    potential partners for mass civil disobedience actions. However, if they do not
    initially come on board, it may take a well-designed direct-action campaign which
    minimises the chances of alienation (by finding common ground) while maximising
    the chances of cooperation. This will be done by a ‘maximum respect and maximum
    disruption’ process.


    The framing is positive: ‘They have done great activism in the past, but now it’s
    time to change’, combined with short noisy occupations combined with media-attracting
    symbolic actions. These actions could be linked to a specific demand: that the
    institution or group declare a climate emergency and provide specific resources
    for mass civil disobedience. They can do an allied action. The time for joint
    meetings is over. We need concrete commitments to support the Rebellion.


    The key aim here is to create a domino effect. The Independent Workers’ Union
    of Great Britain (IWGB) achieved this in wages in their confrontation with exploitative
    companies. Choosing the nearest allies first is the starting point, then move
    onto the rest.


    The starting point then would be the NGOs with their massive resources and promotion
    of methods, which are now discredited as ineffective and too slow. Several of
    these are on board. The objective might not to recruit the top management but
    to encourage radical change within their organisation from staff and members eager
    to join civil disobedience.


    A similar process of creating allies, and/or creating disaffection through direct
    actions, should be organised for left-wing and other progressive organisations.
    Again, the message should be: ‘The time for conventional politics is over, we
    are in an emergency, rebellion is now necessary.’


    ## Local councils and other civic institutions


    Other alliance opportunities exist with councils and civic institutions declaring
    a climate emergency. This should be seen as the beginning of the end of the old
    regime, not as a paper exercise as it is at the present time. The hypocrisy of
    accepting the truth but not taking appropriate action makes these institutions
    more complicit in the criminality of the political class. The way forward here
    is to call on councils to give central government an ultimatum to call an emergency
    and act accordingly.


    When nothing happens, they should be asked to break off administrative and financial
    cooperation with the genocidal regime. Council leaders should go on hunger strike
    to show their horror at the inaction of central government; people could withhold
    part of their tax or refuse volunteer roles that many local governments rely on.
    Such dramatic developments will attract the attention of the city and regional
    press, particularly when combined with occupations of council meetings and administrative
    offices.


    These local political dramas will raise the movement’s profile around the country
    and thus increase recruitment for a central civil disobedience event.


