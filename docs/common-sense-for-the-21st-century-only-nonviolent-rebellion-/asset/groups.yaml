    ## Blocking critical infrastructure


    Another action design is an economic disruption. A primary candidate for such
    disruption would be to block the roads leading out of a major port, for example
    Dover, UK, through most of our food imports enter the country. This could ideally
    involve several thousand people and take place over several days. Again, there
    would be several meetings with the police to assure them that it would be totally
    nonviolent, and we respect they will have to do their job and arrest people if
    they so choose.


    The event would be publicly advertised, and so the press and companies involved
    would know well in advance. Knowing in advance might enable people to change their
    plans, but this in itself would cause disruption and a possible overreaction.


    Mass civil disobedience is best organised through open actions. Once we have a
    thousand or two thousand people taking part, it is very difficult to stop such
    significant disruption from happening. Again, the tactic is that the police will
    opt for orderly arrests rather than more aggressive attempts to stop the action
    – especially as we would have informed the police in advance of the peaceful nature
    of the planned civil disobedience.


    The activists would organise shifts of Affinity Groups, ideally several hundred
    at a time, occupying the motorway. People would stay for a long period on the
    motorway until arrested.


    Alternatively, this could be combined with a ‘swarming’ design, which is to move
    in and form a large, dense group, which could block motorway turn-offs or off-ramps
    and would continue until the threat of arrest became real, at which point the
    protest would be stopped. ‘Swarming’ is a fast-moving, swiftly adaptive action,
    like the behaviour of a swarm of bees moving from hive to hive. Such swarming
    could continue for several days.


    This combination would result in national media reporting on a powerful event
    which involves many arrests and/or the effective blocking of a major port. Specific
    details and artistic contributions would come from the local groups. An initial
    successful event could then progress to another larger event which could involve
    several road or motorway blockages around other ports in the country.


