    ## 经济学问题：我们负担得起这一切吗？


    这是一个奇怪的问题。我们面临着全球经济和文明的崩溃，以及地球上大部分生命灭绝的风险，而我们却在问是否负担得起停止它的代价？难道我们认为继续崩溃可能会更便宜吗？


    是的，我们负担得起，而且实际上并没有那么贵。政府拥有相当大的融资能力来提供充足资金。正如 Randers 和 Gilding 在《一度战争计划》中所述的，每吨20美元的碳税，每年增加20美元，在5年后达到100美元，将将在第一年筹集约8000亿美元，到第五年筹集约4万亿美元。这大约占GDP的1–3%。这只是许多可用机制之一。筹集的资金应用于应急响应和缓解随之而来的困难——主要是针对贫困人口。


    这种经济动员具有许多潜在益处，包括增加平等、提高就业率，以及社会的整合与社会力凝聚力。


    ## 一场新的转型运动：如果政府不听，那么人民将采取行动


    在现有的转型网络（Transition Network）的基础上，需要一场重大的群众运动来组织气候变化的缓解、生态恢复，以及对未来变化的准备和适应。我们需要像
    TransitionLab.earth 这样的计划，它侧重于高水平的志愿者服务（如工程和方案实施），而不是更多的政策性“智库”。例如，发明者可以研究开发电池技术，并免费提供专利。事实上，所有有益的研究都应该是共有领域的一部分——供免费且无限制地使用。


    一个数据科学家专家小组可以开发人工智能，帮助预测英国受影响最严重的地区，然后工程师可以设计系统来减轻影响。这类努力正在全球进行，但需要一个公民可以参与的中心平台。


    应该建立一个实验室，由科学家、工程师和其他地球增强型专家组成，负责提供建议、回答问题，并听从公民大会（Citizens’ Assemblies）的指示。基于这种协作工作，大会将继续组织人员组成一支“公民志愿者兵团”。至关重要的是，该实验室将不会是政府资助的实体，也不会企业实体。它将是一项为人民服务、由人民提供的的服务，而不是等待政府通过政策并委托机构工作。工作从现在开始。


    ## 快速转型工作组


    专门为推动紧急转型而组织的小组可以关注以下某些问题：


    > 变革的经济。经济学家咨询可再生能源专家、交通专家、生物学家、自然科学家等人的意见，将研究全球经济转型的成本以避免崩溃。这些钱从哪里来？我们可以从逃税者入手、减少军事开支和化石燃料补贴开始。


    准备社区——物理层面。洪预测预测项目是社区做好准备的例子；它们在印度启动，随着人们对喜马拉雅冰川融化以及季风变得混乱和极端的意识日益增强。但还会有在世界不同地区更具性的适应技术。实验室中的独立科学家和专家将成为类似于维基百科模式的一部分，即对“大转型”进行开放的、公共的所有。


    让社区在大转型中做好韧性准备。气候崩溃的社会影响是巨大的。现在就需要投入工作来开发和维护可持续社区；没有人能孤自生存。我们的生活方式将改变不仅是因为缺乏通常资源，还因为不可避免的日益加剧的气候难民危机。


    食物。在昆虫、生态系统等发生大规模崩溃的情况下，我们如何养活世界？红肉消费需要迅速减少，并投入巨大努力来改善他们遭受破坏的土壤。除了新的耕作方法和生态增强系统外，全体人口都需要更熟悉如何在一个任何可能的地方种植自己的食物。


    这些问题中没有一个是被任何值得信赖的实体解决的。全球对联合国的信任显著下降，科技公司做得还不够，政府是不愿沟通的。然而，我们有模型可以参考：通过社交媒体传播关于重要问题的关键信息，Vox、Now
    This 和 The Projects 是利用社交媒体传播此类信息的极佳案例。在主流媒体中，大卫·爱登堡（David Attenborough）和布莱恩·克斯（Brian
    Cox）在科学和保护自然的主上捕捉了世界的想象。转型运动需要向这些传播者学习。


    ## 全球转型志愿者服务


    在最坏的情况下，我们可能需要在大范围内基于“转型城市”（Transition Towns）倡议的伟大工作。这可以是公民大会工作的一部分，它们将为任何愿意贡献技能以支持以下工作的人组织一项志愿者计划：


    - 洪灾防御

    - 气候变化前后的长期规划

    - 可持续社区

    - 可再生能源

    - 灾害准备、预防和恢复


    这本质上是地方委员会和当局的工作。然而，在存在空白的地方，转型志愿者计划将提供补充和帮助。


    转型必须被构想、视觉化、计划和实现。没有时间可以浪费了。它需要新的机构——一场转型国家的平行社会革命。再次，遵循“常态化”不再是一个选项。


    ## 结论


    从上述不完全的描述可以清楚，定义我们需要做什么相对容易。大的问题在于，我们是否会选择这样做？


    我们必须投入行动并拒绝接受灭绝。我们对于这需要什么并不天真。这意味着将关闭城市、关闭公司，并在必要时关闭部分经济。我们将被迫这样做，因为物理规律要求如此。我们所处的道路正通向悬崖。转型是唯一的途径。


    防止灭绝是完全可能的。我们计划这样做。


    > 转型网络（Transition Network）是一个社区聚集在一起重新构想并重建我们世界的运动。访问 https://transitionnetwork.org。

