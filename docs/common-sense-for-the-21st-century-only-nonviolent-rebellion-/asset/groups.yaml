- md: '

    Radical direct action is by definition an exclusive act – not everyone can or
    is willing to do it. But it is also the way that structural change happens. However,
    we need to make the argument to our radical ‘left’ critics that we must include
    those who cannot take part in radical direct action. We should be speaking a new
    universalist language, using Martin Luther King, Jr.’s speeches as a prime example
    of how to reclaim the framings of national pride to build a broad mass civil disobedience
    coalition.


    The points here are difficult, but there is no question where effectiveness lies.
    The task is to reiterate again and again that we need mass, high-participation
    civil disobedience concentrated upon a single event – a Rebellion. If we are serious
    about the truth we face with the ecological emergency, we have to be equally serious
    about organising and rebelling effectively. To do it well and thoughtfully is
    our moral duty.


    ## Post-Rebellion done right


    ### Citizens’ Assemblies


    The key to success post-Rebellion is to channel an explosion of radical political
    energy into a legitimate means to make collective national decisions. The brilliance
    of the mechanism of Citizens'' Assemblies is that it appeals to both liberal and
    revolutionary values. It is doable, as is demonstrated by its use over the past
    decade or two.


    It is deeply democratic and popular (involves ordinary people) so that no democrat
    or liberal can object to it – as opposed to the danger of a revolutionary left-wing
    elite removing democratic processes in a bid to create a socialist society (been
    there and done that!). At the same time, it keeps the revolutionaries on board
    because it creates a forum where informed deliberation and reason will finally
    be given space to trump the power and corruption of big money.


    And for good reason, we can predict that the outcomes of assemblies will be far
    more progressive and rational than conventional, cynical commentators would predict;
    ‘No, we don’t want the rich and powerful robbing us the fruits of our labour,
    and no, we don’t want our children to die in a climate catastrophe, thank you
    very much.’


    The proposal then gets the best of both worlds. It proposes a clear and credible
    solution that is supported by the social scientific evidence.¹² We have established
    that when a society reaches a point of extreme imbalance, only a revolutionary
    episode can be successful in reorientating it. This reorientation is concretised
    through a replacement of the usual first-past-the-post democracy with a sortition
    system that comes to shared decisions, and as such provides a clear pathway to
    a post-revolutionary resolution to the central question of politics: ‘Who decides?’


    A solution which is satisfactory to both liberal and revolutionary constituencies
    is necessary. It is only when these two political orientations make an alliance
    that an elite falls. A key part of our strategy will be to sell the plan to a
    critical mass of the liberal elite ‘defectors’ as well as to the 1% of the general
    population who will lead the disruption.


    ### Citizens’ Assemblies in more detail


    Citizens’ Assemblies, chosen by the process of sortition (i.e. randomly selecting
    citizens from all sectors of society), have become very popular over the past
    few years, especially regarding how Brexit could have deliberated over more effectively.
    In essence, they are the roots of original notions of democracy. As part of a
    Citizens’ Assembly, the selected citizens are exposed to a 360-degree understanding
    of an issue, which puts them in a better position to make decisions than politicians
    who are under the influence of a barrage of lobbyists and careerist considerations,
    both of which take them away from the simple matter of making an educated choice
    that is aimed at the best outcome for all.


    Citizens’ Assemblies allow ordinary citizens to learn about and decide on issues
    that are often too hot to handle for politicians who fear repercussions from the
    electorate. The Citizens’ Assembly in Ireland 2016 is a good example of how an
    issue could have destroyed a political career was taken on and deliberated over
    by 99 randomly chosen citizens to great effect and succeeded in repealing an archaic
    law that demonised women and took away their right to make decisions about their
    own bodies.


    In the case of climate breakdown and how society is going to avoid the worst effects
    of it, Citizens’ Assemblies are our only truly democratic hope. The transition
    that will shown necessary would be political death for any one party they suggest
    the changes that will be required. It is the antidote to the corporate-captured,
    broken democracy of today and indicates a future that can be run truly by the
    people and for the people the well-being of all as the central operating principle.


    ## A transition of power


    The post-revolutionary plan then needs some detailed working out to be credible.
    I suggest there could be a transition period leading to a permanent new constitutional
    settlement. For this a professionally created and transparent National Citizens’
    Assembly (NCA) would be established containing, maybe, 1,000 people for a fixed
    period of two years. It would then create regional and city Citizens’ Assemblies
    to facilitate the decentralisation of power.


    The National Citizens’ Assembly would deal with social and political legislation,
    enacting emergency measures on the climate crisis. It would also create a new
    constitution which would ensure such assemblies were a permanent fixture of our
    political life.


    ## Continuity is king


    The British political tradition of avoiding mass bloodshed at such moments of
    structural change could be continued by creating a semblance of continuity in
    the following manner. In the transition period, Parliament could still exist but
    with a proportional representation system. It would then have an advisory role
    to the NCA in a similar relationship to that which the Lords have with the Commons
    at present.


    A process could be set up whereby the NCA would produce a piece of legislation
    with help from policy experts and lawyers, which would be sent to the Commons
    for debate and approval. If it was rejected, then the NCA could send it back after
    three months. This process could then be repeated. Then the NCA would have the
    final power of enactment. The critical design point here is that the final power
    resides with the NCA.


    The idea is to have some ‘dign’ part of the constitution as developed in 18th
    and 19th centuries. In 18th century, the monarch was still in control, but real
    power passed to the aristocracy. Then the Commons took control over the Lords
    and became progressively more democratic during 19th century. We should provide
    a way of satisfying the not-to-beestimated desire for ritualistic and traditional
    continuity, enabling real power to become democratised. We can see a contemporary
    example of this process replicated through the most successful participatory political
    system in the world at Porto Alegre in Brazil. Neighbourhood assemblies elect
    one-year representatives to join together to create a budget. A provisional budget
    is drawn up and then goes back to the assembly for feedback. Then a final budget
    is drawn up and presented to the conventionally constituted city council which
    always has to agree to the budget. Technically, the assemblies have no constitutional
    power, and the council is sovereign, but the councillors know that real power
    resides in the people power of the assemblies and so would never deny their.


    There could be a ceremonial role for the Lords and the Queen. It could be up to
    the NCA to decide on this. Keeping the Commons, too, could be necessary in order
    to overcome traditionalist opposition (not least from Labour Party).


    ## Pushing the Overton window: failure lays the foundations for success


    On deciding on this strategy, there are two outcomes which are both very attractive.
    First is the classic revolution as outlined above. The government’s power to address
    climate change is removed, and the new people’s power takes its place. However,
    there is a second scenario, which in the present context is clearly preferable
    to any reformist orientation, and that is what I would call the ‘glorious failure’:
    the Rebellion does not succeed, but it has a massively empowering effect on the
    national and international imagination by shifting the agenda towards what can
    concretely be asked for and planned for – namely system change.


    This is called transforming the Overton window, the range of ideas that are openly
    discussed in public debate. If failure enables previously unspoken possibilities
    and realities to be discussed, then we have not failed. In fact, we have made
    a critical contribution to the transformational changes that now have to happen.


    Although we may ‘fail’, the baton will be passed to other runners in the team
    who will learn from our mistakes and win the prize (e.g. the French).

