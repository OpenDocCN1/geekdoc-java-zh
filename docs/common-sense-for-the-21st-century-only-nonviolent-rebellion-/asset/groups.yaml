    them. Established groups tend to become attached to the ways in which they have
    always done things and find it difficult to change.


    The Rising Up! network was set up to question this conservatism – the unwillingness
    of activists to look at new strategies and tactics. † The hope was by trying tactics
    ‘will not work’ according to conventional activist wisdom, we would find something
    that will. A key discovery is that mass civil disobedience works better than any
    other strategy. This is no accident as the main scientific research on the subject
    (Why Civil Resistance Works) shows that mass participation civil disobedience
    is the most successful strategy in bringing down regimes.⁷


    Whilst yet seemed like a good idea at the time the unwillingness of the media
    to cover environmental issues, small-scale direct actions (for example by NGOs
    like Greenpeace) have had to no meaningful impact on government policy. This poses
    a challenge to many traditional direct-action activists who believe that high-risk,
    media-stunt actions can be as or more effective than the general public or ‘activism
    novices’ sitting in roads in thousands.


    There is often an implicit elitism in the direct-action environmental movements
    – an unwillingness to engage with the public directly and organise them to break
    the law on a large scale. Dramatic actions can be highly effective but only once
    thousands of people are already involved in civil disobedience. In such cases
    they can inspire more people to step up and break the law.


    My argument is that radical change is primarily a numbers game. Ten thousand people
    breaking the law has historically had more impact than small-scale, high-risk
    activism. This was demonstrated by Extinction Rebellion when thousands of ‘first
    time’ activists blocked the bridges in November 2018 and London streets during
    April 2019. These were the biggest civil disobedience actions for decades and
    were covered globally by the media. Their actions continues to have major inspirational
    effects around the world, but it required no high risks and was done peacefully.
    The key challenge then is to reduce the barriers to participation in such mass
    mobilisations.


    ## The importance of openness


    Being able to mobilise large numbers opens up a third possibility not available
    in the traditional context of activism-as-usual. It means that lots of people
    can break the law (in a minor way) even if the police know about it. This allows
    campaigners to be completely open about the events. This is a game changer because
    it means thousands of people learn about a proposed act of mass civil disobedience,
    which makes it more effective.


    It is important to understand why this is important and that it has no bearing
    on the moral debate about whether the police is good or bad. That is a separate
    question and one on which we don''t need to have any collective position. The
    key question is how we can make direct action work to the extent that it creates
    openings for the radical structural changes everyone wants?


    ## Proactive and respectful police engagement


    A proactive approach to the police is an effective way of enabling mass civil
    disobedience in the present context. This means police as soon as they arrive
    on the scene and saying two things clearly: ‘This is a nonviolent peaceful action’,
    and ‘We respect that you have to do your job here’. We have repeated evidence
    that this calms down police officers opening the way to subsequent civil interactions.


    The Extinction Rebellion actions have consistently treated the police in a polite
    way when we are arrested and at the police stations, engaging in small talk and
    quite often in political discussions and other topics where activists might have
    affinity (inequality, unfair pay). If police initially stonewall activists, they
    can become more open by a willingness to engage with and listen to them.


    This engagement can start before an action. Often a face-to-face meeting with
    police is effective as they are able to understand that the people they are dealing
    with are reasonable and communicative.


    Depending on the country or region, the police might not be primarily concerned
    with either upholding the laws we break nor being aggressive as long as activists
    are civil and open with them. This can be done by building up some informal protocols
    with the police and action liaison officers before actions happen. This produces
    something both sides want: predictability.


    Crucially, this enabled Extinction Rebellion to predict that they could block
    five bridges by splitting into five groups at the same time. It also enabled us
    to predict that as long as everyone maintained nonviolent discipline, the police
    would behave in a civil way and arrest people calmly. Both these predictions proved
    correct and they enabled us to create this critically successful action. Similar
    predictions proved to be correct during the April 2019 rebellion.


    The key to success was the trust that was built up between us and the police through
    regular meetings. The police were assured that we would act in the way we told
    them in advance (as we have done on each occasion). Thus, from a risk analysis
    point of view, they did not prepare to overreact (e.g. having thousands of people
    in expectation of violent disruption). Secondly, it was in their interest to follow
    through on their stated intention to be civil to us so that we continue to meet
    and tell them about future actions, something they are very keen for to do.


    ## When individual criminal actions are justified


    The Ploughshares direct actions movement is made up of people committed to peace
    and disarmament and who nonviolently, safely, openly and accountably disable a
    war machine or system so that it can no longer harm people.‡


    Ploughshares activists are given training in safety and nonviolence and form groups
    for long-term support. Ploughshares is drawn from an enactment of the Biblical
    prophecies to ''beat swords into ploughshares'' but is no longer a Christian movement
    but one which embraces people from many different faiths or from none at all.
    The underlying appeal is the universal call to peace, to abolish all war and to
    find peaceful ways to resolve our conflicts.


    It recognises the abuse of power that comes with war and the deep immorality of
    threatening to kill. Ploughshares actions started in 1980 in the US and have taken
    place in many different countries with weapons as diverse as rifles, warships,
    submarines and aircraft being dismantled or damaged.


    In Britain a successful Seeds of Hope Ploughshares action was one carried out
    by ten women who did £2.4 million worth of damage to a British Aerospace Hawk
    jet. The plane was prevented from being exported to Indonesia where it may have
    been used to continue the genocide being committed in East Timor. The women were
    acquitted in a landmark case at Liverpool Crown Court in July 1996 having argued
    that their act was justified in law as they were preventing British complicity
    in genocide.


    A critical point here is that any act against property must have a clearly ethical
    purpose and meaning rather than being a random act of damage. Beware of undercover
    officials who might try and cause trouble to delegitimise the action. If in doubt,
    ask who they are.


    ## Incentivizing first-time disobedience


    Another vital advantage of maintaining civil relations with the police is that
    thousands of people can engage in their first act of direct action and come out
    of the experience reassured and willing to do more. It enabled the peaceful and
    inspiring blockage of the five bridges to become a major movement-building event.
    If the police had overreacted, many first-time people (around 80% of participants)
    would have come away not wishing to ''take the risk'' again. What was also interesting
    about the five bridges action is the timing of police arresting people (note this
    has little to do with actually breaking the law).


    ## Establishing ‘zones’ for the blockades


    In relation to the likelihood of arrests, blockades fall into one of three zones,
