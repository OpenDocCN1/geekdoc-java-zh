    # What is to be done?


    Successful political campaigns rely on a number of factors, some we can control,
    others we cannot. Successful radical political action also relies upon the application
    of a specific method – rigorous and detailed empirical investigation of the field
    in which a political conflict is going to take place. As opposed to an idealist,
    ‘perfect conditions’ or ‘how we would like it to be’ approach, we should design
    our collective action for imperfect conditions, for political instability and,
    most importantly, for counter-revolutionary tactics from the fossil fuel industry.
    It involves an analysis of all the players in the specific time and space where
    the confrontation is going to take place.


    # Design principles


    A first practical design principle is to choose the time and place where the conflict
    will occur rather than reacting to the opponent. This gives us time to ‘map the
    territory’ and choose a terrain where we can maximise our chances of mobilisation
    and thus of success. This enables us to concentrate all our resources on a single
    time and place. Therefore, we must know the actions and intentions of the main
    players – our activists and our supporters, the opponents and their supporters.


    A critical group here are the opponents, who can be broken down into the elites/management
    and the various supporting pillars and groups who follow their orders: courts,
    police, security people etc. In nonviolence theory it is important to notice that
    the interests of the elites and those that carry out their orders are not equivalent,
    and indeed in contexts which provide structural opportunities for revolutionary
    change, their interests can significantly diverge.


    We need to focus on the specific blocks of mobilisation and campaign success and
    then think about a range of micro designs to maximise the chances of reducing
    these blocks. For instance, I designed London’s first organised rent strike by
    working out that the key block was not that people were not pissed off with their
    rent levels. They were. The problem was that tenants would not go on strike because
    they were not confident others would do likewise.


    I developed a ‘conditional commitment’ routine for canvassers. Would you go on
    strike if a critical mass would act likewise? This worked and led to a hall going
    on rent strike. The fear factor of eviction disappeared, and many more joined
    the strike, leading to an agreed rent reduction.


    # Avoiding ideological dogmas and learning from history


    This is a world away from how many people think about ‘how to win’. A key problem
    is that they take a historically similar situation which did not work and project
    this outcome upon a present context as a way of saying ‘your action plan won’t
    work either’. Instead we need to look in detail at how the present situation and
    proposed plan are similar or different from what has happened before. Small differences
    and the introduction of new design elements can massively change outcomes in a
    complex social system. This problem is made worse when ideological dogmas are
    imposed on scientific facts. We need to look to empirical feedback objectively.


    We cannot see clearly because we are close to various outcomes. A simple example
    is that, ‘the police are nasty for ideological reasons X and Y’ and therefore
    it is difficult to accept that the police can be cooperative in a particular set
    of circumstances. This then prevents us from taking advantage of new data and
    therefore new possibilities.


    It is important to note that the ‘best design’ is not one which will work but
    one that maximises the chances of success relative to the other options on the
    table. Therefore, it is possible that the plan has only a small chance of success,
    but it has to be compared with other options that might actually solve the crisis,
    not theoretical options which are constructed within the current corrupt political
    and economic ideologies and thus far have failed.


    This is the practical choice we face. We have to get into a position where we
    might lead to structural political change. We have to take the chance even if
    the odds are stacked against us. This outside chance is the only one we have for
    effecting the necessary changes to save our communities, nations and the environment.
    Small though the chance might be, we have to ‘roll the dice’ because ‘it might
    just work’. This is the logic of pursing rebellion in a complex social system.


    # Designing a pathway to success


    With this in mind, it is worth introducing a method used in other pre-organised
    civil resistance events. This is ‘reverse engineering’. Instead of working from
    the here and now to success, we first work out what success looks like and then
    work back to how it would be created through time from then to now. This has the
    significant psychological benefit of looking back from the mountain top rather
    than looking up.


    We have succeeded and just have to work out how it was created. It therefore encourages
    us to take greater chances and risks without which success might lead to failure
    but to be even possible. The issue is not that the risk might lead to failure
    but by not taking the risk, failure is guaranteed. All options are now dangerous
    and risky given the unavoidable existential crisis in which we now find ourselves.


    # Reformism vs political revolution


    ## Reformism to revolution


    The political culture of Western democracies has changed from a reformist to a
    revolutionary structure. It is no longer possible to save our society through
    small incremental steps, as happens with reform. Mass political disruption is
    now required. This is a sociological observation rather than an ideological assertion
    – that is, it is based upon evidence. The evidence can be found in the devastating
    failures of the reformist political class to correctly predict the outcome of
    a whole series of political contests in recent years.


    Arguably this failure started with the Arab Spring and the assumption that the
    Arab people would never rise up against dictatorship, still, win. Then we had
    the meteoric rise of left-wing parties in Greece and Spain – from effectively
    zero support to 30% to 40% support in two years. Then there was the ‘intense embarrassment’
    of the Corbyn and the ability of the Sanders campaign to mobilise 2 million people
    for political revolution in the US. We should also mention the darker side – the
    total ‘surprise’ of Trump.


    The approach of reformism (and not making any ultimate judgement here) is that
    progress is maximised by making small demands and small ‘asks’ of your supporters.
    The logic is that this is more ‘credible’ because it makes some progress rather
    than none. The argument then is that making radical or revolutionary demands is
    not credible and therefore ineffective compared with the reformist approach.


    This is true in a reformist context where the common view is that society is mostly
    stable, and the problems that exist can be sorted out by gradualist campaigns
    that make small demands, issue by issue.

