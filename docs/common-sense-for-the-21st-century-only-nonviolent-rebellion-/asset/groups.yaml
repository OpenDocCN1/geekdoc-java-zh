    We will have created a demonstration effect for an immensely attractive 21st-century
    model of revolution – nonviolent, participatory, and genuinely democratic – compared
    with the dire record of revolutions in the 20th century. We need a way to transform
    societies with minimal violence and to maintain a balance between liberty and
    equality, building cohesive communities.


    ## Learning from revolutions past


    We know that a dogmatic pursuit of discredited revolutionary models can be socially
    ruinous. The Citizens’ Assembly system answers the age-old question of ‘Who decides?’
    and represents as big a political shift as the transition from aristocratic rule
    to representational democracy. I don’t think the constructive effect of such a
    reframing of the revolutionary project should be underestimated.


    Without it, we are left with directionless and spontaneous uprisings such as the
    one we have just seen in France with the nicknamed ‘gilets jaunes’ riots, which
    research shows usually lead to authoritarian outcomes and civil war.¹13 It is
    easy to destroy a system but much more difficult to create a better one. The model
    outlined in this booklet gives viable solutions to both sides of the equation.


    The context of the threat of imminent mass death and destruction is the final
    and decisive argument for this strategy. There is simply no chance of getting
    the rapid changes which are needed through negotiations which leave the present
    political class in power. This is both a terrible thing and a good thing. Terrible
    because if we do not succeed, the consequences will be bad beyond our imaginations.


    Good, because in the face of such a challenge, there are no longer any grounds
    for hesitation. Our purpose is clear. In a paradoxical way, then, the clarity
    and purpose will make us happier before. It is clear why we are here in this world
    and what we need to do with our lives.


    - For more information on the Citizens'' Assembly in Ireland, see https://www.electoral-reform.org.uk/the-irish-abortion-referendum-how-a-citizens-assembly-helped-to-break-years-of-political-deadlock/.


    ## The Great Transition


    As Greta Thunberg put it: ‘We must admit that we do not have this situation under
    control. We must admit that we are losing this battle. We must stop playing with
    words and numbers, because we no longer have time for that.’

    And David Attenborough said: ‘No action is too radical.’ These words echoed around
    the world; we must pay attention and act correctly.


    Arguments about the need to ‘protect the economy’, ignoring that the current economy
    is taking us over a cliff into collapse, simply cannot hold up. So, let’s be clear.
    A Climate Emergency is not a rhetorical call for accelerated climate action; it’s
    a call for a major transition of the economy. There is simply no other way to
    get the job done.


    But what does a real Climate Emergency action plan look like? The answer is defined
    by the science – by the physics and chemistry. This is the focus of this chapter.
    Some find it hard to imagine that this is actually happening. Some think it ‘unrealistic’.
    But ask yourself about the alternative of risking the collapse of civilisation,
    the death of billions of people and the extinction of much of life on earth? Is
    that ‘realistic?’ No economy on a dead planet.


    ## Delivering the Climate Emergency response


    What do we need to achieve? Listed here are some of the processes and measures
    needed to deliver a credible Climate Emergency response.


    We have drawn this from a series of expert analyses, studies and publications
    over the past decade, including ‘The One Degree War Plan’ by Prof Jorgen Randers
    and Paul Gilding from 2010, which was perhaps the first analysis proposing a World
    War II-style mobilisation to return the earth to 1°C (33.8°F) of warming.¹14 We
    also draw on ‘The Victory Plan’ by Ezra Silk from The Climate Mobilization and
    a paper by Dave Roberts called ‘What Genuine, No-Bullshit Ambition On Climate
    Change Would Look Like’, amongst others.


    It''s not intended as a precise plan. It is shown to show what needs to happen
    and to establish that it is clearly a path we can choose.


    ## What we need to achieve


    ### Stop the world warming


    We need to stabilise the climate at between a 1°C and 1.5°C temperature increase
    before pre-industrial levels. We need to stabilize CO₂ levels at about 350ppm.
    That''s the task. No further negotiations needed.


    Doing so will require us to eliminate human-created greenhouse gas emissions of
    all types within a decade or two and also take actions to cool the earth. The
    latter is required to reduce the risk of triggering runaway climate feedbacks
    or tipping points.


    ### Eliminate fossil fuel use and close that industry down


    We need to eliminate fossil fuels from the economy, and we need to do so within
    20 years, with most of the work done in the next 10 years. That means immediately
    banning all new investment in fossil fuel exploration and development.


    - Close down all coal-fired power stations – the dirtiest within 5 years, and
    the remainder within 10 years.

    - Close down all gas-fired power stations, most in the next 10 years.

    - Convert all transport to electricity, with the electricity generated by zero
    carbon energy sources.

    - Manage this process with a massive reduction in energy use even if that means
    rationing.


    This all means we will reduce the income of fossil fuel companies worth trillions
    of dollars, including all of the world’s oil, coal and gas companies. They had
    the chance over 30 years to transform and choose not to. Now they must work with
    a transition process and reinvest in renewables or go out of business. Governments
    will have to provide education and retraining programs to help people who lose
    their jobs and address the impact on the communities. The financial implications
    for the national and local authorities and the pension funds invested in fossil
    fuels will also need to be addressed.


    If fossil fuel combustion is rapidly eliminated, the earth will experience a surge
    of warming due to a reduction in the polluting aerosols (which in turn reduce
    the level of sunlight reaching the earth). To counter this, we will need parallel
    drastic cuts in short-lived pollutants such as methane, black carbon, hydrofluorocarbons,
    and ground-level ozone.


    ### Drive massive energy efficiency including rationing and demand management


    To close down power plants, even with rapid global expansion of renewables, will
    need a massive global drive for energy efficiency that will probably include energy
    rationing until we get it. We, in most cases, will be economically beneficial
    to drive such efficiency.


    ### Restore forests and ecosystems


    We need a massive global reforestation program, planting trillions of trees to
    absorb CO2 as proposed recently in the journal Science.¹15. This is one of the
    cheapest ways to absorb carbon from the atmosphere. It will take decades to start
    to absorb large quantities of CO2, but reforestation will then have a huge impact
    over the following decades and will help to restore the climate, refreeze the
    earth''s poles and be enormously beneficial to biodiversity.


    ### Reduce the greenhouse gases in the atmosphere


    We face tipping points that could trigger runaway climate change with the system
    spiralling out of control and the likelihood of collapse within a decade or two.
    We need to cool the planet as fast as possible. This means shifting from just
    focusing on ''emissions'' to also ''reducing warming'' to have its long-term impact.
    There are a number of ways to slow and then reverse warming. The cheapest, fastest
    and best understood action would be radical reductions in methane emissions. That
    means:


    - We need to eliminate the use of gas as an energy source in less than 10 years.

    - We need to lower consumption of animal products, especially industrially produced
    products.


    ## Mobilise action from many sectors


    Many things need to happen, as described in the papers referenced in note 14 on
    page 97. Most are well proven and just need to be taken to scale. People will
    argue the details, but if you want to succeed, it is necessary to accept a level
    of risk and have a level of confidence as to what a united humanity can achieve.


    Some things are very clear and should be confronted now. There can be no more
    burning of fossil fuels in the world. Whether this should be achieved within 5,
    10 or 20 years is for later. Whatever path we take there will be no oil, coal
    or gas industry. Either they go or we go (and then they go anyway – no industry
    on a dead planet).


    ## Measures to achieve the above


    These are the outcomes we need. But to get there we will need a series of measures
    including mobilising the community, policy to ban certain activities, the application
    of taxes, subsidies and mandates by government. Some examples include:


    - Carbon taxes and dividends both to drive behaviour but also to compensate the
    poor.

    - Just transition strategies to manage the social consequences of rapid change.

    - Taxes on all virgin materials to encourage investment in recycling.

    - Feed-in tariffs to drive distributed energy and storage in homes, schools and
    factories.

    - A date for a total ban on fossil-fuel-powered transport of all types: land,
    air and sea.

    - Suspend expansion of all airports and roads to send a clear signal as to society’s
    priorities.

