- md: "\n## Why a Rebellion?\n\nEarth, we have a problem to solve\n\nSocieties around\
    \ the world did not allow the current ecological collapse. Governments did. Since\
    \ the 1990s, a false narrative was promoted around the world that individuals\
    \ should take responsibility for their ‘carbon footprint’. Or that ‘it’s the corporations’,\
    \ the fossil fuel and other only polluting industries, that are to blame. Yet\
    \ governments are the only institutions with the power and the responsibility\
    \ to protect us from harm. But they haven't used power.\n\nIn the UK and around\
    \ the globe, people have inherited a governmental system and a civil society community\
    \ of environmental NGOs unable to address the threat we now face to the continued\
    \ existence of humankind. Government is something created by society to protect\
    \ us from such threats, yet it has failed.\n\nWe need to rescue the concept of\
    \ revolution from a rigid left-wing political ideology and reconnect with a more\
    \ open, popular 19th century tradition which demands we’ve had enough of corruption\
    \ and the gross abuse of power. The problem resides with the state and its capture\
    \ by the corporate business class.\n\nThere is no avoiding the following analysis:\
    \ the world’s present political systems have facilitated a 60% increase in global\
    \ emissions since the beginning of the crisis in 1990 and have no ability to stop\
    \ a continued rise in CO₂, let alone create the political will to massively reduce\
    \ levels (40% in the next ten years according to the UN October 2018 report).\n\
    \nThis leads to the grave conclusion that the probability of organising a political\
    \ revolution to remove the corrupt political class has a higher chance (if small\
    \ or indeterminate) of succeeding than the chance that the political class will\
    \ respond effectively to the climate crisis (zero chance, as evidenced by the\
    \ last 30 years). The penny has finally dropped. The corrupt system is going to\
    \ kill us all unless we rise up. This then is the central meta-strategic point\
    \ of this booklet.\n\n## The failure of reformism\n\nWhilst there is no one clear\
    \ moment we can point to, there are a number of factors that contributed to the\
    \ disastrous delay in addressing climate change, and nearly all of them are linked\
    \ to the emerging neoliberal political economy of the 1980s, the financial power\
    \ and political influence of the fossil fuel industry and flawed thinking about\
    \ how to solve the crisis within the existing political systems.\n\nOne example\
    \ of a proposal was the 700-page Stern Review published in 2007, written by Nicholas\
    \ Stern and his colleagues at the London School of Economics Granth Research Institute.\
    \ One of the central ideas proposed by Stern was called the 'discount rate' of\
    \ mitigation costs. This idea suggested that it was possible to act on climate\
    \ change further in the future as technology developed and renewables became cheaper.\n\
    \nStern would later adjust the discount (or savings) rate he originally suggested\
    \ but the flaw at the heart of the discount rate was that it assumed perfect political\
    \ and economic conditions. For example, it assumed the political willingness to\
    \ invest in new technology in addition to providing large subsidies to renewable\
    \ energy, green transport and less polluting industries. This did not happen because\
    \ the fossil fuel industry created social and political discord by funding anti-climate\
    \ change science groups which manufactured doubt about human influence on the\
    \ climate.\n\nThe same naïve assumption of perfect conditions can be found in\
    \ the structure of the United Nations Framework on Climate Change (UNFCCC) which\
    \ uses a consensus decision-making system allowing small groups of countries to\
    \ veto any decision. Additionally, the UNFCCC never became an effective governance\
    \ system to make commitments legally binding. This meant a positive outcome relied\
    \ on rational economic and political decision-making processes in an irrational\
    \ world.\n\nThe UNFCCC assumed that world leaders would support and ratify the\
    \ outcome from the UN Paris Agreement of 2016 as well as the beneficial economic\
    \ conditions needed to finance the transition from fossil fuels. Yet the 9/11\
    \ attacks, subsequent wars and the financial crash had already pushed the growing\
    \ climate crisis over the political agenda. The result was the weak Paris voluntary\
    \ agreement that is being ignored by the US, Russia and many other governments.\n\
    \n## The EU cap and trade system: more flawed political economy\n\nMore utopian\
    \ thinking can be found in the foundation of ‘step-by-step’ gradual reform processes\
    \ like the EU cap and trade system whereby high carbon industries were forced\
    \ to pay for emissions. However, a major flaw in the policy made the system ineffective.\
    \ By allowing all high emitters a free carbon allowance to start with, it gave\
    \ many corporations time to move their production facilities to China without\
    \ penalty. Others simply paid the fines.\n\nAll of these examples relied on the\
