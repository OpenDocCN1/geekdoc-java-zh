    Alternatively, this could be combined with a ‘swarming’ design, which is to move
    in and form a large, dense group, which could block motorway turn-offs or off-ramps
    and would continue until the threat of arrest became real, at which point the
    protest would be stopped. ‘Swarming’ is a fast-moving, swiftly adaptive action,
    like the behaviour of a swarm of bees moving from hive to hive. Such swarming
    could continue for several days.


    This combination would result in national media reporting on a powerful event
    which involves many arrests and/or the effective blocking of a major port. Specific
    details and artistic contributions would come from the local groups. An initial
    successful event could then progress to another larger event which could involve
    several road or motorway blockages around other ports in the country.


    The above two examples show what dramatic possibilities can be opened by a proactive
    approach to the police and mass organising. A new landscape opens up for radical
    participatory political action which has been missing for many years. By developing
    these options, we can create heated national debate and resultant mass attitude
    changes which are vital to legitimate the massive economic changes which are required.


    > * These are groups of 8–12 people who work together and support each other on
