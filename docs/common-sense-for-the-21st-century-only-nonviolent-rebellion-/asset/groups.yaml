    The messaging and artistic design could be worked up, but the basic tactic puts
    police in a dilemma. We would actually tell them the plan. This if they try to
    intercept individuals beforehand, the protesters would simply drop the open bucket
    on the ground causing a mess for arresting police.


    Given there is no security risk, because police will trust that activists will
    pursue the pre-agreed actions, the likelihood the protest would go ahead. They
    would rightly calculate it is easier to arrest everyone in an orderly way, in
    one go, outside the government building. In addition, they will have to arrest
    people because the action will have passed the ‘criticality’ line – throwing a
    lot of paint over the road is obviously criminal damage, and you have the added
    ‘bonus’ of it happening in front of government buildings.'
