    approach to the police and mass organising. A new landscape opens up for radical
    participatory political action which has been missing for many years. By developing
    these options, we can create heated national debate and resultant mass attitude
    changes which are vital to legitimate the massive economic changes which are required.


    * These are groups of 8–12 people who work together and support each other on
    the day of the action and preparing for it. They include one or two support people
    who do not get arrested and will stay in touch with the main working group throughout.
    Affinity Groups meet before actions and agree on their joint activity.

    † Extinction Rebellion arose out of part of the Rising Up! campaign group, which
    in turn arose out of the Occupy Movement, among others.

    ‡ For more about the history of the Ploughshares movement, see Wikipedia.

    § See ‘How 10 women disarmed a warplane bound for genocide in East Timor’ at https://wagingonnonviolence.org/2015/10/seeds-of-hope-east-timor-ploughares-book/.


    ## The power of symbolic and sacrificial disruption


    For 30 years, the main emphasis for major direct actions has been the disruption
    of important economic infrastructure or other material structures. Direct action,
    as a way of creating political change, has been subject to a simplistic analysis
    that sees winning and losing in narrow material terms. There is a strong argument
    for this approach as confrontation, strikes, blockades, pickets, stoppages, economic
    threat and disruption can certainly bring opponents to the table – as shown by
    the long-term success of many labour strikes around the world.


    However, we cannot assume that closing down a power station or a port is a simple
    pathway to success. And there are significant limitations to this approach. The
    Rebellion needs to change the cultural, psychological and indeed the spirit. It
    needs to work with ‘hearts and minds’.


    Material structures exist within a larger social space subject to psychological
    dynamics. Direct-action design has to create desirable symbolic interruption –
    the meaning structures through which people interpret whether the disruption is
    justified. To work symbolically like this, the Rebellion needs to engage at many
    different cultural levels: with art, design, music, feeling and discussion. It
    needs to be ‘human’ and ‘fun’!


    Raising the economic costs for an opponent is highly provocative. If it’s done
    in an abrupt or aggressive way, or at the beginning of an escalation, then onlookers
    are likely to side with the target as they may feel they’ve been unfairly impacted.
    It can also lead to the opposition hardening their response. In other words, there
    would be little change in the hearts and minds of people towards our cause, and
    the chance of gaining ‘moral ground’ can slip away.


    ## Winning hearts and minds


    There is a tendency for onlookers to see conventional direct-action tactics, such
    as lock-ons, as ‘something I have seen before’, and therefore nothing of major
    concern It is not emotionally engaging enough to create real interest. The response
    is, often subluminally, ‘They’re not like me so it doesn’t involve me’. The importance
    of changing hearts and minds cannot be overstated in terms of radical social change.
    This point has not gone unnoticed in military theory. An occupying force can be
    powerful materially but still lose against an insurgency if it does not actively
    engage with the civilian population (even at the risk of casualties). The Iraq
    and Afghanistan conflicts are examples where hearts and minds were not won and
    both wars have been a failure.


    Therefore, material disruption needs to be designed to provoke a transformational
    national conversation and debate on what is going on with the climate emergency
    and ecological crisis. This animation of the public sphere is created through
    a national drama driven by the enactment of transgressive sacrificial and symbolic
    action on a large scale. Action which leads to arrest and prison. Getting arrested
    through such actions is the classic sacrificial move. Having hundreds arrested
    in one day will be a major news story given the drama provided by such public
    sacrifice.

