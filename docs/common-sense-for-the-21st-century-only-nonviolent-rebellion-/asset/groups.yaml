    out out of the experience reassured and willing to do more. It enabled the

    peaceful and inspiring blockage of the five bridges to become a major

    movement-building event. If the police had overreacted, many first-time

    people (around 80% of participants) would have come away not wishing to

    ''take the risk'' again. What was also interesting about the five bridges action

    is the timing of police arresting people (note this has little to do with

    actually breaking the law).


    # Establishing ‘zones’ for the blockades


    In relation to the likelihood of arrests, blockades fall into one of three

    zones, which I explicitly discussed with liaison officers:


    +   1. A zone in which nothing critical is happening, such as just blocking a

