    engagement are broken can we create effective communication that reaches hearts
    and minds.


    That said, if and when a journalist or editor is willing to give us an hour to
    carefully outline the full magnitude of mass extinction and the social scientific
    evidence for rebellion as the most effective response, then we should of course
    take this opportunity. We are not against having a serious discussion, but rather
    against spaces which have no interest in such discussion.


    Media and messaging working groups should have the merit to recruit speakers and
    train them in disruptive action, which sends out what should be our central message:
    ‘We are different from them (the status quo or regime), we are not afraid of them,
    and you don’t need to be afraid either. Rise up and exercise your freedom. Come
    down to the occupations and become a human being, not someone living within a
    media and politically constructed “post-truth” world.


    These media appearances have the potential to go viral and thus can have as much
    influence as the civil disobedience on the ground. This new opening for direct
    action is then a vital additional front which needs to be central to the overall
    strategy.


    ## Internal messaging – the value of diversity


    Research shows that members of a social group or network tend to have irrational
    ‘in and out group’ emotions and reactions that consciously or unconsciously prevent
    them working with people who are not like themselves. This problem is unlikely
    to resolve itself. To build a mass movement, we inevitably need to bring people
    together who ordinarily don’t want to mix. There are several effective approaches
    to this central problem of effective mobilisation:


    - Make all campaign spaces as friendly as possible on a personal level. This means
    maximising face-to-face human connection as a counterbalance to any perceived
    alienating group identity. People should be explicitly welcomed into the meeting
    space. They should then sit in small mixed groups in meetings and be given time
    to get to know each other. There should be food and drink at every event to ease
    social interaction. There should be calls or one-to-one meet-ups afterwards to
    thank individuals for coming and to listen to any concerns. People should be appreciated
    often and generously. Any criticisms should be restricted to critical problems.
    All this is possible and an essential part of overcoming the conflicting identities
    problem.


    - 2. The main campaign spaces need to be ''culturally neutral'' as possible. This
    mainly means taking out subliminal social class or mono-cultural elements. This
    can, ironically, mean changing processes which are supposed to create inclusivity
    but actually exclude people. These include someone telling the group everyone
    is welcome. People feel welcome through one-to-one welcoming behaviour, not through
    being told something is true because someone says it.


    Activist routines can be off-putting. For instance, the hand signal conventions
    of Nonviolent Communication and new age or academic (radical left) language. Everything
    written and spoken should be put into commonly known phrases, such as ‘the way
    someone talks’ rather than ‘discourse’. People being overly physical and friendly
    with others whilst ignoring newcomers (creating the impression this is someone
    else''s group that I am entering) should be discouraged.


    Sources of division such as social class, race and gender present very real challenges.
    It is why working-class people are almost totally absent from UK environmental
    movements. Poorly constructed messaging will put off new people from another identity
    least because of the prejudices of the people receiving the message. Some of this
    may be unavoidable. For instance, a black woman came to an Extinction Rebellion
    meeting and left afterwards intending not to come back because ‘were too many
    piercings’.


    - 3. The structural solution is then to create different spaces for various groups.
    For example, working-class mobilisations are organised by working people themselves
    (as opposed to middle-class groups that claim to speak for them). Similarly, people
    of colour can organize in their own spaces. People should therefore be encouraged
    to set up their own groups which agree on basic red lines such as nonviolence
    but are able to promote their own cultural identities.


    These internal organisational issues are critical to building a mass movement
    and so move the environmental movement out of the middle-class bubble that has
    defined it for decades. As the research shows, we need to create mass participation
    civil disobedience.10 This means we need to engage and mobilise many diverse cultures.
    It’s not creating a comfort zone but about getting on with the critical work that
    needs to be done. It’s not going to be easy, but it has to be done if we are serious
    about succeeding.


    ## External messaging – the value of inclusivity and universalism


    This is one of the most difficult areas for green and left-wing activists to understand
    and accept, but it is critical to political success. We must appeal to people
    who don’t join or support environmental causes, because of ideology, social class,
    culture, religion or race. This has been done with massive success by the political
    right wing for decades in order to demoralise and confuse left-wing supporters.


    They take a left-wing idea, or word, and co-opt it to right-wing purposes. ‘Revolution’
    is an example. Or, the idea of workers sitting on company boards that Theresa
    May promoted on the day of her national election victory. Of course, there was
    no chance that was ever going to happen.


    Left-wing movements can do the same, but ideological purism often prevents them
    from being creative. However, with the climate crisis and ecological breakdown
    there is a unique opportunity to play the right at its own game, because in this
    case, the arguments are genuinely universalist. There is then a massive opportunity
    to build up right-wing support and demoralise the opposition by parking our tanks
    on their lawn (to use a right-wing phrase).


    The framing should be to ditch environmentalist language and adopt the language
    of traditional liberal universalism. This was done to great effect with Extinction
    Rebellion’s ‘Declaration of Rebellion’ and the letter to the Queen, delivered
    to Buckingham Palace in November 2018. In no sense does this explicitly exclude
    a left-wing orientation. Notions of honour and duty were widely respected values
    on both the left and the right until neoliberalism reduced everything to self-interest
    and monetary value.


    Notions of left-wing national identity and civil nationalism have been central
    to many traditional left-wing movements. Words like honour, duty, tradition, nation,
    and legacy should be used at every opportunity. Not only is this language new
    and therefore attracts attention, but it can be connected to a profoundly egalitarian
    ideal. In fact historical research has shown that inequality is usually reduced
    by left-wing administrations, but by movements facing national crises such as
    war¹. In these circumstances, the taxing of the rich is seen as a universally
    accepted necessity, as it should be by any regime realistically concerned with
    addressing the climate emergency.


    ## Progressive solutions are desperately needed


    The tension here is that for the past 30 years, left-wing and environmental movements
    have had neither the structural opportunity nor the creative innovation to radically
    challenge the fundamentalist neoliberal regime, where the real power and capability
    to exploit natural resources.


    For instance, ‘climate justice’ movements have been keen on declaring solidarity
    and morally ‘good’ attitudes have had no practical or credible plan of action
    other than calling out the government’s lack of action whilst going on marches
    and signing petitions. Instead, when a movement along which undertakes mass direct
    actions that actually challenge structural inequality, they seem more concerned
    with the words and statements of the movement rather than real world successes.


    As these as ‘activists’ ironically do the work of the neoliberal elite they claim
    to be vigorously opposed to by undermining any effective action by engaging in
    endless judgement and criticism. In the meantime, many people follow the NGO approach
    of ‘armchair activism’ or ‘clicktivism’ whereby individuals think they are making
    a difference by signing an online petition when in reality their concern has little
    to no impact via this medium. However, this form of activism can lead to ‘on the
    ground’ activism. People who have signed petitions should be contacted and invited
    to join the Rebellion.

