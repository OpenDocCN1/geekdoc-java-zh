    \ the reformist process had no plan B. Meanwhile, the political systems that are\
    \ supposed to protect us became increasingly ‘bought’ by the fossil fuel lobby\
    \ whilst simultaneously exploiting concerns about the environment to obtain votes\
    \ from centrist voters.\n\nNeeding to keep voters, and having their hands tied\
