    # The cost of freedom is civic duty


    I recently saw the film *First Reformed*, about a priest who considers blowing
    himself up in the face of the existential crisis of climate breakdown. The director,
    Paul Schrader, casually asserts in an interview that the human race is certain
    to be extinct by the end of the century before answering the next question on
    some mundane aspect of film production.


    The film and interview illustrate the depth of moral depravity to which our society
    has now fallen. We collectively know we are about to destroy our children''s lives
    but can only muster individualistic responses and casual nihilistic indifference.


    Let''s be clear: such moral degeneration is what enabled the Nazi death camps
    to happen – a complete collapse of any sense of empathy or duty to uphold the
    most basic moral principle: ‘Do unto others as you would have them do unto you’.
    Not, nice to others just because we want good things to happen to us, but because
    it’s the right thing to do.


    This booklet proposes another way – a light between the darkness of apathy and
    cynicism. We have been here before. Numerous times in fact. societies and cultures
    have experienced the prospect of annihilation, and it is clear that values and
    actions need to be adopted if our chances of survival are to be maximised.


    The first step is a return to some sort of transcultural balance between the individual,
    the society and the state. We have a duty to protect our society as much as to
    attend to our self-interest. We are all unique individuals but'
