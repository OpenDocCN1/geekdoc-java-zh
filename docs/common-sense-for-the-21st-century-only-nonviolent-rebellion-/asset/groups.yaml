- md: '

    Another critical network to reaches the media. Some outlets will be natural allies,
    and this might include a proportion of the radical and independent online press.
    However, the mainstream press should be the focus: the BBC and The Guardian in
    the UK, and the centrist and national media in any other country that are likely
    to offer support. However, the goal is to go beyond and reach all media outlets.
    We must go beyond The Guardian! The aim here is to ask them to declare a climate
    emergency, and then use that declaration to push for support for a Rebellion explicitly.
    Suggest journalists and editors go on hunger strike on the main day of action.
    They should be asked to cross the line and go into existential conflict with the
    genocidal governing regime as a matter of national duty.


    These extreme and unreasonable demands create a crisis in these spaces and widen
    the Overton window, as it has with the use of the ‘extinction’ and ‘rebellion’
    over the past year.* It will become clear that their role in this emergency can
    no longer be just writing about it. The sea change in approach can be aided by
    asking for private and informal meetings with journalists, editors and media people
    to give them the standard talk which will help develop contacts with those who
    support the Rebellion.


    This approach should then extend to the right-wing press – using the framing of
    ‘order, security and legacy’ (see the ‘Framing and messaging’ chapter on page
    64) as a way to highlight the contradiction of believing in these values and yet
    having no concern for the emergency which presents an existential threat to them.


    ## Cultural allies


    Any cultural group or institution in society can be approached – the climate crisis
    affects everyone and everything. People can stand up in cinemas, theatres, conferences,
    lectures, supermarkets, restaurants etc. and declare that we will soon see if
    nothing is done and call on to join the Rebellion. We need to approach religious
    and spiritual organisations, small businesses and community groups. The possibilities
    are enormous, and this is the agenda for the mass movement we are creating.


    The actions can be videoed and live-streamed and combined with trainings so people
    can select their own priorities without any central direction, other than to follow
    some basic guidelines. Local groups can brainstorm and select groups they want
    to approach†


    ## Schools, colleges and universities


    A particular focus should be schools, colleges and universities. The mobilisation
    of young people is already happening around the world, but it needs to move to
    more prolonged and disruptive forms of civil disobedience. A possible process
    is: student campaigners hand out leaflets outside their place of education promotion
    a strike and civil disobedience event. They enter into conversation with people
    as they hand out the leaflets:‘Could I speak to you for a minute about the climate
    crisis?''


    A script can be used to guide the conversation into listening to what the young
    person thinks about their future. Contact information can be taken from the most
    enthusiastic people who are incentivised to organise further outreach and engagement.


    This would lead to the recruitment of new recruiters to canvass and arrange meetings
    with the school, college or university. Through this process the young people
    start to organise their own direct action and mobilisation, with training and
    mentoring from experienced rebels. Youth events would happen separately from those
    for adults in the run-up period to a central action. Ideally, they would be integrated
    within the wider coalition for the main mass civil disobedience event.


    There is a great opportunity to create real diversity in Rebellion mobilisations
    – children and young people from inner city schools mixing with middle class campaigners
    from the suburbs. Serious resources should be devoted to creating youth mobilisation.


    ## Local community outreach to extend diversity


    A similar diversity priority would be to develop local community meetings in inner
    cities. The process would involve leafleting and then door knocking. This has
    been tried but still needs to be developed and standardised. As with youth mobilisation,
    the ‘ordinary’ people who are mobilised through this process should set up their
    own groups and networks so that they are not put off by the specific culture of
    middle-class or radical campaigning, but are integrated once they are established
    into a central, major mobilisation.


