    more action against King’s, and the vice principal agreed no disciplinary or legal
    action would be taken against us. It was all very amicable.


    A year and half later the crown prosecution service decided to prosecute me another
    student for ‘criminal damage without lawful excuse’ for painting the walls. We
    appeared in front of a jury and represented ourselves. We were told by the judge
    that the trial had nothing to do with climate change. He interrupted me 15 times
    and told me to stop talking about it (something I kept ‘forgetting’ to do).


    For the judge it was a clear and simple case. We put paint on the wall, it was
    against the law and thus we were guilty. However we argued our case was about
    climate change. It was about preventing the terrible suffering that will be created
    by the criminal fossil fuel industry unless there is wholesale divestment and
    it is closed down. We had a right of necessity to cause disruption in order to
    prevent massive disruption. This was no brainer.


    The judge couldn’t get his head around it the jury, ordinary Londoners, certainly
    did. They considered the case for the minimum time necessary. All of them came
    to the unanimous verdict that we were not guilty on all charges of criminal damage.
    The judge told us, ‘You are free to go’.


    This is yet another instance of the increasingly extreme social repression which
    we face in our societies at the present time. Everyone knows the situation is
    fucked – everyone except the political class and elites. The judiciary live in
    a make-believe world of formal legalities; they have ‘lost the plot’. Another
    from the pre-trial judge was that there was objectively ‘no case to answer’. We
    were not guilty.


    This total opposition of world views between the elites and the people is going
    to explode. Our job is to bring about this ‘correction’ in an ordered,'
