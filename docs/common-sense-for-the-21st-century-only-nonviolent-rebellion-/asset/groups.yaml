    monarchy. In 2007 a Comprehensive Peace Agreement was agreed and in May 2008 Nepal
    was declared a republic. Nepal is now considered to be more politically and economically
    inclusive of previously marginalised ethnic and caste groups. Since 2006 there
    has been no return to civil war.


    ## Bringing the regime to the table


    When the authorities lose the ability to stop mass mobilisation the regime is
    forced to negotiate. The point of the build-up design is that it minimises the
    chance that the police will shut down the civil disobedience before it has reached
    a critical mass of publicity. Moving a mass of people without the interference
    of the police requires a sophisticated, coordinated management which will be difficult
    to achieve. However, if the numbers are available, it will be better to get to
    the locations, sit down and stay there.


    Alternatively, there could be a compromise between the two scenarios. Such considerations
    would need to be decided on the basis of the local context. The general aim, however,
    is clear: the closing of the centre of a capital city day after day through the
    peaceful blockading of streets by thousands of rebels. Once this is achieved,
    we are in the ball park of forcing the regime to come to the table and talk.


    ## Gathering the necessary numbers


    A key factor is the numbers involved, and this is why our whole strategy has to
    be centred around a primary objective: getting thousands of people into capital
    cities on a specific date. Success could be built by as little as five to ten
    thousand people. It is this group which potentially provokes the authorities into
    a repressive response which then brings many more thousands to join them on the
    streets out of a feeling of solidarity and excitement.


    The key is getting to the tipping point when coverage in the national print media
    and social media triggers this spontaneous additional mass mobilisation. This
    is how it takes off – when the fear has gone, as shown by our historical examples.


    ## Make actions inclusive and fun


    The inclusive and human feel of these occupations is essential to maintaining
    morale and nonviolent discipline. We know that the inclusion of children and older
    people can be extremely effective in stopping macho or aggressive behaviour whilst
    creating greater media interest. An occupation should not have the logos of other
    groups or parties, but should be a bright display of Extinction symbols and whatever
    appropriate creativity the art groups produce.


    Occupations can have a programme of events which could include the group sharing
    food and coming together in Affinity Groups for mutual support and human contact.
    At the same time there should be a programme of entertainment whilst being aware
    of the delicate balance necessary when promoting different cultural identities.


    The general atmosphere should be ''we’re going to take down the government and
    have fun doing it''. If and when aggression comes from authorities, it is responded
    to with humour and good grace. As the Children’s Crusade showed, this is possible
    even in a dangerous situation. Once a cultural and positive psychological frame
    is created in a large group, it has a very strong socialising influence on individuals
    in the space and, vitally, on new people coming into it.


    ## Publicity


    Any large-scale event of mass civil disobedience needs to ensure that every opportunity
    is taken to promote the framing of nonviolent respectful action. The symbolic
    and sacrificial aspects of the law breaking need to be explained. This meaning
    giving out tens of thousands of leaflets in public places which explain the crisis
    and why breaking the law is now necessary, apologise for the disruption, and give
    information on how people should join. These could be handed out at bus stops
    and transport stations, parks or other public places.


    Fly-posting should be done by several teams each night for the two weeks before
    the start date. ‘There is going to be a rebellion against the government – join
    us’, with specific details of where to go. The greater the diversity of posters
    the better to show the bottom-up nature of the mobilisation. Hundreds of people
    might stencil and paint the symbol all around the poor/inner city areas of the
    capital in the nights leading up to the event. People can spend the day on public
    transportation shouting out, ‘There is going to be a rebellion!’ and handing out
    leaflets.


    Super noisy marches around sympathetic neighbourhoods of the city would effectively
    spread the message to people. This happened before the Tahrir Square occupation
    in Egypt during the Arab Spring. A peak in social media activity should be planned
    and an online campaign run to promote and reflect offline actions. An atmosphere
    of anticipation and excitement should be created. After decades of defeat and
    cynicism, millions of people begin to sense a real possibility for change.


    We are in a new era in which social media can be highly influential. Therefore,
    activists need to stay up to date and understand Facebook algorithms and how one
    bad Tweet without context can result in a negative news story. This kind of expertise
    is expensive to buy, but activists must do their best ever by reading the latest
    literature on social media marketing or asking experts to train team members for
    a day.


    ## ‘Not Guilty’ on all counts: criminal damage at King’s College


    Social repression involving the climate disaster has shown up in many ways, and
    this includes the court system. Two years ago, myself and a group of students
    painted messages on the walls of King’s College London where I did my PhD research.
    Our aim was to persuade the College to divest from all fossil fuels, something
    they had refused despite four years of conventional campaigning. Petitions, meetings
    and sitting on committees had gone nowhere. When we painted the walls of the Great
    Hall of the College, we won in five weeks. Direct action worked.


    I was immediately suspended and banned from entering the college. However, I openly
    challenged the ban to the point of getting carried out of the Students’ Union
    by security staff, and after ten days, they removed the ban. The embarrassment
    was too great. Instead I was invited into negotiations with the vice principal,
    and I told him I was going on hunger strike until they had a signed statement
    committing the university to total divestment by a set date.


    I was calm and respectful in all my dealings with him, and he responded by initiating
    emergency committee meetings. Only by creating a crisis will institutions act.
    On the 14th day of my hunger strike, a document was produced making the commitment
    to divest by 2022 and become carbon neutral by 2025. It was signed in front of
    the press, and we all shook hands. We agreed to take no more action against King’s,
    and the vice principal agreed no disciplinary or legal action would be taken.
    It was all very amicable.


    A year and half later the crown prosecution service decided to prosecute another
    student for ‘criminal damage without lawful excuse’ for painting the walls. We
    appeared in front of a jury and represented ourselves. We were told by the judge
    that the trial had nothing to do with climate change. He interrupted me 15 times
    and told me to stop talking about it (something I kept ‘forgetting’ to do).


    For the judge it was a clear and simple case. We put paint on the wall, it was
    against the law and thus we were guilty. However we argued our case was about
    climate change. It was about preventing the terrible suffering that will be created
    by the criminal fossil fuel industry unless there is wholesale divestment and
    it is closed down. We had a right of necessity to cause disruption in order to
    prevent massive disruption. This was no brainer.


    The judge couldn’t get his head around it the jury, ordinary Londoners, certainly
    did. They considered the case for the minimum time necessary. All of them came
    to the unanimous verdict that we were not guilty on all charges of criminal damage.
    The judge told us, ‘You are free to go’.


    This is yet another instance of the increasingly extreme social repression which
    we face in our societies at the present time. Everyone knows the situation is
    fucked – everyone except the political class and elites. The judiciary live in
    a make-believe world of formal legalities; they have ‘lost the plot’. Another
    from the pre-trial judge was that there was objectively ‘no case to answer’. We
    were not guilty.


    This total opposition of world views between the elites and the people is going
    to explode. Our job is to bring about this ‘correction’ in an ordered,

