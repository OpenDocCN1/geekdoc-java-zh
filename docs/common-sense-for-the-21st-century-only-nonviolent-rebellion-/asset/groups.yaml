    We must therefore avoid the simplistic idea that if we close down the country
    we will win. Disruption has to be combined with our willingness to show our vulnerability
    and to suffer. The disruption then simply sets the stage for the symbolism of
    fearless sacrifice. It is the sacrifice which brings about the social change not
    the disruption in itself. This is the case particularly when the young and the
    old take part, as sacrificial action by both groups creates greater public interest
    and sympathy than the ‘usual suspects’ – young men. This is the key reason why
    direct actions should be designed in an open way which are accessible to the two
    groups.


    ## Creating a mass civil disobedience event in the capital city


    The most effective act of mass civil disobedience is to have a significant number
    of people (at least 5,000–10,000 initially) occupy public spaces in a capital
    city for several days to weeks. Again, this is not so much because of the material
    disruption that is caused, but rather the symbolic impact of mass sacrificial
    actions at the heart of national power, the site of the governing and media elites.


    The precise design for the event will need to be made on the basis of the numbers
    willing to take part, the political context, and the expected police response.
    Groups should aim to get 20,000 people to central points near government buildings
    for several days.


    There are two basic designs:


    - 1. They would occupy public parks and bring tents to stay overnight. Each day
    there would be a public programme of discussions and assemblies, workshops, picnics,
    speakers, and entertainment. Think of a festival! On day two they would occupy
    several key junctions for a day – at least 1,000 people at each. The strategy
    depends on the police allowing this to happen (see analysis below). On the third
    day, they would return to the junction and stay there permanently, putting up
    their tents, with a continuing festival programme.

    - 2. A second option is that people would occupy the road junctions in a central
    location in the capital city from day one and stay there until everyone is arrested.


    This then sets the scene for mass transgression, an act of mass sacrifice and
    a major public drama. The symbolic interpretation is people versus power on an
    epic scale.


    ## Examples from history


    ### The Leipzig ‘Monday demonstrations’

    This strategy draws upon seminal research on the escalation of demonstrations
    at Leipzig in East Germany in 1989. The broad progression of events went as follows:
    A pastor was extremely disillusioned with the regime and led his community to
    hold a public demonstration over a weekend. Approximately 6,500 people attended.
    Initially, the local security forces did not interfere with what they considered
    a small Christian demonstration. Encouraged by this success and police reaction,
    the following Monday 17,000 people came out on the street.


    Unsure what to do, the authorities contacted their superiors in Berlin. A message
    came down the line to shoot at the demonstrators. However, the next Monday there
    were 60,000 people on the streets, and the police could not bring themselves to
    shoot that many people and thus disob their orders. The following weekend 105,000
    people turned out. The fear had gone, and this is the moment when the tide turned
    and, shortly afterwards, the regime. The lesson is that the regime was caught
    off guard by the nonlinear increase in the numbers taking part in the demonstrations
    and the slow, centralized, top-down decision-making structure failed to act in
    time.


    The design aims to catch the authorities off guard. They might allow occupations
    to continue for three days because it is not a critical issue. In this time the
    demonstration effect of thousands of people peacefully breaking the law to force
    government into serious action or stand aside, encourages thousands of people
    to join the direct action, or consider doing so. We aim therefore to hit the holy
    grail tipping point which leads to regime surrender.


    If they allow civil disobedience to continue, then protesters will come to the
    capital, and there will be unacceptable mass disruption. Alternatively, if they
    try to arrest, say, 1,000 protesters in a day, then the media interest will result
    in millions of people hearing about the arrests and the pleas to join the nonviolent
    mass action. Only a tiny percentage (less than 1%) of these onlookers need to
    be mobilised for the net numbers (those joining minus those arrested) to rapidly
    increase. The more they arrest, the more people join up.


    ## Children’s Crusade, 1963


    Another inspiration is the American movement for black civil rights in the 1960s
    which organised a number of dramatically successful campaigns. One of the most
    famous was the Birmingham, Alabama, campaign of 1963 which shows key elements
    which are promoted in this booklet. The aim was to desegregate the city through
    a nonviolent direct action.


    After failing to make an impression with Martin Luther King, Jr., going to jail
    and the subsequent difficulties of mobilising the adult black residents of the
    city, the idea was hatched to involve the city’s children and young people in
    an ongoing escalation of mass participation civil disobedience. The dilemma action
    design involved thousands of pupils and students leaving school to illegally march
    through the centre of the city. Word spread via local radio stations and meetings
    which promoted the methods of civil disobedience.


    ‘D-Day’ was set response when the mass action would begin. The authorities opted
    for a repression response, arresting 1,000 protesters on the first day and 3,000
    on the second day. This triggered a classic example of the backfiring effect.
    Thousands more children left their classes to protest and fill the jails.


    ‘The fear had gone,’ as one officer reported. After a week there was no end to
    the mass protest. The authorities had lost control, and the opposition collapsed.
    Decades of segregation policies were overturned in a week. This is the power of
    mass civil disobedience. The classic film Mighty Times: The Children’s March is
    required watching to see these dynamics in action.


    ## Jana Andolan II, Nepal


    One of the most recent examples of successful nonviolent disobedience is the Jana
    Andolan II of Nepal. In 2005, King Gyanendra sacked the government and assumed
    direct powers, creating an absolute monarchy. He did this ostensibly to put an
    end to the ten years of civil war which saw 17,000 fatalities in a population
    of 24 million.


    The King’s move was opposed by multiple social and political groups and led to
    the formation of a new and wide political coalition, including the largest active
    political group, the Maoist insurgents. With the formation of the new coalition,
    the Maoists agreed to a temporary ceasefire.


    The new coalition went on to mobilise an estimated 5.5 million Nepalese in civil
    disobedience and general strikes across Nepal lasting 19 days. The coalition included:
    civil society organisations such as the Citizens’ Movement for Democracy and Peace,
    the Professional Alliance for Democracy and Peace, and within these organisations,
    lawyers, teachers, engineers, professors, doctors, and journalists; NGOs; a coalition
    of four trade union confederations; the Maoists and a range of women’s groups
    and peasants.


    The focus of the protests was the paralysis of the cities, particularly the capital
    Kathmandu. On one day, hundreds of thousands of protesters occupied the 27-kilometre
    ring road and effectively encircled the city.


    The protestors’ demands were for:


    - A return to democracy.

    - Lasting peace.

    - More inclusion of marginalized groups.


    The protestors’ tactics included getting high profile protesters arrested to encourage
    greater participation and creating spaces within the demonstrations for marginalised
    groups to speak and be represented. The government responded to the mass protests
    with a ban on mass meetings, assemblies and rallies, by cutting telephone and
    mobile connections and shoot-on-sight crews.


    After 19 days and 15,000 arrests, the King conceded and allowed the political
    parties back into politics. This ultimately led to not just new elections but
