    # Our Commitment to Green Publishing


    Chelsea Green sees publishing as a tool for cultural change and ecological stewardship.
    We strive to

    align our book manufacturing practices with our editorial mission and to reduce
    the impact of our

    business enterprise in the environment. We print books and catalogs on chlorine-free
    recycled

    paper, using vegetable-based inks whenever possible. This book may cost slightly
    more because it

    was printed on paper that contains recycled fiber, and we hope you''ll agree that
    it''s worth it.

    *Common Sense for the 21st Century* was printed on paper supplied by Sheridan
    that contains 100%

    postconsumer recycled fiber.


