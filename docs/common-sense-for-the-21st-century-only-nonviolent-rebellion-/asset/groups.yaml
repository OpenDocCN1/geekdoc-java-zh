    我们将为一种极具吸引力的21世纪革命模式创造示范效应——一种非暴力、参与式且真正的民主模式——这与20世纪惨不忍道的革命记录形成鲜明对比。我们需要一种能够以最小暴力实现社会转型的方法，并在自由与平等之间保持平衡，构建具有凝聚力的社区。


    ## 从过去的革命中学习


    我们知道，教条式地追求已经信誉破产的革命模式对社会是具有破坏性的。“公民大会”制度回答了“谁来决定？”这一古老的问题，并代表了如同从贵族统治转向代议民主那样巨大的政治转变。我不认为对革命项目进行这种重新构构所产生的建设性影响应该被低估。


    如果没有它，我们将面临失去方向的、自发的起义，正如我们刚刚在法国看到的“黄色背心”骚乱，研究显示，这类运动通常会导致威权结果和内战.¹13 摧毁一个系统很容易，但创建一个更好的系统要困难得多。本手册概述的模型为这个方程式的两端都提供了可行的解决方案。


    迫在眉睫的大规模死亡和毁灭威胁的背景，是这一策略的最终且决定性的论据。通过让现任政治阶层维持权力的谈判，根本不可能获得所需的快速变化。这既是一件可怕的事，也是是一件好事。可怕是因为，如果我们不成功，后果将超出我们的想象。


    好是因为，面对这种挑战，不再有任何犹豫的理由。我们的目标非常明确。从一个悖论的角度来说，这种清晰和目标将让我们比以前更快乐。我们来到这个世界的原因，以及我们对生命需要做什么，已经变得清晰明了。


    - 有关爱尔兰公民大会更多信息，请参阅 https://www.electoral-reform.org.uk/the-irish-abortion-referendum-how-a-citizens-assembly-helped-to-break-years-of-political-deadlock/。


    ## 大转型


    正如格蕾塔·通贝（Greta Thunberg）所说：“我们必须承认我们无法控制局面。我们必须承认我们正在输掉战斗。我们必须停止玩弄文字和数字，因为我们已经没有时间玩这些了。”大卫·亚登伯勒（David
    Attenborough）说：“没有任何行动是不激进的。”这些话在全球范围内回响；我们必须关注并采取正确的行动。


    关于需要“保护经济”的论点忽略了当前的经济正将我们推向悬崖导致崩溃，这种论点根本站不住脚。所以，让我们明确一点。“气候紧急状态”不是对加速气候行动的修辞呼号；它是对经济重大转型的号召。根本没有其他方法可以完成这项任务。


    但一个真正的“气候紧急”行动计划是什么样子的？答案由科学定义——由物理学和化学定义。这是本章的重点。有些人难以想象这一切实际上正在发生。有些人认为这“不现实”。但问问自己，另一种替代方案是承担文明崩溃、数十亿人死亡以及地球上大部分生物灭绝的风险吗？那“现实”吗？在死的星球上没有经济而言。


    ## 执行气候紧急响应


    我们需要实现什么？这里列出为了交付可信的气候紧急响应而需要的一些过程和措施。


    这些内容源自过去十年的一系列专家分析、研究和出版，包括 Jorgen Randers 教授和 Paul Gilding 在 2010 年提出的《1度战争计划》，这可能是第一份提出通过类似第二次世界大战的动员将地球升温带回
    1°C（33.8°F）的分析.¹14 我们还参考了 Ezra Silk 在“气候动员组织”提出的《胜利计划》，以及 Dave Roberts 一篇名为《真正的、不虚假的气候变化雄心会是什么样》的论文等。


    它并不是一个精确的计划。它的目的是目的是展示需要发生什么，并证实这显然是一条我们可以选择的道路。


    ## 我们需要实现的目标


    ### 停止全球变暖


    我们需要在工业化前水平之前，将气候稳定在温度升高 1°C 到 1.5°C 之间。我们需要将 CO₂ 水平稳定在约 350ppm 左右。这就是任务。不需要进一步谈判。


    这样做要求我们在十年或二十年内消除所有类型的人为的温室气体排放，并采取行动冷却地球。后者是为了减少触发失控性气候反馈或临界点的风险。


    ### 消除化石燃料的使用并关闭该行业


    我们需要从经济中消除化石燃料，并且我们需要在 20 年内完成，大部分工作将在未来 10 年内完成。这意味着立即禁止对所有化石燃料勘探和开发的新投资。


    - 关闭所有煤电发电厂——在 5 年内关闭最脏的，其余在 10 年内关闭。

    - 关闭所有燃气发电厂，大部分在未来 10 年内关闭。

    - 将所有交通工具改为电力驱动，并由零碳能源产生电力。

    - 通过大幅减少能源消耗来管理这一过程，即使这意味着实行配给。


    这意味着我们将减少价值数万亿美元的化石燃料公司的收入，包括世界上所有的石油、煤炭和天然气公司。他们有 30 多年的时间进行转型但选择了放弃。现在他们必须与转型过程合作，并投资于可再生能源，否则破产。政府将不得不提供教育和再培训计划，帮助失业的人员，并应对对社区的影响。国家和地方当局以及投资化石燃料的养老基金的财务影响也需要得到解决。


    如果化石燃料被迅速消除，地球将经历热量的飙升（这是由于减少了溶胶导致到达地球的辐射）。为了应对这一点，我们需要大幅减少甲烷、黑碳、氢氟碳和地面臭氧等污染物。


    ### 驱动能源效率，包括配给和需求管理


    关闭发电厂，通过可再生能源的快速扩张，我们需要在全球范围内推动能源效率，这在大多数情况下将包括配给。这在经济上是有益的。


    ### 恢复森林和生态系统


    我们需要一项大规模的造林计划，正如最近在《科学》杂志上提出的一样⁵。这是从大气中吸收碳的最便宜方法之一。这需要几十年才能开始吸收大量的二氧化碳，但有助于恢复极地并对生物多样性产生巨大益处。


    ### 减少大气中的温室气体


    我们面临着可能导致系统失控和失控气候变化的临界点，并在十年或二十年内发生崩溃。我们需要尽快冷却地球。这意味着从仅仅关注“排放”转向“减少变暖”，以产生长期影响。最便宜、最快且最易理解的行动是减少甲烷。这意味着：


    - 我们需要在 10 年内消除天然气的使用。

    - 我们需要减少动物产品的消费，尤其是工业化产品。

