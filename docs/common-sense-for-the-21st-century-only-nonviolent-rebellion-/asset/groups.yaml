  - '[PAGE 24]


    # ‘Tell the Truth and act as if that truth is real’


    The statement ‘Tell the Truth and act as if that truth is real’ is an extreme
    violation of the reformist paradigm. For reformism you only tell the truth to
    the extent that you think people can cope with it, and you only act on it to the
    extent that you think you can win (in a gradualist way).


    This is how reformism ends up in a morally and spiritually bad place – lying and
    holding back actions which are now justified. So what is the revolutionary alternative?'
  - '[PAGE 25]


    # # A proposal for Rebellion


    # ## The core proposal


    There are then opposing broad logics going forward. There is the reformist logic
    which is to engage and become ‘credible’ and settle for a gradualist progression.
    And there is the expansion of the revolutionary logic on the basis of the successes
    experienced so far. I want to argue that it is now necessary to pursue the latter.


    In the event of the unwillingness of the government and the elites to respond
    even minimally to demands for structural change, we must draw the conclusion that,
    due to the dire crisis we face, only a change in the political system itself can
    lead to our demands being enacted.


    This could take the following form: We issue a public statement that if, by a
    specific date, the central government has not responded to our demands and started
    to enact credible measures to respond to the existential climate and ecological
    emergency, we call for mass nonviolent civil disobedience.


    # ## The demand


    Given the complete moral failure of the government to respond, the demand should
    be: The current government hands power to an administration which will call a
    national climate and ecological emergency and immediately enact measures to deal
    with the climate and ecological crisis.


    # ## What next? The people decide


    It is one thing to propose a rebellion or revolution, but it is another to work
    out what happens next. There has to be a plan for a credible and attractive alternative
    arrangement in place. This is a National Citizens’ Assembly'
  - '[PAGE 26]


    selected by sortition to work out the programme of measures to deal with the crisis.
    Sortition involves selecting the members of the assembly randomly from the whole
    population and uses quota sampling to ensure that it is representative of the
    demographic composition of the country. This proposal then is both concrete and
    democratic.


    The National Citizens’ Assembly will become the new governing body of the UK and
    will deal with the climate crisis. It will make decisions on the following:


    +   - Legislation to transform the economy and society to respond to the existential
    climate and ecological emergency.

    - Other social legislation which follows the will of the assembly rather than
    the former political class.

    - Draw up a new constitutional settlement which creates a genuine participatory
    democracy fit for the 21st century.


    # The revolutionary context


    There is more than one revolutionary context. Some are more obvious than others,
    but are also difficult to assess because they involve an awareness of what is
    largely hidden: people’s private desire to be rid of the failed regime. Or, potentially,
    and more importantly, the number of people who are indifferent to whether the
    political system is removed or not.


    Some things are important to remember here. We need only a few hundred thousand
    people to actively break the law and/or support such activities to put us in the
    ballpark of structural change. We can see that five days of insurrection by 200,000
    people in France produced a back down by the government. We should not make the
    mistake of thinking ‘the people to rise’ in the sense of the majority of the population.
    We need a few to rise up and most of the rest of the population to be willing
    to ‘give it a go’.


    # Structural weakness within elites


    The great structural weakness of any elite is that the seeds of its destruction
    are created by its very success at domination. Success creates separation from
    real life and a bubble of self-reinforcing orientations – namely that'
  - '[PAGE 27]


    everyone thinks our system is fine. Secondly, elites start with a virtue ethics
    orientation, which places emphasis on the role of an individual’s character and
    virtue in moral philosophy rather than an individual’s duty or actions in a pro-social
    and pro-environmental way.


    They believe in ethical values, but they end up only believing in two things:
    money and power. This process of degeneration is now well advanced.


    From the other end of the spectrum, the belief in the political system from those
    on both the left and the right has withered since the financial crisis, as evidenced
    by the rapid growth of radical political groups which use anti-system rhetoric.
    There is growing rage at the injustice of extreme inequality and the unaccountable
    global elites and now we have the emergence into public consciousness that not
    only have these people robbing us for 30 years, but they are now going to take
    us to our deaths.


    # Bring down the government you say?


    I would argue the slogan: ‘Bring down the government’ (or similar) has an incredible
    (and therefore actually a very credible) ring to it. Its attraction is that it
    fully releases the social repression in the most clear and explicit way — we want
    to get rid of it. It is simple, concrete and dramatic.


    Question: ‘What do we want?


    Answer: ‘To bring down the government.’


    You can imagine the elites and the establishment saying, ‘How ridiculous!’ whilst
    ordinary people say, ‘Well, it can’t go on as it is’. Rebellion is about giving
    people permission to say what they really think. It creates the connective tissue
    for solidarity that many don’t realise exists.


    This releases enormous political energy and imagination. This is what has powered
    the rapid explosion of support for Extinction Rebellion. Rebellion is ridiculous,
    but for that very reason, it is appealing. It is transgressive, and people want
    to break the existing rules and to see that now set-up is finally going for it.
    There is a deep psychological attraction to going into the unknown world where
    we are only offered the option to ‘put up with it and fit in’. There is much to
    indicate that in crises people seek'
  - '[PAGE 28]


    meaning in what is happening, as well as material security. This is supported
    by the evidence of the last nine months.


    The materialist analysts on both the conventional left and right have missed this
    because they both accept the reductive dogma of neoliberalism that money and consumerism
    dominate our lives. A broad historical analysis shows this is plainly wrong.


    # Revolutions often fail


    On the other side of the equation, there is a big reason why revolutions do not
    work: there is no credible pathway for order to come out of inevitable chaos.
    If there is no plan, then a political vacuum appears which leads to the escalation
    of revolutionary violence and/or people falling back into the arms of the old
    elites.


    This is not a reactionary consideration. Permanent revolution is hell, not heaven,
    as the record of the 20th century shows. People want change, but, contrary to
    political enthusiasts of all shades, do not want politics to dominate their lives.
    There are more important things to consider: family relations, creating beauty,
    gossiping, having a laugh, making a living – the constants of all human societies.


    The political revolution that is proposed here has to find a tricky balance between
    a joyful exuberant celebration of collective human agency – we will decide for
    ourselves and such like – putting a brake on a utopian excess. The fundamentals
    of life remain the same: we still have to face death, we have to master ourselves
    and learn to relate effectively with others and so on. Politics is a significant
    part of life, but it is not all of life. This is where we can move on from politics
    as domination which generalised the 20th century.


    The key element in persuading people that the whole thing will not end in tears
    is that we have an answer to the most fundamental question of politics: ‘Who decides?’
    The main reason why revolutionary episodes have failed miserably over the past
    30 years is that revolutionaries have either no answer to this question (e.g.,
    the short-lived Occupy Movement) or fall back on the representative parliamentary
    answer which has been shown to be'
