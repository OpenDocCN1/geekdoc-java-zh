    and as such provides a clear pathway to a post-revolutionary resolution to the
    central question of politics: ‘Who decides?''


    A solution which is satisfactory to both liberal and revolutionary constituencies
    is necessary. It is only when these two political orientations make an alliance
    that an elite falls. A key part of our strategy will be to sell the plan to a
    critical mass of the liberal elite ‘defectors’ as well as to the 1% of the general
    population who will lead the disruption.


    # Citizens’ Assemblies in more detail


    Citizens’ Assemblies, chosen by the process of sortition (i.e. randomly selecting
    citizens from all sectors of society), have become very popular over the past
    few years, especially regarding how Brexit could have deliberated over more effectively.
    In essence, they are the roots of original notions of democracy. As part of a
    Citizens’ Assembly, the selected citizens are exposed to a 360-degree understanding
    of an issue, which puts them in a better position to make decisions than politicians
    who are under the influence of a barrage of lobbyists and careerist considerations,
    both of which take them away from the simple matter of making an educated choice
    that is aimed at the best outcome for all.


    Citizens’ Assemblies allow ordinary citizens to learn about and decide on issues
    that are often too hot to handle for politicians who fear repercussions from the
    electorate. The Citizens’ Assembly in Ireland 2016 is a good example of how an
    issue could have destroyed a political career was taken on and deliberated over
    by 99 randomly chosen citizens to great effect and succeeded in repealing an archaic
    law that demonised women and took away their right to make decisions about their
    own bodies.


    In the case of climate breakdown and how society is going to avoid the worst effects
    of it, Citizens’ Assemblies are our only truly democratic hope. The transition
    that will shown be necessary would be political death for any one party they suggest
    the changes that will be required. It is the antidote to the corporate-captured,
    broken democracy of today and indicates a future that can be run truly by the
    people and for the people the well-being of all as the central operating principle.'
