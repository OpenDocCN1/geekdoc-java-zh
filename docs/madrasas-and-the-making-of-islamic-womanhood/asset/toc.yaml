  - 经堂学校与伊斯兰女性的塑造，这所特定的经堂学校被围得非常严密，有多层安保措施，这可能让人感到非常不受欢迎和畏惧。经堂的员工和学生都是穆斯林。因此，作为一名印度教徒，我在经堂里完全是一个异类。在最初的几次访问期间，我因层层安保、着装要求和规范感到非常畏惧，尽管随着时间的推移，我对这种安排变得越来越从容。
