    To conclude, this section details the educational regime in the madrasa. It highlights
    the manner in which the madrasa fashions the ideal of a kamil momina into an educational
    template that incorporates a closed physical structure, institutional routines,
    rules and regulations, and bodily practices. This educational regime is instituted
    and practiced by the madrasa authorities with the distinct objective of disciplining
    the girls—their appearance, speech, deportment, behaviour and movement—till such
    behaviour becomes a natural part of them. However, this disciplinary regime is
    not entirely representative of the experiences of the students and only exemplifies
    the normative expectations of the madrasa and parents. The following chapter juxtaposes
    the disciplinary madrasa regime as understood by the parents and madrasa with
    the everyday lived experiences of the madrasa students. This allows us to trace
    the tensions and ambiguities in the continuum between normative expectations and
    actual experiences of the girls.'
