    Early in the morning between 7:45 and 8:00 am and in the afternoon from 2:00 to
    2:15 pm when the day-scholars arrive and leave respectively, is the only time
    they see a group of burqa-clad girls in the madrasa compound. In this context,
    the madrasa structure and building can be seen as symbolizing the practice of
    purdah. Purdah, which literally translates to veil or curtain, refers to a wide
    range of practices in the South Asian context from gender segregation, seclusion
    by varying degrees of restrictions on women’s dress and mobility. In the case
    of Madrasa Jamiatul Mominat, the architecture of the institution is structured
    to conceal any signs of the presence of girls. The girls’ madrasa is located in
    the inner recesses of the madrasa building. An iron gate locked from outside secures
    the staircase leading to the madrasa, guarded by a middle-aged widow who all the
    girls call khala.² The jali (perforated stone or latticed screen) cut walls the
    line of the madrasa veil it from the outside world, lending the impression of
    a windowless structure to an onlooker standing outside. Yet, as one climbs up
    the marbled staircase illuminated from the light streaming through the jali, one
    can feel the cool misty air from the Yamuna and see the river quietly flowing
    across the busy road. The madrasa comprises three floors; each with a long corridor
    lined by three rooms on either side which function as classrooms during school
    hours (8:00 am to 1:30 pm) and hostel rooms during the remaining part of the day.
    Each floor has a toilet and bathing area and at the end of the corridor there
    is a line of taps for the girls to do wudu (ablutions). Each of the floors has
    a teacher’s room shared by three teachers. The first floor has a library, and
    the third floor has a computer room.


