  md: 'Literature on girls'' madrasas, especially in the South Asian context, highlights
    some critical issues motivating the choice of mada education. Several scholars
    highlight the importance of economic factors by illustrating how madrasas are
    the only affordable option for poor Muslims (Ja and Jhingran 2005), with obvious
    economic benefits such as no fees, boarding, and lodging (Engineer 2001). In a
    similar vein, some scholars present madrasas as viable alternatives in a context
    of declining or inadequate government schools, especially in rural areas (Jeffery,
    Jeffery, and Jeffrey 2005). A second set of studies focuses on identity related
    factors (Ahmad 2002; Alam 2003; Saiyed and Talib 1985) arguing that parental concerns
    about distinct Muslim identity motivate the choice of madrasas. The problem with
    each of the above-mentioned arguments is that they tend to frame choices as religious
    madrasas versus the so-called mainstream secular schools. Scholars who have worked
    on madrasas in the subcontinent, such as Bano (2012), rightly argue that the choice
    of madrasa education is often an attempt to complement secular education with
    religious knowledge rather than substitute secular schooling. Although my fieldwork
    resonates with this third line of argument, it calls for a more critical approach
    by presenting the complexity of educational choices. In the parents'' understanding
    of girls'' madrasas as the ''right'' kind of school for their daughters, the mixed
    curriculum which combines religious and secular subjects is just amongst many
    intertwined reasons. The following section draws on interviews and discussions
