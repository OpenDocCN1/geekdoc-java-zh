  md: '# Note on Translation and Transliteration


    All the English translations from Urdu and Hindi are mine. I translated the Urdu
    and Hindi words into English following standard transcription convention. I tried
    to remain as close as possible to the pronunciation of colloquial Urdu used by
    my respondents. I chose not to use any transliteration guideline, as I did not
    want to make my respondents seem/appear chaste speakers of literary Urdu while
    writing the field-based narrative. Following Barbara Metcalf in her book Islamic
    Revival in British India: Deoband, 1860–1900, I too chose to ‘translate without
    diacritics in order to present a less encumbered appearance’ (p. xxix). For readers
    who are keen to know the literary Urdu rendition of the colloquial urdu used by
    my respondents, I use diacritics in the glossary following the Annual of Urdu
    Studies transliteration guidelines, 2007. The only exceptions are words that are
    commonly used in the English like madrasa, burqa, ummah, purdah, sharia, namaz,haram,
    halal, etc. and names of institutions like Darul Uloom Deoband and Darul Uloom
    Nadwatul Ulama, etc. for which I have relied on the English names used in their
    publications/websites.'
