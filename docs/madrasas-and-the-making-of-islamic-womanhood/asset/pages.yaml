    For a number of reasons, education levels of girls across region, caste, and community
    are increasing in India. In this regard, perhaps the two most notable developments
    have been the gradual increase in both schooling levels and marriage age of girls.
    More Muslim girls are now availed education than in earlier years. However, the
    education of girls continues to remain an option fraught with risk and anxiety.
    Discussing how the gender-based fear of the public is magnified in the case of
    Muslim women, the Sachar Committee Report (Government of India 2006d) noted that
    this fear translates into constant scrutiny and control over women’s lives, morality,
    and movement in public spaces’ (Government of India 2006d: 13), with ‘safe spaces
    (both in terms of physical protection and in terms of protection of identity)’
    becoming confined to that lie within the boundaries of the home and the community
    (Government of India 2006d: 13). In this regard, madrasas are often viewed as
    educational institutions for operate within the boundaries of community given
    they encourage practices such as segregation of girls, practice of purdah, and
    limiting the participation of girls in life outside the community. The above count
    illustrates the manner in which the complex relationship between communalization
    of social spaces, social exclusion of Muslims, and the ‘new religiosity’ fostered
    by the rising salience of Islamic reform projects in India impacts the everyday
    engagement of women with spaces like education.


