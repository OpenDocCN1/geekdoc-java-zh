    # MADRASA JAMIATUL MOMINAT


    # Site and Surroundings


    The eighteenth-century legendary poet Mir Taqi Mir described the lanes of Delhi
    as paintings from a painter''s album.¹⁰ Driving through the lanes of Jamia Nagar
    brings myriad images, sounds, and smells of the distinct Muslim culture in Delhi.
    Jamia Nagar, a Muslim-dominated neighbourhood in southeast Delhi, lies just behind
    Jamia Millia Islamia¹ and many attribute the genesis of the locality to their
    shared vision with the jamia campus. With 90 per of its residents Muslims, Jamia
    Nagar is one of the largest concentrations of Muslim population in Delhi,² with
    officially a population of around 1.2 lakh (Registrar of India 2001), though officially
    the numbers are pegged at 3.75 lakh. Nestled between the river Yamuna on the east
    and Mathura Road²³ on the west, the permeable boundaries of Jamia Nagar include
    a collection of 10-old colonies such as Zakir Nagar, Batla House, Okhla Vihar,
    Shaheen Bagh, and so forth. The area is often referred to as a ‘Muslim ilaqa’
    (area) by its residents and/or ‘ghetto’ by outsiders, though Gayer and Jaffrolet
    (2012), is more appropriate. A majority of the residents of Jamia Nagar are migrants,
    generally from the neighbouring states of Uttar Pradesh and Bihar, though one
    is likely to find people belonging to most Indian states in the area (Abidi 2009;
    Kirmani 2009). Many of the residents who belong to the older


