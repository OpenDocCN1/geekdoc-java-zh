    and promote themselves as educational institutions constructing, strengthening,
    and serving the ummah by educating girls into becoming pious Muslim women through
    religious education. The everyday educational practices in the madrasa are represented
    and legitimized to the parents in the name of building the ummah. The parents
    aspiring to be a part of the ummah subscribe to the madrasa''s vision by sending
    their daughters to the madrasa, thus consenting and reinforcing the role of madrasas
    as ummah-building educational institutions. Thus, madrasas are both a ''model
    of and made for'' (Geertz 1973) the imaginary production of the ummah. On one
    hand, madrasas represent a certain understanding of Islam, objectifying in very
    concrete terms the set of beliefs and practices that define a ''proper Muslim''
    and how to become a good pious Muslim woman. On the other hand, they argue that
    the practices that define a proper Muslim need to be learnt and Islamic schooling
    in madrasas is an important requisite to learn these practices.


