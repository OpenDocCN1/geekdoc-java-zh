  md: '# Introduction


    in accordance with prevalent Islamic prescriptions is an important analytical
    step which allows us to challenge the notion of agency as being restricted to
    ‘acts that challenge social norms and not those that uphold them’ (Mahmood 2005:
    25). She nevertheless tends to overstate the role of piety, presenting an idealized
    picture of ‘non-conflicted coherent moral selves’ (Bangstad 2011: 32), which seems
    to remain static over time. Mahmood’s ethnography makes little effort to discuss
    the ambiguities, partialities, and complexities of Muslim women’s lives. As Bangstad
    argues, ‘one gets little sense of the actual behaviour of these pious Muslim women
    in other social fields’ (2011: 32). Despite her assertions regarding the need
    to pay attention to the context, Mahmood’s own work does not reflect on the constraints
    that limit the women’s ability to exercise agency emanating from their socio-economic
    context. These criticisms highlight how Mahmood’s work, though important, fails
    to look at instances when piety is not an end in itself or absolute or stable
    over time, but ambivalent, partial, contradictory, and changing in light of the
    constraints under which it is articulated. It fails to look at the personal journeys
    of women, future aspirations, the possibility of working differently in different
    spaces, or of pious submission having a strategic agenda.


    This critique is particularly relevant my focus on piety cultivated through institutionalized
    Islamic education in a madrasa. Recent anthropological work from across diverse
    sites and contexts in India—be the middle-class young men and women in Kerala
    colleges (Lukose 2009), Dalits in a rural village (Ciotti 2006), lower-case women
    in Nampalli (Still 2011), or children studying in Marathi schools with Hindu nationalist
    agendas (Abenei 2008)—highlights how education represents a paradoxical resource.
    A particular educational project may be envisaged with the view of producing practices
    and identities consonant with the local notions of an educated person, but the
    adoption of some of these learned practices and identities may challenge these
    very notions. Mahmood’s work allows us to analyse the conformism in madrasa education
    as ag but but provides no understanding of the more paradoxical and ambivalent
    aspects. Recent work on madrasas (Alam 2011; Jeffery, Jeffery, and Jeffery 2004,
    2006, 2008; Winkelmann 2005) alludes to the tensions that are arising as madrasas
    open up to new possibilities for mobility and change.'
