  md: '# Introduction


    practice. As institutions that sustain, preserve, and promote Islamic traditions,
    girls'' madrasas are emerging as significant players in the education of Muslim
    girls in India (Gupta 2009; Jeffery, Jeffery, and Jeffrey 2004; Metcalf 2007;
    Nayar 2011; Sikand 2005; Winkelmann 2005). In the larger social landscape of India
    marked by rapid change, the expectations around girls'' education and marriage
    are also altering. In this context, the choice of sending daughters to girls''
    madrasas can be seen as subjecting the girls to a form of anticipatory socialization
    (Merton 1957). Girls from villages and small towns are sent to residential madrasas
    in cities in the anticipation thatrasras education will equip them with the requisite
    values and standards of a pious, educated girl. This highlights how a strong consensus
    about a certain kind of education for Muslim women is being fostered, supported
    by a wide network of of actors such as the ulama, religious heads, and a significant
    section of the community, believe that madrasas are institutions where the imagined
    construct of an ideal Muslim woman can be achieved through the template of education
    that girls'' madrasas offer.


    What is intriguing is how little the above consensus tells us about the girls''
    perspectives and the experience of the acquisition of knowledge, values, and morals
    taught in the madrasa. As Michel de Certeau writes:


    > The presence and circulation of a representation tell us nothing about what
    it is for the users. We must first analyse its manipulation by users who are not
    its makers. Only then can we gauge the difference or similarity between the production
    of the image and the secondary production hidden in the process of its utilisation.
    (1988: xii)


    It is this second image hidden in the girls'' experience of madrasa education
    which constitutes the focus of my work. I investigate what the girls make of (De
    Certeau 1988) madrasa education. By focusing on the experiences of girls, my work
    highlights the differing visions of Islamic womanhood that emerge in madrasas
    and how madrasa education becomes a space and a resource in negotiating the tensions
    arising from these multiple visions. This brings me to my first subquestion: What
    is the role of education in defining and translating the imagined ideal of Islamic
    womanhood into practice?'
