    as their raison dêtre. In fact, the madrasa boards of some states¹⁰ spokespersons
    of several madrasas¹¹ Muslim bodies have gone as far as formally ban co-education,
    describing it as against the tenets of gender segregation prescribed in Islam.
    Given this context, it was not surprising that the students I interviewed had
    little or no experience of studying with boys prior joining the university. A
    majority of the girls had spent their adolescence in the madrasa and the only
    previous experience of studying had had boys with their brothers or cousins at
    home or in school when they were kids. During interviews, most of the girls shared
    that prior to joining the university they regarded co-education as a strict no-no,
    the factors rendering co-education unacceptable ranging from being haram (forbidden)
    in Islam to the potential danger of moral corruption intermingling of men and
