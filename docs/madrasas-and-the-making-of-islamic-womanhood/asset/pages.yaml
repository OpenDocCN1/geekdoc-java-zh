  md: '# Madrasas and the Making of Islamic Womanhood


    returned to the madrasa in August 2012, Nikhat had been appointed as a teacher.


    Nikhat joined Madrasa Jamiatul Mominat in 2007. The 15-year-old Nikhat had just
    finished Class Ten from a private English-medium school in Tijarpur, Rajasthan,
    when her father, uneasy about his daughter''s obliviousness to Muslim culture,
    decided to shift from the neighbourhood village school to a girls'' madrasa in
    Delhi. Nikhat wrote the madrasa admission test at her father''s behest. Over time,
    she grew to like the madrasa; she felt privileged that she had got a chance to
    study her religion in the madrasa and learned to live her life the ‘right way’.
    Her status as an alima won her adoration from parents, relatives, and neighbours
    each time she returned home during the vacations. Interacting with other girls
    in the madrasa and hearing the examples of madrasa alumni studying at a big nearby
    university, Jamia Millia Islamia, Nikhat realized that after her education she
    could go to university too. When I met her, Nikhat had just entered her second
    year of BA (Honours) Urdu at Jamia Millia Islamia.


    Nikhat''s journey from a village school to a prominent university in Delhi exemplifies
    the profoundly important role played by girls'' madrasas in India today, and why
    they deserve scholarly attention. Madrasa Jamiatul Mominat provides the context
    in which Islamic womanhood becomes the focus of this monograph. Few other studies
    sought to capture the unfolding of these young women''s lives over time. This
    book focuses on three junctures, or transitions, in the girls'' lives and is unique
    in bringing together an attention to community, piety, and gender aspiration.
    The first juncture is the girls'' transition from their natal homes in villages
    and small towns across India to Jamiatul Mominat, primarily a result of their
    parents'' decision to educate their daughters in a residential girls'' madrasa
    in Delhi. The second juncture is in the manner in which the girls'' aspirations
    are aided, abetted, and strengthened at the madrasa. This is in spite of the fact
    that madrasas envision and encourage girls to largely restrict themselves to religious
    activities and family life. The third juncture is


    > 4 Alima means learned woman. It is generally used to refer to women who are
    learned in Islamic knowledge. Girls who graduate from the madrasa are called alima.
    In fact, the brochure of Madrasa Jamiatul Mominat refers to its course as the
    ‘Alima course’, spanning five years.'
