    how women exercise the ''right'' amount of freedom balancing family and work by
    enacting a model of respectable femininity they pursue only those limited opportunities
    offered by a professional job that maintain the sanctity of a woman''s sexual
    purity. Similarly, Gilbertson''s (2014) research with middle-class women in Hyderabad
    highlights how women adjust their self-presentation to ensure that they are respected
    in the public domain by dressing and behaving in a modest manner, avoiding spaces
    where men congregate, and so on. This results in limiting their engagement to
    increasingly privatized and exclusive public spaces. Lukose''s (2009) research
    looks at how female college students move in public spaces in a contained and
    purposeful manner—their eyes looking down, bags and books tucked to their body,
    in stark contrast to the ''open'', aimless manner in which men remain in the college
    campus. Lukose (2009) illustrates how the demure female women enter the public
    domain, but in ways that circumscribe their movements. She argues that the whole
    process of women''s education is linked to the gendered project of producing a
    feminine identity based on new forms of middle class respectability.


