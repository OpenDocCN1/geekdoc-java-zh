    # Complex Linkages


    Far from typifying madrasas in terms of traditional versus modern and religious
    versus secular education, my research highlights that it is not dichotomies but
    a continuum at work. The madrasa and mainstream educational institutions do not
    represent mutually insulated spheres; they are characterized by constant-and-fro
    movement and continuity. These linkages are often self-consciously contrived,
    with madrasas actively seeking to get recognition for their qualifications from
    universities and education boards, or spontaneously generated by parents and students.
    The girls I researched had studied in so-called secular schools, ranging from
    government to private schools, before joining the madrasa. Several of them, while
    in the madrasa, were simultaneously sitting for open school exams through the
    distance learning mode. On the completion of their madrasa education many of them
    opted for higher education in central universities that recognized madrasa degrees.
    The importance of the role-played by madrasas in facilitating admission to regular
    primary schools (SPQEM Evaluation Report 2013) and higher education (Government
    of India 2012c) has also been highlighted by recent research.


    In situating the demand for madrasa education in the wider canvas of the community
    and the family, my research demonstrates the range of push and pull factors that
    drive and feed the demand for madrasa education. The current policy discourse
    presupposes the educational demand of Muslim people in terms of madrasa versus
    secular, ignoring the intersecting factors that shape parental choices, such as
    socio-economic marginalization, real fears against the growing prejudice and discrimination
    against Muslims, desire for a culturally appropriate mahal, and the combination
