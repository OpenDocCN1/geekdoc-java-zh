    # Communalization of Social Space


    The intensification of communal politics over the past two decades in India has
    led to an unprecedented communalization of social space. This is best demonstrated
    by the consolidation of the socio-political hold of Right-wing ‘Hindutva’ forces
    across India. Built upon the premise of a monolithic, non-Hindu entity, the Hindutva
    movement seeks to unite the lower castes and tribes into the Hindu fold by constructing
    the minority communities, especially Muslims, as the ‘Others’ (Hansen 1999; Jaffrel
    1996). This is manifested in the prejudices and stereotypes targeting Muslims¹⁰
    propagated and sustained by the Right-wing Hindu forces, especially the Sangh
    Parivar,¹¹ which fan the fear of the ‘abstract generalized Muslim’ (Hansen 1999).


    > ¹0 Stereotypical caricatures of Muslims as alien invaders and aggressive, ultra-fertile
    men and over-fertile women threatening to outnumber the Hindus, meat-eaters with
    innately violent tendencies, extremists with extra-territorial loyalties, religious
    faiths, appealed minority, and so on, are spread by propaganda campaigns of the
    Hindu Right (Basu 1993; Hansen 1999).


    > ¹¹ Sangh Parivar refers to the ‘family’ of affiliated Hindu nationalist organizations.
    Instituted in 1925, the Rashtriya Swayamsevak Sangh (RSS) constitutes its foundational
    organization. Earlier considered a body for cultural work and building (Basu 1993:
    24), it expanded into a wide-ranging network for all kinds of socio-political
    matters (Basu et al. 1993: 33–50; Jaffrel 1996). Its political wing, earlier the
    Jana Sangh, later the BJP, was founded in 1951. The Vishwa Hindu Parish or World
    Hindu Council (VHP), the international wing of the Sangh Parivar, dedicated to
    cultural work, and their youth wing, Bajrang Dal, were established in 1963. It
    has many affiliated organizations with specific purposes such as the Trade Union,
    women’s organizations such as Durga Vahini, and educational organizations as Vidya
    Bhakti.'
