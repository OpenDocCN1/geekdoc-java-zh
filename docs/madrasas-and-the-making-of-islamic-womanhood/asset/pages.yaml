  md: '# Introduction


    the transition by some students, like Nikhat, from the closely scrutinized and
    externally monitored environment of the madrasa to university life. I focus on
    these three junctures to examine how education becomes the site where the meaning
    of what constitutes a Muslim woman is negated in the everyday lives of madrasa
    girls.


    Drawing from the lives of madrasa students like Nikhat, I argue that the imagination
    and aspiration that constitutes the experience of learning to become a *kamil
    momina* tells a very different story of what girls make of madrasa education.
    The ideal womanhood that the madrasa students learn, enact, embody, and aspire
    differs from the ‘pious subjects’ (Mahmood 2005) envisaged in the education mission
    of the madrasa and envisioned by the parents. The girls’ aspirations and world
    views have an inherent flexibility that allows them to legitimately express themselves
    as pious and educated women within the larger socio-religious context. At one
    level, girls value and adopt many of the markers taught as *amal* or the practice
    of piety based on religious knowledge. At another level, there is a more tactical
    aspect to cultivating one’s identity as a madrasa-educated girl. The girls use
    the legitimacy that madrasa education confers to redefine social expectations
    around marriage, further education, and employment. By highlighting the everyday
    dilemmas and tensions that madrasa education brings in its wake, my research uncovers
    significantly new understandings of girls’ Islamic education and its contribution
    to the negotiation of gender in the family and the wider community. In making
    this argument, this text engages with anthropological literature on imagination,
    aspirations, gender, and Islamic piety.


    In the first part of this introduction, I present the larger theoretical debates
    within which I weave my argument. A key contribution of this book is to put these
    debates into dialogue, showing how on imagined communities, feminist and anthropological
    scholarship on women’s poetry, and Appadurai’s (2013) concept of the ‘capacity
    to aspire’ can help us think through the possibilities and constraints shaping
    a new kind of educated Muslim woman in India. In the second section I describe
    my experience of being in the field and the last section presents an outline of
    the following chapters.


    5 Kamil Momina in Urdu means an ideal, complete, or perfect Muslim woman.'
