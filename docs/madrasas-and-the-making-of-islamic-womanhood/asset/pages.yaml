    # Socio-Economic and Educational Background of the Girls in Madrasa Jamiatul Mominat


    Many scholars who have worked on madrasa education in the South Asian context
    have elaborated upon the importance of the socio-economic location of the families
    of madrasa students. Several scholars have argued that madrasas are a popular
    choice for poor Muslims (Jeffery, Jeffery, and Jeffery 2005; Jha and Jhingran
    2005; Sikand 2005). However, there is an increasing realization that rather than
    the poor, today madrasas primarily attract students from lower middle-class backgrounds
    (Bano 2012; Winkelmann 2005). Bano’s (2012) work in Pakistan is revealing in this
    regard. In line with her overarching argument that madasa education is exercised
    as a rational choice, she discusses the appeal of madrasas for the ''lower'' and
    middle tiers of'
