    Bringing these together, my work examines the relationship between madras education,
    Islamic gendered ideals, and everyday aspirations of Muslim girls through an ethnographic
    account based on 12 months of fieldwork.


    # IN THE FIELD


    On one of the Thursdays in 2012, I was sitting on my haunches as a part of an
    audience of 350 girls in the basement of the madrasa trying to ensure the unaccustomed
    dupatta on my head remained in place each time I felt to scribble in my notes.
    My senses were focused on the makeshift, slightly elevated stage where some of
    the students were performing. Every Thursday, students organized this half-day
    session of performances, which included *taranas* and *naats* (poetic glorifications
    of the Prophet of Islam) and *taqrir* (speeches). The rhythmic words of the naat
    *Sahibe Taj wo, Shahe Miraj wo* (He wears a crown, ruler of the celestial kingdom)
    were still resonating in my head, when of a sudden, I heard my name being called
    out on the slippery mike at the end of the hall. One of the students was saying,
    “Now I would request Hem Apa, who is studying our madrasa, and *Insha Allah* is
    going to write a book on us, to come and say something to us in English.”


    This innocent introduction, given by one of the students, captures I who was a
    researcher in the madrasa. I was the student’s Apa, a term of respect and endearment
    for an elder sister, who was studying Madrasa Jamiatul Mominat and was teaching
    some of the students and most of the teachers for almost an entire academic year
    in the madrasa. Much like the fate of the message in the game of Chinese whisper,
    my ‘doing my research in the ‘madrasa’ was communicated, interpreted, and interpolated
    by the students, and the above illustrates how my being a part of the madrasa
    while doing research was generally understood in the madrasa.


    In this section I explain how I conducted my ethnographic research and made sense
    of my fieldwork. In the last part, based on the understanding that as the teller
    this ethnographic representation is the tale as seen, heard, and experienced by
    me, discuss my socio-religious and educational background and its potential influence.'
