    described Jamia Nagar^24 to me:


    This was a completely open area lined with trees, now all I see is buildings and
    more buildings. No planning, no infrastructure just an influx of more and more
    people. There is no place left for the building to go other than upwards. Earlier
    it was a hub of the educated elite, now it is a colony of shopkeepers and property
    dealers. It has become like the other Muslim colonies—narrow lanes that keep getting
    narrower, mosques that keep getting bigger, bazaars all of them wanting to be
    the new Chandni Chow. The two you find at every turn are eateries and schools.


    Not to be dismissed the rantings of an old man, Dr Syed''s words in many ways
    capture the transformation that Jamia Nagar has witnessed. Today, it is widely
    regarded as an area that houses middle- and lower-middle class Muslims, mostly
    small business holders and traders scattered amidst them are a diverse group of
    rich professionals and businessmen who chose to stay here owing primarily to the
    security Jamia Nagar affords as a Muslim neighbourhood (Gayer 2012; Kirmani 2008).
    On the fringes of Jamia Nagar are slum dwellings that have home to a growing number
    of migrant labourers. Large parts of the area continue to bear signs of their
    erstwhile ''unauthorized'' status, even though most localities are now authorized.
    The area is marked by a perennial struggle of water, power cuts, a dysfunctional
    sewage system, and insufficient health, educational, and recreation facilities
    (Abidi 2009).


