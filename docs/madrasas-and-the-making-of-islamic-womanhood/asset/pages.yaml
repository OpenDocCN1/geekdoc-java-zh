    Understanding Practices of Piety among Madrasa Students


    How does one analyse the girls'' accounts and practices? It is tempting to read
    their accounts as exemplifying the internalization of madras ideals. However,
    such an analysis does not pay adequate attention to the embodied experiences of
    the girls. The students'' accounts and practices resonate more closely with anthropological
    studies that conceptualize pious submission to traditional Islamic ideals as an
    active mode of self-fashioning (Deeb 2006; Frisk 2009; Mahmood 2005). Particularly
    relevant to my research is Mahmood''s (2005) argument on Islamic piety and embodied
    agency based on her ethnographic research with women participants of the dawa
    movement in Cairo. Mahmood (2005) illustrates how women in the dawa movement do
    not seek to challenge established gender norms; instead, they acquire religious
    knowledge and cultivate a shy, modest self by embodying practices of pious submission.
    Critiquing the western liberal assumptions that posit ''women''s agency as substantial
    with resistance'' and the accompanying understanding of freedom and liberation
    as a universal desire, Mahmood (2005) locates agency in pious submission and conformity.
    Mahmood asserts that women'' outward practices of ritual and worship are not merely
    an expression of inward belief; rather, belief is a product of outward practices
    (2012: xv). She argues that ''agency is confined not to acts that resist multiple
    ways in which norms are lived and inhabited'' (2005: 15). Mahmood contends that
    ''the meaning of agency be explored in the grammar of concepts which it resides''
    (2004: 34). For the women in Mahmood''s study, practices such as donning the veil
    and ritual prayers were part of cultivating pious dispositions. Each practice
    was, as Mahmood describes, ''one among a continuum of the pious self ... as a
    necessary means to the realisation of a teleological programme of self formation''
    (2005: 128). In a similar vein, Frisk (2009) emphasizes the creative and generative
    aspects of the process through which Malay women ''actively cultivate themselves
    as subjects with a disposition to submit to God''s will'' (2009: 190).


    In my research, the students of Madrasa Jamiatul Mominat articulate and practise
    a very similar understanding of Islamic piety. For students, embodying madrasa
    prescribed norms is an exercise of'
