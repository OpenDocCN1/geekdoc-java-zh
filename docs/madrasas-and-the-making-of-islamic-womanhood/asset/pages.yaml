  md: '# UNCTAIN FUTURES: ASPIRATIONS AND EVERYDAY NEGOTIATION


    Talking to the girls about their educational history and how they got into university
    brought to light the intersecting concerns that shaped their rather uncertain
    futures. Aspirations emerged as an ongoing project, requiring the girls to negotiate
    with a range of actors and changing circumstances. Discussing their journey from
    the madasa to higher education, all the girls I interviewed highlighted that there
    were a range of factors, most of them outside their control, which determined
    the difference between wanting to study further and actually being able to pursue
    higher education. While there were notable differences in the girls'' evaluations
    of these forces, the common sentiment revolved around the number of things that
    had to fall into place for them to be in Jamia Millia Islamia. Often the girls
    could not anticipate the manner in which events would unfold and their ability
    to steer circumstances in favour of their own desires and aspirations was very
    limited. For instance,


    > When I was trying to get my elder brother to convince my father to let me take
    the entrance of Jamia hadn''t even thought as far as admission. I was just thinking
    of things how should I convince Abba (father)? Will bhai (brother) accompany me
    to the exam centre? What about the expense of travelling to Delhi?


    Sanjeeda (BA Arabic, 1st Year)


    > After I took admission I heard my classmates talking about how many hours they
    had spent studying for the entrance and how they did not sleep the night before
    the exam, and I thought to myself, I wish I had been in their position. I hadn
    slept for two days as I was travelling with my Aunt from Gaya (Bihar) to reach
    here (Delhi).


    Tasleen (BA Islamic Studies, 2nd Year)


    The central idea behind highlighting the factors constraining the girls is not
    to single out mostly educated students. Such constraints are part of a larger
    picture which is manifested in the abyssally low rate of participation of Muslims
    in higher education vis-à-vis other socio-religious categories. A recent report
    of the Ministry of Human Resource Development based on the latest National Sample
    Survey (2009–10) data illustrates that Muslims have the lowest'
