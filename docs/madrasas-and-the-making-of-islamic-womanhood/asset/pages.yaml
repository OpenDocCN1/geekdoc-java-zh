    > Notes from my first day in the field.


    The white building complex of Madrasa Jamiatul Mominat houses the madrasa and
    a school for girls up to Class Eight. The madrasa is affiliated with the Tablighi
    Jamaat. It is akin to a boarding school comprising both day-scholars and students
    who stay in the madrasa. The day-scholars comprise only one-third of the students,
    with the majority of students and teachers staying within the madrasa complex.
    The madrasa caters to close 700 girls aged between 12 and 21 years, primarily
    drawn from the states of Uttar Pradesh, Bihar, Jammu and Kashmir, Haryana, Punjab,
    and Delhi. Students are admitted to the five-year Alima course. In the first three
    years, the classes are divided into three sections but for the fourth and fifth
    there is just one section.


    The madrasa structure is reminiscent of the gender segregation between separate
    *zenana–mardana*28 areas that one often finds in old houses, especially in rural
    India, where the outer portions are designated as male spaces and the women conduct
    their activities in the inner recesses, concealed from the outside world. The
    madrasa in many ways represents the *mardana*. The iron gates at the entrance
    lead to a huge marble corridor. One only comes to know it is an educational institution
    on reading the notice boards fixed all along the corridor which detail admission
    dates, criteria for admission, results, and announcements. It is hard to spot
    even a single girl or hear voices of children that normally finds schools. The
    quiet corridor is lined with rooms on both sides that house the administrative
    offices. On the


