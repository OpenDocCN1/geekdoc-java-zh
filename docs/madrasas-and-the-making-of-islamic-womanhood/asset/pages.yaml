    An examination of the historical trajectory of the colonial education policy in
    India reveals a complex project driven by shifting administrative, socio-economic,
    and religious motives (Basu 1982), with a ‘conscious othering of the natives’
    (Kumar 2010) constituting its ideological core. Madrasas, as a key part of the
    indigenous school system in pre-colonial India, were deeply involved in this process.
    Colonial policies in the nineteenth century were instrumental in fostering a negative
    perception of madrasa education and concomitantly fostering the growth of a new
    kind of madrasa such as Deoband founded in 1867 and Darul Uloom Nadwatul Ulama
    in the 1890s.


    The policy of non-interference in education, characterized the early years of
    the rule of the East India Company, soon gave way to systematic efforts to understand,
    regulate, and reform the system of education in accordance with colonial interests.
    In 1813, for the first time the British Parliament included a clause to allocate
    certain sum for the education of natives’. Surveys and reports to understand and
    suggest improvements in the pre-existing education system were commissioned. For
    example, the Adam’s Report on the state of indigenous education in India document
    in great detail a vast network of indigenous schools such as madrasas, maktabs,
    tolls, and pathshalas (Nurullah and Naik 1951). The 1820s saw the famed Anglican
    Orientalists debate on whether the company should encourage western versus oriental
    learning and what should be the medium of instruction. Macaulay’s Minute of 1835
    resolved the debate in favour of English as the medium of instruction on ‘grounds
    of utility and inherent merit of the knowledge it would give access to’ (Basu
    1982: 5). These educational aims were inextricably linked with the economic aims
    of producing ‘clerks who could be employed cheaply’, evangelical concerns of spreading
    the civilization mission, and ideological aims of creating a class of Indians
