  md: '# Gender, Islam, and Piety


    In exploring the students'' engagement with madras mosque education, I focus on
    how girls understand, experience, and embody Islamic piety. To understand this,
    I draw on feminist and anthropological work that emphasizes Muslim women''s pious
    submission as an expression of agency and means of self-fashioning (Deeb 2006;
    Frisk 2009; Mahmood 2005). These debates challenge the deterministic binaries
    conveniently applied by feminist scholarship that conceptualize Muslim women''s
    engagement with Islam in terms of subordination (Kandyoti 1991, 1996; Wikan 1991)
    or resistance (Abu-Lughod 1986; Boddy 1989; Helgard 1998). This is best exemplified
    in the seminal work of Mahmood (2001a, 2001b, 2003, 2005). Through her ethnographic
    study of an urban women''s mosque movement as part of the larger Islamic Revival
    in Egypt, Mahmood (2005) presents an alternative conception of piety which the
    assumptions made in feminist and liberal scholarship about women agency, freedom,
    and autonomy.


    What is most relevant to my argument is Mahmood''s (2005) analysis of religious
    arguments and bodily practices in the cultivation of the pious self. Mahmood (2005)
    demonstrates how women embody Islamic virtues to develop a pious self. For example,
    she exemplifies how veiling is constitutive of piety and not the reverse (2005:
    23). The mosque women that Mahmood (2005) studied self-fulfillment by subjugating
    themselves to the Islamic doctrine. Mahmood illustrates this by drawing on the
    example of the pianist who surrenders his body to master the performance of the
    art, to argue that mosque women participate in embodied Islamic practices like
    fasting and praying to develop the capacity to act pious. She contends that women''s
    repeated embodied practices reveal how we can identify agency not only in the
    acts that resist norms but the multiple ways in which ''norms'' are lived, inhabited,
    inspired to, reached for and consumed (2005: 23). My work draws on Mahmood''s
    (2005) idea of a practical, embodied, conscious, embedded agency to understand
    how girls'' engagement with madrasa education in their everyday lives shapes and
    reflects the manner in which norms governing Islamic womanhood are not just received
    but also inhabited, aspired to, searched, and consumed.


    Mahmood''s attention to the embodied agency underlying Muslim women''s cultivation
    of a shy, modest, feminine, pious self'
