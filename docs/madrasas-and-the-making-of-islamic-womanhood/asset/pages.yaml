    The narratives of the madrasa graduates studying in the university highlight this
    transformative process of learning and unlearning that the transition from the
    madrasa to the university brings in its wake. They unlearn some of the behaviour
    which was considered ideal in the madrasa, such as walking and talking with their
    gaze lowered, being shy and demure, not interacting with men who may be potential
    marriage partners (ghair mahram), and so forth. They also unlearn the stereotypical
    impressions they may have formed about the ‘others’ with whom they had little
    interaction during their madrasa days, such as school-going girls and men. With
    greater interaction and exposure also come different views—for example, when I
    asked the madrasa educated girls in Jamia, in what ways were girls coming from
    schools different from them, most of the latter attributed positive qualities
    to school educated girls, saying the latter were more confident, knew better English,
    knew more about practical things like taking a bus or metro, booking tickets,
    filling forms, operating bank accounts, and so forth. They also talked about how
    girls from schools they described^{14 knew what was happening in the world, and
    did not hesitate to speak. Many of them confessed their prior prejudices about
    school educated girls, whom they assumed to be ill-mannered, shameless, and corrupt
    (besharam, behaya), loud, boisterous, and competitive, but explained how they
    had discovered on interacting with those that were not true for all. Another case
    involving such unlearning pertains to the critical stance adopted by the madrasa
    educated girls towards the ‘boys'' from madrasas’, who they stated they were the
    ‘worst’ of the boys in class as they passed the most marks and tried to pull the
