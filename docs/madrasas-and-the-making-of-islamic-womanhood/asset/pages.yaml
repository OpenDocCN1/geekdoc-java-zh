  md: '# Madrasas and the Making of Islamic Womanhood


    However this body of work does not delve deeper to explore how the tensions between
    the enabling and constraining aspects of madrasa education play out in the students''
    lives and influence family and community norms. The focus on madrasa prescriptions
    and students'' espousal of these practices within institutions observes attention
    to the everyday lives of students that lie outside these bounds. Further, there
    is little attention to the role of future aspirations of students. This brings
    to my second sub-question: How does the disjunction between the ideational construct
    of an ideal Muslim women and its practice reveal itself in everyday life?


    Aspirations

    I apply Appadurai’s (2013) conceptualization of the ‘capacity to aspire’ to analyse
    the madrasa girls’ envisioning of their future and how this demonstrates the complex
    relationship between the girls’ expression of Islamic womanhood and the larger
    context. Appadurai elaborates the capacity to aspire as a ‘cultural capacity’
    (2013: 187) to exemplify the complex dynamics of the conditions and constraints
    in which the poor negotiate with the norms that form their social life. What is
    particularly relevant to my work is his analysis of aspirations as ‘social’ and
    ‘relational’, finding expression in what he terms ‘densely local ideas’ (Appadurai
    2013: 187) about marriage, work, leisure, respectability, and so on. ...navigational
    capacity nurtured by real world conjectures and refutations. For marginalized
    girls belonging to the minority community, madrasa education enhances their capacity
    to aspire. For example, it provides them ready access to networks comprising of
    girls who have availed higher education and employment opportunities. As more
    girls nurture aspirations drawing on local ideas, these new opportunities are
    starting to get included in the vocabulary of the kamila mina that the girls are
    fashioning. However, the process of translating this imagination into practice
    is far more complex, as the reality of achieving aspirations means balancing these
    with circum stemming from girls’ socio-religious and gender location with madrasa
    prescriptions. As girls embody new ways of balancing aspirations and pious prescriptions,
    they contribute to a changing imagination of gender in the wider community and
    the processes of future-making.'
