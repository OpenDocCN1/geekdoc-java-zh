    their intent and efforts to become pious. However, she does not juxtapose these
    articulated responses (what women say) with actual practice (what women do). This,
    as Schielke (2009a) writes, creates an illusion of coherence obscuring the complexity
    of lived experiences.


    Recent anthropological scholarship (Deeb and Harb 2013; Osella and Soares 2010;
    Schielke 2009a, 2009b; Schielke and Debevec 2012) has highlighted the contradictions
    and ambiguity inherent in the lived practice of Islamic piety and the importance
    of locating piety in ‘complex social fields’ (Deeb and Harb 2013). Schielke’s
    (2009a, 2009b) ethnographic work on Muslim youth in Egypt highlights the ambivalent,
    contesting motivations, and contradictions that characterize the experiences of
