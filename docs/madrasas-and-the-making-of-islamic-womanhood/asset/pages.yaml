    # Introduction


    ''I am going to Jamia, Api,'' Nikhat''s excited voice reverberated through my
    phone. I had first met Nikhat as a student of Panjum (Class Five) during my preliminary
    fieldwork in Madrasa Jamiatul Mominat² in March 2012. She was 20 years old and
    was as a model student who spoke fluent Urdu and English and sang beautifully.
    In appearance, Nikhat conformed to all the ideals of a madrasa student: her thick
    black hair was tied in a tight plait with no strand of hair visible below the
    white headscarf, her kohl-lined brown eyes were cast downwards, and her very still
    hands and feet were just visible beneath her loose, long-sleeved salwar kameez.³
