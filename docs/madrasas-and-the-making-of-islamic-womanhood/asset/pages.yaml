  md: '# IDEALIZING ISLAM: AN IMAGINED COMMUNITY OF PIETY


    Any attempt to examine schooling in girls'' madrasas prompts an understanding
    of the larger context in which these institutions are acquiring increasing salience
    in India. This book is set within the broad field of gender, religion, and education,
    in particular Islam and schooling in girls'' madrasas. While the institution of
    Muslim girls'' schools in India can be traced to the colonial period, the concept
    of separate girls'' madrasas, which train women as religious specialists, distinct
    from the mosque-school or maktab, is relatively recent. In the past, girls'' religious
    training was restricted to basic Islamic rituals and was largely confined to the
    home. Today, a number of girls'' madrasas in various parts of India are engaged
    in training girls as alima and fazila, specialists in Islamic studies and communicators
    of sacred knowledge, a domain that was conventionally restricted to men. This
    raises the question: What conception of education, and to what end, is being pursued
    in the schooling of Muslim girls?


    In unpacking the question raised in the preceding paragraph, I draw on concepts
    of communities as imagined entities (Anderson 1991; Appadurai 1996) to understand
    the notion of an ideal Muslim community. An important building block of this moral
    community is the imaginary of the kamil momina or ideal Muslim woman who is invested
    with the role of preserving and communicating the community’s moral sanctity.
    This ideal Muslim woman is widely regarded as one who has a deep knowledge of
    her faith and uses that to help raise a Muslim family and fortify its commitment
    to the faith (Sikand 2005). However, I do not deploy the ‘ideal'' of Muslim womanhood
    as a predefined category. Instead, it is presented as an open-ended question,
    an aspired ideal. Education, I argue, amongst the key processes through which
    the imagination of an ideal Muslim woman is ‘transformed and vitalised into practice’
    (Schmidt 2005: 577). I demonstrate how certain forms of religio-moral education,
    such as madras education, which are perceived as subscribing to the same principles
    that the imagined community upholds and wants its members to practice, acquire
    great significance.


    I choose the girls’ madrasas as the focal site to investigate the role of education
    in translating the vision of an ideal Muslim woman into'
