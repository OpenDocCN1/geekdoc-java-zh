    All through my engagement with the madrasa, I largely relied on participant observation.
    However, as the nature of my participation in the ordinary routine and conditions
    of the madrasa kept changing, what I was observing around me varied considerably.
    The manner in which I was participating in the everyday activities and what I
    was doing—be it the teachers and girls as a teacher figure, or actives outside
    classrooms—allowed me to simultaneously understand and experience the different
    shades and meanings daily life took in the madrasa. It allowed me to see first-hand
    and closeup, how girls live and learn in the madrasa, how meanings emerge through
    student-teacher and peer group interactions, how belief makes certain actions
    and associations beyond questioning, and how uncertainties girls and teachers
    grapple with are reflected in their imagination of their future.


    All through the research process, all conversations and interviews were conducted
