    The ummah represents a similar imaginary production where members will never know
    or even see most of the others, yet they feel interconnectedness, or to use Anderson’s
    words, ‘deep, horizontal comradership’ (1991: 7) in an ideational space. Drawing
    from Anderson, Appadurai (1996) extends the concept of imagined community to ‘community
    of sentiments’, which emerges when groups of people begin to imagine and feel
    things together (1996:8). This notion of a ‘community of sentiments’ captures
    the manner in which the ummah as an imagined community simultaneously assumes
    the significance of ‘a symbol of cohesion and a cohesive force’ (Nieuwenhuijze
    1959: 15). This is because, on one hand, the continuous process of making individuals
    and groups of people aware of the religious commonalities that bind them into
    a community is critical to this imaginary production; and on the other, it is
    the idea of achieving the futuristic notion of ummah that makes the practice of
    religious traditions relevant.


    Here is important to note that though imagined, the ummah is not a fictional community,
    but a moral imagination deeply rooted in the theological and historical traditions
    of Islam. The term ‘ummah’ is used over 60 times in the Quran and appears frequently
    when ummah referred to the emerging Muslim community comprising both Arabs and
    non-Arabs. While the interpretation of ummah remains a much-contested issue (See
    Sahib 2014), the concern in the present research is more ethnographic. My engagement
    with the concept of ummah stems from its use by various actors, such as madrasa
    authorities, teachers, parents, students, and the wider network which the madrasa
    subscribes. I employ the concept of ummah to probe the relationship between the
    ideational community that the term invokes and the reality of the field. I argue
    that girls’ madrasas are a site where a complex relationship is at work between
    what Nieuwenhuijze (1959) terms the two notions of communities—the existing and
    the moral ideal. My objective is to juxtapose how the ummah is referred to in
    the madrasa’s vision and educational practices and how this vision relates with
    the everyday experiences of students who study in the madrasa.'
