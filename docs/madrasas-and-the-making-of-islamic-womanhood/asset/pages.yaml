  md: '# About the Author


    **Hem Borker** is assistant professor at the Centre for the Study of Social Exclusion
    and Inclusive Policy, Jamia Millia Islamia, New Delhi. She earned her DPhil in
    Education from the University of Oxford on the Clarendon Scholarship. Her research
    interests include education, social exclusion, gender, and youth. She also holds
    an MA in social work from the University of Delhi, and a BA in history from St.
    Stephen''s College, University of Delhi.'
