    the girls'' experiences draw attention to the heightened extent to which female
    madrasa students find their aspirations limited, their impetus to pursue their
    admission policed, castigated, and sometimes even apprehended. In order to even
    be eligible to compete, that to write the entrance examination, girls like Sanjeeda
    and Tasleem had to overcome significant challenges. Most of the girls I spoke
    recounted the multiple barriers they had to overcome, some emanating from within
    the family, from social and community norms, some personal limitations, and other
    practical constraints of resources to reach Jamia. These constraints, elaborated
    in the next section, draw attention to the constant tension between girls'' attempts
    to achieve their educational aspirations and constraints posed by actors and situations
    attempting to rein them in.


    # The Risks and Constraints of Higher Education: Family and Community Norms


    The girls'' narratives highlighted the constant tension between their aspirations
    to pursue higher education and the views of prescriptive custodians who considered
    their availing university education as a breach of moral boundaries. The girls''
    narratives bring up a range of actors playing the role of the custodians of moral
    boundaries, from parents, family members, and neighbours to members of the community.
    At the receiving end of moral prescriptions, the girls would find their attempts
    to pursue higher education reined, policed, ridiculed, reprimanded, and sometimes
    even apprehended on multiple'
