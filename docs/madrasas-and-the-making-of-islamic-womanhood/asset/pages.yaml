    educational regime in girls'' madrasas with the everyday experiences of students.
    I argue that the educational regime of madrasas reflects normative expectations,
    but these are not always synchronous with the daily lives of the students in the
    madrasa. This section focuses on the normative expectations.


    The closed architecture, constant surveillance, intense discipline and implementation
    of a standard ideal of behaviour in the girls'' madrasas I researched Foucault''s
    insights on how body practices and institutional routines are implicated in the
    disciplining process. The educational regime of the madrasa can be described as
    what Foucault terms as ''discursive practice'', a means through which society''s
    underlying ideals and values circulate and are material (Foucault 1995). I argue
    that a discourse inspired by a normative understanding of Islamic womanhood and
    ummah configures the educational template of Madrasa Jamiatul Mominat. For example,
    the madrasa''s architecture, layers of security, and surveillance manifest norms
    acceptable for women.


    Each of the following sections details the practices enforced by the madrasa and
    its underlying norms and values. The first section elaborates the principle of
    keeping girls'' mehfaz or safe exposed by the madrasa and how it defines the architecture,
    spatial arrangements, mobility, and interaction patterns inside and outside the
    madrasa. The second section discusses the madrasa''s emphasis on prioritizing
    male authority. The third section details the curriculum of the madrasa. The fourth
    section discusses the informal curriculum of the madrasa and its emphasis on the
    notions of purdah, adab, akhlaq, and hudud and huقوق (obligations or rights that
    others enjoy over a person).


