    to aspire’ brings to light the critical role played by the madrasa experience
    in nurturing the girls’ aspirations. Drawing on Appadurai’s understanding of aspirations
    as forged in ‘interaction and thick of social life’ (2013: 187) highlights the
    unanticipated opportunities offered by madrasa education. The imagined futures
    of the girls in the jamiaat Minimat draw open on what Appadurai terms as ‘local
    ideas and beliefs’ (2013: 187) prevalent in the madrasa about marriage, further
    education, and appropriate employment. Most of the girls’ aspirations discussed
