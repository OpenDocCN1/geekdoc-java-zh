    IN MADRASAS


    As ethnographic narratives, the portraits of Zainab, Rukaiya, and Fatima tell
    their stories, communicating a sense of the ‘here and now’, as it unfolded for
    the writer in in the field. I employ these portraits to illuminate a current moment
    at which girls’ madrasas stand, a crucial crosssection of continuity and change.
    By attending everyday negotiations in madrasas, the portraits illustrate a paradoxical
    picture of the subtle, imperceptible changes creeping in, in the name of strong
    reaffirmation of tradition. Each of the portraits presents diverse forms of negotiation
    through which change tends to take place. Very consciously the stories draw attention
    to the process, as it is unfolding and the various actors and relationships involved,
    rather than focusing on what the outcome is. This raises critical questions about
    how transitions in these girls’ lives are being influenced by larger forces that
    seem to be playing out in the backdrop, such as the changing age of marriage,
    increasing urbanization of primary education, secularization of social space,
    and training of women as bearers and communicators of sacred knowledge.


    The portraits highlight an educational landscape that is fast changing. The strong
    campaign against the right to education (which, since then, has become a fundamental
    right) and emphasis on universalization of primary education has led to an increasing
    demand for girls’ schooling cutting across barriers of religion, caste, class,
    and spatial location. The character and forms of this demand are far from uniform.
    This rise in demand is taking place in post-liberalization India where the vacuum
    created by poorly resourced, low-quality government schools is being filled by
    an assortment of private educational players ranging from low-fee charging private
    schools to institutions run by organizations with a strong religious agenda (Chopra
    and Jeffrey 2005; Corbridge, Harriss, and Jeffrey 2013). The educational choices
    of parents, especially those opting for girls’ madrasas, have to be viewed against
    this larger educational landscape where there is increasing acceptance and greater
    demand for girls’ schooling but there is a lack of affordable schooling options
    providing quality'
