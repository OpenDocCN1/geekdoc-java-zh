    Parry (1999) describes the culture of passing time in an Indian steel plant as
    an exercise of boredom. However, the above-mentioned accounts which look at the
    notion of killing time as ‘timepass’ do not delve into what acts of doing nothing
    achieve for the doer—for example, the possibility of leisure, the act of getting
    away, and so forth. Further, they tell us of the range of symbolic goods that
    a person engages with the process of doing nothing. By focusing on themes of boredom
    and passing time these accounts lend the impression of killing time as a non-purposive
    activity. In contrast, the girls’ activities in the madrasa, such as gazing out,
