    women in the mosque movement. She argues that Muslim women’s cultivation of a
    shy, modest, feminine, pious self is an expression of their agency. This embodied
    agency entailed in pious submission, according to Mahmood, challenges the liberal-secular
    assumptions inherent in the politically prescriptive Feminist project. She argues
    that the presumption of ‘universality of desire for freedom’ which underpins the
    feminist project confines its understanding of women’s agency to resistance or
    ‘acts that challenge social norms and not those they uphold’. Mahmood counters
    this narrow conception of ‘autofashioned agency’ to argue that ‘agentival capacity
    is entailed in not only those acts that resist norms but the multiple ways in
    which one inhabits norms (2005: 15). Mahmood’s work expands the understanding
    of agency beyond the binaries of subordination and resistance to include outward
    practices, rituals, and acts of worship performed by people as a means of transforming
    themselves and their relationship with God to a pious self. In this regard, she
    argues that outward acts (including rituals, liturgies, and worship) are not simply
    an expression of inward belief but rather belief is a product of outward practices
    (2012: xvi). She contends that embodied religious practices reflect agency since
    performative bodily behaviour is a means for realizing Islamic virtues that are
