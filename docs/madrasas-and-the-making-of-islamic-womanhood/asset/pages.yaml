    every inch of space. Police check-posts and yellow barricades mark each turn,
    stemming the chaotic flow of vehicles, people, and animals. The Muslim ethos of
    Jamia Nagar pervades every sight and smell. The whiffs emanating from the carcasses
    displayed in butcher shops, the biscuits piled in bakery shops, the frying of
    kebabs, samosas in snack shops, and enticingly heaped in sweet shops engulf the
    air. Roadside makeshift shops sell a variety of wares ranging from a wide array
    of clothing choices identified with Muslims as headscarves, veils, skullcaps,
    and so forth. Religious announcements echo from the nearby mosques in the form
    of sermons and the call to prayer (azaan).


    As a woman travelling to the madrasa, traversing these narrow lanes on a rickety
    cycle-rickshaw, the starkest difference between the journey to the madrasa in
    the mornings and the return journey in the evenings was perhaps the sudden disappearance
    of women from the scene in the evenings. The same lanes that would be full of
    groups of girls in school uniforms, women young, old and aged in headscarves,
    some veiled and some bare faced haggling with the vendors, laughing and at the
    eateries, moving around in public transport would become exclusive male domains
    as the evening set.


    Jamiatul Mominat overlooks the River Yamuna. Its white building stands tall on
    the main road for housing the headquarters of the Jamaat-e-Islami Hind.25 On the
    right-hand side, the madrasa shares its boundary walls with a Shia madrasa for
    boys. To its left is a narrow kutcha (dirt road) lane, which opens into the residential
    neighbourhood with small houses or flats that lies behind, eclipsed by the madrasa
    walls. Adjacent to the madrasa is a roadside furniture shop selling second-hand
    office furniture; workers and customers can be spotted next to the madrasa gate
    talking and loitering, along with cycle-rickshaws, auto-rickshaws, and fruit vendors
    each waiting for clients. Two guests see a visitor trying to locate Jamiatul Mominat
    madrasa—one is ‘Institute for Girls’ written in bold letters in English and Urdu
    at the top of the building, and the other is the Indian flag flying on the terrace,
    flanked on all sides by domes, giving the building a distinct Islamic appearance.


    > 25 Jamaat-e-Islami Hind is the Indian offshoot of the Jamaat-e-Islami. Its headquarters
    are located in Jamia Nagar.'
