    college enrolment for any religion-based group in the country, with only 11 per
    cent Muslim students enrolling in higher education (and 6.7 per cent in rural
    areas) as compared to the national average of 18.8 percent (Srivastava 2013).
    This disparity is perpetuated by dropout rates among Muslims, especially women,
    with the increase in the level of education. Through a comparison of the completion
    rates of primary, secondary, and higher secondary schooling, the recent Post Sachar
    Evaluation Committee Report has highlighted (Government of India 2014: 89–90)
    an increase in the rate of withdrawal from education amongst Muslims with the
