    neighbouring states such as Uttar Pradesh (especially towns around Delhi like
    Moradabad, Hapur, Bijnor), Haryana, Rajasthan (especially the Mewat area), Punjab,
    and Bihar. I also heard from the teachers and the management that few girls come
    as far as Assam in the North-East and Karnataka in the South.


    The madrasa caters predominantly to lower-class Muslim families wherein the father
    has a small business like being a cloth merchant, having a furniture shop, being
    a transporter, or being engaged in some service like property dealing in the cities.
    Another significant proportion of girls is drawn from lower working-class families
    wherein the father works as a driver, gardener, cloth dyer, carpenter, electrician,
    butcher, and so forth. Girls who are studying on a scholarship, which as per the
    management, comprises one-third of the girls, are drawn from poorer families or
    families where the girls have lost their father (thus making them yatim). A similar
    picture emerged from the girls'' responses to questions about their father''s
    occupation during the interviews. The single unifying factor in the responses
    of all the girls I interviewed was that the fathers were engaged in the informal
    sector of the economy in varying capacities—as an owner of a shop, property dealer,
    vendor or seller of different wares, driver, carpenter, and so on. None of the
    occupations listed by the girls formed part of the traditional caste-based occupations
    linked to an agricultural-rural past. The girls were drawn from families that
    are fairly representative of the socio-economic reality of Muslims in India, as
    Muslims are largely concentrated in the informal sector.^33


    > ^32 Muslims in Delhi are largely concentrated in religiously homogeneous enclaves
