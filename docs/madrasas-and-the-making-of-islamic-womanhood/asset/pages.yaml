    # MADRASA MODERNIZATION


    The State and the Indian Madrasas: Policy Discourse of Madrasa Modernization


    The madrasa system of education in India has for long time been a fiercely debated
    space within the traditional versus modern and religious secular dichotomies that
    dominate the education debate (Metcalf 2007; Sikand 2005; Zaman 1999). As discussed
    in Chapter 2, the roots of these debates can be traced to the colonial period.
    In the pre-colonial period, madradas were associated with the training of the
    intellectual and bureaucratic elite for administrative jobs along with producing
    religious scholars and leaders. However, the colonial rule was a critical turning
    point. It introduced notions like ‘religious neutrality’ and ‘useful instruction’
    (Zaman 1999) and ‘backward Muslim’ (Seth 2007), which led madrasas to be categorized
    as traditional centres of Islamic learning with little use in securing future
    employment outside the religious sphere. The colonial encounter fostered an increasingly
    negative perception of madrasa education. At the same time, it had the unanticipated
    consequence of promoting a new kind of madradas (Nair 2009), as the Deoband in
    1867 and Nadwat Ulama in the 1890s. These new madradas, which arose from the post-1857
    Muslim reform movements, termed themselves as religious institutions that sought
    to preserve traditional Islamic learning (dini talim) and catered to the educational
    needs of the masses. This orientation to adapt and change reform, which characterizes
    the genesis and history of madrasas like the Deoband, is often cited by scholars
    (Hartung 2006) to illustrate madrasas as inherently oriented.


    Post Indian independence and the country’s partition, Muslims emerged as the largest
    minority community in India and madrasas became Muslim minority institutions.
    Madrasas came under the view of the Constitutional guarantees to minority communities,'
