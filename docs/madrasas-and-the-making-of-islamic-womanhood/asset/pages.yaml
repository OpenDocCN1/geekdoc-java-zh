  md: '# Introduction


    My intention was to spend a year teaching in a girls'' madrasa. However gaining
    continuous access to a girls'' madrasa was the biggest obstacle I faced in my
    research. In recent years, especially in the aftermath of 9/11, madrasas in India
    have been subject to unprecedented attention and surveillance in light of their
    alleged links with anti-national activities and terrorism. Highly suspicious of
    any outsider, madrasas generally tend to brand people interested in studying madrasas
    as ''journalists out to tarnish their image'' or ''covert representatives of the
    government who want to inspect madrasa teaching, facilities, source of funding
    to blacklist or co-opt them''. Girls'' madrasas are a notch higher with being
    guarded and fenced, lending the appearance of ''garrisoned spaces'' (Hameed 2012).
    All the madrasas I explored for fieldwork welcomed me as an ''interested guest''
    but were highly uncomfortable and suspicious regarding a ''single Hindu researcher
    studying abroad'' wanting to do research which did not involve ''form (questionnaire)''
    filling or just ''two-three visits'' but access. My eventual success in securing
    access to Madrasa Jamiatul Mominat was in many ways the result of a combination
    of persistence, flexibility, and luck. I opted to conduct my fieldwork at Madrasa
    Jamiatul Mominat, Delhi, because the madrasa in Delhi allowed the best possible
    access, as the administration was open to the possibility of conducting participant
    observation for an entire academic year.


    During my attachment with Jamiatul Mominat, on an average I spent three four days
    a week in the madrasa. I was never assigned a timetabled class with the students
    as initially planned but I spent a large part of my time in the madrasa teaching
    English to the madrasa teachers and students. I volunteered for everything that
    involved the girls to speak/understand English, from debates, speeches, words
    they could not understand, basic grammar, and filling out the university applications
    for admission and registration for examinations. In many of the classes I conducted
    variants of group exercises and experimented with varying forms of self-portrait
    exercises with girls from the chaharum (year four) and panjum (year five). Further,
    a lot of my interaction with the girls happened while doing mundane activities
    like picking clothes that were hanging out to dry on the terrace, playing badminton
    in the narrow corridor of the madrasa,'
