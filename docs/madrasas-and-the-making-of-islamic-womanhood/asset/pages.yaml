    mahram,⁹⁹ and ''trying to act like men''. This ''other'' was not someone who was
    defined in terms of religion but someone who indulged in ''conduct inappropriate
    for women'', commonly seen in non-Muslims or ''Muslims who were Muslims only in
    name'' (nam ke muslimman).


    An oft-reated statement in the madrasa was, ''Allah created men and women different
    and there created different roles for them.'' The ''other'' girls did not understand
    these boundaries and hence tried to emulate by trying to wear clothes like men
    (jeans, pants, and so forth), by trying to speak like them (loudly and boisterously),
    by trying to work and earn like them, by moving around like them (unaccompanied
    on foot or in public transport). They jeopardized their own safety by these activities,
    ''attracted men'', and invited trouble. Thus, the madrasa girls were not to mingle
    with these ''other girls'' at any except if there was a chance to ''reform them.''
    The madrasa teachers often explained that these other women could be anyone, from
    a relative mother, sister, to a friend and neighbour, but notwithstanding who
    it was, the same principle applied.¹⁰


    Thus, the notion of meheuz in the vocabulary of the madrasa does not simply translate
    into elaborate safety and security arrangements but is a crucial construct in
    the imaginary vision of educating girls into becoming Muslim women. It is as critical
    as creating a Muslim ethos or mahaul appropriate for educating the students into
    kakamil monila.


