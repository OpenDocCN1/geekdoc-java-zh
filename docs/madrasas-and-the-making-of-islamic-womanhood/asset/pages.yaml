    how pursuing higher education in Jamia Millia Islamia had encouraged them to aspire
    for further education and a career outside conventional options. The girls kindly
    about how initially they asp only to study in a University like Jamia. But having
    reached Jamia and spent time in the university (especially, with peer interaction),
    they had realized that they could do a lot more than religious preaching and teaching
    in a madrasa or Urdu-medium school. Half the girls stated that they wanted to
    teach; the others (six) stated they wanted to work as translators (three), while
    one exceptional student said she wanted to become a civil servant and had even
    filled the form for the civil service exam. Here it might interesting to note
    that the ten girls who said they wanted to teach, all three girls who were in
    their final year of B.A. had already applied for admission to the M.A. course
    and that they planned to appear for the National Eligibility Test (NET), a qualifying
    exam to test the university level in India. However, each time I asked the girls
    whether they had secured the permission to work from their families, most of them
    said that for the time being their parents said ''yes'', but the ultimate decision
    lay with their future husbands.


    The narratives of the madrasa graduates studying university highlight the manner
    in which the girls articulate a range of ''appropriate'' forms of being educated
    Muslim girls and thereby reconfigure and re-draw the ideal of a kamil momina.
    Their madrasa background allows the girls admission to the university, yet the
    transition brings in its wake dilemmas. These dilemmas emerge from the tension
    between what the girls call the band mahaul of the madrasa—fenced, gender-segregated
    setting marked by a strict disciplinary regime—and the khula maaul of the university—a
    co-educational public space which allows for a greater degree of autonomy to the
    students. Each girl devises her own way to strike a balance between piety and
    the need to fit the university life, thereby contributing to a variety of ways
    of being educated Muslim women.


    The next chapter brings together the girls'' journeys across different settings—from
    the home to the madrasa and beyond. Further, it analyzes how each transition leads
    to a shift in the girls'' understanding and embodiment of the kamil momina.'
