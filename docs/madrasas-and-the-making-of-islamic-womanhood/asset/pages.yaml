    to restrict women''s access to public spaces. This results in women being confronted
    with the binary choice of risky public spaces and safe private spaces, though,
    as Phake (2005) points out, the definition of public and private space is often
    contingent on the woman''s socio-economic and religious location. Educational
    settings like schools and colleges represent a significant public space in this
    regard. It is in this context the difference between a madasa and Jamia Millia
    Islamia becomes significant. While the madasa represents a safe, circumscribed
    space, a community institution regarded by the parents of girls as an extension
    of the family and community norms, the university represents a high-risk public
    space. In comparison to schooling, higher education is viewed as posing higher
    risks with fewer remedies, such as the lack of safety and a greater possibility
    of moral corruption in a co-educational, multi-religious setting, overeducation
    increasing the risk of sexual encounters, pre-marital affairs, love marriages,
    and college education nurturing unacceptable desires such as love or aspirations
    of being a career woman, and so on.


    The girls'' narratives highlighted an irony: it was the same set of actors—family
    members, neighbours, community members—who encouraged and supported the girls
    to pursue university education. Some of the girls talked about how they were in
    the university thanks to the insistence of their parents who had defied elders
    and conventional norms and sent them. Some recalled the support of other family
    members, especially elder brothers, who often got around parents and coached their
    sisters, allowing them to overcome the boundaries set by social norms.


