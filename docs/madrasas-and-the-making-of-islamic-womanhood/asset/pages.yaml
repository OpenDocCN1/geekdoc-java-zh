    Recent anthropological work based out of India cautions against interpreting these
    remarks as performance of gender hierarchies and for greater attention to the
    subtleties of the ambiguous nature of cross-gender interaction. For example, Caroline
    and Filippo Osella (1998) draw attention to the manner in which ‘gender and hierarchy
    are played as a game’ (1998: 195) in the form of flirtation that they describe
    (by employing the colloquial term) ‘tuning’ (1998: 193) in a rural setting in
    Kerala. While the process begins with aggressive verbal harassment, the intention
    is to induce the girl, flirt with romance them—the harassing remark is often an
    ‘opening gambit’ (1998: 193). In this process, it is up to the woman who may regard
    it as harassment, or an initiation into further interaction, wherein she may retort
    with a counter-attack. Ritty Lukose (2009) also indicates a similar impulse where
    women resort to witty verbal counter-insults in the event of eve-teasing. However,
