  md: '# Madrasas and the Making of Islamic Womanhood


    Researching Madrasas


    The core of this book stems from my fieldwork in Madrasa Jamiatul Minat, Delhi.
    I spent close to a year in the madrasa, in three phases—the first phase was a
    month-long preliminary attachment (March to April 2012); the second phase, which
    constituted the bulk of my engagement with the madrasa, from August 2012 to March
    2013; the third phase was from August to September 2013. I also visited prominent
    girls'' madrasas outside Delhi, in Uttar Pradesh (Lucknow, Rampur, Moradabad),
    Madhya Pradesh (Bhopal), Bihar (Gaya), and Jharkhand (Dhanabad).


    Recognizing that ‘field’ is in many ways an ethnographer’s ‘construction’ (Emerson,
    Fetz, and Shaw 2001: 354), the fluid boundaries of my field were not confined
    to the physical boundaries of Madrasa Jamiatul Minat. Even though the madrasa
    constituted the primary site for interacting with the staff and the girls, interactions
    also took place outside its boundaries with parents, relatives, community members,
    former students of the madrasa, and gatekeepers of the madrasa. Further, ideologically,
    the madrasa as a social, educational, and religious institution cannot be isolated
    from the wider canvas of which it is part. In subscribing to the Tablighi Jamaat,
    the madrasa is deeply embedded in a dense network of believers who conform to
    a particular religious tradition. As a madrasa which is ‘not affiliated to any
    government madrasa board’ but has adopted some modern subjects and sought accreditation
    from central universities, it is a participant in the ongoing ‘madrasa modernization’
    process in India. As an institution engaged in training girls to be alima, it
    is catering to the socio-religious needs of the community. The ideological boundaries
    traversed by Madrasa Jamiatul Minat are difficult to define in precise terms,
    they were, in various ways, a part of my engagement with the ‘field’.


    > Inspired by Maulana Muhammad Ilyas Khandhlawi, the Tablighi Jamaat emerged as
    a ‘faith movement’ within the broader trend of Islamic revival in India. In the
    late 1920s it aimed at reinigoration of Islam through individual reform and renewal.
    It is one of the largest transnational movements of present times (Sikand 1999).
    It calls for self-purification by strict adherence to Islamic codes and practices.
    It attends to personal/private life rather than political transformation (Rodrigues
    2011).'
