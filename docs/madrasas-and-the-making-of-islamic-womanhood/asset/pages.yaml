    # Curriculum


    The madras follows a five-year study plan, which allows the students to earn the
    degree of an alima. For students who are not conversant with Urdu, an additional
    one-year basic level called Ibtidai is offered. The formal curriculum, taught
    what is referred to as ‘school time’, from 8 am to 2 pm, offers a combination
    of dini and dunyavi takim. Before embarking on the specifics of the curriculum,
    it is important to point out certain caveats. Firstly, my description of the curriculum
    is essentially a reconstruction based on the official syllabus specified in the
    admission brochure, observations, interviews, and discussions with the staff and
    students. Secondly, by my inability to read or write Urdu, my understanding of
    classroom discussions relied heavily on the teachers’ and students’ descriptions
    as opposed to reading the text. Further, throughout my engagement with the madras,
    my focus centred on the informal curriculum and everyday experiences of the students
    rather than the formal curriculum. In the following discussion of the formal curriculum,
    my aim is to provide an outline of the mixed curriculum offered by the madrasa
    and emphasize that dini talim classes constitute the didactic basis for the informal
    curriculum practised in the madrasa.


