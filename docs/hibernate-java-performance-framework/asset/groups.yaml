    # 11. HIBERNATE – O/R MAPPINGS


    So far, we have seen very basic O/R mapping using hibernate, but there are three
    most important mapping topics, which we have to learn in detail.


    These are:


    +   - Mapping of collections,

    - Mapping of associations between entity classes, and

    - Component Mappings.


    # Collections Mappings


    If an entity or class has values for any one of the collection interfaces available
    in java. Hibernate can persist instances of **java.util.Map, java.util.Set, java.util.SortedMap,
    java.util.SortedSet, java.util.List**, and any array of persistent entities or
    values.


    | Collection type | Mapping and Description |

    | java.util.Set | This is mapped with a <set> element and initialized with java.util.HashSet
    |

    | java.util.SortedSet | This is mapped with a <set> element and initialized with
    java.util.TreeSet. The sort attribute can be set to either a comparator or natural
    ordering. |

    | java.util.List | This is mapped with a <list> element and initialized with java.util.ArrayList
    |

    | java.util.Collection | This is mapped with a <bag> or <img> element and initialized
    with java.util.ArrayList |

    | java.util.Map | This is mapped with a <map> element and initialized with java.util.HashMap
    |

    | java.util.SortedMap | This is mapped with a <map> element and initialized with
    java.util.TreeMap. The sort attribute can be set to either a comparator or natural
    ordering. |


    Arrays are sorted by Hibernate with <primitive-array> for Java primitive value
    types and <array> for everything else. However, they are rarely used, so I am
    not going to discuss this in topic.


    If you want to map a user defined collection interfaces, which is not directly
    supported by Hibernate, you need to tell Hibernate the semantics of your custom
    collections, which is not very easy and recommend not to be used.'
