- md: "\n## Hibernate\n\n- * Hibernate to persist the Certificate objects at the same\
    \ time as the Employee objects. The **name** attribute is set to the defined SortedSet\
    \ variable in the parent class, in case it is certificates. The **sort** attribute\
    \ can be set to **natural** to have natural sorting or it can be set to a custom\
    \ class implementing `java.util.Comparator`. We have used a class `MyClass`, which\
    \ implements `java.util.Comparator` to reverse the sort order implemented in **Certificate**\
    \ class.\n\n- * The **key** is the element in the CERTIFICATE table that holds\
    \ the foreign key to the parent object i.e table EMPLOYEE.\n\n- * The **one-to-one**\
    \ element indicates that one Employee object relates to many Certificate objects\
    \ and, as such, the Certificate object must have an Employee parent associated\
    \ with it. You can use either **one-to-one**, **many-to-one** or **many-to-many**\
    \ elements based on your requirement.\n\nIf we use sort=\"natural\", then we do\
    \ not need to create a separate class because Certificate class has already implemented\
    \ Comparable interface and hibernate will use compareTo() method defined in Certificate\
    \ class to compare certificate names. But we are using a custom comparator class\
    \ **MyClass** in our mapping file so we would have to create this class based\
    \ on our sorting algorithm. Let us do descending sorting in this class using this\
    \ class.\n\n```java\nimport java.util.Comparator;\n\npublic class MyClass implements\
    \ Comparable<Certificate> {\n    public int compare(Certificate o1, Certificate\
    \ o2) {\n        final int BEFORE = -1;\n        final int AFTER = 1;\n\n    \
    \    /* To reverse the sorting order, multiply by -1 */\n        if (o2 == null)\
    \ {\n            return BEFORE * -1;\n        }\n\n        Comparable thisCertificate\
    \ = o1.getName();\n        Comparable thatCertificate = o2.getName();\n\n    \
    \    if(thisCertificate == null) {\n            return AFTER * 1;\n        } else\
    \ if(thatCertificate == null) {\n            return BEFORE * -1;\n        } else\
    \ {\n            return thisCertificate.compareTo(thatCertificate) * -1;\n   \
    \     }\n    }\n}\n```\n\n## Create Application Class\n\nFinally, we will create\
    \ our application class with the main() method to run the application. We will\
    \ use this application to save few Employees' records along with their certificates\
    \ and then we will use all CRUD operations on those records.\n\n```java\nimport\
    \ java.util.*;\n\nimport org.hibernate.HibernateException;\nimport org.hibernate.Session;\n\
    import org.hibernate.Transaction;\nimport org.hibernate.SessionFactory;\nimport\
    \ org.hibernate.cfg.Configuration;\n\npublic class ManageEmployee {\n    private\
    \ static SessionFactory factory;\n    public static void main(String[] args) {\n\
    \        try {\n            factory = new Configuration().configure().buildSessionFactory();\n\
    \        } catch (Throwable ex) {\n            System.err.println(\"Failed to\
    \ create sessionFactory object. \" + ex);\n            throw new ExceptionInitializerError(ex);\n\
    \        }\n        ManageEmployee ME = new ManageEmployee();\n        /* Let\
    \ us have a set of certificates for the first employee */\n        TreeSet set1\
    \ = new TreeSet();\n        set1.add(new Certificate(\"MCA\"));\n        set1.add(new\
    \ Certificate(\"MBA\"));\n        set1.add(new Certificate(\"PMP\"));\n\n    \
