    \ the class description.\n- The <id> element maps the unique ID attribute in class\
    \ to the primary key of the database table. The name attribute of the id element\
    \ refers to the property in the class and the column attribute refers to the column\
    \ in the database table. The type attribute holds the hibernate mapping type,\
    \ this mapping will convert from Java to SQL data.\n- The <generator> element\
    \ within the id element is used to generate the primary key values automatically.\
    \ The class attribute of the generator is set to native to hibernate pick up either\
    \ identity, sequence or hilo algorithm to create primary key depending upon the\
    \ capabilities of the underlying database.\n\n- The <property> element is used\
