    # 14. HIBERNATE – CRITERIA QUERIES


    Hibernate provides alternate ways of manipulating objects and in turn data available
    in RDBMS tables. One of the methods is Criteria API, which allows you to build
    up a criteria query programmatically where you can apply filter rules and logical
    conditions.


    The Hibernate Session interface provides create() method, which can be used to
    create a Criteria object that returns instances of the persistence''s class when
    your application executes a criteria query.


    Following is the simplest example of a criteria query is one, which will simply
    return every object that corresponds to the Employee class.


    ```

    Criteria cr = session.createCriteria(Employee.class);

    List results = cr.list();

    ```


    # Restrictions with Criteria


    You can use add() method available for Criteria to add restriction for a criteria
    query. Following is the example to add restriction to return the records with
    salary is equal to 2000:


    ```

    Criteria cr = session.createCriteria(Employee.class);

    cr.add(Restrictions.eq("salary", 2000));

    List results = cr.list();

    ```


    Following are the few examples covering different scenarios and can be used as
    per the requirement:


    ```

    Criteria cr = session.createCriteria(Employee.class);


    // To get records having salary more than 2000

    cr.add(Restrictions.gt("salary", 2000));


    // To get records having salary less than 2000

    cr.add(Restrictions.lt("salary", 2000));


    // To get records having firstName starting with zara

    cr.add(Restrictions.like("firstName", "zara%%"));


    // Case sensitive form of the above restriction.

    ```


