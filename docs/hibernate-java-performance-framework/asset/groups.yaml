    \ VARCHAR(20) default NULL,\n  salary INT default NULL,\n  PRIMARY KEY (id)\n\
    );\n```\n\nFurther, assume each employee can have one or more certificate associated\
    \ with him/her. We will store certificate information in a separate table having\
    \ the following structure:\n\n```sql\ncreate table CERTIFICATE (\n  id INT NOT\
    \ NULL AUTO_INCREMENT,\n  certificate_type VARCHAR(40) default NULL,\n  certificate_name\
    \ VARCHAR(30) default NULL,\n  employee_id INT default NULL,\n  PRIMARY KEY (id)\n\
    );\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_84_0.png)\n\n## Define POJO\
