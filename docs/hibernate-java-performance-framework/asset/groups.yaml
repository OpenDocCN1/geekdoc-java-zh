    \ |\n\n# 7. HIBERNATE – PERSISTENT CLASS\n\nThe entire concept of Hibernate is\
    \ to take the values from Java class attributes and persist them to a database\
    \ table. A mapping document helps in determining how to pull the values from the\
    \ classes and map them with table and associated fields.\n\nJava classes whose\
    \ objects or instances will be stored in database tables are called persistent\
    \ classes in Hibernate. Hibernate works best if these classes follow some simple\
    \ rules, also known as the Plain Old Java Object (POJO) programming model.\n\n\
    There are following rules of persistent classes, however, none of these rules\
    \ are hard requirements:\n\n- All classes that will be persisted need a default\
    \ constructor.\n- All classes should contain an ID in order to allow easy identification\
    \ of your objects within Hibernate and the database. This property maps to the\
    \ primary key column of a database table.\n- All attributes that will be persisted\
    \ be declared private and have getXXX setXXX methods defined in the JavaBean.\n\
    - A central feature of Hibernate, quite, depends upon the persistent class being\
    \ either non-final, or the implementation of an interface that declares all public\
    \ methods.\n- All classes that do not extend or implement some specialized classes\
    \ and interfaces required by the EJB framework.\n\nThe POJO name is used to emphasize\
    \ that a given object is an ordinary Java Object, not a special object, and in\
    \ particular not an Enterprise JavaBean.\n\n# Simple POJO Example\n\nBased on\
    \ the few rules mentioned above, we can define a POJO class as follows:\n\n```java\n\
    public class Employee {\n    private int id;\n    private String firstName;\n\
    \    private String lastName;\n    private int salary;\n    public Employee()\
    \ {}\n\n    public Employee(String fname, String lname, int salary) {\n      \
    \  this.firstName = fname;\n        this.lastName = lname;\n        this.salary\
    \ = salary;\n    }\n\n    public int getID() {\n        return id;\n    }\n  \
    \  public void setId( int id ) {\n        this.id = id;\n    }\n    public String\
    \ getFirstName( String first_name) {\n        return firstName;\n    }\n    public\
    \ void setFirstName( String first_name ) {\n        this.firstName = first_name;\n\
    \    }\n    public String getLastName() {\n        return lastName;\n    }\n \
    \   public void setLastName(String last_name ) {\n        this.lastName = last_name;\n\
    \    }\n    public int getSalary() {\n        return salary;\n    }\n    public\
    \ void setSalary( int salary ) {\n        this.salary = salary;\n    }\n}\n```\n\
    \n# 8. HIBERNATE – MAPPING FILES\n\nAn Object/relational mappings are usually\
    \ defined in an XML document. This mapping file structs Hibernate — how to map\
    \ the defined class or classes to the database tables?\n\nThough many Hibernate\
    \ users choose to write the XML by hand, but a number of tools exist to generate\
    \ the mapping document. These include XDoclet, Middlegen, and AndroMDA for the\
    \ advanced Hibernate users.\n\nLet us consider our previously defined POJO class\
    \ whose objects will persist in the table defined in next section.\n\n```java\n\
    public class Employee {\n    private int id;\n    private String firstName;\n\
    \    private String lastName;\n    private int salary;\n\n    public Employee()\
    \ {}\n    public Employee(String fname, String lname, int salary) {\n        this.firstName\
    \ = fname;\n        this.lastName = lname;\n        this.salary = salary;\n  \
    \  }\n\n    public int getId() {\n        return id;\n    }\n    public void setId(\
    \ int id ) {\n        this.id = id;\n    }\n    public String getFirstName() {\n\
    \        return firstName;\n    }\n    public void setFirstName( String first_name\
    \ ) {\n        this.firstName = first_name;\n    }\n    public String getLastName()\
    \ {\n        return lastName;\n    }\n    public void setLastName(String last_name\
    \ ) {\n        this.lastName = last_name;\n    }\n    public int getSalary() {\n\
    \        return salary;\n    }\n    public void setSalary( int salary ) {\n  \
    \      this.salary = salary;\n    }\n}\n```\n\nThere would be one table corresponding\
    \ to each object you are willing to provide persistence. Consider above objects\
    \ need to be stored and retrieved into the following RDBMS database:\n\n```sql\n\
    create table EMPLOYEE (\n    id INT NOT NULL auto_increment,\n    first_name VARCHAR(20)\
    \ default NULL,\n    last_name VARCHAR(20) default NULL,\n    salary INT default\
    \ NULL,\n    PRIMARY KEY (id)\n);\n```\n\nBased on the two entities, we can define\
    \ following mapping file, which instructs Hibernate to map the defined class or\
    \ classes to the database tables.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<!DOCTYPE Hibernate PUBLIC\n  \"//Hibernate/Hibernate Mapping DTD//EN\"\
    \n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\">\n\n<hibernate-mapping>\n\
    \  <class name=\"Employee\" table=\"EMPLOYEE\">\n    <meta attribute=\"class-description\"\
    >\n      This class contains the employee detail.\n    </meta>\n    <id name=\"\
    id\" type=\"int\" column=\"id\">\n      <generator class=\"native\"/>\n    </id>\n\
    \    <property name=\"firstName\" column=\"first_name\" type=\"string\"/>\n  \
    \  <property name=\"lastName\" column=\"last_name\" type=\"string\"/>\n    <property\
    \ name=\"salary\" column=\"salary\" type=\"int\"/>\n  </class>\n</hibernate-mapping>\n\
    ```\n\nYou should save the mapping document in a file with the format <classname>.hbm.xml.\
    \ We saved our mapping document in the file Employee.hbm.xml.\n\nLet us see understand\
    \ little detail about the mapping elements used in the mapping file:\n\n- The\
    \ mapping document is an XML document having <hibernate-mapping> as the root element,\
    \ which contains all the <class> elements.\n- The <class> elements are used to\
    \ define specific mappings from Java classes to the database tables. The Java\
    \ class name is specified using the name attribute of the class element and the\
    \ database table name is specified using the table attribute.\n- The <meta> element\
    \ is optional and can be used to create the class description.\n- The <id> element\
    \ maps the unique ID attribute in class to the primary key of the database table.\
    \ The name attribute of the id element refers to the property in the class and\
    \ the column attribute refers to the column in the database table. The type attribute\
    \ holds the hibernate mapping type, this mapping types will convert from Java\
    \ to SQL data type.\n- The <generator> element within the id element is used to\
    \ generate the primary key values automatically. The class attribute of the generator\
    \ element is set to native to let hibernate pick up identity, sequence, or algorithm\
    \ depending on the capabilities of the underlying database.\n- The <property>\
    \ element is used to map a Java class to a column in the database table. The type\
    \ attribute holds the mapping type.\n\n# 9. HIBERNATE – MAPPING TYPES\n\nWhen\
    \ you prepare a mapping document, you find that you map the Java data types into\
    \ RDBMS data types. The types declared and used in the mapping files are not Java\
    \ data types; they are not SQL types either. These are called Hibernate mapping\
    \ types, which can translate from Java to versa.\n\nThis chapter lists down all\
    \ the basic, date and time, large object, and built-in types.\n\n# Primitive Types\n\
    \n| Mapping type | Java type | ANSI SQL Type |\n| :--- | :--- | :--- |\n| integer\
    \ | int or java.Integer | INTEGER |\n| long | long or java.Long | BIGINT |\n|\
    \ short | short or java.Short | SMALLINT |\n| float | float or java.Float | FLOAT\
    \ |\n| double | double or java.Double | DOUBLE |\n| big_decimal | java.math.BigDecimal\
    \ | NUMERIC |\n| character | java.lang.String | CHAR(1) ('Y' or 'N') |\n| string\
    \ | java.lang.String | VARCHAR |\n| byte | byte or java.Byte | TINYINT |\n| boolean\
    \ | boolean or java.Boolean | BIT |\n| yes/no | boolean or java.Boolean | CHAR(1)\
    \ ('T' or 'F') |\n| true/false | boolean or java.Boolean | |\n\n# Date and Time\
    \ Types\n\n| Mapping type | Java type | ANSI SQL Type |\n| :--- | :--- | :---\
    \ |\n| date | java.util.Date or java.sql.Date | DATE |\n| time | java.util.Date\
    \ or java.sql.Time | TIME |\n| timestamp | java.util.Date or java.sql.Timestamp\
    \ | TIMESTAMP |\n| calendar | java.util.Calendar | TIMESTAMP |\n| calendar_date\
    \ | java.util.Calendar | DATE |\n\n# Binary and Large Object Types\n\n| Mapping\
    \ type | Java type | ANSI SQL Type |\n| :--- | :--- | :--- |\n| | | |\n"
