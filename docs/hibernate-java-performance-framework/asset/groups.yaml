    with most of the mapping detail, but let us see all the elements of mapping file
    once again:


    +   - The mapping document is an XML document having <hibernate-mapping> as the
    root element, which contains two <class> elements corresponding to each class.


    +   - The <class> elements are used to define specific mappings from a Java classes
    to the database tables. The Java class name is specified using the name attribute
    of the class element and the database table is specified using the table attribute.


    +   - The <meta> element is optional and can be used to create the class description.


    +   - The <id> element maps the unique ID attribute in class to the primary key
    of the database table. The name attribute of the id element refers to the property
    in the class and the column attribute refers to the column in the database table.
    The type attribute holds the hibernate mapping type, this mappings will convert
    from Java to SQL data type.


    +   - The <generator> element within the id element is used to generate the primary
    key values. The class attribute of the generator element is set to native to hibernate
    pick either identity, sequence or hilo algorithm to create primary key depending
    on the capabilities of the underlying database.


    +   - The <property> element is used to map a Java class to a column in the database
    table. The name attribute of the property element refers to the property in the
    class and the column attribute refers to the column in the database table. The
    type attribute holds the hibernate mapping type, this mappings will convert from
    Java to SQL data type.


    +   - The <map> element is used to set the relationship between Certificate and
    Employee classes. We used the cascade attribute in the <map> element to tell Hibernate
    to persist the Certificate objects at the same time as the Employee objects. The
    name attribute is set to the defined Map variable in the parent class, in our
    case it is certificates.


