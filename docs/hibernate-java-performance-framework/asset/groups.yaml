    mysql>\n```\n\n## 16. HIBERNATE – 缓存 (CACHING)\n\n缓存是一种增强系统性能的机制。它是存在应用程序和数据库之间的缓冲区内存。缓存内存存储最近使用的数据项，以尽可能减少对数据库的访问。\n\
    \n缓存对 Hibernate 来说同样重要。它利用了多级缓存方案，如下所示：\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_195_0.png)\n\
    \n## 一级缓存 (First-level Cache)\n\n一级缓存是 Session 缓存，是一个强制性的缓存，所有请求都必须通过它。Session\
    \ 对象在其内部维护一个对象，并将其提交到数据库。\n\n如果你对一个对象发出多次更新，Hibernate 会尝试尽可能推迟更新，以减少发出的更新 SQL\
    \ 语句的数量。如果你关闭了 session，所有被缓存的对象将丢失，并在数据库中被持久化或更新。\n\n## 二级缓存 (Second-level Cache)\n\
    \n二级缓存是可选的缓存，在尝试在二级缓存中查找对象之前，总是会查询一级缓存。Hibernate 级别的缓存可以基于每个类和每个集合进行配置，主要负责在跨\
    \ Session 中缓存对象。\n\n任何第三方缓存都可以与 Hibernate 一起使用。提供了一个 **org.hibernate.cache.CacheProvider**\
    \ 接口，必须实现该接口以为 Hibernate 提供缓存实现的的句柄。\n\n## 查询级缓存 (Query-level Cache)\n\nHibernate\
    \ 还实现了一种针对查询结果集的缓存，该缓存与二级缓存紧密集成。\n\n这是一个可选功能，需要两个额外的缓存区域，用于存储缓存的查询结果和表更新的时间戳。这对于使用相同参数频繁运行的查询非常有用。\n\
    \n## 二级缓存 (The Second Level Cache)\n\nHibernate 默认使用一级缓存，你不需要任何操作即可使用一级缓存。让我们直接进入可选的二级缓存。并不是所有类都能从缓存中受益，因此能够禁用二级缓存是非常重要的。\n\
    \nHibernate 的二级缓存分两步设置。首先，你必须决定使用哪种并发策略。之后，使用缓存提供程序配置表达式和物理缓存属性。\n\n## 并发策略 (Concurrency\
    \ Strategies)\n\n并发策略是一个中介，负责在缓存中存储数据项并从缓存中检索它们。如果你打算启用二级缓存，你必须为每个持久化缓存和集合决定使用哪种缓存并发策略。\n\
    \n- **Transactional (事务型)**：对于只读数据使用此策略，因为在极少数发生更新的情况下，防止并发事务中的过时数据是至关重要的。\n-\
    \ **Read-write (读写)**：同样将此策略用于只读数据，在极少数发生更新的情况下，防止并发事务中的过时数据至关重要。\n- **Nonstrict-read-write\
    \ (非严格读写)**：此策略不保证缓存和数据库之间的一性。如果数据几乎不更改，且少量过时数据的概率不是关键关注点，请使用此策略。\n- **Read-only\
    \ (只读)**：适用于永不更改数据的并发策略。仅将其用于引用数据。\n- 如果我们要为 **Employee** 类使用二级缓存，让我们添加映射元素，告诉\
    \ Hibernate 使用读写策略来缓存 Employee 实例。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n\"//Hibernate/Hibernate Mapping\
    \ DTD//EN\"\n\"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\n\n<hibernate-mapping>\n\
    \  <class name=\"Employee\" table=\"EMPLOYEE\">\n    <meta attribute=\"class-description\"\
    >\n      此类包含员工详情。\n    </meta>\n    <cache usage=\"read-write\"/>\n    <id name=\"\
    id\" type=\"int\" column=\"id\">\n      <generator class=\"native\"/>\n    </id>\n\
    \    <property name=\"firstName\" column=\"first_name\" type=\"string\"/>\n  \
    \  <property name=\"lastName\" column=\"last_name\" type=\"string\"/>\n    <property\
    \ name=\"salary\" column=\"salary\" type=\"int\"/>\n  </class>\n</hibernate-mapping>\n\
    ```\n\n`use=\"read-write\"` 属性告诉 Hibernate 为定义的缓存使用读写并发策略。\n\n## 缓存提供程序 (Cache\
    \ Provider)\n\n在考虑了并发策略后，下一步你将使用候选类来选择一个缓存提供程序。Hibernate 强制你为整个应用程序选择单一的缓存提供程序。\n\
    \n| 序号 | 名称 | 描述 |\n|---|---|---|\n| 1 | EHCache | 它可以在内存或磁盘上进行缓存，支持集群缓存，并支持 Hibernate\
    \ 查询缓存。 |\n| 2 | OSCache | 支持在单个 JVM 中进行内存和磁盘缓存，具有丰富的过期策略集和查询缓存支持。 |\n| 3 | warmCache\
    \ | 基于 JGroups 的集群缓存。它使用集群失效机制。 |\n| 4 | JBoss Cache | 基于 JGroups 的全事务缓存。它支持同步或异步通信。\
    \ |\n\n下面的矩阵将帮助你选择合适的组合：\n\n| 策略/提供程序 | 只读 | 非严格读写 | 读写 | 事务型 |\n|---|---|---|---|---|\n\
    | EHCache | X | X | X | |\n| OSCache | X | X | | |\n| SwarmCache | X | | | |\n\
    | JBoss Cache | | X | X | X |\n\n你将在 `hibernate.cfg.xml` 中指定缓存提供程序。\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_197.png)\n\
    \n## Hibernate\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE\
    \ hibernate-configuration PUBLIC\n\"-//Hibernate/Hibernate Configuration DTD//EN\"\
    \n\"http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd\">\n\n<hibernate-configuration>\n\
    \  <session-factory>\n    <property name=\"hibernate.driver_class\">com.mysql.jdbc.Driver</property>\n\
    \    <property name=\"hibernate.connection.url\">jdbc:mysql://localhost/test</property>\n\
    \    <property name=\"hibernate.connection.username\">root</property>\n    <property\
    \ name=\"hibernate.connection.password\">root123</property>\n    <property name=\"\
    hibernate.dialect\">org.hibernate.dialect.MySQLDialect</property>\n    <property\
    \ name=\"hibernate.cache.provider_class\">org.hibernate.cache.EhCacheProvider</property>\n\
    \n    <!-- XML 映射文件列表 -->\n    <mapping resource=\"Employee.hbm.xml\"/>\n  </session-factory>\n\
    </hibernate-configuration>\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_198.png)\n\
    \n现在，你需要指定缓存区域的属性。EHCache 有它自己的配置文件 `echache.xml`，它应该位于应用程序的 CLSPATH 中。\n\n```xml\n\
    <diskStore path=\"java.io.tmpdir\"/>\n<defaultCache\nmaxElementsInMemory=\"1000\"\
    \neternal=\"false\"\ntimeToIdleSeconds=\"120\"\ntimeToLiveSeconds=\"120\"\noverflowToDisk=\"\
    true\"\n/>\n\n<cache name=\"Employee\"\nmaxElementsInMemory=\"500\"\neternal=\"\
    true\"\ntimeToIdleSeconds=\"0\"\ntimeToLiveSeconds=\"0\"\noverflowToDisk=\"false\"\
    \n/>\n```\n\n这就是为什么我们为 Employee 类和 Hibernate 用了二级缓存，现在当你导航到 Employee 或通过标识符加载\
    \ Employee 时，Hibernate 都会命中二级缓存。\n\n你应该分析所有的类并为每个类选择合适的缓存策略。有时，二级缓存可能会降低应用程序的性能。因此，建议先在不启用缓存的情况下对应用程序进行基准测试，稍后启用合适的缓存并检查性能。如果缓存没有提高系统性能，那么启用任何类型的缓存都没有意义。\n\
    \n"
