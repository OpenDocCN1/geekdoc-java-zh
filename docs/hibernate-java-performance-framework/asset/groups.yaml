    So far, we have seen very basic O/R mapping using hibernate, but there are three\
    \ most important mapping topics, which we have to learn in detail.\n\nThese are:\n\
    \n- Mapping of collections,\n- Mapping of associations between entity classes,\
    \ and\n- Component Mappings.\n\n# Collections Mappings\n\nIf an entity or class\
    \ has values for any one of the collection interfaces available in java. Hibernate\
    \ can persist instances of **java.util.Map, java.util.Set, java.util.SortedMap,\
    \ java.util.SortedSet, java.util.List**, and any array of persistent entities\
    \ or values.\n\n| Collection type | Mapping and Description |\n| :--- | :--- |\n\
    | java.util.Set | This is mapped with a <set> element and initialized with java.util.HashSet\
    \ |\n| java.util.SortedSet | This is mapped with a <set> element and initialized\
    \ with java.util.TreeSet. The sort attribute can be set to either a comparator\
    \ or natural ordering. |\n| java.util.List | This is mapped with a <list> element\
    \ and initialized with java.util.ArrayList |\n| java.util.Collection | This is\
    \ mapped with a <bag> or set element and initialized with java.util.ArrayList\
    \ |\n| java.util.Map | This is mapped with a <map> element and initialized with\
    \ java.util.HashMap |\n| java.util.SortedMap | This is mapped with a <map> element\
    \ and initialized with java.util.TreeMap. The sort attribute can be set to either\
    \ a comparator or natural ordering. |\n\nArrays are sorted by Hibernate with <primitive-array>\
    \ for Java primitive value types and <array> for everything else. However, they\
    \ are rarely used, so I am not going to discuss this in topic.\n\nIf you want\
    \ to map a user defined collection interfaces, which is not directly supported\
    \ by Hibernate, you need to tell Hibernate the semantics of your custom collections,\
    \ which is not very easy and recommend not to be used.\n\n# Hibernate – Set Mappings\n\
    \nA Set is a Java collection that does not contain any duplicate element. More\
    \ formally, sets contain no pair of elements e1 and e2 such that e1.equals(e2),\
    \ and at most, one null element. objects to be added to a set implement both the\
    \ equals(s) and hashCode() methods that Java can determine whether any two elements/objects\
    \ are identical.\n\nA Set is mapped with a <set> element in the mapping table\
    \ and initialized with java.util.HashSet. You can use Set collection in your class\
    \ when there is no duplicate element required in the collection.\n\n# Define RDBMS\
    \ Tables\n\nConsider a situation where we need to store our employee records in\
    \ EMPLOYEE table, which would have the following structure:\n\n```sql\ncreate\
    \ table EMPLOYEE (\n    id INT NOT NULL auto_increment,\n    first_name VARCHAR(20)\
    \ default NULL,\n    last_name VARCHAR(20) default NULL,\n    salary INT default\
    \ NULL,\n    PRIMARY KEY (id)\n);\n```\n\nFurther, assume each employee can have\
    \ one or more certificate associated with him/her. So, we will store certificate\
    \ related information in a separate table having the following structure:\n\n\
    ```sql\ncreate table CERTIFICATE (\n    id INT NOT NULL auto_increment,\n    certificate_name\
    \ VARCHAR(30) default NULL,\n    employee_id INT default NULL,\n    PRIMARY KEY\
    \ (id)\n);\n```\n\nThere will be one-to-many relationship between EMPLOYEE and\
    \ CERTIFICATE objects:\n\n# Define POJO Classes\n\nLet us implement our POJO class\
    \ Employee, which will be used to persist the objects related to EMPLOYEE table\
