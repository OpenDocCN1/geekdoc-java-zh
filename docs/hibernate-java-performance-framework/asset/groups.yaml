    \ |\n| :--- | :--- | :--- |\n| 1 | MBA | 1 |\n| 2 | PMP | 1 |\n| 3 | MCA | 1 |\n\
    \n```\n\n3 rows in set (0.00 sec)\n\n```java\nmysql>\n```\n\n# Hibernate – List\
    \ Mappings\n\nA List is a java collection that stores elements in sequence and\
    \ allow duplicate elements. The user of this interface has precise control over\
    \ where in the list, each element is inserted. The user can access elements by\
    \ their integer index, and search for elements in the list. More formally, lists\
    \ typically allow pairs of elements e1 and e2 that e1.equals(e2), and they typically\
    \ allow multiple null elements if they allow null elements at all.\n\nA List is\
    \ mapped with a <list> element in the mapping table and initialized with Java.util.ArrayList.\n\
    \n# Define RDBMS Tables\n\nConsider a situation where we need to store our employee\
    \ records in EMPLOYEE, which will have the following structure:\n\n```sql\ncreate\
    \ table EMPLOYEE (\n  id INT NOT NULL auto_increment,\n  first_name VARCHAR(20)\
    \ default NULL,\n  last_name VARCHAR(20) default NULL,\n  salary INT default NULL,\n\
    \  PRIMARY KEY (id)\n);\n```\n\nFurther, assume each employee can have one or\
    \ more certificate associated with him/her. A List collection mapping needs an\
