    \ but let us see all the elements of mapping file once:\n\n+   * The mapping document\
    \ is an XML document having <hibernate-mapping> as the root element, which contains\
    \ two <class> elements corresponding to each class.\n* The <class> elements are\
    \ used to define specific mappings from a Java classes to the database tables.\
    \ The Java class is specified using the name attribute of the class element and\
    \ the database table is specified using the table attribute.\n* The <meta> element\
    \ is optional and can be used to create the class description.\n* The <id> elements\
    \ map the unique ID attribute in class to the primary key of the database table.\
    \ The name attribute of the id element refers to the property in the class and\
    \ the column in the database table. The type attribute holds the hibernate mapping\
    \ type, this mapping types will convert from Java to SQL data type.\n* The <generator>\
    \ element within the id element is used to generate the primary key values automatically.\
    \ The class attribute of the generator element is set to native to let pick up\
    \ any identity, sequence or hilo algorithm depending upon the capabilities of\
    \ the underlying database.\n* The <property> element is used to map a Java class\
    \ to a column in the database table. The name attribute of the element refers\
    \ to the property in the class and the column attribute refers to the column in\
    \ the database table. The type attribute holds the hibernate mapping type, this\
    \ mapping types will convert from Java to SQL data.\n* The <set> element sets\
    \ the relationship between Certificate and Employee classes. The cascade attribute\
