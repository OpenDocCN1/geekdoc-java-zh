    ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping\
    \ PUBLIC\n  \"//Hibernate/Hibernate Mapping DTD//EN\"\n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_97_0.png)\n\
    \n```xml\n<class name=\"Employee\" table=\"EMPLOYEE\">\n<meta attribute=\"class-description\"\
    >\n  This class contains the employee detail.\n</meta>\n<id name=\"id\" type=\"\
    int\" column=\"id\">\n  <generator class=\"native\"/>\n</id>\n<map name=\"certificates\"\
    \ cascade=\"all\" sort=\"MyClass\">\n  <key column=\"employee_id\"/>\n  <index\
    \ column=\"certificate_type\" type=\"string\"/>\n  <one-to-many class=\"Certificate\"\
    />\n</map>\n<property name=\"firstName\" column=\"first_name\" type=\"string\"\
    />\n<property name=\"lastName\" column=\"last_name\" type=\"string\"/>\n<property\
    \ name=\"salary\" column=\"salary\" type=\"int\"/>\n</class>\n\n<class name=\"\
    Certificate\" table=\"CERTIFICATE\">\n<meta attribute=\"class-description\">\n\
    \  This class contains the certificate records.\n</meta>\n<id name=\"id\" type=\"\
    int\" column=\"id\">\n  <generator class=\"native\"/>\n</id>\n<property name=\"\
    name\" column=\"certificate_name\" type=\"string\"/>\n</class>\n</hibernate-mapping>\n\
    ```\n\n你应该将映射文档保存为格式为 `<classname>.hbm.xml` 的文件。我们将映射文档保存在 `Employee.hbm` 文件中。你已经熟悉了大部分映射细节，但让我们再次看一遍映射文件中的所有元素：\n\
    \n- 映射文档是一个 XML 文档，以 `<hibernate-mapping>` 作为根元素，它包含两个对应于每个类的 `<class>` 元素。\n\
    - `<class>` 元素用于定义从 Java 类到数据库表的特定映射。Java 类名使用 `class` 元素的 `name` 属性指定，数据库表使用\
    \ `table` 属性指定。\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_98_0.png)\n\n`<meta>`\
    \ 元素是可选元素，可以用于创建类描述。\n\n`<id>` 元素映射唯一的 ID 属性。\n\n`<generator>` 元素用于自动生成主键。\n\n\
    `<property>` 元素用于映射类属性到数据库列。\n\n`<map>` 元素用于映射 Map。\n\n`<key>` 元素是 Map 的键。\n\n\
    `<index>` 元素是 Map 的索引。\n\n`<one-to-many>` 元素表示一个类对应多个对象。\n\n`cascade` 属性用于级联操作。\n\
    \n`sort` 属性可以对键进行排序。如果设置 `sort=\"natural\"`，我们不需要创建单独的类，因为 `Certificate` 类已经实现了\
    \ `Comparable`，Hibernate 将使用 `compareTo()` 方法比较 Sorted Maps。但我们在映射属性中使用自定义比较器类\
    \ **MyClass**，因此我们需要根据排序算法创建此类。\n\n"
