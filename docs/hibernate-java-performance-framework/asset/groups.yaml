    \ {\n        return firstName;\n    }\n\n    public void setFirstName( String\
    \ first_name ) {\n        this.firstName = first_name;\n    }\n\n    public String\
    \ getLastName() {\n        return lastName;\n    }\n}\n```\n\n```\npublic void\
    \ setLastName( String last_name ) {\n    this.lastName = last_name;\n}\npublic\
    \ int getSalary() {\n    return salary;\n}\npublic void setSalary( int salary\
    \ ) {\n    this.salary = salary;\n}\n```\n\nWe create the following EMPLOYEE table\
    \ to store Employee objects:\n\n```\ncreate table EMPLOYEE (\n    id INT NOT NULL\
