    \        return salary;\n    }\n    public void setSalary( int salary ) {\n  \
    \      this.salary = salary;\n    }\n}\n```\n\n## Create Database Tables\n\nSecond\
    \ step would be creating tables in your database. There would be one table corresponding\
    \ to each object, you are willing to provide persistence. Consider above objects\
    \ need to be stored and retrieved in the following RDBMS table:\n\n```sql\ncreate\
    \ table EMPLOYEE (\nid INT NOT NULL auto_increment,\nfirst_name VARCHAR(20) default\
    \ NULL,\nlast_name VARCHAR(20) default NULL,\nsalary INT default NULL,\nPRIMARY\
