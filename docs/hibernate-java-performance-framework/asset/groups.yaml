    \ `native`，以便根据底层数据库的能力拾取任何标识（identity）、序列（sequence）或 hilo 算法。\n-   `<property>`\
    \ 元素用于将 Java 类映射到数据库表中的一列。元素的元素的 `name` 属性引用类中的属性，`column` 属性引用数据库表中的列。`type`\
    \ 属性持有 hibernate 映射类型，这些映射类型将从 Java 转换为 SQL 数据。\n-   `<set>` 元素设置了 Certificate\
