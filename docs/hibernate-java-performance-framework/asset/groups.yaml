- md: "\n## 18. HIBERNATE – INTERCEPTORS\n\nAs you have learnt in Hibernate, an object\
    \ will be created and persisted. Once the object has been changed, it must be\
    \ saved back to the database. This process continues until the next time the object\
    \ is needed, and it will be loaded from the persistent store.\n\nThus an object\
    \ passes through different stages in its life cycle and Interceptor Interface\
    \ provides methods, which can be called at different stages to perform some required\
    \ tasks. These methods are callbacks from the session to the application, applying\
    \ the application to inspect and or manipulate properties of a persistent object\
    \ before it is saved, updated, deleted or removed. Following is the list of all\
    \ the methods available within the Interceptor interface:\n\n| S.N. | Method and\
    \ Description |\n|---|---|\n| 1 | findDirty() This method is called when the flush()\
    \ method is called on a Session object. |\n| 2 | instantiate() This method is\
    \ called when a persisted class is instantiated. |\n| 3 | isUnsaved() This method\
    \ is called when an object is passed to the saveOrUpdate() method/ |\n| 4 | onDelete()\
    \ This method is called before an object is deleted. |\n| 5 | onFlushDirty() This\
    \ method is called when Hibernate detects that an object is dirty (i.e. has been\
    \ changed) during a flush i.e. update operation. |\n| 6 | onLoad() This method\
    \ is called before or after an object is initialized. |\n| 7 | onSave() This method\
    \ is called before an object is saved. |\n| 8 | postFlush() This method is called\
    \ after a flush has occurred and an object has been updated in memory. |\n| 9\
    \ | preFlush() This method is called before a flush. |\n\nHibernate Interceptor\
    \ gives us total control over how an object will look to both the application\
    \ and the database.\n\n## How to Use Interceptors?\n\nTo build an interceptor,\
    \ you can either implement Interceptor directly or extend EmptyInterceptor class.\
    \ Following will be the simple steps to use Hibernate Interceptor functionality.\n\
    \n![](img/5e2dfb5638e25fc658eae48afffa90f6_208_0.png)\n\n## Create Interceptors\n\
    \nWe will extend EmptyInterceptor in our example where Interceptor's method will\
    \ be called automatically when Employee object is created and updated. You can\
    \ implement more methods as per your requirements.\n\n```\nimport java.io.Serializable;\n\
    import java.util.Date;\nimport java.util.Iterator;\n\nimport org.hibernate.EmptyInterceptor;\n\
    import org.hibernate.Transaction;\nimport org.hibernate.Type;\npublic class MyInterceptor\
    \ extends EmptyInterceptor {\n    private int updates;\n    private int creates;\n\
    \    private int loads;\n\n    public void onDelete(Object entity,\n        Serializable\
    \ id,\n        Object[] state,\n        String[] propertyNames,\n        Type[]\
    \ types) {\n        // do nothing\n    }\n\n// This method is called when Employee\
    \ object gets updated.\npublic boolean onFlushDirty(Object entity,\n    Serializable\
    \ id,\n    Object[] currentState,\n    Object[] previousState,\n    String[] propertyNames,\n\
    \    Type[] types) {\n    if ( entity instanceof Employee ) {\n        System.out.println(\"\
    Update Operation\");\n        return true;\n    }\n    return false;\n```\n\n\
    ![](img/5e2dfb5638e25fc658eae48afffa90f6_209_0.png)\n\n```\n}\npublic boolean\
    \ onLoad(Object entity,\n    Serializable id,\n    Object[] state,\n    String[]\
    \ propertyNames,\n    Type[] types) {\n    // do nothing\n    return true;\n}\n\
    ```\n\n```\n// This method is called when Employee object gets created.\npublic\
    \ boolean onSave(Object entity,\n    Serializable id,\n    Object[] state,\n \
    \   String[] propertyNames,\n    Type[] types) {\n    if ( entity instanceof Employee\
    \ ) {\n        System.out.println(\"Create Operation\");\n        return true;\n\
    \    }\n    return false;\n}\n```\n\n```\n// called before commit into database\n\
    public void preFlush(Iterator iterator) {\n    System.out.println(\"preFlush\"\
    );\n}\n```\n\n```\n// after committed into database\npublic void postFlush(Iterator\
    \ iterator) {\n    System.out.println(\"postFlush\");\n}\n```\n\n## Create POJO\
