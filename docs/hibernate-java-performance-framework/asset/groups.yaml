    \ |\n\n# 7. HIBERNATE – 持久化类 (Persistent Class)\n\nHibernate 的整个概念是从 Java 类属性中获取值并将其持久化到数据库表中。映射文件有助于确定如何从类中提取值并将其与表及关联字段进行映射。\n\
    \n在 Hibernate 中，对象或实例将存储在数据库表的 Java 类被称为持久化类。如果这些类遵循某些简单规则，Hibernate 的工作效果最好，这些规则也称为简单旧\
    \ Java 对象（POJO）编程模型。\n\n以下是持久化类的规则，但这些任何规则都不是硬性要求：\n\n-   所有需要被持久化的类都需要一个默认构造函数。\n\
