    \ Hibernate 用户使用的 XDoclet、Middlegen 和 AndroMDA。\n\n让我们考虑之前定义的 POJO 类，其对象将持久化在下一节定义的表中。\n\
    \n```java\npublic class Employee {\n    private int id;\n    private String firstName;\n\
