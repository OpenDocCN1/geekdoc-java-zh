  - "[PAGE 94]\n\n# Hibernate\n\n```\n| 18 | ComputerScience | MCA | | 60 |\n+---------------------+-----+---+----+\n\
    3 rows in set (0.00 sec)\nmysql>\n```\n\n# Hibernate – SortedMap Mappings\n\n\
    A SortedMap is a similar java collection as Map that stores elements in key-value\
    \ pairs and provides a total ordering on its keys. Duplicate elements are not\
    \ allowed in the map. The map is ordered according to the natural ordering of\
    \ its keys, or by a Comparator typically provided at sorted map creation time.\n\
    \nA SortedMap is mapped with a <map> element in the mapping table and an ordered\
    \ map can be initialized with java.util.TreeMap.\n\n# Define RDBMS Tables\n\n\
    Consider a situation where we need to store our employee records in EMPLOYEE table,\
    \ which will have the following structure:\n\n```\ncreate table EMPLOYEE (\n \
    \ id INT NOT NULL auto_increment,\n  first_name VARCHAR(20) default NULL,\n  last_name\
    \ VARCHAR(20) default NULL,\n  salary INT default NULL,\n  PRIMARY KEY (id)\n\
    );\n```\n\nFurther, assume each employee can have one or more certificate associated\
    \ with him/her. We will store certificate related information in a separate table\
    \ having the following structure:\n\n```\ncreate table CERTIFICATE (\n  id INT\
    \ NOT NULL auto_increment,\n  certificate_type VARCHAR(40) default NULL,\n  certificate_name\
    \ VARCHAR(30) default NULL,\n  employee_id INT default NULL,\n  PRIMARY KEY (id)\n\
    );\n```\n\nThere will be a one-to-many relationship between EMPLOYEE and CERTIFICATE\
    \ objects.\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_94_0.png)"
- md: "\n# Define POJO Classes\n\nLet us implement a POJO class Employee, which will\
    \ be used to persist the objects related to EMPLOYEE table and having a collection\
    \ of certificates in List variable.\n\n```java\nimport java.util.*;\n\npublic\
    \ class Employee {\n    private int id;\n    private String firstName;\n    private\
    \ String lastName;\n    private int salary;\n    private SortedMap certificates;\n\
    \n    public Employee() {}\n    public Employee(String fname, String lname, int\
    \ salary) {\n        this.firstName = fname;\n        this.lastName = lname;\n\
    \        this.salary = salary;\n    }\n\n    public int getId() {\n        return\
    \ id;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\
    \n    public String getFirstName() {\n        return firstName;\n    }\n\n   \
    \ public void setFirstName(String first_name) {\n        this.firstName = first_name;\n\
    \    }\n\n    public String getLastName() {\n        return lastName;\n    }\n\
    \n    public void setLastName(String last_name) {\n        this.lastName = last_name;\n\
    \    }\n\n    public int getSalary() {\n      return salary;\n    }\n\n    public\
    \ void setSalary(int salary) {\n      this.salary = salary;\n    }\n\n    public\
    \ SortedMap getCertificates() {\n      return certificates;\n    }\n\n    public\
    \ void setCertificates(SortedMap certificates) {\n      this.certificates = certificates;\n\
    \    }\n}\n```\n\nWe need to define another POJO class corresponding to CERTIFICATE\
    \ table so that certificate objects can be stored and retrieved into the CERTIFICATE\
    \ table. This class should also implement Comparable interface and compareTo method,\
    \ which will be used to sort the key elements of the SortedMap in case you sort=\"\
    natural\" in your mapping file (see below mapping file).\n\n```java\npublic class\
    \ Certificate implements Comparable<String>{\n  private int id;\n  private String\
    \ name;\n\n  public Certificate() {}\n  public Certificate(String name) {\n  \
    \  this.name = name;\n  }\n  public int getId() {\n    return id;\n  }\n  public\
    \ void setId(int id) {\n    this.id = id;\n  }\n  public String getName() {\n\
    \    return name;\n  }\n\n  public void setName( String name ) {\n    this.name\
    \ = name;\n  }\n  public int compareTo(String that){\n    final int BEFORE = -1;\n\
    \    final int AFTER = 1;\n\n    if (that == null) {\n      return BEFORE;\n \
    \   }\n\n    Comparable thisCertificate = this;\n    Comparable thatCertificate\
    \ = that;\n\n    if(thisCertificate == null) {\n      return AFTER;\n    } else\
    \ if(thatCertificate == null) {\n      return BEFORE;\n    } else {\n      return\
    \ thisCertificate.compareTo(thatCertificate);\n    }\n  }\n}\n```\n\n# Define\
    \ Hibernate Mapping File\n\nLet us develop our mapping file, which instructs Hibernate\
    \ how to map the defined classes to the database tables. <map> element will be\
    \ used to define the rule for the Map used.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n  \"//Hibernate/Hibernate Mapping\
    \ DTD//EN\"\n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\">\n\n\
    <hibernate-mapping>\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_97_0.png)\n\
    \n```xml\n<class name=\"Employee\" table=\"EMPLOYEE\">\n<meta attribute=\"class-description\"\
    >\n  This class contains the employee detail.\n</meta>\n<id name=\"id\" type=\"\
    int\" column=\"id\">\n  <generator class=\"native\"/>\n</id>\n<map name=\"certificates\"\
    \ cascade=\"all\" sort=\"MyClass\">\n  <key column=\"employee_id\"/>\n  <index\
    \ column=\"certificate_type\" type=\"string\"/>\n  <one-to-many class=\"Certificate\"\
    />\n</map>\n<property name=\"firstName\" column=\"first_name\" type=\"string\"\
    />\n<property name=\"lastName\" column=\"last_name\" type=\"string\"/>\n<property\
    \ name=\"salary\" column=\"salary\" type=\"int\"/>\n</class>\n\n<class name=\"\
    Certificate\" table=\"CERTIFICATE\">\n<meta attribute=\"class-description\">\n\
    \  This class contains the certificate records.\n</meta>\n<id name=\"id\" type=\"\
    int\" column=\"id\">\n  <generator class=\"native\"/>\n</id>\n<property name=\"\
    name\" column=\"certificate_name\" type=\"string\"/>\n</class>\n</hibernate-mapping>\n\
    ```\n\nYou should save the mapping document in the file with the format <classname>.hbm.xml.\
    \ We saved our mapping document in the file Employee.hbm. You are already familiar\
    \ with most of the mapping detail, but let us see all the elements of mapping\
    \ file once again:\n\n- The mapping document is an XML document having <hibernate-mapping>\
    \ as the root element, which contains two <class> elements corresponding to each\
    \ class.\n- The <class> elements are used to define specific mappings from Java\
    \ classes to the database tables. The Java class name is specified using the name\
    \ attribute of the class element and the database table is specified using the\
    \ table attribute.\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_98_0.png)\n\nThe\
    \ <meta> element is optional element and can be used to create the class description.\n\
    \nThe <id> element maps the unique ID attribute in class to the primary key of\
    \ the database table. The **name** attribute of the id element refers to the property\
    \ in the class and the **column** attribute refers to the column in the database\
    \ table. The **type** attribute holds the hibernate mapping type, this mappings\
    \ type will convert from Java to SQL data type.\n\nThe <generator> element within\
    \ the id is used to generate the primary keys automatically. The **class** attribute\
    \ of the generator element is set to **native** to let hibernate pick up **identity**,\
    \ **sequence** or **hilo** algorithm to create primary key depending upon capabilities\
    \ of the underlying database.\n\nThe <property> element is used to map a Java\
    \ class to a column in the database table. The **name** attribute of the element\
    \ refers to the property in the class and the **column** attribute refers to the\
    \ column in the database table. The **type** attribute holds the hibernate mapping\
    \ type, this mappings type will convert from Java to SQL data type.\n\nThe <map>\
    \ element is used to set the relationship between Certificate and Employee classes.\
    \ We used the **cascade** attribute to persist the objects. The **name** attribute\
    \ of the map element refers to the property in the class. The **sort** attribute\
    \ can be used to sort the keys. The <key> element is the column in the database\
    \ table. The <index> element represents the map key/value pair. The <one-to-many>\
    \ element indicates that one Employee relates to many Certificate objects. You\
    \ can use either **one-to-one**, **many-to-one** or **many-to-many** elements\
    \ based on your requirement. If sort=\"natural\" setting, we do not need to create\
    \ a separate class because Certificate class has already implemented Comparable\
    \ and hibernate will use compareTo() method to compare Sorted Maps. But we are\
    \ using a custom comparator class **MyClass** in our mapping property so we have\
    \ to create this class based on our sorting algorithm.\n\n```java\njava.util.Comparator;\n\
    public class MyClass implements Comparator<String>{\n    public int compare(String\
    \ o1, String o2) {\n        final int BEFORE = -1;\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_99_0.png)\n\
    \n```java\n        final int AFTER = 1;\n\n        /* To reverse the sorting order,\
    \ multiply by -1 */\n        if (o2 == null) {\n            return BEFORE * -1;\n\
    \        }\n\n        Comparable thisCertificate = o1;\n        Comparable thatCertificate\
    \ = o2;\n\n        if(thisCertificate == null) {\n            return AFTER * 1;\n\
    \        } else if(thatCertificate == null) {\n            return BEFORE * -1;\n\
    \        } else {\n            return thisCertificate.compareTo(thatCertificate)\
