    \npublic class MyClass implements Comparable<Certificate> {\n    public int compare(Certificate\
    \ o1, Certificate o2) {\n        final int BEFORE = -1;\n        final int AFTER\
    \ = 1;\n\n        /* 反转排序顺序，乘以 -1 */\n        if (o2 == null) {\n            return\
