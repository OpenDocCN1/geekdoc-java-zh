- md: "\nYou can use native SQL to express database queries if you want to utilize\
    \ database-specific features such as hints or the CONNECT keyword in Oracle. Hibernate\
    \ 3.x allows you to specify SQL, including stored procedures, for all create,\
    \ update, delete, and load operations.\n\nYour application will create a native\
    \ SQL query from the session with the createSQLQuery() method on the Session interface:\n\
    \n```\npublic SQLQuery createQuery(String sqlString) throws HibernateException\n\
    ```\n\nAfter you pass a string containing the SQL query to the createSQLQuery()\
    \ method, you can associate the result with either a Hibernate entity, a join,\
    \ or a scalar result using addEntity(), addJoin(), and addScalar() methods respectively.\n\
    \n## Scalar Queries\n\nThe most basic SQL query is to get a list of scalars (values)\
    \ from one or more tables. Following is the syntax for using native SQL for scalar\
    \ values:\n\n```\nString sql = \"SELECT first_name, salary FROM EMPLOYEE\";\n\
    SQLQuery query = session.createQuery(sql);\nquery.getResultTransformer(Criteria.ALIAS_TO_ENTITY_MAP);\n\
    List results = query.list();\n```\n\n## Entity Queries\n\nThe above queries were\
    \ all about returning scalar values, basically returning the \"raw\" values from\
    \ the result set. Following is the syntax to get entity objects as a whole from\
    \ a native SQL query via addEntity().\n\n```\nString sql = \"SELECT * FROM EMPLOYEE\"\
    ;\nSQLQuery query = session.createQuery(sql);\nquery.addEntity(Employee.class);\n\
    List results = query.list();\n```\n\n## Named SQL Queries\n\nFollowing is the\
    \ syntax to get entity objects from a native SQL query via addEntity() and using\
    \ named SQL query.\n\n```\nString sql = \"SELECT * FROM EMPLOYEE WHERE id = :employee_id\"\
    ;\n```\n\n```\nSQLQuery query = session.createSqlQuery(sql);\nquery.addEntity(Employee.class);\n\
    query.setParameter(\"employee_id\", 10);\nList results = query.list();\n```\n\n\
    ## Native SQL Example\n\nConsider the following POJO class:\n\n```\npublic class\
    \ Employee {\n    private int id;\n    private String firstName;\n    private\
