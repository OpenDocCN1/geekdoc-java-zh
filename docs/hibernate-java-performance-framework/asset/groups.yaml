  mdcn: '


    ## Java ORM 框架


    Java 中有多种持久化框架和 ORM 选项。持久化框架是一种将对象存储并从关系型数据库中检索对象的 ORM 服务。


    - Enterprise JavaBeans Entity Beans

    - Java Data Objects (JDBOs)

    - TopLink

    - Spring DAO

    - Hibernate 以及更多


    ## 2. HIBERNATE – 概述


    Hibernate 是一个用于 Java 的对象关系映射 (ORM) 解决方案。它是由 Gavin King 在 2001 年创建的开源持久化框架。对于任何
    Java 应用，它提供了一种强大、高性能的对象关系持久和查询服务。


    Hibernate 将 Java 类映射到数据库表，并将 Java 数据类型映射到 SQL 数据类型，使开发者能够减轻95% 常见的数据持久化相关编程任务。


    Hibernate 位于传统的 Java 对象和数据库服务器之间，根据相应的 O/R 机制和模式处理这些对象的持久化所有工作。


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_11_0.png)


    ## Hibernate 优势


    - Hibernate 使用 XML 文件处理 Java 类到数据库表的映射，而无需编写任何代码。

    - 提供简单的 API，直接在数据库与 Java 对象之间进行存储和检索。

    - 如果数据库或任何表发生变化，只需要更改 XML 文件的属性即可。

    - 抽象了不熟悉的 SQL 类型，并提供了一种使用熟悉的 Java 对象进行操作的方法。

    - Hibernate 不需要应用服务器即可运行。

    - 操作数据库中对象的复杂关联关系。

    - 通过智能获取策略最程度地减少数据库访问。

    - 提供数据的简单查询。


    ## 支持的数据库


    Hibernate 支持几乎所有主要的关系型数据库管理系统 (RDBMS)。以下是 Hibernate 支持的一些数据库引擎列表：


    - HSQL 数据库引擎

    - DB2/NT

    - MySQL

    - PostgreSQL

    - FrontBase

    - Oracle

    - Microsoft SQL Server Database

    - Sybase SQL Server

    - Informix Dynamic Server


    ## 支持的技术


    Hibernate 支持多种其他技术，包括：


    - XDoclet Spring

    - J2EE

    - Eclipse 插件

    - Maven


    ## 3. HIBERNATE 架构


    Hibernate 采用分层架构，帮助用户在无需了解底层 API 的情况下操作。Hibernate 利用数据库和配置数据为应用程序提供持久化服务（以及持久化对象）。

    以下是 Hibernate 应用架构的高层级视图。


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_13_0.png)


    以下是带有重要核心类的 Hibernate 应用架构详细视图。


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_14_0.png)


    Hibernate 使用多种现有的 Java API，如 JDBC、Java 事务 API (JTA) 和 Java 命名和目录接口 (JNI)。JDBC
    为关系型数据库的功能提供了基础级别的抽象，允许 Hibernate 支持任何带有 JDBC 驱动程序的数据库。JNI 和 JTA 允许 Hibernate
    集成到 J2EE 应用服务器中。


    下一节简要描述 Hibernate 应用架构中涉及的每个类对象。


    ## Configuration（配置）对象


    Configuration 对象是你在任何 Hibernate 应用中创建的第一个 Hibernate 对象。它通常在应用程序初始化期间只创建一次。它代表
    Hibernate 所需的配置或属性文件。


    Configuration 对象提供了两个关键组件：


    - **数据库连接：** 通过 Hibernate 支持的一个或多个配置文件处理。这些文件是 `hibernate.properties` 和 `hibernate.cfg.xml`。

    - **类映射设置：** 该组件创建了 Java 类与数据库表之间的连接。


    ## SessionFactory（会话工厂）对象


    Configuration 对象用于创建 SessionFactory 对象，反之，它使用提供的配置文件为应用程序配置 Hibernate，并允许实例化 Session
    对象。SessionFactory 是线程安全的对象，供应用程序的所有线程使用。


    SessionFactory 是一个重量级对象；它通常在应用程序启动时创建并保留以供以后使用。每个数据库都需要使用单独的配置文件来创建一个 SessionFactory
    对象。因此，如果你有多个数据库，就必须创建多个 SessionFactory 对象。


    ## Session（会话）对象


    Session 用于获取数据库的物理连接。Session 对象是轻量级的，设计用于每次需要与数据库进行交互时实例化。持久化对象通过 Session 对象进行保存和检索。


    session 对象不应长时间开启，因为它们不是线程安全的，并且应该根据需要创建和销毁。


    ## Transaction（事务）对象


    Transaction 代表与数据库交互的一个工作单元，大多数 RDBMS 都支持事务功能。Hibernate 中的事务由底层的事务管理器和事务（来自 JDBC
    或 JTA）处理。


    这是一个可选对象，Hibernate 应用可以选择不使用此接口，而是在自己的应用程序代码中管理事务。


    ## Query（查询）对象


    Query 对象使用 SQL 或 Hibernate 查询语言 (HQL) 字符串从数据库中检索数据并创建对象。Query 实例用于绑定查询参数、限制查询返回的结果数量并并执行查询。


    ## Criteria（准则）对象


    Criteria 对象用于创建和执行面向对象的标准查询以检索对象。


    ## 4. HIBERNATE – 环境搭建


