    \n## 12. HIBERNATE – 注解 (ANNOTATIONS)\n\n到目前为止，你已经看到 Hibernate 如何使用 XML 映射文件来实现从\
    \ POJO 到数据库表及反之的数据转换。Hibernate 注解是在不使用 XML 文件的情况下定义映射的最新方式。你可以将其作为 XML 映射元数据的补充或替代。\n\
    \nHibernate 注解（Hibernate Annotations）为对象与关系表映射提供元数据的强大方式。所有元数据都与代码一起组合在 POJO Java\
    \ 文件中，这有助于用户在开发过程中同时理解表结构和 POJO。\n\n如果你打算让你的应用程序具有可移植性以用于符合 EJB 3 的 ORM 应用程序，你必须使用注解来表示映射信息；但如果你想要更大的灵活性，那么你应该选择基于\
    \ XML 的映射。\n\n## Hibernate 注解的环境搭建\n\n首先，你必须确保正在使用 JDK 5.0，否则你需要将 JDK 升级到 5.0\
    \ 以利用对注解的原生支持。\n\n其次，你需要安装 Hibernate 3.x 注解发行包，该包可以从 sourceforge 获取：[Download\
    \ Hibernate Annotation](...)，并将 `hibernate-annotations.jar`、`lib/hibernate-commons-annotations.jar`\
    \ 和 `lib/ejb3-persistence.jar` 拷贝到你的 CLSPATH 中。\n\n## 注解类示例\n\n正如我在使用 Hibernate\
    \ 注解时提到的，所有元数据都与代码一起组合在 POJO Java 文件中，这有助于用户在开发过程中同时理解表结构和 POJO。\n\n假设我们准备使用以下\
    \ EMPLOYEE 表来存储我们的对象：\n\n```\ncreate table EMPLOYEE (\n    id INT NOT NULL auto_increment,\n\
    \    first_name VARCHAR(20) default NULL,\n    last_name VARCHAR(20) default NULL,\n\
    \    salary INT default NULL,\n    PRIMARY KEY (id)\n);\n```\n\n以下是 Employee 类使用注解的映射，用于将对象映射到定义的\
    \ EMPLOYEE 表：\n\n```java\nimport javax.persistence.*;\n```\n\n@Entity\n@Table(name\
    \ = \"EMPLOYEE\")\npublic class Employee {\n    @Id @GeneratedValue\n    @Column(name\
    \ = \"id\")\n    private int id;\n\n    @Column(name = \"first_name\")\n    private\
    \ String firstName;\n\n    @Column(name = \"last_name\")\n    private String lastName;\n\
    \n    @Column(name = \"salary\")\n    private int salary;\n\n    public Employee()\
    \ { }\n    public int getId() {\n        return id;\n    }\n    public void setId(int\
    \ id) {\n        this.id = id;\n    }\n    public String getFirstName() {\n  \
    \      return firstName;\n    }\n    public void setFirstName(String first_name\
    \ ) {\n        this.firstName = first_name;\n    }\n    public String getLastName()\
    \ {\n        return lastName;\n    }\n    public void setLastName(String last_name\
    \ ) {\n        this.lastName = last_name;\n    }\n}\n\npublic int getSalary()\
    \ {\n    return salary;\n}\npublic void setSalary( int salary ) {\n    this.salary\
    \ = salary;\n}\n```\n\nHibernate 检测到 @Entity 注解位于字段上，并假设在运行时，它应该直接通过字段访问对象的属性。如果你将\
    \ @Id 注解放置在 `getId()` 方法上，你默认将启用通过 getter 和 setter 方法访问属性。因此，根据所选的策略，所有注解也都放置在字段或\
    \ getter 方法上（二选一）。\n\n接下来的部分将解释上述类中使用的注解。\n\n## @Entity 注解\n\nJPA 标准注解包含在 `javax.persistence`\
    \ 包中，因此首先我们需要导入该包。其次，我们使用 @Entity 注解将类标记为实体 bean，它必须具有一个可见的构造函数。\n\n## @Table\
    \ 注解\n\n@Table 注解允许你指定用于持久化实体的表详情。@Table 注解提供了四个属性，允许你覆盖表名、目录、模式以及对列的唯一性约束。目前我们使用的是表名\
    \ EMPLOYEE。\n\n## @Id 和 @GeneratedValue 注解\n\n每个 bean 将有一个主键，你使用 @Id 注解标记类。主键可以是单个字段或多个字段的组合，取决于你的结构。\n\
    \n默认情况下，@Id 注解会自动确定合适的键生成策略，但你可以通过应用 @GeneratedValue 注解来覆盖此设置，该注解接受两个参数 strategy\
    \ 和 generator（此处我不讨论），让我们只使用默认生成策略。让 Hibernate 决定以使你的代码在不同数据库之间迁移。\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_164_0.png)\n\
    \n## @Column 注解\n\nColumn 注解用于指定映射字段或属性的列详情。你可以可以使用常用属性：\n\n- name 属性允许显式指定列名。\n\
    - length 属性允许列的大小，特别是对于 String 值。\n- nullable 属性允许在生成模式时将列标记为 NOT NULL。\n- unique\
    \ 属性允许列标记为包含唯一值。\n\n## 创建应用程序类\n\n最后，我们将创建一个带有 `main()` 方法的应用程序来运行程序。我们将使用此应用程序保存一些员工记录，然后对这些记录进行增删改查（CRUD）操作。\n\
    \n```java\nimport java.util.List;\nimport java.util.Date;\nimport java.util.Iterator;\n\
    \nimport org.hibernate.HibernateException;\nimport org.hibernate.Session;\nimport\
    \ org.hibernate.Transaction;\nimport org.hibernate.cfg.AnnotationConfiguration;\n\
    import org.hibernate.Session.SessionFactory;\nimport org.hibernate.cfg.Configuration;\n\
    \npublic class ManageEmployee {\n    private static SessionFactory factory;\n\
    \    public static void main(String[] args) {\n        try{\n            factory\
    \ = new AnnotationConfiguration();\n            addPackage(\"com.xyz\") //如果使用了包。\n\
    \            addAnnotatedClass(Employee.class);\n            buildSessionFactory();\n\
    ```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_165_0.png)\n"
