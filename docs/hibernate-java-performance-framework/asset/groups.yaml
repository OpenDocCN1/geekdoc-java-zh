    \ 210\n\n# 1. HIBERNATE – ORM 概述\n\n## 什么是 JDBC?\n\nJDBC 代表 **Java Database Connectivity**（Java\
    \ 数据库连接）。它提供了一套 Java API，用于 Java 程序访问关系型数据库。这些 Java API 允许 Java 程序执行 SQL 语句与任何符合\
    \ SQL 标准的数据库交互。\n\nJDBC 提供了一种灵活的架构，用于编写与数据库无关的应用程序，该程序可以在不同平台上运行，无需任何修改即可与不同的数据库管理系统（DBMS）交互。\n\
    \n## JDBC 的优缺点\n\n| JDBC 的优点 | JDBC 的缺点 |\n|---|---|\n| 清洁简单的 SQL 处理 | 在大型项目中使用会很复杂\
    \ |\n| 大数据处理性能良好 | 编程开销大 |\n| 非常适合小型应用程序 | 没有封装 |\n| 语法简单易于学习 | 难以实现 MVC 概念。查询特定于\
    \ DBMS。 |\n\n# 为什么用对象关系映射 (ORM)？\n\n当我们与面向对象的系统工作时，对象模型与关系型数据库之间存在不匹配。RDBMS 以表格形式表示数据，而面向对象的语言（如\
    \ Java 或 C#）则将其表示为互相关连接的对象图。\n\n考虑以下具有适当构造函数和关联公共方法的 Java 类：\n\n```java\npublic\
    \ class Employee {\n    private int id;\n    private String first_name;\n    private\
    \ String last_name;\n    private int salary;\n\n    public Employee() {}\n   \
    \ public Employee(String fname, String lname, int salary) {\n        this.first_name\
    \ = fname;\n        this.last_name = lname;\n        this.salary = salary;\n \
    \   }\n\n    public int getId() {\n      return id;\n    }\n    public String\
    \ getFirstName() {\n      return first_name;\n    }\n    public String getLastName()\
    \ {\n      return last_name;\n    }\n    public int getSalary() {\n      return\
    \ salary;\n    }\n}\n```\n\n假设上述对象要存储并检索在以下 RDBMS 表中：\n\n```sql\ncreate table\
    \ EMPLOYEE (\n  id INT NOT NULL auto_increment,\n  first_name VARCHAR(20 default\
    \ NULL,\n  last_name VARCHAR(20) default NULL,\n  salary INT default NULL,\n \
    \ PRIMARY KEY (id)\n);\n```\n\n首先，如果我们在开发了几个页面或应用程序后需要修改数据库设计该怎么办？其次，在关系型数据库中加载和存储对象会让我们面临以下五个不匹配问题：\n\
    \n| 不匹配 | 描述 |\n| --- | --- |\n| 粒度 | 有时你拥有一个对象模型，其类的数量多于数据库中对应表的数量。 |\n| 继承 |\
    \ RDBMS 没有定义任何类似于继承的内容，而继承是面向对象编程语言中的一种自然范式。 |\n| 身份 | RDBMS 恰好定义了一种“相同性”的概念：主键。然而，Java\
    \ 同时定义了对象标识性 (a==b) 和对象相等 (a.equals(b))。 |\n| 关联 | 面向对象的语言使用对象引用表示关联，而 RDBMS 使用外键列表示关联。\
    \ |\n\n# 在 Java 和 RDBMS 中访问对象的方式本质上是不同的。\n\n对象关系映射 (ORM) 是解决上述所有阻抗映射的解决方案。\n\n\
    ## 什么是 ORM?\n\n##ORM 代表对象关系映射 (Object-Relational Mapping)，是一种用于在关系型数据库和 Java、C#\
    \ 等面向对象的编程语言之间转换数据的编程技术。\n\n与原生 JDBC 相比，ORM 系统具有以下优势：\n\n| 序号 | 优势 |\n|---|---|\n\
    | 1 | 让业务代码访问表以外的对象。 |\n| 2 | 从对象逻辑中隐藏 SQL 查询细节。 |\n| 3 | 底层基于 JDBC。 |\n| 4 |\
    \ 无需处理数据库实现。 |\n| 5 | 基于业务概念而非数据库结构的实体。 |\n| 6 | 事务管理和自动键生成。 |\n| 7 | 快速开发应用程序。\
    \ |\n\nORM 解决方案由四个实体组成：\n\n| 序号 | 解决方案 |\n|---|---|\n| 1 | 用于对持久类对象执行基本 CRUD 操作的\
    \ API。 |\n| 2 | 用于指定引用类和类属性查询的语言或 API。 |\n| 3 | 用于指定映射元数据的可配置设施。 |\n| 4 | 一种与事务对象交互的技术，用于执行脏检查、懒关联加载和其他优化功能。\
    \ |\n\n\n"
