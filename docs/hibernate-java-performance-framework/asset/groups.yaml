    # Session Interface Methods


    There are number of methods provided by the Session interface, but I''m going
    to list down a few important methods only, which we will use in this tutorial.
    You can check Hibernate documentation for a complete list of methods associated
    with SessionFactory.


    | S.N. | Session Methods and Description |

    |---|---|

    | 1 | TransactionTransaction()

    Begin a unit of work and return the Transaction object. |

    | 2 | void cancel()

    Cancel the execution of the current query. |

    | 3 | void clear()

    Completely clear the session. |

    | 4 | Connection close()

    End the session by releasing the JDBC connection and cleaning up. |

    | 5 | Criteria criteria(Class persistentClass)

    Create a new instance, for the given class, or as subclass of an entity class.
    |

    | 6 | Criteria criteria(String entityName)

    Create a new instance, for the given name. |

    | 7 | Serializable getId(Object object)

    Return the identifier of the given entity as associated with this session. |

    | 8 | query createFilter(Object collection, String queryString)

    Create a new instance of query for the given collection and filter string. |

    | 9 | query createQuery(String queryString)

    Create a new instance of query for the given HQL query string. |

    | 10 | SQLQuery createSQLQuery(String queryString)

    Create a new instance of SQLQuery for the given SQL query string. |

    | 11 | void delete(Object object)

    Remove a persistent instance from the datastore. |

    | 12 | void delete(String entityName, Object object)

    Remove a persistent instance from the datastore. |

    | 13 | Session get(String entityName, Serializable id)

    Return the persistent instance of the given entity with the given identifier,
    or if there is no such persistent instance. |

    | 14 | SessionFactoryFactory()

    Get the session factory, which created this session. |

    | 15 | void refresh(Object object)

    Re-read the state of the given instance from the underlying database. |

    | 16 | Transaction getTransaction()

    Get the Transaction instance associated with this session. |

    | 17 | boolean isConnected()

    Check if the session is currently connected. |


