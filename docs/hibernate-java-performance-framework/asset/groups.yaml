- md: "\n## GROUP by Clause\n\nThis class lets Hibernate pull information from the\
    \ database and group it based on a value of an attribute and, typically, use the\
    \ result to include an aggregate value. Following is the simple syntax of using\
    \ GROUP BY clause:\n\n```java\nString hql = \"SELECT SUM(E.salary), E.firstName\
    \ FROM Employee E \" +\n\"GROUP BY E.firstName\";\n\nQuery query = session.createQuery(hql);\n\
    \nList results = query.list();\n```\n\n## Using Named Parameters\n\nHibernate\
    \ supports named parameters in its HQL queries. This makes writing HQL queries\
    \ that accept input from the user and you do not have to defend against SQL injection\
    \ attacks. Following is the simple syntax of using named parameters:\n\n```java\n\
    String hql = \"FROM Employee E WHERE E.id = :employee_id\";\nQuery query = session.createQuery(hql);\n\
    query.setParameter(\"employee_id\",10);\nList results = query.list();\n```\n\n\
    ## UPDATE Clause\n\nBulk updates are new to HQL with Hibernate 3, and delete work\
    \ differently in Hibernate 3 than they did in Hibernate 2. The Query interface\
    \ now contains a method called executeUpdate() for executing HQL UPDATE or DELETE\
    \ statements.\n\nThe UPDATE clause can be used to update one or more properties\
    \ of an one or more objects. Following is the simple syntax of using UPDATE clause:\n\
    \n```java\nString hql = \"UPDATE Employee set salary = :salary \" +\n\"WHERE id\
    \ = :employee_id\";\nQuery query = session.createQuery(hql);\nquery.setParameter(\"\
    salary\", 1000);\nquery.setParameter(\"employee_id\", 10);\nint result = query.executeUpdate();\n\
    System.out.println(\"Rows affected: \" + result);\n```\n\n## DELETE Clause\n\n\
    The DELETE clause can be used to delete one or more objects. Following is the\
    \ simple syntax of using DELETE clause:\n\n```java\nString hql = \"DELETE FROM\
    \ Employee \" + \n  \"WHERE id = :employee_id\";\nQuery query = session.createQuery(hql);\n\
    query.setParameter(\"employee_id\", 10);\nint result = query.executeUpdate();\n\
    System.out.println(\"Rows affected: \" + result);\n```\n\n## INSERT Clause\n\n\
    HQL supports INSERT INTO clause where only records can be inserted from one object\
    \ to another object. Following is the simple syntax of using INSERT INTO clause:\n\
    \n```java\nString hql = \"INSERT INTO Employee(firstName, lastName, salary)\"\
    \ + \n  \"SELECT firstName, lastName, salary FROM old_employee\";\nQuery query\
    \ = session.createQuery(hql);\nint result = query.executeUpdate();\nSystem.out.println(\"\
    Rows affected: \" + result);\n```\n\n## Aggregate Methods\n\nHQL supports a range\
    \ of aggregate methods, similar to SQL. They work the same way in HQL as in SQL\
    \ and following is the list of the aggregate functions:\n\n| S.N. | Functions\
    \ | Description |\n|---|---|---|\n| 1 | avg(property name) | The average of a\
    \ property value |\n| 2 | count(property name or *) | The number of times a property\
    \ occurs in the results |\n| 3 | max(property name) | The maximum value of the\
    \ property values |\n| 4 | min(property name) | The minimum value of the property\
    \ values |\n| 5 | sum(property name) | The sum total of the property values |\n\
    \nThe distinct keyword only counts the unique values in the row set. The following\
    \ query will return only count:\n\n```java\nString hql = \"SELECT count(distinct\
    \ E.firstName) FROM Employee E\";\nQuery query = session.createQuery(hql);\nList\
    \ results = query.list();\n```\n\n## Pagination using Query\n\nThere are two methods\
    \ of the Query interface for pagination.\n\n| S.N. | Method & Description |\n\
    |---|---|\n| 1 | **Query setFirstResult(int startPosition)**<br>This method takes\
    \ an integer that represents the first row in your result set, starting with row\
    \ 0. |\n| 2 | **Query setMaxResults(int maxResults)**<br>This method tells Hibernate\
    \ to retrieve a fixed number maxResults of objects. |\n\nUsing above two methods\
    \ together, we can construct a paging component in our web or Swing application.\
    \ Following is the example, which you can extend to fetch 10 rows at a time:\n\
    \n```java\nString hql = \"FROM Employee\";\nQuery query = session.createQuery(hql);\n\
    query.setFirstResult(1);\nquery.setMaxResults(10);\nList results = query.list();\n\
    ```\n\n## 14. HIBERNATE – CRITERIA QUERIES\n\nHibernate provides alternate ways\
    \ of manipulating objects and in turn data available in RDBMS tables. One of the\
    \ methods is Criteria API, which allows you to build up a criteria query programmatically\
    \ where you can apply filter rules and logical conditions.\n\nThe Hibernate Session\
    \ interface provides create() method, which can be used to create a Criteria object\
    \ that returns instances of the persistence's class when your application executes\
    \ a criteria query.\n\nFollowing is the simplest example of a criteria query is\
    \ one, which will simply return every object that corresponds to the Employee\
    \ class.\n\n```java\nCriteria cr = session.createCriteria(Employee.class);\nList\
    \ results = cr.list();\n```\n\n## Restrictions with Criteria\n\nYou can use add()\
    \ method available for Criteria to add restriction for a criteria query. Following\
    \ is the example to add restriction to return the records with salary is equal\
    \ to 2000:\n\n```java\nCriteria cr = session.createCriteria(Employee.class);\n\
