    \        session.clear();\n    }\n}\ntx.commit();\nsession.close();\n```\n\n##\
    \ Batch Processing Example\n\nLet us modify the configuration file to add hibernate.jdbc.batch_size\
    \ property:\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-configuration\
    \ SYSTEM \"http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd\">\n\n\
    <hibernate-configuration>\n<session-factory>\n<property name=\"hibernate.dialect\"\
    >\norg.hibernate.dialect.MySQLDialect\n</property>\n<property name=\"hibernate.connection.driver_class\"\
    >\ncom.mysql.jdbc.Driver\n</property>\n</session-factory>\n</hibernate-configuration>\n\
    \n<!-- Assume students is the database name -->\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_202_0.png)\n\
    \n196\n\n```\n<property name=\"hibernate.connection.url\">\njdbc:mysql://localhost/test\n\
    </property>\n<property name=\"hibernate.connection.username\">\nroot\n</property>\n\
    <property name=\"hibernate.connection.password\">\nroot123\n</property>\n<property\
    \ name=\"hibernate.jdbc.batch_size\">\n50\n</property>\n```\n\n```\n<!-- List\
    \ of XML mapping files --\n<mapping resource=\"Employee.hbm.xml\"/>\n\n</session-factory>\n\
    </hibernate-configuration>\n```\n\nConsider the following POJO Employee class:\n\
    \n```\npublic class Employee {\n    private int id;\n    private String firstName;\n\
    \    private String lastName;\n    private int salary;\n\n    public Employee()\
    \ {}\n    public Employee(String firstName, String lastName, int salary) {\n \
    \       this.firstName = firstName;\n        this.lastName = lastName;\n     \
    \   this.salary = salary;\n    }\n\n    public int getId() {\n        return id;\n\
    \    }\n\n    public void setId(int id) {\nthis.id = id;\n\npublic String getFirstName()\
    \ {\n    return firstName;\n}\n\npublic void setFirstName( String first_name )\
    \ {\n    this.firstName = first_name;\n}\n\npublic String getLastName() {\n  \
    \  return lastName;\n}\n\npublic void setLastName( String last_name ) {\n    this.lastName\
    \ = last_name;\n}\n\npublic int getSalary() {\n    return salary;\n}\n\npublic\
    \ void setSalary( int salary ) {\n    this.salary = salary;\n}\n}\n```\n\nLet\
    \ us create the following EMPLOYEE table to store the Employee objects:\n\n```sql\n\
    create table EMPLOYEE (\n    id INT NOT NULL auto_increment,\n    first_name VARCHAR(20)\
    \ default NULL,\n    last_name VARCHAR(20) default NULL,\n    salary INT default\
    \ NULL,\n    PRIMARY KEY (id)\n);\n```\n\nFollowing will be the mapping file to\
    \ map the Employee objects with EMPLOYEE table:\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n\"//Hibernate/Hibernate\
    \ Mapping DTD//EN\"\n\"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n```\n\n## Hibernate\n\n<hibernate-mapping>\n<class name=\"Employee\" table=\"\
    EMPLOYEE\">\n  <meta>This class contains the employee detail.</meta>\n  <id name=\"\
    id\" type=\"int\">\n    <generator class=\"native\"/>\n  </id>\n  <property name=\"\
    firstName\" column=\"first_name\" type=\"string\"/>\n  <property name=\"lastName\"\
    \ column=\"last_name\" type=\"string\"/>\n  <property name=\"salary\" column=\"\
    salary\" type=\"int\"/>\n</class>\n</hibernate-mapping>\n```\n\nFinally, we will\
    \ create our application class with main() method to run the application where\
    \ we use flush() and clear() methods available with Session object so that Hibernate\
    \ keeps these records into the database instead of caching them in the memory.\n\
    \n```java\nimport java.util.*;\n\nimport org.hibernate.HibernateException;\nimport\
    \ org.hibernate.Session;\nimport org.hibernate.Transaction;\nimport org.hibernate.SessionFactory;\n\
    import org.hibernate.cfg.Configuration;\n\npublic class ManageEmployee {\n  private\
    \ static SessionFactory factory;\n  public static void main(String[] args) {\n\
    \    try {\n      factory = new Configuration().configure().buildSessionFactory();\n\
    \    } catch (Throwable ex) {\n      System.err.println(\"Failed to create sessionFactory.\"\
    \ + ex);\n      throw new RuntimeException(ex);\n    }\n    ManageEmployee ME\
    \ = new ManageEmployee();\n    ME.addEmployees();\n  }\n  /* Method to create\
    \ employee records in batches */\n  public void addEmployees() {\n    Session\
    \ session = factory.openSession();\n    Transaction tx = null;\n    try {\n  \
    \    tx = session.beginTransaction();\n      for (int i=0; i<100000; i++ ) {\n\
    \        String fname = \"First Name \" + i;\n        String lname = \"Last Name\
    \ \" + i;\n        Integer salary = i;\n        Employee employee = new Employee(fname,\
    \ lname, salary);\n        session.save(employee);\n        if (i % 50 == 0 )\
    \ {\n          session.flush();\n          session.clear();\n        }\n     \
    \ }\n      tx.commit();\n    } catch (HibernateException e) {\n      if (tx!=null)\
    \ tx.rollback();\n      e.printStackTrace();\n    } finally {\n      session.close();\n\
    \    }\n  }\n}\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_205_0.png)\n\n\
    199\n\n## Compilation and Execution\n\nHere are the steps to compile and run the\
    \ above mentioned application. Make sure, you have set PATH and CLASSPATH appropriately\
    \ before proceeding for the compilation and execution.\n\n- Create hibernate.cfg.xml\
    \ configuration file as explained above.\n- Create Employee.hbm.xml mapping file\
    \ as shown above.\n- Create Employee.java source file as shown above and compile\
    \ it.\n- Create ManageEmployee.java source file as shown above and compile it.\n\
    - Execute ManageEmployee binary to run the program, which will create 100000 records\
    \ in EMPLOYEE table.\n"
  mdcn: "\n将属性设置为 `true`，你将使 Hibernate 在内存中创建必要的缓存来存储查询和标识符集。\n\n接下来，要使用查询缓存，你可以使用\
    \ `Query` 类的 `setCacheable(Boolean)` 方法。例如：\n\n```\nSession session = SessionFactory.openSession();\n\
    Query query = session.createQuery(\"FROM EMPLOYEE\");\nquery.setCacheable(true);\n\
    List users = query.list();\nSessionFactory.closeSession();\n```\n\nHibernate 还通过“缓存区域”（cache\
    \ region）的概念提供了非常细粒度的缓存支持。缓存区域是缓存中被赋予名称的一个部分。\n\n```\nSession session = SessionFactory.openSession();\n\
    Query query = session.createQuery(\"FROM EMPLOYEE\");\nquery.setCacheable(true);\n\
    query.setCacheRegion(\"employee\");\nList users = query.list();\nSessionFactory.closeSession();\n\
    ```\n\n此代码使用该方法告诉 Hibernate 在缓存的 `employee` 区域存储并查找查询。\n\n## 17. HIBERNATE – 批量处理\n\
    \n考虑一种需要使用 Hibernate 向数据库中上传大量记录的情况。以下是使用 Hibernate 实现此目标的代码片段：\n\n```\nSession\
    \ session = SessionFactory.openSession();\nTransaction tx = session.beginTransaction();\n\
    for ( int i=0; i<100000; i++) {\n    Employee employee = new Employee(....);\n\
    \    session.save(employee);\n}\ntx.commit();\nsession.close();\n```\n\n默认情况下，Hibernate\
    \ 会将所有持久化对象缓存在会话级缓存中，最终你的应用程序会在 50,000 次左右因 `OutMemoryException` 而崩溃。如果你在 Hibernate\
    \ 中使用批量处理，可以解决这个问题。\n\n要使用批量功能，请将 `hibernate.jdbc.batch_size` 设置为批处理大小，根据对象的大小设置为\
    \ 20 或 50。这将告诉 Hibernate 容器每 `X` 行将作为一个批次进行插入。为了在代码中实现此点，你需要进行如下少量修改：\n\n```\n\
    Session session = SessionFactory.openSession();\nTransaction tx = session.beginTransaction();\n\
    for ( int i=0; i<100000; i++) {\n    Employee employee = new Employee(....);\n\
    \    session.save(employee);\n    if( i % 50 == 0 ) // 与 JDBC 批处理大小相同\n      \
    \  //刷新一批插入并释放内存：\n        session.flush();\n        session.clear();\n}\ntx.commit();\n\
    session.close();\n```\n\n上述代码对于 `INSERT` 操作将正常工作，但如果你想执行 `UPDATE` 操作，可以使用以下代码实现：\n\
    \n![](img/5e2dfb5638e25fc658eae48afffa90f6_201_0.png)\n\n## Hibernate\n\nSession\
    \ session = sessionFactory.openSession();\nTransaction tx = session.beginTransaction();\n\
    \nScrollableResults employeeCursor = session.createQuery(\"FROM EMPLOYEE\")\n\
    .scroll();\n\n```\nint count = 0;\nwhile (employeeCursor.next()) {\n    Employee\
    \ employee = (Employee) employeeCursor.get();\n    employee.updateEmployee();\n\
    \    session.update(employee);\n    if (++count % 50 == 0) {\n        session.flush();\n\
    \        session.clear();\n    }\n}\ntx.commit();\nsession.close();\n```\n\n##\
    \ 批量处理示例\n\n让我们修改配置文件以添加 `hibernate.jdbc.batch_size` 属性：\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-configuration SYSTEM \"http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd\"\
    >\n\n<hibernate-configuration>\n<session-factory>\n<property name=\"hibernate.dialect\"\
    >\norg.hibernate.dialect.MySQLDialect\n</property>\n<property name=\"hibernate.connection.driver_class\"\
    >\ncom.mysql.jdbc.Driver\n</property>\n</session-factory>\n</hibernate-configuration>\n\
    \n<!-- 假设 students 是数据库名 -->\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_202_0.png)\n\
    \n196\n\n```\n<property name=\"hibernate.connection.url\">\njdbc:mysql://localhost/test\n\
    </property>\n<property name=\"hibernate.connection.username\">\nroot\n</property>\n\
    <property name=\"hibernate.connection.password\">\nroot123\n</property>\n<property\
    \ name=\"hibernate.jdbc.batch_size\">\n50\n</property>\n```\n\n```\n<!-- XML 映射文件列表\
    \ --\n<mapping resource=\"Employee.hbm.xml\"/>\n\n</session-factory>\n</hibernate-configuration>\n\
    ```\n\n考虑以下 POJO `Employee` 类：\n\n```\npublic class Employee {\n    private int\
    \ id;\n    private String firstName;\n    private String lastName;\n    private\
    \ int salary;\n\n    public Employee() {}\n    public Employee(String firstName,\
    \ String lastName, int salary) {\n        this.firstName = firstName;\n      \
