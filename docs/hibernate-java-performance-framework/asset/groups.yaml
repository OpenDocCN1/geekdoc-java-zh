    \ fname, String lname, int salary) {\nthis.firstName = fname;\nthis.lastName =\
    \ lname;\nthis.salary = salary;\n}\npublic int getId() {\n    return id;\n}\n\
    public void setId( int id) {\n    this.id = id;\n}\npublic String getFirstName()\
    \ {\n    return firstName;\n}\npublic void setFirstName(String first_name) {\n\
    \    this.firstName = first_name;\n}\npublic String getLastName() {\n    return\
    \ lastName;\n}\npublic void setLastName(String last_name ) {\n    this.lastName\
    \ = last_name;\n}\npublic int getSalary() {\n    return salary;\n}\npublic void\
    \ setSalary( int salary) {\n    this.salary = salary;\n}\npublic SortedSet getCertificates()\
    \ {\n    return certificates;\n}\npublic void setCertificates(SortedSet certificates)\
    \ {\n    this.certificates = certificates;\n}\n```\n\n# Hibernate\n\nNow let us\
    \ define another POJO class corresponding to CERTIFICATE table so that certificate\
    \ objects can be stored and retrieved into the CERTIFICATE table. This class should\
    \ also implement Comparable interface and compareTo method, which will be used\
    \ to sort the elements in case you set sort=\"natural\" in your mapping file (see\
