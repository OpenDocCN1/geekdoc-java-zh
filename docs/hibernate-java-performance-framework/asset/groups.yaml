    # HIBERNATE

    Java 持久化框架


    ## tutorialspoint

    简单易学的学习


    www.tutorialspoint.com


    # Hibernate


    # 关于教程


    Hibernate 是一个高性能的对象/关系持久化和查询服务，它采用开源的 GNU 语言通用公共许可证 (LGPL) 许可并免费下载。Hibernate 不仅负责从
    Java 类到数据库表（以及从 Java 数据类型到 SQL 数据类型）的映射，还提供了数据查询和检索能力。


    本教程将教你如何通过简单易懂的步骤使用 Hibernate 开发基于数据库的应用程序。


    # 目标读者


    本教程旨在为想要理解 Hibernate 框架及其 API 的 Java 程序员设计。


    # 前提条件


    我们假设你对 Java 语言有良好的了解。对关系型数据库、JDBC 和 SQL 的基础了解将对理解本教程非常有帮助。


