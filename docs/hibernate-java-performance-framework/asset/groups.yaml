    # Hibernate – SortedSet Mappings


    A SortedSet is a Java collection that does not contain any duplicate element and
    elements are ordered by their natural ordering or by a comparator provided.


    A SortedSet is mapped with a <set> element in the mapping table and initialized
    with java.util.TreeSet. The *sort* attribute can be set to either a comparator
    or natural ordering. If we use *natural* ordering, then its iterator will traverse
    the set in ascending element order.


