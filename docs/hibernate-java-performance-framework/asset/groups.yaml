  mdcn: "\n\n## 18. Hibernate - 拦截器 (INTERCEPTORS)\n\n正如你在 Hibernate 中学到的，一个对象将被创建并持久化。一旦对象发生了更改，就必须将其保存回数据库。这个过程一直持续，直到下一次需要该对象，此时它将从持久化存储中加载。\n\
    \n因此，对象在其生命周期中通过不同的阶段，拦截器接口（Interceptor Interface）提供了可以在不同阶段调用的方法，以执行某些所需的任务。这些方法是从\
    \ Session 到应用程序的回调，允许应用程序在持久化对象被保存、更新、删除或移除之前对其属性进行检查或操作。以下是 Interceptor 接口中所有可用方法的列表：\n\
    \n| 序号 | 方法及描述 |\n|---|---|\n| 1 | findDirty() 当在 Session 对象上调用 `flush()` 方法时调用此方法。\
    \ |\n| 2 | instantiate() 当持久化类被实例化时调用此方法。 |\n| 3 | isUnsaved() 当对象被传递给 `saveOrUpdate()`\
    \ 方法时调用此方法。 |\n| 4 | onDelete() 在对象被删除之前调用此方法。 |\n| 5 | onFlushDirty() 当 Hibernate\
    \ 在 flush（即更新操作）期间检测到对象是脏的（即已更改）时调用此方法。 |\n| 6 | onLoad() 在对象初始化之前或之后调用此方法。 |\n\
    | 7 | onSave() 在对象被保存之前调用此方法。 |\n| 8 | postFlush() 在 flush 发生且对象在内存中已更新后调用此方法。\
    \ |\n| 9 | preFlush() 在 flush 之前调用此方法。 |\n\nHibernate 拦截器（Interceptor）允许我们完全控制对象在应用程序和数据库中的呈现方式。\n\
    \n## 如何使用拦截器？\n\n要构建一个拦截器，你可以直接实现 `Interceptor` 接口，也可以扩展 `EmptyInterceptor` 类。以下是使用\
    \ Hibernate 拦截器功能的简单步骤。\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_208_0.png)\n\
    \n## 创建拦截器\n\n在示例中，我们将扩展 `EmptyInterceptor`，当 `Employee` 对象被创建和更新时，拦截器的方法将被自动调用。你可以根据需求实现更多方法。\n\
    \n```\nimport java.io.Serializable;\nimport java.util.Date;\nimport java.util.Iterator;\n\
    \nimport org.hibernate.EmptyInterceptor;\nimport org.hibernate.Transaction;\n\
    import org.hibernate.Type;\npublic class MyInterceptor extends EmptyInterceptor\
    \ {\n    private int updates;\n    private int creates;\n    private int loads;\n\
    \n    public void onDelete(Object entity,\n        Serializable id,\n        Object[]\
    \ state,\n        String[] propertyNames,\n        Type[] types) {\n        //\
    \ 什么都不做\n    }\n\n// 此方法在 Employee 对象被更新时调用。\npublic boolean onFlushDirty(Object\
    \ entity,\n    Serializable id,\n    Object[] currentState,\n    Object[] previousState,\n\
    \    String[] propertyNames,\n    Type[] types) {\n    if ( entity instanceof\
    \ Employee ) {\n        System.out.println(\"Update Operation\");\n        return\
    \ true;\n    }\n    return false;\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_209_0.png)\n\
    \n```\n}\npublic boolean onLoad(Object entity,\n    Serializable id,\n    Object[]\
    \ state,\n    String[] propertyNames,\n    Type[] types) {\n    // 什么都不做\n   \
    \ return true;\n}\n```\n\n```\n// 此方法在 Employee 对象被创建时调用。\npublic boolean onSave(Object\
    \ entity,\n    Serializable id,\n    Object[] state,\n    String[] propertyNames,\n\
    \    Type[] types) {\n    if ( entity instanceof Employee ) {\n        System.out.println(\"\
    Create Operation\");\n        return true;\n    }\n    return false;\n}\n```\n\
    \n```\n// 在提交到数据库之前\npublic void preFlush(Iterator iterator) {\n    System.out.println(\"\
    preFlush\");\n}\n```\n\n```\n// 在提交到数据库之后\npublic void postFlush(Iterator iterator)\
    \ {\n    System.out.println(\"postFlush\");\n}\n```\n\n## 创建 POJO 类\n\n现在，让我们稍微修改一下第一个示例，在示例中我们使用了\
    \ `EMPLOYEE` 表和 `Employee` 类进行演示：\n\n```\npublic class Employee {\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_210_0.png)\n\
    \n```\nprivate int id;\nprivate String firstName;\nprivate String lastName;\n\
    private int salary;\n\npublic Employee() { }\npublic Employee(String fname, String\
    \ lname, int salary) {\nthis.firstName = fname;\nthis.lastName = lname;\nthis.salary\
    \ = salary;\n}\n\npublic int getId() {\nreturn id;\n}\n\npublic void setId(int\
    \ id) {\nthis.id = id;\n}\n\npublic String getFirstName() {\nreturn firstName;\n\
    }\n\npublic void setFirstName(String first_name) {\nthis.firstName = first_name;\n\
    }\n\npublic String getLastName() {\nreturn lastName;\n}\n\npublic void setLastName(String\
    \ last_name) {\nthis.lastName = last_name;\n}\n\npublic int getSalary() {\nreturn\
    \ salary;\n}\n\npublic void setSalary(int salary) {\nthis.salary = salary;\n}\n\
    ```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_211_0.png)\n\n```\n}\n```\n\n\
    ## 创建数据库表\n\n第二步是在你的数据库中创建表。对于每个想要提供持久化的对象，都将有一个表。考虑上述对象，它们需要存储并检索到以下 RDBMS 中：\n\
    \n```\ncreate table EMPLOYEE (\n    id INT NOT NULL auto_increment,\n    first_name\
    \ VARCHAR(20) default NULL,\n    last_name VARCHAR(20) default NULL,\n    salary\
    \ INT default NULL,\n    PRIMARY KEY (id)\n);\n```\n\n## 创建映射配置文件\n\n这一步是创建一个映射文件，指示\
    \ Hibernate 如何将定义的类或类映射到数据库表。\n\n```xml\n<xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<!DOCTYPE hibernate-mapping PUBLIC\n\"//Hibernate/Hibernate Mapping DTD//EN\"\
    \n\"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\">\n\n<hibernate-mapping>\n\
    \  <class name=\"Employee\" table=\"EMPLOYEE\">\n    <id name=\"id\">\n      <generator\
    \ strategy=\"native\"/>\n    </id>\n    <property name=\"firstName\"/>\n    <property\
    \ name=\"lastName\"/>\n    <property name=\"salary\"/>\n  </class>\n</hibernate-mapping>\n\
    ```\n\n## 创建应用程序类\n\n最后，我们将创建一个应用程序类来运行。在这里，我们使用了拦截器类作为参数。\n\n```java\nimport\
    \ org.hibernate.Session;\nimport org.hibernate.SessionFactory;\nimport org.hibernate.Transaction;\n\
    import java.util.List;\nimport java.util.Iterator;\n\npublic class MyApplication\
    \ {\n    private static SessionFactory factory;\n\n    public static void main(String[]\
    \ args) {\n        factory = new Configuration().configure().setInterceptor(new\
    \ MyInterceptor()).buildSessionFactory();\n        Session session = factory.openSession();\n\
    \        Transaction tx = session.beginTransaction();\n        try {\n       \
    \     Employee emp = new Employee(\"John\", \"Doe\", 50000);\n            session.save(emp);\n\
    \            tx.commit();\n        } catch (Exception e) {\n            tx.rollback();\n\
    \            e.printStackTrace();\n        } finally {\n            session.close();\n\
    \        }\n\n        session = factory.openSession();\n        tx = session.beginTransaction();\n\
    \        try {\n            Employee emp = session.get(Employee.class, 1);\n \
    \           if (emp != null) {\n                emp.setSalary(60000);\n      \
    \      }\n            tx.commit();\n        } catch (Exception e) {\n        \
    \    tx.rollback();\n            e.printStackTrace();\n        } finally {\n \
    \           session.close();\n        }\n\n        session = factory.openSession();\n\
    \        tx = session.beginTransaction();\n        try {\n            Employee\
    \ emp = session.get(Employee.class, 1);\n            if (emp != null) {\n    \
    \            session.delete(emp);\n            }\n            tx.commit();\n \
    \       } catch (Exception e) {\n            tx.rollback();\n            e.printStackTrace();\n\
    \        } finally {\n            session.close();\n        }\n\n        session\
    \ = factory.openSession();\n        tx = session.beginTransaction();\n       \
    \ try {\n            List employees = session.createQuery(\"FROM Employee\").list();\n\
