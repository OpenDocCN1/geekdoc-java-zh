    \ 210\n\n# 1. HIBERNATE – ORM OVERVIEW\n\n## What is JDBC?\n\nJDBC stands for\
    \ **Java Database Connectivity**. It provides a set of Java API for accessing\
    \ the relational databases from Java program. These Java APIs enables Java programs\
    \ to execute SQL statements and interact with any SQL compliant database.\n\n\
    JDBC provides a flexible architecture to write a database independent application\
    \ that can run on different platforms and interact with different DBMS without\
    \ any modification.\n\n## Pros and Cons of JDBC\n\n| Pros of JDBC | Cons of JDBC\
    \ |\n|---|---|\n| Clean and simple SQL processing | Complex if is used in large\
    \ projects |\n| Good performance with large data | Large programming overhead\
    \ |\n| Very good for small applications | No encapsulation |\n| Simple syntax\
    \ easy to learn | Hard to implement MVC concept. Query is DBMS specific. |\n\n\
    # Why Object Relational Mapping (ORM)?\n\nWhen we work with an object-oriented\
    \ system, there is a mismatch between the object model and the relational database.\
    \ RDBMSs represent data in a tabular format whereas object-oriented languages,\
    \ such as Java or C# represent it as an interconnected graph of objects.\n\nConsider\
    \ the following Java Class with proper constructors and associated public function:\n\
    \n```java\npublic class Employee {\n    private int id;\n    private String first_name;\n\
    \    private String last_name;\n    private int salary;\n\n    public Employee()\
    \ {}\n    public Employee(String fname, String lname, int salary) {\n        this.first_name\
    \ = fname;\n        this.last_name = lname;\n        this.salary = salary;\n \
    \   }\n\n    public int getId() {\n      return id;\n    }\n    public String\
    \ getFirstName() {\n      return first_name;\n    }\n    public String getLastName()\
    \ {\n      return last_name;\n    }\n    public int getSalary() {\n      return\
    \ salary;\n    }\n}\n```\n\nConsider the above objects are to be stored and retrieved\
    \ in the following RDBMS table:\n\n```sql\ncreate table EMPLOYEE (\n  id INT NOT\
    \ NULL auto_increment,\n  first_name VARCHAR(20) default NULL,\n  last_name VARCHAR(20)\
    \ default NULL,\n  salary INT default NULL,\n  PRIMARY KEY (id)\n);\n```\n\nFirst,\
    \ what if we need to modify the design of our database after having developed\
    \ a few pages or our application? Second, loading and storing objects in a relational\
    \ database exposes us to the following five mismatch problems:\n\n| Mismatch |\
    \ Description |\n| --- | --- |\n| Granularity | Sometimes you will have an object\
    \ model, which has more classes than the number of corresponding tables in the\
    \ database. |\n| Inheritance | RDBMSs do not define anything similar to Inheritance,\
    \ which is a natural paradigm in object-oriented programming languages. |\n| Identity\
    \ | An RDBMS defines exactly one notion of 'sameness': the primary key. Java,\
    \ however, defines both object identity (a==b) and object equality (a.equals(b)).\
    \ |\n| Associations | Object-oriented languages represent associations using object\
    \ references whereas an RDBMS represents an association as a foreign column. |\n\
    \n# The ways you access objects in Java and in RDBMS are fundamentally different.\n\
    \nThe Object-Relational Mapping (ORM) is the solution to handle all the above\
    \ impedance mismatches.\n\n## What is ORM?\n\nORM stands for Object-Relational\
    \ Mapping (ORM) is a programming technique for converting data between relational\
    \ databases and object oriented programming languages such as Java, C#, etc.\n\
    \nAn ORM system has the advantages over plain JDBC:\n\n| S.N. | Advantages |\n\
    |---|---|\n| 1 | Let's business code access objects other than DB tables. |\n\
    | 2 | Hides details of SQL queries from OO logic. |\n| 3 | Based on JDBC 'under\
    \ the hood.' |\n| 4 | No need to deal with the database implementation. |\n| 5\
    \ | Entities based on business concepts rather than database structure. |\n| 6\
    \ | Transaction management and automatic key generation. |\n| 7 | Fast development\
    \ of application. |\n\nAn ORM solution consists of the following four entities:\n\
    \n| S.N. | Solutions |\n|---|---|\n| 1 | An API to perform basic CRUD operations\
    \ on objects of persistent classes. |\n| 2 | A language or API to specify queries\
    \ that refer to classes and properties of classes. |\n| 3 | A configurable facility\
    \ for specifying mapping metadata. |\n| 4 | A technique to interact with transactional\
    \ objects to perform dirty checking, lazy association fetching, and other optimization\
    \ functions. |\n\n"
