- md: "\n## 5. HIBERNATE–CONFIGURATION\n\nHibernate requires to know in advance –\
    \ where to find the mapping information that defines how your Java classes relate\
    \ to the database tables. Hibernate also requires a set of configuration settings\
    \ related to database and other related parameters. All such information is usually\
    \ supplied as a standard Java properties file called hibernate.properties, or\
    \ as an XML file named hibernate.cfg.xml.\n\nI will consider XML formatted file\
    \ hibernate.cfg.xml to specify Hibernate properties in my example. Most of the\
    \ properties will take their default values and it is not required to specify\
    \ them in the property file unless it is really required. This file is kept in\
    \ the root directory of your application's classpath.\n\n### Hibernate Properties\n\
    \nFollowing is the list of important properties, which will be required to configure\
    \ for a databases in a standalone situation:\n\n| S.N. | Properties and Description\
    \ |\n|---|---|\n| 1 | hibernate.dialect This property makes Hibernate generate\
    \ the appropriate SQL for the chosen database. |\n| 2 | hibernate.connection.driver_class\
    \ The JDBC driver class. |\n| 3 | hibernate.connection.url The JDBC URL to the\
    \ database instance. |\n| 4 | hibernate.connection.username The database username.\
    \ |\n| 5 | hibernate.connection.password The database password. |\n| 6 | hibernate.connection.pool_size\
    \ Limits the number of connections waiting in the Hibernate database connection\
    \ pool. |\n| 7 | hibernate.connection.autocommit Allows auto-commit mode to be\
    \ used for the JDBC connection. |\n\n## Hibernate\n\nIf you are using a database\
    \ along with an application server and JNDI, then you would have to configure\
    \ the following properties:\n\n| S.N. | Properties and Description |\n|---|---|\n\
    | 1 | hibernate.connection.datasource: The JNDI name defined in the application\
    \ server context, which you are using for the application. |\n| 2 | hibernate.ndi.class:\
    \ The InitialContext class for JNDI. |\n| 3 | hibernate.ndi.<JNDIpropertyname>:\
    \ Passes any JNDI property you like to the JNDI InitialContext. |\n| 4 | hibernate.ndi.url:\
    \ Provides the URL for JNDI. |\n| 5 | hibernate.connection.username: The database\
    \ username. |\n| 6 | hibernate.connection.password: The database password. |\n\
    \n## Hibernate with MySQL Database\n\nMySQL is one of the most popular open-source\
    \ database systems available today. Let us create hibernate.cfg.xml configuration\
    \ file and place it in the root of your application's classpath. You will have\
    \ to make sure that you have testdb available in your MySQL database and you have\
    \ a user test available to access the database.\n\nThe XML configuration file\
    \ must conform to the Hibernate 3 Configuration DTD, which is available at http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd.\n\
    \n```xml\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-configuration\
    \ SYSTEM \"http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd\">\n\n\
    <hibernate-configuration>\n  <session-factory>\n    <property name=\"hibernate.dialect\"\
    >\n      org.hibernate.dialect.MySQLDialect\n    </property>\n    <property name=\"\
    hibernate.connection.driver_class\">\n      com.mysql.jdbc.Driver\n    </property>\n\
    \n  <!-- Assume test is the database name -->\n  <property name=\"hibernate.connection.url\"\
    >\n  jdbc:://://localhost/test\n  </property>\n  <property name=\"hibernate.connection.username\"\
    >\n  root\n  </property>\n  <property name=\"hibernate.connection.password\">\n\
    \  root123\n  </property>\n\n  <!-- List of XML mapping files -->\n  <mapping\
    \ resource=\"Employee.hbm.xml\" />\n\n  </session-factory>\n</hibernate-configuration>\n\
    ```\n\nThe above configuration file includes <mapping> tags, which are related\
    \ to hibernate-mapping file and we will see in next chapter what exactly a hibernate\
    \ mapping file is how and why we do use it?\n\nFollowing is the list of important\
    \ databases dialect property type:\n\n| Database | Dialect Property |\n|---|---|\n\
    | DB2 | org.hibernate.dialect.DB2Dialect |\n| HSQLDLB | org.hibernate.dialect.HSQLDialect\
    \ |\n| HypersonicSQL | org.hibernate.dialect.HSQLDialect |\n| Informix | org.hibernate.dialect.InformixDialect\
    \ |\n| Ingress | org.hibernate.dialect.IngresDialect |\n| Interbase | org.hibernate.dialect.InterbaseDialect\
    \ |\n| Microsoft SQL Server 2000 | org.hibernate.dialect.SQLServerDialect |\n\
    | Microsoft SQL Server 2005 | org.hibernate.dialect.SQLServer2005Dialect |\n|\
    \ Microsoft SQL Server 2008 | org.hibernate.dialect.SQLServer2008Dialect |\n|\
    \ MySQL | org.hibernate.dialect.MySQLDialect |\n| Oracle (any version) | org.hibernate.dialect.OracleDialect\
    \ |\n| Oracle 11g | org.hibernate.dialect.Oracle10gDialect |\n| Oracle 10g | org.hibernate.dialect.Oracle10Dialect\
    \ |\n| Oracle 9i | org.hibernate.dialect.Oracle9iDialect |\n| PostgreSQL | org.hibernate.dialect.PostgreSQLDialect\
    \ |\n| Progress | org.hibernate.dialect.ProgressDialect |\n| SAP DB | org.hibernate.dialect.SAPDBDialect\
    \ |\n| Sybase | org.hibernate.dialect.SybaseDialect |\n| Sybase Anywhere | org.hibernate.dialect.SybaseAnywhereDialect\
    \ |\n\n## 6. HIBERNATE – SESSIONS\n\nA Session is used to get a physical connection\
    \ with a database. The Session object is lightweight and designed to be instantiated\
    \ each time an interaction is needed with the database. Persistent objects are\
    \ saved and retrieved through a Session object.\n\nThe session objects should\
    \ not be kept open for a long time they are not usually thread safe and they should\
    \ be created and destroyed as needed. The main function of the Session is to offer,\
    \ create, read, and delete operations for instances of mapped entity classes.\n\
    \nInstances may exist in one of the following three states at a given point in\
    \ time:\n\n- transient: A new instance of a persistent class, which is not associated\
    \ with a Session and has no representation in the database and no identifier value\
    \ is considered transient by Hibernate.\n- persistent: You can make a transient\
    \ instance persistent by associating it with a Session. A persistent instance\
    \ has a representation in the database, an identifier value is associated with\
    \ the Session.\n- detached: Once we close the Session, the persistent instance\
    \ will become a detached instance.\n\nA typical transaction should use the following:\n\
    \n```java\nSession session = factory.openSession();\nTransaction tx = null;\n\
    try {\n  tx = session.beginTransaction();\n  // do some work\n  tx.commit();\n\
    } catch (Exception e) {\n  if (tx!=null) tx.rollback();\n  e.printStackTrace();\n\
    } finally {\n  session.close();\n}\n```\n\n### Session Interface Methods\n\nThere\
    \ are number of methods provided by the Session, but I'm going to list down a\
    \ few important only, which we will use in this tutorial. You can check Hibernate\
    \ documentation for a complete list of methods associated with SessionFactory.\n\
    \n| S.N. | Session Methods and Description |\n|---|---|\n| 1 | TransactionTransaction()\
    \ | Begin a unit of work and return the Transaction object. |\n| 2 | void cancel()\
    \ | Cancel the execution of the current query. |\n| 3 | void clear() | Completely\
    \ clear the session. |\n| 4 | Connection close() | End the session by releasing\
    \ the JDBC connection and cleaning up. |\n| 5 | Criteria criteria(Class persistentClass)\
    \ | Create a new instance, for the given class, or as subclass of an entity class.\
    \ |\n| 6 | Criteria criteria(String entityName) | Create a new instance, for the\
    \ given name. |\n| 7 | Serializable getId(Object object) | Return the identifier\
    \ of the given entity as associated with this session. |\n| 8 | query createFilter(Object\
    \ collection, String queryString) | Create a new instance of query for the given\
    \ collection and filter string. |\n| 9 | query createQuery(String queryString)\
    \ | Create a new instance of query for the given HQL query string. |\n| 10 | SQLQuery\
    \ createSQLQuery(String queryString) | Create a new instance of SQLQuery for the\
    \ given SQL query string. |\n| 11 | void delete(Object object) | Remove a persistent\
    \ instance from the datastore. |\n| 12 | void delete(String entityName, Object\
    \ object) | Remove a persistent instance from the datastore. |\n| 13 | Session\
    \ get(String entityName, Serializable id) | Return the persistent instance of\
    \ the given entity with the given identifier, or if there is no such persistent\
    \ instance. |\n| 14 | SessionFactoryFactory() | Get the session factory, which\
    \ created this session. |\n| 15 | void refresh(Object object) | Re-read the state\
    \ of the given instance from the underlying database. |\n| 16 | Transaction getTransaction()\
    \ | Get the Transaction instance associated with this session. |\n| 17 | boolean\
    \ isConnected() | Check if the session is currently connected. |\n"
  mdcn: "\n\n## 5. Hibernate 配置\n\nHibernate 需要预先知道从哪里找到映射信息，这些信息定义了 Java 类与数据库表之间的关系。Hibernate\
    \ 还需要一组与数据库和其他相关参数相关的配置设置。所有此类信息通常作为标准的 Java 属性文件 `hibernate.properties` 提供，或者作为名为\
    \ `hibernate.cfg.xml` 的 XML 文件提供。\n\n在我的示例中，我将使用 XML 格式的文件 `hibernate.cfg.xml`\
    \ 来指定 Hibernate 属性。大多数属性将采用其默认值，除非确实需要，否则不要求在属性文件中指定它们。该文件保存在应用程序类类路径的根目录下。\n\n\
    ### Hibernate 属性\n\n以下是重要的属性列表，在独立模式下配置数据库时需要这些属性：\n\n| 序号 | 属性及描述 |\n|---|---|\n\
    | 1 | hibernate.dialect 此属性允许 Hibernate 为所选数据库生成相应的 SQL。 |\n| 2 | hibernate.connection.driver_class\
    \ JDBC 驱动程序类名。 |\n| 3 | hibernate.connection.url 指向数据库实例的 JDBC URL。 |\n| 4 | hibernate.connection.username\
    \ 数据库用户名。 |\n| 5 | hibernate.connection.password 数据库密码。 |\n| 6 | hibernate.connection.pool_size\
    \ 限制在 Hibernate 数据库连接池中等待的连接数。 |\n| 7 | hibernate.connection.autocommit 允许 JDBC\
    \ 连接使用自动提交模式。 |\n\n## Hibernate\n\n如果你在配合应用服务器和 JNDI 使用数据库，那么你将需要配置以下属性：\n\n|\
    \ 序号 | 属性及描述 |\n|---|---|\n| 1 | hibernate.connection.datasource: 在应用服务器上下文中定义的\
    \ JNDI 名称，你将其将其用于应用程序。 |\n| 2 | hibernate.ndi.class: 用于 JNDI 的 InitialContext\
    \ 类。 |\n| 3 | hibernate.ndi.<JNDIpropertyname>: 将你喜欢的任何 JNDI 属性传递给 JNDI InitialContext。\
    \ |\n| 4 | hibernate.ndi.url: 为 JNDI 提供 URL。 |\n| 5 | hibernate.connection.username:\
    \ 数据库用户名。 |\n| 6 | hibernate.connection.password: 数据库密码。 |\n\n## 使用 MySQL 数据库的\
    \ Hibernate\n\nMySQL 是目前最流行的开源数据库系统之一。让我们创建一个 `hibernate.cfg.xml` 配置文件并将其放在应用程序类路径的根目录下。你必须确保你的\
    \ MySQL 数据库中有 `testdb`，并且你有一个名为 `test` 的用户可以访问数据库。\n\nXML 配置文件必须符合 Hibernate 3\
    \ 配置 DTD，该文件 位于 http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd。\n\
    \n```xml\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-configuration\
    \ SYSTEM \"http://www.hibernate.org/dtd/hibernate-configuration-3.0.dtd\">\n\n\
    <hibernate-configuration>\n  <session-factory>\n    <property name=\"hibernate.dialect\"\
    >\n      org.hibernate.dialect.MySQLDialect\n    </property>\n    <property name=\"\
    hibernate.connection.driver_class\">\n      com.mysql.jdbc.Driver\n    </property>\n\
    \n  <!-- 假设 test 是数据库名 -->\n  <property name=\"hibernate.connection.url\">\n \
    \ jdbc:://://localhost/test\n  </property>\n  <property name=\"hibernate.connection.username\"\
    >\n  root\n  </property>\n  <property name=\"hibernate.connection.password\">\n\
    \  root123\n  </property>\n\n  <!-- XML 映射文件列表 -->\n  <mapping resource=\"Employee.hbm.xml\"\
    \ />\n\n  </session-factory>\n</hibernate-configuration>\n```\n\n上面的配置文件包含了 `<mapping>`\
    \ 标签，它们与 hibernate-mapping 文件相关，我们将在下一节中查看 hibernate 映射文件究竟是什么，以及我们如何以及为什么要使用它？\n\
    \n以下是重要的数据库方言属性类型列表：\n\n| 数据库 | 方言属性值 |\n|---|---|\n| DB2 | org.hibernate.dialect.DB2Dialect\
    \ |\n| HSQLDLB | org.hibernate.dialect.HSQLDialect |\n| HypersonicSQL | org.hibernate.dialect.HSQLDialect\
    \ |\n| Informix | org.hibernate.dialect.InformixDialect |\n| Ingress | org.hibernate.dialect.IngresDialect\
    \ |\n| Interbase | org.hibernate.dialect.InterbaseDialect |\n| Microsoft SQL Server\
    \ 2000 | org.hibernate.dialect.SQLServerDialect |\n| Microsoft SQL Server 2005\
    \ | org.hibernate.dialect.SQLServer2005Dialect |\n| Microsoft SQL Server 2008\
    \ | org.hibernate.dialect.SQLServer2008Dialect |\n| MySQL | org.hibernate.dialect.MySQLDialect\
    \ |\n| Oracle (任意版本) | org.hibernate.dialect.OracleDialect |\n| Oracle 11g | org.hibernate.dialect.Oracle10gDialect\
    \ |\n| Oracle 10g | org.hibernate.dialect.Oracle10Dialect |\n| Oracle 9i | org.hibernate.dialect.Oracle9iDialect\
    \ |\n| PostgreSQL | org.hibernate.dialect.PostgreSQLDialect |\n| Progress | org.hibernate.dialect.ProgressDialect\
    \ |\n| SAP DB | org.hibernate.dialect.SAPDBDialect |\n| Sybase | org.hibernate.dialect.SybaseDialect\
    \ |\n| Sybase Anywhere | org.hibernate.dialect.SybaseAnywhereDialect |\n\n## 6.\
    \ HIBERNATE – SESSION\n\nSession 是用于与数据库交互的物理连接，它被创建和销毁。Session 实例在给定时间点可能处于以下三种状态之一：\n\
    \n- transient（瞬态）：一个新的实例，尚未与 Session 关联，数据库中没有标识值。\n- persistent（持久态）：通过与 Session\
    \ 关联使其成为持久化实例。\n- detached（脱离态）：一旦我们关闭 Session，持久实例将变为脱离实例。\n\n典型的事务使用方法如下：\n\n\
    ```java\nSession session = factory.openSession();\nTransaction tx = null;\ntry\
    \ {\n  tx = session.beginTransaction();\n  // 执行一些操作\n  tx.commit();\n} catch\
    \ (Exception e) {\n  if (tx!=null) tx.rollback();\n  e.printStackTrace();\n} finally\
    \ {\n  session.close();\n}\n```\n\n### Session 接口方法\n\nSession 提供了许多方法，我列出一些在教程中将会使用的：\n\
    \n| 序号 | Session 方法及描述 |\n|---|---|\n| 1 | beginTransaction() 开始一个工作单元并返回 Transaction\
    \ 对象。 |\n| 2 | cancel() | 取消当前查询的执行。 |\n| 3 | clear() | 完全清空 session。 |\n| 4 |\
    \ close() | 通过释放 JDBC 连接并清理来结束 session。 |\n| 5 | criteria(Class persistentClass)\
    \ | 为指定的持久类或实体类的子类创建一个新实例。 |\n| 6 | criteria(String entityName) | 为名称创建一个新实例。\
    \ |\n| 7 | getId(Object object) 返回与此 session 关联的实体标识符。 |\n| 8 | createFilter(Object\
    \ collection, String queryString) | 为集合和过滤字符串创建一个新的查询实例。 |\n| 9 | createQuery(String\
    \ queryString) | 为指定的 HQL 查询字符串创建一个新的查询实例。 |\n| 10 | createSQLQuery(String queryString)\
    \ | 为指定的 SQL 查询字符串创建一个新的 SQLQuery 实例。 |\n| 11 | delete(Object object) | 从数据存储中移除持久实例。\
    \ |\n| 12 | delete(String entityName, Object object) | 从数据存储中移除持久实例。 |\n| 13 |\
    \ get(String entityName, Serializable id) | 获取给定标识符的实体的持久实例，如果没有该持久实例则返回 null。\
    \ |\n| 14 | getSessionFactory() 获取创建此 session 的 session 工厂。 |\n| 15 | refresh(Object\
    \ object) | 从底层数据库重新读取实例的状态。 |\n| 16 | getTransaction() 获取与此 session 关联的 Transaction\
    \ 。 |\n| 17 | isConnected() 检查 session 是否处于连接状态。 |\n\n"
