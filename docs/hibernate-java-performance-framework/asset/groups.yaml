    \n## 12. HIBERNATE – ANNOTATIONS\n\nSo far you have seen would Hibernate uses\
    \ XML mapping file for the transformation of data from POJO to database tables\
    \ and vice versa. Hibernate annotations are the newest way to define mappings\
    \ without the use of XML file. You can use annotations in addition to or as a\
    \ replacement of XML mapping metadata.\n\nHibernate Annotations are the powerful\
    \ way to provide the metadata for the Object and Relational Table mapping. All\
    \ the metadata is clubbed into the POJO java file along with the code, this helps\
    \ the user to understand the table structure and POJO simultaneously during the\
    \ development.\n\nIf you are going to make your application portable to use EJB\
    \ 3 compliant ORM applications, you must use annotations to represent the mapping\
    \ information, but if you want greater flexibility, then you should go with XML-based\
    \ mappings.\n\n## Environment Setup for Hibernate Annotation\n\nFirst of all you\
    \ would have to make that you are using JDK 5.0 otherwise you need to upgrade\
    \ your JDK to JDK 5.0 to take advantage of the native support for annotations.\n\
    \nSecond, you will need to install the Hibernate 3.x annotations distribution\
    \ package, available from the sourceforge: [Download Hibernate Annotation](...)\
    \ and copy hibernate-annotations.jar, lib/hibernate-commons-annotations.jar and\
    \ lib/ejb3-persistence.jar from the Hibernate Annotations distribution to your\
    \ CLSPATH.\n\n## Annotated Class Example\n\nAs I mentioned would have while working\
    \ with Hibernate Annotation, all the metadata is clubbed into the POJO java file\
    \ along with the code, this helps the user to understand the table structure and\
    \ POJO simultaneously during the development.\n\nConsider we are going to use\
    \ the following EMPLOYEE table to store our objects:\n\n```\ncreate table EMPLOYEE\
    \ (\n    id INT NOT NULL auto_increment,\n    first_name VARCHAR(20) default NULL,\n\
    \    last_name VARCHAR(20) default NULL,\n    salary INT default NULL,\n    PRIMARY\
    \ KEY (id)\n);\n```\n\nFollowing is the mapping of Employee class with annotations\
    \ to map objects with the defined EMPLOYEE table:\n\n```java\nimport javax.persistence.*;\n\
    ```\n\n@Entity\n@Table(name = \"EMPLOYEE\")\npublic class Employee {\n    @Id\
    \ @GeneratedValue\n    @Column(name = \"id\")\n    private int id;\n\n    @Column(name\
    \ = \"first_name\")\n    private String firstName;\n\n    @Column(name = \"last_name\"\
    )\n    private String lastName;\n\n    @Column(name = \"salary\")\n    private\
    \ int salary;\n\n    public Employee() { }\n    public int getId() {\n       \
    \ return id;\n    }\n    public void setId(int id) {\n        this.id = id;\n\
    \    }\n    public String getFirstName() {\n        return firstName;\n    }\n\
    \    public void setFirstName(String first_name ) {\n        this.firstName =\
    \ first_name;\n    }\n    public String getLastName() {\n        return lastName;\n\
    \    }\n    public void setLastName(String last_name ) {\n        this.lastName\
    \ = last_name;\n    }\n}\n\npublic int getSalary() {\n    return salary;\n}\n\
    public void setSalary( int salary ) {\n    this.salary = salary;\n}\n```\n\nHibernate\
    \ detects that the @Entity annotation is on a field and assumes that it should\
    \ access properties of an object directly through fields at runtime. If you placed\
    \ the @Id annotation on the getId() method, you would enable access to properties\
    \ through getter and setter methods by default. Hence, all annotations are also\
    \ placed on either fields or getter methods, following the selected strategy.\n\
    \nFollowing section will explain the annotations used in the above class.\n\n\
