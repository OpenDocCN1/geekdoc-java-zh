    # Hibernate – One-to-One Mappings


    A one-to-one association is similar to many-to-one association with a difference
    that the column will be set as unique. For example, an address object can be associated
    with a single employee object.


    # Define RDBMS Tables


    Consider a situation where we need to store our employee records in EMPLOYEE table,
    which will have the following structure:


    ```

    create table EMPLOYEE (

    id INT NOT NULL auto_increment,

    ```


