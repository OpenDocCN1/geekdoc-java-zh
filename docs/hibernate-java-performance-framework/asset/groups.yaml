    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    # SELECT Clause


    The SELECT clause provides more control over the result set then the the from
    clause. If you want to obtain few properties of objects instead of the complete
    object, use the SELECT clause. Following is the simple syntax of SELECT clause
    to get just first_name field of the Employee object:


    ```

    String hql = "SELECT E.firstName FROM Employee E";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    It is notable here that Employee.firstName is a property of Employee object rather
    than a field of the EMPLOYEE table.


    # WHERE Clause


    If you want to narrow the specific objects that are returned from store, you use
    the WHERE clause. Following is the simple syntax of WHERE clause:


    ```

    String hql = "FROM Employee E E.id = 10";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    # ORDER BY Clause


    To sort your HQL query''s results, you will need to use the ORDER BY clause. You
    can order the results by any property on the objects in the result set either
    ascending (ASC) or descending (DESC). Following is the simple syntax of using
    ORDER BY clause:


    ```

    String hql = "FROM Employee E E.id > 10 ORDER BY E.salary DESC";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    If you wanted to sort by more than one property, you would just add the additional
    properties to the end of the order clause, separated by commas as follows:


    ```

    String hql = "FROM Employee E E.id > 10 " +

    "ORDER BY E.firstName DESC, E.salary DESC";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


