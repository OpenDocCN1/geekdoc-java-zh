  - "[PAGE 25]\n\n# 7. HIBERNATE – PERSISTENT CLASS\n\nThe entire concept of Hibernate\
    \ is to take the values from Java class attributes and persist them to a database\
    \ table. A mapping document helps in determining how to pull the values from the\
    \ classes and map them with table and associated fields.\n\nJava classes whose\
    \ objects or instances will be stored in database tables are called persistent\
    \ classes in Hibernate. Hibernate works best if these classes follow some simple\
    \ rules, also known as the Plain Old Java Object (POJO) programming model.\n\n\
    There are following rules of persistent classes, however, none of these rules\
    \ are hard requirements:\n\n+   - All classes that will be persisted need a default\
    \ constructor.\n\n+   - All classes should contain an ID in order to allow easy\
    \ identification of your objects within Hibernate and the database. This property\
    \ maps to the primary key column of a database table.\n\n+   - All attributes\
    \ that will be persisted be declared private and have getXXX setXXX methods defined\
    \ in the JavaBean.\n\n+   - A central feature of Hibernate, quite, depends upon\
    \ the persistent class being either non-final, or the implementation of an interface\
    \ that declares all public methods.\n\n+   - All classes that do not extend or\
    \ implement some specialized classes and interfaces required by the EJB framework.\n\
    \nThe POJO name is used to emphasize that a given object is an ordinary Java Object,\
    \ not a special object, and in particular not an Enterprise JavaBean.\n\n# Simple\
    \ POJO Example\n\nBased on the few rules mentioned above, we can define a POJO\
    \ class as follows:\n\n```\npublic class Employee {\n    private int id;\n   \
    \ private String firstName;\n    private String lastName;\n    private int salary;\n\
    \    public Employee() {}\n\n    public Employee(String fname, String lname, int\
    \ salary) {\n        this.firstName = fname;\n        this.lastName = lname;\n\
    \        this.salary = salary;\n    }\n```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_25_0.png)"
