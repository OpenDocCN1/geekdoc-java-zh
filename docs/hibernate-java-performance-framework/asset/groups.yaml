  - "[PAGE 22]\n\n# 6. HIBERNATE – SESSIONS\n\nA Session is used to get a physical\
    \ connection with a database. The Session object is lightweight and designed to\
    \ be instantiated each time an interaction is needed with the database. Persistent\
    \ objects are saved and retrieved through a Session object.\n\nThe session objects\
    \ should not be kept open for a long time they are not usually thread safe and\
    \ they should be created and destroyed as needed. The main function of the Session\
    \ is to offer, create, read, and delete operations for instances of mapped entity\
    \ classes.\n\nInstances may exist in one of the following three states at a given\
    \ point in time:\n\n+   - transient: A new instance of a persistent class, which\
    \ is not associated with a Session and has no representation in the database and\
    \ no identifier value is considered transient by Hibernate.\n- persistent: You\
    \ can make a transient instance persistent by associating it with a Session. A\
    \ persistent instance has a representation in the database, an identifier value\
    \ and is associated with a Session.\\n- detached: Once we close the Hibernate\
    \ Session, the persistent instance will become a detached instance.\n\nA Session\
    \ instance is serializable if its persistent classes are serializable. A typical\
    \ transaction should use the following idiom:\n\n```\nSession session = factory.openSession();\n\
    Transaction tx = null;\ntry {\n  tx = session.beginTransaction();\n  // do some\
    \ work\n  ...\n  tx.commit();\n} catch (Exception e) {\n  if (tx!=null) tx.rollback();\n\
    \  e.printStackTrace();\n} finally {\n  session.close();\n}\n```\n\nIf the Session\
    \ throws an exception, the transaction must be rolled back and the session must\
    \ be discarded.\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_22_0.png)"
