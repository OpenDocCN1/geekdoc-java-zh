    ```\n\n## 16. HIBERNATE – CACHING\n\nCaching is a mechanism to enhance the performance\
    \ of a system. It is a buffer memory that lasts between the application and the\
    \ database. Cache memory stores recently used data items in order to reduce the\
    \ number of database hits as much as possible.\n\nCaching is important to Hibernate\
    \ as well. It utilizes a multilevel caching scheme as explained below:\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_195_0.png)\n\
    \n## First-level Cache\n\nThe first-level cache is the Session cache and is a\
    \ mandatory cache through which all requests must pass. The Session object keeps\
    \ an object under its own power, committing it to the database.\n\nIf you issue\
    \ multiple updates to an object, Hibernate tries to delay the update as long as\
    \ possible to reduce the number of update SQL statements issued. If you close\
    \ the session, all the objects being cached are lost and either persisted or updated\
    \ in the database.\n\n## Second-level Cache\n\nSecond level cache is an optional\
    \ cache and first-level cache will always be consulted before any attempt is made\
    \ to locate an object in the second-level cache. The Hibernate-level cache can\
    \ be configured on a per-class and per-collection basis and is mainly responsible\
    \ for caching objects across sessions.\n\nAny third-party cache can be used with\
    \ Hibernate. An **org.hibernate.cache.CacheProvider** interface is provided, which\
    \ must be implemented to provide Hibernate with a handle to the cache implementation.\n\
    \n## Query-level Cache\n\nHibernate also implements a cache for query resultsets\
    \ that integrates closely with the second-level cache.\n\nThis is an optional\
    \ feature and requires two additional cache regions that hold the cached query\
    \ results and the timestamps when a table was updated. This is only useful for\
    \ queries that are run frequently with the same parameters.\n\n## The Second Level\
    \ Cache\n\nHibernate uses first-level cache by default and you have nothing to\
    \ do to use first-level cache. Let's go straight to the optional second-level\
    \ cache. Not all classes benefit from caching, so it's important to be able to\
    \ disable the second-level cache.\n\nThe Hibernate second-level cache is set up\
    \ in two steps. First, you have to decide which concurrency strategy to use. After\
    \ that, you configure expression and physical cache attributes using the cache\
    \ provider.\n\n## Concurrency Strategies\n\nA concurrency strategy is a mediator,\
    \ which is responsible for storing items of data in the cache and retrieving them\
    \ from the cache. If you are going to enable a second-level cache, you will have\
    \ to decide, for each persistent cache and collection, which cache concurrency\
    \ strategy to use.\n\n- **Transactional**: Use this strategy for read-only data\
    \ where it is critical to prevent stale data in concurrent transactions, in the\
    \ rare case of an update.\n- **Read-write**: Again use this strategy for read-only\
    \ data where it is critical to prevent stale data in concurrent transactions,\
    \ in the rare case of an update.\n- **Nonstrict-read-write**: This strategy makes\
    \ no guarantee of consistency between the cache and the database. Use this strategy\
    \ if data hardly ever changes and a small likelihood of stale data is not of critical\
    \ concern.\n- **Read-only**: A concurrency strategy suitable for data, which never\
    \ changes. Use it for reference data only.\n- If we are going to use second-level\
    \ caching for our **Employee** class, let us add the mapping element to tell Hibernate\
    \ to cache Employee instances using read-write strategy.\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n\"//Hibernate/Hibernate\
