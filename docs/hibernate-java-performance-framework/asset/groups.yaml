    \n```\ncreate table CERTIFICATE (\n    id INT NOT NULL auto_increment,\n    certificate_name\
    \ VARCHAR(30) default NULL,\n    employee_id INT default NULL,\n    PRIMARY KEY\
    \ (id)\n);\n```\n\nThere will be one-to-many relationship between EMPLOYEE and\
    \ CERTIFICATE objects:\n\n# Define POJO Classes\n\nLet us implement our POJO class\
    \ Employee, which will be used to persist the objects related to EMPLOYEE table\
    \ and having a collection of certificates in SortedSet variable.\n\n```java\n\
    import java.util.*;\n\npublic class Employee {\n    private int id;\n    private\
    \ String firstName;\n    private String lastName;\n    private int salary;\n \
