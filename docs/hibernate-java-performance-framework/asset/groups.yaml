    \ 对象就是 POJO。\n\n当我们设计一个要被 Hibernate 持化的类时，提供符合 JavaBeans 规范的代码以及一个作为索引属性（例如 `Employee`\
    \ 类中的 `id` 属性）是非常重要的。\n\n```java\npublic class Employee {\n    private int id;\n\
    \    private String firstName;\n    private String lastName;\n    private int\
    \ salary;\n\n    public Employee() {}\n    Employee(String fname, String lname,\
    \ int salary) {\n        this.firstName = fname;\n        this.lastName = lname;\n\
    \        this.salary = salary;\n    }\n\n    public int getId() {\n        return\
    \ id;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\
    \n    public String getFirstName() {\n    return firstName;\n    }\n    public\
    \ void setFirstName( String first_name ) {\n    this.firstName = first_name;\n\
    \    }\n    public String getLastName() {\n        return lastName;\n    }\n \
    \   public void setLastName( String last_name ) {\n        this.lastName = last_name;\n\
    \    }\n    public int getSalary() {\n        return salary;\n    }\n    public\
    \ void setSalary( int salary ) {\n        this.salary = salary;\n    }\n}\n```\n\
    \n## 创建数据库表\n\n第二步是在你的数据库中创建表。每个你想要提供持久化的对象都将对应一张表。考虑上述对象需要在以下 RDBMS 表中进行存储和检索：\n\
    \n```sql\ncreate table EMPLOYEE (\nid INT NOT NULL auto_increment,\nfirst_name\
    \ VARCHAR(20) default NULL,\nlast_name VARCHAR(20) default NULL,\nsalary INT default\
    \ NULL,\nPRIMARY KEY (id));\n```\n\n## 创建映射配置文件\n\n这一步是创建一个映射文件，指示 Hibernate 如何将定义的类或类类映射到数据库表。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping\
    \ PUBLIC\n//Hibernate/Hibernate Mapping DTD//EN\"\n\"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n  <class name=\"Employee\" table=\"EMPLOYEE\">\n   \
    \ <meta attribute=\"class-description\">\n      此类包含员工详情。\n    </meta>\n    <id\
    \ name=\"id\" type=\"int\" column=\"id\">\n      <generator class=\"native\"/>\n\
    \    </id>\n    <property name=\"first_name\" column=\"first_name\" type=\"string\"\
    />\n    <property name=\"lastName\" column=\"last_name\" type=\"string\"/>\n \
    \   <property name=\"salary\" column=\"salary\" type=\"int\"/>\n  </class>\n</hibernate-mapping>\n\
    ```\n\n你应该将映射文档保存为 `<classname>.hbm.xml` 格式的文件。我们将映射文档保存在 `Employee.hbm.xml` 文件中。让我们查看关于映射文档的细节：\n\
    \n- 映射文档是一个以 `<hibernate-mapping>` 为根元素的 XML 文档，包含了所有的 `<class>` 元素。\n- `<class>`\
    \ 元素用于定义从 Java 类到数据库表的特定映射。Java 类名通过 `class` 元素的 `name` 属性指定，数据库表名通过 `table` 属性指定。\n\
    - `<meta>` 元素是可选的，用于创建类描述。\n- `<id>` 元素将类中的唯一 ID 属性映射到数据库表的主键。`id` 元素的 `name`\
    \ 属性引用类中的属性，`column` 属性引用数据库表中的列。`type` 属性持有 Hibernate 映射类型，该映射将从 Java 转换为 SQL\
    \ 数据类型。\n- `id` 元素中的 `<generator>` 元素用于自动生成主键值。`generator` 的 `class` 属性被设置为让 Hibernate\
    \ 根据底层数据库的能力从 `identity`、`sequence` 或 `hilo` 算法中选择一个来创建主键。\n- `<property>` 元素用于将\
    \ Java 类属性映射到数据库表中的列。`name` 属性引用类中的属性，`column` 属性引用数据库表中的列。\n\ntype 属性持有 Hibernate\
    \ 映射类型，这些映射类型将从 Java 转换为 SQL 数据类型。\n\n最后，我们将创建一个应用程序来使用 Hibernate 记录持久化操作。\n\n\
