    \ The mapping document is an XML document having <hibernate-mapping> as the root\
    \ element, which contains two <class> elements corresponding to each class.\n\n\
    +   - The <class> elements are used to define specific mappings from Java classes\
    \ to the database tables. The Java class name is specified using the name attribute\
    \ of the class element and the database table name is specified using the table\
    \ attribute.\n\n+   - The <meta> element is optional and can be used to create\
    \ the class description.\n\n+   - The <id> element maps the unique ID attribute\
    \ class to the primary key of the database table. The name attribute of the id\
    \ element refers to the property in the class and the column attribute refers\
    \ to the column in the database table. The type attribute holds the hibernate\
    \ mapping type, this mappings will convert from Java to SQL data type.\n\n+  \
    \ - The <generator> element within the id element is used to generate the primary\
    \ key values. The class attribute of the generator is set to native let hibernate\
    \ pick up each identity, sequence or hi algorithm to create primary key depending\
    \ upon the capabilities of the underlying database.\n\n+   - The <property> element\
    \ is used to map a Java class property to a column in the database table. The\
    \ name attribute of the element refers to the property in the class and the column\
    \ attribute refers to the column in the database table. The type attribute holds\
    \ the hibernate mapping type, this mappings will convert from Java to SQL data\
    \ type.\n\n+   - The <set> element sets the relationship between Certificate and\
    \ Employee classes. We set cascade attribute to save-update to Hibernate to persist\
