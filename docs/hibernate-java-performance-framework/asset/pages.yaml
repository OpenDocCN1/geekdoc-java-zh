  md: "# Define Hibernate Mapping File\n\nLet us develop our mapping file, which instructs\
    \ Hibernate how to map the defined classes to the database tables. The <bag> element\
    \ will be used to define the rule for the Collection used.\n\n```\n?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n\"//Hibernate/Hibernate\
    \ Mapping DTD//EN\"\n\"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n  <class name=\"Employee\" table=\"EMPLOYEE\">\n   \
    \ <meta attribute=\"class-description\">\n      This class contains the employee\
    \ detail.\n    </meta>\n    <id name=\"id\" type=\"int\" column=\"id\">\n    \
    \  <generator class=\"native\"/>\n    </id>\n    <bag name=\"certificates\" cascade=\"\
    all\">\n      <key column=\"employee_id\"/>\n      <one-to-many class=\"Certificate\"\
    />\n    </bag>\n    <property name=\"firstName\" column=\"first_name\" type=\"\
    string\"/>\n    <property name=\"lastName\" column=\"last_name\" type=\"string\"\
    />\n    <property name=\"salary\" column=\"salary\" type=\"int\"/>\n  </class>\n\
    \n  <class name=\"Certificate\" table=\"CERTIFICATE\">\n    <meta attribute=\"\
