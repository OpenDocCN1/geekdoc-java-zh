  md: '# 3. HIBERNATE ARCHITECTURE


    Hibernate has a layered architecture which helps the user to operate without having
    to know the underlying APIs. Hibernate makes use of the database and configuration
    data to provide persistence services (and persistent objects) to the application.

    Following is a very high level view of the Hibernate Application Architecture.


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Following is a detailed view of the Hibernate Application Architecture with
    its important core classes.


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_14_0.png)


    Hibernate uses various existing Java APIs, like JDBC, Java Transaction API(JTA),
    and Java Naming and Directory Interface (JNI). JDBC provides a rudimentary level
    of abstraction for functionality over relational databases, allowing almost any
    database with a JDBC driver to be supported by Hibernate. JNI and JTA allow Hibernate
    to be integrated with J2EE application servers.


    Following section gives brief description of each of the class objects involved
    in Hibernate Application Architecture.


    # # Configuration Object


    The Configuration object is the first Hibernate object you create in any Hibernate
    application. It is usually created only once during application initialization.
    It represents a configuration or properties file required by the Hibernate.


    The Configuration object provides two keys components:


    +   * **Database Connection:** This is handled through one or more configuration
    files supported by Hibernate. These files are hibernate.properties and hibernate.cfg.xml.

    * **Class Mapping Setup:** This component creates the connection between the Java
    classes and database tables.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# SessionFactory Object


    Configuration object is used to create a SessionFactory object which in turn configures
    Hibernate for the application using the supplied configuration file and allows
    for a Session object to be instantiated. The SessionFactory is a thread safe object
    and used by all the threads of an application.


    The SessionFactory is a heavyweight object; it is usually created during application
    start and kept for later use. You would need one SessionFactory object per database
    using a separate configuration file. So, if you are multiple databases, you would
    have to create multiple SessionFactory objects.


    # Session Object


    A Session is used to get a physical connection with a database. The Session object
    is lightweight and designed to be instantiated each time an interaction is needed
    with the database. Persistent objects are saved and retrieved through a Session
    object.


    The session objects should not be kept open for a long time because they are not
    thread safe and they should be created and destroyed as needed.


    # Transaction Object


    A Transaction represents a unit of work with the database and most of the RDBMS
    supports transaction functionality. Transactions in Hibernate are handled by an
    underlying transaction manager and transaction (from JDBC or JTA).


    This is an optional object and Hibernate applications may choose not to use this
    interface, instead managing transactions in their own application code.


    # Query Object


    Query objects use SQL or Hibernate Query Language (HQL) string to retrieve data
    from the database and create objects. A Query instance is used to bind query parameters,
    limit the number of results returned by the query, and finally to execute the
    query.


    # Criteria Object


    Criteria objects are used to create and execute object oriented criteria queries
    to retrieve objects.'
  merge: -1
