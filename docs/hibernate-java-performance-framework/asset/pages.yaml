  md: "```\n}\npublic int getSalary() {\n    return salary;\n}\npublic void setSalary(\
    \ int salary ) {\n    this.salary = salary;\n}\n\n```\n\nHibernate detects that\
    \ the @Entity annotation is on a field and assumes that it should access properties\
    \ of an object directly through fields at runtime. If you placed the @Id annotation\
    \ on the getId() method, you would enable access to properties through getter\
    \ and setter methods by default. Hence, all annotations are also placed on either\
    \ fields or getter methods, following the selected strategy.\n\nFollowing section\
    \ will explain the annotations used in the above class.\n\n# @Entity Annotation\n\
    \nThe JPA 3 standard annotations are contained in the javax.persistence package,\
    \ so we import this package as the first step. Second, we use the @Entity annotation\
    \ to the Employee class, which marks this class as an entity bean, so it must\
    \ have a no-argument constructor that is visible with at least protected scope.\n\
    \n# @Table Annotation\n\nThe @Table annotation allows you to specify the details\
    \ of the table that will be used to persist the entity in the database.\n\nThe\
    \ @Table annotation provides four attributes, allowing you to override the name\
    \ of the table, its catalogue, and its schema, and enforce unique constraints\
    \ on columns in the table. For now, we are using table name, which is EMPLOYEE.\n\
    \n# @Id and @GeneratedValue Annotations\n\nEach bean will have a primary key,\
    \ which you annotate the class with the @Id annotation. The primary key can be\
    \ a single field or a combination of multiple fields depending on your table structure.\n\
    \nBy default, the @Id annotation will automatically determine the most appropriate\
    \ primary key generation strategy to use but you can override this by applying\
    \ the @GeneratedValue annotation, which takes two parameters strategy and generator\
    \ that I'm not going to discuss here, so let us use only the default key generation\
    \ strategy. Letting Hibernate determine which generator type to make your code\
    \ portable between different databases.\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_164_0.png)"
