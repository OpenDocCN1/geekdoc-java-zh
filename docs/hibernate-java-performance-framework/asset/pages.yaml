  md: "# DELETE Clause\n\nThe DELETE clause can be used to delete one or more objects.\
    \ Following is the simple syntax of using DELETE clause:\n\n```\nString hql =\
    \ \"DELETE FROM Employee \" + \n  \"WHERE id = :employee_id\";\nQuery query =\
    \ session.createQuery(hql);\nquery.setParameter(\"employee_id\", 10);\nint result\
    \ = query.executeUpdate();\nSystem.out.println(\"Rows affected: \" + result);\n\
    ```\n\n# INSERT Clause\n\nHQL supports INSERT INTO clause where only records can\
    \ be inserted from one object to another object. Following is the simple syntax\
    \ of using INSERT INTO clause:\n\n```\nString hql = \"INSERT INTO Employee(firstName,\
    \ lastName, salary)\" + \n  \"SELECT firstName, lastName, salary FROM old_employee\"\
    ;\nQuery query = session.createQuery(hql);\nint result = query.executeUpdate();\n\
    System.out.println(\"Rows affected: \" + result);\n```\n\n# Aggregate Methods\n\
    \nHQL supports a range of aggregate methods, similar to SQL. They work the same\
    \ way in HQL as in SQL and following is the list of the aggregate functions:\n\
    \n| S.N. | Functions | Description |\n|---|---|---|\n| 1 | avg(property name)\
    \ | The average of a property value |\n| 2 | count(property name or *) | The number\
    \ of times a property occurs in the results |\n| 3 | max(property name) | The\
    \ maximum value of the property values |\n| 4 | min(property name) | The minimum\
    \ value of the property values |\n| 5 | sum(property name) | The sum total of\
    \ the property values |\n\nThe distinct keyword only counts the unique values\
    \ in the row set. The following query will return only count:\n\n```\nString hql\
    \ = \"SELECT count(distinct E.firstName) FROM Employee E\";\nQuery query = session.createQuery(hql);\n\
    ```\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_174_0.png)"
