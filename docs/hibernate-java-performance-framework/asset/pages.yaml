  md: '# 18. HIBERNATE – INTERCEPTORS


    As you have learnt in Hibernate, an object will be created and persisted. Once
    the object has been changed, it must be saved back to the database. This process
    continues until the next time the object is needed, and it will be loaded from
    the persistent store.


    Thus an object passes through different stages in its life cycle and Interceptor
    Interface provides methods, which can be called at different stages to perform
    some required tasks. These methods are callbacks from the session to the application,
    applying the application to inspect and or manipulate properties of a persistent
    object before it is saved, updated, deleted or removed. Following is the list
    of all the methods available within the Interceptor interface:


    | S.N. | Method and Description |

    |---|--|

    | 1 | findDirty() This method is called when the flush() method is called on a
    Session object. |

    | 2 | instantiate() This method is called when a persisted class is instantiated.
    |

    | 3 | isUnsaved() This method is called when an object is passed to the saveOrUpdate()
    method/ |

    | 4 | onDelete() This method is called before an object is deleted. |

    | 5 | onFlushDirty() This method is called when Hibernate detects that an object
    is dirty (i.e. has been changed) during a flush i.e. update operation. |

    | 6 | onLoad() This method is called before or after an object is initialized.
    |

    | 7 | onSave() This method is called before an object is saved. |

    | 8 | postFlush() This method is called after a flush has occurred and an object
    has been updated in memory. |

    | 9 | preFlush() This method is called before a flush. |


    Hibernate Interceptor gives us total control over how an object will look to both
    the application and the database.


    # How to Use Interceptors?


    To build an interceptor, you can either implement Interceptor directly or extend
    EmptyInterceptor class. Following will be the simple steps to use Hibernate Interceptor
    functionality.


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_208_0.png)'
