  md: "# 17. HIBERNATE – BATCH PROCESSING\n\nConsider a situation when you need to\
    \ upload a large number of records into your database using Hibernate. Following\
    \ is the code snippet to achieve this using Hibernate:\n\n```\nSession session\
    \ = SessionFactory.openSession();\nTransaction tx = session.beginTransaction();\n\
    for ( int i=0; i<100000; i++) {\n    Employee employee = new Employee(....);\n\
    \    session.save(employee);\n}\ntx.commit();\nsession.close();\n```\n\nBy default,\
    \ Hibernate will cache all the persisted objects in the session-level cache and\
    \ ultimately your application would fall over with an OutMemoryException somewhere\
    \ around the 50,00thth. You can resolve this problem, if you are using batch processing\
    \ with Hibernate.\n\nTo use the batch feature, set hibernate.jdbc.batch_size as\
    \ batch size to a number either at 20 or 50 depending on object size. This will\
    \ tell the hibernate container that every X rows to be inserted as batch. To implement\
    \ this in your code, you would need to do little modification as follows:\n\n\
    ```\nSession session = SessionFactory.openSession();\nTransaction tx = session.beginTransaction();\n\
    for ( int i=0; i<100000; i++) {\n    Employee employee = new Employee(....);\n\
    \    session.save(employee);\n    if( i % 50 == 0 ) // Same as the JDBC batch\
    \ size\n        //flush a batch of inserts and release memory:\n        session.flush();\n\
    \        session.clear();\n}\ntx.commit();\nsession.close();\n```\n\nAbove code\
    \ will work fine for the INSERT operation, but if you are willing to make UPDATE\
    \ operation, then you can achieve using the following code:\n\n![](img/5e2dfb5638e25fc658eae48afffa90f6_201_0.png)"
