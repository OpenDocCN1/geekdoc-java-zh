    \ for reasons explained earlier, Hibernate applications use arrays.\n\n# Hibernate\
    \ - Bag Mappings\n\nA Bag is a Java collection that stores elements without caring\
    \ about the sequencing, allow duplicate elements in the list. A Bag is a random\
    \ grouping of the objects in the list.\n\nA Collection is mapped with a <bag>\
    \ element in the mapping table and initialized with java.util.ArrayList.\n\n#\
    \ Define RDBMS Tables\n\nConsider a situation where we need to store our employee\
