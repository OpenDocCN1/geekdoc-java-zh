  md: '# 5. HIBERNATE–CONFIGURATION


    Hibernate requires to know in advance – where to find the mapping information
    that defines how your Java classes relate to the database tables. Hibernate also
    requires a set of configuration settings related to database and other related
    parameters. All such information is usually supplied as a standard Java properties
    file called hibernate.properties, or as an XML file named hibernate.cfg.xml.


    I will consider XML formatted file hibernate.cfg.xml to specify Hibernate properties
    in my example. Most of the properties will take their default values and it is
    not required to specify them in the property file unless it is really required.
    This file is kept in the root directory of your application''s classpath.


    Hibernate Properties


    Following is the list of important properties, which will be required to configure
    for a databases in a standalone situation:


    | S.N. | Properties and Description |

    |---|---|

    | 1 | hibernate.dialect This property makes Hibernate generate the appropriate
    SQL for the chosen database. |

    | 2 | hibernate.connection.driver_class The JDBC driver class. |

    | 3 | hibernate.connection.url The JDBC URL to the database instance. |

    | 4 | hibernate.connection.username The database username. |

    | 5 | hibernate.connection.password The database password. |

    | 6 | hibernate.connection.pool_size Limits the number of connections waiting
    in the Hibernate database connection pool. |

    | 7 | hibernate.connection.autocommit Allows auto-commit mode to be used for the
    JDBC connection. |'
  merge: -1
