  md: '# 9. HIBERNATE – MAPPING TYPES


    When you prepare a Hibernate mapping document, you find that you map the Java
    data types into RDBMS data types. The types declared and used in the mapping files
    are not Java data types; they are not SQL database types either. These are called
    Hibernate mapping types, which can translate from Java to SQL data types and versa.


    This chapter lists down all the basic, date and time, large object, and various
    built-in types.


    # Primitive Types


    | Mapping type | Java type | ANSI SQL Type |

    |---|---|--|

    | integer | int or java.lang.Integer | INTEGER |

    | long | long or java.lang.Long | BIGINT |

    | short | short or java.lang.Short | SMALLINT |

    | float | float or java.lang.Float | FLOAT |

    | double | double or java.lang.Double | DOUBLE |

    | big_decimal | java.math.BigDecimal | NUMERIC |

    | character | java.lang.String | CHAR(1) (''Y'' or ''N'') |

    | string | java.lang.String | VARCHAR |

    | byte | byte or java.lang.Byte | TINYINT |

    | boolean | boolean or java.lang.Boolean | BIT |

    | yes/no | boolean or java.lang.Boolean | CHAR(1) (''T'' or ''F'') |

    | true/false | boolean or java.lang.Boolean | |


