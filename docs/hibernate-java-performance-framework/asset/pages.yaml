  md: "# Hibernate\n\n# # Association Mappings\n\nThe mapping of associations between\
    \ entity classes and the relationships between tables is the soul of ORM. Following\
    \ are the four ways in which the cardinality of the relationship between the objects\
    \ can be expressed. An association mapping can be unidirectional as well as bidirectional.\n\
    \n| Mapping type | Description |\n| :--- | :--- |\n| Many-to-One | Mapping many-to-one\
    \ relationship using Hibernate |\n| One-to-One | Mapping one-to-one relationship\
    \ using Hibernate |\n| One-to-Many | Mapping one-to-many relationship using Hibernate\
    \ |\n| Many-to-Many | Mapping many-to-many relationship using Hibernate |\n\n\
    # # Hibernate – Many-to-One Mappings\n\nA **many-to-one** is the most common kind\
    \ of association where an Object can be associated with multiple objects. For\
    \ example, the same address object can be associated with multiple employee objects.\n\
