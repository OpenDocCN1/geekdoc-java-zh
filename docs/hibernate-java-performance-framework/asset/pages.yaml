    You should save the mapping document in the file with the format <class>.hbm.xml.
    We saved our mapping document in the file Employee.hbm.xml. You are already familiar
    with most of the mapping detail, but let us see all the elements of the mapping
    file once:


    +   - The mapping document is an XML document having **hibernate-mapping** as
    the root element, which contains two <class> elements corresponding to each class.

    - The <class> elements are used to define specific mappings from a Java classes
    to the database tables. The Java class name is specified using the **name** attribute
    of the class element and the database table name is specified using the **table**
    attribute.

    - The **<meta>** element is optional element and can be used to create the class
    description.

    - The <id> element maps the unique ID to the primary key of the database table.
    The **name** attribute of the id element refers to the property in the class and
    the **column** attribute refers to the column in the database table. The **type**
    attribute holds the hibernate mapping type, this mappings will convert from Java
    to SQL data type.

    - The **<generator>** element within the id element is used to generate the primary
    key attributes. The **class** attribute of the generator is set to **native**
    to let hibernate pick up either **identity, sequence** or **hilo** algorithm to
    create primary key depending upon the capabilities of the underlying database.

    - The **<property>** element is used to map a Java class property to a column
    in the database table. The **name** attribute of the element refers to the property
    in the class and the **column** attribute refers to the column in the database
    table. The **type** attribute holds the hibernate mapping type, this mappings
    will convert from Java to SQL data type.

    - The **<many-to-one>** element is used to set the relationship between EMPLOYEE
    and ADDRESS. The **name** attribute is set to the defined variable in the parent
    class, in our case it is **address**. The **column** attribute is used to set
    the column name in the parent table EMPLOYEE.


    Finally, we will create our application class with the main() method to run the
    application. We will use this application to save few Employee''s records with
    their addresses and then we will apply CRUD operations on those records.'
