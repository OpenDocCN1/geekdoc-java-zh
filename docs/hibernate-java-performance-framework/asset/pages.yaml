  md: '# Hibernate


    ```

    </hibernate-mapping>

    ```


    You should save the mapping document in a file with the format <classname>.hbm.xml.
    We saved our mapping document in the file Employee.hbm.xml. You are already familiar
    with most of the mapping detail, but let us see all elements of the mapping file
    once:


    +   * The mapping document is an XML document having <hibernate-mapping> as the
    root element, which contains two <class> elements corresponding to each class.

    * The <class> elements are used to define specific mappings from Java classes
    to the database tables. The Java class name is specified using the name attribute
    of the class element and the database table name is specified using the table
    attribute.

    * The <meta> element is optional and can be used to create the class description.

    * The <id> elements use the unique ID attribute in class to the primary key of
    the database table. The name attribute of the id element refers to the property
    in the class and the column attribute refers to the column in the database table.
    The type attribute holds the hibernate mapping type, this mapping types will convert
    from Java to SQL data type.

    * The <generator> element within the id element is used to generate the primary
    key values automatically. The class attribute of the generator element is set
    to native hibernate pick up either identity, sequence or hilo algorithm to create
    primary key depending on the capabilities of the underlying database.

    * The <property> element is used to map a Java class property to a column in the
    database table. The name attribute of the element refers to the property in the
    class and the column attribute refers to the column in the database table. The
    type attribute holds the hibernate mapping type, this mapping types will convert
    from Java to SQL data type.

    * The <bag> element is used to set the relationship between Certificate and Employee
    classes. We used the cascade attribute in the <bag> element to tell Hibernate
    to persist the Certificate objects at the same time as the Employee objects. The
    name attribute is set to the defined Collection variable in the parent class,
    in our case it is certificates.

    * The <key> element is the column in the CERTIFICATE table that holds the foreign
    key to the parent object.

    * The <one-to-many> element indicates that one Employee relates to many Certificate
    objects and, as such, the Certificate object must have an Employee parent associated
    with it. You can use either <one-to-one>, <many-to-one> or <many-to-many> elements
    based on your requirement.


