  md: 'You can use native SQL to express database queries if you want to utilize database-specific
    features such as hints or the CONNECT keyword in Oracle. Hibernate 3.x allows
    you to specify SQL, including stored procedures, for all create, update, delete,
    and load operations.


    Your application will create a native SQL query from the session with the createSQLQuery()
    method on the Session interface:


    ```

    public SQLQuery createQuery(String sqlString) throws HibernateException

    ```


    After you pass a string containing the SQL query to the createSQLQuery() method,
    you can associate the result with either a Hibernate entity, a join, or a scalar
    result using addEntity(), addJoin(), and addScalar() methods respectively.


    # Scalar Queries


    The most basic SQL query is to get a list of scalars (values) from one or more
    tables. Following is the syntax for using native SQL for scalar values:


    ```

    String sql = "SELECT first_name, salary FROM EMPLOYEE";

    SQLQuery query = session.createQuery(sql);

    query.getResultTransformmer(Criteria.ALIAS_TO_ENTITY_MAP);

    List results = query.list();

    ```


    # Entity Queries


    The above queries were all about returning scalar values, basically returning
    the "raw" values from the result set. Following is the syntax to get entity objects
    as a whole from a native SQL query via addEntity().


    ```

    String sql = "SELECT * FROM EMPLOYEE";

    SQLQuery query = session.createQuery(sql);

    query.addEntity(Employee.class);

    List results = query.list();

    ```


    # Named SQL Queries


    Following is the syntax to get entity objects from a native SQL query via addEntity()
    and using named SQL query.


    ```

    String sql = "SELECT * FROM EMPLOYEE WHERE id = :employee_id";

    ```


