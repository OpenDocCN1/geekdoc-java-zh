  md: '# Pagination Using Criteria


    There are two methods of the Criteria interface for pagination.


    | S.N. | Method & Description |

    |---|---|n| 1 | **public Criteria setFirstResult(int firstResult)**<br>This method
    takes an integer that represents the first row in your result set, starting with
    row 0. |

    | 2 | **public Criteria maxResults(int maxResults)**<br>This method tells Hibernate
    to retrieve a fixed number **maxResults** of objects. |


    Using above two methods, we can construct a paging component in our web or Swing
    application. Following is the example, which you can extend to fetch 10 rows at
    a time:


    ```

    Criteria cr = session.createCriteria(Employee.class);

    cr.setFirstResult(1);

    cr.setMaxResults(10);

    List results = cr.list();

    ```


    # Sorting the Results


    The Criteria API provides the **org.hibernate.criterion.Order** class to sort
    your result set in either ascending or descending order, according to one of your
    object''s properties. This example demonstrates how you would use the Order class
    to sort your result set:


    ```

    Criteria cr = session.createCriteria(Employee.class);

    // To get records having salary more than 2000

    cr.add(Restrictions.gt("salary", 2000));


    // To sort records in descending order

    crit.addOrder(Order.desc("salary"));


    // To sort records in ascending order

    crit.addOrder(Order.asc("salary"));

    List results = cr.list();

    ```


    # Projections & Aggregations


    The Criteria API provides the **org.hibernate.criterion.Projections** class, which
    can be used to get average, maximum, or minimum of the property values. The Projections
    class


