  md: "The <meta> element is optional element and can be used to create the class\
    \ description.\n\nThe <id> element maps the unique ID attribute in class to the\
    \ primary key of the database table. The **name** attribute of the id element\
    \ refers to the property in the class and the **column** attribute refers to the\
    \ column in the database table. The **type** attribute holds the hibernate mapping\
    \ type, this mappings type will convert from Java to SQL data type.\n\nThe <generator>\
    \ element within the id is used to generate the primary keys automatically. The\
    \ **class** attribute of the generator element is set to **native** to let hibernate\
    \ pick up **identity**, **sequence** or **hilo** algorithm to create primary key\
    \ depending upon capabilities of the underlying database.\n\nThe <property> element\
    \ is used to map a Java class to a column in the database table. The **name**\
    \ attribute of the element refers to the property in the class and the **column**\
    \ attribute refers to the column in the database table. The **type** attribute\
    \ holds the hibernate mapping type, this mappings type will convert from Java\
    \ to SQL data type.\n\nThe <map> element is used to set the relationship between\
    \ Certificate and Employee classes. We used the **cascade** attribute in the <map>\
    \ element to tell Hibernate to persist the Certificate objects at the same time\
    \ as the Employee objects. The **name** attribute is set to the defined **SortedMap**\
    \ in the parent class, in case it is **certificates**. The **sort** attribute\
    \ can be set to **natural** to have natural sorting or it can be set to a custom\
    \ class implementing **java.util.Comparator**. We have used a class MyClass, which\
    \ implements java.util.Comparator to reverse the sorting order implemented in\
    \ Certificate class.\n\nThe <index> element is used to represents the keys of\
    \ the class/value map pair. The key will be stored in the column certificate_type\
    \ using a type of string.\n\nThe <key> element is the column in the CERTIFICATE\
    \ table that holds the foreign key to the parent object i.table EMPLOYEE.\n\n\
    The <one-to-many> element indicates that one Employee object relates to many Certificate\
    \ objects, and such, the Certificate object must have an Employee associated with\
    \ it. You can use either **one-to-one**, **many-to-one** or **many-to-many** elements\
    \ based on your requirement.\n\nIf use sort=\"natural\" setting, we do not need\
