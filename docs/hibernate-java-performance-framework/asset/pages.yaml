    # Component Mappings


    It is much possible that an Entity class can have a reference to another class
    as a member variable. If the referred class does not have its own life cycle and
    completely depends on the life cycle of the owning entity class, the referred
    class here therefore is called as **Component class.**


    The mapping of Collection of Components is also possible in a similar way just
    as the mapping of Regular Collections with minor configuration differences. We
    will see these two mappings in detail with examples.


    | Mapping type | Description |

    |---|---|

    | Component Mappings | Mapping for a class having a reference to another class
    as a member variable. |


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_150_0.png)'
