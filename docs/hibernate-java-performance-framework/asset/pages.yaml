  md: '# 13. HIBERNATE – QUERY LANGUAGE


    Hibernate Query Language (HQL) is an object-oriented query language, similar to
    SQL, but instead of operating on tables and columns, HQL works with persistent
    objects and their properties. HQL queries are translated by Hibernate into conventional
    SQL queries, which in turns perform action on database.


    Although you can use SQL statements directly with Hibernate with Native SQL, but
    I would recommend to use HQL whenever possible to avoid database portability hassles,
    and to take advantage of Hibernate''s SQL generation and caching strategies.


    Keywords like SELECT, FROM, and WHERE, etc are not case sensitive, but properties
    table and column names are sensitive in HQL.


    # FROM Clause


    You will use FROM clause if you want to load a complete persistent objects into
    memory. Following is the simple syntax of FROM clause:


    ```

    String hql = "FROM Employee";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    If you need to fully qualify a class name in HQL, just specify the package and
    class name as follows:


    ```

    String hql = "FROM com.hibernatebook.criteria.Employee";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    # AS Clause


    The AS clause can be used to assign aliases to the classes in your HQL queries,
    especially when you have the long queries. For instance, our previous simple example
    would be the following:


    ```

    String hql = "FROM Employee AS E";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    The AS keyword is optional and you can also specify the alias directly after the
    class name, as follows:


    ```

    String hql = "FROM Employee E";

    ```


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_171_0.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '```

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    # SELECT Clause


    The SELECT clause provides more control over the result set then the the from
    clause. If you want to obtain few properties of objects instead of the complete
    object, use the SELECT clause. Following is the simple syntax of SELECT clause
    to get just first_name field of the Employee object:


    ```

    String hql = "SELECT E.firstName FROM Employee E";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    It is notable here that Employee.firstName is a property of Employee object rather
    than a field of the EMPLOYEE table.


    # WHERE Clause


    If you want to narrow the specific objects that are returned from store, you use
    the WHERE clause. Following is the simple syntax of WHERE clause:


    ```

    String hql = "FROM Employee E E.id = 10";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    # ORDER BY Clause


    To sort your HQL query''s results, you will need to use the ORDER BY clause. You
    can order the results by any property on the objects in the result set either
    ascending (ASC) or descending (DESC). Following is the simple syntax of using
    ORDER BY clause:


    ```

    String hql = "FROM Employee E E.id > 10 ORDER BY E.salary DESC";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    If you wanted to sort by more than one property, you would just add the additional
    properties to the end of the order clause, separated by commas as follows:


    ```

    String hql = "FROM Employee E E.id > 10 " +

    "ORDER BY E.firstName DESC, E.salary DESC";

    Query query = session.createQuery(hql);

    List results = query.list();

    ```


    ![](img/5e2dfb5638e25fc658eae48afffa90f6_172_0.png)'
