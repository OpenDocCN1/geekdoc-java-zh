    class, in our case, it is **certificates**.


    +   - The **<key>** element is the column in the CERTIFICATE table that holds
    the foreign key to the parent i.e. table EMPLOYEE.


    +   - The **<list-index>** element is used to keep the position of the element
    and map with the index in the collection table. The index of the persistent list
    starts at zero. You can change this, for example, with **<list-index base="1"/>**
    in your mapping.


    +   - The **<one-to-many>** element indicates that one Employee object relates
    to many Certificate objects and, as, the Certificate object must have an Employee
