  md: '# Define Hibernate Mapping File


    Let us develop our mapping files, which instructs Hibernate how to map the defined
    classes to the database tables. The <many-to-one> element will be used to define
    the rule to establish a many-to-one relationship between EMPLOYEE and ADDRESS
    entities.


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <!DOCTYPE hibernate-mapping PUBLIC "//Hibernate/Hibernate Mapping DTD//EN"

    "http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd">


    <hibernate-mapping>

    <class name="Employee" table="EMPLOYEE">

    <meta attribute="class-description">

    This class contains the employee detail.

    </meta>

    <id name="id" type="int" column="id">

    <generator class="native"/>

    </id>

    <property name="firstName" column="first_name" type="string"/>

    <property name="lastName" column="last_name" type="string"/>

    <property name="salary" column="salary" type="int"/>

    <many-to-one name="address" column="address" class="Address" not-null="true"/>

    </class>


    <class name="Address" table="ADDRESS">

    <meta attribute="class-description">

    This class contains the address detail.

    </meta>

    <id name="id" type="int" column="id">

    <generator class="native"/>

    </id>

    <property name="street" column="street_name" type="string"/>

    <property name="city" column="city_name" type="string"/>

    ```


