  md: '# Preface


    # The WWW


    In this section, I will answer the three Ws. No, not that www—the three Ws of
    this book:


    +   - Why was this book written?

    - What''s it about?

    - Who is it for?


    # The What and Why


    Before I explain who the book is for, I''d like to start explaining what this
    book is about and what prompted its writing.


    # The Why


    As the editor for SitePoint''s PHP channel¹, I communicate daily with many PHP
    developers. Almost every developer comes from a different background—educational,
    racial, graphical—so the channel is truly a melting pot of cultures and approaches.
    Some are formally trained computer scientists, others are self-taught freelancers.
    Some are well-versed in enterprise etiquette, rigor and culture; others can''t
    wait to churn out code and see it. In all of my time working for SitePoint, I''ve
    never met two developers who have the same approach to writing and coding.


    Trying to create a channel that works cohesively with such an array or writers
    was quite challenging. The writing part was easy to standardize—I enforced the
    Markdown format (no need to concern yourself with this if you don''t know what
    it is) rather than HTML or Word files, passed on some links to valuable tools
    such as spellcheckers and small detectors (tools that capitalize your title, check
    for repeated phrases, isolated misused phrases, and so on). But when you''re responsible
    for editing and checking hundreds of posts, it''s not the writing that''s the
    biggest problem—it''s the code. Writers would send their code in zip archives
    alongside articles, as if thrown into a cardboard box, duct-taped, and shipped.


    > ¹ http://www.sitepoint.com/php/'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'The code was everything from simply messy to incompatible with my version of
    PHP, and thus it was insanely difficult to verify—after all, letting a malfunctioning
    demo go alive alongside a tutorial was unforivable! Imagine receiving code samples
    from 100 different people, each configured for a separate combination of PHP +
    server + PHP extensions and other factors. There''s simply no way to manually
    configure your computer fast enough to be able to go them all in a given time.
    Code needs standardization, and in big teams, as ours in a SitePoint''s PHP channel,
    is of utmost importance.


    To remove this barrier, I used all the approaches I talk about in this book. To
    make them work for you and to have code that is automatically compatible with
    all other developers and their computers instantly would be minutes of work; however,
    this book was written to help you understand what is going on in these configurations,
    and how exactly this compatibility was achieved. Why would you want to know this,
    you might wonder?


    Two reasons:


    +   1. You''ll gain a solid foundation early in your career, absorbing good practices
    before you''ve had a chance to be exposed to bad ones. I cannot stress how important
    this is: the amount of energy it takes to unlearn something is colossal, especially
    if you''re told you''re wrong, because we have a natural predisposition to take
    a defensive stance—even if, deep down, we might know the other party is right.


    +   2. If you''re serious building a PHP career, chances you''ll end up leading
    or joining a team of developers one day. Maybe it will be a freelance team building
    small websites for individual clients; perhaps you''ll lead fifty people in an
    enterprise effort to modernize a corporation''s intranet application—who knows,
    you''ll have to work with other developers. Trust me when I tell you you''ll not
    be a one-man army forever (or at all!). When working with others, it''s vitally
    you all have the exact same software setup in order to prevent excuses as "What
    do you mean broken? It works on my machine! With the instructions laid out in
    this book, you''ll understand what is necessary to set this up team-wide. Your
    team will thank you in the long run, even if you''ll initially slow down progress
    by making everyone adapt to these practices.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'With out of that way, what will we be learning in this time?


    # The What


    This book will, in great detail, explain what you need to do to prepare to start

    learning PHP (preparing for a start?), so let me explain.


    Most people, when they become interested in web development, randomly google

    for keywords and click the first results they find; “how to make a website,” “build

    php mysql tutorial,” and “learn to code,” the search queries will say. Inevitably,

    al most newbies end up downloading XAMPP or WAMP (installer tools that get

    PHP and associated packages set up on your machine), yet writing the legendary
    Hello World “app.” Without

    ail, this is where over 70% of the newbies are lost. XAMPP, WAMP, EasyPHP, and

    similar bundles that get you up and running fast are—while at first—deternrents
    in the long run. We''ll talk about this in more depth later chapters,

    suffice to say that while these bundles are easy to start, but hard to continue
    with,

    this book takes the exact opposite approach: more complex to start, easy to keep

    going.


    I''ll show you how to configure your development environment in such a way that

    you''ll be able to develop without worrying impacting anything on your

    computer or its operating system, and can share your code with others without

    concern about whether it will be compatible with their setup. What''s more, you''ll

    er able to build and test applications for various versions of PHP without needingnto
    reinstall anything: your different versions of PHP will never conflict, and you

    an even test your applications on different web servers as well.


    Your code will be cross-platform compatible, meaning you''ll be able to run it
    and

    keeping it anywhere you go, no matter which computer you land on or

    which operating system powers it. I''ll teach you about the powers of a good IDE

    (integrated development environment), explain the powerful concepts of application

    environments, show you the mysteries of virtual machines, and prepare you for
    the

    professional PHP world.


    If any of these terms sound intimidating or complex to you right now, don''t despair.

    We''ll cover all of them later on. You will understand everything, that''s a promise.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# The Who


    So, who is this book for?


    Developers of beginner to intermediate level will benefit from this book. Even
    for those familiar with some of the concepts, this book will hold some value.
    Remember, everyone you ever meet will know something you don''t. You can always
    learn more, even if most of it sounds familiar.


    If you are interested in improving your current development workflow and often
    find yourself confused by mixing PHP extensions or features while developing applications,
    and frequently running into errors about software you need but to install—this
    book is for you. If your computer is full of software used to make other people''s
    code run well on your machine, this book is definitely for you. By reading it,
    you''ll be able to restore your computer to an almost factory level of performance
    while keeping all apps you come compatible with it.


    If you''re just starting out with PHP, this book should be the very first resource
    you read. It will explain not only development environments and conflict prevention,
    but also the inner workings of web requests and what happens when you actually
    type an address into a browser''s address bar. You''ll learn why a server is important,
    what PHP''s role is, and how it fits into the grand scheme of development environments
    and setups that can help you achieve a smooth development experience.


    Note that this is a programming book, per se. There will be very little PHP coding
    in this book, at least until the end of it day. This book is a guide to setting
    up your computer so that it obeys, rather than the other way around. You want
    programming to be a pleasant, relaxing, and predictable experience you can train
    yourself in, day by day, rather than a source of endless frustration. This is
    what this book is forlaying the foundation for a pleasant programming career.


    # Conventions Used


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.'
  merge: -1
