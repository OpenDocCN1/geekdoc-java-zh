  md: '# Chapter 1


    # The Anatomy of Web Requests


    Before we get into the nitty-gritty of setting up a good PHP environment, you
    need an understanding of how web requests actually work. This chapter will explain
    what happens when you punch a web address into your browser and receive a result.
    We''ll avoid being too technical—there''s no need to explain the nuts and bolts,
    as it would it likely only confuse you. Instead, it will be a newbie-friendly
    explanation on how all the various aspects of web development and web consumption
    come together and create the Web you know and love. The main purpose of this chapter
    is to teach you where your programming language of choice (in this case, PHP)
    comes into play, and which parts of the mysterious web request it affects.


    If you know the essentials of the Web and are familiar with the terms mentioned
    in the previous paragraph, feel free to jump to the next chapter.


    # The Client and the Server


    You must have heard of the terms “client-side programming” and “server-side programming,”
    at least in job ads. In this part, we’ll briefly explain them before moving onto
    the details.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# What is a client?


    A client is your web browser.


    In the context of the Web, while you are technically the client in the conventional
    sense of the word (you are doing the requesting and being served by software),
    the browser is considered to be the client software used to ask the server for
    something.


    Once it receives this “something” (most often being a bunch of text), it decides
    how it should present it to you, the ultimate client.


    # What is a server?


    Similar to the client, a server also has two meanings:


    +   1. a program that answers questions posed by the client

    2. a computer (a physical machine) onto which the server program is installed


    In this book, and in the context of web development, we generally mean the server
    program on our own computer, essentially “taking the Internet” and letting the
    computer think the website we’re developing is online and accessible by everyone.

    in fact, throughout this book, we’ll learn how we can easily install a server
    program


    Let’s look at the first point bit more: how does a program answer questions?


    In a nutshell, a server waits for a question such as “give me the text of the
    blog post from February 14th” and responds with either “OK, here: [some HTML,
    containing the text oft the post in question] or “Sorry, I can’t find that, there’s
    nothing under February 14th.” Admitted, I’m paraphrasing, but that’s more or less
    what happens. I’ve illustrated it in Figure 1.1.'
  merge: -1
  pgno: 24
