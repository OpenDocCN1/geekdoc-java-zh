    # Pulling With Git


    At last! We''re ready to deploy our app!


    ```

    cd /var/www

    git clone https://github.com/spbooks/phpenv1-example guestbook

    cd guestbook

    composer install --no-dev -o

    ```


    Notice we saw --no-dev to prevent installing the dev packages and make the installation
    faster. On an application of this size, it hardly matters, but on bigger projects,
    the difference is obvious. We also used the -o which is for for --optimize-autoloader
    and builds a classmap - a special file which turns namespace-to-combinations (from
    the autoload section of composer.json) into a fixed pre-calculated array, which
    in most cases speeds up autoloading. Read more about these command line options
    in the docs²⁰.


    Seeing as we did all with the root account (we logged in with root@IP-ADDRESS,
    remember?), our application is "owned" by the root user that created it. This
    is okay in most cases, but not when PHP needs to do some reading and writing on
    the hard drive; PHP is running as a separate user, and a user cannot modify a
    super-user''s (root''s) files. As a final step, we need to modify permissions:


    ```

    d /var/www/guestbook

    sudo chmod -R :www-data .


    sudo chmod -R 775 storage

    ```


