  md: '# # What is Composer?


    Composer¹ is a package manager for PHP. We already defined a package as a collection
    of classes. So what''s a package manager, then?


    A package manager is a tool that removes the human element from the process of
    finding and installing packages or programs into an environment. If you''re using
    OS X, for example, there is a package manager for the OS called Homebrew. Rather
    than scour the Web in search of an application such as MPlayer, a media player,
    one can use the terminal to run the command:


    ```

    brew install mplayer

    ```


    Like magic, the application will be installed and instantly available. On Linux
    operating systems, there are several package managers. A popular one is Aptitude
    and is used in a similar fashion:


    ```

    sudo apt-get install chrome

    ```


    This command installs the latest Chrome browser, just like that.


    Package managers make sure packages (an application is a package—it''s a set of
    files working together towards a singular purpose, be it media playback, web browsing,
    or something else entirely) are installed cleanly, quickly, and safely.


    Similarly, in the context of programming languages (such as PHP), a package manager
    is used to retrieve, install, update, and uninstall packages. While the grunt
    work of setting up autoloading for classes without Composer is easy enough, Composer
    removes the process completely. It automates the manual process of finding a package
    online, downloading it, unzipping, putting it into your project''s folder, including
    it, configuring it, and so on.


    Composer ties into Packagist the de facto online directory of packages from users.
    Let''s explain what happens when you install a package with Composer.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Jump Start PHP Environment


    Installing packages with Composer is as easy as calling Composer''s require command
    while inside the folder of your application:


    ```

    composer require nesbot/carbon

    ```


    At this point Composer will, in order:


    +   1. Look at the argument require and determine that it is a valid package name.
    Note that package names use the normal forward slash (/).

    2. Look at its configuration (a special file called composer.json) for information
    on where to find nesbot/carbon. No information is found, so it will move to the
    next step.

    3. Go to Packagist and look up the entry for nesbot/carbon. If it''s there, it
    moves to the next step.

    4. Read the configuration of that package to find out if the package itself has
    dependencies (which are other packages it needs to do what it does). It starts
    the process for each of them before finishing nesbot/carbon.

    5. After dependencies have been installed, it downloads nesbot/carbon, updates
    an autoloader file (located in the main project''s folder, under vendor/autoload.php
    by default), and makes the newly installed package is usable in your application.


    To use this package, ensure that the aforementioned autoloader.php file is included
    in your app. This only needs to be done once, regardless of how many packages
    install. They''re all autoloaded with this one file:


    ```

    <?php

    include ''vendor/autoload.php'';

    ```


    This might seem a bit abstract, so let''s see it in action.


