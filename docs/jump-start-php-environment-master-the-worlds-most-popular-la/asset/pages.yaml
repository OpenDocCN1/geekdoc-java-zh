- img_proc: true
  md: 'For this purpose, a -dev option exists when calling composer require. For example,
    if I''m using a package called PHPUnit to write my unit tests, I would install
    it like so:


    ```

    composer require phpunit/phpunit --dev

    ```


    This places it in a special require-dev block in composer.json, rather than require,
    and ensures it stays out of the end user''s way when a package is installed with
    the --update-no-dev flag. For example, SitePoint\Authorization\User with PHPUnit
    for tests, but Jim just wants to use the package only—no need for tests. He installs
    it with:


    ```

    composer require sitepoint/auth-user --update-no-dev

    ```


    PHPUnit, however, is a tool which is useful across many projects, but installing
    for each one is wasteful, and it''s quite large. That''s where global comes in.
    The global option of the composer command will make sure it''s installed as a
    global package, instantly becoming available across the entire operating system
    we''re working on:


    ```

    composer global require phpunit/phpunit --dev

    ```


