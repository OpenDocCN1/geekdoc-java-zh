    # # Deployment


    Deployment is the act of sending a ready application to a live server so that
    it can be accessed by its target audience. It also includes pushing updates to
    an application online when a new feature is added or a bug is fixed.


    There are two types of deployment: manual and automatic.


    # # Manual


    Manual deployment involves actively recognizing the application is at a stage
    when it''s usable by the target audience, or at a stage matching the project specification—a
    document outlining the entire project''s development process.


    Once deemed ready, the developer takes one of several approaches to deploy the
    application:


    +   - FTP: in the ancient days of Web 1.0, File Transfer Protocol (FTP) was a
    way to transfer files (duh!) from one server to another. This approach is usually
    only seen in severely outdated systems and servers such as universities and schools,
    or shared hosting. Uploading files via FTP requires you to have an client installed
    on your computer as FileZilla or Cyberduck. You also need the credentials of the
    server—usually the server name, a username, and a password. If an application
    is already deployed and an updated one being deployed on top, the older one is
    usually overwritten, which opens the doors to a whole thorn of possible bugs.
    In regards to application deployment, there are better approaches and FTP should
    be avoided.


    > ⁹ https://filezilla-project.org/

    ¹⁰ https://cyberduck.io/?l=en'
