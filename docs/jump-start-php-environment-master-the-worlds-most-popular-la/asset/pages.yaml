  md: 'Practical aspects of automatic deployers are outside the scope of this book
    but, simply, this is how they work:


    +   1. You work on some code and then make a commit in Git.


    +   2. You add this commit to the master branch, the main branch of your repository.
    As a general rule, anything committed into the master branch is ready for production,
    aka deployment.


    +   3. A tool as Deployer notices this new commit to the master branch, automatically
    checks the code for common errors, and if everything is well it sends it for you
    without having to move a finger.


    The application code will be up to date and you''ve simply continued to code after
    your last commit without even needing to check. The tool did it for you.


    Fully automatic deployment of this kind can be risky, though. The tests in the
    application may not be robust enough, enabling some bugs to slip through because
    the application is unable to find its own errors.


    This is semiaut deployment comes into play—automatic, but with a human element.
    Once a developer ensures the release (the newest version of the app) is fine,
    you run a simple command such as `dep deploy` and the tool takes over the rest
    of the process: preparing the server, making pushes and pulls, clearing cache
    files, and so on. This is the best of both worlds; the machine does the heavy
    lifting, and the developer tells it to do it.


    So, of all these tools and approaches, what''s the best combination to use?


    # Recommendation


    I''d recommend using manual deployment with an intermediary GitHub repository,
    and using DigitalOcean for hosting, at least for the first few months. In time,
    you should definitely move towards automation—especially as more advanced concepts
    such as database migrations, cache busting, and file permissions come into play—but
    for now, this approach will benefit a newbie the most.'
