    and purpose of DNS servers—are better left unquestioned. If you''d still like
    to know what they are, they will be explained in the section “For Those Who Want
    More” at the end of this chapter in greater detail.


    In nutshell, this is how it works. Every domain on the Internet (like "example.com")
    is bound to a specific IP address (represented by the numbers on the signpost
    in the third frame of the comic). An IP address is a set of numbers identifying
    a given server; IP addresses tell the browser how to navigate the Internet to
    find the computer (server) it''s looking for.


    Remember longitude and latitude from geography classes? They specifically define
    a geographical point on planet Earth, and are cross-country compatible, meaning
    anyone anywhere will know how to find a location if you give them the latitude
    and longitude values; however, we also have a human-friendly description for the
    most popular coordinates. For example, the name of the town I went to university
    in Rijeka. Not many people know where to find it on a map, but if I give them
    the coordinates (45.3167° N, 14.4167° E), they can easily locate it. A DNS server
    is a translator, a guide. This server knows which IP addresses match domain name,
    and tells the browser where to go next.


    Once redirected to a specific IP address, the browser knocks on the door of the
    hosting server. This particular server was mentioned in the previous section,
    and we refer to it only as “the server.” The browser brings with it the information
    that the user requested and asks the server for an answer to the question “google.com?”.
    The server answers: “Yes, under google.com, the file says ...” and gives the answer.
    The browser returns to the user (the king) and conveys the information. This part
    is what''s important for developers developers—telling the server to give for
    a specific question. Remember this part.


