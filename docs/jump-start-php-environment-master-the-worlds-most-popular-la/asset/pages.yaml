- img_proc: true
  md: '# Hosting


    We''ll explain hosting first, as it''s important to know how to pick a home before
    you move into one.


    The three main types of hosting you''ll repeatedly encounter are: shared hosting,
    cloud hosting, and (virtual) private hosting. I''ll explain the parentheses "virtual"
    further on.


    # Shared Hosting


    When hosting companies have a single server (which can consist of either a single
    machine or acting as one), they make a separate folder and user account for each
    customer on this server; this is known as shared hosting. Each customer is allotted
    a part of the server''s processing power, a fraction of its total RAM, and a chunk
    of the hard drive space. This shard of resources can then be used as a home for
    your deployed application. A company might have several servers set up when one
    runs out of space to accommodate new users. This sounds great in theory, but in
    practice it has many problems.


    # Shared Hosting is Bad


    For lack of better (that is, cheaper and/or simpler) options, shared hosting was
    the only viable approach for many people for a long, long time. This kind of widespread
    use lead to its dominance of the hosting market, and it remains popular purely
    because of this initial inertia.


    Shared hosting is bad for several reasons:


    +   **Security risk:** many popular content management systems such as WordPress,
    Drupal, Joomla, and others ask the user to enable write-all access mode on certain
    folders so they may place their files in. In doing this, many users unwittingly
    allow access to their website''s files by mistake while sharing a hard drive with
    other customers. This so-called "777 problem" (where 777 is Linux code for "allow
    everyone to do everything on this file or in this folder") is a tremendous security
    risk. What''s more, when using content management systems on shared hosts, you''re
    at risk of outdated versions. One site''s laziness and unwillingness to update
    another instance of the installed CMS on the same server'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Deployment and Hosting 77


    can lead to your site being hacked, as it can become a gateway through which attackers
    gain access to the entire server!


    +   Traffic overload: You rely on other people''s competence and traffic. If a
    site on a given server has badly written code that uses many CPU cycles or eats
    a lot of RAM, other applications on the same server may suffer because of it;
    all applications are sharing the same hardware—which is quite limited in shared
    hosting environments—a user''s excessive needs may be detrimental to your own
    application. The same goes for well-written code with lots of traffic: if another
    site receives too much traffic, the server might get overloaded and shut down,
    taking your site down with it.


    +   Limits: a lot of shared hosting companies promise unlimited bandwidth and
    resources, this is almost never true¹. There is no such as “unlimited” anything:
    as soon as your site manages to breach an agreed-upon limit (be it regular CPU
    use, hard drive space, or bandwidth), you''ll be to discover what unlimited really
    means. Check out the following piece from WhoShHostingThis.com points out the
    pitfalls of shared hosting, and provides a cautionary tale about getting disconnected
    due to using too many resources on an unlimited plan².


    +   Reputation: when you''re on the same server as other customers, you all share
    an IP address. Any illicit activity done by others on the same server can reflect
    badly on you all. Imagine a customer sending millions of spam emails from a shared
    hosting server that you use. These emails are then picked by popular spam-hunting
    engines and the IP address is flagged as one that often spans people. Suddenly,
    all emails that your own application sends out are also flagged as spam in people''s
    inboxes, purely because the IP address is the same as that of the online spammer.


    These are some of the main issues around shared hosting. But there''s that''s
    arguably more important than all the others mentioned: shared hosting holds you
    back.


    ¹ http://myboringchannel.com/the-truth-about-web-hosting/


    ² http://www.whoishosting.com/blog/2010/08/09/the-cautionary-tale-of-the-frogpants-network-and-unlimited-hosting/'
  merge: -1
