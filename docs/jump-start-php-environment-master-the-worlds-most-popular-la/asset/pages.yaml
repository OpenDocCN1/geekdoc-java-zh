  md: '# Jump Start PHP Environment


    # Optimizing the database


    Often the slowest part of any website, the database can benefit from additional
    optimizations after it''s been running for a while and the bottlenecks (the parts
    that are the slowest because they''re unable to process the number of incoming
    requests fast enough) become apparent. Methods for database optimization include
    setting up indexes, splitting reads and writes, changing database engines, caching
    fetched data, and other mystical-sounding phrases.


    # Optimizing the front-end assets


    We mentioned compilation and building early—it''s how we optimize the website''s
    front end. When a website is shown to users, they see output comprised of images,
    HTML, CSS, and JavaScript, all of which need to be downloaded and executed in
    the browser as explained in Chapter 1. The smaller these files are—and the fewer
    the are—the faster a website loads. Often, a website will have multiple CSS files
    and multiple JavaScript files. Combining each type into one bigger CSS or JavaScript
    yields dramatic increases in a website''s download speed. Another front-end asset
    optimization trick often done is serving images via a content delivery network,
    or CDN, a third-party service that hosts your images for you and ensures that
    the visitor to your website downloads them from a server closest to them, thereby
    further increasing speed. One can also reduce image size, create an image sprite
    by placing images into one file, and more.


    # Optimizing the back end


    This is also a compiling/building step. Test files are ignored, and files are
    merged into bigger ones to use instead of a million smaller ones. Some PHP applications
    are even compiled into another'
