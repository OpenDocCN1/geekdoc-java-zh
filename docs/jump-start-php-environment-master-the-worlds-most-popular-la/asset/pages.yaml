  md: 'other, preferably identical, so that anything you develop will automatically
    run in production without any excessive configuration or additional debugging
    or tweaking.


    Achieving parity is very important for one''s workflow due to the enormous amount
    of time it saves. Avoiding having to do any additional work for your application
    to run in production means having the freedom and time to focus on important business-related
    problems that actually benefit your application''s context, rather than being
    stuck in a rut of constantly catch-up. Making a change in development and having
    to make two changes in production for that to become is tedious at best and detrimental
    to a project''s health at worst. You never know who on the team will slip up and
    cause the app to greet people with an error screen.


    The best way to achieve parity is by having the exact same software running in
    your development environment as you do in production environment. For example,
    if you''re aiming to deploy your application to production onto a server running
    the Ubuntu Linux version 14.04 operating system, it''s best that you develop on
