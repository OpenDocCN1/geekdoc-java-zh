    # Vagrant in a Nutshell


    Vagrant is an application that uses another application (in our case, VirtualBox)
    to create virtual machines with simple commands as vagrant up. Where punching
    in such commands would usually be tedious, error-prone, and incredibly-consuming
    (albeit possible!) in a VirtualBox-only world, Vagrant helps shorten the process
    to be up and running incredibly quickly.


    Vagrant knows what it needs to do with the help of a specific Vagrantfile, which
    contains all the instructions for how to set up the environment, making the process
    of creating a new virtual box simpler.


    # Vagrant Boxes


    Take, for example, your own computer. It has a plethora of installed applications
    and services, and probably a bunch of media in your home folder such as pictures,
    music, and so on. If you had the ability to package your entire machine''s collection
    of software into a single file, that when unpacked on another computer turns out
    a clone of your own machine, you would be building a box. This is what Vagrant
    boxes are: preconfigured Virtual machines with shells some pre-installed software
    (provisioned software—covered in the next section), making it easy to dive right
    into a project.


    All the various Vagrant boxes can be found at https://hashicorp.com/boxes/search.
    These boxes are preconfigured by other people and available to everyone for free.
    You can find anything from bare-bones operating system installations to fully
    configured environments that are compatible with specific software. You can use
    these preconfigured boxes, tweak existing ones, or build your own. For resources
    on this, please see the links at the end of this chapter.'
