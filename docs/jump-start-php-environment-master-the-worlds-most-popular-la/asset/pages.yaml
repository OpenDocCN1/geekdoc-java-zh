    # Shutdown


    The VM, while running, takes up a significant share of your host machine''s resources.
    In fact, if you look at Homestead.yaml, you''ll notice that it takes one CPU core
    and two gigabytes of RAM (lines two and three in the file). Leaving a VM while
    not in use is wasteful and slows down your host computer, powering it down (just
    like shutting down a computer when you leave the house, for example) makes sense.
    We do this by executing the vagrant halt command from the terminal while inside
    the homestead_improved-master folder. Alternatively, the vagrant suspend command
    can be used—it''s faster, but ends up eating a bit more hard drive space, even
    off.


    Let''s halt the machine. Inside the homestead_improved-master folder, run:


    ```

    vagrant halt

    ```


    To completely destroy the VM, wiping its hard drive and all the software installed
    after download, we execute vagrant destroy. To revive it and reinitialize the
    provisioning process, we can run vagrant again and all will be as it was. This
    is the beauty of Vagrant—destroying and rebuilding is only two commands away,
    lending itself perfectly to experimentation with even the most volatile cutting-edge
    technologies.


