    software, while **back-end development** (also called server-side development)
    deals with the server software.


    When a server returns text to your browser (in Figure 1.2), this is the text''s
    repeated to the king in the second-to-last frame and your browser presents it
    to you, how that text *looks* and in what ways you can *interact with it* front-end
    (or client-side) programming. When you open a website and a link is bold and a
    color to the text of that, which change in appearance was achieved with client-side
    programming (HTML plus CSS). When you can drag an element around the screen or
    initiate animations or sounds, it''s also achieved with client-side programming
    (specifically HTML and CSS accompanied by JavaScript.


    Server-side programming, or back-end development, is the action of configuring
    the server computer and program (see the section "What is a server?" for an explanation
    on this duality) to give back the appropriate data to the browser when asked.
    This typically means programming in a server-side language such as PHP. PHP will
    make some calculations or grab some data from a database, then it it that can
    be given to the browser, and the browser will take it and display it to the user.


    Even though all content returned to the server for delivery is actually stored
    on the server, we all CSS and JavaScript "client-side" because their calculations
    happen in the **browser**. For example, if I told JavaScript to animate a square
    turning into a circle, the math behind the calculation will be happening in the
    browser. The server will only provide the formula and tell the browser: "When
    you take this back to your king, say it like this..." On the other hand, server-side
    programming implies that all logic, calculations, formulas, and so happen on the
    server, merely returning the end result. For example, if I have a website that
    counts the number of images uploaded by a user (as Facebook counting the number
    of images in your album), this calculation will be done on the server, and only
    the final number will be given to the browser when it asks for this information.


    To recap: front end is when you write code that is executed in the browser (HTML,
    CSS, JavaScript), while back end is when you write code that is executed on the
    server before passing the final result onto the browser. PHP, server-side JavaScript,
    server-side Dart, Ruby, Python, and other programming languages fit the bill.


