    # Caching


    **Caching** is saving previously needed files and responses for later, with the
    expectation of them being requested again. If you ask the database for the total
    number of users in your database, it will count them and give you the number.
    If you make it save this number for later (that is, cache it), next time it is
    asked it can just grab the already prepared information. When you ask the server
    “What do I get if I visit myfile.com/user/5?”, it will tell you. If you tell it
    to remember the answer next time the question is asked, there’s no need for the
    server to look as it already knows. Caching is so important in web development—there’s
    a common saying that “cache is king.” It can mean the difference between life
    and death for your application when a huge surge of traffic suddenly happens.


    Debugging is tightly coupled with performance. Besides a nasty screen for your
    users, a bug in the code can cause execution locks, holdups in your code there
    should be none, repeated and unnecessary queries into your database, and more.


    So, how does one measure performance or find bugs? There are many tools for **profiling**
    PHP applications (that’s what finding bugs and measuring the performance of various
    aspects of your application is called). Two of the better ones are Z-Ray and Blackfire⁶
    (we won’t be covering them in this book as they are outside of its scope).


    ⁵ http://www.zend.com/en/products/server/z-ray


    ⁶ https://blackfire.io/getting-started'
