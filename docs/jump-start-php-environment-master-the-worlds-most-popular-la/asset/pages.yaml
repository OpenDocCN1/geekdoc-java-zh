    Figure 8.9. A universal socket adapter


    One beast such as the one in Figure 8.9 handles most of the world’s power sockets.
    Is it heavier than just carrying one laptop power brick and hoping your destination
    supports the required socket? Yes, but for a few additional grams, you have all
    the convenience of ten power bricks with a fraction of the weight. The adapter
    is an abstract for a power-providing service.


    The same happens with abstraction in software. We could learn how to communicate
    with Postre, SQLite, MySQL, MSSQL, and others. It would take a while, but it’s
    possible—just likeging around ten power bricks. Or we could rely on abstraction—letting
    the authors of the package we put between the database and us do the heavy lifting
    while we focus on usage.'
