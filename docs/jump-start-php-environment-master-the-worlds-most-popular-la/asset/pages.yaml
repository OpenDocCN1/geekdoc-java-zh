  md: '# Learn by Example: A Web App from Scratch 113


    Symfony components are also designed to be standalone, so if users adopt a custom
    approach or different framework, they can benefit from Symfony packages.


    var_dump is one such component. PHP has a built-in function called var_dump that
    outputs the contents of a variable onscreen. The var_dump component provides a
    dump function that does the same, but in a more readable manner and with lapser/expander
    buttons. We will demonstrate this shortly; for now, let''s install it:


    ```

    composer symfony/var-dump --dev

    ```


    The --dev option tells Composer to place it in the require-dev block of composer.json
    is because debugging helpers of this kind are typically used in development, rather
    than production. For packages that are required in production, we simply omit
    the --dev flag and they''ll end up in the require block, requiredev. The rule
    of thumb is: if a package is meant to be used only during the development phase
    of an app or another package, you can put it in require-dev (by omitting the --dev
    option). Then, when we deploy our app to production, we will be able to install
    with composer install no-dev, making the installation process much faster.


    As we''ve mentioned, PHP has a built-in "variable dumper”—the function var_dump⁶
    Let''s try it out with a PHP array. If you''re unsure what an array is, imagine
