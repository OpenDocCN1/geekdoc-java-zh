    # Testing


    In programming, there is a concept known as **testing**. While testing is outside
    the scope of this book (see the end of the chapter for links to further reading),
    I''ll explain it briefly.


    Whenever you make a change in one of your apps, you usually refresh the app in
    the browser to ensure the changes have been applied. This is called **manual testing**.


    There are tools that automate this process. By writing a specific set of instructions
    (*tests*), your application can test itself after every change. Writing these
    instructions can be complicated and time-consuming, but as an application grows,
    the time invested in writing tests pays off several times over. No longer does
    one need to, for example, click every link of a web page to make sure it works;
    the tests do this automatically, and outside of the traditional browser (with
    programs that simulate a browser-prone behind the scenes). This makes them much
    faster than humans and less error-prone (due to removing the human element).


    We''ll skip automatic testing in this chapter, as it would be too complex to explain
    (again, see the links at the end of the chapter for resources on testing). In
    general, no application—regardless of complexity—should be without tests if its
    purpose is to live longer than a few days or a few visitors (our demo app does
    not have these constraints).


    Our first manual test will be making sure we receive a blank page if we go to
    the http://guestbook.app URL in the browser, as shown in Figure 8.3.'
