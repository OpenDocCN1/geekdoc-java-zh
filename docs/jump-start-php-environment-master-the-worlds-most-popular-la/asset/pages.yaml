  md: '# The Anatomy of Web Requests


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_25_0.png)


    Web development is, in fact, a relatively simple matter of making the client ask
    the right questions, and teaching the server to give the right responses. Ready
    to go a little bit deeper into the rabbit hole? Here goes ...


    # Web Request Basics


    While web request has a very specific meaning, it is often used as a blanket term
    for the communication between the client and the server. This entire communication
    is neatly explained in Figure 1.2, a cute comic by VladStudio.¹


    ¹ http://www.vladstudio.com/wallpaper/?=how_internet_works


    Figure 1.1. A simplified request to the server and its response'
