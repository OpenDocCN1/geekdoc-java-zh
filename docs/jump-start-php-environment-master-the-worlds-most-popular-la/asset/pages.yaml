    # Deploying on DigitalOcean


    Time for the good stuff.


    On DigitalOcean, a VPS provider, you''re given the ability to create droplets.
    A droplet is a virtual private server that is very easy to tear down and rebuild,
    much like a Vagrant box, only performing much better. DigitalOcean bills you according
    to the resources a droplet spends, unless you intend to host a long running application,
    it makes sense to tear it down after you''re done with to conserve credits.


    An added benefit of this type of setup is that you don''t have to get a domain
    just to launch a site — DigitalOcean supports (as do most VPS hosts, as a matter
    of fact)


