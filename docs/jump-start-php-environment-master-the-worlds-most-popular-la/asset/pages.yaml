    Using this method, we''ll later redirect browser requests for http://mysite.com
    (which will be our application''s example domain) to our own computer''s server.
    This will enable us to easily test the development version of our site without
    deploying it.


    # Staging and Maintenance


    The staging environment is a separate server (or several servers) containing a
    copy—also known as a mirror—of production environment. The staging environment
    is often skipped in smaller companies or projects. It is designed to resemble
    the production environment as closely as possible, with matching versions of installed
    software, identical configuration values, and so on. Staging is for performing
    the final tests; for example, Facebook might redesign its front page, and before
    deploying it into production for all users to use, it would deploy to its staging
    servers so that employees (dedicated non-programmers also known as the quality
    assurance team) can test everything as if using it regularly. If everything goes
    well, the final deployment from staging to production happens.


    Staging is beyond the scope of this book, but it''s good to know about it. In
    the age of virtual machines and small throw-away projects, staging can be unnecessary,
    only coming into play with bigger long-term web applications.


    There is also maintenance mode, a term we must cover in this context. It''s a
    mode rather than an environment because the environment around the application
    doesn''t change—only the status of the application does. It''s usually just a
    switch on the'
