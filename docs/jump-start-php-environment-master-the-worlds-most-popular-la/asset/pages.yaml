  md: '# Jump Start PHP Environment


    The composer.lock file is used to list all the installed dependencies at a given
    time. The composer.lock file is committed (see Chapter 5) into your application''s
    repository along with all source code, and on the live server (when deploying).
    composer install looks for this file. If the command finds it, it will use the
    versions listed in this file—no matter how outdated! If there is no lock file,
    it will look for the newest versions of the required packages, generate a completely
    new composer.lock file, and proceed as usual.


    Why is this important?


    Imagine using PackageX v1.2 in your local development environment, testing your
    application, and after ensuring it works, deploying it to a live server. The time
    between your checks and the app being deployed, PackageX was updated to v1.3,
    which differs from v1.2 to no longer share some functionality. Maybe a method
    was renamed? Letting Composer determine the newest version on its own would install
    the latest version and make your app use a non-existent method, thus crashing
    the application. Disaster! That''s why composer.lock is there—to ensure the version
    that was used in development is what''s installed.


    So, how do we update the package to 1.3 if we actually want to? We use the composer
    update command.


    composer update looks at all the installed packages, regardless of the presence
    of a composer.lock file, updates both composer.json and composer.lock with the
    newest versions, and installs them. Typically, composer update is run only in
    development (not production); when you''re done everything with the latest version,
    the newly generated composer.lock is deployed with the app as usual, and composer
    install is run in production, ensuring only the versions locked by composer.lock
    are installed.


    # require-dev and global


    During development, it''s common to write unit tests for your code. A final version
    of your application/package, however, can omit those tests. Tests are for development,
    to make sure the code works. Including them in final versions of your work bloats
    the file size without any benefit to end users (though it is good for developers
    who want to contribute to your code).'
