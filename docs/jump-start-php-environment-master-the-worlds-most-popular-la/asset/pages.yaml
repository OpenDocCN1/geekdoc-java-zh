    # Repo and First Push


    At this point, we might as well put our project into version control and upload
    it to GitHub. Not only will this allow us to share our code with others, but also
    provide a layer of protection from critical hardware failures.


    First, create a repo on GitHub as done in Chapter 5. In my case, that''ll be https://github.com/spbooks/phpenv1-example.


    Then, in the root folder of our project (inside guestbook), run:


    ```

    git init

    ```


    Next, set up a basic .gitignore by downloading the contents of http://bit.ly/spignore
    or running:


    ```

    curl http://bit.ly/spignore -L > .gitignore

    ```


    If you''re curious about the above, curl is a program we use to retrieve the contents
    of a remote URL, like web pages in the terminal. Next comes the contents of which
    we want to retrieve, then the -L flag which tells curl to "follow redirects" in
    case the URL leads to another URL rather than the end content, and then >.gitignore
    tells it "write the output you get into .gitignore".


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_142_0.png)'
  merge: -1
  pgno: 142
