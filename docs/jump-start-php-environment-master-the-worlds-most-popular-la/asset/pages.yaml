    # Composer


    This chapter deals exclusively with Composer, the PHP package manager. If you’re
    familiar with the tool, feel free to move onto the next chapter.


    # Spaghetti Western


    Let’s talk about what led to the development of Composer in the first place.


    Back when PHP was first created, a “web application” consisted of individual files
    of PHP code which, when used in the right order, solved many of what was then
    modern development problems (submitting forms, writing to the database, and so
    on). If you had a file called file-a.php with a specific bit of logic and file-b.php
    with more logic, and you wanted to use them both, you would include them in yet
    another file, file-c.php.


    For example, say file-a.php has the code:'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Jump Start PHP Environment


    ```

    <?php

    $word1 = "Hello";

    ?>

    ```


    file-b.php has the code:


    ```

    <?php

    $word2 = "World";

    ?>

    ```


    You could use them in file-c.php like so:


    ```

    <?php

    include ''file-a.php'';

    include ''file-b.php'';

    ```


    echo "I am now using file-a and file-b, yay! {$word1} {$word2}";

    ?>


    This would output:


    > I am now using file-a and file-b, yay! Hello World!


    With more files, the includes grow larger and larger. It follows then PHP applications
    are mile-long invocations of these helper scripts, one after the other. We call
    this code spaghetti code because it''s a mess—one line intertwined with the next,
    no structure or order, a bit of logic calling another bit of logic that''s defined
    in an arbitrary external location. Spaghetti code is very hostile to other developers
    (or even the original developer a couple of months later!).'
  merge: -1
  pgno: 112
- img_proc: true
  md: '![](img/7d1d10ff700e0e770ae037aef1a8424a_113_0.png)


    Figure 7.1. Spaghetti mess


    With the advent of object-oriented PHP in version 5, we gained the ability to
    write blocks of code called **classes**. A class grouped together logic that belonged
    in a specific context. Specifically, in the realm of the Web, a *User* class could
    have the methods (aka internal functions, abilities) login and logout.


    In an application, using this class would allow a developer to implement login
    and log-out functionality. Classes could talk to other classes by **including**
    them just like the files above (for example, a User class could include a *Database*
    class in order to use it to check if the database contains the matching username
    and password combination), but has the added advantage of being transparent about
    their context. After all, it was very easy to find out what a certain class was
    intended to do by just looking inside its file, or even at its name alone.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Jump Start PHP Environment


    Different classes with related contexts are called a package (also known as a
    library). In the same package, one class could be dedicated to handling user logins
    and timeouts, another to sending “reset password” emails, yet another to checking
    the role of a user (admin, guest), and so on. The whole package could then be
    Authentication.


    But as classes proliferated, the problem of collisions appeared. If I had a class
    User and borrowed, for example, Jim’s User class, trying to use them at the same
    time to get the best of worlds would cause an error in PHP (maybe his User class
    also supported profile picture uploads, which mine lacked). Two classes cannot
    have the same name because PHP has no idea of the two classes to use! In PHP version
    5.3, this problem was solved with namespaces.


    # Namespaces and Ye Old Package Management


    A common feature in some other languages, namespaces found their way into PHP
    with version 5.3. They sound intimidating, but in reality they’re literally prefixes
    in front of PHP class names.


    The aforementioned User class by our buddy Jim would be called Jim\User (the backslash
    \ is special notation used to separate fragments of namespaces; this allows namespaces
    to be nested into an arbitrary number of levels), while ours could be called SitePoint\Authentication\User.
    While their final “name” is the same (User), their fully qualified names are different,
    and PHP is happy to let us use both at the same time.


    But still, using several packages and classes means we have to include them all,
    just like the previous example—calling the others by filename, making sure they’re
    summoned for use. There are some ways around this, course—special functions called
    “autoloaders” were developed for classes in locations based on their names (for
    example, Jim\User could be in classes|Jim\User.php); however, it is still tedious
    to not find other people’s classes, but also effectively include them and make
    them conform to the autoloader function in use.


    To solve this problem, we use a tool Composer.'
