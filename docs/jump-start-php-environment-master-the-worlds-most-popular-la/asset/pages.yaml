  md: '# Jump Start PHP Environment


    by Nginx (another server program that''s competition to Apache, pronounced "engine
    x"). Uh-oh, what now?


    We could update PHP to a newer version and check whether app1 still works, how
    do we not keep developing accidentally using code that''s unavailable in PHP 5.3
    if our entire computer is now running 5.6? Likewise, we could upgrade MySQL to
    5.1 and check that it still works, but how do we know MySQL didn''t throw out
