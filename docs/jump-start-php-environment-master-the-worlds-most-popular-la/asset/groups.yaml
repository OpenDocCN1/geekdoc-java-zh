    # 配置准备 (Provisioning)


    配置工具（Provisioner）是一种用于在机器上（无论是否已安装）自动安装先决软件的工具。配置工具也经常用于生产服务器，以使其符合待部署应用程序的要求。一些流行的配置工具包括
    Ansible、Puppet² 和 Chef³。配置工具接受一个“配方”（recipe），即一份为应用程序准备环境所需的所需的步骤列表。


    例如，假设我们要构建一个 PHP 应用程序，我们可以让配置工具在一个空白的 Vagrant 实例上为我们执行以下操作：


    - 安装 Git

    - 安装 PHP

    - 安装某些 PHP 扩展

    - 安装 MySQL

    - 设置默认的 MySQL 用户名和密码

    - 下载示例数据库数据并将其导入 MySQL


    手动完成所有这些操作是枯燥且容易出错的。配置工具具有强大的能力，可以为我们处理操作系统之间的差异，因此它们可以在我们的虚拟机、生产服务器、测试服务器等上运行。它们始终执行相同的操作并产生相同的结果：运行应用程序所需的先决条件将由它们处理好。


    Vagrant 与各种配置工具紧密集成，并利用它们来设置我们要求其设置的环境。因此，在启动 Vagrant 实例时，会先启动虚拟机，然后运行指定的配置工具。此时不需要了解配置工具，但在本章末尾会有指向某些相关资源的链接。在本章的实验中，我们将使用一个预先配置好的
    Vagrantfile 以及一个已经预先配置好的配置脚本，以保持简单并对新手友好。


    ¹ http://www.ansible.com/

    ² https://puppetlabs.com/

    ³ https://www.chef.io/chef/


    # 快速启动 PHP 环境


