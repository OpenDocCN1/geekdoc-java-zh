    your database or test the code on your remote server (for example, a company''s
    server at headquarters while you''re at home) to ensure it will work fine Monday
    morning


    And much, much more.


    So, which IDEs are a good option for PHP development?


    In my own order of preference:


    # PhpStorm


    PhpStorm⁵ is a commercial IDE, meaning it''s neither open source free, but it''s
    well worth the price. It offers everything that''s been mentioned above and more,
    and works on all operating systems flawlessly, whether you''re on Linux, Windows,
    or Mac OS X. It has been written about SitePoint extensively⁴ if you''d like to
    see reviews, handy shortcuts, hacks to become more efficient, other people''s
    approaches, and JetBrains—the company who makes it—also tends to give free licenses
    now and then, and you can qualify for by maintaining an open-source project. Alternatively,
    keep an eye out for surveys and reviews on SitePoint''s channel⁵ as we sometimes
    give out licenses.


    Commercial support means quick responses from the support team, rapid development
    (updates come regularly with many new features), and a guarantee of continued
    maintenance. Note that PhpStorm allows for a 30-day trial, and if you''re still
    to be convinced after a month, they''ll often extend your trial license.


    ³ https://www.jetbrains.com/phpstorm/

    ⁴ http://www.sitepoint.com/tag/phpstorm/

    ⁵ http://sitepoint.com/php'
- md: "\n# Jump Start PHP Environment\n\n**Pros:** very fast, feature-rich, stable\
    \ (never crashes), cross-platform support\n\n**Cons:** costs money, can be resource-intensive,\
    \ and is unfriendly to older computers. See requirements at https://www.jetbrainsbrains.com/phpstorm/help/system-requirements-and-installation.html.\n\
    \n# NetBeans\n\nNetBeans$^6$, an open-source IDE, sports almost all the features\
    \ of PhpStorm and is its nemesis. I had NetBeans for two years transitioning to\
    \ PhpStorm, and I recommend it to everyone who needs a good IDE but isn't prepared\
    \ to pay for a commercial one.\n\nNetBeans is slightly slower than PhpStorm and\
    \ more resource-intensive. It is cross-platform, relatively stable, and very reliable.\
    \ The group behind it was acquired by Oracle, and some see this as a bad omen,\
    \ I feel it only cements the reliability of the current version.\n\n**Pros:**\
    \ free, feature-rich, reliable, cross-platform, open source\n\n**Cons:** Oracle-owned,\
    \ lacks commercial support, slower to adopt new features\n\n# Zend Studio\n\n\
    Zend Studio$^7$ is made by the company \"in charge\" of PHP (though, it's been\
    \ acquired by Rogue Wave software, whose name may appear in places where Zend\
    \ used to be). Zend is the company who first brought PHP into existence, and who\
    \ provide official certification for the language.\n\nZend Studio is a commercial\
    \ IDE that's a bit pricier than PhpStorm, but it offers a free trial so you can\
    \ give it a spin before committing to it. It many of the same features of PhpStorm\
    \ and NetBeans, with some exceptions, as well as some of tools. For easier mobile\
    \ app development (available in Netbeans and PhpStorm via plugins) are built into\
    \ Zend Studio, and its own Apility platform (a service for creating APIs based\
    \ on their Zend Framework) has a native Zend Studio driver, too. Don't worry if\
    \ you're unfamiliar with any of these terms, they'll be covered later in the book.\n\
    \n> $6$ https://netbeans.org/\n\n> $7$ http://www.zend.com/en/products/studio\n\
    \nAnother perk is the built-in support for ZendServer—a kind of server program\
    \ used to run your PHP application and provide various analyses on running code\
    \ and advanced debugging capabilities. Zend Server is a paid product, though,\
    \ if you want to use it in Zend Studio you'll need to purchase a license. There's\
    \ some basic information about Zend Server here: http://www.sitepoint.com/getting-know-zend-server/\n\
    \nIf your goal is to become the “official” PHP developer you can be, with certificates\
    \ and a total knowledge of officially endorsed tools and services, Zend Studio\
    \ is right for you. Otherwise, I'd recommend either of PhpStorm or NetBeans.\n\
    \n- **Pros:** great commercial support due to being owned by Zend; feature-rich,\
    \ cross-platform, and integrates with other Zend products nicely\n- **Cons:**\
    \ expensive, resource-intensive, and unstable; can be slow\n\nHere are some other\
    \ options you can research at your own leisure, a mix of commercial and free:\n\
    \n- Komodo IDE: http://komodoide.com/\n- Eclipse with PDT: https://eclipse.org/pdt/\n\
    - Aptana Studio: http://www.aptana.com/\n- phpDesigner: http://www.mprosoftware.dk/phpdesigner.php\n\
    \nThere’s also a list, ordered by popularity, at http://www.sitepoint.com/best-php-ide-2014-survey-results.\n\
    \nWhichever IDE you choose, stick with it for a couple of months. The learning\
    \ curve is often high, and you might feel overwhelmed by all the options when\
    \ you first using it. In time you'll become used to everything it offers, even\
    \ if you'll only be using 10% of its functionality in your first 100 days of code.\
    \ There's nothing wrong with switching IDEs at a later date, but give each one\
    \ you try a reasonable chance.\n\nAt this point in time, it is unnecessary to\
    \ download and install an IDE. This book is very light on code, and you'll only\
    \ need one when we reach the later chapters.\n\n# 20 Jump Start PHP Environment\n\
    \n# Beware IDEs with WYSIWYG\n\nOne IDEs do not and should provide WYSIWYG (What\
    \ You See What You Get) editing. Dreamweaver, an IDE by Adobe, is one such tool.\
    \ It's famous for letting you get started easily because it allows you to pull\
    \ in elements from a toolbar and drop them visually onto the screen, helping you\
    \ “build code” as if playing with Lego blocks. The code that it generates is often\
    \ suboptimal and bloated, containing more code than necessary and slowing a website\
    \ down. What's more, by skipping the real code part, you're effectively holding\
    \ yourself back. You'll be unable to read anyone else's code, and you'll have\
    \ a far tougher time to learn to solve your own problems.\n\nDreamweaver is not\
    \ the only WYSIWYG editor, but it's far by the most popular one. If you run into\
    \ an IDE that supports WYSIWYG, I wholeheartedly recommend you run in the opposite\
    \ direction.\n\n# The Importance of Coding Standards\n\nCoding standards are rules\
    \ applied to code so that it's consistent across the entire project. For example,\
    \ if Jim writes code this way:\n\n```\nif ($purchaseWasCompleted)\n  $this->succeed();\n\
    else\n  $this->error();\n```\n\nBut Mike writes code like this:\n\n```\n($purchaseWasCompleted)\
    \ ? $this->succeed() : $this->error();\n```\n\nand Joanna writes it as follows:\n\
    \n```\n$pwc = $purchaseWasCompleted;\nif ($pwc)\n{\n$this->succeed();\n} else\
    \ {\n$this->error();\n}\n```\n\nMuch more readable, isn't it? And all it took\
    \ some blank lines and spacing—that’s more or less everything a coding standard\
    \ does. Trivially simple, but vitally important. Standards also dictate other\
    \ aspects, such as uppercase/lower-case letter conventions when naming classes\
    \ and variables (notice the uppercase Test in the previously mentioned code);\
    \ the position of curly braces in logic constructs such as if, for, and others;\
    \ and more.\n\nWe strongly recommend using PSR-2. It's the vast majority of high-quality\
    \ projects out there, making your coding style instantly compatible with that\
    \ of many many developers. It will also prepare you for reading their code fluently.\
    \ With an IDE, this becomes incredibly easy. For example, in PhpStorm, you would\
    \ go to File > Settings > Editor > Code Style, and select PSR1 (PSR-2 improves\
    \ upon PSR-1, so this option applies both). Note: depending on your version of\
    \ PhpStorm, you might also have to select Set From in the Code Style windows.\
    \ In other IDEs, it’s as simple as googling for the phrase “PSR-2 in EDITOR” where\
    \ EDITOR is your IDE of choice. It will yield a plethora of results.\n\n```\n\
    class Test {\n    protected $name;\n    public function __construct($name) {\n\
    \        $pointlessSum = 3+4;\n        if ($name)\n            $this->name = $name;\n\
    \        else\n            $this->name = \"Default\";\n    }\n    public function\
    \ echoName() {\n        echo $this->name;\n    }\n}\n```\n\nwould be reformatted\
    \ to look like this:\n\n```\nclass Test\n{\n    public function __construct($name)\n\
    \    {\n        $pointsSum = 3 + 4;\n        if ($name) {\n            $this->name\
    \ = $name;\n        } else {\n            $this->name = \"Default\";\n       \
    \ }\n    }\n\n    public function echoName()\n    {\n        echo $this->name;\n\
    \    }\n}\n```\n\n⁸ http://www.php-fig.org/psr/2/\n⁹ Don't worry if you don't\
    \ understand this code, it's just for demonstration purposes.\n\n# The Command\
    \ Line / Terminal\n\nFinally, let’s briefly look at the command line or terminal.\
    \ First, a clarification on the terminology.\n"
  mdcn: "\n\n# 快速上手 PHP 环境\n\n**优点：** 速度极快、功能丰富、稳定（从不崩溃）、支持跨平台\n\n**缺点：** 需要付费、可能消耗大量资源、且对旧电脑不友好。详情请访问\
    \ https://www.jetbrainsbrains.com/phpstorm/help/system-requirements-and-installation.html\
    \ 查看要求。\n\n# NetBeans\n\nNetBeans$^6$ 是一款开源 IDE，它拥有 PhpStorm 的几乎所有功能，并堪称它的宿敌。我使用了两年的\
    \ NetBeans 后转到了 PhpStorm，我向每一位需要优秀 IDE 但还没准备好为商业版付费的人士推荐它。\n\nNetBeans 比 PhpStorm\
    \ 慢一点，消耗的资源也更多。它是跨平台的，相对稳定且非常可靠。它背后的团队被 Oracle 收购，有些人认为这是一个不吉利的预兆，但我认为这只会巩固当前版本的版本的可靠性。\n\
    \n**优点：** 免费、功能丰富、可靠、跨平台、开源\n\n**缺点：** Oracle 拥有、缺乏商业支持、采用新功能较慢\n\n# Zend Studio\n\
    \nZend Studio$^7$ 由“主导” PHP 的公司制造（尽管它已被 Rogue Wave software 收购，该公司的名字可能会出现在以前\
    \ Zend 所在的地方）。Zend 是第一个创建 PHP 的公司，并为该语言提供官方认证。\n\nZend Studio 是一款商业 IDE，比 PhpStorm\
    \ 稍微贵一点，但它提供免费试用，所以你可以在决定购买之前尝试一下。它拥有 PhpStorm 和 NetBeans 的许多相同功能（某些除外），以及一些工具。Zend\
    \ Studio 内置了更简单的移动应用开发功能（NetBeans 和 PhpStorm 通过插件提供），它自己的 Apility 平台（一种基于其 Zend\
    \ Framework 创建 API 的服务）也有原生的 Zend Studio 驱动程序。如果你不熟悉这些术语，不要担心，书中稍后会详细介绍。\n\n>\
    \ $6$ https://netbeans.org/\n\n> $7$ http://www.zend.com/en/products/studio\n\n\
    另一个好处是内置对 ZendServer 的支持——这是一种用于运行 PHP 应用程序并对运行代码提供各种分析和高级调试能力的服务器程序。不过，Zend Server\
    \ 是付费产品，如果你想在 Zend Studio 中使用它，就需要购买许可。这里有关于 Zend Server 的一些信息：http://www.sitepoint.com/getting-know-zend-server/\n\
    \n如果你的目标是成为最“官方”的 PHP 开发者，拥有证书并对官方认可的工具和服务有全面的了解，那么 Zend Studio 非常适合你。否则，我推荐使用\
    \ PhpStorm 或 NetBeans。\n\n- **优点：** 由于由 Zend 拥有，具有极佳的商业支持；功能丰富、跨平台，并与其他 Zend 产品良好地集成\n\
    - **缺点：** 昂贵、消耗资源、且不稳定；运行可能较慢\n\n以下是一些你可以根据空闲自行研究的其他选项，混合了商业版和免费版：\n\n- Komodo\
    \ IDE: http://komodoide.com/\n- Eclipse 带 PDT: https://eclipse.org/pdt/\n- Aptana\
    \ Studio: http://www.aptana.com/\n- phpDesigner: http://www.mprosoftware.dk/phpdesigner.php\n\
    \n在 http://www.sitepoint.com/best-php-ide-2014-survey-results 还有一个按流行程度排序的列表。\n\
    \n无论你选择哪种 IDE，请坚持使用几个月。它的学习曲线通常很高，刚开始使用时，可能会对所有选项感到不知所措。随着时间的推移，你会习惯它提供的一切，即使你在代码的前\
    \ 100 天里只使用了它 10% 的功能。以后切换 IDE 并没有问题，但请给你尝试的每一个 IDE 一个合理的机会。\n\n在目前，没有必要下载和安装\
    \ IDE。这本书的代码量很少，只有当我们进入后面的章节时你才需要一个。\n\n# 20 快速上手 PHP 环境\n\n# 注意：带有 WYSIWYG 的\
    \ IDE\n\n并不是所有 IDE 都且应该提供 WYSIWYG（所见即所得）编辑。Adobe 的 IDE Dreamweaver 就是其中一种工具。它因让你能够轻松上手而闻名，因为它允许你从工具栏拉入元素并视觉化地拖到屏幕上，帮助你像玩乐高积木一样“构建代码”。它生成的代码通常不是最优的且臃肿的，包含了比需要更多的代码并会减慢网站运行速度。此外，通过跳过真正的代码部分，你实际上是在限制自己。你将无法阅读任何人的代码，而且在学习解决自己的问题时会困难得多。\n\
    \nDreamweaver 不是唯一的 WYSIWYG 编辑器，但它是最受欢迎的一种。如果你遇到支持 WYSIWYG 的 IDE，我全心建议你向反方向运行。\n\
    \n# 编码规范的重要性\n\n编码规范是应用于代码的规则，以使其在整个项目中保持一致性。例如，如果 Jim 这样写代码：\n\n```\nif ($purchaseWasCompleted)\n\
    \  $this->succeed();\nelse\n  $this->error();\n```\n\n但 Mike 这样写代码：\n\n```\n($purchaseWasCompleted)\
    \ ? $this->succeed() : $this->error();\n```\n\n而 Joanna 如下所示写：\n\n```\n$pwc =\
    \ $purchaseWasCompleted;\nif ($pwc)\n{\n$this->succeed();\n} else {\n$this->error();\n\
    }\n```\n\n可读性好得多，不是吗？而且这只需要空行和间距——这就是编码规范所做的。简单但至关重要。标准还规定了其他方面，例如类和变量命名的大小写规则（注意前面代码中大写的\
    \ Test）；逻辑结构（如 if、for 等）的大括号位置；以及更多。\n\n我们强烈建议使用 PSR-2。它是目前大多数高质量项目的标准，使你的编码风格与许多开发者保持一致。它还将让你能够流利地阅读他们的代码。有了\
    \ IDE，这变得异常简单。例如，在 PhpStorm 中，你会进入 File > Settings > Editor > Code Style，并选择 PSR1（PSR2\
    \ 基于 PSR1，所以此选项适用于两者）。注意：根据你的 PhpStorm 版本，你可能还需要在 Code Style 窗口选择 Set From。在其他\
    \ IDE 中，只需搜索短语“PSR-2 in EDITOR”，其中 EDITOR 是你选择的 IDE。这将产生大量结果。\n\n```\nclass Test\
    \ {\n    protected $name;\n    public function __construct($name) {\n        $pointlessSum\
    \ = 3+4;\n        if ($name)\n            $this->name = $name;\n        else\n\
    \            $this->name = \"Default\";\n    }\n    public function echoName()\
    \ {\n        echo $this->name;\n    }\n}\n```会被重新格式化为像这样：\n\n```\nclass Test\n\
    {\n    public function __construct($name)\n    {\n        $pointsSum = 3 + 4;\n\
    \        if ($name) {\n            $this->name = $name;\n        } else {\n  \
    \          $this->name = \"Default\";\n        }\n    }\n\n    public function\
    \ echoName()\n    {\n        echo $this->name;\n    }\n}\n```\n\n⁸ http://www.php-fig.org/psr/2/\n\
    ⁹ 如果你不懂这些代码请担心，它们仅用于演示。\n\n# 命令行 / 终端\n\n最后，让我们简要查看命令行或终端。首先，对术语进行说明。\n\n"
