    \n# Git 实战\n\n让我们通过一个实际示例来学习。我建议（并假设）你将项目放在主目录中，该路径的快捷方式是 `~`。如果你选择使用不同的路径，请调整后续的代码。\n\
    \n# 准备环境\n\n正如我们在之前的章节中所做的那样，我们首先需要配置一个用于实验的虚拟机（VM）。我们可以在宿主机上进行所有操作，但请记住最终目标是尽可能保持宿主机整洁，同时使用一个完全可以丢且便于实验的环境来进行所有的尝试。以下是操作步骤：\n\
    \n- 1. 在 Windows 上打开 Bash 或在 OS X/Linux 上打开 Terminal。\n- 2. 执行命令 `cd ~` 进入你的主目录。\n\
    - 3. 使用命令 `git clone https://github.com/swader/homestead_improved hi_phpenv` 将\
    \ homestead_improved 仓库克隆到名为 `hi_phpenv` 的文件夹中。你刚刚学会了 git clone 命令！\n- 4. 使用 `cd\
