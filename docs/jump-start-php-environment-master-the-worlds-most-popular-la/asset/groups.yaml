    # 性能与调试


    我们要涉及的应用程序环境最后一个方面是确保应用是快速的（性能）且无错误的（调试）。这一部分完全是理论性的；它只是让你在以后我们遇到某些术语时知道预先会有什么。


    性能通过各种优化方法实现。与该词的含义相反，在应用开发中，优化通常有多个层次，很少是那种能立即带来完美解决方案的更改。性能包括但不限于几个领域：


    # 优化数据库


    数据库通常是任何网站最慢的部分，在运行一段时间后如果瓶颈（由于无法足够快地处理进入的请求而变慢的部分）变得明显，它可以从额外的优化中获益。数据库优化方法包括设置索引、读写分离、更改数据库引擎、缓存获取的数据，以及其他听起来很神妙的术语。


    # 优化前端资源


    我们早期提到了编译和构建——这是我们优化网站前端的方式。当网站显示给用户时，他们看到的是由图像、HTML、CSS 和 JavaScript 组成的输出，正如第
    1 章所述，所有内容都需要在浏览器中下载并执行。文件越小——数量越少——网站加载得越快。通常，一个网站会有多个 CSS 文件和多个 JavaScript 文件。将每个类型合并成一个较大的
    CSS 或 JavaScript 文件可以显著提高网站的下载速度。另一种经常执行的前端资源优化技巧是通过内容分发网络（CDN）提供图像，这是一种第三方服务，它为你托管图像并确保网站访问者从距离他们最近的服务器下载图像，从而进一步提高速度。人们还可以减小图像大小、通过将图像放入一个文件中创建图像精灵（sprite）等。


    # 优化后端


    这也是编译/构建步骤。测试文件被忽略，文件被合并成更大的文件。


    # 应用程序环境


    **缓存**是保存以前需要的内容以备后之用。如果你询问服务器，它会进行计数。如果你更改了程序，你可以轻松地运行此测试（它仍然在那里）并检查这种转换是否正常。


    那么，如何衡量性能或发现错误？有很多工具可以进行**性能分析**（profiling，这就是查找错误）。两个更好的工具是 Z-Ray 和 Blackfire。缓存在
    C++ 等语言中非常重要。


