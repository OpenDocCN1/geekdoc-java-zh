    # Jump Start PHP Environment


    # Alternatives\Git is far from being the only VCS. There are others such as Mercurial,
    SVN, CVS and many, many, more, but Git is the most widely used. It is the VCS
    to use if you want to contribute open-source projects today, as the vast majority
    of them use it. It is also what most powers GitHub, so you''ll be part of the
    pack from the get-go.


    # GitHub


    When using Git, you have the ability to clone repositories from any remote endpoint,
    provided the code is there. For example, if I have some source code and I put
    it on a live server (one accessible to the Internet), then configure this server
    to accept Git calls, anyone who has Git installed can clone this code by running:


    ```

    git clone https://myserver/myrepo.git

    ```


    However, not everyone has the time, money, know-how, or patience to set up a server
    to host code for others to access. This is where GitHub comes in.


    GitHub is a website on which people can host their repositories for free, but
    there''s a catch—all repositories are immediately accessible to everyone. They''re
    public. Private repositories are supported, but cost money. This is ideal when
    developing projects for clients that should be kept private—especially from the
    client''s competition. For free private repos, there are alternative websites
    such as GitLab and Bitbucket, but those are not nearly as popular as GitHub, hence
    why we''ll use GitHub in this book. In your adventures, feel free to use any service
    you like.


    But why anyone want to use a service like GitHub for their code? Apart from the
    obvious answer of being able to share your code with others easily and for free,
    services such as GitHub can be lifesavers when your project dies and you lose
    all its content. If you regularly pushed (a Git term for “upload”) to the repository''s
    remote—meaning GitHub URL—you''re safe from disaster: your entire'
  - '[PAGE 85]


