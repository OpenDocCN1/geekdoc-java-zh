    ### Machine Pollution


    Whenever you install software as an AMP stack on your computer, it dies. If you
    delete the software later, traces remain—often in the form of registry entries
    in Windows or file dust on Linux. In fact, this is especially apparent on Linux.
    While Windows and OS X applications are installed in an application folder with
