    # Hello World\nThis is a README file from the Jump Start PHP Environment book.\n\
    Learning about Git and GitHub!\n```\n\nThe .md extension indicates that this is\
    \ a Markdown (MD) file—one type of GitHub uses to display the readme content in\
    \ a pretty, formatted manner. Knowing MD is not necessary in order to understand\
    \ the rest of the content in the book; however it is important in coding life,\
    \ I recommend you to use a look at https://guides.github.com/features/mastering-markdown\
    \ when you find the time.\n\n# Adding and Committing\n\nTo add all the files in\
    \ our project to our repository, execute git add -A. The add command tells Git\
    \ to add any changes that were made to the repo's history track. A -a flag means\
    \ “add new files, add changes to existing files, and add file deletions (that\
    \ is, make note of all the files that were removed).\n\nWhat this actually did,\
    \ though, was merely told that Git we will be tracking the changes to all the\
    \ files it added some time in the future. To actually make a commit, and by create\
    \ a restorable point in our project's life cycle, we need to use the commit command:\
    \ git commit -m 'Added my first files'! The m means “commit message” and it's\
    \ where you label your changes. Anyone coming into your project will be able to\
    \ look at that exact point in time and see your message, instantly knowing why\
    \ you did what you did. Execute this now.\n\nNow that our files are added and\
    \ committed, let's introduce a change. Open index.php again and change “Hello\
    \ World” to “Hello Bob” so that the file looks like this:\n\n```\n<?php echo \"\
    Hello Bob\";\n```\n\nThen make another add and commit: first git add -A, then\
    \ git commit -m 'Changed World to Bob'.\n\nVisit the page in the browser using\
    \ http://phpenv.app/ and notice how it now says “Hello Bob.”\n\n# Reset\n\nWe\
    \ really like Bob, but our boss doesn’t, and asks us to change it back to “World.”\
    \ We could make a change and commit, and be done with it. But in complex projects\
    \ with many files, reverting changes by manually changing files back to the state\
    \ they were in before will just fail to work. That’s why we have the reset command.\
    \ To reset back to the previous commit, we need to find out the ID of that commit.\n\
    \nWe can do this with:\n\n```\ngit log\n```\n\nIn my case, as you can see in Figure\
