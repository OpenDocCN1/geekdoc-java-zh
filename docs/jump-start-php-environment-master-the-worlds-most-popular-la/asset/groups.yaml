    \ will focus on the application environment. We'll also discuss *AMP bundles such\
    \ as XAMPP and why they're a poor choice: production /development parity; and\
    \ performance and debugging.\n\nIf you're familiar with all these terms, feel\
    \ free to skip this chapter.\n\n# ## Application Environments\n\nThe **application\
    \ environment** is the term used to describe the environment your application\
    \ can find itself during various stages of its life cycle: the production environment,\
    \ the development environment, and the staging environment.\n\nThe word **environment**\
