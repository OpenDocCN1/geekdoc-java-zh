    ```bash

    echo "# Hello World" >> README.md

    git add README.md

    git commit -m "first commit"

    git remote add origin https://github.com/USERNAME/phpenv.git

    git push -u origin master

    ```


    `remote add` 命令告诉你的本地仓库远程服务器的位置。`-u` 标志将本地分支跟踪远程分支，将来你只需要输入 `git push`。


