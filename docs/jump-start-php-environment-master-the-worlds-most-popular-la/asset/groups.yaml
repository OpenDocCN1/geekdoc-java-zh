    + V (CMD + V on a Mac). Then, edit the following lines:


    +   - change the value of server_name for a name (guestbook.app) to the IP of
    the droplet

    - change the value of root to /var/www/guestbook/public


    The var/www/ folder is the location that''s typically used to host applications
    on Linux. Use insert mode with Esc, exit the file by typing :x and pressing Enter.


    Then, reboot Nginx with:


    ```

    sudo service nginx restart

    ```


    # Encountering Issues


    If you run into problems like a fully white screen, or a cryptic error, check
    the error logs by running tail -f /var/log/nginx/guestbook.app-error.log. Tail
    outputs the “tail” of a file (its last 10 lines) and -f tells it to “watch this
    file'
