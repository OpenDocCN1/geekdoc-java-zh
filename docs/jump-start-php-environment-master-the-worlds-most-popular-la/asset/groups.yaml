    ## Generating Answers with Server-side Languages


    The last of of rabbit hole is what you''re looking for. Let''s say:


    - The server checks whether there''s anything already prepared under the route:

    - If no files found, it''s configured to ask PHP.

    - The server asks: "Can you find anything under the route?"

    - PHP activates and looks through its routes, fails to unearth anything.

    - It returns a "404 Page not found" error to the server (which is then given to
    the browser).

    - Many such status codes exist, but there''s no need to know them all in this
    phase of your.


    - The server receives the 404 message and thinks “Hmm, PHP locked out. Well, it
