    or something else entirely) are installed cleanly, quickly, and safely.


    Similarly, in the context of programming languages (such as PHP), a package manager
    is used to retrieve, install, update, and uninstall packages. While the grunt
    work of setting up autoloading for classes without Composer is easy enough, Composer
    removes the process completely. It automates the manual process of finding a package
    online, downloading it, unzipping, putting it into your project''s folder, including
    it, configuring it, and so on.


    Composer ties into Packagist the de facto online directory of packages from users.
    Let''s explain what happens when you install a package with Composer.'
