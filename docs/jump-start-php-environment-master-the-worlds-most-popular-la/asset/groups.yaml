    # Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_26_0.png)


    # How It All Works


    Let''s break the comic in Figure 1.2 down.


    You are the user—you are the king. You issue the commands and the browser obeys,
    happily. As the user, this is where your awareness of the process ends, and the
    next time you''re consciously addressed is in the second-to-last frame of the
    comic. The entire process in between is invisible to you, except when you''re
    a developer; then you''re a magic wizard king who can see everything that''s happening,
    but more on in later layers.


    The browser goes through a firewall, which is usually taken for granted. You probably
    have some manner of firewall on your computer right now, or in your router/modem.
    The browser knows how to pass through it because you''ve told the guard the browser
    is okay and should be let through.


