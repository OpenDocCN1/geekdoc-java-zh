    # 快速上手 PHP 环境


    而且有数如云般的服务器。与其名称相反，云计算机系统其实非常接地气。它们只是由许多小计算机组合而成的大型计算机。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_102_0.png)


    在这台表面上看起来单一的计算机上，运行着一种特殊的软件，它决定了环境的外观和感受；例如，它看起来像是在处理单一的 Linux 服务器。在某些方面，它类似于共享主机——但规模要大得多（计算机数量多得多得多）。


    云托管通常允许对服务器进行终端访问（允许你手动配置某些项目），但通常也具有 GUI 元素，用于生成访问代码、向你的云驱动型应用程序安装插件等。


    一些流行的云托管提供商有：


    - Google App Engine (https://google.google.com/appengine/docs)

    - Heroku (https://www.heroku.com/)

    - Amazon Web Web Services (https://aws.amazon.com/)

    - OpenShift (https://www.openshift.com/)

    - Azure (https://azure.microsoft.com/en-us/)

    - Fortrabbit (http://www.fortrabbit.com/)


    ... 还有很多。


    云托管有几种方法，但它们共同的一个共同特征是：你并不依赖其他客户的善意和代码，这与共享主机不同。云资源（又名运行你应用程序的计算机网络）专注于处理你的（以及他人的）代码，而硬盘存储部分（例如存储你用户上传的内容）通常保存在其他地方。这有两个优势：


    - 1. 云被专门用于处理代码。它针对一个特定目的进行了优化，因此你的应用程序始终很快（取决于你代码的质量和用量）。

    - 2. 没有资源限制。在云计算中，有如此多的机器作为一个整体在工作，因此你的应用程序总有充足的资源。


    云托管遵循付费模型，根据你的应用程序使用服务器的时间单位收费。例如，每个 CPU 单位的价格可能为两美分，单位可能以 15 分钟为增量。如果你的应用程序使用一个核心运行了
    24 小时，然后突然流量激增并使用四个核心运行了另外 24 小时，你最终一天将支付 1.9 美元，两天约为 7.7 美元，两天总计约为 10 美元。如果你有大量流量，云托管更贵，但比共享主机更可靠，因为它几乎不会崩溃。这意味着如果你的网站突然收到巨大的流量激增（可能上了新闻），云托管提供商可以为你的应用程序分配更多的
    CPU 核心，并让它在额外流量期间保持运行。这意味着业务不会中断，这可能已经抵消了那些托管成本！此外，如果你担心某波流量强大到足以让你在财务上破产，大多数服务提供商都提供选项允许你设置限制；例如，“为我的程序提供更多算力，只要它每月费用低于
    2000 美元即可。”


    许多云托管服务还提供免费层级，这意味着你可以免费使用它们，没有任何条件，想用多久就用多久——但资源有限，且缺少某些功能（例如，没有自定义域名）。如果你想扩展，可以轻松升级网站已经托管的账户，它会立即变得更强大（也更贵）。


    云托管是当今的托管选择，特别是对于需要极高可靠性的知名应用程序，因为停机非常罕见。对于作为 Demo 和作品集的一次性项目，云托管也是极佳的选择，如果你多次利用免费层级——你可以免费在在线上拥有永久可用、公开访问且可运行的代码。


    不过，这并非全是乐趣。共享主机的某些缺点也出现在云托管中：


    - 供应商锁定（Vendor lock-in）：这也可能发生在云托管中。通常情况下，你所在的平台会有你需要学习的特定平台设置以及你需要精通的微调。同样，安装的软件版本也倾向于保持未更新。由于服务器经过调优，以惊人的速度运行特定版本（例如
    PHP），该版本也经过了调整以便在该环境中运行良好，这使得更新变得困难，因为新版本也需要这些（通常是非简易的）微调。

    - 学习局限性：共享主机因为没有教任何服务器管理知识而限制了你，而云托管的限制在于它只教你一种特定的服务器管理——他们的那种。从 Google App Engine
    迁移到 Heroku 并不是一项简单的操作，从代码角度以及掌握具有特定特定命令和工具的新工具的学习曲线来说都是如此。


    记住——云托管类似于共享主机，但规模要大得多。然而，要使用云托管，用户通常已经是精通某些服务器管理的高级用户。对于刚起步的新手，我总是建议使用虚拟专用服务器（VPS）。


    # (虚拟) 私有托管


    也称为专用托管，私有托管承诺提供专用机器——无论根据你的需求是虚拟的还是物理的（这就是为什么“虚拟”加了括号）。你可以根据你认为合适的用途使用这台机器。如果你选择将其作为自己的共享主机提供商，你可以设置服务器来支持此并转售空间。你还可以购买几台机器并将它们聚类，形成你自己的微云。或者只为了一个应用程序使用单一服务器——那也行！


    在专用托管中，拥有一台物理机器是非常昂贵的，根据机器性能，每月可能花费数千美元。这就是为什么大多数用户选择 VPS（虚拟专用服务器），它们是虚拟机（与我们在之前的章节中讨论的
    Vagrant 类似），运行在单一服务器上。就像云托管和共享主机一样，单一计算机（看起来是单一）包含多个更小的实例——供客户使用。这些实例就像真实的服务器，你可以通过终端对它们进行完全访问。你可以安装和卸载所有内容，甚至更改操作系统。虚拟机并不在意；它与其他完全隔离，你可以随心所欲地弄坏它。


    VPS 托管对于新手是最容易的方法，原因如下：


    - 价格：现代 VPS 提供商非常便宜。像 Vultr³ 和 DigitalOcean⁴ 这样的服务提供的虚拟机（对于普通应用程序来说足够）每月低至五美元。这比云托管便宜，但比共享主机强大得多。带宽是无限的，你仅有的
    CPU、内存和硬盘限制是在你购买时约定的。所有服务器也可以随时升级，而且通过 DigitalOcean 的推荐计划，如果你向他人推荐该服务，你可能永远不需要付费。事实上，奖励是双向的：通过推荐注册的用户可以获得十美元的奖励，而推荐人在购买后也会获得奖励。

    - 可靠性：VPS 的可靠性取决于你的设置。此类托管提供商很少会有整个数据中心掉线，因为安装了大量的安全措施来防止停机。在大多数情况下，服务器的稳定性完全取决于你如何设置，这让你学习了服务器事务——这是至关重要的。与云托管相比，底层基础设施的可靠性是相同的；真正的停机风险是客户错误配置了
    VPS 实例。

    - 熟悉感：如果你像书中描述的那样从 Vagrant VM 开始，那么 VPS 将看起来非常熟悉。它将具有相同的界面、相同的命令、相同的流程。你会熟悉大多数可以修改的方面，并且由于你在本地（你正在开发的本地
    Vagrant VM）上拥有经验，能够调试你的实时服务器。VPS 是一个快速且简单的方法。


