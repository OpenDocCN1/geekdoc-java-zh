    \n# Jump Start PHP Environment\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_90_0.png)\n\
    \nFigure 5.1. Finding the ID of our commit\n\nTo reset it, we execute:\n\n```\n\
    git reset --hard b6adf1756bb9b94f\n```\n\nNotice how we used a shorter hash than\
    \ what git log gave us. That's a feature of Git—just the first ten or so characters\
