    ## Server-side Languages


    The book focuses on preparing a development environment for server-side programming.
    We won''t be dealing with HTML, CSS, or JavaScript; there are plenty of books
    on those out there, and setting up a client-side development flow is complex enough
    on its own. Instead, we''ll be dealing exclusively with server-side preparations,
    and it''s very easy to start off the wrong way. Just as a speck on a balloon will
    grow as it fills with air, so too a mistype in the beginning of a career grows
    into a long-term harmful habit.


    As you may already know, examples of server-side languages include PHP, Ruby,
    and Python. They sit as programs on the server computer, as well as the server
    program. These languages take certain commands from the server program, and output
    the result of these commands back to it. It is that output that is given to the
    browser when a user asks for an answer to a certain question. In a nutshell, by
    telling the server "When a request comes in for the example.com website, run this
    file through PHP:


    ```php

    <?php

    echo "Hello World";

    ```


    ... have given it a way to produce an answer for the client. The PHP file is then
    run, and the content "Hello World" is generated and sent back to the server program,
    which is then given to the browser. The browser takes it back to the server and
    simply repeats "Hello World." The browser stops short of relaying the rest of
    the contents of the file; the php tag <?php and the keyword echo are skipped in
    the output. This because the tag <?php tells the server to "Run this file through
    PHP" and then, when running the file through PHP, echo tells it "Output the following
    phrase onscreen.".


