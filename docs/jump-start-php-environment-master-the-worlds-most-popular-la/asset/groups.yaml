    ## 使用服务器端语言生成答案


    服务器端语言的最后一部分是你正在寻找的内容。假设：


    - 服务器检查路由下是否有任何内容

    - 如果没有找到文件，它被配置为询问 PHP

    - 服务器询问：“能在路由下找到任何内容吗？”

    - PHP 激活并搜索路由，未找到任何内容

    - 它向服务器返回“404 页面未”错误（然后提供给浏览器）

    - 存在许多此类状态码，但在这一阶段不需要了解所有


    - 服务器接收到 404 消息并想：“嗯，PHP 锁定了。好吧，它什么都没有，还是给客户端返回一个失败的页面吧。”浏览器随后收到 404 页面。


