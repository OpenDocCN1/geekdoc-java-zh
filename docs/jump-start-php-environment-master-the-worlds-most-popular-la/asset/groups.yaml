    ## Chapter 4

    ## Virtual Machines


    In this chapter, we''re going to learn about virtualization and why it''s absolutely
    essential for a quality development experience. We''ll use industry-standard tools
    such as Vagrant, and talk about ways to make using virtual machines more user-friendly,
    so that they become more accessible to a wider audience.


    I''d still advise reading this chapter even if you''re familiar with virtualization,
    as it will undoubtedly contain information new to you. It will also explain and
    demonstrate the virtual box that we''ll be using throughout the remainder of the
    book.


    To use the tools we present in this chapter, you''ll need to install some software
    on your computer. This software is cross-platform, so there''s a version for your
    computer no matter what operating system you use.


    Before proceeding, please ensure that you''ve installed the following:


    - Vagrant, from https://www.vagrant.com/

    - VirtualBox, from https://www.virtualbox.org/

    - Git, from http://git-scm.com/downloads


    ## 44 Jump Start PHP Environment


    All these links include installation guides for every major operating system.


    ## Virtual Machines Explained


    Before we use virtual machines, or VMs, I''ll explain what they are in general,
    and in the context of web development (which is not the same!).


    ### What are VMs?


    Your computer is a machine. It contains hardware such as the CPU, the GPU, some
    RAM, a hard drive, and so on. You need all this to run your operating system and
    the apps installed into it. A **virtual machine** is a special type of application
    that reserves a part of your computer and pretends it''s a real machine on its
    own. For example, a virtual machine might reserve a part of your CPU and 2GB of
    RAM from your main machine, along with 20GB of hard-drive space. These resources
    are then brought together into a whole, seen in Figure 4.1, which can act as a
    computer on its own. It can have its own operating system independent from the
    main machine''s OS (the *host*) with its own applications installed.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_66_0.png)


    Figure 4.1. Visualizing a virtual machine


    The operating systems—in fact, the entire environments of the different machines
    (the host and the virtual machine running on the host)—are entirely independent,
    indeed, unaware of each other. The host knows it has fewer resources at disposal,
    but has no idea they''re not real; it *thinks* they''re actual hardware parts.


    A virtual machine is, quite literally, a computer in a computer. Some people use
    them for running video games on operating systems without native support for them;
    for example, running Windows games on a Linux system. Security companies use them
    as sandboxes, environments in which they can let a virus or potentially malicious
    piece of code without worrying about the consequences: if the virtual machine
    gets damaged, it''s rebuilt with two simple commands (it''s virtual, all after!).
    Enterprise companies use them as a way to avoid updating their software. Rather
    than spend billions on a software rewrite because their internal application depends
    on Windows XP and the newest version is Windows 10, they''ll spend less on buying
    Windows XP licenses and running Windows virtual machines inside their Windows
    10 host machines, enabling them to live longer while enjoying the increased security
    of a newer host operating system.


    In development, a virtual machine is used as an isolated environment for your
    application. You can install different versions of PHP and MySQL in it, and you
    can break anything as a virtual machine can be reset into its original state easily.
    This is what makes virtual machines very appealing, not only for testing code
    on different versions of PHP on different operating systems, but also for development/production
    parity (discussed in the Chapter 3): it allows you to configure a virtual machine
    to resemble a live server as closely as possible, thus being able to test the
    code as if was online, minimizing errors.


    ## Getting to Know VirtualBox and Vagrant


    VirtualBox, one of the pieces of software we installed in the introduction to
    this chapter, is used to *use* virtual machines. Vagrant knows what it needs to
    do with the help of a Vagrantfile, which contains all the instructions for how
    to set up the environment, making the process of creating a new box simpler.


    VirtualBox has many features including, but not limited to, sharing folders with
    the host. This is what VirtualBox is, as seen in Figure 4.2.


    ### Jump Start PHP Environment


    Where punching such commands would usually be tedious, error-prone, and incredibly-consuming
    (albeit possible!) in a VirtualBox-only world, Vagrant helps shorten the process
    to be up and running incredibly quickly.


    ## Virtual Machines


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_69_0.png)


    Figure 4.3. Virtual Machines action


    ### The Benefits of VMs


    To recap, the benefits of using VMs are:


    - they''re easy to destroy and rebuild into an initial state

    - you can use your favorite applications on your host machine

    - you can achieve development/production parity by configuring a VM to be similar
    to your live server

    - you get to learn system administration

    - it''s impossible to do any harm to your host machine using VMs as they''re completely
    isolated

    - it''s easy to share entire configurations with other people (by sending them
    a Vagrantfile) so that they have the exact setup on their machine

    - there''s no need to install PHP, servers, and databases on your host machine,
    thus keeping your main operating system clean and fast


    ## Vagrant in a Nutshell


    Vagrant is an application that uses another application (in our case, VirtualBox)
    to create virtual machines with simple commands. Vagrant knows what it needs to
    do with the help of a Vagrantfile, which contains all the instructions for how
    to set up the environment.


    ## Vagrant Boxes


    All the various Vagrant boxes can be found at https://hashicorp.com/boxes/search.
    These boxes are preconfigured by other people and available to everyone for free.
    You can find anything from bare-bones operating system installations to fully
    configured environments that are compatible with specific software.

