    地址告诉浏览器如何在互联网上找到它正在寻找的计算机（服务器）。DNS 服务器（也称为名称服务器）知道哪些 IP 地址匹配域名，并告诉浏览器下一步去哪里。


    当尝试查找匹配域名时，浏览器首先检查自己的缓存——访问域名的保存列表。每个浏览器都会维护此列表并定期刷新。如果从自己的缓存中发现域名-IP 组合，网站加载速度会更快，因为不需要询问
    DNS 服务器。如果缓存中没有，浏览器会询问名为解析器的程序（内置于操作系统）检查其安装计算机上的 hosts 文件。hosts 文件映射到 IP 地址。（我们将在后的章节中学习如何使用此文件。）如果还没有必要信息，将检查路由器（路由器通常都有）上的
    DNS 缓存，如果那里也没有找到，则会询问 ISP 的 DNS 服务器。


