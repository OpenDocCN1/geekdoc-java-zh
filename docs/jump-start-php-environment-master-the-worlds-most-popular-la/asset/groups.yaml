    ## 服务器端语言


    本书侧重于为服务器端编程准备开发环境。我们不会处理 HTML、CSS 或 JavaScript；关于这些内容的书籍多得多，而且设置客户端开发工作流本身已经足够复杂了。相反，我们将专门处理服务器端的准备工作，而很容易以错误的方式开始。就像气球上的一个小点随着充气而变大一样，职业初期的拼写错误会变成一种长期的有害习惯。


    可能你已经知道，服务器端语言的示例包括 PHP、Ruby 和 Python。它们作为程序运行在服务器计算机上，同时也服务器程序本身。这些语言从服务器程序接收某些命令，并将这些命令的结果返回给它。当用户请求某个特定问题的答案时，正是该输出提供给浏览器的。简而言之，通过告诉服务器“当
