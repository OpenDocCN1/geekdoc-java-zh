    World。”浏览器并没有转发文件的其余内容；php 标签 `<?php` 和关键字 `echo` 在输出中被跳过了。这是因为 `<?php` 标签告诉服务器“通过
    PHP 运行此文件”，然后在通过 PHP 运行文件时，`echo` 告诉它“在屏幕上输出以下短语。”


