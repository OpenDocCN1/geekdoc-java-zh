    # Jump Start PHP Environment


    However, this can be very resource-consuming and can be incredibly sluggish. Booting
    up virtual machines with full graphic interfaces takes just long as booting up
    on old hardware matching the host''s power of the reserved resources; consequently,
    this would be unnecessarily slow when developing for the Web. Furthermore, most
    web developers have their favorite IDE and browser, along with other tools, all
    configured for a pleasant workflow. If developers had to reinstall and reconfigure
    these tools into every new virtual machine they booted up, their profession would
    rapidly lose its appeal. Developers want to be able to use the tools they know
    and love without much configuring; they want to be able to dive into a new project
    as soon as possible, so they want to keep their tools on the host.


    This is what comes in. Vagrant is a helper tool that uses VirtualBox to create
    "headless VMs." In other words, it boots up without the multimedia angle (that
