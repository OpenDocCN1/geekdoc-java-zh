    \ Bitbucket 等替代网站，但它们的受欢迎程度远不如 GitHub，这就是为什么我们在本书中使用 GitHub 的原因。在你的探索过程中，请随时使用你喜欢的任何服务。\n\
    \n但为什么人们想要使用 GitHub 这样的服务来管理代码呢？除了可以轻松免费地与他人分享代码这个显而易见的答案外，当你的项目崩溃丢失所有内容时，GitHub\
    \ 这样的服务可以成为救命稻草。如果你定期向仓库远程（即 GitHub URL）推送（push，Git 的术语），你就可以免于灾难：你的整个文件历史都被保留了，你可以在另一台电脑上继续之前的工作。此外，还有许多与\
