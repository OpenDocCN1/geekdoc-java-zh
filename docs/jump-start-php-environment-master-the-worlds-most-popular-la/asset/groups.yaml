    # Jump Start PHP Environment


    # Shared Hosting Holds You Back


    When using shared hosting, you''re typically given a simplified user interface
    such as cPanel, the one shown in Figure 6.1, through which to configure your site.
    There is, however, no actual access to fine-tune aspects of your site, install
    custom extensions, upgrade your app the way you upgrade your local development
    server, and so on. You are essentially locked into what the hosting company has
    installed and there''s no way to change it because it would affect hundreds—maybe
    thousands—of other users.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_100_0.png)


    > Figure 6.1. cPanel is a common shared-hosting control panel


    This might seem ideal for entry-level users, but it provides too much abstraction.
    In other words, it places a user too far from the nitty-gritty of custom configuration
    and server setups—something that is absolutely essential to be familiar with in
    your web development career.


    By sticking with such approaches, you do yourself a short-term favor for long-term
    harm. The time will come when you have to deploy to a real, non-shared server,
    or when you need to manually update server software.


    But there must be some cases where all this simplicity is good, right?'
  - '[PAGE 101]


    # Shared Hosting is Good for Limited Use Cases


    There are projects where shared hosting is a godsend. In a career of serious web
    development, these use cases are rare but still possible:


    +   - email: with shared hosts, it''s incredibly easy to set up a custom email
    address. Ever dreamed about having an email address such as firstname@lastname.com?
    Would look on a business card. With shared hosting, it''s a breeze. You buy a
    domain (lastname.com), go into your shared hosting account''s control panel, and
    set it all according to the instructions. Most have a step-by-step process, so
    you should have a personalized email account within 24 hours.


    +   - code samples: those requiring very few resources are easily hosted on shared
    hosting servers. Small portfolio scripts and projects are ideal for this purpose;
    for example, code demos within tutorials you write, sample code from client websites
    you''ve built, and so on. Anything not needing to support large amounts of bandwidth
    should work indefinitely, and live demos instead of words on a resume always lasts
    better!


    +   - Fire-and forget projects: Finally, the simple sites for really lowmaintenance
    clients such as a neighbor''s pet, your grandma, a butcher, or a local store.
    Maybe you''re actively involved in volunteer work and are helping to organize
    a conference by creating a website for them. That''s generally short-lived or
    updated rarely (also known as a fire-and-forget project) has a comfy home on a
    shared hosting server. The low resource demands of such projects and their relatively
    limited traffic ensure their compatibility for a long time to come. For a cost
    as low as $5 per month (the average price of shared hosting servers these days),
    you can accommodate multiple clients. What''s more, the simplicity of the UI and
    ease of use ensure that the project can be easily taken over by someone else if
    you''re no longer interested in involving.


    # Cloud Hosting


    Cloud hosting is where many computers are linked in a symbiosis making them act
    and appear as one.


    In Figure 6.2, the horizontal units in the glass cases are minimized computers:
    hardware units with all the unnecessary parts stripped out so that they are as
    power, space, and heat efficient as possible. Networked together, they form one
    great whole,'
- md: '

    # Jump Start PHP Environment


    and there are warehouses upon warehouses of them. Contrary to their name, cloud
    computer systems are very much grounded. They''re merely very large computers
    formed of many little ones.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_102_0.png)


    On this apparent single computer, a special kind of software is run that dictates
    the look and feel of the environment; for example, it seems like we''re dealing
    with a single Linux server. In some ways it''s like shared hosting—but on a much,
    much greater scale (many more computers).


    Cloud hosting usually allows terminal access to the server (enabling you to manually
    configure some items) but often features GUI elements that are used to generate
    access codes, install plugins into your cloud-powered applications, and more.


    Some popular cloud hosting providers are:


    - Google App Engine (https://google.google.com/appengine/docs)

    - Heroku (https://www.heroku.com/)

    - Amazon Web Web Services (https://aws.amazon.com/)

    - OpenShift (https://www.openshift.com/)

    - Azure (https://azure.microsoft.com/en-us/)

    - Fortrabbit (http://www.fortrabbit.com/)


    ... and there are many more.


    There are several approaches to cloud hosting, but the one common vector they
    all share is that you do not depend on other customers'' goodwill and code, unlike
    with shared hosting. The resources of the cloud (aka the network of computers
    on which your app is operating) are focused on processing your (and other people''s)
    code, while the hard drive storage parts (such as storing your users'' upload,
    for example) are usually saved elsewhere. This has two advantages:


    - 1. The cloud is used exclusively to process code. It is optimized for one purpose,
    so your app is always fast (depending on your code''s quality, course).

    - 2. There are no resource limits. In cloud computing, there are so many machines
    working as one there are always plenty of resources for your app.


    Cloud hosting follows a payment model that charges the number of units of time
    your app has been using a server. For example, it might be priced at two cents
    per unit of CPU, and units may be increments of 15 minutes. If your application
    used one core for 24 hours, then had a sudden traffic spike and used four cores
    for 24 more hours, you''d end up paying $1.9 for one day, and around $7.7 for
    two days, totaling around $10 for two days. Cloud hosting is more expensive if
    you have lots of traffic, but more reliable than shared hosting as it is rarely,
    ever crashes. It means if your site suddenly receives a huge traffic boost (maybe
    it hits up on the news), the cloud-hosting provider can allocate more CPU cores
    to your app and keep it alive for those extras. This means no business, which
    probably offsets those hosting costs anyway! Besides, if you fear a wave of traffic
    so powerful it could financially destroy you, most services offer you to set limits;
    for example, "throw more power at my app as long as it stays under $2,000 per
    month."


    Many cloud hosting services also offer free tiers, meaning you can use them free
    of charge, no strings attached, for as long as you want—but with limited resources
    and missing features (no custom domains, for example). If you want to expand,
    you can easily upgrade the account your site is already hosted on, and it immediately
    becomes more powerful (and more expensive).


    Cloud hosting is the hosting choice these days, particularly for high-profile
    applications requiring extreme reliability, as downtimes are rare. Cloud hosting
    is also excellent for one-off projects as demos and portfolio pieces if you utilize
    the free tiers many—at no cost, you can have permanently available, publicly accessible
    runnable code online.


    It''s not all fun and games, though. Some of the disadvantages of shared hosting
    are present in cloud hosting:


    - Vendor lock-in: this can happen in cloud hosting, too. Often, the platform you''re
    on will have platform-specific settings you need to learn and tweaks to master.
    Likewise, versions of installed software also tend to remain unpatched. Since
    the servers are tuned to run a specific version of, for example, PHP at incredible
    speeds, that is also tweaked to run well in such an environment, making it difficult
    to update as a new version would require those (often non-trivial) tweaks as well.

    - Learning limitations: while shared hosting holds you back by failing to teach
    anything about server management, cloud hosting is limiting by teaching you only
    a specific type of server management—theirs. Moving from Google App Engine to
    Heroku is no trivial operation, but in code terms and in the learning curve involved
    in mastering a new tool with its own specific commands and utilities.


    Remember—cloud hosting is similar to shared hosting, but on a much greater scale.
    To use cloud hosting, however, one is typically an advanced user already proficient
    in some server management. For the case of a newbie starting out, I''d always
    recommend virtual private servers.


    # (Virtual) Private Hosting


    Also known as dedicated hosting, private hosting promises a dedicated machine—be
    it virtual or physical for your needs (hence why virtual is parenthesized). You
    can then use this machine for whatever purpose you see fit. If you choose to make
    it your own shared hosting provider, you can set up the server to support this
    and resell the space. You could also buy several machines, and cluster them up
    to make your own mini cloud. Or just use a single server for a single app—that
    works, too!


    In dedicated hosting, having a physical machine for yourself is quite expensive,
    getting into thousands of dollars per month depending on the machine''s power.
    That''s why most users opt for VPS (virtual private servers), which are virtual
    machines, or VMs (not unlike Vagrant machines we talked about in previous chapters)
    on a single server. Much like in cloud and shared hosting, a single computer (or
    what appears to be one) contains several smaller ones—instances for customers
    to use. These instances act like real servers, so you gain full access to them
    via the terminal. You can install and uninstall at all, even change the operating
    system. The VM doesn''t care; it''s completely isolated from the rest, and you
    can make it and break it at will.


    VPS hosting is the most accessible approach for new users for the following reasons:


    - Price: modern VPS providers are incredibly cheap. Services such as Vultr³ and
    DigitalOcean⁴ provide virtual servers—machines not strong enough for the average
    web app or two—as little as five dollars per month. This is cheaper than cloud
    hosting, but much more powerful than shared hosting. The bandwidth is unlimited,
    and the only CPU, RAM, and hard drive limits you have are those you agree upon
    purchase. All servers can also be upgraded at any time, and with programs as DigitalOcean''s
    referral system, you can end up never paying for a single month if you refer people
    to the service. In fact, the bonus gives both ways: even the ones coming in via
    a referral receive a bonus of (currently) ten dollars for signing up, giving the
    referrer a bonus after they''ve made a purchase.

    - Reliability: VPS is as reliable as you make it. Very rarely does an entire data
    center of machines go offline for such a hosting provider, as there are a plethora
    of fail-safes installed to prevent downtime from happening. For the most part,
    the server''s stability depends entirely on how you set it up, which leads to
    you learning server matters—something of utmost importance. Compared to cloud
    hosting, reliability of the infrastructure behind the scenes is identical; the
    only real risk of downtime is the customer misconfiguring their VPS instance.

    - Familiarity: a VPS will look familiar if you started with Vagrant VMs as described
    in this book. It will be the same interface, same commands, some procedures. You''ll
    be familiar with most of the aspects you can modify, and able to debug your live
    server because you have experience on your local one (the local Vagrant VM you''re
    developing on). A VPS is a quick and easy way to development-pro


    ³ https://www.vultr.com/


    ⁴ http://digitalocean.com

