    # Frameworks versus Packages


    Chapter 7 mentioned packages: they are sets of reusable code. There is, however,
    another level beyond packages: PHP frameworks.


    A **framework** is a predefined set of packages designed to quickly bootstrap
    an application; the traditional process of setting up database connections, login
    systems, and more are dealt with having it all pre-built. This means most frameworks
    are either very opinionated (that is, enforce their particular way of doing things,
    such as Laravel²) or incredibly extensible and hyper-configurable, but over-engineered
    (thousands of lines of code handling what could be done in a dozen lines, all
    for the sake of remaining fully configurable, such as Symfony³).


    These days, frameworks are often the default starting point for a project. They
    can be a quick way to skip coding elements that are minor to your project. Some
    developers shy away from using frameworks because they see them either as too


