    项目——你将在未来的职业生涯中经常用到它。如果你喜欢，可以尝试一些 Git 的 GUI 工具。你可以在以下 URL 查看完整列表：https://git-scm.com/downloads/guis。


    # 有用资源


    要了解更多关于 Git 的知识，请参考 SitePoint 的《Jump Start Git》⁹ 或 Apress 的《Pro Git》¹⁰。这两本书对新手非常友好。


    如果你不想花时间读完整本指南，GitHub¹¹ 上有一些非常有帮助的图文指南，它们以非常易于理解的方式涵盖了 Git 和 GitHub。尽管我们在之前的用法示例中已经基本上涵盖了这两者，但我建议在继续阅读此本书之前，至少阅读“Hello
    World”和“将你的项目上传到 GitHub”指南。把这视为作业吧。


    # 总结


    在本章中，我们查看了版本控制系统，并解释了它们的工作原理以及存在的原因。我们使用示例项目简要演示了它们的功能，并建议了一些额外的学习材料。


    在下一章中，我们将讨论托管，解释如何找到服务器、如何使用它以及需要避免什么、如何将代码部署到实时服务器上等内容。


    > ⁹ https://www.sitepoint.com/premium/books/jump-start-git


    > ¹⁰ http://git-scm.com/book/en/v2


    > ¹¹ https://guides.github.com


    # 部署与托管


    现在版本控制已经学习完毕，是时候考虑部署和托管了。


    **部署**（Deployment），正如你可能从之前的章节中学到的，是指将你在本地开发的应用程序发布到网上供人们使用的行为。部署后的应用程序并不意味着它是公开可用的——例如，它可以是公司内部的内网应用；这意味着它可以被其目标受众使用。


    然而，应用程序如果没有被**托管**（hosted）是无法部署的；需要一台服务器计算机作为它的家。在本章中，我们将更详细地讨论这两个术语，并列出每种方法的方案。我们还将涵盖常见方法的优缺点，并定义一些你在整个
    Web 开发生涯中会听到的术语。


    即使你对部署和托管的方面了熟悉，也建议阅读这一章，因为它包含了关于应该避免什么和应该选择什么的最新信息。


    # 托管


    我们将先解释托管，因为在搬进家之前，知道如何选择家是很重要的。


    你将反复遇到的三种主要托管类型是：共享托管、云托管和（虚拟）私有托管。我稍后会进一步解释括号中的“虚拟”字。


    # 共享托管


    当托管公司拥有一台服务器（由单台机器组成或作为一个单机运行）时，他们会为该服务器上的每个客户创建一个单独的文件夹和账户；这被称为共享托管。每个客户被分配服务器的一部分处理能力、总内存的一份以及一段硬盘空间。这部分资源可以作为你部署的应用程序的家。当一台服务器的空间不足以容纳新用户时，公司可能会设置几台服务器。这在理论上听起来很棒，但在实践中有很多问题。


    # 共享托管很糟糕


    由于缺乏更好的（即更便宜和/或更简单）的选项，在很长一段时间内，共享托管是许多人唯一的可行方案。这种广泛的使用导致了它在托管市场的主导地位，并且仅仅是因为这种最初的惯性而保持流行。


    共享托管很糟糕，有几个原因：


    - **安全风险**：许多流行的内容管理系统（如 WordPress、Drupal、Joomla 等）要求用户在某些文件夹上开启全写访问模式，以便他们可以将文件放置其中。通过这样做，许多用户在与其他客户共享硬盘时，无意中错误地允许了对其网站文件的访问。这种所谓的“777
    问题”（777 是 Linux 中表示“允许任何人对此文件或此文件夹执行任何操作”的代码代码）是一个巨大的安全风险。此外，在共享托管主机上使用内容管理系统时，你面临着版本过时的风险。一个网站的懒惰和不愿更新同一台服务器上安装的另一个
    CMS 实例可能会导致你的网站被黑，因为这可能成为攻击者访问整个服务器的网关！


    - **流量过载**：你依赖他人的能力和流量。如果给定服务器上的某个网站代码写得糟糕，消耗了许多 CPU 周期或由于大量内存，同一台服务器上的其他应用程序可能会因此受到影响；所有应用程序都共享相同的硬件——在共享托管环境中这是非常有限的——用户的过度需求可能对你自己的应用程序产生不利。对于流量巨大的良好代码也是如此：如果另一个网站接收了过多流量，服务器可能会过载并关闭，从而导致你的网站也跟着掉线。


    - **限制**：许多共享托管公司承诺无限的带宽和资源，这几乎从不是真的¹。世界上没有所谓的“无限”任何东西：只要你的网站成功突破了约定的限制（无论是常规
    CPU 使用、硬盘空间还是带宽），你就会发现“无限”真正的含义意味着什么。查看来自 WhoShHostingThis.com 的这篇文章，它指出了共享托管的陷阱，并提供了一个关于因在无限计划上使用过多资源而被断开连接的警示故事²。


    - **声誉**：当你在同一台服务器上时，你面临着声誉受到另一个网站行为影响的风险。


    ¹ http://whoshostthis.com/pitfalls-of-shared-hosting

    ² http://whoshostthis.com/unlimited-bandwidth-hosting-myth

    '
