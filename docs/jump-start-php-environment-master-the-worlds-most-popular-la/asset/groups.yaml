    \ 都会在 `.git` 文件夹中存储旧版本和新版本的副本，以便我们以后在需要时引用它们。这意味着，如果我们需要撤销某项更改，将使用 Git 重置到之前的时间点，例如使用\
    \ `git reset 47298720dbf`，其中最后的代码是提交的名称或标记。我们将在本章末尾提供一个更全面的 Git 指南链接。阅读它将让你在一天或两天内成为\
    \ Git 大师。\n\n# 快速上手 PHP 环境\n\nGit 的替代方案远非唯一的版本控制系统（VCS）。还有其他系统，如 Mercurial、SVN、CVS\
    \ 等许多系统，但 Git 是最广泛使用的。如果你现在想为开源项目做贡献，Git 是你应该使用的 VCS，因为绝大多数项目都使用它。它也是驱动 GitHub\
    \ 的核心引擎，所以你从一开始就会成为其中的一员。\n\n# GitHub\n\n使用 Git 时，你有能力从任何远程端点克隆仓库，只要代码在那里那里。例如，如果我有一些源代码并将其放在一个在线服务器（可以通过互联网访问的服务器）上，然后配置该服务器接受\
    \ Git 调用，那么任何安装了 Git 的人都可以通过运行以下命令克隆这些代码：\n\n```\ngit clone https://myserver/myrepo.git\n\
