    # Jump Start PHP Environment


    Installing packages with Composer is as easy as calling Composer''s require command
    while inside the folder of your application:


    ```

    composer require nesbot/carbon

    ```


    At this point Composer will, in order:


    +   1. Look at the argument require and determine that it is a valid package name.
    Note that package names use the normal forward slash (/).

    2. Look at its configuration (a special file called composer.json) for information
    on where to find nesbot/carbon. No information is found, so it will move to the
    next step.

    3. Go to Packagist and look up the entry for nesbot/carbon. If it''s there, it
    moves to the next step.

    4. Read the configuration of that package to find out if the package itself has
    dependencies (which are other packages it needs to do what it does). It starts
    the process for each of them before finishing nesbot/carbon.

    5. After dependencies have been installed, it downloads nesbot/carbon, updates
    an autoloader file (located in the main project''s folder, under vendor/autoload.php
    by default), and makes the newly installed package is usable in your application.


    To use this package, ensure that the aforementioned autoloader.php file is included
    in your app. This only needs to be done once, regardless of how many packages
    install. They''re all autoloaded with this one file:


    ```

    <?php

    include ''vendor/autoload.php'';

    ```


    This might seem a bit abstract, so let''s see it in action.


