    # 编程环境 23


    在 Windows 上，你在图 2.3 中看到的程序被称为命令提示符或命令行：


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_45_0.png)


    你通过在搜索框中输入“cmd”或“command prompt”来运行它。在最基础的形式下，它允许你执行运行 Windows 程序的命令，并产生一些文本输出（例如图
    2.3 所示的 echo 命令，它会产生“Hello!”的输出），或者打开你已经熟悉的应用程序，如记事本（如果你在命令提示符中输入“notepad”并按回车，记事本应用程序就会打开）。命令行还有其他的实现方式，例如
    Cmder$^{10}$（见图 2.4）或 Console.${11}$。它们是更美观的版本，本质上执行相同的任务，但让复制粘贴、标签切换和选择文本等某些操作变得更容易。


    10 http://bliker.github.io/cmder/

    11 http://sourceforge.net/projects/console/


    ## 24 快速上手 PHP 环境


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_46_0.png)


    在 Mac 和 Linux 上，该程序被称为 Terminal（终端）。要在这些任任上运行它，打开搜索并输入“Terminal”，它就会弹出。它的功能与 Windows
    命令提示符相同，但命令不同。例如，在 Windows 中显示目录（文件夹）内容的命令是 `dir`，而在 Apple 和 Linux 上通常是 `ls`。


    任何称职的开发者都需要熟悉命令行/终端，以最大限地发挥自己的潜力。大多数命令行命令都有通用的替代方法，起初可以使用各种快捷键，但过不了多久它们就会变得繁琐且具有限制，而不是有用。


    Windows 版本和非 Windows 版本之间的差异很重要，因为即使在 Windows 上，你会使用 Apple/Linux 特定的命令。我们将在第 4
    章介绍介绍。


    ## 社区


    作为编程环境的最后一个元素，让我们讨论一下寻求和提供帮助。你所选择的编程语言社区是学习编程时最重要的因素之一。能够快速可靠地获得遇到问题的答案，可能意味着在商业项目中是按时完成还是错过截止日期。


    ## 编程环境 25


    没有哪个开发者能背下他们偏好的编程语言的所有命令列表。我编写 PHP 已经快十年了，仍然经常查阅即使是最基本的命令。真正的知识不在于背诵命令，而在于知道在哪里可以找到它们。


    话虽如此，这里是你现在应该在浏览器中书签到“PHP Help”文件夹下的某些资源：


    ### PHP Mentoring


    PHP Mentoring¹² 旨在帮助人们寻找导师和学生。如果你是专家，可以指导新手；如果你是初学者，可以找到一个导师。导师会告诉你是最佳实践，分析你的代码并提供反馈，指出你的错误，并在你偏离方向时将你引回正确的道路。这不涉及任何费用；这是某些热心人士完全自愿的努力。如果你是一个纯新手，我建议你一翻开书页就尽快申请导师指导。


    ### PHP.net 文档


    该编程语言¹³的官方网站充满了代码示例，用户评论进一步对它们进行了审查和解释。如果你漫无目的地浏览这些页面，很可能收获甚少，但每当你遇到困难并需要检查某个函数或命令时，你的
    Google 搜索结果很可能是 PHP.net。如果你连接了网络，或者当时离线，还有这些文档的离线版本¹⁴你可以独立下载或作为 Google Chrome
    应用¹⁵。


    ### 各种论坛


    SitePoint 论坛¹⁶ 是一个极好的资源，有大量乐意提供帮助的人。如果你对问题提供了足够的细节，几乎可以保证在几分钟内收到答案。这些论坛是游戏化的，这意味着它们会给在上面发帖的人发放勋章和积分，鼓励社区参与。


    ¹² http://phpmentoring.org/

    ¹³ http://php.net

    ¹⁴ http://php.net/download-docs.php

    ¹⁵ http://bit.ly/phpdocs

    ¹⁶ http://community.sitepoint.com


    ## 快速上手 PHP 环境


    StackExchange 网络是由系列针对特定背景（从编程到烹饪）的问答网站组成的财团，这些网站由构建支持 SitePoint 论坛软件的同一群人创建。由于是游戏化的，这种奖励机制允许用户比平时更多参与，人们可以在几小时（甚至几分钟）内获得一个良好问题的答案。为了获得完整体验，你应该书签三个主要的网站：


    - StackOverflow (http://stackoverflow.com/) 是最流行的通用编程问答网站。你可以在这里提问关于开发的任何查询，因为它是关于开发的。你也可以提问不直接涉及编程的问题，例如关于
    IDE、服务器等的查询。

    - Programming (http://programmers.stackexchange.com/) 专门关注编程问题。如果你在编码时遇到卡壳，这里就是你提问的地方，但请确保先进行广泛的
    Google 搜索。大多数新手问题已经有了解决方案，你很难找到它们。

    - Code Review (http://codreview.stackexchange.com/) 用于代码审查。


    **环境**”一词是指你的应用程序周围的硬件和软件；即用于支持它的一切东西。


    ## 总结


    在本章中，我们处理了环境、社区以及让编程更舒适的其它工具。¹⁷ http://sitepoint.com


    '
