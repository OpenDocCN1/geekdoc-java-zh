    Before we use virtual machines, or VMs, I''ll explain what they are in general,
    and in the context of web development (which is not the same!).


    # What are VMs?


    Your computer is a machine. It contains hardware such as the CPU, the GPU, some
    RAM, a hard drive, and so on. You need all this to run your operating system and
    the apps installed into it. A **virtual machine** is a special type of application
    that reserves a part of your computer and pretends it''s a real machine on its
    own. For example, a virtual machine might reserve a part of your CPU and 2GB of
    RAM from your main machine, along with 20GB of hard-drive space. These resources
    are then brought together into a whole, seen in Figure 4.1, which can act as a
    computer on its own. It can have its own operating system independent from the
    main machine''s OS (the *host*) with its own applications installed.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_66_0.png)


