    For this purpose, a -dev option exists when calling composer require. For example,
    if I''m using a package called PHPUnit to write my unit tests, I would install
    it like so:


    ```

    composer require phpunit/phpunit --dev

    ```


    This places it in a special require-dev block in composer.json, rather than require,
    and ensures it stays out of the end user''s way when a package is installed with
    the --update-no-dev flag. For example, SitePoint\Authorization\User with PHPUnit
    for tests, but Jim just wants to use the package only—no need for tests. He installs
    it with:


    ```

    composer require sitepoint/auth-user --update-no-dev

    ```


    PHPUnit, however, is a tool which is useful across many projects, but installing
    for each one is wasteful, and it''s quite large. That''s where global comes in.
    The global option of the composer command will make sure it''s installed as a
    global package, instantly becoming available across the entire operating system
    we''re working on:


    ```

    composer global require phpunit/phpunit --dev

    ```


    # Is that all there is?


    Of course not! Composer has a multitude of commands. All the above and much more
    is what makes Composer an essential tool in a PHP developer''s daily routine.
    From removing the mental overhead of tracking packages and classes, to smooth
    updates and flawless cooperation with other Composer users, this package manager
    continues to take the PHP ecosystem by storm.


    There''s also the very scripts block, which lets a package author execute arbitrary
    scripts in the various stages of a command''s execution (that is, before stalling
    or after updating), the composer remove command for removing packages you no longer
    need, and so on.


    However, this is not a Composer book, so we''ll avoid going into the full details
    here. Instead, I suggest you have a look at the tutorials at the end of this chapter.
    They include not only a top-down introduction into Composer that''s a bit more
    advanced'
