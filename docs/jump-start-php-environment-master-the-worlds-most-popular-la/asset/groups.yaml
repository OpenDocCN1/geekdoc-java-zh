    # Chapter 5


    # # Versioning Systems


    In this chapter, we''ll cover versioning systems. In particular, we''ll be talking
    about Git and GitHub, as those are by far the most popular tools in use as far
    as versioning and code sharing are concerned.


    If you''re an active user of Git and/or GitHub and are familiar with both the
    importance and use of versioning systems in general, feel free to skip this chapter.
    Otherwise, I strongly advise you to read it as it''s easy to absorb, and absolutely
    essential in your future work.


    If you didn''t read the previous chapter—though it is recommended that you do,
    so please don''t skip it—install the following tools before proceeding:


    +   - Vagrant, from https://www.vagrantup.com/


    +   - VirtualBox, from https://www.virtualbox.org/


    +   - Git, from http://git-scm.com/downloads'
  - '[PAGE 82]


    # Versioning Basics


    In software development, the term **versioning** or, more accurately, **version
    control** refers specifically to this to:


    +   - track the changes of files over time and label those changes with helpful
    change messages


    +   - revert those files to any of their previous versions (an infinite number
    of "undo") operations


    +   - share those changes with others in a way that''s visible and immediately
    clear to every team member


    +   - enable more than one person to edit the same file at the same time, and
    being able to sync those changes


    +   - have a central location for all source code from which all other team members
    (and sometimes random enthusiasts) can grab your code and work on it


    Conceptually, version control in software development is similar to applying version
    control in other programs, as tracking people''s contributions in Google Docs
    documents, using the undo operation in Photoshop, and so on.


    While version control is important in any kind of development, it is especially
    precious in teamwork. The teams working on the same codebase share code snippets
    over email (so-called "patchbombs"), which required a lot of manual synchronization
    and administrative overhead in accepting changes and updates.


    With tools such as Git and GitHub, this changed.


    # Git and GitHub


    **Git** is an application for version control, or what is generally called a version
    control system (VCS). It handles all the points listed under what constitutes
    versioning, and more. **GitHub** is a variety of social network for coding, powered
    by Git.'
- md: "\n# Git\n\nGit is a command-line application that's generally without a GUI.\
    \ It's used strictly from the terminal or from within Git Bash, a tool that becomes\
    \ automatically available on Windows when you install Git.\n\nHelper tools with\
    \ graphical user interfaces exist—partially removing the need for manually punching\
    \ in commands—but in the vast majority of cases we require a version of the terminal.\
    \ From now on in this book, whenever there's an instruction like \"execute the\
    \ command git push\", it's assumed we are using the terminal or Git Bash to enter\
    \ the command.\n\nThrough Git, we can easily download repositories as Homestead\
    \ Improved from the last chapter without having to use the Download button. Instead,\
    \ we use a command called clone, like so:\n\n```\ngit clone https://github.com/swader/homestad_improved\n\
    ```\n\nNotice that we used GitHub in the URL. We'll explain that in the GitHub\
    \ section shortly.\n\n# How does it work?\n\nIn a nutshell, Git uses a hidden\
    \ .git folder inside your project's folder to track all the changes and previous\
    \ versions of the files. Whenever you make a new commit (that's a specially flagged\
    \ point in time when something changed in a given file or set of files), Git will\
    \ store a copy of the old version and new version in the .git folder so that we\
    \ can later refer to them if needed. That, if we need to undo a change, we will\
    \ use Git to reset to a previous point in time with, for example, git reset 47298720dbf,\
    \ where the code at the end is the name or flag of the commit. We'll link to a\
    \ more comprehensive Git guide at the end of this chapter. Reading it will make\
    \ you a Git master within a day or two, tops.\n\n# Jump Start PHP Environment\n\
    \nAlternatives Git is far from being the only VCS. There are others such as Mercurial,\
    \ SVN, CVS and many, many, more, but Git is the most widely used. It is the VCS\
    \ to use if you want to contribute open-source projects today, as the vast majority\
    \ of them use it. It is also what most powers GitHub, so you'll be part of the\
    \ pack from the get-go.\n\n# GitHub\n\nWhen using Git, you have the ability to\
    \ clone repositories from any remote endpoint, provided the code is there. For\
    \ example, if I have some source code and I put it on a live server (one accessible\
    \ to the Internet), then configure this server to accept Git calls, anyone who\
    \ has Git installed can clone this code by running:\n\n```\ngit clone https://myserver/myrepo.git\n\
    ```\n\nHowever, not everyone has the time, money, know-how, or patience to set\
    \ up a server to host code for others to access. This is where GitHub comes in.\n\
    \nGitHub is a website on which people can host their repositories for free, but\
    \ there's a catch—all repositories are immediately accessible to everyone. They're\
    \ public. Private repositories are supported, but cost money. This is ideal when\
    \ developing projects for clients that should be kept private—especially from\
    \ the client's competition. For free private repos, there are alternative websites\
    \ such as GitLab and Bitbucket, but those are not nearly as popular as GitHub,\
    \ hence why we'll use GitHub in this book. In your adventures, feel free to use\
    \ any service you like.\n\nBut why anyone want to use a service like GitHub for\
    \ their code? Apart from the obvious answer of being able to share your code with\
    \ others easily and for free, services such as GitHub can be lifesavers when your\
    \ project dies and you lose all its content. If you regularly pushed (a Git term\
    \ for “upload”) to the repository's remote—meaning GitHub URL—you're safe from\
    \ disaster: your entire file history is preserved and you can continue where you\
    \ left off on another computer. Furthermore, many other companion services exist\
    \ that integrate automatically with GitHub. One example would be Travis CI, a\
    \ service that checks the code to make sure it still works whenever changes to\
    \ a GitHub repository are detected. If something is wrong, Travis notifies you\
    \ via email and updates a little badge on the repo's main web page warning users\
    \ about the latest version.\n\nNow that we’ve covered the theory of Git and GitHub,\
    \ how about seeing it in action?\n\n# Git in Action\n\nLet’s learn using a practical\
    \ example. I recommend (and will assume) you put your projects into your home\
    \ folder, the path for which the shortcut is ~. If you opt to use a different\
    \ one, please adapt the code that follows.\n\n# Preparing the Environment\n\n\
    As we’ve done in previous chapters, we first need to configure a VM in which we’ll\
    \ do our experiments. We could do all on our host machine, but remember that the\
    \ end goal is to keep the host machine as clean as possible, all while using a\
    \ fully discardable and experiment-friendly environment for all the playing around\
    \ we can think of. Here’s what to do:\n\n- 1. Open Bash on Windows or Terminal\
    \ on OS X/Linux.\n- 2. Go into your home folder by executing the command cd ~.\n\
    - 3. Clone the homestead_improved repository into a folder named hi_phpenv with\
    \ the command: git clone https://github.com/swader/homestead_improved hi_phpenv.\
    \ You’ve just learned about git clone!\n- 4. Enter the newly made folder with\
    \ cd hi_phpenv.\n- 5. Execute bin/folderfix.sh\n- 6. Open Homestead.yaml and change\
    \ the sites block so that it looks like this:\n\n```\nsites:\n  map: phpenv.app\n\
    \  to: /home/vagrant/Code/phpenv\n```\n\n7. https://travis-ci.org/\n\n# Jump Start\
    \ PHP Environment\n\n7. Add a new entry:\n```\nsites:\n  map: phpenv.app\n  to:\
    \ /home/vagrant/Code/phpenv\n```\n8. Finally, add a new entry:\n```\nhttps://travis-ci.org/\n\
    ```\nIf you're unfamiliar with this, please see the chapter.\n\n# Creating a \"\
    Hello World\" page\n\nWith our environment ready, the path to learning Git and\
    \ GitHub is clear:\n\n- 1. In the hi_phpenv folder, create a new folder named\
    \ phpenv. You can do this either through your host machine's file explorer or\
    \ via the Terminal with mkdir phpenv.\n- 2. Make a new file called index.php and\
    \ give it the contents:\n```php\n<?php echo \"Hello World\";\n```\n- 3. Try it\
    \ works.\n\nWe now have our \"Hello World\" page. We're proud of our code and\
    \ want to share it with the world. Let's use Git and GitHub to do that.\n\n# Git\n\
    \nBefore we put anything on GitHub, we'll tell Git to turn our source code into\
    \ a repository.\n\n# Repo Initialization\n\n- While in the phpenv folder (that's\
    \ hi_phpenv), run git init. This is an initialization command that will create\
    \ an empty .git folder. It is hidden by default, but you can see it if you execute\
    \ ls -.\n- When developing with the power of a version control system as Git,\
    \ you might want to ensure certain files are never added to a repository. For\
    \ example, if you had a database password in a configuration file, it would be\
    \ unwise to let this file be accessible online, as it would leak your password\
    \ to everyone looking at your repo. For this purpose, ignore files exist. These\
    \ are special files for Git with the filename being .gitignore and contents that\
    \ list files to ignore line-by-line, so:\n\n```\npassword.php\nsensitive-folder/*\n\
    ```\n\nThis piece of code will make sure the password file and everything inside\
    \ the sensitive-folder is never added to a repository, nor ends up in anyone else's\
    \ clone of your code.\n\nIf you're using an IDE to write this code, and I hope\
    \ you are (see Chapter 2), you'll find that it likes to put its own helper files\
    \ into the project's root. For example, PhpStorm loves to make an .idea folder\
    \ and place some configuration values inside that pertain to the current project.\
    \ I definitely want to avoid having anyone who clones my code be forced to copy\
    \ my IDE configuration, so let's use an ignore file to prevent this.\n\nCreate\
    \ a .gitignore file in the folder with the command touch .gitignore, or from within\
    \ your IDE. Then edit and give it the contents of the file at https://gist.github.com/Swader/7844111\
    \ , which is an ignore file that takes into account all the various IDE and OS\
    \ configurations you can run into when working on PHP projects.\n"
  mdcn: "\n\n# Git\n\nGit 是一个命令行应用程序，通常没有图形用户界面（GUI）。它严格通过终端或 Git Bash 使用，Git Bash\
