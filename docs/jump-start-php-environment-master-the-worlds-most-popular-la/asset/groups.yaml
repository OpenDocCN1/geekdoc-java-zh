  mdcn: "\n\n大文件——人们不需要费力去寻找合括号。每一个 `for` 都有对应的 `endfor`，`if` 都有 `endif`，`foreach`\
    \ 都有 `endforeach`，以此此类推。这是一种便利，一点点语法糖。\n\n在上面的代码中，我们在注释上调用了 `findAll` 方法，该方法按提交顺序的反序（从新到旧）从数据库获取所有注释。然后，我们创建了一个\
    \ HTML `div` 块来包含我们的评论。内部有一个 `h3` 元素用于评论标题（关于谁在什么时候写了评论的信息），随后是一个 `p` 元素，它包含我们的评论文本。\n\
    \n`<?= $variable ?>` 结构是 `<?php echo $variable ?>` 的简写，在所有现代 PHP 版本中始终可用（注意，这不等同于短打开标签¹）。\n\
    \n就是这样——非常简单。让我们为 http://guestbook.app 测试我们的代码，如图 8.21 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_165_0.png)\n\
    \n图 8.21。它运行正常！\n\n¹⁴ http://php.net/manual/en/ini.core.php#ini.short-open-tag\n\
    \n# 启动 PHP 环境\n\n## CSS\n\n在整个过程中，我们唯一没有关注到设计。让我们加入一些基础的 CSS，只是为了让一切看起来好看一点。在\
    \ `<link rel=\"stylesheet\" href=\"css/main.css\">` 之下，添加这一行：\n\n```\n<link rel=\"\
    stylesheet\" href=\"css/custom.css\">\n```\n\n然后，创建 `public/css/custom.css` 文件并赋予以下内容（或从\
    \ http://bit.ly/envbook-style 粘贴）：\n\n```css\nbody {\n  padding: 10px;\n}\nform\
    \ {\n  width: 500px;\n  border: 1px solid silver;\n  border-radius: 3px;\n  padding:\
    \ 10px 10px 10px 4px;\n}\nform > input {\n  width: 100%;\n  margin-left:4px;\n\
    \  height: 35px;\n  border: 1px solid silver;\n  background: #cccccc;\n}\nform\
    \ > input:hover {\n  background: whitesmoke;\n}\nlabel {\n  display: block;\n\
    \  margin: 5px;\n  color: grey;\n}\nlabel > input {\n  line-height: 30px;\n}\n\
    ```\n\n```css\nlabel > {\n  display: block;\n  width: 100%;\n}\n\n.comment {\n\
    \  width: 500px;\n  border: 1px solid silver;\n  border-radius: 3px;\n  margin:\
    \ 10px 0;\n  background-color: lemonchiffon;\n}\n\n.comment > h3 {\n  margin:\
    \ 0;\n  border-bottom: 1px solid silver;\n  background-color: lightblue;\n  padding:\
    \ 3px;\n}\n\n.comment > p {\n  margin: 10px;\n}\n```\n\n这让我们丑陋的应用程序变得稍微容易看了，如图\
    \ 8.22 所示。\n\n# 启动 PHP 环境\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_168_0.png)\n\
    \n## 最后推送\n\n到此时，你应该精通推送流程了。进行最后一次推送，我们的应用程序就会以最终形式进入仓库。\n\n## 部署\n\n在本节中，我们将部署我们最出应用程序。关于部署的更多理论，请参见第\
    \ 6 章。\n\n## 在共享主机上部署 (Hostgator)\n\n正如我们在第 6 章讨论的，共享主机并不是一个好的选择。它不安全，资源通常非常有限（尽管有无限承诺），而且现在并不比\
    \ VPS 便宜。尽管如此，它可能是你唯一可以使用的，所以我们涵盖一种旧式的 FTP 部署是有意义的。\n\n# 通过示例学习：从零开始构建 Web 应用\n\
    \n共享主机通常使用 cPanel 作为管理服务器的一种，类似于图 8.23 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_169_0.png)\n\
