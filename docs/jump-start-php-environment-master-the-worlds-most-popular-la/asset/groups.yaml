- md: "\nbig files — one doesn't have to train one's eyes looking for closing braces.\
    \ Every for its endfor, if has its endif, foreach has an endforeach, and so on.\
    \ It's a convenience, a bit of syntactic sugar.\n\nIn the code above, we call\
    \ the findAll method on comment, the method which fetches all the comments from\
    \ the database in reverse order of submission (newest to oldest). Then, we create\
    \ an HTML div block to contain our comment. Inside we have an h3 element for the\
    \ comment's title (information on who wrote the comment and when) followed by\
    \ a p element, which will contain our comment's text.\n\nThe structure <?= $variable\
    \ ?> is short for `<?php echo $variable ?`, and is available in all modern PHP\
    \ version at all times (note that this is not the same as short open tags¹).\n\
