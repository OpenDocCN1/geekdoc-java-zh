  mdcn: "\n\n## 第四次推送\n\n再次进行 `add`, `commit`, `push`。不要死记这些命令。如果你能记住它们，宁可在之前的页面中查找，而不是去\
    \ Google 搜索。仅仅通过搜索来寻找解决方案在不不久的将来将成为你每天的苦差。真正的技能不在于知道某些事，而在于知道哪里可以找到知识（尽管诚实地说，你最终可能还是来到\
    \ StackOverflow）。\n\n## 发布和显示评论\n\n首先，让我们通过删除虚拟的评论创建逻辑来修改 `index.php`。PHP 部分（也就是我们新的起点）现在看起来像这样：\n\
    \n```php\n<?php\nrequire_once '../vendor/autoload.php';\n```\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_158_0.png)\n\
    \n## 在示例中学习：从零开始构建 Web 应用 137\n\n```php\n$file = './../storage/database.db';\n\
    if (is_writable('../storage/database.local.db')) {\n  $file = '../storage/database.local.db';\n\
    }\n$database = new medoo([\n  'database_type' => 'sqlite',\n  'database_file'\
    \ => $file\n]);\n$comment = new SitePoint\\Comment($database);\n\n?>\n```\n\n\
    到此时，我们已经设置了自动加载，配置了数据库实例，并且有了一个注入了数据库连接的 `Comment` 类实例。\n\n首先，让我们让发布新评论成为可能。\n\
    \n## 发布\n\n正如我们之前说的，当我们在浏览器中访问 URL 时，我们发出的是一个 `GET` 请求。`GET` 请求用于读取，它们不应该修改数据。这就是为什么我们的提交表单使用了\
    \ `method=\"post\"`，因此我们在提交表单后发送给应用程序的请求是一个 `POST` 请求。在 PHP 中，有诸如超全局（superglobals）之类的结构——可以在应用程序任何级别访问的变量（通常是数组）。这些超全局是\
    \ `$_GET` 和 `$_POST`。\n\n当我们访问类似 `http://some.url.com/?var=something&name=something-else`\
    \ 的 URL 时，`$_GET` 超全局数组看起来如下：\n\n```php\n$_GET = [\n  'var' => 'something',\n\
    \  'name' => 'something-else'\n];\n```\n\n换句话说，我们能够通过 `$_username = $_GET['name']`\
    \ 这种方法从应用程序的任何部分访问 URL 中的 var 和 name。\n\n`$_POST` 执行的是相同的操作，但针对的是通过 `POST` 请求从表单提交的值。当表单有一个名称为\
    \ `name` 的输入字段时，`$_POST` 超全局也会有一个 `name` 键，其中包含该字段的值。因此，正如我们将会看到的，在表单提交后，我们在表单中定义的值将体现在\
    \ `$_POST` 中。\n\n## 启动 PHP 环境\n\n首先，我们需要检测我们是否正在处理表单提交。在 `$comment` 行下方，但在闭合的\
    \ `?>` PHP 标签之前，我们放入以下内容：\n\n```php\nif ($_SERVER['REQUEST_METHOD'] == 'POST')\
    \ {\n    echo \"Form was submitted!\";\n}\n```\n\n第一行检测到我们正在处理表单提交。记得我们在 HTML\
    \ 的 `<form>` 标签中使用的 `method='post'` 吗？`$_SERVER` 元素是 PHP 中的另一个超全局，包含包含当前传入请求的信息（它是自动填充的）。在这种情况下，我们正在处理的是通过表单提交并使用\
    \ `POST` 方法的请求。\n\n如果我们现在刷新 `http://guestbook.app`，我们应该不会看到任何新内容。但如果我们点击表单上的保存按钮，我们应该看到“Form\
    \ was submitted!”。不过，有一个小问题。如果在提交表单后尝试刷新页面，我们将得到一个奇怪的警告，如图 8.18 所示。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_160_0.png)\n\
    \n在 Chrome 的世界里，刷新意味着完全重做——重复上一步操作，而不是重新渲染我们当前所在的 URL。当我们尝试刷新时，它想要重新发送整个表单信息。当我们手动输入\
    \ `http://guestbook.app` URL 并以这种方式访问时，这种情况不会发生，但在提交表单后刷新总是会产生这个警告。你会在其他网站上遇到这种情况，我们不需要用这个消息来吓我们的访客，所以我们会绕过它。现在，让我们处理这个提交。\n\
    \n将 `echo \"Form was submitted!\"` 替换为：\n\n```php\ndump($_POST);\n```\n\n然后，在评论表单输入一些数据并提交。你应该看到类似图\
    \ 8.19 的内容。\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_161_0.png)\n\n图 8.19.\
    \ 数据的转储\n\n注意我们在本章功能开始时安装的所有三个 `/var/dumper` 包（此处原文重复），它们的名称与它们来源的字段名称相同。\n\n\
    在像正在构建的这类系统中，从不可信用户那里接收数据的一个重要方面是**输入验证**。\n\n## 验证：永远不要信任用户输入！\n\n验证的黄金法是永远不要信任用户输入，因为你不知道某个精通代码的人何时会发现你的应用，并尝试向字段中输入恶意信息试图破坏你的应用（例如，输入触发数据库中命令的数据，也称为\
    \ SQL 注入¹²）。\n\n验证输入数据有许多方法，在这种情况下我们将使用一个名为 `particle/validator` 的极简主义包。让我们来安装它。\n\
    \n```bash\ncomposer require particle/validator\n```\n\n在 `require_once` 行上方放入：\n\
    \n```php\nuse Particle\\Validator\\Validator;\n```\n\n这导入了该类以便我们可以使用它的简短名称。然后，将\
    \ `dump($_POST)` 替换为：\n\n```php\n$v = new Validator();\n$v->required('name')->lengthBetween(1,\
    \ 100)->anum(true);\n$v->required('email')->email()->lengthBetween(5, 255);\n\
    $v->required('comment')->lengthBetween(10, null);\n\n$result = $v->validate($_POST);\n\
    \nif ($result->isValid()) {\n    echo \"Submission is good!\";\n}\n```\n\n`Validator`\
    \ 使用规则来定义约束。在这种情况下，我们使用了：\n- required: 确保字段为空\n- lengthBetween: 确保字符串长度在特定范围内\n\
    - anum: 确保输入是字母数字\n- email: 验证邮箱格式\n\n在像我们正在构建的系统中，从不可信用户那里接收数据的一个重要方面是输入验证。\n\
    \n## 在示例中学习：从零开始构建 Web 应用 139\n\n（等待，原文似乎重复了某些章节。）\n\n验证的黄金法是永远不要信任用户输入，因为你不知道某个精通代码的人何时会发现你的应用，并尝试向字段中输入恶意信息试图破坏你的应用（例如，输入触发数据库中命令的数据，也称为\
    \ SQL 注入²）。\n\n验证输入数据有许多方法，在这种情况下我们将使用一个名为 `particle/validator` 的极简主义包。让我们来安装它。\n\
    \n```bash\ncomposer require particle/validator\n```\n\n在 `require_once` 行上方放入：\n\
    \n```php\nuse Particle\\Validator\\Validator;\n```\n\n这导入了该类以便我们可以使用它的简短名称。然后，将\
    \ `dump($_POST)` 替换为：\n\n```php\n$v = new Validator();\n$v->required('name')->lengthBetween(1,\
    \ 100)->anum(true);\n$v->required('email')->email()->lengthBetween(5, 255);\n\
    $v->required('comment')->lengthBetween(10, null);\n\n$result = $v->validate($_POST);\n\
    \nif ($result->isValid()) {\n    echo \"Submission is good!\";\n}\n```\n\n等待，提供的文本在“启动\
