    GUI 将允许你通过分步设置，选择为你的环境所需的所有软件和配置值，最终生成一个 Vagrantfile，你可以通过它轻松地启动所需的环境。如果你想看相关的示例，SitePoint
    上 PuPHet 之后有一篇很棒的文章。⁶


    # 使用 Vagrant


    理论足够了，让我们尝试通过设置一个 Homestead（这是一个预配置的虚拟机）版本来使用 Vagrant，然后我将在下一节中解释一切。假设你已经安装了本章介绍部分提到的软件，请访问
    URL https://... 。完成后，点击图 4.5 所示的 **Download Zip** 按钮。


    ⁴ http://puphpet.com.

    ⁵ http://phansible.com/

