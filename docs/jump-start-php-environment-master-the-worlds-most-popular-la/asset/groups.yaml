    We could delete index.html and the server would once again serve index.php, but
    then we''d lose the advantages of H5BP. To get our content back, we:'
  - "[PAGE 146]\n\n# Jump Start PHP Environment\n\n+   open index.php, and end the\
    \ file with ?. That's the PHP closing tag, and it's how PHP knows it needs to\
    \ process no more programming logic. It's how it knows from that point on, all\
    \ it does is print the stuff it encounters to the screen. In pure PHP files, the\
    \ closing tag is usually omitted because it serves no purpose and can cause bugs¹,\
    \ but when using PHP and HTML in the same file, it's necessary.\n\n+   select\
    \ all contents of index.php, and place them in index.html, at the very top, before\
    \ <doctype>. Save the file.\n\n+   execute the commands:\n\n```\ncd public; rm\
    \ index.php; mv index.html index.php; cd ..\n```\n\nThe above deletes the old\
    \ index.php and turns the HTML file into a PHP one. This way, the server moves\
    \ directly to index.php again, but this time it also prints all the HSBP content\
    \ (the various HTML tags that are invisible to us, but useful to the browser and\
    \ mobile devices). Refreshing the app now produces our old content again.\n\n\
    # The HTML Form\n\nFinally, we can build the submission form.\n\nIn place of <p>Hello\
    \ world! This is HTML5 Boilerplate.</p>, we need to put the following:\n\n```\n\
    <form method=\"post\">\n    <input type=\"submit\" value=\"Save\">\n</form>\n\
    ```\n\nThis is the beginning and end of our form. The method attribute on the\
    \ opening form tag means \"send a POST request\". The default is GET which, when\
    \ a form is submitted, puts all the values of the various form elements into the\
    \ URL (e.g. http://guestbook.app?name=bruno&email=bruno.skvorc@sitepoint.com&comment=...)\
    \ is not what we want. GET is typically used for reading data from an app; a URL\
    \ you visit in a regular fashion, by clicking a link for example, is a GET"
