    # 实例学习：从零开始构建 Web 应用 109


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_131_0.png)


    没有错误是一个好迹。这意味着我们已经到达了空的 PHP 文件，并且它向浏览器返回了内容。在这种情况下，内容字面上是*空无*。


    # 框架与包


    第 7 章提到了“包”（packages）：它们是可重用代码的集合。然而，在包之上还有另一个层次：PHP 框架（frameworks）。


    **框架**是一组预定义的包集合，旨在快速启动应用程序；设置数据库连接、登录系统等传统过程都通过预构建来处理。这意味着，大多数框架要么具有强烈的“主见”性（即强制执行其特定的办事方式，例如
    Laravel²），要么具有极高的扩展性和超强可配置性，但属于过度设计（用数千行代码来处理几行代码就能完成的任务，都是为了保持完全的可配置性，例如 Symfony³）。


    在如今，框架通常是项目的默认起点。它们可以快速跳过对你的项目无关要的编码元素。一些开发者避开使用框架，因为他们认为它们要么太复杂，要么限制太大。


    > ² http://laravel.com

    > ³ http://symfony.com


    # 启动 PHP 环境


    尽管如此，当涉及到合同条款时，能够在几小时内专注于编写业务逻辑而不是几天，这可以决定一份工作的成败。


    在我们的情况下，虽然框架可以解决*某些*障碍，但它也会引入*更多*障碍。框架是复杂的整体，由数百个类组成，而我们还没有接触面向对象编程或设计模式——这些都是开发框架至关重要的广泛领域（参见“给想了解更多的人”章节中的链接）。因此，我们将采用老办法，通过
    Composer（我们在第 7 章中见过）在需要时引入我们需要的包。


    要开始启动我们的应用，我们将首先执行：


    ```

    cd ~/Code/guestbook

    composer init

    ```


    此命令通常用于启动新包（例如当我们打算开发一个可重用的包并托管在 Packagist 上——在第 7 章讨论过）。然而，它也用于启动新应用，因为它帮助开发者定义项目的元数据。执行后，Composer
    将询问一些信息，应如下所示回答：


    ```

    vagrant@homestead:~/Code/guestbook$ composer init


    Welcome to the Composer config generator


    This command will guide you through creating your composer.json

    ➜ config.


    Package name [<vendor>/<name>] [root/guestbook]: sitepoint/guestbook evenDescription
    [:]: A guestbook app

    Author [:]: Your Name Here <your@email.here>

    Minimum Stability []:

    Package Type []: project

    License [:]: MIT


    Define your dependencies.

    ```


    Would you like to define your dependencies (require) interactively

    - [yes]? no

    Would you like to define your dev dependencies (require-dev)

    - interactively [yes]? no


    最小稳定性（Minimum stability）允许开发者降低包的安全性。例如，我们想要使用的包可能还没有稳定版本；它可能处于 beta 模式。为了能够安装，我们必须在该选项下设置
    beta。在这种情况下，我们只需按回车保持默认值。


    包类型（Package type）告诉 Composer 这是一个项目而不是可重用的包。这对我们的应用本身几乎没有影响。许可证在 GitHub 博客上^4
    解释得相当清楚，你可以在 Composer 文档中^5 找到 composer.json（由 `init` 命令生成）中的其余选项。


    最后两个问题要求我们定义需要的包。我们还不知道，所以跳过它们。


    最后，我们生成自动加载文件：


    ```

    composer install

    ```


    由于 composer.json 的 `require` 或 `require-dev` 块中没有定义依赖项，因此没有需要安装的；该命令仅生成一个自动加载文件，将自动加载我们之后安装的类。让我们让
    public/index.php 使用以下内容：


    ```php

    <?php

    require_once ''./.vendor/autoloader.php'';

    echo "Hello World";

    ```


    该进行另一次手动测试了。在浏览器中重新 http://guestbook.app 会产生如图 8.4 所示的“Hello World”消息。如果是，说明 PHP
    代码成功执行过了 `require_once` 点，表明我们的自动加载文件加载无问题。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_134_0.png)


    图 4.“Hello World” 轻松加载


    require_once（参见 http://php.net/manual/en/function.require-once.php）是一个语句，告诉 PHP：“获取此文件的内容并将其放入当前文件中。如果找不到它，就崩溃吧！”
    `require` 部分确保了这一点。该语句还有其他版本，在手册页面上都有了解释。


    # 开发应用


    最后，是趣味的部分！或者不是呢？


    # Var Dumper


    我们将首先引入 var-dumper 包，这是来自 Symfony 框架的工具（参见“框架与包”章节）。


    与许多其他框架一样，Symfony 是解决常见 Web 问题的包集合。当作为一个整体使用时，它们为高度自定义的 Web 应用提供了一个坚实（尽管复杂）的起点。这些不同的
    Symfony 组件也设计为独立，因此如果用户采用自定义方法或不同的框架，也可以从 Symfony 包中获益。


    var_dump 是其中一个组件。PHP 有一个内置名为 `var_dump` 的函数，可以在屏幕上输出变量的内容。`var_dump` 组件提供了一个 `dump`
    函数，执行相同的操作，但方式更具可读性，并带有层/展开按钮。我们很快就会演示这一点；现在，让我们安装它：


    ```

    composer symfony/var-dump --dev

    ```


    `--dev` 选项告诉 Composer 将其放在 composer.json 的 `require-dev` 块中，因为这类调试辅助工具通常用于开发环境而非生产环境。对于生产环境中需要的包，我们只需省略
    `--dev` 标志，它们最终将进入 `require` 块。经验法是：如果一个包旨在仅在应用或另一个包的开发阶段使用，你可以将其放入 `require-dev`（通过省略
    `--dev` 选项）。然后，当我们把应用部署到生产环境时，将能够通过 `composer install --no-dev` 进行安装，使安装过程快得多。


    正如我们提到的，PHP 有一个内置的“变量转储器”——函数 `var_dump`⁶ 让我们用一个 PHP 数组试一下。如果你不确定数组是什么，请想象一个包含各种物品的盒子。在
    `index.php` 中，添加以下内容：


    ```php

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    ```


    代码中的方括号是我们假设的盒子的边缘——它们之间的所有内容都被放入数组中。


    然后，刷新 http://guestbook.app 页面，你应该能看到图 8.5 类似的景象。


    ⁶ http://php.net/manual/en/function/var-dump.php


    ```php

    <?php

    require_once ''./.vendor/autoload.php'';

    echo "Hello World";

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    ```


    ```

    Hello World

    array (size=5)

    0 => int 1

    1 => string ''apple'' (length=5)

    2 => int 2

    3 => string ''foo'' (length=3)

    4 => string ''bar'' (length=3)

    ```


    图 8.5. var_dump 示例


    输出在右侧，“Hello World”下方。它并不完全易读——对于安装了 Xdebug 的 Homestead（这是一种 PHP 插件，默认会让这类输出更漂亮）——但可以更好。让我们添加一个
    `dump` 调用。结果可以在 8.6 中看到。


    ```php

    <?php

    require_once ''./.vendor/autoload.php'';

    echo "Hello World";

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    dump($array);

    ```


    ```

    Hello World

    array (size=5)

    0 => int 1

    1 => string ''apple'' (length=5)

    2 => int 2

    3 => string ''foo'' (length=3)

    4 => string ''bar'' (length=3)


    array:5 [

    0 => "apple"

    1 => "apple"

    2 => "foo"

    3 => "bar"

    ]

    ```


    图 8.6. dump 示例


    更好了，不是吗？折叠/展开按钮非常有价值——你可以想象这在处理巨大的嵌套数组树时（数组可以包含数组，数组可以包含另一个数组，以此类……）是多么有用的。


    '
