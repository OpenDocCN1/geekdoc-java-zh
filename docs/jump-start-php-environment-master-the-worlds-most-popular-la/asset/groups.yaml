    尽管所有返回给服务器进行传输的内容实际上存储在服务器上，但我们仍称 CSS 和 JavaScript 为“客户端”，因为它们的计算发生在**浏览器**中。例如，如果我告诉
    JavaScript 让一个正方形变成圆形的动画，计算背后的数学工作将在浏览器中进行。服务器仅提供公式并告诉浏览器：“当你把这个带回给国王时，要这样说……”另一方面，服务器端编程意味着所有的逻辑、计算、公式等都在服务器上进行，仅返回最终结果。例如，如果我有一个网站，可以统计用户上传的图片数量（就像
    Facebook 统计你相中的图片数量一样），这种计算将在服务器上完成，只有当浏览器请求这些信息时，才会将最终数字给给浏览器。


    总结一下：前端是你编写并在浏览器中执行的代码（HTML、CSS、JavaScript），而后端是你编写并在服务器上执行的代码，并将最终结果传递给浏览器。PHP、服务器端
    JavaScript、服务器端 Dart、Ruby、Python 和其他编程语言都符合这一要求。


