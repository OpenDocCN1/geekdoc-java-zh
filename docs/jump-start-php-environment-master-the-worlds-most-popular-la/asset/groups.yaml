    ## index.php vs index.html


    Most servers are configured to first look for an index.html file, then for an
    index.php one. Indeed, if you refresh http://guestbook.app now, you''ll see the
    greeting page of H5BP, rather than our output from.


    We could delete index.html and the server would once again serve index.php, but
    then we''d lose the advantages of H5BP. To get our content back, we:


    - open index.php, and end the file with ?> That''s the PHP closing tag, and it''s
    how PHP knows it needs to process no more programming logic. It''s how it knows
    from that point on, all it does is print the stuff it encounters to the screen.
    In pure PHP files, the closing tag is usually omitted because it serves no purpose
    and can cause bugs¹, but when using PHP and HTML in the same file, it''s necessary.

    - select all contents of index.php, and place them in index.html, at the very
    top, before <doctype>. Save the file.

    - execute the commands:


    ```

    cd public; rm index.php; mv index.html index.php; cd ..

    ```


    The above deletes the old index.php and turns the HTML file into a PHP one. This
    way, the server moves directly to index.php again, but this time it also prints
    the stuff.


