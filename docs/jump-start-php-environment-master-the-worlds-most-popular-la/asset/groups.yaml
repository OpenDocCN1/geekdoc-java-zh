    \ git push”的指令时，我们假设我们正在使用终端或 Git Bash 输入该命令。\n\n通过 Git，我们可以轻松下载如上一章提到的 Homestead\
    \ Improved 仓库，而无需使用“下载”按钮。相反，我们使用一个名为 `clone` 的命令，如下所示：\n\n```\ngit clone https://github.com/swader/homestad_improved\n\
    ```\n\n注意我们在 URL 中使用了 GitHub。我们稍后会在 GitHub 章节中详细解释这一点。\n\n# 它是如何工作的？\n\n简而言之，Git\
