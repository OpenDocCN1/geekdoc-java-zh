    \ Virtual Machine”（你好，虚拟机）消息。\n\n## 定义新站点\n\n大多数情况下，你可能想为项目定义自定义的文件夹路径和站点 URL。让我们在刚刚使用的同一个\
    \ Homestead Improved VM 上定义一个新的站点。单个 VM 可以托管无限数量的应用/项目；取决于你决定如何为了测试或开发目的将它们分布在不同的机器/环境中。\n\
    \n再次打开 `Homestead.yaml` 文件。在 `sites` 下，添加另一个 `map /` 配对。确保缩进与上方的配对匹配，因为它们需要具有相同的缩进——这是\
    \ YAML 文件格式的规则。我将创建一个名为 `test.app` 的新站点，我的 `sites` 块如下：\n\n```\nsites:\n  - map:\
    \ homestead.app\n    to: /home/vagrant/Code/Project/public\n  - map: test.app\n\
    \    to: /home/vagrant/Code/test\n```\n\n这意味着：在 `/home/vagrant/Code/test` 文件夹中查找\
