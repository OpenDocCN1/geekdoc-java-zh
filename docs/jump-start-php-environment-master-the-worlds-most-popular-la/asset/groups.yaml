    ## 快速上手 PHP 环境


    ### 主机与虚拟主机


    当你在自己的电脑上进行开发时，不可能访问 http://mysite.com 这个 URL 并期望看到你的网站；毕竟，你的网站尚未上线——它不在互联网上。为了绕过这个问题并像它已上线一样看到我们的网站，我们通过定义虚拟主机来“伪造”互联网。


    简单来说，虚拟主机向安装在你电脑上的服务器程序发送一个指令，例如：如果用户在浏览器中请求 http://mysite.com，则通过 PHP 运行 file.php
    并在浏览器中显示其输出。


    如你所见，这与上线网站的请求流程几乎完全相同。但是什么让浏览器向我们自己电脑的服务器程序请求 mysite.com 域名，而不是在互联网的名称服务器上查找呢？这就是
    hosts 文件。


    hosts 文件是每个操作系统中都存在的一个特殊文件。我们早地在第一章的“进阶读者”章节中简要提到过它。它包含一个域名列表及其相应的 IP 地址，这样你电脑上的任何浏览器都可以读取并直接转到
    IP 地址，而无需与 DNS 通信检查去哪里。在 Windows 中，此文件位于 `C:\Windows\System32\drivers\etc\hosts`，在
    Linux 和 Mac 机器上它位于 `/etc/hosts`。如果你在这个文件中放入一个 IP-名称对，电脑就会遵守。我们现在就可以尝试一下。别担心——不会出任何错。


    **在 Windows 上**，进入搜索字段，输入“notepad”（记事本），一旦它出现，右键点击并选择**以管理员身份运行**。系统将要求你确认。在打开的窗口中，选择**文件
    > 打开**并转到：**我的电脑 > C > Windows > System32 > drivers > etc**。在记事本窗口的右下角，你可能需要选择**所有文件**，这样
    hosts 文件就会显示。双击打开它。


    在 Linux/Mac 机器上，通过搜索打开“终端”（Terminal）。**在 Linux 上**，在终端中输入 `sudo edit` 来以管理员身份打开默认文本编辑器。系统会要求你输入管理员密码。**在
    OS X 上**，输入 `sudo /Applications/TextEdit.app/Contents/TextEdit`，这将执行相同的任务。在这两个编辑器中，转到**文件
    -> 打开**并进入目录 `/etc` 寻找 hosts 文件。双击打开它。


    文件打开后，请注意前几行：它们都以井号符号 (#) 开头。这表示它们是注释，对文件没有影响。这些的作用是向用户解释文件的用途，它们在 PHP 中也是如此。


    现在，在所有注释行下方，添加以下行：


    ```

    208.117.229.217 bing.com

    ```


    保存文件并在浏览器中打开 http://bing.com。你刚刚成功地将所有指向微软搜索引擎 Bing 的请求重定向到了 Google！当然，我们不想保留这些更改；可以随时删除此行，或者在它前面加一个井号将其转为注释，然后保存文件。你应该能够再次正常地访问
    http://bing.com 了。


    通过这种方法，我们稍后会将浏览器对 http://mysite.com（这将是我们应用程序的示例域名）的请求重定向到我们自己的电脑服务器上。这将使我们能够能够在不部署的情况下测试网站的开发版本。


    ## 测试环境与维护


    测试环境（Staging environment）是一个独立的服务器（或多个服务器），包含生产环境的副本——也称为镜像。在较小的公司或项目中，通常会跳过测试环境。它的设计是尽可能地模仿生产环境，具有匹配的已软件版本、相同的配置值等。测试环境用于执行最终测试；例如，Facebook
    可能会重新设计首页，在将其部署到生产环境供所有用户使用之前，它会部署到其测试服务器上，以便员工（专职非程序员，即质量保证团队）可以像日常使用那样测试一切。如果一切顺利，就会发生从测试环境到生产环境的最终部署。


    测试环境超出了本书的范畴，但了解它是有好的。在虚拟机和小型丢弃型项目的时代，测试环境可能是不必要的，只有在较大的长期 Web 应用中才会发挥作用。


    这里还有维护模式（maintenance mode），这是我们在此语境下必须涵盖的术语。它是一种模式而不是一种环境，因为应用程序周围的环境没有改变——只有应用程序的状态在改变。


    ## AMP 集合的危害


    在开始 PHP 开发时，依赖这些预构建软件包也剥夺了你学习系统管理工作的。AMP 指的是 Apache、MySQL 和 PHP，最后的 P 代表 PHP。虽然在电脑上上一键安装所有所需软件很容易，但
    PHP 的危害在哪里？


    - 你的电脑将堆积了不必要的软件

    - 你的电脑会变慢，应用程序会变少

