    \ aspect of receiving data from untrusted users in systems like the ones we're\
    \ building is input validation.\n\n## Validation: Never Trust User Input!\n\n\
    The golden rule of validation is never trust user input, because you never know\
    \ when someone versed in coding will stumble upon your app and attempt to enter\
    \ malicious information into the fields in an attempt to break your app (for,\
    \ example, entering data which triggers commands in the database, also known as\
    \ SQL injection¹²).\n\nThere are many ways to validate input data, and in this\
