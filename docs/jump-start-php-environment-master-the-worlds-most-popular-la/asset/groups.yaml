    \ and we have an instance of the Comment class with the database connection injected\
    \ into it.\n\nFirst up, let's make it possible to post new comments.\n\n## Posting\n\
    \nAs we said earlier, when we visit a URL in a browser, we issue a GET request.\
    \ GET requests are for reading, they're not supposed to alter data. This is why\
    \ our submission form is using method=\"post\", so the request we send to our\
    \ app after submitting the form is a POST one. In PHP, there are constructs like\
    \ superglobals — variables (usually arrays) accessible at any level of the application.\
    \ Such superglobals are $_GET and $_POST.\n\nWhen we visit a URL like http://some.url.com/?var=something&name=something-else,\
    \ the $_GET superglobal array will look like this:\n\n```php\n$_GET = [\n  'var'\
    \ => 'something',\n  'name' => 'something-else'\n];\n```\n\nIn other words, we\
    \ will be able to access var and name from the URL in any part of the application\
    \ with an approach like $_username = $_GET['name'].\n\n$_POST does the same thing,\
    \ but for values submitted via a POST request, from a form. When a form has an\
    \ input field with the name name, then the $_POST superglobal will also have a\
    \ name key which will contain the value of said field. Thus, the values defined\
    \ in our form will have their values represented in $_POST after the form has\
    \ been submitted, as we'll see.\n\n## Jump Start PHP Environment\n\nFirst, we\
    \ need to detect we're dealing with a form submission. Under the $comment line,\
