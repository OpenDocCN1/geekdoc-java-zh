    ## Deployment


    Deployment is the act of sending a ready application to a live server so that
    it can be accessed by its target audience. It also includes pushing updates to
    an application online when a new feature is added or a bug is fixed.


    There are two types of deployment: manual and automatic.


    ## Manual


    Manual deployment involves actively recognizing the application is at a stage
    when it''s usable by the target audience, or at a stage matching the project specification—a
    document outlining the entire project''s development process.


    Once deemed ready, the developer takes one of several approaches to deploy the
    application:


    - FTP: in the ancient days of Web 1.0, File Transfer Protocol (FTP) was a way
    to transfer files (duh!) from one server to another. This approach is usually
    only seen in severely outdated systems and servers such as universities and schools,
    or shared hosting. Uploading files via FTP requires you to have a client installed
    on your computer as FileZilla or Cyberduck. You also need the credentials of the
    server—usually the server name, a username, and a password. If an application
    is already deployed and an updated one being deployed on top, the older one is
    usually overwritten, which opens the doors to a whole thorn of possible bugs.
    In regards to application deployment, there are better approaches and FTP should
    be avoided.


    > ⁹ https://filezilla-project.org/

    ¹⁰ https://cyberduck.io/?l=en


    ## Jump Start PHP Environment


    Rsync involves using a tool called rsync to synchronize the contents of two folders.
    Rsync works via SSH (Secure Shell)


    Pulling from a repository: this method uses the Git version control system (Chapter
    5) to push the changes live. Two approaches can be taken: a push can be made so
    that the code goes to a remote server. This is from the development environment—the
    local server. More commonly, a pull can be made This by the live server—the machine
    on which the code should eventually end up. Pulling code from development machines
    is usually not possible and generally discouraged, because opening up access to
    your development machine is a security risk. Instead, a push is first made to
    a central repository such as GitHub, and then the live server pulls from. This
    approach is the most common as it offers the safety and sanctity of infinite undo
    steps courtesy of version control, and removes any overwrites that may happen
    due to multiple people working on the same codebase and trying to upload at once.


    These are far from the only means of manual deployment, but they are the most
    popular ones. They''re somewhat tedious, though, and tend to take up time and
    resources that are better spent elsewhere. In software development, the general
    rule is to automate whatever can be. Which brings us to ...


    ## Automatic and Semiautomatic Deployment


    There are many tools for automatic deployment: Robo,¹¹ Deployer,¹² Envoy,¹³ Rocketeer,¹⁴
    DeployBot,¹⁵, and so on. They rely on certain pointers in the source code to know
    when a version of the application is ready for deployment, or on manual triggers
    from developers, and then take care of the rest automatically.


    > ¹¹ http://robo.li/

    ¹² http://deployer.org/

    ¹³ https://envoyer.io/

    ¹⁴ https://github.com/rocketeers/rocketeer

    ¹⁵ http://deploybot.com/


    Practical aspects of automatic deployers are outside the scope of this book but,
    simply, this is how they work:


    - 1. You work on some code and then make a commit in Git.

    - 2. You add this commit to the master branch, the main branch of your repository.
    Once developer ensures the release (the newest version of the app) is fine, you
    run a simple command such as `dep deploy` and the tool takes over the rest.

    - 3. A tool notices this commit to the master branch, automatically checks the
    code for errors, and if everything is well it sends it for you without even needing
    a finger.


    Fully automatic deployment of this kind can be risky, though. The tests in the
    application may not be robust, enabling some bugs to slip through because the
    application is unable to find its own. This is the best of both worlds; the machine
    does the heavy lifting, and the developer tells it to do.


    So, of all these tools and approaches, what''s the best combination to use?


    ## Recommendation


    I''d recommend using manual deployment with an intermediary GitHub repository,
    and using DigitalOcean for hosting, at least for the first few months. In time,
    you should definitely move towards automation—especially as more advanced such
    as database migrations, cache busting, and file permissions come into play—but
    for now, this approach will benefit a newbie the most.


    In subsequent chapters we''ll be putting this theory into practice by the tools
    we mentioned to deploy a sample application; however, there''s one more critical
    piece of the puzzle we need to cover first: Composer, the PHP package manager.
