    \ == 'POST') {\n    echo \"Form was submitted!\";\n}\n```\n\nThe first line detects\
    \ that we're dealing with a form submission. Remember how we used method='post'\
    \ in our HTML on the <form> $_SERVER element is another superglobal in PHP containing\
    \ information about the current request that's coming (it gets filled automatically).\
