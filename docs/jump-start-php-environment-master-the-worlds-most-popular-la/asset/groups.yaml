    # Learn by Example: A Web App from Scratch 109


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_131_0.png)


    No errors is a good sign. It means that our empty PHP file was reached, and gave
    the browser its content. In this case, the content is literally *nothing*.


    # Frameworks versus Packages


    Chapter 7 mentioned packages: they are sets of reusable code. There is, however,
    another level beyond packages: PHP frameworks.


    A **framework** is a predefined set of packages designed to quickly bootstrap
    an application; the traditional process of setting up database connections, login
    systems, and more are dealt with having it all pre-built. This means most frameworks
    are either very opinionated (that is, enforce their particular way of doing things,
    such as Laravel²) or incredibly extensible and hyper-configurable, but over-engineered
    (thousands of lines of code handling what could be done in a dozen lines, all
    for the sake of remaining fully configurable, such as Symfony³).


    These days, frameworks are often the default starting point for a project. They
    can be a quick way to skip coding elements that are minor to your project. Some
    developers shy away from using frameworks because they see them either as too
    complex or too restrictive.


    > ² http://laravel.com

    > ³ http://symfony.com


    # Jump Start PHP Environment


    Still, when contracts are at stake, being able to focus on programming the business
    logic in a matter of hours rather than days can make or break a job.


    In our case, while a framework would get *some* hurdles out of the way, it would
    introduce *more*. Frameworks are complex beasts consisting of hundreds of classes,
    and we''re yet to touch on object-oriented programming or design patterns—broad
    disciplines essential to tanning a framework (see the links in the section called
    “For Those Who Want More”). Therefore, we''ll be doing it old-school and pulling
    in the packages we need, as we need them, with Composer, which we saw in Chapter
    7.


    To begin bootstrapping our app, we''ll first execute:


    ```

    cd ~/Code/guestbook

    composer init

    ```


    This command is generally used for bootstrapping new packages (as in when we intend
    to develop a reusable package and host it on Packagist—discussed in Chapter 7).
    It is, however, for bootstrapping a new app as well, as it helps the developer
    define metadata about the project. Once executed, Composer will ask for some information,
    which should be answered like so:


    ```

    vagrant@homestead:~/Code/guestbook$ composer init


    Welcome to the Composer config generator


    This command will guide you through creating your composer.json

    ➜ config.


    Package name [<vendor>/<name>] [root/guestbook]: sitepoint/guestbook evenDescription
    [:]: A guestbook app

    Author [:]: Your Name Here <your@email.here>

    Minimum Stability []:

    Package Type []: project

    License [:]: MIT


    Define your dependencies.

    ```


    Would you like to define your dependencies (require) interactively

    - [yes]? no

    Would you like to define your dev dependencies (require-dev)

    - interactively [yes]? no


    Minimum stability allows the developer to lower the safety barrier for the stability
    of packages. For example, a package we want to use might be without a stable version;
    it might be in beta mode. To be able to install it, we''d have to set beta under
    that option. In this case, we''re just hitting Enter to leave it at default.


    Package type tells Composer that this is a project rather than a reusable package.
    This has little to no effect on our app per se. License is rather well-explained
    on the GitHub blog.^4 and you can find out the rest of the options in composer.json
    (which command init generated) in Composer''s documentation.^5.


    The final two questions ask us to define which packages we''ll need. We don''t
    know yet, so we''ll skip them.


    Finally, we generate the autoload file:


    ```

    composer install

    ```


    As there are no dependencies defined in either the require or the require-dev
    block of composer.json, there is nothing to install; the command merely generates
    an autoload file that will automatically load classes we''ll install later. Let''s
    use that public/index.php this content:


    ```php

    <?php

    require_once ''./.vendor/autoloader.php'';

    echo "Hello World";

    ```


    Time for another manual test. Revisiting http://guestbook.app in the browser produce
    the message "Hello World" as shown in Figure 8.4. If it does, the PHP code was
    successfully executed past the require_once point, indicating that our autoload
    file was loaded without problems.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_134_0.png)


    Figure 4. "Hello World" loads with ease


    require_once (see http://php.net/manual/en/function.require-once.php) is a statement
    telling PHP to "Take the contents of this file and put them into the current one.
    Crash if you cannot find it!" The require part makes sure of this. There are other
    versions of this statement, all explained on the manual''s page.


    # Developing the App


    At last, the fun part! Or is it?


    # Var Dumper


    We''ll begin by pulling in the var-dumper package, a tool from the Symfony framework
    (see the section called "Frameworks versus Packages").


    Like many other frameworks, Symfony is a collection of packages for solving common
    web application problems. When used as a set, they form a solid (albeit complex)
    starting point for highly customizable web applications. These various Symfony
    components are also designed to be standalone, so if users adopt a custom approach
    or different framework, they can benefit from Symfony packages.


    var_dump is one such component. PHP has a built-in function called var_dump that
    outputs the contents of a variable onscreen. The var_dump component provides a
    dump function that does the same, but in a more readable manner and with layer/expander
    buttons. We will demonstrate this shortly; for now, let''s install it:


    ```

    composer symfony/var-dump --dev

    ```


    The --dev option tells Composer to place it in the require-dev block of composer.json
    is because debugging helpers of this kind are typically used in development, rather
    than production. For packages that are required in production, we simply omit
    the --dev flag and they''ll end up in the require block, require-dev. The rule
    of thumb is: if a package is meant to be used only during the development phase
    of an app or another package, you can put it in require-dev (by omitting the --dev
    option). Then, when we deploy our app to production, we will be able to install
    with composer install no-dev, making the installation process much faster.


    As we''ve mentioned, PHP has a built-in "variable dumper"—the function var_dump⁶
    Let''s try it out with a PHP array. If you''re unsure what an array is, imagine
    a box that contains a variety of items. In index.php, add the following:


    ```php

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    ```


    The square brackets in the code are the edges of our hypothetical box—everything
    between them is placed into the array.


    Then, refresh the http://guestbook.app page, and you should see a similar sight
    to Figure 8.5.


    ⁶ http://php.net/manual/en/function/var-dump.php


    ```php

    <?php

    require_once ''./.vendor/autoload.php'';

    echo "Hello World";

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    ```


    ```

    Hello World

    array (size=5)

    0 => int 1

    1 => string ''apple'' (length=5)

    2 => int 2

    3 => string ''foo'' (length=3)

    4 => string ''bar'' (length=3)

    ```


    Figure 8.5. var_dump example


    The output is on the right, under "Hello World." It''s not exactly readable—as
    Homestead Improved with Xdebug installed, a PHP add-on that makes these types
    of output prettier by default—but it could be better. Let''s add in a call to
    dump. The result can be seen in 8.6.


    ```php

    <?php

    require_once ''./.vendor/autoload.php'';

    echo "Hello World";

    $array = [1, "apple", 2, "foo", "bar"];


    var_dump($array);

    dump($array);

    ```


    ```

    Hello World

    array (size=5)

    0 => int 1

    1 => string ''apple'' (length=5)

    2 => int 2

    3 => string ''foo'' (length=3)

    4 => string ''bar'' (length=3)


    array:5 [

    0 => "apple"

    1 => "apple"

    2 => "foo"

    3 => "bar"

    ]

    ```


    Figure 8.6. An example of dump


    Better, no? The collapsers/expander button is worth it—you can imagine this being
    tremendously useful when dealing with huge trees of nested arrays (an array can
    contain an array, which can contain another array, and so on...).

