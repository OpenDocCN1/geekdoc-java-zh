    ## 第 4 章

    ## 虚拟机


    在本章中，我们将学习虚拟化技术，以及为什么它对于高质量的开发体验至关重要。我们将使用如 Vagrant 等行业标准工具，并讨论如何让虚拟机的使用更加用户友好，以便让更广泛的受众能够接触。


    即使你对虚拟化非常熟悉，我仍然建议阅读这一章，因为其中无疑包含对你来说是新的信息。它还将解释并演示我们在本书剩余部分中将一直使用的 VirtualBox（虚拟机盒）。


    为了使用本章介绍的工具，你需要在计算机上安装一些软件。这些软件是跨平台的，因此无论你使用什么操作系统，都有适用于你的对应版本。


    在继续之前，请确保你已经安装了以下内容：


    - Vagrant，来自 https://www.vagrant.com/

    - VirtualBox，来自 https://www.virtualbox.org/

    - Git，来自 http://git-scm.com/downloads


    ## 44 快速上手 PHP 环境


    所有链接都包含了每个主要操作系统的安装指南。


    ## 虚拟机详解


    在使用虚拟机（VMs）之前，我将先解释它们是什么，以及它们在 Web 开发背景下的含义（这两个是不一样的！）。


    ### 什么是虚拟机？


    你的计算机是一台机器。它包含了 CPU、GPU、一些内存、硬盘等硬件。你需要所有这些硬件来运行你的操作系统以及安装在其中的应用程序。**虚拟机**是一种特殊的应用程序，它预留你计算机的一部分，并假装自己是一台独立的真实机器。例如，虚拟机可能会从你的主机上预留部分
    CPU 和 2GB 内存，以及 20GB 硬盘空间。这些资源随后被汇聚成一个整体（如图 4.1 所示），它可以作为一台计算机独立运行。它拥有自己的独立于宿主机操作系统（*宿主机*）的操作系统，并安装了自己的应用程序。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_66_0.png)


    图 4.1 虚拟机的可视化


    操作系统——事实上，不同机器的整个环境（宿主机和运行在宿主机上的虚拟机）是完全独立的，实际上，它们彼此感知不到。宿主机知道自己的可用资源较少，但并不知道它们不是真实的；它*认为*它们是真实的硬件部分。


    虚拟机，从字面上说，是计算机中的计算机。有些人使用它们是为了在没有原生支持的操作系统上运行视频游戏；例如，在 Linux 系统上运行 Windows 游戏。安全公司将它们作为沙箱，在这些环境中让他们允许病毒或潜在的恶意代码运行而不担心后果：如果虚拟机损坏了，只需两条简单的命令即可重建（毕竟它是虚拟的！）。企业公司将它们用作避免更新软件的方法。与其花费数十亿美元重写软件（因为他们的内部应用程序依赖
    Windows XP，而最新版本是 Windows 10），他们愿意花更少的钱购买 Windows XP 许可并在 Windows 10 宿主机内部运行 Windows
    虚拟机，从而让他们在享受新宿主机操作系统更高安全性的同时延长软件的使用寿命。


    在开发中，虚拟机被用作应用程序的隔离环境。你可以在其中安装不同版本的 PHP 和 MySQL，并且你可以破坏任何东西，因为虚拟机可以很容易地重置为原始状态。这使得虚拟机非常有吸引力，不仅可以在不同操作系统上的不同版本
    PHP 上测试代码，还为了实现开发/生产环境的一致性（在第 3 章讨论过）：它允许你配置虚拟机使其尽可能像在线服务器，从而能够像在线运行一样测试代码，最大限度地减少错误。


    ## 认识 VirtualBox 和 Vagrant


    VirtualBox 是我们在本章介绍中安装的软件之一，用于*运行*虚拟机。Vagrant 在 Vagrantfile 的帮助下知道它需要做什么，该文件包含了如何设置环境的所有指令，使得创建新箱（box）的过程变得更简单。


    VirtualBox 具有许多功能，包括但不限于与宿主机共享文件夹。如图 4.2 所示，这就是 VirtualBox 的功能。


    ### 快速上手 PHP 环境


    在仅有 VirtualBox 的世界里，输入此类命令通常是枯燥、易出错且极其耗时的（尽管可行！），而 Vagrant 帮助缩短过程，使其能够极快地运行。


    ## 虚拟机


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_69_0.png)


    图 4.3 虚拟机的操作


    ### 虚拟机的优势


    总结一下，使用虚拟机的优势是：


    - 它们很容易销毁并重置为初始状态

    - 你可以在宿主机上使用你喜爱的应用程序

    - 通过配置虚拟机与你的在线服务器相似，你可以实现开发/生产环境的一致性

    - 你可以学习系统管理

    - 使用虚拟机对你的宿主机无法造成任何伤害，因为它们是完全隔离的

    - 很容易与其他共享整个配置（通过发送 Vagrantfile），让他们在自己的机器上拥有完全相同的设置

    - 不需要在你的宿主机上安装 PHP、服务器和数据库，从而保持你的主操作系统的整洁和快速


    ## Vagrant 概览


    Vagrant 是一个通过另一个应用程序（在本例中为 VirtualBox）使用简单命令创建虚拟机的程序。Vagrant 在 Vagrantfile 的帮助下知道它需要做什么，该文件包含了设置环境的所有指令。


    ## Vagrant Boxes


    所有的 Vagrant boxes 可以在 https://hashicorp.com/boxes/search 找到。这些箱由其他人预配置并免费提供给所有人。你可以找到从基础的操作系统安装到与特定软件兼容的全配置环境的所有内容。


    '
