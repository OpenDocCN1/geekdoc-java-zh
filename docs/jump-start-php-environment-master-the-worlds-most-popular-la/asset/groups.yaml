    # Provisioning


    A provisioner is a tool used to automatically install prerequisite software onto
    a machine (whether or not). Provisioners are often used in live servers as well
    to bring them up to par with the requirements of the application being deployed.
    Some popular provisioners are Ansible, Puppet², and Chef³. A provisioner accepts
    a recipe, a list of steps required to prepare an environment for an application.


    For example, assuming we''re to build a PHP application, we might have a provisioner
    do the following for us on a bare-bones Vagrant box:


    +   - install Git

    - install PHP

    - install some PHP extensions

    - install MySQL

    - set the default MySQL username and password

    - download sample database data and import it into MySQL


    Doing all manually is tedious and error-prone. Provisioners have the awesome ability
    of taking care of operating system differences for us so they can be run on our
    virtual machine, live server, staging server, and so on. They always perform the
    same operations and produce the same result: the prerequisites to run our application
    will be taken care of for us.


    Vagrant integrates closely with the various provisioners and employs them to set
    up the environments we tell it to set up. Thus, when booting up a Vagrant box
    the virtual machine is started first, followed by the designated provisioner.
    There''s no need to know about provisioners at this point, but there will be links
    to some resources about them at the end of this chapter. We''ll be using a preconfigured
    Vagrantfile for our experiments in this chapter, along with an already preconfigured
    provisioning script, in order to keep matters simple and newbie-friendly.


    ¹ http://www.ansible.com/

    ² https://puppetlabs.com/

    ³ https://www.chef.io/chef/'
