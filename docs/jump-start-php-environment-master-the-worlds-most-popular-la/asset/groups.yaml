    ## Jump Start PHP Environment


    To add the files and folders we created so far to the repo and push them online,
    we execute:


    ```

    git add -A; git commit -m "First commit"; git push -u origin master

    ```


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_144_0.png)


    All the files we created thus for 8.12 (including the database) are now online,
    as you can see in Figure 8.12. Please note that when developing applications with
    databases that contain sensitive information (like usernames, passwords, or emails),
    the database files should **never** be committed to the repository for obvious
    reasons.


    ## HTML Form


    When starting new web projects, there is a useful "boilerplate" we can use with
    some best practices built in. While using it is optional, it''s preferred purely
    because when one starts from scratch and implements best practices manually, one
    tends to eventually end up at the point of this pre-made boilerplate. That boilerplate
    is called **HTML5 Boilerplate** or H5BP and can be downloaded at https://htmlboilerplate.com/.


    Unzip its contents into the **public** folder of our project, so that it now looks
    like Figure 8.13.


