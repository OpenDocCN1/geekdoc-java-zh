    The browser then given 404 page.


    I trust that chapter was created with the concepts presented and helped you get
    your bearings in where you are (or will be) in the grand scheme of PHP. In the
    section that follows, you will find some more technical information on web requests
    and DNS servers.


    ## For Those Who Want More


    ### DNS Servers


    As mentioned before, every domain (such as example.com) on the Internet is bound
    to a specific IP address (such as 93.184.216.34). An IP address is a set of numbers
    identifying a given server. In other words, IP addresses tell the browser how
    to navigate the Internet to find the computer (server) it''s looking for. A DNS
    server (also known as name server) knows which IP addresses match which domain
    name, and tells the browser where to go next.


    When trying to find out matches a domain name, the browser first checks its own
    cache—a saved list of visited domains. Every browser maintains this list and periodically
    refreshes it. If it finds the domain-IP combination in its own cache, the site
    loads faster because there''s no need to ask the DNS server for it. If the domain
    isn''t cached, the browser asks a program called the resolver (which is built
    into your operating system) to check the hosts file on the computer it''s installed
    on. The hosts file maps to IP address. (We''ll be learning to use this file in
    later chapters.) If the necessary information isn''t there, the DNS cache on the
    router (routers usually have one) is checked, and if it''s not found there, the
    ISP''s DNS server is asked.

