- md: "\n# Database Connection\n\nThere are many databases available: MySQL, OracleDB,\
    \ PostgreSQL, MSSQL, SQLite, and so on. The most popular one to use in tandem\
    \ with PHP is MySQL. Introducing SQL is outside the scope of this book, but it's\
    \ necessary for our purposes anyway—we'll be using a library that abstracts database\
    \ communication for us.\n\nTo understand abstraction, imagine a power socket in\
    \ the EU. It looks like a pig snout, and we call it the Schuko socket, seen in\
    \ Figure 8.7.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_137_0.png)\n\nFigure\
    \ 8.7. Schuko socket, common to the EU\n\nThen imagine a power socket in the US,\
    \ seen in Figure 8.8. It has two vertical slits and a screaming mouth that is\
    \ completely incompatible with the EU one.\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_138_0.png)\n\
    \nFigure 8.8. US socket\n\nEvery part of the world has its own standard and if\
    \ you’re a world traveler, carrying a separate power brick for each country you\
    \ visit would quickly take you past the airline’s baggage weight limit (and your\
    \ budget). Luckily there are items such as socket adapters.\n\n8 http://www.worldstandards.eu/electricity/plugs-and-sockets/\n\
    \n# Learn by Example: A Web App from Scratch\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_139_0.png)\n\
    \nFigure 8.9. A universal socket adapter\n\nOne beast such as the one in Figure\
    \ 8.9 handles most of the world’s power sockets. Is it heavier than just carrying\
    \ one laptop power brick and hoping your destination supports the required socket?\
    \ Yes, but for a few additional grams, you have all the convenience of ten power\
    \ bricks with a fraction of the weight. The adapter is an abstract for a power-providing\
    \ service.\n\nThe same happens with abstraction in software. We could learn how\
    \ to communicate with Postgres, SQLite, MySQL, MSSQL, and others. It would take\
    \ a while, but it’s possible—just like getting around ten power bricks. Or we\
    \ could rely on abstraction—letting the authors of the package we put between\
    \ the database and us do the heavy lifting while we focus on usage.\n\n# Jump\
    \ Start PHP Environment\n\nOne such database abstraction layer is the very lightweight\
    \ Medoo package. At only 20KB in file size added to our project, we have the power\
    \ to communicate with several database engines in exactly the same way.\n\nWe'll\
    \ demonstrate this in an example soon. Now, let's install Medoo:\n\n```\ncomposer\
    \ require catfan/medoo\n```\n\nChange the index.php file so that instead of the\
    \ $array, var_dump and dump lines added before we now have:\n\n```php\n$database\
    \ = new Medoo(\n  'database_type' => 'sqlite',\n  'database_file' => '../storage/database.db'\n\
    );\n```\n\nThe variable $database is there to hold a new instance of the Medoo\
    \ class. The class needs a type and a filepath as the constructor arguments—the\
    \ values required for a class to build its instance properly—so we pass them all\
    \ in an array. (Notice the square brackets—just like in the array example earlier).\
    \ The arrows between the left and right column indicate assignment between keys\
    \ and values—just as in algebra x = 3, so too database_type = sqlite. For links\
    \ on crash courses in object-oriented programming, please see the end of chapter.\n\
    \nI understand this may feel a bit frustrating if you struggle to fully comprehend\
    \ the code here and what follows. However, rest assured that understanding the\
    \ code itself is not all that important; the main aim of this book is to see an\
