    \ environment and the deployment of an app. Everything learned in between is what\
    \ I'd call collateral profit.\n\n# What will we be building?\n\nWe'll craft a\
    \ guestbook application. If you're a young millennial, you might not know what\
    \ a guestbook application is. A guestbook application was, in the ancient times\
    \ of the simpler Web, a way to leave feedback on a site; it applied to the site\
    \ in general, rather than being comments on a particular article or post, like\
    \ it is today.\n\nGuestbooks are rarely encountered these days, but the principles\
