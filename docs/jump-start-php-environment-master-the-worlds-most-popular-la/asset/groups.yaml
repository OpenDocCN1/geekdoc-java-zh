    \ braces in logic constructs such as if, for, and others; and more.\n\nWe strongly\
    \ recommend using PSR-2. It's the vast majority of high-quality projects out there,\
    \ making your coding style instantly compatible with that of many, many developers.\
    \ It will also prepare you for reading their code fluently. With an IDE, this\
    \ becomes incredibly easy. For example, in PhpStorm, you would go to File > Settings\
    \ > Editor > Code Style, and select PSR1 (PSR-2 improves upon PSR-1, so this option\
    \ applies both). Note: depending on your version of PhpStorm, you might also have\
    \ to select Set From in the Code Style windows. In other IDEs, it’s as simple\
    \ as googling for the phrase “PSR-2 in EDITOR” where EDITOR is your IDE of choice.\
    \ It will yield a plethora of results.\n\n# The Command Line / Terminal\n\nFinally,\
    \ let’s briefly look at the command line or terminal. First, a clarification on\
    \ the terminology."
