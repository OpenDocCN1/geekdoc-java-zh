    # Jump Start PHP Environment


    by Nginx (another server program that''s competition to Apache, pronounced "engine
    x"). Uh-oh, what now?


    We could update PHP to a newer version and check whether app1 still works, how
    do we not keep developing accidentally using code that''s unavailable in PHP 5.3
    if our entire computer is now running 5.6? Likewise, we could upgrade MySQL to
    5.1 and check that it still works, but how do we know MySQL didn''t throw out
    some features in version 5+ that would break app2 if we fixed app1 to work on
    5.1? After all, app2 still needs to work on 4.0 because it''s probably still deployed
    on such a production server. Heck, how do we handle the Apache version Nginx problem?
    Do we install both servers on our computer and test for each? How do we switch
    them out? How do we ensure that we remember to test our one while the other is
    running?


    And that''s just for two apps. Now imagine if you had to deal with a dozen applications
    from different clients, each with different requirements. It all stops being very,
    very fast.


    This separation of different software versions is easy to solve by means of virtual
    machines, which we''ll talk about Chapter 4.


    # The Unclean Mess


    Finally, if we try to install a new version of PHP, but something goes wrong?
    This scenario is especially common in OS X and Linux—now none of the PHP versions
    we have installed on the machine work and it''s proving impossible to get a single
    site to run. What a mess! Instead of reverting to a previous running state, we
    are forced to spend the entire day debugging our own system and trying to make
    it run—not necessarily the right version, but just run.


    Wouldn''t it be great if we could just enter a command and have things go back
    to the way they were 10 minutes ago? Well, we can! This, too, will be demonstrated
    in Chapter 4.


    # Production/Development Parity


    This complicated-sounding phrase is actually very simple—we''ve actually indirectly
    touched on it before. Production/development parity means nothing more than having
    the production and development environment as similar as possible to each other,
    preferably identical, so that anything you develop will automatically run in production
    without any excessive configuration or additional debugging or tweaking.


    Achieving parity is very important for one''s workflow due to the enormous amount
    of time it saves. Avoiding having to do any additional work for your application
    to run in production means having the freedom and time to focus on important business-related
    problems that actually benefit your application''s context, rather than being
    stuck in a rut of constantly catch-up. Making a change in development and having
    to make two changes in production for that to become is tedious at best and detrimental
    to a project''s health at worst. You never know who on the team will slip up and
    cause the app to greet people with an error screen.


    The best way to achieve parity is by having the exact same software running in
    your development environment as you do in production environment. For example,
    if you''re aiming to deploy your application to production onto a server running
    the Ubuntu Linux version 14.04 operating system, it''s best that you develop on
    that operating system as well. However, what if we were running Windows, because
    we like to consume advanced multimedia content such as games, or we need powerful
    image and video manipulation software that just? Would we forsake all our other
    interests, install Linux over Windows, and strive for parity over anything else?
    Or should we just forfeit parity and risk it while keeping our computer powerful,
    beautiful, and stable, sticking to our operating system of choice?


    Fortunately, there''s a third way that allows you to achieve the best of both
    worlds: virtual machines (covered in Chapter 4).


    # Performance and Debugging


    The last aspects of the application environment we to touch on is ensuring that
    the app is fast (performance) and bug-free (debugging). This section is entirely
    theoretical; it''s just you know what to expect later on when we come across some
    of terms.


    Performance is achieved through various methods of optimization. Contrary to the
    word''s meaning, in application development optimization often has several layers
    and is rarely the change that immediately brings about the perfect solution. Performance
    includes, but is not limited to, several areas:


    # Optimizing the database


    Often the slowest part of any website, the database can benefit from additional
    optimizations after it''s been running for a while and the bottlenecks (the parts
    that are the slowest because they''re unable to process the number of incoming
    requests fast enough) become apparent. Methods for database optimization include
    setting up indexes, splitting reads and writes, changing database engines, caching
    fetched data, and other mystical-sounding phrases.


    # Optimizing the front-end assets


    We mentioned compilation and building early—it''s how we optimize the website''s
    front end. When a website is shown to users, they see output comprised of images,
    HTML, CSS, and JavaScript, all of which need to be downloaded and executed in
    the browser as explained in Chapter 1. The smaller these files are—and the fewer
    the are—the faster a website loads. Often, a website will have multiple CSS files
    and multiple JavaScript files. Combining each type into one bigger CSS or JavaScript
    yields dramatic increases in a website''s download speed. Another front-end asset
    optimization trick often done is serving images via a content delivery network,
    or CDN, a third-party service that hosts your images for you and ensures that
    the visitor to your website downloads them from a server closest to them, thereby
    further increasing speed. One can also reduce image size, create an image sprite
    by placing images into one file, and more.


    # Optimizing the back end


    This is also a compiling/building step. Test files are ignored, and files are
    merged into bigger ones.


    # The Application Environment


    **Caching** is saving previously needed for later. If you ask the server, it will
    count the. If you change something in your application, you can easily run this
    test (which is still there) and check that this conversion works. This sort of
    workflow ensures that you can upgrade your application later without fear of breaking
    something you built before and forgot about.


    So, how does one measure performance or find bugs? There are many tools for **profiling**
    (that''s what finding bugs is). Two of the better ones are Z-Ray and Blackfire.
    Caching is so important in language such as C++.


    > Beware Micro-optimization

    > It''s important to note that a common newbie error is micro-optimizing. For
    example, it was once believed that using single quotes with strings ($var = ''Some
    String'') was faster than double quotes ($var = "Some String"). The performance
    gains such an optimization can make the table are negligent and almost insignificant;
    instead, improving a SQL query or calling a remote call will always be an order
    of magnitude greater. When in doubt, benchmarks and real data (such as those from
    Z-Ray or Blackfire), never your gut.


