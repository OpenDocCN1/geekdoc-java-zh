    # Learn by Example: A Web App from Scratch 153


    sp-env ACTIVE | 188.166.15.57 | 512MB Ram | 20GB SSD Disk | Amsterdam 3 Ubuntu
    14.04 x64


    - Access

    - Power

    - Resize

    - Snapshots

    - Settings

    - Backups

    - Graphs

    - History

    - Destroy


    ### Console Access

    This will open a vNC connection to your Droplet and is the equivalent of plugging
    in a monitor and keyboard device to your virtual server.


    ```

    Console Access

    ```


    ### Reset Root Password

    This will shut down your Droplet and a new root password will be emailed to you.

    Do you wish to proceed?


    ```

    Reset Root Password

    ```


    Figure 8.29. Droplet dashboard


    Notice the IP address underneath its name. Right now, it won''t lead anywhere
    if it''s put in your browser''s URL field. We can, however, use it to log into
    your server (whenever you see IP-ADDRESS below, substitute for the IP of your
    own droplet):


    ```

    ssh root@IP-ADDRESS

    ```


    Use the password from the email when prompted. As soon as you''re logged in, you
    will be asked to change the root password. Change it to something familiar but
    not easily guessable. My recommendation would be using a password manager to generate
    a random one, and then just paste from here in the future.


    Once you''re in the server, a welcome message might display a warning about locales.
    This can be fixed by running:


    ```

    sudo locale-gen en_US.UTF-8

    export LANG=en_US.UTF-8

    export LC_ALL=en_US.UTF-8

    ```


    What does this tell is the OS on the droplet (Ubuntu Linux) which language we''re
    using (US English), and the type of encoding used to display its characters. UTF-8


    # Jump Start PHP Environment


    is a type of encoding which makes possible the use of letters of different alphabets
    and similar miscellaneous characters. UTF-8 is outside the scope of this book
    and chapter, but if you''re curious, there''s an absolutely essential (newbie-friendly)
    bit of writing from 2003 onwards it is at the following link:

    http://www.joelonsoftware.com/articles/Unicode.html


    ```

    # SendEnv LANG LC_*

    ```


    This is due to a common remote access bug¹⁹.

    Now we''re ready to install prerequisite software.


    # Prerequisites


    First, we need to have Ubuntu pull in a list of the newly available Ubuntu packages.
    While you''re logged into the droplet, run:


    ```

    sudo apt-get update

    ```


    With the list updated, let''s start by installing Git, SQLite3, and Nginx:


    ```

    sudo apt-get install git sqlite3 nginx

    ```


    Suddenly, our IP address is live! (Figure 8.30).


    # Learn by Example: A Web App from Scratch


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_177_0.png)


    Figure 8.30. Nginx welcome page


    Next, we need to install PHP.


    # PHP and Composer


    To install PHP, we run:


    ```

    sudo add-apt-repository ppa:ondrej/php5-5.6

    sudo apt-get update

    sudo apt-get install php5 php5-fpm php5-cli php5-sqlite

    ```


    php5 is the core PHP program. php5-fpm is the web interface through which a server
    like Nginx passes PHP files and gets back a response. php5-cli is the command
    line interface, so we can use PHP in the terminal, without the browser. This is
    what Composer uses to work. php5-sqlite is, of course, a PHP extension for communication
    with SQLite3, which we know we''ll be needing.


    To install Composer globally, like on Homestead Improved, we execute:


    # Jump Start PHP Environment


    ```

    curl -sS https://getcomposer.org/installer | php

    sudo mv composer.phar /usr/local/bin/composer

    ```


    # Server Configuration


    To configure Nginx, we can just grab the configuration from our VM! Open a new
    terminal or window on the host machine, enter the Vagrant VM we developed the
    app with vagrant ssh as, and execute:


    ```

    cp /etc/nginx/sites-available/guestbook.app -/Code/guestbook-nginx.txt

    ```


    ```

    vim /etc/nginx/sites-available/guestbook.app

    ```


    Press the i key to enter insert mode, and paste the contents in there with Ctrl
    + V (CMD + V on a Mac). Then, edit the following lines:


    - change the value of server_name for a name (guestbook.app) to the IP of the
    droplet

    - change the value of root to /var/www/guestbook/public


    The var/www/ folder is the location that''s typically used to host applications
    on Linux. Use insert mode with Esc, exit the file by typing :x and pressing Enter.


    Then, reboot Nginx with:


    ```

    sudo service nginx restart

    ```


    # Encountering Issues


    If you run into problems like a fully white screen, or a cryptic error, check
    the error logs by running tail -f /var/log/nginx/guestbook.app-error.log. Tail
    outputs the “tail” of a file (its last 10 lines) and -f tells it to “watch this
    file update output as it changes, meaning as new errors come in, they''ll-immediately
    show up on screen. Feel free to open another terminal window, connect to the droplet
    just like above, and run the tail here; that way, you still have full control
    over the main terminal window to run commands in, and the second will monitor
    errors for you.


    # Pulling With Git


    At last! We''re ready to deploy our app!


    ```

    cd /var/www

    git clone https://github.com/spbooks/phpenv1-example guestbook

    cd guestbook

    composer install --no-dev -o

    ```


    Notice we saw --no-dev to prevent installing the dev packages and make the installation
    faster. On an application of this size, it hardly matters, but on bigger projects,
    the difference is obvious. We also used the -o which is for for --optimize-autoloader
    and builds a classmap - a special file which turns namespace-to-combinations (from
    the autoload section of composer.json) into a fixed pre-calculated array, which
    in most cases speeds up autoloading. Read more about these command line options.
    Seeing as we did all with the root account, remember our application is "owned"
    by the root user that created it. This is okay in most cases, but not when PHP
    needs to do some reading and writing on the hard drive; As a final step, we need
    to modify permissions:


    ```

    cd /var/www/guestbook

    sudo chmod -R :www-data .

    ```


    If we test our app now, we should see that everything is working, as shown in
    Figure 8.31.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_180_0.png)


    Figure 8.31. A working droplet


    # Conclusion


    This chapter put to practice all the theory we covered before. Pretty much every
    term we discussed and every code snippet we tried out were used in one way or
    another through the creation of our little app.


    # Jump Start PHP Environment


    To learn about the basics of automatic testing:


    - https://leanpub.com/mlaph

    - http://www.sitepoint.com/tag/phpunit

    - http://knpuniversity.com/screencast/behat

    - http://www.sitepoint.com/php-continuous-integration-travis-ci/


    To learn about the Laravel framework, it''s best if you look at https://laracasts.com/,
    while for you check out http://knpuniversity.com has to offer.


    Finally, to automate the last step of this chapter — deployment — set it up it
    happens every time you, for example, push to the master branch (and for the various
    names these procedures share),


    - http://stackoverflow.com/questions/28608015/

    - http://www.sitepoint.com/whats-continuous-deployment/

    - http://www.sitepoint.com/php-continuous-integration-travis-ci/

    - http://www.sitepoint.com/deploying-php-apps-digitalocean-dploy-io/

    - http://www.sitepoint.com/deploy-symfony-apps-capifony/

    - http://www.sitepoint.com/one-click-app-deployment-server-side-git-hooks/


    For a constantly updated version of this list, see the README file of the example''s
    repository at https://github.com/spbooks/phpenv1-example, or read http://phptherright.com.

