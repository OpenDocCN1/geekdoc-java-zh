    # PHP and Composer


    To install PHP, we run:


    ```

    sudo add-apt-repository ppa:ondrej/php5-5.6

    sudo apt-get update

    sudo apt-get install php5 php5-fpm php5-cli php5-sqlite

    ```


    php5 is the core PHP program. php5-fpm is the web interface through which a server
    like Nginx passes PHP files and gets back a response. php5-cli is the command
    line interface, so we can use PHP in the terminal, without the browser. This is
    what Composer uses to work. php5-sqlite is, of course, a PHP extension for communication
    with SQLite3, which we know we''ll be needing.


