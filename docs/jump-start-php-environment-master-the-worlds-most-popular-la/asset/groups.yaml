    ## index.php vs index.html


    大多数服务器配置为首先查找 index.html 文件，然后查找 index.php 文件。事实上，如果你现在刷新 http://guestbook.app，你将看到
    H5BP 的欢迎页面，而不是我们的输出内容。


    我们可以删除 index.html，服务器将再次提供 index.php，但这样我们就会失去 H5BP 的优势。为了找回我们的内容，我们：


    - 打开 index.php，并在文件末尾加上 `?>`。这是 PHP 的结束标签，它让 PHP 知道不需要再处理更多的编程逻辑。它知道从该点起，它所做的只是将遇到的内容打印到屏幕上。在纯
