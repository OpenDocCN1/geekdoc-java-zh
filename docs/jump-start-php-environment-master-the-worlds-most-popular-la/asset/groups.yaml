    \ : \"World\").\"\";\n```\n\n然后，在你的 hosts 文件中添加 `192.168.10.10 test.app`。\n\n\
    为了应用这些更改，VM 需要重新加载配置。我们通过在 `homestead_improved-master` 文件夹内的命令行中执行 `vagrant provision`\
    \ 命令来处理。\n\n如果你现在在浏览器中访问 http://test.app/，你应该能看到“Hello World!”。如果你访问 http://test.app?name=Vagrant，你应该应该看到“Hello\
    \ Vagrant!”，如图 4.7 所示。你刚刚在虚拟机中完成了一些 PHP 编程！\n\n![](img/7d1d10ff700e0e770ae037aef1a8424a_77_0.png)\n\
    \n图 4.7 我们在虚拟机中的第一个程序\n\n你可能已经注意到，新站点需要你添加新的 `sites` 块，但不需要添加新的文件夹条目。这是因为我们设置\
    \ Homestead Improved 的方式使得它的整个主文件夹（你所在的文件夹：`homestead_improved-master`）被共享到 VM\
    \ 的 `Code` 文件夹中，因此这两个文件夹的任何子文件夹都会自动共享并保持同步。从技术上讲，我们可以定义位于 `homestead_improved-master`\
    \ 文件夹之外的单独映射，并将外部的任意位置与 VM 内部的任意位置进行共享，但我认为采用这种隔离的方法会让结构保持整洁得多。\n\n## 关\n\nVM\
    \ 在运行时会占用宿主机的大量资源。事实上，如果你查看 `Homestead.yaml`，你会发现它占用了一个 CPU 核心和两个 GB 内存（文件中的第二和第三行）。在未使用时离开\
    \ VM 是浪费的，并且会减慢宿主机的速度，将其关闭（就像出门时关电脑一样）是有意义的。我们通过在 `homestead_improved-master`\
