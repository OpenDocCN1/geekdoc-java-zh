    # PHP 环境快速启动


    ```php

    <?php

    $word1 = "Hello";

    ?>

    ```


    file-b.php 有以下代码：


    ```php

    <?php

    $word2 = "World";

    ?>

    ```


    你可以像这样在 file-c.php 中使用它们：


    ```php

    <?php

    include ''file-a.php'';

    include ''file-b.php'';


    echo "I am now using file-a and file-b, yay! {$word1} {$word2}";

    ?>

    ```


    这将输出：


    > I am now using file-a and file-b, yay! Hello World!


    随着文件的增加，`include` 语句会变得越来越长。这导致 PHP 应用程序变成了一系列这些辅助脚本的冗链调用，一个接一个执行。我们将这种代码称为“意大利条面代码”（spaghetti
    code），因为它是一团糟——行与行之间交织在一起，没有结构或顺序，一段逻辑调用另一个定义在任意外部位置的逻辑。条面代码对其他开发者非常不友好（甚至对几个月后的原始开发者也是如此！）。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_113_0.png)


    图 7.1 混乱的代码


    随着 PHP 5 版本中面向对象的 PHP 的出现，我们获得了编写名为**类**的代码块的能力。类将属于特定上下文的逻辑组合在一起。具体来说，在 Web 领域，一个
    *User* 类可以拥有登录 login 和注销 logout 的方法（即内部函数、功能）。


    在应用程序中使用此类允许开发者实现登录和注销功能。类可以通过像上面的文件一样**包含**其他类来与其他类通信（例如，User 类可以包含一个 *Database*
    类以便用它检查数据库是否包含匹配的用户名和密码组合），但它的额外优点是其上下文是透明的。毕竟，通过查看其文件内部，甚至仅看其名称，就能很容易地发现某个类的意图。


    # PHP 环境快速启动


    具有相关上下文的不同类被称为一个包（package，也称为库）。在同一个包中，一个类可以专门处理用户登录和超时，另一个用于发送“重置密码”邮件，另一个用于检查用户角色（管理员、访客）等。整个包可以被称为身份验证（Authentication）。


    但随着类的激增，冲突问题出现了。如果我有一个 User 类，并且借用了例如 Jim 的 User 类，尝试同时使用它们来兼得两者之长会导致 PHP 产生错误（也许他的
    User 类也支持头像上传，而我的则没有）。两个类不能有相同的名称，因为 PHP 不知道要使用哪两个类！在 PHP 5.3 版本中，这个问题通过命名空间（namespaces）解决了。


    # 命名空间与旧时代的包管理


    命名空间是某些其他语言的常见特性，在 PHP 5.3 版本中引入。它们听起来很令人生畏，但实际上它们仅仅是 PHP 类名前的前缀。


    我们哥们 Jim 前述的 User 类将被称为 `Jim\User`（反斜杠 \ 是用于分隔命名空间片段的特殊符号；这允许命名空间嵌套到任意深度），而我们的可以命名为
    `SitePoint\Authentication\User`。虽然它们的最终“名称”相同（User），但它们的完全限定名是不同的，PHP 乐意让我们同时使用它们。


    但尽管如此，使用多个包和类意味着我们必须包含所有的内容，就像上一个例子一样——通过文件名调用其他类，确保它们被唤起使用。当然，有一些规避此的方法——开发了名为“自动加载器”（autoloaders）的特殊函数，用于根据类所在的位置加载类（例如，`Jim\User`
    可能位于 `classes/Jim\User.php`）；然而，不仅找不到他人的类，还要有效地包含它们并让它们符合正在使用的自动加载函数，仍然是繁琐的。


    为了解决这个问题，我们使用工具 Composer。


    # 什么是 Composer？


    Composer¹ 是一个 PHP 的包管理器。我们已经将包定义为类的集合。那么，包管理器是什么呢？


    包管理器是一种工具，它消除了在环境中查找和安装包或程序过程中的人为因素。例如，如果你正在使用 OS X，有一个名为 Homebrew 的操作系统包管理器。与其在网络上搜索诸如
    MPlayer 这样的媒体播放器程序，可以使用终端运行命令：


    ```

    brew install mplayer

    ```


    像魔术一样，应用程序将被安装并立即可用。在 Linux 操作系统上，有几个包管理器。流行的是 Aptitude，使用方法类似：


    ```

    sudo apt-get install chrome

    ```


    此命令就这样安装了最新的 Chrome 浏览器。


    包管理器确保包（应用程序就是一个包——它是一组为了单一目的共同工作的文件，无论是媒体播放、网页浏览还是完全其他内容）被清洁、快速和安全地安装。


    同样，在编程语言（如 PHP）的上下文中，包管理器用于检索、安装、更新和卸载包。虽然在没有 Composer 的情况下为类设置自动加载的体力工作足够简单，但
    Composer 完全消除了这一过程。它自动化了在网上查找包、下载、解压、放入你的项目文件夹、包含、配置等等手动过程。


    Composer 连接到 Packagist，这是用户提供的事实上的在线包目录。让我们解释一下当你安装包时会发生什么。


    # PHP 环境快速启动


    使用 Composer 安装包非常简单，只需在应用程序目录下运行 Composer 的命令：


    ```

    composer require nesbot/carbon

    ```


    此时，应用程序将被安装并立即可用。Composer 将执行：


    - 1. 查看 require 参数并确定包名。注意包名使用斜杠 /。

    - 2. 查看其配置（composer.json 文件），了解它需要什么。

    - 3. 访问 Packagist 并查找该包的信息。如果它存在，将移动到下一步。

    - 4. 读取其依赖项（它需要哪些其他包）。

    - 5. 在依赖项安装后，它下载 nesbot/carbon，更新自动加载文件（默认位于项目目录下的 vendor/autoload.php），并使新安装的包可用。


    要使用此包，请确保上述自动加载文件包含在你的应用程序中。无论安装多少个包，都需要这样做一次。


    ```php

    <?php

    include ''vendor/autoload.php'';

    ```


    这似乎有点抽象，让我们看看实际效果。


    # 使用示例


    PHP 有一个内置类 DateTime（文档见 http://php.net/manual/en/class.datetime.php），可以用于时间相关的计算和操作。然而，该类并不直观。


    # Composer


    nesbot/carbon 包包含一个可以操作时间的类。嗯，不是操纵时间（PHP 还没有那么强大！）而是操作 DateTime 值。


    Carbon 是作为 DateTime 的升级版开发的，它让你使用非常人性化的表达式获取所需的值。让我们尝试使用这个方便的包！根据 Carbon 的说明，我们只需下载、解压并通过
    `include ''Carbon.php''` 手动包含它；然而，强烈建议你尽可能使用 Composer。


    # 引导


    我们首先通过启动一个新的虚拟机，参见第 4 章。在主机计算机的终端执行以下五个命令为我们完成所有工作：


    ```

    git clone https://github.com/swader/homestead_improved hi_carbontest

    cd hi_carbontest

    bin/folderfix.sh

    vagrant up

    vagrant ssh

    ```


    最后一条命令进入虚拟机，因此你在里面，就像连接到服务器一样。

    然后，执行：


    ```

    cd Code

    touch index.php

    ```


    `touch` 命令创建一个指定名的空文件。


    用你喜欢的文本编辑器或 IDE 打开此 index.php 文件，既可以在终端中使用 `vim index.php`，也可以在主机上通过进入文件夹并双击它。然后给它赋予内容：


    ```php

    <?php

    echo "Hello World";

    ```


    保存并退出文件，然后在虚拟机终端内运行：


