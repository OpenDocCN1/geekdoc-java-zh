    ```\n\n7. https://travis-ci.org/\n\n# 快速上手 PHP 环境\n\n7. 添加新条目：\n```\nsites:\n\
    \  map: phpenv.app\n  to: /home/vagrant/Code/phpenv\n```\n8. 最后，添加新条目：\n```\n\
    https://travis-ci.org/\n```\n如果你不熟悉，请查看该章节。\n\n# 创建 \"Hello World\" 页面\n\n环境准备好后，学习\
    \ Git 和 GitHub 的路径就清晰了：\n\n- 1. 在 `hi_phpenv` 文件夹中创建一个名为 `phpenv` 的新文件夹。你可以通过宿主机的文件资源管理器创建，也可以通过终端使用\
    \ `mkdir phpenv` 创建。\n- 2. 创建名为 `index.php` 的新文件并赋予其内容：\n```php\n<?php echo \"\
    Hello World\";\n```\n- 3. 尝试运行是否工作。\n\n现在我们有了自己的 \"Hello World\" 页面。我们对自己的代码感到自豪，并想向世界分享它。让我们使用\
    \ Git 和 GitHub 来。\n\n# Git\n\n在将任何内容上传到 GitHub 之前，我们会告诉 Git 将我们的源代码转换为仓库。\n\n\
    # 仓库初始化\n\n- 在 `phpenv` 文件夹（即 `hi_phpenv`）中，运行 `git init`。这是一个初始化命令，将创建一个空的 `.git`\
    \ 文件夹。它默认是隐藏的，但如果你执行 `ls -a` 就能看到它。\n- 在使用 Git 这样的版本控制系统开发时，你可能希望确保某些文件不会被添加到仓库。例如，如果你在配置文件中有数据库密码，那么让此文件在网上公开是不明智的，因为会将你的密码泄露给查看你仓库的人。为了这个目的，存在忽略文件。这些是\
    \ Git 的特殊文件，文件名 `.gitignore`，内容逐行列出要忽略的文件，例如：\n\n```\npassword.php\nsensitive-folder/*\n\
    ```\n\n这段代码将确保密码文件和 `sensitive-folder` 中的所有内容都不会被添加到仓库中，也不会出现在其他人克隆的代码中。\n\n如果你正在使用\
    \ IDE 编写这些代码（我希望你是这样的，参见第 2 章），你会发现它喜欢将自己的辅助文件放入项目根目录。例如，PhpStorm 喜欢创建一个 `.idea`\
