  - '[PAGE 137]


    # Database Connection


    There are many databases available: MySQL, OracleDB, PostgreSQL, MSSQL, SQLite,
    and so on. The most popular one to use in tandem with PHP is MySQL. Introducing
    SQL is outside the scope of this book, but it''s necessary for our purposes anyway—we''ll
    be using a library that abstracts database communication for us.


    To understand abstraction, imagine a power socket in the EU. It looks like a pig
    snout, and we call it the Schuko socket, seen in Figure 8.7.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_137_0.png)


    Figure 8.7. Schuko socket, common to the EU


    Then imagine a power socket in the US, seen in Figure 8.8. It has two vertical
    slits and a screaming mouth that is completely incompatible with the EU one.'
