  - '[PAGE 156]


    # Jump Start PHP Environment


    be in use while developing, and a "production" database which we''ll deploy alongside
    our app. We see the Application Environment chapter for clarifications on these
    terms.


    There are many ways to do this, but one of the easiest is:


    +   - app checks if a file called database.local.db exists

    - if the file exists, it is used as the database

    - if the file does not exist, the file database.db is used


    The file database.local.db can be put into the .gitignore file so it never ends
    up shared with other team members, and so that it cannot end up in the repo (thus
    never deployed via Git). By default, this will make the production version of
    our app use the production database, and the local version of our app use the
    development database.


    First, let''s empty the database of dummy data.


    ```

    sqlite3 storage/database.db

    delete from comments;

    delete from sqlite_sequence where name=''comments'';

    ```


    The first delete deletes all test rows we have inserted. The second one resets
    the auto-incrementing ID field back to 0. Now, let''s turn this database file
    into a template for future ones, then create the databases we need:


    ```

    cd storage

