    按下 `i` 键进入插入模式，并使用 `Ctrl + V`（Mac 上为 `CMD + V`）将内容粘贴进去。然后编辑以下行：


    - 将 `server_name` 的值从名称 (guestbook.app) 改为 droplet 的 IP 地址

    - 将 `root` 的值更改为 /var/www/guestbook/public


    `var/www/` 文件夹是 Linux 上通常用于托管应用程序的位置。使用 `Esc` 插入模式，输入 `:x` 并按回车退出文件。


    然后，重启 Nginx：


    ```bash

    sudo service nginx restart

    ```


    # 遇到问题


    如果你遇到全白屏或晦涩的错误，请通过运行 `tail -f /var/log/nginx/guestbook.app-error.log` 来检查错误日志。`tail`
    输出文件的“尾部”（最后 10 行），`-f` 告诉它“监控此文件的更新输出”，这意味着当新错误出现时，它们会立即显示在屏幕上。可以随时打开另一个终端窗口连接到
    droplet。


    # 使用 Git 拉取


    最后！我们准备好部署我们的应用了！


    ```bash

    cd /var/www

    git clone https://github.com/spbooks/phpenv1-example guestbook

    composer install --no-dev -o

    ```


    注意到我们使用了 `--no-dev` 防止安装开发包并使用 `-o` 加快安装。由于我们是用 root 账户创建的，应用“属于”root 用户。当 PHP
    需要读写硬盘时这不是问题。作为最后一步，我们需要修改权限：


    ```bash

    cd /var/www/guestbook

    sudo chmod -R :www-data .

    ```


    如果我们现在测试应用，应该会看到一切正常，如图 8.31 所示。


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_180_0.png)


    图 8.31. 正常的 droplet


    # 总结


    本章实践了之前涵盖的所有理论。我们讨论的几乎每个术语和尝试过的代码段在创建小应用的过程中都用到了。


    # 快速启动 PHP 环境


    要了解自动化测试的基础知识：


    - https://leanpub.com/mlaph

    - http://www.sitepoint.com/tag/phpunit

    - http://knpuniversity.com/screencast/behat

    - http://www.sitepoint.com/php-continuous-integration-travis-ci/


    要了解 Laravel 框架，最好查看 https://laracasts.com/，你也可以查看 http://knpuniversity.com 提供的内容。


    最后，为了自动化本章的最后一步——部署——设置让它每次当你（例如）推送到 master 分支时（以及这些程序的各种名称）都发生：


    - http://stackoverflow.com/questions/28608015/

    - http://www.sitepoint.com/whats-continuous-deployment/

    - http://www.sitepoint.com/php-continuous-integration-travis-ci/

    - http://www.sitepoint.com/deploying-php-apps-digitalocean-dploy-io/

    - http://www.sitepoint.com/deploy-symfony-apps-capifony/

    - http://www.sitepoint.com/one-click-app-deployment-server-side-git-hooks/


    有关此列表的持续更新，请参见仓库 https://github.com/spbooks/phpenv1-example 中的 README 文件，或阅读 http://phptherright.com。


