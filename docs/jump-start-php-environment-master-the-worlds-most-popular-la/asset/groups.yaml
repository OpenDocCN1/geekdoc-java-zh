    # Homestead Improved: Explanation


    When we visited the URL https://github.com/Swader/homestead_improved, we went
    to GitHub, a coding social network for open-source projects. Homestead is a preconfigured
    virtual machine running the Ubuntu operating system with critical security patches
    installed and some commonly used software for PHP development: that is, a new
    version of PHP and some databases, among others. Homestead Improved is a slightly
    enhanced version of Homestead that makes it even easier to get started with them.
    Every project on GitHub is a **repository**, a set of files.


    The Homestead Improved repository contains all the files necessary to run a Vagrant
    environment, specifically the Vagrantfile. This Vagrantfile loads the contents
    of all the other important files in the repository and uses the combination of
    these files to set up (provision) your environment. This is what the vagrant up
    command was for: reading the Vagrantfile and following instructions within.


    When we ran the `folder` command, we executed a **shell script**, which is a tiny
    program whose sole purpose is to establish the folder from which it''s running
    and set that folder as shared with the VM. Remember that VMs are isolated environments
    unaware of the host machine they''re running on? If they''re completely connected,
    how can we use our host machine''s applications to write code that runs in the
    VMs? The answer is sharing. By mapping a specific location on our host machine
    (the current folder) to a specific location within the VM (the **Code folder**),
    we tell Vagrant to copy every file we create or change in this folder into the
    designated location inside the VM. This creates a weak link between the host and
    the virtual machine, enabling files to be shared; this, in turn, allows us to
    use the'
- md: "\n# 54 Jump Start PHP Environment\n\nIDEs installed on the host machine to\
    \ write code that eventually runs on the virtual machine.\n\nSo, what about that\
    \ No input file specified message? If you look at Homestead.yaml in the sites\
    \ block, you see the following:\n\n```\nsites:\n  - map: homestead.app\n    to:\
    \ /home/vagrant/Code/Project/public\n```\n\nThis means that whenever we try to\
    \ visit http://homestead.app, the computer should look for files inside the path\
    \ in the line. Since a fresh Homestead Improved VM is yet to have any files in\
    \ that location, the message we receive is one of a missing input file. We fix\
    \ this by putting an index.php file in that location, giving us our “Hello Virtual\
    \ Machine” message.\n\n## Defining New Sites\n\nMost of the time, you'll want\
    \ a custom folder path and site URL for your project. Let's define a new one on\
    \ the same Homestead Improved VM we just used. A single VM can host an unlimited\
    \ number of apps/projects; it's up to you to decide how you want to distribute\
    \ across various machines/environments for testing or development purposes.\n\n\
    Open the file Homestead.yaml again. Under sites, add another map / to pair. Make\
    \ sure the indentation matches the pair above it, as they need to have the same\
    \ padding—that's a rule of the YAML file format. I'll make a new site called test.app\
    \ so that my sites block looks as follows:\n\n```\nsites:\n  - map: homestead.app\n\
    \    to: /home/vagrant/Code/Project/public\n  - map: test.app\n    to: /home/vagrant/Code/test\n\
    ```\n\nThis means: looking for the files of the test.app URL in the folder /home/vagrant/Code/test.\n\
    \nNow make a new test folder in the homestead_improved-master folder, and inside\
    \ it put the file index.php with the contents:\n\n```php\n<?php\necho \"Hello\
    \ \". (isset($_GET['name']) ? $_GET['name'] : \"World\").\"\";\n```\n\nThen add\
    \ 192.168.10.10 test.app to your hosts file.\n\nTo apply these changes, the VM\
    \ needs to reload the configuration. We handle this by executing the command vagrant\
    \ provision from the command line inside the homestead_improved-master folder.\n\
    \nIf you now visit http://test.app/ in the browser, you should see \"Hello World!\"\
    \ And if you visit http://test.app?name=Vagrant, you should see \"Hello Vagrant!\"\
    , as shown in Figure 4.7. You've just done some PHP programming in a virtual machine!\n\
    \n![](img/7d1d10ff700e0e770ae037aef1a8424a_77_0.png)\n\nFigure 4.7. Our first\
    \ program in a virtual machine\n\nYou probably noticed that a new site requires\
    \ you to add a new sites block, but not a new folders entry. This is because we've\
    \ set up Homestead Improved in such a way that its entire master folder (the one\
    \ you're in: homestead_improved-master) is shared into the Code folder of the\
    \ VM, so any subfolders of these two folders are automatically shared and kept\
    \ in synchronization each other as well. Technically, we could define separate\
    \ folder mappings that go outside the homestead_improved-master folder and share\
    \ a completely arbitrary location from outside of it with a completely arbitrary\
    \ location inside the VM, but it is my feeling that adopting this isolated approach\
    \ keeps it much cleaner.\n\n## Shutdown\n\nThe VM, while running, takes up a significant\
    \ share of your host machine's resources. In fact, if you look at Homestead.yaml,\
    \ you'll notice that it takes one CPU core and two gigabytes of RAM (lines two\
    \ and three in the file). Leaving a VM while not in use is wasteful and slows\
    \ down your host computer, powering it down (just like shutting down a computer\
    \ when you leave the house, for example) makes sense. We do this by executing\
    \ the vagrant halt command from the terminal while inside the homestead_improved-master\
    \ folder. Alternatively, the vagrant suspend command can be used—it's faster,\
    \ but ends up eating a bit more hard drive space, even off.\n\nLet's halt the\
    \ machine. Inside the homestead_improved-master folder, run:\n\n```\nvagrant halt\n\
    ```\n\nTo completely destroy the VM, wiping its hard drive and all the software\
    \ installed after download, we execute vagrant destroy. To revive it and reinitialize\
    \ the provisioning process, we can run vagrant again and all will be as it was.\
    \ This is the beauty of Vagrant—destroying and rebuilding is only two commands\
    \ away, lending itself perfectly to experimentation with even the most volatile\
    \ cutting-edge technologies.\n\n## Further Reading\n\nThis is, more or less, everything\
    \ you need to know about Vagrant and VMs to get started properly. Homestead is,\
    \ of course, a shortcut—but it's a good one worth starting with. Once you're comfortable\
    \ with it, feel free to explore other approaches such as building a box from scratch,\
    \ modifying a Vagrantfile, using a different base box to boot up a different operating\
    \ system, and more.\n\nFor further reading and more in-depth information, please\
    \ see the following articles:\n\n# Virtual Machines 57\n\n- Re-introducing Vagrant:\
    \ The Right Way to Start with PHP7\n- Quick Tip: Get a Homestead Vagrant VM Up\
    \ and Running\n- How to Create and Share a Vagrant Base Box\n- Vagrantfile Explained:\
    \ Setting Up and Provisioning with Shell\n\n## Summary\n\nIn this chapter, we\
    \ learned about virtualization—a crucial part of anyone's development. Homestead\
    \ is, of course, a shortcut—but it's a good one worth starting with. Once you're\
    \ comfortable with it, feel free to explore other approaches such as building\
    \ a box from scratch, modifying a Vagrantfile, using a different base box to boot\
    \ up a different operating system, and more.\n\nFor further reading and more in-depth\
    \ information, please see the following articles:\n\n- Re-introducing Vagrant:\
    \ The Right Way to Start with PHP7\n- Quick Tip: Get a Homestead Vagrant VM Up\
    \ and Running\n- How to Create and Share a Vagrant Base Box\n- Vagrantfile Explained:\
    \ Setting Up and Provisioning with Shell\n"
  mdcn: "\n\n# 54 快速启动 PHP 环境\n\n安装在宿主机上的 IDE 用于编写代码，这些代码将在虚拟机上运行。\n\n那么，“No input\
