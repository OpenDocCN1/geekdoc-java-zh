    # Jump Start PHP Environment


    When you deploy your application—in other words, upload it to a server and make
    it publicly accessible for the target audience—you''re putting it in production,
    or in use. The production environment is your application''s final destination,
    your code''s purpose.


    In an application''s life cycle, the production environment is the live server—a
    server computer set up so that other people can connect to it and see your website.
    This live server will be configured to serve your application as efficiently as
    possible. All the extra files you use during development will be removed from
    the application via a process known as compiling or building, which is explained
    further on.


    In production, your site is considered to be live (or deployed) and will be accessible
    via its own domain; for example, http://mysite.com. When you launch your site
    (put it into production mode), you have cause for celebration, because this is
    the final step in your application''s development process.


    It is the equivalent of a chef cooking a meal in a restaurant and having it delivered
    to the patrons who ordered it.


    # Development


    In the development environment, your application is actively being developed.
    The development environment is the computer that the developer are using to develop
    the app, including the computers of all your team members, regardless of whether
    they are near or remote. It is important to note that despite covering both aspects,
    the development environment refers more to the state your app is in, rather than
    its physical location—the app is in the state of being developed.


    In the development environment, you have various tools at your disposal—from IDEs
    (see Chapter 2) to unit testing libraries and standards fixes, compilers and builders,
    file watchers, and more—anything you need to achieve the job at hand.


    If we compare our application to a smartphone, the assembly plant it''s being
    made in is the development environment. This environment contains all the necessary
    parts—the screen, the case, the battery, the various LEDs—and each part is individually
    tested before being used in the construction of a smartphone unit. This is called
    unit testing—ensuring each unit works.'
- md: 'For an example of unit testing in application development, see the section
    called “For Those Who Want More” at the end of this chapter.


    To take the smartphone assembly analogy further, the battery being tested might
    require a separate charger attachment, or the screen may need to be tested using
    a robotic arm with synthetic fingers to ensure that the screen''s touch sensitivity
    works.


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_53_0.png)


    All these add-ons are during development only. When converting from the development
    environment to the production environment (also known as *deploying*), these add-ons
    are removed. For our application, this means the aforementioned compilation/building
    step: various CSS and JavaScript files are merged together and shrunk so as to
    decrease the size of the website, making it appear faster when people visit it;
    unit tests are ignored and left behind in the development environment; and various
    other optimizations occur (covered later in the chapter)—all with the intention
    of making the final product maximize its appeal and potential when declared ready.


    ## Jump Start PHP Environment


    ### Hosts and Virtual Hosts


    When you develop on your own computer, it''s impossible to visit the URL http://mysite.com
    and expect to see your site; after all, your site is yet to go live—it''s not
    on the Internet. To get around this and see our site as if it were live, we fake
    the Internet by defining virtual hosts.


    Put simply, a virtual host gives an instruction to the server program installed
    on your computer, such as: IF a user requests http://mysite.com in the browser,
    run the file.php through PHP and show its output in the browser.


    As you can see, this is nearly identical to the request flow of live sites. But
    what makes the browser ask our own computer''s server program for the mysite.com
    domain, rather than look it up on the Internet''s name servers? The hosts file.


    The hosts file is a special file present on every operating system. We mentioned
    briefly in the section called "For Those Who Want More" in Chapter 1. It contains
    a list of domains and their appropriate IP addresses, so that any browser on your
    computer can read and go directly to the IP address without having to talk to
    the DNS to check where to go. In Windows, this file is in C:\Windows\System32\drivers\etc\hosts,
    and on Linux and Mac machines it''s in /etc/hosts. If you put an IP-name pair
    into this file, the computer will obey. We can even try it out right now. No fear—there
    is nothing that can go wrong.


    **On Windows**, enter the search field, type “notepad” and once it appears, right-click
    and select **Run as Administrator**. The system will then ask you for confirmation.
    In the window that opens, select **File > Open** and go to: **My Computer > C
    > Windows > System32 > drivers > etc**. In the lower right corner of the Notepad
    window, you might need to select **All Files** so that the hosts file shows. Double-click
    to open it.


    On Linux/Mac machines, open Terminal by searching for it. **On Linux**, open the
    default text editor as the administrator by typing sudo edit into Terminal. You''ll
    be asked for your administrator password. **On OS X**, enter sudo /Applications/TextEdit.app/Contents/TextEdit,
    which will do the same task. In either of these editors, go to **File -> Open**
    and enter the directory /etc to find the hosts file. Double-click to open it.


    Once the file is opened, note the first few lines: they''ll all start with the
    hash symbol (#). This indicates that they''re comments, and have no effect on
    the file. These serve to explain a file''s purpose to the user, and they exist
    in PHP as well.


    Now, under all these comment lines, add the following line:


    ```

    208.117.229.217 bing.com

    ```


    Save the file and open http://bing.com in your browser. You''ve just successfully
    redirected all requests to Microsoft''s search engine Bing to Google! Of course,
    we don''t want to keep these changes; feel free to delete this line or put a hash
    symbol in front of it to turn it into a comment, and save the file. You should
    be able to visit http://bing.com as normal again.


    Using this method, we''ll later redirect browser requests for http://mysite.com
    (which will be our application''s example domain) to our own computer''s server.
    This will enable us to easily test the development version of our site without
    deploying it.


    ## Staging and Maintenance


    The staging environment is a separate server (or several servers) containing a
    copy—also known as a mirror—of production environment. The staging environment
    is often skipped in smaller companies or projects. It is designed to resemble
    the production environment as closely as possible, with matching versions of installed
    software, identical configuration values, and so on. Staging is for performing
    the final tests; for example, Facebook might redesign its front page, and before
    deploying it into production for all users to use, it would deploy to its staging
    servers so that employees (dedicated non-programmers also known as the quality
    assurance team) can test everything as if using it regularly. If everything goes
    well, the final deployment from staging to production happens.


