    # Git


    Before we put anything on GitHub, we''ll tell Git to turn our source code into
    a re-repository.


    # Repo Initialization


    +   - While in the phpenv folder (that''s hi_phpenv/phpenv), run git init. This
    is an initialization command that will create an empty .git folder. It is hidden
    by de-fault, but you can see it if you execute ls -.


    +   - When developing with the power of a version control system as Git, you might
    want to ensure certain files are never added to a repository. For example, if
    you had a database password in a configuration file, it would be unwise to let
    this file be accessible online, as it would leak your password to everyone looking
    at your repo. For this purpose, ignore files exist. These are special files for
    Git with the filename being .gitignore and contents that list files to ignore
    line-by-line, so:


    ```

    ```myppassword.php

    sensitive-folder/*```

    ```


    This piece of code will make sure the mypassword.php and everything inside the
    folder sensitive-folder is never added to a repository, nor ends up in anyone
    else''s clone of your code.


    If you''re using an IDE to write this code, and I hope you are (see Chapter 2),
    you''ll find that it likes to put its own helper files into the project''s root.
    For example, PhpStorm loves to make an .idea folder and place some configuration
    values inside that pertain to the current project. I definitely want to avoid
    having anyone who clones my code be forced to copy my IDE configuration, so let''s
    use an ignore file to prevent this.


    Create a .gitignore file in the folder with the command touch .gitignore, or from
    within your IDE. Then edit and give it the contents of the file at https://gist.github.com/Swader/7844111
    , which is an ignore file that takes into account all the various IDE and OS configurations
    you can run into when working on PHP projects.'
