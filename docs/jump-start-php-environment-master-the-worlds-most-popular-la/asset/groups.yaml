    另一种确保你再也不需要将此添加到项目的 `.gitignore` 文件中的方法是将其添加到全局 `.gitignore` 中。要了解如何操作，请查看 GitHub
    的这篇实用指南：https://help.github.com/articles/ignoring-files/


    在准备好代码和 `.gitignore` 文件后，我们需要一个 readme 文件。readme 是 GitHub 仓库访问的第一个文件，因此包含关于作者、代码用途、如何使用、如何贡献等有用信息是有好处的。通过你的
    IDE 或终端在 `phpenv` 文件夹中通过 `touch README.md` 创建一个 README.md 文件，并添加一些内容，例如：


    ```

    # Hello World

    这是来自《Jump Start PHP Environment》一书的 README 文件。

    学习 Git 和 GitHub！

    ```


    `.md` 扩展名表示这是一个 Markdown (MD) 文件——GitHub 用来以美观、格式化的方式显示 readme 内容的一种类型。虽然理解书中其他内容并不需要掌握
    MD，但在编程生活中，它非常重要，我建议你在有空时看一看 https://guides.github.com/features/mastering-markdown。


    # 添加与提交


    要将我们项目中的所有文件添加到仓库中，请执行 `git add -A`。`add` 命令告诉 Git 添加对历史跟踪所做的任何更改。`-a` 标志意味着“添加新文件、添加现有文件的更改并添加文件删除（即，记录所有已删除的文件）”。


    然而，这实际上仅仅是告诉 Git，我们将在未来的某个时间点对它所添加的所有文件进行跟踪。要真正进行提交，并在我们的项目生命周期中创建一个可恢复的时间点，我们需要使用
    `commit` 命令：`git commit -m ''Added my first files!''`。`-m` 意味着“commit message（提交消息）”，这是你标记更改的地方。任何进入你项目的人都可以查看那个准确的时间点并看到你的消息，立即知道你为什么那样做。现在执行它。


    现在文件已经添加并提交，让我们引入一个更改。再次打开 `index.php` 并将“Hello World”更改为“Hello Bob”，使文件看起来像这样：


    ```

    <?php echo "Hello Bob";

    ```


    然后再次进行添加和提交：首先执行 `git add -A`，然后执行 `git commit -m ''Changed World to Bob''`。


    在浏览器中使用 http://phpenv.app/ 访问该页面，注意它现在显示的是“Hello Bob”。


    # 重置


    我们非常喜欢 Bob，但我们的老板不喜欢，并要求我们改回“World”。我们可以进行更改并提交，大功告结。但在具有许多文件的复杂项目中，通过手动将文件改回之前的状态来撤销更改将不起作用。这就是我们有
    `reset` 命令的原因。要重置到上一次提交，我们需要找到该提交的 ID。


    我们可以通过以下命令实现：


    ```

    git log

    ```


    在我的情况下，如图 5.1 所示，最近一次提交之前的提交 ID 是 `b6adf1756bb9b94fcf9b46c612180dc12b96176`。


    # Jump Start PHP Environment


    ![](img/7d1d10ff700e0e770ae037aef1a8424a_90_0.png)


    图 5.1 查找我们提交的 ID


    要重置它，我们执行：


    ```

    git reset --hard b6adf1756bb9b94f

    ```


    注意我们使用的比 `git log` 提供的短的哈希值。这是 Git 的一个特性——哈希的前十个左右字符就足以识别我们正在寻找的正确提交。


    我们整个 Bob 的修改都被删除了，就像什么都没发生过一样。刷新 http://phpenv.app 将确认这一点。


    查找准确的提交 ID 可能很麻烦，因为也支持像 `HEAD~1` 这样的快捷标识符。`HEAD~1` 是“当前提交”，`~1` 告诉 Git 回退父节点。执行
    `git reset --hard HEAD~1` 也可以。


    # 版本控制系统 69


    `--hard` 选项告诉 Git “无论我们有多少待处理更改，这次重置比任何事情都重要，所以直接这样做吧——别问。”如果没有 `--hard`，如果我们做了任何其他未提交的更改，Git
    将报错。


    # GitHub


    现在我们再次对源代码感到满意了，让我们把它放到网上供他人克隆和检查。如果你还没有 GitHub 账号，请去 https://github.com 注册。


