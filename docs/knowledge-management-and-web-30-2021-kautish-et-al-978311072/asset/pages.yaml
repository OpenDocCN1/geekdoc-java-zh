    # 3.3 Perspective of genetic disease research from the recent past


    In spite of the above-mentioned challenges, significant improvement has been achieved
    in the field of RD research with the advent of next generation sequencing and
    omics techniques. Both the technologies have contributed to the diagnosis and
    interpretation of the molecular mechanisms underneath [55, 56]. Furthermore, both
    of them have represented a handful of information about the existing RDs in order
    to analyze for the future proceedings [56]. The “age of big data” comprises a
    huge amount of data in relevance to the various wings of genetic/rare diseases;
    however, robust management skills as well as proper ethical guidelines are paramount
    to achieve the goal.


    # 3.3.1 Influence of AI on the genetic disease research of late


    AI in tandem with machine learning (ML) has opened up a new window of opportunity
    to dissect and interpret the data by means of various subsets of algorithm. For
    the last decade several areas of modern medical practice have been benefited by
    the implementation of deep learning algorithms and the area of RD research is
    not an exception either. AI-based techniques were first introduced in medical
    research by the US Food and Drug Administration to systemize the clarity among
    the'
