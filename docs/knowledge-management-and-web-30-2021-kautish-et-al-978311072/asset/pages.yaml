    developed to investigate the relationships. It is defined as a degree to which
    an individual believes that using the system will help to gain healthcare experience.


    # 3.1 Performance expectancy (PE)


    Venkatesh et al. [16, 17, 21] have found that PE is the strongest determinant
    of a user''s behavioral intent (BI) and was identified as convenience expectancy,
    outcome expectancy, and time expectancy. Studies by Pai and Huang [28], Sun et
    al. [29] and Carlsson [30] also confirmed the positive influence of PE on the
    intention to use mHealth services.


    The above discussion led this to posit the following hypothesis:


    > H1. PE has a positive impact on the intention to use mHRA


    # 3.2 Effort expectancy (EE)


    It is defined as the ease with which the mHRA is used. Past experiments shown
    that EE has a major effect on the desire of consumers to use mHRA [29, 30]. The
    use of mHealth tracking devices through smartphones has been described as a major
    motivator [31]. Therefore, it is assumed:


    > H2. EE has a positive impact on the intention to use mHRA


    # 3.3 Social influence (SI)


    The extent to which a person understands the value of peers'' viewpoints and can
    use mobile record applications is defined. Work has shown that SI significantly
    influences the desire of consumers to use technology [29, 31]. Wills et al. [32]
    have reported that the behavioral aim for mobile digital wellbeing is an important
    association between the IS and consumers. The following theory was was raised
    in line with the aforementioned discussion:


    > H3. SI has a positive impact on the intention to use mHRA'
