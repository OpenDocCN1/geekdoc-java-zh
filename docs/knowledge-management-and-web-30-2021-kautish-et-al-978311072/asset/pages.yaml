  md: '# Tapash Rudra, S. B. Goyal

    Artificial Intelligence (AI)-Aided Algorithms

    in Medical Practice with Special Emphasis

    on Genetic Disease Diagnostics


    **Abstract:** The modern-day medical practice has been reaching greater heights
    every day with the latest technological improvisations. Medical fraternity is
    now capable of combating the deadliest diseases with the advent of sophisticated
    tools and techniques. However, some sections of medical world remain obscure in
    regard to the diagnosis, prognosis, and therapeutics. Genetic or rare diseases
    are the crucial among them. Unlike the common disorders, genetic diseases are
    quite unique primarily due to their association with the human genome. Moreover,
    scarcity of authentic data, restricted number of patients across the global periphery,
    and lack of adequate diagnostic measures are equally contributing to the hidden
    facts around such diseases. Therefore, it is imperative to have new and improved
    options in order to find the unexplored facts related to them. Artificial intelligence
    and machine learning algorithms have much enlightened various wings of rare disorders
    including the diagnosis. However, to make this new technology a powerful weapon,
    sizeable efforts are required in modern data and conventional methods cannot be
    the sole way out toward the improvement of genetic disease research and management.


    **Keywords:** Artificial Intelligence, Algorithm, Machine Learning, Genetic Disease,
    Diagnostics


    # # 1 Overview


    Human beings have been evolving since the first day on earth tandem with the human
    civilization itself. The sustenance of humankind, continued to march on with the
    roller coaster ride. Our ancestors used to be intimidated by voracious carnivores
    and periodical natural calamities until coincidentally they managed to ignite
    the fire by generating the friction from the sharp edges of the stones. This was
    the beginning of the technology and it is beyond doubt that the biggest boom,
    we human beings, have in repertoire.


    As the juggernaut moves on we find ourselves more toward the technology-driven
    era. The ongoing global COVID-19 pandemic has been humongous by far, in relevance
    to the overall collapse of the global integrity. To overhaul the outcome of such
    colossal event we must come up with ideas those hitherto been thought about.'
