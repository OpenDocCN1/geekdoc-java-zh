    a diagram. Instruction, whether aimed at developing academic skills in retarded
    children; increasing general knowledge in normal children; or advancing mathematical
    sophistication in gifted youngsters, may be conceived as a process in which a
    teacher systematically and effectively arranges and rearr an environment to bring
    about desired behavioral changes. Teaching on this basis, in whole or part, has
    been called as programmed instruction [15, 47]. Programed instruction is a technology
    based on experimental analysis of behavior [11, 14, 16].


    **Case study method:** In case study, the trainees are required to read and retain
    information independently from a particular case study; case studies are interactive
    nature [48]. Case study method is the best method to improve-solving skills [49].
    Case study helps in enhancing communication and interpersonal skills, and strengthens
    analytical skills. Training method is ideal for a situation where the learners
    have prerequisite information and benefit from the trainings essence of applicability.
    This is a low-risk, costly training method that can concurrently train a large
    number of learners, because of which it is a popular choice for law, medicine,
    and counseling students training [50]. Carroll et al. (1972) [10] did a survey
    of industry-based trainers, and it found that case study method was the second
    best method for knowledge acquisition; the best was programmed instruction. Also,
    for knowledge retention, case study method is the best training method after programmed
    instruction method as per the literature.


    **Sensitivity training method:** Sensitivity training method is a group gathering
    without a plan to discuss topics relating to “here and now” of the group process
    [51]; it denotes both a distinctive training method and a specific content area.
    The objective of sensitivity training is classified into three categories: individual
    point of view, group point of view, and the organization point of view. Individual
    point of view: A trainee can get a clear picture of how he/she is perceived of
    any given act. Different individuals have different views of the behavior. For
    example, to know the effect on any person as supportive or against it, meaningful
    or colorless or ambiguous. It is not common for all components of a group to have
    the same view of any person or event [52].


    **Role-playing method:** In role-playing, an individual learns by watching, respecting,
