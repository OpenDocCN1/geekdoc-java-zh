  md: '# Vineet Chouhan, Shubham Goswami, Pranav Saraswat

    Knowledge Management Vis-à-Vis Adoption of Mobile Health Record Application for
    COVID Pandemic


    The Use of electronic records has been widely accepted as an effective means of
    enhancing healthcare delivery. Despite advances in medical technology, healthcare
    continues to present worldwide difficulties of affordability, complexity, and
    access [1, 2]. Healthcare companies have issues regarding processes and information
    incorporation. Knowledge management is fragmented and often contradictory. Knowledge
    management can allow healthcare providers to access and exchange information about
    patients in present COVID situation. Healthcare systems are increasingly adapting
    to growing clinical demands that can be enhanced with the improvement of knowledge
    of the patients using knowledge-based technology. Knowledge-based technologies
    can successfully help pandemic agencies by encouraging universal information sharing
    and rapid real-time monitoring. Acceptance of consumers is one of the core elements
    in the growth of information management systems (IMS). Research suggests a model
    of the variables that affect the contribution of KMS repositories. The research
    utilizes the unified principle of adoption and usage of technology (UTAUT) to
    define variables that may have an effect on the decision to use mobile health
    records (mHRA) to make a contribution to information.


    **Keywords:** Mobile-Based Health Record Application (mHRA), Knowledge Management,
    COVID Pandemic


    # #1 Introduction


    Over the last decades, healthcare sectors have experienced tremendous changes
    in most of the countries in the world due to a rapid advancement in information
    and communication technology (ICT). Despite advances in medical technology, healthcare
    continues to present worldwide difficulties of affordability, complexity, and
    access [1, 2]. Healthcare companies have issues regarding processes and information
    incorporation. Information is fragmented and often contradictory. E-health needs
    improved knowledge management systems (KMS) to provide access to and interpret
    enterprise-wide knowledge for market intelligence. In comparison, information
    is not utilized for a competitive benefit, the consistency of consumer choices
    is directly linked to the quality and availability of knowledge. These multiple
    knowledge-edge bases cause inaccessibility of format and limited ease of usage.'
