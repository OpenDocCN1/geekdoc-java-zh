    The primary objective of this research-based book chapter is to explore the latest
    trends in training methods in the outsourcing services sector from a KWs perspective
    in India. The book chapter will also explore the effectiveness of these training
    methods in achieving their training goals/training objectives with respect to
    training needs. These training needs are identified through a questionnaire survey
