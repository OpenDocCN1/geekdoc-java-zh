    # 6 Web 3.0


    Web-based education and learning has opened up a vast world through the evolution
    of Internet and has given us the opportunity to access incredible prospects. As
    shown in the Figure 8, the evolution of web-based technologies started from the
    outmod version of web which was coined as web 1.0 and established itself as “read-only”
    medium. This was the very birth of the Internet. It is a centralized network where
    the main server hosts a website and with different servers getting access to this
    website. The main drawback of such a technology was that if all of one server
    went offline the entire web went offline. The next generation was of Web 2.0 which
    is said to a “read/write” medium. This was the creation of Enhanced Internet services
    which are presently used by people globally, for example Facebook, Netflix, and
    Google. Web 2.0 can be explained as distributed logistical systems where servers
    are all around and controlled by multiple data centers, where each of them will
    maintain a copy of the data and the advantage is that if one of the data centers
    is offline the rest of the team will be functional and there is no gap in availability
    of the application [33].


    ![](img/67e19c3171a87d33c56e2d4a6fb17274_111_0.png)


    **Figure 8**: Development of Web 3.0.


    The current most updated version of the web is known as Web 3.0. This newer, advanced
    version has no ownership and helps in rebuilding internet as the original creators
    intended of the internet which means freedom, censorship resistant, anyone can
    participate and generate a sustainable income, more competition, and lower barrier
    and in the present scenario it has an easier entry to the marketplace.'
