    # # Blockchain and web-based use case: decentralized application for official
    medical documents


    Generally, any KMSs are categorized into three types such as intelligent technique-based
    systems, knowledge work systems, and enterprise KMSs. A web-based KMS with the
    advanced technology blockchain improves the user experience to capture the details
    quickly. Moreover, this application or system can process, organize, and share
    the data with all the authorized nodes in the network efficiently by following
    some standard strategy.


    # ## 4.1 Web-based knowledge management DAPP


    Knowledge management is a process for making better data decisions, quality communications
    with the information, and improving data agility [38]. The main components of
    knowledge management are process, content, users, and strategy. Figure 1 shows
    knowledge management-based decentralized application architecture using blockchain
    technology and Web 3.0.


    In blockchain-based DAPP for official medical documents, users initially request
    a medical document through Web application to process the given details. Metamask,
    a cryptocurrency wallet, asks for confirmation to process the user''s request
    over a blockchain. The process starts on a blockchain by following some stages
    whenever confirmation is received from the admin or physicians. Minors begin to
    mine the data by solving a mathematical puzzl before making the data as a transaction
    in a block [39]. In the next stage, generates a Merkle root hash value to the
    data. The result shows as a transaction in a block created by a minor. Finally,
    the block is connected with the blockchain, as shown in Figure 1.'
