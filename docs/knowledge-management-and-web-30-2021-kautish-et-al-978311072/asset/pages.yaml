    **Lecture method:** The lecture method was the only way to transfer knowledge
    from one generation to another before the industrial revolution, when books were
    not yet mass commodities [42]. One of the most common methods of training is the
    lecture method. Lecture method is an easy, quick, and inexpensive way to present
    the vast problems to many groups of learners [43]. However, the cons of lecture
    method also need to be looked up, such as long lectures, one-way communication
    which leads to forgetting of issues [44]. Lecture method is a traditional method
    to illustrate information. Research depicts that lecture method is more effective
    when it comes to acquiring knowledge; however, learning is enhanced by 10% by
    programmed instruction in comparison to lecture method.


    **Programmed instruction method:** Programmed instruction is a method of providing
    trainees or students with a graded series of guided steps for new subject matter.
    These trainees or students work by themselves at their own pace through the programmed
    material and test their understanding each move by answering a question or filling
    in a diagram [46]. New subject matter/knowledge/skill can be presented through
    programmed instruction method in a sequence of controlled steps. Trainees have
    the flexibility and space to go through the programmed materials at their own
    stepwise, and each step they are tested through examination question or filling'
