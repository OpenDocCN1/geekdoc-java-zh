    An idea that has emerged explosively in different facets of life in the past decades
    is the KM and the evolution of this KM in the present information era leaped from
    the understanding that organizational knowledge is a big asset that truly needs
    to be sustained, nurtured, shared as well as disseminated across an organization
    or institution in order to obtain and provide solutions to the different organizational
    problems and concerns [24]. The various techniques and technologies which are
    used to establish, organize, and build on expertise and knowledge is known as
    KM [47]. The concept of KM is related to establishing an explicit knowledge through
    an organizational and organized process for attaining and governing the flow of
    knowledge of the employees [32] and this is to make sure that organizations or
    institutions must achieve their targeted mission as well as vision statement.
    KM has three important components which include: people, process, and technology.
    The main instruments of every society are the educational organization for the
    constant pursuit of knowledge and the essential part of KM in the educational
    institutions is very important. In other words, we can say the main function of
    educational organization is the KM [11]. Moreover, through the application of
