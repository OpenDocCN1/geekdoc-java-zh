  md: '# Purvi Pujari, Priyeta Priadarshini


    # Knowledge Management: A Driver for Boosting Intellectual Capital


    **Abstract:** The future belongs to the knowledge-based economies. A country''s
    growth potential will be increasingly dependent on the knowledge potential and
    management of the knowledge processes by the same. As the globe gears towards
    a circular economy, the aspects of sustainability and innovation become crucial.
    The need of the hour is to focus on intellectual capital (IC) as a key driver
    of the knowledge-based economy. In an economy, the focus should be on creating
    and developing knowledge intensive industries. The method is to prioritize the
    boosting of IC and enhance value creation in the economy. The correct emphasis
    on knowledge management (KM) in an economy can be leveraged through boosting IC.
    This will lead to more sustainable and innovative nation moving towards a circular
    economy. For any organization to ensure sustainable competitive advantage it is
    imperative to weave KM in its human resource initiatives. Investing in KM is a
    long-term strategy. Technology plays a crucial role in this process. KM technologies
    are information technologies that can be used to facilitate KM. The aim of this
    chapter is to identify the value creation process while providing suggestions
    for strategic interventions for a fruitful relation between organization''s employees,
    suppliers, customers, and other stakeholders. This process needs interleining
    of technology with the human resource processes. This chapter is divided into
    three main parts. The first part focuses on defining and explaining types of KM
    wherein the importance of KM systems is detailed. The second part deals describing
    IC, its significance and basic components. The third and most important part deal
    with the relationship between KM and IC and strategies for boosting IC. As the
    tertiary sector becomes more and more important and Technology 4.0 becomes the
    key driver of every growth activity, knowledge acquisition and KM will be the
    game changers.


    **Keywords:** Knowledge Management, Intellectual Capital, Technology 4.0, Strategy


    # 1 Introduction


    The move from a traditional economy to an information-based economy requires a
    consistent focus on knowledge management (KM) in society. The organizations in
    any society have emphasize value creation through an impetus to intellectual capital
    (IC). KM is a deliberate process of identifying, structuring, maintaining, and
    exchanging the expertise and experience of employees within an organization. It
    is an intricate process of value creation out of the knowledge potential of an
    organization.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'involves several elements like human resources practices, technology, culture,
    and organizational structures. There have been numerous attempts to define KM.
    KM is defined as "the process of creating, sharing, using and managing the knowledge
    and information of an organization [5]. It refers to a multidisciplinary approach
    to achieve organizational objectives by making the best use of knowledge." KM
    is the name of a concept in which an enterprise consciously and comprehensively
    gathers, organizes, shares, and analyzes its knowledge in terms of resources,
    documents, and people skills. KM draws from existing resources that your organization
    may already have in place-good information systems management, organizational
    change management, and human resources management practices.


    IC has been defined as "Intellectual is the term given to the combined intangible
    assets which enable the company to function." IC is the intangible value of a
    business, covering the competencies of its people (human capital), the value relating
    to its relationships (relational capital), and everything that is left when employees
    go home [2]. The focus of this chapter is to explore the role of KM in boosting
    IC.


    KM is the key function to enhance the sustainable competitive value of an organization.
    It refers to the learning and development of a company or its clients. It consists
    of a cycle of information formation, sharing, structuring, and auditing to optimize
    the efficacy of an organization.


    # Knowledge management has the following knowledge-focused activities:


    +   1. Generation of new knowledge or information

    2. Acquiring important information from external sources

    3. Utilizing available knowledge and information in intelligent decision-making

    4. Implanting knowledge in product and services

    5. Constituting knowledge and information in databases and respective software

    6. Assisting in the growth of knowledge through culture and motives

    7. Conveying information of the current organization into other parts of the organization

    8. Impact of KM


    The importance of KM is that it contributes maximum to the development of any
    nation and as a whole. Currently, the world is observing an information explosion.
    Knowledge allows the creation of abilities that determines the capacity to do
    things in an effective manner. Knowledge allows making decisions, predictions,
    and associations.


    Knowledge is the main source of decision-making, planning, design, and evaluation.
    Knowledge is also important expertise that creates a difference to individuals,
    groups of employees, and organizations. Generating, imparting, and disseminating
    knowledge or information is critical and it should be handled with care.'
