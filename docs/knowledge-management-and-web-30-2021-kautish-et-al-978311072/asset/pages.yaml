    # 3.1 Genetic disease: the fundamentals


    The World Health Organization (WHO) categorized the genetic disorders as orphan
    or rare diseases (RDs). RDs affect a minute portion of the population; however,
    with the overall prevalence of more than 7,000 varieties across the globe, genetic
    disorders are 나서 becoming constant with the genomic aberrations (more than 80%),
    even though environmental predispositions including regular exposure to hazardous
    materials such as cosmic rays escalate the progression of such diseases [48, 49].
    At the same time, intake of certain chemicals that could pass the transplacental
    barrier during the gestation period as well as infections is a leading factor
    [49]. For the last few decades the prevalence of RDs has been ever progressing.
    Over the recent data, around 350 million people across the globe have been estimated
    to be affected by the different varieties of such disorders [50, 51].


    # 3.2 An insight on the limitations of genetic/rare disease research


    Even though the genetic diseases are coming thick and fast in the global population,
    still it remains underrepresented as far as the overall output of the research
    is concerned. Following are the major attributes:


    +   - Lack of appropriate identification of disease frequency in line with the
    improper notion of awareness, inadequate diagnostic protocols, and undefined clinical
    guidelines for the respective rare or genetic diseases [52, 53].

    - Limited resources/funding to explore the hidden facets of such diseases [53].

    - Relatively restricted or circumscribed geographical periphery regarding the
    availability of patients and, therefore, lack of volunteers have been always hindering
    to perform the clinical trials. Moreover, inappropriate coding system does contribute
    to the recruitment process of the patients [53, 54].

    - The crucial factors affecting the genetic disease research are the lack of collective
    knowledge, scarcity of data on the pathophysiology of the concerned disease respectively.
    Unavailability of disease specific bio-markers alongside markers are the other
    obstacles [53].

    - Lack of desired therapeutics, inadequate commercialization of available remedies
    and under per marketability are worth mentioning among the other contributing
    factors [54] (Table 3).'
