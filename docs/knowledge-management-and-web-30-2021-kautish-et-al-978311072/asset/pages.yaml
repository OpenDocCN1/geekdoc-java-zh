    # There are seven knowledge levels in knowledge management:


    +   1. Knowledge of customers

    2. Knowledge of people/employee

    3. Knowledge of products and services

    4. Knowledge of processes

    5. Organizational database

    6. Knowledge of relationships to deal with customers, suppliers, and stakeholders

    7. Knowledge about IC of the workforce


    # Steps in KM process:


    The KM process comprises three important areas:

    1. **Accumulation of knowledge** – There are various models which have been created
    for accumulation of knowledge. Every organization must ensure the cooperation
    of employees in while selecting the models. Many times, employees are resistant
    to change and are not willing to cooperate. Knowledge accumulation is a gradual
    process and has to be done in stages. All resources within the organization must
    be thoroughly studied to ensure a comprehensive knowledge acquisition. The more
    important aspect for any organization is to prioritize its requirements and select
    the suitable technique.'
  merge: -1
