    puzzle given a system.

    - **Merkle Tree**: Merkle tree structure serves the block space by keeping a single
    hash value rather than taking all the transactions.

    - **Blockchain Network**: It contains several connected nodes following a P2P
    connection. Every node in the blockchain can do proof-of-work (PoW), verify the
    transactions, and process them.

    - **A Block**: A block is like a ledger or collection of records.


