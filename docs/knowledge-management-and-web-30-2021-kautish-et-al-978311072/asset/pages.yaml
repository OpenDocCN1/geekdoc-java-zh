    # 9 Findings and analysis


    A questionnaire was designed and administered to knowledge workers working in
    the outsourcing industry. These workers comprised trainers, managers, senior managers,
    and learning and development professionals who had a fair amount of knowledge
    of these methods and their outcome. For every training objective, three training
    methods were provided to respondents and they were asked to rank these three training
    methods for the specific training objective. These three training methods were
    derived from literature review, which are considered to be best for that specific
    training objective.


    For training objective "acquisition of new knowledge or skill," programmed instruction
    was ranked first by case study and conference (discussion) method. Training objectives
    such as change in attitude, according to respondents can be addressed by sensitivity
    training followed by role playing and conference (discussion) method. Case study
    method was ranked first by games and role-playing method to address training method
    problem-solving skills/troubleshooting skills. In order to address training enhancement
    of interpersonal skills/people management skills, sensitivity training method
    was ranked first while role-playing and conference (discussion) methods were ranked
    second and third respectively. The final training objective retention of knowledge
    can be best addressed by programmed instruction method followed by case study
    and sensitivity training method as per the respondents (Table 4).'
