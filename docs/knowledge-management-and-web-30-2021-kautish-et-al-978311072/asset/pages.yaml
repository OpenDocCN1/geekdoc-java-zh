    [72].


    # 4.1.2 Identification of polygenic mutants


    Introns are accountable for around 90% of the human RDs. This is suggestive of
    the fact that noncoding mutants are the major attributes of the RDs [73]. To evaluate
    such a condition of splice AI and a deep residual neural network (NN) has been
    aligned to determine the deleterious cryptic splice mutants in the MYBC3 noncoding
    sequence in association with hypertrophic cardiomyopathy (ORPHA:217569) [73].
    This novel method has been an eye-opener in the diagnosis and interpretation in
    response to the cryptic splice mutants. RDs are as complex as the genome itself.
    Being in mind that genetic diseases are predominantly polygenic in nature, the
    variants pathogenicity (VarCoPP) is formulated. It is an exclusively designed
    ML method for calculating the number of pathogenic genes. VarCoPP is by far an
    accurate tool to have in the clinical setup; it offers 95% to 99% specific accuracy
    as far as the pathogenic scores are concerned [74].


    # 4.1.3 Assessment of abnormal copy number variants


    Human copy number (CNVs) are one of the productive markers in the diagnosis of
    RDs. Despite the presence of several readily available databases, DNorm (specifically
    designated AI-mediated data processing tool, by ML methods) has been developed.
    It generates named entities recognition that, in turn, produces CNV digest consisting
    of 1,582 CNVs and 2425 diseases respectively. This approach has been employed
    successfully in Di George Syndrome (ORPHA:567) and has resulted in prudent outcomes
    [75].


    # 4.1.4 Diagnosis through phenotype-governed approach


    One of the classical improvisations among the ranks of phenotype-aided tools is
    the heterogeneous association network for RDs. This is a collective package of
    data-oriented algorithm-graph convolution plotting in combination with disease-related
    genes, alleles, and phenotypes. This system renders the exact binary correlation
    among the existing terminologies. It has already delivered better performance
    in comparison to the conventional Orphamizers [76]. On the contrary, Phen-Gen
    is generated so as to incubate data sequence from patients in'
