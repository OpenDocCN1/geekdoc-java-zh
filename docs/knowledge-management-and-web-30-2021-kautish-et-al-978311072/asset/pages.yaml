  md: '# Navita Mahajan, Seema Garg, Oridoye Tomide Hakeem

    Diversified Landscape of Knowledge Management: Transformation in View

    of Organizational Sustainability Sustainability


    # Learning objectives:


    +   - Knowledge and knowledge-based view of firms

    - Insight into knowledge management with diversified landscape for organizational
    sustainability

    - Knowledge transformation and web transformation in view of Web 1.0 to Web 3.0


    **Abstract:** The changing landscape of modern society, diversified aspects of
    global economy, knowledge-based models, and multidimensional theories of firms
    require global perspectives of innovative thoughts. Organizations are to be prepared
    for the future and scrutinized what these businesses are doing best from the rest.
    The competitive environment of firms is changing swiftly, hence knowledge-based
    management and its transformational practices are crucial for sustainability and
    self-reliance of businesses. The time has come for traditional sources of knowledge
    to get new paradigms, technological changes, highly advanced modern practices,
    intangible characters, and pertinent information, all gaining priority in a firm
