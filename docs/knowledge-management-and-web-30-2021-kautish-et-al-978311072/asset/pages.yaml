    # Intellectual Capital


    Figure 5: Components of intellectual capital.

    (Prepared by the authors)


    The achievement of each organization depends increasingly more on human resources
    than just physical capital. At the point when we think about human resources as
    a mix of capability, aptitudes, capacities and insights of individuals, which
    implies as a factor, that gives exceptional, unique, and uncommon to each business,
    at that point, we realize that specifically, representatives are the source that
    can learn, to make changes, development, and willingness to have innovative exertion,
    which directly can lead to long-term flourishing organization.


    IC is a term that refers to the intangible assets of an organization, its employees,
    and their cumulative knowledge and awareness about a function/job. It includes
    its relationships with its investors, customers, which is termed as relationship
    capital, its employees, employee training and development, performance appraisal
    which is termed as human capital, and what is left when employees go home, is
    datapolicies, culture, and mission is termed as structural capital. It is a conceptual
    term used to measure assets a company may have that are not visible on a balance
    sheet, such as the expertise and experience of its employees.


    Although this is an important component of any organization, it is subjective
    and very hard to quantify accurately. However, successful organizations usually
    focus on uplift and enhance their IC by training their employees to a certain
    level and making sure they are motivated and encouraged to give their best in
    a congenial conducive environment. Companies that fail to take these thoughts
    into account may find employees who are less motivated, poorly trained, thereby
    affecting profits and productivity of the organization.'
