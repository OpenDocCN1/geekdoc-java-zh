    administrative, teaching and learning, research process, student service and lastly
    the human resource subsystems [21]. The use of systems and principles in various
    educational institutions can develop more flexibility into decision-making processes,
    easy access to scientific research, promotion in teaching and learning processes,
    establishment of the effective internal and external communication network, synergy
    at the students and faculty and improvement in quality as well as amidst research
    activities in different educational institutions [25]. An important and intrinsic
    feature of KM is the creation and the development of knowledge in an effective
    way [30, 8] and this creation of knowledge is very essential for the survival
    and maintenance of any organization or institutions especially the educational
    ones. We are aware that knowledge creation is an activity which occurs throughout
    daily activities, either at work or at the social settings. However, it occurs
    in different form that can be through humanistic means like talking with people
    or other trainings or even through the technical mechanisms, for example, data
