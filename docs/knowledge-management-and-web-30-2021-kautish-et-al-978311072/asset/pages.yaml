    # 3 Objectives


    +   - To identify the level of awareness regarding Web 2.0 tools among PG students
    of Kashmir University.

    - To recognize the degree of usage of Web 2.0 tools by the PG students of Kashmir
    University.

    - To find out the level of awareness among the PG students regarding Web 3.0 technologies.

    - To examine the reasons for joining the social media platforms by the PG students.

    - To discuss the role of knowledge management (KM) in the education sector.


    # 4 Methodology


    The present study aimed at inspecting the awareness level and usage of Web 2.0
    and Web 3.0 tools among PG students of various departments at the University of
    Kashmir, Srinagar, J&K. The sampling technique used for the study was simple random
    sampling and the sample size comprised of 200 respondents in number. A self-made
    questionnaire was designed to gather data from the students studying in different
    departments of the University of Kashmir. Further, the descriptive statistics
    were then analyzed with the use of frequency counts as well as percentages. The
    results that were then displayed in the form of tables and diagrams.


