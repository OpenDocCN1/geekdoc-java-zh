    # Types of knowledge:\n\n+   1. Tacit knowledge – This knowledge is inbuilt and\
    \ natural. It is not easily codified and sharing is difficult. Examples of such\
    \ knowledge are creative thinking, analytical thinking. This knowledge is gained\
    \ usually from personal experience and it is considered difficult when it comes\
    \ to sharing knowledge.\n\n+   2. Explicit knowledge – It is easy to share, understand,\
    \ teach, and articulate. Examples include solving a mathematical equation, how\
    \ to download an application android.\n\n+   3. Implicit knowledge – It is nothing\
    \ the application of explicit knowledge. The skills which can be transferable\
    \ from one work to another are an example of implicit knowledge.\n\n![](img/67e19c3171a87d33c56e2d4a6fb17274_140_0.png)\n\
    \n# 2 Types of knowledge management\n\nThere are basically four types of knowledge\
