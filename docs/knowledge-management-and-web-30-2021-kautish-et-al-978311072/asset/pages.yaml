    # 3 Components of intellectual capital


    +   1. Human capital – The creative capacity, awareness, ability, and knowledge
    of employees is the human capital of any organization. Although people do not
    like to be denoted themselves as capital, so terms like talent and human resources
    are used alternatively.


    +   2. Relational capital – It explains the relationship of an organization with
    investors, customers, employees, stakeholders, and communities. This includes
    both formal and informal contracts.


    +   3. Structural capital – Company’s capacity to invent and innovate, business
    processes and culture contribute to structural capital. These are intangible assets
    of any organization. Examples include data, media, intellectual property, systems
    and processes.'
