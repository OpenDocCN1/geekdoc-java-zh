  md: '2) Storage of information – Any KM system must have the proper selection of
    its devices and other technology parameters. The capturing of knowledge becomes
    a significant step where the pathways and systems in the organizational memories
    are defined. This is also known as institutionalization of the knowledge.


    3) Sharing of knowledge – This is an area that specifically deals with distribution
    of knowledge. In this process, the interaction of employees among themselves and
    other stakeholders plays a very important part. The inherent culture of the organization
    is also very significant in ensuring the successful passing of the knowledge.


    ![](img/67e19c3171a87d33c56e2d4a6fb17274_139_0.png)


