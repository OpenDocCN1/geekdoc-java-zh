    # 8 Proposed framework


    HRM is a department in all organizations that can see and handle all requirements
    and aspects of employees. There are several jobs that HRM handles as employee
    hiring, their job performance analysis, and benefits appraisal. HRM department
    is dedicated to the welfare of employees in an organization. The existing HRM
    approach has the following problems:


    +   - Management of organizational knowledge compatibility with Web 3.0.

    - Communication overheads among groups and individuals.

    - Inefficient documentation and proper sharing of information among employees.


    While keeping these in mind, the proposed framework is designed to coordinate
    the entire HRM system globally. The proposed framework is designed for using a
    machine learning approach over the cloud. The framework is designed in the distributed
    architecture below (Figure 6).


    The following steps are performed for proposed architecture:


    +   1. The data collection collects the data from employees regarding their complaints,
    performance, appraisal, bonus distribution, etc.

    2. Then the collected data is stored at the cloud server where other units can
    access data.

    3. Then analysis unit integrated with machine learning will perform performance
    analysis according to the requirement.

    4. The result of the analysis is also stored at the cloud server.

    5. Finally, decision-making unit is integrated with a machine learning approach
    such as fuzzy logic to decide for employees and to coordinate them through a cloud
    server.'
