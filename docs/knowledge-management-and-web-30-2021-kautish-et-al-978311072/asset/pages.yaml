    More importantly, this new approach remarkably opened up the traits those were
    not diagnosed before [89, 90]. Besides this, it is quite understandable that genomic
    data cannot simply be the way out to deal with genetic diseases. To add to it,
    there is not enough data existing in terms of most of the RDs across the globe.
    Therefore, it is imperative to use AI and ML algorithms in modern genetic disease
    research to find out the hidden mechanisms with RDs leading to the development
    of novel therapeutics. In all in, the field of biomedicine is a huge one and there
    are several things to be remembered when introducing a new and computer-aided
    technology into practice. Henceforth, the relevant issues including the social,
    ethical, as well as legal attentions should be taken with full care and consideration
    in order to make AI-based medical practice a powerful weapon.


