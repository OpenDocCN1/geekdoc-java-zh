    # 4.1.5 AI-based imaging in diagnosis of RDs


    Morphological dysfunction is often characterized with RDs. AI-guided imaging has
    been one of the meaningful tools in assessing the phenotype data leading to the
    correct diagnosis [78, 79]. One of the convent methods among the ranks is DeepGestalt,
    which uses the ML system in tandem with FaceGene (a phenotype-driven framework)
    to recognize genetic disorders with moderate to high specificity [80]. Cornelia
    de Lange syndrome (ORPHA: 199), Emanuel syndrome (ORPHA: 96170), and Pallister-Killian
    syndrome (ORPHA: 884) are the examples where DeepGestalt has been successfully
    employed [81–83]. Similarly, AI algorithms along clinical imaging techniques are
    designed to achieve significant images for acromegaly (ORPHA: 963) and Pick disease
    (ORPHA: 282) [84, 85].


    # 4.1.6 Other associated aids


    With the introduction of advanced methods the diagnosis of genetic disease is
    becoming easier. However, disorders like hemorrhagic telangiectasia (HHT, ORPHA:
    774) still exhibit high cost for the diagnosis. Of late, neural networking has
    been tagged with infrared spectroscopy (IR) to minimize the testing cost for HHT
    [86]. Similarly, a deep learning predicting algorithm has been applied in patients
    with synovial sarcoma (SS, ORPHA: 3273). It obtained greater outcome in comparison
    to the conventional methods of diagnosis [86, 87]. Overall, innovative ML techniques
    have added a new window to understand and depict the RDs with ease [87].


    # 5 Discussion and conclusion


    Unlike most of the conventional diseases ranging from the mild cough to the deadliest
    ones, genetic diseases are unique with respect to the trajectory, pathophysiology,
    and of course, diagnosis. Until the advent of AI and ML algorithms medical practice
    had to depend on the traditional methods of gene sequencing and genetic counselling
    as the major diagnostic attributes. The introduction of AI-mediated procedures
    combined with patient phenotype-driven data has significantly excelled the optimum
    outcome toward RD diagnosis [88]. To illustrate more, AI-based medical diagnostics
    not'
