    # 4 Conceptual framework


    Different training methodologies are used to impart learning of KWs in outsourcing
    sector methods. These training methods are specific to training objectives or
    the training needs. A training method is one of factors that generally determine
    how effective a training program is. Some of the methods used to enhance learning
    of KWs in outsourcing organizations are: demonstration, discussion, debates, lectures,
    presentation, role-play, game activities, case studies, electronic media usage
    (TV, videos, and films), and so on.


