    to assess (see per Table 4) at this second step of research. The path coefficients
    (parameter estimates) were used to assess the magnitude and direction of relationships
    and to test the research hypotheses. The structural model was estimated by AMOS
    22 to represents relationships among observed and unobserved variables using path
    diagrams. The greater value of R² revealed better model quality. The results revealed
    that all the hypotheses are significant. The results shows that the relationship
