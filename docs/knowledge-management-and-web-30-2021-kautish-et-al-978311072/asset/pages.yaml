    # 10 Conclusion


    The current training methods used in the outsourcing services sector with respect
    to addressing a particular training need from a KW''s perspective is somewhat
    similar to findings of Carroll et al. 1972 [10]. According to Carroll et al. 1972
    [10], "Knowledge acquisition" could be best addressed by programmed instruction
    method and our findings in the outsourcing services sector depict the same; that
    is, "acquisition of new knowledge or skill" could be best addressed by programmed
    instruction training method. "Change in attitude," according to Carroll et al.
    [10], could be best addressed by sensitivity training method, which is similar
    to our finding. Training need "problem solving skills," is best addressed by case
    study method, followed by business games and role-playing method. "Knowledge retention"
    is best addressed by programmed instruction method followed by case study method
    and sensitivity training method.


    Our findings state that role-playing training method is the most used training
    method in the outsourcing services sector. It is widely accepted and to tackle
    training needs pertaining to "change in attitude" and "interpersonal skills."
    Programed instruction training method is the second most popular training method
    in the outsourcing services sector. Case study training method is the third most
    popular training method in the outsourcing services sector. Case study as a training
    method was found to be the best to address training need "problem solving skill."
    Programed instruction as a training method is considered to be best for the training
    need "acquiring new knowledge or knowledge retention."'
