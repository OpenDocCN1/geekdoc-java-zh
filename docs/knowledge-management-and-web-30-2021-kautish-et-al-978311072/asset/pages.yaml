    # 3 Theoretical framework


    The Unified Theory of Acceptance and Use of Technology (UTAUT) is used, as the
    speculative outline to empirically test the factors that impact the adoption of
    mHRA developing country context [16]. UTAUT is the most popular approved and behavior
    analysis model, as it is derived from theory of planned behavior (TPB); the theory
    of reasoned action (TRA); technology acceptance model (TAM); innovation diffusion
    theory (IDT); PC utilization model (PUM), and the social cognitive theory (SCT).
    The model is aimed to attain a unified opinion of consumer recognition, and is
    appealed to predict 70% of the modification in purpose to use new technologies
    [17].


    Using a review of prior studies of UTAUT in healthcare [18–20], the most used
    structures in this analysis are the latest science. The computational analysis
    model includes the systems commitment expectations (EE), Performance Expectations
    (PE), Facilitating Condition (FC), social impact (SI), and use behavior (UB).
    As UTAUT is the most robust framework for predicting technology acceptance with
    good predictability. However, in particular in developed nations, its sufficiency
    in forecasting technology acceptance is uncertain [21]. Some authors use UTAUT
    variables with theoretical models for determining antecedents [22–24]. Because
    mHRA adoption is highly context-specific [25], it is important to examine the
    opinions of users.


    In order to increase the predictability of UTAUT in a healthcare environment the
    addition of domain-specific determinants can also be considered [26, 27]. Technology
    adoption in developing countries like India is influenced by background specific
    values and concerns related to obstacles, as the digital divide. In addition,
    in order to increase its predictive capacity, context-specific variables are applied
    to the simple UTAUT model. An updated UTAUT is then used to seek further into'
