  md: '# 3.4 Self-efficiency (SE)


    It is the belief of performing a particular behavior. Self-efficacy perceptions
    have been found to influence decisions about what actions to undertake [34]. Educational
    researchers have employed self-efficacy instruments in various disciplines and
    academic settings [35]. Studies also measure self-efficacy specific to the online
    environment [34, 36, 37]. Chao and Castañeda [38] studied personal dedication
    with a smartphone application to learn Spanish. Few types of research also found
    the Motivational and emotional commitment to learning Spanish with a mobile application.
    Few also found self-efficacy positive impact on the intention to adopt mHealth
    apps [39, 40]. The following theory was raised according to the discussion:


    +   H4. SE has a positive impact on the intention to use mHRA


    # 3.5 Trust (TR)


    Views on security and confidentiality have received interest in recent literature
    on online transactions. The perception of risk to safety and threat of personal
    data loss may differ with a change in demographic of consumer groups. This negative
    emotional response, the intention of adoption is diminished by anxiety or frustration
    with technology. Older adults are also reported to have significant problems of
    confidence [41]. This analysis expands the fundamental UTAUT with an additional
    confidence variable to increase the prediction power. The following theories are
    also suggested:


    +   H5. TR harms the intention to use mHRA


    # 3.6 Facilitating conditions (FC)


    It can be described as to what degree a person assumes that the usage of mHRA
    is enabled by an organizational and technological infrastructure. Conditions of
    facilitation require service scale scale products, protection and secrecy, technical
    difficulties. The direct effect of FC technology help on the behavioral purpose
    and technical use is supported by previous studies [10, 42]. The Boontarang et
    al. [31] research demonstrated that FC has a positive effect on the behavior.
    The argument above lead to these hypotheses:


    +   H6. FC has a positive impact on the intention to use mHRA


    +   H7. FC has a positive impact on the actual use of mHRA'
