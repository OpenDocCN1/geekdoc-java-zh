    # 7 Methodology


    A questionnaire was constructed on the latest effective training methods used
    to enhance learning of KWs in outsourcing organizations and to trainers, managers,
    senior managers, and learning and development employees who have been conducting
    training sessions or programs in outsourcing organizations. The questionnaire
    was designed in such a manner that for every training objective, three training
    methods were provided to respondents and they were asked to rank these three training
    methods for the specific training objective. These three training methods were
    derived from literature review, which is considered to be best for specific training
    objective.


