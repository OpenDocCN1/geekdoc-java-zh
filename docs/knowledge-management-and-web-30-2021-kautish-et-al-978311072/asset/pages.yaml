  md: '# Afreen Niyaz

    Impact and Role of Knowledge Management

    and Web 3.0 in Education Sector: An

    Empirical Study of University of Kashmir


    **Abstract:** The process by which knowledge is created, shared, and used is termed
    as knowledge management (KM) and it is all about changing the way everybody works.
    The KM is promoted as a significant factor for the organizational sustenance as
    well as for the upkeep of the worthwhile. Intensive discussions have been carried
    out the importance of KM within our society since many years. We are aware that
    different technologies have evolved over a period of time, thus reducing the time
    required for disseminating the knowledge and they are even allowing student autonomy,
    greater collaboration as well improved academic efficiency. These applications
    have mushroomed and at the same time social media has even attracted considerable
    attention from students of different fields. The popularity of such technologies
    is influencing the means by which different libraries and other cultural heritage
    organization''s function. The continuous evolution of the innovative internet
    has unlocked unimaginable opportunities in web-based education. The present study
    aims to investigate the use of Web 2.0 tools and the level of awareness among
    the Post Graduate (PG) students about Web 3.0 technologies at the University of
    Kashmir, situated in Srinagar of Kashmir. The present study has implemented a
    descriptive survey method. A self-designed questionnaire was used to gather the
    required information from 200 respondents. The results obtained showed that the
    PG students of the Kashmir University are accustomed with most of the tools of
    Web 2.0 like Instant Messaging, SNS, wikis, and blogs while they are not acquainted
    with Podcasts, social bookmarks, or RSS feeds. The study also revealed that the
    most commonly used include WhatsApp, Facebook, YouTube as Wikis. The respondents
    specified interacting with friends and family, sharing ideas for their individual
    life and connections with many people as the reasons for linking with social networking
    sites. It was found that PG students are not aware about the latest Web 3.0 technologies
    and need more guidance in that very field. It is suggested that academic institutions
    should integrate units related to Web 2.0 as Web 3.0 tools into the courses in
    order to train the professionals of future by improving their proficiencies to
    be competent for the future challenges of using these tools.


    **Keywords:** Internet, Learners, Technology, Knowledge Management, Kashmir University,
    Social Network'
