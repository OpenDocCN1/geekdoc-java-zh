  md: '# 5.3 Problem-solving/troubleshooting skills


    Problem-solving skill is a combination of problem recognition, problem analysis,
    strategy creation, information management, resource allocation, tracking, and
    problem lesson. One can go back and forth through the steps, change the order
    when required, or skip steps when it appears appropriate [25]. The most effective
    training method is the case method followed by business games and roleplaying.
    Fox, 1963 [26] had exposed some students to case analysis and the output was:
    One-third of the students showed moderate improvement in handling cases, and the
    remaining-one-third showed no improvement in handling cases. Training in brainstorming
    could also improve problem-solving skills [27, 28]. Brainstorming can be taught
    by role-playing.


    # 5.4 Enhancement of interpersonal skills/people management skills


    Interpersonal skills are goal-directed behaviors used in face-to-face communication
    to achieve desired objectives [29]. Interpersonal skills are also referred as
    people skills, face-to-face skills, social skills, and interpersonal ability.
    Sensitivity training is most effective, followed by role-playing, to address enhancement
    of interpersonal skills. While conference (discussion) method and case study method
    are also considered effective [30]. Role-playing is effective in increasing sensitivity
    to employee motivation [31]. Role-playing is also effective in improving interviewing
    skills [32]. Role-playing improves group leadership skills which are a form of
    interpersonal skills [33–36].


    # 5.5 Retention of knowledge


    Retention of knowledge acquired is the retrieval of information stored in longterm
    memory [37]. Programmed instruction is most effective followed by the case study
    method and the sensitivity training method. Role-playing, conference (discussion)
    method, and business games are significantly more effective training methods [38–41].
    The study believes that the quantity of materials retained is usually proportional
    to the quantity learned [38, 39].'
