    # 5.1 Acquiring new knowledge or skill


    Acquiring new knowledge or skill is the process of processing and storing new
    information in memory, where effectiveness is often measured by how well the information
    can be extracted from memory at a later stage. Acquiring new knowledge or skill
    is one of the training objectives predominantly in outsourcing organizations.
    The most effective training method for knowledge gain is programmed instruction
    method, and the least effective is lecture method [10]. In the programmed instruction
    method, the trainer controls the interaction of trainee with specific features
    of the instructional setting. It was through B. F. Skinner''s [12–14] work that
    the programmed instruction method. Skinner''s main focus was to state that self-education
    should be in the framework of reinforcement theory through programmed means. Training
    is a method of creating an urge to put into organize what a trainee has learned,
    inspiring, motivating, and ensuring at the same time both the means and the appetite
    for using the knowledge that has been acquired. While teaching is restricted to
    giving knowledge based on a given number of explicit ideas [17]. Some prominent
    researchers, both old and modern, formulated a number of theories pertaining to
    training are Old Researchers: William James, J. F. Herbert, Wilhelm Wundt. Modern
    Researchers: E. L. Thorndike, E. R. Guthrie, C. L. Hull, B. F. Skinner, W. Kohler,
    and E. C. Tollmann.


    # 5.2 Change in attitude


    The word "attitude" is used to denote a person''s overall assessment of individuals,
    objects, and issues. Therefore, a person''s attitude refers to individuals, objects,
    and issues positively or negatively or favorably or unfavorably in general [18].
    Training programs pertaining to attitude is conducted across various sectors,
    and is much relevant to outsourcing industry. Sensitivity training method is the
    most effective training method for change in attitude; however, role-playing,
    conference method, and case study are also effective in changing attitudes. Numerous
    studies among students depict that the role-playing method is effective in addressing
    change in attitudes [19, 20]. Role-playing is effective if the participants in
    the role-playing exercise are asked to take a viewpoint opposite to their own
    and to verbalize this opposite viewpoint to others [21–24].'
