    # 1 Introduction


    Knowledge Workers (KWs) in the outsourcing services sector as trainers, learning
    and development professionals, and managers play crucial roles. These KWs also
    help in upsk employees who lack skills needed to perform a task. The KWs also
    have to frequently enforce policies and serve as the key point of contact between
    senior and junior managers. However, this group is often overlooked when it comes
    to their own development. Middle managers also lack skills in planning/project/financial
    management skills that are very important to policy implementation. They often
    have the knowledge of the job (the technical aspects of it) but are utterly devoid
    skills pertaining to managing people, problem-solving abilities, and interpersonal
    skills, and so on, which are now a large part of their KRAs (key responsibility
    areas). Therefore, equipping them appropriate skills is crucial. Middle management
    or managers are essentially a part of KWs.


    Training is an important element in creating a high-performance culture [1]. Training
    is used to enhance knowledge, skill, and attitude deficiencies. According to Mandakini
    [2], training methodology includes methods, materials, techniques, and resources
    used to implement the training or workshop and transfer new knowledge, skills,
    and attitudes to participants. Before selecting the training methodology, training
    objectives or training need identification (TNI) needs to be done to address the
    knowledge, skill, and attitude deficiencies.'
