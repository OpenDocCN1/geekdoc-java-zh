    Kibana: 该工具提供了存储在 Elasticsearch 中的数据的前端可视化。通过在 Web 服务器上设置 Kibana 并将其链接到 Elasticsearch，用户可以创建并自定义符合其监控偏好的仪表板。


    # 日志集中化


    随着每个微服务生成自己的日志，当这些日志分散在许多服务器或容器时，管理这些日志可能会变得复杂。将日志集中在一个地方可以简化诊断和分析跨服务数据的任务。


