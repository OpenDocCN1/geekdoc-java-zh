  trans: '

    Spring Boot 以其自动配置能力而闻名，该功能通过自动安排 Spring bean 和设置，实现了新 Spring 应用程序快速设置和部署。这种自动化是基于项目的依赖和环境特征的，使开发者能够快速运行应用程序。然而，特定场景可能需要特定的配置来满足独特的运行需求或增强性能。


    ## 自动配置的基础知识


    Spring Boot 中的自动配置旨在消除大部分的手动配置过程。它会根据类路径中检测到的库和开发者指定的属性，智能地配置设置和 bean。例如，如果在类路径中发现了
    H2 数据库库，Spring Boot 默认会配置一个内存数据库。


    虽然自动配置提供了一种非常高效的应用程序设置方式，但它并不总是能完美契合每个项目的特定需求，因此通常需要进行定制的调整或个性化。


    ## 自定义自动配置的方法


    在 Spring Boot 中，自定义自动配置可以通过多种方法实现，从覆盖属性到创建定制的配置类。


    1. **属性覆盖**：最简单的自定义方法是在 `application.properties` 或 `application.yml` 文件中覆盖默认属性。例如，数据库连接设置可以如下进行自定义：


    ![](img/image_rsrc2CY.jpg)


    此更改明确设置了数据库 URL 和访问凭据，取代了默认的自动配置设置。


    2. **排除自动配置**：Spring Boot 允许使用 `@SpringBootApplication` 注解的 `exclude` 属性排除不需要的自动配置。


    ![](img/image_rsrc2CZ.jpg)


    在这里，排除了 `DataSourceAutoConfiguration`，允许在没有 Spring Boot 干扰的情况下自定义数据源配置。


    3. **实现自定义配置类**：通过定义自定义的 `@Configuration` 类可以实现更复杂的定制。这些类可以指定修改或替换默认配置 bean 的
    bean。


    ![](img/image_rsrc2D0.jpg)


    此配置引入了自定义的 `BCryptPasswordEncoder` bean，Spring Boot 用它代替了默认的安全配置。


    4. **使用条件注解**：如 `@ConditionalOnClass` 和 `@ConditionalOnMissingBean` 等条件注解提供了一种高级方法，根据某些类或
    bean 是否存在来条件地加载 bean。


    ![](img/image_rsrc2D1.jpg)


    在此设置中，只有在没有配置其他 `MyService` bean 时，才会实例化 `DefaultMyService`，确保了在不覆盖任何自定义配置的情况下有一个默认值。


    ## 结论


    在 Spring Boot 中定制自动配置允许开发者精炼框架的配置方式，以更好地对齐特定的业务需求并优化性能。通过利用属性覆盖、排除特定的自动配置、编写自定义配置类以及使用条件注解，开发者对他们的
    Spring Boot 应用程序获得了精确的控制。这种定制能力确保了 Spring Boot 能够适应支持各种应用程序和企业需求，从而保持其在应用程序设置中的效率和有效性。


    ## 跨环境的配置属性外部化


    在现代软件开发中，熟练处理跨环境的配置属性至关重要，以确保应用程序保持可扩展和适应性。Spring Boot 在提供健壮的配置设置外部化方面表现出色，允许在应用程序打包产物之外调整这些设置。这种能力是区分开发、测试和生产环境之间设置的关键，有助于在无需更改代码或重新构建应用程序的情况下实现无缝的环境切换。


    ## 外部化配置的原理


    随着应用程序从开发过渡到生产，通常需要不同的设置来适应每个环境的各种条件。例如，数据库连接、API 密钥和用于凭据的配置通常需要在环境之间发生变化。将这些设置直接嵌入代码中不仅限制了灵活性，而且如果敏感数据暴露在版本控制中，还会带来安全风险。


    通过外部化配置，开发者可以简化部署过程并增强安全性，因为配置更改不需要直接修改代码库。


    ## Spring Boot 中外部化配置的技巧


    Spring Boot 支持多种外部化配置的方法，优先考虑跨不同部署环境的灵活性安全性。


    1. **特定 Profile 的配置文件**：Spring Boot 可以使用专用的配置文件管理特定环境设置，例如位于 `/src/main/resources`
    目录下的 `application-dev.properties`、`application-test.properties` 和 `application-prod.properties`。


    ![](img/image_rsrc2D2.jpg)


    ![](img/image_rsrc2D3.jpg)


    开发者可以使用 `spring.profiles.active` 属性激活特定的配置，既可以在这些文件内部，也可以作为命令行选项，例如 `--spring.profiles.active=prod`。


    2. **使用环境变量**：环境变量提供了一种管理设置的安全方式，防止敏感信息被硬编码在应用程序中。Spring Boot 通过允许环境变量直接映射到配置属性来实现这一点，遵循一种约定，即属性名转为大写，并将点替换为下划线。


    ![](img/image_rsrc2D4.jpg)


    3. **命令行参数**：命令行参数是临时或在开发期间覆盖配置设置的理想选择，提供了高度的灵活性。


    ![](img/image_rsrc2D5.jpg)


    4. **通过 Spring Cloud Config 进行集中配置**：对于在分布式或微服务架构中运行的应用程序，Spring Cloud Config
    提供了一种集中管理配置的方法。配置存储在版本控制的仓库中，允许更改传播到所有客户端应用程序，而无需重新部署。


    ![](img/image_rsrc2D6.jpg)


    ## 配置管理的最佳实践


    * **安全实践**：避免在版本控制的配置文件中存储敏感信息。相反，请使用环境变量或安全的密钥管理服务。

    * **清晰的组织**：为不同的环境维护不同的、组织良好的配置文件，以防止配置错误。

    * **文档**：确保所有属性都有详尽的文档，突出它们的用途和允许的值，特别是对于那些在部署期间可以被覆盖的属性。


    ## 结论


    在各种环境中有效管理配置属性对于部署灵活且安全的应用程序至关重要。Spring Boot 的外部化能力有助于根据不同环境调整配置设置，从而支持高效的 CI/CD
    流程。这种方法不仅增强了应用程序的运行管理，而且符合在多样化的 IT 环境中维护安全、健壮和灵活软件系统的最佳实践。


    # 第二章


    # 使用 Spring Boot 构建微服务


    ## 微服务架构原理

