    2. **创建 Swagger 配置**：通过在你的 Spring Boot 应用程序中配置 Springfox 来设置它。这涉及创建一个新的配置类，指定如何生成
    Swagger 文档：

    ![](img/image_rsrc2F1.jpg)

    此配置告诉 Springfox 记录指定包内的 API，使得控制哪些内容被记录变得简单。


    3. **访问 Swagger UI**：在应用程序配置并运行后，通过在浏览器中访问 `http://localhost:8080/swagger-ui.html`
    来访问 Swagger UI。该 URL 提供 Swagger UI，你可以在其中与已文档的 API 端点进行交互。


    ### 使用 Swagger 注解进行详细文档

    为了进一步改进文档，可以在整个 API 代码中广泛应用 Swagger 注解：


