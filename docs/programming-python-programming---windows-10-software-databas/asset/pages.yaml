  md: '# Introduction


    Knowing where to begin with computer programming can be a real challenge. Most
    people have little to no knowledge of how to write computer code or when to even
    begin when writing a computer program. Python is an easy language to learn, and
    is capable of so much more than that simple programming.


    It is a general purpose language that first appeared in the 1980''s and was, believe
    it or not, named after Monty Python. It''s used for a wide range of purposes,
    from testing microchips, to powering some of the biggest websites in the world
    and to building video games. Python is a small language, close to the English
    language and contains hundreds of party libraries.


    Because Python is similar to the English language, it is easy to read. It also
    follows very strict rules on punctuation, which means that, unlike some computer
    languages, your code is not littered with annoying curly braces ({}), that get
    in the way and make it difficult to read. Python also contains PEP 8, a set of
    rules that tells each Python developer how their code should be formatted, meaning
    you always know what to do, where a new line should be and helps you to read other
    Python scripts, no matter what they wrote.


    Python has been in existence for more than 20 years and there is an awful lot
    of Python code about. It is also an open source language, which means that anyone
    can take it, read it and modify it for their own uses. There are plenty of Python
    community groups where users can go to get help or just join in general Python
    chitchat.


    In this book, I want to talk about what Python can do and how to get it up and
    running on your Windows 10 PC, as well as how to use it. This is suitable for'
  merge: -1
  pgno: 6
- img_proc: true
  md: complete beginners or for more advanced users and I hope that everyone will
    gain something from this book.
  merge: -1
