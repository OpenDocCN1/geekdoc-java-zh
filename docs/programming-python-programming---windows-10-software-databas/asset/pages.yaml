    * Make sure that you download the version that corresponds with the version of
    Windows that you are running and whether it is 32 or 64-bit.

    * If you are running the Mozilla Firefox browser, click on Save File. If you are
    using Internet Explorer, click on Run

    * The Python installer will open so you is going to be able to access Python on
