  md: '# ## Creating and Running Programs


    In order for Python to be truly useful to you, you need to know how to create
    a program and run it. On Windows 10, when you install Python, this will associate
    all files with the .py extension with the interactive interpreter. To run any
    program, open the terminal and change the directory to the one that you installed
    Python in – something like cd c:\Python** - make sure you replace ** with the
    version number. When you are ready to run your program, you type in the following:


    +   - **./program.py - ** denotes the name of your program


    These programs are simply text files that contain a set of instructions for the
    interpreter and they are compiled in your text editor. Python will install something
    called an IDE – Integrated Development Environment, which will have some useful
    tools in it, such as a syntax checker, code browser and debugger. All of these
    tools are designed to help you get your coding correct from the word go.


    # ## Comments


    Any line of code that begins with # is a comment. Comments are for your information
    and will not be read by the interpreter. Every line that contains a comment must
    begin with the hash symbol.


    # ## Variables


    Remember that very simple program we created at the beginning of this chapter?
    The x is a variable and we associated that with a number, in this case 3, before
    we printed it to the screen. Variables are the most basic concept of any programming
    language and are what we use to store values in while we work with them.


    The code we wrote – x = 3 – is a statement – statements on a particular job'
