  md: '# More Complex Data Types


    When you work with more complicated information, you might want to group certain
    data together. Python has a lot of concepts that allow you to do this, including
    things like list comprehensions, generators and iterators. The fundamental way
    of grouping this data is to use something called data structures. These objects
    will store all of the values together, and in Python, you can create custom data-structures.
    However, it has four built in ones. Object that are used to store data are known
    as containers. The following data types can have many different operations performed
    on them and are built into the data type already (called Methods).


    # The List


    This is used to store groups of items in order. You can add to or remove them
    at any time, sort them or search through the list for specific values. You can
    even start with a list that is empty, adding to it as you go along, or you can
    use one that is already pre-populated. Items that are included in your list can
    be any other object, and that includes other lists as well. This means that you
    can have many different lists, and lists of lists, using them to create a complex
    structure – these are useful as building blocks.

    When you write a list, it should have square brackets, with each item separated
    by a comma:


    +   * # w is an empty list

    * w = []

    * # x has only one member

    * x = [3.0]

    * # y is a list of numbers

    * y = [1, 2, 3, 4, 5]

    * # z is a list of strings

    * # and other lists'
  merge: -1
  pgno: 24
