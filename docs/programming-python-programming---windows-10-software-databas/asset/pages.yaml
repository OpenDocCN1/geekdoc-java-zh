  md: '+   - z = [''first'', [], ''second'', [1, 2, 3, 4], ''third'']


    You can access anything on a list by “indexing”. That index has to be an integer
    that represents the position of the item in the list. The first position is zero.
    Variables can be indexed by placing square brackets, containing the index, after
    the variable.


    If you attempt to get access to a position that has not yet been created, you
    will receive an IndexError on screen. If you want to access from the end of the
    list, you use negative indexes. -1 is the last position on your list, followed
    by -2, -3, etc.:


    +   - >>> x = [1, 2, 3, 4, 5]

    - >>> print x[0]

    - 1

    - >>> print x[4]

    - 5

    - >>> print x[-1]

    - 5

    - >>> print x[-5]

    - 1

    - >>> print x[10]

    - Traceback (most recent call last):

    - File "<stdin", line 1, in ?n- IndexError: list index out of range


    # # Tuples


    Tuples are similar to lists in that they store sequential information. However,
    they cannot be changed after they have been created, unlike a list, which can
    be. The interpreter knows exactly the types and the lengths of the members of
    a tuple and, so, they are more efficient to work with than a list. Tuples can
    be sliced or indexed but not changed and you will come across them “implicitly”
    throughout Python. An example of functions that would return multiple values would
    return those values as a tuple.'
