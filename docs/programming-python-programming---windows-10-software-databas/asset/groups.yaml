    as well, so you have the choice.


    +   - Go to http://peak.telecommunity.com/DevCenterEasyInstall

    - Click on Installing "Easy Install"

    - Right click on the setup.py line and select Save Link as or Save Target

    - When it has finished, find the .py file on your PC and double click on it so
    runs. It will open and run within Python and will be installed


    To set up the PATH variable, so that Windows 10 knows where to look for Python:


    +   - Right click My Computer

    - Select Properties

    - On the next screen, click on Advanced

    - On the next screen, click on Environment Variables

    - I am going to assume that, when you installed Python, you chose to install it
