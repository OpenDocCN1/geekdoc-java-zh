    # 结论\n\n# 引言\n\n知道从何开始计算机编程可能是一个真正的挑战。大多数人对于如何编写计算机代码或甚至在编写计算机程序时该从何开始几乎没有任何知识。Python\
    \ 是一门容易学习的语言，而且它的功能远超简单的编程。\n\n它是一门通用语言，最早于 20 世纪 80 代出现，信不由，它是以蒙提派森（Monty Python）命名的。它被用于许多用途，从测试微芯片到驱动世界上一些最大的网站，再到构建视频游戏。Python\
    \ 是一门小语言，非常接近英语，并包含了数百个第三方库。\n\n由于 Python 是一门接近英语的语言，它非常容易安装。Python 遵循 PEP 8 标准，这意味着它不像某些语言那样难以阅读。Python\
    \ 已经存在了多年，你可以发现它的功能。\n\n在 Windows 10 上运行 Python。\n\n你会很快发现你需要安装一个 Python 标准发行版中未包含的模块。为了实现这一点，我们需要安装一个包管理器来安装新包。在这个部分，我们将使用\
    \ EasyInstall，但稍后我将告诉你如何安装和使用 Cygwin。\n\n通过阅读本文档，读者同意在任何情况下，我们对因使用本文档中包含的信息而导致的任何直接或间接损失不负责，包括但不限于错误、遗漏或不准确之处。\n\
    \n# 为 Python 配置你的 Windows 10 环境\n\n所以，你需要配置 Windows 10 环境，以便使用它。\n\n# 你需要什么：\n\
    \n- 一个 Windows 10 系统\n- Python\n- Cygwin\n- 文本编辑器\n\n# 在 Windows 上安装 Python\n\n\
    你只需要执行以下几件事：\n\n- 下载并安装 Python\n- 使用 Windows Python 安装\n- 安装包管理器\n\n# 下载并安装 Python\n\
    \n- 首先，你需要去 www.python.org/download/。确保下载的版本与你运行的 Windows 匹配，无论是 32 位还是 64 位。如果你使用的是\
    \ Mozilla 浏览器，点击保存。如果你使用的是 Internet Explorer，点击运行。Python 安装程序将打开，你需要选择一个安装目录 -\
    \ 保持默认并点击下一步。接受安装选项并点击下一步。Python 现在将开始安装。完成后，点击完成。\n\n# 使用 Windows Python 安装\n\
    \n- 点击开始菜单并查找 Python。你会发现安装了几个项目：\n- IDLE - 类似于命令行但带有界面的 Python\n- Python Docs\
    \ - 关于已模块的帮助文件\n- Python 手册\n\n# 安装包管理器\n\n你会很快发现你需要安装一个 Python 标准发行版中未包含的模块。为了实现这一点，我们需要安装一个包管理器来安装新包。在这个部分，我们将使用\
    \ EasyInstall，但稍后我将告诉你如何安装和使用 Cygwin。\n\n- 去 http://peak.telecommunity.com/DevCenter/EasyInstall\n\
    - 点击“Install Easy”\n- 右键点击 setup.py 行并选择“另存为”或“链接另存”\n- 完成后在你的 PC 上找到 .py 文件并双击它，使其在\
    \ Python 中运行\n\n为了设置 PATH 变量，以便 Windows 10 知道哪里查找 Python：\n\n- 右键点击“我的电脑”\n- 选择“属性”\n\
    - 在下一个页面，点击“高级”\n- 在下一个页面，点击“环境变量”\n- 我假设你在安装 Python 时选择了为你自己安装 - 点击“用户变量”下的 Path\n\
    - 点击“编辑”\n- 在下一个页面中查看变量值框，并将光标放在最后一个条目的 (;) 之后\n 输入以下内容作为框中的最后一个项目，不要忘记在结尾包含 (;)\
    \ 分号：C:\\Python25\\Scripts;\n- 再次点击确定退出系统属性\n- 现在通过点击开始、运行并输入 cmd 来打开命令提示符。点击确定\n\
    - 在下一个框中输入 easy_install BeautifulSoup –这将安装 BeautifulSoup 模块 – 对你任何想要使用的其他模块重复此操作，它们将被安装\n\
    - 当回到命令提示符时，输入 Python 然后按回车\n\n"
