    # Transaction Support


    Transactions are atomic units of database operations against the data in either
    one or several different databases. The effect of the SQL statements in each transaction
    and these can be rolled back or committed to that database. If a database supports
    a transaction, Python will automatically – silently – start a transaction as soon
    as the cursor is created. We use the commit () method for committing the updates
    that are made with that cursor and we use the rollback () method to roll them
    back, or discard them. Each of these methods will start a new transaction.


    MySQL database includes several different storage engine types, the most common
    of which are MyISAM and InnoDB. InnoDB is now the default engine although there
    is some tradeoff between speed and security. The MyISAM tables much faster and
    no support for transactions. The rollback () and commit () methods are not implemented
    and do not do anything. However, the InnoDB table are infinitely more secure against
    the loss of data, although they are slower to the process.


