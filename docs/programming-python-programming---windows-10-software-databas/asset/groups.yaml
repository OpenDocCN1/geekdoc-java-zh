    # Conclusion\n\n# Introduction\n\nKnowing where to begin with computer programming\
    \ can be a real challenge. Most people have little to no knowledge of how to write\
    \ computer code or when to even begin when writing a computer program. Python\
    \ is an easy language to learn, and is capable of so much more than that simple\
    \ programming.\n\nIt is a general purpose language that first appeared in the\
    \ 1980's and was, believe it or not, named after Monty Python. It's used for a\
    \ wide range of purposes, from testing microchips, to powering some of the biggest\
    \ websites in the world and to building video games. Python is a small language,\
    \ close to the English language and contains hundreds of party libraries.\n\n\
    Because Python is similar to the English language, it is easy to read. It also\
    \ follows very strict rules on punctuation, which means that, unlike some computer\
    \ languages, your code is not littered with annoying curly braces ({}), that get\
    \ in the way and make it difficult to read. Python also contains PEP 8, a set\
    \ of rules that tells each Python developer how their code should be formatted,\
    \ meaning you always know what to do, where a new line should be and helps you\
    \ to read other Python scripts, no matter what they wrote.\n\nPython has been\
    \ in existence for more than 20 years and there is an awful lot of Python code\
    \ about. It is also an open source language, which means that anyone can take\
    \ it, read it and modify it for their own uses. There are plenty of Python community\
    \ groups where users can go to get help or just join in general Python chitchat.\n\
    \nIn this book, I want to talk about what Python can do and how to get it up and\
    \ running on your Windows 10 PC, as well as how to use it. This is suitable for\
    \ complete beginners or for more advanced users and I hope that everyone will\
    \ gain something from this book.\n\n# Configuring Your Windows 10 Environment\
    \ For Python\n\nSo, you want to learn how to use Python on your Windows 10 computer.\
    \ The first thing you need to do is configure your Windows environment, i.e. your\
    \ computer, and prepare it for use with the programming language.\n\n# What You\
    \ Need:\n\n- A Windows 10 PC or laptop\n- Python\n- Cygwin\n- A text editor\n\n\
    Let's look at this one step at a time:\n\n# Installing Python on Windows\n\nThere\
    \ are a couple of things you need to do to get the Python environment running\
    \ on your Windows computer:\n\n- Download and install Python\n- Use the Windows\
    \ Python Installation\n- Install a Package Manager\n\n# Download and Install Python\n\
    \n- First all, you need to go to www.python.org/download/\n- Make sure you download\
    \ the version that corresponds with Windows you are running and whether it is\
    \ 32 or 64-bit.\n- If you are using Mozilla browser, click on Save. If you are\
    \ using Internet Explorer, click on Run.\n- The Python installer will open so\
    \ you need to pick a directory to install - leave it default and click on Next.\n\
    - Accept the installation options and click on Next.\n- Python will now start\
    \ to install. Once it finishes, click on Finish.\n\n# Using the Windows Python\
    \ Installation\n\n- Click Start menu and look for Python. You will see that several\
    \ things have been installed:\n- IDLE - Python GUI similar to the command line\
    \ but has an interface\n- Python Docs - help file that tells you about installed\
    \ modules\n- Python Manuals\n\n# Installing a Package Manager\n\nYou will very\
    \ quickly determine that you need to install a module that is not included in\
    \ the standard distribution of Python. To do this, we need to install a Package\
    \ Manager that will let us install new packages. For this bit, we are using EasyInstall,\
    \ but later on, I will tell you how to install and use Cygwin as well.\n\n- Go\
    \ to http://peak.telecommunity.com/DevCenter/EasyInstall\n- Click on \"Install\
    \ Easy\"\n- Right click on the setup.py line and select Save Link as or Save Target\n\
    - When it has finished, find the .py file on your PC and double click on it so\
    \ it opens and runs within Python\n\nTo set up the PATH variable, so that Windows\
    \ 10 knows where to look for Python:\n\n- Right click My Computer\n- Select Properties\n\
    - On the next screen, click on Advanced\n- On the next screen, click on Environment\
    \ Variables\n- I am going to assume that when you installed Python, you chose\
    \ to install it for you - click on Path located under User Variables\n- Click\
    \ on Edit\n- On the next screen look of variable value box and place your cursor\
    \ after the (;) which denotes the last entry\n Enter the following as the final\
    \ entry in the box and DO NOT forget to include the (;) semicolon at the end:\
    \ C:\\Python25\\Scripts;\n- Click on OK another three times to get out of System\
    \ Properties\n- Now open a command prompt by clicking on Start, Run and typing\
    \ in cmd. Click on OK\n- In the next box in easy_install type BeautifulSoup –\
    \ this will install the module BeautifulSoup – repeat this for any other module\
    \ that you want to use and they will be installed\n- When you get back to the\
    \ command prompt, type in Python and then press Enter\n"
