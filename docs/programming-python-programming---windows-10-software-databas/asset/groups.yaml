    # Configuring Your Windows 10 Environment For Python


    So, you want to learn how to use Python on your Windows 10 computer. The first
    thing you need to do is configure your Windows environment, i.e. your computer,
    and prepare it for use with the programming language.


    # What You Need:


    +   - A Windows 10 PC or laptop

    - Python

    - Cygwin

    - A text editor


    Let''s look at this one step at a time:


    # Installing Python on Windows


    There are a couple of things you need to do to get the Python environment running
    on your Windows computer:


    +   - Download and install Python

    - Use the Windows Python Manager

    - Install a Package Manager


    # Download and Install Python


    +   - First of all, you need to download the correct installation package, so
    go to

    http://www.python.org/download/windows/http://www.python.org/downlo

    - Click on Individual Releases'
