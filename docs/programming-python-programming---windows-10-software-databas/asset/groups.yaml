    # Numbers


    ## Integers


    Integers are whole numbers and, in theory, they are any whole number between a
    range of plus infinity down to minus infinity. The range is limited by the computer
    but in Python, the absolute maximum size is limited by just one thing – how much
    memory your computer has got.


    Python uses two integer types – integers and long integers, which are integers
    that are longer than a specific amount.


    ## Floating Point Numbers


    Computers are very good when it comes to dealing with integers, or whole numbers.
    A floating point number is one that has a number after a decimal point, e.g. 5.2,
    or -8.1. Whole numbers can be stored as floating point numbers – all you do is
    add a decimal point in when you write it down, for example, 1.0, or 9.0. Floating
    point numbers are quite a bit slower to work with because computers find them
    somewhat more complicated.


    In the new versions of Python, if you try to divide an integer by an integer,
    you will get a result you don’t expect, for example:


    - - >>> 7/2

    - 3


    In order to get the right result, one of the integers must be converted to a floating
    point number:


    - - >>> 7.0/2

    - 3.5


    ## Strings


    A string is simply a piece of text and Python will not make any distinction between
    a string that contains one character or an entire block of characters or text.
    Python contains two different string types – basic and Unicode.


    Basic string types are used to store text in a sequence of numbers, or bytes,
    with just one byte for each character. You should only use these if you know certain
    that your text has ASCII values in it. They are also used for storing binary data
    and are often called byte-strings.


    Unicode strings use the Unicode to store text internally. These are a little more
    complicated to use because you have to know the encoding that you have stored
    the code in, whenever you read it or save it out. An overview of how to use each
    one is below:


    Basic String – you add a string to your program by surrounding the relevant text
    with single or double quote marks, for example:


    - - x = ''This is a string''

