    # Writing Modules


    It is a very simple task to write a Python module. All you do is create a .py
    file that is named after the module name and then use the Python name to import
    it (without using the .py extension) by using the import command.


    # Writing Packages


    A package is a namespace, which includes a number of modules and packages. They
    are directories with a twist. Each Python package is a directory that has to contain
    a special file, named __init__.py. The file itself can be empty indicating that
    the directory in it is a Python package – that way it can be imported in the way
    you would import a module.


    If you were to create a directory that is named foo, which would mark the name
    of the package, you can create a module within that package that you could call
    bar. Don''t forget that you need to add the __init__.py file to the foo directory
    as well. In order to use the module called bar, you can import it on one of two
    ways:


    - - import foo.bar, OR

    - from foo import bar


    If you use the first way, you have to use the prefix foo whenever you access bar.
    But, in the second method, you don''t need to do this because you are importing
    the module itself to the namespace.


    You can also use the __init__.py file to determine which modules the package is
    going to export as the API, while you keep the other modules internal by overriding
    the variable __all__ – an example:


    - - __init__.py:

    - __all__ = ["bar"]


