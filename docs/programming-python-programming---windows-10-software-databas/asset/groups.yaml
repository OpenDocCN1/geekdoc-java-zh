    If you don''t want to use the escape key to enter a backslash in your test sting,
    you can use what is known as a raw string. To denote this, you would precede the
    string with r.

    Because raw strings are meant to be used for useful expressions and not, for example,
    Windows paths, they cannot have a backslash at the end. The backslash is interpreted
    by Python as an escape from the quote that comes after.


    Python strings are stored using numbers and are not encoded in any way. The interpreter
    will take what you give it and store it as a byte sequence. Because they hold
    bytes, these strings must only have ASCII characters in them, unless you add an
    encoding at the start – then you can include characters that are not ASCII. However,
    you should only do this if you really know what you are doing.


    Unicode Strings – These contain an internal representation that allows text to
    be stored as text. In effect, your computer knows which characters are being compared
    by the text. However, you will still need to select an encoding for when you write
    or read that data.

    Unicode literals can be included in your program by putting a u at the front of
