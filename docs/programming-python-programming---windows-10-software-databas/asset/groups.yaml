    # Modules and Packages


    All a Python module is is a Python file that has the .py extension that implements
    a set of functions. A module is imported from another module by using the import
    command.


    The first time you load a module into a running script, it will be initialized
    by the execution of the code inside the module. This is done just once. If another
    module is that in your code imports that same module, it will only be loaded once,
    not twice. The local variables that are inside the module act as “singletons”
    and are only initialized the first time.


    If you wanted to import the module called urllib, a module that allows you to
    create read data from a URL, you would do this:


