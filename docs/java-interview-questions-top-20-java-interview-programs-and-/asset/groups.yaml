    1 5 7 8 9 10\n```\n\n# 选择排序\n\n选择排序是一种简单的排序算法。这种排序算法是一种基于比较的原地算法，它将列表分为两部分：左侧的排序部分和右侧的未排序部分。初始时，排序部分为空，未排序部分是整个列表。\n\
    \n从未排序的数组中选择最小元素并与最左侧元素交换，该元素便成为排序数组的一部分。这个过程持续将未排序数组边界向右移动一个元素。\n\n该算法不适用于大型数据集，因为它的平均和最坏情况的时间复杂度均为\
    \ O(n²)，其中 **n** 是项目的数量。\n\n# 算法：\n\n- **步骤 1** – 将 MIN 设置为位置 0\n- **步骤 2** –\
    \ 在列表中查找最小元素\n- **步骤 3** – 与位置 MIN 处的值交换\n- **步骤 4** – 增加 MIN 指向下一个元素\n- **步骤\
    \ 5** – 重复直到列表排序完成\n\n# 程序：Java 中的选择排序\n\n```java\npublic class SelectionSortExample\
    \ {\n    public static void selectionSort(int[] arr) {\n        for (int i = 0;\
    \ i < arr.length - 1; i++) {\n            int index = i;\n            for (int\
    \ j = i + 1; j < arr.length; j++) {\n                if (arr[j] < arr[index])\
    \ {\n                    index = j; //正在寻找最小值\n                }\n           \
    \ }\n            int smallerNumber = arr[index];\n            arr[index] = arr[i];\n\
    \            arr[i] = smallerNumber;\n        }\n    }\n\n    public static void\
    \ main(String a[]) {\n      int[] arr1 = {9, 14, 3, 2, 43, 11, 58, 22};\n    \
    \  System.out.println(\"Before Selection\");\n      for(int i:arr1) {\n      \
    \  System.out.print(i+\" \");\n      }\n      System.out.println();\n\n      selectionSort(arr1);\
    \ //排序数组\n\n      System.out.println(\"After Selection\");\n      for(int i:arr1){\n\
    \        System.out.print(i+\" \");\n      }\n    }\n}\n```\n\n# 输出:\n\nBefore\
    \ Selection Sort\n9 14 3 2 43 11 58 22\nAfter Selection Sort\n2 3 9 11 14 23 58\n\
    \n# 链表\n\n链表是可以通过链接连接的数据结构序列。链表是包含项的链接序列。每个链接都包含一个指向另一个的连接。链表是仅次于数组最常用的结构。以下是理解链表概念的重要术语：\n\
    \n- **链接 (Link)**：链表的每个链接可以存储一个名为元素的数据。\n- **下一个 (Next)**：每个链接都包含一个指向下一个元素的连接。\n\
    - **链表 (LinkedList)**：一个链表。\n\n# 链表表示\n\n链表可以被可视化为节点的链，其中每个节点指向下一个节点。\n\nimg/99eaba0fff8ae29f\n\
    \n根据上述图示：\n- 链表包含一个链接。\n- 每个链接都指向下一个。\n\n# 链表的类型\n\n以下是链表的各种类型：\n\n- **单链表 (Simple\
    \ Linked List)**：仅可以向前导航。\n- **双向链表 (Doubly Linked List)**：项可以双向导航。\n- **循环链表\
    \ (Circular Linked List)**：最后一个指向第一个元素。\n\n# 基本操作\n\n以下是列表支持的基本操作：\n\n- **插入 (Insertion)**：在列表头部插入元素。\n\
    - **删除 (Deletion)**：在列表头部删除元素。\n- **显示 (Display)**：显示整个链表。\n- **查找 (Search)**：在链表中查找元素。\n\
    \n# 插入操作\n\n在链表中插入新节点需要多个步骤。我们将通过图示来学习。首先，创建一个新节点 **B**，将其插入 **A**（左侧）和 **C**（右侧）之间。\n\
    \nimg/99eaba0fff8ae29f\n\n86b506881243_222\n\n现在，让 B 指向 C：\n\n```\nNewNode.next\
    \ = RightNode;\n```\n\nimg/99eaba0fff8ae29f\n\n86b506881243_223\n\n然后让左节点指向新节点：\n\
    \n```\nLeftNode.next = NewNode;\n```\n\nimg/99eaba0fff8ae29f\n\n86b506881243_223\n\
    \n这会将新节点放在链表的中间。新的链表应该如下所示：\n\nimg/99eaba0fff8ae29f\n\n86b506881243_231\n\n# 删除操作\n\
