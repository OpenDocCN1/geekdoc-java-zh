    ```\nwhen Alarm occurs\n  Hit Snooze Button\n  wait until Alarm\n  Get Up\n  Shower\n\
    Get Dressed\n  Eat breakfast\nif weather = sunny then\n  Walk to School\nelse\n\
    \  Ride to School\n```\n\n# Statements and Expressions\n\nWhen reading a book\
    \ or story you extract meaning from an ordered chain of words.\nIn a similar way,\
    \ computers extract commands from a chain of instructions.\nIn English we call\
    \ this a sentence; programmers call this a statement.\n\nA statement is considered\
    \ to be any chunk of code which accomplishes some sort of task separated by a\
    \ semicolon. At the center of any given task is the algorithm, not to be confused\
    \ with a logarithm.\n\nAn algorithm is a systematic process that accomplishes\
    \ something. In many ways you can think of it as a recipe, a recipe for making\
    \ food is an algorithm. It can take just one or two statements to accomplish a\
    \ task, or it could take hundreds of statements.\n\n# Expressions:\n\nThe subjects\
    \ of your statements are called identifiers. An assignment statement is used to\
    \ give an identifier a value. When you read “Jack is a boy and Jill is a girl,”\
    \ you’ve mentally assigned two subjects their genders.\n\nIn Java this might look\
    \ more like:\ngender Jack = male;\ngender Jill = female;\n\nAssignment statements\
    \ often incorporate some sort of operation. These are called expressive statements.\
    \ Different from expressing an emotion, expressions in code look more like “x\
    \ +\n"
  mdcn: "\n程序控制传递到循环后的下一行。\n\n## 流程图：\n\n```\nwhile( condition ) {\n  conditional\
    \ code;\n}\n```\n\n![](img/99eaba0fffde8ae29f4864b506881243_112_0.png)\n\n在这里，*while*\
