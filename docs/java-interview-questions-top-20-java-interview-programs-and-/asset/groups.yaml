    — Ross Chapman


    简而言之，光有兴趣是不够的。如果你目标是成为一名像像样的专业开发者，你就必须努力理解事物是如何运作的。


    > “你可以通过筛选 StackOverflow 上的问题开始理解你所使用的工具。我从从中中学到了一点点东西。[最热门的 AngularJS 问题]读起来真的非常有意思，因为
    Angular 是一个如此巨大的框架。”


    — Todd Motto，AngularJS 大会演讲师，Google 开发者专家


    Spotify 的高级基础设施工程师 Rohan Singh 强调了努力理解你当前工作内容**之下**堆栈第一层原理的重要性。Rohan 说：“作为软件工程师，我们做的每一工作都涉及在某种抽象层级上工作。”换句话说，如果你使用某种数据库，你可以忽略数据库的内部原理，并期望它能‘正常运行’。”


    此外，为了真正理解事物是如何运作的，你应该能够解释为什么某些技术选择优于其他选择，并在事物运行方式不符合预期时能够排除故障。Rohan 在实践中通过这一点做到：一点一点地尝试学习并理解他所使用的任何平台或系统的基础知识——无论是
    Python、Go 还是 Linux 操作系统。在他看来，这最终能帮助你建立关于底层运行机制的心理模型，并拓宽你的知识基础。


    最终，你将作为工程师获得成长，而且额外的是，通过学习如何进行“后倾式”（lean back）调试而不是“前倾式”（lean in）调试，你可以更高效地进行调试。换句话说，你会向后倾并深入思考底层运行机制，以找出问题可能所在。Rohan
    说：“这比使用交互式调试器或其他工具进行‘前倾式’调试要快得多，而且盲目尝试少得多。”


    事实上，来自 Evernote 的 Andrei Thorp 认为每个人应该尽早学习基础 C 语言。


    因为它是极简的，不会为你做太多，它迫使你从底层理解计算机到底是如何运作的。例如，C 让你自己管理使用的内存——这意味着以后当你使用 Python 等工具时，你实际上理解
    Python 在为你执行什么。当你看到某些奇怪的 bug 时，你脑海中有了这个工具箱来理解问题可能在哪里。


    ## 6. 持续学习新事物


    没有什么比做一份糟糕且平庸的编程工作更能杀死你的职业/手艺轨迹了。目前在亚马逊云服务的 Jonathan Henson 说，去一个鼓励/强迫你不断学习新技巧的地方吧。Jonathan
    每年都会尝试学习一种新的编程语言、范式或技术栈。然后他会将自己投入到那些有机会应用这些技能的项目中。


    > “我认为最重要的学习技能是元学习（meta-learning）”Kasra 说道。“对我来说，这就是工程师和程序员之间的区别。花 12 周时间在一门课程中彻底精通一个框架确实有其价值，但我真的非常尊重（并喜欢雇佣）那些能够根据任务需要、随地学会任何所需技能的开发者。”


    那么，学习新技能最好的方法是什么？


    阅读关于你想做的事情只是开始。Rust 核心团队成员、在 Rails 历史上所有贡献者榜中排名第 37 的 Steve Klabnik，他会寻找关于该主题的任何既有研究，并试图弄清楚那些擅长他想做的事情的人是如何获得成果的。


    最重要的一点就是去做。


    1. 尝试去做那件事，可能做得不好。

    2. 弄清楚我在哪里错了，需要改进什么。

    3. 针对我识别出的问题进行。

    4. 重复。


    Bellhops 的 CTO Adam Haney 说，他学习新语言最喜欢的技巧是使用该新语言的范式重新实现之前的项目。例如，他会把以前用 C++ 以面向对象的代码编写的内容，然后用函数式语言重新实现。


    我觉得这种练习让我做好了评估新技术的准备，因为即使我不了解语言或框架的复杂细节，我也理解底层的计算机科学原理。


    如果你在记忆力上很吃力，Andrei 建议建立一个“记忆宫”。通常的想法是利用你大脑强大的视觉记忆，并将其映射到更技术的数据上（如数字）。他还坚信诸如“西因尔德日历”（The
    Seinfeld Calendar）之类的技巧，这是基于 Jerry Seinfeld 的观点：你不需要每天都努力——你只需要每天进步一点点。“所以通过他的日历，你只需要勾选你今天是否处理了该项目，”Andrei
    说。


    “有一些很棒的 App 可以帮助这一点。在 Android 上，我使用 HabitBull。随着你的连续记录越长，你觉得越有动力坚持下去。”


    ## 7. 学习如何与他人协作


    学习新事物的另一种方法是与其他人合作项目。


    > “独行编码者的传奇是一个神话，”Adam 说，“几乎所有重大的项目都需要团队协作。”这意味着你需要学习将问题拆解为多个部分的技能，在代码库部分之间建立良好的接口，以及在架构上进行协作。


    “与一群志同道合且能挑战你的工程师工作绝对会让你进入快车道，”Craig 说，“孤立工作很难让你发现自己的错误并学习新事物。”


    每个人都会犯错——编程就是这样。初学者应该努力留在优秀的工程师身边并获得反馈。“不要对你的错误感到敏感，”Jonathan 强调道，“那是你进步的方式。承认你的错误并从中汲训。”


    进行代码审查（Code Review）也会迫使你思考为什么那样做，并更好地理解代码。“我最喜欢的合作工程师是那些不会在你写的代码上放过你的人，”Ross 说，“我记得第一次被挑战时，我简直坏极了。但那天晚上我回家学习，直到能够自信地解释如何传递代码。”


    那么，你在哪里寻找导师或可以与你结对并帮助你的伙伴？


    根据 Jack 的说法，当地的聚会通常会有针对任何需要免费指导课程。其他免费资源包括 Twitter 群组、Slack 群组和 IRC 频道。


    ## 8. 不要仅仅编写代码——提供解决方案


    > “很多编程并不是关于代码；而是关于理解其他学科或标准。”


    如果你不理解对方的问题，你就无法用代码为他们解决问题。参与项目让我接触到小微企业、营销人员、经纪和其他专业人士看待世界的方式。当你了解他们目前如何解决问题时，你就可以与他们一起提出新的更好的解决方案。


    > —Adam Haney, Bellhops CTO


    Ross 认为他在职业生涯早期应该做的一件事，是更好地欣赏软件工程这门学科及其历史。


    如今，人们很容易投入这一职业并只关注“编码”。特别是作为蓬勃市场中的浏览器开发者或 Web 应用开发者，使用大型动态编程语言（Ruby, JavaScript）以及各种奇特的“计算机”语言和格式（HTML,
    CSS），我们可能倾向于花费所有时间竞相掌握各种工具、框架和 API，以便攻克面试或在工作中晋级。但在团队中开发产品始终是一项社交练习，而且是一个具有独特挑战的特殊练习，这些挑战是非技术性的。比如，软件中最困难的事情是


