    }\n```\n\n在编写新函数时，在继续其他任务之前，填满整个函数的布局是一个良好的习惯。这会让编译器感到轻松；如果一个函数只留在 `void MyFunction`\
    \ 的形式然后跳到另一个函数，会让编译器对你计划要做什么感到困惑。在这种情况下，集成开发环境（例如 MonoDevelop）会不断读取和解释你正在编写的内容，类似于文字处理器中的拼写检查器。当它遇到一个没有确定形式的语句（如变量、函数或类定义）时，它对你所写代码的解释将引发警告或错误。MonoDevelop\
    \ 看起来可能有点挑剔，但它正在尽力帮助。\n\n## 编写函数：\n\n函数由一个声明和一个正体组成。有些程序员喜欢把这些称为方法，但抛开语义不谈，函数基本上是一个语句集合的容器。\n\
    \n让我们继续上面的示例：\n\n```\nvoid MyFunction ()\n{\n}\n```\n\n这是一个名为 MyFunction 的基础函数。我们可以添加额外的关键字来修改函数的可见性。我们看到的一种常见修饰符是\
    \ `public`。\n\n```\npublic void MyFunction ()\n{\n}\n```\n\n`public` 关键字需要出现在函数的返回类型之前。在这种情况下，它是\
    \ `void`，意味着函数不返回任何内容。但函数可以以几种不同的方式作为值。作为参考，返回 `int` 的函数看起来像这样。在具有返回类型的函数中，必须始终存在某种返回语句。\n\
    \n```\npublic int MyFunction ()\n{\n  return 1;\n}\n```\n\n`public` 修饰符并不总是必要的，除非你需要让这个函数对其他类可用。如果这一点不理解，你很快就会明白了。函数中始终要求的最后部分是参数列表。保持为空它是有效的，但为了感受参数列表中的\
    \ `arg`（或参数）看起来什么样，请看下一个**示例**。\n\n```\npublic void MyFunction (int i)\n{\n}\n\
    ```\n\n目前，我们将暂不使用参数列表，但以后知道你正在看什么很重要，以免产生意外之。参数列表用于将信息从函数外部传递到函数内部。这就是类能够将信息从一个发送到另一个的方式。\n\
    \n函数声明与类声明相似。函数是处理变量逻辑的核心。\n\n## **函数作用域：**\n\n变量通常过着短暂的生活。有些变量只存在几行代码中。变量可能只在函数开始时产生，并在函数结束时消失。类作用域中的变量只要类存在就存在。变量的寿命取决于它创建的位置。\n\
    \n## **示例：**\n\n```\npublic class Classscope\n{\nint ClassInt;\nvoid first()\n\
    {\nint firsttint;\n}\nvoid second()\n{\nint secondint;\n}\n}\n```\n\n如果我们看上面的图，就可以形象地看到作用域是如何划分的。外层框代表谁可以看到\
    \ `ClassInt`。在第一个 `()` 函数中，我们有一个 `firsttint`，它只存在于第一个 `()` 函数中。\n\n`secondint`\
    \ 也是如此，它只存在于第二个 `()` 函数中。这意味着 `first()` 可以使用 `ClassInt` 和 `firsttint` 但不能使用 `secondint`。同样，`second()`\
    \ 可以看到 `ClassInt` 和 `secondint` 但不能看到 `firsttint`。\n\n## 逻辑与操作符\n\n逻辑允许你根据变量的变化控制函数部分部分的评估。使用逻辑，你将能够更改代码中哪些语句将运行。简单来说，你写的一切必须涵盖你计划涵盖的每种情况。逻辑通过几个简单的系统控制，主要是\
