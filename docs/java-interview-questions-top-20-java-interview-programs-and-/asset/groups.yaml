    # LENGTH:


    When President Lincoln was asked how long a man’s legs should be, he said they
    should be able to reach from a man’s body to the floor. Likewise, your resume
    should be long enough to sell you properly without overstating your accomplishments.


    But of course, you had opinions on this, too. The consensus on resume length is
    simple: Keep it short. There are exceptions, though. “Never exceed one page, unless
    you have 15-plus years of experience and are applying for a job in upper management,”
    advises one job seeker. “Make sure that your resume remains one page and formatted
    properly, even when viewed in different formats and different views -- if someone
    opens your resume in a view other than the one you created it in and sees a hanging
    line, it looks unprofessional.


    # STYLE AND GRAMMAR:


    Finally, it may seem like grade-school advice, but it bears repeating: “Although
    I try to counsel people on how to write a raving resume and an awesome cover letter,
    I''m consistently shocked at how many resumes and cover letters I receive from
    people that are plagued with misspelled words, grammatical mistakes and basically
    little or no time spent proofreading prior to sending,” says one Monster member
    who’s been in the Staffing industry for 15-plus years. “In an era when competition
    seems to be one of an applicant''s worst enemies; it seems that one would want
    to do everything possible to stand out in the crowd. Trust me: I won''t give a
    second thought to deleting a resume and/or cover letter that is fraught with mistakes.”


    # 4 REASONS WHY YOUR PROGRAM CRASHES!


    There may be 4 reasons why your program may crash:


    - Your program may depend on some element of randomness: user input, randomly
    generated number, time, etc.

    - If Your program is using an uninitialized variable, it could be accessing data
    it isn''t supposed to (same with accessing something outside of an arrays indices)

    - Your program may be using an external library that crashes all the time.

    - Stack overflows!


    # 5 CODING INTERVIEW TIPS!


    ## ATTITUDE


    Before you begin, you need to approach your practice sessions with the right attitude.
    Think of programming interviews as a form of standardized testing. Don''t whine
    and think to yourself, "but I''ll never have to manually reverse a linked list
    in my job, so these questions are lame!"


    Ph.D. students are especially elitist because they somehow think that they are
    "above" preparing for petty programming interviews. That is a fine attitude if
    you are applying for pure research or academic jobs, but if you are interviewing
    at a company that uses programming interviews, then you''ve gotta prep!


    As an analogy to high school standardized testing, I raised my SAT scores by 400
    points (back when they were still out of 1600) through a few months of intense
    practice; there is no way that I could''ve gotten into MIT with my original scores.


    So before you even start practicing, you''ve gotta just view these interviews
    as yet another standardized test, another game that you need to play well and
    beat.


    # PRACTICING


    I don''t care how smart you are; there is simply **no substitute** for practicing
    a ton of problems. Work on problems for as long as you can before your brain explodes,
    then take a long break to reflect and internalize the lessons you learned through
    your struggle. And then repeat!


    I practiced in front of the whiteboard for 1 to 2 hours at a time and did 1 to
    3 practice sessions per day for two full weeks right before my interviews. That
    was around 40 hours of focused practice, which felt about right to me. You might
    need to practice more if you have less programming experience.


    I used these two books as my main sources of practice problems:


    - Programming Interviews Exposed

    - Cracking the Coding Interview

    - Stanford linked list problems (PDF)

    - Stanford binary tree problems


    Even if you are not familiar with the programming languages used in these solutions,
    you can still code up solutions in your own language of choice and write tests
    to verify that they are correct.


    # Getting physical:


    Buy your own whiteboard markers and practice using them. I personally like "MARKS-A-LOT
    low-odor markers", since the markers found in most office conference rooms make
    me nauseous.


    - Always practice by writing code on a whiteboard. If you are in school, then
    there should be plenty of whiteboards around campus for you to use. If you are
    working in an office office, then you can use conference rooms after-hours.

    - If you cannot practice in front of a whiteboard, then practice by writing code
    on blank pieces of white paper.

    - After you write out your code by hand, type it into your computer to see if
    it actually compiles and runs correctly. This is an easy way to check for syntax
    or logical errors in your code. After you have practiced for a few weeks, you
    should be able to write error-free code on the whiteboard.

    - After a week or two of intense practice, you should be able to hand-write legible,
    well-indented, well-aligned code on the whiteboard. If you cannot do that during
    your actual interview, then that will make a bad impression. Messiness is a turn-off.

    - If you are doing a phone interview where you need to write code in Google Docs
    (or some other shared document), then practice writing code in that medium! Remember,
    you will never have a compiler during your interview, so you need to get good
    at writing compliable, runnable, and correct code even without a compiler handy.


    # AT THE INTERVIEW


    When the interviewer presents a question to you, immediately sketch out a bunch
    of examples and ask a ton of clarifying questions to make sure you understand
    exactly what the interviewer is asking you to do.


    Draw several examples and ask your interviewer questions of the form, "this case,
    you want the result to be X, right?" Do not make any assumptions without first
    checking them over with your interviewer.


    And whatever you do, don''t flip out or try to jump straight to coding an answer.
    Chances are, you either


    - have no idea how to solve the problem, so you flip out and panic

    - or you think you have heard the problem before, so you want to jump the gun
    and sketch out a solution right away.


    The former is obviously bad, but the latter might actually be worse, since you
    might have seen a similar problem that does not exactly match the problem you
    have been given. You will look like an idiot if you try to solve the wrong problem
    by recalling it from memory!


    # COMMON PROGRAMMING INTERVIEW IDIOMS


    Here are some common idioms and patterns that I have observed from doing hundreds
    of practice problems.


    Strings:


    - Get comfortable manipulating a string as an array of characters, one character
    at a time (like C-style strings).


    * Numerical arrays


    Think about **iterating backwards** over the array elements as well as forwards.
    Backwards iteration is useful for, say, merging the contents of two arrays "in-place"
    (i.e., using O(1) outside storage).


    * Would the problem be easier if your array were sorted? If so, you can always
    tell the interviewer that you''d first do an O(n lg n) sort. Heapsort is an asymptotically
    optimal "in-place" sort. Once your array is sorted, think about how you can use
    a variant of binary search to get O(lg n) performance than than O(n) for an algorithm
    based on linear scanning.

