    # Tokens


    In written English the smallest elements of the language are letters and numbers.
    Individually, most letters and numbers lack specific meaning. The next larger
    element after the letter is the word. Each word has more meaning, but complex
    thoughts are difficult to convey in a single word. To communicate a thought, we
    use sentences. The words in a sentence each have a specific use, as seen in the
    diagram below. To convey a concept we use a collection of sentences grouped into
    a paragraph. And to convey'
