- md: "\nthese companies usually avoid asking questions leaked on public, so it's\
    \ quite unlikely to encounter the same question again.\n\n## STEP 4: KEEP PRACTICING\n\
    \nAt this step, I expect you to have maybe 1 month left and you should be equipped\
    \ with all you need for an interview except experiences.\n\nTechnical interview\
    \ doesn't only evaluate your coding ability, but a variety of skills and abilities\
    \ like communication skills, analysis ability etc.. Also many people will feel\
    \ nervous solving a problem when someone is looking over his shoulder, thus he\
    \ may even fail in the simplest questions.\n\nI'd suggest you to find a friend\
    \ who is also preparing for an interview, you guys can conduct mock interviews\
    \ with each other and try to be familiar with this kind of intense atmosphere.\n\
    \n## Conclusion:\n\nIt's highly recommended to make a preparation timeline and\
    \ stick to it. Also spending half hour a day on preparation won't work normally.\
    \ There's no better way than keep practicing and eventually you're going to crack\
    \ the interview.\n\n## Chapter 2 | Programming Basics\n\n## What Is Programming?\n\
    \nIt’s all about writing code. Programming is a process in which we organize data\
    \ and use logic to do something with those data. The data are everything a computer\
    \ can store; they can range from numbers to zombie characters in a video game.\n\
    \nYou do this by writing text into files called source code. Source code written\
    \ into text files replaces punch cards used by the computing machines half a century\
    \ ago.\n\nWhen data are combined with logic and then written into a single file,\
    \ they’re called a class. Classes are also data, and as such can be managed with\
    \ more logic.\n\n![](img/99eaba0fffde8ae29f4864b506881243_29_0.png)\n\nClasses\
    \ are used to create objects in the computer’s memory and can be duplicated to\
    \ have a life of their own. Classes are used to build objects. Each piece of data\
    \ within the class becomes a part of that object. Different chunks of data inside\
    \ of a class are called class members.\n\nClass members can also be chunks of\
    \ logic called functions or methods. For Example, in a game with a horde of zombies,\
    \ each zombie is duplicated or instantiated from a zombie class. Each zombie has\
    \ unique values for each attribute or data element in the class.\n\nThis means\
    \ hit points, and locations are unique for each duplicate zombie object. Objects\
    \ created from a class are called instances. Similar to families, objects can\
    \ inherit properties from one another.\n\nThe child sometimes called a subclass\
    \ inherits attributes from its parent. For instance, the child created from a\
    \ zombie may inherit the parent’s hunger for brains. To be useful, the child zombie\
    \ can also add new objects and change the objects it inherited from its parent\
    \ class. As a result, now the child zombie might have tentacles that the parent\
    \ didn’t have.\n\nObjects talk to each other through events and messages.\n\n\
    Shooting at zombies can create an event, or in programmer terms, it “raises” an\
    \ event. The bullet impact event tells the zombie class to then take necessary\
    \ steps when hit by a bullet.\n\nEvents command the class to take actions on its\
    \ data, which is where functions come in. Functions, also known as methods, are\
    \ sets of logic that act on data. They allow your class to create additional events\
    \ and talk to yet more objects.\n\nAs the player presses the trigger and moves\
    \ the joystick around, yet more events can be raised and messages can be sent.\
    \ Events and messages allow the player to interact with your world; logic events\
    \ and objects together build your game.\n\n## What is Data?\n\nData, in a general\
    \ sense, is sort of like a noun. Like nouns, data can be a person, place, or thing.\
    \ Programmers refer to these nouns as objects, and these objects are stored in\
    \ memory as variables. The word variable infers something that might change, but\
    \ this isn’t always the case. It’s better to think of a variable as a space in\
    \ your computer’s memory to put information. When you play word games like MadLibs\
    \ you might ask for someone’s name, an object, an adverb, and a place. Your result\
    \ could turn out like “Garth ate a jacket, and studiously played at the laundry-mat.”\
    \ In this case the name, object, adverb, and place are variable types. The data\
    \ is the word you use to assign the variable with.\n\nProgrammers use the word\
    \ **type** to denote what kind of data is going to be stored. Computers aren’t\
    \ fluent in English and don’t usually know the difference between the English\
    \ types noun and adjective, but they do know the difference between letters and\
    \ a whole variety of numbers. There are many predefined types in java or any other\
    \ language.\n\nIf you add that to the ability to create new types of data, the\
    \ kinds of data we can store is practically unlimited.\n\nThe C# built-in types\
    \ are sometimes called POD, or plain old data. The term POD came from the original\
    \ C++ standard which finds its origin dating back to 1979. POD types have not\
    \ fundamentally changed from their original implementation.\n\nSo far we’ve used\
    \ the word type several times. Programmers define the word type to describe the\
    \ variety of data to be stored.\n\nVariables are created using declarations. Declaration\
    \ is defined as a formal statement or announcement.\n\nEach set of words a programmer\
    \ writes is called a statement. In English we’d use the word sentence, but programmers\
    \ like to use their own vocabulary. Declaration statements for variables define\
    \ both the type and the identifier for a variable.\n\n```\npublic class Example\n\
    {\n    int i;\n}\n```\n\nProgrammers use a semicolon (;) rather than a period\
    \ to end the statement. Therefore, if you want to sound like a programmer you\
    \ can say you can “write a statement to declare a variable of type int with the\
    \ identifier i.” Or if you want to be overly dramatic you can proclaim “I declare\
    \ a new variable of type int to be known as i!” and so it shall be.\n\n## Variables\n\
    \nVariables are used to store information to be referenced and manipulated in\
    \ a computer program. They also provide a way of labeling data with a descriptive\
    \ name, so our programs can be understood more clearly by the reader and ourselves.\
    \ It is helpful to think of variables as containers that hold information. Their\
    \ sole purpose is to label and store data in memory. This data can then be used\
    \ throughout your program.\n\nA variable’s name is called an identifier. For the\
    \ most part an identifier is a unique word that a programmer, or in this case,\
    \ picks to name a variable. An identifier is always something that a invented\
    \ to describe a variable; it’s like naming a new pet or a baby.\n\n## Identifiers:\n\
    \nIdentifiers, which are considered symbols or tokens, are words that you invent\
    \ which you then assign a meaning. Identifiers can be as simple as the letter\
    \ i or as complex as OhHAICanHasIdentifier01. identifier is the word that’s used\
    \ to name any function, variable, or type of data\n\n```\nclass MyNewClassWriting\n\
    {\n}\n```\n\n## Variable Names\n\nIt’s important to know that variable identifiers\
    \ and class identifiers can be pretty much anything. There are some rules to naming\
    \ anything when programming. Here are some guidelines to help. Long names are\
    \ more prone to typos, so keep identifiers short. A naming convention for variables\
    \ should consider the following points.\n\nThe variable name should indicate what\
    \ it’s used for, or at least what you’re going to do with it. This should be obvious,\
    \ but a variable name shouldn’t be misleading. Or rather, if you’re using a variable\
    \ named radius, you shouldn’t be using it as a character’s velocity. It’s also\
    \ helpful if you can pronounce the variable’s name; otherwise you’re likely to\
    \ have issues when trying to explain your code to another programmer.\n\n```\n\
    int\nsomeLong_complex_hardToRemember\n```\n\nThere is an advantage to keeping\
    \ names as short as possible but still\n"
  mdcn: "\n这些公司通常避免在公开场合泄露问题，因此极不可能再次遇到同一个问题。\n\n## 第 4 步：持续练习\n\n在这一步，我预计你可能剩下大约\
    \ 1 个月的时间，除了经验之外，你应该已经了面试所需的一切。\n\n技术面试不仅评估你的编码能力，还评估各种技能和能力，如沟通能力、分析能力等。此外，许多人在有人在背后盯着解决问题时会感到紧张，因此他们可能在最简单的问题上失败。\n\
    \n我建议你找一个也在准备面试的朋友，你们可以互相进行模拟面试，尝试习惯这种紧张的氛围。\n\n## 结论：\n\n强烈建议制定一个准备时间表并严格执行。此外，每天只花半小时准备是起不起作用的。没有比持续练习更好的方法了，你最终将攻克面试。\n\
    \n## 第 2 章 | 编程基础\n\n## 什么是编程？\n\n编程本质上就是编写代码。编程是一个组织数据并使用逻辑对这些数据进行处理的过程。数据是计算机存储的所有内容；它们的范围从数字到视频游戏中的僵尸角色不等。\n\
    \n你通过将文本写入称为源代码的文件来实现这一点。写入文本文件的源代码取代了半年前计算机使用的打孔卡。\n\n当数据与逻辑结合并写入单个文件时，它们被称为“类”（class）。类也是数据，因此可以使用更多的逻辑进行管理。\n\
    \n![](img/99eaba0fffde8ae29f4864b506881243_29_0.png)\n\n类用于在计算机内存中创建对象（object），并可以复制以拥有自己的生命。类被用于构建对象。类中的每一条数据都成为该对象的一部分。类内部不同的数据块被称为类成员。\n\
    \n类成员也可以是逻辑块，称为函数（function）或方法（method）。例如，在一个有成群僵尸的游戏中，每个僵尸都是从僵尸类复制或实例化的。每个僵尸对于类中的每个属性或数据元素都有独特的值。\n\
    \n这意味着生命值和位置位置对于每个复制的僵尸对象来说是唯一的。从类创建的对象被称为实例（instance）。类似于家庭，对象可以相互继承属性。\n\n有时称为子类（subclass）的孩子从其父类继承属性。例如，从僵尸创建的子类可能会继承父类对大脑的渴望。为了有用，子僵尸还可以添加新对象并更改它从父类继承的对象。结果是，现在子僵尸可能拥有父类没有的触手。\n\
    \n对象通过事件（event）和消息相互对话。\n\n向僵尸射击可以创建一个事件，或者在程序员术语中，它“触发”了一个事件。子弹命中事件告诉僵尸类在被子弹击中后采取必要的步骤。\n\
    \n事件命令类对其数据执行操作，这就是函数发挥用场的地方。函数也称为方法，是作用于数据的逻辑集。它们允许你的类创建额外的事件并与更多对象对话。\n\n当玩家按下扳机并移动摇杆时，可以触发更多的事件并发送更多的消息。事件和消息允许玩家与你的世界交互；逻辑事件和对象共同构建了你的游戏。\n\
    \n## 什么是数据？\n\n从广义上说，数据类似于名词。和名词一样，数据可以是人、地方或物。程序员将这些名词称为对象，这些对象被存储在内存中作为变量（variable）。“变量”一词暗示了可能会改变的东西，但情况并非总是如此。最好将变量想象为计算机内存中用于放置信息的空间。当你玩像\
    \ MadLibs 这样的文字游戏时，你可能会要求某人的名字、一个对象、一个副词和一个地方。你的结果可能是“加斯吃了一件外套，并专注地在洗衣店里玩。”在这种情况下，名字、对象、副词和地方是变量类型。数据是你用来给变量赋值的单词。\n\
    \n程序员使用**类型**（type）一词表示将存储什么种类的数据。计算机并不精通英语，通常不知道英语类型中“名词”和“形容词”的区别，但它们知道字母和各种数字之间的区别。Java\
    \ 或任何其他语言中都有预定义的类型。\n\n如果加上创建新类型数据的能力，我们能够存储的数据种类实际上是无限制的。\n\nC# 的内置类型有时被称为 POD，或简单的旧数据（plain\
    \ old data）。这个术语源于 1979 年的原始 C++ 标准。POD 类型从其原始实现起没有发生根本性的变化。\n\n到为止，我们已经多次使用了“类型”一词。程序员定义“类型”一词来描述要存储数据的各种种类。\n\
    \n变量通过声明（declaration）创建。声明被定义为正式的陈述或公告。\n\n程序员写的每组词被称为语句（statement）。在英语中我们会使用“句子”（sentence），但程序员喜欢使用自己的词汇。变量的声明语句定义了变量的类型和标识符（identifier）。\n\
    \n```\npublic class Example\n{\n    int i;\n}\n```\n\n程序员使用分号（;）而不是句号来结束语句。因此，如果你想听起来像个程序员，你可以说你正在“写一条语句来声明一个类型为\
    \ int、标识符为 i 的变量”。或者如果你表现得过度戏剧，你可以宣布：“我宣告了一个类型为 int 的新变量，名为 i！”事实将是如此。\n\n## 变量\n\
    \n变量用于存储在程序中被引用和处理的信息。它们还提供了一种使用描述性名称标记数据。将变量想象成容器是有帮助的。它们的唯一目的是在内存中标记和存储数据。这些数据可以在程序中使用。\n\
    \n变量的名字被称为标识符。大多数情况下，标识符是程序员（在此例中）选择为变量命名的唯一单词。标识符总是你发明的用来描述变量的东西；就像给新宠物或婴儿命名一样。\n\
    \n## 标识符：\n\n标识被视为符号或标记（token），是你发明的并赋予其意义的单词。标识符可以是简单的字母 i，也可以是复杂的 OhHAICanHasIdentifier01。标识是用于命名任何函数、变量或数据类型的单词\n\
    \n```\nclass MyNewClassWriting\n{\n}\n```\n\n## 变量名\n\n重要的是，变量标识符和类标识符可以是几乎任何内容。但在编程时命名任何事物都有规则。这里有一些有帮助的指南。长名字更容易出现拼写错误，所以保持标识符简短。变量的命名规范应该考虑以下点。\n\
    \n变量名应该指示它的用途，或者至少指示你打算用它做什么。这应该是显而易见的，但变量名不应该具有误导性。或者说，如果你在使用一个名为 radius（半径）的变量，你不应该把它用作角色的速度。如果你能读出变量的名字也会很有帮助；否则在向另一个程序员解释你的代码时可能会遇到问题。\n\
    \n```\nint\nsomeLong_complex_hardToRemember\n```\n\n将名称尽可能缩短是有优势的，但仍然\n\n"
