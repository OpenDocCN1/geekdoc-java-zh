    public class Test {\n    public static void main(String args[]) {\n        int\
    \ x = 10;\n        while( x < 20 ) {\n            System.out.print(\"value of\
    \ x : \" + x);\n            x++;\n            System.out.print(\"\\n\");\n   \
    \     }\n    }\n}\n```\n\n这将会产生以下结果：\n\n## 输出：\n\n```\nvalue of x : 10\nvalue\
