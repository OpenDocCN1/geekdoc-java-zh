    \ communication, analysis ability. And since the whole process is quite standard,\
    \ certain ways of preparation can definitely make your life easier.\n\n## DATA\
    \ STRUCTURE AND ALGORITHMS PREPARATION\n\nI would assume you already finish those\
    \ basic courses at school so that you are not learning from scratch. Then this\
    \ process may take one to several months. The reason you should prepare well for\
    \ data structure and algorithms first is that they are really the foundation of\
    \ most software engineer interviews. A real interview question is like asking\
    \ you to solve a problem with combination of skills you learnt from basic knowledge;\
    \ also you should be quite fast when analyzing time/space complexity, which is\
    \ covered in this book as well.\n\n## BE FAMILIAR WITH GENERAL CODING QUESTIONS\n\
    \nAt this step, you should be quite familiar with basic knowledge and concepts\
