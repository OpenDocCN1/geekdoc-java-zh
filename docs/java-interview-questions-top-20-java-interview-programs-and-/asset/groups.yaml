    # Mappings and sets (hash tables) :


    +   * Always think of mapping keys to values to make your life easier. If you
    can scan through your dataset and create an auxiliary hash table to map keys to
    values, then you can do O(1) lookups in a latter part of your algorithm.


    +   * For some array-based problems, you might find it useful to create a "reverse
    mapping" between array elements and their indices. e.g., "the number 42 appears
    at index 6 in the array" is represented as a mapping of "42 -> 6".'
  - '[PAGE 440]


    You can use a hash table as a set to do O(1) membership lookups. If you are being
    tested on low-level skillz, use bitsets and the proper bit-level operations to
    operate on them.


    # Linked lists:


    +   - Linked list problems almost always involve singly-linked lists.


    +   - If you are implementing an iterative algorithm to operate on a singly-linked
    list, chances are that you''ll need to walk **two pointers**, which I like to


    +   - call cur and prev, down the list until one is null.


    +   - Some problems require you to keep a gap of N elements between your cur and
    prev'
  - '[PAGE 441]


    pointers.


    +   - Some problems requires your cur and prev pointers to advance at different
    speeds. e.g., moving prev up by one element while moving cur up by two elements.


    +   - For most recursive algorithms, the base case is when the pointer is null.


    +   - Sometimes you might need to keep a pointer to the final (tail) element of
    the list as well as to the head.'
  - '[PAGE 442]


    # Binary trees:


    +   ● Remember that not all binary trees are binary search trees, and know the
    difference between the two.


    +   ● Know about the idea of a balanced binary search tree (e.g., AVL tree or
    red-black tree), but don''t worry about being able to implement one during an
    interview.'
  - '[PAGE 443]


    # Graphs:


    +   * Whenever you need to represent binary relationships, think about using a
    graph. e.g., $X$ is friends with $Y$, or $X$ has a crush on $Y$, or $Task\ X$
    needs to be done before task $Y$.


    +   * Now that you have a graph representation, what can you do with it? Chances
    are, you won''t be asked to implement any sort of sophisticated graph algorithm
    since you simply don''t have time in a 1-hour interview to do so.


    +   * Definitely know how to implement a depth-first search using a stack data
    structure (or using recursion, which'
  - '[PAGE 444]


    implicitly uses your function call stack)


    +   * Definitely know how to implement breadth-first search using a queue data
    structure.


    +   * Draw a few examples of graphs for your particular problem and see what common
    structure arises, then tailor your algorithms to that type of structure. For example,
    you might find that the graphs for your problem are all cyclic, or that they always
    have one unique source and sink node, or that they are bipartite (e.g., for ''matchmaking''
    problems), or that they are actually trees in disguise :)'
  - '[PAGE 445]


    +   * Know about the idea of topological sort.


    # Edge cases:


    Always test your algorithm on edge-case examples. e.g., what if the user passes
    in an empty list or tree, or a list/tree with a single node.'
  - '[PAGE 446]


