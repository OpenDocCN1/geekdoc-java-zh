    value of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n```\n\n##\
    \ for 循环：\n\n为了对循环的执行获得更多控制，我们还有另一种选择。for 循环需要三个不同的语句来操作。第一条语句称为初始化，第二条是条件，第三条是更新操作。\n\
    \n语法：\n\n```java\nfor(initialization; Boolean_expression; update)\n{\n    // Statements\n\
    }\n```\n\n这里是 **for** 循环中的控制流——\n\n- 首先执行**初始化**步骤，且只执行一次。此步骤允许你声明并初始化任何循环控制变量，并且该步骤以分号（;）结束结束。\n\
    - 接下来，评估**布尔表达式**。如果为真，则执行循环体。如果为假，则不执行循环体，控制跳转到 for 循环之后的下一条语句。\n- 在执行完 for 循环的**体**之后，控制跳转回更新语句。该语句允许你更新任何循环控制变量。该语句可以留空并在末尾加一个分号。\n\
    - 现在再次评估布尔表达式。如果为真，则执行循环并重复该过程（循环体、更新更新步骤、布尔表达式）。在布尔表达式为假后，for 循环终止。\n\n## 流程图：\n\
