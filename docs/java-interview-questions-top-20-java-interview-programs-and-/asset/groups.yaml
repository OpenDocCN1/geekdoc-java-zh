- md: '

    # Mappings and sets (hash tables) :


    - Always think of mapping keys to values to make your life easier. If you can
    scan through your dataset and create an auxiliary hash table to map keys to values,
    then you can do O(1) lookups in a latter part of your algorithm.

    - For some array-based problems, you might find it useful to create a "reverse
    mapping" between array elements and their indices. e.g., "the number 42 appears
    at index 6 in the array" is represented as a mapping of "42 -> 6".

    - You can use a hash table as a set to do O(1) membership lookups. If you are
    being tested on low-level skills, use bitsets and the proper bit-level operations
    to operate on them.


    # Linked lists:


    - Linked list problems almost always involve singly-linked lists.

    - If you are implementing an iterative algorithm to operate on a singly-linked
    list, chances are that you''ll need to walk **two pointers**, which I like to
    call cur and prev, down the list until one is null.

    - Some problems require you to keep a gap of N elements between your cur and prev
    pointers.

    - Some problems requires your cur and prev pointers to advance at different speeds.
    e.g., moving prev up by one element while moving cur up by two elements.

    - For most recursive algorithms, the base case is when the pointer is null.

    - Sometimes you might need to keep a pointer to the final (tail) element of the
    list as well as to the head.


    # Binary trees:


    - Remember that not all binary trees are binary search trees, and know the difference
    between the two.

    - Know about the idea of a balanced binary search tree (e.g., AVL tree or red-black
    tree), but don''t worry about being able to implement one during an interview.


    # Graphs:


    - Whenever you need to represent binary relationships, think about using a graph.
    e.g., $X$ is friends with $Y$, or $X$ has a crush on $Y$, or $Task X$ needs to
    be done before task $Y$.

    - Now that you have a graph representation, what can you do with it? Chances are,
    you won''t be asked to implement any sort of sophisticated graph algorithm since
    you simply don''t have time in a 1-hour interview to do so.

    - Definitely know how to implement a depth-first search using a stack data structure
    (or using recursion, which implicitly uses your function call stack)

    - Definitely know how to implement breadth-first search using a queue data structure.

    - Draw a few examples of graphs for your particular problem and see what common
    structure arises, then tailor your algorithms to that type of structure. For example,
    you might find that the graphs for your problem are all cyclic, or that they always
    have one unique source and sink node, or that they are bipartite (e.g., for ''matchmaking''
    problems), or that they are actually trees in disguise :)

    - Know about the idea of topological sort.


    # Edge cases:


    Always test your algorithm on edge-case examples. e.g., what if the user passes
    in an empty list or tree, or a list/tree with a single node.


    # Programming Quotes!


    > “Talk is cheap. Show me the code.”

    — Linus Torvalds


    > “Programs must be written for people to read, and only incidentally for machines
    to execute.”

    — Harold Abelson, Structure and Interpretation of Computer Programs


    > “Programming today is a race between software engineers striving to build bigger
    and better idiot-proof programs, and the Universe trying to produce bigger and
    better idiots. So far, the Universe is winning.”

    — Rick Cook, The Wizardry Compiled


    > “Always code as if the guy who ends up maintaining your code will be a violent
    psychopath who knows where you live”

    — John Woods


    > “That''s the thing about people who think they hate computers. What they really
    hate is lousy programmers.”

    — Larry Niven


    > “The best programs are written so that computing machines can perform them quickly
    and so that human beings can understand them clearly. A programmer is ideally
    an essayist who works with traditional aesthetic and literary forms as well as
    mathematical concepts, to communicate the way that an algorithm works and to convince
    a reader that the results will be correct.”

    — Donald Ervin Knuth, Selected Papers on Computer Science


    > “I''m not a great programmer; I''m just a good programmer with great habits.”

    — Kent Beck


    > “Everyone knows that debugging is twice as hard as writing a program in the
    first place. So if you''re as clever as you can be when you write it, how will
    you ever debug it?”

    — Brian W. Kernighan


    > “A language that doesn''t affect the way you think about programming is not
    worth knowing.”

    — Alan J. Perlis


    > “The computer programmer is a creator of universes for which he alone is the
    lawgiver. No playwright, no stage director, no emperor, however powerful, has
    ever exercised such absolute authority to arrange a stage or field of battle and
    to command such unswervingly dutiful actors or troops.”

    — Joseph Weizenbaum


    > “Walking on water and developing software from a specification are easy if both
    are frozen.”

    — Edward Berard


    > “Perl – The only language that looks the same before and after RSA encryption.”

    — Keith Bostic


    > “The most disastrous thing that you can ever learn is your first programming
    language.”

    — Alan Kay


    > “A computer is like a violin. You can imagine a novice trying first a phonograph
    and then a violin. The latter, he says, sounds terrible. That is the argument
    we have heard from our humanists and most of our computer scientists. Computer
    programs are good, they say, for particular purposes, but they aren’t flexible.
    Neither is a violin, or a typewriter, until you learn how to use it.”

    — Marvin Minsky


    > “The most important property of a program is whether it accomplishes the intention
    of its user.”

    — C.A.R. Hoare


    > “Object-oriented programming offers a sustainable way to write spaghetti code.
