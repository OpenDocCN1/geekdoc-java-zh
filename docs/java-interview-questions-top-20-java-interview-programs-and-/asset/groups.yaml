    # While loop:


    If we want to run a specific statement more than once in a loop, we need another
    method. To do this, java comes with another couple of keywords, **while and for**.
    The while statement is somewhat easier to use. It needs only one bool argument
    to determine if it should continue to execute. This statement is somewhat like
    the if statement, only that it returns to the top of the while statement when
    it’s done with its evaluations.'
  - "[PAGE 109]\n\n# The syntax of a while loop is :\n\n```\nwhile(Boolean_expression)\
    \ {\n  // Statements\n}\n```\n\nHere, **statement(s)** may be a single statement\
    \ or a block of statements. The **condition** may be any expression, and true\
    \ is any non zero value.\n\nWhen executing, if the *boolean_expression* result\
