- md: "\nprogram control passes to the line immediately following the loop.\n\n##\
    \ Flow Diagram:\n\n```\nwhile( condition ) {\n  conditional code;\n}\n```\n\n\
    ![](img/99eaba0fffde8ae29f4864b506881243_112_0.png)\n\nHere, key point of the\
    \ *while* loop is that the loop might not ever run. When the expression is tested\
    \ and the result is false, the loop body will be skipped and the first statement\
    \ after the while loop will be executed.\n\n## Example:\n\n```java\npublic class\
    \ Test {\n    public static void main(String args[]) {\n        int x = 10;\n\
    \        while( x < 20 ) {\n            System.out.print(\"value of x : \" + x);\n\
    \            x++;\n            System.out.print(\"\\n\");\n        }\n    }\n\
    }\n```\n\nThis will produce the following result:\n\n## Output:\n\n```\nvalue\
    \ of x : 10\nvalue of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x : 14\n\
    value of x : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x\
    \ : 19\n```\n\n## For Loop:\n\nTo gain a bit more control over the execution of\
    \ a loop, we have another option. The for loop requires three different statements\
    \ to operate. The first statement is called an initialization, the second is a\
    \ condition, and the third is an operation.\n\nSyntax:\n\n```java\nfor(initialization;\
    \ Boolean_expression; update)\n{\n    // Statements\n}\n```\n\nHere is the flow\
    \ of control in a **for** loop –\n\n- The **initialization** step is executed\
    \ first, and only once. This step allows you to declare and initialize any loop\
    \ control variables and this step ends with a semi colon (;).\n- Next, the **Boolean\
    \ expression** is evaluated. If it is true, the body of the loop is executed.\
    \ If it is false, the body of the loop will not be executed and control jumps\
    \ to the next statement past the for loop.\n- After the **body** of the for loop\
    \ gets executed, the control jumps back up to the update statement. This statement\
    \ allows you to update any loop control variables. This statement can be left\
    \ blank with a semicolon at the end.\n- The Boolean expression is now evaluated\
    \ again. If it is true, the loop executes and the process repeats (body of loop,\
    \ then update step, then Boolean expression). After the Boolean expression is\
    \ false, the for loop terminates.\n\n## Flow Diagram:\n\n```java\nfor( init; condition;\
    \ increment )\n{\n    conditional code ;\n}\n```\n\n![](img/99eaba0fffde8ae29f4864b506881243_121_0.png)\n\
    \n## Example:\n\nFollowing is an example code of the for loop in Java.\n\n```java\n\
