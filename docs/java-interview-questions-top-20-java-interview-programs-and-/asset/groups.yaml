- md: '

    structures that are going to show up most frequently are:


    - Array

    - Stack / Queue

    - Hashset / Hashmap / Hashtable / Dictionary

    - Tree / binary tree

    - Heap

    - Graph


    You should know these data structures inside and out. What are the insertion/deletion/lookup
    characteristics? (O(log n) for a balanced binary tree, for example.) What are
    the common caveats? (Hashing is tricky, and usually takes O(k) time when k is
    the size of the object being hashed.) What algorithms tend to go along with each
    data structure? (Dijkstra''s for a graph.) But when you understand these data
    structures, sometimes the solution to a problem will pop into your mind as soon
    as you even think about using the right one.


    Stick to basics. I would classify the following data structures as **must know**


    - Linked List - Single and Doubly

    - Stack

    - Queues

    - Binary Search Trees or general Binary Tree

    - Heaps

    - Basic Graph Traversal and Shortest Path


    # Hashing


    Following data structures may be asked. I would say that their probability of
    being asked is between 50 to 75% -


    - Tries

    - Advance Graphs like flow and min-cut etc.

    - Bit Manipulation


    You will probably crack interviews with sufficient knowledge of above.


    Following have very low probability of being asked (< 25%):


    - Segment Trees / Binary Indexed Trees

    - AVL Trees

    - B+ Trees


    Other hard data structures are absolutely unnecessary.


    Following Algorithms / Tricks / Topics may also be important:


    - Memory Management

    - Basic Co-ordinate geometry - Manhattan Distance, Closest Point Pair

    - Divide and Conquer

    - Greedy

    - Dynamic Programming - Extremely important

    - Probability and basic Number Theory


    # Sorting and Searching


    Following topics is important for Knowledge / Experience based questions:


    1. OS - Threads, Processes and Locks using Mutex, Semaphores

    2. Scalability Issues, RPCs, Rate limiter, etc.

    3. OOP Concepts

    4. Databases - SQL, NoSQL, Writing simple Queries, Transactions, ACID

    5. Linux Commands - sed, grep, ps, etc.


    # 9 WAYS TO BECOME A GREAT PROGRAMMER!


    # 1. PRACTICE


    Asides from following tutorials, you should work on your own projects.


    > "The most fundamental thing is that you actually go and code. I’ve heard it
    recommended that by the time you finish college, you should have written 100,000
    lines at minimum."

    — Andrei Thorp from Evernote.


    But how do I get start, you may ask.


    > "I always tell people to find something they’re doing more than once a week
    and to try to automate it. Ignore if anyone else has solved the problem before,
    and just make a tool/utility for yourself that fixes a common issue in your life."


    — Kasra Rahjerdi, Mobile Lead at Stack Overflow.


    > "Like any other skill, it takes practice – deliberate practice, stepping outside
    of your comfort zone and learning the nuance and subtleties – that set apart great
    from good."

    — Derick Bailey, the creator of WatchMeCode.net.


    Derick is a top 0.42% StackOverflow user, and has also contributed to open source
    frameworks such as MarionetteJS and BackboneJS.


    It’s OK to fail. Coding is all about failing and fixing things, and about learning
    how to do things better. If you don’t build things and work on areas that you
    know you are weak on, you’ll never get better.


    If you ever need to receive advice on how to improve and what you’re not doing
    so well on, feel free to ask an experienced developer to help your get straightened
    up by either reviewing your code or walking you through concepts you are having
    trouble understanding.


    # 2. BE PATIENT


    No-brainer here, but it’s easy to get frustrated by your lack of progress and
    forget that you’re not alone.


    > "Becoming a good programmer takes a long, long time and a lot of tedious evenings.
    Before you can write good code, you have to write hundreds of thousands of lines."

    — Mike Arpaia, a former Etsy dev who now builds information security software
    for Facebook.


    Mike stresses that beginners should give up on the assumption that one can become
    an excellent developer quickly.


    But… what if you’re not even past the tutorial stages yet? What if you’re still
    banging your head against the wall and wondering perhaps you’re just not cut out
    for programming? Before you leap to conclusions, know that **everyone has a different
    learning style**. Author of the Ruby on Rails Tutorial, Michael Hartl, points
    out that beginners should try lots of different resources (books, videos, etc.)
    to see what ‘clicks’.


    In fact, Craig Coffman, the CTO of Reserve, has personally learned through a lot
    of trial-and-error and by picking projects that were personal and interesting.
    However, since all the interesting challenges are big ones, he suggests beginners
    to start with biting off reasonably-sized pieces. That way, when you lose interest
    or get stuck, you still have a feeling of progress and accomplishment.


    # 3. STAY INTERESTED


    If you’re bored by the project you’re working on, you should probably reconsider
    any lofty goals of learning to code. Or, maybe you’re just working on the wrong
    project or learning through the wrong resource. \*Always keep yourself motivated
    by working on personal projects that excites you.\*\*


    Coraline Ada Ehmke, founder of LGBTech and contributor to high-profile open source
    projects such as Rails and RSpec, started coding at a young age out of interest.
    However, her first class in college as a Computer Science major made her doubt
    her passion.


    Wait for what life as an engineer was like, I didn''t want any part of it, so
    I dropped out soon after.


    However, she continued to work on projects she found interesting. By 1993 she
    was online and building web sites, and has been developing web apps ever since.


    # 4. LOVE THE ERROR


    As a beginner you’ll likely be mired in bugs. If you feel intimidated by all the
    red, you’re not alone. Ross Chapman, a UX Engineer who coded for Zendesk and now
    working at ScienceExchange, admits to being a scared developer when he first started
    out. I didn’t have the patience because I wasn’t ready to love the challenge of
    fixing things. But that’s pretty much where all my really bad habits come from.


    With that said, Ross urges beginners to embrace errors as crucial learning moments.
    Since you''ll be debugging for life, you should get used to errors and learn to
    recognize the error messages.


    > "Being able to quickly parse and understand error messages will save you a lot
    of time and get you a long way. The fact you''ve tried will be very much appreciated
    by the person you''re asking for help."

    — Jack Franklin, author of "Beginning jQuery"


    Jack also recommends beginners to make an attempt at fixing problems on their
    own at first. When hitting a wall when debugging, Lee Byron, co-contributor to
    React, personally attempts to understand what’s going on by making ample usage
    of the debugger tools.


    Once I understand exactly what is happening – step by step, then I can compare
    that to what I expected to happen and isolate the surprising parts and see where
    my assumptions were wrong or how some code led to the surprising situation. Errors
    aren’t limited to bugs, however. Sometimes, you make bad decisions such as using
    the wrong data structure. According to Mike, getting burned by those bad decisions
    will eventually help you learn when it’s reasonable to use certain design patterns
    # 5. UNDERSTAND HOW THINGS WORK


    > "No matter what level you’re at I’ll say this: never ever write a line of code
    without knowing why it works, to the metal. Like, be obsessively curious. Be the
    Indiana Jones of source. I don’t think you could make it in this biz without looking
    into the monitor with wonder. Both childlike, and ruthlessly academic."

