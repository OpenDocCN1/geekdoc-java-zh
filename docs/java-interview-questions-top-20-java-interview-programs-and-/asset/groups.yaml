    \ : 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n```\n\
    \n## Loop Control Statements:\n\nLoop control statements change execution from\
    \ its normal sequence. When execution leaves a scope, all automatic objects that\
    \ were created in that scope are destroyed.\n\nJava supports the following control\
    \ statements.\n\n- Break Statement\n- Continue Statement\n\nThe break statement\
    \ in Java programming language has the following two usages —\n\n- When the break\
    \ statement is encountered inside a loop, the loop is immediately terminated and\
    \ the program control resumes at the next statement following the loop.\n- It\
    \ can be used to terminate a case in the switch statement (covered in the next\
    \ chapter).\n\n## Syntax\n\nThe syntax of a break is a single statement inside\
