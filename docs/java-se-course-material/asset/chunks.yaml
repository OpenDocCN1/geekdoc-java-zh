    ### Collection Interface


    - This is the most basic interface. Contains methods to add, remove, search and
    iterate over list.

    - Provides methods that collection related classes should provide.


    | Method | Meaning |

    | :--- | :--- |

    | `boolean add(Object)` | Adds an object to collection. |

    | `boolean addAll(Collection col)` | Adds all elements of the collection. |

    | `void clear()` | Clears all elements from the collection. |

    | `boolean contains(Object obj)` | Returns true if the given object is found in
    the collection. |

    | `boolean containsAll(Collection col)` | Returns true if all elements of parameter
    collection are present in the current collection. |

    | `boolean isEmpty()` | Returns true if collection is empty. |

    | `Iterator iterator()` | Returns an iterator, which is used to iterate over items
    of collection. |

    | `boolean remove(Object obj)` | Removes the given object. |

    | `boolean removeAll(Collection col)` | Removes all elements of the collection
    that are present in parameter collection. |

    | `boolean retainAll(Collection col)` | Retains only the elements in the list
    that are in the parameter collection. |

    | `int size()` | Returns number of elements. |

    | `Object [] toArray()` | Returns an array containing all the elements of the
    collection. |

    | `boolean removeIf(Predicate)` | Removes all elements that satisfy given predicate.
    |

    | `Stream<E> stream()` | Returns a sequential Stream. |

    | `Stream<E> parallelStream()` | Returns a parallel Stream. |


    **NOTE:** Methods `removeAll()`, `retainAll()`, and `addAll()` return true if
    source list is changed as the result of the operation, otherwise they return false.


