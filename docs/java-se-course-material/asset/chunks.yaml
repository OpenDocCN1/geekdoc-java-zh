  trans: "\n\n```java\nclass MyTime {\n    private int hours, mins, secs;\n\n    public\
    \ MyTime(int hours, int mins, int secs) {\n        this.hours = hours;\n     \
    \   this.mins = mins;\n        this.secs = secs;\n    }\n\n    @Override\n   \
    \ public String toString() {\n        return \"MyTime{\" + \"hours=\" + hours\
    \ + \",\n        \"mins=\" + mins + \", secs=\" + secs + '}';\n    }\n\n    public\
    \ int totalSeconds() {\n        return hours * 3600 + mins * 60 + secs;\n    }\n\
    \n    public static int compare(MyTime t1, MyTime t2) {\n        return t1.totalSeconds()\
    \ - t2.totalSeconds();\n    }\n}\n```\n\n```java\nimport java.util.*;\n\npublic\
    \ class SortWithLambda {\n    public static void main(String[] args) {\n     \
    \   ArrayList<MyTime> times = new ArrayList();\n        times.add(new MyTime(10,10,20));\n\
    \        times.add(new MyTime(5,30,20));\n        times.add(new MyTime(20,5,10));\n\
    \        Collections.sort(times,\n            (t1,t2) -> t1.totalSeconds()-t2.totalSeconds());\n\
    \        for(MyTime t : times)\n            System.out.println(t.toString());\n\
    \        // 方法引用\n        Collections.sort(times, MyTime::compare);\n        for(MyTime\
    \ t : times)\n            System.out.println(t.toString());\n    }\n}\n```\n\n\
    Srikanth Technologies\n\nJava 学生指南 - 库-II\n66\n\n### 内置函数式接口\n\n* Java 8 API 包含许多内置的函数式接口。\n\
    * 某些接口在旧版本的 Java 中已为人知，如 `Comparable`、`Comparator` 或 `Runnable`。\n* `java.util.function`\
    \ 包中添加了新的接口。\n* 许多这些函数式接口除了函数式（抽象）方法外还有默认方法。\n\n| 接口 | 描述 |\n| :--- | :--- |\n\
    | `Consumer<T>` | 表示一个接受单个输入参数且无返回的操作。函数方法是 `accept(T)`。 |\n| `Function<T, R>`\
    \ | 表示一个接受一个参数并产生结果的函数。函数方法是 `apply(T)` 并返回 `R`。 |\n| `Predicate<T>` | 表示一个参数的谓词（布尔值函数）。函数方法是\
    \ `test(T)` 并返回 `Boolean`。 |\n| `Supplier<T>` | 表示结果的提供者。函数方法是返回 `T` 的 `get()`。\
    \ |\n| `UnaryOperator<T>` | 对类型为 `T` 的对象应用一元操作并返回 `T`。方法是 `apply(T)`。 |\n| `BinaryOperator<T>`\
    \ | 对两个类型为 `T` 的对象应用操作并返回类型为 `T` 的结果。方法是 `apply(T,T)`。 |\n\n```java\nimport java.util.function.*;\n\
    public class BuiltInFunctionalInterfaces {\n    public static void main(String[]\
    \ args) {\n        Consumer<String> c=(s) ->\n            System.out.println(s.toUpperCase());\n\
    \        c.accept(\"Srikanth\");\n        Predicate<String> p = (s) -> s.length()\
    \ > 5;\n        System.out.println(p.test(\"Java\"));\n        Function<Integer,String>\
    \ f=(n)->n.toString();\n        System.out.println(f.apply(100));\n    }\n}\n\
    ```\n\nSrikanth Technologies\n\nJava 学生指南 - 库-II\n67\n\n### 流 (Streams)\n\n* 流是元素的序列，支持顺序和并行聚合操作。\n\
    * 与集合（collection）不同，流不是存储元素的数据结构。相反，流从源通过操作流水线传输值。\n* 流操作分为中间操作（`intermediate`）或终端操作（`terminal`）。\n\
    * 流的源可以是集合、数组、生成函数或 I/O 通道。\n* 中间操作（例如 `filter`）会产生一个新的流。\n* 终端操作（例如 `forEach`）产生一个非流的结果，例如原始值（如\
    \ double 值）、集合，或者在 `forEach` 的情况下什么值都不产生。它们也被称为归约操作（`reduction`）。\n* 从 Java 8\
    \ 开始，java 集合拥有了返回 `Stream` 的方法。\n* 流支持聚合操作。\n* 常见的聚合操作有 `filter`、`map`、`reduce`、`find`、`match`\
    \ 和 `sort`。这些操作可以串行或并行执行。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean allMatch`\
    \ | 返回所有元素是否匹配提供的谓词。 |\n| `boolean anyMatch` | 返回是否有任一元素匹配提供的谓词。 |\n| `boolean\
    \ noneMatch` | 返回是否没有元素匹配提供的谓词。 |\n| `long count()` | 返回流中元素的计数。 |\n| `Stream<T>\
    \ distinct()` | 返回一个去重元素的流。 |\n| `Optional<T> findFirst()` | 返回一个描述流中第一个元素的 Optional。\
    \ |\n| `Optional<T> findAny()` | 返回一个描述流中某个元素的 Optional。 |\n| `void forEach` |\
    \ 对流中的每个元素执行一个操作。 |\n| `Stream<T> limit(long maxSize)` | 返回一个截断后长度不超过 maxSize\
    \ 的流。 |\n| `Stream<T> skip(long n)` | 返回跳过前 n 个元素的流。 |\n| `Stream<T> sorted()`\
    \ | 返回按自然排序的流。 |\n| `Stream<T> sorted(Comparator<? super T>)` | 按比较器排序的流。 |\n\
    | `Object[] toArray()` | 返回包含流元素的数组。 |\n\nSrikanth Technologies\n\nJava 学生指南 -\
    \ 库-II\n68\n\n```java\nimport java.util.*;\nimport java.util.stream.Stream;\n\
    public class StreamsDemo {\n    public static void main(String[] args) {\n   \
    \     ArrayList<MyTime> times=new ArrayList<MyTime>();\n        times.add(new\
    \ MyTime(20,45,55));\n        times.add(new MyTime(10,34,30));\n        times.add(new\
    \ MyTime(14,15,20));\n        times.add(new MyTime(7,10,50));\n        times.stream()\n\
    \            .filter(t -> t.getHours() > 10).limit(2)\n            .forEach(System.out::println);\n\
    \        // 将对象转换为 int\n        double average=times.stream()\n            .mapToInt(MyTime::totalSeconds)\n\
    \            .average().getAsDouble();\n        System.out.println(average);\n\
    \        System.out.println(\"是否有小时大于 12？ \" +\n            times.stream().anyMatch(t->t.getHours()>12));\n\
    \        System.out.println(\"所有小时都大于 12？ \" +\n            times.stream().allMatch(t->t.getHours()>12));\n\
    \        System.out.println(\"计数 = \" +\n            times.stream().count());\n\
    \        Optional<MyTime> mintime=times.stream()\n            .min((t1,t2)->t1.totalSeconds()-t2.totalSeconds());\n\
    \        System.out.println(\"最小 = \" + mintime.get());\n    }\n}\n```\n\n###\
    \ forEach() 的局限性\n\n* 无法多次循环，因为它会消耗流的元素。\n* 无法跳出循环。\n* 无法更改周围的局部变量。\n\n### Stream.of()\
    \ 方法\n\n"
- fmt: "\nIt is possible to build a stream by providing values to `of()` method in\
    \ `Stream` interface.\n\n```java\n//Build a stream\nStream.of(10,21,22,35,55,30)\n\
    \  .filter(n-> n % 2==0).forEach(System.out::println);\n```\n\n### Streams from\
    \ Arrays\nAn array can be source of stream. `Arrays.stream()` method can be used\
    \ to build a stream from an array.\n\n```java\nString [] names = {\"Joe\",\"Andy\"\
    ,\"Steve\",\"Bob\",\"Jason\"};\nArrays.stream(names)\n  .filter(n -> n.length()\
    \ > 3)\n  .forEach(System.out::println);\n```\n\n### Streams from IO\nThe following\
    \ example shows how to create a stream from lines of a file and sort the stream\
    \ before printing lines.\n\n```java\nBufferedReader br = Files.newBufferedReader(Paths.get(\"\
    c:\\\\jdk8\\\\names.txt\"));\n// lines() returns a Stream<String>\n// Use Method\
    \ references for println() to print\nbr.lines().sorted().forEach(System.out::println);\n\
    ```\n\n### Parallelism in Streams\n- Parallel computing involves dividing a problem\
    \ into subproblems, solving those problems simultaneously (in parallel, with each\
    \ subproblem running in a separate thread), and then combining the results of\
    \ the solutions to the subproblems.\n- It is possible to obtain a parallel stream\
    \ from a source that provides a stream using method `parallelStream()`.\n- When\
    \ a stream executes in parallel, the Java runtime partitions the stream into multiple\
    \ substreams. Aggregate operations iterate over and process these substreams in\
    \ parallel and then combine the results.\n\n```java\nvalues.parallelStream().sorted()\n\
    \  .forEach(System.out::println);\n```\n\n### WHAT WILL YOU LEARN IN THIS MODULE?\n\
    At the end of this module you will have learnt the following:\n- Developing swing\
    \ applications\n- Container class\n- FlowLayout Manager\n- GridLayout Manager\n\
    - GridBagLayout Manager\n- BorderLayout Manager\n- Using absolute positioning\
    \ - null layout manager\n- Event handling using delegation event model\n- JComponent\
    \ class\n- `JLabel`, `JTextField`, `JPasswordField` components\n- `JButton`, `JCheckbox`,\
    \ `JRadioButton` components\n- `JComboBox`, `JList` components\n- `JScrollPane`,\
    \ `JOptionPane` classes\n- `Timer` class\n\n### Swing Library\n- Swing components\
    \ are built as part of `JFC` (Java Foundation Classes).\n- Swing components are\
    \ light weight components as they are written in Java.\n- Swing components are\
    \ built on the top of `AWT`.\n- Swing components are consistent across all platforms\
    \ – they look and work alike on all platforms.\n- It is also possible to change\
    \ the look and feel of a swing application at runtime using `Pluggable look and\
    \ feel (PL&F)` features of swing.\n- Swing components are made available in `javax.swing`\
    \ package.\n\n### Developing Swing Application\n- Unlike an Applet, a frame based\
    \ application displays a frame and doesn’t need any container to run it.\n- A\
    \ swing application contains `main()` method, where the application starts.\n\
    - It extends `JFrame` class.\n\nThe following program shows a simple swing application\
    \ that displays a frame with system date and time.\n\n```java\n01: import javax.swing.*;\n\
    02: import java.awt.*;\n03: import java.util.Date;\n04:\n05: public class SimpleFrame\
    \ extends JFrame {\n06: public SimpleFrame() {\n07: super(\"Date & Time\"); //\
    \ title\n08: Container c = getContentPane();\n09: JLabel lbl = new JLabel();\n\
    10: // center message horizontally\n11: lbl.setHorizontalAlignment(JLabel.CENTER);\n\
    12: lbl.setText (new Date().toString());\n13: c.add (lbl);\n14: this.setDefaultCloseOperation(\
    \ JFrame.EXIT_ON_CLOSE);\n15: }\n16:\n17: public static void main(String args[])\
    \ {\n18: SimpleFrame f = new SimpleFrame();\n19: f.setSize(300,200);\n20: f.setVisible(true);\n\
    21: }\n22: }\n```\n\n**NOTE**: Method `setDefaultCloseOperation()` specifies the\
    \ action to be taken when user clicks on close button of the frame.\n\n### Container\
    \ class\nA container is a component that can contain other components. Classes\
    \ like `Panel` and `Window` extend `Container` class. The following are the important\
    \ methods of `Container` class.\n\n| Method | Meaning |\n| :--- | :--- |\n| `Component\
    \ add(Component c)` | Adds the component to the container (typically at the end).\
    \ |\n| `Component add(Component c, int pos)` | Adds the component at the given\
    \ position. |\n| `void add(Component c, Object constraints)` | Adds the component\
    \ with the given constraints. |\n| `Component getComponentAt(Point p)` | Returns\
    \ the component that is at the specified point. |\n| `Component[] getComponents()`\
    \ | Returns all components of the container. |\n| `LayoutManager getLayout()`\
    \ | Returns current layout manager. |\n| `void setLayout(LayoutManager)` | Changes\
    \ layout manager. |\n\n### JComponent class\nA `component` is an object having\
    \ a graphical representation that can be displayed on the screen and that can\
    \ interact with the user. Examples of components are buttons, checkboxes, and\
    \ scrollbars of a typical user interface.\n\nAWT components are created from `Component`\
    \ class. Swing components are created from `JComponent` class, whose hierarchy\
    \ is shown below.\n\n```\njava.lang.Object\n|--java.awt.Component\n|--java.awt.Container\n\
    |-- javax.swing.JComponent\n```\n\nThe following are the important methods of\
    \ `JComponent` class in different categories.\n\n#### Component Appearance\n|\
    \ Method | Meaning |\n| :--- | :--- |\n| `void setBorder(Border)` | Set or get\
    \ the border of the component. |\n| `void setForeground(Color)` | Set the foreground\
    \ or background color for the component. |\n| `Color getForeground()` | Get the\
    \ foreground or background color for the component. |\n| `void setBackground(Color)`\
    \ | Set the background color for the component. |\n| `Color getBackground()` |\
    \ Get the background color for the component. |\n| `void setOpaque(boolean)` |\
    \ Set or get whether the component is opaque. An opaque component fills its background\
    \ with its background color. |\n| `void setFont(Font)` | Set or get the component's\
    \ font. |\n| `Font getFont()` | If a font has not been set for the component,\
    \ the font of its parent is returned. |\n\n#### Setting and Getting Component\
    \ State\n| Method | Purpose |\n| :--- | :--- |\n| `void setToolTipText(String)`\
    \ | Sets the text to display in a tool tip. |\n| `void setEnabled(boolean)` |\
    \ Set or get whether the component is enabled. An enabled component can respond\
    \ to user input and generate events. |\n| `void setVisible(boolean)` | Set or\
    \ get whether the component is visible. Components are initially visible, with\
    \ the exception of top-level components such as `JFrame` and `JDialog`. |\n\n\
    #### Laying Out Components\n| Method | Purpose |\n| :--- | :--- |\n| `void setPreferredSize(Dimension)`\
    \ | Set the component's preferred, maximum or minimum size, measured in pixels.\
    \ The preferred size indicates the best size for the component. |\n| `void setMaximumSize(Dimension)`\
    \ | The maximum size indicates that the component should be no larger than its\
    \ maximum size. |\n| `void setMinimumSize(Dimension)` | The minimum size indicates\
    \ that the component should be no smaller than its minimum size. Be aware that\
    \ these are hints only and might be ignored by certain layout managers. |\n| `Dimension\
    \ getPreferredSize()` | Get the preferred, maximum, or minimum size of the component,\
    \ measured in pixels. |\n| `Dimension getMaximumSize()` | Get the maximum size.\
    \ |\n| `Dimension getMinimumSize()` | Get the minimum size. |\n| `int getWidth()`\
    \ | Get the current width or height of the component measured in pixels. |\n|\
    \ `int getHeight()` | Get the current width or height of the component measured\
    \ in pixels. |\n| `Dimension getSize()` | Get the component's current size measured\
    \ in pixels. |\n| `Insets getInsets()` | Get the size of the component's border.\
    \ |\n| `void setBounds(int, int, int, int)` | Set the size and location relative\
    \ to parent's upper left corner, in pixels, of the component. Use these methods\
    \ to position and size a component when you aren't using a layout manager. |\n\
    \n### Layout Managers\n- Layout Manager is used to arrange components using an\
    \ algorithm.\n"
