    ### ArrayList 类


    - 实现了 `List` 接口。

    - 一个可伸缩数组的实现。

    - 当元素添加到 `ArrayList` 时，其容量会自动增长。

    - 构造函数允许你指定初始容量。

    - **注意：** 对于用于集合的类，重写 `equals()` 方法很重要。


    ```java

    01: import java.util.*;

    02: class ArrayListDemo {

    03: public static void main(String args[]) {

    04: ArrayList nl = new ArrayList();

    05: nl.add("Ronaldo");

    06: nl.add("Messi");

    07: nl.add("Gerrard");

    08: nl.add(1,"Rooney");

    09: // 显示列表

    10: for ( Object obj : nl)

