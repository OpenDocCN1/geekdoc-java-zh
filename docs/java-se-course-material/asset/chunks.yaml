    ## COLLECTIONS FRAMEWORK


    Collections framework provides classes to implement useful data structures (such
    as linked list) and algorithms (such as sorting). The following are advantages
    of using Collections Framework:


    - **Reduces programming effort** by providing useful data structures like linked
