    \ {\n    ct.join(); // 让当前线程等待直到 ct 结束\n    System.out.println(\"Child completed\"\
    );\n} catch(InterruptedException ex) {\n}\n```\n\nSrikanth Technologies\nJava\
    \ 学生指南 – 面向对象编程 II\n\n 同步 (Synchronization)\n\n- 这是 Java 确保共享资源同一时间只有一个线程访问的过程。\n\
    - Java 通过 `synchronized` 方法和 `synchronized` 语句作为语言的一部分提供了同步机制。\n- 监视器（Monitor）是一个用作互斥锁（或\
    \ `mutex`）的对象。在给定时刻只有一个线程可以进入监视器。当一个线程获取锁时，可以说它已进入监视器。\n- 当一个线程调用 `synchronized`\
    \ 方法时，它会锁定对象（进入监视器），阻止其他线程调用该对象的任何 `synchronized` 方法。\n\n```java\nclass Stack\n\
    {\n    private int data[] = new int[10];\n    private int top = 0;\n\n    // Thread1\n\
    \    synchronized public void push (int v)\n    { \n        data [top] = v;\n\
    \        top ++;\n        // Thread2 无法控制 push() 或 pop()，因为 Thread1 已经进入了监视器\n\
    \    }\n\n    synchronized public int pop()\n    { \n        // // 代码 \n    }\n\
    }\n```\n\nMonitor\ndata\ntop\nThread1\nOf Stack Object\n10 ... 0\n\nSrikanth Technologies\n\
    Java 学生指南 – 面向对象编程 II\n\n上图所示的场景如下：\n\n- `Thread1` 和 `Thread2` 都访问 `Stack` 类的同一个对象。\n\
    - 在 `10:10:10`，`Thread1` 调用了栈对象的 `push()` 方法。\n- 通过调用 `synchronized` 的 `push()`\
    \ 方法，`Thread1` 进入了栈对象的监视器。这意味着栈对象现在被锁定了。\n- 执行完 `push()` 方法的第一条语句后，在 `10:10:11`，`Thread1`\
    \ 失去了控制权，控制权给了 `Thread2`。\n- 接收控制权后，`Thread2` 尝试在 `10:10:12` 进入 `push()` 方法，但无法进入，因为栈对象的监视器仍被\
    \ `thread1`。\n\n**注意：** 进入对象的任何 `synchronized` 方法，线程必须先进入对象的监视器。具有至少一个 `synchronized`\
    \ 方法的类对象关联有一个监视器。\n\n以下示例展示了当两个或多个线程访问同一个对象时，同步方法的重要性。\n\n```java\nclass Data\
    \ {\n    synchronized public void print() {\n        for ( int i = 1; i <= 5;\
    \ i ++) {\n            System.out.println(i);\n            try {\n           \
    \     Thread.sleep(100);\n            } catch(Exception ex) {}\n        }\n  \
    \  }\n} // data 类结束\n\nclass CThread extends Thread {\n    Data obj;\n    public\
    \ CThread (Data obj) {\n        this.obj = obj;\n    }\n    public void run()\
    \ {\n        obj.print();\n    }\n} // CThread 类结束\n\npublic class SyncTest {\n\
    \    public static void main(String args[]) {\n        CThread thread1,thread2;\n\
    \        Data obj = new Data();\n        // 让两个线程访问同一个对象\n        thread1 = new\
    \ CThread(obj);\n        thread2 = new CThread(obj);\n        thread1.start();\n\
    \        thread2.start();\n    } // main 方法结束\n}\n```\n\n## 同步语句 (Synchronized\
    \ statement)\n\n同步语句允许你在无法将方法标记为同步的情况下实现同步。当你需要同步一个类源码不可用（只有 `.class` 文件可用）的类中的方法时，就需要这样做。\n\
    \n```java\nsynchronized (object) {\n    // 调用需要同步的方法\n}\n```\n\n与 `synchronized`\
    \ 语句一起使用的 `object` 是需要同步方法的对象。同步块（Synchronized block）确保对使用 `synchronized` 语句的对象的方法调用，只有在当前线程成功进入对象监视器后才会发生。\n\
    \n如下修改 `CThread` 类的 `run()` 方法以使用同步：程序的其余部分与前一个用所示所示。\n\n```java\nclass CThread\
    \ extends Thread {\n    public void run(){\n        synchronized(obj) {\n    \
    \        obj.print();\n        }\n    }\n}\n```\n\n## 线程池 (Thread Pools)\n\n-\
    \ 线程池是工作线程的集合。\n- 它最小化了由于创建线程和分配大量线程带来的开销。\n- 一种常见的线程池类型是固定线程池。任务通过内部队列提交到池中，当活动任务多于线程时，队列会持有这些任务。\n\
    - 创建线程池的一种简单方法是调用 `java.util.concurrent.Executors` 中的 `fixedThreadPool` 方法。\n\n\
    ```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
    \npublic class ExecutorDemo {\n    public static void main(String[] args) {\n\
    \        ExecutorService executor = Executors.newFixedThreadPool(3);\n       \
    \ for ( int i = 1; i <= 10; i++) {\n            executor.execute(new PrintNumbers(\"\
    Thread\" + i));\n        }\n        System.out.println(\"Done with main()\");\n\
    \    }\n}\n\nclass PrintNumbers implements Runnable {\n    private String name;\n\
    \    public PrintNumbers (String name) {\n        this.name = name;\n    }\n \
    \   public void run() {\n        for ( int i = 1; i <= 5; i++) {\n           \
    \ System.out.printf(\"%s : %d\\n\", name, i);\n        }\n    }\n}\n```\n\n"
- fmt: "\nAll byte streams are derived from either `InputStream` or `OutputStream`.\n\
    \n## Character Streams\n- Treat the stream as a collection of characters.\n- They\
    \ use Unicode and therefore, can be internationalized.\n- At the top of the hierarchy\
    \ there are two abstract classes – `Reader` and `Writer`.\n\n## Byte Streams\n\
    - `InputStream`\n- `OutputStream`\n\n## Character Streams\n- `Reader`\n- `Writer`\n\
    \nJava Student Guide - Library-II\n\n## Predefined streams\n- `System` class of\
    \ `java.lang` package contains three static variables – `in`, `out` and `err`.\n\
    - `System.out` refers to standard output stream, which is console by default.\n\
    - `System.in` refers to standard input stream, which is keyboard by default.\n\
    - `System.err` refers to standard error stream, which is console by default.\n\
    - `System.in` is of type `InputStream`. `System.out` and `System.err` are objects\
    \ of type `PrintStream`.\n\n## Reader Class\n`Reader` is an `abstract` class in\
    \ `java.io` package. This class provides most fundamental methods related to reading\
    \ data from a text stream.\n\n### Method\n| Method | Meaning |\n| :--- | :---\
    \ |\n| `int read()` | Reads a character. Returns -1 on EOF. It returns Unicode\
    \ of the character. |\n| `int read(char buf[])` | Reads characters into the array.\
    \ Returns the number of bytes read. But `buf` may not be filled completely, if\
    \ end-of-file is encountered before the array is filled. |\n| `long skip(long\
    \ n)` | Skips the specified number of characters. |\n| `void close()` | Closes\
    \ the stream. |\n| `boolean markSupported()` | Returns true if stream supports\
    \ mark operation. Used to check whether stream supports marking. |\n| `void mark(int\
    \ readAheadLimit)` | Mark the present position in the stream. Parameter `readAheadLimit`\
    \ specifies the number of characters that may be read while still preserving the\
    \ mark. |\n| `void reset()` | If the stream has been marked, it attempts to reposition\
    \ it at the mark. |\n\n## FileReader class\n- `FileReader` class is a subclass\
    \ of `InputStreamReader` class, which is subclass of `Reader` class. Its constructor\
    \ takes name of the file to be opened.\n- It is used to read characters from a\
    \ file. File may be given either as a `string` or as an object of `File` class.\n\
    - `FileReader(File file)`\n- `FileReader(String fileName)`\n\nThe following program\
    \ takes filename from user and displays its content on the screen.\n\n```java\n\
    import java.io.FileReader;\nimport java.util.Scanner;\n\npublic class ReadFile\
    \ {\n    public static void main(String args[]){\n        try {\n            Scanner\
    \ s = new Scanner(System.in);\n            System.out.println(\"Enter filename\
    \ :\");\n            String filename = s.nextLine();\n            FileReader fr\
    \ = new FileReader(filename);\n            int ch; // must be an int as read()\
    \ returns int\n            ch = fr.read(); // returns -1 on EOF\n            while\
    \ ( ch != -1) {\n                System.out.print((char)ch);\n               \
    \ ch = fr.read();\n            }\n            fr.close();\n        } catch(Exception\
    \ ex) {\n            System.out.println(ex.getMessage());\n        }\n    } //\
    \ end of main\n} // end of class\n```\n**Exercise**: Count number of words in\
    \ a given file.\n\n## BufferedReader Class\n- It improves performance by buffering\
    \ characters so as to provide efficient reading of characters.\n- It is derived\
    \ from `Reader` class.\n- Buffer size may be specified using parameter to constructor\
    \ or default size may be used.\n- `BufferedReader(Reader reader)`\n- `BufferedReader(Reader\
    \ reader, int buffersize)`\n\n### readLine() method\nIt reads a line of text from\
    \ the `Reader` provided as parameter to constructor. A line is considered to be\
    \ terminated by linefeed (ASCII code 10) or carriage return (ASCII code 13) or\
    \ by both. It returns `null` on end-of-file (EOF).\n\n```java\nimport java.io.*;\n\
    public class LineRead {\n    public static void main(String args[]) throws Exception\
    \ {\n        FileReader fr = new FileReader(\"c:\\\\names.txt\");\n        BufferedReader\
    \ br = new BufferedReader(fr);\n\n        String line;\n        line = br.readLine();\n\
    \        while( line !=null) {\n            System.out.println(line);\n      \
    \      line = br.readLine();\n        }\n        br.close();\n        fr.close();\n\
    \    } // end of main\n} // end of class\n```\n**Exercise**: Accept a filename,\
    \ a string and display all lines in the file that contain the given string.\n\n\
    ## InputStreamReader class\n- This class is used as bridge between byte stream\
    \ and character stream.\n- It reads data from `InputStream`, which is passed as\
    \ parameter to its constructor, and provides them in the form of characters.\n\
    - `InputStreamReader(InputStream source)`\n\n## LineNumberReader class\nThis class\
    \ extends `BufferedReader` and provides methods to get and set line numbers.\n\
    - `LineNumberReader(Reader)`\n- `int getLineNumber()`\n- `void setLineNumber(int)`\n\
    **Exercise**: Display only non-blank lines of the file along with line numbers.\n\
    \n## Pushback class\n- This class allows you to push back a character after reading\
    \ it from the stream.\n- This is a `FilterReader`, which provides additional functionality\
    \ to base stream.\n- `PushbackReader(Reader)`\n- `void unread(int c)`\n\nThe following\
    \ program demonstrates how to use `PushbackReader` to unread a character.\n\n\
    ```java\nimport java.io.*;\npublic class PushbackDemo {\n    public static void\
    \ main(String[] args) throws Exception {\n        // Stream is built with a string\n\
    \        StringReader sr = new StringReader(\"ABC XYZ\");\n        // create a\
    \ PushbackReader using StringReader\n        PushbackReader pbr = new PushbackReader(sr);\n\
    \        // read a character - A\n        int ch = pbr.read();\n        System.out.println(ch);\
    \ // outputs 65\n        // push character back - A\n        pbr.unread(ch);\n\
    \        //read character pushed by previous unread()-A\n        System.out.println(\
    \ pbr.read()); // outputs 65\n    }\n}\n```\n\n## Automatic Resource Management\
    \ (ARM)\n- Starting from Java 7.0 resources are automatically closed by calling\
    \ `close()` method at the end of try block.\n- This feature is also called as\
    \ `try-with-resources`.\n- Prior to Java 7.0, closing of a resource was done explicitly\
    \ in `finally` block.\n- All resources like Database connections and file streams\
    \ are expected to implement `AutoCloseable` interface and define `close()` method,\
    \ which is the only method in the interface, so that Java invokes that method.\n\
    \n```java\ntry (resources creation) {\n    // process resource\n} catch(..) {\n\
    \    // handle exceptions\n}\n```\n\n## Writer class\nThis is an abstract class\
    \ for writing characters to a stream. It allows either writing individual characters\
    \ or strings. But, while writing strings you have to write new line (`\\n`) character\
    \ explicitly.\n\n### Method\n| Method | Meaning |\n| :--- | :--- |\n| `void close()`\
    \ | Closes the stream, flushing it first. |\n| `void flush()` | Writes pending\
    \ data to stream. |\n"
