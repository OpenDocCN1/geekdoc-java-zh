  trans: "\n\n![](img/index-59_1.jpg)\n\n# Java 学生指南 - 面向对象编程\n\n18\n\n在上面的 UML 图，静态成员——`hraper`\
    \ 变量和 `setHraper()` 方法被带有下划线，表示它们是类的静态成员。\n\n以下代码展示了如何使用静态变量 `hraper` 和静态方法 `setHraper()`\
    \ 来实现 `Employee` 类。\n\n```java\n01: public class Employee {\n02: private String\
    \ name;\n03: private double salary;\n04: private static double hraper = 20;\n\
    05: public Employee(String name,double salary) {\n06: this.name = name;\n07: this.salary\
    \ = salary;\n08: }\n09: public void setSalary(double salary) {\n10: this.salary\
    \ = salary;\n11: }\n12: public double getSalary() {\n13: return salary + salary\
    \ * hraper / 100;\n14: }\n15: public static void setHraper (double hra) {\n16:\
    \ hraper = hra;\n17: }\n18: }\n```\n\n```java\n01: public class UseEmployee {\n\
    02: public static void main(String[] args) {\n03: Employee e = new Employee(\"\
    Jason\", 30000);\n04: System.out.println ( e.getSalary());\n05: Employee.setHraper(25);\n\
    06: System.out.println ( e.getSalary());\n07: }\n08: }\n```\n\nSrikanth Technologies\n\
    \nJava 学生指南 - 面向对象编程\n\n19\n\n## 继承\n\n- 允许从现有类创建新类。\n- 使用关键字 `extends` 来创建一个扩展现有类的新类。\n\
    - 现有类被称为超类（superclass），新类被称为子类（subclass）。\n- 继承代表“是一个是一个”（Is A）的关系。例如，`Student`\
    \ 是一个 `Person`（人），`Car` 是一个 `Vehicle`（车辆）等。\n\n**Person**\n**name : string**\n\
    **email : string**\n\n**Student**\n**Faculty**\n**course : string**\n**subjects\
    \ : string**\n\n以下代码演示了创建 `Person` 类和 `Faculty` 类。\n\n```java\n01: class Person\
    \ {\n02: protected String name,email;\n03: public Person( String name, String\
    \ email) {\n04: this.name = name;\n05: this.email = email;\n06: }\n07: public\
    \ void print() {\n08: System.out.println(name);\n09: System.out.println(email);\n\
    10: }\n11: public void setEmail(String email) {\n12: this.email = email;\n13:\
    \ }\n14: }\n```\n\nSrikanth Technologies\n\nJava 学生指南 - 面向对象编程\n\n20\n\n**注意**：访问\
    \ `protected` 允许成员也可以被子类访问。\n\n```java\n01: class Faculty extends Person {\n02:\
    \ protected String subjects;\n03: public Faculty(String name, String email, String\
    \ subjects){\n04: super(name,email); // 必须是第一条语句\n05: this.subjects = subjects;\n\
    06: }\n07: @Override\n08: public void print() { // 重写了 Person 的 print()\n09: super.print();\n\
    10: System.out.println(subjects);\n11: }\n12: public void setSubjects(String subjects)\
    \ {\n13: this.subjects = subjects;\n14: }\n15: }\n```\n\n**Person**\n**# name\
    \ : string**\n**# email : string**\n**+ Person(name,email)**\n**+ print() : void**\n\
    **+ setEmail(email:string):void**\n\n**Faculty**\n**# subjects : string**\n**+\
    \ Faculty (name,email,subjects)**\n**+ print():void**\n**+ setSubjects(subjects:string):void**\n\
    \n**注意**：UML 图中的符号 `#` 指定了 protected 访问权限\n\nSrikanth Technologies\n\nJava 学生指南\
    \ - 面向对象编程\n\n21\n\n```java\n01: class TestPerson {\n02: public static void main(String\
    \ args[]) {\n03: Faculty f = new Faculty(\"Srikanth\",\n04: \"srikanthpragada@yahoo.com\"\
    ,\"Java,.Net\");\n05: f.print();\n06: f.setEmail(\"srikanthpragada@gmail.com\"\
    );\n07: f.setSubjects(\"Java,.Net,Oracle,Android\");\n08: }\n09: }\n```\n\n###\
    \ 继承中的构造函数\n\n当创建子类对象时，Java 会自动从子类的构造函数调用超类的默认构造函数。\n\n但是，当超类没有默认构造函数时，我们必须使用\
    \ `super` 关键字和所需的参数显式调用超类的构造函数（正如我们在 `Faculty` 类中所做的那样）。\n\n### @Override 注解\n\
    \n注解 `@Override` 表示子类方法声明旨在重写超类方法声明。\n\n如果带有此注解的方法没有重写超类方法，编译器生成生成信息。\n\n### 方法重写\n\
    \n当子类中的方法与超类中的方法具有相同名称和签名时，子类中的方法被称为重写了超类中的方法。\n\n`Person` 类的 `print()` 方法在子类\
    \ `Faculty` 中被重写。\n\nSrikanth Technologies\n\nJava 学生指南 - 面向对象编程\n\n22\n\n**重写规则**：\n\
    - 参数列表必须完全匹配。\n- 返回类型必须是原始类型或原始类型的子类。\n- 访问级别不能比原始类型更严格。\n- final 方法不能重写。\n- 静态方法不能重写。\n\
    - 可继承的方法可以重写。\n- 私有方法不能被继承。\n\n### 重载 vs. 重写\n\n当你在子类中创建一个与超类方法名称相同但参数不同的方法时，它被称为重载。\n\
    \n以下示例展示了重写与重载的区别。\n\n```java\n01: class C1 {\n02: public void m1(String msg)\
    \ {\n03: }\n04: public void m2(int n) {\n05: }\n06: }\n\n07: class C2 extends\
    \ C1 {\n08: // 重写 C1 的 m1()\n09: public void m1() {\n10: }\n11: // 重载 C1 的 m2()\n\
    12: public void m2(String n) {\n13: }\n14: }\n```\n\n### 使用 super 关键字访问超类\n\n\
    子类中的 `super` 关键字用于访问超类。`super` 可以用于：\n-访问被子类重写的超类方法。\n- 从子类构造函数调用超类构造函数。\n- 引用继承体系中的直接超类。\n\
    \n**注意**：在子类构造函数调用超类构造函数时，该调用必须是第一条语句。\n\n### “拥有”关系\n\n当一个类包含引用另一个类的变量时，该类被认为与该类存在“拥有”关系。\n\
    \n在示例中，`Customer` 类拥有 `Address`，因为它有一个 `Address` 类的变量。\n\n```java\nclass Address\
    \ {\n    // 实例变量和方法\n}\n\nclass Customer {\n    private Address homeaddress;\n\
    \    // 其他变量和方法\n}\n```\n\nSrikanth Technologies\n\n![](img/index-65_1.jpg)\n\n\
    Java 学生指南 - 面向对象编程\n\n24\n\n向下转型与向上转型\n\nJava 允许超类对象引用子类对象。这是运行时多态的核心。\n\n超类是子类的更通用形式。子类是超类的更具体形式。`Person`\
    \ 是 `Student` 的更通用形式。换句话说，`Student` 始终是一个 `Person`。因此，任何 Java 需要 `Person` 的地方都可以使用\
    \ `Student`。\n\n**向上转型**是将对象转型为继承树中较高的类。当将 `Faculty` 对象赋值给 `Person` 时，被称为向上转型。向上转型在\
    \ Java 中是隐式的。\n\n```java\nFaculty f = new Faculty(\"Hunter\",\"hunter@servlets.com\"\
    ,\"servlets,jsp\");\nPerson p = f; // 向上转型隐式完成\nPerson p = (Person) f; // 显式转换但不需要\n\
    ```\n\n向下转型是将对象转型为层次结构中部的类。当将 `Person` 对象转换为 `Faculty` 时，被称为**向下转型**。向下转型必须使用类型转换语法显式进行：\n\
    \n```java\nPerson p = new Faculty(\"Hunter\",\"hunter@servlets.com\",\"Java\"\
    );\nFaculty f = p; // 无法编译\n```\n\nSrikanth Technologies\n\n"
- fmt: "\n```java\nFaculty f = (Faculty) p; // downcasting explicitly\n```\n\nNOTE:\
    \ Downcasting is explicit and upcasting is implicit.\n\nDowncasting is possible\
    \ between a superclass and subclass only. For example, it is not possible to convert\
    \ a `String` object to `Person` object as `String` and `Person` classes are not\
    \ related.\n\n### `instanceof operator`\n\nOperator `instanceof` is used to check\
    \ whether an object reference refers to an object of specified class or one of\
    \ its subclasses.\n\n`object-reference instanceof class`\n\n```java\nPerson p\
    \ = new Faculty (\"abc\",\"abc@gmail.com\",\"java\");\nSystem.out.println( p instanceof\
    \ Faculty);\nSystem.out.println( p instanceof Person);\nSystem.out.println( p\
    \ instanceof Student);\n```\n\n## MULTI-LEVEL INHERITANCE\n\nJava supports multi-level\
    \ inheritance. In this, a class is extended by another class, which is again extended\
    \ by another class. The following picture shows multi-level inheritance.\n\n`Employee`\n\
    `RegularEmployee`\n`Consultant`\n`OverseasEmployee`\n\nSrikanth Technologies\n\
    ![](index-67_1.jpg)\nJava Student’s Guide - Object-Oriented Programming 26\n\n\
    In the above example, `Employee` class is inherited into `RegularEmployee` class,\
    \ which in turn is inherited into `OverseasEmployee`.\n\nConstructors of classes\
    \ in inheritance must be called in the order of inheritance.\n\nWhen you create\
    \ an object of `OverseasEmployee`, constructor of `Employee` class is called first\
    \ then constructor of `RegularEmployee` and then finally constructor of `OverseasEmployee`.\n\
    \nJava tries to call constructor of superclass from subclass’s constructor using\
    \ `super()` statement. However, if that is not adequate, you must explicitly call\
    \ constructor of superclass using `super` keyword by passing required parameters.\n\
    \n## MULTIPLE INHERITANCE\n\nJava does NOT support multiple inheritance, where\
    \ a single class extends two or more classes. It means, Java doesn’t allow two\
    \ or more classes to be inherited into a single class.\n\nIn the following diagram,\
    \ `AllRounder` is extending `Batsman` and `Bowler`, which is not supported by\
    \ Java.\n\nSrikanth Technologies\nJava Student’s Guide - Object-Oriented Programming\
    \ 27\n\nThe reason for Java to avoid multiple inheritance is the ambiguity caused\
    \ by multiple inheritance. For example, `AllRounder` has two instances of `name`\
    \ variable as one comes from `Batsman` and another comes from `Bowler`. This leads\
    \ to *ambiguity*.\n\n## RUNTIME POLYMORPHISM - DYNAMIC METHOD DISPATCH\n\n###\
    \ DISPATCH\n\n- Is the process by which a call to an overridden method is resolved\
    \ at runtime instead of compile-time.\n- It is based on the concept that an object\
    \ reference of the superclass can refer to an object of any subclass in the hierarchy.\n\
    - Runtime polymorphism occurs when an overridden method is called using an object\
    \ reference of superclass.\n- Java decides which method to call (superclass or\
    \ subclass) based on the object pointed by object reference of superclass.\n-\
    \ Also called as late binding.\n\n```java\nclass Person {\n    public void print()\
    \ {\n        . . .\n    }\n}\n\nclass Faculty extends Person {\n    @Override\n\
    \    public void print() {\n        . . .\n    }\n}\n```\n\nThe following code\
    \ shows how Java calls appropriate method depending on the object pointed by object\
    \ reference.\n\n```java\nPerson objref;\nobjref = new Person(...);\nobjref.print();\n\
