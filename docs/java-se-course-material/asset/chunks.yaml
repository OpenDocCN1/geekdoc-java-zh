    \ overloading, Multiple inheritance, Friend functions etc. of C++ are not supported\
    \ by Java.\n\nC and C++ concentrated more on providing flexibility and power,\
    \ but Java’s main focus has been robustness and Internet programming.\n\n# FEATURES\
    \ OF JAVA LANGUAGE\n\nThe following are the major features of Java language.\n\
    \n### Robust\nMakes programs robust (free from potential errors). Java detects\
    \ all potential problems at the time of compiling the program. It also checks\
    \ for array boundary violation etc. at run time.\n\n### Object Oriented\nSupports\
    \ encapsulation, inheritance and polymorphism. Java allows the entire code to\
    \ be placed only in classes. It doesn’t allow any code to be placed outside the\
    \ class including `main()` method.\n\n### Dynamic\nAllocates memory for arrays\
    \ and objects at run time and handles allocation and de-allocation of memory on\
    \ its own. Garbage collector is responsible for releasing unused memory blocks.\n\
    \n### Multithreaded\nSupports creating and managing of multiple threads.\n\n###\
    \ Distributed\nSupports programs to run on different systems and yet communicate\
    \ with each other. Provides mechanism to transmit data from one application to\
    \ another.\n\n### Platform Independent\nAllows a compiled program (byte code)\
    \ to run on any other platform.\n\n# JAVA IS ROBUST\n\n- Java being a robust language\
    \ checks for potential errors both the time of compilation and at runtime.\n-\
    \ Java is strongly typed language, where data type of a value cannot be changed\
    \ to another, and is case-sensitive.\n- The following snippets show operations\
    \ that are allowed in C but not in Java.\n\n```\nint a[10];\nint i , j; // local\
    \ variables, not initialized\na[10]=100; // accessing element outside the bounds\n\
    i = j; // assigning float to int\nj++; // without initializing it\n```\n\n- Java\
    \ also checks whether a function that is supposed to return value when condition\
