    ## MULTI-LEVEL INHERITANCE


    Java supports multi-level inheritance. In this, a class is extended by


    another class, which is again extended by another class. The


    following picture shows multi-level inheritance.


    **Employee**


    **RegularEmployee**


    **Consultant**


    **OverseasEmployee**


