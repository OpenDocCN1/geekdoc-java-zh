    66\n\n### Built-in Functional Interfaces\n\n* The Java 8 API contains many built-in\
    \ functional interfaces.\n* Some of them are well known from older versions of\
    \ Java like `Comparable`, `Comparator` or `Runnable`.\n* New ones are added in\
    \ `java.util.function` package.\n* Many of these functional interfaces have default\
    \ methods other than functional (abstract) method.\n\n| Interface | Description\
    \ |\n| :--- | :--- |\n| `Consumer<T>` | Represents an operation that accepts a\
    \ single input argument and returns no result. Functional method is `accept(T)`.\
    \ |\n| `Function<T, R>` | Represents a function that accepts one argument and\
    \ produces a result. Functional method is `apply(T)` and returns `R`. |\n| `Predicate<T>`\
    \ | Represents a predicate (boolean-valued function) of one argument. Functional\
    \ method is `test(T)` and returns `Boolean`. |\n| `Supplier<T>` | Represents a\
    \ supplier of results. Functional method is `get()` that returns `T`. |\n| `UnaryOperator<T>`\
    \ | Applies a unary operation to an object of type `T` and returns `T`. The method\
    \ is `apply(T)`. |\n| `BinaryOperator<T>` | Applies an operation to two objects\
    \ of type `T` and returns the result of type `T`. Method is `apply(T,T)`. |\n\n\
    ```java\nimport java.util.function.*;\npublic class BuiltInFunctionalInterfaces\
    \ {\n    public static void main(String[] args) {\n        Consumer<String> c=(s)\
    \ ->\n            System.out.println(s.toUpperCase());\n        c.accept(\"Srikanth\"\
    );\n        Predicate<String> p = (s) -> s.length() > 5;\n        System.out.println(p.test(\"\
    Java\"));\n        Function<Integer,String> f=(n)->n.toString();\n        System.out.println(f.apply(100));\n\
    \    }\n}\n```\n\nSrikanth Technologies\n\nJava Student’s Guide - Library-II\n\
    67\n\n### Streams\n\n* A stream is a sequence of elements supporting sequential\
    \ and parallel aggregate operations.\n* Unlike a collection, stream is not a data\
    \ structure that stores elements. Instead, a stream carries values from a source\
    \ through a pipeline of operations.\n* Stream operations are either `intermediate`\
    \ or `terminal`.\n* Source of stream could be a collection, an array, a generator\
    \ function, or an I/O channel.\n* An intermediate operation, such as `filter`,\
    \ produces a new stream.\n* A terminal operation, such as `forEach`, produces\
    \ a non-stream result, such as a primitive value (like a double value), a collection,\
    \ or in the case of `forEach`, no value at all. They are also called as `reduction`\
    \ operations.\n* Starting from Java 8, the java collections have methods that\
    \ return `Stream`.\n* Streams support Aggregate Operations.\n* The common aggregate\
    \ operations are `filter`, `map`, `reduce`, `find`, `match`, and `sort`. These\
    \ operations can be executed in series or in parallel.\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `boolean allMatch` | Returns whether all elements match\
    \ the provided predicate. |\n| `boolean anyMatch` | Returns whether any element\
    \ matches the provided predicate. |\n| `boolean noneMatch` | Returns whether no\
    \ element matches the provided predicate. |\n| `long count()` | Returns the count\
    \ of elements in this stream. |\n| `Stream<T> distinct()` | Returns a stream of\
    \ distinct elements. |\n| `Optional<T> findFirst()` | Returns an Optional describing\
    \ the first element of the stream. |\n| `Optional<T> findAny()` | Returns an Optional\
    \ describing some element of the stream. |\n| `void forEach` | Performs an action\
    \ for each element of the stream. |\n| `Stream<T> limit(long maxSize)` | Returns\
    \ a stream truncated to be longer than maxSize. |\n| `Stream<T> skip(long n)`\
    \ | Returns a stream after discarding the first n elements. |\n| `Stream<T> sorted()`\
    \ | Returns a stream sorted in natural order. |\n| `Stream<T> sorted(Comparator<?\
    \ super T>)` | Returns a stream sorted by the Comparator. |\n| `Object[] toArray()`\
    \ | Returns an array containing the elements of this stream. |\n\nSrikanth Technologies\n\
