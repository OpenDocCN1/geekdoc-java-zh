- fmt: "\n# SERIALIZATION\n\n- Serialization is the process of writing the state of\
    \ an object (values of instance variables) to a byte stream.\n- Serialization\
    \ allows object data to be stored on disk and later retrieved using deserialization\
    \ process.\n- Serialization is also used in distributed applications to send and\
    \ receive object data across network from one system to another – for example\
    \ it is used in `RMI` (Remote Method Invocation).\n\n## Serializable Interface\n\
    \nIn order to serialize an object of a class, the class must implement the `Serializable`\
    \ interface. `Serializable` is a null interface – an interface with no methods.\
    \ By implementing `Serializable` interface, a class informs to Java that objects\
    \ of the class can be serialized.\n\n## ObjectOutput and ObjectInput Interfaces\n\
    \n- `ObjectOutput` interface extends `DataOutput` interface and supports object\
    \ serialization by providing `writeObject()` method.\n- `ObjectInput` interface\
    \ extends `DataInput` interface and supports object deserialization using `readObject()`\
    \ method.\n\n## ObjectOutputStream and ObjectInputStream Classes\n\n- `ObjectOutputStream`\
    \ class implements `ObjectOutput` interface and extends `OutputStream` class.\n\
    - `ObjectInputStream` class implements `ObjectInput` interface and extends `InputStream`\
    \ class.\n\nThe following are the constructors of these classes:\n- `ObjectOutputStream(OutputStream)`\n\
    - `ObjectInputStream(InputStream)`\n\n`OutputStream` is the stream to which object\
    \ data is to be written and `InputStream` is the stream from where object data\
    \ is to be read.\n\n```java\nimport java.io.Serializable;\nclass Person implements\
    \ Serializable {\n    private String name,email;\n    public Person(String name,\
    \ String email) {\n        this.name = name;\n        this.email = email;\n  \
    \  }\n    public String toString() {\n        return name + \",\" + email;\n \
    \   }\n}\n```\n\n```java\nimport java.io.*;\npublic class SerializeObject {\n\
    \    public static void main(String ...args) {\n        Person p=new Person(\"\
    Sri\",\"sri@gmail.com\");\n        try (FileOutputStream output = new FileOutputStream(\"\
    srikanth.dat\")){\n            ObjectOutputStream outstream = new ObjectOutputStream(output);\n\
    \            outstream.writeObject(p);\n        } catch(Exception ex){\n     \
    \       System.out.println(ex);\n        }\n    }\n}\n```\n\n```java\nimport java.io.FileInputStream;\n\
    import java.io.ObjectInputStream;\npublic class DeserializeObject {\n    public\
    \ static void main(String[] args){\n        // deserialize the object\n      \
    \  try (FileInputStream input = new FileInputStream(\"srikanth.dat\")) {\n   \
    \         ObjectInputStream instream = new ObjectInputStream(input);\n       \
    \     // read object from stream and cast to Person\n            Person p = (Person)\
    \ instream.readObject();\n            System.out.println(p.toString());\n    \
    \    } catch(Exception ex){\n            System.out.println(ex);\n        }\n\
    \    }\n}\n```\n\n## Char Streams vs. Byte Streams\n\nThe following table shows\
    \ character streams and their corresponding byte streams.\n\n| Character Stream\
    \ | Byte Stream |\n| :--- | :--- |\n| Reader | `InputStream` |\n| Writer | `OutputStream`\
    \ |\n| FileReader | `FileInputStream` |\n| FileWriter | `FileOutputStream` |\n\
    | BufferedReader | `BufferedInputStream` |\n| BufferedWriter | `BufferedOutputStream`\
    \ |\n| PrintWriter | `PrintStream` |\n| FilterReader | `FilterInputStream` |\n\
    | LineNumberReader | `LineNumberInputStream` |\n| PushbackReader | `PushbackInputStream`\
    \ |\n\n# NETWORKING\n\n- Java provides classes which allow you to program internet\
    \ or TCP/IP network.\n- All classes are made available through `java.net` package.\n\
    - Data transfer between Java programs, running on different systems, is done using\
    \ IO streams.\n- Server can use Multi-threading to handle multiple clients at\
    \ the same time.\n\n## Socket programming\n\n- Sockets enable communication between\
    \ two programs running in the same JVM or different JVMs.\n- Server socket is\
    \ associated with a number called `port` number.\n- In order to access a server\
    \ socket, client socket has to provide the name of machine on which server socket\
    \ runs and the port number at which server socket listens.\n- Port number is an\
    \ integer to uniquely identify each server socket on a system. Name of the system\
    \ and port number uniquely identify a server socket in a network.\n- Once you\
    \ establish a connection with socket, you can take `InputStream` to read data\
    \ from socket and `OutputStream` to write data to socket.\n\n**Port=100**, **Host=“server”**\n\
    \nThe following table shows some of the common internet applications and their\
    \ port numbers.\n\n| Port | Application/Protocol |\n| :--- | :--- |\n| 21 | File\
    \ Transfer Protocol(FTP) |\n| 23 | Telnet Protocol |\n| 25 | Simple Mail Transfer\
    \ Protocol(SMTP) |\n| 80 | Hypertext Transfer Protocol(HTTP) |\n| 110 | Post office\
    \ protocol (POP3) |\n\n## Socket Class\n\n- `Socket` class represents a client\
    \ socket.\n- A client socket connects to a server socket, which is created using\
    \ `ServerSocket` class.\n- Address of server is specified either using IP address\
    \ or name of computer.\n\n| Method | Meaning |\n| :--- | :--- |\n| `close()` |\
    \ Closes this socket. |\n| `getInetAddress()` | Returns the address to which socket\
    \ is connected. |\n| `getInputStream()` | Returns an input stream for this socket.\
    \ |\n| `getOutputStream()` | Returns an output stream for this socket. |\n| `getPort()`\
    \ | Returns the remote port to which socket is connected. |\n\n## ServerSocket\
    \ Class\n\n- Creates a server socket with the given port number.\n- A server socket\
    \ waits for a request to come from clients and processes the requests.\n\n| Method\
    \ | Meaning |\n| :--- | :--- |\n| `accept()` | Waits for a request and returns\
    \ client socket. |\n| `close()` | Closes this socket. |\n| `getInetAddress()`\
    \ | Returns the local address of server socket. |\n| `getLocalPort()` | Returns\
    \ the port on which socket is listening. |\n\nThe following program creates a\
    \ server socket that waits for a request to come from client and sends system\
    \ date and time back to client.\n\n```java\nimport java.io.PrintWriter;\nimport\
    \ java.net.*;\nimport java.util.Date;\npublic class TimeServer {\n    public static\
    \ void main(String args[]) throws Exception {\n        ServerSocket ss = new ServerSocket(2000);\n\
    \        System.out.println(\"TimeServer is ready...\");\n        while (true)\
    \ {\n            Socket cs = ss.accept(); // wait for client\n            PrintWriter\
    \ pw = new PrintWriter(cs.getOutputStream(), true);\n            pw.println(new\
    \ Date().toString()); //to client\n        } // end of while\n    } // end of\
    \ main\n} // end of class\n```\n\nThe following program connects to server socket\
    \ – `TimeServer` and then reads the data sent from server.\n\n```java\nimport\
    \ java.io.InputStream;\nimport java.net.Socket;\nimport java.util.Scanner;\npublic\
    \ class TimeClient {\n    public static void main(String[] args) throws Exception\
    \ {\n        // connect to server at port number 2000\n        Socket cs=new Socket(\"\
    localhost\",2000);\n        // get stream to read data from server\n        InputStream\
    \ is = cs.getInputStream();\n        // Use Scanner to read a line\n        Scanner\
    \ scanner = new Scanner(is);\n        String line = scanner.nextLine();\n    \
    \    System.out.println(line);\n    }\n}\n```\n"
