    ### List Interface


    - Extends `Collection` interface.

    - An ordered collection (also known as a *sequence*).

    - Allows elements to be accessed by their position (index).

    - Classes `ArrayList`, `LinkedList` and `Vector` implement `List` interface.


    | Method | Meaning |

    | :--- | :--- |

    | `void add(int index, Object value)` | Inserts the given object at the specified
    position. |

    | `Object get(int index)` | Returns object from the specified position in this
    list. |

    | `int indexOf(Object value)` | Returns the index of the first occurrence of the
    specified object or -1 if object is not found. |

    | `ListIterator listIterator()` | Returns a list iterator of the elements in this
    list. |

    | `Object set(int index, Object value)` | Replaces the object at the specified
    position. |

    | `void replaceAll(UnaryOperator<E>)` | Replaces each element of the list with
    the operator. |

    | `void sort(Comparator)` | Sorts the list according to order. |

    | `List<E> subList(int from, int to)` | Returns a list between `from` (inclusive)
    and `to` (exclusive). |

    | `Object remove(int index)` | Removes element at the specified position. |


