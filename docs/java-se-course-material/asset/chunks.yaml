    ## URL class


    - This class represents a Uniform Resource Locator.

    - `URL` is used to uniquely identify a resource in Internet or network.


    A URL contains the following components:


    - **Protocol**: It represents protocol used to access the resource. Common protocols
    are HTTP, FTP, File etc. Default protocol is HTTP.

    - **Host**: Name of the system. System may be referred either by name or by IP
    address.

    - **Port number**: Port number of server socket to be accessed. If none is given
    then port number 80 (http) is taken.

    - **File**: File to be accessed on the server. The path must be understood by
    the server processing the URL.


    - `URL(String spec)`

    - `URL(String protocol, String host, String file)`

    - `URL(String protocol, String host, int port, String file)`


    | Method | Meaning |

    | :--- | :--- |

    | `equals(Object obj)` | Compares two URLs. |

    | `getFile()` | Returns the file name of this URL. |

    | `getHost()` | Returns the host name of this URL, if applicable. |

    | `getPort()` | Returns the port number of this URL. |

    | `getProtocol()` | Returns the protocol name of this URL. |

    | `openConnection()` | Returns a `URLConnection` object that represents a connection
    to the remote object referred to by the URL. |

