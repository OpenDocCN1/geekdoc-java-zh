    \ 是由 JVM 抛出的\n\n## 异常类型 – 检查异常与非检查异常\n\n异常有两种类型：非检查异常（运行时/隐式异常）和检查异常（编译/式异常）。\n\
    \n### 非检查异常\n处理非检查异常不是强制的。这些异常某些由 JVM 抛出，另一些由 Java API 抛出。然而，你可能希望处理非检查异常以防止程序终止并处理异常事件。所有继承\
    \ `RuntimeException` 类的异常都是非检查异常。\n\n### 检查异常\n检查异常由方法抛出。这些异常必须由调用方法的代码使用 `try`\
