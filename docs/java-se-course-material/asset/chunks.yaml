    types such as int, long etc. |

    | `void seek(long pos)` | Sets the pointer to the specified location. The `pos`
    is number of bytes from the beginning of the file. |

    | `void write<type>(value)` | Writes the specified value. `<type>` is one of the
    primitive types. |


