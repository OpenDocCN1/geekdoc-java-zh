    \ 可能抛出的 `AmountException`。\n\n### catch 块的无效与有效顺序\n理解异常类的层次结构很重要。最具体的异常必须先处理，然后是不具体的。下面的代码段显示了异常处理的无效顺序，并将导致编译错误。\n\
