    # Object class


    - `Object class` is one of the standard classes in Java API.

    - All other classes in Java are subclasses of `Object` class.

    - A class declaration without `extends` clause, implicitly extends `Object` class.

    - So a reference to `Object` class can refer to an object of any class in Java.


    ## Method


    | Method | Meaning |

    | :--- | :--- |

    | `clone()` | Creates a new object that is same as the object being cloned. Default
    implementation does shallow copying – only primitive value and references are
    copied. Override this method to provide *deep copying*. |

    | `boolean equals(Object)` | Compares the contents of two objects and returns
    true if contents are same. Default implementation compares only references and
    not contents. Override this method to provide value based comparison. |

    | `void finalize()` | Called before an unused object is released by garbage collector.
    Default implementation does nothing. |

    | `int hashCode()` | Returns the hash code associated with the invoking object.
    Hash code is used when object is used with hashing - `HashSet`. When two objects
    are equal then hash codes for those two objects must also be equal. |

    | `String toString()` | Returns a string that describes the object. Default implementation
    returns `classname@ hashcode-in-hex`. |

    | `final Class getClass()` | Returns an object of type `Class` related to object.
    |


    **Note**: If two objects are equal according to the `equals(Object)` method, then
