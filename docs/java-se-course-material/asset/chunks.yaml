    \ by `n` times by filling 0 on the right. |\n| `>>` | Shifts all bits right by\
    \ `n` times, filling left side bits with sign bit. |\n| `>>>` | Shifts all bits\
    \ right by `n` times, filling left side bits with 0. |\n\nSrikanth Technologies\n\
    Getting Started With Java\n23\n\nThe following snippet shows how to use bitwise\
    \ operators.\n\n```java\npublic class BitOperators {\n    public static void main(String[]\
    \ args) {\n        byte a = 10, b = 15;\n        // 0000 1010 & 0000 1111 = 0000\
    \ 1010\n        System.out.printf(\"%d & %d = %d\\n\",a,b,a & b);\n        //\
    \ 0000 1010 | 0000 1111 = 0000 1111\n        System.out.printf(\"%d | %d = %d\\\
    n\",a,b,a | b);\n        // 0000 1010 >> 2 = 0000 0010\n        System.out.printf(\"\
    %d >> 2 = %d\\n\", a , a >> 2);\n        // 0000 1010 << 2 = 0010 1000\n     \
    \   System.out.printf(\"%d << 2 = %d\\n\", a , a << 2);\n    }\n}\n```\n\n## CONTROL\
    \ STATEMENTS\n\nThe following are conditional statements and looping structures\
    \ available in Java.\n\n### if statement\n\nThe `if` statement is used to decide\
    \ whether an operation is to be performed. If `condition` is true then `statement-1`\
    \ is executed otherwise `statement-2` is executed. The `else` portion is optional.\n\
    \n```java\nif (condition)\n    statement-1;\nelse\n    statement-2;\n```\n\n**Note**:\
    \ If multiple statements are to be executed then enclose statements in braces\
    \ (`{}`).\n\nIt is possible to have nested if statements (an if statement within\
    \ another if statement). It is also possible to have multiple if statements with\
    \ `if ..else.. if .. else` and so on.\n\nSrikanth Technologies\nGetting Started\
    \ With Java\n24\n\n### switch statement\n\nThe `switch` statement is used to execute\
    \ one among many alternatives.\n\n```java\nswitch(expression)\n{\n    case label-1\
    \ : statement; [break];\n    case label-2 : statement; [break];…\n    default\
    \ : statement;\n}\n```\n\nThe following example takes same action for code 1 and\
    \ 2 and different actions for 3. Default is used to take action for the rest of\
    \ the codes.\n\n```java\nswitch(code){\n    case 1 : // falls through to next\
    \ case\n    case 2 : price = 1000; break;\n    case 3 : price = 500; break;\n\
    \    default: price = 100;\n}\n```\n\nFor `switch` statement, the expression must\
    \ be a `char`, `byte`, `short`, `int` or an `enum` type. Starting from Java 7.0,\
    \ `switch` supports `string` data type also.\n\nSrikanth Technologies\nGetting\
    \ Started With Java\n25\n\n```java\nString country;\n// code to get value into\
    \ country\nswitch(country)\n{\n    case \"India\" : // code\n    case \"China\"\
    \ : // code\n    case \"Russia\" : // code\n    default : // code\n}\n```\n\n\
    The case constant must evaluate to the same type as the switch expression. The\
    \ case constant must be a compile time constant.\n\n**Note**: The `default` case\
    \ doesn’t have to come only at the end of the `switch` statement; it can be given\
    \ anywhere.\n\n### while loop\n\nRepeatedly executes statement(s) as long as the\
    \ condition is true.\n\n```java\nwhile(condition)\n    statements;\n```\n\nFollowing\
    \ example displays all numbers from 1 to 10. To execute multiple statements, enclose\
    \ statements in braces (`{}`).\n\n```java\nint i = 1;\nwhile ( i <= 10 ) {\n \
    \   System.out.println(i);\n    i ++;\n}\n```\n\n### do .. while loop\n\nExecutes\
    \ the body of the loop and then checks the condition thus guaranteeing the execution\
    \ of the statement at least for once.\n\n```java\ndo {\n    statement;\n}while\
    \ (condition);\n```\n\nSrikanth Technologies\nGetting Started With Java\n26\n\n\
    The following program displays numbers from 1 to 10.\n\n```java\nint i = 1;\n\
    do {\n    System.out.println(i);\n    i ++;\n} while (i <= 10);\n```\n\n### for\
    \ loop\n\n`for` loop executes statements as long as the condition is true. First\
    \ it executes initialization, then checks whether condition is true. If condition\
    \ is true then executes the statements and then increment portion.\n\n```java\n\
    for( initialization; condition; increment)\n    Statement;\n```\n\nVariable can\
    \ be declared within initialization and these variables are available only within\
    \ the loop.\n\n```java\nfor(int i=1;i<=10++){\n    // i is available only within\
    \ the loop\n}\n```\n\n### break statement\n\n`break` statement is used to terminate\
    \ the loop. Java provides labeled `break` and unlabeled `break`. The `break` statement\
    \ can be used inside a loop or a switch statement.\n\nSrikanth Technologies\n\
    Getting Started With Java\n27\n\n```java\nlabel:\nfor(...) {\n    if(condition)\n\
    \        break label;\n}\n```\n\n### continue statement\n\n`continue` is used\
    \ to skip the current iteration of the loop and proceed to the next iteration.\n\
    \n```java\nfor(...) {\n    if(condition)\n        continue;\n}\n```\n\n### Printing\
    \ value using System.out.printf\n\n`printf()` function is similar to `printf()`\
    \ of C. The following are conversion characters that can be used: `b` - boolean,\
    \ `c` - char, `d` - integer, `f` - floating point, `s` - string.\n\nIf conversion\
    \ character and given do not match then a runtime error occurs. The following\
    \ will produce a runtime error.\n\n### Reading input using Scanner\n\nInput from\
    \ users can be taken using `Scanner` class. The following snippet shows how to\
    \ use `Scanner` to read an integer from user.\n\n```java\nimport java.util.Scanner;\n\
    \npublic class Factors {\n    public static void main(String[] args) {\n     \
    \   Scanner s = new Scanner(System.in);\n        System.out.print(\"Enter a number\
    \ :\");\n        int num=s.nextInt();\n        for (int i = 2; i <= num/2; i++)\
    \ {\n            if(num % i == 0)\n                System.out.println(i);\n  \
    \      }\n    }\n}\n```\n\n| Method | Description |\n| :--- | :--- |\n| `nextInt()`\
    \ | Reads next integer |\n| `nextDouble()` | Reads next double |\n| `nextLine()`\
    \ | Reads next line and returns as a string |\n\n## CREATING AND USING ARRAYS\n\
    \n- Array is a collection of elements.\n- All elements of the array are of the\
    \ same type.\n- All elements are commonly referred by a single name and individual\
    \ elements are accessed using index.\n- An array in Java is dynamic. We specify\
    \ the size of the array at runtime.\n\n```java\nint a1[]; //declare an array\n\
    int [] a2; //another syntax to declare an array\n\n// Create an array of 10 elements\n\
    a1 = new int[10];\n```\n\nAlternatively, you can declare and allocate memory in\
    \ one step.\n\n```java\n/* create an array where size of the array is determined\
    \ by the value of variable n */\nint a2[] = new int[n];\n```\n\n### Getting array’s\
    \ length using length\n\nProperty `length` of an array can be used to get number\
    \ of elements in an array.\n\n```java\nSystem.out.printf(\"Length : %d\", a.length);\n\
    ```\n\nAn array name can be used to refer to an array of different sizes at runtime.\
    \ The following snippet shows how array name `arr` points to an array of 10 elements\
    \ first and then points to an array of 5 elements.\n\n```java\n// create an array\n\
    int arr[] = new int[10];\n//Array arr points to a new array of 5 elements.\narr\
    \ = new int[5];\narr\n```\n"
