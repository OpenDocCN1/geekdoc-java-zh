    ## More precise rethrow in Java 7.0


    If an exception parameter is not modified and if it is re-thrown inside the catch
    block, the compiler applies a more precise analysis to determine the type of what
    can be thrown.


    In the code below, `throw ex;` will result in error in Java 6.0 as `ex` is of
    type `Exception` and method has only `Ex1` and `Ex2` in `throws` clause. Exception
    type is much more general than `Ex1` and `Ex2`, so Java doesn''t allow us to throw
    `ex`, which is declared as `Exception`.


    But Java 7.0 applies more precise analysis to determine the type of exception
    being thrown. Java 7.0 understands that only two possible exceptions (`Ex1` and
    `Ex2`) can be thrown from try block so it allows `ex` to be rethrown though `ex`
    is declared as `Exception`.


    ```java

    01: class Ex1 extends Exception { }

    02: class Ex2 extends Exception { }

    03:

    04: public class RethrowException {

    05: public void m1(int v) throws Ex1 , Ex2 {

    06: try {

    07: if (v < 0) {

    08: throw new Ex1();

    09: }

    10: else

    11: if ( v > 100 ) {

    12: throw new Ex2();

    13: }

    14: // process

    15: }

    16: catch (Exception ex) {

    17: throw ex; // Doesn’t compile in 6.0, but works in 7.0

    18: }

    19: }

    20: }

    ```


    ## Assertions


    - Assertions can be used to validate assumptions made about state of the program.

    - Each assertion is associated with a Boolean condition. If condition fails it
    means the assumption fails and assertion error occurs.

    - Assertions are disabled by default. So, you must enable assertions at the time
    of running program.

    - Assertions are part of development process. They should not be included in final
    version of your code.


    `assert <boolean expression>`

    `assert <boolean expression> : message`


    When boolean expression results in false, Java throws `AssertionError`. If it
    results in true, execution continues normally. If message is given then it is
    displayed in stack trace.


    ```java

    01: public class AssertionTest {

    02: private void print(int count) {

    03: assert count > 0 : "Invalid count";

    04: }

    05: public static void main(String[] args) {

    06: AssertionTest t = new AssertionTest();

    07: t.print(1);

    08: t.print(0);

    09: }

    10: }

    ```


    If you run the previous program by enabling assertions using `-ea` then the following
    will result:

    java -ea AssertionTest

    Exception in thread "main" java.lang.AssertionError: Invalid count


    **NOTE:** Assertions must be used in such a way that debugging aids.


    ## MULTITHREADING


    - An independent sequential path of execution within a program is called a thread.

    - When a program contains two or more parts that run concurrently, it is called
    multithreading.

    - Java’s libraries are designed with multithreading on mind.

    - Each thread is also called as lightweight process and the overheads are low
    compared with process.

    - A thread may exist in any of the states such as running, ready, blocked etc.,
    during its life time.

    - All the threads of a process run within the same address space.

    - Context switching between threads is less expensive and faster than context
    switch between processes.


    - A process has a self-contained execution environment.

    - A process generally has a complete, private set of run-time resources; in particular,
    each process has its memory space.

    - Processes are often seen as synonymous with programs or applications.

    - Most implementations of the Java virtual machine run as a single process.


    ## Main Thread


    - Main thread is the first thread to start in a Java program.

    - This is the thread from where other threads are created and started.

    - It is typically the last thread to terminate. When main thread terminates then
    the program terminates unless other threads spawned by main thread still run.

    - This thread is created by JVM to run `main()` method.


    ```java

    01: public class MainThread {

    02: public static void main(String[] args) {

    03: Thread t = Thread.currentThread();

    04:

    05: System.out.println( t.getName());

    06: System.out.println( t.getPriority());

    07: }

    08: }

    ```


    The following are two different ways in which a new thread can be created:

    - By extending `Thread` class.

    - By implementing interface `Runnable`.


    ### Creating a new thread by extending Thread class


    - You can create a new thread by creating an object of a class that extends `Thread`
    class. The following are the steps to be followed:

    - Create a class that extends `Thread` class.

    - Override `run()` method of `Thread` class.

    - Create an object of subclass of `Thread` class and invoke `start()` method to
    start running the thread, which in turn calls `run()` method.


