    \ | Inserts the given data at the given offset in the buffer. |\n| `StringBuffer\
    \ deleteCharAt(index)` | Removes character at the index. |\n| `StringBuffer delete(int\
    \ start, int end)` | Removes characters from `start` to `end`. |\n| `StringBuffer\
    \ reverse()` | Reverses string buffer. |\n\nThe following program demonstrates\
    \ a mutable string with `StringBuffer`.\n\n```java\npublic class SBDemo {\n  \
    \  public static void main(String args[]) {\n        StringBuffer sb = new StringBuffer(\"\
    Java \");\n        sb.append(\"EE\");\n        System.out.println(sb); // Java\
    \ EE\n        sb.insert(0,\"Oracle \");\n        System.out.println(sb); // Oracle\
    \ Java EE\n        sb.delete(0,6);\n        System.out.println(sb); // Java EE\n\
    \    }\n}\n```\n\n**NOTE:** `StringBuilder` class was introduced in Java 5.0.\
    \ It is same as `StringBuffer` except that it is NOT synchronized. So `StringBuilder`\
    \ is not thread-safe but could be faster than `StringBuffer`.\n\n### StringJoiner\
    \ class\n\n`StringJoiner` is used to construct a sequence of strings separated\
    \ by a delimiter and optionally prefix and suffix.\n\n- `StringJoiner(String delimiter)`\n\
    - `StringJoiner(String deliter, String prefix, String suffix)`\n\n| Method | Meaning\
    \ |\n| :--- | :--- |\n| `StringJoiner add(CharSequence value)` | Adds a copy of\
    \ the given `CharSequence` (`value`) as the next element of the `StringJoiner`.\
    \ |\n| `StringJoiner merge(StringJoiner other)` | Adds the contents of the given\
    \ `StringJoiner` (`other`) without prefix and suffix as the next element. |\n\
    | `StringJoiner setEmptyValue(CharSequence value)` | Sets the value to be used\
    \ when no elements have been added yet, that is, (`value`) when it is empty. |\n\
    \n```java\nStringJoiner sj = new StringJoiner(\",\",\"[\",\"]\");\nsj.add(\"Java\"\
    );\nsj.add(\"C#\");\nsj.add(\"Python\");\nSystem.out.println(sj.toString()); //\
    \ [Java,C#,Python]\n```\n\n### Math class\n\n`Math` class contains a set of `static`\
    \ methods to support common mathematical functions. It is a final class and cannot\
    \ be extended.\n\n| Static Method | Meaning |\n| :--- | :--- |\n| `T abs(T number)`\
    \ | Returns absolute value. |\n| `T min(T n1, T n2)` | Returns least of two numbers.\
    \ |\n| `T max(T n1, T n2)` | Returns greater of two numbers. |\n| `long round(double)`\
    \ | Returns number after rounding it. |\n| `double pow(double base, double power)`\
    \ | Returns base raised to power. |\n| `double random()` | Returns a random number\
    \ that is >=0 and <1.0. |\n\n**NOTE:** In the above methods `T` indicates the\
    \ data type used.\n\n```java\npublic class MathDemo {\n    public static void\
    \ main(String[] args) {\n        System.out.println(Math.abs(-10) );\n       \
    \ System.out.println(Math.min(10,20));\n        System.out.println(Math.round(10.636));\n\
    \        System.out.println(Math.round(Math.random()*100)); // 0-99\n    }\n}\n\
    ```\n\n### Arrays class\n\n`Arrays` class provides static methods to search, sort,\
    \ fill and compare arrays. It provides methods that work on array of any type.\n\
    \n| Method | Meaning |\n| :--- | :--- |\n| `int binarySearch(T array[], T v)`\
    \ | Searches for value using binary search algorithm. |\n| `boolean equals(T array[],\
    \ T array[])` | Compares whether contents of two arrays are equal. |\n| `void\
    \ fill(T array[], T value)` | Fills all elements of an array with the given value.\
    \ |\n| `String sort(T array[])` | Sorts the given array. |\n| `String toString(T\
    \ array[])` | Returns a string that contains all elements of the array. |\n| `T\
    \ [] copyOf(T array[], int length)` | Makes a copy of an existing array to the\
    \ specified size. |\n\n```java\nimport java.util.Arrays;\nclass ArraysDemo {\n\
    \    public static void main(String[] args) {\n        long a[] = new long[5];\n\
    \        for ( int i = 0 ; i < 5; i ++)\n            a[i] = Math.round(Math.random()\
    \ * 100 );\n        Arrays.sort(a);\n        for (long n : a)\n            System.out.println(n);\n\
    \        int pos = Arrays.binarySearch(a,30);\n        if ( pos >= 0)\n      \
    \      System.out.printf(\"Found at : %d\", pos);\n        else\n            System.out.println(\"\
    Not found\");\n    }\n}\n```\n\n### Calendar class\n\n`Calendar` class provides\
    \ methods and fields to obtain information about date and time. `Calendar` is\
    \ an abstract class and its subclass is `GregorianCalendar`. Static method `getInstance()`\
    \ is used to return an object of `Calendar` containing system date and time.\n\
    \n| Method | Meaning |\n| :--- | :--- |\n| `int get(what)` | Returns the value\
    \ specified by `what`. |\n| `void add(int what, int value)` | Adds `value` which\
    \ is specified by `what` parameter. |\n| `void set(year, month, days, hours, minutes,\
    \ seconds)` | Sets date and time to given values. |\n| `void setTime(Date)` |\
    \ Sets time to given `Date` object. |\n\n```java\nimport java.util.*;\nclass CalendarDemo\
    \ {\n    public static void main(String[] args) throws Exception {\n        Calendar\
    \ cal=Calendar.getInstance();//get system date&time\n        cal.add(Calendar.MONTH,10);\n\
    \        System.out.printf (\"Year :%d Month:%d Day:%d\", cal.get(Calendar.YEAR),\
    \ cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH));\n    }\n}\n```\n\n\
    ```java\n// Calculate age in years for the given date\nimport java.util.Calendar;\n\
    import java.util.Scanner;\n\npublic class AgeCalculation {\n    public static\
    \ void main(String[] args) {\n        // take dob from user\n        Scanner s\
    \ = new Scanner(System.in);\n        System.out.print(\"Enter date of birth [dd-mm-yyyy]\
    \ :\");\n        String dobstring = s.nextLine();\n\n        String [] parts =\
    \ dobstring.split(\"-\");\n\n        Calendar dob = Calendar.getInstance();\n\
