    \n以下是表示 `Employee` 类的 UML（统一建模语言）图。减号（`-`）表示 `private` 权限，加号（`+`）表示 `public` 权限。\n\
    \n```\nEmployee\n- name : String\n- salary : int\n+ init(name:string, sal:int):\
