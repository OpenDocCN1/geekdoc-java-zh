    \ Java 的重点是健壮性和互联网编程。\n\n# JAVA 语言的特性\n\n以下是 Java 语言的主要特性。\n\n### 健壮性 (Robust)\n\
    使程序更加健壮（无潜在错误）。Java 在编译程序时会检测所有潜在问题。它在运行时还会检查数组越界等问题。\n\n### 面向对象 (Object Oriented)\n\
    支持封装、继承和多态。Java 允许所有代码仅放在类中。它不允许任何代码放在类之外，包括 `main()` 方法。\n\n### 动态 (Dynamic)\n\
    在运行时为数组和对象分配内存，并自动处理内存的分配和释放。垃圾回收器负责释放不再内存块。\n\n### 多线程 (Multithreaded)\n支持创建和管理多个线程。\n\
    \n### 分布式 (Distributed)\n支持程序在不同的系统上运行并相互通信。提供了从一个应用程序传输数据到另一个应用程序的机制。\n\n###\
    \ 平台无关性 (Platform Independent)\n允许编译后的程序（字节码）运行在任何其他平台上。\n\n# JAVA 是健壮的\n\n- Java\
    \ 作为一种健壮的语言，会在编译时和运行时都检查潜在错误。\n- Java 是一种强类型语言，值的数据类型不能转换为另一种，并且对大小敏感。\n- 以下代码段显示了\
    \ C 中允许但在 Java 中不允许的操作。\n\n```\nint a[10];\nint i , j; // 局部变量，未初始化\na[10]=100;\
    \ // 访问范围外的元素\ni = j; // 将 float 赋值给 int\nj++; // 在未初始化的情况下使用\n```\n\n- Java 还会检查当条件为假时，本应返回值的函数。\n\
    \n```\n/* 此函数无法编译，因为它没有返回值 */\nint fun(int v){\n    if ( v > 10 )\n    return\
    \ 1;\n    else\n}\n```\n\n- Java 会检查代码段在程序执行期间是否可达。如果代码在所有执行路径中都是不可达的，它会报错。\n\n\
    ```\n/* 不可达代码示例 */\nint fun(int v) {\n    if ( v > 10 )\n    return 1;\n    else\n\
    \    return 0;\n}\nv++; // 无法到达\n```\n\n# 平台无关的语言\n\nJava 语言的主要特性是其平台无关性。这允许在在一个平台上编译的\
    \ Java 程序运行在任何其他平台上。这被称为 WORA（一次编写，随运行）。\n\n平台无关性不同于可移植性（Portability），后者允许将源代码迁移到不同的平台。虽然迁移了源程序，但我们需要在运行它之前在目标平台上编译源程序。\n\
    \n所有高级语言都具有可移植性。原生代码是微处理器和计算机操作系统能够理解的代码。\n\n注意：平台是应用程序运行的环境。它通常是操作系统和硬件的结合。平台通常同于操作系统。\n\
    \n# Java 程序的编译与运行\n\n以下是与 Java 程序编译和运行相关的步骤。Java 程序**不是**编译成原生代码，而是编译成字节码（Byte\
    \ code），字节码接近原生代码但不是任何平台的原生代码。\n\n一旦 Java 程序编译成字节码（`.class` 文件），就可以在任何可用 `JVM`（Java\
    \ 虚拟机）的平台上运行。\n\n注意：Java 编译器和 `JVM` 是特定于每个平台的。只有字节码是平台无关的。\n\n# Java 与平台无关性\n\n\
    以下展示了在 Windows 系统上编译的 Java 程序如何在 Linux 系统上运行。一旦 Java 程序编译成字节码（`.class` 文件），就可以在任何可用\
    \ `JVM` 的机器上执行。大多数现代操作系统在提供操作系统同时也提供了 `JVM`，允许字节码直接运行。\n\n# JVM - 使用 Java SE\n\
    \n- 从 `http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`\
    \ 下载 Java SE（即 `JDK` – Java 开发工具包）。\n 安装 Java SE 只需要双击下载的文件（`.exe` 文件）并按照步骤操作。\n\
    - 建议将 Java SE 安装在 `c:\\jdk` 等目录中，而不是默认目录（程序文件目录）。\n- 安装 `JDK` 后，安装程序将进行 `JRE`（Java\
    \ 运行环境）安装。\n\n注意：你可以从 `netbeans.org` 下载集成开发环境 NetBeans IDE。Eclipse 是另一个可以从 `eclipse.org`\
    \ 下载的 IDE。\n\n# Java SE 的目录结构\n\n当你将 Java SE 安装到目录（例如 `c:\\jdk`）后，目录结构将如下：\n\n\
    - `c:\\jdk`\n- `bin` (`javac.exe`, `java.exe`)\n- `db`\n- `include`\n- `jre`\n\
    - `lib`\n- `.jar`\n- `srikanth (用户创建)`\n\n### 目录描述\n\n- `bin`: 包含与 `JDK` 相关的可执行文件。包含\
    \ `JAVAC.EXE` 和 `JAVA.EXE`。\n- `db`: 包含 derby 数据库。\n- `include`: 包含 Java Native\
    \ Interface（JNI）的文件。\n- `jre`: Java 运行环境。\n- `lib`: 包含 Java 库，以 `.jar`（Java 归档）文件的形式存在。\n\
    - `srikanth`: 用户自定义文件夹。\n\n注意：在 `jdk` 下创建一个用户目录并将程序放在该目录中。例如，名为 `srikanth` 的目录可以用于存储用户的\
    \ Java 程序。\n\n# 基础工具\n\n这些工具是 `JDK` 的基础。它们是你用于创建和构建应用程序的工具\n\n| 工具名称 | 简要描述 |\n\
    | :--- | :--- |\n| `javac` | Java 语言的编译器。 |\n| `java` | Java 程序的启动器。 |\n| `javadoc`\
    \ | API 文档生成器。 |\n| `apt` | 注解处理工具。 |\n| `appletviewer` | 无浏览器运行和调试 applet。 |\n\
    | `jar` | 创建和管理 Java 归档 (JAR) 文件。 |\n| `jdb` | Java 调试器。 |\n| `javah` | C 头文件和存根生成器。用于编写原生方法。\
    \ |\n| `javap` | 类文件反汇。 |\n| `extcheck` | 检测 Jar 冲突的实用。 |\n\n# 第 Java 程序 – HELLO.JAVA\n\
    \n使用 `Notepad` 等文本编辑器编写以下程序，并保存为 `Hello.java`。如果你使用 `Notepad`，请确保在保存时为文件名加上引号（`\"\
    Hello.java\"`），否则 Notepad 会给出默认扩展名 `.txt`。\n\n将此程序保存为 `c:\\jdk\\srikanth\\Hello.java`。\n\
    \n```java\n// 打印 Hello World 的程序\npublic class Hello{\n    public static void\
    \ main(String args[]){\n        System.out.println(\"Hello World!\");\n    }\n\
    }\n```\n\n当你编译并运行上述 Java 程序时，它会打印 *Hello World!* 消息。\n\n"
