    ```\n\n你可以使用 `t` 标志（列表）查看 JAR 文件的内容：\n\n```bash\nC:\\jdk\\srikanth>jar ft library.jar\n\
    ```\n\n使用其类不需要解压 JAR 文件。只需将其放入 `CLASSPATH` 中即可。为了使用放在 `c:\\java` 文件夹中的 `library.jar`，我们需要如下设置路径：\n\
    \n```bash\nset classpath=.;c:\\jdk\\srikanth;c:\\java\n```\n\n### 访问修饰符\n\n访问修饰符规定了从哪里可以访问成员。以下是类成员的可用修饰符及其含义。\n\
    \n| 访问修饰符 | 含义 |\n| :--- | :--- |\n| `private` | 允许在定义的类内部访问。 |\n| `protected`\
    \ | 允许从类及其所有子类以及同一包中的任何类访问。 |\n| `default` | 允许在类所属的包内范围内访问。如果没有给出访问修饰符，Java 使用\
    \ *default* 作为访问修饰符。 |\n| `public` | 允许从任何地方访问。 |\n\n**注意**：对于顶层类，仅适用 `public`\
    \ 和 `default` 访问修饰符。然而，内部类也可以拥有 `private` 和 `protected` 修饰符。下面的示例演示了访问修饰符如何影响子类、同一包中的其他类以及其他包的访问。\n\
    \n**A.java**\n```java\npackage p1;\npublic class A {\n    private int v1;\n  \
    \  protected int v2;\n    public int v3;\n    int v4; // 默认访问\n}\n```\n\n**B.java**\n\
    ```java\npackage p1;\npublic class B extends A {\n    public void print() {\n\
    \        // 可以访问 v2, v3, v4\n    }\n}\n```\n\n"
