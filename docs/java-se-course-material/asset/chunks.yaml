    ## OBJECT REFERENCE


    Object reference is a variable that references an object. An object in Java is
    accessed using object reference.


    ```java

    01: Employee e1; // create object reference of Employee class

    02: // create an object and make e1 referencing it

    03: e1 = new Employee ("Larry",10000);

    04: //create object reference and object

    05: Employee e1 = new Employee("Larry",10000);

    06: Employee e2 = new Employee("Steve",15000);

    ```


    ### Comparing object references


    If two object references of the same class are compared, only references are compared
    but NOT contents of the objects.


    `Employee e1 = new Employee("Jason",25000);`

    `Employee e2 = new Employee("Jason",25000);`

    `if (e1 == e2)` // only references are compared, NOT objects

    `System.out.println("Equal");`


    **NOTE:** If you compare two object references, only the references are compared
    and not the contents of the object that they point to.

    **NOTE**: Only `==` and `!=` relational operators are allowed with object references.


    ### Assignment between two object references


    It is possible to assign one object reference to another. But, what we effectively
    copy is not the contents of an object to another and instead one object reference
    to another.


    The following example and picture demonstrate what happens when an object reference
    is copied to another.


    ```java

    Employee e1,e2;

    e1 = new Employee("Larry",10000);

    e2 = new Employee("Steve",15000);

    e1 = e2; // e1 and e2 point to same object

    ```


    ## ARRAY OF OBJECTS


    * Java supports array of objects of a class.

    * When an array of objects is created only object references that can point to
    objects of class are created.

    * The default value of each element is `null` and object reference must be made
    to point to an object explicitly before it is used.


    ```java

    Employee [] e;

    //Create an array of 5 Employee object references

    e = new Employee[5];

    e[0] = new Employee("Gavin",10000);

    e[1] = new Employee("King",15000);

    ```


