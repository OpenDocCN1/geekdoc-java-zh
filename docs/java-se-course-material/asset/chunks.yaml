    ## 创建标识符的规则


    程序中的名称称为标识符。创建标识符时必须遵循以下规则。


    * 可以包含字母、数字、`_`（下划线）和 `$`。

    * 不能以数字开头。可以以货币符号（`$`）或 `_`（下划线）开头。

    * 不能使用 Java 关键字。


    **有效标识符**：`first_number`、`name$`、`_first`、`$amount`


    **无效标识符**：`2num`、`total-amount`


    ## JAVA 关键字


    以下是 Java 关键字列表。这些关键字均为小写。


    `abstract`, `continue`, `for`, `new`, `switch`, `assert`, `default`, `package`,
    `synchronized`, `boolean`, `do`, `if`, `private`, `this`, `break`, `double`, `implements`,
    `protected`, `throw`, `byte`, `else`, `import`, `public`, `throws`, `case`, `enum`,
    `instanceof`, `return`, `transient`, `catch`, `extends`, `int`, `short`, `try`,
    `char`, `final`, `interface`, `static`, `void`, `class`, `finally`, `long`, `strictfp`,
    `volatile`, `const`, `float`, `native`, `super`, `while`


