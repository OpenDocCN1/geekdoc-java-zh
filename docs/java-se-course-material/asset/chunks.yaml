    使用特定的格式化器 `formatter` 根据 `text` 字符串获取 `LocalTime` 实例。\n\n## LocalDateTime 类\n\
    该类处理日期和时间，但不包含时区。此类用于表示日期 `(月-日-年)` 结合时间 `(时-分-秒-纳秒)`，本质上是 `LocalDate` 与 `LocalTime`\
    \ 的组合。\n\n## YearMonth, MonthDay 和 Year 类\n- `YearMonth` 代表特定年份的月份。\n- `MonthDay`\
    \ 代表特定月份某一天，例如 1 月 1 日元旦。\n- `Year` 代表年份。\n\nSrikanth Technologies\nJava 学生指南\
    \ – 库-I\n20\n\n## 其他类\n- `ZoneId` 指定时区标识，并提供在 `Instant` 和 `LocalDateTime` 之间转换的规则。\n\
    - `ZoneOffset` 指定相对于格林威治/UTC 时间的时区偏移量。\n- `ZonedDateTime` 处理带有相应时区以及该相对于格林威治/UTC\
    \ 偏移量的日期和时间。\n- `OffsetDateTime` 处理带有相对于格林威治/UTC 偏移量但没有时区 ID 的日期和时间。\n- `OffsetTime`\
    \ 处理带有相对于格林威治/UTC 偏移量但没有时区 ID 的时间。\n\n## ChronoUnit Enum\n- [`ChronoUnit`](http://docs.oracle.com/javase/8/docs/api/java/time/temporal/ChronoUnit.html)\
    \ 枚举提供了一组基于日期和时间的标准单位，从毫秒到千年。\n- 可用的常量有 `DAYS`, `HOURS`, `MICROS`, `MILLENNIA`,\
    \ `MILLIS`, `MINUTES`, `MONTHS`, `SECONDS`, `WEEKS`, `YEAR`。\n\n## AgeCalculator.java\n\
    ```java\nimport java.time.LocalDate;\nimport java.time.Period;\nimport java.time.temporal.ChronoUnit;\n\
    import java.util.Scanner;\n\npublic class AgeCalculator {\n    public static void\
    \ main(String[] args) {\n        System.out.print(\"Enter DOB [yyyy-mm-dd]:\"\
    );\n        Scanner s = new Scanner(System.in);\n        String dobstr = s.nextLine();\n\
    \        LocalDate dob = LocalDate.parse(dobstr);\n        LocalDate now = LocalDate.now();\n\
    \        long years = ChronoUnit.YEARS.between(dob,now);\n        System.out.println(years);\n\
    \        Period p = Period.between(dob,now);\n        System.out.printf(\"%d years,%d\
    \ months and %d days old!\\n\",p.getYears(), p.getMonths(), p.getDays());\n  \
    \  }\n}\n```\nSrikanth Technologies\nJava 学生指南 – 库-I\n21\n输入 DOB [yyyy-mm-dd]:1998-10-24\n\
    18\n18 years,0 months and 25 days old!\n\n## DateTimeFormatter 类\n- 提供打印和解析日期时间对象的格式化支持。\n\
    - 使用以下方法获取 `DateTimeFormatter` 对象：\n  - `ofLocalizedDate(format)`\n  - `ofLocalizedTime(format)`\n\
    \  - `ofLocalizedDateTime(format,format)`\n  - `ofPattern(customFormat)`\n\n```java\n\
    import java.time.LocalDate;\nimport java.time.format.DateTimeFormatter;\nimport\
    \ java.time.format.FormatStyle;\n\npublic class DateTimeFormatterExample {\n \
