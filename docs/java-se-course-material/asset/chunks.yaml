    ## `JOptionPane` class

    It contains a set of standard dialog boxes. It provides static methods that are
    used to invoke standard dialog boxes. It also allows you to customize dialog boxes
    to specify title and text.


    The following are static methods provided by `JOptionPane` to display different
    dialog boxes:


    `void showMessageDialog(Component parent, Object Message, String title, int MessageType)`

    `MessageType` may be one of the constants in `JOptionPane` class: `ERROR_MESSAGE`,
    `INFORMATION_MESSAGE`, `WARNING_MESSAGE`, `QUESTION_MESSAGE`, `PLAIN_MESSAGE`.


    `int showConfirmDialog(Component parent, Object Message, String title, int OptionType,
    int MessageType)`

    `OptionType` may be either `YES_NO_OPTION` or `YES_NO_CANCEL_OPTION`. Return value
    is equal to `YES_OPTION`, `NO_OPTION` or `CANCEL_OPTION`.


    `String showInputDialog(Component parent, String message, String title, int MessageType)`


    `String showInputDialog(Component parent, Object message, String title, int messageType,
    int Icon, Object [] options, Object defaultValue)`


