    ## `Timer` 类

    用于按间隔生成事件。它在指定的间隔产生 action 事件。


    `Timer(int delay, ActionListener listener)`

    `delay` 是事件发生的间隔。以毫秒为单位。


    | 方法 | 含义 |

    | :--- | :--- |

    | `start()` | 按指定的间隔开始触发事件。 |

    | `stop()` | 停止触发事件。 |

    | `restart()` | 重新开始触发事件。 |

    | `setDelay(int)` | 更改间隔。 |


