    | `Object poll()` | 获取并移除头部，队列为空则返回 `null`。 |

    | `Object remove()` | 获取并移除此队列的头部。队列为空时抛出异常。 |

    | `Object peek()` | 获取但不移除此队列的头部，队列为空则返回 `null`。 |


