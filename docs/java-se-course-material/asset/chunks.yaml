    ## RandomAccessFile Class

    - Represents random access file, where you can read and write data from anywhere
    in the stream.

    - `RandomAccessFile` writes data in binary format. When you write an integer,
    it writes the memory image of integer as-it-is into file. So it writes 4 bytes
    for an integer, irrespective of the actual value.

    - Implements `DataInput` and `DataOutput` interfaces, which contain methods to
    read and write primitive types from and to stream.

    - Allows pointer to be placed at a specific position using offset (in bytes) from
    the beginning of the file.


    `RandomAccessFile(String name, String mode)`

    `RandomAccessFile(File obj, String mode)`


    `Mode` may be either `"r"` for reading or `"rw"` for read and write.


