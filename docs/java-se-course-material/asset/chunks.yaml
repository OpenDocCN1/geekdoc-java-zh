    ```java\nint a [] = {10,20,30,40,50};\nfor ( int n : a )\n    System.out.println\
    \ (n);\n```\n\nSrikanth Technologies\nGetting Started With Java\n32\n\n## Initializing\
    \ an array\n\nJava allows an array to be initialized. The following examples show\
    \ how you can initialize an array in Java.\n\n```java\n// initializes array a\
