    Java EE\n\nSrikanth Technologies\nJava 学生指南 – 面向对象编程 II\n\n## 异常处理 (EXCEPTION\
    \ HANDLING)\n\n- `Exception`（异常）是一种异常状态（运行时错误）。\n- 当发生异常事件时，Java 会抛出异常。\n- 异常是根据\
    \ `java.lang.Exception` 类创建的对象对象。\n- 根据错误（异常事件），会创建并抛出一个异常类的对象。\n- 如果异常没有被处理，程序将以异常的方式终止。\n\
    - 异常可以由 Java 运行时系统或代码本身抛出。\n\n以下代码演示了当运行抛出异常的代码时会发生什么。\n\n```java\npublic class\
    \ Test {\n    public static void main(String[] args) {\n        int n;\n     \
    \   n = Integer.parseInt( args[0]);\n        if ( 99 % n == 0 ) {\n          \
    \  System.out.printf(\"%d is a factor of 99\", n);\n        }\n    }\n}\n```\n\
    \n如果运行上述程序时传入了无法转换为 int 的命令行参数（例如 `abc`），则会抛出 `NumberFormatException` 异常。\n\n\
    ```text\njava Test abc\nException in thread \"main\" java.lang.NumberFormatException:\
    \ For input string: \"ABC\"\nat java.lang.NumberFormatException.forInputString(Unknown\
    \ Source) …\n```\n\n当抛出异常时，程序会在导致异常的行处终止。\n\n以下是与 Java 异常处理相关的关键字。\n\n| 关键字 |\
    \ 含义 |\n| :--- | :--- |\n| `try` | 指定你想要用于监控异常的代码块。 |\n| `catch` | 捕获异常并采取必要的行动。\
    \ |\n| `finally` | 包含在离开 `try` 块之前必须执行的代码。 |\n| `throws` | 指定方法可能抛出的异常。 |\n| `throw`\
    \ | 抛出给定的异常。 |\n\n以下是 `try`、`catch` 和 `finally` 块的一般通用语法。\n\n```java\ntry {\n\
    \    // try 块\n}\ncatch(<exceptiontype> <parameter>) {\n    // catch 块\n}\nfinally\
    \ {\n    // finally 块\n}\n```\n\n**注意：** 在 `try` 块之后，可以提供 `catch` 或 `finally`\
    \ 或两者都有。但你不能两者都省略。\n\nSrikanth Technologies\nJava 学生指南 – 面向对象编程 II\n\n### 使用 try\
    \ 和 catch 处理异常\n\n如果你想处理可能抛出的异常，请将代码放在 `try` 块中，并在 `catch` 块中处理异常。\n\n```java\n\
    public class Test {\n    public static void main(String[] args) {\n        int\
    \ n;\n        try {\n            n = Integer.parseInt(args[0]);\n            if\
    \ ( 99 % n == 0 ) {\n                System.out.printf(\"%d is a factor of 99\"\
    , n);\n            }\n        } catch (NumberFormatException ex) {\n         \
    \   System.out.println(\"Invalid number!\");\n        }\n    } // main 方法结束\n\
    } // 类结束\n```\n\n### 处理多个异常\n\n也可以处理多个一个异常。但请注意 `try` 块一次只能抛出一个异常。\n\n```java\n\
    public class Test {\n    public static void main(String[] args) {\n        int\
    \ n;\n        try {\n            n = Integer.parseInt(args[0]);\n            if\
    \ ( 99 % n == 0 ) {\n                System.out.printf(\"%d is a factor of 99\"\
    , n);\n            }\n        } catch (NumberFormatException ex) {\n         \
    \   System.out.println(\"Invalid number!\");\n        } catch (ArrayIndexOutOfBoundsException\
    \ ex) {\n            System.out.println(\"Number is missing!\");\n        }\n\
    \    } // main 方法结束\n} // 类结束\n```\n\n在上述代码中，如果没有传递参数（`args[0]` 不可用），`try` 块将抛出\
    \ `ArrayIndexOutOfBoundsException`。如果 `args[0]` 中的字符串无法转换为整数，抛出的异常是 `NumberFormatException`。\n\
    \n### 多捕获 (Multi-Catch)\n\n在 Java 7 之前，每个 `catch` 块只能捕获一种异常类型。因此，每我们需要处理多个特定异常但对所有异常采取相同行动时，必须有多个包含相同代码的\
    \ `catch` 块。\n\n在下面的代码中，我们需要处理两个不同的异常但对两者都采取相同的行动。因此在 Java 6.0 中我们需要两个不同的 `catch`\
    \ 块。\n\n```java\ntry {\n    int v = Integer.parseInt(num);\n    int result = 100\
    \ / v;\n}System.out.println(result);\n} catch (NumberFormatException ex) {\n \
    \   // 采取行动\n} catch (ArithmeticException ex) {\n    // 采取行动\n}\n```\n\n从 Java\
    \ 7.0 开始，可以通过在 `catch` 块用 `|`（管道）符号分隔异常，允许单个 `catch` 块捕获多个异常。\n\n```java\ntry\
    \ {\n    int v = Integer.parseInt(num);\n    int result = 100 / v;\n}System.out.println(result);\n\
    } // 多捕获\ncatch (NumberFormatException | ArithmeticException ex) {\n    // 采取行动\n\
    }\n```\n\n处理多个异常类型的 `catch` 块在编译器生成的字节码中不会重复；字节码中没有异常处理器的复制。\n\n### finally 块\
    \ (Finally Block)\n\n- 用于执行在 `try/catch` 之后必须执行的代码。\n\n"
- fmt: "\n`block` has completed and before the code following `try/catch` is executed.\n\
    \n- Can be used to perform any operation that must be done before you leave `try/catch`\
    \ block – clean up code.\n- `finally` clause is optional. If it is given, it must\
    \ be given either after `catch` block(s) if exists or after `try` block.\n\n```java\n\
    try {\n    // code\n}\nfinally {\n    // code\n}\n```\n\nThe following snippet\
    \ demonstrates how to use `finally` block.\n\n```java\npublic void m1() {\n  \
    \  try {\n        // code\n    }\n    catch(NumberFormatException ex) {\n    \
    \    // exception code\n    }\n    finally {\n        // place cleanup code\n\
    \    }\n}\n```\n\nThe following are the cases in which the `finally` block in\
    \ the above snippet is executed.\n\n- When `try` block is successfully executed\
    \ without any exceptions then control goes to `finally` block after `try` block.\n\
    - When `NumberFormatException` is thrown in `try` block, the exception is handled\
    \ by `catch` block and then control goes to `finally` block.\n- When `try` block\
    \ throws an uncaught exception then also control goes to `finally` block and then\
    \ program is terminated. But in this case the program is terminated after `finally`\
    \ block is executed.\n\nRun code below and see the output (shown below) to understand\
    \ flow of control with `try`, `catch` and `finally` blocks.\n\n```java\n01: public\
    \ class FinallyTest {\n02: public static void main(String[] args) {\n03: method(\"\
    5\");\n04: method(\"abc\");\n05: method(\"0\");\n06: } // end of main()\n07:\n\
    08: public static void method(String value){\n09: try{\n10: int n = Integer.parseInt(value);\n\
    11: System.out.println( 100 / n);\n12: }\n13: catch(NumberFormatException ex)\
    \ {\n14: System.out.println(\"Invalid number!\");\n15: }\n16: finally {\n17: System.out.println(\"\
    Finally block.\");\n18: }\n19:\n20: System.out.println(\"Method Completed\");\n\
    21: } // end of method()\n22: }\n```\n\n**Output:**\n```\nFinally block.\nMethod\
    \ Completed\nInvalid number!\nFinally block.\nMethod Completed\nFinally block.\n\
    Exception in thread \"main\" java.lang.ArithmeticException: / by zero\nat FinallyTest.method(FinallyTest.java:13)\n\
    at FinallyTest.main(FinallyTest.java:8)\n```\n\nException may be thrown by JVM\
    \ or by methods in classes (API). In the above program `NumberFormatException`\
    \ is thrown by `parseInt()` of `Integer` class, which is Java API. Exceptions\
    \ `ArithmeticException` and `ArrayIndexOutOfBoundsException` are thrown by JVM.\n\
    \n## Types of Exceptions – checked and unchecked\n\nThere are two types of exceptions\
    \ - Unchecked or Implicit exceptions and Checked or Explicit exceptions.\n\n###\
    \ Unchecked Exceptions\nHandling unchecked exceptions is not mandatory. Some of\
    \ these exceptions are thrown by JVM and others by Java API. However, you may\
    \ want to handle unchecked exceptions to prevent program from getting terminated\
    \ and handle exceptional events. All exceptions that extend `RuntimeException`\
    \ class are unchecked exceptions.\n\n### Checked Exceptions\nChecked exceptions\
    \ are thrown by methods. These exceptions must be handled by the code calling\
    \ the method using `try` and `catch` blocks. In method declaration, we have to\
    \ specify the checked exceptions that the method is likely to throw using `throws`\
    \ clause. Methods that might throw a checked exception must be called from `try`\
    \ block where `catch` block handles the checked exception. Or the calling method\
    \ must declare checked exception that might be thrown by called method in its\
    \ `throws` clause.\n\n**NOTE:** Checked exceptions are always thrown from methods\
    \ and never by JVM.\n\nThe following code snippet shows how to handle or propagate\
    \ checked exceptions.\n\n```java\n01: public class TestChecked {\n02: public void\
    \ m1() throws AmountException {\n03: // code\n04: }\n05: public void m2() throws\
    \ AmountException {\n06: m1();\n07: }\n08: public void m3() {\n09: try {\n10:\
    \ m1();\n11: }\n12: catch(AmountException ex){\n13: }\n14: }\n15: }\n```\n\nThe\
    \ following are the points related to above program:\n- Method `m1()` is likely\
    \ to throw a checked exception - `AmountException` and it must be handled by methods\
    \ calling `m1()`.\n- Method `m2()` compiles even though it calls `m1()` without\
    \ handling `AmountException` as it declares `AmountException` in its `throws`\
    \ clause.\n- Method `m3()` handles `AmountException` that is likely to be thrown\
    \ by `m1()` using `try` and `catch` blocks.\n\n### Invalid vs. Valid order of\
    \ catch blocks\nUnderstanding the hierarchy of exception classes is important.\
    \ Most specific exception must be handled first and less specific. The following\
    \ snippet shows invalid order for exception handling and will result in compilation\
    \ error.\n\n```java\ntry{\n…\n}\ncatch(Exception ex) { }\ncatch(RuntimeException\
    \ ex) { }\ncatch(NumberFormatException ex) { }\n```\nAny exception is a match\
    \ to `Exception` class. So giving catch block with `Exception` first will not\
    \ allow other catch blocks to get control.\n\nThe following is valid order of\
    \ catch blocks. Most specific exception – `NumberFormatException` is handled first\
    \ and most general, `Exception` is handled last.\n\n```java\ntry{\n…\n}\ncatch(NumberFormatException\
    \ ex){ }\ncatch(RuntimeException ex){ }\ncatch(Exception ex) { }\n```\n\n### Defining\
    \ new exception\nIt is possible to create a new exception by creating a class.\
    \ User-defined exceptions can be thrown and caught like ready-made exceptions.\
    \ However, unlike JVM exceptions, which are thrown by Java Runtime, user-defined\
    \ exceptions are to be explicitly thrown by methods.\n\nTo create a user-defined\
    \ exception, create a class that extends `Exception` class directly or indirectly.\
    \ The exception class need not create any method of its own since it inherits\
    \ methods of `Exception` class. The following code shows how create a user-defined\
    \ exception and how to throw and catch.\n\n```java\n01: class StackFullException\
    \ extends Exception {\n02: public StackFullException() {\n03: super(\"Stack is\
    \ full\"); // exception message\n04: }\n05: }\n06: class Stack {\n07: public void\
    \ push(int v) throws StackFullException {\n08: if ( condition )\n09: throw new\
    \ StackFullException();\n10: }\n11: }\n```\n\nUser-defined exception `StackFullException`\
    \ will be thrown by `push` method in case of an error. Any code calling `push`\
    \ method must make sure it catches `StackFullException` as it is given in `throws`\
    \ clause of `push` method. The following snippet shows how to handle `push` method.\n\
    \n```java\ntry {\n    s.push(10);\n    …\n}\ncatch(StackFullException ex) {\n\
    \    System.out.println (ex.getMessage());\n}\n```\n\n### Exception class\nThe\
    \ following are the methods available in `Exception` class. In fact, all these\
    \ methods are actually derived from `Throwable` class and `Exception` class has\
    \ no methods of its own.\n\n| Method | Meaning |\n| :--- | :--- |\n| `getMessage()`\
    \ | Returns description of the exception. The message is passed to `Exception`\
    \ class by its subclass using constructor of `Exception` class. |\n| `printStackTrace()`\
    \ | Displays the stack trace providing all methods that are invoked from the beginning\
    \ to the point of error. |\n"
