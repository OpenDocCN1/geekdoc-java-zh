    ## RandomAccessFile 类

    - 代表随机访问文件，你可以在流的任何位置读取和写入数据。

    - `RandomAccessFile` 以二进制格式写入数据。当你写入一个整数时，它会将整数的内存镜像原样地写入文件。因此，无论实际值如何，它都会为整数写入
