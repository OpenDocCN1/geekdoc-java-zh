    Java Student’s Guide – Object-Oriented Programming II\n\n## EXCEPTION HANDLING\n\
    \n- An `Exception` is an abnormal condition (runtime error).\n- When an exceptional\
    \ event occurs, Java throws an exception.\n- An exception is an object of a class\
    \ that is created from `java.lang.Exception` class.\n- Depending upon the error\
    \ (exceptional event), an object of exception class is created and thrown.\n-\
    \ If the exception is not handled then program is terminated abnormally.\n- Exception\
    \ can be thrown by Java Runtime System or by the code.\n\nThe following code demonstrates\
    \ what happens when you run code that throws an exception.\n\n```java\npublic\
    \ class Test {\n    public static void main(String[] args) {\n        int n;\n\
    \        n = Integer.parseInt( args[0]);\n        if ( 99 % n == 0 ) {\n     \
    \       System.out.printf(\"%d is a factor of 99\", n);\n        }\n    }\n}\n\
    ```\n\nIf the above program is run with a command line parameter that cannot be\
    \ converted to int (such as `abc`) then exception `NumberFormatException` is thrown.\n\
    \n```text\njava Test abc\nException in thread \"main\" java.lang.NumberFormatException:\
    \ For input string: \"ABC\"\nat java.lang.NumberFormatException.forInputString(Unknown\
    \ Source) …\n```\n\nWhen an exception is thrown, program is terminated at the\
    \ line that caused the exception.\n\nThe following are the keywords related to\
    \ exception handling in Java.\n\n| Keyword | Meaning |\n| :--- | :--- |\n| `try`\
    \ | Specifies the block in which you want to monitor for exceptions. |\n| `catch`\
    \ | Catches an exception and takes necessary action. |\n| `finally` | Contains\
    \ the code that must be executed before leaving `try` block. |\n| `throws` | Specifies\
    \ the exceptions that a method might throw. |\n| `throw` | Throws the given exception.\
    \ |\n\nThe following is the general syntax for `try`, `catch` and `finally` blocks.\n\
    \n```java\ntry {\n    // try block\n}\ncatch(<exceptiontype> <parameter>) {\n\
    \    // catch block\n}\nfinally {\n    // finally block\n}\n```\n\n**NOTE:** After\
    \ `try` block either `catch` or `finally` or both may be given. But you cannot\
    \ avoid both.\n\nSrikanth Technologies\nJava Student’s Guide – Object-Oriented\
    \ Programming II\n\n### Handling exception using try and catch\n\nIf you want\
    \ to handle the exception that is likely to be thrown then place the code in `try`\
    \ block and handle the exception in `catch` block as shown below.\n\n```java\n\
    public class Test {\n    public static void main(String[] args) {\n        int\
    \ n;\n        try{\n            n = Integer.parseInt(args[0]);\n            if\
    \ ( 99 % n == 0 )\n                System.out.printf(\"%d is a factor of 99\"\
    , n);\n        }\n        catch(NumberFormatException ex) {\n            System.out.println(\"\
    Invalid number!\");\n        }\n    } // end of main\n} // end of class\n```\n\
    \n### Handling multiple exceptions\n\nIt is also possible to handle more than\
    \ one exception. However note that a `try` block can throw only one exception\
    \ at a time. Once an exception is thrown.\n\n```java\npublic class Test {\n  \
    \  public static void main(String[] args) {\n        int n;\n        try{\n  \
    \          n = Integer.parseInt(args[0]);\n            if ( 99 % n == 0 )\n  \
    \              System.out.printf(\"%d is a factor of 99\", n);\n        }\n  \
    \      catch(NumberFormatException ex) {\n            System.out.println(\"Invalid\
    \ number!\");\n        }\n        catch(ArrayIndexOutOfBoundsException ex) {\n\
    \            System.out.println(\"Number is missing!\");\n        }\n    } //\
    \ end of main\n} // end of class\n```\n\nIn the code above, `try` block will throw\
    \ `ArrayIndexOutOfBoundsException` if no parameter is passed (as `args[0]` is\
    \ not available). The other exception that will be thrown if string in `args[0]`\
    \ cannot be converted to integer is `NumberFormatException`.\n\n### Multi-Catch\n\
    \nPrior to Java 7, we had to catch only one exception type in each `catch` block.\
    \ So whenever we needed to handle more than one specific exception, but take the\
    \ same action for all exceptions, then we had to have more than one catch block\
    \ containing the same code. \n\nIn the following code, we have to handle two different\
    \ exceptions, but take the same action for both. So we need two different catch\
    \ blocks as of Java 6.0.\n\n```java\ntry {\n    int v = Integer.parseInt(num);\n\
    \    int result = 100 / v;\n}System.out.println(result);\ncatch(NumberFormatException\
    \ ex) {\n    // take action\n}\ncatch(ArithmeticException ex) {\n    // take action\n\
    }\n```\n\nStarting from Java 7.0, it is possible for a single catch block to catch\
    \ multiple exceptions by separating exception with `|` (pipe) symbol in `catch`\
    \ block.\n\n```java\ntry {\n    int v = Integer.parseInt(num);\n    int result\
    \ = 100 / v;\n}System.out.println(result);\n} // multi-catch\ncatch(NumberFormatException\
    \ | ArithmeticException ex) {\n    // take action\n}\n```\n\nA catch block that\
    \ handles multiple exception types creates no duplication in the bytecode generated\
    \ by the compiler; the bytecode has no replication of exception handlers.\n\n\
    ### Finally Block\n\n- Used to execute code that is to be executed after a `try/catch`\n"
