    \ 和 `netSalary()` 来访问。\n\n### 类 vs 对象 (Class vs. Object)\n类是对相似对象的集合描述。类定义了要封装的实例变量和方法。类表示一类对象。它是创建对象的蓝图。例如：`Employee`、`Product`、`Student`\
