  trans: "\n[content]\n\n`Date` 类的对象主要与 `DateFormat` 类配合，因为它的 `format()` 方法期望一个 `Date`\
    \ 类的对象。\n\n## DateFormat 类\n\n`DateFormat` 是一个用于格式化日期的抽象类。你可以使用以下方法之一获取 `DateFormat`\
    \ 类的实例来格式化日期或时间：\n\n- `DateFormat getDateInstance()`\n- `DateFormat getDateInstance(int\
    \ style)`\n- `DateFormat getTimeInstance()`\n- `DateFormat getTimeInstance(int\
    \ style)`\n\n参数 `style` 可以是 `DEFAULT`、`SHORT`、`MEDIUM`、`LONG` 或 `FULL`。`format()`\
    \ 方法用于格式化日期或时间。它接受一个 `Date` 类的对象作为参数。\n\n## NumberFormat 类\n\n- 它是所有数字格式的抽象基类。\n\
    - 提供格式化和解析数字的接口。\n- 支持本地化（locale）。\n\n- `static NumberFormat getCurrencyInstance()`\n\
    - `static NumberFormat getCurrencyInstance(Locale inLocale)`\n- `static NumberFormat\
    \ getInstance()`\n- `static NumberFormat getInstance(Locale inLocale)`\n\n## SimpleDateFormat\
    \ 类\n\n它用于使用自定义格式格式化日期和时间。它是 `DateFormat` 类的一个具体子类。可以使用以下字符来格式化日期和时间。完整的格式字符列表请参阅\
    \ Java 文档。\n\n| Format | 表示的内容 | 示例 |\n| :--- | :--- | :--- |\n| y | 年份 | 1996;\
    \ 96 |\n| M | 年中的月份 | July; Jul; 07 |\n| W | 月中的周 | 2 |\n| d | 月中的日 | 10 |\n|\
    \ H | 天中的小时 (0-23) | 0 |\n| h | 上午/下午的小时 (1-12) | 12 |\n| m | 小小时分钟 | 30 |\n|\
    \ s | 分钟秒 | 55 |\n\n```\nimport java.text.DateFormat;\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\n\npublic class DateFormatExample {\n    public static\
    \ void main(String[] args) {\n        Date d = new Date();\n\n        DateFormat\
    \ df = DateFormat.getTimeInstance(DateFormat.FULL);\n        System.out.println(df.format(d));\n\
    \n        DateFormat tf = DateFormat.getDateInstance(DateFormat.FULL);\n     \
    \   System.out.println(tf.format(d));\n\n        SimpleDateFormat sdf = new SimpleDateFormat(\"\
    d-MMM-yy HH:mm:ss\");\n        System.out.println(sdf.format(d));\n    }\n}\n\
    ```\n\n## 新的日期时间 API\n\n- 日时间 API 使用 `ISO-8601` 定义的日历系统作为默认日历。\n- 核心类包括 `LocalDate`、`LocalTime`、`LocalDateTime`、`ZonedDateTime`\
    \ 和 `OffsetDateTime`。\n- 日时间 API 中的大多数类创建的对象都是不可变的（immutable）。这使得对象是线程安全的。\n-\
    \ 包 `java.time`、`java.time.format`、`java.time.zone` 包含了新类。\n\n### DayOfWeek 枚举\n\
    \n`DayOfWeek` 枚举由七个常量组成，描述星期：`MONDAY` 到 `SUNDAY`。`DayOfWeek` 常量的整数值范围从 1（周一）到\
    \ 7（周日）。\n\n### Month 枚举\n\n`Month` 枚举包含十二个月的常量。每个 `Month` 常量的整数值对应月份（`January`\
    \ 到 `December`）。\n\n### LocalDate 类\n\n`LocalDate` 表示一个不包含时间的日期。它用于跟踪重大事件，例如出生日期。\n\
    \n```java\nLocalDate date = LocalDate.of(1998, Month.OCTOBER, 24);\nLocalDate\
    \ newdate = date.plusDays(10);\nSystem.out.println(newdate);\n\nLocalDate dob\
    \ = LocalDate.parse(\"1998-09-28\");\nLocalDate dob2 = LocalDate.parse(\"28-09-1998\"\
    , DateTimeFormatter.ofPattern(\"dd-MM-yyyy\"));\nSystem.out.println(dob2);\n```\n\
    \n#### LocalDate 方法\n\n- `int get(TemporalField field)`: 从此日期获取指定字段字段的值。\n- `int\
    \ getOfMonth()`: 获取月中的日。\n- `DayOfWeek getOfWeek()`: 获取星期几，这是一个 `DayOfWeek` 枚举。\n\
    - `int getOfYear()`: 获取一年中的天数。\n- `int getMonthValue()`: 获取一年中的月份字段（1 到 12）。\n\
    - `int getYear()`: 获取年份字段。\n- `LocalDate minusDays(long days)`: 返回一个减去 `days`\
    \ 天的 `LocalDate` 副本。\n- `LocalDate minusMonths(long months)`: 返回一个减去 `months`\
    \ 月的 `LocalDate` 副本。\n- `LocalDate minusYears(long years)`: 返回一个减去 `years` 年的\
    \ `LocalDate` 副本。\n- `LocalDate plusDays(long days)`: 返回一个增加 `days` 天的 `LocalDate`\
    \ 副本。\n- `LocalDate plusMonths(long months)`: 返回一个增加 `months` 月的 `LocalDate` 副本。\n\
    - `LocalDate plusYears(long years)`: 返回一个增加 `years` 年的 `LocalDate` 副本。\n\n####\
    \ LocalDate 静态方法\n\n- `LocalDate now()`: 从默认时区的系统时钟获取当前日期。\n- `LocalDate of(int\
    \ year, int month, int dayOfMonth)`: 根据年、月、日获取 `LocalDate` 实例。\n- `LocalDate parse(CharSequence\
    \ text)`: 从如 `2007-12-03` 的文本字符串获取 `LocalDate` 实例。\n- `LocalDate parse(CharSequence\
    \ text, DateTimeFormatter formatter)`: 使用特定的 `DateTimeFormatter` 从文本字符串获取 `LocalDate`\
    \ 实例。\n\n## LocalTime 类\n\n`LocalTime` 表示不带时区的时间。\n\n```java\nLocalTime now =\
    \ LocalTime.now();\nLocalTime singtime = LocalTime.now(ZoneId.of(\"Asia/Singapore\"\
    ));\n```\n\n#### LocalTime 方法\n\n- `int getHour()`: 获取全小时字段。\n- `int getMinute()`:\
    \ 获取小时分钟字段。\n- `int getSecond()`: 获取分钟秒字段。\n- `boolean isAfter(LocalTime other)`:\
    \ 检查此时间是否在指定的 `LocalTime` 之后。\n- `boolean isBefore(LocalTime other)`: 检查此时间是否在指定的\
    \ `LocalTime` 之前。\n- `LocalTime minusHours(long hours)`: 返回一个减去 `hours` 小时的 `LocalTime`\
    \ 副本。\n- `LocalTime minusMinutes(long minutes)`: 返回一个减去 `minutes` 分的 `LocalTime`\
    \ 副本。\n- `LocalTime minusSeconds(long seconds)`: 返回一个减去 `seconds` 秒的 `LocalTime`\
    \ 副本。\n\n[/content]\n"
- fmt: "\nthe specified number of hours added.\n\n`LocalTime.plusMinutes`\nReturns\
    \ a copy of this `LocalTime` with\n`(long minutesToAdd)`\nthe specified number\
    \ of minutes added.\n\n`LocalTime.plusSeconds`\nReturns a copy of this `LocalTime`\
    \ with\n`(long secondstoAdd)`\nthe specified number of seconds added.\n\n`int`\n\
    `toSecondOfDay()`\nExtracts the time as seconds of day, from `0` to `24 * 60 *\
    \ 60 - 1`.\n\nSrikanth Technologies\nJava Student’s Guide – Library-I\n19\n\n\
    ## Static Method\n\n### Meaning\n\n`LocalTime.now()`\nObtains the current time\
    \ from the system clock in the default time-zone.\n\n`LocalTime.now`\nObtains\
    \ the current time from the `(ZoneId zone)` system clock in the specified time-zone.\n\
    \n`LocalTime.of(int hour, int min, int sec)`\nObtains an instance of `LocalTime`\
    \ from an hour, minute and second.\n\n`LocalTime.parse(CharSequence text)`\nObtains\
    \ an instance of `LocalTime` from a `text` string such as `10:15`.\n\n`LocalTime.parse(CharSequence\
    \ text, DateTimeFormatter formatter)`\nObtains an instance of `LocalTime` from\
    \ a `text` string using a specific formatter `formatter`.\n\n## LocalDateTime\
    \ class\nThis class handles both date and time, without a time zone. This class\
    \ is used to represent date `(month-day-year)` together with time `(hour-minute-second-nanosecond)`\
    \ and is, in effect, a combination of `LocalDate` with `LocalTime`.\n\n## YearMonth,\
    \ MonthDay and Year classes\n- `YearMonth` represents the month of a specific\
    \ year.\n- `MonthDay` represents the day of a particular month, such as New Year's\
    \ Day on January 1.\n- `Year` represents a year.\n\nSrikanth Technologies\nJava\
    \ Student’s Guide – Library-I\n20\n\n## Other classes\n- `ZoneId` specifies a\
    \ time zone identifier and provides rules for converting between an `Instant`\
    \ and a `LocalDateTime`.\n- `ZoneOffset` specifies a time zone offset from Greenwich/UTC\
    \ time.\n- `ZonedDateTime` handles a date and time with a corresponding time zone\
    \ with a time zone offset from Greenwich/UTC.\n- `OffsetDateTime` handles a date\
    \ and time with a corresponding time zone offset from Greenwich/UTC, without a\
    \ time zone ID.\n- `OffsetTime` handles time with a corresponding time zone offset\
    \ from Greenwich/UTC, without a time zone ID.\n\n## ChronoUnit Enum\n- The [`ChronoUnit`](http://docs.oracle.com/javase/8/docs/api/java/time/temporal/ChronoUnit.html)\
    \ enum provides a set of standard units based on date and time, from milliseconds\
    \ to millenia.\n- Available constants are `DAYS`, `HOURS`, `MICROS`, `MILLENNIA`,\
    \ `MILLIS`, `MINUTES`, `MONTHS`, `SECONDS`, `WEEKS`, `YEAR`.\n\n## AgeCalculator.java\n\
    ```java\nimport java.time.LocalDate;\nimport java.time.Period;\nimport java.time.temporal.ChronoUnit;\n\
    import java.util.Scanner;\n\npublic class AgeCalculator {\n    public static void\
    \ main(String[] args) {\n        System.out.print(\"Enter DOB [yyyy-mm-dd]:\"\
    );\n        Scanner s = new Scanner(System.in);\n        String dobstr = s.nextLine();\n\
    \        LocalDate dob = LocalDate.parse(dobstr);\n        LocalDate now = LocalDate.now();\n\
