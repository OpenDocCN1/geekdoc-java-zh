  trans: "\n\n```java\nvoid addFirst(Object o) 将指定的元素插入到列表开头。\nvoid addLast(Object\
    \ o) 将指定的元素添加到此列表的末尾。\nObject getFirst() 返回此列表的第一个元素。\nObject getLast() 返回此列表的最后一个元素。\n\
    Object removeFirst() 并返回此列表的第一个元素。\nObject removeLast() 删除并返回此列表的最后一个元素。\n```\n\
    \n**注意：** `PriorityQueue` 类实现了 `Queue` 接口，并按照自然顺序对元素排序。`PriorityQueue` 的元素必须是可比较的——实现\
    \ `Comparable` 接口，该接口包含 `compareTo()` 方法。\n\n# Vector 类\n\n- `Vector` 是遗留类之一，但在\
    \ 1.2 版本中被重建以实现 `List` 接口。\n- 它保留了 `Vector` 类的旧方法，如 `addElement()` 等（见下列表），并提供了\
    \ `List` 接口的方法。\n- 它是同步的（`synchronized`）。如果多个线程使用同一个 vector，应该考虑使用它而不是 `ArrayList`。\n\
    \n| 方法 | 含义 |\n| :--- | :--- |\n| `void addElement (Object obj)` | 将组件添加到 `vector`\
    \ 的末尾。 |\n| `Object elementAt (int index)` | 返回指定索引处的元素。 |\n| `void removeElementAt\
    \ (int index)` | 删除指定索引处的组件。 |\n| `void insertElementAt (Object obj, int index)`\
    \ | 将指定对象作为组件插入到此 vector 的指定索引处。 |\n| `void setElementAt (Object obj, int index)`\
    \ | 将指定处的组件设置为指定的对象。 |\n| `Enumeration elements()` | 返回元素的枚举器（enumeration）。 |\n\
    \n## Enumeration 接口\n\n- 允许你访问 `Vector` 的元素。\n- 新的实现应该考虑使用 `Iterator` 代替 `Enumeration`。\n\
    \n| 方法 | 含义 |\n| :--- | :--- |\n| `boolean hasMoreElements()` | 如果包含更多元素则返回 true。\
    \ |\n| `Object nextElement()` | 返回此枚举器的下一个元素。 |\n\n## 类层次结构概览\n\n```\n<<interface>>\
    \ Collection\n<<interface>> Set\n<<interface>> Queue\n<<interface>> List\n<<interface>>\
    \ SortedSet\nVector\nLinkedList\nPriorityQueue\nTreeSet\nArrayList\nStack (extends)\n\
    LinkedHashSet (implements)\n```\n\n## Stack 类\n\n- 代表一个后进先出（LIFO）的对象栈。\n- 继承自\
    \ `Vector` 类并提供了以下与栈相关的额外方法。\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `boolean empty()`\
    \ | 测试此栈是否为空。 |\n| `Object peek()` | 返回栈顶对象但不将其移除。 |\n| `Object pop()` | 移除并返回此栈顶的对象。\
    \ |\n| `Object push(Object item)` | 将一个项推入此栈的栈顶。 |\n| `int search(Object o)` |\
    \ 返回对象在栈中的位置（从 1 开始）。 |\n\n**练习**：接受用户输入的文件名，并反序显示文件内容——第一行在最后。\n\n## Map 接口\n\
    \n- 允许将键映射到值。\n- map 不允许重复的键。每个键最多映射到一个值。\n- `HashMap` 和 `HashTable` 实现了 `Map`\
    \ 接口。\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `void clear()` | 清空 map。 |\n| `boolean\
    \ containsKey(Object key)` | 如果指定的键存在则返回 true。 |\n| `Object get(Object key)` |\
    \ 返回键的值。 |\n| `boolean isEmpty()` | 如果此 map 为空则返回 true。 |\n| `Set keySet()` |\
    \ 返回此 map 中包含的键的集合视图。 |\n| `Object put (Object key, Object value)` | 键和值。 |\n\
    | `Object remove (Object key)` | 如果存在，则从此 map 中移除该键的映射。 |\n| `boolean remove (Object\
    \ key, Object value)` | 如果键包含给定的值，则移除该键的值。 |\n| `int size()` | 返回键的数量。 |\n| `Collection\
    \ values()` | 返回此 map 中包含的值的集合视图。 |\n| `void forEach(BiConsumer<K,V>)` | 对每个元素执行指定的操作。\
    \ |\n| `V getOrDefault(Object key, V defaultValue)` | 返回键的值，如果未找到键则返回 `defaultValue`。\
    \ |\n| `V putIfAbsent(K key, V value)` | 如果键未与值关联，则放入值并返回 null，否则返回当前值。 |\n| `V\
    \ replace(K key, V value)` | 将给定 `key` 的值替换为 `value`。 |\n| `boolean replace(K\
    \ key, Object oldValue, V newValue)` | 如果键包含旧值，则将键的值替换为新值。 |\n\n## HashMap 类\n\
    \n- 该类实现了 `Map` 接口。\n- 不保证键的顺序。\n- `HashMap()`\n- `HashMap(Map)`\n\n**注意：** `HashTable`\
    \ 类与 `HashMap` 类相同，但它是同步的。`LinkedHashMap` 类继承自 `HashMap` 类并按照插入顺序排列键。\n\n## SortedMap\
    \ 接口\n\n此接口扩展了 `Map` 接口以提供排序后的键。以下是 `SortedMap` 接口相比 `Map` 接口增加的方法。\n\n| 方法 |\
    \ 含义 |\n| :--- | :--- |\n| `Object first()` | 返回第一个元素。 |\n| `Object last()` |\
    \ 返回最后一个元素。 |\n| `SortedSet headMap(Object toKey)` | 返回到 `toKey` 的部分。 |\n| `SortedSet\
    \ tailMap(Object fromKey)` | 返回从 `fromKey` 开始的部分。 |\n| `SortedSet subMap(Object\
    \ fromKey, Object toKey)` | 返回从 `fromKey` 到 `toKey` 的元素。 |\n\n## TreeMap 类\n\n\
    - 该类实现了 `SortedMap` 接口。它按排序排列键。\n- 键的顺序是自然顺序或由 `Comparator` 指定。\n- `TreeMap()`\n\
    - `TreeMap(Comparator)`\n\n```java\nimport java.util.HashMap;\nimport java.util.LinkedHashMap;\n\
    import java.util.TreeMap;\n\npublic class MapDemo {\n    public static void main(String[]\
    \ args) {\n        HashMap<String, String> hm = new HashMap<>();\n        hm.put(\"\
