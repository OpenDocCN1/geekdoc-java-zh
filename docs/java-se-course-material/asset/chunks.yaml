    \ super class from the constructor of subclass.\n\nBut, when there is no default\
    \ constructor in superclass, we must explicitly call the constructor of superclass\
    \ using `super` keyword and required parameters (as we did in `Faculty` class).\n\
    \n### @Override Annotation\n\nAnnotation `@Override` indicates that a method declaration\
    \ in subclass is intended to override a method declaration in a superclass.\n\n\
    If a method annotated with this annotation does not override a superclass method,\
    \ compiler generates an error message.\n\n### Overriding Methods\n\nWhen a method\
    \ in the subclass has the same name and signature of a method in superclass, the\
    \ method in subclass is said to be overriding the method in superclass.\n\nMethod\
    \ `print()` of `Person` class is overridden in subclass `Faculty`.\n\nSrikanth\
    \ Technologies\n\nJava Student’s Guide - Object-Oriented Programming\n\n22\n\n\
    **Rules related to overriding**:\n- The arguments list must match exactly. Otherwise\
    \ it becomes overloading.\n- Return type must be same as, or subclass of, the\
    \ return type of original.\n- Access level CANNOT be more restrictive than the\
    \ original.\n- Final method cannot be overridden.\n- Static method cannot be overridden.\n\
    - Only inherited methods can be overridden.\n- Private methods cannot be inherited.\n\
    \n### OVERLOADING VS. OVERRIDING\n\nWhen you create a method in subclass with\
    \ the same name as superclass but different set of parameters, it is called overloading\
    \ not overriding.\n\nThe following example shows the difference between overriding\
    \ and overloading.\n\n```java\n01: class C1 {\n02: public void m1(String msg)\
    \ {\n03: }\n04: public void m2(int n) {\n05: }\n06: }\n\n07: class C2 extends\
    \ C1 {\n08: // overrides m1() in class C1\n09: public void m1() {\n10: }\n11:\
    \ // overloads m2() in class C1\n12: public void m2(String n) {\n13: }\n14: }\n\
    ```\n\n### Using super keyword to access superclass\n\nThe `super` keyword in\
    \ subclass is used to access superclass. `super` can be used to:\n- Access a method\
    \ of superclass that is overridden by a member in subclass.\n- Invoke the constructor\
    \ of superclass from the constructor of subclass.\n- Refer only to the immediate\
    \ super class in the hierarchy.\n\n**Note**: While calling the constructor of\
    \ the superclass from subclass’s constructor, the call must be the first statement.\n\
    \n### “HAS A” RELATIONSHIP\n\nWhen a class contains a variable that refers to\
    \ another class, the class is said to have “Has A” relationship with the other\
    \ class.\n\nIn the following example, `Customer` class has “has a” relationship\
    \ with `Address` as it has a variable of class `Address`.\n\n```java\nclass Address\
    \ {\n    // instance variables & methods\n}\n\nclass Customer {\n    private Address\
    \ homeaddress;\n    // other variables and methods\n}\n```\n\nSrikanth Technologies\n\
    \n![](index-65_1.jpg)\n\nJava Student’s Guide - Object-Oriented Programming\n\n\
    24\n\n## DOWNCASTING AND UPCASTING\n\nJava allows an object reference of superclass\
    \ to refer to an object of subclass. This is the heart of runtime-polymorphism.\n\
    \nSuperclass is more general form of subclass. Subclass is more specific form\
    \ of superclass. `Person` is more general form of `Student`. In other words, a\
    \ `Student` is always a `Person`. So wherever Java expects `Person`, a `Student`\
    \ can be used.\n\n**Upcasting** is casting an object to a class higher in the\
    \ inheritance tree. When an object of `Faculty` is assigned to `Person`, it is\
    \ called as upcasting. Upcasting is implicit in Java.\n\n```java\nFaculty f =\
    \ new Faculty(\"Hunter\",\"hunter@servlets.com\",\"servlets,jsp\");\nPerson p\
    \ = f; // upcasting is done implicitly\nPerson p = (Person) f; // explicit casting\
    \ but NOT required\n```\n\nDowncasting is casting an object to a class down in\
    \ the hierarchy. When an object of `Person` is cast to `Faculty`, it is called\
    \ as **downcasting**. Downcasting must be done explicitly using type casting syntax\
    \ as follows:\n\n```java\nPerson p = new Faculty(\"Hunter\",\"hunter@servlets.com\"\
    ,\"Java\"); \nFaculty f = p; // doesn’t compile\n```\n\nSrikanth Technologies\n"
