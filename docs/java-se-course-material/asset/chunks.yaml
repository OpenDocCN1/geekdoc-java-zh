    The following are some of important components of this program.


    * Every function in Java must be inside a class, so we have to create class `Hello`
    to put `main()` function in it.

    * Function `main()` must be declared as `static`. It must return nothing (`void`)
    and it takes an array of type `String` as argument. All these are mandatory.

    * `System.out.println()` is used to print the given message.


    ## COMPILING AND RUNNING A JAVA PROGRAM


    To compile a java program, follow the steps given below:


    1. Go to command prompt using `programs` $\rightarrow$ `accessories` $\rightarrow$
    `command prompt`.

    2. Set `PATH` command of Windows to `bin` directory of `jdk` as follows at the
    command line.

    ```

    path c:\jdk\bin

    ```

    `PATH` is required as `javac.exe` and `java.exe` are in `bin` directory.

    3. Go to directory where `Hello.java` is saved (`c:\jdk\programs`).

    4. Compile Java program using `JAVAC.EXE` as follows:

    ```

    javac Hello.java

    ```

    5. Run java program as follows from the command line:

    ```

    java Hello

    ```


    **NOTE**: `PATH` command is used to inform Operating System (Windows) where it
    should search in the file system for executable files. By default, OS searches
    for executable files only in current directory. To see the current `PATH` setting,
    just type `PATH` at the command prompt.


