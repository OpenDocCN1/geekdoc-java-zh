- fmt: "\nAn object of `Date` class is used mainly with `DateFormat` class, as its\
    \ `format()` methods expect an object of `Date` class.\n\n## DateFormat class\n\
    \n`DateFormat` is an abstract class used to format dates. You get an instance\
    \ of `DateFormat` class to format either date or time by using one of the following\
    \ methods:\n\n- `DateFormat getDateInstance()`\n- `DateFormat getDateInstance(int\
    \ style)`\n- `DateFormat getTimeInstance()`\n- `DateFormat getTimeInstance(int\
    \ style)`\n\nArgument `style` could be `DEFAULT`, `SHORT`, `MEDIUM`, `LONG`, or\
    \ `FULL`. Method `format()` is used to format the date or time. It takes an object\
    \ of `Date` class as parameter.\n\n## NumberFormat Class\n\n- It is an abstract\
    \ base class for all number formats.\n- Provides the interface for formatting\
    \ and parsing numbers.\n- Supports locale.\n\n- `static NumberFormat getCurrencyInstance()`\n\
    - `static NumberFormat getCurrencyInstance(Locale inLocale)`\n- `static NumberFormat\
    \ getInstance()`\n- `static NumberFormat getInstance(Locale inLocale)`\n\n## SimpleDateFormat\
    \ class\n\nIt is used to format date and time using custom format. It is a concrete\
    \ subclass of `DateFormat` class. The following characters can be used to format\
    \ date and time. For complete list of format characters, see Java Documentation.\n\
    \n| Format | What it presents | Example |\n| :--- | :--- | :--- |\n| y | Year\
    \ | 1996; 96 |\n| M | Month in year | July; Jul; 07 |\n| W | Week in month | 2\
    \ |\n| d | Day in month | 10 |\n| H | Hour in day (0-23) | 0 |\n| h | Hour in\
    \ am/pm (1-12) | 12 |\n| m | Minute in hour | 30 |\n| s | Second in minute | 55\
    \ |\n\n```\nimport java.text.DateFormat;\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\n\npublic class DateFormatExample {\n    public static\
    \ void main(String[] args) {\n        Date d = new Date();\n\n        DateFormat\
    \ df = DateFormat.getTimeInstance(DateFormat.FULL);\n        System.out.println(df.format(d));\n\
    \n        DateFormat tf = DateFormat.getDateInstance(DateFormat.FULL);\n     \
    \   System.out.println(tf.format(d));\n\n        SimpleDateFormat sdf = new SimpleDateFormat(\"\
    d-MMM-yy HH:mm:ss\");\n        System.out.println(sdf.format(d));\n    }\n}\n\
    ```\n\n## New Date and Time API\n\n- The Date-Time API uses the calendar system\
    \ defined in `ISO-8601` as the default calendar.\n- The core classes are `LocalDate`,\
    \ `LocalTime`, `LocalDateTime`, `ZonedDateTime`, and `OffsetDateTime`.\n- Most\
    \ of the classes in the Date-Time API create objects that are `immutable`. This\
    \ makes objects thread safe.\n- Packages `java.time`, `java.time.format`, `java.time.zone`\
    \ contain new classes.\n\n### DayOfWeek Enum\n\nThe `DayOfWeek` enum consists\
    \ of seven constants that describe the days of the week: `MONDAY` through `SUNDAY`.\
    \ The integer values of the `DayOfWeek` constants range from 1 (Monday) through\
    \ 7 (Sunday).\n\n### Month Enum\n\n`Month` enum includes constants for the twelve\
    \ months. The integer value of each `Month` constant corresponds to the month\
    \ (`January` through `December`).\n\n### LocalDate class\n\n`LocalDate` represents\
    \ a date without a time. It is used to track a significant event, such as a birth\
    \ date.\n\n```java\nLocalDate date = LocalDate.of(1998, Month.OCTOBER, 24);\n\
    LocalDate newdate = date.plusDays(10);\nSystem.out.println(newdate);\n\nLocalDate\
    \ dob = LocalDate.parse(\"1998-09-28\");\nLocalDate dob2 = LocalDate.parse(\"\
    28-09-1998\", DateTimeFormatter.ofPattern(\"dd-MM-yyyy\"));\nSystem.out.println(dob2);\n\
    ```\n\n#### LocalDate Methods\n\n- `int get(TemporalField field)`: Gets the value\
    \ of the specified field from this date.\n- `int getOfMonth()`: Gets the day-of-month.\n\
    - `DayOfWeek getOfWeek()`: Gets the day-of-week, which is an `DayOfWeek` enum.\n\
    - `int getOfYear()`: Gets the day-of-year.\n- `int getMonthValue()`: Gets the\
    \ month-of-year field (1 to 12).\n- `int getYear()`: Gets the year field.\n- `LocalDate\
    \ minusDays(long days)`: Returns a copy of `LocalDate` with `days` subtracted.\n\
    - `LocalDate minusMonths(long months)`: Returns a copy of `LocalDate` with `months`\
    \ subtracted.\n- `LocalDate minusYears(long years)`: Returns a copy of `LocalDate`\
    \ with `years` subtracted.\n- `LocalDate plusDays(long days)`: Returns a copy\
    \ of `LocalDate` with `days` added.\n- `LocalDate plusMonths(long months)`: Returns\
    \ a copy of `LocalDate` with `months` added.\n- `LocalDate plusYears(long years)`:\
    \ Returns a copy of `LocalDate` with `years` added.\n\n#### LocalDate Static Methods\n\
    \n- `LocalDate now()`: Obtains the current date from the system clock in the default\
    \ time-zone.\n- `LocalDate of(int year, int month, int dayOfMonth)`: Obtains an\
    \ instance of `LocalDate` from a year, month and day.\n- `LocalDate parse(CharSequence\
    \ text)`: Obtains an instance of `LocalDate` from a text string such as `2007-12-03`.\n\
    - `LocalDate parse(CharSequence text, DateTimeFormatter formatter)`: Obtains an\
    \ instance of `LocalDate` from a text string using a specific `DateTimeFormatter`.\n\
    \n## LocalTime class\n\n`LocalTime` represents a time without a timezone.\n\n\
    ```java\nLocalTime now = LocalTime.now();\nLocalTime singtime = LocalTime.now(ZoneId.of(\"\
    Asia/Singapore\"));\n```\n\n#### LocalTime Methods\n\n- `int getHour()`: Gets\
    \ the hour-of-day field.\n- `int getMinute()`: Gets the minute-of-hour field.\n\
    - `int getSecond()`: Gets the second-of-minute field.\n- `boolean isAfter(LocalTime\
    \ other)`: Checks if this time is after the specified `LocalTime` time.\n- `boolean\
    \ isBefore(LocalTime other)`: Checks if this time is before the specified `LocalTime`\
    \ time.\n- `LocalTime minusHours(long hours)`: Returns a copy of `LocalTime` with\
    \ `hours` subtracted.\n- `LocalTime minusMinutes(long minutes)`: Returns a copy\
    \ of `LocalTime` with `minutes` subtracted.\n- `LocalTime minusSeconds(long seconds)`:\
    \ Returns a copy of `LocalTime` with `seconds` subtracted.\n"
