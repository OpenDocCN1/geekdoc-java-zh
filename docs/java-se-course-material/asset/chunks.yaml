    ## STATIC VARIABLES


    * A static variable, otherwise known as class variable, is a variable that is
    associated with class and not object.

    * Defined using `static` keyword.

    * Exist only once for the class.

    * Static variables that are declared as `final` are used as constants.


    **1001 ABC 40000**

    **1002 XYZ 50000**

    **1003 PQR 43000**

    5000 static variable - minbal


    ## STATIC METHODS


    * Static methods are same as normal methods except that they can be invoked with
    class name and need not invoked by object.

    * Defined using `static`.

    * Do not have `this` reference.

    * Static methods cannot invoke non-static methods and cannot access instance variables
    as they do not have access to object.

    * Generally used to access and manipulate static variables.


    ```java

    01: public class StaticTest {

    02: private int iv;

    03: private static int sv;

    04: public static void main(String[] args) {

    05: iv = 10; // not valid

    06: StaticTest obj = new StaticTest();

    07: obj.iv = 10; // valid as we use object to access iv

    08: }

    09: }

    ```


    ### Why main() is a static method?


    Function `main()` must be declared as static as it is called using class name
    by JVM. For example, when you invoke Java Hello it will be converted to a call
    to main as follows: `Hello.main(parameter)`. Other examples for static members
    are `Integer.parseInt()`, `Math.abs()` and `System.out`.


    **NOTE**: Java does not allow any function to be defined outside the class. Methods
    that can be used without creating an object are declared static, so that they
    can be called using class name. This also saves the time to create and release
    an object.


    ## FINAL VARIABLE


    * Java allows variables to be declared as final using `final` keyword.

    * Final variables cannot change value once they are assigned a value.

    * Final variables are generally static variables as it generally makes no sense
    to have the same value for a variable in each object of the class.

    * Final variables must be assigned a value before constructor of the object is
    completed.


    ```java

    class Account {

    public static final int MINBAL = 500;

    }

    ```


    Variable `MINBAL` is accessed using class name from outside the class as it is
    static and public variable. Minbal cannot be changed as it is final and initialized
    to 500.


    `System.out.println(Account.MINBAL);`


