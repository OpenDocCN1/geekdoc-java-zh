    - Each container has an associated layout manager which arranges the components
    added to container.

    - It determines the size and position of the components within a container.

    - Although components can provide size and alignment hints, a container''s layout
    manager has the final say on the size and position of the components within the
    container.

    - Layout manager manages all the differences between platforms thereby shielding
    programs from nitty-gritty of different platforms.

    - Method `setLayout()` is used to change the layout manager of a container.


    The following table shows different layout managers available in Java and how
    they work.


    ### Layout Manager Description


    | Layout Manager | Description |

    | :--- | :--- |

    | **FlowLayout** | Components are arranged from upper-left corner, left to right
    and top to bottom. If a row is not sufficient to place components then it starts
    a new row. |

    | **GridLayout** | Lays out components in two-dimensional grid. Each cell in the
    grid will be of the same size. Each component takes all the space available in
    cell. |

    | **GridBagLayout** | Divides the area into cells where width and height and other
    attributes of each component can be specified in terms of cells. |

    | **BorderLayout** | The entire area is divided into 5 areas– PAGE_START, PAGE_END,
    LINE_START, LINE_END and CENTER. We have to specify the area in which the component
    is to be placed. Default is CENTER. |

    | **CardLayout** | Allows a set of cards to be placed in such a way that only
    one card can be displayed at a time. |

    | **BoxLayout** | This layout manager places components either vertically or horizontally.
    |

    | **GroupLayout** | Allows horizontal and vertical dimensions to be handled separately.
    Designed primarily for GUI builder like Matisse in NetBeans. |


    ### Using FlowLayout


    - This layout puts components in a row, sized at their preferred size.

    - If the horizontal space in the container is too small to put all the components
    in one row, it uses multiple rows.

    - If the container is wider than necessary for a row of components, the row is,
    by default, centered horizontally within the container.


    `FlowLayout()`

    `FlowLayout(int alignment)`

    `FlowLayout(int alignment, int horzGap, int vertGap)`


    The alignment can be `FlowLayout.LEADING`, `FlowLayout.CENTER`, or `FlowLayout.TRAILING`.
    Default gap value is 5 units.


    The following program shows how to use `FlowLayout` to arrange components.


    ```

    01: import javax.swing.*;

    02: import java.awt.*;

    03: public class FlowLayoutDemo extends JFrame {

    04: JLabel l1;

    05: JTextField tfEmail;

    06: JButton b1, b2;

    07: public FlowLayoutDemo() {

    08: super("FlowLayout Demo");

    09: l1 = new JLabel("Email Address");

    10: tfEmail = new JTextField(20);

    11: b1= new JButton("Register");

    12: b2 = new JButton("Cancel");

    13:

    14: Container c = getContentPane();

    15: c.setLayout( new FlowLayout());

    16: c.add(l1);

    17: c.add(tfEmail);

    18: c.add(b1);

    19: c.add(b2);

    20: setDefaultCloseOperation( JFrame.EXIT_ON_CLOSE);

    21: setSize(350,200);

    22: setVisible(true);

    23: }

    24: public static void main(String args[]) {

    25: new FlowLayoutDemo();

    26: }

    27: }

    ```


    ### Using GridLayout


    GridLayout places components in grid cells. The total area is divided into rows
    and columns specified by constructor of `GridLayout`. All cells are of exactly
    same size.


    `GridLayout(int rows, int columns)`

    `GridLayout(int rows, int columns, int horizGap, int vertGap)`


    If `rows` is zero then as many rows as required are created. If `columns` is zero
    then as many columns as required are created.


    **NOTE**: At least `rows` parameter or `columns` parameter must be non-zero.


    The following program places three buttons in one row. It creates as many rows
    as required to accommodate buttons.


    ```

    01: import javax.swing.*;

    02: import java.awt.*;

    03: public class GridLayoutDemo extends JFrame {

    04:

    05: public GridLayoutDemo() {

    06: super("GridLayout Demo");

    07: Container c = getContentPane();

    08: c.setLayout( new GridLayout(0,3));

    09:

    10: c.add ( new JButton("Button1"));

    11: c.add ( new JButton("Button2"));

    12: c.add ( new JButton("Big Button3"));

    13: c.add ( new JButton("Button4"));

    14: c.add ( new JButton("Button5"));

    15:

    16: setDefaultCloseOperation( JFrame.EXIT_ON_CLOSE);

    17: setSize(350,200);

    18: setVisible(true);

    19: }

    20: public static void main(String args[]) {

    21: new GridLayoutDemo();

    22: }

    23: }

    ```


    ### Using BorderLayout


    - It divides the space into five areas. Each area takes one component.

    - Except center area, other areas take as much space as required.

    - `LINE_START` and `LINE_END` grow vertically to occupy vacant area.

    - `PAGE_START` and `PAGE_END` grow horizontally to the vacant area.

    - By default, `BorderLayout` puts no gap between components.


    `BorderLayout(int horizGap, int vertGap)`


    These areas are identified by the constants:

    - `PAGE_START`

    - `PAGE_END`

    - `LINE_START`

    - `LINE_END`

    - `CENTER`


    The following example shows how to place components in `BorderLayout`.


    ```

    01: import javax.swing.*;

    02: import java.awt.*;

    03: public class BorderLayoutDemo extends JFrame {

    04:

    05: public BorderLayoutDemo() {

    06: super("BorderLayout");

    07: Container c = getContentPane();

    08: c.add(new JButton("Top"), BorderLayout.PAGE_START);

    09: c.add(new JButton("Bottom"), BorderLayout.PAGE_END);

    10: c.add(new JButton("Left"), BorderLayout.LINE_START);

    11: c.add(new JButton("Right"), BorderLayout.LINE_END);

    12:

    13: JPanel p = new JPanel();

    14: p.add(new JLabel("Center Component"));

    15: c.add(p, BorderLayout.CENTER);

    16:

    17: setDefaultCloseOperation( JFrame.EXIT_ON_CLOSE);

    18: setSize(500,200);

    19: setVisible(true);

    20: }

    21: public static void main(String args[]) {

    22: new BorderLayoutDemo();

    23: }

    24: }

    ```


    ### Using GridBagLayout


    GridBagLayout is very flexible but complex layout manager. It allows components
    to be placed at the specified position in terms of cells. A component may span
    multiple rows and columns. Unlike `GridLayout`, all components need not be of
    the same size. `GridBagConstraints` is used to specify the properties (position
    and size) related to each component.


    The following example demonstrates how to use `GridBagLayout`.


    ```

    01: import java.awt.*;

    02: import javax.swing.*;

    03: public class UserLoginFrame extends JFrame {

    04: JTextField tfUname;

    05: JPasswordField tfPwd;

    06: JButton btnLogin;

    07: public UserLoginFrame() {

    08: super("Login");

    09: GridBagConstraints gbc = new GridBagConstraints();

    10:

    11: tfUname = new JTextField(20);

    12: tfPwd = new JPasswordField(20);

    13: btnLogin = new JButton("Login");

    14:

    15: Container c = getContentPane();

    16: c.setLayout(new GridBagLayout());

    17: setDefaultCloseOperation(WindowConstants.EXIT_ON_CLOSE);

    18:

    19: // first label

    20: c.add( new JLabel("UserName : "),gbc);

    21:

    22: // username

    23: gbc.gridwidth = 2;

    24: gbc.fill = GridBagConstraints.HORIZONTAL;

    25: gbc.insets = new java.awt.Insets(2, 2, 2, 2);

    26: c.add(tfUname,gbc);

    27:

    28: // second label

    29: gbc.gridx = 0;

    30: gbc.gridy = 1;

    31: c.add(new JLabel("Password : "),gbc);

    32:

    33: // password

    34: gbc.gridx = 1;

    35: gbc.gridwidth = 1;

    36: c.add(tfPwd,gbc);

    37:

    38: // login button

    39: gbc.gridx = 0;

    40: gbc.gridy = 2;

    41: gbc.gridwidth = 2;

    42: c.add(btnLogin,gbc);

    43:

    44: setSize(300,150);

    45: setVisible(true);

    46: }

    47: public static void main(String args[]) {

    48: new UserLoginFrame();

    49: }

    50: }

    ```

