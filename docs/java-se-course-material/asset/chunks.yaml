    ### Generics


    - Allow you to specify to compiler the type of object you want to store in a collection.

    - Generics make collection classes type-safe by ensuring a collection supports
    only one type of objects.

    - At the time of creating an object of a collection class, we can specify which
    type of objects the collection supports.

    - Eliminates the need to typecast the object taken from collection – makes it
    convenient and faster.


    ```java

    01: // Code without Generics

    02: ArrayList al = new ArrayList();

    03: al.add("First");

    04: al.add( new Integer(100));

    05: String st;

    06: st = (String) al.get(0); // typecasting is required

    07: System.out.println(st.toUpperCase());

    08: st = (String) al.get(1); // results in Exception (ClassCastException)

    ```


    In the above code, when you try to typecast `al.get(1)` to `String`, it results
    in `ClassCastException`, because `al.get(1)` actually refers to an object of type
    `Integer` and it cannot be converted to `String`.


    The following example demonstrates how generics make collections type-safe and
    convenient to use.


    ```java

    01: // Code using Generics

    02: ArrayList<String> al = new ArrayList<String>();

    03: al.add("First");

    04: //al.add( new Integer(100)); // compile-time error

    05: al.add("Second");

    06: String st;

    07: st = al.get(0); // no typecasting needed

    08: System.out.println(st.toUpperCase());

    ```

