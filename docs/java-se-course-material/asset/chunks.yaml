    \ II\n\n## Synchronization\n\n- This is the process by which Java ensures that\
    \ a shared resource is accessed only by one thread at a time.\n- Java provides\
    \ synchronization as part of language using `synchronized` methods and `synchronized`\
    \ statements.\n- A monitor is an object that is used as a mutually exclusive lock,\
    \ or `mutex`. Only one thread can enter into a monitor at a given time. When a\
    \ thread acquires a lock, it is said to have entered the monitor.\n- When a thread\
    \ invokes a `synchronized` method, it locks the object (enters the monitor) preventing\
    \ other threads from invoking any `synchronized` method of the object.\n\n```java\n\
    class Stack\n{\n    private int data[] = new int[10];\n    private int top = 0;\n\
    \n    // Thread1\n    synchronized public void push (int v)\n    { \n        data\
    \ [top] = v;\n        top ++;\n        // Thread2 cannot control at invoke push()\
    \ or pop() as Thread1 has already entered into monitor\n    }\n\n    synchronized\
    \ public int pop()\n    { \n        // // code \n    }\n}\n```\n\nMonitor\ndata\n\
    top\nThread1\nOf Stack Object\n10 ... 0\n\nSrikanth Technologies\nJava Student’s\
    \ Guide – Object-Oriented Programming II\n\nThe scenario shown by above figure\
    \ is as follows:\n\n- `Thread1` and `Thread2` both access the same object of `Stack`\
    \ class.\n- At `10:10:10` `Thread1` called `push()` method of stack object.\n\
    - By calling `push()` method, which is `synchronized`, `Thread1` entered into\
    \ monitor of stack object. It means stack object is now locked.\n- After executing\
    \ first statement in `push()` method, at `10:10:11` `Thread1` lost control and\
    \ control is given to `Thread2`.\n- Upon receiving control, `Thread2` tries to\
    \ enter into `push()` method at `10:10:12`, but cannot enter into it as the monitor\
    \ of stack object still has `thread1`.\n\n**NOTE:** To enter into any `synchronized`\
    \ method of an object; a thread must first enter into monitor of the object. Object\
    \ of the class that has at least one `synchronized` method is associated with\
    \ a monitor.\n\nThe following example shows importance of synchronizing a method\
    \ when two or more threads are accessing the same object.\n\n```java\nclass Data\
    \ {\n    synchronized public void print() {\n        for ( int i = 1; i <= 5;\
    \ i ++) {\n            System.out.println(i);\n            try {\n           \
    \     Thread.sleep(100);\n            } catch(Exception ex) {}\n        }\n  \
    \  }\n} // end of data\n\nclass CThread extends Thread {\n    Data obj;\n    public\
    \ CThread (Data obj) {\n        this.obj = obj;\n    }\n    public void run()\
    \ {\n        obj.print();\n    }\n} // end of CThread\n\npublic class SyncTest\
    \ {\n    public static void main(String args[]) {\n        CThread thread1,thread2;\n\
    \        Data obj = new Data();\n        // make two threads access the same object\n\
    \        thread1 = new CThread(obj);\n        thread2 = new CThread(obj);\n  \
    \      thread1.start();\n        thread2.start();\n    } // end of main\n}\n```\n\
    \n## Synchronized statement\n\nSynchronized statement allows you to implement\
    \ synchronization even when you cannot make a method synchronized. This is required\
    \ when you have to synchronize a method in a class whose source code is available\
    \ to you (only `.class` file is available).\n\n```java\nsynchronized (object)\
    \ {\n    // invoke methods to be synchronized\n}\n```\n\nThe `object` used with\
    \ `synchronized` statement is the object whose methods are to be synchronized.\
    \ Synchronized block ensures that a call to a method, which is a member of object\
    \ used with `synchronized` statement, occurs only after the current thread has\
    \ successfully entered object’s monitor.\n\nChange `run()` method of `CThread`\
    \ class as follows to use synchronization. The rest of the program remains same\
    \ as shown in the previous case.\n\n```java\nclass CThread extends Thread {\n\
    \    public void run(){\n        synchronized(obj) {\n            obj.print();\n\
    \        }\n    }\n}\n```\n\n## Thread Pools\n\n- A thread pool is a collection\
    \ of worker threads.\n- It minimizes the overhead due to thread creation, allocating\
    \ many threads.\n- One common type of thread pool is the fixed thread pool. Tasks\
    \ are submitted to the pool via internal queue, which holds tasks whenever there\
    \ are more active tasks than threads.\n- A simple way to create a thread pool\
    \ is to invoke `fixedThreadPool` method in `java.util.concurrent.Executors`.\n\
    \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
    \npublic class ExecutorDemo {\n    public static void main(String[] args) {\n\
    \        ExecutorService executor = Executors.newFixedThreadPool(3);\n       \
    \ for ( int i = 1; i <= 10; i++) {\n            executor.execute(new PrintNumbers(\"\
    Thread\" + i));\n        }\n        System.out.println(\"Done with main()\");\n\
    \    }\n}\n\nclass PrintNumbers implements Runnable {\n    private String name;\n\
    \    public PrintNumbers (String name) {\n        this.name = name;\n    }\n \
    \   public void run() {\n        for ( int i = 1; i <= 5; i++) {\n           \
    \ System.out.printf(\"%s : %d\\n\", name, i);\n        }\n    }\n}\n```\n"
