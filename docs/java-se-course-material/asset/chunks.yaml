    \ parts[0]) );\n\n        Calendar cd=Calendar.getInstance(); // get system date\n\
    \n        long ms = cd.getTimeInMillis()- dob.getTimeInMillis();\n        long\
    \ days = ms / ( 1000 * 60 * 60 * 24);\n        System.out.printf(\"Age in years\
    \ : %d\\n\",days/365);\n    }\n}\n```\n"
