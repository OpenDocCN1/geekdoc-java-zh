    \ `int` 和 `long` 等整型数据类型。\n\n#### 运算符含义\n\n| `~` | 取反码 (Ones complement) |\n|\
    \ `&` | 位与 (Bitwise Anding) |\n| `|` | 位或 (Bitwise Oring) |\n| `^` | 位异或 (Bitwise\
    \ XOR - Exclusive OR) |\n| `<<` | 将位向左移动 `n` 次，并在右侧填充 0。 |\n| `>>` | 将所有位右移 `n`\
    \ 次，在左侧用符号位填充。 |\n| `>>>` | 将所有位右移 `n` 次，在左侧用 0 填充。 |\n\nSrikanth Technologies\n\
    Java 入门\n23\n\n下面的代码段展示了如何使用位运算符。\n\n```java\npublic class BitOperators {\n  \
    \  public static void main(String[] args) {\n        byte a = 10, b = 15;\n  \
    \      // 0000 1010 & 0000 1111 = 0000 1010\n        System.out.printf(\"%d &\
    \ %d = %d\\n\",a,b,a & b);\n        // 0000 1010 | 0000 1111 = 0000 1111\n   \
    \     System.out.printf(\"%d | %d = %d\\n\",a,b,a | b);\n        // 0000 1010\
    \ >> 2 = 0000 0010\n        System.out.printf(\"%d >> 2 = %d\\n\", a , a >> 2);\n\
    \        // 0000 1010 << 2 = 0010 1000\n        System.out.printf(\"%d << 2 =\
    \ %d\\n\", a , a << 2);\n    }\n}\n```\n\n## 控制语句\n\n以下是 Java 中提供的条件语句和循环结构。\n\
    \n### if 语句\n\n`if` 语句用于决定是否执行某操作。如果 `condition` 为真，则执行 `statement-1`，否则执行 `statement-2`。`else`\
    \ 部分是可选的。\n\n```java\nif (condition)\n    statement-1;\nelse\n    statement-2;\n\
    ```\n\n**注意**：如果需要执行多个语句，请将语句括在大括号 (`{}`) 中。\n\n可以有嵌套的 if 语句（在一个 if 语句内部嵌套另一个\
    \ if 语句）。也可以有多个带有 `if ..else.. if .. else` 的 if 语句。\n\nSrikanth Technologies\n\
    Java 入门\n24\n\n### switch 语句\n\n`switch` 语句用于执行多个备选方案中的一种。\n\n```java\nswitch(expression)\n\
    {\n    case label-1 : statement; [break];\n    case label-2 : statement; [break];…\n\
    \    default : statement;\n}\n```\n\n下面的示例对代码 1 和 2 执行相同的操作，对代码 3 执行不同的操作。`default`\
    \ 用于执行处理剩余代码的操作。\n\n```java\nswitch(code){\n    case 1 : // 穿透到下一个 case\n    case\
    \ 2 : price = 1000; break;\n    case 3 : price = 500; break;\n    default: price\
    \ = 100;\n}\n```\n\n对于 `switch` 语句，表达式必须是 `char`、`byte`、`short`、`int` 或 `enum`\
    \ 类型。从 Java 7.0 开始，`switch` 也支持 `string` 数据类型。\n\nSrikanth Technologies\nJava\
    \ 入门\n25\n\n```java\nString country;\n// 获取值并存入 country\nswitch(country)\n{\n\
    \    case \"India\" : // 代码\n    case \"China\" : // 代码\n    case \"Russia\" :\
    \ // 代码\n    default : // 代码\n}\n```\n\ncase 常数的求值类型必须与 switch 表达式的类型相同。case 常数必须是编译时常量。\n\
    \n**注意**：`default` 情况不必非位于 `switch` 语句的末尾；它可以位于任何地方。\n\n### while 循环\n\n只要条件为真，就重复执行语句(语句)。\n\
    \n```java\nwhile(condition)\n    statements;\n```\n\n```示例显示了 1 到 10 的所有数字。要执行多个语句，请将语句括在大括号\
    \ (`{}`) 中。\n\n```java\nint i = 1;\nwhile ( i <= 10 ) {\n    System.out.println(i);\n\
    \    i ++;\n}\n```\n\n### do .. while 循环\n\n执行循环体然后检查条件，从而保证语句至少执行一次。\n\n```java\n\
    do {\n    statement;\n}while (condition);\n```\n\nSrikanth Technologies\nJava\
    \ 入门\n26\n\n下面的程序显示了 1 到 10 的数字。\n\n```java\nint i = 1;\ndo {\n    System.out.println(i);\n\
    \    i ++;\n} while (i <= 10);\n```\n\n### for 循环\n\n`for` 循环只要条件为真就会执行语句。首先执行初始化，然后检查条件是否为真。如果条件为真，则执行语句然后执行递增部分。\n\
    \n```java\nfor( initialization; condition; increment)\n    Statement;\n```\n\n\
    变量可以在初始化中声明。\n\n```java\nfor(int i=0; i<10; i++){\n    // 语句\n}\n```\n\n### break\
    \ 语句\n\n`break` 语句用于终止循环。Java 提供了标签 `break` 和无标签 `break`。\n\nSrikanth Technologies\n\
    Java 入门\n27\n\n```java\nlabel:\nfor(...) {\n    if(condition)\n        break;\n\
    }\n```\n\n### continue 语句\n\n`continue` 用于跳过当前迭代并进入下次迭代。\n\n```java\nfor(...)\
    \ {\n    if(condition)\n        continue;\n}\n```\n\n### 使用 System.printf 打印值\n\
    \n`printf()` 函数类似于 C 语言。可以使用的转换字符：`b`-布尔、`c`-字符、`d`-整数、`f`-浮点数、`s`-字符串。\n\n如果转换字符不匹配，将发生运行时错误。以下将产生运行时错误。\n\
    \n### 使用 Scanner 读取输入\n\n可以使用 `Scanner` 类获取输入。下面的代码段展示了如何使用 `Scanner` 读取整数。\n\n\
    ```java\nimport java.util.Scanner;\n\npublic class Factors {\n    public static\
    \ void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n  \
    \      System.out.print(\"Enter a number :\");\n        int num=s.nextInt();\n\
    \        for (int i = 2; i <= num/2; i++) {\n            if(num % i == 0)\n  \
    \              System.out.println(i);\n        }\n    }\n}\n```\n\n| 方法 | 说明 |\n\
    | :--- | :--- |\n| `nextInt()` | 读取下一个整数 |\n| `nextDouble()` | 读取下一个双 |\n| `nextLine()`\
    \ | 读取下一行并返回字符串 |\n"
- fmt: "\n# Old Block Ready For Garbage Collection\n\nNew Array of 5 elements\n\n\
    Old array of 10 elements referred by `arr` is now eligible for garbage collection\
    \ by Java.\n\n**NOTE**: Java virtual machine has garbage collector, which takes\
    \ care of releasing unused memory blocks.\n\nSrikanth Technologies\n\n## Getting\
    \ Started With Java\n31\n\nYou can create a double dimensional array using two\
    \ square brackets as follows:\n\n```java\nint a[][] = new int[5][5];\n```\n\n\
    You can create an array of 5 elements, where each element can refer to an array\
    \ of different size as follows:\n\n```java\nint a[][] = new int[5][];\na[0] =\
    \ new int[5];\na[1] = new int[10];\n```\n\n0\n1\n4\n0\n…\n1\n…\nnull\n0\n1\n9\n\
    null\n4\nnull\n\n Enhanced for loop\n\nJava provides enhanced for loop exclusively\
    \ to process arrays and collections. It takes one value from array and assigns\
    \ it to loop variable. Executes loop statements and repeats the process until\
    \ array is exhausted.\n\n`for (datatype loopvariable : array)`\n`Statement;`\n\
    \nThe following example displays all elements of an array using enhanced for loop.\
