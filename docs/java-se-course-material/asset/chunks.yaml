    - 调用静态方法不需要接口的任何实现或继承。\n\n```java\npublic interface Counter {\n    void increment();\n\
    \    void decrement();\n    int getValue();\n    default int getIncrement() {\n\
    \        return 1;\n    }\n    static void printAuthor() {\n        System.out.println(\"\
    Srikanth Pragada\");\n    }\n}\n```\n\n```java\npublic class OneCounter implements\
    \ Counter {\n    private int value;\n    @Override\n    public void increment()\
    \ {\n        value += getIncrement();\n    }\n    @Override\n    public void decrement()\
    \ {\n        value -= getIncrement();\n    }\n    @Override\n    public int getValue()\
    \ {\n        return value;\n    }\n}\n```\n\n```java\npublic class TenCounter\
    \ implements Counter {\n    private int value;\n    @Override\n    public void\
    \ increment() {\n        value += getIncrement();\n    }\n    @Override\n    public\
    \ void decrement() {\n        value -= getIncrement();\n    }\n    // 重写默认实现\n\
    \    @Override\n    public int getIncrement() {\n        return 10;\n    }\n \
    \   @Override\n    public int getValue() {\n        return value;\n    }\n}\n\
    ```\n\n```java\npublic class TestCounter {\n    public static void main(String[]\
    \ args) {\n        Counter.printAuthor();\n\n        OneCounter c = new OneCounter();\n\
    \        c.increment();\n        System.out.println(c.getIncrement());\n     \
    \   System.out.println(c.getValue());\n\n        TenCounter c2 = new TenCounter();\n\
    \        c2.increment();\n        System.out.println(c2.getValue());\n    }\n\
    }\n```\n\n## 函数接口 (Functional Interface)\n- 只包含一个抽象方法的接口被称为函数接口。\n- 函数接口可以有默认方法，但必须只能只有一个抽象方法。\n\
    - 使用 `@FunctionalInterface` 注解可以显式地标记接口为函数接口。然而，无论接口声明是否存在 `FunctionalInterface`\
    \ 注解，编译器都会将任何符合函数接口定义的接口视为函数接口。\n- 函数接口的实例可以通过 lambda 表达式、方法引用或构造函数引用创建。\n- 示例有\
    \ `Runnable`、`Comparable` 和 `Comparator`。\n\n```java\n@FunctionalInterface\npublic\
    \ interface Printable {\n    void print(String mgs);\n    default String newline()\
    \ {\n        return \"\\n\";\n    }\n}\n```\n\n```java\nclass Print implements\
    \ Printable {\n    public void print(String msg) {\n        System.out.println(msg\
    \ + newline());\n    }\n}\n```\n\n```java\npublic class FITest {\n    public static\
    \ void main(String args[]) {\n        Printable p = new Print();\n        p.print(\"\
    Hello\");\n        Printable p2 = FITest::print;\n        p2.print(\"Using Method\
    \ Reference\");\n    }\n    public static void print(String msg) {\n        System.out.println(msg);\n\
    \    }\n}\n```\n\n## 抽象类 vs 接口 (Abstract class vs. Interface)\n- 接口和抽象类都不能拥有对象，但拥有对象引用。\n\
    - 在接口的情况下，对象引用可以引用实现该类的对象。抽象类的对象引用可以引用子类的对象。\n- 然而，抽象类可以拥有实例变量，但接口不能拥有实例变量。\n\n\
    ### 空接口 (Null interface)\nJava 允许接口是空的。一个空接口不包含任何变量和方法。它被用于标记或指示一个类具有某些属性或行为。\n\
    例如，`Serializable` 接口 true 一个空接口。实现 `Serializable` 接口的类通知 Java 它可以被序列化（转换为字节并写入存储器）。\n\
    空接口也称为标记接口 (`marker interface`)。\n\n## 嵌套类 (NESTED CLASSES)\n嵌套类是定义在另一个类内部的类。嵌套类可以是以下类型之一：\n\
    - 静态成员类\n- 非静态成员类\n- 方法局部内部类\n- 匿名内部类\n\n### 静态成员类 (Static member class)\n在另一个类中用带有\
    \ `static` 修饰符创建的类被称为静态成员类。它可以像普通类一样被使用。然而，要从外部类外部访问它，必须使用外部类的名称。\n\n```java\n\
    // 顶层类\nclass TLC {\n    static class SMC {\n        static void print() {\n \
    \           System.out.println(\"SMC\");\n        }\n    }\n}\n\nclass TLCClient\
    \ {\n    public static void main(String[] args) {\n        TLC.SMC srec = new\
    \ TLC.SMC();\n        srec.print();\n    }\n}\n```\n输出: SMC\n\n### 非静态成员类（内部类）（Non-static\
    \ member class (inner class)\n在另一个类中定义但不带 `static` 修饰符的类被称为非静态成员类。它也被称为内部类。内部类可以直接访问外部类的所有变量和方法。内部类是在\
    \ 1.1 版本引入的，主要有助于处理 AWT 和 Swing 应用中的事件。\n\n```java\nclass OuterClass {\n    private\
    \ int m1 = 10;\n    class InnerClass {\n        private int m2 = 20;\n       \
    \ public void print() {\n            System.out.printf(\"m1=%d m2=%d\", m1, m2);\n\
    \        }\n    }\n}\n\npublic class InnerTest {\n    public static void main(String\
    \ args[]) {\n        OuterClass outer = new OuterClass();\n        OuterClass.InnerClass\
    \ obj = outer.new InnerClass();\n        obj.print();\n    }\n}\n```\n输出: m1=10\
    \ m2=20\n\n### 方法局部内部类 (Method-local inner class)\n在方法内部声明的类被称为局部类。只有定义该类的方法可以创建该类的实例。和其他任何内部类一样，局部内部类可以访问其外部类的成员。\n\
    \n```java\nclass TLC {\n    private int v = 10;\n    public void somemethod()\
    \ {\n        class LocalClass {\n            public void print() {\n         \
    \       System.out.printf(\"Local class. Outer class value %d\\n\", v);\n    \
    \        }\n        }\n        LocalClass obj = new LocalClass();\n        obj.print();\n\
    \    }\n}\n\npublic class LocalTest {\n    public static void main(String[] args)\
    \ {\n        TLC obj = new TLC();\n        obj.somemethod();\n    }\n}\n```\n\
    输出: Local class. Outer class value 10\n\n### 匿名内部类 (Anonymous Inner class)\n匿名内部类将定义内部类和创建内部类对象的过程合并到一个步骤中。它是一个没有名称（匿名）的类。\n\
    \n```\nnew <父类或接口> (可选参数) {\n    成员定义\n}\n```\n可选参数被传递给父类的构造函数。匿名类可以扩展一个类或实现接口。不需要\
    \ `extends` 或 `implements` 关键字。`new` 关键字后面的名称被视为类或接口。\n\n**注意**：匿名类不能有任何构造函数，因为它们没有名称。\n\
    \n```java\ninterface Stack {\n    void push(String value);\n    String pop();\n\
    }\n\nclass OuterClass {\n    public IStack getStack() {\n        // 匿名类实现接口\n\
    \        return new Stack() {\n        };\n    }\n}\n```\n*(注：原文代码中使用了 IStack\
    \ 但接口定义为 Stack，此处保留原文逻辑结构)*\n\n"
