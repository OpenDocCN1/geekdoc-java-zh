    \n### 继承 (INHERITANCE)\n- 允许从另一个类创建类，从而继承另一个类的所有成员。\n- 允许现有类的可重用。\n- 新类可以添加新成员并重写被继承类的现有成员。\n\
    - 被继承的类称为超类（superclass），从现有类创建的类称为子类（subclass）。\n- 继承表示类之间的“是”（IS A）关系。例如，`Manager`\
    \ 继承 `Employee`，因为 `Manager` 是一个 `Employee`。`SavingsAccount` 继承 `Account`，因为 `SavingsAccount`\
