    17: System.out.println( contains( names,"Joe"));

    18: }

    19: }

    ```


    ## Regular Expressions

    Regular expressions describe a set of strings based on common characteristics
    shared by each string in the set.

    - They can be used to search, edit, or manipulate text and data.

    - You must learn a specific syntax to create regular expressions — one that goes
    beyond the normal syntax of the Java programming language.


    ### Character classes

    The left-hand column specifies the regular expression constructs, while the right-hand
    column describes the conditions under which each construct will match.

    - `[abc]`: a, b, or c (simple class)

    - `[^abc]`: Any character except a, b, or c (negation)

    - `[a-zA-Z]`: a through z, or A through Z, inclusive (range)

    - `[a-z&&[^bc]]`: a through z, except for b and c: `[ad-z]` (subtraction)

    - `[a-z&&[^m-p]]`: a through z, and not m through p: `[a-lq-z]` (subtraction)


    ### Predefined character classes

    - `.`: Any character (may or may not match line terminators)

    - `\d`: A digit: `[0-9]`

    - `\D`: A non-digit: `[^0-9]`

    - `\s`: A whitespace character: `[ \t\n\x0B\f\r]`

    - `\S`: A non-whitespace character: `[^\s]`

    - `\w`: A word character: `[a-zA-Z_0-9]`

    - `\W`: A non-word character: `[^\w]`


    ### Quantifiers

    - `X?`: X, once or not at all

    - `X*`: X, zero or more times

    - `X+`: X, one or more times

    - `X{n}`: X, exactly n times

    - `X{n,}`: X, at least n times

    - `X{n,m}`: at least n but not more than m times


    ### Pattern class

    - A Pattern object is a compiled representation of a regular expression.

    - The Pattern class provides no public constructors.

    - To create a pattern, you must first invoke one of its public static methods,
    which will then return a Pattern object.

    - These methods accept a regular expression as the first argument.


    | Method | Meaning |

    | :--- | :--- |

    | `static Pattern compile(String regex)` | Compiles the given regular expression
    into a pattern. |

    | `Matcher matcher(CharSequence input)` | Creates a matcher that will match the
    given input against this pattern. |

