    \ `BOTH`（两者）。 |\n| `anchor` | 当组件小于其显示区域时，用于确定将组件放置在区域内的位置。有效值（由 `GridBagConstraints`\
    \ 常量定义）为：`CENTER`（默认）、`PAGE_START`、`PAGE_END`、`LINE_START`、`LINE_END`、`FIRST_LINE_START`、`FIRST_LINE_END`、`LAST_LINE_END`\
