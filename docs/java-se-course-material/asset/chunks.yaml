    ### Collections class

    - It contains a collection of static methods that operate on collections provided
    as parameters.

    - Implements various algorithms related to collections.


    ### Methods


    | Method | Meaning |

    | :--- | :--- |

    | `int binarySearch(List l, Object v)` | Implements binary search algorithm to
    search. |

    | `void copy(List dest, List src)` | Copies content of one list to another. |

    | `void fill(List list, Object obj)` | Fills the list with the given value. |

    | `Object max(Collection c)` | Returns maximum value in collection. |

    | `Object min(Collection c)` | Returns minimum value in collection. |

    | `void reverse(List l)` | Reverses the list. |

    | `void shuffle(List l)` | Shuffles the list with randomness. |

    | `void sort(List l)` | Sorts the list. |

    | `void sort(List l, Comparator c)` | Sorts the list with order specified by `Comparator`.
    |


    ```java

    01: import java.util.*;

    02: public class CollectionsDemo {

    03: public static void main(String args[]) {

    04: ArrayList<String> names = new ArrayList();

    05: names.add("James");

    06: names.add("Hunter");

    07: names.add("Roman");

    08: Collections.sort(names);

    09: printList(names);

    10: int pos=Collections.binarySearch(names,"Roman");

    11: System.out.printf("Roman is found at : %d\n",pos);

    12: System.out.printf("Maximum :%s\n",Collections.max(names));

    13: System.out.println("Reverse Order");

    14: Collections.reverse(names);

    15: printList(names);

    16: }

    17: public static printList(List<String> list) {

    18: for (String s : list) {

    19: System.out.println(s);

    20: }

    21: }

    22: }

    ```


    ### Generic Methods

    - All generic method declarations have a type parameter section delimited by angle
    brackets (`<`, `>`) that precedes the return type.

    - Note that type parameters can represent only reference types—not primitive types
    like `int`, `double`.

    - Type parameter can be declared only once in the type parameter section but can
    appear more than once in the method’s parameter list.


    ### Bounded Type Parameter

    - To declare a bounded type parameter, list the type parameter''s name, followed
    by `extends` keyword, followed by upper bound.

    - Note that, in this context, `extends` is used in a general sense to mean either
    "extends" (as in classes) or "implements" (as in interfaces).


    ```java

    01: import java.util.*;

