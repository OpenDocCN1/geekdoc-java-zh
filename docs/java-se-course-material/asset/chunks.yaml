    \ \"Main -->\" + i);\n        } // end of for\n\n        System.out.println(\"\
    End of main\");\n    } // end of main()\n}\n```\n\n## 使用 Runnable 接口创建新线程\n\n\
    可以使用 `Thread` 类的对象和实现 `Runnable` 接口的类来创建一个新线程。按照以下步骤创建线程：\n\n- 创建一个实现 `Runnable`\
    \ 接口的类。\n- 实现 `Runnable` 接口的 `run()` 方法。\n- 创建一个 `Thread` 类的对象，并将实现 `Runnable`\
    \ 接口的类对象作为参数传递给 `Thread` 类的构造函数。\n- 调用 `Thread` 类的 `start()` 方法。它将调用作为 `Thread`\
    \ 构造函数参数对象的 `run()` 方法。\n\n**注意：** `Runnable` 接口只有一个 `run()` 方法。`Thread` 类也实现了\
    \ `Runnable` 接口。\n\n```java\nclass ThreadCode implements Runnable {\n    public\
    \ void run() {\n        for ( int i = 1; i <= 50 ; i ++) {\n            System.out.println(i);\n\
    \        }\n    } // end of run\n} // end of ThreadCode\n\npublic class RunnableThread\
    \ {\n    public static void main(String args[]) {\n        ThreadCode code = new\
    \ ThreadCode();\n        Thread t = new Thread(code);\n        t.start(); // Calls\
    \ run() method of code object\n\n        for ( int i = 1 ; i <= 50 ; i ++)\n \
    \           System.out.println( \"Main --> \" + i);\n    }\n}\n```\n\n## 线程状态\
    \ – 线程的生命周期\n\n线程在不同的时间点可以处于不同的状态。线程由于通过 `start()` 方法启动，会从一个状态变为另一个状态。\n\n下面的表和图讨论了线程生命周期中的不同状态和转换。\n\
    \n| 状态 | 含义 |\n| :--- | :--- |\n| 新 (New) | 创建了新的线程对象尚未启动。 |\n| 就绪 (Ready to run)\
    \ | 使用 `start()` 方法启动线程。在此状态下，线程准备好运行，但没有控制权。如果给了控制权，它就开始运行。除了初始处于此状态外，线程也会从其他状态进入此状态。\
    \ |\n| 运行 (Running) | 线程正在运行。 |\n| 睡眠 (Sleep) | 调用 `sleep()` 方法，线程进入指定的毫秒数睡眠。\
    \ |\n| IO 阻塞 (Blocked for IO) | 线程发起了某些 IO 操作并正在等待操作完成。 |\n| Join 阻塞 (Blocked\
    \ for join) | 线程等待另一个线程完成。 |\n| 等待 (Waiting for) | 线程等待另一个线程的通知。线程执行了某个对象的 `wait()`\
    \ 方法。它将等待另一个线程对它调用 `wait()` 的该对象调用 `notify()` 或 `notifyAll()` 方法。这与线程间通信有关。 |\n\
    | 锁阻塞 (Blocked for lock) | 线程等待获取对象的锁。一旦线程被另一个线程通知，它将等待直到它可以获取该对象的锁。这与线程间通信有关。\
    \ |\n| 死亡 (Dead) | 线程已终止。 |\n\n## 线程优先级\n\n- 每个线程都关联有一个优先级。\n- 线程调度器使用优先级来决定应该给哪些可用线程控制权。\n\
    - 优先级是相对的，而不是绝对的。这意味着其他线程的优先级将决定当前线程是否获得控制权。\n- 使用 `setPriority(int)` 和 `getPriority()`\
    \ 方法设置和获取线程的优先级。\n- `Thread` 类有三个静态成员（`MIN_PRIORITY`、`NORM_PRIORITY`、`MAX_PRIORITY`），可以用于设置线程的优先级。\n\
    - 线程的默认优先级是普通优先级，表示为数字 5。\n- 线程继承其父线程的优先级。\n\n```java\nChildThread t = new ChildThread();\n\
    t.setPriority(Thread.MAX_PRIORITY);\nif ( t.getPriority() == Thread.MAX_PRIORITY\
    \ )\n    System.out.println(\"Thread with max priority\");\n```\n\n## Thread 类\n\
    \n`Thread` 类用于创建新线程。Java 中的每个线程都是 `Thread` 类的对象。`Thread` 类提供了对线程执行操作的静态方法和非静态方法。\n\
    \n- `MAX_PRIORITY`: 线程可以拥有的最高优先级。\n- `MIN_PRIORITY`: 线程可以拥有的最低优先级。\n- `NORM_PRIORITY`:\
    \ 分配给线程的默认优先级。\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `currentThread()` | 返回当前执行对象的引用。\
    \ |\n| `destroy()` | 在不进行任何清理的情况下销毁此线程。 |\n| `getName()` | 返回此线程的名字。 |\n| `getPriority()`\
    \ | 返回此线程的优先级。 |\n| `interrupt()` | 中断此线程。 |\n| `isAlive()` | 测试此线程是否存活。 |\n|\
    \ `isDaemon()` | 测试此线程是否为守护线程。 |\n| `join()` | 等待此线程死亡。 |\n| `join(long millis)`\
    \ | 最等待 *millis* 毫秒直到此线程死亡。 |\n| `run()` | 指定要执行的代码。它被 Thread 类的子类重写。 |\n| `setName(String\
    \ name)` | 将此线程的名字更改为参数名称。 |\n| `setDaemon(boolean on)` | 将此线程标记为守护线程或用户线程。必须在线程启动之前完成。\
    \ |\n| `setPriority(int priority)` | 修改此线程的优先级。 |\n| `start()` | 导致此线程开始执行。虚拟机调用此线程的\
