    # 使用多线程处理多个客户端


    上面的服务器 socket 每次只能处理一个客户端。当服务器 socket 必须同时处理多个客户端时，它必须创建多个线程——为每个客户端创建一个线程。


    下面的图片显示了单个 `Server socket` 如何创建多个线程来并发处理多个客户端。


    以下程序创建了一个服务器 socket 来接收来自客户端的请求。当接收到客户端的连接请求时，服务器创建一个新线程并让该线程处理与客户端的通信。


    **服务器**

    **Socket**

    **1: 连接**

    **客户端**

    **Socket-1**

    **2 : 创建线程**

    **客户端**

    **Thread-1**

    **Socket-2**

    **Thread-2**

    **3: 待处理客户端的线程。**


    ```java

    01: import java.io.PrintWriter;

    02: import java.net.*;

    03: import java.util.Scanner;

    04: import java.util.concurrent.ExecutorService;

    05: import java.util.concurrent.Executors;

    06:

    07: public class MultiThreadedBookServer {

    08: public static void main(String args[])

    09: throws Exception {

    10: ServerSocket ssocket = new ServerSocket(3000, 10);

    11: System.out.println("Book server is ready!");

    12: // 创建一个线程池来处理客户端

    13: ExecutorService executor =

    14: Executors.newFixedThreadPool(10);

    15: while (true) {

    16: Socket clientsocket = ssocket.accept();

    17: System.out.println("Accepted Client Request...");

    18: ClientHandler client=

    19: new ClientHandler(clientsocket);

    20: executor.execute(client);

    21: } // while

    22: } // main

    23: } // end of class

    24: class ClientHandler implements Runnable {

    25: Socket client;

    26: public ClientHandler(Socket client) {

    27: this.client = client;

    28: }

    29: public void run() {

    30: String books[] = {"Java Complete Reference",

    31: "Core Java Vol I & II", "Thinking in Java"};

    32: try {

    33: // 从客户端读取字符串

    34: Scanner scanner=

    35: new Scanner(client.getInputStream());

    36: PrintWriter pw = new PrintWriter

    37: (client.getOutputStream(), true);

    38: int bookno;

    39: String title;

    40: while (true) {

    41: bookno = scanner.nextInt();

    42: // 如果书籍编号为 0 则退出循环和线程

    43: if (bookno == 0) {

    44: break;

    45: }

    46: // 检查书籍编号是否有效

    47: if (bookno - 1 < books.length) {

    48: title = books[bookno - 1];

    49: } else {

    50: title = ""; // 未找到书籍

    51: }

    52: // 将标题传回客户端

    53: pw.println(title);

    54: } // end of while

    55: System.out.println("Client Connection Closed");

    56: } catch (Exception ex) {

    57: System.out.println(ex.getMessage());

    58: }

    59: } // end of run

    60: } // end of class

    ```


    以下是该服务器的客户端程序。客户端程序从用户处获取书籍编号并发送到服务器 socket。客户端接收从服务器发送的书籍标题并显示出来。


    当从客户端向服务器传递 `0` 时，服务器上对应的线程将终止。当用户输入 `0` 作为输入时，客户端将终止。


    ```java

    01: import java.io.PrintWriter;

    02: import java.net.Socket;

    03: import java.util.Scanner;

    04: public class BookClient {

    05: public static void main(String args[])

    06: throws Exception{

    07: Socket s = new Socket("localhost", 3000);

    08: Scanner keyboard = new Scanner(System.in);

    09: Scanner sin = new Scanner(s.getInputStream());

    10: PrintWriter sout =

    11: new PrintWriter(s.getOutputStream(), true);

    12: String title;

    13: int bookno;

    14: while (true) {

    15: // 从用户处获取书籍编号

    16: System.out.print("Enter book no.[0 to stop]:");

    17: bookno = keyboard.nextInt();

    18: sout.println(bookno); // 将书籍编号发送到服务器

    19: if (bookno == 0)

    20: break;

    21: title = sin.nextLine();

    22: if (title.length() != 0) {

    23: System.out.println("Book Title : " + title);

    24: else {

    25: System.out.println("Invalid Book No.");

    26: }

    27: } // while

    28: } // end of main

    29: }

    ```


    ## InetAddress 类


    - 此类表示一个 IP 地址和域名。

    - `InetAddress` 具有工厂方法，可以返回带有所需的类对象。

    - 提供获取名称和地址的方法。


    | 方法 | 含义 |

    | :--- | :--- |

    | `getAllByName(String host)` | 确定给定主机的所有 IP 地址。 |

    | `getHostAddress()` | 返回地址字符串。 |

    | `getHostName()` | 返回主机名。 |

    | `getLocalHost()` | 返回本地主机。 |


    以下程序使用 `InetAddress` 类来获取给定名称的 IP 地址。


    ```java

    01: import java.net.*;

    02: import java.io.*;

    03: import java.util.Scanner;

    04: public class GetAddresses {

    05: public static void main(String args[])

    06: throws Exception {

    07: Scanner s = new Scanner(System.in);

    08: String domainname;

    09: while (true) {

    10: // 读取域名

    11: System.out.println("Enter Domain Name:");

    12: domainname = s.nextLine();

    13: // 如果用户输入 end 则退出

    14: if (domainname.equals("end"))

    15: break;

    16: try {

    17: // 获取 IP 地址

    18: InetAddress ips[] = InetAddress.getAllByName(domainname);

    19: // 显示 IP 地址

    20: System.out.println("============");

    21: for (InetAddress addr : ips) {

    22: System.out.println(addr.getHostAddress());

    23: }

    24: } catch(UnknownHostException ex) {

    25: System.out.println("Sorry! Host Found");

    26: }

    27: } // end of while

    28: System.out.println("Thank you!");

    29: } // end of main

    30: } // end of class

    ```


    当你在连接互联网的系统上运行上述程序时，输出将如下：


    ```

    Enter Domain Name:www.srikaant.com

    ============

    64.62.254.51

    Enter Domain Name:yahoo.com

    ============

    66.94.234.13

    Enter Domain Name:notfound.com

    Sorry! Host Found

    Enter Domain Name:end

    Thank you!

    ```


    ## URL 类


    - 此类表示统一资源定位符（URL）。

    - `URL` 用于唯一标识互联网或网络中的资源。


    一个 URL 包含以下组件：


    - **协议 (Protocol)**：表示访问资源的协议。常见的协议有 HTTP、FTP、File 等。默认协议是 HTTP。

    - **主机 (Host)**：系统名称。系统可以通过名称或 IP 地址进行引用。

    - **端口号 (Port number)**：要访问的服务器 socket 端口号。如果没有提供，则取端口 80 (http)。

    - **文件 (File)**：在服务器上访问的文件。该路径必须被处理 URL 的服务器理解。


    - `URL(String spec)`

    - `URL(String protocol, String host, String file)`

    - `URL(String protocol, String host, int port, String file)`


    | 方法 | 含义 |

    | :--- | :--- |

    | `equals(Object obj)` | 比较两个 URL。 |

    | `getFile()` | 返回此 URL 的文件名。 |

    | `getHost()` | 返回此 URL 的主机名（如果适用）。 |

    | `getPort()` | 返回此 URL 的端口号。 |

    | `getProtocol()` | 返回此 URL 的协议名称。 |

    | `openConnection()` | 返回一个表示与 URL 所指远程对象连接的 `URLConnection` 对象。 |


    '
- fmt: '

    `InputStream openStream()` Opens a connection to this URL and returns an `InputStream`.


    The following program takes a URL and a filename from user and copies the content
    of the URL into the given file.


    It opens an input stream for given URL and reads one byte at a time and writes
    it into target file.


    ```java

    01: import java.net.*;

    02: import java.io.*;

    03: import java.util.Scanner;

    04:

    05: class Download {

    06: public static void main(String args[])

    07: throws Exception {

    08: // take input from user through keyboard

    09: Scanner s = new Scanner(System.in);

    10: System.out.print("Enter URL : ");

    11: String fromurl = s.nextLine();

    12: System.out.print("Enter filename : ");

    13: String filename = s.nextLine();

    14: URL urlobj = new URL(fromurl);

    15: InputStream is = urlobj.openStream();

    16: FileOutputStream fo =

    17: new FileOutputStream( filename);

    18: int ch = is.read();

    19: while ( ch != -1) {

    20: fo.write(ch);

    21: ch = is.read();

    22: }

    23: fo.close();

    24: is.close();

    25: }

    26: }

    ```


