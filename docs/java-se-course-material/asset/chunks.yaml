    \            DateTimeFormatter.ofLocalizedDate(FormatStyle.FULL);\n\n        LocalDate\
    \ today = LocalDate.now();\n        System.out.println(today.format(df));\n\n\
    \        DateTimeFormatter inputFormat =\n            DateTimeFormatter.ofPattern(\"\
    dd-MM-uuuu\");\n\n        LocalDate transDate =\n            LocalDate.parse(\"\
    24-10-1998\", inputFormat);\n        System.out.println(transDate);\n\n      \
    \  DateTimeFormatter format =\n            DateTimeFormatter.ofPattern(\"dd-MMM-uuuu\
    \ H:m:s\");\n\n        System.out.println(LocalDateTime.now().format(format));\n\
    \    }\n}\n```\nSrikanth Technologies\nJava 学生指南 – 库-I\n（注：输入中的剩余文本包含大量的重复/碎片化残留，已根据“高级文档工程师排版”指令进行了清理以保持清晰度。）\n"
- fmt: "\nThe following code shows how to use wrapper class `Integer` to convert an\
    \ `int` to object (boxing) and back to `int` (unboxing).\n\n```java\nint x =100;\n\
    // convert int to an object\nInteger iobj = new Integer(x); // boxing\n// get\
    \ int from object\nx = iobj.intValue(); // unboxing\n```\n\nSrikanth Technologies\n\
    Java Student’s Guide – Library-I\n26\n\n## Autoboxing\n\nWhen a primitive data\
    \ type is to be used as an object, it is to be **boxed** to an object of corresponding\
    \ **wrapper** class. When the primitive value is to be taken from wrapper class\
    \ object then the value is to be **unboxed** from object by using a method of\
    \ wrapper class.\n\nStarting from Java 5.0, Java does **boxing** and **unboxing**\
    \ automatically. The following example shows how boxing and unboxing take place.\n\
    \n```java\n01: public static void main(String[] args) {\n02: int i=100;\n03: Integer\
    \ iobj = i; // autoboxing\n04: System.out.println( iobj.toString());\n05: i =\
    \ iobj; // autounboxing\n06: System.out.println(i);\n07: }\n```\n\nSrikanth Technologies\n\
    Object-Oriented Programming Part – II\nJava Student’s Guide – Object-Oriented\
    \ Programming II\n2\n\n## WHAT WILL YOU LEARN IN THIS MODULE?\n\nAt the end of\
    \ this module you will have learnt the following:\n\n* Creating an Interface\n\
    * Implementing an interface\n* Using object references of an interface\n* An interface\
    \ extending another\n* Null interface\n* Default methods and static methods in\
    \ interface\n* Nested classes - static member classes, inner classes\n* Creating\
    \ a package and placing class in it\n* Accessing classes of a package\n* The import\
    \ statement\n* `CLASSPATH` variable\n* Access modifiers\n* Static import\n* Enumeration\n\
    * Exception Handling\n* Handling multiple exceptions\n* Multi-catch\n* The finally\
    \ block\n* Types of exceptions – checked and unchecked\n* Defining new exceptions\n\
    * More precise rethrow\n* Assertions\n* How to create new thread by extending\
    \ Thread class?\n* How to create new thread by implementing Runnable interface?\n\
    * Thread life-cycle\n* Thread class\n* Synchronization\n* Thread Pools\n\nSrikanth\
    \ Technologies\nJava Student’s Guide – Object-Oriented Programming II\n3\n\n##\
    \ INTERFACES\n\n* An interface is a collection of methods that must be implemented\
    \ by the implementing class.\n* An interface defines a contract regarding what\
    \ a class must do, without saying anything about how the class will do it.\n*\
    \ Interface can contain declaration of methods and variables.\n* Implementing\
    \ class must define all the methods declared in the interface.\n* If a class implements\
    \ an interface and does not implement all the methods then class itself must be\
    \ declared as abstract.\n* Variables in interface automatically become static\
    \ and final variables of the implementing class.\n* Members of interface are implicitly\
    \ public, so need not be declared as public.\n\n```java\naccess interface name\
    \ [ extends interface [,interface] ] {\nreturntype method( [parameters] );\ndatatype\
    \ finalvariable = value;\n}\n```\n\nThe following example shows how to declare\
    \ an interface and how a class implements the interface.\n\n**<<interface>>**\n\
    **Stack**\n**MyStack**\n+ push(String)\n+ push(String)\n+ pop():String\n+ pop():String\n\
    + length(): int\n+ length() : int\n+ print():void\n\n**NOTE:** In UML, interface\
    \ resembles a class. One way to differentiate an interface from a class is to\
    \ use `<<interface>>` stereotype as shown above.\n\nSrikanth Technologies\nJava\
    \ Student’s Guide – Object-Oriented Programming II\n4\n\n```java\ninterface Stack\
    \ {\n    void push(String value);\n    String pop();\n    int length();\n}\n```\n\
    \n`Stack` is a data structure that stores data in such a way that last value pushed\
    \ is first value to be popped (LIFO).\n\n### Implementing an interface\n\nThe\
    \ following class - `MyStack`, implements `Stack` interface and provides definition\
    \ for methods in the interface. It also adds a new method – `print()` to print\
    \ all values in the stack.\n\n```java\n01: class MyStack implements Stack {\n\
    02: private String a[] = new String[10];\n03: private int top = 0;\n04: public\
    \ void push(String value) {\n05: a[top] = value;\n06: top++;\n07: }\n08: public\
    \ String pop() {\n09: top --;\n10: return a[top];\n11: }\n12: public int length()\
    \ {\n13: return top;\n14: }\n15: public void print() {\n16: for ( int i = 0; i\
    \ < top ; i ++) {\n17: System.out.println (a [i]);\n18: }\n19: }\n20: }\n```\n\
    \nThe following `main()` creates an object of `MyStack` class and calls its methods.\n\
    \nSrikanth Technologies\nJava Student’s Guide – Object-Oriented Programming II\n\
    5\n\n```java\n01: class UseMyStack {\n02: public static void main(String[] args)\
    \ {\n03: MyStack ms = new MyStack();\n04: ms.push(\"First\");\n05: ms.push(\"\
    Second\");\n06: ms.print();\n07: System.out.println( ms.pop());\n08: }\n09: }\n\
    ```\n\n**NOTE:** A class can narrow the accessibility of interface method nor\
    \ specify new exceptions in the method’s `throws` clause. For example, a method\
    \ declared in interface cannot be overridden with any narrower than public as\
    \ it is implicitly declared as public.\n\n### Using object reference of an Interface\n\
    \nAn object reference of an interface can refer to object of implementing class.\
    \ For example, `Stack s = new MyStack()` The following code snippet shows how\
    \ to use object reference of interface.\n\n```java\nStack s;\ns = new MyStack();\n\
    s.push(\"10\");\nSystem.out.println( s.pop());\ns.print();\n```\n\n**NOTE:** An\
    \ object reference of interface can refer to object of implementing class. However,\
    \ only methods in interface can be called using object reference of interface.\
    \ A single class can implement multiple interfaces. *Multiple inheritance* is\
    \ supported using interfaces.\n\n**<<interface>>**\n**<<interface>>**\n**Stack**\n\
    **Printable**\n+ push(String)\n+ pop():String\n+ print()\n+ length() : int\n**MyStack**\n\
    + push(String)\n+ pop():String\n+ length() : int\n+ print():void\n\n```java\n\
    interface Printable {\n    void print();\n}\n\nclass MyStack implements Stack,\
    \ Printable {\n    //\n}\n```\n\nSrikanth Technologies\nJava Student’s Guide –\
    \ Object-Oriented Programming II\n6\n\n## An interface extending another\n\n*\
    \ An interface can extend **one or more** interfaces.\n* A class implementing\
    \ the interface must define all the methods in the entire inheritance chain.\n\
    * The interface being extended is called as *superinterface* and the one extending\
    \ is called as *subinterface*.\n\n```java\ninterface A{\n    void m1();\n}\n\n\
    interface B extends A {\n    void m2();\n}\n\nclass c1 implements B {\n    //\
    \ implements both m1 and m2\n}\n```\n\n## Default Methods in Interface\n\n* Default\
    \ methods enable you to add new functionality to the interfaces and ensure binary\
    \ compatibility with code written for older versions of those interfaces.\n* You\
    \ specify that a method definition in an interface is default with the `default`\
    \ keyword at the beginning of the method signature.\n* All method declarations\
    \ in an interface, including default methods, are implicitly public, so you can\
    \ omit the public modifier.\n* When you extend an interface that contains a default\
    \ method, you can do the following:\n* Not mention the default method at all,\
    \ which lets your extended interface inherit the default method.\n* Redeclare\
    \ the default method, which makes it abstract.\n* Redefine the default method,\
    \ which overrides it.\n\n## Static methods in Interface\n\n* You can define static\
    \ methods in interfaces using `static` keyword.\n"
