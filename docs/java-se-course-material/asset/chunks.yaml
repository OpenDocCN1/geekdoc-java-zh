  trans: "\n\n所有的字节流都源自 `InputStream` 或 `OutputStream`。\n\n## 字符流\n- 将流视为字符集合。\n-\
    \ 它们使用 Unicode，因此可以进行国际化。\n- 在层次结构的顶端有两个抽象类——`Reader` 和 `Writer`。\n\n## 字节流\n\
    - `InputStream`\n- `OutputStream`\n\n## 字符流\n- `Reader`\n- `Writer`\n\nJava 学生指南\
    \ - 库-II\n\n## 预定义流\n- `java.lang` 包中的 `System` 类包含三个静态变量——`in`、`out` 和 `err`。\n\
    - `System.out` 指标准输出流，默认为控制台。\n- `System.in` 指标准输入流，默认为键盘。\n- `System.err` 指标准错误流，默认为控制台。\n\
    - `System.in` 的类型为 `InputStream`。`System.out` 和 `System.err` 是 `PrintStream` 类型的对象。\n\
    \n## Reader 类\n`Reader` 是 `java.io` 包中的一个 `abstract`（抽象）类。该类提供了从文本流中读取数据最基础的方法。\n\
    \n### 方法\n| 方法 | 含义 |\n| :--- | :--- |\n| `int read()` | 读取一个字符。文件结束（EOF）时返回 -1。它返回字符的\
    \ Unicode 编码。 |\n| `int read(char buf[])` | 将字符读取到数组中。返回读取的字节数。如果在数组填充之前遇到文件结束，`buf`\
    \ 可能未被完全填充。 |\n| `long skip(long n)` | 跳过指定数量的字符。 |\n| `void close()` | 关闭流。 |\n\
    | `boolean markSupported()` | 如果流支持标记（mark）操作返回 true。用于检查流是否支持标记。 |\n| `void mark(int\
    \ readAheadLimit)` | 标记流中的当前位置。参数 `readAheadLimit` 指定了在保留标记的同时可以读取的字符数。 |\n| `void\
    \ reset()` | 如果流已被标记，则尝试将其重置到标记位置。 |\n\n## FileReader 类\n- `FileReader` 类是 `InputStreamReader`\
    \ 类的子类，而 `InputStreamReader` 是 `Reader` 类的子类。它的构造函数接收要打开的文件名。\n- 它用于从文件中读取字符。文件可以作为\
    \ `string` 或或 `File` 类的对象给出。\n- `FileReader(File file)`\n- `FileReader(String\
    \ fileName)`\n\n以下程序从用户获取文件名并在屏幕上显示其内容。\n\n```java\nimport java.io.FileReader;\n\
    import java.util.Scanner;\n\npublic class ReadFile {\n    public static void main(String\
    \ args[]){\n        try {\n            Scanner s = new Scanner(System.in);\n \
    \           System.out.println(\"Enter filename :\");\n            String filename\
    \ = s.nextLine();\n            FileReader fr = new FileReader(filename);\n   \
    \         int ch; // 必须是 int，因为 read() 返回 int\n            ch = fr.read(); //\
    \ 在 EOF 时返回 -1\n            while ( ch != -1) {\n                System.out.print((char)ch);\n\
    \                ch = fr.read();\n            }\n            fr.close();\n   \
