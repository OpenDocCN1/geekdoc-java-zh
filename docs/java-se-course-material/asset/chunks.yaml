    # STANDARD OR PRIMITIVE DATA TYPES IN JAVA


    The table below shows the list of data types available in Java along with number
    of bytes occupied by the data type and range of values that can be stored in the
    data type.


    | Data Type | Size (Bytes) | Range |

    | :--- | :--- | :--- |

    | byte | 1 | -128 to 127 |

    | short | 2 | -32768 to 32767 |

    | int | 4 | -2147483648 to 2147483647 |

    | long | 8 | -9223372036854775808 to 9223372036854775807 |

    | float | 4 | 1.7e-308 to 1.7e+308 |

    | double | 8 | 3.4e-038 to 3.4e+038 |

    | boolean | | true or false |

    | char | 2 | Supports Unicode characters. |


    * All numeric types in Java are signed.

    * The size of `boolean` is JVM dependent.

    * Data type `char` occupies two bytes because it supports Unicode, which needs
    16 bits to store characters.

    * Unicode supports characters of all languages and some languages of Japanese
    and Chinese have more than 256 characters.

    * The size of data types does NOT change from platform to platform.


    **NOTE**: Java doesn’t allow an un-initialized variable to be used. By default
    local variables are not initialized by Java.


    Srikanth Technologies


    # Getting Started With Java


    17


    ## RULES TO CREATE IDENTIFIER


    A name in the program is called as identifier. The following rules are to be followed
    while creating identifier.


    * Can contain letters, digits, `_` (underscore) and `$`.

    * Must NOT begin with a number. Can start with currency symbol (`$`) or `_` (underscore).

    * Keywords of Java cannot be used.


