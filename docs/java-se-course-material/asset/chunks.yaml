    ## Associativity


    Associativity specifies whether operators are grouped from left right or right
    left. `++` and `--` operators are having right to left and other operators are
    having left to right.


    ## Conversion and Type Casting


    * Java allows assignment between variables of compatible types.

    * Java promotes all integer types such as `byte` and `short` to `int`.

    * When we are converting a large data type to short data type, explicit `type
    casting` is required.


    ```java

    // will FAIL as 10.50 is taken as double

    float f = 10.50;

    // Use f as suffix to indicate float

    float f = 10.50f;

    // converts double to float and then assigns

    float f = (float)10.50;

    ```


    ## Assignment Operator


    Assignment operator `=` is used to assign a value to a variable. The value may
    be either a literal or an expression. The variable and result of the expression
    must be of compatible data types. Java also supports multiple assignments, where
    you can assign a single value to multiple variables in a single assignment.


    ```

    a = 0;

    a = b = c = 0;

    ```


