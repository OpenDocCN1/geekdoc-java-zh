    \ 0.0。有效范围为 0.0 到 1.0。 |\n\n# 使用绝对定位 - 空布局布局管理器\n\n- 可以不使用布局管理器并在绝对位置放置组件。然而，必须谨慎使用绝对位置。\n\
    - 如果组件的大小不依赖于容器的大小，那么使用绝对位置是有意义的。\n- 为了使用绝对定位，将容器的布局管理器设置为 `null`，并对每个组件使用 `setBounds()`\
    \ 方法来指定左、右、宽和高。\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\npublic\
