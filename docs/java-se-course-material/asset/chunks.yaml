    ## 转义序列


    以下是 Java 支持的转义序列。


    | 字符 | 含义 |

    | :--- | :--- |

    | `\"` | 双引号 |

    | `\''` | 单引号 |

    | `\\` | 反斜杠 |

    | `\r` | 回车 |

    | `\n` | 换行 |

    | `\f` | 换页 |

    | `\t` | 制表符 |

    | `\b` | 退格 |


    ## JAVA 运算符


    运算符对给定的值（操作数）执行特定操作。运算符分为不同的类别。


    ### 算术运算符


    | 运算符 | 含义 |

    | :--- | :--- |

    | `++` | 递增 |

    | `--` | 递减 |

    | `*` | 乘法 |

    | `/` | 除法 |

    | `%` | 取模 |

    | `+` | 加法 |

    | `-` | 减法 |


    Srikanth Technologies


    # Java 入门


    20


    ## 结合性


    结合性指定运算符是从左到右还是从右到左分组。`++` 和 `--` 运算符从右到左，其他运算符从左到右。


    ## 转换和类型转换


    * Java 允许兼容类型之间的赋值。

    * Java 将 `byte` 和 `short` 等整数类型提升为 `int`。

    * 当我们将大数据类型转换为短数据类型时，需要显式的 `类型转换`。


    ```java

    // 将失败，因为 10.50 被视为 double

    float f = 10.50;

    // 使用 f 作为后缀表示 float

    float f = 10.50f;

    // 将 double 转换为 float 然后赋值

    float f = (float)10.50;

    ```


    ## 赋值运算符


    赋值运算符 `=` 用于给变量赋值。该值可以是字面量或表达式。变量和表达式的结果必须是兼容的数据类型。Java 还支持多次赋值，你可以在单次赋值中为多个变量分配单个值。


    ```

    a = 0;

    a = b = c = 0;

    ```


    Srikanth Technologies


    # Java 入门


    21


    ## 关系运算符


    * 所有关系运算符都是二元运算符。

    * 评估结果总是布尔值。

    * 关系运算符具有从左到右的结合性。


    | 运算符 | 含义 |

    | :--- | :--- |

    | `==` | 等 |

    | `>` | 大于 |

    | `<` | 小于 |

    | `<=` | 小于等于 |

    | `>=` | 大于等于 |

    | `!=` | 不等于 |


    ## 逻辑运算符与短路


    逻辑运算符结合两个条件并返回布尔值。下表显示了逻辑运算符。


    | 运算符 | 含义 |

    | :--- | :--- |

    | `&` | 与 (AND) |

    | `|` | 或 (OR) |

    | `^` | 异或 (XOR) |

    | `\|` | 短路或 |

    | `&&` | 短路与 |

    | `!` | 一元非 (NOT) |


    ## 短路逻辑运算符 (&& 和 ||)


    短路运算符只检查必要的条件，并不总是检查两个条件。一旦知道条件的结果，评估就会停止。


    * `&&` 如果第一个条件为假，则不检查第二个条件。

    * `||` 如果第一个条件为真，则不检查第二个条件。


    Srikanth Technologies


    # Java 入门


    22


    ```java

    if (a > b && a > c)

    ```


    如果条件 `a > b` 为假，则返回假且不检查第二个条件 (a > c)。


    ```java

    if (a == b || a == c)

    ```


