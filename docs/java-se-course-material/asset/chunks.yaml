    ### Getting Started With Java - 1


    ### WHAT WILL YOU LEARN?


    At the end of this module you will have learnt the following:


    - What is Java?

    - History of Java

    - Editions of Java

    - Relationship between C, C++ and Java

    - Features of Java language

    - Java and Platform Independence

    - Using Java SE

    - First Java Program – `Hello.java`

    - Standard or Primitive data types

    - Operators in Java

    - Control Statements

    - Printing values using `System.out.printf()`

    - Reading input using `Scanner`

    - Creating and using arrays

    - Variable number of arguments

    - Command line parameters

    - Exercises


    Srikanth Technologies


    ### Getting Started With Java - 2


    ### WHAT IS JAVA?


    - A general purpose programming language.

    - Invented by `James Gosling`, Patrick Naughton, Chris Warth, Ed Frank and Mike
    Sheridan at Sun Microsystems.

    - Java was released in `May, 1995`.

    - Most widely used programming language.

    - Mainly used to develop web and enterprise applications.

    - Provides “write once and run anywhere” features – Platform independence.

    - Influenced by `C` and `C++`.

    - Derives its syntax from C and C++. However, it eliminated features of C++ such
    as multiple inheritance, operator overloading, friend function etc. that could
    cause ambiguity.


    ## HISTORY OF JAVA


    The following are various versions of Java, when they were released and what features
    were added.


    - Java 1.0 was released in `May, 1995`. Java was initially called as “oak” and
    then renamed to Java. `JDK` (Java Development Kit) 1.0 was released on `January
    23, 1996`.

    - Java 1.1 was released to add features like inner classes, `JDBC`, `RMI`, JavaBeans
    and new event handling model. `JDK` 1.1 was released on `January 23, 1997` (Note:
    text says 1996, but context implies sequence).

    - Java 1.2 was released on `February 19, 1998`. Added `JIT` (Just In Time) compiler,
    `Swing`.

    - Java 1.3 added `JavaSound`, `JNDI` and was released on `May 8, 2000`.

    - Java 1.4 added regular expressions, `XML`, assertions, and non-blocking `IO`.
    It was released on `February 6, 2002`.

    - Java 1.5 also known as Java 5.0 was released on `September 30, 2004`. Added
    `generics`, `annotations`, `enumerations`, `autoboxing`.

    - Java 1.6 also known as Java 6.0 was released on `December 11, 2006`. Added `JDBC
    4.0`, GUI improvements.

    - Java 7.0 also known as Java 1.7 was released on `July 7, 2011`.

    - Java 8.0 was released on `March 18, 2014`. Added `Lambda expressions` and `Streams`.


    ## EDITIONS OF JAVA


    Java is provided as three different editions, where each edition is meant for
    different types of applications.


    - Java Standard Edition – `Java SE`

    - Java Enterprise Edition – `Java EE`

    - Java Micro Edition – `Java ME`


    ### Java SE (Standard Edition)


    This is used to develop Console applications, Applets and Frame-based applications
    (desktop applications).

    This edition provides features of language, core API (Application Program Interface)
    related to `IO Stream`, `Networking`, Data structures using `Collections Framework`.

    This edition comes with Java compiler, `JVM` and other tools to develop applets
    and desktop applications.


    ### Java EE (Enterprise Edition)


    This is used to develop web applications, web services, and enterprise applications.
    It uses Java Language and core API.

    It is a set of specifications to be implemented by products. BEA’s `Weblogic`
    server, IBM’s `Webphere`, Open source product `JBoss`, `Glassfish` etc. implement
    Java EE specifications.

    Major topics of Java EE are `Servlets`, `JSPs`, `Enterprise Java Beans (EJB)`,
    `Java Mailing`, `Java Messaging Service (JMS)` etc.


    ### Java ME (Micro Edition)


    This edition is used to develop software that can be embedded into micro devices.
    It uses Java language and its core API. Some mobile phones use software developed
    using Java ME.


    ## RELATIONSHIP BETWEEN C, C++ AND JAVA


    - `C` was released in `1970`. `C++` was released in `1980`. Java was released
    in `1995`.

    - `C` and `C++` are meant for System programming whereas Java is meant for application
    programming.

    - Java uses control structures such as `if`, `for` etc. of `C` language.

    - Java does not support pointers, pointer arithmetic and `unions`.

    - Java and `C++` have `OOP` (Object oriented programming) as common feature.

    - However, Java has ignored a lot of features of `C++` as these...

