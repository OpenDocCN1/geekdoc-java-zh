    \ array – 2 X 3\nint bb[][]= {{1,2,3},{4,5,6}};\n```\n\n**NOTE**: Elements of\
    \ an array are automatically initialized to default value according to data type\
    \ of array.\n\n## VARIABLE NUMBER OF ARGUMENTS\n\n- Java allows a method to take\
    \ variable number of arguments.\n- The argument is declared with `…` (ellipses)\
    \ after data type and before the name.\n- Must be the last argument in a method.\n\
    - Argument is treated as an array inside the method.\n\n```java\n01: public class\
    \ VaryingArguments {\n02: public static void main(String[] args) {\n03: System.out.println(getSum(10,\
    \ 20, 30));\n04: System.out.println(getSum(100, 200) );\n05: }\n06: public static\
    \ int getSum(int... nums) {\n07: int total = 0;\n08: for (int n: nums) {\n09:\
    \ total += n;\n10: }\n11: return total;\n12: }\n13: }\n```\n\nSrikanth Technologies\n\
    Getting Started With Java\n33\n\n## COMMAND LINE PARAMETERS\n\n- Parameters that\
    \ are passed at the time of invoking a java program from command line are called\
    \ as command line parameters.\n- These parameters can be used to provide input\
    \ to the program.\n- These parameters are accessible from `main()` through `args`\
    \ parameter, which is an array of strings.\n- The `length` attribute of `args`\
    \ returns the number of parameters passed on command line.\n\n```java\n01: //\
    \ program to display command-line parameters\n02: public class CLA {\n03: public\
    \ static void main(String args[]){\n04: System.out.printf(\"Args Count: %d\\n\"\
    ,args.length);\n05: // display parameters\n06: for(String s : args)\n07: System.out.println(s);\n\
    08: } // end of main\n09: }\n```\n\nCall the previous program from command line\
    \ as shown below:\n\n`c:\\jdk\\srikanth>java CLA One Two <Enter>`\nArgs Count\
    \ : 2\nOne\nTwo\n\n**NOTE**: Method `main()` must have a parameter of type `String[]`.\
    \ However, the name of this parameter could be anything. The following code is\
    \ same as code above.\n\nSrikanth Technologies\nGetting Started With Java\n34\n\
    \n```java\n01: public class CLA {\n02: public static void main(String a[]){\n\
    03: for (String s : a)\n04: System.out.println(s);\n05: }\n06: }\n```\n\n## Program\
    \ - Prime.java\n\nThis program checks whether the number given on the command\
    \ line is a prime number or not. Prime number is a number which has no factors\
    \ other than 1 and itself.\n\n```java\n01: // program to check whether a number\
    \ is prime\n02: public class Prime {\n03: public static void main(String[] args){\n\
    04: // check whether number is passed\n05: if (args.length == 0) {\n06: System.out.println(\"\
    Number is missing!\");\n07: return;\n08: }\n09: // convert args[0] to int\n10:\
    \ int n = Integer.parseInt( args[0] );\n11: boolean prime = true;\n12:\n13: for\
    \ ( int i = 2; i <= n/2; i ++) {\n14: if ( n % i == 0 ) {\n15: prime = false;\n\
    16: break;\n17: }\n18: } // end for\n19: if (prime)\n20: System.out.println(\"\
    Prime\");\n21: } else\n22: System.out.println(\"Not a prime\");\n23: } // end\
    \ of main\n24: }\n```\n\nSrikanth Technologies\nGetting Started With Java\n35\n\
    \nPrime program does the following:\n- It checks whether number is passed.\n-\
    \ If `args.length == 0`, it prints \"Number is missing!\" and returns.\n- It converts\
    \ `args[0]` to `int`.\n- It loops from `2` to `n/2`. If `n % i == 0`, it sets\
    \ `prime` to `false` and breaks.\n- Based on the `prime` variable, it prints \"\
