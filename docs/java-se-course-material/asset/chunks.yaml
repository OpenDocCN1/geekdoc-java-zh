    | `Object element()` | Retrieves, but does not remove, the head of the queue.
    Throws exception `NoSuchElementException` if queue is empty. |

    | `boolean offer(Object)` | Inserts an element into queue, if possible. |

    | `Object poll()` | Retrieves and removes the head of the queue or returns `null`
    if queue is empty. |

    | `Object remove()` | Retrieves and removes the head of this queue. Throws exception
    if queue is empty. |

    | `Object peek()` | Retrieves, but does not remove, the head of this queue, returns
    `null` if this queue is empty. |


