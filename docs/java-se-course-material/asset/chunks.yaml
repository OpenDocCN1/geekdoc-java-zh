    \n**注意**：`java.lang` 包会被自动导入。因此它的类如 `String`、`System`、`Integer` 等可以在不导入的情况下使用。\n\
    \n### CLASSPATH 变量\n\n- 包含了 Java 查找类和包的目录列表。\n- Java 编译器和运行时使用 `CLASSPATH` 变量来获取用于搜索所需类和包的文件夹和\
