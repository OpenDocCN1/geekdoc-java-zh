    ## Overloading Constructors


    Just like how it is possible to overload methods of a class, it is also possible
    to overload constructors of the class.


    ```java

    01: public class Number {

    02: int num;

    03: public Number(){

    04: num = 1;

    05: }

    06: public Number(int n){

    07: num = n;

    08: }

    09: }

    ```


    First constructor is called when an object is created without passing any parameter
    and second constructor is called when an object is created by passing a single
    `int` as parameter.


    `Number n1 = new Number();` // calls constructor `Number()`

    `Number n2 = new Number(100);` // calls `Number(int)`


    **NOTE:** It is NOT possible to create an object unless Java can invoke one of
    the constructors.


    ```java

    01: class A {

    02: int n;

    03: public A(int num){

    04: n = num;

    05: }

    06: public A(String s) {

    07: n = Integer.parseInt(s);

    08: }

    09: }

    ```


    Third line doesn’t compile as Java cannot call any constructor.


    `A obj1 = new A(10);`

    `A obj2 = new A("99");`

    `A obj2 = new A();` // not possible


