    \n### StringBuffer class\n\n`StringBuffer` represents a mutable character string\
    \ thus allowing string to be modified.\n\n- `StringBuffer(String)`\n- `StringBuffer(int\
    \ capacity)`\n- `StringBuffer()`\n\n| Method | Meaning |\n| :--- | :--- |\n| `void\
    \ setCharAt(index,char)` | Changes character at the given position. |\n| `StringBuffer\
    \ append(String)` | Appends string at the end. |\n| `StringBuffer append(char)`\
    \ | Appends character at the end. |\n| `StringBuffer append(char[])` | Appends\
