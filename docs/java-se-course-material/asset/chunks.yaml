    | ----- Book.class\n----- UseLibrary.class\n```\n\n包只能从其父目录访问（除非使用了 `CLASSPATH`）。在上面的示例中，包\
    \ `library` 只能从 `programs` 文件夹访问。\n\n### 导入语句 (Import Statement)\n\n使用 `import`\
    \ 语句将指定的类或包导入到当前源文件中。\n\n`import pkg1[.pkg2…].{classname|*}`\n\n`***` 意味着导入包中的所有的类，但它不会导入该包的子包。\n\
    \n**注意**：如果源文件中同时存在这两者，则 `import` 语句必须放在 `package` 语句之后。\n\n接的示例导入了 `st` 包的所有成员、`java.util`\
