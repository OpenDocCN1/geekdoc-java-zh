    Logical operators combine two conditions and return a boolean value. The following
    table shows logical operators.


    | Operator | Meaning |

    | :--- | :--- |

    | `&` | AND |

    | `|` | OR |

    | `^` | XOR (exclusive or) |

    | `||` | Short-circuit OR |

    | `&&` | Short-circuit AND |

    | `!` | Unary NOT |


    ## Short-circuit Logical Operators (&& and ||)


    Short-circuit operators check only the necessary conditions and do NOT check both
    the conditions always. Evaluation of condition stops once the outcome of the condition
    is known.


    * `&&` Doesn’t check second condition if first condition is false.

    * `||` Doesn’t check second condition if first condition is true.


