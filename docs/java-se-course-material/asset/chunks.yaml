  trans: "\n以下代码展示了如何使用包装类 `Integer` 将 `int` 转换为对象（装箱）并转换回 `int`（拆箱）。\n\n```java\n\
    int x =100;\n// convert int to an object\nInteger iobj = new Integer(x); // boxing\n\
    // get int from object\nx = iobj.intValue(); // unboxing\n```\n\nSrikanth Technologies\n\
    Java 学生指南 – 库-I\n26\n\n## 自动装箱 (Autoboxing)\n\n当基本数据数据类型被用作对象使用时，需要将其**装箱**为相应**包装**类的对象。当需要从包装类对象中获取原始值时，则需要使用包装类的方法从对象中**拆箱**。\n\
    \n从 Java 5.0 开始，Java 会自动进行**装箱**和**拆箱**。下面的示例展示了装箱和拆箱是如何发生的。\n\n```java\n01: public\
    \ static void main(String[] args) {\n02: int i=100;\n03: Integer iobj = i; //\
    \ autoboxing\n04: System.out.println( iobj.toString());\n05: i = iobj; // autounboxing\n\
    06: System.out.println(i);\n07: }\n```\n\nSrikanth Technologies\n面向对象编程部分 – II\n\
    Java 学生指南 – 面向对象编程 II\n2\n\n## 你将在本模块中学到什么？\n\n在本模块结束时，你将学习以下内容：\n\n* 创建接口 (Interface)\n\
    * 实现接口\n* 使用接口的对象引用\n* 一个接口继承另一个接口\n* 空接口 (Null interface)\n* 接口中的默认方法和静态方法\n\
    * 嵌套类 - 成员类、内部类\n* 创建包并将类放入包中\n* 访问包中的类\n* import 语句\n* `CLASSPATH` 变量\n* 访问修饰符\n\
    * 静态导入 static import\n* 枚举 (Enumeration)\n* 异常处理 (Exception Handling)\n* 处理多个异常\n\
    * 多异常捕获 (Multi-catch)\n* finally 块\n* 异常的类型 – 检查异常和非检查异常\n* 定义新异常\n* 更精确的重新抛出\n\
    * 断言 (Assertions)\n* 如何通过扩展 Thread 类创建新线程？\n* 如何通过实现 Runnable 接口创建新线程？\n* 线程生命周期\n\
    * Thread 类\n* 同步 (Synchronization)\n* 线程池 (Thread Pools)\n\nSrikanth Technologies\n\
    Java 学生指南 – 面向对象编程 II\n3\n\n## 接口 (INTERFACES)\n\n* 接口是方法的集合，实现类必须实现这些方法。\n* 接口定义了关于类必须做什么的合同，而不说明类将如何执行。\n\
    * 接口可以包含方法和变量的声明。\n* 实现类必须定义接口中声明的所有方法。\n* 如果一个类实现了一个接口但没有实现所有方法，则该类本身必须声明为抽象类\
    \ (abstract)。\n* 接口中的变量自动变为实现类的静态(static)和常量(final)变量。\n* 接口的成员隐式为公共(public)，因此不需要声明为\
    \ public。\n\n```java\naccess interface name [ extends interface [,interface] ]\
    \ {\nreturntype method( [parameters] );\ndatatype finalvariable = value;\n}\n\
    ```\n\n下面的示例展示了如何声明接口以及类如何实现该接口。\n\n**<<interface>>**\n**Stack**\n**MyStack**\n\
    + push(String)\n+ push(String)\n+ pop():String\n+ pop():String\n+ length(): int\n\
    + length() : int\n+ print():void\n\n**注意：** 在 UML 中，接口类似于类。区分接口与类的一种方法是使用如上所示的\
    \ `<<interface>>` 类型标记。\n\nSrikanth Technologies\nJava 学生指南 – 面向对象编程 II\n4\n\n\
    ```java\ninterface Stack {\n    void push(String value);\n    String pop();\n\
    \    int length();\n}\n```\n\n`Stack` 是一种数据结构，其存储数据的方式使得最后入的值是第一个弹出的值（后进先出 LIFO）。\n\
    \n### 实现接口\n\n以下类 `MyStack` 实现 `Stack` 接口并为接口中的方法提供了定义。它还添加了一个新方法 `print()`，用于打印栈中的所有值。\n\
    \n```java\n01: class MyStack implements Stack {\n02: private String a[] = new\
    \ String[10];\n03: private int top = 0;\n04: public void push(String value) {\n\
    05: a[top] = value;\n06: top++;\n07: }\n08: public String pop() {\n09: top --;\n\
    10: return a[top];\n11: }\n12: public int length() {\n13: return top;\n14: }\n\
    15: public void print() {\n16: for ( int i = 0; i < top ; i ++) {\n17: System.out.println\
    \ (a [i]);\n18: }\n19: }\n20: }\n```\n\n下面的 `main()` 创建了 `MyStack` 类的对象并调用其方法。\n\
    \nSrikanth Technologies\nJava 学生指南 – 面向对象编程 II\n5\n\n```java\n01: class UseMyStack\
    \ {\n02: public static void main(String[] args) {\n03: MyStack ms = new MyStack();\n\
    04: ms.push(\"First\");\n05: ms.push(\"Second\");\n06: ms.print();\n07: System.out.println(\
    \ ms.pop());\n08: }\n09: }\n```\n\n**注意：** 类可以收窄接口方法的访问权限，也可以在方法的 `throws` 子句中指定新的异常。例如，接口中声明的方法不能比\
    \ public 更窄，因为它隐式声明为 public。\n\n### 使用接口引用\n\n接口引用可以指向实现类。例如，`Stack s = new MyStack()`\
    \ 下面的代码片段展示了如何使用接口引用。\n\n```java\nStack s;\ns = new MyStack();\ns.push(\"10\"\
    );\nSystem.out.println( s.pop());\ns.print();\n```\n\n**注意：** 接口引用可以指向实现类。然而，只能调用接口中的方法。单个类可以实现多个接口。*多重继承*是通过接口实现的。\n\
    \n**<<interface>>**\n**<<interface>>**\n**Stack**\n**Printable**\n+ push(String)\n\
    + pop():String\n+ print()\n+ length() : int\n**MyStack**\n+ push(String)\n+ pop():String\n\
    + length() : int\n+ print():void\n\n```java\ninterface Printable {\n    void print();\n\
    }\n\nclass MyStack implements Stack, Printable {\n    //\n}\n```\n\nSrikanth Technologies\n\
    Java 学生指南 – 面向对象编程 II\n6\n\n## 一个接口继承另一个接口\n\n* 接口可以继承**一个或多个**接口。\n* 实现接口的类必须定义整个继承链中的所有方法。\n\
    * 被继承的接口称为超接口 (superinterface)，而继承其他的接口称为子接口 (subinterface)。\n\n```java\ninterface\
    \ A{\n    void m1();\n}\n\ninterface B extends A {\n    void m2();\n}\n\nclass\
    \ c1 implements B {\n    // 实现 m1 和 m2\n}\n```\n\n## 接口中的默认方法\n\n* 默认方法允许向接口添加新功能，并确保与旧版本的代码保持二进制兼容。\n\
    * 你可以使用 `default` 关键字指定接口中的方法定义为默认。\n* 接口中的所有方法声明（包括默认方法）都隐式为 public，因此你可以省略 public\
    \ 修饰符。\n* 当扩展包含默认方法的接口时，你可以执行以下操作：\n* 不提及默认方法，让你的扩展接口继承该默认方法。\n* 重申默认方法，将其变为抽象方法。\n\
    * 重新定义默认方法，对其进行重写。\n\n## 接口中的静态方法\n\n* 你可以使用 `static` 关键字在接口中定义静态方法。\n\n"
- fmt: "\n- You can keep static methods specific to an interface, in the same interface\
    \ rather than in a separate class.\n- Static methods of interface can be called\
    \ using interface name followed by method name. Ex. `Counter.printAuthor()`.\n\
    - To call static method we don’t need any implementation of interface or inheritance.\n\
    \n```java\npublic interface Counter {\n    void increment();\n    void decrement();\n\
    \    int getValue();\n    default int getIncrement() {\n        return 1;\n  \
    \  }\n    static void printAuthor() {\n        System.out.println(\"Srikanth Pragada\"\
    );\n    }\n}\n```\n\n```java\npublic class OneCounter implements Counter {\n \
    \   private int value;\n    @Override\n    public void increment() {\n       \
    \ value += getIncrement();\n    }\n    @Override\n    public void decrement()\
    \ {\n        value -= getIncrement();\n    }\n    @Override\n    public int getValue()\
    \ {\n        return value;\n    }\n}\n```\n\n```java\npublic class TenCounter\
    \ implements Counter {\n    private int value;\n    @Override\n    public void\
    \ increment() {\n        value += getIncrement();\n    }\n    @Override\n    public\
    \ void decrement() {\n        value -= getIncrement();\n    }\n    // Override\
    \ default implementation\n    @Override\n    public int getIncrement() {\n   \
    \     return 10;\n    }\n    @Override\n    public int getValue() {\n        return\
    \ value;\n    }\n}\n```\n\n```java\npublic class TestCounter {\n    public static\
    \ void main(String[] args) {\n        Counter.printAuthor();\n\n        OneCounter\
    \ c = new OneCounter();\n        c.increment();\n        System.out.println(c.getIncrement());\n\
    \        System.out.println(c.getValue());\n\n        TenCounter c2 = new TenCounter();\n\
    \        c2.increment();\n        System.out.println(c2.getValue());\n    }\n\
    }\n```\n\n## Functional Interface\n- An interface that contains only one abstract\
    \ method is called as functional interface.\n- Functional interface can have default\
    \ methods, but must have only one abstract method.\n- An interface can be explicitly\
    \ marked as functional interface using `@FunctionalInterface` annotation. However,\
    \ the compiler will treat any interface meeting the definition of a functional\
    \ interface as a functional interface regardless of whether or not a `FunctionalInterface`\
    \ annotation is present on the interface declaration.\n- Instances of functional\
    \ interfaces can be created with lambda expressions, method references, or constructor\
    \ references.\n- Examples are `Runnable`, `Comparable` and `Comparator`.\n\n```java\n\
    @FunctionalInterface\npublic interface Printable {\n    void print(String mgs);\n\
    \    default String newline() {\n        return \"\\n\";\n    }\n}\n```\n\n```java\n\
    class Print implements Printable {\n    public void print(String msg) {\n    \
    \    System.out.println(msg + newline());\n    }\n}\n```\n\n```java\npublic class\
    \ FITest {\n    public static void main(String args[]) {\n        Printable p\
    \ = new Print();\n        p.print(\"Hello\");\n        Printable p2 = FITest::print;\n\
    \        p2.print(\"Using Method Reference\");\n    }\n    public static void\
    \ print(String msg) {\n        System.out.println(msg);\n    }\n}\n```\n\n## Abstract\
    \ class vs. Interface\n- Both interface and abstract class cannot have objects,\
    \ but can have object references.\n- In case of interface, object reference can\
    \ reference an object of implementing class. An object reference of abstract class\
    \ can reference an object of subclass.\n- However, abstract class can have instance\
    \ variables, but interface cannot have instance variables.\n\n### Null interface\n\
    Java allows interfaces to be empty. An empty interface contains no variables and\
    \ methods. It is used to tag or mark a class as having certain property or behavior.\n\
    For example, `Serializable` interface is a null interface. A class implementing\
    \ `Serializable` interface informs to Java that it can be serialized (converted\
    \ to bytes and written to storage).\nNull interface is also known as `marker interface`.\n\
    \n## NESTED CLASSES\nNested class is a class defined in another class. Nested\
    \ class may be any one of the following types:\n- Static member class\n- Non-static\
    \ member class\n- Method-local inner class\n- Anonymous inner class\n\n### Static\
    \ member class\nA class created in another class with static modifier is called\
    \ as static member class. It can be used just like a normal class. However, to\
    \ access it from outside of enclosing class, we have to use the name of enclosing\
    \ class.\n\n```java\n// Top level class\nclass TLC {\n    static class SMC {\n\
    \        static void print() {\n            System.out.println(\"SMC\");\n   \
    \     }\n    }\n}\n\nclass TLCClient {\n    public static void main(String[] args)\
    \ {\n        TLC.SMC srec = new TLC.SMC();\n        srec.print();\n    }\n}\n\
    ```\nOutput: SMC\n\n### Non-static member class (inner class)\nA class defined\
    \ within another class without static modifier is called non-static member class.\
    \ It is also called inner class. Inner class has access to all variables and methods\
    \ of its outer class directly. Inner classes were introduced in version 1.1, mainly\
    \ to help handling events in AWT and Swing applications.\n\n```java\nclass OuterClass\
    \ {\n    private int m1 = 10;\n    class InnerClass {\n        private int m2\
    \ = 20;\n        public void print() {\n            System.out.printf(\"m1=%d\
    \ m2=%d\", m1, m2);\n        }\n    }\n}\n\npublic class InnerTest {\n    public\
    \ static void main(String args[]) {\n        OuterClass outer = new OuterClass();\n\
    \        OuterClass.InnerClass obj = outer.new InnerClass();\n        obj.print();\n\
    \    }\n}\n```\nOutput: m1=10 m2=20\n\n### Method-local inner class\nA class declared\
    \ inside a method is called local class. Only the method, in which the class is\
    \ defined, can create an instance of the class. Just like any other inner class,\
    \ a local inner class can access members of its outer class.\n\n```java\nclass\
    \ TLC {\n    private int v = 10;\n    public void somemethod() {\n        class\
    \ LocalClass {\n            public void print() {\n                System.out.printf(\"\
    Local class. Outer class value %d\\n\", v);\n            }\n        }\n      \
    \  LocalClass obj = new LocalClass();\n        obj.print();\n    }\n}\n\npublic\
    \ class LocalTest {\n    public static void main(String[] args) {\n        TLC\
    \ obj = new TLC();\n        obj.somemethod();\n    }\n}\n```\nOutput: Local class.\
    \ Outer class value 10\n\n### Anonymous Inner class\nAnonymous inner class combines\
    \ the process of defining an inner class and creating an object of inner class\
    \ into one step. It is a class without any name (anonymous).\n\n```\nnew <superclass\
    \ or interface> (optional arguments) {\n    Members definition\n}\n```\nThe optional\
    \ arguments are passed to constructor of super class. Anonymous class can extend\
    \ either a class or implement an interface. No `extends` or `implements` keyword\
    \ is required. The name given after keyword `new` is taken as class or interface.\n\
    \n**NOTE**: Anonymous classes cannot have any constructors as they don’t have\
    \ a name.\n\n```java\ninterface Stack {\n    void push(String value);\n    String\
    \ pop();\n}\n\nclass OuterClass {\n    public IStack getStack() {\n        //\
    \ anonymous class implements interface\n        return new Stack() {\n       \
    \ };\n    }\n}\n```\n*(Note: The provided source text used `IStack` in the final\
    \ block but defined the interface as `Stack`; I have maintained the logic of the\
    \ code snippet provided.)*\n"
