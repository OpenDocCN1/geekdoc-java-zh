    09: throws InvalidAmountException {

    10: if ( amount < 100 ) {

    11: throw new InvalidAmountException();

    12: }

    13: balance += amount;

    14: }

    15: public void withdraw(double amount) throws

    16: InvalidAmountException,InsufficientAmountException{

