    ## InetAddress class


    - This class represents an IP address and domain name.

    - `InetAddress` has factory methods that return an object of the class with required
    details.

    - Provides methods to get name and address.


    | Method | Meaning |

    | :--- | :--- |

    | `getAllByName(String host)` | Determines all IP addresses of the given host.
    |

    | `getHostAddress()` | Returns the IP address string. |

    | `getHostName()` | Returns the hostname for this address. |

    | `getLocalHost()` | Returns the local host. |


    The following program uses `InetAddress` class to get IP address of the given
    name.


