    \ Object-Oriented Programming II\n\n## PACKAGES\n\n- Package is a collection of\
    \ classes and interfaces.\n- Package allows you to store your classes and interface\
    \ without name collision as two packages may have same names for classes and interfaces.\n\
    - Packages are stored in hierarchical manner. A package may be nested in another\
    \ package. For example, `java.util`, `java.lang` etc. In `java.util`, `util` is\
    \ a package that is in another package `java`.\n- A package is a `folder` in the\
    \ underlying operating system.\n\n**NOTE**: All the classes that are not explicitly\
    \ stored in any package are stored in `default` `package` or unnamed package,\
    \ which is the current directory. And these classes are accessed directly without\
    \ any package prefix.\n\n### Creating a package and placing a class in it\n\n\
    - Use `package` statement to specify the package to which classes and interfaces\
    \ belong to.\n- The `package` statement is applied to all classes and interfaces\
    \ in the source file.\n- A folder, in the file system of Operating System, with\
    \ the same name as the package is to be created.\n- The `.class` file must be\
    \ stored in the package (directory).\n- Once a class is placed in a package, it\
    \ must always be accessed using package name as prefix – `packagename.classname`.\n\
    \n`package <fully qualified package name>`\n\nThe following example shows how\
    \ to create a class in a package called `library`. The package `library` must\
    \ be created by creating a folder with that name.\n\n```java\n01: package library;\
    \ // “Book” class belongs to library package\n02: public class Book {\n03: //\
    \ class code\n04: }\n```\n\n**NOTE**: If `package` statement is used then it must\
    \ be the first statement in the source file.\n\nClass `Book` belongs to package\
    \ `library`. Apart from using package statement in `.java` file (as shown above),\
    \ `Book.class` must be placed in folder `library` to make `Book` class belong\
    \ to library package.\n\n**NOTE**: A class with `public` access may be accessed\
    \ from outside package, whereas a class with `default` access (no access) is confined\
    \ to package in which it is defined.\n\nIf you want two public classes to belong\
    \ to the same package then each class must be placed in a different `.java` file\
    \ as shown below.\n\n```java\n01: // Book.java\n02: package library;\n03: public\
    \ class Book {\n04: // body of Book class\n05: }\n\n01: // Member.java\n02: package\
    \ library;\n03: public class Member {\n04: // body of class\n05: }\n```\n\n###\
    \ Accessing classes of a package\n\nYou can access a member of the package by\
    \ using package name followed by dot (`.`). A member of the package must be prefixed\
    \ with package name. The following code shows how to access `Book` class of `library`\
    \ package.\n\n```java\n01: public class UseLibrary {\n02: public static void main(String[]\
    \ args) {\n03: library.Book b = new library.Book();\n04: }\n05: }\n```\n\nThe\
    \ hierarchy of folders is as follows:\n```\nc:\\jdk\\srikanth\n|\n---- library\n\
    | |\n| ----- Book.class\n----- UseLibrary.class\n```\n\nA package can be accessed\
    \ only from its parent directory (unless `CLASSPATH` is used). In the above example,\
    \ package `library` can be accessed only from `programs` folder.\n\n### Import\
    \ Statement\n\nUse `import` statement to import specified classes or packages\
    \ into current source file.\n\n`import pkg1[.pkg2…].{classname|*}`\n\n`***` means\
    \ all classes of the package are to be imported, but it does not import subpackages\
    \ of the package.\n\n**NOTE**: The `import` statement must be given after `package`\
    \ statement in the source file if both exist.\n\nThe following examples import\
    \ all members of package `st`, `Date` class in `java.util` package and all classes\
    \ of `java.text` package.\n\n```java\nimport st.*;\nimport java.util.Date;\nimport\
    \ java.text.*;\n```\n\n**NOTE**: Importing a package only imports classes in the\
    \ package, but not nested packages in the package. So, classes in each nested\
    \ package are to be explicitly imported.\n\n**NOTE**: Package `java.lang` is automatically\
    \ imported. So its classes like `String`, `System`, `Integer` etc. can be used\
    \ without importing them.\n\n### CLASSPATH variable\n\n- Contains the list of\
    \ directories where Java will look for classes and packages.\n- Java compiler\
    \ and runtime use `CLASSPATH` variable to get the list of folders and `.jar` files\
    \ that are to be searched for the required classes and packages.\n- By default\
    \ `java` searches for the current directory.\n- But once `CLASSPATH` is set Java\
    \ uses only the specified directories and standard library.\n\n```bash\nset classpath=.;c:\\\
    jdk\\srikanth\n```\n\n### JAR (Java Archive) File\n\nA JAR file contains packages,\
    \ classes and interfaces. By including `.jar` file in `CLASSPATH` we can make\
    \ its interfaces available. The `JAR` utility, which is provided with JDK, is\
    \ used to create and extract JAR files. This tool is invoked from command prompt.\n\
    \nThe following command creates a JAR file to contain all `.class` files in library\
    \ folder. Flag `c` stands for create, `f` stands for file and `v` stands for verbose.\n\
    \n```bash\nC:\\jdk\\srikanth>jar cfv library.jar *.class\n```\n\nYou can see the\
    \ content of a JAR file using flag `t` (table of content) as follows:\n\n```bash\n\
    C:\\jdk\\srikanth>jar ft library.jar\n```\n\nYou need not extract JAR file to\
    \ use its classes. Just including `.jar` file in `CLASSPATH` will do. So to use\
    \ `library.jar` that is placed in `c:\\java` folder, we need to set classpath\
    \ as follows:\n\n```bash\nset classpath=.;c:\\jdk\\srikanth;c:\\java\\library.jar\n\
    ```\n\n### Access Modifiers\n\nAccess modifiers specify from where a member can\
    \ be accessed. The following are the available access modifiers for member of\
    \ a class and their meaning.\n\n| Access Modifier | Meaning |\n| :--- | :--- |\n\
    | `private` | Allows member to be accessed only from the class in which it is\
    \ defined. |\n| `protected` | Allows member to be accessed from the class and\
    \ all its subclasses and also from any class in the same package. |\n| `default`\
    \ | Allows members to be accessed throughout the package to which the class belongs.\
    \ If no access modifier is given then Java uses *default* as access modifier.\
    \ |\n| `public` | Allows a member to be accessed from anywhere. |\n\n**NOTE**:\
    \ For top level classes, only `public` and `default` access modifiers are applicable.\
    \ However, inner classes can have `private` and `protected` modifiers also. The\
    \ following example demonstrates how access modifiers influence the access of\
    \ members from subclasses, other classes in the same package and other packages.\n\
    \n**A.java**\n```java\npackage p1;\npublic class A {\n    private int v1;\n  \
    \  protected int v2;\n    public int v3;\n    int v4; // default access\n}\n```\n\
    \n**B.java**\n```java\npackage p1;\npublic class B extends A {\n    public void\
    \ print() {\n        // can access v2, v3, v4\n    }\n}\n```\n\nSrikanth Technologies\n\
    Java Student’s Guide – Object-Oriented Programming II\n"
