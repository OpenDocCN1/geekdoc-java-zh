  trans: "\n\n# 序列化\n\n- 序列化是将对象的状态（实例变量的值）写入字节流的过程。\n- 序列化允许将对象数据存储在磁盘上，并在以后通过反序列化过程进行检索。\n\
    - 序列化还用于分布式应用程序，以便在跨网络中从一个系统向另一个系统发送和接收对象数据——例如它被用于 `RMI`（远程方法调用）。\n\n## Serializable\
    \ 接口\n\n为了序列化一个类的对象，该类必须实现 `Serializable` 接口。`Serializable` 是一个空接口——一个没有任何方法的接口。通过实现\
    \ `Serializable` 接口，类可以告知 Java 该类的对象是可以序列化的。\n\n## ObjectOutput 和 ObjectInput\
    \ 接口\n\n- `ObjectOutput` 接口继承 `DataOutput` 接口，并通过提供 `writeObject()` 方法支持对象序列化。\n\
    - `ObjectInput` 接口继承 `DataInput` 接口，并使用 `readObject()` 方法支持对象反序列化。\n\n## ObjectOutputStream\
    \ 和 ObjectInputStream 类\n\n- `ObjectOutputStream` 类实现了 `ObjectOutput` 接口并继承了 `OutputStream`\
    \ 类。\n- `ObjectInputStream` 类实现了 `ObjectInput` 接口并继承了 `InputStream` 类。\n\n以下是这些类的构造函数：\n\
    - `ObjectOutputStream(OutputStream)`\n- `ObjectInputStream(InputStream)`\n\n`OutputStream`\
    \ 是写入对象数据的流，`InputStream` 是从中读取对象数据的流。\n\n```java\nimport java.io.Serializable;\n\
    class Person implements Serializable {\n    private String name,email;\n    public\
    \ Person(String name, String email) {\n        this.name = name;\n        this.email\
    \ = email;\n    }\n    public String toString() {\n        return name + \",\"\
    \ + email;\n    }\n}\n```\n\n```java\nimport java.io.*;\npublic class SerializeObject\
    \ {\n    public static void main(String ...args) {\n        Person p=new Person(\"\
    Sri\",\"sri@gmail.com\");\n        try (FileOutputStream output = new FileOutputStream(\"\
    srikanth.dat\")){\n            ObjectOutputStream outstream = new ObjectOutputStream(output);\n\
    \            outstream.writeObject(p);\n        } catch(Exception ex){\n     \
    \       System.out.println(ex);\n        }\n    }\n}\n```\n\n```java\nimport java.io.FileInputStream;\n\
    import java.io.ObjectInputStream;\npublic class DeserializeObject {\n    public\
    \ static void main(String[] args){\n        // deserialize the object\n      \
    \  try (FileInputStream input = new FileInputStream(\"srikanth.dat\")) {\n   \
    \         ObjectInputStream instream = new ObjectInputStream(input);\n       \
    \     // read object from stream and cast to Person\n            Person p = (Person)\
    \ instream.readObject();\n            System.out.println(p.toString());\n    \
    \    } catch(Exception ex){\n            System.out.println(ex);\n        }\n\
    \    }\n}\n```\n\n## 字符流对比字节流\n\n下表显示了字符流及其对应的字节流。\n\n| 字符流 | 字节流 |\n| :--- |\
    \ :--- |\n| Reader | `InputStream` |\n| Writer | `OutputStream` |\n| FileReader\
    \ | `FileInputStream` |\n| FileWriter | `FileOutputStream` |\n| BufferedReader\
    \ | `BufferedInputStream` |\n| BufferedWriter | `BufferedOutputStream` |\n| PrintWriter\
    \ | `PrintStream` |\n| FilterReader | `FilterInputStream` |\n| LineNumberReader\
    \ | `LineNumberInputStream` |\n| PushbackReader | `PushbackInputStream` |\n\n\
    # 网络\n\n- Java 提供了允许你对互联网或 TCP/IP 网络进行编程类。\n- 所有类都通过 `java.net` 包提供。\n- 运行在不同系统上的\
    \ Java 程序之间的数据传输是通过 IO 流完成的。\n- 服务器可以使用多线程同时处理多个客户端。\n\n## Socket 编程\n\n- Socket\
    \ 允许运行在同一个 JVM 或不同 JVM 中的两个程序进行通信。\n- 服务器 socket 与一个称为 `port` 端口的数字关联。\n- 为了访问服务器\
    \ socket，客户端 socket 必须提供运行服务器 socket 的机器名称以及服务器 socket 监听的端口号。\n- 端口号是一个整数，用于唯一标识系统上的每个服务器\
    \ socket。系统名称和端口号唯一标识网络中的一个服务器 socket。\n- 一旦通过 socket 建立了连接，你就可以使用 `InputStream`\
    \ 从 socket 读取数据并使用 `OutputStream` 向 socket 写入数据。\n\n**端口=100**，**Host=“server”**\n\
    \n下表显示了一些常见的互联网应用程序及其端口号。\n\n| 端口 | 应用程序/协议 |\n| :--- | :--- |\n| 21 | 文件传输协议(FTP)\
    \ |\n| 23 | Telnet 协议 |\n| 25 | 简单邮件传输协议(SMTP) |\n| 80 | 超文本传输协议(HTTP) |\n| 110\
    \ | 邮局协议 (POP3) |\n\n## Socket 类\n\n- `Socket` 类表示客户端 socket。\n- 客户端 socket 连接到服务器\
    \ socket，后者是使用 `ServerSocket` 类创建的。\n- 服务器地址可以使用 IP 地址或计算机名称指定。\n\n| 方法 | 含义 |\n\
    | :--- | :--- |\n| `close()` | 关闭此 socket。 |\n| `getInetAddress()` | 返回 socket\
    \ 连接的地址。 |\n| `getInputStream()` | 返回此 socket 的输入流。 |\n| `getOutputStream()` |\
    \ 返回此 socket 的输出流。 |\n| `getPort()` | 返回 socket 连接的远程端口。 |\n\n## ServerSocket\
    \ 类\n\n- 使用给定的端口号创建服务器 socket。\n- 服务器 socket 等待客户端的请求并处理这些请求。\n\n| 方法 | 含义 |\n\
    | :--- | :--- |\n| `accept()` | 等待请求并返回客户端 socket。 |\n| `close()` | 关闭此 socket。\
    \ |\n| `getInetAddress()` | 返回服务器 socket 的本地地址。 |\n| `getLocalPort()` | 返回 socket\
    \ 监听的端口。 |\n\n以下程序创建一个服务器 socket，等待来自客户端的请求并将系统日期时间返回给客户端。\n\n```java\nimport\
    \ java.io.PrintWriter;\nimport java.net.*;\nimport java.util.Date;\npublic class\
    \ TimeServer {\n    public static void main(String args[]) throws Exception {\n\
    \        ServerSocket ss = new ServerSocket(2000);\n        System.out.println(\"\
    TimeServer is ready...\");\n        while (true) {\n            Socket cs = ss.accept();\
    \ // wait for client\n            PrintWriter pw = new PrintWriter(cs.getOutputStream(),\
    \ true);\n            pw.println(new Date().toString()); //to client\n       \
    \ } // end of while\n    } // end of main\n} // end of class\n```\n\n以下程序连接到服务器\
    \ socket `TimeServer`，然后读取服务器发送的数据。\n\n```java\nimport java.io.InputStream;\n\
    import java.net.Socket;\nimport java.util.Scanner;\npublic class TimeClient {\n\
    \    public static void main(String[] args) throws Exception {\n        // connect\
    \ to server at port number 2000\n        Socket cs=new Socket(\"localhost\",2000);\n\
    \        // get stream to read data from server\n        InputStream is = cs.getInputStream();\n\
    \        // Use Scanner to read a line\n        Scanner scanner = new Scanner(is);\n\
    \        String line = scanner.nextLine();\n        System.out.println(line);\n\
    \    }\n}\n```\n\n"
