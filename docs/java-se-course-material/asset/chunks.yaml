    ## Java 7.0 中更精确的重新抛出


    如果异常参数没有被修改，并且在 catch 块内部被重新抛出，编译器将应用更精确的分析来确定可以抛出的类型。


    在在下面的代码中，`throw ex;` 在 Java 6.0 中会导致错误，因为 `ex` 的类型是 `Exception`，而方法在 `throws`
    子句中仅有 `Ex1` 和 `Ex2`。异常类型比 `Ex1` 和 `Ex2` 通用得多，因此 Java 不允许我们抛出声明为 `Exception` 的
    `ex`。


    但 Java 7.0 应用了更精确的分析来确定正在抛出的异常类型。Java 7.0 识别到 try 块中只有两种可能的异常（`Ex1` 和 `Ex2`）可以被抛出，因此即使
    `ex` 被声明为 `Exception`，也允许重新抛出 `ex`。


    ```java

    01: class Ex1 extends Exception { }

    02: class Ex2 extends Exception { }

    03:

    04: public class RethrowException {

    05: public void m1(int v) throws Ex1 , Ex2 {

    06: try {

    07: if (v < 0) {

    08: throw new Ex1();

    09: }

    10: else

    11: if ( v > 100 ) {

    12: throw new Ex2();

    13: }

    14: // process

    15: }

    16: catch (Exception ex) {

    17: throw ex; // 在 6.0 中无法编译，但在 7.0 中可以工作

    18: }

    19: }

    20: }

    ```


