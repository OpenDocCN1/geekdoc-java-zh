    \n### Matcher class\n\n- A `Matcher` object is the engine that interprets the\
    \ pattern and performs match operations against an input string.\n- Like the `Pattern`\
    \ class, `Matcher` defines no public constructors.\n- You obtain a `Matcher` object\
    \ by invoking the `matcher` method on a `Pattern` object.\n\n#### Methods\n\n\
    | Method | Meaning |\n| :--- | :--- |\n| `int` `end()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html#end())\
    \ | Returns the index of the last character matched, plus one. |\n| `boolean`\
    \ `find()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html#find())\
    \ | Attempts to find the next subsequence of the input sequence that matches the\
    \ pattern. |\n| `String` `group()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html#group())\
    \ | Returns the input subsequence matched by the previous match. |\n| `boolean`\
    \ `matches()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html#matches())\
    \ | Attempts to match the entire input sequence against the pattern. |\n| `Pattern`\
    \ `pattern()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html)\
    \ | Returns the pattern that is interpreted by this matcher. |\n| `String` `replaceAll`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.replaceAll(java.lang.String))\
    \ | Replaces every subsequence of the input `String` replacement sequence that\
    \ matches the pattern with the given replacement string. |\n| `String` `replaceFirst`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.replaceFirst(java.lang.String))\
    \ | Replaces the first subsequence of the input `String` replacement sequence\
    \ that matches the pattern with the given replacement string. |\n| `int` `start()`](http://java.sun.com/j2se/1.4.2/docs/api/java/util/regex/Matcher.html#start())\
    \ | Returns the start index of the previous match. |\n\n```java\nimport java.util.regex.*;\n\
    public class MatcherDemo {\n    public static void main(String[] args) {\n   \
    \     Pattern p = Pattern.compile(\"[a-z]+\");\n        Matcher m = p.matcher(\"\
    123bbc434pqr343\");\n        while(m.find()) {\n            System.out.println(\"\
    start(): \" + m.start());\n            System.out.println(\"end(): \"+ m.end());\n\
    \            System.out.println(\"group(): \" + m.group());\n        }\n     \
    \   // pattern replacement\n        p = Pattern.compile(\"-+\");\n        m =\
    \ p.matcher(\"----12345----\");\n        String output = m.replaceAll(\"\");\n\
    \        System.out.println(output);\n    }\n}\n// Output start(): 3, end(): 6,\
    \ group(): bbc, start(): 10, end(): 13, group(): pqr\n```\n\n## LAMBDA EXPRESSIONS\n\
    \n- Lambda expression allows functionality to be passed as argument to a method.\n\
    - It is replacement for Anonymous class implements single abstract method (SAM)\
    \ interface.\n\n### Components of Lambda Expression\n\n- A comma-separated list\
    \ of formal parameters enclosed in parentheses.\n- You can omit parentheses if\
    \ there is only one parameter.\n- The arrow token `->` also known as lambda operator.\n\
    - A body, which consists of a single expression or a statement block.\n- If you\
    \ specify a single expression, then the Java runtime evaluates the expression\
    \ and then returns its value. No return statement is required.\n- Statement block\
    \ must be enclosed in braces `{}` and must have return statement.\n\n```java\n\
    interface Test {\n    boolean eval(int n1, int n2);\n}\npublic class LambdaDemo\
    \ {\n    public static void main(String[] args) {\n        // Old inner class\
    \ demo\n        Test t = new Test() {\n            @Override\n            public\
    \ boolean eval(int n1, int n2) {\n                return n1 > n2;\n          \
    \  }\n        };\n        System.out.println(t.eval(20,10));\n\n        // Lambda\
    \ expression\n        Test t2 = (int n1, int n2) -> n1 > n2;\n        System.out.println(t2.eval(20,10));\n\
    \n        // type inference, no need to mention data types\n        Test t3 =\
    \ (n1,n2) -> n1 > n2;\n        System.out.println(t3.eval(20,10));\n    }\n}\n\
    ```\n\n### Variable Scoping\n\n- Lambdas are lexically scoped. They do not introduce\
    \ a new level of scoping.\n- The `this` variable refers to the outer class, not\
    \ to the anonymous inner class that the lambda is turned into.\n- There is no\
    \ need for `OuterClass.this` variable unless lambda is inside a normal inner class.\n\
    - Lambdas cannot introduce new variables with same name as variables in method\
    \ that creates the lambda.\n- However, lambdas can refer to (but not modify) local\
    \ variables from the surrounding code.\n- Lambdas can still refer to (and modify)\
    \ instance variables from the surrounding class.\n\n## Method Reference\n\n- We\
    \ use lambda expressions to create anonymous methods.\n- However, when a lambda\
    \ expression does nothing but call an existing method, we can use method reference.\n\
    - Method references are compact, easy-to-read lambda expressions for methods that\
    \ already have a name.\n- The following example shows how to use method reference\
    \ to create a new thread.\n\n```java\npublic class ThreadWithJava8 {\n    public\
    \ static void main(String[] args) {\n        // New thread with lambda expression\n\
    \        Thread t1 = new Thread(() -> {\n            for (int i=1; i <= 10; i++)\n\
    \                System.out.println(i);\n        });\n        t1.start();\n\n\
    \        // Method reference\n        Thread t2 = new Thread(ThreadWithJava8::print);\n\
    \        t2.start();\n    }\n    static public void print() {\n        for (int\
    \ i = 1; i <= 10; i++) {\n            System.out.println(i);\n        }\n    }\n\
    }\n```\n\n### Kinds of Method References\n\nThe following are four kinds of method\
    \ references:\n\n1. Reference to a static method: `ContainingClass::staticMethodName`\n\
    2. Reference to an instance method: `ContainingObject::instanceMethodName` of\
    \ a particular object\n3. Reference to an instance method: `ContainingType::methodName`\
    \ of an arbitrary object of a particular type\n4. Reference to a constructor:\
    \ `ClassName::new`\n\n```java\npublic class MyTime {\n}\n```\n"
