    - 只要方法的参数不同，就可以在同一个类中定义两个或多个相同的方法。

    - 方法重载是实现多态的一种方式。

    - 方法可以根据参数的类型/数量进行重载。

    - 方法不能根据返回值类型进行重载。


    以下示例演示了在类中重载方法。


    ```java

    01: class Test {

    02: void m1(int n) { }

    03: void m1(String s) { }

    04: void m1(String s, int n) { }

    05: void m1(int n, String s) { }

    06: // 不允许，因为方法仅根据返回值类型不同

    07: int m2(int n) {}

    08: long m2(int n) {}

    09: }

    ```


