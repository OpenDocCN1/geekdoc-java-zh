    ## Files class


    - It consists exclusively of static methods that operate on files, directories,
    or other types of files.

    - It is part of `java.nio.file` package, which was introduced in Java 7.0.


    ### Method Description


    | Method | Description |

    | :--- | :--- |

    | `Path copy(Path source, Path target, CopyOption... options)` | Copy a file to
    a target file. |

    | `void delete(Path path)` | Deletes a file. |

    | `boolean deleteIfExists(Path path)` | Deletes a file if it exists. |

    | `boolean isDirectory(Path path, LinkOption... options)` | Tests whether a file
    is a directory. |

    | `Path move(Path source, Path target, CopyOption... options)` | Move or rename
    a file to a target file. |

    | `DirectoryStream<Path> newDirectoryStream(Path dir)` | Opens a directory, returning
    a `DirectoryStream` to iterate over all entries in the directory. |

    | `String probeContentType(Path path)` | Probes the content type of a file. |

    | `List<String> readAllLines(Path path, Charset cs)` | Reads all lines from a
    file. |

    | `long size(Path path)` | Returns the size of a file (in bytes). |

    | `Path walkFileTree(Path start, FileVisitor<? super Path> visitor)` | Walks a
    file tree. |


    ## Path interface


    - A `Path` object represents a path that is hierarchical and composed of a sequence
    of directory and file name elements separated by a special separator or delimiter.

    - The [`toPath`](http://docs.oracle.com/javase/7/docs/api/java/io/File.html#toPath())
    method may be used to obtain a `Path` from the abstract path name represented
    by a `java.io.File` object.


    ### Method Description


    | Method | Description |

    | :--- | :--- |

    | `Path getFileName()` | Returns the name of the file or directory denoted by
    this path as a `Path` object. |

    | `FileSystem getFileSystem()` | Returns the file system that created this object.
    |

    | `Path getName(int index)` | Returns a name element of this path as a `Path`
    object. |

    | `int getNameCount()` | Returns the number of name elements in the path. |

    | `Path getParent()` | Returns the parent path, or null if this path does not
    have a parent. |

    | `Iterator<Path> iterator()` | Returns an iterator over the name elements of
    this path. |

    | `WatchKey register(WatchService watcher, WatchEvent.Kind<?>... events)` | Registers
    the file located by this path with a watch service. |

    | `Path toAbsolutePath()` | Returns a `Path` object representing the absolute
    path of this path. |

    | `File toFile()` | Returns a `File` object representing this path. |

    | `URI toUri()` | Returns a `URI` to represent this path. |


    ## Paths class


    This class consists exclusively of static methods that return a [`Path`](http://docs.oracle.com/javase/7/docs/api/java/nio/file/Path.html)
    by converting a path string or [`URI.`](http://docs.oracle.com/javase/7/docs/api/java/net/URI.html)


    ### Method Meaning


    | Method | Meaning |

    | :--- | :--- |

    | `Path get(String... strings)` | Converts a path string, or a sequence of `String`
    more strings that when joined form a path string, to a `Path`. |

    | `Path get(URI uri)` | Converts the given `URI` to a `Path` object. |


    ## Removing blank lines from a File


    The following program is used to remove blank lines from a file. At the end of
    the process, the given source file should not have any blank lines. In order to
    achieve that, we adopt the following algorithm:


    - Open source file using `BufferedReader`.

    - Create a temporary target file using `FileWriter`.

    - Read a line from source file. If it is not blank line then write it into target
    file.

    - At the end, close both source and target files.

    - Move target file to source file.


    ```java

    01: import java.io.*;

    02: import java.nio.file.*;

    03: import java.util.Scanner;

    04: public class RemoveBlankLines {

    05: public static void main(String args[])

    06: throws Exception{

    07: Scanner s = new Scanner(System.in);

    08: System.out.println("Enter Source Filename : ");

    09: String srcfile = s.nextLine();

    10: Path src = Paths.get(srcfile);

    11: BufferedReader br=Files.newBufferedReader(src);

    12: Path trg = Paths.get("temp.txt");

    13: BufferedWriter bw = Files.newBufferedWriter(trg, StandardOpenOption.CREATE);

    14: String line;

    15: line = br.readLine();

    16: while(line != null) {

    17: if (line.trim().length() > 0)

    18: bw.write(line + "\n");

    19: line = br.readLine();

    20: }

    21: bw.close();

    22: br.close();

    23: Files.move(trg,src, StandardCopyOption.REPLACE_EXISTING);

    24: }

    ```


    ## SimpleFileVisitor class


    `SimpleFileVisitor<T>` provides the default behavior to visit all files and implements
    `FileVisitor` interface.


    ### Method Description


    | Method | Description |

    | :--- | :--- |

    | `visitFile(Path file, BasicFileAttributes attrs)` | Invoked for a file in a
    directory. |

    | `postVisitDirectory(Path dir, IOException exc)` | Invoked for a directory after
    entries are visited. |

    | `visitFileFailed(Path file, IOException exc)` | Invoked for a file that could
    not be visited. |


    ## PrintJavaPrograms


    The following program displays all .java files starting from the directory - **c:\jdk8**.


    ```java

    01: import java.nio.file.*;

    02: import java.nio.file.attribute.BasicFileAttributes;

    03: import static java.nio.file.FileVisitResult.CONTINUE;

    04: public class PrintJavaPrograms {

    05: public static void main(String[] args)

    06: throws Exception {

    07: Path p = Paths.get("c:\\jdk8");

    08: Files.walkFileTree(p, new ProcessFile());

    09: }

    10: }

    11:

    12: class ProcessFile extends SimpleFileVisitor<Path> {

    13: @Override

    14: public FileVisitResult visitFile

    15: (Path file, BasicFileAttributes attr) {

    16: if ( file.toString().endsWith(".java"))

    17: System.out.println(file);

    18: return CONTINUE;

    19: }

    20: }

    ```

