    \ // Book 类体\n05: }\n\n01: // Member.java\n02: package library;\n03: public class\
    \ Member {\n04: // 类体\n05: }\n```\n\n### 访问包中的类\n\n你可以通过包名后跟点（`.`）来访问包的成员。包的成员必须以包名作为前缀。以下代码展示了如何访问\
