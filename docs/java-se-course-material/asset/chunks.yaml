  trans: "\n\n# 旧块准备好垃圾回收\n\n包含 5 个元素的新数组\n\n由 `arr` 引用的包含 10 个元素的旧数组现在可以被 Java 垃圾回收了。\n\
    \n**注意**：Java 虚拟机具有垃圾回收器，负责释放未使用的内存块。\n\nSrikanth Technologies\n\n## Java 入门\n\
    31\n\n你可以像下面一样使用两个方括号来创建一个二维数组：\n\n```java\nint a[][] = new int[5][5];\n```\n\n\
    你可以像下面一样创建一个包含 5 个元素的数组，其中每个元素可以引用不同大小的数组：\n\n```java\nint a[][] = new int[5][];\n\
    a[0] = new int[5];\na[1] = new int[10];\n```\n\n0\n1\n4\n0\n…\n1\n…\nnull\n0\n\
    1\n9\nnull\n4\nnull\n\n 增强 for 循环\n\nJava 提供的增强 for 循环专门处理数组和集合。它从数组中取一个值并将其赋值给循环变量。执行循环语句并重复该过程直到数组耗尽。\n\
    \n`for (datatype loopvariable : array)`\n`Statement;`\n\n下面的示例展示了如何使用增强 for 循环显示数组的所有元素。循环变量类型与数组的数据类型必须相同。\n\
    \n```java\nint a [] = {10,20,30,40,50};\nfor ( int n : a )\n    System.out.println\
    \ (n);\n```\n\nSrikanth Technologies\nJava 入门\n32\n\n## 初始化数组\n\nJava 允许对数组进行初始化。以下示例展示了你如何在\
    \ Java 中初始化数组。\n\n```java\n// 初始化数组 a 为给定的三个值\nint a[] = {10,20,30};\n// 初始化数组\
    \ b 为给定的五个值\nint b[] = new int[] {10,20,30,40,50};\n// 初始化二维数组 – 2 X 3\nint bb[][]=\
    \ {{1,2,3},{4,5,6}};\n```\n\n**注意**：数组的元素会根据数组的数据类型自动初始化为默认值。\n\n## 可变数量参数\n\n\
    - Java 允许方法接受变数量的参数。\n- 参数在数据类型之后、名称之前用 `…`（省略号）声明。\n- 必须是方法中的最后一个参数。\n- 参数在方法内部被视为一个数组。\n\
    \n```java\n01: public class VaryingArguments {\n02: public static void main(String[]\
    \ args) {\n03: System.out.println(getSum(10, 20, 30));\n04: System.out.println(getSum(100,\
    \ 200) );\n05: }\n06: public static int getSum(int... nums) {\n07: int total =\
    \ 0;\n08: for (int n: nums) {\n09: total += n;\n10: }\n11: return total;\n12:\
    \ }\n13: }\n```\n\nSrikanth Technologies\nJava 入门\n33\n\n## 命令行参数\n\n- 在从命令行调用\
    \ java 程序时传递的参数称为命令行参数。\n- 这些参数可以用于为程序提供输入。\n- 这些参数可以通过 `main()` 方法中的 `args` 参数访问，它是一个字符串数组。\n\
    - `args` 的 `length` 属性返回在命令行传递的参数个数。\n\n```java\n01: // 显示命令行参数的程序\n02: public\
    \ class CLA {\n03: public static void main(String args[]){\n04: System.out.printf(\"\
    Args Count: %d\\n\",args.length);\n05: // 显示参数\n06: for(String s : args)\n07:\
    \ System.out.println(s);\n08: } // main 结束\n09: }\n```\n\n如下所示从命令行调用之前的程序：\n\n\
    `c:\\jdk\\srikanth>java CLA One Two <Enter>`\nArgs Count : 2\nOne\nTwo\n\n**注意**：方法\
    \ `main()` 必须有一个类型为 `String[]` 的参数。然而，该参数的名字可以是任意的。下面的代码与上方相同。\n\nSrikanth Technologies\n\
    Java 入门\n34\n\n```java\n01: public class CLA {\n02: public static void main(String\
    \ a[]){\n03: for (String s : a)\n04: System.out.println(s);\n05: }\n06: }\n```\n\
    \n## 程序 - Prime.java\n\n此程序检查命令行上给出的数字是否为质数。质数是指除了 1 和自身外没有因子的数。\n\n```java\n\
    01: // 检查数字是否为质数的程序\n02: public class Prime {\n03: public static void main(String[]\
    \ args){\n04: // 检查是否传递了数字\n05: if (args.length == 0) {\n06: System.out.println(\"\
    Number is missing!\");\n07: return;\n08: }\n09: // 将 args[0] 转换为 int\n10: int\
    \ n = Integer.parseInt( args[0] );\n11: boolean prime = true;\n12:\n13: for (\
    \ int i = 2; i <= n/2; i ++) {\n14: if ( n % i == 0 ) {\n15: prime = false;\n\
    16: break;\n17: }\n18: } // for 结束\n19: if (prime)\n20: System.out.println(\"\
    Prime\");\n21: } else\n22: System.out.println(\"Not a prime\");\n23: } // main\
    \ 结束\n24: }\n```\n\nSrikanth Technologies\nJava 入门\n35\n\nPrime 程序执行以下操作：\n- 检查是否传递了数字。\n\
    - 如果 `args.length == 0`，打印 \"Number is missing!\" 并返回。\n- 将 `args[0]` 转换为 `int`。\n\
    - 从 `2` 循环到 `n/2`。如果 `n % i == 0`，将 `prime` 设置为 `false` 并跳出。\n- 根据 `prime` 变量打印\
    \ \"Prime\" 或 \"Not a prime\"。\n\n通过命令行运行此程序：\n`c:\\jdk\\srikanth>java Prime 23\
    \ <Enter>`\n\nSrikanth Technologies\nJava 入门\n36\n\n## 练习\n\n尝试编写程序完成以下任务：\n1.\
    \ 显示前 10 个数字。\n2. 显示 1000 到 2000 范围内所有的回文数。\n3. 接收数字并显示其是否为完美数。\n4. 接受十个数字并显示其中最大的。\n\
    5. 接受两个数字并显示它们的最大公约数 (GCD)。\n6. 在命令行接受两个数字并将底（第一个数字）提升到幂（第二个数字）。\n7. 接收一个数字并倒序显示其数字。\n\
    8. 创建一个接受变长度整数的函数，返回所有数字的平均值。\n9. 创建一个 10 个元素的数组。从键盘读取值并填充数组。\n10. 交换前 5 个元素和后\
    \ 5 个元素并显示数组。\n\n**注意**：这些练习的答案可以在 `http://www.srikanthtechnologies.com/books/javabook216/answers.html`\
    \ 找到。\n\n"
- fmt: "\n- Increases control as each object is independent with its data which is\
    \ private, and a set of functions, which can be called from other objects.\n-\
    \ A class in Java defines data and code that is to be encapsulated.\n\n`Employee`\n\
    `From Outside`\n`EmpName`\n`Salary`\n`Data`\n`changeSalary()`\n`Code`\n`From Outside`\n\
    `netSalary()`\n\nSrikanth Technologies\nJava Student’s Guide - Object-Oriented\
    \ Programming\n4\n\nIn the above example the class `Employee` has two instance\
    \ variables – `EmpName` and `Salary` and two methods – `changeSalary()` and `netSalary()`.\n\
    Instance variables can be accessed only by methods that are part of the class\
    \ – `changeSalary()` and `netSalary()`.\n\n### Class vs. Object\nClass is the\
    \ description of a collection of similar objects. Class defines the instance variables\
    \ and methods to be encapsulated. Class denotes a category of objects. It is blueprint\
    \ for creating objects. Example: `Employee`, `Product`, `Student` etc.\n`Instance`\
    \ `variables` are used to store data and `methods` perform operations on the data.\n\
    `Object` is an instance of the class. Memory is allocated only when an object\
    \ of the class is created. Methods are called using an object. Example: An employee,\
    \ a student etc.\n\n### INHERITANCE\n- Allows a class to be created from another\
    \ class thereby inheriting all members of another class.\n- Allows reusability\
    \ of existing classes.\n- New classes may add new members and override existing\
    \ members of the inherited class.\n- Class being inherited is called as superclass\
    \ and the class created from existing class is called as subclass.\n- Inheritance\
    \ represents “IS A” relationship between classes. For example, `Manager` is extending\
    \ `Employee` because `Manager` is an `Employee`. A `SavingsAccount` extends `Account`\
    \ because `SavingsAccount` is an `Account`.\n- Hierarchies can be built using\
    \ inheritance.\n\nSrikanth Technologies\nJava Student’s Guide - Object-Oriented\
    \ Programming\n5\n\n`Employee`\n`Name`\n`Salary`\n`changeSalary()`\n`getSalary()`\n\
    \n`Manager`\n`hra`\n`changeHra()`\n`getSalary()`\n\nIn the above example, `Manager`\
    \ class inherits all the data members and methods of `Employee` class. It adds\
    \ `hra` and `changeHra()` members and overrides `getSalary()` method.\n`Overriding`\
    \ is the process where the subclass (`Manager`) is creating a method with the\
    \ same signature as a method in the superclass (`Employee`).\nJava allows a class\
    \ to extend only one class – `single` `inheritance`.\n`Multiple inheritance`,\
    \ where a class can be created from multiple classes, is NOT permitted in Java.\n\
    \n### POLYMORPHISM\n- Allows multiple methods performing the same operation to\
    \ have the same name.\n- Compiler invokes one of the multiple methods depending\
    \ upon the context (parameters passed to method).\n- Programmer need not remember\
    \ multiple names.\n\nIn the following example, all three functions returning maximum\
    \ of two values are given same name.\n\nSrikanth Technologies\nJava Student’s\
    \ Guide - Object-Oriented Programming\n6\n\n```\nmax(int ,int)\nmax(long, long)\n\
    max(String,String)\n```\nWait, the original text has the functions listed without\
