    # Handling multiple clients using Multithreading


    The above server socket handles one client at a time. When a server socket has
    to handle multiple clients at the same time, it has to create multiple threads
    – one for each client.


    The following picture shows how a single `Server socket` creates multiple threads
    to handle multiple clients concurrently.


    The following program creates a server socket to receive request from client.
    Upon receiving a request for connection from client, server creates a new thread
    and makes the thread handle the communication with client.


    **Server**

    **Socket**

    **1: Connect**

    **Client**

    **Socket-1**

    **2 : Create Thread**

    **Client**

    **Thread-1**

    **Socket-2**

    **Thread-2**

    **3: Thread to deal with client.**


    ```java

    01: import java.io.PrintWriter;

    02: import java.net.*;

    03: import java.util.Scanner;

    04: import java.util.concurrent.ExecutorService;

    05: import java.util.concurrent.Executors;

    06:

    07: public class MultiThreadedBookServer {

    08: public static void main(String args[])

    09: throws Exception {

    10: ServerSocket ssocket = new ServerSocket(3000, 10);

    11: System.out.println("Book server is ready!");

    12: // create a Thread Pool to handle clients

    13: ExecutorService executor =

    14: Executors.newFixedThreadPool(10);

    15: while (true) {

    16: Socket clientsocket = ssocket.accept();

