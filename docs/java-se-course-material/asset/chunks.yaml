    ## LITERALS


    Literal denotes a constant value, which remains unchanged throughout the program.


    * Java has three reserved literals – `null`, `true`, `false`.

    * Integer literals are treated as integers unless they are suffixed with `L` (letter
    L). Example: `100L`.

    * Java 7.0 onwards we can use `_` (underscore) as separator between digits.

    * Integer literals can be specified in octal (`0123`) or hexadecimal (`0xff`).
    Octal numbers are prefixed with `0` and hexadecimal numbers are prefixed with
    `0x`.

    * Floating point literals are by default taken as `double`. Use suffix `f` to
    denote float literal. Example, `10.50f`.

    * Starting from Java 7.0, we can have binary literals prefixed with `0b`.

    * Escape sequence as well as Unicode values can appear in string literals. For
    example, `"How are you ...\t Srikanth\u000d"` represents a string that contains
    a horizontal tab (`\t`) and carriage return (`\u000d` in hexadecimal is equal
    to decimal 13).


    | Type | Example |

