  md: '# 1


    # # BULLSEYE


    The president made his familiar stink-in-the-room face, then waved hands as though
    to ward off a bug.


    “Don’t tell me this,” he said. “Why are you telling me this?”


    His personal lawyer John Dowd, in late February 2018, little more than a year
    into Trump’s tenure, was trying to explain that prosecutors were likely to issue
    a subpoena for some of the Trump Organization’s business records.


    Trump seemed to respond less to the implications of such a deep dive into his
    affairs than to hearing about it at all. His annoyance set off a small rant. It
    was not so much about people out to get him—and people surely out to get him—but
    nobody was defending him. The problem was his own people. Especially his lawyers.


    Trump wanted his lawyers to “fix” things. “Don’t bring me problems, bring solutions,”
    a favorite CEO bromide that he often repeated. He judged his lawyers by their
    under-the-table or sleight-of-hand skills and held them accountable when they
    could not make problems disappear. His problems became their fault. “Make it go
    away” was one of his frequent orders. It was often said in triplicate: “Make it
    go away, make it go away, make it go away.”


    The White House counsel Don McGahn—representing the White House rather than, in
    a distinction Trump could never grasp, the president himself—demonstrated ability
    to make problems disappear and became a constant brunt of Trump’s rages and invective.
    His legal interpretation of proper executive branch function often thwarted boss’s
    wishes.


    Dowd and his colleagues, Ty Cobb and Jay Sekulow—the trio of lawyers with navigating
    the president through his personal legal problems—had, on the other hand, become
    highly skilled in avoiding their client’s bad humor, which was often accompanied
    by menacing, barely controlled personal attacks. All three men understood that
    to be a successful lawyer for Donald Trump was what he wanted to.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Trump harbored a myth about the ideal lawyer that had almost nothing

    do with the practice of law. He invariably cited Roy Cohn, his old New

    York friend, attorney, and tough-guy mentor, and Robert Kennedy, John F.

    Kennedy’s brother. “He was always on my ass as Roy Cohn and Bobby

    Kennedy,” said Steve Bannon, the political strategist who, perhaps more

    than anyone else, was responsible for Trump’s victory. “Roy Cohn and

    Bobby Kennedy,’ he would say. “Where''s my Roy Cohn and Bobby

    Kennedy?” Cohn, to his own benefit and legend, built the myth that Trump

    continued to embrace: with enough juice and muscle, the legal system could

    always be gamed. Bobby Kennedy had his brother''s attorney general

    and hatchen he protected JFK and worked the back channels of power

    for the benefit of the family.


    This was the constant Trump theme: beating the system. “I’m the guy

    who gets away with it,” he had often bragged to friends in New York.


    At the same time, he did not want to know details. He merely wanted

    his lawyers to assure he was winning. “We’re killing it, right?

    That’s what I want to know. That’s all I want to know. If we''re not killing

    it, you screwed it up,” he shouted one afternoon at members of his ad hoc

    legal staff.


    From the start, it had become a particular challenge to find top lawyers

    to take on what, in the past, had always been one of the most vaunted of

    legal assignments: representing the president of the United States. One

    high-profile Washington white-collar litigator gave Trump a list of twenty

    issues that would immediately need to be addressed if he were to take on

    the case. Trump refused to consider any of them. More than a dozen major

    firms had turned down his business. In the end, Trump was left with a

    ragtag group of solo practitioners without the heft and resources of big

    firms. Now, thirteen months after his inauguration, he was facing personal

    legal trouble at as great as that faced by Richard Nixon and Bill

    Clinton, and doing so with what seemed, at best, a Court Street legal

    team. But Trump appeared to be oblivious to this exposed flank. Ratcheting

    his level of denial about the legal threats around him, he breezily

    rationalized: “If I had good lawyers, I’d look guilty.”


    Dowd, at seventy-seven, had had a long, successful legal career, both

    in government and in in Washington law firms. But that was in the past. He

    was on his own now, eager to postpone retirement. He knew the

    importance, certainly to his own position in Trump’s legal circle, of'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'understanding his client’s needs. He was forced to agree with the president’s
    assessment of the investigation into his campaign’s contact with Russian state
    interests: it would not reach him. To that end, Dowd, and the other members of
    Trump’s legal team, recommended that the president cooperate with the Mueller
    investigation.


    “I’m not a target, right?” Trump constantly prodded them.


    This wasn''t a rhetorical question. He insisted on an answer, and an affirmative
    one: “Mr. President, you’re not a target.” Early in his tenure, Trump had pushed
    FBI director James Come to provide precisely this reassurance. One of the signature
    moves of his presidency, he had fired Come in May 2017 because he wasn’t satisfied
    with the enthusiasm of the affirmation and therefore assumed Come was plotting
    against him.


    Whether president was indeed a target—and it would surely have taken a through-the-looking-glass
    exercise to see him as the bullseye of the Mueller investigation—seemed to occupy
    a separate reality from Trump’s need to be reassured that he was not a target.


    “Trump trained me,” Cobb told Steve Bannon. “Even if it’s bad, it’s great.”


    Trump imagined—indeed, with a preternatural confidence, nothing appeared to dissuade
    him—that in the very future he would hear directly from the special counsel, who
    would send him a comprehensive and even apologetic letter of exoneration.


    “Where,” he kept demanding to know, “is my fucking letter?”


    The grand jury panelled by Special Counsel Mueller met on Thursdays and Fridays
    in federal district court in Washington. Its business was conducted on the fifth
    floor of an unremarkable building at 333 Constitution Avenue. The grand jurors
    gathered in a nondescript space that looked like a courtroom than a classroom,
    with prosecutors at a podium and witnesses sitting at a desk in the front of the
    room. The Mueller grand jurors were more female than male, more white than black,
    older rather than younger; they were distinguished most of all by their focus
    and intensity. They listened to the proceedings with “a scary sort of attention,
    as though they already know everything,” said one witness.


    In a grand inquiry, you fall into one of three categories. You are “witness of
    fact,” meaning the prosecutor believes you have information about an investigation
    at hand. Or you are a “subject,” meaning you are'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'regarded as having personal involvement with the crime under investigation.
    Or, most worrisome, you are a “target,” meaning the prosecutor is seeking to have
    the grand jury indict you. Witnesses often became became subjects, and subjects
    often became targets.


    In early 2018, with the Mueller investigation and its grand jury maintaining a
    historic level of secrecy, no one in the White House could be sure who was what.
    Or who was saying to what. Anyone and everyone working for the president or one
    of his senior aides could be talking to the special counsel. The investigation''s
    code of silence extended into the West Wing. Nobody knew, and nobody was saying,
    who was spilling the beans.


    Almost every White House senior staffer—the collection of advisers who had firsthand
    dealings with the president—had retained a lawyer. Indeed, from the president’s
    first days in the White House, Trump’s tangled legal past and evident lack of
    legal concern had a shadow on those who worked for him. Senior people were looking
    for lawyers even as they were learning how to navigate the rabbit Warren that
    was the West Wing.


    In February 2017, weeks after the inauguration, and not long after the FBI raised
    questions about National Security Advisor Michael Flynn, Chief of Staff Penceb
    walked into Steve Bannon’s office and said, “I''m going to do you a big favor.
    Give me your credit card. Don''t ask me why, just give it to me. You''ll be thanking
    me for the rest of your life.


    Bannon opened his wallet and gave Penceb back his American Express card. Priebust
    shortly handed, returned the card back, and said, “Now you have legal insurance,”


    Over the next year, Bannon—a witness of fact—spent hundreds of hours with his
    lawyers preparing for his testimony before the special counsel and before Congress.
    His lawyers in turn spent mounting hours talking to Mueller''s team and to congressional
    counsels. Bannon''s legal costs at the end of the year came to $2 million.


    Every lawyer''s first piece of advice to him or her client was blunt and unequivocal:
    talk to no one, let it become necessary to testify what you said. Before long,
    a constant preoccupation of senior staffers in the Trump White House was to know
    as little as possible. It was a wrong-side-up world: where being “in the room”
    was traditionally the most sought-after status, now you wanted to stay out of
    meetings. You wanted to avoid'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'a witness to conversations; you wanted to avoid being witnessed being a witness
    to conversations, at least if you were smart. Certainly, nobody was your friend.
    It was impossible to know where a colleague stood in the investigation; hence,
    you had no way of knowing how likely it was that they might need to offer testimony
    about someone else—you, perhaps—as the bargaining chip to save themselves by cooperating
    with the special counsel, a.k.a. flipping.


    The White House, it rapidly dawned on everyone who worked there—even as it became
    one more reason not to work there—was the scene of an ongoing criminal investigation,
    one that could potentially ensnare anyone who was anywhere near.


    The ultimate keeper of the secrets from the campaign, the transition, and through
    the first year in the White House was Hope Hicks, the White House communications
    director. She witnessed most everything. She saw what the president said: she
    knew what the president, a man unable to control his own running monologue, knew.


    On February 27, 2018, testifying before the House Intelligence Committee—she had
    already appeared before the special counsel—she was pressed about whether she
    had lied for the president. Perhaps a more accomplished communications professional
    could have escaped the corner here, but Hicks, who had scant experience other
    than working as Donald Trump’s spokesperson, which, as often as not, meant dealing
    with disregard of empirical truth, found herself though in a sudden and unexpected
    moral void trying to publicly praise the relative importance of her boss’s lies.
    She admitted to telling “white lies,” as in, somehow, less than the biggest lies.
    This was enough of a admission to require a nearly twenty-minute min-testimony
    with her lawyers, distressed by what she might be admitting and by where any deconstruction
    of the president’s constant inversions might lead.


    Not long after she testified, another witness before the Mueller jury was asked
    how Hicks might go to lie for the president. The witness answered: “I think when
    it comes to doing anything as a ‘yes man’ for Trump, she’ll do it—but she won''t
    take a bullet for him.” The statement could be taken as both a backhanded compliment
    and an estimate of how far loyalty in the Trump White House might extend—probably
    not too far.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Almost no one in Trump’s administration, it could be argued, was conventionally
    suited to his or her job. But with the possible exception of the president himself,
    no one provided a better illustration of this unprepared and uninformed presidency
    Hicks. She did not have substantial media or political experience, nor did she
    have a temperament annealed by years of high-pressure work. Always dressed in
    the short skirts that Trump favored, she seemed invariably caught in the headlines.
    Trump admired her not because she had the political skills to protect him, but
    for her pliant dutifulness. Her job was to devote herself to his care and feeding.


    “When you speak to him, open with positive feedback,” counseled Hicks, understanding
    Trump’s need for constant affirmation and almost complete inability to talk about
    anything but himself. Her attentiveness to Trump and tractable nature had elevated
    her, at age twenty-nine, to the top White House communications job. And practically
    speaking, she acted as his facto chief of staff. Trump did not want his administration
    to be staffed by professionals; he wanted it to be staffed by people who attended
    and catered to him.


    Hicks—“Hope-y,” to Trump—was both the president’s gatekeeper and his comfort blanket.
    She was a frequent subject of his prudent interest: Trump preferred business,
    even in the White House, to be personal. “Who’s fucking Hope?” he would demand
    to know. The topic also interested his son Don Jr., often professed his intention
    to “fuck Hope.” The president’s daughter Ivanka and her husband, Jared Kushner,
    both White House senior advisors, expressed a gentler tone of concern for Hicks;
    sometimes they would even try to suggest eligible memen.


    But Hicks, seeming to understand the insular nature of Trumpworld, dated exclusively
    outside the bubble, picking the baddest boys in it: campaign manager Corey Lewandowski
    during the campaign and presidential aide Rob Porter in the White House. As the
    relationship between Hicks and Porter unfolded in the fall of 2017, knowing about
    the affair became an emblem of Trump insiders, special care to keep this development
    from the proprietary president. Or not: other people, assuming that Porter’s involvement
    with Hicks would not at all please Trump, were less than discreet about it.


    In the heightened enmity of the Trump White House, Rob Porter may have succeeded
    in becoming the most disliked person by everyone except'
  merge: -1
  img_proc: true
- pgno: 16
  md: "perhaps the president himself. A square-jawed, 1950s-looking guy who could\
    \ have been a model for Brylcream, was almost a laughable figure of betrayal and\
