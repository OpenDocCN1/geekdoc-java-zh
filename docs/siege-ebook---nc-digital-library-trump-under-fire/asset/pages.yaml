- pgno: 333
  md: '# About the Author


    ![](img/1441f08e27d768773b3eb429958ad7b3_333_0.png)


    Michael Wolff is the author of Fire and Fury, the number one bestseller that for
    the first time told the inside story of the Trump White House. He has received
    numerous awards for his work, including two National Magazine Awards. The author
    of seven previous books, he has been a regular columnist for Vanity Fair, New
    York, The Hollywood Reporter, British GQ, and other magazines and newspapers.
    He lives in Manhattan and has four children. You can sign up for email updates
    here.


