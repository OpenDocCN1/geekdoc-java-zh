  md: 'Trump and Mueller had, curiously, parallel biographies. Parallel, but the same
    time, mirror images of each other.


    Trump was born in 1946 in New York; Mueller was born in 1944 in New York. Both
    descended from German immigrants who arrived in New York in the nineteenth century.
    Both grew up in the postwar years, their parents members of the exclusive and
    salubrious upper-upper-middle class.


    But here the similarities ended. Trump was the son of one sort of American archetype:
    his father, Fred, who, with animal instincts, operated in what he viewed as a
    cutthroat and zero-sum world, believed in winning at all costs. Trump, from a
    very young age, meant to outdo him. Mueller was the son of another type: his father,
    a buttoned-down white-collar executive at DuPont, with 1950s sublimation, operated
    in a world in which success was inextricricably bound by not rocking the boat.
    And Mueller, from a very young age, meant to follow his father’s example.


    Robert S. Mueller III, Princeton class of ''66, was a member of the last generation
    of Ivy League Republicans—moderate, establishment, upper-class Republicans. Since
    the 1960s, the Ivy League had inexplicably transformed into a left-wing cultural
    club, but within modern memory its true self was well represented by the Bush
    family and other country sorts. His higher version was the Mueller family: unemotive
    WASPS, they eschewed personal vanity and were absent any feeling of entitlement.
    Bob Mueller was a scholar-athlete—an old-fashioned ideal combining brains and
