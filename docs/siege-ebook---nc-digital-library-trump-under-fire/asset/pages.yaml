  img_proc: true
- pgno: 292
  md: 'On March 5, the attorney general and the special counsel conferred, with Mueller
    spelling out his report''s conclusions.


    On March 14, the prospective Trump-Xi summit at Mar-a-Lago was postponed. The
    attorney general then officially requested the report by the end of the following
    week: the hard deadline was now Friday, March 22.


    That day, the fourteenth, Andrew Weissmann, Bob Mueller''s key deputy, announced
    that he was leaving the special counsel''s office. Weissmann had promised to see
    the investigation through to the end. But now, bitterly disappointed, he would
    tell friends, by how narrowly Mueller had come to focus the scope of the investigation,
    he wanted to stay not a moment longer.


    Robert Mueller, the stoic marine, had revealed himself over the course of the
    nearly two-year investigation to his colleagues and staff to be quite a Hamlet.
    Or, less dramatically, a cautious and indecisive bureaucrat. He had repeatedly
    traveled between a desire to use his full authority against Donald Trump and the
    nagging belief that he had no such authority. He could be, he knew, the corrective
    to the louche and corrupt president; at the same time, he asked, what did he have
    to correct the country''s duly elected leader? On the one hand, could indict the
    president for acting as if he were above the law; the secret draft indictment
    outlining the president''s casual abuses had been on Mueller''s desk for almost
    a year. On the other hand, a reasonable man might, in certain nuanced ways, see
    aspects of the presidency as indeed below the law.


    In some sense, here was an unintended result of the exceptional silence of the
    special counsel''s office: it had lived entirely inside its own head. Setting
    itself apart from public discussion, it had come to dwell in its own ambience—Bob
    Mueller’s ambience. For the special counsel, the right thing became as little
    as possible.


    Mueller let it be known that as he was, equally concerned with Ken Starr, the
    independent counsel who investigated Bill Clinton. As Mueller reminding his staff,
    there were substantial differences between a special counsel and independent counsel.
    The special counsel''s office was not independent: it worked directly for the
    Justice Department. Moreover, Mueller believed that Starr, with his leaky office,
    agenda-driven investigation, and visceral hatred of Bill Clinton, had undermined
    the office of the presidency.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Ken Starr had forced Bill Clinton to testify before the grand jury. Deciding
    whether to subpoena the president became perhaps the central fault line in the
    Mueller investigation—and when the special counsel decided not to subpoena the
    president, overrode the will of much of his staff. Here, part of Mueller''s analysis
    was not just about the special counsel''s limited authority; it was also a recognition
    on his part that it would somehow be a fair fight to make the president testify,
    because Trump would surely incriminate himself.


    In a way, Robert Mueller had to accept the premise of Donald Trump—that Trump
    is Trump. It was circular reasoning to hold the president’s essential character
    against him. Another way, confronted by Donald Trump, Bob Mueller threw up his
    hands. Surprisingly, he found himself in agreement with the greater White House:
    Donald Trump was the president, and, for better or worse, what you saw was what
    you got—and what the country voted for.


    But the president did not know any of this yet. A heads-up about the contents
    of the report was reaching some in the White House, but there was a careful effort
    to keep this intelligence from the uncontrollable president, lest his elections
    begin before the process was complete. Remained, in the same description offered
    by three different allies, “batshit crazy” right up the end. His tweeting, always
    under control, reached obsessive-compulsive levels during the weekend before the
    report’s deadline, his mental agitation on vivid display. And he remained convinced
    that he was going to prevail, or,, that Bob Mueller did not have the guts to stand
    up to him. His enemies had elevated Mueller to a hero, but Trump still regarded
    him as a zero.


    Curiously, in the days leading up to the formal delivery of the report, one of
    the people with whom the president frequently spoke was his old friend and campaign
    contributor Robert Kraft, the owner of the New England Patriots. In February,
    Kraft had been charged with soliciting a prostitute while visiting a parlor in
    Palm Beach, Florida.


    Trump seemed to find comfort in counseling his friend on his legal peril, offering
    him copious amounts of advice and maintaining that he was much better at this
    than any lawyer. He knew what to do. He knew how to handle it. They always wanted
    to plead out. But don''t give an inch.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '“You’re innocent,” he said, even though the police had Kraft on a video tape
    at the massage parlor.


    At the close of business on March 22, the Mueller report was at last delivered.
    The grand jury, sitting on this Friday, issued no indictments, and the special
    counsel’s office confirmed that its investigation would not yield any new indictments.


    It was unclear how long or how involved the report was. It was unclear how much
    of the work product of the twenty-two-month effort had been sent to the attorney
    general. But almost immediately after accepting the report, Attorney General Barr
    wrote a letter to Congress expressing confidence that he could quickly provide
    a summary of the special counsel’s findings, possibly within forty-eight hours.


    A chill went through the establishment. Perhaps there wasn’t all that much to
    the report.


    In a sense, this was the central question: How much had Bob Mueller reduced the
    scope of his inquiry? What if his two years had been spent working to build his
    investigation, but working to limit it?


    On Sunday, on a spring-like afternoon, sixty-four degrees in Washington, the attorney
    general sent his summary of the report to Congress. In a four-page letter, Barr
    said that the special counsel had failed to find evidence of a conspiracy to influence
    the 2016 election between Trump or his aides and representatives from the Russian
    government. Further, while the special counsel had found evidence of possible
    obstruction of justice, he had left it to the attorney general’s discretion whether
    to pursue the issue. In his letter, Barr said he had made the determination that
    the evidence did not warrant prosecution.


    Elliptically, the letter added, “During the course of his investigation, the Special
    Counsel also referred other matters to offices for further action.” Indeed, there
    were now many as a dozen other federal and state inquiries involving the Trump
    White House, the Trump Organization, the Trump family, and Donald Trump himself.
    The crimes being investigated included money laundering, campaign finance fraud,
    abuse of the president’s pardon power, corruption involving inaugural funds, lying
    on financial disclosures, and bank fraud.


    But for now, Donald Trump seemed to have slipped his pursuers. As an amused Steve
    Bannon commented, “Never send a marine to do a hit'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'man’s job."


    By Sunday evening, a feeling perhaps reminiscent of election night 2016, desolate
    and confounded, spread through the mainstream media, the liberal establishment,
    and among all those who were confident that they had surrounded Donald Trump and
    left him nowhere to run. This was—and there could hardly be any better illustration—defeat
    snatched from the jaws of victory.


    Almost immediately, Trump was public proclaiming his “complete and total exoneration.”
    Soon he was on the phone seeking congratulations, taking congratulations, and
    congratulating himself.


    “Who’s the man? I’m the man. I am the man


    He continued with impeachment against the Democrats and the media


    And there, perhaps, Trump had something of a point. If this was the result—a pass
    on conspiracy and equivocation on obstruction—how could you not have hastened
    it along, or worse, how could you have fostered the exact opposite impression?
    For two years, the secret tribunal had let the nation assume Trump’s peril and
    guilt. How had it taken twenty-two months to grill a nothing burger?


    Am I safe?” Trump persisted in asking the caller. “Am I safe?”


    He answered his own question: “They are going to keep coming after me.",


    Here was one of the most seismic reversals in American political life—and yet,
    for Donald Trump, it was not out of the ordinary at all. Once again, he had dodged
    a potential death blow. But his “exoneration” changed little because he he was
    still guilty of Donald Trump. It was not only that his very nature would continue
    to replenish a majority of the nation, as almost everyone who came working into
    contact with him, but it would lead him again and again came to the brink of personal
    destruction.


    His escape, such as it was, would be brief.'
