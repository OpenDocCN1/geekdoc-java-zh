- pgno: 17
  md: 'Dravis helped leak the details of the Hicks-Porter romance to the Daily Mail,
    which published a story about it on February 1.


    But Dravis, joined by Porter’s former wives, decided that, outrageously, he had
    come looking out good in the Daily Mail account—he was part of a glam power couple!
    Porter called Dravis to taunt her: “You thought you could get me!” Dravis and
    his former wives all publicly revealed his abuse at his hand. His first wife said
    he kicked and punched her; she even produced a photograph of her black eye. His
    second wife informed the media that she had filed an emergency protective order
    against him.


    The White House, or at least Kelly—and likely Hicks—had been aware of many of
    these claims and, effectively, covered them up. (“You usually have enough competent
    people for White House positions to write out the beaters, but you couldn’t be
    so choppy in the Trump White House,” said one Republican acquaintance of Porter’s.)
    The fur that erupted around Porter and his troubling gross-guy history not only
    annoyed Trump—“He stinks of bad press”—it further weakened Kelly. On February
    7, both of his former wives gave interviews to CNN, Porter resigned.


    A publicity-shy Hicks—Donald Trump put a high value on associates who did not
    fill his press opportunities—suddenly found her love life in the glare of intense
    press scrutiny. Her affair with the discredited Porter highlighted her own odd
    relationship with the president and his family, as well as the haphazard management,
    interpersonal dysfunctions, and general lack of political savvy in the Trump court.


    The affair was, curiously, among the least of Hicks’s problems. Indeed, for Hicks
    the scandal became perhaps a better cloud under which to leave the administration
    than what almost everyone in the West Wing assumed the real cloud.


    On February 27, a reporter at the Washington insider newsletter Axios, Jonathan
    Swan, a favorite conduit for White House leaks, reported that Josh Raffel was
    leaving the White House. In a novel arrangement, Raffel had come into the White
    House in April 2017 as the exclusive spokesperson for the president’s son-in-law
    Jared Kushner, and his wife, Ivanka, bypassing the White House communications
    team. Raffel, who, like Kushner, was a Democrat, had worked for Hiltzik Strategies,
    the New York public relations firm that represented Ivanka’s clothing line.'
