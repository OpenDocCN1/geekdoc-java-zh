  md: 'to be rendered. And no one, least of all Bannon, believed that Trump would

    be found to be anything but Trump.


    The runaway train was about to hit the wall.

    The wings were about to come off the aircraft.


    But where was the report?

    In fact, it was all complete by early January. Most members of

    Mueller’s staff were already planning their exits. The once collegial mood

    aive the nineteen attorneys who had worked on the investigation had

    turned, at best, sullen. Two years of investigation and internal debate had

    reduced the special counsel’s broad mandate to a prudent, carefully defined

    pair of issues. Had the president or members of his inner circle conspired

    with Russian state agents to influence the 2016 U.S. presidential election?

    And if "predicate event" did not occur, could the president—no matter

    how he determined to disrupt the investigation of him—be fairly

    accused of obstructing justice?


    Bob Mueller did not want to file his report with Matthew Whitaker, the

    acting attorney general. He decided to wait for William Barr, the president’s

    nominee for attorney general, to be confirmed and seated. Shortly after Barr

    took his new post on February 14, he conveyed his view that the

    protocol was for the attorney general to request the report from the special

    counsel—and he wasn''t yet requesting it. Barr did not want the report until

    after the president held his summit with the North Koreans in Vietnam at

    the end of February. He might not ask for it, in fact, until the planned

    summit with President Xi of China at the end of March.


    The consideration here the new attorney general’s desire to put the

    nation’s critical business first. But the reality was, too, that Barr was

    bracing himself and looking to get situated in his new office before facing

    the anticipated Mueller explosion.


    On Capitol Hill, breathless anticipation was to frustration and

    irritation. On March 4, the House Judiciary Committee ran out of patience

    decided to issue information requests to eighty-one individuals and

    organizations. The committee would begin its own investigation without

    further delay.


    The move by the Judiciary Committee, with the clear message that the

    Democratic House was now setting its own timetable, forced Barr’s hand.'
