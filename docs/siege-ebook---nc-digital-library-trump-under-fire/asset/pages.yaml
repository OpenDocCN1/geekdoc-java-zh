    of the international world order.


    Schulze was the emissary of a backdoor opening, encouraged by the Chinese, from
    North Korean leader Kim Jong-un. Trump had declared a virtual death match against
    the young despot. But the Chinese saw opportunity: during the meeting in April
    2017 at Mar-a-Lago between Trump and President Xi—a meeting shepherded by Kissinger
    and Kushner—they had been amazed at Trump’s openness, capriciousness, and lack
