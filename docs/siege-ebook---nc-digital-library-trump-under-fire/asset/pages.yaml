- pgno: 18
  md: 'Hope Hicks, who had also worked for the Hiltzik firm—perhaps best known for
    having long represented the film producer Harvey Weinstein, caught, in the fall
    of 2017, in an epochal harassment and abuse scandal and cover-up—originally had
    the same role as Raffel but at a higher level; she was the personal spokesperson
    for the president. In September, Hicks had been elevated to White House communications
    director, with Raffel as her number two.


    The trouble had arisen the previous summer. Both Hicks and Raffel had been on
    Air Force One in July 2017 just as the news broke about Donald Trump Jr.’s meeting
    in Trump Tower during the campaign with Russian government go-betweens dirt on
