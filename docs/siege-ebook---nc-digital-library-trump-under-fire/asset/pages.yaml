    The Chinese—aided by Henry Kissinger and deeply concerned about Trump’s fixation
    on North Korea, while also aware of the leverage the North Korea situation gave
    them—reached out to Jared Kushner. The young man, absent any obvious experience,
    had quietly established himself with many world leaders and, similarly, with his
    father-in-law, as the brains, such as they were, behind the Trump foreign policy.


    The president had often threatened to “dump” his secretary of state Rex Tillerson,
    whom he had quickly soured on, and replace him with Kushner. Kushner told friends
    he it was too soon; Kissinger advised him to wait, counseling him to first put
    his name on a major initiative.


