  md: '# Author’s Note


    Shortly after Donald Trump’s inauguration as the forty-fifth president of the
    United States, I was allowed into the West Wing as a sideline observer. My book
    Fire and Fury was the resulting account of the organizational chaos and constant
    drama—more psychodrama than political drama—of Trump’s first seven months in office.
    Here was a volatile and uncertain president, releasing, almost on a daily basis,
    his strange furies on the world, and this first phase of the most abnormal White
    House in American history ended in August 2017, with the departure of chief strategist
    Stephen K. Bannon and the appointment of retired general John Kelly as chief of
    staff.


    This new account begins in February 2018 at the outset of Trump’s second year
    in office, with the situation now profoundly altered. The president’s capricious
    furies have been met by an increasingly organized and methodical institutional
    response. In In many ways, his own government, even his own White House, has begun
    to turn on him. Virtually every power center left of the far-right wing has deemed
    him unfit. Even among his own base find him undeniable, hopelessly distracted,
    and in over his head. Never before has a president under such concerted attack
    with such a limited capacity to defend himself.


    > His enemies surround him, dedicated to bringing him home.


    I am joined in my train-wreck fascination with Trump—that certain knowledge that
    in the end he will destroy him—by, I believe, almost everyone who has encountered
    him since he was elected president. To have worked near him is to be confronted
    with the most extreme and disorienting behavior possible. That is hardly an overstatement.
    Not only is Trump not like other presidents, he is not anyone most of us have
    ever known. Hence, everyone who has been close to him compelled to try to explain
    him and to dine out on his head-smacking peculiarities. It is yet'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'one more of his handicaps: all the people around him, however much they

    are bound by promises of confidentiality or nondisclosure agreements or

    even friendship, cannot stop talking about their experience with him. In this

    sense, he is more exposed than any president in history.


    Many of the people in the White House who helped me during the

    writing of Fire and Fury are now outside of the administration, yet they

    are just as engaged as ever by the Trump saga. I am grateful to be part of this

    ubstantial network. Many of Trump’s pre-White House cronies continue to

    to listen to him and support him; at the same time, as an expression of

    ofof their concern and of their incredulity, they report among one another, and

    to others as well, on his time, mood, and impulses. In general, I have

    found that the closer people are to him, the more alarmed they have found

    tmselves at various points about his mental state. They all speculate about

    how this will end—badly for him, they almost all conclude. Indeed, Trump

    is probably much better subject for writers interested in human capacities\and
    failings for most of the reporters and writers who regularly cover

    Washington and who are primarily interested in the pursuit of pursuit and

    power.


    My primary goal in Siege is to create a readable and intuitive narrative

    that is its nature. Another goal is to write the near equivalent of a real-

    time of this extraordinary moment, since understanding it well after

    t fact might be too late. A final goal is pure portraiture: Donald Trump as

    an extreme, almost hallucinatory, and certainly reactionary, American

    character. To accomplish this, to gain the perspective and to find the voices

    necessary to tell the larger story, I provided anonymity to any source

    requested it. In cases where I have been told—on the promise of no

    atribution—about an unreported event or private conversation or remark, I

    have made every effort to confirm it with other sources or documents. In

    some cases, I have witnessed the events or conversations described herein.

    With regard to the Mueller investigation, the narrative I provide is based on

    internal documents given to me by sources close to the Office of the Special

    Counsel.


    Dealing with sources in the Trump White House has continued to offer

    it own of unique issues. A basic requirement of working there is,

    s, the willingness to infinitely rationalize or delegitimize the truth, and,

    when necessary, to outright lie. In fact, I believe this has caused some of the

    same people who have undermined the public trust to become private truth-'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'tellers. This is their devil''s bargain. But for the writer, interviewing such
    Janus-faced sources creates a dilemma, for it requires depending on people who
    lie to also tell the truth—and who might later disavow the truth they have told.
    Indeed, the extraordinary nature of much of what has happened in the Trump White
    House is often badly denied by its spokespeople, as well as by the president himself.
    Yet in each successive account of this administration, the level of its preposterousness—even
    as that bar has consistently raised—has almost invariably been confirmed.


    In an atmosphere that promotes, and frequently demands, hyperbolic tone itself
    becomes a key part of accuracy. For instance, most crucially, the president, by
    a wide range of the people in close contact with him, is often described in maximal
    terms of mental instability. “I have never met anyone c than Donald Trump” is
    the wording of one staff member who has spent countless hours expressed to me
    by a dozen others with firsthand experience. How do you translate that into a
    responsible evaluation of this singular White House? My strategy is to try show
    and not tell, to describe the broadest context, to communicate the experience,
    to make it real enough for a reader to evaluate for him- or herself where Donald
    Trump falls on a vertiginous sliding scale of human behavior. It is that condition,
    an emotional state rather than a political state, that is at the heart of this
    book.'
