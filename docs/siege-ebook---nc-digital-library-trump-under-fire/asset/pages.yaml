    The friend did not argue otherwise, and he inferred that no one else the president
    had spoken to him, either. “Big victory, big victory, big victory,” said Trump.
    “This is what we’ve been waiting for.”


    The president went to tell his friend the “victory plan” was all set Sessions—“the
    shithead”—was out. Mueller would be boxed in.


    “How far are you going to go?” the friend asked—that is, would the president now
    to shut down the special counsel’s office?


    “All the way,” the president answered.


    The president also talked confidently about Nancy Pelosi, the likely Speaker of
