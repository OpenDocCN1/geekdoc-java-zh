    \ these expressions into other beans.\n\nIf we need to listen to more Twitter\
    \ account for tweets, we just create or reuse existing handlers (if applicable)\
    \ and configure them here.\n\n# 12.1.3 Provider Beans Configuration\n\nIn this\
    \ section we configure all the beans that implement a Provider interfaces and\
    \ are provider specific. Since our discussion throughout the book has been based\
    \ on the OANDA REST API, we define all inside it's own configuration called tradingbot-oanda.xml\
    \ and has all it's properties defined in the tradingbot-oanda.properties file.\n\
    \nIt is important that the id given to the beans in this OANDA config file must\
    \ be reused in other provider implementations since the main configuration references\
    \ these to configure the core services bean.\n\nWe first begin by looking at the\
    \ properties file\n\n+   - oanda.url=https://api.ftrade.oanda.com\n- oanda.accessToken=7d7411c1234f25d9f5a094e5a356789b-2c9a7b49578904e17720afi\n\
    - oanda.userName=foo\n- oanda.accountId=123456\n- oanda.streaming.url=https://stream-ftrade.oanda.com\n\
    \n+   - oanda.url is the token we want to point out trading bot to. Remember we\
    \ have live, practice and sandbox environments provided by OANDA.\n- oanda.streaming.url\
    \ is the streaming url for tick data and platform events.\n- oanda.accessToken\
    \ is the token which was generated in the environment pointed by oanda.url.\n\
    - oanda.userName is a valid username in the environment pointed by oanda.url.\n\
    - oanda.accountId is a valid account belonging to the value configured for oanda.userName\
    \ in the environment pointed by oanda.url. A valid account id is required to start\
    \ a market data stream for example."
