  md: "# 2.3 Encapulating everything behind a generic AccountInfoService\n\nAs previously\
    \ discussed, one of our key design objective is to be able to encapsulate providers\
    \ behind meaningful services so that if required, we can switch provider implementations\
    \ and change from provider OANDA to say provider LMAX without having to change\
    \ a single line of compiled code. Just changes in the Spring configuration will\
    \ hopefully help us to be able to make this transition smoothly. The AccountInfoService,\
    \ in addition to providing a facade for all AccountDataProvider methods, has 3\
    \ additional useful methods:\n\n```\npublic Collection<K> findAccountsToTrade();\n\
    public double calculateMarginForTrade(K accountId, TradeableInstrument<N> instrument,\
    \ int units);\npublic double calculateMarginForTrade(Account<K> accountInfo, TradeableInstrument<N>\
    \ instrument, int units);\n```\n\nBefore discussing this, lets quickly have a\
    \ glance over the constructor which defines the dependencies of the service.\n\
    \n```\n/**n * @param <K>\n * type of accountId\n * @param <N>\n * type of The\
    \ type of instrumentId in class TradeableInstrument\n * @see TradeableInstrument\n\
    \ */\npublic class AccountInfoService<K, N> {\n    private final AccountDataProvider<K>\
    \ accountDataProvider;\n    private final BaseTradingConfig baseTradingConfig;\n\
    \    private final CurrentPriceInfoProvider<N> currentPriceInfoProvider;\n   \
    \ private final ProviderHelper providerHelper;\n    private Comparator<Account<>>\
    \ accountComparator = new MarginAvailable\n\n    public AccountInfoService(AccountDataProvider<K>\
    \ accountDataProvider, BaseTradingConfig baseTradingConfig, CurrentPriceInfoProvider<N>\
    \ currentPriceInfoProvider, ProviderHelper providerHelper) {\n        this.accountDataProvider\
    \ = accountDataProvider;\n        this.baseTradingConfig = baseTradingConfig;\n\
    \        this.currentPriceInfoProvider = currentPriceInfoProvider;\n        this.providerHelper\
    \ = providerHelper;\n}\n```"
