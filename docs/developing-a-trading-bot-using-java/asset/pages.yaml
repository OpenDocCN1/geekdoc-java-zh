  md: "# 9.2 Fade The Move Strategy\n\nIn this section we are going to discuss and\
    \ implement a very simplistic version of Fade the Move¹ strategy. Our implementation\
    \ of the strategy works as follows\n\n+   - After the strategy is initialised,\
    \ we create a subscription for tick data via pre deined instruments injected via\
    \ the configuration.\n- After every period of time T, lets say 15 minutes (the\
    \ value in the current configuration), we check if the absolute value of difference\
    \ of pips between the price at the start of interval and at the end of the period\
    \ has exceeded a configured value V pips, lets say 45 (the value in the current\
    \ configuration).\n- If the value has exceeded V pips, we then place a limit order,\
    \ opposite to the direction of current market trend, at a distance D pips, lets\
    \ say 25 (the value in the current configuration), from the current price. For\
    \ e.g EURUSD jumped by 55 pips from 1.0815(startprice) to 1.087(current price)\
    \ in the last 15 minutes, we place a limit order to sell EURUSD at price 1.0895\
    \ (1.087+0.0025).\n- We set a target profit of 10 pips (Take Profit at 1.0885\
    \ if limit order filled at 1.0895)\n\nNow lets jump directly to the source code\
    \ to see how the strategy is implemented.\n\n```\n@TradingStrategy\npublic class\
