  md: "# 3.1 Instrument Provider interface\n\nWe must now define the interface that\
    \ the provider must implement to get instrument data. Like accounts, we are only\
    \ interested in readonly data as there is nothing that we can create, update or\
    \ delete regarding instruments on the brokerage platform. It is a very simple\
    \ case of getting immutable data, probably never ever changes, atleast during\
    \ trading hours. There may be rare occasions where certain instruments are no\
    \ longer supported but most of the time, the observation is that new instruments\
    \ are added to traded. Something that might change more frequently but only during\
    \ rollover window, is the interest rate for various currencies. As seen in the\
    \ listing below, our interface is extremely straightforward\n\nCode Listing 3.3:InstrumentDataProvider\
    \ interface definition\n\n```\n/**\n * A provider of tradeable instrument data\
    \ information. At the very minimu\n * provider must provide the instrument name\
    \ and pip value for each instru\n * highly recommended that the data returned\
    \ from this provider is cached\n * immutable collection.\n * @param <T>The type\
    \ of instrumentId in class TradeableInstrument\n * @see TradeableInstrument\n\
    \ */\npublic interface InstrumentDataProvider < T {\n    /**\n * @return a collection\
    \ of all TradeableInstrument available to trade on\n * brokerage platform.\n */\n\
    Collection < TradeableInstrument < T >> getInstruments();\n}\n```"
