  md: "# 7. Event Streaming : Trade/Order/Account Events\n\nEvents are generated on\
    \ a trading platform when a state of an Order/Trade/Account or any other entity\
    \ changes on the platform. Here are some examples which could trigger an event\n\
    \n+   - LIMIT Order filled\n- Trade stopped out\n- Margin closeout of account\n\
    \nWe will discuss many such state changing events later in the chapter and how\
    \ we handle them but will focus on events which only affect Trades/Orders and\
    \ Accounts.\n\nAs discussed in the introduction of the book, we need to create\
    \ an infinite event loop, in order to receive the state changes that happen on\
    \ the platform. The platform, via the event stream, just like market data stream,\
    \ pushes these events and we need to adopt the same paradigm to process these\
    \ events. However there is one stark difference. The market data stream (excluding\
    \ heartbeats) only has tick events which conform to a standard payload. With the\
    \ event stream, we could have differing payloads depending on what state changed\
    \ on what entity. For e.g. when a limit Order is filled on the OANDA platform,\
    \ a response like one is normally sent down the event stream.\n\n```\n{\n  \"\
    transaction\": {\n    \"id\": 10002,\n    \"accountId\": 123456,\n    \"time\"\
    : \"1443968041000000\",\n    \"type\": \"ORDER_FILLED\",\n    \"instrument\":\
    \ \"EUR_USD\",\n    \"units\": 10,\n    \"side\": \"sell\",\n    \"price\": 1.234,\n\
    \    \"pl\": 1.234,\n    \"interest\": 0.034,\n    \"accountBalance\": 10000,\n\
    \    \"orderId\": 0,\n    \"tradeReduced\": {\n      \"id\": 54321,\n      \"\
    units\": 10,\n    }\n}\n```"
