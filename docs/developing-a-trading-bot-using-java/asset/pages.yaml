  md: '# # 10.5 DefaultHeartbeatService


    We are now ready to discuss the service that uses heartbeat payloads to keep track
    of the health of various streaming connections and tries to revive them if they
    stop sending heartbeats. The service, *DefaultHeartbeatService* which extends
    from *AbstractHeartbeatService*, consumes the heartbeat payloads posted by *HeartBeatCallback*
    via the EventBus. Every heartbeat received from the source, helps the service
    keep track of the health of the given stream.


    We first look at the constructor that is injected with all the instances of *HeartBeatStreamingService*
    in a collection, that it must keep track of.


    ```

    protected abstract boolean isAlive(HeartBeatPayload < T > payload);

    protected static long MAX_HEARTBEAT_DELAY = 60000 L;

    private final Map <String, HeartBeatStreamingService > heartBeatProducer

    Maps.newHashMap();

    private final Map <String, HeartBeatPayload < T > payloadMap =

    Maps.newHashMap();

    volatile boolean serviceUp = true;

    protected final Collection < HeartBeatStreamingService >nheartbeatStreamingServices;

    protected long initWait = 2000 L;

    long warmupTime = MAX_HEARTBEAT_DELAY;


    public AbstractHeartbeatService(Collection < HeartBeatStreamingService >

    this.heartbeatStreamingServices = heartbeatStreamingServices;

    for (HeartBeatStreamingService heartBeatStreamingService) {

    heartBeatStreamingServices);

    this.heartBeatProducerMap.put(

    heartBeatStreamingService.getHeartBeatSource(),

    heartBeatStreamingService);

    }

    ```


    The constructor also populates the *heartBeatProducerMap* with each instance of
    *HeartBeatStreamingService* keyed by its source id inside the map. The *payloadMap*
    is a map that has the last *HeartBeatPayload* object for the given heartbeat source.
    It constantly heartbeats for various sources via the EvenBus subscriber method


    ```

    @Subscribe

    @AllowConcurrentEvents

    public void handleHeartBeats(HeartBeatPayload<T> payload) {

    this.payloadMap.put(payload.getHeartBeatSource(), payload);

    }

