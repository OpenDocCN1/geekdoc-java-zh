    OandaStreamingService which is the base class for OandaEventsStreamingService
    and OandaMarketStreamingService implements the interface and provides the plumbing
    to handle these heartbeats. Lets look specifically now at the implementation of
    the 3 interface methods in this abstract class. Additionally, we will also look
    at the method which parses the json payload and the constructor


