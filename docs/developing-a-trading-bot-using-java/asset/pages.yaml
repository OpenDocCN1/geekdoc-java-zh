    this.authHeader = OandaUtils.createAuthHeader(accessToken);

    }

    protected void handleHeartBeat(JSONObject streamEvent) {

    Long t = Long.parseLong((JSONObject) streamEvent.get((OandaJsonKeys.heartBeatCallback.onHeartBeat(new
    HeartBeatPayload < DateTime new Dat SourceId)));

    }

