  md: '# 1.5 Code Organisation and Software Stack Used


    Following on from our discussion of design goals in the previous sections, the
    code will be organised atleast 3 different projects ,i.e., atleast 3 jar files
    will be produced from the build. Why are we saying atleast 3? Remember from our
    earlier discussion, that one of the key design goals is to be able to switch provider
    implementation at runtime. Since we could have more than 1 provider from which
    we can decide, there will be atleast 3 jar files. We are going to discuss only
    1 implementation in the book,i.e., the O REST API implementation. Developers who
    would use the framework, are encouraged to develop more provider implementations.


    +   * trading-core is the core of the project. It comprises all the specifications/interfaces
    that must be implemented. It also comprises the generic services which make use
    of the core interfaces and provide additional useful API methods.

    * oanda-restapi is our reference implementation for the specification and will
    be discussed in the book. You are more than welcome to swap this over with your
    own.

    * tradingbot-app is the main application that uses Spring to inject the provider
    api at runtime. It is also the project where we define our strategies and can
    implement app specific stuff. Later in the book, we are going to talk about integration
    with social media, especially Twitter, which we would implement in this project.'
  merge: -1
