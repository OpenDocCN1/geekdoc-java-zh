  md: "GoogleBus7, which is part of the guava library, is an excellent broker to facilitate\
    \ loose coupling of our services and to allow publish-subscribe style communication\
    \ between them. The coolest feature about it, is the ability to add subscribers\
    \ by just adding an annotation without having the explicit need of knowing who\
    \ the publisher is.\n\nLots of useful information is found on the wiki page of\
    \ the EventBus but it would be worth discussing how it is used in the trading\
    \ ecosystem. Lets take the use of disseminating market data event, to one or multiple\
    \ subscribers. Assuming a singleton EventBus has been created by the Spring DI\
    \ container,\n\n+   * Register Subscribers automatically: Here we write a BeanPostProcessor\
    \ to automatically find beans which has methods annotated @Subscribe annotation\
    \ and call the EventBus.register method to register the subscribers.\n\n```\n\
    public class FindEventBusSubscribers implements BeanPostProcessor {\n@Autowired\
    \ private EventBus eventBus;\nprivate static Logger LOG = Logger.Logger(FindEventBusSubscriber);\n\
    @Override\npublic Object postProcessAfterInitialization(Object bean, String beanName)\n\
    Method[] methods = bean.class().getMethods();\nfor (Method beanMethod : methods)\
    \ {\n  if (beanMethod.isAnnotationPresent(Subscribe.class)) {\n    eventBus.register(bean);\n\
    \    LOG.info(String.format(\"Found event bus subscriber class %s. Subscriber\
    \ method %s\", bean.class().getSimpleName(), beanMethod.getName()));\n    break;\n\
    \  }\n}\n  return bean;\n}\n@Override\npublic Object postProcessBeforeInitialization(Object\
    \ bean, String beanName)\n  return bean;\n}\n```\n\n+   * Create Publisher: It\
    \ is sufficient to just call the post(Object payload) to post it to the EventBus."
