  md: 'The first 3 interface methods are fairly self-explanatory. The method findHistoricPnlTweetsForInstrument
    requires a bit of explanation. The contract for this method is to retrieve Tweets
    that were posted by a given user for a given instrument and were all close trades
    tweets, which resulted in a PNL figure (for e.g. a positive or a negative pip
    figure). Refer back to the close trade tweets from the 2 users discussed in this
    chapter). This again probably won''t make much sense now, but will do so when
    we discuss our Twitter based strategy in the next chapter.


    # 8.3.3 AbstractFXTweetHandler base class


    We start the discussion about the implementation of FXTweetHandler interface by
    defining an abstract class that implements this interface but implements couple
    of key methods of the interface findTweets() and getUserId().


    The implementation of the method findTweets() in particular, presents us with
    the opportunity to discuss Twitter search API. The API provides comprehensive
    set of query operators which enables us to build a search query and retrieve a
    collection of tweets in reverse chronological order. The response from Twitter
