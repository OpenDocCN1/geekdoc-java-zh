  md: '# 8. Integration With Twitter


    We have now reached probably the most exciting part of our journey in building
    the trading bot. Interacting with social media is probably one of the most important
    things a bot should be able to do. It probably wasn''t important a few years ago
    but now it is extremely so because most news, events and leaks seem to appear
    on social media first, which affect the markets. The ability to subscribe to these
    feeds in realtime, make sense of it and make a decision, adds a layer of sophistication
    to any bot. Ours is no exception, except that we will not attempt to consume thousands
    of tweets per second but learn the basics of integrating with a Twitter. We aim
    to achieve the following by the end of this chapter


    +   * Connect to a Twitter account.

    * Search for Tweets.

    * Parse Tweets and make sense of them.


    In particular we would be focussing on FX Tweets from users, whose Tweets have
    a well defined structure and have information about Orders and Trades. The idea
    is that by doing so, we can build a strategy, to copy what others are doing and
    maybe either do what they are doing or do the complete opposite. This will be
    discussed in detail in the next chapter, as part of a strategy which will involve
    this concept.'
