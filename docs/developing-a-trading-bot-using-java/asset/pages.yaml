  md: "# 7.1 Streaming Event interface\n\nOur first step is to define an interface\
    \ that establishes the event loop with the platform. This is exactly similar in\
    \ concept as market data streaming interface. After establishing the event loop,\
    \ all events are then delegated to the appropriate event handlers via the EventCallback\
    \ that we shall discuss soon. First lets quickly have a look at this interface\n\
    \n```\n/**\n * A service that provides trade/order/account related events streaming,\n\
    \ * Normally the implementation would create a dedicated connection to the\n *\
    \ platform or register callback listener(s) to receive events. It is\n * recommended\
    \ that the service delegate the handling of events to specify,\n * handlers which\
    \ can parse and make sense of the different plethora of events\n */\npublic interface\
    \ {\n    /**\n * Start the streaming service which would ideally create a dedicated\n\
    \ * connection to the platform or callback listener(s). Ideally multiple\n * connections\
    \ requesting the same event types should not be created.\n */\n    void startEventsStreaming();\n\
    \n/**\n * Stop the above events streaming services and dispose any resources/comic\n\
    \ * in a suitable manner such that no resource leaks are created.\n */\n    void\
    \ stopEventsStreaming();\n}\n```\n\nThe definition of EventCallback that may be\
    \ used in tandem to disseminate the events is\n\n```\npublic interface EventCallback<T>\
    \ {\n    void onEvent(EventPayload<T> eventPayLoad);\n}\n```\n\nThe two interfaces\
    \ have similar design objectives as that of the market data ones. The real differences\
    \ emerge in the downstream dissemination of these different payloads which we\
    \ will soon discover when the EventBus enters the scene. But before that, let's\
    \ quickly look at the OANDA implementation for EventsStreamingService"
