  md: "We can use this internal cache and derive some other useful information as\n\
    \n+   1. what is the net count of positions for a given currency?\n2. find all\
    \ accounts which has trades for a given instrument.\n3. what is the value of total\
    \ open positions?\n\nWe are trying to code the first 2 above, to demonstrate how\
    \ quickly we can get answers to various questions, using this cache. The first\
    \ one is called findNetPositionCountForCurrency, which returns the net count of\
    \ open positions for the given currency.\n\n```\n/**\n * @param currency\n * @return\
    \ the net position for a given currency considering all Trades Fc\n * all Accounts.\
    \ A negative value suggests that the system has net\n * short position for the\
    \ given currency, whilst a positive value\n * suggests a net long position.\n\
    \ * @see TradingUtils#getSign(String, com.preiustech.ftrading.TradingSignal, String)\n\
    \ */\npublic int findNetPositionCountForCurrency(String currency) {\n    int posCount\
    \ = 0;\n    lock.readLock().lock();\n    try {\n        for (K accountID: this.tradesCache.keySet())\
    \ {\n            posCount += findNetPositionCountForCurrency(currency, accountID);\n\
    \        }\n    } finally {\n        lock.readLock().unlock();\n    }\n    return\
    \ posCount;\n}\n\nprivate int findNetPositionCountForCurrency(String currency,\
    \ K accountID) {\n    synchronized (tradeMap) {\n        if (TradingUtils.isEmpty(tradeMap))\
    \ {\n            return 0;\n        } else {\n            int positionCtr = 0;\n\
    \            for (Collection <Trade<M, N, K>> trades: tradeMap.values()) {\n \
    \               for (Trade<M, N, K> tradeInfo: trades) {\n                   \
    \ positionCtr += tradeInfo.getSign(tradeInfo.getInstrument()).getInstrument(tradeInfo.getSide(),\
    \ currency);\n                }\n            }\n            return positionCtr;\n\
    \        }\n    }\n}\n```"
