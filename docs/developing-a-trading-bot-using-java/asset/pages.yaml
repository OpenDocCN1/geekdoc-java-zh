  md: 'We also have a @PostConstruct annotated method init() where we initialise a
    guava² Cache for each instrument injected. The cache is keyed by DateTime of the
    tick data event and the value is the MarketDataPayload. We also set the expireAfterWrite
    value T provided by tradingConfig.getFadeMovePriceExpiry() to automatically expire
    the entries from the cache after T minutes.


    The method handleMarketEvent() is annotated by the @Subscribe annotation which
    means it receives all tick data events which have been parsed into the MarketDataPayload
    object and disseminated by the EventBus. Once received, the instance of MarketDataPayload
    is only accepted if it relates to the instrument we configured for the cache and
    then put in the cache for that instrument.


    The main action in the strategy happens in the method analysePrices(). This method
    is called by the task scheduler every T minutes, the value of which is configured
    in the Spring configuration. This should normally be the same as tradingConfig.getFadeMovePriceExpiry().
    We start by looping through all instruments configured in the cache. For each
    of them, we calculate how much has been the pip jump in absolute value in the
    given time period. If the pip jump is not above the minimum threshold (getfadeTheJumpReQDToTrade()),
    we ignore this. If the pip jump is above this threshold, we try to ascertain the
    market trend by looking at the sign of the pip jump. If trend -ve, we know the
    trend is downwards else upwards. For upwards trend we place a SHORT trade or LONG
    for a downwards trend. We then calculate the limit price of order using tradingConfig.getFadeMoveDistanceToTrade()
    and using tradingConfig.getFadeTheMovePipsDesired().


    This concludes are discussion of this strategy. It is quite a well known strategy
    and seems to work. We should try not to put a large number for the take profit
    pips. It seems to work most of the time if this value is around 10-12 pips. That
    seems to be the general observations of a lot of market participants.'
