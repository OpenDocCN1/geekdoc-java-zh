  md: '# 1.6 OANDA REST API as Reference Implementation


    **Declaration-** I have no current or past commercial relationship with OANDA
    and I have chosen OANDA REST API as a reference implementation simply on its technical
    merit and the fact that it is likely to have wider adoption as it is free to use.
    If there is something similar around, I would be happy to give it a try as well.


    I encountered the OANDA API by chance. At the time, I was looking for a broker
    who was offering free API for trading (just in case i wanted to convert to a production
    account) and more importantly supported the Java programming language. It was
    very easy to get started, as most of the examples used `curl` to demonstrate various
    trading actions like getting a list of instruments, place an order or get historical
    candle sticks data. I could just type the `curl` commands on my mac terminal and
    fire away. By seeing the json response received with each `curl` request fired.
    By seeing the responses and data in realtime, I got a really good idea and appreciation
    of various APIs supporting instruments, orders, rates, positions etc.


    The `curl` command examples was a good starting point and I started to experiment
    writing equivalent commands as test cases in Java described on the REST API⁴ page.


