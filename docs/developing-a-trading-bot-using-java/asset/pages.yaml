  md: "# 10.4 HeartBeatCallback interface\n\nLike the other Callback that we have\
    \ looked at so far, the HeartBeatCallback is no different. It is directly invoked\
    \ by the provider implementation that is directly receiving streaming events from\
    \ the platform. After parsing the event and creation of an HeartBeatPayload instance,\
    \ the onHeart method is invoked. Let us jump directly to how the source code looks.\n\
    \n```\npublic interface HeartBeatCallback<T> {\n  void onHeartBeat(HeartBeatPayload<T>\
    \ payload);\n}\n```\n\nThe implementation for the interface above is similar to\
    \ other Callback interfaces we have discussed previously. The HeartBeatPayload\
    \ is disseminated to downstream consumers via the EventBus\n\n```\npublic class\
    \ HeartBeatCallbackImpl < T > implements HeartBeatCallback < T {\n  private final\
    \ EventBus eventBus;\n  public HeartBeatCallbackImpl(EventBus eventBus) {\n  \
    \  this.eventBus = eventBus;\n  }\n  @Override\n  public void onHeartBeat(HeartBeatPayload\
    \ < T > payload) {\n    this.eventBus.post(payload);\n  }\n}\n```"
