  md: '# 10. HeartBeating


    Heartbeats are a crucial element of any trading system. Any streaming or persistent
    connection over a long period of time must send a heartbeat the pipe to let the
    consumer know that all is well and alive. Ours is no exception. In short heartbeat
    indicates the health of a system.


    The bot, in theory, should receive frequent heartbeats to be assured that all
    is well. If the heartbeat is irregular or exceeds the wait period for an expected
    heartbeat, it would try to reconnect and restore the passive event stream.


    In this chapter we discuss heartbeats, how to process them and what to do if we
    stop receiving them.'
