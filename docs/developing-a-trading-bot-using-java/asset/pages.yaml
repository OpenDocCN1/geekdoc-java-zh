  md: '# 10.3 A concrete implementation for HeartBeatStreamingService


    OANDA pushes the heartbeat events via the same stream, i.e., it uses the market
    data and trade/order/account event streams to intermittently push a heartbeat
    payload to communicate the wellbeing of the respective streams. An example heartbeat
    payload looks like


    ```

    {"heartbeat": {"time":"1443968021000000"}}

    ```


