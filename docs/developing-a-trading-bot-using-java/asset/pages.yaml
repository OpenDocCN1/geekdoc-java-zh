  md: "# 1.4 Design Goals\n\n+   * One of the key design goals, alluded to the beginning\
    \ of this chapter, is to have the ability to change the implementation of a broker/exchange\
    \ platform at runtime using Spring configuration. This is possible, if we can\
    \ create specifications for these platform API calls, very similar to the JDBC\
    \ specification. For e.g. a sample specification/interface defining the position\
    \ management requirements are\n\n```\n1 /**\n2  * A provider of services for instrument\
    \ positions. A position for an inst\n3 * is by definition aggregated trades for\
    \ the instrument with an average p\n4 * where all trades must be a LONG or a SHORT.\
    \ It is a useful service\n5 * project a summary of a given instrument and also\
    \ if required close all\n6 * for a given instrument, ideally using a single call.\n\
    7 *\n8  * The implementation might choose to maintain an internal cache of positi\n\
    9 * order to reduce latency. If this is the case then it must find me to\n10 *\
    \ order/trade event or 2) regularly refresh the cache after a given time\n11 period.\n\
    12 *\n13  * @param <M>\n14 * The type of instrumentId in class TradeableInstrument\n\
    15  * @param <N>\n16 * the type of accountId\n17 *\n18  * @see TradeableInstrument\n\
    19 \n20 public interface PositionManagementProvider<M, N> {\n21  /**\n22   * @param\
    \ accountId\n23   * @param instrument\n24   * @return Position<M> for a given\
    \ instrument and accountId(may be n\n25   *     all trades under a single account).\n\
    26   */\n27 Position<M> getPositionForInstrument(N accountId, TradeableInstrument\n\
    28  /**\n29   *\n30   * @param accountId\n31   * @return Collection of Position<M>\
    \ objects for a given accountId.\n32   */\n33 Collection<Position<M>> getPositionsForAccount(N\
    \ accountId);\n34  /**\n35   * close the position for a given instrument and accountId.\
    \ This is\n36   * way to close all trades for a given instrument in an account.\n\
    37   */\n```"
  merge: -1
  pgno: 11
- img_proc: true
  md: "```\n* @param accountId\n* @param instrument\n* @return if the operation was\
    \ successful\n */\nboolean closePosition(N accountId, TradeableInstrument<M> instrument\n\
    }\n```\n\nIf we create such specifications/interfaces for each aspect of the platform\
    \ interaction, we can in theory create providers for these services and swap them\
    \ as required, through the Spring configuration. From code organisation perspective,\
    \ all these interfaces, therefore would go in a project, that form part of the\
    \ core api. This project would therefore be broker/exchange provider agnostic\
    \ and would comprise such interfaces and services.\n\n+   * Write services that\
    \ solve a single business problem or a collection of related problems. These services\
    \ lend themselves to easy unit testability and code reuse that eventually leads\
    \ to better software quality.\n* Loosely couple services. This enables reducing\
    \ system dependencies and as a result in more maintainable software. Our software\
    \ would be continuously evolving as one might decide to integrate more social\
    \ media feeds or add more complex strategies. Writing loos coupled components\
    \ ensures that we have little knock on effect on already working code.\n* High\
    \ unit test coverage. It is extremely important that we aim to have a high unit\
    \ test coverage. When used in a production environment where real money could\
    \ be involved, a large unit tests coverage will ensure that we catch regressions\
    \ and bugs early on and prevent the manifestation of bugs as much as possible\
    \ in the production environment."
  merge: -1
