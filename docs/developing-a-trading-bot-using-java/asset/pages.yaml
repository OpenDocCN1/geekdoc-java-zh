  md: "# 6.10 Encapsulating Read operations behind TradeInfoService\n\nThis service\
    \ is arguably a really nice and simple but yet powerful example of advocating\
    \ why we should embrace the concept of services. It demonstrates how a service\
    \ could, for example introduce an internal cache as an optimisation step to avoid\
    \ going to the data provider for the same data again and again, be it a REST service\
    \ or a database fetch via DAO. If we were directly going to the provider for data,\
    \ even though it does not change very often, we would just be introducing latency\
    \ and recomputations in the request even though the results are exactly the same\
    \ as the last one. By using a service, we can introduce an internal cache to manage\
    \ data provided from the data provider (database or an external source like REST)\
    \ and store computed results which may consume cpu cycles or are resource intensive.\
    \ Lets start by looking at the definition and constructor for this service\n\n\
    ```\n/**\n * A service that provides information regarding a Trade. It maintains\
    \ an\n * internal cache of all trades grouped per account in order to minimize\n\
    \ * latency.\n *\n * <p>\n * It is strongly recommended to use this service as\
    \ a singleton and not c\n * multiple instances in order to minimize the memory\
    \ footprint incurred l\n * cache and the latency induced by the cache construction.\
    \ This class\n * exposes a method to refresh the cache if required in a ThreadSafe\
    \ manner\n * It is imperative that it be called for events which create, create\
    \ or\n * trade in order to keep the cache in sync with the trading platform.\n\
    \ * If such callback is not supported by the trading platform, then a\n * based\
    \ approach can be implemented externally, that periodically refreshes the cache.\n\
    \ * * The accountId is the key of the internal cache. If accountId is a user c\n\
    \ * object, rather than the commonly used ones as Integer, Long, or Str\n * please\
    \ make sure hashCode() and equals() methods are implemented.\n * </p>\n * @param\
    \ <M>\n * The type of tradeId\n * @param <N>\n * The type of instrumentId in class\
    \ TradeableInstrument\n * @param <K>\n * The type of accountId\n * @see TradeableInstrument\n\
    \ * @see refreshForAccount\n */\npublic class TradeInfoService < M, N, K > {\n\
    ```"
