    # 11.1.4 EventMailNotifier Service


    The EventMailNotifier is a simple service which has a eventContentGeneratorMap
    that is injected by Spring and configured inside the app Spring configuration
    file. The map is keyed by an instance of Event interface and it is a implementation
    of the EmailContentGenerator interface. When an EventPayload is received by the
    Event Bus inside the notifyByEmail method, this map is searched for an appropriate
    instance of EmailContentGenerator, that could handle this payload. If found, this
    instance then generates an EmailPayLoad instance.'
