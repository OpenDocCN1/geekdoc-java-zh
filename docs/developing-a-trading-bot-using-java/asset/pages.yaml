  md: "At the time onEvent method is invoked, it already has an appropriate subtype\
    \ of the EventPayLoad, to be dispatched.\n\nSince we want to exploit the fine\
    \ grained dispatching of the subtypes of EventPayLoad by the EventBus, we need\
    \ to create payload handlers that can polymorphically handle these specific payloads.\
    \ To achieve that, we need to first define an EventHandler that has a method to\
    \ do exactly that.\n\n```\npublic interface EventHandler<K, T extends EventPayLoad<K>>\
    \ {\n  void handleEvent(T payload);\n}\n```\n\nIn the definition above, we are\
    \ stipulating that the handleEvent events of type which are subtypes of EventPayLoad.\n\
    \nFor the set of events relating to the Trade business entity, an implementation\
    \ of the TradeEventHandler would look like\n\n```\npublic class TradeEventHandler\
    \ implements EventHandler < JSONObject,\n  EventPayLoad> {\n  private final Set<TradeEvents>\
    \ tradeEventsSupported = new HashSet<>(TradeEvents.STOP_LOSS_FILLED, TradeEvents.CLOSE,\
    \ TradeEvents.TAKE_PROFIT_FILLED);\n  private final TradeInfoService < Long,\n\
    \  String,\n  Long > tradeInfoService;\n  public TradeEventHandler(TradeInfoService\
    \ < Long, String, Long > {\n    this.tradeInfoService = tradeInfoService;\n  }\n\
    ```\n\n```\n@Override\n@Subscribe\n@AllowConcurrentEvents\npublic void handleEvent(TradeEventPayLoad\
    \ payload) {\n  Preconditions.checkNull(payload);\n  if (!tradeEventsSupported.contains(payload.get()))\
    \ {\n    return;\n  }\n  JSONObject jsonPayload = payload.getPayload();\n  long\
    \ accountId = (Long) jsonPayload.get(\"OandaJsonKeys.accountId\");\n  tradeInfoService.refreshTradesForAccount(accountId);\n\
    }\n```\n\nThe TradeEventHandler handles the TradeEventPayLoad payload as per it’s\
