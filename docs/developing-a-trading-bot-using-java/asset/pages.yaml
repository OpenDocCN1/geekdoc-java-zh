  md: "# 4.3 DownstreamMarket data event dissemination: MarketEventCallback\n\nIn\
    \ order to understand what exactly happens to our market data event downstream,\
    \ we need to look into a sample implementation of MarketEventCallback interface.\n\
    \n```\npublic class MarketEventHandlerImpl < T > implements MarketEventCallback\
    \ {\n    private final EventBus eventBus;\n    public MarketEventHandlerImpl(EventBus\
    \ eventBus) {\n        this.eventBus = eventBus;\n    }\n\n    @Override\n   \
    \ public void onMarketEvent(TradeableInstrument < T > instrument, double ask,\
    \ double ask, DateTime event) {\n        MarketDataPayload < T > payload = new\
    \ MarketDataPayload < T > (instrument);\n        eventBus.post(payload);\n   \
    \ }\n}\n```\n\nThe implementation MarketEventHandlerImpl, could not have been\
    \ simpler. Basically, it is delegating the event dissemination to the GoogleBus,\
    \ depending on how it is configured (synchronously or asynchronously) will disseminate\
    \ this event to any method that has the annotation @Subscribe and has the input\
    \ parameter MarketDataPayload<T> to a void method. An e.g. signature would look\
    \ like\n\n```\n@Subscribe\n@AllowConcurrentEvents\npublic void handleMarketDataEvent(MarketDataPayload<T>\
    \ marketPayload) {\n\n}\n```\n\nThat is it! We can create any number of such subscribers,\
    \ and get a callback from the event bus with the post(MarketDataPayload) payload.\
    \ We will see in later chapters, how we can plug in subscribers, such as components\
    \ based around trading strategies, which are heavy consumers of market data."
