  md: "```\npublic class DefaultHeartbeatService\nextends AbstractHeartbeatService\
    \ < DateTime> {\n    public DefaultHeartbeatService(Collection < HeartbeatStreamingService>\n\
    \    heartbeatStreamingServices) {\n        super(heartbeatStreamingServices);\n\
    \    }\n\n    @Override\n    protected boolean isAlive(HeartbeatPayload < DateTime>\
    \ payload) {\n        return payload != null && (DateTime.now().getMillis() -\n\
    \        payload.getHeartbeatPayload().getMillis()) < MAX_HEARTBEAT_DELAY;\n \
    \   }\n}\n```\n\nThis service, as defined in the code above, HeartBeatPayload<DateTime>.\
    \ The isAlive implementation uses the payload which has a DateTime and then does\
    \ some math to figure out if the time since the last payload received has breached\
    \ the MAX_HEARTBEAT_DELAY. If it hasn't, the streaming connection is deemed to\
    \ be alive else. Going back to the background thread above, if isAlive return\
    \ false, then try to restart the streaming connection via invocation to startHeartbeatstreaming().\
    \ If the streaming connection restarts successfully, the posts to the handleHeartbeats\
    \ method should resume and isAlive should then return true.\n\nThere may be cases\
    \ where other platforms might send a dummy object or a string down the pipe to\
    \ communicate that it is heart beating. In such cases the DefaultHeartbeatService\
    \ may be inadequate. For these, we may have to create a wrapper payload that includes\
    \ the original payload and the time it was received by the handleHeartbeats method.\
    \ The wrapper payload may have to be passed to another implementation which extends\
    \ the AbstractHeartbeatService and implements the isAlive accordingly.\n\nThis\
    \ concludes are discussion of the heartbeat mechanism of the bot. The heartbeats\
    \ are extremely important functionality of the bot because they tell us the health\
    \ of the streams that are core to the functioning of the bot. A of the strategies\
    \ might depend on the tick data stream and we cannot afford to have it down for\
    \ a long period of time. We need to have the trade/order/account stream up and\
    \ running so that the caches are in sync with the platform."
