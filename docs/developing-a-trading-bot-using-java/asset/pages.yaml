    the given user. We will come back to discussing the handlers shortly. Before that
    lets look at how we search for Tweets from given users.


    # 8.3.1 TweetHarvester interface


    The TweetHarvester interface mandates the search for Tweets for a given user that
    result in a collection of both new/closed trades FX Tweets. Its definition is
    as follows


    ```

    public interface TweetHarvester < T > {

    Collection < NewFXTradeTweet < T >> harvestNewTradeTweets(String userId);

    Collection < CloseFXTradeTweet < T >> harvestHistoricTradeTweets(String userId);

    TradeableInstrument < T > instrument);

    }

    ```


    The first method of the interface is fairly straightforward. This method''s contract
    is to harvest new Trade Tweets from a given user since the last search was done.
    The implementer is responsible for keeping track of the timeline and should only
    return the new ones.


    The second method''s contract is again to harvest new Tweets, this time for closed
    trades, since the last search and for a given instrument.


    # 8.3.2 FXTweetHandler interface


    As we discussed earlier on, in this chapter, as long as a given user consistently
    tweets in a given format, a dedicated handler assigned to fx new/close trade tweet,
    can it parse and create the NewFXTradeTweet and CloseFXTradeTweet from it. This
    interface, formulates that contract and provides a few other methods


    ```

    public interface FXTweetHandler < T > {

    FXTradeTweet < T > handleTweet(Tweet tweet);

    String getUserId();

    Collection < Tweet > findNewTweets();

    Collection < Tweet > findHistoricPnlTweetsForInstrument(

    TradeableInstrument < T > instrument);

    }

    ```'
