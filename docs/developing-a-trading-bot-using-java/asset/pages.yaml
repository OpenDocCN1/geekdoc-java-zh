    # 13.1.4 Mocking Twitter Interaction


    Mockito makes interacting with Twitter extremely easy. The only thing to bear
    in mind is that the search queries might differ for various user accounts when
    it comes to historic pnl tweets. Therefore, for every new user account handler
    we introduce, this test be catered for.


    To get mock Tweets from Twitter which can be parsed for new trade or pnl tweets
    for all users, we must prepare the ground of mock objects. That includes


    +   - Creating a mock for Twitter interface (which is implemented by TwitterTemplate
    as part of Spring Social).

    - Creating a mock for SearchOperations class, which is used to search for Tweets,
    given a search query.

    - Creating a mock for SearchResults which return the mocked Tweets when getTweets()
    is called on this object.

    - The invocation of method getTweets() returns a list of Tweet objects which can
    be a list of mocked Tweet objects. The key is to intercept the getText() method
    on the individual mocked Tweet object and return the text that we want.'
