  md: '# 10.1 HeartBeatPayload


    Every persistent/streaming connection potentially can have different payloads
    to communicate the state of the connection. In order to accommodate for this wide
    range of payload types, we define the following pojo that models this characteristic


    ```

    1 public class HeartBeatPayload < T > {

    3 private final T payload;

    4 private final String source;

    5

    6 public HeartBeatPayload(T payload) {

    7     this(payload, StringUtils.EMPTY);

    8 }

    9

    10 public T HeartBeatPayload(T payload, String source) {

    11     this.payload = payload;

    12     this.source = source;

    13 }

    14

    15 public T getHeartBeatPayload() {

    16     return this.payload;

    17 }

    18

    19 public String getHeartBeatSource() {

    20     return this.source;

    21 }

    22

    ```


    The source attribute identifies the source of the heartbeat. This is to distinguish
    between different heartbeat sources in the system. For e.g. in the trading system,
    we have atleast 2 heartbeat streams, one for the tick data and the other for the
    trade/order/account events.'
