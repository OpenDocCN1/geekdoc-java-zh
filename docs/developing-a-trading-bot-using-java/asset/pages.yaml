- img_proc: true
  md: '# 12.1 Configuration of the trading bot


    We start by creating the main configuration file in the project tradingbot-app
    in the src/main/resources folder, which is automatically included in the build
    and as a result ends up inside the tradingbot-app.jar file. The name of file is
    tradingbot-app.xml. We also create the properties file, tradingbot.properties,
    that has the values for various placeholders referenced in this Spring configuration
    file.


    We also use the cool SpEL¹ in our configuration, the reason for which will become
    clear as we progress through this chapter.


    # 12.1.1 Core Beans Configuration


    In this section we configure all the core beans that are part of the core api
    except the services which we will configure later. These beans include email,
    queues, trading config etc. which are central to the functioning of the bot.


    Since all our dependency beans are @Autowired, we switch on annotation processing
    <context:annotation-config/> in the configuration file. We will ensure that all
    the dependencies which we have injected via @Autowired will be processed correctly.
    We also switch on property files by including the following in the configuration
    file and also specify where to find the properties file


    ```

    <context:property-placeholder location="classpath:tradingbot.properties" i

    ```


    The trading.properties has the following properties. We have put in some sample
    values to demonstrate how they like.


    ```

    1 mail.to=tradingbot@gmail.com

    2 mail.host=smtp.gmail.com

    3 mail.port=465

    4 mail.user=foobar@gmail.com

    5 mail.password=foobar123

    6 twitter.consumerKey=zveJerryUYHUDHILDJXc16O44R

    7 twitter.consumerSecret=i51PtFblBKMYUY0HNB3yAdeeFeEQQMukRiT3mnNICEKyNp20In

    8 twitter.accessToken=0123456789-IS3PY90mlGb0Sw54vgd0RR73132YPratOx3JU

    9 accessToken=5IrbOY1G0ld7UPEGxPxFJVNWH2MN4Tol2kmVTT

    ```


    We have discussed the Twitter integration properties in Chapter 8. The mail properties
    are used to configure the JavaMailSender in the Spring configuration except mail.to,
    which is actually the TO address of the user who gets all the notifications generated
    by the bot.'
