  md: '# ## 4. Event Streaming : Market Data Events


    Now we have reached the point, where the true existence of the trading bot will
    start to become apparent. From here onwards, we are going to step into the real
    aspects of trading, one of which is to handle real time events and act upon them,
    after meaningfully analysing them. One could have event streams in the following
    shape and form:


    +   - Market Data events, i.e., change in the price of an instrument.

    - Trade/Order/Account events, i.e., order filled or stop loss level hit.

    - Social media events, i.e., tweets from influential people or market movers.

    - Any other source


    As we can see, we could have numerous event streams, bombarding are trading bot
    with varying degrees of intensity. Handling them and making decisions based on
    them is the cornerstone of the trading bot design. In this chapter, we exclusively
    discuss, how to handle market data events and how to disseminate them using the
    **Google EventBus.**'
