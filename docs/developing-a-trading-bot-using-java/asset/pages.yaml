  md: 'What we need now, a background thread, to periodically check the last time
    payload was received and if it breaches the threshold for delay delayed for heartbeats,
    try to revive it by calling the startHeartBeatStreaming().


    ```

    @PostConstruct

    public void init() {

    this.heartBeatObserverThread.start();

    }

    final Thread heartBeatObserverThread = new Thread(Runnable() {

    private void sleep() {

    try {

    Thread.sleep(waitTime); /*let the streams start naturally*/

    } catch (InterruptedException e1) {

    LOG.error(e1);

    }

    });

    @Override

    public void run() {

    while (serviceUp && !isAlive(payloadMap)) {

    for (Map.Entry<String, HeartBeatStreamingService> entry : heartBeatProducerMap.entrySet())
    {

    long startWait = initWait //with 2 secs

    while (serviceUp && !isAlive(payloadMap.get(entry.getKey()))) {

    entry.getValue().startHeartBeatStreaming();

    LOG.warn("heartbeat source %s was not responding." " + " Just restarted and it
    will listen for heartbeat after %d ms", entry.getKey(), waitTime);

    }

    try {

    Thread.sleep(waitTime);

    } catch (InterruptedException e) {

    LOG.error(e);

    }

    // the sleep time but not more than MAX_HEARTBEAT_DELAY

    startWait = Math.min(MAX_HEARTBEAT_DELAY, 2 * startWait);

    }

    }

    },"HeartMonitorThread");

    ```


    The @PostConstruct annotated method init() launches the heartBeatObserver background
    thread. This thread periodically wakes up and loops through the heartBeatProducerMap
    for each of the entry in the map, checks if the service is alive. The isAlive
    method that does the check is implemented by the DefaultHeartBeatService'
