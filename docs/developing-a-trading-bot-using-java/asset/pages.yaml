  md: '# 2. Account Management


    Ability to manage the account is probably the first thing we need to build our
    bot. When one opens a trading account with a brokerage/exchange, an account gets
    created which can be funded directly by bank transfer, credit card, PayPal etc.
    An account has a base currency, which is normally the currency of the funding
    source. For e.g. if you are based in the UK and have an account with one of the
    UK banks which will be used to fund the trading account, then the trading account
    will have a base currency of GBP.


    However, some platforms give you the option to create other currency accounts,
    even though you may not have a funding source setup for them. For e.g. after being
    assigned a GBP account as a result of funding from UK bank, one can create additional
    USD account, even though the user does not have a USD funding source. The USD
    account can be funded however by transferring an amount of GBP from the main account,
    effectively selling GBPUSD. This exercise can be repeated for other currency accounts
    like CAD, EUR etc.


    All accounts on most brokerage platforms, have the following attributes that can
    be queried:


    +   * An account id.

    * Base currency

    * Total amount.

    * Balance remaining to trade.

    * Leverage


    Other optional information might include:


    +   * Realised PNL

    * Unrealised PNL

    * Margin Used

    * Open Trades

    * Open Orders


    We begin by capturing all this information by creating Account POJO. Here we provide
    2 constructors, one with minimum attributes required to construct the object based
    on the discussion above.'
