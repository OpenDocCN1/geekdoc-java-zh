    Now that the bot is fully built, we are now ready to run the bot. But before we
    really push the button, we need to make sure the following config params have
    been adapted and a build so that these changes are in the jar file for the given
    user. So here is the full checklist of changes


    +   1. ALL OANDA specific parameters in the *tradingbot-oanda.properties* belong
    to the user of a valid live or practice account.

    2. ALL Twitter specific access tokens in *tradingbot.properties* are correctly
    populated. These valid tokens are generated for a Twitter App for a Twitter account
    that the user has full access.

    3. Double check that the values for the bean *TradingConfig* are within comfortable
    limits, especially *maxAllowedQuantity, minReserveRatio* and *maxAllowedNetContracts.*

    4. Configure a valid mail account in *tradingbot.properties*. The credentials
    used here will be used to send email notifications out to the *mail.to* address.

    5. Configure *log4j.properties* in tradingbot-app resources directory to required.

    6. Execute *buildbot.sh* again to rebuild the bot with the new set of parameters,
    configured above.


    To run the bot with the strategies discussed in the book and OANDA implementation,
    we simply do the following


