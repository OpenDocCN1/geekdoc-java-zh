  md: '# 6.5 Validating orders before execution: PreOrderValidationService


    Before we turn our attention to discussing the service that encapsulates the order
    execution, modification and deletion part, we discuss an important service that
    does some pre order execution checks, and only if those checks succeed, that again,
    purely in place, for risk management perspective, and can be bypassed if really
    required. We will discuss in later chapters, when it is really important to have
    risk management controls in place, especially for highly leveraged accounts. However
    for our discussion, I came up with some rules or checks which must be done in
    order to give a green light to the order execution. These set of checks may or
    may not be sufficient for all cases, but the point is that we must do some diligence
    upfront, before placing an order. The rules I have up with are:


    +   1. Be overweight or underweight a currency only upto a given level. This is
    to say that, we must have both long and short positions for AUD, and if we do
    not net long or short positions, it must not exceed a given configurable number
    say 4. So, if we already have 4 open trades like long AUD_USD, long AUD_CHF, short
    GBP_AUD, short EUR_AUD, which we are quite heavyweight AUD, any further long positions
    must be rejected. For.g. if a strategy recommends placing a market order for long
    AUD_JPY, this order must be rejected, as our mandate is not to exceed a long or
    short position or it is already at max level, 4 in our cases.

    2. Do not trade a currency pair if its 10yr weighted moving average (WMA) is within
    x% of its historical high or low. This needs a bit of explanation. Let''s say
    the 10yr WMA of EUR_USD is 1.3 and the current spot price is 1.08. We would be
    extremely reluctant to place a short EUR_USD order at this level. This is because
    according to our rule we can only go short, upto 10%(assuming x=10) of the 10yr
    WMA. So subtracting 10% of 1.3 from 1.3 gives 1.17. So if the price dips below
    which it is currently, our check will not allow to place a short EUR_USD order.
    Similarly we would not go long EUR_USD if the current price is 1.45 (it is greater
    than 1.3+10% of 1.3 = 1.43).

    3. We do not to place an order for an existing trade with the pair is already
    active. This is to ensure that we do not accidentally close/reduce an existing
    trading position by placing an order in the opposite direction or to add to an
    existing position to double up on a trade.'
