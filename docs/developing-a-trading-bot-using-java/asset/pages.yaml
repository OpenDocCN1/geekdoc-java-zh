  md: "We now turn our attention to the configuration of the core beans which make\
    \ up the bot. The first being, configuration of TradingConfig class. This class\
    \ must be configured correctly for other services to work. We must also be careful\
    \ to configure some of the values which might affect the orders that are placed.\
    \ For e.g. the maxAllowedQuantity is the maximum size of an order placed. In our\
    \ case below it is just 5, but changing this value to say 50000 will place a huge\
    \ order, which might lead to margin call if the trade goes in the opposite direction.\n\
    \nLet us briefly discuss each of the other config params in the TradingConfig\
    \ class\n\n+   - minReserveRatio is the ratio of amount available to trade the\
    \ total amount in the account. A values of 0.1 stipulates that if this amount\
    \ falls below 10%, the bot stops putting in new orders.\n- maxAllowedNetContracts\
    \ is the maximum net bot will go long or short on a given currency. This setting\
    \ was inspired by the event on Jan 15,2015, when SNB² unexpectedly extended the\
    \ CHF peg versus EUR of 1.2 and CHF soared by nearly 30%. Anyone who was massively\
    \ short losing huge amounts of money\n- minAmountRequired is the minimum balance\
    \ in the designated currency of the account to allow the bot to place orders.\
    \ If the balance follows this threshold, no further placement is possible.\n-\
    \ max10yrmaOffset defines the safe zone of a currency pair. We discussed it in\
    \ detail while discussing PreOrderValidationService.\n- fadeTheMovePriceExpiry\
    \ is the time in minutes, the observation interval, for the FadeMoveStrategy.\n\
