    \ of this class lies in the implementation of the new method findTweets(). The\
    \ method tries to retrieve all new tweets since the last API call was made. It\
    \ is assumed that there is a scheduled job that runs at a regular interval and\
    \ calls this method to fetch the newest Tweets. In order to retrieve the newest\
    \ ones, the last call, the class has to internally keep track of the last Tweet\
    \ fetched. By using an id greater than the last id for the given user, However\
    \ when it is invoked for the first time, we need to explore another way to find\
    \ the newest tweets. In this case we use the time at which the class was initialised\
    \ as the starting point from which retrieve the newest tweets. This is the logic\
    \ that we executed if (lastTweetId == null). In order to make the class threadsafe,\
    \ additional synchronization is provided, taking into account the double locking.\
    \ The time based approach uses the query from:%s since:, where we supply the user\
    \ id in question and the startup time in format yyyy-MM-dd. Once this search returns,\
    \ we can take the first tweet in the collection and it's the latest id to start\
    \ the next search. In that case, we use the query string from:%s since_id:%d,\
    \ providing the user id and the id set from the last search. Just to reiterate\
    \ again, the search results are sorted from latest to the oldest.\n\n# 8.3.4 User\
