  md: "# 8.2 Spring Social\n\nSpring Social¹ is the facto choice when it comes to\
    \ integrating social media applications like Facebook, Twitter, LinkedIn etc.\
    \ It provides all the plumbing required to connect with a given social media network,\
    \ leaving us to focus with implementing the logic to mine data from/post to these\
    \ networks. Developers who have used Spring before, will recognise the same pattern\
    \ used for JMS² and JDBC³ where all the middleware and database publishing respectively,\
    \ is taken care by Spring, leaving to focus solely on the task at hand.\n\nFor\
    \ our discussion, we will solely focus on integrating our bot with Twitter⁴.\n\
    \n# 8.2.1 Using and Configuring Spring Social\n\nWe need to add the following\
    \ dependencies in the maven pom.xml in order to bring in Spring Social in the\
    \ bot ecosystem.\n\n```\n<dependency>\n  <groupId>org.springframework.social</groupId>\n\
    \  <artifactId>spring-social-twitter</artifactId>\n  <version>1.1.0.RELEASE</version>\n\
    </dependency>\n```\n\nThe interaction with Twitter happens via the TwitterTemplate⁵\
    \ which needs to be configured in the spring configuration file, using the tokens\
    \ which we generated when we defined our Twitter app.\n\n```\n<bean id=\"twitter\"\
    \n  <constructor-arg index=\"0\" value=\"${twitter.consumerKey}/>\n  <constructor-arg\
    \ index=\"1\" value=\"${twitter.consumerSecret}/>\n  <constructor-arg index=\"\
    2\" value=\"${twitter.accessToken}/>\n  <constructor-arg index=\"3\" value=\"\
    ${twitter.accessTokenSecre}/>\n</bean>\n```\n\nWith this TwitterTemplate is ready\
    \ to be injected in any services."
