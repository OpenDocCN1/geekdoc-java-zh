  md: 'recommends to sell a currency pair at a given price, we do exactly that. On
    the other hand if M is greater than or equal to the threshold, we do exactly the
    opposite. So for e.g. if the user recommends to sell a currency pair, we buy the
    currency pair at the given price. The calculation of stop loss and take profit
    levels need readjustment. Since the user initially recommended selling the currency
    pair and would have set a take profit at level dips P below the price, we now
    need to turn it around and make it at a distance of pips P above the price. The
    same logic applies to stop loss levels.


    This concludes are discussion of the Copy Twitter Strategy. The crux of the strategy,
    which is the accuracy rate calculation is based on a very simplistic mathematical
    calculation. Many would argue that it''s too simplistic and circumvents the statistical
