  md: 'https://stream-fxtrade.oanda.com/v1/prices?accountId=123456&instruments=


    OANDA requires us to provide a valid account to setup a market data stream, as
    discussed before. The stream url is also different, than the ones we have discussed
    before, for example url to request list of instruments. We will discuss these
    nuances in detail in a later chapter about configuration and deployment.


    Our concrete implementation extends class OandaStreamingService, which is the
    base class for providing infrastructure methods for all streaming services from
    OANDA, which includes, ofcourse market data, and we will discuss in a future chapter,
    the event streaming. All streams from OANDA comprise a heartbeat payload, that
    indicates the stream is alive, hence the HeartBeatCallback instance. We will discuss
    heartbeats in a later chapter. For now, it is sufficient to know that, heartbeating
    provides a way to assure the client (our trading bot), the persistent connection
    to the brokerage platform is alive. If the heartbeat payload is not received in
    a given timeframe in the current stream, then something is not quite in order
    and we must connect and reconnect. Quickly look at its definition and some important
    infrastructure methods it provides to its subclasses.


    ```

