    implementations. The concept is that this mock method, that we are going to explore
    shortly, returns an InputStream that is an instance of FileInputStream instead
    of a real world instance of org.apache.http.client.LazyDecompressingInputStream.
    Therefore all our interaction with OANDA comes from files of json payloads that
    we create instead of using OANDA platform. Lets have a look out at the code of
    this method


