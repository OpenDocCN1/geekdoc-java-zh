  md: '# 5. Historic Instrument Market Data


    In this chapter we discuss some of the techniques to build services to query historic
    market data. This could be of real interest for folks who want to build strategies
    based on analysis of historic data for given instruments.

    Traditionally historical instrument data on charts are represented as candle sticks.
    Candle sticks patterns are a form of technical analysis which can be used over
    any time frame. They are similar to bar charts and provide opening and closing
    values, the high and low price for the time frame in question.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# 5.1 How to read a candle stick


    The length of the candle stick shows the relative change in open and close prices
    of the reporting time frame (session). The longer the body, the more the change
    in the open and close price of the session. This may point to higher volatility
    in the price. If the close price is higher than the open, then the body of the
    candle stick is white. On the contrary, if the close price is lower than the open,
    then the body is black. The thin lines above and below the body are called shadows.
    The peak of the upper shadow is the high of the session and the bottom of the
    lower shadow is the low of the session. The length and the color of the candle
    sticks can point to a bull or a bear market.


    ![](img/83b65534a955858b50f85868087a4d91_84_0.png)'
