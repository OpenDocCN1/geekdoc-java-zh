  md: '# 9.1 Copy Twitter Strategy


    This strategy is aimed at blindly copying or doing the exact opposite to what
    the twitter user has just tweeted, the tweet relating to a new trade. It works
    as :


    +   * Using tools and the knowledge we developed in the last chapter, we follow
    a set of users on Twitter, who often Tweet new trade and close trade messages,
    with a predefined structure, something which a handler if written, can parse and
    create a NewFxTradeTweet or CloseFxTradeTweet object. We studied and analysed
    the tweets of 2 such users @SignalFactory and @ZuluTrader101.

    * We create a scheduled job, which searches for new tweets from these users. When
    a new trade is found and successfully parsed into a NewFxTradeTweet object, we
    search historic tweets by the same user and for the instrument for which he just
    tweeted to long or short.

    * We parse the collection of historic tweets to create a collection of CloseFxTradeTweet
    objects. Each CloseFxTradeTweet, as we know has an attribute which holds a profit/loss
    figure. If we could not find one, it is defaulted to 0.0.

    * We analyse how many previous trades were profitable and how many were loss of
    the total.

    * If the analysis tells us that your recommendation for this trade in the past
    was more than 75% accurate, we do exactly what he has just suggested in the recent
    trade. If on the contrary, it suggests that he/she was more than 75% of the time,
    we do exactly the opposite. For any other condition, we take no further decision
    and ignore the tweet. We also need to make sure that we are analysing atleast
    4 historic tweets in order to give us better accuracy of decision making.


    The figure of 75% and picking 4 tweets is arbitrary and can vary from one installation
    to another.


    Lets look at the code that tries to implement this strategy.


