  md: '# 9. Implementing Strategies


    It is now time to provide wings to our bot and make it fly!! Well, what we mean
    is that time has come to add capabilities to our bot so that it can now make decision
    in terms of placing orders, based on a certain set of rules, that we all know
    is a strategy. Basically, we want to add the power of analysis to our bot to determine
    whether to buy or sell a currency pair or stay put and wait for the right moment
    to come. The analysis can be based on several external parameters like


    +   * Market data

    * News Events

    * Social Media feeds

    * Technical analysis

    * Sentiment

    * etc.


    A strategy can be based solely on pure technical analysis of prices over a period
    of time and on the other based on real time analysis of all or a mixture of params
    listed above. For e.g. a complex strategy could be built on realtime analysis
    of social media feeds to ascertain what the sentiment index is (a hypothetical
    index based on how much positivity surrounds us) and market arrive at a trading
    decision. It can be as simple as single dimensional analysis to multivariate analysis.
    The possibilities are infinite!


    In this chapter we will try to implement a couple of strategies, one of them based
    on Twitter feed analysis and the other a more popular one, used often by traders.
    We will program these strategies and integrate them into our trading bot in order
    to produce a trading signal, and as a result place orders.


    Before we dive into these strategies, we would like to take this opportunity to
    discuss briefly the design of the various strategies generate TradingDecision,
    which are placed in the queue and the OrderExecutionService then picks these TradingDecision
    messages. How these messages are handled, is discussed in detail in Chapter 6.'
