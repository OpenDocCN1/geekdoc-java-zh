    The methods startHeartBeatStreaming() and stopHeartBeatStreaming() delegate to
    startStreaming() and stopStreaming() respectively which further delegate to the
    underlying methods to start/stop the main streams. So in the case of market data
    streaming, the methods that start and stop the main stream are startMarketDataStreaming()
    and stopMarketDataStreaming(). This makes sense because the heartbeats are coupled
    with the main stream events and the 2 coexist. Stopping the heartbeat stream must
    stop the main stream and vice versa.


    The method handleHeartBeat parses the json payload and creates an instance of
    the HeartBeatPayload<DateTime>. This is then passed on to an instance of HeartBeatCallback,
    which we discuss below, to disseminate downstream consumers. The timestamp in
    the heartbeat payload is the heartbeat timestamp and as we will see later, is
    used later to figure out if the stream is still alive or dead.'
