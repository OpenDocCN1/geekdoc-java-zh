  md: "# 2.1 Account Provider interface\n\nWe now need to specify our account data\
    \ interface which defines what we expect our provider(aka implementation) to provide.\
    \ We would not be interested in doing any account updates such as changing the\
    \ leverage etc but just interested in read-only information. Therefore we require\
    \ the provider to either give us a Collection of all accounts or if the accountId\
    \ is provided. Our interface would look something like:\n\n# Code Listing 2.2:\
    \ AccountDataProvider interface definition\n\n```\n/**\n * A provider of Account\
    \ information. An account information might typical\n * include base currency,\
    \ leverage, margin available, PNL information etc.\n * brokerages allow the creation\
    \ of various sub accounts or currency wallet\n * The idea is to give ability to\
    \ fund these accounts from various currency\n * denominated bank accounts. So\
    \ for e.g. a user in Switzerland might have\n * current account but also a EUR\
    \ savings account. One can then open 2 cur\n * accounts or wallets on the account,\
    \ denominated in CHF and EUR\n * can be funded by the real bank accounts. Alternatively,\
    \ one can\n * just create these multiple currency wallets even if they have just\
    \ a si\n * source funding currency. When the primary account is funded, a transfer\n\
    \ * can be executed to fund the other currency wallet. For e.g. a user in L\n\
    \ * account and then execute a GBP account, can open a USD wallet, fund the GBF\n\
    \ * Kingdom who just have and execute a transfer of a given units of GBP into\
    \ USD.\n *\n * @param <T>\n * The type of accountId\n *\n * @see Account\n */\n\
    public interface AccountDataProvider < T > {\n/**\n * @param accountId\n * @return\
