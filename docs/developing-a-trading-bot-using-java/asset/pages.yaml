  md: "```\n46 } \n47 \n48 public double calculateMarginForTrade(K accountId, TradeableInstrument\
    \ < \n49 return calculateMarginForTrade(getAccountInfo(accountId), instrument,\
    \ unji\n50 )\n```\n\nBefore we discuss the logic in the method, let us fix the\
    \ variables which affect the calculations, which are:\n\n+   - The denominated\
    \ or base currency (GBP in pair GBPUSD).\n- The quoted currency (USD in pair GBPUSD).\n\
    - The account currency (e.g. CHF).\n- The margin rate or leverage (0.05 or 1:20)\n\
    \nThe easiest case is when the denominated currency is the same as the account\
    \ currency. For e.g. if we want to place a buy order for 3000 units for instrument\
    \ EURAUD and the account currency is EUR, then the calculation is 3000*0.05 =150.\
    \ The next case is where the base currency, quoted currency and account currency\
    \ are all different. We need to effectively get the current price for {BASE ccy}/{ACCOUNT\
    \ ccy} and then multiply the price with units and margin rate. For e.g. if we\
    \ want to buy 3000 units of GBPUSD and account currency rest CHF, we need to effectively\
    \ get the price of GBPCHF first and then do the rest of the multiplication. Assuming\
    \ GBPCHF price is 1.54 the margin requirement is\n\n```\n1 double marginRequired\
    \ = 1.54 * 3000 * 0.05 //231 CHF\n```\n\nThe last case is a derivative of the\
    \ above with the difference being that the valid currency pair is {ACCOUNT ccy}/{BASE\
    \ ccy}. In this case we have to divide the {ACCOUNT ccy}/{BASE ccy} price. Assuming\
    \ we want to buy 3000 units of USDCHF and the account currency is GBP and the\
    \ GBPUSD price is 1.53, the margin required is\n\n```\n1 double marginRequired\
    \ = 3000 * 0.05/1.53 //98.03 GBP\n```\n\nThis service concludes our discussion\
    \ of pretty much everything we need to learn about account management."
