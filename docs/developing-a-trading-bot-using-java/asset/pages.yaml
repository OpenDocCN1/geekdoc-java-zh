  md: 'by the Spring task scheduler after every time T is configured in the Spring
    configuration. This method is synchronized, in order to make sure that we do not
    have more than 1 thread executing the method, which as the name suggests, harvests
    tweets for each user, we configured, and generates a trading decision. Inside
    the method, we loop for all entries in the tweetHandlerMap and submit a Callable
    to the ExecutorService. This Callable has the following logic in the call() method
    for the given user.


    +   - Find all tweets that relate to new trades and are successfully parsed to
    create a collection of NewFXTradeTreet objects (Please refer to previous chapter
    where we discuss the search api to find these tweets and parse them).

    - For each of the NewFXTradeTreet object, harvest tweets relating to closed trades
    only for the given instrument.

    - Delegate the analyse of these tweets to method analyseHistoricClosedTradesForInstrument
    which does the accuracy rate computation for the user and generates a TradingDecision.
    Just to remind ourselves, the accuracy rate is the percentage of time the user
    was correct in their previous trades. This is exactly the gist of our strategy
    which we discussed earlier in the section.


    The method analyseHistoricClosedTradesForInstrument merits a bit of explanation.
    At the beginning of the method we compute the accuracy rate. For first we get
    count of all trades which are loss making or in profit by looping through the
    collection of old closed trades. The method closedTrade.getProfit() helps us in
    this respect. We then go further only if the number of closed trades is greater
    than or equal to the minimum threshold, in this case being 4. Assuming


    +   - P = Number of profit making trades.

    - L = Number of loss making trades.

    - N = Total number of closed trades found.


    such that P + L = N


    +   - Accuracy Rate R = P/N

    - Miss Rate M = 1 - R


    So if R is greater than or equal to the threshold for desired accuracy, in this
    case being 0.75, we do exactly what the user has tweeted. For e.g. if the user'
