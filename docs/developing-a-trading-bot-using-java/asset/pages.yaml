  md: '# 13. Unit Testing


    In this chapter we discuss a very important topic, that of unit testing our code.
    Proper unit testing coverage of our bot will ensure that we do not create many
    regressions when we do changes or add enhancements to the existing code. For some
    of the target audience of this book, the trading bot may be deployed to place
    real orders with a live account where huge sums of money could be involved. Making
    sure that we have enough test coverage will ensure that a code bug would be unlikely
    to place bad orders. We briefly summarise the immense benefits of unit testing


    +   * Proper unit tests should eliminate most of the likely surprises in the production
    environment.

    * They help document the code.

    * They force a developer to develop and think in a way that leads to better design,
    code and architecture of the system components.

    * We write more maintainable code when we adopt the test driven development approach.
    We are forced to write smaller classes so that we can be unit tested easily.

    * We are forced to write loosely coupled components. Having many dependencies
    to mock forces us to think this way.


    Keeping the above in mind, we will discuss some of the concepts and techniques
    around unit testing the bot in this chapter.'
