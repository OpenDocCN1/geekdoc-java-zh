  md: "+   **AccountDataProvider** is the obvious one, as the service needs to be\
    \ able to provide information for an individual accountId and all available accounts.\n\
    \n+   **CurrentPriceProvider** is a provider of current prices for a given set\
    \ of instruments and will be discussed in later chapters.\n\n+   **BaseTradingConfig**,\
    \ as discussed earlier is an object that holds all the configuration parameters.\n\
    \n+   **ProviderHelper**, as discussed previously, provides helper methods to\
    \ deal with related data transformations.\n\nWe now turn our attention to the\
    \ discussion of `findAccountsToTrade()` method. As the name suggests, this method\
    \ would try to find available accounts to trade, given certain conditions are\
    \ met. Before placing a trade/order, the first exercise would not apply to platforms\
    \ where there is only a single account to trade and, of course, this discussion\
    \ would apply to all accounts executed, by defaulting to this account.\n\n```\n\
    public Collection < K > findAccountsToTrade() {\n  List < Account < K>> accounts\
    \ = Lists.newList(getAllAccounts());\n  Collection <K> accountsFound = Lists.newList();\n\
    \  Collections.sort(accounts, accountComparator());\n  for (Account <K> account:\
    \ accounts) {\n    if (account.getAmountAvailableRatio() >= baseTradingConfig.getMinReserve())\
    \ {\n      accountsFound.add(account.getId());\n    }\n  }\n  return accountsFound;\n\
    }\n```\n\nThe method first fetches all available accounts by calling `getAllAccounts()`,\
    \ which delegates to the `accountProvider`\n\n```\npublic Collection<Account<K>>\
    \ getAllAccounts() {\n  return this.accountDataProvider.getLatestAccountInfo();\n\
    }\n```\n\nNext, it tries to sort the accounts available, in the decreasing order\
    \ of margin availability using the **MarginAvailableComparator**. This comparator\
    \ places the account with the maximum margin at the top of list and so on. The\
    \ idea is to pick the account with maximum average when the accounts are `denominated`\
    \ currencies are comparable in exchange rates. For e.g. if one has 3 accounts\
    \ denominated in currencies CHF, EUR, USD then this works because EURCHF ~= 1.08,"
  merge: -1
  pgno: 48
- img_proc: true
  md: "USDCH ~=1.0 and EURUSD ~= 1.0 (rates at the time of writing). This should fulfill\
    \ the strategy of account with the maximum available margin, however it will fail\
    \ miserably, if for example, the least of currencies is JPY instead of EUR. Since\
    \ CHFJPY and USDJPY at the time of writing ~= 122.0, this is not ideal at the\
    \ time the JPY account will be created.\n\n```\nstatic class MarginAvailableComparator\
    \ < K > implements Comparator < Acc\n@Override\npublic int compare(Account < K>\
    \ ai1, Account < K> ai2) {\n    if (ai1.getMarginAvailable() > ai2.getMarginAvailable())\
    \ {\n        return -1;\n    } else if (ai1.getMarginAvailable() < ai2.getMarginAvailable())\
    \ {\n        return 1;\n    }\n    return 0;\n}\n```\n\nNext, the account is selected\
    \ to place an order/trade only if the following condition is met\n\n```\nif (account.getAmountAvailableRatio()\
    \ >= baseTradingConfig.getMinReserveRat\n&& account.getNetAssetValue() >= baseTradingConfig.getMinAmountRequire\n\
    accountsFound.add(account.getAccountId());\n```\n\nAssuming that\n\n```\nminReserveRatio=0.2\n\
    minAmountRequired=50.0\n```\n\nMinimum Ratio of 0.2 is a metric which stipulates\
    \ that if a GBP account has total amount of £1000, then we only select this account\
    \ to trade if the amount available to trade > 0.2 x £1000(£200). I would strongly\
    \ recommend to have this validation in place, simply because this leaves the account\
    \ with a decent buffer and prevents the NAV going negative, in case of wild swings\
    \ in prices. This ought to be a higher value if the account leverage is quite\
    \ high, say 1:50.\n\nMinimum Amount required is a metric which stipulates that\
    \ an account must have a minimum net asset value to be considered for trading.\
    \ In this case we must have at least £50 in NAV to be eligible to trade."
