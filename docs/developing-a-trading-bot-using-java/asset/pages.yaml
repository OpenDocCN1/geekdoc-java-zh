  md: '# 5.6 Candle sticks for moving average calculations


    Moving Averages are widely used in technical analysis and forecasting methods.
    All moving averages use candle stick data for computation. The 3 most widely used
    moving averages are


    +   - Simple Moving Average (SMA): A SMA, also knows as arithmetic average, is
    the most common and simplest of the moving averages. It is simply the average
    of prices of the candle sticks. Each price is equally weighted.


    +   - Weighted Moving Average (WMA): A WMA, assigns a weighting factor to each
    value in the candle sticks list according to its age. The most recent price gets
    the most weight and on the contrary the first gets the least weight. So for example,
    if there are N candle sticks M^th candle stick then M/(N x (N+1)/2). The sum of
    weights always equates to 1.0;


    +   - Exponential Moving Average (EMA): An EMA, also assigns a weight to each
    value, according to it''s age. And like WMA, the most recent price gets the most
    weight and the first in the list, the least weight. The weight calculation for
    each candle stick is slightly more involved and is discussed thoroughly at https://en.wikipedia.org/wiki/Moving_average#Exponential_moving_average'
