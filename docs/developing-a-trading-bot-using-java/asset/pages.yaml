  md: '# ## 12. Configuration, Deployment and Running the Bot


    We are now all set to put our bot into action. All that now remains before pressing
    the button is the configuration and deployment. The configuration of the bot comprises
    the following


    +   * Spring configuration of the core services and api,i.e., trading-app.xml
    .

    * Property file for the core Spring configuration,i.e.,tradingbot.properties .

    * Spring configuration of the runtime provider (OANDA in our case),i.e., tradingbot-oanda.xml.

    * Property file for the runtime provider Spring configuration,i.e., tradingbot-oanda.properties.


    Just like the jar files, we also have a separate configuration file for the runtime
    provider. As we will see later in the chapter, the name of the provider configuration
    file is passed in as a program argument, in order to easily pick the provider
    at runtime. Without further ado, lets jump into the configuration of the bot.'
  merge: -1
