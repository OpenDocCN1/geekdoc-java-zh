  md: '# 1.1 What is a Trading Bot?


    In very simple language, a trading bot, is a computer program, that can automatically
    place orders to a market or exchange, without the need for human intervention.
    The simplest of boasts could be a curl¹ POST to an OANDA REST API, such as


    ```

    $curl -X POST -d "instrument=EUR_USD&units=2&side=sell&type=market" "https 2 ser"

    ```


    which can be setup on a unix cron² to run every hour, during trading hours. It
    has no strategy, nor any external interface or dependencies. It is a one liner
    to place an order which has an equal probability to be in profit or in loss.


    On the other end of the spectrum, it could be a complex program based on a distributed
    architecture, consuming lots of feeds from various sources, analysing them in
    realtime and placing an order. It would be highly available with extremely low
    latency.


    The scale and scope of the bot, as we can see is varied. To be effective, the
    bot should be able to accomplish the following tasks:


    +   - Consume market data and/or ,external events, social media feeds and distribute
    to interested components within the system.

    - Have atleast one strategy which provides a trading signal.

    - Based on a trading signal place Orders with the brokerage platform.

    - Account management, i.e., have the ability to keep track of margin requirements,
    leverage, PNL, amount remaining etc. in order to curb trading if the amount reaches
    a threshold.

    - Position Management is. keep track of all currently active positions of various
    instruments, units of such positions, average price etc.

    - Have the ability to handle events which are triggered by the brokerage platform
    such as ORDER_FILLED, STOP_LOSS etc. and if required appropriate decisions for
    these events.

    - Some basic monitoring and alerting.

    - Some basic risk management. For e.g loss limitation by using stop losses for
    orders or making sure that risk is distributed between risky and safe instruments.
    These are just examples and by no means a comprehensive list of fully managing
    the risk.'
  merge: -1
