  md: '# 13.1 Using Mockito as a mocking framework.


    For writing unit tests for the bot, we are going to use Mockito¹ extensively to
    create mocks for our objects. The mock for an object like TwitterTemplate helps
    simulate the behaviour of this object without having to instantiate it fully.
    In order to harvest tweets using a real TwitterTemplate, we will have to provide
    valid tokens to authenticate with Twitter. This is not the real problem actually.
    The real problem is getting the same deterministic results, everytime we do a
    search query. This is impossible with the real TwitterTemplate as the tweets are
    constantly getting created and as a result the search results too. We cannot write
    deterministic asserts to test our unit code. To get around this problem we use
    mocks and get deterministic results. The same applies to getting deterministic
    order of price tick from the provider which is impossible in the real world.


    # 13.1.1 Mocking HTTP Interaction


