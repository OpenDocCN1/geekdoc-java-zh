  md: '# 11. Email Notifications


    In this chapter we discuss email notifications which are extremely useful to notify
    users when certain events are triggered inside the bot. These notifications are
    closely coupled to Trade/Order/Account events that we discussed in the Chapter
    7. As a result, the email notification component has the same input payload, delivered
    by the EventBus, like other handlers we discussed in that chapter. These notifications
    can be very useful when a user action is urgently warranted. For e.g. MARGIN_CALL_ENTER
    might be triggered on the OANDA platform, which suggests that the account faces
    an urgent margin call. On the other hand, these notifications serve as a useful
    tool to keep track of what the automated trading bot is upto. By switching on
    notifications for Trade/Order and Account events, a user can have a useful appreciation
    of the state of things happening inside the bot.'
  merge: -1
  pgno: 235
- img_proc: true
  md: "# 11.1 Notification Design\n\nAs discussed above, the event is handled by the\
    \ Trade/Order and Account event handlers, is also posted to the email notification\
    \ service. This service, EventEmailNotifier, handles this event and generates\
    \ an email if an appropriate EmailContentGenerator is configured for that event.\
    \ The EmailContentGenerator implementation is responsible for generating subject\
    \ and body, aka, the EmailPayLoad, and can vary from event to event.\n\nLet us\
    \ first look at the pojo EmailPayLoad that holds the result of the email content\
    \ generation.\n\n# 11.1.1 EmailPayLoad POJO\n\n```\npublic class EmailPayLoad\
    \ {\n  private final String subject;\n  private final String body;\n  public EmailPayLoad(String\
    \ subject, String body) {\n    super();\n    this.subject = subject;\n    this.body\
    \ = body;\n  }\n  public String getSubject() {\n    return subject;\n  }\n  public\
    \ String getBody() {\n    return body;\n  }\n}\n```\n\nThe EmailPayLoad has the\
    \ subject and the body of the email, that is sent out using the JavaMail API and\
    \ configured inside the Spring configuration.\n\n# 11.1.2 EmailContentGenerator\
    \ interface\n\n```\npublic interface EmailContentGenerator<T> {\n  EmailPayLoad\
    \ generate(EventPayLoad<T> payLoad);\n}\n```\n\n# 11.1.3 Sample Implementations"
