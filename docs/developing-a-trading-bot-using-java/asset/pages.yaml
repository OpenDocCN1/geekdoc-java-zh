  md: "# # 1.7 Event Driven Architecture\n\nThe soul of any trading system, it is'\
    \ event driven architecture. The system must react to market events, social media\
    \ events, user events and maybe a plethora of other events coming from external/internal\
    \ sources. These events could further trigger a chain reaction of events, resulting\
    \ in state changes of various business/domain objects in the system. The real\
    \ technical challenge is to make sure that these state transitions happen in a\
    \ thread safe way, backed by a transaction wherever required.\n\nAt the heart\
    \ of an event driven system are one or more event loops. These event loops typically\
    \ run in an infinite while and waiting on an event to come from a queue or a live\
    \ stream. For an Oanda market data tick event we have a event loop as following\n\
    \n```\nthis.streamThread = new Thread(new Runnable() {\n  @Override\n  public\
    \ void run() {\n    CloseableHttpClient httpClient = getHttpClient();\n    BufferedReader\
    \ br = setUpStreamIfPossible(httpClient);\n    if (br != null) {\n      String\
    \ line;\n      while ((line = br.readLine()) != null && serviceUp) {\n       \
    \ Object obj = JSONValue.parse(line);\n        JSONObject instrumentTick = (JSONObject)\
    \ obj;\n      }\n    }\n  }\n```\n\nIn the snippet above we have an infinite while\
    \ loop that listens on ticks being pushed to the live stream by the OANDA platform.\
    \ When a json payload is received, it is parsed and further disseminated via a\
    \ queue or an event bus."
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/83b65534a955858b50f85868087a4d91_25_0.png)


    The diagram depicts a typical chain of events, that might be triggered by a single
    event.


    +   1. Tick event is received from the stream.

    2. Event is parsed and sent to the EventBus.

    3. The strategy component has a subscription for this event and gets a callback
    from the EventBus.

    4. The strategy component decides to generate a trading signal based on the latest
    tick data event and places the signal on an OrderQueue.

    5. The OrderExecutionService picks up this signal, creates a new order and posts
    it to the platform.

    6. The platform executes the order and sends an event down the order event loop.

    7. This can further trigger an update of say the trades cache.


    This basically is the essence of an event driven architecture. Since we could
    have many components at the same time, it is extremely important that we decouple
    components as much as possible, so that no new publishers and subscribers can
    be added with zero or minimal changes. This architecture lends itself to take
    advantage of Java multithreaded programming capabilities. However by the same
    token, it dictates the developer to exercise great caution when performing state
    changes of business objects present in caches, e.g. the trades cache in our example.
    We must put adequate synchronization and locking in place to make sure that the
    observed state of a shared object is always consistent.


    # 1.7.1 Google EventBus'
