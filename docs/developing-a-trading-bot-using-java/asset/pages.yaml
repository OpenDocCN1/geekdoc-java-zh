- img_proc: true
  md: "From the code above, we see that most of the work is done in the internal overloaded\
    \ method with the same name. The public api method just loops through the account\
    \ ids in the cache and delegates to the private method. The private method, as\
    \ we will soon see, returns a count of positions for the given currency and account.\
    \ This result is added to a running count of positions, after which the loop terminates\
    \ is returned from the method as the final answer. Now, returning to the internal\
    \ method findNetPositionCountForCurrency, the code looks extremely straight forward.\
    \ For each of the account id key, we get the map of trades keyed by the instrument.\
    \ For each of the trade in the list of trades TradingUtils.get, which we just\
    \ delegate to our versatile function does all the computation. You would notice\
    \ that we just pass the instrument pair for the trade and the currency in question\
    \ to the function, without even checking if the currency in question is part of\
    \ the pair. This is taken care by the function, as it returns 0 for such cases.\
    \ Now we come to the last service method left to discuss, findAllAccountsWithInstrumentTrades,\
    \ which as the name suggests, returns a list of all account ids that has an open\
    \ position for the given instrument. The code below, which is extremely straight\
    \ forward, does not require much explanation. The method delegates to isTradeExistsInstrument,\
    \ which ascertains if we should add the current account id in the loop to the\
    \ collection to be returned.\n\n```\n/**\n * @param instrument\n * @return a Collection\
    \ of accountIds that have at least 1 trade for the\n * given instrument. An empty\
    \ Collection is returned if none satisfies\n * condition.\n */\npublic Collection<K>\
    \ findAllAccountsWithInstrumentTrades(TradeableInstr\nCollection<K> accountIds\
    \ = Sets.newHashSet();\nlock.readLock().lock();\ntry {\n  for (K accountId : tradesCache.keySet())\
    \ {\n    if (isTradeExistsInstrument(instrument, accountId)) {\n      accountIds.add(accountId);\n\
    \    }\n  }\n} finally {\n  lock.readLock().unlock();\n}\nreturn accountIds;\n\
    ```"
