  md: "# 4.1 Streaming Market Data interface\n\nWe begin, by defining an interface,\
    \ that stipulates the minimum set of methods required for the market event streaming\
    \ to work in our bot. On the face of it, looks there is not much to it, as we\
    \ just enforce a start and stop requirement on the interface implementer. However,\
    \ as we will see later, whilst discussing the implementation, part of the job\
    \ of the implementer is to invoke a MarketEventCallback handler, processes processes\
    \ market event received. The assumption is that the startMarketDataStreaming()\
    \ establishes a continuous connection (event loop) to the event source, i.e. in\
    \ a separate thread, and this thread receives market data events on that connection.\
    \ The event is then parsed and passed on to MarketEventCallback to be processed.\n\
    \n```\n/**\n * A service that provides streaming market data. Normally the implement\n\
    \ * would create a dedicated connection to the trading platform and r\n * a stream\
    \ of prices ideally through a REST service or a callback from th\n * platform.\
    \ The implementation must handle broken connections and atempt\n * reconnect in\
    \ a suitable manner. The service is normally coupled with a\n * heartbeats from\
