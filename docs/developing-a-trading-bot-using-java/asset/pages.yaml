    Looking at viewed responses, we need to create event handlers for each

    of the event types that we are interested to handle. This is where, we get the

    chance to exploit the polymorphic behaviour of EventBus, which would try to

    deliver the message to an exact type if found and then proceed to it''s

    supertypes.


    Lets summarise the different important events that we might see being

    called back for. This is by no means a full lists but should be the ones that
    we

    see often on various platforms and discuss in greater details later


