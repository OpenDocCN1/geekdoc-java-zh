- img_proc: true
  md: "# Application: Nonrandom Missingness and Imputation\n\nLet examine the effect\
    \ of nonrandom missness on our results and the potential improvement offered by\
    \ the EM algorithm. Using the same SDQ sample of 300 students that we used earlier,\
    \ we simulated some nonrandom, arbitrary missness by recoding values of \"6\"\
    \ to system missing values for the first English item (Eng1: I learn things quickly\
    \ in English classes). This created a biased sample eliminating those students\
    \ who were most optimistically about their learning in English (76 out of 300\
    \ cases).\n\nWe used the MI procedure to estimate the EM covariance matrix. This\
    \ covariance matrix is requested on the EM variables to produce the final estimates\
    \ by specifying ALL on the VAR statement. Although we only have the variables\
    \ that we plan to analyze in this set, it is often useful to include all variables,\
    \ even those not in the analysis, during this step. This helps provide the most\
    \ information possible when estimating missingness. PROC MI outputs a single covariance\
    \ matrix that can be read into the FACTOR procedure and for subsequent analysis.\n\
    \n```\n* Missing missing via EM algorithm;\nproc mi data=nonrandom_miss nimpute=0;\n\
    \  em outem=em_covar_matrix;\n  var _ALL;\nrun;\n* EFA on imputed covariance matrix;\n\
    proc factor data=em_covar_matrix obs=300 nfactors=3 method=uls\n  rotate=oblim;\n\
    \  var Math: Par; Eng1;\nrun;\n```\n\nThe MI procedure provides some useful tools\
    \ to help understand patterns of missingness. Figure 8.1 on page 153 displays\
    \ the missing data summary output by the procedure. It shows the patterns of missingness\
    \ that were identified and summarizes the mean value for each variable among the\
    \ different groupings. We see that our data includes only two missing patterns:\
    \ 1) cases with complete data and 2) cases missing data for Eng1. We can also\
    \ compare the mean values of the variables along these groupings. In general the\
    \ values seem close, but there are a few items where the groups have greater differences\
    \ in average response (e.g., Eng2, Eng3)."
