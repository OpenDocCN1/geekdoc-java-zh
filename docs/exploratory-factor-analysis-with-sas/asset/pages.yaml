    but it is a characteristic of the sample in which the instrument was used. A biased,
    unrepresentative, or small sample could produce a very different estimate than
    a large, representative sample. Furthermore, the estimates from one large, supposedly
    representative sample can differ from another, and the results in one population
    can certainly differ from another. This is why we place such an emphasis on replication.
    Replication is necessary to support the reliability of an instrument. In addition,
    the reliability of an established instrument must be reestablished when using
    the instrument with a new population.


