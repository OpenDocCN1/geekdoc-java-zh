  md: 'Application


    perform replication analyses as in Chapter 6. Bootstrap analysis can provide another
    means through which to address this question. Other questions that we might ask
    concern whether the commun and factor loadings are estimated within a reasonable
    range for each of the variables. Let''s take one step at a time. To perform this
    bootstrap analysis, we used syntax for that reviewed above.


    # Eigenvalues and variance. First, we examined the initial eigenvalues that were
    extracted to evaluate the replicability of the factor structure via the Kaiser
    Criterion (eigenvalue > 1 criteria, which is simplest in this analysis). According
    to our previous analyses, we expect two factors to be extracted. Thus, we explore
    the likelihood that this structure would replicate in a similar sample. The syntax
    used to perform these first steps is presented below. Notice also we require ODS
    tables (ObliqueRotFactPat and FinalCommon) for use in our subsequent analyses.


    ```

    **Conduct bootstrap resampling from the data set;

    proc surveyselect data = engata method = URS samprate = 1 outhits

    out outboot_eng (compress=binary) seed = 1 rep = 2000;

    ```


    ```

    run;

    **Run model on bootstrap estimates;

    ods output Eigenvalues=eigen (compress=binary)

    ObliqueRotFactPat-boot_loadings (compress=binary)

    FinalCommon-boot_comm (compress=binary);

    proc factor data = outboot_eng nfactors = 2 method = print

    priors SMC rotate = OBLIMIN;

    by replicate;

    var EngProb: INTERESTeng;

    ```


    ```

    run;

    ods output close;

    ```


    ```

    **Estimate CI for eigenvalues and corresponding variance;

    proc sort data-boot_eigen nodupkey by Number replicate; run;

    proc univariate data=boot_eigen;

    by Number;

    var Eigenvalue Proportion;

    Histogram;

    out output=ci_eigen pctlts=2.5, 97.5 mean=EigenValue_mean

    proportion_mean std=EigenValue_std Proportion_std

    pctlre=eigen CI_portion;

    ```


    run;

