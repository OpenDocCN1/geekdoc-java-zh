  md: '# How Do the Criteria Compare?


    Now that we are familiar with the different extraction criteria and the SAS syntax
    and output for each criterion, let''s examine the potential differences between
    the criteria. We will review these criteria in each of our three data sets and
    see how the criteria agree or disagree.


    **Engineering data.** We examined each of the criteria for this data in the section
    above. The theory, the Kaiser Criterion, the minimum eigenvalue, and proportion
    of variance recommend a two-factor solution; the scree plot recommends a two-factor
    solution, but also identifies a possible three-factor solution; and both MAP and
    parallel analysis recommend a two-factor solution. In general, when we use a scale
    that generally has a strong two-factor structure, the methods tend to conclude
    that two factors is the optimal number to extract. Given that the results make
    sense in the context of the theoretical model, we would likely extract two factors
    for rotation and interpretation.


    Before we examine these criteria in the next set of data, let us briefly review
    how a two-factor extraction of this data affects the subsequent factor loadings.
    We will examine the unrotated factor loading since we have not yet discussed rotation.
    The loadings are plotted in Figure 3.8 on page 46 (we requested this plot by adding
    the `INITLOADINGS` plot to the `PLOTS` option, `plots = ( initloadings scree)`).
    As you can see from the factor loading plot, the data is clustered into two clear
    and distinct factors. In our opinion, this is as as good as it gets in exploratory
    factor analysis at this stage of the analysis.'
