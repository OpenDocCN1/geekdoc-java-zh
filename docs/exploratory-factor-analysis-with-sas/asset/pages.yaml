  md: '# Extraction Criteria


    **Theory.** We are proponents of theory-driven analysis.1 Researchers often perform
    an EFA because someone designed an instrument to measure particular constructs
    or factors. If the theoretical framework for the instrument is sound, we would
    start with the expectation that we see that structure in the data. Instruments
    are rarely perfect (especially the first time they are examined), and theoretical
    expectations are not always supported. Unless one is on a fishing expedition in
    a data set with no priori ideas about how the analysis should turn out,2 this
    is as good as a place to start. Regardless, the result of an EFA must be a sensible
    factor that is easily understood, whether that final structure matches the initial
    framework or not. The basic function of EFA, in our mind, is to make sense of
    data.


    **Kaiser Criterion.** The Kaiser Criterion (Kaiser, 1960, 1970) proposes that
    an eigenvalue greater than 1.0 is a good lower bound for expecting a factor to
    be meaningful. Because an eigenvalue represents the sum of the squared loadings
    in a column, and to get a sum of 1.0 or more, one must have large factor loadings
    to square and sum (e.g., four loadings of at least 0.50, three loadings of at
    least 0.60). But this criterion gets less as as items are analyzed. It is easy
    to get many unimportant factors exceeding this criterion if you use 100 items
    in an analysis.


    Despite the consensus in the literature that this is perhaps the least accurate
    method for selecting the number of factors to retain (Velicer, Eaton, & Fava,
    2000; see also Costello & Osborne, 2005), it is often implemented as the default
    selection criterion in much statistical software (such as SPSS). Prior to the
    wide availability of powerful computing, this was a simple (and not unreasonable)
    decision rule. Toward the latter part of the 20th century, researchers suggested
    combining this criterion with the examination of the score plot is better (Cattell,
    1996).


    **Minimum eigenvalue.** The Kaiser Criterion was built with PCA. In PCA, each
    item contributes 100% of its variance, and that eigenvalue of 1 would be equivalent
    to 1 variable loading on a particular factor. When this is applied to factor analysis,
    the interpretation is different. An eigenvalue of 1 can be more than the average
    contribution of an item. For example, if eight items contain 70% shared variance
    and 30% unique variance, the average eigenvalue for the items would be 0.70. The
    minimum eigenvalue criterion is a translation of the Kaiser Criterion to the factor
    analysis context, where the default minimum eigenvalue is the amount of shared
    variance contributed by an item. In the above example, the default minimum eigenvalue
    would be 0.70. This means we would retain all factors with an eigenvalue above
    this value. The estimation of the default minimum eigenvalue differs by slight
    extraction, but they offer the same conceptual


