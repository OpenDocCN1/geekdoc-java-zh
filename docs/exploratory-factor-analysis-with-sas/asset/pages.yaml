    The initial eigenvalues are presented in Figure 3.15 on page 53, and the scree
    plot is presented in Figure 3.16 on page 54. Theory and the proportion of variance
    criterion would suggest this data has a five-factor structure. The Kaiser Criterion
    identifies three factors with eigenvalues greater than 1.0, and the minimum eigenvalue
    criterion identify seven factors eigenvalues over the average (0.36). Finally,
    the scree plot is not very clear. The scree plot seems to indicate that the first
    inflection point is at four factors, but it is also argue that there is a second
    inflection point at the fourth factor. Thus, using these three traditional criteria,
    we would probably combine these results and test for a variety of configurations
    including one-, two-, three-, four-, and five-factor extraction. These results
    would be examined to see whether the original theoretical framework made sense,
    or if any of the other factor structures seem to make sense. However, since we
    have parallel analysis and MAP analysis, let us examine those results before exploring
    these options.


    The parallel analysis results are presented in Figure 3.17 on page 54 and Figure
    3.18 on page 55 and the MAP analysis results are presented in Figure 3.19 on page
    56 and Figure 3.20 on page 57. The results of this parallel analysis pose an interesting
    dilemma, as the eigenvalues quickly drop below 1 in the raw data analysis, and
    quickly approach the random eigenvalues. However, it is not until the eighth factor
    that the lines meet. This would suggest that we extract many more than probably
    makes sense. The MAP analysis was also interesting for the data, in that the MAP
    results recommend extraction of three factors, rather than the strong factor or
    the theoretically expected five factors. As you can see in the MAP plot, there
    might be a significant inflection point at the first factor. The true minimum
    is clearly at three factors, but the change between factors 2, 3, and 4 is as
    minimal as not inconsequential. The third factor is 0.0003 less than the APC for
    factor 2, and 0.0008 less than factor 4. One could argue that the only real inflection
    point is at 1.'
