  md: '# 62 Chapter 4 / Rotation


    Quite simply, we use the term "rotation" because, historically and conceptually,
    the axes are being rotated so that the clusters of items fall as close as possible
    to them.¹ As Thompson\ (2004) notes, the location of the axes is entirely arbitrary,
    and we can rotate the axes through space (like turning a dial) without fundamentally
    altering the nature of the results. However, we cannot move the motion in any
    factor space.


    Look at the left Figure 4.1 on page 62, if you imagine rotating the axes so that
    they intersect each cluster of variables, you get the rotated factor pattern on
    the right, and you also get the essence of rotation. You might be wondering what
    does for us in terms of classifying the factor loads. When we make that rotation,
    factor coefficients also have changed, with some getting larger, and some getting
    smaller. As you can see in the rotated factor plot, the items now fall closely
    about each axis line. This has the effect of making the loading pattern much clearer,
    as one of the two pairs of coordinates for each item to be close to 0.00.


    Figure 4.1 Example of unrotated and rotated factor loading plot from engineering
    data


    ![](img/29951003f0d11c9d825feb73bff9c8e6_74_0.png)


    +   Note rotation does not alter the basic aspects of the analysis, such as the
    amount of variance extracted from the items. Indeed, eigenvalues might change
    as factor loads are adjusted by rotation, the overall percentage of variance accounted
    for will remain constant.


    +   Alternatively, you could imagine rotating each cluster of items towards the
    axis. It really works out to be functionally the same.'
