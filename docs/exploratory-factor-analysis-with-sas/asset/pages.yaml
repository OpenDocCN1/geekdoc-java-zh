  md: '# Application 199


    Because the steps are somewhat complicated but repetitive for each random sample,
    we wrote a macro called subNBoot to do these steps for each sample. The syntax
    is presented below. There are two arguments that are fed into subNBoot: 1) ss,
    which stands for the numeric size value that we would like our subsample to, and
    2) seed, which stands for the numeric size value that surveyselect use to identify
    the sample. The seed allows our analyses to be replicated. subNBoot uses a series
    of procedures that you introduced in the current chapter (PROC CORP) and Chapter
    7 (PROC SURVEYSELECT PROC UNIVARIATE) to estimate the CI. This macro works in
    a set of data sets that contain the actual estimates (orig_alpha&ss 1 and orig_item&ss);
    and the bootstrapped CI (ci_alpha&ss and ci_item&ss).


    ```

    %MACRO subNBoot(ss,seed);

    *Subsample;

    proc surveyselect data=marshdata method=SRS&ss;

    out=marsh_sub&ss. seed=&seed;

    run;

    *Estimate Item Stats;

    ods output CronbachAlpha=orig_alpha&ss CronbachAlphaDel=orig_item&ss;

    proc corr data=marsh_sub&ss. alpha;

    var GDS;

    run;

    ods output close;

    *Take Bootstrap Sample;

    proc surveyselect data = marsh_sub&ss. method = Ursample = 1

    iths out = outboot_marsh&ss. (compress=binary) seed = 5 rep = =

    2000;

    run;

    *Estimate Item Stats for each bootstrap sample;

    ods output CronbachAlpha=boot_alpha&ss. (compress=binary)

    CronbachAlphaDel=boot_item&ss. (compress=binary);

    proc corr data=outboot_marsh&ss. alpha nosimple nocorr noprob

    by replicate;

    var GDS;

    run;

    ods output close;

    *Estimate CI from bootstrapped results;

    proc univariate data=boot_alpha&ss;

    where variables=''Raw'';

    var Alpha;

    out out=ci_alpha&ss. pctlts=2.5, 97.5 mean=Alpha_mean

    std=Alpha_std pcltre=Alpha_ci;

    ```


    +   1 Note: The characters &ss represent the value of the input parameter for
    the macro. Thus, when we are using N=50, our output data set will be orig_alpha50.
    This is true for the remaining examples.'
