    If any data from any participant is not present, the researcher is dealing with
    missing or incomplete data. In many types of research, there can be legitimate
    missing data. This can come in many ways, for reasons. Most commonly, legitimate
    missing data is an absence of data when it is appropriate for there to be an absence.
    Imagine you are filling out a survey that asks whether you are married, and if
    so, how happy are you with your marriage. If you are not married, it is legitimate
