    # An Empirical Investigation in Sample Size


    A particularly interesting and relatively well-executed study conducted by Guadagnoli
    & Velicer (1988) investigated the effects of sample size under a series of different
    conditions. The authors used Monte Carlo methods to examine the effects of four
    criteria—1 the number of factors (3, 6, 9, 18), the number of items (36, 72, 108,
    and 144), the average item loadings (.40, .60, .80), and the number of factors
    (Ns of 50, 100, 150, 200, 300, and 1000)—in this data, each item loaded on only
    one factor, all nonzero loadings were of equal size, and each factor contained
    an equal number of variables. This study represents one of the few studies to
    manipulate all of its aspects across a reasonable range of variation seen in the
    literature (with'
