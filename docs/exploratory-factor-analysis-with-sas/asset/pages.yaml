  md: '# About the Authors


    Jason W. Osborne, PhD, is an Educational Psychologist and Statistician and is
    currently Dean of the Graduate School at Clemson University. He is the author
    of several books and over 70 peer-reviewed articles; he is an Accredited Professional
    Statistician (American Statistical Association), and his work has been cited over
    8,000 times. His passion is dissemination of best practices in statistics and
    He is a 3rd degree black belt in Songahm Taekwondo, the father of three, and the
    rest, as Anne McCaffrey often said, changes without notice.


    ![](img/29951003f0d11c9d825feb73bff9c8e6_11_0.png)


    Erin S. Banjanovic is a Research Scientist at the Human Resources Research Organization
    (HumRRO), a nonprofit research organization. She works in the Validity Investigations
    for Education and the Workplace Research (VIEW) group and specializes in educational
    evaluation and measurement. She thoroughly enjoys using research, statistics,
    and programming to address real-world problems. She has served as a lead psychometric
    analyst on several state and national-level projects for state departments of
    education and national assessment consortia. She has also assisted with state-wide
    program evaluations and served as a database manager for a number of multisource
    databases. She holds a BS in human development, an MA in educational psychology,
    and she is currently working on her PhD in educational psychology, measurement,
    and evaluation.


