  md: '# Exploring Multiple Solutions


    Not all scales have a theoretically clear factor structure at the onset of EFA.
    In addition, sometimes the extraction criteria contradict the proposed structure.
    In these cases, we need to explore multiple solutions. The GDS data fit this mold.
    After we reviewed the extraction criteria in Chapter 3, four different factor
    solutions were proposed: a one-factor, a three-factor, a five-factor, and an eight-factor
    solution. As a result, we are going to have to experiment and explore more than
    in previous examples. Let us remember that we want to favor particular solutions.
    Also, because opposed subscales lead to depression in some way, they should be
    correlated. We will therefore use an oblique rotation (direct obimin) while exploring.
    As discussed in Chapter 2, the weighted least squares (ULS) extraction method
    will be used for this non-normal data.


    Before we started, there are two useful options in the PROC FACTOR statement that
    help us interpret the multifactor results that we are about to see: FUZZ and REORDER.
    The FUZZ suppresses small loadings from being printed in the various factor loading
    matrices. This helps us identify moderate to large factor loading and subsequent
    factors easily. To use this, we must specify the maximum factor loading we would
    like to suppress by setting FUZZ equal to that value (for example, FUZZ=3). The
    REORDER option is used to reorder the rows in the matrix according to their factor
    loadings. By default, the variables in the first column of the factor loading
    matrices are presented in the same order which they were put into the model on
    the VAR statement. This option allows these rows to be reordered and grouped for
    easier interpretation.¹ The syntax syntax used to run the one-, five-, and eight-factor
    models. We will hold off from running the three-factor model and let you explore
    that on your own.


    ```

    **One-Factor:

    *Note: no rotation is needed because only one factor is extracted;

    proc factor data=marshdata nfactors=1 method=ULS;

    VAR GDS;

    ```


    ```

    **Five-Factor:

    proc factor data=marshdata nfactors=5 method=ULS rotate=OBLIMIN

    fuzz=3 reorder;

    VAR GDS;

    ```


    ```

    **Eight-Factor:

    *Note: need to increase default max iterations to 60 by maxiter option

    ```


    +   Please note, the variables in the previous examples were put into their respective
    models according to the theoretical factor each variable was associated with;
    thus, the REORDER option would not have substantially different factor loading
    matrices from what was presented.'
  merge: -1
  pgno: 87
