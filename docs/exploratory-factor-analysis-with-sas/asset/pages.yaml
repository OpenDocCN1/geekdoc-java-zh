  md: '# Chapter 2 / Extraction Method


    Iterated principal axes factor extraction is identical to PAF, except that an
    iterative estimation process is used. Each successive estimate of the communality
    coefficients is used to replace the diagonal of the matrix of associations. The
    process is repeated iteratively until the coefficients stabilizes—or changes less
    than a predetermined threshold. This extraction technique tends to be when multivariate
    normality of the variables is not a untenable assumption (Fabringer, Weger, MacCallum,
    & Strahan, 1999).


    Alpha extraction seeks to maximize the Cronbach''s coefficient alpha estimate
    of the reliability of a factor. The difference between alpha extraction and other
    extraction techniques is the goal of the generalization. Maximum likelihood and
    other extraction techniques seek to generalize from a sample to a population of
    individuals, whereas alpha extraction seeks to generalize to a population of measures.
    One downside to alpha extraction is that these properties are lost when rotation
    is used (Nunnally & Bernstein, 1994), applying only to the initial rotation. As
    we will see in the section on rotation, unrotated results are often not easily
    interpreted, and this extraction technique is potentially confusing dect to researchers,
    who might think they are getting something they are not—if they rotate the results
    of the alpha extraction.


    Maximum likelihood (ML) extraction 1 is another iterative process (used in logistic
    regression, confirmatory factor analysis, structural equation modeling, etc.)
    that seeks to extract factors and parameters to adequately reproduce the correlation
    (or covariance) matrix. It starts with an assumption that individual variables
    are normally distributed (leading to multivariate normal distributions with residuals
    normally distributed around zero). If a certain number of factors are extracted
    to account for interrelations between the observed variables, then information
    can be used to reconstruct a reproduced correlation matrix. The parameters are
    tweaked iteratively in order to maximize the likelihood of reproducing the population
    correlation—or to minimize the difference between the reproduced and population
    matrices. This technique is particularly sensitive to quirks in the data, particularly
    in “small” samples, if the assumptions of normality are not tenable, this is probably
    not a good extraction technique (Fabringer et al., 1999; Nunnally & Bernstein,
    1994).


    Unweighted least squares (ULS) extraction uses a variation on the process of maximum
    likelihood extraction. It does not make any assumptions about normality and seeks
    to minimize the error, operationalized as the sum of squared residuals. Between
    the observed and reproduced correlation (or covariance) matrices, ULS is said
    to be more robust to non-normal data (as we will see in the third chapter; Nunnally
    & Bernstein, 1994).


    Image extraction and Harris extraction are two methods based on the image factor
    model, as opposed to the factor model or the component model (Cattell, 1978, p.
    403). These methods use a non-iterative process to estimate shared variance (known
    as the image) and unique variance (known as the anti-image) based on lower-bound
    estimates of variance produced through multiple regression (Cattell, 1978; Harman,
    1967). The image extraction method in SAS corresponds to Gutman’s (1953) version
    (as opposed to Jóreskog 1969 version) and the Harris extraction corresponds to
    Harris’s (1962) Rao-


    +   1 Interested readers can get more information about this and other technical
    details of extraction in Nunnally & Bernstein (1994), particularly Chapter 11.
    For our purposes, we aim to provide a more applied overview, and will skip most
    of the technical details.'
