- img_proc: true
  md: '# Example Syntax and Output 117


    Overall, bootstrap resampling can be a valuable tool in the statistician''s toolbox,
    but it is not a panacea. It cannot fix a fatally flawed sample, and it cannot
    compensate for inappropriately small sample. Given a reasonable sample, bootstrap
    resampling can do some interesting things. It can provide confidence intervals
    for things like effect sizes that we really cannot get any other way. It can provide
    information about the precision of the estimates, and it can give some information
    in a single sample that is helpful in determining whether a solution will replicate
    or not. In other words, if one performs an bootstrap analysis of a reasonable
    sample, and one sees that the solution arrived at is more precise than it would
    have been if one had very broad confidence intervals. Further, if those confidence
    intervals are narrow and precise, it is likely that a similar sample will produce
    similar results. If the confidence intervals are wide and sloppy, it is not likely
    that a similar sample would produce similar results.


    # Example Syntax and Output


    # Traditional CI with ML


    Before we review the length bootstrapping syntax, we will quickly review a predefined
    SAS option for estimating CI of factor loadings when conducting maximum likelihood
    (ML) extraction. ML extraction is the only extraction method that provides estimates
    of standard error that can be used to compute traditional CI. These CIs are different
    from bootstrapped estimates because they are based on standard errors as proposed
    resampling procedures. As we mentioned in the beginning of this chapter, we often
    do not have the ingredients to compute traditional CI and thus bootstrapped CIs
    have become a useful alternative. Then, we will discuss this method of computing
    only briefly as it is limited in scope and option. Again, if you are interested
    in performing a non-ML extraction (see Chapter 2) or if you are interested in
    reviewing CIs for the eigenvalues, communalities, etc., then this is not the method
    for you.


    The traditional CI can be requested by adding the CI option to the FACTOR statement.
    If you would like SAS to evaluate whether the CIs are above a certain absolute
    magnitude, you can set the CI option to that respective magnitude (e.g., CI=4).
    You can also change the default confidence level of 95% for the interval that
    is calculated using the ALPHA option (e.g., ALPHA=9). An example of the syntax
    to estimate 95% CI using the engineering data and to request SAS to evaluate whether
    the loadings are above an absolute magnitude of 0.4 is provided below. Note that
    the ML extraction method is specified and must be specified in order for these
    options to work.


    ```

    proc factor data = engadata nfactors = 2 method = ML rotate = OBLIMINnCI=4;

    var EngProb: INTERESTeng;

    ```


    +   - Traditional CIs are computed using the traditional formula that you might
    remember from your first statistics class: 0*±1.96*SE, where O* is the sample
    estimate.


    > *'
