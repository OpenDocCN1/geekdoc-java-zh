    of this chapter, for our purposes all you need to understand is that SEM can be
    used to estimate relationships between variables as though they were measured
    perfectly. The estimate, therefore of the correlation under perfect correlation
    r = 0.90 (coefficient of determination of 0.81), very close to the calculated
    correlation effect size.


    Unfortunately, although alphas in the 0.80 range are common, published research
    based on much lower reliability is also difficult to find. In fact, it is not
    difficult to find alphas over 0.70, despite the fact that a substantial portion
    of the effect size is lost! This should be considered an undesirable state of
    affairs in the 21st century, particularly when it is relatively simple to improve
    measurement in scales by increasing item numbers or through analysis using modern
    methods like structural equation modeling.


    # Application


    # Sample Size and the Precision of Alpha


    As we mentioned before, alpha is sample dependent. Thus it might be expected that
    sample size can affect the precision of our alpha estimate. When a smaller sample
    is used to estimate alpha, each observation contributes a lot of information to
    the estimate. An outlier or deviation from expectation in a small sample can have
    a profound effect on the results and can cause them to vary from the population
    mean. However, in a larger sample, the outlier or deviation will likely be averaged
    out by the other observations.


    Let''s explore this issue of sample size and precision with the Marsh SDQ data
    that we''ve using throughout the book. Let us start by examining the reliability
    of the parent subscale in the complete data set. The parent subscale is composed
    of five items:


    +   - (Par1) My parents treat me fairly.

    - (Par2) I do not like my parents very much.

    - (Par3) I get well with my parents.

    - (Par4) My parents are usually unhappy or disappointed with what I do.

    - (Par5) My parents understand me.


    Obviously Par2 and Par4 are reversed in direction. If you calculate alpha using
    these five items as is (see Figure 11.2 on page 192), you will get a negative
    alpha (which is impossible) as well as some negative item-total correlations (another
    sign of trouble).'
