    var Math: Par: Eng;

    run;

    ods output close; run;

    ```


    After, we we ran PROC FACTOR to replicate our analyses, the following error message
    appeared in our log in three different places.


    # Figure 7.5 Error in Log


    > NOTE: 3 factors will be retained by the NFACTOR criterion.

    ERROR: Commality greater than 1.0.

    NOTE: Community problems due to Heywood cases prevent further processing. You
    may consider using the HEYWOOD or ULTRAWOOD option.

    NOTE: The above message indicates for the following group:

    Sample Replicate Number=502


    The above message indicates that some of the estimates in three resamples exceed
    1. Logically, this should not happen. However that communities represent the amount
    of shared variance that can be extracted from an. Communalities greater than 1
    are equivalent to more than 100% of the variance! Although it is not logical,
    this is occasionally possible because of some mathematical properties of the common
    factor. An eigenvalue that exceeds 1 is a *Heywood case* (Heywood, 1931). and
    an eigenvalue that is equivalent to 1 is a *Heywood case*, the occurrence of such
    case can be problematic and indicate that our model might be misspecified (e.g.,
    wrong number of factors, etc.) or we may have insufficient cases to produce stable
    estimates.


    For the purpose of bootstrapping CI, this message is not necessarily concerning.
    It simply indicates that some of our samples have potentially biased—particular
    cases were oversampled, leading to a biased or more uniform data set. So, do not
    worry. This message is not a death sentence for you or for the majority of our
    samples, this could indicate there are substantial problems with our original
    data (e.g., bias, size).


    There are two ways we can proceed with the current analysis: 1) change our estimation
    method; or 2) allow SAS to solve solutions with Heywood or ultra-Heywood cases.
    The first is the preferred course of action. The maximum likelihood method of
    estimation is known to be particularly susceptible to Heywood cases (Brench, Hendrix,
    &ges, 2012). By switching to a method that is more robust for non-normal data
    (i.e., SLS or iterated PAF), we might be able to get better estimates from the
    data and avoid the problematic Heywood cases. The second option entails using
    the HEYWOOD or ULTRAWOOD option on the FACTOR statement to permit community estimates
    that are equal to greater than 1. This option should be used with care because
    it does not fix problems—it allows us to estimate results for potentially problematic
    data.


    # Eigenvalues and variance. We have proceeded with the current example by estimating
    eigenvalues using both options. The syntax is provided below.


    +   *Solution to Heywood Cases #1: Change the method;

    *Look at original sample and subsample solution with revised method;

    proc factor data=sqdata nfactors=3 method=uls rotate=OBLIM;'
