    \ 82\n\n# The Magic of Rotation\n\nUnrotated results from a factor analysis—are\
    \ not easy to interpret. Factor loading plots can help, but they can still present\
    \ a rather confusing picture, particularly if there are more than two factors!\
    \ Rotation was developed not long after factor analysis to help researchers clarify\
    \ and simplify the results of a factor analysis. Indeed, early methods were subjective\
    \ and graphic in nature (Thurstone, 1938) because the calculations were labor\
    \ intensive. Later scholars attempted to make rotation less subjective or exploratory\
    \ (e.g., Horst, 1941), leading to initial algorithms such as quartimax (Carroll,\
    \ 1953) and varimax (Kaiser, 1958). Although varimax was introduced early on,\
    \ it is still one of the most widely used methods of rotation (perhaps because\
    \ it is the default in much statistical software).¹"
