    the scree plot, and the second shows how to use ODS to produce the scree plot.
    We use the method=PRINT priors=BMC for this data because it seemed to be one of
    the appropriate methods based on the results in Chapter 2. We are also not including
    the number of factors to extract (NFACTORS = ) for two reasons. First, if we remember
    the example output for this data set provided in Chapter 2, SAS will produce the
    initial eigenvalues as well as the final extracted eigenvalues no matter what.
    And second, the default method in SAS is to use either the proportion'
