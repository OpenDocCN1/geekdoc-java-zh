    # What Is Cronbach’s Alpha (And What Is It Not)?


    Cronbach''s alpha (Cronbach, 1951) is one of the most widely reported indicators
    of scale reliability in the social sciences. It has some conveniences over other
    measures of reliability, and it has some drawbacks as well as many misconceptions
    about the appropriate use of alpha. In this section we will review the strengths,
    weaknesses, uses, and misuses of alpha. However, let us start by reviewing the
    original goal for alpha.


    Prior to Cronbach''s seminal work in this area, the reliability of a scale in
    a particular sample was evaluated through methods such as test-retest correlation.
    This type of reliability is discussed today in psychometrics textbooks, but it
    has serious drawbacks. These can include the difficulty of convening the same
    group of individuals to retain instruments, memory effects, and attenuation that
    due to real change between administrations. Another drawback is particular to
    constructs (e.g., mood, content knowledge) that are expected to change over time.
    Thus, as Cronbach put it, test-retest reliability is generally considered an index
    of stability rather than reliability per se.


    The split-half reliability estimate was also developed early in the 20th century.
    To perform this evaluation, the items are divided into two groups (most commonly,
    even- and odd-numbered


    Back in the mid 20th century, reliability and validity were discussed as a property
    of the scale (i.e., the Osborne Obsequiousness Scale is reliable and valid). Modern
    APA and other guidelines recommend that we talk about reliability and validity
    as the property of samples, not instruments. However, some instruments tend to
    appear more reliable across samples, and some less so. Hence the need for replication.'
