  md: '# Does Extraction Method Matter?


    So, now that we have gone through the effort of learning about the different extraction
    methods and figuring how to run them in SAS, what difference do they really make?
    Let''s see by comparing the results of five different extraction methods using
    the data sets summarized in Table 2.1 on page 15. We ran these models using the
    same syntax presented in the section above, just changing the METHOD option and
    eliminating the PRIORS option for all except the PAF and iterated PAF methods.
    We organized the results into some summary tables to perform easy comparison.


    Engineering data. As mentioned above, this data usually gives a clear two-factor
    solution. Table 2.2 on page 20 presents the communality estimates for the initial
    extraction, and each of the subsequent extraction methods. As you can see, the
    communalities of the various items are relatively stable the relatively small
    sample size, rarely varying by more than 0.10 across all extraction methods for
    a particular item. Table 2.3 on page 21 presents the eigenvalues extracted by
    the various methods. We also see very similar eigenvalues produced across the
    various methods. This suggests that when basic assumptions are met and factor
    structure is clear, the extraction method might not matter much.


