    **What alpha is not.** Alpha is not a measure of unidimensionality (an indicator
    that a scale is measuring a single construct rather than multiple constructs)
    is as often thought (Cortina, 1993; Schmitt, 1996). Unidimensionality is an important
    assumption of alpha, in scales that are multidimensional alpha also to be underestimated
