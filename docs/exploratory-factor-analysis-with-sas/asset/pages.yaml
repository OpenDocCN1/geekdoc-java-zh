    # Factor Scores 101


    Factor scores seemed to be cutting-edge back in the 1980s when the first author
    was beginning to take graduate statistics courses. The concept and practice extend
    back to the 1920s, although early on it was considered much less important than
    the determination of the actual factors themselves.^1 This practice developed
    as a rational response to the early practice of summing or averaging items on
    a scale to approximate an overall score. Of course, summing or averaging items
    assumes that all items contribute to the latent score. EFA demonstrated convincingly
    very early on that not all items are equally good measures of a construct and,
    better items should carry more weight in estimating an individual''s score.


    The practice of weighting items according to the results of EFA analyses held
    the potential of improving measurement. Researchers working prior to wide access
    to computers were then able to sum the weighted item score to approximate what
    might be the true score of


    ^1 At this time, there were also arguments about whether it was proper to construct
    factor scores, due to something called "indeterminacy"\essentially meaning that
    there are more unknowns than equations being estimated in EFA (for an excellent
    overview of the issue, see Grice, 2001). The same individuals could be ranked
    multiple ways, leaving their relative ranking indeterminate. This is a concern
    that remains today.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# 160 Chapter 9 / Factor Scores


    each individual on the construct being examined.¹ Thus, the computation of weighted
    factor scores makes sense and was a natural progression over a period of many
    decades of research. However, it is important to recognize the intricate nature
    of the factor score computation. There are many methods of computing factor scores
    and no single universal technique. In addition, factor scores are sensitive to
    the extraction and rotation methods used (DiSteano, Zhu, & Mindril, 2009).


    The practice of factor score estimation introduced a new assumption into our analyses:
    the factor loadings (correlations between an item and the factor) are stable and
    reasonable estimates of the dynamics within a population. A corollary of this,
    is that factor loadings are valid (invariant) for all subgroups examined. A similar
    set of assumptions and corresponding issues is present in linear modeling/regression
    analyses, particularly when researchers are using multiple regression to predict
    outcomes for individuals. For papers on regression, see Osborne, 2000). Specifically,
    the issue is these procedures can overfit most samples take advantage in order
    to fit the model, despite those sample characteristics being nonproducible (Thompson,
    2004, p. 70). Because of this issue, recommended in earlier chapters that we focus
    on replication and evaluate the anticipated precision or variety across samples
    to evaluate the goodness of EFA. However, factor score estimation can be considered
    a relatively common practice and thus a book about EFA might not be complete without
    mentioning this practice. Therefore, here are our goals for this chapter:


    +   1 Review some basic aspects of computing factor scores.


    +   2 Review how the solutions from EFA can be unstable across samples, which
    can contribute to instability of factor scores.


    # Example Syntax and Output


    Two basic procedures exist for producing factor scores in SAS: 1) a predefined
    SAS option and 2) a program-it-yourself option. As you might imagine, the predefined
    SAS option is by the far easier. When we use the OUT=output-data-name option for
    the FACTOR statement (SAS, 2015), SAS will automatically output a data set that
    contains all of your original data with an estimate of weighted factor scores
    (e.g., Factor1, Factor2, etc.). SAS computes the factor scores as a linear combination
    of a standardized version of variables (i.e., with a mean of 0 and a standard
    deviation of 1) and something called the standardized scoring coefficients.² The
    scoring coefficients are essentially the regression


    Refined techniques are actually a bit more complex, taking into account more than
    just factor loading—for example, the correlation between factors. However, the
    point of this chapter is to discourage the use of factor scores, we will refrain
    from providing more detail.


    See the accompanying SAS syntax for this chapter, available on the book website,
    for a step-by-step example of how SAS computes the factor scores.'
  merge: -1
