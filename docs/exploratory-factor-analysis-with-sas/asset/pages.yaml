    | GDS29 | .28 | (-.01, .60) | .23 | (.02, .42) | .37 | (.27, .50) |

    | GDS30 | .50 | (.25, .70) | .30 | (.09, .49) | .39 | (.27, .50) |


    > *This parameter could not be estimated because of lack of variance among the
    responses for this item in the reduced sample. Note: Confidence intervals that
    do not contain the “population” are highlighted.


    The bootstrap Cl can serve as a very effective indicator of the precision of an
    estimate. When Cls are broad, they indicate we are not very confident in our estimates
    and the true population estimate could vary greatly. They also suggest that we
    could see substantial variation in our estimate if we were to replicate the analysis
    in similar samples. When Cls are narrow, they suggest the opposite—estimates are
    close to the population parameter and they are likely to be replicas. Cl can be
    a very informative and useful tool to aid in the interpretation of alpha and many
    other statistics.


    # Summary


    Cronbach’s alpha is one of the most widely reported statistics relating to reliability
    in the social sciences. It can be interpreted as an estimate of possible split-half
    statistics. It is also interpreted as the percent of variance that is “true score”
    variance. Thus, if we have a measure with α = 0.80 in a particular sample, there
    is about 80% that it is “true score” and about 20% error in the measurement for
    that sample.


    Unfortunately, alpha is still not reported in a majority of articles in modern,
    high-quality research journals. This might stem from the anarchistic assertion
    that scales, particularly those that are frequently used, are more or less reliable.
    However, as we demonstrated'
