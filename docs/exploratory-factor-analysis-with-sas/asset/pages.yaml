- img_proc: true
  md: 'However, in EFA there are very few tests of statistical significance and just
    above zero is often not enough. An eigenvalue of 0.5 is frequently not interesting
    but a factor loading of 0.5 might at least pique our interest. Similarly, a factor
    loading of 0.1 and 0.2 is just as uninteresting as factor loadings of zero. Thus,
    we are interested in the relative magnitude of the effects captured within the
    CI. In addition, if the range of magnitudes covered is broad, this could suggest
    there is a large amount of sampling error and that our results might not reflect
    those in the population.


    # Generalizability and Heywood Cases


    As we have reviewed, bootstrap resampling helps us answer the question of reliability
    and generalizability. In this example, we will examine the results from a relatively
    small sample of the Marsh SDG data and compare it to our larger data set. We will
    assert that analysis of approximately 16,000 students represents the "gold standard"
    or population factor structure, and we will see whether bootstrapping CI for our
    small sample can lead us to the "population" parameters with reasonable accuracy.
    A random sample of 300 cases was selected and then by bootstrap resampling and
    analysis (with maximum likelihood extraction and direct oblique rotation).


    Imagining that this small sample was only information about this scale, we started
    by performing an EFA on this unique. The syntax to select the subsample and run
    the basic EFA is presented below.


    ```

    **Select subsample from SDG data;

    proc surveyselect data=sdqdata method=rs n=300 out=sdqdata_ssl seed=3932;

    **Look factor structure in subsample;

    proc factor data=sdqdata_ssl nfactors=3 method=ml rotate=OBLIN; Var Math: Pat:
    Eng;

    ```


    Three factors exceeded an eigenvalue of 1.0, which was corroborated by MAP analysis
    and produced a recommendation to extract three factors. Thus, if this were my
    only sample, theory, Kaiser Criterion, and MAP analysis would lead to extract
    three factors.


    Heywood cases. We then performed bootstrap resampling on the eigenvalues and pattern
    factor loadings to ensure the relative stability of our solution. Again, we selected
    2000 samples and replicated our analysis in each sample. The syntax to select
    the subsamples and run the EFA on each sample is presented below.


    ```

    **Conduct bootstrap resampling from the data set;

    proc surveyselect data=sddata_ssl method=URS samprate=1 outiths out=outboot_sdq
    (compress-binary) seed=1 rep=2000;

    **Notice occurrence of Heywood cases;

    ods output Eigenvalues=boot_eigen ObliqueRotFactPat=boot_loadings;

    proc factor data=outboot_sdq nfactors=3 method=ml rotate=OBLIMIN;

    ```'
