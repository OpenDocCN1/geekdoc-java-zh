    Although examination of communalities and eigenvalues is not part of replication
    procedure, they can give us additional information about our samples and solutions.
    In the above table, the final extracted communalities for the items in each sample
    are similar. If we were to take the difference between the two communalities,
    they would range between .01 and .10. This indicates approximately the amount
    of variance is extracted from each item in the two samples—a good sign for replication
    analysis!


    The final eigenvalues differ a little more because they are the sum of the partitioned
    item level variance. Remember, the unique variance that is associated with each
    item is then further divided by the factors. All of the tiny differences in the
    extracted variance is compounded in the eigenvalues, resulting in larger differences.
    Furthermore, the order in which the factors are extracted is determined by their
    eigenvalues. Thus, in sample 1 the factor that the parenting items load on is
    extracted because it has the smallest (just barely) eigenvalue. However, in sample
    2, the factor that these items load on is extracted second because slightly larger
    eigenvalue. As we mentioned above, these differences in extraction order are not
    important when examining structural replication, but they tell us that the relative
    weight of the factors has shifted significantly. In this example, the parenting
    items explain more variance in sample 2.


    Finally, we made SAS all the work in the analysis for us. We output our pattern
    matrix to a SAS data set then merged and compared the results. The syntax to do
    this, along with line for comments, is presented below. The syntax to create the
    two subsamples is provided above and is not included here.


    ```

    **Conduct EFA Analysis;

    ods output system used to output pattern matrix;

    ods output ObliqueRotFactPat=SS1_pattern;

    proc factor data = sdqdata_ss1 nfactors = 3 method = ml

    rotate = OBLIMIN fuzz=3;

    VAR Math: Par; Eng;

    run;

    ods output ObliqueRotFactPat=SS2_pattern;

    proc factor data = sdqdata_ss2 nfactors = 3 method = ml

    rotate = OBLIMIN fuzz=.3;

    VAR Math: Par; Eng;

    run;

    ods output close;

    ```'
