  md: 'Most scholars familiar with bootstrap resampling will agree with what we have
    said thus far—bootstrap resampling is beneficial for estimating CI—but they will
    likely stop agreeing at this point. There are a wide number of opinions on what
    bootstrap resampling is good for and what it is not good for. You will get our
    opinion on what in this chapter, but be aware that there are strong passions around
    this issue (much like principal components analysis).


    # What Can Bootstrap Resampling Do, and What Should It Not Be Used For?


    Many early adopters of the procedure saw bootstrap analysis as a panacea for small
    or biased samples. They reasoned that, with enough resampled data sets, the bias
    and small sample would be compensated for, and provide a better estimate of the
    population parameters than the original sample by itself. These scholars wanted
    to replace an estimate produced by the sample with the average bootstrap statistic.


    Unfortunately, bootstrapped statistics are not immune to all biases. Osborne’s
    (2015) experiments with logistic regression suggests that results from small or
    biased samples tend not to self-correcting and instead leading to misleading.
    In other words, the averaged bootstrap statistic from a biased sample can just
    as biased as the original estimate. Large biased samples are probably in the same
    category. You can endlessly resell the same small or biased sample, but there
    is limited information in the sample. One cannot build something out of.


    Some research suggest that level of bias may be accounted for through specific
    methods of CI estimation (or biased-corrected or accelerated interval methods;
    Davison & Hinkley, 1997, p. 231; Elfron & Tibshirani, 1994, p. 184). However,
    these methods were designed for a corrected estimate of the Cls, but some of the
    methods could be extended to provide a corrected estimate of the average bootstrap
    statistic. Although some of the methods we do not believe this is a worthwhile
    endeavor. These methods might be useful in estimating more CI for biased or small
    samples, but we do not believe they are robust to provide a reliable estimate
    of the population parameter.


    Bootstrap analysis provides estimates of replicability or generalizability and
    help identify inappropriately influential data points in a sample. Although resampling
    might not be able to improve upon a biased estimate, it can provide CI through
    which we can evaluate how imprecise the parameter estimates are. These CI can
    help researchers interpret their results and determine how they might generalize.
    In addition, bootstrap methods provide a distribution of parameter estimates from
    the resampling. This distribution can help identify inappropriately influential
    data points. If one does that and they are distributed with a skew, the long tail
    is likely due to the influence of a few cases. However, it is important to note
    that there can be easier to detect inappropriately influential data points. Osborne
    (2015) found that cleaning data prior to bootstrap analysis often yielded much
    better results. Thus, if you have a sample, and if you are intending to bootstrap,
    it is best to do some preliminary data cleaning.'
