  md: "# 122 Chapter 7 / Bootstrap Applications\n\nFinally, we will use the SORT and\
    \ UNIVARIATE procedures to estimate our 95% CI from the bootstrap distribution.\
    \ We must first sort our data because we are estimating CIs for multiple estimates—the\
    \ eigenvalues—and we will need to use BY processing again to separate estimates\
    \ for each eigenvalue. BY processing the analysis variable, in this case our eigenvalue\
    \ number (i., \"Number\"), is sorted in ascending order. We did not need to sort\
    \ the data when we used BY processing in the FACTOR procedure above because the\
    \ variable, \"replicate\", was already in ascending order (it was output this\
    \ way by the SURVEYSELECT procedure). We also use the NODUPKEY option in PROC\
    \ SORT to remove the second set of eigenvalues, for the reduced correlation matrix,\
    \ from our data. Since the preliminary eigenvalues are ordered first in our data\
    \ set, this option will keep them and delete the other eigenvalues that appear\
    \ as the second occurrence of a variable Number by Replication ID. Please note,\
    \ the NODUPKEY option is required only when bootstrapping CI for the eigenvalues.\n\
    \nThe UNIVARIATE procedure can then be used to estimate the 95% CI. Two statements\
    \ are required by this procedure for the CI to be estimated: the VAR and OUTPUT\
    \ statements. The VAR statement lists the variables that we would like to estimate\
    \ CI for and the OUTPUT statement saves a data set with requested estimates. Within\
    \ the OUTPUT statement, the OUT and PCTLTS options are necessary to name the output\
    \ data and specify the percentiles we would like to output. For a 95% CI, you\
    \ would request the 2.5 and 97.5 percentiles. Finally, the PCTLRE option in the\
    \ OUTPUT can be used to add a prefix to the CI variables that will be output to\
    \ our data set. An example of this syntax is provided below, and an final data\
    \ set output by the procedure is presented in Figure 7.3 on page 123.\n\n```\n\
    proc sort data = boot_eigen nodupkey;\n  by Number Replicate;\nrun;\nproc univariate\
    \ data = boot_eigen;\n  by Number;\n  var Eigenvalue;\n  output out = final pctlts\
    \ = 2.5, 97.5 pctlpre = ci;\nrun;\n```\n\nSome of the ODS tables output more than\
    \ one set of estimates. It is a best practice to look at an example ODS table\
    \ and identify the results you have before you proceed. In some cases, such as\
    \ with the eigenvalues, you will need to remove additional estimate output before\
    \ you estimate your CI."
