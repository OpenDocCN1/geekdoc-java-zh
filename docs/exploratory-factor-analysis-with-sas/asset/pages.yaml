    asks whether you voted in the last election, and if so, how much research you
    did about the candidates before voting, it is legitimate to skip the second part
    if you did not vote in the election.


    Legimately missing data can be dealt with in different ways. One common way of
    dealing with this sort of data could be using analyses that do not require (or
    deal effectively with) incomplete data. These include things like hierarchical
    modeling (HLM; Raudenbusch & Bryk, 2002) or item response theory. Another common
    way of dealing with sort of missing data is adjusting the denominator. Again taking
    the example of the marriage survey, we could eliminate nonmarried individuals
