  md: "# Which Method?\n\nNote: (a) unrotated factor matrix; (b) pattern matrix; (c)\
    \ reference structure matrix; and (d) structure matrix.\n\n# Which Method?\n\n\
    ### Orthogonal vs Oblique\nOrthogonal and oblique rotations will produce virtually\
    \ identical solutions in the case where factors are perfectly uncorrelated. As\
    \ the correlation between latent variables diverges from r = 0.00, the oblique\
    \ solution will produce increasingly clearer rotated factor patterns.\n\nUsing\
    \ the following syntax, we can print each type of rotation on the engineering\
    \ data and output a plot of the rotated factor loadings from the pattern matrix.\
    \ We use ODS to plot the results, and request the plots of the factor loadings\
    \ including the PLOTS = LOADINGS option on the FACTOR statement.\n\n```\nods graphs/\
    \ width = 4in height = 6in;\nproc factor data = engata nfactors = 2 method = print\
    \ priors = SMC\nrotate = VARIMAX plots = loadings ;\nVarEngProb: INTESTING;\n\
    run;\nproc factor data = engata nfactors = 2 method = print priors = SMC\nrotate\
    \ = QUARTIM plots = loadings ;\nVarEngProb: INTESTING;\nrun;\nproc factor data\
    \ = engata nfactors = 2 method = print priors = SMC\nrotate = EQUAMAX plots =\
    \ loadings ;\nVarEngProb: INTESTING;\nrun;\nproc factor data = engata nfactors\
    \ = 2 method = print priors = SMC\nrotate = OBLIMIN plots = loadings ;\nVarEngProb:\
    \ INTESTING;\nrun;\n graphs off;\n```\n\nFigure 4.3 on page 71 presents the rotated\
    \ factor loadings for the engineering data using each of the methods summarized\
    \ earlier in the chapter. The two uppermost plots represent the oblique methods,\
    \ but the remaining represent the orthogonal methods. Notice that factor loadings\
    \ in the oblique plots cluster around the axes. In contrast, the factor loadings\
    \ in the orthogonal plots tend to cluster around a point slightly away from the\
    \ axes."
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 70 Chapter 4 / Rotation


    This is because these factors are modestly correlated, but the orthogonal mandate
    to maintain a 90° angle between axes means that the centroids of the clusters
    cannot move closer to the axis lines.


    In this case, the difference between the oblique and orthogonal methods is not
    great, but it is noticeable. This is a small but clear example of the higher efficacy
    of oblique rotations to create clear patterns of results in EFA where the factors
    are indeed correlated. As far as we are aware, there is no rationale for using
    orthogonal rotation instead of oblique rotation (except tradition). Furthermore,
    if factors are uncorrelated, orthogonal and oblique solutions will yield very
    similar results. Thus, if there is uncertainty about the relationship between
    the factors, we would recommend using an oblique rotation.'
  merge: -1
