  md: "# Application: Replication of Marsh SDQ Data\n\nThis example demonstrates a\
    \ replication analysis for EFA for Osborne & Fitzpatrick’s (2012) procedure. We\
    \ use internal replicability analysis with the SDQ data, randomly subsampling\
    \ two independent samples from the original that are then analyzed separately\
    \ using specific extraction and rotation guidelines based on our previous analyses\
    \ of the scale. We use the SDQ data because it is large enough (N=15,661) to permit\
    \ us to draw two moderately sized subsamples from the data. Unfortunately, the\
    \ engineering and G data sets are not large enough to usample the data. If we\
    \ were to do so, this would result in sample sizes of less than 240 and subject\
    \ to item ratios of less than 13:1. If we remember the previous chapter, these\
    \ are not ideal conditions for an EFA!\n\nBefore we get started, let's review\
    \ the syntax to sample a data set. We use SURVEYSELECT procedure, as we did for\
    \ an example in the previous chapter. The code to produce our subsamples is presented\
    \ and described below.\n\n+   *Sample 1;\n```proc surveyselect data = sdqdata\
    \ method = SRS n = 500\n    out = sdqdata_ss1 seed = 37;\n```\n*Sample 2;\n```proc\
    \ surveyselect data = sdqdata method = SRS n = 500\n    out = sdqdata_ss2 seed\
    \ = 62;\n```\n\nIn the code above, the DATA argument specifies the input data\
    \ set to sample records; the METHOD argument specifies the method of sampling\
    \ (that we use random sampling without replacement above); the N argument specifies\
    \ the number of records to include in our; the OUT argument specifies the name\
    \ of the data set to contain the subsample; and the SEED option sets the seed\
    \ to our random number so we can rerun this code and get the same subsample.\n\
    \nAfter we draw two subsamples from the original data, we conduct an EFA on each\
    \ data set. We take care to apply the same methods (e.g., extraction, rotation)\
    \ to each data set so that differences in the results are attributable to the\
    \ data and not the methods. Consistent with our findings in previous chapters,\
    \ we use maximum likelihood extraction and obimin rotation. We also report a three-factor\
    \ solution suggested by previous research on the scale as well as two- and four-factor\
    \ solutions to demonstrate how misspecification of a factor model can quickly\
    \ become evident through replication analysis. An example of the basic syntax\
    \ for the three-factor solution run on the first sample is presented below.\n\n\
    ```\nproc factor data = sdqdata_ss1 nfactors = 3 method = ml\nrotate = OBLIMIN\
    \ fuzz=.3;\n```"
