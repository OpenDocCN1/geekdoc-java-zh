  md: '# Types of Rotation


    As with extraction


    Orthogonal rotations produce factors that are uncorrelated (i.e., maintain a 90°
    angle between axes), and oblique methods allow the factors to correlate (i.e.,
    allow the X and Y-axes to assume a different angle than 90°). Traditionally, researchers
    have been guided to orthogonal rotation because (the argument is simpler),¹-at-²
    a fact that made a significant difference during much of the 20th century when
    EFA was performed by hand calculations or on early computers. Orthogonal rotations
    (which include quartimax, equamax, and varimax) are generally the default setting
    in other statistical software. However, in PROC FACTOR, there is no default method
    of rotation—the researcher must specify the method in order for it to occur.


    Let us review some of the more common methods of rotation. The first three are
    orthogonal methods (i.e., produce uncorrelated factors) and the latter are oblique
    methods (i.e., produce correlated factors).


    Varimax rotation seeks to maximize the variance within a factor (within a column
    of factor loadings) In this way, this method modifies the factors by identifying
    a set of variables that have high loadings on one and another that have high loadings
    on another. However, some variables might not load strongly on any of the factors.


    Quartimax tends to focus on rows, maximizing the differences between factors for
    a particular variable—increasing high loadings and minimizing small loads. This
    method seeks to simplify interpretation at the variable level—it wants each variable
    to load on one factor, and only one.


    Equamax is considered a compromise between varimax and quartimax, that it seeks
    to clarify loadings in both directions. It attempts to find a solution where factor
    loadings clearly distinguish the factors, and the variables load on one primary
    factor.


    Promax is remembered by Thompson (2004) as the more desirable oblique rotation
    choice.²This method starts by actually conducting an orthogonal rotation to clarify
    the


    +   1 Researchers also tend to misinterpret the meaning of "orthogonal" to mean
    that factors scores are uncorrelated. Orthogonal factors can (and often do) produce
    factors that are correlated (Nunnally & Bernstein, 1994; Thompson, 2004). For
    more factor about factors, see Chapter 9.


    +   2 However, others have argued that there are few substantive differences between
    the two oblique rotations (Fabiger, Wegener, MacCallum, & Strahan, 1999).'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 64 Chapter 4 / Rotation


    pattern of loadings. It then slowly starts to allow the factors to become correlated
    through a procustean rotation (which is less common and not discussed here). The
    initial method of rotation can be specified through the PRORATE option. If no
    option is specified, PROC FACTOR will default to using a varimax rotation.


    Direct oblimin is another oblique rotation that can sometimes be problematic but
    often gives very similar results to promax.


    The oblique methods, promax and oblimin, have parameters that allow the researcher
    to limit how correlated factors can be. The POWER option raises the factor loadings
    to a specified power, effectively increasing the correlation of the factors as
    the power becomes larger. The default power for these methods is 3, but users
    can adjust the value to any value greater or equal to 1. A low correlation can
    be specified as POWER=1, but a high can be specified as POWER=5. Even though researchers
    can adjust the possible correlation between factors, they cannot force the factors
    to be correlated if they are not—in other words, you can limit how strongly correlated
    the factors are, not the minimum correlation.


    Each of the techniques described above is specified on the ROTATE option in the
    FACTOR procedure. The different rotation methods summarized above be requested
    using the following keywords.


    ```

    rotate =

    VARIMAX /Varimax rotation*

    QUARTIMAX /Quartimax rotation*

    EQUAMAX /Equamax rotation*

    PROMAX /Promax rotation*

    OBLIMIN /Direct Oblimin rotation*

    ```


    Please note that the mathematical algorithms for each rotation discussed are above,
    and beyond the scope of this brief introduction. However, the overall goal of
    each method is the same: simplicity and clarity of factor loadings. For details
    about how they achieve these goals, SAS (2015). For a good overview of the technical
    details of different versions of varimax rotation, see Forina, Armanino, Lanteri,
    and Leardi (1989).


    # Orthogonal vs Oblique Rotation


    Conventional wisdom in the literature and many texts advise to use orthogonal
    rotation because it produces easily interpretable results, but this might be a
    flawed argument. In the social sciences (and many other sciences), we generally
    expect some correlation among factors, particularly scales that reside within
    the same instrument or questionnaire (i.e., shared method variance will produce
    nonzero correlations). In practice, even when we create factors using an orthogonal
    method, the factor scores (derived from the factor structure; see Chapter 9) are
    often correlated despite the orthogonal nature of the factors. Therefore, using
    orthogonal rotation results in a loss of valuable information if the factors are
    really correlated, and oblique rotation should theoretically render'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'a more accurate, and perhaps more reproducible, solution.¹ Further, in the
    unlikely event that researchers manage to produce truly uncorrelated factors,
    and oblique rotation produce nearly identical results, leaving oblique rotation
    a very low-risk, potentially high-benefit choice.


    The two sets of methods—orthogonal and oblique—do, however, differ in ease of
    interpretation. When using orthogonal rotation, researchers have only one matrix
    to interpret. When using oblique rotation, there are two methods of review (described
    in the next section). In our experience—and in many of our examples—the two matrices
    tend to parallel each other in interpretation. So, again, in our mind this does
    not create an insurmountable barrier.


    # Interpretation of Factor Matrices


    All extracted factors are initially orthogonal (Thompson, 2004), but remain so
    only as long as the rotation is orthogonal (we discussed this briefly in the section
    above). In practice, results in interpretation of one matrix (a pattern matrix)
    when conducting an orthogonal rotation, and two matrices (a pattern and structure
    matrix) when conducting an oblique rotation. To further complicate interpretation,
    an unannotated factor matrix is always output, and a reference structure matrix
    when oblique rotation is done—neither of which is traditionally interpreted. The
    presence of multiple matrices, whether they are to be interpreted or not, is a
    source of confusion in practice.² Let''s start with a few conceptual definitions
    of each:


    **Unrotated factor matrix coefficients** are generally reported by most statistical
    software regardless of rotation. They represent the unrotated factor loadings,
    and are generally not of interest.³ In PROC FACTOR, they appear toward the top
    of the output in a table titled "Factor Pattern." Despite the title, this should
    not be confused with the pattern matrix that is described.


    **Pattern matrix coefficients** are essentially a series of standardized regression
    coefficients (beta or β in the regression world) expressing the variable as a
    function of factor loadings. These are also output for all rotation methods. You
    can think of these as the list of ingredients in the recipe (e.g., to make Item
    13, add 0.70 to factor 1, 0.13 to factor 2, 0.02 to factor 3, etc. Mix... delicious!).
    Like regression coefficients, they hold all other variables (factors) in the equation
    when estimating the pattern matrix coefficients. So, if factors are uncorrelated,
    pattern and structure coefficients are identical. As factors become more strongly
    correlated, the two types of coefficients will become less alike. Thus, think
    of pattern matrix coefficients as "row" statistics, describing the individual
    item''s unique


    +   have argued that oblique rotations produce less replicable results as they
    overfit the data to a greater extent. We do not think there is empirical evidence
    to support this argument, but overfitting the data is a concern to all EFA analyses,
    as we will discuss later in the book.


    +   In this section we draw heavily on Thompson (2004), which is always a good
    reference.


    +   Except for needs us trying to understand all this stuff.'
