- img_proc: true
  md: '# Key Concepts


    **Matrix of associations.** The basic unit of analysis in an EFA is a matrix of
    associations—either a correlation or a covariance matrix. If you input a data
    set into your EFA, the program will estimate this as step 1. Alternatively, you
    can input the correlation or covariance matrix directly, reading in the raw data.
    This can be useful when trying to replicate someone''s analyses based on published
    results or wanting to analyze ordinal or dichotomous variables through a corrected
    correlation matrix (i.e., polychoric or tetrachoric). In either case, the extraction
    methods will yield slightly different results based on the matrix of association
    being. The default method in PROC FACTOR is the simple correlation matrix (the
    most commonly used type of association for EFA). Correlations are most commonly
    used in EFA as they are only influenced by the magnitude of the association of
    the two variables. By contrast, covariances are influenced by association, as
    well as the variance of each of the two variables in question (Thompson, 2004).
    The default method in PROC FACTOR can be changed using the COVARIANCE option.


    **Commalities.** In EFA, the communities are the estimates of the shared variance
    in each variable, or the variance that will be accounted for by all the factors.
    They are computed from the matrix of associations, and their decomposition and
    partitioning is the goal of all subsequent analysis. Estimation of the communalities
    is a defining characteristic of EFA that distinguishes it from PCA. In EFA, the
    communities are always less than 1.00 for each variable EFA seeks to decompose
    the shared variance; while in PCA, they are initially 1.0 because there is no
    distinction between shared and unique variance.


    Although the different extraction methods generally yield different estimates
    of communalities, each method typically starts with the same initial estimates.
    The initial estimate aims to get a quick and simple idea of the shared variance
    in each variable. The default process for the EFA techniques is to estimate the
    initial communalities as the squared multiple correlation of a variable with all
    others. They are called the “Priorality Estimates” in the output, and they should
    appear as one of the first tables. Starting with the initial estimates, the communalities
    are iteratively re-estimated via the selected extraction method to produce the
    final estimates.


    The communalities can be thought of as a raw statistic. When looking at a table
    of loadings, with variables as rows and factor loadings in columns, the communalities
    for a variable are a function of the factor loadings. Squaring and summing each
    factor loading for a variable should equal the extracted communality (within reasonable
    error).^2


    +   1 Two techniques, by default factor extraction and iterated principal axis
    extraction, are PCA and not by EFA. Initial extraction of communalities using
    the squared multiple correlation must be specified using the PRIORS = SMC option
    in for EFA extraction to occur.

    2 Note the following detail where an orthogonal rotation is used. Oblique rotations
    are more complicated than by calculating by hand, as the factors are correlated.
    Communalities are the sum of variable''s pattern loading, multiplied by the structure
    loading. Statistical software handles these complexities for us.'
  merge: -1
