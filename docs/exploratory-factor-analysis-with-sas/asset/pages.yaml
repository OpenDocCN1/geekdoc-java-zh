    # # Summary


    Many of us, even with years of experience using EFA, remain unclear on some of
    the nuances and details of what is exactly happening "under the hood" when we
    perform this analysis. Sticking with the default settings in most modern statistical
    software will generally not lead to using best practices. In PROC FACTOR, the
    default method of extraction is actually'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 26 Chapter 2 / Extraction Method


    not even a method of factor analysis — it''s PCA! This is a solid choice if you
    were a psychologist in the 1960s, in the 21st century, we can do better. So, pay
    attention: the extraction method must be specified in order for factor analysis
    to be conducted.


    As for which method to use—our examples in this chapter demonstrated that most
    extraction techniques can be used when the data has a clear structure and meets
    basic assumptions of normality. When the data does not meet assumptions of normality,
    the iterated PAF or ULS extraction techniques can provide the best estimates.
    This led us to conclude that extraction method can matter more when assumptions
    are violated and when assumptions are met.


    However, there is general consensus in the literature that ML is the preferred
    choice for when data exhibits multivariate normality and iterated PAF or ULS for
    when assumption is violated (Fabrig, Wegener, McCallum, & Strahan, 1999; Nunnally
    & Bernstein, 1994). Other extraction techniques seem to be vulnerable to violations
    of this assumption, and do not seem to provide any substantial benefit. Thus,
    the general recommendation to use either ML, iterated PAF, or ULS seems sensible.


    # Exercises


    +   1 Download the engineering, SDQ, and/or GDS data from the book website. Replicate
    the results reported in the chapter. Examine the extraction methods to see which
    one provides the best extraction for each data set.


    +   2 Download data from an early version of the first author’s early studies
    on identification with academics (Osborne, 1997). This instrument was intended
    to be a measure of identification with academics (the extent to a student defines
    himself or herself as a student as part of self-concept). There were supposed
    to be three scales, measured on a scale of 1 (disagree strongly) to 7 (agree strongly):
    a) centrality of academics to self (items 1, 4, 7, 9, 10, 15, 16, 18, 19, 20,
    21); b) feelings of discrimination (2, 3, 6), and; c) diagnosticity of academic
    outcomes (5, 8, 12, 13, 17). Examine the extraction methods and determine which
    one provides the best extraction for this data set.'
