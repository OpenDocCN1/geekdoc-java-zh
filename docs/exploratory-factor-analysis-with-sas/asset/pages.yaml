    **The correct interpretation of alpha.** Cronbach (1951) himself wrote and provided
    proofs for several assertions about alpha:


    +   - Alpha is n/n-1 the ratio of inter-item covariance to total variance—in other
    words, a direct assessment of the error of (unexplained) variance in the measure.


    +   - The average of all possible split-half coefficients for a given test.²


    +   - The coefficient of equivalence from two tests composed of items randomly
    sampled (without replacement) from a universe of items with the mean covariance
    as the test or scale in questions.


    +   - A lower-bound estimate of the coefficient of precision (accuracy of the
    test with particular items) and coefficient of equivalency (simultaneous administration
    of two tests with matching items).


    +   - The proportion (lower-bound) of the variance that is due to all common factors
    among the items.


