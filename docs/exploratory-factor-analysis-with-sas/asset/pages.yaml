    pattern loadings and subsequent factor scores can vary more among scales with
    a less clear structure. You can also refer to Grice''s (2001) excellent work on
    the topic for more information.


    # What Are Modern Alternatives?


    **Structural equation modeling.** Structural equation modeling (SEM) explicitly
    models latent variables. However, factor scores tend to estimate what individuals
    *might* score on a factor. If the goal is to understand how latent variables (constructs)
    relate to each other, we have been able to directly model this for a while now,
    and this is a good alternative for some. SEM has many of the drawbacks in replication
    that we just discussed in relation to multiple regression and EFA. Most notably,
    it will tend to overfit the model to the sample, so if the sample is quirky, contains
    biases or error, the solution will not be as generalizable as we would hope. So
    SEM is not a panacea. You must have an unbiased, large scale in order for replicability—and
    you should test whether the results replicate or not.

