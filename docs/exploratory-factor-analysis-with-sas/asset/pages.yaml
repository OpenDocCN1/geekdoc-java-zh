  md: '# Replication in the literature. Although replication procedures are far from
    common in EFA, some researchers have explored these analyses and made recommendations
    for others. In some fields this is known as replication analysis, and in others
    it is referred to as cross validation analysis.


    In the clinical literature, the issue of replication was emphasized by the use
    of factor scores (weighted averages of items based on factor loadings). Factor
    scores (as we will discuss in Chapter 9) are a contentious practice because factor
    loadings and even factor structure vary dramatically across groups. The result
    can lead identical patient or participant responses to vary considerably. Thus,
    some clinical researchers (e.g., Floyd & Widaman, 1995) suggest cross validation
    procedures for factor scores, similar to those recommended for regression prediction
    equations. This recommendation highlights the importance of knowing how well a
    solution within one sample—even a very large, representative sample—generates.


    Similarly, Briggs & Cheek (1986) argued three decades ago that one of the critical
    concerns to personality psychologists (and personality measurement) be replicability
    of factor structure. They summarized EFAs that had been conducted with a commonly
    used measure, the Self-Monitoring Scale, and reviewed the effect key decisions
    could have (e.g., response options, extraction method, extraction criteria, rotation
    method, etc.) on the solution. They emphasized the concept that "factors do not
    replicate of little value."


    One high-profile application of replication techniques was an ambitious attempt
    by McCrae & Costa (1997) to examine whether the homely Five Factor Model of personality
    generalized across six different translations of their revised NEO personality
    inventory. In this approach, strong replication across cultures and languages
    including English, German, Portuguese, Hebrew, Korean, and Japanese samples not
    only confirmed the confidence of the translations of, but the universality of
    the five-factor model. Although McCrae & Costa effectively used replication procedures
    for EFA, it is important to note that they believe they might have been better
    served by a multigroup confirmatory factor analysis (CFA). A multigroup CFA would
    have allowed them to use inferential statistics to determine whether aspects of
    the factor model significantly different across groups.


    # Procedural Aspects of Replicability Analysis


    For those familiar with shrinkage analyses and cross validation of prediction
    equations in multiple regression, these procedures and suggestions will perhaps
    feel familiar. Replicability analyses in EFA (e.g., Thompson, 2004) can be conducted
    in two ways: via internal or external replication. In internal replication, the
    researcher splits a single data set into two samples via random assignment. In
    external replication, the researcher uses two separately gathered sets. In brief,
    replicability analysis occurs as follows:


    +   EFA is conducted on each sample by extracting a fixed number of factors using
    a chosen extraction method (i.e., maximum likelihood or PAF) and rotation method
    (i.e., obimin or varimax).'
