- img_proc: true
  md: '# Chapter 1 / Introduction to Exploratory Factor Analysis


    throughout the book using real data, and we will occasionally survey some poor
    practices as a learning tool.


    To get started in our exploration of EFA, we will first discuss the similarities
    and differences between EFA and principal components analysis (PCA), another technique
    that is commonly used for the same goal as EFA. We will briefly summarize the
    steps to follow when conducting an EFA and conclude with a quick introduction
    to EFA in SAS.


    # EFA vs PCA


    As you will come to learn, EFA is quite different from PCA. Unfortunately, there
    are many misconceptions about the two analyses, and one of the greatest that PCA
    is part of, or synonymous with, EFA. This misconception probably has modern day
    roots from at least two factors:


    +   1 Statistical software, including SAS, PCA as the default extraction technique
    when performing exploratory factor analysis

    2 Many modern researchers use PCA and EFA interchangeably, or use PCA when performing
    an analysis that is more appropriate for EFA.


    Although the two methods generally seem to do the same thing, they are different
    in some key ways. Principal components analysis is a computationally simplified
    version of a general class of dimension reduction analyses. EFA was developed
    before PCA (Hotelling, 1933), thanks to Spearman (1904). EFA was developed before
    the computer age when all statistical calculations were done by hand, using matrix
    algebra. As such, these were significant undertakings requiring a great deal of
    effort. Because of the substantial effort required to perform EFA with hand calculations,
    significant scholarship and effort into developing EFA as a legitimate alternative
    that was less intense but also provided similar results (Gorsuc, 1990). Computer
    became accessible to researchers at universities and industrial labs later in
    the 20th century, but remained relatively slow and with limited memory until very
    late in the 20th century (about the first author in graduate school using mainframes
    at the university). Our commentary on PCA is not intended to slight these scholars
    nor to minimize their contributions, but rather attempt to put PCA and EFA into
    context for the modern statistician and quantitative researcher. We will therefore
    focus on EFA, despite the popularity of PCA.


    Without getting into the technical details, which are available in other scholarly
    references on the topic, PCA computes analysis without the underlying latent structure
    of the variables, using all the variance in the manifest variables. What this
    means is there is a fundamental assumption when choosing PCA: that the measured
    variables are themselves of interest, rather than some hypothetical latent construct
    (as EFA). This makes PCA similar to multiple regression in some ways, in that
    it seeks to create optimized weighted linear combinations of variables.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Figure 1.1 Conceptual overview of principal components analysis


    ![](img/29951003f0d11c9d825feb73bff9c8e6_15_0.png)


    An example of a PCA model to extract two factors is presented in Figure 1.1 on
    page 3. We have already conducted some initial analyses (to be discussed in Chapter
    3) that have convinced us of this two-component structure and led us to this model.
    Notice that all PCA and EFA analyses extract as many components or factors as
    there are manifest variables, although not all are retained for interpretation;
    here we simplify for clarity to examine the results of two components extracted
    and see how they relate to the manifest variables. The most important thing to
    note in this figure is the direction of the arrows. Notice that they point from
    the variables to the components. This is because each component is formed as a
    *weighted linear combination* ¹ of the predictor variables. One-hundred percent
    of what is in those variables ends up becoming the components. As analysts, we
    can then identify the primary component variable loads on to create scales, we
    can create component scores, or we can whatever we would like with the results;
    the components themselves are completely defined by the variables. In this way,
    principal components combine manifest (observed) variables into components.


    Exploratory factor analysis, on the other hand, is a group of extraction and rotation
    techniques that are all designed to model unobserved or latent constructs. It
    is referred to as common factor analysis or exploratory factor analysis. EFA assumes
    and asserts that there are latent variables that give rise to the manifest (observed)
    variables, and the calculations and results are interpreted very differently in
    light of this assumption.


    +   ¹ Weighted linear combinations mean that each variable has a different weight:
    the factor/component loading determines how much or little each variable contributes
    to the component. This is similar to multiple regression where a variable score
    is composed of different amounts (regression weights) of each variable in the
    equation.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 1 / Introduction to Exploratory Factor Analysis


    You can see this very different conceptual vision of the same two-factor model
    reviewed above in Figure 1.2 on page 4 below. Notice the changed direction of
    the arrow between the variables and factors as the addition of error terms for
    each variable. Factor analysis recognizes model variance contains both shared
    and unique variance across variables. EFA examines only the shared variance from
    the model each time a factor is created, while allowing the unique variance and
    error variance to remain in the model. When the factors are uncorrelated and communalities
    are normal, PCA can produce inflated values of variance accounted for weighted
    linear combinations of the components (Gorsuch, 1997; McArdle, 1990). Since factor
    analysis analyzes only shared variance, factor analysis should yield the same
    general solution (all other things being equal) while also avoiding the illegitimate
    inflation of variance estimates.


    **Figure 1.2** Conceptual overview of exploratory factor analysis


    ![](img/29951003f0d11c9d825feb73bff9c8e6_16_0.png)


    There are other issues with PCA that we will briefly note. First, PCA assumes
    that all variables are measured without error (an untenable assumption in almost
    any discipline), EFA offers the option of acknowledging less than perfect reliability.
    Second, PCA parameters are selected in an attempt to reproduce sample, rather
    than population, characteristics (Thompson, 2004).


    Thus, we have many similarities between PCA and some important conceptual and
    mathematical differences. Most authors agree that there is little compelling reason
    to choose PCA over other extraction methods, and that PCA can be limited and biased
    parameter estimates. Such a list of authors would include Bentley & Kano, 1990;
    Floyd & Widaman, 1995; Ford, MacCallum, & Tait, 1986; Gorsuch, 1990; Loehlin,
    1990; MacCallum & Tucker, 1991; Mulaik, 1990; Widaman, 1993. If one is to see
    best practices, one is hard to preclude PCA as ever a best practice. Widman (1993)
    puts it very bluntly:'
  merge: -1
