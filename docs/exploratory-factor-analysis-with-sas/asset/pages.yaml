    The individual case that is an outlier (the subset of the first) is trickier to
    identify in EFA. Visual examination of the data can help identify patterns for
    review and potential elimination (like the participant who answers “3” to every
    item). Other patterns, like random responding or motivated responding, are more
    difficult to identify. These patterns can be classified into response sets that
    individuals use to filter their true belief or response. Each is associated with
    a different motive and outcome, and some might be detected. We discuss these response
    sets and the challenges associated with them in the following section.


    # Response Sets and Unexpected Patterns in the Data


    Response sets¹(such as random responding) are strategies that individuals use
    (consciously or otherwise) when responding to educational or psychological tests
    or scales. Response sets range on a continuum of unbiased retrieval (where individuals
    use direct, unbiased recall of factual information in memory to answer questions)
    to generative strategies (where individuals create responses not based on recall
    of memory; inability or unwillingness to produce relevant information from memory;
    see Meier, 1994, p. 43). Response sets have been discussed in the measurement
    and research methodology literature for seventy years (now Cronbach, 1942; Goodfellow,
    1940; Lorge, 1937), and some response sets are ubiquitous, found in almost every
    population on almost type of test or assessment. In fact, early researchers identified
    response sets on assessments as diverse as the Strong Interest Inventory (1927);
    tests of clerical aptitude, word meaning, temperament, and; spelling; and judgments
    of proportion in color scales, seashore pitch, and pleasantness of stimuli. (See
    in Cronbach, 1950, Table 1.)


    Response sets can be damaging to factor analysis and to the quality of measurement
    in research. Much of the research we as scientists perform rely upon the goodwill
    of research participants (students, teachers, participants in organizational interventions,
    minimally compensated volunteers, etc.) with little incentive to expend providing
    data to researchers. If we are not careful, participants with lower motivation
    to perform at their maximum level might increase the error variance in our data,
    making real effects of our research. In the context of this book, random and motivated
    responding can have deleterious effects such as masking a clear structure or attenuating
    factor loadings and communities.


