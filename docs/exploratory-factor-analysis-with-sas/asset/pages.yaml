    **Step 5: Interpreting results.** Remember that the goal of exploratory factor
    analysis is to explore whether your data fits a model that makes sense. Ideally,
    you have a conceptual or theoretical framework for the analysis—a theory of literature
    generating the development of an instrument, for example. If you do not, the results
    should be sensible in some way. You should be able to construct a simple narrative
    describing each factor, and its constituent variables, makes sense and is easily
    labeled. It is easy to get EFA to produce results. It is much harder to get sensible
    results. As such, it should not be used, by many


    Note also that EFA is an *exploratory* technique. Researchers do, in an attempt
    to *confirm hypotheses* or test competing models. What is *confirmatory factor
    analysis* is for It is a misapplication of EFA to use in this way, and we need
    to be careful to avoid confirmatory language when describing the results of an
    exploratory factor analysis.


    If your results do not make sense, it might be useful to return to an earlier
    step. Perhaps if you extract a different number of factors, the factors or solution
    will make sense. This is why it is an exploratory technique.


    **Step 6: Replication of results.** One of the hallmarks of science is *replicability*,
    the ability for other individuals, using the same materials or methods, to come
    to the same conclusions. We have not historically placed much emphasis on replication
    in the social sciences, but EFA is a slippery technique, and the results are often
    not clear. Clear results from subsequent chapters, EFA are not do replicate exactly,
    even within an extremely similar data set. Thus, in our mind, this step is critical.
    If your analysis does not replicate (or do not reflect the true nature of the
    variables in the "real world"), then should anyone else care about them? Providing
    evidence that your factor structure is likely to replicate (or through another
    EFA or CFA) makes your findings stronger and more relevant. In Chapter 6, we will
    explore a “traditional” method of *replication*¹ (similar to cross-validation
    in regression models). In Chapter 7, we will play with the notion of applying
    a less traditional but perhaps useful analysis using bootstrap analysis. Confirmatory
    factor analysis is outside the scope of this book, but is perhaps an even better
    method of replication.


