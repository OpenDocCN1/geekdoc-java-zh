    # Dealing with Missing Data


    Regression and multiple imputation have emerged as two more progressive methods
    of dealing with missing data, particularly in cases like factor analysis where
    there are other closely correlated variables with valid data. Regression imputation
    (also referred to as imputation) creates a regression equation to predict missing
    values based on variables with valid data. Each missing value is replaced, analysis
    can continue. A popular type of regression imputation used in factor analysis
    is the expectation-maximization (EM) algorithm. This algorithm uses an iterative
    likelihood procedure to identify the best estimates for each missing value. The
    EM algorithm is available via the MI procedure in SAS (SAS Institute Inc., 2015).
    We will review an example of this procedure in the next section. The EM algorithm,
    along with other forms of regression imputation, has been shown to be superior
    to mean substitution or case analysis, particularly when data is missing completely
    at random (Graham, 2009).


    Multiple imputation takes the concept of an imputation step by providing estimates
    for each missing value—e.g., EM/maximum likelihood estimation, propensity score
    estimation, or Markov chain Monte Carlo (MCMC) simulation—are used to provide
    the estimates and create multiple versions of the same data set (sort of a statistician''s
    view of the classic science fiction scenario of alternate realities or parallel
    universes). These parallel data sets can be analyzed via standard methods and
    results combined to produce previously mentioned methods of dealing with missing
    values (Schafer, 1997, 1999). However, little attention has been given to combine
    the results from imputed data sets. Because most factor models do not include
    readily available estimates of standard error, PROC MIANALYZE are not available.
    Researchers have recommended many alternatives, including averaging component
    loads after correcting for the alignment problem (reviewed in Chapter 7), constructing
    analysis on the variance or covariance matrix produced by imputed data sets, or
    using a generalized Procrustes analysis to pool loadings (Ginkel & Kroonenberg,
    2014).


    Since the goal of EFA is primarily exploration, it is important to simply recognize
    the role of missing data. We do not believe that the more complex imputation methods
    are necessary in the context of EFA—especially because they can be programmatically
    challenging! Instead, explore your data and try to understand the impact of any
    missingness. If you have concerns about missing data, try using a regression imputation
    method.'
  merge: -1
