    **Proper versus factor scores.** Researchers must decide whether they will use
    all of the variables to compose a factor score (proper factor score) or just the
    variables that compose a particular factor (i.e., measured variables with the
    highest factor loadings on a particular factor). Proper factor scores take account
    *all variables* in the analysis, not just the ones that are considered to be part
    of a factor. Scores automatically produced by SAS (using the *OUT* option) are
    proper factor scores. So, referring to Table 9.1 on page 163, a proper factor
    score for the first factor (using either set of coefficients) would include both
    the engineering problem-solving and identification variables. Of course, these
    second loadings are relatively small and so, would contribute little to the little.
    An improper score would include only variables considered to be part of the factor
    (e.g., EngProdSolv1–EngProdSolv8 would be used to compute the factor 1 score).
    In practice, these two types of factor scores are generally well correlated; yet
    in our opinion, both types are equally flawed


