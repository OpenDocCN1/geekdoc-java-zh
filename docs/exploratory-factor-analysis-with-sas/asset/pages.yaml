  md: '36 Chapter 3 / Factor Extraction Criteria


    **Which method?** Although we can understand the value of parallel analysis or
    MAP analysis for deciding how many factors to extract, we have to remember mantra:
    EFA is an exploratory technique. No criterion is perfect, and unless you are missing
    EFA in a confirmatory fashion, it seems to me worrying over a slightly better
    extraction criterion might be missing the point. The point is to get a reasonable
    model within a representative sample (that is sufficiently large to ensure a reasonable
    solution), and then move into inferential statistics valid in confirmatory factor
    analysis. EFA is merely a first stopping point on the journey, and researchers
    who miss this point of the process. Thus, use theory along with parallel analysis
    or MAP analysis or any of the classic criteria that suit you and are defensible.
    The goal of creating theory-driven, conceptually understandable solutions needs
    to prevail. And never forget that your journey is not done until you confirm the
    results of the EFA with different data in the context of CFA.


    # # Example Syntax and Output


    **Theory.** The first criterion summarized above is unfortunately not something
    that SAS can help you with. It requires combining the literature to better understand
    the theoretical constructs that underlie your set of items. The literature may
    identify one structure (e.g., a two-factor model) or multiple structures (e.g.,
    a two-factor model under one framework and a five-factor model under another).
    It is your job to understand these models and then test them with your data.


    If we think back to the engineering data we used in Chapter 2, the scale was used
    to evaluate two factors: engineering problem-solving and interest in engineering.
    We could do some research to see if anyone has ever used this set of items or
    a similar to evaluate a different set of constructs. If we did not find anything
    else in the literature, however would tell us this data contains factors.


    **Kaiser Criterion, scree plot, minimum eigenvalue, and proportion of variance.**
    The next four criteria are relatively easy to use and evaluate in SAS. As we discussed
    in Chapter 2, the various eigenvalue estimates are automatically produced by the
    FACTOR procedure. However, the scree plot is not automatically output. We can
    request it by adding the SCREE option to the FACTOR statement or by requesting
    it through the ODS graphics system. In general, the Output Delivery System (ODS)
    offers prettier graphics, so that is our preferred choice, but we will show you
    both.


    Using the engineering data, we can examine these three criteria with the syntax
