    **Second-order factor analysis.** In order to conduct a second-order factor analysis,
    we will need to output our correlation matrix from our first-order analysis and
    read it as the source of data for our second-order analysis. The code to this
    is presented below. We use ODS to output a data set of inter-factor correlations
    from our first-order analysis. We also specify the type of this data set by including
    `type=corr` in parentheses after the data name. Setting the type allows `PROC
    FACTOR` to recognize this data as a correlation matrix and not a raw data set.
    We then input this data directly into the `FACTOR` procedure and perform our second-order
    analysis. Since we are inputting a correlation matrix and not a raw data set,
    we must also specify the number of observations in our data set using the `NOBS`
    option.


    ```

    *First-order analysis;

    ods output InterFactorCorr=first_order_corr(type=corr);

    proc factor data = engdata nfactors = 3 method = print priors = SMC

    rotate = OBLIMIN;

    var EngProb: INTERESTeng: BELONGeng;

    ```


    ```

    *Second-order analysis;

    proc factor data = first_order_corr nobs=372 nfactors=1 method = print

    priors = SMC;

    var Factor1 Factor2 Factor3;

    ```


    Using the above syntax, the correlation matrix was analyzed via EFA to determine
    whether it might be reasonable to assume a second-order factor that incorporates
    all three first-order factors (keep in mind our concerns about performing this
    analysis at all...). Again, we used iterated PAF extraction and would have used
    direct oblique rotation (authors such as Thompson recommend using oblique rotations
