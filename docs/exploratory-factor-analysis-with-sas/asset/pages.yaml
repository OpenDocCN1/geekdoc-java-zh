  md: '# Summary and Conclusions


    +   - Best Practices for EFA 2007

    - References 2009


    # Best Practices for EFA


    This journey started over a decade ago when one of the first author''s students
    (Blandy Costello) walked into his office and shared her frustration over conflicting
    advice and directives from different doctoral committee members. That initial
    discussion highlighted the lack of consensus on best practices related to exploratory
    factor analysis, and ended with us deciding there were empirical ways to explore
    best practices. After many simulations and further discussions, two articles were
    published related to these issues: Osborne & Costello (2004) and Costello & Osborne
    (2005). Both have received significant attention in the literature, and the latter
    has been cited about 3600 times as we write this. Obviously, we recognized that
    there is some utility in employing to elicit best practices in quantitative methods,
    and that has led to other articles, books, and to project.


    EFA is such a confounding, controversial, and misused (yet valuable and interesting)
    technique that it has provided lots of fun and fodder for this type of endeavour.
    We hope you has been worthwhile. Our goal is to collect and elaborate on evidence-based
    best practices that were published previously, to put them in a single place that
    is easily accessible, and to model how to implement them within SAS. For those
    of you who have persevered and reached this part of the book, we hope that you
    have drawn the following conclusions:


    +   Keep the "E" in EFA Many researchers have attempted to perform "confiratory"
    analyses through exploratory analyses. Many researchers use confirmatory language
    and draw confirmatory conclusions after performing exploratory analyses. This
    is not appropriate. EFA is a fun and important technique, but we need to use confirmatory
    techniques (e.g., CFA) when we desire to draw those types of conclusions.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 208 Chapter 12 / Summary and Conclusions


    EFA is a large-sample technique. We hope that through the course of the book you
    have become convinced the best results from EFA come when the sample is appropriately
    large. There are examples in this book and elsewhere in the literature of the
    volatile and nonrepresentative results that can happen in small-sample EFA. A
    reasonable rule of thumb, if one is intent on robust analyses, would would be
    a minimum of 20 cases for each variable in the analysis. We have had students
    and colleagues show us analyses that fewer cases than variables. That is rarely
    a good state of affairs, in our opinion.


    Clean your data, and deal with missing data appropriately. Garbage in, garbage
    out. We won''t believe this point —but we hope you are wise. If we don''t address
    whether you checked your data, tested assumptions, and dealt appropriately with
    missing data, we might wonder anything else you reports.


    Useful results are those that are precise and generalizable. In our mind, the
    most useful results are those that we can generalize to other samples, or to draw
    good inferences about the population as a whole. Likewise, the worst of anyone''s
    time is to publish or present results that are not replicable, or so imprecise
    that we cannot draw any conclusions. Large samples and clean data (in addition
    to strong factor loadings and larger numbers of strongly loadings per factor)
    contribute to this mission. Small samples and weak loadings (and few variables
    per factor) make for messy, conflicting, and useless results.


    Principal components analysis is not exploratory factor analysis. We have seen
    endless debate amongst a small number of participants regarding PCA vs EFA. Also
    nobody else seems to care about this data, rather for whether they can trust their
    results and interpret them personally. If you feel some compelling reason to use
    PCA (and we do not see one at present), then we hope this book can guide you as
    well. Most of the best practices we have covered in this book also apply to PCA.
    If you insist on using PCA, at least do it with large samples, clean data, and
    with the limitations of the procedure clearly and overtly admitted.


    If you use EFA, don''t use the defaults! If you want to consider yourself to modeling
    and exploring latent variables in the best possible way, you want to use ML, iterated
    PAF, or ULS extraction (depending on whether your data meets the demands of ML),
    and we think you want use oblique rotation methodologies (either obimin or Promax)
    to work in most cases—if one doesn''t, try the other). Scholars in this area spend
    much energy arguing about which extraction or rotation technique is best. But
    keep our mantra in mind—this is an exploration. Thus, it should be considered
    a lowstakes endeavor. Whatever you find from EFA subsequently be confirmed in
    a large sample confirmatory analysis.


    Use multiple decision when deciding how many factors to extract. Another point
    of constant argument in this field seems what decision rule is best in guiding
    someone on how many factors to extract. We reviewed several, and none are perfect.
    Just in our three examples, one had a clearly uninterpretable plot, parallel analysis
    produced what we consider to be questionable data, and one MAP analysis was clearly
    (to our eye, anyway) ambiguous and unhelpful. The other criteria were also at
    times confusing and problematic. The best guide is theory, and beyond that, choose'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'whatever provides the results that make the most sense. If you cannot make
    sense of the results—in other words, if you cannot easily explain to someone what
    factor means—then you need to go back to exploring. Because any model that you
    have to produce is confirmed with CFA in the context of a new sample, this seems
    to us the most sensible approach. Thanks to Brian O’Connor, we have easily accessible
    ways of trying out modern decision techniques (MAP, parallel analysis). Use them,
    but realize that no one decision rule will be perfect in all situations.


    Replicate results. If you have two samples, you can present representation statistics
    like those we reviewed in Chapter 5, or you can put a single sample to work in
    bootstrap analysis, like those we reviewed in Chapter 6. It''s not easy, nor is
    automatic, but with the syntax and macros we share, it is not too difficult. And
    we think that it provides invaluable perspective on your results. We wish to mandate
    replicate would permeate every research lab and statistics class, regardless of
    what statistical techniques they use. The lessons that are contained in these
    chapters are equally valid if you are performing ANOVA or regression analyses,
    hierarchical modeling, and nonparametric techniques. Replicate your results, bootstrap
    your analyses, and report (and interpret) confidence intervals for important effects
    so we, and get more out of the hard work that you put into it.


    Have fun! The ability to perform research is a wonderful gift. The first author
    has been lucky enough to spend the last 25 years doing quantitative research,
    and the second author is at the beginning of her journey, but we have enjoyed
    every minute of it. Those of us perform data analysis are the ones who are present
    at the moment each bit of knowledge is created. We create knowledge—we ask questions
    and find answers. Sometimes these answers are not what we expect, which is an
    opportunity to ask better questions or learn something unexpected. We think of
    no more rewarding way to support our career, and we hope each one of you experiences
    the joy and thrill from your research.


    Thank you for taking time to read our work. We always welcome feedback or communication
    from readers. The best way to reach us is through email at: jwasborne@gmail.com.
    We hope you find the ancillary materials on the book website (http://jwasborne.com
    or http://support.sas.com/publishing/authors) useful. Happy researching!


    # References


    Costello, A. B., & Osborne, J. W. (2005). Best Practices in Exploratory Factor
    Analysis: Four recommendations for getting the most from your analysis. Practical
    Assessment, Research, and Evaluation, 10(7), 1-9.


    +   1. Our respected colleagues who perform qualitative research are included
    in this generalization here. What we find so compelling is the process of analyzing
    data, not the mode of analysis.'
