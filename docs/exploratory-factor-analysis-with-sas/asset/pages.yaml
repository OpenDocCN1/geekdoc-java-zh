    # Why Is Sample Size Important?


    Larger samples are better than smaller samples (all other things being equal)
    because larger samples tend to minimize the probability of errors, maximize the
    accuracy of population estimates, and increase the generalizability of the results.
    Unfortunately, there are few size guidelines for researchers using EFA or PCA,
    and many of these have minimal empirical evidence (e.g., Guadagnoli & Velicer,
    1988).


    This problematic because statistical procedures that create optimized linear combinations
    of variables (e.g., multiple regression, canonical correlation, and EFA) tend
    to "overfit" the data. Means these procedures optimize the fit of the model to
    the given data; yet no sample is perfectly reflective of the population. Thus,
    this overfitting to one data set are applied to others. In multiple regression
    this manifests as inflated $R^2$ (shrinkage) and misestimated variable regression
    coefficients (Cohen, Cohen, West, & Aiken, 2003, pp. 83-84). In EFA this "overfitting"
    can result in'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# 84 Chapter 5 / Sample Size Matters


    erroneous conclusions in several ways, including the extraction of erroneous factors
    or misassignment of items to factors (e.g., Tabachnick & Fidell, 2001, p. 588).


    # Published Guidelines


    In multiple regression texts, some authors (e.g., Pedhazar, 1997, p. 207) suggest
    to variable ratios of 15:1 or 30:1 when generalization is critical. But there
    are explicit guidelines such as this EFA (Baggalley, 1983). Two approaches have
    been taken: suggesting a minimum total sample size, or examining the ratio of
    parameters such as subjects to variables, in multiple regression.


    Comfrey and Lee (1992) suggest that "the adequacy of sample size might be evaluated
    roughly on the scale: 50 – very poor; 100 – poor; 200 – fair; 300 – good; 500
    – very good; 1000 – excellent” (Guagnoli & Velicker (1988) review several studies
    that conclude that absolute minimum sample sizes, rather than subject to item
    ratios, are more relevant. These range in their recommendations from an N of 50
    (Barrett & Kline, 1981) to 400 (Aleamoni, 1976). In our mind, some of these recommendations
    are ridiculous, as they could result in estimating more parameters than available
    subjects.


    **The case for ratios.** There are scholars writing from the multiple regression
    camp who argue that total N is a superior guideline to the ratio of subjects to
    variables. Yet, authors focusing on EFA vehemently defend this position. It is
    interesting precisely because the general goal for both analyses is similar: to
    take individual variables and create optimally weighted linear components that
    generalize to other samples or the population. Although the mathematics and procedures
    differ in the details, the essence and pitfalls are the same. EFA and multiple
    regression overfitting of the estimates to the data (Bobio & Schemmer, 1984),
    and both suffer from of generalizability when sample size is too small.


    Absolute sample sizes simplistic given the complexity of factor analysis can exhaust
    the number of factors or components, the number of items on each factor, the magnitude
    of the item to factor correlations, and the correlation between factors, for example.
    This has led some authors to focus on the ratio of subjects to items or, more
    recently, the ratio of subjects to parameters (as each item will have a loading
    for each factor or component extracted). This is similar to what we do with regression,
    rather than absolute sample size, when discussing concerning EFA.


    Gorsuch (1983, p. 332) and Hatcher (1994, p. 73) recommend a minimum sample size
    ratio of at least 5:1 in EFA, but they also describe stringent guidelines for
    when this ratio is acceptable, and both note that higher ratios are generally
    better. There is a widely cited rule of thumb from Nunnally (1978, p. 421) that
    the sample size to item ratio for factor analysis should be at least 10:1, but
    that recommendation was not supported by empirical research. Authors such as Stevens
    (2002) have provided recommendations ranging from 5 to 20 participants per scale
    item, by Jökog & Sörbom (1996) encouraging at least 10 participants per parameter
    estimated.'
