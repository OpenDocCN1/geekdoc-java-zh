  md: '# Steps to Follow When Conducting EFA


    “principal components analysis should not be used if a researcher wishes to obtain
    parameters reflecting latent constructs or factors.” (p. 263). Unfortunately,
    it is the default dimension reduction procedure in much statistical analysis software,
    even when it is usually not (in our opinion) the conceptually desirable choice,
    and usually has no clear advantage in modern methodology that we can detect.


    This is a topic that arouses passions among statisticians, and the first author
    has published a paper or given a talk on this topic without someone getting upset
    for taking this position so clearly and unapologetically. So let us dissect this
    issue for the moment and summarize: PCA is not considered a factor analytic technique,
    and there is disagreement among statisticians about when it should be used, if
    at all. More often than not, researchers use PCA when EFA would be appropriate
    and preferable (for example, see Ford et al., 1986; Gorsuch, 1983; Wideman, 1993).


    # Steps to Follow When Conducting EFA


    Exploratory factor analysis is meant to be exploratory in nature, and thus it
    is not desirable to prescribe a rigid formula or process for executing an EFA.
    The steps below are meant to be a loose guide, understanding that a factor analysis
    often requires returning to previous steps and trying other approaches to ensure
    the best outcome. The general pattern of performing an EFA falls into six general
    steps that will guide the discussion through the rest of the book:


    +   1 Data cleaning


    +   2 Deciding on an extraction method to use


    +   3 Deciding how many factors to retain


    +   4 Deciding on a method of rotation (if desired)


    +   5 Interpreting results (return to #3 if a solution is not ideal)


    +   6 Replication or evaluation of robustness (return to the beginning if a solution
    is not replicable or robust)


    **Step 1: Data cleaning.** Without clean data, what follows in almost any analysis
    is moot. This is another point where passions run high among researchers and statisticians
    because there is considerable controversy about any manipulations of the sample
    and data (e.g., to treat outliers, missing data). We have a clear position on
    the issue—data should be cleaned and issues (e.g., failing to meeting assumptions)
    should be addressed. The first author has written an entire book on the topic,
    which he demonstrated repeatedly how clean data produces results that are better
    estimates of population parameters and, more accurate, and more replicable (Osborne,
    2013). Instead of debating the point here, let me assert that data that is filled
    with errors or fails to meet assumptions of the analysis being performed is likely
    to lead to poorer outcomes than data that is free of egregious errors and meets'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 1 / Introduction to Exploratory Factor Analysis


    assumptions. We will discuss some other data quality issues later in the book,
    including the importance of dealing appropriately with missing data.


    **Step 2: Deciding on an extraction method.** An extraction technique is one of
    a group of methods that examines the correlation/covariance between all the variables
    and seeks to "extract" the latent variables from the measured/manifest variables.


    There are several factor analysis extraction methods to choose from. SAS has several
    EFA extraction methods: unweighted least squares (ULS), maximum likelihood (ML),
    principal axis factoring (PAF), iterated principal axis factoring (iterated PAF),
    alpha factoring, importance factoring, and Harris factoring.¹Information about
    the relative strengths and weaknesses of these techniques is not easy to obtain.
    To complicate matters further, naming conventions for some extraction techniques
    are not consistent, leaving it to figure out which method a textbook or journal
    article is describing, and whether or is not available in the software the researcher
    is using. This explains the popularity of principal components analysis - not
    only is it the default in many statistical software, but it is one of the most
    consistent names researchers will see.


    An article by Fabrig, Wegener, MacCallum and Strahan (1999) argued that if data
    is relatively normally distributed, maximum likelihood is the best choice because
    "it allows for the computation of a wide range of indices of the goodness of fit
    of the model [and] permits statistical significance testing of factor loadings
    and correlations among factors and the computation of confidence intervals." (p.
    277). If the assumption of multivariate normality "severely violated" they recommend
    iterated PAF or ULS factoring (Fabrigar et al., 1999; Nunnally & Bernstein, 1994).
    Others have argued that in specialized cases, or for particular applications,
    other extraction techniques (e.g., alpha extraction) are most appropriate, although
    the benefit of advantage is slim. In general, ML, iterated PAF, or ULS will give
    you the best results, depending on whether your data is generally normally distributed
    or significantly non-normal. In Chapter 2, we will compare outcomes between the
    various factor extraction techniques.


    **Step 3: Deciding how many factors to retain.** This too, is an issue that suffers
    from anachronistic ideas and software defaults that are not ideal (or even defensible).
    In this step, you (or the software) decide how many factors you are going to keep
    for analysis. Statistical software will initially extract as many factors as there
    are variables (i., if you have 10 items in a sample, your software will extract
    10 factors) in order to account for 100% of the variance. However, most of them
    will be meaningless. Remembering the goal of EFA is to explore your data and reduce
    the number of variables being dealt with. There are several ways of approaching
    the decision of how many factors to extract and focus extracted factors should
    make conceptual and theoretical sense, and be empirically defensible. We will
    provide guidelines for this later in Chapter 3.


    **Step 4: Deciding on a rotation method and rotating the factors.** Rotation is
    often a source of confusion. What exactly is rotation and what is happening when
    data is rotated? In brief, the goal is to clarify the factor structure and make
    the results of your EFA most interpretable. There are several rotation methods,
    falling into two general groups: orthogonal rotations and oblique rotations. Orthogonal
    rotations keep axes at 90° angle,


    ¹ Please note, there is one other extraction method, principal components analysis.
    There are also two additional extraction options to recognize and perform analyses
