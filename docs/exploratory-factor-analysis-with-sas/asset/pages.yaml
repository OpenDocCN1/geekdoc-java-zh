    # Confidence Intervals for Alpha


    Fan & Thompson (2001) point out that few authors provide context in their papers
    as to the precision of their effect size point estimates. As we saw in the previous
    example, the precision of alpha can vary dramatically. Small samples or biased
    samples can greatly affect the alpha estimate. Thus, context about precision could
    greatly inform researchers about the'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'quality of their results and the likelihood of replication. Confidence intervals
    are one way of providing information about precision. As we briefly discussed
    earlier in the chapter, we have been attempts to construct Cls for alpha, but
    these have not gained traction in routine practice. However, with bootstrapping,
    we can easily provide empirical estimates that are valuable for readers.


    You might remember that the GDS gave us some problems when attempting to perform
    EFA, as it was unclear whether it was a single factor or multiple factors. Let
    us assume that we decided it a single factor (remember that alpha is not a test
    of unidirectionality!). We can then calculate the coefficient alpha for the variables
    using the syntax below.


    ```

    proc corr data=marshdata alpha;

    var GDS;

    run;

    ```


    The coefficient alpha and item-total correlations produced by the syntax are presented
    in Figure 11.5 on page 198. Since we input the raw data and not standardized versions
    of our variables, we will interpret the raw coefficients. This provides us with
    an alpha estimate of 0.885 and a large range of item-total correlations, from
    0.252 to 0.615. Some of these correlations are on the lower side, and it might
    be worthwhile to review the associated items to determine whether the content
    they capture is relevant to the construct of interest and whether they should
    be retained in the scale. Interestingly, none of the revised alphas (in the column
    labeled Alpha (α = 0.885)) indicates that the overall scale reliability would
    decrease if any items were removed. However, the revised alphas are only .001
    to .08 the scale alpha. Thus, removal of items would not affect the overall reliability
    very much. Together, these suggest that if these items are used as a single scale,
    some items could be deleted with loss of reliability of the measure.


    Although we would likely spend some time refining the above scale (e.g., removing
    or tweaking items) before doing anything with it, we will proceed with the current
    version to demonstrate the use of bootstrapped confidence intervals for a scale
    that is not stable. We will consider the results to be our “population” estimates
    and compare the results produced from our “population” subsamples of one to determine
    how confidence intervals might be. Using PROC SURVEYSELECT, we draw a random sample
    of N=50, N=100, and N=250 from the sample using simple random sampling. We then
    conducted 2000 bootstrap resamples from each and estimated 95% confidence intervals
    around the alphas and item-total correlations. (See Chapter 7 for more information
    about bootstrapping methods and syntax.)


    We know that this sample of N=656 is relatively small to consider its results
    close to our “population” estimates, but we will do so for the purpose of this
    example.'
