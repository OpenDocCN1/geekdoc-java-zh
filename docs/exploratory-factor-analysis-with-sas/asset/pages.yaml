- img_proc: true
  md: '**Eigenvalues.** Eigenvalues are a representation of the aggregated item-level
    variance associated with a factor. They can be viewed as a column statistic—again
    imagining a table of factor loadings. If you square each factor loading and sum
    them all in a column, you should get an approximation of the eigenvalue for that
    factor (again within rounding error). Thus, eigenvalues are higher when there
    are at least some variables with high factor loadings, and lower when there are
    mostly low loadings. You will notice that eigenvalues (and communities) change
    from initial statistics (which are estimates and should be identical regardless
    of extraction method) to extraction, which will vary depending on the mathematics
    of the extraction. The cumulative variance accounted by the extracted factors
    will not change (to be discussed), but the distribution of the variance will change
    with changing factor loadings during rotation. Thus, if the extracted eigenvalues
    account for a cumulative 45% of the variance overall, the cumulative variance
    accounted for will be 55% after the factors are rotated, but 45% might have a
    slightly different distribution across factors after rotation. This will become
    clearer in a little bit, as we look at some example data.


    **Iterations and convergence.** The majority of the methods described below rely
    on an iterative procedure to “converge” on a final solution. Convergence occurs
    when the change between one model''s communities and the next model''s is less
    than .01. This can essentially be interpreted to mean that the two models are
    yielding the same results. Although we have not yet come to a good reason to resolve
    the convergence criteria, if an EFA fails to “converge” means these coefficients
    failed to stabilize and continued changing dramatically. This is most commonly
    due to inappropriately small sample sizes. One potential solution to this problem
    is to increase the default number of iterations. The default number of iterations
    is 30 in PROC FACTOR and it can be reset with the MAXITER option.


    # Extraction Techniques


    Seven EFA extraction techniques are available in SAS. These methods span the range
    of options commonly used by researchers and include methods generally available
    in other common statistical software applications (e.g., SPSS, STATA). Each is
    further described below.


    **Principal axes factor (PAF) extraction** is a variation of PCA. This method
    replaces the diagonal elements of the matrix of associations (e.g., correlation
    or covariance matrix) with the initial communality estimates, or initial estimates
    of the shared variance. In PCA this substitution does not occur, permitting PCA
    to estimate components using all of the variance and not just the shared variance.
    When this substitution occurs, it acknowledges the realistic expectation of imperfect
    measurement and instead uses only the shared variance in the estimation. The final
    set of factors and community coefficients are estimated from the revised matrix
    of associations.


    +   1 Please note that alpha extraction and maximum likelihood extraction are
    weighted extraction methods. The unweighted initial estimates are identical but
    SAS presents only the weighted version of the initial estimates.'
