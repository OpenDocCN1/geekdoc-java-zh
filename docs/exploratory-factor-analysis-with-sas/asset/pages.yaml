  md: '# Application: Impact of Sample Size on Interpretation


    As we have demonstrated above, both sample size and subject to item ratio have
    an impact on the quality of your results. The larger the sample and subject to
    item ratio, the better. But if you have a smaller than desirable sample, your
    analysis might identify an incorrect factor structure, inaccurate classification
    of items, or unrepresentative factor loadings. Costello & Osborne (2005) examined
    the effect of sample size among the SDQ data. Now let''s review how differences
    in sample size could affect interpretation of the engineering and GDS data.


    We will start by running an EFA on the entire sample of data. We will use the
    extraction methods, and the rotation methods considered to be appropriate for
    this data based on the preceding chapters. Thus we will use PAF extraction and
    oblimin rotation for both data sets, and we will extract two factors from the
    engineering data and five from the GDS data.


    Next, we will use SELECT procedure to select a subset of the data to rerun our
    analysis. This procedure offers a variety of methods for selecting random samples.
    We will use the simple sampling without replacement (METHOD=SRS) for our purposes.
    In addition to the sampling method, we must also specify the number of observations
    to select (N), the input data (DATA), and the output data that will contain just
    our selected observations (OUT=). We will select reduced samples that represent
    subject to item ratios of 10:1 and 5:1. We will then rerun our EFA analysis, with
    all of the same settings as the previous run, on each reduced sample.


    The syntax to do this for the engineering data is presented below. Note also use
    the FUZZ and REORDER options to order items by magnitude and display only loadings
    above a certain magnitude.


    ```

    **Run initial model with all data:

    proc factor data = engadata nfactors = 2 method = print priors = SMC

    rotate = OBLIMIN fuzz=.3 reorder;

    Var EngProb: INTERESTENG;

    run;


    **Select subset from engineering data that meets 10:1 ratio and run;

    procselect data=engadata method=srs n=140 out=engadata_red1;

    run;

    proc factor data = engadata_red1 nfactors = 2 method = print

    priors = SMC rotate = OBLIMIN fuzz=.3 reorder;

    Var EngProb: INTERESTENG;

    run;

    ```'
