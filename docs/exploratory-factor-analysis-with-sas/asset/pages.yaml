    analysis is that these procedures are not widely implemented in most common statistical
    software, including SAS. Frankly, O’connor (2000) developed SAS syntax to perform
    these analyses. These can be currently downloaded from https://people.ok.ubc.ca/brioconnor/boconnor.html.
    In addition, a macro version of this syntax is included in the example code for
    this and is available from the book website.


    To run these analyses from the macros that are available from the book website,
    you need to include the macro syntax in your current SAS file using %INCLUDE statement.
    This loads the macro into your current session memory so that you can call macros
    from inside the external file. You can then run the analyses by calling the respective
    macro and entering the necessary arguments. The MAP macro has only one argument:
    `myfile`, the data set name. Thus, you can run the MAP macro from %map( datafile
    ). The parallel macro has more arguments: `myfile`, the data set name; `ndsets`,
    the number of random data sets'
