  md: '# Bootstrapped CI


    The syntax required to produce bootstrapped CI is a bit more complex than the
    code reviewed above it it can be used to produce CI under most conditions. The
    entire process can generally be accomplished with three SAS procedures (plus some
    specialty output and sorting). Each of these procedures corresponds with one of
    the three bootstrapping steps we reviewed above: 1) resampling, 2) replication,
    and 3) summarization.


    First, the SURVEYSELECT procedure is used to conduct our resampling. You were
    introduced to this procedure in the last chapter to create samples for internal
    replication. When this procedure is used for resampling, a few additional arguments
    are needed. An example of syntax to produce 2000 resamples of the engineering
    data is presented below.


    ```

    proc surveyselect data = engata method = URS samprate = 1 outhits

    nout = outbound_eng seed = 1 rep = 2000;

    run;

    ```


    As before, we use the DATA option to read in our data, the METHOD option to specify
    the type of sampling (in this case, unrestricted random sampling or random sampling
    with replacement), the OUT option to output our data, and the SEED option to specify
    a random seed so that the sampling can be replicated. The SAMPRATE option to identify
    the proportion of observations in our sample using the N option (as we did before),
    we use the SAMPRATE option to identify the observations to select each resample.
    By specifying SAMPRATE = 1 we are saying we want each resample to contain the
    same number of observations as our original sample. We are also including the
    OUTHITE option to make sure a is is in the output data set when the same observation
    is selected more than once. Finally, we include the REP option to specify the
    number of resamples we would like to conduct. This procedure will output a single
    data set (e.g., outbound_eng) that will contain each of the resamples. The different
    resamples can be identified by a number in a variable entitled "replicate". Figure
    7.2 on page 120 displays an excerpt of the output data set, outbound_eng.'
