- img_proc: true
  md: '# Methods within a Camp


    We know that choosing between the orthogonal and oblique rotation cams can make
    a difference in the final results; But how important is the decision the specific
    method after you have chosen your camp? Out of the orthogonal methods, varimax
    rotation is the most commonly used, and it is the default in many programs. One
    might conclude it is the orthogonal method of choice. Of the orthogonal methods,
    promax rotation is recommended as the most desirable rotation method (Thompson,
    2004). Let''s test whether the recommended methods produce different results from
    their alternatives.


    The SDQ contains three scales (parent relations, mathematics, and English) that
    are minimally correlated (r=0.15, 0.22, 0.26). Since the theoretical factors are
    correlated, we should use an oblique rotation method. The two oblique methods
    used in this chapter are promax rotation and direct oblimin rotation. The syntax
    to run these analyses is presented below. We use maximum likelihood extraction
    since the method seemed appropriate for this data (See Chapter 2).


    ```

    proc factor data = sqdata nfactors = 3 method = ml rotate = PROMAX;

    VAR Math: Par= Eng;

    proc factor data = sqdata nfactors = 3 method = ml rotate = OBLIMIN;

    VAR Math: Par= Eng;

    ```


    Table 4.2 on page 73 and Table 4.1 on page 73 display the factor loadings for
    each of these rotation methods and Table 4.3 on page 74 display the factor correlations.
    Both oblique rotation methods yield similar results. As expected, the initial
    unrotated factor loadings for each method are identical. These should be identical
    because they represent the distribution of the unique variance of the factor loadings
    before the factors are rotated. The initial factor loadings would be very difficult
    to interpret as the loadings for a variable to be of moderate size across all
    of the factors. The rotated factor loadings, in both the pattern matrix and structure
    matrix, are nearly identical. These solutions are what we would expect given the
    theoretical model that the scale was developed. The final rotated solutions give
    us a clear, theoretically consistent structure with subscale items aligning as
    expected.


    In this example, the

    In this example, the type of oblique rotation used did not make a difference.
    They resulted in the same clear factor structures and only minor differences in
    loadings. Many others (for example, Gorsuch, 1983; Kim & Mueller, 1978) have drawn
    similar conclusions. The methods within the orthogonal and oblique cams tend to
    produce similar results.'
  merge: -1
  pgno: 84
