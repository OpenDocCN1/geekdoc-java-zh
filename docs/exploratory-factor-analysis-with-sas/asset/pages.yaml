  md: '# Summary


    Data quality is a continual issue in almost all sciences. In EFA, as in most other
    quantitative analyses, data quality issues can bias or completely derail your
    analyses. Thus, we encourage you to closely examine all data prior to analysis
    for extreme cases, random, or other types of motivated misresponding, and to deal
    with missing data effectively.


    # Exercises


    +   1. Examine the GDS data for the two types of outliers. Conduct frequency distributions
    of the variables (they should be all 0 or 1) and visually scan the data for specific
    response patterns that might be problematic (e.g., all 0 or 1). Conduct an EFA
    using ULS extraction and direct oblivion rotation, extracting five variables.
    Determine whether there are variables that might be outliers.


    +   2. Replicate our analysis to impute missing data for a subsample of the SDQ.
    Use the syntax presented at the bottom of this section to select the subsample
    of N=300 and generate a nonparametric missing sample by changing all responses
    of 6 on Eng1 to missing. Use the code presented in the chapter to impute the missing
    data and run the EFA from the covariance matrix, using ULS extraction and direct
    oblivion rotation.


    +   3. Impute missing data for the GDS data set, using a similar process as we
    used for the subsample of SDQ data. Conduct an EFA on the original data and the
    imputed version of data using ULS extraction and direct oblivion rotation, this
    time extracting three variables. Compare the results from the model with imputed
    data to those without data imputed. Is there a difference in the results? Why
    or why not?


    Syntax for exercise 2 above:


    ```

    *Replicate the selection of the 300;

    proc surveyselect data=sdqdata method=srs n=300 out=sdqdata_ssl

    seed=39302;

    run;

    *Generate nonparametric missing sample;

    data nonparametric_miss;

    set sdqdata_ssl;

    if Engl=6 then Engl=.;nrun;

    ```'
