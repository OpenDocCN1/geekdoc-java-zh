    # How Does Bootstrap Resampling Fit into EFA?


    As we learned in Chapter 5, sample size can greatly affect the results of an EFA.
    Small samples can lead to the identification of incorrect factor structures and
    item loadings (both direction and magnitude). They also limit our ability to check
    the replicability of our results through internal replication. (See Chapter 6.)
    Thus, small samples can affect your results and limit your ability to discern
    how they might affect them!'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# 114 Chapter 7 / Bootstrap Applications


    Now the best solution to the small sample dilemma is to get more data. More subjects
    or observations can be added to a sample to improve the potential replicability
    of the results. However, if this is not a possibility (we all have limited resources
    and funds!), an alternative solution is to explore the replicability of the results
    through bootstrap resampling techniques. Bootstrap resampling is a subsampling
    and averaging procedure that can be used to produce confidence intervals for all
    of the statistics that we choose. We can generate confidence intervals (CIs) around
    eigenvalues, communities, factor loadings, and more. These CIs can inform us about
    the precision of each estimate and the range in the estimates that we see see
    other samples. This information provides another means through which to examine
    the replicability of our results.


    The benefits of bootstrap resampling are not limited to small samples. If we consider
    what bootstrap resampling can tell us—the potential error in our estimates and
    generalizability to other samples—we can quickly gain the benefit of this practice
    to any analysis. Although it is true that large samples are more likely to yield
    replicable results, this hypothesis can be tested through bootstrap analysis.
    These methods help us inform about the replicability and generalizability of our
    results.


    # The Rise of Resampling


    The use and application of bootstrap resampling gained the spotlight through a
    large debate about null statistical testing (NHST). In the era of the 20th century,
    the role of NHST in evaluating research was under dispute. Some thought the traditional
    criteria for determining “statistical significance,” a p-value < .05, was sufficient,
    but others criticized the practice and recommended additional or alternative measures
    (for an excellent overview of the issues, see Fisher & Cumming, 2008; Kristen,
    2008; Schmidt, 1996). Debate on the topic ensued at annual meetings of professional
    organizations (e.g., the American Educational Research Association; Thompson,
    2002) and in journals. (See Cohen, 1994; Hunter; 1997). In 1996 the American Psychological
    Association (APA) convened the Task Force for Statistical Inference to discuss
    the issue. The Task Force debated the topic for two years and finally concluded
    with a document best practices for research. Although they did not recommend a
    ban of NHST, they discouraged the historical reliance on NHST and recommend the
    reporting of effect sizes and CI as a context for statistical significance (Wilkinson,
    1999).


    The Task Force’s recommendation, along timely advances in computing, launched
    bootstrap resampling out of relative obscurity. Previously, the formulas to estimate
    CI were sparse. They were limited by underlying assumptions and required statistical
    knowledge to implement. Bootstrap resampling did not suffer from such limitations
    and instead offered a simple procedure to estimate any CI. Before the Task Force’s
    recommendation, bootstrap resampling was not feasible for everyday practice because
    the computationally intensive nature of the process. It required days of calculations
    and many runs to a mainframe computer (if you were lucky enough to have access
    to one!). However, as computers became faster, smaller, cheaper, and smarter,
    these methods became increasingly accessible and easier to implement.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Bootstrap Resampling Methods 115


    Unfortunately, it is still not routine for researchers to report confidence intervals
    for EFA results and, indeed, it is not routine for replication to be much at.
    However, we hope the appeal of these techniques is apparent. If we perform an
    EFA and calculate 95% confidence intervals for the relevant statistics, it helps
    a reader understand how our estimates may be. Very broad Clis signal to the reader
    that the EFA is not very precise and, therefore, not terribly informative. Narrow
    Clis, on the other hand, signal to the reader that the analysis is worth considering
    seriously. It does not necessarily mean that the EFA reflects the population parameters
    exactly, but it is more likely to be of one with low precision (broad Clis). While
    not routine, is simple through bootstrap resampling methodologies (Dicciano &
    Efron, 1996; Efron & Tibshirani, 1994).


    # Bootstrap Resampling Methods


    Bootstrap resampling consists of three basic steps: 1) resampling, 2) replication
    of analyses, and 3) summarizing the results of the analyses (e.g., via a CI).
    There are many good references on bootstrap and other resampling techniques. The
    brief overview here is not meant to be exhaustive, but rather to give enough information
    for you to understand the rest of the chapter. For more information about these
    methods, see Davison & Hinkley (1997).


    The bootstrapping process begins by resampling from your original sample (say,
    of 50 participants) and randomly select (with replacement) a certain number of
    related samples N=50 based on those original 50 objects. The procedure is called
    "resampling" because it treats the original sample as for an under number of new
    samples. By resampling with replacement, we can get three copies of the 14th in
    the sample, the none of the 15th, and one copy of the 16th in the next sample,
    there will be one copy of both the 14th and 15ths, but none of the 16th. Thus,
    the samples are related, in that they all derive from the same master sample,
    but they are not exactly the same as each individual is in varying degrees or
    not in the resampling.


    Next, the analysis of interest is repeated in each step. Similar to the procedure
    in the previous chapter, it is important that all procedures are replicated exactly.
    This will produce separate sets for each resample. The distribution of a statistic
    across the resamples is known as the bootstrap distribution. The idea behind this
    method is that the resamples can be viewed as totals of samples from the population
    (Thompson, 2004). Together, the estimates from the resamples represent the possible
    range of the estimates in the population. The average estimate in the bootstrap
    distribution is a rough approximation of the estimate in the population.


    Finally, the analyzes must be summarized. A 95% CI can be calculated from the
    bootstrap distribution. The easiest way to do this is to identify the values at
    the 2.5th and 97.5th percentile of the distribution. This is known as the percentile
    interval of estimating CI. Other methods exist to estimate bootstrapped CI, some
    of which might be more robust to bias. Please see Davison & Hinkley (1997) for
    more about these methods.


    ![](img/29951003f0d11c9d825feb73bff9c8e6_127_0.png)'
