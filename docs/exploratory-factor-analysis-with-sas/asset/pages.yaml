  md: '# Extraction Criteria 35


    solution (see SAS, 2015). SAS prints the average eigenvalue at the top of any
    eigenvalue table for evaluating this criterion. (See Figure 3.1 on page 38 below).
    This method will yield results that are identical to the Kaiser Criterion when
    implemented in PCA (Kim, Mueller, 1978).


    **portion of variance.** The proportion of variance criterion examines the proportion
    of common or shared variance across all of the items. It proposes that preliminary
    factors are ordered by descending eigenvalue, we retain all factors with a cumulative
    proportion of variance below or a predefined level. For example, if we set the
    proportion of variance to 70%, we would extract factors until the sum of eigenvalues
    exceeds 70% of the common variance. The default proportion of variance used in
    SAS is 100%. This can be interpreted as a criterion that will retain the number
    of factors all of the shared variance. The default proportion of variance to be
    used can be changed using the PROPORTION option.


    **Scre plot.** The scree test involves examining the eigenvalues (available in
    all software) and looking for the natural bend or "elbow" in the data where the
    slope of the curve flattens) markedly. The number of data points above the "elbow"
    (i.e., not including the point at which the break occurs) is usually considered
    a good estimate of the ideal number of factors to retain. Although the scree plot
    is not considered sufficient to determine how many factors should be extracted
    (Velicer et al., 2000), many suggest that researchers examine solutions extracting
    the number of factors ranging from one to two factors above the elbow to one or
    two below. As is an exploratory technique, which should be encouraged to explore.
    Some plots have one clear bend, some multiple points of inflection, and some have
    no clear point (for a good example of this, the SDQ example below). Combining,
    the Kaiser Criterion, and examination of the scree plot is usually a good base
    for deciding the number of factors to extract in an exploratory factor analysis.


    **Parallel analysis** was proposed by Horn (1965). A procedure for conducting
    this analysis is not included in most statistical software, including SAS, and
    is not widely used. However, it is considered advantageous over the more classic
    approaches (although we see in examples that it is not always better; see Velicer
    et al., 2000). Parallel analysis involves generating random uncorrelated data,
    and comparing eigenvalues from the EFA to those eigenvalues from that data. Using
    this process, only factors with eigenvalues that are significantly above the mean
    (preferably, the 95th percentile) of those eigenvalues should be retained. This
    ensures the most robust and accurate process for determining the number of factors
    to extract (Ledesma & Valero-Moro, 2007; Velicer et al., 2000).


    **Minimum average partial (MAP)** analysis was proposed by Velicer (1976) as more
    modern methodology for determining the number of factors to extract in the context
    of PCA. This procedure involves partialing common variance as each successive
    component is created; this is a concept that has steeped in the traditions of
    multiple regression. As each successive component is partitioned out, common variance
    will decrease to a minimum. At that point, unique variance is all that remains.
    Velicer argued that a minimum point should be considered to be the criterion for
    the number of factors to extract (Velicer et al., 2000). MAP has been considered
    superior to the "classic" analysis, and probably is superior to parallel analysis,
    although neither is perfect, and must be used in the context of a search for conceptually
    interpretable factors.'
