    # An Example with the Coefficient of Determination


    We review an example from the first author’s personal research on identification
    with academics (self-concept vis-a-vis visual). In one study long while ago, he
    administered two closely related scales (the School Perceptions Questionnaire
    and the Identification with School questionnaire, Osborne, 1997; Voelik, 1997)
    for high school students. Alphas were calculated to be α=0.88 and 0.81, respectively.
    These levels are widely considered “good.” After averaging the items to create
    scores and testing assumptions, the correlation was calculated to be r = 0.75,
    which translates to a coefficient of determination (% variance accounted for)
    of 0.56. This is generally a pretty strong correlation for the social sciences,
    and is reasonable considering these two measures of similar structures. The corrected
    correlation (formulas available in many places Cohen, Cohen, West, & Aiken, 2003)
    is calculated to be r = 0.89, which would represent a coefficient of determination
    of 0.79. If we assume that this corrected effect of 0.79 is the correct population
    estimate, the original correlation between two measures with “good” reliability
    lost almost 30% of the effect size.


    Although we cannot know the population correlation for this example, we can simulate
    what perfect measurement might yield as correlation between these two variables
    using AMOS structural equation modeling to construct latent variables representing
    each of these scales. Although structural equation modeling (SEM) is a relatively
    advanced'
