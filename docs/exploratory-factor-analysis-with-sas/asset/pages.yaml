  md: '# 142 Chapter 8 / Data Cleaning


    Exploratory factor analysis is no exception, but there are different issues, and
    different priorities when dealing with EFA. Residuals, a common tool used to identify
    outliers in inferential statistics, contradict the exploratory nature of EFA¹
    . Instead, a number of other tools and techniques are used to identify overly
    influential cases. Missing data is also increasingly problematic for EFA. The
    factor analysis model cannot handle missing data and deletes such by default.
    This process can introduce systematic error and bias into the results. Therefore,
    missing data should be reviewed and potentially dealt with, via various methods,
    prior to EFA.


    In this chapter we aim to provide a brief look at the issue of data cleaning for
    EFA. Specifically, we will discuss two particular threats—outliers and missing
    data—and the methods for dealing with them. A thorough review of this topic and
    the associated SAS procedures is beyond the scope of this book. Interested readers
    are encouraged to seek out additional information on their own.


    # Outliers


    # Two Types of Outliers in EFA


    There are two different types of outliers in factor analysis². The first type
    of outlier is a case (or value) that does not belong. There are many reasons why
    cases might not belong: the case could be from a different population, could be
    the result of data recording or entry error, could have resulted from motivated
    misresponding, or represent a small subgroup with a different factor that has
    not been recognized. Whether the reason, having these "illegitimate" cases in
    the data does serve any useful purpose. When you identify such a case, you should
    check the original data, if it is available, to identify whether the case suffers
    from a data entry or key error. It is possible to fix the data manually. Alternatively,
    you could remove it and use missing-data techniques (described below) to replace
    it with a reasonable estimate of what it might have been.


    The second type of outlier in EFA is a variable that does not belong. In this
    context, a variable can be considered when it loads on its factor as a single-item
    factor. If an item does not load on any other factor, and no other items load
    on that factor, it is considered an outlier, and should be removed from the analysis
    (or the scale should be reworked to fully represent dimension of the latent construct
    if it is a legitimate facet of the construct).


    Many outliers can be identified through careful review of data and analyses. The
    out-bounds value (a subtype of the first outlier) usually can be identified through
    frequency


