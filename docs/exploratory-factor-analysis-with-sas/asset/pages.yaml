    scales. Nevertheless, the coefficients tend to follow a similar rank order. A
    few of the coefficients deviate from this pattern, but the deviations are minor
    in size. Furthermore, if we examine the correlation between the two sets of factors
    scores produced (see Figure 9.2 on page 166), we would conclude that the methods
