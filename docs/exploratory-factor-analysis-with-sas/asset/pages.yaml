    The estimates and confidence intervals for each sample are presented in Table
    11.2 on page 200 and Table 11.3 on page 201. Ideally, bootstrap analyses of small
    samples would include the population parameter in the 95% confidence interval,
    and would provide information about the precision of the estimate (and thus the
    potential replicability of the statistic). In the tables below, we can see this
    pattern is generally true. 95% CI for the alphas in each sample contains the “population”
    alpha. Furthermore, as the sample size increased, the CI became narrower and more
    precise. This same general pattern is seen in the 95% CI for the item-total correlations.
    There were only a few instances (highlighted) where the bootstrapped CI did not
    contain the “population” parameter.


    Let''s focus on this idea of CI range and precision for a moment. As we mentioned
    above, the CIs are narrower and more precise as the sample size increased. We
    can see that the CIs are narrow, but how do we know they are more precise? In
    the smallest sample of N=50, the range of the CI tended to be rather large, and
    the sample estimates varied by .12, on average, from the “population” estimates.
    (e.g., GDS06, GDS10). As the samples get larger, the estimates came closer to
    our “population” estimates and the corresponding CIs became narrower.


