    # Importance of Replication


    “Factor analysis is really not concerned with exactness, only good approximation.”

    -Nunnally & Bernstein, 1994, p. 509.


    We have repeatedly recommended that readers and researchers keep in mind the exploratory
    nature of EFA—a procedure that by nature is quirky, temperamental, valuable, and
    interesting. As discussed in Chapter 5, exploratory factor analysis takes advantage
    of all the information in the interrelations between variables, whether those
    interrelations are representative of the population or not. In other words, EFA
    tends to overfit a model to data such that when the model is applied to a new
    sample, the model is rarely as good as fit. When we as readers see a single EFA,
    often on an inadequate sample (as discussed in Chapter 5), we have no way of knowing
    whether the results are likely to generate a new sample or to the population.
    But it seems as though this might be useful information.


    If you read enough articles reporting the results from factor analyses, often
    you will find confirmatory language used regarding exploratory analyses. We need
    to re-emphasize in our'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 98 Chapter 6 / Replication Statistics


    discipline that EFA is not for testing of hypotheses or confirming ideas (e.g.,
    Briggs & Cheek, 1986; Floyd & Widaman, 1995), but rather for exploring the nature
    of scales and item interrelations. EFA merely presents a solution based on the
    available data.


    These solutions are notoriously difficult to replicate, even under ideally circumstances
    (exceptionally clear factor structure, very large parameter ratios, strong factor
    loadings, and high communities). As mentioned above, many point estimates and
    statistical analyses vary in how well they will generalize to other samples or
    populations (which is why we are routinely asking for confidence intervals for
    point estimates). But EFA appears particularly problematic in this area.


    We find this troubling, you should too. Of course, we have no specific information
    about how replicable we should expect particular factor structures to be direct
    tests of replicability are almost never perfect. As Thompson (1999) and others
    notes, replication is a key foundational principle in science, but we rarely find
    replication studies published. It could be because journals refuse to publish
    them, or because researchers don''t perform them. Either way, this is not an ideal
    situation.


    # Let’s Bring Replication to EFA


    Authors can (and, we argue) directly estimate the replicability of their exploratory
    factor analyses reported in scientific journals. Authors (e.g., Thompson, 2004)
    have introduced replicability procedures for EFA, similar to those procedures
    considered best practices in validation of prediction expectations in multiple
    regression (Osborne, 2000, 2008). Although few authors perform the procedure,
    we hope you will see the intuitive appeal.


    Specifically, the goal of EFA is to identify or explore the likely factor structure
    of an instrument when used within a particular population, it is important to
    know whether a factor structure within a particular set is likely to be observed
    within another, similar data set.¹ The lowest threshold for replicability should
    be replicating the same basic factor structure (number of factors extracted, same
    items assigned to each factor) within a similar sample. A more rigorous threshold
    for replicability would be seeing the same number of factors extracted, the same
    magnitudes of factor loadings (within reason). Stronger replicability gives researchers
    more confidence that a particular scale will behave as expected in data subsets
    or in a new sample.


    The EFA replication procedures explored in this chapter will provide readers information
    about the extent to which their EFAs meet these reasonable and basic expectations
    for replicability.


    +   As a fact, we have traditionally referred to scales as "reliable" or "unidimensional",
    but methodologists since Lord & Novick (1966) call that instruments have no reliability,
    only scores from particular samples do. (See Wilkinson and the Task Force on Statistical
    Inference, 1999) Despite this, we have a reasonable expectation for instruments
    to have the same basic structure across samples if we are to have any rational
    basis for the science of measurement within the social sciences.'
