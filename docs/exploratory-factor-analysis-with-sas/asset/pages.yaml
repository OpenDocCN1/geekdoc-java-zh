    # Summary


    Although authors have been presenting methods for summarization replication in
    EFA for half a century and most summarization techniques have been flawed or less
    informative than ideal. In the 21st century, with CFA invariance analysis as the
    gold standard for assessing generalizability and replicability, replication within
    EFA has an important role to play—but a different role than half a century ago.
    Today, replication in EFA is a starting point—it adds value to EFA analyses in
    that it indicates the extent to which these models are likely to generalize to
    the next data set, and also helps to further identify volatile or problematic
    items. This information is potentially helpful in the process of developing and
    validating an instrument, as well as for potential users of an instrument that
    has yet to undergo CFA invariance analysis.'
