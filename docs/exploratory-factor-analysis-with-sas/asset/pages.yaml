  md: '![](img/29951003f0d11c9d825feb73bff9c8e6_69_0.png)


    This example reinforces the fact that EFA is both an art and a quantitative science,
    and that the researcher''s good judgment is critical when the data is not as clear
    or cooperative as one would hope. This data is not giving us a clear indication
    of how many factors to extract, and thus we need to explore several options for
    what is most sensible. When data is uncooperative in this way, replication becomes
    even more critical, as we will discuss in chapters to come.


    # Summary


    Many scholars have written guidelines for extraction of factors, focusing on the
    strengths of a particular extraction technique or a particular extraction criterion
    (e.g., eigenvalues, scree plots, parallel analysis). Throughout this chapter we
    argue that each of these methods provides valuable insight on the number of factors
    underlying the data. One method should not be used as the method to rule them
    all, and similarly we do not need consensus among the methods that we do. It is
    best to make decisions based on multiple criteria, and it is'
  merge: -1
