    # How Many Factors?


    Scholars have been arguing about this issue for the better part of a century.
    There are many who argue passionately that one method is superior to another,
    and some methods seem to be more defensible than others. However, it seems to
    me that much of the argument comes from a high-stakes mentality where researchers
    are attempting to confirm one factor structure as superior to another. Let us
    repeat our mantra for this book: EFA is exploratory and should be considered a
    low-stakes process.


    There are many guidelines for how to decide the number of factors to extract from
    an analysis. After all, your statistical software will extract as many factors
    as there are variables in the analysis, and since our goal is dimension reduction,
    then we have to decide how many of those extracted factors retain for further
    analysis. If the number of factors is not specified in SAS, then PROC FACTOR defaults
    to using the minimum number of factors that vary by extraction method, see SAS,
    2015) or the proportion of variance criterion (with the default eigenvalue minimum
    default proportion set to 100%). It is important that you do not let the default
    driving your analysis, but instead select and review the method or methods that
    make sense to you. So what decision rules exist, and which is best?'
