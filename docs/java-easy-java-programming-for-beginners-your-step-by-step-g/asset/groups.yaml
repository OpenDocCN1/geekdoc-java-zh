    set to **private** instead of public, then only the current class has the access
    to it. Finally, the only curly brace“ indicates the beginning of the class and
    has a corresponding closing brace ”” at the end of the entire program. Always
    coming in pairs, braces identify groupings of code for both the programmer and
    the computer.


