    # Chapter Four: User Input


    In this chapter the concept of user input will be introduced and incorporated
    into your Java programming language.


    Based from the first simple Java program that we discussed earlier, you were not
    asked to provide any form of input for the code execution. The lines of code just
    displayed the message on the computer screen. In the real world, programming requires
    a stable communication between the user and the machine. In Java language, this
    is what we call Input/Output or I/O streams. In this scenario a-way communication
    is created where the user provides an input for the computer to process and then
    produces an output in return.


    ## Getting the User Input


    There is a built-in class called Scanner in Java language to easily get the user
    input. What it does is acquires information from the input stream, either from
    the keyboard or a file, and stores in a variable. However, the Scanner class is
    not part of the core Java language so you need to tell the compiler where to find
    it. For you to use this, you need to include this line of code at the top of your
    program, just after the prologue section:


    ```

    import java.util.Scanner;

    ```


    Because of the additional statement, the Scanner class is being imported from
    the java.util package. To call or execute this class in the program, you need
    to use the following statement:


    ```

    Scanner InputVariableName = new Scanner(System.in);

    ```


    Now, the imported class Scanner was called to initialize a variable called InputVariableName
    (you can change this name to whatever you like but make sure it is not a Java
    keyword). This is followed by the assignment operator “=” that is in turn followed
    by the programming code new Scanner(System.in).. This expression creates an object
    and commands the program to store the value of the user input to InputVariableName.
    Please take note of the coding convention in variable naming: first letter of
    the words are always capitalized.


    For us to utilize the output stream to show you what you have typed into the program,
    we need to include the following print out statement:


    ```

    System.out.println(InputVariableName.next());

    ```


    The method nextLine() is included here that will instruct the program to return
    a string value that was inserted into the current line. It also tells the program
    to wait until it finishes searching for an input, so the program will not advance
    until you type something and press the Enter key on the keyboard. Let us further
    modify the println method by including an additive operator:


    ```

    System.out.println("You entered “ + InputVariableName.next());

    ```


    At this point, the output statement contains a textual information that will be
    printed out together with the Scanner variable. The messages are combined using
    the additive operator "+" found inside the parentheses. Now, when the user provides
    an input, like for example "Johnny", then the program will display "You entered
    Johnny" on the computer screen.


    Our modified program will actually look like this:


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_48_0.png)


    From the program above, the message "What is your name?" is displayed to prompt
    you to enter your name. After you have typed your name and pressed enter (see
    the text in green located in the Console Section), the program will display your
    name after the words "You entered " on the screen.


    The introduction of user input as described in this chapter had presented Java
    environment as a two-way form of communication – between the software programmer
    and the computer. You, as the user, will provide information for the computer
    to process through the execution of the lines of Java code. The succeeding chapter
    will now introduce the concept of variable declaration.


    ## Chapter Five: Variable Declaration


    Previously, we declared a variable to contain a text user input. If you want to
    create more complex programs then you have to store value in variables. This chapter
    will now focus on declaring variables as part of your programming style.


    Assigning what type of variable to be used is done in a declaration statement
    with the following syntax:


    ```

    <type> <list-of-variables-separated-by-commas>

    ```


    Examples:


    ```

    int rows, cols;

    String companyName;

    ```


    Again, a variable is a placeholder, the thing stored in it is a value and the
    kind of value that is stored in a variable is its type. Looking at the declaration
    statements above, the word at the left (int, String) specifies the type for the
    variable or variables at the right (rows, cols, companyName). By the way, a Java
    variable can hold only one type of value and its value can change during program
    execution. So in the examples above, rows and cols variables can hold only integers
    while the second declaration statement the companyName variable can hold only
    strings. Below are the basic variable types in Java language:


    | Type Name | Description | Range of Values |

    |---|---|---|

    | Whole Number Types | | |

    | int (Integer) | - simplest data type for handling numbers - no decimal points
    - not ideal for precision data - default value is 0 | -2147483648 to 2147483647
    |

    | byte | - has the smallest range for number data type - contains an 8-bit signed
    2s complement integer - default value is 0 | -128 to 127 |

    | short | - contains 16-bit signed 2s integer - default value is 0 | -32768 to
    32767 |

    | long | - contains 64-bit signed 2s complement integer - default value is 0 |
    -9223372036854775808 to 9223372036854775807 |

    | Decimal Number Types float | - contains 32-bit IEEE 754 numerical values - contains
    decimal points - default value is 0.0f | -3.4 x 10^38 to 3.4 x 10^38 |

    | double | - contains 64-bit IEEE 754 numerical values - contains decimal points
    - more precise than float - default value is 0.0d | -1.8 x 10^308 to 1.8 x 10^308
    |

    | Character Type string | - contains a sequence of alphanumeric characters - default
    value is null | | |

    | char | - accepts a single character as data and symbols | thousands of characters
    |

    | Logical Type | - default value is \u0000 (represents an empty space) | | |

    | boolean | - default value is False | True, False | |


    Please take note of the following declaration statements for each variable type:


    - int AnyVariable; or int AnyVariable = 0;

    - byte AnyVariable; or byte AnyVariable = 0;

    - short AnyVariable; or short AnyVariable = 0;

    - long AnyVariable; or long AnyVariable = 0L;

    - float AnyVariable; or float AnyVariable = 0.0f;

    - double AnyVariable; or double AnyVariable = 0.0d;

    - String AnyVariable; or String AnyVariable = null;

    - char AnyVariable;

    - Boolean AnyVariable; or Boolean AnyVariable = false;

