    其他。仅仅过了五年，Java 在全球范围内已经拥有 250 万名开发者。


    - 2000

    大学理事（College Board）于 11 月宣布，计算机科学高级课程（AP）考试将在 2003 年基于 Java 进行。


    - 2002

    微软引入了 C#，一种继承了 Java 大部分编程特性的新语言。Sys-Con Media 在同年 6 月报告说，对 Java 程序员的需求日益增长（比 C++
    程序员的需求增加了 50% 以上）。


    - 2007

    Google 开始使用 Java 语言在 Android 移动设备上开发应用。


    - 2010

    甲骨文公司（Oracle Corporation）于 1 月收购了太阳科技公司（Sun Microsystems），将 Java 技术整合进了 Oracle
    家族。


    - 2010

    eWeek 在 6 月将 Java 评为“保持就业的前 10 编程语言”第一（www.eweek.com/c/a/Application-Development/Top-10-Programming-Languageasto-Keep-You-Employed-719257）。


    - 2013

    自 2013 年 8 月以来，已有超过 11 亿台台式电脑和 2.5 亿手机在使用 Java平台（www.mobiledevicemanager.com/mobile-devicestatistics/250-million-android-devices-in-use
    和 http://java.com/en/about）。此外，通过新技术出现了更具交互能力的蓝光设备。Java 已经被各种编程小组和社区认为是最流行的语言，例如
    TIOBE 社区指数（www.tiobe.com/index.php/content/parserinfo/tpci）和 PYPL 编程语言流行指数（http://sites.google.com/site/pydatalag/pypl/PyPL-Popularity-of-Programming-Language）等。


    ## Java 技术的出现


    当 IT 专家在 20 世纪 90 年代初意识到通过为日常家电引入智能化使人们的生活变得更简单存在巨大需求时，太阳科技公司与一个研究小组合作启动了“绿色项目”（Green
    Project）。这是一项秘密任务，旨在开发一种运行在嵌入式处理器芯片上的便携式家电软件。该程序应该足够灵活，以适应不断变化的家电处理器芯片，这些芯片正变得越来越小、越来越廉价且功能越来越强大。团队最初计划使用
    C++，但其可移植性问题阻碍了他们的成功之路。因此，他们决定开发一种全新的计算机编程语言。


    1991 年，太阳科技公司通过 James Gosling、Chris Warth、Patrick Naughton、Mike Sheridan 和 Ed
    Frank 的合作，最初构思了 Java 语言。Oak 是这种新编程语言的初始名称，灵感源自 James Gosling（团队项目负责人）窗外的一棵树。


    然而，Oak 已经被用作另一种编程语言的名称。因此在 1995 年，它被正式重命名为 Java，这代表了软件开发人员休息时经常享用的咖啡。然而，由于对这类家电的需求并没有像太阳科技团队预期的那样，他们必须寻找另一个渠道来扩展
    Java。最终，在 1995 年 5 月，Java 在 SunWorld 大会上首次发布，随后 Netscape（当时世界上第一大浏览器）立即宣布他们将这种编程语言整合到他们的开发中。通过
    Java 嵌入网页，网站从单调乏燥转变为交互式。不仅 Web 能够向受众发送信息，它们还能接受用户输入。


    在本章中，你已经学习了计算机编程语言的历史，重点是 Java 技术的开发。在接下来的章节中，将描述 Java 如何在各种编程环境中使用，并提供如何在你的计算机上正确安装它的清晰指令。


    ## 第二章：Java 环境


    为了更深入地了解 Java 编程，本章将开始讨论如何在各种环境中使用和部署软件。它还将提供有关如何安装 Java 程序本身以及计算机上其他所需工具的逐步说明。


    随着万维网不可阻挡的增长，开发者已经找到了将 Java 程序整合到每个网页的方法。以下是该语言在不同环境中的用途总结：


    - Applet - 一种嵌入网页的网络 Java 程序，通过互联网传输时自动执行。通常这是一个小型程序，可以显示来自服务器的数据、管理用户输入，甚至执行诸如计算器之类的简单功能。这些功能在客户端计算机上本地完成，而不是连接到服务器，这意味着当你点击
    applet 链接时，它会自动下载并在浏览器中运行。


    - Servlet - 一种小型 Java 程序，支持浏览器但运行在不同的计算机或 Web 服务器上以扩展其功能。Servlet 的引入升级了客户端/服务器连接。


    - JavaServer Page (JSP) - 一个由 Java 程序片段组成的网页（与具有完整程序的 applet 相反）。


    - Micro Edition (ME) Java Application - 运行在内存有限资源设备上的 Java 程序，如手机或电视机顶盒。


    - Standard Edition (SE) Java Application - 运行在标准计算机（如台式电脑或笔记本电脑）上的 Java 程序。


    - JavaFX - 与多媒体平台（如 Flash 播放器）集成的 Java 程序。


    ## 初始 Java 设置


    在坐在电脑前开始编写代码之前，你需要确保你和你的机器已准备好编写 Java 代码。强烈建议你查看以下网站并按照说明下载通常免费的软件：


