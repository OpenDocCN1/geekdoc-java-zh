    # Chapter Nine: Classes and Objects


    You have already been encountering Java classes and objects at this point in the
    previous chapters of this eBook. At this point in time, you will gain more knowledge
    on the available class variables and objects that you can employ to achieve the
    desired results of why you are programming in a Java environment.


    # Classes


    Acting as blueprints of a Java program, classes are templates that describe the
    characteristics of an element or method. Basically, they are generic elements
    in Java programming. They also help a programmer to understand the coding system
    of another programmer, making its structure clear. Classes exist in the program
    as long as they desire, meaning they do not have a lifespan.


    The following is a list of possible class variables:


    +   - Class - A class is a variable that needs to be declared before it enters
    a class, which can be found within any class and outside any method.


    +   - Instance - Instance is a variable that remains within a particular class
    but is outside a method. However, it is accessible from any other method once
    declared.


    +   - Local - Local is a variable that is defined inside any method in the program
    and requires initial declaration and acknowledgement. It is omitted after it has
    executed the command or function.'
