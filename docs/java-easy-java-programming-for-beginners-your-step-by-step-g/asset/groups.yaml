    ## 第八章：访问修饰符\n\n我们已经讨论了 Java 变量、类、字段和方法。每当它们被声明时，你都必须指示它们在整个程序是如何被控制以及如何被访问的。无论它们是否受限，它们的可访问性将由本章将介绍的访问修饰符决定。\n\
    \n决定使用哪种修饰符取决于程序的目标以及你真正想要实现的内容。以下是不同类型的修饰符：\n\n### 默认 (Default)\n\n这是在没有指定访问修饰符时分配的类型。由于它的缺失，任何命令或函数都可以访问程序的某个部分。然而，它的可用性仅限于访问属于相似包的字段。一个没有修饰符的程序可能看起来有效，但并不整洁。访问级别通常对公众开放，但并不包含在接口中。\n\
    \n示例：\n\n```\nString version = \" 1.00.1\"\n```\n\n```\nBoolean process_order\
