    注释是程序中的描述性部分，用于解释代码的含义。它们是特殊的文本区域，可以提高程序的可读性——帮助人们理解程序的运行。基本上，这些是人类阅读但编译器完全忽略的单词。根据编写方式的不同，注释分为两种：


    ## 1. 单行注释或行尾注释


    这种注释以两个斜杠开头，其注释内容足够短，可以放在的一行内。它也可以写在代码行的末尾。在之前的简单 Java 程序示例中，我们的单行注释是：


    ```

    // A Java program begins with a call to main ().

    ```


    编译器从第一个斜杠开始到该行结束的所有内容都会被忽略。


    ## 2. 块注释或多行注释


    这种类型的特点是包含多个单行注释（这意味着你的注释文本太长，无法放在一行内）。然而，两个斜杠被替换为注释开始时的符号"/*"，并以结束符号"*/"结尾（为了节省每行都写
    "/" 的时间）。同样，编译器会忽略两个斜杠之间的所有内容。在之前的简单 Java 程序示例中，我们有：


    ```

    /*

    * This is a simple Java program

    *

    * Call this file Example.java

    */

    ```


    序言（Prologue）是块注释的一种版本，放置在程序的顶部或最开始。它包含了关于代码的重要信息，以便每位程序员都能一眼看出程序的大致内容。通常，序言被包含在一个星号框中，并包含以下信息：文件名、程序员姓名和程序描述。如果我们要修改上面的块注释，它看起来像这样：


    ```

    /****************************************************************

    * Example.java

    * Felix & Schatz

    *

    * This is a simple program that displays "Java is essential to the Web" on your
    PC screen

    *****************************************************************/

    ```


    ### - 类头


    我们现在移动到第一个 Java 程序的下一行：


    ```

    public class Example {

    ```


    这行程序代码被称为类头或类声明，它由 4 部分组成—— 3 个单词和左大括号（实际上，整个程序被视为一个类）。让我们讨论一下每一个。


    这两个单词 `public` 和 `class` 是我们所说的保留字或关键字。这些单词用于 Java 语言定义的特定用途。你不能重新定义它们，也无法为了用它们来表示其他含义，例如将它们作为程序的名称。以下是
    Java 语言中常见的关键字列表：


    | abstract | assert | boolean | break | Byte |

    |---|---|---|---|---|

    | case | catch | char | class | const |

    | continue | default | do | double | else |

    | enum | extends | final | finally | float |

    | for | goto | if | implements | import |

    | instanceof | int | interface | long | native |

    | new | package | private | protected | public |

    | return | short | static | strictfp | super |

    | switch | synchronized | this | throw | throws |

    | transient | try | void | volatile | while |


    分析每个单词，**class** 是一个标记类开始或程序开始的标记。它还表示正在定义一个新类。在我们第一个简单程序中，**Example** 是类的名称。另一方面，**public**
    是一个访问修饰符，用于控制类的访问方式（在这种情况下，信息可以被所有其他类访问）。如果它被设置为 **private** 而不是 public，那么只有当前类有权访问它。最后，唯一的左大括号
    "{" 表明了类的开始，并在整个程序的结束处有一个对应的右大括号 "}"。括号总是成对出现，它们为程序员和计算机识别代码分组。


    ### - Main 方法头


    在类之后，接下来是 main 方法头。方法是 Java 语言中的一个子程序，是程序开始执行的代码行。它简单来说是一份待事项列表。在我们的示例中，main 方法的形式如下：


    ```

    public static void main(String args[]) {

    ```


    同样，**public** 是一个访问修饰符关键字，表示每个人都可以访问定义或声明该方法的类外部。**Static** 是另一个保留字，表示该方法可以被立即访问。第三个保留字是
    **void**，表示 main 方法不返回任何内容（在某些程序中它可以返回一个值）。


    任何需要传递给方法的信息通过方法名后括号内指定的变量来接收。这些变量也称为参数，在我们的示例中，只有一个 (**String args[]**。声明的名为
    args 的参数代表 main 方法接收的参数。**String** 是参数的类型，用于存储字符序列。方括号 "[]" 符号表示这是一个字符串类型对象的数组。即使不需要参数，你仍然需要指定空括号。


    ### - System.out.println


    根据我们的第一个简单 Java 程序示例，我们的 main 方法包含以下行代码：


    ```

    System.out.println("Java is essential to the Web");

    ```


    **System.out.println** 是一段程序代码，向计算机给出打印指令。让我们讨论它的每一个部分。**System** 指代计算机，当它变成 **System.out**
    时，指的是显示器，即计算机系统的输出设备。**println** 是一个在控制台打印文本的内置方法。


    '
