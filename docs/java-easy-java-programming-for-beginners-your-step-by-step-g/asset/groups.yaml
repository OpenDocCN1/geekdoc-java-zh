    \ `bay`。虽然 `arcadia bay` 被设置为公有的，但它的一些内部属性被设置为私有的。此外，由于它的其中一个内部组件（`action`）被设置为公有的，它可以被不同的字段识别。\n\
    \n### 公共 (Public)\n\n这种修饰符类型允许从任何其他字段访问。具有公有访问级别，程序员访问其工作的其他部分将不那么麻烦。属于公共类的所有命令、函数和不同组件都可以通过\
    \ Java 编程语言中识别的指令集来访问。然而，声明为公有也有缺点或局限性。即使所有命令和函数都设置为公有，它们无法被属于不同包的类访问。\n\n示例：\n\
    \n```\npublic static void main(String arguments) {\n}\n```\n\n### 保护 (Protected)\n\
    \n这种访问修饰符属于我们所说的超类，其特点与默认类型相比，隐藏性和安全性更低一些。它还意味着两点：\n\n- 它只能由在特定超类中声明的字段访问\n- 它只能由相似包的子类访问\n\
    \n实施这种分类是为了在限制无关元素访问的同时改进程序结构。保护访问修饰符还施加了严格的协议，且应用范围有限（不能应用于类和接口）。如果一个字段没有连接到任何类或接口，可以将其声明为保护的。\n\
    \n示例：\n\n```\nclass seven_fields {\n    protected boolean open_fields(field1 sp)\
