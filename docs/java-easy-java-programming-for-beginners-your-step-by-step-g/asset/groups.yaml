    # Chapter Three: The Basics of Java Code


    Before you start writing lines of Java code, this chapter will describe first
    what object-oriented programming is all about (which is one of the primary characteristics
    of Java programming). You will also encode your first simple Java program and
    understand the importance of every part. Also, you will be introduced to classes,
    objects and instances.


    One must understand the heart of the Java language methodology object-oriented
    programming OOP. Over the years, software developers are progressively trying
    to find ways on how decrease the complexity of encoding programs. The first generation
    of programming languages involved toggling of binary machine codes, which are
    only a few hundred instructions long, into the computer''s front panel. When programs
    evolved required IT experts to handle more complex instructions through symbolic
    representations, the assembly language was developed. As programming methodologies
    were enhanced, more high-level languages were introduced. One example is FORTRAN,
    however, codes were not easy-to-understand yet.


    Structured programming emerged during the 1960s that was used in C and Pascal
    languages. These programs were characterized by local variables, rich control
    constructs and stand-alone subroutines, among others. Even if they were considered
    as power tools, they are still limited when handling very projects.


    The demand for breaking through the barriers of encoding extremely large projects
    paved way to the advent of object-oriented programming. It is a combination of
    the best methodologies of structured programming plus new organizing concepts.
    This programming style is characterized by the following:


    - Encapsulation


    By the name itself, encapsulation is a strategy that binds the programming code
    and the data it manipulates and keeps them from outside interference. When code
    and data are linked together, an object is created. This object contains code
    and data that are either private or public. A private code or data cannot be accessed
    by any program that exists outside said object. When it is public, then the other
    parts of the program are able to access even if they are not within the object.


    - Polymorphism


    This concept is often described as creating a single interface for multiple methods.
    It means you design a generic interface to a group of related activities. It further
    reduces the complexity of the program by letting the same interface to be used
    to specify a general class of action. A clear analogy is the steering wheel. No
    matter what type of steering wheel, whether a manual steering or a power steering,
    as long as you know how it works then you can drive any type of car.


    - Inheritance


    This process involves one object acquiring the properties of another object, which
    supports the concept of hierarchical classification. To explain this, imagine
    a red delicious watermelon which belongs to the classification watermelon. The
    watermelon is further part of the fruit class, which belongs to a larger class
    called food. The food class has certain qualities such as edible and nutritious,
    that is further applied to its subclass fruit. The fruit has certain qualities
    as well, such as juicy and sweet. Now for the watermelon, it also has attributes
    specific to it, such as a tropical vine-like plant. Now combining all these qualities
    makes a red delicious watermelon.


    Object-oriented programming is characterized by the application and organization
    of classes, objects and instances. These are actually the components that make
    up a Java program and are interconnected with one another.


    - Class - Considered the highest group, class encompasses everything in object-oriented
    programming.


    - Object - Specifications set by the classes are being applied to the objects
    that are not loaded into the computer''s memory. They are also instances of a
    class that act as blueprints ready to be used when needed. Thus, one class can
    have any number of objects associated with it (can even have zero objects).


    - Instance - Can be the same as objects since they describe an individual instantiation.


    To understand their relationship with one another, imagine that you are developing
    a computer program that will keep track of the students enrolling in a school.
    Each student has a distinctive feature – hair style, eye color, skin complexion,
    height, weight and many more. In your OOP program, each student is an object.
    Now, even if the students differ from one another, they share the same list of
    physical features. These attributes or characteristics need to be compiled into
    a master list, which we call a class.


