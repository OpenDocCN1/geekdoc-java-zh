    match the name of the file that holds the program. Note that Java programming
    is case sensitive, which means the compiler distinguishes between lowercase and
    uppercase letters. Also, the filename extension required by the compiler is java.
    Following this programming convention makes it easier to organize and keep track
    of your lines of code. Also, if you change the capitalization or the naming convention,
    the whole program becomes meaningless and will stop working. So for this activity,
    we named it Example.java (since the public class defined by the program is also
    Example).


