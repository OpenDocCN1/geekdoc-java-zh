    \ 可以被轻松修改。\n\n### 私有 (Private)\n\n这种修饰符类型适用于程序中最限制性的字段。它无法被访问，因此也不能被任何命令或函数使用。假设某个特定指令来自未列出的源，它将无法获得识别。\n\
    \n示例：\n\n```\npublic class arcadia extends bay {\n    private int name_of_residents;\n\
