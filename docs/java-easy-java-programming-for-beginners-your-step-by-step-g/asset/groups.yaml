    on how to incorporate Java programs on every web page. The following is a summary
    of how the software language is used in different environments:


    +   * Applet - A type of networked Java program embedded in a Web page that is
    automatically executed by another Java-compatible browser when transmitted over
    the Internet. Usually this is a small program that can display data from the server,
    manage user input or even perform simple functions like a calculator. These functionalities
    are done locally on the client''s computer instead of connecting to the server,
    which means when you click an applet link it will be automatically downloaded
    and run in the browser.


    +   * Servlet - A type of small Java program that supports a browser but runs
    on a different computer or web server to extend its functionality. The introduction
    of the servlet has upgraded the client/server connection.


    +   * JavaServer Page (JSP) - A Web page that consists of fragments of a Java
    program (as opposed to an applet that has the complete program).'
