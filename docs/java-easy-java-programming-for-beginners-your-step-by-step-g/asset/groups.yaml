    # Introduction


    Hi there! Thank you for downloading this eBook. By doing so, you have made a big
    step in investing in your skills as a computer programmer! This eBook presents
    useful information on Java language suited for beginners. I am Felix and I also
    started as an amateur software programmer who has experienced the challenges of
    understanding basic Java terminologies and programming conventions. This eBook
    will then serve as an introduction to understanding the Java language and gear
    you towards your goal of becoming a professional computer programmer. I will be
    teaching you how to install the required Java tools and create simple programs
    in a step-by-step way.


    At first glance, Java may come across as a language that will be hard to comprehend.
    After we get started, you will begin to familiarize yourself with the Java language
    environment and quickly discover that it can be quite simple to learn after all!
    Regardless of your experience with programming languages, this guide will lead
    you in a way that is easy to follow and learn. As you expand your knowledge, the
    more you will appreciate the perks of being a Java programmer.


    Java has always been considered as one of the top, in-demand programming languages
    in the world. If you decide to focus on studying the Java environment, then you
    are looking at a fast growing career. Such technology has been integrated and
    adopted widely in flourishing the World Wide Web, developing mobile apps, building
    websites and more. With its simplicity, readability and flexibility, Java has
    been one of the sought after programming skills in the recruitment market of Information
    Technology. Currently, a Java developer/programmer in the United States of America
    earns an estimated annual salary of $85,000 USD.


    This eBook will definitely serve as your jumpstart if you decide to push a career
    in Java programming. I will provide you a discussion on the characteristics of
    the said software environment, the different components, terminologies, basic
    programming styles and sample programs, among others. You will find that Java
    programming is quite amusing, since it uses the normal English language in coding.
    So, let us get started!


    P.S Don’t forget to download your FREE Bonus video course at the end of this book.
    Enjoy!


    # Chapter One: History of Java


    This chapter will give you a brief history of how Java software came into life,
    starting from the existence of computers. It will also provide you a brief overview
    of the evolution of the various computer programming languages.


    ## The Birth of Computers


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_8_0.png)


    It was not long ago, well maybe around two decades, that there were still typewriters
    to create the documents we need at home, in school or for work. Remember your
    mother''s recipes on index cards, your thesis in college, your resume for job
    application and many more. Then here comes the birth of computer systems that
    made everything a lot easier! Now, with just a click of the mouse or a keystroke
    you have photos printed out to decorate your home, a YouTube video of your high
    school ball, or a visually compelling presentation for work.


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_9_0.png)


    A computer system consists of all the essential components of a computer and how
    they are integrated with one another for the device to function. Such components
    can be classified as hardware or software. Computer hardware pertains to the physical
    part, such as the central processing unit (CPU), mouse, keyboard and monitor,
    among others. Software, on the other hand, refers to the different programs that
    tell the computer what to do. Both hardware and software work hand in hand to
    produce the user''s desired results.


    Since this eBook was written to provide a step-by-step tutorial on Java programming,
    then we will emphasize the software aspect of the computer system. In addition,
    the emergence of the World Wide Web or simply known as the Internet had brought
    forth more innovations in computer programming. The increasing demands of this
    online superhighway when it comes to sharing and communicating information has
    forced programmers to explore the potentials of JAVA programming language.


    ## Evolution of Computer Programming Languages


    - 1954-1957 John Backus with an IBM team developed FORTRAN (considered the first
    modern computer programming language but definitely not user-friendly).

    - 1959 Grace Hopper at Remington Rand developed COBOL (Letter B stands for Business,
    which is COBOL''s primary feature included processing records of customers, employees
    and more).

    - 1972 Dennis Ritchie at AT&T Bell Labs developed the C programming language.

    - 1986 Bjarne Stroustrup at AT&T Bell Labs developed C++ that supported object-oriented
    programming (OOP).

    - 1995 It was exactly on May 23rd that Sun Microsystems released the first official
    version of Java programming language that is considered as an improvement of C++.
    This general-purpose software enables you to build and explore databases, write
    windowed applications and control handheld devices, among others.

