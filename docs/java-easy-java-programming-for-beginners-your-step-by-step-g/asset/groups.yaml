    # 第一章：Java 历史


    本章将为你简述 Java 产生的历史，并介绍计算机编程语言的演变。


    ## 计算机的诞生


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_8_0.png)


    在很久以前，也许是二十年前，人们仍然使用打字机来创建家庭文档、学校作业或工作简历。然后，计算机系统的出现让这一切变得简单多。！现在，只需点击鼠标或按下键盘，你就可以打印出装饰家居、学校论文或工作演示的视觉冲击力作品。


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_9_0.png)


    计算机系统由计算机的所有基本组件组成，以及它们如何集成以运行设备。这些组件可以分为硬件或软件。计算机硬件指的是物理部分，如中央处理器 (CPU)、鼠标、键盘和显示器等。软件指的是告诉计算机如何做什么的不同程序。


    由于本电子书旨在提供 Java 编程的分步教程，因此我们将关注计算机系统的软件方面。此外，万维网（或简称互联网）的出现为计算机编程带来了更多创新。由于这条超级公路在信息共享和通信方面的日益增长的需求，迫使程序员们探索
    Java 编程语言的潜力。


