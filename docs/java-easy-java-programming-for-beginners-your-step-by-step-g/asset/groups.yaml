    Comments are the descriptive parts of the program that explain what the codes
    are all about. They are special sections of text that improve the program’s readability
    - helping people understand the operation of the program. Basically, these are
    the words that humans read but the compiler totally ignores. There are two types
    of comments, depending on how you write them:


    ## 1. One-Line or End-of-Line Comment


    Starting with two slashes, this comment text is short enough to fit on one line.
    It is also written at the end of a line of code. In the previous simple Java program
    example, the one-line comment that we have is:


    ```

    // A Java program begins with a call to main ().

    ```


    Everything is ignored by the compiler starting from the first slash up to the
    end of the line.


    ## 2. Block or Multi-Line Comment


    This type is characterized by multiple one-line comments (meaning, your comment
    text is too long to fit in one line). However, the two slashes are replaced with
    an opening "/*" at the start of the comment and ends with a closing "*/" (to save
    time in writing "/" for every line). Again, the compiler ignores everything between
    the two slashes. In the previous simple Java program example, we have:


    ```

    /*

    * This is a simple Java program

    *

    * Call this file Example.java

    */

    ```


    Prologue is a version of a block comment that is placed at the top or very beginning
    of your programs. It contains important information about the code so that every
    programmer will be able to get an idea what the program is all about just merely
    glancing at it. Usually, the prologue is enclosed in a box of asterisks and includes
    the following information: filename, programmer’s name and program description.
    If we are to modify the block comment above, it will look like this:


    ```

    /****************************************************************

    * Example.java

    * Felix & Schatz

    *

    * This is a simple program that displays "Java is essential to the Web" on your
    PC screen

    *****************************************************************/

    ```


    ### - Class Heading


    We now move to the next line in our first simple Java program:


    ```

    public class Example {

    ```


    This program line is called the class heading or class declaration, which is composed
    of 4 parts – the 3 words and the open curly brace (actually the entire program
    is considered as a class). Let''s discuss each one of them.


    The two words, public and class are what we call reserved words or keywords. Such
    words are used for a particular purpose as defined by the Java language. You cannot
    redefine or use them to mean something else, like making them as names for your
    program. Below is a list of the common keywords in Java language:


    | abstract | assert | boolean | break | Byte |

    |---|---|---|---|---|

    | case | catch | char | class | const |

    | continue | default | do | double | else |

    | enum | extends | final | finally | float |

    | for | goto | if | implements | import |

    | instanceof | int | interface | long | native |

    | new | package | private | protected | public |

    | return | short | static | strictfp | super |

    | switch | synchronized | this | throw | throws |

    | transient | try | void | volatile | while |


    Analyzing each word, **class** is a marker that signifies the start of the class
    or the beginning of the program. It also states that a new class is being defined.
    In our first simple program, **Example** is the name of the class. On the other
    hand, **public** is an access modifier that controls how the class is being accessed
    (in this case, the information can be accessed by all other classes). If it was
    set to **private** instead of public, then only the current class has the access
    to it. Finally, the only curly brace "{" indicates the beginning of the class
    and has a corresponding closing brace "}" at the end of the entire program. Always
    coming in pairs, braces identify groupings of code for both the programmer and
    the computer.


    ### - Main Method''s Heading


    After the class, the main method heading comes next. Method is a subroutine in
    Java language that is the line of code which the program will begin executing.
    It is simply a list of things to do. In our example, the main method has the following
    form:


    ```

    public static void main(String args[]) {

    ```


    Again, **public** is an access modifier keyword, which indicates that everyone
    can access the main method outside the class in which it was defined or declared.
    **Static**, also another reserved word, denotes that the method can be accessed
    immediately. The third reserved word is **void** that signifies the main method
    returns nothing (in some programs it could return a value).


    Any information that is needed to pass to a method is received by variables specified
    within the set of parentheses that follow the name of the method. These variables
    are also called parameters and in our example it is only (**String args[]**. The
    declared parameter named args represents the arguments that the main method takes.
    **String** is the argument''s type that stores sequences of characters. The square
    brackets "[]" symbolizes that it is an array of objects of type strings. Even
    if there are no parameters required, you still need to indicate the empty parentheses.


    ### - System.out.println


    Based on our first simple Java program example, our main method contains the following
    line:


    ```

    System.out.println("Java is essential to the Web");

    ```


    **System.out.println** is a programming code that gives instructions to the computer
    to print something out. Let us discuss every part of it. **System** refers to
    the computer and when it becomes **System.out** it pertains to the monitor, which
    is the output device of the computer system. **println** is a built-in method
    that prints text to the console.

