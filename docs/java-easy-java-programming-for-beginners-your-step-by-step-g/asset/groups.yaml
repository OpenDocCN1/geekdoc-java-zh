    # 第四章：用户输入


    在本章中，我们将引入用户输入的概念并将其整合到 Java 编程语言中。


    基于我们之前讨论的第一个简单 Java 程序，你并没有被为代码执行提供任何形式的输入。代码行只是在计算机屏幕上显示消息。在现实世界中，编程需要用户与机器之间建立稳定的通信。在
    Java 语言中，我们称之为输入/输出或 I/O 流。在这种情况下，创建了一种双向通信，用户为计算机提供输入供其处理，然后产生输出作为反馈。


    ## 获取用户输入


    Java 语言中内置了一个名为 `Scanner` 的类，可以方便地获取用户输入。它的作用是从输入流（无论是键盘还是文件）中获取信息并将其存储在变量中。然而，`Scanner`
    类不是 Java 语言的核心组成部分，因此你需要告诉编译器去哪里找到它。为了使用它，你需要在程序的顶部、紧接序言部分之后包含这行代码：


    ```

    import java.util.Scanner;

    ```


    由于这条额外的语句，`Scanner` 类正从 `java.util` 包中导入。要在程序中调用或执行此类，你需要使用以下语句：


    ```

    Scanner InputVariableName = new Scanner(System.in);

    ```


    现在，导入的 `Scanner` 类被用来初始化一个名为 `InputVariableName` 的变量（你可以将其更改为任何你，但要确保它不是 Java
    关键字）。随后是赋值运算符 `=`，紧接着是编程代码 `new Scanner(System.in)`。这个表达式创建了一个对象，并命令程序将用户输入的值存储在
    `InputVariableName` 中。请注意变量命名的命名规范：单词的首字母始终大写。


    为了让我们能够利用输出流向你显示在程序中输入的内容，我们需要包含以下打印语句：


    ```

    System.out.println(InputVariableName.next());

    ```


    这里包含了 `nextLine()` 方法，它将指示程序返回插入到当前行的字符串值。它还会告诉程序等待直到完成对输入的搜索，因此在你输入某些内容并按下键盘上的
    Enter 键之前，程序不会继续运行。让我们通过包含一个加运算符来进一步修改 `println` 方法：


    ```

    System.out.println("You entered “ + InputVariableName.next());

    ```


    此时，输出语句包含文本信息，该信息将与 `Scanner` 变量一起打印出来。消息是通过括号内的加运算符 `"+"` 组合的。现在，当用户提供输入时（例如输入
    "Johnny"），程序将在计算机屏幕上显示 "You entered Johnny"。


    我们修改后的程序实际上看起来如下：


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_48_0.png)


    从上面的程序中，显示了消息“What is your name?”来提示你输入名字。当你输入名字并按下回车后（参见控制台部分中的绿色文本），程序将在屏幕上的“You
    entered ” 之后显示你的名字。


    本章所描述的用户输入的引入，将 Java 环境呈现为一种双向通信的形式——在软件程序员和计算机之间。你作为用户，将通过执行 Java 代码行提供信息供计算机处理。接下来的章节现在将介绍变量声明的概念。


    ## 第五章：变量声明


    之前，我们声明了一个变量来包含文本用户输入。如果你想创建更复杂的程序，就必须将值存储在变量中。本章将重点关注将变量声明作为你编程风格的一部分。


    指定使用什么类型的变量是在声明语句中完成的，其语法如下：


    ```

    <type> <用逗号分隔的变量列表>

    ```


    示例：


    ```

    int rows, cols;

    String companyName;

    ```


    再次，变量是一个占位符，存储在里面的是值，而存储在变量中的值的类型就是它的类型。查看上面的声明语句，左侧的单词（int, String）指定了右侧变量或多个变量（rows,
    cols, companyName）的类型。顺便说一下，Java 变量只能持有一种类型的值，且其值可以在程序执行期间更改。因此在上面的示例中，`rows`
    和 `cols` 变量只能持有整数，而第二个声明语句 `companyName` 变量只能持有字符串。以下是 Java 语言中的基本变量类型：


    | 类型名称 | 描述 | 值范围 |

    |---|---|---|

    | 整数类型 | | |

    | int (Integer) | - 处理数字的最简单数据类型 - 无小数点 - 不适合高精度数据 - 默认值为 0 | -2147483648 到 2147483647
    |

    | byte | - 数字数据类型中范围最小 - 包含一个 8 位符号二进制补码整数 - 默认值为 0 | -128 到 127 |

    | short | - 包含 16 位符号二进制补码整数 - 默认值为 0 | -32768 到 32767 |

    | long | - 包含 64 位符号二进制补码整数 - 默认值为 0 | -9223372036854775808 到 9223372036854775807
    |

    | 小数类型 float | - 包含 32 位 IEEE 754 数字 - 包含小数点 - 默认值为 0.0f | -3.4 x 10^38 到 3.4
    x 10^38 |

    | double | - 包含 64 位 IEEE 754 数字 - 包含小数点 - 比 float 更精确 - 默认值为 0.0d | -1.8 x 10^308
    到 1.8 x 10^308 |

    | 字符类型 string | - 包含字母数字字符序列 - 默认值为 null | | |

    | char | 接受单个字符作为数据和符号 | 数千个字符 |

    | 逻辑类型 | - 默认值为 \u0000（表示空格） | | |

    | boolean | - 默认值为 False | True, False | |


    请每个每个类型的以下声明语句：


    - int AnyVariable; or int AnyVariable = 0;

    - byte AnyVariable; or byte AnyVariable = 0;

    - short AnyVariable; or short AnyVariable = 0;

    - long AnyVariable; or long AnyVariable = 0L;

    - float AnyVariable; or float AnyVariable = 0.0f;

    - double AnyVariable; or double AnyVariable = 0.0d;

    - String AnyVariable; or String AnyVariable = null;

    - char AnyVariable;

    - Boolean AnyVariable; or Boolean AnyVariable = false;


    '
