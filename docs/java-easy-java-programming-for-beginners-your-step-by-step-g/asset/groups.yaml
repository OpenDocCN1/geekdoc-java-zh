    are three kinds of loops that can perform repetitive tasks. We will also modify
    the simple program to do a countdown from 10 to 11 just to demonstrate the syntax
    for these loops. Again, do not forget the parentheses around the conditions, the
    braces and the indentations.


    While loop – Considered as the simplest kind of "event driven" loop, this statement
    will execute the methods inside the while block as long as the specific conditions
    are met. Depending on the conditions set, this loop may never run even once.


