    - 3. 点击 AGREE AND START FREE DOWNLOAD 按钮。当 Java 下载完成后，你需要关闭所有浏览器并重新加载以启用 Java
    安装。


    - 4. 运行下载的文件，你将看到此界面 ![](img/a5ade960699c3cf9f5e41120c13cbcc_17_0.png)


    - * www.oracle.com/technetwork/java/javase/downloads 下载并安装 Java SE 文档（作为 Javadoc
    页面）


    - 1. 访问网站 www.oracle.com/technetwork/java/javase/downloads，它将带你进入以下界面：


    ![](img/a5ade960699c3cf9f5e41120c13cbcc_18_0.png)


    - 2. 点击此选项


    ![](img/a5ade960699c3cf9f5e41120c13cbcc_18_1.png)


