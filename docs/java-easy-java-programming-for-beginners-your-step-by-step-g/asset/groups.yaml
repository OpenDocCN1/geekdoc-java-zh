    \ and then its value is decremented by 1. After all these lines of code are performed\
    \ or executed then the screen, each value of MyVariableName is displayed, each\
    \ value on a separate line.\n\nIn reality, there are usually a multitude of ways\
    \ to accomplish a certain programming task. However, a good practice as a programmer\
    \ is always to code your programs in an elegant way that entails choosing the\
    \ most appropriate loop. One has the option to be creative and flexible, but this\
    \ sometimes leads to confusion.\n\nThrough this chapter, you have realized that\
    \ Java programming is not only one-directional by integrating flow control through\
    \ various looping statements. In the succeeding chapter, you will have a clearer\
    \ image of what access modifiers are.\n\n## Chapter Eight: Access Modifiers\n\n\
    We have already been talking about Java variables, classes, fields and methods.\
    \ Whenever they are declared you will have to indicate how they are controlled\
    \ and how they are accessed in the entire program. Whether they are restricted\
    \ or not, their accessibility feature will be determined by access modifiers that\
    \ this chapter will take a closer look at.\n\nDeciding on what modifier to use\
    \ depends on your program’s goal and what you are really trying to achieve. The\
    \ following are the different types of modifiers:\n\n### Default\n\nThis is the\
    \ type that is assigned when there is no access modifier specified. Due to its\
    \ absence, any command or function access a part of the program. However, its\
    \ availability is only limited to access by fields that belong to a similar package.\
    \ A program without a modifier can look effective but not quite clean. The level\
    \ of access is usually open to the public but it is not included in an interface.\n\
    \nExample:\n\n```\nString version = \" 1.00.1\"\n```\n\n```\nBoolean process_order\
    \ () {\n    return true\n}\n```\n\nIn this example, the program declared a string\
    \ order version at the beginning. Since a specific type of access modifier is\
    \ undefined, any command or function can be used to access the program component.\
    \ Therefore, **process_order** can be modified easily.\n\n### Private\n\nThis\
    \ is the type of modifier that accommodates the most restrictive fields in the\
    \ program. It cannot be accessed, thus, cannot also be used by any command or\
    \ function. Let's say a particular instruction is from an unlisted source, it\
    \ cannot be granted recognition.\n\nExample:\n\n```\npublic class arcadia extends\
    \ bay {\n    private int name_of_residents;\n    private boolean in_city\n\n \
    \   public arcadia () {\n        name_of_residents = joy;\n        in_city = false;\n\
    \    }\n\n    private void shrill () {\n        system.out.println(quiet);\n \
    \   }\n\n    public void action () {\n        system.out.println (talk);\n   \
    \ }\n}\n```\n\nFor this example, the program defined a public class arcadia, which\
    \ is allowed an extensive function bay. Although arcadia bay is set to public,\
    \ some of its internal properties are set to private. In addition, since one of\
    \ its internal components (action) is set to public, it can be acknowledged by\
    \ different fields.\n\n### Public\n\nThis is the type of modifier that allows\
    \ access from any other field. With a public access level, it is less troublesome\
    \ for a programmer to visit other parts of his work. All the commands, functions\
    \ and different components of the program belonging to the public class can be\
    \ accessed through a recognized set of instructions in Java programming language.\
    \ However, being publicly declared has some drawbacks or limitations. Even if\
    \ all the commands and functions are set to public, they cannot be accessed by\
    \ classes that belong to a different package.\n\nExample:\n\n```\npublic static\
    \ void main(String arguments) {\n}\n```\n\n### Protected\n\nThis type of access\
    \ modifier belongs to what we call a superclass and is characterized by being\
    \ less hidden and secure compared to the default type. It also signifies two things:\n\
    \n- it can only be accessed by the fields that are declared in a particular superclass\n\
    - it can only be accessed by the subclasses of a similar package\n\nSuch categorization\
    \ is implemented to improve program structure while limiting the access of an\
    \ irrelevant element. Protected access modifiers also impose strict protocols\
    \ and the application is limited (cannot be applied to classes and interfaces).\
    \ If a field is not connected to any class or interface, then it can be declared\
    \ as protected.\n\nExample:\n\n```\nclass seven_fields {\n    protected boolean\
    \ open_fields(field1 sp) {\n        // implementation\n    }\n    Class opening_seven_fields(field1\
    \ sp) {\n        // implementation\n    }\n}\n```\n\nIn this example, class seven_fields\
    \ was declared and since it is under the protected access modifier, its Boolean\
    \ logic open_fields is inaccessible with the use of just any function or command.\
    \ Unless a new access modifier is declared, this particular part of the program\
    \ cannot be modified.\n\nYou have learned from this chapter that whatever you\
    \ want to achieve in developing a Java program will determine the appropriate\
    \ type of access modifier to be used. Each of the four types of access modifiers\
    \ has its own characteristic and functionality that will affect how objects are\
    \ accessed in a given Java program. We will now take a closer look at the possible\
    \ class variables and objects in the next chapter.\n\n## Chapter Nine: Classes\
    \ and Objects\n\nYou have already been encountering Java classes and objects at\
    \ this point in the previous chapters of this eBook. At this point in time, you\
    \ will gain more knowledge on the available class variables and objects that you\
    \ can employ to achieve the desired results of why you are programming in a Java\
    \ environment.\n\n### Classes\n\nActing as blueprints of a Java program, classes\
    \ are templates that describe the characteristics of an element or method. Basically,\
    \ they are generic elements in Java programming. They also help a programmer to\
    \ understand the coding system of another programmer, making its structure clear.\
    \ Classes exist in the program as long as they desire, meaning they do not have\
    \ a lifespan.\n\nThe following is a list of possible class variables:\n\n- Class\
    \ - A class is a variable that needs to be declared before it enters a class,\
    \ which can be found within any class and outside any method.\n- Instance - Instance\
    \ is a variable that remains within a particular class but is outside a method.\
    \ However, it is accessible from any other method once declared.\n- Local - Local\
    \ is a variable that is defined inside any method in the program and requires\
    \ initial declaration and acknowledgement. It is omitted after it has executed\
    \ the command or function.\n\n### Objects\n\nJava objects are elements that possess\
    \ behaviors and states. When elements are defined, they come with their own unique\
