  md: '# Logical Operators


    These operators, also called comparison operators, permit a degree of flow control
    by comparing two values or set specific conditions. A Boolean value can be returned,
    depending on the two values compared, that will determine whether a certain block
    of code will be executed or not. This is the most basic form of logic in a computer
    program.


    +   - Is Equal to (==) Checks if two values are equal


    +   - Is Not Equal to (!= Checks if two values are not equal


    +   - Is Greater than (>) Checks if the value to the left of the operator is greater
    than the value to its right


    +   - Is Less than (<) Checks if the value to the left of the operator is less
    than the value to its right


    +   - Is Greater than or Equal (>=) Checks if the value to the left of the operator
    is greater than equal to the value to its right


    +   - Is Less than or Equal (<=) Checks if the value to the left of the operator
    is less than equal to the value to its right


    +   - Logical AND (&&) Checks if both values are true


    +   - Logical OR (||) Checks if at least one of the values is true'
