  md: '# Bit Wise Operators


    These operators manipulate variables at the bit level in a primitive yet fast
    way. Since they analyze binary numerals, which are the smallest unit of addressable
    memory, they process execution in the quickest way possible.


    +   - And (&) - A 2 equal-length binary operator that performs with the logic
    operator "AND" and multiplies both elements with bits

    - Not (~) - A unary operator that performs with the goal of logical negation and
    complements the binary value of ones

    - Or (|) - An operator that takes 2-bit patterns whose lengths are equal and performs
    with the logic operator "OR" (results are either 0 or 1)

    - Xor (^) - An operator that takes 2-bit patterns whose lengths are equal (results
    are expected to be defined with a similar digit


    Now that you have learned how to manipulate operators, you will be more adept
    in understanding and automating more complex Java programs. Another programming
    feature that will be introduced in the next chapter is flow control, which demonstrates
    non-sequential lines of codes.'
