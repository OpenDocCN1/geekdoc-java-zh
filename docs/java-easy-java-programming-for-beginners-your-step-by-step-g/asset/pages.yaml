    In this new set of programming codes, the condition tested is **if if** the value
    of the user input **MyVariableName** provided is less than 18 or not. If it is,
    then the methods in the **if block** will be executed - displaying a message on
    the computer screen that the user is a minor (check the figure above). A block
    is also called a compound statement. Otherwise, the **else block** will be executed
    – notifying the user that is not a minor anymore (check the figure below). The
    **else block** is actually optional, meaning without its codes the program will
    proceed to the rest of the class in case the condition is not met. Please take
    note that the parentheses around the condition and the braces surrounding the
    statements that are inside the **if** and **else blocks**, are all required. Also
    notice the indentation of the statements these symbols enclose.'
