  md: '# Loops


    This flow control statement allows methods to be executed over and over again
    as long as the specific conditions are met. In Java programming language, there
    are three kinds of loops that can perform repetitive tasks. We will also modify
    the simple program to do a countdown from 10 to 11 just to demonstrate the syntax
    for these loops. Again, do not forget the parentheses around the conditions, the
    braces and the indentations.


    While loop – Considered as the simplest kind of "event driven" loop, this statement
    will execute the methods inside the while block as long as the specific conditions
    are met. Depending on the conditions set, this loop may never run even once.


    ![](img/a5ade960699c3cf9f5e411120c13cbcc_61_0.png)'
  merge: -1
  pgno: 61
- img_proc: true
  md: '![](img/a5ade960699c3cf9f5e411120c13cbcc_62_0.png)


    In the program example above, the MyVariableName was first set to a value of 10.
    Next, the loop will check that while the variable is greater than 0, the program
    will display the value of the MyVariableName in every new line and then decrement
    it by 1. This will continue to run until MyVariableName is equal to 0. If at the
    start of program execution, the value of MyVariableName is already equal or less
    than 0, then the while loop will be bypassed.


    Do-while loop – The main difference between this and a while loop is that the
    methods inside the do-while loop is sure to run at least once before the condition
    is checked. In contrast with the while loop, the do loop''s condition is indicated
    at the bottom (this is the primary reason why the loop statement is executed at
    least one time)'
  merge: -1
