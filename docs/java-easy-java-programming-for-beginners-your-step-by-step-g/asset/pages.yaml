  md: '# Chapter Six: Operators


    This chapter will describe the available operators that you can add to your lines
    of code as you program more complex scenarios. Operators are mainly used to control,
    modify and compare data in a Java language environment.


    Since the beginning of this book, we have already been using the equal sign (=)
    or the assignment operator, which works by assigning a compatible value into a
    variable. In addition, arithmetic operators are used to control the value that
    will be assigned to a variable. If you can remember the mathematical operators
    you have learned in school, they will be the same operators you will need to perform
    mathematical computation in Java programming. Gaining the knowledge on how to
    use operators is an important requirement. All you need to understand are the
    symbols for each operator and their functions.


    # Arithmetic Operators


    These are the most basic form of operators apart from the assignment operator.


    +   - Additive Operator (+) – Returns the sum of two values


    +   - Subtractive Operator (-) – Returns the difference of two values


    +   - Multiplicative Operator (*) – Returns the product of two values'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Divisive Operator (/) - Returns the quotient of two values


    Remainder Operator (%) - Returns the remainder of values being divided


    # Increment/Decrement Operators


    These operators increase or decrease the value of the variable by 1.


    Increment (++) - Increase the value by 1


    Decrement (--) - Decrease the value by 1


    They can also be used as a prefix or preincrement operator where "++" is placed
    before the variable. This means that 1 is added to the variable''s value before
    it being used in any other part of the program (the value will be adjusted immediately
    when used). When "++" is placed after the variable then it becomes a postfix or
    postincrement operator. This time, 1 is added to the variable''s value after the
    variable is used in any other part of the program (the value will be returned
    first before it is adjusted).


    Example:


    ```

    MyVariableName = 23; - returned value is still 23

    ```


    ```

    MyVariableName++; - returned value is adjusted to 24

    ```


    ```

    ++MyVariableName;

    ```'
