  md: '# Chapter Seven: Flow Control


    This chapter will emphasize on a non-sequential method of Java programming. You
    will get acquainted with the if-then-else and different loop statements.


    With our previous simple program examples, we were oriented at a Java class is
    executed in one direction – from the topmost line of code to the bottom, or what
    we call sequential programming. However, there will be cases that you will be
    required to write codes in a non-sequential fashion, especially for those more
    complicated scenarios. This is accomplished using logical and looping statements,
    so you can control the flow of your program to perform more complex functions.


    # If-Then-Else


    This is the most basic flow control statement that uses logical operators to determine
    whether or not a specific condition is fulfilled. Let us add an if-then-else statement
    to our first simple java program that will display whether the user is a minor
    or not based on the age that he has provided. By the way, in this example, one
    is considered a minor if the age is below 18 years old.'
  merge: -1
