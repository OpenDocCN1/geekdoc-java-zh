    like dots, squiggles and more.


    # Java Virtual Machine (JVM)


    If the compiler is responsible for writing the Java bytecode, then the Java Virtual
    Machine is in-charge of deciphering it. In reality, each kind of computer processor
    has its own set of executable instructions that are interpreted by each operating
    system in a slightly different way. Let’s take a look at the two programs below
    for two different processors but will display the same output on the computer
    screen – “Hello world!


    # Simple Program- Pentium Processor


    ```

    .data

    msg:

    .ascii "Hello, world!\n"

    len = . - msg

    .text

    global _start

    _start:

    mov $len,%edx

    mov $msg,%ecx

    mov $1,%ebx

    mov $4,%eax

    int $0x80

    mov $0,%ebx

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: '```

    movl $1,%eax

    int $0x80

    ```


    # Simple Program- Powerpc Processor


    .data


    msg:


    .string "Hello, world!\n"


    len = . - msg


    .text


    .global _start


    _start:


    ```

    li 0,4

    li 3,1

    ```


    ```

    lis 4,msg@ha

    addi 4,4,msg@l

    li 5,len

    sc

    ```


    ```

    li 0,1

    li 3,1

    sc

    ```


    These two programs ought to display the same results but they cannot be interchanged,
    for the instructions will mean nothing when they are run by the wrong processor.
    You will either get notification or'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'error messages like “Not a valid Win32 application” or “Windows can’t open
    this file.” That is why, with the help of Java Virtual Machine, these Java bytecodes
    create order in this chaotic world of programming! JVM acts like an interpreter
    that translates bytecodes for any computer system to comprehend. Thus, you do
    not have to worry because whether it is your computer or your friend’s one, both
    will be able to run by the bytecode. Thus, Java language has solved the issue
    of portability and versatility through JVM.


    # Integrated Development Environment


