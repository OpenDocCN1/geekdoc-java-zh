    of comments, depending on how you write them:


    # 1. One-Line or End-of-Line Comment


    Starting with two slashes, this comment text is short enough to fit on one line.
    It is also written at the end of a line of code. In the previous simple Java program
    example, the one-line comment that we have is:


    ```

    // A Java program begins with a call to main ().

    ```


    Everything is ignored by the compiler starting from the first slash up to the
    end of the line.


    # 2. Block or Multi-Line Comment


    This type is characterized by multiple one-line comments (meaning, your comment
    text is too long to fit in one line). However, the two slashes are replaced with
    an opening "/*" at the start of the comment and ends with a closing "*/" (to save
    time in writing "/" for every line). Again, the compiler ignores everything between
    the two slashes. In the previous simple Java program example, we have:


    ```

