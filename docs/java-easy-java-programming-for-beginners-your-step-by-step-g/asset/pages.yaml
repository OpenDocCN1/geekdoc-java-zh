    code, another for running the program, and maybe a third one to keep track of
    all the codes you have written. What a messy situation! With the emergence of
    the integrated development environment (IDE) all of the functionalities were seamlessly
    combined into a single well-organized application.


    Below are some of the most popular Java IDEs that can be downloaded online for
    free (their features may vary but still the language remains exactly the same):


