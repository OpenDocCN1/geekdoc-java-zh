  md: "# Required Java Tools\n\nBelow are the different tools needed in Java programming\
    \ that can be downloaded online for free:\n\n+   - Compiler\n\nA compiler turns\
    \ the Java code you write into something that can be understood and run on your\
    \ computer. Computers do not comprehend instructions same like humans. For example,\
    \ check the program code below:\n\nLooking for an available rental car:\n\n```\n\
    // This is part of a Java program\n// (not a complete Java program)\nrentalcarNum\
    \ = 1;\nwhile (rentalcarNum < 100) {\n    if (client[rentalcarNum] == 0) {\n \
    \       out.println(\"Car \" + rentalcarNum + \" is available.\");\n        exit(0);\n\
    \    } else {\n        rentalcarNum++;\n    }\nout.println(\"All cars or vehicles\
    \ are rented out\");\n```\n\nThis basic Java code searches for any available rental\
    \ car or vehicle for a certain client, assuming the company has 99 cars in total.\
    \ You cannot run this code by just typing as it is. However, ignoring the strange\
    \ punctuations and typing format,"
  merge: -1
  pgno: 26
- img_proc: true
  md: 'human beings are able to grasp what it wants the computer to do:


    +   Set the rental car number to 1.

    As long as the rental car number is less than 100,

    Check the number of clients that rented the car.

    If the number of clients that rented the car is 0,

    then report that the car is available,

    and stop.

    Otherwise,

    prepare to check the next car by

    adding 1 to rental car number.

    If you get to the non-existent rental car number 100,

    report that all cars or vehicles were rented out.


    As for computers, they do not follow English-translated instructions to do a specific
    task. Instead, they understand cryptic Java bytecode commands. This is where the
    compiler comes in. After writing your Java source code, it is being translated
    and written by the compiler into Java bytecode that the computer can execute.
    Check bytecode counterpart below for the same Java code:


    ```

    aload_0

    icost_1

    putfield Company/ rentalcarNum I

    goto 32

    aload_0

    getfield Company/client [|

    aload_0

    getfield Company/rentalcarNum I

    iaload

    ifne 26

    ```'
