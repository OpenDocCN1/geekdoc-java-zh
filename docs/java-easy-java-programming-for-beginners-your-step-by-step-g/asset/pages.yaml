    \    }\n}\n```\n\nIn the program example above, again, the variable MyVariableName\
    \ was first set to a value of 10. In the succeeding loop statement, no condition\
    \ is checked yet. Instead, the do block will have to display the value of MyVariableName\
    \ in every new line and then decrement it by 1 before the while condition is checked.\
    \ This is what was discussed earlier that loop will run once once or not the conditions\
    \ are met. Please take note of the semicolon at the right of the condition.\n\n\
    For loop – This statement is declared with specific parameters control as to when\
    \ or how many times the methods are to be executed. Variables that can be used\
    \ to control the loop may be declared simultaneously within the loop itself. The\
    \ form of the for loop statement is:\n\nfor (initialization; condition; iteration)\
    \ statement;\n\nThe initialization part sets a loop variable to an initial value.\
    \ The condition is a Boolean expression that tests the loop control variable whether\
    \ it is true or false. If the result of that test is true, then the execution\
    \ of the loop is continuously repeated. If it is false, then the loop stops."
