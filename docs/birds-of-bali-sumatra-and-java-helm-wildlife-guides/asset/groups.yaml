    # 如何使用本书


    照片尽可能描绘了鸟类常见形态中的形态，无论是雄性还是雌性，并在文中简要描述了变异。书中涵盖的 322 种鸟类的顺序和命名通常遵循由 Avibase – 世界鸟类数据库所采用的国际鸟类学界
    (IOC) 分类法，以及康奈尔鸟类学实验室的现用术语。虽然存在其他清单，但基于更近期科学知识的修订过程将持续进行。在本书编写期间，国际鸟类学家联盟 (IOU)
    正致力于一项共同努力，成立鸟类清单工作组 (WGAC)，旨在编制并维护一份开放获取的全球鸟物种清单，以统一分类法。因此，可以预料不仅学名将变得更加可靠。书中使用的名称遵循了
    Eaton, J.A., van Balen, B., Brickle, N.W. 和 Rheandt, F.E. 所著第二版《印度尼西亚群岛的鸟类：大巽他岛和瓦拉西亚》（2021）中所含最新科学数据。


    每个物种的描述都包括英文名称、学名，以及已知的正式印尼语名称。作为体型指南，提供了该物种从喙尖到尾末的总体长度。其余描述未遵循任何特定顺序，但提供了进行相当可靠识别所需的大多数线索。只有少数物种尝试描述了鸣叫声和歌声，因为人们认为如果没有听过实际声音的经验，这些描述是毫无意义的。尽管如此，声音的价值不应被低估。在许多情况下，它是成功识别物种的唯一决定因素。大部分描述不可避免是简短的，并使用大多数鸟类书籍采用的半技术语言编写，但为了方便理解，鸟类学家所使用的许多技术术语在第
    218 页的词表中进行了解释。


    # 关于照片的说明


    除非另有说明，所有图像显示的都是成年羽色。请参考下方的索引获取更多信息：


    - male – 雄性 – female – 雌性

    - imm. – 未成年

    - ju. – 幼鸟（亚成）

    - var. – 变种

    - non br. – 非繁殖期


    爪哇、苏门答腊和巴厘岛位于东南亚板块的边缘，该板块压在澳洲-印度板块之上，产生了剧烈的地质活动。一排火山（部分仍然活跃，其他处于休眠状态）沿岛屿链形成了脊线。在苏门答腊，这些火山形成了巴里桑山脉，横跨整个岛屿，并在西部陡峭没入深海；在东部，坡度较缓，在到达巽达海之前形成了大片沼泽区。在爪哇岛，山脉从冲积平原孤立升起，而在苏门答腊东部，向巽达海方向倾斜。


    巴厘岛曾通过陆桥与爪哇岛相连，但现在被 3 公里的湍急水域隔开，这些水以激流闻名。并不意外，巴厘岛的动植物与爪哇岛部具有相似性。然而，苏门答腊与婆罗洲的关系比爪哇岛更为密切。陆地的破碎结合地质和气候活动导致了许多栖息地的形成，反过来支持丰富的野生动物多样性。这包括许多特有种：即仅局限于单一区域或更小区域且在其他地方未发现。


    爪哇岛和巴厘岛是地球上人口密度最高的地区之一，剩余野生动物栖息地的破坏是一个严重关注的问题。只有在偏远的山坡上才能找到大片自然森林。少数国家公园和自然保护区内存有低地森林。苏门答腊的人口密度仅为十分之一，情况略好，但农业、种植和林业的增长导致了其森林破坏的增加。


    # 鸟类


    我们可能会预计这些在不同时期与亚洲大陆相连的陆地具有相似的植物群。然而，由于它们并非同时分离，而且由于随后的局部气候条件各异，鸟类的组成在不同岛屿之间存在显著差异。最近最剧烈的变化是由人类及其对低地森林的破坏造成的。有追溯到
    1657 年的大量记录，从 19 世纪早期创立印尼鸟类学的探险家的报告中看出，当时的鸟类比现在丰富得多。


    # 何时以及哪里寻找鸟


    由于该地区靠近赤道，气候炎热。该地区的季风天气概括为雨季和旱季，两者的温度差异不大。尽管如此，鸟类表现出明显的繁殖周期。在雨季（10 月至次年 3 月），大量北方迁徙候鸟抵达，较少的澳洲物种在旱季出现。


    许多水鸟在雨季末尾到达，在淹没景观中孤立树木的安全处筑巢。这也是昆虫繁殖季节的高峰，此时充足的食物供食虫物种抚养幼雏。食果物种则推迟繁殖，直到树木和灌木结出成熟果。


    整个地区遍布着栖息地多样性丰富的良好区域。显然，在如此规模的书中列出所有区域是不可能的，但为了引导观鸟者，下方列出了这些主要区域。


    # 观鸟地点


    ## 巴厘岛


    ### 巴厘西国家公园

    位于巴厘岛西部，是干旱森林、湿润森林与沿海灌木丛和树林的混合体。这里可以观察到带雨纹的、黑色的、以及许多巴厘岛特有的鸟类。


    ### 丁勿西-塞布拉国家公园

    该公园包含了丁勿西山峰和丁勿西山谷，是观察苏门答腊山地鸟类的理想地点，如红冠嘴��、红冠凤�� Setup，以及丁勿西山峰。


    ### 尼尼达岛

    尼尼达岛位于巴厘岛东部，严格来说在巴厘岛。在这里你可以看到柠檬腹白眼和巴厘岛特有种。


    ### 坎巴斯国家公园

    位于苏门答腊南部，包含了低地森林和沿海森林。这里记录了许多物种，包括白翅鸭、风暴驸、黑冠嘴��，以及红冠凤鹶。


    ## 苏门答腊


    ### 格奴木勒瑟国家公园

    这是一个巨大的雨林和山脉区，带有小片沿海延伸。这里是探索苏门答腊北部鸟类的理想地点，如带纹的、黑色的（亚洲）斑鸠，以及冠嘴嘴��和金嘴嘴�。延伸到格鲁普隆山，包含了所有的森林类型和一些非常原始的区域。这里相对较少访问，但可能会带来惊喜。该地区的稀有鸟类包括苏门答腊画尾鸟、冠嘴嘴��、红嘴凤鹶和小嘴鹳类。


    ### 贝尔巴克国家公园

    该保护区位于东岸，包含了沿海森林和泥炭沼泽，以及红树林。这里是观察布蒂克嘴��、华莱莱雕和小鹳类的好区域。


    ## 爪哇岛


    ### 乌戎隆国家公园

    位于爪哇岛的最西端，乌戎隆拥有了多种栖息地的稀有物种，从低地雨林和常绿森林到沿海灌木丛、红树林和开阔草场。那里有 24 种特有或濒危物种，包括爪哇大嘴鸟、白胸嘴��、爪哇太阳鸟、爪哇雕、蓝喉嘴��和绿孔雀。


