    ## Javan Banded Pitta *Hydrornis guajanus* 20–23cm


    A beautiful ground-living bird with a distinctive plumage, including a black head
    with a long, broad yellow eyebrow. The upperparts and wing-covers are plain brown,
    the rump and tail blue. The wings are dark brown and have a thin white wing-bar.
    The chin and throat are yellow–white bounded below by a dark blue band.


    The remainder of the breast and underparts are finely barred yellow and black.
    Legs are pale purple-grey, the bill is black and iris very dark brown.


    **Where to see:** Occurs on Java and Bali, inhabiting mainly lowland forest and
    shaded dense thickets


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_114_0.png)


    ## Asian Hooded Pitta *Pitta sordida* 16–18cm


    Indonesian name: Paok Hijau


    This bird hops around foraging for insects among the leaf litter and rotting wood
    on the forest floor. It is a plump, medium-sized pitta with long legs. Residents
    have green plumage with a black head, blue-grey wing-coverts, and crimson undertail-coverts
    and lower belly. The bill is black, and the legs are pinkish. Migrants (*P.s.
    cucullata*) have a dark-brown cap and more black on the belly. If disturbed, it
    flies close to the ground with rapid wingbeats, revealing conspicuous rounded
    white patches on the wings.


    **Where to see:** Occurs in the swamp forests of Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_115_0.png)


    *P.s. cucullata*


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_115_1.png)


    *P.s. mulleri*


    ## Blue-winged Pitta *Pitta moluccensis* 18–20cm


    Indonesian name: Paok Hujan


    This very colourful pitta is distinguished by its bright blue wing patch. The
    primary wing feathers are black with broad white tips. The upparts are green over
    the mantle and turquoise-blue at the rump. A short, black tail is tipped blue-green.
    The throat is white and underparts pale cinnamon. A bright red central belly extends
    to the undertail-coverts. The pale chestnut crown and supercilium contrast with
    a broad black stripe extending from the lores across the nape. The iris is brown
    and bill black. Feet are pinkish.


    **Where to see:** A non-breeding winter migrant to Sumatra, occupying a variety
    of habitats, from forests to city parkland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_116_0.png)


    ## Wallace’s Elegant Pitta *Pitta concinna* 19cm


    Indonesian name: Paok Wallace


    Wallace’s Elegant Pitta has chin and head black to the nape, with an orange head
    stripe extending lengthways above the eye from the lores and becoming white at
    the nape. The upperparts are green tinged brown. The rump is blue and the black
    tail is green-tipped. The flight feathers are black with the green wing-covers
    showing a blue shoulder patch. The underparts are orange-buff with a central black
    streak leading to a red vent. The bill is black, the iris brown and the feet pale
    red-brown.


    **Where to see:** Occurs in woodland and scrub on Nusa Penida, Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_116_1.png)


    ## Brown Honeyeater *Lichmera indistincta* 15cm


    Indonesian name: Isap-madu Australia


    Upperparts dark grey tinted olive, showing grey at the crown. Underparts are whitish
    on the throat becoming light grey on the breast and buff light tinted olive towards
    the undertail-coverts. Flight and tail feathers are grey edged yellow-olive. There
    is a blackish loral stripe and a ring of dark grey bare skin, broader behind the
    eye, which surrounds a dark-brown iris. The bill is black and legs are dark grey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_117_0.png)


    **Where to see:** Occurs in mangrove scrub and forest on Bali, often close to
    human habitation.


    ## Golden-bellied Gerygone *Gerygone sulphurea* 9–10cm


    Indonesian name: Remetuk Laut


    This is the only Australian fairy-warbler in the region. Its upperparts are brown-tinted
    grey and its underparts bright yellow. The chin and neck are white, and it often
    shows a whitish loral spot. The dark grey-brown tail is tipped black, with a subterminal
    line of white spots. Its bill and legs are dark grey. Juveniles are paler generally
    and have a pale eye-ring.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_117_1.png)


    **Where to see:** Resident throughout the region, occurring in open forest, bamboo
    and conifer thickets, mangroves and even plantations.


    ## Small Minivet *Pericrocotus cinnamomeus* 14–16cm


    Indonesian name: Sepah Kecil


    The head, mantle and upper back are grey, with rump, vent and outer tail orange.
    The long central tail feathers are black, and the black wings have a prominent
    yellow-orange patch. Males have a black throat and red to belly; females are paler,
    with a whitish throat and breast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_118_0.png)


    **Where to see:** Occurs on Java and Bali, where it inhabits more open forest
    and trees around cultivated land, gardens and mangroves.


    ## Sunda Minivet *Pericrocotus miniatus* 20cm


    Indonesian name: Sepah Gunung


    The male’s head, neck, mantle, undertail-coverts and lesser wing-coverts are black
    with a blue sheen. The black wing primaries are partially banded-red and along
    with the red greater wing-coverts give the impression of a wing-bar. The breast,
    belly, lower back and tail-coverts are also scarlet. Females have a red supercilium,
    red chin and cheeks; reddish mantle.


    **Where to see:** Occurs in the montane forests of Java and west Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_118_1.png)


    ## Scarlet Minivet *Pericrocotus flammeus* 19cm


    Indonesian name: Sepah Hutan


    The male''s head and mantle are jet-black with a blue sheen, and the underparts,
    rump and outer edges of the tail are red. The mainly black wing has two distinct
    patches. The female has a grey crown and upperparts, with yellow to orange underparts
    including chin and ear-coverts, leaving a suggestion of a grey eye-stripe. She
    has two wing patches, and her rump is grey-green.


    **Where to see:** Occurs throughout the region. A forest-dwelling bird, usually
    foraging in the treetops in small groups.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_119_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_119_1.png)


    ## Javan Cuckoshrike *Coracina javensis* 28cm


    Indonesian name: Kepadang-sungu Jawa


    The male has generally grey plumage apart from the white tip to the blackish tail
    and white edges to the dark grey wings. The grey on the belly fades almost at
    the vent. The ear-covers and face are dark grey. Females are similar but paler,
    with grey-barred underparts and flanks. It should not be confused with the very
    similar but smaller Sunda Cuckoshrike (*C. larva*), which occurs alongside this
    species at some elevations.


    **Where to see:** Occurs in more forested and grassy regions of Java and Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_120_0.png)


    ## Lesueur''s Thriller *Lalage sueurii* 17–18cm


    Indonesian name: Kapasan Sayap-putih


    Males are predominantly black and white and females brown above and buff below.
    The top of the male''s head and upperparts have greenish iridescence. There is
    a thin white supercilium under which a black eyestine passes through the eye to
    meet the black nape. The rump and lowerail coverts are grey and the white upperwing-coverts
    form a white panel. The underparts, including the throat and ear-coverts, are
    white.


    **Where to see:** Occurs in Central and East Java and Bali, usually in open forest
    and often occurring close to human settlements.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_120_1.png)


    ## Pied Thriller *Lalage nigra* 16–18cm


    Indonesian name: Kapasan Kemiri


    The truly pied male is black from forehead to crown and nape over the mantle,
    then grey on the uppermost-coverts. A black eye-stripe passes from the lores to
    the nape, over which is a broad white supercilium. The head is white below the
    eye-stripe along with the chin and remaining underparts. The wing feathers are
    black apart from a broad white patch across the median and greater covers. The
    secondaries are black bordered white. Females have a brown crown and mantle and
    buff, lightly barred brown breast.


    **Where to see:** Occurs throughout the region''s coastal mangrove and open scrubland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_121_0.png)


    ## Lesser Cicabird *Lalage fimbriata* 19–21cm


    Indonesian name: Kepudang-sungu Kecil


    This small cuckoshrike has dark grey plumage, darker above and paler on the rump.
    The lores, ear-coverts and wings are blackish and the undercoverts pale grey.
    The bill and legs are black and the iris brown. Females are paler, with black
    barring on the underparts.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_121_1.png)


    **Where to see:** Occurs throughout the region. Found in lowland forest, swamp
    forest and cultivated land, where feeds on insects.

