  - '[PAGE 38]


    # Sunda Brush Cuckoo Cacomantis sepulcralis 21–28cm


    Indonesian name: Wiwik Ucuing


    Adults are grey above with a grey head. The wings are grey-brown, slightly glossed
    green. The tail feathers are black with white tips and what appear as white horizontal
    V-shaped patches along their outer edges. The chin is grey above a plain upper
    breast becoming paler towards the vent. The iris is brown and the eye-ring bright
    yellow, the feet are yellow-buff and the bill is black, occasionally yellow below.
    Females show slight grey barring on the lower breast. Juveniles are duller with
    brown-barred plumage.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_38_0.png)


    **Where to see:** Occurs throughout the region, usually at forest edges and in
    isolated mangroves.


    # Drongo Cuckoo Surniculus lugubris 23–25cm


    Indonesian name: Kedasi-hitam


    This mainly black cuckoo has a square-cut forked tail like a drongo. Its upperparts
    are shiny black with brownish-black underparts, apart from white bands on the
    undertail-covers and all-white thighs. The bill is black, the legs are grey and
    the iris is grey-brown. Females are duller with yellow irises. Juveniles are similar
    but spotted white on the head, breast and wings. Its loud, clear calls are an
    ascending scale of warbled notes.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_38_1.png)


    **Where to see:** Occurs in lowland forests throughout the region.'
  - '[PAGE 39]


    # Large Hawk-cuckoo Hierocococcyx sparvervioides 38–40cm

    Indonesian name: Kangkok Besar


    The adult of this, the largest of the hawk-cuckoos, has brown upperparts and a
    brown-barred tail with blackish subterminal band and fine white tip. The head
    is grey with a prominent yellow eye-ring and an orange iris. There is no white
    nape like other hawk-cuckoos. The upper breast and belly are white-buff heavily
    streaked and barred brown, with the upper breast tinged russet. The lower belly
    and vent are buff-white. The upper mandible is blackish and lower mandible black
    to yellow at the base. Legs are orange-yellow.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_39_0.png)


    Where to see: Occurs throughout the region, mainly in lowland woods and scrub,
    occasionally close to cultivation.


    # Common Cuckoo *Cuculus canorus* 32–34cm

    Indonesian name: Kangkok Erasia


    Adults are dark grey above with paler grey nape, crown, chin and upper breast.
    The breast and belly are white, thinly barred black and becoming


    more russet at the vent. The blackish tail feathers are spotted and tipped white.
    The iris is orange to light brown encircled by a yellow eye-ring. Legs and feet
    are yellow. Bill black above and yellow below, becoming darker at the base. Females
    generally show a warmer colouring to the breast but also occur in a reddish-brown
    (hepatic) form, in which the rump and uppermostparts are rufous and upperparts
    show black and brown barring,


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_39_1.png)


