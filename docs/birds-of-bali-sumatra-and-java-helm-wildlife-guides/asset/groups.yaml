    ## 印度尼西亚红隼 *Falco moluccensis* 26–32cm


    印尼语名称：Alap-alap Sapi


    雄性具有栗色上体，布有密集的深棕色斑点并延伸至翅膀。头部顶部、颈部和胸部颜色偏向黄栗色，斑点呈条纹状。灰色的虹膜周围有黄色的眼环和一圈裸露的黄色皮肤。蜡质部为黄色，喙为灰色，腿为黄色并带有黑色爪子。尾下覆羽为褐色，过渡到浅灰色尾羽，尾羽有一条宽的黑色末端带和白色尖端。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_106_0.png)


    可见：出现在爪哇岛和巴厘岛的开阔栖息地，通常靠近人类居住区。


    ## 东方隼 *Falco severus* 27–30cm


    印尼语名称：Alap-alap Macan


    上体呈黑色，下体为栗色，胸部和腹部颜色较深，向泄门变浅并呈黄褐色。下巴和喉部为白色，但通常呈浅栗色。足、蜡质部和眼眶为黄色。幼鸟的上体相似，但下体为褐色并布有密集的棕色条纹。不同地区存在颜色差异；巴厘岛的颜色较深，苏答腊岛的较浅。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_106_1.png)


    可见：出现在巴厘岛、爪哇岛和苏答腊东部的开阔林地、草地甚至稻田。


    ## 黄冠凤鹦鹉 *Cacatua sulphirea* 33cm


    与硫冠凤鹦鹉（Cacatua galerita）相似但体型更小。这种全白的鹦鹉拥有一个美丽的由硬黄色羽毛组成的羽冠和黄色脸斑。它有黑色的喙和深灰色的足。飞行看起来有些费力，交替着滑翔和快速扇动翅膀。通常成对生活，但经常在嘈闹的小群体中出现，发出尖叫、嘎嘎声和哨声，并在鸣叫时竖起羽冠。被宠物贸易大量开发。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_107_0.png)


    可见：出现在巴厘岛佩尼尼达岛的森林边缘。较为稀有。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_107_1.png)


    ## 红胸长尾鹦鹉 *Psittacula alexandri* 33–37cm


    印尼语名称：Betet Biasa


    从颈部到臀部的下体（包括翅膀）为深绿色，中覆羽边缘染着较亮的绿色。头部为蓝蓝色，额头有一条黑线横跨到眼睛。另一条较宽的黑线横跨下巴和颈部，在脸颊下方变窄。领圈正下下体为蓝粉色，腹部向粉色过渡，然后在尾下覆羽变为青绿色和绿色。上体为亮蓝色。喙为红色，尖端为角黄色，足为浅灰色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_108_0.png)


    **可见：**出现在爪哇岛和巴厘岛，它们偏好低地地区的湿润林地。


    ## 蓝臀鹦鹉 *Psittinus cyanurus* 18–20cm


    印尼语名称：Nuri Tanau


    这种小鹦鹉拥有蓝色的冠部和颈部，脸侧为蓝色，常带有灰褐色。背部和上背部为深紫色至黑色。下背、臀部和尾覆羽为亮蓝色，尾羽外羽为绿色。翅膀为绿色，肩部带有栗红色褐色，下体为橄榄灰，侧腹和翅下覆变为红色。上背部为红色，下部为深角黄色。腿为灰绿色，虹膜为白色。雌性头部为棕色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_108_1.png)


    **可见：**出现在苏答腊岛的低地森林。


    ## 暮光凤兜 *Trichoglossus forsteni* 28–30cm


    印尼语名称：Perkiki Dada-merah


    这是一种色彩绚艳的鹦鹉，头部呈深紫色。除了浅绿色的领圈，上体为深绿色。它有红色的下覆羽和肩下的黄色斑块。胸部为红色，腹部为深蓝色，大腿显示交替的绿色黄色窄条纹。足为灰色，喙为红色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_109_0.png)


    可见：巴厘岛的居民，通常以嘈闹的小觅食群体出现，在山地森林冠层低空飞行。


    ## 蓝冠凤嘴鹦 *Loriculus galgulus* 12–13cm


    印尼语名称：Serindit Melayu


    这种小鹦鹉主要是亮绿色，翅膀颜色较深，下方较浅。颈部正下方有一小块橙黄色区域。冠顶有一块深蓝色斑块，喉部为亮红色，臀部和尾覆羽同样如此。足为橙色，喙为黑色。雌性没有红色。可见：出现在苏答腊岛和西爪哇岛，它们偏好低地森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)## 爪哇凤嘴鹦 *Loriculus pusillus* 12cm


    印尼语名称：Serindit Jawa


    这种极小的鹦鹉通体绿色，翅膀较深，下体较浅。颈部下方有一小块橙黄色区域，臀部和尾覆羽同样如此。雄性它们在树冠上觅食，具有极佳的伪装。通常成小群活动，发出尖锐的叫声。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)## 绿嘴鸟 *Calyptomena viridis* 14–17cm


    印尼语名称：Madi-hijau


    这种嘴鸟除了雄性脸颊有明显的黑色斑纹外，全身呈绿色。它有奶油色的眼环，喙较短，尾巴较短，翅膀为黑色。足为灰褐色。可见：出现在苏答腊岛，栖息在沼泽。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)## 长尾嘴鸟 *Psarisomus dalhousiae* 23–26cm


    印尼语名称：Madi


    这种长尾嘴鸟特征独特且色彩鲜艳，具有绿色的上体和青绿色的下体，头部为黑色，耳覆羽后有一个黄色斑块。面部和喉部为亮黄色。飞行羽为黑色和蓝色。虹膜为灰绿色，足为黄绿色。可见：出现在苏答腊岛的常绿林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)## 银胸嘴鸟 *Psilophus lunatus* 16–17cm


    印尼语名称：Madi Perak


    雄性头部为浅棕色，有宽的黑色眉纹。上体从领圈开始向臀部和尾覆羽变为栗色。胸部和腹部为白色。飞行羽为亮蓝色和黑色，尾巴为黑色。虹膜周围有窄色的眼环。喙为淡绿色，基部有时呈橙色，足为脏黄色。可见：稀疏出现在苏答腊岛的山地林。


    ![](img/e8dcc79b9f6b63c1dff9f174c158e29)## 纹纹嘴鸟 *Euryllamus javanicus* 21–23cm


    这种色彩鲜艳的嘴鸟具有黑色的背部和尾覆羽，布有密集的黄色斑点。飞行羽为棕黑色，尾巴和翅覆为黑色。下体和头部为栗红色，腹部颜色较浅。上胸部有一条细い黑带。亮奶油色的虹膜周围有一圈黑色。喙为淡蓝绿色，足为灰粉色。可见：出现在爪哇岛和苏答腊岛湿地附近的常绿林和落叶林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)## 黑黄嘴鸟 *Euryllamus ochromalus* 13.5–15cm


    印尼语名称：Sempur-hujan Darat


    这种色彩鲜艳的嘴鸟头部黑色覆盖了颈部、耳覆羽和喉部，下方是宽大的白色领圈。领圈下方是黑色胸带，雄性不连续，雌性中间断开。下体为粉色，在尾下覆处变为黄色。尾巴为黑色，喙为边缘为亮蓝绿色，虹膜为黄白色，足为褐色至蓝色。它的背部和尾覆羽为黑色，布有密集的黄色斑点。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29)


    可见：出现在苏答腊岛。偏好低地森林。


