    # Horsfield''s Bronze Cuckoo Chrysococcyx basalis 17cm


    Indonesian name: Kedasi Australia


    A small cuckoo recognised by its green and bronze iridescent shading on its otherwise
    partially brown-barred upperparts and its white eyebrow with a brown eye-stripe.
    The pale buff underparts are lightly streaked brown at the neck, becoming stronger
    on the flanks and undertail-covers but whitish at the centre of the belly. The
    feet and eye-ring are grey, the thinish bill is black and the iris red-brown.
    Juveniles are generally duller with much less barring and a paler grey-brown iris.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_1.png)


    Where to see: Occurs as a migrant in March and April on Bali and Java and occasionally
    in south Sumatra, usually in coastal, drier open woodlands.


    # Banded Bay Cuckoo Cacomantis sonnerati 22–23cm


    Indonesian name: Wiwik Lurik


    Adults occurring on Java and Bali have bright rufous-brown, barred darker upperparts
    and buffish-white, finely barred brown underparts. They have a broad buff-white
    supercilium above a brownish eye-stripe with a whitish line below. The iris is
    greybrown. The bill is black and feet are grey. Juveniles differ in having white-tipped
    feathers on the crown and mantle. Birds on Sumatra are darker and appear more
    iridescent bronze on the upperparts. They show more yellow on the legs and the
    iris is much paler.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_2.png)


    Where to see: Occurs throughout the region. Found at lowland forest edges. Uncommon.'
