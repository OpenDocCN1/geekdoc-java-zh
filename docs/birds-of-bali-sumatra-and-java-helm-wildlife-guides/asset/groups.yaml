    ## 草头吊类 Pycnonotus zeylanicus 28–29cm


    印尼语名称：Cucak Rawa


    悦耳的歌声使其这种鸟在印度尼西亚作为笼鸟广受欢迎。它是最大的吊类鸟之一，特征是草草色的冠部和耳羽以及黑色的须状纹。背部、翅膀和尾部为绿褐色。它有一条细的黑色眼纹、白色下巴和喉部、灰色的胸部和腹部，以及黄色门。上胸和背部有少量白色条纹。


    **观赏地点：** 出于爪哇岛。曾常见于低地、丘地森林和河流栖息地，现已处于极危状态。


    ## 墨头吊类 Pycnonotus aurigaster 19–21cm


    印尼语名称：Cucak Kilang


    这种吊类有一个短的、近乎垂直的冠，位于其光泽亮亮的黑色头部，从下巴到眼睛下方一直到后颈。耳羽呈白色，下部为带灰白色，上胸颜色较深，向黄色门处颜色变浅。上尾覆盖羽为白色，尾部黑色尖带白色。后颈为灰灰色，在背部处加深，向背部和尾部变浅。边缘较浅的羽毛呈鳞状。翅羽和次级飞羽相似。主飞羽为褐色，边缘为灰色。腿和喙为黑色。


    **观赏地点：** 常见于爪哇岛和巴厘岛的灌丛开阔栖息地，通常靠近人类居住区。


    ## 橙斑吊类 Pycnonotus bimaculatus 20cm


    印尼语名称：Cucak Gunung


    羽毛颜色较深，呈棕色至橄榄褐色，耳羽呈淡黄色，并有两个明显的橙色斑点，一个在额间，另一个在眼睛上方。喉部为黑色，渐变为棕褐色的上胸，随后变为带有棕色斑点的乳白色，一直到白色腹部和亮黄色门。苏门答腊中部的一些鸟具有灰色的腹部。喙为黑色，腿为灰至黑色。虹膜为深红褐色。幼鸟颜色较暗。亚种
    P.b. tenggerensis 的橙色眼斑较小，耳羽有深褐色斑点。


    **观赏地点：** 遍布该地区，更多见于低山森林。


    ## 巽他黄腹吊类 Pycnonotus analis 20–21cm


    印尼语名称：Merbah Cerukuk


    正如其名，它拥有明黄色的门，但羽色整体相对暗淡。背部和尾部为棕色，下部为白色。冠部为深棕色，眉纹为白色。额间为黑色。它有粉灰色的脚和黑喙。


    **观赏地点：** 遍布该地区，偏于更开阔的栖息地。特别吸引引耕地、种植园、花园和公园，甚至在城镇中可见。


    ## 鸣喉吊类 Alophouix bres 19–22cm


    这种体态结壮的吊类可以通过其习惯性鸣叫时竖起栗褐色的冠并蓬起白色喉部羽毛来识别。从头部到尾部的上部为灰橄榄褐色，带有栗色调。下部变化多样，从上胸的淡橄榄褐色到门部的黄色和米黄色，再到泛的橄榄褐色。虹膜为棕色，腿为粉褐色，喙为灰褐色。


    **观赏地点：** 出于爪哇岛和巴厘岛的低山森林。


    ## 北绿��莺 Phylloscopus borealis 13cm


    印尼语名称：Cikrak Kutub


    特征是黑色眼纹上方有明显的、长长的黄白色眉纹。它还有一条模糊的白色翼环。上部为深橄榄绿，下部几乎为白色，在侧腹部融合为橄榄褐色。与较小的黄眉眼/眼鯹（Phylloscopus
    inornatus）相似，但颜色暗得多，翼环较不明显。


    **观赏地点：** 作为越冬迁徙鸟遍布该地区。通常发现于次生低地红树林。


    ## 巽山��莺 Phylloscopus grammiceps 10cm


    印尼语名称：Cikrak Muda


    这种活跃的绿鯹经常成群出现在山区森林的下冠层，觅食昆虫。上部主要是栗色和灰色，尾部为棕色，下部为白色。长长的黑色冠延伸至背部。它有两条黄色翼环和一个极浅的灰色眼圈。


    **观赏地点：** 一种遍布该地区山地森林物种。


    ## 山绿��莺 Phylloscopus trivirgatus 10–11cm


    印尼语名称：Cikrak Daun


    上部主要为绿色，下部为绿黄色。它显著的绿黄色冠纹和眉纹被一条贯穿冠部的黑色条纹所交叉。腿为灰色，喙上部为黑色，下颌处带有红晕。幼鸟颜色较暗，下部更绿。


    **观赏地点：** 遍布该地区。常见于山林，栖息于树冠和森林边缘。


    ## 爪哇短��莺 Tesia superiliaris 9cm


    这种几乎没有尾巴的��莺用浅褐色的腿爬行移动。从后颈到尾部的上部为橄榄绿，下部为浅灰色，侧腹和臀部泛有橄榄色。冠部和后颈为黑色，眼纹也是如此，眼纹在后颈处加宽。长而宽的眉纹和耳羽为灰白色。喙上部为黑色，底部为黄色。


    **观赏地点：** 出于爪哇岛西部和中部的灌木丛和密集的下层植物。


    ## 黄腹��莺 Abroscopus superiliaris 9cm


    印尼语名称：Cikrak Bambu


    这种��莺的上部为橄榄绿，向臀部和尾覆盖羽变为黄色。它有长白色眉纹，将灰色的冠部、额头与深色的额间和耳羽隔开。下部下巴、喉部和上腹为极浅灰色，下方为浅黄色。喙为褐色，腿为粉色，虹膜为深棕色。


    **观赏地点：** 出于爪哇岛和苏门答腊的低地灌木丛。


    ## 爪哇林雀 Aegithalos exilis 9cm


    印尼语名称：Cerecet Jawa


    一种外表普通的林雀，尾巴中等，喙小。上部为灰色和棕色，喉部为浅灰色；下部其余部分为米色，泛粉色。它有极浅黄色的虹膜，褐至黑色的喙和黄色的腿。雌雄和幼鸟相似。


    **观赏地点：** 仅出现在爪哇岛西部和中部的山区，偏好森林边缘，在那里觅食昆虫，通常成群活动。


    ## 爪哇黑眼 Apalopteron javanicum 13cm


    印尼语名称：Opior Jawa


    这种蜡眉鸟没有常见的宽眼环。它有灰色的冠部延伸到后颈和耳羽，上部为橄榄绿。额头为米色，断开的眼环也是如此，虹膜为黑褐色，喙和腿为深橄榄黄色。喉部和胸部为带斑点的米色，渐变为黄色，腹部为斑灰色，侧腹为黄色。亚种间黑斑的大小和形状各异。


    **观赏地点：** 出于爪哇岛和巴厘岛的密林，有时会进入耕地。


    ## 墨尾蜡眉 Zosterops melanurus 10–11cm


    印尼语名称：Kacamata Biasa


    一种活跃的鸟，上部为亮橄榄绿，整个胸部、腹部、喉部和门为亮黄色。翅膀和尾部为灰褐色。眼睛周围有一圈亮白色羽毛，被一条深色额间纹隔开，与面部较深的侧面形成对比，有时有黄色的额头。喙为深棕色，脚为灰色。


    **观赏地点：** 一种在爪哇岛和巴厘岛当地常见的林地物种。


    ## 鸣鸣蜡眉 Zosterops japonicus 11–12cm


    印尼语名称：Empuloh Jawa


    雄性上部为橄榄绿，臀部为黄色。额冠部在额间处为亮黄色，向冠部变为橄榄绿。它有一个黑色额间斑和穿过白色眼环的额间线。喉部和上胸为淡黄色，向下部变为浅灰色至白色，侧腹为米色。尾下覆盖为浅黄色，喙和腿为灰黑色。虹膜为浅灰色。


    **观赏地点：** 一种遍布该地区的山顶物种。


