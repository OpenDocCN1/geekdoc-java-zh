    ## 爪哇深尾树莺 *Enicurus leschenaulti* 28cm


    印尼语名称：Meninting Jawa


    深叉状的尾巴由多层白色尖黑色羽毛重叠而成，形成一种引人注目、间距均匀、指向身体向外的新月形图案。外尾羽均为白色。头部全黑，除有一圈对比鲜明的白色冠。下巴、胸部和背部为黑色，肩部和肩胛骨也是如此。它有明显的白色翼斑、白色尾臀和腹部。腿呈粉粉色，喙为黑色。雄雌相近，幼鸟颜色较褐且暗淡。


    观赏地点：出现在爪哇和巴厘岛的低地森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_189_0.png)


    ## 黄喉鸸 *Ficedaled zanthopygia* 13–14cm


    印尼语名称：Sikatan Emas


    这种鹸的下部、下背部和臀部为亮黄色，尾下覆羽呈白色。上部全黑，除了宽大的白色眉纹以及翅覆羽和三缘羽上的白色区域外。喙为黑色，下方呈灰蓝色；腿为黑色。雌性从冠部到黄色上尾覆羽为橄榄灰色。下部下巴为白色，向胸部变为淡黄色，在泄门处再次变为白色。浅色翼斑比雄性不明显得多。


    观赏地点：一种迁徙鸟，遍布于该地区，常见于森林边缘。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_0.png)


    ## 鸶 *Ficedaled mugimaki* 12.5–13.5cm


    印尼语名称：Sikatan Mugimaki


    雄性上部（包括头部和尾部）灰黑色，有两个明显的白色斑点，一个在眼后方，另一个在中覆羽末端。腹部和尾下覆羽也是白色。从喉部到下部的其余部分均为橙红色。小喙为黑色，腿为粉色，虹膜为深棕色。雌性上部和尾部为深褐色，喉部到腹中部为淡橙红色，腹部为白色。


    观赏地点：遍布整个地区，主要分布在低地阔叶常绿森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_1.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_2.png)


    ## 白眉鸔留 *Ficedula hyperythra* 11–13cm


    印尼语名称：Sikatan Bodoh


    这种纤细的小鸔留头部圆、尾巴短。雌雄下部特征相同，下巴为浅栗色，逐渐过渡到腹部的浅褐色，尾部下方为白色。上部有异，雄性上方为深钢蓝色，雌性为橄榄褐色。雄性黑色眼睛上方有一条明显的白色条纹，几乎从中心汇合延伸过眼睛。腿色多变，雄性从紫色到灰色，雌性为粉色。喙为黑色，虹膜极深棕色。雌性从喙部到眼睛上方呈橙褐色。苏门答腊的雄性翅膀和尾部呈黑色，爪哇和巴厘岛的个体上方较灰。


    观赏地点：常见于苏门答腊西部的高地森林以及爪哇和巴厘岛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_191_0.png)


