  - '[PAGE 122]


    # Trilling Shrike-vareo Pteruthius aenobarbus 12cm Indonesian name: Ciu Kunyit


    Males of this small shrike-babbler have olive-green tinged yellow uparts, including
    crown, ear-covers and the outer parts of the secondary wing feathers. The upperwing-covers
    are black tipped white, forming double wing-bars. The chin, throat and lower forehead
    reddish-black with a narrow yellow band below the forecrown. It has a


    white eye-ring underlined black at the rear. The belly is bright olive-green,
    as are ear-coverts, which are grey bordered and join with a grey supercilium.
    The legs are pink and the bill blue-grey. Females are duller with a buff-green
    throat.


    Where to see: Occurs in the lower montane forests of Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_122_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_122_1.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_122_2.png)'
  - '[PAGE 123]


    # Pied Shrike-vireo Pteruthius flaviscapis 14cm


    Indonesian name: Ciu Jawa

    This plump little bird appears to have a proportionately large head and thick
    bill. Males have a black head with a conspicuous white eyebrow, grey mantle and
    back, and black wings and tail, with the primaries tinged chestnut and yellow.


    The underparts are whitish. Females have a grey head, less distinct eyebrow, and
    greyish-green uparts.

    Where to see: Occurs on Java, more often in the canopy of more open montane forests.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_123_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_123_1.png)


    # Tenggara Whistler Pachycephala calliope 17–19cm

    Indonesian name: Kancilan Tenggara


    The male has brilliant black, white and bright yellow plumage. The yellow nape
    patch is joined by a narrow yellow band to the breast, belly and vent, while the
    head is black except for a white chin and throat, leaving a narrow black band
    between the throat and belly. The upperparts are olive-green and the tail is almost
    black. Females have drab upperparts and dirty buff underparts, with the lower
    belly and undertailcoverts tinged yellow.


    Where to see: Occurs in East Java and Bali in hill and montane forest, impenetrable
    woodland and second growth.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_123_2.png)'
  - '[PAGE 124]


    # Dark-throated Oriole Oriolus xanthonotus 17–19cm

    Indonesian name: Kepadang Hutan


    The male has head, mantle and neck to upper breast all black. The remainder of
    the upperparts are bright yellow. The flight feathers are black fringed with pale
    yellow. The tail is black with central-tail feathers also yellow. The belly is
    white, heavily streaked black. The bill is a muted orange, legs grey and iris
    dark red. The female is duller with upperparts generally olive green and underparts
    white streaked black with yellow undertail-coverts.


    Where to see: Occurs in lowland forest edges of Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_124_0.png)


    # Black-naped Oriole Oriolus chinensis 23–28cm

    Indonesian name: Kepadang Kuduk-hitam


    The male is a brilliant yellow, with a distinct black stripe passing through the
    eye and across the nape. The flight feathers and tail are black, edged yellow.
    The female is much duller. Juveniles show olive green where adults are black,
    and they have black-streaked, whitish underparts. It adheres to the tree canopy
    while foraging for insects and soft fruit.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_124_1.png)


    Where to see: Occurs commonly throughout the region''s lowlands and hills, favouring
    secondary and open forest, parks and gardens, mangroves and coastal scrub.'
  - '[PAGE 125]


    # Black-and-crimson Oriole Oriolus sanguineus 21–24cm


    Easily identified as a medium-sized oriole, the males having all-black plumage
    except from the crimson-red upper belly and a small crimson patch on the primary
    covers. It has a distinctive pale blue-grey bill and blue-black legs. Females
    are all black, with


    the breast tinged chestnut and streaked with grey on the belly. It has a cat-like,
    mewing call.


    Where to see: Occurs on Sumatra, mainly in the treetops of broadleaf evergreen
    and hill forests.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_125_0.png)'
  - '[PAGE 126]


    # White-breasted Woodswallow Artamus leucorynchos 18cm


    Indonesian name: Kekap Babi


    The only resident woodswallow in the region, showing similarities to true swallows
    in stance and gliding flight; easily distinguished by its stockier appearance,
    broader, triangular-shaped wings and squarish, forked tail. Its heavy bill is
    grey, and the entire upperparts except for the white rump are dark slate-grey.
    The underparts are white. Feeds on insects caught in flight.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_126_0.png)


    Where to see: A common bird of open spaces, particularly in the lowlands and hills,
    throughout the region.


    # Black-winged Flycatcher-shrike Hemipus hirundinaceus 14–15cm


    Indonesian name: Jingjing Batu


    Males’ uperparts are all black with greenish iridescence from the nape to the
    tail, apart from a white rump with slight barring on the upper rump. The underparts,
    throat and sides to the neck are white. Bill and legs are black and iris brown.
    Females and juveniles are similar but more grey-brown, with immatures looking
    more mottled.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_126_1.png)


    Where to see: Found throughout the region’s lowland forest edges.'
  - '[PAGE 127]


    # Rufous-winged Philentoma Philentoma pyrhyptera 16–17cm


    Indonesian name: Philentoma Sayap-merah


    One of the larger flycatchers, occurring in two colour forms. The male of the
    more common rufous-winged form has dull-blue upperparts down to the centre of
    the back and blue underparts to the centre of the belly. The lower belly and vent
    are buff-white. The secondaries, greater coverts and tail are chestnut and the
    primaries dark grey-brown. The legs are blue-grey and the bill is black and the
    iris red. The blue form is all dark blue-grey with paler lower belly and vent.
    female’s upperparts are brown shading into dark grey towards the top of the head.
    Underparts buffish on the breast to white at the vent.


    Where to see: Occurs on Sumatra, mainly in lowland forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_127_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_127_1.png)'
  - '[PAGE 128]


    # Common lora Aegithina tiphia 12–15cm


    Indonesian name: Cipoh Kacat


    The Sumatraen subspecies have olive-green to bright green uppersparts, a white
    rump, and yellow underparts. The wings are black, with distinct white and yellow
    edges and two clear wing-bars. On Java and Bali the subspecies has more subdued
    colour, the uppersparts being a paler olive-green. There is a clear yellow eye-ring.
    Both bill and feet are bluish-grey.


    Where to see: Occurs throughout the region, inhabiting open lowland forest and
    mangroves, but can frequently be in town gardens.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_128_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_128_1.png)'
  - '[PAGE 129]


    # Green Iora Aegithina virissima 12–15cm


    Indonesian name: Cipoh Jantu


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_129_0.png)


    The upperparts of the male are dark olive-green with the underparts paler, becoming
    yellower at the vent. The tail and flight feathers are blackish, sometimes edged
    olive-yellow. The coverts are black tipped white, forming two conspicuous wing-bars.
    A narrow band of black skin surrounds the eye, encircled by an area of pale yellowish
    feathers. The iris is brown and the legs are blue-grey. The bill is black above,
    blue-grey below. Females and juveniles are yellow and brighter.


    **Where to see:** Occurs commonly in the canopy of Sumatran forests.


    # Sunda Pied Fantail Rhipidura javanica 18–19cm


    Indonesian name: Kipasan Belang


    This very active, small fantail displays a typical wing-drooping posture and regular
    flicking and fanning of the tail. The upperparts are dusky-black, the underparts
    white with a diagnostic black chest band, and there is a thin white eyebrow. When
    the tail is fanned, the broad bill tips to the feathers are obvious. Both bill
    and legs are black and the iris is dark brown. Sumatran birds appear to have blacker
    upperparts and slightly longer tails.


    **Where to see:** An open-habitat species occurring throughout the region''s scrublands,
    open woodland, second growth, mangroves and even gardens.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_129_1.png)'
- md: '

    ## White-bellied Fantail Rhipidura euryura 18cm


    Indonesian name: Kipasan Bukit


    Males and females have very similar plumage; predominantly dull-grey overall but
    below the mid-belly it is white. There is a broad white supercilium and the outer
    tail feathers are tipped white. Bill and legs are black and the iris dark brown.


    Where to see: Occurs in Java''s dense montane forests, often in small groups with
    other species, foraging for small flying insects.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_0.png)


    ## Black Drongo Dicrurus macrocercus 25–30cm


    Indonesian name: Srigunting Hitam


    This drongo has black plumage with slight iridescence and a long, deeply forked
    tail with outer feathers which tend to turn outwards at the tips. Juveniles show
    pale grey barring on the underparts. Unlike most other drongos, favours open country
    and often associates with cattle, which disturb insect prey.


    Where to see: Occurs on Java and Bali. Frequently seen in open scrub, cultivated
    land and rice fields, perching on fencing, isolated branches and telephone wires
    alongside roads.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_1.png)


    ## Ashy Drongo Dicrurus leucophaeus 26–29cm


    Indonesian name: Srigunting Kelabu


    This drongo has the typical long, forked tail and upright stance. Its plumage
    is light blue-grey, with a tuft of black feathers at the base of the upper mandible.
    The subspecies in the region all vary in their grey colouring. Sumatran birds
    occasionally have a white loral spot, with those in north Sumatra being a little
    darker. Usually observed in pairs waiting on exposed branches to swoop on large
    passing insects.


    Where to see: Occurs throughout the region. A bird of open woodland and forest
    edge and clearings.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_131_0.png)


    ## Crow-billed Drongo Dicrus annectensens 27–30cm


    Indonesian name: Srigunting Gagak


    This sturdy elegant drongo has a strong, broad bill, well adapted to taking aerial
    insects in flight. The base of the bill is hidden by a layer of short feathers.
    The head is black and the remainder of the upperparts glossed black with a bluish
    iridescence. The underparts are black, often spotted white. The long, blackish,
    forked tail the outer feathers curved outwards. Legs and bill are black and the
    iris dark red.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_0.png)


    Where to see: Occurs as a migrant on Sumatra and West Java, frequenting wooded
    lowland and hills.


    ## Javan Spangled Drongo Dicrus jentincki 27–29cm


    Indonesian name: Srigunting Jawaut


    This unusual drongo has a peculiarly fork-shaped tail, the outer feathers spreading
    outwards and upwards almost into a lyre shape. It also has an extraordinary crest
    of long, hair-like feathers from the front of the crown, but this feature is variable.
    It has a very pale buff eye. The general plumage is glossy black with an iridescent
    spangling, particularly on the crown and upper breast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_1.png)


    Where to see: Occurs in East Java and Bali. It is common in open areas of lowland
    and submontane forests.


    ## Lesser Racket-tailed Drongo Dicrurus remifer 25–28cm


    A spectacular, big, glossy-black drongo with a square-ended tail and extended
    outer tail-streamers almost 50cm long. Each streamer feather shaft terminates
    in an elongated oval web around 10cm long. A substantial tuft of short black feathers
    covers the base of the upper mandible, creating a long-headed appearance. It is
    smaller than the Greater Racket-tailed Drongo, has no frontal crest, and has no
    fork in the tail.


    Where to see: Occurs in West Java and the Barisan Range and Batak Highlands of
    Sumatra. Inhabits dense montane forest and secondary forest, especially at edges.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_133_0.png)


    ## Greater Racket-tailed Drongo Dicrurus paradiseus 30cm plus 35cm tail rackets


    Indonesian name: Srigunting Batu


    This large, forked-tailed drongo has beautifully extended outer tail feathers
    terminating in spirally twisted rackets on the outer edge of the shafts. Its forked
    tail easily separates it from the Lesser Racket-tailed Drongo. Plumage is glossy
    black, and adults often display a short frontal crest on the crown. The bill and
    legs are black.


    Where to see: Occurs throughout the region. Usually found in pairs, often hawking
    for insects in glades in swamp, primary and secondary forests and in mangroves.
    It remains a common bird of the lowland forests of Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_134_0.png)


    ## Black-naped Monarch Hypothymis azurea 15–17cm


    Indonesian name: Kehicap Ranting


    A beautiful flycatcher with an azure blue head and back. The male has a short,
    erect black crest and a thin black band above and below the bill. A narrow black
    band extends across the upper breast, with a grey belly fading to a white vent.
    Wings are grey, tail blue-black, bluish tipped black, iris dark brown and legs-grey.
    Females and juveniles are duller and greyer and lack the male''s black markings.
    Small colour variations occur: Sumatran birds are more grey-blue, on Java and
    Bali males are pale blue and females have greyish-blue upperparts, and over Nusa
    Penida Island, Bali, females have a more bright-blue head.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_135_0.png)


    Where to see: A common flycatcher of forest edges and scrubland throughout Sumatra.


    ## Amur Drongo Terpsiphone affinis 20–25cm


    Indonesian name: Srigunting Utara


    A beautiful flycatcher with an azure blue head and back. The male has a short,
    erect black crest and a thin black band above and below the bill. A narrow black
    band extends across the upper breast, with a grey belly fading to a white vent.
    Wings are grey, tail blue-black, bluish tipped black, iris dark brown and legs-grey.
    Females and juveniles are duller and greyer and lack the male''s black markings.
    Small colour variations occur: Sumatran birds are more grey-blue, on Java and
    Bali males are pale blue and females have greyish-blue upperparts, and over Nusa
    Penida Island, Bali, females have a more bright-blue head.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_135_1.png)


    Where to see: A common flycatcher of forest edges and scrubland throughout Sumatra.


    ## Blyth’s Drongo Terpsiphone affinis 20–30cm


    Indonesian name: Srigunting Asia


    Easily confused with Amur Drongo. It also occurs in two forms: red and, much less
    common, white. The red-form male has a complete black head including nuchal crest,
    whereas the upper breast to mid-breast is dark grey becoming white on the lower
    belly. The vent and tail are light chestnut.


    Where to see: A scarce species of forest edges and scrubland throughout West Java.


    ## Jay Shrike Platylophus galericulatus 31–33cm


    Indonesian name: Tangkar Ongklet


    This bird is relatively inconspicuous until it starts to call, the harsh and rattling
    sounds revealing its presence. Its plumage is dark grey to black, apart from a
    broad white neck. Easily recognised by its tail, flat, upright crest. The bill
    is black and legs are dark grey.


    Where to see: Occurs in Java and Sumatra''s lowland broadleaf and hill forests,
    usually in small, noisy groups foraging through trees and bushes.


    ## Tiger Shrike Lanius tiginus 17–19cm


    Indonesian name: Bentet Loreng


    This little shrike has a robust, bluish-black, hook-tipped bill. The adult''s
    crown is light grey extending well over the nape into the mantle, and it has a
    broad, mask-like eye-stripe from the lores over the ear-coverts (not present on
    immatures). The upperparts are russet-brown barred black down to the warm brown
    tail. Underparts, including chin to undertail-coverts, are white. The legs are
    grey-blue and iris dark brown. Females are duller with less obvious markings.


    Where to see: Occurs in more open habitat and secondary forests throughout the
    region. Uncommon.

