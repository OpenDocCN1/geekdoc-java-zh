    ## 斑纹绿鸽 Geopelia striata 20cm

    印尼语名称：Perkutut Jawa


    因其颈部到尾部有细密的棕色横纹而被称为斑纹绿鸽。头部呈浅棕色，过渡到奶油色的面部、冠部、颈部和下巴。长而尖尖的尾巴呈棕黑色相间，外羽末带白色；在起飞时非常明显。当地通常被称为“和平鸽”，但不应与其近缘物种——大洋洲的和平鸽（*Geopelia
    placida*）混淆。


    何处可见：在整个地区稀疏分布。常见于园林、耕作地、开阔草地和灌木丛。这是巴厘岛和爪哇答岛非常常见的笼鸟，在当地的文化神话中具有特殊意义。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_27_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_27_1.png)


    ## 灰颊绿鸽 Treron griseicauda 25cm

    印尼语名称：Punai Penganten


    外观呈黄绿色的鸽子，头部为灰色，雌性背部为绿色，雄性背部为栗色。两性眼睛周围都有裸露的绿色皮肤斑块，额头为灰色。黑色的飞行羽边缘带有黄色。中央尾羽为绿色，末端尾羽颜色较深，显示出灰色的亚末端带。尾下覆在雄性为栗色，雌性则较浅。雄性的喙为黄色并带有绿色的蜡膜，与雌性的绿色喙不同。腿为红红色。


    何处可见：巴厘岛和爪哇岛特有。栖于低地森林的高树上，有时与其他鸽子一起，栖息在果树上；有时也靠近人类居住区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_28_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_28_1.png)


    ## 粉颈绿鸽 Treron vernans 27cm

    印尼语名称：Punai Gading


    这种小型绿鸽与相似鸽类的区别在于其具有带有黑色带和浅灰色末端的灰色尾巴。雄性的头部为蓝灰色，下胸部融合为粉色到橙色；腹部为黄绿色，背部翅膀为绿色。雌性为绿色，颜色更亮，但可以通过尾部图案以及与特征独特的雄性形伴在一起来识别。它们的叫声是“咕咕”的哨声，进食时则是一系列类似乌鸦的嘎咯声。


    何处可见：常见于整个地区的低地、沿海森林、红树林，以及更开阔的乡村地区。当树木结果时，它们变得非常显眼。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_29_0.png)


    ## 黑背果鸽 Ptilinopus cinctus 38–44cm

    印尼语名称：Walik Putih


    一种非常独特的黑白相间的果鸽，腹部和尾门处呈黄色。头部和颈部为灰白色，过渡到上胸的纯白色。一条宽的黑带将上胸与灰色的腹部隔开。背部为极深的绿黑色，过渡到深绿色的尾巴，尾巴有一条灰色末端带。脚为红色，喙为灰色。它们飞行速度迅速，翅膀扇动快速且响亮。


    何处可见：在巴厘岛的湿润亚热带低地森林和山区森林可见，通常在果树上觅食。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_29_1.png)


    ## 粉头果鸽 Ptilopinus porphyreus 29cm

    印尼语名称：Walik Kepala-ungu


    雄性的头部、颈部和喉部是迷人的紫粉色，胸部有一条对比鲜明的白色带，接着是绿黑色带，然后是灰色的腹部，一直到黄色的尾下覆。背部为绿色，脚为粉色，喙为浅绿色，虹膜为橙色。雌性有暗粉色的额部和面部，头部、颈部和喉部其余部分为绿色；胸部有明显的黑白带。


    何处可见：分布于整个地区的山区森林。性害羞且不显眼。偶尔会在果树上成群聚集。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_30_0.png)


    ## 黑后脑果鸽 Ptilopinus melanospilus 27cm

    印尼语名称：Walik Kembang


    该物种背部、尾巴和下胸主要为绿色，带有黄色尾门和红色尾下覆。雄性头部为浅灰色，有明显的黑色后脑和黄色喉部。它们有红色的脚和绿黄色的喙。雌性和幼鸟的头部全为绿色，幼鸟有明显的黄色羽缘。通常通过其共鸣的“呜-wook-wook，呜-wook-wook”叫声来识别。


    何处可见：在爪哇岛和巴厘岛的低地和高地森林常见，在苏门答腊岛偶尔出现。除了在果树上成群聚集外，很少见到。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_30_1.png)## 绿鸽 Ducula aenea 27cm

    印尼语名称：Walik Kembang


    该物种背部、尾巴和下胸主要为绿色，带有黄色尾门和红色尾下覆。雄性头部为浅灰色，有明显的黑色后脑和黄色喉部。它们有红色的脚和绿黄色的喙。雌性和幼鸟的头部全为绿色，幼鸟有明显的黄色羽缘。通常通过其共鸣的“呜wook-wook，呜-wook-wook”叫声来识别。


    何处可见：在爪哇岛和巴厘岛的低地和高地森林常见，在苏门答腊岛偶尔出现。除了在果树上成群聚集外，很少见到。


