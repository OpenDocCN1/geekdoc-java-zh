    ## 蓝耳凤嘴 *Psilopogon australis* 16cm


    该地区有两种羽毛颜色变型，均具有绿色身体羽毛、黑色颊条纹和胸纹，以及蓝色的下巴和头顶。爪哇岛的鸟类脸颊和黑色胸纹下方有黄色斑块，而苏门答腊岛的鸟类缺少黄色，但脸颊是红色的。也被称为黄耳凤嘴或小凤嘴，它们闻声多于形见。鸣叫声是快速重复的“tuk-trrk,
    tuk-trrk”，以及一系列高音的哨声或颤音。


    观赏地点： 森林和种植园中常见的凤嘴鸟，分布于该地区从海岸到低丘的区域。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_98_0.png)


    ## 火簇凤嘴 *Psilopogon pyrolophus* 28–29cm


    与大多数凤嘴鸟一样，主羽毛呈亮绿色。胸部有一条黄色带，下方由一条黑线勾勒。后脑顶和颈部为红色，下巴为绿色，耳部羽毛为灰色，眼纹和额头为黑色。眼间基部有一个明显的、红尖黑色羽毛簇。它非常喜欢熟实，特别是小无花果，并捕食昆虫。它会长时间静止地栖在高树上，期间经常发出刺耳的嗡嗡叫声，非常像蝉鸣。


    **地点：** 分布于苏门答腊和西爪哇，在那里偏好低丘和山坡上高大的老林树木。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_99_0.png)


    ## 黑带凤嘴 *Psilopogon javensis* 26cm

    印尼语名称：Takur Tulung-tumpuk


    体型相当大，身体和尾部羽绿色绿色，这种凤嘴鸟有黄色头顶和眼睛下方的黄色斑点。它还有红色的喉部，下方是实心的黑色环，与贯过眼睛的黑色条纹相连。足部为淡橄榄绿，喙为黑色。与其他凤嘴鸟一样，足部适应攀爬树干，有两个趾朝前，两个趾朝后。它主要是食果动物，偏好小实实无花果、种子、芽苞、花朵，偶尔也吃昆虫。


    观赏地点：分布于爪哇岛较开阔的低地和丘陵森林的空地和边缘，巴厘岛较少。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_100_0.png)


    ## 焰额凤嘴 *Psilopogon armillaris* 20–22cm

    印尼语名称：Takur Tohtor


    这种体壮的小型凤嘴鸟上部以绿色为主，下部稍浅，额头有显眼的黄橙色。头顶后部到颈部为蓝色，两侧以及颈部正下方有小小的橙色斑块。强壮的喙为黑色，额部眼纹也是黑色。来自东爪哇和巴厘岛的鸟类看起来体型更大，额头和颈下部的橙色更深。


    观赏地点：分布于爪哇和巴厘岛的低地和丘陵森林边缘，偶尔出现在人类居住区周围。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_100_1.png)


    ## 线纹凤嘴 *Psilopogon lineatus* 25–30cm

    印尼语名称：Takur Bultok


    这种凤嘴鸟背部、翅膀和尾部为绿色，头部上胸为褐色，并有密集的褐色条纹。其余下部为绿色，同样有褐色条纹。它的眼周有宽宽的橙黄色裸露皮肤环。厚实的喙颜色多样，从淡粉色到黄色不等，足部为黄色。


    观赏地点：仅分布于爪哇和巴厘岛，出没于稀疏的干燥沿海林、草原边缘、金合树林、果园和耕作区；经常与其他凤嘴鸟一同聚集在结果果树上。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_101_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_101_1.png)


    ## 巽达小啄木鸟 *Picoides moluccensis* 13cm

    印尼语名称：Caladi Tilik


    这种小啄木鸟腿短，脚灰，有两个趾朝前，两个趾朝后。上部为深棕色带有白色横纹，呈现出部分斑点的外观。下部为白色，带有黑色条纹。它有深棕色的头顶、黑色颊纹、中心为灰褐色的白色脸斑，以及眼睛后方的细细的红纹。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_102_0.png)


    观赏地点：分布于整个地区。它偏好红树林、开阔林地和沿海次生林。


    ## 常见焰尾 *Dinopium javanense* 28–30cm

    印尼语名称：Pelatik Besi


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_102.png) 这种非常显眼且引人注目的鸟，除了腹部外全身呈黑色。它们有红色的冠和脸斑。鸣叫声是响亮的嗡嗡声，经常在枯枝上鸣叫。分布于该地区的开阔低地森林


    ## 白腹啄木鸟 *Dryocopus javenas* 40–48cm

    印尼语名称：Pelatik Ayam


    这种小啄木鸟腿短，脚灰，有两个趾朝前，两个趾朝后。上部为深棕色带有白色横纹，呈现出部分斑点的外观。下部为白色，带有黑色条纹。（此处原文描述混乱）


