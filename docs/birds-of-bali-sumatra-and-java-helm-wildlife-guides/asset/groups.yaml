    ## 爪哇斑红留鸟 *Hydrornis guajanus* 20–23cm


    一种美丽的陆地鸟，羽色独特，包括黑色的头部，其间有一条长而宽的黄色眉纹。背部和覆羽为纯褐色，臀部和尾部为蓝色。翅膀为深褐色，有一条细白色翼斑。下巴和喉部为黄白色，下方有一条深蓝色色带。


    胸部和其余下部有细密的黄黑相间纹。腿为淡紫色灰色，喙为黑色，虹膜为深棕色。


    **分布地：** 分布于爪哇岛和巴厘岛，主要栖息于低地森林和阴暗茂密的灌丛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_114_0.png)


    ## 亚洲兜留鸟 *Pitta sordida* 16–18cm


    印尼语名：Paok Hijau


    这种鸟在森林地面的落叶层和腐木中跳跳觅食昆虫。它是一种肥满的中型留鸟，腿很长。留鸟羽毛为绿色，头部为黑色，翼羽为蓝灰色，尾下覆和下腹为深红色。喙为黑色，腿呈粉色。迁徙个体（*P.s.
    cucullata*）具有深棕色冠，腹部黑色更多。如果受到骚扰，它们会快速扇动翅膀贴地飞行，显出翅膀上明显的圆形白色斑块。


    **分布地：** 分布于苏答腊腊和爪哇岛的沼泽林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_115_0.png)


    *P.s. cucullata*


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_115_1.png)


    *P.s. mulleri*


    ## 蓝翅留鸟 *Pitta moluccensis* 18–20cm


    印尼语名：Paok Hujan


    这种色彩鲜艳的留鸟以其亮蓝色的翼斑为特征。初级飞羽为黑色，带有宽大的白色末端。背部颈部为绿色，臀部为青蓝色。短尾末端带有蓝绿色。喉部为白色，下部为淡肉桂色。鲜红色的中央腹部延伸至尾下覆。淡栗色的冠部和眉纹与从额纹延伸过后脑的宽黑条纹形成对比。虹膜为棕色，喙为黑色。足呈粉色。


    **分布地：** 苏答腊腊的非繁殖季节迁徙鸟，占据从森林到城市公园的各种栖息地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_116_0.png)


    ## 华莱士优留鸟 *Pitta concinna* 19cm


    印尼语名：Paok Wallace


    华莱士优留鸟下巴和头部至后脑均为黑色，有一条橙色头纹从额纹经眼睛上方纵向延伸，在后脑处变为白色。背部带有褐色的绿色。臀部为蓝色，黑色尾巴末端带绿色。飞羽为黑色，绿色的覆羽显示出蓝色肩斑。下部为橙褐色，中心有一条黑色条纹延伸至红色火斑处。喙为黑色，虹膜为棕色，足为淡红褐色。


    **分布地：** 分布于巴厘岛佩尼达岛的林地和灌丛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_116_1.png)


    ## 棕色蜜莺 *Lichmera indistincta* 15cm


    印尼语名：Isap-madu Australia


    背部为带橄榄色的深灰色，冠部显示为灰色。下部喉部为白色，胸部变为浅灰色，向尾下覆变为带黄色的浅橄榄色。飞羽和尾羽为灰色边缘边缘黄橄榄绿色。额纹有黑色纹和一圈深灰色裸皮，眼后较宽，环绕着深棕色虹膜。喙为黑色，腿为深灰色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_117_0.png)


    **分布地：** 分布于巴厘岛的红林灌丛和森林，通常靠近人类居住区。


    ## 黄腹鹴 *Gerygone sulphurea* 9–10cm


    印尼语名：Remetuk Laut


    这是该地区唯一的澳洲仙鹴。背部为褐灰色，下部为亮黄色。下巴和颈部为白色，通常显示出白色的额斑。深灰色的尾巴末端为黑色，有一条白色点亚端线。喙和腿为深灰色。幼鸟通常较浅，有淡眼环。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_117_1.png)


    **分布地：** 全年留于该地区，出现在开阔森林、竹林、针叶灌丛、红树林甚至种植园中。


    ## 小蜜吸 *Pericrocotus cinnamomeus* 14–16cm


    印尼语名：Sepah Kecil


    头部、背部和上背为灰色，臀部、火斑和外尾为橙色。长尾羽为黑色，黑色翅膀上有明显的橙黄色斑块。雄性黑色喉部和红色腹部；雌性较浅，喉部和胸部为白色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_118_0.png)


    **分布地：** 分布于爪哇岛和巴厘岛的开阔森林、园林和红树林。


    ## 巽丹蜜吸 *Pericrocotus miniatus* 20cm


    印尼语名：Sepah Gunung


    雄性的头部、颈部、背部、尾下覆和大覆为黑色带有蓝色光泽。黑色的初飞羽部分为红色，与红色的大覆羽形成翼斑。胸部、腹部、下背和尾覆也是红色的。雌性具有红色眉纹、红色下巴和脸颊；红色红色。


    **分布地：** 分布于爪哇岛和西苏答腊的山地森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_118_1.png)


    ## 火蜜吸 *Pericrocotus flammeus* 19cm


    印尼语名：Sepah Hutan


    雄性的头部、冠部、后脑和背部为带蓝色光泽黑色，下部、臀部和尾缘为红色。主要的黑色翅膀有两个斑块。雌性具有灰色冠部和背部，以及橙黄色下部（包括喉部和耳覆），形成眼纹。臀为灰绿色。


    **分布地：** 分布于全地区。森林栖息鸟，通常成群在树冠层觅食。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_119_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_119_1.png)


    ## 爪哇伯留 *Coracina javensis* 28cm


    印尼语名：Kepadang-sungu Jawa


    雄性羽毛呈灰色，除了黑色尾巴的白色边缘和深灰色翅白色边缘。腹部的灰色在火斑处几乎消失。耳覆和脸部为深灰色。雌性相似但颜色较浅，下部和侧腹有灰色纹。不应与非常相似但较小的巽丹伯留（*C.
    larva*）混淆，后者在某些海拔与其共生。


    **分布地：** 分布于爪哇岛和巴厘岛森林较多的草地地区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_120_0.png)


    ## 勒氏留丝莺 *Lalage sueurii* 17–18cm


    印尼语名：Kapasan Sayap-putih


    雄性以黑白为主，雌性上部棕色下部肉黄色。雄性头部和背部具有绿色光泽。有一条细白色眉纹，下方一条黑色眼纹通过眼睛连接黑色后脑。臀部和下尾覆为灰色，白色的上覆形成一个白色区域。下部（包括喉部和耳覆）为白色。


    **分布地：** 分布于爪哇岛中部和巴厘岛，通常在开阔森林中，经常靠近人类定居点。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_120_1.png)


    ## 留丝莺 *Lalage nigra* 16–18cm


    印尼语名：Kapasan Kemiri


    真正的黑白斑雄性从额头到冠部、后脑及背部均为黑色，上覆部为灰色。一条黑色眼纹从额纹延伸到后脑，上方是宽大的白色眉纹。眼纹下方的头部、下巴和其余下部为白色。翅羽为黑色，除了中覆和大覆处有一块宽白斑。次级飞羽为白边。雌性具有棕色冠部和背部，以及带有浅纹的棕胸。


    **分布地：** 分布于该地区的沿海红树林和开阔灌丛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_121_0.png)


    ## 小绿兜留 *Lalage fimbriata* 19–21cm


    印尼语名：Kepudang-sungu Kecil


    这种小型伯留羽毛为深灰色，上部较深，臀部较浅。额纹、耳覆和翅膀呈黑色，下覆为浅灰色。喙和腿为黑色，虹膜为棕色。雌性较浅，下部有黑色横纹。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_121_1.png)


    **分布地：** 分布于全地区。常见于低地森林、沼泽林和耕地，在那里以食昆虫。


