    整体呈现深蓝褐色，直立姿态，拥有大头部、橙红色的喙和蓝色喉部。飞行时，下翅上有两个圆形的浅蓝色斑块，赋予了这只鸟的英文名称。幼鸟颜色较暗较浅，喙呈黑色。


    **观赏地点：** 地区内唯一的兜鸟科类成员。分布广泛但不常见；通常单独或成对出现。


    ## 铜喉蜂 Psilopogon haemiceps 15–17cm


    印尼语名称：Takur Ungkut-ungkut


    拉长而共鸣的 tonk-tonk-tonk 叫声，让人想起敲击金属，宣告了这只鸟的出现。背部、翅膀和尾巴是绿色的，浅褐色腹部带有黑色条纹。发现于爪哇和巴厘岛的具有红色冠、下巴和脸颊；苏门答腊的具有黄色喉部、脸颊和眉纹。细的黑色颈环隔开了红色和黄色的颈部标记。脚是红色的。


