    Indonesian name: Elang Jawa

    Indonesia''s national bird, easily identified by its conspicuous white-tipped
    dark crest. It has a black moustachial stripe and buff throat and underparts streaked
    black on neck and brown on belly, white-feathered wings. The sides of the head
    and nape are a rich russet-brown blending into dark brown upperparts. The long
    tail is brown with black barring. The iris and legs are yellow and the cere dark
    grey.


