    # MAP OF THE REGION


    Map of the region


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_4_0.png)


    # INTRODUCTION


    The islands of Bali, Sumatra and Java total some 613,000 square kilometres, almost
    2½ times the area of the United Kingdom, and possess approximately 700 bird species.
    With such a rich avifauna, it is hardly surprising that birds are widely kept
    for their beauty and song. Visitors, who now reach the region in ever-increasing
    numbers, cannot fail to notice that many houses have caged birds hanging from
    the eaves. Close inspection reveals that many of the species in captivity are
    often the same as what once found in pet stores around the world. Fortunately,
    much of the international trading has now ceased, but local markets persist, taking
    their toll on local populations, some being brought to the edge of extinction
    in spite of protective legislation.


    So far, only the Java Lapwing has become extinct in recent times, but several
    other species, not notably the Bali Myna, are hovering on the brink. The demise
    of the Bali Myna is widely documented and is largely the result of illicit trapping,
    exacerbated by human disturbance and loss of habitat. The same dismal picture
    is repeated for many other species, including the Java Sparrow, Brahmin Kite and
    Black-winged Starling, of which, were not many years ago, a common sight.


    It is fortunate that the Indonesian authorities, in conjunction with national
    and international conservation organisations, have recognised the urgent need
    for protection, and vast areas have now been designated as national parks and
    reserves, with special protection for wildlife. Visitors should keep in mind that
    permits are officially required to enter many of these reserves, and prior arrangements
    may be necessary. Even outside reserve areas the most threatened animals are protected,
    at least in theory.


    Within the space limitations of this small book, it would be impossible to cover
    all the 700 or so bird species that have been recorded on the main islands of
    Bali, Sumatra and Java. The selection has therefore been based upon birds that
    are reasonably common throughout the region. A few less common but interesting
    and more spectacular species have been added to reveal the enormous biological
    diversity to be found there and to provide an understanding of its characteristic
    nature.


    The 322 species treated include a reasonable representation from most of the families
    that may be encountered in the region. The reader will undoubtedly come across
    others, and these are covered in the more specialised (but unfortunately more
    cumbersome) books listed for further reading or on the internet.


    # BIRDWATCHING


    For most of us, birdwatching is a hobby that brings us closer to nature. It is
    a rewarding way to experience the world and learn about the incredible creatures
    that inhabit it. Whether you are a seasoned expert or a casual observer, birdwatching
    offers a wealth of discovery and joy. In the region of Bali, Sumatra, and Java,
    the diversity of bird life makes it a truly spectacular place to explore.


    Birdwatching aids


    Having the right equipment is essential for any birdwatching experience. A good
    pair of binoculars is the most important tool, allowing you to see and identify
    birds from a distance. A telescope can also be useful for observing finer details
    of birds far away. A field guide is indispensable for identifying species, and
    for those who wish to capture photographs, a camera with a telephoto lens is often
    necessary. A digital voice recorder can also be used to capture bird calls, which
    can be helpful for identification. Finally, a notebook and pen are useful for
    recording observations and notes.

