    ## 长尾伯劳留 Lanius schach 20–25cm


    印尼语名称：Bentet Kelabu


    通过长黑尾巴、直立的姿态以及棕、黑、白色的羽毛易于识别。它有灰色的冠部和后脑，栗褐色的肩部、背部和臀部；腹部为纯白色。成年鸟有一条贯过额头并跨耳羽的黑色面罩。幼鸟颜色通常较暗，头部和后脑呈深灰色，侧腹和背部有条纹。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_138_0.png)


    **可见区域：** 遍布该地区。通常成对出现，在草原和灌木丛中游荡，也会进入人类居住地边缘的耕地和种植园。


    ## 常见的绿喜鹊 Cissa chinensis 31cm


    印尼语名称：Eek Layongan


    这种喜鹊以绿色为主，有一条明显的黑色面罩，从眼睛延伸到后脑。较黄绿色的羽毛还延伸形成后脑处的一个短短冠。翅羽为深栗色，除浅绿色的肩羽和上翼覆羽除外。尾巴下部为浅绿色；红色的眶环环绕着褐色的虹膜；粗实的喙和腿部为红红色。亮绿色的羽毛有时会被阳光褪成淡蓝色，特别是在圈养状态下。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_138_1.png)


    **可见区域：** 出于苏门答腊的山区和山地森林。


    ## 凤尾山鹊 Crypsirina temia 31–33cm（含18cm长尾巴）


    印尼语名称：Tangkar Centrong


    这种乌鸦科成员羽毛呈均匀的黑色，带有青铜色光泽。它有黑色的脚、强有力的黑喙和蓝色的眼睛。它与该地区所有相似鸟类的区别在于拥有一条长尾巴，中央羽毛末端呈匙状。


    **可见区域：** 留爪爪爪和巴厘岛。通常栖息于低地和山地森林以及种植园，经常出现在次生林、更多开垦地区，甚至是灌木丛和花园。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_139_0.png)


    ## 短爪乌鸦 Corvus enca 43–48cm


    印尼语名称：Gagak Hutan


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_140_0.png)


    这种全黑的乌鸦比该地区较大的亲戚大嘴乌鸦更纤细、尾巴更短。它的喉部冠羽较少，眼睛周围有不明显的黑色裸皮。大部分羽毛呈微弱紫色光泽，除暗黑色的腹部除外。长而微下弯的喙是黑色的，腿也是黑色的，虹膜为褐色。飞行时显示出方形的尾巴和宽而短的翅膀。


    **可见区域：** 遍布该地区的森林和森林边缘，有时成对出现。


    ## 大嘴乌鸦 Corvus macrorhynchos 47–50cm


    印尼语名称：Gagak Kampung


    这种体型巨大的黑色乌鸦通过其强壮、结实的喙、更突出的额头和更明显的喉部冠羽与其亲近的短爪乌鸦区分开来。它的整体羽毛有紫色光泽。虹膜为深褐色，脚为黑色。即使是腹部也显示出光泽，幼鸟除外（幼鸟外观呈柔光状）。飞行时它有长而宽的翅膀，初羽宽开，尾巴长。


    **可见区域：** 遍布该地区的开阔地物种，通常靠近人类居住地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_140_1.png)


    ## 留鴴 Eupetes macrocerus 28–30cm


    印尼语名称：Sipinjur Melayu


    这种独特的留鴴出现在该地区，它们几乎完全陆栖，主要通过其忧伤的哨鸣声被发现。它有长脖子和尾巴。羽毛在后上部和腹部大部分为红褐色，腹部、颈部和翅下变得更红，下巴和喉部为栗色。额前为肉黄色，冠部为栗色，带有宽白色眉纹，上方有一条从流口处到后脑的宽黑色眼纹。在眼纹后脑部下方，每个喉下囊上方都有亮蓝色的斑块。喙和腿是黑色的，虹膜为褐色。


    **可见区域：** 出于苏门答腊，主要在密林中。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_141_0.png)


    ## 灰头绿鹨 Culicicapa ceylonensis 12–13cm


    印尼语名称：Sikatan Kepala-abu


    这种小鹨具有典型的直立姿态，带有竖起的浅冠。头部（从喙到后脑）、脸侧面、颈部和上胸均为灰色。上部从肩部到臀部以及上翼覆羽为暗绿色。黑色的翅羽边缘有淡绿色。从胸部到尾端覆羽的腹部为淡黄色。白色眼环环绕着褐色的虹膜；喙上方为黑色，下部为粉红色。


    **可见区域：** 遍布该地区的森林和林地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_142_0.png)


    ## 灰冠山 Parus cinereus 13cm


    印尼语名称：Gelatik-batu


    这些鸟体型较小，呈黑、白灰色。头部和喉部是黑色的，有一条从喉部到腹部的黑色条纹；雄性腹部条纹较宽，雌性较窄且断续。脸颊有一块大白斑，后脑有一个小白点。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_142_1.png)


    ## 爪爪雀 Mirafra javanica 13–15cm


    印尼语名称：Branangan Jawa


    这种鸟具有斑驳的深褐褐色上部，腹部较浅。它有肉黄色的眉纹和褐色的喙。腿是粉色的。这种鸟偶尔栖息在树上，但经常在地上看到，发出高调的鸣声。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_143_0.png)


    **可见区域：** 出于短草地的开放区域。


    ## 普通织雀 Ototomius sutorius 10–14cm


    印尼语名称：Cinenen Pisang


    这种像鹴一样的林鴴上部为橄榄绿色，腹部较浅。头部从后脑到耳羽和流口处为亮栗色，喉部为肉黄色白色。较长的喙上方为褐色，下部为粉红色，虹膜为淡红色。雌性颜色较暗，下巴为白色。


    **可见区域：** 常见于爪哇岛的灌木丛和花园。


    ## 灰尾织雀 Ototomus ruficeps 12cm


    印尼语名称：Cinenen Kelabu


    这种小巧、颜色单一的织雀背部为褐色，腹部为灰色，腹部变为白色。雄性有褐色的脸部、冠部和喉部，而雌性只有较浅的褐色脸部和冠部，且喉部为白色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_144_0.png)


    ## 绿织雀 Ototomus sepium 12cm


    印尼语名称：Cinenen Jawa


    这种织雀上部为橄榄灰色，下部较浅，腹为白色。雄性的头部几乎完全是浅栗色，包括从冠部到耳羽以及流口处到后脑处；下巴颜色较浅。雌性脸部的栗色较少。灰色的尾巴在深色末端斑纹下方有一个细细的白色尖。腿是粉色的，相当长的喙上方为褐色，下部为粉红色，虹膜为淡红色。雌性颜色较暗，下巴为白色。


    **可见区域：** 出于爪哇岛和巴厘岛的灌木丛、耕地和红树林。


