    ## 亚洲褐伯劳 *Muscicapa dauurica* 12–14cm


    印尼语名称：Sikatan Bubik


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_182_0.png)


    这种位于山地森林和森林边缘的物种经常出现在种植园、开阔林甚至花园中。它们在裸露的栖处上捕食空中昆虫，回到栖处时经常会抖动尾巴。背部呈灰褐色，腹部呈白色，侧腹和胸侧变为灰褐色，有浅色眼环。黑色喙下颌基部呈黄色。


    **观赏地点：** 从东北迁徙该地区的冬鸟，但部分个体可能留在此苏门答腊北部。出现在林地、森林和灌木丛，有时靠近耕作地。


    ## 斑冠画� *Copsychus malabaricus* 21–27cm


    印尼语名称：Kucica Hutan


    雄性具有极长的尾巴，约占其总长度的一半，中央羽毛颜色暗，外缘为白色，它在降落时习惯性地抖动。它的头部、颈部、背部和翅膀为黑色带有蓝色光泽，下腹部为深橙色，臀部有明显的白色斑块。这是另一种因宠物贸易捕捕而数量减少的优歌鸟。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_182_1.png)


    **观赏地点：** 分布于苏门答腊和爪哇，花费大量时间在茂密灌木丛的地面觅食。在苏门答腊的茂密森林中很常见，但在爪哇较少见。


    ## 亚洲红鹊� *Copsychus saularis* 20cm


    印尼语名称：Kucica Kampung


    苏门答腊的鸟具有黑色翅膀和尾中羽，外尾羽、腹部和尾门处为白色，覆羽上有一条宽的白斑；而来自东爪哇和巴厘的个体除白色斑块外全为黑色。雌性颜色暗得多，黑色羽毛被灰色取代。幼鸟具有相似但斑驳的羽毛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_183_0.png)


    **观赏地点：** 分布于整个地区的低地红树林和森林到花园。曾因宠物贸易的捕捕导致数量大幅下降。


    ## 浅蓝飞� *Cyornis unicolor* 16–18cm


    印尼语名称：Sikatan Biru-uda


    这种中等体型长尾飞�雄性主要呈蓝色，而雌性为灰褐色。雄性眉间为黑色，额头为浅蓝色并逐渐过渡为短的眉纹。喉部为浅蓝色，向腹部变为灰色，尾下覆为白色。雌性背部为灰褐色，腹部为肉褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_184_0.png)


    **观赏地点：** 出于苏门答腊和爪哇的茂密湿润森林。


    ## 爪哇丛飞� *Cyornis banyumas* 14–15cm


    印尼语名称：Sikatan rimba Jawa


    雄性背部深蓝色，额头和肩部有光泽。下巴、眉间和眼周的细线为黑色，而喉部和胸部为橙红色，向腹部和尾门变为白色。喙为黑色，基部逐渐变为暗紫色，腿从深褐色到浅粉色不等，虹膜为深褐色。雌性背部为褐色，有乳白色眼环，腹部与雄性相似但颜色较浅。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_184_1.png)


    **观赏地点：** 出于爪哇，它们偏好低矮灌木丛、竹林以及高山森林空地的边缘。


    ## 红树林丛飞� *Cyornis rufigastra* 15cm


    印尼语名称：Sikatan rimba Bakau


    特征性的蓝色背部和橙红色腹部。喙为黑色，腿为蓝灰色，尽管雌性颜色较浅，有白色的下巴和白色眉斑。许多亚种在背部和腹部的颜色深浅上有所不同。它最容易与山蓝飞�（*Cyornis
    banyumas*）混淆，后者的额头较浅且发黑。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_185_0.png)


    **观赏地点：** 出于苏门答腊和爪哇西中部的红树林，也出现在东爪哇的巴鲁兰国家公园和巴厘岛的巴厘西部国家公园。


    ## 苏门答腊蓝� *Niltava sumatrana* 15cm


    印尼语名称：Niltava Sumatera


    雄性深蓝色的背部在额冠、臀部、覆羽和尾部有光泽，背部和翅覆上为深蓝色。飞行羽为蓝黑色，边缘为深蓝色。颈部有一条细的虹光蓝色线条，肩部有斑块。眉间和额冠、下巴、喉部和耳羽为蓝黑色。从颈部到尾下覆的腹部呈橙色。额冠到后脑的背部侧部为灰褐色，脸部为棕褐色，尾门为白色。


    **观赏地点：** 出于苏门答腊巴里桑山脉的山森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_185_1)


    ## 黑白飞� *Cyanoptila cyanomelana* 16–17cm


    印尼语名称：Sikatan Biru-putih


    这种飞�雄性额头、上覆羽、翅羽和尾羽主要为深蓝色，脸部为棕褐色，边缘黑色。眉间、脸部、耳羽和胸部为黑色，尾部为棕褐色。喙为黑色，虹膜为深褐色。雌性额冠到后脑为灰褐色，尾部为棕褐色。


    **观赏地点：** 冬在苏门答腊和爪哇的山地森林。


    ## 靛蓝飞� *Eumyias indigo* 14cm


    这种物种主要是深蓝色，尤其是背部部分。喙为黑色，腿为灰色。幼鸟具有相似但斑驳的羽毛。


    **观赏地点：** 在爪哇的山地森林中相对常见。


    ## 绿海石画�飞� *Eumyias thassinus* 15–17cm


    印尼语名称：Sikatan kicau Hijau


    这是一种直立姿态的大飞�。雄性的羽毛呈均匀的青蓝色，额头和喉部颜色更亮。眉间和脸部未达到黑色。雌性较暗且偏绿，幼鸟为褐色带有肉褐色腹部。


    **观赏地点：** 出于苏门答腊，它们偏好森林边缘，并选择裸露的栖处攻击飞过的昆虫。


    ## 蓝嘴画嘴� *Myophonus ceruleus* 29–35cm


    印尼语名称：Ciung-batu Siul


    这种蓝黑色的画嘴�具有中等紫色光泽，翅覆上稀疏分布着白色点和斑。对比鲜明的黄色喙通常有黑色斑纹，苏门答腊的鸟尤为如此。腿为黑色。它们有高频的尖叫警报声（screech-chit-chit-chit-chit），响响亮的鸣声经常模仿其他鸟的歌声。


    地面觅食，取食昆虫、无脊椎动物和小果实。


    **观赏地点：** 在爪哇和苏门答腊罕见，但在巴厘岛缺失。通常出现在河流边的茂密低地和山地森林以及裸露的石灰岩地带中。


    '
