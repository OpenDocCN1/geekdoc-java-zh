    # Gede/Pangrando National Park


    This West Javan national park consists mainly of luxuriant evergreen forests,
    but with mossy elfin forest and alpine meadows at the peak of Gunung Pangrando.
    It is a wonderful place to see many of the Javan Tesia, Javan Cochoa, Javan Hawk
    Eagle, Chestnut-nutled Partridge, Javan Scops Owl, Javan White-eye, Dusky Horsfield''s
    Woodcock, Pygmy Tit, Mountain Serin, Volcano Swiflet and Blue-tailed Trogon.


    mangroves and a rather rugged coastline with some beautiful beaches. It is one
    of the least explored areas where new discoveries are likely to be made. Among
    the rarer birds are Wreathed Hornbill, Banded Woodpecker, Violet Cuckoo, Pin-tailed
    Finch, Black-crested Bulbul, Greychecked Green Pigeon, Black-naped Fruit Dove,
    Javan Owlet, Waterfall (or Giant) Swiflet, Black-banded Barbet and Crescent-billed
    Babbler.


