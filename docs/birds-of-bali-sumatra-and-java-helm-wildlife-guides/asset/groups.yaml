    ## 白腹长尾留 Rhipidura euryura 18cm


    印尼语名称：Kipasan Bukit


    雄雌性羽色非常相似；整体以淡灰色为主，但腹部中部以下为白色。它有宽大的白色眉纹，外尾羽末端呈白色。喙和腿为黑色，虹膜为深棕色。


    观赏地点：出现在爪哇岛茂密的山地森林，通常与其他物种一起成小群活动，觅食小型飞行昆虫。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_0.png)


    ## 黑鹊尾留 Dicrurus macrocercus 25–30cm


    印尼语名称：Srigunting Hitam


    这种尾留留黑色羽毛，带有细微的光泽，尾巴长且深叉，外尾羽尖端倾向于向外弯曲。幼鸟腹部有浅灰色的横纹。与大多数其他鹊尾留不同，它偏爱开阔地带，经常与牛群在一起，牛群会扰动昆虫猎物。


    观赏地点：出现在爪哇岛和巴厘岛。经常出现在开阔的灌木丛、耕地和稻田，栖息在路边的栅栏、孤立的树枝和电线上。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_1.png)


    ## 灰鹊留 Dicrurus leucophaeus 26–29cm


    印尼语名称：Srigunting Kelabu


    这种鹊留具有典型的长叉尾和直立的姿态。羽毛呈浅蓝灰色，上喙基部有一簇黑色羽毛。该地区的亚种在灰色调上各不相同。苏门答腊的鸟类偶尔有白色额缘斑，北苏门答腊的斑色稍深。通常观察到它们成对出现，停在暴露的树枝上等待，然后俯捕飞过的大型昆虫。


    观赏地点：遍布整个地区。开阔林地、森林边缘和空地的鸟类。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_131_0.png)


    ## 乌嘴鹊尾留 Dicrus annectensens 27–30cm


    印尼语名称：Srigunting Gagak


    这种健壮而优雅的鹊尾留喙部强壮且宽阔，非常适应于捕捉飞行中的昆虫。喙的基部被一层短羽覆盖。头部为黑色，背部其余部分呈光亮的黑色并带有蓝色光泽。腹部为黑色，通常有白色斑点。长而近黑色的叉尾，其外尾羽向外弯曲。腿和喙为黑色，虹膜为深红色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_0.png)


    观赏地点：作为迁徙鸟出现在苏门答腊和西爪哇，出没于林木丛低地和丘陵。


    ## 爪哇斑鹊尾留 Dicrus jentincki 27–29cm


    印尼语名称：Srigunting Jawaut


    这种不常的鹊留有独特的叉形尾，外尾羽向外并向上展开，几乎呈琴形。它冠额前方还有一个非常奇特的长毛状羽毛冠，但这一特征具有变异性。它的眼睛呈非常浅的褐色。整体羽毛为光亮的黑色，带有虹彩斑点，特别是在冠部和上胸部。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_1.png)


    观赏地点：出现在东爪哇岛和巴厘岛。它们在低地和亚山森林的开阔地区很常见。


    ## 小鹊尾留 Dicrurus remifer 25–28cm


    这种罕见的鹊尾留有独特的叉形尾，外尾羽向外并向上展开，几乎形成琴形。它冠额前方还有一个非凡的长毛状羽毛冠，但这一特征是不固定的。它的眼睛呈非常浅的褐色。整体羽毛为光亮的黑色，带有虹彩斑点，特别是在冠部和上胸部。


    观赏地点：出现在东爪哇岛和巴厘岛。它们在低地和亚山森林的开阔地区很常见。


