    ## 斑腹鴴 *Prinia polychroa* 15–16cm


    这种大型、体色暗淡的鴴有长长的棕色尾巴。繁殖羽时期颜色更暗，羽毛磨损严重。在其他时候，颜色变得没那么暗，眼睛前方有白色的眉纹，腹部为浅肉黄色，背部为棕色并带有深色条纹。繁殖期喙为黑色，其他时候为棕色或黄褐色。腿为粉褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_145_0.png)


    何处可见：分布于爪哇岛，喜栖于干旱的低地灌木丛。


    ## 宽双纹鴴 *Prinia familiaris* 13cm


    这是一种噪闹、多变且群居性的小鸟，在从地面到树梢觅食昆虫时，经常发出响亮、高频的啾啾声。它的特征是长长的尾巴，羽毛末端有黑白色，背部为暗淡的橄棕色，并有两条明显的白色翼带。喉部的白色延伸至上腹中部，侧腹为浅灰色，下腹和尾门处为浅黄色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_145_1.png)


    何处可见：爪哇岛和巴厘岛低地非常常见的特有种，但在苏门答腊较少见，尤其是北部。它喜好次生林，特别是公园花园、红树林、种植园和灌木丛。


    ## 黄腹鴴 *Prinia flavviventris* 12–14cm


    印尼语名称：Perjenak Rawa


    看起来像长尾林莺，背部和尾部为橄棕色，腹部为亮黄色，下巴、喉部和上胸为白色。头部呈灰色，有红橙色的眼环和极细且通常断续的白色眉纹。腿和脚为暗橙色，喙上部为深褐色，下部为浅棕色。这种鴴的歌声较弱。


    何处可见：发现于苏门答腊和西爪哇，在低地的草地、芦苇丛和茂密的灌木丛中常见。它们习性害，于躲在湿地栖息地的草丛和芦苇中。


    ## Plain腹鴴 *Prinia inornata* 11cm


    印尼语名称：Perjenak Padi


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_146_0.png)


    这种小型鴴背部呈单一的灰褐色，从冠部到耳罩一直到它长长的、尖的、末端带肉色的尾巴。腹部向腹部和尾门处变为白色肉褐色。它有宽大的白色眉纹。腿为浅棕色。繁殖期喙为黑色，后期变为浅棕色。


    何处可见：分布于爪哇岛和巴厘岛，有灌木丛草地的各种栖息地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_146_1.png)


    ## 噪喉奎�� *Cistica juncidis* 10cm

    印尼语名称：Cici Padi


    这种相当不起眼的小棕色鸟背部有密集的深棕色和肉褐色条纹。白色的腹部和尾门在侧腹处为肉褐色，棕黑相间的尾巴末端带白色。它有粉色的腿、灰黑色的喙和浅褐色的虹膜。它宽大的白色眉纹使其与金头奎��区分开来。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_147_0.png)


    何处可见：遍布整个地区。低地草地和芦苇丛中常见；它们会被湿润栖息地和稻田吸引。


    ## 金头奎�� *Cistica exilis* 9cm

    印尼语名称：Cici Merah


    繁殖期雄性具有温暖的金黄色冠部和尾椎。非繁殖期鸟和雌性与噪喉奎��非常相似，但头部颜色更金，肉色的眉纹与颈后和头部侧面颜色相同。喉部为白色，腹部为肉褐色。深棕色的尾巴末端带肉褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_147_1.png)


    何处可见：遍布整个地区。爪哇岛和巴厘岛芒草地、稻田和芦苇丛的常见鸟。仅在苏门答腊局部常见。


    ## 东方苇�� *Acrocephalus orientalis* 19cm


    印尼语名称：Kerak-basi Besar


    这是一种大型棕莺，有明显的浅肉色眉纹，下方有一条细细的深褐色眼纹。它的腹部为白色，在侧腹、尾上部和上腹处变为肉褐色，上腹和胸部侧面有稀疏的棕色条纹。最大的喙上部为棕色，下部带粉色，腿为蓝灰色。


    何处可见：作为冬季迁徙鸟遍布整个地区。通常出现在低地芦苇丛和海岸沼泽，但经常出现在水边的稻田和灌木丛中。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_148_0.png)


    ## 纹草雀 *Megalurus palustris* 22–28cm

    印尼语名称：Cica-koreng


    这种大型长尾莺（雄性比雌性大）背部有密集的棕褐色条纹，白色腹部在侧腹和尾部变为棕褐色。它在深棕色眼纹上方有宽白色眉纹。背部为浅褐色，腹部带有肉褐色条纹。喙和虹膜为棕褐色。


    img/e8dcc79b99f6b63c1dff9f174c158e29_148.png)


    何处可见：栖息于爪哇岛的湿地和沼泽。


    ## 矮尾寿驹 *pusilla* 8–9cm


    这种微小的无尾驹背部为温暖的橄棕色，白色腹部在肩羽处带有深棕褐色。面部和耳罩为灰褐色，带有白色斑纹。喙为黑色，腿为棕褐色，虹膜为棕褐色。两性颜色相似。


    img/e8dcc79b99f6b63c1dff9f174c158e29_149_0.png)

    img/e8dcc79b99f6b63c1dff9f174c158e29_149_1.png)

    img/e8dcc79b99f6b63c1dff9f174c158e29_149_2.png)


    何处可见：爪哇岛的山地。


    ## 家燕 *Hirundo rustica* 17–19cm


    印尼语名称：Layang-layang


    家燕上部为深蓝色，带有白色胸部和长翅羽。额头和喉部为红色，上胸有深蓝色横纹。幼鸟颜色较暗且缺乏红色。


    何处可见：在该地区越冬。它们喜欢在高空飞行并捕食昆虫，有时在湖泊、溪流、芦苇丛甚至建筑中筑巢。


    img/e8dcc79b99f6b63c1dff9f174c158e29_150_0.png


    ## 红喉驹 *Pycnotus dispar* 17–20cm


    印尼语名称：Cucak Emas


    这种大型驹上部呈橄榄绿色，腹部较浅。其特征是黑色头部带有羽状冠部、鲜红的喉部以及带白色的圆尾。两性颜色相似。喙为黑色，腿为近黑色，虹膜为浅褐色。


    何处可见：在该地区植被良好的高木和次生森林。


    ## 鳞腹驹 *Pycnonotus squamatus* 14–16cm

    印尼语名称：Cucak Bersikis


    背部（包括肩羽到尾椎）为橄榄绿色，翅膀颜色稍深，黑尾末端带白色。腹部胸部和侧腹为黑色，羽缘边缘为白色，形成鳞状。下巴、颈部和下腹为白色，尾覆盖羽为黄色。头部从额部经过冠部到颈后和耳罩均为黑色。虹膜从红色到黄色不等；腿和细喙为黑色。苏门答腊的种群背部颜色更深。


    何处可见：最可能出现在爪哇岛和苏门答腊的森林边缘。


