    ## Trilling Shrike-vareo Pteruthius aenobarbus 12cm

    Indonesian name: Ciu Kunyit


    Males of this small shrike-babbler have olive-green tinged yellow uparts, including
    crown, ear-covers and the outer parts of the secondary wing feathers. The upperwing-covers
    are black tipped white, forming double wing-bars. The chin, throat and lower forehead
    reddish-black with a narrow yellow band below the forecrown. It has a white eye-ring
    underlined black at the rear. The belly is bright olive-green, as are ear-coverts,
    which are grey bordered and join with a grey supercilium. The legs are pink and
    the bill blue-grey. Females are duller with a buff-green throat.


    Where to see: Occurs in the lower montane forests of Java.


    ## Pied Shrike-vireo Pteruthius flaviscapis 14cm

    Indonesian name: Ciu Jawa


    This plump little bird appears to have a proportionately large head and thick
    bill. Males have a black head with a conspicuous white eyebrow, grey mantle and
    back, and black wings and tail, with the primaries tinged chestnut and yellow.


    The underparts are whitish. Females have a grey head, less distinct eyebrow, and
    greyish-green uparts.

    Where to see: Occurs on Java, more often in the canopy of more open montane forests.


    ## Tenggara Whistler Pachycephala calliope 17–19cm

    Indonesian name: Kancilan Tenggara


    The male has brilliant black, white and bright yellow plumage. The yellow nape
    patch is joined by a narrow yellow band to the breast, belly and vent, while the
    head is black except for a white chin and throat, leaving a narrow black band
    between the throat and belly. The upperparts are olive-green and the tail is almost
    black. Females have drab upperparts and dirty buff underparts, with the lower
    belly and undertailcoverts tinged yellow.


    Where to see: Occurs in East Java and Bali in hill and montane forest, impenetrable
    woodland and second growth.


    ## Dark-throated Oriole Oriolus xanthonotus 17–19cm

    Indonesian name: Kepadang Hutan


    The male has head, mantle and neck to upper breast all black. The remainder of
    the upperparts are bright yellow. The flight feathers are black fringed with pale
    yellow. The tail is black with central-tail feathers also yellow. The belly is
    white, heavily streaked black. The bill is a muted orange, legs grey and iris
    dark red. The female is duller with upperparts generally olive green and underparts
    white streaked black with yellow undertail-coverts.


    Where to see: Occurs in lowland forest edges of Sumatra and Java.


    ## Black-naped Oriole Oriolus chinensis 23–28cm

    Indonesian name: Kepadang Kuduk-hitam


    The male is a brilliant yellow, with a distinct black stripe passing through the
    eye and across the nape. The flight feathers and tail are black, edged yellow.
    The female is much duller. Juveniles show olive green where adults are black,
    and they have black-streaked, whitish underparts. It adheres to the tree canopy
    while foraging for insects and soft fruit.


    Where to see: Occurs commonly throughout the region''s lowlands and hills, favouring
    secondary and open forest, parks and gardens, mangroves and coastal scrub.


    ## Black-and-crimson Oriole Oriolus sanguineus 21–24cm


    Easily identified as a medium-sized oriole, the males having all-black plumage
    except from the crimson-red upper belly and a small crimson patch on the primary
    covers. It has a distinctive pale blue-grey bill and blue-black legs. Females
    are all black, with the breast tinged chestnut and streaked with grey on the belly.
    It has a cat-like, mewing call.


    Where to see: Occurs on Sumatra, mainly in the treetops of broadleaf evergreen
    and hill forests.


    ## White-breasted Woodswallow Artamus leucorychos 18cm

    Indonesian name: Kekap Babi


    The only resident woodswallow in the region, showing similarities to true swallows
    in stance and easily distinguished by its stockier appearance, broader, triangular-shaped
    wings and squarish, forked tail. Its heavy bill is grey, and the entire upperparts
    except for the white rump are dark-grey. The underparts are white. Feeds on insects
    caught in flight.


    Where to see: A common bird of open spaces, particularly in the lowlands and hills,
    throughout the region.


    ## Black-winged Flycatcher-rike Hemipus hirundaceus 14–15cm

    Indonesian name: Jingjing Batu


    Males’ upperparts are all black with greenish iridescence from the nape to the
    tail, apart from a white rump with slight barring. The underparts, throat and
    sides to the neck are white. Bill and legs are black and iris brown. Females and
    juveniles are similar but more grey looking mottled.


    Where to see: Found throughout the region’s lowland forest edges.


    ## Rufous-winged Phaniotis pyrhyptera 16–17cm

    Indonesian name: Sayap-merah


    One of the larger flycatchers, occurring in colour forms. The male of the more
    common rufous-winged form has dull-blue upperparts down to the centre of the back
    and blue underparts to the centre of the belly. The lower belly and vent are buff-white.
    The secondaries, greater coverts and tail are chestnut and the primaries dark-brown.
    The legs are blue-grey and the bill is black and iris red. The blue form is all
    dark-grey with paler lower belly and vent. female’s upperparts are brown shading
    into dark grey towards the top of the head. Underparts buffish on the breast.


    Where to see: Occurs on Sumatra, mainly in lowland forest.


    ## Common Iora Aegithina tiphia 12–15cm

    Indonesian name: Cipoh Kacat


    The Sumatraen subspecies have olive-green to bright green uparts, a white rump,
    and yellow underparts. The wings are black, with distinct white and yellow edges
    and two clear wing-bars. On Java and Bali the subspecies has more subdued colour,
    the uparts being a paler olive-green. There is a clear yellow eye-ring. Both bill
    and feet are bluish-grey.


    Where to see: Occurs throughout the region, inhabiting open lowland forest and
    mangroves, but can frequently in town gardens.


    ## Green Iora Aegithina virissima 12–15cm

    Indonesian name: Cipoh Jantu


    The upperparts of the male are dark olive-green with the underparts paler, becoming
    yellower at the vent. The tail and flight feathers are blackish, sometimes edged
    olive-yellow. The coverts are black tipped white, forming two conspicuous wing-bars.
    A narrow band of black skin surrounds the eye, encircled by an area of pale yellowish
    feathers. The iris is brown and the legs are blue-grey. The bill is black above,
    blue-grey below. Females and juveniles are yellow and brighter.


    Where to see: Occurs commonly in the canopy of Sumatran forests.


    ## Sunda Pied Fantail Rhipidura javanica 18–19cm

    Indonesian name: Kipasan Belang


    This very active, small fantail displays a typical wing-drooping posture and regular
    flicking and fanning of the tail. The upperparts are dusky-black, the underparts
    white with a diagnostic black chest band, and there is a thin white eyebrow. When
    the tail is fanned, the broad bill tips to the feathers are obvious. Both bill
    and legs are black and the iris is dark brown. Sumatran birds appear to have blacker
    upperparts and slightly longer tails.


    Where to see: An open-habitat species occurring throughout the region''s scrublands,
    open woodland, second growth, mangroves and even gardens.

