    ## Purple Heron Ardea purpurea 75–90cm

    Indonesian name: Cangak Merah


    Similar in height to the Grey Heron, this more elegant, slimmer bird has a less
    hunched stance. Easily distinguished from other herons of its size by its darker
    underparts and its black-streaked, russet-coloured neck and upper breast. The
    back and wings are greyish-purple with a scattering of long russet plumes. It
    has a yellow-brown bill, reddish-brown legs and yellow iris. Juveniles have plainer
    brown plumage, less streaking on the uppersparts and brown bill and legs. Although
    more solitary, it congregates in large colonies to nest.


    **Where to see:** Occurs throughout the region in typical heron open habitat of
    rice fields, swamps, mangroves and lakes, and often inland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_72_0.png)


    ## Great Egret Ardea alba 80–104cm

    The largest of the white egrets, with a more substantial bill and a peculiar kink
    midway along the neck. During the breeding period, the facial skin becomes greyish-blue
    and the lores green, the bill turns black and the bare thighs turn red. At other
    times of the year, the facial skin is dull yellow, the bill is yellowish, occasionally
    tipped black, and the feet and legs are all black. Juveniles have a black-tipped,
    yellow bill.


    Where to see: Occurs throughout the region, preferring mudflats, mangroves and
    coastal marshland, as well as rice fields, where it is found either alone or in
    small groups, feeding on small fish and frogs.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_73_0.png)


    ## Intermediate Egret Ardea intermedia 64–72cm

    Indonesian name: Kuntul Perak


    It is intermediate in size between the Great Egret and Little Egret but is less
    common. Recognised by its overall slightly off-white plumage, no head plumes but
    long back and chest plumes, and bare yellow facial skin only to the front of the
    eye. Unlike the Little Egret it has a yellow bill tipped black.


    Distinguished from the larger Great Egret by its smooth, uninked neck.


    Where to see: Occurs throughout the region. It can be found in rice fields, mangroves
    and swamps, and on coastal mudflats, but probably often inland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_74_0.png)


    ## Little Egret Egretta garzetta 55–65cm

    Indonesian name: Kuntul Kecil


    Larger and slimmer than the Cattle Egret, it has greyish-black legs and a black
    bill. Normally brilliant all-white plumage, in the breeding season it develops
    long pendulous plumes on the breast, back and nape and a small, dirty-yellow bare
    facial patch. The Asiatic migrant subspecies is distinguished by having yellow
    toes.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_75_0.png)


    Where to: Occurs throughout the region, mainly in mixed eg flocks in coastal lowlands,
    rice fields, and riverine mudflats and sand bars, alongside small streams. It
    mixes freely with other herons and egrets in their breeding colonies and at nightime
    roosts.


    ## Pacific Reef Egret Egretta sacra 58–66cm

    Indonesian name: Kuntul Karang


    The Pacific Reef Egret possesses two colour forms. The commoner form has uniform
    grey plumage, a short, thick neck, very pale chin, dark yellow bill and greenish
    legs. Less common is the white form, which resembles the Cattle Egret but is considerably
    larger and has a sleeker head and neck. It also has relatively short greenish
    legs and a dirty yellow bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_75_1.png)


    Where to: Occurs throughout the region, generally confined to coasts and seen
    resting on rocks and cliffs when not hunting at the water’s edge. More commonly
    found on the sandy beaches and reefs of offshore islands.


    ## Cattle Egret Ardea ibis 45–55cm

    Indonesian name: Kuntul Kerbau


    Aish white heron, sometimes tinged orange on the forehead. In breeding plumage
    it develops an orange wash over the breast, head and neck, as well as yellow-orange
    bill, legs and toes. Lores more rounded body, short neck and short, thick bill
    distinguishing it from other egrets. It nests and roosts colonially.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_76_0.png)


    Where to see: Common throughout the region, found in rice fields and freshwater
    swampy areas. It is also attracted to grazing cattle, feeding on the insects they
    disturb. In Petulu village, Bali, a large nocturnal roost is protected by the
    belief that the birds carry the souls of Balinese killed in the 1966 anti-Communist
    slaughter.


    ## Javan Pond Heron Ardea speciosa 45cm

    Indonesian name: Blekok Sawah


    This heron normally appears dark brown, streaked light brown, with buffish-brown
    tail and underparts, and white wings, in breeding plumage the neck and head become
    golden-buff and the back blackish. It has a black-tipped yellow bill and dull
    green feet.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_76_1.png)


    Where to see: Occurs throughout the region in inland and coastal areas. Common
    on freshwater marshes and rice fields.


    ## Black-crowned Night Heron Nycticorax nycticorax 60cm

    Indonesian name: Kowak-malam Abu


    This stocky-bodied heron has a distinctive adult plumage of black back and crown,
    white neck and underparts, and tail, with two long white plumes emerging from
    the nape. Both the bill and the neck are comparatively short. In breeding plumage,
    the normally dirty yellow legs become red. Females are slightly smaller and juveniles
    are streaked and mottled brown.


    **Where to see:** Occurs throughout the region, often near freshwater wetlands,
    rice fields, swamps and mangroves. Also on mudflats.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_77_0.png)


    ## Striated Heron Butides striata 35–48cm

    Indonesian name: Kokokan


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_77_1.png)


    The commoner form has uniform grey plumage, a short, thick neck, very pale chin,
    dark yellow bill and greenish legs. Less common is the white form, which resembles
    the Cattle Egret but is considerably larger and has a sleeker head and neck. It
    also has relatively short greenish legs and a dirty yellow bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_78_0.png)


    ## Malayan Night Heron Gosachius melanopholus 47–50cm

    Indonesian name: Kokak Melayu


    This solidly built heron has chestnut upperparts, olive-green legs and the short,
    stubby bill is olive-brown. Immatures are dark and mottled brown. Its underparts
    are white.


    Where to see: Occurs throughout the region, preferring dense vegetation, particularly
    in reeds, grasslands grasslands and flooded marshes.


    ## Glossy Ibis Plegadis falcinellus 55–66cm

    Indonesian name: Ibis Rokoko


    The only ibis in the region with all-dark plumage, it has black-chestnut coloration
    with green and purple iridescence. Its legs are dark and the long decurved bill
    is bill.


    Where to see: Occurs on Java and Bali, usually in small groups in rice fields
    and marshland. It often associates with egrets and herons, both at nightime roosts
    and at breeding colonies.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_79_0.png)


    ## Black-headed Ibis Threskornis melanocephalus 65–75cm

    Indonesian name: Ibis Cucukbesi


    The almost all-white body is offset by a black head and neck and a strong, black
    bill. The long legs are also black. The decorative feathers on the tail are pale
    grey, and the few decorative feathers are white.


    **Where to see:** Occurs rarely in Sumatra and north Java, in freshwater marshes
    and by lakes and rivers, flooded grasslands and rice fields. Occasionally associated
    with grazing cattle.


    ## Black-winged Kite Elanus caeruleus 30–37cm

    Indonesian name: Elang Tikus


    Named for its black shoulder patches and the fact that it often hovers like a
    kite before dropping on its prey. When in flight, this elegant raptor might be
    mistaken for a gull. Its grey upperparts and white underparts, along with long
    black primaries and squarish tail, can be confusing. It has red eyes encircled
    by black.


    **Where to see:** Occurs throughout the region, preferring open countryside and
    in dry areas of sparse woodland, at woodland edges, as well as in cultivated areas.
    Occasionally seen perching on exposed tree branches and telephone poles.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_80_1.png)

