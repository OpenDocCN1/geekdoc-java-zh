  - '[PAGE 40]


    # Large Frogmouth Batrachostomus auritus 39–43cm


    Indonesian name: Paruh-kodok Besar


    This is the largest of the Asian frogmouths, varie in coloration with both sexes
    very similar. The upperparts are warm brown to buff-brown with palebarred scapulars
    and dark-bordered buffish spots on the wing-coverts. The outer wing and tail are
    brown with paler bars. The underparts are brown spotted with a paler belly. The
    bill is dark buff becoming brown at the tip. The legs are yellow and the iris
    is brown. Females are less strongly marked and a bit duller. Juveniles are lighter
    coloured.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_40_0.png)


    **Where to see:** Occurs in moist lowland primary rainforests and second growth
    on Sumatra. Its numbers are declining.


    # Javan Frogmouth Batrachostomus javensis 20–23cm


    Indonesian name: Paruh-kodok Jawa


    Upperparts are generally a mixture of brown, buff, grey and white with black spotting;
    underparts are brown with buff, cinnamon and white speckles, bolder on the breast.
    The paler belly and flanks are lightly barred. The scapulars are marked with buffish-white
    patches, but the wings and tail lack white spots. It has a brown bill, brown legs
    and yellow iris. Females have warmer and brighter colour but show less. It is
    generally insectivorous, gleaning food from foliage, on the ground and sometimes
    in flight.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_40_1.png)


    **Where to see:** Typically occurs in dense undergrowth in swampy areas of the
    tropical moist evergreen lowland forest


    of Java. Usually spends night high in treetopsops. Roosts closer to the ground
    during the day.'
  - '[PAGE 41]


    # Large-tailed Nightjar Caprimulgus macrurus 25–29cm


    Indonesian name: Cabak Maling


    This large grey-brown nightjar is concealed by white-camouflaged plumage, its
    tail reaching far beyond its wings. In the flight, the broad white tips to the
    two other pairs of tail feathers and the distinctive white patch covering the
    centres of the four primary wing feathers of the male identification. The upperparts
    are grey-brown streaked dark brown and black, and there is a vague buff nuchal
    collar. A large white throat area and white mustachial streak contrast against
    the brown underparts, which are barred with buff at the neck to brown at the belly.
    The bill and legs are black and iris is brown. The female has buff-spotted wings
    and tail.


    At dusk, it utters a slow and repeated choink-choink-choink call.


    Where to see: Occurs throughout the region''s mangroves, forest edges and scrubland,
    usually spending the daytime in shade on the ground.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_41_0.png)


    # Savanna Nightjar Caprimulgus affinis 20–26cm


    Indonesian name: Cabak Kota


    One of the smallest nightjars in the region, this species has a monotonous repetitive
    call, jweep, heard around dawn and dusk, often from birds in flight. The well-disguised,
    uniform brown plumage has a


    buffish-white nuchal collar and small white patch on either side of the neck.
    The male has white outer feathers and a sizable white spot on its four primary
    wing feathers. Bill is dark grey and feet are reddish-brown. The female has no
    white in the tail and dirty buff spots.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_41_1.png)


    Where to see: Occurs throughout the region. Common in dry open areas around the
    coastal woodlands, but is also found in big cities exploiting flying insects attracted
    by the lights.'
