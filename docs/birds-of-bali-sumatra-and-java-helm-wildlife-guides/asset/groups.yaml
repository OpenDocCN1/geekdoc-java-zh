    ## 斑腹花蜜鸟 Pachyglossa modesta 9–10cm


    印尼语名称：Cabai Gesit


    这种花蜜鸟颜色相对暗淡，看起来像是一只小小的、脏的灰棕色鸟，尾巴不断左右抖动，喙对于花蜜鸟来说异常厚实。背部呈阴暗的橄榄绿色，腹部为浅褐色，并有不明显的棕色条纹。浅黄褐色的下须纹将浅棕色的颊纹与浅棕色的耳羽分开分开。棕色的尾巴和初级羽缘呈较浅的绿褐色。虹膜呈亮红褐色，腿为棕蓝灰色。雌雄相异，幼鸟颜色更平淡，腹部呈黄色。


    观赏地：常见于苏门答腊和爪哇腊低地的林地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_196_0.png)


    ## 橙腹花蜜鸟 Dicaeum trigonostigma 8–9cm


    印尼语名称：Cabai Bunga-api


    雄性的橙色腹部、尾脂、臀部和下背，以及蓝灰色的头部、翅膀和尾巴是其识别特征。雌鸟为浅橄榄灰色，灰色喉部，腹部变为脏橙色。尖且弯曲的喙为黑色，腿为灰色。幼鸟看起来像暗淡的雌鸟，缺乏黄色或橙色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_196_1.png)


    观赏地：遍布地区低地，在森林冠层、花园树木和红树林间穿梭。它们非常活跃，寻找小型昆虫以及小型成熟果实。


    ## 血 Dicaeum sanguinolentum 9–10cm


    印尼语名称：Cabai Gunung


    雄性具有血色的胸部，喉部变为浅褐色。腹部呈粉褐色一直到尾端覆羽。胸部中心到腹部有一条宽条纹。从头顶到背部呈有光泽的钢蓝色。喙和腿为黑色，虹膜为蓝褐色。雌鸟在橄榄棕色的身体上有亮红色的臀部，腹部染有橙褐色。幼鸟与雌鸟相似，但头部有更多灰色，腹部带有黄色调。


    观赏地：主要分布于爪哇和巴厘的山区和丘陵森林，但偶尔出现在苏门答腊南部。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_197_0.png)


    ## 绯首花蜜鸟 Dicaeum trochileum 8–9cm


    印尼语名称：Cabai Jawa


    成年雄鸟从头部到下胸部，以及沿背部一直到尾端覆羽均为绯红色。尾巴和上翅羽为黑色，腹部为极浅的灰色，在侧腹和下胸部变深。足部和喙为黑色，虹膜为褐色。雌鸟背部为浅棕色，臀部为绯红色。头部和肩背部通常呈红褐色。腹部为浅灰白色。幼鸟背部为浅绿褐色，但臀部呈橙色。


    观赏地：这是一种沿海和低地物种，以昆虫、花蜜和果实为食，遍布整个地区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_197_1.png)


    ## 红颊太阳鸟 Chalcoparia singalensis 10–11cm


    印尼语名称：Burung-madu Belukar


    这种小型太阳鸟色彩鲜艳，但在阴影处其光光泽往往并不可见，雄鸟甚至呈现黑色。然而，在明光下，雄鸟具有光泽的绿色背部和冠部非常亮丽，耳羽为深红色。喉部为橙褐色，过渡到黄色腹部。雌鸟颜色较暗，背部为橄榄绿色，腹部为浅黄色。直喙和腿为黑色，腿通常带有绿色调。


    **观赏地：** 这是森林边缘和稀疏林地的鸟，经常与其他物种结群出现。分布于苏门答腊和爪哇。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_0.png)


    ## 棕喉太阳鸟 Anthreptes malacensis 12–13cm


    印尼语名称：Burung-madu Kelapa


    该物种以其鲜艳的色彩和长弯喙识别，通常在花前悬停寻找花蜜。雄鸟具有黄色胸部、腹部和尾脂，棕色喉部常有深紫色边缘。脸和下巴为橄榄色，背部为带光泽的橄榄绿色，融入带有绿光的深蓝色头部。雌鸟上方为橄榄绿色，下方为黄色。在该地区的12种太阳鸟中，只有棕喉太阳鸟和华丽太阳鸟出现在巴厘岛。


    **观赏地：** 遍布整个地区。通常在开放种植园、花园、沿海灌木丛和红树林中可见。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_1)


    ## 哈塞尔太阳鸟 Leptocoma brasiliana 9–10cm


    印尼语名称：Burung-madu Pengantin


    雄性具有黑色的额冠，带有紫绿光泽。从后脑部、过肩背到上翅覆羽，包括下巴到胸部中部，羽毛为深红色。腹部为浅黄色。


    **观赏地：** 分布于苏门答腊和爪哇，主要在低地森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_199)


    ## 铜喉太阳鸟 Leptocoma costheta 12–13cm


    印尼语名称：Burung-madu Bakau


    雄性具有橄榄绿色背部和黑色尾巴。喉部为铜色。较小的紫喉太阳鸟（Leptocoma spata）通过其胸部与其区分。


    **观赏地：** 分布于爪哇和苏门答腊的低地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_0)


    ## 华丽太阳鸟 Cinnrys ornatus 10cm


    印尼语名称：Burung-madu Sriganti


    体型很小，长弯喙，背部为橄榄绿色，尾巴黑色。腹部为亮黄色。巢是由精细草和和丝状材料编织而成的，危险地悬挂在枝末端。


    **观赏地：** 分布于沿海低地和红树林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_1)


    ## 爪哇太阳鸟 Aethopyga mystacalis 9–12cm


    印尼语名称：Burung-madu Jawa


    雄性头部、背部和胸部为红色，前臂和颊纹具有光泽。翅膀为橄榄灰色，尾巴黑色。腹部为亮白色，在尾脂处变为浅黄色。


    观赏地：分布于爪哇的山区森林地区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_201_0)


    ## 绯太阳鸟 Aethopyga siparaja 10–15cm


    印尼语名称：Burung-madu Sepah-raja


    雄性具有黑色的额冠，带有紫绿光泽。从后脑部、过肩背到上翅覆羽，包括下巴到胸部中部，羽毛为绯红色。下胸到尾脂为紫色。紫紫蓝光须纹。臀部为黄色，其余背部为深褐色至黑色。


    观赏地：分布于苏门答腊南部和爪哇较开的森林和森林边缘，偶尔靠近人类居住区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_202_0)


