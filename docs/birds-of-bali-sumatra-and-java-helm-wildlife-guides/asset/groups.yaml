    ## Crimson-winged Woodpecker *Picus puniceus* 25cm

    A sombre dark green woodpecker has pale yellow nape and throat. The wing-coverts
    are intense red and underparts are barred with white. The long, pointed bill is
    black and the feet grey.


    ## Laced Woodpecker *Picus vittatus* 30cm

    This little woodpecker has green uppersparts shows white spotting on the tail
    and secondaries. The crown is black, edged with a white patch above the bill and
    a white stripe behind the eye, and the sides of the face and ear-coverts are black.
    The chin and belly are rufous with white margins. The legs and cere are black
    and the iris brown.


    ## Checker-throated Woodpecker *Chrysophlegma mentale* 26–29cm

