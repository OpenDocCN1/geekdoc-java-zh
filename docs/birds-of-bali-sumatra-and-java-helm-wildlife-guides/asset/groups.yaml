    ## 黑蜂嘴鴥 Baza Aviceda leuphotes 28–35


    印尼语名称：Baza Hitam


    被识别为一种小型、体型粗壮的黑色隼，带有尖锐的长冠，上面有白色和红棕色的斑块。腹部上胸部有黑褐色的横纹，向泄殖处逐渐变为红色。颈部为黑色，虹膜为红褐色，腿部为灰黑色。飞行时，初级羽呈白色，末端带黑色，次级羽为灰褐色。幼鸟非常相似，但颜色更暗、更偏褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_81_0.png)


    观赏地点：作为冬季候客出现在苏门答腊和爪哇。


    ## 爪哇猛雕 Nisaetus bartelsi 55–60


    印尼语名称：Elang Jawa


    这是印度尼西亚的国鸟，通过其明显的白色边缘深色长冠即可轻松识别。它有一条黑色的胡须纹，喉部和腹部为浅褐色，颈部有黑色条纹，腹部有棕色条纹，翅膀为白色羽毛。头部侧面和后脑呈浓郁的锈褐色，与深褐色的背部融合。长尾巴为棕色带黑色横纹。虹膜和腿为黄色，蜡基为深灰色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_81_1.png)


    观赏地点：爪哇特有种。仅发现于西爪哇的原始山丘和山区林木地区，以及东部的梅鲁贝蒂里国家公园（Meru Betiri）。最后的据点是哈利蒙山国家公园（Gunung
    Halimun）。


    鹗、隼和鹰


    ## 冠纹蛇雕 Spilornis cheela 50–70cm


    印尼语名称：Elang-ular Bido


    颜色较深，背部为灰巧克力褐色，腹部亦然，肩部、腹部和侧腹有白色斑点。头部顶部和背部有一簇隆起的白色斑点羽毛，看起来像冠冠。飞行时，宽大的白色尾带和下翅覆羽上的白色带是显著特征。它有黄色的脚和灰褐色的喙。通常通过其响亮、尖锐的叫声
    cwe-chee, cwe-chee, cwe-cheeee 被发现。


    分布地：遍布该地区。经常在林地和森林上空可见。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_82_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_82_1.png)


    ## 贝斯拉隼 Tachypiza virgata 25–35cm


    印尼语名称：Elang-alap Besra


    雄性具有均匀的深灰褐色背部，头部为灰褐色，喉部为白色并有一条黑色中线纹。胸部和腹部为红灰色，上胸中心有密集的黑白色条纹。下腹部有白色横纹，延伸至白色尾覆羽。末端带白色的尾巴显示三条宽黑纹。雌性通常偏褐。苏门答腊种（*A.
    v. vanbemmeli*）更偏红。喙为黑色，蜡基为灰色，虹膜为黄色至橙红色。


    **观赏地点：**遍布该地区，但主要局限于山地和山丘林地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_83_0.png)


    ## 爪哇谷头鹰 Tyto javanica 33–50cm


    印尼语名称：Serak Jawa


    谷头猫鹰遍布世界，许多人对其都很熟悉。它有明显的心形白色脸盘，腹部从白色到棕色不等，带有较深的斑点。头部和背部的颜色也变化很大，从浅褐色到灰色。飞行时通过其通常较浅的颜色、长翅膀、短而方形的尾巴以及不超过尾巴的脚来识别。


    观赏地点：遍布该地区，尽管分布稀疏。它们在印度尼西亚是夜行性，且不在大部分山区或森林茂密的地区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_84_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_84_1.png)


    ## 东方谷头鹰 Phodius badius 23–29cm


    印尼语名称：Serak Bukit


    这种小型猫鹰有较大的黑色眼睛，陷在深浅褐色的脸盘中，脸盘边缘有一圈细细的深棕色羽毛。短的浅黄色耳羽看起来像是脸盘的延伸。背部从栗色到浅褐色，带有细小的浅黄色斑点，腹部为肉粉色，带有细小的黑色斑点。短翅膀有黑色横纹，喙为浅黄色，脚为棕褐色。雌性稍大，幼鸟颜色更浅或更暗。


    观赏地点：出现在苏门答腊和爪哇，主要在低地森林，有时会接近红树林和耕作区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_85_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_85_1)


    ## 领环雕头鹰 Otus lecops 20–24cm


    印尼语名称：Serak Jawa


    这种小型猫鹰有较大的黑色眼睛，陷在深浅褐色的脸盘中，脸盘边缘有一圈细细的深棕色羽毛。短的浅黄色耳羽看起来像是脸盘的延伸。背部从栗色到浅褐色，带有细小的浅黄色斑点，腹部为肉粉色，带有细小的黑色斑点。（此处此处原文似乎重复/错误，已根据上下文逻辑翻译）


    这种它通常通过其响亮、尖锐的叫声 cwe-chee, cwe-chee, cwe-cheeee 被发现。


    分布地：遍布该地区。经常在林地和森林上空可见。


    （注：原文文本中此处存在重复和逻辑混乱，已根据前文格式进行了对齐处理）


    ## 棕色雕头鹰 Glaucidium striatum 40–44cm


    印尼语名称：Pungguk


    这种猫鹰拥有深色的眼睛，虹膜为黄色，蜡基为深灰色。它有白色脸盘和带横纹的腹部，背部为深褐色。喙为深灰色，脚为黄黑色。


    观赏地点：遍布该地区，在原始森林和次生林。


    ## 爪哇雕头鹰 Glaucidium castanopter 23–25cm


    印尼语名称：Pungguk Coklat


    这种小猫鹰有黄色的脚和灰色的喙。头部侧面和后脑呈浓郁的锈褐色，与深褐色的背部融合。长尾巴为棕色带黑色横纹。观赏地点：爪哇特有种。仅发现于西爪哇的原始山丘和山区林木地区，以及东部的梅鲁贝蒂里国家公园。


    ## 棕色雕头鹰 Ninox scutata 27–33cm


    印尼语名称：Pungguk Coklat


    成鸟和幼鸟非常相似，都有白色脸盘和带黑色横纹的腹部。背部为深灰褐色。虹膜为黄色，脚为黄黑色。


    观赏地点：遍布该地区，常见于原始森林和次生林。


    ## 大犀犀鸟 Buceros bicornis 95–105cm


    印尼语名称：Rangkong Papan


    巨大的黄色喙和额冠、黑色脸部、染黄的白色颈部和上胸，以及白色尾巴上的黑色亚带，使其与该地区的其他犀鸟区分开来。背部、下腹和翅覆羽为黑色，白色翼带常有黄色斑纹。它们有明显的“睫毛”，与其他犀鸟相似。雄性比雌性大，拥有红色虹膜和黑色的裸露皮肤眼圈。雌性虹膜为白色，裸露皮肤为粉红色。


