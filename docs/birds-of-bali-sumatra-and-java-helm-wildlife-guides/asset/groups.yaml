    ## 颤翅绿蜂嘴留� *Pteruthius aenobarbus* 12cm

    印尼语名称：Ciu Kunyit


    这种小型蜂嘴留�类鸟的雄性背部呈橄榄绿黄色，包括冠部、耳羽和次级羽的外缘。上翼覆羽为黑色，带有白色白色，形成双倍翅纹。下巴、喉部和前额部为红黑色，额冠下方有一条窄的黄色条带。它有白色的眼环，后方带有黑色线条。腹部为亮橄榄绿色，耳羽也是如此，边缘呈灰色，并与灰色的眉纹相接。腿为粉红色，喙部为蓝灰色。雌性颜色较暗，喉部为黄褐色绿色。


    观赏地点：分布于爪哇岛的低地山林。


    ## 斑纹绿蜂嘴留� *Pteruthius flaviscapis* 14cm

    印尼语名称：Ciu Jawa


    这只圆润的小鸟看起来头部比例大，喙部厚实。雄性头部为黑色，有明显的白色眉纹，灰色的背和后部，以及黑色的翅膀和尾巴，级羽带有栗色和黄色。


    下部为白色。雌性头部为灰色，眉纹不明显，背部为灰绿色。


    观赏地点：分布于爪哇岛，多见于较开阔的山林冠层。


    ## 东南亚鸣鴴 *Pachycephala calliope* 17–19cm

    印尼语名称：Kancilan Tenggara


    雄性拥有鲜艳的黑色、白色和亮黄色羽毛。黄色的颈后斑通过一条窄的黄色条带与胸部、腹部和泄殖孔连接，头部除白色下巴和喉部外均为黑色，喉部和腹部之间留有窄黑带。背部为橄榄绿色，尾巴几乎全黑。雌性背部颜色暗淡，下部为脏褐色，下腹和尾下覆羽呈黄色。


    观赏地点：分布于东爪哇和巴厘岛的丘陵和山林、难以穿过的林地和次生林。


    ## 灰喉黄鹂� *Oriolus xanthonotus* 17–19cm

    印尼语名称：Kepadang Hutan


    雄性的头部、背部、颈部到上胸部均为黑色。背部其余部分为亮黄色。飞羽为黑色，边缘带有淡黄色。尾巴为黑色，尾中羽为黄色。腹部为白色，有密集的黑色条纹。喙呈柔和的橙色，腿为灰色，虹膜为深红色。雌性颜色较暗，背部通常为橄榄绿色，下部为白色带黑色条纹，尾下覆羽为黄色。


    观赏地点：分布于苏门答腊和爪哇岛的低地森林边缘。


    ## 黑额黄鹂 *Oriolus chinensis* 23–28cm

    印尼语名称：Kepadang Kuduk-hitam


    雄性呈鲜艳的黄色，有一条明显的黑纹穿过眼睛并跨颈部。飞羽和尾巴为黑色，边缘带黄色。雌性颜色暗得多。幼鸟在成鸟黑色的部位呈现橄榄绿色，下部为带黑色条纹的白色。它们在觅食昆虫和软果实时附栖在树冠上。


    观赏地点：常见于该地区的低地和丘陵，喜好次生林和开阔森林、公园和花园、红树林和沿海灌丛。


    ## 火冠黄鹂 *Oriolus sanguineus* 21–24cm


    这种中等体型的黄鹂极易辨认，雄性除了栗红色的上腹和初级覆羽上的一小块栗红色斑块外，全身羽毛全黑。它有独特的淡蓝灰色喙和蓝黑色的腿。雌性全黑，胸部带有栗色调，腹部有灰色条纹。它发出的叫声像猫的喵喵声。


    观赏地点：分布于苏门答腊，主要在阔叶常绿林和山地林的树顶活动。


    ## 白胸岩鸸 *Artamus leucorychos* 18cm

    印尼语名称：Kekap Babi


    该地区唯一的留鸟岩鸸，姿态与真正的燕子相似，但可以通过其更粗壮的外观、更宽的三角形翅膀以及近方形的叉尾来区分。它厚实的喙是灰色的，整个背部除白色尾屏外均为深灰色。下部为白色。以飞行中捕的昆虫为食。


    观赏地点：开阔地区的常见鸟类，特别是整个地区的低地和丘陵。


    ## 黑翅树燕鸸 *Hemipus hirundaceus* 14–15cm

    印尼语名称：Jingjing Batu


    雄性背部全黑，从颈后到尾部带有绿色光泽，除一个带有轻微横纹的白色尾屏外。下部、喉部和颈部侧面为白色。喙和腿为黑色，虹膜为棕色。雌性和幼鸟相似，但看起来更灰且斑驳。


    观赏地点：分布于该地区的低地森林边缘。


    ## 栗翅画鸸 *Phaniotis pyrhyptera* 16–17cm

    印尼语名称：Sayap-merah


    较大的鸸类之一，有多种颜色变体。较常见的栗翅型雄性，背部到背部中部为暗蓝色，下部到腹部中部为蓝色。下腹和泄殖孔为黄白色。次级羽、大覆羽和尾巴为栗色，初级羽为深褐色。腿为蓝灰色，喙为黑色，虹膜为红色。蓝色型全为深灰色，下腹和泄殖孔较浅。雌性背部为棕色，向头部变为深灰色。胸部呈褐色。


    观赏地点：分布于苏门答腊，主要在低地森林。


    ## 普通绿鸸 *Aegithina tiphia* 12–15cm

    印尼语名称：Cipoh Kacat


    苏门答腊亚种背部为橄榄绿到亮绿色，尾屏白色，下部为黄色。翅膀为黑色，有明显的白色黄色边缘，形成两条清晰的翅纹。爪哇和巴厘岛的亚种颜色更暗淡，背部为较浅的橄榄绿。有明显的黄色眼环。喙和脚均为蓝灰色。


    观赏地点：分布于整个地区，栖息于开阔低地森林和红树林，经常出现在城镇花园。


    ## 绿嘴鸸 *Aegithina virissima* 12–15cm

    印尼语名称：Cipoh Jantu


    雄性的背部为深橄榄绿色，下部较浅，在泄殖孔处变黄。尾巴和飞羽为黑色，有时带有橄榄黄色边缘。覆羽黑带白色，形成两条明显的翅纹。窄的黑皮肤环绕眼睛，周围环绕着淡黄色的羽毛。虹膜为棕色，腿为蓝灰色。喙上方为黑色，下方为蓝灰色。雌性和幼鸟呈黄色且更亮。


    观赏地点：常见于苏门答腊森林的冠层。


    ## 斑纹长尾留 *Rhipidura javanica* 18–19cm

    印尼语名称：Kipasan Belang


    这种非常活跃的小长尾留展现出典型的垂翅姿态，并经常抖动扇动尾巴。背部为深黑色，下部为白色并带有一条特征性的黑色胸带，有一条细白眉纹。当尾巴扇动时，宽阔的喙尖清晰可见。喙和腿均为黑色，虹膜为深棕色。苏门答腊的鸟类背部更黑，尾巴稍长。


    观赏地点：一种开阔栖息地物种，分布于该地区的灌木丛、开阔林地、次生林、红树林，甚至是花园。


