    Indonesian name: Cabai Jawa


    Adult males are scarlet-red from the head to the lower breast and along the back
    to the undertail-coverts. The tail and upperwings are black, with a very pale
    grey belly becoming darker on the flanks and lower breast. The feet and bill are
    black and the iris brown. Females have light brown uppersparts and a scarlet-red
    rump. The head and mantle often appear reddish-brown. The underparts are pale
    grey-white. Juveniles are light green-brown on the upperparts but show orange
    on the rump.


    Where to see: This is a coastal and lowland species, feeding on insects, nectar
    and fruit and occurring throughout the region.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_197_1.png)'
  - '[PAGE 198]


    # # Ruby-cheeked Sunbird Chalcoparia singalensis 10–11cm


    Indonesian name: Burung-madu Belukar


    Although this small sunbird is brightly coloured, when in the shade its iridescence
    is not often visible, and males even appear blackish. In bright light, however,
    the male’s iridescent green uparts and crown are brilliant, and the ear-coverts
    are a deep red. The throat is orange-brown, grading into a yellow belly. Females
    are duller, with olive-green uparts and pale orange-and-yellow underparts. The
    straight bill and legs are black, the legs often with a greenish tinge.


    **Where to see:** This is a bird of forest edge and sparse woodland, often found
    in the company of other species. Occurs on Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_0.png)


    # # Brown-throated Sunbird Anthreptes malacensis 12–13cm


    Indonesian name: Burung-madu Kelapa


    Identified by its bright coloration and long, curved bill, this species usually
    hovers in front of flowers in search of nectar. The male has a yellow breast,
    belly and vent, and a brown throat often fringed with dark purple. The face and
    chin are olive and the uparts are iridescent olive-green, blending into a dark
    bluish head with a green sheen. The female is olive-green above and yellowish
    below. Of the region’s 12 different sunbirds, only Brown-throated and Ornate occur
    on Bali.


    **Where to see:** Occurs throughout the region. Usually seen in open plantations,
    gardens, coastal scrub and mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_1.png)'
  - '[PAGE 199]


    # Van Hasselt’s Sunbird Leptocoma brasiliana 9–10cm


    Indonesian name: Burung-madu Pengantin


    Males have primarily dark blackish uppersparts, an iridescent emerald-green crown
    and nape and bluish-blue tail. The lower mantle, neck and sides to the face are
    solid black. Some green iridescence is present on the scapular and uppertail-coverts.
    The


    throat and belly are maroon and dull purple. The female is dark olive above and
    paler olive below.


    **Where to see:** Occurs on Sumatra and Java, mainly in lowland forest, feeding
    on insects, nectar, fruit and seeds.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_199_0.png)'
  - '[PAGE 200]


    # Copper-throated Sunbird Leptocoma calcostheta 12–13cm


    Indonesian name: Burung-madu Bakau


    Males are dark, even appearing blackish. Upperparts have green-purple iridescence
    and the breast and malar stripe purple. The throat and upper breast show a dark
    coppery-coloured sheen, while the flanks are yellow and the tail bluish-black.
    Separated from the smaller Purple-throated Sunbird (Leptocoma sperata) by lacking
    the red breast but having yellow flanks. Females have a greyish head, dark olive-green
    to brown upperparts and black tail. Undertail-coverts and throat are pale grey,
    grading into a greenish-yellow breast.


    **Where to see:** Occurs along the coastal lowlands of Java and Sumatra and found
    mostly in coastal scrub, woodland mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_0.png)


    # Ornate Sunbird Cinnrys ornatus 10cm


    Indonesian name: Burung-madu Sriganti


    Quite small, with a long, curved bill, it has olive-green upperparts with darker
    wings and a black tail. The underparts are bright yellow, with white showing below
    the tail. Breeding


    males have a black chin and upper breast with a purple iridescence. A very active
    and noisy little bird, either flitting between flowers or hovering to extract
    nectar. It also feeds on insects and pollen. The nest, a wonderfully woven structure
    of fine grasses and hair-like materials, is suspended precariously from the end
    of a branch or among foliage.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_1.png)


    **Where to see:** Occurs throughout the region, particularly in lowland areas
    of scrub, mangroves and woodland.'
  - '[PAGE 201]


    # Javan Sunbird Aethopyga mystacalis 9–12cm


    Indonesian name: Burung-madu Jawa


    The male is scarlet over the head, back and breast, with forearm and malar stripe
    iridescent purple. The wings are olive-grey with the upperwing-covers dark crimson
    to blackish. The underparts are bright white merging into pale yellow on the vent.
    The rump is also yellow. The long tail is iridescent dark purple. The iris is
    black-brown and bill and legs are brown. The female has olive-green uppersparts
    and a grey head with pale yellowish breast and whitish belly. Juveniles are similar
    grey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_201_0.png)


    Where to see: Occurs in submontane forested regions of Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_201_1.png)'
  - '[PAGE 202]


    # Crimson Sunbird Aethopyga siparaja 10–15cm

    Indonesian name: Burung-madu Sepah-raja


    The male has a blackish forecrown with an iridescent purple-green sheen. From
    the back of the head, over the mantle and to the upperwing-coverts, including
    the chin to mid-breast, the plumage is crimson. The lower breast to vent is blackish-purple.
    There is an iridescent purple-blue moustachial stripe. The rump is yellow and


    remaining upperparts dark brown to black. The smaller females are olive-green
    above and have light olive-buff underparts.


    Where to see: Occurs in more open forest and forest edges of south Sumatra and
    Java, occasionally close to human habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_202_0.png)'
- md: '

    ## White-flanked Sunbird *Aethypygga eximia* 13cm


    Indonesian name: Burung-madu Gunung


    This colourful sunbird is aptly named after the cluster of soft white feathers
    on its flanks. Apart from the rather drab olive and black wings, long blue-green
    tail and olive underparts, the male has a bright yellow carpet and red throat
    and under breast, the last crossed by a bluish-green necklace-like band, and his
    crown is iridescent purple. Except for the white flanks, the shorter-tailed female
    is dull olive, a little paler on the throat and vent.


    Where to see: Endemic to Java, occurring in mountain forests and alpine scrub.
    Particularly fond of flowering trees.


    ## Little Spiderhunter *Arachnothera longiroirostra* 13–16cm


    Indonesian name: Pijantung Kecil


    An inconspicuous little olive-and-yellow bird with a long, curved bill, which
    is black above and grey below. The upperparts are drab olive-green and the underparts
    brilliant yellow. It can be separated from all similar species by its whitish
    throat and black moustachal stripe.


    Where to see: Common in lowland and hill forests throughout the region, and in
    some areas deep into the mountains. It inhabits gardens, plantations and logged
    forests, where it can often be seen moving rapidly across open areas as it searches
    for nectar, in particular from the flowers of banana and ginger.


    ## Long-billed Spiderhunter *Arachnothera robusta* 21–22cm


    Indonesian name: Pijantung Besar


    This long-billed and largish spiderhunter is normally a solitary bird, even to
    the extent of driving away all other spiderhunters that encroach on its territory.
    It has a habit of perching high on exposed branches and uttering its repeated
    and uninteresting call, chew-lewt, chew-lewt. In flight, it gives a simple chit-chit
    call. Its upperparts are olive and its underparts yellow, with the breast and
    throat streaked olive-green. Separated from the Spectacled Spiderhunter (*Arachnothera
    flavigaster*) and the Yellow-eared Spiderhunter (*Arachnothera chrysogens*) by
    lacking yellow ear patches or an eye-ring.


    **Where to see:** Occurs at forest edges on Sumatra and Java.


    ## Eurasian Tree Sparrow *Passer montanus* 14–15cm


    This is perhaps the commonest of all resident species throughout the region. It
    has a chestnut crown, white face, black patch, pale buff throat, sides of face
    and underparts, brown back, wings mottled with black and white, and two pale wing-bars.
    The bill is bluish-black and legs are brown. Males and females appear alike, with
    juveniles looking paler.


    Where to see: Well distributed throughout the region, particularly in the lowlands,
    where it has colonised almost all areas, from cities to forest clearings. Commonly
    seen feeding the ground, and in large flocks raiding seeding crops.


    ## Streaked Weaver *Pleceus manyar* 15cm


    Indonesian name: Manyar Jambul


    Breeding males of this colonial species have a black head with golden-yellow cap,
    dark brown upperparts with russet-brown feather edges giving a streaked appearance,
    and white underparts becoming brownish on the flanks and black streaking on the
    breast. It has a black bill and pink legs. Females and non-breeding males have
    a black-streaked brown head and buff eyebrows and chin. Large nesting colonies
    are established in isolated trees near good feeding areas, the polygamous males
    leaving the females alone to weave their elaborate nests.


    Where to see: Occurs on Bali and Java, more often in large roaming flocks, stopping
    off at seeding grassland and often around rice fields and reedbeds.


    ## Baya Weaver *Pleceus philippinus* 15cm


    The breeding male has a bright yellow crown and nape and blackish-brown cheeks
    and throat, the upperparts streaked and mottled light rufous-brown and the underparts
    a warm buff. Females have the crown streaked and mottled brown, a whitish chin,
    a buff eyebrow, and light brown cheeks and upper breast. It has a black bill,
    brown wings and tail, and in females and non-breeding males the forehead, crown
    and nape to the back become brown with darker streaking. Juveniles are much like
    females but lack heavy streaking or the obvious buff supercilium.


    Where to see: Occurs throughout the region, usually in grassland and overgrown
    vegetation and often close to human habitation.


    ## Asian Golden Weaver *Pleceus hypoxanthus* 15cm


    Indonesian name: Manyar Emas


    The spectacular male in breeding plumage has a black face and throat and golden-yellow
    head and body the way to the rump. The feathering of the upper wings and tail
    is brown with buff-yellow borders, and the mantle is streaked brown. It has pink
    legs, a black bill and blackish iris. Female and non-breeding males are similar,
    with dark brown, buff-streaked upperparts, including the forehead and crown. The
    broad supercilium and cheeks are orangey-buff. Underparts are pale orange-buff
    grading towards white undertail coverts.


    **Where to see:** Occurs in the lowlands of Sumatra and West Java, often close
    to cultivation where it relies mainly on seed.


    ## Red-bellied *Avadat amanda* 9.5–10cm


    Indonesian name: Pipit Bengala


    For most of the year males and females look alike, but as the breeding season
    approaches, sexually dimorphic plumage becomes very apparent. Females have greyish-brown
    uppers to the head, with greyish-buff underparts and blackish wings and tail.
    The rump and bill are red. Breeding males become crimson-red on the back and breast,
    with small white spots on breast sides and also on the rump. The feet are pinkish-grey.
    It feeds mainly on seeding grasses but occasionally insects.


    Where to see: The red-bellied subspecies occurs on Java and Bali and inhabits
    grassland and marshy areas often close to cultivation.


    ## Sunda Zebra Finch *Taeniopis guttata* 10cm


    Indonesian name: Pipit Zebra


    The male has grey uppers from the top of the head to the white rump, where the
    uppermost coverts are barred with black. The ear coverts are orange to dark orange
    and there is a grey eye-ring. From the lores a teardrop-shaped area thinly bordered
    black stands out from the grey area below the chin to the upper breast. There
    is a narrow black-band, below which the underparts become buffish-cream. The tail
    is black, iris dark orange and the bill red-orange. Legs pink. Females have much
    paler ear coverts.


    Where to see: Occurs throughout the Lesser Sundas, from Lombok onwards. Occasionally
    appears in the more open coastal areas of Bali.


    ## Tawny-breasted Parrotfinch *Erythrura hyperythra* 10cm


    Indonesian name: Bondol-hijau Dada-merah


    The upperparts from the top of the head are green becoming orange-brown on the
    uppermost coverts. The forehead is black blue where it meets the green on the
    top of the head. The underparts and face are a warm buff, the legs pinkish-red,
    the bill black and the iris brown. Females are duller and juveniles paler without
    blue on the forehead.


    Where to see: Occurs on Java and occasionally on Bali. It is mainly seen in moist
    montane forests and bamboo thickets, although it occurs in open grassland and
    rice fields.


    ## Pin-tailed Parrotfinch *Erythrura prasina* 12–15cm


    Indonesian name: Bondol-hijau Binglis


    This species has green upperparts, the long pointed tail red, and the lower belly
    and vent brownish-buff. The male has a red patch in the centre of the belly and
    blue throat, cheeks and forehead. It has a black bill becoming grey at the base,
    pink legs, dark brown iris and a dark grey eye-ring. A rare colour variation has
    the eye areas of plumage replaced by yellow. The female has a shorter tail, buff
    underparts, a greenish head, and a dull red tail, rump and undertail coverts.
    Juveniles appear paler than the female.


    Where to see: Occurs on Sumatra and Java. Inhabits both montane and lowland moist
    forest, but also found in scrubland, bamboo thickets and rice plantations, often
    mixing with large flocks of munias.

