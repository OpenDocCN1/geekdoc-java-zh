    印尼语名称：Sikatan Belang


    观赏地点：遍布整个地区的亚山地到山地森林。


    该物种具有性别二异，雄性为黑白间，雌性为棕白间。雄性上部全黑，除了白色翼斑、眉纹以及外尾羽基部的白色边缘外。下部全白，腿和喙为黑色。虹膜深棕色。雌性上部为褐色，下部为白色，尾巴为红棕色。幼鸟头部和上部有密集的黄褐色斑点，胸部有深色条纹。其叫声为安静的
