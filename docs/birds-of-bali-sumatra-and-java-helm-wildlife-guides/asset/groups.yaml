    \ javanicus* 42–44cm\nIndonesian name: Kadalan Kembang\n\nSeparated from other\
    \ malkohas of the region by its large size and strong red bill. The upperparts\
    \ are mid-grey tinged with a pale bluish-green iridescent chestnut with a dark\
    \ grey band across the upper breast, and the grey tail feathers are tipped white.\
    \ The eye is surrounded by a patch of bare blue skin and the legs are grey. Juveniles\
    \ have a black tip to a paler red bill. Can be located by its whining call.\n\n\
    Where to see: Occurs in the woodlands and lower hills of Java and Sumatra in secondary\
    \ scrub and at evergreen forest edges; usually in pairs or small groups, foraging\
    \ in Alang-alang grassland.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_35_0.png)\n\
    \n## Horsfield's Bronze Cuckoo *Chrysococcyx basalis* 17cm\nIndonesian name: Kedasi\
    \ Australia\n\nA small cuckoo recognised by its green and bronze iridescent shading\
    \ on its otherwise partially brown-barred upperparts and its white eyebrow with\
    \ a brown eye-stripe. The pale buff underparts are lightly streaked brown at the\
    \ neck, becoming stronger on the flanks and undertail-covers but whitish at the\
    \ centre of the belly. The feet and eye-ring are grey, the thinish bill is black\
    \ and the iris red-brown. Juveniles are generally duller with much less barring\
    \ and a paler grey-brown iris.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_0.png)\n\
    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_1.png)\n\nWhere to see: Occurs as\
    \ a migrant in March and April on Bali and Java and occasionally in south Sumatra,\
    \ usually in coastal, drier open woodlands.\n\n## Banded Bay Cuckoo *Cacomantis\
    \ sonnerati* 22–23cm\nIndonesian name: Wiwik Lurik\n\nAdults occurring on Java\
    \ and Bali have bright rufous-brown, barred darker upperparts and buffish-white,\
    \ finely barred brown underparts. They have a broad buff-white supercilium above\
    \ a brownish eye-stripe with a whitish line below. The iris is grey-brown. The\
    \ bill is black and feet are grey. Juveniles differ in having white-tipped feathers\
    \ on the crown and mantle. Birds on Sumatra are darker and appear more iridescent\
    \ bronze on the upperparts. They show more yellow on the legs and the iris is\
    \ much paler.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_2.png)\n\nWhere to\
    \ see: Occurs throughout the region. Found at lowland forest edges. Uncommon.\n\
    \n## Plaintive Cuckoo *Cacomantis merulinus* 18–23cm\nIndonesian name: Wiwik Kelabu\n\
    \nAdults are pale grey over the head, neck and upper breast contrasting with the\
    \ dark grey wings and upperparts. The grey on the breast blends into a lighter\
    \ grey and then rufous-buff, becoming buff at the vent. The tail feathers are\
    \ grey, tipped white. The red-brown iris is encircled by a narrow whitish eye-ring.\
    \ The bill is black and the legs are yellow-brown.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_37_0.png)\n\
    \nWhere to see: Occurs throughout the region's lowlands, especially in sparse\
    \ woodland and sometimes in towns and villages.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_37_1.png)\n\
    \n## Sunda Brush Cuckoo *Cacomantis sepulcralis* 21–28cm\nIndonesian name: Wiwik\
    \ Ucuing\n\nAdults are grey above with a grey head. The wings are grey-brown,\
    \ slightly glossed green. The tail feathers are black with white tips and what\
    \ appear as white horizontal V-shaped patches along their outer edges. The chin\
    \ is grey above a plain upper breast becoming paler towards the vent. The iris\
    \ is brown and the eye-ring bright yellow, the feet are yellow-buff and the bill\
    \ is black, occasionally yellow below. Females show slight grey barring on the\
    \ lower breast. Juveniles are duller with brown-barred plumage.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_38_0.png)\n\
    \n**Where to see:** Occurs throughout the region, usually at forest edges and\
    \ in isolated mangroves.\n\n## Drongo Cuckoo *Surniculus lugubris* 23–25cm\nIndonesian\
