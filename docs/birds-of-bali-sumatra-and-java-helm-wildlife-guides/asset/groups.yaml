    ## 大腹纹斑鋴 Turdinus macrodactylus 19–21cm


    这种大型斑鋴的背部呈深褐色，并有黑色条纹，冠部为浅褐色，在上覆羽和臀部颜色变得更浅、更暖。下部呈白色，喉部有棕色斑点，上腹部有灰褐色斑点，在苏门答腊的个体身上形成模糊的胸带，但在爪哇的个体身上则没有。爪哇的个体通常颜色更深。眼睛周围有一圈淡蓝色的皮肤。耳羽为深褐色。喙呈黑色，腿为深褐色。


    **观赏地点：** 常见于苏门答腊和爪哇的低地原生森林和茂密林中。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_167_0.png)


    ## 巽达棕腹眉鹺 Alcippe brunneicauda 14.5–15cm


    印尼语：Wergan Coklat


    这种色彩较为平淡的森林栖息类鹺头部有棕色冠部。背部、翅膀和尾巴为棕色，翅膀、臀部和上覆羽看起来呈红褐色；下部为肉白色。喙为灰褐色，腿和虹膜也是如此。雌雄外观相似，但幼鸟看起来颜色更浅，喙呈黄棕色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_167_1.png)


    **观赏地点：** 常见于苏门答腊的低地森林，它们更偏于树冠。


    ## 爪哇棕腹眉鹺 Alcippe pyrrhoptera 14–15cm


    印尼语：Wergan Jawa


    这种鸟从冠部到背部和翅覆羽均呈暗栗栗色，在臀部和尾部变为更暖的栗色。冠部有模糊的深色侧向条纹延伸至脑后，边缘处有模糊的黑褐色眉纹。耳羽为浅栗色，并有纤细的白色条纹。喉部和下部为肉黄色，侧腹颜色较棕。喙呈黑色，腿为浅黄棕色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_168_0.png)


    **观赏地点：** 常见于西爪哇和中爪哇的低山森林。


    ## 巽达画眉鴇 Garrulax palliatus 25cm


    印尼语：Poksai Mantel


    **观赏地点：** 常见于苏门答腊的低山森林。现较为稀有。


    这种画眉鴇头部到背部、肩部以及下腹部均为暗灰色；腹部到泄门变为灰灰色。带羽的眉间、下巴和脸部为黑色。背部（包括翅膀）为红黑色；尾巴也是如此。虹膜为暖灰褐色，周围环着一大块银蓝色的裸皮。腿为深褐色，喙为灰黑色。幼鸟颜色更暗、更偏棕。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_168_1.png)


    ## 眼眼镜画眉鴇 Garrulax mitratus 22–24cm


    印尼语：Poksai Genting


    这种深灰色的画眉鴇具有栗色的冠部和眉纹，宽宽的白色眼圈，以及亮亮的橙黄色喙和腿。它还有栗色的泄门和外级飞羽上的白色斑块。眉间、脸部和下巴的刚状羽给人以戴着黑色面具的感觉。额冠部的几根羽呈白色，灰色的尾巴末端黑色，虹膜为红褐色。幼鸟颜色更暗、更偏棕。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_169_0.png)


    观赏地点：分布于苏门答腊的低山森林物种。


    ## 长尾山鹎 Heterophasia picaoides 28–35cm


    印尼语：Sibia Ekor-panjang


    一种长尾灰色山鹎，尾羽尖端有白色，翅上有明显的白色斑斑。头部为灰色，背部呈灰褐色。下部为浅灰色，腹部带棕色。略微下弯的喙是黑色的，虹膜为红褐色，腿为灰色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_169_1.png)


    观赏地点：栖息在苏门答腊的阔叶常绿林边缘和低山森林，取食各种昆虫、果实、种子，甚至花蕾。


    ## 银耳嘴鹎 Leiothrix argentauris 15–17cm


    印尼语：Mesia Telinga-perak


    雄性特征明显，明亮的银色耳羽与黑色的冠部和脸部形成对比，亮黄色喙的基部有一小簇黄橙色的羽毛。下巴、颈部和前领为深橙色，过渡到橄榄色的背部和较浅的橙色胸部。尾巴为黑色，边缘有黄色，腿和虹膜为黄色。雌性颜色较不亮。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_170_0.png)


    观赏地点：分布于苏门答腊但由于捕猎变得稀有。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_170_1)


    ## 绒额山駴 Sitta frontalis 12–13cm


    印尼语：Mungk Beledu


    这种绒额山駴具有独特的标记，亮银色的耳羽与黑色的冠部和脸部形成对比，额部为红毛黑色。下巴、颈部和前领为深橙色，融入橄榄色的背部和较浅的橙色胸部。尾巴为黑色带黄边，腿和虹膜为黄色。雌性颜色较不亮。这种鸟非常活泼且迷人，与其他山駴不同，它们沿着树干爬行，取食昆虫和蜘蛛。通常成对出现，偶尔也成小群活动。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_171_0.png)


    **观赏地点：** 常见于苏门答腊的森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_171_1)


    ## 蓝腹山駴 Sitta azurea 13cm


    印尼语：Mungk Loreng


    在阴影森林中看起来很暗，但实际上它的背部和翅膀有光泽。只有冠部、脑后和脸侧为黑色。它有黄色的喙和灰色腿，通常在枝间觅食。


    **观赏地点：** 常见于苏门答腊和爪哇的低山森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_172_0)


    ## 亚洲光绿八嘴雀 Aphonis panayensis 20cm


    印尼语：Perling


    成鸟全身黑色，通过黄色的虹膜与短尾八嘴雀（Aphonis minor）区分开来。它有深红色的眼睛和黑色条纹腹部。


    观赏地点：在次生植被附近的开放区域是常见鸟，也被农田和花园所吸引。


    ## 红尾大嘴雀 Scissirostrum dubium 20cm


    印尼语：Jalak Tunggir-merah


    这种小型八嘴雀以其主要是深灰色的身体、结实的“大嘴型”橙黄色喙以及鲜红色的长尾覆羽（有些带有光泽）而易于识别。腿也是黄色的，虹膜为黑褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_173_0.png)


    观赏地点：** 分布于爪哇。偏好低地森林边缘的树冠，在那里它们经常成群结队，取食果实、种子和昆虫。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_173_1.png)


    ## 普通山八嘴 Gracula religiosa 27–35cm


    印尼语：Tiong Emas


    全身黑色，带有紫色光泽，眼睛后和下方有橙色肉瘤，并有黄脚和粗壮的橙色喙。作为另一种受栖息地流失和宠物贸易捕猎压力极大的物种，这种鸟因其模仿其他鸟的能力以及自身丰富的哨声和鸣叫声而备受青睐。


    观赏地点：虽然它们偶尔会成小群聚集，但在高树上成对出现的概率更大。曾是低地森林边缘的常见鸟，在巴厘和爪哇已变得稀有，但在苏门答腊仍保持相当数量。


