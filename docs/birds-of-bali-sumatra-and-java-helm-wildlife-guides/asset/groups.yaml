    This almost tail-less warbler creeps around seemingly ungainly light brown legs.
    The uppers from the nape to the tail are olive-green and underparts light grey,
    tinged olive on the flanks and rump. The crown and nape is black, as is the eye-stripe,
    which broadens at the nape. The long and broad supercilium and ear-coverts are
    grey-white. The bill is black above and yellow below.


    Where to see: Occurs in West and Central Java in brushland and dense undergrowth
    at the edges and clearings of montane forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_157_0.png)


