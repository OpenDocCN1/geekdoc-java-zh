    ## 白嘴大犀 Anthracoceros albirostris 55–60cm


    印尼语名称：Kangkareng Perut-putih


    该物种以主要是黑色的羽毛、白色胸部下部、腹部和侧部为特征，眼睛后方和下颌基部也有白色斑块。巨大的角质状喙上方覆盖着一个香蕉形状的额部，额部前端有黑色斑纹。雌鸟喙上的黑色较多。尾巴呈现出不同程度的黑色和白色，特别是在外层羽上。通常以小群形式活动。发出响亮、刺耳且咯咯的的笑声，以及像鸡一样的咯咯声：puk-puk-puk-uk。


    **观赏地点：** 出现在偏远的低地和次生森林的空地和边缘，一直到海岸。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_90_0.png)


