    ## Storm''s Stork *Ciconia stormi* 75–90cm


    A very rare stork, similar in appearance to Woolly-necked Stork. It has predominantly
    black upperparts, a black breast, white neck with black patterning at the side,
    and a black crown. The tail and belly are white. During the breeding season, the
    bright pink facial patch and the yellow eye-ring are very obvious. The slightly
    upturned bill is reddish and the legs are pink.


    Where to see: Found only at freshwater pools in lowland forest in east Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_64_0.png)


    ## Lesser Adjutant *Leptoptilos javanicus* 120–130cm


    Indonesian name: Bangau Tongtong


    This strange-looking creature is not a pretty bird. Its massive horn-coloured
    bill on a virtually bald head and patches of orange skin on the head, neck and
    upper breast give the appearance of being deformed and sick. The back, wings and
    tail are dark grey and the underparts and upper back are white. The bill and legs
    are greyish. Juveniles have brownish-grey upperparts and dirty white underparts.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_65_0.png)


    Where to see: Occurs throughout the region''s coastal wetlands, mangroves, flooded
    grasslands and rice fields. Rare because of hunting and habitat loss in- Java
    and Bali. It remains locally common in lowland areas of south Sumatra.


    ## Milky Stork *Mycteria cinerea* 95–100cm


    Indonesian name: Bangau Bluwok


    This large stork usually occurs in single-species groups but occasionally in the
    company of other storks and herons. It is primarily white but has black flight
    feathers and tail. It has a prominent bare patch of facial skin which varies in
    colour from pink to red, a long, decurved, olive-yellow bill and greyish legs.
    Juveniles are a dirty pale brown, with the rump white and the flight feathers
    black.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_65_1.png)


    Where to see: A relatively rare species found throughout the region. It occurs
    in mangroves and mudflats of west Sumatra, the north-west coast of Java near Jakarta,
    and Brantas Delta, Surabaya.


    ## Christmas Frigatebird *Fregata andrewsi*


    Length 90–100cm, wingspan 210–230cm

    Indonesian name: Cikalang Christmas


    This Critically Endangered seabird has very dark, brownish-black plumage, with
    long wings and a deeply forked tail. The male has a white patch extending between
    the belly and the vent, in the female the patch is more extensive, extending forward
    to encompass the whole belly and onto the underwings. Males have a prominent bright
    red inflatable gular sac used in display, and grey bill and legs. Females are
    slightly bigger and have pink legs, bill and gular pouch. Immatures have variable
    head colour, from dirty yellow head to white.


    **Where to see:** This vagrant occurs around coasts of the region and originates
    from Christmas Island.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_1.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_2.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_3.png)


    ## Oriental Darter *Anhinga melanogaster* 87–95cm


    Indonesian name: Pecuk-ular Asia


    Very similar to cormorants apart from the long, snaking neck, small head and yellow-brown,
    dagger-like bill. It is mainly black, with white-streaked feathers on the wing
    and back. It swims very low in the water with only its head and neck showing,
    so it often becomes waterlogged and has great difficulty in taking to the air.
    It spends a lot of time alone on low, exposed perches, often with its wings outstretched
    to dry, but it roosts communally.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_67_0.png)


    **Where to see:** Occurs throughout the region, preferring large, clean freshwater
    lakes and slow, forested rivers.


    ## Little Cormorant *Microcarbo niger* 51–56cm


    Indonesian name: Pecuk-padi Kecil


    The smallest of the cormorants in the region. The plumage is generally greenish-black,
    with a few tiny white feathers on the neck and head. The bill is yellowish-brown,
    with a black tip and purple near the base in adults. After breeding, the plumage
    darkens and loses the white flecks, except for the chin and throat, which become
    white. Immatures are dull brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_67_1.png)


    **Where to see:** Occurs throughout the region, frequenting mangroves, marshland,
    lakes and estuaries, often in small flocks swimming low in the water and diving
    for fish. Once a resident of the coasts, mangroves and lowland waterways of Java,
    but becoming rarer.


    ## Little Pied Cormorant *Microcarbo melanoleucos* 58–65cm


    Indonesian name: Pecuk-padi Belang


    This little cormorant has a long tail and short, thick bill. In the region it
    loses its black-and-white pied breeding plumage for more blackish-brown and white.
    The underparts, neck, throat and sides to the face are all white and the upperparts
    blackish-brown. The legs are black, iris dark grey, and bill orangey-yellow, tinged
    green.


    Where to see: Non-breeding birds occur on Java and Bali, practising freshwater
    habitat, rivers, lakes and swamps. Also appears at coastal estuaries and mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_68.png)


    ## Little Black Cormorant *Phalacrocorax sulci* 55–65cm


    Indonesian name: Pecuk-padi Hitam


    A bird with uniform black plumage, except for white feathers on the neck. It has
    a greyish bill and legs grey-blue.


    Where to see: Occurs throughout the region, frequenting mangroves, marshland,
    lakes and estuaries. It is a resident of Java and Bali, and often seen at Pulau
    Rambut on the north-west Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_69_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_69_1.png)


    ## Australian Pelican *Pelecanus philipposphillos* 152–185cm


    Indonesian name: Undan Kacamata


    Similar in size to the Great Pelican (Pelecanus onrotalus) and identifiable by
    its black tail and bare gular pouch. It flies with laboured wingbeats and catches
    fish by plunging into the water.


    Where to see: It breeds in Australia, migrating north and west as far as Bali.
    Occasionally found singly but more often in small flocks on estuarine sand bars
    and mudflats.


    ## Cinnamon Bittern *Ixoburus cinnamameus* 40–41cm


    Indonesian name: Bambangan Merah


    Adult males have bright cinnamon-brown upperparts and orange-buff underparts streaked
    black on the centre of the belly and along the upper flanks. The sides of the
    long neck are streaked white. Females and immatures appear darker, with a black
    cap, and immatures have a mottled appearance. One of the smaller, more timid bitterns
    of the region. When disturbed, it rises from cover with a croaking alarm call
    and flies off with slow, powerful wingbeats.


    Where to see: Occurs throughout the region, living in grassland, freshwater swamps
    and rice fields. Common.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_70_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_70_1.png)


    ## Grey Heron *Ardea cinerea* 85–100cm


    A predominantly grey bird with paler underparts, it has a prominent black streak
    on the head extending into a small nuchal crest, black flight feathers and a line
    of black streaks on the front of its white neck. Legs and bill are yellowish.
    It appears smaller than the Purple Heron and lacks the reddish-brown colour of
    that species.


    Where to see: Found mostly in the region''s lowlands, frequenting wet areas such
    as rice fields, lakes, mangroves and swamps, hunting fish, frogs and crabs. It
    is a colonial nester, often seen in tall trees in the proximity of mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_71_0.png)

    '
  mdcn: '


    ## 圣诞岛鹳 *Ciconia stormi* 75–90cm


    一种非常稀有的白鹭，外观与白颈鹳相似。它上部主要为黑色，胸部为黑色，颈部为白色并带有黑色侧纹，头顶为黑色。尾部和腹部为白色。繁殖季节，亮粉色的脸部斑和黄色眼环非常明显。喙略微上翘，呈红色，腿呈粉色。


    观赏地点：仅出现在苏门答腊东低地森林的淡水池塘中。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_64_0.png)


    ## 爪洲 *Leptoptilos javanicus* 120–130cm


    印尼语名称：Bangau Tongtong


    这种长相奇异的生物并不是一种美丽的鸟。它近乎光秃的头部上有一个巨大的角色的喙，头部、颈部和上胸部有橙色斑块，看起来像畸形或病态。背部、翅膀和尾部为深灰色，腹部和上背部为白色。喙和腿为灰色。幼鸟上部为棕灰色，腹部为脏白色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_65_0.png)


    观赏地点：遍布于该地区的沿海湿地、红树林、淹没草地和稻田。由于爪哇和巴厘的狩猎和栖息地流失而较为稀有。在苏门答腊南低地地区当地常见。


    ## 白鹳 *Mycteria cinerea* 95–100cm


    印尼语名称：Bangau Bluwok


    这种大鹳通常以单物种群出现，但偶尔和其他鹳和鹭类在一起。它主要是白色的，但有黑色的飞羽和尾羽。它脸部有一个明显的裸露斑块，颜色从粉色到红色不等，喙长且弯曲，呈橄榄黄色，腿呈灰色。幼鸟为脏脏的浅褐色，臀部为白色，飞羽为黑色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_65_1.png)


    观赏地点：一种遍布该地区的稀有物种。出现在苏门答腊西部的红树林和泥滩、爪哇雅加达附近的西北海岸，以及泗水的布兰塔三角洲。


    ## 圣诞岛鉥 *Fregata andrewsi*


    长度 90–100cm，翼展 210–230cm

    印尼语名称：Cikalang Christmas


    这种极临濒危的海鸟拥有深色的棕黑色羽毛，长翅膀和深叉的尾巴。雄性在腹部和泄殖腔之间有一个白色斑块，雌性的斑块更广，向前延伸覆盖整个腹部并到达翅下。雄性有明显的亮红色充气喉囊，用于展示，喙和腿为灰色。雌性稍大，腿、喙和喉囊为粉色。未成年鸟的头部颜色多变，从脏黄色到白色不等。


    **观赏地点：** 这种客鸟出现在该地区的沿岸，源自圣诞岛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_1.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_2.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_66_3.png)


    ## 东方蛇鹭 *Anhinga melanogaster* 87–95cm


    印尼语名称：Pecuk-ular Asia


    除了长长的蛇颈、较小的头部和黄褐色的匕状喙外，与鸬类非常相似。它主要是黑色的，翅膀和背部有白色条纹羽毛。它极低地在水中游泳，只露出头部和颈部，因此经常被浸湿，起飞困难。它花大量时间独自停在低矮、暴露的栖息点上，通常张开翅膀晒，但会群聚栖息。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_67_0.png)


    **观赏地点：** 遍布该地区，偏好大型、洁净的淡水湖和流缓慢的森林河流。


    ## 小�� *Microcarbo niger* 51–56cm


    印尼语名称：Pecuk-padi Kecil


    该地区最小的鸬类。羽毛通常呈绿黑色，颈部和头部有几根细小的白色羽毛。成鸟喙呈黄褐色，尖端为黑色，基部附近呈紫色。繁殖后，羽毛变暗并失去白色斑点，但巴和和喉除外会变为白色。未成年鸟为暗褐色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_67_1.png)


    **观赏地点：** 遍布该地区，出没于红树林、沼泽、湖泊和河口，通常成小群低地在水中游泳并潜水捕鱼。曾是爪哇海岸、红树林和低地水域的居民，但正变得稀有。


    ## 白足��� *Microcarbo melanoleucos* 58–65cm


    印尼语名称：Pecuk-padi Belang


    这种小鸬类有长尾巴和短而实的喙。在该地区，它失去了黑白相间的斑纹繁殖羽毛，变为更多的棕褐色和白色。腹部、颈部、喉部和脸部侧面均为白色，上部为棕褐色。腿为黑色，虹膜为深灰色，喙为橙黄色并泛着绿色。


    观赏地点：非繁殖期鸟类出现在爪哇和巴厘，栖淡水栖息地、河流、湖泊和沼泽中。也出现在沿海河口和红树林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_68.png)


    ## 小黑��� *Phalaccorax sulci* 55–65cm


    印尼语名称：Pecuk-padi Hitam


    一种全身均匀黑色的鸟，颈部除外有白色羽毛。它有灰色的喙和腿。


    观赏地点：遍布该地区，出没于红树林、沼泽和湖口。它是爪哇和巴厘的常客，经常出现在爪哇西北部的 Pulau Rambut。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_69_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_69_1.png)


    ## 澳洲鹈 *Pelecanus philippillos* 152–185cm


    印尼语名称：Undan Kacamata


    与大鹈（Pelecanus onrotalus）体相当，通过黑色尾巴和裸露的喉囊识别。它以费力的扇翅飞行，通过俯冲入水捕鱼。


    观赏地点：在澳大利亚繁殖，向北迁徙至巴厘岛。偶尔单独出现，但更多是小群出现在河口沙洲和泥滩。


    ## 肉桂苍鹭 *Ixoburus cinnamameus* 40–41cm


    印尼语名称：Bangan Merah


    成年雄性具有亮肉桂色的上部和橙褐色的腹部，腹部中心留有黑色条纹。长颈侧面有白色条纹。雌性和未成年鸟颜色较深，带有黑冠，未成年鸟呈斑纹。该地区较小且较胆小的苍鹭之一。受到骚扰时，它们伴随着鸣声从掩蔽处飞起，有力地飞离。


    观赏地点：遍布该地区，生活在草地、淡水沼泽和稻田。较为常见。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_70_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_70_1.png)


    ## 灰鹭 *Ardea cinerea* 85–100cm


    一种以灰色为主的鸟，腹部颜色较浅，头部有一条明显的黑纹延伸成小脑后冠，有黑色的飞羽，白色颈部前方有一条黑色条纹。腿和喙呈黄色。它看起来比紫鹭小，且缺乏该物种的红褐色。


    观赏地点：主要出现在该地区的低地，出没于稻田、湖泊、红树林和沼泽等湿地，捕食鱼、青蛙和螃蟹。它是群居筑巢鸟，经常出现在红树林附近的高树上。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_71_0.png)


