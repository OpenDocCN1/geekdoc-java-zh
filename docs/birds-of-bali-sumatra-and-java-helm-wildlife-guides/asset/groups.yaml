    ## Common Sandpiper *Actitis hypoleucus* 19–21cm

    Indonesian name: Trinil Pantai


    This sandpiper has brown upperparts and white underparts, with a brown patch extending
    from the neck to the flanks. In flight, its white and brown barred outer tail
    feathers are evident, as is the white wing bar. This is a very busy feeder with
    a constant tail-bobbing action. When disturbed it often flies a short distance
    and continues feeding, seemingly unperturbed.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_57_0.png)


    Where to see: A common migrant throughout the region. Usually alone, feeding on
    coastal mudflats and along muddy riverbanks, and occasionally visiting marshland
    and rice fields upstream.


    ## Grey-tailed Tattler *Tringa brevipes* 23–27cm

    Indonesian name: Trinil Ekor-kelabu


    It has uniform fawn-grey upperparts and is slightly lighter grey on the crown,
    neck and breast. The belly, neck and undertailcoverts are white. The chin and
    neck are white to grey. The short legs are yellow and the bill black with a yellowish
    base. Females are slightly bigger than males with juveniles appearing spotted
    white on the upperparts.


    Where to see: Typical of most migrant waders, it regularly appears on intertidal
    mudflats and shingly shorelines but also on rocks where beds of seagrass are present.
    A common migrant more prevalent in the east of the region.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_57_1.png)


    ## Common Redshank *Tringa totanus* 27–29cm

    Indonesian name: Trinil Kaki-merah


    This long, red-legged wader has grey-brown flecked black upperparts from crown
    to rump. The throat, breast and belly are paler with more visible black flecking.
    The tail is barred grey-black and white, the bill is red at the base and tipped
    black, and the black iris is encircled by a white eye-ring.


    Where to see: A common migrant to the region, occurring widely on estuaries, saltmarshes
    and inland freshwater wetlands.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_58_0.png)


    ## Barred Buttonquail *Turnix suscitator* 16–17cm

    Indonesian name: Gemak Loreng


    The male, easily confused with the female Blue-breasted Quail (page 21), is mottled
    brown with breast and flanks barred with black. The main distinguishing features
    are the bright yellow legs and bill of the quail. Females are larger, having darker
    (almost black) chin, throat and crown but with more white on the head. During
    the breeding season, females can be heard making a brief repeated purring call
    at night.


    Where to see: Occurs commonly throughout the region, preferring lowland open grass
    and scrubby habitat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_58_1.png)


    ## Oriental Pratincole *Glareola maldivivarum* 23–25cm

    Recognised by its mainly fawn-brown plumage with a white rump and dull yellow
    edged with a vague black necklace. The upperparts are a little darker brown with
    pale streaks over the crown, the breast is dark fawn blending to white at the
    vent and the flight feathers and forked tail are black. The legs are grey-black,
    the large iris is black and bill is black at the tip and dull red at the base.


    Where to see: A common winter migrant, occurring throughout the region. Usually
    seen in areas near water: tidal mudflats, estuaries, rice fields and pastureland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_59_0.png)


    ## Black-headed Gull *Larus ridibundus* 37–43cm

    Indonesian name: Camar Kepala-hitam


    The underparts and neck are white and upperparts are grey, including the back,
    upperwing-coverts, secondaries and inner primaries. The outer primaries are white
    tipped black, the secondaries are grey tipped white and the tail is white. Apart
    from the white nape, the head is brownish-brown contrasting with a broken white
    eye-ring. The bill is dark red and the legs pale red. Non-breeding birds are white
    shaded blackish-brown on the nape and ear-coverts.


    Where to see: Occurs as a rare winter visitor, generally close to the coast but
    lowlands inland and on lakes, rice fields and pastures.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_59_1.png)


    ## Sooty Tern *Onychoprion fuscusatus* 36–45cm

    The upperparts and upperwings of adults in breeding plumage are black from the
    crown and nape and over the back with the outer tail being edged white. The forehead
    is white to just above the eye as are the underparts. The wing has dark primaries.
    In flight it shows a deeply forked tail while the white underwing-covers with
    the dark primaries. The iris is brown and the legs and bill are black. The non-breeding
    plumage is paler or brownish and immatures are similar blackish-brown apart for
    the white vent, undertail and paler wing-coverts.


    Where to see: Occurs around the region''s coastline but seldom close to shore.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_60_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_60_1.png)


    ## Bridled Tern *Onychoprion anaethetus* 37cm

    Indonesian name: Dara-laut Batu


    This is a medium-sized tern with a dark grey-brown back, tail and wings, white
    underparts and a long forked tail. The crown, nape and eye-stripe are black, leaving
    a thin white forehead leading into a short white supercilium extending beyond
    the eye. Not to be confused with the Sooty Tern. The leading edge of the wings
    is white, as the outer tail feathers.


    Where to see: Occurs around the region’s coasts, usually feeding on small fish
    or floating invertebrates taken from the sea, more often during the summer months.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_61_0.png)


    ## Lesser Crested Tern *Thalasse bengalensis* 37–43cm

    Indonesian name: Dara-laut Benggala


    This species looks very similar to the Greater Crested Tern (Thalasse bergii),
    but is slightly smaller and has an orange bill. Apart from the black band through
    the eye and around the nape, this small tern appears very white. Juveniles, however,
    have grey-brown upperparts.


    Where to see: Occurs around the region''s coasts, normally breeding on offshore
    islands and seen along sandy shorelines.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_61_1.png)


    ## Black-naped Tern *Sterna sumatrana* 30–33cm

    Apart from the conspicuous black band through the eye and around the nape, this
    tern appears very white. In flight its long forked tail is obvious. Juveniles
    differ from adults in having black mottled greyish upperparts.


    Where to see: This quite common resident occurs throughout the region, breeding
    on rocky islands and far out at sea.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_62_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_62_1.png)


    ## White-tailed Tropicbird *Phaeton leptururus* 40cm

    Adults are usually white, some with a yellowish tinge, and have long tail-streamers.
    They are marked with black on the wing-tips and have a black bar on the upperwing.
    Juveniles have no tail-streamers, and their upperparts barred black.


    Where to see: Although parts of the region, visitors also arrive from other areas.
    Individuals occurring around Sumatra, and recognisable by their golden plumage,
    originate from Christmas Island. Some breed on Nusa Penida, Bali, and along Java''s
    south coast.


    ## Asian Woollyneck *Ciconia episcopus* 76–91cm

    Indonesian name: Bangau Sandang-lawe


    This large, predominantly black, stork has a fluffy feathered neck. The undertail
    and lower belly are also white, as are the forehead and a narrow eyebrow. It has
    a patch of mid-grey facial skin. The feet are a dirty red, while the bill is blackish,
    tinged red, with a red tip. Immatures differ from adults in having the black plumage
    tinged brown.


    Where to see: Occurs as a migrant throughout the region, but uncommon on Java
    and Bali. May be seen feeding in rice fields and pastureland in the company of
    other storks, and roosting with them in tall trees.

