    # Plaintive Cuckoo Cacomantis merulinus 18–23cm


    Indonesian name: Wiwik Kelabu


    Adults are pale grey over the head, neck and upper breast contrasting with the
    dark grey wings and upperparts. The grey on the breast blends into a lighter grey
