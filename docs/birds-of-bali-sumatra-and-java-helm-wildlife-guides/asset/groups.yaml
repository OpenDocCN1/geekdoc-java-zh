    # HOW TO USE THIS BOOK


    Photographs depict the bird in a commonly seen form where possible, either male
    or female, and variations are briefly described in the text. The order and naming
    of the 322 species covered generally follows the International Ornithological
    Congress (IOC) taxonomy adopted by Avibase – The World Bird Database and the Cornell
    Laboratory of Ornithology current terminology. While other checklists exist, the
    process of revision based on more recent scientific knowledge will continue. At
    the time of writing, a concerted effort is taking place with the International
    Ornithologists’ Union (IOU) forming the Working Group on Avian Checklists (WGAC)
    with a view to produce and maintain an open-access global checklist of bird species
    that will unify taxonomies. It must therefore be expected that not only will the
    scientific names provide more reliable. The names used in this book follow the
    latest scientific data available as contained in the second edition of Eaton,
    J.A., van Balen, B., Brickle, N.W. and Rheandt, F.E. Birds of the Indonesian Archipelago:
    Greater Sundas and Wallacea (2021).


    Each species description includes an English name and its scientific name and
    a formal Indonesian name where known. As a size guide, the overall length of the
    species from the tip of the bill to the end of the tail is provided. The remaining
    description follows no particular order but provides most of the clues necessary
    for a fairly reliable identification. Only for a few species has any attempt made
    to describe calls and song, as it is felt that descriptions lacking meaning without
    the experience of hearing the actual sound. Nevertheless, the value of sound must
    not be underestimated. In many cases, it can be the only determining factor in
    successful species identification. Much of the description is necessarily brief
    and written in a semi-technical language adopted by most bird books, but for easy
    understanding many of the technical terms used by ornithologists are explained
    in the glossary on page 218.


    # A note on the photos


    All images show the adult plumage, unless stated otherwise. Please refer to the
    key below for further information:


    - male – female

    - imm. – immature

    - ju. – juvenile

    - var. – variant

    - non br. – non-breeding


    Java, Sumatra and Bali lie along the edge of the South-east Asian tectonic plate,
    where it rides over the Australian-Indian plate, generating intense geological
    activity. A line of volcanoes, some still active, others dormant, forms a spine
    along the island chain. On Sumatra these create the Barisan Mountains, stretching
    the entire length of the island, and falling precipitously into the depths of
    the Ocean in the west; in east it drops more gently, giving rise to large swamp
    areas before reaching the Sunda Sea. On Java, the mountains arise in isolation
    from alluvial plains, and in east Sumatra, slope gently towards the Sunda Sea.


    At one time Bali was connected by a land-bridge to Java, but today it is separated
    by 3km of turbulent waters, renowned for their fierce currents. Not surprisingly,
    the fauna and flora of Bali show similarities to those of eastern Java. Sumatra,
    however, shows clearer affinities with Borneo than Java. The fragmentation of
    the landmasses combined with geological and climatic activity has resulted in
    the formation of many habitats, which in turn support a rich diversity of wildlife.
    This includes many endemic species: those confined to a single region or smaller
    area and found nowhere else.


    Java and Bali are among the most densely human-populated regions on Earth, and
    the destruction of the remaining wildlife habitats is a matter of serious concern.
    Only on remote mountain slopes can one find significant areas of natural forest.
    A few patches of lowland forest survive in national parks and nature reserves.
    Sumatra, with only a tenth of the population density, is marginally better off,
    the growth of agriculture, plantation and forestry is responsible for its increasing
    forest destruction.


    # The avifauna


    We might expect that these landmasses, which were at various times joined to mainland
    Asia, would have similar flora and fauna. As the various were not separated simultaneously,
    however, and because subsequent local climatic conditions have varied, the composition
    of the avifauna differs significantly from one island to another. Perhaps the
    most dramatic changes have been caused more recently, by man and his destruction
    of lowland forests. There are ample records dating back as far as 1657, and it
    is quite clear from the reports of the early 19th-century explorers who founded
    Indonesian ornithology that birds were far more plentiful then.


    # When and where to find birds


    As the region lies close to the equator, the climate is hot and humid. The monsoon
    weather patterns of the region are generalised by wet and dry seasons, which differ
    little in temperature. Even so, the birds show distinct breeding cycles. During
    the wet season, from October to March, large numbers of wintering migrants arrive
    from the north, with a smaller number of Australian species appearing during the
    dry season.


    Many waterbirds arrive at the end of the wet season, nesting in the safety of
    isolated trees in a flooded landscape. This is also the peak of the insect breeding
    season, when abundant food is available for insectivorous species to rear their
    young. Frugivorous species delay breeding a little longer, until the trees and
    bushes are bearing ripe fruit.


    Good breeding areas, with a rich diversity of habitats, abound throughout the
    region. Clearly, it is not possible to list them all in a book of this size, but
    to guide the birdwatcher to some of the more productive areas, the major reserves
    and national parks are described below. These are shown on the accompanying map
    at the front of the book.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_10_0.png)


    Chesnut-bellied Partridge.


    # KEY BIRDWATCHING SITES


    ## BALI


    ### Bali Barat National Park


    Situated at the western tip of Bali, Bali Barat is a mix of dry and moist forests
    with coastal scrub, savanna and mangroves. It is the only place to find native
    wild, endemic Banded Pitta, Many other interesting species reside among them Green
