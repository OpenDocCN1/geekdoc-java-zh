    # Green Peafowl Pavo muticus males: 180–250cm females: 100–110cm

    Indonesian name: Merak Hijau


    This spectacular pheasant is predominantly iridescent green, males having conspicuous
    ocellated tail feathers and a vertical crest on the head. Females are similar
    but duller with shorter legs and tail and paler underparts. Juveniles appear similar
    but have a few white feathers on the face and neck. During the breeding season
    their mewing and loud calls are readily heard, and the male’s striking display
    with tail feathers fanned is unmistakable.


    Where to see: A few local relic populations exist on Java, with Baluran National
    Park being the last stronghold.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_20_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_20_1.png)


    # Blue-breasted Quail Synocicus chinensis 12–15cm


    The male of this species is distinctive, but females are easily confused with
    Small and Barred Buttonquails. The yellow feet are the main distinguishing feature.
    The uppersparts are dark brown with lighter streaks, the female paler than the
    male. Males have a distinct black-and-white bib pattern, with the breast, sides
    of the head and undertail-flanks a grey-blue; the belly and under-coverts are
    bright chestnut. The female''s underparts are brown streaked buff, with darker
    brown across the chest and a whitish throat patch and buff the eye-stripe. The
    newly hatched young are tiny, almost like bumbleblees.


    Where to see: Occurs sparsely throughout the region''s lowland grasslands, savannas
    and marshes, sometimes in cultivated areas.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_21_0.png)


    # Red Junglefowl Gallus gallus males: 65–78cm, females: 41–46cm

    Indonesian name: Ayam-hutan Merah


    Males are recognised by their serrated red comb, face and wattles, their long
    bronze hackles and long, dark green, arched tail feathers. They have a chestnut
    to golden mantle and blackish-green breast and primary coverts. Females are much
    duller; various shades of brown with black streaking on the neck. The bill is
    buff and the legs slate-grey. Separating wild birds from easy, but purely domestic
    or feral ones is not easy, but purely wild birds have tail and wing and colour
    all black in males, brown in females, mottled brown in females, dark grey legs
    and bright orange hackles.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_21_1.png)


    Where to see: Forests and scrublands of north Sumatra, Java and Bali, sometimes
    near human habitation.


    # Green Junglefowl Gallus varius males: 65–75cm, females: 40–46cm

    Indonesian name: Ayam-hutan Hijau


    This large blackish-green fowl is similar to the Red Junglefowl but with unserrated
    purplish-red comb. Males have red wattles and bare facial skin around the eye,
    a glossy green mantle and nape and iridescent green hackles edged yellow, with
    uppertail- and wing-coverts orange and yellow; the rest of the plumage is black.
    Females and young juveniles have a less showy plumage with brown upparts sparsely
    mottled with buff, buffish underparts mottled with black and a white throat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_22_0.png)


    **Where to see:** Endemic to Java and Bali. Occurs close to the coast, also inland
    forest, preferring more open, grassy areas and often associating with grazing
    animals.


    # Sunda Collared Dove Streptelia bitorquata 30–33cm

    Indonesian name: Dederuk Jawa


    Not be confused with the similar Eurasian Collared Dove (Streptelia decaocto).
    Generally appears as a pinkish-fawn bird with a broad black half-collar fringed
    with white. The crown and nape are pale bluish-grey tinted pink and the forehead
    very pale grey. The upperparts and wing-coverts are slightly darker pink. Underparts
    are pale pink fading to white at the vent and undertail-coverts. It has a pinkish-brown
    bill, pink legs and a brownish-orange iris.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_22_1.png)


    **Where to see:** Occurs mainly in the lowlands of Bali and Java, often in open
    areas but also close to human habitation. Frequently seen foraging on the ground.


    # Eastern Spotted Dove Spilopelia chinensis 30cm

    Indonesian name: Tekukur Biasa


    This very familiar dove has a generally pinkish-brown plumage with slightly darker
    flight feathers and dark-mottled back. On each side of the neck it has an obvious
    white-spotted black patch. The outer tail feathers are broadly tipped white, this
    being conspicuous in flight. It has red feathers and a black bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_23_0.png)


    Where to see: Occurs throughout the region, from city gardens to rural cultivation,
    open country and forest edges in lowland areas, often foraging on the ground.


    # Barred Cuckoo Dove Macropygia unchall 37–41cm

    Indonesian name: Uncal Loreng


    Distinguished from other ground doves by its largish size and heavily barred upperparts,
    this dove is rather dull-coloured; the upperparts are brown, heavily barred with
    black. The underparts are paler with a buffish throat and pinker with finer black
    barring diminishing towards the vent. The head and nape are greyish-brown, with
    males having a green iridescence. The tail is blackish-brown, strongly barred
    reddish-brown. It has short, black bill, red feet and yellow or pale brown iris.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_23_1.png)


    Where to see: Submontane forest throughout the region. Uncommon.


    # Parzudaki''s Cuckoo Dove Macropygia emiliana 30–37cm

    Indonesian name: Uncal Buau


    Much smaller than the Barred C Dove, it is separated by its buff breast and the
    dark brown head. The upperparts are uniform chestnut with light purplish iridescence
    on the breast. The underparts are slightly paler chestnut with light barring on
    the wing-coverts. Males have red legs and a brown-tipped black bill. Females are
    duller with less iridescence.


    Where to see: Found in hill forests of Java and Bali, where it prefers forest
    edges and scrub.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_24_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_24_1.png)


    # Little Cuckoo Dove Macropygia ruficeps 29cm

    Indonesian name: Uncal Kan


    Smaller than the other cuckoo, it is separated by its buff breast and the dark
    barred on its outer tail feathers. The underparts are also lightly barred and
    the upper breast is heavily barred, especially on the female. Males have green
    and purple iridescence on the nape. They have red legs and a brown-tipped black
    bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_25_0.png)


    Where to see: Common in hill and montane forests throughout the region. Often
    in large flocks, at edges and feeding in grassland and ripening rice fields.


    # Asian Emerald Dove Chalcophaps indica 23–27cm

    Indonesian name: Delukan Zamrud


    This attractive ground dove has iridescent emerald-green wing-coverts and mantle,
    with a dark grey back crossed by two conspicuous white bars. The flight feathers
    and short tail are black. The underparts, neck and sides of the head are dark
    pink. Males have a white forehead, with the crown and nape tinged grey. Females
    are duller. The bill is bright red, the legs and feet dull pink and eyes dark
    brown. (Note: text seems to have been cut off or merged here)


    Where to see: Occurs throughout the region, preferring the seclusion of thick
    forests, woodland edge and mangroves.


    # Barred Dove Geopolia maugeus 22–26cm

    Indonesian name: Perkutut Loreng


    The Barred Dove is often confused with the Zebra Dove being similar in appearance
    but with a distinctly different song. Also, it has stronger black and white barring
    stretching across the breast and onto the flanks, a white belly and chestnut under-coverts,
    bare yellow skin around the eye and a pale yellow iris.


    Where to see: Occurs from Bali east-wards, inhabiting dry open scrub and grassland,
    cultivated land and woodland edges in lowland areas and even cities.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_26_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_26_1.png)

