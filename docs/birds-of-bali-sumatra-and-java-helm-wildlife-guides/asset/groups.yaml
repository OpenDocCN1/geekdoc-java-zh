    ## Large Wren-Babbler Turdinus macrodactylus 19–21cm


    The upperparts of this large babbler are dark brown streaked black and light brown
    at the crown, becoming lighter and warmer over the upper-coverts and on the rump.
    The underparts are whitish flecked brown on the throat and grey-brown flecked
    on the upper belly, forming a vague breast-band in Sumatran birds but missing
    in Javan. Javan birds are generally darker. A patch of bluish skin surrounds the
    eye. Ear-coverts dark brown. The bill is blackish and legs are dark brown.


    **Where to see:** Occurs in lower primary forests and dense woodlands of Sumatra,
    and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_167_0.png)


    ## Sunda Fulvetta Alcippe brunneicauda 14.5–15cm


    Indonesian name: Wergan Coklat


    This rather plain-coloured forest-dwelling babbler has a brown crown on a grey
    head. Mantle, wings and tail are brown, appearing more rufous on the wings, rump
    and upper-coverts; underparts are buffish-white. The bill is grey-brown, as are
    the legs and iris. Sexes are similar but juveniles appear paler with a yellow-brown
    bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_167_1.png)


    **Where to see:** Occurs in Sumatra’s lowland forests, where it prefers the tree
    canopy.


    ## Javan Fulvetta Alcippe pyrrhoptera 14–15cm


    Indonesian name: Wergan Jawa


    This bird is dull chestnut-coloured from the crown over its back and wing-coverts,
    becoming warmer chestnut on the rump and tail. The crown is faintly striped with
    dark lateral stripes extending to the nape, bordered by a vague blackish-brown
    supercilium. The ear-coverts are light chestnut with fine white streaking. The
    throat and underparts are buff with browner flanks. The bill is blackish and legs
    are pale yellow-brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_168_0.png)


    **Where to see:** Occurs in lower montane forests of West and Central Java.


    ## Sunda Laughingrush Garrulax palliatus 25cm


    Indonesian name: Poksai Mantel


    **Where to see:** Occurs in low montane forest on Sumatra. Now rare.


    The head of this laughingthrush is dull grey to the mantle, across the shoulders
    and to the lower belly; the belly becomes rufous-grey to the vent. The bristled
    lores, chin and face are black. The uppersparts, including the wings, are rufescent-black;
    as is the tail. The iris is warm grey-brown surrounded by a large silver-blue
    patch of bare skin. The legs are dark brown and the bill is grey-black. Juveniles
    are duller and browner.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_168_1.png)


    ## Spectacled Laughingrush Garrulax mitratus 22–24cm


    Indonesian name: Poksai Genting


    This darkish grey laughingrush has a chestnut crown and supercilium, a broad white
    eye-ring and bright orange-yellow bill and legs. It also has a chestnut vent and
    a white patch on the outer primaries. The bristly feathering to the lores, face
    and chin gives the impression of a black mask. A few feathers on the forecrown
    are whitish, the grey tail is tipped black and the iris is red-brown. Juveniles
    are duller and browner.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_169_0.png)


    Where to see: A lower montane forest species occurring on Sumatra.


    ## Long-tailed Sibia Heterophasia picaoides 28–35cm


    Indonesian name: Sibia Ekor-panjang


    A long-tailed grey babbler with white tips to its tail feathers and an obvious
    white wing patch. The head is grey and upperparts are tinted greyish-brown. Underparts
    are pale grey tinted brown on the belly. The vagely downcurved bill is black,
    the iris is red-brown and legs are grey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_169_1.png)


    Where to see: Lives at the edges of broadleaved evergreen forest and lower montane
    forests on Sumatra, feeding on various insects, fruit, seeds and even flower buds.


    ## Silver-eared Mesia Leiothrix argentauris 15–17cm


    Indonesian name: Mesia Telinga-perak


    The male is distinctively marked, with bright silver ear-coverts that contrast
    with a black crown and face, and a small yellow-orange tuft of feathers at the
    base of the bright yellow bill. The chin, neck and fore-collar are dark orange
    blending into an olive mantle and paler orange breast. The tail is blackish fringed
    yellow, the legs and iris yellow. Females are less bright.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_170_0.png)


    Where to see: Occurs on Sumatra but is becoming rare in its preferred montane
    habitat because of trapping.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_170_1.png)


    ## Velvet-fronted Nuthatch Sitta frontalis 12–13cm


    Indonesian name: Mungk Beledu


    Velvet-fronted Nuthatch has a red bill and reddish feet, dirty pinkish-white underparts
    and whitish throat. The uppersparts are mainly violet-blue, with black-edged feathers
    in the tail and primaries, and the forehead is velvety-black. A very active and
    attractive bird which, unlike other nuthatches in the region, is well-adapted
    to creeping down tree trunks of insects and spiders.


    and Java. Usually seen in pairs but occasionally in small parties, moving erratically
    through the understorey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_171_0.png)


    **Where to see:** Common in lowland forests and Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_171_1.png)


    ## Blue Nuthatch Sitta azurea 13cm


    Indonesian name: Mungk Loreng


    In shady forest it appears dark, but in fact its back and wings are shiny. Only
    the crown, nape and sides of the face are black. It has a yellow bill and grey
    feet typically forages along branches.


    **Where to see:** Occurs in lower montane forests of Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_172_0.png)


    ## Asian Glossy Starling Aphonis panayensis 20cm


    Indonesian name: Perling


    Adults are all black and can be separated from Short-tailed Starling (Aphonis
    minor) by being larger and having yellow iris. It has dark red eyes and black-streaked
    belly.


    Where to see: A common bird in open areas near secondary vegetation, also attracted
    to cultivated areas and gardens.


    ## Grosbeak Myna Scissirostrum dubium 20cm


    Indonesian name: Jalak Tunggir-merah


    This small starling is easily recognised by its predominantly dark grey, the solid
    ‘grosbeak-type’ orange-yellow bill and the bright red, elongated undertail-coverts,
    some with shiny tips. The legs are also orange-yellow and the iris is black-brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_173_0.png)


    Where to see: Occurs on Java. Prefers tree canopy of lowland forest edges, where
    it often congregates in large flocks, feeding on fruit, seeds and insects.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_173_1.png)


    ## Common Hill Myna Gracula religiosa 27–35cm


    Indonesian name: Tiong Emas


    Black overall with a purple sheen and orange wattles both behind and below the
    eye and has a white wing-bar. It has yellow feet and a stout orange bill. Another
    species under great great pressure from habitat loss and trapping for the pet
    trade, this bird is particularly in demand for its ability to mimic other birds,
    as well as for its own enormous repertoire of whistles and calls.


    Where to see: Although it occasionally congregates in small flocks, it is more
    likely to be seen in pairs in tall trees. Once a common bird of lowland forest
    edge, it has become rare on Bali and Java but remains in reasonable numbers on
    Sumatra.

