    ## Black-capped White-eye Zosterops atricapilla 9.5–10cm


    Indonesian name: Kacamata Topi-hitam


    The upperparts of this little white-eye are a solid olive-green becoming black
    on the crown, forehead, lores and a white around the eye. The white eye-ring is
    broken by a black spot at the front. The blackish-brown flight and tail feathers
    are also edged olive-green. On the rump, the olive-green becomes yellower, and,
    below, the bright yellow undertail-coverts extend to the lower breast in a wide
    stripe flanked by dark grey underparts. The throat and bib area are a lemon-green.
    The bill is fawn and black and legs grey.


    Where to see: Occurs in the lower montane forests of Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_160_0.png)


    ## Lemon-bellied White-eye Zosterops chloris 11–12cm


    Indonesian name: Kacamata Laut


    This little white-eye has dullish green uppermost from the crown, over the back
    and wing-coverts to the yellow-green upper-coverts. The underparts are pale yellow,
    brighter on the throat and undertail-coverts. There is a small yellow loral patch
    with the black lores extending below the unbroken white eye-ring to the greenish
    ear-coverts. The tail and flight feathers are blackish, edged green. The bill
    is blackish, above and grey below and legs are grey.


    Where to see: Occurs in extreme West Java and on Nusa Penida, Bali in a variety
    of habitats, from forest to mangrove and even cultivation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_160_1.png)


    ## Chestnut-capped Babbler Timalia pileata 15–17cm


    Distinguished by its masked appearance and long tail. Main body colour is warm
    olive-brown above and buff-brown finely streaked black below. The head is more
    striking, with a bright chestnut crown underlined by a white forehead and supercilium.
    The chin, throat and neck are white, with the ear-covers whitish, becoming pale
    grey towards the nape. The strong bill is black and iris and legs dark brown.


    Where to see: This babbler inhabits scrubby and swampy areas, usually in the company
    of other babblers and occurs from West Java east to Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_161_0.png)


    ## Pin-striped Tit Babbler Mixornis gularis 11–12cm


    Indonesian name: Ciung-air Melayu


    The uppers of this small tit babbler are all chestnut-brown, including the tail.
    The underparts, in particular the breast, are conspicuously but finely streaked
    with black on a ground colour of yellowish-green, becoming whitish on the lower
    belly and vent. Javan birds are more greyish below. The sides of the head are
    grey, sometimes tinged yellow, with a pale supercilium. The bill is brown and
    the legs are grey-blue.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_161_1.png)


    Where to see: A common bird in lowland Sumatra, gathering in small groups foraging
    in dense thickets and bushes, especially bamboo, and secondary growth in broadleaf
    forest.


    ## Golden Babbler Cyanoderma chrysaeum 10–12cm


    Golden Babbler has olive-green upperparts and a dull yellow, thinly streaked crown.
    The underparts are buff-yellow on the throat, becoming greyish on the flanks and
    buff on the vent. The tail and upperwing are grey tinted olive with flight feathers
    vaguely edged olive. Dark brown iris surrounded by dark grey-blue loral skin extending
    into a short black submoustachial stripe. The ear-coverts are yellow-grey, the
    bill is blackish above and black to pink below, and the legs are light brown.


    Where to see: Occurs in montane forests of Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_162_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_162_1.png)


    ## Crescent-chested Babbler Cyanoderma melanothorax 13cm


    Indonesian name: Tepus Pipi-perak


    Upperparts are brown varying, across subspecies, from chestnut to dull olive-brown.
    Underparts are white to whitish-buff, becoming greyish or sandy-buff on the belly,
    with a black crescent shape across the upper breast. Ear-coverts are olive-grey
    to grey underlined by a black malar stripe. The supercilium is pale grey, the
    legs and bill brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_163_0.png)


    Where to see: Occurs in the forests of Java and Bali.


    ## Javan Scimitar Babbler Pomatorhinus montanus 21cm


    Indonesian name: Cica-kopi


    This bird has a striking black head with a long curved bill, a white throat and
    breast. The underparts and vent are chestnut, while the upperparts and tail are
    greyish-brown. The legs are grey and the iris is dark reddish-brown.


    Where to see: Occurs in the montane forests of Java.


    ## Black Scimitar Babbler Melanichla lugubris 25cm


    Indonesian name: Cica-hitam


    This babbler is mostly black, except for a white throat and bib and a pale orange-yellow
    eyebrow. The upperparts are dark, while the underparts are greyish-brown. The
    legs are grey and the iris is dark reddish-brown.


    Where to see: Occurs in the lowland forests of Sumatra.


    ## White-bibbed Babbler Stachyris thoracaca 18cm


    Indonesian name: Tepus Leher-putih


    This babbler has a dark-black crown and a white throat and bib. The upperparts
    are olive-brown, while the underparts are greyish. The legs are brown and the
    iris is dark reddish-brown.


    Where to see: Occurs in Java. Subspecies *S. thoracica* occurs in West Java.


    ## Javan Black-capped Babbler Pellorneum capistatum 16–17cm


    Indonesian name: Kepod-Jawa


    This babbler has a black-capped head and a white throat and bib. The upperparts
    are olive-brown while the underparts are greyish. The legs are brown and the iris
    is dark reddish-brown.


    Where to see: Occurs in the lowland forests of Java. Subspecies *P. capistatum*
    occurs on Java and *P. c. capistatum* on Sumatra, West Java, and Bali.


    ## Abbott’s Babbler Malacoccincla abbotti 15–17cm


    Indonesian name: Pelanduk Asia


    Like Horsfield’s Babbler, Abbott’s is small and brown and has a heavy bill. It
    is distinguished by being lighter and having a longer tail. The upperparts are
    brownish-olive, with a pale chestnut rump. The underparts are buffish-white on
    the throat, with pale grey-green breast and rufous undertail-coverts. The sides
    of the head are buffish-brown with a pale-grey supercilium.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_166_0.png)


    Where to see: Locally common in Sumatra’s lowland forests, with a few records
    for Java, but absent Bali.


    ## Horsfield’s Babbler Malacoccincla sepiaria 15–16cm


    Indonesian name: Pelanduk semak


    This babbler has a dark grey-brown crown and warm russet-brown upperparts, becoming
    chestnut on the rump and tail. The flanks and vent are also chestnut, while the
    throat and belly are white and the breast grey. It has a heavy grey-and-black
    bill and red-brown iris. Separated from Abbott’s Babbler by its darker and greyer
    crown. This noisy little babbler has a monotonous and repetitive call, pee-o-eel
    pee-o-eet, given particularly at dawn and dusk.


    Where to: This is a locally common resident throughout the region in dense undergrowth
    low thickets of hill and submontane forests. Subspecies M. s. sepiaria occurs
    on Java and Bali and M. s. barrussana on Sumatra.

