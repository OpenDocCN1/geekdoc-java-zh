    with a dark grey band across the upper breast, and the grey tail feathers are
    tipped white. The eye is surrounded by a patch of bare blue


    skin and the legs are grey. Juveniles have a black tip to a paler red bill. Can
    be located by its whining call.


    Where to see: Occurs in the woodlands and lower hills of Java and Sumatra in secondary
    scrub and at evergreen forest edges; usually in pairs or small groups, foraging
    in Alang-alang grassland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_35_0.png)'
