    # # Javan Cochoa Cochoa azurea 23cm


    Indonesian name: Ciung-mungkal Jawa


    The male has crown and most of the upperparts and tail glossy blue, while the
    underparts are more purplish-blue. Bill and crown, wings and tail legs black.
    The female has a blue crown, wings and tail but is otherwise a very dark brown.
    Its high-pitched song is also quiet when alarmed it emits a louder *djek-djek-djek-djek*
    call, reminiscent of many other thrushes.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_179_0.png)


    **Where to see:** Occurs in West and Central Java, frequenting the lower levels
    of tropical montane forest, seldom venturing into the canopy. It is often difficult
    to locate, as it seems to perch quietly and motionless for ages.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_179_1.png)'
  - '[PAGE 180]


    # Siberian Thrush Geokichla sibirica 20–23cm


    Indonesian name: Anis Siberia


    The male is dark slate-blue above and slate-grey on the flanks, becoming whitish
    on the belly. The head and shoulder area appear a darker slate-blue, offsetting
    the ostentatious white supercilium. The undertail-covers and outer tail feathers
    are tipped white. The legs are yellow and the bill black. Females are olive-brown
    and buff-brown below.


    Where to see: Regularly overwinters on Sumatra and West Java, rarely on Bali.
    Occurs in the lower levels of moist forest, often close to water.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_180_0.png)


    # Chestnut-capped Thrush Geokichla interpre 16–17cm


    Indonesian name: Anis Kembang


    Chestnut-capped, as its name implies, this small thrush otherwise has a pied appearance.
    The chestnut crown extends onto the nape, stopping at the slate-grey mantle and
    upperparts. It has two distinctive broad white wing-bars. The throat and upper
    breast are dense black, leading into a black-spotted lower breast and flanks and
    white belly and vent. The bill is blackish-brown and the legs pink.


    Where to see: Occurs low down in primary, secondary and even logged forest on
    Java, rarely on Bali and Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_180_1.png)'
  - '[PAGE 181]


    # Orange-headed Thrush Geokichla citrina 20–22cm


    Indonesian name: Anis Merah


    The usual haunts of this thrush are more secluded forest among thick under, but
    its high-pitched whistling call betrays its presence. It has a very nice song
    and this, along with its attractive colouring, makes it a prime target for local
    birdkeepers and more recently, the export pet trade. Its head, nape and belly
    are bright orange, the back grey-blue, and the tail and wings dark grey. It has
    a white vent and wing-bar. The female has greenish-brown uppersparts.


    Where to see: Occurs in Java and Bali, in lowland and hill forest and bamboo thickets.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_181_0.png)


    G.c. rubecula ♂


    # Island Thrush Turdus poliocephalus 18–22cm


    Indonesian name: Anis Gunung


    This is a medium-sized thrush with a dark grey head blending into dull blackish
    uppersparts. The throat and upper breast are mid-grey, while the belly is chestnut
    and the vent white. The eye-ring, bill and


    legs are yellow. It has a pleasantly melodious song and a rather raucous rattling
    alarm call.


    Where to see: Occurs in the highest mountains of Sumatra and Java. More common
    on Java, where it usually be seen close to the volcano of Mt. Tangkuban Perahu
    and in the mossy forests of Mt. Gede. On Sumatra, the peaks of Mt. Leuser are
    its home.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_181_1.png)'
- md: '

    ## Asian Brown Flycatcher *Muscicapa dauurica* 12–14cm


    Indonesian name: Sikatan Bubik


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_182_0.png)


    This species of submontane forest and forest edges can frequently be found in
    plantations, open forest and even gardens. It hunts aerial insects from exposed
    perches, often shaking its tail on arrival back at the perch. It is greyish-brown
    above and whitish below, becoming grey-brown on the flanks and the sides of the
    breast, and has a pale eye-ring. The black bill has a yellow base to the lower
    mandible.


    **Where to see:** A winter migrant to the region from north-east Asia, but some
    may be resident in north Sumatra. Occurs in woodland, forest and scrubland, sometimes
    close to cultivation.


    ## White-rumped Shama *Copsychus malabaricus* 21–27cm


    Indonesian name: Kucica Hutan


    The male has a very long tail, about half its total length, with dull central
    feathers and white outers, which it habitually flicks on landing. Its head, neck,
    back and wings are black with a blue sheen, its lower underparts are deep orange,
    and it has a conspicuous white patch on the rump. Another beautiful songster in
    decline, due to trapping for the pet trade.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_182_1.png)


    **Where to see:** Occurs on Sumatra and Java, spending a lot of time foraging
    on the ground in dense undergrowth. Common on Sumatra in denser forest, but far
    less on Java.


    ## Oriental Magpie-robin *Copsychus saularis* 20cm


    Indonesian name: Kucica Kampung


    Sumatran birds have black wings and central tail, with white outer tail feathers,
    belly and vent, and a broad white patch across the wing-covers, whereas those
    from East Java and Bali are all black except for the white patch. Females are
    much duller, with the black plumage replaced by grey. Juveniles have similar but
    mottled plumage.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_183_0.png)


    **Where to see:** Occurs throughout the region in lowland mangroves and forests
    to gardens. Once trapping for the pet trade has caused a serious decline.


    ## Pale Blue Flycatcher *Cyornis unicolor* 16–18cm


    Indonesian name: Sikatan Biru-uda


    Males of this mid-sized, long-tailed flycatcher are predominantly blue, whereas
    females are grey-brown. The male has black lores and a pale-blue forehead grading
    into a short supercilium. The throat is pale blue grading to grey on the belly
    and white on the undertail-covers. The female has grey-brown upperparts and buff
    underparts.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_184_0.png)


    **Where to see:** Occurs in dense and moist forests of Sumatra and Java.


    ## Javan Jungle Flycatcher *Cyornis banyumas* 14–15cm


    Indonesian name: Sikatan rimba Jawa


    Males have dark blue upperparts with iridescence on the forehead and shoulder.
    The chin, lores and a thin line around the eye are black, while the throat and
    breast are rufous-orange, grading into white on the belly and vent. The bill is
    black fading to dull purple at the base, the legs vary from dark brown to pale
    pink and the iris is dark brown. Females have brown upperparts with an off-white
    eye-ring, and underparts similar to the male’s but paler.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_184_1.png)


    **Where to see:** Occurs on Java, where it favours low undergrowth and bamboo
    thickets and the edges of glades in high montane forests.


    ## Mangrove Jungle Flycatcher *Cyornis rufigastra* 15cm


    Indonesian name: Sikatan rimba Bakau


    Characteristic blue uppers and orange-red underparts. The bill is black and the
    legs blue-grey, although the female is paler and has a whitish chin and a white
    loral patch. Many subspecies vary in strength of colour of uppers and underparts.
    It is most likely to be confused with the Hill Blue Flycatcher (*Cyornis banyumas*),
    but that has a pale forehead and blackish.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_185_0.png)


    **Where to see:** Occurs in mangrove forest on Sumatra and West to Central Java,
    also in Baluran National Park in East Java and Bali Barat National Park in Bali.


    ## Sumatran Niltava *Niltava sumatrana* 15cm


    Indonesian name: Niltava Sumatera


    The male''s dark blue uppers are iridescent on the forecrown, rump and upper coverts
    and tail and dark blue over the back and wingcovers. The flight feathers are blue-black,
    edged dark blue. There is a thin iridescent blue neckline and patch on the shoulder.
    The lores and forecrown, chin, throat and ear-coverts are blue-black. The underparts
    from the neck to the undertail-covers are bright orange. The legs are blue-grey
    and the bill black. Females are grey from crown to nape, the remainder of the
    uppers and sides of the face being warm brown. The underparts are grey at the
    belly, becoming whitish at the vent.


    **Where to see:** Occurs in montane forest in the Barisan Range of W. Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_185_1.png)


    ## Blue-and-white Flycatcher *Cyanoptila cyanomelana* 16–17cm


    Indonesian name: Sikatan Biru-putih


    The male has mainly rich blue upperparts, over the crown, the uppermost-coverts
    and along the edges of the tail and flight feathers; the greater part of the flight
    feathers being black. The lores, face, ear-coverts, chin and upper breast are
    shiny black. The remainder of the underparts, including the undertail-coverts,
    are white. The legs are purplish-black. The bill is black and the iris dark brown.


    The female’s upperparts, including the crown, are grey-brown, the ear-coverts
    brown finely streaked buff and the wings dark brown with russet edges. Tail feathers
    are also russet-brown. The underparts are buff with a warmer tint to the breast.


    **Where to see:** Overwinters in the hill and montane forests of Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_186_0.png)


    ## Indigo Warbling-flycatcher *Eumyias indigo* 14cm


    This species is mainly a deep-blue, especially on the uppers. The bill is black
    and the legs are grey. Juveniles are similar but mottled plumage.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_187_0.png)


    **Where to see:** Relatively common in montane forests of Java, but less so on
    Sumatra.


    ## Verditer Warbling-flycatcher *Eumyias thassinus* 15–17cm


    Indonesian name: Sikatan kicau Hijau-laut


    This is a large flycatcher with an upright stance. The male’s plumage is fairly
    uniform turquoise-blue, with a brighter forehead and throat. The lores and face
    do not reach the black. Females are duller and greener and juveniles are brown
    with buff underparts.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_187_1.png)


    **Where to see:** Occurs on Sumatra, where it prefers open forest edges, choosing
    exposed perches from which it can launch its attacks on passing insects.


    ## Javan Whistling-thrush *Myophonus glaucinus* 25–26cm


    Indonesian name: Ciung-batu Jawa


    The male has blackish underparts and dark blue uppers with an often hidden, brighter
    blue on the shoulder. The plumage is more uniform than that of whistling thrushes,
    lacking spangles. It has a blackish bill and legs. The female is browner but duller,
    with juveniles a bit darker and marked with elongate whitish spots.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_188_0.png)


    **Where to see:** Occurs on Java and Bali, keeping to the lower levels in montane
    forest. Often secretive hides away in dark corners and crevices but is occasionally
    seen foraging on the ground.


    ## Blue Whistling-thrush *Myophonus ceruleus* 29–35cm


    Indonesian name: Ciung-batu Siul


    A bluish-black thrush having a moderate purplish sheen and sparsely flecked and
    spangled white on the wing-covers. The contrasting yellow bill is often marked
    with black, particularly on Sumatran birds. Legs are black. It has a high-pitched
    screeching alarm, screech-chit-chit-chit-chit, and a loud whistling song often
    incorporating imitations of other birds'' songs.


    Ground feeder, taking insects, invertebrates and small fruits.


    **Where to see:** Uncommon on Java and Sumatra but absent from Bali. Generally
    found in denser lowland and hill beside rivers and among exposed limestone formations.

