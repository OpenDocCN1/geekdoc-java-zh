    This delicate little flycatcher has a round head and short tail. The underparts
    are alike in both sexes, being pale chestnut on the chin blending to fawn on the
    belly and white below the tail. The uparts differ, the male dark steely blue above
    and the female olive-brown. The male has a noticeable white stripe above black
    lo almost meeting centrally extending over the eye. The leg colour is variable,
    from purple to grey in males to pink in females. The bill is black and iris very
    dark brown. Females are coloured orange-buff from above the bill to just over
    the eye. Male Sumatra birds have blackish


    wings and tail, and those on Java and Bali are greyer above.


    Where to see: Common in the highland forests of west Sumatra and on Java and Bali


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_191_0.png)


    # Little Pied Flycatcher Ficedula westermanni 11cm


    Indonesian name: Sikatan Belang


    Where to see: Occurs throughout the region in submontane to montane forest.


    This species is sexually dimorphic, the male being black and white and the female
    brown and white. The male''s upperparts are all black, apart from a white wing-bar
    and supercilium and white edges to the base of the outer tail feathers. The underparts
    are all white and the legs and bill black. Iris dark brown. Females have brown
    upperparts and whitish underparts, the tail being rufous-brown. Juveniles are
    heavily spotted with buff on the head and uparts and have dark barring on the
    breast. It has a quiet pi-pi-pi-pi-pi call followed by a vibrating churring sound.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_191_1.png)'
  - '[PAGE 192]


    # Rufous-chested Flycatcher Ficedula dumteria 11–12cm


    Indonesian name: Sikatan Dada-merah


    The male''s upperparts are mainly black from the head and mantle, including the
    upperwing and tail. The long supercilium is white as are the median covert tips
    and of the upperwing-coverts, which form a white stripe along the wing. The bases
    of the outer tail feathers are also white. The throat and upper breast are orange-red,
    the remaining underparts white. Females are similar to the male but coloured olive-brown
    instead of black above.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_192_0.png)


    **Where to see:** Occurs throughout the region, but rarely on Bali. It is mostly
    insectivorous, preferring mainly lowland forests.


    # Pied Bushcat Saxicola caprata 13–14cm


    Indonesian name: Decu Belang


    Males are all black, apart from a white rump, vent and distinctive wing-bar and
    shoulder patch. Females have dark brown-streaked upperparts, dark brown tail,
    buff underparts with rufous flanks, and pale rufous-brown rump. Juveniles are
    spotted dark and light brown. Often sings from a prominent perch cocking its tail.


    **Where to see:** Like all the chats, this bird prefers scrubby grassland, where
    it perches on exposed bushes or posts to locate its insect prey. A common resident
    of the dry, open woodlands of Java and Bali, occurring sporadically in the hills.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_192_1.png)'
  - '[PAGE 193]


    # Greater Green Leafbird Chloropsis sonnerati 18–22cm


    Indonesian name: Cica-daun Besar


    Of the many leafbirds resident in the region, the Greater Green Leafbird is by
    far the largest. It is bright green on the back and tail, with slightly paler
    underparts. The strong hooked bill is black. The male has a black throat and face
    with a blue malar stripe, and the shoulder of the wing is marked by a small blue
    spot. The female has a yellow throat edged by a blue malar stripe, with a distinctive
    yellow eye-ring. Juveniles are very like the female, with the blue malar stripe
    being very dull or non-existent.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_193_0.png)


    Where to see: Typically found with other leafbirds in lowland primary and secondary
    forest throughout the region.


    # Blue-winged Leafbird Chloropsis moluccensis 17cm


    Indonesian name: Cica-daun Sayap-biru


    Both subspecies have the typical colour of most leafbirds; generally yellowish-green
    above and more yellow below. This species is recognised by the blue wings and
    tail. The male has a black patch below the eye which extends into a yellow-bordered
    black throat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_193_1.png)


    The Sumatran subspecies has a yellow crown and yellow to orange nape, whereas
    the Javan subspecies has a green crown and yellow upper part. Females lack the
    black head and


    throat markings. All have a blue malar stripe, a little less evident on females.


    Where to see: Occurs at forest edges on Sumatra and Java.'
  - '[PAGE 194]


    # Asian Fairy-bluebird Irena puella 21–25cm


    Indonesian name: Kecembang Gadung


    Apart from the black face, neck, underparts, tail and primaries, the male''s plumage
    is brilliant blue. The iris is red and legs are dark grey. Females are a duller
    blue with a greenish tinge, except for their brighter blue rump. It can be distinguished
    from other bright blue-and-black birds by its larger size.


    Where to see: Commonly found in the lowland forests of Sumatra, but less so on
    Java. More likely to be seen at fruiting fig trees, where it is often in mixed
    flocks with other birds. Otherwise it confines itself to foraging through the
    tops of tall trees of primary and secondary forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_194_0.png)'
  - '[PAGE 195]


    # Crimson-breasted Flowerpecker Prionochilus percussus 10cm


    The adult male is brilliantly coloured, with bright yellow underparts broken only
    by a bright crimson breast patch. The uppers are greyish-blue, with a bright red
    patch on the crown. The forehead and primaries are black and the tail is dark
    blue-grey. It has a white malar stripe finely underlined in black. Females are
    olive-green above, with


    only a tinge of orange on the crown, and have a yellow-tinged grey throat, a white
    malar stripe and a yellow belly with greyish-olive flanks; the undertailcoverts
    are distinctly white.


    Where to see: A rather scarce and local bird of Sumatra and West Javan lowland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_195_0.png)'
- md: '

    ## Modest Flowerpecker Pachyglossa modesta 9–10cm


    Indonesian name: Cabai Gesit


    This flowerpecker is comparatively dull, appearing as a small, dingy, grey-brown
    bird that continuously twitches its tail from side to side, with an unusually
    thick bill for a flowerpecker. The uparts are shaded olive-green and underparts
    are buff with indistinct brown streaks. A buff submoustachial stripe separates
    the light brown malar stripe from the pale brown ear-coverts. The brown tail and
    primaries are edged paler greenish-brown. The iris is bright red-brown, the legs
    are brown blue-grey. Sexes are similar, while juveniles are plainer and yellow
    below.


    Where to see: Occurs in woodlands the lowlands of Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_196_0.png)


    ## Orange-bellied Flowerpecker Dicaeum trigonostigma 8–9cm


    Indonesian name: Cabai Bunga-api


    The orange belly, vent, rump and lower back, and the blue-grey head, wings and
    tail are diagnostic of the male. The female is pale olive-grey with a grey throat,
    becoming yellowish on the belly, being dirty orange. The pointed and decurved
    bill is black and the legs grey. Juveniles look like dull females, lacking yellow
    or orange.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_196_1.png)


    Where to see: Occurs throughout the region''s lowlands, flitting among the forest
    canopy, garden trees and mangroves. It is very active, searching out small insects
    as well as small ripe fruits.


    ## Dicaeum sanguinolentum 9–10cm


    Indonesian name: Cabai Gunung


    The male has a blood-red chest, becoming buff on the throat. The belly is pinky-buff
    down to the undertail-coverts. A broad stripe is superimposed down the centre
    of the breast to the belly. The uppersparts to the top of the head are lustrous
    steel-blue. The bill and legs are black and iris is blue-brown. Females have a
    bright red rump on an otherwise olive-brown body, tinted orangey-buff on the underparts.
    Juveniles are similar to females but show more grey on the head and a yellow tinge
    to the underparts.


    Where to see: Occurs mainly in montane and hill forest of Java and Bali but is
    occasionally found in south Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_197_0.png)


    ## Scarlet-headed Flowerpecker Dicaeum trochileum 8–9cm


    Indonesian name: Cabai Jawa


    Adult males are scarlet-red from the head to the lower breast and along the back
    to the undertail-coverts. The tail and upperwings are black, with a very pale
    grey belly becoming darker on the flanks and lower breast. The feet and bill are
    black and the iris brown. Females have light brown uppersparts and a scarlet-red
    rump. The head and mantle often appear reddish-brown. The underparts are pale
    grey-white. Juveniles are light green-brown on the upperparts but show orange
    on the rump.


    Where to see: This is a coastal and lowland species, feeding on insects, nectar
    and fruit and occurring throughout the region.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_197_1.png)


    ## Ruby-cheeked Sunbird Chalcoparia singalensis 10–11cm


    Indonesian name: Burung-madu Belukar


    Although this small sunbird is brightly coloured, when in the shade its iridescence
    is not often visible, and males even appear blackish. In bright light, however,
    the male’s iridescent green uparts and crown are brilliant, and the ear-coverts
    are a deep red. The throat is orange-brown, grading into a yellow belly. Females
    are duller, with olive-green uparts and pale orange-and-yellow underparts. The
    straight bill and legs are black, the legs often with a greenish tinge.


    **Where to see:** This is a bird of forest edge and sparse woodland, often found
    in the company of other species. Occurs on Sumatra and Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_0.png)


    ## Brown-throated Sunbird Anthreptes malacensis 12–13cm


    Indonesian name: Burung-madu Kelapa


    Identified by its bright coloration and long, curved bill, this species usually
    hovers in front of flowers in search of nectar. The male has a yellow breast,
    belly and vent, and a brown throat often fringed with dark purple. The face and
    chin are olive and the uparts are iridescent olive-green, blending into a dark
    bluish head with a green sheen. The female is olive-green above and yellowish
    below. Of the region’s 12 different sunbirds, only Brown-throated and Ornate occur
    on Bali.


    **Where to see:** Occurs throughout the region. Usually seen in open plantations,
    gardens, coastal scrub and mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_198_1)


    ## Hasselt’s Sunbird Leptocoma brasiliana 9–10cm


    Indonesian name: Burung-madu Pengantin


    The male has a blackish forecrown with an iridescent purple-green sheen. From
    the back of the head, over the mantle and to the upperwing-coverts, including
    the chin to mid-breast, the plumage is crimson. The underparts are pale yellow.


    **Where to see:** Occurs on Sumatra and Java, mainly in lowland forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_199)## Copper-throated Sunbird Leptocoma
    costheta 12–13cm


    Indonesian name: Burung-madu Bakau


    The male has olive-green upperparts and a black tail. The throat is copper-colored.
    The smaller Purple-throated Sunbird (Leptocoma spata) is distinguished by its
    breast.


    **Where to see:** Occurs in the lowlands of Java and Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_0)


    ## Ornate Sunbird Cinnrys ornatus 10cm


    Indonesian name: Burung-madu Sriganti


    Quite small, with a long, curved bill, it has olive-green upperparts and dark
    tail. The underparts are bright yellow. The nest, a wonderfully woven structure
    of fine grasses and hair-like materials, is suspended precariously from the end
    of a branch.


    **Where to see:** Occurs in coastal lowlands and mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_200_1)


    ## Javan Sunbird Aethopyga mystacalis 9–12cm


    Indonesian name: Burung-madu Jawa


    The male has scarlet over the head, back and breast, with forearm and malar iridescent.
    The wings are olive-grey with dark tail. The underparts are bright white merging
    into pale yellow on the vent.


    Where to see: Occurs in submontane forested regions of Java.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_201_0)


    ## Crimson Sunbird Aethopyga siparaja 10–15cm


    Indonesian name: Burung-madu Sepah-raja


    The male has a blackish forecrown with an iridescent purple-green sheen. From
    the back of the head, over the mantle and to the upperwing-coverts, including
    the chin to mid-breast, the plumage is crimson. The lower breast to vent is blackish-purple.
    There is an iridescent purple-blue moustachial stripe. The rump is yellow and
    remaining upperparts dark brown to black.


    Where to see: Occurs in more open forest and forest edges of south Sumatra and
    Java, occasionally close to human habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_202_0)

