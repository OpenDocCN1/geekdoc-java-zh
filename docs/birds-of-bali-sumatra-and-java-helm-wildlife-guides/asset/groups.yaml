    ## Edible-nest Swiftlet *Aerodramus fuciphagus* 11–13cm

    Indonesian name: Walet Sarang-putih


    Difficult to separate from other swifts in the flight. Plumage is overall black-brown,
    appearing greyer on the throat, underparts and rump. Sumatran birds are often
    darker.


    **Where to see:** They naturally inhabit the region''s dark caves, where they
    use echolocation for navigation. Today, this is the swiftlet that has become big
    business in Indonesia, where they are encouraged to nest in disused buildings
    so their nests can be harvested for bird''s nest soup.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_42_0.png)


    ## House Swift *Apus nipalensis* 14–15cm

    Indonesian name: Kapinis Rumah


    The medium-sized swift can be recognised by its broad white rump, pale throat
    and slightly notched tail, unlike the similar but larger Pacific Swift (*Apus
    pacificus*), which has a distinct fork to the tail. Otherwise, it has blackish
    plumage, black bill and brown feet.


    **Where to see:** Usually seen in large groups hunting insects over open countryside.
    It prefers coastal habitats and the lower hills and is frequently found in towns
    and villages, where it nests under the eaves of houses. It also uses overhanging
    cliff faces and cave entrances as nesting sites.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_42_1.png)


    ## Whiskered Treesnift *Hemiprocne comata* 15–17cm


    Smaller than the Grey-rumped Treesift (*Hemiprocne longipennis*), which also occurs
    in the region. Has a long, slightly forked tail and rudimentary crest. Males have
    a mostly dark greenish-bronze body, head and throat offset by long white supercilium
    and moustachial stripes separated by dark chestnut ear-coverts. The belly and
    tertials are whitish. Females are much the same but with dark blue-green ear-coverts.
    Juveniles are duller and browner.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_43_0.png)


    **Where to see:** Occurs on Sumatra, mainly in lowland primary and secondary forest
    or woodland with tall trees.


    ## Common Moorhen *Gallinula chloropus* 30–35cm

    Indonesian name: Mandar Batu


    This very adaptable aquatic bird is almost entirely dark grey to black, with a
    broken white stripe along its flanks. It also displays white patches under the
    tail, particularly when dashing for cover with its tail raised. It has a characteristic
    frontal shield and bill, with a yellow tip to the bill. The legs are greenish-yellow.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_43_1.png)


    **Where to see:** Frequents the region’s freshwater pools, rivers and rice fields.
    It is a good surface swimmer and will dive and even run over the water’s surface.


    ## Purple Swamphen *Porphyrio porphyrio* 40–48cm

    Indonesian name: Mandar Besar


    Easily recognised, large, blue-black rail with a substantial bright red bill and
    frontal shield, the uppersparts having a purple-blue sheen on the mantle and sides
    of the neck. The upperwing-coverts are black shaded with green and its undertail-covers
    are white. Its long, ungainly pink legs with huge spreading toes are ideal for
    trampling through and over aquatic vegetation. It habitually flicks its tail.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_44_0.png)


    **Where to see:** Occurs throughout the region. A rather quiet and secretive bird,
    keeping to the edges of undisturbed reedbeds, marshland and occasionally paddyfields.


    ## White-breasted Waterhen *Amauroornis phoenicurus* 28–33cm

    Indonesian name: Kareo Padi


    A conspicuous rail with a white face, foreneck and breast along with rufous flanks
    and lower belly well-demarcated from the dark grey-green uppers. The bill is greyish-green
    with a red base, and the legs and feet are yellow. It is very vocal at dawn and
    dusk, with a cacophony of weird squawks, grunts and croaking sounds.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_44_1.png)


    **Where to see:** Occurs throughout the region''s wetlands. It is a wandering
    feeder, frequently out in the open but never far from dense cover. Very agile,
    it runs over floating vegetation and climbs through bushes, searching for insects.


    ## Red-legged Crake *Rallina fasciciata* 22–25cm

    Indonesian name: Tikusan Ceruling


    The red-brown mantle and brighter red-brown head along with the red legs are diagnostic
    of this rail. The remaining upperparts are grey-brown. The underparts and forewings
    are barred black and white. It has a green bill. Female similar has a more pinkish
    head with narrower barring on the lower parts of the body. Immatures have less
    obvious markings and paler underparts and brownish legs.


    **Where to see:** Occurs in damp lowland and forest edges.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_45_0.png)


    ## Ruddy-breasted Crake *Zapornia fusca* 21–23cm

    Indonesian name: Tikusan Merah


    Easily confused with other crakes of the region, it has a red bill and breast,
    and chestnut-rich underparts are finely barred.


    **Where to see:** Occurs throughout the region''s wetlands, rice fields and occasionally
    swampland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_45_1.png)


    ## Thick-knee *Esacus magniroststris* 51–57cm

    Indonesian name: Gagang-bay


    This stocky shorebird has a short, curved bill and long yellow legs. In flight,
    it shows a pale wing-bar and rump, below, a white patch.


    **Where to see:** Occurs as a resident throughout the region. Found on sandy and
    rocky coastal beaches.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_46_0.png)


    ## Black-winged Stilt *Himantopus himantopus* 35–39cm

    Indonesian name: Gagang Timur


    This tall and rather elegant shorebird has long pink legs and a slender neck and
    large head. Its upperparts are black, and its underparts are white.


    **Where to see:** Occurs mainly in north Sumatra and West Java, preferring shallow
    water and rice fields.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_47_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_47_1.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_47_2.png)


    ## Grey Plover *Pluvialis squaratola* 27–30cm

    Indonesian name: Cerek Besar


    In winter plumage, this attractive waterader has uppersparts mottled grey and
    brown and underparts pale grey to white. It has a faint pale supercilium, a black
    bill, dark grey legs and a large black eye. In flight, it shows a pale wing-bar
    and rump and, below, a white patch with a large black patch near the body. These
    features easily separate it from the Pacific Golden Plover, which is slightly
    smaller and has a shorter bill.


    **Where to see:** Occurs as a winter visitor to the region. Found in small groups
    on tidal mudflats feeding on marine invertebrates and often roosting on isolated
    shingle-spits.


    ## Pacific Golden Plover *Pluvialis fulva* 23–26cm

    Indonesian name: Cerek Kernyut


    A typical plover in shape, with an upright stance, a robust body, neck and large
    head with a short, strong bill. In the region it is usually in non-breeding plumage,
    having lost the distinctive black face and underparts it had on its breeding grounds.
    Can be identified by its speckled gold, brown and buff uppersparts, and buff breast,
    face and supercilium. The bill is black and the legs grey.


    **Where to see:** This winter migrant stops off around the coasts of the Sundas,
    often congregating in flocks. It is common on mudflats and open grassland near
    the coast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_48_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_48_1.png)

