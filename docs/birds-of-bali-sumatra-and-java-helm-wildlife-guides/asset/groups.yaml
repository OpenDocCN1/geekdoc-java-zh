  - '[PAGE 27]


    # Zebra Dove Geopelia striata 20cm


    Indonesian name: Perkutut Jawa


    Known as the Zebra Dove for its finely barred brown neck to tail. The back of
    the head is pale brown blending into a buff face, crown, neck and chin. The long,
    tapered tail is brown and black with white-tipped outer feathers; very evident
    on take-off. Commonly known locally as the Peaceful Dove, it should not be confused
    with its close relative,


    the Peaceful Dove (Geopelia placida) of Australasia.


    Where to see: Occurs sparsely throughout the region. See around gardens, cultivation
    and open grassland and scrub. This is a very common cagebird on Bali and Java,
    where it holds a special significance in cultural mythology.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_27_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_27_1.png)'
  - '[PAGE 28]


    # Grey-cheeked Green Pigeon Treron griseicauda 25cm

    Indonesian name: Punai Penganten


    Appears as a yellowish-green pigeon with a grey head and either a green back in
    the female or a maroon back in the male. Both sexes have a bare green-coloured
    skin patch around the eye and a grey forehead. The blackish flight feathers edged
    with yellow. The central tail feathers are green with darker outtail feathers
    showing a greyish subterminal bar. The undertailcovers are chestnut in the male
    but paler in the female. The male''s bill is yellow with a green cere, unlike
    the green bill of the female. The legs are red.


    Where to see: Endemic to Bali and Java. Found high in the trees in lowland forests,
    sometimes with other pigeons in fruiting trees; sometimes close to human habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_28_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_28_1.png)'
  - '[PAGE 29]


    # # Pink-necked Green Pigeon Treron vernans 27cm

    Indonesian name: Punai Gading


    This small green pigeon is distinguished from similar pigeons by a grey tail with
    black band and pale grey tip. The male has a blue-grey head merging with pink
    to orange on the lower breast; the abdomen is green and yellow, the back and wings
    green. The female is green, brighter colours, but identified by tail pattern and
    keeping company with the distinctives male. Its calls a ‘cooing’ whistle and when
    feeding, a series of crow-like rasps.


    Where to see: Common throughout the region in lowland and coastal forest and mangrove,
    and in more open countryside. It becomes very conspicuous when trees are fruiting.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_29_0.png)


    # # Black-backed Fruit Dove Ptilinopus cinctus 38–44cm

    Indonesian name: Walik Putih


    A very distinctive black-and-white fruit pigeon with yellowish belly and vent.
    The head and neck are greyish-white blending to pure white on the upper breast.
    A wide black bar separates the upper breast from the grey belly. The upperparts
    are very dark greenish-black blending into a dark grey-green tail with a grey
    terminal bar. The feet are red and the bill grey. Its flight is rapid, with fast,
    noisy wingbeats.


    Where to see: Found on Bali in moist subtropical lowland and montane forest, often
    feeding from fruiting trees.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_29_1.png)'
  - '[PAGE 30]


    # Pink-headed Fruit Dove Ptilopinus porphyreus 29cm

    Indonesian name: Walik Kepala-ungu


    The male''s head, neck and throat are a delightful purple-pink, fringed with a
    contrasting white band across the breast, then a greenish-black band followed
    by a grey expanse of belly leading into yellow undertail-covers. The upperparts
    are green, feet pink, bill pale green and the iris orange. Females have a dull
    pink forehead and face, the remainder of the head, neck and throat being green;
    and more obscure black and white chest bands.


    Where to see: Occurs throughout the region''s montane forests. Shy and inconspicuous.
    Occasionally it congregates in large numbers in fruiting trees


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_30_0.png)


    # Black-naped Fruit Dove Ptilopinus melanospilus 27cm

    Indonesian name: Walik Kembang


    This species has predominantly green upperparts, tail and lower breast with a
    yellow vent and red undertail-covers. The male has a pale grey head with a conspicuous
    black nape and yellow throat. It has red feet and a greenish-yellow bill. Females
    and juveniles have the head all green, with juveniles having obvious yellow feather
    edges. Usually detected by its resonant ow-wook-wook, ow-wook-wook call.


    Where to see: Locally common in the lowland and high forests of Java and Bali
    and irregularly on Sumatra. Seldom seen except when it congregates in flocks at
    fruiting trees.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_30_1.png)'
  - '[PAGE 31]


    # # Green Imperial Pigeon Ducula aenea 42cm


    Indonesian name: Pergam Hijau


    Head, neck and underparts are soft pinkish-grey, with chestnut undertail-covers.
    The upperparts are green with a bronze iridescence. It has a dull red base to
    the blue-grey bill, and dark red feet.


    Where to see: This is the commonest pigeon of the region''s lowland rainforest.
    Inhabits riverine forest and coastal mangroves, where it prefers to live high
    in the treetopsop, feeding on figs, nutmeg and other small fruits.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_31_0.png)'
  - '[PAGE 32]


    # Mountain Imperial Pigeon Ducula badia 43–50cm

    Indonesian name: Pergam Gunung


    Distinguished by its large size and dark maroon-brown parts with light vinous-grey
    head, neck and underparts. The throat and crown are whitish in adults.


    The tail is grey with a broad lighter terminal band and undertailcovers are buffish-white.
    Legs and feet are grey, the bill dark red and the grey or white iris is surrounded
    by dark orbital skin. Juveniles are duller with less warm colouring. Not to be
    confused with the Dark-backed Imperial Pigeon (D. lacunulata) on Java, which has
    a well-defined grey crown and sides to the head.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_32_0.png)


    Where to see: Occurs in the montane forests of Sumatra and West Java.


    # Pied Imperial Pigeon Ducula biber 35–42cm

    Indonesian name: Pergam Laut


    This is a striking bird, mainly creamy to ivory-white, with black flight feathers
    and tip of tail. The bill and feet are blue-grey. Immatures are greyer. Hunting
    has decimated the population of this beautiful pigeon, particularly on Java and
    Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_32_1.png)


    Where to see: More often in coastal forests and mangrove, it sometimes congregates
    in substantial breeding colonies in areas where fruiting figs are readily available.'
  - '[PAGE 33]


    # Javan Coucal Centropus nigrorufus 46cm

    onesian name: Bubut Jawa


    Javan Coucal has a black back, inner secondaries and wing-coverts with chestnut-brown
    outer primaries and


    primary covers. Otherwise all black with a distinct purplish sheen, even its tail.
    The bill and legs are black in size it is midway between the Greater Coucal and
    Lesser Coucal and can be separated from them by the black back and some wing feathers.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_33_0.png)


    Where to see: Endemic to Java. Uncommon. Usual habitat is mangrove forest, swamland
    and dry shrubland and Alang-alang grassland around the coast.


    # Greater Coucal Centropus sinensis 47–53cm

    Indonesian name: Bubut Besar


    This large, bluish-black, crow-like bird with chestnut-brown wings and back, and
    long, wide tail is most likely to be seen lumbering in small trees and bushes,
    hiding away in thickgrowth. The bill and feet are black and the iris brown. Females
    are similar to males but juveniles are lightly barred buff and brown overall.
    Its eerie, far-reaching, low-pitched call starts with a series of poop, poop,
    poop sounds, increasing in tempo then slowing again, but occasionally a series
    of just four deep monotonous poop, poop, poop sounds are made.


    Where to see: Throughout the region, where it prefers forest edges, grassy banks,
    secondary scrub and even village gardens and cultivated land.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_33_1.png)'
  - '[PAGE 34]


    # Lesser Coucal Centrus bengalensis 31–35cm

    Indonesian name: Bubut Alang-alang


    One of the smaller coucas, having a very long toe claw. It has dark plumage, mainly
    black with rufous wings and a long black tail. In breeding plumage the head and
    upper back are shiny with dark feather shafts, but at other times it is duller
    and the feather shafts appear whitish. This feature extends to the wing-covers,
    which have an appearance of white-streaked brown feathers. Juveniles have red-brown
    barred underparts, with feather shafts appearing buffish-white, the underparts
    are buff and undertail-covers barred black.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_34_0.png)


    Where to see: Occurs throughout the region, mainly in open lowland marshy areas
    among Alang-alang grasses and low tree cover.


    # Chestnut-breasted Malkoha Phaenicophaeus curvirostris 42–50cm

    Indonesian name: Kadalan Birah


    Easily recognised by its large, curved bill; the upper mandible is pale yellow
    and lower mandible brownish-red or black. There is a patch of red skin around
    the eye. In the male, the iris is pale blue, but in the female it is yellow. The
    head is grey with a thin white supercilium and underparts and rump chest. Wings
    are dark green to dark blue and the feet dark grey to black. Juveniles have a
    yellow bill with partially black lower mandible.


    Where to see: Inhabits dense undergrowth of damp primary and mangrove forest throughout
    the region, usually feeding on small vertebrates, insects, small crustaceans and
    sometimes figs.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_34_1.png)'
