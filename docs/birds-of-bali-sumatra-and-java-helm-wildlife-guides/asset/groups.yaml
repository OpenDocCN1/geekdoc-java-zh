    ## 紫苍鹭 Ardea purpurea 75–90cm

    印尼语名称：Cangak Merah


    这种鸟的高度与灰苍鹭相似，但体态更优雅、更纤细，姿态也不那么佝偻。通过其较深的下腹部以及带有黑色条纹的赤褐色颈部和上胸部，可以将其与其他体型的鹭类轻松区分开来。背部和翅膀呈灰紫色，散落着长长的赤褐色装饰羽毛。它有黄褐色的喙、红褐色的腿和黄色的虹膜。幼鸟的羽色较单一呈褐色，背部条纹较少，喙和腿为褐色。虽然它们较为行独，但会成群结聚在一起筑巢。


    **观赏地点：** 遍布整个地区典型的鹭类开放性栖息地，如稻田、沼泽、红树林和湖泊，且经常出现在内陆。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_72_0.png)


    ## 大白鹭 Ardea alba 80–104cm

    白鹭中体型最大的，喙更粗壮，颈部中间有一个奇特的弯结。繁殖期间，面部皮肤变为灰蓝色，额（窝）变为绿色，喙变黑，裸露腿部皮肤变为红色。在一年的其他时候，面部皮肤呈暗黄色，喙为黄色（偶尔尖端为黑色），脚和腿均为全黑色。幼鸟的喙为黄色且尖端带黑。


    观赏地点： 遍布整个地区，偏栖于泥滩、红树林和沿海湿地，以及稻田。它们在这些地方以单只或成小群的形式出现，捕食小鱼和蛙。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_73_0.png)


    ## 中白鹭 Ardea intermedia 64–72cm

    印尼语名称：Kuntul Perak


    其体型介于大白鹭和小白鹭之间，但并不常见。其特征是全身略微偏白的羽毛，没有头羽，但背部和胸部有长羽，且仅眼睛前方有裸露的黄色面部。与小白鹭不同，它的喙是黄色的且尖端带黑。


    通过其光滑、无条纹的颈部可以与体型更大的大白鹭区分来。


    观赏地点： 遍布整个地区。可以在稻田、红树林、沼泽以及沿海泥滩发现它的身影，但可能经常出现在内陆。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_74_0.png)


    ## 小白鹭 Egretta garzetta 55–65cm

    印尼语名称：Kuntul Kecil


    比牛白鹭更大也更纤细，拥有灰黑色的腿和黑喙。通常羽毛呈亮丽全白色，在繁殖季节，胸部、背部和颈后部会长出长长的垂状装饰羽，并有一块小小的脏黄色裸露面部斑。亚洲迁徙亚种的特征是脚趾为黄色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_75_0.png)


    观赏地点： 遍布整个地区，主要出现在沿海低地的混合白鹭群中、稻田、河流泥滩和沙洲，以及伴有小溪的地方。它们在繁殖群群和夜间栖息地与其他鹭类和白鹭自由混群。


    ## 太平洋环礁鹭 Egretta sacra 58–66cm

    印尼语名称：Kuntul Karang


    太平洋环礁鹭有两种体色。常见的品种具有均匀的灰色羽毛，颈部短而粗，下巴极浅，深黄色的喙和绿色的腿。不常见的是白色品种，看起来像牛白鹭，但体型大得多，头部和颈部更流线。它还有较短的绿色腿和脏黄色的喙。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_75_1.png)


    观赏地点： 遍布整个地区，通常局限于沿海，在不在水边捕猎时会停在岩石和悬崖上。更常见于离岸岛的沙滩和礁石。


    ## 牛白鹭 Ardea ibis 45–55cm

    印尼语名称：Kuntul Kerbau


    灰白色的鹭，额头有时带橙色。在繁殖羽色下，胸部、头部和颈部会泛出一层橙色，并有黄橙色的喙、腿和脚趾。更圆的额头、短身体、短颈部以及短粗的喙将其与其他鹭类区分开来。它们群居筑巢和栖息。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_76_0.png)


    观赏地点： 整个地区常见，见于稻田和淡水沼泽地区。它们还会被放牧的牛吸引，捕食被牛惊扰的昆虫。在巴厘岛的Petulu村，一个大型的夜间栖息地受到信仰的保护，人们认为这些鸟载着1966年反共主义屠杀中遇死的巴厘岛人的灵魂。


    ## 爪纹池鹭 Ardea speciosa 45cm

    印尼语名称：Blekok Sawah


    这种鹭通常呈现深褐色，带有浅褐色条纹，尾部和下腹部为黄褐色，翅膀为白色。在繁殖羽色下，颈部和头部变成金褐色。它有黄褐色的喙和黑色的脚。


    ![](img/e8dcc79b9f6b63c1dff9f174c158e29_76_1.png)


    观赏地点： 遍布整个地区，出现在淡水湿地和稻田中，但可能经常出现在内陆。


    ## 黑冠夜鹭 Nycticorax ax 60cm

    印尼语名称：Kokak


    这种体型粗壮的鹭拥有栗褐色的背部、橄绿色的腿和短粗的喙，具有黑色的冠部，颈部和下腹部为白色，尾部有长羽毛。幼鸟颜色较深且有斑纹。


    观赏地点： 遍布整个地区，出现在内陆的淡水湿地、稻田和沼泽中。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_77_0)


    ## 纹鹭 Butides striata 35–48cm

    印尼语名称：Kokokan


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_77_1)


    常见的品种具有均匀的灰色羽毛，短而粗的颈部，下巴极浅，深黄色的喙和绿色的腿。不常见的是白色品种，看起来像牛白鹭，但体型大得多，头部和颈部更流线。它还有较短的绿色腿和脏黄色的喙。


    ## 马来夜鹭 Gosachius melanopholus 47–50cm

    印尼语名称：Kokak Melayu


    这种结实的鹭拥有栗褐色的背部、橄绿色的腿和短粗的喙。幼鸟呈深褐色且有斑纹。它们的下腹部为白色。


    观赏地点：  遍布整个地区，偏好茂密的植被，特别是在芦苇、草地和淹没湿地。


    ## 火火鹭 Plegadis falcinellus 55–66cm

    印尼语名称：Ibis Rokoko


    该地区唯一深色羽毛的朱嘴，呈黑褐色，带有绿色和紫色的光泽。它的腿是深色的，长弯喙也是。


    观赏地点： 出现在爪哇腊和巴厘岛，通常以小群形式出现在稻田和湿地。它们在夜间栖息地和繁殖群与其他鹭和白鹭混群。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_79_1)


    ## 黑头朱 Threskornis melanocephalus 65–75cm

    印尼语名称：Ibis Cucukbesi


    几乎全白的身体与黑色的头部、颈部以及有力的黑喙形成对比。长腿也是黑色的。尾部的装饰羽为浅灰色，少量的装饰羽为白色。


    **观赏地点：** 罕见于苏门答腊和爪哇北部，出现在淡水湿地、湖泊和河流旁、淹没草地和稻田。偶尔与放牧的牛在一起。


    ## 黑翅红隼 Elanus caeruleus 30–37cm

    印尼语名称：Elang Tikus


    因其肩部的黑色斑块以及在攻击猎物前经常像��一样悬停而命名。飞行时，这种优雅的猛禽可能被误认为是海鸥。它灰色的背部和白色下腹部，加上长黑色初级和方形尾巴，可能会令人困惑。它的红眼睛周围有黑色圆圈。


    **观赏地点：** 遍布整个地区，偏好开阔的乡村和稀疏森林的干旱地区、森林边缘以及农耕区。偶尔栖息在暴露的树枝和电线杆上。


