    \ appear more iridescent bronze on the upperparts. They show more yellow on the\
    \ legs and the iris is much paler.\n\n![](img/e8dcc79b99f6b63c1dff9f174c158e29_36_2.png)\n\
    \nWhere to see: Occurs throughout the region. Found at lowland forest edges. Uncommon.\n\
