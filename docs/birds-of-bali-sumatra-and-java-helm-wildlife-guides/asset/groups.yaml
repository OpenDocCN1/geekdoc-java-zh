    # Cinnamon Bittern Ixobruchus cinnamameus 40–41cm

    Indonesian name: Bambangan Merah


    Adult males have bright cinnamon-brown upperparts and orange-buff underparts are
    streaked black on the centre of the belly and along the upper flanks. The sides
    of the long neck are streaked dirty white. Females and immatures appear darker,
    with a black cap, and immatures have a more mottled appearance. One of the smaller,
    more timid bitterns of the region. When disturbed, it rises from cover with a
    croaking alarm call and flies off with slow, powerful wingbeats.


    Where to see: Occurs throughout the region, living in grassland, freshwater swamps
    and rice fields. Common.


