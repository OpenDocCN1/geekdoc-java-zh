    white undertail-covers and a line of black-edged white feathers showing the folded
    wing. The head and neck are a paler brown, and there is a dark brown elongated
    cap running down the back of the neck. The legs are blackish-brown and bill black.
    This bird emits a series of high-pitched whistling and twittering calls in flight.


    **Where to see:** Rivers, freshwater lakes, wet marshland, coastal wetlands and
    mangrove wetlands throughout the region.


    ## Cotton Pygmy-goose Nettapus coromandelianus 30–35cm


    Indonesian name: Trutu Kapas


    A small black-and-white duck, the male being predominantly white, with iridescent
    black plumage on the crown, back, wings and tail and a black neck-band. The female''s
    plumage is more subdued, being buffish-white where males are white, and brown
    where males are black; she has a brown eye-stripe and lacks neck-band. In flight,
    males show a white wing patch.


    **Where to see:** Throughout Java, Bali and northern coastal wetlands of Sumatra
    marshland and lakes, flooded paddyfields and grassland. Scarce. Unlike most wildlife,
    this species regularly perches in trees and normally nests in tree holes.


    ## Garganey Spatula querquedula 37–41 cm


    Males in the region are usually in eclipse plumage looking like females. They
    have brown-barred feathers and a contrasting head pattern, with pale eyebrow,
    dark eye-stripe, and plain white throat. Neck and breast are reddish-brown flecked
    white. It has a green upperwing speculum with a white border above and below.
    The elongated scapular are striped grey, dark green, black and white, and the
    upperwing-coverts are light blue-grey. The flanks are finely patterned grey and
    the belly is white.


    The bill is blackish-grey, the eyes reddish-brown and legs feet greyish.


    **Where to see:** Occurs throughout the region, but scarce; on marshland, freshwater
    lakes, rice fields, coastal salt-marshes, mudflats and inshore waters.


    ## Pacific Black Duck Anas superciliosa 47–60cm


    Indonesian name: Itik Alis


    The name ‘black duck’ is a misnomer, as the bird’s body plumage looks black only
    in flight when contrasting with the conspicuous white underwing plumage.


    It is actually dark brown, with the head black and white. The speculum is iridescent
    green and purple, the legs yellow-brown and the bill grey.


    **Where to see:** Occurs throughout the region but is less frequent on Sumatra.
    It is a surface-feeding duck which dabbles in shallow water. Confined to mountain
    lakes of East Java and Bali, but often found feeding on marshes and grassland.


    ## Roulrou Rollulus rouloul 25cm


    Indonesian name: Puyuh Sengayan


    The very distinctive male sports an ostentatious tufted, spiky red crest above
    a white crown patch. His overall plumage is blackish-blue with a purple sheen,
    shaded towards the tail; the wings are dark red-brown. Females lack green body
    and a grey head; the wings are dark chestnut. They have red legs and bare red
    skin around the eye. The bill is black, with males more red at the base.


    **Where to see:** Lowland peat bogs and hill forests of Sumatra, where it congregates
    in family groups, foraging for seeds, insects and fallen fruit.


    ## Chestnut-bellied Partridge Arborophila javanica 27cm


    Indonesian name: Puyuh-gong Jawa


    Endemic to Java, each subspecies has a different head pattern of reddish-buff
    with black markings and a black collar. The breast is grey through chestnut to
    a white vent. The flanks are chestnut, the back and tail grey-brown and barred
    black, and wings brown with black barring and small white spots. The legs are
    red and the bill blackish.


    **Where to see:** Occurs in clearings in montane forests on Java, usually in pairs
    but occasionally in small groups, foraging amongst undergrowth.


    ## Great Argus Argianus arg male 160–200cm, female 70–75cm


    Indonesian name: Kuau Raja


    One of the most spectacular of the region''s pheasants, particularly the males
    with their extraordinarily secondary and tail feathers used in their mating display.
    With tail raised high and wings spread wide, the beautiful patterning of green
    ‘eye’ marks (ocelli) is spectacular. Plumage is otherwise mainly chestnut-brown,
    broken and patterned by spots and flecks of buff and black. The female is generally
    darker, shorter wings and tail, and lacks the male’s eye spots. Both sexes have
    a short, dark brown crest and rare bare blue skin on the head and neck.


    **Where to see:** Undisturbed primary rainforests of Sumatra. Often a single male
    accompanied by several females.

