    # BIRDWATCHING


    For most of us, birdwatching is really putting a name to a bird, but there is
    so much more to be gained from more detailed study. Behaviour, life cycles and
    interaction with the environment are fascinating subjects which not only give
    us enormous enjoyment but we can also add much to our knowledge of the world around
    us.


    Initially, however, identification must be the priority. We should consider all
    the clues available and, ideally, identify not just the species but also its sex,
    age and race. There are many clues to go on, and by combining them we narrow the
    possibilities down until our problem is solved. We all accept the value of visual
    clues, but we neglect the importance of sound until we become more experienced.
    For the seasoned birdwatcher, a sound recorder is just as important as part of
    his her kit as a notebook, binoculars, telescope and field guide. That important
    call can often be identified later in the day.


    # Birdwatching aids


    Whatever equipment you take, it should be well protected from the ravages of the
    weather. Rain and high humidity provide the worst conditions for cameras, binoculars
    and electronics. Any equipment should be kept dry and well aired and, if possible,
    stored with a bag of silica-gel desiccant to protect against fungal attack. It
    is astonishing how much damage can cause if inadequate precautions have been taken.


    Ideally waterproof binoculars are recommended, particularly if you are going to
    venture into wet and humid areas, but for general, the not too expensive kind
    are perfectly adequate for most observation. For the more serious birder, there
    are many other professional-style binoculars to choose from, as well as spotting
    scopes for more distant observation.


    For sound recording, it is possible to use a smartphone for close-up sounds, but
    for better reproduction, use the compact, lightweight and reasonably priced Olympus
    recorders, such as the LS-P5. For more distant birds, an added external parabolic
    microphone is preferred to a directional ‘gun’ microphone if you really need good
    recordings.


    As cameras, they are not recommended for regular birdwatching trips, not only
    because of the detrimental effect of the weather on equipment, but also because
    it is almost impossible to concentrate on both activities at once, particularly
    in a group situation.


    It is fortunate that many of the good birdwatching areas are accessible by car.
    Also, there is always public transport and, except on Bali, at the end of'
