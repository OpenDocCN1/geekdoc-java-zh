    ## 黑顶眼镜雀 Zosterops atricapilla 9.5–10cm


    印尼语名称：Kacamata Topi-hitam


    这种小型眼镜雀的背部整体为实色橄榄绿色，在冠部、额头、眉间变为黑色，眼周有一圈白色。白色的眼环被前方的一处黑斑断开。褐色的翅羽和尾羽也有橄榄绿色的边缘。背部的橄榄绿色变得偏黄，下方明黄色的尾端覆羽延伸至胸下部，形成宽宽的条纹，两侧为深灰色的腹部。喉部和胸前区域为柠檬绿色。喙呈褐色和黑色，腿为灰色。


    观赏地：分布于苏门答腊的低山森林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_160_0.png)


    ## 黄腹眼镜雀 Zosterops chloris 11–12cm


    印尼语名称：Kacamata Laut


    这种小型眼镜雀的冠部、背部和翼覆羽呈暗绿色，而上覆羽为黄绿色。腹部为浅黄色，喉部和尾端覆羽颜色更亮。眉间有一处小的黄色斑块，黑色的眉间延伸至不完整的白色眼环下方，直至绿色的耳羽。尾羽和翅羽为黑色，边缘带绿色。喙上部为黑色，下为灰色，腿为灰色。


    观赏地：分布于爪哇岛西部和巴厘岛的努萨佩达岛的各种栖息地，从森林到红树林甚至是耕园地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_160_1.png)


    ## 栗冠画鹴 Timalia pileata 15–17cm


    特征是其面具面般的外观和长尾巴。身体主色背部为暖色橄榄棕色，下部为褐色并带有细密的黑色条纹。头部更为引人注目，有亮亮的栗色冠部，并衬有白色的额头和眉纹。下巴、喉部和颈部为白色，耳羽为白色，向脑后变为浅灰色。强壮的喙黑色，虹膜和腿为深褐色。


    观赏地：这种画鹴栖息在灌丛和沼泽地区，通常与其他画鹴类在一起，分布范围从爪哇岛西部一直延伸到巴厘岛。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_161_0.png)


    ## 纹眉丝嘴鹴 Mixornis gularis 11–12cm


    印尼语名称：Ciung-air Melayu


    这种小型丝嘴鹴的背部均为栗棕色，包括尾巴。腹部（尤其是胸部）在黄绿色底色上有明显而细密的黑色条纹，下腹和尾门处变为白色。爪哇岛的鸟类腹部更偏灰。头部侧面为灰色，有时带有黄色，有浅色眉纹。喙为棕色，腿为蓝灰色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_161_1.png)


    观赏地：苏门答腊低地的常见鸟类，成小群觅食在茂密的丛林、灌木丛（尤其是竹林）以及阔叶林的的次生林中。


    ## 金嘴鹴 Cyanoderma chrysaeum 10–12cm


    金嘴鹴具有橄榄绿色的背部，冠部为暗黄色并有细纹。腹部喉部为黄褐色，侧腹变为灰色，尾门处为褐色。尾巴和上翅羽为带橄榄色的灰色，翅羽边缘隐约带橄榄绿。深褐色虹膜周围环着深灰蓝色的眉间皮肤，延伸成一条短的黑色下颏纹。耳羽为黄灰色，喙上为黑色，下为黑色粉红色，腿为浅褐色。


    观赏地：分布于苏门答腊的山林。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_162_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_162_1.png)


    ## 月胸斑嘴鹴 Cyanoderma melanothorax 13cm


    印尼语名称：Tepus Pipi-perak


    背部颜色随亚种而异，从栗色到暗橄榄棕不等。腹部为白色至灰白色，腹部变为灰色或沙褐色，胸上部有一道黑色月形纹。耳羽为橄榄灰至灰色，下方有一条黑色颊纹。眉纹为浅灰色，腿和喙为棕色。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_163_0.png)


    观赏地：分布于爪哇和巴厘岛的森林。


    ## 爪哇弯嘴鹴 Pomatorhinus montanus 21cm


    印尼语名称：Cica-kopi


    这种鸟有引人目的黑色头部和长弯喙，喉部和胸部为白色。腹部和尾门为栗色，背部和尾巴为灰褐色。腿为灰色，虹膜为深红褐色。


    观赏地：分布于爪哇的山林。


    ## 黑弯嘴鹴 Melanichla lugubris 25cm


    印尼语名称：Cica-hitam


    这种弯嘴鹴大部分为黑色，仅喉部和胸前为白色，眉为浅黄色。背部为深色，腹部为灰褐色。腿为灰色，虹膜为深红褐色。


    观赏地：分布于苏门答腊的低地森林。


    ## 白胸斑鹴 Stachyris thoracaca 18cm


    印尼语名称：Tepus Leher-putih


    这种斑鹴有深黑色冠部，喉部和胸前为白色。背部为橄榄褐色，腹部为灰色。腿为棕色，虹膜为深红褐色。


    观赏地：分布于爪哇。亚种 *thoracica* 分布在爪哇西部。


    ## 爪哇黑顶斑鹴 Pellorneum capistatum 16–17cm


    印尼语名称：Kepod-Jawa


    这种斑鹴有黑色顶头，喉部和胸前为白色。背部为橄榄褐色，腹部为灰色。腿为棕色，虹膜为深红褐色。


    观赏地：分布于爪哇的低地森林。亚种 *capistatum* 分布在爪哇，*P. c. capistatum* 分布在苏门答腊、爪哇西部和巴厘岛。


    ## 亚洲斑嘴鹴 Malacoccincla abbotti 15–17cm


    印尼语名称：Pelanduk Asia


    与菲氏斑嘴鹴相似，亚洲斑嘴鹴体型较小，呈褐色，其特征是颜色更浅且尾巴更长。背部为棕橄色，臀部为浅栗色。腹部喉部为灰白色，胸部为浅绿色，尾端覆羽为红褐色。头部侧面为灰褐色，有浅灰色的眉纹。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_166_0.png)


    观赏地：苏门答腊低地的常见鸟类，爪哇也有记录，但巴厘岛缺失。


    ## 菲氏斑嘴鹴 Malacoccincla sepiaria 15–16cm


    印尼语名称：Pelanduk semak


    这种斑鹴有深灰褐冠部，背部为暖赭棕色，臀部和尾巴变为栗色。侧腹和尾门也是栗色，而喉部和腹部为白色，胸部为灰色。它有强壮的灰黑色喙和红褐色虹膜。与亚洲斑嘴鹴的区别在于冠部更深、更灰。这种吵闹的小斑鹴发出单调且重复的叫声“pee-o-eel
    pee-o-eet”，特别是在清晨和傍晚。


    观赏地：该地区当地常见的留鸟，栖息在丘陵和山地森林密密的植被和矮矮丛中。亚种 *M. s. sepiaria* 分布在爪哇和巴厘岛，*M. s. barrussana*
    分布在苏门答腊。


