    鸸的下部、下背部和臀部为亮黄色，尾下覆羽呈白色。上部全黑，除了宽大的白色眉纹以及翅覆羽和三缘羽上的白色区域外。喙为黑色，下方呈灰蓝色；腿为黑色。雌性从冠部到黄色上尾覆羽为橄榄灰色。下部下巴为白色，向胸部变为淡黄色，在泄门处再次变为白色。


