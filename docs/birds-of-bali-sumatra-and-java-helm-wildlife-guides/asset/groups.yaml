  - '[PAGE 130]


    # White-bellied Fantail Rhipidura euryura 18cm


    Indonesian name: Kipasan Bukit


    Males and females have very similar plumage; predominantly dull-grey overall but
    below the mid-belly it is white. There is a broad white supercilium and the outer
    tail feathers are tipped white. Bill and legs are black and the iris dark brown.


    Where to see: Occurs in Java''s dense montane forests, often in small groups with
    other species, foraging for small flying insects.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_0.png)


    # Black Drongo Dicrurus macrocercus 25–30cm


    Indonesian name: Srigunting Hitam


    This drongo has black plumage with slight iridescence and a long, deeply forked
    tail with outer feathers which tend to turn outwards at the tips. Juveniles show
    pale grey barring on the underparts. Unlike most other drongos, favours open country
    and often associates with cattle, which disturb insect prey.


    Where to see: Occurs on Java and Bali. Frequently seen in open scrub, cultivated
    land and rice fields, perching on fencing, isolated branches and telephone wires
    alongside roads.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_130_1.png)'
  - '[PAGE 131]


    # Ashy Drongo Dicrurus leucophaeus 26–29cm


    Indonesian name: Srigunting Kelabu


    This drongo has the typical long, forked tail and upright stance. Its plumage
    is light blue-grey, with a tuft of black feathers at the base of the upper mandible.
    The subspecies in the region all vary in their grey colouring. Sumatran birds
    occasionally have a white loral spot, with those in north Sumatra being a little
    darker. Usually observed in pairs waiting on exposed branches to swoop on large
    passing insects.


    Where to see: Occurs throughout the region. A bird of open woodland and forest
    edge and clearings.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_131_0.png)'
  - '[PAGE 132]


    # Crow-billed Drongo Dicrus annectensens 27–30cm


    Indonesian name: Srigunting Gagak


    This sturdy elegant drongo has a strong, broad bill, well adapted to taking aerial
    insects in flight. The base of the bill is hidden by a layer of short feathers.
    The head is black and the remainder of the upperparts glossed black with a bluish
    iridescence. The underparts are black, often spotted white. The long, blackish,
    forked tail the outer feathers curved outwards. Legs and bill are black and the
    iris dark red.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_0.png)


    Where to see: Occurs as a migrant on Sumatra and West Java, frequenting wooded
    lowland and hills.


    # Javan Spangled Drongo Dicrus jentincki 27–29cm


    Indonesian name: Srigunting Jawaut


    This unusual drongo has a peculiarly fork-shaped tail, the outer feathers spreading
    outwards and upwards almost into a lyre shape. It also has an extraordinary crest
    of long, hair-like feathers from the front of the crown, but this feature is variable.
    It has a very pale buff eye. The general plumage is glossy black with an iridescent
    spangling, particularly on the crown and upper breast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_132_1.png)


    Where to see: Occurs in East Java and Bali. It is common in open areas of lowland
    and submontane forests.'
  - '[PAGE 133]


    # Lesser Racket-tailed Drongo Dicrurus remifer 25–28cm


    A spectacular, big, glossy-black drongo with a square-ended tail and extended
    outer tail-streamers almost 50cm long. Each streamer feather shaft terminates
    in an elongated oval web around 10cm long. A substantial tuft of short black feathers
    covers the base of the upper mandible, creating a long-headed appearance. It is
    smaller than the Greater Racket-tailed Drongo, has no frontal crest, and has no
    fork in the tail.


    Where to see: Occurs in West Java and the Barisan Range and Batak Highlands of
    Sumatra. Inhabits dense montane forest and secondary forest, especially at edges.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_133_0.png)'
  - '[PAGE 134]


    # Greater Racket-tailed Drongo Dicrurus paradiseus


    30cm plus 35cm tail rackets Indonesian name: Srigunting Batu


    This large, forked-tailed drongo has beautifully extended outer tail feathers
    terminating in spirally twisted rackets on the outer edge of the shafts. Its forked
    tail easily separates it from the Lesser Racket-tailed Drongo. Plumage is glossy
    black, and adults often display a short frontal crest on the crown. The bill and
    legs are black.


    Where to see: Occurs throughout the region. Usually found in pairs, often hawking
    for insects in glades in swamp, primary and secondary forests and in mangroves.
    It remains a common bird of the lowland forests of Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_134_0.png)'
  - '[PAGE 135]


    # Black-naped Monarch Hypothymis azurea 15–17cm

    Indonesian name: Kehicap Ranting


    A beautiful flycatcher with an azure blue head and back. The male has a short,
    erect black crest and a thin black band above and below the bill. A narrow black
    band extends


    across the upper breast, with a grey belly paling to a white vent. Wings are grey,
    tail blue-black, bluish tipped black, iris dark brown and legs-grey. Females and
    juveniles are duller and greyer and lack the male''s black markings. Small colour
    variations occur: Sumatran birds are more grey-blue, on Java and Bali males are
    pale blue and females have greyish-blue upperparts, and over Nusa Penida Island,
    Bali, females have a more bright-blue head.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_135_0.png)


    Where to see: Occurs commonly throughout the region''s forests, edges and scrubland.


    # Amur Paradise-flycatcher Terpsiphone incei

    males: 20–25cm, females: 18–21cm Indonesian name: Seriwang Utara


    Occurs in two colour forms: red and, much less common, white. In red form, upperparts
    and upwing down to the tail are rich chestnut. The upper breast is pale grey shading
    to white at the belly and vent. The bill and legs are grey and the iris brown,
    encircled by pale blue bare skin. The red-form male has a long chestnut tail and
    complete glossy-black head, including a nuchal crest. The white form is similar
    to Blyth''s Paradise-flycatcher but shows less black on the edges of the primaries.
    The female''s plumage is very similar, but has a shorter tail.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_135_1.png)


    Where to see: A scarce overwintering species of scrubland and forest edge, occurring
    on Sumatra and West Java.'
