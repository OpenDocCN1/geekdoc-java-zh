    # Black Baza Aviceda leuphotes 28–35


    Indonesian name: Baza Hitam

    Identified as a small, thickset, black hawk with a pointed long crest with white
    and reddish-brown patches. The underparts have blackish-brown bars across the
    upper breast becoming reddish towards the vent. The neck is black, the iris red-brown
    and legs grey-black. In flight the primaries appear white, tipped black and the
    secondaries grey-brown. Juveniles are very similar but duller and browner.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_81_0.png)


    Where to see: Occurs as a winter visitor to Sumatra and Java.


