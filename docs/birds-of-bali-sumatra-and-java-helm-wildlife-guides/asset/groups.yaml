    ![](img/e8dcc79b99f6b63c1d99f174c158e29_31_0.png)## 山鸽 Ducula badia 43–50cm

    印尼语名称：Pergam Gunung


    以其体型、栗棕色的背部以及浅灰色的头部和下腹部为特征。尾巴有宽带，尾下覆为白色。脚为灰色，喙为深色。


    何处可见：苏门答腊的山区森林。## 斑纹绿鸽 Ducula biber 35–42cm

    印尼语名称：Pergam Laut


    外观呈黄绿色的鸽子，头部为灰色，雌性背部为绿色，雄性背部为栗色。两性眼睛周围都有裸露的绿色皮肤斑块，额头为灰色。黑色的飞行羽边缘带有黄色。中央尾羽为绿色，末端尾羽颜色较深，显示出灰色的亚末端带。尾下覆在雄性为栗色，雌性则较浅。雄性的喙为黄色并带有绿色的蜡膜，与雌性的绿色喙不同。腿为红色。


    何处可见：爪哇岛的沿海森林。


    ![](img/e8dcc79b99f6b63c1d99f174c158e29_32_0.png)## 爪哇鹃 Centropus nigrorufus 46cm

    印尼语名称：Bubut Jawa


    该物种背部、尾巴和下胸主要为绿色，带有黄色尾门和红色尾下覆。雄性头部为浅灰色，有明显的黑色后脑和黄色喉部。它们有红色的脚和绿黄色的喙。雌性和幼鸟的头部全为绿色，幼鸟有明显的黄色羽缘。通常通过其共鸣的“呜-wook-wook，呜-wook-wook”叫声来识别。


    何处可见：爪哇岛特有，常见于灌木丛中。## 大鹃 Centropus sinensis 47–53cm

    印尼语名称：Bubut Besar


    这种巨大的类乌鸦鸟具有栗棕色的翅膀和背部，经常在灌木丛中可见。它们有长喙和红脚。它的叫声是响亮且低沉的。


    何处可见：巴厘岛的低地森林。


    ![](img/e8dcc79b99f6b63c1d99f174c158e29_33_1.png)## 小鹃 Centrus bengalensis 31–35cm

    印尼语名称：Bubut Alang-alang


    较小的鹃类之一，拥有非常长的脚趾。羽毛颜色深，主要是黑色，带有红褐色的翅膀和长尾巴。繁殖期头部和上背部有光泽并带有深色羽缘，但在其他时期颜色较暗，羽缘呈白色。这一特征延伸到覆羽，覆羽带有白色条纹棕色羽毛。幼鸟有红棕色横纹下部，羽缘呈米白色，下部为浅褐色，尾下覆有黑色横纹。


    ![](img/e8dcc79b99f6b63c1d99f174c158e29_34_0.png)


    何处可见：遍布整个地区，主要在开阔的低地湿地，生长在芒茅草丛和低矮树木中。## 栗胸画鹃 Phaenicophaeus curvirostris 42–50cm

    印尼语名称：Kadalan Birah


    通过巨大的弯曲喙很容易识别；上喙为浅黄色，下喙为棕红色或黑色。眼睛周围有红色皮肤斑块。雄性的虹膜为浅蓝色，而雌性为黄色。头部为灰色，带有细白色眉纹，下部和臀部。翅膀为深绿色到深蓝色，脚为深灰色到黑色。幼鸟喙为黄色，下喙部分黑色。


    何处可见：栖于整个地区潮湿原始林和红树林的密林中，通常捕食小型脊椎动物、昆虫、小型甲壳动物，有时也吃无花果。


