    the journey of the ubiquitous motorbike-taxis known as ‘ojeks’. In the field,
    the energy-squeating heat and humidity are perhaps the biggest drawbacks. It should
    be unnecessary to advise here on hygiene and the need to carry sufficient bottled
    water. Keeping fit and healthy is extremely important, particularly in areas where
    medical facilities may be poor or non-existent. Do not forget to take essential
    medication with you, and always be prepared for stomach upsets. Remember, ‘Bali
    Belly’ is not confined to Bali. Insects can also be a problem at certain times,
    and insecticide sprays and creams could save you from some nasty bites. Suitable
    clothing is also essential, not as protection against the elements but also as
    a disguise. Lightweight, dull-coloured clothes are necessary. Visitors are recommended
    to carry a light poncho with a hood, and in lowland forests trousers are desirable
    for warding off leeches and stinging plants from making contact with your skin.
    Sturdy footwear is a must, although many people prefer heavy-duty sandals, particularly
    in wet conditions. Lightweight canvas boots are better than leather ones, which
    quickly become mouldy.'
