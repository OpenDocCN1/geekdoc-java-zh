  - '[PAGE 90]


    # Oriental Pied Hornbill Anthracoceros albirostris 55–60cm


    Indonesian name: Kangkareng Perut-putih


    Recognised by its mainly black plumage with a white lower breast, belly and flanks,
    this species also has white patches behind the eye and at the base of the lower
    mandible. The huge horn-coloured bill is surmounted by a banana-shaped casque
    marked black at the front end. Females have more black on the bill. The tail shows
    variable


    amounts of black and white, particularly on the outer feathers. Normally found
    in small parties. Utters loud, raucous and cackling laughs and chicken-like cackling,
    puk-puk-puk-uk.


    **Where to see:** Occurs in clearances and edges of more remote lowland and secondary
    forest, down to the coast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_90_0.png)'
  - '[PAGE 91]


    # # Wreathed Hornbill Rhyticeros undulatus 75–85cm


    Indonesian name: Julang Emas


    Apart from the whitish, often dirty yellow, tail and the male''s chestnut-crowned,
    creamy head, the plumage is black. The male has a bare yellow gular pouch of the
    black-headed female being blue. Like all hornbills, it relies on hollow trees
    when nesting, the male reducing the size of the entrance hole with mud while the
    female is incubating, and the female doing likewise after hatching until the young
    are ready to fledge.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_91_0.png)


    **Where to see:** Common in lowland and hill forests of Sumatra, it is confined
    to a few remaining undisturbed forests on Java and Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_91_1.png)'
  - '[PAGE 92]


    # Blue-eared Kingfisher Alcedo menintang 16–17cm


    Indonesian name: Raja-udang Menintang


    This woodland counterpart of the Common Kingfisher is very similar in its behaviour,
    moving between waterside perches in rapid flight. Blue-eared has a more contrasting
    appearance, its uppers being a darker but shinier blue and its underparts a bright
    orange-red. The ear-covers are blue, legs orange and the iris is dark brown. It
    dives into water to catch fish, which it kills by bashing it on the perch before
    swallowing it whole, head-first.


    **Where to see:** Occurs throughout the region, where it frequents forest rivers,
    streams, lakes and occasionally estuarine habitat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_92_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_92_1.png)'
  - '[PAGE 93]


    # Common Kingfisher Alcedo athis 16–17


    Indonesian name: Raja-udang Erasia


    This common kingfisher occurs all the way across Eurasia and to New Guinea. Upperparts
    are a shiny bright blue-green, with paler blue upper-covers and a small patch
    in the centre of the back. The underparts and ear-covers are rufous. There is
    a white stripe on the side of the neck. Feet are red, the bill black, the iris
    dark brown. The Bali subspecies A. a. floresiana has darker blue upperparts and
    a few blue feathers in the rufous ear-covers. In flight, it has a drawn-out, high-pitched
    call, tseeep, tseeep.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_93_0.png)


    Where to see: Occurs throughout the region, frequenting lowland open country with
    freshwater mangroves, rivers and lakes.


    # Stork-billed kingfisher Pelargopsis capensis 35cm


    Indonesian name: Pekaka Emas


    The largest kingfisher in the region, with an enormous red bill. Easily identifiable.
    The back, wings and tail are blue-green and the underparts pinkish-orange. The
    head is brown, becoming paler around the neck. It has short red legs. It feeds
    on fish, crabs and amphibians.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_93_1.png)


    Where to see: Occurs throughout the region, inhabiting coastal mangroves and lowland
    rivers and marshland, as well as cultivated land and woodland adjacent to rivers.
    It is now an uncommon resident, possibly extinct on Bali.'
  - '[PAGE 94]


    # White-breasted Kingfisher Halcyon smyrnensis 27–29cm


    Indonesian name: Cekak Belukar


    The white throat and ‘bib’ contrasting with the chocolate-brown head and underparts
    are distinguishing features of this large kingfisher. The underparts, tail and
    upper surfaces of the wings are iridescent mid-blue, and there is a patch of brown
    on the upperwing-coverts. A loud screaming call, ‘kee-kee-kee-kee’, announces
    the bird’s presence.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_94_0.png)


    **Where to see:** Occurs in Sumatra and West Java, by rivers and ponds in mainly
    lowland open areas and even along the coast.


    # Javan Kingfisher Halcyon cyanoventris 27cm


    Indonesian name: Cekak Jawa


    This dark-looking kingfisher is dark brown on the head, with a lighter collar
    and upper breast. The belly and hind collar are purplish-blue, the back and wing-coverts
    are dark purple. Flight feathers and tail are bright blue. The white wing patches
    are particularly conspicuous in flight. Both bill and feet are red. It is not
    reliant on fishing for its food, having adapted well to a diet of insects and
    terrestrial prey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_94_1.png)


    **Where to see:** Endemic to Java and Bali. Often seen on an isolated perch in
    open grassland, it remains near water where prey items are more abundant.'
  - '[PAGE 95]


    # Sacred Kingfisher *Todiramamphus sanctus* 22cm


    The upperparts are green tinted grey, including the forehead, crown, mantle and
    back. The rump is turquoise and the tail blue-green, darker on the outer feathers.
    The throat, lower cheeks and collar are warm buff to white which passes a black
    mask reaching narrowly across the nape. There is a buff to orange lateral spot.
    The flight feathers are black and upperwing-coverts blue-green. The breast is
    buff becoming pale chestnut on the undertail-coverts. The legs are black and bill
    blackish above and buff below at the base.


    Where to see: A migrant frequenting the mangroves, small lakes and coastal regions
    of Java and Bali, occasional to east Sumatra


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_95_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_95_1.png)'
  - '[PAGE 96]


    # Collared Kingfisher Todiramphus chloris 23–25cm

    Indonesian name: Cekak Sungai


    At first sight this species is bright blue and white, but at close range the blue
    of the crown, back, wings and tail has a brilliant green iridescence. It has a
    strikingly clean white collar and underparts. The lores are white, and a black
    stripe passes through the eye and around the back of the head. A very common kingfisher,
    as is evident from its continual calling throughout the day. Its harsh, noisy
    chue-chue-chue-chue-chue carries over long distances.


    Where to see: Occurs throughout the region. It prefers open country around the
    coast and wherever there is water in which to fish.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_96_0.png)


    # Blue-tailed Bee-eater Merops philippinus 30cm

    Indonesian name: Kirik-kirik Laut


    The uppersparts of this colourful beeater are green from the crown to back leading
    to a beautiful pale-blue rump and tail. The underparts are blue-green from below
    the yellow chin to the blue undertail-coverts. It has a wide black eye-stripe
    outlined by a thin line above and below. The throat and cheeks are red tinged
    brown. The bill is black, the iris ruby-red and feet grey-brown.


    Where to see: Occurs throughout Sumatra and Java. More often found in open areas
    near water.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_96_1.png)'
  - '[PAGE 97]


    # Common Dollarbird Eurystomus orientalis 27–30cm


    Indonesian name: Tiong-lampu Biasa


    Overall, it appears dark bluish-brown with an upright stance, with a large head,
    solid orange-red bill and blue throat. In flight, two circular light-blue contrasting
    patches on the underwingcovers are evident, giving the bird its English name.
    Immatures are duller and lighter with blackish bills.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_97_0.png)


    Where to see: The only member of the roller family to be seen throughout the region.
    Widespread but not common; usually singly or in pairs. Hunts from exposed perches
    in open country by swooping on its insect prey.


    # Coppersmith Barbet Psilopogon haemacephal 15–17cm


    Indonesian name: Takur Ungkut-ungkut


    A drawn-out, resonant tonk-tonk-tonk call, reminiscent of a vibrating hammer on
    metal, announces this bird’s presence. The back, wings and tail are green, with
    fawn underparts streaked black. Those found on Java and Bali have a red crown,
    chin, and cheek; those on Sumatra have the throat, cheek and eyebrow yellow. A
    thin black necklace separates the red and yellow neck markings. The legs are red.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_97_1.png)


    Where to see: Occurs throughout the region. Frequently found in trees in open
    country and dry deciduous forest. It also ventures into town gardens and parks.'
- md: '

    ## Blue-eared Barbet *Psilopogon australis* 16cm


    Two plumage variations occur in the region, both having green body plumage, a
    black malar stripe and breast stripe, and a blue chin and crown. Javan birds have
    patches of yellow on the cheek and below the black breast stripe, whereas the
    birds on Sumatra lack the yellow but have red cheeks. Also known as the Yellow-eared
    or Little Barbet, it is more likely to be heard than seen. The calls are a fast,
    repeated tuk-trrk, tuk-trrk and a series of high-pitched whistled or trilled notes.


    Where to see: A common barbet of forests and plantations, occurring from the coast
    to lower hills throughout the region.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_98_0.png)


    ## Fire-tufted Barbet *Psilopogon pyrolophus* 28–29cm


    As with most barbets, the main plumage is bright green. It has a yellow band across
    the breast, outlined by a black line below. The rear crown and nape are red, the
    chin green, the ear-coverts grey and the eye-stripe and forehead black. It has
    a prominent, red-tipped, black hairy tuft at the base of the lores. It is very
    fond of ripe fruit, particularly small figs, and consumes insects. It will perch
    stationary high in the trees for long periods while frequently uttering its harsh
    buzzing call, very reminiscent of a cicada.


    **Where to:** Occurs on Sumatra and West Java, where it prefers tall, older forest
    trees in the lower hills and on mountain slopes.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_99_0.png)


    ## Black-banded Barbet *Psilopogon javensis* 26cm

    Indonesian name: Takur Tulung-tumpuk


    Quite large, with green body plumage and tail, this barbet has a yellow crown
    and a yellow spot below the eye. It also has a red throat, under which is a solid
    black collar which joins a black stripe running through the eye. The feet are
    pale olive-green and the bill black. Like with other barbets, the feet are adapted
    for climbing tree trunks, having two toes pointing forward and two back. It is
    mainly a fruit-eater with a penchant for small, ripe figs, seeds, buds, flowers
    and occasionally insects.


    Where to see: Occurs around clearings and forest edges in the more open lowland
    and hill forests of Java and less so on Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_100_0.png)


    ## Flame-fronted Barbet *Psilopogon armillaris* 20–22cm

    Indonesian name: Takur Tohtor


    This robust little barbet has predominantly green upperparts, slightly paler underparts
    and a prominent yellow-and-orange forehead. The rear of the crown to the nape
    is blue and there are small patches of orange either side and just below the front
    of the neck. The strong bill is black, as is the frontal eye-stripe. Birds from
    East Java and Bali appear larger with darker orange on the forehead and lower
    neck.


    Where to see: Occurs on Java and Bali at edges of lowland and hill forest, occasionally
    around nearby habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_100_1.png)


    ## Lineated Barbet *Psilopogon lineatus* 25–30cm

    Indonesian name: Takur Bultok


    This barbet has a green back, wings and tail, and a brown head and upper breast
    heavily streaked with buff. The remaining underparts are green, also streaked
    with buff. It has a broad orange-yellow orbital ring of bare skin. The heavy bill
    is variable in colour, from pale pink to yellow, and the feet are yellow.


    Where to see: Occurs only on Java and Bali, frequenting sparse, dry coastal woodlands,
    edges of savanna, acacia forest, orchards and cultivated areas; often gathers
    with other barbets at fruiting trees.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_101_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_101_1.png)


    ## Sunda Pygmy-woodpecker *Picoides moluccensis* 13cm

    Indonesian name: Caladi Tilik


    This little woodpecker has short legs and grey feet, with two toes pointing forward
    and two backward. Its uppers are dark brown with white barring, giving a partially
    spotted appearance. The underparts are whitish with black streaking. It has a
    rich brown crown, black malar stripe, white face patch with a greyish-brown centre,
    and thin red stripe behind the eye.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_102_0.png)


    Where to see: Occurs throughout the region. It prefers mangroves, open woodland
    and coastal secondary forest.


    ## Common Flameback *Dinopium javanense* 28–30cm

    Indonesian name: Pelatik Besi


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_102_1.png)


    A very conspicuous and striking appearance, being very large, with all-black plumage
    apart from a white belly. Males have a red crest and cheek patches. The long,
    pointed bill is black and the feet grey. Rather solitary makes its presence known
    by its loud ''laughing'' and ''barking'' calls, as well as its heavy hammering
    on dead branches. It often calls in flight with a raucous, echoing kiow, kiow,
    kiow.


    Where to see: Occurs throughout the region''s open lowland forests


    ## White-bellied Woodpecker *Dryocopus javensis* 40–48cm

    Indonesian name: Pelatik Ayam


    This little woodpecker has short legs and grey feet, with two toes pointing forward
    and two backward. (Wait, the OCR text for this section seems to have jumbled/mixed
    descriptions in the source, I will re-organize the logical flow based on the provided
    text).


    Where to see: Occurs commonly in primary and secondary forest on Java and Sumatra
    in Bali.


    ## Black-thighed Falconet *Microhierax fringarius* 14–17cm

    Indonesian name: Alap-alap Capung


    This tiny falcon has black uppersparts shows white spotting on the tail and secondaries.
    The crown is black, edged with a white patch above the bill and a white stripe
    behind the eye, and the sides of the face and ear-coverts are black. The chin
    and belly are rufous with white margins. The legs and cere are black and the iris
    brown. Females are a little larger than males, and juveniles have the white on
    the head tinged red.


