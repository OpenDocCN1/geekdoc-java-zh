  - '[PAGE 138]


    # Long-tailed Shrike Lanius schach 20–25cm


    Indonesian name: Bentet Kelabu


    Easily identified by the long black tail, upright stance and brown, black and
    white plumage. It has a grey crown and nape, with chestnut mantle, back and rump;
    the underparts are clean white. Adults have a black mask through the forehead
    and across the ear-coverts. Juveniles tend to be duller, with dark grey head and
    nape and barring on flanks back.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_138_0.png)


    **Where to see:** Occurs throughout the region. Often in pairs, it roams through
    grassland and scrub, venturing into cultivated land and plantations up to the
    edge of human habitation.


    # Common Green Magpie Cissa chinensis 31cm


    Indonesian name: Eek Layongan


    This magpie is predominantly green with a conspicuous black mask stretching through
    the eye to the nape. The more yellowish-green feathers also extend to form a short
    crest at the nape. The wing feathers are dark chestnut apart from the light green
    scapular and upperwing-covers. The underside of tail is pale green; a red orbital
    ring encircles a brown iris; the substantial bill and legs are red. The bright
    green plumage is sometimes faded by sunlight to pale blue, particularly when in
    captivity.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_138_1.png)


    **Where to see:** Occurs in the hill and mountain forests of Sumatra.'
  - '[PAGE 139]


    # Racket-tailed Treepie Crypsirina temia 31–33cm including 18cm tail

    Indonesian name: Tangkar Centrong


    This member of the crow family has uniformly blackish plumage with a greenish-bronze
    sheen. It has black feet, a strong black bill and blue eyes. It differs from all
    similar birds in the region in having a long tail with spatulate tips to the central
    feathers.


    Where to see: Occurs as a resident on Java and Bali. Usually inhabits lowland
    and hill forests and plantations, and often in secondary growth, more cultivated
    areas, and even scrubland and gardens.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_139_0.png)'
  - '[PAGE 140]


    # Sunda Crow Corvus enca 43–48cm


    Indonesian name: Gagak Hutan


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_140_0.png)


    This entirely black crow is more slender and shorter-tailed than its larger cousin,
    the Large-billed Crow, which is also found in the region. It also has fewer throat
    hackles and inconspicuous bare black skin around the eye. Most of its plumage
    is slightly iridescent purple, except for the dull black underparts. The longish,
    slightly downcurved bill is black, the legs also black and the iris brown. In
    flight it shows a squarish tail and broad, stubby wings.


    Where to see: Occurs in forest and at forest edges throughout the region, sometimes
    in pairs.


    # Large-billed Crow Corvus macrorhynchos 47–50cm


    Indonesian name: Gagak Kampung


    This bulky black crow is distinguished from its close relative, the Sunda Crow,
    by its strong, solid bill, more protruding foreck and more pronounced throat hackles.
    Its overall plumage is glossed purple. The iris is dark brown and feet are black.
    Even the underparts show iridescence, except in juveniles, which are soft matt
    in appearance. In flight it has long and broad wings with wide-spread primaries
    and long tail.


    Where to see: An open-country species occurring throughout the region, often close
    to human habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_140_1.png)'
  - '[PAGE 141]


    # Rail-babbler Eupetes macrocerus 28–30cm


    Indonesian name: Sipinjur Melayu


    The unique rail-babbler occurs in the region, where it is almost totally terrestrial
    and is mostly revealed by its sorrowful whistling call. It has a long neck and
    tail. Its plumage is mainly red-brown on both rear uparts and underparts, which
    become redder on the belly, neck and underwing, and chestnut on the chin and throat.
    The forecrown is buff, the crown chestnut


    with a broad white supercilium above a broad black eye-stripe from the lores to
    the nape. Below the rear of the eye-stripe there is a bright blue patch over each
    gular sac. Bill and legs are black and the iris is brown.


    Where to see: Occurs on Sumatra, primarily in dense forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_141_0.png)'
  - '[PAGE 142]


    # Grey-headed Canary-flycatcher Culicicapa ceylonensis 12–13cm

    Indonesian name: Sikatan Kepala-abu


    This little flycatcher has a typical upright posture with a raised superficial
    crest. The head, from bill to nape, along with the sides of the face, neck and
    upper breast, is grey. The upparts are dull green, from the mantle to the rump
    as well as the upperwing-coverts. The black wing feathers are edged dull green.
    The underparts from breast to undertail-covers are dull yellow, becoming greyish
    on the flanks. A white eye-ring encircles a dark brown iris; the bill is black
    above, pink below and legs fawn colour.


    Where to see: A common forest and woodland species, occurring throughout the region.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_142_0.png)


    # Cinereous Tit Parus cinereus 13cm

    Indonesian name: Gelatik-batu Kelabu


    These are relatively small, black, white and grey birds. The head and throat are
    black, with a black stripe from the throat to vent; the ventral stripe is wide
    on males, but on females can be very narrow and even broken. There is a large
    white patch on the cheek and a small white nape spot.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_142_1.png)


    Where to see: Occurs throughout the region from lowland to open montane deciduous,
    coniferous and secondary forests as well as mangroves and even gardens. Usually
    seen foraging for insects.'
  - '[PAGE 143]


    # Australasian Bushlark Mirafra javanica 13–15cm


    Indonesian name: Branjangan Jawa


    This bird occasionally perches in trees but is more often seen walking on the
    ground. It has dark-mottled, russet-brown uparts, with paler underparts and white
    outer tail feathers. It has a broad buff supercilium and brown bill tinted yellow.
    Its short, pinkish-grey legs have long claws. It has a weak undulating flight,
    and like many other larks it it often sings, with a high-pitched trilling, before
    gliding slowly back to the ground.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_143_0.png)


    Where to see: Common in open areas of short grass, rice field stubble and dry
    cultivated fields on Java and Bali.


    # Common Tailorbird Orthotomius sutorius 10–14cm


    Indonesian name: Cinenen Pisang


    The upperparts on this wren-like warbler are yellow-green from the nape to the
    tail, with the flight feathers brown edged olive. The head is bright chestnut
    from the lores to coloured paler on the sides of the face. The underparts from
    throat to the undertail-coverts are buffish-white, becoming grey-white on the
    flanks. The longish bill is brown above, pink below, the iris is pale brown and
    legs are pink-yellow. Females have slightly shorter tails and juveniles are duller.


    Where to see: Common on Java, in more open scrub and gardens, even close to human
    habitation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_143_1.png)'
  - '[PAGE 144]


    # Ash Tailorbird Orthotomus ruficeps 12cm

    Indonesian name: Cinenen Kelabu


    A small, plain-coloured tailorbird with a grey-brown back and greyish underparts,
    becoming white on the belly. Males have a rufous face, crown and throat, whereas
    females have a much paler rufous face and crown and white throat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_144_0.png)


    Where to see: This energetic little bird frequently occurs in the region''s wetland
    areas in more open country and lowland forests, mangroves, bamboo thickets, coastal
    scrubland and wellvegetated gardens.


    # Olive-backed Tailorbird Orthotomus sepium 12cm

    Indonesian name: Cinenen Jawa


    This tailorbird has olive-grey upperparts, paler below with a whitish belly. The
    head of the male is almost completely light chestnut, including crown to below
    the ear-covets and lores to nape; the chin being a paler paler. Females have less
    chestnut on the face. The greyish tail has a fine whitish tip below a dark subterminal
    bar. The legs are pink, the quite long bill is brown above, pinkish below and
    the iris is pale red. Females are duller with a white chin.


    Where to see: Occurs in Java and Bali’s scrublands, cultivated areas and mangroves.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_144_1.png)'
- md: '

    ## Deignan’s Prinia Prinia polychroa 15–16cm


    This large, dull-coloured prinia has a substantial long brown tail. In breeding
    plumage it is duller still, with well-abraded plumage. At other times it becomes
    less dull with whitish neck supercilium in front of the eye, pale buff underparts
    and brown upperparts with dark streaking. The bill is black when breeding, otherwise
    brown to yellow-brown. Legs are pink-brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_145_0.png)


    Where to see: Occurs on Java, preferring dry lowland scrub.


    ## Bar-winged Prinia Prinia familiaris 13cm


    A noisy, versatile and gregarious little bird, often uttering its loud, high-pitched
    tweeting call all as it searches for insects from ground to treetops. It is recognised
    by its long tail of black and white-tipped feathers, drab, olive-brown upperparts,
    and two distinctive white wing-bars. The white of the throat extends down the
    middle of the upper belly, with the flanks pale grey and lower belly and vent
    pale yellow.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_145_1.png)


    Where to see: A very common endemic in the lowlands of Java and Bali, but less
    so on Sumatra, particularly in the north. It favours second growth, especially
    parks and gardens, mangroves, plantations and scrub.


    ## Yellow-bellied Prinia Prinia flavviventris 12–14cm


    Indonesian name: Perjenak Rawa


    Appearing like a long-tailed warbler, it has olive-brown upperparts and tail,
    a bright yellow belly and a white chin, throat and upper breast. The head greyish
    with a reddish-orange eye-ring and a very thin, and often broken, white supercilium.
    The legs and feet are dull orange, and the bill is dark brown above and pale brown
    below. This prinia has a weak song.


    Where to see: Found on Sumatra and West Java, it is common in grassland, reedbeds
    and thick scrub in the lowlands. It has shy habits, with a tendency to remain
    hidden among grass and reeds in wetland habitat.


    ## Plain Prinia Prinia inornata 11cm


    Indonesian name: Perjenak Padi


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_146_0.png)


    This small prinia has plain, grey-brown upperparts from the crown over the ear-coverts
    and back to its long, tapered, buff-tipped tail. The underparts are whitish rufous
    towards the belly and vent. It has a broad white supercilium. The legs are pale
    brown. The bill is black in the breeding season, becoming pale brown later.


    Where to see: Occurs on Java and Bali in a variety of habitats where scrubby grassland
    is present.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_146_1.png)


    ## Zitting Cisticola Cistica juncidis 10cm

    Indonesian name: Cici Padi


    This rather inconspicuous little brown bird is heavily streaked with dark brown
    and buff on its upparts. The white underparts and vent are warm buff on the flanks,
    and the brown-and-black tail is tipped white. It has pink legs, grey-black bill
    and a pale-brown iris. Its broad white supercilium distinguishes it from the Golden-headed
    Cisticola.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_147_0.png)


    Where to see: Occurs throughout the region. Common in lowland grassland and reedbeds;
    it is attracted to wet habitat and rice fields.


    ## Golden-headed Cisticola Cisticola exilis 9cm

    Indonesian name: Cici Merah


    Breeding males have a warm golden crown and rump. Non-breeding birds and females
    are very similar to the Zitting Cisticola but have a more more golden head colour,
    and the buff supercilium is the same colour as the nape and head sides. The throat
    is white and the underparts buff. The dark brown tail is tipped buff.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_147_1.png)


    Where to see: Occurs throughout the region. A common bird of Alang-alang grassland,
    rice fields and reedbeds on Java and Bali. Only locally common on Sumatra.


    ## Oriental Reed Warbler Acrocephalus orientalis 19cm


    Indonesian name: Kerak-basi Besar


    This is a large brown warbler with a conspicuous pale buff supercilium underlined
    by a thin dark-brown eye-stripe. Its underparts are whitish, shading into buff
    on the flanks, rump and upper belly, with the upper belly and the sides of the
    breast sparsely streaked brown. The largest bill is brown above and tinged pink
    below, and the legs are blue-grey.


    Where to see: Occurs throughout the region as a winter migrant. Usually found
    in lowland reedbeds and coastal marshes, but frequently occurs in rice fields
    and scrub near water.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_148_0.png)


    ## Striated Grassbird Megalurus palustris 22–28cm

    Indonesian name: Cica-koreng


    Large, long-tailed warbler, the male being larger than the female but very similar
    in their buff-brown plumage. It has a long white supercilium above a dark brown
    eye-stripe. Upperparts are light brown, heavily streaked darker on the mantle.
    Underparts are white-buff with streaking, darker on the flanks. The bill and iris
    are brown and legs yellow-brown.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_148_1.png)


    Where to see: Resident in Java and Bali’s wetlands and marshes where tall grass
    is present.


    ## Pygmy Cupwing pusilla 8–9cm


    This tiny, tailless babbler has warm, olive-brown upperparts marked only by the
    paler tips to the scapulars and wing-coverts. The underparts are brown with buff-white
    scaling. The face and ear-coverts are warm grey-brown, darker and less-coloured
    in Javan birds. The bill is grey-black, legs are light brown and iris is dark
    brown. Sexes are similar.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_149_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_149_1.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_149_2.png)


    Where to see: Found mainly on the ground of montane forests of Java and Sumatra.


    ## Barn Swallow Hirundo rustica 17–19cm


    Indonesian name: Layang-layang


    The Barn Swallow is dark blue above, with a white breast and long outer feathers.
    The forehead and throat are red, with a blue bar across the upper breast. Juveniles
    are duller and lack the tail-stream.


    Where to see: Overwinter in the region. It is more likely to be seen wheeling
    and gliding high in the sky, hunting aerial insects but often skims the surface
    of lakes and streams. Sometimes gathers in huge flocks to roost in reedbeds, tall
    grasses and even on city buildings.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_150_0.png)


    ## Ruby-throated Bulbul Pycnotus dispar 17–20cm


    Indonesian name: Cucak Emas


    This large bulbul has olive-tinged yellow-green upperparts and paler underparts.
    Distinguished by its black head with a tufty crest, bright red throat and rounded
    tail with white-tipped outer feathers. Sexes are similar. Juveniles have a dark
    olive-brown nape. It has a black bill, blackish legs tinted pink and pale iris.


    Where to see: Occurs throughout the region in well-foliated tall trees in secondary
    forest and at forest edges.


    ## Black-headed Bulbul Microtarsus melanocephalos 16–18cm

    Indonesian name: Cucak Kuricang


    Recognised mainly by its yellow-green body plumage and glossy black head and throat.
    The upperparts are greenish-yellow tinted brown, and the underparts brighter.
    The wings are black and the tail yellow, with a broad black subterminal bar. The
    bill is black, legs brownish-black and iris very pale blue. Juveniles are duller.
    Rare colour forms exist in which the yellow areas are replaced by dull grey or
    greenish-olive, but they have a yellowish-white vent and undertail-covers, and
    whitish tip to the tail.


    Where to see: Occurs throughout the region at forest edges, in riverine and coastal
    scrub and often along roadsides.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_151_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_151_1.png)


    ## Scaly-breasted Bulbul Pycnonotus squamatus 14–16cm


    Indonesian name: Cucak Bersikis


    The upperparts, including the mantle to the rump, are olive-green, the wings being
    a little darker and the black tail tipped white. The underparts are black on the
    breast and flanks with the feathers edged white, producing a scaled appearance.
    The chin, neck and lower belly are white and undertail-coverts yellow. The head
    is black from the lores over the crown to the nape and the ear-coverts. The iris
    varies from red to yellow; the legs and thinish bill are black. Sumatran birds
    have darker upperparts.


    Where to see: Most likely to be seen at forest edges, on Java and Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_152_0.png)

