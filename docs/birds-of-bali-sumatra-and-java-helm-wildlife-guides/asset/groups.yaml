    # Christmas Frigatebird Fregata andrewsi


    Length 90–100cm, wingspan 210–230cm

    Indonesian name: Cikalang Christmas


    This Critically Endangered seabird has very dark, brownish-black plumage, with
    long wings and a deeply forked tail. The male has a white patch extending between
    the belly and the vent, in the female the patch is more extensive, extending forward
    to encompass the whole belly and onto the underwings. Males have a prominent bright
    red inflatable gular


    sac used in display, and grey bill and legs. Females are slightly bigger and have
