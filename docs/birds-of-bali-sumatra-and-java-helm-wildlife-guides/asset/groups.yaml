    雄性上部包括头部、背部、上翅和尾部大部分为黑色。长长的眉纹为白色，中覆羽末端和上覆羽也是白色，在翅膀上形成一条白色条纹。外尾羽基部也是白色的。喉部和上胸为橙红色，其余下部为白色。雌性与雄性相似，但上部颜色为橄榄褐色而非黑色。


