    ## Indonesian Kestrel *Falco moluccensis* 26–32cm


    Indonesian name: Alap-alap Sapi


    The male has chestnut uppersparts, heavily but spotted dark brown and extending
    over the wings. The top of head, nape and breast are more buff-chestnut, with
    the spots more streaked. The grayish iris is surrounded by a yellow eye-ring and
    a patch of bare yellow skin. The cere is yellow, bill grey and legs yellow with
    black claws. The underttailcoverts are buff leading into a pale grey tail with
    a broad black subterminal band and white tip.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_106_0.png)


    Where to see: Occurs on Java and Bali in open habitat, often close to habitation.


    ## Oriental Hobby *Falco severus* 27–30cm


    Indonesian name: Alap-alap Macan


    The uppersparts are blackish and underparts chestnut, darker on the chest and
    belly, becoming paler and buffer on the vent. The chin and throat are whitish
    but often light chestnut. The feet, cere and orbital ring are yellow. Juveniles
    have similar uppersparts but have buff underparts heavily streaked brown. Colour
    variations arise across the range; darker on Bali to lighter on Sumatra.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_106_1.png)


    Where to see: Occurs in open areas of woodland, grasslands and even rice fields
    of Bali, Java and east Sumatra.


    ## Yellow-crested Cockatoo *Cacatua sulphirea* 33cm


    Similar to but smaller than the Sulphur-crested Cockatoo (Cacatua galerita). This
    all-white cockatoo has a lovely crest of stiff yellow feathers and yellow cheek
    patches. It has a black bill and dark grey feet. Its flight appears laboured,
    with alternating glides and fast-flapping wingbeats. Usually lives in pairs but
    often seen in small noisy groups, screeching, squawking and whistling, and raising
    its crest as it calls. Widely exploited by the pet trade.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_107_0.png)


    Where to see: Occurs at forest edges on Nusa Penida, Bali. Scarce.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_107_1.png)


    ## Red-breasted Parakeet *Psittacula alexandri* 33–37cm


    Indonesian name: Betet Biasa


    The underparts from the nape to rump, including the wings, are deep green, with
    the median wing-covers tinged brighter green. The head is grey-blue with a black
    line across the forehead to the eye. Another broader black line stretches across
    the chin and neck, and narrows below the cheeks. The underparts are bluish-pink
    immediately below the collar, shading to pink on the belly then to turquoise and
    to green on the undertail-covers. The uppermost part is bright blue. The bill
    is red, tipped horn-yellow, and feet are pale grey.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_108_0.png)


    **Where to see:** Occurs on Java and Bali, where it prefers damp woodland in lowlands.


    ## Blue-rumped Parrot *Psittinus cyanurus* 18–20cm


    Indonesian name: Nuri Tanau


    This small parrot has a blue crown and nape with the sides of the face blue, often
    tinged grey-buff. The mantle and upper back are dark purple-grey to blackish.
    The lower back, rump and tail-covers are bright blue and the tail is green on
    the outer feathers. The wing is green tinged maroon at the shoulder and underparts
    are grey-olive, becoming red on the flanks and underwing-covers. The upper mantle
    is red and lower dark horn. Legs are grey-green and the iris is white. The female
    has a brown head.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_108_1.png)


    **Where to see:** Occurs in lowland forest on Sumatra.


    ## Sunset Lorikeet *Trichoglossus forsteni* 28–30cm


    Indonesian name: Perkiki Dada-merah


    This is a brilliant multicoloured parrot with a very dark purplishblue head. Apart
    from the pale green collar, the upperparts are dark green. It has red undercovers
    and a yellow patch under the shoulder. The breast is red and belly dark blue,
    and the thighs show alternating green and yellow narrow bands. The feet are grey
    and the bill is red.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_109_0.png)


    Where to see: A resident of Bali, normally seen in small, noisy, foraging parties
    flying low over the montane forest canopy.


    ## Blue-crowned Hanging Parrot *Loriculus galgulus* 12–13cm


    Indonesian name: Serindit Melayu


    This small parrot is mainly bright green, darker on the wings and lighter below.
    Just below the nape is a small area of orange-yellow and similarly the bright
    red rump and uppertail-covers. There is a small dark blue patch on the top of
    the crown and a bright red throat and upper-breast. The legs are orange and the
    bill is black. Females lack the red.


    Where to see: Occurs on Sumatra and West Java, where it prefers lowland forest
    edges and plantations.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_109_1)


    ## Javan Hanging Parrot *Loriculus pusillus* 12cm


    Indonesian name: Serindit Jawa


    This very small, mainly leaf-green parrot is well camouflaged, with brighter yellow-green
    underparts; the colour blends well with foliage. Males have a large yellow throat;
    females smaller. Most seen in the treetops, often hanging upside-down to feed
    on flowers and small fruits. They roam around small flocks, making high-pitched
    shrieking calls.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_110_0.png)


    ## Green Broadbill *Calyptomena viridis* 14–17cm


    Indonesian name: Madi-hijau


    This broadbill is all green apart from the male''s obvious black spot on the cheeks
    below the ear-coverts and black barred markings on the wings. It has a peculiar
    tuft on the forehead, a short black bill, short tail and pointed wings with black
    flight feathers. A cream-coloured eye-ring surrounds a dark brown iris. The legs
    are buffish-green. Common.


    Where to see: Occurs on Sumatra. Generally rainforest dwelling but also in swamp
    forest and riverine habitats.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_110_1)


    ## Long-tailed Broadbill *Psarisomus dalhousiae* 23–26cm


    Indonesian name: Madi Jap


    Distinctively marked and brilliantly coloured, this slender, long-tailed broadbill
    is particularly attractive. With green upperparts and green-turquoise underparts,
    it has a black crown with a blue patch and bright yellow spot behind the ear-coverts.
    The face and throat are bright yellow, leading to a narrow, almost complete pale
    yellow collar. The flight feathers are black and blue, as is the long tail. The
    iris is grey-green, legs yellow-green and bill blue-green.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_111_0)


    Where to see: Occurs in primary and secondary evergreen and broadleaf forests
    of Sumatra.


    ## Silver-breasted Broadbill *Psilophus lunatus* 16–17cm


    Indonesian name: Madi Perak


    The male has a pale grey-brown head with a light grey forehead and a broad black
    supercilium. The upperparts are grey at the collar blending to chestnut at the
    rump and uppertail-coverts. The breast and belly are white. The flight feathers
    are brilliant blue and black and the tail black. There is a narrow orbital ring
    around a dark blue-green iris. The bill is pale blue-green, sometimes showing
    orange at the base, and the legs are dirty yellow.


    Where to see: Occurs sparsely in submontane forests of Sumatra.


    ![](img/e8dcc79b9f6b63c1dff9f174c158e29_112_0)


    ## Banded Broadbill *Euryllamus javanicus* 21–23cm


    This brightly coloured broadbill has a black mantle, back and uppertail-coverts
    coarsely marked with yellow patches. The flight feathers are brown-black and tail
    and wing-coverts black. The underparts and head are maroon-red, becoming lighter
    on the belly. A thin blackish band stretches across the upper breast. The bright
    cream iris is surrounded by an area of black from the lores to above the ear-coverts.
    The bill is pale blue tinted green and the legs are grey-pink.


    Where to see: Occurs in Java and Sumatra''s evergreen and mixed deciduous forest
    near wetlands.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_113_0)


    ## Black-and-yellow Broadbill *Euryllamus ochromalus* 13.5–15cm


    Indonesian name: Sempur-hujan Darat


    This brightly coloured broadbill has a black head covering the nape, ear-coverts
    and throat below which is a broad white collar. Below that is a black breast-band,
    unbroken in the male, broken centrally in the female. The underparts are pink,
    becoming yellow at the undertail-coverts. The tail is black, the bill is bright
    blue tinted green and at the edges, the iris yellow-white, and legs fawn to blue.
    It has a black mantle, back and uppertail-coverts coarsely marked with yellow
    patches.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_113_1.png)


    Where to see: Occurs on Sumatra. Prefers lowland forests.

