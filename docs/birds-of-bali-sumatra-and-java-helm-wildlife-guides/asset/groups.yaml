    ## 爪嘴八椋 *Agrospras sturninus* 17–18cm


    印尼语名称：Jalak Cina


    雄鸟的特征是灰色的头部、后脑部有一块闪闪发光的紫色斑块以及背部上部有奇异的紫色羽毛。紫黑色的覆羽与羽尖构成的宽阔白色条带形成对比。尾直部为白色褐色，短尾巴为黑色并泛着绿光。下部呈白色。它的下背部有闪闪发光的紫色。虹膜为棕色，喙为黑色，腿为灰色。雌鸟和幼鸟颜色较浅，棕色较多。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_175_0.png)


    观赏地点：作为季节性候鸟出现在该地区，常见于城市公园和花园，也出现在沿海林地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_175_1.png)


    ## 爪哇八椋 *Gracupica jalla* 22cm


    印尼语名称：Jalak Suren


    上部主要是黑色，带有棕色调。它有白色的翅缘，额头、脸颊、腹部、尾端和尾直也是白色的。眼睛周围裸露橙色皮肤、黄色的脚和橙白色的喙使这种鸟具有色彩丰富的外观。农业活动和宠物贸易导致其野生种群数量锐减，如今在鸟类市场上看到的鸟类也可能是人工繁殖的。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_175_2.png)


    观赏地点：分布于爪哇岛和巴厘岛。该物种目前处于极临危（Critically Endangered）状态，曾遍布整个地区，特别是在开阔和耕作的低地地区。


    ## 巴厘八椋 *Leucopsar rothschildi* 25cm


    印尼语名称：Jalak Bali


    它独特的羽毛大部分是白色，除了翅膀尖和尾部尖。它有一有一个长长的白色羽冠（雌性较短），眼睛周围有一有一块天蓝色的皮肤。这种巴厘岛特有物种是世界上最受威胁的物种之一，现在野外存活的鸟寥寥无几。栖息地的破坏和为了宠物贸易的捕捕是其数量减少的主要原因。


    观赏地点：一小部分野生种在原生栖地巴厘岛西北部（巴厘西部国家公园）的保护下得以幸存。遗憾的是，最近它以一种不科学的方式被引入了巴厘岛的努萨佩尼达岛，那里超出了它的原生栖地。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_176_0.png)

    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_176_1.png)


    ## 黑翅鹊 *Acridototheres melanopterus* 23cm


    印尼语名称：Jalak Putih


    除了黑色翅膀、尾巴和眼睛周围的一块黄色裸露皮肤外，这种八椋全身白色。尾端尖白色，并有一条白色翅缘。


    爪哇西北部的鸟类看起来要浅得多，只有飞羽和尾巴是黑色的。爪哇东南部的鸟有灰色的尾直部和肩膀。巴厘岛的鸟羽毛对比更明显，下部、颈部和头部到背部顶部为白色，而上部（包括背和尾直部）为灰黑色。


    观赏地点：三个亚种特产于此：爪哇西北部的黑翅种、爪哇东南部的灰背种和巴厘岛的灰尾种。它们似乎都出现在干旱的沿海草地上。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_177_0.png)


    ## 常见的鹊 *Acridototheres tristis* 24–26cm


    印尼语名称：Kerak Ungu


    上部以及腹部中部和侧腹为深暖褐色，颈部下部为深灰色，向尾下覆羽变为褐色最后为白色。头部、颈部和长长的冠羽为闪光黑色，与强烈的黄棕色喙形成对比，眼睛下方和后方有亮黄色裸皮。当栖息时，可以看到前臂有一条长白纹。腿是黄色的，尾巴为棕色，尖端白色。


    观赏地点：分布于苏门答腊和巴厘岛的各种栖息地，从城市到开阔地区。


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_177_1.png)


    ## 巽达画鸫 *Zoothera andromedae* 23–25cm


    印尼语名称：Anis Hutan


    这种花纹美丽的画鸫有特别长的喙。它的上部（包括冠部）为灰棕色，黑色羽缘边缘织出鳞片状图案。面部侧面（包括耳羽和眉间）是白色点缀黑色，黑色虹膜周围有一圈白色眼环。喉部、胸部和腹部为浅灰色，在腹部和尾下覆羽变为白色。白色的侧腹装饰有精美的黑色鳞片纹。腿为粉灰色，喙为黑色。雌雄非常相似。幼鸟上部较棕，下部较褐。


    观赏地点：在该地区有分布，，通常栖息在山地。


