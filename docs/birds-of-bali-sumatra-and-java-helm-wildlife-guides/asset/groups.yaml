    ## Javan Forktail Enicurus leschenaulti 28cm


    Indonesian name: Meninting Jawa


    The deeply forked tail consists of tiers of white-tipped black feathers overlaid
    to form an attractive, evenly spaced, crescent-shaped pattern pointing out to
    the body. The outer tail feathers are all white. The head is all black except
    for a contrasting white understanding crown. The chin, breast and back are also
    black, as are the shoulder and scapulas. It has an obvious white wing-bar and
    white rump and belly. The legs are pink and the bill black. Males and females
    are similar, with juveniles being browner and duller.


    Where to see: Occurs in the lowland forests of Java and Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_189_0.png)


    ## Yellow-rumped Flycatcher Ficedaled zanthopygia 13–14cm


    Indonesian name: Sikatan Emas


    The underparts and lower back and rump of the flycatcher are bright yellow, and
    the undertail-covers whitish. The uparts are all black apart from the broad white
    supercilium and a white area on the wing-covers and tertials. The bill is black,
    grey-blue below; legs black. Females are olive-grey over the crown to the yellow
    upptail-covers. Underparts whitish on the chin becoming pale pale yellow on the
    breast and whitish again on the vent. The pale wing patch is much less obvious
    than in the male.


    Where to see: A migrant that occurs throughout the region and is frequently found
    at woodland edges.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_0.png)


    ## Mugimaki Flycatcher Ficedaled mugimaki 12.5–13.5cm


    Indonesian name: Sikatan Mugimaki


    The male has blackish-grey upperparts including the head and tail, with two prominent
    white spots, one just behind the eye, the other on the tips of the median coverts.
    The belly and undertail-covers are also white. The remainder of the underparts
    up to the throat are orange-red. The small bill is black, the legs are pink and
    the iris is dark brown. The female has dark brown upperparts and tail, the throat
    to mid-belly pale orange-red and the belly white.


    Where to see: Occurs throughout the region, mainly in lowland broadleaf evergreen
    forest.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_1.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_190_2.png)


    ## Snowy-browed Flycatcher Ficedula hyperythra 11–13cm


    Indonesian name: Sikatan Bodoh


    This delicate little flycatcher has a round head and short tail. The underparts
    are alike in both sexes, being pale chestnut on the chin blending to fawn on the
    belly and white below the tail. The uparts differ, the male dark steely blue above
    and the female olive-brown. The male has a noticeable white stripe above black
    lo almost meeting centrally extending over the eye. The leg colour is variable,
    from purple to grey in males to pink in females. The bill is black and iris very
    dark brown. Females are coloured orange-buff from above the bill to just over
    the eye. Male Sumatra birds have blackish wings and tail, and those on Java and
    Bali are greyer above.


    Where to see: Common in the highland forests of west Sumatra and on Java and Bali


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_191_0.png)


    ## Little Pied Flycatcher Ficedula westermanni 11cm


    Indonesian name: Sikatan Belang


    Where to see: Occurs throughout the region in submontane to montane forest.


    This species is sexually dimorphic, the male being black and white and the female
    brown and white. The male''s upperparts are all black, apart from a white wing-bar
    and supercilium and white edges to the base of the outer tail feathers. The underparts
    are all white and the legs and bill black. Iris dark brown. Females have brown
    upperparts and whitish underparts, the tail being rufous-brown. Juveniles are
    heavily spotted with buff on the head and uparts and have dark barring on the
    breast. It has a quiet pi-pi-pi-pi-pi call followed by a vibrating churring sound.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_191_1.png)


    ## Rufous-chested Flycatcher Ficedula dumteria 11–12cm


    Indonesian name: Sikatan Dada-merah


    The male''s upperparts are mainly black from the head and mantle, including the
    upperwing and tail. The long supercilium is white as are the median covert tips
    and of the upperwing-coverts, which form a white stripe along the wing. The bases
    of the outer tail feathers are also white. The throat and upper breast are orange-red,
    the remaining underparts white. Females are similar to the male but coloured olive-brown
    instead of black above.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_192_0.png)


    Where to see: **Pied Bushchat Saxicola caprata 13–14cm**


    Indonesian name: Decu Belang


    Males are all black, apart from a white wing-bar and supercilium and white edges
    to the base of the outer tail feathers. The underparts are all white and the legs
    and bill black. Iris dark brown. Females have brown upperparts and whitish underparts,
    the tail being rufous-brown. Juveniles are heavily spotted with buff on the head
    and uparts and have dark barring on the breast. It has a quiet pi-pi-pi-pi-pi
    call followed by a vibrating churring sound.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_192_1.png)


