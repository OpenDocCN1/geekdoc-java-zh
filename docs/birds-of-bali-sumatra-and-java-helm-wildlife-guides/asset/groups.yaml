    # Buffy Fish Owl Ketupa ketupa 40–44cm


    Indonesian name: Beluk Ketupa


    This owl has an amusing appearance, with bright yellow eyes and its conspicuous
    horizontal ear-tufts. its upperparts are brown, streaked black and buff, and the
