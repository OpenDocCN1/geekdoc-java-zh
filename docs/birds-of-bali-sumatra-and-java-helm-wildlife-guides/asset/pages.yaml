  md: '# Java Sparrow Padda oryzivora 16cm


    Adults are largely grey, with a black head and throat, large white cheek patches,
    a black tail, white undertailcovers, and a heavy pink or red bill. Juveniles are
    brownish-grey with a buff or brown breast. This once common bird has declined
    alarmingly in recent years.


    Occasionally it forms large wandering flocks feeding on grain and rice. Sometimes
    seen close to human habitation, in cities, towns and villages.


    Where to see: Endemic to Java and Bali. It is usually sedentary, found in small
    groups feeding on rice and seeding grasses, and in other low vegetation, mangroves
    and scrub.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_215_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_215_1.png)'
