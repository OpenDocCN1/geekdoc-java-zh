  md: '# # KEY BIRDWATCHING SITES


    # ## BALI


    # ### Bali Barat National Park


    Situated at the western tip of Bali, Bali Barat is a mix of dry and moist forests
    with coastal scrub, savanna and mangroves. It is the only place to find native
    wild, endemic Banded Pitta, Many other interesting species reside among them Green
    Junglefowl, Pink-headed Fruit Dove, Black-backed Fruit Dove, Shiny Whistling Thrush,
    and Sunda Bush Warbler.


    Dusky Broadbills, Jay Shrike and Red-bearded Bee-eater.


    # ### Kerinci-Seblat National Park


    The park includes the dominating peak of Mt Kerinci and the Kerinci valley wetlands.
    The best place to see Sumatra montane birds, as well as several of the endemics
    such as Schneider''s Pitta, Sumatra Peacock Pheasant and Sumatra Cochoa. Also
    recorded there are Salvadori''s Pheasant, Silver-eared Mesia, Chestnut-capped
    Laughingthrush, White-throated Fantail, Sunda Bush Warbler and Golden Babbler.


    # ### Nusa Penida Island


    Nusa Penida Island, strictly speaking in Bali province, is just east of the Wallace
    Line. Here you may see Lemon-bellied White-eye and Wallace''s Elegant Pitta.


