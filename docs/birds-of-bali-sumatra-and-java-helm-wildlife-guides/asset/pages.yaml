  md: 'Java, Sumatra and Bali lie along the edge of the South-east Asian tectonic
    plate, where it rides over the Australian-Indian plate, generating intense geological
    activity. A line of volcanoes, some still active, others dormant, forms a spine
    along the island chain. On Sumatra these create the Barisan Mountains, stretching
    the entire length of the island, and falling precipitously into the depths of
    the Ocean in the west; in east it drops more gently, giving rise to large swamp
    areas before reaching the Sunda Sea. On Java, the mountains arise in isolation
    from alluvial plains, and in east Sumatra, slope gently nor towards the Sunda
    Sea.


    At one time Bali was connected by a land-bridge to Java, but today it is separated
    by 3km of turbulent waters, renowned for their fierce currents. Not surprisingly,
    the fauna and flora of Bali show similarities to those of eastern Java. Sumatra,
    however, shows clearer affinities with Borneo than Java. The fragmentation of
    the landmasses combined with geological and climatic activity has resulted in
    the formation of many habitats, which in turn support a rich diversity of wildlife.
    This includes many endemic species: those confined to a single region or smaller
    area and found nowhere else.


    Java and Bali are among the most densely human-populated regions on Earth, and
    the destruction of the remaining wildlife habitats is a matter of serious concern.
    Only on remote mountain slopes can one find significant areas of natural forest.
    A few patches of lowland forest survive in national parks and nature reserves.
    Sumatra, with only a tenth of the population density, is marginally better off,
    the growth of agriculture, plantation and forestry is responsible for its increasing
    forest destruction.


    # The avifauna


    We might expect that these landmasses, which were at various times joined to mainland
    Asia, would have similar flora and fauna. As the various were not separated simultaneously,
    however, and because subsequent local climatic conditions have varied, the composition
    of the avifauna differs significantly from one island to another. Perhaps the
    most dramatic changes have been caused more recently, by man and his destruction
    of lowland forests. There are ample records dating back as far as 1657, and it
    is quite clear from the reports of the early 19th-century explorers who founded
    Indonesian ornithology that birds were far more plentiful then.'
