  md: '# Grey Wagtail Motacilla cinerea 17–20cm


    A typical wagtail in shape and tail-wagging behaviour, running and skipping among
    the rocks and running water. Its flight is markedly undulating. It has a grey
    crown and mantle, with bright yellow underparts


    rump. The chin and eye-stripe are whitish and the ear-covers greyish. The underparts
    of juveniles are much paler. The very long, black tail is edged white. The bill
    is dark brown and the feet are pinkish-grey.


    Where to see: Overwinters throughout the region. Prefers stony river beds, streams
    and damp meadows, from the coast to tops of mountains.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_216_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_216_1.png)'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Eastern Yellow Wagtail Motilla tschutschensis 17–18


    Many variations in plumage amongst the subspecies, especially in winter plumage,
    making identification difficult. Of typical wagtail shape and behaviour, the species
    is olive-brown or olive-green on the back, with yellow underparts. The commonly
    occurring M. t. simillima has a grey crown, yellow throat and white supercilium,
    and any variations could relate to other, more subspecies. Immatures have browner
    upperparts and whiter underparts.


    Where to see: Occurs as a winter visitor throughout the region. Commonly found
    in coastal lowlands, particularly pastures, rice fields and dried-up marshland.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_217_0.png)


    # Paddyfield Pipit Anthus rufifus 15–16


    Indonesian name: Apung Sawah


    Very similar in appearance to Richard’s Pipit (A. richardi) but is generally paler
    and has shorter legs. This very ordinary looking pipit has upperparts streaked
    grey-brown with lightly streaked buff underparts becoming white on the belly.
    It has a dark brown malar and submoustachial stripes and a long and broad buff
    supercilium that tapers off the back of the head. The tail is dark brown, as is
    the iris. The legs are flesh-coloured with a very long hind claw.


    Where to see: Occurs throughout the region in open grassland, rice fields and
    frequently by the roadside and close to cultivated land.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_217_1.png)'
