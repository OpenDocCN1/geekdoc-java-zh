  md: '# When and where to find birds


    As the region lies close to the equator, the climate is hot and humid. The monsoon
    weather patterns of the region are generalised by wet and dry seasons, which differ
    little in temperature. Even so, the birds show distinct breeding cycles. During
    the wet season, from October to March, large numbers of wintering migrants arrive
    from the north, with a smaller number of Australian species appearing during the
    dry season.


    Many waterbirds arrive at the end of the wet season, nesting in the safety of
    isolated trees in a flooded landscape. This is also the peak of the insect breeding
    season, when abundant food is available for insectivorous species to rear their
    young. Frugivorous species delay breeding a little longer, until the trees and
    bushes are bearing ripe fruit.


    Good breeding areas, with a rich diversity of habitats, abound throughout the
    region. Clearly, it is not possible to list them all in a book of this size, but
    to guide the birdwatcher to some of the more productive areas, the major reserves
    and national parks are described below. These are shown on the accompanying map
    at the front of the book.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_10_0.png)


    Chesnut-bellied Partridge.'
