  md: '# # Red Avadat Amandava amanda 9.5–10cm

    Indonesian name: Pipit Benggala


    For most of the year months and females look alike, but as the breeding season
    approaches, sexually dimorphic plumage becomes very apparent. Females have greyish-brown
    uppers and greyer sides to the head, with greyish-buff underparts and blackish
    wings and tail. The rump and bill are bright red. Breeding males become crimson-red
    on the back and breast, with small white spots on breast sides and flanks and
    also on the rump. The feet are pinkish-grey. It feeds mainly on seeding grasses
    but also occasionally insects.


    Where to see: The red-bellied subspecies occurs on Java and Bali and inhabits
    grassland and marshy areas often close to cultivation.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_208_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_208_1.png)'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Sunda Zebra Finch Taeniopygia guttata 10cm


    Indonesian name: Pipit Zebra


    The male has grey uppers from the top of the head to the white rump, where the
    uppermost-covers are barred with black. The ear-coverts are orange to dark orange
    and there is a grey eye-ring. From a lores a teardrop-shaped area thinly bordered
    black stands out from the grey area below the chin to the upper breast. There
    is a narrow black breast-band, below which the underparts become buffish-cream.
    The tail is black, iris dark orange and the bill red-orange. Legs pink. Females
    have much paler ear-coverts.


    Where to see: Occurs throughout the Lesser Sundas, from Lombok onwards. Occasionally
    appears in the more open, lowland coastal areas of Bali.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_209_0.png)


    # Tawny-breasted Parrotfinch Erythrura hyperythra 10cm


    Indonesian name: Bondol-hijau Dada-merah


    The upperparts from the top of the head are green becoming orange-brown on the
    uppermost-covers. The forehead is black blue where it meets the green on the top
    of the head. The underparts and face are a warm buff, the legs pinkish-red, the
    bill black and the iris brown. Females are duller and juveniles paler without
    blue on the forehead.


    Where to see: Occurs on Java and occasionally on Bali. It is mainly seen in moist
    montane forests and bamboo thickets, although it occurs in open grassland and
    rice fields.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_209_1.png)'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Pin-tailed Parrotfinch Erythrura prasina 12–15cm

    Indonesian name: Bondol-hijau Binglis


    This species has green upperparts, the rump long, pointed tail are red, and the
    lower belly and vent brownish-buff. The male has a red patch in the centre of
    the belly and blue throat, cheeks and forehead. It has a black bill becoming grey
    at the base, pink legs, dark brown iris and a dark grey eye-ring. A rare colour
    variation has the eye areas of plumage replaced by yellow. The female has a shorter
    tail, buff underparts, a greenish head, and a dull red tail, rump and undertailcoverts.
    Juveniles appear paler than the female.


    Where to see: Occurs on Sumatra and Java. Inhabits both montane and lowland moist
    forest, but also found in scrubland, bamboo thickets and rice plantations, often
    mixing with large flocks of munias.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_210_0.png)


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_210_1.png)'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Javan Munia Lonchura leucogastroides 11cm


    This munia has dark chestnut-brown upperparts, crown, tail and vent; black chin,
    throat and sides of face to the upper breast; and a white belly. It should not
    be confused with the White-bellied Munia (Lonchura leucogastra), which has fine
    pale grey streaking on the uppers, brown flanks and a yellowish-brown tail. The
    bill is pale greyish to blue. The legs are grey and the iris dark brown. Females
    and the juvenile is buff-brown with whitish underparts, spotted brown on the flanks
    and lower breast.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_211_0.png)


    Where to see: Occurs in south Sumatra, Java and Bali. Normally a grassland bird,
    it is attracted with


    other munias to the easy pickings of cultivated land and especially rice fields
    at harvest time.


    # Black-faced Munia Lonchura molucca 10–11cm


    Indonesian name: Bondol Taruk


    This munia has a black crown and earcovers and chin to the upper breast. The nape
    to the blackish upperwing-coverts is brown. The tail and uppertail-


    coverts are black. The lower breast and below, to the undertail-coverts, are white
    lined with narrow blackish barring. The bill is grey-blue and legs are grey. A
    grey eye-ring surrounds a black iris.


    Where to see: Occurs sporadically on Java and Bali. A typical munia that feeds
    on seeding grasses, often in rice fields.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_211_1.png)'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# # Scaly-breasted Munia Lonchura punctulata 10–12cm

    Indonesian name: Bondol Peking


    This species is easily identified by the scale appearance of its breast and flanks
    (that show as double scales in this subspecies). White feathers edged with brown.
    The upperparts and throat are brown without streaking. It has a red-brown face
    and throat. Bill is dark grey above, paler below, legs are grey and the iris is
    dark reddish-brown. Juveniles are paler and have a black bill.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_212_0.png)


    **Where to see:** Occurs throughout the region. It inhabits scrub, gardens and
    open grassland but is considered a pest to the farmer for raiding rice fields
    and crops.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_212_1.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Black-headed Munia Lonchura atricapilla 11–12cm

    Indonesian name: Bondol Rawa


    Apart from its black head, neck and chin to upper belly, plumage is dark chestnut
    with a black-brown patch on the centre of the lower belly in the north Sumatra
    subspecies (illustrated).

    nThe bill is pale blue-grey and legs dark grey. A dark grey eye-ring surrounds
    a brown iris.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_213_0.png)


    Where to see: Occurs on Sumatra, often in large flocks feeding from seeding grasses,
    but also in rice fields.


    # White-capped Munia Lonchura ferruginosa 11–12cm

    Indonesian name: Bondol Oto-hitam


    This munia has a whitish head inclusive of the nape and ear-covers and the chin
    to upper belly are black. The remaining plumage is dark chestnut with a black-brown
    patch on the centre of the lower belly reaching the undertail-covers. The bill
    is pale grey and legs medium grey. A dark grey eye-ring surrounds a brown iris.


    Where to see: Occurs on Java and Bali and very occasionally in south Sumatra.
    Often seen in large flocks feeding on seeding grass heads. Also in rice fields.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_213_1.png)'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# White-headed Munia Lonchura maja 11cm

    Indonesian name: Bondol Haji


    Quite small, with the head and throat completely white and a greyish nape. The
    remainder of the plumage is chestnut-brown, apart from a small",


    area of black on the belly. The bill and feet are pale bluish-grey and the iris
    is dark brown. Males and females are similar, the females often showing a darker
    crown and nape and paler underparts. Juveniles are brownish above and buff below
    with a creamy-white chin and throat.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_214_0.png)


    Where to see: A widespread lowland bird occurring throughout the region. Common
    on Java and Bali, where it prefers open grassland, as well as swamps, reedbeds
    and rice fields.


    # Pale-headed Munia Lonchura pallida 11cm

    Indonesian name: Bondol Kepala-pucat


    A small munia with a whitish-fawn head, pale grey nape and pale brown upperparts.
    The upper belly is pale grey-fawn and lower belly and flanks pale chestnut. The
    tail is chestnut, the bill pale blue-grey. Legs are grey and the brown iris is
    surrounded by a grey eye-ring.


    Where to see: Occurs on Bali and usually found in lowland open grassy scrub and
    rice fields, and often in the centre of towns.


    ![](img/e8dcc79b99f6b63c1dff9f174c158e29_214_1.png)'
