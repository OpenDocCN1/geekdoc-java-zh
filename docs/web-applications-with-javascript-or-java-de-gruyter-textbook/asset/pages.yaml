    The simplest case of a class hierarchy, which has only one level of subtyping,
    is called a *generalization* set in UML, but may be more naturally called **segmentation**.
    A segmentation is *complete*, if the union of all subclasses is equal to the extent
    of the superclass (or, in other words, if all instances of the superclass instantiate
    some subclass). A segmentation is *disjoint*, if all subclasses are pairwise disjoint
    (or, in other words, if no instance of the superclass instances more than one
    subclass). Otherwise, it is called *overlapping*. A complete and disjoint segmentation
    is a **partition**.


    ![](img/64ab58e459ff4b56e7fc22fe3998651a_143_1.png)


