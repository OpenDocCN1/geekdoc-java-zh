  md: '# U


    Unicode


    A platform-independent character set that includes almost all characters from
    most of the world''s script languages including Hindi, Burmese and Gaelic. Each
    character is assigned a unique integer code in the range between 0 and 1,114,111.
    For example, the Greek letter π has the code 960. Unicode includes legacy character
    sets like ASCII and ISO-8859-1 (Latin-1) as subsets. XML is based on Unicode,
    the Greek letter π (with code 960) can be inserted in an XML document as &#960;
    using the XML entity syntax. Encoding of Unicode characters in an XML document
    is UTF-8, which uses only a single byte for ASCII, but three bytes for less common
    characters.


    Uniform Resource Identifier


    A URI is either a Uniform Resource Locator (URL) or a Uniform Resource Name (URN).


    Uniform Resource Locator


    A URL is a resource name that contains a web address for locating the resource
    on the Web.


    Unified Modeling Language


    The UML is an industry standard that defines a set of modeling languages for making
    various kinds of models and diagrams in support of object-oriented problem analysis
    and software design. Its core languages are Class Diagrams for information/data
    modeling, and Sequence Diagrams, Activity Diagrams and State Diagrams (or State
    Charts) for process/behavior modeling.


    Uniform Resource Name


    A URN refers to a resource without specifying its location.


    User Agent


    A user agent is a front-end web client program such as a web browser.


    # W


    WebM


    WebM is an open (royalty-free) video format supported by Google Chrome and Firefox,
    but not by Microsoft Internet Explorer and Apple Safari. The WHATWG was established
    in 2004 by former employees of Apple, Mozilla, and Opera who have been unhappy
    with the slow progress of web technology standardization due to W3C''s choice
    to focus on the standardization of XHTML2. Led by Ian Hickson, developed HTML5
    and related JavaScript APIs in competition and collaboration with the W3C.


    Web Hypertext Application Working Group'
  merge: -1
