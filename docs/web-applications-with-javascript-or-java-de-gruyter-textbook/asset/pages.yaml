    \nFor instance, the Book class from the Entity class is coded in the following-way:\n\
    \n```\n@Entity @Table( name=\"books\")\n@ViewScopedBean(name=\"book\")\npublic\
    \ class Book {\n    @Id @NotNull(message=\"An ISBN is required\")\n    private\
    \ String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"A title is\
    \ required!\n```\n\nThe @ManyToOne annotation on the publisher is used for specifying\
    \ the functionality type of the association Book has Publisher represented by\
    \ the reference property publisher since it holds that a book has one publisher\
    \ and a publisher has many books. This annotation also allows to specify a fetch\
    \ type with the parameter taking one of the following two values:\n\n+   - FetchType.EAGER,\
    \ implying that a retrieval of an entity includes a retrieval of the associated\
    \ entity referenced by the entity property. In our example, this means that when\
    \ a Book entity is retrieved, the Publisher entity referenced by the book's publisher\
    \ property is also retrieved. This behavior is very"
