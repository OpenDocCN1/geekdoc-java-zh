  md: '# 84 7 Bidirectional Associations


    to the declaration of the property ClubMember::chairedCommittee, and a similar
    one to the property Committee::chair, as shown in the following diagram:


    | Committee | ClubMember |

    |--- |--- |

    | name : String | chairedCommittee[0..1] : Committee |

    | chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]
    : Committee |


    Using the reference path notation of OOP languages, with c referencing a Committee
    object, we obtain the equation:


    ```

    c.chair.chairedCommittee = c (7.1)

    ```


    Or, the other way around, with m referencing a ClubMember object, we obtain the
    equation:


    ```

    m.chairedCommittee.chair = m (7.2)

    ```


    Notice when the property $p_2$ is the inverse of a $p_1$, this implies that, the
    other way around, $p_1$ is the inverse of $p_2$. Therefore, when we declare the
    property ClubMember::chairedCommittee to the inverse of Committee::chair, then,
    implicitly, Committee::chair is the inverse of ClubMember::chairedCommittee. We
    therefore call Committee::chair and ClubMember::chairedCommittee a **pair of mutually
    inverse reference properties**. Having such a pair in a model implies *redundancy*
    because each of the two inverse reference properties can be derived from the other
    by inversion. This type of redundancy implies *data storage overhead* and *update
    overhead*, which is the price to pay for the bidirectional navigability that supports
    efficient object access in both directions.


    For maintaining the duplicate information of a mutually inverse reference property
    pair, it is common to treat one of the involved properties as the *master*, and
    the other as the *slave*, and take this distinction into consideration in the
    code of the methods (such as the property setters) of the affected model classes.
    We indicate the slave of an inverse reference property pair in a model by declaring
    the slave property to be a *derived* property using the UML notation of a slash
    (/) as a prefix of the property name as shown in the following diagram:


    | Committee | ClubMember |

    |--- |--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | coChairedCommittee[0..1] : Committee |


    The property chairedCommittee in ClubMember is now *derived* (as indicated by
    its slash prefix). Its annotation {inverse of chair} defines a *derivation rule*
    according to which it is derived by inverting the property Committee::chair.'
