  md: '# 1 Reference Properties and Unidirectional Associations


    A property defined for an object type, or class, is called a reference property
    if its values are references that reference an object of another, or of the same
    type. For instance, the Committee shown in Figure 1.1 below has a reference property
    chair, the values of which are references to objects of type ClubMember.


    An association between object types classifies relationships between objects of
    those types. For instance, the association Committee-hasClubMember-as-chair, which
    is visualized as a line in the class diagram shown in Figure 1.2 below, classifies
    the relationships FinanceCommittee-hasPeterMiller-as-chair, RecruitmentCommittee-hasSusanSmith-as-chair
    and AdvisoryCommittee-hasSarahAnderson-as-chair, where the objects PeterMiller,
    SusanSmith and SarahAnderson are of type ClubMember, and the objects FinanceCommittee,
    RecruitmentCommittee and AdvisoryCommittee are of type Committee. An association
    as a set of relationships can be represented as a table like so:


    | Committee-hasClubMember-as-chair | |

    | :--- | :--- |

    | Finance Committee | Peter Miller |

    | Recruitment Committee | Susan Smith |

    | Advisory Committee | Sarah Anderson |


    Reference properties correspond to a special form of association, namely to unidirectional
    binary associations. While a binary association does, in general, not need to
    be directional, a reference property represents a binary association that is directed
    from the property''s domain class (where it is defined) to its range class.


    In general, associations are relationship types with two or more object types
    participating in them. An association between two object types is called binary.
    In this book we only discuss binary associations. For simplicity, we just say
    ''association'' when we mean ''binary association''.


    While individual relationships (such as FinanceCommittee-hasPeterMiller-as-chair)
    are important items in business communication and in information systems, such
    as Committee-hasClubMember-as-chair) are important elements of information models.
    Consequently, software applications have to implement them in a proper way, typically
    as part of their model layer within a model-view-controller (MVC) architecture.
    Unfortunately, many application frameworks lack the required support for dealing
    with associations.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1 Reference Properties and Unidirectional Associations


    In mathematics, associations have been formalized in an abstract way as sets of
    uniform tuples, called relations. In Entity-Relationship (ER) modeling, which
    is the classical information modeling approach in information systems and software
    engineering, objects are called entities, and associations are called relationship
    types. The Unified Modeling Language (UML) includes the UML Class Diagram language
    for information modeling. In UML, object types are called classes, and individual
    relationships are called “links”. These terminologies are summarized in the following
    table:


    | Our preferred term(s) | UML | ER Diagrams | Mathematics |

    |---|---|---|--|\| object | object | entity | individual |

    | object type (class) | class | entity type | unary relation |

    | relationship | link | relationship | tuple |

    | association (relationship type) | association | relationship type | relation
    |

    | functional association | | one-to-one, many-to-one or one-to-many relationship
    type | function |


    We first discuss reference properties, which implicitly represent bidirectional
    associations in an “association-free” class model (a model without any explicit
    association element).


    # 1.1 References and Reference Properties


    A reference can be either human-readable or an internal object reference. Human-readable
    references refer to identifiers that are used in human communication, such as
    the unique names of astronomical bodies, the ISBN of books and the employee numbers
    of the employees of a company. Internal object references refer to the computer
    memory addresses of OOP objects, providing an efficient mechanism for accessing
    objects in the main memory of a computer.


    Some languages, like SQL and XML, only support human-readable, but not internal
    references. In SQL, human-readable references are called foreign keys, and the
    identifiers they refer to are called primary keys. In XML, human-readable references
    are called ID references and the corresponding attribute type is IDREF.


    Objects in an OO program can be referenced either with the help of human-readable
    references (such as integer codes) or with internal object references, which are
    preferable for accessing objects efficiently in main memory. Following the XML'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.1 References and Reference Properties — 5


    terminology, we call human-readable references ID references. We follow the standard
    naming convention for ID reference properties where an ID reference property defined
    in class A and referencing objects of class B has the name b_id using the suffix
    _id. When we store persistent objects in the form of records or rows, we need
    to convert internal object references, stored in properties like publisher_id,
    to ID references, stored in properties like publisher_id. This conversion is performed
    as part of the serialization of object by assigning the standard identifier value
    of the referenced object to the ID reference property of the referencing object.


    In OO languages, a property is defined for an object type, or class, which is
    its domain. The values of a property are either data values from some datatype,
    in which case the property is called an attribute, or they are object references
    referencing an object from some class, in which the property is called a reference
    property. For instance, the class Committee shown in Figure 1.1 below has an attribute
    name with range String, and a reference property chair with range ClubMember.


    | Committee ClubMember |

    | :--- | :--- |

    | name: String | |

    | chair: ClubMember |


    Figure 1.1: A committee has a club member as chair expressed by the reference
    property chair.


    Object-oriented programming languages, such as JavaScript, PHP, Java and C#, directly
    support the concept of reference properties, which are properties whose value
    is not a datatype but a reference type, or class, and whose values are object
    references to instances of that class.


    By default, the multiplicity of a property is 1, which means that the property
    is mandatory and functional (or, in other words, single-valued), having exactly
    one value, like the property chair in class Committee shown in Figure 1.1. By
    a functional property is optional (not mandatory), it has the multiplicity 0..1,
    which means that the property''s minimum cardinality is 0 and its maximum cardinality
    is 1.


    A reference property can be either single-valued (functional) or multi-valued
    (non-functional). For instance, the reference property Committee::chair shown
    in Figure 1.1 is single-valued, since it assigns a unique club member chair to
    a club. An example of a multi-valued reference property is provided by the property
    Book::authors shown in Figure 1.11.


    Normally, the collection value of a multi-valued reference property is a set of
    references, implying that the order of the references does not matter. In certain
    cases, however, the order matters and, consequently, the collection value of such
    a multi-valued reference property is an ordered set of references, typically implemented
    as a list.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 1.2 Referential Integrity


    References are important information items in our application''s database. However,
    they are only meaningful, when their referential integrity is maintained by the
    app. This requires that for any reference, there is a referenced object in the
    database. Consequently, any reference property p with domain class C and range
    class D comes with a referential integrity constraint that has to be checked whenever


    +   1. a new object of type C is created,

    2. the value of p is changed for some object of type C,

    3. an object of type D is destroyed.


    A referential integrity constraint also implies two change dependencies:


    +   1. An object creation dependency: an object with a reference to another object
    can only be created after the referenced object has been created.

    2. An object destruction dependency: an object that is referenced by another object
    can only be destroyed after

    1. the referencing object is destroyed first (the CASCADE deletion policy), or

    2. the reference in the referencing object is either dropped (the DROP-REFERENCE
    deletion policy) or replaced by another reference.


    For every reference property in our app''s model classes, we have to choose, which
    of these two property deletion policies applies.


    In certain cases, we may want to relax this strict regime and allow creating objects
    that have non-referencing values for an ID reference property, but we do not consider
    such cases.


    Typically, object creation dependencies are managed in the user interface by not
    allowing the user to enter a value of an ID reference property, but only to select
    from one a list of all existing target objects.


    # 1.3 Modeling Reference Properties as Unidirectional Associations


    A reference property (such as chair in the example shown in Figure 1.1 above)
    can be modeled in a UML class diagram in the form of an association ended by its
    domain class, which is visualized with the help of a small filled circle (also
    called a “dot”). This requires to connect the domain class and the range class
    of the reference property with an association line, place an ownership dot at
    the end of this line on the range side, and annotate this association with the
    property name and with a multiplicity symbol, as shown in Figure 1.2 below for
    the case of our example. In this way we get a unidirectional association, the
    source class of which is the property’s domain and the target class of which is
    the property’s range.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 1.3 Modeling Reference Properties as Unidirectional Associations


    The fact that an association is **owned** by the class at the other end, as visually
    expressed by the association end **ownership** dot at the association end chair
    in the example shown in Figure 1.2 below, implies that the association represents
    a reference-property. In the example of Figure 1.2, the represented reference
    property is Committee::chair having ClubMember as range. Such an association,
    with only one association end ownership dot, is *unidirectional* in the sense
    that it allows `navigation` (access) in one direction only: from the class at
    the opposite side of the dot (the **source class**) to the class where the dot
    is placed (the **target class**).


    | Committee | ClubMember |

    |--- | --- |

    | name : String | 0.1 | 1 |


    **Figure 1.2:** An association with a "dot".


    Thus, the two diagrams shown in Figures 1.1 and 1.2 essentially equivalent models.
    When a reference property, like chair in Figure 1.1, is modeled by an association
    with a "dot", then the property''s multiplicity is attached to the association
    end. Since in a design model, association ends need to have a multiplicity, we
    also have to define a multiplicity for the other end at the side of the Committee
    class, which represents the inverse of the property. This multiplicity (of inverse
    property) is not available in the original property description in the model shown
    in Figure 1.1, so it has to be added by answering the intended semantics of the
    association. The question "is it mandatory that any ClubMember is the chair of
    a Committee?" for finding the minimum cardinality and the question "can ClubMember
    be the chair of more than one Committee?" for finding the maximum cardinality.


    When the value of a property is a set of values from its range, the property **non-functional**
    and its multiplicity is either 0..* or n..* . Instead of 0..*, we can simply write
    the asterisk symbol *. The association shown in Figure 1.2 assigns one object
    of type ClubMember as chair to an object of type Committee. Consequently, it''s
    an example of a **functional association**.


    An overview over the different cases of functionality of an association is provided
    in Table 1.1.


    Notice that the directionality and the functionality type of an association are
    independent of each other. So, a unidirectional association can be either functional
    (one-to-one or many-to-one), or non-functional (one-to-many or many-to-many).'
  merge: -1
