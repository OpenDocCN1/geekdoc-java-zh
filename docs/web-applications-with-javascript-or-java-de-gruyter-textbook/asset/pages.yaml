    ```


    There are two ways to realize the derivation of a property: it may be **derived
    on** via a read-time computation of its value, or it may be **derived on** via
    an update-time computation performed whenever one of the variables in the derivation
    expression (typically, another property) changes its value. The latter case responds
    to a **materialized view** in a database. While a reference property that is derived
    on read may not guarantee efficient navigation, because the on-read computation
    may create unacceptable latencies, a reference property that is derived on update
    provides efficient navigation.


    When we designate an inverse reference property as derived by prefixing its name
    with a slash (/), we indicate that it is derived on update. For the property /chairedCommittee
    in the example above is derived on update from the property chair.


    In the case of a derived reference property, we have to deal with **life-cycle
    dependencies** between the affected model classes requiring special change management
    mechanisms based on the functionality of the represented association (either **one-to-one**,
    **many-to-one** or **many-to-many**).


    In our example of the inverse reference property ClubMember::chairedCommittee,
    which is single-valued and optional, this means that


    +   1. whenever a new committee object is created (with a mandatory chair assignment),
    the corresponding ClubMember::chairedCommittee property has to be assigned accordingly;

    2. whenever the chair property is updated (that is, a new chair is assigned to
    a committee), the corresponding ClubMember::chairedCommittee property has to be
    unset for the club member who was the previous chair and set for the new chair;

    3. whenever a committee object is destroyed, the corresponding ClubMember::chairedCommittee
    property has to be unset.'
