  md: '# 12 Subtyping and Inheritance


    The concept of a subtype, or subclass, is a fundamental concept in natural language,
    mathematics, and informatics. For instance, in English, we say that a bird is
    an animal, or the class of all birds is a subclass of the class of all animals.
    In linguistics, the noun "bird" is a hyponym of the noun "animal".


    An object type may be specialized by subtypes (for instance, By Parrot) or generalized
    by subtypes (for instance, Bird and Mammal are generalized by Animal). Specialization
    and generalization are two sides of the same coin.


    A subtype inherits all features from its supertypes. When a subtype inherits attributes,
    associations and constraints from a subtype, this means these features need not
    be repeatedly rendered for the subtype in the class diagram, but the reader of
    the diagram has to understand that all features of a subtype also apply to its
    subtypes.


    When an object type has more than one direct supertype, we have a case of multiple
    inheritance, which is common in conceptual modeling, but prohibited in many object-oriented
    programming languages, such as Java and C#, which only allow class hierarchies
    with a unique direct supertype for each object type.


    # 12.1 Introducing Subtypes by Specialization


    A new object type may be introduced by specialization whenever it represents a
    special case of another object type. We illustrate this for our example model
    where we capture text books and biographies as special cases of books. This means
    that text books and biographies also have an ISBN, a title and a publishing year,
    but in addition they have further features such as the attribute subjectArea for
    text books and biographies. Consequently, in Figure 12.1, we introduce the object
    types Textbook and Biography by specializing the object type Book, that is, as
    subtypes of.


    ![](img/64ab58e459ff4b56e7fc22fe3998651a_139_0.png)'
