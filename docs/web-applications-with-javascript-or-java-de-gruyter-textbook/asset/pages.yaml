  md: 'In a UML class diagram, the derivation of a property can be specified by an
    OCL **derive** expression that evaluates the value of the derived property for
    a given object. In the case of a property being the inverse of another property,
    specified by the constraint expression (**inverse of anotherProperty**) appended
    to the property declaration, the derivation expression is implied. In our example,
    for any club member m, it evaluates to the committee c such that **c.chair = m**.
    In OCL, this derivation rule would be executed on committee object


    ```

    context ClubMember::chairedCommittee: Committee

