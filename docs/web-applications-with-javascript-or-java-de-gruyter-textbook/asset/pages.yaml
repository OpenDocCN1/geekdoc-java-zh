    When all non-root types have a unique direct supertype, the type hierarchy is
    a **single-inheritance hierarchy**, otherwise it''s a **multiple-inheritance hierarchy**.
    For instance, in Figure 12.5 below, the class Vehicle is the root of a single-inheritance
    hierarchy, while Figure 12.6 shows an example of a multiple-inheritance hierarchy,
