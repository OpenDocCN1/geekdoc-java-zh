    \ references in the serialization function toString() and the conversion function\
    \ toRecord(), as well as in the constructor function.\n\n+   2. In the user interface\
    \ (“view”) code we have to take care of\n    1. showing information about associated\
    \ objects in the Retrieve/List use case;\n    2. allowing to select an object\
    \ from a list of all instances of the association’s target class and add it to,\
    \ or remove an object from, a list of associated objects, in the Create and Update\
