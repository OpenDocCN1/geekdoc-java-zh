  md: '# 13.3.2 Make a JS Entity Table Model


    Since we use the browsers'' Local Storage as the persistent storage technology
    for our example app, we have to deal with simple key-value storage. For each design
    model class with a singular (capitalized) name Entity, we use its pluralized lowercase
    name entities as the corresponding table name and as a key that its associated
    string value is obtained by serializing the object collection Entity instances
    with the help of the JSON.stringify method.


    We design a suitable JS entity tables in the form of a JS entity table that we
    derive from the information design model. We have to make certain choices how
    to organize our data and how to derive a corresponding entity table model.


    The first choice to make concerns using the Single Table Inheritance (STI), the
    Table per Class Inheritance (TCI) or the Joined Tables Inheritance (JTI) approach,
    which are introduced in Section 12.7.4. In the STI approach, a segmentation (or
    an entire hierarchy) is represented with a single table, containing columns for
    all attributes of classes involved, and shown in the example model of Figure 13.3.


    | JS entity table » | category: |

    | --- | --- |

    | personid[1]: number (pkey) | 1 = Author |

    | name[1]: string | 2 = Employee |

    | categories[1]: number (1,2,3) | 3 = Employee & Manager |

    | biography[0]: string | |

    | empno[0]: number (unique) | |

    | department[0]: string | |


    **Figure 13.3:** An STI model of the Person roles class hierarchy.


    Since the given segmentation is non-disjoint, a multi-valued enumeration attribute
    categories is used for representing the information to which subclasses an instance
    belongs.


    Using the STI approach is feasible for the given example, the role hierarchy does
    not have many levels and the segment subclasses do not add more attributes. But,
    in a more realistic example, we would have more attributes in the segment subclasses
    of the given role hierarchy. The STI approach is not really an option for representing
    a multi-level role hierarchy. However, we may choose it for representing the single-segment
    class hierarchy Manager-is-subclass-of-Employee.


    For simplicity, and because the browsers'' Local Storage does not support foreign
    keys as required by JTI, we choose the TCI approach, where we obtain a rate table
    for each class of the Person segmentation, but without foreign keys. Our'
