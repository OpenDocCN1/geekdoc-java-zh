  md: "# Foreword\n\nThis two-volume book shows how to design and implement web applications\
    \ with a model-based engineering approach, using the two most relevant technology\
    \ platforms for web development: JavaScript and Java. Web apps are designed with\
    \ the help of information models in the UML class diagrams and implemented as:\n\
    \n+   1. JavaScript front-ends, using one of the two local storage technologies\
    \ offered by browsers;\n2. Java back-end apps, using Java Server Faces (JSF) as\
    \ the interface technology, the Java Persistence API (JPA) for object-to-storage\
    \ mapping, and a MySQL/MariaDB database management system.\n\nThe focus of the\
    \ book is general concepts and techniques concerning the fundamental information\
    \ management issues of\n\n+   1. integrity constraints and data validation,\n\
    2. enumerations and enumeration attributes\n3. unidirectional and bidirectional\
    \ associations between object types,\n4. subtyping and inheritance in class hierarchies.\n\
    \nThe first two issues of this list are discussed in Volume 1 of the book, while\
    \ the last two issues are discussed in Volume 2.\nWe assume that the reader is\
    \ already familiar with HTML and with at least one object-oriented programming\
    \ language, such as C++, Java, PHP, Python or C#. In addition, we assume that\
    \ the reader has some familiarity with CSS and JavaScript, and is interested to\
    \ learn more about programming with JavaScript or Java.\nThe book can be used\n\
    \n+   1. in web development courses for students of Computer Science or Information\
    \ Systems and related disciplines;\n2. by JavaScript developers for learning Java;\n\
    3. by Java developers for learning JavaScript;\n4. by JavaScript and Java (and\
    \ PHP/Python/C#) developers for learning\n   - object-oriented (OO) programming\
    \ with JavaScript or Java,\n   - how to implement basic information management\
    \ concepts and build complete apps with plain JavaScript or Java.\n\nThe book\
    \ comes with the complete source code of six example apps that you can run or\
    \ download from our web server."
