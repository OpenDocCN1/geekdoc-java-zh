  md: '# Glossary


    # C


    CRUD


    CRUD is an acronym for *Create, Read/Retrieve, Update, Delete*, which denote the
    four basic data management operations to be performed by any software application.


    Cascading Style Sheets


    CSS is used for defining the presentation style of web pages by telling the browser
    how to render their HTML (or XML) contents: using which layout of content elements,
    fonts and text styles, which colors, backgrounds, and which animations. Normally,
    these settings are made in a separate CSS file that is associated with an HTML
    file via a special link element in the HTML''s head.


    # D


    Document Object Model)


    The DOM is an abstract API for retrieving and modifying nodes and elements of
    HTML or XML documents. All programming languages have DOM bindings that realize
    the DOM.


    Domain Name System


    The DNS translates user-friendly domain names to IP addresses that allow to locate
    a host computer on the Internet.


    # E


    ECMAScript


    Extensible Markup Language


    A standard for JavaScript defined by the industry organization "Ecma International".


    XML allows to mark up the structure of all kinds of documents, data files and
    messages in a machine-readable way. XML may also be human-readable, if the tag
    names are self-explaining. XML is based on Unicode. SVG and MathML are based on
    XML, and there is an XML-based version of HTML.


    XML provides a syntax for expressing structured information in the form of an
    XML document with *elements and their attributes*. The specific elements and attributes
    used in an XML document can come from any vocabulary, such as public standards
    or user-defined XML formats.'
