  md: '# 12.7.2 Subtyping and Inheritance with XML Schema


    In XML Schema, a subtype can be defined by extending or by restricting an existing
    complex type. While extending a complex type means extending its intention by
    adding elements or attributes, restricting a complex type means restricting its
    extension by adding constraints.


    We can define a complex type Person and a subtype Student by extending Person
    in the following way:


    ```

    <xs:complexType name="Person">

    <xs:attribute name="firstName" type="xs:string" />

    <xs:attribute name="lastName" type="xs:string" />

