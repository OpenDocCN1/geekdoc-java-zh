  md: "# 2.2 Implementing Single-Valued Reference Properties — 23\n\nthis.year = year;\n\
    ...\n}\n}\n\nA single-valued reference property, such as the property publisher\
    \ of the object type Book, allows storing internal references to objects of another\
    \ type, such as Publisher. When creating a new object, the constructor function\
    \ needs to have a parameter for allowing to assign a suitable value to the reference\
    \ property. In a typed programming language, such as Java, we would have to take\
    \ a decision if this value is expected to be an (internal) object reference or\
    \ an (external) ID reference. In JavaScript, however, we can take a more flexible\
