    model classes),

    3. how to write the view and controller code based on the entity classes.


    # 9.1 Make a Java Entity Class Model


    The starting point for making a Java Entity class model is an OO class model derived
    inverse reference properties like the one discussed above (in Figure 7.4), which
    we present here again, for convenience:


    | Book | Publisher |

