  md: '# H


    Hypertext Markup Language


    HTML allows marking up (or describing) the structure of a human-readable web document
    or web user interface. The XML-based version of HTML, which is called “XHTML5”,
    provides a simpler and cleaner syntax compared to traditional HTML.


    Hypertext Transfer Protocol


    HTTP is a stateless request/response protocol based on the Internet technologies
    TCP/IP and DNS, using human-readable text messages for the communication between
    clients and web servers. The main purpose of HTTP has been to allow fetching web
    documents identified by URLs from a web browser, invoking the operations of a
    back-end web application program from an HTML form executed by a web browser.
    More recently, HTTP is increasingly used for providing APIs and web services.


    # I


    IANA


    IANA stands for Internet Assigned Numbers Authority, which is a subsidiary of
    ICANN responsible for names and numbers used by Internet protocols.


    ICANN


    ICANN stands for Internet Corporation of Assigned Names and Numbers, which is
    an international nonprofit organization that maintains the domain name system.
    A JavaScript API for indexed data storage managed by browsers. Indexing allows
    high-performance searching. Like many SQL DBMS, IndexedDB supports database transactions.


    IndexedDB


    A set of best practices that help to adapt products to your target language and
    culture. It deals with multiple character sets, units of measure, keyboard layouts,
    time and date formats, and text directions.


    I18N


    # J


    JSON


    JSON stands for JavaScript Object Notation, which is a data-interchange format
    following the JavaScript syntax for object literals. Many programming languages
    use JSON as a light-weight alternative to XML.'
