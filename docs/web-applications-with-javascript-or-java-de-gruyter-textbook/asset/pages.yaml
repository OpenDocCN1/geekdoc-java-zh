    references is the master. For instance, the authorship association between the
    classes Book and Author represents an ontological existence dependency of books
    on their authors. A book existentially depends on its author(s), while an author
    does not existentially depend on any of her books. Consequently, the corresponding
    object lifecycle dependency between Book and Author implies that their bidirectional
    association is maintained by maintaining Author references in Book::authors as
    the natural choice of master property, while Author::authoredBooks is the slave
    property, which is derived from Book::authors.


