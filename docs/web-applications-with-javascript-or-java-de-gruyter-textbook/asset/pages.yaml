    | isbn[1]: String (id) | name[1]: String (id) |

    | title[1]: String | address[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | personid[1]: Integer (id) |

    | authors[*]: Author | name[1]: String |

    | | /authoredBooks[*]: Book (inverse of authors) |


    Notice that the model contains two inverse reference properties: Publisher::publishedBooks
    and Author::/authoredBooks. Each of them is linked to a master property, from
    which it is derived, by means of an inverse-of constraint. Consequently, each
    of them represents a pair of mutually inverse reference properties corresponding
    to a bidirectional association.


    +   We now show how to derive a Java Entity class model from the OO class model:

    1. Turn each class into a «Java Entity», making all properties private.

    2. Replace the platform-independent datatype names of the OO class model with
    corresponding Java datatype classes (Integer, Float, etc.).

    3. Add a «get/set» stereotype to all non-derived properties for indicating that
    they need getters and setters.

    4. Add a «get» stereotype to all derived properties for indicating that they need
    getters.'
