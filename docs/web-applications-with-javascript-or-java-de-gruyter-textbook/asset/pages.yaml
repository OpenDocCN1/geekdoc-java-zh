  md: '# 13.3 Case Study2: Implementing a Class Hierarchy


    Whenever a class hierarchy is more complex, we cannot simply eliminate it, but
    have to implement it (1) in the app''s model code, (2) in the underlying database
    and (3) in its user interface.


    The starting point for our case study is the design model shown in Figure 12.8
    above. In the following sections, we derive a JS class model and a JS entity table
    from the design model. The entity table model is used as a design for the object-to-storage
    mapping that we use for storing the objects of our app with the browsers; Local
    Storage technology.


    # 13.3.1 Make a JS Class Model


    We design the classes of our example app with the help of a JS class model that
    we derive from the design model by essentially leaving the generalization rows
    as are and just adding get/set methods and static check functions to each class.
    However, in the case of our example app, it is natural to apply the Class Hierarchy
    Merge design pattern (discussed in Section 12.6) to the single-subclasssegmentation
    of Employee for simplifying the class model by eliminating the Manager subclass.
    This leads to the model shown in Figure 13.2 below. Notice that a Person may be
    an Employee or an Author.


