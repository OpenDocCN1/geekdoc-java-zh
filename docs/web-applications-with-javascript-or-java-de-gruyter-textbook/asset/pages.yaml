    The starting point for our case study is the design model shown in Figure 12.8
    above. In the following sections, we show how to eliminate the Manager class using
    the Class Hierarchy Merge design pattern and how to implement the Person hierarchy
    and use Joined, Multiple Table Inheritance storage with the help of JPA framework.


    # ## 14.3.1 Make the Java Entity class model


    We design the model classes of our example app with the help of a Java Entity
    model that we derive from the design model by essentially leaving the generalization
    as they are and just adding getters and setters to each class. However, in the
    case of our example app, it is natural to apply the Class Hierarchy Merge design
    pattern to the segmentation of Employee for simplifying the data model by eliminating
    the Manager subclass. This leads to the model shown in Figure 14.2 below. Note
    that we have also made two technical decisions:


