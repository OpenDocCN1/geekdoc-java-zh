    }\n}\n}\n```\n\n# 2.5.5 Choose and Implement a Deletion Policy\n\nFor any reference\
    \ property, we have to choose and implement one of the two possible deletion policies\
    \ discussed in Section 1.2 for managing the corresponding object destruction dependency\
    \ in the destroy method of the property's range class. In our case, when deleting\
    \ a publisher record we have to choose between\n\n+   1. deleting records of books\
    \ published by the deleted publisher (Existential Dependency);\n2. dropping from\
    \ all books published by the deleted publisher reference to the deleted publisher\
    \ (Existential Independence).\n\nAssuming that books do not essentially depend\
    \ on their publishers, we choose the second option. This is shown in the following\
    \ code of the Publisher.destroy method where for all concerned book objects the\
    \ property book.publisher is cleared:\n\n```\nPublisher.destroy = function (name)\
    \ {\n    const publisher = Publisher.instances[name];\n    // delete all references\
    \ to this publisher in book objects\n    for (let key of Object.keys(Book.instances))\
    \ {\n        const book = Book.instances[key];\n        if (book.publisher ===\
    \ publisher) {\n            delete book.publisher; // delete the slot\n      \
    \      console.log(\"Book \" + book.isbn + \" updated.\");\n        }\n    }\n\
    \    // delete the publisher record\n    delete Publisher.instances[name];\n \
    \   console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\nNote that\
    \ the deletion of all references to the deleted publisher is performed in a sequential\
    \ scan through all book objects, which may be inefficient when there are many\
    \ of them. It would be much more efficient when each publisher object would hold\
