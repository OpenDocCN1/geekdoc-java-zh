    \    // optional properties\n    if (category) this.category = category;\n   \
    \ if (subjectArea) this.subjectArea = subjectArea;\n    if (about) this.about\
    \ = about;\n  }\n  get isbn() { . . }\n  static checkIsbn(isbn) { . . }\n  static\
    \ checkIsbnAsId(isbn) { . . }\n  set isbn(isbn) { . . }\n  get title() { . . }\n\
    \  static checkTitle(t) { . . }\n  set title(t) { . . }\n  get year() { . . }\n\
    \  static checkYear(y) { . . }\n  set year(y) { . . }\n  get category() { . .\
    \ }\n  static checkCategory(c) { . . }\n  set category(c) { . . }\n  get subjectArea()\
    \ { . . }\n  static checkSubjectArea(sA, cat) { . . }\n  set subjectArea(s) {\
    \ . . }\n  get about() { . . }\n  static checkAbout(a, cat) { . . }\n  set about(a)\
    \ { . . }\n}\n```\n\n## 13.2 Case Study 1: Eliminating a Class Hierarchy\n\nNote\
    \ that the constructor function is defined with a single record parameter using\
    \ the ES2015 feature of function parameter destructuring.\nWe code the checkCategory\
    \ and setCategory methods for the category attribute in the following way:\n\n\
    ```javascript\nstatic checkCategory(c) {\n  if (c === undefined || c === \"\"\
    ) {\n    return new NoConstraintViolation(); // category is optional\n  } else\
    \ if (!util.isIntegerOrIntegerString(c) || parseInt(c) < 1 ||\n    parseInt(c)\
    \ > BookCategoryEL.MAX) {\n    return new NoConstraintViolation(\n      \"Invalid\
    \ value for category: \" + c);\n  } else {\n    return new NoConstraintViolation();\n\
    \  }\n}\nset category(c) {\n  var validationResult = null;\n  if (this.category)\
    \ { // already set/assigned\n    validationResult = new FrozenConstraintViolation(\n\
    \      \"The category cannot be changed!\");\n  } else {\n    validationResult\
    \ = Book.checkCategory(c);\n  }\n  if (validationResult instanceof NoConstraintViolation)\
    \ {\n    this._category = parseInt(c);\n  } else {\n    throw validationResult;\n\
    \  }\n}\n```\n\nWhile the getters for segment properties (in this example: subjectArea\
    \ and about) follow the standard pattern, their checks and setters have to make\
    \ sure that the property applies to the category of the instance being checked.\
    \ This is achieved by checking a combination of a property value and a category,\
    \ as in the following example:\n\n```javascript\nstatic checkSubjectArea(sa)\n\
    ```\n\nIn the serialization function toString, we serialize the category attribute\
    \ and the segment properties in a switch statement:\n\n```javascript\ntoString()\
    \ {\n  var bookStr = \"Book(ISBN:\" + this.isbn + \", title:\" + +\n    this.title\
    \ + \", year:\" + this.year;\n  switch (this.category) {\n    case BookCategoryEL.TEXTBOOK:\n\
    \      bookStr += \", textbook subject area:\" + this.subjectArea;\n      break;\n\
    \    case BookCategoryEL.BIOGRAPHY:\n      bookStr += \", biography about:\" +\
    \ this.about;\n      break;\n  }\n  return bookStr + \"}\";\n}\n```\n\nIn the\
    \ update method of a model class, we only set a property if it is to be updated,\
    \ that is, if there is a corresponding argument slot with a value that is different\
    \ from the old property value. In the special case of a category attribute with\
    \ a Frozen Value Constraint, we need to make sure it can only be updated, along\
    \ with an accompanying set of segment properties, if it has not yet been assigned.\
    \ Then, in the book update method, we perform the special test if book.category\
    \ === undefined for handling the special case of an initial assignment, while\
    \ we handle updates of the segment properties subjectArea and in a more standard\
    \ way:\n\n```javascript\nBook.update = function ({isbn, title, year,\ncategory,\
    \ subjectArea, about}) {\n  const book = Book.instances[isbn];\n  objectBeforeUpdate\
    \ = util.cloneObject(book);\n  var noConstraintViolated=true, updatedProperties=[];\n\
    \  try {\n    .\n    if (category && book.category !== category) {\n      book.category\
    \ = category;\n      updatedProperties.push(\"category\");\n    } else if (category\
    \ === \"\" && category in book) {\n      throw FrozenConstraintViolation(\"The\
    \ category cannot be unset!\");\n    }\n    if (subjectArea && book.subjectArea\
    \ !== subjectArea) {\n      book.subjectArea = subjectArea;\n      updatedProperties.push(\"\
    subjectArea\");\n    }\n    if (about && book.about !== about) {\n      book.about\
    \ = about;\n      updatedProperties.push(\"about\");\n    }\n  } catch (e) {\n\
    \    .\n  }\n};\n```\n\n## 13 Subtyping with Plain JS\n\n### 13.2 Case Study 1:\
    \ Eliminating a Class Hierarchy\n\n### 13.2.4.1 Summary\nWe have to take care\
    \ of the category attribute and the segment properties subjectArea and about in\
    \ the following way:\n- Adding a special column to the display table.\n- Adding\
    \ a selection field for category.\n- Showing segment properties only when a category\
    \ is selected.\n\n### 13.2.4.2 Add a Segment Column in Retrieve All\nWe add a\
    \ special column to the display table. A book without a category will have an\
    \ empty cell in this column:\n\n```html\n<table id=\"books\">\n  <head>\n    <tr>\n\
    \      <th>ISBN</th>\n      <th>Title</th>\n      <th>Year</th>\n      <th>Category</th>\n\
    \    </tr>\n  </head>\n  <tbody>\n</table>\n```\n\nIn the view/books.js file,\
    \ this requires a switch statement for the category:\n\n```javascript\nif (book.category)\
    \ {\n  switch (book.category) {\n    case BookCategoryEL.TEXTBOOK:\n      row.insertCell(-1).textContent\
    \ = book.subjectArea;\n      break;\n    case BookCategoryEL.BIOGRAPHY:\n    \
    \  row.insertCell(-1).textContent = \"about \" + book.about;\n      break;\n \
    \ }\n}\n```\n\n### 13.2.4.3 Add a Category Selection Field in Create and Update\n\
    In both cases, we need to allow selecting a special category of book ('textbook'\
    \ or 'biography') with the help of a selection field, as shown in the following\
    \ HTML:\n\n```html\n<div class=\"field\">\n  <label>Category: <select name=\"\
    category\"></select></label>\n</div>\n<div class=\"field Textbook\"><!---- conditional\
    \ field -->\n  <label>Subject area: <input type=\"text\" name=\"subjectArea\"\
    \ /></label>\n</div>\n<div class=\"field Biography\"><!---- conditional field\
    \ -->\n  <label>About: <input type=\"text\" name=\"about\" /></label>\n</div>\n\
    ```\n\nNote that we have added \"Textbook\" and \"Biography\" as additional values\
    \ of the class attribute of the segment field container. This supports the rendering\
    \ and un-rendering of \"Textbook\" and \"Biography\" fields, depending on the\
    \ value of the category attribute. In the handleCategorySelectChangeEvent handler,\
    \ segment property form fields are only displayed, with pl.v.app.displaySegmentFields,\
    \ when a corresponding book category has been selected.\n\n```javascript\npl.v.books.handleCategorySelectChangeEvent\
    \ = function (e) {\n  var formEl = e.currentTarget.form,\n  categoryIndexStr =\
    \ formEl.category.value;\n  if (categoryIndexStr) {\n    pl.v.app.displaySegmentFields(formEl,\
    \ BookCategoryEL.labels,\n    parseInt(categoryIndexStr) + 1);\n  } else {\n \
    \   pl.v.app.undisplayAllSegmentFields(formEl, BookCategoryEL.labels);\n  }\n\
    }\n```\n"
