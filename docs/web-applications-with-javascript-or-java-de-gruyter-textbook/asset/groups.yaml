    \ 13.3.2 构建 JS 实体表模型\n\n由于我们使用浏览器的 Local Storage 作为示例应用的持久化存储技术，我们必须处理简单的键值存储。对于每个以单数（大写）名称\
    \ `Entity` 表示的设计模型类，我们使用其复数小写名称 `entities` 作为对应的表名，并作为键；其关联的字符串值通过 `JSON.stringify`\
    \ 方法序列化 `Entity` 实例的集合来获取。\n\n我们根据信息设计模型推导出的 JS 实体表的形式设计了合适的 JS 实体表。我们必须对如何组织数据以及如何推导出相应的实体表模型做出某些选择。\n\
    \n第一个选择关乎使用**单表继承 (STI)**、**按类继承 (TCI)** 或**连接表继承 (JTI)** 方法，这些方法在 12.7.4 节中介绍。在\
    \ STI 方法中，一个分段（或整个层次结构）由单个表表示，其中包含所有相关类属性的列，如图 13.3 的示例模型所示。\n\n| JS entity table\
    \ | category: |\n| :--- | :--- |\n| personid[1]: number (pkey) | 1 = Author |\n\
    | name[1]: string | 2 = Employee |\n| categories[1]: number (1,2,3) | 3 = Employee\
