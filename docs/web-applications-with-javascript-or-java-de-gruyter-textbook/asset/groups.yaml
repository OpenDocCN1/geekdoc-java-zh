    \ is iterable\nfor (let dEl of divElems) {\nconsole.log(dEl.id);\n}\n```\n\nA\
    \ *for-of* loop is often more handy than a *for* loop whenever a counter variable\
    \ is not needed. As opposed to a *forEach* loop, a *for-of* loop allows iterating\
    \ HTMLCollections and can be abandoned with break.\n\n## 2.1.4 Template Literals\n\
    \n... are enclosed by backtick characters (like `...` ) instead of double or single\
