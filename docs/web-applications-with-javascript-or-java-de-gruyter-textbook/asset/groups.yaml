    Author author = em.find(Author.class, personId);\n// Find all books of this author\n\
    Query query = em.createQuery(\"SELECT DISTINCT b FROM b \"+\nINNER JOIN b.authors\
    \ WHERE a.personId = :personId\");\nquery.setParameter(\"personId\", personId);\n\
    List<Book> books = query.getResultList();\n// Remove the author reference from\
    \ the books' authors\nfor (Book b : books) {\n  b.getAuthors().remove(author);\n\
    }\n// Delete the author record (table row)\nem.remove(author);\nut.commit();\\\
    }\n```\n\nEssentially, the delete operation consists of three steps:\n\n+   1.\
    \ Create a JPQL query which selects all books of this author (since this is a\
    \ unidirectional association from books to authors, the books of an author are\
    \ not accessible from author).\n2. For every found book referencing this author,\
    \ we have to remove the author reference from its authors list.\n3. Finally, delete\
    \ the author record.\n\n# 5.4.4 Serialization and De-Serialization\n\nIn Java\
    \ EE, the serialization from objects to corresponding database records as well\
    \ as the de-serialization from database records to objects are performed automatically\
    \ by the Java EE execution environment based on JPA annotations and converter\
    \ classes for custom conversions."
- md: "\n## 5 Unidirectional Non-Functional Associations with Java EE\n\n### 5.5 Write\
    \ the User Interface Code\n\n### 5.5.1 Show Information About Associated Objects\
    \ in Retrieve/List All\n\nFor showing information about the authors of a book\
    \ in the retrieve/list all use case, the corresponding cell in the HTML table\
    \ has to be filled with a list of the names of all authors. For this, we implement\
    \ a method in the Book class which returns the serialized list of author names\
    \ (in the form, authorName_1, authorName_2, ..., authorName_n);\n\n```java\npublic\
    \ String getAuthorNames() {\n  String result = \"\";\n  int i = 0, n = 0;\n  if\
    \ (this.authors != null) {\n    n = this.authors.size();\n    for (Author author\
    \ : this.authors) {\n      result += author.getName();\n      if (i< n-1) {\n\
    \        result += \",\";\n      }\n      i++;\n    }\n  }\n  return result;\n\
    }\n```\n\nIn the file `retrieveAndListAll.xhtml` in the folder `WebContent/views/books/`,\
    \ this method is invoked in the JSF expression of the \"Authors\" column:\n\n\
    ```xml\n<ui:composition template=\"WEB-INF/templates/page.xhtml\">\n  <ui:define\
    \ name=\"content\">\n    <h:dataTable value=\"#{bookController.books}\" var=\"\
    b\">\n      <h:column>\n        <f:facet name=\"header\">Publisher</f:facet>\n\
    \        #{b.publisher.name}\n      </h:column>\n      <h:column>\n        <f:facet\
    \ name=\"header\">Authors</f:facet>\n        #{b.authorNames}\n      </h:column>\n\
    \    </h:dataTable>\n```\n\n```xml\n<h:button value=\"Back\" outcome=\"index\"\
    \ />\n</ui:define>\n</ui:composition>\n```\n\nRecall that using `b.authorNames`\
    \ results in invoking a method named `getAuthor` on the given `b` object.\n\n\
    ### 5.5.2 Allow Selecting Associated Objects in Create\n\nFor allowing to select\
    \ multiple authors to be associated with a book in the create book case, a multiple\
    \ selection list (a select element with `multiple=\"multiple\"`), as shown in\
    \ the facet col, is populated with the instances of the associated object type.\
    \ The following code is part of the `create.xhtml` view file in the folder `WebContent/views/`:\n\
    \n```xml\n<ui:template template=\"WEB-INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:form id=\"createBookForm\">\n  <h:panelGrid columns=\"\
    3\">\n  <h:outputLabel for=\"authors\" value=\"Authors\"/>\n  <h:selectManyListBox\
    \ id=\"authors\" value=\"#{book.authors}\">\n    <f:selectItems value=\"#{authorController.authors}\"\
    \ var=\"a\"\n      itemLabel=\"#{a.name}\" itemValue=\"#{a}\"/>\n    <f:converter\
    \ converterId=\"AuthorConverter\"/>\n  </h:selectManyListBox>\n  <h:message for=\"\
    authors\" error=\"error\"/>\n</h:panelGrid>\n<h:commandButton value=\"Create\"\
    \ action=\"#{authorController.create(book.isbn, book.title, book.year, book.publisher,\
    \ book.authors)}\"/>\n<h:button value=\"Back\" outcome=\"index\" />\n</h:form>\n\
    </ui:define>\n</ui:composition>\n```\n\nRemember that we have to add the equals\
    \ method for the Author model class. In our case, two authors are \"one and the\
    \ same\" if the values of their `personId` property are equal:\n\n```java\n@Override\n\
    public boolean equals(Object obj) {\n    if (obj instanceof Author) {\n      \
    \  Author author = (Author) obj;\n        return (this.personId.equals(author.personId));\n\
    \    } else return false;\n}\n```\n\nLike the case of Publisher, a JSF converter\
    \ class is used to serialize objects to display strings, when the select list\
    \ is populated, and back to objects, when the create method of the BookController\
    \ is called (the “Create” button was pushed by the user). The BookController.create\
    \ method is extended with a new parameter, the authors list:\n\n```java\npublic\
    \ String create(String isbn, String title, Integer year,\n    Publisher publisher,\
    \ Set<Author> authors) {\n    try {\n        Book.create(em, ut, isbn, title,\
    \ publisher, authors);\n        // Enforcement clearing the form after creating\
    \ the Book record\n        FacesContext facesContext = FacesContext.getCurrentInstance();\n\
    \        facesContext.getContext().getRequestMap().remove(\"book\");\n       \
    \ try {\n            ut.rollback();\n        } catch (Exception e1) {\n      \
    \      e1.printStackTrace();\n        }\n        e.printStackTrace();\n    } catch\
    \ (Exception e) {\n        e.printStackTrace();\n    }\n    return \"create\"\
    ;\n}\n```\n\nThe update book case is similar to the create book use case.\n\n\
    ## 5.6 Run the App and Get the Code\n\nFor running your application, you may first\
    \ have to stop your Tomcat/TomEE server (with `bin/shutdown.bat` for Windows or\
    \ `bin/shutdown.sh` for Linux). Next, download and unzip the Archive ZIP file\
    \ containing all the source code of the app and\n\n## 5.7 Sets Versus Ordered\
    \ Sets as the Values of Reference Properties\n\nthe ANT script file that you have\
    \ to edit (modify the `server.folder` property value).\nNow, execute the deploy\
    \ command in your console or terminal:\n\n```bash\nant deploy -Dappname=UnidirectionalAssociationApp\n\
    ```\n\nFinally, start your Tomcat web server (by `bin/shutdown.bat` for Windows\
    \ or `bin/shutdown.sh` for Linux). Please be patient, this can take some time.\
    \ It will be ready when the console displays the following: Initializing Mojarra\
    \ [some library versions and paths are shown here]. Finally, open a web browser\
    \ of type: http://localhost:8080/UnidirectionalAssociationApp/WebContent/views/index.xhtml\n\
    \n### Sets Versus Ordered Sets as the Values of Reference Properties\n\nRecall\
    \ that a set is an unordered collection that has unique elements, while a list\
    \ is an ordered collection that may contain the same element more than once. When\
    \ a nonfunctional association is ordered, like `authors`, in the class diagram\
    \ in Figure 5.1, this implies that the range of the corresponding property needs\
    \ to be an ordered collection type, such as SortedSet and List.\n\n| Book | authored\
    \ | Author |\n| --- | --- | --- |\n| isbn : String | | personid: Integer |\n|\
    \ title : String | | name: String |\n| year : Integer | * | |\n| | (ordered) |\
    \ 5.1\n\nIn theory, set-valued reference properties should be defined with `Set<T>`,\
    \ such as declaring `Set<Book>` as the range of `authored`, while ordered-set-valued\
    \ properties should be defined with `SortedSet<T>`, such as declaring `SortedSet<Author>`\
    \ as the range of `authors`. The Java interface type is typically implemented\
    \ by `HashSet`, while `SortedSet` is typically implemented by `TreeSet`.\n\nHowever,\
    \ if there is no concern about avoiding duplicate elements, both set-valued and\
    \ ordered-set-valued reference properties can also be defined with the generic\
    \ interface type `List<T>` as their range, which is typically implemented with\
    \ `ArrayList`.\n\nWhen the main use cases are adding elements to the collection\
    \ and later iterate over them, the best choice is List implemented by ArrayList,\
    \ which is more memory efficient than LinkedList or any Set, and has fast insertion,\
    \ iteration, and random access. Using `HashSet` provides a performance benefit\
    \ only in the use case of finding an element in the collection.\n\n## #6 Unidirectional\
    \ Associations Practice Projects\n\nAll projects include the following tasks:\n\
    \n1. Make an OO class model derived from the given design model. Hint: replace\
    \ associations with corresponding reference properties.\n2. Make a JavaScript\
    \ class model or Java Entity class model derived from the OO class model. Hint:\
    \ add check and setter methods.\n3. Code your JS class model or Java Entity class\
    \ model, following the provided guidelines.\n\nMake sure that your pages comply\
    \ with the XML syntax of HTML5, and your JavaScript code complies with your Coding\
    \ Guidelines and is checked with JSHint.\n\n### ##6.1 Assign a Director and Actors\
    \ to a Movie\n\nThis project is based on the information design model shown below.\
    \ The app from the previous assignments is to be extended by adding the possibility\
    \ to manage data about the actors and the director of a movie. This is achieved\
    \ by adding a model class Person and two unidirectional associations between Movie\
    \ and Person:\n\n1. a many-to-one association assigning exactly one person as\
    \ the director of movie, and\n2. a many-to-many association assigning zero or\
    \ more persons as the actors of movie.\n\n![](img/64ab58e459ff4b56e7fc22fe3998651a_95_0.png)\n"
