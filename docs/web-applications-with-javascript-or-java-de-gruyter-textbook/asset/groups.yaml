    \nMore data about countries can be found in the CIA World Factbook.\n\n## 7 Bidirectional\
    \ Associations\n\nIn OO modeling and programming, a bidirectional association\
    \ is an association that is represented as a pair of mutually inverse reference\
    \ properties, which allow 'navigation' (object access) in both directions.\nThe\
    \ model shown in Figure 7.1 below (about publishers, books and their authors)\
    \ serves as our running example. Notice that it contains two bidirectional associations,\
    \ as indicated by the ownership dots at both association ends.\n\n| Publisher\
    \ | published Books | Book | authored Books | Author |\n| --- | --- | --- | ---\
    \ | --- |\n| name : String (id) | | isbn : String (id) | * | personid : Integer\
    \ (id) |\n| address : String | 0.1 | * | year : Integer | * | name : String |\n\
    \nFigure 7.1: The Publisher-Book-Author information design model with two bidirectional\
    \ associations.\n\n## 7 Inverse Reference Properties\n\nFor being able to easily\
    \ retrieve the committees that are chaired or co-chaired by a club member, we\
    \ add two reference properties to our Committee-ClubMember example: the property\
    \ of a club member to be the chair of a committee (ClubMember::) and the property\
    \ of a club member to be the co-chair of a committee (ClubMember::coChairedCommittee)\
    \ may chair or co-chair at most one committee (where the disjunction is non-exclusive).\
    \ So, we get the following model:\n\n| Committee | ClubMember |\n| --- | --- |\n\
    | name : String | chairedCommittee[0..] : Committee |\n| chair : ClubMember |\
    \ coChairedCommittee[0..] : Committee |\n\nNotice that there is a close correspondence\
    \ between the two reference properties Committee::chair and ClubMember::chairedCommittee.\
    \ They are the inverse of each other: when the club member Tom is the chair of\
    \ the budget committee, expressed by the tuple (\"budget committee\", \"Tom\"\
    ), then the budget committee is chaired by the club member Tom, expressed by the\
    \ inverse tuple (\"Tom\", \"budget committee\"). For expressing this inverse correspondence\
    \ in the diagram, we append an inverse constraint, inverse of chair, in curly\
    \ braces\n\nto the declaration of the property ClubMember::chairedCommittee, and\
    \ a similar one to the property Committee::chair, as shown in the following diagram:\n\
    \n| Committee | ClubMember |\n|--- |--- |\n| name : String | chairedCommittee[0..1]\
    \ : Committee |\n| chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]\
    \ : Committee |\n\nUsing the reference path notation of OOP languages, with c\
    \ referencing a Committee object, we obtain the equation:\n\n```\nc.chair.chairedCommittee\
    \ = c (7.1)\n```\n\nOr, the other way around, with m referencing a ClubMember\
    \ object, we obtain the equation:\n\n```\nm.chairedCommittee.chair = m (7.2)\n\
    ```\n\nNotice when the property $p_2$ is the inverse of a $p_1$, this implies\
    \ that, the other way around, $p_1$ is the inverse of $p_2$. Therefore, when we\
    \ declare the property ClubMember::chairedCommittee to the inverse of Committee::chair,\
    \ then, implicitly, Committee::chair is the inverse of ClubMember::chairedCommittee.\
    \ We therefore call Committee::chair and ClubMember::chairedCommittee a **pair\
    \ of mutually inverse reference properties**. Having such a pair in a model implies\
    \ *redundancy* because each of the two inverse reference properties can be derived\
    \ from the other by inversion. This type of redundancy implies *data storage overhead*\
    \ and *update overhead*, which is the price to pay for the bidirectional navigability\
    \ that supports efficient object access in both directions.\n\nFor maintaining\
    \ the duplicate information of a mutually inverse reference property pair, it\
    \ is common to treat one of the involved properties as the *master*, and the other\
    \ as the *slave*, and take this distinction into consideration in the code of\
    \ the methods (such as the property setters) of the affected model classes. When\
    \ we designate an inverse reference property as derived by prefixing its name\
    \ with a slash (/), we indicate that it is derived on update. For the example\
    \ example::\n\n| | |MemberMember\n\n|---|-- |\n| name : String | chairedCommittee[0..1]\
    \ : Committee (\n of) |\n| chair :Member) | coChairedCommittee[0..1] : Committee\
    \ |\n\nThe property chairedCommittee in ClubMember is now *derived* (as indicated\
    \ by its slash prefix). Its annotation {inverse of chair} defines a *derivation\
    \ rule* according which it is derived by inverting the property chair.\n\nIn a\
    \ UML class diagram, the derivation of a property can be specified by an OCL expression\
    \ that evaluates the value of the derived property for a given object. In the\
    \ case of property being the inverse of another, specified by the constraint (**inverse\
    \ of another**) appended to the property, the derivation expression is implied.\
    \ In our example, for any club member m, it evaluates to the committee c such\
    \ that c.chair = m. In OCL, this derivation rule would be executed on committee\
    \ object\n\n```\ncontext ClubMember::chairedCommittee\nderive if Committee.allInstances().exists(c\
    \ | c.chair = self) then c\n```\n\nThere are two ways to realize the derivation\
    \ of a property: it may be **derived on** via a read-time computation, or it may\
    \ be **derived on** via an update-time computation performed whenever one of the\
    \ variables in the derivation expression (typically, another property) changes\
    \ its value. The latter case responds to a **materialized view** in a database.\
    \ While a reference property that is derived on read may not guarantee efficient\
    \ navigation, because the on-read computation may create unacceptable latencies,\
    \ a reference property that is derived on update provides efficient navigation.\n\
    \nIn the case of a derived reference property, we have to deal with **life-cycle\
    \ dependencies** between the affected model classes requiring special change management\
    \ mechanisms based on the functionality of the represented association (either\
    \ **one-to-one**, **many-to-one** or **many-to-many**). In our example of the\
    \ inverse reference property ClubMember::chairedCommittee, which is single-valued\
    \ and optional, this means that\n\n- 1. whenever a new committee object is created\
    \ (with a mandatory chair assignment), the corresponding ClubMember::chairedCommittee\
    \ property has to be assigned accordingly;\n- 2. whenever the chair property is\
    \ updated (that is, a new chair is assigned to a committee), the corresponding\
    \ ClubMember::chairedCommittee property has to be unset for the club member who\
    \ was the previous chair and set for the new chair;\n- 3. whenever a committee\
    \ object is destroyed, the corresponding ClubMember::chairedCommittee property\
    \ has to be unset.\n"
