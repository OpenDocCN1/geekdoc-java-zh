- md: "\n# 106 Implementing Bidirectional Associations with Java EE\n\nFor instance,\
    \ for the multi-valued reference property Book::authors that is coupled to the\
    \ derived inverse reference property Author::authoredBooks for implementing the\
    \ bidirectional authorship association between Book and Author, the `addAuthor`\
    \ method is coded in the following way:\n\n```java\npublic class Book {\n\n  public\
    \ void addAuthor(Author author) {\n    if (this.authors == null) {\n      this.authors\
    \ = new HashSet<Author>();\n    }\n    if (!this.authors.contains(author)) {\n\
    \      // add the new author reference\n      this.authors.add(author);\n    \
    \  // add the derived inverse reference\n      author.addAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\nFor the removal `removeAuthor` we obtain the following\
    \ code:\n\n```java\npublic class Book {\n\n  public void removeAuthor(Author author)\
    \ {\n    if (this.authors != null && author != null &&\n        this.authors.contains(author))\
    \ {\n      // delete the author reference\n      this.authors.remove(author);\n\
    \      // delete the derived inverse reference\n      author.removeAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\nRemember, for a Java Collection, such as Set or List, the\
    \ `contains` method compares two objects by using the `equals` method of the objects.\
    \ For example, for using the `contains` method over a `Set<Author>`, such as `publishedBooks`,\
    \ in the Author class we implement the following `equals` method (two authors\
    \ are equal if their `personId` property values are equal):\n\n```java\npublic\
    \ class Author {\n  ..\n  @Override\n  public boolean equals(Object obj) {\n \
    \   if (obj instanceof Author) {\n      Author author = (Author) obj;\n      return\
    \ (this.personId.equals(author.personId));\n    } else return false;\n  }\n}\n\
    ```\n\n## 9.2.6 Take Care of Deletion Dependencies\n\nWhen a Book instance `b`,\
    \ with a single reference `b.publisher` to a Publisher instance `p` and multiple\
    \ references `b.authors` to Author instances, is destroyed, the derived inverse\
    \ references have to be removed first (e.g., by removing `b` from `p.publishedBooks`).\
    \ This is accomplished by calling the set methods for the single and multi-valued\
    \ properties with a null parameter, e.g., `b.setPublisher(null)` and `b.setAuthors(null)`\
    \ within the `Book.delete` method:\n\n```java\npublic class Book {\n  ..\n  public\
    \ static void delete(EntityManager em, UserTransaction ut, String isbn) throws\
    \ Exception {\n    ut.begin();\n    Book b = em.find(Book.class, isbn);\n    b.setPublisher(null);\n\
    \    b.setAuthors(null);\n    em.remove(b);\n    ut.commit();\n  }\n}\n```\n\n\
    In the same way, we have to take care of deleting the references to Book instances\
    \ when deleting a Publisher or an Author instance:\n\n```java\npublic class Author\
    \ {\n  ..\n  public static void delete(EntityManager em, \n    UserTransaction\
    \ ut, Integer personId) throws Exception {\n    ut.begin();\n    Author a = em.find(Author.class,\
    \ personId);\n    a.setAuthoredBooks(null);\n    em.remove(a);\n    ut.commit();\n\
    \  }\n}\n```\n\n```java\npublic class Publisher {\n  public static void delete(EntityManager\
    \ em, \n    UserTransaction ut, String name) throws Exception {\n    ut.begin();\n\
    \    Publisher p = em.find(Publisher.class, name);\n    p.setPublishedBooks(null);\n\
    \    em.remove(p);\n    ut.commit();\n  }\n}\n```\n\n## 9.2.7 Entity Managers\
    \ and Cached Entities\n\nUnfortunately, JPA does not provide automatic maintenance\
    \ of inverse references. According to the Java Persistence Wiki, we have to implement\
    \ the (di- and inverse) relations management with set/add/remove methods:\n\n\
    > A common problem with bidirectional relationships is the application updates\
    \ one side of the relationship, while the other side does not get updated, and\
    \ becomes out of sync. In JPA, as in Java general, it is the responsibility of\
    \ the application or the object model to maintain relationships. If your application\
    \ adds to one side of relationship, then it must add to the other side. This is\
    \ commonly resolved through add or set methods in the object model that handle\
    \ both sides of the relationships, so the application code needs not to worry\
    \ about it. There are two ways to go about this: you can either add the relationship\
    \ maintenance to only one side of the relationship, and only use the setter from\
    \ that side (such as making the other side protected), or add to both sides and\
    \ ensure you avoid an infinite loop.\n\nWe have used an entity manager for each\
    \ controller class. Every entity manager maintains a set of cached entities which\
    \ can be “shared” with other entity managers using the merge method. In our example\
    \ code, as part of the create and update methods of each model class, we have\
    \ to merge the updated entities that belong to another entity manager. For example,\
    \ in the `Book.create` method, we need to merge the new book's publisher, managed\
    \ by the PublisherController's entity manager, and all its authors, managed by\
    \ the AuthorController's entity manager:\n\n```java\npublic class Book {\n   \
    \ public static void create(EntityManager em,\n        UserTransaction ut,\n \
    \       String isbn, String title, Integer year,\n        Publisher publisher,\
    \ Set<Author> authors)\n    throws Exception {\n        ut.begin();\n        Book\
    \ book = new Book(isbn, title, year);\n        book.setPublisher(em.merge(publisher));\n\
    \        if (authors != null) {\n            for (Author author : authors) {\n\
    \                book.addAuthor(em.merge(author));\n            }\n        }\n\
    \        em.persist(book);\n        ut.commit();\n    }\n}\n```\n\nNote: The original\
    \ OCR text contained significant corruption in the code blocks (e.g., \"tnew book's\"\
    , \"EntityManagerManager\", and broken method bodies). I have reconstructed the\
    \ logic based on standard Java EE patterns implied by the context to provide a\
    \ functional representation.\n"
  mdcn: "\n\n# 106 使用 Java EE 实现双向关联\n\n例如，对于多值引用属性 `Book::authors`，它耦合了派生的反向引用属性\
    \ `Author::authoredBooks`，以实现 `Book` 和 `Author` 之间的双向作者关联，`addAuthor` 方法的代码实现如下：\n\
    \n```java\npublic class Book {\n\n  public void addAuthor(Author author) {\n \
    \   if (this.authors == null) {\n      this.authors = new HashSet<Author>();\n\
    \    }\n    if (!this.authors.contains(author)) {\n      // 添加新的作者引用\n      this.authors.add(author);\n\
    \      // 添加派生的反向引用\n      author.addAuthoredBook(this);\n    }\n  }\n}\n```\n\
    \n对于删除操作 `removeAuthor`，我们得到了以下代码：\n\n```java\npublic class Book {\n\n  public\
    \ void removeAuthor(Author author) {\n    if (this.authors != null && author !=\
    \ null &&\n        this.authors.contains(author)) {\n      // 删除作者引用\n      this.authors.remove(author);\n\
    \      // 删除派生的反向引用\n      author.removeAuthoredBook(this);\n    }\n  }\n}\n```\n\
    \n记住，对于 Java Collection（如 `Set` 或 `List`），`contains` 方法通过对象的 `equals` 方法来比较两个对象。例如，为了在\
    \ `Author` 类的 `Set<Author>`（如 `publishedBooks`）上使用 `contains` 方法，我们实现了以下 `equals`\
    \ 方法（如果两个作者的 `personId` 属性值相等，则认为这两个作者相等）：\n\n```java\npublic class Author {\n\
    \  ..\n  @Override\n  public boolean equals(Object obj) {\n    if (obj instanceof\
    \ Author) {\n      Author author = (Author) obj;\n      return (this.personId.equals(author.personId));\n\
    \    } else return false;\n  }\n}\n```\n\n## 9.2.6 处理删除依赖\n\n当 `Book` 实例 `b`（其具有单个引用\
    \ `b.publisher` 指向 `Publisher` 实例，以及多个引用 `b.authors` 指向 `Author` 实例）被销毁时，必须先移除派生的反向引用（例如，通过从\
    \ `p.publishedBooks` 中移除 `b`）。这通过在 `Book.delete` 方法中对单值和多值属性调用带有 null 参数的 setter\
    \ 方法来实现，例如 `b.setPublisher(null)` 和 `b.setAuthors(null)`：\n\n```java\npublic class\
    \ Book {\n  ..\n  public static void delete(EntityManager em, UserTransaction\
    \ ut, String isbn) throws Exception {\n    ut.begin();\n    Book b = em.find(Book.class,\
    \ isbn);\n    b.setPublisher(null);\n    b.setAuthors(null);\n    em.remove(b);\n\
    \    ut.commit();\n  }\n}\n```\n\n同样，在删除 `Publisher` 或 `Author` 实例时，我们必须处理对 `Book`\
    \ 实例引用的删除：\n\n```java\npublic class Author {\n  ..\n  public static void delete(EntityManager\
    \ em, \n    UserTransaction ut, Integer personId) throws Exception {\n    ut.begin();\n\
    \    Author a = em.find(Author.class, personId);\n    a.setAuthoredBooks(null);\n\
    \    em.remove(a);\n    ut.commit();\n  }\n}\n```\n\n```java\npublic class Publisher\
    \ {\n  public static void delete(EntityManager em, \n    UserTransaction ut, String\
    \ name) throws Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class,\
    \ name);\n    p.setPublishedBooks(null);\n    em.remove(p);\n    ut.commit();\n\
    \  }\n}\n```\n\n## 9.2.7 实体管理器和缓存实体\n\n遗憾的是，JPA 不提供反向引的自动维护。根据 Java Persistence\
    \ Wiki，我们必须通过 set/add/remove 方法来实现（单向和反向的）关系的管理：\n\n> 双向关系中的一个常见问题是应用程序更新了关系的一侧，而另一侧没有更新，导致数据不同步。在\
    \ JPA 中，与在通用 Java 中一样，维护关系是应用程序或对象模型的责任。如果你的应用程序向关系的一侧添加了内容，那么它也必须向另一侧添加。这通常通过对象模型中处理关系双方的\
    \ add 或 set 方法来解决，这样应用程序代码就不需要担心这个问题。这个问题有两种方法：你可以只将关系维护添加到关系的一侧，并仅使用该侧的 setter（例如将另一侧设为\
    \ protected），或者在双方都添加，并确保避免无限循环。\n\n我们为每个控制器类使用了一个实体管理器。每个实体管理器都维护一组缓存实体，这些实体可以通过\
    \ `merge` 方法与其他实体管理器“共享”。在我们的示例代码中，作为每个模型类创建和更新方法的一部分，我们必须合并属于另一个实体管理器的更新实体。例如，在\
    \ `Book.create` 方法中，我们需要合并由 `PublisherController` 实体管理器管理的新书出版者，以及由 `AuthorController`\
    \ 实体管理器管理的所有作者：\n\n```java\npublic class Book {\n    public static void create(EntityManager\
    \ em,\n        UserTransaction ut,\n        String isbn, String title, Integer\
    \ year,\n        Publisher publisher, Set<Author> authors)\n    throws Exception\
    \ {\n        ut.begin();\n        Book book = new Book(isbn, title, year);\n \
    \       book.setPublisher(em.merge(publisher));\n        if (authors != null)\
    \ {\n            for (Author author : authors) {\n                book.addAuthor(em.merge(author));\n\
    \            }\n        }\n        em.persist(book);\n        ut.commit();\n \
    \   }\n}\n```\n\n"
