  - "[PAGE 83]\n\n# 5 Unidirectional Non-Functional Associations with Java EE\n\n\
    A unidirectional non-functional association is either one-to-many or many-to-many.\
    \ In both cases such an association is represented with the help of a multi-valued\
    \ reference property.\n\nIn this chapter, we show\n\n+   1. how to derive a Java\
    \ Entity class model from an OO class model with multivalued reference properties\
    \ representing unidirectional non-functional associations,\n2. how to code the\
    \ Java Entity class model in the form of entity classes (implementing model classes),\n\
    3. how to write the view and controller code based on the model code.\n\n# 5.1\
    \ Implementing Multi-Valued Reference Properties in Java\n\nA multi-valued reference\
    \ property, as Book::authors, allows storing collection of internal references\
    \ to objects of some type, such as references to Author objects. When creating\
    \ a new type of Book, the constructor function needs to have a parameter for providing\
    \ a suitable value for this property. In general, the value can be a set of internal\
    \ object references or of ID references. With JPA, we use object references:\n\
    \n```\n@Entity @Table (name=\"books\")\n@ManagedBean (name=\"book\")\n@ViewScoped\n\
    public class Book {\n\n    private Set<Author> authors;\n\n    public Book() {\
    \ // required by JPA @Entity annotation!\n    public Book( String isbn, String\
    \ title, Integer year,\n                Publisher publisher, Set<Author> authors)\
    \ { . . }\n\n    public Set<Author> getAuthors() { return this.authors; }\n  \
    \  public void setAuthors( Set<Author> authors) { this.authors = authors; }\n\
    }\n```"
- md: "\n## 5.2 Make a Java Entity Class Model\n\nOur starting point for making a\
    \ Java Entity class model is the following OO class model:\n\n| Book | Publisher\
    \ |\n|---|---|\n| isbn[1]: String (id) | name : String (id) |\n| title[1]: String\
    \ | address : String |\n| year[1]: Integer | |\n| publisher[0..1]: Publisher |\
    \ |\n| authors[*]: Author | |\n| | Author | |\n| | personid: integer (id) |\n\
    | | name : String |\n\nThis model contains, in addition to the single-many-one\
    \ reference property Book::publisher representing the unidirectional many-to-one\
    \ association Book-has-Publisher, the multi-valued reference property Book::authors\
    \ representing the unidirectional many-to-many association Book-has-Author.\n\n\
    Recall that we obtain a Java Entity class, like Author, from the corresponding\
    \ class in the OO class model, by (1) making all properties private, (2) using\
    \ Java data-type classes, (3) adding public getters and setters, (4) adding a\
    \ `toString` function, (5) adding the data storage methods create, retrieve, update\
    \ and delete:\n\n| «Java Entity» |\n|---|---|\n| Author |\n| get/set-personid\
    \ : Integer (id) |\n| get/set-name : String |\n| +checkPersonidAid(in pid : Integer,\
    \ in em : EntityManager) : ConstraintViolation |\n| +toString(): String |\n| +(...)\
    \ |\n\nIn the Java Entity class model, any reference property specified in the\
    \ OO class model is annotated with the functionality type of the association represented\
    \ by it.\n\n## 5.4 Write the Model Code — 69\n\nIn our example, we annotate the\
    \ property authors in the Entity class Book with `manyToMany`:\n\n| «Java Entity»\
    \ |\n| --- |\n| «get/set>-isbn[1] : String (id) |\n| «get/set>-title[1] : String\
    \ |\n| «get/set>-year[1] : Integer |\n| «get/set>-publisher[0..1] : Publisher\
    \ (manyToMany) |\n| «get/set>-authors[*] : Author (manyToMany) |\n| +checknAid(in\
    \ isbn : String, in : EntityManager) : ConstraintViolation |\n| +addAuthor(in\
    \ author : Author) |\n| +removeAuthor(in author : Author) |\n| +toString() : string\
    \ |\n\n## 5.3 New Issues\n\nCompared to dealing with a unidirectional functional\
    \ association, as discussed in the previous section, we have to deal with the\
    \ following new technical issues:\n\n1. In **model classes** we have to take care\
    \ of **multi-valued referenced properties** that have to be annotated with `@OneToMany`\
    \ or `@ManyToOne`.\n2. In the **user interface** code we have to take care of\n\
    \    - showing information about a collection of associated objects in the view\
    \ table columns that render multi-valued reference properties in the *retrieve*\
    \ list objects use case;\n    - allowing to select a collection of associated\
    \ objects from a list of all existing instances of the target class in the *create*\
    \ object and *update* object use cases.\n\nThe last issue, allowing to select\
    \ a collection of associated objects from a list of all existing instances of\
    \ some class, in general, cannot be solved with the help of an HTML `select multiple`\
    \ element because usability of a certain threshold (defined by the number of options\
    \ that can be seen on the screen without scrolling), the HTML `select multiple`\
    \ element is no longer usable, and an alternative `multi-selection` widget has\
    \ to be used.\n\n## 5.4 Write the Model Code\n\nThe Java Entity class model can\
    \ be directly coded for implementing the model layer of our Java back-end app.\n\
    \n### 5.4.1 Summary\n\n1. Code each class of the Java Entity class model as a\
    \ corresponding entity class.\n2. Code any [id] property modifier with the JPA\
    \ property annotation @Id.\n3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as [manyToOne], with the corresponding JPA\
    \ annotation, such as @ManyToOne.\n4. Code the entity constraints specified in\
    \ the model with the help of Java Bean Validation annotations (or custom validation\
    \ annotations).\n5. Code the getters and setters as well as the add and remove\
    \ methods for multipued properties.\n6. Code the create, retrieve, update and\
    \ delete storage management operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections.\n\n### 5.4.2 Code Each\
    \ Class of the Java Entity Class Model\n\nFor the multi-valued reference property\
    \ Book::authors, we use a parametrized Set type:\n\n```java\n@Entity @Table(name=\"\
    books\")\n@ViewScoped @ManagedBean (name=\"book\")\npublic class Book {\n    .\n\
    \n    @ManyToOne (fetch=FetchType.EAGER)\n    private Set<Author> authors;\n\n\
    \    public Book() {}\n    public Book(String isbn, String title, Integer year,\n\
    \    Publisher publisher, Set<Author> authors) { . . }\n    .\n    public Set<Author>\
    \ getAuthors() { return this.authors; }\n    public void setAuthors(Set<Author>\
    \ authors) { this.authors=authors; }\n}\n```\n\nThe JPA annotation @ManyToMany\
    \ allows to specify the Many-To-Many relation between the Book and Author. The\
    \ annotation parameter FetchType.EAGER is used, so when a Book instance is created,\
    \ the list of authors is populated with the\n\n## 5.4 Write the Model Code — 71\n\
    \ncorresponding Author instances. As a result of this annotation, a relation table\
    \ between Book and Author is created, and the resulting SQL:\n\n```sql\nCREATE\
    \ TABLE IF NOT EXISTS books_author (\n  `ISBN` varchar(10) NOT NULL,\n  `personID`\
    \ int NOT NULL\n);\n\n```\n\nThe relation table between Book and Author is created,\
    \ and the resulting SQL is shown below: (Note: The OCR text was fragmented, here\
    \ logic is reconstructed based on context).\n"
  mdcn: "\n\n## 5.2 创建 Java 实体类模型\n\n我们创建 Java 实体类模型的起点是以下面向对象（OO）类模型：\n\n| Book |\
    \ Publisher |\n|---|---|\n| isbn[1]: String (id) | name : String (id) |\n| title[1]:\
    \ String | address : String |\n| year[1]: Integer | |\n| publisher[0..1]: Publisher\
    \ | |\n| authors[*]: Author | |\n| | Author | |\n| | personid: integer (id) |\n\
    | | name : String |\n\n该模型除了包含单向多对一引用属性 `Book::publisher`（代表单向多对一关联 `Book-has-Publisher`）外，还包含了多值引用属性\
    \ `Book::authors`（代表单向多对多关联 `Book-has-Author`）。\n\n回想一下，我们通过以下方式从 OO 类模型中的对应类获取\
    \ Java 实体类（如 `Author`）：(1) 将所有属性设为私有；(2) 使用 Java 数据类型类；(3) 添加公共的 getter 和 setter；(4)\
    \ 添加 `toString` 函数；(5) 添加创建、检索、更新和删除的数据存储方法：\n\n| «Java Entity» |\n|---|---|\n\
    | Author |\n| get/set-personid : Integer (id) |\n| get/set-name : String |\n|\
    \ +checkPersonidAid(in pid : Integer, in em : EntityManager) : ConstraintViolation\
    \ |\n| +toString(): String |\n| +(...) |\n\n在 Java 实体类模型中，OO 类模型中指定的任何引用属性都用其所表示的关联的功能类型进行注解。\n\
    \n## 5.4 编写模型代码 — 69\n\n在示例中，我们将实体类 `Book` 中的属性 `authors` 标记为 `manyToMany`：\n\n\
    | «Java Entity» |\n| --- |\n| «get/set>-isbn[1] : String (id) |\n| «get/set>-title[1]\
    \ : String |\n| «get/set>-year[1] : Integer |\n| «get/set>-publisher[0..1] : Publisher\
    \ (manyToMany) |\n| «get/set>-authors[*] : Author (manyToMany) |\n| +checknAid(in\
    \ isbn : String, in : EntityManager) : ConstraintViolation |\n| +addAuthor(in\
    \ author : Author) |\n| +removeAuthor(in author : Author) |\n| +toString() : string\
    \ |\n\n## 5.3 新问题\n\n与上一节讨论的单向功能关联相比，我们必须处理以下新的技术问题：\n\n1. 在**模型类**中，我们必须处理**多值引用属性**，这些属性必须被用\
    \ `@OneToMany` 或 `@ManyToOne` 进行注解。\n2. 在**用户界面**代码中，我们需要处理：\n    - 在 *检索* 列表对象用例中，在渲染多值引用属性的视图列中显示关联对象集合的信息；\n\
    \    - 在 *创建* 对象和 *更新* 对象用例中，允许从目标类所有现有实例的列表中选择关联对象集合。\n\n最后一个问题（即从某个类的所有现有实例的列表中选择关联对象集合）通常无法通过\
    \ HTML `select multiple` 元素解决，因为当超过某个性阈值（由屏幕上无需滚动即可可见的选项数量定义），HTML `select multiple`\
    \ 元素将不再可用，必须使用替代的 `multi-selection`（多选）控件。\n\n## 5.4 编写模型代码\n\nJava 实体类模型可以直接进行编码以实现我们\
    \ Java 后端应用的模型层。\n\n### 5.4.1 总结\n\n1. 将 Java 实体类模型中的每个类编码为相应的实体类。\n2. 使用 JPA\
    \ 属性注解 @Id 编写任何 [id] 属性修饰符。\n3. 为表示引用属性功能类型的修饰符（如 [manyToOne]）编写对应的 JPA 注解（如 @ManyToOne）。\n\
    4. 使用 Java Bean Validation 注解（或自定义校验注解）编写模型中指定的实体约束。\n5. 编写 getter 和 setter 以及多值属性的\
    \ add 和 remove 方法。\n6. 将创建、检索、更新和删除存储管理操作编写为类方法。\n\n这些步骤将在接后的章节中详细讨论。\n\n### 5.4.2\
    \ 编写 Java 实体类模型中的每个类\n\n对于多值引用属性 `Book::authors`，我们使用参数化的 `Set` 类型：\n\n```java\n\
    @Entity @Table(name=\"books\")\n@ViewScoped @ManagedBean (name=\"book\")\npublic\
    \ class Book {\n    .\n\n    @ManyToOne (fetch=FetchType.EAGER)\n    private Set<Author>\
    \ authors;\n\n    public Book() {}\n    public Book(String isbn, String title,\
    \ Integer year,\n    Publisher publisher, Set<Author> authors) { . . }\n    .\n\
    \    public Set<Author> getAuthors() { return this.authors; }\n    public void\
    \ setAuthors(Set<Author> authors) { this.authors=authors; }\n}\n```\n\nJPA 注解\
    \ @ManyToMany 允许指定 `Book` 和 `Author` 之间的多对多关系。使用了参数 `FetchType.EAGER`，因此当创建 `Book`\
    \ 实例时，作者列表会被相应的 `Author` 实例填充。\n\n## 5.4 编写模型代码 — 71\n\n由于此注解的作用，会创建一个 `Book`\
    \ 和 `Author` 之间的关系表，生成的 SQL 如下：\n\n```sql\nCREATE TABLE IF NOT EXISTS books_author\
    \ (\n  `ISBN` varchar(10) NOT NULL,\n  `personID` int NOT NULL\n);\n```\n\n"
