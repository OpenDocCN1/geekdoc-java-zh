    \ segmentation. We use the Single Table Inheritance approach for mapping this\
    \ class hierarchy to a single database table.\n\nIn the second case study, we\
    \ consider the multi-level class hierarchy consisting of the Person roles Employee,\
    \ Manager and Author, shown in Figure 12.8. We use the Joained Inheritance approach\
    \ for mapping this class hierarchy to a set of database tables that are related\
    \ with each other via foreign key dependencies.\n\nIn both cases we show\n\n+\
    \   1. how to derive a Java Entity class\n2. how to code the Java Entity class\
    \ model in the form of Java Entity classes,\n3. how to write the view and controller\
    \ code based on the model code.\n\n# 14.1 Subtyping in Java\n\nJava provides built-in\
    \ support for subtyping with its extends keyword, but it does not support multiple\
    \ inheritance. Consider the following information design model:\n\n| Person |\n\
