    # 第一部分：关联


    我们在第一卷中讨论的三个示例应用程序——最小化应用、验证应用和枚举应用——都局限于仅管理一个对象类型的数据。然而，一个真实的应用程序必须管理多个对象类型的数据，这些类型通常以各种方式相互关联。特别是，对象类型之间可能存在关联和子类型（继承）关系。处理关联和子类型关系是软件应用工程中的高级问题。它们在教科书中往往没有得到充分讨论，也没有得到应用开发框架的良好支持。


    关联是信息模型的重要元素。软件应用框架必须以适当的方式实现它们，特别是在模型-视图-控制器（MVC）架构的模型层中。遗憾的是，应用开发框架对处理关联的支持并不多。


    有两个重要的区别，且它们是相互独立的：


    -   1. 功能性关联与非功能性（“多对多”）关联。

    -   2. 单向关联与双向关联。


    功能性关联对应于数学中所谓的“函数”，而多对多关联对应于数学中所谓的“关系”。


    单向关联对应于 OO 建模和编程中的引用属性，而双向关联则对应于一对互逆的引用属性。


    # 1 引用属性和单向关联


    为对象类型（或类）定义的属性，如果其值是指向另一个类型或同一种类型对象的引用，则被称为引用属性。例如，下面图 1.1 所示的委员会（Committee）有一个引用属性
    `chair`，其值是到俱乐部成员（ClubMember）类型对象的引用。


    对象类型之间的关联对类了这些类型中对象之间的关系。例如，`Committee-hasClubMember-as-chair` 关联（在图 1.2 所示的类图中被可视化为一条线）分类了
    `FinanceCommittee-hasPeterMiller-as-chair`、`RecruitmentCommittee-hasSusanSmith-as-chair`
    和 `AdvisoryCommittee-hasSarahAnderson-as-chair` 关系，其中对象 `PeterMiller`、`SusanSmith`
    和 `SarahAnderson` 的类型为 `ClubMember`，而对象 `FinanceCommittee`、`RecruitmentCommittee`
    和 `AdvisoryCommittee` 的类型为 `Committee`。关联作为关系的集合可以表示为如下表：


    | Committee-hasClubMember-as-chair | |

    | :--- | :--- |

    | Finance Committee | Peter Miller |

    | Recruitment Committee | Susan Smith |

    | Advisory Committee | Sarah Anderson |


    引用属性对应于关联的一种特殊形式，即二元。二元关联通常不需要从属性的域类（定义处）指向其范围类。通常，关联是参与其中的两个或多个对象类型的类型。为了简单起见，当我们指代二元关联时，本书直接说“关联”。


    # 1 引用属性和单向关联


    在数学中关联通过抽象的方式形式化为均匀元组集合，称为关系。在实体关系（ER）建模（信息系统和软件工程中的经典信息建模方法）中，对象被称为实体，关联被称为关系类型。统一建模语言（UML）包含了用于信息建模的类图。在
    UML 中，对象类型被称为类，个体关系被称为“链接”。这些术语汇如如下表所示：


    | 我们的首选术语 | UML | ER 图 | 数学 |

    | :--- | :--- | :--- | :--- |

    | object | object | entity | individual |

    | object type (class) | class | entity type | unary relation |

    | relationship | link | relationship | tuple |

    | association (relationship type) | association | relationship type | relation
    |

    | functional association | | 一对一、多对一或一对多 关系类型 | function |


    我们首先讨论引用属性，它们在“无关联”的类模型（即不包含任何关联元素的模型）中隐式地表示了双向关联。


    # 1.1 引用和引用属性


    引用可以是人类可读的，也可以是内部对象引用。人类可读引用指向人类通信中标识符，例如天体的唯一名称、书籍的 ISBN 以及公司员工的工号。内部对象引用指向 OOP
    对象的内存地址，为访问主内存中的对象提供了高效的机制。


    某些语言（如 SQL 和 XML）只支持人类可读引用，不支持内部引用。在 SQL 中，人类可读引用被称为外键，它们引用的标识符被称为主键。在 XML 中，人类可读引用被称为
    ID 引用，相应的属性类型为 IDREF。


    OO 程序中的对象可以通过人类可读引用（例如整数代码）引用，也可以通过内部对象引用引用，后者对于访问主内存中的对象更高效。


