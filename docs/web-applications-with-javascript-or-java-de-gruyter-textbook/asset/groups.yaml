    | c : Integer (key) | (a3 > a2) |


    哪些语句是正确的？选择一个或多个：


    - 所有 Cde 实例都有 a1 的值。

    - Cde 的标准标识符是 a1。

    - 所有 Cde 实例可能引用 Bcd。

    - Abc 直接实例可能有 c 的值。

    - 任何 Abc 对象的 a3 值必须大于 a2。

    - 任何 Cde 对象的 a3 值必须大于 a2。

    - Cde 的标准标识符是 c。


    ###### 12.8.2 问题 2：类合并


    考虑以下类模型：


    ![img/64ab58e459ff4b56e7fc22fe3998651a_158_0]


    在此类简单的类层次结构的情况下，我们可以使用类合并设计模式，将整个类层次结构合并到一个类中。以下哪个模型描述了给定 Ab 类层次结构的正确实现？选择一个：


