    按照我们的指南编写应用程序代码。

    确保你的页面符合 HTML5 的 XML 语法，并确保你的 JavaScript 符合我们的编码规范（并使用 JSHint 进行检查）。


    # 术语表


    ## C


    CRUD


    CRUD 是 *Create, Read/Retrieve, Update, Delete（增删改）* 的缩写，表示任何软件应用程序都要执行的四种基本数据管理操作。


    级联样式表 (Cascading Style Sheets)


    CSS 用于定义网页的显示样式，告诉浏览器如何渲染其 HTML（或 XML）内容：使用哪种内容元素布局、字体和文本样式，哪些颜色、背景以及哪些动画。通常，这些设置是在单独的
    CSS 文件中完成的，通过 HTML head 部分的特殊链接元素与 HTML 文件相关联。


    ## D


    文档对象模型 (Document Object Model)


    DOM 是一个用于检索和修改 HTML 或 XML 文档节点及元素的抽象 API。所有编程语言都具有实现 DOM 的 DOM 绑定。


    域名系统 (Domain Name System)


    DNS 将用户易读的域名翻译为 IP 地址，以便在互联网上定位主机计算机。


    ## E


    ECMAScript


    可扩展标记语言 (Extensible Markup Language)


    一种由行业组织“Ecma International”定义的 JavaScript 标准。


    XML 允许以机器可读的方式标记各种文档、数据文件和消息的结构。如果标签名称是自解释的，XML 也可以是人类可读的。XML 基于 Unicode。SVG 和
    MathML 基于 XML，并且有一个基于 XML 的 HTML 版本。


    XML 提供了一种语法，以 XML 文档的形式通过*元素及其属性*来表达结构化信息。在 XML 文档中使用的特定元素和属性可以来自任何词汇，例如公共标准或用户定义的
    XML 格式。


    ## H


    超文本标记语言 (Hypertext Markup Language)


    HTML 允许标记（或描述）人类可读的网页文档或用户界面的结构。基于 XML 的 HTML 版本被称为“XHTML5”，与传统的 HTML 相比，它提供了更简单、更整洁的语法。


    超文本传输协议


    HTTP 是一种基于互联网技术 TCP/IP 和 DNS 的无状态请求/响应协议，使用人类可读的文本消息在客户端和 Web 服务器之间进行通信。HTTP 的主要目的是允许从浏览器获取由
    URL 标识的网页文档，并从 浏览器执行的 HTML 表单调用后端 Web 应用程序的操作。最近，HTTP 越来越多地用于提供 API 和 Web 服务。


    ## I


    IANA


    IANA 代表互联网分配编号机构，是 ICANN 的附属机构，负责互联网协议使用的名称和数字。


    ICANN


    ICANN 代表分配名称和数字机构，是一个维护域名系统的国际非营利组织。


    IndexedDB


    一种由浏览器管理的索引数据存储的 JavaScript API。索引允许高性能搜索。像许多 SQL 数据库管理系统（DBMS）一样，IndexedDB 支持数据库事务。


    一组帮助产品适应你的目标语言和文化的最佳实践。它处理多种字符集、度量单位、键盘布局、时间和日期格式以及文本方向。


    国际化 (I18N)


    ## J


    JSON


    JSON 代表 JavaScript 对象表示（JavaScript Object Notation），是一种遵循 JavaScript 对象字面量语法的数据交换格式。许多编程语言使用
    JSON 作为 XML 的轻量级替代方案。


    ## M


    MathML


    一种用于表示数学表达式的开放标准，用于数据交换或在网页内渲染它们。


    MIME 类型（也称为“媒体类型”或“内容类型”）是与文件一起设置关键字字符串，用于指示其内容类型。例如，音频文件可能被标记为 audio/ogg，图像文件可能标记为
    image/png。


    MIME


    模型-视图-控制器 (Model-View-Controller)


    MVC 是一种通用架构隐喻，强调关注点分离原则（主要是模型和视图之间），并将模型视为应用程序最基础的部分。在 MVC 框架中，“M”、“V”和“C”以不同的方式定义。通常，“模型”指的是应用程序的数据源，而“视图”表示用于用户界面的应用程序代码（这些代码基于
    CSS 样式的 HTML 表单和 DOM 事件），而“控制器”通常指的是负责视图和模型之间调调解的（胶水）代码。


    ## O


    对象约束语言 (Object Constraint-Language)


    OCL 是一种用于表示完整性约束的正式逻辑语言，主要用于 UML 类模型。它还允许在类模型中定义派生表达式以定义派生属性，并为操作定义前提和后置条件。


    面向对象编程 (Object-Oriented-Programming)


    OOP 是一种基于对象概念和由对象实例化的类的范式。类就像是对象的蓝图：它们定义了可以应用于对象的属性和方法/函数。面向对象编程的一个高级特性是类层次结构中的继承。


    # 术语表


    网络本体语言 (Web Ontology Language)


    OWL 是一种用于在 Web 上进行知识表示的正式逻辑语言。它允许在 Web 上表示许多约束（主要是类的属性），并支持自动推理。


    ## P


    便携网络图形 (Portable Network Graphics)


    PNG 是一种开放（非私有）图形格式，支持无损压缩。填充（Polyfill）是一段 JavaScript 代码，用于模拟浏览器中的标准 JavaScript
    方法。


    ## R


    资源描述框架 (Resource Description Framework)


    RDF 是一种用于在 Web 上表示机器可读信息的 W3C 语言。


    ## S


    标准标记语言 (Standard Markup Language)


    SGML 是标记语言的 ISO 规范。HTML4 使用 SGML 定义。HTML5 不再基于 SGML，而是有自己的解析规则。


    扩展矢量图形 (Scalable Vector Graphics)


    SVG 是一种基于 XML 的 2D 矢量格式。可以使用 CSS 设置样式并使用 JavaScript 实现交互。HTML5 允许在 HTML 文档中直接嵌入
    SVG。槽（Slot）是一个值对。在面向对象的程序中（例如在 Java 对象中），槽通常是一个属性值对。但在 JavaScript 对象中，槽也可以由方法名和方法体组成。


    ## U


    Unicode


    一种与平台的字符集，包含了世界上大多数脚本语言的全部字符，包括印地语、缅甸语和盖尔兰语。每个字符被分配一个 0 到 1,114,111 之间的唯一整数代码。例如，希腊字母
    π 代码为 960。Unicode 包含了 ASCII 和 ISO-8859-1 (Latin-1) 等旧字符集。XML 基于 Unicode，希腊字母 π（代码为
    960）可以使用 XML 实体 &#960; 插入 XML 文档。XML 文档中的 Unicode 编码是 UTF-8，它对 ASCII 使用单字节，对常用字符使用三字节。


    统一资源标识符 (Uniform Resource Identifier)


    URI 是统一资源定位符 (URL) 或统一资源名称 (URN)。


    统一资源定位符 (Uniform Resource Locator)


    URL 是一种资源名称，包含在 Web 上定位资源的地址。


    统一建模语言 (Unified Modeling Language)


    UML 是一项行业标准，定义了一套建模语言，用于支持面向对象的问题分析和软件设计的各种模型和图表。其核心语言是用于信息/数据建模的类图，以及用于过程/行为建模的序列图、活动图和状态图（或状态图）。


    统一资源名称 (Uniform Resource Name)


    URN 指向资源但不指定其位置。


    用户代理 (User Agent)


    用户代理是如浏览器之类的 Web 客户端程序。


    ## W


    WebM


    WebM 是一种开放（免版税）的视频格式，受 Google Chrome 和 Firefox 支持，但不支持 Microsoft Internet Explorer
    和 Apple Safari。WHATWG 于 2004 年由 Apple、Mozilla 和 Opera 的前员工建立，他们对 W3C 专注于 XHTML2
    标准化导致 Web 技术标准化进展缓慢感到不满。WHATWG 由 Ian Hickson 领导，与 W3C 竞争并合作开发了 HTML5 以及相关的 JavaScript
    API。


    Web 超文本应用工作组 (Web Hypertext Application Working Group)


