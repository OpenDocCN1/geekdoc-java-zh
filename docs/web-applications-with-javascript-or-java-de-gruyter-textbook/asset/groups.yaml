    \ String |\n\n(category=\"Textbook\" NOT subjectArea=undefined) AND (category=\"\
    Biography\" NOT about=undefined))\n\n我们现在从该模型推导出 JS 类模型。\n\n# 13.2.1 构建 JS 类模型\n\
    \n- 我们通过以下步骤构建 JS 类模型：\n  1. 应用类层次结构合并模式，将平台无关的数据类型（作为枚举的）替换为 JS 数据类型。\n  2. 使用\
