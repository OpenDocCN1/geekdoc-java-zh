    \ slots 记录的相应槽位中，该记录将在所有值通过有效性检查后作为调用更新 方法的参数。在调用 update 之前，根据 `classList` 值从关联的作者选择组件中记录的更新，创建一个待添加作者\
    \ ID 引用列表和另一个待删除作者 ID 引用列表（分别在 `authorIdRefsToAdd` 和 `authorIdRefsToRemove` 槽位中），如下程序所示：\n\
    \n## 3.6 如何运行应用并获取代码\n\n```javascript\nhandleSaveButtonClickEvent: function ()\
