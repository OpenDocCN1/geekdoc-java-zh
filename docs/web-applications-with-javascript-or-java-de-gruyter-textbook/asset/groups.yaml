    \n为了简单起见，并且浏览器的 Local Storage 不支持 JTI 所需的外键，我们选择了 TCI 方法，即为 Person 分段的每个类获取一个关系表，但不包含外键。我们的选择导致了下方图\
    \ 13.4 所示的模型，该模型是从图 12.8 所示的设计模型推导出来的：\n\n1. 根据 12.6 节描述的类层次结构设计模式，将 `Manager`\
