- md: "\n# 13 Subtyping with Plain JS\n\nIn this chapter, we first explain the general\
    \ approach to constructor-based subtyping in JavaScript before presenting two\
    \ case studies based on fragments of the information model of our running example,\
    \ the Public Library app, shown above.\n\nIn the first case study, we consider\
    \ the single-level hierarchy with Root Book shown in Figure 12.1, which is an\
    \ incomplete rigid segmentation. We use the Class Hierarchy Merge design pattern\
    \ for re-factoring this simple class hierarchy to a single class that can be mapped\
    \ to a persisted database table.\n\nIn the second case study, we consider the\
    \ multi-level hierarchy consisting of the Person roles Manager and Author, shown\
    \ in Figure 12.8. The segmentation of Person into Employee and Author does not\
    \ have any constraints, which means it is incomplete, overlapping (non-disjoint)\
    \ and non-rigid.\n\nWe use the Class Hierarchy Merge design pattern for re-factoring\
    \ the simple Manager-is-Employee sub-hierarchy, and the Joined Inheritance approach\
    \ for mapping the Employee-and-Author-is-a-Person class hierarchy to a set of\
    \ three tables that are related with each other via foreign key dependencies.\n\
    \nIn both case studies we showed\n\n- 1. how to derive a JS class model, and a\
    \ corresponding entity table model, from the information design model,\n- 2. how\
    \ to code the JS class model in the form of JS model classes,\n- 3. how to write\
    \ the view and controller code based on the model code.\n\n# 13.1 Subtyping with\
    \ JavaScript with Constructor-Based Classes\n\nAs the version ES2015, JavaScript\
    \ did not have an explicit class concept and subtyping was not directly supported,\
    \ so it had to be implemented with the help of certain code patterns providing\
    \ two inheritance mechanisms: (1) inheritance of properties and (2) inheritance\
    \ of methods.\n\nAs we have explained in Chapter 1 of Volume 1, classes can be\
    \ defined in two alternative ways: constructor-based and factory-based. Both approaches\
    \ have their own way of implementing inheritance.\n\nWe summarize the ES2015 code\
    \ pattern for defining a superclass and a subclass in a constructor-based single-inheritance\
    \ class hierarchy with the help of the following example:\n\n| Person |\n| :---\
    \ |\n| firstName : String |\n| lastName : String |\n\n| Student |\n| :--- |\n\
    | studNo : Integer |\n\nFirst, we define a base class, Person, with two properties,\
    \ firstName and lastName, defined with getters and setters:\n\n```\nclass Person\
    \ {\n  constructor ({first, last}) {\n    // assign properties by invoking their\
    \ setters\n    this.firstName = first;\n    this.lastName = last;\n  }\n\n  getFirstName\
    \ () {return this._firstName};\n  setFirstName (f) {\n    . . . check constraints\n\
    \    this._firstName = f;\n  }\n\n  getLastName () {return this._lastName};\n\
    \  setLastName (l) {\n    . . . check constraints\n    this._lastName = l;\n \
    \ }\n}\n```\n\nThen, we define a subclass, Student, with one additional property,\
    \ studNo:\n\n```javascript\nclass Student extends Person {\n  constructor ({first,\
    \ last, studNo}) {\n    // invoke constructor of superclass\n    super({first,\
    \ last});\n    // assign additional properties\n    this.studNo = studNo;\n  }\n\
    \n  get studNo () {return this._studNo;}\n  set studNo (sn) {\n    // check constraints\n\
    \    this._studNo = sn;\n  }\n}\n```\n\nNotice how the constructor of the superclass\
    \ is invoked: with super({first...\n\n# 13.2 Case Study 1: Eliminating a Class\
    \ Hierarchy\n\nSimple class hierarchies can be eliminated by applying the Class\
    \ Hierarchy Merge design pattern. The starting point for our case study is the\
    \ simple class hierarchy shown in the information design model of Figure 12.1\
    \ above, representing a disjoint (but incomplete) rigid segmentation of Book into\
    \ Textbook and Biography. This model is first simplified by applying the Class\
    \ Hierarchy Merge design pattern, resulting in the following:\n\n| isbn[1] : String\
