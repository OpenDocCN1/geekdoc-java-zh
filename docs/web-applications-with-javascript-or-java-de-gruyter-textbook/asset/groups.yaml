  mdcn: "\n\n# 13 使用原生 JS 进行子类化\n\n在本章中，我们首先解释 JavaScript 中基于构造函数的子类化通用方法，然后根据我们运行示例——上文所示的公共图书馆（Public\
    \ Library）应用程序的实例模型片段，介绍两个案例研究。\n\n在第一个案例研究中，我们考虑了图 12.1 所示的以`Book（书籍）`为根的单级层次结构，这是一个不完整的刚性划分。我们使用**类层次结构合并（Class\
    \ Hierarchy Merge）**设计模式将这个简单的类层次结构重构为可以映射到持久化数据库表的单个类。\n\n在第二个案例研究中，我们考虑了图 12.8\
    \ 所示的由`Manager（经理）`和`Author（作者）`角色组成的多级层次结构。将`Person（人员）`划分为`Employee（员工）`和`Author（作者）`没有任何约束，这意味着它是不完全的、重叠的（非不交）且非刚性的。\n\
    \n我们使用**类层次结构合并**设计模式来重构简单的“经理即员工”子层次结构，并使用**连接继承（Joined Inheritance）**方法将“员工且作者是人员”的类层次结构映射到三个通过外键依赖相互关联的表。\n\
    \n在两个案例研究中，我们都展示了：\n\n- 1. 如何从信息设计模型推导出 JS 类模型以及相应的实体表模型，\n- 2. 如何以 JS 模型类的形式编写\
    \ JS 类模型代码，\n- 3. 如何基于模型代码编写视图和控制器代码。\n\n# 13.1 使用基于构造函数的类的 JavaScript 进行子类化\n\
    \n在 ES2015 版本之前，JavaScript 并没有显式的类概念，且不支持支持子类化，因此必须在某些代码模式的帮助下实现，提供两种继承机制：(1)\
    \ 属性继承和 (2) 方法继承。\n\n正如我们在第一卷第 1 章中解释的那样，类可以通过两种替代方式定义：基于构造的和基于工厂的。这两种方法都有自己实现继承的方式。\n\
    \n我们通过以下示例总结了 ES2015 代码模式，用于在基于构造函数的单继承类层次结构中定义父类和子类：\n\n| Person |\n| :--- |\n\
    | firstName : String |\n| lastName : String |\n\n| Student |\n| :--- |\n| studNo\
    \ : Integer |\n\n首先，我们定义一个基类 `Person`，带有两个属性 `firstName` 和 `lastName`，并通过 getter\
    \ 和 setter 定义：\n\n```\nclass Person {\n  constructor ({first, last}) {\n    //\
    \ 通过调用 setter 分配属性\n    this.firstName = first;\n    this.lastName = last;\n \
    \ }\n\n  getFirstName () {return this._firstName};\n  setFirstName (f) {\n   \
    \ . . . check constraints\n    this._firstName = f;\n  }\n\n  getLastName () {return\
    \ this._lastName};\n  setLastName (l) {\n    . . . check constraints\n    this._lastName\
    \ = l;\n  }\n}\n```\n\n然后，我们定义一个子类 `Student`，带有一个额外的属性 `studNo`：\n\n```javascript\n\
    class Student extends Person {\n  constructor ({first, last, studNo}) {\n    //\
    \ 调用父类的构造函数\n    super({first, last});\n    // 分配额外的属性\n    this.studNo = studNo;\n\
    \  }\n\n  get studNo () {return this._studNo;}\n  set studNo (sn) {\n    // check\
    \ constraints\n    this._studNo = sn;\n  }\n}\n```\n\n注意父类构造函数是如何调用的：通过 `super({first...`\n\
    \n# 13.2 案例研究 1：消除类层次结构\n\n通过应用**类层次结构合并**设计模式可以消除简单的类层次结构。我们案例研究的起点是图 12.1 信息设计模型所示的简单类层次结构，它代表了将`Book`分为`Textbook（教科书）`和`Biography（传记）`的不交（但不完全）的刚性划分。该模型首先通过应用类层次结构合并模式进行简化，结果如下：\n\
    \n| isbn[1] | <<enumeration> |\n| title[1] | BookType |\n| year[1] | Integer |\n\
