    \ : ConstraintViolation |\n| checkChair(in c : ClubMember) : ConstraintViolation\
    \ |\n| toString() : string |\n| toRecord() : Object |\n\n## 3 使用原生 JS 实现单向功能关联\n\
    \n单向非功能关联要么是一对多，要么是多对多。这两种情况下关联都通过 JavaScript 来表示。在本章中，我们将展示：\n\n- 如何从 OO 类模型派生多值引用属性的\
    \ JS 类模型\n- 如何编写视图和控制器代码\n\n## 3.1 实现多值引用属性\n\n多值引用属性（如 `authors`）允许指向 `Author`\
    \ 对象的集合。创建新的 `Book` 对象时，构造函数需要如下所示参数：\n\n```javascript\nclass Book {\n  constructor({isbn,\
    \ title, year, authors,IdRefs,\n    publisher, publisher_id}) {\n    this.isbn\
    \ = isbn;\n    this.title = title;\n    this.year = year;\n    // 分配对象引用或 ID 引用\n\
    \    this.authors = authors || authorRefs;\n    if (publisher || publisher_id)\
    \ this.publisher = publisher || publisher_id;\n  }\n}\n```\n\n注意构造包含 `authors`\
    \ 或 `authorRefs`。JavaScript 表达式 `authors || authorRefs` 使用逻辑或运算符 `||`：如果存在 `authors`，则求值为一个映射（map），否则求值为一个数组（array）。我们在属性设置器中处理这种歧义性，代码片段所示：\n\
    \n```javascript\nset authors (a) {\n  this._authors = {};\n  if (Array.isArray(a))\
