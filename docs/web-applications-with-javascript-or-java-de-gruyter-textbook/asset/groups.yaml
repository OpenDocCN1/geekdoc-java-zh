    \    } else {\n      // p can be an ID reference or an object reference\n    \
    \  const publisher_id = (typeof p==\"object\") ? p : p.name;\n      const validationResult\
    \ = Book.checkPublisher(publisher_id);\n      if (validationResult instanceof\
    \ NoConstraintViolation) {\n        // create the new publisher reference\n  \
    \      this._publisher = Publisher.instances[publisher_id];\n      } else {\n\
    \        throw validationResult;\n      }\n    }\n  }\n}\n```\n\n### 2.5.5 Choose\
    \ and Implement a Deletion Policy\n\nFor any reference property, we have to choose\
    \ and implement one of the two possible deletion policies discussed in Section\
    \ 1.2 for managing the corresponding object destruction dependency in the destroy\
    \ method of the property's range class. In our case, when deleting a publisher\
    \ record we have to choose between:\n\n- 1. deleting records of books published\
    \ by the deleted publisher (Existential Dependency);\n- 2. dropping from all books\
    \ published by the deleted publisher reference to the deleted publisher (Existential\
    \ Independence).\n\nAssuming that books do not essentially depend on their publishers,\
    \ we choose the second option. This is shown in the following code of the Publisher.destroy\
    \ method where for all concerned book objects the property book.publisher is cleared:\n\
    \n```\nPublisher.destroy = function (name) {\n    const publisher = Publisher.instances[name];\n\
    \    // delete all references to this publisher in book objects\n    for (let\
    \ key of Object.keys(Book.instances)) {\n        const book = Book.instances[key];\n\
    \        if (book.publisher === publisher) {\n            delete book.publisher;\
    \ // delete the slot\n            console.log(\"Book \" + book.isbn + \" updated.\"\
    );\n        }\n    }\n    // delete the publisher record\n    delete Publisher.instances[name];\n\
    \    console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\nNote that\
    \ the deletion of all references to the deleted publisher is performed in a sequential\
    \ scan through all book objects, which may be inefficient when there are many\
    \ of them. It would be much more efficient when each publisher object would hold\
    \ a list of references to all books published by this publisher. Creating and\
    \ maintaining a list would make the association between books and their publisher\
    \ bidirectional.\n\n### 2.5.6 Serialization and Object-to-Storage Mapping\n\n\
    In the case of a reference property, like Book::publisher, the serialization function\
    \ Book::toString() has to show a human-readable identifier of the referred object,\
    \ like this.publisher.name:\n\n```\ntoString() {\n  var bookStr = `Book: ISBN:\
    \ ${this.isbn}, title: ${this.title}, year: ${this.year}`;\n  if (this.publisher)\
    \ bookStr += `, publisher: ${this.publisher.name}`;\n  return bookStr;\n}\n```\n\
    \nThe object-to-storage conversion function::toRecord() converts typed objects\
    \ with object references to (untyped) record objects with ID references:\n\n```\n\
    toRecord() {\n  var rec = {};\n  for (let p of Object.keys(this)) {\n    // copy\
    \ only property with underscore prefix\n    if (p.charAt(0) == \"_\") {\n    \
    \  switch (p) {\n        case \"_publisher\":\n          // convert object reference\
    \ to ID reference\n          if (this._publisher) rec.publisher_id = this._publisher.name;\n\
    \          break;\n        default:\n          // removing underscore prefix\n\
    \          rec[p.substr(1)] = this[p];\n      }\n    }\n  }\n  return rec;\n}\n\
    ```\n\nThe inverse conversion, from untyped record objects with ID references\
    \ to typed objects with object references, is performed by the Book constructor,\
    \ which tolerates both ID and object references as arguments for setting reference\
    \ properties.\n\n## 2.6 Code the View and Controller\n\nThe user interface (UI)\
    \ consists of a start page index.html that allows navigating to data management\
    \ UI pages, for each object type (in our example, books.html and publishers.html).\
    \ Each of these data management UI pages contains two sections: a Manage section,\
    \ like Manage books, with a menu for choosing a CRUD use case, and a section for\
    \ each CRUD use case, like Retrieve/list books, Create book, Update book and Delete\
    \ book, such that only one of them is displayed at any time (for instance, by\
    \ setting the CSS property display:none for others).\n\n### 2.6.1 Initialize the\
    \ App\n\nFor initializing a management use case, the required data (for instance,\
    \ all publisher and book records) have to be loaded from persistent storage. This\
    \ is performed in a controller procedure as pl.c.books.manage.initialize in c/books.js\
    \ with the following code:\n\n```\npl.c.books.manage = {\n  initialize: function\
    \ () {\n    Publisher.retrieveAll();\n    Book.retrieveAll();\n    pl.v.books.manage.setUpUserInterface();\n\
    \  }\n};\n```\n\nThe initialize method for managing book data first loads the\
    \ publishers table and the books table since the book data management UI needs\
    \ to show their data. Then the book data management menu is rendered by calling\
    \ the setUpUserInterface.\n\n### 2.6.2 Showing Associated Objects in Retrieve/List\
    \ All\n\nIn our example, we have only one reference property, Book::publisher,\
    \ which is functional and optional. For showing information about the optional\
    \ publisher of a book in the Retrieve/list all use case, the corresponding cell\
    \ in the HTML table is filled with the name of the publisher, if there is any:\n"
  mdcn: "\n\n## 2.5 编码模型\n\n请注意，由于 `name` 属性是 Publisher 的标准 ID 属性，我们只在 `checkName`\
    \ 中检查语法约束，并在 `checkNameAsId` 中检查强制性值和唯一性约束，后者会调用 `checkName`：\n\n```javascript\n\
    static checkNameAsId(n) {\n    var validationResult = Publisher.checkName(n);\n\
    \    if ((validationResult instanceof NoConstraintViolation) {\n        if (n\
    \ === undefined) {\n            return new MandatoryValueConstraintViolation(\n\
    \                \"A publisher name is required!\"\n            );\n        }\
    \ else if (Publisher.instances[n]) {\n            validationResult = new UniquenessConstraintViolation(\n\
    \                \"There is already a publisher record with this name!\"\n   \
    \         );\n        } else {\n            validationResult = new NoConstraintViolation();\n\
    \        }\n    }\n}\n```\n\n如果我们需要在其他类中处理 ID 引用（外键），我们需要提供一个名为 `checkNameAsIdRef`\
    \ 的进一步检查来检查引用完整性约束：\n\n```javascript\nstatic checkNameAsIdRef(n) {\n    var validationResult\
    \ = Publisher.checkName(n);\n    if ((validationResult instanceof NoConstraintViolation)\
    \ &&\n        n !== undefined) {\n        if (!Publisher.instances[n]) {\n   \
    \         validationResult = new ReferentialIntegrityConstraintViolation(\n  \
    \              \"There is no publisher record with this name!\"\n            );\n\
    \        }\n    }\n    return validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]`\
    \ 检查是否存在具有给定名称 `n` 的 publisher 对象，然后创建一个作为异常类 `ReferentialIntegrityConstraintViolation`\
    \ 实例 `validationResult` 对象。`Book.checkNameAsIdRef` 由 `Book.checkPublisher` 函数调用：\n\
    \n## 3. 使用原生 JS 实现单向功能关联\n\n```javascript\nclass Book {\n  ..\n  static checkPublisher(publisher_id)\
    \ {\n    var validationResult = null;\n    if (publisher_id === undefined || publisher_id\
    \ === \"\") {\n      validationResult = new NoConstraintViolation(); // 可选\n \
    \   } else {\n      // 调用外键约束检查\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n### 2.5.4 编码属性 setter\
    \ 方法\n\n在 setter 中，会调用相应的检查函数并仅设置属性。对于引用属性，我们允许使用对象引用或 ID 引用调用 setter。结果产生的歧义通过测试调用\
    \ setter 时提供的参数是否为对象来解决。例如，publisher 的 setter 编码方式如下：\n\n```javascript\nclass\
    \ Book {\n  ..\n  set publisher(p) {\n    if (!p) // 取消 publisher\n      delete\
    \ this._publisher;\n    } else {\n      // p 可以是 ID 引用或对象引用\n      const publisher_id\
    \ = (typeof p==\"object\") ? p : p.name;\n      const validationResult = Book.checkPublisher(publisher_id);\n\
    \      if (validationResult instanceof NoConstraintViolation) {\n        // 创建新的\
    \ publisher 引用\n        this._publisher = Publisher.instances[publisher_id];\n\
    \      } else {\n        throw validationResult;\n      }\n    }\n  }\n}\n```\n\
    \n### 2.5.5 选择并实现删除策略\n\n对于任何引用属性，我们必须在第 1.2 节中讨论的两种可能的删除策略中选择并实现一种，用于属性范围类的 `destroy`\
    \ 方法中管理对应的对象销毁依赖。在我们的情况下，当删除 publisher 记录时，我们必须在两者之间进行选择：\n\n- 1. 删除由删除 publisher\
    \ 出版籍记录（存在依赖性）；\n- 2. 从所有由删除 publisher 出版籍中删除对该删除 publisher 的引用（存在独立性）。\n\n假设书籍本质上并不依赖其出版社，我们选择第二种方案。这在以下\
    \ `Publisher.destroy` 方法的代码所示，对于所有相关的书籍对象，属性 `book.publisher` 都被清空了：\n\n```javascript\n\
    Publisher.destroy = function (name) {\n    const publisher = Publisher.instances[name];\n\
    \    // 删除书籍对象中对此 publisher的所有引用\n    for (let key of Object.keys(Book.instances))\
    \ {\n        const book = Book.instances[key];\n        if (book.publisher ===\
    \ publisher) {\n            delete book.publisher; // 删除槽位\n            console.log(\"\
    Book \" + book.isbn + \" updated.\");\n        }\n    }\n    // 删除 publisher 记录\n\
    \    delete Publisher.instances[name];\n    console.log(\"Publisher \" + name\
    \ + \" deleted.\");\n};\n```\n\n注意，对已删除 publisher 所有引用的删除是通过顺序扫描完成的，当有很多书籍时，这种方法效率较低。如果每个\
    \ publisher 对象持有一个其出版书籍的列表，将使书籍与出版社之间的关联更加高效。\n\n## 2.6 编码视图和控制器\n\n用户界面（UI）由一个首页\
    \ `index.html` 组成，允许导航到每个对象类型的数据管理页面（在我们的示例中为 books.html 和 publishers.html）。每个数据管理页面包含两个部分：管理部分（如管理书籍，带有选择\
    \ CRUD 用例的菜单），以及每个 CRUD 用例的部分（如列表书籍、创建书籍、更新书籍和删除书籍），确保每次只显示一个（例如通过对其他设置 CSS 属性\
    \ display:none）。\n\n### 2.6.1 初始化应用\n\n在初始化管理用例时，必须从持久化存储加载所需的数据（例如所有的出版社和书籍记录）。这在控制器程序中完成，如\
    \ `c/books.js` 中的 `pl.c.books.manage.initialize`：\n\n```javascript\npl.c.books.manage\
    \ = {\n  initialize: function () {\n    Publisher.retrieveAll();\n    Book.retrieveAll();\n\
    \    pl.v.books.manage.setUpUserInterface();\n  }\n};\n```\n\n管理书籍数据的 `initialize`\
    \ 方法首先加载出版社表和书籍表，因为书籍数据管理 UI 需要显示它们的数据。然后通过调用 `setUpUserInterface` 渲染书籍数据管理菜单。\n\
    \n### 2.6.2 在列表中显示关联对象\n\n对于引用属性，如 Book::publisher，序列化函数 `toString()` 必须显示引用对象的可读标识符，如\
    \ `this.publisher.name`：\n\n```javascript\ntoString() {\n  var bookStr = `Book:\
    \ ISBN: ${this.isbn}, title: ${this.title}, year: ${this.year}`;\n  if (this.publisher)\
    \ bookStr += `, publisher: ${this.publisher.name}`;\n  return bookStr;\n}\n```\n\
    \n对象到存储的转换函数 `toRecord()` 将带有对象引用的类型对象转换为带有 ID 引用的非类型记录对象：\n\n```javascript\n\
    toRecord() {\n  var rec = {};\n  for (let p of Object.keys(this)) {\n    // 只复制带有下划线前缀的属性\n\
    \    if (p.charAt(0) == \"_\") {\n      switch (p) {\n        case \"_publisher\"\
    :\n          // 将对象引用转换为 ID \n          if (this._publisher) rec.publisher_id\
    \ = this._publisher.name;\n          break;\n        default:\n          // 去下划线前缀\n\
    \          rec[p.substr(1)] = this[p];\n      }\n    }\n  }\n  return rec;\n}\n\
    ```\n\n从带有 ID 引用的非类型对象到带有引用对象的类型对象的反转换由 Book 构造函数执行，它接受 ID 和对象引用作为设置引用属性的参数。\n\
    \n"
