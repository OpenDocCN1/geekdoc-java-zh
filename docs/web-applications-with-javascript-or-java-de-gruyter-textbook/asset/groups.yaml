    \ JavaScript Elements\n\nIn this section, we present the most important new language\
    \ elements introduced to JavaScript by ECMAScript 2015+ (that is, 2015+16+17+18+19+20+…).\n\
    \n### 2.1.1 Block-Scope Variable Declarations with let and const\n\nES5 did not\
    \ allow declaring variables the scope of which is a block delimited by pair of\
    \ curly braces, { }, or defined by a for loop. Rather, all variables declared\
    \ with var, even if declared within a block, either a function scope or the global\
    \ scope. The new feature of block-scope variable declarations with let and const\
    \ allows local variables with a finer-grained scope, which helps avoiding unintended\
    \ duplicates and leads to more modular code.\n\nThere is only one meaning difference\
    \ between let and const. Variables declared with const are frozen or immutable,\
    \ and in this sense constant, while let variables are not. It is preferable to\
    \ use const for all variables that are not supposed to change their values. Otherwise,\
    \ or if this is not clear, one should declare the variable with let if it is a\
    \ block-scoped variable, or with var if it is a global or function-scoped variable.\n\
    \n## 2.1.2 Arrow Functions\n\n## Example 2.1.\n\n```\nlet evens = [0,2,4,6,8];\n\
    \ odds = evens.map(v => v+1); // [1,3,5,7,9]\n// instead of evens.map(function\
    \ (v) { return v+1; })\n```\n\n## Example 2.2.\n\n```\nthis.nums = [1,3,5,8,10,12,15,17];\n\
    this.fives = [];\nthis.nums.forEach(v => { if (v % 5 === 0) this.fives.push(v);\
    \ });\n// instead of this.nums.forEach(\n function (v) { if (v % 5 === 0) this.fives.push(v);\
    \ }, this)\n```\n\n## 2.1.3 For-Of over Iterable Objects\n\nIterables objects\
    \ include strings, arrays, array-like objects (e.g., the built-in arguments or\
