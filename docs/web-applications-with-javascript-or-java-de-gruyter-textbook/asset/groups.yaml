    \ [1, 2, 3];\nconst combined = [...list, 4, 5];\n```\n\n## 2.1.6 Destructuring\n\
    \nUsing Destructuring, the record fields are extracted into ordinary variables.\
    \ For instance,\n\n```javascript\nconst person = { first: \"James\", last: \"\
