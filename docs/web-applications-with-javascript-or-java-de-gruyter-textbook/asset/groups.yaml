    \n注意，构造函数使用了 ES2015 的函数参数解构功能，通过单个记录参数定义。\n我们以以下方式为 `category` 属性编写了 `checkCategory`\
    \ 和 `setCategory` 方法：\n\n```javascript\nstatic checkCategory(c) {\n  if (c ===\
    \ undefined || c === \"\") {\n    return new NoConstraintViolation(); // category\
