    \ to invoke the corresponding check AsIdRef method of the property's range class\
    \ for checking the property's implicit referential integrity constraint;\n- 3.\
    \ converting a collection of object references to a collection of ID references\
    \ in the object-to-storage conversion function toRecord.\n- 2. In the user interface\
    \ (\"view\") code we now have to take care of\n- 1. showing information about\
    \ a set of associated objects in the property's column of the table view of the\
    \ Retrieve/list all use case; the simplest approach is showing a comma-separated\
    \ list of ID references, possibly combined with corresponding names; alternatively,\
    \ HTML lists can be rendered in the property's data table cells;\n- 2. allowing\
    \ to select a set of associated objects from a list of all instances of the property's\
    \ range class in the Create and Update cases.\n\nThe last issue, allowing to select\
    \ a set of associated objects from a list of all instances of some class, can\
    \ not be solved with the help of an HTML multiselect control because of its poor\
    \ usability. Whenever the selectable options is greater than a threshold (defined\
    \ by the number of options that can be seen on the screen without scrolling),\
    \ the multiple-select element is longer usable, and an alternative multiple-choice\
    \ widget has to be used.\n\n## 3.4 Code the Model\n\nNotice that, for simplicity,\
    \ we do not include the code for all constraint validation checks shown in the\
    \ JS class model in the code of the example app.\n\n### 3.4.1 Summary\n\nCode\
    \ each class of the JS class model as an ES2015 class with implicit getters and\
    \ setters:\n\n- 1. Code the property checks in the form of class-level ('static')\
    \ methods. Take care that all constraints of a property as specified in the JS\
    \ class model are properly coded in the property checks.\n- 2. For each single-valued\
    \ property, code the specified getter and setter such that in each setter, the\
    \ corresponding property check is invoked and the property is only set/unset,\
    \ if the check does not detect any constraint violation.\n- 3. For each multi-valued\
    \ property, code its add and remove operations, as well as the specified get/set\
    \ operations:\n- 1. Code the add/remove operations as (instance-level) methods\
    \ that invoke the corresponding property checks.\n- 2. Code the setter such that\
    \ it invokes the add operation for each item of the collection to be assigned.\n\
    - 4. Write the code of the serialization function to toString() and the object-to-storage\
    \ conversion function toRecord()..\n- 5. Take care of deletion dependencies in\
    \ the destroy method.\n\nThese steps are discussed in more detail in the following.\n\
    \n### 3.4.2 Code the Add and Remove Operations\n\nFor the multi-valued property\
    \ Book::authors, we need to code the operations addAuthor and removeAuthor. Both\
    \ operations accept one parameter denoting an author by ID reference (the author\
    \ as integer) or by object reference. The code of addAuthor is as follows:\n\n\
    ```js\naddAuthor (a) {\n  // can be ID reference or object reference\n  const\
    \ author_id = (typeof a == \"object\") ? parseInt(a) : a.authorId;\n  const validationResult\
    \ = Book.checkAuthor( author_id);\n  if (author_id && validationResult instanceof\
    \ NoConstraintViolation) {\n    // add the author reference\n    let key = String(author_id);\n\
    \    this._authors[key] = Author.instances[key];\n  } else {\n    throw validationResult;\n\
    \  }\n}\n```\n\nIn removeAuthor method, the author reference is first checked,\
    \ and if no constraint violation is detected, the corresponding entry in the map\
    \ _authors is deleted:\n\n```js\nremoveAuthor (a) {\n  // can be ID reference\
    \ or object reference\n  const author_id = (typeof a == \"object\") ?\nparseInt(a)\
    \ : a.authorId;\n  const validationResult = Book.checkAuthor( author_id);\n  if\
    \ (validationResult instanceof NoConstraintViolation) {\n    // delete the author\
    \ reference\n```\ndelete this._authors[author_id];\n} else {\n  throw validationResult;\n\
    }\n```\n\nFor assigning an array of ID references, or a map of object references,\
    \ to the property Book::authors, the method setColor adds one by one with the\
    \ help of addAuthor:\n\n```js\nset authors (a) {\n  this._authors = {};\n  if\
    \ (Array.isArray(a)) { // array of IdRefs\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n\
    \    }\n  } else { // map of IdRefs to object references\n    for (let idRef of\
    \ Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n###\
    \ 3.4.3 Choose and Implement a Deletion Policy\n\nFor the reference property Book::authors,\
    \ we have to choose and implement a deletion in the destroy method of the Author\
    \ class. We have to choose between deleting all books (co-)authored by the deleted\
    \ author (reflecting the logic of Existential Dependency);\n\n- 1. deleting all\
    \ books (co-)authored by the deleted author (reflecting the logic of Existential\
    \ Dependency);\n- 2. dropping from all books (co-)authored by the deleted author\
    \ the reference to the deleted author (reflecting the logic of Existential Independence).\n\
    \nFor simplicity, we go for the second option. This is shown in the following\
    \ code of the static Author.destroy method for all concerned book objects the\
    \ author reference book.authorKey is dropped:\n\n```js\nAuthor.destroy = function\
    \ (authorID) {\n  const author = Author.instances[authorID];\n  // delete all\
    \ dependent book records\n  for (let isbn of Object.keys(Book.instances)) {\n\
    \    let book = Book.instances[isbn];\n    if (book.authors[authorID]) delete\
    \ book.authors[authorID];\n  }\n}\n```\n"
  mdcn: "\n\n# 40 — 3 使用原生 JS 实现单向非功能关联\n\n在该模型中，除了单值引用属性 `Book::publisher`（代表 `Book-Publisher`\
    \ 之间的单向多对一关联）外，还有多值引用属性 `Book::authors`（代表 `Book-has` 之间的单向多对多关联）。\n\n对于面向对象类模型中的\
    \ JS 类模型，我们必须遵循与第 2.3 节相同的步骤，此外，我们还必须处理多值引用属性，例如 `Book::authors`，对于这些属性，我们需要：\n\
    \n- 1. 创建一个类级别的检查操作，例如 `checkAuthor`，负责检查要添加到属性集合中的引用是否符合对应的引用完整性约束；\n- 2. 创建一个\
    \ `add` 操作，例如 `addAuthor`，用于向集合中添加引用；\n- 3. 创建一个 `remove` 操作，例如 `removeAuthor`，用于从集合中移除引用。\n\
    \n这导致了以下 JS 类模型：\n\n| Book (书籍) | Publisher (出版商) |\n| --- | --- |\n| get/set=isbn(id):\
    \ string (id) | get/set=name: string (id) |\n| get/set=title(id): string (id)\
    \ | get/set=address: string |\n| get/set=publisher(0..1): Publisher | checkName(n:\
    \ string): ConstraintViolation |\n| checkIsbn(isbn: string): ConstraintViolation\
    \ | checkName(id: string): ConstraintViolation |\n| checkAddRef(isbn: string):\
    \ ConstraintViolation | checkAddress(n: string): ConstraintViolation |\n| checkTitle(title:\
    \ string): ConstraintViolation | toRecord(): string |\n| checkYear(year: integer):\
    \ ConstraintViolation | toRecord(): Object |\n| checkAuthor(publisher: string):\
    \ ConstraintViolation | Author |\n| checkAuthor(author: Author): ConstraintViolation\
    \ | get/set=authorid: number(id) (id) |\n| addAuthor(author: Author) | get/set=name:\
    \ string |\n| removeAuthor(author: Author) | checkAuthorId(id: number(id)): ConstraintViolation\
    \ |\n| toString(): string | checkAuthorAddRef(id: number(id)): ConstraintViolation\
    \ |\n| toRecord(): Object | checkName(n: string): ConstraintViolation |\n| | toString():\
    \ string |\n| | toRecord(): Object |\n\n## 3.3 新问题\n\n在处理功能关联时（如上一章所讨论），我们现在必须处理以下新问题：\n\
    \n- 1. 在模型代码中，我们必须处理多值引用属性，这需要实现：\n- 1. 一个 `add` 方法和一个 `remove` 方法，例如 `addAuthor`\
    \ 和 `removeAuthor`，以及一个通过 `add` 方法分配一组对象引用的 setter 方法，可能将 ID 引用转换为对象引用；所有三个方法都需要检查基数约束（如果有的话）；\n\
    - 2. 一个类级别的检查操作，例如 `checkAuthor`，它必须调用属性范围类（range class）中对应的 `checkIdRef` 方法，以检查属性的隐式引用完整性约束；\n\
    - 3. 在对象到存储的转换函数 `toRecord` 中，将对象引用集合转换为 ID 引用集合。\n- 2. 在用户界面（“视图”）代码中，我们现在必须处理：\n\
    - 1. 在“检索/列出所有”用例的表格视图的属性列中，显示有关一组关联对象的信息；最简单的方法是显示逗号分隔的 ID 引用列表，可能结合相应的名称；或者，可以在属性的数据表格单元格中渲染\
    \ HTML 列表；\n- 2. 在“创建”和“更新”用例中，允许从属性范围类的所有实例列表中选择一组关联对象。\n\n最后一个问题——即从某些类的所有实例列表中选择一组关联对象——无法通过\
    \ HTML 多选择控件解决，因为其易用性较差。每当可选选项过多时，多选择控件的体验都很糟糕，这时不能使用 HTML 多选择控件。\n\n## 3.4 代码实现\n\
    \n注意，在模型代码中，我们不需要考虑界面控件的易用性。\n\n### 3.4.1 总结\n\n在面向对象类模型中，对于 `Book-Author` 关联：\n\
    \n- 1. 在 `Book` 类中，我们需要实现关联的引用完整性约束。\n- 2. 对于单值引用属性，我们需要实现 `getter` 和 `setter`。\n\
    - 3. 对于多值引用属性，我们需要实现 `checkAuthor` 方法。\n- 4. 在 `add` 方法中，我们需要处理关联对象的集合。\n- 5.\
    \ 在 `remove` 方法中，我们需要处理关联对象的集合。\n\n### 3.4.2 实现添加和移除操作\n\n对于多值属性 `Book::authors`，我们需要实现\
    \ `addAuthor` 和 `removeAuthor` 操作。这两个操作都接受 ID 引用或对象引用：\n\n```js\naddAuthor(a)\
    \ {\n  // 处理 ID 引用或对象引用\n  const author_id = (typeof a === \"object\") ? a.id\
    \ : a;\n  const validationResult = this.checkAuthor(author_id);\n  if (validationResult\
    \ === null) {\n    // 添加到集合\n    const key = String(author_id);\n    this._authors[key]\
    \ = a;\n  } else {\n    throw validationResult;\n  }\n}\n```\n\n在 `removeAuthor`\
    \ 方法中，首先检查引用，如果没有发现约束违反，则删除引用：\n\n```js\nremoveAuthor(a) {\n  // 处理 ID 引用或对象引用\n\
    \  const author_id = (typeof a === \"object\") ? a.id : a;\n  const validationResult\
    \ = this.checkAuthor(author_id);\n  if (validationResult === null) {\n    // 从集合删除\n\
    \    const key = String(author_id);\n    delete this._authors[key];\n  } else\
    \ {\n    throw validationResult;\n  }\n}\n```\n\n为了将一组 ID 引用或一组对象引用赋值给 `Book::authors`\
    \ 属性，setter 方法需要通过 `addAuthor` 方法逐个添加：\n\n```js\nset authors(a) {\n  this._authors\
    \ = {};\n  if (Array.isArray(a)) { // ID 引用数组\n    for (let idRef of a) {\n  \
    \    this.addAuthor(idRef);\n    }\n  } else { // ID 到对象的映射\n    for (let idRef\
    \ of Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n\
    ### 3.4.3 选择并实现删除策略\n\n对于 `Book::authors` 属性，我们需要在 `Author` 类的 `destroy` 方法中选择并实现删除策略。我们必须在以下方案之间选择：\n\
    \n- 1. 删除所有由该作者编写书籍（反映了存在依赖逻辑）；\n- 2. 从所有由该作者编写的书中删除对该作者的引用（反映了存在独立逻辑）。\n\n为了简单起见，我们选择第二种方案。如下静态\
    \ `Author.destroy` 方法所示，对于所有相关的书籍对象，作者引用 `book.authorKey` 将被删除：\n\n```js\nAuthor.destroy\
    \ = function (authorID) {\n  const author = Author.instances[authorID];\n  //\
    \ 删除所有相关的书籍记录\n  for (let isbn of Object.keys(Book.instances)) {\n    let book\
    \ = Book.instances[isbn];\n    if (book.authors[authorID]) delete book.authors[authorID];\n\
    \  }\n}\n```\n\n"
