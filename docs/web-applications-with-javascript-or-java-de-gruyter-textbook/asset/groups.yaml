    \ As a result of this annotation, a relation table between Book and Author is\
    \ created, and the resulting SQL code is shown below:\n\n```\nCREATE TABLE IF\
    \ NOT EXISTS `books_author` (\n  `Book_ISBN` varchar(10) NOT NULL,\n  `authors_PERSONID`\
    \ int(11) NOT NULL\n);\n```\n\nThe resulting class name is the underscore-separated\
    \ concatenation of the corresponding table names (e.g., books_author). The primary\
    \ key columns from each of the two tables are used to implement the relation.\
    \ The corresponding column names are created as follows:\n\n+   - for the table\
    \ (e.g., books) which corresponds to the class with the @ManyToMany annotation\
    \ (e.g., Book), the class name is used as well as the primary key name, (e.g.,\
    \ Book_ISBN).\n- for the other table (e.g., authors), the table name is concatenated\
    \ with the primary key column name, (e.g., authors_PERSONID).\n\nIt is possible\
    \ to control these parameters, i.e., name and relation column names, using the\
    \ @JoinTable annotation. To obtain a custom named relation table, e.g., books_authors\
    \ and the custom relation named columns, e.g., book_isbn and author_personid,\
    \ one can use:\n\n```\n@JoinTable(name=\"books_authors\",\nJoinColumns={@JoinColumn(name=\"\
    book_isbn\",\nreferencedColumnName=\"ISBN\")},\ninverseJoinColumns={@JoinColumn(name=\"\
    author_personid\",\nreferencedColumnName=\"PERSONID\")})\n```\n\nIn our application,\
    \ we keep the default, so a@JoinTable annotation is not used.\nThe corresponding\
