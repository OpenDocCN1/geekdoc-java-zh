    ## 1.8 用户界面中引用属性的渲染


    用于数据输入输出的用户界面（UI）的小部件通常对应于模型类中定义的属性。我们必须区分对应于属性的输入字段和对应于枚举属性或引用属性的选择部件（如选择列表）。在
    UI 中使用选择控件而不是输入字段来表示引用属性，可以防止用户输入无效 ID，从而确保引用完整性。通常情况下，无论进行何种选择，单值引用属性可以在 UI 中渲染为单选列表。如果引用属性的范围足够小（例如小于
    7），可以使用单选框组（radio button group）。多值引用属性可以在 UI 中渲染为多选列表。然而，当选项很多（例如超过 20 个）时，对应的
    HTML 多选控件因为渲染方式太分散而不适用。对于 UI 中具有少量关联对象的通用情况（例如少于 7 个选项），我们需要开发一种特殊的 UI 小部件，允许从列表中添加（移除）对象。


    这种多选小部件由：


    1. 一个包含（关联）对象的 HTML 列表，每个列表项都有一个用于移除对象的按钮；

    2. 一个单选控件，配合一个按钮，允许从列表中添加（移除）对象。


    ## 1.9 多值属性的集合类型


    默认情况下，非功能关联将目标类的实例集与源类关联。然而，也存在对应的引用属性无序的情况。


    在以下示例中，关联端不是有序的，而集合类型是包（bag），这对应于多值属性。


    ## 1.16 引用属性与单向关联


