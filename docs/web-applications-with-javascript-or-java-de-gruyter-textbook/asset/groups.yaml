    In the case of a derived inverse property that is multi-valued while its inverse
    property is single-valued (like Publisher::publishedBooks in Figure 7.4 below
    being derived from Book::publisher), the life cycle dependencies imply that


    - 1. whenever a ''base object'' (such as a book) is created, the corresponding
    inverse property is to be updated by adding a reference to the new base object
    to its value set (adding a reference to the new object to Publisher::publishedBooks);


    - 2. whenever the base property is updated (e.g., a new publisher is assigned
    to a book), the corresponding inverse property (in our example, Publisher::publishedBooks)
    has to be updated as well as removing the old reference from its value set and
    adding the new one;


    - 3. whenever a base object (such as a book) is destroyed, the corresponding inverse
    property is to be updated by removing the base object from its value set (like
    removing a reference to the object to be destroyed from Publisher::publishedBooks);


    Notice from a purely computational point of view, we are free to choose either
    of the two mutually inverse properties (like Book::authors and Author::authored)
    to be the master. In many cases, associations represent asymmetrical ontological
    existence dependencies that dictate which of the two mutually inverse property
    references is the master. For instance, the authorship association between the
    classes Book and Author represents an ontological existence dependency of books
    on their authors. A book existentially depends on its author(s), while an author
    does not existentially depend on any of her books. Consequently, the corresponding
    object lifecycle dependency between Book and Author implies that their bidirectional
    association is maintained by maintaining Author references in Book::authors as
    the natural choice of master property, while Author::authoredBooks is the slave
    property, which is derived from Book::authors.


    ## 7.2 Making an OO Class Model


    Since classical programming languages do not support explicit associations as
    first class citizens, but only classes with reference properties representing
    implicit associations, we have to eliminate all explicit associations for obtaining
    an OO class model.


    ### 7.2.1 The Basic Property


    The starting point of our association elimination procedure is an information
    design model with various kinds of unidirectional and bidirectional associations,
    such as the model shown in Figure 7.1 still contains any non-directed associations,
    we first have to turn them into directed ones by making a decision on the ownership
    of their ends, which is typically based on navigability requirements.


    Notice that both associations in the Publisher-Book-Author design model, publisher-publishedBooks
    and authoredBooks-authors (or Authorship), are bi-directional as indicated by
    the ownership dots at both association ends. For eliminating explicit associations
    from an information design model, we have to perform the following steps:


    - 1. Eliminate unidirectional associations, connecting a source with a target
    class, replacing them with a reference property in the source class such that
    the target class is its range.


    - 2. Eliminate bidirectional associations by replacing them with a pair of mutually
    inverse reference properties.


    ### 7.2.2 How to Eliminate Unidirectional Associations


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having the target
    class as its range. Its multiplicity is the same as the multiplicity of the target
    association end. Its name is the name of the association end, if there is, otherwise
    it is set to the name of the target class (possibly pluralized, if the reference
    property is multi-valued).


    ### 7.2.3 How to Eliminate Bidirectional Associations


    A bidirectional association, as the authorship association between the classes
    Book and Author in the model shown in Figure 7.1 above, is replaced with a pair
    of mutually inverse reference properties, such as Book::authors and Author::authoredBooks.
    Since both properties represent the same information (the same set of binary relationships),
    it''s an option to consider one of them being the “master” and the other the “slave”,
    which is derived from the master. We discuss the two cases of one-to-one and a
    many-to-many association


    - 1. In the case of a bidirectional one-to-one association, which leads to a pair
    of mutually single-valued reference properties, in each of the two associated
    classes. Since both of them represent essentially the same information (the collection
    of links/relationships), one has to choose which of them is considered the master
    property, such that the other is the slave property, which is derived from the
    master property by inversion. In the class diagram, the slave property is designated
    as a derived property that is automatically updated whenever 1) a new master object
    is created, 2) the master reference property is updated, or 3) a master object
    is destroyed. This transformation is illustrated in Figure 7.2.


    | Committee | ClubMember |

    | --- | --- |

    | name : String | 0..1 |


    ![](img/64ab58e459ff4b56e7fc22fe3998651a_104_0.png)


    | Committee | ClubMember |

    | --- | --- |

    | name : String | /chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember |


    **Figure 7.2:** Turn a bidirectional one-to-one association into a master-slave
    pair of mutually inverse single-valued reference properties.


    - 2. A bidirectional many-to-many association is mapped to a pair of mutually
    inverse multi-valued reference properties, in each of the two classes participating
    in the association. Again, in one of the classes, the multi-valued reference property
    representing the (inverse) association is designated as a *derived property* that
    is automatically updated whenever the corresponding property in the other class
    (where the association is maintained) is updated. This transformation is illustrated
    in Figure 7.3.


    | Book | Author |

    | --- | --- |

    | isbn : String | personId : Integer |

    | title : String | name : String |


    ![](img/64ab58e459ff4b56e7fc22fe3998651a_104_1.png)


    | Book | Author |

    | --- | --- |

    | isbn[1] : String | personId[1] : Integer |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | /authoredBooks[*] (inverse of author) |


    **Figure 7.3:** Turn a bidirectional many-to-many association into a master-slave
    pair of mutually inverse multi-valued properties.


    ### 7.2.4 The Resulting OO Class Model


    After replacing both bidirectional associations with reference properties, we
    obtain the OO class model shown in 7.4.


    | Book | Publisher |

    | --- | --- |

    | isbn[1] : String | name[1] : String |

    | title[1] : String | address[1] : String |

    | year[1] : Integer | /publishedBooks[*] (inverse of publisher) |

    | publisher[0..1]: Publisher | |

    | authors[*] : Author | |

    | | personId[1] : Integer

    | | name[1] : String

    | | /authoredBooks[*] (inverse of authors) |


    Figure 7.4: The OO class model with two pairs of mutually inverse properties.


    Since books are entities that essentially depend on and possibly on publishers,
    and not the other around, it''s natural to maintain the master references in book
    objects, and consider the inverse references in publisher and author objects as
    derived (or ''slave'') data. Therefore, we define publishedBooks and authoredBooks
    as inverse reference properties, which is indicated by their slash prefix in the
    OO class model.


    The meaning of this OO class model can be illustrated by a sample data population
    for the three model classes involved:


