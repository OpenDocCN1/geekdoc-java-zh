    isbn[1] : VARCHAR (pkey)\ntitle[1] : VARCHAR\nyear[1] : INTEGER\ncategory[0..1]\
    \ : \"TextBook\",\"Biography\" (frozen)\nsubject_area[0..1] : VARCHAR\nabout[0..1]\
    \ : VARCHAR\n```\n\n```sql\ninvariant\n((category=\"TextBook\" IFF subject_area\
    \ IS NOT NULL)\n(category=\"Biography\" IFF ABOUT IS NOT NULL))\n```\n\n**Figure\
    \ 12.9:** An SQL table model with a single table representing the Book class hierarchy.\n\
    \nIt is a common approach to add a special *discriminator column* for representing\
