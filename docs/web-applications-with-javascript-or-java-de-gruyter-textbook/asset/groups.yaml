    ## 10.2 关联类 (Association Classes)


    关联类是表示关联的类。


    回想在面向对象（OO）类模型中，简单关联通过转换为涉及的对象类的引用属性来消除，如第 1.7 节所示。但每当关联具有属性时，它无法被消除，必须在面向对象的类模型中转换为一个类。


    例如，考虑对象类型*书*（Book）和*人*（Person）之间的关联*预订*（*Reservation*，它允许表达诸如“ISBN 为 3627921105
    的书被 ID 为 4701199 的人在 2020-08-22 预订”等事实。由于它有一个日期属性，该关联在信息设计模型中被建模为关联类，如下类图所示：


    | 预订 (Reservation) | | | |

    | --- | --- | --- | --- |

    | date : Date | * | * | Person (人) |

    | Book | | | id : Integer (id) |

    | isbn : String (id) | reserved_by | name |

    | title : String | | |


    在面向对象的类模型中（这是编写应用模型类的基础），关联类转换为普通类，并带有引用涉及的对象类的引用属性。例如，关联类预订（Reservation）转换为以下面向对象的类模型：


    | 预订 (Reservation) |

    | --- |

    | book : Book |

    | reserved_by : Person |

    | date : Date |


