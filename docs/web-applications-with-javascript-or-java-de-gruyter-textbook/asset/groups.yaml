    \ ZIP 包，以及\n\n## 5.7 引用属性的值：Set 与有序 Set\n\n你需要编辑的 ANT 脚本文件（修改 `server.folder`\
    \ 属性值）。\n现在，在控制台或终端中执行部署命令：\n\n```bash\nant deploy -Dappname=UnidirectionalAssociationApp\n\
    ```\n\n最后，启动你的 Tomcat 服务器（Windows 使用 `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。这可能需要一些时间，当控制台显示以下内容时即为就绪：Initializing\
    \ [some library versions...]。最后，打开浏览器访问：http://localhost:8080/UnidirectionalAssociationApp/WebContent/views/index.xhtml\n\
    \n### 引用属性的值：Set 与有序 Set\n\nSet 是无序集合且元素是唯一的，而 List 是有序集合且允许重复元素。当关联是有序的，如图 5.1\
    \ 中的 `authors`，这意味着其的的范围需要是一个有序集合类型，例如 SortedSet 或 List。\n\n| Book | authored\
    \ | Author |\n| --- | --- | --- |\n| isbn : String | | personid: Integer |\n|\
    \ title : String | | name: String |\n| year : Integer | | |\n| | (ordered) | |\n\
    \n从理论上讲，集合属性应该使用 `Set<T>` 定义（例如将 `Set<Book>` 作为 `authored` 的范围），而有序集合属性应该使用 `SortedSet<T>`\
    \ 定义（例如将 `SortedSet<Author>` 作为 `authors` 的范围）。Java 类型通常由 `HashSet` 实现，而 `SortedSet`\
    \ 通常由 `TreeSet` 实现。\n\n然而，如果不担心重复元素，集合属性和有序集合属性都可以使用泛型接口 `List<T>` 定义其范围，其通常由\
    \ `ArrayList` 实现。\n\n## 6 单向关联练习项目\n\n所有项目都包含以下任务：\n\n1. 根据给定的设计模型建立类模型。提示：将关联替换为相应的引用属性。\n\
    2. 根据类模型建立 JavaScript 类模型或 Java Entity 模型。提示：添加 getter 和 setter 方法。\n3. 按照指南编写你的\
    \ JS 类模型或 Java Entity 模型。\n\n确保你的页面符合 HTML5 的 XML 语法，且 JavaScript 代码符合指南并经过 JSHint\
    \ 检查。\n\n### ##6.1 为电影分配导演和演员\n\n此项目基于下方所示的信息设计模型。需要扩展之前的应用，增加管理电影演员和导演数据的功能。这通过添加\
    \ `Person` 模型类以及 Movie 与 Person 之间的两个单向关联来实现：\n\n1. 多对一关联，分配恰好一个人作为电影导演；以及\n2.\
    \ 多对多关联，分配零或多个个人作为电影的演员。\n\n![](img/64ab58e459ff4b56e7fc22fe3998651a_95_0.png)\n\
    \n"
