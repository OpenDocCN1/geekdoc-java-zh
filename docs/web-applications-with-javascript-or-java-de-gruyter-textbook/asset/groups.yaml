  - "[PAGE 71]\n\n# 4.4 Write the Model Code\n\n# 4.3 New Issues\n\nCompared to the\
    \ single-class apps discussed in previous, we have to deal with a number of new\
    \ technical issues:\n\n+   1. In the model code we now have to take care of **reference\
    \ properties** that require\n   1. defining **referential integrity constraints**\
    \ with the help of suitable JPA annotations;\n   2. extending the code of the\
    \ **create**, update and delete methods by taking the reference properties into\
    \ consideration;\n   3. a method for converting between (internal) object references\
    \ and corresponding (external) ID references in serialization and de-serialization\
    \ operations.\n2. In the **user interface** (view) code we now have to take care\
    \ of\n   1. showing information about associated objects in the *retrieve*/*list*\
    \ all use case;\n   2. allowing to select an associated object from a list of\
    \ all existing instances of the target class in the *create object* and *update\
    \ object* use cases.\n\n# 4.4 Write the Model Code\n\nThe Java Entity model class\
    \ can be directly coded for getting the model layer code of our Java back-end\
    \ app.\n\n# 4.4.1 Summary\n\n+   1. Code each class from the Java Entity model\
    \ class as a corresponding entity class.\n2. Code an [id] property modifier with\
    \ the JPA annotation @Id\n3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as [manyToOne], with the JPA annotation,\
    \ such as @ManyToOne.\n4. Code the integrity constraints specified in the model\
    \ with the help of Java Bean Validation annotations (or custom validation annotations).\n\
    5. Code the getters and setters.\n6. Code the *create*, *retrieve*, update and\
    \ delete storage management operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections."
- md: "\n## 4.4.2 Code Each Class of the Entity Model\n\nEach class of the Java entity\
    \ class model is coded as an annotated bean class with name C having a default\
    \ constructor (with no parameters) and a constructor with entity creation parameters.\n\
    \nFor instance, the Book class from the Entity class is coded in the following-way:\n\
    \n```java\n@Entity @Table( name=\"books\")\n@ViewScopedBean(name=\"book\")\npublic\
    \ class Book {\n    @Id @NotNull(message=\"An ISBN is required\")\n    private\
    \ String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"A title is\
    \ required!\n}\n```\n\nThe @ManyToOne annotation on the publisher is used for\
    \ specifying the functionality type of the association Book has Publisher represented\
    \ by the reference property publisher since it holds that a book has one publisher\
    \ and a publisher has many books. This annotation also allows to specify a fetch\
    \ type with the parameter taking one of the following two values:\n\n- FetchType.EAGER,\
    \ implying that a retrieval of an entity includes a retrieval of the associated\
    \ entity referenced by the entity property. In our example, this means that when\
    \ a Book entity is retrieved, the Publisher entity referenced by the book's publisher\
    \ property is also retrieved. This behavior is very useful and it should be used\
    \ whenever the data to be retrieved can be handled in main memory.\n\n- FetchType.LAZY,\
    \ implying that referenced entities are not automatically retrieved when retrieved.\
    \ In our example, this means that the referenced Publisher is not retrieved with\
    \ a referencing entity, leaving the value of the publisher property to null. With\
    \ this fetching behavior, a referenced entity has been retrieved separately by\
    \ invoking the reference property's getter in the context of a transaction (in\
    \ our example by invoking getPublisher).\n\nIn the case of a single-valued reference\
    \ property (representing a functional association) annotated with @OneToOne or\
    \ @ManyToOne, the default value is FetchType.EAGER, so referenced entities are\
    \ fetched together with referencing entities, while in the case of a non-functional\
    \ association (with either @ToMany or @ManyToOne), the default value is FetchType.LAZY,\
    \ so referenced entities are not fetched together with referencing entities, but\
    \ have to be retrieved separately, if needed.\n\nAs a result of JPA annotations,\
    \ the following SQL table creation statement for creating the tables is generated:\n\
    \n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n`ISBN` varchar(10) NOT NULL,\n\
    `TITLE` varchar(255) NOT NULL,\n`YEAR` int(11) NOT NULL,\n`PUBLISHER_NAME` varchar(255)\
    \ DEFAULT NULL,\nFOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers` (`NAME`)\n\
    );\n```\n\n## 4.4.3 Code the Constraints\n\nTake care that all property constraints\
    \ specified in the entity class model are properly coded using suitable Bean Validation\
    \ annotations. For instance, for the attribute name, we have to use the JPA annotation\
    \ @Id for specifying that the attribute corresponds to the primary key column\
    \ of the database table to which the entity is mapped, and the Bean Validation\
    \ annotation @NotNull for defining a mandatory value constraint that is checked\
    \ before an entity is saved to the database.\n\nIn the case of the address attribute,\
    \ we have to define a mandatory value constraint in two forms: with the JPA annotation\
    \ @Column(nullable=false) for the corresponding table column, and with the Bean\
    \ Validation annotation @NotNull for the attribute.\n\n```java\n@Id\n@NotNull(\
    \ message=\"A name is required!\")\nprivate String name;\n\n@Column(nullable=False)\n\
    @NotNull( message=\"An address is required!\")\nprivate String address;\n```\n\
    \nNotice that, unfortunately, the current Java EE technology requires defining\
    \ the same constraint twice, once for the database in the form of a JPA annotation,\
    \ and once for the Java app in the form of a Bean Validation annotation.\n\n##\
    \ 4.4.4 Code Getters and Setters\n\nCode the setter operations (instance-level)\
    \ methods. The setters only assign values and do not perform any validation, since\
    \ the property constraints are only checked before save by the Java EE execution\
    \ environment. The getters simply return the actual values of properties.\n\n\
    ## 4.4.5 Implement a Deletion Policy\n\nFor any reference property, we have to\
    \ choose and implement a deletion policy for taking care of the corresponding\
    \ object destruction dependency in the delete method of the reference property's\
    \ class range. In our case, we have to choose between\n\n- deleting all books\
    \ published by the deleted publisher;\n- dropping from all books published by\
    \ the deleted publisher the reference to the deleted publisher.\n\nWe choose the\
    \ second policy, which can only be used if the case of an optional reference property\
    \ such as book.publisher. This is shown in the following code of the Publisher.delete\
    \ method where for all book entities concerned the property publisher is cleared:\n\
    \n```java\npublic static void delete(EntityManager em, UserTransaction ut,\n \
    \ String name) throws Exception {\n  ut.begin();\n  Publisher publisher = em.find(Publisher.class,\
    \ name);\n  // find All Books which has this publisher\n  Query query = em.createQuery(\n\
    \    \"SELECT b FROM Book b WHERE b.publisher.name = :name\");\n  query.setParameter(\"\
    name\", name);\n  List<Book> books = query.getResultList();\n  // clear these\
    \ books' publisher reference\n  for ( Book b: books) { \n    b.setPublisher(null);\n\
    \  }\n  em.remove(publisher);\n  ut.commit();\n}\n```\n\nThe method loops through\
    \ all Book entities referencing the publisher to be destroyed and sets its publisher\
    \ property to null.\n\n## 4.4.6 Serialization and De-Serialization\n\nBased on\
    \ JPA annotations, together with suitable converter classes when needed, serialization\
    \ (from Java objects to table rows) as well as the corresponding de-serialization\
    \ (from table columns to Java objects) are performed automatically.\n\n## 4.5\
    \ The View and Controller Layers\n\nThe user interface (UI) consists of a start\
    \ page for navigating to the management pages and one UI page for each object\
    \ type and data management case. All UI pages are defined in the form of JSF view\
    \ files in subfolders of WebContent/views. We create the Main page index.xhtml\
    \ in the subfolder WebContent/views/content/app with the following content:\n\n\
    ```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n      xmlns:ui=\"\
    ..\" xmlns:f=\"..\">\n  <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n    <ui:define-name=\"content\">\n      <h2>Public Library</h2>\n      <h:button\
    \ value=\"Manage publishers\" outcome=\"/views/publishers/index\" />\n      <h:button\
    \ value=\"Manage books\" outcome=\"/views/books/index\" />\n      <h:form>\n \
    \       <h:commandButton value=\"Clear database\"\n          action=\"#{appCtrl.clearData()}\"\
    \ />\n        <h:commandButton value=\"Create test data\"\n          action=\"\
    #{appCtrl.createTestData()}\" />\n      </h:form>\n    </ui:define>\n  </ui:composition>\n\
    </html>\n```\n\nIt creates the menu buttons which provide the corresponding views\
    \ for each of the management pages. Additionally, we need to create a corresponding\
    \ AppController class which is responsible for the creation and deletion of the\
    \ test data. The controller is used to combine code of the Publisher.createTestData\
    \ and Book.createTestData and Publisher.clearData methods as follows:\n\n```java\n\
    @ManagedBean(name=\"appCtrl\") @SessionScoped\npublic class AppController {\n\
    \    @PersistenceContext(unitName=\"UnidirAssocApp\")\n    private EntityManager\
    \ em;\n    @Resource\n    UserTransaction ut;\n\n    public String clearData()\
    \ {\n        try {\n            Book.clearData(em, ut);\n            Publisher.clearData(em,\
    \ ut);\n        } catch (Exception e) {\n            e.printStackTrace();\n  \
    \      }\n        return \"index\";\n    }\n\n    public String createTestData()\
    \ {\n        try {\n            Publisher.createTestData(em, ut);\n          \
    \  Book.createTestData(em, ut);\n        } catch (Exception e) {\n           \
    \ e.printStackTrace();\n        }\n        return \"index\";\n    }\n}\n```\n\n\
    The deletion of Book and Publisher data must be done in a particular order for\
    \ avoiding referential integrity violations (books have to be deleted first, before\
    \ their publishers are deleted).\n"
  mdcn: "\n\n## 4.4.2 为实体模型中的每个类编写代码\n\nJava 实体类模型中的每个类都被编码为一个带注解的 Bean 类，名称为 C，它具有一个默认构造函数（无参数）以及一个带有实体创建参数的构造函数。\n\
    \n例如，来自实体类中的 `Book` 类是以以下方式编码的：\n\n```java\n@Entity @Table( name=\"books\")\n\
    @ViewScopedBean(name=\"book\")\npublic class Book {\n    @Id @NotNull(message=\"\
    An ISBN is required\")\n    private String isbn;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A title is required!\n}\n```\n\n`publisher` 上的 `@ManyToOne`\
    \ 注解用于指定 `Book` 与 `Publisher` 之间关联的功能类型（由引用属性 `publisher` 表示），因为它认为一本书对应有一个出版社，而一个出版社有许多本书。该注解还允许通过参数指定获取类型，该参数可以取以下两个值之一：\n\
    \n- `FetchType.EAGER`：意味着检索实体时包含检索该实体属性引用的关联实体。在我们的示例中，这意味着当检索一个 `Book` 实体时，由书的\
    \ `publisher` 属性引用的 `Publisher` 实体也会被检索。这种行为非常有用，当要检索的数据可以在主内存中处理时，应该使用它。\n\n\
    - `FetchType.LAZY`：意味着在检索时不会自动检索引用的实体。在我们的示例中，这意味着引用的 `Publisher` 不随引用实体一起检索，导致\
    \ `publisher` 属性的值为 `null`。通过这种获取行为，引用的实体是在事务范围内通过调用引用属性的 getter（在我们的示例中是通过调用\
    \ `getPublisher`）单独检索的。\n\n对于标有 `@OneToOne` 或 `@ManyToOne` 注解的单值引用属性（表示功能性关联），其默认值为\
    \ `FetchType.EAGER`，因此引用的实体会与引用实体一起获取；而在非功能性关联（使用 `@ToMany` 或 `@ManyToOne`）的情况下，默认值为\
    \ `FetchType.LAZY`，因此引用的实体不会与引用实体一起获取，如果需要，必须单独检索。\n\n作为 JPA 注解的结果，将生成以下用于创建创建表的\
    \ SQL 表创建语句：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n`ISBN` varchar(10)\
    \ NOT NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(11) NOT NULL,\n`PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL,\nFOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n## 4.4.3 编写约束\n\n请确保实体类模型中指定的所有属性约束都使用合适的 Bean Validation\
    \ 注解进行了正确编码。例如，对于属性名称，我们必须使用 JPA 注解 `@Id` 来指定该属性对应于映射的数据库表的主键列，并使用 Bean Validation\
    \ 注解 `@NotNull` 来定义强制性值约束，该约束在实体保存到数据库之前会进行检查。\n\n在 `address` 属性的情况下，我们必须以两种形式定义强制性值约束：使用\
    \ JPA 注解 `@Column(nullable=false)` 对应表列，以及使用 Bean Validation 注解 `@NotNull` 对应属性。\n\
    \n```java\n@Id\n@NotNull( message=\"A name is required!\")\nprivate String name;\n\
    \n@Column(nullable=False)\n@NotNull( message=\"An address is required!\")\nprivate\
    \ String address;\n```\n\n注意，遗憾的是，目前的 Java EE 技术要求定义两次相同的约束：一次是以 JPA 注解的形式针对数据库，另一次是以\
    \ Bean Validation 注解的形式针对 Java 应用。\n\n## 4.4.4 编写 Getter 和 Setter\n\n编写 setter\
    \ 操作（实例级）方法。setter 仅负责赋值且不执行任何验证，因为属性约束仅由 Java EE 执行环境在 `save` 之前进行检查。getter 则简单地返回属性的实际值。\n\
    \n## 4.4.5 实现删除策略\n\n对于任何引用属性，我们需要在事务上下文中实现删除策略。在我们的示例中，我们需要在以下两者之间选择：\n\n- 删除出版社\n\
    - 删除包含所有书籍的出版社\n\n我们选择删除所有书籍的出版社，这在 `delete` 方法中的实现所示：\n\n```java\npublic static\
    \ void delete(EntityManager em, UserTransaction ut, String name) {\n  ut.begin();\n\
    \  Publisher publisher = em.find(Publisher.class, name);\n  Query query = em.createQuery(\n\
    \    \"SELECT b FROM Book b WHERE b.publisher = :name\");\n  query.setParameter(\"\
    name\", name);\n  List<Book> books = query.getResultList();\n  for (Book b : books)\
    \ {\n    b.setPublisher(null);\n  }\n  em.remove(publisher);\n  ut.commit();\n\
    }\n```\n\n## 4.4.6 序列化与反序列化\n\n根据 JPA 注解，配合合适的转换器类，序列化（从 Java 对象到表行）以及相应的反序列化（从表列到\
    \ Java 对象）将自动完成。\n\n## 4.5 视图与控制器层\n\n用户界面（UI）由导航到管理页面的起始页以及每个对象类型的管理页面组成。所有 UI\
    \ 页面以 JSF 文件的形式定义在 `views` 子目录下。我们在 `WebContent/views` 中创建主页 `index.xhtml`，内容如下：\n\
    \n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n    \
    \  xmlns:ui=\"..\" xmlns:f=\"..\">\n  <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n    <ui:define name=\"content\">\n      <h2>Public Library</h2>\n      <h:button\
    \ value=\"Manage publishers\" outcome=\"/views/publishers/index\" />\n      <h:button\
    \ value=\"Manage books\" outcome=\"/views/books/index\" />\n      <h:form>\n \
    \       <h:commandButton value=\"Clear database\"\n          action=\"#{appCtrl.clearData()}\"\
    \ />\n        <h:commandButton value=\"Create test data\"\n          action=\"\
    #{appCtrl.createTestData()}\" />\n      </h:form>\n    </ui:define>\n  </ui:composition>\n\
    </html>\n```\n\n此外，我们需要创建一个相应的 `AppController` 类，负责测试数据的创建和删除。该控制器用于整合 `Publisher.createTestData`、`Book.createTestData`\
    \ 以及 `Publisher.clearData` 方法如下：\n\n```java\n@ManagedBean(name=\"appCtrl\") @SessionScoped\n\
    public class AppController {\n    @PersistenceContext(unitName=\"UnidirAssocApp\"\
    )\n    private EntityManager em;\n    @Resource\n    UserTransaction ut;\n\n \
    \   public String clearData() {\n        try {\n            Book.clearData(em,\
    \ ut);\n            Publisher.clearData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n\n    public String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\n书籍和出版社数据的删除必须按照特定顺序进行，以避免引用完整性冲突（必须先删除书籍，然后再删除它们的出版社）。\n\n"
