    ```javascript\nfor (let key of Object.keys(people)) {\n  try { // convert record\
    \ to (typed) object\n    Person.instances[key] = new Person(people[key]);\n  }\
    \ catch (e) {\n    console.log(`${e.constructor.name} while deserializing ${key}:\
    \ ${e.message}`);\n  }\n}\n```\n\n## 13.3.4.3 Saving the Supertable when Saving\
    \ a Subtable\n\nSince the app's data is kept in main memory as long as the app\
    \ is running (which is as long as the app's webpage is kept open in the browser),\
    \ the data has to be saved to persistent storage when the app is exited (e.g.,\
    \ by closing its browser tab). When saving the instances of Employee and Author\
    \ (as records of the JS entity tables employees and authors) to persistent storage\
    \ in pl.v.employees.manage.exit and pl.v.authors.manage.exit, we also save the\
    \ direct instances of Person (as records of the people table). This is necessary\
    \ because changes to Employee or Author instances may imply changes of Person.instances.\n\
    \nFor instance, for Employee data management, we define in v/employees.js:\n\n\
    ```javascript\npl.v.employees.manage = {\n  exit: function () {\n    Employee.saveAll();\n\
    \    Person.saveAll();\n  },\n  ...\n```\n\n## 14 Subtyping with Java EE\n\nIn\
    \ this chapter, we explain two case studies based on fragments of the information\
    \ model of our running example, the Public Library app. In the first case study,\
    \ in Figure 12.1, we consider the single-level class hierarchy with root Book\
    \ in which is an incomplete disjoint segmentation. We use the Single Table Inheritance\
    \ approach for mapping this class hierarchy to a single database table.\n\nIn\
    \ the second case study, we consider the multi-level class hierarchy consisting\
    \ of the Person roles Employee, Manager and Author, shown in Figure 12.8. We use\
    \ the Joined Inheritance approach for mapping this class hierarchy to a set of\
    \ database tables that are related with each other via foreign key dependencies.\n\
    \nIn both cases we show:\n\n- 1. how to derive a Java Entity class\n- 2. how to\
    \ code the Java Entity class model in the form of Java Entity classes,\n- 3. how\
    \ to write the view and controller code based on the model code.\n\n## 14.1 Subtyping\
    \ in Java\n\nJava provides built-in support for subtyping with its extends keyword,\
