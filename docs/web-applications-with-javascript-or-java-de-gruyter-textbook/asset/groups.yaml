- md: "\n# 40 — 3 Implementing Unidirectional Non-Functional Associations with Plain\
    \ JS\n\nThis model, in addition to the single-valued reference property Book::publisher\
    \ representing the unidirectional many-to-one association Book-Publisher, the\
