  mdcn: "\n\n# 24 — 使用原生 JS 实现单向函数关联\n\n注意，出版者（publisher）的名字被用作 ID ，因为它是 Publisher\
    \ 类的标准 ID。\n\n## 2.3 构建 JS 类模型\n\n构建 JS 类模型的起点是一个类似于图 1.10 所示的 OO 类模型。\n\n我们展示了如何通过四个步骤从该\
    \ OO 类模型推导出 JS 类模型。对于 OO 类中的每个类：\n\n- 1. 为所有（非派生的）单值属性添加 `get/set` 刻型（stereotype），这意意味着它们具有隐式的\
    \ getter 和 setter。记住，在 setter 中，会调用相应的检查操作，只有当检查没有检测到违反约束时，才会设置属性。\n- 2. 为每个（非派生的）属性\
    \ 创建一个 *check*（检查）操作，以便为实现**属性约束**提供一个集中的位置。对于一个标准的 ID 属性（如 `Book::isbn`），需要两个或三个检查操作：\n\
    \    1. 一个基础检查操作，如 `checkIsbn`，用于检查语法约束，但不检查*必填值*和*唯一性*约束。\n    2. 一个标准的 ID 检查操作，如\
    \ `checkIsbnAsId`，用于检查标准 ID 属性隐含的**必填值和唯一性约束**。\n    3. 如果其他类有一个引用所考虑类的属性，添加一个\
    \ ID 引用检查操作，用于检查施加在 ID 引用（或外键）属性上的引用完整性约束。例如，由于 `Book::publisher` 属性引用 Publisher\
    \ 对象，我们需要在 Publisher 类中一个 `checkNameAsIdRef` 操作。\n- 3. 对于引用属性（如 `Book::publisher`），检查操作\
    \ `Book.checkNameAsIdRef` 必须通过调用 Publisher 来检查隐含的引用完整性约束，如果该属性是必填的，可能还要检查必填约束。\n\
    - 4. 为 `toString()` 添加一个对象序列化函数，用于在错误消息和日志中显示对象的状态。\n- 5. 为 `toRecord()` 添加一个对象到存储的转换函数，将模型对象准备好存储为实体表中的行，该行可以通过\
    \ `JSON.stringify` 序列化为 JSON 字符串，从而存储为应用 `localStorage` 数据存储的值。\n\n这得出了 Book 的如下\
