- md: "\n# 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance\
    \ — 169\n\nThe starting point for our case study is the design model shown in\
    \ Figure 12.8 above. In the following sections, we show how to eliminate the Manager\
    \ class using the Class Hierarchy Merge design pattern and how to implement the\
    \ Person hierarchy and use Joined, Multiple Table Inheritance storage with the\
    \ help of JPA framework.\n\n## 14.3.1 Make the Java Entity class model\n\nWe design\
    \ the model classes of our example app with the help of a Java Entity model that\
    \ we derive from the design model by essentially leaving the generalization as\
    \ they are and just adding getters and setters to each class. However, in the\
    \ case of our example app, it is natural to apply the Class Hierarchy Merge design\
    \ pattern to the segmentation of Employee for simplifying the data model by eliminating\
    \ the Manager subclass. This leads to the model shown in Figure 14.2 below. Note\
    \ that we have also made two technical decisions:\n\n| /get/set | personid : Integer\
    \ (id) |\n| :--- | :--- |\n| /get/set | name : String |\n| checkPersonIdAs(id\
    \ : String, in : type) : ConstraintViolation |\n\n| «enumeration» |\n| :--- |\n\
    | EmployeeTypeEL |\n| MANAGER |\n\n| «Java Entity» |\n| :--- |\n| Employee |\n\
    | /get/set | empNo[1] : Integer (unique) |\n| /get/set | type[0..1] : EmployeeTypeEL\
    \ |\n| /get/set | department[0..1] : String |\n| checkUniqueEmployeeNo(n : Integer)\
    \ : ConstraintViolation |\n| toString() : String |\n| create(pId : Integer, n\
    \ : String, t : EmployeeTypeEL, in : String) |\n| retrieveAll() : Employee[*]\
    \ |\n| ..() |\n\n| {disjoint, complete} |\n\n| «Java Entity» |\n| :--- |\n| Author\
    \ |\n| /get/set | biography : String |\n| toString() : String |\n| create(pId\
    \ : Integer, in : String, bio : String) |\n| retrieveAll() : Author[*] |\n| ..()\
    \ |\n\nFigure 14.2: The Java Entity class model of the Person class hierarchy.\n\
    \n1. We have declared the segmentation of Person into Employee and Author to be\
    \ disjoint and complete, that is, any person is either an employee or an author.\
    \ Since Java does not support multiple classification, we cannot implement an\
    \ overlapping segmentation, as needed when modeling roles, with Java.\n\n2. We\
    \ turned Person into an abstract class (indicated by its name in italics), which\
    \ means that it cannot have direct instances, but only indirect ones via its subclasses\
    \ Employee and Author. This technical design decision is compatible with the fact\
    \ that any Person is an Employee or Author (or both), and consequently there is\
    \ no need for any object to instantiate directly.\n\n## 14.3.2 New Issues\n\n\
    Compared to the model of our first case study, shown in Figure 14.1 above, we\
    \ have to define the category relationships between Employee and Person, as well\
    \ as between Author and Person, using the JPA annotation.\nIn the UI we have to\
    \ care of:\n\n- 1. Adding the views (in the folders WebContent/views/authors and\
    \ WebContent/views/employees) and controller classes (AuthController and EmployeeController)\
    \ for the corresponding Author and Employee model classes.\n- 2. Deal with the\
    \ Manager case, by adding a \"Special type\" control, in the forms of the \"Create\
    \ book\" and \"Update book\" use cases in WebContent/views/books/create.xhtml\
    \ and WebContent/views/books/update.xhtml. Segment property fields (i.e., department\
    \ in our example) are only displayed, and their validation is performed, when\
    \ a corresponding employee type has selected.\n\n## 14.3.3 Code the Model Classes\
    \ of the Java Entity Class Model\n\nThe Java Entity class shown in Figure 14.2\
    \ above coded by using the JavaBeans Person, Employee and Author as well as for\
    \ the enumeration type EmployeeCategory.\n\n### 14.3.3.1 Define the Category Relationships\n\
    \nWe define the category relationships between Employee and Person, as well as\
    \ between Author and Person, using the JPA annotations. At first we create the\
    \ Person class as shown below:\n\n```\n@Entity @Table(name=\"persons\")\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    ```\n\n```\n@DiscriminatorColumn(name=\"category\",\ndiscriminatorType=DiscriminatorType.STRING,\
    \ length=16)\npublic abstract class Person {\n@Id @NotNull(message=\"A person\
    \ ID is required!\")\nprivate Integer personId;\n@NotNull(message=\"A name is\
    \ required!\") @Column(nullable=false)\nprivate String name;\n\n}\n```\n\nComparing\
    \ with the Book hierarchy shown in Test Case 1, the @Inheritance annotations define\
    \ the strategy=InheritanceType.JOINED. This means, for every class in the inheritance\
    \ hierarchy, a database table is used. The @DiscriminatorColumn(name=\"category\"\
    ) specifies the column in the corresponding table (i.e., persons) of the top hierarchy\
