- md: "\n## 13.3.4.2 Loading the Instances of the Root Class Person\n\nWhen retrieving\
    \ the instances of a class hierarchy's root class (in our example, Person) from\
    \ a persistent data store organized according to the TCI approach, we have to\
    \ retrieve not only its direct instances from the table representing the root\
    \ class (people), but also indirect instances from all tables representing its\
    \ sub-classes (employees and authors), as shown in the following code:\n\n```javascript\n\
    Person.retrieve = function () {\n  var people={}, employees={}, authors={};\n\
    \  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"{}\";\n  if (!localStorage[\"\
    employees\"]) localStorage[\"employees\"] = \"{}\";\n  if (!localStorage[\"people\"\
    ]) localStorage[\"people\"] = \"{}\";\n  try {\n    people = JSON.parse(localStorage[\"\
    people\"]);\n    employees = JSON.parse(localStorage[\"employees\"]);\n    authors\
    \ = JSON.parse(localStorage[\"authors\"]);\n  } catch (e) {\n    console.log(`Error\
    \ when retrieving from Local Storage\\n` + e);\n  }\n  for (let key of Object.keys(authors))\
    \ {\n    try { // convert record to (typed) object\n      Author.instances[key]\
    \ = new Author(authors[key]);\n      // create superclass extension\n      Person.instances[key]\
    \ = Author.instances[key];\n    } catch (e) {\n      console.log(`${e.constructor.name}\
    \ while deserializing` + \n        ` author ${key}: ${e.message}`);\n    }\n \
    \ }\n}\n```\n\nEach record of the authors table is retrieved and converted to\
    \ an Author object, a reference to which is copied to Person.instances. Also the\
    \ records of the employees table are processed in this way, while the records\
    \ of the people table are simply retrieved and converted to Person objects:\n\n\
    ```javascript\nPerson.retrieveAll = function () {\n  ..\n  for (let key of Object.keys(employees))\
