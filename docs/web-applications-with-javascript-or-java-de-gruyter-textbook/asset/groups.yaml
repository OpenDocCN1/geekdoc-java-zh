    ## 12.7 Subtyping and Inheritance in Computational Languages — 137


    An example of an admissible population for this model is the following:


    | person_id | name | categories | biography | emp_no | department |

    | --- | --- | --- | --- | --- | --- |

    | 1001 | Harry Wagner | Author Employee | Born in Boston, MA, in 1956,... . |
    21035 | |

    | 1002 | Peter Boss | Manager | | 23107 | Sales |

    | 1003 | Tom Daniels | | | | |

    | 1077 | Immanuel Kant | Author | Immanuel Kant (1724–1804) was a German philosopher...
    . | | |


    - Notice the Person table contains four different types of people:

    1. A person, Harry Wagner, who is both an author (with a biography) and an employee
    (with an employee number).

    2. A person, Peter Boss, who is a manager (a special type of employee), managing
    the Sales department.

    3. A person, Tom Daniels, who is neither an author nor an employee.

    4. A person, Immanuel Kant, who is an author (with a biography).


    **Pros of the STI approach:** It leads to a faithful representation of the subtype
    relationships expressed in the original class hierarchy; in particular, any row
    representing a subclass instance (an employee, manager or author) also represents
    a superclass instance (a person).


    **Cons:** (1) In the case of a multi-level class hierarchy where the subclasses
    have little in common, the STI approach does not lead to a good representation.
    The structure of the class hierarchy in terms of its elements (classes) is only
    implicitly preserved.


    ## 12.7.4.2 Table Per Class Inheritance


    In a more realistic model, the subclasses of *Person* shown in Figure 12.8 above
    would have many more attributes, so the STI approach would be no longer feasible.
    The TCI approach would use the SQL table model shown in Figure 12.11 below. A
    TCI model represents each concrete class of the class hierarchy as a table, such
    that each segment subclass is represented by a table that also contains columns
    for inherited properties, thus repeating the columns of the table that represents
    the superclass.


    | «SQL table» | «SQL table» |

    |---|---|

    | people | employees |

    | person_id : INTEGER (pkey) | person_id : INTEGER (pkey) |

    | name : VARCHAR | name : VARCHAR |

    | | emp_no : INTEGER (unique) |

    | «SQL table» | «SQL table» |

    |---|---|

    | authors | managers |

    | person_id : INTEGER (pkey) | person_id : INTEGER (pkey) |

    | name : VARCHAR | name : VARCHAR |

    | biography : VARCHAR | emp_no : INTEGER (unique) |

    | | department : VARCHAR |


    Figure 12.11: A TCI table model representing the Person roles hierarchy.


    A TCI table can be derived from the information design model by performing the
    following steps:

    1. Replacing the standard ID property modifier {id} in all classes with {pkey}
    for indicating that the standard ID property is a primary key.

    2. The singular (capitalized) class names (Person, Author, etc.) with pluralized
    lowercase table names (people, authors, etc.), and replacing camel case property
    names (*personId* and *empNo*) with lowercase underscore-separated columns for...

    3. Adding a <table> stereotype to all class rectangles.

    4. Replacing the platform-independent datatype names with SQL datatype names.

    5. Dropping all generalization/inheritance arrows and adding all columns of supertables
    (such as person_id and name from people) to their subtables (authors and employees).


    Each table would only be populated with rows corresponding to the direct instances
    of the represented class. An example of an admissible population for this model
    is the following:


    | authors | | |

    |---|---|---|

    | person_id | name | biography |

    | 1001 | Harry Wagner | Born in Boston, MA, in 1956, . . . |

    | 1077 | Immanuel Kant | Immanuel Kant (1724–1804) was a German philosopher. .
    . |


    | person_id | name | emp_no | department |

    |---|---|---|---|

    | 1002 | Peter Boss | 23107 | Sales |


    **Pros of the TCI approach:** (1) The structure of the given class hierarchy in
    terms of its elements (classes) is explicitly expressed. (2) When the segmentations
    of the given class hierarchy are disjoint, TCI leads to memory-efficient non-redundant
    storage.


    **Cons:** (1) The TCI approach does not yield a faithful representation of the
    subtype relationships expressed in the original class hierarchy. In particular,
    for any row representing a subclass instance (an employee, manager or author)
    there is no information that it represents a superclass instance (a person). Thus,
    the TCI database schema does not inform about the represented subtype relationships;
    rather, this meta-information, which is kept in the app''s class model, is de-coupled
    from the database. (2) The TCI approach requires repeating column definitions,
    which is a form of schema redundancy. (3) The TCI approach may imply data redundancy
    whenever the segment subclasses overlap. In our example, authors can also be employees,
    so for any person in the overlap, we would need to duplicate the data.


    ## 12.7.4.3 Joined Inheritance


    For avoiding the data redundancy of TCI in the case of overlapping segments, we
    could use the JTI approach as exemplified in Figure 12.2 below. This model connects
    tables (subclasses) to supertables (superclasses) by defining their primary key
    as the same.


    ![img/64ab58e459ff4b56e7fc22fe3998651a_156_0]


    Figure 12.2: A JTI model representing the Person hierarchy.


    An example of an admissible population for this model is the following:


    | person_id | name |

    |---|---|

    | 1001 | Harry Wagner |

    | 1002 | Peter Boss |

    | 1003 | Tom Daniels |

    | 1077 | Immanuel Kant |


    | person_id | biography |

    |---|---|

    | 1001 | Born in Boston, MA, in 1956, . . . |

    | 1077 | Immanuel Kant (1724–1804) was a German philosopher. . . |


    | person_id | emp_no | department |

    |---|---|---|

    | 1002 | 23107 | Sales |


    **Pros of the JTI approach:** (1) Data redundancy is avoided. (2) The structure
    of the class hierarchy is explicitly preserved.


    **Cons:** (1) To retrieve all information for a subclass, join queries are required,
    which may create performance issues.


    ## 12.8 Questions


    If you like to look up the answers for the following questions, you can check
    our discussion forum. If you don''t find an answer, you may create a post asking
    for it.


    ### 12.8.1 Question 1: Statements about Class Hierarchy


    Consider the following class model:


    | Abc | Bcd |

    |---|---|

    | a1 : String (id) | b1 : Integer (id) |

    | a2 : Integer | |

    | a3 : Integer | |


    | Cde | «invariant» |

    |---|---|

    | c : Integer (key) | (a3 > a2) |


    Which of the following statements are true? Select one or more:


    - All instances of Cde have a value for a1.

    - The standard identifier of Cde is a1.

    - All instances of Cde may have an object reference to Bcd.

    - Direct instances of Abc may have a value for c.

    - For any object of Abc the value of a3 must be greater than a2.

    - For any object of Cde the value of a3 must be greater than a2.

    - The standard identifier of Cde is c.


    ###### 12.8.2 Question 2: Class Hierarchy Merge


    Consider the following class model:


    ![img/64ab58e459ff4b56e7fc22fe3998651a_158_0]


    In the case of such a simple class hierarchy, we can use the Class Hierarchy Merge
    design pattern where the entire class hierarchy is merged into a single class.
    Which of the following models describes the correct implementation of the Class
    Hierarchy Merge design pattern for the given Ab class hierarchy? Select one:


    - 1. ![img/64ab58e459ff4b56e7fc22fe3998651a_158_1.png]

    - 2. ![img/64ab58e459ff4b56e7fc22fe3998651a_158_2.png]

