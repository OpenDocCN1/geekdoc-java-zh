    change\", this.\n    handleBookSelectChangeEvent);\n\n    // add event listeners\
    \ for responsive validation\n    // define event handler for submit button click\
    \ events\n    saveButton.addEventListener(\"click\", this.handlesSaveButtonClick(Event);\n\
    \    // handle neutralizing the submit event and resetting the form\n    formEl.addEventListener(\
    \ 'submit', function (e) {\n      var authorsSelWidget = document.querySelector(\n\
    \        \"section#Book-U form .MultiSelectionWidget\");\n      e.preventDefault();\n\
    \      authorsSelWidget.innerHTML = \"\";\n      formEl.reset();\n    });\n  \
