    \ `delete` 操作符），而在数组的情况下这需要更多工作。然而，对于对应于有序集合值（或包/序列值）引用属性的有序关联端，我们使用 JS 数组。\n\n\
    ## 3.2 制作 JS 类模型\n\n制作 JS 类模型的起点是以下 OO 类模型：\n\n| Book | Publisher |\n| --- | ---\
