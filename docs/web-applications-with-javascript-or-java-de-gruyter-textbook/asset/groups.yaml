    \ how to write the view and controller code based on the model code.\n\nBefore\
    \ we show how to derive a plain JS class model and code it in JavaScript, we first\
    \ introduce a few new elements of the JavaScript language, which we are going\
    \ to use throughout the JavaScript code discussed in this book.\n\n### 2.2 Single-Valued\
    \ Reference Properties\n\nA single-valued reference property, such as the property\
