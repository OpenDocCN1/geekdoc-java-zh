    ## 3 Implementing Unidirectional Functional Associations with Plain JS\n\nA unidirectional\
    \ nonfunctional association is either one-to-many or many-to-many. In both cases\
    \ such association is represented, with the help of JavaScript. In this chapter,\
    \ we show\n\n- how to derive a JS class model from OO class model with multi-valued\
    \ reference properties,\n- how to code the JS model of classes,\n- how to write\
    \ the view and controller code.\n\n## 3.1 Implementing Multi-Valued Reference\
    \ Properties\n\nA multi-valued reference property, such as authors, allows a collection\
    \ of references to objects such as Author objects. When creating a new object\
    \ of Book, the constructor needs to have a parameter for this property or ID references,\
    \ as shown in the following:\n\n```javascript\nclass Book {\n  constructor({isbn,\
    \ title, year, authors,IdRefs,\n    publisher, publisher_id}) {\n    this.isbn\
    \ = isbn;\n    this.title = title;\n    this.year = year;\n    // assign object\
    \ reference or ID reference\n    this.authors = authors || authorRefs;\n    if\
    \ (publisher || publisher_id) this.publisher = publisher || publisher_id;\n  }\n\
    }\n```\n\nNotice that the constructor's parameter is expected to contain either\
    \ authors or authorRefs. The JavaScript expression authors || authorRefs, using\
    \ the disjunction operator ||, evaluates to a map authors, if there is a slot\
    \ with name authors, or to an array authorRefs, otherwise. We handle the ambiguity\
    \ in the property setter by checking the type of the argument as shown in the\
    \ following code fragment:\n\n```javascript\nset authors ( ) {\n  this._authors\
    \ = {};\n  if (Array.isArray(a)) { // array of IdRefs\n    for (let idRef of a)\
    \ {\n      this.addAuthor(idRef);\n    }\n  } else { // map of IdRefs to object\
    \ references\n    for (let idRef of Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n\
    \    }\n  }\n}\n```\n\nIn JS, a collection-valued reference property can be implemented\
    \ in two ways:\n\n- 1. having an array list (JS array) as its value,\n- 2. having\
    \ a map as its value, such that the value of the object's standard ID attribute\
    \ are the keys, which are mapped to internal JS references.\n\nWe prefer maps\
    \ for implementing set-valued reference properties since they guarantee that each\
    \ element is unique, while with an array we would have to prevent duplicate elements.\
    \ Also, an element of a map can be easily deleted (with the help of the delete\
    \ operator), while this requires more effort in the case of an array. However,\
    \ for implementing ordered (or nonunique) association ends corresponding to ordered-collection-valued\
    \ (or bag/sequence-valued) reference properties, we use JS arrays.\n\n## 3.2 Make\
    \ JS Class Model\n\nOur starting point for making a JS class model is the following\
    \ OO class model:\n\n| Book | Publisher |\n| --- | --- |\n| isbn[1] : String (id)\
    \ | name : String (id) |\n| title[1] : String | address : String |\n| year[1]\
    \ : Integer | |\n| publisher[0..1] : Publisher | |\n| authors[*] : Author | |\n\
    | Author |\n| personId : Integer (id) |\n| name : String | |\n"
