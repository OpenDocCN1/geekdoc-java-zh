    当一个派生的反向属性是多值的，而其正向属性是单值的时（如下图 7.4 所示，`Publisher::publishedBooks` 是由 `Book::publisher`
    派生而来的），生命周期依赖意味着：


    - 1. 每当创建一个“基础对象”（如书籍）时，对应的反向属性都需要进行更新，即通过向其值集合中添加指向新基础对象的引用来更新（即向 `Publisher::publishedBooks`
    中添加指向该新对象的引用）；


    - 2. 每当基础属性更新时（例如分配了新的出版者），对应的反向属性也需要更新，即从其值集合中移除旧引用并添加新引用；


    - 3. 每当一个基础对象（如书籍）被销毁时，对应的反向属性也需要更新，即从其值集合中移除指向该对象的引用（即从 `Publisher::publishedBooks`
    中移除该对象）。


    注意，从纯计算的角度来看，我们可以自由选择两个反向属性中的任意一个（如 `Book::authors` 和 `Author::authored`）作为主属性。在许多情况下，关联表示了不对称的本体依赖，这决定了哪一个反向属性是主。例如，`Book`
    和 `Author` 之间的关联表示书籍在本体上依赖于作者，而作者在本体上并不依赖于任何书籍。因此，`Book` 和 `Author` 之间的相应对象依赖意味着，通过维护
    `Book::authors` 中的引用来维护这种双向关联。


    ## 7.2 构建对象类模型


    由于经典的编程语言不支持将显式关联作为一等公民，只支持带有引用属性的类，为了获取对象类模型，我们必须消除所有显式关联。


    ### 7.2.1 基础属性


    消除关联的起点是一个包含各种单向和双向关联的信息设计模型。如图 7.1 所示，如果模型包含任何无向关联，我们首先必须通过对所有端做出决策将它们转换为有向关联，这通常是基于可导航性要求的。注意，在
    `Publisher-Book-Author` 设计模型中，`publishedBooks` 和 `authoredBooks`（或 `authors`）由于关联两端的所有权标记是双向的。为了消除设计模型中的显式关联，必须执行以下步骤：


    - 1. 消除连接源类与目标类的单向关联，用源类中的相应引用属性替换它们，使目标类成为其范围；


    - 2. 用一对反向引用属性替换双向关联。


    ### 7.2.2 如何消除单向关联


    一个连接源类与目标类的单向关联被源类中的相应引用属性替换，该属性的范围是目标类。其多重性与关联端相同。其名称为关联端的名称，否则设置为目标类的名称（如果引用属性是多值的）。


    ### 7.2.3 如何消除双向关联


    如图 7.1 所示，`Book` 和 `Author` 类之间的双向关联被一对反向引用属性替换，例如 `Book::authors` 和 `Author::authoredBooks`。由于这两个属性都表示相同的信息（相同的二元关系），我们可以考虑其中一个作为“主”属性，另一个作为“从”属性，后者由主属性派生。


    - 1. 在一对一关联的情况下，这会在两个关联类中产生一对反向的单值引用属性。由于两者本质上表示相同的信息（相同的链接/关系），必须选择哪一个作为主属性，另一个作为从属性，后者通过主属性的反向导出。在类图中，从属性被指定为派生属性，每当
    1) 创建新的主对象时，2) 更新主引用属性，或 3) 主对象被销毁时，该属性会自动更新。这种转换如图 7.2 所示。


    | Committee | ClubMember |

    | --- | --- |

    | name : String | 0..1 |


    ![](img/64ab58e459ff4b56e7fc22fe3998651a104_0.png)


    | Committee | ClubMember |

    | --- | --- |

    | name : String | /chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember |


    **图 7.2：** 将一对一双向关联转换为一对反向的单值引用属性。


    - 2. 多对多双向关联被映射到参与关联的两个类中的各一对反向的多值引用属性中。同样，在其中一个类中，表示（反向）关联的多值引用属性被指定为*派生属性*，每当另一个类（维护关联的地方）中的相应属性更新时，该属性会自动更新。这种转换如图
    7.3 所示。


    | Book | Author |

    | --- | --- |

    | isbn : String | personId : Integer |

    | title : String | name : String |


    ![](img/64ab58e459ff4b56e7fc22fe3998651a104_1.png)


    | Book | Author |

    | --- | --- |

    | isbn[1] : String | personId[1] : Integer |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | /authoredBooks[*] (inverse of author) |


    **图 7.3：** 将多对多双向关联转换为一对反向的多值属性对。


    ### 7.2.4 得到的对象类模型


    将两个双向关联替换为引用属性后，我们获得了如图 7.4 所示的对象类模型。


    | Book | Publisher |

    | --- | --- |

    | isbn[1] : String | name[1] : String |

    | title[1] : String | address[1] : String |

    | year[1] : Integer | /publishedBooks[*] (inverse of publisher) |

    | publisher[0..1]: Publisher | |

    | authors[*] : Author | |

    | | personId[1] : Integer |

    | | name[1] : String |

    | | /authoredBooks[*] (inverse of authors) |


    图 7.4：具有两对反向属性的对象类模型。


    由于书籍是本质上依赖并可能依赖出版者的实体，而不是相反，因此在书籍对象中维护主引用是自然的，并将出版者和作者对象中的反向引用视为派生（或“从”）数据。因此，我们定义
    `publishedBooks` 和 `authoredBooks` 为反向引用属性，这在对象类模型中通过其斜杠前缀来指示。


    该对象类模型的含义可以通过涉及的三个类的示例数据填充来说明：


    | Publisher | Address | Published books |

