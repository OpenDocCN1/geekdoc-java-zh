    \ | 0553345842 |\n| 2 | Douglas Hofstadter | 0553345842, 0465030793 |\n| 3 | Immanuel\
    \ Kant | 1463794762, 1928565379 |\n\nNotice how Book records reference Publisher\
    \ and Author records, and, vice versa,\nPublisher and Author records reference\
    \ Book records.\n\n## 8 Implementing Bidirectional Associations with Plain JS\n\
    \nIn this chapter, we show\n\n- 1. how to derive a JS class model from an OO class\
    \ model with derived inverse reference properties,\n- 2. how to code the JS class\
    \ model in the form of JavaScript model classes,\n- 3. how to write the view and\
    \ controller code based on the model code.\n\n## 8.1 Make a JavaScript Class Model\n\
    \nThe starting point for making our JS class model is an OO class model with derived\
    \ inverse reference properties like the one discussed above, which we present\
    \ here again, for convenience:\n\n| Book | Publisher |\n|---|---|\n| isbn[1] :\
    \ String (id) | personId[1] : Integer (id) |\n| title[1] : String | name[1] :\
    \ String |\n| year[1] : Integer | /publishedBooks[*] : Book (inverse of publisher)\
    \ |\n| publisher[0..1] : Publisher | Author |\n| authors[*] : Author | |\n\nNotice\
    \ the two-contains derived inverse reference properties: Publisher::/publishedBooks\
    \ and Author::/authoredBooks. Each of them is linked to a master property, from\
    \ which it is derived. Consequently, each of them represents a pair of mutually\
    \ inverse reference properties corresponding to a bidirectional association.\n\
    \nCompared to making JS class models with unidirectional associations, only the\
    \ new issue is:\n\n- 1. Add a «get» stereotype to all inverse reference properties,\
    \ implying that they have an implicit getter, but no setter. They are implicitly\
    \ set whenever their inverse reference property is updated.\n\nThis concerns the\
    \ two derived inverse reference properties Publisher::/publishedBooks and Author::/authoredBooks.\
    \ Thus, we get the following JavaScript class model:\n\n| Book | Publisher |\n\
    | --- | --- |\n| <get/set/isbn[1]: string (id) | <get/set/set name[1]: string\
    \ (id) |\n| <get/set/title[1]: string | <get/set/adress[1]: string |\n| <get/set/publisher[0..1]:\
    \ Publisher | <get/set/publishedBooks[]]: Book (inverse of publisher) |\n| <get/set/author[1]:\
    \ Author | checkName(in: n : String): ConstraintViolation |\n| checkIsbn(in isbn:\
    \ String): ConstraintViolation | checkNameAsIdn(in n : String): ConstraintViolation\
    \ |\n| checkIsbnAsRef(in isbn: String): ConstraintViolation | checkAddressAsRef(in\
    \ isbn: String): ConstraintViolation |\n| checkTitle(in title: String): ConstraintViolation\
    \ | toString(): string |\n| checkPublisher(in p: Publisher): ConstraintViolation\
    \ | toRecord(): Object |\n| checkAuthor(in author: Author): ConstraintViolation\
    \ | |\n| addAuthor(in author: Author) | |\n| removeAuthor(in author: Author) |\
    \ |\n| toString() | |\n| toRecord(): Object | |\n\n## 8.2 Write the Model Code\n\
    \nThe JS class model can be directly coded for getting the code of the model layer\
    \ of your JavaScript frontend app.\n\n### 8.2.1 New Issues\n\nCompared to the\
    \ unidirectional association app, we have to deal with a number of new technical\
    \ issues:\n\n- We define the derived inverse reference properties, like Publisher::publishedBooks,\
    \ without a check operation and without a set operation. We also have to take\
    \ care of maintaining the derived inverse reference properties by maintaining\
    \ the derived (sets) of inverse references that collect the value of a derived\
    \ inverse reference property. This requires in particular that when the value\
    \ of a single-valued reference property is initialized or updated with the help\
    \ of a setter (such as assigning a reference to a Publisher instance p to b for\
    \ a Book instance b), an inverse reference has to be assigned or added to the\
    \ corresponding value of the derived inverse reference property (such as adding\
    \ b to p.publishedBooks); when the value of the master property is updated and\
    \ the derived property is multi-valued, then the obsolete inverse reference to\
    \ the previous value of the single-valued master reference property has to be\
    \ deleted;\n\n- 2. whenever the value of an optional single-valued master reference\
    \ property is unset (e.g., by assigning null to b.publisher for a Book instance\
    \ b), the inverse reference has to be removed from the corresponding value of\
    \ the derived inverse reference property (such as removing b from p.publishedBooks),\
    \ if the derived inverse reference property is multi-valued, otherwise the corresponding\
    \ value of the derived inverse reference property has to be unset or updated;\n\
