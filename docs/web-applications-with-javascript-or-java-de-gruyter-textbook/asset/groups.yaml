- md: "\n## 44 - 3 Implementing Unidirectional Non-Functional Associations with Plain\
    \ JS\n\n```javascript\n// delete the author object\ndelete Author.instances[authorId];\n\
    console.log(\"Author \" + author.name + \" deleted.\");\n}\n```\n\n### 3.4.4 Serialization\
    \ and Object-to-Storage Mapping\n\nWe need a serialization function `toString()`\
    \ for converting an object to a human-readable string representation that can\
    \ be used for showing an object in a user interface, and an object-record mapping\
    \ function `toRecord()` converting a typed object to a corresponding record that\
    \ can be saved in a persistent data-store. In both cases, internal object references\
    \ are converted to ID references.\n\nThe `Book::toString()` function creates a\
    \ representation that may only contain the relevant properties. The simplest method\
    \ for showing a set of associated objects, like the authors of a book, is creating\
    \ a comma-separated list of IDs:\n\n```javascript\ntoString() {\n  var bookStr\
    \ = `Book: ISBN: ${this.isbn}, title: ${this.title}, year: ${this.year}`;\n  if\
    \ (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n  return\
    \ bookStr + \" authors: \" + Object.keys(this.authors).join(\", \");\n}\n```\n\
    \nThe `Book::toRecord()` function needs to serialize all property slots of an\
    \ object, deleting the underscore prefix for augmenting the corresponding record\
    \ field:\n\n```javascript\ntoRecord() {\n  var rec = {};\n  for (let p of Object.keys(this))\
