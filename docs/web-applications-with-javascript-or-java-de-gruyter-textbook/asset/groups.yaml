    When we make an information model in the form of a UML class diagram, we typically
    end up with a model containing one or more associations that do not have any ownership
    defined for their ends, as, for instance, in Figure 1.4. When there is no ownership
    dot at either end of an association, such as in this example, this means the model
    does not specify how the association is to be represented (or realized) with the
    help of reference properties. Such an association does not have direction. According
    to the UML 2.5 specification, the ends of such an association are “owned” by itself,
    and not by any of the classes participating in it.


