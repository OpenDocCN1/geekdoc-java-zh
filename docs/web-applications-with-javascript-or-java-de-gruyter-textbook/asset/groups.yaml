    \ add 操作。\n    - 如果相关属性是派生属性的反向引用（代表双向关联），请确保 add/remove 方法也向反向属性分配/取消（或添加/移除）对应的反向引用。\n\
    - 4. 编写序列化函数 `toString()` 和对象到存储转换函数 `toRecord()` 的代码。在出版者或作者的对象存储转换 `toRecord()`\
