    | :--- |\n| authors |\n| personId : number (pkey) |\n| name : string |\n| biography\
    \ : string |\n\n| JS entity table |\n| :--- |\n| employees |\n| personId[1] :\
    \ number (pkey) |\n| name[1] : string |\n| empno[1] : number (unique) |\n| category[0..1]\
    \ : number |\n| department[0..1] : string |\n\n| category: |\n| :--- |\n| 1 =\
    \ Manager |\n\n图 13.4：Person 层次结构的 TCI。\n\n在 JTI 方法的情况下，除了上述步骤 5，我们还需要：\n1. 将根表（people）的主键列（personId）复制到所有子表（authors\
    \ 和 employees）。\n2. 将泛化箭头替换为带有 «fkey»标签的依赖箭头（表示外键依赖），并在源端标注子表的键名。\n\n### 13.3.3\
    \ 新问题\n\n与图 13.1 所示的第一个案例模型相比，我们在**模型代码**中必须处理许多新问题：\n\n1. 使用 13.1 节讨论的 `extends`\
