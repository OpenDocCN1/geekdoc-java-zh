- md: "\n# 34 2 Implementing RetrieveList Functional Associations with Plain JS\n\n\
    ```javascript\npl.v.books.retrieveAndAll = {\n  setupUserInterface: function ()\
    \ {\n    const tableBodyEl = document.querySelector(\n      \"#Book-R>table tbody\"\
    );\n    tableBodyEl.innerHTML = \"\"; // drop old contents\n    for (let key of\
    \ Object.keys(Book.instances)) {\n      const book = Book.instances[key];\n  \
    \    const row = tableBodyEl.insertRow(-1);\n      row.insertCell(-1).textContent\
    \ = book.isbn;\n      row.insertCell(-1).textContent = book.title;\n      row.insertCell(-1).textContent\
    \ = book.year;\n      // if the book is a publisher, show its name\n      row.insertCell(-1).textContent\
    \ =\n        book.publisher ? book.name : \"\";\n    }\n  }\n  document.getElementById(\"\
    Book-M\").style.display = \"none\";\n  document.getElementById(\"Book-R\").style.display\
    \ = \"block\";\n};\n```\n\nFor a multi-valued reference property, the table cell\
    \ would have to be filled with a list of all associated objects referenced by\
    \ the property.\n\n## 2.6.3 Selecting Associated Objects in the Create and Update\
    \ Use Cases\n\nFor allowing to select objects to be associated with the currently\
    \ edited object in the Create and Update use cases, an HTML selection list (i.e.,\
    \ a select element) is populated with option elements formed from the instances\
    \ of the associated object type with the help of a utility method fillSelectWithOptions.\
    \ The HTML element is defined in the books.html view file:\n\n```html\n<section\
    \ id=\"Book-C\" class=\"UI-Page\">\n<h1>Public Library: Create a new book record</h1>\n\
    <form>\n  ...\n  <div class=\"select-one\">\n    <label>Publisher: <select name=\"\
    selectPublisher\"></select></label>\n  </div>\n  ...\n</form>\n</section>\n```\n\
    \n## 2.6 Code the View and Controller — 35\n\nThe Create user interface is set\
    \ up by the following procedure:\n\n```javascript\npl.v.books.create = {\n  setupInterface:\
    \ function () {\n    const formEl = document.querySelector(\"section#Book-C >\
    \ form\"),\n    selectPublisher = formEl.selectPublisher,\n    saveButton = formEl.commit;\n\
    \    // add event listeners for responsive validation\n    formEl.isbn.addEventListener(\"\
    input\", function () {\n      formEl.isbn.customValidity =\n        Book.checkIsAsID(formEl.isbn.value);\n\
    \    });\n    // set up a single select list for selecting a publisher\n    util.fillSelectOptions(selectPublisher,\n\
    \      Publisher.instances, \"name\");\n    // define event handler for submit\
    \ button click events\n    saveButton.addEventListener(\"click\",\n      this.handleSaveButtonClickEvent);\n\
    \    // define event handler for neutralizing the submit event\n    formEl.addEventListener(\"\
    submit\", function (e) {\n      e.preventDefault();\n      formEl.reset();\n \
    \   });\n    // replace the manage form with the create form\n    document.getElementById(\"\
