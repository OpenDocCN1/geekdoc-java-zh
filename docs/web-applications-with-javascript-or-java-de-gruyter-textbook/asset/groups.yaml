    \ ConstraintViolation |\n| | toString(): string |\n| | toRecord(): Object |\n\n\
    ## 3.3 New Issues\n\nIn dealing with a functional association, as discussed in\
    \ the previous chapter, we now have to deal with the following new issues:\n\n\
    - 1. In the model code we have to take care of multi-valued reference properties\
