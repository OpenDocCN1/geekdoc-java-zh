    \n```javascript\nconst list = ['red', 'orange', 'yellow'];\nconst clone = [...list];\n\
    ```\n\n## 2.2 Implementing Unidirectional Functional Associations with Plain JS\n\
    \nA unidirectional functional association is either one-to-one or many-to-one.\
