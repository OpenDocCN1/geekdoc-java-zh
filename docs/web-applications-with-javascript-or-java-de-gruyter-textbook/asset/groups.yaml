    | :--- | :--- |

    | name : String | id : String |

    | * | name : String |


    However, the concept of an aggregation with shareable parts doesn''t mean much,
    really, so does not have any implications on how to code the association and many
    developers therefore prefer not to use the white diamond in their class graphs,
    but the UML says: “Precise semantics of shared aggregation varies by application
    area and modeler”.


    The multiplicity of an aggregation’s association end at the whole side may be
    any number (*) because a part may belong to, or shared among, any number of wholes.'
