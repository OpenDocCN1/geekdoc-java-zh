- md: "\n## 13.3 Case Study 2: Implementing a Class Hierarchy\n\nWhenever a class\
    \ hierarchy is more complex, we cannot simply eliminate it, but have to implement\
    \ it (1) in the app's model code, (2) in the underlying database and (3) in its\
    \ user interface.\n\nThe starting point for our case study is the design model\
    \ shown in Figure 12.8 above. In the following sections, we derive a JS class\
    \ model and a JS entity table from the design model. The entity table model is\
    \ used as a design for the object-to-storage mapping that we use for storing the\
    \ objects of our app with the browsers; Local Storage technology.\n\n### 13.3.1\
    \ Make a JS Class Model\n\nWe design the classes of our example app with the help\
    \ of a JS class model that we derive from the design model by essentially leaving\
    \ the generalization rows as are and just adding get/set methods and static check\
    \ functions to each class. However, in the case of our example app, it is natural\
    \ to apply the Class Hierarchy Merge design pattern (discussed in Section 12.6)\
    \ to the single-subclass segmentation of Employee for simplifying the class model\
    \ by eliminating the Manager subclass. This leads to the model shown in Figure\
    \ 13.2 below. Notice that a Person may be an Employee or an Author.\n\n| Person\
    \ |\n| :--- |\n| <get/set> personid: Integer (id) |\n| <get/set> name: String\
    \ |\n| checkPerson(in id : string): ConstraintViolation |\n| checkPersonAid(in\
    \ id : string, in type) : ConstraintViolation |\n| checkName(in n : string): ConstraintViolation\
    \ |\n\n| Author |\n| :--- |\n| <get/set> biography : string |\n| checkBiography(in\
    \ b : string) : ConstraintViolation |\n\n| Employee | enumeration |\n| :--- |\
    \ :--- |\n| <get/set> empno[1] : number (unique) | EmployeeCategoryEL |\n| <get/set>\
    \ category[0..1] : EmployeeCategoryEL | MANAGER |\n| <get/set> department[0..1]\
    \ : string | |\n| checkEmpNo(in n : number) : ConstraintViolation |\n| checkCategory(in\
    \ c : number) : ConstraintViolation |\n| checkDepartment(in d : string): ConstraintViolation\
    \ |\n\nFigure 13.2: The JS class model of the Person roles class hierarchy.\n\n\
    ### 13.3.2 Make a JS Entity Table Model\n\nSince we use the browsers' Local Storage\
    \ as the persistent storage technology for our example app, we have to deal with\
    \ simple key-value storage. For each design model class with a singular (capitalized)\
    \ name Entity, we use its pluralized lowercase name entities as the corresponding\
    \ table name and as a key that its associated string value is obtained by serializing\
    \ the object collection Entity instances with the help of the JSON.stringify method.\n\
    \nWe design a suitable JS entity tables in the form of a JS entity table that\
    \ we derive from the information design model. We have to make certain choices\
    \ how to organize our data and how to derive a corresponding entity table model.\n\
    \nThe first choice to make concerns using the Single Table Inheritance (STI),\
    \ the Table per Class Inheritance (TCI) or the Joined Tables Inheritance (JTI)\
    \ approach, which are introduced in Section 12.7.4. In the STI approach, a segmentation\
    \ (or an entire hierarchy) is represented with a single table, containing columns\
    \ for all attributes of classes involved, and shown in the example model of Figure\
    \ 13.3.\n\n| JS entity table | category: |\n| :--- | :--- |\n| personid[1]: number\
    \ (pkey) | 1 = Author |\n| name[1]: string | 2 = Employee |\n| categories[1]:\
    \ number (1,2,3) | 3 = Employee & Manager |\n| biography[0]: string | |\n| empno[0]:\
    \ number (unique) | |\n| department[0]: string | |\n\n**Figure 13.3:** An STI\
    \ model of the Person roles class hierarchy.\n\nSince the given segmentation is\
    \ non-disjoint, a multi-valued enumeration attribute categories is used for representing\
    \ the information to which subclasses an instance belongs.\n\nUsing the STI approach\
    \ is feasible for the given example, the role hierarchy does not have many levels\
    \ and the segment subclasses do not add more attributes. But, in a more realistic\
    \ example, we would have more attributes in the segment subclasses of the given\
    \ role hierarchy. The STI approach is not really an option for representing a\
    \ multi-level role hierarchy. However, we may choose it for representing the single-segment\
    \ class hierarchy Manager-is-subclass-of-Employee.\n\nFor simplicity, and because\
    \ the browsers' Local Storage does not support foreign keys as required by JTI,\
    \ we choose the TCI approach, where we obtain a rate table for each class of the\
    \ Person segmentation, but without foreign keys. Our choices result in the model\
    \ shown in Figure 13.4 below, which has been derived from the design model shown\
    \ in Figure 12.8:\n\n1. Merging the Manager subclass into its superclass Employee,\
    \ according to the Class Hierarchy design pattern described in Section 12.6.\n\
    2. Replacing the standard ID property modifier {id} of the personId attribute\
    \ of Person, Author and Employee with {pkey} for indicating that the attribute\
    \ is a primary key.\n3. Replacing the singular (capitalized) class names (Person,\
    \ Author and Employee) with pluralized lowercase table names (people, authors\
    \ and employees).\n4. Adding the {JS entity table} stereotype to all class rectangles\
    \ (people, authors and employees).\n5. Replacing the platform-independent datatype\
    \ names with JS datatype names.\n6. Dropping all generalization/inheritance arrows\
    \ and adding all attributes of supertables (personId and name) to their subtables\
    \ (authors and employees).\n\n| JS entity table |\n| :--- |\n| people |\n| personid\
    \ : number (pkey) |\n| name : string |\n\n| JS entity table |\n| :--- |\n| authors\
    \ |\n| personid : number (pkey) |\n| name : string |\n| biography : string |\n\
    \n| JS entity table |\n| :--- |\n| employees |\n| personid[1] : number (pkey)\
    \ |\n| name[1] : string |\n| empNo[1] : number (unique) |\n| category[0..1] :\
    \ number |\n| department[0..1] : string |\n\n| category: |\n| :--- |\n| 1 = Manager\
    \ |\n\n**Figure 13.4:** A TCI of the Person roles hierarchy.\n\nIn the case of\
    \ the JTI approach, in addition to the steps 1–5 above, we would:\n1. Copy the\
    \ primary key column (personId) of the root table (people) to all subtables (authors\
    \ and employees).\n2. Replace the generalization arrows with «fkey»-stereotyped\
    \ dependency arrows (representing foreign key dependencies) that are annotated\
    \ at their source end with the name of the subtable's primary key (here: personId).\n\
    \n### 13.3.3 New Issues\n\nCompared to the model of our first case study, shown\
    \ in Figure 13.1 above, we have to deal with a number of new issues in the **model\
    \ code:**\n\n1. Defining the subclass relationships between Employee and Person,\
    \ as well as between Author and Person, using the JS keyword extends discussed\
    \ in Section 13.1.\n2. When loading the instances of the root class (Person.instances)\
    \ from persistent storage (Person.retrieve()), we load (1) the records of the\
    \ table representing the root class (people) for creating its direct instances\
    \ and (2) also the records of all tables representing its subclasses (authors\
    \ and employees) for creating their direct instances, also adding their object\
    \ references to the root class population (to Person.instances). In this way,\
    \ the root class population does not contain direct instances, but all instances.\n\
    3. When saving the instances of Employee and Author as records of the JS entity\
    \ tables employees and to persistent storage in Employee.saveAll and Author.saveAll\
    \ (invoked in pl.v.employees.manage.exit and pl.v.authors.exit), we also save\
    \ the direct instances of Person as records of the people table.\n\n### 13.3.4\
    \ Code Model Classes of the JS Class Model\n\nThe JS class model shown in Figure\
    \ 13.2 above can be directly coded for getting the code of the model classes Person,\
    \ Employee and Author as well as for the enumeration type EmployeeCategoryEL.\n\
    \n#### 13.3.4.1 Defining Subtype Relationships\n\nWe define the subtype relationships\
    \ between Employee and Person, as well as between Author and Person, with extends.\
    \ For instance, in m/Employee.js we define:\n\n```\nEmployeeCategoryEL = new Enumeration([\"\
    Manager\"]);\n```\n\n```javascript\nclass Employee extends Person {\n  constructor({personId,\
    \ name, empNo, category, department}) {\n    super({personId, name});\n    this.empNo\
    \ = empNo;\n    if (category) this.category = category;\n    if (department) this.department\
    \ = department;\n  }\n}\n```\n"
  mdcn: "\n\n## 13.3 案例 2：实现类层次结构\n\n当类层次结构变得复杂时，我们无法简单地消除它，而必须在 (1) 应用的模型代码中、(2)\
