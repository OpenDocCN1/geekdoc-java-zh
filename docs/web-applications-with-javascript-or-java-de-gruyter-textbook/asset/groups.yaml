    ```\n\nOWL 允许通过以下方式声明一个类是另一个类的子类：\n\n```\n<owl:Class rdf:ID=\"Student\">\n  <rdfs:subClassOf\
    \ rdf:resource=\"#Person\"/>\n</owl:Class>\n<owl:DatatypeProperty rdf:ID=\"studentNo\"\
    >\n  <rdfs:domain rdf:resource=\"#Student\"/>\n  <rdfs:range rdf:resource=\"#xsd:string\"\
    />\n  <rdf:type rdf:resource=\"owl:FunctionalProperty\"/>\n</owl:DatatypeProperty>\n\
    ```\n\n为了更好的易用性，OWL 允许在类定义中定义类的属性，并以函数属性作为默认情况。\n\n### 12.7.4 使用 SQL 数据库表表示类层级结构\n\
    \n标准的数据库管理系统（DBMS）将信息（对象）存储在表的行中，这些行在关系数据库系统中被构想为集合论关系。关系数据库语言 SQL 用于定义、填充、更新和查询此类数据库。但也存在一些更简单的数据存储技术，允许以行的形式存储数据，但它们不支持\
    \ SQL。特别是键值对存储系统（例如 JavaScript 的 Local Storage API），允许将 JS 实体的序列化（实体记录的映射）存储为与表作为键（key）关联的字符串值。\n\
    \n虽然 SQL 的经典版本（SQL92）不支持子类型化和继承，但这种情况在 SQL99 中已经发生了变化。然而，SQL99 中与子类型相关的语言元素仅在某些\
    \ DBMS 中实现，例如开源 DBMS PostgreSQL。因此，为了创建一个能够使用各种框架并通过 SQL  DBMS（包括如 MySQL 和 SQLite\
    \ 等较弱的技术）实现的模型，我们无法使用 SQL99 的子类型化功能，而必须在数据库设计模型中通过普通表和外键依赖来建模继承层级结构。这种从类层级结构到关系表（以及反之）的映射是对象关系映射（ORM）框架的工作，例如\
    \ JPA 提供程序（如 Hibernate）、Microsoft 的 Entity Framework 或 Rails 框架的 Active Record\
    \ 方法。\n\n用数据库表表示类层级结构本质上有三种替代方法：\n\n- 1. **单表继承 (Single Table Inheritance, STI)**\
    \ 是最简单的方法，整个类层级结构由单个表表示，该表包含根类及其所有子类的所有属性的列，并以根类的命名。\n- 2. **类表继承 (Table per Class\
    \ Inheritance, TCI)** 是一种方法，层级结构中的每个类都由一个对应的表表示，该表还包含继承属性的列，重复了表示其父类的表的列。\n- 3.\
    \ **连接表继承 (Joined Tables Inheritance, JTI)** 是一种更符合逻辑的方法，每个段子类都由一个对应的表（子表）表示，该表通过其主键引用父类的主键与表示其父类的表（父表）连接，使得子类的（继承）属性不表示为子表中的列。\n\
    \n注意 STI 方法与上述 12.6 节讨论的类层级合并模式密切相关。每当此设计模式已应用于设计模型中，或者设计模型已根据此设计模式进行了重构，相关的类层级结构（其子类）在设计中就被消除了，因此在要在应用模型层中以类定义形式编码的数据模型中也被消除了，所以不再需要将类层级结构映射到单表。否则，设计模型包含一个通过应用层中相应的类层级结构实现的类层级结构。\n\
    \n"
