    pages and one UI page for each object type and data management case. All UI pages
    are defined in the form of JSF view files in subfolders of WebContent/views/ .
    We create the Main Menu page index.xhtml in the subfolder WebContent/views/content/app
    with the following content:


    ```

    <DOCTYPE html>

    <html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:ui=".." xmlns:f="..">

    <ui:composition template="/WEB-INF/templates/page.xhtml">

    <u:ui define-name="content">

    <h2>Public Library</h2>

    <h:button value="Manage publishers"

    out="/views/publishers/index" />

    <h:button value="Manage books" outcome="/views/books/index" />

    <h:form>

    <h:commandButton value="Clear database"

    action="#{appCtrl.clearData()}" />

    <h:commandButton value="Create test data data"

    action="#{appCtrl.createTestData()}" />

    ```'
  - "[PAGE 76]\n\n```\n</h:form>\n<ui:define>\n</ui:composition>\n</html>\n```\n\n\
    It creates the menu buttons which provide the corresponding views for each of\
    \ the management pages. Additionally, we need to create a corresponding AppController\
    \ class which is responsible for the creation and deletion of the test data. The\
    \ controller is used to combine code of the Publisher.createTestData and Book.createTestData\
    \ and Publisher.clearDataData methods as follows:\n\n```\n@ManagedBean(name=\"\
    appCtrl\") @SessionScoped\npublic class AppController {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public String clearData() {\n        try {\n            Book.clearData(em,\
    \ ut);\n            Publisher.clearData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n\n    public String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\nThe deletion of Book and Publisher data must be done in a particular\
    \ order for avoiding referential integrity violations (books have to be deleted\
    \ first, before their publishers are deleted)."
- md: "\n# 4.5.1 Initialize the App\n\nSince the code runs in a Tomcat container,\
    \ the initialization is made internally by the container.\n\n# 4.5.2 Show Information\
    \ About Associated Objects in Retrieve/List All\n\nIn our example we have only\
    \ one reference property, Book::publisher, which is functional. For showing information\
    \ about the optional publisher of a book in the retrieve/list all books we use,\
    \ the corresponding column in the HTML table is filled with the names of publishers,\
    \ there is any:\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:dataTable value=\"#{bookCtrl.books}\" var=\"\
    b\">\n..\n  <h:column>\n    <f:facet name=\"header\">Publisher</f:facet>\n   \
    \ #{b.publisher.name}\n  </h:column>\n</h:dataTable>\n  <h:button value=\"Main\
    \ menu\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\nNotice\
    \ the cascade call used in the #{b.publisher.name} JSF expression, accessing the\
    \ property name of the publisher which is a property of the book instance b.\n\
    \n# 4.5.3 Allow Selecting Associated Objects in Create and Update\n\nIn this section,\
    \ we discuss how to create and update an object which has reference properties,\
    \ such as a Book object with the reference property publisher.\n\n# 4.5.3.1 Create\
    \ the Object-to-String Converter\n\nHTML requires string or number values to populate\
    \ forms. In our case, the property publisher of the Book class is an object reference.\
    \ JSF allows converting objects to\n\nstrings and vice versa by means of converters,\
    \ which are classes annotated with @FacesConverter and implementing the javax.faces.convert.Converter\
    \ interface:\n\n```\n@FacesConverter(value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n    @Override\n   \
    \ public Object getAsObject(FacesContext context, UIComponent component, String\
    \ value) {\n        PublisherController ac = FacesContext\n            .getCurrentInstance()\n\
    \            .getApplication()\n            .evaluateExpressionGet(context, \"\
    #{publisherCtrl}\",\n                PublisherController.class);\n        EntityManager\
    \ em = ac.getEntityManager();\n        if (value == null) return null;\n     \
    \   else return em.find(Publisher.class, value);\n    }\n    @Override\n    public\
    \ String getAsString(FacesContext context, UIComponent component, Object value)\
    \ {\n        if (value == null) return null;\n        else if (value instanceof\
    \ Publisher) {\n            return ((Publisher) value).getName();\n        }\n\
    \        else return null;\n    }\n}\n```\n\nA converter defines two methods:\
    \ getAsObject and getAsString, which are responsible for the two conversions.\
    \ For being able to retrieve an object from a database we need an EntityManager,\
    \ which can be obtained from a controller (e.g., the managed bean publisherCtrl).\
    \ The controller can be obtained via the FacesContext singleton:\n\n```\nPublisherController\
    \ ac = FacesContext.getCurrentInstance()\n    .getApplication()\n    .evaluateExpressionGet(\
    \ context, \"#{publisherCtrl}\",\n        PublisherController.class);\n```\n\n\
    # 4.5 The View and Controller Layers 63\n\nIn addition, we need to add a getEntityManager\
    \ method in the controller class as follows:\n\n```\n@ManagedBean(name=\"publisherCtrl\"\
    )@SessionScoped\npublic class PublisherContext {\n    @Persistence(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource()\n    UserTransaction\
    \ ut;\n\npublic EntityManager getEntityManager() {\n    return this.em;\n}\n...}\n\
    ```\n\nJSF needs to compare two publisher instances, when the publisher list has\
    \ to auto-select the current publisher, in the update book use case. For this\
    \ reason, the Publisher model class needs to implement the equals method. In our\
    \ case, two publishers are \"one and the same\", if the values of their name property\
    \ are equal:\n\n```\n@Override\npublic boolean equals(Object obj) {\n    if (obj\
    \ instanceof Publisher) {\n        Publisher publisher = (Publisher) obj;\n  \
    \      return this.name.equals(publisher.name);\n    } else return false;\n}\n\
    ```\n\n# 4.5.3.2 Write the View Code\n\nTo allow selection of objects which have\
    \ to be associated with the currently edited object from the create and update\
    \ use cases, an HTML selection list (a select element) of a h:selectOne element.\
    \ The create.xhtml file in the folder WebContent/views/books/ is updated as follows:\n\
    \n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n```\n\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\" value=\"\
    Publisher:\" />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n<f:selectItem itemValue=\"----\" itemLabel=\"----\" />\n<f:selectItems value=\"\
    #{publisherControl.publishers}\" var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"\
    #{p}\" />\n<f:converter converter=\"pl.m.converter.PublisherConverter\" />\n</h:selectOneMenu>\n\
    <h:message for=\"publisher\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton\
    \ value=\"Create\"\naction=\"#{bookCtrl.create}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n```\n\nThe converter is specified by the `converter` attribute\
    \ of the `f:converter` element. The value must be the fully qualified name (e.g.,\
    \ pl.m.converter.PublisherConverter). In general, the converter can be specified\
    \ by the `converter` attribute of the `h:selectOneMenu` element (e.g., `converter=\"\
    pl.m.converter.PublisherConverter\"`), or by using a `f:converter` element inside\
    \ the `h:selectOneMenu`.\n\n```\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n  <h:panelGrid columns=\"3\">\n    <h:outputLabel for=\"\
    publisher\" value=\"Publisher:\" />\n    <h:selectOneMenu id=\"publisher\" value=\"\
    #{book.publisher}\">\n      <f:selectItem itemValue=\"----\" itemLabel=\"----\"\
    \ />\n      <f:selectItems value=\"#{publisherControl.publishers}\" var=\"p\"\
    \ itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n      <f:converter converter=\"\
    pl.m.converter.PublisherConverter\" />\n    </h:selectOneMenu>\n    <h:message\
    \ for=\"publisher\" errorClass=\"error\" />\n  </h:panelGrid>\n  <h:commandButton\
    \ value=\"Create\" action=\"#{bookCtrl.create}\" />\n</h:form>\n```\n```\n\nThe\
    \ creation of the book results in calling the `bookCtrl.create` method:\n\n```java\n\
    public String create(String isbn, String title, Integer year, Publisher publisher)\
    \ {\n    try {\n        Book book = new Book(isbn, title, year, publisher);\n\
    \        em.persist(book);\n        ut.commit();\n    } catch (Exception e) {\n\
    \        ut.rollback();\n        e.printStackTrace();\n    }\n    return \"list\"\
    ;\n}\n```\n\nThe code for updating the book is very similar to the creation code,\
    \ the only difference is the addition of the select element (i.e., using `h:selectOneMenu`)\
    \ for allowing to select the book:\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n<h:panelGrid columns=\"3\">\n  <h:outputLabel for=\"publisher\"\
    \ value=\"Publisher:\" />\n  <h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n    <f:selectItem itemValue=\"----\" itemLabel=\"----\" />\n    <f:selectItems\
    \ value=\"#{publisherControl.publishers}\" var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"\
    #{p}\" />\n    <f:converter converter=\"pl.m.converter.PublisherConverter\" />\n\
    \  </h:selectOneMenu>\n  <h:message for=\"publisher\" errorClass=\"error\" />\n\
    </h:panelGrid>\n<h:commandButton value=\"Update\" action=\"#{bookCtrl.update}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n"
  mdcn: "\n\n# 4.5.1 初始化应用\n\n由于代码在 Tomcat 容器中运行，初始化是由容器内部完成的。\n\n# 4.5.2 在检索/列出所有中显示关联对象的信息\n\
    \n在我们的示例中，我们只有一个引用属性 `Book::publisher`，它是功能性的。为了在检索/列出所有书籍时显示书籍可选的出版者信息，我们在 HTML\
    \ 表格的相应列中填充了出版者的名称，如下：\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:dataTable value=\"#{bookCtrl.books}\" var=\"\
    b\">\n..\n  <h:column>\n    <f:facet name=\"header\">Publisher</f:facet>\n   \
    \ #{b.publisher.name}\n  </h:column>\n</h:dataTable>\n  <h:button value=\"Main\
    \ menu\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\n注意在 #{b.publisher.name}\
    \ JSF 表达式中使用的级联调用，它访问了出版者的属性名称，而出版者是书籍实例 b 的属性。\n\n# 4.5.3 在创建和更新中允许选择关联对象\n\n\
    在本节中我们将我们将如何创建和更新具有引用属性的对象，例如带有引用属性 publisher 的 Book 对象。\n\n# 4.5.3.1 创建对象到字符串的转换器\n\
    \nHTML 需要字符串或数字值来填充表单。在我们的情况下，Book 类的属性 publisher 是一个对象引用。JSF 允许通过转换器将对象转换为字符串并反之亦然，转换器是标记了\
    \ @FacesConverter 注解并实现了 javax.faces.convert.Converter 接口的类：\n\n```\n@FacesConverter(value=\"\
    pl.m.converter.PublisherConverter\")\npublic class PublisherConverter implements\
    \ Converter {\n    @Override\n    public Object getAsObject(FacesContext context,\
    \ UIComponent component, String value) {\n        PublisherController ac = FacesContext\n\
    \            .getCurrentInstance()\n            .getApplication()\n          \
    \  .evaluateExpressionGet(context, \"#{publisherCtrl}\",\n                PublisherController.class);\n\
    \        EntityManager em = ac.getEntityManager();\n        if (value == null)\
    \ return null;\n        else return em.find(Publisher.class, value);\n    }\n\
    \    @Override\n    public String getAsString(FacesContext context, UIComponent\
    \ component, Object value) {\n        if (value == null) return null;\n      \
    \  else if (value instanceof Publisher) {\n            return ((Publisher) value).getName();\n\
    \        }\n        else return null;\n    }\n}\n```\n\n转换器定义了两个方法：getAsObject\
    \ 和 getAsString，它们负责两种转换。为了能够从数据库中检索对象，我们需要一个 EntityManager，它可以从控制器中获取（例如，托管豆\
    \ publisherCtrl）。控制器可以通过 FacesContext 单例获取：\n\n```\nPublisherController ac = FacesContext.getCurrentInstance()\n\
    \    .getApplication()\n    .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n        PublisherController.class);\n```\n\n# 4.5 视图层和控制器层 63\n\n 此外，我们需要在控制器类中添加一个\
    \ getEntityManager 方法，如下：\n\n```\n@ManagedBean(name=\"publisherCtrl\")@SessionScoped\n\
    public class PublisherContext {\n    @Persistence(unitName=\"UnidirAssocApp\"\
    )\n    private EntityManager em;\n    @Resource()\n    UserTransaction ut;\n\n\
    public EntityManager getEntityManager() {\n    return this.em;\n}\n...}\n```\n\
    \n在更新书籍的用例中，当出版者列表必须自动选择当前出版者时，JSF 需要比较两个出版者实例。出于此原因，Publisher 模型类需要实现 equals\
    \ 方法。在我们的情况下，如果两个出版者的 name 属性值相等，则它们是“同一个”：\n\n```\n@Override\npublic boolean\
    \ equals(Object obj) {\n    if (obj instanceof Publisher) {\n        Publisher\
    \ publisher = (Publisher) obj;\n        return this.name.equals(publisher.name);\n\
    \    } else return false;\n}\n```\n\n# 4.5.3.2 编写视图代码\n\n为了允许从创建和更新用例中选择与当前编辑对象关联的对象，需要一个使用\
    \ h:selectOne 元素的 HTML 选择选择列表（一个 select 元素）。位于 WebContent/views/books/ 文件夹下的 create.xhtml\
    \ 文件更新如下：\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n\
    <ui:define name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n```\n\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"\
    publisher\" value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\" value=\"\
    #{book.publisher}\">\n<f:selectItem itemValue=\"----\" itemLabel=\"----\" />\n\
    <f:selectItems value=\"#{publisherControl.publishers}\" var=\"p\" itemLabel=\"\
    #{p.name}\" itemValue=\"#{p}\" />\n<f:converter converter=\"pl.m.converter.PublisherConverter\"\
    \ />\n</h:selectOneMenu>\n<h:message for=\"publisher\" errorClass=\"error\" />\n\
    </h:panelGrid>\n<h:commandButton value=\"Create\"\naction=\"#{bookCtrl.create}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n\n转换器通过 f:converter 元素的\
    \ `converter` 属性指定。该值必须是全限定名（例如 pl.m.converter.PublisherConverter）。通常，转换器可以通过\
    \ h:selectOneMenu 元素的 `converter` 属性指定（例如 `converter=\"pl.m.converter.PublisherConverter\"\
    `），或者通过在 h:selectOneMenu 内部使用 f:converter 元素指定。\n\n```\n<h:form id=\"createBookForm\"\
    \ styleClass=\"pure-form pure-form-aligned\">\n  <h:panelGrid columns=\"3\">\n\
    \    <h:outputLabel for=\"publisher\" value=\"Publisher:\" />\n    <h:selectOneMenu\
    \ id=\"publisher\" value=\"#{book.publisher}\">\n      <f:selectItem itemValue=\"\
    ----\" itemLabel=\"----\" />\n      <f:selectItems value=\"#{publisherControl.publishers}\"\
    \ var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n      <f:converter\
    \ converter=\"pl.m.converter.PublisherConverter\" />\n    </h:selectOneMenu>\n\
    \    <h:message for=\"publisher\" errorClass=\"error\" />\n  </h:panelGrid>\n\
    \  <h:commandButton value=\"Create\" action=\"#{bookCtrl.create}\" />\n</h:form>\n\
    ```\n\n创建书籍会导致调用 `bookCtrl.create` 方法：\n\n```java\npublic String create(String\
    \ isbn, String title, Integer year, Publisher publisher) {\n    try {\n      \
    \  Book book = new Book(isbn, title, year, publisher);\n        em.persist(book);\n\
    \        ut.commit();\n    } catch (Exception e) {\n        ut.rollback();\n \
    \       e.printStackTrace();\n    }\n    return \"list\";\n}\n```\n\n更新书籍的代码与创建代码非常相似，区别在于增加了选择元素（即使用\
    \ h:selectOneMenu）以便选择书籍：\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n<h:panelGrid columns=\"3\">\n  <h:outputLabel for=\"publisher\"\
    \ value=\"Publisher:\" />\n  <h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n    <f:selectItem itemValue=\"----\" itemLabel=\"----\" />\n    <f:selectItems\
    \ value=\"#{publisherControl.publishers}\" var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"\
    #{p}\" />\n    <f:converter converter=\"pl.m.converter.PublisherConverter\" />\n\
    \  </h:selectOneMenu>\n  <h:message for=\"publisher\" errorClass=\"error\" />\n\
    </h:panelGrid>\n<h:commandButton value=\"Update\" action=\"#{bookCtrl.update}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n\n"
