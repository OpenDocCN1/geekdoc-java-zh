    # Part I: Associations


    The three example apps that we have discussed in Volume 1, the minimal app, the
    validation app, and the enumeration app, have been limited to managing the data
    of one object type only. A real app, however, has to manage the data of several
    object types, which are typically related to each other in various ways. In particular,
    there may be associations and subtype (inheritance) relationships between object
    types. Handling associations and subtype relationships are advanced issues in
    software application engineering. They are often not sufficiently discussed in
    text books and not well supported by application development frameworks.


    Associations are important elements of information models. Software application
    frameworks have to implement them in a proper way, especially in their model layer
    within a model-view-controller (MVC) architecture. Unfortunately, application
    development frameworks do not provide much support for dealing with associations.


    There are two important distinctions, which are independent of each other:


    - 1. Functional versus non-functional ("many-to-many") associations.

    - 2. Unidirectional versus bidirectional associations.


    A functional association corresponds to what is called a function in mathematics,
    while a many-to-many association corresponds to what is called a relation in mathematics.


    A unidirectional association corresponds to a reference property in OO modeling
    and programming, while a bidirectional association corresponds to a pair of mutually
    inverse reference properties.


    # 1 Reference Properties and Unidirectional Associations


    A property defined for an object type, or class, is called a reference property
    if its values are references that reference an object of another, or of the same
    type. For instance, the Committee shown in Figure 1.1 below has a reference property
    chair, the values of which are references to objects of type ClubMember.


    An association between object types classifies relationships between objects of
    those types. For instance, the association Committee-hasClubMember-as-chair, which
    is visualized as a line in the class diagram shown in Figure 1.2 below, classifies
    the relationships FinanceCommittee-hasPeterMiller-as-chair, RecruitmentCommittee-hasSusanSmith-as-chair
    and AdvisoryCommittee-hasSarahAnderson-as-chair, where the objects PeterMiller,
    SusanSmith and SarahAnderson are of type ClubMember, and the objects FinanceCommittee,
    RecruitmentCommittee and AdvisoryCommittee are of type Committee. An association
    as a set of relationships can be represented as a table like so:


    | Committee-hasClubMember-as-chair | |

    | :--- | :--- |

    | Finance Committee | Peter Miller |

    | Recruitment Committee | Susan Smith |

    | Advisory Committee | Sarah Anderson |


    Reference properties correspond to a special form of association, namely binary.
    While binary association does, in general, not need to be directed from the property''s
    domain class (where it is defined) to its range class. In general, associations
    are relationship types with two or more object types participating in them. For
    simplicity, in this book we just say ''association'' when we mean ''binary association''.


    # 1 Reference Properties and Unidirectional Associations


    In mathematics, associations have been formalized in an abstract way as sets of
    uniform tuples, called relations. In Entity-Relationship (ER) modeling, which
    is the classical information modeling approach in information systems and software
    engineering, objects are called entities, and associations called relationship
    types. The Unified Modeling Language (UML) includes the Class Diagram language
    for information modeling. In UML, object types are called classes, and individual
    relationships are called "links". These terminologies are summarized in the following
    table:


    | Our preferred term(s) | UML | ER Diagrams | Mathematics |

    | :--- | :--- | :--- | :--- |

    | object | object | entity | individual |

    | object type (class) | class | entity type | unary relation |

    | relationship | link | relationship | tuple |

    | association (relationship type) | association | relationship type | relation
    |

    | functional association | | one-to-one, many-to-one or one-to-many relationship
    type | function |


    We first discuss reference properties, which implicitly represent bidirectional
    associations in an "association-free" class model (a model without any association
    element).


    # 1.1 References and Reference Properties


    A reference can be either human-readable or an internal object reference. Human-readable
    references refer to identifiers that are used in human communication, such as
    the unique names of astronomical bodies, the ISBN of books and the employee numbers
    of the employees of a company. Internal object references refer to the computer
    memory addresses of OOP objects, providing an efficient mechanism for accessing
    objects in the main memory of a computer.


    Some languages, like SQL and XML, only support human-readable, but not internal
    references. In SQL, human-readable references are called foreign keys, and the
    identifiers they refer to are called primary keys. In XML, human-readable references
    are called ID references and the corresponding attribute type is IDREF.


    Objects in an OO program can be referenced either with the help of human-readable
    references (such as integer codes) or with internal object references, which are
    preferable for accessing objects efficiently in main memory.

