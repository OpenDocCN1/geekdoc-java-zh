    # 前言


    这两卷书籍展示了如何使用基于模型的方法并实现 Web 应用，使用了 Web 开发中最相关的两个平台：JavaScript 和 Java。Web 应用通过 UML
    图进行设计，并实现为：


    - JavaScript 前端，使用两种本地存储技术之一；

    - Java 后端，使用 Server Faces (JSF) 作为接口技术，Java Persistence API (JPA) 用于对象到存储的映射，以及
    MySQL/MariaDB 数据库管理系统。


    本书重点是关于完整性约束和数据验证的基本管理问题的通用概念和技术、枚举及枚举属性、对象类型之间的单向和双向关联，以及类层次中的子类型。此列表前两个问题在第
    1 卷中讨论，后两个问题在第 2 卷中讨论。我们假设读者已经熟悉 HTML 和至少一种面向对象的编程语言，如 C++、Java、Python 或 C#。此外，我们假设读者对
    JavaScript 有一定了解，并兴趣学习更多使用 JavaScript 或 Java 进行编程。本书可用于计算机科学、信息系统及相关专业的学生的 Web
    开发课程；供 JavaScript 开发者学习 Java；供 Java 开发者学习 JavaScript；以及供 JavaScript 和 Java（以及
    PHP/C#）开发者学习——如何使用原生 JavaScript 或 Java 实现基本管理概念并构建完整的应用程序。本书附有示例应用程序的完整源代码，您可以从我们的
    Web 服务器运行或下载。


