    \  publisher_id: formEl.selectPublisher.value\n};\n// // 为响应式验证添加监听器\n..\n// 仅当所有字段值有效时才提交更新\n\
    if (formEl.checkValidity()) {\n// // 从关联列表构建 authorIdsToAd/ToRemove \nlet authorRefsToAdd=[],\
    \ authorRefsToRemove=[];\nfor (let mclListItemEl of multiChoiceListEl.children)\
    \ {\n  if (mclListItemEl.classList.contains(\"removed\")) {\nauthorRefsToRemove.push(mclListItemEl.getAttribute(\"\
    data-value\"));\n  }\n  if (mclListItemEl.classList.contains(\"added\")) {\nauthorRefsToAdd.push(mclListItemEl.getAttribute(\"\
    data-value\"));\n  }\n}\n// // 如果添加/删除列表非空则创建相应的槽位\nif (authorRefsToRemove.length\
    \ > 0) {\nslots.authorRefsToRemove = authorRefsToRemove;\n}\nif (authorRefsToAdd.length\
    \ > 0) {\nslots.authorRefsToAdd = authorRefsToAdd;\n}\n// Book.update(slots);\n\
    // // 更新书籍选择列表的选项元素\nselectBookEl[selectBookEl.selectedIndex].text = slots.title;\n\
    }\n}\n}\n```\n\n## 3.6 如何运行应用并获取代码\n\n你可以从我们的服务器运行示例应用并将其作为 ZIP 压缩包下载。\n\n## 3.7\
    \ 注意事项\n\n我们仍然在模型层中为每个类和每个属性保留了重复的代码结构（称为样板代码），用于约束验证（检查和设置器），并为每个类编写了数据存储管理方法（添加、更新和删除）。虽然为了学习应用开发而编写几次这些代码是有好处的，但在处理实际项目时，你不希望一遍又一遍地编写它们。为了避免重复的样板代码，需要这些方法的通用形式，以便它们可以在应用的所有模型类中复用。例如，cCLASSjs\
    \ 库就提供了这种方法。\n\n## 4 使用 Java EE 实现单向功能关联\n\n单向功能关联可以是一对一或多对一的。在这两种情况下，这种关联都是通过一个单值引用属性来表示或实现的。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有表示单向功能关联的单值引用属性的 OO 类模型推导出 Java 实体类模型模型；\n- 2. 如何以实体类（实现模型类）的形式编写\
    \ Java 实体类模型；\n- 3. 如何基于实体类编写视图和控制器代码。\n\n## 4.1 在 Java 中实现单值引用属性\n\n单值引用属性（例如\
    \ `Book` 对象类型的出版者）允许存储对另一种类型对象（如 `Publisher`）的内部引用。在创建新对象时，构造函数需要一个参数来为引用属性赋值。在\
    \ Java 等编程语言中，我们可能需要决定该值预期是对象引用还是 ID。使用 JPA 技术，我们在实体类中处理对象引用的方式如下：\n\n```java\n\
    @Entity\n@Table(name=\"books\")\npublic class Book {\n\n    private publisher;\n\
    \n    public Book() {}\n\n    public void setPublisher(Publisher publisher) {\n\
    \    }\n}\n```\n\n## 4. 创建 Java 实体模型\n\n创建 Java 实体类的起点是如所示的 OO 类模型。我们通过以下步骤获取\
    \ Java 实体类：(1) 将所有属性设为私有，(2) 使用适当的类型，(3) 添加 getter 和 setter，(4) 添加 toString 函数，(5)\
    \ 添加用于检索、更新和删除的类级方法：\n\n| Java 实体 |\n| :--- |\n| Book |\n| isbn | String (id)\
    \ |\n| title | String |\n| year | Integer |\n| publisher | Publisher (manyToOne)\
    \ |\n| checkISBNAsId(String, EntityManager) : ConstraintViolation |\n| toString()\
    \ : String |\n| retrieveAll(EntityManager) : List<Book> |\n| retrieve(EntityManager,\
    \ String) : Publisher | create(EntityManager, String, Integer, Publisher) : void\
    \ | update(EntityManager, String, Integer, Publisher) : void | delete(EntityManager,\
    \ String) : void |\n\n## 4.3 新问题\n\n与之前讨论的单类应用相比，我们必须处理许多新问题：\n\n- 1. 在模型代码中，我们现在需要处理引用属性：\n\
    \   1. 使用合适的 JPA 注解定义完整性约束；\n   2. 考虑到引用属性扩展创建、更新和删除方法的代码；\n   3. 在序列化和反序列化操作中转换（内部）对象引用和（外部）ID\
    \ 引用的方法。\n- 2. 在用户界面（视图）代码中，我们现在需要处理：\n   1. 在检索/列出所有的用例中显示有关关联对象的信息；\n   2. 在创建对象和更新对象的用例中，允许从目标类的所有现有实例列表中选择关联对象。\n\
    \n## 4.4 编写模型代码\n\n可以直接编写 Java 实体类以获取我们 Java 后端应用的模型层代码。\n\n### 4.4.1 总结\n\n-\
    \ 1. 将 Java 实体类中的每个类编码为相应的实体类。\n- 2. 使用 JPA 注解 @Id 编写 属性修符\n- 3. 为引用属性的功能类型的属性修符（如\
    \ [manyToOne]）编写 JPA 注解，如 @ManyToOne。\n- 4. 使用 Java Bean 验证注解（或自定义验证注解）对模型中指定的完整性约束编写代码。\n\
    - 5. 编写 getter 和 setter。\n- 6. 作为类级方法编写创建、检索、更新和删除存储操作。\n\n"
