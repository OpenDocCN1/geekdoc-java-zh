  - "[PAGE 179]\n\n# 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 163\n\n#  14.2.3.1 Summary\n\n+   1. Code the enumeration type (to be used\
    \ in the facets).\n2. Code the model classes and add the corresponding JPA annotations\
    \ for class hierarchy.\n\nThese steps are discussed in more detail in the following\
    \ sections.\n\n#  14.2.3.2 Code the Enumeration Type BookCategoryEL\n\nThe enumeration\
    \ type BookCategoryEL is coded as a Java enum, providing enumeration literals\
    \ as well (human-readable) labels:\n\n```\npublic enum BookCategoryEL {\n    TEXTBOOK(\"\
    TextBook\"), BIOGRAPHY(\"Biography\");\n    private final String label;\n\n  \
    \  private BookCategoryEL(String label) {\n        this.label = label;\n    }\n\
    \    public String getLabel() {return this.label;}\n}\n```\n\n#  14.2.3.2.1 Code\
    \ the Model Classes\n\nWe code the model classes Book, TextBook and Biography\
    \ in the form of Java Entity classes using suitable JPA annotations:\n\n```\n\
    @Entity@Table(name=\"books\")\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn(name=\"category\", discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\n@DiscriminatorValue(value=\"BOOK\")\n@ManagedBean(name=\"book\"\
    )\npublic class Book {\n    @Id@Column(length=10)\n    @NotNull(message=\"An ISBN\
    \ is required!\")\n    @Pattern(regexp=\"\\\\d{9}\", message=\"The ISBN must be\
    \ a . . !\")\n    Private String isbn;\n    @Column(nullable=false)@NotNull(message=\"\
    A title is required!\")\n    Private String title;\n    @Column(nullable=false)@NotNull(message=\"\
    A year is required!\")\n    @UpToNextYear\n```"
- md: "\n# 14 Subtyping with Java EE\n\n```\n@Min(value=1459, message=\"The year must\
    \ not be before 1459!\")\nprivate Integer year;\nprivate constructors, set, get\
    \ and other methods\n..\n```\n\nWhen using the JPA Single Table Inheritance technique\
    \ for a class hierarchy, the @Inheritance annotation (e.g. Book in our example)\
    \ must be set for the superclass as it provides the strategy parameter with the\
    \ value InheritanceType.SINGLE_TABLE. The @DiscriminatorColumn annotation specifies\
    \ the name of the table column storing the values that discriminate different\
    \ types of subclasses (Textbook and Biography, in our example).\n\nUnfortunately,\
    \ we cannot use our BookCategoryEL enumeration for defining the type of the discriminator\
    \ column, because Java expressions like BookCategoryEL.TEXTBOOK.name() are not\
    \ constant, so a Java compiler exception is thrown. Instead, we use @DiscriminatorType.STRING.\
    \ The @DiscriminatorValue annotation specifies a unique value to be stored in\
    \ the discriminator column of rows representing an instance of the class.\n\n\
    Further, define the subtypes Textbook and Biography:\n\n```\n@Entity(name=\"textbooks\"\
    )\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"textbook\") @ViewScoped\n\
    public class Textbook extends Book {\n    @Column( nullable=false) @NotNull(\n\
    \        message=\"A subject area value is required\")\n    String subjectArea;\n\
    \    // constructors, set, get and other methods\n}\n```\n\nTextbook and Biography\
    \ are subclasses of Book, so we define them with extends Book. For each subclass,\
    \ we add a @DiscriminatorValue annotation with a value from the BookCategoryEL\
    \ enumeration.\n\n# 14.2.4 STI Database Schema\n\nAs a result of the annotation\n\
    \n```\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n```\n\n# 14.2 Case\
    \ Study 1: Implement a Class Hierarchy with Single Inheritance — 165\n\nonly one\
    \ database table is used for representing a class hierarchy. This table contains\
    \ the columns corresponding to all the properties of the classes from the hierarchy\
    \ plus the discriminator column. In our example, the books table contains the\
    \ following columns: isbn, title, year, subjectArea, and about category. The simplified\
    \ corresponding SQL-DDL code used to generate the books table for our application\
    \ is shown below:\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN` varchar(10)\
    \ NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `SUBJECTAREA`\
    \ varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255) DEFAULT NULL,\n  `category`\
    \ varchar(16) DEFAULT NULL\n)\n```\n\n# 14.2.5 Write the View And Controller Code\n\
    \nThe user interface (UI) consists of a start page that allows navigating to the\
    \ data management pages (in our example, to index.xhtml in the folder WebContent/views/books/).\
    \ Such a data management page contains four sections: retrieve/list all books,\
    \ create book, update book and delete book.\n\n# 14.2.5.1 Summary\n\nWe have to\
    \ take care of handling the category discriminator and the subjectArea and about\
    \ segment properties both in the “List all books” use case as well as in the “Create\
    \ book” and “Update book” use cases\n\n1. Adding a segment information column\
    \ (`Special`) to the display table of the Retrieve/List All use case in retrieveAndListAll.xhtml\
    \ in the folder WebContent/views/books/.\n2. Adding a “Special type” select control,\
    \ and corresponding form fields for all segment properties, in the forms of the\
    \ “Create book” and “Update book” use cases in create.xhtml and update.xhtml in\
    \ the folder WebContent/views/books/. Segment property fields are only displayed,\
    \ and their validation occurs only when a corresponding book category has been\
    \ selected.\n\n# 14.2.5.2 Add a Segment Information Column in Retrieve/List All\n\
    \nWe add a \"Special\" column to the display table of the \"List all books\" use\
    \ case in books.html:\n\n```xml\n<h:dataTable value=\"#{bookController.books}\"\
    \ var=\"b\">\n<h:column>\n  <f:facet name=\"header\">Special type</f:facet>\n\
    \  #{b.getClass().getSimpleName() != 'Book' ? b.getClass().getSimpleName() : ''}\n\
    </h:column>\n</h:dataTable>\n```\n\nA conditional expression is used to check\
    \ if the Java bean name is Book, in which case we don't show it, or if it is something\
    \ else (e.g. Textbook or Biography), and then it is shown. This expression also\
    \ shows how you can/vary Java bean methods, not only custom methods.\n\n# 14.2.5.3\
    \ Add a \"Special Type\" Select Control in Create and Update\n\nIn both cases,\
    \ we need to allow selecting a special category of book ('textbook' or 'biography')\
    \ with the help of a select control in a panel grid element:\n\n```xml\n<h:panelGrid\
    \ id=\"bookPanel\" columns=\"3\">\n  <h:outputText value=\"Special type\" />\n\
    \  <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookType}\">\n    <f:select\
    \ itemLabel=\"--\" />\n    <f:selectItems value=\"#{book.items}\" />\n    <f:ajax\
    \ event=\"change\" execute=\"@this\" render=\"textBook biographyPanel standardBookPanel\"\
    />\n  </h:selectOneMenu>\n  <h:message for=\"bookType\" errorClass=\"error\" />\n\
    </h:panelGrid>\n```\n\nIn the select control, three alternative panel groups are\
    \ referenced:\n\n1. A \"standardBookPanel\":\n\n```xml\n<h:panelGroup id=\"standardBookPanel\"\
    >\n  <h:commandButton value=\"Create\"\n    rendered=\"#{viewScope.bookType ==\
    \ null}\"\n    action=\"#{bookController.create(book.isbn, book.title, book.year)}\"\
    \ />\n</h:panelGroup>\n```\n\n2. A \"textBookPanel\":\n```xml\n<h:panelGroup id=\"\
    textBookPanel\">\n<h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\
    \ columns=\"3\">\n  <h:outputText value=\"Subject area: \" />\n  <h:inputText\
    \ id=\"subjectArea\" value=\"#{book.subjectArea}\" />\n  <h:message for=\"subjectArea\"\
    \ errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton value=\"Create\"\n\
    \  rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n  action=\"#{textBookController.create(book.isbn,\
    \ book.title, book.year)}\" />\n</h:panelGroup>\n\n3. A \"biographyPanel\":\n\
    ```xml\n<h:panelGroup id=\"biographyPanel\">\n<h:panelGrid rendered=\"#{viewScope.bookTypeVal\
    \ == 'BIOGRAPHY'}\" columns=\"3\">\n  <h:outputText value=\"About: \" />\n  <h:inputText\
    \ id=\"about\" value=\"#{book.about}\" />\n  <h:message for=\"about\" errorClass=\"\
    error\" />\n</h:panelGrid>\n<h:commandButton value=\"Create\"\n  rendered=\"#{viewScope.bookTypeVal\
    \ == 'BIOGRAPHY'}\"\n  action=\"#{biographyController.create(book.isbn, book.title,\
    \ book.year)}\" />\n</h:panelGroup>\n```\n\nThere are few important remarks on\
    \ the code above:\n- the render attribute used with f:ajax specifies which of\
    \ the JSF components are updated. This is needed because the live changes (client\
    \ side, server side) after the AJAX call\n- AJAX is used to submit the form for\
    \ revaluation when the selection list is changed (something is selected). As a\
    \ result, it enforces the rendering of the three panels corresponding to simple\
    \ book, text book and biography. Using execute=\"this\" we enforce the revaluation\
    \ of the form at server side, so the resulting HTML DOM contains the changes accordingly\
    \ the conditions specified by the rendered attributes of the various elements.\
    \ Notice that a JSF element that has a conditional expression must be a child\
    \ of another JSF element which is always part of the DOM.\n- h:panelGroup is used\
    \ to define a set of elements which are either or hidden.\n- the action attribute\
    \ of h:commandButton can't be used with conditional expressions, therefore we\
    \ have to create three buttons, for each case:update a Book, a TextBook or a Biography.\
    \ The method of the corresponding controller class (i.e., BookController, TextBookController,BiographyController\
    \ is called).\n- since we do not have a corresponding property in the Java class(es)\
    \ for the special type (category), we can use JSF variables to store the value\
    \ of the single select list, and then use the variable in rendered conditions\
    \ for various elements. Therefore, for the h:selectOneMenu, value=\"#{viewScope.bookTypeValue}\"\
    \ specifies that we use a \"on the fly\" defined property named bookTypeValue,\
    \ which is part of the view scope internal JSF object(s). We can also define such\
    \ variable using view scope, e.g., value=\"#{bookTypeValue}\", but in this case\
    \ they are requested, so their value is lost after submitting the form, and the\
    \ rendered conditions cannot be correctly evaluated.\n\nFor a class in the hierarchy,\
    \ one corresponding controller class is defined. It contains the specific create,\
    \ update and delete methods. The shared methods, such as getAllObjects are defined\
    \ by the controller of the top level class (e.g., for our example, this is BookController).\
    \ See minimal app for more details on how to implement the controller class and\
    \ the corresponding CRUD methods.\n\nThe Update test case is very similar with\
    \ the Create test case case. The Delete test case remains unchanged.\n"
  mdcn: "\n\n# 14 Java EE 中的子类型\n\n```\n@Min(value=1459, message=\"The year must not\
    \ be before 1459!\")\nprivate Integer year;\nprivate constructors, set, get and\
    \ other methods\n..\n```\n\n当使用 JPA 单表继承（Single Table Inheritance）技术处理类层次结构时，必须在父类上设置\
    \ `@Inheritance` 注解（例如示例中的 Book），因为它为 `strategy` 参数提供了 `InheritanceType.SINGLE_TABLE`\
    \ 值。`@DiscriminatorColumn` 注解指定了用于存储区分符值（这些值用于区分不同子类类型，在我们的示例中为 Textbook 和 Biography）的数据库列名称。\n\
    \n遗憾的是，我们无法使用 `BookCategoryEL` 枚举来定义区分符列的类型，因为像 `BookCategoryEL.TEXTBOOK.name()`\
    \ 这样的 Java 表达式不是常量，因此 Java 抛 异常。相反，我们使用 `@DiscriminatorType.STRING`。`@DiscriminatorValue`\
    \ 注解指定了一个唯一值，存储在代表类实例的行的区分符列中。\n\n此外，定义子类型 `Textbook` 和 `Biography`：\n\n```\n\
    @Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"\
    textbook\") @ViewScoped\npublic class Textbook extends Book {\n    @Column( nullable=false)\
    \ @NotNull(\n        message=\"A subject area value is required\")\n    String\
    \ subjectArea;\n    // constructors, set, get and other methods\n}\n```\n\n`Textbook`\
    \ 和 `Biography` 是 `Book` 的子类，因此我们使用 `extends Book` 来定义它们。对于每个子类，我们都添加一个 `@DiscriminatorValue`\
    \ 注解，其值来自 `BookCategoryEL` 枚举。\n\n# 14.2.4 STI 数据库模式\n\n由于注解：\n\n```\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\n# 14.2 案例研究 1：使用单继承实现类层次结构 — 165\n\n仅使用一个数据库表来表示类层次结构。该表包含层次结构中所有属性对应的列以及区分符列。在我们的示例中，`books`\
    \ 表包含以下列：isbn、title、year、subjectArea 和 about category。用于为我们的应用程序生成 `books` 表的简化\
    \ SQL-DDL 代码所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN` varchar(10)\
    \ NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `SUBJECTAREA`\
    \ varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255) DEFAULT NULL,\n  `category`\
    \ varchar(16) DEFAULT NULL\n)\n```\n\n# 14.2.5 编写视图和控制器代码\n\n用户界面（UI）由一个起始页组成，允许进入数据管理页面（在我们的示例中，到\
    \ WebContent/views/books/ 文件夹下的 index.xhtml）。此类数据管理页面包含四个部分：检索/列出所有书籍、创建书籍、更新书籍和删除书籍。\n\
    \n# 14.2.5.1 总结\n\n在“列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中，我们必须处理类别区分符以及 `subjectArea` 和\
    \ `about` 分段属性。\n\n1. 在 WebContent/views/books/ 文件夹下的 `retrieveAndListAll.xhtml`\
    \ 的“检索/列出所有”用例显示表中添加一个分段信息列（`Special`）。\n2. 在 WebContent/views/books/ 文件夹下的 `create.xhtml`\
    \ 和 `update.xhtml` 的“创建书籍”和“更新书籍”用例表单中，添加“特殊类型”选择控件以及所有分段属性对应的表单字段。分段属性字段仅显示，且仅在选择了相应的书籍类别后才进行验证。\n\
    \n# 14.2.5.2 在检索/列出所有中添加分段信息列\n\n我们在 books.html 的“列出所有书籍”用例显示表中添加了“Special”列：\n\
    \n```xml\n<h:dataTable value=\"#{bookController.books}\" var=\"b\">\n<h:column>\n\
    \  <f:facet name=\"header\">Special type</f:facet>\n  #{b.getClass().getSimpleName()\
    \ != 'Book' ? b.getClass().getSimpleName() : ''}\n</h:column>\n</h:dataTable>\n\
    ```\n\n使用一个条件表达式来检查 Java Bean 名称是否为 `Book`，如果是，则不显示；如果是其他（例如 `Textbook` 或 `Biography`），则显示。此表达式还展示了如何调用/更改\
    \ Java Bean 方法，而不仅仅是自定义方法。\n\n# 14.2.5.3 在创建和更新中添加“特殊类型”选择控件\n\n在两种情况下，我们都需要通过\
    \ `panelGrid` 元素中的选择控件允许选择特殊类别的书籍（`textbook` 或 `biography`）：\n\n```xml\n<h:panelGrid\
    \ id=\"bookPanel\" columns=\"3\">\n  <h:outputText value=\"Special type\" />\n\
    \  <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookType}\">\n    <f:select\
    \ itemLabel=\"--\" />\n    <f:selectItems value=\"#{book.items}\" />\n    <f:ajax\
    \ event=\"change\" execute=\"@this\" render=\"textBook biographyPanel standardBookPanel\"\
    />\n  </h:selectOneMenu>\n  <h:message for=\"bookType\" errorClass=\"error\" />\n\
    </h:panelGrid>\n```\n\n在选择控件中，引用了三个备用面板组：\n\n1. 一个 \"standardBookPanel\"：\n\n\
    ```xml\n<h:panelGroup id=\"standardBookPanel\">\n  <h:commandButton value=\"Create\"\
    \n    rendered=\"#{viewScope.bookType == null}\"\n    action=\"#{bookController.create(book.isbn,\
    \ book.title, book.year)}\" />\n</h:panelGroup>\n```\n\n2. 一个 \"textBookPanel\"\
    ：\n```xml\n<h:panelGroup id=\"textBookPanel\">\n<h:panelGrid rendered=\"#{viewScope.bookTypeVal\
    \ == 'TEXTBOOK'}\" columns=\"3\">\n  <h:outputText value=\"Subject area: \" />\n\
    \  <h:inputText id=\"subjectArea\" value=\"#{book.subjectArea}\" />\n  <h:message\
    \ for=\"subjectArea\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton\
    \ value=\"Create\"\n  rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n  action=\"\
    #{textBookController.create(book.isbn, book.title, book.year)}\" />\n</h:panelGroup>\n\
    ```\n\n3. 一个 \"biographyPanel\"：\n```xml\n<h:panelGroup id=\"biographyPanel\"\
    >\n<h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'BIOGRAPHY'}\" columns=\"\
    3\">\n  <h:outputText value=\"About: \" />\n  <h:inputText id=\"about\" value=\"\
    #{book.about}\" />\n  <h:message for=\"about\" errorClass=\"error\" />\n</h:panelGrid>\n\
    <h:commandButton value=\"Create\"\n  rendered=\"#{viewScope.bookTypeVal == 'BIOGRAPHY'}\"\
    \n  action=\"#{biographyController.create(book.isbn, book.title, book.year)}\"\
    \ />\n</h:panelGroup>\n```\n\n上述代码有几点重要说明：\n- `f:ajax` 的 `render` 属性指定了要更新哪些 JSF\
    \ 组件。这是因为 AJAX 调用后需要在客户端更新这些组件。\n- 使用 `execute=\"this\"` 强制在选择列表更改时对表单进行重新评估，从而根据各个\
    \ `rendered` 属性指定的条件产生 HTML DOM 变化。\n- 注意，带有条件表达式的 JSF 元素必须是始终存在的 JSF 元素的子元素。\n\
    - `h:panelGroup` 用于定义一组显示或隐藏的元素。\n- `h:commandButton` 的 `action` 属性无法与条件表达式配合，因此我们必须为每种情况创建一个按钮：更新\
    \ Book、TextBook 或 Biography。调用相应控制器类的方法（即 `BookController`、`TextBookController`、`BiographyController`）。\n\
    - 由于我们在 Java 类中没有对应特殊类型（类别）的属性，我们可以使用 JSF 变量来存储单个选择列表的值，然后在各个元素的 `rendered` 条件中使用该变量。因此，对于\
    \ `h:selectOneMenu`，`value=\"#{viewScope.bookTypeValue}\"` 指定我们使用一个动态定义的 `bookTypeValue`\
    \ 属性，它是视图作用域内部 JSF 节点的一部分。我们也可以在视图作用域定义此类变量，例如 `value=\"#{bookTypeValue}\"`，但这种情况下它们在提交表单后会丢失，因此无法正确评估渲染条件。\n\
    \n"
