  - 序言
- - '###'
  - 马克·帕里洛
- - '##'
  - 武士道是中世纪日本社会的产物，当时武士作为精英阶层出现，正如欧洲的贵族——骑士战士阶层曾经经历一样。当 19 世纪末新建立的日本政府决定实行现代化时，武士作为一个阶层被正式废除。然而，政府的新领导人本身曾是前武士，他们鼓励在整个新的国家教育体系以及新的国家军队中提炼武士道的价值观。通过义务兵役制，所有日本男性都接受了武士精神的教化。这造就了极其狂热的士兵，而对于他们的俘虏来说，这是一场人间地狱。
- - '##'
  - 日本士兵经常被上级毒打，也会下级。对日本人来说，被俘意味着失败和道德上的软弱，这种软弱允许自己被俘，而不是死亡来赎罪。战俘尤其受到蔑视，因为他们自称战士；但在守卫者眼中，被囚禁的平民也是失败的，这种无处不在。
- - '##'
  - 社会阶级意识对顺从的符号和手势给予了额外的强调，例如鞠躬。在这样的氛围下，严格遵守规则是社会尊重的象征。无论这些规则是否符合实际、是否合理，都不重要。规则就是规则，违规行为超越了法律，变成了对荣誉的侮辱。
- - '##'
  - 俘虏的轻视视为更大意义。食物、住房、衣物和医疗护理对战俘来说是原始的。无论占领者提供了什么，足以维持生命，那都是天皇（仁慈）的产物。战俘必须忍受短缺和匮乏。
- - '##'
  - 另一个影响日本人对待俘虏方式的因素：当 19 世纪末“黑船”被迫向西方开放时，这个国家在军事上落后，因此不得不接受“平等条约”。
- - '##'
  - 这些元素——必需品的长期且广泛的短缺、对俘虏的低视、士兵日常生活的残忍、守卫者的特殊怨恨、战俘在可见的未来中的孤立和绝望——使得二世界大战期间被日本人掌握的人过着惨的生活。这是一个虐待狂准备，守卫中确实出现了这样的人。尽管战后盟国严厉审判了许多暴徒，但囚犯的苦难不仅仅是个人的产物。它是这种处境固有的地狱。日常生活变成了恐怖，对未来的规划变得不可想象。每天早上醒来面对新一天就需要巨大的勇气。
- - '##'
  - 二战期间被监禁的 12.5 万印度尼西亚平民的屈辱与痛苦，不仅是一个关于战争下人类精神的堕落与不屈的故事，还是帝国如何终结、新国家产生的历史。是在太平洋战争的熔炉中，“印度尼西亚”才有了意义和现实。
