    # Companion Planting: Myth or Reality?


    Much has been written about growing particular plants to repel pests, but I am
    afraid it is mostly wishful thinking. That’s because plant-eating insects have
    an incredibly acute ability to “smell” their target plants, yet little ability
    to detect irrelevant scents. So an insect that eats cabbage can detect the mustard
    oil compounds in the leaves, but not necessarily the chemicals found in mint,
    dill, or other plants often recommended to repel pests.


    But it isn not completely bunk: Some companion planting works very well, just
    not the way you might think. Many plants recommended as companions (those mint
    or dill plants, for example) are excellent for lured beneficial insects to the
    garden where they attack pests. While planting garlic is useless to repel'
