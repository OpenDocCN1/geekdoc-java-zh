  md: '# CHAPTER 6


    # Basic Methods for Growing Fruit


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_211_0.png)


    There are a few things more delightful than sweet juicy plums or crisp fall apples
    from your own tree, unless it perfectly ripe fig or a sun-warmed bunch of grapes.
    And don''t get me started on the delights of the many berries that grow so well
    here! Tree fruit can be a hit-or-miss crop on the coast because trees bloom early
    in the year, when rainy spring weather can keep bees from pollinating the flowers.
    Figs, grapes, and berries don''t have this problem. Even if you don''t have room
    for fruit trees in a very small garden, you might fit in strawberries or perhaps
    a table grape along a fence.


    # The Right Size of Fruit Tree


    Standard fruit trees can grow 20 feet or more, which is way too big for home gardens.
    They are a lot of work to prune, and when there is a crop, there is an avalanche
    of fruit to deal with. If you are planting new trees in a home garden, I recommend
    dwarf fruit trees, which don''t need much pruning and allow you to reach fruit
    without climbing a ladder. Best of all, they start producing fruit in as little
    as three years. They can also be planted along fences or walls and kept pruned
    to fit small spaces.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'Dwarf trees need more fertile soil and irrigation than standard trees, which
    actually makes them an excellent fit for a backyard garden because their needs
    are similar to vegetables.


    Nurseries sell dwarf apples, pears, peaches, plums, and sweet cherries. Most dwarf
    fruit trees can be kept under 10 to 12 feet tall. When mature, they can easily
    be as wide as they are tall, so allow enough space to work around the tree for
    pruning and picking. If you get apple trees grafted onto the dwarfing M27 rootstock,
    these delightful little trees are easy to keep to 6 to 8 feet tall; they can be
    planted 3 to 4 feet apart to suit a small yard.


    # Grafted vs. Genetic Dwarf Fruit Trees


    Most dwarf trees are made by grafting tops from known varieties onto special dwarfing
    rootstocks, which constrains the tree from growing to full size, yet it produces
    normal-sized fruit. Genetic dwarf trees are not grafted to keep them small; they
    are just naturally very tiny trees. There are genetic dwarf varieties of peaches
    and nectarines, and also Meyer lemons. Most reach 3 to 6 feet high and are well-suited
    to growing in containers.


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_212_0.png)'
