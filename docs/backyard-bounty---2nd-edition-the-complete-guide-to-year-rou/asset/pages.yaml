  md: '# CHAPTER 5


    # Starting Seedlings and Saving Seeds


    This chapter covers how to start your own seedlings indoors for transplanting
    to the garden later. It also describes basic seed-saving methods for anyone interested
    in trying this rewarding aspect of gardening.


    # Starting Seedlings Indoors


    There are several reasons for starting vegetables several weeks to months before
    they can go out in the garden:


    +   - Heat-loving plants, such as tomatoes, peppers, winter squash, and cucumbers,
    take too long to ripen in the cool coastal climate. There really isn''t enough
    time to sow them directly in the garden and have much of a crop.

    - Some cool-season plants, such as leeks, Spanish onions, celery, and celeriac,
    also need an especially long growing season. These are usually started indoors
    in February to early March.

    - Summer varieties of cabbage, broccoli, and cauliflower are ready to harvest
    much earlier if they go into the garden as transplants.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '+   Plants with large starchy seeds (mainly peas and beans) are attractive
    to pests and prone to disease in cool soil. Pre-sprouting them indoors cuts down
    considerably on losses.


    The most compelling reason to start your own seedlings is to have the widest choice
    of varieties. If you are a tomato enthusiast, for example, there are many more
    varieties to choose from seeds as transplants. Given the high cost of seeds, however,
    if you only want one or two plants of many different tomato varieties, it might
    make more sense to buy plants, if you can get the kinds you want. Although most
    garden centers carry a large selection of tomatoes, they rarely have more than
    a couple of varieties of other crops. Some vegetables may only be labeled by the
    crop name (e.g., "leeks" or "celeriac"). Without knowing the variety, you won''t
    know which one to look for, or to avoid, the following year. This is particularly
    annoying for leeks because some varieties are much less cold-hardy than others.
    I hate to think of an unsuspecting gardener deprived of the joy of harvesting
    a fine fat leek in February!


    > Should You Start Your Own Seedlings?

    For beginning gardeners, I recommend starting off with transplants from garden
    centers or farmers markets (see Buying Transplants in Chapter 4 for what to look
    for). These local sources usually sell robust varieties known to do well in a
    range of conditions. While there are many reasons for growing your own transplants,
    to be successful, you have to provide good growing conditions and be prepared
    to give them daily care for five to ten weeks. This is definitely for the advanced
    class.'
