    Growing crops in permanent beds is popular in this region for good reason. Compared
    to a garden plot that is tilled from edge to edge every year, there are several
    advantages to permanent beds:


    +   - Once beds are laid out, pathways and growing areas don’t change the years.


    +   - Only planted areas need be be fertilized, watered, and weeded, which saves
    work and resources.


    +   - Soil in beds doesn’t become compacted, because you don’t walk on it.'
