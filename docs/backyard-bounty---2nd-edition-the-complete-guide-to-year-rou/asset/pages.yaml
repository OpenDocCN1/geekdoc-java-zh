    # Walnut Worries


    Trees in the walnut family contain a chemical called juglone that stunts or kills
    some other plants. Levels of juglone in most of these trees are low and not a
    problem, but levels in leaves, roots, and bark of black walnut and butternut are
    high enough to be toxic to tomatoes and other nightshades, some berries, and other
    plants. Juglone can also be high in leaves of English walnut that has been grafted
    onto black walnut rootstock. Juglone breaks down during composting, and a few
    walnut leaves mixed in lots of other leaves or materials in a compost bin is not
    a concern. If you have a lot of black walnut leaves to compost, though, mix them
    with other materials and hot compost for at least a month or cool compost it for
    a year before using.'
