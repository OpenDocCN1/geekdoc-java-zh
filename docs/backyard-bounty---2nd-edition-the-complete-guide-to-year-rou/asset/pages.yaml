    # Winter Vegetables in Containers


    Many hardy greens can be grown in containers over the winter: corn salad, winter
    lettuce, leaf mustards, Swiss chard, kales, and spinach are some that I''ve had
    success with. If you have warm-season crops in pots, you can undersow them with
    lettuce or corn salad in late August. By the time tomatoes or peppers finish producing,
    you will have a crop of greens started in the pots.


    As well as using frost-proof containers, it is a good idea to move containers
    to a more protected place than the open garden. In a container, roots experience
    colder conditions than they would growing in the ground, and they don''t tolerate
    as much cold as above-ground parts do. It is as if they were being grown two zones
    colder.


    For winter, move containers closer to a wall, house foundation, or other shelter.
    For greater protection, you can group containers together and insulate between
    the pots with leaves, plastic, straw, or other materials. Wrapping a band of burlap
    or plastic around the outside of the whole group of containers gives the roots
    even more protection from freezing.


