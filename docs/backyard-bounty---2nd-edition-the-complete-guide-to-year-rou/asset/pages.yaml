  md: '# About the Author


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_552_0.png)


    LINDA GILKESON is a keen organic gardener with a passion for insects and 30 years
    of gardening experience on the West Coast. After earning a Ph.D. in entomology,
    she worked as the research director of a biological control company and then for
    the British Columbia government coordinating programs to reduce pesticide use.
    She is the author of Year-Around Harvest: Winter Gardening on the Coast and West
    Gardening: Natural Insect, Weed and Disease Control. Linda is also a regular instructor
    in Master Gardener programs and is kept busy giving talks and workshops on organic
    gardening and pest management for community education programs, garden clubs and
    other groups. She currently lives on Salt Spring Island where she enjoys harvesting
    food from her garden all year round.'
  merge: -1
