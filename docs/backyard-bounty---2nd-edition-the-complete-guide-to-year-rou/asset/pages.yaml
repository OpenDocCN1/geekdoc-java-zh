    far, which are more prone to sending up watersprouts, and any branches pointing
    upward at a narrow angle with the trunk. Those make weak croches that are liable
    to break under a full load of fruit.


    > ### Two Techniques to Avoid

    Old gardening books advise cutting off branches flush with the trunk and applying
    pruning paint to the wounds. Research has shown that neither is good for the tree.
    We now know that cuts exactly flush with the trunk or disrupt the natural “wound
    collar” at the base of each branch. Wounds heal faster if cuts are made just slightly
    away from the trunk (see Figure 6.9), but not far away to leave a stub. Large
    wounds have been found to heal better when they are *not* covered with pruning
    paint. There is also less risk of sealing in disease organisms when the wound
    is left open to heal naturally.'
