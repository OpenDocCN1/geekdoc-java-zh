  md: 'No matter what type of soil you have, the one thing that improves most soils
    is the addition of organic matter: coarser compost improves aeration in clay soils;
    mature compost improves the moisture and nutrient-holding capacity of sandy soils.
    For all soils, the activity of microbes and the formation of humus from organic
    matter improve structure, hold carbon in the soil, and provide nutrients. Because
    organic matter is continually digested into humus, you need to add more every
    year.


    Sources of organic matter for urban gardeners:


    +   - **Homemade compost:** Use it when it has become dark, crumbly, and well-digested.
    The nutrient content will vary, depending on the ingredients.


    +   - **Commercial compost:** Several brands of composted fish and wood waste
    are made on Vancouver Island and in Washington State (see Resources). Some are
    certified for organic growers by OMRI (Organic Materials Review Institute). They
    are available bagged or in bulk quantities. There are also bagged mushroom, steer,
    and poultry manure composts (these are cheaper, and inferior in quality to the
