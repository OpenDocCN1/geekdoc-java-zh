    # Winter Harvest Notes


    Above-ground vegetables: The main thing to remember about harvesting above-ground
    vegetables is not to pick while plants are frozen (unless they are going immediately
    into a cooked dish). Wait until they thaw out in a warm spell. This applies to
    leafy greens as well as leeks, Brussels sprouts, and other cabbage family plants.
    It may take cabbages up to a week to thaw completely. If you harvest while plants
    are frozen, they thaw into mush, but they will be fine if you allow the plants
    to thaw out in the garden and take up water again before harvesting.


    To get the most from a bed of leafy greens, pick one or two outer leaves from
    every plant. This method of light overall harvesting allows each plant to retain
    the maximum leaf area to continue growth. Inner leaves are the hardiest, so continually
    using the outer leaves before they are damaged by frost ensures there is little
    waste over the season.


