    # When Crop Rotation is Important (and When It Isn''t)


    For diseases: Crop rotation may be the only method we have for controlling most
    root diseases, but it can be very effective. It works because plant pathogens
    are generally host specific, meaning they live and grow only on closely related
    plants. Allium pathogens, for example, grow only on onion family plants. If onions
    and garlic are grown in the same bed for several consecutive years, high numbers
    of infectious spores build up in the soil. If there is a gap of four or five years
    between onion family plantings, however, most of those dormant spores expire for
    lack of host plants.


