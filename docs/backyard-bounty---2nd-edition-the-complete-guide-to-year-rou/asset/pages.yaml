    # Water Conservation


    Ways to reduce the amount of water used for a garden and still get good harvests
    include:


    +   - Plant deeper where the depth of soil permits. Started plants (not seeds)
    of tomatoes, peppers, potatoes, and corn can be planted deeper than you might
    think, putting roots in contact with deeper moisture zone. Set good-sized plants
    in 6- to 12-inch-deep holes (a posthole digger is useful) or set out potatoes
    in trenches and fill the soil as the plants grow up. Tomatoes and potatoes will
    root all along the buried part of their stem; not a technique for a cool summer
    or in shallow soils, but it works well in hot, dry years.

    - Change plant spacing. If you have plenty of room for a garden, spacing plants
    widely (along with mulching well between them) allows a crop to grow with less
    water than might be taken up by high-density plantings.

    - Control weeds so they don''t compete for water. Immediately remove surplus crop
    plants or any plants their prime that you won''t be using so that you don''t waste
    water on them (they make mulch).

    - Plant fruit trees and berry shrubs in the fall. Roots do grow and become established
    over the winter; therefore they won''t need as much water in their first summer
    as they would if planted in the spring.


