    is very shallow, you can increase the depth and also improve drainage by building
    raised beds. If you have deep, well-drained soil, however, you might be better
    not building raised beds. Permanent, but not raised, beds usually need less water
    during the summer, and the root zone stays cooler in a heat wave.


