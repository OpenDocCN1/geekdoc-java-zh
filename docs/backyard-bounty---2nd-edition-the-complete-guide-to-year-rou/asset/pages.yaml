  md: '# Brussels Sprouts


    A much-maligned vegetable, possibly because few people have tasted the sweet nutty
    flavor that develops after they have been frosted out in the garden.


    **Culture:** Start seeds in late May to early June. Sow directly in the garden
    ½ inch (1 cm) deep or grow transplants in pots or in a nursery bed. Final spacing
    should be apart 1 to 2 feet (30 to 60 cm) because plants grow quite large. If
    started too early, the sprouts develop in late summer when aphids are more likely
    to damage them. If started too late, however, plants won’t have time to produce
    sprouts before winter. To hasten sprout development, snip out the top cluster
    of leaves in late September or early October. Stake plants in the fall to prevent
    stems from breaking in wind and snow.'
