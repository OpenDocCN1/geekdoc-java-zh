    # Strawberries


    Strawberries thrive in coastal gardens. There are two main types: June-bearing
    varieties and everbearing/day-neutral varieties that fruit from June to October.
    Although not exactly the same thing, everbearing and day-neutral strawberries
    behave similarly in coastal gardens to produce berries all season.


    **Culture:** Start a new bed with certified virus-free plants. For everbearing
    varieties, space plants 1 foot (30 cm) apart; space June bearers 18 inches (45
    cm) apart. The wider spacing accommodates the greater number of runners that develop
    on June-bearing varieties. Set plants with the crowns slightly above the soil
    line. Well-spaced plants in fertile soil can produce well for three years or more.
    However, beds usually become crowded and'
