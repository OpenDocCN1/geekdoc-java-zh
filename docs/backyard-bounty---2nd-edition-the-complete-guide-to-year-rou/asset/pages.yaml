    # Pruning Kiwi Fruit


    To grow fuzzy kiwi (the egg-sized, grocery store kind), you need both a male and
    a female plant. Male plants can be kept much smaller than the female, the two
    can be trellised together on a large trellis or separately, beside each other.
    The shape and size of the support can be much like that for grapes: sturdy, permanent,
    and shaped to fit whatever space you have.


    Hardy kiwi is a different species with smaller fruit (for more information, see
    Chapter 11); some varieties are self-fertile, so you only need one plant. They
    are less vigorous than fuzzy kiwi, but generally follow the same pruning pattern,
    described below:


    First year: Allow the vines to grow as tall as possible. The main stem of this
    new growth will eventually become the main trunk, so don’t let the vines wind
    around the post. It will really, really want to do this, keep it straight by tying
    it in place every foot or so it grows.


    Second year: Choose two or three well-spaced branches, which will become the main
    arms of the vine. Prune the rest. The arms will run along wires or crosspeices
    on the trellis. Keep them from wrapping the trellis wires by tying them straight.


    Third year and thereafter: At this point, pruning instructions for the male and
    female vines diverge:


    +   * Male vines: After the vines flower each year, you can cut the male plant
    back. Prune the flowering branches back to about 2 feet (60 cm) long and keep
    them pinched back if they become too long later. In the winter, continue to prune
    out crowded and tangled branches.'
