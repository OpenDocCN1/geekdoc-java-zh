    effect from dormant pruning. It slows tree growth because it removes leaf area
    and reduces the amount of food stored in the roots. For that rampant peach, this
    is exactly what is needed. How much you cut back the ends of branches depends
    on how tightly you need to control the tree’s size to fit the space, but generally
    you can prune back half the length of branches. This is the time to remove crossed
    and poorly angled or weak branches if it wasn''t done in the winter. In apples
    and pears, summer pruning can force leaf buds to convert to flower buds next year,
    increasing future fruit production.


