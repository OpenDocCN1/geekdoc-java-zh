    **Culture:** When the soil is warm enough for the type of corn you want to plant
    (see Table 10.1), sow two seeds in each spot or hill, 8 to 12 inches (20 to 30
    cm) apart. Thin to one plant in each spot. Screen seedbeds to prevent birds from
    digging up the seeds. Early plantings are much more successful if seeds are started
    indoors in late April/early May in small individual pots; transplant to the garden,
    when seedlings are three weeks old and space them 8 to 12 inches (20 to 30 cm)
    apart. To avoid having all ears ripe at once, plant successive crops of early
    varieties three weeks apart until mid-June, or sow compatible early and midseason
    varieties at the same time. Don’t remove the side shoots that sprout at the base
    of the plants (corn needs those leaves for maximum photosynthesis). Ensure plants
    are kept well-irrigated: ears of drought-stressed corn can be weirdly distorted.


    Plants are wind-pollinated: the male “tassels” at the top of the plants shed pollen
    onto the silks that come out of the tip of the ears (female part of the plant).
    For good pollination, grow corn in dense blocks rather than rows to ensure enough
    pollen falls onto silks.'
