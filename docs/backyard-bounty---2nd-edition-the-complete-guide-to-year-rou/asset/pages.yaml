    **Soil structure:** In an ideal soil (regard of texture), the tiny particles are
    clumped together in larger "crumbs" with stable air spaces between them. Well-aggregated
    soil, with pores of various sizes, looks like a cross-section through a piece
    of chocolate cake. The soil structure dictates how quickly water drains through
    the soil, how rapidly oxygen gets in and carbon dioxide gets out roots and soil
    organisms breathe. Humus, the dark brownish residue of decomposed organic matter,
    coats soil particles and sticks them together. Soil particles are also stuck together
    by the activity of earthworms, by gums and glues made by bacteria, fungi, and
    plant roots. The structure of all soils, especially clay soils, improves as organic
    matter and the activity of soil organisms increases.


    You can destroy soil structure by walking (or driving!) on the soil, which crushes
    the air spaces, and by careless cultivation. Rototilling, for example, dashes
    apart the crumb structure and can be especially destructive. As the air spaces
    collapse, the soil becomes compacted, which slows drainage and the movement of
    air. Cultivating of any kind while soil is too wet also destroys the structure,
    particularly in soils with a high proportion of clay. When soils dry out, there
    are often rock-hard clods to contend with, or you may be left with a hard crust
    on the surface. Pounding winter rain is another force that destroys soil structure.
    Luckily, the best ways to improve soil structure are also the least work: don''t
    walk on the garden beds, minimize cultivation, and protect the soil with mulch.


    # Soil Organisms


    A healthy soil has a rich community of organisms ranging from microscopic bacteria
    to the much larger insects and earthworms. These'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'essential partners make nutrients available to plants and perform many other
    functions that maintain plant health. Without these, plants could not get enough
    nutrients or defend themselves against pathogens. Just as we have an enormous
    community of microbes in and on our bodies, called our microbiome, the same thing
    applies to plants. They rely so much on microbes that you could consider a plant
    plus its microbiome as one big functioning organism.


    You won''t be able to see the smallest microbes, but they are there and thriving
    if conditions are right. For most, this means good drainage, organic matter for
    food, and soil that is not too acid or too alkaline (these are all discussed below).
    Most organisms live in the top 4 inches (10 cm) of soil, and nearly all within
    the top 10 inches (25 cm), where most feeder roots of plants, including trees,
    are also found.


    I think one of the most interesting discoveries in recent years has been how much
    energy plants use to feed bacteria, fungi, and other microbes in the soil. It
    is estimated that over 20% (and possibly much more) of the carbohydrates plants
    make through photosynthesis leak their roots into the soil. Bacteria feed on this
    rich food source, and their numbers are hundreds to thousands of times higher
    in the root zone in soil without roots—and that''s a good thing! They make nutrients
    available and actively protect roots from disease, by forming a barrier to block
    invaders and by producing antibiotics that kill pathogens. Bacteria and other
    microbes help plants regulate root development, adapt to poor growing conditions,
    and even (amazing!) plants resist feeding by leaf-eating insects.


    Fungi are also essential plant partners involved in every aspect of decomposition
    and nutrient cycles in the soil. Within their filaments (called hyphae) they move
    water and nutrients throughout the soil. Some, the mycorrhizal fungi, actually
    penetrate into roots or form a net of fungal strands around root tips and are
    especially important in making phosphorus available to trees, shrubs, and other
    plants. Their hyphae radiate out'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'each fine root in a wide network, in effect giving each root its own fungal
    “root” system. This allows a plant to receive nutrients and water from a much
    larger volume of soil than it could reach with its roots. The fungi receive carbohydrates
    from the plant in exchange for shuttling nitrogen, phosphorus, and other elements
    into its roots. Oddly, plants in the mustard/cabbage and amaranth/spinach families
    don''t seem to have mycorrhizal associations.


    There are myriad soil organisms (e.g., actinomycetes, protozoa, nematodes, mites,
    insects) linked together in a network of eating, being eaten, and interacting
    with plant roots. For example, single-cel organisms called protozoa are the main
    predators of bacteria (protozoa also fungi). Because bacteria have more nitrogen
    in them than any other living thing, when protozoa consume them, they excrete
    excess nitrogen. This is in a form plants can use, protozoa “poop” a key source
    of nitrogen. Protozoa are also the main diet of earthworms; therefore, a soil
    rich in bacteria feeds lots of protozoa, which in turn feeds lots of earthworms,
    who in turn enrich the soil as they burrow. Along soil insects, earthworms start
    the process of decomposition by shredding fresh plant material and pulling it
    into the soil. As the plant material is shredded into finer pieces, a succession
    of fungi move in, digesting the tougher components and making it more digestible
    for bacteria. Bacteria continue chopping the molecules into ever-smaller bits,
    and protozoa thrive on eating the bacteria. The fertility of the soil increases
    year after year as these processes make more nutrients available to plants.'
