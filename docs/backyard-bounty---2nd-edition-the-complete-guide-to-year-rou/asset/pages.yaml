  md: '# The Nitrogen Cycle


    Nitrogen exists in different forms in the environment—in fact, air is 79% nitrogen.
    Microorganisms in the soil are a vital part of the natural processes that move
    nitrogen in a cycle through the environment. Some kinds of soil bacteria combine
    nitrogen from the atmosphere with hydrogen and oxygen, "fixing" it into a form
    that plants can use. Other microbes, mostly soil bacteria and fungi and their
    predators, make nitrogen from organic matter available to plants.


    Soluble nitrogen is readily leached out of the soil by heavy rain. It pollutes
    water bodies when it washes out of the soil or from uncovered compost or manure
    piles. In waterlogged conditions (called anaerobic conditions because of the lack
    of oxygen), some microorganisms convert nitrogen from the form plants can use
    into a gaseous form that is lost to the atmosphere. You could look at a sodden,
    compacted compost pile as a tragic waste of plant food. Nitrogen in the form of
    ammonia is also released to the air by soil bacteria in very alkaline conditions
    (which is why you shouldn''t put lime or wood ashes in the compost pile.


    Phosphorus sources: Although soils generally contain lots of phosphorus, most
    isn''t in a form plants can use; therefore, we usually need to add some fertilizer
    containing phosphorus to make sure enough is available to crops. It is important
    not to overfertilize with phosphorus amendments, however, because excess phosphorus
    interferes with the uptake of other nutrients, such as iron, zinc, and manganese.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Bone meal is one readily available source of phosphorus for organic gardens.
    Application rates for bone meal are usually given as 10 pounds per 100 square
    feet (4 to 5 kg per 10 m²). That''s quite a lot, so I use half that on new garden
    beds. Rock phosphate (a rock dust), another source used by organic growers, releases
    very little phosphorus in the first year, as it is a long-term, slow-release source.


    Adding fertilizers containing high proportions of phosphorus after year is not
    necessary and can impair plant growth if phosphorus levels get too high. Instead,
    focus on maintaining soil pH between 6.0 and 7.0 and on increasing the organic
    matter to feed the soil microbes that make phosphorus available to plants. If
    a soil test shows excessive phosphorus levels, stop adding amendments containing
    phosphorus, but continue with nitrogen-rich amendments and eventually the phosphorus
    levels will drop.


    Phosphorus-deficient plants are stunted, have less fruit than they should, and
    often have purplish streaks or patches on the undersides of leaves, but such symptoms
    can also be due to deficiencies caused by excess phosphorus. Both deficiency and
    excess can be avoided by relying on compost to enrich garden soil and the judicious
    use of balance organic fertilizers. To avoid overuse of phosphorus, some sources
    recommend against using complete fertilizers that provide a higher proportion
    of available phosphorus than nitrogen. Alfalfa meal, which has an N-P-K analysis
    of 2.5-1-1, is an example of an amendment with a good ratio; as are commercial
    organic products with a 4-4-4 ratio (e.g., Gaia Green Purpose Fertilizer).


    **Potassium sources:** Langbeinite (potassium magnesium sulfate) is a mined mineral
    included in some organic fertilizers to supply potassium, magnesium, and sulfur.
    Greensand (a type of rock mineral) is also used as an ingredient in complete organic
    fertilizers to supply potassium.'
