    soil off cured squash, and store them in cool (60°F/15°C) dry conditions. Most
    keep at least three months and some for nine months or more. Some people wipe
    the skins with bleach solution (1 part hydrogen peroxide bleach to 9 parts water)
    before storing them, but I haven''t found this necessary. Banana and acorn squash
