  md: '**What to look for:** Dimples show in the skin of infested fruit. The maggots
    are usually discovered when fruit is cut open and their thin brown tunnels are
    visible in the flesh of the apple. Infested fruit quickly rots and becomes unusable.


    **Biology:** Adult flies emerge from the soil in early summer. Females lay eggs
    beneath the skin of apples, crabapples, hawthorn fruits (and sometimes plum and
    cherry) from July to early October. Eggs hatch in a week, and the maggots tunnel
    into the flesh of fruit. Mature larvae feed for two to four weeks, then leave
    the fruit to pupate in the soil, where they also overwinter. There is one generation
    per year.


    **Management:** Always comply with local quarantines for this pest: it is illegal
    to carry backyard or non-commercial tree fruit into apple maggot-free areas of
    British Columbia, eastern and central Washington, and Oregon. Collect and destroy
    dropped apples every few days to prevent maggots in the apples from exiting to
    pupate in the soil. Place infested fruit in a sealed plastic bag and dispose of
    it or freeze the fruit to kill the maggots, then bury or compost it. Remove and
    destroy fruit from unmanaged or wild trees before August, including apple, crabapple,
    and hawthorn (better yet, remove unmanaged trees).


    Bagging apples or dwarf trees with insect netting (See Barriers, p. 218) is a
    effective way to prevent apple maggot damage. Remove and destroy any unprotected
    fruit outside the barriers. Sprays of kaolin clay (e.g., Surround at Home®) leave
    a barrier of fine white dust on fruit and leaves, which repels apple maggot adults
    from laying eggs. It is non-toxic, but there is a white residue that has to be
    washed off after harvest. Pyrethrins and spinosad sprays can be used by organic
