  md: '# Pruning and Training Figs


    Figs are very different from the other fruit trees described above: they are self-fertile
    with closed fruit (no flowers are visible) so that no fertilization needs to be
    done by pollinators. The fruit develops singly so there is no need for thinning.
    Pruning Figs figs in the PNW also differs from how it is done in hot climates
    and from how others of fruit trees are pruned.


    Figs produce two crops of fruit per year, but only the first (called the breba
    crop) ripens in the PNW (in hot regions, the second crop is considered the main
    crop). Pruning has to be done in such a way to maximize the breba crop, which
    is produced on the new growth from last summer. This means not cutting back the
    ends of branches while the tree is dormant. The trees still need to be pruned,
    however, otherwise they become huge trees with unreachable fruit.


    Start shaping the tree at planting time by cutting the main trunk back to the
    height you want the first branches to form. If desired, you can cut it back to
    a foot above the ground to force branches to start so low that it grows as a bush.
    Later in the summer, after new branches have sprouted, decide which three or four
    branches are best placed and strongest. Keep these for the main framework and
    remove the others. If the young tree already has branches when you bought it,
    you can still cut back the trunk, or you can leave the existing branches to become
    the first set of main branches.'
