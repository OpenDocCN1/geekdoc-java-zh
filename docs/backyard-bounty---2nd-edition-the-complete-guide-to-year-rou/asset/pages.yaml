  md: 'Good air circulation over the surface is essential, so do not cover the seed
    trays with those plastic covers that often come with the bottom-heat units. After
    the seeds sprout, move the trays to cooler, bright conditions. The best temperature
    for growth is 60° to 68°F (16° to 20°C), which is about 10 degrees lower than
    germination temperatures.


    **Moisture:** The soil should be moist, but not wet. Many seeds can germinate
    in barely damp soil because they are able to take up enough water from the humid
    air between soil particles (corn, cabbage family, and squash family seeds do this).
    More people go overwatering rather than with underwatering seeds. They often lose
    their seedlings to damping off, which thrives in wet soil.


    So, water seeds sparsely. I soak the soil mix before sowing seeds and then don''t
    usually have to water for a couple of days. When the surface starts to dry out,
    water trays from the bottom by setting them in a shallow pan of water for a short
    time (ten minutes or so). Don’t leave them so long that the soil surface becomes
    waterlogged.


    Once the seedlings are a couple of inches tall, they take up water at an increasing
    rate and should be checked daily. It is fine to water sturdy well- seedlings from
    above because they are past the high-risk stage for damping off. If the soil is
    allowed to dry out, it kills fine root hairs and stunts future growth, but you
    don’t want the roots to sit in waterlogged soil either.


    **Containers:** You can use any kind of clean container for seedlings: egg cartons,
    milk cartons, cottage containers, fast food clamshells, etc. Just be sure to punch
    two or three holes in the bottom to allow water to drain.'
