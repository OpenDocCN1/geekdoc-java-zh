  md: '# # A Guide to Responsible Digital Reading


    Most readers understand that buying a book printed on 100% recycled, ancient-forest
    friendly paper is a more environmentally responsible choice than buying one printed
    on paper made from virgin timber or old-growth forests. In the same way, the choices
    we make about our electronic devices can help minimize the environmental impact
    of our e-reading.


    # ## Issues and Resources


    Before your next electronic purchase, find out which companies have the best ratings
    in terms of environmental and social responsibility. Have the human rights of
    workers been respected in the manufacture of your device or in the sourcing of
    raw materials? What are the environmental standards of the countries where your
    electronics or their components are produced? Are the minerals used in your smartphone,
    tablet or e-reader conflict-free? Here are some resources to help you learn more:


    +   - The Greenpeace Guide to Greener Electronics

    - Conflict Minerals: Raise Hope for the Congo

    - Slavery Footprint


    # ## Recycle Old Electronics Responsibly


    According to United Nations Environment Programme some 20 to 50 million metric
    tonnes of e-waste are generated worldwide every year, comprising more than 5%
    of all municipal solid waste. Toxic chemicals in'
  merge: -1
  pgno: 554
- img_proc: true
  md: 'electronics, such as lead, cadium and mercury, can leach into the land over
    time or can be released into the atmosphere, impacting nearby communities and
    the environment. The links below will help you to recycle your electronic devices
    responsibly.


    +   * Electronics Take Back

    * Canada - Recycle My Electronics

    * United States - E-cycling central


    Of course, the greenest option is to keep your device going as long as possible.
    If you decide to upgrade, please give some thought to passing your old one along
    for someone else to use.'
