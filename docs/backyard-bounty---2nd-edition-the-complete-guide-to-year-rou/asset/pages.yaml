    # Other Barriers and Repellents


    Motion-activated animal repellents: These devices have motion sensors that trigger
    a short but startling jet of water that works quite well to frighten animals.
    The ScareCrow® device has been on the market for many years (for products, see
    Resources). It is battery powered and connects to a hose; it only shoots a cup
    or two of water at a time, the only tap has to be turned on. The Spray Away® device
    has a solar-powered sensor and contains a water reservoir. For the greatest startle
    effect, point the startling device where the jet of water can hit, as this amplifies
    the noise. This is effective for scaring away raccoons when fruit trees or grapes
    are ripening and deterring cats from using garden beds as litter boxes. Animals
    get used to them if they are always in the same place, though to keep up the element
    of surprise by moving the device to different places every few days. Some dogs
    find it hilarious to run back and forth on the water, so you might want to turn
    it off the day.


    Netting: Many mesh or netting products are sold for covering vegetables and fruit.
    Plastic meshes are lightweight and most useful to keep out birds. But the lightest
    and cheapest mesh will make you with frustration as it tangles and snags on everything.
    Stiffer plastic mesh is easier to mount on stakes or lay over beds of strawberries
    without tangling, but it has to be pinned down or weighted along the edges to
    keep animals from getting under it.'
