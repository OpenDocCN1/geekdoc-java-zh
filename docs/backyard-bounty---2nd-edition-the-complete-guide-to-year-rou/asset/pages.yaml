  md: '# ABOUT NEW SOCIETY PUBLISHERS


    New Society Publishers is an activist, solutions-oriented publisher focused on
    publishing books for a world of change. Our books offer tips, tools, and insights
    from leading experts in sustainable building, homesteading, climate change, environment,
    conscientious commerce, renewable energy, and more—positive solutions for troubled
    times.


    We’re proud to hold to the highest environmental and social standards of any publisher
    in North America. This is why some of our books might cost a little more. We think
    it’s worth it!


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_556_0.png)


    +   * We print all our books in North America, never overseas


    +   * All our books are printed on 100% post-consumer recycled paper, processed
    chlorine-free, with low-VOC vegetable-based inks (since 2002)


    +   * Our corporate structure is an innovative employee shareholder agreement,
    so we’re one-third employee-owned (since 2015)


    +   * We’re carbon-neutral (since 2006)


    +   * We’re certified as a B Corporation (since 2016)


    At New Society Publishers, we care deeply about what we publish—but also about
    how we do business.'
