  md: 'Watering: Soil in a deep bed stays moist for months in the winter, but does
    have to be watered occasionally. Once the brighter and longer days of February
    arrive, plants grow more rapidly and start to take up more water from the soil.
    In the summer, watering may be required daily because plants really suck up a
    lot of water in hot conditions.


    Cold protection: Crops in an unheated greenhouse will not have the benefit of
    snow cover to insulate them in a cold snap. Ironically, in the coldest weather,
    they may need more protection than plants growing outdoors that are covered with
    snow. Keep plastic sheets, all blankets, or tarps handy to throw over the beds
    at night to protect plants if temperatures threaten to go below 23°F (-5°C). It
    won''t be appreciably warmer inside an unheated greenhouse over a long winter
    night than it is outside.


    Keeping the space filled: The joy of a greenhouse in this climate is a longer
    harvest of heat-loving vegetables. While tomatoes and cucumbers produce pretty
    well outdoors in many coastal gardens, you can start picking them earlier and
    over a longer season in a greenhouse. Other crops that thrive in greenhouses include
    peppers, sweet basil, melons, and long English cucumbers and sweet potatoes (yams).
    Given their high heat requirements, you have a much better chance of harvesting
    large-fruited eggplants or watermelon if they are in a greenhouse (or a tunnel).


    But this is only half of the equation: the other joy of having a greenhouse is
    that you can fill it with cool-season vegetables for the rest of the year. Unheated
    greenhouses are excellent for growing leafy greens (as opposed to root crops,
    which are better off outdoors, under mulch). I keep my small unheated greenhouse
