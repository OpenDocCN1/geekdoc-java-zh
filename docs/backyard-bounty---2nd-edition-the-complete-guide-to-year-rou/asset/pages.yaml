    drying indoors, then shell them.


    # Beets


    Beets are two crops in one because the leaves are also delicious. Beets are very
    sensitive to acidic soil, so if you have trouble growing beets, your pH may be
    too low.


    Culture: Seed ½ to 1 inch (1 to 2 cm) deep. Each “seed” is a dried fruit containing
    several seeds, so plants must be thinned; space seedling 2½ to 3 inches (6 to
    8 cm) apart. For a steady supply of baby beets, successive plantings monthly,
    starting when soil temperature is over 50°F (10°C), usually mid to late April.
    For winter harvests, sow beets in early July; soil must be very well-drained for
    good winter survival.


    Harvest and storage: Roots and leaves are edible any size with thinnings. For
    most varieties, the best quality roots are up to 2½ to 3 inches (6 to 8 cm) in
    diameter. Leave beets in the garden over the winter, mulched, and dig them as
    needed.


    Pests: Spinach leafminer. Varieties susceptible to Cercospora leaf spot show circular
    spots on leaves in wet weather, but the roots are not affected.


    Varieties: Dark red, round beets: Detroit Dark Red, Detroit Supreme, and related
    open-pollinated varieties are the gold standard for quality (in my humble opinon!);
    Early Wonder, Red Ace F1 are also very reliable.'
