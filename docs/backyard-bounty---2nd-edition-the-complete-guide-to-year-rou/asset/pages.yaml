    # Our Soils Need Lime


    Many soils on the West Coast are naturally acidic, though not all. Acidity is

    measured in terms of pH (which stands for potential of hydrogen, but don''t

    ask, it is very complicated). A pH of 7 is neutral; lower numbers indicate

    acidic soil, and higher numbers show the soil is alkaline. Most crop plants

    grow best at a pH of 6.5 to 6.8, which is slightly acidic. The pH of the soil

    is a factor determining the community of beneficial bacteria present.

    Although fungi do thrive over a wide range of pH, most bacteria, including

    those that capture nitrogen in legume roots, thrive in soils with a pH closer

    to neutral.


    In the high-rainfall regions of the coast, most soils have a natural pH of

    5.0 to 5.5. Soils in parts of the region that are in the driest rain shadows of

    theOlympics and Vancouver Island mountains are less acidic and may not

    need much, if any, lime to raise the pH. If you don''t know anything about

    the soil you plan to use for a garden, it is a good idea to have the soil pH

    tested (see below).'
