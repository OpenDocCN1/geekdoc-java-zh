    # Exclusion Fences for Root Flies


    Most adult cabbage maggot or carrot rust flies fly less than a yard above the
    ground, so a large proportion of them can be kept from reaching a crop by installing
    a mesh fence as a barrier. Although not as effective as covering beds with insect
    netting or floating row covers, exclusion fences can give adequate control for
    a home garden in areas where root fly populations are not high to start with.
    String a 40-inch-tall (1 m) fence of window window screen around the vegetable
    bed, with the bottom edge buried in the soil. Support the fence on stakes and
    allow the top 12 inches (30 cm) of the screening to fold and extend outward, away
    from the growing bed, to make a wide overhang. When the flies reach the fence
    and fly upwards, the overhang helps deflect them from flying over the top and
    into the bed. Exclusion fences do allow some flies to get into the crop (it is
    thought they crawl over them). Fewer carrot rust flies appear to be deflected
    by such fences than species that attack onions or cabbage.


