  md: 'There are two essential rules for using all of these exclusion tools successfully:


    +   - Put barriers in place before the pests show up.


    +   - Ensure there are no gaps that could allow insects to get through the barrier.


    # Insect Netting


    Insect netting products are sturdy, knitted, or woven high-density polyethylene
    mono-filament fabric designed to keep out insects while letting in over 90% of
    sunlight. They are sold in different widths and sizes of mesh for different pests.
    The netting is UV stabilized, and depending on the product, most are guaranteed
    to last seven to ten years. The fabrics let in rain and irrigation water so covers
    can stay in place until the attack period is over or the crop has been harvested.
    Although sheer curtain materials and mosquito netting look similar, they don''t
    let in enough light for plant growth. Such materials could be used briefly, but
    for no more than two or three weeks.'
