    # **The Lives of Insects**


    All insects start as an egg, which hatches into an immature insect called a *larva*
    (plural: larvae). When a larva grows to full size, it molts and becomes a *pupa*.
    Pupae are immobile and most look like oval brown cases, often protected by a cocoon
    of silk. Inside the pupa, the larva transforms into an adult insect, which eventually
    emerges and flies away. A familiar example is a caterpillar, which spins a chrysalis
    (a silk cover to protect the pupa) and changes into a butterfly inside. A complete
    life cycle can take a week (fruit flies) to several years (wireworms). Other'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'terms are also used for larvae: caterpillars (larvae of butterflies and moths),
    maggots (flies), and grubs (beetles, wasps, bees).


    A minority of insects, such as aphids, stink bugs, and earwigs, develop gradually
    without going through a pupa stage. Their larvae (also called nymphs), look more
    like an adult each time they moult. After the last last, they are mature adults
    with reproductive organs and usually wings.


    All insects have some development stage (often egg or pupa) adapted to survive
    winter.


    For most beneficial insects, it is only the larvae (immature stage) that eat other
    insects. The adults sip nectar or feed on pollen. But when the adults have pollen
    and nectar to eat, they stick around, live longer, and the females lay more eggs.
    When these eggs hatch, the predatory larvae attack your pests. You can lure the
    parents of these hungry juveniles into your garden by growing flowers to attract
    them.'
