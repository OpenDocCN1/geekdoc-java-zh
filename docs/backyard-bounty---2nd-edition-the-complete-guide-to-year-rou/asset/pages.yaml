    > # The Marvel of Germination


    Each seed has its own food supply inside its protective coat. When seeds are exposed
    to moisture and warmth (and in some cases, light), they germinate, meaning that
    they start to grow. The tiny developing plant uses the food stored in the seed
    as its energy supply. Only when it has pushed down a root and the shoot has opened
    its first leaves to the sun can the plant start making a new food supply through
    photosynthesis.


    Watering: Once the seeds are planted, keep the soil damp, but not soaking wet.
    Seeds take up moisture from the soil and from the humid air between soil particles
    so as long as the soil surface isn’t allowed to dry completely,'
