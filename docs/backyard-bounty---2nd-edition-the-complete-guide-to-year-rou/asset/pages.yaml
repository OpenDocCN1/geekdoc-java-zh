  md: 'With sweet, juicy, and colorful fruit, plum trees are productive and usually
    reliable croppers. There are two main groups: European plums, which are oval with
    very sweet flesh and sweet skins, and Japanese plums, which are larger and rounder
    with tart skins.


    **Culture:** Many, but not all, plum varieties are self-fertile and can provide
    a good crop with one tree; multi-graft trees are also available. Mature trees
    may set quite a lot of fruit in years with warm, dry weather during pollination.
    After the June drop, thin fruit to 2–3 inches (5–8 cm) apart.


    **Pruning:** Dwarf plums can be kept to 8 to 9 feet (2 to 3 m) high. Once tree
    shape is established, European plums don’t need much pruning beyond removing crowded
    branches. Japanese plums put on a lof of shoot growth each season, so keep the
    vertical shoots pruned in the summer.


    **Pollination:** European plums generally bloom later than Japanese plums, which
    gives them a better chance of being pollinated in cool coastal spring weather.
    Some plum varieties require crosspollination from a different variety; others
    are self-fertile, but cross pollination improves fruit set in all. European varieties
    mostly bloom close enough in time to pollinate each other, but not early enough
    to pollinate Japanese plums.


    **Harvest and storage:** Enjoy tree-ripened fruit immediately; plums picked before
    they are completely ripe in the refrigerator for over a month. For longer storage,
    they can be frozen, canned, or dried.


    **Pests:** Aphids; brown rot; black knot is a fungus disease that causes rough,
    elongated tumours on branches.


    **Varieties:** Examples of European plums (all self-fertile): Opal, Victoria,
    Stanley (very susceptible to black knot), Italian Prune (Fellenberg), Damson.
    Japanese plums (all self-fertile): Santa Rosa, Golden Nectar, Shiro. There are
