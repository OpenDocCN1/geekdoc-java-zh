    # Managing Soil Fertility Year-Round


    Managing the soil for all-season harvests in my garden means being generous once
    a when adding compost. After that, successive plantings and inter-plantings usually
    don''t require more amendments.


    With a year-round planting schedule, the main addition of amendments happens whenever
    the bed is completely empty between early spring and late summer. At that time,
    I turn in as much compost as I have (aiming for an inch-thick layer), plus complete
    organic fertilizer and the annual allotment of lime, if needed.


    I don''t usually adding anything more for the next crop unless the previous plants
    didn''t grow as well as expected. However, for hardy leafy greens for winter,
