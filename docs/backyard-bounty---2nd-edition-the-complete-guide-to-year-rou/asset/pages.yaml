    # Watering


    Irrigation is a big challenge for container gardeners because plants use the water
    so quickly in warm weather. The root zone is warmer in the summer than it would
    be for in-ground plants; therefore, the plants trans more water. Containers often
    need water every day in the summer, and when it is hot, could easily need watering
    twice a day. Watering is critical for container plants: a day or two of neglect
    can kill them.


    Think about the easiest way to get water to the containers so that it won’t be
    neglected. Watering by hand is fine, of course, but someone has to'
