    # Make a Monitoring Trap for SWD


    To make a simple trap that shows when and how many flies are present, punch or
    cut six to eight small holes (¼/0.5 in) around the rim of a 16-ounce (0.5 L) plastic
    cottage cheese or deli container. Pour about 1 inch of apple cider vinegar into
    the container, snap on the lid, and set the trap in the garden (adding a little
    rice vinegar or merlot wine may improve catches, but are not required). Don’t
    bother with recently recommended yeast baits: I found them smelly to deal with
    and no more effective than vinegar.


    For monitoring, you only need one trap (in future, better baits may make it possible
    to control SWD with mass trapping). Start monitoring in June, checking the trap
    at least weekly. Replace the vinegar every week or two. Male SWD floating in the
    vinegar are easy to identify by the single dark spot on each wing. When you see
    them, you can assume the fruit flies without spots are female SWD (hardly any
    “compost”) fruit flies get caught in the vinegar trap. Record the date the first
    SWD are caught, and use that to install fruit covers before that date next year.
