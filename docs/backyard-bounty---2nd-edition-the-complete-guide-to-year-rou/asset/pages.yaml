  md: 'be there to do the watering. Gardeners with a lot of containers often end up
    looking into automatic drip irrigation systems to ease the chore of frequent watering.


    **Watering spikes:** The simplest “automatic” system is a perforated plastic spike
    that fits into the neck of a large plastic soft drink bottle. Fill the bottle
    with water, screw on the plant spike, and push the spike into the soil beside
    the plant. This releases a slow trickle of water to the roots. If you cut the
    bottom off the bottle so that it sits like a funnel beside the plant, it is really
    easy to refill. Plastic bottles or gallon jugs with the bottoms cut off can be
    used the same way, without the plant spikes, but use sticks to prop them upright
    or bury them deep in the soil. Leave the lid on and unscrew it enough to allow
    a trickle of water. There are also ornamental versions of this kind of watering
    device that are nicer to look at.


    **Automatic drip systems:** Installing a drip irrigation system that runs on a
    timer takes a lot of work out of watering. These give good results because the
    plants will be watered regularly, whether or not you are there to do it.


    Inexpensive manual timers are available that you install between the tap and the
    hose of the watering system. Even a manual timer will reduce your watering work
    load considerably. More fully automated systems are also available.


    For small pots, a single dropper may be enough, but it is a good idea to put a
    flat stone under the dripper to help the water spread out. If the irrigation system
    will take the “shrubbler” type of fitting, these do a better job of watering evenly.
    Even these give five gentle streams of water from the single fitting. It is easy
    to adjust the distance they sprinkle by turning the top of the fitting. You will
    need to experiment with how long to run a dripper/shrubbler watering system. It
    will usually take less than ten minutes and possibly as little as two to five
    minutes to deliver sufficient water to pots.'
