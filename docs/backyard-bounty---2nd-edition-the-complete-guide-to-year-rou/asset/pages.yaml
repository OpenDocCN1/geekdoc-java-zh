    # Do You Need Compost Starter?


    Nope. There are plenty of native bacteria already on the materials you compost.
    Researchers say that not only are commercial “activators” unnecessary, but the
    native bacteria from your own soil are likely to be better adapted to your garden
    conditions than bacteria grown in a laboratory. If you want to inoculate a new
    compost pile, sprinkle a little finished compost or a shovel of garden soil into
    the materials as you build the pile.


    # Using Compost


    Regardless of how it was made, compost is finished when the material is dark and
    crumbly and has an earthy smell. The greater variety of starting materials, the
    more variety of nutrients there will be in the finished product. Composted straw
    and manure typically have more nitrogen than composted leaves. Generally, homemade
    compost is considered to have about 0.5% to 1% available nitrogen, but it depends
    on ingredients and whether the pile was protected from rain to prevent nutrients
    from leaching away.


