  md: '# Buying Transplants


    Whether you buy all of your transplants or just a few to supplement what you start
    from seed, here are some guidelines:


    +   - Choose small young plants rather than larger plants, which may have been
    in pots too long.

    - Avoid plants that appear old, root-bound, or spindly, especially those that
    have been held on shelves without enough light. Roots sticking out of the pot’s
    drainage holes indicate the plant is becoming root-bound.

    - Avoid plants with yellowish leaves or purplish or brown streaks on the leaves.
    No seedlings should have discolored lower leaves, indicating they are suffering
    from nutrient deficiency or other stress.

    - Check for insect pests and disease; don’t take home anything that looks suspicious.


    A good tip for getting the best quality is to find out when your local nursery
    expects new plants to arrive (it is usually weekly); buy your plants the day they
    are put for sale, and plant immediately if the weather is suitable. If you buy
