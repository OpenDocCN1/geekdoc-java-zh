  md: 'Methods based on a “hands-off” approach are healthiest for the soil: “no till,”
    minimum tillage, deep mulching, and permaculture are examples.


    We now know that the more you cultivate soil, the more harm it can do to its community
    of organisms and structure. The greatest variety and number of soil microbes and
    larger organisms, such as worms and insects, live in the top few inches where
    there is the most organic matter, warmer conditions, and air circulation. Cultivating
    methods that bury deeper, such as using a shovel to dig deep and turn over the
    soil, are detrimental to this community. Some gardeners advocate annual deep digging
    (or worse, double digging), but that’s hard on the soil community. It is also
    a ridiculous amount of hard work! Instead, just stir the surface layers enough
    to mix in compost, organic fertilizers, or other amendments.


    Vegetables and fruit can grow under different systems, but some techniques are
    better suited to the coastal climate or are more appropriate for small gardens
    than others. Having farmed and garnered over the years on a variety of soils in
    different climates, I have arrived at the same conclusion as many people before
    me: minimizing cultivation protects the soil, is a lot less work, and gives excellent
    results.


    The point of cultivating is to mix in compost and other amendments, control weeds,
    and prepare a bed for planting. Cultivation also loosens and aerates soil in the
    root zone, but how important this depends on your soil type and its level of organic
    matter. The objective in preparing a seedbed is a reasonably level soil surface
    of large clods or stones. For transplants, the soil surface can be quite rough.
    In fact, there is no need to cultivate at all if you are transplanting a second
    crop into a bed that has already received enough amendments for the year. Just
    open a hole for the transplants and put them in (see Figure 3.4).


    # Does Soil Have to Be Cultivated?'
