    # Coffee Grounds


    Don''t overlook the value of coffee grounds, a significant compost ingredient
    in some households. Since grounds aren''t attractive to rats, they don''t have
    to go into a rat-proof composter as for other kitchen waste. They are a good source
    of nitrogen and decompose readily (earthworms seem to like them). If you have
    large quantities, layer the grounds with other ingredients in a compost pile.
    In small amounts, they can be mixed directly into the soil or sprinkled lightly
    on the surface. Just don''t use a lot in the same place; thick layers may temporarily
    inhibit the growth of some plants until the grounds have decomposed.


    Composting don''ts: Things *not* to put in a compost pile include pet poop, dairy
    products, meat, bones, fat, and oil. Starchy or sweet kitchen scraps attract rats
    to open bins, but can be composted in rat-proof composters. Don''t put wood ashes
    or lime into the compost pile either. It makes the compost alkaline, which allows
    microbes to grow that release the nitrogen to the atmosphere in the form of ammonia.


    Note: The “green cone” type of composter is meant as a disposal system for pet
    waste, meat, and other materials. The digested contents from such composters should
    never go into a garden compost pile or be used on a food garden.'
