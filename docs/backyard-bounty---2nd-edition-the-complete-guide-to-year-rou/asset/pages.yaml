  md: '![](img/5a0c095115659a4ffa6ed6ae2899ac78_307_0.png)


    # 9.2. Blasting with water works really well to control aphids aphids—if you repeat
    it a couple of days later to catch the survivors of the first spray before they
    reproduce.


    What you consider “damage” can be a matter of personal taste and over the practicality.
    This is where the home gardener has a great advantage over the commercial grower.
    Because commercial produce is graded for perfection of appearance, growers control
    pests that merely do cosmetic damage. Home gardeners, on the other hand, don’t
    need to waste food that has scars or marks, because they can simply trim off the
    blemished bit and use the rest. After all, how perfect does the skin of an apple
    need to be if the apple is fated to become apple pie?


    The size of a pest population should also be considered in deciding whether you
    need to take action. Pests are naturally kept in check by weather conditions,
    natural enemies, and other factors. In certain years, some pests appear in high
    numbers; in other years, numbers are naturally low or nonexistent. It is by no
    means certain that a small infestation of'
