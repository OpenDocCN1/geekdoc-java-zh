  md: '# The Problem with Shading


    A traditional way to cool a greenhouse in the summer is to shade it using a blind
    or by spattering the glass with whitewash. These provide cooling all season and
    are fine for ornamentals that do well in low light, but when you reduce the light
    levels for tomatoes and other vegetables, you also reduce the size and quality
    of the crop (greenhouse growers say a 1% decrease in light levels causes a 1%
    drop in tomato harvest). Plan to cool your greenhouse mainly through improved
    ventilation, not by shading. However, for a heat wave, deploying temporary shading
    (horticultural shade cloth, curtain material, etc.) is a good way to avoid serious
    overheating. Covering the greenhouse with shade cloth has the best effect, but
    if that is not possible, laying shade cloth over the plants inside the greenhouse
    is still better than doing nothing.


    For adequate ventilation, the greenhouse should have at least two large openings,
    ideally at either end, with one lower and the other higher, so rising hot air
    draws in outside air through the lower vent. Venting along the top ridge is an
    efficient way to dump heat, especially if there are lower vents on either end
    to bring in cooler air from outside. If the openings are not big enough, you may
    have to use fans to move the air. Commercial greenhouse suppliers sell electric
    ventilation fans. Some models are operated on batteries charged by solar cells,
    though these do not have the power to move large volumes of air. If you design
    your greenhouse with large vents, you won’t need fans. For folks who live on the
    foggy ocean coast, cooling the greenhouse is much less of a problem, but there
    should still be provisions to ventilate well.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Manual or Automatic Vents?


    If someone is around to open manual vents every day without fail, you can get
    away with manually operated vents. But, if they aren''t opened on just a single
    sunny spring day, it can mean serious damage or even death to the plants inside.
    For safety, I recommend installing at least one automatic vent that will open
    when temperatures inside reach a preset level. An economical solution is to use
    the heat-activated vent openers sold by garden and greenhouse suppliers. These
    are lifting arms that move mechanically as a wax or gas-filled cylinder heats
    up in the sun—no electricity needed. As the gas expands inside, it drives out
    a piston that lifts the vent cover. They can lift up to 15 pounds (7 kg) and are
    quite sturdy, lasting for years.


    Deep soil beds: It is much easier to grow vegetables in a bed with soil at least
    18 inches (45 cm) deep than in pots or containers on benches. As well as providing
    more access to nutrients, deep soil doesn''t heat up as much, change temperatures
    as rapidly, or dry out as quickly as soil in containers, all of which benefits
    plant roots.'
