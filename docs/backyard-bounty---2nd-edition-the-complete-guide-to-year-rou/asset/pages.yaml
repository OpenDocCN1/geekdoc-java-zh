    new each year, to have one new bed and one two-year-old bed. Top-dress beds with
    compost in the spring. Mulch plants with leaves or straw in the fall to protect
    the crowns from frost heave.


    **Pruning:** Remove excess runners, which are string-like shoots that produce
    new plants on the end. Everbearing varieties generally produce fewer runners and
    require less pruning than June bearers. You can allow a couple of runners from
    each plant to take root and fill in between older plants. Or, peg down the developing
    plantlets in small pots of soil (still attached to the runner); in early fall,
    when plants are well-rooted, cut the runner and plant them.


    **Harvest and storage:** Strawberries have a short shelf life, but freeze well
    and make classic jam. To avoid damage from slugs, millipedes, and Botrytis/gray
    mold, pick berries are barely ripe (i.e., one side is still a lighter red than
    the ripest side), and allow them to finish ripening indoors.'
