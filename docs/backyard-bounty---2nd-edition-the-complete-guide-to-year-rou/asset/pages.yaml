    # Animal manure


    Older garden books always talk about digging in “aged manure.” These days, it
    is pretty rare for an urban or suburban dweller to get behold of livestock manure.
    If you do get cow, chicken, or pig manure from a commercial farm, you must compost
    it carefully in a well-turned, hot compost pile before using it. Disease organisms
    that cause serious illnesses in people, as E. coli, Salmonella, and Campylobacter,
    are now common in the livestock industry. It is no longer considered safe enough
    to pile manure and wait for it.


    If you get rabbit, goat, sheep, or llama manure, you can use it without necessarily
    composting it first. These manures are lower in nitrogen, they don’t build plant
    roots, and they generally don’t carry the risk of human disease that others do.
    They should be composted before use, however, if there is a lot of straw, sawdust,
    or shavings mixed in with the manure (more than 10% of the volume); composting
    also reduces the survival of weed seeds in the manure. Many gardeners find it
    makes the most sense to buy commercially composted manures at garden centers.
    These don’t carry the disease risk that handling raw manure does.


    For many people in suburban areas, the most readily available manure is horse
    manure. Even though it isn’t a human disease risk, there are reasons to compost
    horse manure for at least three months before using it:'
