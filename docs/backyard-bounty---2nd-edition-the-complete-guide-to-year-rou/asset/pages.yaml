  md: '# Protecting Grapes


    Birds, raccoons, squirrels, sugar-crazy wasps, and city rats love ripe grapes.
    There are several approaches to keeping them away (for details of these methods,
    see Chapter 9):


    Net: I used to recommend covering vines with a bird netting or a specially designed
    mesh for grape growers. With clips to secure the netting to the trellis and close
    gaps, it keeps out birds, rats, and raccoons. The invasion of a new fruit pest,
    the spotted wing Drosophila (see p. 244), however, which has become widely established
    in the PNW since 2012, I have been recommending that grape growers use instead
    of bird netting to keep out fruit flies as well as birds (see p. 218). Netting
    works okay for well-pruned grapes on easy-to-reach trellises. However, it is next
    to impossible to securely cover vines growing on walls or other non-standard trellises.


    Bags: Covering individual bunches of grapes with bags prevents damage from birds,
    rats, squirrels as well as insects, including the dreaded spotted wing Drosophila.
    Slip a lightweight bag (made of netting, organza, sheer curtain material, etc.)
    over each developing bunch of grapes, cinch up the drawstring, and leave it until
    time to pick (instructions for making the bags given under Vertebrates Chapter
    9, p. 279). The bags don''t interfere with summer pruning, and they work for vines
    that are impossible to cover with netting. The bags also keep direct sun off the
    fruit, which is desirable (the leaves need the sun, not the fruit), and the grapes
    develop without blemishes. If made of sturdy fabric with strong drawstrings, bags
    also also foil raccoons.


    Motion-activated animal repellents: Sensors in these devices pick up the movement
    of animals and trigger a short but startling burst of water to'
