    # Thinning Fruit


    As painful as it may seem when you are looking at a tree loaded with lots of fruit,
    you must thin them. You will harvest fewer but much larger fruit, and the tree
    won’t exhaust itself over-producing, which can reduce the next year’s crop. Some
    apples varieties, such as Gravensteins, are prone to biennial bearing: if left
    to their own devices, they tend to have a big crop one year and hardly any apples
    the next year. By stringently thinning the apples in the heavy year, you can keep
    the tree producing a moderate crop every year.


    Do your thinning after what is called the June drop (which may actually take until
    early July on the coast), a natural thinning process that causes trees to shed
    some of their immature fruit, including fruit that was not completely fertilized.
    It reduces the fruit load when the tree has set more fruit than it can handle,
    but it may also be caused by less-than-ideal growing conditions. In some trees,
    excessive fruit drop may be related to soil moisture (either too dry or too wet—you
    can’t win!). In any case, wait until after the tree has dropped what it wants
    to, because you may not need to thin much more.'
