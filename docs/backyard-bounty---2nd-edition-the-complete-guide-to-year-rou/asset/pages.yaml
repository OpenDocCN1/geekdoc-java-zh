    Many vegetable and fruit varieties are hybrids. Hybrids are common in nature (for
    example, nearly all apple varieties are really hybrids, because apple flowers
    have to receive pollen from a different variety to be fertilized). The names of
    horticultural seed suppliers usually show the term “F1” as part of their name
    (sometimes seed suppliers omit this). It means that the parent plants come from
    two different “lines” of that crop. When the male from one line is used to pollinate
    the female from a different line, the next generation of plants (the F1 generation)
    has a predictable and unique blend of characteristics from the parents.


    There are many excellent hybrids that give good results in home gardens under
    a variety of weather conditions. Hybrids, like cross-bred animals, tend to be
    robust due to the phenomenon known as “hybrid vigor.” Hybrid seed is usually more
    expensive, but the main problem with hybrids is that they don’t come “true” from
    seed. If you save seeds, the next generation will show a mix of characteristics
    that won’t be the same as the parent plants.'
