  md: '# A Simple Germination Test


    When in doubt about the viability of old seeds, it is easy to do a quick germination
    test. If you do this in January, you will have time to buy fresh seed if necessary.
    Here''s how:


    +   - Count twenty seeds if you have a good supply, five to ten seeds if you have
    only a few.


    +   - Spread the seeds on the bottom half of a wet paper towel and cover with
    the top half to keep them moist. If you are checking several different kinds of
    seeds, place them in groups on the same paper towel, making sure to label each
    group. Before wetting it, you can write on the paper towel with a waterproof pen
    or pencil. Put the moist towel with the seeds in a plastic container or bag, label,
    and cover or close loosely (don''t seal it).


    +   - Put the container in a warm spot and check daily to make sure the paper
    towel doesn''t dry out. Most seeds will germinate within three to five days (carrots,
    parsnips, and parsley take longer).


    +   - Count how many seeds show a tiny little root sprout and calculate the percentage
    of viable seeds. For example, if fifteen out of twenty seeds germinate, that is
    a 75% germination rate. A germination rate above 75% is fine. If the percentage
    is lower, sow those seeds more thickly to make up for it. If fewer than half germinate,
    it is time to buy new seed or grow out a planting to save fresh seed.'
