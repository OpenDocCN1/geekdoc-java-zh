  md: 'Another reason the concept doesn''t apply here is that spring on the coast
    is such a long, drawn-out affair; the “last frost” might happen anytime from February
    through May. The warmest areas might get only one or two frosts all winter. In
    my garden, the last frost dates over many years has ranged from March 5 to April
    30, yet a mile away, in a friend’s garden, I have seen ground frosts in mid-May.


    Garden books often recommend planting peas and other cold-hardy crops “when the
    soil can be worked.” In this region, there is often such prolonged wet weather
    in the spring that some soils are too wet to work until quite late. When you plant
    for year-round harvests, however, this isn''t as much of a concern because your
    overwintered vegetables will be producing good crops in the spring long before
    you are able to work the soil to new plants.


    **The key is soil temperature.** For coastal gardeners, soil temperature is the
    best indicator of when to plant. This is the only temperature that matters to
    germinating seeds anyway, and it varies widely from year to year. For example,
    in a year with a very cold spring, the soil a few inches in my garden was just
    above freezing on April 1. The next year, my soil temperature was 48°F (9°C) by
    March 15. It is handy to have a soil thermometer, but with a little experience,
    you can also go by how cold the soil feels to your fingers.


