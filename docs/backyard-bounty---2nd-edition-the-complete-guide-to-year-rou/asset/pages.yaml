  md: '# Carrots


    Baby carrots straight from the garden are a delight you can only experience if
    you grow them yourself. Carrots become sweeter in early fall as the cool nights
    cause sugars to concentrate in their roots.


    **Culture:** The best soil is deep, loose, and without stones (stones cause forked
    roots). Sow thinly, 1/4 to ½ inch (5 to 10 mm) deep; thin plants to 2 to 4 inches
    (5 to 10 cm) apart. Sow successive plantings to early July. In early July, seed
    a large bed of carrots for winter harvests. Carrot seeds don’t tolerate deep planting,
    and the soil must be kept evenly moist for the germination period (seven to ten
    days in warm weather, longer in cool conditions). To achieve a good stand of seedlings
    in summer, shade the beds until seeds germinate. If necessary, you can transplant
    tiny carrots to fill gaps in a bed of winter carrots (worth doing because it is
    too late to plant more seeds).'
