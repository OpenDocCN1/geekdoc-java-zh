  md: '# Squash and Pumpkins


    Summer squash are very large productive plants, so don’t plant too many! Many
    winter squash and pumpkins need quite a lot of space because they have sprawling
    vines, but they can be directed to run over non-garden areas and pathways if growing
    space is at a premium.


    Culture: Start seeds indoors five to six weeks before planting out. Theoretically,
    summer squash can be sown directly in the garden in early to mid-June if the soil
    temperature is over 60°F (over 77°F is better) (16°C, over 25°C is better), but
    the crop will be late. Plant in rows or hills with three plants per hill, 3½ feet
    (1 m) apart for bush varieties, somewhat wider for vine types. Dig in a generous
    supply of compost and amendments high in nitrogen before planting.


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_464_0.png)


    **10.21.** Keep summer squash, like this zucchini, picked to ensure plants continue
    to flower; if you planted too many, remove a few plants.'
