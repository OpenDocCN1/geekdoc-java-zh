    # Organic Fertilizers


    Fertilizers add major and minor nutrients to the soil in more concentrated

    amamounts than compost alone usually provides. Fertilizer supplements are

    necessary because vegetables and fruit need much more of these nutrients to

    produce good crops than they can get from ordinary soil. If you are used to

    maintaining perennial landscape plants, which need little, if any, fertilizer,

    you might be surprised at how much more nutrients crop plants needs.


