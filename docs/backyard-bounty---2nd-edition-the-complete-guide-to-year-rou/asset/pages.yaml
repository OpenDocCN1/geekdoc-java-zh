    +   - **Municipal compost:** Some municipalities collect yard waste, compost it,
    and sell the finished product to residents by the bucket, or in larger quantities.
    Because the sources of material are unknown, this is not allowed for certified
    organic growers. Years ago, there were problems with persistent herbicide residues
    in municipal compost in Washington State; however, those were not available to
    home gardeners in British Columbia. With the use of most pesticides by home gardeners
    now restricted across the province, there should be a very low risk of persistent
    residues in municipal compost. In US states where people could be using lawn herbicides,
    you might want to stick to your homemade compost or buy certified organic commercial
    compost products.'
