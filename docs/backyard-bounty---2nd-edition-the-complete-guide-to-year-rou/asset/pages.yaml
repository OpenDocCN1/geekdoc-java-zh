- img_proc: true
  md: 'large garden, you might want to invest in a wide two-handled tool called a
    broadfork or U-bar digger (see Resources), to make cultivating quicker and easier.


    Advantages of this method:


    +   - It maintains a healthy topsoil community of bacteria, fungi, worms, insects,
    and other organisms.


    +   - It drags fewer dormant weed seeds to the surface to sprout than deep-digging
    methods (for more on the “seed bank,” see Chapter 4).


    +   - It preserves soil structure.


    +   - There is less interruption of the natural upward movement of moisture from
    the subsoil (called capillary flow).


    +   - It preserves more carbon in the soil, preventing it from reaching the atmosphere
    and contributing to climate change.


