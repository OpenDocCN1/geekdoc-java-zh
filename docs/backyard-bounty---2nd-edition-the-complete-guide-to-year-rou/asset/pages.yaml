  md: 'Any kind of deep cultivation buries the community of topsoil microorganisms
    down where it is cool (even cold, at times) and dark, and there is less air circulation.
    Because we rely on these organisms to release nutrients, protect roots from disease,
    and perform many other functions, it doesn''t make sense to set them back this
    way. Deep digging also brings weed seeds from greater depths to the surface, where
    they will readily germinate in the light and warmth. It can also disrupt the natural
    upward flow of moisture from the subsoil (the capillary flow) at a point well
    below the root zone of annual vegetable plants, at least while they are small.
    Because water conservation is a widespread concern in this region, it is preferable
    not to interrupt this natural upward movement of water to crops where it exists.


    Rototilling: Tillers come in a variety of sizes, including very small models.
    The tines of rototillers spin around, thoroughly mixing the soil to the depth
    of the tines. I am not a fan of rototillers because they pound apart the soil
    structure and chop up fungi and earthworms (plus, they make noise, use gas, and
    cost money); however, they are useful for breaking new ground if you want to plant
    a garden immediately. They break up sod easily and quickly compared to hand digging,
    and the action of the tines can rapidly incorporate large amounts of organic matter
    into the soil. In fact, soil shouldn''t rototilled unless you can in lots of organic
    matter at the same time to help counteract the damage done to the soil structure
    and soil organisms.


    The disadvantages of tines:


    +   - The action of the tines destroys soil structure. Some soils should not be
    rototilled at all, because they are too fragile, while other soils hold up pretty
    well to occasional rototilling, as long as a generous supply of organic matter
    is incorporated every time.'
