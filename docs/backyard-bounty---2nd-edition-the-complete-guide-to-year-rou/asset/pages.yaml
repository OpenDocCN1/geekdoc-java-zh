    # Were Your Squash Flowers Pollinated?


    Many disappointed gardeners want to know why their squash plants produce flowers
    but no fruit. It happens because the flowers were not pollinated. The flowers
    need bees to pollinate them, but wild bees are scarcer now, and few people keep
    domestic honeybees in populated areas anymore. Bees are also less active in cool
    weather, so flowers go unpollinated when it is cool and rainy. The bottom line
    is that nowadays gardeners need to know how to hand pollinate flowers (for instructions,
    see the entry for squash in Chapter 10, A to Z Vegetables).


    Despite having flowers with both male and female parts, many varieties of fruit
    can only be successfully fertilized if the pollen comes from flowers of a different
    variety. This is called cross-pollination, and it complicates your choice of what
    to grow in a small garden. Without a suitable variety for cross-pollination, flowers
    of apples, pears, and many other fruits can''t be successfully fertilized. Some
    crops, such as blueberries, do have self-fertile flowers, but cross-pollination
    from other varieties helps to increase the amount of fruit set.'
