    # Troubleshooting Fruit Problems


    No flowers: The tree or vine may be too young to bear flowers. Dwarf trees start
    flowering early, usually by the time they are three years old, varieties differ
    in how long they take to start bearing fruit. Female kiwi vines may not flower
    until they are six or seven years old (males usually flower earlier). If a tree
    is old enough to flower but doesn''t produce flowers, review the growing conditions:
    is it receiving enough? Too much nitrogen?


    Lots of flowers, but little or no fruit: The flowers were not fertilized. Many
    varieties of fruit need pollen from another variety to successfully fertilize
    the flowers. You may have to plant another compatible tree or find'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'someone to help you graft branches of a different variety onto your existing
    tree. It takes a couple of years for the new tree to flower, but in the meantime,
    if you can, cut some flowering branches from a friend''s tree or an abandoned
    tree, put them in a bucket of water, and hang the bouquet in your tree.


    If your tree is a self-fertile variety, but the flowers don''t set fruit, it may
    be because there was too little pollinator activity when the flowers were open.
    Although wild bees and other insects fly in cooler weather than honeybees, no
    insects fly in wet weather. It is not unusual to have a complete crop failure
    on fruit trees that had the bad luck during a cold or rainy period in the spring.


    If your trees are not setting fruit due to bad weather or lack of pollinators,
    try hand pollinating the flowers. For how to pollinate fruit flowers, see page
    157.


    Lots of tiny fruit that fall off: If the tiny fruit don''t grow at all and fall
    off a few weeks after the petals fall, they probably weren''t fertilized successfully.
    If the fruit grows a little and doesn''t drop off until June or early July, then
    the tree is naturally thinning the crop. This is the June drop. Unfortunately
    some varieties are prone to dropping a lot of fruit, but it can also be due to
    inadequate pollination or poor growing conditions. You should wait until this
    occurs before you thin the remaining fruit.'
