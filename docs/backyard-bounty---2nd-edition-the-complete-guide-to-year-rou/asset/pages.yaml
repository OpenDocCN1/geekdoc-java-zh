  md: '# Making Compost or Manure Extract


    Put a shovelful of compost or horse, rabbit, sheep, or goat manure into a 5-gallon
    bucket and fill with water (avoid pig, chicken, and cow manure due to the risk
    of human diseases). Let it steep for one to two days, until the water turns dark
    brown, but don''t leave it longer or it will ferment. It now contains whatever
    soluble nutrients in the compost, but is too concentrated to use as is. Dilute
    it with water until it is a pale brown, like weak tea. Water plants with the liquid
    every week or as needed. You can usually brew a couple of buckets of tea from
    a shovelful of manure or compost.


    Note that this is simply a way to extract readily soluble nutrients, such as nitrogen,
    and not an "aerated compost tea." While aerated teas are purported to improve
    disease resistance, there is actually little evidence of this in the field (as
    opposed to laboratory studies). More troubling is the fact that the human pathogens
    E. coli and Salmonella have been found growing in such aerated teas, especially
    when molasses and other ingredients have been added.


    Nitrogen is the nutrient most likely to be in short supply, especially in the
    first few years of an organic garden. When leaves that should be dark green become
    a pale green or yellow, especially starting with the lower leaves first, plants
    are likely deficient in nitrogen (and possibly other nutrients). If plants have
    adequate sunlight and water, and temperatures are warm enough for growth, slow
    growth is often due to a lack of nitrogen.


    You can deliver a useful supply of soluble nutrients in water for a quick boost
    during the growing season. If plants are low on nitrogen, they will'
