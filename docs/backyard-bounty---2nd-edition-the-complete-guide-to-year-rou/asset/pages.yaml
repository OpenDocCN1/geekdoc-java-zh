    # Summer Planting Notes


    **Succession planting:** Sow vegetables that mature quickly (lettuce, radishes,
    salad greens, Chinese cabbage) at three- or four-week intervals over the summer
    months as spaces open up in garden. Sowing bush beans, peas, and sweet corn two
    or three times, three weeks apart, spreads out the period of prime harvest.


    **Sow winter crops to fill your living refrigerator:** Most vegetables harvested
    over the winter are started from seeds in the summer. Think of the winter garden
    as a living refrigerator: plants don’t grow, but they keep in perfect condition
    for months because they are still alive. Since plants grow so little from November
    to February, what you are going to eat then has to grown to full-size by the end
    of October.


