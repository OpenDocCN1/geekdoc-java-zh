    # CHAPTER 8


    # Year-Round Gardening Calendar


    The crop schedule and harvest notes in this chapter are for the coastal regions
    of the Pacific Northwest, extending from Vancouver Island and the Lower Mainland
    on the south coast of British Columbia to Washington and northern Oregon, west
    of the Cascade Mountains. In the warmest microclimates and in years with early
    warm spring weather, spring planting can be a couple of weeks earlier than shown
    here (conversely, it can be weeks later if the weather is cold).


    In more southern parts of the region or if you have dawn-to-dusk sun on your garden
    all fall, dates for planting overwintered crops can be up to two weeks later.
    Don’t plant later than suggested, though, if fall days in your garden are cut
    short by shading from nearby trees or buildings as the sun gets lower in the sky.


    You will be making judgment calls every year, but over time you will fine-tune
    these planting schedules to suit your garden’s microclimate(s). The coastal spring
    weather is so variable that you should be prepared to handle its rapid changes.
    Be ready to cover plants in a late cold spell and to mulch and shade them in an
    early heat wave.'
