    # Spring Harvest Notes


    Carrots, beets, and parsnips: Roots still in the garden from last season start
    to grow again in the spring. When they do, they begin using up the stored sugars
    in their roots, so quality deteriorates the longer they stay in the garden. Keeping
    a thick mulch over the bed helps to keep roots cool and delay the start of growth
    in the spring. Root crops are usually fine up to early April, but can start growing
    in late March in warmer areas. To preserve quality, dig up any remaining roots
    by April 1 and refrigerate them. They won''t grow any bigger in the spring anyway,
    no matter how long you leave them in the ground, because they will direct their
    energy to flowering.


