    # Mulching


    A mulch is a material used to cover the surface of the soil. Mulches of organic
    material, such as leaves, straw, or crop waste, benefit gardens in ways by:


    +   - smothering weeds and preventing seeds from germinating;

    - slowing evaporation of water from the soil surface in the summer (an estimated
    10% to 15% of water loss);

    - providing stable soil temperatures: cooler in summer and warmer in winter;

    - adding organic matter and nutrients to the soil as they decompose;

    - protecting the soil from erosion in heavy winter rain;

    - making excellent habitat for ground beetles and other beneficial insects.


