    #  Beans


    Good old beans: prolific, reliable, and popular! Snap beans are eaten fresh while
    pods are tender. Dry beans are shelled after they mature (young soybeans can be
    eaten, as edame). Bush beans produce a crop week or earlier than pole varieties,
    but stop growing when they reach full-size, whereas pole beans grow and produce
    all season.


    **Culture:** Beans need less nitrogen than other vegetables they produce their
    own. Wait until the soil is at least 60°F (15°C) before sowing. Plant seeds up
    to 1½ inches (3 to 4 cm) deep, spaced 2½ inches (6 cm) apart. For an earlier start
    and to avoid damage from pillbugs, sprout seeds indoors and set out plants when
    they have two leaves (see Chapter 5). Sow bush varieties of snap beans monthly
    until late June to provide continuous harvests; usually with a lull in late summer
    when a new flush of flowers produces a fall crop. Provide sturdy supports for
    pole beans, which grow quite tall.


    **Harvest and storage:** Keep beans picked, even if you can''t use them, because
    maturing beans stop from producing more flowers. For dry beans, leave pods on
    the plant until they are dry and yellow; finish drying indoors and then shell
    them.


    **Pests:** Aphids; pillbugs. Leaf diseases, such as bacterial blight or bean rust,
    may occur in prolonged periods of wet weather. Use irrigation systems that keep
    leaves dry and avoid working among bean plants while leaves are wet.'
