  md: 'Cold composting: Most home compost is made using this method: simply pile materials
    in a compost bin as they become available and leave them there. After about a
    year, pull apart the pile, and use the well-digestedly brown material in the center
    and bottom of the pile. Undigested stalks and other coarse materials that haven''t
    decomposed go into another bin to become the bottom layer of the next pile.


    # Bins or Piles?


    Either works fine, however, bins usually look better in a landscape setting than
    an open pile. A good size for a pile or a bin is at least 3 x3 x 3 feet (about
    a meter square by a meter high). Bins can be as simple as cylinders of fence wire
    or more sturdily built of wood, plastic “wood,” or other material. Beloved of
    composting enthusiasts, a system of three side-by-side bins allows you to turn
    compost from one to the next and have an extra to accumulate material until there
    is enough to make a new pile. Sides of bins should be slatted to allow air circulation.


    You can build a more organized cold compost pile if you can stockpile enough materials
    to build a pile at once (see below).


    Cold composting won''t kill weed seeds. It also won''t heat up enough to kill
    all plant disease organisms, but it does kill those that can survive on intact
    or living plant material. Once the infected leaves decompose, spores of rust,
    powdery mildews, apple scab, and other pathogens die, even if the compost doesn''t
    heat up.


    Hot composting: This labor-intensive way to make compost results in a pile that
    heats up and is ready in months. If piles are carefully made, turned,'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'and managed (see below), the temperatures reached during the heating phase
    of the decomposing may be high enough—and long enough—to kill plant pathogens
    and weed seeds. This is the only way that cow, poultry, or pig manure from commercial
    farms should be composted.


    # The Well-Organized Compost Pile


    A good time to make any compost pile is in the fall, when there is usually lots
    of garden waste, leaves, and other materials available at the same time. Whether
    you are going to leave the pile to compost slowly (cold composting) or keep turning
    it to make hot compost, the decomposer organisms need the following:


    +   Good ventilation: The organisms that digest organic material need to take
    in oxygen and get rid of waste carbon dioxide, so you need to build piles with
    good ventilation. An easy way to do this is to stand a length of wide plastic
    pipe (a 4-inch drain pipe works well) in the center. Pull the pipe out when the
    pile is built, leaving a donut hole in the center. Some people make a cylinder
    of wire mesh and leave it as the core of the pile.


    +   Moisture, not too much: In the summer, make sure the materials throughout
    the pile do not dry out. In the winter, cover the top of piles with a plastic
    tarp, sheet of plywood, or other material to shed rain and prevent the pile from
    becoming waterlogged.


    +   Balanced ingredients: Use whatever materials you can get most easily. Ideally,
    ingredients used to build the pile should roughly balance material with a high
    carbon content with material that has a high nitrogen content: “Brown” dry materials
    are higher in carbon and include bulky materials such as straw, mature crop residues,
    corn stalks, and shredded paper. “Green” materials are higher in nitrogen and
    include fresh garden waste, most fresh manures, leafy weeds, and kitchen waste.
    Try to layer twice as much brown as green material.'
