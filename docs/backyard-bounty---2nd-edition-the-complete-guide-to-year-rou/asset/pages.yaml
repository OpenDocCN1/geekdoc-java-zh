    flowers. As they collect nectar and pollen, they move the pollen from one blossom
    to another. Bumblebees, because of their large size, also vibrate flowers as they
    work, which causes the pollen to fall onto the pistil inside the flower. People
    can be another pollinating agent: gardeners can hand pollinate flowers to improve
    fruit set or to make sure seeds they save true to the variety.


