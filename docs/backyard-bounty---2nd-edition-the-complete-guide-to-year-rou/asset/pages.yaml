    # Do you need raised beds?


    Permanent beds do not have to be raised beds. Whether you decide to build up the
    height of the soil in raised beds depends on your site and on personal preference.
    Vegetable beds must have soil at least 12 inches (30 cm) deep. A depth of 18 inches
