  md: '# Vertebrates


    Deer, raccoons, rabbits, rats, and birds (not to mention the neighbor’s cat or
    your own bouncing dog) can do more damage to a garden than all other pests put
    together. Deer are increasingly common in rural and suburban areas. As their numbers
    increase, more gardeners are finding it impossible to grow a food garden without
    fencing. This is an expensive investment, but if you live where deer pass through
    even occasionally, it will save you a lot of grief if you put a fence before you
    plant. A deer fence also keeps out pets, and you might as well design it to keep
    out rabbits while you are at it; they too are becoming a serious problem in more
    places.


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_402_0.png)


    > 9.53. I''m sure this little island black-tail is thinking about my garden ...


    A word of caution: Temporary measures, such as covering plants with floating row
    covers or plastic mesh keep out birds, but usually end in (your) tears when the
    deer show up. Deer are clever at pawing away, crawling under, or pulling down
    temporary fences or covers. Many a gardener,'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'convinced they had a deer-proof fence, has discovered that once their aged
    dog passed on, the deer soon found a way past the fence. A fence backed up with
    a dog inside is an excellent deer deterrent, but try this only with dogs that
    don''t dig holes or to eat the crops. Repellents are also temporary measures that
    can be effective enough for landscape plants that take occasional damage, but
    don''t rely on them to protect food crops, a.k.a. “deer candy.\ Some repellents
    are not use for edible plants anyway, and deer have been known to ignore repellents,
    especially when they are short on food.


    For orchards, an approach that may work for some people is to grow tall fruit
    trees (standard, not dwarf varieties), and prune them so crop-bearing branches
    are too far off the ground for deer to reach. Trees still need to be fenced to
    protect them from deer until they are tall enough.


    # Fences


    I have seen a wide variety of deer fence designs, and I cannot swear that any
    are perfectly deer-proof. A motivated deer is a clever critters that will sooner
    or later get in; it will find a gap in the most improbable place, crawl under
    poorly secured fencing, or simply waltz through a gate left open. Where deer numbers
    are low, they are easier to keep out because they have other places to go. Where
    deer populations are high, there is a lot of pressure on your defenses, especially
    in the summer, when wild food supplies for deer are drying up.


    When designing your fence, take into account the size of deer in your area. On
    Vancouver Island, where the deer are smaller island black-tails, fences 6-to 8
    feet high are usually adequate. For the considerably larger white tails and deer
    on the mainland and Olympic Peninsula, however, plan on installing an 8- to 10-foot
    fence. Deer can jump vertical fences, but they are less inclined to try slanting
    fences or those with a projecting shelf'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'at the top. These designs, however, take up more space than vertical fences
    and are harder to build.


    **Chain link:** This is the ultimate defense—very expensive initially, of course,
    but it will outlast you and never need maintenance. Given the rigidity of chain
    link, deer cannot crawl under it. And, if there are no gaps between the ground
    and the bottom edge of the fencing, it is also effective against adult rabbits
    (baby rabbits may squeeze through it).


    **Deer and rabbit wire fencing:** This is a woven wire fencing with the horizontal
    wires closer together at the bottom of the fence to make the openings smaller,
    though they are not actually small enough to keep out rabbits. It is available
    in several widths. Mounted on wood or metal posts, it is moderately priced, especially
    if you can do some installation yourself. Wooden posts will eventually need to
    be replaced, but the wire can be removed and restrung onto new posts after years
    of service. You can extend the useful height of this fencing by stringing a higher
    wire or two between the posts above the top edge of the fencing. Five-foot-high
    fencing can effectively be made 6 feet by stringing a wire 1 foot above the fence
    (tie plastic tapes to the wire so deer can see the wire).


    Deer can crawl under woven wire if it is sagging or there are gaps along the bottom.
    One solution is to install a board or $2 \times 2$ crosspiece at ground level,
    spanning from post to post and screwed or nailed to the post at each end. Staple
    the bottom edge of the fencing to this crosspiece. These crospieces also make
    good supports for attaching sturdy wire mesh (such as $1/2$-inch chicken wire
    or welded wire mesh) to keep out rabbits. The bottom edge of rabbit fencing must
    be in tight contact with the ground, either held down by stones or wire pins or
    by burying the bottom edge in soil, to ensure there are no gaps along the fence.'
