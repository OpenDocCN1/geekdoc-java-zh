    The important thing is not to bury the topsoil community if you do cultivate.


    # Cultivation Methods


    After going through a (very short-lived!) deep-digging phase and then a rototilling
    phase when I had a large market garden decades ago, I arrived at a comfortable
    system of minimal cultivation that works fine in this climate, is easy, and fits
    into a busy life.


    Minimum cultivation: Once a year, spread compost and other amendments over the
    surface of the soil. Using a garden fork, lightly fork over the top layer enough
    to mix amendments into the top 4 to 6 inches (10 to 15 cm). The fork easily combs
    through loose open soil. If the soil stays together when you lift a forkful, turn
    the fork so that the soil slides off sideways and then lightly fork into the surface
    layer. Avoiding turning forks of soil completely upside down because this buries
    the topsoil organisms away from the warmth and air circulation they need. If you
    want to loosen the root zone below, drive in the fork and rock it back and forth
    to loosen the soil, without lifting the soil and turning it upside down. If you
    have a very'
  merge: -1
