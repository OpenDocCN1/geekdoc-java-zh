  md: 'Sheet composting: This is how nutrients are recycled in nature: organic material
    lying on the surface of the soil decomposes in place. The material disappears
    as it is first shredded by worms, insects, and slugs, then further digested by
    a myriad of other organisms. Green soft materials disappear quickly, while drier
    woodier materials break down more slowly. When leaves and other materials are
    used as mulch, they continuously break down and feed the soil. Layering organic
    matter on the soil surface actually builds organic matter and improves soil structure
    more rapidly than cultivating into the soil.


    I routinely leave green crop waste, such as cut peas and beans plants, on the
    ground where they grew, and transplant seedlings for the next crop through the
    mulch. In fact, you can leave any material on the soil to decompose, including
    pulled weeds; old leaves of cabbage, squash, and other plants; stalks from harvested
    corn, etc.


    An extreme variation on this is “lasagna” gardening, which involves spreading
    layers of crop waste, leaves, manure, spoiled hay, or other readily organic matter
    on the soil surface until it is a foot thick. The layer takes the place of topsoil;
    you plant directly into the mix. This method works, but you have to be able to
    get behold of a lot of organic material—and have a means of hauling it to the
    garden. While this is a “no till” method, it is not a “no work” method.'
