  md: 'It is certainly possible to garden without cultivating at all, as many gardeners
    attest. "No till" methods usually involve maintaining a thick mulch on the soil
    for most or all of the year. Here on the coast, heavy mulches should be pulled
    back in the spring to allow soil to warm up and dry out and discourage slugs and
    pillbugs from having a heyday at the expense of your seedlings. However, in the
    summer, planting well-grown transplants directly into a deeply mulched bed quite
