  md: '# Special Case: No Spare Water for Irrigation?


    In some places, such as the Gulf Islands and San Juan Islands, households depend
    on cisterns to hold winter rain for their summer water supply and have no surplus
    for a summer garden. By thinking of food gardening as a fall-through-spring activity,
    rather than a summer activity, it is still possible to enjoy garden vegetables
    for much of the year.


    For summer, grow a couple of tomato plants or cucumbers or other favorites in
    containers or keep a small bed close to the house where it will be easy to water
    with "light gray" kitchen water—the clean water you can catch in a dishpan from
    rinsing dishes or washing vegetables. Or keep a bucket in the shower to catch
    the water while it is warming up enough for you to step in, and use it for your
    container crops.


