    # Are Your Seedlings Getting Enough Light?


    Compare the stocky seedlings that come up outdoors with seedlings grown indoors.
    The outdoor plants have hardly any distance between the soil surface and the first
    pair of leaves. Indoor seedlings that grow tall, lean toward the light and have
    long pale stems below the first pair of leaves are not getting enough light. They
    are also very susceptible to damping off because of the weak stem. Depending on
    how elongated the stem has become, they may or may not be salvageable. Try to
    get them into better light as soon as possible.


    Temperature: Most vegetable seeds germinate well at 70° to 86°F (21 to 30°C) (see
    Table 4.1, p. 91). The top of the refrigerator or hot water heater used to be
    a good place to germinate seeds, but not in the day of efficient appliances. If
    you don’t have a warm place to set seedling trays, investing in a bottom-heat
    unit for seedlings is well worth it. Because bottom heat is only needed for the
    germination period, you can cycle a lot of seedlings through one unit the size
    of a standard seedling tray (about 10 × 20 inches/25 × 50 cm).'
