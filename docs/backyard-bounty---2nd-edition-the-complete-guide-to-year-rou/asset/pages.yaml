  md: 'Pruning in the winter tends to stimulate more vigorous growth. For a tree that
    is hardly growing, dormant pruning pushes it into a higher rate of growth. However,
    it also encourages a rapidly growing tree, such as a rampant peach or cherry,
    to grow even faster during the summer, making it even harder to maintain the desired
    size.


