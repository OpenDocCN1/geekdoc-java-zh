    # Irrigation


    Vegetables need a lot of water, and they must be watered in dry weather. Coastal
    gardens on low-lying land may not need water until midsummer if there is enough
    moisture in the soil. In contrast, gardens with well-drained soils might need
    irrigation in late May as the usual dry summer weather sets in early.


    **How to water**: You will read elsewhere that intensively planted annual vegetable
    gardens need the equivalent of 1 inch (up to 2 cm) of rainfall per week in hot
    weather. When it doesn''t rain, you are supposed to supply the difference. Now,
    that is a lot of water! I do not come close to providing this much to my own garden,
    in part where I live it is necessary to conserve well water. How much you really
    need to water varies tremendously, depending on the following factors:


    +   * **Soil characteristics**: structure, drainage, and organic matter content
    affect the water-holding capacity of a soil.

    * **Temperature and wind**: both influence how much water the plants pull from
    the soil and transpire through their leaves. On a hot, windy day, plants will
    suck up much more.

    * **Plant spacing**: dense plantings need more water per square yard than plants
    spaced farther apart (but of course, produce more per square yard too).'
