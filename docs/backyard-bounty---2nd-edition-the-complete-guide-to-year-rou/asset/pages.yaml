    # Organic Matter


    Adding organic matter to the soil provides food for soil microbes, and they in
    turn, slowly release nutrients to plants. And slow release does mean slow; studies
    show that the rate of nitrogen released from mature compost can keep increasing
    for at least eight months after it is applied to the soil. It continues to release
    small amounts for much longer, which is why garden soils fed with compost every
    year become more and more fertile as the years go by.'
