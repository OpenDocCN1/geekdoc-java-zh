  md: '# Vernalization (or Why Vegetables Unexpectedly Go to Seed)


    Vernalization is a plant’s response to low temperatures that results in flowering.
    After the cold of winter, biennials normally bolt, meaning they send up flowers.
    But if a seedling is big enough, a spring cold spell can fool it into behaving
    as if winter has passed, so it grows a flower stalk in its first summer instead
    of waiting (as it normally would) until the following spring. Crops rarely vernized
    by cool temperatures in the spring include beets, Swiss chard, cauliflower, cabbage,
    onions, leeks, and celeriac. Temperatures of 40° to 50°F (5° to 10°C) for one
    to two weeks, for example, can be enough to cause onions to bolt.


    Plants can only be induced to flower if they have grown large enough to have sufficient
    food reserves to devote to flowering. If the cold period happens while seedlings
    are still tiny, they won’t flower because they are too small. Plants don’t have
    to be very large, to respond to cool temperatures. Onion seeds larger than a nickel
    and cabbage or leek transplants with stems are enough to be induced to flower
    prematurely by a cool spell. The larger the seedlings when the cool weather occurs,
    the more likely it is that they will switch to flowering mode.


    Vernalization is a particular problem for coastal gardeners eager to get a jump
    on the season. In our mild climate, it is often possible to sow seeds of hardy
    vegetables as early as February. If there is a nice long period of mild weather,
    these early seedlings grow big enough that a late cold spell (and we always seem
    to get a late cold spell!) can cause them to flower. You don’t see the flower
    stalks immediately, but the plants get set on a growth path that will result in
    premature flowers later.


    Vernalization is also a problem if you try to get a head start by starting seeds
    indoors too early. If you do a good job of growing healthy transplants and set
    them out too early, it can take as little as a week of cool weather to induce
    some of them to flower. Our spring weather is so variable'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'that it is more reliable to start seedlings later and plant out small plants
    that can tolerate a late cold spell without bolting.


    # Pollination and Fruit Set


    For many vegetables, flowers are only important if you want to save seeds. For
    fruiting plants, however, such as tomatoes, squash, apples, or blueberries, there
    can only be a crop if the plants flower and the flowers are successfully fertilized.


    Pollination occurs when the dust-like pollen from the male parts (stamens) reaches
    the female parts (pistils) of the flower. The flower is successfully fertilized
    when the pollen grain sends a pollen tube into the egg cells in the ovary of the
    female flower. Most vegetables and fruit have flowers with both male and female
    parts in the same flower. Most are also self-fertile, meaning that pollen from
    the same flower only has to drop onto the pistil within the flower for fertilization
    to proceed. Bean and pea flowers, for example, are already pollinated by the time
    the flowers open.'
