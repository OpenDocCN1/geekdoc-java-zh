    fruit flowers, see Chapter 6, Basic Methods for Growing Fruit).


    # Fruit without Fertilization


    Parthenocarpic varieties of plants set fruit whether or not the flowers were successfully
    fertilized. For example, the early varieties Oregon Spring and Siletz can set
    fruit when it is too cold for tomato pollen to successfully fertilize the flowers.
    The unfertilized flowers develop seedless fruit; later, in warm weather, they
    produce normal fruit.'
