    Allow vines to sprawl, or train them to a trellis that supports the fruit. Train
    long English cucumbers up strings or one to a trellis and remove female flowers
    to prevent fertilization, which results in bulbous fruit with seeds.


    **Harvest and storage:** Keep all cucumbers picked, even if you don’t use them,
    or plants will stop producing flowers. Bitterness in cucumbers depends on variety
    and possibly temperature (fruit grown in cool conditions can be more bitter).
    Most of the bitterness compounds are concentrated in just under the skin and in
