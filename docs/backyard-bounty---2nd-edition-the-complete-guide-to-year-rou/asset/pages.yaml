    and growth processes. Three of these (nitrogen, phosphorus, potassium) are the
    primary elements in fertilizers, but they are not the only used in large amounts.
    The elements below are listed in order of the relative quantities used by plants:


    +   - Nitrogen: This main element for plant growth is used in greater amounts
    than any other element. It promotes rapid growth and is a key building block of
    proteins. Microorganisms breaking down organic matter in the soil or capturing
    it from the atmosphere release nitrogen in a form usable by plants. Until there
    are good levels of organic matter in the soil, however, nitrogen is the element
    most likely to be in short supply in the first few years of an organic garden.


    +   - Potassium (potash): This regulates the production of proteins and starches
    and makes for sturdy plants. Second only to nitrogen in the amount plants use,
    it plays an important role in disease resistance and heat and cold tolerance.
    Root crops tend to need more potassium than other vegetables. It leaches out of
    the soil with heavy rain, but the more organic matter there is in the soil, the
    less likely this is to happen.


    +   - Calcium: A key element for the functioning of plant cells, calcium is involved
    in regulating many processes, including how plants respond to the environment.
    Deficiencies show up in the death of cells in actively growing parts, such as
    of shoots, roots, and fruit (see Disorders). Horticultural lime applied to make
    coastal soils also supplies plenty of calcium.


