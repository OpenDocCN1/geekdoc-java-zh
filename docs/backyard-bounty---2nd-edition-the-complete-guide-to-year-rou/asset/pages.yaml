    # Raspberries


    Once raspberries become established, you may wonder why you planted such an invasive
    plant that sends up shoots everywhere—until you taste that first handful of ripe
    raspberries, of course.


    **Culture:** Set plants 2 to 3 feet (60 to 90 cm) apart in rows. They must have
    well-drained soil, but prefer it to be cool and moist; therefore keep plants deeply
    mulched. They should have some kind of support to corral the canes because they
    get quite long. They can be tied in parallel wires a foot or two (up to 60 cm)
    apart running along a fence or between posts or grown supporting wires. Bush raspberries
    do not require supports.


    **Pruning:** Simplest method for pruning raspberries: When plants are dormant,
    cut down all canes that bore fruit last year. The bark on these will be darker
    and rougher compared to the smooth bark of canes that grew in the last growing
    season. You can prune all varieties this way, but everbearing varieties can also
    be pruned in two stages. These raspberries produce a fall crop on the top third
    of new canes and a crop following the summer on the lower part of those same canes.
    When plants are dormant, prune off just the top part that has fruited and allow
    the bottom of the canes to produce fruit next year. Then prune out that spent
    cane can the following winter. Try to keep only five to ten new canes per plant.
    Pull, cut, or dig weaker shoots and those that come away from the main plant.
    Raspberries tend to spread widely if left to their own devices.


    **Harvest and storage:** Enjoy raspberries immediately or freeze or preserve them.


    *Note:* When picking, hold the bucket away from the branch to avoid the risk of
    a stink bug falling into the bucket. They are common in bramble and fruit'
