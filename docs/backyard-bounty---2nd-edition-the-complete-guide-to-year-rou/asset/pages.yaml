  md: '# Garlic


    Wonderfully strong and flavorful varieties are available to gardeners: Hard-neck
    (Rocambole) varieties have the most intense flavor and are easy to peel. Soft-neck
    garlic, what is usually seen in grocery stores, keep longest.


    **Culture:** Plant garlic in the fall, so it has time to grow a large root system
    before the increasing lengths of May and June stimulate it to make bulbs. Separate
    cloves from the bulb (leave the skins on); plant them pointed end up, with the
    tip covered, 8 inches (20 cm) apart each way. Mulch beds for the winter. The following
    June, hard-neck garlic sends up a curving central seed stalk (scape); snap these
    off as they appear, and eat them (in stir-fries, pesto, etc.). If possible, stop
    irrigating about two weeks before harvest, which is about mid-July for most varieties.


    **Harvest and storage:** Hard-neck garlic is ready to harvest when four or five
    lower leaves have turned brown and dry and the outermost layers of the bulb become
    thin and papery. Soft-neck garlic is ready after necks wither, causing the tops
    to fall over. Lift the bulbs and hang whole plants in bunches or braids, or spread
    them in trays one layer deep. Keep in a warm, dry airy place for three weeks to
    cure; don''t leave bulbs in direct sun. When bulbs and leaves are thoroughly dry,
    rub off loose skins and dry soil; cut the stalks of hard-neck garlic just above
    the bulb or leave a long stem to tie them in bunches. Store garlic in cool, dry,
    well-ventilated conditions (i.e., not in closed containers or outdoors in a garden
    shed).


    **Pests:** Allium rust; garlic root rots are common. If your garlic crop healthy,
    save your own bulbs for planting to avoid the risk of bringing in root diseases.'
