  md: '# CHAPTER 2


    # Planning a Productive Garden


    Vegetables and fruit are all sun lovers: the less direct sunlight there is, the
    slower they grow. Sadly, the amount of sunshine is the factor that you may have
    the least power to change (especially if it is your neighbor''s house that is
    blocking the sun!). Happily, you can improve many other things—soil depth and
    quality, drainage and irrigation—so before you pick your site, start with finding
    out where the sun shines longest in your yard. If that is a concrete patio, not
    to worry: you can build vegetable beds on top of concrete if you have to.


    The ideal site for a garden is where it will receive full sun for six to eight
    hours of the day from March through September, when plants are most actively growing.
    Also keep in mind that for plants harvested from November to February, the best
    location is where they also have the protection from cold and wind.


    Lettuce and salad greens can grow fairly well in gardens that offer about half
    a day (four hours) of good sunshine during the summer, but tomatoes and other
    heat-loving crops must have more than that. The warm midday sun is the most important.
    Most gardens do get enough direct sun in the'
