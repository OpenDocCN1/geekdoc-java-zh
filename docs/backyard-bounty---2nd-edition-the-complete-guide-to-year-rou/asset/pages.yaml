    # Hardening Off Seedlings


    Seedlings that are grown under lights, in greenhouses, or on windowsills will
    have soft stems and tender leaves with thin cuticles (the thin waxy coating on
    leaf surfaces). They have to gradually get used to direct sun, wind, and cooler
    nights before they are sent out into the world. Through this process of hardening
    off, their growth slows a little as food reserves build up in the roots, and the
    cuticle on the leaves thickens up to protect them from sunburn.'
