  md: 'Soil mixes: Back when you couldn''t buy commercial organic soil mixes for seedlings,
    I used to make my own mix (see Table 5.1). Now, I am happy to buy a bag of commercial
    mix, certified by OMRI (Organic Materials Review Institute) for use by organic
    growers, as it saves a lot of time and effort and gives consistent results.


    Table 5.1. Basic homemade seedling mix.

    | Ingredient | Notes |

    | --- | --- |

    | 1 part | Finished homemade compost or commercial compost | Screen it to remove
    large particles. |

    | 1 part | Vermiculite or perlite | Coarse sand can be substituted. |

    | 1 part | Coconut coir or peat moss | Coir is more environmentally sustainable
    than peat.

    | 1 part | Good garden soil | Use the best you have.

    | For each gallon of 1 Tbsp agricultural lime, add: | For acid soils; not necessary
    if soil is near neutral pH |

    Note: All proportions are approximate and should be adjusted according to conditions:
    e.g., if the soil is heavy clay, use less soil and vermiculite and coir.


    Look for products, like Sunshine Organic Planting Mix or Seasoil™ Potting Mix,
    that state they are for seedling production. Check the labels of other commercial
    “potting soil” products before you buy. Some are intended as substitutes for use
    in containers and don''t have nutrients. Seeds germinate in these mixes but stop
    growing as soon as they run out of the food stored in the seed itself. Seedlings
    in such mixes need regular applications of liquid fertilizer or should be transplanted
    into a fertile soil as soon as they have two leaves.


    A good reason for making your own seedling mix is to avoid the use of peat moss,
