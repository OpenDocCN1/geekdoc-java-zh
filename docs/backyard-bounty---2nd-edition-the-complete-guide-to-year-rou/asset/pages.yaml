  md: '# CHAPTER 9


    # Managing Pests and Problems


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_302_0.png)


    Although you are probably concerned about pests in your garden, my experience,
    more plant damage is caused by something wrong with the growing environment than
    by pests or diseases. Of course, that assumes your garden is well-protected from
    deer and rabbits!


    The advantage of organic gardening, based as it is on building healthy soil, is
    that it produces healthy, resilient plants. By minimizing the use of insecticides
    and by planting to attract beneficial insects, organic gardeners can count on
    substantial help from the many insects that feed on pests. In fact, the more your
    food garden resembles a natural ecosystem—with mixed plantings and mulched soil—the
    easier gardening becomes.


    Among the many possible insects and diseases that can occur, few regularly plague
    vegetables and fruit crops on the coast. In any one garden, you will likely see
    only a handful of these problems, and most can be prevented, once you know what
    you are dealing with.


    # Prevention'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'Prevention is the key. It is the first line of defense against insect pests,
    diseases, weeds, mammals, and other pests. Preventative methods are safe, mostly
    cheap, and they do a good job of avoiding damage altogether. Many provide solutions
    that last for the whole growing season. Here are some examples:


    +   * Covering plants with insect netting or floating row covers to stop insects
    from laying eggs.

    * Planting varieties that are resistant to diseases.

    * Mulching the soil to prevent weeds from coming up.


    Growing healthy plants is part of prevention because they are less susceptible
    to disease and more likely to survive pest attack and quickly replace damaged
    leaves.


    Plants become stressed when they don''t get enough sunlight, water, or nutrients.
    Sometimes there is no shortage of any of these in the environment, but conditions
    that the gardener can control, such as acid soil or poor drainage, prevent plants
    from getting what they need.


    Another aspect of prevention working in favor of home gardeners is the fact that
    we grow many different kinds of plants in a small area. Quite the opposite of
    a grower with a huge field of one vegetable, which gives the pests of crop an
    unlimited supply of food. Insects and disease organisms stick to their particular
    host plants, so the mixed plantings in a small garden limit their ability to spread.
    For example, even if every one of your carrots were damaged by carrot rust fly,
    you could still have fine beets, onions, radishes, and other roots, because they
    are not acceptable food for that particular pest.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '![](img/5a0c095115659a4ffa6ed6ae2899ac78_304_0.png)


    **9.1.** A typically mixed garden, from corn, apples, asparagus, leeks, and leafy
    greens to flowers and herbs, limits food for pests and attracts many beneficial
    insects.


    # Basics of Pest Management


    Think pests are causing a problem in your garden? Here are some steps to follow
    that will help you decide whether or not there is a really problem—and whether
    you need to (or can) do anything about it.


    +   **1. Make sure the problem is correctly identified.** If you don''t know what
    the problem is, there is no point in spraying or taking other action. You may
    never know what caused some of the damage. However, because many things that go
    wrong with plants are caused by poor environmental conditions, you can always
    work on improving the growing conditions and see what happens.


    Whether a problem is caused by insects, disease, or other pests, the cause must
    first be correctly identified before you can know what controls'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'will work and how to prevent it in future. The use of the bacterial spray BTK
    (Bacillus thuringiensis kurstaki) is a good example: it only infects caterpillars,
    which are the immature stage of moths and butterflies. It doesn''t affect other
    pests, including the sawfly larvae that look just like caterpillars. So, reaching
    for the BTK will do no good if your problem is snowflies.


    The following individual entries describe the most common pests of food plants
    in this region, but not every problem that could possibly occur. To help identify
    problems, I have put an extensive database of photos on my website covering pests,
    diseases, disorders, and also beneficial insects. Other places to look for help
    (see Resources section for details):


    +   - reference books and websites, especially ministries of agriculture (Canada)
    and university cooperative extension departments (US)

    - local Master Gardeners

    - gardener hotlines for phone queries and online forums

    - experienced staff at local garden centers


    You may be able to email photos to someone to help with identification (much better
    than a verbal description!). If you can''t take a specimen to a Master Gardener
    clinic or a garden center for identification, bringing photos on your tablet or
    phone is the next best thing. Make sure photos are in focus and as close-up as
    possible.


    # Keep an eye on the problem.


    Regularly checking on a problem after you notice it can tell you whether it is
    getting worse or not and help in identification. People often notice leaf damage,
    for example, only after the critter that was chewing has finished feeding and
    crawled away. By checking on the plants for several days, especially looking at
    the new growth, you can tell if fresh injury is occurring. If you don''t see new
    damage, there is no point in spraying. You can, however, note the date when'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'you first saw the problem. Next year, start a few weeks earlier than that for
    the first signs of damage so you can track down the culprits.


    Get a magnifying glass to help you see, and keep notes and take photos so you
    have a record for next time.


    **3. Decide whether treatment is needed.** It is important to distinguish between
    the kind of damage that reduces your crop or could kill plants and the kind of
    damage that doesn''t really affect your harvest. A parsleyworm caterpillar chewing
    on carrot leaves isn''t really doing much damage because it isn''t attacking the
    part of the plant you want to eat. Anyway, you might be happy to allow the caterpillar
    to feed, knowing it will become a beautiful anise swallowtail butterfly. On the
    other hand, a codling moth caterpillar boring into the center of an apple is directly
    ruining the crop (though even in this worst case, the good parts of that apple
    can still be salvaged for applesauce).'
