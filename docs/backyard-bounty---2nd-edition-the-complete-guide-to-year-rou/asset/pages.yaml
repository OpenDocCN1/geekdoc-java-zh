    of organic matter, nitrogen, phosphorus, potassium, calcium, and other important
    nutrients. Such tests are quite expensive in British Columbia ($40 to $200), but
    much cheaper in Washington.


    To make soil less acidic (i.e., raise the pH), dig in agricultural lime, which
    is ground-up limestone. Any garden center or agricultural supplier sells it. Don''t
