    more than 15% of the branches (usually less) on an established dwarf fruit tree.
    Excessive pruning makes a tree produce soft vertical shoots, or sprouts, in the
    summer. Extreme pruning (removing more than a third of the branches at one time)
    can shock a tree badly and cause it to send up a lot of weak water sprouts. If
    you have a neglected tree that you want to bring back into production, reshape
    it gradually over three or more years, rather than doing it all at once.


