  md: '# What About Epsom Salts?


    Epsom salts (magnesium sulfate) can provide a quick source of magnesium for deficient
    plants—but it also risks causing excessive magnesium levels, which can tie up
    other nutrients in the soil or cause toxicity. For example, trying to use Epsom
    salts on tomatoes to prevent blossom end rot, caused by calcium deficiency in
    the fruit, only matters worse as the magnesium interferes with calcium uptake
    in plants. It is impossible to tell by looking at leaves whether plants are suffering
    from a magnesium deficiency, but it is unlikely in garden soils amended with compost
    and organic matter. Because Epsom salts are so soluble, much of what is applied
    leaches away anyway, which can cause environmental pollution.


    Magnesium sources: Sandy, acidic coastal soils can sometimes be low in magnesium,
    though it is usually not an issue in soils enriched with compost. If you need
    to amend with lime to make the soil less acidic, using dolomitic limestone every
    few years is an excellent way to ensure adequate magnesium. It naturally contains
    both calcium and magnesium in a safe ratio that does not risk causing a nutrient
    imbalance. Although you may see Epsom salts (magnesium sulfate) recommended, there
    is rarely any reason to use this highly soluble magnesium source in an organic
    garden (see text box on left). Rely on compost, complete organic fertilizers,
    and the action of soil microbes to provide plenty of magnesium for your crops.
    The langbeinite included in some organic fertilizers also supplies magnesium.


