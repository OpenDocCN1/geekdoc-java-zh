  md: 'At the other end of the thermometer, as temperatures rise, plants grow faster—but
    only to a point. When it is too warm (above 82° to 95°F or 28° to 35°C, depending
    on the crop), plant growth slows or may even stop temporarily. In hot weather,
    the balance between photosynthesis (making sugars) and respiration (using sugars
    for energy) gets out of whack—and plants become stressed as their stores of sugars
    are used up in hot weather faster than they can be replaced. Vegetables lose their
    sweetness, and flavors become better (e.g., lettuce) or bland (e.g., tomatoes).


    To avoid a disastrous loss of water when it is too hot, plants have to close the
    pores (called stomata) on their leaves during the hottest part of the day. This
    shuts down photosynthesis; plants cannot start making food again until it is cool
    enough for the pores. Closing the stomata also shuts off the plant’s cooling system
    because water is no longer evaporating from leaves. Not only does a prolonged
    hot spell mean a prolonged inability to make food, but it also leaves the cells
    of fruit and foliage vulnerable to heat injury (sunscald).


