  md: 'Several different species of annual and perennial arugula have the same nutty,
    peppery flavor. Leaves of annual varieties are larger, but plants go to seed quickly
    in the summer, while the narrower leaves of perennial arugula can be harvested
    nearly year-round.


    **Culture:** Sow annual arugula ½ inch (1 cm) deep at monthly intervals from April
    to early September for a continuous supply of young leaves. Perennial arugula
    grows readily from seed, eventually becoming large clumps; plant where it can
    remain for years. It is drought tolerant, and plants are hardy enough to survive
    most winters; mature plants also produce seeds, providing a supply of replacement
    seedlings.


    **Harvest:** Use annual arugula from the thinning stage on. Keep plants well-watered
    and fertilized for rapid growth; they become strong flavored in hot weather or
    when stressed by lack of water. For harvest all winter, plant perennial arugula
    in a protected site or move a couple of plants into an unheated greenhouse/cold
    frame.


    **Pests:** Cabbage/crucifer beetles.


    **Species:** Varieties of *Eruca vesicaria* are the traditional annual arugula
    or roquette; other annual arugulas are *Diplotaxis* species (Sylvetta, Red Dragon).
    *Diplotaxis tenuifolia* is the perennial or wild roquette.


