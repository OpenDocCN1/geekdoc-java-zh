  md: '# CHAPTER 3


    # Preparing the Soil


    Soil chemistry is a complex subject. Fortunately, if you follow a few basic rules
    for managing soil, you can grow a perfectly good organic garden without getting
    too technical. Think of the soil as a living, breathing, densely populated community
    of organisms (roots, fungi, bacteria, insects, mites, worms, and a lot else besides)
    living in a moist, dark world. Keeping this community happy, rich, and busy is
    the essence of organic gardening. If you can do that, you will reap the rewards
    of a thriving garden.


    # The Ideal Garden Soil


    The best soil for a vegetable and fruit garden is deep, fertile, and well-drained.
    Prime agricultural land has these desired characteristics, but your garden soil
    might start out far from this ideal. Not to worry—even the worst soils can be
    amended to grow a garden. The better your soil conditions are to start with, however,
    the less work and time it will take to make it into a productive garden.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'Deep soil: A garden should have soil deep enough to provide a root zone that
    anchors plants and allows roots to reach sufficient nutrients. A small annual
    plant like lettuce can grow in a foot of soil, if necessary, but obviously, a
    fruit tree has much a larger root zone.


    On undisturbed land, the top layer of soil (the topsoil) is several inches to
    to over a foot deep. This is usually darker than the layers of soil below (the
    subsoil) because it contains more organic matter. Ideally, there is a thick layer
    of topsoil sitting on subsoil that is several feet to several yards deep. If your
    soil profile is like this, you are fortunate indeed!


    # Special Case: No Soil?


    If you don''t have a patch of soil to cultivate, try for a plot in a community
    garden. Or, if you have a sunny deck or balcony, many vegetables can be grown
    in containers (see Chapter 7). If you have a large sunny area, but it is paved
    or covered with gravel or rock, you could still have a productive garden if you
    invest in building large planters. They should be at least 18 inches (45 cm) deep
    (deeper is even better); they can be any length and width, as long as you can
    easily reach to the middle. Buy the best soil available, and mix in a generous
    amount of compost, leaf mold (well-rotted leaves), and other organic matter as
    you go ( 1 to 2 parts compost to 9 parts soil as a rough guide).'
