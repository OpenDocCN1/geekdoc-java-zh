    # When to Sow Seeds in the Spring


    This is a vexing question! Some concepts useful in other climates, such as average
    frost-free dates (see text box below), don’t mean much for the coast. And coastal
    spring weather varies so much from year to year (and is likely to vary many as
    the climate changes) that last year’s timing doesn’t necessarily apply this year.


    > Forget the Average Frost-Free Date

    While the average date of the last frost is used in other regions as a marker
    for spring planting, this concept isn''t much use on the coast. Frost-free dates
    are calculated from many years’ worth of weather data at a recording site (usually
    a regional airport). Because the coast is so geographically complex, even weather
    records from a site very near your garden may bear little relationship to the
    frost patterns in your garden. On the coast, there can be striking differences
    in frost patterns over very small areas.'
