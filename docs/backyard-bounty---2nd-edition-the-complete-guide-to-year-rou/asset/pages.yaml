  md: '# CHAPTER 7


    # # Food Crops in Greenhouses and Containers


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_248_0.png)


    # ## Greenhouses


    Sooner or later, keen gardeners end up investing in some type of greenhouse. In
    the cool, foggy zones near the ocean, greenhouses or tunnels are a necessity if
    you want to grow tomatoes, peppers, or other heat-loving crops in the summer.
    If you already have a greenhouse, you can use it to produce food through the winter.
    It is also the ideal place to overwinter tender herbs, pitted citrus trees, and
    other plants.


    A greenhouse can be anything from a simple plastic-covered frame to a custom-designed
    glass house. It can be freestanding or attached to other buildings, unheated or
    heated, and cost from a few dollars to thousands for a fully equipped glasshouse.
    I am not going into detail on all of these options, because as far as food production
    goes, a simple unheated plastic tunnel greenhouse provides enough protection for
    summer and winter crops in this climate. Here are three important design elements
    to consider:


    **Site in full sun:** The warmth inside a greenhouse won’t make up for a shortage
    of the sunlight that plants need for photosynthesis. If the'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'greenhouse will be used in the summer for tomatoes and other warm-season crops,
    it should receive six to eight hours of direct sun during the growing season.
    For winter crops, it should be placed to receive as much direct sun as possible
    in the winter. An hour or two is adequate in December, but the more direct sun
    the greenhouse receives, the faster the crops will grow.


    Whether the greenhouse ridge runs north–south or east–west isn''t important unless
    it is attached to another building. In that case, the glazed (transparent) side
    should face south as much as possible.


    Adequate ventilation: This is a very important feature! You will need to ventilate
    a greenhouse to cool it many more days of the year that might think.


    +   * Winter ventilation: No matter how cold it is at night, unheated greenhouse
    can easily reach temperatures over 95°F (35°C) on a sunny day in February. Wide
    swings from day to night are very stressful to plants. When daytime temperatures
    are too high, leaves grow soft, making them more susceptible to freezing and diseases.
    Plants do much better if daytime temperatures rise no more than 25°F (15°C) above
    night temperatures.


    +   * Summer ventilation: Without good ventilation, temperatures can easily exceed
    104°F (40°C) on summer days, even with vents and doors open. This high stress
    plants (which stop photosynthesizing) and also sterilize the pollen in tomato
    flowers, they won''t produce fruit.


    How hot it gets inside in full depends on the covering material. Glass allows
    in the most infrared radiation, which is what heats up the interior. Greenhouse
    grades of fiberglass or plastics are not quite as transparent, so they don''t
    heat up quite as much, but they still require excellent ventilation.


    ![](img/5a0c095115659a4ffa6ed6ae2899ac78_249_0.png)'
