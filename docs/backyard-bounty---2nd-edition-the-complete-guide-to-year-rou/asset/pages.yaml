  md: '![](img/5a0c095115659a4ffa6ed6ae2899ac78_192_0.png)


    # 5.4. Sunburn damage on cucumbers and squash appears as biscuit-colored spots
    and blotches on leaves and stems.


    The hardening off process is simple: get seedlings used to outdoor conditions
    gradually, starting with an hour in the sun the first day (or longer in cloudy
    weather). Move them back under glass or into light shade for the rest of the day.
    Over about a week, expose them to direct sun for longer periods, until they are
    outside all day.


    For hardy plants, such as onions, leafy greens, and cabbage, hardening also gets
    seedlings used to cooler temperatures. Small seedlings (for example, cabbage with
    fewer than five leaves) can get used to quite low temperatures. For seedlings
    larger than that, however, exposure to temperatures under 40° to 50°F (4° to 10°C)
