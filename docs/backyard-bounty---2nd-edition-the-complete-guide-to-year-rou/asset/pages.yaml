    # Crop Rotation


    Rotating crops is a method of managing pests and diseases by depriving them of
    their host plants for years at a time. The general practice is to leave three
    to five years between crops in the same family. For example, potatoes have been
    harvested, the same soil would not be planted again to potatoes or related plants
    for several years. Crop rotation is very effective for controlling root diseases
    and can help with managing a couple of root insects. Crop rotation is not effective
    for insects that feed on many different plants, such as wireworms or cutorms,
    or for leaf diseases, such as rusts or powdery mildews.


    Some books have planning garden crop rotations complicated, but it can be kept
    fairly simple. For a home garden, attempting to rotate all crops is not only unrealistic
    but also necessary. Only a few families of plants are critical to rotate because
    of the risk of diseases that live in the soil. Many other common vegetables, such
    as lettuce, spinach, and Swiss chard, are rarely troubled by soilborne diseases
    and can be planted anywhere, anytime, without worrying about rotation.


    The most important plant families to rotate in a home garden are the carrot, mustard
    (cabbage), nightshade, and onion families. They are most at risk from soilborne
    disease or root insects (see Table 2.2). Among the nightshades, potatoes bring
    the highest risk of disease to the garden,'
