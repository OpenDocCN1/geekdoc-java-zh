    # Controls for Common Insect Pests


    # Barriers for Insect Pests


    Rather than repeating details on using barriers in individual pest entries in
    the A to Z Insect Pests and Problems section, I have put the relevant information
    all together, below.


    Used correctly, barriers of all kinds are very effective at excluding insects
    from laying eggs on fruit and vegetables:


    +   Insect netting is used to cover entire fruit bushes and small trees to exclude
    apple maggot, currant fruit fly, cherry fruit flies, and spotted wing Drosophila.


    +   Insect netting or floating row covers are used over vegetable beds to protect
    carrots from carrot rust fly and cabbage family plants from cabbage root maggot.


    +   Bags of paper, organza, fine mesh, or sheer curtain materials are used to
    protect individual fruit or bunches of grapes from insects, birds, and other pests.'
