  md: '# Spinach


    If you have been frustrated by how quickly spinach bolts to seed, try sowing it
    in August. You can pick leaves all fall and some in the winter, depending on the
    weather. Overwintered plants grow a whole new crop of leaves starting in March
    and on through May. New Zealand spinach is a vigorous, unrelated tender perennial
    that produces fairly spinach-like leaves all summer (sow outdoors in June after
    soil has warmed).


    **Culture:** Spinach is sensitive to acid soil. Sow seeds ½ inch (1 cm) deep;
    thin plants up to 1½ inches (2 to 3 cm) apart each way. Seeds germinate best in
    cool soil; in warm soil, sow extra seeds to compensate for lower germination rates.
    Rapidly increasing day lengths in spring cause spinach to go to seed, as does
    heat stress, so late spring- and summer-sown plants don’t produce much. Sow in
    early to mid-August for the overwintering crop. Shade the seedbed during the germination
    period. Seedlings of most varieties stand up to late summer heat well, with only
    a few going to seed prematurely. Spinach does better in winter when it is protected
    from low temperatures and heavy rain under a plastic tunnel or cold frame or in
    a bed under the overhang of a roof.'
  merge: -1
  pgno: 462
- img_proc: true
  md: '![](img/5a0c095115659a4ffa6ed6ae2899ac78_463_0.png)


    **10.20.** Planted last August, growth is really taking off in March. By June,
    I have had enough spinach and am happy to see it going to seed!",


    **Harvest and storage:** Pick leaves from August-sown plants over the fall and
    winter. No matter how battered the plants look by February, from March through
    the End of May, they will produce a large crop of new leaves before going to seed.


    **Pests:** Spinach leafminer; downy mildew (see Table 2.1 for resistant varieties).


    **Varieties:** Long Standing Bloomsdale and related varieties (e.g., Bloomsdale
    Dark Green, Bloomsdale Savoy) are reliable, winter hardy; Giant Winter or Viroflex
    is well-suited to overwintering. Many disease-resistant hybrids are also available.


    **Saving seed:** High risk of cross-pollination. Pollen can travel a long way
    on the wind. If there is no spinach flowering in the area, allow your plants to
    set seed, and leave them until seeds ripen. Save seed from the last plants to
    bolt, not the first.'
