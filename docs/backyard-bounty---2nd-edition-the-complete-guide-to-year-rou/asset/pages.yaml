    # Planting Fruit Trees and Bushes


    Fruit trees and bushes need well-drained soil that has good fertility but not
    overly high in nitrogen. Soil that has been previously cultivated for a vegetable
    garden is ideal for dwarf fruit trees and may not need much in the way of amendments
    if it has been used as a garden for a few years (see Chapter 3 for managing soil).
    Blueberries must grow in acid soil, so do not add lime and avoid other amendments
    that raise the pH, such as bone meal and wood ashes.


    Spring planting is traditional and when nurseries usually have the largest choice
    of varieties, but November is an excellent time to plant trees and bushes on the
    coast. They have all winter to establish their roots, therefore will need less
