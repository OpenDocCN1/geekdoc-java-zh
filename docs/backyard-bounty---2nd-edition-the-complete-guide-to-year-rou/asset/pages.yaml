    # Growing Food in Containers


    Determined gardeners have found that it is possible to grow all kinds of crops
    in containers. Some food plants are more suited to container life than others,
    but you can grow pretty much anything if you really, want want to. Where late
    blight kills garden tomatoes too early for a crop, growing them in containers
    under the overhang of a roof (to keep the leaves dry and prevent infection) can
    be much more successful than planting them out in the garden.


    Plants with small root systems and those that produce a crop over a long season
    are ideal for container culture. These include tomatoes, peppers, and eggplants;
    cut-and-come again greens such as Swiss chard, kale, and perennial arugula; parsley
    and other herbs; strawberries; pole beans; cucumbers; and bush varieties of squash.
    Lettuce and other annual greens do well in containers because they have relatively
    short roots. They are short-lived, however, and go to seed in a few months, so
    plan on sowing them several times over the season.'
