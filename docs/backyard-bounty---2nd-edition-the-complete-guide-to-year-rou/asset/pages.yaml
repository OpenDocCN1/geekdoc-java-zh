    # Is It Necessary to Pasteurize Soil Mix?


    The purpose of heating soil to 140°F (60°C) is to kill soilborne diseases (mainly
    damping off). A soil mix made with finished compost, however, contains beneficial
    soil fungi that help suppress damping off, and these are also killed when the
    soil is heated. When I used to make seedling mixes, I actually had better results
    when I stopped pasteurizing the soil and concentrated instead of providing warm
