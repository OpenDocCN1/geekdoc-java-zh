    # 4. Use toxic and non-toxic controls. Many effective methods for managing pests
    do not involve pesticides. Even the “safe” pesticides are best avoided if possible
    because they can also harm beneficial organisms. Your toolbox of non-toxic controls
    includes:


    +   * Physical controls: These measures remove pests or kill them directly. For
    example, blasting aphids off plants with water sprays, pruning out diseased branches,
    picking off leaves that have insect eggs, or mulching to smother weeds are all
    physical ways to control problems.

    * Biological controls: Most insects have natural enemies that can be relied on
    to keep numbers down to non-damaging levels. Birds are important predators of
    insects, especially in the spring when they are feeding chicks, but most insects
    are kept in check by other insects and spiders. You can increase the number of
    beneficial insects in your garden by planting flowers that attract them (see below).

    * Pesticides: Most pesticides are chemicals (though a few microorganisms). Low-risk
    pesticides contain low-toxicity chemicals, such as soaps or compounds extracted
    from plants. These are only “safe” from the human point of view, of course, not
    for beneficial insects or other creatures. Most pesticides made from plants and
    other natural sources are permitted for use by certified organic growers, with
    certain restrictions.


    Some people make homemade mixtures on the assumption that these are safer than
    commercial pesticides. This is a mistake! Ingredients, such as soap, oil, salt,
    or mouthwash that don’t harm people, can damage or kill the plants you spray them
    on. And remember that any mixture that actually'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'works to control pests will also work to kill beneficial organisms, such as
    the insects that eat the pests or the “good” fungi that control disease-causing
    fungi.


    The best thing you can do is avoid using pesticides of any kind. When some type
    of action is called for, try non-pesticidal methods first, and use pesticides
    as a last resort. You can minimize the harm from pesticides by choosing the least
    toxic product that will do the job. For example, if insecticidal soap will work,
    use that instead of pyrethrins (a nerve toxin extracted from pyrethrum daisies),
    which are more toxic and last longer on leaves. If you are spraying insecticides,
    spray only the plants, or parts of plants, that need treatment. Spraying where
    it isn’t required isn’t just a waste of time and money; it also needlessly harms
    other organisms and can leave an odor that repels beneficial insects from returning
