  md: '# The Basics of Plant Growth


    You might be tempted to skip this bit, but I urge you to read on because so many
    crop problems that perplex gardeners have to do with growing conditions (weather,
    nutrients, irrigation) that affect plant growth, flowering, and fruiting. When
    plants do weird things—such as bursting into flower when they shouldn''t—we need
    to understand why, so we can avoid it in future.


    Photosynthesis in plants is a truly amazing process. It allows plants to take
    energy from sunshine, carbon dioxide from the atmosphere, and water from the soil
    and make it into sugars. Plants use these as building blocks to make fats, starches,
    proteins, plant hormones, and other compounds. Through a process called respiration,
    plant cells burn sugars to get the energy needed for growth and metabolism. If
    they are making food than they can use, plants store the surplus sugars and starch
    in storage organs, as roots, for later use. Some necessary elements, such as nitrogen,
    sulfur, calcium, and micronutrients, come from the soil, surprisingly, most of
    the weight of the solid material that makes up a plant is actually built out of
    carbon from the atmosphere, rather than elements from the soil.


    Water and nutrients move through a vascular system that reaches all parts of the
    plant. Water moving upward from the roots and evaporating from the leaves travels
    in the xylem vessels. Another set of vessels, called the phloem, carries sap with
    nutrients and metabolic compounds to other parts. This process, called translocation,
    moves food internally from a source, such as a photosynthesizing leaf, to a part
    of the plant that needs it for growth. Surplus food can also be translocated to
    storage organs, such as roots or fruit. There is one more interesting place that
    plants send their sugars and starches: they leak a significant amount of what
    they make into the soil around their roots. This sounds outlandish, but plants
    actually'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'benefit lot by by providing food for beneficial soil bacteria and fungi around
    their roots (more on this interesting relationship in Chapter 3).


    # Sunlight Is Essential


    To make a very complicated story simple: exposure to sunlight is vital. Vegetables
    and fruits need bright sunlight for as long as possible to produce the building
    blocks that make leaves, seeds, roots, and fruit. Leafy leaves can grow adequately—though
    slowly—with half a day of direct sun each day, but most plants do much better
    with eight hours of direct sun in the summer. Gardens in open areas with even
    longer sun exposure will grow even faster, as they have more hours of light to
    synthesize.


    The efficiency of photosynthesis depends mostly on light levels, but it also depends
    on temperature. The best range for photosynthesis is 50° to 85°F (10° to 30°C);
    photosynthesis stops when it gets too cool (below 40°F or 5°C) and when it gets
    too hot (above 95°F or 35°C) for most temperate zone plants.


    # Plants Are Mostly Water


    Water is an essential ingredient for plant growth and survival. Evaporation from
    the leaves pulls moisture up through the plant, moving water from the roots to
    the leaves and shoots (called transpiration). This flow carries nutrients from
    the soil up through the stem to the photosynthesis “factories” on the leaves.
    When the water reaches the leaves and evaporates, it cools the plant. Cooling
    is essential to prevent leaf temperatures from rising high and damaging leaf cells.
    Almost all of the water (97%) taken up by plants passes into the atmosphere in
    this process.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/5a0c095115659a4ffa6ed6ae2899ac78_22_0.png)


    **1.2. With energy from the sun, carbon dioxide from the atmosphere, and water
    and minerals flowing upward from the roots, plant cells produce the building blocks
    that become leaves, flowers, and seeds.


    Plants must have a film of water around their roots so nutrients from the soil
    can pass into the cells of the roots. If this film dries out, even temporarily,
    fine root hairs die. The movement of nutrients from the soil and through the plant
    ceases and growth stops. Because the leaves also lose their cooling system when
    evaporation stops, it means that, in hot weather, leaf cells can (rapidly!) overheat
    in the sun and die. Plants may be so severely stressed or injured that, even if
    they survive, they may never be as productive as they could have been.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Soil Has a Supporting Role


    The soil physically holds up plants and anchors them. It is the source of water
    and essential major and minor elements needed for photosynthesis and respiration.


    A healthy soil contains a complex, interdependent community of organisms that
    range in size from microscopic bacteria to (relatively) huge earthworms. This
    vitally important community includes decomposers that digest organic matter and
    release nutrients in forms that plants can use, fungi that penetrate root hairs
    and ferry nutrients into root cells, and bacteria that colonize the surface of
    soil and produce compounds that actively protect plants from pathogens. Soil bacteria
    are also the main diet of protozoa (single-celled microorganisms), and in turn,
    protozoa are the main diet of earthworms.


    The larger soil inhabitants include insects, mites, nematodes, earthworms, slugs,
    and snails, crustaceans (e.g., pillbugs), millipedes, and centipedes. While a
    few of these characters attack plants, our gardens couldn''t do without the others
    because they play so many roles essential to the cycling of nutrients, aerating
    and mixing the soil, and keeping plants healthy. The soil surface is also the
    hunting ground for predators, such as large purplish-black beetles, centipedes,
    and many kinds of spiders.


    # Plants Need Nutrients


    Crop plants need some elements in larger quantities for growth. These major nutrients
    are: nitrogen, phosphorous, potassium, calcium, magnesium, and sulfur. The first
    three elements are main ingredients in fertilizers. Local soils usually also need
    additions of calcium, sometimes magnesium, but rarely sulphur to grow crop plants.


    A second group of nutrients is essential too, but in extremely small amounts.
    These micronutrients or trace elements include iron, manganese, chlorine, zinc,
    boron, molybdenum, and copper. The tricky thing about this'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'group is that most toxic to plants in large amounts or if soil conditions

    (such as acidic soil) make them too easily available to plants.


    Chapter 3 covers nutrients from the soil in greater detail and describes

    how you can make them available to the roots of plants.


    # How Plants Grow


    Plant growth depends on external factors such as weather, sunlight, and

    nutrients, as well as on the internal workings of the plants.


    # Annuals, Biennials, Perennials


    Vegetables are mostly either annual (go to seed in the first year of growth)

    or biennial (go to seed the second year). Many crops (lettuce, radishes,

    mustard greens, beans, and squash) are annuals wherever they are grown,

    means they will flower and produce seeds in the same summer left

    in the garden long enough. Practically speaking, however, in the Pacific

    Northwest most garden vegetables are treated as annuals, which means we

    hvest crops the same year we sow the seeds.


    Crops such as carrots, cabbage, kale, leeks, beets, Swiss chard, and

    parsley are biennials. Left to their own devices in the garden, they would

    ave a two-year life cycle. From a spring planting, they grow all summer

    without going to seed. After spending the winter in the garden, they send up

    a flower stalk the following spring. The seeds ripen, and the plant dies in its

    second summer. The hardy winter broccoli and winter cauliflowers are also

    bennials; they are sown in June or July, but don''t produce heads until early

    the following spring. For biennials, the cold chill of winter is the signal that

    them them they are beginning their second year.


    Some plants that we treat as annuals, such as tomatoes and peppers, are

    actually perennials; in a subtropical climate or heated greenhouse, they

    could continue produce flowers and fruits year after year. Tender herbs,

    such as sweet basil and sweet marjoram, are also perennials, but are'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'often grown as annuals because they are not hardy enough to survive winter
    outdoors.


    There are a few hardy perennial vegetables, such as artichokes, French sorrel,
    and asparagus. And of course, all fruit trees, grapes, berries, and rhubarb are
    hardy perennials in the garden.


    # Effects of Temperature


    Plants grow best when it is warm; when it turns colder, growth slows, then stops
    altogether. The cut-off point at which growth stops differs among plants. Frost-hardy
    vegetables continue to grow (very slowly) even in the winter, whenever temperatures
    rise enough for photosynthesis to continue. Heat lovers, as corn or melons, however,
    pack in and die. Eventually, when the days are shortest and temperatures are cold
    enough, all plants stop growing.


    Perennials, as fruit trees, have a natural dormancy in the winter. They drop their
    old leaves in the fall and withdraw the sap from their stems so they can survive
    very cold weather without damage. They won''t suddenly start to grow if there
    is a brief period of warm weather in midwinter because they also need the lengthening
    days of spring to break the dormant state and stimulate growth. Leafy vegetables,
    on the other hand, are just resting in the cold; they can take advantage of warm
    spells in a mild winter to resume growing a bit.


    How well plants withstand winter temperatures depends on when, how it turns quickly,
    and how long it turns cold. As days get shorter and temperatures gradually drop,
    plants harden off, becoming used to the cold. If there is unusually cold weather
    in late November, before plants have hardened off completely, they can be injured
    by temperatures that wouldn''t hurt them in midwinter. In spring, if there has
    been mild weather for a month and plants start to grow again, a late cold snap
    can cause far more injury than the same temperatures would have done earlier.'
