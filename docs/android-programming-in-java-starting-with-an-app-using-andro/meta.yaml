  md: '# The IDE


    Although there looks like a lot to master in the Android Studio user interface,
    most of it you will only visit occasionally. The key things to notice are that
    moving from left to right you have:


    +   - The Project window

    - The tool Palette and the Component tree window

    - The Designer or Layout Editor

    - The Attributes window


    Most of the time you will be using the Project window and the Attributes window.
    You will also see different editors depending on what sort of file you selected.
    In this case you have by default a layout file, `content_main.xml`, selected and
    hence you have a layout editor in the middle of the screen.


    Before we go into layout, which is one of the main topics of this book, it is
    important that you know a little about the file structure of a project so that
    you can navigate to its different parts.


    # Basic Project Structure


    When the project has finished building all of the files created can be viewed
    by opening the Projects tab. The main thing to notice is that there are a great
    folders and files:


    ![](bbox=[0.313, 0.547, 0.666, 0.803])


    It seems almost unbelievable that the simplest Android app you can create involves
    so many files.'
  merge: -1
  pgno: 18
- img_proc: false
  md: 'Don''t panic. Most of the files that have been created are auto-generated and
    most of the time you don''t need to know anything about them, let alone open or
    edit them. In fact, opening and editing auto-generated files really isn''t a good
    idea.


    So let''s focus on the files that matter to us.


    For our simple program there are only two important files. One of them determines
    the behavior of the Activity:


    ```

    MainActivity.java

    ```


    The other determines the visual appearance, or View, of the app:


    ```

    content_main.xml

    ```


    You can set which Activity is the one the system starts, but by default it is
    the single activity that you created and named when you set up the project. You
    can change the default names, but for the moment leave them as you are.

    The java directory is, from your point of view, where most of the construction
    of your app occurs make sure you know where it is. The res directory is where
    you store all of the resources, layouts, bitmaps, etc, but that your app needs.


    So while things looked complicated at the moment the two projects that matter
    to you, and your project, are MainActivity.java in the java folder and content_main.xml
    in the res folder.

    The two other folders in the java folder are concerned with creating tests for
    your program. This is not nothing that we need to worry about when first starting
    to write Android apps.


    # Anatomy of an Activity


    An Android app is made up of one or more Activity classes.

    You can think of an Activity as being something like a web page complete with
    HTML to determine what displays and JavaScript to determine what it does.


    In the case of an Activity the layout is determined by the XML file in resource
    (res) folder, this is often called the View, and the behavior is determined by
    the code in the java folder.


    The XML be thought of as a markup language much like HTML or XAML. It defines
    an initial layout for the screen when the app first runs. It is possible to generate
    new layout components at runtime from the Java file. In fact, if you really want
    to, you can dispense with the XML file and generate everything from code, as you
    will will discover the XML markup approach is much the best way to do the job
    because of the availability of the Designer.'
  merge: -1
  pgno: 19
- img_proc: false
  md: 'So to be 100% clear in a Java project:


    +   - The java file contains the code that makes your app behave in particular
    ways.

    - The .xml layout file contains a definition of the initial UI, the View, of your
    app.


    # Hello Layout Designer


    Let''s take a look at the two files that have been generated for our initial Hello
    World application, beginning with the XML layout. Double click on the content_main.xml
    file in the Project tab and the file will open (if it isn''t already open). If
    it is already open you can also select its tab displayed above the editor area.
    You can select any file that is open for editing by selecting its tab.


    You can work with the XML directly to define where all the buttons and text go,
    and later you will learn how to edit it when things go wrong or fine tune it.
    However, Android Studio provides you with a very nice interactive Layout Editor,
    which throughout this book is referred to as the Designer and this is worth using.


    As you become more experienced the idea of switching between a design view and
    an XML view will become second nature. Think of the interactive editor as a very
    easy way of generating the XML that otherwise would take you ages to get right.
    If you look at the bottom left you will see two tabs – Design and Text:


    ![](bbox=[0.396, 0.584, 0.663, 0.703])


    You can switch between editing the XML as text, and editing it in the drag-and-drop
    designer simply by clicking on the tab. If you now click on the tab the window
    will display the Designer, but be patient the first time you do this it might
    take a few moments.'
  merge: -1
  pgno: 20
