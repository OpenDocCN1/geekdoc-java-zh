  md: '# # Chapter 1


    # # Getting Started With Android Studio


    Android represents a big potential market. It is also the most open of the "big"
    phone and tablet platforms. You can write a program for an Android and let your
    friends have a copy, keep it to yourself or put it on sale in an app store. Android
    phones and tablets are comparatively cheap and this makes it easier to start.
    What is even better, all the tools you need to create an Android app are free.
    You don''t have to pay anything to create, or distribute, your Android apps. If
    you want to sell them using a well known marketplace where to pay - there is a
    one-time fee of $25 to register for Google Play, but you don''t have to use any
    particular distribution method.


    All stands between you and your Android app is your imagination and programming
    ability. I can''t much to improve your imagination, but I can help with the programming
    side of things. If you are new to Android programming this is the place to start.


    In this book I will show you the fundamentals of Android programming. Not the
    tips and tricks, but how to think about what is going on. You''ll be introduced
    to the general principles that will make it possible for you to master anything
    you encounter that is new in the future. It''s not possible to cover all of Android
    in one book as the subject is very large. Instead we focus on the basics of creating
    a User Interface (UI) as all apps have to have some way of interacting with a
    user.


    There are many ways to create an Android app but Google''s Android Studio is easy
    to use Android IDE – Integrated Development Environment – and it is not the recommended
    way of doing your job.


    Before Android Studio you had to use the Eclipse IDE and set up the SDK and other
    pieces of software needed. This wasn''t difficult, but Android Studio eliminates
    extra steps and makes programming Android easy. Put simply, it is the way of the
    future and so worth your investment in learning it.


    With the release of Android Studio stopped work on the Eclipse plugin and this
    means that Android really is the only way to develop apps from now on.


    You can get started in a few minutes and by the end of this chapter, have your
    first working Android application.'
  merge: -1
  pgno: 10
- img_proc: false
  md: '# The Language Choice


    With the release of Android Studio 3 you now have a choice of programming in Java
    or Kotlin. The advantage of Java is that it is a well known and well supported
    language. In Android Studio 3 you can also program using features from Java 8
    including lambda functions. This greatly simplifies tasks such as event handling,
    and we will examine how to do event handling in Java without lambda functions,
    using them is going to be the norm.


    As the entire Android library is written in Java you really can''t avoid it. The
    alternative Kotlin is very easy to use and backwards compatible with Java. There
    is very little risk in using it, but it is also helpful to know enough Java to
    work with its existing code.


    The bottom line is that when Kotlin is an easier language to use, there are advantages
    in knowing and using Java.


    # What You Need to Know


    To get the most out of this book you need to be able to program in a modern object-oriented
    language. You''ll have a head start if you already know Java, but C+, C#, Visual
    Basic or anything similar are close in spirit to Java for you to be able to cope.
    You might need to look up about the specific features of Java, but most of the
    time it should be obvious, or obvious with the help of a few comments.


    It''s not necessary to be an expert programmer because for a lot of Android programming
    you are simply using the features and facilities provided. That is, a lot of Android
    programming is just a matter of the rules.


    However, if you hope to produce something unique and useful you will at some point
    have to add something of your own – and here creativity and skill are required.
    So you might not need to be an expert programmer to get started, but by the time
    you create your amazing app. Fortunately practice is a good teacher and learning
    to make the most of Android Studio will actually help you to code.


    # Making a Start


    I''m not going to spend a lot of time explaining how to install Android Studio
    in a step-by-step way as the Android website does a good job and it is more likely
    to be up-to-date. It is worth however, going over the basic principles.


    Download the Android Studio package from Android Studio Home page: https://developer.android.com/studio/


    Install Android Studio which also installs all of the Android SDK and tools you
    will need.'
  merge: -1
