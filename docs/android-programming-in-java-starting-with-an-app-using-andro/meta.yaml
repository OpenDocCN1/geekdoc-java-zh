    # A Custom ArrayAdapter


    If you only want to display a String in each row you can use the standard ArrayAdapter
    and the object''s toString method. You can even customize the object''s toString
    method to display something different from the default, but it is just a String.


    If you have an array of general objects and want to display multiple items from
    each object, or items which are not Strings, then you need to create a custom
    ArrayAdapter. This is not difficult, although there are one or two advanced points
    to take note of.


    For this first example, let''s keep it as simple as possible. First we need some
    objects to hold the data we are going to display - a record type, say, with a
    field for name and one for number in stock. You could also add a photo of the
