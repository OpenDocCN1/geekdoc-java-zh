    # # Barriers


    Notice that this is only available in ConstraintLayout 1.1.0 or later – see the
    start of the chapter for more information.


    Barriers solve many ConstraintLayout problems that would otherwise be difficult
    to tackle, but they are not something you are likely to use every day.

    A Barrier is a smart guideline. You place a Barrier on the design surface and
    drag-and-drop any number of components onto it – most easily within the Component
    Tree. This works in the same way as the Group component in that the Barrier is
    not a container of any sort, but simply keeps a list of components that it is
    going to work with. The Barrier also has a direction and positions it to align
    with the component in its list that is the most extreme in that direction. That
    is, if the Barrier is set to right the right edge of the component in its list
    that is furthest to the right. If you think of the group of components that the
    Barrier has in its list as being surrounded by a box that contains them, a bounding
    box, then another way of thinking of this is that the Barrier will position itself
    on one of the edges of the bounding box – the right-hand edge in our example.


    Like a Guideline you can position other components relative to it by setting constraints
    to it. You can see that this allows you to position components so that they are
    to the far right, left, top or bottom of a group.'
