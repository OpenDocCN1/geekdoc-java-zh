  md: "# Timer and Threads\n\nNow we come to the inner workings of the animation.\
    \ We need a Timer object that runs a function every many milliseconds:\n\nTimer\
    \ timer-new Timer();\n\nThe timer object has a range of schedule functions which\
    \ run a function, actually a TimerTask, at different times. The one we need is:\n\
    \ntimer.schedule(TimerTask, delay, repeat);\n\nwhich runs the TimerTask delay\
    \ milliseconds and every repeat milliseconds after that. The timings aren't accurate\
    \ and it could take longer than specified for the TimerTask to be run.\n\nA TimerTask\
    \ object has a run method that is called by the timer at the interval specified.\
    \ At this point you are probably thinking that we can and use a lambda to specify\
    \ the run method. If you try it you will find it doesn't work. The reason is that\
    \ TimerTask is a class and not all its methods are abstract. It isn't SAM and\
    \ you can't easily use a lambda to define its run method.\n\nThe simplest way\
    \ to create the TimerTask is to use an anonymous class:\n\n```\ntimer.schedule(\n\
    new TimerTask(){\n@Override\npublic void run() {\n  update();\n}\n},0, 10 );\n\
    ```\n\nThis creates a new TimerTask and overrides its run method. The run method\
    \ is called when the Timer is triggered. All it does is to call a new function\
    \ update, which we have yet to write, that does the update to the ball's position\
    \ etc. The final two parameters specify a 0 millisecond delay in triggering the\
    \ first call and then 10 milliseconds as the repeat period. That is, update will\
    \ called every 10 milliseconds or so. If the processor is busy doing something\
    \ else it could be more than 10 milliseconds between repeats."
