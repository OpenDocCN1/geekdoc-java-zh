  md: 'controls into the FrameLayout and select one to visible using its Visible property.


    More commonly a GridLayout is used simply as a placeholder for a component of
    a layout that isn''t specified until some time later. For example, if you make
    use to display, see the companion book Android Programming: Mastering Fragments
    & Dialogs, to create part of a UI or read in a list of things to display, then
    often you need a container for the new component to be present in your static
    layout. A LinearLayout does the job very efficiently.


    +   - Use a LinearLayout when you need the simplest Layout that will hold one
    or a small number of components without the need for much in the way of positioning
    or sizing.


    # LinearLayout


    The next we need to consider is the LinearLayout. This is a simple layout that
    can be used to do a great deal of the work of organizing a UI. In fact once you
    start using LinearLayout, it tends to be the one you think of using too often.
    You can use a LinearLayout as the base layout, replacing the default ConstraintLayout
    that Android Studio provides, or you can place a LinearLayout within the ConstraintLayout.


    In Android Studio LinearLayout occurs twice in the vertical and as a horizontal
    LinearLayout. The difference, however, is just the setting of the orientation
    property to horizontal or vertical. In other words, you can swap a horizontal
    and vertical linear layout with a simple property change.


    The horizontal LinearLayout acts as a row container and a vertical LinearLayout
    acts as column container. You can use nested Layouts to build up something that
    looks like a table, but if this gets complicated it is better to use ConstraintLayout.
    Nesting layouts this is also inefficient as the rendering engine has to compute
    the layout multiple times to get right. The advice is to use a ConstraintLayout
    and avoid nesting.


    If you place a LinearLayout on the ConstraintLayout then you can position it like
    any other control. If you place other controls inside it then they will stack
    horizontally or vertically to form a column.


    This sounds easy but there are lots of ways to use a LinearLayout.


    For example, if you put a horizontal and vertical LinearLayout in the ConstraintLayout
    then how they behave depends on what you set their layout_width and layout_height
    to. If you set it to wrap_content then the two Layouts act like a horizontal and
    vertical panel of controls, i.e. you can move all of the controls as a block:'
