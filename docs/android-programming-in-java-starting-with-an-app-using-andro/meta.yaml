- img_proc: false
  md: '# Summary


    +   All of the UI components are derived from the View class.


    +   An Activity can host and display a single instance of the View class set by
    one of its setContentView methods.


    +   You can create instances of View objects in code and set them to be displayed
    by the Activity.


    +   A Layout or ViewGroup object is a View object that can contain many View objects,
    so creating a sophisticated layout that the Activity can display.


    +   Each Layout has its associated LayoutParams class, which is used by each View
    object to control how it is treated within the layout.


    +   You generally have to create an instance of the LayoutParams class, set the
    parameters you want to determine, and then set the instance as the LayoutParams
    of each View object that needs to use via the setLayoutParams method.


    +   The use of Layout containers results in a View hierarchy, i.e. a hierarchy
    of View objects which are displayed by the Activity.


    +   You can also code the View hierarchy using XML. Each XML tag corresponds to
    a View object and are nested to define the hierarchy. The properties of the objects
    are set within the XML as attributes. Layout properties are treated in the same
    way but with layout, as a prefix.


    +   When the time comes for the View hierarchy to be assigned to the Activity,
    the XML file is converted into a nested set of View objects by the use of an inflater
    method. This simply reads the XML and converts each tag to an object and sets
    the object''s properties.


    +   To find particular View objects in an inflated hierarchy the usual approach
    is to assign an id and use the findViewByIdById method.'
