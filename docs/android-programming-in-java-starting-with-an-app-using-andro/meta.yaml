  md: '# Chains


    A recently introduced feature is the ability to set bias constraints between components
    as well as to the parent container. That is, you can set pairs of constraints
    between components that work in the same way as a bias constraint. In doing so
    you create what is now called a "chain" of components. The reason for introducing
    chains is to make it easier for LinearLayout, to name lines or columns of components
    with proportional spacing.


    Creating a chain is a slightly mysterious process. If you want to create a horizontal
    chain of three Buttons the first task is to arrange them roughly into a line:


    ![](bbox=[0.348, 0.363, 0.671, 0.463])


    If they aren''t in a reasonable line the constraints will be applied separately
    to each component. Select all three by dragging a marquee around the three and
    then right click while all three are selected and use the Chain, Create Horizontal
    Chain:


    ![](bbox=[0.313, 0.573, 0.746, 0.723])


    To create a vertical chain you arrange the components in a vertical column, select
    them all and right click and use the Chain,Create Vertical Chain command. Everything
    works in the same way but rotated by 90 degrees.'
