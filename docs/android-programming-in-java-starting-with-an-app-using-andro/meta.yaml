- img_proc: false
  md: 'All you have to do is enter a resource name and its value – the rest of the
    entries can be left at their defaults, their meaning will become clear as we proceed.


    When you click OK you will see the Attributes window with the entry:

    @string/Greeting


    This is a reference to your newly created resource. You will also see the string
    that you have specified as the button''s caption. You can now reuse the string
    by entering @string/Greeting anywhere the "Hello World" string is required – of
    course it has to be used with a property that accepts a string. If you change
    the definition of a resource then obviously all of its strings are updated.


    The second way of creating a string resource is to edit the resource XML file.
    If you look at the file strings.xml in res/values directory you will find it contains:


    ```

    <resources>

    <string name="app name">Resources</string>

    <string name="hello world">Hello world</string>

    <string name="action settings">Settings</string>

    <string name="Greeting">Hello World</string>

    </resources>

    ```


    You can see the hello world string that we have added and some other strings that
    Android Studio creates automatically for you, including another hello world string
    which is used in the initially generated UI. You can edit the resource file directly
    or use the Resources dialog to create and edit existing string resources.


    # What are Resources?


    +   - Resources are any data that your program wants to use.


    Resources are compiled into your program''s executable ready to be distributed
    to your end users as part of your app. For a string this doesn''t seem particularly
    useful, after all you could just easily use a string in code, but for other types
    of resource it can be the only way to get the data included in the app''s executable.


    For example, drawables, a range of different types of graphics objects, can be
    included as resources. If you include a .gif file as a resource then .gif file
    is incorporated into your app by the compiler. This means you don''t have to provide
    the gif as a separate file and you don''t have to worry about where it is stored.
    Notice, however, adding a .gif file to your app increases its size.


    All resources are stored in folders within the res directory. The folder name
    gives the type of the resource and, as we shall see, can specify when the resource
    is to be used.'
