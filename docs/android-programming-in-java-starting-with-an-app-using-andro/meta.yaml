  md: 'If you now set the second Button''s layout_weight to 1 then assigned the unused
    space

    will be shared between the first two Buttons equally:


    ![](bbox=[0.319, 0.14, 0.68, 0.263])


    You can guess what would happen if we now set the third Button''s

    layout_weight to 1, the space would be shared equally and all three buttons

    would be the same size. If, however, the first button was given a weight of 2

    then the unused space would be shared out in the ratio 2:1:1 and so on.

    More interestingly what do you think would happen if you assigned a fixed

    width to the third Button? The answer is simple. If the third Button''s

    layout_weight is zero then it is set to the width specified and the other two

    buttons get the unused space. For example setting the third Button to 350dp

    gives:


    ![](bbox=[0.363, 0.477, 0.666, 0.7])


    However, if the third button has a layout_weight set then it will probably

    change its width because it gets a share of the unused space just like the other

    buttons. In other words, when you set a non-zero layout_weight a control can

    change its size even though you have set a specific size for it. This leads to

    the idea of "measured size" and "actual size". In the case of the third Button

    measured size is 350dp but if its layout_weight is non-zero then its actual size

    on the screen will be different - it will be allocated some of the unused

    space.'
