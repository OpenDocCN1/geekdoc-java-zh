  md: "event handler if you want to keep the code that restores the app's state kept\
    \ out of the onCreate event handler.\n\nFor example, you could have written:\n\
    \n```\n@Override\nprotected void onRestoreInstanceState(Bundle savedInstanceState)\
    \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    if (savedInstanceState\
    \ != null) {\n        textView.setText(savedInstanceState.getCharSequence(\"myText\"\
    ));\n    }\n}\n```\n\nDo remember to call the super.onRestoreInstanceState if\
    \ you want the system to restore the state of the UI in the usual way. There are\
    \ put and get methods for a range of standard data types. All simple types, byte,\
    \ integer and so on, are supported, as strings, arrays and other simple data structures.\
    \ You can also create your own classes that can be stored in a Bundle by implementing\
    \ the Parcelable. Notice you can save arbitrary data, and not just data for the\
    \ layout. You can also create your own Bundle and make use of it for storage,\
    \ persistence and for transferring data to other parts of a program. There are\
    \ many standard classes the Bundle doesn't support. In these cases you will have\
    \ to make your arrangements to save data to storage.\n\nOften you need to make\
    \ sure that your app maintains its state between system restarts by using the\
    \ savedInstanceState Bundle object. This approach also reduces much of the practicality\
    \ of life cycle management to implementing the onSaveInstanceState and onRestoreInstanceState\
    \ event handlers. This is much simpler than having to worry about all the different\
    \ life cycle events.\n\nAs an exercise, you can now go back to the iCalc example\
    \ in Chapter 3 and make its display and current value persist through a scroll\
    \ rotate.\n\n# Complex UI Elements\n\nOne of the traps waiting for you is the\
    \ problem of exactly what is automatically saved and restored. For example, at\
    \ the start of this chapter we had the story of an app that lost the user's data\
    \ when it was rotated. Given we now know of the auto-saving and restoration of\
    \ user modifiable UI elements, you might be wondering how this could happen?\n\
    \nThe answer is that the programmers of the app had probably grown accustomed\
    \ to the automatic persistence of UI state and didn't have to check that rotation\
    \ had no effect. It did have an effect because the form was being downloaded from\
    \ a website and displayed in a WebView control. A WebView control is persisted\
    \ by the system, but it reloads the page when it is restored. This means that\
    \ on rotation the page was empty and the user's data was lost."
