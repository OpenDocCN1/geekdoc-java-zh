  md: '# Summary


    +   - Containers like ListView work together with an adapter to display data.

    - The adapter accepts a data structure – usually an array or a list – and converts
    any data item into a View object that represents the data.

    - You can handle a selection event to find out what the user has selected.

    - The View object can be complex with an outer container and any number of child
    objects.

    - The basic ArrayAdapter uses each object''s toString method to provide the data
    to display in a TextView object.

    - If you want to display something other than the result of calling toString,
    you need to implement a custom ArrayAdapter. To do this you have to override the
    inherited getView method.

    - The ListView is clever enough to provide you with View objects to recycle –
    although you don''t have to if you don''t want to.

    - The ViewHolder pattern can make your use of nested View objects more efficient.'
