  md: '# The Component Tree


    If you look to the bottom left corner of Android Studio in Design mode, you will
    see a window called Component Tree. This is almost self-explanatory and hardly
    needs comment other than to draw your attention to it. Notice that you can see
    the tree structure of the layout starting at the Layout container. You can see
    that the default layout is ConstraintLayout and you can see all of the other components
    correctly nested within their parent containers:


    ![](bbox=[0.266, 0.263, 0.683, 0.435])


    Notice that you can select and delete layout elements directly in the tree. This
    is useful when you have a complex layout that has gone so wrong that you are finding
    it hard to select components reliably. You can also move elements around in the
    tree to change the way that they are nested.


    # A Simple Button Example – Baseline Alignment


    As a simple demonstration, let''s first place a Button on the Designer and use
    the Infer Constraints to apply some constraints. If you find it difficult to get
    a rough position and then enter the exact matches always remember that you can
    move to the Attributes window and enter them directly.


    Next place a TextView widget on the Designer. In this case the alignment we want
    for the text to be on the same line as the text in the Button. This is a baseline
    alignment and one of the more sophisticated alignments, but if you have the Designer
    zoomed so that you can see the full area of the screen chances are all you will
    be able to do is align to the top or bottom of the Button.'
  merge: -1
  pgno: 65
- img_proc: false
  md: 'If you look at the TextView representation in the Designer, you will see that
    there are two small icons below it. The first removes all of the constraints from
    the component and the second makes the text baseline, a small elliptical box,
    appear inside it:


    ![](bbox=[0.303, 0.227, 0.696, 0.375])


    This represents the text in the TextView and you can use it to set up a baseline
    constraint. All you have to do is select the TextView and hover the cursor over
    the elliptical box until it is highlighted. New drag from the elliptical box to
    the baseline of the text in the button, or any component that you want to align
    the baseline with:


    ![](bbox=[0.303, 0.561, 0.736, 0.709])


    That''s all you have to do. After this the text in the button and the text in
    the TextView will share a common baseline. If you move the Button then the TextView
    will move with it. If you want to remove the baseline alignment then all you have
    to do is select the TextView, hover over the elliptical box, and click when the
    remove baseline constraint appears.'
