  md: '# Constraint Properties


    As you might guess, there are properties very similar to those used by the RelativeLayout
    which set the constraints for a ConstraintLayout. To see all of the properties
    you have to click on the View properties icon at the top right of the Attributes
    window – the double arrow.


    For example, if you look in the Attributes window you see:


    ```

    Constraints

    Left_toLeftOf

    ```


    This prompts you to supply the id of the other control being used in the alignment
    – left-hand side to left-hand side in this case. There are similar constraints
    for the other possibilities. For example:


    and so on.


    It is also worth understanding that, in allowing you to set the position of a
    component by simply dragging it to the location you want, the Designer is working
    out how to set multiple properties correctly. You could do this manually to get
    the same effect, but the Designer does it simply from where you have positioned
    a component. This is why it is easier to let the Designer set the properties for
    you.


    # Troubleshooting


    The ConstraintLayout provides a way of creating reactive layouts that adjust to
    the size of the screen. However, doing this effectively is difficult. The amount
    of intelligence required goes well beyond the Infer Constraints tool. It may even
    be beyond a human. A simpler, but more work-intensive way, is to provide a separate
    layout for radically different screen sizes and use constraints to make small
    adjustments.


    The ConstraintLayout library uses a linear constraint solver to work out the positions
    of all of the components. This then produces a layout that is used in your app
    is intended to be fast and efficient. Currently the system and the Designer are
    undergoing rapid change and development. There are many features that don''t quite
    work as advertised, and many features don''t have the facilities needed to make
    them easy to use.


    However, ConstraintLayout is the way of the future according to the Android development
    team.


    Given the advantage of producing a single layout that caters for a variety of
    screen sizes and orientations it is worth persevering with. However, it is very
    easy to get into a complete mess in the Designer.'
  merge: -1
  pgno: 159
- img_proc: false
  md: 'One very common problem is for components to apparently go missing. This is
    usually because they are on top of each other or positioned off the screen. The
    easiest way to sort this problem out is to go to the Attributes window and manually
    reset one of the positioning properties.


    You will also find the following tips useful:


    +   - Use positioning relative to another component if it makes logical sense.
    That is, if you have a text entry component then it makes sense to position its
    accept button relative to its right-hand side.

    - If you position everything relative to the parent container then you effectively
    have an absolute layout that specifies the exact and immutable position of everything.

    - If the size changes then it is possible that components will overlap one another
    if there isn''t enough space. Always make your layouts plenty of space spare.

    - A good strategy when working with a group of components is to pick one that
    you position relative to the container, then position all other components relative
    to it to ensure that you can move the group and keep alignments.

    - Remember that some components can change their size as well as location and
    can modify the position of components positioned relative to them.

    - Automatically generated constraints sometimes work, but they are rarely logical
    as a set of manually created constraints. If you plan to make use of the layout
    in the future, then it is worth creating a set of manually applied constraints.

    - Use Infer Constraints incrementally as you add components and then manually
    modify what it creates to be more logical.

    - It is more realistic to produce a separate layout resource for small to medium-sized
    screens and one for large screens.'
  merge: -1
  pgno: 160
- img_proc: false
  md: '# Summary


    +   - The ConstraintLayout is the layout of the future and the new Designer was
    created to work best with it.

    - There are two automatic constraint tools – Autoconnect which works out constraints
    for a single component, and Infer Constraints which works out any missing constraints
    for the entire layout. Neither tool is currently particularly useful.

    - You can clear all of the constraints in a layout, or just those on a single
    component or a constraint at a time.

    - Constraints can be applied from a component to the parent container and act
    like absolute positioning.

    - You can set default margins to make positioning components regular.

    - Components can be positioned relative to another component.

    - You cannot set negative margins.

    - You can align text baselines.

    - Bias constraints allow you to set positions that divide the space available
    in a specified proportion.

    - Chains provide some of the features of a LinearLayout. For example, you can
    use a chain to distribute components across the available space.

    - Guidelines can be added to a layout and components can be positioned relative
    to them, even though they don''t appear in the final layout.

    - Groups can be created which allow you to set the visibility of all of the components
    in one go.

    - You can set the size of a component absolutely or to be determined by the content.
    In addition, you can allow a pair of constraints to determine the size.

    - An Aspect Ratio Constraint can set one dimension as the ratio of another.

    - A Barrier is a smart guideline that tracks a specified group of components and
    is positioned at the most extreme edge of the group in a specified direction.
    You can position other components relative to the Barrier.'
  merge: -1
