  md: '# Chapter 3


    # Building a Simple UI


    By this point in you understand how the Activity and the View fit together to
    create a simple application, but the Android UI is more complicated than most
    because of its need to cope with a range of very different screen sizes and orientations.
    In this chapter we look at the problem of layout and working with the UI framework
    and on the way we''ll build a calculator app.


    When building an Android app you will spend far more time than you could possibly
    imagine perfecting the UI. So it is important that you master the basics so that
    you can move on to code that does more interesting things.


    The learning curve with any UI framework is more or less the same. First you have
    to find out what constitutes an application that you can run, i.e. where the code
    is? Android''s case this is an Activity.


    Next you have to work out how UI components are represented, how you can create
    them and how to hook up the UI with the code. In Android''s case this is a matter
    of a hierarchy of View objects and hooking up with the code is a matter of finding
    the objects representing each UI component and adding event handlers.


    Once you have the basics, you have to start exploring what components have been
    provided to build a UI. In general this varies from the extremely simple - the
    Button, for example - to complete applications in themselves - the ListView, for
    example. It would take a long time to make all of them, but what most programmers
    do is make sure that they can use the basic components and then find out about
    the bigger sophisticated components when needed. The good news is once you know
    how one component, even the simplest, works most of it generalizes to bigger complicated
    things.


    We also have to worry about how to lay out the UI – how to size and position sets
    of components. Android is particularly sophisticated in this because being a mobile
    operating system it has to contend with a wide range of screen sizes and even
    orientation changes when an app is running. This is not a simple topic and we
    will have to consider it in more detail later, but for the moment let''s just
    take a look at the easier aspects of screen layout.'
  merge: -1
  pgno: 52
- img_proc: false
  md: 'Using the Designer is the simplest and most productive way to work so let''s
    continue to concentrate on this method of creating a UI. This chapter is mostly
    about how to use the Designer with the default layout and the challenges of creating
    a UI.


    # What''s in the Palette


    Start Android Studio and create a new simple basic activity project called UnitTest.
    This is going to be our UI playground for the rest of this chapter. Accept all
    the defaults, apart from selecting a Basic Activity, and wait while your project
    is created.


    If you now open the file content_main.xml in the app/res/layout folder then the
    Designer will open and you will see the familiar rendering of the default layout.
    Now it is time to look at the Palette in more detail:


    ![](bbox=[0.296, 0.368, 0.653, 0.768])'
