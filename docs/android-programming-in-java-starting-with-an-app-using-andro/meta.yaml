  md: 'Automatically saving and restoring the UI''s state is what the savedInstanceState
    parameter in the onCreate event handler is all about:

    protected void onCreate(Bundle savedInstanceStateState) {


    A Bundle is a set of key/value pairs which is used to save the values stored in
    UI elements when the app is stopped by the system. It stores id/value pairs and
    when the app is restored the Bundle is used to initialize the values in the corresponding
    UI elements. Notice that if the user stops your app removing it from the recent
    list the savedInstanceState is destroyed, the app really does start afresh, and
    the onCreate isn''t passed a Bundle to restore the UI. when the app has been stopped
    by the system.


    It is also worth noting that the restore will work to an alternative layout loaded
    because of a configuration change. For example, it will restore to a landscape
    version of a layout as well as the original portrait version. All that matters
    is that the current layout has View objects with the correct ids.


    At this point you are probably wondering why the TextView object wasn''t restored
    by the system when the device was rotated? The simple answer is that a TextView
    object isn''t intended for user interaction - it is supposed to be used to show
    static text labels and so the system doesn''t save and restore.


    You can see the automatic save and restore in action if you add an EditText input
    field on the design surface of the Lifecycle Editor. If you enter some text into
    the EditText field it will be retained if you rotate the device. However, if you
    press and hold the Home key, remove the app and then start afresh you will see
    that the EditText field is blank again:


    ![](bbox=[0.433, 0.601, 0.566, 0.737])


    The text in the EditText field at the bottom of the screen is preserved during
    a screen rotation.


    +   - The general principle is that any UI element that can be modified by the
    user is automatically saved and restored. Any changes that your code makes or
    that the user makes in complex UI components are lost unless you take steps to
    preserve them.'
  merge: -1
  pgno: 250
