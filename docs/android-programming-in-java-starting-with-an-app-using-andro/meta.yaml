    \ spinner = (Spinner) findById(R.id.spinner);\nspinner.setAdapter(stringArrayAdapter);\n\
    spinner.setOnItemSelectedListener(onSpinner);\n```\n\nIf you now run the program\
    \ you will see something like:\n\n![](bbox=[0.313, 0.368, 0.626, 0.497])\n\nThe\
    \ position displayed corresponds to the element in the array that has been selected,\
    \ counting from zero of course.\n\nMost of the time is it enough to have the index\
    \ of the selected item, but the AdapterView object has a few methods that enable\
    \ you to get the selected item. If you want to review the list item you could\
    \ use the position to index the original ArrayAdapter, or even the original String\
    \ array, but these aren't generally available to the event handler. To retrieve\
    \ the item you would use the getItemAtPosition method. For example, to display\
    \ the country name you would modify the setText call to:\n\n```\nmyTextView.setText((String)\
    \ parent.getItemAtPosition(position));\n```\n\nNotice that the selected item is\
    \ returned as an object type and you have to cast it before you can do anything\
    \ with it.\n\nThere are other methods that can be used to retrieve information\
    \ or manipulate the selected element, but for most simple applications the getItemAtPosition\
    \ is all you really need."
