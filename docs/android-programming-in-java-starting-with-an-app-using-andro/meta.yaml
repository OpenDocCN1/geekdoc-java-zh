  md: "When a user clicks a View object a contextual action bar (CAB) appears at the\
    \ top of the screen, rather than alongside the associated View object as the context\
    \ menu does, and it gives the user to opportunity to perform multiple actions.\
    \ This may be the way to do things, but it is more complicated because it requires\
    \ you to implement code.\n\nContextual action mode can be used in earlier versions\
    \ of Android via the Support Library which Android automatically includes for\
    \ you.\n\nUnlike the context menu you don't just register UI components to trigger\
    \ the contextual action mode, and this means you have to call the startActionMode\
    \ method to display the menu and write a long click event handler. Notice that\
    \ it is up to what user action triggers the contextual action mode, but it is\
    \ nearly always a long click.\n\nThe steps to creating a contextual action bar\
    \ are:\n\n+   - First create an instance of ActionMode.Callback which contains\
    \ methods for different stages in the menu's life cycle.\n- You have to let override\
    \ the onCreateActionMode and this usually calls a menu inflater to generate the\
    \ menu.\n- To handle events on the menu you also have to override onActionModeClicked.\n\
    - To make the menu appear you have to call startSupportActionMode and pass the\
    \ instance of ActionMode.Callback you created earlier.\n\nFor example, if you\
    \ have a button and want long click event to trigger the menu you need to write\
    \ in the Activity's OnCreate something like:\n\n```\nButton btn=(Button)findViewById(R.id.button);\n\
    btn.setOnOnClickListener(\n    (v) -> {\n        return false;\n    }\n);\n```\n\
    \nor using an anonymous class:\n\n```\nButton btn=(Button)findViewById(R.id.button);\n\
    btn.setOnOnClickListener(\n    new View.OnClickListenerListener() {\n        @Override\n\
    \        public boolean onClick(View v) {\n            return false;\n       \
    \ }\n    }\n);\n```\n\nAs before you can have Android Studio generate this stub\
    \ by typing in the \"new View.OnClickListener\" and then right-click, select Generate\
    \ and Implement Interface."
