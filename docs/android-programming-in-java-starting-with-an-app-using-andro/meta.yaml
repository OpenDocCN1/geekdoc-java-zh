  md: '# Summary


    +   - A Menu is a hierarchy of View objects just like any UI element.

    - You can create a menu in code, but using a menu XML resource file is the most
    common way of doing the job.

    - There are Menu objects and tags which act as containers for Item objects and
    tags.

    - Submenus can be created by nesting Menu objects within other Menu objects.

    - Menu items can have a title, icon, and many other attributes which govern how
    they are displayed.

    - There are four different ways you can display a menu: App bar/Toolbar; context
    menu; contextual action mode; popup.

    - To make use of the App bar/Toolbar and the contextual action mode in earlier
    versions of Android you need to use the AppCompatActivity and the other support
    classes.

    - To display a Toolbar all you have to do is use the onOptionsCreate event handler
    to create a menu, usually by inflating a menu.

    - In general you can handle click events on each menu item, more usually, you
    can make use of an item''s click event handler that the system provides that responds
    to a click on any of the items.

    - For the Toolbar item''s click event handler is defined in the Activity as onOptionsItemSelected(MenuItem
    item).'
