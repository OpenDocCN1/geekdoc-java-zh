- img_proc: false
  md: '# Orientation and Resolution


    One of the biggest challenges in creating apps for Android is allowing for the
    range of screen sizes and orientations. Mobile app development is distinctly different
    from desktop development because of this need to deal with differing screen sizes.
    Even when your app is running on a fixed device, the user can still turn it 90
    degrees and change the screen dimensions in a moment and then turn it again. So
    your app has to respond to these changes. Fortunately Android makes it easier
    for you by providing facilities that specifically deal with resolution and orientation
    changes, but you need to come to terms with this situation as early as possible
    in your progress towards mastering Android programming.


    Android Studio has lots of tools to help with the problem of variable layout.
    For example, it lets you see your layout in a range of devices, orientations and
    resolutions. This makes it so much easier.


    We can test our layout in landscape mode simply by selecting the Landscape option:


    ![](bbox=[0.302, 0.431, 0.637, 0.666])


    The relative positions that you set in portrait mode are applied in landscape
    mode without modification and so it is important that you work on their specification
    so that the UI looks good in either orientation. If this isn''t possible then
    you can provide a separate layout for each orientation.'
  merge: -1
  pgno: 67
- img_proc: false
  md: 'You can also see what your UI looks like on the range of supported screen sizes
    by selecting from the list of devices that appears when you click on the Device
    In Editor button:


    ![](bbox=[0.366, 0.163, 0.632, 0.793])


    For simple layouts this is probably enough, but Android has more up its sleeve
    to help you work with different sized screens. In particular you can make use
    of "fragments" and create a separate layout for each screen orientation and resolution.
    Fragments are advanced and the subject of a'
  merge: -1
  pgno: 68
- img_proc: false
  md: 'separate book, Android Programming: Mastering Fragments & Dialogs. On the other
    hand, using different layouts for each orientation and resolution is fundamental
    to Android UI design and you need to at least know it exists at this early stage.


    The idea is quite simple – provide a layout resource for each orientation and
    resolution you want to support. The system will automatically select the resource
    needed when the app is run on a real device.


    How this works is simple, but Android Studio has some helpful features that shield
    you from the underlying implementation. It is a good idea to discover how it works
    and then to know how Android Studio does it for you.


    If you create a new layout file called activity_main.xml, i.e. exactly the same
    as the portrait layout file you have already created in the folder layout-land,
    this will be used automatically when the user rotates the device into landscape
    mode. That is, the layout file used in any situation is determined by the name
    of the folder it is stored in. With this new layout which applies only to a landscape
    orientation you can now create a layout that will only be used in this orientation.


    What happens in general is that when your app starts the system picks the best
    available layout file for the screen according to what has been stored in the
    resource folders, i.e. layout for portrait and layout-land for landscape..


    When the device is rotated the system restarts your app and loads the best available
    layout. If you have only a portrait layout file then it is used for all orientations,
    but if you also have a landscape layout file then it will be used for landscape
    mode.


    What has just described is exactly what happens. To recap, there are folders for
    each resolution and orientation and you can create multiple versions of layout
    resources all with the same name. The system automatically picks the folder to
    use load the layout appropriate to the hardware at runtime.


    Android Studio, however, tries to present this to you in a simpler way. The project
    view hides the fact that different folders are used and simply shows you the different
    versions of the resource files with a qualifier appended - (land) for a landscape
    file, etc.'
  merge: -1
  pgno: 69
- img_proc: false
  md: 'Let''s see how this works.

    To add a landscape layout to the button and text layout given above simply use
