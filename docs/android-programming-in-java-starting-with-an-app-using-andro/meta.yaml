  md: '# The View Hierarchy


    Notice also that a Layout can contain other Layouts and so the set of View objects
    that make up a UI structured like a tree, the View hierarchy. When the screen
    is redrawn each View object is asked to draw itself and this is done for all View
    objects in the hierarchy from top to bottom.


    Normally the View hierarchy is drawn just once when the Activity loads. If an
    area of the screen is obscured by another graphic for any reason, the redraw is
    clever enough not to draw the entire View hierarchy. It only redraws View objects
    that intersect with the invalidated area of the screen. The View hierarchy is
    also involved in passing events between objects and determining which component
    has the current focus.


    # XML Layout


    So the principles of the graphic system are simple enough. Every control or component
    corresponds to a View object and you can build a UI by creating View objects in
    code and adding them to Layouts. You control the way View objects are arranged
    using the LayoutParams or by directly setting properties. An Activity will draw
    its View hierarchy to the screen when it needs to. OK, this is how to create a
    UI in code, but so far we have been building a UI using the Designer.


    How does this relate to the View hierarchy?


    The Designer creates an XML file which describes the View hierarchy that you want
    to create. The way that this works is fairly obvious. Each tag in the XML file
    corresponds to a View object for which you want to create an instance. For example:


    ```

    <LinearLayout>

    </LinearLayout>

    ```


    creates an instance of a LinearLayout object.


    Nesting tags within a layout indicates that the objects created need to be added
    to the layout as child Views. For example:


    ```

    <LinearLayout>

    <Button />

    </LinearLayout>

    ```


    creates a LinearLayout object and a Button object and then adds the Button object
    to the LinearLayout using its addView method. You can see that the XML captures
    the idea of the View hierarchy perfectly.'
  merge: -1
  pgno: 168
- img_proc: false
  md: 'To set object properties all you have to do is use the corresponding attributes
    in the XML. For example to set the button''s text:


    ```

    <Button

    android:text="New Button"

    />

    ```


    Layout parameters are set using properties prefixed with layout_property. For
    example:


    ```

    <Button

    android:layout_width="wrap_content"

    android:layout_height="wrap_content"

    />

    ```


    That is really all there is to it. The XML defines a hierarchy of objects and
    their properties and the system reads them and creates the objects. This use of
    XML as an object instantiation system is not an uncommon one. Of course, the XML
    created by the Designer looks a lot more complicated than the examples above,
    but this is mainly because of the number of attributes it defines. The basic idea
    is still the same.


    # Inflation Theory


    The final big question to be answered is how does the XML get converted into a
    real object hierarchy? The answer to this is to use an "inflater".


    To inflate a layout is Android jargon for inflating the objects defined by an
    XML file. You normally do not have to call an inflater because the system does
    it for behind the scenes, but you if you want to. For example, to inflate a layout
    you would use an instance of the LayoutInflaterater. Normally you wouldn''t create
    a fresh instance. Instead you can simply use an existing one supplied by the system.
    Once you have the LayoutInflaterater you can use any of its many inflate methods
    to create a View object hierarchy specified by the XML. Which method you depends
    on where the XML is stored. You can supply a resource id for an XML file included
    in the res directory. For example to inflate the usual activity_main.xml layout
    you can use:


    ```

    LayoutInflater inf = getLayoutInflater();

    View mView = inf.inflate(R.layout.activity_main,null);

    setContentView(myView);

    ```


    The second parameter of inflate can be used to provide a View object to act as
    the root container for the inflated View hierarchy. The container is just used
    as a reference "parent" for the purposes of calculating the layout. That is, it
    simply provides the container that everything has to fit into according to the
    layout rules. Of course this is entirely equivalent to the usual:

    setContentView(R.layout.activity_main);'
  merge: -1
  pgno: 169
- img_proc: false
  md: 'which calls the LayoutInflater and sets the view in a single instruction.


    The only reason that you would manually inflate an XML layout is if you wanted
    to do something clever, such as put one layout together with another or in some
    way manipulate the View hierarchy.


    Notice that there are other types of inflater objects, e.g. the Menu inflater,
    which do the same job of converting XML to instantiated objects with the given
    properties. We will come back to these more specialized inflaters which we look
    at in the next chapter.


    There is also a version of the inflate method:

    inflate(R.layout.activity_main,root, true/false);


    will inflate the XML resource using its root for the purposes of layout if the
    last parameter is false, and it will add the inflated View to the root if the
    last parameter is true.


    # Finding View objects


    One problem we have to solve if you want to work with the View hierarchy created
    by an inflater. In the example where we built the View hierarchy in code it was
    easy to keep track of a button or a textView by simply keeping a reference to
    when it was created.


    An inflater returns the View hierarchy without an easy way to get at a particular
    object, a button say. One way of solving the problem would be to "walk" the View
    tree. A ViewGroup object, e.g. a Layout, not only has an addView method but also
    a range of methods that allow you to access the objects it contains. Each child
    object is assigned an integer index – think of it like an array. The method:


    ```

    getChildAt(i)

    ```


    will return the child object at index i. You can also use:

    getChildCount()


    to find how many child objects are stored in the container.


    Using these methods you can search the hierarchy for the View object you want
    but how do you know which one is it? The answer is that all View objects have
    an id property which should identify them uniquely. There are getid and setid
    methods, but usually the id property is set as part of the XML file.


    To avoid having to work out an id value, the standard way of setting an id is
    to define a resource within the XML file:


    ```

    <Button

    android:id="@id/my_button"

    ```'
  merge: -1
  pgno: 170
- img_proc: false
  md: 'When the XML file is inflated the @+ symbol is interpreted as "create a resource".
    An integer id is generated using the generateViewId method and is used to create
    both the R id and add a my_button property to the id property of the R object,
    The only minor complication is that when you set an id using the Designer it will
    generate the @+id/id for you. So in the Attributes window you will see my_button
    not @+id/my_button. This is helpful, but it can be confusing.


    There is a lot more to say about resources, but for the moment this is enough
    to understand what is going on. Resources deserve a chapter all to themselves
    and you''ll come to it we''ve looked at menus.


    What all this is that not only do you get an autogenerated id value, also a way
    to get this value into running code. You could use the getChildAt methods to step
    through all of the View objects in the hierarchy, but it is much easier to


    ```

    findViewById(R.id.my_button);

    ```


    which returns the object in one instruction.


    The general method is to inflate the XML, set it as the content of the View, and
    then use the findViewById to locate any View object you want to work with in code.


    It is worth mentioning that a new way of working with View objects, data binding,
    is making its way into Android Studio. It will in the future make findViewById
    redundant and make the UI easier to work with. However, it is important to know
    the basics of Android UI construction and for the moment it is better to use the
    tried and trusted methods.


    # How to Build a UI?


    You have two distinct approaches to building a UI. You can do the whole job in
    code or can create an XML layout. In practice it is usually easier to use the
    Designer to generate the XML file for you. You can, however, mix the two approaches
    and change a "on on the fly.\ For example you can load a UI by implicitly or explicitly
    inflating an XML file and then writing code to add other components or remove
    View objects from the layout. To remove View objects you simply use the removeView
    or removeAt methods of the ViewGroup object.


    There are other UI components such as menus that the Designer doesn''t support.
    In this case you will have to work with the XML or create the UI in the support.
    This means you need to know the inner workings of the View hierarchy even though
    the Designer is the easiest way to create a UI.'
