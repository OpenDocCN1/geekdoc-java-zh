  md: '# Values


    The easiest of the resource folders to use is probably values/, but it also tends
    to be the least often used. The strings.xml file tends to be employed, but the
    others are underutilized. The reason for it is that the system tends to prompt
    you to enter strings as resources and there is an obvious advantage to string
    resources in they allow easy localization. However, putting constants of all types
    in resources is a good idea.


    Although the documentation only mentions string, arrays, colors, dimensions and
    styles, you can include a wider range of data types in the XML file:


    +   - <bool name="resourlename">true</bool>

    - Integer <integer name="resourlename">1234</integer>

    - String <string name="resourlename">A String</string>


    There is also a editor which you can use to manage a collection of strings including
    translations to other languages. Its use is fairly self evident:


    | Key | Resource Fo... | Untranslatable | Default Value |

    |---|---|---|---|n| app_name | app\src\main | | My Application |

    | action_settings | app\src\main | | Settings |

    | Greetings | app\src\main | | Hello World |


