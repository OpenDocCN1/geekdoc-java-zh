  md: 'Notice that each of the View objects in the layout give rise to a distinct
    instance per line. That is, your layout may only have one CheckBox but the ListView
    has one per line. This means that when the user selects the line you retrieve
    the setting of the CheckBox, say. It also means that a ListView can generate several
    View objects very quickly and this can be a drain on the system.


    There are a few things you need to know if you are going to successfully handle
    onClick events. The first is that your layout can''t have focable or clickable
    Views. If it does the event isn''t raised and the handler just not called. The
    solution is to stop any View object in the container from being focusable by adding:

    android:descendantFocusability="blocksDescendants"


    to the LinearLayout, or use the Attributes window to set it to blocksDescendants:


    | Properties | | |

    |---|---|---|n| clickable | | |

    | clipChildren | | |

    | clipToPadding | | |

    | contentDescription | | |

    | descendantFocusability | <unset> | |

    | divider | beforeDescendants |

    | dividerPadding | afterDescendants |

    | drawingCacheQuality | blocksDescendants |


    With this change the event handler should be called, but you now need to keep
    in mind that the View object passed as v in:

    public void onItemClick(Adapter parent,

    View v,

    int position,

    long id)


    is the complete View object for the row and not just the TextView. That is, in
    the case of the example above it would be the LinearLayout plus all of its children.


    If you are going to work with the View object, you you have to access the objects
    it contains and you can do this in the usual way.'
