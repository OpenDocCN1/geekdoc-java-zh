  md: "You can see a list of resource types in the documentation but the commonly\
    \ used ones are:\n\n+   - drawable/\n  Any graphic - typically .png, .gif or .jpg\
    \ but there are a range of other less frequently used types. The rule is – if\
    \ it's in any sense a graphic it belongs to drawable.\n- layout/\n  We have been\
    \ using layouts since we started programming Android and XML layout is a resource\
    \ compiled into your app to be used.\n- menu/\n  The XML files that specify a\
    \ menu are also resources and compiled into your app.\n- values/\n  XML files\
    \ that define simple values as strings, integers and so on. You can think of these\
    \ as defining constants for your program to use. Although you can put any mixture\
    \ of value-defining XML into a single file in the values/ directory, it is usual\
    \ to group values by data type and use.\n\n+   Typically:\n- arrays.xml for typed\
    \ arrays\n- color.xml for color values\n- dims.xml for dimensions\n- strings.xml\
    \ for strings\n- styles.xml for styles.\n\nYou can also include arbitrary files\
    \ and arbitrary XML files in raw/ and xml/. There are two directories dealing\
    \ with animation, animator/ and anim/. There is also a directory where you can\
    \ store icons suitable for different screen resolutions, but of this when we look\
    \ at conditional resources.\n\n# Drawables\n\nDrawables are slightly different\
    \ from other resources in that there is no XML file that defines them. To create\
    \ and use a drawable all you have to do copy the graphic file that you want to\
    \ use into the drawable/ directory. You don't need XML to define the resource\
    \ because the resource's id is just the file name.\n\nThe best way to explain\
    \ how drawable resources works is via a simple example. If you want to create\
    \ a jpg bitmap resource all you have to do copy the jpg file into the correct\
    \ resource directory. Android Studio"
