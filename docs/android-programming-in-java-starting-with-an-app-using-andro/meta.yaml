  md: 'You will see that, for the sake of allowing you to work with the layout,

    The Designer shows you the ListView filled with some two-item text objects.


    Our Adapter is going to be simpler than this dummy display with just a single

    line of text.


    If you run the program at this early stage you won''t see anything in the

    ListView – it will be blank. The text that you see in the Designer is just to

    help you visualize the UI – there is no Adapter associated with the ListView

    hand when when you run it there is nothing to display.


    Our next task is to create an ArrayAdapter object to supply the ListView with

    something to display. First, however, we need a String array to hold the text

    we are going to display. For simplicity we might well add the code to the

    onCreate method in MainActivity.java.


    To create a simple String array we can use a literal:


    ```

    String[] myStringArray={"A","B","C"};

    ```


    Feel free to think up something more creative than A, B, C. In the real world

    The Strings would probably be from a file or a database, etc.


    Now we can create the ArrayAdapter. To do this the constructor needs the

    context, usually, and a layout to display each String and the

    String array:


    ```

    ArrayAdapter<String> myAdapter=new ArrayAdapter<String>(

    this,

    android.R.layout.simple_list_item_1,

    myStringArray);

    ```


    Notice the way that the type of the array is specified as <String>. If you are

    not familiar with Java generics then you need to look up how it works.

    Also notice the use of the standard layout simple_list_item1. You can

    create your own layouts and will see how this is done in a moment.


    Finally we associate the adapter with the ListView:


    ```

    ListView myList=(ListView) findViewById(R.id.listView);

    myList.setAdapter(myAdapter);

    ```


    The complete onCreate method is:


    ```

    protected void onCreate(Bundle savedInstanceState) {

    super.onCreate(savedInstanceState);

    setContentView(R.layout.activity_main);

    String[] myStringArray={"A","B","C"};

    ArrayAdapter<String> myAdapter=new ArrayAdapter<String>(

    this,

    android.R.layout.simple_list_item_1,

    myStringArray);

    ListView myList=(ListView) findViewById(R.id.listView);

    myList.setAdapter(myAdapter);

    }

    ```'
