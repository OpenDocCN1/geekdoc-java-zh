- img_proc: false
  md: 'It is also important to know that, initially, the coordinate system of the
    Canvas object is to pixels as determined by the Bitmap. That is, if the Bitmap
    is width by height pixels, the default coordinate system runs from 0,0 at the
    top left-hand corner to width,height at the bottom right.


    Using Canvas can be as simple as calling a method like drawLine between two points.
    The only slight complication is that you have to use the Paint object to specify
    how the line will be drawn. In general controls how your line or area is drawn
    by the Canvas methods.


    A typical Paint object is something like:


    ```

    Paint paint = new Paint();

    paint.setAntiAlias(true);

    paint.setStrokeWidth(6F);

    paint.setColor(Color.BLUE);

    paint.setStyle(Paint.STROKE);

    ```


    After creating the Paint object we set AntiAlias to, i.e turn it on. This creates
    a higher quality but slightly slower rendering, and sets the width of the line
    to 6 pixels, color to blue, and sets it as a stroke, i.e. a line rather than an
    area fill. If you are puzzled by this is how you specify a float constant in Java.


    Once you can use a Paint object as often as it is needed and you can modify it
    and reuse. You can also use an existing Paint object to create a new Paint object
    which you modify.


    # A First Graphic


    We have a Paint object we can draw a line:

    c.drawLine(0F, 0F, 500F, 500F, paint);


    This draws a line from 0,0 to 500,500 and as the Bitmap is 500 by 500 pixels this
    draws a diagonal across the entire bitmap. Again the numeric values all end in
    F because the method needs float values, for reasons that become clear later:


    ![](bbox=[0.33, 0.695, 0.61, 0.895])'
