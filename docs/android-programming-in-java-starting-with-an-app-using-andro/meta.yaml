  md: "# The ViewGroup\n\nIf Activity can only show a single View object, how can\
    \ we ever create a complex UI with multiple buttons, textViews and other components?\
    \ The answer, and you probably already guessed, is that there are Layout, or ViewGroup,\
    \ objects which can be used to host other View objects.\n\nYou already know about\
    \ using Layouts in the Designer or in an XML file, they, like all UI elements,\
    \ correspond to particular Java classes that does the actual work.\n\nA ViewGroup\
    \ can display multiple View objects. In nearly all cases the View object that\
    \ is associated with an Activity is an Activity View. When the Activity asks the\
    \ Layout View to render itself, by calling its onCreate method, the layout calls\
    \ the onDestroy method of each of the Views it contains and puts them together\
    \ to make a single result. Course, it also performs a layout operation positioning\
    \ and sizing the View objects it contains.\n\nSo a layout does things:\n\n+  \
    \ * it hosts other View objects\n* it performs the layout function after which\
    \ it is named.\n\nTo see this in action try:\n\n```\n@override\nprotected void\
    \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    LinearLayout layout=new LinearLayout(this);\n    Button b = new Button(this);\n\
    \    b.setText(\"Hello Button\");\n    layout.addView(b);\n    setContentView(layout);\n\
    }\n```\n\nIf you run this program you will see a button at the very top left of\
    \ the screen. The first instruction creates a LinearLayout object. This is a subclass\
    \ of View that can contain other View objects and it organizes them in a left\
    \ or right or top to bottom depending on the setting of its orientation property.\
    \ Next we create a button object and then use the standard addView method of the\
    \ LinearLayout to add it to the layout.\n\nAll Layouts have an addView method,\
    \ which can be used to add multiple View objects."
