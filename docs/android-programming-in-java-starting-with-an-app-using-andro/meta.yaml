  md: '# First Look


    When everything is ready you will see Android Studio for the first time.

    As long as everything you have worked eventually, it takes three minutes or more,
    be presented with a view of your new project starting off in the Designer. Click
    the Design tab to see the initial user interface:


    ![](bbox=[0.132, 0.219, 0.808, 0.626])


    # Problems?


    If you get any error messages the chances are that your project hasn''t finished
    being processed. Wait a while longer for for the activity to stop. If you look
    at the status line at the bottom of the window you will see a message saying "Gradle
    Finished" when Android Studio has finished with your new project.


    If you still have problems it is worth trying the **File,Invalidate Caches/Restart**
    command. This usually works for "Missing styles" and similar errors.'
  merge: -1
