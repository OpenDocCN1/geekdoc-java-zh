    # Working with the Data


    The whole point of showing the user a list of items is so that they can interact
    with it. You can manipulate the data on display in various ways and handle events
    when the user selects an item.


    # Get Selection


    Perhaps the most important thing is to deal with the user selecting an item.

    The usual way of doing this is to write a handler for the Listener event, which
    gives four parameters:

    onItemClick(AdapterView parent,View view,int position, long id)


    The AdapterView is the complete View displayed by the container, the is the View
    object the user selected, the position is in the collection, and the id is the
    item''s id number in the container. For an ArrayAdapter the id is the same as
    the array index.'
