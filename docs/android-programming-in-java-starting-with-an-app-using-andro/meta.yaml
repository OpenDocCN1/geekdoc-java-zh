- img_proc: false
  md: '# # Summary


    +   - In Java you can''t pass a function to set up an event handler you have to
    pass an object that contains the function as a method.


    +   - Events are often handled by Single Abstract Method SAM interfaces. The method
    declared in the SAM is the function that does the event handling.


    +   - For each event and each control that can generate that event there is a
    SAM of the form `onEventListener` method which can be used to attach the event
    handler.


    +   - Java 8 introduced the lambda as a way to make it look as if you are passing
    a function. A lambda is a short way of creating an instance of a SAM with a custom
    code defined in the lambda.


    +   - A lambda is the most compact and easy to understand way of creating an event
    handler.


    +   - The most direct, and original, way to create an event handler is to create
    a new class that implements the SAM and then create an instance of the class to
    handle the event.


    +   - To avoid the problems with having to create a new class for each event handler
    Java introduced the anonymous class. You can use an anonymous class to implement
    the SAM and create an instance of it in one move.


    +   - You can''t always use a lambda because some events group multiple event
    handling functions under a single class. In this case the best alternative is
    to use an anonymous class.


    +   - Alternatively you can use Activity to implement the interface.'
  merge: -1
  pgno: 99
