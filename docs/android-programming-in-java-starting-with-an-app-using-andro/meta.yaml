    is a way of placing components to the right of the rightmost component of the
    group whichever one this is. Without a Barrier object you would have to put the
    Button''s into a Frame and then position the other components relative to the
    Frame. This would work but it creates a nested layout. The Barrier approach keeps
    the ConstraintLayout flat.

    The Barrier is useful when you have a group of components that change their size
    due to user input or data or whatever. You can use a Barrier to divide the screen
    area into something large enough to accommodate the group and the rest of the
    components can position themselves in what is left over.'
