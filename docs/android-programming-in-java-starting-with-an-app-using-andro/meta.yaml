    # Text Fields


    Text Fields are the way you get the user to enter some text for you to process
    and, as you can guess, they form an important part of UIs.


    There are a lot of Text Fields provided in the Toolbox, but they all work in the
    same way differing only in the type of input they expect the user to type. In
    the course of developing apps you will encounter some of them sooner or later,
    but you really need to know how to use one of them to understand how they all
    work.


    If you have used any UI Framework then you will have encountered some form of
    the Text Field, before the Android control is slightly different in that it generally
    offers the user a customized virtual keyboard referred to as an IME (Input Method
    Editor). You can build your own IMEs, but for the moment''s just use the ones
    provided by the system.


    If you want the Android emulator to make use of the IME to a real Android device
    would use then you need to deselect the Hardware Keyboard Present option when
    you are creating the AVD (Android Virtual Device). If the emulator makes use of
    the host machine''s keyboard you don''t see the IME at all.'
