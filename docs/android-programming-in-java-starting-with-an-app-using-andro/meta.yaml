  md: "When it comes to retrieving the data you can use the getValue method, which\
    \ always returns an integer. This is either the index in the String array, or\
    \ the actual value if you are not using a String array, of the item the user picked.\
    \ If you want to get a live update of the user selects you can use the OnValueChange\
    \ event. The event handler:\n\n```\npublic void onChanged(\n    NumberPicker picker,\n\
    \    int oldVal,\n    int newVal)\n```\n\nprovides you with the NumberPicker object\
    \ that the only occurred on as picker and the index of the old and new values.\
    \ The values from the String array that were used initially. This is probably\
    \ not accessible from the event handler and may not even exist any longer. The\
    \ solution is to use the NumberPicker's getDisplayedValues, which returns a String\
    \ of values currently loaded in the NumberPicker.\n\nFor example to transfer the\
    \ value to a TextView you first have to define a Listener object which you can\
    \ do easily with the help of Android Studio's autocomplete:\n\n```\nNumberPicker.OnValueChangeListener(\n\
    \    new NumberPicker.OnValueChangeListener() {\n    @Override\n    public void\
    \ onChanged(\n        NumberPicker picker,\n        int oldVal,\n        int newVal)\
    \ {\n        String[] values=picker.getDisplayedValues();\n        TextView tv=(TextView)\
    \ findById(R.id.textView);\n        tv.setText(values[newVal]);\n    }\n});\n\
    ```\n\nThis uses the picker to get the array of displayed values, which it then\
    \ transfers to the TextView using the newVal as an index. All you need to do make\
    \ this work is add the Listener to the NumberPicker:\np.setOnValueChangeListener(onChanged);\n\
    \nYou can write this much more clearly using a lambda:\np.setOnValueChangeListener(picker,oldVal,newVal)\
    \ -> {\n    String[] values2 = picker.getDisplayedValues();\n    TextView tv =\
    \ (TextView) findById(R.id.textView);\n    tv.setText(values[newVal]);\n});"
