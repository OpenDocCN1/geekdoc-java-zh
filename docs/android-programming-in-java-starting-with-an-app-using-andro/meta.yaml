  md: "# Creating an ArrayAdapter from a Resource\n\nTo create an ArrayAdapter from\
    \ a resource you need to make use of a static method of the ArrayAdapter class,\
    \ `createResource`. This just needs you to specify the context, the resource id,\
    \ and the Spinner layout. All you have to do is to replace the creation of stringArrayAdapter:\n\
    \n```\nArrayAdapter<CharSequence> stringArrayAdapter=\nArrayAdapter.createResource(\n\
    \    this,\n    R.array.country,\n    android.R.layout.spinner_dropdown_item);\n\
    ```\n\nWith this change everything works as before, but now to change the items\
    \ that appear in the Spinner you simply edit the XML file.\n\nYou could also use\
    \ the `getResources` object to retrieve the String array and then proceed as if\
    \ the String array had been defined in:\n\n```\nprivate String[] country =\ngetResources().getStringArray(R.array.SpinnerList);\n\
    ```\n\n# Changing The List\n\nThere are lots of more advanced things that you\
    \ can do with Spinners, but these aren't encountered and often mainly when you\
    \ are trying to build a custom user experience.\n\nThe thing that does occur is\
    \ the need to dynamically change the list of items. There are many slight variations\
    \ on this, but essentially what you do is change the String array and then call\
    \ the adapter's `notifyDataSetChanged` method. For example, if you want to change\
    \ Mexico, i.e. element one, to Greenland! you would use:\n\n```\ncountry[1]=\"\
    Greenland\"\nstringArrayAdapter.notifyDataSetChanged();\n```\n\nThe ArrayAdapter\
    \ also adds clear, remove and insert methods which can be used to modify the underlying\
    \ data, but for this to work the object holding the data has to be modifiable.\n\
    \nYou can't modify a String array this way. What you need instead is an ArrayList.\
    \ If you change the declaration of country to:\n\n```\nArrayList<String> country=new\
    \ ArrayList<String>(\n    Arrays.asList(\"Canada\", \"Mexico\", \"USA\\));\n```\n\
    \nyou can add \"Greenland\" to the end of the items using:\n\n```\nstringArrayAdapter.add(\"\
    Greenland\");\n```\n\n+   1 Has been pointed out that Greenland isn't a country\
    \ but a constituent country within the Kingdom of Denmark. For programming purposes\
    \ it is a country."
  merge: -1
  pgno: 264
- img_proc: false
  md: 'Notice that in this case the ArrayAdapter constructor used changes from one
    that accepts an array to one that accepts a List of objects.


    You can always find out how many items there are using the **getCount** method.


    How do you modify a list of items that are created using a resource? This is a
    tricky question because the ArrayAdapter creates a String array to hold the data
    which means you can''t use the methods that modify a list. There are a number
    of ways of fixing this, but the simplest is to construct your own ArrayList from
    the resource directly:


    ```

    Resources res=getResources();

    ArrayList<String> country=new ArrayList<String>(

    Arrays.asList(res.getStringArray(R.array.spinner)));

    ArrayAdapter<String> stringArrayAdapter=new ArrayAdapter<String>(

    this,

    android.R.layout.simple_spinner_dropdown_item,

    country);

    ```


    With this version of the ArrayAdapter you can once again use the add, and other
    methods, to modify the list of items.'
