  md: '# All Properties


    If you have looked at any example of using Buttons in the documentation, or

    if you look at slightly older Android code, you may discover some properties

    that you can''t seem to access using Android Studio. This is because the

    Attributes window only shows you the most used properties. To see them all

    y need to click on the double-arrow icon at the top or bottom of the

    window.


    ![](bbox=[0.319, 0.269, 0.628, 0.463])


    The big problem with it is that you go from a very small subset to an

    overwhelming list.


    The best way to deal with this is to know what you want to change and find

    the exact name of the property that does the job. This is easier to say than to

    do in many cases. For example, suppose you want to set an icon within a

    standard text button so that it displays to the left of the text that the button

    contains. This appears to be impossible if you restrict yourself to the

    properties presented in the initial Attributes window.


    If you look up the details of the properties that Button inherits you will find:


    +   - drawableLeft

    - drawableRight

    - drawableStart

    - drawableEnd

    - drawableBottom

    - drawableTop


    which are not in the Attributes window list. These allow you to display a

    drawable, i.e. a graphic or icon, at the location specified relative to the text.'
