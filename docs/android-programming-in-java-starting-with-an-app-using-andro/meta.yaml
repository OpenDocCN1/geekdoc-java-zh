  md: 'Now if you run the app using the simulator you will initially see the portrait
    screen, but if you rotate the simulator to landscape mode using the menu to the
    right, you will notice a pause while the portrait layout is visible and then it
    will change to the landscape layout.


    If you view the app on a range of devices you can rotate to landscape and see
    your custom landscape layout.


    In general the best plan is to create a complete portrait layout and generate
    a landscape layout as late as possible in the development so you don''t have to
    repeat UI tweaks.


    Also notice the auto-switching of layouts causes a potential problem. When the
    layout is switched after it is restarted and this means that it can lose its current
    state. It is as if your app has just been started by the user. To solve this problem
    we need to look into the app life cycle and discover how to preserve state, which
    is covered in Chapter 13.


    You can also use the same approach to supporting different screen resolutions.
    The idea is the multiple layout XML files are provided, for each resolution, and
    the system automatically picks which one to use. This is slightly more complicated
    than dealing with orientation because you might well have to provide different
    resolution images to make the layout look good. On this after what we have looked
    at resources and resource management.


    This is our first look at a particular aspect of app development that makes Android
    more complicated than developing for a fixed screen size and it turns out not
    to be so difficult as it might first.


    # # A First App – Simple Calculator


