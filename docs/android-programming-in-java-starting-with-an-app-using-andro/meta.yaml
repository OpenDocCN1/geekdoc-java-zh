    \ a real app you probably would not create a new class for two text items, overriding\
    \ the toString method would be easier, but the principles are the same no matter\
    \ what multiple View objects created by the adapter.\n\n# Reuse, Caching and General\
    \ Layouts\n\nWe have a working custom adapter but there are some things we can\
    \ do to make it better. The first relates to efficiency. If you recall, it was\
    \ pointed out that a big list of objects could result in the creation of a lot\
    \ of View objects. In practice, however, we only need the number of View objects\
    \ that correspond to rows actually being displayed on the screen.\n\nTo avoid\
    \ having to dispose of and create View objects all the time, the ListView gives\
    \ you the opportunity to recycle the View objects you have"
