  md: '# A Logical Approach to Transforms


    One approach to keeping track of transformations is to draw everything centered
    on the origin, and then translate, scale and rotate it to its position. For example,
    to draw the rectangle:


    ```

    c.drawRect(200F, 300F, 180F, 400F, paint);

    ```


    you would first draw a unit square centered on the origin:


    ```

    c.drawRect(-0.5F, -0.5F, 0.5F, 0.5F, paint);

    ```


    then you would scale it to its desired size:


    ```

    c.scale(160,100);

    ```


    and rotate it:


    ```

    c.rotate(45F);

    ```


    Finally you would move it to its correct location:


    ```

    c.translate(100F, 350F);

    ```


    If you try out these steps, you will discover that you don''t get what you expect.
    The reason is that we have been transforming the object: draw a square, scale
    the square, rotate and move it to the desired location. However, the Canvas transformations
    don''t transform graphical objects but the coordinate system. You can immediately
    see that this means you should draw the square after you have performed all of
    the transformations.


    Indeed this is the rule:


    +   - do everything you would have done to the geometric shape in the reverse
    order when changing the coordinate system.


    So the correct transformation sequence:


    ```

    c.save();

    c.translate(100F, 350F);

    c.rotate(45F);

    c.scale(160,100);

    c.drawRect(-0.5F, -0.5F, 0.5F, 0.5F, paint);

    c.restore();

    ```


    You can always work out the transformation sequence you need by considering the
    graphical object, working out the transformations needed to change it to what
    you want and applying them in the reverse order.


    Some programmers take to this idea and think it is the best and only way to do
    logical graphics. Some adopt it a little bit, and others draw things where they
    are needed in the size and orientation needed.'
  merge: -1
