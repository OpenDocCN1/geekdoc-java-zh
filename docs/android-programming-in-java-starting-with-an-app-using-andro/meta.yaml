  md: '# Summary


    +   - Android, like many other mobile OSs, will remove your app from memory and
    restart it as it needs to.

    - The user will not be aware that your app has been destroyed and recreated and
    will expect it to continue from where they off.

    - The system signals changes in state to your Activity via a complicated set of
    events. You need to understand how these work in order to make your Activity recover
    after the various levels of suspension.

    - onCreate should not be regarded as the “constructor” for your app because it
    is called when the app is restored as well as it is run for the first time.

    - The system will store the state of any user modifiable UI components and restore
    it when the Activity resumes.

    - The data is stored in a special instance of a Bundle, a set of key/value pairs,
    called savedInstanceStateState.

    - The system alerts you when it is about to save and restore data from savedInstanceStateState
    by firing the onSaveInstanceStateState and onRestoreInstanceState event handlers.

    - You can override both of these event handlers to save and restore extra data
    in the savedInstanceStateState Bundle.

    - For many simple apps you can mostly ignore the life cycle events and concentrate
    on using the onSaveInstanceStateState and onRestoreInstanceState event handlers
    to persist data.

    - You must always check that UI and other elements are persisted through a suspension
    of your app. You can test using a rotation configuration change.

    - There are other advanced ways of saving state which you will need to discover
    later on. You can’t use a Bundle for everything.'
  merge: -1
