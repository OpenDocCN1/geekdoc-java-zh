- img_proc: false
  md: "You can use the final modifier to make it clear that a variable satisfies this\
    \ condition and the compiler will check that it is true.\nSo for example you could\
    \ write the previous event handler as:\nfinal Button b=(Button)findViewById(R.id.button);\n\
    b.setOnClickListener(view->{\n    b.setText(\"I've been clicked\");\n});\n\nThe\
    \ final modifier would cause the compiler to check that b was initialized once.\
    \ In fact you don't need the final modifier because using b in the lambda causes\
    \ the compiler to check that it is effectively final.\n quite clear the b is only\
    \ initialized once in the code listed above and so it seems that it is evidently\
    \ fine but things are more subtle. Suppose the enclosing method was called a second\
    \ time? Surely this will change the value in b and hence it's not final. As b\
    \ is a local variable it is a new instance of b that was initialized and a new\
    \ instance of the lambda is created. As the original b isn't reinitialized it\
    \ is still final. It can be very difficult sometimes to work out if a variable\
    \ is final or not the compiler will do for you.\n\n# Event Handler Using A Class\n\
    \nThe first way of creating an event handler was to create an entire class for\
    \ each one. This is the most code intensive way of doing the job but it is the\
    \ most basic.\nFor example, to create an event handler for the onClick event you\
    \ will have to do the following:\n\n+   1. Create a new class that implements\
    \ the onClickListener interface\n2. Define your custom onClick handler within\
    \ the class\n3. Create an instance of the new class within the Activity\n4. Use\
    \ the button'ssetOnClickListener method to add to the listener object created\
    \ in step 3 to the event.\n\nThis is the general pattern that you have to follow\
    \ when implementing any event handler. The only things that change are the interface\
    \ you have to implement and the event handling function defines.\nThis is as much\
    \ an exercise for Java beginners as it is an explanation of event handling. If\
    \ your grasp of Java is good feel free to skip ahead. If you are in doubt how\
    \ to best use Android Studio to create a class then read on.\n\nStart a new project\
    \ called ClassEvent and add a button using the Designer.\n\nTo implement an event\
    \ handler for the onClick event first we need to add a new class to the project.\
    \ Right click on the folder just under the Java folder"
