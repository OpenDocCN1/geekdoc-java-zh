  md: 'There seems to be little reason to use the full “implement a new class” approach.
    The only possible reason is if you need to instantiate multiple copies of the
    event handler and this isn’t usual.


    Implementing event handlers are part of the class that generates the events still
    has some advantages but you cannot provide multiple event handlers for event on
    different instances of a control.


    The short version is – if you can use a lambda and if you can''t use an anonymous
    class. This is what all of the following examples will do.'
