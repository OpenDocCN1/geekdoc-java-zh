- img_proc: false
  md: '# The Button an Example


    Where else should we start – the Button is almost the "Hello World" of UI construction.
    If you know how to work with a Button you are well on your way to understanding
    all of the possible components. The good news is that we have already met and
    discovered the Button in Chapter 2 and discovered how to work with it. However,
    there is still a little to find out.


    Generally there are three things you need to discover about using any component.


    +   1. How to make it initially look like you want it. This is a matter of discovering
    and setting properties using the attributes provided in the Designer.

    2. How to modify the way a component looks at runtime. This is a matter of finding
    out how to work with properties in code.

    3. How to hook up the events generated by the component to the code.


    Setting properties sounds easy, but there are different types of properties and
    these have different appropriate ways of allowing you to interact with them. The
    first thing we have to find out is how to position a component.


    # Positioning – the ConstraintLayout


    Before you continue with the project select and delete the default "hello world"
    text – it makes trying things out easier to have a clean design surface. As already
    mentioned, there are two views of your layout you can opt for – design and blueprint.
    The design view looks like your UI when it runs on a real device. It is useful
    for getting an overall feel and impression of what the UI really looks like. The
    blueprint view shows you the UI in skeleton form. This makes it quicker and easier
    to work with you are positioning things.


    You can view both at the same time but this is mostly a waste of screen space.


    Some prefer the blueprint view because it seems to be lightweight. Others prefer
    the design view because it is complete. Use whichever you find workable, but there
    is no doubt that the blueprint view is faster and suffers from less lag as you
    try to position components.'
  merge: -1
  pgno: 55
- img_proc: false
  md: 'Next click on the Button in the Palette and drag it onto the layout.

    Notice the way the layout information changes as you move the button around the
    design surface:


    ![](bbox=[0.28, 0.163, 0.762, 0.298])


    It is important to realize that this positioning information is only to help you
    locate UI components relative to the existing layout. With the new ConstraintLayout
    where you drop a component has no effect on where is will show when the app is
    run. In fact if you simply drop a UI component on the design surface without applying
    any constraints when you run the app the component will drift up to the top left-hand
    corner.

    In facts are slightly more complicated because there is a facility that will automatically
    add constraints when you drop the component that realizes the alignments shown
    at the moment you drop. However, this can be turned off, as we will see. The key
    thing to realize is that the alignments displayed are not constraints – just help
    in positioning things.


    Using the ConstraintLayout the only thing that affects where a component is displayed
    are the constraints you apply.


    So do you apply a constraint?

    nYou can have the Designer suggest them for you automatically or you can apply
    them manually.

    Automatic constraints are easier to use and there are two ways to get the editor
    to apply constraints dynamically:


    +   1. Autoconnect mode

    2. Infer Constraints


    They do slightly different things and you need to learn to make them work together.'
  merge: -1
  pgno: 56
- img_proc: false
  md: 'The Autoconnect mode seems the most useful when you first meet it, in practice
    it can be confusing and error-prone. However, it is worth trying out. To turn
    Autoconnect on simply click the Autoconnect icon on at the top of the Designer:


    ![](bbox=[0.301, 0.173, 0.666, 0.243])


    With Autoconnect, when you place a component on the design surface the editor
    attempts to work out suitable constraints based on where you drop the component.
    If it fails to apply any constraints then it will try again if you drag the component
    to another location. It will only apply constraints to satisfy the alignments
    that are indicated in the Designer. If you drop a component at an arbitrary point
    on the screen with no alignments indicated then none will be.


    Once Autoconnect has applied constraints, these are not altered if you modify
    the component. For example if you drop a component in the middle of the screen
    constraints are applied to place the component 50% of the way down the screen
    from the left. If you then move the component percentages are changed to position
    it, but the actual constraint won''t change to anything more appropriate if you
    move it to the top left-hand corner. Once a constraint has applied its type will
    not change.


    The Infer Constraints option is actually easier to use and reasonably effective.
    All you have to do is position all the components where you want them and then
    click the Infer Constraints button:


    ![](bbox=[0.301, 0.627, 0.666, 0.697])


    When you do this constraints will be calculated based on where each component
    is. This gives you more time to position the components and you can always delete
    all the constraints and click Infer Constraints again to recompute them. Only
    constraints that are necessary to fix the position of a component are added –
    existing constraints are not modified.


    This means you can use Infer Constraints to make sure that your layout has enough
    constraints to make it work – if none are added it was OK. Also notice'
  merge: -1
  pgno: 57
- img_proc: false
  md: 'that once Infer Constraints has added a constraint the type of constraint won''t
    change if you drag the component.


    A good strategy is to switch off Autoconnect and use Infer Constraints every time
    you place a new component on the design surface. This allows you to build up a
    layout one component at a time and check each new set of constraints. You can
    then modify the newly added constraints and move on to the next component.


    Where things get difficult is when you have a multi component layout and need
    to make radical changes. Often it is easier in this case to delete all of the
    constraints using the Clear All Constraints icon, and start again:


    ![](bbox=[0.328, 0.303, 0.739, 0.373])


    For a component that has been placed on its own close to the top and left-hand
    edge of the screen, constraints will be added that fix its distance from the left
    and top to:


    ![](bbox=[0.363, 0.477, 0.686, 0.763])


    From now on when the button is displayed it will position itself at 36 from the
    left and 33 from the top. These constraints are applied no matter what the size
    of the physical screen is. This is the sense in which they are constraints rather
    than absolute positioning.'
  merge: -1
  pgno: 58
- img_proc: false
  md: 'It is worth knowing that the actually positioning is achieved by setting the
    button''s margin properties to 36 and 33. The ConstraintLayout may be the most
    sophisticated of the layout components but it positions other components using
    properties that have been used in from the start of Android.

    You can see that things aren''t quite as simple as positioning relative to the
    edge of the screen if you place a second button on the surface and move it close
    to the first. Now if you click the Infer Constraints button the constraints that
    are applied are taken relative to the first button:


    ![](bbox=[0.263, 0.269, 0.693, 0.563])


    You can see that in this case the second button is positioned 88 from the left
    edge of the first button and 49 below it. Once again these constraints will be
    obeyed no matter how large or small the physical screen the UI will displayed.
    On is more, if you move the first button the second button will keep its position
    relative to the first. In fact, if you click and drag the first button, the second
    will move with it.

    If you play with the positioning in the Designer you will quickly get the idea.
    The big problem with inferring constraints is that the system sometimes gets it
    wrong.

    R than let the Designer infer constraints incorrectly you can place them manually.
    All you have to do is drag a line from the constraint circles on the component
    to the edge you want to use as a reference point.'
