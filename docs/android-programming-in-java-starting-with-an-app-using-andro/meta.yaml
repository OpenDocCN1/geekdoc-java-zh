    \ like Visual Studio, it is also worth pointing out that Android Studio doesn't\
    \ automatically create event handlers for you. In the case of Android Studio you\
    \ have to create a function and assign it to the onClick handler. The reason for\
    \ this apparently unhelpful approach is that Java events are much more involved\
    \ than .NET or JavaScript events.\n\nUsing the Designer approach, method click\
    \ event handlers are simply public methods of the current Activity with the signature:\n\
    \n```\nvoid method(View v)\n```\n\nJust in case you have missed or forgotten what\
    \ a function's signature is:\nA function's signature is the number and types of\
    \ the parameters it accepts. Functions with the same name but different signatures\
    \ are considered to be different functions. In this case the function takes a\
    \ single parameter, which is a View, and returns void, i.e. nothing.\n\nYou can\
    \ call the method anything you like, but in most cases it helps to specify exactly\
    \ what the event it handles. In this case we will handle the button's onClick\
