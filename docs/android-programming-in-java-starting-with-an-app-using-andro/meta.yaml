  md: 'Before proceeding a quick summary is helpful:


    +   - Containers like ListView and GridView display objects in a particular arrangement
    – as a vertical list or as a 2D grid in these two cases respectively.

    - An Adapter converts the data that is to be displayed in each slot into a suitable
    View object.

    - For complex data and displays you need to create a custom Adapter.

    - In many cases the ArrayAdapter, a predefined custom Adapter for converting Arrays
    to TextView objects, can be used.

    - The ArrayAdapter, at its most basic, can supply TextView objects to a container
    from any of any type simply by calling the object''s toString methods.


    # The ArrayAdapter


    Rather starting with an example that is completely general, it is worth looking
    at how the ArrayAdapter is used in conjunction with a ListView.

    Start a new Android Studio project called ListViewExample based on a Basic Activity
    and accept all the defaults. For a simple example all we are going to display
    a list of names in


    First delete the usual "Hello World" textView. In the Designer scroll down the
    Palette you can see the Containers and place a ListView on the design surface.
    At the moment the ListView isn''t automatically assigned an id. If this is the
    case type ListView into the Id Attributes window. If you do this a dummy content
    will be generated for you:


    ![](bbox=[0.186, 0.597, 0.853, 0.858])


