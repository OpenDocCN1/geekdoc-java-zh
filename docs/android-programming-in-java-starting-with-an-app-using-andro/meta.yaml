  md: 'If you run the program you will see a fairly large red square appear where
    the ImageView control has been placed:


    ![](bbox=[0.434, 0.166, 0.627, 0.413])


    Notice the ImageView control has been automatically resized to show the Bitmap.


    The ImageView control has a range of methods similar to setImageBitmap that makes
    it useful for displaying a range of different types of graphics.


    # Canvas


    You can just use a Bitmap and work with individual pixels, but this isn''t a "high
    level" to create graphics. What we need are some larger methods that draw useful
    things like lines, rectangles, circles and so on.


    The Bitmap object doesn''t have this sort of method, but the Canvas object does
    and you can use it to draw on any Bitmap. That is you can use the Canvas object''s
    methods to draw on the Bitmap. There are lots of different Canvas drawing methods,
    and even a facility to transform the basic coordinate system to anything you care
    to use, but we have to start somewhere so a simple example first.


    You can create a Canvas and attach it to a bitmap in one operation:


    ```

    Canvas c = new Canvas(b);

    ```


    Now when you use the drawing methods of the Canvas they draw on the Bitmap b.
    There are many occasions when a control or object provides a Canvas object attached
    to a Bitmap all ready for you to draw on.'
