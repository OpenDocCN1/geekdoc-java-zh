  md: "# Closure\n\nClosure is one of topics that sounds as if it is going to be difficult.\
    \ Lambda expressions are different from most functions in that they have access\
    \ to all of the variables that belong to the method that they are declared in.\
    \ What more a lambda cannot declare a variable that already exists in the enclosing\
    \ method – that is a lambda cannot create a shadow variable for the variable that\
    \ it can already access.\n\nFor example:\n\n```\nButton b=(Button) findViewById(R.id.button);\n\
    b.setOnClickListener(view ->{\n    Button b=(Button) view;\n    b.setText(\"I've\
    \ been clicked\");\n});\n```\n\nThis looks as it should just work because all\
    \ that we have done is to change the previous example that the variable parameter\
    \ is cast a Button and stored in a new variable b. However if you try this out\
    \ you will discover that the compiler cannot declare variable b because it already\
    \ exists. The lambda has access to the b set in the enclosing method and cannot\
    \ create a shadowing variable of the same name.\n\nThe fact that the lambda has\
    \ access to the variables in the enclosing method has the strange consequence\
    \ that you could write the event handler as:\n\n```\nButton b=(Button) findViewById(R.id.button);\n\
    b.setOnClickListener(view ->{\n    b.setText(\"I've been clicked\");\n});\n```\n\
    \nThis may look odd it works. If you don't think it is odd then you've noticed\
    \ that the event handler, the lambda, will be executed when the Button is clicked\
    \ and this is likely to be well after the enclosing method has finished and all\
    \ its variables not longer exist – yet the lambda can use b to access the Button.\
    \ The system will keep the value of b so that the lambda can make use of it. This\
    \ is the essence of a closure – the preserving of variables that have out of scope\
    \ that a lambda can still access.\n\nNow come to a subtle point that you might\
    \ want to skip until you are sure you understand closure or see an error message\
    \ relating to \"final\".\n\nThe Java insert is not as general as you will find\
    \ in other languages. It captures the values of the variables just once at the\
    \ time that the lambda is created. To make sure that strange things cannot happen\
    \ as a consequence of this you can only use variables with final or effectively\
    \ final in the lambda. A final variable is one that can be initialized and is\
    \ guaranteed not to change. That is a final variable is one that is set to a value\
    \ just once."
  merge: -1
