  md: "It lets you effectively create an object, i.e. an instance of a class, without\
    \ having to explicitly create a class, providing a direct method of creating the\
    \ event object.\n\nInstead of:\n\nEvent Class -> Event Object -> Set As Listener\n\
    \nwe just go straight to:\n\nEvent Object -> Set As Listener\n\nThe only downside\
    \ of using anonymous classes is that you can't create a second instance of the\
    \ class. It works only as a shortcut for creating one instance of an object.\n\
    \nYou create an anonymous class by writing the same code you would need to create\
    \ an instance of an existing class, but you add (block of code) following it to\
    \ define the new methods of the new class you are creating. The result is an instance\
    \ of the new class. For example suppose you have a class called Hello that displays\
    \ a world message and you want an object that does everything that Hello does\
    \ but with the addition of a goodbye method.\n\nNormally you would create a Leave\
    \ that inherits from Hello and defines the new method and then create an instance\
    \ of Leave. Instead you can write:\n\n```\nHello leave = new Hello(){\n  goodbye{\n\
    \    display message;\n}\n```\n\nThis create an instance of Hello that has all\
    \ of the Hello methods plus the new goodbye method. Notice that leave is an object\
    \ and not a class and you can call methods method. Notice leave.goodbye() at once.\
    \ You have avoided having to create a new class just to create one instance of\
    \ it. If the class you are extending has a constructor that needs parameters,\
    \ simply call the constructor in the usual way and add the code that extends the\
    \ class immediately after.\n\nSo to create an instance of an anonymous class based\
    \ on an existing class you simply start by creating a new instance of the class\
    \ and then tag on, in curly braces, all the methods you want to add.\n\nIn the\
    \ case of an event handler you can take an interface and implement it as if it\
    \ was a wasth, and create an instance in one go. This is just shorthand, syntactic\
    \ sugar if you like, for what we did in the previous sections.\n\nFor example:\n\
    \n```\nMyInterface instance=new MyInterface{\n  functions which are needed to\
    \ implement MyInterface\n}\n```\n\ncreates an instance of the implementation of\
    \ MyInterface that is contained within the braces with no need to define a class\
    \ to get an instance of it."
