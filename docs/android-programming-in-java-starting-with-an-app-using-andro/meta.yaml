    \    b.setText(\"you clicked me\");\n}\n```\n\nThe instance of our custom listener,\
    \ complete with our OnClick event handler, is ready to use as before:\nButton\
    \ button = (Button)findViewById(R.id.button);\nbutton.setOnClickListener(Listener);\n\
    \nOf course, you can save the use of a variable and simply use the anonymous class\
    \ in the setOnClickListener as you would with a lambda:\nButton button = (Button)findViewById(R.id.button);\n\
    button.setOnClickListener(new View.OnClickListener() {\n@Override\n    public\
    \ void onClick(View view) {\n    Button b=(Button) view;\n    b.setText(\"you\
    \ clicked me\");\n});});\n\nWe no longer have to the Listener variable, but the\
    \ cost is the need to remember to call the function with a right parenthesis.\
    \ This is almost as compact an expression as using a lambda. The only downside\
    \ is the need to state the type of the class you are basing your new instance.\
    \ The lambda uses the target type to do type inference.\n\nThe really good news\
    \ is that Android Studio will help you create the anonymous class. If you start\
    \ to type in OnClickListener it will provide you with options to complete the\
    \ name. When you select OnClickListener it will then generate functions for all\
    \ of the methods defined in the interface:\n\n![](bbox=[0.19, 0.755, 0.809, 0.883])"
  merge: -1
  pgno: 96
- img_proc: false
  md: "All you have to do is provide the code, in the body of each of the functions\n\
    that does what you want.\n\n# Code Folding\n\nThere is one small mystery that\
    \ we have to deal with. Android Studio uses\ncode folding to hide the details\
    \ of blocks of code from you. Usually this is\nuseful, but in the case of lambdas\
    \ and anonymous classes it can be\nconfusing.\n\nFor example if you type in the\
    \ code above that sets the onClickListener then\nin folded view the code reads:\n\
    \n```\nButton button = (Button) findViewById(R.id.button);\nbutton.setOnClickListener((view)\
    \ -> {\n    Button b = (Button) view;\n    b.setText(\"You clicked me\");\n});\n\
    ```\n\nThis is exactly how you would write the same code using a lambda. Indeed\n\
    ambdas are converted to this form by the compiler i.e. they are syntactic\nsugar\
    \ on top of anonymous classes.\n\nBut this way of representing the code is purely\
    \ for looking at. If you click the\ns + button to the left you will see the code\
    \ expand to reveal the full\nversion with the anonymous class.\n\nSo be careful\
    \ not everything that looks like a Java 8 lambda is actually a\nJava 8 lambda,\
    \ it could be an anonymous class that the code editor just\ndides to show you\
    \ as if it was a lambda. The only time this could cause a\nproblem is if you were\
    \ working with a pre-java 8 program and mistakenly\believed that you could use\
    \ lambdas.\n\n# Which Approach Should You Use?\n\nLambdas are equivalent to anonymous\
    \ classes and you can use whichever\ny you prefer if you can use Java 8 in your\
    \ project I would recommend\nwriting event handlers as lambdas where possible\
    \ - they are simpler to\nread.\n\nOf course if the event handler isn't implemented\
    \ as a SAM then you cannot\nuse a lambda. There are lots of examples of event\
    \ handlers grouped\nunder the control of a single object. This was done to make\
    \ it easier\nto implement in the days before lambdas but now it simply means you\
    \ have\nto use an alternative method such as an anonymous class."
  merge: -1
