  md: "For a new project all you have to do is select source and target compatibility\
    \ at 1.8 in the Project Structure dialog box accessed using File, Project Structure:\n\
    \n![](bbox=[0.196, 0.163, 0.745, 0.403])\n\nIt is worth noting that the current\
    \ implementation of Java 8 replaces its support by the Jack compiler. If you have\
    \ an old project that uses Jack and related tools then look up in the documentation\
    \ how to remove it and use the default Java 8 implementation instead.\n\nAs long\
    \ as you have enabled Java 8, you can make use of lambda functions both to implement\
    \ event handlers and in more general situations.\n\nFirst what is a lambda?\n\n\
    A lambda is a function that you can define using special notation. The function\
    \ doesn't have a name, it is an anonymous function. A lambda can be stored in\
    \ a suitable variable and passed to another function.\n\nYou define a lambda by\
    \ supplying a head with parameters and a body of code:\n\n```\n(parameter list)\
    \ -> {\ncode...\n  return something;\n};\n```\n\nFor example:\n(a,b)->{\n  return\
    \ a+b;\n}\n\nIf you are a long time Java programmer what will be most shocking\
    \ that there are no type specifiers in this declaration. Don't worry a lambda"
