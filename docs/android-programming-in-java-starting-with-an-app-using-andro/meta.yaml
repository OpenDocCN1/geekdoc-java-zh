  md: "The reason for this is that the NumberPicker is slightly more complicated than\
    \ the other Pickers in that it allows you to set what the spinner displays.\n\n\
    There are two distinct ways in which you can set the range that is displayed,\
    \ as pair of max/min values, or as the values stored in an array.\n\nFor example,\
    \ if you just want the NumberPicker to show 0 to 9 you might use: NumberPicker\
    \ np= (NumberPicker) findViewByIdById(R.id.numberPicker); np.setMaxValue(9); np.setMinValue(0);\n\
    \n![](bbox=[0.388, 0.246, 0.558, 0.463])\n\nIf you don't want the spinner to wrap\
    \ around you can use: np.setWrapSelectorWheel(false);\n\nIf you want to give the\
    \ user the choice of 0, 10, 20 and so on up to 90 you first have to initialize\
    \ a string array of the correct size for these values. In this case, the difference\
    \ between MaxValue and MinValue properties plus 1 gives the number of elements\
    \ in the list.\n\nTo create an array we need a simple for loop:\n\n```\nString[]\
    \ values=new String[10];\nfor(int i=0;i<values.length;i++){\n  values[i]=Integer.toString(i*10);\n\
    }\n```"
