  md: "Now the event handler will be called when the Send menu item is selected by\
    \ the user. The event handler should return true if it has consumed the event\
    \ and false if it wants to pass it on to other handlers.\n\nThe entire onCreateOptionsMenu\
    \ method is:\n```java\npublic boolean onCreateOptionsMenu(Menu menu) {\n    getInflater().inflate(R.menu.menu_main,\
    \ menu);\n    MenuItem mitem=menu.findItem(R.id.action_send);\n    mitem.setOnMenuItemClickListener(\n\
    \        (item) -> {\n            process event\n            return false;\n \
    \       });\n    return true;\n}\n``````\n\nYou can also add an event handler\
    \ for the menu in the XML resource using the android:onClick attribute. The event\
    \ handler has to have the same signature as the one demonstrated above, i.e. it\
    \ has to return a boolean and have a single Nullitem parameter. For example:\n\
    \n```\npublic boolean myOnClick(MenuItem item) {\n    return true;\n}\",\n```\n\
    \n```\n```xml\n<item android:id=\"@id/action_send\"\n    android:title=\"Send\"\
    \n    app:showAsAction=\"ifRoom\"\n    android:icon=\"@android:drawable/ic_menu_send\"\
    \n    android:onClick=\"myOnClick\" />\n```\n```\n\nYou can use this method to\
    \ connect as many individual event handlers as you require for each of the menu\
    \ items.\n\nThis is not why it is usually used. It tends not to be a good idea\
    \ to attach event handlers to the click events of each menu item.\n\nInstead the\
    \ Activity has an onOptionsItemSelected event handler method which is called when\
    \ any of the items in the menu is selected. Obviously this saves a great deal\
    \ of effort because you just have to implement a single event handler – and you\
    \ don't even have to hook it up to the menu."
