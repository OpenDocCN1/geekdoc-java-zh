  md: '# Edge Alignment


    The principle is that you can specify the alignment of any pair of edges, one
    in the parent and one in the child. This will move the child so that its edges
    lines up with the parent edge, for example, top edge to top edge. If you specify
    two pairs of edges then you can change the size of the control as well as positioning
    it. For example, top to top and bottom to bottom makes the child control the same
    height as the parent.


    # Layout Relative to Parent


    The fundamental parent layout properties are:


    +   - layout alignParentTop

    - layout alignParentLeft

    - layout alignParentBottom

    - layout alignParentRight


    which align the corresponding edge of the control with that of the parent container.


    For example: setting layout_alignParentLeft moves the left side of the control
    to the left side of the parent:


    ![](bbox=[0.263, 0.465, 0.742, 0.584])


    This works without any resizing of the control. If you select two opposing alignments,
    top and bottom or left and right, then both the edges are moved and the control
    is resized. For example, setting layout_alignParentLeft and layout_alignParentRight
    produces:


    ![](bbox=[0.256, 0.683, 0.803, 0.802])


    You can also align to the center of the parent with:


    +   - layout centerInParent

    - layout centerVertical

    - layout centerHorizontal'
  merge: -1
