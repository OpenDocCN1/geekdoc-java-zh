    # Programming Layout Properties


    At the moment we are relying on default settings for the properties, and the layout
    properties in particular, of the View objects we are creating. However, in practice
    you could spend the time and lines of code to set all of the properties needed
    to create any user interface and layout you wanted to.

    You now know how to create a UI completely in code. All you have to do is create
    all of the objects you need, set their properties and add them to suitable layouts.
    This is a little more complicated than you might think because each layout type
    has a different set of layout properties. Exactly how this is done is easy enough,
    but if you don''t want to know about it at this stage you can skip ahead as it
    doesn''t change any of the general principles.

    As explained in the previous chapter, each type of Layout has an associated class
    derived from LayoutParams layout.LayoutParams where layout is the name of the
    Layout class. For example, LinearLayout has the'
