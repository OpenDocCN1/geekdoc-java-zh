    If you want to use multiple event handlers then you need to use another\napproach.\n\
    \n# Anonymous Classes\n\nAnonymous classes where introduced into Java to avoid\
    \ having to explicitly\ncreate a class in a separate file complete with yet another\
    \ name. It was the\nbest way of implementing event handlers before the lambda\
