  md: "You can spend a great deal of time exploring ways to make use of a button's\
    \ properties to style it just as you want it to look.\n\nTo attach a click event\
    \ handler on both buttons you can simply define a function in the Activity and\
    \ set the onClick property on each button to doButtonClick:\n\n```\npublic void\
    \ doButtonClick(View e){\n    //process event\n}\n```\n\nYou can find examples\
    \ of using buttons this way in earlier chapters.\nNow that we know how to handle\
    \ events using lambdas it is worth applying this more sophisticated technique.\
    \ As we want to assign the same event handler to all three buttons we need to\
    \ create an instance of OnClickListener using a lambda.\n\nAll you have to type\
    \ is:\nOnClickListener\n\nbut it is easier to select OnClickListener (View) when\
    \ the suggestions appear after you type the On. Next type a variable name and\
    \ the lambda you want:\nView.OnClickListener myOnClickListener=(view)->{\n   \
    \ handle event\n}\n\nFinally you need to set the instance of the event handler\
    \ on each of the buttons:\nButton button = (Button)findViewById(R.id.button);\n\
    ImageButton imgbutton=(ImageButton)findViewById(R.id.imageButton);\nbutton.setOnClickListener(myOnClickListener);\n\
    imgbutton.setOnClickListener(myOnClickListener);\n\nNow when you click on either\
    \ of the buttons myOnClickListener is called.\nIt is also worth noting that, while\
