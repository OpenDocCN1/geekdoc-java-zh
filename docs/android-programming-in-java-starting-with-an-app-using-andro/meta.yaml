- img_proc: false
  md: 'When you are working with components in code the getWidth and getHeight properties
    will give you the actual width and height of the control. The getMeasuredWidth
    and getMeasuredHeight properties will give you the measured width and height before
    any adjustment by the Layout has performed.


    Finally, it is worth pointing out that if you want to be sure the three Buttons
    are the same size you set their widths to 0dp and weight to 1 (or the same value).
    Why is this necessary? When you set the widths to zero all of the space is unused
    and system will divide it equally between each one. You can also set their widths
    to some constant minimum value and then let the weight mechanism share out the
    unused space.


    # RelativeLayout


    The RelativeLayout was the most used in the past and is still worth knowing about
    you will meet it in existing apps and you might have to use it if ConstraintLayout
    doesn''t work for you. It was the one that was favored by Android Studio until
    the ConstraintLayout was introduced.


    It is a complex and sophisticated layout component and you might think that you
    should prefer simpler alternatives if at possible. For example, you can often
    use a number of LinearLayouts to do the work of a single RelativeLayout. The most
    commonly quoted rule is that you should try to design your UI using the smallest
    number of Layouts. In particular, deep nesting of Layouts, i.e. one Layout inside
    another, slows down then because the system has to dig deep into each layer of
    Layout and this can take a lot of work. The rule is:


    +   - Prefer a shallow sophisticated Layout to a deep nest of simpler ones. You
    can usually replace a set of nested LinearLayouts with a RelativeLayout or a ConstraintLayout.


    For such a capable Layout, RelativeLayout has only a few Layout properties. They
    fall into two groups:


    +   - Properties concerned with positioning the control relative to the parent
    container

    - Properties concerned with positioning relative to another control.


    At least one of the controls in the Layout has to be positioned relative to the
    parent container to give the rest of the Layout position. However, any number
    of controls can be positioned relative to the parent container if this fits in
    what you are trying to achieve.


    The Relative parameters are presented and organized by the Attributes window slightly
    differently to the way they are represented as constants in the XML or in code.
    This description applies to the way Android Studio presents them. Refer to the
    documentation for the XML or programmatic constants.'
