  md: "Finally we use the button'ssetOnOnClickListener method to connect its\nOnClick\
    \ event to our new listener object:\nbutton.setOnOnClickListener(listener);\n\n\
    ```\nPutting it all together, minus some of the extra generated code:\n@Override\n\
