  md: 'The <item> tag contains another <menu> tag in turn contains two more items
    that correspond to New and Open menu options. You can see the structure in the
    Component Tree:


    ![](bbox=[0.383, 0.157, 0.616, 0.303])


    The Component Tree can also be used to do some limited editing of the menu by
    dragging-and-dropping to modify how items are nested.


    Exactly how this simple menu depends on how it is displayed, but it defines a
    menu with a single top level File option when selected displays a submenu of two
    other options, New and Open.


    # Displaying a Menu


    There are four different ways you can display a menu:


    +   1. Action bar such as the App Bar

    2. Context menu

    3. Contextual action bar (CAB)

    4. Popup


    The action bar or App bar was introduced in Android 3 as a replacement for the
    original options menu and has become the standard primary menu for apps. With
    Android 5 a new way of implementing it was introduced, namely the Toolbar, which
    is a standard widget that can be edited using the Designer. This makes it easier
    to integrate and work with. If you want to use the action bar in earlier versions
    of Android you need to make use of the Support Library – this is automatically
    included when Android creates a project for you.


    The context menu is a popup menu that appears in response to a long click on a
    component of the UI.


    The Contextual Action Bar appears at the top of the screen when the user long-clicks
    on a UI element and it is supposed to be used to provide actions that are appropriate
    for the item that has been selected. It too needs the Support Library to work
    with older versions of Android.'
