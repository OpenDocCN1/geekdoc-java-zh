  md: 'Chapter 15


    Pickers


    Android currently supports three Pickers for dates, times and general numbers
    and they are important ways to get user input. However, they have been through
    so many revisions that they lack simple documentation or guidelines on how to
    use them. Let''s clear up the confusion.


    # Working with Pickers


    +   - A picker is a "dial" that you can use to select one of a predetermined set
    of values.


    In this sense it is a lot like the Spinner covered in the previous chapter, but
    one that has a restricted set of choices.


    There are two ways to make use of a Picker, as a widget, or as a dialog box. You
    will find the TimePicker and the Date, ready to place on the design surface, in
    the Date&Time section of the Palette. The NumberPicker, however, is much lower
    down, in the Advanced section:


    ![](bbox=[0.313, 0.558, 0.712, 0.755])


    In some cases you will probably want to create a Dialog box and will need to use
    a complex DialogFragment to wrap the Dialog and manage its life cycle, and there
    are many situations using the raw widget will do the job well enough. For more
    on DialogFragment see: **Android Programming: Mastering Fragments & Dialogs.**


    269'
  merge: -1
  pgno: 268
- img_proc: false
  md: '# TimePicker


    The TimePicker is a very easy way to get started. If you create a new Android
    project, called TimeAndDate and accept all of the defaults you can place a TimePicker,
    listed top of the Date & Time section of the Palette, on the design surface just
    like any other widget, and size locate it as required. In its default configuration
    shows in the Designer using the style android:timePickerStyle and has an analog
    clock face and an input area that can be used to set the time by dragging the
    hands on the clock face:


    ![](bbox=[0.383, 0.265, 0.612, 0.448])


    Pickers are complex widgets that have multiple components, each of which can change
    appearance depending on how they are styled and which version of Android you are
    targeting. While you can select from a range of themes, they don''t work with
    all with SDK/APIs and they may to be removed at some time in the future. For example,
    API 14 this theme was used:


    TimeAndDate


    ![](bbox=[0.423, 0.6, 0.562, 0.675])


    API 14 adopted the Holo theme and the picker looked like this:


    TimeAndDate


    ![](bbox=[0.383, 0.77, 0.562, 0.895])


    270'
