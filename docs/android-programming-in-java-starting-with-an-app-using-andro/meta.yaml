    \    int position,\n    long id) {\n}\n```\n\nWhat is this AdapterView that has\
    \ suddenly appeared as part of the code? As explained in earlier chapters, as\
    \ all the visible objects of the UI correspond to one sort or another. An AdapterView\
    \ is the View object that corresponds to one of the displayed items in the Spinner.\
    \ You could, for example, use the AdapterView passed to the event handler to modify\
    \ the appearance of the displayed item."
