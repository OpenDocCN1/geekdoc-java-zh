- img_proc: false
  md: 'It is also worth knowing at this early stage that the Attributes window can
    help you in a number of ways. The first is that it has a diagram that shows you
    the currently applied constraints, and lets you modify them and set distances
    exactly:


    ![](bbox=[0.312, 0.175, 0.636, 0.375])


    If you click on one of the constraint lines then you can enter a value for the
    distance. You can also click on the dot and delete the constraint completely or
    on the + and add a constraint.


    As you might guess, there are properties which let you set the location and margins
    for each position using the Attributes window.


    To see all of the properties you have to click on the View all properties icon
    at the top right of the Attributes window – the double arrow.


    The properties listed in the window are not a simple representation of the properties
    that you might set in order to achieve the same results. They are organized and
    simplified to make using the Designer easier.


    For example, if you look in the fully expanded Attributes window you will see:


    # Layout


    # MarginTop


    which gives the distance from the top edge and


    # Constraints


    # top_toTopOf


    which specifies the object that the positioning is relative to.


    If you look in the XML file you see:


    ```

    app:layout_constraintTop_toTopOf="parent"

    android:layout_marginTop="348dp"

    ```


    All layout properties start with layout_name where the name gives the positioning
    affected. The mapping from the Attributes window to the XML properties is fairly
    obvious.'
  merge: -1
  pgno: 61
- img_proc: false
  md: 'It is also worth understanding that in allowing you to set the position of
    a component by simply dragging it to the location you want, the Designer is working
    out how to set multiple properties correctly. In the example above, it sets the
    top_toTopOf and MarginTop properties. You could do this manually to get the same
    effect, but the Designer does it simply from where you have positioned a component.


    This is why it is easier to let the Designer set the properties for you.


    The ability to set which other component to position against, i.e. which component
    to set the position relative to, means you can build sets of components all aligned
    to one that is aligned to the container, so that they all move together as a group.


    You can set components to align with the left and right sides of the screen and
    allow for rotation from portrait to landscape. You can also set constraints which
    divide the available space up by percentages – more of this in Chapter 5.


    The ConstraintLayout is the preferred layout component. The reason is that is
    fast and efficient compared to the usual alternative of putting one layout inside
    another. Unless you have a good reason not to, it is the one to use.


    However, all this said, it is very easy to get into a complete mess with the layout
    in the Designer. If components go missing then chances are on top of each other.
    The easiest way to sort out this problem is to go to the Attributes window and
    manually reset one of the positioning properties.


    It is helpful to notice the following:


    +   - Use positioning relative to another component if it makes logical sense.
    That is, if you have a text entry then it will make sense to its position Accept
    Button relative to its right-hand side.

    - If you position everything relative to the container parent then you effectively
    have an absolute layout.

    - If the screen size changes then it is possible that components will overlap
    one another if there is not enough space. Always make sure your layouts have plenty
    of unnecessary space.

    - A good strategy when working with a group of components is to pick one that
    you position relative to the container, then position all other components relative
    to it to ensure that you move the group and keep alignments.

    - Remember that some components can change their size as well as location and
    this can modify the position of components positioned relative to them.'
  merge: -1
  pgno: 62
- img_proc: false
  md: 'The ConstraintLayout component is used by default, but you can change this

    any of the other layout components – Relative, Linear, Table, Grid and

    Frame. There are also other container components which can be used in place

    of these standard layout components.


    One thing worth knowing at this early stage is that components have layout

    properties that are provided by this container, so the set of properties that
    we

    have looked at in connection with the ConstraintLayout component are

    uniqueue to it. That is, if you use another layout then you have to learn its

    layout properties from scratch.


    Again this is another topic we have to return to.


    # Sizing


    In comparison to positioning, sizing a component is almost trivial.

    All components have a Height and Width property and these correspond to

    their drawn height and width when the component is actually rendered on

    the screen.


    You may have noticed that there are what like sizing handles in the

    corners of the components that you place in the Designer. If you drag any of

    these, the component will change its size. However, the component''s content

    will not be resized. All that happens is that the content has some space

    around it. If the content gets bigger or smaller the component stays the same

    size. If the content it too big then it won''t fit in the component.


    You can see the space is fixed in the Attributes window. The lines shown

    inside the component relate to the size of the component and its relation to its

    content. Straight lines indicate a fixed size:


    ![](bbox=[0.275, 0.615, 0.675, 0.795])'
  merge: -1
  pgno: 63
- img_proc: false
  md: 'An alternative to fixed size components is to allow them to automatically resize
    to fit or wrap their contents. To set this all you have to do is click on the
    inner straight lines which change to << << to suggest springs which allow the
    component to change its size:


    ![](bbox=[0.315, 0.187, 0.718, 0.363])


    The third option is Match Constraints which lets the component change its size
    to fill the available space.


    ![](bbox=[0.315, 0.437, 0.718, 0.631])


    This auto-sizing behavior is set by the layout_width and layout_height properties.
    You can modify this by typing in an exact size, e.g. 100dp, into the value box
    next to the property.


    Also notice that you can set a maximum and a minimum size for most components.
    Setting a maximum will result in the content being truncated if it doesn''t fit.
    Setting a minimum is the best plan because then the component will increase in
    size when necessary.'
