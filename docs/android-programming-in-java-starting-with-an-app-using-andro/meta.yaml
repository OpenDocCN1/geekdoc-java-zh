- img_proc: false
  md: 'LinearLayout.LayoutParams class, which is used to define all of the layout
    properties that a View object can use when added to a LinearLayout object.


    You can probably guess how to make use of the LayoutParams class. All you do is
    create a correctly initialized instance of the appropriate LayoutParams class
    and setLayoutParams on any View object you want to customize.


    For example, to set the height and width in a LayoutParams object we could use:


    ```

    LinearLayout.LayoutParams LP=new LinearLayout.LayoutParams(100, 100);

    ```


    There is a constructor for all of the LayoutParams classes that accepts just the
    width and the height properties. Once you have a LayoutParams object you can assign
    it to any View object by setting the View''s LayoutParams property:


    ```

    b3.setLayoutParams(LP);

    lin.addView(b3);

    ```


    With this change the third button in our previous layout will be exactly 100 pixels.


    Notice the constructor works in pixels, i.e. px, instead of device-independent
    pixels, dp. You can also use constants for MATCH_PARENT and WRAP_CONTENT. For
    example:


    ```

    LinearLayout.LP=

    new LinearLayout.LayoutParams(WRAP_CONTENT,WRAP_CONTENT);

    ```


    There is also a constructor that allows you to set the weight. Other layout properties
    have to be set using setProperty methods after the constructor has done its job.
    For example:


    ```

    LP.setMargins(20,20,20,20);

    ```


    which sets the left, top, right and bottom margins accordingly:


    ![](bbox=[0.323, 0.642, 0.62, 0.735])


    More complex Layout objects have correspondingly more LayoutParams that you have
    to spend time setting up.


    So to be clear – there are properties such as Text that you set directly on the
    View object, but there are also Layout properties that you have to set on an appropriate
    LayoutParams object, which is then set as the View''s LayoutParam property.'
