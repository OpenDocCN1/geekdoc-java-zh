  md: '# Chapter 9


    # Menus - Toolbar


    A UI isn''t just made up of buttons and other widgets or components; the menu
    is still a useful way of letting the user select what happens next. Android''s
    menu system is easy to master. We also need to find out about the Toolbar implementation
    of the action bar.


    There is a menu designer in Android Studio 3.0 and it works quite well, but it
    is still worth knowing how to create the XML, yourself.


    The basic principles of menu creation are the same as for building a UI in that
    a menu is a collection of View objects. You can create the View objects in code
    or you can use an XML file and a special inflater, a LayoutInflater, to convert
    it into the objects. Defining a menu is more or less the process every time, although
    the way in which you use the menu varies according to where and when the menu
    is shown, but even this follows roughly the same steps. Let''s look at the general
    idea first.


    # Creating a Menu Resource


    Menus are generally defined by a menu resource file, which is an XML file which
    is rendered to create the menu. All menu resources are stored in the app\menu
    directory. If you right click on this directory you can select the New Menu resource
    option and type in a name – all lowercase as usual:


    ![](bbox=[0.318, 0.655, 0.682, 0.843])


    You can ignore the Available qualifiers for the moment. The idea is that each
    resource you create will be used in a given situation according to the'
  merge: -1
  pgno: 174
- img_proc: false
  md: 'qualifiers you select. In this way you can create custom menus for particular
    languages for example. More about this idea in Chapter 11.


    When you click the OK button the resource file is created and it will be opened
    in the layout editor. In principle should allow you to edit the menu using dragging-and-drop
    just like a general layout, but at the moment it is very limited and tends to
    create XML that doesn''t work. You can place a menu item onto the menu and customize
    some of its properties, but this is as far as it goes:


    ![](bbox=[0.163, 0.255, 0.794, 0.532])


    You can work either with the menu editor or the XML directly. You will discover
    that the XML Editor suggests autocompletions so you aren''t entirely without even
    help even if you have to abandon the menu editor.


    Before we create a menu we need to know something about the XML tags and the corresponding
    menu items we can use.


    # The Menu Tree


    A menu is a hierarchy of options. The top-level menu presents a set of items.
    If any of the items is itself a menu, i.e. a submenu, then it can contain more
    items.


    Android menus make use of three objects, and hence three XML tags:


    +   * <menu>

    * <item>

    * <group>


    At the top level the <menu> tag inflates to a Menu object which is a container
    for menu items and group elements. The <item> tag inflates to'
  merge: -1
  pgno: 175
- img_proc: false
  md: "Menulitem object which is a single option in the menu. It can also contain\
    \ a <menu> tag which can turn contain more <item> tags to create a submenu. The\
    \ <group> tag doesn't inflate to an object. Instead it sets the group id of all\
    \ the items it contains. You can set various properties of a group of items in\
    \ one operation i.e. they act as a group.\n\nThere are a range of attributes that\
    \ can be used with <item> and <group> and not all can be used in every situation.\
    \ The three that you need to know are:\n\n+   - id - an integer that you use to\
    \ identify the menu item\n- title - a string that determines what the menu item\
    \ displays\n- icon - a drawable image used when the menu item can be displayed\
    \ as an icon.\n\nWith all this explained let's define a menu with a single File\
    \ item and a submenu consisting of two items, New and Open:\n\n```\n<xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    >\n  <item\n    android:id=\"@id/file\"\n    android:title=\"File\">\n\n  <!--\
    \ \"file\" submenu -->\n  <item>\n    android:id=\"@id/create_new\"\n    android:title=\"\
    New\" />\n  <item>\n    android:id=\"@id/open\"\n    android:title=\"Open\" />\n\
    \  </item>\n</item>\n</menu>\n```\n\nYou can see in the example that we have a\
    \ top level menu item that we don't bother giving an id which contains a single\
    \ <item> tag. This displays the text File when the menu is displayed. In case\
    \ you have forgotten the notation \"@+id/name\" automatically creates the id integer\
    \ value. You can then use name in code to find and work with the menu item."
