  md: '# Summary


    +   You can use different Layout containers to create UIs. Each Layout has its
    own facilities for how child controls are positioned and sized.


    +   The default in Android Studio 3 is ConstraintLayout.


    +   The most important alternatives are FrameLayout, LinearLayout and RelativeLayout


    +   Each Layout has its own set of layout properties to control positioning and
    sizing of a control. Child controls have an instance of the layout properties
    class to tell the Layout how to position and size them. All Layouts support layout,
    width and layout height.


    +   You can specify positioning using a number of different units, but in most
    cases use dp (density-independent pixels) as this works the way on screens of
    the same size but different resolutions.


    +   As far as the Layout is concerned, a control is just a rectangle, width by
    height, positioned using top and left.


    +   All controls have padding properties which specify extra space around the
    control.


    +   Some Layouts provide layout margin properties that set extra space around
    the outside of the control.


    +   Gravity sets the simple positioning of an object - top, bottom, right, left.
    Every control has a gravity property which sets the gravity of its content, e.g.
    the text in the Button. Some Layouts have a layout_gravity property that sets
    how a control will be positioned.


    +   The FrameLayout is the simplest of all Layouts and has layout_gravity for
    positioning. Most cases it holds a single control and it is most often used as
    a placeholder.


    +   The LinearLayout can be used to organize controls as a row or a column. As
    well as gravity, the LinearLayout also supports the specification of a control''s
    weight. After measured size of each control is determined by the Layout, the remaining
    unused space is allocated to the controls in the same proportions as their assigned
    weights.


    +   Complex layouts can be created by nesting LinearLayouts inside each other
    to produce a column of rows or a row of columns. This has resulted in the LinearLayout
    being the most used.


    +   The general principle is to try to select a Layout that results in the smallest
    nesting of Layout containers. It is therefore better to use a single RelativeLayout
    or ConstraintLayout rather than deeply nested LinearLayouts.'
  merge: -1
