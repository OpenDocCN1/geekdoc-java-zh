  md: 'Finally we need to change the getView method to use the two new private variables:\viewHolder.title
    = (TextView) row.findViewByIdById(resTitle);\viewHolder.number = (TextView) row.findViewByIdById(resNumber);


    With these changes the adapter can be used as:

    MyAdapter=new MyAdapter(

    this,

