  md: '# Radio Buttons


    The final "simple" input control is the RadioButton. This works like a CheckBox
    in that it be in one of two states, but the big difference is that a set of RadioButtons
    works in a group and only one of them can be selected at a time.


    The reason for the term "radio button" is that, in the early days of electronics,
    car radios had mechanical tuning buttons arranged in a line which let the driver
    quickly select a selection by pressing a button. When you pressed a new current
    button popped up so that only one button was pressed at any given moment, making
    sure that you only listened to one station at a time.


    The only complication in using RadioButtons is making sure you group them correctly.
    To do this we have to make a RadioGroup container which is used to hold all of
    the buttons that work together. There are many number of different containers
    used to group controls, but the most basic of these is the RadioGroup.


    Using Android Studio you can create a group of RadioButtons by first placing a
    RadioGroup container on the design surface and then placing RadioButtons inside
    the container as you require. If a group of RadioButtons doesn''t work as you
    expect, the chances are that not all the buttons are within the RadioGroup.


    The easiest way to check, create and edit a group of RadioButtons is to use the
    Component Tree window where you will be able to see exactly how they are nested.
    You can also add RadioButtons to the container by dragging to the Component Tree
    window.


    ![](bbox=[0.331, 0.597, 0.722, 0.715])


    All the RadioButtons within a RadioGroup automatically work so that only one button
    can be selected at a time and you don''t have to do any extra work to implement
    this behavior.'
  merge: -1
  pgno: 112
