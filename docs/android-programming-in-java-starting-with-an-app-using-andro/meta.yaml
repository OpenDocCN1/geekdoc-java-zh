    # # Simple Animation


    To bring this chapter to a close we will animate a ball bouncing around a Canvas,
    or a Bitmap depending how you look at it. This might seem like a strange topic
    to end on, especially since we are not going to do the job in the way that most
    Android programmers would go about it. Indeed Android has a range of different
    animation facilities – View animation, Value animation and so on. However, none
    of them demonstrates the fundamental way that dynamic graphics work and before
    you move on to learn more sophisticated ways of creating animation it is a good
    idea to find out how things work at the lowest level.


    This example not only teaches you about animation, but also about the problems
    of creating dynamic graphics of any kind in the Android UI. One warning – do not
    assume this all there is to know about Android animation or that this is the best
    way to do things.


    To animate something in the simplest and most direct way you all have to draw
    the shape, change the shape, erase the original graphic, and draw it. In most
    systems this is usually achieved at the lowest possible level by using a timer
    to call an update function which erases the shape, does the update to the shape
    and then draws it at its new location. You can take this approach to Android,
    but for various reasons it isn''t the ways are usually done. It'
