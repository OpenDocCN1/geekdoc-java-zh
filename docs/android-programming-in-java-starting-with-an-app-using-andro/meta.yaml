  md: 'Notice that the choice of which Activity starts the app has nothing to do with
    what you call it, i.e. calling MainActivity isn''t enough.

    For the moment you can rely on Android Studio to look after the Manifest for.
    In cases you will only need to edit it directly when you need to correct an error
    or add something advanced.


    # Inside the Activity


    The generated Activity has one class, MainActivity, which holds all of the methods
    and properties of your activity.

    It also has three generated methods:


    +   - onCreate

    - onCreateOptionsMenu

    - onOptionsItemSelected


    The last two are obviously connected to the working of the OptionsMenu, which
    is an important topic but that one can be ignored for the moment. Not all Activities
    need to have an OptionsMenu and you could even delete these methods if you don''t
    want to support an options.

    All three of these methods are event handlers. That is when they are called the
    event that after occurs. The whole of an Android app is a collection of nothing
    event handlers and their helper functions.

    The most important method generated by Android Studio is onCreate. This is an
    event handler and it is called when your app is created and where we do all the
    initialization and setting up for the entire app. It is also generally the place
    we show the app''s main UI screen.

    Let''s take another look at the first two lines of generated code for onCreate,
    which are the most important:


    ```

    protected void onCreate(Bundle savedInstanceState) {

    super.onCreate(savedInstanceState);

    setContentView(R.layout.activity_main);

    ```


    The onCreate event handler is a Bundle object called savedInstanceState. This
    is intended to preserve state information between invocations of your app and
    we will see how this used later. In this case no data has been saved and so savedInstanceState
    is null – but you still have to pass it on to the inherited onCreate method. You
    will learn a lot about Bundle in Chapter 13.

    The final instruction calls setContentView, which is a method that has a number
    of different overloaded forms. In this case we pass an integer that indicates
    which XML file describes the layout to be used for the view. The setContentView
    method uses this to create all of the components of your UI as defined in the
    XML file. That is, this is the connection between the layout'
  merge: -1
