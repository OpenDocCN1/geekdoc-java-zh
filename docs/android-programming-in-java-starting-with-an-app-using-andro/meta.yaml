  md: "# Finding View Objects\n\nNow suppose we want to do something to one of the\
    \ other components in the View. In this case we have to find the object that represents\
    \ the component without the help of the event handler's argument. For example\
    \ how we find the TextView that we placed below the button?\n\nIn the event handler\
    \ the Button is the object that caused the event to happen so it is already found,\
    \ but how do you find another component in the layout? This is a very standard\
    \ pattern in working with View objects from the Activity. First you make use of\
    \ the R object to find the component's id. In this case the TextView has been\
    \ given you the idView by default we can use:\n\nR.id.textView:\n\nand this returns\
    \ a unique integer that identifies the component.\n\nNext we use the Activity's\n\
    \nfindViewById(int)\n\nmethod which takes the integer and returns the Java object\
    \ corresponding to id.\n\nOf course this is returned as a View object because\
    \ findViewById doesn't know the type of the object it returns any more accurately.\
    \ So we have to cast make use of the TextView object.\n\nPutting all together\
    \ gives:\n\nTextView myTextView=findViewById(R.id.textView);\n\nOnce again Android\
    \ Studio will complain about TextView and if you press Alt+Enter it will add the\
    \ class import to the start of the program for you: import android.widget.TextView;\n\
    \nNow that you have the TextView object you can use the setText method to change\
    \ what it displays:\n\nmyTextView.setText(\"You Clicked My Button!\");\n\nThe\
    \ complete event handler is:\n\n```\npublic void buttonOnClick(View v) {\n   \
    \ Button button=(Button) v;\n    button.setText(\"I've Been Clicked!\");\n   \
    \ TextView myTextView=(TextView)findViewById(R.id.textView);\n    myTextView.setText(\"\
    You Clicked My Button!\");\n}\n```"
