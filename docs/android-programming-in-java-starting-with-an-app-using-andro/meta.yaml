  md: "This provides a way for the user set the time in the TextView:\n\n| 12 | 09\
    \ |\n|---|---|\n| 13 | 10 |\n| 14 | 11 |\n| Set Time 13:10 |\n\nIn most cases\
    \ the difficult part in using a Picker isn't setting it up or getting the data\
    \ from it, but in processing that data into a form in which your program can use\
    \ it. In this case we simply convert the time into a slightly formatted string\
    \ representation.\n\n# Updating the Time\n\nWhat about getting an update every\
    \ time the user changes the TimePicker? This requires an event handler for an\
    \ OnTimeChanged event which can be implemented with an OnTimeChangeListener interface\
    \ in the Activity, as an anonymous class or a lambda.\n\nA lambda is usually preferable\
    \ and as OnTimeChangeListener is a SAM there is nothing stopping you one.\n\n\
    The OnTimeChanged method has the following signature@\n\n```\npublic void onTimeChanged(\n\
    \    TimePicker view,\n    int hourOfDay,\n    int minute) {\n}\n```\n\nYou can\
    \ get that when the time is changed by the user, the OnTimeChanged method is called\
    \ and the TimePicker that triggered the event is passed as value, and its hour\
    \ and minute setting as hourOfDay and minute, and all that is needed is to set\
    \ the event handler using the setOnTimeChangeListener method.\n\nFor example,\
    \ to transfer the time to another TextView as you would use:\n\n```\ntp.setOnTimeChangeListener((view,hourOfDay,minute)\
    \ -> {\n    TextView tv = (TextView) findViewById(R.id.textView2);\n    tv.setText(Integer.toString(hourOfDay)\
    \ + \n        \":\" \" + Integer.toString(minute));\n});\n```"
