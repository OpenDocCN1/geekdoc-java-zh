    Sometimes the IDE is slow to notice that there is a suitable method and you have
    to type the method''s name in. Notice that you don''t type in parameters, just
    the name of the method.


    That''s all there is to it. You define your event handler with the correct signature
    and return type and set the appropriate onClick property in the Attributes window.


    When it comes to other types of event you have to do the job in code - the XML/Designer
    method only works for onClick.


    # Connecting the Activity to the UI


    Now we have an event handler hooked up to the button event we usually want to
    do something that affects the UI as a result.


    Let''s suppose that when the button is clicked we want to change the text displayed
    in the TextView widget to "I''ve Been Clicked!".


    We can do this by changing the TextView widget''s property to the new text. The
    only problem is how do we find the TextView widget in code? This is a fairly standard
    problem when you use a markup language to define the UI. The markup language defines
    widgets, or other UI objects, and the code has to have a way of making the connection
    to those UI objects. For example, in JavaScript you use the method getElementById
    to retrieve a DOM object corresponding to a particular HTML element.


    In Android we do something similar.


    First make sure you follow the idea that all of the XML generated by the Designer
    gets converted into a set of Java objects, for each component or View placed on
    the design surface. These objects have the same range of properties as you saw
    in the Attributes window and have methods to get other things done. All you need
    to do is find a way to reference one of them.'
