    # Sizing


    In comparison to positioning, sizing a component is almost trivial but with some
    interesting twists.


    You can see how the component is sized in the Attributes window. The type of lines
    shown inside the component indicate the size of the component and its relation
    to its content. Straight lines indicate a fixed size:


