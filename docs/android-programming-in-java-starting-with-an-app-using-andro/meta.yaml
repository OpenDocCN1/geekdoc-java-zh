  md: '# # Chapter 2


    # # Activity and User Interface


    So you know how to create an Android app, but do you really know how it works?
    In this chapter we look at how to create a user interface (UI) and how to hook
    it up to the code in the Activity.


    We discovered in Chapter 1 how to use Android Studio to build the simplest possible
    app. On the way we discovered that an Android app consists of two parts – an Activity
    and the View. The Activity is the code that does something and the View provides
    the user interface (UI). You can think of this duality as being similar to the
    HTML page and the JavaScript that runs to make it do something, or as a XAML form
    and the code behind.


    The key idea is that an Activity is the code that works with a UI defined by the
    View. This isn''t quite accurate in that an Activity can change its view so that
    one chunk of code can support a number of different views. However, there are
    advantages to using one Activity per view, for example, how the Android back button
    navigates your app – from Activity to Activity.


    A complex app nearly always consists of multiple Activities that the user can
    move between web pages but a simple app can manage well with just one Activity.
    There is no hard and fast rule as how many Activities your app has to have, but
    it has to have least one.


    If you are wondering if an Activity exist without a View, the answer is that it
    can, but it doesn''t make sense as this would leave the user with no way to interact
    with your app. An Activity is active when its View is presented to the user.


    It is really a great simplification to think in terms of an Activity as a single
    screen with a user interface.


    If you want to run without a UI what you want is a service or a content provider,
    which is beyond the scope of this book.


    It is also worth making clear at this early stage that an Activity has only one
    thread of execution – the UI thread and you need to be careful not to perform
    any long running task because this would block the UI and your app seem to freeze.
    That is, an Activity can do only one thing at a time and this includes interacting
    with the user. If you write a program using a single activity and it does a complicated
    calculation when the user clicks a'
  merge: -1
  pgno: 32
