  md: '+   You can hook up onClick event handlers defined within the current Activity
    to the widgets using the Attributes window.


    +   An onClick event handler is just a public function with the signature void
    myEventHandler(View v).


    +   The View object parameter is sent to the View object that raised the event.
    This can be used to access the properties/methods of the View object that the
    user interacted with.


    +   To access other View objects you follow the standard pattern of:

    1. Find the integer id via the string id, set in the Designer, of the widget using
    resource object R.id.stringId.

    2. Use the integer id to retrieve the Java object corresponding to the widget
    using findViewById(int Id).

    3. Work with the object''s methods/properties to modify it.'
