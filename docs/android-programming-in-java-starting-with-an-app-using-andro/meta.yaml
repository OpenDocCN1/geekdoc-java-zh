  md: '+   - You always have to check that things work as you expect. Always test
    what happens to your UI on a rotation.


    # Advanced State Management


    For completeness it is worth noting that there are many more approaches to maintaining
    state. Later you will need to discover how to store lots of user data for longer
    term persistence, and this is often enough to implement state management through
    a configuration change.


    There are also more advanced state management problems when you come to make use
    of Fragments, the subject of **Android Programming: Mastering Fragments & Dialogs**.
    In this case you can use setRetainedInstance to ask the system not to destroy
    an entire Fragment. This means that all of the data stored in the Fragment is
    retain even though the Activity may be removed from memory. This makes it possible
    to use a Fragment as a repository of state.


    The ultimate in making sure things happen as you want is to handle the configuration
    change yourself. You can do this by making a change to the manifest. It is up
    to you to make the changes needed when the **onConfigurationChanged** event occurs.
    You could, for example, opt to animate buttons and other UI objects into new positions
    or just ignore the need to reconfigure altogether.


    This is all advanced and for most applications you can get by just using the onSaveInstanceStateState
    and onRestoreInstanceState event handlers.'
  merge: -1
  pgno: 253
