  md: "All the onCreateOptionsMenu event handler has to do is inflate the XML file\
    \ that defines the menu:\n\n```\n@Override\npublic boolean onCreateOptionsMenu(Menu\
    \ menu) {\n    getMenuInflater().inflate(R.menu.menu_main, menu);\n    return\
    \ true;\n}\n```\n\nThe onCreateOptionsMenu method is called once when the Activity\
    \ starts. Before Android 3 it was called each time the menu was displayed on the\
    \ screen, but now the App bar is always on display. How to change a toolbar is\
    \ discussed later.\n\nAll the event handler has to do use the appropriate inflater\
    \ to create the menu from the resource file. The new View hierarchy of menu and\
    \ item objects is added to the menu object passed to the event handler. This is\
    \ important because that your new items are added to any that are already there.\
    \ This allows other Activities and Fragments to add items to a common toolbar.\n\
    \n# Where's My Toolbar?\n\nIf you try any out of this there is a chance that you\
    \ will do everything correctly and yet your Toolbar will not show.\n\nThere are\
    \ only two common reasons for this:\n\n+   1. You are targeting and using an early\
    \ version of Android which doesn't support the action bar. This is unlikely, especially\
    \ if you are using the Support Library.\n2. Much more common is that you are using\
    \ a theme that doesn't support the type of action bar you are using.\n\nThe solution\
    \ is easy. For Android 5 or later, when using the Support Library, select one\
    \ of the AppCompat themes if you want to make use of the new features introduced\
    \ with Android 5. As always, Android Studio generates the correct XML for the\
    \ styles that work with the Toolbar.\n\n# Responding to Menu Events\n\nYou can\
    \ attach click event handlers to the various items in a menu in the usual way.\
    \ This is something that is often overlooked because there is a simpler and standard\
    \ way of doing the job. However, it is worth seeing the direct method if only\
    \ to convince yourself that a menu is just another part of the View hierarchy\
    \ that your application displays. If you aren't familiar with how to attach a\
    \ click event handler to a View object, refer back to Chapters 4 and 5."
