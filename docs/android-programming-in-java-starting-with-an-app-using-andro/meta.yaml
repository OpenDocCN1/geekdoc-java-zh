  md: '# Chapter 14

    Spinners


    Working with Android Studio makes building the UI easy with an interactive editor,
    the Designer, but you still need to find out how to handle the things it isn''t
    quite so good at. In the next two chapters of our exploration of Android we look
    at spinners and pickers, the next step up from buttons and text controls.


    Spinners are what referred to as drop-down lists or something similar in other
    UIs. They allow the user to pick from a list of possible items. Pickers, which
    are the subject of Chapter 15, also allow the user to pick an item, but in this
    case the items are more narrowly defined - a date, a time or a number.


    # The Spinner and the Designer


    +   - The spinner presents a set of alternatives to the user and lets them select
    one.


    Putting a Spinner into your project is as easy as using the tool Palette in the
    Designer, but you can''t get away without some Java to make it all work. In particular,
    you need to define the list of items that the Spinner will display when the user
    activates it.


    When you place a Spinner on the design surface all you get is a blank control
    with a drop-down arrow that currently doesn''t do anything:


    ![](bbox=[0.377, 0.663, 0.673, 0.796])


    At the moment the Designer only provides minimal support for setting up the Spinner
    with some data to display. The simplest sort thing to show the user is a list
    of text items, and you might well think that the most direct way of doing this
    is to use a String array. It is, but they are slightly more complicated than this.
    They are simple, however, if you create a resource to'
  merge: -1
  pgno: 256
- img_proc: false
  md: 'specify the String array because in this case the system will do everything
    necessary to load the data.


    Setting the contents of the Spinner using a String array in code is a good way
    to see how the Spinner works, and this is what we do next, but it isn''t the way
    it usually happens.


    Android provides a comprehensive system of resources — strings, images and lots
    of XML files. The idea is that you can produce customized versions of your application
    just by changing the resource files, i.e. without having to modify your code.
    For detailed information on using resources refer back to Chapter 11.


    In the case of a Spinner you could set a resource that was a String array that
    provided the list of items to be displayed. If you wanted to create a version
    of your app for a foreign market you could get the list translated to create a
    resource in the new language.


    Resources are a great idea and you should use them for all fixed strings and fixed
    data in reality. So far, the examples have tended to avoid resources to make things
    simple, but for a Spinner you need to know how to code up a String array resource
    and use it.


    Android Studio does have good resource support but in some areas it is lacking.
    For example, in an ideal world the system would help you create a String or String
    array resource, but at the moment it only provides help for simple string values.
    It will help you create a String resource, but offers no assistance for a String
    array, for which we have no choice but work with the XML file.


    Find the strings.xml in the res/values directory and open the file strings.xml.
    Add to this the array definition:


    ```

    <string-array name="country">

    <item>Canada</item>

    <item>Mexico</item>

    <item>USA</item>

    </string-array>

    ```


    The meaning of the XML is obvious and this is the advantage of a human readable
    markup language.


    If you have explored resources using the Resources window which appears when you
    select the three dots option in the Attributes you might worry that this new resource,
    i.e. SpinnerList, doesn''t appear. It also doesn''t appear in the Resource editor
    that you can select while editing the XML file.'
  merge: -1
  pgno: 257
- img_proc: false
  md: 'The reason is that, currently, Android Studio doesn''t support the assignment,
    editing or creation of String arrays other than manually. However, making of the
    new resource is fairly easy. The id of the resource is @array/country and this
    has to be typed into the entries property in the Attributes window as the Resource
    picker doesn''t support arrays at the moment:


    | Spinner | |

    |---|---|

    | spinnerMode | dropdown |

    | entries | @array/country |

    | background | ackground_material |

    | popupBackground | ackground_material |


    When you enter the id correctly you will see the first item appear in the Spinner
    within the editor. When you run the app you will see all of the entries when you
    drop down the list:


    ![](bbox=[0.373, 0.396, 0.676, 0.545])


    For simple lists of options that can be specified at design time this is all you
    need to know how to load a list of items into a Spinner. In practice, a Spinner
    usually has to be loaded with a list at runtime and then you need to know about
    the ArrayAdapter.


    # Introducing the ArrayAdapter


    In the case of UI widgets that display lists of things, Android has a much more
    general mechanism to cope with the different type of things you could display.
    Widgets that show lists of things generally work with an example of an "adapter".
    For more on adapters in general see Chapter 15.


    An adapter basically takes a list of objects and converts them into something
    that can be displayed in the widget. In general, you can create custom Adapters
    to do clever things with lists of objects of your own so that they display appropriately.
    In most cases, however, you can get by just using the provided built-in adapters.'
  merge: -1
  pgno: 258
