  md: 'As long as you are using an ArrayList you are safe to use all all of the adapter
    data modifying methods:


    ```

    add(item)

    addAll(item1,item2,item3...)

    clear() //remove all data

    insert(item,position)

    remove(item)

    ```


    You can also make use of:\getCount() // get number of elements

    getItem(position) // get item

    getItemId(position) // get item id

    getPosition(item)


    # A Custom Layout


    So far we have just made use of the system provided layout for the row. It is
    very easy to create your layout file and set it so that it is used to render each
    row, but you need to keep in mind that the only data that will be displayed that
    is different on each row is derived from the item''s toString method.


    The simplest custom layout is to have a single TextView widget which is used for
    each line. In fact it is so simple it has no advantage over the system supplied
    layout so this is really just to show how things work.


    Use Android Studio to create a new layout in the standard layout directory and
    call it mylayout.xml. Use the Designer or text editor to create a layout with
    just a single TextView object. Create a new layout and accept any layout for the
    initial file. You can place a TextView on the design surface. You won''t be able
    to delete the layout, however, the editor will not allow you to do it. You need
    to switch to TextView and edit the file to remove the layout:


    ```

    <<?xml version="1.0" encoding="utf-8?>

    <TextView

    xmlns:android="http://schemas.android.com/apk/res/android"

    android:text="TextView"

    android:layout_width="match_parent"

    android:layout_height="wrap_content"

    android:id="@id/TextView" />

    ```


    Notice that you need the xmlns attribute to make sure that the android namespace
    is defined.'
