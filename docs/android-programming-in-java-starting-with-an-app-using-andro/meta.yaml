- img_proc: false
  md: "What follows is what you get if you simply accept the defaults. However, it\
    \ is important to realize exactly what the sees depends on the version of Android\
    \ they are using. For example your up-to-date app running on the latest Android\
    \ might look like the clock TimePicker but you run it on a pre-Lollipop API like\
    \ Jelly Bean (API 18) then you will see the Holo-themed version as above. If you\
    \ want to support older versions then it is important to remember to use them.\
    \ If you want to use something that looks like the Holo-themed version on all\
    \ versions then you will have to find timePickerMode in the Attributes window\
    \ and use the drop-down list to select picker or depending on the type you need.\n\
    \nFor easy backward compatibility use compatibility library v7 appcompat, which\
    \ is included in your projects automatically by Android Studio, and stick with\
    \ the AppCompat themes.\n\n# TimePicker in Code\n\nTo interact with the TimePicker\
    \ all you have to use get/set methods for Hour and Minute. You can also programmatically\
    \ change the 12/24 hour mode. Notice that the time is always returned in 24-hour\
    \ form no matter what the widget's mode is.\n\nAlthough the get/getCurrentMinute\
    \ and set/setCurrentHour methods are deprecated, the alternatives which exactly\
    \ doing the same thing, set/getMinute and set/getHour,don't work on earlier versions\
    \ of Android. For the moment it seems preferable to use the deprecated methods\
    \ and ignore the warnings. For example to set the TimePicker you would use:\n\n\
    ```\nTimePicker tp= (TimePicker) findViewById(R.id.timePicker);\ntp.setIs24Hour(true);\n\
    tp.setCurrentMinute(10);\ntp.setCurrentHour(13);\n```\n\nThe only task remaining\
    \ is figuring out to discover when the user has selected a time.\n\nYou could\
    \ provide a button which the user has to click to confirm the new time. For example,\
    \ place a Button and a TextView on the design surface and adding the following\
    \ Button click handler:\n\n```\npublic void doButtonClick(View e) {\nTextView\
    \ tv= (TextView) findViewById(R.id.textView);\nTimePicker tp= (TimePicker) findViewById(R.id.timePicker);\n\
    tv.setText(tp.getCurrentHour().toString() + \":\" + \ntp.getCurrentMinute().toString());\n\
    }\n```\n\nAlso remember to set the Button's Click property to doButtonClick. You\
    \ can use a lambda or an anonymous class if you want to."
