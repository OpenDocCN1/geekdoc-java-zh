  md: '# Layout_weight


    There''s one last mystery of the LinearLayout to discuss, layout_weight, a layout
    property that only the LinearLayout supports. If you assign a layout_weight to
    any of the controls in a LinearLayout then the controls are adjusted in size to
    fill any unused space in proportion to their weights.


    The really important part of this description is "unused space". What happens
    is that Android first computes the layout ignoring any weight assignments. This
    means that the controls are set to the sizes you specified. Next the system determines
    what space remains unused in the containing LinearLayout. This is then distributed
    between the controls that have non-zero values of layout_weight in proportion
    to their weights. For example, suppose we have a horizontal LinearLayout with
    three Buttons all set to wrap_content. The screen has been roated to provide a
    lot of unused space for the example:


    ![](bbox=[0.131, 0.365, 0.636, 0.513])


    You can see that there is a lot of unused space over the right. If we now set
    the first Button''s layout_weight to 1 it will be allocated all of that unused
    space:


    ![](bbox=[0.131, 0.619, 0.636, 0.767])'
  merge: -1
  pgno: 127
