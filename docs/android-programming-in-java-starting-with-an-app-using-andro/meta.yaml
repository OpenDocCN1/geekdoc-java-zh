  md: '# Summary


    +   - Android Studio makes creating Android apps a lot easier than other approaches
    and it is currently the only official way to do the job.

    - An app has at least one Activity and this defines a screen layout, the View,
    and a behavior. An Activity doesn''t have to have a UI, but in most cases it does
    have one.

    - To create a simple application use the Basic Activity template with no extras
    selected.

    - The screen layout is controlled by an XML markup file, Main_Activity.xml, which
    is stored in the res directory. There is also content_main.xml, which is where
    we place our custom UI controls.

    - Android Studio provides a drag-and-drop designer that allows you to create a
    UI without having to work directly with the XML.

    - The behavior of the app is controlled by a Java file, MainActivity.java in our
    case, stored in the java file. You can edit the code in the Java file directly
    in Android Studio. The Java code has to load and display the layout defined in
    the XML file.

    - To run an app you need an emulator based AVD or a real Android device connected
    to the machine.

    - When you run the app you can select which AVD or which hardware device is used
    to test it. When you first start simply use the default AVD, a Nexus 5.

    - You can modify and re-run your app without having to restart the AVD or any
    real hardware connected to the machine.'
