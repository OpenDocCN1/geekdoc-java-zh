  md: "# Transformations\n\nNow we come to one of the more sophisticated options that\
    \ Canvas offers. Before anything is drawn, the coordinates you supply are acted\
    \ on by a transformation matrix. By default this is set to the identity matrix\
    \ which leaves the coordinates as they were. However, the following methods modify\
    \ the transformation matrix:\n\n+   - rotate(float degrees)\n  rotate about the\
    \ origin through degrees\n- rotate(float degrees, float px, float py)\n  rotate\
    \ about the point px,py through degrees\n- scale(float sx, float sy)\n  scale\
    \ about the origin by sx and sy\n- scale(float sx, float sy, float px, float py)\n\
    \  scale about the point px,py by sx and sy\n- skew(float sx, float sy)\n  skew\
    \ by sx and sy\n- translate(float dx, float dy)\n  translate by dx and dy\n\n\
    There are also some methods that let you work directly with the transformation\
    \ matrix:\n\n+   - setMatrix(Matrix matrix)\n  set the transform to the matrix\
    \ provided\n- concat(Matrix matrix)\n  multiply the transform matrix by the matrix\
    \ provided\n- getMatrix(Matrix m)\n  get the transformation matrix in m\n- getMatrix()\n\
    \nreturn a copy of the transformation matrix\nIf you already know how matrices\
    \ and transformation matrices work then this will be quite straightforward. If\
    \ not, there are a lot of traps to trip you up. The main one, that troubles about\
    \ everyone at first, is the order in which you do things. A transformation followed\
    \ by a rotation isn't the same as a rotation followed by a translation. Try it\
    \ if you don't believe me. Another is that these transformations change the coordinate\
    \ system and don't affect anything you have already drawn. They only what happens\
    \ when you draw something after the transformation has been applied."
  merge: -1
  pgno: 228
