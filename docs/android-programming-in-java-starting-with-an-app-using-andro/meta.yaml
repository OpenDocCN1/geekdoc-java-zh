  md: 'That is, you can drag-and-drop a button onto the Designer and it will automatically
    generate the XML needed to create it and specify where it is and all of the details
    you set.

    That is, at the surface level there are three ways to create the UI:


    +   1. You can write Java code to generate the necessary Java objects

    2. You can write XML tags and use the system to convert the XML to the same Java
    objects.

    3. You can use the Designer to interactively create the UI and generate the XML
    file which is then converted into the Java objects.

    You can think of this as:


    drag-and-drop layout -> XML -> Java View objects


    Being able to work with the UI in an interactive editor is one of the great advantages
    of using Android Studio, and even if you know how to edit the XML layout file
    directly, it isn''t a feature you should ignore. It is nearly always a good idea
    to use the layout editor as the first step and apply any tweaks, if necessary,
    to the XML file.


