  md: '# Preface


    Android™ programming is an attractive proposition. There are more Android users
    than any other smartphone or tablet and this makes it a potentially huge market.
    Android devices are relatively cheap and this makes it suitable for implementing
    smaller scale projects. Finally the tools that you need are free to download and
    use you don''t need anyone''s permission to get started.


    The only difficulty is that Android is a tough system to master. It is easy enough
    to get started as Android Studio will build you a Hello World app in a few minutes,
    but what you do next is more difficult. You can get a surprisingly long way in
    Android programming by simply copying and pasting code from other programs roughly
    do what you want, but the results are usually unreliable and disappointing. To
    create a good app there is no substitute for understanding how the system works
    and appreciating its strong points and its limitations.


    This book aims not only to show you how common tasks are done in Android, but
    to make sure that you understand why they are done in a particular way. This means
    covering not just the "what" but also the "why". The good news is that this isn''t
    as difficult as you might expect because Android has repeating patterns and ways
    of doing things and once you have seen something in action it generalizes to components
    you''ve encountered.


    This isn''t a book full of complete examples and case studies. In fact the examples
    are stripped down to their bare minimum to avoid having present of irrelevant
    and repetitive code and let you see what is essential. It isn''t a single book
    that covered every aspect of the Android system would be too large to pick up
    and carry. Instead it tackles the things you need to know to write a simple app.
    It focuses on creating the user interface (UI) because this is what you spend
    most of your time working on even if the app in question is sophisticated. least
    90% of the effort in creating any app goes into building and perfecting the UI
    and this makes it the place to start. In this book you will find out how to build
    an app with a single Activity and a UI. If you master this level of the art then
    you will find it much easier to push on into unknown territory. I can''t promise
    to cover every aspect of the UI but I have tried to include examples of all the
    sorts of techniques you will encounter that are familiar with the ways you work
    in general.'
  merge: -1
  pgno: 2
- img_proc: false
  md: 'This book is at an introductory level as far as Android development goes, however
    it isn''t for the complete beginner. It is assumed that you can program, but not
    necessarily in Java, which is arguably the most important of all today''s programming
    languages and Java is a very standard object-oriented language and with the help
    of comments point out where it is significantly different you should find it easy
    to pick up as you go along. Finally the development tool used is the latest version
    of Android Studio because it doesn''t make sense not to use it or to use anything
    else.


    This edition has been updated for features introduced in Android Studio 3. In
    particular, it includes the use of Java 8 and the lambda expression which greatly
    simplifies event handling. As well as the latest Android Studio also covers ConstraintLayout
    1.0.2 which includes Groups and Barriers as well as a much improved editor.


    Mike James

    November 2017


    This book is a revised and updated version of the series of Android Adventures
    With Android Studio on the I Programmer website:

    www.i-programmer.info.


    There are additional articles on I Programmer that form the basis of the more
    advanced books that are still in preparation. After updating and revision, Android
    Adventures – Mastering Fragments will be published in print as Android Programming:
    Mastering Fragments & Dialogs.


    The first draft of Android Programming: Structuring a Complex App, which goes
    further into threading, concurrency, life cycle and other topics crucial to a
    real world app, is currently work in progress on the website.


    To keep informed about forthcoming titles in the Android Programming series visit
    the I/O Press website:

    www.iopress.info


    This is also where you will also find errata, update information to keep up with
    changes in Android Studio and Android itself and, most importantly, the code from
    the books. You can also provide feedback to help improve future editions of Android
    Programming.'
