  md: 'In the case of the View object that caused the event is very easy as it is
    passed to the event handler as the only argument of the call. So if the event
    handler is:


    ```

    public void onClick(View v) {

    ```


    and the event handler is only hooked up to the button, then you can be 100% that
    v is the button object when the event occurs. If you want to change the button''s
    caption you could just use its setText to change its value.


    Note: if you''re not used to Java then it is worth pointing out that all Java
    frameworks follow the rule that if an object has a property called myProperty,
    visible as such in the Attributes window, then in code you set it setMyProperty
    and retrieve it using getProperty.


    So, in principle all you have to write:


    ```

    v.setText("I''ve Been Clicked!");

    ```


    However, this doesn''t work because v is declared as a general View object which
    doesn''t have a setText method - all View objects have text to. To call the Button''s
    setText method you must cast v to its correct type, namely a Button.


    Note: Casting is where you tell the system the type of the object you are working
    with. If classB is a subclass of classA then you can treat classB as classA -
    after all of the methods and properties classA does by inheritance. However, if
    you want to make use of a property or method that only classB has then you need
    to cast the reference to the classB object to make its type clear.


    For example, assuming classB inherits from classA:


    ```

    classA myObject = new classB();

    ```


    creates an instance of classB my setObject is declared to be of type classA. This
    is fine but you can only access the methods and properties of the classA object.


    However, if you try:


    ```

    myObject.classMethod();

    ```


    then it will fail if classMethod only exists in classB. To use the classB method
    you have to cast myObject to its real type:


    ```

    (classB) myObject

    ```


    You can store a reference to the cast in a new variable:


    ```

    classB myClassBObject = (classB) myObject;

    ```


    and then call the method:


    ```

    myClassBObject.classMethod();

    ```


    or you can just do the cast on the fly at the cost of an extra pair of parentheses:


    ```

    ((classB) myObject).classMethod();

    ```'
  merge: -1
