  md: '# Chapter 13


    # Life Cycle Of An Activity


    One of the things that you have to get used to when programming for a mobile platform
    is that your app can be shut down and restarted without much warning. This is
    something that often causes beginners programmers from other platforms to make
    mistakes. You have to learn how to cope with this start-stop existence and, for
    an Android app, it is a tough life just trying to stay alive.


    I recently encountered an Android app, created by a large well known company,
    that asked me to fill in a form. I was just about to press the Submit button when
    I accidentally tilled the phone and the screen auto-rotated. When I rotated again
    there was a blank form! I had to start over, and a programmer, I couldn''t resist
    testing to see if the data vanished from the form when I rotated the phone a second
    time – it did! The programmers from high-profile company had no idea about creating
    an Android app beyond the basics.


    Don''t fall into the same trap. Find out about app lifetime, state and persisting
    data. It might sound like a boring topic but it is vital to the working of a UI.


    # Lifetime and State


    Most programmers are used to the idea that their application will be started by
    the user, used and then terminated by the user. If the application is restarted
    then it is usually up to the user to load whatever context they need by way of
    documents, etc. Sometimes an application has to automatically retain state from
    run to run. For example, a game might keep track of which level a player had reached
    and the cumulative score, but this is as complicated as things get.


    For an application running on a mobile device things are very different. The very
    nature of the device means that any application could be interrupted at any moment
    by an incoming phone call or the user making a phone call. To a extent this mean
    "interruptible" has been taken up by mobile phone operating systems as a more
    general principle. Android, for example, will stop your application running just
    because it needs the memory or wants to save battery life. It even terminates
    and restarts your application if a media reconfiguration is required.'
  merge: -1
  pgno: 244
- img_proc: false
  md: 'For example, as we discovered in a previous chapter, if the user changes the
    orientation of the device then your app is terminated and restarted. This is not
    quite a restart from scratch because the system saves and restores some state
    information automatically, but exactly how this works is something we have to
    find out.


    The bottom line is that when you program under Android – and most other mobile
    operating systems – you have to care about the life cycle of your app and you
    have to take steps to ensure that its state is preserved so it can seem to the
    user that nothing at all has happened – though your app has effectively been hit
    on the head and disposed of before being dragged back to continue from where it
    was.


    Being an Android app is a dangerous existence and not at all like a Windows or
    a Linux app which can behave as if they have the machine all to themselves.


    # The Life Cycle of an App


    The different states that an Android app can be in in the transitions between
    them can seem complicated – that’s because they are. If you are still thinking
    in terms of a desktop app, the user, this level of complexity can seem unnecessary
    – and perhaps it is. However, these are the rules that we have to play.


    The Activity class has a set of overrideable handlers for each of six states an
    Activity can be in. Work these pairs, bracketing the phases of the Activity:


    +   - **OnCreate and onDestroy** bracket the entire life of the Activity in memory
    and can be considered to be at the outermost level. This pair is called when the
    app is loaded into memory or unloaded from memory and bracket the entire lifetime
    of an Activity. When it is first loaded the onCreate is triggered and when the
    app is disposed of onDestroy is triggered. You clearly have to use these two to
    set up and destroy any resources which are needed for the entire lifetime of the
    app. if your app is removed by the system it will call onDestroy just before unloading
    the Activity and onCreate when it reloads it. This means that onCreate may be
    called when you need to restore the state of the Activity so that the user doesn''t
    notice any interruption.

    - **onStart and onStop** bracket any period that the app is visible. It could
    be that the Activity is hidden, say, a modal dialog box. The Activity is visible
    but not interacting with the user. This pair of events can be triggered multiple
    times during the lifetime of the app. Simple apps can mostly ignore the onStart
    and onStop events because the Activity is still in memory and doesn''t lose any
    resources or state.'
  merge: -1
  pgno: 245
- img_proc: false
  md: 'The main use of onStart and onStop is to give the app opportunity to monitor
    any changes that might affect it while not interacting with the user. To confuse
    the issue even more there is also an onRestart event that occurs before the onStart
    event but only if this isn''t the first time the Activity has fired the onStart
    - that is this a true restart.


    +   - **onResume and onPause** bracket the period that the Activity is in the
    foreground and interacting with the user.

    Again this pair of events can happen multiple times during the entire lifetime.
    The onResume event occurs when the Activity returns to the foreground and doing
    its usual job. The onPause event occurs when the user switches away to another
    app for example.


    # The Simple Approach


    At this point you have every right to be confused with so many changes of status
    and having to respond to one. The main thing to worry about is the complete restart
    of your app which triggers an onDestroy and onCreate. This is the only one that
    destroys the current state of the app, the others are opportunities for your app
    to reduce the load on the system, As the onDestroy is usually an opportunity to
    clean up resources to avoid leaks, most simple apps really only have to handle
    the onCreate event.


    It is tempting to think that starting and stopping is just like a desktop app
    being terminated and then the user deciding to use it again, so that it''s fine
    for the app to start off as if it was running for the first time. In the case
    of Android app this isn''t what the user expects at all. Your app can be terminated
    by the system without the user knowing anything about it. When the user tries
    to regain access to an app will generally expect it to carry on from where they
    left it. It may be a complete restart as far as you are concerned, but the user
    just switched to another app for a few minutes and back.


    What means is that you cannot think about onCreate as if it was the constructor
    for your app. When onCreate is fired it might be the first time your program has
    ever run or it might be a restart with some things that you created on a previous
    still in existence. For simple applications you can simply create everything again
    as if it was the first time your app had run, and in some cases you need to test
    the savedInstanceStateState to see if you are actually restarting.


    Notice that these events also tend to occur in sequences. For example, an app
    that has just received the onPause event is likely to go on to receive the onDestroy
    event because the system will remove it to free up memory. It is a mistake to
    try to think too much about sequences of events'
