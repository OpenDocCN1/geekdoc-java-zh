  md: '# # Chapter 11


    # # Resources


    So far we have overlooked resources, but the subject can be ignored no longer.
    Resources serve too important a purpose in Android. They not only make localization
    easier, they are key to creating apps that adapt to the device they are being
    run on.


    # ## Use Resources?


    Any small scale data that your app uses – strings, constants, graphics, layout
    files – should all be included as resources rather than hard coded into your app.
    For example, until now we have entered any text that the UI needed directly as
    a string property value. For a button this approach means setting the Text property
    by typing in a string such as "Hello World".


    Android Studio does best to save you this effort. If you run the Warnings and
    Errors "linter" by clicking on the red icon in the Designer, then for any string
    you have entered as a literal into the Attributes window you will see a warning:


    ![](bbox=[0.181, 0.606, 0.868, 0.78])


    While you shouldn''t panic about every warning that the linter throws, this one
    is a good idea because a resource can be reused in other parts of the program
    and it is easy to change without having to dive into the code. A much bigger advantage
    is that you can provide alternative resources, which'
  merge: -1
  pgno: 204
- img_proc: false
  md: 'are automatically selected by your app to the conditions. For example, in this
    case you can provide strings in another language and they will be used automatically
    according to the locale in which the app runs. This is a very powerful way to
    create custom apps that work anywhere in the world and on any device.


    So how do we create a resource?


    It does depend on the type of the resource but in Android Studio there are two
    ways of creating a string resource.

    The first is to click the "..." at the right of the property entry box which makes
    the Resources dialog pop up:


    ![](bbox=[0.196, 0.293, 0.762, 0.558])


    This lists existing resources defined by the system, the project and the theme
    in use. You can use the Add New Resource dropdown to create additional resources.
    In this case a string resource:


    ![](bbox=[0.335, 0.633, 0.623, 0.883])'
