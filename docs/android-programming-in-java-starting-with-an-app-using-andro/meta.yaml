  md: '# Setting Your Own Coordinates


    When you first attach a Canvas to a Bitmap the coordinate system is in terms of
    the number of pixels in the Bitmap. Often, however, you want to work with a different
    coordinate system. For example, you might want to work with the origin in the
    middle and the x and y coordinate ranging from -1 to +1.


    You can set any coordinate system you can work with using suitable transformations.


    If your coordinate system runs from xmin to xmax and from ymin to ymax you can
    apply it to the canvas using:


    ```

    c.scale(width/(xmax-xmin), height/(ymax-ymin))

    c.translate(-xmin, -ymin)

    ```


    where width and height are the size in pixels of the bitmap.


    Using this formulation the y coordinate increases down the screen, but as did
    the pixel coordinates.


    If you want the y coordinate to increase up the screen then use the transformation:


    ```

    c.scale(width/(xmax-xmin), -height/(ymax-ymin))

    c.translate(-xmin, -ymax)

    ```


    and notice the change to y in the second line.


    So, for example, if you want to draw a graph using coordinates between 0,0 in
    the bottom left corner and 10.10 in the top right, i.e. increasing up the screen,
    you would use:


    ```

    c.save()

    float xmax=10

    float xmin=0

    float ymax=10

    float ymin=0

    float width=500

    float height=500;

    ```


    ```

    c.scale(width / (xmax - xmin), -height / (ymax - ymin))

    nc.translate(-xmin, -ymax)

    ```


    ```

    paint.setStrokeWidth(.4f)

    c.drawLine(0F, 0F, 10F, 0F, paint)

    c.drawLine(0F, 0F, 0F, 10F, paint)

    c.drawLine(0F, 0F, 10F, 10F, paint)

    c.restore();

    ```'
