  md: 'auto-create. Note that sometimes there are problems if you delete an id using
    Android Studio because it leaves +@id, which isn''t a valid id, in the XML. If
    this happens you have no choice but to directly edit the .xml file – which of
    course you now know how to do.


    # Accessing Resources in Code – The R Object


    For much of the time you really don''t need to bother with accessing resources
    in code the job is done for you automatically. For example, if you assign a string
    resource to a button''s text:


    ```

    <Button

    android:text="@string/Greeting">

    ```


    then the system retrieves the string resource and sets the button''s text property
    to it when the layout is inflated. You don''t have to do anything to make it work.
    However, sometimes resources are needed within the code of an app and you have
    to explicitly retrieve them. You already have some experience of retrieving resources
    because you have used R.id to retrieve values, but it is now time to find exactly
    how this works.


    When your app is compiled by Android Studio it creates a resource, a unique integer,
    for every resource in your res/ directory. The directory structure with res/ is
    used to generate properties for the R object that allows you to find the id that
    corresponds to any resource. This means that a resource id is always something
    like R.type.name. For example:


    R.string.Greeting retrieves the id for the string resource with resource name
    "Greeting" that is:


    ```

    <string name="Greeting">Hello World</string>

    ```


    Notice that the resource is an integer and not the string it identifies. So do
    you convert a resource id to the resource?


    The first thing to say is that you don''t always have to. There are many methods
    that accept a resource id as a parameter and will access the resource on your
    behalf. It is usually important to distinguish when a method is happy with a resource
    id and when you have to pass it the actual value.


    If you have to pass the resource, or you want to work with the resource, then
    you have to make use of the Resources object. This has a range of gettype(resource_id)
    methods that you can use to access any resource. For example, to get the string
    with the resource name "Greeting" you would write:


    ```

    Resources res= getResources();

    String myString=res.getString(R.string.Greeting);

    ```'
