  md: 'If you think about it for a moment, this isn''t unreasonable as the app is
    being loaded, becoming visible and in the foreground, and hence the appropriate
    events are fired in turn.


    Beginners often assume that the life cycle events somehow override each other.
    That is, if an onCreate has been fired then this is the big event in the Activity''s
    life and the others won''t happen. This isn''t the case and you need to make sure
    you put actions into the event handlers that really are appropriate to the life
    cycle state. For example, if you put something in the onResume event handler make
    sure realizing that it is going to be fired when the app starts up as well as
    when it just being resumed.


    If you try other things, like pressing the Home key and selecting another app,
    then you will see other event sequences, but of course when you resume the Lifecycle
    app.


    For example, pressing the Home key, then showing the task manager by long pressing
    the Home key and reselecting your app results in: Pause, Stop as the app is removed
    from the foreground and Restart, Start, Resume as the app is loaded, becomes visible
    and resumes the foreground and interacts with the user.


    You can try other actions but there is one thing you must try – changing the orientation.
    If you are using the emulator then press Ctrl-F11. When the screen orientation
    changes you will see that the TextView has been cleared and Create, Start, Resume
    have been added.


    This is because when you change the orientation is completely stopped and then
    completely restarted, i.e. it is if the app was being run from scratch for the
    first time.


    This statement is almost true – not quite.


    # Retaining State – the Bundle


    When you change orientation app is stopped and restarted. When this happens the
    TextView is reset to its default state when the app loads. This description of
    what is happening is what ever you might expect. However, this isn''t the complete
    story.


    The system does to help you with the problem of having your app stopped in its
    tracks and restarted. It will automatically retain and it automatically restores
    the UI elements that can be modified by the user, and when the app starts. So
    in principle you can initially ignore the problem of an app restart because the
    system restores UI. This is the reason that some Android programmers assume that
    everything is "normal" and there is no need to study the life cycle of an app.
    This is true at first, but later your app will evolve beyond what the system provides
    by default.'
