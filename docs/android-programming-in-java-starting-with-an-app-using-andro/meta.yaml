  md: '# Chapter 12


    # # Bitmap Graphics


    Android graphics is a huge subject, but you have to start somewhere. In this chapter
    we look at a simple 2D bitmap graphics, which is often all you need, and discover
    the basic principles of Android graphics.


    # # Android Graphics


    Graphics support in Android is extensive – from the simple display of images and
    2D graphics through animation and on to full 3D rendering. To cover it all needs
    a separate book, and even then there would be left untouched. This chapter is
    an introduction to the minimum you need to know about 2D bitmap graphics in Android.
    It''s not all you need to know to get the job done, but it is enough to get started
    on many simple graphics tasks. With this grounding you''ll also be in a position
    to seek some of the additional information you need to do the less common things.


    The key difference between this account of Android graphics and the typical approach
    you find in other documents is that it concentrates on the principles as well
    as the how-to. By the end of this chapter you should have a clear idea of what
    the different Android graphics classes are all about.


    # # The Bitmap


    You could say that the bitmap is the foundation of any use of Android graphics.
    The reason is that no matter how graph is specified or created, it is a bitmap
    that is eventually created and displayed on the screen.


    There are many ways of creating or obtaining a bitmap. .jpg, .gif or .png can
    be included in the drawable/ resource directory and displayed in an ImageView
    control. In many cases a bitmap can be acquired by loading a file, reading in
    a collection of bytes, or even taking a photo with the Android camera.


    In this instance we will simply create a Bitmap directly:


    ```

    Bitmap b = Bitmap.createBitmap(100, 100, Bitmap.Config.ARGB.8888);

    ```


    A bitmap is simply a rectangle of pixels. Each pixel can be set to a given color
    but exactly what color depends on the type of the pixel. The first two'
  merge: -1
  pgno: 222
- img_proc: false
  md: "parameters give the width and the height in pixels. The third parameter specifies\
    \ the type of pixel you want to use. This is where things can get complicated.\
    \ ARGB_8888 create a pixel with four channels ARGB - Alpha, Red, Green, Blue,\
    \ and allocate eight bits of storage to each channel. As four eight are 32 this\
    \ are 32-bit graphics. The alpha channel lets you set an option.\n\nThere are\
    \ many different pixel formats you can select, and there is always a trade off\
    \ between the resolution and the amount of space a bitmap occupies. However, ARGB_8888\
    \ is a very common choice.\n\nNow you have a bitmap what you can do with?\n\n\
    The answer is quite a lot!\n\nMost of the methods of the Bitmap object are concerned\
    \ with things that change the entire image. For example:\nb.eraseColor(Color.RED);\n\
    \nsets all the pixels to the specified color, red in this case. Using the setPixel\
    \ and getPixel methods you can access any pixel you want to and perform almost\
    \ any graphics operation you care to. You can also work with the pixel data at\
    \ bit level.\n\n# The ImageView Control\n\nHow can you see a Bitmap that you have\
    \ just created? The simple answer is to use an ImageView controls. This isn't\
    \ a popular approach, however, because it isn't as flexible as alternatives such\
    \ as overriding the onDraw event handler. This said, the ImageView control is\
    \ very easy to use and sufficient for many tasks.\n\nStart a new project and place\
    \ an ImageView into the UI, accepting the defaults. The Designer won't let place\
    \ an empty ImageView on the design surface so select any drawable as a temporary\
    \ filler.\n\nAs a demonstration of how you can use the ImageView to display a\
    \ Bitmap, change the onCreate event handler to read:\n\n```\n@Override\nprotected\
    \ void onCreate(Bundle savedInstanceState) {\n  super.onCreate(savedInstanceState);\n\
    \  setContentView(R.layout.main);\n\nBitmap b = Bitmap.createBitmap(500, 500,\
    \ Bitmap.Config.ARGB_8888);\n  b.eraseColor(Color.RED);\n  ImageView imageview=(ImageView)\
    \ findViewById(R.id.imageView);\nn  imageview.setImageBitmap(b);\n}\n```"
