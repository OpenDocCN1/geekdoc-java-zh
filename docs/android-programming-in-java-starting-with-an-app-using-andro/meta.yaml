  md: '# Chapter 6


    # Working With Layouts


    The choice of Layout is vital to an Android UI. The Layout is what allows you
    to position and generally arrange other components. A good understanding of what
    is on in each of the available Layouts can make the difference between an easy
    and a difficult UI, from both the point of view of the programmer and the user.
    This is especially the case if you want to support a range of devices.


    All of the classes and objects that make up the Android UI are derived from the
    same base class, the View. That is, a Button is a View and so are the Layout classes.
    However, Layouts seem to behave in different ways to the simple Button and this
    raises the question exactly is a Layout?


    # Understanding Layouts


    A Layout is a container for other View-derived objects. When the Layout is asked
    to render itself, it renders all of the View objects it contains and arranges
    them inside the area of the display it occupies.


    The default Layout used by Android Studio is the ConstraintLayout and we have
    already looked at using it in earlier chapters, but it is not the only Layout
    you can use with the Designer.


    There are six currently supported Layouts:


    +   * ConstraintLayout

    * GridLayout

    * FrameLayout

    * LinearLayout

    * RelativeLayout

    * TableLayout


    The ConstraintLayout was new in Android Studio 2.2. It is currently the recommended
    layout to use, and it is the default in Android Studio 3.0. It can be thought
    of as a development on the RelativeLayout. In principle, it can be used to create
    any layout that you can implement using a combination of the other layouts. It
    is claimed that ConstraintLayout based UIs are easier to'
  merge: -1
  pgno: 116
- img_proc: false
  md: 'construct and faster because they are "flat" i.e. do not use multiple layouts
    nested inside one another.


    Android really doesn''t want you to use any layout other than ConstraintLayout
    as the initial container and so it doesn''t let you delete the default layout.
    It will replace a RelativeLayout in an existing project with a ConstraintLayout,
    but you cannot delete or replace it by any other layout. The reason is that replacing
    one layout by another is difficult because all of the changes are in the supported
    properties.


    You can edit the XML file directly to replace one layout by another, but you will
    have to re-edit all the layout properties. You can replace an empty layout by
    another by editing the XML file and this is currently the only way to do the job.


    Despite that ConstraintLayout is the recommended layout to use there are still
    many Android projects that use the original layouts and some programmers simply
    don''t like the ConstraintLayout. Hence it is worth knowing how the simpler layouts
    work.


    Among the original layouts, Relative and LinearLayout are the most used, with
    FrameLayout coming a distant third. The final two, TableLayout and GridLayout,
    are suitable for specialized types of UI and in Android Studio 3 are more or less
    unsupported in the Designer you have to work directly with their properties. For
    this reason they are best avoided.


    Before looking at these alternatives and how to work with them, it is worth getting
    to grips with the basic ideas of layouts and the principles they share in common.
    Then we will look at the Frame, Linear and Relative layouts because they are still
    important. ConstraintLayout, however, is so important because it is the preferred
    layout type for the future that it gets a chapter to itself.


    # Layout Properties


    Most you will tend to think of the properties that are relevant to a control as
    belonging to the control, but a layout can do its job in many ways and requires
    the control to have lots of very specific properties to determine how it is positioned.
    In other words, the properties that a control needs to work with a layout depend
    on the layout chosen and makes things difficult to organize.


    The simplest but unfavorable way of implementing this would be to insist that
    every control implemented every property used by every layout, even the ones not
    currently being used. This is clearly inefficient.


    The solution to the problem actually is used that each layout defines a nested
