    R.id.title,

    R.id.number,\myDataArray);


    and the user is free to use any ids for the layout as there are the two TextViews.


    There are aspects of the ListView that haven''t been covered. In particular, what
    do you do if your data structure isn''t an array? The ArrayAdapter handles lists
    by simply overriding the appropriate constructor. Anything complex and you will
    have to create a custom adapter. In most cases, however, this isn''t necessary
    because most data structures can be mapped onto an array.


    There are a range of formatting topics not covered, the header and separator for
    example, but these are relatively easy. More complicated are the multiselection
    options and any custom list displays such as a list with multiple columns or pop-out
    detail windows.


    # Custom Adapter


    Putting together all the code introduced so far gives:

    public class MyAdapter extends ArrayAdapter<MyData> {

    private Context context;

