  md: 'Finally, how do you set other properties of the MenuItem you have added?

    The answer is that add returns the MenuItem created. So to set the new item

    to show in the action bar you would use something like:

    MenuItem item=menu.add(Menu.NONE, 10, Menu.NONE, "New Item");

    item.setShowAsAction(item.SHOW_AS_ACTION, ALWAYS);

    Dynamically modifying the menu is a matter of keeping track of the current

    state and not modifying it.


    # Controlling the Toolbar


    There are a couple of questions that still remain. You can see how to add

    items, submenus and generally control what the Toolbar displays, but what

    controlling when it is displayed or how it looks? The answer to these

    question is based on working with the ActionBar object and as you might

    expect this is not something generic to all menus. ActionBar has lots of

    features for showing menus in different ways and to cover it completely

    would too much space. However, it is worth knowing some of the basic

    customizations that you can apply.


    You can get the ActionBar object in an Activity using getSupportActionBar or

    ActionBar. Once you have the ActionBar object you can use its show() and

    hide() methods to show/hide as it is required:


    ```

    ActionBar actionBar=getSupportActionBar();

    actionBar.hide();

    ```


    Similarly you can change the title and subtitle displayed in the action bar:

    ActionBar actionBar=getSupportActionBar();

    abar.setTitle("My Action Bar");

    abar.setSubtitle("My Subtitle");


    ![](bbox=[0.315, 0.646, 0.643, 0.753])


    There are many other properties and methods that you can use to modify the

    way the action bar looks and behaves.


    Things that are worth looking up are: using a split Toolbar; Up Navigation;

    Action Views; Collapsible Action Views; Action providers; and Navigation

    tabs.'
