    ![](bbox=[0.373, 0.307, 0.68, 0.549])


    Initially the portrait layout is used as the template for the landscape layout.

    Make sure you are editing the content_main.xml file before you create the landscape
    layout based on it. This ensures that this is the file that is used as the template
    for the landscape version of the file.

    The landscape version of the file will contain all of the UI components that the
    template file does. This means that your code can interact with it in the usual
    way without knowing that it is working with a different layout. All the code cares
    about is that there is a button or there is a textView – not where they are placed
    or what orientation is is in use.'
