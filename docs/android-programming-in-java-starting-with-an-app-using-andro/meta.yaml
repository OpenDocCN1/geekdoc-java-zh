  md: '# Chapter 16


    # ListView


    ListView is probably the most commonly used UI component in an Android app. It
    isn''t difficult to use, but you need to get to grips with the idea of an "adapter",
    and understanding what is pays dividends.


    For a range of reasons, one of the most common things you need to do in an Android
    UI is to display a list that the user can select from. We have already looked
    at the basic Pickers, but the ListView is a more general category of "picker".


    If you are familiar with desktop development then you probably think that the
    user can select from being similar to a drop-down list. Android and portable devices
    often need something than just a small list. Because of the limited screen size,
    it is often the case that the user can only be shown an overview of quite few
    different items. When the user selects an item they are then presented with more
    details of the item, commonly called details.


    Displaying lists and other collections of data is so common that Android has a
    mechanism that makes it easier once you understand how it works.


    The key idea is to display a collection, each item in the collection has somehow
    to be converted to an appropriate View object. It is the View object that the
    container displays for each item of data in the collection.


    # Understanding the Adapter


    Display a collection of items has a number of similarities no matter what the
    collection of items are, or what container is used. The container has various
    positions that are visible on the screen for displaying items. For example, a
    ListView has horizontal slots, one per item, and a GridView has a 2D grid of slots.
    For example, you could provide the ListView with TextView objects and it would
    simply display text in each of its slots.


    You might be wondering why not just supply a set of Strings to the ListView and
    let it work out how to display the Strings as text? Things could be organized
    in this way and it would be simpler, but only if you wanted to'
  merge: -1
  pgno: 286
- img_proc: false
  md: 'display Strings. If you wanted to display a list of images, say, then you would
    need a ListView that understood images and so on.


    It is much more flexible to provide the container with a set of prepared View
    objects because then the container simply has to display the View object without
    performing any conversions.


    All containers that derive from the Adapter class make use of adapters to supply
    what they display in terms of View objects. As well the ListView and GridView,
    they include the Spinner, Gallery and StackView.


    We have already looked at the View of the Spinner and its associated adapter,
    so this time it is the turn of a more advanced UI element – the ListView and its
    adapter.


    This approach also has the advantage that you can provide the container with a
    View object that is a complete layout, i.e. it itself be a container with lots
    of View objects to display. For example, you could supply a ListView with a View
    object that contains an image, and a TextView to create a multimedia list of pictures
    and text.


    Of course the container isn''t doing the conversion from the data object to the
    View object – you are going have to do it. This is where the adapter comes in.
    The ListView and the GridView containers both make use of the ListAdapter class
    as their basic adapter.


    # Extending the List Class


    In general you have to take the ListAdapter class and extend it to create your
    own custom Adapter which generates a custom View object for the container to use
    in each of its slots. The container asks for the View object to be used to display
    item or using whatever indexing suits the particular container. The Adapter returns
    the View object and the container displays it – without worrying what it is or
    what it corresponds to. This might sound complicated, but it turns out to be very
    simple in practice.


    However, to make things simpler is there an ArrayAdapter which lets display a
    single text item for each element of an array of arbitrary objects. How can this
    possibly work if the object in the array can be anything? The first thing to point
    out is that ArrayAdapter is a generic class and can accept an array of any type
    as long as you specify it when you create the ArrayAdapter instance. The second
    point to note is that Adapter calls each item''s toString method to give some
    text to display in the container, which is very simple but also very restrictive.
    In fact, it is quite easy to modify what the ArrayAdapter displays, and this makes
    it more versatile than you might expect and hence well worth getting to know.'
