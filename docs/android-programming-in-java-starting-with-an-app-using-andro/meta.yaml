  md: '# Saving Additional UI Data


    The system will save and restore the state of the UI elements that the user can
    change, but it will not store any of your code changes. It also doesn''t automatically
    save and restore any other data that the user or your code may have generated
    that isn''t within the UI. In these cases you have to write some code that saves
    the values and restores them.


    There are lots of ways of saving the state of an app as it is started and stopped
    by the system. One of the simplest is to use the Bundle object that the system
    uses.


    The system fires its onSaveState event when it is about to add data to the Bundle
    and save it. If you want to save some additional data all you have to do is override
    the default handler.


    For example, suppose you want to save and restore the data in the TextView First
    you to save the data:


    ```

    protected void onSaveInstanceState(Bundle savedInstanceState) {

    savedInstanceState.putCharSequence("myText", textView.getText());

    super.onSaveInstanceState(savedInstanceState);

    ```


    Notice that we save the content of the TextView object as the value and use the
    key "myText". In cases it would be better to create a string constant for the
    key. The key can be any identifier you care to use, but it has to be unique within
    the Bundle as it is to retrieve the data you have stored in the Bundle.


    To retrieve the data and place it into the TextView we need to change the onCreate
    handler:


    ```

    protected void onCreate(Bundle savedInstanceState) {

    super.onCreate(savedInstanceState);

    setContentView(R.layout.activity_main);

    textView = (TextView) findViewById(R.id.textView);

    if (savedInstanceState != null) {

    textView.setText(savedInstanceState.getCharSequence("myText"));

    }

    textView.append("onCreate");

    }

    ```


    This starts off in our usual way but now to check if savedInstanceState has any
    data. If it we retrieve the stored text using the key "myText".


    There is no reason to use the onCreate event handler in this way, but the system
    also fires an onRestoreInstanceState event when it is about to perform its own
    "automatic" restore of the UI for you. You can override this'
  merge: -1
  pgno: 251
