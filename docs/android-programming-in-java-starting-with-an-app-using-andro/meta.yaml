  md: 'setOnClickListener. This is a simple but tedious process that involves a lot
    of boiler plate code – see later for details of how it can be done.


    The good news is that the OnEventListener is a SAM – a Single Abstract Method
    – we can use a lambda to create an instance and avoid a lot of rounding coding.


    For example to add a click event handler to a button without using the Designer:
    View.OnClickListener eventHandler= (view)->


    ```

    ((Button).setText("I''ve been clicked");

    ;

    ```


    and add it to the button:

    Button b=(Button)findViewById(R.id.button);

    b.setOnClickListener( eventHandler );


    This two stage process makes what is happening and what role the lambda is playing
    but isn''t the way the code would usually be written. In nearly all cases it is
    simpler to write the lambda within the setOnClickListener call:


    ```

    b.setOnClickListener( view->{

    ((Button) view).setText("I''ve been clicked");

    });

    ```


    This makes it as if the lambda is just a function that is called when the click
    event occurs and this isn''t a bad way to think about it when you can forget about
    the SAMs that make actually work.


    Using a lambda we can create event handlers very easily. All we have to do is
    use the setEventListener method and write a lambda as its first and only parameter
    to act as the event handler. The only complication is to make sure we get the
    number of parameters correct in the head of the lambda and treat them correctly
    in the body. For example, while you don''t have to say that view is a View object
    in the head of the lambda you still have to know what type it is in the body of
    the lambda.


    If you compare this to the alternative ways of doing the job you will realize
    how much code it saves.


    You don''t have to know all of the alternative ways of creating an event handler
    but you will need to add the anonymous class to your tools it is sometimes best
    when you cannot use a lambda. There are even handling interfaces that define more
    than one event handling function. These are not SAMs and cannot be implemented
    using a lambda.'
