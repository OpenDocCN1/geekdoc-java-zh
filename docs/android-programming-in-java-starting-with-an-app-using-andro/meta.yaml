  md: '# Chapter 10


    # Menus - Context & Popup


    As well as the all-purpose Toolbar which serves as an app''s main menu, there
    are three other commonly encountered menus – the context menu, the contextual
    action menu, and the popup menu. They share the basic Android approach to menus
    while having some distinct characteristics.


    The context menu is a floating menu that displays commands that take the item
    clicked as their subject. For example, selecting a line in a table might bring
    up a context menu that allows you to delete or move the item. The context menu
    is easy to understand and fairly easy to implement, but there is a slight confusion
    caused by the introduction of the Contextual Action mode, a context menu in the
    form of an action bar which is supported in Android 3 and above. A popup menu
    displays a list of items and is anchored to the View that invoked it. It can be
    used, for example, to provide additional choices to customize your action.


    # The Context Menu


    Now that we have the principles of menu construction well understood it is easy
    to extend what you know about the action bar to other types of menu. To create
    a context menu is very easy once you know the basic mechanism.


    You can register any View object in the UI to respond to a long click. When the
    Activity''s onCreateContextMenu event handler is called. This is where you create
    the menu that will be shown as the context menu.


    Notice that you can register many View objects as you like and each one will respond
    to a long click by onCreateContextMenu being called. This means that if you want
    to show a different menu for each View object you need to test to see which one
    caused the event.


    So the recipe is:


    +   1. Create an XML menu resource

    2. Register all the View objects that you want to trigger the context menu using
    registerForContextMenu

    3. Override the onCreateContextMenu event handler and use a inflater to create
    the menu'
