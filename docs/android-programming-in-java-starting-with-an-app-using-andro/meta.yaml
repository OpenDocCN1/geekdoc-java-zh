  md: '# Summary


    +   - The context menu is invoked for all View objects in the UI that are registered
    using registerForContextMenu(View).

    - When the user long clicks on any registered object the onCreateContextMenuMenu
    is called and you can use this to display the menu. When the user selects any
    of the items in the menu, the system onContextItemSelected event handler is called.

    - The contextual action bar menu is the most complicated to de implement. You
    have to create an ActionMode.Callback object complete with methods to create the
    menu and handle events from its items.

    - To display the menu you call the startSupportActionMode(Callback) specifying
    the Callback object to be used.

    - If you want to use the contextual action mode menu on earlier versions of Android
    you have to use the Support Library classes.

    - The popup menu is the easiest to implement. Simply create a Popup object, inflate
    the menu resource, and use its show method to display the menu.'
