- img_proc: false
  md: '# Layout Relative to Another Component


    The Designer used to map a confusing set of XML properties that positioned a component
    relative to another component. The latest version no longer performs this simplification.
    Instead you can either allow the Designer to work out how to set position relative
    to another component or you can work with the raw properties in the Attributes
    window.


    The basic idea behind all of positioning properties relative to another component
    is that you simply supply the name of the other component to the relevant property:


    +   - layout_alignTop

    - layout_alignLeft

    - layout_alignBottom

    - layout_alignRight


    For example:


    ```

    layout_alignRight= button1

    ```


    sets the right-hand edge of the control to align with the right-hand edge of button1.
    As always, aligning two edges top/bottom and left/right changes the size of the
    control.


    The properties:


    +   - layout_above

    - layout_below


    align the bottom of the control with the top of the referenced control and the
    bottom with the top respectively.


    Similarly the properties:


    +   - layout_toLeftOf

    - layout_toRightOf


    align the left/right of the control with the right/left of the referenced control.


    Finally the property:


    +   - baseline


    aligns the text baseline in the parent and child controls.


    In API 17 a new feature was added to account of the direction that text

    should within a layout, this caters for languages such as Arabic that start

    at the right-hand side and goes towards the left. By default Layout_Direction
    is

    left-to-right and the start edge is the same as the left edge and the end edge
    is

    same as the right edge. If Layout_Direction is set right-to-left then start is
    the same as right and end is the same as left. You can set startpadding to control
    the padding on the left or right depending on the layout direction set. All of
    the left/right properties have a start/end version.'
  merge: -1
  pgno: 131
- img_proc: false
  md: '# Margin Offsets


    So far all we can do is align pairs of edges.

    How do you specify exact positions relative to another control or the parent?

    The answer is to use the common pattern of setting the margins of the control.
    If you align edges but set a top margin of 10dp on the child then the top of the
    child control will be 10dp lower than the parent control:


    ![](bbox=[0.273, 0.218, 0.755, 0.313])


    So the edge alignment is used to specify the relative distance of one control
    to another and the margins give the exact offset.


    # RelativeLayout and the Designer


    With all this you understand now can see how the Designer lets generate a RelativeLayout.
    As you move a control around the designer surface, the nearest control or the
    parent Layout is selected as the parent to use for positioning, the closest edges
    are used for alignment and that margin is the distance between the parent and
    child.


    This works well but it sometimes be difficult to get the Designer to pick the
    control or the Layout as you move a control around. You can always use the Attributes
    window to manually set this if it proves difficult to set interactively.


    Also notice that if you drag an edge of one control close to alignment with the
    edge of another control then this will result in that being aligned and the control
    changes its size. For example, if you drag the right side of a control to the
    right size of the Layout then the width of the control changes. This behavior
    can confuse beginners using the Designer as it appears to be possible to resize
    controls by dragging an edge, but most of the time the control snaps back to its
    original size when released. Of course, it only resizes when the edge you are
    dragging lines with a corresponding edge on another control.


    It has to be said that the Designer is not as easy to use with the RelativeLayout
    as in previous versions of Android Studio. For example, it no longer supplies
    interactive feedback in terms of pixel offsets and it no longer uses a simplified
    system of layout properties which map onto the real XML properties. These things
    might change in future versions, but with the emphasis on ConstraintLayout it
    seems unlikely.'
  merge: -1
