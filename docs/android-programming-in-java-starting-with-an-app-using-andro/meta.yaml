  md: "When you inflate a menu resource in onCreateOptionsMenu what happens is that\
    \ the View hierarchy that is created when you inflate the XML is added to the\
    \ current menu. This is passed into the onCreateOptionsMenu event handler in the\
    \ menu parameter:\n\n```\npublic boolean onCreateOptionsMenu(Menu menu)\n```\n\
    \nNext you get the inflater and inflate the resource:\n\n```\ngetInflater().inflate(R.menu.main,\
    \ menu);\n```\n\nAfter this, menu contains the View hierarchy, that is the entire\
    \ menu as created so far.\n\nIf you want to attach an event handler to one of\
    \ the menu items you might think that the standard way of doing this is to find\
    \ ViewById and use its OnClickListener property to set the event handler, as you\
    \ would with a Set of View objects. You can't do this with menu because it hasn't\
    \ been added to the complete View hierarchy. The menu is only added to the View\
    \ hierarchy after the onCreateOptionsMenu event handler finishes.\n\nThat is,\
    \ the menu's View hierarchy is built up menu and this is added to the app's full\
    \ View hierarchy only when the onCreateOptionsMenu event handler finishes.\n\n\
    To allow you to find the menu item while in onCreateOptionsMenu, the menu object\
    \ has its own findItem method. which corresponds to the item with action_send\
    \ you would use:\n\n```\nMenuItem menuItem=menu.findItem(R.id.action_send);\n\
    ```\n\nNow that you have the MenuItem object corresponding to the Send item you\
    \ can add a click event handler:\n\n```\nmItem.setOnMenuItemClickListener(\n \
    \ (item) -> {\n    ... \n    process event\n    return false;\n  });\n```\n\n\
    or using an anonymous class\n\n```\nmItem.setOnMenuItemClickListener(\n  new MenuItem.OnMenuItemClickListener()\
    \ {\n    @Override\n    public boolean onItemClick(MenuItem item) {\n      ...\
    \ \n      process event\n      return false;\n    }\n  });\n```"
  merge: -1
