  md: '# Width and Height


    The exact set of Layout properties that you see depends on the Layout you use.
    However, there are two that all Layouts support:


    +   - layout_width

    - layout_height


    You might think that the width and height of a control are properties that should
    belong to a control, but here things are more subtle. A control doesn''t necessarily
    have a fixed size. For example, ask the Layout to give to it as much space as
    possible, in which case the Layout sets the size of the control. This is the reason
    why controls have layout_width and layout_height and not just width and height.


    You can set these properties to one of three possible values:


    +   - a fixed size, e.g. 24px

    - wrap_content, which sets the size so that it fits the control''s content without
    clipping

    - match_parent, which lets the control become as big as the parent Layout can
    allow


    If you use the mouse to drag the frame of a control in the Designer then what
    happens on the control and the Layout.


    In most cases the default set by the Designer is wrap_content and it will ignore
    any attempt you make to interactively resize a control. Indeed, in most cases
    trying to interactively resize a control doesn''t change the layout_width or layout_height
    properties. However, depending on the Layout you use might appear to change the
    size of the control due to the setting of other layout properties. More of this
    when we deal with particular Layout types.


    The point is that the layout_width and layout_height are not necessarily the only
    properties that control the final displayed size of a control. One thing is fairly
    certain – if you want to set a fixed size for a control then you need to type
    the values into the Attributes window.


    # Units


    If you are going to enter a fixed size or a location you need to know how to do
    it. Android supports six units but only two, both pixel-based units, are used
    routinely:


    +   - px – pixel

    - dp – density-independent pixel


    The unit that it is most tempting to use when you first start creating an app
    is px, the pixel, because you generally have one testing device in mind with a'
  merge: -1
  pgno: 119
- img_proc: false
  md: 'particular screen size and resolution. This is not a good idea if you want
    your app to look roughly the same as that screen resolution changes. For this
    you need the density-independent unit, dp, because it adjusts for the screen resolution.
    If the device has a screen with 160 pixels per inch 1dp is the same as 1px. If
    the number of pixels per inch changes then dp to px changes in the same ratio.
    For example, at 320 pixels per inch 1dp is the same as 2px.


    +   * By using density-independent units you can control the size as the resolution
    changes.


    Notice that this does not compensate for the screen size. If you keep the number
    of pixels fixed and double the resolution then the screen size halves. A control
    on the screen specified in px would then display at half its original size. A
    control specified in dp would display at its original size but up twice the screen
    real estate.


    +   * Using dp protects you against screens changing their resolution, and physical
    size.


    If you specify in dp then your layout will look the same as a 7-inch tablet, no
    matter what it has.

    Well as pixel-based measures there are also three real world units:


    +   * mm – millimeters

    * in – inches

    * pt – 1/72 of an inch


    All three work in terms of the size of the screen, and the number of pixels a
    control is used to resolve the screen resolution. If the screen has 160 pixels
    per inch then 1/160 in=1px and so on. Notice that once again these units protect
    you against resolution changes, not changes to the actual screen size. Your button
    may be 1 inch across on all devices, but how much of the screen this uses depends
    on the size of the device has. The danger in using real world units is that you
    might specify a fractional number of pixels and end up with an untidy looking
    display.


    The final unit is pixels but tied to the device''s size preference:


    +   * sp – scale-independent pixel


    This works like the dp unit in it is scaled with the device''s resolution but
    it is also scaled by the user''s default font size preference. If the user sets
    a larger font size preference then all sp values are scaled up to match.

    **Which unit should you use?** The simple answer is that you use dp unless you
    have a good reason not to, because this least means that if you have tested your
    UI on a device of size x it should work reasonably on all devices of size x, no
    matter what the resolution.


    Android Studio defaults to working in dp whenever you enter a value without a
    unit or when you interactively size or move a control.'
  merge: -1
  pgno: 120
- img_proc: false
  md: '# A Control is Just a Box


    As far as a Layout is concerned, a control is just a rectangle. Its size is given
    by layout_width and layout_height and these can be set by the control or, more
    often, by the Layout. Once the Layout knows the size of the control it can position
    it according to the rules you have established using the Layout''s properties.


    If you want to know the position a control has been assigned then you can use
    its getTop and getLeft properties. This gives you the position of the top left-hand
    corner of the control''s rectangle. You can work out where the other corners are
    by using getWidth and getHeight, but to make things easier there is also getRight
    and getBottom. Notice that the position of the top left-hand corner of the rectangle
    is always relative to the Layout it in. That is, the position is not an absolute
    screen position.


    It is also worth knowing that controls also support padding, dead-space inside
    the control. This space left between the outside edge and the content. In addition
    some, but not all, layouts support margins, dead-space outside a control that
    can be used to add space between controls:


    ![](bbox=[0.302, 0.467, 0.646, 0.729])


    Notice that padding is a property of the layout property. You can set each margin
    or padding on the left, right, top or bottom individually or specify a single
    value to be used for all of them.'
  merge: -1
  pgno: 121
- img_proc: false
  md: 'In theory, padding is used to put space around the content of a control, but
    it can also be used simply to make the control bigger when its dimensions are
    set to wrap its contents. For example, the Button on the left has zero padding
    and the one on the right has a padding of 30dp all round:


    ![](bbox=[0.323, 0.173, 0.676, 0.293])


    Similarly, margins are used to put space around a control, but they can be used
    to position one control relative to another or to its container. This is how RelativeLayout
    and ConstraintLayout work.


    # Gravity


    Gravity is often regarded as mysterious, partly because of its name and partly
    because there are two gravity properties in play. Basically, gravity just sets
    where in a dynamic layout something is positioned.


    Simple gravity settings:


    +   * top

    * bottom

    * left

    * right

    * center

    * center_vertical

    * center_horizontal


    The meaning of all of these is obvious in that the object just moves to the specified
    position. However, things get a little complicated if you try to set an object
    to display at the left when the size of its container has been adjusted to fit,
    i.e. it is already as far to the left and the right as it can be. You can also
    set multiple gravity options. For example, you can set left and right at the same
    time and this just centers the object horizontally.


    What makes gravity even more complicated is that there are settings that change
    the size of the object affected:


    +   * fill

    * fill_vertical

    * fill_horizontal'
  merge: -1
  pgno: 122
- img_proc: false
  md: 'In each case the object grows to fill the specified dimension.


    There are also two clipping settings:


    +   - clip_vertical

    - clip_horizontal


    These work with the top, bottom, left and right to clip an object to fit the container.
    For example, if you set gravity to top and clip_vertical then the object will
    be positioned at the top of the container and its bottom edge will be clipped.


    Most of the time you will use gravity settings like center or top. If you try
    to use complicated combinations then things do not work as you might expect.


    The final complication, in fact turns out to be quite straightforward, is that
    controls have a gravity property and Layouts provide a layout_gravity property.
    The difference is very simple. The gravity property sets happens to the contents
    of a control and the layout_gravity sets how the control is positioned in the
    Layout container. For example, if you have a Button and set your gravity to top
    then the text within the button will be moved to align with the top. On the other
    hand, you set the layout_gravity to top the whole Button moves to the top of the
    Layout container. Notice that not all Layouts provide a layout_gravity property
    to their child controls.


    # The FrameLayout


    The FrameLayout is the simplest of all the Layouts. It really doesn''t do much
    to position the controls it contains and its intended use is to host a single
    control, i.e. it does just as a frame around a control.


    The Designer no longer provides as much help with FrameLayout as it did and if
    you have used an earlier version you may find the new behavior frustrating. Indeed,
    the only way you can make a FrameLayout the main layout control is to edit the
    XML file and replace ConstraintLayout by FrameLayout. If you want to try out a
    FrameLayout, simply drag and drop it onto the default ConstraintLayout and use
    it.


    When you drop a control in a FrameLayout it is positioned at the top left and
    you cannot drag it to a new position within the layout. To set a control''s position
    you have to find the layout_gravity layout, not the gravity property, and set
    it one or more of top, bottom, left, right, center_horizontal, and center_vertical.'
