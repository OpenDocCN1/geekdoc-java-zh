  md: '# Chapter 5


    # Basic Controls


    We have already used UI controls in previous chapters, but now we have discovered
    how events work it is time to examine how they work and how you can change the
    way they look.


    # Basic Input Controls


    The term control comes from the idea that the user "controls" your program using
    them. Widget or component are also terms that are to mean the same thing. The
    Android community seems very sloppy about terminology.

    The basic input controls are:


    +   - Buttons

    - Text Fields

    - Checkboxes

    - Radio Buttons

    - Toggle Buttons

    - Switches


    If you have used other UI frameworks many of these will be known to you and you
    personally skip to the ones that interest you.

    TextView also has to be included in the full list of basic controls, but unlike
    the Text Field it cannot be modified by the user, i.e. it is an output control
    only.


    Starting at the beginning, let''s revisit the Button in a little more detail.


    # Button Styles and Properties


    There are two basic types of button, Button and ImageButton. The ImageButton is
    much the same as the Button but it has a src (source) property which can be set
    to an image which will be displayed as the button icon and it doesn''t display
    any text.


    The main properties that you work with in the case of a button are things like
    background, which can be set to a color or a graphic. You can spend a long'
  merge: -1
  pgno: 100
- img_proc: false
  md: 'time changing the way a button looks, but in the main the only important property
    of a button is its onClick handler. A button is in your UI to be clicked.


    If you place a Button on the design surface you can use the Attributes window
    to customize it. There are two distinct ways you can change the way a control
    looks. You can set a style or modify a property.


    Setting the style modifies a set of properties to given standard values. You can
    set a style and then modify individual properties to tweak it. Often when you
    first start work on a UI you will set individual properties later to formulate
    a coherent style to be applied to the entire UI.


    Set the background of the Button to dark gray by clicking on the ellipsis at the
    right of the property:


    ![](bbox=[0.269, 0.355, 0.672, 0.703])


    The Resources window that appears gives you access to all of the resources that
    your program can make use of. Resources are a big part of programming in Android
    and we cover them in detail in later chapters.


    You could enter a color for the background directly by specifying the value of
    RGB and optionally Alpha, its transparency. Using a resource, means that if you
    change the resource value in the future all of the UI components that make use
    of it.'
