  md: 'Dimension is also easy-to-understand value resources:


    +   - Dimension is simply an integer value complete with a units designator. <dimen
    name="resourcename">>10px</dimen>


    Obviously you can use any of the standard Android scales - pt, mm, in, and so
    on. You use dimensions anywhere that you need to specify a size or location in
    a particular set of units.


    Finally Color lets you use names for the colors you are using in your app:


    +   - Color provides easy use names for hex color codes. <color name="resourcename">>
    #f00 </color>


    defines a red color. You can specify a color using any of: #RGB, #ARGB, #RRGGBB
    or #AARRGBB

    where each of the letters represents a single character with R=Red, G=Green, B=Blue
    and A=Alpha (transparency).


    # IDs


    Ids are value resources and can be set up like any other value resource. For example,
    if you want to set up an id for a button you might use: <item type="id" name="resourcename"
    />


    Notice that this is slightly different from other value resources in that you
    don''t have to provide a value. The reason is that the system provides a unique
    integer value for each id. You don''t need to define an id in an XML file all
    of its own ids can be created on the fly other XML files. Putting a + in front
    of a id creates the resource without having to explicitly do the job. For example:


    ```

    <Button

    android:text="@string/Greeting"

    android:id="@id/button2"

    ```


    creates the button2 resource.


    On the other hand:


    ```

    <Button

    android:text="@string/Greeting"

    android:id="@id/button2"

    ```


    will only work if you have defined button2 in a resource in the values/folder.

    Of course in Android Studio you can simply type an id in the Attributes window
    say and the system will automatically provide the +@id to make it'
