  md: '# # Summary


    +   * An Activity is the unit of the Android app and it roughly corresponds to
    one screenful of user interface plus the code to make it work.

    * In most cases you will create an Activity for each UI screen you want to present
    to your user.

    * Only one Activity from your app is running at any given time.

    * An Activity is single-threaded and runs on the UI thread.

    * You can set which Activity starts the app in the Manifest. Android Studio sets
    this to MainActivity by default.

    * The Activity has events corresponding to different stages in its life cycle.
    The onCreate event is called when the app first starts and is where you perform
    all initialization.

    * You can also restore the app''s state from previous runs at this point.

    * The Activity then loads a View or ViewGroup object to create its user interface.

    * You can create View/ViewGroup objects in three possible ways: in code, using
    XML or using the Designer to generate the XML.

    * The Designer is far the easiest to create a UI.

    * By opening the XML file you can use the Designer to place widgets corresponding
    to View objects on the design surface.

    * You can use the Attributes window to set the properties of each widget.

    * The XML file that the Designer creates is used by the Activity to set its UI
    by creating Java objects that correspond to each of the View objects placed using
    the Designer.

    * When reference a class that isn''t defined in the file, i.e. most of them, then
    you need to add an import statement to the start of the code.

    * If you use Alt+Enter when the cursor is positioned within any word that is displayed
    in red then Android Studio will help you fix the problem.'
  merge: -1
  pgno: 49
