  md: '# Summary


    +   * The subject of Android graphics is huge and there is always more than one
    way to approach any task. This chapter is a first look at what you might call
    UI-based graphics.

    * The Bitmap is the basic graphics object. It consists of a rectangle of pixels
    that can be set to any color.

    * The ImageView is a general purpose UI component that can be used to display
    a range of graphics objects including a Bitmap.

    * You can draw on a Bitmap using a Canvas object which has a large number of different
    drawing methods.

    * The color and drawing style used by many of the Canvas methods is determined
    by the properties of a Paint object.

    * The Canvas object also supports transformations which can be used to modify
    where a graphic is drawn, its size, rotation, etc.

    * Transformations can also be used to standardize the drawing of graphics objects

    * Transformations can also be used to change the default pixel coordinate system
    to anything you want to use.

    * Simple animation is possible using nothing but a Bitmap, Canvas and an ImageView.

    * Only the UI thread can modify the UI.

    * The Android Timer can be used to animate 2D graphics, but you have ensure that
    it runs the code on the UI thread using the runOnUIThread method.'
