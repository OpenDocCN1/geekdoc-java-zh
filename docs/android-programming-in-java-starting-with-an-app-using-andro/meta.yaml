  md: "already created. This is what the convertView parameter in the getView method\
    \ is all about. If it is null you have to inflate and create a new View object.\
    \ If it is non-null then it is a View ready to be used and you don't have to create\
    \ a new one.\n\nModifying the previous example to make use of convertView is easy:\n\
    \n```\nView row;\nif(convertView==null) {\n    LayoutInflater inflater = ((Activity)\
    \ context).getLayoutInflater();\n    row = inflater.inflate(resource, parent,\
    \ false);\n} else {\n    row=convertView;\n}\n```\n\nThis is a speed-up worth\
    \ making and saves to create lots of View objects and dispose of them. However\
    \ we are still looking up the child View objects every time we want to change\
    \ the data:\n\n```\nTextView title=(TextView) row.findViewById(R.id.title);\n\
    TextView number=(TextView) row.findViewById(R.id.number);\n```\n\nThis is also\
    \ very wasteful and can be avoided to save the references to the children in an\
    \ object, and all we have to do store this in the parent View's tag property.\
    \ The next time we see the parent View don't have to find the children we are\
    \ looking for - they are stored in the parent's tag as a ViewHolder object.\n\n\
    First need to create a ViewHolder object:\n\n```\nprivate static class ViewHolder\
    \ {\n    TextView title;\n    TextView number;\n}\n```\n\nNotice that this has\
    \ fields capable of holding references to our two TextView objects. The logic\
    \ of the getView method is not only to create and store a ViewHolder object if\
    \ we are not recycling a View:\n\n```\nView row;\nViewHolder viewHolder;\nif (convertView\
    \ == null) {\n    viewHolder = new ViewHolder();\n    LayoutInflater inflater\
    \ = ((Activity) context).getLayoutInflater();\n    row = inflater.inflate(resource,\
    \ parent, false);\n    viewHolder.title=(TextView) row.findViewById(R.id.title);\n\
    \    viewHolder.number=(TextView) row.findViewById(R.id.number);\n    row.setTag(viewHolder);\n\
    }\n```\n\nNotice that we have stored the references to the TextViews in the ViewHolder\
    \ and stored this in the row's tag field – this is what tag fields are generally\
    \ used for."
