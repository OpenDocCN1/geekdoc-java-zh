  md: 'You can also see that the text is now in a different position and not simply
    rotated about the origin. This is because the 15 degree rotation is added to the
    45 degree rotation around the center of the rectangle. To keep your transformations
    separate and non-interacting you have to return the transformation matrix to the
    identity after you have changed it to something else.


    How do you set the matrix back to the identity?


    You could use:


    ```

    c.setMatrix(new Matrix());

    ```


    as Matrix() creates an identity matrix by default, or you could just use:


    ```

    c.setMatrix(Null);

    ```


    because passing a Null causes the matrix to be reset. However, needing to make
    a change to the transformation matrix and then restore the original is such a
    common operation that Canvas supports:


    ```

    c.save();

    ```


    which saves the current matrix and:


    ```

    c.restore();

    ```


    which restores the current matrix.


    For example:


    ```

    paint.setColor(Color.GREEN);

    ```


    ```

    c.save();

    c.rotate(45, 100, 350);

    c.drawRect(20F, 300F, 180F, 400F, paint);

    ```


    ```

    c.restore();

    c.rotate(15F);

    ```


    ```

    paint.setColor(Color.BLACK);

    paint.setTextSize(50F);

    c.drawText("Hello Graphics",0,14,90,80,paint);

    ```


    With the save before the first rotate, the restore before the second decouplesnthe
    two transformations.'
