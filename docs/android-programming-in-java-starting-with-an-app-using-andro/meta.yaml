    In this case there is a 15 degree rotation after the rectangle has been drawn

    and before the text is drawn. The result is that the rectangle stays where it

    was but the text was rotated:


    ![](bbox=[0.362, 0.281, 0.574, 0.483])


    After the rotation everything you draw will be at 15 degrees.

    Notice that the rotation is about the origin, i.e. 0.0 the top left-hand corner.

    you want to rotate about a different point, usually the center of some object,

