    \ in\nthe MyOnClickListener instance is called when the button is clicked.\n\n\
    # Using Breakpoints\n\nThe easiest way to check that the event handler is called\
    \ is to insert a\nbreakpoint on the first line of the onClick method. Breakpoints\
    \ are a\nfundamental debugging tool and you need to learn to use them as early\
    \ as\npossible.\n\nTo place a breakpoint simply click in the \"margin\" next to\
    \ the line of code.\nred blob appears:\n\n```\npackage ccm.example.mikejames.myapp;\n\
    import android.view.View;\n\npublic class MyOnClickListener implements View.OnClickListener\
