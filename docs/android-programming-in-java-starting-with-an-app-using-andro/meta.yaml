  md: "Android Studio automatically generates an event handler ready for you use:\n\
    \n```\n@Override\npublic boolean onOptionsItemSelected(MenuItem item) {\n    int\
    \ id = item.getItemId();\n    if (id == R.id.action_settings) {\n        return\
    \ true;\n    }\n    return super.onOptionsItemSelected(item);\n}\n```\n\nThis\
    \ just handles the autogenerated Settings menu option, but you can see the general\
    \ principle. The event handler is passed the menu item that has selected - the\
    \ actual object not just its id. You can then use the menu item's getItemId to\
    \ retrieve the id and test it against the ids that you assigned in the resource\
    \ file.\n\nSo in our simple example with a Settings and a Send item we might rewrite\
    \ the generated event handler:\n\n```\npublic boolean onOptionsItemSelected(MenuItem\
    \ item) {\n    switch (item.getItemId()) {\n        case R.id.action_send:\n \
    \           //perform send\n            return true;\n        case R.id.action_settings:\n\
    \            //perform settings\n            return true;\n        default:\n\
    \            return super.onOptionsItemSelected(item);\n    }\n}\n```\n\nYou can\
    \ see the general idea – for each of the item's id in each of the case clauses\
    \ and return true if you have processed the item event. This is the standard way\
    \ of processing item events in menus, that is with a single event handler and\
    \ a, possibly large, switch statement.\n\n# Changing Menu in Code\n\nA menu is\
    \ just a View hierarchy and you can make changes to it just like any View hierarchy\
    \ by adding and customizing View objects. However, menus have some extra considerations\
    \ because they are displayed in a slightly different way to the rest of the UI.\
    \ The problem is that the menu items are not always part of the View hierarchy.\
    \ They are created when the menu is displayed. This means that you might try to\
    \ modify them before they are present and cause an application crash.\n\nThe key\
    \ to modifying a menu on the fly is the onPrepareOptionsMenu event handler. This\
    \ is called just before the menu is displayed and the menu View"
  merge: -1
  pgno: 186
- img_proc: false
  md: "objects are included in the View hierarchy. The onCreateOptionsMenu event only\
    \ fires when the menu is created, but the onPrepareOptionsMenu is called every\
    \ time the menu is redisplayed. Hence you can use it to make modifications to\
    \ the menu.\n\nFinding a simple example of its use is difficult as we will discover,\
    \ so let's add a new item via the onPrepareOptionsMenu. Select a suitable location\
    \ in the class and right click, select Generate and then Override method. You\
    \ can select onPrepareOptionsMenu from the list and Android Studio will create\
    \ a stub for:\n\n```\n@Override\npublic boolean onPrepareOptionsMenu(Menu menu)\
    \ {\n    return super.onPrepareOptionsMenu(menu);\n}\n```\n\nNow all we have to\
    \ do is use the method to add a new item. There are many of overloaded versions\
    \ of add that allow you to specify the item in detail. The simplest is just add(CharSequence)\
    \ which adds an item with the specified title:\n\n```\n@Override\npublic boolean\
    \ onPrepareOptionsMenu(Menu menu) {\n    menu.add(\"New Item\");\n    return super.onPrepareOptionsMenu(menu);\n\
    }\n```\n\nNow if you run the program you will discover that each time you select\
    \ the Settings menu a couple of New Items are added to the menu:\n\n![](bbox=[0.318,\
    \ 0.555, 0.622, 0.77])\n\nWhat is going on? The answer is that each time the menu\
    \ is drawn the onPrepareOptionsMenu is called. For example, if you cause the Settings\
    \ menu to be displayed, this overwrites the menu display and hence it has to be\
    \ redrawn and onPrepareOptionsMenu is called."
