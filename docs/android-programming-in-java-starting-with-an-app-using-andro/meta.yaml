  md: '# Changing the Data


    One of the slightly confusing things about using adapters is the relationship
    between what is displayed and what is in the underlying data structure. You can
    change the data, but if you want to see the change in the container you have to
    use an adapter notify method to tell the adapter that the data has changed.


    For example, if you change an element of the array:

    myStringArray[]="newdata";


    then nothing will show until you use:

    ListView myList=(ListView) findViewById(R.id.listView);

    ArrayAdapter adapter=(ArrayAdapter)myList.getAdapter();

    adapter.notifyDataSetChanged();


    Notice that you have to call the ListAdapter returned from getAdapter to an ArrayAdapter
    to call the notify method.


    There is a second way to change the data using the ArrayAdapter itself. This provides
    a number of methods to add, insert, clear, remove and even sort the data in the
    adapter. The big problem is that if you use any of these then the underlying data
    structure associated with the adapter has to support them. For example, the adapter
    method adds an object onto the end of the data structure, but with the program
    currently set up, if you try:

    adapter.add("new data");


    the result will be a runtime crash. The reason is that in Java an array has a
    fixed size and the add method tries to add the item to the end of the array, which
    isn''t possible.


    If you want to add items to the end of an array-like data structure, you need
    to use an ArrayList and not just simple array. An ArrayList can increase and decrease
    its size. For example we can create an ArrayList from our existing String array:

    ArrayList<String> myList=new ArrayList<String>();


    and you can associate this new ArrayList with the adapter instead of the String
    array:

    ArrayAdapter<String> myAdapter=new ArrayAdapter<String>(

    this,

    android.layout.simple_list_item_1,

    myList);


    Following this you can use:

    myAdapter.add("new data");


    and you will see the new data at the end of the displayed list. You may have to
    scroll to see it.'
