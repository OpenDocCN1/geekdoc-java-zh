  md: 'The view parameter is just the child of the AdapterView that was actually clicked.
    Note that an item can be composed of more than one View item.


    Finally the int position parameter and the long id give the position of the view
    that was clicked in the adapter and the row id of the item that was selected.


    You can populate a Spinner from a database. In this case the row id gives the
    database row number, which isn''t necessarily the same as its position in the
    Spinner. For a simple ArrayAdapter the position and id are the same. In cases
    the only parameter you will be interested in is the int position which gives you
    the item selected. place a TextView on the design surface and change the onItemSelected
    event handler to read:


    ```

    @Override

    public void onItemSelected(

    AdapterView<?> parent,

    View view,

    int position,

    long id) {

    TextView myTextView = (TextView) findViewById(R.id.textView);

    myTextView.setText(Integer.toString(position));

    }

    ```


    All that happens is that the position parameter is displayed in the TextView.

    Finally to connect the eventhandling object to the Spinner we need to add it using
    its setOnItemSelectedListener:

    sppinner.setOnItemSelectedListener(onSpinner);

    Putting all of this together gives the new onCreate:


    ```

    @Override

    protected void onCreate(

    Bundle savedInstanceState) {

    super.onCreate(savedInstanceState);


    ```


    ```

    AdapterView.OnItemSelectedListener = =

    new AdapterView.OnItemSelectedListener() {

    ```


    ```

    @Override

    public void onItemSelected(

    AdapterView<?> parent,

    View view,

    int position,

    long id) {

    TextView myTextView = (TextView) findViewById(R.id.textView);

    myTextView.setText(Integer.toString(position));

    }

    ```'
