  md: '# Bias Constraints


    So far the ConstraintLayout hasn''t really provided anything new, but it does
    have a more sophisticated constraint that doesn''t have a counterpart in the RelativeLayout.
    Referred to as “bias” this type of constraint works in terms of ratios, expressed
    as percentages and displayed as zig-zag lines:


    ![](bbox=[0.363, 0.233, 0.686, 0.603])


    To use it you have to create two constraints that “fight” each other. For example,
    if you drag one constraint to the left and its counterpart to the right, the result
    is a horizontal bias used to position the control at the desired proportion of
    the layout size. You can achieve a vertical bias by dragging constraints from
    the top and the bottom.'
