    \ value then use the setChecked or the toggle\nmethods.\n\n# Switches and Toggle\
    \ buttons\n\nSwitches and Toggle buttons are just CheckBoxes in another format.\
    \ They\nstore one of two states and they change state when the user clicks on\
    \ them,\njust like a CheckBox:\n\n![](bbox=[0.358, 0.483, 0.584, 0.663])\n\nYou\
    \ can check the state of a Switch/Toggle button using the isChecked\nmethod and\
    \ you can use its onClick event to monitor when its state changes.\nThe only real\
    \ difference is that you can use the textOn and textOff to set what\nis displayed\
    \ when the switch/toggle is on or off."
