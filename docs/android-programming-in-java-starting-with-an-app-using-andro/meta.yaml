  md: "expression is strongly typed but the compiler infers the type of the parameters\
    \ and the return type from the context. The point is that lambda expressions are\
    \ always pass as a parameter or assigned to a variable and it is the type of the\
    \ parameter or variable that determines the types used in the lambda.\n\nIt is\
    \ not an error to include the data type of the parameters but it is always unnecessary.\n\
    \nThere are a few simplifications to the lambda notation. If there is just a single\
    \ parameter you can omit the parenthesis.\n\nFor example:\n\n```\nn ->{\n  return\
    \ -n;\n}\n```\n\nIf the body is a single expression you can omit the brackets\
    \ and the return and result of the expression will be automatically returned.\n\
    \nFor example:\n\n```\nn -> -n;\n```\n\ndefines the same function as given above.\
    \ If you use a return then you need the brackets. This is generally called an\
    \ expression lambda.\n\nThese rules can make lambda expressions look very strange\
    \ in your code and this might make it harder to read. Don't go for the shortest\
    \ and most compact expression make sure your code is easy to understand.\n\n#\
    \ Lambda Types\n\nYou can't actually use the lambdas that have been given in the\
    \ previous section because they don't have a target type which allows the compiler\
    \ to work out the type of their parameters etc. The problem is that there is no\
    \ function type in Java. In its place we make of what is often called a SAM –\
    \ a Single Abstract Method. An interface with a single method defined is a SAM\
    \ and you can regard it as defining the type of a function i.e. the single abstract\
    \ method that it defines.\n\nFor example:\n\n```\npublic interface Sum{\n  int\
    \ sum(int a, int b);\n}\n```\n\nThis is a SAM for the function sum which takes\
    \ two ints and returns an int. lambda expression is just a way of creating an\
    \ instance of this SAM without having to create a class and then an instance.\
    \ For example:\n\n```\nSum adder = (a,b)->{\n  return a+b;\n}\n```"
