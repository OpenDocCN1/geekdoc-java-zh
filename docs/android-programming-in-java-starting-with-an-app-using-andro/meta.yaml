  md: 'The thread that the Activity gets is generally called the UI thread because
    its job is just to take care of the UI. It responds to events from the Activity
    like OnCreate and from the user like a Button click. When the UI thread responds
    to an event it obeys the event handler and then goes back to waiting for the next
    event. This is the sense in which every Android app is simply a collection of
    event handlers that the UI thread executes when the corresponding event occurs.


    The big problem is that the UI event is really only happy when it has nothing
    to do. Then it waits for an event and processes it at once. This makes the user
    think your app is very responsive because clicks and other input are acted on
    at once. If you give the UI thread a long task to do, for example you write a
    lot of processing into an event handler, then isn''t it just waiting for the user
    to do something, and the user starts to think that your app is slow and sluggish.
    At the extreme the UI thread can be kept 100% busy doing something and then the
    entire UI seems to freeze.


    In short the UI thread should not be used for anything that takes more than a
    few milliseconds. The way to achieve this is to use other threads. This is a main
    topic of **Android Programming: Structuring Complex Apps.**.


    The UI thread creates the UI and avoid problems of synchronization only the UI
    thread can interact with the UI. That is, only the UI thread can access the UI.
    This is a fairly common approach to implementing a UI and not at all unique to
    Android.


    So what happens is that the Timer tries to run its TimerTask and in this runs
    the update function, but using the thread Timer runs rather than the UI thread.
    Everything is fine until the last instruction of update, which attempts to use
    a method that belongs to an ImageView object and this it cannot because it is
    not the UI thread. Hence the error message.


    At this point many Android programmers give up and a completely different approach.
    Some of these approaches have advantages, see the Handler class for a good alternative.
    However, the Android framework provides a method for such a situation:


    ```

    runOnThread(Runnable)

    ```


    This is a method of the Activity object and you can use it from any thread that
    has access to the Activity object''s methods to run a function on the UI thread.
    If the thread happens to be the UI thread then no harm done, the function is just
    called. If it''s not the UI thread then the call will be deferred until the UI
    is available and then the function will be run. As long the function shouldn''t
    keep the UI thread busy for too long the UI will become sluggish or even freeze
    completely.


    The Java Runnable is an Interface that has a single run method that is the function
    that is executed on the UI thread – this means it is a SAM (Single'
