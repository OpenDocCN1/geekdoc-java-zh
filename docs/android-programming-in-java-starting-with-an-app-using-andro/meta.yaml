    \ For example, if you have a raw XML resource, getXml(int id) returns an XmlResourceParser\
    \ that lets you through the XML retrieving tags, attributes.\n\n# Conditional\
    \ Resources\n\nSo far resources have just been a way to get data into your app.\
    \ You might have thought that if there was another way to do the job then it might\
    \ be just as good. However, Android Resources are central to customizing your\
    \ app so that it works with the wide range of device types and that Android app\
    \ has to cope. The clear part is that you can make use of conditional resources\
    \ to provide a set of resources customized for the current device at runtime.\n\
    \nThe idea is simple. First you provide a default resource file. This is the one\
    \ that is located in the appropriate directory, /res/values says, but now you\
    \ use qualifiers as part of the directory name.\n\nFor example, you can create\
    \ a directory called /res/values-es which is intended to provide resource values\
    \ for the app when running on a Spanish locale. What happens is that first any\
    \ values that you have defined are taken from the XML files in the values directory,\
    \ these are considered the default. Next, if the app is running on a Spanish language\
