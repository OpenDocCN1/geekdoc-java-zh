  md: 'The lambda expression has its type inferred from the types in the target SAM.
    That is a and b are ints and the return type is an int. The connection between
    the lambda and the SAM goes deeper. The lambda actually creates an object of the
    type Sum with the abstract method defined by the body of the lambda. What this
    means is that if you want to call the function defined by lambda you have to write:


    ```

    int ans=adder.sum(1,2);

    ```


    This seems confusing at first but Java hasn''t given up the use of SAMs it has
    simply added lambdas as an easy and more direct way of creating an instance of
    a SAM.


    Most of the time you can ignore the SAM that the lambda is implementing it is
    generally predefined for. The existing libraries are all constructed using SAMs
    to pass functions to other functions. Before Java 8 you had to write a lot of
    code to create an instance of a SAM and pass it to the function. Now you can just
    use a lambda of the correct type.


    # Using a Lambda to Create an Event handler


    Any object that can generate an event will have a setEventListener method which
    can be used to attach an onEventListener object to the event handler list. The
    name of the method and the object includes the name of the event. There is a


    ```

    setOnClickListener takes an onClick object as its only parameter.

    ```


    Notice that this naming system is entirely convention and not part of the Java
    language.


    The On objects are all derived from an interface of the same name which defines
    a single abstract method which acts as the event handler.


    An interface is like a class but it defines the functions that a class has to
    support. If a class inherits or implements an interface then you have to write
    code for each function defined in the interface. You can think of an interface
    as a specification for a list of functions you have to write to implement the
    interface.


    For example,OnClickListener is an interface which has the single method onClick(View
    v)


    defined. To use it as an event handler you have to create an instance implements
    onClick and then add it to the event handler list'
