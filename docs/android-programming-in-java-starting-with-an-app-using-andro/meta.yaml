  md: 'All you have to do now is get to know the different drawing methods provided.
    Here we use a few of the most common.


    First we need to set the Paint object we created earlier to a FILL style so that
    we draw solid blocks of color and not just outlines:

    paint.setStyle(Paint.Style.FILL);


    To draw a yellow circle all we need:

    paint.setColor(Color.YELLOW);

    c.drawCircle(400F, 200F, 50F, paint);


    The first two parameters give the position of the center and the third is the
    circle''s radius.


    To draw a green rectangle:

    paint.setColor(Color.GREEN);

    c.drawRect(20F, 300F, 180F, 400F, paint);


    The first two parameters give the top left-hand corner and the next two bottom
    right-hand corner.


    Finally let''s add some text:

    paint.setColor(Color.BLACK);

    paint.setText(50F);

    c.drawText("Hello Graphics",0,14,90,80,paint);


    The Paint object has a number of properties that let you set the font and style.
    In this example we simply set the text size. the drawText method takes a string,
    the start and end positions of characters in the string that will be displayed,
    and the coordinates of the starting location.

    If you put this all together and run it you get this very tasteful graphic:


    ![](bbox=[0.383, 0.606, 0.667, 0.883])'
