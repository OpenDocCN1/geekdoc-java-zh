  md: '# Getting Started with the Emulator


    There are two distinct ways of running an Android app using Android Studio. You
    can use the emulator or a real Android device. Eventually you will have to discover
    how to run an app on a real connected Android device because the emulator only
    allows you to test a subset of things and it is slow. However, for the moment
    running your first app on an emulator is quite enough to get started.


    All you have to do is click the green run icon in the top toolbar – or use the
    Run,"app" menu item. When you do this for the first time it will take a while
    for the app to be compiled. Subsequent runs are much faster due to optimizations
    introduced in Android Studio 2.


    When your app is ready to be compiled you will see a dialog box appear which allows
    you to either select a running emulator or start one:


    ![](bbox=[0.232, 0.385, 0.715, 0.628])


    If no emulators are listed then you will have to create one. Select the Create
    New Emulator button. This will present a dialog box where you can select the device
    you want to test on.


    The default is the Nexus 5 running API 25, Nougat, and for a first test you might
    well use this. If you need other devices you can use the AVD (Android Virtual
    Device) Manager to define them.


    If you see a message on the right of the screen "HAXM is not installed" then it
    is a good idea to click the Install Haxm link just below. HAXM is an accelerator
    that is used on Intel machines to make the Android Emulator run faster. You don''t
    need it, but it does speed up:'
  merge: -1
