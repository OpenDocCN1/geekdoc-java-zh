  md: '# Chapter 4


    # Android Events


    Working with Android Studio makes building the UI easy with an interactive editor,
    but you still need to find out how to handle the things it isn''t quite so good
    at. We now need to find out how to work with any event, not just onClick. Even
    though most controls can be used very successfully using just the onClick event,
    there are other types of event that cannot be handled simply by setting an onEvent
    property in the Attributes window.


    In this chapter we look in depth at Android event handling. As before, the emphasis
    will be on using Android Studio and the Designer to get as much of the work done
    as possible.


    This is a moderately advanced topic and many Android programmers bother to understand
    events in their entirety, preferring to just follow the boilerplate code given
    in examples. You can do this, but understanding is usually better. Let''s start
    with the problem of how to write an event handler in Java.


    # The Lambda Approach


    If you have used languages other than Java you might expect event handlers to
    simply be functions that are passed to UI controls to register them as event listeners,
    i.e. functions that call when an event occurs. You might have used an IDE that
    adds event handlers automatically for you. Android currently doesn''t this – you
    have to add code to handle an event. It does, however, help with the automatic
    generation of this code.


    Events in Java are slightly more complicated because everything in Java was an
    object and the only way a function can exist is as a method, i.e part of an object.
    Java 8 changed all of this with the introduction of lambda functions. A lambda
    is a function that doesn''t belong to an object, it isn''t a method and it can
    be passed as a parameter to another function. This is the key property of a lambda
    function that makes it very easy to implement general handling – i.e. not onClick.


    The only drawback of using Java 8 features is that they are not enabled by default
    and are only available for use with Nougat (API level 24) or higher. However,
    lambdas, which make event handling so much easier, will work with all versions
    of Android and are well worth using.'
  merge: -1
