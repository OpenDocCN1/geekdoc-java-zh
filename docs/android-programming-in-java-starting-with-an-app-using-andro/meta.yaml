  md: "CheckBox with id checkBox then you can discover its state when a button\nsomewhere\
    \ on the view is clicked:\n\n```\nCheckBox box= (CheckBox) findViewByIdById(R.id.checkBox);\n\
    boolean checked = onClick.isChecked();\n```\n\nThe CheckBox also supports the\
    \ onClick event which can be used to process\nchanges to its state, and you can\
    \ set up the onClick event handler using the\nAttributes window as in the case\
