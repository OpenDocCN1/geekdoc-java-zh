  md: '# Chapter 8


    # Programming The UI


    If you want to be a really good Android programmer, not only do you need to know
    how create a UI, but also how the UI is created. To be really confident in what
    you are, you need to understand some of the inner workings of the Android graphics
    system. This is also essential if you want to modify the UI in code and work with
    menus.


    # A UI Library


    There are lots of different UI construction kits for Java and other languages,
    AWT, Swing, Qt, MFC, WPF and on, and you might think that mastering them all would
    be a difficult, if not impossible, task. In fact it is lot easier than you might
    think most UI libraries use the general approach and the Android UI library, which
    doesn''t seem to have a given name, is no different. Let''s take a careful look
    at how it works.


    An Activity has a window associated with it and this is usually the entire graphics
    screen of the device it is running on. In other words, an Activity can allow other
    View classes to draw on the device''s screen. However, rather than simply providing
    direct access to the graphics hardware, there is an extensive set of classes that
    make building a UI and performing graphics operations easier.


    Before we look at general graphics we need to first find out how the UI is constructed.


    # The View


    The basis of all UI components and general 2D graphics is the View class. This
    is a general-purpose class that has lots and lots of methods and properties that
    determine how it will display the component or other graphics entity it represents.
    It also takes part in the event handling system, which means Views can respond
    to events. There are View classes all of the standard components that you make
    use of in the Android Studio Designer, i.e. Button, TextView and so on.


    Every View object has an onChanged method that can draw the graphic representation
    of what it represents onto a Canvas object which is essentially'
  merge: -1
  pgno: 162
- img_proc: false
  md: "a bitmap on drawing methods. What happens is that the Activity calls the View's\
    \ onDraw method when it needs to update the UI and passes it a Canvas object that\
    \ it renders to the screen – the Canvas is rendered to the screen at this level.\
    \ You don't have to worry about how you can think of this as, \"every View object\
    \ knows how to draw itself\"..\n\nTo summarize:\n\n+   - An Activity can be associated\
    \ with a View object.\n- When the Activity needs to draw its UI it calls the View\
    \ object's onDraw method e.g.view.onDraw(Canvas).\n- The View object then draws\
    \ on the Canvas whatever it needs to, a button, text or something else.\n- The\
    \ Activity displays the Canvas object on the screen.\n\nAn Activity can only be\
    \ associated with a single View object, which determines what is drawn on the\
    \ screen. This might seem a bit limited, but as you will see, it is far from limited\
    \ because View objects can be nested within one another.\n\n# setContentView\n\
    \nHow do you set a View object to show in the Activities window?\n\nThe answer\
    \ is that you use the Activities setContentView method, which is what we have\
    \ been doing all along.\",\n\nTo see this in action, start a new Basic Activity\
    \ project and change onCreate to:\n\n```\n@Override\nprotected void onCreate(Bundle\
    \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    Button b\
    \ = new Button(this);\n    setContentView(b);\n}\n```\n\nDon't forget to use Alt+Enter\
    \ to add the import statements needed to allow you to use the View class, and\
    \ don't leave any code in onCreate that would use other View objects such as the\
    \ menu."
