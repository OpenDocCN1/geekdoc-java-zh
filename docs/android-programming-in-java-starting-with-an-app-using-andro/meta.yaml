  md: "Once the program pauses you can see where it has reached in its execution\n\
    \ you can examine what is stored in all of the variables in use.\n\n![](bbox=[0.19,\
    \ 0.126, 0.81, 0.296])\n\nYou can also restart the program or step through – see\
    \ the icons at the top\nde the debug window. As you step through you will see\
    \ the values in the\nvariables change. Any bug will be found at the first place\
    \ you find a\ndiscrepancy between what you expect to find and what you actually\
    \ find.\nThere is much more to learn about debugging for this and small\nintroduction\
    \ is to save you a lot of time.\n\n# Alternative Ways to Handle an Event\n\nCreating\
    \ a class and then an instance of the class is a perfectly good way to\nen an\
    \ event handler in theory. Indeed it is the embodiment of the\n“everything is\
    \ an object” approach to programming but it isn't very practical\nbecause you\
    \ are going to need to create a new class for every event you want\nto handle.\
    \ In addition these classes we are going to contain one method and be\ninstantiated\
    \ just once.\n\nThis results in a lot of standard, “boilerplate” code for something\
    \ that you are\ngoing to have to do often. There is also the problem of naming.\
    \ You have to\nfind a name for class that is handling a click event from a button\
    \ and\nanother that handles the same event from a textbox and so you also need\n\
    a name for each instance you create so you end up with lots of names like\nbuttonClass\
    \ buttonObject and so on.\n\nThis is the reason that lambdas were introduced in\
    \ Java 8 but before lambdas\nthere were two other approaches that reduced the\
    \ amount of boilerplate code\n the number of names you needed:\n\n+   1. Implement\
    \ the interface in the activity or more generally in the class\nthat is hosting\
    \ the objects generating the event\n2. Use an anonymous class"
