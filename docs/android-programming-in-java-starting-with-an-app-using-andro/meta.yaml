  md: "# The onEditorAction Event\n\nReturning to the EditText control, let's add\
    \ a handler for the Send button.\nThis provides another opportunity for an example\
    \ of the general process of adding an event handler.\n\nFirst place an EditText\
    \ for an email on the design surface and use the Attributes window as described\
    \ in the last section to add a Send button to the IME that pops up when the user\
    \ enters text, that is findOptions and select actionSend.\n\nBefore you can handle\
    \ any new event you have to discover the name of the event listener interface\
    \ and the setOn method for that. For the EditorAction event the listener interface\
    \ is called OnEditorActionListener and the setOn method is setOnEditorActionListener.\n\
    \nYou can look up the details of the event handler defined in OnEditorActionListener\
    \ in the documentation. The parameters are:\n\n```\n@override\npublic boolean\
    \ onEditorAction(\n    TextView getView,\n    int i,\n    KeyEvent keyEvent)\n\
    ```\n\nIn this case textView is the control that the event is associated with,\
    \ i is the action id which is a code that indicates which keyboard action has\
    \ caused the event and keyEvent is null unless the enter key was used.\n\nIf the\
    \ action has been \"consumed\", i.e. acted upon, the routine should return true\
    \ and no other handlers will get a chance to process it. In general, Java events\
    \ can be passed to other controls that contain the control that is the source\
    \ of the event.\n\nWith this information we can proceed before and use a lambda\
    \ to implement the event handler. In this case we might well do the job within\
    \ the setOnEditorActionListener as the event handler will only be needed by this\
    \ control:\n\n```\nEditText email = (EditText) findViewById(R.id.editText);\n\
    email.setOnEditorActionListener((actionID, event) -> {\n    process the event\n\
    \    return true;\n});\n```\n\nNotice that now our event handler has three parameters\
    \ but we still don't have to supply their type as the compiler can infer."
  merge: -1
  pgno: 109
- img_proc: false
  md: "For a simple example, let's add a TextView and transfer the text that the user\
    \ enters when they select the send button. Imagine the scenario is actually sending\
    \ an email or sms.\n\nWe test to see if the user selected the send button or some\
    \ other button and if they did we transfer the:\n\n```\nEditText email = (EditText)\
    \ findById(R.id.editText);\nemail.setOnEditorActionListener((v, actionID, event)\
    \ -> {\n    TextView tv = (TextView) findById(R.id.textView);\n    if (actionID\
    \ == EditorInfo.IME_SEND) {\n        tv.setText(email.getText());\n    }\n   \
    \ return true;\n});\n```\n\nNotice the use of the EditorInfo static class to obtain\
    \ the integer id corresponding to the send action. The EditorInfo class lots of\
    \ useful constants and methods. Also notice the use of closure to access the variable\
    \ set in the enclosing method.\n\nIf you run the app you will discover that you\
    \ can enter an email address into the EditText field with the help of the keyboard\
    \ and when you press the Send button the address is transferred to the TextView.\n\
    \n# CheckBoxes\n\nA CheckBox is a fairly obvious UI element. It displays a small\
    \ label, controlled by the text property or without a tick mark next to it. The\
    \ user can select or deselect as many checkboxes as desired.\n\n![](bbox=[0.373,\
    \ 0.584, 0.674, 0.781])\n\nIn most cases you don't have to deal with the state\
    \ of a CheckBox until the user presses some other control, usually a big button\
    \ marked Done or similar. Then you can discover the state of each CheckBy by simply\
    \ using the isChecked method which returns true or false: For example, if you\
    \ have"
