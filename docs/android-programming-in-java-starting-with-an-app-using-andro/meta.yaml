- img_proc: false
  md: 'You can ignore the instructions that follow the setContentView function because
    these set up the standard "extras" that every Android application supports – a
    floating ActionBar.


    There are two other functions below the onCreate function, but ignore them for
    the moment. They implement features you didn''t really ask for which can be useful,
    but not when you are just getting started.


    The **onCreate** is the only thing that matters at the moment. This function is
    called when your app is run and it is expected to create the view and do the actions
    the Activity is concerned with.


    As our Activity doesn''t really do anything except first call the inherited OnCreate
    method, **super.onCreate**, to do all the standard things and then use the **setContentView**
    function to select the XML file that determines the layout of the Activity''s
    screen.


    The line:

    setContentView(R.layout.activity_main);


    is the most of all and really the only one that actually does gets the resource
    object R that represents the layout as defined in the XML file created by the
    Designer and makes it the current ContentView i.e. what is displayed on the screen.
    In other words, it makes the connection between the layout you have defined using
    the Designer and stored in the XML file, and the user interface that appears on
    the device''s screen.


    You may be puzzled as to why you edited a resource file called **content_main.xml**
    and yet Java is loading a resource file called **activity_main.xml.**


    The answer is, to make extending your app easier, Android Studio creates two layouts,
    activity_main.xml that are displayed and content_main.xml that you use to design
    your custom UI. Of course, activity_main.xml contains a reference to content_main.xml.
    This makes things more complicated for the beginner, but is a simplification later
    on.


    We have more to learn about the resource object R, but you can see that its main
    role is to form a link between your Java code and the resources that have been
    created as XML files by the Designer.


    As this is all our Activity does, this is all the code we need. While I agree
    it is hardly an "activity", it is enough to see the basic outline of an Android
    app and to see how to get it running – which is our next job.'
  merge: -1
