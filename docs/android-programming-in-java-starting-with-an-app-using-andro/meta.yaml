    \ on it, you will see a little way to do the file:\n\n```\n<activity\nandroid:name=\"\
    MainActivity\"\nandroid:label=\"SimpleButton\" >\n```\n\nThis defines the Activity\
    \ system it has created for you and the lines below this define it as the startup\
    \ Activity:\n\n```\n<intent-filter>\n  <action android:name=\"android.intent.action.MAIN\"\
