- img_proc: false
  md: 'The top four sections of the Palette hold the most important UI components
    with a further five sections with more specialized ones.


    +   1. The Widgets section contains the most frequently used components – Buttons,
    Checkboxes and so on. This is the set of components you need to learn to use first.

    2. Text provides a set of text input components which all work in or less the
    same way.

    3. Layouts are containers for other components that provide different layout rules.

    4. Containers are like mini-layouts in that you generally put other components
    inside them and the container \looks after them.

    5. Images provides containers for specific types of resources such as images and
    videos:


    ![](bbox=[0.358, 0.372, 0.693, 0.574])


    +   6. Date has widgets concerned with date and time entry and display.

    7. Transitions perform limited animation between different components.

    8. Advanced is where you will find bigger and complex components such as the number
    picker.

    9. Google is for services provided by Google and initially consists of ModelAndView
    and AdView.

    10. Design provides a collection of more advanced controls such as tagged pages.

    11. AppCompat has controls that provide up-to-date controls for older versions
    of Android.'
