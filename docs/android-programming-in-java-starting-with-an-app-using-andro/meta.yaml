  md: 'you created using the Designer and the layout that appears on the device''s
    screen.


    It is worth looking a little closer at the way that the layout file is specified
    because this is a general way that Android lets you access resources. There is
    a whole chapter about resources later but it is still worth an introduction now.


    The R object constructed by the system to allow you to access the resources you
    have placed in the resource directories. For example, in onCreate the use of R.layout.main
    returns an integer value, its id, that allows the setContentView method to find
    the activity_main XML layout file. In general all resources are found via the
    R object, which as an index of resources.


    # View and ViewGroup


    So far so good, but it is important to realize what happens next it the XML file
    is rendered as a set of View objects. That is, Java objects are all sub-classes
    of the View object. The UI and graphics system is implemented as a hierarchy of
    components derived from the View class. If you have used any GUI framework, AWT,
    Swing, XML, etc, this idea will not be new to you. For example, a button is a
    class derived from View and to create a button all you have to do is to create
    an instance of the Button class. You can of course create as many buttons as you
    like by creating more instances.


    This leaves over the question of where the button appears in the layout?

    The answer to this is that there are ViewGroup objects which act as containers
    for other View objects. You can set the position of the child View objects or
    just allow them to be controlled by various layout rules, more of later. You can
    opt to create the entire UI by creating and working with instances of View objects
    and this is something demonstrated in Chapter 7.


    So to be 100% clear of all the UI objects are defined in code and every UI object,
    such as a button, has a Java class with a similar name that lets you create the
    UI in. In fact this is the only way to create the UI, but there are other ways
    of specifying it. Instead of writing code to create the UI in an XML file and
    then use code to display it. This is what setContentView does — it reads the XML
    file you specify and create Java objects that implement the UI.


    This means you could create the UI by manually writing an XML file that defines
    view objects and how they nest within another and rely on the system to create
    the view object hierarchy for you. Although this is possible, it is much easier
    to use the Designer to create the XML file and then allow the system to create
    the objects for you from the generated XML file.'
