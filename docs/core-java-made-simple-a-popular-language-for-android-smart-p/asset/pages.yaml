  md: '# 9.2 Difference between This and Super Keyword


    | THIS | SUPER |

    |---|---|

    | This is the instance reference variable which is used to access the class level
    members. | It is also an instance reference variable that is used to access the
    super class members. |

    | Can call another constructor explicitly using this() | Every constructor by
    default calls super() which is a call to argument constructor of parent class
    |

    | ''this'' points to current object of the same class. | ''super'' access super
    class methods and variables. |

    | ''this'' invokes current class constructor | ''super'' invokes super class constructor.
    |\n| ''this'' keyword refers to an object | ''super'' keyword refers to super
    class variable or methods |'
