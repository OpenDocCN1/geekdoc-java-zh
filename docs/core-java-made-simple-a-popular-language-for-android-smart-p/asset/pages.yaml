  md: '# 10.2 Method Overriding


    Method overriding can be done in sub class. In order to override the method remember:


    Method name must be same.


    Method return type also should be same as it is like super class.


    Method parameter also must be the same like the super class.


    Access modifier of the method should be equal or higher than the super class.


    | Super Class | Sub Class |

    | --- | --- |

    | Private | Private, Default, Protected, Public |

    | Default | Default, Protected, Public |

    | Protected | Protected, Public |

    | Public | Public |


    Note


    Private method of a class cannot be overridden.


    Final method of a class cannot be overridden.'
