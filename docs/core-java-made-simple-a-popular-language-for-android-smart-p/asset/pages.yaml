  md: '# 16.5 “throw” keyword


    Throw keyword is used to throw the exception from the body of the method.


    If you are throwing any unchecked exception then there is no hard and fast rule
    that you will have to report about that exception using try and catch or by propagating.


    But, it is always recommendable to handle throw from the body of the method using
    try and catch.


    Syntax


    ```

    void m1(){

    ArithmeticException ae=new ArithmeticException();

    throw ae;

    } OR

    void m1(){

    throw new ArithmeticException();

    }

    ```


    If you are throwing any checked exception from the body of the method then you
    must have to report about that exception by writing try and catch or by propagating
    at method header.'
