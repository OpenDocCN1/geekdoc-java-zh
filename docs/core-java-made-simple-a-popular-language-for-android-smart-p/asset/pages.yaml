  md: '# 17.4 Thread Priority


    This is a number which will be assigned to each thread by the JVM.

    Mainly three Thread priorities has been define:-


    +   1) MIN_PRIORITY


    +   2) MAX_PRIORITY


    +   3) NORM_PRIORITY


    Minimum priority of any thread will be 1.


    Normal priority of any thread will be 5.


    Maximum priority of any thread will be 10.


    This thread priority will be used internally by the JVM to allocate the CPU time
    when CPU scheduler follows the priority based algorithm. If CPU scheduler is not
    following any priority based algorithm then there is no use thread priority.


    ```

    final void setPriority(int): By using the setPriority() method we can change the
    priority of the thread but you can''t provide the thread priority more than 10
    or less than 1.

    ```'
