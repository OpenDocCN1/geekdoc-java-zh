  md: '# 5.2 Types of Array


    There are mainly two type of array. Array uses indexive type representation to
    store the element.


    +   1. Static array


    Syntax: Datatype array_name[]={val1,val2,...... valn};

    for ex: int a[]={11,22,33,44};


    Note: In java array names are the reference variable and array is the object.


    | | |

    |---||

    | 44 | 3 |

    | 33 | 2 |

    | 22 | 1 |

    | 11 | 0 |


    ![](img/0ba0276697a7bf420ad4269e7fc94740_135_0.png)


