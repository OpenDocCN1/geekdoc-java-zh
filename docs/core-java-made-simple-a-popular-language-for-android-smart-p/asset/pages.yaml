    # Note


    When you are not writing any parameterized constructor inside the class then default
    constructor will internally or automatically be inserted by JVM.


    When you are creating the object of a class then first JVM checks whether that
    corresponding constructor is available inside that class or not. If you have created
    object without passing any parameter, i.e., default constructor then JVM checks
    whether that default constructor is available inside that class or not.


    If default constructor is not available then again it checks whether any parameterized
    constructor is available or not.


    If parameterized constructor is also not available then internally it inserts
    default constructor inside the class and process it. If parameterized constructor
    is available no default constructor will be inserted by the JVM internally.


    Q1 : Can I declare constructor of a class as final?


    Ans: No, we cannot declare constructor of a class as final because it will not
    be allowed to change.'
