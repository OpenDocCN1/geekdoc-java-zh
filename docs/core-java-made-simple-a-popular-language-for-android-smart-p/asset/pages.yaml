  md: '# 1.1 Introduction


    Java is a high-level programming language which was originally developed by Sun
    Microsystems which was initiated by James Gosling and released in 1995 as core
    component of Sun Microsystems’ Java platform (Java 1.0 [J2SE]). It runs on variety
    of platforms, such as Windows, Mac OS, and the various versions of UNIX. The latest
    release of the Java Standard Edition is Java SE 9. With the advancement of Java
    and its widespread popularity, multiple configurations were built to suit various
    types of platforms.'
  merge: -1
