  md: '# 29.1.1 Using StringTokenizer


    Remember earlier when you wrote lines that contain data items separated by delimiters?
    The delimiters, which separate the data items (or tokens, as they are called),
    might be commas or Semicolons or tab character


    StringTokenizer APIs:

    StringTokenizer(String string_to_tokenize,String delimiters) boolean hasMoreTokens()

    String nextToken()

    String nextToken(String new_delimiter) int countTokens()


    When you read each line back in, you need to separate the tokens. Each line might
    represent a name and address, such as in a mail-merge file. We want to break that
    line up into its individual parts, such as name, street, city, state, and zip.


    The way to do that is to use the StringTokenizer class. Although this is not part
    of the I/O hierarchy, we''ll cover it here because it is useful in reading delimited
    streams. Here''s how that class works.


    # Constructing a StringTokenizer object


    You construct an object of StringTokenizer, giving it the string you want to break
    up and what the delimiters are. That is, you tell it what characters are going
    to be used to break up the tokens in the string. After we have'
