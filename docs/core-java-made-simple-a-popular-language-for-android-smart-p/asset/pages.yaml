    # Reflection


    Reflection is a process of analyzing the class without seeing them.


    By using reflection API which has been given by sun microsystem. i.e. java. lang.Reflect
    API. We can come to know most of the class level properties like classes, interfaces,
    fields, and methods at the runtime without knowing the name of corresponding entity
    and operation at compile time. Here entity relates to a class, operation relates
    to a methods. Also we can instantiate the new objects invoke the methods and inject
    the values.


    Reflection API is the very powerful, which is not having use in general programming
    or in basic programming but based on reflection many concept of java and J2EE
    has been design. There are many framework and tools which uses the reflection
    properly.


    +   - Struts


    +   - Hibernate


    +   - Spring


    +   - JUnit


    +   - Tomcat'
