  md: '# 19.1 Introduction


    The main objective of Generics is to provide Type-Safety and to resolve Type-Casting
    problems.


    # Case 1: Type-Safety


    Arrays are always type safe that is we can give the guarantee for the type of
    elements present inside array.


    For example if our programming requirement is to hold String type of objects it
    is recommended to use String array. In the case of string array we can add only
    string type of objects by mistake if we are trying to add any other type we will
    get compile time error.


    That is we can always provide guarantee for the type of elements present inside
    array and hence arrays are safe to use with respect to type that is arrays are
    type safe.


    But collections are not type safe that is we can''t provide any guarantee for
    the type of elements present inside collection.


    For example if our programming requirement is to hold only string type of objects
    it is never recommended to go for ArrayList.'
  merge: -1
  pgno: 712
- img_proc: true
  md: 'By mistake if we are trying to add any other type we won''t get any compile
    time error but the program may fail at runtime.


    Hence we can''t provide guarantee for the type of elements present inside collections
    that is collections are not safe to use with respect to type.


    # Case 2: Type-Casting


    In the case of array at the time of retrieval it is not required to perform any
    type casting.


    But in the case of collection at the time of retrieval compulsory we should perform
    type casting otherwise we will get compile time error.


    That is in collections type casting is bigger headache.


    To overcome the above problems of collections(type-safety, type casting) sun people
    introduced generics concept in 1.5v hence the main objectives of generics are:


    To provide type safety to the collections.


    To resolve type casting problems.


    To hold only string type of objects we can create a generic version of ArrayList
    as follows.'
