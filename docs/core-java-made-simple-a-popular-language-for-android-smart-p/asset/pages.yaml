  md: '# 26.4 Digesting


    Let''s create something larger than a Checksum. A larger set of bits that represents
    a sequence of bytes is a message digest. A message digest works like a checksum.
    It is a one-way hash that takes a variable amount of data and creates a fixed-length
    hash value. This is called a digital fingerprint.


    If somebody makes changes in the original sequence of things and manipulates the
    contents, the message digest is not going to look the same. This is how we implement
    security. There is a possibility, but it is very small, that if the message was
    changed, you would get the same message digest.


    A sequence of bytes is transformed into a digest. In the MessageDigest class,
    we have a static function called getInstance(). getInstance is given the name
    of the MessageDigest that we want to be using. There are two strings that you
    can pass it: SHA1 and MD5. Their details are in algorithmic books.


    Additionally, the update() methods update the digest with the byte or array of
    bytes. The digest() method computes and returns the value of digest. Digest is
    then reset.


