  md: '# 2.1 Character Set


    There are mainly following types of character set in java.


    A to Z


    a to z


    0 to 9


    Basically, these are all the special symbol available on your keyboard. If you
    are developing any application in ''C'' programming language then it can support
    maximum English language because ''C'' supports 8-bit ASCII character set. Whereas
    Java supports 16-bit UNCODE Character Set. So, by using Java as an application,
    it can support many languages.


    When you are developing any application in Java then with the help of Internationalization
    (I18N) or localization. Till UNICODE 4.0 it was supporting almost all the languages
    but it was not supporting Sanskrit and some other languages. But from UNICODE
    5.0 it supports Sanskrit and many more new inclusions are there.'
  merge: -1
