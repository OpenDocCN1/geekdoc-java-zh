  md: 'constructed an object of that type, we have a couple of things we can ask it:


    How many tokens are in this string?


    Have I used up all my tokens in this string?


    Give me the next token in the string.


    StringTokenizer will break up the string and return to you as a String the characters
    up to the next delimiter. Its methods will throw a NoSuchElementException if there
    are no more tokens. Because this exception is derived from RuntimeException so
    that it is not declared with a throws clause, you do not need to catch it.


    One more thing: you can switch delimiters for each token. In other words, even
    though you have created a StringTokenizer object that is looking for particular
    delimiters, you can say, “For this next token, change the delimiter.”


    # StringTokenizer: Example code


    Look at the code below. Notice our string has a vertical bar and a question mark.
    Those are our delimiters. We are going to create a new StringTokenizer, and we
    are going to pass it the string abc (bar) def (question mark) ghi. We are going
    to use as our delimiters a bar and a question mark.'
