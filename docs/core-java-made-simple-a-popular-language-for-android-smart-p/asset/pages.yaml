  md: '# 28.12 SerialVersionUID


    To perform Serialization & Deserialization internally JVM will use a unique identifier,
    which is nothing but serialVersionUID.


    At the time of serialization JVM will save serialVersionUID with object.


    At the time of Deserialization JVM will compare serialVersionUID and if it is
    matched then only Deserialized otherwise we will get RuntimeException saying “InvalidClassException”.


    # The process in depending on default serialVersionUID and


    After Serializing object if we change the .class file then we can''t perform deserialization
    because of mismatch in serialVersionUID of local class and serialized object in
    this case at the time of Deserialization we will get RuntimeException saying “InvalidClassException”.


    Both sender and receiver should use the same version of JVM if there any incompatatability
    in JVM versions then receive enable to deserializable because of different serialVersionUID,
    in this case receiver will get RuntimeException saying “InvalidClassException”.


    To generate serialVersionUID internally JVM will use complexAlgorithm which may
    create performance problems.'
