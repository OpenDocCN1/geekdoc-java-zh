  md: '# 17.14 GreenThread


    Java multiThreading concept is implementing by using the following 2 methods :


    GreenThread Model


    Native OS Model


    # GreenThread Model


    The threads which are managed completely by JVM without taking support for underlying
    OS, such type of threads are called Green Threads.


    # Native OS Model


    The Threads which are managed with the help of underlying OS are called Native
    Threads.


    Windows based OS provide support for Native Model


    Very few OS like SunSolararies provide support for GreenThread Model


    Anyway GreenThread model is deprecated and not recommended to use.'
