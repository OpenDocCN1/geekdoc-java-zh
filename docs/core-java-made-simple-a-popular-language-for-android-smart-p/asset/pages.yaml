  md: '# 18.20 PriorityQueue


    PriorityQueue is a data structure to represent a group of individual objects prior
    to processing according to some priority.


    The priority order can be either default natural sorting order (or) customized
    sorting order specified by Comparator object.


    If we are depending on default natural sorting order then the objects must be
    homogeneous and Comparable otherwise we will get ClassCastException.


    If we are defining our own customized sorting order by Comparator then the objects
    need not be be homogeneous and Comparable.


    Duplicate objects are not allowed.


    Insertion order is not preserved but all objects will be inserted according to
    some priority.


    Null is not allowed even as the 1st element for empty PriorityQueue.Otherwise
    we will get the “NullPointerException”.


    ```

    PriorityQueue q=new PriorityQueue();

    ```'
