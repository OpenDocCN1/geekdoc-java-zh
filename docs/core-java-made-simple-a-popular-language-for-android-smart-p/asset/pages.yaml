  md: '# 2.5 Variable


    Variables will be of some specific data type which contains some value according
    to the compatibility of corresponding data type. The variable value can be changed
    in further program. The value which is been assign to any variable will be loosely
    coupled with that specific memory location.


    ![](img/0ba0276697a7bf420ad4269e7fc94740_46_0.png)


    The variable will be mainly of two types


    Class Level Variable: It can be accessed anywhere within the class. If you are
    not assigning any value to the class level variable corresponding to data type,
    it will be assigned internally by the JVM.


    Two class level variables cannot have same name.


    The variable which is directly define inside the class is called as class level
    variable.


    Local Variable: The variable which is define inside any block, method, constructor
    or inside any local context is called as local variable. Local'
