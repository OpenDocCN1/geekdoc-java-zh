  md: '# 26.1 What is filtering?


    Use filtering to read or write a subset of data from a much larger input or output
    stream. The filtering can be independent of the data format (for example, you
    need to count the number of items in the list) or can be directly related to the
    data format (for example, you need to get all data in a certain row of a table).
    You attach a filter to an input or output stream to filter the data.


    FilterInputStream and FilterOutputStream filter input and output bytes. When a
    FilterInputStream is created, an InputStream is specified for it to filter. Similarly,
    you specify an OutputStream to be filtered when you create a FilterOutputStream.
    They wrap around existing InputStream or OutputStream to provide buffering, checksumming,
    and so on.


    For character I/O, we have the abstract classes FilterWriter and FilterReader.
    FilterReader acts as a superclass for character input streams that read data from
    some other character input stream, filter it, and return the filtered data when
    its own read() methods are called. FilterWriter is for character output streams
    that filter data written to them before writing it to some other character output
    stream.


