  md: '# 23.3 Pipes in Java code


    What is a pipe? A pipe is a means of communication between two threads of a Java
    program. One thread writes to a piped output stream and another thread reads from
    a piped input stream, which is connected to the piped output stream.


    A pipe between two threads works like a pipe works between two processes in UNIX
    and MS-DOS.


    In those operating systems, the output from one process can be piped to the input
    of another process. For example, in MS-DOS, the command `dir | more` pipes the
    output of the `dir` command to the input of the `more` program.


    # Pipe: Example code


    Although pipes are usually used with threads, this example simply writes data
    to a pipe and then reads it back later. First, a PipedReader is constructed, a
    PipedWriter that writes to that PipedReader. The attributes are written to the
    pipe as strings with a vertical bar as a delimiter and a new-line character placed
    at the end. The entire contents of the PipedReader are read as a String and displayed.


    We''ll show later, in Tokenizing, how to use a StringTokenizer to break up a string
    that is delimited into individual values.'
