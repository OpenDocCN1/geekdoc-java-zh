  md: '# 29.1.2 StreamTokenizer


    You can parse an entire input stream. Unlike the StringTokenizer, which parses
    a String, the StreamTokenizer reads from a Reader and breaks the stream into tokens.
    The parsing process is controlled by syntax tables and flags.


    Each token that is parsed is placed in a category. The categories include identifiers,
    numbers, quoted strings, and various comment styles. The parsing that is performed
    is suitable for breaking a Java, C, or C++ source file into its tokens. StreamTokenizer
    is not in the I/O hierarchy, but because it is used with streams, we cover it
    here.


    The StreamTokenizer recognizes characters in the range from u0000 through u00FF.
    Each character value can have up to five possible attributes. The attributes are
    white space, alphabetic, numeric, string quote, and comment character.


    A character that is white space is used to separate tokens.


    An alphabetic character is part of an identifier.


    A numeric character can be part of an identifier or a number.


    A string quote character surrounds a quoted string.'
  merge: -1
  pgno: 884
- img_proc: true
  md: 'A comment character precedes or surrounds a comment.


    A character that does not have any of these attributes is an ordinary character.
    When an ordinary character is encountered, it is treated as a single character
    token.


    Flags can be set to alter the parsing. Line terminators can either be tokens or
    white space separating tokens. C-style and C++-style comments can be recognized
    and skipped. Identifiers are converted to lower case or left as is.


    # Use of StreamTokenizer


    To use a StreamTokenizer, you construct it with the underlying Reader. Then you
    set up the syntax tables and flags. Next, you loop on the tokens, calling nextToken()
    until it returns TT_EOF.


    The nextToken() method parses the next token. The type is both returned by the
    method and also placed in the type field. The value of the token is placed in
    the sval field (String value) if the token is a word or in the nval field (numeric
    value) if the token is a number.


    The token type can be either a character or a value, which represents the type
    of the token. If a token consists of a single character, the value of the type
    is the character value. If the token is a quoted string, the value is the value
    of the quote character. Otherwise it is one of the following:


    TT_EOF means the end of the stream has been read.'
