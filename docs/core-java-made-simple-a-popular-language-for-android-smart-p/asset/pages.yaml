- img_proc: true
  md: '![](img/0ba0276697a7bf420ad4269e7fc94740_276_0.png)


    | Immediate super class | Immediate subclass | Indirect super class | Indirect
    subclass |

    |--- |--- |--- |--- |

    | A | - | B | - | C |

    | B | A | C | - | - |

    | C | B | - | A | - |


    # 3. Multiple Inheritance


    In this case, there will be only one immediate sub class and many immediate super
    classes.


    ![](img/0ba0276697a7bf420ad4269e7fc94740_276_1.png)


    # 4. Hierarchical Inheritance


    In this case, there will be only one immediate super class and many immediate
    subclasses.'
