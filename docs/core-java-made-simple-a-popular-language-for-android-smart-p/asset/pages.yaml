  md: '# 25.1 What is buffering?


    Reading and writing to a file, getting data one byte at a time, is slow and painstaking.
    One way to speed up the process is to put a wrapper around the file and put a
    buffer on it.


    Our BufferedInputStream is going to put a buffer onto an InputStream that is specified
    in the constructor. The actual data source is what you pass it as an InputStream.
    The BufferedInputStream reads large chunks of data from the InputStream. Then
    you read individual bytes or small chunks of bytes from the BufferedInputStream.
    The default buffer size is 512 bytes, but there''s a constructor that allows you
    to specify the buffer size if you want something different.


    To improve your efficiency, you read from the object of BufferedInputStream instead
    of reading directly from the underlying InputStream. And you won''t have to go
    back to the operating system to read individual bytes.


    ![](img/0ba0276697a7bf420ad4269e7fc94740_802_0.png)


    # BufferedOutputStream'
