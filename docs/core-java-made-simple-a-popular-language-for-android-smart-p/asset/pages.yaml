  md: '# 6.9 Volatile Modifier


    Volatile is the modifier applicable only for variables but not for classes and
    methods. If the value of variable keeps on changing such type of variables we
    have to declare with volatile modifier.


    If a variable is declared as volatile then for every thread a separate local copy
    will be created by the jvm, all intermediate modifications performed by the thread
    will takes place in the local copy instead of master copy. Once the value got
    finalized before terminating the thread that final value will be updated in master
    copy.


    The main advantage of volatile modifier is that we can resolve data inconsistency
    problems, but creating and maintaining a separate copy for every thread increases
    complexity of the Programming and effects the performance of the system. Hence
    if there is no specific requirement we do not use volatile modifier and it''s
    almost outdated. Volatile means the value keep on changing where as final means
    the value never changes hence final volatile combination is illegal for variables.'
