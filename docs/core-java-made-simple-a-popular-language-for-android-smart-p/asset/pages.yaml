  md: 'TT_EOL means the end of the line has been read (if end of line characters are
    treated as tokens).


    TT_NUMBER means that a number token has been read.


    TT_WORD means that a word token has been read.


    # Methods of StreamTokenizer


    There are many methods in StreamTokenizer to set up the syntax tables. We''ll
    only mention two here. The first is resetSyntax(), which sets all characters to
    ordinary. The second is wordChars(), which gives a set of characters the alphabetic
    attribute.


    # StreamTokenizer: Example code


    This example is a simple one that shows the use of the StreamTokenizer. It breaks
    a file into words consisting of lower- or upper-case letters. When a word is found,
    nextToken() returns TT_EOF.


    If an ordinary character is found (in this case, anything not set as alphabetic),
    nextToken() returns the value of that character.


    # Example


    ```

    import java.io.*;

    import java.util.*;

    ```'
