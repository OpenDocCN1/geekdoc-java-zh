- img_proc: true
  md: 'There are two types of checksums. The most common is the CRC32, that''s Cycle
    Redundancy Check. Another type of checksum is the Adler32, used for computing
    Adler32 checksum. The Adler32 has a faster computation. It''s nearly as reliable
    as the CRC32.


    # Checksum methods


