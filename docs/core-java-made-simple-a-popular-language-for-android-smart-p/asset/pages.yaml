  md: '# 28.1 What is object serialization?


    Object serialization lets you take all the data attributes, write them out as
    an object, and read back in as an object. Object serialization is quite useful
    when you need to use object persistence. GUI builders of JavaBeans use serialization
    to store the attributes of a JavaBean so that it can be accessed or modified by
    others.


    You could actually use DataOutputStreams and DataInputStreams to write each attribute
    out individually, and then you could read them back in on the other end. But you
    want to deal with the entire object, not its individual attributes. You want to
    be able to simply store away an object or send it over a stream of objects. Object
    serialization takes the data members of an object and stores them away or retrieves
    them, or sends them over a stream.


    You have the ObjectInput interface, which extends the DataInput interface, and
    ObjectOutput interface, which extends DataOutput, so you are still going to have
    the methods readInt() and writeInt() and so forth. ObjectInputStream, which implements
    ObjectInput, is going to read what ObjectOutputStream produces.'
