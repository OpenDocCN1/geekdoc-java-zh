    # Flushing


    Both the PrintStream and PrintWriter classes employ flushing, which moves data
    from the internal buffers to the output stream. Flushing is employed in two ways:


    Automatic flushing, which says when you call println you get flushing


    Without automatic flushing, which says flushing occurs only when the flush() method
    is called.


    With the PrintStream class, if a new-line character was written, the output is
    flushed. With the PrintWriter class, if you enable automatic flushing, the output
    is flushed only when a println() method is invoked. The println() methods of PrintWriter
