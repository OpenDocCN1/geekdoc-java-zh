  md: '# 22.5 Storing data records


    A data record is a collection of more than one element, such as names or addresses.
    There are three ways to store data records:


    Use delimited records, such as a mail-merge style style record, to store values.
    On output, data values are converted to strings separated by delimiters such as
    the tab character, and ending with a new-line character. To read the data back
    into Java code, the entire line is read and then broken up using the StringTokenizer
    class.


    Use fixed size records to store data records. Use the RandomAccessFile class to
    store one or more records. Use the seek() method to find a particular record.
    If you choose this option to store data records, you must ensure strings are set
    to a fixed maximum size.


    Alternatively, you can use variable length records if you use an auxiliary file
    to store the lengths of each record. Use object streams to store data records.
    If object streams are used, no skipping around is permitted, and all objects are
    written to a file in a sequential manner.'
