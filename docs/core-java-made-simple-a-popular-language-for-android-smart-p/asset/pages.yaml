  md: '# 26.6 Inflating and deflating


    This section explores inflating and deflating in Java code. These terms\have the
    same meaning as compressing and uncompressing. Some of the

    key points in this section are:


    DeflaterInputStream and DeflaterOutputStream


    ZipInputStream and ZipOutputStream


    ZipFile


    # Deflater


    Let''s move into inflating territory. Deflating writes a compressed

    representation of bytes to an output stream. Inflating takes those

    compressed bytes from an input stream, reads them in, and automatically

    uncompresses them. This process is similar to zipping and unzipping on

    the fly.


    The algorithm of a Deflater is applied to the bytes output to a stream, and

    the corresponding algorithm of an Inflater is applied to the bytes input

    from a stream. The default Deflater and Inflater use the ZLIB compression

    library for compression and decompression. An alternate constructor

    allows for GZIP and PKZIP compression.'
