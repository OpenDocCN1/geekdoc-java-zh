    A number of classes were added to java to support atomic operations of reading
    and comparing variable and also modifying and writing variables. These additions
    were made to remove possibility of thread interference of non atomic operations
    such as incrementing primitive variables.


    AtomicInteger is one such class and has atomic operations incrementAndGet() and
    decrementAndGet(). Any concurrent execution of these methods will not result in
    thread interference. Methods of this class are in the form getAndXxx and xxxAndGet
    where xxx is the operation to be performed such as increment or decrement.


    When calling the getAndXxx type methods these return the previous value whereas
    when calling the xxxAndGet methods these perform the operation and then return
    the updated value.'
