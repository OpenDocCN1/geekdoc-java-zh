    # Sequences


    SequenceInputStream combines input streams and reads each input stream until the
    end. You can use SequenceInputStream to read two or three streams as if they were
    one stream. You can concatenate streams from various sources, such as two or more
    files. To construct a SequenceInputStream, you can specify either two streams
    or an Enumeration, which represents a set of input streams. A program such as
    “cat” in UNIX would use something like this.


    SequenceInputStream reads from the first underlying input stream that it is given.


    When the first one is exhausted, it opens the next input stream and reads that
    one. When that one is exhausted, it reads the next, and so on.


    The user does not know when the input is transferred from one stream to the next
    stream; another byte is simply read. When all the input streams have been read,
    an EOF is received from the entire input stream.'
