  md: '# DeflaterOutputStream


    Let''s journey into the output stream. You can simply create a DeflaterOutputStream
    with an output sink. As we write to the DeflaterOutputStream, the bytes are compressed
    using the Deflater algorithm and only the compressed bytes are sent to the underlying
    output stream. The default constructor for DeflaterOutputStream uses ZLIB compression
    with a default-sized buffer. With the other constructors, you can specify a different
    Deflater and a different-sized buffer.


    ![](img/0ba0276697a7bf420ad4269e7fc94740_828_0.png)


    # InflaterInputInputStream


    On the receiving side, an InflaterInputStream is implemented. When we construct
    it, we specify an input source. It uncompresses the bytes from that source as
    you go along. Once again, you can specify your own Inflater if you use a different
    compression scheme.


    If you decide to use your own Deflater or Inflater instead of the default, then
    it is up to you to make sure the Inflater and Deflater match and understand each
    other.'
