    # Note


    When you are creating the object of the class while processing the corresponding
    constructor internally JVM checks whether “this” or “super” statement is available
    or not.


    If any “this” statement is not available then it will process that constructor
    but if any “this” statement is available first it will try to process that constructor.
    After processing constructor it will come to the current class constructor.


    From a constructor when we are using this two statements then it will give error
    at compile time that in order to call the constructor “this” must be the first
    statement inside the constructor.'
