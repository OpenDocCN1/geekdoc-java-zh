  md: '# 28.2 How object serialization works


    If you want to use the ObjectInput and ObjectOutput interface, the class must
    be serializable. How is a class serializable?


    The serializable characteristic is assigned when a class is first defined. Your
    class must implement the Serializable interface. This marker interface says to
    the Java virtual machine that you want to allow this class to be serializable.
    You don''t have to add any additional methods or anything.


    There are a couple of other features of a serializable class. First, it has to
    have a zero parameter constructor. When you read the object, it needs to be able
    to construct and allocate memory for an object, and it is going to fill in that
    memory from what it it has read from the serial stream.


    The static fields, or class attributes, are not saved because they are not part
    of an object. If you do not want a data attribute to be serialized, you can make
    it transient. That would save on the amount of storage or transmission required
    to transmit an object.


    Using ObjectOutputStream: Example code


    A FileOutputStream is created using object.dat, which is going to be used to store
    away objects.'
