  md: 'Difference between instance method and static method


    | Instance Method | Static Method |

    | 1. The method which is directly defined inside a class without any static keyword.
    | 1. The method which is directly defined inside a class with static keyword.
    |

    | 2. Inside instance method we can access instance and static members of the class
    directly. | 2. Inside the static method you can only access the static members
    of the class directly. |

    | 3. Instance method can be accessed with the reference variable which contains
    corresponding class object reference. | 3. Static method can be accessed three
    different ways:

    with the reference variable which contains null

    a. Example h1=null;

    h1.m2();

    b. by with the reference variable which contains the corresponding class object
    reference

    c. directly by the name of the class Example Hello.m2(); |

    | 4. The variable defined inside any instance method will not be equivalent to
    instance variable. | 4. The variable defined inside any static method will not
    be equivalent to static variable. |


    NOTE:


    Instance and static both method of a class can be declared as “final”.


    Both methods have to be called explicitly in order to process, i.e., it will not
    be processed automatically by the blocks.'
