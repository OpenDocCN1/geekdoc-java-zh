  md: '# 22.4 Filtering


    Do you need filtering for your data? There are a couple ways to filter data.


    Buffering is one filtering method. Instead of going back to the operating system
    for each byte, you can use an object to provide a buffer.


    Checksumming is another filtering method. As you are reading or writing a stream,
    you might want to compute a checksum on it. A checksum is a value you can use
    later on to make sure the stream was transmitted properly.'
