  md: '# 26.2 Pushback


    You use PushbackInputStream to implement a one-byte pushback buffer or a pushback
    buffer of a specified length. It can be used to parse data. When would you use
    this?


    Sometimes when you read a byte from an InputStream, it signifies the start of
    a new block of data (for example, a new token). You might say, “I have read this
    byte, but I really cannot deal with it at this time. I want to push it back on
    the InputStream. When I come back later to read the InputStream, I want to get
    that same byte again.


    You push the byte back onto the stream with the unread() method. When you read
    it again, you will read the data you unread before. You can unread() a single
    byte, an array of bytes, or an array of bytes with an offset and a length.


    If you are reading characters, you can push back a character instead of a byte.
    You use PushbackReader, which works just like the PushbackInputStream.


    Use the unread() methods to unread a single character, an array of characters,
    or an array of characters with an offset and a length.


