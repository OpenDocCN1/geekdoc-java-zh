  md: '# 22.3 What to use


    There are a number of different questions to consider when dealing with the java.io
    package:


    What is your format: text or binary?


    Do you want random access capability?


    Are you dealing with objects or non-objects?


    What are your sources and sinks for data?


    Do you need to use filtering?


    # Text or binary


    What''s your format for storing or transmitting data? Will you be using text or
    binary data?


    If you use binary data, such as integers or doubles, then use the InputStream
    and OutputStream classes.


    If you are using text data, then the Reader and Writer classes are right.'
  merge: -1
  pgno: 759
- img_proc: true
  md: '# Random access


    Do you want random access to records? Random access allows you to go anywhere
    within a file and be able to treat the file as if it were a collection of records.


    The RandomAccessFile class permits random access. The data is stored in binary
    format. Using random access files improves performance and efficiency.


    # Object or non-object


    Are you inputting or outputting the attributes of an object? If the data itself
    is an object, then use the ObjectInputStream and ObjectOutputStream classes.


    # Sources and sinks for data


    What is the source of your data? What will be consuming your output data, that
    is, acting as a sink?


    You can input or output your data in a number of ways: sockets, files, strings,
    and arrays of characters. Any of these can be a source for an InputStream or Reader
    or a sink for an OutputStream or Writer.'
  merge: -1
