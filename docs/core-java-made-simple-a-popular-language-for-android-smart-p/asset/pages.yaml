  md: '# 14.1.3 java.lang.StringBufferclass


    StringBuffer is a class which is available inside java.lang package.It is a

    final class which cannot be extended to the subclasses. StringBuffer

    objects are mutable in nature, i.e., if you perform any concatenation

    or other operation it will modify in the source. Almost all the member of

    string is synchronized so it affects concurrency of the application.

    (Uses of the StringBuffer member affect the concurrency of the

    application). StringBuffer objects are eligible for serialization .

    StringBuffer does not uses any special memory location like String.

    Constant pool of String for the reusability of objects. String buffer use

    capacity concept in order to store the String (capacity=16) . StringBuffer

    object cannot be created without “new” operator.


    If the content change frequently then never recommended to go for String

    object because for every change will create a new object internally.


    To handle this type of requirement we should go for StringBuffer concept.


    The main advantage of StringBuffer over String is, all required changes

    will be performed in the existing object only instead of creating new

    object.(won''t create new object)


    StringBuffer does not use any SCP or any special memory location for the

    reability of string literals.'
