  md: '# 12.3 Inner class


    A class which is defined inside another class is called as inner class. There
    are mainly following types of inner class:


    Non static Inner class or Instance inner class


    Static Inner class


    Method Local inner class.


    Anonymous Inner class


    # Non static Inner Class


    A class which is defined inside another class without any static keyword is called
    as non-static Inner class.


    Inside non-static Inner class all the members of outer class can be accessed directly.
    You cannot have static declaration but static member of outer class can be accessed
    inside that.


    In order to access the members of inner class inside, you need to create the object
    of inner class and through that reference it can be accessed.'
