  md: '# Difference between instance block and static block:


    | Instance Block | Static Block |

    |---|---|

    | 1. A block which is directly defined inside any class without static keyword.
    | 1. A block which is directly defined inside any class with static keyword. |

    | 2. Inside the instance block we can access instance and static both the members
    of the class. | 2. Inside the static block, we can access only static members
    of the class directly. |

    | 3. The variable defined inside instance block will not be equivalent to instance
    variable. It will just be a local variable. | 3. The variable defined inside static
    block will not be equivalent to static variable. |

    | 4. Instance block will be processed only at the time of object creation. | 4.
    Static block will be processed at the time of class loading. |

    | 5. Instance block will be processed many times as object of the class is created.
    | 5. Static block will be processed only once that too at the time of class loading.
    |


    # NOTE


    Block which is defined inside any local context will not be equivalent to instance
    and static block. That will just be considered as local block.


    The block which is being defined inside any local context will be processed only
    when that corresponding context is being processed.


    Unlike methods, blocks will be processed automatically, i.e., you cannot call
    any block explicitly.


