  md: '# ## 9.1 What is Inheritance?


    It is the process of defining a new class from its existing class functionality.


    # ### Types of Inheritance


    +   1. Simple Inheritance


    In case of simple inheritance, there will be only one direct class and only one
    direct subclass.


    ![](img/0ba0276697a7bf420ad4269e7fc94740_275_0.png)


    # ### 2. Multilevel Inheritance


    In this case, there will be only one immediate super class but many indirect super
    and subclasses.'
