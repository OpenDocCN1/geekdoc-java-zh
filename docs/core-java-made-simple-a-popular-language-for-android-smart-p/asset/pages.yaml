    You can define method only directly inside class, i.e., you cannot define method
    inside any local context.


    There are mainly 2 types of methods:


    Instance Method/ Non-Static Method: The method that is directly defined inside
    a class without any ‘static’ keyword.


    # For Example


    ```

    class Hello{

    void m1(){

    //instance method

    }

    }

    ```


    Static Method: A method which is directly defined inside class with ‘static’ keyword.


