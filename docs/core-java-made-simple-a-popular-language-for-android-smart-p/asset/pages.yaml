    Type Casting is the process of converting one data type to the corresponding compatible
    destination data type. The type casting mainly can be written in two different
    types:


    Implicit type casting: When destination is larger than source showing in that
    case you need not to perform any type casting explicitly it will automatically
    being converted to the corresponding destination type.


    Syntax :


    ```

    Datatype variable_Name=(Datatype) variable_2;

    ```


    Explicit type casting: Explicit type casting are narrowing when destination data
    type is smaller than source then you need to perform the explicit type casting
    to corresponding destination type.


    Ex. byte b12 = (byte) i1;


