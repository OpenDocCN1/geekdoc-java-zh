  md: '# Contract between equals() method and hashCode() method:


    Two equivalent Object should be placed in the same bucket but all the object available
    in the same bucket many not be equals.


    Two equivalent Object: must have same hashCode() i.e h.equals(h2) is true the
    h1.hashCode()==h2.hashCode() should return true.


    If two objects are not equal by equals(..)method then there is no restriction
    on their hashCode, may be same or may not be same.


    If hashcode of two object are equals then these object may or may not equal by
    .equals method.


    If hashCode of two object are not equals then these object are always not equal
    by .equals method.


    To satisfy above contract between equals() method and hashCode() method whenever
    we are overriding equals() method compulsory we have to override hashCode method
    otherwise we won''t get any compile time error or runtime error but it is not
    a good programming practice.


