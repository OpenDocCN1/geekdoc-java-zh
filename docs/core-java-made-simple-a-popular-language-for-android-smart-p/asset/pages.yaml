    For eg: java.lang.IOException, FileNotFoundException, SQLException, JSPException.


    # UnChecked Exception or Runtime Exception


    The exceptions that are the sub class of java.lang.RuntimeException are called
    as Unchecked or runtime exceptions.


    These exceptions will be called by the JVM.


    It need not to be reported by writing try and catch or by propagating. Even if
    you want, you can handle it.


    Runtime exceptions are also of two types:


    User-defined: the exceptions that are being created by the developer according
    to the application requirementis called as user-defined exceptions. Eg: InsufficientFoundException,
    AccountNumberDoesNotExist.


    Built-in: the exceptions given by the technology vendors is called as built-in
    exception. These also can be of checked and unchecked types. Eg: ServletException,
