    worrying about a consumers abiity to consume the items at the same rate.


    ConcurrentMap defines methods to replace or remove a key-value pair if the key
    already exists or add a value if the key is not associated with a value.


    ConcurrentHashMap is a concrete implementation of the ConcurrentMap interface
    and is analogous to a concurrent version of the HashMap class. When accessing
    a HashMap using multiple threads it is possible to synchronize access to it however
    this has a performance impact as the entire object will be locked meaning read
    and write operations will all be blocked until the current operation is complete.


    The ConcurrentHashMap provides better performance by allowing multiple threads
    to read concurrently while limiting modification operations by multiple threads.


    Because ConcurrentHashMap allows multiple concurrent reads iterators do not throw
    a ConcurrentModificationException as the collection does not need to be locked
