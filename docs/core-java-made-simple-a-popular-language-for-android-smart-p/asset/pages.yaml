  md: '# 7.1 What is Constructor


    It is a special type of method with the name of class.


    Constructor’ s main task is to initialize instance variables of the class.

    Even we can initialize static variables but it is not recommendable.


    Constructor must not have any return type like in the case of methods (not even
    void).


    Constructors may or may not have any parameters.


    Constructors will be processed automatically at the time of object creation; you
    cannot call a constructor explicitly.


    If the constructor is having any return type then that will be treated as a normal
    method, i.e., it will be processed only when you are calling that or else it will
    not be processed automatically at the time of object creation.


    You can write more than one constructors but all that must be different on the
    following ways:


    Number of parameters


    Type of parameters'
