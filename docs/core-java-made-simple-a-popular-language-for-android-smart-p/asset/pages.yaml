- img_proc: true
  md: '# 1.2 Difference between C Programming and Java Programming


    ![](img/0ba0276697a7bf420ad4269e7fc94740_17_0.png)


    Fig 1.1: C Programming and Java Programming


    C program will be saved with .c extension. After successful compilation of ‘c’
    program native code or .exe file will be generated which is platform dependent
    and cannot be used on any other platform. This .exe file is platform dependent
    because compatibility issue related to corresponding platform compatibility will
    be added. When we are writing java program, it must be saved with java extension.
    After successful compilation of java program .class file will be generated which
    is known as byte code, and it will be platform independent despite corresponding
    platform JDK/JRE available.


    Q 1: Why in ‘C’ programming language native code is available as in java native
    code is not available?'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Ans: ‘C’ programming supports static loading which means if the corresponding
    member of program is required in further program then everything will not be loaded
    into the main memory as Java supports dynamic loading which means if any method
    is required then it will be allocated in main memory and it will get immediately
    destroy after the use.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.3 Important terms to remember


    Source Code: The program which is written by the developer (Human Readable Format).


    Byte Code: After successful compilation of java program byte code will be generated
    i.e. .class file, which is called as byte code. That byte code will be processed
    further while running the program.


    Java Compiler: It is a program with the name of javac.exe which is mainly responsible
    for checking the grammar of the program language. It will also generate .class
    file after the successful compilation of the program with the name of class.


    Interpreter: It is a program with the extension of java.exe. Interpreter is mainly
    responsible for generating byte code to the native code line by line. Converting
    byte code to native code is time consuming process. So in order to overcome this
    problem from java2 JIT complier has been introduced.


    JIT (Just In Time) Compiler: It is used to convert byte code to the native code
    at a time by adding corresponding platform compatibly.


    JVM (Java Virtual Machine): It provides platform independent execution environment.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Note: JVM itself is platform dependent. Byte Code is platform independent because
    of JVM available corresponding for that machine.


    JRE (Java Runtime Environment): It provides many JVM in order to run the program.
    It comes in different version associated with the corresponding JDK.


    JDK (Java Development Kit): It comes into different versions according to Sun
    Oracle released.


    JDK 1.2 (Playground)


    JDK 1.4 (Merline)


    JDK 1.5 (Tiger)


    JDK 1.6 (Mustang)


    JDK 1.7 (Dolphin)


    JDK 1.8 (Spider)


    Note: JDK consist of different types of tools JRE, JVM in order to develop the
    java application.


    Q 2: State whether following is True or False.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '‘C’ programs are platform independent. (False)


    Java programs are platform independent. (True)


    ‘C’ compiler is platform dependent. (True)


    Java Compiler is platform Independent. (False)


    JDK is platform Independent. (False)'
