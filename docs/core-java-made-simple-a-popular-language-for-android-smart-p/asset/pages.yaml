    Enclose that piece of code which you want to monitor, inside the try block


    Write the catch block associated with that try with the proper exception type.


    By using a catch you can handle only one exception at a time.


    You can write multiple catch associated with a try to handle the multiple types
    of exceptions.


    While writing multiple try and catch remember the following points


    There should not be any statement between try and catch.


    There should not be any statement between catch and catch.


    You can write try without catch but you cannot write catch without any try.


    When you are writing the catch blocks, the catch parameter should be sub to super
    type. It cannot have parameter from super to sub type.


