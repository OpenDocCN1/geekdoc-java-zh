  md: '# 18.19 Queue


    Queue is child interface of Collection.


    If we want to represent a group of individual objects prior (happening before
    something else) to processing then we should go for Queue interface.


    Usually Queue follows first in first out(FIFO) order but based on our requirement
    we can implement our own order also.


    From 1.5v onwards LinkedList also implements Queue interface.


    LinkedList based implementation of Queue always follows first in first out order.


    Assume we have to send sms for one lakh mobile numbers, before sending messages
    we have to store all mobile numbers into Queue so that for the first inserted
    number first message will be triggered(FIFO).


