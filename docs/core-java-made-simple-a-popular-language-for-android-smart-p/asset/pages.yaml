  md: 'immediately Calling method tryLock() on a lock object immediately returns a
    boolean defining whether or not it is possible to lock an object.


    Threads that acquire explicit locks will never deadlock which is in contrast to
    threads that acquire implicit locks which can at times deadlock.


    When finished with a locked resource a call to the unlock() method releases the
    lock on that object.


    If we don''t want to wait any longer than a specified time we can call the tryLock()
    method with arguments to specify how long we want to wait before giving up on
    trying to acquire a lock. We pass two arguments to this method, a long value representing
    the value of time and a TimeUnit object.


    It is also possible to declare that a thread can be interrupted while waiting
    for a lock. The lockInterruptibly() method will attempt to acquire a lock on an
    object unless it is interrupted at which point an InterruptedException is thrown.


    Implicit locks cannot span multiple blocks of code, locks are released at the
    end of the synchronized block. Explicit lock objects however can span multiple
    methods.


    ReadWriteLock interface maintains a pair of locks, one for reading that can be
    acquired by multiple threads provided there are no writing operations ongoing
    and a write lock that can only be acquired by a single thread at a time. To acquire
    a read lock a call to readLock() has to be made. The writeLock() method must be
    called to acquire a write lock.'
