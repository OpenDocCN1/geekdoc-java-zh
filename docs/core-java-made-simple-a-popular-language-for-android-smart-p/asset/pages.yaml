  md: 'When a thread is moving to waiting state then some points you should remember:


    Wait(): When a thread is available in Running state and wait() is being called
    on that to that thread will move to the wait state.


    Wait(): When you are calling wait without parameter, then thread will move waiting
    state for the unspecified amount of time until the time you are not calling notify()
    or notifyAll().


    Wait(long): Then that running thread will move to the wait state for the specified
    amount of time and once the specified time duration is completed then automatically
    thread will move to the ready run state. But in case if you want to move the waiting
    thread to ready to run state before completing that time duration then you can
    notify that thread to ready to run state.


    Wait(long, int): When you are calling method (long, int) millisecond and nanosecond
    and by adding duration the resultant amount of time it will wait in the waiting
    state and after completing the time duration automatically it will move to the
    ready to run state.


