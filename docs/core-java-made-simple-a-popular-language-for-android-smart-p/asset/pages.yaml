    # Appropriate and inappropriate use of assertions


    It is always inappropriate to mix programming logic with assert statements, because
    there is no guaranty for the execution of assert statement always at runtime.


    For validating public method arguments usage of assertions is always inappropriate,
    because outside person is not aware whether assertions are enabled or disabled
    in our local system. While perform debugging if any place where the control is
    not allow to reach then that is the best place to use assertions.


    It is always inappropriate to use assertions for validating public method arguments.


    It is always appropriate to use assertions for validating private method arguments.'
