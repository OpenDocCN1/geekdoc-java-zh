  md: '# 19.3 Bounded Types


    We can bound the type parameter for a particular range using extends keyword such
    types are called bounded types.


    If x is a class then the type parameter we can pass either x or its child classes.
    If x is an interface then as the type parameter we can pass either x or its Implementation
    classes.


    But implements keyword purpose we can replace with extends keyword.


    As the type parameter we can use any valid java identifier but it convention to
    use T always.


    We can pass any no of type parameters need not be one. HashMap h=new HashMap();
    We can define bounded types even in combination also.


    As the type parameter we can pass any type which extends Number class and implements
    Runnable interface.


    We can''t extend more than one class at a time.'
