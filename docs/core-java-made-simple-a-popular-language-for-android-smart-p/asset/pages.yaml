  md: '# 22.6 Exceptions


    Almost every input or output method throws an exception. Therefore, any time you
    do I/O, you need to catch exceptions. There is a large hierarchy of I/O exceptions
    derived from IOException. Typically you can just catch IOException, which catches
    all the derived exceptions. However, some exceptions thrown by I/O methods are
    not in the IOException hierarchy. One such exception is the java.util.zip.DataFormatException.
    This exception is thrown when invalid or corrupt data is found while data being
    read from a zip file is being uncompressed. java.util.zip.DataFormatException
    has to be caught explicitly because it is not in the IOException hierarchy.


    Remember, exceptions in Java code are thrown when something unexpected happens.


