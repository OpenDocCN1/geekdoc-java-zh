  md: '| Process Based | Thread Based |

    | 1) Process is a program and if multiple process or being done or process at
    the same time then utilize the separate memory location and separate resources
    also. | 1) Thread is the unit of a program in a process multiple threads that
    might be running & which all leads to the competition of a process by sharing
    the same memory location as well as the resource. |

    | 2) A process may or may not be implemented in a same program so all way utilizes
    different recourses could be quiet expensive. | 2) In case of thread execution,
    it is not expensive as like process. |

    | 3) | 3) |

    | 4) In case of process based multitasking context switching is quiet difficult.
