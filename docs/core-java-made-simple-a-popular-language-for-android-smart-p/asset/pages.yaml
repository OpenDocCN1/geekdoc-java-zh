  md: '# 26.3 Checksumming


    This section explores checksumming. Checksum is an interface that several different
    classes implement. Let''s take a look at what this section covers:


    What is a checksum and how does it work?


    What is a message digest and how does it work?


    Checksum versus message digest


    # What is checksumming?


    What''s a checksum? The Checksum interface defines the methods required to compute
    a checksum on a set of data. The computation of a checksum is such that if a single
    bit or two bits in the data are changed, the value for the checksum changes.


    A checksum is computed based on the bytes of data supplied to the update() method.
    The update() method updates the current checksum with an array of bytes by adding
    it to an ultimate value.


    Additionally, the current value of the checksum can be obtained at any time with
    the getValue() method. Use the reset() method to reset the default value to its
    initial value, usually 0.'
