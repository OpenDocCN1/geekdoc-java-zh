  md: '# 27.1 What is Data I/O?


    Several classes implement the DataInput and DataOutput interfaces. Let''s talk
    about how they work.


    The primitive data types, such as ints, may be represented differently on the
    various platforms that Java code runs on. For example, an int may be represented
    with the most significant byte first (called Big Endian), as on an IBM mainframe,
    or with the least significant byte first (called Little Endian), as on an IBM
    PC. If you wrote an int in binary form with a C program on one platform and tried
    to read it in on the other platform, the values would not agree.


    That''s where DataInput and DataOutput come in. Now you can take a primitive,
    like an int, and write it out. It is written in a platform-independent form. You
    can read that back in any other Java virtual machine and and, regardless of where
    it was produced, it will turned back into an int of the proper value.


    All the primitives, such as doubles, ints, shorts, longs, and so forth, can be
    written in a system platform-independent manner using the methods in DataOutput.
    Likewise, they can be read using the methods in DataInput.'
