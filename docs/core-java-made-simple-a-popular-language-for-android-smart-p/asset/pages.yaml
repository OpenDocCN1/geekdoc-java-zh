  md: '# 8.2 JVM


    JVM is the Part of JRE. It is Responsible to Load and Run Java Applications. This


    Process will be continued for Every Method. Once if any Method Count Reaches Threshold
    (The Starting Point for a New State) Value, then JIT Compiler Identifies that
    Method Repeatedly used Method (HOT SPOT).


    Immediately JIT Compiler Compiles that Method and Generates the corresponding
    Native code. Next Time JVM Come Across Method Call then JVM Directly Use Native
    Code Executes it Instead of interpreting Once Again. So that Performance of the
    System will be Improved. The Threshold Count Value varied from JVM to JVM. Some
    Advanced JIT Compilers will Re-compile generated Native Code if Count Reaches
    Threshold Value Second Time, So that More optimized Machine Code will be generated.
    Profiler which is the Part of JIT Compiler is Responsible to Identify HOT SPOTS.


    Note


    JVM Interprets Total Program Line by Line at least Once.


    JIT Compilation is Applicable Only for Repeatedly invoked Methods. But Not for
    Every Method.


    # Java Native Interface (JNI)'
