    of times based on some specific condition. There are mainly following types of
    looping control statement.


    +   1. for Loop


    For is used to iterate the loop for the specified number of times based on some
    specific condition.


    ```

    Syntax: for(initialization; condition; Increment/ Decrement )

    {

    Statement;

    }

    ```


    Processing of for loop: In processing of for loop first initialization will be
    done then the condition check or condition will be evaluated if its satisfied
    that it returns true, the statement enclosed inside loop will be processed and
    then increment or decrement will be done. Then again it evaluates the condition
    if it returns true then this process will continue until the conditional part
    does not return false.


