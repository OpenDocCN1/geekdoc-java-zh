  md: '# 17.1 What is Multitasking?


    Performance or executing more than one task at the same time is called as multitasking.


    Note: As of now there is no machine or processors which can perform more than
    one task at the same time but the time duration required to complete the task
    is very less, which we will not be able to analyse whether the task being done
    at the same time or different time.


    There are mainly two types of multitasking


    +   1 )Process based multitasking.


    +   2 )Thread based multitasking.'
