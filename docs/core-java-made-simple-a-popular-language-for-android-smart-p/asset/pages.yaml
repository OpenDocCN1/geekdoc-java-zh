  md: '# 9.4 Composition vs Aggregation


    # Composition


    Without existing container object if there is no chance of existing contained
    objects then the relationship between container object and contained object is
    called composition which is a strong association.


    # Aggregation


    Without existing container object if there is a chance of existing contained objects
    such type of relationship is called aggregation. In aggregation objects have weak
    association.


    # Note


    In composition container, contained objects are strongly associated, but container
    object holds contained objects directly


    But in Aggregation container and contained objects are weakly associated and container
    object just now holds the reference of contained objects.


    # Static control flow parent to child relationship'
