  md: '# 6.1 Introduction


    There are mainly four types of OOPs concept:


    # 1. Abstraction


    Abstraction is the process of defining properties and operations of an entity.
    Here properties relate to variables, operations relate to methods and entity relates
    to class.


    For Example Consider a mobile phone. There is one green and one red button. Green
    one is there to receive the calls and red one is there to disconnect the calls.
    End users just know this only and they do not have to worry about what all internal
    processes have been applied in order to provide that functionality. NOTE: Abstraction
    is a design level concept that is not having any equivalent programming implementation.


    # 2. Encapsulation


    Encapsulation is the process of defining properties and operations for an entity.
    In other words encapsulating all the variable methods inside a class is called
    encapsulation. Defining methods and variables with the proper access modifier
    in a class is called encapsulation.'
