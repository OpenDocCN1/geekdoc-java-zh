  md: 'call unlike the Runnable interface its method for the return of a value and
    the ability to throw a checked exception.


    In addition the Callable interface is a parameterised interface and the type argument
    defines the type of values that can be returned from the call() method.


    If the call method is not required to return a value we can define the type argument
    to be Void.


    Callable objects cannot be passed to a thread for execution in the same way a
    Runnable object can so we use the ExecutorService interface when executing Callable
    objects.


    The ExecutorService defines methods to manage progress and termination of tasks.
    Single Runnable or Callable objects can be submitted to the ExecutorService with
    Future objects being returned. Mulipute Runnable objects can be submitted with
    Future objects being returned. There are also methods for shutting down the ExecutorService
    and allowing or disallowing submitted tasks to be completed.


    Thread pools allow for the creation of a pool of reusable threads of a predefined
    size to execute tasks concurrently.


    The fork/join framework was added to Java 7 to support hardware parallelism. Its
    purpose is to split larger tasks into smaller tasks that can be executed in parallel
    and once complete merge the results of the individual tasks.'
