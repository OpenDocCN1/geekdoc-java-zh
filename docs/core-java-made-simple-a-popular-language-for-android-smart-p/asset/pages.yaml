  md: '# 32.1 The java.util.concurrent


    Package contains a number of concurrent collection classes that serve the purpose
    of removing memory. inconsistency. Java does this by defining a happens-before
    relationship between an operation that add items to a collection and any operations
    that attempt to read or remove that item from the collection.


    A number of classes are added to the collections framework by java.util.concurrent
    package. The additional collection classes are:


    BlockingQueue: FIFO queue, blocks or times out when adding to a full queue or
    retrieving from an empty queue.


    ConcurrentMap: Subinterface of java.util.Map that includes a number of additional
    atomic operations.


    ConcurrentNavigableMap: Subinterface of ConcurrentMap that supports approximate
    matches.


    BlockingQueue is safe to use with multiple threads and defines an initial capacity
    which cannot be changed. Items can be added and removed from the queue but once
    the queue has filled up its capacity it will block attempts to add any new elements.
    In addition the queue will block any attempt to remove items from a queue.'
