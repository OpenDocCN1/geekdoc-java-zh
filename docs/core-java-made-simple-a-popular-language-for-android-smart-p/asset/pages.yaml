  md: 'The StringTokenizerhasMoreTokens() returns true if there are more tokens. If
    it is true, we are going to call nextToken(). This returns a String, and s will
    have the value abc in the first time around the while loop. We come around the
    loop a second time and hasMoreTokens() is still true. Now when we get the next
    token, def is the value of the string that is returned. Go around the loop a third
    time and hasMoreTokens() is still true; ghi is returned.


    Now go around the loop one more time and hasMoreTokens() is false. At this point,
    we drop out of the loop. So we have broken up the string without too much effort.


    # Example


    ```

