  md: '# 33.1 Introduction


    Executor framework in Java seperate out submissions of tasks and execution of
    those tasks. Tasks can be created from the Runnable and Callable interfaces.


    ExecutorService extends Executor and adds a number of methods to manage the lifecycle
    of tasks being executed and the executors executing those tasks.


    SheduleExecutorService extends ExecutorService and supports periodic execution
    or future execution of tasks. The Future class represents the state of asynchronous
    tasks and from this class there are a number of operations to query the state
    and cancel Future objects.


    The Executors class defines a number of utility and factory methods for the above
    interfaces.


    When implementing the Executor interface only one method - execute() needs to
    be implemented. With this method we can determine how we want to execute Runnable
    (interface Runnable) tasks including order of task execution, number of tasks
    that can be executed concurrently and the number of tasks that can be queued.


    The Callable interface differs from the Runnable interface only in the signature
    of its method, firstly the sole method of this interface is called'
