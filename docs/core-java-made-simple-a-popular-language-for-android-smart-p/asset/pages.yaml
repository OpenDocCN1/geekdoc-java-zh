  md: '# 8.5 Local Variable


    The variable which is defined inside any local context is called as local variable
    or the variable which is defined inside any method, constructor, blocks, etc are
    also called as local variables. Any local variables cannot be declared as “static”.
    Local variables will not be initialized automatically or internally by the JVM.
    Developer has to initialize that explicitly before the use or else it will give
    the compile time error.


    Local variables can be accessed only within context where it has been declared.
    It cannot be accessed outside that local context. In a same context you cannot
    have two local variables with the same name. Memory for the local variable will
    be allocated only when that corresponding context is being processed and immediately
    after processing that local context memory for the local variable which is defined
    inside any local context (instance or static context) will not be equivalent to
    instance or static variable.'
