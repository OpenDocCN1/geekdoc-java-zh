  md: '# 8.7 Assertions


    The most common way of debugging is uses of sops. But the main disadvantage of
    sops is after fixing the bug, we should delete extra added sops otherwise these
    sops also will be executed at runtime which impacts performance of the system
    and disturbs logging mechanism.


    To overcome these problems people introduced assertions concept in 1.4 versions.
    The main advantage of assertions over sops is based on our requirement we can
    enable or disable assertions and by default assertions are disable hence after
    fixing the bug it is not required to delete assert statements explicitly.


    Hence, the main objective of assertions is to perform debugging. Usually we can
    perform debugging either in development environment or Test environment but not
    in production environment hence concept is applicable for the development and
    test environments but not for the production.


    # Assert as keyword and identifier


    assert keyword is introduced in 1.4 version hence from 1.4 version onwards we
    can''t use assert as identifier but until 1.3 we can use assert as an identifier.


    # Example'
