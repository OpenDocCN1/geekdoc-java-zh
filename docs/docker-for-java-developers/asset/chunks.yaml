  trans: "\n基础工作已经就绪，让我们开始探索将 [Docker](https://www.docker.com/) 集成到典型的 [Gradle](https://gradle.org/)\
    \ 构建中需要满足什么条件。对于本小节，你需要在开发机器上安装 [Gradle](https://gradle.org/) `4.3` 版本。如果你还没有安装，请遵循[安装说明](https://gradle.org/install/)\
    \ 并选择你偏好的任何建议方法。\n\n为了使用 [Gradle](https://gradle.org/) 将一个典型的 [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ 应用打包为 [Docker](https://www.docker.com/) 镜像，我们只需要在 `build.gradle` 文件中包含两个额外的插件：\n\
    \n* [Spring Boot Gradle](https://spring.io/blog/2017/04/05/spring-boot-s-new-gradle-plugin)\
    \ 插件\n* [Palantir Docker Gradle](https://github.com/palantir/gradle-docker) 插件（也有许多[可选替代方案](https://plugins.gradle.org/search?term=docker)）\n\
    \n构建流水线基本上依赖于 [Spring Boot Gradle](https://spring.io/blog/2017/04/05/spring-boot-s-new-gradle-plugin)\
    \ 插件来产生 [uber-jar](https://stackoverflow.com/questions/11947037/what-is-an-uber-jar)该术语通常用于描述生成单个可运行应用程序\
    \ JAR 存档的技术），随后将由 [Palantir Docker Gradle](https://github.com/palantir/gradle-docker)\
    \ 用于组装 [Docker](https://www.docker.com/) 镜像。以下是构建定义 `build.gradle` 文件的内容。\n\n\
    ```gradle\n01 | buildscript {\n02 | repositories {\n03 | maven { url 'https://repo.spring.io/libs-milestone'\
    \ }\n04 | }\n05 | \n06 | dependencies {\n07 | classpath \"org.springframework.boot:spring-boot-gradle-plugin:2.0.0.M6\"\
    \n08 | }\n09 | }\n10 | \n11 | plugins {\n12 | id 'com.palantir.docker' version\
    \ '0.13.0'\n13 | }\n14 | \n15 | apply plugin: \"org.springframework.boot\"\n16\
    \ | apply plugin: 'java'\n17 | apply plugin: 'eclipse'\n18 | apply plugin: 'application'\n\
    19 | \n20 | sourceCompatibility = 1.8\n21 | targetCompatibility = 1.8\n22 | \n\
    23 | dependencies {\n24 | compile(\"org.flywaydb:flyway-core:4.2.0\")\n25 | compile(\"\
    org.springframework.boot:spring-boot-starter-webflux:2.0.0.M6\")\n26 | compile(\"\
    org.springframework.boot:spring-boot-starter-data-jpa:2.0.0.M6\")\n27 | compile(\"\
    org.springframework.boot:spring-boot-starter-actuator:2.0.0.M6\")\n28 | compile(\"\
    mysql:mysql-connector-java:8.0.7-dmr\")\n29 | }\n30 | \n31 | repositories {\n\
    32 | maven {\n33 | mavenCentral()\n34 | url 'https://repo.spring.io/libs-milestone'\n\
    35 | }\n36 | }\n37 | \n38 | springBoot {\n39 | mainClassName = \"com.javacodegeeks.spring.AppStarter\"\
    \n40 | }\n41 | \n42 | jar {\n43 | mainClassName = \"com.javacodegeeks.spring.AppStarter\"\
    \n44 | baseName = 'spring-boot-webapp '\n45 | version = project.version\n46 |\
    \ }\n47 | \n48 | bootJar {\n49 | baseName = 'spring-boot-webapp '\n50 | version\
    \ = project.version\n51 | }\n52 | \n53 | docker {\n54 | name \"jcg/spring-boot-webapp:$project.version\"\
    \n55 | tags 'latest'\n56 | dependsOn build\n57 | files bootJar\n58 | dockerfile\
    \ file('src/main/docker/Dockerfile')\n59 | buildArgs([BUILD_VERSION: project.version])\n\
    60 | }\n```\n\n这实际上非常简单，所有的核心内容基本上都在 `build.gradle` 文件的 `docker` 部分。你可能还会注意到我们正在使用自己的\
    \ [Dockerfile](https://docs.docker.com/engine/reference/builder/)，`src/main/docker/Dockerfile`\
    \ 来提供指令。\n\n```dockerfile\n01 FROM openjdk:8-alpine\n02 ARG BUILD_VERSION\n03\
    \ ENV DB_HOST\n04 ENV DB_PORT\n05 ADD spring-boot-webapp-${BUILD_VERSION}.jar\n\
    06 EXPOSE 19900\n07 ENTRYPOINT exec $JAVA_OPTS -Ddb.host=$DB_HOST -Ddb.port=$DB_PORT\
    \ -jar spring-webapp.jar\n```\n\n确实，简单到如此了。请注意使用 `ENV` (https://docs.docker.com/engine/reference/builder/#env)\
    \ 来传递 `ARG` (https://github.com/palantir/gradle-docker/issues/149) 在 `build.gradle`\
    \ 文件中。太棒了，接下来是什么？嗯，我们只需要触发 [Gradle](https://gradle.org/) 构建，例如：\n\n```bash\n>\
    \ gradle docker\n```\n\n构建成功，耗时 12 秒，执行了 14 个。\n\n让我们检查本地是否有该镜像。\n\n```bash\n\
    > docker image ls\nREPOSITORY              TAG             IMAGE ID       CREATED\
    \          SIZE\njcg/spring-boot-webapp  0.1-SNAPSHOT   65057cae9ba   21 seconds\
    \ ago   133MB\n<none>                  latest          ...             ...\n```\n\
    \n很好，新镜像有了。可以使用 [docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ 命令行工具立即运行，但首先我们需要在某处有一个可用的 MySQL 容器。幸运我们这样做了很多，这不会难倒我们。\n\n```bash\n> docker\
    \ run --rm -d \\\n--name mysql \\\n-e MYSQL_ROOT_PASSWORD='p$ssw0rd' \\\n-e MYSQL_DATABASE=my_app_db\
    \ \\\n-e MYSQL_ROOT_HOST=% \\\nmysql:8.0.2\n```\n\n现在我们准备好以 [Docker](https://www.docker.com/)\
    \ 容器运行我们的应用程序了。我们有多种方法可以引用 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 容器，其中[自定义网络](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)\
    \ 是首选方案。对于像我们这样的简单情况，我们可以通过将运行中的 MySQL 容器的 IP 地址分配给环境变量 `DB_HOST` 来引用它，例如：\n\n\
    ```bash\n> docker run -d --rm \\\n--name spring-boot-webapp \\\n-p 19900:19900\
    \ \\\n```\n"
- fmt: "\n| `4` | ``-e DB_HOST=`docker inspect --```format` `'{{ .NetworkSettings.IPAddress\
    \ }}'` ``mysql` \\`` |\n| `5` | `jcg/spring-boot-webapp:0.0.1-SNAPSHOT` |\n\n\
    By mapping the port `19900` from the container to the host, we could talk to our\
    \ application by accessing its [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ from [curl](https://curl.haxx.se/) using the `localhost` as the host name. Let\
    \ us do that right away.\n\n```bash\n$ curl -X POST http://localhost:19900/tasks\
    \ \\\n-d '[{\"title\": \"Task #1\", \"description\": \"Sample Task\"}]' \\\n-H\
    \ \"Content-Type: application/json\" \\\n[\n{\n  \"id\":1,\n  \"title\":\"Task\
    \ #1\",\n  \"description\":\"Sample Task\"\n}\n]\n```\n\n```bash\n$ curl http://localhost:19900/tasks\n\
    [\n{\n  \"id\":1,\n  \"title\":\"Task #1\",\n  \"description\":\"Sample Task\"\
    \n}\n]\n```\n\n```bash\n$ curl http://localhost:19900/tasks/1\n{\n  \"id\":1,\n\
    \  \"title\":\"Task #1\",\n  \"description\":\"Sample Task\"\n}\n```\n\nThere\
    \ are many moving parts under the hood like, for example, automatic database migrations\
    \ using [Flyway](https://flywaydb.org/) and out of the box health checks support\
    \ using [Spring Boot Actuator](https://docs.spring.io/spring-boot/docs/2.0.0.M5/reference/html/production-ready-endpoints.html).\
    \ Some of them are going to pop up in the upcoming sections of the tutorial but\
    \ look how simple and natural it is to build and package your [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ applications as [Docker](https://www.docker.com/) images using [Gradle](https://gradle.org/).\n\
    \n## 4. Gradle on Docker\n\nIt turns out that building [Docker](https://www.docker.com/)\
    \ images with [Gradle](https://gradle.org/) is not painful at all. But still,\
    \ the prerequisite to have [Gradle](https://gradle.org/) installed on the target\
    \ system, along with JDK/JRE, requires some preliminary work to be done. It may\
    \ not be an issue let say for development, as it is very likely you would have\
    \ all of that (and many more) installed anyway.\n\nIn the case of cloud deployments\
    \ or CI/CD pipelines, this could be an issue though, incurring additional costs\
    \ in terms of work or/and maintenance. Could we somehow find a way to get rid\
    \ of such overhead and rely on [Docker](https://www.docker.com/) entirely? Yes,\
    \ in fact we can, by adopting [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/),\
    \ one of the recent additions to the [Docker](https://www.docker.com/) feature\
    \ set.\n\nIf you are wondering how it may help us, here is the idea. Essentially,\
    \ we are going to follow the regular procedure to build the image from the [Dockerfile](https://docs.docker.com/engine/reference/builder/).\
    \ But the [Dockerfile](https://docs.docker.com/engine/reference/builder/) would\
    \ actually contain two image definitions. The first one (based on the one of the\
    \ [official Gradle images](https://hub.docker.com/_/gradle/)) instructs the [Docker](https://www.docker.com/)\
    \ to run the [Gradle](https://gradle.org/) build of our [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application. The second one would pick the binaries produced by the first image\
    \ and create the final [Docker](https://www.docker.com/) image with our [Spring\
    \ Boot](https://projects.spring.io/spring-boot/) application sealed inside (much\
    \ like we have done before).\n\nIt might be better to see it once than trying\
    \ to explain it. The `Dockerfile.build` file below illustrates this idea in action,\
    \ using [multi-stage build](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)\
    \ instructions.\n\n```dockerfile\nFROM gradle:4.3.0-jdk-alpine\nADD src\nADD build.gradle\
    \ .\nADD gradle.properties .\nRUN gradle build\nFROM openjdk:8-jdk-alpine\nARG\
    \ BUILD_VERSION\nENV DB_HOST localhost\nENV DB_PORT 3306\nCOPY --from=0 /home/gradle/libs/spring-boot-webapp-${BUILD_VERSION}.jar\
    \ spring-boot-webapp.jar\nEXPOSE 19900\nENTRYPOINT exec $JAVA_OPTS -Ddb.host=$DB_HOST\
    \ -Ddb.port=$DB_PORT -jar /spring-boot-webapp.jar\n```\n\nThe first part of the\
    \ [Dockerfile](https://docs.docker.com/engine/reference/builder/) describes the\
    \ image based on `gradle:4.3.0-jdk-alpine`. Because our project is quite small,\
    \ we just copy all sources inside the image and run `gradle build` (this command\
    \ will be executed by [Docker](https://www.docker.com/) while the image is being\
    \ built). The result of the build would be the [uber-jar](https://stackoverflow.com/questions/1194703/what-is-an-uber-jar)\
    \ which we feed into another image, this time based on `openjdk:8-alpine`. This\
    \ would constitute our final image, which we could produce using [docker](https://docs.docker.com/engine/reference/cli/)\
    \ command line tool.\n\n```bash\ndocker image build --build-arg BUILD_VERSION=0.1-SNAPSHOT\
    \ -f Dockerfile.build -t jcg/spring-boot-webapp:latest -t jcg/spring-boot-webapp:0.1-SNAPSHOT\
    \ .\n```\n\nUpon command, we should see our newly baked image in the list of the\
    \ available [Docker](https://www.docker.com/) images.\n\n```bash\n$ docker image\
    \ ls\nREPOSITORY            TAG             IMAGE ID       CREATED           SIZE\n\
    jcg/spring-boot-webapp  0.1-SNAPSHOT   02ab724da64   10 seconds ago   133MB\n\
    jcg/spring-boot-webapp  latest         02ab724da64   10 seconds ago   133MB\n\
    ```\n\nThere is lot potential behind [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/),\
    \ but even for such a simple application as ours they have proven to be worth\
    \ the attention.\n\n## 5. Maven and Docker\n\nLet us switch gears a bit and look\
    \ at how [Apache Maven](https://maven.apache.org/) rides the build management\
    \ for [Dropwizard](http://www.dropwizard.io/) applications. For this subsection\
    \ you would need to have [Apache Maven](https://maven.apache.org/) `3.2.5` installed\
    \ on your development machine (however if you already have [Apache Maven](https://maven.apache.org/)\
    \ `3.2.1` or higher, you may just stick to it).\n\nThe steps we have to follow\
    \ are mostly identical to what we have discussed for [Gradle](https://gradle.org/)\
    \ builds, the changes are essentially only in the plugins to use:\n\n*   [Maven\
    \ Shade](https://maven.apache.org/plugins/maven-shade-plugin/) plugin\n*   [Spotify\
    \ Docker Maven](https://github.com/spotify/docker-maven-plugin) plugin\n\nThe\
    \ [Maven Shade](https://maven.apache.org/plugins/maven-shade-plugin/) plugin produces\
    \ an [uber-jar](https://stackoverflow.com/questions/1194703/what-is-an-uber-jar)\
    \ which will be later used by [Spotify Docker Maven](https://github.com/spotify/docker-maven-plugin)\
    \ plugin to build [Docker](https://www.docker.com/) image. Without any fuss, let\
    \ us take a look at the `pom.xml` file.\n\n```xml\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>code.geeks</groupId>\n  <artifactId>dropwizard-webapp</artifactId>\n\
    \  <version>0.1-SNAPSHOT</version>\n  <packaging>jar</packaging>\n  <properties>\n\
    \    <project.sourceEncoding>UTF-8</project.sourceEncoding>\n  </properties>\n\
    \  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>io.dropwizard</groupId>\n\
    \        <artifactId>dropwizard-bom</artifactId>\n        <version>1.2.0</version>\n\
    \        <type>pom</type>\n        <scope>import</scope>\n      </dependency>\n\
    \    </dependencies>\n  </dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>io.dropwizard</groupId>\n      <artifactId>dropwizard-core</artifactId>\n\
    \    </dependency>\n    <dependency>\n      <groupId>io.dropwizard</groupId>\n\
    \      <artifactId>dropwizard-hibernate</artifactId>\n    </dependency>\n    <dependency>\n\
    \      <groupId>mysql</groupId>\n      <artifactId>mysql-connector-java</artifactId>\n\
    \      <version>8.0.7-dm</version>\n    </dependency>\n    <dependency>\n    \
    \  <groupId>io.dropwizard.modules</groupId>\n      <artifactId>dropwizard-flyway</artifactId>\n\
    \      <version>1.2.0-1</version>\n    </dependency>\n    <dependency>\n     \
    \ <groupId>com.google.guava</groupId>\n      <artifactId>guava</artifactId>\n\
    \    </dependency>\n    <dependency>\n      <groupId>junit</groupId>\n      <artifactId>junit</artifactId>\n\
    \      <scope>test</scope>\n    </dependency>\n  </dependencies>\n  <build>\n\
    \    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.1</version>\n\
    \        <configuration>\n          <source>8</source>\n          <target>8</target>\n\
    \        </configuration>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-jar-plugin</artifactId>\n        <version>3.0.2</version>\n\
    \        <configuration>\n          <archive>\n            <manifest>\n      \
    \        <mainClass>code.geeks.docker.AllApi</mainClass>\n            </manifest>\n\
    \          </archive>\n        </configuration>\n      </plugin>\n      <plugin>\n\
    \        <groupId>org.apache.maven.plugins</groupId>\n        <artifactId>maven-shade-plugin</artifactId>\n\
    \        <version>3.1.0</version>\n        <configuration>\n          <executions>\n\
    \            <execution>\n              <phase>package</phase>\n             \
    \ <goals>\n                <goal>shade</goal>\n              </goals>\n      \
    \        <configuration>\n                <transformers>\n                  <transformer\
    \ implementation=\"org.apache.maven.plugins.shade.resource.ServicesResourceTransformer\"\
    />\n                  <transformer implementation=\"org.apache.maven.plugins.shade.resource.ManifestResourceTransformer\"\
    >\n                    <mainClass>com.javacgeeks.dw.AppStarter</mainClass>\n \
    \                 </transformer>\n                </transformers>\n          \
    \    </configuration>\n            </execution>\n          </executions>\n   \
    \     </configuration>\n      </plugin>\n      <plugin>\n        <groupId>com.spotify</groupId>\n\
    \        <artifactId>docker-maven-plugin</artifactId>\n        <version>1.0.0</version>\n\
    \        <configuration>\n          <imageName>jcg/dropwizard-webapp:${project.version}</imageName>\n\
    \          <dockerDirectory>src/main/docker</dockerDirectory>\n          <resources>\n\
    \            <resource>\n              <targetPath>/</targetPath>\n          \
    \    <directory>${project.build.directory}</directory>\n              <include>${project.build.finalName}.jar</include>\n\
    \            </resource>\n            <resource>\n              <targetPath>/</targetPath>\n\
    \              <directory>${directory}</directory>\n              <include>application.yml</include>\n\
    \            </resource>\n          </resources>\n          <buildArgs>\n    \
    \        <BUILD_VERSION>${project.version}</BUILD_VERSION>\n          </buildArgs>\n\
    \          <imageTags>\n            <tag>latest</tag>\n          </imageTags>\n\
    \        </configuration>\n      </plugin>\n    </plugins>\n  </build>\n</project>\n\
    ```\n\nTo be fair, it looks considerably more verbose than [Gradle] build, but\
    \ if we imagine for second that all [XML] tags are gone, we would end up with\
    \ mostly identical definition, at least in case of [Docker] plugins. The [Dockerfile](https://docs.docker.com/engine/reference/builder/#entrypoint)\
    \ is a bit different though:\n\n```dockerfile\nFROM openjdk:8-jdk-alpine\nARG\
    \ BUILD_VERSION\nENV DB_HOST localhost\nENV DB_PORT 3306\nADD dropwizard-webapp-${BUILD_VERSION}.jar\
    \ dropwizard-webapp.jar\nADD application.yml application.yml\nADD docker-entrypoint.sh\
    \ docker-entrypoint.sh\nRUN chmod +x /docker-entrypoint.sh\nEXPOSE 19900 19901\n\
    ENTRYPOINT [\"/docker-entrypoint.sh\"]\n```\n\nDue to the specifics of [Dropwizard](http://www.dropwizard.io/)\
    \ application, we have to bundle the configuration file, in our case `application.yml`,\
    \ with application. Instead of exposing just one port `19900`, we have to expose\
    \ another one, `19901`, for administrative tasks. Last but not least, we provide\
    \ the script to the `ENTRYPOINT` instruction, the `docker-entrypoint.sh`.\n\n\
    ```bash\n#!/bin/sh\nset -e\njava $JAVA_OPTS -Ddb.host=$DB_HOST -Ddb.port=$DB_PORT\
    \ -jar /dropwizard-webapp.jar db migrate application.yml\nif [ ! $? -ne 0 ]; then\n\
    \  exec $JAVA_OPTS -Ddb.host=$DB_HOST -Ddb.port=$DB_PORT -jar /dropwizard-webapp.jar\
    \ server application.yml\nfi\nexec \"$@\"\n```\n\nThe reason for adding a bit\
    \ of complexity here is because by default the [Dropwizard Flyway](https://github.com/dropwizard/dropwizard-flyway)\
    \ addon bundle does not perform automatic database schema migrations. We could\
    \ workaround that but the cleanest way is to run `db migrate` command before starting\
    \ the [Dropwizard](http://www.dropwizard.io/) application. This is exactly what\
    \ we do inside the shell script above. Now, it is time to trigger the build!\n\
    \n```bash\n> mvn clean package docker:build\n...\nSuccessfully tagged jcg/dropwizard-webapp:0.1-SNAPSHOT\n\
    [INFO] Built jcg/dropwizard-webapp:0.1-SNAPSHOT\n[INFO] Tagging jcg/dropwizard-webapp:0.1-SNAPSHOT\
    \ with latest\n[INFO] ---------------------------------------------------------\n\
    [INFO] BUILD SUCCESS\n[INFO] ---------------------------------------------------------\n\
    ...\n```\n\nLet us see if we have our image available locally.\n\n```bash\n> docker\
    \ image ls\nREPOSITORY            TAG             IMAGE ID       CREATED     \
    \      SIZE\njcg/dropwizard-webapp  0.1-SNAPSHOT   02ab724da64   10 seconds ago\
    \   133MB\njcg/dropwizard-webapp  latest         02ab724da64   10 seconds ago\
    \   133MB\n```\n\nExcellent, assuming the [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ container is up and running (this part does not change at all, we could use\
    \ the same command from the [previous section](#BuildOnDocker_gradle)), we could\
    \ just run our [Dropwizard](http://www.dropwizard.io/) application container.\n\
    \n```bash\ndocker run -d --rm \\\n--name dropwizard-webapp \\\n-p 19900:19900\
    \ \\\n-p 19901:19901 \\\n-e DB_HOST=`docker inspect --format` '{{ .NetworkSettings.IPAddress\
    \ }}'` mysql`\n```\n"
