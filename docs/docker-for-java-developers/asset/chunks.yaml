    Often while we are developing our applications there is a need to get more insights\
    \ regarding what is going on with our containers, either we are talking about\
    \ CPU, memory or network utilization. Luckily, there are quite a few options here\
    \ and one of the very useful tools we are going to talk about is [cAdvisor](https://github.com/google/cadvisor)\
    \ (or in full version, container advisor) which analyzes the resource usage and\
    \ performance characteristics of running containers.\n\n> [cAdvisor](https://github.com/google/cadvisor)\
    \ provides container users an understanding of the resource usage and performance\
    \ characteristics of their running containers. It is a running daemon that collects,\
    \ aggregates, processes, and exports information about running containers. Specifically,\
    \ for each container it keeps resource isolation parameters, historical resource\
    \ usage, histograms of complete historical resource usage and network statistics.\
    \ This data is exported by container and machine-wide. – [https://github.com/google/cadvisor](https://github.com/google/cadvisor)\n\
    \nInterestingly, [cAdvisor](https://github.com/google/cadvisor) goes beyond just\
    \ [Docker](https://www.docker.com/) and should support just about any other container\
    \ type out of the box. Sadly for Windows users, [cAdvisor](https://github.com/google/cadvisor)\
    \ has [limited support](https://github.com/google/cadvisor/issues/1394) on this\
    \ platform. The best way to give the [cAdvisor](https://github.com/google/cadvisor)\
    \ a try is, for sure, to run it as [Docker](https://www.docker.com/) container.\n\
    \n```bash\nsudo docker run \\\n--volume=/:/rootfs:ro \\\n--volume=/var/run:/var/run:rw\
    \ \\\n--volume=/sys:/sys:ro \\\n--volume=/var/lib/docker/:/var/lib/docker:ro \\\
    \n--volume=/dev/disk/:/dev/disk:ro \\\n--publish=8080:8080 \\\n--detach=true \\\
    \n--name=cadvisor \\\ngoogle/cadvisor:latest\n```\n\nOnce the container is up\
    \ and running, you can access [cAdvisor](https://github.com/google/cadvisor) web\
    \ UI at [http://localhost:8080](http://localhost:8080) (or, in case you are using\
    \ non-native [Docker](https://www.docker.com/) installation, `http://<docker-machine>:8080`).\n\
