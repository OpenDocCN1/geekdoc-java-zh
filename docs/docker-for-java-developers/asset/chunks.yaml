    \ | `post {` |\n| 46 | `always {` |\n| 47 | `archiveArtifacts artifacts:'build/libs/*.jar',\
    \ fingerprint:true` |\n| 48 | `}` |\n| 49 | `}` |\n| 50 | `}`\n```\n\nWhat is\
    \ Jenkins? For many, the relationship with [Jenkins](https://jenkins.io/) falls\
