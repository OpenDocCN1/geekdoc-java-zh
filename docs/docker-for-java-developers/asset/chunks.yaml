    Each instruction in a [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    creates a new layer so at the end each image has a list of immutable layers, stacked
    on top of each other, that represent the filesystem differences.


    In the upcoming sections we will be writing quite a lot of different [Dockerfile](https://docs.docker.com/engine/reference/builder/)s,
    closely following the [best practices and recommendations](https://docs.docker.com/userguide/eng-image/dockerfile_best-practices/).


    ### 3.3. Containers


    When you have your images ready, it is time to bring them to live. Here is where
    the containers appear on the stage: they are runnable instances of the images.
    You can run as many of them as your want, assuming the target host (where [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    is installed) has enough resources. All of that is feasible because the containers
    are well isolated from each other, at least by default (however you have quite
    a lot of options to control that).


    When [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) creates an
    instance of the `container`, it also `adds a new writable layer` on top of the
    underlying stack of image layers, often called the `container layer`. All the
    changes which are made to the running container (such as creating, deleting or
    modifying files for example) are written to this thin layer.


    It is important to think about containers as ephemeral: when a container is terminated
    (stopped and removed), any changes to its state disappear (unless they are stored
    in persistent storage).


    As of now, [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) internally
    uses its own image format and heavily relies on [libcontainer](https://github.com/opencontainers/runc/tree/master/libcontainer)
    and [runc](https://github.com/opencontainers/runc) for spawning and running the
    containers.


    ### 3.4. Registries


    The purpose of the registries in [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    architecture is to store images so they could be shared and used as the base ones.
    [Docker Hub](https://hub.docker.com/) and [Docker Cloud](https://cloud.docker.com/)
    are the well-known public registries that anyone can use. To keep things simple,
    [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) is configured to
    look for images on [Docker Hub](https://hub.docker.com/) by default.


    You may also consider the option to host your own private [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    registry (or registries). There are a lot of good reasons to do that, particularly
    in the world of enterprises. One of the most crucial ones is security as the public
    images do not undergo through comprehensive security audit and may have known
    [security vulnerabilities or exposures](http://dl.acm.org/citation.cfm?id=3029832).
    However, the things are getting better as more and more companies maintain so
    called [official repositories](https://docs.docker.com/docker-hub/official_repos/),
    which are curated and adhere to higher standards.


    To make things even more intriguing, the new player has joined the game of registries
    recently. The flagship [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    product, [Docker Store](https://docs.docker.com/docker-store/), has been announced
    to become generally available.


    ### 3.5. Image is the new RPM


    With the [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) and other
    container engines becoming more and more popular and widespread, the way we used
    to package and distribute the application is also changing dramatically. Literally,
    the image becomes a “new RPM” in a sense that you could distribute it to any platform
    where the container engine of your choice is supported (more on that later) and
    just run it as a container. It is indeed easy, simple and powerful.


    ## 4. Moby: The Future of Docker


    [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) has been seeing
    a lot of changes recently. Driven by initiatives to break [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    into modular components and consolidate all of its open source collaborations,
    the [Moby Project](https://mobyproject.org/) was born.


    > The Moby Project is a new open-source project to advance the software containerization
    movement and help the ecosystem take containers mainstream. It provides a library
    of components, a framework for assembling them into custom container-based systems
    and a place for all container enthusiasts to experiment and exchange ideas. –
    [https://blog.docker.com/2017/04/introducing-the-moby-project/](https://blog.docker.com/2017/04/introducing-the-moby-project/)


    As [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) continues to
    be split up into more components, the [Moby Project](https://mobyproject.org/)
    will become the home for those components as well, so let us keep an eye on it
    and look forward to exciting announcements.


    ## 5. Towards Interoperability


    With multiple application-centric container engines available at the moment, namely
    [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) and [rkt](https://coreos.com/rkt)
    (and very likely to appear), the obvious question to ask would be: how to pick
    one?


    Indeed, at the moment if you select one container engine over the other, you would
    probably have to stick to it as the move to alternative may proven difficult.
    But there is a hope, thanks to [Open Container Initiative](https://www.opencontainers.org/)
    (or just `OCI`), that container engines interoperability would improve significantly,
    with enough players supporting the common specifications.


    We have mentioned earlier that at the moment [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    uses own image format. To our luck, the important milestone towards openness in
    this space has been achieved recently with the first release of [OCI Runtime and
    Image specifications](https://blog.docker.com/2017/07/oci-release-of-v1-0-runtime-and-image-specifications/).


    ## 6. Docker and Java


    There have been a lot of discussions lately regarding any legal consequences or
    licensing considerations while using [Java](https://www.java.com/en/) inside the
    containers. The official [Oracle](https://www.oracle.com/index.html) position
    on the matter is nicely summarized in the Q&A section:


    > Are there any licensing considerations for Oracle Java SE that are unique to
    Docker?


    > No. Docker is a containerization platform and there are no unique or special
    restrictions in the license for use or redistribution as compared to any operating
    system, virtualization or packaging format. The Oracle JDK is widely used and
    adopted in the Docker ecosystem. – [https://blogs.docker.com/developers/official-docker-image-for-oracle-java-and-the-openjdk-roadmap-for-containers/](https://blogs.docker.com/developers/official-docker-image-for-oracle-java-and-the-openjdk-roadmap-for-containers/)


    Although the answer is referring to [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    only, it is equally applicable to other container-based virtualization engines
    as well.


    To prove the point, [Oracle](https://www.oracle.com/index.html) has published
    the official [Oracle Java 8 SE (Server JRE)](https://store.docker.com/images/oracle-serverjre-8)
    image into the [Docker Store](https://store.docker.com/), one of the places to
    find the trusted commercial and free software distributed as [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    Images.

