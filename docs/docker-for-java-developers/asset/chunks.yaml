    安装情况，为项目选择合适的工具可能是一个挑战。


    然而，能力越大，责任越大。[Docker](https://www.docker.com/) 并不是万灵药，请始终记住[测试金字塔](https://martinfowler.com/bliki/TestPyramid.html)，并尝试找到最适合你的平衡。


