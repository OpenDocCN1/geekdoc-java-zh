  raw: 'For many, the relationship with [Jenkins](https://jenkins.io/) falls into
    hate or love category. Leaving the history behind, the second generation of [Jenkins](https://jenkins.io/)
    platform, namely `2.x` release branch, hit the ecosystem like a tornado and literally
    became a game changer.


    To make a point, here are the key features of [Jenkins](https://jenkins.io/) which
    are distinguishing it from many other competing solutions:


    *   Built-in support for delivery pipelines (also known as “pipeline as a code”)


    *   Improved UI and usability


    *   Very easy to install and configure


    *   Exceptional extensibility and very rich plugins ecosystem


    *   Distributed deployment


    *   Automation


    To illustrate most of them in action, we are going to put what we have learned
    about [Docker](https://www.docker.com/) so far at work and build our own [Jenkins](https://jenkins.io/)
    image. Not only that, we would integrate it with [Git](https://git-scm.com/) (using
    tremendously popular [Github](https://github.com/) hosting), configure the tooling,
    create multibranch pipeline for our [Spring Boot](https://projects.spring.io/spring-boot/)
    application we have [developed previously](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html).
    And, last but not least, we are going to do all that in a completely automated
    fashion. If it sounds exciting, let us get started.


    ## 3\. Pipeline as a code


    One of the recent trends in the industry is to treat your continuous delivery
    pipelines as a code, storing them in the source control system and versioning
    if necessarily. If you are looking to introduce something like that into your
    projects, [Jenkins](https://jenkins.io/) is a perfect match, no doubts.


    There are multiple favors of pipeline configurations which [Jenkins](https://jenkins.io/)
    supports out of the box. The one we are going to use in this part of the tutorial
    is to keep the pipeline definition, [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/),
    along with your project, in the root of the repository tree.


    As you [may remember](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html),
    our [Spring Boot](https://projects.spring.io/spring-boot/) application requires
    [Java](https://www.java.com/en/) and is using [Gradle](https://gradle.org/) for
    dependency management. Keeping that in mind, here is an example we could come
    up with as a simple pipeline to build such a project in [Jenkins](https://jenkins.io/).


    | `01` | `pipeline {` |


    | `02` | `agent any` |


    | `03` |   |


    | `04` | `options {` |


    | `05` | `disableConcurrentBuilds()` |


    | `06` | `buildDiscarder(logRotator(numToKeepStr:``''5''``))` |


    | `07` | `}` |


    | `08` |   |


    | `09` | `triggers {` |


    | `10` | `pollSCM(``''H/15 * * * *''``)` |


    | `11` | `}` |


    | `12` |   |


    | `13` | `tools {` |


    | `14` | `jdk` `"jdk-8u162"` |


    | `15` | `}` |


    | `16` |   |


    | `17` | `environment {` |


    | `18` | `JAVA_HOME=``"${jdk}"` |


    | `19` | `}` |


    | `20` |   |


    | `21` | `stages {` |


    | `22` | `stage(``''Cleanup before build''``) {` |


    | `23` | `steps {` |


    | `24` | `cleanWs()` |


    | `25` | `}` |


    | `26` | `}` |


    | `27` |   |


    | `28` | `stage(``''Checkout from Github''``) {` |


    | `29` | `steps {` |


    | `30` | `checkout scm` |


    | `31` | `}` |


    | `32` | `}` |


    | `33` |   |


    | `34` | `stage(``''Build''``) {` |


    | `35` | `steps {` |


    | `36` | `script {` |


    | `37` | `def rtGradle = Artifactory.newGradleBuild()` |


    | `38` | `rtGradle.tool =` `"Gradle 4.3.0"` |


    | `39` | `rtGradle.run buildFile:` `''build.gradle''``, tasks:` `''clean build''`
    |


    | `40` | `}` |


    | `41` | `}` |


    | `42` | `}` |


    | `43` | `}` |


    | `44` |   |


    | `45` | `post {` |


    | `46` | `always {` |


    | `47` |  `archiveArtifacts artifacts:` `''build/libs/*.jar''` `, fingerprint:`
    `true` |


    | `48` |  `}` |


    | `49` |  `}` |


    | `50` | `}` |


    I hope you would agree, it is surprisingly very clean and expressive. The only
    thing we need to do is co-locate this definition with the project in question.


    If you would like to see our [Jenkins](https://jenkins.io/) deployment in action,
    at this time it would be good to create a new [Github](https://github.com/) (or
    [Bitbucket](https://bitbucket.org/‎), [Gitlab](https://bitbucket.org/‎), …) repository
    with [Spring Boot](https://projects.spring.io/spring-boot/) application inside.


    ## 4\. Jenkins and Docker


    To our luck, [Jenkins](https://jenkins.io/) maintains the official [Docker](https://www.docker.com/)
    images [repository](https://hub.docker.com/r/jenkins/jenkins/), so it becomes
    very easy to integrate and extend it for your needs. As of now, the latest long-term
    support version of [Jenkins](https://jenkins.io/) is `2.89.4` and this is what
    we are going to use in this part of the tutorial.


    What is interesting, [Jenkins](https://jenkins.io/) also has a comprehensive [Docker](https://www.docker.com/)
    support (as part of the pipeline declarations and the job definitions) and we
    are going to look at it as well.


    With the [official images](https://hub.docker.com/r/jenkins/jenkins/) available
    out of the box, it is simple to build your own image by extending one of those,
    for example.


    | `1` | `FROM jenkins/jenkins:lts` |


    Good start but it would be great to preinstall some plugins which we think would
    be useful to us. It is straightforward to do with the `install-plugins.sh` script
    already provided.


    | `1` | `RUN /usr/``local``/bin/``install``-plugins.sh docker-plugin docker-slaves
    workflow-scm-step workflow-cps  pipeline-model-definition docker-workflow cloudbees-folder
    timestamper workflow-aggregator git gradle pipeline-maven artifactory maven-plugin`
    `ssh``-slaves build-timeout pipeline-stage-view  antisamy-markup-formatter mailer
    matrix-auth junit findbugs maven-invoker-plugin pipeline-build-step credentials
    ws-cleanup email-ext ldap pam-auth subversion blueocean credentials-binding` |


    There are quite a lot of the plugins listed here, to be honest, but this is just
    a tiny piece of what is available. The [plugins ecosystem](https://plugins.jenkins.io/)
    around [Jenkins](https://jenkins.io/) is just astonishing. At this point we would
    need to generate a key pair to use with [Github](https://github.com/) (or [Bitbucket](https://bitbucket.org/‎),
    [Gitlab](https://bitbucket.org/‎), …) repository.


    | `1` | `ssh``-keygen -t rsa -C jenkins@javacodegeeks.com` |


    And copy this key pair to our image:


    | `1` | `COPY github/id_rsa /var/jenkins_home/.ssh/` |


    | `2` | `COPY github/id_rsa.pub /var/jenkins_home/.ssh/` |


    Moving on, we would certainly aim to run [Jenkins](https://jenkins.io/) using
    secure protocol, [HTTPS](https://en.wikipedia.org/wiki/HTTPS), so we would have
    to generate a self-signed certificate along with the private key.


    | `1` | `openssl req  -x509  -sha256  -newkey rsa:2048  -keyout jenkins.key  -out
    jenkins.crt  -days 1024  -nodes` |


    | `2` | `openssl rsa -in jenkins.key -out jenkins.rsa` |


    Let us add the generated files to the image as well:


    | `1` | `COPY jenkins/jenkins.crt /var/lib/jenkins/cert` |


    | `2` | `COPY jenkins/jenkins.rsa /var/lib/jenkins/pk` |


    Awesome, we are pretty much done with the environment part. Let us finalize it
    with a couple of environment variables.


    | `1` | `ENV JENKINS_SLAVE_AGENT_PORT 50001` |


    | `2` | `ENV JAVA_OPTS -Djenkins.install.runSetupWizard=false` |


    | `3` | `ENV JENKINS_OPTS --httpPort=-1 --httpsPort=8083 --httpsCertificate=/var/lib/jenkins/cert
    --httpsPrivateKey=/var/lib/jenkins/pk` |


    To keep things simple, it would be great to pre-configure the administrative account
    so we could login right away with known to us credentials.


    | `1` | `ENV JENKINS_USER admin` |


    | `2` | `ENV JENKINS_PASS ef8a7543087c4b999cbecdd57696f557` |


    Also, it would be good to know the URL to connect to Git-compatible repository
    and fetch the project we are going to build.


    | `1` | `ENV GIT_URL` `"<Git URL to repo>"` |'
