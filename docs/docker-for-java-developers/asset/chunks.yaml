    \ | `\"total\"`: 19195224064 |\n| `17` | `},` |\n| `18` | `\"status\"`: `\"UP\"\
    ` |\n| `19` | `}` |\n| `20` | `},` |\n| `21` | `\"status\"`: `\"UP\"` |\n| `22`\
    \ | `}` |\n\nIt looks exactly what we expected. To conclude, [Docker Engine](https://docs.docker.com/engine/)\
    \ in [swarm mode](https://docs.docker.com/engine/swarm/) in an interesting option\
    \ to consider however it is worth to mention that it is not as popular as [Kubernetes](https://kubernetes.io/)\
    \ or [Apache Mesos](http://mesos.apache.org/).\n\n## 6. Containers in the Cloud\n\
    \nEvery major player in the cloud space is rushing to the market their own managed\
    \ offerings which intend to support the deployment and orchestration of the containers\
    \ so you could just drop one and magic happens. Let us quickly glance through\
    \ them.\n\n### 6.1. Amazon Elastic Container Service\n\n[Amazon Elastic Container\
    \ Service](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)\
    \ (or simply [Amazon ECS](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html))\
    \ is a managed service that makes it easy to run, stop, and manage containers.\
    \ It also eliminates the burden of ongoing operations by provisioning, upgrading,\
    \ and scaling resources.\n\n* Identity and Access Management\n* Auto Scaling\n\
    * Load Balancing\n* Container Registry\n* CloudFormation\n\n### 6.2. Google Kubernetes\
    \ Engine\n\n[Google Kubernetes Engine](https://cloud.google.com/kubernetes-engine)\
    \ (formerly known as Google Container Engine) is a managed environment for deploying\
    \ applications. Google has been running workloads in containers for a very long\
    \ time, and incorporated the best of what they learnt into:\n\n* Identity & Access\
    \ Management\n* Hybrid Networking\n* Security and Compliance\n* Integrated Logging\
    \ & Monitoring\n* Auto Scale\n* Auto Upgrade\n* Auto Repair\n* Resource Limits\n\
    * Stateful Application Support\n* Images Support\n* Fully Managed\n* Built for\
    \ Containers\n* Private Registry\n* Fast Consistent Builds\n* Open Source Portability\n\
    \n### 6.3. Azure Container Service\n\n[Azure Container Service](https://azure.microsoft.com/en-ca/services/container-service/)\
    \ (AKS) manages the hosted [Kubernetes](https://kubernetes.io) environment, making\
    \ it quick and easy to deploy and manage applications without container expertise.\
    \ It provides:\n\n* Automated upgrades and patching\n* Easy cluster scaling\n\
    * Self-healing hosted control plane (masters)\n* Pay only for running agent nodes\n\
    \n## 7. Conclusions\n\nIn this section of the tutorial we have looked at a number\
    \ of leading cluster management and orchestration solutions which offer a comprehensive\
    \ support of the containerized applications. By and large, [Kubernetes](https://kubernetes.io)\
    \ is taking a lead here, however every option has own pros and cons.\n\n## 8.\
    \ What’s next\n\nIn the next, the final part of the tutorial we are going to talk\
    \ about very important subject of continuous integration practices and how [Docker](https://www.docker.com/)\
    \ fits into the picture there.\n\n# Continuous Integration on Docker \n\n## 1.\
    \ Introduction \n\nAlong this tutorial we have seen how [Docker](https://www.docker.com/)\
    \ penetrated into every aspect of the typical [Java](https://www.java.com/en/)\
    \ application lifecycle: build, development, testing and deployment. In this part\
    \ we are going to focus on the one of the increasingly important topics of continuous\
    \ integration.\n\nAlthough the market of the continuous integration (and continuous\
    \ delivery) solutions is overcrowded, for better or worse, there is one product\
    \ which stands still for years and is very close to the heart of every [Java](https://www.java.com/en/)\
    \ developer out there. Yes, your guess is right, it is [Jenkins](https://jenkins.io/).\n\
    \n## 2. Why Jenkins?\n"
