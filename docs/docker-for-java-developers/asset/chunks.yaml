  raw: 'Often while we are developing our applications there is a need to get more
    insights regarding what is going on with our containers, either we are talking
    about CPU, memory or network utilization. Luckily, there are quite a few options
    here and one of the very useful tools we are going to talk about is [cAdvisor](https://github.com/google/cadvisor)
    (or in full version, container advisor) which analyzes the resource usage and
    performance characteristics of running containers.


    > “[*cAdvisor*](https://github.com/google/cadvisor) *provides container users
    an understanding of the resource usage and performance characteristics of their
    running containers. It is a running daemon that collects, aggregates, processes,
    and exports information about running containers. Specifically, for each container
    it keeps resource isolation parameters, historical resource usage, histograms
    of complete historical resource usage and network statistics. This data is exported
    by container and machine-wide.*” – [https://github.com/google/cadvisor](https://github.com/google/cadvisor)


    Interestingly, [cAdvisor](https://github.com/google/cadvisor) goes beyond just
    [Docker](https://www.docker.com/) and should support just about any other container
    type out of the box. Sadly for Windows users, [cAdvisor](https://github.com/google/cadvisor)
    has [limited support](https://github.com/google/cadvisor/issues/1394) on this
    platform. The best way to give the [cAdvisor](https://github.com/google/cadvisor)
    a try is, for sure, to run it as [Docker](https://www.docker.com/) container.


    | `01` | `sudo` `docker run \` |


    | `02` | `--volume=/:/rootfs:ro \` |


    | `03` | `--volume=/var/run:/var/run:rw \` |


    | `04` | `--volume=/sys:/sys:ro \` |


    | `05` | `--volume=/var/lib/docker/:/var/lib/docker:ro \` |


    | `06` | `--volume=/dev/disk/:/dev/disk:ro \` |


    | `07` | `--publish=8080:8080 \` |


    | `08` | `--detach=``true` `\` |


    | `09` | `--name=cadvisor \` |


    | `10` | `google/cadvisor:latest` |


    Once the container is up and running, you can access [cAdvisor](https://github.com/google/cadvisor)
    web UI at [http://localhost:8080](http://localhost:8080) (or, in case you are
    using non-native [Docker](https://www.docker.com/) installation, `http://<docker-machine>:8080`).


    [![cAdvisor](images/cadvisor-jcg-1024x803.png)](http:../images/cadvisor-jcg.png)


    cAdvisor


    The web UI is quite simple but exceptionally informative. There are a lot of details
    collected about resources and processes of each running [Docker](https://www.docker.com/)
    container as well as about the [Docker](https://www.docker.com/) host machine
    itself (CPU, memory, network, storage, …). By all means, it is invaluable tool
    to learn how your containers consume and manage the resources at runtime.


    ### 5.3\. ctop


    And last, but not least, we are going to wrap up with [ctop](https://ctop.sh)
    tool which, in a [top](https://linux.die.net/man/1/top)-like interface, provides
    a concise and condensed overview of real-time metrics for multiple containers.


    ![ctop](images/ctop-jcg-1024x214.png)


    ctop


    Not only [ctop](https://ctop.sh) has a summary view, it also supports the option
    to select and focus on any individual container as well.


    ### 5.4\. And a lot more …


    The [Docker](https://www.docker.com/) tooling space is really thriving, with new
    interesting projects popping up literally every day. We have just covered a couple
    of well-known, mature and useful tools but there are a lot more to discover, so
    please watch this space closely if you are interested.


    ## 6\. Docker Engine Metrics


    [Docker](https://www.docker.com/) engine exposes a lot of interesting metrics
    in the format which is fully compatible with [Prometheus](https://prometheus.io/),
    tremendously popular open-source monitoring and alerting solution. Although this
    feature became generally available quite a while ago, not many people know about
    it and as such, not many make use of it.


    This feature is still considered experimental so it is not available by default
    and needs a bit of configuration tweaking. The [official documentation](https://docs.docker.com/engine/admin/prometheus/)
    thoroughly describes all the necessary steps to be done with respect to the operating
    system you are running [Docker](https://www.docker.com/) on. But essentially,
    the first step is to modify `daemon.json` and add the following properties there.


    | `1` | `{` |


    | `2` | `"metrics-addr"` `:` `"localhost:9323"``,` |


    | `3` | `"experimental"` `:` `true` |


    | `4` | `}` |


    In order for this change to take effect, the [Docker](https://www.docker.com/)
    daemon should be restarted. Right after, the metrics should become available at
    the [http://localhost:9323/metrics](http://localhost:9323/metrics) endpoint. Next
    step is to prepare [Prometheus](https://prometheus.io/) configuration, `prometheus.yml`,
    in order to scrape the [Docker](https://www.docker.com/) engine metrics.


    | `1` | `scrape_configs:` |


    | `2` | `- job_name:` `''prometheus''` |


    | `3` | `static_configs:` |


    | `4` | `- targets: [``''localhost:9090''``]` |


    | `5` | `- job_name:` `''docker''` |


    | `6` | `static_configs:` |


    | `7` | `- targets: [``''localhost:9323''``]` |


    With this minimal configuration in hand we could start the [Prometheus](https://prometheus.io/)
    server (which has reached version `2.0` as of moment of this writing) as [Docker](https://www.docker.com/)
    container:


    | `1` | `docker run -p 9090:9090 \` |


    | `2` | `-``v` `prometheus.yml:/etc/prometheus/prometheus.yml \` |


    | `3` | `prom/Prometheus` |


    Once the container is started, the [Prometheus](https://prometheus.io/) web UI
    should be available at [http://localhost:9090](http://localhost:9090). Let us
    navigate to this URL and check that all targets we have configured are accessible.


    [![Prometheus Targets](images/prometheus-jcg-1024x367.png)](http:../images/prometheus-jcg.png)


    Prometheus Targets


    Fairly speaking, the [Prometheus](https://prometheus.io/) web UI is quite capable
    to graph different metrics but [Grafana](https://grafana.com/), another open-source
    project, is the state of the art platform to query, visualize, alert on and understand
    the metrics.


    | `1` | `docker run -d -p 3000:3000 \` |


    | `2` | `-e` `"GF_SECURITY_ADMIN_PASSWORD=pa$$w0rd"` `\` |


    | `3` | `grafana/grafana` |


    [Grafana](https://grafana.com/) has a huge list of prebuilt dashboards and one
    of them, the [Docker Engine Metrics](https://grafana.com/dashboards/1229) dashboard,
    is exactly what we are looking for. Here is the sneak peek on how it shows up
    (beautiful, indeed).


    [![Grafana Docker Engine Dashboard](images/grafana-jcg-1024x752.png)](http:../images/grafana-jcg.png)


    Grafana Docker Engine Dashboard


    It may not look very meaningful at first glance but you are free to modify it
    or even build your own, choosing just the [Docker](https://www.docker.com/) engine
    metrics you are interested in.


    ## 7\. Conclusions


    In this section of the tutorial we have talked about how developer’s best friends,
    the [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s,
    keep abreast of the times by providing extensive [Docker](https://www.docker.com/)
    tooling and support. Beyond just that, we have also mentioned a couple of very
    useful tools for managing and monitoring your containers and [Docker](https://www.docker.com/)
    engine itself.


    ## 8\. What’s next


    In the next section of the tutorial we are going to talk about using [Docker](https://www.docker.com/)
    for testing, particularly in context of doing integration and end-to-end tests
    of our Java applications.


    Docker for Java Developers


    # Test on Docker


    ## 1\. Introduction


    If we think about the areas of software engineering where the impact of the [Docker](https://www.docker.com/)
    and container-based virtualization is most noticeable, testing and test automation
    is certainly one of those. As the software systems become more and more complex,
    so do the software stacks they are built upon, with many moving parts involved.'
