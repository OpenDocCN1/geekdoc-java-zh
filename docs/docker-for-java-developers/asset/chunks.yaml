    ## 6\. Arquillian


    Next one in the list is [Arquillian](http://arquillian.org/)*,* an innovative
    and highly extensible testing platform for the JVM that enables developers to
    easily create automated integration, functional and acceptance tests for Java
    middleware. [Arquillian](http://arquillian.org/) is indeed more a testing platform
    than framework, where [Docker](https://www.docker.com/) support is just one of
    many options available.


    Let us take a look on how the same test case we have seen in the previous section
    may look like when translated to [Arquillian Cube](http:/arquillian.org/arquillian-cube/),
    an [Arquillian](http://arquillian.org/) extension that can be used to manager
