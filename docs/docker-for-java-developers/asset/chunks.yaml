  trans: "\n\n[Docker](https://www.docker.com/) 中[用户定义网络](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)\
    \ 的重要性怎么都不强调，它们在容器相互通信中起着至关重要的作用。难怪，[Networks API](https://docs.docker.com/engine/api/v1.30/#tag/Network)\
    \ 得到了 [Spotify Docker Client](https://github.com/spotify/docker-client) 几乎完整的支持。\n\
    \n创建一个新网络只需一步操作：\n\n```java\nfinal NetworkCreation network = client.createNetwork(\n\
    \    NetworkConfig\n        .builder()\n        .name(\"test-network\")\n    \
    \    .driver(\"bridge\")\n        .build()\n);\n```\n\n如果你知道网络的标识符，可以获取它的元数据：\n\
    \n```java\nfinal Network info = client.inspectNetwork(network.id());\n```\n\n\
    如果你不知道网络的标识符，或者只是感兴趣于查询（并过滤）所有网络，也可以这样做：\n\n```java\nfinal List networks = client.listNetworks();\n\
    ```\n\n一旦不再需要该网络，可以轻松将其删除。\n\n```java\nclient.removeNetwork(network.id());\n```\n\
    \n[Spotify Docker Client](https://github.com/spotify/docker-client) 为任何运行中的（或刚创建的）容器提供了连接网络或断开网络的方法，例如：\n\
    \n```java\nfinal ContainerCreation container = client.createContainer(ContainerConfig\n\
    \    .builder()\n    .image(\"mysql:8.0.2\")\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\"\
    ,\n        \"MYSQL_DATABASE=my_app_db\"\n    )\n    .exposedPorts(\"3306\")\n\
    \    .build()\n);\n\nclient.startContainer(container.id());\nclient.connectToNetwork(container.id(),\
    \ network.id());\n```\n\n或者：\n\n```java\nclient.disconnectFromNetwork(container.id(),\
    \ network.id());\n```\n\n目前，[Spotify Docker Client 文档](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md)尚未包含专门用于网络操作的章节。\n\
    \n## 9. 资源限制\n\n[Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 还支持动态调整容器配置（主要配置、资源限制如内存、CPU 或块 I/O），例如：\n\n```java\nfinal ContainerUpdate update\
    \ = client.updateContainer(container.id(),\n    HostConfig\n        .builder()\n\
    \        .memory(268435456L) /* 限制为 256Mb */\n        .build()\n);\n```\n\n##\
    \ 10. 入门指南\n\n为了结束本节，最好有一个真实的示例，让我们让我们目前为止见过的所有 API 能够无缝地工作。由于我们一直一直在玩 [MySQL](https://hub.docker.com/_/mysql/)，它是\
    \ Java（以及其他）应用程序关系型数据存储的热门选择，端到端的演示将基于它。那么，我们的目标是什么？\n\n1. 使用 `mysql:8.0.2` 镜像创建一个容器实例\n\
    2. 暴露 TCP 端口 `3306` 并将其绑定到随机主机端口（这样我们可以运行任意数量的容器而不会产生端口冲突）\n3. 确保容器已启动且 [MySQL](https://hub.docker.com/_/mysql/)\
    \ 服务进程已准备好处理我们的查询\n4. 使用 [MySQL JDBC 驱动](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 连接到 [MySQL] 实例并列出所有目录（数据库）\n\n听起来工作很大，但是……由于我们已经学习了 [Spotify Docker Client](https://github.com/spotify/docker-client)，所以让我们一步一步来，让奇迹发生。\n\
    \n```java\nfinal DockerClient client = DefaultDockerClient\n    .fromEnv()\n \
    \   .build();\n\n// 先拉取镜像\nclient.pull(\"mysql:8.0.2\");\n\n// 创建容器\nfinal ContainerCreation\
    \ container = client.createContainer(ContainerConfig\n    .builder()\n    .image(\"\
    mysql:8.0.2\")\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\",\n       \
    \ \"MYSQL_DATABASE=my_app_db\"\n    )\n    .exposedPorts(\"3306\")\n    .healthcheck(\n\
    \        Healthcheck\n        .create(\n            // MySQL 镜像没有提供 `nc`\n   \
    \         Arrays.asList(\"CMD-SHELL\", \"ss -ltn src :3306\"),\n            5000000000L,\
    \ // 5 秒，纳秒\n            3000000000L  // 3 秒，纳秒\n        )\n    )\n    .hostConfig(\n\
    \        HostConfig\n            .builder()\n            .portBindings(\n    \
    \            ImmutableMap.of(\n                    \"3306\",\n               \
    \     ImmutableList.of(PortBinding.of(\"0.0.0.0\", 0))\n                )\n  \
    \          )\n            .build()\n    )\n    .build()\n);\n```\n\n"
