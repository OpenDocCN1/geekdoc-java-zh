  trans: "\n接下来是重要的但并不明显的步骤。我们需要用户名和密码才能下载官方的 [Oracle JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ 分发版（正如大家记得的，在执行之前必须接受许可协议）。\n\n| `1` | `ENV ORACLE_JDK_USER` `\"<username>\"\
    ` |\n| `2` | `ENV ORACLE_JDK_PASSWORD` `\"<password>\"` |\n\n如果我们在这个阶段仅构建镜像并运行该镜像的容器，我们将得到一个功能齐全的\
    \ [Jenkins](https://jenkins.io/) 实例，但没有配置任何工具、安全设置或作业。由于我们的目标是全自动化，我们将使用 [Jenkins](https://jenkins.io/)\
    \ 脚本化能力（基于 [Groovy](http://groovy-lang.org/)）来来实现这一目标。\n\n一个不复杂的脚本示例将是理解 [Jenkins](https://jenkins.io/)\
    \ 自动化核心思想的良好起点，这里是 `init.groovy`。\n\n```groovy\ndef instance = Jenkins.getInstance()\n\
    instance.setNumExecutors(5)\ninstance.setSlaveAgentPort([55001])\n```\n\n它看起来一点也不可怕。逐步增加更多内容，让我们来看下一个配置安全设置以访问\
    \ [Jenkins](https://jenkins.io/) 实例配置脚本，`security.groovy`。\n\n```groovy\n// Get\
    \ system environment\ndef env = System.getenv()\ndef instance = Jenkins.getInstance()\n\
    instance.setSecurityRealm(new HudsonPrivateSecurityRealm(false))\ninstance.setAuthorizationStrategy(new\
    \ GlobalMatrixAuthorizationStrategy())\n\ndef user = instance.getSecurityRealm().createAccount(env.JENKINS_USER,\
    \ env.JENKINS_PASS)\nuser.save()\n\ninstance.getAuthorizationStrategy().add(Jenkins.ADMINISTER,\
    \ env.JENKINS_USER)\ninstance.save()\n```\n\n你也可以从上面的 [Dockerfile](https://docs.docker.com/engine/reference/builder/)\
    \ 定义中看到我们是如何使用 `JENKINS_USER` 和 `JENKINS_PASS` 环境变量的。接下来我们要做的下一件事是将私钥（我们之前已经将其复制到镜像中）存储起来用于访问选择的\
    \ [SCM](https://en.wikipedia.org/wiki/Version_control)，这将在 `credentials.groovy`\
    \ 中编写。\n\n```groovy\ndef instance = Jenkins.getInstance()\nString keyfile = \"\
    /var/jenkins_home/.ssh/id_rsa\"\ndef domain = Domain.global()\ndef store = instance.getExtensionList('com.cloudbees.plugins.credentials.SystemCredentialsProvider')[0].getStore()\n\
    \ndef credentials = new BasicSSHUserPrivateKey(\n  CredentialsScope.GLOBAL,\n\
    \  \"22d9d94b-2794-4d0c-8576-accf87764d0f\",\n  \"jenkins\",\n  new BasicSSHUserPrivateKey.FileOnMasterPrivateKeySource(keyfile),\n\
    \  \"\",\n  \"\"\n)\n\nstore.addCredentials(domain, credentials)\n```\n\n由于我们已经决定专注于\
    \ [Spring Boot](https://projects.spring.io/spring-boot/) 应用，并且已经为此准备了一个 [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)，预装\
    \ [Oracle JDK 8](http://www.oracle.com/technetwork/java/javase/overview/index.html)（最新版本为\
    \ `8u162`）和 [Gradle](https://gradle.org/) 工具（我们使用的版本是 `4.3.0`，虽然不是最新的，但让我们先坚持使用它）。`jdk.groovy`\
    \ 代码段负责 [Oracle JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ 的配置。\n\n```groovy\ndef env = System.getenv()\ndef instance = Jenkins.getInstance()\n\
    def descriptor = instance.getDescriptor(\"hudson.model.JDK\")\ndef installations\
    \ = []\ndef installer = new JDKInstaller(\"jdk-8u162-oth-PR\", true)\ndef installerProps\
    \ = new InstallSource([installer])\ndef installation = new JDK(\"jdk-8u162\",\
    \ \"\", installerProps)\ninstallations.push(installation)\ndescriptor.setInstallations(installations.toArray(new\
    \ JDK[]))\ndescriptor.save()\ndef jdkInstaller = instance.getDescriptor(\"hudson.tools.JDKInstaller\"\
    )\njdkInstaller.doCredential(env.JENKINS_USER, env.JENKINS_PASSWORD)\n```\n\n\
    请注意配置用户名和密码以下载 [JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ 的强制性步骤（使用 `ORACLE_JDK_USER` 和 `ORACLE_JDK_PASSWORD` 环境变量）。另一方面，`gradle.groovy`\
    \ 看起来简单得多。\n\n```groovy\ndef instance = Jenkins.getInstance()\ndef gradle = new\
    \ GradleInstallation(\"Gradle 4.3.0\", \"\", [new InstallProperty([new GradleInstaller(\"\
    4.3.0\")])])\ndef descriptor = instance.getDescriptorByType(GradleInstallation.Descriptor)\n\
    descriptor.setInstallations(gradle)\ndescriptor.save()\n```\n\n到为止非常棒，但最有趣的脚本留在最后。它是存储在\
    \ `pipeline.groovy` 中的流水线配置。\n\n```groovy\ndef env = System.getenv()\ndef instance\
    \ = Jenkins.getInstance()\n\ndef project = instance.createProject(WorkflowBranchProject,\
    \ 'spring-boot-webapp')\nGitSCMSource gitSCMSource = new GitSCMSource(null, env.GIT_URL,\
    \ \"22d9d94b-2794-4d0c-8576-accf87764d0f\", \"\", false)\nproject.getSourcesList().add(new\
    \ BranchSource(gitSCMSource))\n```\n\n请注意我们如何通过唯一标识符 `22d9d94b-2794-4d0c-8576-accf87764d0f`\
    \ 引用在 `credentials.groovy` 中预配置的凭据。[Git](https://git-scm.com/) 仓库的 URL 来自环境变量\
    \ `GIT_URL`。\n\n作为最后一步，我们将所有脚本复制到镜像中，让 [Jenkins](https://jenkins.io/) 有机会在初始化阶段执行它们。\n\
    \n```\nCOPY scripts/init.groovy /usr/share/jenkins/ref/init.groovy.d/init.groovy\n\
    COPY scripts/credentials.groovy /usr/share/jenkins/ref/init.groovy.d/credentials.groovy\n\
    COPY scripts/pipeline.groovy /usr/share/jenkins/ref/init.groovy.d/pipeline.groovy\n\
    COPY scripts/security.groovy /usr/share/jenkins/ref/init.groovy.d/security.groovy\n\
    COPY scripts/jdk.groovy /usr/share/jenkins/ref/init.groovy.d/jdk.groovy\nCOPY\
    \ scripts/gradle.groovy /usr/share/jenkins/ref/init.groovy.d/gradle.groovy\n```\n\
    \n太棒了，我们唯一需要手动执行（但只需一次）的是授权 `github/id_rsa.pub` 密钥以只读权限访问你的 [Github](https://github.com/)（或\
    \ [Bitbucket](https://bitbucket.org/)、[Gitlab](https://gitlab.com/) 等）仓库。完成后，我们可以继续构建镜像：\n\
    \n```bash\ndocker build . --tag jenkins:jcg\n```\n\n立即运行我们的 [Jenkins](https://jenkins.io/)\
    \ 容器。\n\n```bash\ndocker run --rm -p 8083:8083 -p 50001:50001 -v /var/run/docker.sock:/var/run/docker.sock\
    \ --privileged jenkins:jcg\n```\n\n容器启动后，我们可以导航到 [`localhost:8083`](https://localhost:8083)\
    \ 并使用用户名 `admin` 和密码 `ef8a7543087c4b999cbecdd57696f557` 登录，扫描流水线，等待构建并检查我们的 `spring-boot-webapp-pipeline`\
    \ 作业状态。\n"
- fmt: "\nAlso, it will not hurt to verify that out pipeline is configured with correct\
    \ repository and is pointing to the right credentials to use.\n\n![](images/branch-source-jcg.png)\n\
    \n# Git branch source\n\nThe best confirmation that things have been set in place\
    \ properly is to check that pipeline and all its stages have been executed successfully.\n\
    \n![](images/build-jcg.png)\n\n# Build stages\n\nIn case you are looking for modern\
    \ and fancier web UI, [Jenkins](https://jenkins.io/) is offering such kind of\
    \ user experience with [Blue Ocean](https://jenkins.io/doc/book/blueocean/), designed\
    \ from the ground up for [Jenkins Pipeline](https://jenkins.io/doc/book/pipeline/).\n\
    \n![](images/blueocean-jcg.png)\n\n# Blue Ocean\n\nWe could have declared success\
    \ at this point, but to be fair, the need to install tooling and whatnot complicates\
    \ the automation process. Any chance we could make it simpler? Yes, for sure,\
    \ and the key player here is once again [Docker](https://www.docker.com/).\n\n\
    ## 5. Docker in Jenkins\n\nAs we mentioned already, [Jenkins](https://jenkins.io/)\
    \ has an outstanding [Docker](https://www.docker.com/) support fulfilled by fair\
    \ number of plugins with [Docker plugin](https://plugins.jenkins.io/docker-plugin)\
    \ and [Docker Pipeline plugin](https://plugins.jenkins.io/docker-workflow) being\
    \ the keys ones. What it means practically is that your pipeline (or other kind\
    \ of job) may spin up containers to run the build (and any other tasks or stage)\
    \ on them.\n\nThe best way to illustrate the difference is to modify our [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)\
    \ from the previous section to use [Docker](https://www.docker.com/) agent instead\
    \ of predefined tooling.\n\n``` |\n01 | pipeline {\n02 | agent {\n03 | docker\
    \ {\n04 | image 'gradle:4.3.0-jdk8-alpine'\n05 | }\n06 | }\n07 | \n08 | options\
    \ {\n09 | disableConcurrentBuilds()\n10 | buildDiscarder(logRotator(numToKeepStr:'5'))\n\
    11 | }\n12 | \n13 | triggers {\n14 | pollSCM('H/15 * * * *')\n15 | }\n16 | \n\
    17 | stages {\n18 | stage('Cleanup before build') {\n19 | steps {\n20 | cleanWs()\n\
    21 | }\n22 | }\n23 | \n24 | stage('Checkout from Github') {\n25 | steps {\n26\
    \ | checkout scm\n27 | }\n28 | }\n29 | \n30 | stage('Build') {\n31 | steps {\n\
    32 | sh 'gradle build'\n33 | }\n34 | }\n35 | }\n36 | \n37 | post {\n38 | always\
    \ {\n39 | archiveArtifacts artifacts:'build/libs/*.jar', fingerprint:true\n40\
    \ | }\n41 | }\n42 | }\n```\n\nThis pipeline looks more compact. We get rid of\
    \ quite a few definitions (and practically could get rid of some initialization\
    \ scripts as well). When we commit this new [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)\
    \ to our existing repository (overriding the current one) we should observe a\
    \ bit different set of stages but the build is still green.\n\n![](images/build-docker-jcg.png)\n\
    \n# Build stages with Docker\n\nThis is just one example of [Docker](https://www.docker.com/)\
    \ integration with [Jenkins](https://jenkins.io/), there are tons of different\
    \ ways you could leverage [Docker](https://www.docker.com/) to push the limits\
    \ of your continuous integration (and delivery) processes to perfection.\n\nThere\
    \ is one more thing to mention here before we wrap up the discussion. Because\
    \ we are running [Jenkins](https://jenkins.io/) in [Docker](https://www.docker.com/),\
    \ and [Jenkins](https://jenkins.io/) itself executes job/stage steps in [Docker](https://www.docker.com/),\
    \ such model of containers usage is known as `Docker-in-Docker` (or shortly `DinD`).\
    \ There are quite a few things to be aware of when you are running `DinD` environments,\
    \ brilliantly summarized by [Jérôme Petazzoni in the blog post](https://jpetazzo.github.io/2015/09/03/do-not-use-docker-in-docker-for-ci/).\
    \ Please check it out if you are seriously considering this model.\n\n## 6. Conclusions\n\
    \nIn this very last part of the tutorial we have looked at quite a practical application\
    \ of [Docker](https://www.docker.com/) by deploying and configuring continuous\
    \ integration platform (based on [Jenkins](https://jenkins.io/)) in a fully automated\
    \ fashion. We created a build pipelines for one of the applications [have developed\
    \ previously](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)\
    \ and demonstrated the use case of running [Docker](https://www.docker.com/) inside\
    \ live [Docker](https://www.docker.com/) containers.\n\nWith that, our tutorial\
    \ comes to the end. It was a long but hopefully useful journey, where we have\
    \ learned something practical and helpful. The conclusion of this whole series\
    \ could be nicely summarized by restating that [Docker](https://www.docker.com/)\
    \ is terrific piece of technology which is capable to push us to the new horizons.\n\
    \nThe complete scripts and project sources are available for download:\n\n* [Spring\
    \ Boot web application with Jenkinsfile](http:../images/multibranch-pipeline.zip)\n\
    * [Jenkinsfile with Docker agent](http:../images/multibranch-pipeline-docker.zip)\n\
    * [Jenkins Docker image and scripts](http:../images/jenkins.zip)\n"
  raw: 'Also, it will not hurt to verify that out pipeline is configured with correct
    repository and is pointing to the right credentials to use.


    ![](images/branch-source-jcg.png)


    Git branch source


    The best confirmation that things have been set in place properly is to check
    that pipeline and all its stages have been executed successfully.


    ![](images/build-jcg.png)


    Build stages


    In case you are looking for modern and fancier web UI, [Jenkins](https://jenkins.io/)
    is offering such kind of user experience with [Blue Ocean](https://jenkins.io/doc/book/blueocean/),
    designed from the ground up for [Jenkins Pipeline](https://jenkins.io/doc/book/pipeline/).


    ![](images/blueocean-jcg.png)


    Blue Ocean


    We could have declared success at this point, but to be fair, the need to install
    tooling and whatnot complicates the automation process. Any chance we could make
    it simpler? Yes, for sure, and the key player here is once again [Docker](https://www.docker.com/).


    ## 5\. Docker in Jenkins


    As we mentioned already, [Jenkins](https://jenkins.io/) has an outstanding [Docker](https://www.docker.com/)
    support fulfilled by fair number of plugins with [Docker plugin](https://plugins.jenkins.io/docker-plugin)
    and [Docker Pipeline plugin](https://plugins.jenkins.io/docker-workflow) being
    the keys ones. What it means practically is that your pipeline (or other kind
    of job) may spin up containers to run the build (and any other tasks or stage)
    on them.


    The best way to illustrate the difference is to modify our [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)
    from the previous section to use [Docker](https://www.docker.com/) agent instead
    of predefined tooling.


    | `01` | `pipeline {` |


    | `02` | `agent {` |


    | `03` | `docker {` |


    | `04` | `image` `''gradle:4.3.0-jdk8-alpine''` |


    | `05` | `}` |


    | `06` | `}` |


    | `07` |   |


    | `08` | `options {` |


    | `09` | `disableConcurrentBuilds()` |


    | `10` | `buildDiscarder(logRotator(numToKeepStr:``''5''``))` |


    | `11` | `}` |


    | `12` |   |


    | `13` | `triggers {` |


    | `14` | `pollSCM(``''H/15 * * * *''``)` |


    | `15` | `}` |


    | `16` |   |


    | `17` | `stages {` |


    | `18` | `stage(``''Cleanup before build''``) {` |


    | `19` | `steps {` |


    | `20` | `cleanWs()` |


    | `21` | `}` |


    | `22` | `}` |


    | `23` |   |


    | `24` | `stage(``''Checkout from Github''``) {` |


    | `25` | `steps {` |


    | `26` | `checkout scm` |


    | `27` | `}` |


    | `28` | `}` |


    | `29` |   |


    | `30` | `stage(``''Build''``) {` |


    | `31` | `steps {` |


    | `32` | `sh` `''gradle build''` |


    | `33` | `}` |


    | `34` | `}` |


    | `35` | `}` |


    | `36` |   |


    | `37` | `post {` |


    | `38` | `always {` |


    | `39` | `archiveArtifacts artifacts:` `''build/libs/*.jar''``, fingerprint:`
    `true` |


    | `40` | `}` |


    | `41` | `}` |


    | `42` | `}` |


    This pipeline looks more compact. We get rid of quite a few definitions (and practically
    could get rid of some initialization scripts as well). When we commit this new
    [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/) to our existing
    repository (overriding the current one) we should observe a bit different set
    of stages but the build is still green.


    ![](images/build-docker-jcg.png)


    Build stages with Docker


    This is just one example of [Docker](https://www.docker.com/) integration with
    [Jenkins](https://jenkins.io/), there are tons of different ways you could leverage
    [Docker](https://www.docker.com/)  to push the limits of your continuous integration
    (and delivery) processes to perfection.


    There is one more thing to mention here before we wrap up the discussion. Because
    we are running [Jenkins](https://jenkins.io/) in [Docker](https://www.docker.com/),
    and [Jenkins](https://jenkins.io/) itself executes job/stage steps in [Docker](https://www.docker.com/),
    such model of containers usage is known as `Docker-in-Docker` (or shortly `DinD`).
    There are quite a few things to be aware of when you are running `DinD` environments,
    brilliantly summarized by [Jérôme Petazzoni in the blog post](https://jpetazzo.github.io/2015/09/03/do-not-use-docker-in-docker-for-ci/).
    Please check it out if you are seriously considering this model.


    ## 6. Conclusions


    In this very last part of the tutorial we have looked at quite a practical application
    of [Docker](https://www.docker.com/) by deploying and configuring continuous integration
    platform (based on [Jenkins](https://jenkins.io/)) in a fully automated fashion.
    We created a build pipelines for one of the applications we [have developed previously](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)
    and demonstrated the use case of running [Docker](https://www.docker.com/) inside
    live [Docker](https://www.docker.com/) containers.


    With that, our tutorial comes to the end. It was a long but hopefully useful journey,
    where we have learned something practical and helpful. The conclusion of this
    whole series could be nicely summarized by restating that [Docker](https://www.docker.com/)
    is terrific piece of technology which is capable to push us to the new horizons.


    The complete scripts and project sources are available for download:


    *   [Spring Boot web application with Jenkinsfile](http:../images/multibranch-pipeline.zip)


    *   [Jenkinsfile with Docker agent](http:../images/multibranch-pipeline-docker.zip)


    *   [Jenkins Docker image and scripts](http:../images/jenkins.zip)'
