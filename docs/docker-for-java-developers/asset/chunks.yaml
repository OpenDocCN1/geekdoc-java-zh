    ![Docker Containers View](images/docker-containers-jcg-1024x193.png)


    # Docker Containers View


    Similarly, if you want to list only [Docker](https://www.docker.com/) images,
    the specialized `Docker Images` view is right here to serve your needs.


    ![Docker Images View](images/docker-images-jcg-1024x201.png)


    # Docker Images View


    Last but not least, there is one very useful view called `Docker Image Hierarchy`.
    It allows to see all the layers the image in question has been built from. Here,
    for example, we could see how the tagged image with name `jcg/spring-boot-webapp:0.0.1-SNAPSHOT`
    (one of the samples we were building in the previous part of the tutorial) is
    layered out.


    ![Docker Image Hierarchy](images/docker-image-hierarchy-jcg-300x151.png)


    # Docker Image Hierarchy


    But these views are only the part of the whole story. Another part is a set of
    new [Docker](https://www.docker.com/) launchers which you may use to build [Docker](https://www.docker.com/)
    images and run your Java applications (or even complete [Docker Compose](https://docs.docker.com/compose/reference/overview/)
    stacks) as [Docker](https://www.docker.com/) containers.


    ![Eclipse Launchers](images/eclipse-launcher-jcg-161x300.png)


    # Eclipse Launchers


    In case you would like to learn more about all the views and launchers discussed
    above, and, in general, about [Docker](https://www.docker.com/) tooling available
    in [Eclipse](http://www.eclipse.org/), the [official project Wiki](https://wiki.eclipse.org/Linux_Tools_Project/Docker_Tooling/User_Guide)
    is a great place to get started.


    ## 2.2. IntelliJ IDEA


    The [JetBrains IntelliJ IDEA](https://www.jetbrains.com/idea/), available in latest
    version `2017.2.6`, provides the [Docker](https://www.docker.com/) tooling support
    in a form of the [official plugin](https://www.jetbrains.com/help/idea/docker.html).
    It is available in `Ultimate Edition` as well as in `Community Edition`, which
    we are going to use in this section.


    Once the plugin is installed, the new `Docker` view becomes available, with all
    the details about images and containers baked in.


    ![Docker in IntelliJ Idea](images/docker-idea-jcg-1024x208.png)


    # Docker in IntelliJ Idea


