  trans: "\n\n```json\n{\n  \"06\": {\n    \"status\": \"UP\",\n    \"details\": {\n\
    \      \"total\": 17293533184,\n      \"free\": 14476333056,\n      \"threshold\"\
    : 10485760\n    }\n  },\n  \"db\": {\n    \"status\": \"UP\",\n    \"details\"\
    : {\n      \"database\": \"MySQL\",\n      \"hello\": 1\n    }\n  }\n}\n```\n\n\
    事实确实如此！为了结束关于 [Kubernetes](https://kubernetes.io/) 的讨论，值得提到的是 [Docker](https://www.docker.com/)\
    \ 已经包含了对 [Kubernetes](https://kubernetes.io/) 在[某些边缘通道](https://docs.docker.com/docker-for-mac/#kubernetes)\
    \ 上的早期原生集成。\n\n# 4. 使用 Apache Mesos 进行编排\n\n[Apache Mesos](http://mesos.apache.org/)\
    \ 可疑是目前使用的最古老的资源和集群管理框架之一。它有效地将资源（CPU、内存、存储）从物理或虚拟硬件中抽象出来，允许构建和运行容错且弹性的分布式系统。它的优势之一是极高的可扩展性和对容器化应用部署的支持，然而它也以相当复杂且难以操作而闻名。\n\
    \n从架构上来说，Apache Mesos](http://mesos.apache.org/) 由一个管理 `agents`（运行在每个集群节点上）的 `master`\
    \ 以及 `frameworks`（在这些 agents 上运行 `tasks`）组成。master 通过向框架 `resource offers`（资源提议）实现了跨框架的资源（CPU、RAM、……）的细粒度共享。我们仅关注必要的组件，让我们来看看如何使用\
    \ [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ 规范定义 [Apache Mesos](http://mesos.apache.org/) 集群。\n\n```yaml\nversion: \"3\"\
    \nservices:\n  zookeeper:\n    image: zookeeper\n    networks:\n      - mesos-network\n\
    \    environment:\n      ZOO_TICK_TIME: 2000\n      ZOO_INIT_LIMIT: 10\n     \
    \ ZOO_SYNC_LIMIT: 5\n      ZOO_MAX_CLIENT_CNXNS: 128\n      ZOO_PORT: 2181\n \
    \     ZOO_MY_ID: 1\n  mesos-master:\n    image: mesosphere/mesos-master:1.3.2\n\
    \    networks:\n      - mesos-network\n    ports:\n      - \"5050:5050\"\n   \
    \ environment:\n      MESOS_ZK: zk://zookeeper:2181/mesos\n      MESOS_QUORUM:\
    \ 1\n      MESOS_CLUSTER: docker-compose\n      MESOS_REGISTRY: replicated_log\n\
    \    volumes:\n      - /var/run/docker.sock:/run/docker.sock\n    depends_on:\n\
    \      - zookeeper\n  mesos-slave:\n    image: mesosphere/mesos-slave:1.3.2\n\
    \    privileged: true\n    networks:\n      - mesos-network\n    ports:\n    \
    \  - \"5051:5051\"\n    links:\n      - zookeeper\n      - mesos-master\n    environment:\n\
    \      - MESOS_CONTAINERERS=docker\n      - MESOS_ISOLATOR=cgroups, cgroups/mem\n\
    \      - MESOS_LOG_DIR=var/log\n      - MESOS_MASTER=zk://zookeeper:2181/mesos\n\
    \      - MESOS_PORT=5051\n      - MESOS_EXECUTOR_REGISTRATION_TIMEOUT=5mins\n\
    \      - MESOS_EXECUTOR_SHUTDOWN_GRACE_PERIOD=90secs\n      - MESOS_DOCKER_STOP_TIMEOUT=90secs\n\
    \      - MESOS_RESOURCES=cpus:2,mem:2080,disk:5600,ports:1900-1999\n      - MESOS_WORK_DIR=/var/lib/mesos\n\
    \      - MESOS_SYSTEMD_ENABLE_SUPPORT=false\n    volumes:\n      - /var/run/docker.sock:/run/docker.sock\n\
    \    dns:\n      - mesos\n    depends_on:\n      - mesos-master\n      - mesos-dns\n\
    \  marathon:\n    image: mesosphere/marathon:v.5.6\n    networks:\n      - mesos-network\n\
    \    environment:\n      MARATHON_ZK=zk://zookeeper:2181/marathon\n      MARATHON_MASTER=zk://zookeeper:2181/mesos\n\
    \    ports:\n      - \"8080:8080\"\n    depends_on:\n      - mesos-master\n  mesos-dns:\n\
    \    image: mesosphere/mesos-dns:v0.6.0\n    command: [\"/usr/bin/mesos-dns\"\
    , \"-v=2\", \"-config=/config.json\"]\n    ports:\n      - 53:53/udp\n      -\
    \ 8123:8123\n    volumes:\n      - ./config.json:/config.json\n      - /tmp\n\
    \    links:\n      - zookeeper\n    dns:\n      - 8.8.8.8\n    networks:\n   \
    \   - mesos-network\n```\n\n正如我们所见，除了仅仅是 [Apache Mesos](http://mesos.apache.org/)（以及\
    \ [Apache Zookeeper](https://zookeeper.apache.org/)）之外，还有许多部分。其核心是 [Marathon](http://mesosphere.github.io/marathon/)\
    \ 框架，这是一个容器编排平台。[Marathon](http://mesosphere.github.io/marathon/) 提供了一个漂亮的 [Web\
    \ UI](https://mesosphere.github.io/marathon-ui.html) 以及用于管理应用的 [REST(ful) APIs](https://mesosphere.github.io/marathon/api-console/index.html)，并使用\
    \ [JSON](https://www.json.org/) 格式规范。遵循我们的 [Spring Boot](https://projects.spring.org/)\
    \ 应用栈，让我们看一下 MySQL 部署示例（存储在 `mysql.json` 中）：\n\n```json\n{\n  \"id\": \"/jcg/mysql\"\
    ,\n  \"container\": {\n    \"type\": \"DOCKER\",\n    \"docker\": {\n      \"\
    image\": \"mysql:8.0\",\n      \"network\": \"BRIDGE\",\n      \"portMappings\"\
    : [\n        {\n          \"containerPort\": 3306,\n          \"servicePort\"\
    : 3306,\n          \"hostPort\": 0\n        }\n      ],\n      \"parameters\"\
    : [\n        {\n          \"key\": \"hostname\",\n          \"value\": \"mysql\"\
    \n        }\n      ]\n    }\n  },\n  \"env\": {\n    \"MYSQL_ROOT_PASSWORD\":\
    \ \"p$ss0rd\",\n    \"MYSQL_DATABASE\": \"my_app\",\n    \"MYSQL_ROOT_HOST\":\
    \ \"%\"\n  },\n  \"instances\": 1,\n  \"cpus\": 0.1,\n  \"mem\": 500,\n  \"healthChecks\"\
    : [\n    {\n      \"protocol\": \"COMMAND\",\n      \"command\": { \"value\":\
    \ \"ss -ltn src :3306 | grep 3306\" },\n      \"gracePeriodSeconds\": 10,\n  \
    \    \"intervalSeconds\": 10,\n      \"timeoutSeconds\": 5,\n      \"maxConsecutiveFailures\"\
    : 2\n    }\n  ]\n}\n```\n\n现在，要让 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 容器运行起来，我们只需要通过其 [REST(ful) APIs](https://mesosphere.github.io/marathon/api-console/index.html)\
    \ 将此描述提交给 [Marathon](http://mesosphere.github.io/marathon/)（假设我们的 [Apache Mesos](http://mesos.apache.org/)\
    \ 已经运行），例如：\n\n```bash\ncurl -X POST http://localhost:8080/v2/apps -d @mysql.json\
    \ -H \"Content-type: application/json\"\n```\n\n"
- fmt: "\nLooks good, let us do the same for [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application, starting off from the [Marathon](http://mesosphere.github.io/marathon/)\
    \ deployment descriptor and persist it in the `spring-webapp.json` file.\n\n```json\n\
    {\n  \"id\": \"/jcg/spring-webapp\",\n  \"container\": {\n    \"type\": \"DOCKER\"\
    ,\n    \"docker\": {\n      \"image\": \"jcg/spring-boot-webapp:latest\",\n  \
    \    \"network\": \"BRIDGE\",\n      \"portMappings\": [\n        {\n        \
    \  \"containerPort\": 19900,\n        \"servicePort\": 19900,\n        \"hostPort\"\
    : 19900\n        }\n      ],\n      \"parameters\": [\n        { \"key\": \"hostname\"\
    , \"value\": \"spring-webapp\" }\n    ]\n  },\n  \"env\": {\n    \"DB_HOST\":\
    \ \"172.17.0.2\"\n  },\n  \"instances\": 1,\n  \"cpus\": 0.1,\n  \"mem\": 512,\n\
    \  \"healthChecks\": [\n    {\n      \"protocol\": \"COMMAND\",\n      \"command\"\
    : { \"value\": \"nc -z localhost 19900\" },\n      \"gracePeriodSeconds\": 25,\n\
    \      \"intervalSeconds\": 10,\n      \"timeoutSeconds\": 5,\n      \"maxConsecutiveFailures\"\
    : 3\n    }\n  ]\n}\n```\n\nNext step would be to submit it to [Marathon](http://mesosphere.github.io/marathon/):\n\
    \n```bash\n$ curl -X POST http://localhost:8080/v2/apps -d @spring-webapp.json\
    \ -H \"Content-type: application/json\"\n{\n  \"id\": \"/jcg/spring-webapp\",\n\
    \  \"container\":{\n    …\n  },\n  …\n}\n```\n\nAnd we are effectively done! Once\
    \ the deployment is finished, we should be able to see our application stack in\
    \ operational state using, for example, [Marathon](http://mesosphere.github.io/marathon/)’s\
    \ [web UI](https://mesosphere.github.io/marathon/docs/marathon-ui.html), accessible\
    \ at [http://localjost:8080/ui/].\n\n![](images/marathon-jcg.png)\n\n## Marathon\
    \ Applications\n\nThe curious reader may wonder how we linked those two [Marathon](http://mesosphere.github.io/marathon/)\
    \ applications, [Spring Boot](https://projects.spring.io/spring-boot/) and [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/),\
    \ together. For this particular case, we have been using [service discovery and\
    \ load balancing](https://mesosphere.github.io/marathon/docs/service-discovery-load-balancing.html)\
    \ capabilities of [Apache Mesos](http://mesos.apache.org/) fulfilled by [Mesos-DNS](https://mesosphere.github.io/mesos-dns/).\
    \ To illustrate them in action, this is how we can query the IP address of the\
    \ [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/) instance by its name,\
    \ `mysql-jcg.marathon.mesos`.\n\n```bash\n$ curl http://localhost:8123/v1/hosts/mysql-jcg.marathon.mesos\n\
    [\n  {\n    \"host\": \"mysql-jcg.marathon.mesos\",\n    \"ip\": \"172.17.0.2\"\
    \n  }\n]\n```\n\nAs usual, let us confirm that [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application is up and running by sending over a request to its health endpoint:\n\
    \n```bash\n$ curl http://localhost:19900/application\n{\n  \"details\": {\n  \
    \  \"db\": {\n      \"database\": \"MySQL\",\n      \"hello\": 1\n    },\n   \
    \ \"status\": \"UP\"\n  },\n  \"diskSpace\": {\n    \"details\": {\n      \"free\"\
    : 440180264,\n      \"threshold\": 1048576,\n      \"total\": 4953692560\n   \
    \ },\n    \"status\": \"UP\"\n  },\n  \"status\": \"UP\"\n}\n```\n\n## 5. Orchestration\
    \ using Docker Swarm\n\nIt has been awhile since [Docker](https://www.docker.com/)\
    \ has the cluster management and orchestration features embedded in the engine.\
    \ This orchestration layer is used to be known as [Docker Swarm](https://github.com/docker/swarm)\
    \ but later on evolved into, essentially, just a special mode ([swarm mode](https://docs.docker.com/engine/swarm/))\
    \ to run [Docker Engine](https://docs.docker.com/engine/) in.\n\nIf you betting\
    \ heavily on [Docker](https://www.docker.com/) and prefer not to look for anything\
    \ else, running [Docker Engine](https://docs.docker.com/engine/) in a [swarm mode](https://docs.docker.com/engine/swarm/)\
    \ could be a good option as an orchestrator. It is fairly easy to get started\
    \ with as well.\n\n```bash\n$ docker swarm init\n```\n\nConceptually, there are\
    \ quite a few differences which swarm mode introduces, beyond just changes in\
    \ the [Docker Engine](https://docs.docker.com/engine/) itself. First and foremost,\
    \ you should start thinking in terms of services, not containers. The assumptions\
    \ about running everything inside single [Docker](https://www.docker.com/) host\
    \ won’t be accurate anymore as the swarm would like consist of many [Docker](https://www.docker.com/)\
    \ hosts distributed over the network.\n\nWhen running [Docker Engine](https://docs.docker.com/engine/)\
    \ in a [swarm mode](https://docs.docker.com/engine/swarm/), we can deploy a complete\
    \ application (service) stack using already familiar [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ specification. There is only one constraint though, the [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ file format should be version `3 (or above)` to be compatible between [Docker\
    \ Compose](https://docs.docker.com/compose/overview/) and [Docker Engine](https://docs.docker.com/engine/)’s\
    \ [swarm mode](https://docs.docker.com/engine/swarm/).\n\nTo see the [swarm mode](https://docs.docker.com/engine/swarm/)\
    \ in action, let us rework our [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application stack a bit to comply with [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ file format version `3.3`.\n\n```yaml\nversion: '3.3'\n\nservices:\n  mysql:\n\
    \    image: mysql:8.0.2\n    environment:\n      - MYSQL_ROOT_PASSWORD=password\n\
    \      - MYSQL_DATABASE=my_app\n      - MYSQL_HOST_HOST\n    healthcheck:\n  \
    \    test: [\"CMD-SHELL\", \"ss -ltn src :3306 | grep 3306\"]\n      interval:\
    \ 10s\n      timeout: 5s\n      retries: 3\n    networks:\n      - my-app-network\n\
    \  java-app:\n    image: jcg/spring-boot-webapp:latest\n    environment:\n   \
    \   - DB_HOST=mysql\n    ports:\n      - 19900:19900\n    depends_on:\n      -\
    \ mysql\n    healthcheck:\n      test: [\"CMD-SHELL\", \"nc -z localhost 19900\"\
    ]\n      interval: 10s\n      timeout: 5s\n      retries: 3\n    networks:\n \
    \     - my-app-network\n\nnetworks:\n  my-app-network:\n    driver: overlay\n\
    ```\n"
