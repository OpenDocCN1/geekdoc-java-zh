- fmt: '

    In this section of the tutorial we are going to learn a couple of the frameworks
    which enormously simplify the integration, component and end-to-end testing of
    JVM-based applications by leveraging [Docker](https://www.docker.com/) and the
    tooling around it.


    ## 2. Before getting started


    In the [second part of this tutorial](https://www.javacodegeeks.com/2017/09/docker-java-developers-docker-command-line.html)
    we have briefly mentioned that Java applications deployed as [Docker](https://www.docker.com/)
    containers should use at least `Java 8 update 131` or later but we have not had
    chance to elaborate on importance of this fact just yet.


    To understand the issue, let us focus on how JVM deal with two most important
    resources for Java applications: memory (heap) and CPU. For the purpose of the
    illustration, we are going to have [Docker](https://www.docker.com/) installed
    on a dedicated virtual machine which has `2 CPU cores` and `4GB of memory` allocated.
    Keeping this configuration in mind, let us take a look on that from JVM perspective:


    | `1` | `$ docker run --``rm` `openjdk:8-jdk-alpine java -XshowSettings:vm -XX:+UseParallelGC
    -XX:+PrintFlagsFinal –version` |


    There are going to be a lot of information printed out in the console, but there
    most interesting pieces for us are `ParallelGCThreads` and `VM settings`.


    | `01` | `...` |

    | `02` | `uintx ParallelGCThreads = 2` |

    | `03` | `...` |

    | `04` |   |

    | `05` | `VM settings:` |

    | `06` | `Max. Heap Size (Estimated): 992.00M` |

    | `07` | `Ergonomics Machine Class: server` |

    | `08` | `Using VM: OpenJDK 64-Bit Server VM` |

    | `09` |   |

    | `10` | `openjdk version` `"1.8.0_131"` |

    | `11` | `OpenJDK Runtime Environment (IcedTea 3.4.0) (Alpine 8.131.11-r2)` |

    | `12` | `OpenJDK 64-Bit Server VM (build 25.131-b11, mixed mode)` |


    On the machines with less than (or equal to) 8 cores, the `ParallelGCThreads`
    is [equal to number of cores](https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gctuning/parallel.html),
    while the default maximum limit for heap is roughly [25% of available physical
    memory](https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gc-ergonomics.html).
    Cool, the numbers which JVM reports make sense so far.


    Let us push it a bit further and use [Docker](https://www.docker.com/) resource
    management capabilities to restrict container CPU and memory usage to `1 core`
    and `256Mb` respectively.


    | `1` | `$ docker run --``rm` `--cpuset-cpus=0 --memory=256m openjdk:8-jdk-alpine
    java -XshowSettings:vm -XX:+UseParallelGC -XX:+PrintFlagsFinal -version` |


    The picture is a bit different this time:


    | `1` | `...` |

    | `2` | `uintx ParallelGCThreads = 1` |

    | `3` | `...` |

    | `4` |   |

    | `5` | `VM settings:` |

    | `6` | `Max. Heap Size (Estimated): 992.00M` |

    | `7` | `Ergonomics Machine Class: client` |

    | `8` | `Using VM: OpenJDK 64-Bit Server VM` |


    JVM was able to adjust the `ParallelGCThreads` accordingly but memory constraints
    seem to be ignored completely. That is right, to make JVM aware of containerized
    environment we need to unlock experimental JVM options: `-XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap`.


    | `1` | `$ docker run --``rm` `--cpuset-cpus=0 --memory=256m openjdk:8-jdk-alpine
    java -XshowSettings:vm -XX:+UseParallelGC -XX:+PrintFlagsFinal  -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap –version` |


    The results are looking much better now:


    | `1` | `...` |

    | `2` | `uintx ParallelGCThreads = 1` |

    | `3` | `...` |

    | `4` |   |

    | `5` | `VM settings:` |

    | `6` | `Max. Heap Size (Estimated): 112.00M` |

    | `7` | `Ergonomics Machine Class: client` |

    | `8` | `Using VM: OpenJDK 64-Bit Server VM` |


    The curious reader may be wondering why the maximum heap size is quite over the
    expected `25%` of the available physical memory allocated to the container. The
    answer is that [Docker](https://www.docker.com/) also allocates memory for swap
    (which, if not specified, the true value is `256Mb + 256Mb = 512Mb`).


    It is rarely the case that the application has no dependency on some kind of data
    store. And, unsurprisingly, most of such stores persist the data on some kind
    of storage. This is great, but quite often the presence of data stores makes the
    testing a challenge, specifically when summoning the isolation of test cases on
    the data level.


    ## 3. Storing data in RAM


    You may have already guessed, [Docker](https://www.docker.com/) could enormously
    reduce the efforts to create reproducible test scenarios. But still, the data
    stores serve as the major contributor to overall execution time.


    As we are going to see in a moment, [Docker](https://www.docker.com/) has something
    in the sleeve to help us: [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/).
    It effectively gives the container a way to manage the data without writing it
    permanently, keeping it in the host machine’s memory (or swap, if memory is running
    low).


    There are multiple options available which allow to attach [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)-backed
    volumes to your container, but the recommended one these days is to use `--mount`
    command line argument (or [tmpfs](https://docs.docker.com/compose/compose-file/#tmpfs)
    section of the specification in case of [docker-compose](https://docs.docker.com/compose/reference/overview/)).


    ```bash

    docker run --rm -d \

    --name mysql \

    --mount type=tmpfs,destination=/var/lib/mysql \

    -e MYSQL_ROOT_PASSWORD=''p$ssw0rd'' \

    -e MYSQL_DATABASE=my_app_db \

    -e MYSQL_ROOT_HOST=% \

    mysql:8.0.2

    ```


    The speed gains for test executions could be tremendous, but you should not use
    this feature in production (and very likely, in any other environments), ever,
    because when the container stops, the [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    mount disappears. Even if the container is committed, the [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    mount is not saved.


    ## 4. The Scenario

