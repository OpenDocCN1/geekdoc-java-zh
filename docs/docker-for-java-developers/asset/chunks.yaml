    popular Java development [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s
    is quite sufficient, one may say even outstanding. But what if we try to push
    the limits and run our [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)
    completely in [Docker](https://www.docker.com/), literally anywhere? If it sounds
    a bit crazy, it surely does, but …


