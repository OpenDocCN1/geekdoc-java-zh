    Any running container could be connected to the network or disconnected from the
    network using [connect](https://docs.docker.com/engine/reference/commandline/network_connect/)
    and [disconnect](https://docs.docker.com/engine/reference/commandline/network_disconnect/)
    commands respectively.


    | `1` | `docker network connect [OPTIONS] NETWORK CONTAINER` |

    | `2` | `docker network disconnect [OPTIONS] NETWORK CONTAINER` |


    Aside from that, the container could be connected to a particular network by passing
    the options to the [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    command. All unused networks could be removed by invoking the [prune](https://docs.docker.com/engine/reference/commandline/network_prune/)
    command.


    | `1` | `docker network prune [OPTIONS]` |


    ## 7. Linking


    More often than not your application stack would be composed of many connected
    components rather than standalone ones (a typical example would be a Java server-side
    application which talks to [MySQL](https://hub.docker.com/_/mysql/) data store).
    Projecting that to the world of containers, you would need a group of containers
    which could somehow discover their upstream dependencies and communicate with
    each other. In [Docker](https://www.docker.com/) it used to be known as [linking](https://docs.docker.com/engine/userguide/networking/default_network/dockerlinks/)
    but nowadays it could be easily achieved using [user-defined networks](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)
    (which is also the recommended practice).


    ## 8. Health Checks


    Usually [Docker](https://www.docker.com/) daemon provisions the containers pretty
    fast however it does not mean that the applications packaged inside the containers
    are ready and fully functional. For many [Docker](https://www.docker.com/) users
    it used to be one of the most annoying issues to deal with, forcing the community
    to come up with many ad-hoc solutions to the problem.


    But kudos to [Docker](https://www.docker.com/) team, we now have [health checks](https://docs.docker.com/engine/reference/builder/#healthcheck)
    (which could be specified in the [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    or using the options of the [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    command). It is an additional verification layer which instructs the [Docker](https://www.docker.com/)
    on how to test that the application inside the container is working. It resulted
    into adding a new `health status` property to complement the regular container
    status.


    ## 9. Resource Limits


    Interestingly, by default a container has no resource constraints and may consume
    all the resources of its host operating system. It could have been a show-stopper
    but fortunately [Docker](https://www.docker.com/) provides [a way to control](https://docs.docker.com/engine/admin/resource_constraints/)
    how much memory, CPU, or block I/O a particular container can use by passing a
    number of options to the [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    command. Alternatively, for the running containers the [update](https://docs.docker.com/engine/reference/commandline/container_update/)
    command allows to adjust the container configuration (primary, resource limits)
    dynamically.


    [view source](#DockerOverCommandLine.xhtml_viewSource "view source")[print](#DockerOverCommandLine.xhtml_printSource
    "print")[?](#DockerOverCommandLine.xhtml_about "?")


    | `1` | `docker container update [OPTIONS] CONTAINER [CONTAINER...]` |


    With respect to JVM running inside the container, the subject of the CPU and memory
    limits gets a bit trickier. As as of `Java SE 8u131` (and surely in `JDK 9`) and
    later, the [JVM is Docker-aware](https://blogs.oracle.com/java-platform-group/java-se-support-for-docker-cpu-and-memory-limits)
    and with just a little bit of tuning is able to play nicely according to the rules.


    ## 10. Clean up


    As we have seen so far, there are a lot of abstractions you can manage with [Docker](https://www.docker.com/).
    However, with a time [Docker](https://www.docker.com/) generates a lot of garbage
    (like unused layers, images, containers, volumes, …), eating the precious disk
    space. It has been a known issue for years but since not long ago we have a dedicated
    [prune](https://docs.docker.com/engine/reference/commandline/system_prune/) command
    which cleans up all unused data:


    | `1` | `docker system prune [OPTIONS]` |


    Please note that by default the command will not clean up the volumes unless the
    `–volumes` option is specified.


    ## 11. All-in-One: The Deployment Stack


    As we have seen up to this point, you can accomplish any task using just [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    command line tool. But managing lifecycle of multiple containers connected together
    will quickly become a burden and force you to think about automating the process,
    ether with bunch of shell scripts or alike.


    The community has realized the problem early on and came up with a brilliant solution
    to that, known these days as [Docker Compose](https://docs.docker.com/compose/overview/).
    In a nutshell, [Docker Compose](https://docs.docker.com/compose/overview/) provides
    the declarative way for defining and then running multiple [Docker](https://www.docker.com/)
    containers, drastically simplifying the rather complex deployment of the containerized
    application.


    So how does it work? There are just a simple steps, some of them we already familiar
    with:


    * Prepare the images for your applications, usually by means of [Dockerfile](https://docs.docker.com/engine/reference/builder/)s

    * Use [`docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    specification to outline your stack in terms of containers

    * Use [`docker-compose`](https://docs.docker.com/compose/overview/) command line
    tool to materialize the specification


    Let us take a quick look on imaginable stack which involves the JDK image we have
    created before, `base:openjdk-131-jdk`, and [MySQL](https://hub.docker.com/_/mysql/)
    database image `mysql:8.0.2`, all put into the `docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    file.


    | `01` | `version: ''2.1''` |

    | `02` | |

    | `03` | `services:` |

    | `04` | `mysql:` |

    | `05` | `image: mysql:8.0.2` |

    | `06` | `environment:` |

    | `07` | `- MYSQL_ROOT_PASSWORD=p$ssw0rd` |

    | `08` | `- MYSQL_DATABASE=my_app_db` |

    | `09` | `expose:` |

    | `10` | `- 3306` |

    | `11` | `networks:` |

    | `12` | `- my-app-network` |

    | `13` | |

    | `14` | `java-app:` |

    | `15` | `image: base:openjdk-131-jdk` |

    | `16` | `mem_limit: 256M` |

    | `17` | `environment:` |

    | `18` | `- DB=mysql:3306` |

    | `19` | `ports:` |

    | `20` | `- 8080` |

    | `21` | `depends_on:` |

    | `22` | `- mysql` |

    | `23` | `networks:` |

    | `24` | `- my-app-network` |

    | `25` | |

    | `26` | `networks:` |

    | `27` | `my-app-network:` |

    | `28` | `driver: bridge` |


    Pretty neat and straightforward, isn’t it? The versioning of the [`docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    specification formats needs a particular discussion. The latest and recommended
    specification format is `3.x`, but `2.x` which we have used in the example above
    [is also supported and evolves independently](https://docs.docker.com/compose/compose-file/compose-versioning/).
    Why is that?

