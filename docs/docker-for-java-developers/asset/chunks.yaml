    In this introductory section of the tutorial we have looked a bit into evolution
    of virtualization mechanisms in the Linux/Unix operating systems. We have learned
    at the high level what are images, containers, their benefits comparing to traditional
    [virtual machines](https://en.wikipedia.org/wiki/Virtual_machine) and how we could
    get started using them.


    ## 8. What’s next


    We have not done much along this section while just going through bare listing
    of facts and terms. However, roll up your sleeves, in the next section we are
    going to take a closer look on [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    container engine by learning its tooling and commands.


    ### Docker for Java Developers


    # Docker over command line


    ## 1. Introduction


    In this section of the tutorial we are going to master the Swiss army knife of
    [Docker](https://www.docker.com/), its command line tool of the same name [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    and its best friend [docker-compose](https://docs.docker.com/compose/reference/overview/).
    To give these tools some credit, each of them supports myriads of different command
    line arguments and options so discussing all of them would make this section literally
    endless. Instead, we would be focusing on most useful classes of the commands,
    pointing to the relevant sections of the documentation in case you would like
    to learn more right away.


    [Docker](https://www.docker.com/) evolves very fast and as such, [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    and [docker-compose](https://docs.docker.com/compose/reference/overview/) are
    constantly changing as well, adding some new command line arguments while deprecating
    others. Breaking changes are not so rare but this is a reality [Docker](https://www.docker.com/)
    users are facing for quite a while now.


    One of the largest changes which came into effect recently concerned exactly the
    command line tooling. In the past, the [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    used to accept a single command as the first argument followed by list of options.
    However, the amount of different commands grew so large, that the tool became
    really confusing and cumbersome to use. It was decided to split the commands into
    classes (for example `image`, `container`, `network`, `volume`, `plugin`, `system`,
    …) so the every command will be preceded by its class (for example, `docker build`
    becomes `docker image build`). It was a really needed change and although the
    old-style usage of the commands is still supported, we would adhere to the recommended
    practices in the tutorial.


    The section is structured in such a way so to familiarize you with the most useful
    commands while not really digging into the details and usage scenarios. The rationale
    behind is quite simple though, in the next sections of the tutorial we are going
    to battle-test most (if not all) of them while doing really practical things.


    ## 2. Images


    It looks logical to start from the bottom and get acquainted with [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    by learning how to build images. In the first section of the tutorial we have
    briefly walked through the process but it is time to do it ourselves using [build](https://docs.docker.com/engine/reference/commandline/image_build/)
    command.


    | `1` | `docker image build [OPTIONS] PATH | URL | -` |


    As we remember, [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    builds images from the [Dockerfile](https://docs.docker.com/engine/reference/builder/)s,
    executing each instruction in the order it is specified. The PATH or URL options
    are the hints where to look for the [Dockerfile](https://docs.docker.com/engine/reference/builder/).


    Building small and efficient images, and doing so fast, is one of the key goals
    to aim for in order to be successful with [Docker](https://www.docker.com/). Image
    caching, labeling, tagging, reducing the final size of the image and many other
    topics are nicely summarized in the [best practices for writing Dockerfiles](https://docs.docker.com/engine/userguide/eng-image/dockerfile_best-practices/),
    it is highly recommended to go over this read.


    You may rarely find the need to build your own base images so let us talk instead
    what would be our choices in order to pick the base image for Java applications.


    As of now, objectively, the [Alpine Linux](https://alpinelinux.org/) is the de
    facto base Linux distribution for the containerized applications. If you happen
    to run your applications on [OpenJDK](https://en.wikipedia.org/wiki/OpenJDK),
    you are really lucky as the project’s [official DockerHub repository](https://hub.docker.com/_/openjdk/)
    provides plenty of the images based on [Alpine Linux](https://alpinelinux.org/).
    Quickly, here is a simplest [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    example:


    | `1` | `FROM openjdk:8u131-jdk-alpine` |


    | `2` | `CMD ["java", "-version"]` |


    Assuming your shell is pointing to the same folder where this [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    resides, you can build (and also tag) the image with this command:


    | `1` | `docker image build . --tag base:openjdk-131-jdk` |


    In case you bet on [Oracle JVM](https://www.oracle.com/java/technologies/index.html)
    distributions, sadly [Alpine Linux](https://alpinelinux.org/) is not officially
    supported (though you may see some people trying to marry those two). Use [Ubuntu](https://hub.docker.com/_/ubuntu/)
    or [Debian](https://hub.docker.com/_/debian/) distributions.


    In terms of which JVM version to build upon, please make sure to use at least
    `Java 8 update 131` or later, for the reasons we will discuss in the upcoming
    sections (but if you are curious, here is a [sneak peek behind the curtain](https://blogs.oracle.com/java-platform-group/java-se-support-for-docker-cpu-and-memory)).


    Along with [build](https://docs.docker.com/engine/reference/commandline/build/),
    there is a couple of very useful commands which are worth mentioning. The [ls](https://docs.docker.com/engine/reference/commandline/image_ls/)
    command shows all the images:


    | `1` | `docker image ls [OPTIONS] [REPOSITORY[:TAG]]` |


    The [history](https://docs.docker.com/engine/reference/commandline/image_history/)
    command shows the history of an image:


    | `1` | `docker image history [OPTIONS] IMAGE` |


    While the [rm](https://docs.docker.com/engine/reference/commandline/image_rm/)
    command removes one or more images:


    | `1` | `docker image rm [OPTIONS] IMAGE [IMAGE...]` |


    To interface with registries, there are [pull](https://docs.docker.com/engine/reference/commandline/image_pull/)
    and [push](https://docs.docker.com/engine/reference/commandline/image_push/) commands.
    The first one fetches the image from a registry while the latter uploads it to
    the registry.


    | `1` | `docker image pull [OPTIONS] NAME[:TAG|@DIGEST]` |


    | `2` | `docker image push [OPTIONS] NAME[:TAG]` |


    Lastly, the exceptionally useful [prune](https://docs.docker.com/engine/reference/commandline/image_prune/)
    command removes all unused images (which you have better to use with `-a` option
    all the time):


    | `1` | `docker image prune [OPTIONS]` |

    '
