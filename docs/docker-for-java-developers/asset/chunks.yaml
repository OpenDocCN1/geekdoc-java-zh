    # 面向 Java 开发者的 Docker


    # 介绍


    ## 1. 介绍


    如果你没有听过 `Docker`，那么你可能过去几年是在太阳系中某个其他行星上度过的。`Docker` 席卷了我们的行业，并在短时间内改变了许多成熟的软件开发和运维实践与模式。如今，几乎每个组织都在使用
    `Docker`（或其等物），勇敢的人甚至在生产环境中使用，而且其采用率正以惊人的速度增长。


    在教程中，我们将讨论 `Docker` 如何帮助我们这些 `Java` 开发者完成日常任务。本教程由几个部分组成，我们将涉及 `Docker` 的不同方面以及它在
    `Java` 应用开发中的适用性。


    我们将从学习基础知识开始：


    - 为什么我们应该投入时间学习 `Docker`

    - 了解 `Docker` 命令行工具

    - 使用 `REST` 接口与 `Docker` 通信


    然后，我们将转向与 `Java` 应用特别相关的 `Docker` 主题，紧位于：


    - 构建

    - 开发

    - 测试

    - 部署


