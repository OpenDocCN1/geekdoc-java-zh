    \ 镜像的示例。我们还花时间讨论了[多阶段构建](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)以及它们为实现便携、零依赖（字面意义上的！）流水线带来的机会。\n\
    \n## 8. 下一步计划\n\n在教程的下一部分中，我们将查看 [Docker](https://www.docker.com/) 如何简化开发流程和实践，特别是处理数据存储和外部（或内部）服务方面。\n\
    \n# 在 Docker 上开发\n\n## 1. 引言\n\n在[教程的最后一部分](https://www.javacodeeks.com/2017/11/docker-developers-build.html)中，我们学习了将\
    \ Java 打包（并运行）为 [Docker](https://www.docker.com/) 容器的方法。在这一部分，我们将更多地关注 [Docker](https://www.docker.com/)\
    \ 如何以非常积极的方式影响我们的实践。\n\n坦率地说，有很多领域 [Docker](https://www.docker.com/) 可能会非常有帮助。我们的讨论重点将放在\
