    \n    // 省略 getters 和 setters\n    ...\n}\n```此时，两个应用程序之间的相似性结束了，每个应用程序将遵循它们自己的惯用开发方式。\n\
    \n## 3 Gradle 与 Docker\n\n"
- fmt: "\nSo the ground is set, let us begin the journey by exploring what it takes\
    \ to integrate [Docker](https://www.docker.com/) into typical [Gradle](https://gradle.org/)\
    \ build. For this subsection you would need to have [Gradle](https://gradle.org/)\
    \ `4.3` installed on your development machine. If you don’t have it yet, please\
    \ follow the [installation instructions](https://gradle.org/install/) by choosing\
    \ any suggested method you prefer.\n\nIn order to package a typical [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application as a [Docker](https://www.docker.com/) image using [Gradle](https://gradle.org/)\
    \ we just need to include two additional plugins in `build.gradle` file:\n\n*\
    \ [Spring Boot Gradle](https://spring.io/blog/2017/04/05/spring-boot-s-new-gradle-plugin)\
    \ plugin\n* [Palantir Docker Gradle](https://github.com/palantir/gradle-docker)\
    \ plugin (but there are quite a [few alternative options available](https://plugins.gradle.org/search?term=docker))\n\
    \nThe build pipeline would basically rely on [Spring Boot Gradle](https://spring.io/blog/2017/04/05/spring-boot-s-new-gradle-plugin)\
    \ plugin to produce an [uber-jar](https://stackoverflow.com/questions/11947037/what-is-an-uber-jar)\
    \ (the term often used to describe the technique of generating a single runnable\
    \ application JAR archive) which will be later used by [Palantir Docker Gradle](https://github.com/palantir/gradle-docker)\
    \ to assemble the [Docker](https://www.docker.com/) image. Here is how the build\
    \ definition, `build.gradle` file, looks like.\n\n```gradle\n01 | buildscript\
    \ {\n02 | repositories {\n03 | maven { url 'https://repo.spring.io/libs-milestone'\
    \ }\n04 | }\n05 | \n06 | dependencies {\n07 | classpath \"org.springframework.boot:spring-boot-gradle-plugin:2.0.0.M6\"\
    \n08 | }\n09 | }\n10 | \n11 | plugins {\n12 | id 'com.palantir.docker' version\
    \ '0.13.0'\n13 | }\n14 | \n15 | apply plugin: \"org.springframework.boot\"\n16\
    \ | apply plugin: 'java'\n17 | apply plugin: 'eclipse'\n18 | apply plugin: 'application'\n\
    19 | \n20 | sourceCompatibility = 1.8\n21 | targetCompatibility = 1.8\n22 | \n\
    23 | dependencies {\n24 | compile(\"org.flywaydb:flyway-core:4.2.0\")\n25 | compile(\"\
    org.springframework.boot:spring-boot-starter-webflux:2.0.0.M6\")\n26 | compile(\"\
    org.springframework.boot:spring-boot-starter-data-jpa:2.0.0.M6\")\n27 | compile(\"\
    org.springframework.boot:spring-boot-starter-actuator:2.0.0.M6\")\n28 | compile(\"\
    mysql:mysql-connector-java:8.0.7-dmr\")\n29 | }\n30 | \n31 | repositories {\n\
    32 | maven {\n33 | mavenCentral()\n34 | url 'https://repo.spring.io/libs-milestone'\n\
    35 | }\n36 | }\n37 | \n38 | springBoot {\n39 | mainClassName = \"com.javacodegeeks.spring.AppStarter\"\
    \n40 | }\n41 | \n42 | jar {\n43 | mainClassName = \"com.javacodegeeks.spring.AppStarter\"\
    \n44 | baseName = 'spring-boot-webapp '\n45 | version = project.version\n46 |\
    \ }\n47 | \n48 | bootJar {\n49 | baseName = 'spring-boot-webapp '\n50 | version\
    \ = project.version\n51 | }\n52 | \n53 | docker {\n54 | name \"jcg/spring-boot-webapp:$project.version\"\
    \n55 | tags 'latest'\n56 | dependsOn build\n57 | files bootJar\n58 | dockerfile\
    \ file('src/main/docker/Dockerfile')\n59 | buildArgs([BUILD_VERSION: project.version])\n\
    60 | }\n```\n\nThat is actually pretty straightforward, all the meat is essentially\
    \ inside the `docker` section of the `build.gradle` file. You may also notice\
    \ that we are using our own [Dockerfile](https://docs.docker.com/engine/reference/builder/),\
    \ `src/main/docker/Dockerfile`, to supply the instructions.\n\n```dockerfile\n\
    01 FROM openjdk:8-alpine\n02 ARG BUILD_VERSION\n03 ENV DB_HOST\n04 ENV DB_PORT\n\
    05 ADD spring-boot-webapp-${BUILD_VERSION}.jar\n06 EXPOSE 19900\n07 ENTRYPOINT\
    \ exec $JAVA_OPTS -Ddb.host=$DB_HOST -Ddb.port=$DB_PORT -jar spring-webapp.jar\n\
    ```\n\nIndeed, as simple as it could be. Please notice the usage of `ENV` (https://docs.docker.com/engine/reference/builder/#env)\
    \ to pass the `ARG` (https://github.com/palantir/gradle-docker/issues/149) in\
    \ the `build.gradle` file. Awesome, so what is next? Well, we just need to trigger\
    \ [Gradle](https://gradle.org/) build, like:\n\n```bash\n> gradle docker\n```\n\
    \nBUILD SUCCESSFUL in 12s\n15 actionable: 14 executed.\n\nLet us check if we have\
    \ our image locally.\n\n```bash\n> docker image ls\nREPOSITORY              TAG\
    \             IMAGE ID       CREATED          SIZE\njcg/spring-boot-webapp  0.1-SNAPSHOT\
    \   65057cae9ba   21 seconds ago   133MB\n<none>                  latest     \
    \     ...             ...\n```\n\nNice, the new image is there, right from the\
    \ oven. We could run it immediately, using [docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ command line tool, but first we need to have the [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ container available somewhere. Luckily, we did it so many times that it will\
    \ not puzzle us.\n\n```bash\n> docker run --rm -d \\\n--name mysql \\\n-e MYSQL_ROOT_PASSWORD='p$ssw0rd'\
    \ \\\n-e MYSQL_DATABASE=my_app_db \\\n-e MYSQL_ROOT_HOST=% \\\nmysql:8.0.2\n```\n\
    \nNow we are ready to run our application as a [Docker](https://www.docker.com/)\
    \ container. There are multiple ways we could use to reference the [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ container, with [user-defined networking](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)\
    \ being the preferred option. For the simple cases like ours we may just refer\
    \ to it by assigning to `DB_HOST` environment variable the IP address of the running\
    \ MySQL container, for example:\n\n```bash\n> docker run -d --rm \\\n--name spring-boot-webapp\
    \ \\\n-p 19900:19900 \\\n```\n"
