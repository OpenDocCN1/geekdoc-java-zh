- fmt: "Next come the important ones but not very obvious. We would need the username\
    \ and password in order to be able to download the official [Oracle JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ distribution (as we all remember, the licensing agreement should be accepted\
    \ before doing that).\n\n| `1` | `ENV ORACLE_JDK_USER` `\"<username>\"` |\n| `2`\
    \ | `ENV ORACLE_JDK_PASSWORD` `\"<password>\"` |\n\nIf we just build the image\
    \ at this stage and run the container out of it, we would end up with a fully\
    \ functional [Jenkins](https://jenkins.io/) instance but without any tooling,\
    \ security or jobs configured. As our goal is full automation, we are going to\
    \ use [Jenkins](https://jenkins.io/) scripting (based on [Groovy](http://groovy-lang.org/))\
    \ capabilities to accomplish that.\n\nThe uncomplicated example of the script\
    \ would be a good starting point to understand the core idea behind [Jenkins](https://jenkins.io/)\
    \ automation, here is the `init.groovy` one.\n\n```groovy\ndef instance = Jenkins.getInstance()\n\
    instance.setNumExecutors(5)\ninstance.setSlaveAgentPort([55001])\n```\n\nIt does\
    \ not look scary at all. Progressively adding more meat, let us take a look on\
    \ the next script which configures security setting to access [Jenkins](https://jenkins.io/)\
    \ instance, `security.groovy`.\n\n```groovy\n// Get system environment\ndef env\
    \ = System.getenv()\ndef instance = Jenkins.getInstance()\ninstance.setSecurityRealm(new\
    \ HudsonPrivateSecurityRealm(false))\ninstance.setAuthorizationStrategy(new GlobalMatrixAuthorizationStrategy())\n\
    \ndef user = instance.getSecurityRealm().createAccount(env.JENKINS_USER, env.JENKINS_PASS)\n\
    user.save()\n\ninstance.getAuthorizationStrategy().add(Jenkins.ADMINISTER, env.JENKINS_USER)\n\
    instance.save()\n```\n\nYou can also spot how we use the `JENKINS_USER` and `JENKINS_PASS`\
    \ environment variables from the [Dockerfile](https://docs.docker.com/engine/reference/builder/)\
    \ definition above. Moving forward, the next thing we are going to do is to store\
    \ the private key (which we have copied to the image before) to access the [SCM](https://en.wikipedia.org/wiki/Version_control)\
    \ of our choice, scripted in the `credentials.groovy`.\n\n```groovy\ndef instance\
    \ = Jenkins.getInstance()\nString keyfile = \"/var/jenkins_home/.ssh/id_rsa\"\n\
    def domain = Domain.global()\ndef store = instance.getExtensionList('com.cloudbees.plugins.credentials.SystemCredentialsProvider')[0].getStore()\n\
    \ndef credentials = new BasicSSHUserPrivateKey(\n  CredentialsScope.GLOBAL,\n\
    \  \"22d9d94b-2794-4d0c-8576-accf87764d0f\",\n  \"jenkins\",\n  new BasicSSHUserPrivateKey.FileOnMasterPrivateKeySource(keyfile),\n\
    \  \"\",\n  \"\"\n)\n\nstore.addCredentials(domain, credentials)\n```\n\nAs we\
    \ have decided to focus on [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application, and already come up with a [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)\
    \ for that, it would be good to preinstall [Oracle JDK 8](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ (latest version is `8u162`) and [Gradle](https://gradle.org/) tooling (the version\
    \ we use is `4.3.0`, although not latest but let us stick to it). The `jdk.groovy`\
    \ snippet is taking care of [Oracle JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ configuration.\n\n```groovy\ndef env = System.getenv()\ndef instance = Jenkins.getInstance()\n\
    def descriptor = instance.getDescriptor(\"hudson.model.JDK\")\ndef installations\
    \ = []\ndef installer = new JDKInstaller(\"jdk-8u162-oth-PR\", true)\ndef installerProps\
    \ = new InstallSource([installer])\ndef installation = new JDK(\"jdk-8u162\",\
    \ \"\", installerProps)\ninstallations.push(installation)\ndescriptor.setInstallations(installations.toArray(new\
    \ JDK[]))\ndescriptor.save()\ndef jdkInstaller = instance.getDescriptor(\"hudson.tools.JDKInstaller\"\
    )\njdkInstaller.doCredential(env.JENKINS_USER, env.JENKINS_PASSWORD)\n```\n\n\
    Please notice the mandatory step to configure username and password to download\
    \ the [JDK](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
    \ (using `ORACLE_JDK_USER` and `ORACLE_JDK_PASSWORD` environment variables). On\
    \ the other side, `gradle.groovy` is looking much simpler.\n\n```groovy\ndef instance\
    \ = Jenkins.getInstance()\ndef gradle = new GradleInstallation(\"Gradle 4.3.0\"\
    , \"\", [new InstallProperty([new GradleInstaller(\"4.3.0\")])])\ndef descriptor\
    \ = instance.getDescriptorByType(GradleInstallation.Descriptor)\ndescriptor.setInstallations(gradle)\n\
    descriptor.save()\n```\n\nTerrific so far, but the most interesting script is\
    \ left in the end. It is the pipeline configuration stored in `pipeline.groovy`.\n\
    \n```groovy\ndef env = System.getenv()\ndef instance = Jenkins.getInstance()\n\
    \ndef project = instance.createProject(WorkflowBranchProject, 'spring-boot-webapp')\n\
    GitSCMSource gitSCMSource = new GitSCMSource(null, env.GIT_URL, \"22d9d94b-2794-4d0c-8576-accf87764d0f\"\
    , \"\", false)\nproject.getSourcesList().add(new BranchSource(gitSCMSource))\n\
    ```\n\nPlease notice how we reference the credentials preconfigured in the `credentials.groovy`\
    \ by using the unique identifier, `22d9d94b-2794-4d0c-8576-accf87764d0f`. The\
    \ URL to [Git](https://git-scm.com/) repository comes from the environment variable\
    \ `GIT_URL`.\n\nAnd as the last step, let us copy all the scripts to our image\
    \ to give [Jenkins](https://jenkins.io/) a chance to execute them during the initialization\
    \ phase.\n\n```\nCOPY scripts/init.groovy /usr/share/jenkins/ref/init.groovy.d/init.groovy\n\
    COPY scripts/credentials.groovy /usr/share/jenkins/ref/init.groovy.d/credentials.groovy\n\
    COPY scripts/pipeline.groovy /usr/share/jenkins/ref/init.groovy.d/pipeline.groovy\n\
    COPY scripts/security.groovy /usr/share/jenkins/ref/init.groovy.d/security.groovy\n\
    COPY scripts/jdk.groovy /usr/share/jenkins/ref/init.groovy.d/jdk.groovy\nCOPY\
    \ scripts/gradle.groovy /usr/share/jenkins/ref/init.groovy.d/gradle.groovy\n```\n\
    \nAwesome, the only thing which we have to do manually (but one time only) is\
    \ to authorize `github/id_rsa.pub` key to have read-only access to your [Github](https://github.com/)\
    \ (or [Bitbucket](https://bitbucket.org/), [Gitlab](https://bitbucket.org/), …)\
    \ repository. When it is done, we could go ahead and build the image:\n\n```bash\n\
    docker build . --tag jenkins:jcg\n```\n\nAnd run our [Jenkins](https://jenkins.io/)\
    \ container right away.\n\n```bash\ndocker run --rm -p 8083:8083 -p 50001:50001\
    \ -v /var/run/docker.sock:/var/run/docker.sock --privileged jenkins:jcg\n```\n\
    \nOnce the container is started, we could navigate to [https://localhost:8083](https://localhost:8083)\
    \ and use the username `admin` and password `ef8a7543087c4b999cbecdd57696f557`\
    \ to login, scan the pipeline, wait for the build and check out our `spring-boot-webapp-pipeline`\
    \ job status.\n"
