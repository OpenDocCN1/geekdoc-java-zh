    applications as [Docker](https://www.docker.com/) images using [Gradle](https://gradle.org/).


    ## 4\. Gradle on Docker


    It turns out that building [Docker](https://www.docker.com/) images with [Gradle](https://gradle.org/)
    is not painful at all. But still, the prerequisite to have [Gradle](https://gradle.org/)
    installed on the target system, along with JDK/JRE, requires some preliminary
    work to be done. It may not be an issue let say for development, as it is very
    likely you would have all of that (and many more) installed anyway.


    In the case of cloud deployments or CI/CD pipelines, this could be an issue though,
    incurring additional costs in terms of work or/and maintenance. Could we somehow
    find a way to get rid of such overhead and rely on [Docker](https://www.docker.com/)
    entirely? Yes, in fact we can, by adopting [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/),
    one of the recent additions to the [Docker](https://www.docker.com/) feature set.


    If you are wondering how it may help us, here is the idea. Essentially, we are
    going to follow the regular procedure to build the image from the [Dockerfile](https://docs.docker.com/engine/reference/builder/).
    But the [Dockerfile](https://docs.docker.com/engine/reference/builder/) would
    actually contain two image definitions. The first one (based on the one of the
    [official Gradle images](https://hub.docker.com/_/gradle/)) instructs the [Docker](https://www.docker.com/)
    to run the [Gradle](https://gradle.org/) build of our [Spring Boot](https://projects.spring.io/spring-boot/)
    application. The second one would pick the binaries produced by the first image
    and create the final [Docker](https://www.docker.com/)  image with our [Spring
    Boot](https://projects.spring.io/spring-boot/) application sealed inside (much
    like we have done before).


    It might be better to see it once than trying to explain it. The `Dockerfile.build`
    file below illustrates this idea in action, using [multi-stage build](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)
    instructions.


