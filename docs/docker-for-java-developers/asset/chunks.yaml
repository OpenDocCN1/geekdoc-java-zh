    [Dockerfile](https://docs.docker.com/engine/reference/builder/) 中的每条指令都会创建一个新层，因此每个镜像最后都有一列表不可变的层，这些层堆叠在一起，代表了文件系统的差异。


    在接下来的章节中，我们将编写许多不同的 [Dockerfile](https://docs.docker.com/engine/reference/builder/)，并严格遵循[最佳实践和建议](https://docs.docker.com/userguide/eng-image/dockerfile_best-practices/)。


    ### 3.3. 容器


    当你准备好镜像后，就是时候让它们运行起来了。这就是容器登场的地方：它们是镜像的可运行实例。只要目标主机（安装了 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)）有足够的资源，你就可以运行任意数量的容器。这一切都是可行的，因为容器之间有着良好的隔离，至少在默认情况下如此（不过，你有有很多选项可以控制这一点）。


    当 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 创建一个 `container`
    实例时，它会在底层镜像层栈之上`添加一个新的可写层`，通常称为 `container layer`。对运行中容器进行的所有更改（例如创建、删除或修改文件）都会写入这个薄层中。


    将容器认为是转瞬即逝的重要的：当容器被终止（停止并删除）时，其状态的任何更改都会消失（除非它们存储在持久化存储中）。


    到目前，[Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 内部使用它自己的镜像格式，并严重依赖
    [libcontainer](https://github.com/opencontainers/runc/tree/master/libcontainer)
    和 [runc](https://github.com/opencontainers/runc) 来启动和运行容器。


    ### 3.4. 注册表


    [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 架构中注册表的目的是存储镜像，以便它们可以共享并作为基础镜像。[Docker
    Hub](https://hub.docker.com/) 和 [Docker Cloud](https://cloud.docker.com/) 是任何人都可以使用的知名公共注册表。为了保持简单，[Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    配置为默认在 [Docker Hub](https://hub.docker.com/) 上查找镜像。


    你可能还会考虑托管自己的私有 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 注册表（或多个注册表）。这样做有很多很好的理由，特别是在企业世界。其中最关键的理由之一是安全性，因为公共镜像没有经过全面的安全审核，并且可能存在已知的[安全漏洞或暴露](http://dl.acm.org/citation.cfm?id=3029832)。然而，情况正在好转，因为越来越多的公司维护所谓的[官方仓库](https://docs.docker.com/docker-hub/official_repos/)，这些仓库是经过筛选并符合更高标准的。


    为了让事情更有趣，最近有一位新玩家加入了注册表游戏。[Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    的旗舰产品 [Docker Store](https://docs.docker.com/docker-store/) 已经宣布将开放可用。


    ### 3.5. 镜像是新的 RPM


    随着 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)和其他容器引擎变得越来越流行和普及，我们以前打包和分发应用程序的方式也发生了剧烈变化。从字面上说，镜像变成了一个“新的
    RPM”，这意味着你可以将其分发到任何支持你所选容器引擎的平台（稍后详细介绍），并直接将其作为容器运行。这确实容易、简单且强大。


    ## 4. Moby: Docker 的未来


    [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 最近见到了许多变化。在将 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    拆分为模块化组件并整合所有开源协作的倡议推动下，Moby Project](https://mobyproject.org/) 应生了。


    > Moby 项目是一个全新的开源项目，旨在推进软件容器化运动，并帮助生态系统让容器成为主流。它提供了一个组件库、一个将它们组装成自定义容器系统的框架，以及一个供所有容器爱好者实验和交流想法的地方。
    – [`blog.docker.com/2017/04/introducing-the-moby-project/`](https://blog.docker.com/2017/04/introducing-the-moby-project/)


    随着 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 继续被拆分为更多组件，[Moby
    Project](https://mobyproject.org/) 将成为这些组件的家园，因此让我们关注它并期待令人兴奋的公告。


    ## 5. 迈向互操作性


    目前有多种以应用程序为中心的容器引擎，即 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)
    和 [rkt](https://coreos.com/rkt)（很可能会出现），明显的问题将是：如何选择一个？


    事实上，目前如果你选择了一个容器引擎，你可能必须坚持它，因为切换到另一个可能是困难的。但有一个希望，感谢于 [Open Container Initiative](https://www.opencontainers.org/)（或简称
    `OCI`），如果有足够的玩家支持，容器引擎的互操作性将显著提高。


    我们之前提到过，目前 [Docker](https://en.wikipedia.org/wiki/Docker_%28software%29) 使用自己的镜像格式。幸运的是，该领域开放的重要里程碑最近通过发布
    [OCI 运行时和镜像规范](https://blog.docker.com/2017/07/oci-of-runtime-and-image-specifications/)
    实现了。


    ## 6. Docker 和 Java


    关于在容器内部使用 [Java](https://www.java.com/en/) 的法律后果或许可考虑因素，最近有很多讨论。[Oracle](https://www.oracle.com/index.html)
    对此事的官方立场在问答部分进行了很好的总结：


    > 对于 Java SE 是否有针对 Docker 特有的许可考虑因素？


    > 不。Docker 是一个容器化平台，与任何操作系统、虚拟化或打包格式相比，在使用或重新发行方面没有独特或特殊的限制。Oracle JDK 在 Docker
    生态系统中广泛使用和采用。 – [`blog.docker.com/developers/official-docker-image-for-oracle-java-and-the-openjdk-roadmap-for-containers/`](https://blog.docker.com/developers/official-docker-image-for-oracle-java-and-the-openjdk-roadmap-for-containers/)


    虽然答案仅提到了 Docker，但它同样适用于其他容器虚拟化引擎。


    为了证明这一点，[Oracle](https://www.oracle.com/index.html) 已将官方 [Oracle Java 8 SE (Server
    JRE)](https://store.docker.com/images/oracle-serverjre-8) 镜像发布到 [Docker Store](https://store.docker.com/)，这是寻找以
    Docker 镜像分发的受信任商业和免费软件的地方之一。


