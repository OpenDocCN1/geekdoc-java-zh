    Java 开发者的 Docker


    # 在 Docker 上部署


    ## 1. 引言


    在 [Docker](https://www.docker.com/) 出现之前，许多公司就已经使用基于容器的虚拟化技术在生产环境中部署应用程序（包括基于
    JVM 的应用程序）。然而，主要因为 [Docker](https://www.docker.com/) 的出现，使用容器的部署实践在如今已成为主流。


    在教程的这一部分中，我们将浏览一些最流行的编排和集群管理引擎（也涵盖了一些云服务），它们原生支持容器化应用的部署和生命周期管理。


    我们将讨论的话题值得写好几本书（至少！），所以这部分的目标是作为一个介绍。如果你对其中任何内容产生特别兴趣，公共访问领域有大量的资源可用。


    ## 2. 容器作为部署单元


    如今，容器（特别是 [Docker](https://www.docker.com/) 容器）已成为标准的软件部署单元。它们预装了应用程序运行可能需要的所有内容：代码（或二进制文件）、运行时、系统工具和库，任何你想到的。


    管理和编排基于容器的部署是一个非常热门的话题，正如我们即将看到的，现有的每一个解决方案从一开始就提供了这种功能。


    ## 3. 使用 Kubernetes 进行编排


    在极少数还没听说过它的情况下，[Kubernetes](https://kubernetes.io/) 是一个用于自动化部署、扩展和管理容器化应用的开源系统。它是开源社区中最令人兴奋、创新创新且最活跃的项目之一。可能，如果你或你的公司正在寻找容器编排解决方案，[Kubernetes](https://kubernetes.io/)
    是目前的事实标准。


    [Kubernetes](https://kubernetes.io/) 能为你做很多事情，但在教程的这部分，我们将看到如何仅使用 [Kubernetes](https://kubernetes.io/)
    特性的最小子集，轻松地部署我们的容器化 [Spring Boot](https://projects.spring.io/spring-boot/) 应用栈，包括
    [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)。


    在本地机器上搭建一个完整的 [Kubernetes](https://kubernetes.io/) 集群听起来可能不太实际，但幸运的是，[Kubernetes](https://kubernetes.io/)可以通过
    [minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#quickstart)
    以开发模式部署。这个强大的工具会在虚拟机内部启动单节点 [Kubernetes](https://kubernetes.io/) 集群，这样你就可以使用笔记本电脑或桌面电脑进行日常开发。


    假设你已经在选择的操作系统上[安装了 minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#installation)，让我们进入下一步，并在上面部署几个
    [Docker](https://www.docker.com/) 容器。


    ```bash

    | 1 | $ minikube start

    ```


    当 [minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#quickstart)
    启动时，我们可以立即启动 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/) 部署，坚持我们在整个教程中使用的版本
    `8.0.2`。


    ```bash

    | 1 | $ kubectl run mysql --image=mysql:8.0.2 --env=''MYSQL_ROOT_PASSWORD=p$ssw0rd''
    --env=''MYSQL_DATABASE=my_app_db'' --env=''MYSQL_ROOT_HOST=%%'' --port=3306

    ```


    这需要一些时间，最后你应该能看到 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/) 容器（或者准确地说，是
    [Kubernetes](https://kubernetes.io/) pod）正在运行：


    ```bash

    | 1 | $ kubectl get pod

    | 2 | NAME READY STATUS RESTARTS AGE

    | 3 | mysql-5d4dbcd58-6ck 1/1 Running 0 22m

    ```


    太棒了，现在我们需要使用已部署的 [Kubernetes](https://kubernetes.io/) 集群的 [Docker](https://www.docker.com/)
    设置，重新构建我们之前之前开发的 [Spring Boot](https://projects.spring.io/spring-boot/) 应用的 Docker
    镜像（或者，我们也可以使用私有仓库）。


    ```bash

    | 1 | $ eval $(minikube env) |

    | 2 | $ docker build \

    | 3 | --build-arg BUILD_VERSION=0.1-SNAPSHOT |

    | 4 | -f Dockerfile.build |

    | 5 | -t jcg/spring-boot:latest |

    | 6 | -t jcg/spring-boot:0.1-SNAPSHOT

    ```


    完成这一步后，我们就有了可用于 [Kubernetes](https://kubernetes.io/) 部署的 [Docker](https://www.docker.com/)
    镜像，并可以将其作为另一个 pod 运行。


    ```bash

    | 1 | $ kubectl run spring-boot-webapp --image=jcg/spring-boot:latest --env=''DB_HOST=mysql.default.svc.local''
    --port=19900 --image-pull-policy=Never

    ```


    让我们检查是否有两个 pod 正在运行：


    ```bash

    | 1 | $ kubectl get pod

    | 2 | NAME READY STATUS RESTARTS AGE

    | 3 | mysql-5d4dbcd58-ck 1/1 Running 0 33m

    | 4 | spring-boot-webapp-5ff845bf5-gfqv 1/1 Running 0 31m

    ```


    最后但同样重要，我们必须将我们的 [Spring Boot](https://projects.spring.io/spring-boot/) 应用部署暴露为
    [Kubernetes](https://kubernetes.io/) 服务以便可以访问：


    ```bash

    | 1 | $ kubectl expose deployment spring-boot-webapp --type=NodePort

    ```


    并快速检查它是否列在其他服务之中：


    ```bash

    | 1 | $ kubectl. get service

    | 2 | NAME TYPE CLUSTER-IP EXTERNAL-IP PORT(S) AGE

    | 3 | kubernetes ClusterIP 10.96.0.1 443/TCP 4d

    | 4 | spring-boot-webapp NodePort 10.109.108.87 19900:30253/TCP 40s

    ```


    基本上就是这样，通过几个简单的步骤，我们让 [Docker](https://www.docker.com/) 容器启动并运行，且全部由 [Kubernetes](https://kubernetes.io/)
    管理。让我们确保应用程序实际上通过了所有的健康检查：


    ```bash

    | 01 | $ curl $(minikube service spring-boot-webapp --url)/application/health

    | 02 | {

    | 03 | "status": "UP",

    | 04 | "details": {

    | 05 | "diskSpace": {

    ```


