    任何正在运行的容器都可以通过 [connect](https://docs.docker.com/engine/reference/commandline/network_connect/)
    和 [disconnect](https://docs.docker.com/engine/reference/commandline/network_disconnect/)
    命令分别连接到网络或断开网络。


    | `1` | `docker network connect [OPTIONS] NETWORK CONTAINER` |

    | `2` | `docker network disconnect [OPTIONS] NETWORK CONTAINER` |


    此外，可以通过向 [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    命令传递选项，将容器连接到特定的网络。可以通过 [prune](https://docs.docker.com/engine/reference/commandline/network_prune/)
    命令删除所有未使用的网络。


    | `1` | `docker network prune [OPTIONS]` |


    ## 7. 链接 (Linking)


    通常情况下，你的应用栈由许多相互连接的组件组成，而不是独立的运行实体（一个典型的例子是与 [MySQL](https://hub.docker.com/_/mysql/)
    数据存储通信的 Java 服务端应用）。将此映射到容器世界，你需要一组能够以某种方式发现其上游依赖并相互通信的容器。在 [Docker](https://www.docker.com/)
    中，这曾被称为 [linking](https://docs.docker.com/engine/userguide/networking/default_network/dockerlinks/)，但现在可以通过使用
    [用户定义网络](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)
    轻松实现（这也是推荐的做法）。


    ## 8. 健康检查 (Health Checks)


    通常 [Docker](https://www.docker.com/) 守护进程配置容器的速度非常快，但这并不意味着容器内部的应用程序已经就绪并功能完备。对于许多
    [Docker](https://www.docker.com/) 用户来说，这曾是最令人头疼的问题之一，迫使社区针对该问题提出了许多临时解决方案。


    但要感谢 [Docker](https://www.docker.com/) 团队，我们现在拥有了 [健康检查](https://docs.docker.com/engine/reference/builder/#healthcheck)（可以在
    [Dockerfile](https://docs.docker.com/engine/reference/builder/) 中指定，或使用 [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    命令的选项）。它是一个额外的验证层，指示 [Docker](https://www.docker.com/) 如何测试容器内部应用程序是否正在运行。这导致增加了一个
    `health status` 属性，以补充常规的容器状态。


    ## 9. 资源限制 (Resource Limits)


    有趣的是，默认情况下，容器没有资源限制，可能会消耗其宿主机操作系统的所有资源。这本是一个致命的问题，但幸运的是 [Docker](https://docs.docker.com/)
    提供了 [一种控制](https://docs.docker.com/engine/admin/resource_constraints/) 方法，通过向
    [run](https://docs.docker.com/engine/reference/commandline/container_run/) 命令传递多个选项，来限制特定容器可以使用多少内存、CPU
    或块 I/O。或者，对于正在运行的容器，[update](https://docs.docker.com/engine/reference/commandline/container_update/)
    命令允许动态调整容器配置（主配置、资源限制）。


    查看源码打印?


    | `1` | `docker container update [OPTIONS] CONTAINER [CONTAINER...]` |


    对于容器内部运行的 JVM，CPU 和内存限制的主题变得稍微复杂了一些。从 `Java SE 8u131`（以及无疑在 `JDK 9`）及更高版本开始，[JVM
    已经能够感知 Docker](https://blogs.oracle.com/java-platform-group/java-se-support-for-docker-cpu-and-memory-limits)，只需进行少微调优，就能按照规则良好地运行。


    ## 10. 清理 (Clean up)


    正如我们目前所见，你可以使用 [Docker](https://www.docker.com/) 管理许多抽象内容。然而，随着时间的推移，[Docker](https://www.docker.com/)
    会产生大量垃圾（如未使用的层、镜像、容器、卷等……），占用宝贵的磁盘空间。这已是一个已知问题多年，但不久前，我们有了一个专门的 [prune](https://docs.docker.com/engine/reference/commandline/system_prune/)
    命令来清理所有未使用的数据：


    | `1` | `docker system prune [OPTIONS]` |


    请注意，默认情况下，除非指定 `–volumes` 选项，否则该命令不会清理卷。


    ## 11. 一体化：部署栈 (The Deployment Stack)


    正如我们到为止看到的，仅使用 [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    命令行工具即可完成任何任务。但管理相互连接的多个容器的生命周期将迅速变成负担，并迫使你考虑自动化该过程，无论是使用一系列 Shell 脚本还是类似的工具。


    社区早就意识到了这个问题，并提出了一个天才的解决方案，现在被称为 [Docker Compose](https://docs.docker.com/compose/overview/)。简而言之，[Docker
    Compose](https://docs.docker.com/compose/overview/) 提供了一种声明式的方法，用于定义并随后运行多个 [Docker](https://docs.docker.com/)
    容器，极大地简化了复杂的容器化部署。


    它是如何工作的？只有几个简单的步骤，我们熟悉的：


    * 通过 [Dockerfile](https://docs.docker.com/engine/reference/builder/) 为你的应用程序准备镜像

    * 使用 [`docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    规范定义你的容器栈

    * 使用 [`docker-compose`](https://docs.docker.com/compose/overview/) 命令行工具实现规范


    让我们快速看一下一个栈，它包含了之前创建的 JDK 镜像 `base:openjdk-131-jdk` 和 [MySQL](https://hub.docker.com/_/mysql/)
    数据库镜像 `mysql:8.0.2`，全部放入 `docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    文件中


    | `01` | `version: ''2.1''` |

    | `02` | |

    | `03` | `services:` |

    | `04` | `mysql:` |

    | `05` | `image: mysql:8.0.2` |

    | `06` | `environment:` |

    | `07` | `- MYSQL_ROOT_PASSWORD=p$ssw0rd` |

    | `08` | `- MYSQL_DATABASE=my_app_db` |

    | `09` | `expose:` |

    | `10` | `- 3306` |

    | `11` | `networks:` |

    | `12` | `- my-app-network` |

    | `13` | |

    | `14` | `java-app:` |

    | `15` | `image: base:openjdk-131-jdk` |

    | `16` | `mem_limit: 256M` |

    | `17` | `environment:` |

    | `18` | `- DB=mysql:3306` |

    | `19` | `ports:` |

    | `20` | `- 8080` |

    | `21` | `depends_on:` |

    | `22` | `- mysql` |

    | `23` | `networks:` |

    | `24` | `- my-app-network` |

    | `25` | |

    | `26` | `networks:` |

    | `27` | `my-app-network:` |

    | `28` | `driver: bridge` |


    非常整洁且直观，不是吗？[`docker-compose.yml`](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    规范的版本格式需要专门讨论。最新且推荐的规范格式是 `3.x`，但我们在上面示例使用的 `2.x` [同样支持并独立演进](https://docs.docker.com/compose/compose-file/compose-versioning/)。为什么这样？


