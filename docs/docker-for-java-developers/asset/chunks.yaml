  trans: "\n它与 [TestContainers](https://www.testcontainers.org/) 有一些不同之处，但总的来说，这个测试用例看起来已经很熟悉了。[Arquillian\
    \ Cube](http://arquillian.org/arquillian-cube/) 目前似乎还不支持（至少在运行 [Container Objects\
    \ DSL](http://arquillian.org/arquillian-cube/#_container_objects_dsl) 时）的一个关键特性是网络别名（network\
    \ aliasing），因此为了连接我们的 [Spring Boot](https://projects.spring.io/spring-boot/) 应用和\
    \ [MySQL](https://www.mysql.com/) 后端，我们不得不退回到[传统的容器链接](https://docs.docker.com/engine/userguide/networking/default_network/dockerlinks/)。\n\
    \n值得一提的是[Arquillian Cube](http://arquillian.org/arquillian-cube/) 有许多其他方法可以从测试场景中管理\
    \ [Docker](https://www.docker.com/) 容器，包括对 [Docker Compose](https://www.testcontainers.org/usage/docker_compose.html)\
    \ 规范的支持。顺便提一下，[Arquillian](http://arquillian.org/) 周围的开发速度令人惊叹，它完全有机会成为现代 Java\
    \ 应用的一站式测试平台。\n\n## 7. Overcast\n\n[Overcast](https://github.com/xebialabs/overcast)\
    \ 是来自 [XebiaLabs](https://xebialabs.com/) 的 Java 库，旨在对云端主机进行测试。[Overcast](https://github.com/xebialabs/overcast)\
    \ 是最早提供广泛 [Docker](https://www.docker.com/) 支持的测试框架之一，同时追求更宏大的目标：抽象测试场景中的主机管理。它有很多非常有趣的功能，但遗憾的是似乎不再活跃维护，最后一次发布于\
    \ 2015 年。尽管如此，它具有一些独特的价值，仍然值得关注。\n\n[Overcast](https://github.com/xebialabs/overcast)\
    \ 使用配置驱动的方法来描述测试下的主机，这是由于它并不仅仅面向容器和/或 [Docker](https://www.docker.com/)。\n\n```conf\n\
    mysql {\n  name=\"mysql\"\n  dockerImage=\"mysql:8.0.2\"\n  remove=true\n  removeVolume=true\n\
    \  env=[\"MYSQL_ROOT_PASSWORD=p$ssw0rd\", \"MYSQL_DATABASE=my_app_db\", \"MYSQL_ROOT_HOST=%\"\
    ]\n}\n\nspring-boot-webapp {\n  dockerImage=\"jcg/spring-boot-webapp:latest\"\n\
    \  exposeAllPorts=true\n  remove=true\n  removeVolume=true\n  env=[\"DB_HOST=mysql\"\
    ]\n  links=[\"mysql:mysql\"]\n}\n```\n\n在有了这些存储在 `overcast.conf` 中的配置后，我们可以在测试场景中通过名称来引用容器。\n\
    \n```java\npublic class SpringBootAppIntegrationTest {\n    private static CloudHost\
    \ mysql = CloudHostFactory.getCloudHost(\"mysql\");\n    private static CloudHost\
    \ javaApp = CloudHostFactory.getCloudHost(\"spring-boot-webapp\");\n\n    @BeforeClass\n\
    \    public static void setUp() {\n        mysql.setup();\n        javaApp.setup();\n\
    \n        RestAssured.baseURI = \"http\" + javaApp.getHostName();\n        RestAssured.port\
    \ = javaApp.getPort(19900);\n\n        await()\n            .atMost(20, TimeUnit.SECONDS)\n\
    \            .ignoreExceptions()\n            .pollInterval(1, TimeUnit.SECONDS)\n\
    \            .untilAsserted(() ->\n                when()\n                  \
    \  .get(\"/application/health\")\n                    .then()\n              \
    \      .statusCode(200))\n            );\n    }\n\n    @AfterClass\n    public\
    \ static void tearDown() {\n        javaApp.teardown();\n        mysql.teardown();\n\
    \    }\n\n    @Test\n    public void getAllTasks() {\n        when()\n       \
    \     .get(\"/tasks\")\n            .then()\n            .statusCode(200)\n  \
    \          .body(equalTo(\"[]\"));\n    }\n}\n```\n\n除了健康检查部分外，它看起来很直接。`Overcast`\
    \ 没有提供验证容器已启动并准备好处理请求的方法，因此我们引入了另一个优秀的库 [Awaitility](https://github.com/awaitility/awaitility)\
    \ 来补偿这一点。`Overcast` 有许多潜和优势，希望我们能看到它恢复活跃开发。对于这个示例，为了使用最新的 `Overcast` 特性，我们必须从源码构建它。\n\
    \n## 8. Docker Compose Rule\n\n最后但同样重要的是，让我们讨论 [Docker Compose Rule](https://github.com/palantir/docker-compose-rule)，这是来自\
    \ [Palantir Technologies](https://www.palantir.com/) 的一个库，用于执行与 [Docker Compose](https://docs.docker.com/compose/reference/)\
    \ 容器交互的 [JUnit](http://junit.org/4/) 测试。它在底层使用 `docker-compose` 命令行工具，目前不支持 Windows\
    \ 平台。正如你所料，我们必须从 `docker-compose.yml` 规范开始，以便之后能被 `Docker Compose Rule` 读取。这里是一个示例。\n\
    \n```yaml\nversion: '2.1'\nservices:\n  mysql:\n    image: mysql:8.0.2\n    environment:\n\
    \      - MYSQL_ROOT_PASSWORD=p$$w0rd\n      - MYSQL_DATABASE=my_app_db\n     \
    \ - MYSQL_ROOT_HOST=%\n    expose:\n      - 3306\n    healthcheck:\n      test:\
    \ [\"CMD-SHELL\", \"ss -lt :3306 | grep 3306\"]\n      interval: 10s\n      timeout:\
    \ 5s\n      retries: 3\n    tmpfs:\n      - /var/lib/mysql\n    networks:\n  \
    \    - my-app-network\n  java-app:\n    image: jcg/spring-boot-webapp:latest\n\
    \    environment:\n      - DB_HOST=mysql\n    ports:\n      - 19900\n    depends_on:\n\
    \      mysql:\n        condition: service_healthy\n    networks:\n      - my-app-network\n\
    networks:\n  my-app-network:\n    driver: bridge\n```\n\n这样，我们只需要将此规范传递给 `Docker\
    \ Compose Rule`，如下下面的代码所示。请注意，我们为场景增加了健康检查，以确保我们的 [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ 应用已完全启动。\n\n```java\npublic class SpringBootAppIntegrationTest {\n    @ClassRule\n\
    \    public static DockerComposeRule docker = DockerComposeRule.builder()\n  \
    \          .file(\"src/test/resources/docker-compose.yml\")\n            .waitingForService(\"\
    java-app\",\n                HealthChecks.toRespond2xxOverHttp(19900, (port) ->\n\
    \                    port.inFormat(\"http://\" + $HOST:$EXTERNAL_PORT/application/health\"\
    )),\n                Duration.standardSeconds(30)\n            )\n           \
    \ .shutdownStrategy(ShutdownStrategy.GRACEFUL)\n            .build();\n\n    @BeforeClass\n\
    \    public static void setUp() {\n        final DockerPort port = docker.containers().container(\"\
    java-app\").port(19900);\n        RestAssured.baseURI = port.inFormat(\"http://\"\
    \ + $HOST);\n        RestAssured.port = port.getExternalPort();\n    }\n}\n```\n\
    \n"
