    The story, which made [Docker](https://www.docker.com/) and friends possible,
    begins back in 2006, when a couple of awesome engineers at [Google](https://en.wikipedia.org/wiki/Google)
    started the work on the feature under the name “process containers”. It was later
    rebranded to “control groups” (or [cgroups](https://en.wikipedia.org/wiki/Cgroups)
    as we know them today) and was merged into the Linux kernel starting from version
    `2.6.24`, released in January 2008.


    Essentially, [cgroups](https://en.wikipedia.org/wiki/Cgroups) is a [Linux kernel](https://en.wikipedia.org/wiki/Linux_kernel)
    feature that limits, accounts for, prioritizes and isolates the [resource usage](https://en.wikipedia.org/wiki/Resource_%28computer_science%29)
    (`CPU`, `memory`, `disk I/O`, `network`, `etc.-`etc.`) of [processes](https://en.wikipedia.org/wiki/Process_%28computing%29).
    Most importantly, to support all that the [Linux kernel](https://en.wikipedia.org/wiki/Linux_kernel)
    does not need to start any [virtual machines](https://en.wikipedia.org/wiki/Virtual_machine)
    or [hypervisors](https://en.wikipedia.org/wiki/Hypervisor). Along with [namespaces](https://en.wikipedia.org/wiki/Linux_namespaces),
    another very powerful feature of the [Linux kernel](https://en.wikipedia.org/wiki/Linux_kernel),
    [cgroups](https://en.wikipedia.org/wiki/Cgroups) serve as a fundamental block
    for [containers](https://en.wikipedia.org/wiki/Operating-system_level): operating
    system-level virtualization.


    Container-based virtualization is exceptionally lightweight (comparing to traditional
    [virtual machines](https://en.wikipedia.org/wiki/Virtual_machine)), imposes little
    to no overhead, share the same operating system and do not require special hardware
    to perform efficiently. To say it in other words, containers become a new model
    to wrap the applications so they could run in isolation on a shared operating
    system without the limitations, going with containers becomes a mainstream nowadays.
    To be fair, not all Linux/Unix distributions use the same mechanisms for operating
    system-level virtualization. To mention a couple of examples, [FreeBSD](https://www.freebsd.org/)
    has [jails](https://en.wikipedia.org/wiki/FreeBSD_jail) for such purposes while
    [Solaris](https://en.wikipedia.org/wiki/Solaris_(operating_system)) has the concept
    of [zones](https://en.wikipedia.org/wiki/Solaris_Containers).


    So, how to get with containers? Well, you may have heard abbreviations [LXC](https://linuxcontainers.org/lxc/introduction/)
    or [LXD](https://linuxcontainers.org/lxd/introduction/) which are essentially
    the entry points for containers management on most of the Linux/Unix distributions.
    The thing is, those are somewhat low-level and not easy to start with. But luckily
    we have [Docker](https://en.wikipedia.org/wiki/Docker_%28software) and [rkt](https://coreos.com/rkt),
    the application-centric container engines, which right from the inception became
    the de facto choices for application developers across the globe.


    ## Docker: Containers for Masses


    So what is [Docker](https://en.wikipedia.org/wiki/Docker_%28software) essentially?
    It started off as a powerful and easy to use container engine but these days it
    would be fair to call it a full-fledged container management platform. It is written
    in [Go](https://golang.org/) and takes advantage of the Linux kernel features
    (mostly [namespaces](https://en.wikipedia.org/wiki/Linux_namespaces) and [cgroups](https://en.wikipedia.org/wiki/Cgroups))
    to do the job. The community edition is free of charge whereas the enterprise
    edition is available through subscription. To settle the stage, along this tutorial
    we are going to use the features of the community edition only.


    ### Architecture


    From the architectural perspective, [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    consists of three main parts. In the heart of [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    sits the daemon process, `dockerd` (https://docs.docker.com/engine/commandline/dockerd/).
    In turn, `dockerd` (https://docs.docker.com/engine/commandline/dockerd/) relies
    on another daemon, `containerd` (https://containerd.io/), as the abstraction layer
    to interface with the Linux kernel [namespaces](https://en.wikipedia.org/wiki/Linux_namespaces)
    and [cgroups](https://en.wikipedia.org/wiki/Cgroups). The last piece of the puzzle
    is a set of command line tools (like for example `docker` (https://docs.docker.com/engine/commandline/docker/)
    and `docker-compose` (https://docs.docker.com/compose/reference/overview/)), known
    as Docker CLI, which are able to talk to `dockerd` daemon (https://docs.docker.com/engine/commandline/dockerd/)
    though the `Docker Engine API` (https://docs.docker.com/engine/api/) it exposes.


    Each of the [Docker](https://en.wikipedia.org/wiki/Docker_%28software) components
    mentioned above deserves own tutorial, so many interesting features and capabilities
    they provide, though our focus would be primarily centered on `Docker Engine API`
    (https://docs.docker.com/engine/api/) and the Docker CLI family (`docker` and
    `docker-compose`).


    One of the strongest arguments in favor of choosing [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    is that it runs natively on the majority of the Linux distributions but it does
    not stop there. [macOS](https://www.docker.com/docker-mac) and [Windows](https://www.docker.com/docker-windows)
    operating systems are also supported pretty well, with a few caveats (https://docs.docker.com/toolbox/overview/)
    to be aware of.


    In order to understand how [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    works, we have to unveil a bit its internal model. At any time, if you feel like
    there are not enough details uncovered about the subject, please not hesitate
    to consult the official documentation (https://docs.docker.com/).


    ### Images


    In [Docker](https://en.wikipedia.org/wiki/Docker_%28software), everything you
    do is managing the specific objects. Images and containers are arguably the most
    important ones however there are others like `volumes`, `networks` and `plugins`,
    to name a few. All of them we are going to see in action in different sections
    of the tutorial, starting with images and containers right away.


    Image could be treated as a set of instructions on how to create the container.
    In [Docker](https://en.wikipedia.org/wiki/Docker_%28software), one image could
    be inherited (or based on) from another image, adding additional instructions
    on top of base ones. Each image consists of multiple layers, which are effectively
    immutable. Under the hood these layers are backed by dedicated file systems (by
    default [UnionFS](https://en.wikipedia.org/wiki/UnionFS), but others could be
    plugged in as well), making them very lightweight and fast.


    So … how could you create such images for your own needs? It is actually pretty
    simple, to build your own image in [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    you create a `Dockerfile` (https://docs.docker.com/engine/reference/builder/)
    which is just a text document that defines the set of steps (or instructions)
    required to assemble the image (and run it later). Along the way you may decide
    to create completely customized images (https://docs.docker.com/engine/userguide/eng-image/baseimages/)
    yourself or, in most cases, reference the images created by others, which are
    published in a registry (#Introduction.xhtml__Registries). To give you a sneak
    peek on how the `Dockerfile`s may look like, here is a quick example:


    ```dockerfile

    FROM alpine:3.6

    CMD ["uname", "-a"]

    ```

