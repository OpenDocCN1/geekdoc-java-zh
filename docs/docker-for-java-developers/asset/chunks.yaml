    Let us take a quick look on imaginable deployment stack which involves the JDK
    image we have created before, `base:openjdk-131-jdk`, and [MySQL](https://hub.docker.com/_/mysql/)
    database image `mysql:8.0.2`, all put into the [docker-compose.yml](https://docs.docker.com/compose/compose-file/compose-file-v2/)
    file.


