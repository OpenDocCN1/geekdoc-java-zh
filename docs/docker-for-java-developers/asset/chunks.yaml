  trans: '


    在本教程的章节中，我们将学习一些框架，它们通过利用 [Docker](https://www.docker.com/) 及其工具，极大简化了基于 JVM 的应用的集成、组件和端到端测试。


    ## 2. 在开始之前


    在[教程的第二部分](https://www.javacodegeeks.com/2017/09/docker-java-developers-docker-command-line.html)
    中，我们简要提到过，作为 [Docker](https://www.docker.com/) 容器部署的 Java 应用至少应该使用 `Java 8 update
    131` 或更高版本，但我们还没有机会详细阐述这一事实的重要性。


    为了理解这个问题，让我们关注 JVM 如何处理 Java 应用中两个最重要的资源：内存（堆）和 CPU。为了便于说明，我们将在一个专用的虚拟机上安装 [Docker](https://www.docker.com/)，该虚拟机分配了
    `2 个 CPU 核心` 和 `4GB 内存`。在记住此配置的情况下，让我们从 JVM 的视角来看这个问题：


    | `1` | `$ docker run --``rm` `openjdk:8-jdk-alpine java -XshowSettings:vm -XX:+UseParallelGC
    -XX:+PrintFlagsFinal –version` |


    控制台上将打印大量信息，但对我们来说最感兴趣的部分是 `ParallelGCThreads` 和 `VM settings`。


    | `01` | `...` |

    | `02` | `uintx ParallelGCThreads = 2` |

    | `03` | `...` |

    | `04` |   |

    | `05` | `VM settings:` |

    | `06` | `Max. Heap Size (Estimated): 992.00M` |

    | `07` | `Ergonomics Machine Class: server` |

    | `08` | `Using VM: OpenJDK 64-Bit Server VM` |

    | `09` |   |

    | `10` | `openjdk version` `"1.8.0_131"` |

    | `11` | `OpenJDK Runtime Environment (IcedTea 3.4.0) (Alpine 8.131.11-r2)` |

    | `12` | `OpenJDK 64-Bit Server VM (build 25.131-b11, mixed mode)` |


    在核心数少于（或等于）8 核的机器上，`ParallelGCThreads` [等于核心数](https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gctuning/parallel.html)，而堆的默认最大限制约为[可用物理内存的
    25%](https://docs.oracle.com/javase/8/docs/technotes/guides/vm/gc-ergonomics.html)。很酷，目前
    JVM 报告的数字合理的。


    让我们进一步尝试，使用 [Docker](https://www.docker.com/) 的资源管理能力将容器的 CPU 和内存使用分别限制为 `1 个核心`
    和 `256Mb`。


    | `1` | `$ docker run --``rm` `--cpuset-cpus=0 --memory=256m openjdk:8-jdk-alpine
    java -XshowSettings:vm -XX:+UseParallelGC -XX:+PrintFlagsFinal -version` |


    这次的情况有点不同：


    | `1` | `...` |

    | `2` | `uintx ParallelGCThreads = 1` |

    | `3` | `...` |

    | `4` |   |

    | `5` | `VM settings:` |

    | `6` | `Max. Heap Size (Estimated): 992.00M` |

    | `7` | `Ergonomics Machine Class: client` |

    | `8` | `Using VM: OpenJDK 64-Bit Server VM` |


    JVM 能够相应调整 `ParallelGCThreads`，但内存限制似乎被完全忽略了。没错，为了让 JVM 感知容器环境，我们需要开启实验性 JVM 选项：`-XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap`。


    | `1` | `$ docker run --``rm` `--cpuset-cpus=0 --memory=256m openjdk:8-jdk-alpine
    java -XshowSettings:vm -XX:+UseParallelGC -XX:+PrintFlagsFinal  -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap –version` |


    现在的结果好多了：


    | `1` | `...` |

    | `2` | `uintx ParallelGCThreads = 1` |

    | `3` | `...` |

    | `4` |   |

    | `5` | `VM settings:` |

    | `6` | `Max. Heap Size (Estimated): 112.00M` |

    | `7` | `Ergonomics Machine Class: client` |

    | `8` | `Using VM: OpenJDK 64-Bit Server VM` |


    好奇的读者可能会奇怪，为什么最大堆大小远高于分配给容器的可用物理内存的 `25%`。答案是 [Docker](https://www.docker.com/)
    也为交换空间（swap）分配了内存（如果没有指定，真实值为 `256Mb + 256Mb = 512Mb`）。


    应用很少不依赖某种数据存储。而且，不出所料，大多数此类数据存储会将数据持久化到某种存储设备上。这很好，但数据存储的存在经常使测试面临挑战，特别是在数据层面调用测试例隔离时。


    ## 3. 在内存中存储数据


    你可能已经猜到了，[Docker](https://www.docker.com/) 可以极大减少创建可复测试场景的努力。尽管如此，数据存储仍然是整体执行时间的主要贡献。


    正如我们即将看到的，[Docker](https://www.docker.com/) 有王牌可以帮助我们：[tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)。它为容器提供了一种不永久写入数据的方法，将其保留在宿主机内存中（如果内存不足则使用交换空间）。


    有多种选项可以将由 [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/) 支持的卷挂载到容器，但目前推荐的方法是使用
    `--mount` 命令行参数（如果是 [docker-compose](https://docs.docker.com/compose/) 则使用规范中的
    [tmpfs](https://docs.docker.com/compose/compose-file/#tmpfs) 章节）。


    ```bash

    docker run --rm -d \

    --name mysql \

    --mount type=tmpfs,destination=/var/lib/mysql \

    -e MYSQL_ROOT_PASSWORD=''p$ssw0rd'' \

    -e MYSQL_DATABASE=my_app_db \

    -e MYSQL_ROOT_HOST=% \

    mysql:8.0.2

    ```


    测试执行的速度提升可能是巨大的，但你永远不应该在生产环境中（极可能在任何其他环境中）中使用此功能，因为容器停止时，[tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    挂载就会消失。即使容器被提交（commit），[tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    挂载也不会被保存。


