    [Docker](https://www.docker.com/) objects (like volumes, networks, containers,
    images, …) listed on the left so you could select any of those in order to be
    redirected to a dedicated view.


    The list of supported [Docker](https://www.docker.com/) features which [Portainer](https://portainer.io/)
    exposes through the intuitive web interface is just astonishing. If you favor
    UI tools over command line ones, [Portainer](https://portainer.io/) has all the
    chances to serve as the one-stop shop for you.


