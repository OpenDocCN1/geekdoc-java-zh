    在本教程的介绍章节中，我们简要回顾了 Linux/Unix 操作系统中虚拟化机制的演进。我们从高层学习了什么是镜像、容器，它们与传统的[虚拟机](https://en.wikipedia.org/wiki/Virtual_machine)相比的优势，以及我们如何开始使用它们。


    ## 8. 下一步计划


    在这一节中，我们并没有做什么什么，只是列举了一些事实和术语。然而，请卷起袖子，在下一节中，我们将通过学习其工具链和命令，深入研究[Docker](https://en.wikipedia.org/wiki/Docker_%28software%29)容器引擎。


    ### 针对 Java 开发者的 Docker


    # 命令行上的 Docker


    ## 1. 介绍


    在教程的这一节中，我们将掌握 [Docker](https://www.docker.com/) 的“瑞士军刀”——其同名的命令行工具 [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    以及它的好搭档 [docker-compose](https://docs.docker.com/compose/reference/overview/)。为了给这些工具足够的尊重，它们中的每一个都支持无数不同的命令行参数和选项，因此讨论所有的参数将使这一节内容变得变得无止境。相反，我们将关注最实用的命令类别，并在您想立即学习更多信息时，指向文档的相关章节。


    [Docker](https://www.docker.com/) 的演进非常快，因此，[docker](https://docs.docker.com/engine/reference/commandline/cli/)
    和 [docker-compose](https://docs.docker.com/compose/reference/overview/) 也在不断变化，在添加一些新命令行参数的同时废弃了另一些。破坏性变更并不罕见，但这是
    [Docker](https://www.docker.com/) 用户面临相当一段时间的现实。


    最近生效的最重大变化之一正涉及命令行工具。过去，[docker](https://docs.docker.com/engine/reference/commandline/cli/)
    通常接受一个单一命令作为第一个参数，后面跟着一系列选项。然而，不同命令的数量增长得如此巨大，导致工具用起来变得非常混乱且笨拙。人们决定将命令分为不同的类（例如
    `image`、`container`、`network`、`volume`、`plugin`、`system`……），因此每个命令之前都会有其所属的类（例如，`docker
    build` 变为 `docker image build`）。这是一个非常需要的改变，尽管旧式的命令用法仍然受到支持，但我们将在教程中遵循推荐的实践。


    本节的结构是为了让你熟悉最实用的命令，而不会真正挖掘细节和使用场景。背后的逻辑其实很简单，在教程的接下来的章节中，我们将通过执行非常实用的操作对大部分（如果不是全部）命令进行实战。


    ## 2. 镜像


    从底层开始，通过学习如何构建镜像来熟悉 [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    是符合逻辑。在教程的第一节中，我们简要地介绍了这个过程，但是时候使用 [build](https://docs.docker.com/engine/reference/commandline/image_build/)
    命令亲自实践一次了。


    | `1` | `docker image build [OPTIONS] PATH | URL | -` |


    正如我们记得的，[docker](https://docs.docker.com/engine/reference/commandline/cli/) 从
    [Dockerfile](https://docs.docker.com/engine/reference/builder/) 中构建镜像，按照指定的顺序执行每条指令。PATH
    或 URL 选项是寻找 [Dockerfile](https://docs.docker.com/engine/reference/builder/) 的路径提示。


    构建小巧且高效的镜像并快速完成，是成功使用 [Docker](https://www.docker.com/) 的关键目标之一。镜像缓存、标签、标记、减少最终大小以及许多其他主题在[编写
    Dockerfile 的最佳实践](https://docs.docker.com/engine/userguide/eng-image/dockerfile_best-practices/)
    中都有很好的总结，强烈建议阅读此。


    你可能很少发现构建自己的基础镜像的需求，所以让我们来讨论为 Java 应用选择基础镜像时会有哪些选择。


    目前，客观来说，[Alpine Linux](https://alpinelinux.org/) 是容器化应用事实上的基础 Linux 发行版。如果你恰好在
    [OpenJDK](https://en.wikipedia.org/wiki/OpenJDK) 上运行应用程序，你就太幸运了，因为该项目的[官方 DockerHub
    仓库](https://hub.docker.com/_/openjdk/)提供了许多基于 [Alpine Linux](https://alpinelinux.org/)
    的镜像。快速来看，这里有一个简单的 [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    示例：


    | `1` | `FROM openjdk:8u131-jdk-alpine` |


    | `2` | `CMD ["java", "-version"]` |


    假设你的 shell 指向存放该 [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    的相同文件夹，你可以使用此命令构建（并加标签）镜像：


    | `1` | `docker image build . --tag base:openjdk-131-jdk` |


    如果你赌注 [Oracle JVM](https://www.oracle.com/java/technologies/index.html) 发行版，遗憾的是
    [Alpine Linux](https://alpinelinux.org/) 并不是官方支持的（尽管你可能会看到尝试结合两者）。请使用 [Ubuntu](https://hub.docker.com/_/ubuntu/)
    或 [Debian](https://hub.docker.com/_/debian/) 发行版。


    关于基于哪个 JVM 版本构建，请确保至少使用 `Java 8 update131` 或更高版本，原因我们将在后续章节中讨论（但如果你好奇，这里有一个[幕后预览](https://blogs.oracle.com/java-platform-group/java-se-support-docker-cpu-and-memory））。


    build](https://docs.docker.com/engine/reference/commandline/build/)，还有几个非常实用的命令值得提到。[ls](https://docs.docker.com/engine/reference/commandline/image_ls/)
    命令显示所有镜像：


    | `1` | `docker image ls [OPTIONS] [REPOSITORY[:TAG]]` |


    [history](https://docs.docker.com/engine/reference/commandline/image_history/)
    命令显示镜像的历史：


    | `1` | `docker image history [OPTIONS] IMAGE` |


    而 [rm](https://docs.docker.com/engine/reference/commandline/image_rm/) 命令删除一个或多个镜像：


    | `1` | `docker image rm [OPTIONS] IMAGE [IMAGE...]` |


    为了与仓库交互，有 [pull](https://docs.docker.com/engine/reference/commandline/image_pull/)
    和 [push](https://docs.docker.com/engine/reference/commandline/image_push/) 命令。前者从仓库获取镜像，后者将镜像上传到仓库。


    | `1` | `docker image pull [OPTIONS] NAME[:TAG|@DIGEST]` |


    | `2` | `docker image push [OPTIONS] NAME[:TAG]` |


    最后，异常好用的 [prune](https://docs.docker.com/engine/reference/commandline/image_prune/)
    命令删除所有未使用的镜像（你最好一直配合 `-a` 选项使用）：


    | `1` | `docker image prune [OPTIONS]` |


