    ## 12\. Conclusions


    In this section we glanced over [Docker](https://www.docker.com/) awesome command
    line tooling, [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    and [docker-compose](https://docs.docker.com/compose/reference/overview/), highlighting
    the most useful and important commands. We have not seen most of them in action
    yet but in the next sections of the tutorial each of them is going to find the
    time to appear on the stage.


    ## 12\. What’s next


    Although it is quite possible that these tools would be your primary (if not the
    only) way to deal with [Docker](https://www.docker.com/), in the next section
    of the tutorial we are going to learn the other option by leveraging [Docker Engine
    REST(ful) APIs](https://docs.docker.com/engine/api/). 


    Docker for Java Developers


    # Docker over HTTP/REST


    ## 1\. Introduction


    From the previous parts of the tutorial we already know that [Docker](https://www.docker.com/)
    not only has an awesome command line tooling, but exposes a feature-rich [Docker
    Engine API](https://docs.docker.com/engine/api/) as well. As of now, the officially
    supported clients are provided for Go and Python languages. Certainly, not very
    encouraging news for Java developer, but there is a light at the end of the tunnel.


    Quite a long time ago [Spotify](https://spotify.github.io/) started its own journey
    to develop a Java client for the [Docker Engine API](https://docs.docker.com/engine/api/)
    (more widely known as [Spotify Docker Client](https://github.com/spotify/docker-client)).
    The project is being actively maintained ever since to follow all the recent developments
    in [Docker](https://www.docker.com/) / [Engine API](https://docs.docker.com/engine/api/)
    space and is the de-facto choice for JVM based applications nowadays. It does
    the job really well but has one caveat you should be aware of: because this is
    a community effort, not the official Java client from [Docker](https://www.docker.com/),
    it takes some time to catch up with all the changes introduced by frequent [Docker](https://www.docker.com/)
    releases.


    In this section of the tutorial we will go over a few key [Docker Engine APIs](https://docs.docker.com/engine/api/)
    and demonstrate how those could be consumed from your Java applications using
    [Spotify Docker Client](https://github.com/spotify/docker-client).


    ## 2\. Versioning


    Before getting started, we have to understand how [Docker Engine API](https://docs.docker.com/engine/api/)
    is [versioned](https://docs.docker.com/engine/api/v1.30/#section/Versioning) and
    how to match the [Docker](https://www.docker.com/) release and the version of
    the API it supports. The [version](https://docs.docker.com/engine/reference/commandline/version/)
    command of the [docker](https://docs.docker.com/engine/reference/commandline/cli/)
    command line tool is what we need.


    | `01` | `$ docker version` |


    | `02` |   |


    | `03` | `Client:` |


    | `04` | `Version:      17.06.1-ce` |


    | `05` | `API version:  1.30` |


    | `06` | `Go version:   go1.8.3` |


    | `07` | `Git commit:   874a737` |


    | `08` | `Built:        Thu Aug 17 22:48:20 2017` |


    | `09` | `OS/Arch:      linux/amd64` |


    | `10` |   |


    | `11` | `Server:` |


    | `12` | `Version:      17.06.1-ce` |


    | `13` | `API version:  1.30 (minimum version 1.12)` |


    | `14` | `Go version:   go1.8.3` |


    | `15` | `Git commit:   874a737` |


    | `16` | `Built:        Thu Aug 17 22:54:55 2017` |


    | `17` | `OS/Arch:      linux/amd64` |


    | `18` | `Experimental:` `false` |


    The output is pretty straightforward. We could easily spot that our version of
    [Docker](https://www.docker.com/) is `17.06.1-ce`  and its supported [API](https://docs.docker.com/engine/api/)
    version is `1.30`.  From that, let us bookmark the [reference to Docker Engine
    API v1.30 documentation](https://docs.docker.com/engine/api/v1.30/) and roll up
    the sleeves.


    ## 3\. Getting Started


    To begin with, we would need to introduce the respective [Spotify Docker Client](https://github.com/spotify/docker-client)
    dependency to our projects. In case of [Apache Maven](https://maven.apache.org/),
    it is fairly easy:


    | `1` | `<``dependency``>` |


    | `2` | `<``groupId``>com.spotify</``groupId``>` |


    | `3` | `<``artifactId``>docker-client</``artifactId``>` |


    | `4` | `<``version``>8.9.1</``version``>` |


    | `5` | `</``dependency``>` |


    As everything else in [Docker](https://www.docker.com/)‘s ecosystem, the [Engine
    API](https://docs.docker.com/engine/api/) evolves pretty fast so it is highly
    recommended to rely on the most recent [Spotify Docker Client](https://github.com/spotify/docker-client)
    release. As of now, `8.9.1` is the latest one we could use.


    Awesome, dependency is there, so we could go ahead and create an instance of `DockerClient`
    class. There are a couple of ways to do that and, essentially, it really depends
    on which operating system (or systems) you are using (either in development, continuous
    integration or production environments).


    Probably, the quickest, safest and most portable approach would be to use `DefaultDockerClient.fromEnv`
     method which will gather the required details from the environment variables
    and will work across a range of [Docker](https://www.docker.com/) installations,
    including older Mac and Windows systems were [Docker](https://www.docker.com/)
    is not natively supported (things like [Docker Toolbox](https://docs.docker.com/toolbox/toolbox_install_windows/)
    or [boot2docker](https://github.com/boot2docker/boot2docker)).


    | `1` | `final` `DockerClient client = DefaultDockerClient` |


    | `2` | `.fromEnv()` |


    | `3` | `.build();` |


    Here we just assume the default [Docker](https://www.docker.com/) configuration
    is in place but you have a total [control over customizing](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md#creating-a-docker-client)
    it, including connection URIs, registry authentication, connection pooling, etc.
     It is important to remember that when you are done with the instance of the client,
    please close it, for example:


    | `1` | `client.close();` |


    Great, we have our [Docker](https://www.docker.com/) client instance. It is a
    single entry point to call numerous [Docker Engine APIs](https://docs.docker.com/engine/api/),
    let us take a look what we could accomplish with it.


    ## 4\. Images


    The first [Engine API](https://docs.docker.com/engine/api/) we are going to look
    at is [Images API](https://docs.docker.com/engine/api/v1.30/#tag/Image). The [Spotify
    Docker Client](https://github.com/spotify/docker-client) supports most of its
    features through a family of methods. To illustrate that, let us borrow the [Dockerfile](https://docs.docker.com/engine/reference/builder/)
    from the previous section of the tutorial and store its content in the `src/main/resources`
    folder, inside the file with name `Dockerfile`:


    | `1` | `FROM openjdk:8u131-jdk-alpine` |


    | `2` | `CMD [``"java"``,` `"-version"``]` |


