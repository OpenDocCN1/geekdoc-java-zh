    这个让 [Docker](https://www.docker.com/) 及其伙伴成为可能的故事可以追溯到 2006 年，当时 [Google](https://en.wikipedia.org/wiki/Google)
    的几个优秀工程师开始以“进程容器”（process containers）之名开发这项功能。后来它被重命名为“控制组”（或我们今天所知的 [cgroups](https://en.wikipedia.org/wiki/Cgroups）），并从
    `2.6.24` 版本开始合并到 Linux 内内核（该版本于 2008 年 1 月发布）。


    本质上，[cgroups](https://en.wikipedia.org/wiki/Cgroups) 是一种 [Linux 内核](https://en.wikipedia.org/wiki/Linux_kernel)
    功能，它能够限制、统计、优先排序和隔离 [进程](https://en.wikipedia.org/wiki/Process_%28computing%29)
    的[资源使用](https://en.wikipedia.org/wiki/Resource_%28computer_science%29)（`CPU`、`memory`、`disk
    I/O`、`network` 等）。最重要的是，为了支持这一切，[Linux 内核](https://en.wikipedia.org/wiki/Linux_kernel)
    无需启动任何[虚拟机](https://en.wikipedia.org/wiki/Virtual_machine)或[虚拟视化监控程序](https://en.wikipedia.org/wiki/Hypervisor)。与[命名空间](https://en.wikipedia.org/wiki/Linux_namespaces)（Linux
    内核另一项非常强大的功能），[cgroups](https://en.wikipedia.org/wiki/Cgroups) 是[容器](https://en.wikipedia.org/wiki/Operating-system_level)——即操作系统级虚拟化的基础构建块。


    基于容器的虚拟化极其轻量（与传统的[虚拟机](https://en.wikipedia.org/wiki/Virtual_machine)相比），产生的开销极小甚至没有，共享同一个操作系统，并且不需要特殊硬件即可高效运行。换句话说，容器变成了一种封装应用程序的新模型，使其能够在共享的操作系统上隔离运行，而不受限制；如今使用容器已成为主流。平心地说，并不是所有的
    Linux/Unix 发行版都使用相同的机制进行操作系统级虚拟化。举几个例子，[FreeBSD](https://www.freebsd.org/) 使用
    [jails](https://en.wikipedia.org/wiki/FreeBSD_jail) 用于此类目的，而 [Solaris](https://en.wikipedia.org/wiki/Solaris_(operating_system))
    则有[zones](https://en.wikipedia.org/wiki/Solaris_Containers)的概念。


    那么，如何使用容器？你可能听过 [LXC](https://linuxcontainers.org/lxc/introduction/) 或 [LXD](https://linuxcontainers.org/lxd/introduction/)
    的缩写，它们本质上是大多数 Linux/Unix 发行版容器管理的入口。问题在于，这些工具有些过于底层，且不容易上手。但幸运的是，我们有 [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    和 [rkt](https://coreos.com/rkt)，这些以应用程序为中心的容器引擎从诞生之初就成为全球应用开发者的事实标准选择。


    ## Docker：面向大众的容器


    那么 [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 本质上是什么？它最初是一个强大且易于使用的容器引擎，但现在称其为一个完善的容器管理平台也是公平的。它用
    [Go](https://golang.org/) 编写，并利用 Linux 内核功能（主要是 [namespaces](https://en.wikipedia.org/wiki/Linux_namespaces)
    和 [cgroups](https://en.wikipedia.org/wiki/Cgroups)）来完成工作。社区版是免费的，而企业版则需要订阅。


    ### 架构


    从架构角度来看，[Docker](https://en.wikipedia.org/wiki/Docker_%28software) 由三个主要部分组成。在
    [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 的核心运行着一个守护进程 `dockerd`。反过来，`dockerd`
    依赖于另一个守护进程 `containerd`（https://containerd.io/），作为与 Linux [namespaces](https://en.wikipedia.org/wiki/Linux_namespaces)
    和 [cgroups](https://en.wikipedia.org/wiki/Cgroups) 交互的抽象层。最后一块拼图是一组命令行工具（例如 `docker`
    和 `docker-compose`），它们被称为 Docker CLI，这些工具暴露了 Engine API（https://docs.docker.com/engine/api/）。


    ### 镜像


    在 [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 中，你所做的一切都是管理特定的对象。镜像和容器无疑最重要的，但还有其他如
    `volumes`、`networks` 和 `plugins` 等对象，仅举此）。我们将在教程的不同章节中看到它们的所有操作，从镜像和容器开始。


    镜像可以被视为创建容器的指令集。在 [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 中，一个镜像可以从另一个镜像继承（或基于），每个每个镜像由多个层组成，这些层在本质上是不可变的。在底层，这些层由专门的文件系统支持（默认是
    [UnionFS](https://en.wikipedia.org/wiki/UnionFS)，但也可以插件其他的），使得它们非常轻量且快速。


    那么……你如何为自己的需求创建此类镜像呢？其实非常简单，要在 [Docker](https://en.wikipedia.org/wiki/Docker_%28software)
    中构建你自己的镜像，你需要创建一个 `Dockerfile`（https://docs.docker.com/engine/reference/builder/），它只是一个定义了组镜像并在稍后运行所需的步骤（或指令）的文本文件。在此过程中，你可能会自己创建完全自定义的镜像（https://docs.docker.com/engine/userguide/eng-image/baseimages/），或者在大多数情况下，引用他人创建的镜像，这些镜像发布在注册表中（#Introduction.xhtml__Registries）。


    选择 [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 的有力理由之一是它可以原生运行在大多数
    Linux 发行版上，但不仅限于此。[macOS](https://www.docker.com/docker-mac) 和 [Windows](https://www.docker.com/docker-windows)
    操作系统也得到了良好支持，只需注意（https://docs.docker.com/toolbox/overview/）。


    为了理解 [Docker](https://en.wikipedia.org/wiki/Docker_%28software) 是如何工作的，我们必须揭示它的内部模型。任何时候，如果你觉得关于该主题没有足够的细节，请不要犹豫查阅官方文档（https://docs.docker.com/）。


