    ## 5\. Orchestration using Docker Swarm


    It has been awhile since [Docker](https://www.docker.com/) has the cluster management
    and orchestration features embedded in the engine. This orchestration layer is
    used to be known as [Docker Swarm](https://github.com/docker/swarm) but later
    on evolved into, essentially, just a special mode ([swarm mode](https://docs.docker.com/engine/swarm/))
    to run [Docker Engine](https://docs.docker.com/engine/) in.


    If you are betting heavily on [Docker](https://www.docker.com/) and prefer not
    to look for anything else, running [Docker Engine](https://docs.docker.com/engine/)
    in a [swarm mode](https://docs.docker.com/engine/swarm/) could be a good option
    as an orchestrator. It is fairly easy to get started with as well.


    [view source](#DeployOnDocker.xhtml_viewSource "view source")[print](#DeployOnDocker.xhtml_printSource
    "print")[?](#DeployOnDocker.xhtml_about "?")


    | `1` | `$ docker swarm init` |


    Conceptually, there are quite a few differences which swarm mode introduces, beyond
    just changes in the [Docker Engine](https://docs.docker.com/engine/) itself. First
    and foremost, you should start thinking in terms of services, not containers.
    The assumptions about running everything inside single [Docker](https://www.docker.com/)
    host won’t be accurate anymore as the swarm would very like consist of many [Docker](https://www.docker.com/)
    hosts distributed over the network.


    When running [Docker Engine](https://docs.docker.com/engine/) in a [swarm mode](https://docs.docker.com/engine/swarm/),
    we can deploy a complete application (service) stack using already familiar [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)
    specification. There is only one constraint though, the [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)
    file format should be version `3 (or above)` to be compatible between [Docker
    Compose](https://docs.docker.com/compose/overview/) and [Docker Engine](https://docs.docker.com/engine/)’s
    [swarm mode](https://docs.docker.com/engine/swarm/).


    To see the [swarm mode](https://docs.docker.com/engine/swarm/) in action, let
    us rework our [Spring Boot](https://projects.spring.io/spring-boot/) application
    stack a bit to comply with [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)
    file format version `3.3`.


