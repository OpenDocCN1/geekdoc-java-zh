    [Docker](https://www.docker.com/) 在最近的发布中引入的一个极其实用的特性是支持[多阶段构建](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)，它允许在
    [[`Dockerfile](https://docs.docker.com/engine/reference/builder/)` 中包含多个 `FROM`
    语句。我们在这里简单提一下这一点，它将在教程的后续章节中出现。


    ## 3. 容器 (Containers)


    容器管理构成了 [Docker](https://www.docker.com/) 功能的很大一部分，并且有很多不同的命令来支持这一功能。让我们从剖析超级强大的
    [`run`](https://docs.docker.com/engine/reference/commandline/container_run/) 命令开始，它可以启动一个新容器：


    ```

    docker container run [OPTIONS] IMAGE [COMMAND] [ARG...]

    ```


    为了感受一下这有多么简单，我们可以使用我们之前手动构建的、基于 [OpenJDK](https://en.wikipedia.org/wiki/OpenJDK)
    的镜像来运行容器：


    ```

    $ docker container run base:openjdk-131-jdk

    openjdk version "1.8.0_131"

    OpenJDK Runtime Environment (IcedTea 3.4.0) (Alpine 8.131.11-r2)

    OpenJDK 64-Bit Server VM (build 25.131-b11, mixed mode)

    ```


    一旦容器运行起来，你就可以 [`attach`](https://docs.docker.com/engine/reference/commandline/container_attach/)
    到它们上，或者使用 [`start`](https://docs.docker.com/engine/reference/commandline/container_start/)
    / [`stop`](https://docs.docker.com/engine/reference/commandline/container_stop/)
    / [`restart`](https://docs.docker.com/engine/reference/commandline/container_restart/)
    命令来管理它们的生命周期。


    ```

    docker container attach [OPTIONS] CONTAINER

    docker container start [OPTIONS] CONTAINER [CONTAINER...]

    docker container stop [OPTIONS] CONTAINER [CONTAINER...]

    docker container restart [OPTIONS] CONTAINER [CONTAINER...]

    ```


    此外，通过 [`pause`](https://docs.docker.com/engine/reference/commandline/container_pause/)
    / [`unpause`](https://docs.docker.com/engine/reference/commandline/container_unpause/)
    命令，你可以控制容器内进程的状态。


    ```

    docker container pause CONTAINER [CONTAINER...]

    docker container unpause CONTAINER [CONTAINER...]

    ```


    可能，[`ls`](https://docs.docker.com/engine/reference/commandline/container_ls/)
    命令是最常用的，因为它列出了所有正在运行中的容器（使用 `-a` 选项列出所有容器，包括运行和停止的）：


    ```

    docker container ls [OPTIONS]

    ```


    因此，[`inspect`](https://docs.docker.com/engine/reference/commandline/container_inspect/)
    命令显示有关一个或多个容器的详细信息：


    ```

    docker container inspect [OPTIONS] CONTAINER [CONTAINER...]

    ```


    [`stats`](https://docs.docker.com/engine/reference/commandline/container_stats/)
    命令用于暴露容器的运行时统计数据[`top`](https://docs.docker.com/engine/reference/commandline/container_top/)
    命令显示运行的容器进程，而 [`logs`](https://docs.docker.com/engine/reference/commandline/container_logs/)
    命令则获取容器的日志。


    ```

    docker container stats [OPTIONS] [CONTAINER...]

    docker container top CONTAINER

    docker container logs [OPTIONS] CONTAINER

    ```


    在整个生命周期内，容器可能会经历许多修改，并与其基础镜像产生显著差异。[`diff`](https://docs.docker.com/engine/reference/commandline/container_diff/)
    命令检查容器文件系统上所有文件或目录的变化并报告它们。


    ```

    docker container diff CONTAINER

    ```


    如果你需要捕获这些更改，有一个方便的 [`commit`](https://docs.docker.com/engine/reference/commandline/container_commit/)
    命令，可以从容器创建一个新镜像。


    ```

    docker container commit [OPTIONS] CONTAINER [REPOSITORY[:TAG]]

    ```


    一旦不再需要该容器，可以使用 [`rm`](https://docs.docker.com/engine/reference/commandline/container_rm/)
    命令将其终止。请小心，因为存储在容器内部的所有数据都将丢失（除非由 [volumes](https://docs.docker.com/engine/admin/volumes/volumes/)
    支撑）。


    ```

    docker container rm [OPTIONS] CONTAINER [CONTAINER...]

    ```


    [`rm`](https://docs.docker.com/engine/reference/commandline/container_rm/) 命令更极端的版本
    [`prune`](https://docs.docker.com/engine/reference/commandline/container_prune/)
    命令会批量删除所有停止的容器。


    ```

    docker container prune

    ```


    ## 4. 端口 (Ports)


    每个容器都可以暴露用于监听的端口，既可以通过 [`Dockerfile`](https://docs.docker.com/engine/reference/builder/)
    指令，也可以通过 [`run`](https://docs.docker.com/engine/reference/commandline/container_run/)
    命令的选项来实现 port`](https://docs.docker.com/engine/reference/commandline/container_port/)
    命令列出容器所有的端口映射（或特定的映射）。


    ```

    docker port CONTAINER_PORT

    ```


    ## 5. 数据卷 (Volumes)


    正如我们记得，容器是瞬时的，一旦容器终止，它持有的所有数据将丢失。在许多情况下这可能不是问题，但如果你在容器中运行数据存储，你可能希望保留你的数据。


    为了填补这一空白，Docker](https://www.docker.com/) 引入了 [volumes](https://docs.docker.com/engine/admin/volumes/)
    作为容器持久化数据的首选机制，显然 [`docker`](https://docs.docker.com/engine/reference/commandline/cli/)
    有一组专门的命令用于此（[`create`](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [`inspect`](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [`ls`](https://docs.docker.com/engine/reference/commandline/volume_ls/), [`prune`](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    以及 [`rm`](https://docs.docker.com/engine/reference/commandline/volume_rm/)）。


    ```

    docker volume create [OPTIONS] [VOLUME]

    docker volume inspect [OPTIONS] VOLUME [VOLUME...]

    docker volume ls [OPTIONS]

    docker volume prune

    docker volume rm [OPTIONS] VOLUME [VOLUME...]

    ```


    ## 6. 网络 (Networks)


    [Docker](https://www.docker.com/) 为容器提供了很好的网络支持，箱提供了许多网络驱动程序。当然，标准的 [`create`](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [`inspect`](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [`ls`](https://docs.docker.com/engine/reference/commandline/volume_ls/), [`prune`](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    和 [`rm`](https://docs.docker.com/engine/reference/commandline/volume_rm/) 命令可用用于管理网络。


    ```

    docker network create [OPTIONS] NETWORK

    docker network inspect [OPTIONS] NETWORK [NETWORK...]

    docker network ls [OPTIONS]

    docker network prune

    docker network rm NETWORK [NETWORK...]

    ```


    [Docker](https://www.docker.com/) 网络的独特之处在于 [`dockerd](https://docs.docker.com/engine/reference/commandline/dockerd/)
    守护进程包含一个嵌入的 DNS 服务器，为连接到同一用户定义网络的容器之间提供名称解析（因此容器可以通过名称进行引用，而不仅仅是 IP 地址）。


