    One of the tremendously useful features introduced by [Docker](https://www.docker.com/)
    in the recent release is the support of [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)
    which allows to have multiple `FROM` statements in the [`Dockerfile](https://docs.docker.com/engine/reference/builder/).
    We would just mention that here but it will come back to us in the upcoming sections
    of the tutorial.


    ## 3. Containers


    Container management constitutes a large portion of the [Docker](https://www.docker.com/)
    functionally and there are a lot of different commands to back it up. Let us start
    by dissecting super powerful [`run`](https://docs.docker.com/engine/reference/commandline/container_run/)
    command, which spawns a new container:


    ```

    docker container run [OPTIONS] IMAGE [COMMAND] [ARG...]

    ```


    To get a feeling of how easy it is, we could run the container using our [OpenJDK](https://en.wikipedia.org/wiki/OpenJDK)-based
    image which we have hand-built previously:


    ```

    $ docker container run base:openjdk-131-jdk

    openjdk version "1.8.0_131"

    OpenJDK Runtime Environment (IcedTea 3.4.0) (Alpine 8.131.11-r2)

    OpenJDK 64-Bit Server VM (build 25.131-b11, mixed mode)

    ```


    Once you have the containers running, you could [`attach`](https://docs.docker.com/engine/reference/commandline/container_attach/)
    to them or use [`start`](https://docs.docker.com/engine/reference/commandline/container_start/)
    / [`stop`](https://docs.docker.com/engine/reference/commandline/container_stop/)
    / [`restart`](https://docs.docker.com/engine/reference/commandline/container_restart/)
    commands to manage their lifecycle.


    ```

    docker container attach [OPTIONS] CONTAINER

    docker container start [OPTIONS] CONTAINER [CONTAINER...]

    docker container stop [OPTIONS] CONTAINER [CONTAINER...]

    docker container restart [OPTIONS] CONTAINER [CONTAINER...]

    ```


    Additionally, with [`pause`](https://docs.docker.com/engine/reference/commandline/container_pause/)
    / [`unpause`](https://docs.docker.com/engine/reference/commandline/container_unpause/)
    commands you have the control over the state of the processes within the containers.


    ```

    docker container pause CONTAINER [CONTAINER...]

    docker container unpause CONTAINER [CONTAINER...]

    ```


    Probably, the [`ls`](https://docs.docker.com/engine/reference/commandline/container_ls/)
    command will be the most used one as it lists all running containers (and with
    `-a` option all containers, running and stopped):


    ```

    docker container ls [OPTIONS]

    ```


    Consequently, the [`inspect`](https://docs.docker.com/engine/reference/commandline/container_inspect/)
    command display detailed information about one or more containers:


    ```

    docker container inspect [OPTIONS] CONTAINER [CONTAINER...]

    ```


    The [`stats`](https://docs.docker.com/engine/reference/commandline/container_stats/)
    command is designated to expose runtime statistics about the container. The [`top`](https://docs.docker.com/engine/reference/commandline/container_top/)
    command shows running container processes while the [`logs`](https://docs.docker.com/engine/reference/commandline/container_logs/)
    command fetches the logs of the container.


    ```

    docker container stats [OPTIONS] [CONTAINER...]

    docker container top CONTAINER

    docker container logs [OPTIONS] CONTAINER

    ```


    Over its lifetime container could go through many modifications and diverge from
    its base image significantly. The [`diff`](https://docs.docker.com/engine/reference/commandline/container_diff/)
    command inspects all the changes to files or directories on a container’s filesystem
    and reports them.


    ```

    docker container diff CONTAINER

    ```


    In case you would need to capture these changes, there is a handy [`commit`](https://docs.docker.com/engine/reference/commandline/container_commit/)
    command which creates a new image from the container.


    ```

    docker container commit [OPTIONS] CONTAINER [REPOSITORY[:TAG]]

    ```


    Once container is not needed anymore, it could be terminated using [`rm`](https://docs.docker.com/engine/reference/commandline/container_rm/)
    command. Please be cautious as all the data stored inside the container will be
    gone (unless it is backed by [volumes](https://docs.docker.com/engine/admin/volumes/volumes/)).


    ```

    docker container rm [OPTIONS] CONTAINER [CONTAINER...]

    ```


    More extreme version of [`rm`](https://docs.docker.com/engine/reference/commandline/container_rm/)
    command, the [`prune`](https://docs.docker.com/engine/reference/commandline/container_prune/)
    command, mass-removes all stopped containers.


    ```

    docker container prune

    ```


    ## 4. Ports


    Every container could expose ports to listen at, either through [`Dockerfile`](https://docs.docker.com/engine/reference/builder/)
    instructions or through the options of the [`run`](https://docs.docker.com/engine/reference/commandline/container_run/)
    command. The [`port`](https://docs.docker.com/engine/reference/commandline/container_port/)
    command lists all port mappings (or a specific mapping) for the container.


    ```

    docker port CONTAINER_PORT

    ```


    ## 5. Volumes


    As we remember, containers are ephemeral and once the container is terminated,
    all the data it holds will be lost. It might not be a problem in many cases but
    if you run the data store in a container for example, you would likely prefer
    to keep your data.


    To fill this gap [Docker](https://www.docker.com/) introduces [volumes](https://docs.docker.com/engine/admin/volumes/volumes/)
    as the preferred mechanism for persisting data used by containers and, obviously,
    [`docker`](https://docs.docker.com/engine/reference/commandline/cli/) has a dedicated
    class of commands for that ([create`](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [`inspect`](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [`ls`](https://docs.docker.com/engine/reference/commandline/volume_ls/), [`prune`](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    and [`rm`](https://docs.docker.com/engine/reference/commandline/volume_rm/)).


    ```

    docker volume create [OPTIONS] [VOLUME]

    docker volume inspect [OPTIONS] VOLUME [VOLUME...]

    docker volume ls [OPTIONS]

    docker volume prune

    docker volume rm [OPTIONS] VOLUME [VOLUME...]

    ```


    ## 6. Networks


    [Docker](https://www.docker.com/) has pretty good [networking support] for containers
    with a number of network drivers available out of box. Surely, the standard set
    of [`create`](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [`inspect`](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [`ls`](https://docs.docker.com/engine/reference/commandline/volume_ls/), [`prune`](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    and [`rm`](https://docs.docker.com/engine/reference/commandline/volume_rm/) commands
    is available to manage the networks.


    ```

    docker network create [OPTIONS] NETWORK

    docker network inspect [OPTIONS] NETWORK [NETWORK...]

    docker network ls [OPTIONS]

    docker network prune

    docker network rm NETWORK [NETWORK...]

    ```


    What distinguishes [Docker](https://www.docker.com/) networking is the fact the
    [`dockerd](https://docs.docker.com/engine/reference/commandline/dockerd/) daemon
    contains an embedded DNS server which provides names resolution among containers
    connected to the same user-define network (so that the containers could be referenced
    by their names, not only IP addresses).

