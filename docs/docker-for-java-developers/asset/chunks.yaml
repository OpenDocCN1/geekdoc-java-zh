    # Docker for Java Developers


    # Introduction


    ## 1. Introduction


    If you have not heard about `Docker`, then you have probably spent the last few
    years on some other planet of the Solar system. `Docker` stormed into our industry
    and in no time changed many well-established software development and operational
    practices and patterns. These days pretty much every organization is using `Docker`
    (or equivalent of it), the brave ones even in production, and its adoption is
    growing at fantastic pace.


    In this tutorial we are going to talk about how `Docker` can help us, `Java` developers,
    in accomplishing our day to day tasks. The tutorial consists of several parts
    where we going to touch upon different aspects of `Docker` and its applicability
    to `Java` applications development.


    We will start off by learning the basics:


    - Why we should invest our time in learning `Docker`

    - Get to know `Docker` command line tooling

    - Using `REST` façade to talk to `Docker`


    Then we will move on to the topics related specifically to `Docker` in context
    of `Java` applications right after:


    - Building

    - Developing

    - Testing

    - Deploying

    - Continuous Integration / Delivery


    The material we will be going through assumes that you have some basic familiarity
    with `Docker` and have at least version `17.06.1-ce` already installed on the
    machine (it does not really matter if you are on Linux, Windows or Mac per se).


