    ## 7\. Overcast


    [Overcast](https://github.com/xebialabs/overcast) is a Java library from [XebiaLabs](https://xebialabs.com/)
    intended to be used to test against hosts in the cloud. [Overcast](https://github.com/xebialabs/overcast)
    was one of the first test frameworks to offer the extensive [Docker](https://www.docker.com/)
    support while aiming for more ambitious goals to abstract away the host management
    in the test scenarios. It has a lot of very interesting features but sadly seems
    to be not actively maintained anymore, with last release dated 2015. Nonetheless,
    it is worth looking as it has some unique values.


    [Overcast](https://github.com/xebialabs/overcast) uses configuration driven approach
    to describe the hosts under the test, stemming from the fact that it is not oriented
    only on containers or/and [Docker](https://www.docker.com/).


