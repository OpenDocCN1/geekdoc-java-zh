    通过将容器的端口 `19900` 映射到宿主机，我们可以使用 `localhost` 作为主机名，通过 [curl](https://curl.haxx.se/)\
    \ 访问其 [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ 来与应用程序进行交互。让我们现在就开始操作吧。\n\n```bash\n$ curl -X POST http://localhost:19900/tasks\
    \ \\\n-d '[{\"title\": \"Task #1\", \"description\": \"Sample Task\"}]' \\\n-H\
    \ \"Content-Type: application/json\" \\\n[\n{\n  \"id\":1,\n  \"title\":\"Task\
    \ #1\",\n  \"description\":\"Sample Task\"\n}\n]\n```\n\n```bash\n$ curl http://localhost:19900/tasks\n\
    [\n{\n  \"id\":1,\n  \"title\":\"Task #1\",\n  \"description\":\"Sample Task\"\
    \n}\n]\n```\n\n```bash\n$ curl http://localhost:19900/tasks/1\n{\n  \"id\":1,\n\
    \  \"title\":\"Task #1\",\n  \"description\":\"Sample Task\"\n}\n```\n\n在底层有许多活动组件，例如使用\
    \ [Flyway](https://flywaydb.org/) 进行自动数据库迁移，以及使用 [Spring Boot Actuator](https://docs.spring.io/spring-boot/docs/2.0.0.M5/reference/html/production-ready-endpoints.html)\
    \ 提供开箱健康检查支持。其中一些内容将在教程的后续章节中出现，但看使用 [Gradle](https://gradle.org/) 将你的 [Spring\
    \ Boot](https://projects.spring.io/spring-boot/) 应用构建为 [Docker](https://www.docker.com/)\
    \ 镜像是非常简单自然的。\n\n## 4. Docker 中的 Gradle\n\n事实证明使用 [Gradle](https://gradle.org/)\
    \ 构建 [Docker](https://www.docker.com/) 镜像一点也不痛苦。尽管如此，在目标系统上安装 [Gradle](https://gradle.org/)\
    \ 以及 JDK/JRE 仍然需要完成一些准备工作。对于开发环境来说，这可能不是一个问题，因为你很可能已经安装了所有这些（以及更多）。\n\n但在云部署或\
    \ CI/CD 流水线的情况下，这可能会成为一个问题，在工作和/或维护方面产生额外成本。我们是否能找到某种方式摆脱这种开销并完全依赖 [Docker](https://www.docker.com/)\
    \ 呢？是的，实际上我们可以，通过采用[多阶段构建 (multi-stage builds)](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)，这是\
    \ [Docker](https://www.docker.com/) 功能集最近新增的功能之一。\n\n如果你好奇它如何帮助我们，这里是其核心思路。基本上，我们将按照常规程序从\
    \ [Dockerfile](https://docs.docker.com/engine/reference/builder/) 构建镜像。但 [Dockerfile](https://docs.docker.com/engine/reference/builder/)\
    \ 实际上将包含两个镜像定义。第一个（基于 [官方 Gradle 镜像](https://hub.docker.com/_/gradle/ ) 之一）指示\
    \ [Docker](https://www.docker.com/) 运行我们 [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ 应用的 [Gradle](https://gradle.org/) 构建。第二个将选取第一个镜像产生的二进制文件，并创建一个封装了我们 [Spring\
    \ Boot](https://projects.spring.io/spring-boot/) 应用的最终 [Docker](https://www.docker.com/)\
    \ 镜像（就像我们之前做过的那样）。\n\n看一遍可能比尝试解释它更好。下面的 `Dockerfile.build` 文件通过使用 [多阶段构建](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)\
    \ 指令说明了这一想法。\n\n```dockerfile\nFROM gradle:4.3.0-jdk-alpine\nADD src\nADD build.gradle\
    \ .\nADD gradle.properties .\nRUN gradle build\nFROM openjdk:8-jdk-alpine\nARG\
    \ BUILD_VERSION\nENV DB_HOST localhost\nENV DB_PORT 3306\nCOPY --from=0 /home/gradle/libs/spring-boot-webapp-${BUILD_VERSION}.jar\
    \ spring-boot-webapp.jar\nEXPOSE 19900\nENTRYPOINT exec $JAVA_OPTS -Ddb.host=$DB_HOST\
    \ -Ddb.port=$DB_PORT -jar /spring-boot-webapp.jar\n```\n\n[Dockerfile](https://docs.docker.com/engine/reference/builder/)\
    \ 的部分描述了基于 `gradle:4.3.0-jdk-alpine` 的镜像。由于我们的项目很小，我们只需将所有源码拷贝到镜像内部并运行 `gradle\
    \ build`（该命令将在 [Docker](https://www.docker.com/) 构建镜像时执行）。构建的结果将是一个 [uber-jar](https://stackoverflow.com/questions/1194703/what-is-an-uber-jar)，我们将其输入另一个镜像，这次是基于\
    \ `openjdk:8-alpine` 的。这将构成我们的最终镜像，我们可以使用 [docker](https://docs.docker.com/engine/reference/cli/)\
    \ 命令来生成。\n\n```bash\ndocker image build --build-arg BUILD_VERSION=0.1-SNAPSHOT\
    \ -f Dockerfile.build -t jcg/spring-boot-webapp:latest\n```\n\n执行命令后，我们应该在可用的\
    \ [Docker](https://www.docker.com/) 镜像列表中看到新构建的镜像。\n\n```bash\n$ docker image\
    \ ls\nREPOSITORY            TAG             IMAGE ID       CREATED           SIZE\n\
    jcg/spring-boot-webapp  0.1-SNAPSHOT   02ab72da64   10 seconds ago   133MB\njcg/spring-boot-webapp\
    \  latest         02ab72da64   10 seconds ago   133MB\n```\n\n[多阶段构建](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)\
    \ 有巨大的潜力，即使对于我们这样简单的应用也值得关注。\n\n## 5. Maven 和 Docker\n\n让我们稍微切换一下，看看 [Apache Maven]\
    \ 如何管理 [Dropwizard](http://www.dropwizard.io/) 应用的构建。对于小节，你需要在开发机器上安装 [Apache\
    \ Maven](https://maven.apache.org/) `3.2.5`（如果你已经有了 [Apache Maven](https://maven.apache.org/)\
    \ `3.2.1` 或更高版本，可以直接使用）。\n\n我们需要遵循的步骤与 [Gradle](https://gradle.org/) 构建的大部分相同，变化仅在于使用了以下插件：\n\
    \n*   [Maven Shade](https://maven.apache.org/plugins/maven-shade-plugin/) 插件\n\
    *   [Spotify Docker Maven](https://github.com/spotify/docker-maven-plugin) 插件\n\
    \n[Maven Shade](https://maven.apache.org/plugins/maven-shade-plugin/) 插件产生一个 [uber-jar](https://stackoverflow.com/questions/1194703/what-is-an-uber-jar)，之后将由\
    \ [Spotify Docker Maven](https://github.com/spotify/docker-maven-plugin) 插件用于构建\
    \ [Docker](https://www.docker.com/) 镜像。复杂的，让我们来看 `pom.xml` 文件。\n\n```xml\n<project\
    \ xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>code.geeks</groupId>\n  <artifactId>dropwizard-webapp</artifactId>\n\
    \  <version>0.1-SNAPSHOT</version>\n  <packaging>jar</packaging>\n  <properties>\n\
    \    <project.sourceEncoding>UTF-8</project.sourceEncoding>\n  </properties>\n\
    \  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>dropwizard</groupId>\n\
    \        <artifactId>dropwizard-bom</artifactId>\n        <version>1.2.0</version>\n\
    \        <type>pom</type>\n        <scope>import</scope>\n      </dependency>\n\
    \    </dependencies>\n  </dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>dropwizard</groupId>\n      <artifactId>dropwizard-core</artifactId>\n\
    \    </dependency>\n    <dependency>\n      <groupId>dropwizard</groupId>\n  \
    \    <artifactId>dropwizard-hibernate</artifactId>\n    </dependency>\n    <dependency>\n\
    \      <groupId>mysql</groupId>\n      <artifactId>mysql-connector-java</artifactId>\n\
    \      <version>8.0.7-dm</version>\n    </dependency>\n    <dependency>\n    \
    \  <groupId>dropwizard.modules</groupId>\n      <artifactId>dropwizard-flyway</artifactId>\n\
    \      <version>1.2.0-1</version>\n    </dependency>\n    <dependency>\n     \
    \ <groupId>com.google.guava</groupId>\n      <artifactId>guava</artifactId>\n\
    \    </dependency>\n    <dependency>\n      <groupId>junit</groupId>\n      <artifactId>junit</artifactId>\n\
    \      <scope>test</scope>\n    </dependency>\n  </dependencies>\n  <build>\n\
    \    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.1</version>\n\
    \        <configuration>\n          <source>8</source>\n          <target>8</target>\n\
    \        </configuration>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-jar-plugin</artifactId>\n        <version>3.0.2</version>\n\
    \        <configuration>\n          <archive>\n            <manifest>\n      \
    \        <mainClass>code.geeks.docker.AllApi</mainClass>\n            </manifest>\n\
    \          </archive>\n        </configuration>\n      </plugin>\n      <plugin>\n\
    \        <groupId>org.apache.maven.plugins</groupId>\n        <artifactId>maven-shade-plugin</artifactId>\n\
    \        <version>3.1.0</version>\n        <configuration>\n          <executions>\n\
    \            <execution>\n              <phase>package</phase>\n             \
    \ <goals>\n                <goal>shade</goal>\n              </goals>\n      \
    \        <configuration>\n                <transformers>\n                  <transformer\
    \ implementation=\"org.apache.maven.plugins.shade.resource.ServicesResourceTransformer\"\
    />\n                  <transformer implementation=\"org.apache.maven.plugins.shade.resource.ManifestResourceTransformer\"\
    >\n                    <mainClass>com.javacgeeks.dw.AppStarter</mainClass>\n \
    \                 </transformer>\n                </transformers>\n          \
    \    </configuration>\n            </execution>\n          </executions>\n   \
    \     </configuration>\n      </plugin>\n      <plugin>\n        <groupId>com.spotify</groupId>\n\
    \        <artifactId>docker-maven-plugin</artifactId>\n        <version>1.0.0</version>\n\
    \        <configuration>\n          <imageName>jcg/dropwizard-webapp:${project.version}</imageName>\n\
    \          <dockerDirectory>\n        </configuration>\n      </plugin>\n    </plugins>\n\
    \  </build>\n</project>\n```\n\n"
- fmt: "\n| `6` | `jcg/dropwizard-webapp:0.0.1-SNAPSHOT` |\n\nWe also map the ports\
    \ `19900` and `19901` from the container to the host so we could use `localhost`\
    \ as the host name in [curl](https://curl.haxx.se/).\n\n```bash\ncurl -X POST\
    \ http://localhost:19900/tasks \\\n-d '[{\"title\": \"Task #1\", \"description\"\
    : \"Sample Task\"}]' \\\n-H \"Content-Type: application/json\" \\\n[\n{\n  \"\
    id\":1,\n  \"title\": \"Task #1\",\n  \"description\": \"Sample Task\"\n}\n]\n\
    ```\n\n```bash\ncurl http://localhost:19900/tasks\n[\n{\n  \"id\":1,\n  \"title\"\
    : \"Task #1\",\n  \"description\": \"Sample Task\"\n}\n]\n```\n\n```bash\ncurl\
    \ http://localhost:19900/tasks/1\n{\n  \"id\":1,\n  \"title\": \"Task #1\",\n\
    \  \"description\": \"Sample Task\"\n}\n```\n\nPlease take a note that with host\
    \ port mappings we could run either `jcg/dropwizard-webapp:0.0.1-SNAPSHOT` container\
    \ or `jcg/spring-boot-webapp:0.0.1-SNAPSHOT` container, but not both at the same\
    \ time, due to the inevitable port conflicts. We just use the same port for convenience\
    \ but it in most cases you will be using dynamic port bindings and will not see\
    \ this issue happening.\n\n## 6. Maven on Docker\n\nThe same technique of using\
    \ [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)\
    \ is equally applicable for the projects which use [Apache Maven](https://maven.apache.org/)\
    \ for build and dependency management (to our luck, there are [official Apache\
    \ Maven images](https://hub.docker.com/r/library/maven/) published on [Docker\
    \ Hub](https://hub.docker.com/r/library/maven/)).\n\n```dockerfile\nFROM maven:3.5.2-jdk-8-alpine\n\
    ADD src src\nADD pom.xml .\nRUN mvn package\nFROM openjdk:8-jdk-alpine\nARG BUILD_VERSION\n\
    ENV DB_HOST localhost\nENV DB_PORT 3306\nCOPY --from=0 /target/dropwizard-webapp-${BUILD_VERSION}.jar\
    \ dropwizard-webapp.jar\nADD application.yml application.yml\nADD src/main/docker/docker-entrypoint.sh\
    \ docker-entrypoint.sh\nRUN chmod a+x /docker-entrypoint.sh\nEXPOSE 19900 19901\n\
    ENTRYPOINT [\"/docker-entrypoint.sh\"]\n```\n\nNot much to add here once we cracked\
    \ how the [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)\
