    ## 6\. Containers in the Cloud


    Every major player in the cloud space is rushing to the market their own managed
    offerings which intend to support the deployment and orchestration of the containers
    so you could just drop one and magic happens. Let us quickly glance through them.


    ### 6.1\. Amazon Elastic Container Service


    [Amazon Elastic Container Service](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)
    (or simply [Amazon ECS](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html))
    is a highly scalable, fast, container management service that makes it easy to
    run, stop, and manage [Docker](https://www.docker.com/) containers in the cluster.
    As you may expect, [Amazon ECS](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)
    integrates nicely with many other cloud offerings from [Amazon Web Services](https://aws.amazon.com/)
    portfolio, including:


    *   AWS Identity and Access Management


    *   Amazon EC2 Auto Scaling


    *   Elastic Load Balancing


    *   Amazon Elastic Container Registry


    *   AWS CloudFormation


    [Amazon ECS](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)
    is a regional service that simplifies running application containers in a highly
    available manner across multiple availability zones within a region.


    ### 6.2\. Google Kubernetes Engine


    [Google Kubernetes Engine](https://cloud.google.com/kubernetes-engine/) (formerly
    known as Google Container Engine) is a managed environment for deploying containerized
    applications. It brings [Google](https://www.google.com)’s unique experience and
    latest innovations in developer productivity, resource efficiency, automated operations,
    and open source flexibility to accelerate the time to market.


    Google has been running production workloads in containers for a very long time,
    and have incorporated the best of what they learnt into [Kubernetes](https://kubernetes.io),
    the industry-leading open source container orchestrator which powers [Kubernetes
    Engine](https://cloud.google.com/kubernetes-engine/). It offers (but is not limited
    to) the following distinguishing features:


    *   Identity & Access Management


    *   Hybrid Networking


    *   Security and Compliance


    *   Integrated Logging & Monitoring


    *   Auto Scale


    *   Auto Upgrade


    *   Auto Repair


    *   Resource Limits


    *   Stateful Application Support


    *   [Docker](https://www.docker.com/) Images Support


    *   Fully Managed


    *   OS Built for Containers


    *   Private Container Registry


    *   Fast Consistent Builds


    *   Open Source Portability


    ### 6.3\. Azure Container Service


    [Azure Container Service](https://azure.microsoft.com/en-ca/services/container-service/)
    (AKS) manages the hosted [Kubernetes](https://kubernetes.io) environment, making
    it quick and easy to deploy and manage containerized applications without container
    orchestration expertise. It also eliminates the burden of ongoing operations and
    maintenance by provisioning, upgrading, and scaling resources on demand, without
    the need to take the applications offline.


    As a managed [Kubernetes](https://kubernetes.io) service, [Azure Container Service](https://azure.microsoft.com/en-ca/services/container-service/)
    provides:


    *   Automated [Kubernetes](https://kubernetes.io) version upgrades and patching


    *   Easy cluster scaling


    *   Self-healing hosted control plane (masters)


    *   Pay only for running agent pool nodes


    ## 7\. Conclusions


    In this section of the tutorial we have looked at a number of leading cluster
    management and orchestration solutions which offer a comprehensive support of
    the containerized application deployments. By and large, [Kubernetes](https://kubernetes.io)
    is taking a lead here, however every option has own pros and cons.


    ## 8\. What’s next


    In the next, the final part of the tutorial we are going to talk about very important
    subject of continuous integration practices and how [Docker](https://www.docker.com/)
    fits into the picture there.


    Docker for Java Developers


    # Continuous Integration on Docker 


    ## 1. Introduction


    Along this tutorial we have seen how [Docker](https://www.docker.com/) penetrated
    into every aspect of the typical [Java](https://www.java.com/en/) application
    lifecycle: build, development, testing and deployment. In this part we are going
    to focus on the one of the increasingly important topics of continuous integration.


    Although the market of the continuous integration (and continuous delivery) solutions
    is overcrowded, for better or worse, there is one product which stands still for
    years and is very close to the heart of every [Java](https://www.java.com/en/)
    developer out there. Yes, your guess is right, it is [Jenkins](https://jenkins.io/),
    the leading open source automation server.


    ## 2\. Why Jenkins?'
  toc: []
  trans: '

    坦率地说，我们不需要做太多的更改。特别是为了支持[集群模式](https://docs.docker.com/engine/swarm/)，有一系列特定的命令被引入了
    [docker](https://docs.docker.com/engine/reference/commandline/cli/) 工具中：`docker
    stack`。我们已经在[本教程的第二部分](https://www.javacodegeeks.com/2017/09/docker-java-developers-docker-command-line.html)
    中没有讨论过它们，但现在是时候介绍一下了。


    通过 [deploy](https://docs.docker.com/engine/reference/commandline/stack_deploy/)
    命令和现有的 [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)
    规范，我们可以将应用栈部署到集群集群中。


    | `1` | `$ docker stack deploy --compose-``file` `docker-compose.yml springboot-webapp`
    |


    要查看部署状态以及所有已部署的服务，我们可以像下面的示例所示使用 [services](https://docs.docker.com/engine/reference/commandline/stack_services/)
    命令（输出已略有简化）：


    | `1` | `$ docker stack services  springboot-webapp` |

    | `2` | `NAME                IMAGE              REPLICAS PORTS` |

    | `3` | `springboot-webapp_java-app  jcg/spring-boot-webapp:latest 1/1      *:19900->19900/tcp`
    |

    | `4` | `springboot-webapp_mysql     mysql:8.0.2                          ���������������������
    1/1  ` |


    太棒了，看起来我们的 [Spring Boot](https://projects.spring.io/spring-boot/)应用程序已经运行，让我们通过向其健康检查端发送
    HTTP 请求来确认一下：


    | `01` | `$ curl http://localhost:19900/application/health` |

    | `02` |   |

    | `03` | `{` |

    | `04` | `"details"`: { |

    | `05` | `"db"`: { |

    | `06` | `"details"`: { |

    | `07` | `"database"`: `"MySQL",` |

    | `08` | `"hello"`: 1 |

    | `09` | `},` |

    | `10` | `"status"`: `"UP"` |

    | `11` | `},` |

    | `12` | `"diskSpace"`: { |

    | `13` | `"details"`: { |

    | `14` | `"free"`: 3606978560, |

    | `15` | `"threshold"`: 10485760, |

    | `16` | `"total"`: 19195224064 |

    | `17` | `},` |

    | `18` | `"status"`: `"UP"` |

    | `19` | `}` |

    | `20` | `},` |

    | `21` | `"status"`: `"UP"` |

    | `22` | `}` |


    这完全符合我们的预想。总之，在[集群模式](https://docs.docker.com/engine/swarm/)下使用[Docker Engine](https://docs.docker.com/engine/)是一个有趣的考虑选项，但值得注意的是，它不像
    [Kubernetes](https://kubernetes.io/)或 [Apache Mesos](http://mesos.apache.org/)那么流行。


    ## 6. 云端容器


    云领域的每个主要巨头都在向市场推出他们自己的托管服务，旨在支持容器的部署和编排，这样你只需将其投入，魔法就会发生。让我们快速浏览一下它们。


    ### 6.1. Amazon Elastic Container Service


    [Amazon Elastic Container Service](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)（或简称为
    [Amazon ECS](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html)）是一种托管服务，可以轻松地运行、停止和管理容器。它还通过配置、升级和扩展资源，消除了持续运营的负担。


    * 身份与访问管理

    * 自动伸缩

    * 负载均衡

    * 容器注册表

    * CloudFormation


    ### 6.2. Google Kubernetes Engine


    [Google Kubernetes Engine](https://cloud.google.com/kubernetes-engine)以前称为 Google
    Container Engine）是一个用于部署应用的托管环境。Google 已经在容器中运行负载很长时间，并将他们所学的精华整合到：


    * 身份与访问管理

    * 混合网络

    * 安全与合规性

    * 集成日志与监控

    * 自动伸缩

    * 自动升级

    * 自动修复

    * 资源限制

    * 有状态化应用支持

    * 镜像支持

    * 全托管

    * 为容器构建

    * 私有注册表

    * 快速一致的构建

    * 开源移植性


    ### 6.3. Azure Container Service


    [Azure Container Service](https://azure.microsoft.com/en-ca/services/container-service/)
    (AKS) 管理托管的 [Kubernetes](https://kubernetes.io/) 环境，使得无需容器知识即可快速部署和管理应用程序。它提供了：


    * 自动升级和补丁

    * 轻松扩展集群

    * 自愈托管控制平面（主节点）

    * 仅为运行的节点付费


    ## 7. 结论


    在教程的这一部分，我们查看了一些主要的集群管理和编排解决方案，它们为容器化应用提供了全面的支持。总来说，[Kubernetes](https://kubernetes.io/)
    处于领先地位，但每个选项都有其优缺点。


    ## 8. 下一步计划


    在教程的最后一部分，我们将讨论非常重要的主题：持续集成实践以及 [Docker](https://www.docker.com/) 如何融入其中。


    # Docker 上的持续集成


    ## 1. 引言


    在整个教程中，我们看到了 [Docker](https://www.docker.com/) 如何渗透到典型的 [Java](https://www.java.com/en/)
    应用生命周期的每个方面：构建、开发、测试和部署。在这一部分，我们将专注于日益重要的主题之一：持续集成。

