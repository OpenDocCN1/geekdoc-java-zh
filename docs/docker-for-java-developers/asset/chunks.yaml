    \ [`cAdvisor`](https://github.com/google/cadvisor) web UI at [`http://localhost:8080`](http://localhost:8080)\
    \ (or, in case you are using non-native [`Docker`](https://www.docker.com/) installation,\
    \ `http://<docker-machine>:8080`).\"\n\nOkay, I'm ready.\n\n[content]\nOften while\
    \ we are developing our applications there is a need to get more insights regarding\
    \ what is going on with our containers, either we are talking about CPU, memory\
    \ or network utilization. Luckily, there are quite a few options here and one\
    \ of the very useful tools we are going to talk about is [cAdvisor](https://github.com/google/cadvisor)\
    \ (or in full version, container advisor) which analyzes the resource usage and\
    \ performance characteristics of running containers.\n\n> “[cAdvisor](https://github.com/google/cadvisor)\
    \ provides container users an understanding of the resource usage and performance\
    \ characteristics of their running containers. It is a running daemon that collects,\
    \ aggregates, processes, and exports information about running containers. Specifically,\
    \ for each container it keeps resource isolation parameters, historical resource\
    \ usage, histograms of complete historical resource usage and network statistics.\
    \ This data is exported by container and machine-wide.* – [https://github.com/google/cadvisor](https://github.com/google/cadvisor)\n\
    \nInterestingly, [cAdvisor](https://github.com/google/cadvisor) goes beyond just\
    \ [Docker](https://www.docker.com/) and should support just about any other container\
    \ type out of the box. Sadly for Windows users, [cAdvisor](https://github.com/google/cadvisor)\
    \ has [limited support](https://github.com/google/cadvisor/issues/1394) on this\
    \ platform. The best way to give the [cAdvisor](https://github.com/google/cadvisor)\
    \ a try is, for sure, to run it as [Docker](https://www.docker.com/) container.\n\
    \n```bash\nsudo docker run \\\n--volume=/:/rootfs:ro \\\n--volume=/var/run:/var/run:rw\
    \ \\\n--volume=/sys:/sys:ro \\\n--volume=/var/lib/docker/:/var/lib/docker:ro \\\
    \n--volume=/dev/disk/:/dev/disk:ro \\\n--publish=8080:8080 \\\n--detach=true \\\
    \n--name=cadvisor \\\ngoogle/cadvisor:latest\n```\n\nOnce the container is up\
    \ and running, you can access [`cAdvisor`](https://github.com/google/cadvisor)\
    \ web UI at [`http://localhost:8080`](http://localhost:8080) (or, in case you\
    \ are using non-native [`Docker`](https://www.docker.com/) installation, `http://<docker-machine>:8080`).\n\
    \n[![cAdvisor](images/cadvisor-jcg-1024x803.png)](http:../images/cadvisor-jcg.png)\n\
    \n### cAdvisor\n\nThe web UI is quite simple but exceptionally informative. There\
    \ are a lot of details collected about resources and processes of each running\
    \ [`Docker`](https://www.docker.com/) container as well as about the [`Docker`](https://www.docker.com/)\
    \ host machine itself (CPU, memory, network, storage, …). By all means, it is\
    \ invaluable tool to learn how your containers consume and manage the resources\
    \ at runtime.\n\n### 5.3. ctop\n\nAnd last, but not least, we are going to wrap\
    \ up with [ctop](https://ctop.sh) tool which, in a [top](https://linux.die.net/man/1/top)-like\
    \ interface, provides a concise and condensed overview of real-time metrics for\
    \ multiple containers.\n\n![ctop](images/ctop-jcg-1024x214.png)\n\n### ctop\n\n\
    Not only [ctop](https://ctop.sh) has a summary view, it also supports the option\
    \ to select and focus on any individual container as well.\n\n### 5.4. And a lot\
    \ more …\n\nThe [Docker](https://www.docker.com/) tooling space is really thriving,\
    \ with new interesting projects popping up literally every day. We have just covered\
    \ a couple of well-known, mature and useful tools but there are a lot more to\
    \ discover, so please watch this space closely if you are interested.\n\n## 6.\
    \ Docker Engine Metrics\n\n[Docker](https://www.docker.com/) engine exposes a\
    \ lot of interesting metrics in the format which is fully compatible with [Prometheus](https://prometheus.io/),\
    \ tremendously popular-open-source monitoring and alerting solution. Although\
    \ this feature became generally available quite a while ago, not many people know\
    \ about it and as such, not many make use of it.\n\nThis feature is still considered\
    \ experimental so it is not available by default and needs a bit of configuration\
    \ tweaking. The [official documentation](https://docs.docker.com/engine/admin/prometheus/)\
    \ thoroughly describes all the necessary steps to be done with respect to the\
    \ operating system you are running [Docker](https://www.docker.com/) on. But essentially,\
    \ the first step is to modify `daemon.json` and add the following properties there.\n\
    \n```json\n{\n  \"metrics-addr\": \"localhost:9323\",\n  \"experimental\": true\n\
    }\n```\n\nIn order for this change to take effect, the [Docker](https://www.docker.com/)\
    \ daemon should be restarted. Right after, the metrics should become available\
    \ at the [http://localhost:9323/metrics](http://localhost:9323/metrics).\n[/content]\
