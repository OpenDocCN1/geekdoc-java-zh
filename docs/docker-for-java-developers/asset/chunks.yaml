  trans: "\n\n`3.x` 设计用于在 [Docker Compose](https://docs.docker.com/compose/overview/)\
    \ 和 [Docker Swarm](https://docs.docker.com/engine/swarm/swarm-tutorial/)（我们稍后将在教程中简要介绍的集群解决方案）之间实现兼容，但遗憾的是，它也移除了几个非常有实用的选项（同时也增加了几个）。通常情况下，只要可能，我们将坚持使用\
    \ `3.x`，不时回退到 `2.x` 来展示一些非常酷的特性。\n\n# 12. 结论\n\n在这一节中，我们浏览了 [Docker](https://www.docker.com/)\
    \ 优秀的命令行工具、[docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ 和 [docker-compose](https://docs.docker.com/compose/reference/overview/)，并重点介绍了最实用用和最重要的命令。我们还没有看到它们大部分的实际运行示例，但在教程接下来的章节中，每一个命令都将有机会登场。\n\
    \n# 12. 接下来是什么\n\n尽管这些工具很有可能是你处理 [Docker](https://www.docker.com/) 的主要（如果不是唯一的）方式，但在教程的下一节中，我们将通过利用\
    \ [Docker Engine REST(ful) APIs](https://docs.docker.com/engine/api/) 来学习另一种方案。\n\
    \n# Java Java 开发者的 Docker\n\n# 基于 HTTP/REST 的 Docker\n\n## 1. 引言\n\n从教程的前几个部分我们已经知道\
    \ [Docker](https://www.docker.com/) 不仅拥有出色的命令行工具，还暴露了功能丰富的 [Docker Engine API](https://docs.docker.com/engine/api/)。目前，官方支持的客户端提供了\
    \ Go 和 Python 语言。对于 Java 开发者来说，这显然不是什么鼓舞人心，但隧道尽头有光。\n\n很久以前，[Spotify](https://spotify.github.io/)\
    \ 开始了自己的旅程，为 [Docker Engine API](https://docs.docker.com/engine/api/) 开发一个 Java\
    \ 客户端（广为人知的 [Spotify Docker Client](https://github.com/spotify/docker-client)）。从那时起该项目一直活跃维护，以跟进\
    \ [Docker](https://www.docker.com/) / [Engine API](https://docs.docker.com/engine/api/)\
    \ 领域的所有最新进展，它是目前基于 JVM 应用程序的事实选择。它工作得非常好，但有一点你需要注意：由于这是社区的努力，而不是来自 [Docker](https://www.docker.com/)\
    \ 的官方 Java 客户端，因此需要一些时间来跟上频繁 [Docker](https://www.docker.com/) 发布引入的所有更改。\n\n\
    在教程的这一节中，我们将介绍几个关键的 [Docker Engine APIs](https://docs.docker.com/engine/api/)，并演示如何使用\
    \ [Spotify Docker Client](https://github.com/spotify/docker-client) 在你的 Java 程序中使用它们。\n\
    \n## 2. 版本控制\n\n在开始之前，我们必须理解 [Docker Engine API](https://docs.docker.com/engine/api/)\
    \ 如何进行[版本控制](https://docs.docker.com/engine/api/v1.30/#section/Versioning)，以及如何匹配\
    \ [Docker](https://www.docker.com/) 发布与其支持的 API 版本。我们需要的是 [docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ 命令行工具的 `version` 命令。\n\n| `01` | `$ docker version` |\n| `02` | |\n| `03` |\
    \ `Client:` |\n| `04` | `Version: 17.06.1-ce` |\n| `05` | `API version: 1.30`\
    \ |\n| `06` | `Go version: go1.8.3` |\n| `07` | `Git commit: 874a737` |\n| `08`\
    \ | `Built: Thu Aug 17 22:48:20 2017` |\n| `09` | `OS/Arch: linux/amd64` |\n|\
    \ `10` | |\n| `11` | `Server:` |\n| `12` | `Version: 17.06.1-ce` |\n| `13` | `API\
    \ version: 1.30 (minimum version 1.12)` |\n| `14` | `Go version: go1.8.3` |\n\
    | `15` | `Git commit: 874a737` |\n| `16` | `Built: Thu Aug 17 22:54:55 2017` |\n\
    | `17` | `OS/Arch: linux/amd64` |\n| `18` | `Experimental: false` |\n\n输出非常直观。我们可以发现\
    \ [Docker](https://www.docker.com/) 是 `17.06.1-ce`，其 `API version` 是 `1.30`。从这里，让我们为\
    \ [Docker](https://docs.docker.com/engine/api/) v130 签签。\n\n## 3. 开始\n\n首先，我们需要向项目中引入相应的\
    \ [Docker Client](https://github.com/spotify/docker-client) 依赖。对于 [Maven](https://maven.apache.org/)，这非常简单：\n\
    \n```xml\n<dependency>\n    <groupId>com.spotify</groupId>\n    <artifactId>docker-client</artifactId>\n\
    \    <version>8.9.1</version>\n</dependency>\n```\n\n由于 [Engine API](https://docs.docker.com/engine/api/)\
    \ 演进很快，因此强烈建议依赖最新的 [Docker Client](https://github.com/spotify/docker-client) 发布。目前，`8.9.1`\
    \ 是我们可以使用的最新版本。\n\n很好，我们可以创建一个 `DockerClient` 实例。有几种方法可以实现，基本上取决于你使用的操作系统（或系统）。最快速、安全且可移植的方法是使用\
    \ `DefaultDockerClient.fromEnv()`，它会从环境中获取信息，并适用于各种 [Docker] 安装，包括未原生支持 Docker\
    \ 的旧版 Mac 和 Windows 系统（如 [Docker Toolbox]）。\n\n```java\n```\n\n```，这里我们假设 [Docker](https://www.docker.com/)\
    \ 配置已就绪，但你可以对其完全控制，包括连接 URI、注册表认证、连接池等。重要的是，当你完成客户端的操作后，请关闭它，例如：\n\n```java\n\
    client.close();\n```\n\n很好，我们拥有了 [Docker](https://www.docker.com/) 客户端实例。它是调用众多\
    \ [Docker Engine APIs](https://docs.docker.com/engine/api/) 的单一入口，让我们看看用它能实现什么。\n\
    \n## 4. 镜像\n\n我们将查看的第一个 [Engine API](https://docs.docker.com/engine/api/) 是 [Images\
    \ API](https://docs.docker.com/engine/api/v.30/)。[Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 通过一组方法支持其大部分功能。为了说明这一点，让我们借用教程上一节中的 [Dockerfile](https://docs.docker.com/engine/reference/builder/)，将其内容存储在\
    \ `src/main/resources` 文件夹中名为 `Dockerfile` 的文件中：\n\n```dockerfile\nFROM openjdk:8u131-jdk-alpine\n\
    CMD [\"java\", \"-version\"]\n```\n\n现在，让我们使用 [Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 从它构建镜像：\n\n```java\nfinal URL dockerfile = getClass().getResource(\"/\");\n\
    final String imageId = client.build(Paths.get(dockerfile.toURI()),\n    BuildParam.name(\"\
    base:openjdk-131\"));\n```\n\n"
- fmt: "\nEasy, but how could we check if the image is there? Our old buddy [docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ command line tool comes into mind first, but why not to use [Spotify Docker\
    \ Client](https://github.com/spotify/docker-client) for that?\n\n```java\nfinal\
    \ ImageInfo imageInfo = client.inspectImage(imageId);\n```\n\nNice, what about\
    \ fetching all available images?\n\n```java\nfinal List allImages = client.listImages();\n\
    ```\n\nWhat if we need to add additional tags to the image?\n\n```java\nclient.tag(imageId,\
    \ \"openjdk\");\n```\n\nIt is also possible to get image history, for example:\n\
    \n```java\nfinal List history = client.history(imageId);\n```\n\nIn case we do\
    \ not need this image anymore, it could be easily removed:\n\n```java\nfinal List\
    \ removedImages = client.removeImage(imageId, true, false);\n```\n\nWe can also\
    \ search images in the [Docker Hub](https://hub.docker.com/) registry. For example,\
    \ let us look up for all available JDK images:\n\n```java\nfinal List jdkImages\
    \ = client.searchImages(\"jdk\");\n```\n\nTo interface with registries, there\
    \ are pull and push methods. The first one fetches the image from a registry while\
    \ the latter uploads it to a registry.\n\n```java\nclient.pull(\"base:openjdk-131-jdk\"\
    );\nclient.push(\"base:openjdk-131-jdk\");\n```\n\nIn order to get more details\
    \ related to images manipulation, please check out the [the official Spotify Docker\
    \ Client documentation](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md#images).\n\
    \n## 5. Containers\n\nThe next [Engine API](https://docs.docker.com/engine/api/)\
    \ we are going to talk about is [Containers API](https://docs.docker.com/engine/api/v1.30/#tag/Container),\
    \ arguably the richest one from the functionality perspective.\n\nTo make an use\
    \ case a bit more realistic, let us spawn [MySQL](https://hub.docker.com/_/mysql/)\
    \ container instance from `mysql:8.0.2` image, passing some environment variables\
    \ and exposing at least one port.\n\n```java\nfinal ContainerCreation container\
    \ = client.createContainer(ContainerConfig\n    .builder()\n    .image(\"mysql:8.0.2\"\
    )\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\",\n        \"MYSQL_DATABASE=my_app_db\"\
    \n    )\n    .exposedPorts(\"3306\")\n    .hostConfig(\n        HostConfig\n \
    \       .builder()\n        .portBindings(\n            ImmutableMap.of(\n   \
    \             \"3306\",\n                ImmutableList.of(\n                 \
    \   PortBinding.of(\"0.0.0.0\", 3306)\n                )\n            )\n    \
    \    )\n        .build()\n    )\n    .build()\n    .build());\n```\n\nIn order\
    \ for container creation to succeed, we would need `mysql:8.0.2` locally. If you\
    \ are not sure, its always better to pull the image before using it.\n\n```java\n\
    client.pull(\"mysql:8.0.2\");\n```\n\nAt this point the container is created but\
    \ not started yet, so let us run it:\n\n```java\nclient.startContainer(container.id());\n\
    ```\n\nHaving the container up and running, there are quite few things which could\
    \ be done with it. We could get all the details about the container by inspecting\
    \ it:\n\n```java\nfinal ContainerInfo info = client.inspectContainer(container.id());\n\
    ```\n\nPretty straightforward, but what if we need to capture the logs or the\
    \ standard output from the container? This could be accomplished by attaching\
    \ to the running container, for example:\n\n```java\nclient.attachContainer(container.id(),\
    \ AttachParameter.values())\n    .attach(System.out, System.err, false);\n```\n\
    \nThere is one caveat though, the last `attach` invocation will block the calling\
    \ thread, waiting for the output from the container. This is probably not most\
    \ of us expect so we better offload the invocation to dedicated thread.\n\n```java\n\
    executor.submit(() -> {\n    client.attachContainer(container.id(), AttachParameter.values())\n\
    \        .attach(System.out, System.err, false);\n    return null;\n});\n```\n\
    \nYou have the control over the state of the processes within the container by\
    \ pausing / unpausing them, for example:\n\n```java\nclient.pauseContainer(container.id());\n\
    client.unpauseContainer(container.id());\n```\n\nThere are also the APIs exposed\
    \ to fetch the runtime statistics about the container or to get the list of running\
    \ container processes.\n\n```java\nfinal ContainerStats stats = client.stats(container.id());\n\
    final TopResults top = client.topContainer(container.id());\n```\n\nFinally, there\
    \ is a dedicated API to fetch and tail the logs of the container, quite similar\
    \ to the `attachContainer` method we have above.\n\n```java\nclient.logs(container.id(),\
    \ LogsParam.stdout(), LogsParam.stderr(), LogsParam.tail(10))\n    .attach(System.out,\
    \ System.err, false);\n```\n\nOnce the container is not needed anymore, it could\
    \ be stopped and terminated right after.\n\n```java\nclient.stopContainer(container.id(),\
    \ 5 /* wait 5 seconds before killing */);\nclient.removeContainer(container.id());\n\
    ```\n\nIn order to get more details related to containers manipulation, please\
    \ check out [the official Spotify Docker Client documentation](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md#containers).\n\
    \nSo we know how to deal with images and containers using purely [Docker Engine\
    \ API](https://docs.docker.com/engine/api/)s with a help of [Spotify Docker Client](https://github.com/spotify/docker-client).\
    \ Let us talk about equally important topics like managing ports, networks, volumes\
    \ and resource limits.\n\n## 6. Ports\n\nEvery container could expose ports to\
    \ listen to at runtime, either through image [Dockerfile](https://docs.docker.com/engine/reference/builder/)\
    \ instructions or through the arguments of the `createContainer` method invocation.\
    \ The [Spotify Docker Client](https://github.com/spotify/docker-client) does not\
    \ provide the specialized method to fetch the ports and their mappings but this\
    \ information could be easily extracted from `ContainerInfo`, for example:\n\n\
    ```java\nfinal ContainerInfo info = client.inspectContainer(container.id());\n\
    final ImmutableMap<String, List> mappings = info.hostConfig().portBindings();\n\
    ```\n\nIn fact, a more reliable way would be to use `info.networkSettings().ports()`\
    \ as the container may not necessarily use port mappings, but only expose some\
    \ ports.\n\n```java\nfinal ContainerInfo info = client.inspectContainer(container.id());\n\
    final ImmutableMap<String, List> mappings = info.networkSettings().ports();\n\
    ```\n\n## 7. Volumes\n\nIn the [previous section of the tutorial](https://www.javacodeeks.com/2017/09/docker-java-developers-docker-command-line.html)\
    \ we have learned about [volumes](https://docs.docker.com/engine/admin/volumes/)\
    \ as the preferred mechanism for persisting data used by containers. The [Spotify\
    \ Docker Client](https://github.com/spotify/docker-client) comprehensively wraps\
    \ [Volumes API](https://docs.docker.com/engine/api/v1.30/#tag/Volume) through\
    \ the family of methods. Let us start by creating a new volume:\n\n```java\nfinal\
    \ Volume volume = client.createVolume();\n```\n\nIt is possible to get the metadata\
    \ about the existing volume:\n\n```java\nfinal Volume info = client.inspectVolume(volume.name());\n\
    ```\n\nAlso, you could fetch all available volumes (and filter them if necessary),\
    \ for example:\n\n```java\nfinal VolumeList volumes = client.listVolumes();\n\
    ```\n\nOnce the volume is not needed anymore, it could be removed.\n\n```java\n\
    client.removeVolume(volume.name());\n```\n"
