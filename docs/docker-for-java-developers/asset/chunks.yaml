  trans: '

    对于许多人来说，与 [Jenkins](https://jenkins.io/) 的关系往往处于“爱”或“恨”的范畴内。抛开历史不谈，第二代 [Jenkins](https://jenkins.io/)
    平台（即 `2.x` 版本分支）像旋风一样席卷了生态系统，并真正成为了游戏规则的改变者。


    为了说明这一点，这里是 [Jenkins](https://jenkins.io/) 的关键特性，它们使其区别于许多其他竞争方案：


    *   内置对流水线的支持（也称为“流水线代码”）

    *   改进的 UI 和易用性

    *   非常易于安装和配置

    *   卓越的扩展性和丰富的插件生态系统

    *   分布式部署

    *   自动化


    为了演示这些大部分特性的运行效果，我们将把目前学到的关于 [Docker](https://www.docker.com/) 的知识投入实践，并构建自己的
    [Jenkins](https://jenkins.io/) 镜像。不仅如此，我们还将其与 [Git](https://git-scm.com/) 集成（使用极其流行的
    [Github](https://github.com/) 托管），配置工具，为我们[之前开发过的](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)
    [Spring Boot](https://projects.spring.io/spring-boot/) 应用创建多分支流水线。最后，同样重要的是，我们将以完全自动化的方式完成这一切。如果听起来很令人，让我们开始吧。


    ## 3 流水线即代码


    行业近期趋势之一是将持续交付流水线视为代码，将其存储在源码控制系统中并在需要时进行版本控制。如果你正你的项目中引入此类内容，[Jenkins](https://jenkins.io/)
    无疑是完美的选择。


    [Jenkins](https://jenkins.io/) 开箱支持多种流水线配置优势。我们在教程的这一部分将使用的流水线定义 [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)
    与你的项目一起放在仓库树的根目录下。


    正如你[可能记得](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)，我们的
    [Spring Boot](https://projects.spring.io/spring-boot/) 应用需要 [Java](https://www.java.com/en/)
    并使用 [Gradle](https://gradle.org/) 进行依赖管理。考虑到这些，这是一个我们构思的在 [Jenkins](https://jenkins.io/)
    中构建此类项目的简单流水线示例：


    ```markdown

    | 01 | `pipeline {` |

    | 02 | `agent any` |

    | 03 |   |

    | 04 | `options {` |

    | 05 | `disableConcurrentBuilds()` |

    | 06 | `buildDiscarder(logRotator(numToKeepStr:''5''))` |

    | 07 | `}` |

    | 08 |   |

    | 09 | `triggers {` |

    | 10 | `pollSCM(''H/15 * * * *'')` |

    | 11 | `}` |

    | 12 |   |

    | 13 | `tools {` |

    | 14 | `jdk` "jdk-8u162" |

    | 15 | `}` |

    | 16 |   |

    | 17 | `environment {` |

    | 18 | `JAVA_HOME="${jdk}"` |

    | 19 | `}` |

    | 20 |   |

    | 21 | `stages {` |

    | 22 | `stage(''Cleanup before build'') {` |

    | 23 | `steps {` |

    | 24 | `cleanWs()` |

    | 25 | `}` |

    | 26 | `}` |

    | 27 |   |

    | 28 | `stage(''Checkout from Github'') {` |

    | 29 | `steps {` |

    | 30 | `checkout scm` |

    | 31 | `}` |

    | 32 | `}` |

    | 33 |   |

    | 34 | `stage(''Build'') {` |

    | 35 | `steps {` |

    | 36 | `script {` |

    | 37 | `def rtGradle = Artifactory.newGradleBuild()` |

    | 38 | `rtGradle.tool = "Gradle 4.3.0"` |

    | 39 | `rtGradle.run buildFile:''build.gradle'', tasks:''clean build''` |

    | 40 | `}` |

    | 41 | `}` |

    | 42 | `}` |

    | 43 | `}` |

    | 44 |   |

    | 45 | `post {` |

