    Docker for Java Developers


    # Deploy on Docker


    ## 1. Introduction


    Many companies have been using container-based virtualization to deploy applications
    (including JVM based ones) in production way before [Docker](https://www.docker.com/)
    appearance on the horizon. However, primarily because of [Docker](https://www.docker.com/),
    deployment practices using containers turned into the mainstream these days.


    In this section of the tutorial, we are going to glance over some of the most
    popular orchestration and cluster management engines (covering a couple of cloud
    offerings as well) which natively support deployment and lifecycle of the containerized
    applications.


    The topics we are going to talk about are worth of several books (at least!) so
    the goal of this part would be to serve as an introduction. If you feel a particular
    interest in any of those, there is a tremendous amount of the resources available
    in the public access.


    ## 2. Containers as Deployment Units


    These days containers (in particular, [Docker](https://www.docker.com/) containers)
    became standardized units of software deployment. They are prepackaged with everything
    that the applications may need to run: code (or binary), runtime, system tools
    and libraries, you name it.


    Managing and orchestrating the container-based deployments is quite a hot topic
    and, as we are going to see in a moment, every solution out there offers it right
    from the start.


    ## 3. Orchestration using Kubernetes


    In a rare case you haven’t heard about it yet, [Kubernetes](https://kubernetes.io/)
    is an open-source system for automating deployment, scaling, and management of
    containerized applications. This is one of the most exciting, innovative and actively
    evolving projects in the open-source community. Probably, if you or your company
    is looking for container orchestration solution, [Kubernetes](https://kubernetes.io/)
    is the de-facto choice nowadays.


    There are a lot of things which [Kubernetes](https://kubernetes.io/) could do
    for you, but in this part of the tutorial we are going to see how easy it is to
    deploy our containerized [Spring Boot](https://projects.spring.io/spring-boot/)
    application stack, including [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/),
    using only minimal subset of the [Kubernetes](https://kubernetes.io/) features.


    Setting up a full-fledged [Kubernetes](https://kubernetes.io/) cluster on the
    local machine might sound a bit impractical but luckily [Kubernetes](https://kubernetes.io/)
    could be deployed in development mode via [minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#quickstart).
    This awesome tool spawns a single-node [Kubernetes](https://kubernetes.io/) cluster
    inside a virtual machine so you could develop on it day-to-day using your laptop
    or desktop for example.


    With the assumption that you [installed minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#installation)
    on the operating system of your choice, let us move on to the next step and deploy
    a couple of [Docker](https://www.docker.com/) containers on it.


    ```bash

    | 1 | $ minikube start

    ```


    When [minikube](https://kubernetes.io/docs/getting-started-guides/minikube/#quickstart)
    is started, we could immediately initiate [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)
    deployment, sticking to the same version `8.0.2` which we have been using along
    this tutorial.


    ```bash

    | 1 | $ kubectl run mysql --image=mysql:8.0.2 --env=''MYSQL_ROOT_PASSWORD=p$ssw0rd''
    --env=''MYSQL_DATABASE=my_app_db'' --env=''MYSQL_ROOT_HOST=%'' --port=3306

    ```


    It will take some time and at the end you should be able to see [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)
    container (or better to say, [Kubernetes](https://kubernetes.io/) pod) up and
    running:


    ```bash

    | 1 | $ kubectl get pod

    | 2 | NAME READY STATUS RESTARTS AGE

    | 3 | mysql-5d4dbcd58-6ck 1/1 Running 0 22m

    ```


    Excellent, now we would need to rebuild the [Docker](https://www.docker.com/)
    image of our [Spring Boot](https://projects.spring.io/spring-boot/) application
    we developed previously, using the [Docker](https://www.docker.com/) settings
    of the deployed [Kubernetes](https://kubernetes.io/) cluster (alternatively, we
    could have used private registry).


    ```bash

    | 1 | $ eval $(minikube env) |

    | 2 | $ docker build \

    | 3 | --build-arg BUILD_VERSION=0.1-SNAPSHOT |

    | 4 | -f Dockerfile.build |

    | 5 | -t jcg/spring-boot:latest |

    | 6 | -t jcg/spring-boot:0.1-SNAPSHOT

    ```


    With this step completed, we have our [Docker](https://www.docker.com/) image
    available for deployment in [Kubernetes](https://kubernetes.io/) and we could
    run it as another pod.


    ```bash

    | 1 | $ kubectl run spring-boot-webapp --image=jcg/spring-boot:latest --env=''DB_HOST=mysql.default.svc.local''
    --port=19900 --image-pull-policy=Never

    ```


    Let us check that we have two pods up and running:


    ```bash

    | 1 | $ kubectl get pod

    | 2 | NAME READY STATUS RESTARTS AGE

    | 3 | mysql-5d4dbcd58-ck 1/1 Running 0 33m

    | 4 | spring-boot-webapp-5ff845bf5-gfqv 1/1 Running 0 31m

    ```


    Last but not least, we have to expose our [Spring Boot](https://projects.spring.io/spring-boot/)
    application deployment as [Kubernetes](https://kubernetes.io/) service to make
    it accessible:


    ```bash

    | 1 | $ kubectl expose deployment spring-boot-webapp --type=NodePort

    ```


    And quickly check it is listed among other services:


    ```bash

    | 1 | $ kubectl.exe get service

    | 2 | NAME TYPE CLUSTER-IP EXTERNAL-IP PORT(S) AGE

    | 3 | kubernetes ClusterIP 10.96.0.1 443/TCP 4d

    | 4 | spring-boot-webapp NodePort 10.109.108.87 19900:30253/TCP 40s

    ```


    And that’s basically it, in a few simple steps we have gotten our [Docker](https://www.docker.com/)
    containers up and running, all managed by [Kubernetes](https://kubernetes.io/).
    Let us make sure that the application is actually passing all the health checks:


    ```bash

    | 01 | $ curl $(minikube service spring-boot-webapp --url)/application/health

    | 02 | {

    | 03 | "status": "UP",

    | 04 | "details": {

    | 05 | "diskSpace": {

    ```

