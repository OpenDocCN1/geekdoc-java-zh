    ## 11\. Conclusions


    Fairly speaking, [Docker Engine API](https://docs.docker.com/engine/api/) is just
    a set of [REST(ful) services](https://en.wikipedia.org/wiki/Representational_state_transfer),
    very rich ones though. For sure, anyone could access them from any Java application
    just by using generic HTTP client. So what the deal?


    Personally, I would emphasize the explicit contracts, maintainability and type-safety.
    Instead of dealing with URIs, query or path parameters, raw [JSON](http://www.json.org/)
    for request and response payloads, you have a stable Java-based API, with strict
    set of capabilities and expectations.


    As we are going to see later on, [Spotify Docker Client](https://github.com/spotify/docker-client)
    serves as a solid foundation for automation and advanced testing techniques, particularly
    in context of Java development. Thank you, [Spotify](https://spotify.github.io/),
    for giving back to the community!


    ## 12\. What’s next


    In the next section we are going to talk about the ways to migrate your build
    pipelines to [Docker](https://www.docker.com/), as such eliminating the need to
    replicate and maintain the tooling on each host or in every environment.


    Docker for Java Developers


    # Build on Docker


    ## 1\. Introduction


    Over the first few parts of the tutorial we went through basics of the [Docker](https://www.docker.com/)
    and the multitude of the ways to interface with it. It is time to apply the knowledge
    we have acquired to real-world Java projects, starting the discussion from the
    topic of how [Docker](https://www.docker.com/) affects the well-established build
    processes and practices.


    Fairly speaking, the goal of this section is two-fold. First, we will take a look
    at how the existing build tools, namely the [Apache Maven](https://maven.apache.org/)
    and [Gradle](https://gradle.org/), are helping to package Java applications as
    [Docker](https://www.docker.com/) containers. Secondly, we will push this idea
    even further and learn how we could use [Docker](https://www.docker.com/) to entirely
    encapsulate the build pipeline of our Java applications and produce the final
    [Docker](https://www.docker.com/) images at the end.


    ## 2\. Under the Magnifying Glass


    To experiment with, we are going to design two simple (but nonetheless meaningful)
    Java web applications which would implement and expose the [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)
    for tasks management.


    The first application is going to be developed on top of [Spring Boot](https://projects.spring.io/spring-boot/)
    and [Spring Webflux](https://docs.spring.io/spring/docs/current/spring-framework-reference/web-reactive.html),
    using [Gradle](https://gradle.org/) as build and dependency management tool. In
    terms of versions, we will be using [Spring Boot](https://projects.spring.io/spring-boot/)
    latest milestone `2.0.0.M6`, [Spring Webflux](https://docs.spring.io/spring/docs/current/spring-framework-reference/web-reactive.html)
    latest release `5.0.1` and [Gradle](https://gradle.org/) latest release `4.3`.


    The second application, while functionally equivalent to the first one, will be
    developed on top of another popular Java framework, [Dropwizard](http://www.dropwizard.io/),
    this time using [Apache Maven](https://maven.apache.org/) for build and dependency
    management. In terms of versions, we are going to bring [Dropwizard](http://www.dropwizard.io/)
    latest release `1.2.0` and [Apache Maven](https://maven.apache.org/) latest release
    `3.5.2`.


    As we mentioned, both applications would implement and expose the [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)
    for tasks management, essentially wrapping the [CRUD](https://en.wikipedia.org/wiki/Create,_read,_update_and_delete)
    (create, read, update and delete) operations.


    | `1` | `GET     /tasks` |


    | `2` | `POST    /tasks` |


    | `3` | `DELETE  /tasks/{``id``}` |


    | `4` | `GET     /tasks/{``id``}` |


    The task itself is modeled as a [persistent entity](https://en.wikipedia.org/wiki/Java_Persistence_API)
    which is going to be managed by [Hibernate ORM](http://hibernate.org/) and stored
    in the [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/) relation database.


