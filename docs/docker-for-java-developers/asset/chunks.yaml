  trans: "\n看起来不错，让我们对 [Spring Boot](https://projects.spring.io/spring-boot/) 应用也进行同样的操作，从\
    \ [Marathon](http://mesosphere.github.io/marathon/) 部署描述符开始，并将其持久化到 `spring-webapp.json`\
    \ 文件。\n\n```json\n{\n  \"id\": \"/jcg/spring-webapp\",\n  \"container\": {\n \
    \   \"type\": \"DOCKER\",\n    \"docker\": {\n      \"image\": \"jcg/spring-boot-webapp:latest\"\
    ,\n      \"network\": \"BRIDGE\",\n      \"portMappings\": [\n        {\n    \
    \      \"containerPort\": 19900,\n        \"servicePort\": 19900,\n        \"\
    hostPort\": 19900\n        }\n      ],\n      \"parameters\": [\n        { \"\
    key\": \"hostname\", \"value\": \"spring-webapp\" }\n    ]\n  },\n  \"env\": {\n\
    \    \"DB_HOST\": \"172.17.0.2\"\n  },\n  \"instances\": 1,\n  \"cpus\": 0.1,\n\
    \  \"mem\": 512,\n  \"healthChecks\": [\n    {\n      \"protocol\": \"COMMAND\"\
    ,\n      \"command\": { \"value\": \"nc -z localhost 19900\" },\n      \"gracePeriodSeconds\"\
    : 25,\n      \"intervalSeconds\": 10,\n      \"timeoutSeconds\": 5,\n      \"\
    maxConsecutiveFailures\": 3\n    }\n  ]\n}\n```\n\n下一步是将其提交到 [Marathon](http://mesosphere.github.io/marathon/)：\n\
    \n```bash\n$ curl -X POST http://localhost:8080/v2/apps -d @spring-webapp.json\
    \ -H \"Content-type: application/json\"\n{\n  \"id\": \"/jcg/spring-webapp\",\n\
    \  \"container\":{\n    …\n  },\n  …\n}\n```\n\n我们实际上已经完成了！一旦部署完成，我们应该能够看到处于运行状态的应用程序应用堆栈，例如，可以使用\
    \ [Marathon](http://mesosphere.github.io/marathon/) 的 [web UI](https://mesosphere.github.io/marathon/docs/marathon-ui.html)，可以通过\
    \ [http://localjost:8080/ui/] 访问。\n\n![](img/marathon-jcg.png)\n\n## Marathon\
    \ 应用\n\n好奇的读者可能会想，我们是如何将这两个 [Marathon](http://mesosphere.github.io/marathon/)\
    \ 应用——[Spring Boot](https://projects.spring.io/spring-boot/) 和 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 连接在一起的。对于这个特定案例，我们使用了由 [Mesos-DNS](https://mesosphere.github.io/mesos-dns/)\
    \ 实现的 [Apache Mesos](http://mesos.apache.org/) 的[服务发现和负载均衡](https://mesosphere.github.io/marathon/docs/service-discovery-load-balancing.html)\
    \ 能力。为了演示它们的作用，以下是如何通过名称 `mysql-jcg.marathon.mesos` 查询 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 实例的 IP 地址：\n\n```bash\n$ curl http://localhost:8123/v1/hosts/mysql-jcg.marathon.mesos\n\
    [\n  {\n    \"host\": \"mysql-jcg.marathon.mesos\",\n    \"ip\": \"172.17.0.2\"\
    \n  }\n]\n```\n\n像往常一样，让我们向其健康端发送请求来确认 [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ 应用已启动并运行：\n\n```bash\n$ curl http://localhost:19900/application\n{\n  \"details\"\
    : {\n    \"db\": {\n      \"database\": \"MySQL\",\n      \"hello\": 1\n    },\n\
    \    \"status\": \"UP\"\n  },\n  \"diskSpace\": {\n    \"details\": {\n      \"\
    free\": 440180264,\n      \"threshold\": 1048576,\n      \"total\": 4953692560\n\
    \    },\n    \"status\": \"UP\"\n  },\n  \"status\": \"UP\"\n}\n```\n\n## 5. 使用\
    \ Docker Swarm 进行编排\n\n自从 [Docker](https://www.docker.com/) 在引擎中嵌入集群管理和编排功能已经有一段时间了。这个编排层曾被称为\
    \ [Docker Swarm](https://github.com/docker/swarm)，但后来演变成了本质上一种特殊的模式（[swarm mode](https://docs.docker.com/engine/swarm/)），用于其中运行\
    \ [Docker Engine](https://docs.docker.com/engine/)。\n\n如果你非常看重 [Docker](https://www.docker.com/)\
    \ 并且不想寻找其他东西，那么在 [swarm mode](https://docs.docker.com/engine/swarm/) 下运行 [Docker\
    \ Engine](https://docs.docker.com/engine/) 可以作为一个很好的编排器选项。它也非常容易上手。\n\n```bash\n\
    $ docker swarm init\n```\n\n从概念上讲，除了 [Docker Engine](https://docs.docker.com/engine/)\
    \ 本身的变化外，集群模式还引入了很多区别。首先，你应该开始以“服务”来思考，而不是“容器”。关于所有都运行在单个 [Docker](https://www.docker.com/)\
    \ 主机上的假设将不再准确，因为集群将由许多分布在网络中的多个 [Docker](https://www.docker.com/) 主机组成。\n\n在 [swarm\
    \ mode](https://docs.docker.com/engine/swarm/) 下运行 [Docker Engine](https://docs.docker.com/engine/)\
    \ 时，我们可以使用已经熟悉的 [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ 规范来部署整个应用程序（服务）堆栈。但只有一个限制，[docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ 文件格式应该是版本 `3（或以上）`，以便在 [Docker Compose](https://docs.docker.com/compose/overview/)\
    \ 和 [Docker Engine](https://docs.docker.com/engine/) 的 [swarm mode](https://docs.docker.com/engine/swarm/)\
    \ 之间兼容。\n\n为了查看 [swarm mode](https://docs.docker.com/engine/swarm/) 的效果，让我们稍微重构我们的\
    \ [Spring Boot](https://projects.spring.io/spring-boot/) 应用堆栈，以符合 [docker-compose](https://docs.docker.com/compose/compose-file/compose-file/)\
    \ 文件格式版本 `3.3`。\n\n```yaml\nversion: '3.3'\n\nservices:\n  mysql:\n    image:\
    \ mysql:8.0.2\n    environment:\n      - MYSQL_ROOT_PASSWORD=password\n      -\
    \ MYSQL_DATABASE=my_app\n      - MYSQL_HOST_HOST\n    healthcheck:\n      test:\
    \ [\"CMD-SHELL\", \"ss -ltn src :3306 | grep 3306\"]\n      interval: 10s\n  \
    \    timeout: 5s\n      retries: 3\n    networks:\n      - my-app-network\n  java-app:\n\
    \    image: jcg/spring-boot-webapp:latest\n    environment:\n      - DB_HOST=mysql\n\
    \    ports:\n      - 19900:19900\n    depends_on:\n      - mysql\n    healthcheck:\n\
    \      test: [\"CMD-SHELL\", \"nc -z localhost 19900\"]\n      interval: 10s\n\
    \      timeout: 5s\n      retries: 3\n    networks:\n      - my-app-network\n\n\
    networks:\n  my-app-network:\n    driver: overlay\n```\n"
