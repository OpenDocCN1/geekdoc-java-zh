    ## 10\. The Primer


    To finish up this section, it would be great to have a realistic example where
    all the APIs we have looked at so far work seamlessly together.  As we have been
    playing mostly with [MySQL](https://hub.docker.com/_/mysql/), quite popular choice
    as a relational data store for Java (and not only) applications, the end-to-end
    demo would be based on it. So what are our goals?


    1.  Create a container instance using `mysql:8.0.2` image


    2.  Expose TCP port `3306` and bind it to a random host port (so we could run
    as many containers as we want, without having a port conflicts)


    3.  Make sure the container is started and [MySQL](https://hub.docker.com/_/mysql/)
    server process is ready to serve our queries


