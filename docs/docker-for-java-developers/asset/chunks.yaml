  trans: "\n\n掌握了这些技巧和技巧后，我们可以讨论一下即将实现的测试场景。从本质上，为我们在教程之前的部分开发的一个应用程序运行端到端测试是非常棒的。该测试场景的最终目标是验证用于任务管理的\
    \ [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ 是否可用并返回预期的结果。\n\n从部署栈的角度来看，这意味着我们必须拥有一个 [MySQL](https://www.mysql.com/) 实例和一个应用程序实例（让我们选择之前开发过的基于\
    \ [Spring Boot](https://projects.spring.io/spring-boot/) 的那一个，不过这其实并不重要）。该应用程序暴露了\
    \ [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ 并且应该能够与 [MySQL](https://www.mysql.com/) 实例进行通信。显然，我们希望这些实例以 [Docker](https://www.docker.com/)\
    \ 容器的形式运行。\n\n该测试场景将调用任务管理的 [REST(ful) APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ 来获取所有可用任务的列表，并使用出色的 [REST-assured](http://rest-assured.io/) 框架作为测试脚架。此外，我们所有的测试场景都将基于\
    \ [JUnit](http://junit.org/) 框架。\n\n## 5. Testcontainers\n\n我们将看到的第一个框架是 [TestContainers](https://www.testcontainers.org/)，这是一个支持\
    \ [JUnit](http://junit.org/junit4/) 测试的 Java 库，并为常见的数据库、Selenium Web 浏览器或任何可以在\
    \ [Docker](https://www.docker.com/) 容器中运行的内容提供轻量级、丢弃的实例。\n\n让我们看看如何利用 [TestContainers](https://www.testcontainers.org/)\
    \ 将我们之前概述的测试场景到运行的 [JUnit](http://junit.org/junit4/) 测试中。最后，它看起来非常直观。\n\n```java\n\
    package com.javacodegeeks;\n\nimport static io.restassured.RestAssured.when;\n\
    import static org.hamcrest.CoreMatchers.equalTo;\n\nimport org.junit.BeforeClass;\n\
    import org.junit.ClassRule;\nimport org.junit.Test;\nimport org.testcontainers.containers.GenericContainer;\n\
    import org.testcontainers.containers.Network;\nimport org.testcontainers.containers.wait.HostPortWaitStrategy;\n\
    \nimport io.restassured.RestAssured;\n\npublic class SpringBootAppIntegrationTest\
    \ {\n    @ClassRule\n    public static Network network = Network.newNetwork();\n\
    \n    @ClassRule\n    public static GenericContainer<?> mysql = new GenericContainer<>(\"\
    mysql:8.0.2\")\n        .withEnv(\"MYSQL_ROOT_PASSWORD\", \"p$ssw0rd\")\n    \
    \    .withEnv(\"MYSQL_DATABASE\", \"my_app_db\")\n        .withEnv(\"MYSQL_ROOT_HOST\"\
    , \"%\")\n        .withExposedPorts(3306)\n        .withNetwork(network)\n   \
    \     .withNetworkAliases(\"mysql\")\n        .waitingFor(new HostPortWaitStrategy());\n\
    \n    @ClassRule\n    public static GenericContainer<?> javaApp = new GenericContainer<>(\"\
    jcg/spring-boot-webapp:latest\")\n        .withEnv(\"DB_HOST\", \"mysql\")\n \
    \       .withExposedPorts(19900)\n        .withStartupAttempts(3)\n        .withNetwork(network)\n\
    \        .waitingFor(new HostPortWaitStrategy());\n\n    @BeforeClass\n    public\
    \ static void setUp() {\n        RestAssured.baseURI = \"http://\" + javaApp.getIpAddress();\n\
    \        RestAssured.port = javaApp.getMappedPort(19900);\n    }\n\n    @Test\n\
    \    public void getAllTasks() {\n        when()\n            .get(\"/tasks\"\
    )\n            .then()\n            .statusCode(200)\n            .body(equalTo(\"\
    []\"));\n    }\n}\n```\n\n[TestContainers](https://www.testcontainers.org/) 自带了一组预定义的专用容器（用于\
    \ [MySQL](https://www.mysql.com/)、[PostgreSQL](https://www.postgresql.org/)、[Oracle\
    \ XE](http://www.oracle.com/database/technologies/express-edition/index.html)\
    \ 等），但你始终可以使用自己的（如我们在上面的代码段中所的那样）。它还原生支持 [Docker Compose](https://www.testcontainers.org/usage/docker-compose.html)\
    \ 规范。\n\n如果你使用 Windows 作为开发平台，请注意 [TestContainers](https://www.testcontainers.org/)\
    \ 并没有在 Windows 上进行定期测试。如果你仍然想尝试，目前的建议是使用 [alpha release](https://www.testcontainers.org/usage/windows_support)。\n\
    \n## 6. Arquillian\n\n列表中的下一个是 [Arquillian](http://arquillian.org/)，这是一个针对 JVM\
    \ 的创新且高度扩展的测试平台，允许开发者轻松地为 Java 中间件创建自动化集成、功能和验收测试。[Arquillian](http://arquillian.org/)\
    \ 确实更是一个测试平台而非框架，其中 [Docker](https://www.docker.com/) 支持只是许多选项之一。\n\n让我们看看上一节中看到的相同测试在翻译为\
    \ [Arquillian Cube](http://arquillian.org/arquillian-cube/) 后会是什么样，它是一个 [Arquillian](http://arquillian.org/)\
    \ 扩展，可用于管理 [Docker](https://www.docker.com/) 容器。\n\n```java\npublic class SpringBootAppIntegrationTest\
    \ {\n    @ClassRule\n    public static NetworkDslRule network = new NetworkDslRule(\"\
    my-app-network\");\n\n    @ClassRule\n    public static ContainerDslRule mysql\
    \ = new ContainerDslRule(\"mysql:8.0.2\", \"mysql\")\n        .withEnv(\"MYSQL_ROOT_PASSWORD\"\
    , \"p$ssw0rd\")\n        .withEnv(\"MYSQL_DATABASE\", \"my_app_db\")\n       \
    \ .withEnv(\"MYSQL_ROOT_HOST\", \"%\")\n        .withExposedPorts(3306)\n    \
    \    .withNetworkMode(\"my-app-network\")\n        .withAwaitStrategy(AwaitBuilder.logAwait(\"\
    /usr/sbin/mysqld: ready for connections\"));\n\n    @ClassRule\n    public static\
    \ ContainerDslRule javaApp = new ContainerDslRule(\"jcg/spring-boot-webapp:latest\"\
    , \"spring-boot-webapp*\")\n        .withEnv(\"DB_HOST\", \"mysql\")\n       \
    \ .withPortBinding(19900)\n        .withNetworkMode(\"my-app-network\")\n    \
    \    .withLink(\"mysql\", \"mysql\")\n        .withAwaitStrategy(AwaitBuilder.logAwait(\"\
    Started AppStarter\"));\n\n    @BeforeClass\n    public static void setUp() {\n\
    \        RestAssured.baseURI = \"http://\" + javaApp.getIpAddress();\n       \
    \ RestAssured.port = javaApp.getBindPort(19900);\n    }\n\n    @Test\n    public\
    \ void getAllTasks() {\n        when()\n            .get(\"/tasks\")\n       \
    \     .then()\n            .statusCode(200)\n            .body(equalTo(\"[]\"\
    ));\n    }\n}\n```\n\n"
- fmt: "\nThere are a couple of differences from [TestContainers](https://www.testcontainers.org/)\
    \ but, by and large, the test case should be looking familiar already. The key\
    \ feature which seems to be unavailable in the [Arquillian Cube](http://arquillian.org/arquillian-cube/)\
    \ at the moment (at least, when using [Container Objects DSL](http://arquillian.org/arquillian-cube/#_container_objects_dsl))\
    \ is support for network aliasing so we had to fall back to [legacy container\
    \ linking](https://docs.docker.com/engine/userguide/networking/default_network/dockerlinks/)\
    \ in order to connect our [Spring Boot](https://projects.spring.io/spring-boot/)\
    \ application with [MySQL](https://www.mysql.com/) backend.\n\nIt is worth to\
    \ mention that [Arquillian Cube](http://arquillian.org/arquillian-cube/) has quite\
    \ a few alternative ways to manage [Docker](https://www.docker.com/) containers\
    \ from the test scenarios, including [Docker Compose](https://www.testcontainers.org/usage/docker_compose.html)\
    \ specifications support. On a side note, the pace of development around [Arquillian](http://arquillian.org/)\
    \ is just incredible, it has all the chances to be one stop shop testing platform\
    \ for modern Java applications.\n\n## 7. Overcast\n\n[Overcast](https://github.com/xebialabs/overcast)\
    \ is a Java library from [XebiaLabs](https://xebialabs.com/) intended to be used\
    \ to test against hosts in the cloud. [Overcast](https://github.com/xebialabs/overcast)\
    \ was one of the first test frameworks to offer the extensive [Docker](https://www.docker.com/)\
    \ support while aiming for more ambitious goals to abstract away the host management\
    \ in the test scenarios. It has a lot of very interesting features but sadly seems\
    \ to be not actively maintained anymore, with last release dated 2015. Nonetheless,\
    \ it is worth looking as it has some unique values.\n\n[Overcast](https://github.com/xebialabs/overcast)\
    \ uses configuration driven approach to describe the hosts under the test, stemming\
    \ from the fact that it is not oriented only on containers or/and [Docker](https://www.docker.com/).\n\
    \n```conf\nmysql {\n  name=\"mysql\"\n  dockerImage=\"mysql:8.0.2\"\n  remove=true\n\
    \  removeVolume=true\n  env=[\"MYSQL_ROOT_PASSWORD=p$ssw0rd\", \"MYSQL_DATABASE=my_app_db\"\
    , \"MYSQL_ROOT_HOST=%\"]\n}\n\nspring-boot-webapp {\n  dockerImage=\"jcg/spring-boot-webapp:latest\"\
    \n  exposeAllPorts=true\n  remove=true\n  removeVolume=true\n  env=[\"DB_HOST=mysql\"\
    ]\n  links=[\"mysql:mysql\"]\n}\n```\n\nWith such configuration in place, stored\
    \ in the `overcast.conf`, we could refer to containers by their names from the\
    \ test scenarios.\n\n```java\npublic class SpringBootAppIntegrationTest {\n  \
    \  private static CloudHost mysql = CloudHostFactory.getCloudHost(\"mysql\");\n\
    \    private static CloudHost javaApp = CloudHostFactory.getCloudHost(\"spring-boot-webapp\"\
    );\n\n    @BeforeClass\n    public static void setUp() {\n        mysql.setup();\n\
    \        javaApp.setup();\n\n        RestAssured.baseURI = \"http\" + javaApp.getHostName();\n\
    \        RestAssured.port = javaApp.getPort(19900);\n\n        await()\n     \
    \       .atMost(20, TimeUnit.SECONDS)\n            .ignoreExceptions()\n     \
    \       .pollInterval(1, TimeUnit.SECONDS)\n            .untilAsserted(() ->\n\
    \                when()\n                    .get(\"/application/health\")\n \
    \                   .then()\n                    .statusCode(200))\n         \
    \   );\n    }\n\n    @AfterClass\n    public static void tearDown() {\n      \
    \  javaApp.teardown();\n        mysql.teardown();\n    }\n\n    @Test\n    public\
    \ void getAllTasks() {\n        when()\n            .get(\"/tasks\")\n       \
    \     .then()\n            .statusCode(200)\n            .body(equalTo(\"[]\"\
    ));\n    }\n}\n```\n\nIt looks straightforward except the health check part. `Overcast`\
    \ does not provide the means to verify that containers are up and ready to serve\
    \ requests, so we on-board another great library, [Awaitility](https://github.com/awaitility/awaitility),\
    \ to compensate that. There is a lot of potential and benefits which `Overcast`\
    \ could provide, hopefully we would see it back to active development. As for\
    \ this example, in order to use the latest `Overcast` features we had to build\
    \ it from sources.\n\n## 8. Docker Compose Rule\n\nLast but not least, us discuss\
    \ the [Docker Compose Rule](https://github.com/palantir/docker-compose-rule),\
    \ a library from [Palantir Technologies](https://www.palantir.com/) for executing\
    \ [JUnit](http://junit.org/4/) tests that interact with [Docker Compose](https://docs.docker.com/compose/reference/)\
    \ containers. Under the hood it uses the `docker-compose` command line tool and,\
    \ as of now, the Windows platform is not supported. As you may guess, we have\
    \ to start off from `docker-compose.yml` specification so it could be read by\
    \ `Docker Compose Rule` later. Here is an example of one.\n\n```yaml\nversion:\
    \ '2.1'\nservices:\n  mysql:\n    image: mysql:8.0.2\n    environment:\n     \
    \ - MYSQL_ROOT_PASSWORD=p$$w0rd\n      - MYSQL_DATABASE=my_app_db\n      - MYSQL_ROOT_HOST=%\n\
    \    expose:\n      - 3306\n    healthcheck:\n      test: [\"CMD-SHELL\", \"ss\
    \ -lt :3306 | grep 3306\"]\n      interval: 10s\n      timeout: 5s\n      retries:\
    \ 3\n    tmpfs:\n      - /var/lib/mysql\n    networks:\n      - my-app-network\n\
    \  java-app:\n    image: jcg/spring-boot-webapp:latest\n    environment:\n   \
    \   - DB_HOST=mysql\n    ports:\n      - 19900\n    depends_on:\n      mysql:\n\
    \        condition: service_healthy\n    networks:\n      - my-app-network\nnetworks:\n\
    \  my-app-network:\n    driver: bridge\n```\n\nWith that, we just need to feed\
    \ this specification to `Docker Compose Rule`, like in the code snippet below.\
    \ Please also notice that we have augmented the scenario with a health check to\
    \ make sure that our [Spring Boot](https://projects.spring.io/spring-boot/) application\
    \ has fully started.\n\n```java\npublic class SpringBootAppIntegrationTest {\n\
    \    @ClassRule\n    public static DockerComposeRule docker = DockerComposeRule.builder()\n\
    \            .file(\"src/test/resources/docker-compose.yml\")\n            .waitingForService(\"\
    java-app\",\n                HealthChecks.toRespond2xxOverHttp(19900, (port) ->\n\
    \                    port.inFormat(\"http://\" + $HOST:$EXTERNAL_PORT/application/health\"\
    )),\n                Duration.standardSeconds(30)\n            )\n           \
    \ .shutdownStrategy(ShutdownStrategy.GRACEFUL)\n            .build();\n\n    @BeforeClass\n\
    \    public static void setUp() {\n        final DockerPort port = docker.containers().container(\"\
    java-app\").port(19900);\n        RestAssured.baseURI = port.inFormat(\"http://\"\
    \ + $HOST);\n        RestAssured.port = port.getExternalPort();\n    }\n}\n```\n"
