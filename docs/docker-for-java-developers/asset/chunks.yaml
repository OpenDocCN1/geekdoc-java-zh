    正如我们所见，大多数流行的 Java 开发 [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)
    提供的 [Docker](https://www.docker.com/) 工具已经足够了，甚至可以说是非常卓越的。但如果我们尝试突破极限，将我们的 [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)
    完全运行在 [Docker](https://www.docker.com/) 中，字面上的任何地方，会怎样？如果这听起来有点疯狂，确实如此，但是……


    [Eclipse Che](https://www.eclipse.org/che/) 是 [Eclipse](http://www.eclipse.org/)
    的下一代 [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)，它充分利用了容器化技术并完全运行在
    [Docker](https://www.docker.com/) 上。在底层，它由 [REST(ful) web APIs](https://en.wikipedia.org/wiki/Representational_state_transfer)
    驱动，并提供功能丰富的、基于浏览器的 [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)。


    ![Eclipse Che](img/eclipse-che-jcg.png)


    # Eclipse Che


    这是一个非常有创新且年轻的项目，具有彻底革新我们所知的 [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)
    概念的巨大潜力。看到未来如何发展将非常有趣，但这项技术已经到位并可供评估。


    ## 4. 那么调试如何？


    调试在过去、现在，很可能在未来在发现、理解和解决程序中的缺陷或问题方面发挥关键作用。而且无论你是否喜欢，无论 [Docker](https://www.docker.com/)
    多么强大，它都不会让我们的应用程序免于 bug。如果你以 [Docker](https://www.docker.com/) 容器运行 Java 应用，调试过程会有所不同，并会有详细解释。


    ## 5. 管理与监控


    尽管 [Docker](https://www.docker.com/) 命令行工具以及相应的 [Docker Engine API](https://docs.docker.com/engine/api/)
    可以让你完成任何任务，但许多人仍然倾向于使用 UI。


    ### 5.1. Portainer


    我们将查看工具是 [Portainer](https://portainer.io/)，这是一个开源轻量级管理 UI，可以方便地管理不同的 [Docker](https://www.docker.com/)
    环境（如 [Docker Swarm](https://docs.docker.com/swarm/) 集群）。并不意外 [Portainer](https://portainer.io/)
    本身作为一个轻量级 [Docker](https://www.docker.com/) 容器运行。让我们运行一个：


    ```

    docker run -d -p 9000:9000 -v /var/run/docker.sock:/var/run/docker.sock portainer/portainer

    ```


    在 Windows 机器上，命令略有不同：


    ```

    docker run -d -p 9000:9000 portainer/portainer

    ```


    一旦 [Portainer](https://portainer.io/) 容器启动，你就可以通过 [`localhost:9000`](http://localhost:9000)
    提供的精美 Web UI 访问它（如果你使用的是非原生 [Docker](https://www.docker.com/) 安装，则为 `http://<docker-machine>:9000`）。


    ![Portainer Dashboard](img/portainer-jcg-1024x413.png)


    # Portainer Dashboard 板


    完成设置步骤（如有必要），将被导航到特定 [Docker](https://www.docker.com/) 环境的全方位视图，从简单的仪表板页面开始。你将识别左侧列出的
    [Docker](https://www.docker.com/) 对象（如卷、网络、容器、镜像、……），从而可以选择其中任何一个以重定向到专用视图。


    [Portainer](https://portainer.io/) 通过直观的 Web 界面展示的 [Docker](https://www.docker.com/)
    功能列表令人惊叹。如果你偏好 UI 工具而非命令行工具，[Portainer](https://portainer.io/) 有极可能成为你的一站式服务中心。


