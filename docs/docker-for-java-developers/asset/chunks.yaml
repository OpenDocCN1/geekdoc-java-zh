    | `7` | `Ergonomics Machine Class: client` |


    | `8` | `Using VM: OpenJDK 64-Bit Server VM` |


    The curious reader may be wondering why the maximum heap size is quite over the
    expected `25%` of the available physical memory allocated to the container. The
    answer is that [Docker](https://www.docker.com/) also allocates memory for swap
    (which, if not specified, is equal to desired memory limit) so the true value
    JVM sees is `256Mb + 256Mb = 512Mb`.


    But even here we could make improvements. Usually, when we are running Java applications
    inside [Docker](https://www.docker.com/) containers, there is only place for a
    single JVM process in there, so why don’t we just give it all the available memory
    container has? That is actually very simple to do by adding `-XX:MaxRAMFraction=1`
    command line option.


    | `1` | `$ docker run --``rm` `--cpuset-cpus=0 --memory=256m openjdk:8-jdk-alpine
    java -XshowSettings:vm -XX:+UseParallelGC -XX:+PrintFlagsFinal  -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap -XX:MaxRAMFraction=1  -version` |


    And let us check what JVM reports:


    | `01` | `...` |


    | `02` | `uintx ParallelGCThreads = 1` |


    | `03` | `...` |


    | `04` |   |


    | `05` | `VM settings:` |


    | `06` | `Max. Heap Size (Estimated): 228.00M` |


    | `07` | `Ergonomics Machine Class: client` |


    | `08` | `Using VM: OpenJDK 64-Bit Server VM` |


    | `09` |   |


    | `10` | `openjdk version` `"1.8.0_131"` |


    | `11` | `OpenJDK Runtime Environment (IcedTea 3.4.0) (Alpine 8.131.11-r2)` |


    | `12` | `OpenJDK 64-Bit Server VM (build 25.131-b11, mixed mode)` |


    It looks just perfect. Please be aware of this experimental JVM options and use
    them appropriately, so you could adjust the resources your Java applications should
    be using.


    ## 3\. Storing data in RAM


    It is rarely the case that the application has no dependency on some kind of data
    store (sometimes even more than one). And, unsurprisingly, most of such stores
    persist the data on some kind of durable storage. This is great indeed, but quite
    often the presence of such data stores makes the testing a challenge, specifically
    when summoning the isolation of the test cases on the data level.


    You may have already guessed, [Docker](https://www.docker.com/) could enormously
    reduce the efforts required to create reproducible test scenarios. But still,
    the data stores serve as the major contributor to overall test execution time.


    As we are going to see in a moment, [Docker](https://www.docker.com/) has something
    in the sleeve to help us out: [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/).
    It effectively gives the container a way to manage the data without writing it
    anywhere permanently, keeping it in the host machine’s memory (or swap, if memory
    is running low).


    There are multiple options available which allow to attach [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)-backed
    volumes to your container, but the recommended one these days is to use `--mount`
    command line argument (or [tmpfs](https://docs.docker.com/compose/compose-file/#tmpfs)
    section of the specification in case of [docker-compose](https://docs.docker.com/compose/reference/overview/)).


    | `1` | `docker run --``rm` `-d \` |


    | `2` | `--name mysql \` |


    | `3` | `--``mount` `type``=tmpfs,destination=/var/lib/mysql \` |


    | `4` | `-e MYSQL_ROOT_PASSWORD=``''p$ssw0rd''` `\` |


    | `5` | `-e MYSQL_DATABASE=my_app_db \` |


    | `6` | `-e MYSQL_ROOT_HOST=% \` |


    | `7` | `mysql:8.0.2` |


    The speed gains for test executions could be tremendous, but you should not use
    this feature in production (and very likely, in any other environments), ever,
    because when the container stops, the [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    mount disappears. Even if the container is committed, the [tmpfs](https://docs.docker.com/engine/admin/volumes/tmpfs/)
    mount is not saved.


