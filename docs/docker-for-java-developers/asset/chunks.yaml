    the container orchestration platform. [Marathon](http://mesosphere.github.io/marathon/)
    provides a [beautiful web UI](https://mesosphere.github.io/marathon/docs/marathon-ui.html)
    as well as [REST(ful) APIs](https://mesosphere.github.io/marathon/api-console/index.html)
    to manage the application deployments and uses own [JSON](https://www.json.org/)-based
    specification format. Following our [Spring Boot](https://projects.spring.io/spring-boot/)
