    Docker for Java Developers


    # Develop on Docker


    ## 1\. Introduction


    In the [last part of the tutorial](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)
    we learned a number of ways to package (and run) Java applications as [Docker](https://www.docker.com/)
    containers. In this part we are going to focus more on how [Docker](https://www.docker.com/)
    impacts our development practices in a quite positive ways.


    Fairly speaking, there are a lot of areas where [Docker](https://www.docker.com/)
    could be very helpful for developers. The emphasis of our discussion will be made
    on [Docker](https://www.docker.com/) integration with [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s,
    running [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s
    as [Docker](https://www.docker.com/) containers and getting to know a couple of
    useful tools for managing and monitoring your [Docker](https://www.docker.com/)
    environments.


    ## 2\. Docker from your IDE


    As we have seen so far, [Docker](https://www.docker.com/)’s command line tools
    are very powerful and their usage is pretty straightforward. However, most of
    us, developers, spend major part of the day in our favorite [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment).
    Switching between dozens of windows and terminals in the middle of the debugging
    session while hunting for a hard to reproduce bug in the application logic could
    be quite counterproductive.


    Luckily, all three leading Java development [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s,
    namely [Eclipse](http://www.eclipse.org/), [JetBrains IntelliJ IDEA](https://www.jetbrains.com/idea/)
    and [NetBeans](https://netbeans.org/), provide integration with [Docker](https://www.docker.com/)
    tooling through convenient UI views or/and widgets. Let us quickly go over each
    of these [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)s
    and take a closer look on what one has to offer.


    ### 2.1\. Eclipse


    [Eclipse Oxygen](https://projects.eclipse.org/releases/oxygen), the latest released
    version of [Eclipse](http://www.eclipse.org/) [IDE](https://en.wikipedia.org/wiki/Integrated_development_environment)
    as of this moment, has comprehensive [Docker](https://www.docker.com/) tooling
    support provided by [Linux Tools](https://www.eclipse.org/linuxtools/downloads.php)
    subproject (available as a plugin). Once installed, it contributes four additional
    views under `Docker` category.


    ![Docker Views in Eclipse](images/docker-eclipse-jcg-245x300.png)


    Docker Views in Eclipse


    Each of these views exposes some details about [Docker](https://www.docker.com/)
    containers or images, with `Docker Explorer` being all-in-one view of both.


    ![Docker Explorer View](images/docker-explorer-jcg-1-252x300.png)


    Docker Explorer View


    If you are interested just in [Docker](https://www.docker.com/) containers, there
    is a dedicated `Docker Containers` view, which uses compact, table-based representation.'
