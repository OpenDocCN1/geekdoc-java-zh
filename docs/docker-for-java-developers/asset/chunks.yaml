    ## 7\. Conclusions


    In this section of the tutorial we have seen a couple of examples on how the popular
    build and dependency management tools, namely [Apache Maven](https://maven.apache.org/)
    and [Gradle](https://gradle.org/), support the packaging of the Java applications
    as [Docker](https://www.docker.com/) images. We have also spent some time discussing
    the [multi-stage builds](https://docs.docker.com/engine/userguide/eng-image/multistage-build/)
    and the opportunities they open for implementing portable, zero-dependency (literally!)
    build pipelines.


