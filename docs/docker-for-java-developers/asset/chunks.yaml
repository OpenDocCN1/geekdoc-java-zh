    ## 9. Conclusions


    In this section of the tutorial, we have talked about how [Docker](https://www.docker.com/)
    disrupted and literally revolutionized some of the most complicated testing strategies
    we use in the real projects. As we have seen by familiarizing with different Java
    testing frameworks, the support of [Docker](https://www.docker.com/) is outstanding
    but choosing the right tool for your project could be the challenge, depending
