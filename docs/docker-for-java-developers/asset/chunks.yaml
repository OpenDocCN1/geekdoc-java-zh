  trans: "\n\n很简单，但我们该如何检查镜像是否存在呢？我们首先会想到老伙伴 [docker](https://docs.docker.com/engine/reference/commandline/cli/)\
    \ 命令行工具，但为什么不直接使用 [Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 来完成它呢？\n\n```java\nfinal ImageInfo imageInfo = client.inspectImage(imageId);\n\
    ```\n\n很棒，那么获取所有可用的镜像呢？\n\n```java\nfinal List allImages = client.listImages();\n\
    ```\n\n如果我们需要为镜像添加额外的标签怎么办？\n\n```java\nclient.tag(imageId, \"openjdk\");\n```\n\
    \n也可以获取镜像历史，例如：\n\n```java\nfinal List history = client.history(imageId);\n```\n\
    \n如果不再需要这个镜像，可以很容易地将其删除：\n\n```java\nfinal List removedImages = client.removeImage(imageId,\
    \ true, false);\n```\n\n我们还可以在 [Docker Hub](https://hub.docker.com/) 仓库中搜索镜像。例如，让我们查找所有可用的\
    \ JDK 镜像：\n\n```java\nfinal List jdkImages = client.searchImages(\"jdk\");\n```\n\
    \n为了与仓库进行交互，提供了 pull 和 push 方法。前者从仓库获取镜像，后者将镜像上传到仓库中。\n\n```java\nclient.pull(\"\
    base:openjdk-131-jdk\");\nclient.push(\"base:openjdk-131-jdk\");\n```\n\n为了获取更多关于镜像操作的详细信息，请查看\
    \ [Spotify Docker Client 官方文档](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md#images)。\n\
    \n## 5. 容器\n\n我们将讨论的下一个 [Engine API](https://docs.docker.com/engine/api/) 是 [Containers\
    \ API](https://docs.docker.com/engine/api/v1.30/#tag/Container)，从功能角度来看，它无疑是最丰富的\
    \ API。\n\n为了让用例更真实一些，让我们从 `mysql:8.0.2` 镜像启动一个 [MySQL](https://hub.docker.com/_/mysql/)\
    \ 容器实例，传递一些环境变量并至少暴露一个端口。\n\n```java\nfinal ContainerCreation container = client.createContainer(ContainerConfig\n\
    \    .builder()\n    .image(\"mysql:8.0.2\")\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\"\
    ,\n        \"MYSQL_DATABASE=my_app_db\"\n    )\n    .exposedPorts(\"3306\")\n\
    \    .hostConfig(\n        HostConfig\n        .builder()\n        .portBindings(\n\
    \            ImmutableMap.of(\n                \"3306\",\n                ImmutableList.of(\n\
    \                    PortBinding.of(\"0.0.0.0\", 3306)\n                )\n  \
    \          )\n        )\n        .build()\n    )\n    .build()\n    .build());\n\
    ```\n\n为了成功创建容器，我们本地需要 `mysql:8.0.2`。如果你不确定，在运行之前拉取镜像总是更好的。\n\n```java\nclient.pull(\"\
    mysql:8.0.2\");\n```\n\n此时容器已创建但但尚未启动，所以让我们运行它吧：\n\n```java\nclient.startContainer(container.id());\n\
    ```\n\n容器运行后，还有相当多可以对其的操作。我们可以通过检查容器来获取关于容器的所有详细信息：\n\n```java\nfinal ContainerInfo\
    \ info = client.inspectContainer(container.id());\n```\n\n非常直观，但如果我们需要捕获容器的日志或标准输出怎么办？这可以通过附加到运行中的容器来实现，例如：\n\
    \n```java\nclient.attachContainer(container.id(), AttachParameter.values())\n\
    \    .attach(System.out, System.err, false);\n```\n\n但有一个注意事项，最后一个 `attach` 调用会阻塞调用线程，等待容器的输出。这可能不是我们大多数人所预期的，所以我们最好将调用交载给专用线程。\n\
    \n```java\nexecutor.submit(() -> {\n    client.attachContainer(container.id(),\
    \ AttachParameter.values())\n        .attach(System.out, System.err, false);\n\
    \    return null;\n});\n```\n\n你可以通过暂停/恢复来控制容器内进程的状态，例如：\n\n```java\nclient.pauseContainer(container.id());\n\
    client.unpauseContainer(container.id());\n```\n\n还暴露了相应的 API 用于获取容器的运行时统计数据或获取运行中容器进程的列表。\n\
    \n```java\nfinal ContainerStats stats = client.stats(container.id());\nfinal TopResults\
    \ top = client.topContainer(container.id());\n```\n\n最后，有一个专门的 API 用于获取和尾随容器的日志，与我们上面的\
    \ `attachContainer` 方法非常相似。\n\n```java\nclient.logs(container.id(), LogsParam.stdout(),\
    \ LogsParam.stderr(), LogsParam.tail(10))\n    .attach(System.out, System.err,\
    \ false);\n```\n\n一旦容器不再需要，可以立即停止并终止它。\n\n```java\nclient.stopContainer(container.id(),\
    \ 5 /* 在杀死前等待 5 秒 */);\nclient.removeContainer(container.id());\n```\n\n为了获取更多关于容器操作的详细信息，请查看\
    \ [Spotify Docker Client 官方文档](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md)。\n\
    \n我们已经了如何使用 [Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 配合 [Docker Engine API](https://docs.docker.com/engine/api/) 处理镜像和容器。让我们讨论端口、网络、卷和资源限制等同样重要的主题。\n\
    \n## 6. 端口\n\n每个容器都可以在运行时暴露端口，这可以通过 [Dockerfile](https://docs.docker.com/engine/builder/)\
    \ 指令，也可以通过 `createContainer` 方法的参数实现。[Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ 没有提供获取端口及其映射的专门方法，但这些信息可以从 `ContainerInfo` 中轻松提取，例如：\n\n```java\nfinal ContainerInfo\
    \ info = client.inspectContainer(container.id());\nfinal ImmutableMap<String,\
    \ List> mappings = info.hostConfig().portBindings();\n```\n\n事实上，更可靠的方法是使用 `info.networkSettings().ports()`，因为容器可能没有使用端口映射，只是暴露某些端口。\n\
    \n```java\nfinal ContainerInfo info = client.inspectContainer(container.id());\n\
    final ImmutableMap<String, List> mappings = info.networkSettings().ports();\n\
    ```\n\n## 7. 卷\n\n在[教程的上一节](https://www.javacodeeks.com/2017/09/docker-java-developers-docker-command-line.html)\
    \ 中，我们学习了[卷](https://docs.docker.com/engine/admin/volumes/) 作为容器使用数据的首选机制。[Spotify\
    \ Docker Client](https://github.com/spotify/docker-client) 通过一系列方法完整封装了 [Volumes\
    \ API](https://docs.docker.com/engine/api/v1.30/#tag/Volume)。让我们从创建一个卷开始：\n\n\
    ```java\nfinal Volume volume = client.createVolume();\n```\n\n获取现有卷的元数据：\n\n```java\n\
    final Volume info = client.inspectVolume(volume.name());\n```\n\n此外，你还可以获取所有可用的卷（如果需要进行过滤），例如：\n\
    \n```java\nfinal VolumeList volumes = client.listVolumes();\n```\n\n一旦卷不再需要，可以将其删除。\n\
    \n```java\nclient.removeVolume(volume.name());\n```\n\n"
- fmt: "\nThe importance of the [user-defined networks](https://docs.docker.com/engine/userguide/networking/work-with-networks/#connect-containers)\
    \ in [Docker](https://www.docker.com/) is hard to overestimate as they play a\
    \ critical role in how containers communicate which each other. Not surprisingly,\
    \ the [Networks API](https://docs.docker.com/engine/api/v1.30/#tag/Network) is\
    \ supported mostly in full power by [Spotify Docker Client](https://github.com/spotify/docker-client).\n\
    \nThe creation of a new network is just one method away:\n\n```java\nfinal NetworkCreation\
    \ network = client.createNetwork(\n    NetworkConfig\n        .builder()\n   \
    \     .name(\"test-network\")\n        .driver(\"bridge\")\n        .build()\n\
    );\n```\n\nIf you know the network identifier, you could fetch its metadata:\n\
    \n```java\nfinal Network info = client.inspectNetwork(network.id());\n```\n\n\
    If you do not know the network identifier or just interested in querying (and\
    \ filtering) all networks, you could do that as well:\n\n```java\nfinal List networks\
    \ = client.listNetworks();\n```\n\nOnce the network is not needed anymore, it\
    \ could be easily removed.\n\n```java\nclient.removeNetwork(network.id());\n```\n\
    \n[Spotify Docker Client](https://github.com/spotify/docker-client) provides the\
    \ means to connect to the network or disconnect from the network for any running\
    \ (or just created) container, for example:\n\n```java\nfinal ContainerCreation\
    \ container = client.createContainer(ContainerConfig\n    .builder()\n    .image(\"\
    mysql:8.0.2\")\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\",\n       \
    \ \"MYSQL_DATABASE=my_app_db\"\n    )\n    .exposedPorts(\"3306\")\n    .build()\n\
    );\n\nclient.startContainer(container.id());\nclient.connectToNetwork(container.id(),\
    \ network.id());\n```\n\nOr:\n\n```java\nclient.disconnectFromNetwork(container.id(),\
    \ network.id());\n```\n\nAs of now, [the official Spotify Docker Client documentation](https://github.com/spotify/docker-client/blob/master/docs/user_manual.md)\
    \ does not include a section dedicated to networks manipulation.\n\n## 9. Resource\
    \ Limits\n\nThe [Spotify Docker Client](https://github.com/spotify/docker-client)\
    \ also supports the ability to dynamically adjust the container configuration\
    \ (primary, resource limits like memory, CPU, or block I/O), for example:\n\n\
    ```java\nfinal ContainerUpdate update = client.updateContainer(container.id(),\n\
    \    HostConfig\n        .builder()\n        .memory(268435456L) /* limit to 256Mb\
    \ */\n        .build()\n);\n```\n\n## 10. The Primer\n\nTo finish up this section,\
    \ it would be great to have a realistic example where all the APIs we have looked\
    \ at so far work seamlessly together. As we have been playing mostly with [MySQL](https://hub.docker.com/_/mysql/),\
    \ quite popular choice as a relational data store for Java (and not only) applications,\
    \ the end-to-end demo would be based on it. So what are our goals?\n\n1. Create\
    \ a container instance using `mysql:8.0.2` image\n2. Expose TCP port `3306` and\
    \ bind it to a random host port (so we could run as many containers as we want,\
    \ without having a port conflicts)\n3. Make sure the container is started and\
    \ [MySQL](https://hub.docker.com/_/mysql/) server process is ready to serve our\
    \ queries\n4. Connect to the [MySQL](https://hub.docker.com/_/mysql/) instance\
    \ using [JDBC driver for MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ and list all catalogs (databases)\n\nSounds like a lot of work, but … likely\
    \ we learned about [Spotify Docker Client](https://github.com/spotify/docker-client),\
    \ so let us take one step at a time to make the miracle happen.\n\n```java\nfinal\
    \ DockerClient client = DefaultDockerClient\n    .fromEnv()\n    .build();\n\n\
    // Pull the image first\nclient.pull(\"mysql:8.0.2\");\n\n// Create container\n\
    final ContainerCreation container = client.createContainer(ContainerConfig\n \
    \   .builder()\n    .image(\"mysql:8.0.2\")\n    .env(\n        \"MYSQL_ROOT_PASSWORD=p$ssw0rd\"\
    ,\n        \"MYSQL_DATABASE=my_app_db\"\n    )\n    .exposedPorts(\"3306\")\n\
    \    .healthcheck(\n        Healthcheck\n        .create(\n            // MySQL\
    \ image doesn't have `nc` available\n            Arrays.asList(\"CMD-SHELL\",\
    \ \"ss -ltn src :3306\"),\n            5000000000L, // 5 seconds in nanoseconds\n\
    \            3000000000L  // 3 seconds in nanoseconds\n        )\n    )\n    .hostConfig(\n\
    \        HostConfig\n            .builder()\n            .portBindings(\n    \
    \            ImmutableMap.of(\n                    \"3306\",\n               \
    \     ImmutableList.of(PortBinding.of(\"0.0.0.0\", 0))\n                )\n  \
    \          )\n            .build()\n    )\n    .build()\n);\n```\n"
