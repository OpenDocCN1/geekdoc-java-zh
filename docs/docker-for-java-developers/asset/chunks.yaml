    \ [CRUD](https://en.wikipedia.org/Create,_read,_update_and_delete) 操作：\n\n| 1\
    \ | `GET /tasks` |\n| 2 | `POST /tasks` |\n| 3 | `DELETE /{id}` |\n| 4 | `GET\
    \ /{id}` |\n\n任务本身被建模为持久化实体](https://en.wikipedia.org/Java_Persistence_API)，它将由\
    \ [Hibernate ORM](http://hibernate.org/) 管理并存储在 [MySQL](https://dev.mysql.com/doc/connector-j/8.0/en/)\
    \ 关系数据库中。\n\n```java\n@Entity\n@Table(name = \"tasks\")\npublic class Task {\n\
    \    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name\
