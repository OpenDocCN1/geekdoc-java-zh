    This snippet should be looking familiar except probably the heath check part.
    Why do we need it? Well, it would be great if [Docker](https://www.docker.com/)
    tells us not only when container has started but when the application inside the
    container is fully up and running. This is exactly what the [health checks](https://docs.docker.com/engine/reference/builder/#healthcheck)
    are about. With respect to [MySQL](https://hub.docker.com/_/mysql/), the by the
    book recipe is to verify if there is a process listening on port `3306`, and this
    is precisely what we are doing here with `ss -ltn src :3306 | grep 3306` shell
    command.


    | `01` | `// Start the container` |


    | `02` | `client.startContainer(container.id());` |


    | `03` |   |


    | `04` | `// Inspect the container''s health` |


    | `05` | `ContainerInfo info = client.inspectContainer(container.id());      `
    |


    | `06` | `while` `(info.state().health().status().equalsIgnoreCase(``"starting"``))
    {` |


    | `07` | `// Await for container''s health check to pass or fail` |


    | `08` | `Thread.sleep(``1000``);` |


    | `09` |   |


    | `10` | `// Ask for container status` |


    | `11` | `info = client.inspectContainer(container.id());` |


    | `12` |   |


    | `13` | `// Along with health, better to check the container status as well`
    |


    | `14` | `if` `(info.state().status().equalsIgnoreCase(``"exited"``)) {` |


    | `15` | `LOG.info(``"The container {} has exited unexpectedly ..."``, container.id());`
    |


    | `16` | `break``;` |


    | `17` | `}` |


    | `18` | `}` |


    Nothing complicated in this snippet above as well. We are periodically polling
    the container and checking its health status, the values we may get here are `starting`,
    `healthy`, and `unhealthy`. Please notice that we also consult the container status
    as the health check may not reflect the actual state of the container in some
    circumstances.


    | `1` | `// Check if container is healthy` |


    | `2` | `if` `(info.state().health().status().equalsIgnoreCase(``"healthy"``))
    {` |


    | `3` | `// ...` |


    | `4` | `}` |


    Once the [Docker](https://www.docker.com/) reports to us that the container is
    healthy, we are ready to open a [JDBC](http://www.oracle.com/technetwork/java/overview-141217.html)
    connection to [MySQL](https://hub.docker.com/_/mysql/) instance. But before that,
    we have to figure out which port to use.


