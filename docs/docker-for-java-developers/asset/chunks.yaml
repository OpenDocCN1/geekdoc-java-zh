  trans: "\n\n此外，验证我们的流水线是否配置了正确的仓库以及是否指向了正确的凭据也是很有坏的。\n\n![](img/branch-source-jcg.png)\n\
    \n# Git 分支源\n\n确认一切都已就绪的最佳方法是检查流水线及其所有阶段是否已成功执行。\n\n![](img/build-jcg.png)\n\n\
    # 构建阶段\n\n如果你正在寻找更现代、更精美的 Web UI，[Jenkins](https://jenkins.io/) 通过 [Blue Ocean](https://jenkins.io/doc/book/blueocean/)\
    \ 提供了这种用户体验，该插件专为 [Jenkins Pipeline](https://jenkins.io/doc/book/pipeline/) 从零开始设计。\n\
    \n![](img/blueocean-jcg.png)\n\n# Blue Ocean\n\n我们本可以在此宣布大告成功，但公平起见，安装工具等需求使得自动化过程变得复杂。我们有办法让它更简单吗？是的，当然可以，而这里的关键角色是\
    \ [Docker](https://www.docker.com/)。\n\n## 5. Jenkins 中的 Docker\n\n正如我们已经提到的，[Jenkins](https://jenkins.io/)\
    \ 拥有出色的 [Docker](https://www.docker.com/) 支持，这是通过大量的插件完成的，其中 [Docker plugin](https://plugins.jenkins.io/docker-plugin)\
    \ 和 [Docker Pipeline plugin](https://plugins.jenkins.io/docker-workflow) 是关键插件。这在实践中的意义是，你的流水线（或其他类型的作业）可以启动容器并在其中运行构建（以及任何其他任务或阶段）。\n\
    \n说明这种差异的最好方法是将上一节中的 [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/)\
    \ 修改为使用 [Docker](https://www.docker.com/) 代理（agent），而不是预定义的工具。\n\n``` | |\n01\
    \ | pipeline {\n02 | agent {\n03 | docker {\n04 | image 'gradle:4.3.0-jdk8-alpine'\n\
    05 | }\n06 | }\n07 | \n08 | options {\n09 | disableConcurrentBuilds()\n10 | buildDiscarder(logRotator(numToKeepStr:'5'))\n\
    11 | }\n12 | \n13 | triggers {\n14 | pollSCM('H/15 * * * *')\n15 | }\n16 | \n\
    17 | stages {\n18 | stage('Cleanup before build') {\n19 | steps {\n20 | cleanWs()\n\
    21 | }\n22 | }\n23 | \n24 | stage('Checkout from Github') {\n25 | steps {\n26\
    \ | checkout scm\n27 | }\n28 | }\n29 | \n30 | stage('Build') {\n31 | steps {\n\
    32 | sh 'gradle build'\n33 | }\n34 | }\n35 | }\n36 | \n37 | post {\n38 | always\
    \ {\n39 | archiveArtifacts artifacts:'build/libs/*.jar', fingerprint:true\n40\
    \ | }\n41 | }\n42 | }\n```\n\n这个流水线看起来更紧凑了。我们去掉了很多定义（在实践中也可以去掉一些初始化脚本）。当我们这个新的\
    \ [Jenkinsfile](https://jenkins.io/doc/book/pipeline/jenkinsfile/) 提交到现有的仓库（覆盖当前的）时，我们应该会观察到一组稍微不同的阶段，但构建仍然是绿色的。\n\
    \n![](img/build-docker-jcg.png)\n\n# 使用 Docker 的构建阶段\n\n这只是 [Docker](https://www.docker.com/)\
    \ 与 [Jenkins](https://jenkins.io/) 集成的一个示例，你有许多不同的方法可以利用 [Docker](https://www.docker.com/)\
    \ 将你的持续集成（和交付）过程推向完美。\n\n在结束讨论之前，这里还有一点需要提到。因为我们在 [Docker](https://www.docker.com/)\
    \ 中运行 [Jenkins](https://jenkins.io/)，而 [Jenkins](https://jenkins.io/) 本身在 [Docker](https://www.docker.com/)\
    \ 中执行作业/阶段步骤，这种容器使用模式被称为 `Docker-in-Docker`（或简称 `DinD`）。在运行 `DinD` 环境时，有许多点需要注意，[Jérôme\
    \ Petazzoni 在博客文章中](https://jpetazzo.github.io/2015/09/03/do-not-use-docker-in-docker-for-ci/)\
    \ 对此进行了精辟的总结。如果你认真考虑这种模型，请查看该文章。\n\n## 6. 结论\n\n在教程的最后一部分，我们通过完全自动化的方式部署和配置持续集成平台（基于\
    \ [Jenkins](https://jenkins.io/)），查看了 [Docker](https://www.docker.com/) 的一个非常实用的应用。我们为[之前开发的](https://www.javacodegeeks.com/2017/11/docker-java-developers-build-docker.html)\
    \ 应用程序之一创建了构建流水线，并演示了在运行的 [Docker](https://www.docker.com/) 容器内部运行 [Docker](https://www.docker.com/)\
    \ 的用例。\n\n到此，我们的教程结束了。这是一段长期但可能很有用的旅程，我们学了一些实用有效的知识。整个系列的结论可以总结为：[Docker](https://www.docker.com/)\
    \ 是一项了的技术，能够引领我们走向新的境界。\n\n下载完整的脚本和项目源码：\n\n* 带有 Jenkinsfile 的 Spring Boot Web\
    \ 应用\n* 带有 Docker 代理的 Jenkinsfile\n* Jenkins Docker 镜像和脚本\n\n"
