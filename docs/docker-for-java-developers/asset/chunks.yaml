    ## 4. So What About Debugging?


    Debugging was, is and very likely will be playing the crucial role in finding,
    understanding and resolving defects or problems in our programs. And, like it
    or not, no matter how awesome [Docker](https://www.docker.com/) is, it won’t make
    our applications free from bugs. If you are running Java applications as [Docker](https://www.docker.com/)
    containers, the debugging process changes a little bit and is explained in great
    details.


    ## 5. Management and Monitoring


    Although [Docker](https://www.docker.com/) command line tools and, consequently,
    [Docker Engine API](https://docs.docker.com/engine/api/)s, let you accomplish
    any task, many of us still prefer to deal with some kind of UIs.


    ### 5.1. Portainer


    The first tool we a going to look at is [Portainer](https://portainer.io/), an
    open-source lightweight management UI which allows easily manage different [Docker](https://www.docker.com/)
    environments (like [Docker Swarm](https://docs.docker.com/engine/swarm/) clusters).
    It comes as no surprise that [Portainer](https://portainer.io/) itself runs as
    a lightweight [Docker](https://www.docker.com/) container. Let us run one:


    ```

    docker run -d -p 9000:9000 -v /var/run/docker.sock:/var/run/docker.sock portainer/portainer

    ```


    On Windows machine, the command looks a little different:


    ```

    docker run -d -p 9000:9000 portainer/portainer

    ```


    Once the [Portainer](https://portainer.io/) container is up and running, you will
    be able to access it through pretty neat web UI available at [http://localhost:9000](http://localhost:9000)
    (or, in case you are using non-native [Docker](https://www.docker.com/) installation,
    `http://<docker-machine>:9000`).


    ![Portainer Dashboard](images/portainer-jcg-1024x413.png)


