    \ multiple containers.\n\n![ctop](images/ctop-jcg-1024x214.png)\n\n### ctop\n\n\
    Not only [ctop](https://ctop.sh) has a summary view, it also supports the option\
    \ to select and focus on any individual container as well.\n\n### 5.4. And a lot\
    \ more …\n\nThe [Docker](https://www.docker.com/) tooling space is really thriving,\
    \ with new interesting projects popping up literally every day. We have just covered\
    \ a couple of well-known, mature and useful tools but there are a lot more to\
    \ discover, so please watch this space closely if you are interested.\n\n## 6.\
    \ Docker Engine Metrics\n\n[Docker](https://www.docker.com/) engine exposes a\
    \ lot of interesting metrics in the format which is fully compatible with [Prometheus](https://prometheus.io/),\
    \ tremendously popular open-source monitoring and alerting solution. Although\
