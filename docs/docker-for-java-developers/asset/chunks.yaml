    | `1` | `docker container` `rm` `[OPTIONS] CONTAINER [CONTAINER...]` |


    More extreme version of [rm](https://docs.docker.com/engine/reference/commandline/container_rm/)
    command, the [prune](https://docs.docker.com/engine/reference/commandline/container_prune/)
    command, mass-removes all stopped containers.


    | `1` | `docker container prune [OPTIONS]` |


    ## 4\. Ports


    Every container could expose ports to listen at runtime, either through image
    [Dockerfile](https://docs.docker.com/engine/reference/builder/) instructions or
    through the options of the [run](https://docs.docker.com/engine/reference/commandline/container_run/)
    command. The [port](https://docs.docker.com/engine/reference/commandline/container_port/)
    command lists all port mappings (or a specific mapping) for the container.


    | `1` | `docker container port CONTAINER [PRIVATE_PORT[/PROTO]]` |


    ## 5\. Volumes


    As we remember, containers are ephemeral and once the container is terminated,
    all the data it holds will be lost. It might not be a problem in many cases, but
    if you run the data store in a container for example, it is very likely you would
    prefer to keep your data.


    To fill this gap [Docker](https://www.docker.com/) introduces [volumes](https://docs.docker.com/engine/admin/volumes/volumes/)
    as the preferred mechanism for persisting data used by containers and, obviously,
    [docker](https://docs.docker.com/engine/reference/commandline/cli/) has a dedicated
    class of commands for that ([create](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [inspect](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [ls](https://docs.docker.com/engine/reference/commandline/volume_ls/), [prune](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    and [rm](https://docs.docker.com/engine/reference/commandline/volume_rm/)).


    | `1` | `docker volume create [OPTIONS] [VOLUME]` |


    | `2` | `docker volume inspect [OPTIONS] VOLUME [VOLUME...]` |


    | `3` | `docker volume` `ls` `[OPTIONS]` |


    | `4` | `docker volume prune [OPTIONS]` |


    | `5` | `docker volume` `rm` `[OPTIONS] VOLUME [VOLUME...]` |


    ## 6\. Networks


    [Docker](https://www.docker.com/) has pretty good [networking support](Docker%20container%20networking)
    for containers with a number of network drivers available out of the box. Surely,
    the standard set of [create](https://docs.docker.com/engine/reference/commandline/volume_create/),
    [inspect](https://docs.docker.com/engine/reference/commandline/volume_inspect/),
    [ls](https://docs.docker.com/engine/reference/commandline/volume_ls/), [prune](https://docs.docker.com/engine/reference/commandline/volume_prune/)
    and [rm](https://docs.docker.com/engine/reference/commandline/volume_rm/) commands
    is available to manage the networks.


    | `1` | `docker network create [OPTIONS] NETWORK` |


    | `2` | `docker network inspect [OPTIONS] NETWORK [NETWORK...]` |


    | `3` | `docker network` `ls` `[OPTIONS]` |


    | `4` | `docker network prune [OPTIONS]` |


    | `5` | `docker network` `rm` `NETWORK [NETWORK...]` |


    What distinguishes [Docker](https://www.docker.com/) networking is the fact the
    [dockerd](https://docs.docker.com/engine/reference/commandline/dockerd/) daemon
    contains an embedded DNS server which provides names resolution among containers
    connected to the same user-define network (so that the containers could be referenced
    by their names, not only IP addresses).'
