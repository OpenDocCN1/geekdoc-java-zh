    ## 14.5 总结


    * `String` 是 `java.lang` 包中的内置类

    * 它表示字符序列

    * 可以通过将双引号内的字符赋值给 `String` 变量或使用任何 `String` 构造函数来创建

    * `String` 类有许多方法允许执行各种操作，如查找 String 的长度、检查两个 Strings 是否相等、从 String 中获取子字符串等。


    ## 15 Collection API

    Collection API 由一组类和接口组成，允许你将对象组作为单个单元存储在一起。集合类和接口存在于 `java.util` 包中。集合中的对象被称为元素（elements）。下表列出了
    Collection 框架中的主要类/接口。


    | 接口/类 | 描述 |

    | :--- | :--- |

    | `java.util.Collection` | 这是集合层次结构中的顶层接口。 |

    | `java.util.List` | `java.util.Collection` 的子接口。存储一组对象。是有序的且允许重复。 |

    | `java.util.Set` | `java.util.Collection` 的子接口。存储一组对象。无序且不允许重复。 |

    | `java.util.Map` | 集合层次中的另一个顶层接口。用于存储键值对。 |

    | `java.util.ArrayList` | 实现 `List` 接口的类。内部使用数组存储数据。它是 `List` 最常见的实现。 |

    | `java.util.HashSet` | 实现 `Set` 接口的类。它是 `Set` 最常见的实现。 |

    | `java.util.HashMap` | 实现 `Map` 接口的类。它是 `Set` 最常见的实现。 |


