    ## 17.2.4 Using Different Lambda Expressions

    The real power of lambda expressions is that it allows using different implementations
    for the same method on the fly[](image_rsrc3RN.jpg)


    * Lines 3-22 define a `CalculatorDemo2` class

    * Line 7 implements the `Calculator` interface via a lambda expression that returns
    the sum of the input numbers and assigns this lambda expression to `cal1`

    * Line 12 invokes the `calculate` method via `cal1`

    * Line 15 implements the `Calculator` interface via a lambda expression that returns
    the difference of the input numbers and assigns this lambda expression to `cal2`

