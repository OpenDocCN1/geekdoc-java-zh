    15.2.8 从 List 中删除元素

    `List` 接口提供了一个 `remove` 方法，用于从 `List` 中删除元素。该方法有两个重载版本，允许通过实际元素或其在 `List` 中的位置进行删除![](img/image_rsrc3P2.jpg)


    * 第 9 行创建一个名为 `myProducts` 的 `List`，存储 `Product` 对象

