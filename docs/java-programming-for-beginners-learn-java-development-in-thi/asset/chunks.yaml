    ## 15.3.6 总结

    与 `List` 一样，`Set` 也是 `Collection` 接口的子接口，用于存储一组对象。然而，与 `list` 不同，`set` 中的元素是没有序的，且
    `Set` 不允许重复元素。此外，由于 `Set` 是无序的，它不允许像 `list` 那样进行位置访问。


    与 `List` 接口一样，`Set` 接口有一个名为 `add` 的方法可以向 `Set` 中添加值。它还有一个 `size` 方法，用于返回 `Set`
    中的元素数量。它还有一个名为 `remove` 的方法，可以从 `Set` 中移除元素。


    像 `List` 一样，`Set` 可以存储任何类型的数据，但必须指定它所存储的类型。


    有多个实现 `Set` 接口的类，例如 `HashSet`、`TreeSet` 等。这些类中的任何一个都可以用于创建 `Set`。


    # 15.4 Map（映射）

    `Map` 是 `Collection` 接口的子接口，用于存储键值对（key-value pairs）。与 `List` 不同，`Map` 中的键是没有序的，且
    `Map` 不允许重复的键。此外，由于 `Map` 是无序的，它不允许像 `list` 那样通过索引进行访问。


    ## 15.4.1 Map 的创建

    有多个实现 `Map` 接口的类，例如 `HashMap`、`TreeMap` 等。这些类中的任何一个都可以用于创建 `Map`。


    * 第 13 行创建一个使用 `HashMap` 实现的 `Map` `map1`

