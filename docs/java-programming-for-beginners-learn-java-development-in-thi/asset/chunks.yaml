    # 15.1 集合 (Collection)

    `java.util.Collection` 是集合层次结构中的顶层接口。它有许多子接口，提供了特定的行为。某些集合允许重复元素，有些是有序的，有些只允许检索集合的第一个元素等。`Collection`
    接口没有直接的实现。


    # 15.2 列表 (List)

    `List` 是 `Collection` 接口的子接口，用于存储一组对象。`List` 代表一个有序且允许重复的集合。


    ## 15.2.1 List 的创建

    有若干个类实现了 `List` 接口，如 `ArrayList`、`LinkedList` 等。可以使用这些类中的任何一个来创建一个 `List`。![](img/image_rsrc3NP.jpg)


    * 第 11 行创建了一个使用 `ArrayList` 实现的 `List` `list1`

    * `list1` 是一个存储 `String` 类型数据的 `List`

    * `List` 可以存储任何类型的数据，但它存储的类型必须在尖括号（`<>`）中指定。这种 Java 特性被称为泛型（generics）

    * 第 11 行使用了不接受任何参数的 `ArrayList` 构造函数

    * `ArrayList` 有许多其他构造函数，允许以不同的方式创建 `ArrayList`

    * 第 13 行使用 `LinkedList` 实现创建了另一个 `List` `list2`

    * `list2` 是一个存储 `Product` 类型数据的 `List`

    * 第 13 行使用了默认的 `LinkedList` 构造函数，但 `LinkedList` 也有许多其他构造函数，允许以不同的方式创建 `LinkedList`


    ### 底层发生了什么？

    * 当执行第 11 行时，它创建了一个使用 `ArrayList` 实现的 `List` `list1` 并存储 `String` 类型的数据

    * 当执行第 13 行时，它创建了一个使用 `LinkedList` 实现的 `List` `list2` 并存储 `Product` 类型的数据


    ## 15.2.2 向 List 中添加值

    `List` 接口有一个名为 `add` 的方法，可以向 `List` 中添加值![](img/image_rsrc3NR.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `List`，用于存储 `Product` 对象

    * 第 12-14 行创建了 3 个 `Product` 对象

    * 第 16-18 行为 `product1`、`product2` 和 `product3` 调用了 `add` 方法


    ### 底层发生了什么？

    * 当执行第 16-18 行时，对象 `product1`、`product2` 和 `product3` 被添加到 `List` 中


    ## 15.2.3 获取 List 的大小

    `List` 接口提供了一个 `size` 方法，可用于获取 `List` 中的元素数量![](img/image_rsrc3NS.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `List`，存储 `Product` 对象

    * 第 12-18 行创建了 3 个 `Product` 对象并将它们添加到 `myProducts` `List` 中

    * 第 19 行在 `myProducts` 列表上调用了 `size` 方法


    此代码打印以下输出：![](img/image_rsrc3NT.jpg)


    ### 底层发生了什么？

    * 当执行第 19 行时，它返回 `List` 中的元素数量

    * 由于初始向 `List` 添加了 3 个值，该值被赋值给变量 `size`


    ## 15.2.4 位置访问

    `List` 允许位置访问，即你通过指定指定位置来检索元素。这是因为 `List` 是有序的并保持了插入顺序。`List` 接口提供了一个 `get` 方法用于位置访问![](img/image_rsrc3NU.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `List`，存储 `Product` 对象

    * 第 12-18 行创建了 3 个 `Product` 对象并将它们添加到 `myProducts` `List` 中

    * 第 20 行使用值 1 调用了 `get` 方法


    此代码打印以下输出：![](img/image_rsrc3NV.jpg)


    ### 底层发生了什么？

    * 当执行第 20 行时，`get` 方法返回位置 1 处的对象

    * `List` 索引从位置 0 开始，因此 1 对应于 `List` 中的第 2 个元素，即 `product2`（冰箱）


    ## 15.2.5 遍历 List

    任何 Java 循环（`while`、`do-while`、`for`、`for-each`）都可以用于遍历 `List`![](img/image_rsrc3NW.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `List`，存储 `Product` 对象

    * 第 12-18 行创建了 3 个 `Product` 对象并将它们添加到 `myProducts` `List` 中

    * 第 22-26 行使用 `for` 循环遍历 `myProducts` `List`

    * 第 28-34 行使用 `while` 循环遍历 `myProducts` `List`


    此代码打印以下输出：![](img/image_rsrc3NX.jpg)


    ### 底层发生了什么？

    * 当执行第 22-26 行时，`for` 循环从 `List` 中检索每个元素并打印其细节

    * 当执行第 28-34 行时，`while` 循环从 `List` 中检索每个元素


    15.2.6 插入顺序

    `List` 是有序的并保持插入顺序，因此第一个元素位于位置 0![](img/image_rsrc3NY.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的 `List`，存储 `Product` 对象

    * 第 12-18 行创建了 3 个 `Product` 对象并将它们添加到 `myProducts` `List` 中

    * 第 20-22 行使用 `for-each` 循环遍历 `myProducts`


    此代码打印以下输出![](img/image_rsrc3NZ.jpg)


    ### 底层发生了什么？

    * 当执行第 16 行时，电视位于位置 0

    * 同样，微波炉位于位置 1


    15.2.7 重复 List

    `List` 允许重复，因此可以多次添加同一个对象![](img/image_rsrc3P0.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的 `List`，存储 `Product` 对象

    * 第 12-13 行创建了 2 个 `Product` 对象

    * 第 15-16 行将 `product1` 和 `product2` 添加到 `List`

    * 第 17 行再次将 `product1` 添加到 `List`

