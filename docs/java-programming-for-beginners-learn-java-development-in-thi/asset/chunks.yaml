    * 第 15 行创建了一个值为 `java` 的 `String` `str3`

    * 第 17 行使用 `equals` 方法检查 `str1` 和 `str3` 是否相同

    * 第 20 行使用 `equalsIgnoreCase` 方法检查 `str1` 和 `str3` 是否相同


