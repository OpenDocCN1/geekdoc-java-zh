    # 15.3 Set（集合）

    与 `List`一样，`Set` 也是 `Collection` 接口的子接口，用于存储一组对象。然而，与 `list` 不同，`set` 中的元素是没有序的，且
    `Set` 不允许重复元素。此外，由于 `Set` 是无序的，它不允许像 `list` 那样进行位置访问。


    ## 15.3.1 Set 的创建

    有多个实现 `Set` 接口的类，例如 `HashSet`、`TreeSet` 等。这些类中的任何一个都可以用于创建 `Set`。![](img/image_rsrc3P4.jpg)


    * 第 13 行创建一个使用 `HashSet` 实现的 `Set` `set1`

    * `set1` 是一个 `Set`，用于存储 `Integer` 类型的数据（`Integer` 是对应 `int` 数据类型的内置类）

    * 像 `List` 一样，`Set` 可以存储任何类型的数据，但必须指定它所存储的类型

    * 第 11 行使用了不接受任何参数的 `HashSet` 构造函数

    * `HashSet` 还有许多其他构造函数，允许以不同的方式创建 `HashSet`

    * 第 15 行使用 `TreeSet` 实现创建另一个 `Set` `set2`

    * `set2` 是一个存储 `Product` 类型数据的 `Set`

    * 第 13 行使用了默认的 `TreeSet` 构造函数，但 `TreeSet` 也有许多其他构造函数，允许以不同的方式创建 `TreeSet`


