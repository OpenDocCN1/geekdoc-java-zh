    \n## 1 Getting Started\n\n### 1.1 Java History\nJava was created by James Gosling\
    \ and his team at Sun Microsystems in the early 90s. The first version of Java\
    \ was 1.0. Oracle acquired Sun Microsystems in 2010. At the time of writing this,\
    \ the latest release of Java is Java 14\n\n### 1.2 Why Java\nJava is Object oriented.\
    \ Earlier programming languages like C were procedural. The downside of a procedural\
    \ language is that programs become large and complex. To manage this complexity,\
    \ Object oriented programming was conceived. Object oriented programming organises\
    \ a program around its data and thus simplifies programming. Java is platform\
    \ independent. Other programming languages like C or C++ are compiled into files\
    \ that are operating system specific. Java on the other hand is compiled into\
    \ bytecode which is run within the Java Virtual Machine or the `JVM`. The `JVM`\
    \ sits on top of the operating system. So, the same compiled file can be run on\
    \ different operating systems.\n\n### 1.3 Software Installation\n\n#### 1.3.1\
    \ JDK Installation\nJDK stands for Java Development Kit. It is required to write\
    \ and run Java programs. In order to install it, you need to follow the following\
    \ steps:\n1) Visit `https://www.oracle.com/java/technologies/javase/javase-jdk8-downloads.html`\n\
    2) Download the JDK as per your operating system\n3) Double click the downloaded\
    \ file and follow the on-screen instructions\n\n#### 1.3.2 Eclipse Installation\n\
    Eclipse is an Integrated Development Environment or IDE. It is a software that\
    \ helps you to write and run Java code easily. In order to install Eclipse, you\
    \ need to follow the following steps:\n1) Visit the Eclipse download site: `https://www.eclipse.org/downloads/`\n\
    2) Download the latest version listed there as per your operating system\n3) Double\
    \ click the downloaded file and follow the on-screen instructions\n\n### 1.4 First\
    \ Java Program\nBefore you start writing code, you need to do a few basic things:\n\
    \n#### 1.4.1 Create Java Project in Eclipse\nA project groups together all the\
    \ files related to a Java application. In order to create a project, you need\
    \ to do the following:\n"
