    ## 15.3.4 插入顺序

    `Set` 是无序的。它不维护插入顺序，因此第一个插入元素可能不在 `Set` 的第一个位置。![](img/image_rsrc3P7.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `Set`，存储 `Product` 对象

    * 第 12-18 行创建了 3 个 `Product` 对象并将它们添加到 `myProducts` `Set` 中

