    \ 行\n* 一旦 `if` 块完成，就会执行第 13 行。\n* 即使第 9 行的条件为假，第 13 行仍然执行。\n\n###### 5.1.1.2 If\
    \ else\n`if else` 块在 `if` 语句之后有一个 `else` 语句。如果 `if` 语句中的条件为假，则执行 `else` 块。\n代码示例\
    \ 1![](img/image_rsrc3J1.jpg)\n\n* 第 7 行声明了一个值为 80 的变量 `num1`\n* 第 9-15 行是 `if-else`\
    \ 块\n* 第 9 行由 `if` 语句和条件 `num1 < 100` 组成\n* 只有当条件 `num1 < 100` 为真时，才会执行第 10 行的代码\n\
    * 第 13 行指定了一个 `else` 语句\n* 只有当条件 `num1 < 100` 为假时，才会执行第 14 行的代码\n\n因此，这段代码输出了以下输出：![](img/image_rsrc3J2.jpg)\n\
    \n### 幕后发生了什么？\n* 当执行第 9 行时，检查 `num1` 是否小于 100\n* 因为 `num1` 的值为 80，该条件为真，执行 `if`\
    \ 块内部的代码\n* 跳过 `else` 块\n\n代码示例 2![](img/image_rsrc3J3.jpg)\n\n* 在此示例中，变量 `num1`\
    \ 在第 7 行被赋值为 125\n* 因为 `num1 < 100` 现在为假，未进入 `if` 块。\n* 反之，控制转移到第 13 行并执行该处的代码。\n\
    \n因此，这段代码输出了以下输出：![](img/image_rsrc3J2.jpg)\n\n### 幕后发生了什么？\n* 执行  `  ，\n* 检查\
    \ `num1` 数组  100\n* 因为 `num1` 的值为 80，该条件为真，执行 `if` 块内的代码\n* 跳过 `else` 块\n\n###\
    \ 5.1.2 判定语句\n  语句\n                                           5             \
