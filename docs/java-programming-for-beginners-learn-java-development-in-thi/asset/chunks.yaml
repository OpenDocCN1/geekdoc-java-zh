    # 15.3 Set

    Just like `List`, `Set` is also a sub interface of the `Collection` interface
    and is used to store a group of objects. However, unlike a `list`, the elements
    in a `set` are not ordered and a `Set` does not allow duplicates. Also, since
    a `Set` is not ordered, it does not allow positional access like a list does.


    ## 15.3.1 Set Creation

    There are several classes that implement the `Set` interface like `HashSet`, `TreeSet`,
    etc. Any of these classes can be used to create a `Set`.![](image_rsrc3P4.jpg)


