    * When Line 22-26 are executed, the `for` loop retrieves each element from the
    `List` and prints its details

    * When Line 28-34 are executed, the `while` loop retrieves each element from the
    `List`


    ## 15.2.6 Insertion order

    A `List` is ordered and maintains the order of insertion so the element first
    is at position 0![](image_rsrc3NY.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-18 create 3 `Product` objects and add them to the `myProducts` `List`

    * Lines 20-22 use a `for-each` loop to iterate over the `myProducts` `List`


    This code prints the following output:![](image_rsrc3NZ.jpg)


    ### What Happens Behind the Scenes?

    * When Line 16 is executed, `Television` is at position 0

    * Similarly, `Refrigerator` is at position 1 and Microwave Oven is at position
    2


    ## 15.2.7 List with Duplicates

    A `List` allows duplicates, so the same object can be added more than once![](image_rsrc3P0.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-13 create 2 `Product` objects

    * Lines 15-16 add `product1` and `product2` to the `List`

    * Line 17 adds `product1` again to the `List`

    * Lines 19-21 uses a `for-each` loop to iterate over the `myProducts` `List`


    This code prints the following output:![](image_rsrc3P1.jpg)


    ### What Happens Behind the Scenes?

    * When Line 15 is executed, `product1` is added to the `List` at position 0

    * Since a `List` allows duplicates, when Line 17 is executed, `product1` is added
    to the `List` at position 2


    ## 15.2.8 Removing an element from a List

    There is a `remove` method available on the `List` interface which can be used
    to remove an element on the `List`. There are 2 overloaded versions of this method,
    which allow removing an element either by the actual element or its position in
    the `List`.![](image_rsrc3P2.jpg)


    * Line 9 creates a `List` called `myProducts` that stores `Product` objects

    * Lines 11-17 create 3 `Product` objects and add them to the `myProducts` `List`

    * Line 20 invokes the `remove` method with the value 0. This indicates that the
    element at position 0 should be removed

    * Line 24 invokes the `remove` method with `product3`. This specifies that `product3`
    should be removed from the `List`


    This code prints the following output:![](image_rsrc3P3.jpg)


    ### What Happens Behind the Scenes?

    * When Lines 15-17 are executed, 3 elements are added to the `List`

    * When Line 20 is executed, the element at position 0 is removed from the `List`.
    This reduces the size of the `List` to 2

    * When Line 24 is executed, `product3` is removed from the `List`. This reduces
    the size of the `List` to 1


    ## 15.2.9 Summary

    * A `List` is a sub-interface of the `Collection` interface and is used to store
    a `List` of objects

    * There are several classes that implement the `List` interface like `ArrayList`,
    `LinkedList`, `Vector`, etc out of which `ArrayList` is the most commonly used
    implementation

    * A `List` is ordered and maintains the order of insertion

    * `List` index starts at 0, so the 1st element is at position 0, 2nd at position
    1 and so on.

    * A `List` allows duplicates, so the same element can be added more than once

    * In addition to the methods listed above, a `List` has many other methods like
    `clear` (empties the list), `indexOf` (returns position of the specified element),
    `contains` (returns boolean if the specified element is present in the `List`),
    etc.

