    \ the iteration part of the loop executes and `i` is incremented to `1`\n*   The\
    \ condition `i<3` is checked again and this continues till the condition becomes\
    \ false.\n\n## 5.2.4 For-each\n\nThe `for-each` loop is used to iterate through\
    \ an array or a collection. (Collections will be covered in detail further on)\n\
    \nSyntax![](image_rsrc3JK.jpg)\nCode Sample![](image_rsrc3JM.jpg)\n\n*   Line\
    \ 7 declares an array of integer values called `oddNumbers`\n*   Lines 9-11 is\
    \ the `for-each` loop\n*   Line 9 consists of the keyword `for` followed by a\
    \ variable `num` to refer to each value in the `oddNumbers` array\n*   The body\
    \ of the loop is executed as long as there are values in the array\n\nThis code\
    \ prints the following output:![](image_rsrc3JN.jpg)\n\n### What Happens Behind\
