    15.2.9 总结

    * `List` 是 `Collection` 接口的子接口，用于存储对象的 `List`。

    * 有若干个类实现了 `List` 接口，如 `ArrayList`、`LinkedList`、`Vector` 等，其中 `ArrayList` 是最常用的实现。

    * `List` 是有序的并保持插入顺序。

    * `List` 索引从 0 开始，因此第一个元素位于位置 0，第二个位于位置 1，依此类推。

    * `List` 允许重复，因此可以多次添加同一个元素。

