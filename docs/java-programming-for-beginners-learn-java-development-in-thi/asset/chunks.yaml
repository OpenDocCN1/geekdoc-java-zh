    \ continue jump statements\n\n6        Classes ExplainedAs seen from the beginning,\
    \ a class is very fundamental in a Java application. All Java code needs to be\
    \ present in a class.6.1     ClassesA class defines a new data type that can be\
    \ used to create objects of that type.6.1.1 Defining a classA class can be created\
    \ by using the class keyword followed by the name to be given to the class.![](image_rsrc3JU.jpg)\n\
    \n*   Lines 3-9 specify a class called Product\n\n*   public is a keyword; it\
    \ will be covered further on.\n\n*   The class keyword is followed by Product\
    \ which is the name given to the class\n\n6.1.2 Creating an objectA class can\
    \ be used to create objects .![](image_rsrc3JV.jpg)\n\n*   Lines 3-11 specify\
    \ a class called ProductDemo\n\n*   Lines 5-9 specify the main method\n\n*   Line\
    \ 7 creates a new Product object called product1\n\n    *   Product is the class\n\
    \n    *   product1 is an actual object of the class\n\n    *   The new keyword\
    \ allocates memory for the object product1\n\n6.1.3 Summary\n\n*   A class defines\
    \ a template for creating objects\n\n*   It has no memory allocated to it\n\n\
    *   Classes can be used to create multiple objects\n\n*   Objects have memory\
    \ allocated to them\n\n6.2     Instance FieldsInstance fields refer to variables\
    \ within a class which correspond to the data related to the class.6.2.1 Defining\
    \ Instance FieldsAn instance field can be defined by specifying its data type\
    \ followed by its name![](image_rsrc3JW.jpg)\n\n*   Line 5 declares a String variable\
    \ name . String is an in-built class representing a sequence of characters, it\
    \ will be covered further on.\n\n*   Line 6 declares a double variable price\n\
    \n*   So, name and price are the instance fields of the Product class\n\n6.2.2\
    \ Accessing Instance FieldsThe fields in a class can be accessed via the dot operator\
    \ (.)![](image_rsrc3JX.jpg)\n\n*   Lines 3-24 define a new class called ProductDemo\n\
    \n*   Line 7 creates a new Product product1\n\n*   Line 8 assigns the value “Television\
    \ ” to the name field of product1\n\n*   Line 9 assigns the value “400.50 ” to\
    \ the price field of product1\n\n*   Line 15 creates a Product product2\n\n* \
    \  Lines 17-18 assign some values to the fields of product2\n\nThis code prints\
    \ the following output:![](image_rsrc3JY.jpg)What Happens Behind the Scenes?\n\
    \n*   The dot operator (.) links the Product object with instance fields name\
    \ and price .\n\n*   So, when Lines 8-9 are executed, the specified values are\
    \ assigned to the instance fields of product1\n\n*   Similarly, when Lines 17-18\
    \ are executed, the specified values are assigned to the instance fields of product2\n\
    \n6.2.3 Summary\n\n*   Instance fields store the data related to an object\n\n\
    *   Each object has its own copy of each instance variable defined by the class.\n\
    \n*   Instance fields are accessible via the object name followed by the dot operator\n\
    \n6.3     MethodsA Method refers to code within a class that operates on the instance\
    \ fields.6.3.1 Defining a MethodA method is defined by specifying a method name\
    \ followed by the code that you want to go into the body of the method.![](image_rsrc3JZ.jpg)\n\
    \n*   Lines 8-12 define a method called showPriceWith10PercentDiscount\n\n*  \
    \ Line 8 is known as the method declaration\n\n    *   void is a keyword that\
    \ specifies that this method does not return any value. Return types will be covered\
    \ further on\n\n    *   showPriceWith10PercentDiscount is the name given to the\
    \ method.\n\n    *   The empty parentheses after the method name indicate that\
    \ the method does not accept any parameters. Parameters will be covered further\
    \ on\n\n*   Everything within the curly brackets (Lines 9-11) is the body of the\
    \ method"
