    * 执行第 20 行时，`size` 方法返回 `Set` 中的元素数量，为 3

    * 执行第 24 行时，`product3` 从 `Set` 中移除。这使得 `Set` 的大小减为 2


    ## 15.3.3 遍历 Set

    由于 `Set` 不像 `List` 那样支持位置访问，因此可以使用 `for-each` 循环来遍历 `Set`。![](img/image_rsrc3P7.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `Set`，存储 `Product` 对象

