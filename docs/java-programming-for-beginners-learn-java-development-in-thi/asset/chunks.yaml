    * 如果 lambda 表达式接受多个参数，则需要在括号中指定这些参数并用逗号隔开

    * 参数的数据类型不需要指定，系统会自动进行推断

    * 如果 lambda 表达式的体只包含一条语句，则可以省略大括号

    * 当 lambda 表达式有返回值时，如果其体只包含一条语句，则可以省略 `return` 关键字


    ## 17.2.2 使用 Lambda 表达式实现函数式接口

    Lambda 表达式提供了一种实现函数式方法的简洁方式![](img/image_rsrc3RD.jpg)


    * 第 3-8 行定义了一个名为 `Rectangle` 的类

    * 第 7 行使用 lambda 表达式实现了函数式接口 `Printer`

    * 空参数表示 lambda 表达式不接受任何参数（因为 `Printer` 中的 `print` 方法不接受参数）

    * lambda 表达式的体包含一个简单的 `Sysout` 语句

    * lambda 表达式被赋值给类型为 `Printer` 的对象，表示它实现了 `Printer` 中的抽象方法 `print`

    * 第 9 行调用了 `printer.print` 方法


    这段代码打印出以下输出：[](image_rsrc3RE.jpg) 背后发生了什么？


    * 当执行第 7 行时，它将指定的 lambda 表达式赋值给名为 `printer` 的 `Printer` 对象。这意味着第 7 行的 lambda 表达式将用于实现
    `Printer` 中的 `print` 方法

    * 当执行第 9 行时，调用了 `print`。它使用了第 7 行指定的 lambda 表达式

    * 因此，使用 lambda 表达式调用函数式接口可以消除模板代码，使代码简洁整洁


    ## 17.2.3 Lambda 表达式示例

    Lambda 表达式可以是不同类型。它们可以接受零、一个或多个参数。它们可能返回值，也可能不返回值。


    ### 17.2.3.1 单参数，无返回值

    本节查看一个接受一个整数参数且没有返回值的函数式接口[](image_rsrc3RF.jpg)


    * 第 3-8 行定义了一个名为 `Operation` 的函数式接口

    * 第 6 行指定了一个名为 `operate` 的抽象方法

    * `operate` 接受一个整数参数且不返回任何值


    以下代码演示了如何实现 `Operation` 接口[](image_rsrc3RG.jpg)


    * 第 3-12 行定义了 `OperationsDemo` 类

    * 第 7 行通过 lambda 表达式实现了 `Operation` 接口

    * lambda 表达式的体包含一条语句，它接受一个参数 `num` 并打印其平方

    * 因为只有一条语句，所以省略了大括号

    * 第 9 行将 `operate` 方法赋值给 `op1`（注：此处原文应为调用，此处按翻译）


    * 当执行第 7 行时，它将指定的 lambda 表达式赋值给 `op1` 背后发生了什么？


    ### 17.2.3.2 多参数，有返回值

    本节查看一个接受两个参数并返回值的函数式接口[](image_rsrc3RJ.jpg)


    * 第 3-8 行定义了一个名为 `Calculator` 的函数式接口

    * 第 6 行指定了一个名为 `calculate` 的抽象方法

    * `calculate` 接受两个参数并返回一个整数


    以下代码演示了如何实现 `Calculator` 接口[](image_rsrc3RK.jpg)


    * 第 3-17 行定义了 `CalculatorDemo` 类

    * 第 7 行通过 lambda 表达式实现了 `Calculator` 接口

    * lambda 表达式接受两个整数参数 `num1` 和 `num2` 并返回它们的和

    * lambda 表达式中没有显式指定 `return` 关键字

    * 第 12 行通过 `cal` 调用了 `calculate` 方法


    这段代码打印出以下输出：[](image_rsrc3RM.jpg) 背后发生了什么？


    * 当执行第 7 行时，它将指定的 lambda 表达式赋值给 `cal`

    * 当执行第 9 行时，使用赋值给 `cal` 的 lambda 表达式执行 `calculate` 方法


    #### 使用不同的 Lambda 表达式

    Lambda 表达式的真正威力在于它可以为同一个方法动态提供不同的实现[](image_rsrc3RN.jpg)


    * 第 3-22 行定义了 `CalculatorDemo2` 类

    * 第 7 行通过 lambda 表达式实现了 `Calculator` 接口，返回输入数字的和，并将该 lambda 表达式赋值给 `cal1`

    * 第 12 行通过 `cal1` 调用了 `calculate` 方法

    * 第 15 行通过 lambda 表达式实现了 `Calculator` 接口，返回输入数字的差，并将该 lambda 表达式赋值给 `cal2`

    * 第 17 行通过 `cal2` 调用了 `calculate` 方法


    这段代码打印出以下输出：[](image_rsrc3RP.jpg) 背后发生了什么？


    * 当执行第 7 行时，它将指定的 lambda 表达式赋值给 `cal1`。第 12 行使用了 `cal1` 的实现

    * 当执行第 15 行时，它将另一个 lambda 表达式赋值给 `cal2`。第 17 行使用了 `cal2` 的实现

    * 因此，通过指定不同的 lambda 表达式为 `Calculator` 接口提供了不同的实现


    ## 17.2.5 Lambda 表达式优点

    Lambda 表达式具有以下优点：


    * 使代码更简洁

    * 允许创建没有方法名的代码

    * 允许为同一个方法提供不同的实现


    ## 17.3 总结

    * 函数式接口只有一个抽象方法的接口

    * Lambda 表达式可以实现函数式接口中的抽象方法

    * Lambda 表达式可以接受一个或多个参数，并可能产生返回值也可能不产生


