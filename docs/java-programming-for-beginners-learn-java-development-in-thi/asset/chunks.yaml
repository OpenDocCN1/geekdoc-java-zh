    In addition to importing a single class, you can also import the complete package.
    This imports all the classes in a package. In order to import a package, the `import`
    keyword should be followed by the package name followed by a period followed by
    the wildcard symbol (`*`). Example: `import mypackage.*`


    # 10.3 Summary


    *   Packages are used to logically group together related classes

    *   You can have multiple classes within a package

    *   In order to access a class outside the package, it needs to be imported via
    the `import` statement


    # 11 Access Specifiers

    Access specifiers are some keywords that control access to a class member (instance
    field or method).


    ## 11.1 Private

    A private member can be accessed only in the class where it is defined, it cannot
    be accessed outside the class.


    ### 11.1.1 Defining a Private Field

    A field can be made private by using the `private` keyword in its declaration.![](image_rsrc3MC.jpg)


    *   Lines 3-14 define a `Product` class

    *   The `name` field defined at Line 5 has the `private` access specifier


    ### 11.1.2 Accessing a Private Field in the same class

    A private field is only accessible in the class where it is defined.![](image_rsrc3MD.jpg)


    *   Line 7 defines a private field `name`

    *   It is accessed by the `setName` method at Line 9

    *   Since `name` has private access, Line 9 does not cause a compilation error


    ### 11.1.3 Accessing a Private Field in a different class

    A private field is not accessible outside the class.![](image_rsrc3ME.jpg)


    *   Lines 3-14 define an `AccessDemo` class

    *   Line 7 creates a `Product` object

    *   Line 9 tries to access the field `name` in the `Product` class

    *   Since `name` is `private`, it is not accessible outside `Product` class, so
    Line 9 causes a compilation error


    ## 11.2 Default

    A default member is accessible in all classes within the same package, but it
    is not accessible to classes in different packages.


    ### 11.2.1 Defining a Default Field

    When no other access specifier is used, a field has default access.![](image_rsrc3MF.jpg)


    *   Lines 1-7 define a `Product` class within the `demo.package1` package

    *   The `name` field defined at Line 5 does not have any access specifier, so
    it has default access


    ### 11.2.2 Accessing a default field in the same package

    A default field is accessible in all classes within the same package.![](image_rsrc3MG.jpg)


    *   Lines 1-14 define an `AccessDemo` class in the `demo.package1` package

    *   Line 7 creates a `Product` object

    *   Line 9 accesses the field `name` in the `Product` class

    *   Since `name` has default access, Line 9 does not cause a compilation error


    ### 11.2.3 Accessing a default field in a different package

    A default field is not accessible outside of the package where it is defined.![](image_rsrc3MH.jpg)


    *   Lines 1-14 define an `AccessDemo` class in a different package, called `demo.package2`

    *   Line 9 creates a `Product` object

    *   Line 11 tries to access the field `name` in the `Product` class

    *   Since `name` has default access, it is not accessible outside the package,
    so Line 9 causes a compilation error


    ## 11.3 Protected access specifier

    A protected member is accessible in all sub-classes of a class as well as all
    classes within the same package.


    ### 11.3.1 Defining a Protected Field

    A field can be made protected by using the `protected` keyword in its declaration.![](image_rsrc3MJ.jpg)


    *   Lines 1-7 define a `Product` class within the `demo.package1` package

    *   The `name` field defined at Line 5 has the `protected` access specifier


    ### 11.3.2 Accessing a Protected Field in a sub-class

    A protected field is accessible in all sub-classes of a class, even if they are
    in a different package.![](image_rsrc3MK.jpg)


    *   Lines 1-18 define an `ElectronicProduct` class within the `demo.package2`
    package

    *   Line 10 creates an `ElectronicProduct` object `eProduct`

    *   Line 12 accesses the field `name` in the `Product` class via `eProduct`

    *   Since `name` has protected access, Line 12 does not cause a compilation error


    ### 11.3.3 Accessing a Protected Field in a separate class in the same package

    A protected field is accessible in all classes in the same package, even if they
    are not sub-classes.![](image_rsrc3MM.jpg)


    *   Lines 1-13 define an `AccessDemo` class within the `demo.package1` package

    *   `AccessDemo` is not a sub-class of `Product`, but it is in the same package
    as `Product`

    *   Line 7 creates a `Product` object `product`

    *   Line 9 accesses the field `name` in the `Product` class

    *   Since `name` has protected access, Line 9 does not cause a compilation error


    ### 11.3.4 Accessing a Protected Field from a separate class

    A protected field is not accessible to non-subclasses outside the package.![](image_rsrc3MN.jpg)


    *   Lines 1-13 define an `AccessDemo` class

    *   `AccessDemo` is not a sub-class of `Product` and it is in a different package

    *   Line 7 creates a `Product` object

    *   Line 9 accesses the field `name` in the `Product` class

    *   Since `name` has protected access, Line 9 causes a compilation error


    ## 11.4 Public

    A public member is accessible by any code, even code that is outside the package.


    ### 11.4.1 Defining a Public Field

    A field can be made public by using the `public` keyword in its declaration.![](image_rsrc3MP.jpg)


    *   Lines 1-7 define a `Product` class within the `demo.package1` package

    *   The `name` field defined at Line 5 has the `public access specifier


    ### 11.4.2 Accessing a Public Field

    A public field is accessible by code that is outside the package.![](image_rsrc3MR.jpg)


    *   Lines 1-15 define an `AccessDemo` class in a different package, called `demo.package2`

    *   Line 9 creates a `Product` object

    *   Line 11 accesses the field `name` in the `Product` class

    *   Since `name` is `public`, Line 9 does not cause a compilation error


    # 11.5 Summary


    *   Java supports `private`, `default`, `protected` and `public` access specifiers

    *   A `private` member is accessible only in the class where it is defined

    *   A member with `default` access is accessible in the class where it is defined
    and in other classes in the same package

    *   A `protected` member is accessible in the package where it is defined and
    in sub-classes outside the package

    *   A `public` member is accessible everywhere


    # 12 Interfaces

    An interface is a java construct that is used to specify a behaviour that [classes](https://en.wikipedia.org/wiki/Class_(computer_science))
    must implement. It does this by specifying methods without any method body.


    ### 12.1 Defining an Interface

    An interface is defined via the `interface` keyword.![](image_rsrc3MS.jpg)


    *   Lines 3-7 define an interface `Drawable`

    *   Line 3 uses the `interface` keyword instead of the `class` keyword

    *   Line 5 specifies an abstract method `draw`

    *   An abstract method does not have a method body, the method name is followed
    by a semi-colon


    ### 12.1.2 Implementing an Interface

    An interface needs to be implemented by a class. The class that implements the
    interface needs to provide code for all the methods in the interface.![](image_rsrc3MT.jpg)


    *   Lines 3-10 define a class `Circle`

    *   The class name is followed by the keyword `implements` followed by `Drawable`
    at Line 3

    *   So, this indicates that `Circle` implements `Drawable`

    *   Lines 5-8 provide an implementation for the `draw` method in `Drawable`

    *   If the `draw` method is not provided in `Circle` class, a compilation error
    occurs


    ### 12.1.3 Using an Interface

    An interface cannot be instantiated via the `new` keyword, it needs to be used
    via a class that implements the interface.![](image_rsrc3MU.jpg)


    *   Lines 3-12 define a `ShapeDemo` class

    *   Line 7 tries to instantiate the `Drawable` interface via the `new` keyword,
    which causes an error.

