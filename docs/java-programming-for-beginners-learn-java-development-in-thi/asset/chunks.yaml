  trans: "\n\n*   在此例中，第 7 行声明了一个变量 `num` 并将其初始化为 `5`\n*   执行第 9-10 行，即循环体\n*   随后检查第\
    \ 12 行的条件 `num < 3`\n*   由于该条件为假（false），循环退出\n\n此代码打印以下输出：![](img/image_rsrc3JF.jpg)`5`\n\
    \n## 5.2.3 For 循环对值值范围进行迭代。\n\n语法![](img/image_rsrc3JG.jpg)\n代码示例![](img/image_rsrc3JH.jpg)\n\
    \n*   第 7-9 行是 `for` 循环\n*   第 7 行包含关键字 `for`，其后跟的是循环的初始化部分、条件部分和迭代部分\n*   `int\
    \ i = 0` 是循环的初始化部分\n*   `i < 3` 是循环的条件部分\n*   `i++` 是循环的迭代部分\n*   只要条件 `i < 3`\
    \ 为真，循环体就会重复执行\n\n此代码打印以下输出：![](img/image_rsrc3JJ.jpg)\n\n### 背后发生了什么？\n\n*  \
    \ 当执行第 7 行时，它将 `i` 设置为 `0` 并检查条件 `i < 3`。\n*   由于 `i < 3` 为真，进入循环并执行第 8 行\n* \
    \  一旦完成循环体中的代码，循环的迭代部分执行，`i` 增加到 `1`\n*   再次检查条件 `i<3`，此过程一直持续到条件变为假。\n\n## 5.2.4\
    \ For-each\n\n`for-each` 循环用于遍历数组或集合（集合将在后文详细介绍）。\n\n语法![](img/image_rsrc3JK.jpg)\n\
    代码示例![](img/image_rsrc3JM.jpg)\n\n*   第 7 行声明了一个名为 `oddNumbers` 的整数数组\n*   第 9-11\
    \ 行是 `for-each` 循环\n*   第 9 行包含关键字 `for`，其后跟一个变量 `num`，用于引用 `oddNumbers` 数组中的每个值\n\
    *   只要数组中还有值，就会执行循环体\n\n此代码打印以下输出：![](img/image_rsrc3JN.jpg)\n\n### 背后发生了什么？\n\
    \n*   当执行第 9 行时，`for-each` 循环获取 `oddNumbers` 数组中的当前元素，即 `1`\n*   针对值 `1` 执行第 10\
    \ 行\n*   随后，`for-each` 循环从数组中获取下一个元素，即 `3`，并对其执行第 10 行\n*   此过程持续到数组中的所有值都处理完毕\n\
    \n## 5.3 跳跃语句\n\n跳转语句将控制转移到代码的不同部分。\n\n### 5.3.1 Break\n\n#### 介绍\n`break` 语句可终止循环（`for`、`for-each`、`while`、`do-while`）。它也可以用于\
    \ `switch` 语句，如之前所示![](img/image_rsrc3JP.jpg)\n\n*   第 7-13 行指定了一个从 0 到 4 的 `for`\
    \ 循环\n*   第 8 行检查 `i` 是否为 `3`，如果是，则执行 `break`\n*   这会终止循环并将控制转移到第 14 行\n\n此代码打印以下输出：![](img/image_rsrc3JR.jpg)\n\
    \n### 背后发生了什么？\n\n*   `for` 循环在 `i = 0,1,2` 时正常进行，并执行第 12 行的 `Sysout`\n*   当 `i`\
    \ 为 `3` 时，第 8 行的条件为真，进入 `if` 块\n*   执行第 10 行的 `break` 语句终止循环\n*   因此，不执行第 12 行，控制转移到第\
    \ 14 行\n\n### 5.3.2 Continue\n\n`continue` 语句跳过循环的当前迭代，并继续执行下一次迭代![](img/image_rsrc3JS.jpg)\n\
    \n*   第 7-13 行指定了一个从 0 到 4 的 `for` 循环\n*   第 8 行检查 `i` 是否为 `3`，如果是，则执行 `continue`\n\
    *   这会终止循环的当前迭代，因此 `i=3` 时不执行第 11 行\n*   循环在 `i=4` 时继续\n\n此代码打印以下输出：![](img/image_rsrc3JT.jpg)\n\
    \n### 背后发生了什么？\n\n*   `for` 循环在 `i = 0,1,2` 时正常进行，并执行第 11 行的 `Sysout`\n*   当 `i`\
    \ 为 `3` 时，第 7 行的条件为真，进入 `if` 块\n*   执行第 9 行的 `continue` 语句，跳过 `i=3` 的循环\n*   控制转移到第\
    \ 6 行，继续执行 `i=4` 的循环\n*   循环完成后执行一次第 13 行\n\n## 5.4 总结\n\n*   控制语句有助于改变执行的控制流\n\
    *   控制语句可以是决策语句、迭代语句和跳转语句\n*   决策语句有助于根据值做出决策。Java 支持 `if` 和 `switch` 决策语句\n*\
    \   迭代语句用于重复代码块。Java 支持 `for`、`while`、`do-while` 和 `for-each` 迭代语句\n*   跳转语句将控制转移到代码的不同部分\n\
    \n## 6. 类\n\n类（Class）是创建对象的模板。它定义了对象可以拥的属性和行为。\n\n### 6.1 成员字段\n\n成员字段（Instance\
    \ Fields）是类中的变量。它们定义了对象的状态。\n\n### 6.1.1 定义成员字段\n\n成员字段是类中定义的变量。每个对象都拥有类定义的每个成员变量的副本。\n\
    \n```\nString name;\ndouble price;\n```\n\n#### 6.1.2 访问成员字段\n\n类字段可以通过点运算符（.）来访问。\n\
    \n```java\nProduct product1 = new Product();\nproduct1.name = \"Television\";\n\
    product1.price = 400.50;\n```\n\n#### 6.1.3 总结\n\n*   成员字段存储与对象相关的数据\n*   每个对象都有类定义的每个成员变量的副本\n\
    *   成员字段可以通过对象名加点运算符来访问\n\n## 6.2 方法\n\n方法（Method）是类中用于操作成员字段的代码。\n\n### 6.2.1\
    \ 定义方法\n\n方法通过指定方法名并在后跟要进入方法体的代码来定义。\n\n```java\nvoid showPriceWith10PercentDiscount()\
    \ {\n    System.out.println(\"Discounted price: \" + (price * 0.9));\n}\n```\n\
    \n#### 6.2.2 调用方法\n\n方法可以通过对象名加点运算符来调用。\n\n```java\nproduct1.showPriceWith10PercentDiscount();\n\
    ```\n\n#### 6.2.3 总结\n\n*   方法是类中的代码\n*   方法可以对成员字段的操作\n*   方法可以通过对象名加点运算符来调用\n\
    \n"
- fmt: "\n* Here, the method simply calculates the price by applying a 10% discount\
    \ and prints it\n\n### 6.3.2 Invoking a Method\nJust like instance fields, methods\
    \ can also be invoked via the dot operator![](image_rsrc3K0.jpg)\n\n* Lines 14-26\
    \ specify a main method in the `Product` class\n* Lines 16-18 create a `Product`\
    \ `product1` and initialize its instance fields\n* Line 23 invokes the `showPriceWith10PercentDiscount`\
    \ method\n\nThis code prints the following output:![](image_rsrc3K1.jpg)\n\n####\
    \ What Happens Behind the Scenes?\n\n* When Line 23 is executed, control is transferred\
    \ to the `showPriceWith10PercentDiscount` method at Line 8\n* The code in the\
    \ body of the method (Lines 8-12) gets executed\n* After this, control transfers\
    \ to the `main` method that resumes processing at Line 25\n\n### 6.3.3 Methods\
    \ with Return Value\nMethods can return a value which is the result of some computation![](image_rsrc3K2.jpg)\n\
    \n* Lines 9-13 define a method `getPriceWith10PercentDiscount`\n* Line 9 specifies\
    \ `double` which indicates that this method returns a value of type `double`\n\
    * Line 12 specifies the `return` keyword followed by `discountedPrice`\n* The\
    \ `return` returns whatever follows it\n* So the method `getPriceWith10PercentDiscount`\
    \ calculates the price with a 10% discount and returns it\n* Lines 15-28 specify\
    \ a `main` method\n* Lines 17-19 create a `Product` `product` and initialize its\
    \ instance fields\n* Line 23 invokes the `getPriceWith10PercentDiscount` method\n\
    * It assigns the value returned by `getPriceWith10PercentDiscount` to the variable\
    \ `priceWithDiscount`\n\nThis code prints the following output:![](image_rsrc3K3.jpg)\n\
    \n#### What Happens Behind the Scenes?\n\n* When Line 23 is executed, control\
    \ is transferred to the `getPriceWith10PercentDiscount` method at Line 9 as before\n\
    * The `getPriceWith10PercentDiscount` method calculates the `discountedPrice`\
    \ and returns it to `main`\n* The returned value is assigned to the `priceWithDiscount`\
    \ variable at Line 23\n\n### 6.3.4 Methods that accept parameters\nMethods can\
    \ also accept some values (known as parameters or arguments) and operate on those\
    \ values![](image_rsrc3K4.jpg)\n\n* Lines 8-12 define a method `getPriceWithtDiscount`\
    \ that accepts as parameter `discountPercentage`\n* Line 9 specifies `double discountPercentage`\
    \ inside parentheses after the method name\n    * `discountPercentage` is the\
    \ method parameter\n    * `double` specifies the data type of `discountPercentage`\n\
    * Lines 9-10 use the `discountPercentage` value to calculate the discount\n* Line\
    \ 22 invokes the `getPriceWithtDiscount` method with the value `10.0`\n\nThis\
    \ code prints the following output:![](image_rsrc3K5.jpg)\n\n#### What Happens\
    \ Behind the Scenes?\n\n* When Line 22 is executed, the method `getPriceWithtDiscount`\
    \ is invoked with the value `10.0`\n* So, `10.0` is assigned to the variable `discountPercentage`\
    \ at Line 8\n* The method `getPriceWithtDiscount` executes with this value and\
    \ returns a result\n\n### 6.3.5 Summary\n* A class has two components, instance\
    \ fields and methods\n* Instance fields specify the data related to a class and\
    \ methods specify the code that operates on the data\n* Both instance fields and\
    \ methods can be accessed using the dot operator\n* Methods can optionally accept\
    \ one or more parameters\n* They can optionally return a value.\n\n### 6.4 Constructors\n\
    A constructor is a special method that is invoked automatically as soon as an\
    \ object is created using the `new` operator\n\n#### 6.4.1 Default Constructor\n\
    A default constructor is a constructor that does not accept any arguments![](image_rsrc3K6.jpg)\n\
    \n* Lines 10-13 specify a constructor\n    * The name of the constructor is the\
    \ same as the class name (`Product`)\n    * It does not have a return type, not\
    \ even `void`\n    * It initializes the `name` and `price` instance fields to\
    \ the values `Television` and `400.50`\n* Line 17 creates a new `Product` object\
    \ called `product` which invokes the constructor\n* If you do not specify a default\
    \ constructor, Java automatically adds one\n\nThis code prints the following output:![](image_rsrc3K7.jpg)\n\
    \n#### What Happens Behind the Scenes?\n\n* When Line 17 is executed, control\
    \ transfers to the constructor at Line 10\n* The code in constructor (Lines 11-12)\
    \ gets executed\n* After this, control transfers to the `main` method that resumes\
    \ processing at Line 19\n\n#### 6.4.2 Parameterized Constructor\nA constructor\
    \ can also accept parameters just like a method![](image_rsrc3K8.jpg)\n\n* Lines\
    \ 9-12 specify a constructor that accepts 2 parameters called `inputName` and\
    \ `inputPrice`\n* Lines 10-11 assign the values passed in to the `name` and `price`\
    \ instance fields\n* Line 16 creates a new `Product` with the name as `Television`\
    \ and price as `400.50`\n\nThis code prints the following output:![](image_rsrc3K7.jpg)\n\
    \n#### What Happens Behind the Scenes?\n\n* When Line 16 is executed, the constructor\
    \ at Line 9 is invoked with the values `Television` and `400.50`\n\n#### 6.4.3\
    \ Summary\n* A constructor is automatically invoked as soon as an object is created\n\
    * A constructor that does not accept any arguments is known as a default constructor\n\
    * If there is no default constructor, Java automatically adds one\n* A constructor\
    \ can optionally accept one or more arguments\n\n### 6.5 this\nThe `this` keyword\
    \ refers to the current object![](image_rsrc3K9.jpg)\n\n* Lines 9-12 specify a\
    \ constructor that initializes the instance fields based on the values passed\
    \ in\n* Lines 10-11 use `this`\n* `this.name` refers to the current object’s `name`\
    \ field\n* `this.price` refers to the current object’s `price` field\n\n### 6.6\
    \ Method overloading\nMethod overloading allows you to have a class with multiple\
    \ methods with the same name but different parameters\n\n#### 6.6.1 Without Method\
    \ Overloading\nWithout method overloading, you would have to create methods with\
    \ different names for the same functionality![](image_rsrc3KA.jpg)\n\n* Line 5\
    \ defines `addTwoIntegers` method that accepts two integer values and returns\
    \ their sum\n* Line 10 defines `addThreeIntegers` method that accepts three integer\
    \ values and returns their sum\n* Line 15 defines `addTwoDoubles` method that\
    \ accepts two double values and returns their sum\n* So, although all 3 methods\
    \ perform addition, they are named differently which makes the code difficult\
    \ to read\n\n#### 6.6.2 Defining overloaded Methods\nOverloaded methods are defined\
    \ by having methods with the same name but different number/type of arguments![](image_rsrc3KB.jpg)\n\
    \n* Now, the `Calculator` class has 3 methods with the name `add`\n* Line 5 defines\
    \ an `add` method that accepts 2 integer arguments\n* Line 10 defines an `add`\
    \ method that accepts 3 integer arguments\n* Line 15 defines an `add` method that\
    \ accepts 2 double arguments\n* So, the `add` method is said to be \"overloaded\"\
    \ 3 times.\n\n#### 6.6.3 Invoking overloaded Methods\nWhen an overloaded method\
    \ is invoked, Java delegates the call to the appropriate version of the method\
    \ based on the arguments passed in.image_rsrc3KC.jpg\n\n* Line 24 invokes the\
    \ `add` method with 2 integer values\n* Line 27 invokes the `add` method with\
    \ 3 integer values\n* Line 30 invokes the `add` method with 2 double values\n\n\
    This code prints the following output:image_rsrc3KD.jpg \n\n#### What Happens\
    \ Behind the Scenes?\n\n* When Line 24 is executed, the number/type of arguments\
    \ are matched with each `add` method in the `Calculator` class.\n* Since Line\
    \ 24 passes in two integer values, this is matched to the `add` method at Line\
    \ 5 which is executed\n* Similarly, when Line 27 is executed, this is matched\
    \ to the `add` method at Line 10\n"
