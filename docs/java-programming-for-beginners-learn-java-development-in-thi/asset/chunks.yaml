- fmt: "\n# 1. Open Eclipse\n\n1. Click on `File` → `New` → `Java project`.\n\n![](image_rsrc3GM.jpg)\n\
    \n2. Enter some name for the project and click `Finish`.\n\n![](image_rsrc3GN.jpg)\n\
    \n3. Verify that the project is created properly in the `Package Explorer` in\
    \ the left pane:\n\n![](image_rsrc3GP.jpg)\n\n### What Happens Behind the Scenes?\n\
    * Eclipse creates a folder with the same name as the project in the default workspace\
    \ location\n* The project folder has a folder called `src` and a folder called\
    \ `bin`\n\n## 1.4.2 Create a package\nA package is a logical unit that groups\
    \ a set of related Java files. In order to create a package, you need to do the\
    \ following:\n\n1. Right click on `src` → `new` → `package`\n\n![](image_rsrc3GR.jpg)\n\
    \n2. Type the name that you want to give to the package and click `Finish`:\n\n\
    ![](image_rsrc3GS.jpg)\n\n3. Verify that the package is created properly in the\
    \ `Package Explorer` in the left pane:\n\n![](image_rsrc3GT.jpg)\n\n### What Happens\
    \ Behind the Scenes?\n* Eclipse creates a folder with the package name in the\
    \ `src` folder\n\n## 1.4.3 Create a class\nAny Java code that you write needs\
    \ to be present inside a class. In order to create a class, you need to do the\
    \ following:\n\n1. Right click on the package name → `New` → `Class`.\n\n![](image_rsrc3GU.jpg)\n\
    \n2. Type the name that you want to give to the class. Click the checkbox for\
    \ creating a main method and click `Finish`.\n\n![](image_rsrc3GV.jpg)\n\n3. Verify\
    \ that the `HelloWorldDemo.java` class is created with basic code skeleton as\
    \ follows:\n\n![](image_rsrc3GW.jpg)\n\n### What Happens Behind the Scenes?\n\
    * Eclipse creates a file called `HelloWorldDemo.java` in the `src/demo` folder\n\
    \n## 1.4.4 Write Code\nThe basic skeleton code created by Eclipse does not do\
    \ anything. Let’s write some code that prints “Hello World” as follows:\n\n![](image_rsrc3GX.jpg)\n\
    \nLet’s examine each line in this code:\n* Line 1 specifies that this class is\
    \ in a package called `demo`\n* Line 3 specifies the name of the class, that is\
    \ `HelloWorldDemo`\n* Line 5 specifies the `main` method. The `main` method is\
    \ the starting point of any Java application. The `public`, `static`, `void` keywords\
    \ will be covered further on.\n* Lines 6-8 constitute the method body. Anything\
    \ specified within the curly brackets is the body of the method.\n* Line 6 is\
    \ a comment. A comment is a statement that is ignored when the program is compiled\
    \ or run. Comments are optional and can be used to provide additional information\n\
    * Line 7 is a `Sysout` statement, it prints whatever is specified in the brackets.\n\
    \n## 1.4.5 Compile and Run code\nJava code needs to be compiled. Compilation is\
    \ the process of converting the English source code into bytecode that is understood\
    \ by `JVM`. By default, Eclipse automatically compiles the code when it is saved,\
    \ so you do not need to do anything explicitly. Once the code is compiled you\
    \ can run it. This causes the `JVM` to execute the bytecode. In order to run the\
    \ code, you need to follow the following steps:\n\n1. Click the green arrow icon\
    \ at the top:\n\n![](image_rsrc3GY.jpg)\n\n2. This causes the code to run and\
    \ display the output in the console window as follows:\n\n![](image_rsrc3GZ.jpg)\n\
    \n### What Happens Behind the Scenes?\n* Eclipse automatically compiles the code\
    \ when you save it\n* This creates a file with `.class` extension that contains\
    \ the bytecode\n* When you execute the code, the `JVM` executes the bytecode from\
    \ the `.class` file and prints the Hello World text to the console\n\n## 1.5 Reading\
    \ Input from User\nJava provides an in-built class called `Scanner` that can be\
    \ used to read a value entered by a user.\n\n![](image_rsrc3H0.jpg)\n\n* Line\
    \ 8 creates a `Scanner`\n* Line 10 reads the value entered by the user and stores\
    \ it in the variable `num` (Variables will be covered in the next section)\n*\
    \ Line 11 prints the value entered by the user\n\nWhen this code is executed,\
    \ it will print the following output (Assuming the user has entered the value\
    \ 10):\n\n![](image_rsrc3H1.jpg)\n\n### What Happens Behind the Scenes?\n* The\
    \ value entered by the user is read and assigned to the variable `num`\n\n## 1.6\
    \ Summary\n* Java is object oriented and platform independent\n* Unlike other\
    \ programming languages, Java code runs within the Java Virtual Machine (`JVM`)\
    \ and not directly in the operating system\n* Java code is written in a Java class\
    \ which is a file with `.java` extension\n* The `main` method is the starting\
    \ point of any Java application and any code that needs to be executed needs to\
    \ be placed in the `main` method\n* Code needs to be compiled before it is executed\n\
    * Compilation converts the Java code into byte code stored in a `.class` file\n\
    * On running the code, the `JVM` executes the instructions in the byte code\n\n\
    # 2 Variables and Data Types\nVariables are reserved memory locations that can\
    \ be used to store values. Data types specify the type of data that can be held\
    \ in a variable\n\n## 2.1 Declaring a variable\nVariables need to be declared\
    \ before they can be used.\n\n![](image_rsrc3H2.jpg)\n\n* Line 7 declares a variable\
    \ called `a`\n* Line 9 declares `b`, `c`\n* Both `int` and `double` are data types\n\
    \n### What Happens Behind the Scenes?\n* When Line 7 is executed, Java allocates\
    \ memory to store `a` \n* When Line 9 is executed, Java allocates memory for `b`,\
    \ `c`\n\n## 2.2 Initializing a variable\nVariables can also be assigned a value\
    \ when they are declared.\n\n![](image_rsrc3H3.jpg)\n\n* Line 7 declares a variable\
    \ `a` of type `int` and assigns it the value 100\n\n### What Happens Behind the\
    \ Scenes?\n* When Line 7 is executed, Java allocates memory to store an integer\
    \ with the value 100\n* It uses the name `a` to point to\n\n## 2.3 Data Types\n\
    Datatypes specify the type of data that can be stored in variable. Java supports\
    \ the following:\n\n| Name | Type of data | Width | Range |\n| :--- | :--- | :---\
    \ | :--- |\n| byte | Whole number | 8 | –128 to 127 |\n| short | Whole number\
    \ | 16 | –32,768 to 32,767 |\n| int | Whole number | 32 | –2,147,483,648 to 2,147,483,647\
    \ |\n| long | Whole number | 64 | –9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ |\n| float | Decimal number | 32 | 1.4e–45 to 3.4e+38 |\n| double | Decimal\
    \ number | 64 | 4.9e–324 to 1.8e+308 |\n| char | Unicode character | 16 | 0 to\
    \ 65,536 |\n| boolean | True or false value | - | - |\n\n![](image_rsrc3H5.jpg)\n\
    \n* Lines 7 to 16 declare variables of all the types types and assign some values\
    \ to them\n* Lines 18 to 27 print these values\n\n### What Happens Behind the\
    \ Scenes?\n* Java allocates memory to each variable based on its data type and\
    \ stores the value at the memory location\n\n## 2.4 Summary\n* Variables are names\
    \ given to memory locations to store values\n* A variable belongs to a data type\n\
    * Data types specify the type of data that will be held in a variable\n\n# 3 Operators\n\
    Operators are used to perform operations on values.\n\n## 3.1 Arithmetic\nArithmetic\
    \ operators are those that are used to perform mathematical operations.\n\n###\
    \ 3.1.1 Basic Arithmetic Operators\nBasic arithmetic operators are operators that\
    \ are used to perform addition, subtraction, multiplication and division.\n\n\
    | Symbol | Name | Description |\n| :--- | :--- | :--- |\n| + | Addition | Adds\
    \ the value on the right with the value on the left |\n| - | Subtraction | Subtracts\
    \ the value on the right from the value on the left |\n| * | Multiplication |\
    \ Multiplies the value on the right with the value on the left |\n| / | Division\
    \ | Divides the value on the left with the value on the right |\n| % | Remainder\
    \ of division | Returns the remainder obtained after dividing the value on the\
    \ left with the value on the right |\n\n![](image_rsrc3H7.jpg)\n\n* Lines 6 and\
    \ 7 declare variables `num1` and `num2`\n* Lines 9-13 print the result of performing\
    \ the basic arithmetic operations\n"
