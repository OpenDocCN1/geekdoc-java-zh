    the Scenes?


    * When Line 7 is executed, it assigns the specified lambda expression to `cal1`.
    Line 12 uses the `cal1` implementation

    * When Line 15 is executed, it assigns a different lambda expression to `cal2`.
    Line 17 uses the `cal2` implementation

    * So, different implementations are provided for the `Calculator` interface by
    specifying different lambda expressions


    ## 17.2.5 Benefits of Lambda Expressions

    Lambda expressions have several benefits as follows:


    * They make the code concise

    * They allow creating code without a method name

    * They allow providing different implementation for the same method on the fly


    ## 17.3 Summary

    * A functional interface is an interface with a single abstract method.

    * A lambda expression can be used to implement the abstract method in the functional
    interface

    * Lambda expressions can accept one or more parameters and may or may not produce
    a return value

