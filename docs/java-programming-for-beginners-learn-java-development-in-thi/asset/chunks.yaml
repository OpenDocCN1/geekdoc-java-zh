    \ the array which is `3` and executes Line 10 for it\n*   This continues till\
    \ all the values are exhausted from the array\n\n## 5.3 Jump Statements\n\nJump\
    \ statements transfer control to a different part of the code.\n\n### 5.3.1 Break\n\
    \n#### Introduction\nThe `break` statement can be used to terminate a loop (`for`,\
    \ `for-each`, `while`, `do-while`). It can also be used within a `switch` statement\
    \ as seen earlier![](image_rsrc3JP.jpg)\n\n*   Lines 7-13 specify a `for` loop\
    \ that loops from 0 to 4\n*   Line 8 checks if `i` is `3` and if so, executes\
    \ a `break`\n*   This terminates the loop and control is transferred to Line 14\n\
    \nThis code prints the following output:![](image_rsrc3JR.jpg)\n\n### What Happens\
    \ Behind the Scenes?\n\n*   The `for` loop proceeds normally for `i = 0,1,2` and\
    \ executes the `Sysout` at Line 12\n*   When `i` is `3`, the condition at Line\
    \ 8 is true , so the `if` block is entered\n*   This executes the `break` statement\
    \ at Line 10 which terminates the loop\n*   So, Line 12 does not get executed,\
    \ control transfers to Line 14\n\n### 5.3.2 Continue\n\nThe `continue` statement\
    \ skips the current iteration of a loop and continues the loop for the next iteration![](image_rsrc3JS.jpg)\n\
    \n*   Lines 7-13 specify a `for` loop that loops from 0 to 4\n*   Line 8 checks\
    \ if `i` is `3` and if so, executes a `continue`\n*   This terminates the current\
    \ iteration of the loop so Line 11 is not executed for `i=3`\n*   The loop continues\
    \ for `i=4`\n\nThis code prints the following output:![](image_rsrc3JT.jpg)\n\n\
    ### What Happens Behind the Scenes?\n\n*   The `for` loop proceeds normally for\
    \ `i = 0,1,2` and executes the `Sysout` at Line 11\n*   When `i` is `3`, the condition\
    \ at Line 7 is true , so the `if` block is entered\n*   This executes the `continue`\
    \ statement at Line 9 which skips the loop for `i=3`\n*   Control transfers to\
    \ Line 6 which continues the loop for `i=4`\n*   Line 13 is executed once the\
    \ loop completes\n\n## 5.4 Summary\n\n*   Control statements helps to change the\
    \ flow of control of execution\n*   Control statements can be decision statements,\
    \ iteration statements and jump statements\n*   Decision statements help to take\
    \ a decision based on a value. Java supports the `if` and `switch` decision statements\n\
    *   Iteration statements are used to repeat a block of code. Java supports the\
    \ `while`, `do-while`, `for` and `for-each` iteration statements\n*   Jump statements\
    \ transfer control to a different part of the code. Java supports the `break`\
    \ and `continue` jump statements\n\n## 6 Classes Explained\n\nAs seen from the\
    \ beginning, a class is very fundamental in a Java application. All Java code\
    \ needs to be present in a class.\n\n### 6.1 Classes\n\nA class defines a new\
    \ data type that can be used to create objects of that type.\n\n#### 6.1.1 Defining\
    \ a class\nA class can be created by using the class keyword followed by the name![](image_rsrc3JU.jpg)\n\
    \n*   Lines 3-9 specify a class called `Product`\n*   `public` is a keyword; it\
    \ will be covered further on\n*   The class keyword is followed by the name\n\n\
    #### 6.1.2 Creating an object\nA class can be used to create objects![](image_rsrc3JV.jpg)\n\
    \n*   Lines 3-11 specify a class called `ProductDemo`\n*   Lines 5-9 specify the\
    \ `main` method\n*   Line 7 creates a new `Product` object called `product1`\n\
    *   `Product` is the class\n*   `product1` is an actual object\n\n#### 6.1.3 Summary\n\
    *   A class defines a template for objects\n*   It has no memory allocated to\n\
    *   Classes can be used to create objects\n*   Objects have memory allocated to\n\
    \n## 6.2 Instance Fields\n\nInstance fields refer to variables within a class\
    \ which correspond to the data related to the class.\n\n#### 6.2.1 Defining Instance\
    \ Fields\nAn instance field can be defined by specifying its data type followed\
    \ by its name![](image_rsrc3JW.jpg)\n\n*   Line 5 declares a `String` variable\
    \ `name`. `String` is an in-built class representing a sequence of characters,\
    \ it will be covered further on.\n*   Line 6 declares a `double` variable `price`\n\
    *   So, `name` and `price` are the instance fields of the `Product` class\n\n\
    #### 6.2.2 Accessing Instance Fields\nThe fields in a class can be accessed via\
    \ the dot operator![](image_rsrc3JX.jpg)\n\n*   Lines 3-24 define a new class\
    \ called `ProductDemo`\n*   Line 7 creates a new `Product` object called `product1`\n\
    *   Line 8 assigns the value `\"Television \"` to the `name` field of `product1`\n\
    *   Line 9 assigns the value `\"400.50 \"` to the `price` field of `product1`\n\
    *   Line 15 creates a `Product` object called `product2`\n*   Lines 17-18 assign\
    \ some values to the fields of `product2`\n\nThis code prints the following output:![](image_rsrc3JY.jpg)\n\
    \n### What Happens Behind the Scenes?\n\n*   The dot operator (.) links the `Product`\
    \ object with instance fields\n*   So, when Lines 8-9 are executed, the specified\
    \ values are assigned to the instance fields of `product1`\n*   Similarly, when\
    \ Lines 17-18 are executed, the specified values are assigned to the instance\
    \ fields of `product2`\n\n#### 6.2.3 Summary\n*   Instance fields store the data\
    \ related to an object\n*   Each object has its own copy of each instance variable\
    \ defined by the class.\n*   Instance fields are accessible via the object name\
    \ followed by the dot operator\n\n## 6.3 Methods\n\nA Method refers to code within\
    \ a class that operates on the instance fields.\n\n### 6.3.1 Defining a Method\n\
    A method is defined by specifying a method name followed by the code that you\
    \ want to go into the body of the method![](image_rsrc3JZ.jpg)\n\n*   Lines 8-12\
    \ define a method called `showPriceWith10PercentDiscount`\n*   Line 8 is known\
    \ as the method declaration\n    *   `void` is a keyword that specifies that this\
    \ method does not return any value. Return types will be covered further on.\n\
    \    *   `showPriceWith10PercentDiscount` is the name given to the method.\n \
    \   *   The empty parentheses after the method name indicate that the method does\
    \ not accept any parameters. Parameters will be covered further on.\n*   Everything\
    \ within the curly brackets (Lines 9-11) is the body of the method.\n"
