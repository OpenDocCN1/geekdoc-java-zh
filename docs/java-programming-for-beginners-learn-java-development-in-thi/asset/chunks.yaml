    \n### 5 Java 控制语句\n控制语句有助于改变执行流。\n\n#### 5.1 判定语句\n判定语句用于根据变量的值选择不同的执行路径。\n\n\
    ##### 5.1.1 If\n`if` 语句用于检查条件并根据条件执行两条不同的路径。\n语法![](img/image_rsrc3HY.jpg)\n\n\
