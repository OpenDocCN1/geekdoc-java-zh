    \n### 幕后发生了什么？\n* 当执行第 9 行时，检查 `num1` 是否小于 100\n* 因为 `num1` 的值为 80，该条件为真，执行 `if`\
    \ 块内的代码\n* 跳过 `else` 块\n\n### 5.2 循环语句\n循环语句用于重复执行代码块。\n\n##### 5.2.1 While\n\
    `while` 循环在             \n  语法![](img/image_rsrc3J7.jpg)\n代码示例![](img/image_rsrc3J8.jpg)\n\
    \n* 第 7 行声明了一个变量 `num1` 并将其初始化为 0\n* 第 9-12 行是 `while` 循环\n* 第 9 行由 `while` 关键字和条件\
    \ `num1 < 100` 组成\n* `while` 块内的代码只要 `num1 < 100` 为真就会一直执行\n\n因此，这段代码输出了以下输出：![](img/image_rsrc3J9.jpg)\n\
    \n### 幕后发生了什么？\n* 当执行第 9 行时，检查 `num1 < 100`\n* 因为第 7 行将 `num` 设置为 0，该条件为真，进入循环并执行第\
    \ 10-11 行\n* 第 11 行将 `num` 增加 1\n* 再次检查 `num1 < 100` 条件，由于仍然为真，继续进入循环\n* 直到 `num1\
    \ < 100` 条件为假\n\n###### 5.2.2 Do-while\n`do-while` 循环同样在条件为真时重复代码块，但它在循环结束后检查条件，确保循环至少执行一次。\n\
    语法![](img/image_rsrc3J10.jpg)\n代码示例![](img/image_rsrc3J11.jpg)\n\n* 第 6 行声明了一个变量\
    \ `num` 并将其初始化为 1\n* 第 8-11 行是 `do-while` 循环\n* 第 9 行仅由 `do` 关键字\n* 第 12 行指定了\
    \ `while` 语句和条件 `num < 3`\n* `do-while` 块内的代码只要 `num < 3` 为真就会一直执行\n\n因此，这段代码输出了以下输出：![](img/image_rsrc3J12.jpg)\n\
    \n### 幕后发生了什么？\n* 首先执行 9-10 行\n* 第 10 行将 `num` 增加 1\n* 然后检查第 11 行的 `num < 3` 条件\n\
    * 因为 `num` 为 2，条件为真\n* 进入循环并执行第 10-11 行\n* 直到 `num < 3` 条件为假\n\n"
