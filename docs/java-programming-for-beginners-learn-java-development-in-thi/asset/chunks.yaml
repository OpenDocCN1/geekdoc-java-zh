    * 执行第 13 行时，它创建了一个使用 `TreeSet` 实现的 `Set` `set2` 并存储 `Product` 类型的数据


    ## 15.3.2 Set 操作

    与 `List` 接口一样，`Set` 接口有一个名为 `add` 的方法可以向 `Set` 中添加值。它还有一个 `size` 方法，用于返回 `Set`
    中的元素数量。它还有一个名为 `remove` 的方法，可以从 `Set` 中移除元素。![](img/image_rsrc3P5.jpg)


    * 第 10 行创建了一个名为 `myProducts` 的新 `Set`，存储 `Product` 对象

