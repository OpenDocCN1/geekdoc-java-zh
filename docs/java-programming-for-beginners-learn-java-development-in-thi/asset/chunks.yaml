    ## 13.6 Java’s exception hierarchy

    Java provides a lot of in-built exceptions within the `java.lang` package. The
    `java.lang.Throwable` is the super-class of all the exceptions. It has two main
    sub-classes, `java.lang.Error` and `java.lang.Exception`.


    ### 13.6.1 Error

    The `java.lang.Error` class represents a serious error that occurs due to some
    abnormal condition and not due to code. So, an application is not required to
    catch or handle such errors. The `java.lang.Error` class has several sub-classes
    that represent specific errors like `VirtualMachineError`, `IOError`, `LinkageError`,
    etc.


    ### 13.6.2 Exception

    The `java.lang.Exception` class represents errors that can occur due to code and
    that an application can catch and handle. Exceptions are of two types as follows:


    #### Unchecked Exceptions

    The `Exception` class has an important subclass which is `java.lang.RuntimeException`.
    `RuntimeException` and all its subclass are known as unchecked exceptions. This
    is because the compiler does not force you to handle such exceptions. So even
    if code that might potentially throw an unchecked exception is written, the compiler
    does not cause an error. Some examples of unchecked exceptions are `ArithmeticException`,
    `ArrayIndexOutOfBoundsException`, etc.


    #### Checked Exceptions

    All subclasses of `Exception` other than `RuntimeException` are known as checked
    exceptions. This is because these are checked by the compiler. So, if you write
    code that can cause a checked exception, a compilation error occurs if the exception
    is not caught and handled or declared in the `throws` clause. Some examples of
    checked exceptions are `IOException`, `AWTException`, etc.


    ## 13.7 Summary


    * When some error occurs while executing the code, Java creates an object of an
    appropriate `Exception` class and throws it

    * There is a default exception handler that handles the exception and displays
    an error message

    * The `try/catch` keywords allow handling exceptions in code. They give the code
    a chance to recover from the exception

    * The `finally` block can be used to place code that needs to be executed always,
    irrespective of whether an exception occurs or not

    * The `throw` keyword can be used to explicitly throw an exception

    * The `throws` keyword is used to specify that a method throws an exception but
    does not handle it

    * The `Exception` object has several methods which provide information about the
    exception


