    ## 6.6.4 Summary


    * Method overloading is the functionality where a class has multiple methods with
    the same name but different number/type of arguments

    * Java uses the number/type of arguments to determine which overloaded method
    to call

    * Methods cannot be overloaded based on return types. So, if multiple methods
    have the same number/type of arguments, but different return types a compilation
    error will occur.

    * Constructors can also be overloaded.


    ## 7 Static keyword

    The `static` keyword associates a member with a class itself. A static member
    can be accessed without creating an object of the class.


    ### 7.1 Static Fields

    A field can be made static by using the `static` keyword in its declaration.


    #### 7.1.1 Defining Static Field

    When a field is made static, only one copy of the field exists across all objects
    of the class![](image_rsrc3KE.jpg)


    * Line 5 specifies a static field called `field1`

    * Line 7 specifies an instance field called `field2`

    * So, all objects of `DemoClass` will refer to the same copy of `field1` but will
    have individual copies of `field2`


    #### 7.1.2 Accessing Static Field

    A static field can be accessed via the class name followed by the dot operator.
    It can also be accessed via an object![](image_rsrc3KF.jpg)


    * Lines 9-20 specify a `main` method in `DemoClass`

    * Line 11 accesses the static field `field1` via the class name `DemoClass`

    * Line 13 accesses the instance field `field2` from `DemoClass` via the class
    name which causes a compilation error

    * Line 15 creates a `demoObject` of `DemoClass`

    * Line 16 accesses the instance field `field2` via `demoObject` which works fine

    * Line 18 accesses the static field `field1` via `demoObject` which also works
    fine


    **What Happens Behind the Scenes?**


    * Line 11 works fine since a static field can be accessed via the class name

    * Line 13 causes a compilation error since an instance field cannot be accessed
    via the class name

    * Lines 16 and 18 work fine since both static and instance fields can be accessed
    via an object


    ### 7.2 Static Methods

    Just like a field, a method can be made static via the `static` keyword and accessed
    via the class name![](image_rsrc3KG.jpg)


    * Lines 9-11 specify a static method called `myMethod`

    * Lines 13-17 specify a `main` method

    * Line 15 invokes `myMethod` via the class name


    This code prints the following output![](image_rsrc3KH.jpg)


    **What Happens Behind the Scenes?**


    * When Line 15 is executed, the method `myMethod` is invoked without having to
    create an object of `DemoClass`


    **Rules for static Methods**


    * A static method can only access static fields, it cannot access instance fields

    * A static method can only invoke static methods, it cannot access instance methods


    ### 7.3 Static Blocks

    Besides fields and methods, a block of code can also be declared as `static`.
    Such code gets executed only once before any other code![](image_rsrc3KJ.jpg)


    * Lines 8-11 specify a static block of code

    * Line 10 initializes the static field `field1`

    * Lines 13-16 specify a `main` method


    This code prints the following output![](image_rsrc3KK.jpg)


    **What Happens Behind the Scenes?**


    * When the Java class is loaded, the static block at Line 8 is executed

    * Then, the `main` method at Line 13 is executed


    **Rules for Static Blocks**


    * A static block can only access static fields, it cannot access instance fields

    * A static block can only invoke static methods, it cannot access instance methods


    ### 7.4 Summary


    * The `static` keyword associates a field or method with a class itself

    * Static members are accessible via the class name, but they can also be accessed
    via an object of the class

    * A static field is like a global variable, there is only one copy of the field
    across all objects

    * In addition to fields and methods, a block of code can also be made static

    * The most common example of a static member is `main()`

    * Since `main()` is static, the JVM can invoke it without requiring an object
    of the class to be created.


    ## 8 Inheritance

    Inheritance makes it possible for a class to inherit fields and methods from another
    class and thus create a specialized class. This facilitates code reuse.


    ### 8.1 Subclasses

    A sub-class is a specialization of a general class.


    #### 8.1.1 Defining a superclass

    The class being inherited from is known as a base class or superclass![](image_rsrc3KM.jpg)


    * `Product` is an ordinary class

    * It has fields corresponding to `name` and `price`

    * It has a method called `printNameAndPrice`


    #### 8.1.2 Defining a subclass

    The class that inherits from a base class and adds its own specific stuff is known
    as a sub-class![](image_rsrc3KN.jpg)


    * Lines 6-14 define an `ElectronicProduct` class

    * The class name is followed by the keyword `extends` followed by `Product` at
    Line 3

    * So, this indicates that `ElectronicProduct` is a sub-class of `Product`

    * `ElectronicProduct` has a field `warrantyInYears` and a method `printWarranty`

    * So `ElectronicProduct` is a specialized version of `Product`

    * Just like `ElectronicProduct`, we can create other sub-classes like `FoodProduct`,
    `ApparelProduct`, etc.


    #### 8.1.3 Accessing Super-class Members

    A sub-class has access to all non-private members of the superclass![](image_rsrc3KP.jpg)


    * Lines 3-19 define a `ProductDemo` class

    * Line 7 creates an `ElectronicProduct` object

    * Lines 9-10 initialize the `name` and `price` fields from `Product` via `eProduct`

    * Line 11 invokes `printNameAndPrice` from `Product` via `eProduct`

    * Line 13 initializes the `warrantyInYears` field from `ElectronicProduct`

    * Line 14 invokes `printWarranty` from `ElectronicProduct`


    This code prints the following output![](image_rsrc3KR.jpg)


    **What Happens Behind the Scenes?**


    * When Line 7 is executed, it creates an `ElectronicProduct` which is a specialized
    `Product`

    * Lines 9-11 access the base class fields and methods via the `ElectronicProduct`


    #### 8.1.4 Summary


    * A base class is an ordinary class, a subclass is a specialization of the base
    class

    * A subclass can be created by using the `extends` keyword followed by the base
    class

    * A class can have multiple subclasses

    * A class cannot inherit from more than one class

    * Inheritance facilitates code reuse, so common fields and methods need not be
    repeated in every sub-class


    ## 8.2 Constructors in Inheritance

    Just like an ordinary class, constructors can be present in classes that are part
    of an inheritance hierarchy.


    ### 8.2.1 Constructor invocation

    When a subclass object is created, it implicitly invokes the superclass constructor![](image_rsrc3KS.jpg)![](image_rsrc3KT.jpg)


    * Lines 3-9 define a `Product` class

    * Lines 5-7 specify a `Product` constructor

    * Lines 12-22 define an `ElectronicProduct` class

    * Lines 14-16 specify an `ElectronicProduct` constructor

    * Line 20 creates an `ElectronicProduct` object within the `main` method


    This code prints the following output![](image_rsrc3KU.jpg)


    **What Happens Behind the Scenes?**


    * When Line 20 is executed, control transfers to the `Product` constructor at
    Line 5

    * Once the `Product` constructor completes, control transfers to the `ElectronicProduct`
    constructor at Line 14


    #### 8.2.2 Summary


    * When an object of the sub class is created, it implicitly invokes the constructor
    in the base class.

    * A super-class constructor can also be explicitly invoked via the `super` keyword
    as demonstrated in the next section.


    ## 8.3 Super keyword

    The `super` keyword is used to access members of the superclass from the subclass.


    ### 8.3.1 Accessing superclass members

    The `super` keyword can be used in the subclass to access the superclass instance
    fields and methods![](image_rsrc3KV.jpg)![](image_rsrc3KW.jpg)

