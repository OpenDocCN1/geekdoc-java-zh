    ## 15 Collection API

    The collection API consists of a set of classes and interfaces that allow you
    to store groups of objects together as a single unit. The collection classes and
    interfaces are present within the `java.util` package. The objects within a collection
    are known as elements.The following table details the main classes/interfaces
    in the Collection framework.


    | Interface/Class | Description |

    | :--- | :--- |

    | `java.util.Collection` | This is the top-level interface in the Collection hierarchy.
    |

    | `java.util.List` | Sub-interface of `java.util.Collection`. Stores a group of
    objects. Is ordered and allows duplicates |

    | `java.util.Set` | Sub-interface of `java.util.Collection`. Stores a group of
    objects. Is unordered and does not allow duplicates |

    | `java.util.Map` | Another top-level interface in the Collection hierarchy. Is
    used to store key-value pairs |

    | `java.util.ArrayList` | Class that implements the `List` interface. Internally
    uses an array to store the data. It is the most common implementation of the `List`
    interface |

    | `java.util.HashSet` | Class that implements the `Set` interface. It is the most
    common implementation of the `Set` interface |

    | `java.util.HashMap` | Class that implements the `Map` interface. It is the most
    common implementation of the `Set` interface |

