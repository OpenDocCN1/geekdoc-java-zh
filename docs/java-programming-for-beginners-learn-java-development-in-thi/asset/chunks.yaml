    was created by James Gosling and his team at Sun Microsystems in the early 90s.
    The first version of Java was 1.0\. Oracle acquired Sun Microsystems in 2010\.
    At the time of writing this, the latest release of Java is Java 14.1.2     Why
    JavaJava is Object oriented .Earlier programming languages like C were procedural.
    The downside of a procedural language is that programs become large and complex.To
    manage this complexity, Object oriented programming was conceived. Object oriented
    programming organises a program around its data and thus simplifies programming.Java
    is platform independent.Other programming languages like C or C++ are compiled
    into files that are operating system specific.Java on the other hand is compiled
    into bytecode which is run within the Java Virtual Machine or the JVM. The JVM
    sits on top of the operating system. So, the same compiled file can be run on
    different operating systems.1.3     Software Installation1.3.1 JDK InstallationJDK
