    * Lines 3-7 specify a `Product` class with `name` and `price` instance fields
    and a `printPriceWith10PercentDiscount` method.

    * Lines 16-40 specify an `ElectronicProduct` class.

    * Lines 20-29 specify a `printDetails` method.

    * Lines 22-23 access the base class fields `name` and `price` via the `super`
    keyword.

    * Line 27 accesses the base class method `printPriceWith10PercentDiscount` via
    the `super` keyword.

    * Lines 30-38 specify a `main` method that invokes the `printDetails` method.


    This code prints the following output:![](image_rsrc3KX.jpg)


    What Happens Behind the Scenes?


    * When Line 24 is executed, the `printDetails` method gets invoked which accesses
    the super class fields and methods via the `super` keyword.


    ### 8.3.2 Invoking superclass constructor

    The `super` keyword can also be used in the subclass constructor to invoke the
    superclass constructor ![](image_rsrc3KY.jpg)![](image_rsrc3KZ.jpg)


    * Lines 3-14 define a `Product` class.

    * Lines 8-12 specify a `Product` constructor that accepts arguments and initialize
    the instance fields.

    * Lines 16-35 specify an `ElectronicProduct` class.

    * Lines 20-27 specify an `ElectronicProduct` constructor.

    * Line 22 explicitly invokes the `Product` constructor via the `super` keyword.

    * The call to `super` must be the first statement in a subclass constructor as
    done at Line 22, otherwise a compilation error will occur.

    * Since the `Product` constructor accepts the `name` and `price` as arguments,
    these are passed via `super`, however `super` can also be used to invoke a constructor
    without arguments.

    * Lines 17-22 specify a `main` method that creates an `ElectronicProduct` object.


    This code prints the following output:![](image_rsrc3M0.jpg)


    What Happens Behind the Scenes?


    * When Line 19 is executed, control transfers to the `ElectronicProduct` constructor
    at Line 7.

    * This first explicitly invokes the `Product` constructor via the `super` keyword,
    passing in the `name` and `price` fields at Line 9.

    * After this, the code in the `ElectronicProduct` constructor gets executed.


    ### 8.3.3 Summary


    * The `super` keyword can be used from within a subclass to access superclass
    instance fields, methods or constructors.

    * The `super` keyword is redundant for instance fields and methods since non-private
    superclass members can be accessed directly in a subclass.

    * The `super` keyword is useful for accessing class members only when the base
    class has a member with the same name.


    ### 8.4 Method overriding

    Method overriding occurs when a subclass has a method which is present in the
    superclass. It allows a subclass to provide a different implementation for the
    superclass method.


    #### 8.4.1 Defining Overridden Method

    In order to define an overridden method, a sub-class should have a method with
    the same name, number and type of arguments as a method in the super class![](image_rsrc3M1.jpg)![](image_rsrc3M2.jpg)


    * Lines 3-9 define a `Product` class.

    * Lines 5-7 defines a `printInfo` method that prints some details about the `Product`.

    * Lines 11-17 define an `ElectronicProduct` class which is a sub-class of `Product`.

    * Lines 13-15 define a `printInfo` method that prints some details about the `ElectronicProduct`.

    * The `printInfo` method in `ElectronicProduct` overrides the `printInfo` method
    in `Product`.


    #### 8.4.2 Invoking Overridden Method

    An overridden method can be invoked normally like any other method.![](image_rsrc3M3.jpg)


    * Lines 3-14 specify a `ProductDemo` class.

    * Lines 5-12 specify a `main` method.

    * Lines 7-8 create a `Product` object and invoke the `printInfo` method.

    * Lines 10-11 create an `ElectronicProduct` object and invoke the `printInfo`
    method.


    This code prints the following output:![](image_rsrc3M4.jpg)


    What Happens Behind the Scenes?


    * When Line 8 is executed, the `printInfo` method is invoked with a `Product`
    object, so the code within the `Product` class gets executed.

    * When Line 11 is executed, the `printInfo` method is invoked with an `ElectronicProduct`
    object, so the code within the `ElectronicProduct` class gets executed.


    #### 8.4.3 Runtime polymorphism

    Method overriding can be used to achieve runtime polymorphism which is a very
    powerful Java feature![](image_rsrc3M5.jpg)


    * Line 7 declares a variable `product` of type `Product`.

    * Line 9 creates an object `eProduct` of type `ElectronicProduct`.

    * Line 11 assigns the `eproduct` to `product`.

    * This is allowed and does not cause a compilation error.

    * Line 13 invokes the `printInfo` method on the `product` object.

    * This causes the `printInfo` method in the `ElectronicProduct` class to be invoked.


    This code prints the following output:![](image_rsrc3M6.jpg)


    What Happens Behind the Scenes?


    * Line 11 assigns an object of the sub-class (`ElectronicProduct`) to a variable
    of the super-class (`Product`).

    * When the `printInfo` method is invoked at Line 13, Java uses the object type
    assigned to the `product` variable to determine which method gets invoked.

    * Since `product` is assigned an `ElectronicProduct` object, the `printInfo` method
    in `ElectronicProduct` gets executed.


    #### 8.4.4 Summary


    * Method overriding occurs when a subclass method has the same signature as a
    superclass method.

    * Method overriding is used to achieve runtime polymorphism.

    * In runtime polymorphism, Java determines the version of an overridden method
    to invoke based on the object assigned to the superclass variable.


    ### 9 Final keyword

    The `final` keyword can be used with a method or instance field.


    #### 9.1 Final Method

    When the `final` keyword is used with a method, it prevents the method from overridden![](image_rsrc3M7.jpg)![](image_rsrc3M8.jpg)


    * Lines 3-9 define a `Product` class.

    * Lines 5-7 define a `printInfo` method which is `final`.

    * Lines 11-17 define an `ElectronicProduct` class which is a sub-class of `Product`.

    * Lines 13-15 define an overridden `printInfo` method.

    * There is a compilation error at Line 13 since `printInfo` in `Product` is `final`.


    #### 9.2 Final field

    When the `final` keyword is used with a field, it prevents the field from being
    modified![](image_rsrc3M9.jpg)


    * Line 7 declares a final field `num` and initializes it to 10.

    * Line 9 tries to update `num` to 20 which causes a compilation error.

    * Since a final variable cannot be modified, it must be initialized at the time
    of declaration.


    #### 9.3 Summary

    * The `final` keyword can be used with methods and fields.

    * A `final` method cannot be overridden.

    * A `final` field cannot be modified after it is declared.


    ### 10 Packages and Imports

    A package helps to group together a set of Java files. An `import` is used to
    include the classes and interfaces defined in a package in the current code.


    #### 10.1 Defining a Package

    The `package` statement can be used to define a package![](image_rsrc3MA.jpg)


    * Lines 2-6 specify a class called `ClassA`.

    * Line 2 is the `package` statement. It must be the first statement in the code.

    * It consists of the `package` keyword followed by `mypackage` which is the package
    name.


    Rules for Packages


    * When a class is defined within a package, the `.java` file for the class must
    be present in a directory with the same name as the package. If you create a package
    via Eclipse as demonstrated above](#part0003.xhtml_a3GH), Eclipse automatically
    does this for you.

    * Packages can be hierarchical. Each package name in a hierarchy should be separated
    via a period. Example: `package1.package2.package3`.

    * Hierarchical package structures also need to follow a directory structure. So,
    for a package `package1.package2`, `package1` needs to have a folder called `package2`.


    #### 10.2 Importing a Package

    A class defined in a package needs to be imported before it can be used in some
    other package. In order to import a class or package, the `import` keyword should
    be used![](image_rsrc3MB.jpg)


    * Lines 1-13 specify a class `ClassB` in the `demo.package2` package.

    * Line 3 is the `import` statement.

    * It consists of the `import` keyword followed by the fully qualified class name
    (package name followed by class name).

