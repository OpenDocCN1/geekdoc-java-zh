  trans: "\n\n* 所以，当执行第 30 行时，它匹配到了第 15 行的 `add` 方法。\n\n## 6.6.4 总结\n\n* 方法重载是一项功能，允许一个类拥有多个同名但参数数量或类型不同的方法。\n\
    * Java 根据参数的数量的数量或类型来决定调用哪个重载方法。\n* 方法不能根据返回类型进行重载。因此，如果多个方法具有相同的参数数量/类型但不同的返回类型，将发生编译错误。\n\
    * 构造函数也可以被重载。\n\n## 7 静态关键字 static \n`static` 关键字将成员与类本身相关联。可以在不创建类对象的情况下访问静态成员。\n\
    \n### 7.1 静态字段\n可以通过在声明中使用 `static` 关键字将字段设为静态的。\n\n#### 7.1.1 定义静态字段\n当一个字段被设为静态时，该类的所有对象中只存在该字段的一个拷贝![](img/image_rsrc3KE.jpg)\n\
    \n* 第 5 行指定了一个名为 `field1` 的静态字段\n* 第 7 行指定了一个名为 `field2` 的实例字段\n* 所以，`DemoClass`\
    \ 的所有对象将引用 `field1` 的同一个拷贝，但将拥有各自的 `field2` 拷贝\n\n#### 7.1.2 访问静态字段\n可以通过类名加点操作符访问静态字段。也可以通过对象访问![](img/image_rsrc3KF.jpg)\n\
    \n* 第 9-20 行指定了 `DemoClass` 中的 `main` 方法\n* 第 11 行通过类名 `DemoClass` 访问静态字段 `field1`\n\
    * 第 13 行通过类名从 `DemoClass` 访问实例字段 `field2`，这会导致编译错误\n* 第 15 行创建了 `DemoClass` 的\
    \ `demoObject` 对象\n* 第 16 行通过 `demoObject` 访问实例字段 `field2`，这可以正常工作\n* 第 18 行通过\
    \ `demoObject` 访问静态字段 `field1`，这也可以正常工作\n\n**幕后发生了什么？**\n\n* 第 11 行运行正常，因为静态字段可以通过类名访问\n\
    * 第 13 行导致了编译错误，因为实例字段无法通过类名访问\n* 第 16 行和 18 行运行正常，因为静态和实例字段都可以通过对象访问\n\n### 7.2\
    \ 静态方法\n与字段一样，方法可以通过 `static` 关键字设为静态的，并通过类名访问![](img/image_rsrc3KG.jpg)\n\n*\
    \ 第 9-11 行指定了一个名为 `myMethod` 的静态方法\n* 第 13-17 行指定了 `main` 方法\n* 第 15 行通过类名调用了\
    \ `myMethod`\n\n这段代码打印以下输出![](img/image_rsrc3KH.jpg)\n\n**幕后发生了什么？**\n\n* 当执行第\
    \ 15 行时，调用了方法 `myMethod`，而无需创建 `DemoClass` 的对象\n\n**静态方法的规则**\n\n* 静态方法只能访问静态字段，不能访问实例字段\n\
    * 静态方法只能调用静态方法，不能访问实例方法\n\n### 7.3 静态块\n除了字段和方法外，代码块也可以声明为 `static`。此类代码在任何其他代码执行之前只会执行一次![](img/image_rsrc3KJ.jpg)\n\
    \n* 第 8-11 行指定了一个静态代码块\n* 第 10 行初始化了静态字段 `field1`\n* 第 13-16 行指定了 `main` 方法\n\n\
    这段代码打印以下输出![](img/image_rsrc3KK.jpg)\n\n**幕后发生了什么？**\n\n* 当 Java 类加载时，执行第 8 行的静态块\n\
    * 随后，执行第 13 行的 `main` 方法\n\n**静态块的规则**\n\n* 静态块只能访问静态字段，不能访问实例字段\n* 静态块只能调用静态方法，不能访问实例方法\n\
    \n### 7.4 总结\n\n* `static` 关键字将字段或方法与类本身相关联\n* 静态成员可以通过类名访问，也可以通过类的对象访问\n* 静态字段类似于全局变量，在所有对象中只存在该字段的一个拷贝\n\
    * 除了字段和方法外，代码块也可以被设为静态的\n* 静态成员最常见的例子是 `main()`\n* 由于 `main()` 是静态的，JVM 可以调用它而不需要创建类的对象。\n\
    \n## 8 继承\n继承允许类从另一个类继承字段和方法，从而创建一个专门的类。这有助于代码的复用。\n\n### 8.1 子类\n子类是通用类的特化。\n\
    \n#### 8.1.1 定义父类\n被继承的类被称为基类或父类![](img/image_rsrc3KM.jpg)\n\n* `Product` 是一个普通类\n\
    * 它拥有对应于 `name` 和 `price` 的字段\n* 它有一个名为 `printNameAndPrice` 的方法\n\n#### 8.1.2\
    \ 定义子类\n继承基类并添加自身特定内容的类被称为子类![](img/image_rsrc3KN.jpg)\n\n* 第 6-14 行定义了一个 `ElectronicProduct`\
    \ 类\n* 第 3 行中，类名后跟着关键字 `extends`，然后是 `Product`\n* 所以，这表示 `ElectronicProduct` 是\
    \ `Product` 的子类\n* `ElectronicProduct` 拥有字段 `warrantyInYears` 和方法 `printWarranty`\n\
    * 所以 `ElectronicProduct` 是 `Product` 的特化版本\n* 就像 `ElectronicProduct` 一样，我们可以创建其他子类，如\
    \ `FoodProduct`、`ApparelProduct` 等。\n\n#### 8.1.3 访问父类成员\n子类可以访问父类的非私有成员![](img/image_rsrc3KP.jpg)\n\
    \n* 第 3-19 行定义了一个 `ProductDemo` 类\n* 第 7 行创建了一个 `ElectronicProduct` 对象\n* 第 9-10\
    \ 行通过 `eProduct` 初始化 `name` 和 `price` 字段\n* 第 11 行通过 `eProduct` 调用 `printNameAndPrice`\n\
    * 第 13 行通过 `ElectronicProduct` 初始化 `warrantyInYears` 字段\n* 第 14 行通过 `ElectronicProduct`\
    \ 调用 `printWarranty`\n\n这段代码打印以下输出![](img/image_rsrc3KR.jpg)\n\n**幕后发生了什么？**\n\
    \n* 当执行第 7 行时，它创建了特化的 `ElectronicProduct`\n* 第 9-11 行通过 `ElectronicProduct` 访问基类的字段和方法\n\
    \n#### 8.1.4 总结\n\n* 基类是普通类，子类是基类的特化\n* 可以通过 `extends` 关键字加上基类来创建子类\n* 一个类可以有多个子类\n\
    * 一个类不能继承多个类\n* 继承有助于代码复用，因此公共字段和方法不需要在每个子类中重复\n\n## 8.2 中的构造函数\n与普通类一样，构造函数也可以存在于继承层次的类中。\n\
    \n### 8.2.1 构造函数调用\n当创建子类对象时，它会隐式地调用父类的构造函数![](img/image_rsrc3KS.jpg)[](image_rsrc3KT.jpg)\n\
    \n* 第 3-9 行定义了 `Product` 类\n* 第 5-7 行指定了 `Product` 构造函数\n* 第 12-22 行定义了 `ElectronicProduct`\
    \ 类\n* 第 14-16 行指定了 `ElectronicProduct` 构造函数\n* 第 20 行在 `main` 方法中创建了一个 `ElectronicProduct`\
    \ 对象\n\n这段代码打印以下输出![](img/image_rsrc3KU.jpg)\n\n**幕后发生了什么？**\n\n* 当执行第 20 行时，控制转移到第\
    \ 5 行的 `Product` 构造函数\n* 当 `Product` 构造函数完成后，控制转移到第 14 行的 `ElectronicProduct`\
    \ 构造函数\n\n#### 8.2.2 总结\n\n* 当创建子类对象时，它会隐式地调用基类的构造函数。\n* 如下一节所示，也可以通过 `super`\
    \ 关键字显式调用父类构造函数。\n\n## 8.3 super 关键字\n`super` 关键字用于从子类访问父类的成员。\n\n### 8.3.1 访问父类成员\n\
    可以在子类中使用 `super` 关键字来访问父类的实例字段和方法![](img/image_rsrc3KV.jpg)[](image_rsrc3KW.jpg)\n\
    \n"
