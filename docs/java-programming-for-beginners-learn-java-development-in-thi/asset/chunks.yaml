    *   A subclass can be created by using the extends keyword followed by the base
    class


    *   A class can have multiple subclasses


    *   A class cannot inherit from more than one class


    *   Inheritance facilitates code reuse , so the common fields and methods need
    not be repeated in every sub-class


    8.2     Constructors in InheritanceJust like an ordinary class, constructors can
    be present in classes that are part of an inheritance hierarchy8.2.1 Constructor
    invocationWhen a subclass object is created, it implicitly invokes the superclass
    constructor .![](image_rsrc3KS.jpg)![](image_rsrc3KT.jpg)


    *   Lines 3-9 define a Product class


    *   Lines 5-7 specify a Product constructor


    *   Lines 12-22 define an ElectronicProduct class


    *   Lines 14-16 specify an ElectronicProduct constructor


    *   Line 20 creates an ElectronicProduct object within the main method


    This code prints the following output:![](image_rsrc3KU.jpg)What Happens Behind
    the Scenes?


    *   When Line 20 is executed, control transfers to the Product constructor at
    Line 5


    *   Once the Product constructor completes, control transfers to the ElectronicProduct
    constructor at Line 14


    8.2.2 Summary


    *   When an object of the sub class is created, it implicitly invokes the constructor
    in the base class.


    *   A super-class constructor can also be explicitly invoked via the super keyword
    as demonstrated in the next section


    8.3     Super keywordThe super keyword is used to access members of the superclass
    from the subclass.8.3.1 Accessing superclass membersThe super keyword can be used
    in the subclass to access the superclass instance fields and methods![](image_rsrc3KV.jpg)![](image_rsrc3KW.jpg)'
