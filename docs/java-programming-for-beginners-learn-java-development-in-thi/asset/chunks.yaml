    ## 13 Exception Handling


    Exception Handling refers to Java’s mechanism for handling errors that occur when
    code is executed. In such a case, Java creates an exception (object of an in-built
    exception class) and throws it.


    ### 13.1 Default Handler


    Exceptions need to be caught and handled. Java has a default exception handler
    that handles exceptions not handled explicitly by the code![](image_rsrc3MW.jpg)


    * Line 7 declares an integer array called `numbers`

    * Line 9 tries to access the element at position 5.

    * Since the size of the array is 3, there is no element at position 5

    * This code does not cause a compilation error since syntactically it is correct.


    This code prints the following output:![](image_rsrc3MX.jpg)


    #### What Happens Behind the Scenes?


    * When the Java run-time system detects the attempt to access the element at position
    9, it creates an `ArrayIndexOutOfBoundsException` object and throws it.

    * `ArrayIndexOutOfBoundsException` is one of Java’s in-built exceptions

    * Java’s default handler catches the exception and prints an error message

    * As soon as the exception occurs, program execution stops, so the `Sysout` statement
    at line 11 is not executed.


    ### 13.2 Try and catch


    Java provides the `try`/`catch` keywords which can be used to explicitly handle
    exceptions in code.


