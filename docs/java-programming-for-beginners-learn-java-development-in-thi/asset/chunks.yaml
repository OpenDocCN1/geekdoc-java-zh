    # 15.1 Collection

    `java.util.Collection` is a top level interface in the Collection hierarchy. It
    has many sub-interfaces which provide specific behaviour. Some Collections allow
    duplicates, some are ordered, some only allow retrieving the first element of
    the Collection, etc. There is no direct implementation of the `Collection` interface.


    # 15.2 List

    `List` is a sub interface of the `Collection` interface and is used to store a
    group of objects. A `List` represents a Collection that is ordered and allows
    duplicates.


    ## 15.2.1 List Creation

    There are several classes that implement the `List` interface like `ArrayList`,
    `LinkedList`, etc. Any of these classes can be used to create a `List`.![](image_rsrc3NP.jpg)


    * Line 11 creates a `List` `list1` that uses the `ArrayList` implementation

    * `list1` is a `List` that stores data of type `String`

    * A `List` can store any type of data, however the type that it stores must be
    specified within angled brackets (`<>`). This Java feature is known as generics

    * Line 11 uses the `ArrayList` constructor that does not accept any arguments

    * `ArrayList` has many other constructors that allow creating an `ArrayList` in
    different ways

    * Line 13 creates another a `List` `list2` using the `LinkedList` implementation

    * `list2` is a `List` that stores data of type `Product`

    * Line 13 uses the default `LinkedList` constructor, but `LinkedList` also has
    many other constructors that allow creating a `LinkedList` in different ways


    ### What Happens Behind the Scenes?

    * When Line 11 is executed, it creates a `List` `list1` which uses an `ArrayList`
    implementation and stores data of type `String`

    * When Line 13 is executed, it creates a `List` `list2` which uses a `LinkedList`
    implementation and stores data of type `Product`


    ## 15.2.2 Adding Values to a List

    The `List` interface has a method called `add` which can be used to add values
    to the `List`.![](image_rsrc3NR.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-14 create 3 `Product` objects

    * Lines 16-18 invoke the `add` method for `product1`, `product2` and `product3`


    ### What Happens Behind the Scenes?

    * When Line 16-18 are executed, the objects `product1`, `product2` and `product3`
    are added to the `List`


    ## 15.2.3 Obtaining the size of a List

    There is a `size` method available on the `List` interface which can be used to
    obtain the number of elements in the `List`.![](image_rsrc3NS.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-18 create 3 `Product` objects and add them to the `myProducts` `List`

    * Line 19 invokes the `size` method on the `myProducts` list


    This code prints the following output:![](image_rsrc3NT.jpg)


    ### What Happens Behind the Scenes?

    * When Lines 19 is executed, it returns the number of elements in the `List`

    * Since 3 values are initially added to the `List`, this value is assigned to
    the `size` variable


    ## 15.2.4 Positional Access

    A `List` allows positional access, that is you can retrieve an element by specifying
    its position. This is possible since a `List` is ordered and maintains the order
    of insertion. There is a `get` method available on the `List` interface for positional
    access.![](image_rsrc3NU.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-18 create 3 `Product` objects and add them to the `myProducts` `List`

    * Line 20 invokes the `get` method with the value 1


    This code prints the following output:![](image_rsrc3NV.jpg)


    ### What Happens Behind the Scenes?

    * When Line 20 is executed, the `get` method returns the object at position 1

    * `List` index begins at position 0, so 1 corresponds to the 2 nd element in the
    `List` which is `product2` (Refrigerator)


    ## 15.2.5 Iterating over a List

    Any of the Java loops (`while`, `do-while`, `for`, `for-each`) can be used to
    iterate over a `List`.![](image_rsrc3NW.jpg)


    * Line 10 creates a new `List` called `myProducts` that stores `Product` objects

    * Lines 12-18 create 3 `Product` objects and add them to the `myProducts` `List`

