    ###### 5.1.2 Switch

    The `switch` statement can be used to-execute different code based on the value
    of an expression.

    Syntax![](image_rsrc3J5.jpg)

    Code Sample![](image_rsrc3J6.jpg)


    * Line 7 declares a `char` variable `grade` with value B

    * Lines 9-23 is the `switch` block

    * Line 9 uses the `switch` statement with the variable `grade`

    * Line 10 is a `case` statement; it is followed by a value. The `grade` value
    is compared with the value in each `case` statement

    * Line 12 is a `break` statement; it is optional. If a match is found, it prevents
    further `case` statements from being executed

    * Line 19 is a `default` statement; it is optional. It specifies the code that
    should be executed in case `grade` does not match any `case` statement


    This code prints the following output:![](image_rsrc3J7.jpg)


    ### What Happens Behind the Scenes?

    * When Line 9 is executed, the `grade` is compared with the value in each `case`
    statement

    * A match is found at Line 13 which causes the `System.out` statement at Line
    14 to be executed

    * The `break` statement at Line 15 prevents further `case` statements to be checked
    and control transfers outside the `switch` block

    * The code within the `default` block is not executed


    #### Points to Remember

    * The expression in the `switch` statement can be an `integer`, `char`, `enum`
    or `String`

    * The `break` statement is optional. If present, it prevents further `case` statements
    from being checked once a match is found

    * The `default` statement is optional. If present and if the `switch` expression
    does not match any `case`, the `default` block is executed. If not present and
    if the `switch` expression does not match any `case`, control is transferred outside
    `switch`


