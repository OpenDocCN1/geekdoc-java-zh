  * `getPriceWith10PercentDiscount` 方法计算 `discountedPrice` 并将其返回给 `main`\n* 返回的值被赋值给第\
  \ 23 行的 `priceWithDiscount` 变量\n\n### 6.3.4 接受参数的方法\n方法也可以接受某些值（称为参数或形参）并对这些值进行操作![](img/image_rsrc3K4.jpg)\n\
  \n* 第 8-12 行定义了一个方法 `getPriceWithtDiscount`，它接受 `discountPercentage` 作为参数\n* 第 9\
  \ 行在方法名后的括号内指定了 `double discountPercentage`\n    * `discountPercentage` 是方法的参数\n\
  \    * `double` 指定了 `discountPercentage` 的数据类型\n* 第 9-10 行使用 `discountPercentage`\
  \ 的值计算折扣\n* 第 22 行使用值 `10.0` 调用了 `getPriceWithtDiscount` 方法\n\n这段代码输出以下输出![](img/image_rsrc3K5.jpg)\n\
  \n#### 背后发生了什么？\n\n* 执行第 22 行时，使用值 `10.0` 调用了方法 `getPriceWithtDiscount`\n* 因此，`10.0`\
  \ 被赋值给第 8 行的变量 `discountPercentage`\n* 方法 `getPriceWithtDiscount` 使用此值执行并返回一个结果\n\
  \n### 6.3.5 总结\n* 类包含两个组件：实例字段和方法\n* 实例字段指定与类相关的数据，方法指定操作这些数据的代码\n* 实例字段和方法都可以使用点运算符访问\n\
  * 方法可以选择地接受一个或多个参数\n* 它们可以选择地返回一个值\n\n## 6.4 构造函数\n构造函数是一种特殊方法，在使用 `new` 运算符创建对象时会被自动调用\n\
  \n### 6.4.1 默认构造函数\n默认构造函数是不接受任何参数的构造函数![](img/image_rsrc3K6.jpg)\n\n* 第 10-13 行指定了一个构造函数\n\
  \    * 构造函数的名字与类名 (`Product`) 相同\n    * 它没有返回类型，甚至没有 `void` 类型\n    * 它将实例字段 `name`\
