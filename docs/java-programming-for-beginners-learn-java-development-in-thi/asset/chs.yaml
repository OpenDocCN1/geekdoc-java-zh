  2) 根据操作系统下载 JDK\n3) 双击下载的文件并按照屏幕提示操作\n\n# 1.3.2 Eclipse 安装\nEclipse 是一个集成开发环境（IDE）。它是一个帮助你轻松编写和运行\
  \ Java 代码的软件。要安装 Eclipse，你需要遵循以下步骤：\n1) 访问 Eclipse 下载网站：`https://www.eclipse.org/downloads/`\n\
  2) 根据操作系统下载那里列出的最新版本\n3) 双击下载的文件并按照屏幕提示操作\n\n# 1.4 第一个 Java 程序\n在开始编写代码之前，你需要完成几项基础工作：\n\
  \n#### 1.4.1 在 Eclipse 中创建 Java 项目\n项目将与 Java 应用相关的所有文件分组。要创建一个项目，你需要执行以下操作：\n\n\
  \n\n\n[content]\n\n# 1. 打开 Eclipse\n\n1. 点击 `File` → `New` → `Java project`。\n\n\
  ![](img/image_rsrc3GM.jpg)\n\n2. 为项目输入一个名称并点击 `Finish`。\n\n![](img/image_rsrc3GN.jpg)\n\
  \n3. 在左侧面板的 `Package Explorer` 中验证项目是否已正确创建：\n\n![](img/image_rsrc3GP.jpg)\n\n###\
  \ 幕后发生了什么？\n* Eclipse 在默认工作空间位置创建一个与项目同名的文件夹\n* 项目文件夹中包含一个名为 `src` 的文件夹和一个名为 `bin`\
  \ 的文件夹\n\n### 1.4.2 创建包 (package)\n包是一个逻辑单元，用于将一组相关的 Java 文件分在在一起。要创建一个包，你需要执行以下操作：\n\
  \n1. 右键点击 `src` → `new` → `package`\n\n![](img/image_rsrc3GR.jpg)\n\n2. 输入你想为包命名的名称并点击\
  \ `Finish`：\n\n![](img/image_rsrc3GS.jpg)\n\n3. 在左侧面板的 `Package Explorer` 中验证包是否已正确创建：\n\
  \n![](img/image_rsrc3GT.jpg)\n\n### 幕后发生了什么？\n* Eclipse 在 `src` 文件夹中创建一个名为包名的文件夹\n\
  \n### 1.4.3 创建类 (class)\n你编写的任何 Java 代码都必须存在类内部。要创建一个类，你需要执行以下操作：\n\n1. 右键点击包名 →\
  \ `New` → `Class`。\n\n![](img/image_rsrc3GU.jpg)\n\n2. 输入你想为类命名的名称。勾选创建 main 方法的选择框并点击\
  \ `Finish`。\n\n![](img/image_rsrc3GV.jpg)\n\n3. 验证 `HelloWorldDemo.java` 类已按如下基础代码骨架创建：\n\
  \n![](img/image_rsrc3GW.jpg)\n\n### 幕后发生了什么？\n* Eclipse 在 `src/demo` 文件夹中创建一个名为\
  \ `HelloWorldDemo.java` 的文件\n\n### 1.4.4 编写代码\nEclipse 创建的基础骨架代码没有任何实际作用。让我们编写一些代码来打印“Hello\
  \ World”，如下：\n\n![](img/image_rsrc3GX.jpg)\n\n让我们检查这段代码的每一行：\n* 第 1 行指定该类位于名为 `demo`\
  \ 的包中\n* 第 3 行指定了类的名称，即 `HelloWorldDemo`\n* 第 5 行指定了 `main` 方法。`main` 方法是任何 Java\
  \ 程序的起点。`public`、`static`、`void` 关键字将在后续进行介绍。\n* 第 6-8 行构成方法体。花括号内指定的任何内容都是方法体。\n\
  * 第 6 行是一个注释。注释是程序在编译或运行时会被忽略的语句。注释是可选的，可用于提供额外信息。\n* 第 7 行是一个 `Sysout` 语句，它打印括号内指定的任何内容。\n\
  \n### 1.4.5 编译并运行代码\nJava 代码需要被编译。编译是将英语源码转换为 `JVM` 能够理解的字节码的过程。默认情况下，Eclipse 在保存代码时会自动编译代码，因此你不需要显式地执行任何操作。一旦代码编译完成，你就可以运行它。这会导致\
  \ `JVM` 执行字节码。要运行代码，你需要按照以下步骤操作：\n\n1. 点击顶部的绿色箭头图标：\n\n![](img/image_rsrc3GY.jpg)\n\
  \n2. 这会导致代码运行并在控制台窗口显示输出如下：\n\n![](img/image_rsrc3GZ.jpg)\n\n### 幕后发生了什么？\n* Eclipse\
  \ 在你保存代码时会自动编译\n* 这会创建一个扩展名为 `.class` 的文件，其中包含字节码\n* 当你执行代码时，`JVM` 执行 `.class` 文件中的字节码并在控制台打印\
  \ Hello World\n\n## 1.5 从用户读取输入\nJava 提供了一个名为 `Scanner` 的内置类，可用于读取用户输入的值。\n\n![](img/image_rsrc3H0.jpg)\n\
  \n* 第 8 行创建了一个 `Scanner`\n* 第 10 行读取用户输入的值并存储在变量 `num` 中（变量将在下一节介绍）\n* 第 11 行打印用户输入的值\n\
  \n当执行此代码时，它将打印以下输出（假设用户输入了值 10）：\n\n![](img/image_rsrc3H1.jpg)\n\n### 幕后发生了什么？\n\
  * 用户输入的值被读取并赋值给变量 `num`\n\n## 1.6 总结\n* Java 是面向对象且与平台独立的\n* 与其他编程语言不同，Java 代码运行在\
  \ Java 虚拟机 (`JVM`) 中，而不是直接在操作系统中\n* Java 代码写在 Java 类中，类是一个名为 `.java` 的文件\n* `main`\
  \ 方法是任何 Java 程序的起点，任何需要执行的代码都必须放在 `main` 方法中\n* 代码在执行之前需要被编译\n* 编译将 Java 代码转换为存储在\
  \ `.class` 文件中的字节码\n* 运行代码时，`JVM` 执行字节码中的指令\n\n# 2 变量和数据类型\n变量是可用于存储值的预留内存位置。数据类型指定了变量中可以持的数据类型。\n\
  \n## 2.1 声明变量\n变量在使用之前必须先声明。\n\n![](img/image_rsrc3H2.jpg)\n\n* 第 7 行声明了变量 `a`\n\
  * 第 9 行声明了 `b`，且 `int` 都是数据类型\n\n### 幕后发生了什么？\n* 执行第 7 行时，为 `a` 分配内存\n* 执行第 9 行时\n\
  \n## 2.2 变量初始化\n变量在声明时也可以被赋值值。\n\n![](img/image_rsrc3H3.jpg)\n\n* 第 7 行声明了类型为 `int`\
  \ 的变量 `a` 并将其赋值为 10\n\n### 幕后发生了什么？\n* 执行第 7 行时，为整数分配内存\n\n## 2.3 数据类型\n数据类型指定了可以存储在变量中的类型。Java\
  \ 支持以下类型：\n\n| 名称 | 数据类型 | 宽度 | 范围 |\n| :--- | :--- | :--- | :--- |\n| byte | 整数\
  \ | 8 | –128 到 127 |\n| short | 整数 | 16 | –32,768 到 32,767 |\n| int | 整数 | 32 |\
  \ –2,147,483,648 到 2,147,483,647 |\n| long | 整数 | 64 | –9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 |\n| float | 小数 | 32 | 1.4e–45 到 3.4e+38 |\n| double\
  \ | 小数 | 64 | 4.9e–324 到 1.8e+308 |\n| char | Unicode 字符 | 16 | 0 到 65,536 |\n|\
  \ boolean | 真假值 | - | - |\n\n![](img/image_rsrc3H5.jpg)\n\n* 第 7-16 行声明了所有类型的变量并赋值了一些值\n\
  * 第 18-27 行打印这些值\n\n### 幕后发生了什么？\n* Java 根据变量的数据类型分配内存并将值存储在内存位置\n\n## 2.4 总结\n\
  * 变量是赋给内存位置的名字\n* 变量属于某种数据类型\n* 数据类型指定了将持有的数据类型\n\n# 3 运算符\n运算符用于对值执行操作。\n\n## 3.1\
  \ 算术\n算术运算符是执行数学运算的运算符。\n\n### 3.1.1 基础算术运算符\n基础算术运算符是用于执行加、减、乘、除法的运算符。\n\n| 符号\
  \ | 名称 | 说明 |\n| :--- | :--- | :--- |\n| + | 加法 | 将右侧值与左侧值相加 |\n| - | 减法 | 从左侧值减去右侧值\
  \ |\n| * | 乘法 | 右侧值乘以左侧值 |\n| / | 除法 | 将左侧值除以右侧值 |\n| % | 取模 | 返回左侧值除以右侧值后的余数 |\n\
  \n![](img/image_rsrc3H7.jpg)\n\n* 第 6 行和第 7 行声明了变量 `num1` 和 `num2`\n* 第 9-13 行打印执行基础算术运算的结果\n\
  \n\n\n\n所以，这段代码输出了以下输出：![](img/image_rsrc3H8.jpg)背后发生了什么？\n\n* 每个算术运算符都对 `num1`\
  \ 和 `num2` 执行底层操作\n* 随后 `Sysout` 语句打印操作结果\n\n### 3.1.2 赋值运算符\n赋值运算符（`=` 符号）将值分配给变量![](img/image_rsrc3H9.jpg)\n\
  \n* 第 7 行使用 `=` 运算符将值 `10` 赋值给变量 `num`\n* 第 9 行使用 `=` 运算符将 `num*num` 的结果赋值给变量 `square`\n\
  \n所以，这段代码输出了以下输出![](img/image_rsrc3HA.jpg)背后发生了什么？\n\n* 赋值运算符将其右侧的任何内容赋值给左侧的变量\n\
  * 如果右侧有一个值，则对其赋值\n* 如果右侧是一个表达式，则对其进行求值并赋值结果\n\n### 3.1.3 复合赋值运算符\n复合赋值运算符将操作与赋值结合在一起。\n\
  \n| 符号 | 名称 | 说明 |\n| :--- | :--- | :--- |\n| += | 加法赋值 | 将右侧的值加到左侧变量上并将结果赋值给左侧变量\
  \ |\n| -= | 减法赋值 | 从左侧变量中减去右侧的值并将结果赋值给左侧变量 |\n| *= | 乘法赋值 | 将右侧的值乘以左侧变量并将结果赋值给左侧变量\
  \ |\n| /= | 除法赋值 | 将右侧变量除以左侧的值并将结果赋值给左侧变量 |\n| %= | 取模赋值 | 获取左侧变量除以右侧侧的余数，并将结果赋值给左侧变量\
  \ |\n\n![](img/image_rsrc3HB.jpg)\n\n* 第 7 行声明了一些变量并为它们分配了某些值\n* 第 9-22 行使用了每种复合赋值运算符并打印结果\n\
  * 复合赋值运算符基本上是快捷运算符\n* 所以 `num1 +=5` 等于 `num1 = num1+5`\n\n所以，这段代码输出了以下输出![](img/image_rsrc3HC.jpg)背后发生了什么？\n\
  \n* 每个复合赋值运算符都执行相应的操作并将结果赋值给其调用的变量\n\n### 3.1.4 递增和递减运算符\n递增和递减运算符将其操作数递增/递减 1。\n\
  \n| 符号 | 名称 | 说明 |\n| :--- | :--- | :--- |\n| ++ | 递增 | 操作数加 1 |\n| -- | 递减 | 操作数减\
  \ 11 |\n\n![](img/image_rsrc3HD.jpg)\n\n* 第 7-9 行声明了一个变量 `num1` 并使用递增运算符对其递增\n*\
  \ 第 11-13 行声明了一个变量 `num2` 并使用递减运算符对其递减\n* 递增/递减运算符基本上是快捷运算符\n* 所以 `num++` 等于 `num=num+1`\n\
  \n所以，这段代码输出了以下输出![](img/image_rsrc3HE.jpg)背后发生了什么？\n\n* 递增运算符对其操作数加 1\n* 递减运算符从其操作数减去\
  \ 1\n\n## 3.2 关系运算符\n关系运算符用于比较值。\n\n| 符号 | 名称 | 说明 |\n| :--- | :--- | :--- |\n|\
  \ > | 大于 | 如果左侧的值大于右侧的值，则返回 true |\n| < | 小于 | 如果左侧的值小于右侧的值，则返回 true |\n| == | 等于\
  \ | 如果左侧的值等于右侧的值，则返回 true |\n| != | 不等于 | 如果左侧的值不等于右侧的值，则返回 true |\n| >= | 大于等于\
  \ | 如果左侧的值大于或等于右侧的值，则返回 true |\n| <= | 小于等于 | 如果左侧的值小于或等于右侧的值，则返回 true |\n\n![](img/image_rsrc3HF.jpg)\n\
  \n* 第 7-8 行声明了两个整数变量 `num1` 和 `num2`\n* 第 9-26 行使用了每种关系运算符并打印结果\n\n所以，这段代码输出了以下输出![](img/image_rsrc3HG.jpg)背后发生了什么？\n\
  \n* 每个关系运算符都比较左侧的值与右侧的值并返回比较结果布尔值。\n\n## 3.3 逻辑运算符\n逻辑运算符用于组合关系比较。\n\n| 符号 | 名称\
  \ | 行为 |\n| :--- | :--- | :--- |\n| && | 逻辑与 | 如果两个操作数都为 true，则返回 true |\n| || |\
