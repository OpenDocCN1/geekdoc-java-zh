  *   由于 `name` 是 `public` 的，第 9 行不会引起编译错误\n\n## 11.5 总结\n\n*   Java 支持 `private`、`default`、`protected`\
  \ 和 `public` 访问修饰符\n*   `private` 成员只能在定义的类中被访问\n*   `default` 成员在定义的类以及同一包的其他类中可访问\n\
  *   `protected` 成员在定义的包内及其子类中可访问\n*   `public` 成员随处可访问\n\n# 12 接口（Interfaces）\n\
  接口是一种 Java 结构，用于指定[类](https://en.wikipedia.org/wiki/Class_(computer_science)) 必须实现的行为。它通过指定不带方法体的方法来实现。\n\
  \n## 12.1 定义接口\n接口通过 `interface` 关键字定义![](img/image_rsrc3MS.jpg)\n\n*   第 3-7 行定义了一个\
  \ `Drawable` 接口\n*   第 3 行使用了 `interface` 关键字而不是 `class` 关键字\n*   第 5 行指定了一个抽象方法\
  \ `draw`\n*   抽象方法没有方法体，方法名后跟着一个分号\n\n### 12.1.2 实现接口\n接口需要由类来实现。实现接口的类需要为接口中的所有方法提供代码![](img/image_rsrc3MT.jpg)\n\
  \n*   第 3-10 行定义了一个 `Circle` 类\n*   第 5-8 行为 `draw` 方法提供了实现\n\n### 12.1.3 使用接口\n\
  接口不能通过 `new` 关键字实例化，它需要通过实现接口的类来使用![](img/image_rsrc3MU.jpg)\n\n*   第 3-12 行定义了一个\
  \ `ShapeDemo` 类\n*   第 7 行尝试通过 `new` 关键字实例化 `Drawable` 接口，这会导致错误。\n\n\n\n\n\n* 第\
  \ 9 行创建了一个名为 `circle` 的 `Circle` 对象\n* 第 12 行通过 `circle` 对象调用了 `draw` 方法\n* 第 14\
  \ 行定义了一个 `Drawable` 类型的变量 `shape`，但给它赋值了一个 `Circle` 对象\n* 这是有效的，且不会导致编译错误\n* 第 17\
  \ 行通过 `shape` 对象调用了 `draw` 方法，这也是有效的\n\n此代码打印以下输出：![](img/image_rsrc3MV.jpg)\n\n\
  ### 12.1.4 总结\n\n* `interface`（接口）指定了类需要实现的行为\n* `interface`（接口）通过 `interface` 关键字定义\n\
  * `class`（类）可以通过 `implements` 关键字实现 `interface`，并需要为接口中的所有方法提供代码\n* `Interfaces`（接口）无法通过\
  \ `new` 关键字实例化\n* 接口类型的引用变量可以赋值为实现了该接口的类对象。这是 Java 实现运行时多态的另一种方式。\n* 多个类可以实现同一个接口，一个类也可以实现多个接口\n\
  \n# 13 异常处理\n\n异常处理（Exception Handling）是指 Java 处理代码执行过程中可能发生错误的机制。在这种情况下，Java 会创建一个异常（内置异常类的对象）并将其抛出。\n\
  \n## 13.1 默认处理器\n\n异常需要被捕获和处理。Java 拥有一个默认异常处理器，用于处理代码中未被显式处理的异常![](img/image_rsrc3MW.jpg)\n\
  \n* 第 7 行声明了一个名为 `numbers` 的整数数组\n* 第 9 行尝试访问位置 5 处的元素\n* 由于数组大小为 3，因此位置 5 处没有元素\n\
  * 此代码不会导致编译错误，因为在语法上它是正确的。\n\n此代码打印以下输出：![](img/image_rsrc3MX.jpg)\n\n#### 幕后发生了什么？\n\
  \n* 当 Java 运行时系统检测到尝试访问位置 9 的元素时，它会创建一个 `ArrayIndexOutOfBoundsException` 对象并将其抛出。\n\
  * `ArrayIndexOutOfBoundsException` 是 Java 的内置异常之一。\n* Java 的默认处理器捕获该异常并打印错误信息。\n\
  * 异常一旦发生，程序执行就会停止，因此第 11 行的 `Sysout` 语句不会执行。\n\n### 13.2 Try 和 catch\n\nJava 提供了\
  \ `try`/`catch` 关键字，用于在代码中显式地处理异常。\n\n#### 13.2.1 基础 Try Catch\n\n`try` 块允许指定需要监控异常的代码。`catch`\
  \ 块允许指定当发生异常时需要执行的代码![](img/image_rsrc3MY.jpg)\n\n* 第 7 行指定了 `try` 语句\n* 第 9-11\
  \ 行指定了需要监控异常的代码\n* 第 13-16 行指定了一个处理 `ArrayIndexOutOfBoundsException` 的 `catch` 块\n\
  * `e` 是 `ArrayIndexOutOfBoundsException`  的一个对象，它有多个方法可以提供有关异常的额外信息\n* `catch` 块简单地指定了第\
  \ 15 行的一条 `Sysout` 语句，用于打印详细的错误信息\n\n此代码打印以下输出：![](img/image_rsrc3MZ.jpg)\n\n####\
  \ 幕后发生了什么？\n\n* 一旦执行第 10 行，Java 运行时系统就会创建并抛出 `ArrayIndexOutOfBoundsException`。\n\
  * 异常对象将与第 13 行 `catch` 块中指定的异常类型（即 `ArrayIndexOutOfBoundsException`）进行比较。\n* 由于匹配成功，执行第\
  \ 15 行 `catch` 块中的代码。\n\n#### 13.2.2 多个 Catch 块\n\n在 `try` 块之后可以指定任意数量的 `catch`\
  \ 块来处理不同类型的错误![](img/image_rsrc3N0.jpg)\n\n* 第 8-13 行指定了 `try` 块中的某些代码\n* 第 9 行访问\
  \ `numbers[2]`，这是一个有效的数组位置\n* 第 12 行将 `value` 除以 0\n* 在算术除法中除以 0 是无效的，因此第 12 行导致了\
  \ `ArithmeticException`\n* 第 14-16 行指定了一个处理 `ArrayIndexOutOfBoundsException` 的 `catch`\
  \ 块\n* 第 17-19 行指定了一个处理 `ArithmeticException` 的 `catch` 块\n\n此代码打印以下输出：![](img/image_rsrc3N1.jpg)\n\
  \n#### 幕后发生了什么？\n\n* 当执行第 10 行时，Java 运行时系统创建并抛出 `ArithmeticException`。\n* 它与每个 `catch`\
  \ 块中指定的异常相匹配。\n* 第 14 行的 `catch` 块被跳过，因为它处理的是 `ArrayIndexOutOfBoundsException`。\n\
  * 第 17 行 `catch` 块中的代码被执行，因为它处理的是 `ArithmeticException`。\n\n#### 13.2.3 无异常的 Try\n\
  \n如果没有发生异常，则 `catch` 块中的代码将不会执行![](img/image_rsrc3N2.jpg)\n\n* 第 6 行指定了 `try` 语句\n\
  * 第 8-10 行指定了需要监控异常的代码\n* 第 12-14 行指定了一个处理 `ArrayIndexOutOfBoundsException` 的 `catch`\
  \ 块\n\n此代码打印以下输出：![](img/image_rsrc3N3.jpg)\n\n#### 幕后发生了什么？\n\n* 第 9 行访问 `numbers[1]`，这是一个有效的数组位置\n\
  * 由于 `try` 块中的代码没有抛出异常，因此 `catch` 块不会执行。\n\n## 13.3 Finally\n\n`finally` 块可以指定无论发生什么异常都需要执行的代码。\n\
  \n#### 13.3.1 基础 Try Catch Finally\n\n`finally` 块位于 `try`/`catch` 块之后![](img/image_rsrc3N4.jpg)\n\
  \n* 第 6-13 行指定了 `try`/`catch` 块的代码\n* 第 13 行是 `finally` 块\n\n此代码打印以下输出：![](img/image_rsrc3N5.jpg)\n\
  \n#### 幕后发生了什么？\n\n* 一旦执行第 8 行，Java 运行时系统创建并抛出 `ArrayIndexOutOfBoundsException`\n\
  * `catch` 块处理该异常，随后执行第 13 行的 `finally` 块\n\n### 13.3.2 无异常的 Finally\n\n即使没有发生异常，`finally`\
  \ 块也会执行![](img/image_rsrc3N6.jpg)\n\n* 第 6-13 行指定了 `try`/`catch` 块的代码\n* 第 13 行指定了\
  \ `finally` 块\n\n此代码打印以下输出：![](img/image_rsrc3N7.jpg)\n\n#### 幕后发生了什么？\n\n* 第 8\
  \ 行没有导致异常，因此第 11 行的 `catch` 块不会执行，但第 13 行的 `finally` 块会执行。\n\n### 13.3.3 带异常的 Finally\n\
  \n即使没有 `catch` 块，`finally` 块也会执行![](img/image_rsrc3N8.jpg)\n\n* 第 6-10 行指定了 `try`\
  \ 块的代码\n* 第 10 行指定了 `finally` 块\n\n此代码打印以下输出：（此处无输出）\n\n#### 幕后发生了什么？\n\n* 执行第 8\
  \ 行时，抛出了 `ArrayIndexOutOfBoundsException`\n* 由于没有 `catch` 块，异常由默认处理器处理\n* 随后执行第\
  \ 10 行 `finally` 块中的代码\n\n## 13.4 Throw 关键字\n\n`throw` 关键字可用于显式地抛出异常![](img/image_rsrc3NA.jpg)\n\
  \n* 第 5-10 行指定了 `subtract` 方法\n* 第 7 行指定了一个 `throw` 语句\n* 它由 `throw` 关键字以及通过构造函数创建的\
  \ `IllegalArgumentException` 对象组成\n* 第 12-21 行指定了 `main` 方法\n* 第 15 行在 `try`/`catch`\
  \ 块中带参数 5,10 调用 `subtract`\n\n此代码打印以下输出：![](img/image_rsrc3NB.jpg)\n\n#### 幕后发生了什么？\n\
  \n* 当执行第 6 行时，检查条件 `a < b`，如果真则执行第 7 行\n* 第 7 行创建一个新的 `IllegalArgumentException`\
  \ 对象并通过 `throw` 关键字将其抛出\n* 由于 `main` 调用了 `subtract`，异常对象被传递给 `main` 并由第 17 行的 `catch`\
  \ 块处理。\n\n## 13.5 Throws 关键字\n\n`throws` 关键字用于指定某个方法会抛出异常但不处理它![](img/image_rsrc3NC.jpg)\n\
  \n* 第 5-9 行指定了 `divide` 方法\n\n\n\n\n\n* `throws` 子句在第 5 行的方法声明中被指定\n* 因此，第 5 行表示\
  \ `divide` 可以抛出 `ArithmeticException`\n* 第 12-21 行指定了一个 `main` 方法\n* 第 15 行在 `try/catch`\
  \ 块中用值 `10,0` 调用了 `divide`\n\n此代码打印出以下输出：![](img/image_rsrc3ND.jpg)\n\n## 幕后发生了什么？\n\
  \n* 当执行第 8 行时，会抛出一个 `ArithmeticException`，因为除以 `0` 是无效的\n* 由于 `main` 调用了 `divide`，异常对象将被传递给\
  \ `main`，并由第 16 行的 `catch` 块处理\n\n## 13.6 Java 的异常层次结构\nJava 在 `java.lang` 包中提供了许多内置异常。`java.lang.Throwable`\
  \ 是所有异常的父类。它有两个主要的子类：`java.lang.Error` 和 `java.lang.Exception`。\n\n### 13.6.1 Error\n\
  `java.lang.Error` 类表示由于某些异常情况（而非代码引起）发生的严重错误。因此，应用程序不需要捕获或处理此类错误。`java.lang.Error`\
  \ 类有几个子类，表示特定的错误，如 `VirtualMachineError`、`IOError`、`LinkageError` 等。\n\n### 13.6.2\
  \ Exception\n`java.lang.Exception` 类表示由于代码引起且应用程序可以捕获并处理的错误。异常分为以下两种类型：\n\n####\
  \ 未检查异常（Unchecked Exceptions）\n`Exception` 类有一个重要的子类，即 `java.lang.RuntimeException`。`RuntimeException`\
  \ 及其所有的子类都被称为未检查异常。这是因为编译器没有强制要求你处理此类异常。因此，即使编写了可能抛出未检查异常的代码，编译器也不会报错。未检查异常的示例包括\
  \ `ArithmeticException`、`ArrayIndexOutOfBoundsException` 等。\n\n#### 已检查异常（Checked\
  \ Exceptions）\n除 `RuntimeException` 之外的所有 `Exception` 子类被称为已检查异常。这是因为这些异常是由编译器检查的。因此，如果你编写了可能导致已检查异常的代码，而异常没有被捕获、处理或在\
  \ `throws` 子句中声明，则会发生编译错误。已检查异常的示例包括 `IOException`、`AWTException` 等。\n\n## 13.7\
  \ 总结\n\n* 当执行代码时发生某些错误，Java 会创建一个适当 `Exception` 类的对象并抛出它\n* 有一个默认的异常处理器来处理异常并显示错误信息\n\
  * `try/catch` 关键字允许在代码中处理异常。它们为代码提供了从异常中恢复的机会\n* `finally` 块可以用于放置始终需要执行的代码，无论是否发生异常\n\
  * `throw` 关键字可以显式地抛出异常\n* `throws` 关键字用于指定某个方法会抛出异常但不处理它\n* `Exception` 对象有几个方法，可以提供有关异常的信息\n\
