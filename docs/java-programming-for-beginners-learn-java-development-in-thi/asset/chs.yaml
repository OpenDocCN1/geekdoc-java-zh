  \n#### 背后发生了什么？\n\n* 执行第 17 行时，控制权转移到第 10 行的构造函数\n* 构造函数中的代码（第 11-12 行）被执行\n* 之后，控制权转移到\
  \ `main` 方法，从第 19 行继续处理\n\n### 6.4.2 参数构造函数\n构造函数也可以像方法一样接受参数![](img/image_rsrc3K8.jpg)\n\
  \n* 第 9-12 行指定了一个接受 2 个参数（`inputName` 和 `inputPrice`）的构造函数\n* 第 10-11 行将传入的值赋值给实例字段\
  \ `name` 和 `price`\n* 第 16 行创建了一个名为 `Television` 且价格为 `400.50` 的新 `Product`\n\n\
  这段代码输出以下输出![](img/image_rsrc3K7.jpg)\n\n#### 背后发生了什么？\n\n* 执行第 16 行时，调用了第 9 行的构造函数，参数为\
  \ `Television` 和 `400.50`\n\n### 6.4.3 总结\n* 构造函数在创建对象时被自动调用\n* 不接受任何参数的构造函数是默认构造函数\n\
  * 如果没有默认构造函数，Java 会自动添加一个\n* 构造可以选择接受一个或多个参数\n\n## 6.5 this\n`this` 关键字引用当前对象![](img/image_rsrc3K9.jpg)\n\
  \n* 第 9-12 行根据传入的值初始化实例字段\n* 第 10-11 行使用 `this`\n* `this.name` 指向当前对象的字段\n* `this.price`\
  \ 指向当前对象的字段\n\n## 6.6 方法重载\n方法重载允许一个类拥有多个同名但参数不同的方法\n\n### 6.6.1 无方法重载的情况\n如果没有方法重载，你必须为相同的功能创建不同名字![](img/image_rsrc3KA.jpg)\n\
  \n* 第 5 行定义 `addTwoIntegers` 方法，接受两个整数值并返回它们的和\n* 第 10 行定义 `addThreeIntegers` 方法，接受三个整数值并返回它们的和\n\
  * 第 15 行定义 `addTwoDoubles` 方法，接受两个双精度值并返回它们的和\n* 尽管三个方法都执行加法，但它们的名称不同，这使得代码难以阅读\n\
  \n### 6.6.2 定义重载方法\n重载方法通过定义同名但参数数量/类型不同的方法来实现![](img/image_rsrc3KB.jpg)\n\n* 现在，`Calculator`\
  \ 类拥有 3 个名为 `add` 的方法\n* 第 5 行定义接受 2 个整数参数的 `add` 方法\n* 第 10 行定义接受 3 个整数参数的 `add`\
  \ 方法\n* 第 15 行定义接受 2 个双精度参数的 `add` 方法\n* 因此，`add` 方法被重载了 3 次\n\n### 6.6.3 调用重载方法\n\
  当调用重载方法时，Java 根据传入的参数将调用委托给相应的方法版本。image_rsrc3KC.jpg\n\n* 第 24 行使用两个整数值调用 `add`\
  \ 方法\n* 第 27 行使用三个整数值调用 `add` 方法\n* 第 30 行使用两个双精度值调用 `add` 方法\n\n这段代码输出以下输出:image_rsrc3KD.jpg\
  \ \n\n#### 背后发生了什么？\n\n* 执行第 24 行时，参数的数量/类型将与 `Calculator` 类中的每个 `add` 方法进行匹配\n\
  * 由于第 24 行传递了两个整数值，它匹配到了第 5 行的 `add` 方法并被执行\n* 同样，当执行第 27 行时，它匹配到了第 10 行的方法\n\n\n\
  \n\n\n* 所以，当执行第 30 行时，它匹配到了第 15 行的 `add` 方法。\n\n### 6.6.4 总结\n\n* 方法重载是一项功能，允许一个类拥有多个同名但参数数量或类型不同的方法。\n\
  * Java 根据参数的数量的数量或类型来决定调用哪个重载方法。\n* 方法不能根据返回类型进行重载。因此，如果多个方法具有相同的参数数量/类型但不同的返回类型，将发生编译错误。\n\
  * 构造函数也可以被重载。\n\n# 7 静态关键字 static \n`static` 关键字将成员与类本身相关联。可以在不创建类对象的情况下访问静态成员。\n\
  \n## 7.1 静态字段\n可以通过在声明中使用 `static` 关键字将字段设为静态的。\n\n### 7.1.1 定义静态字段\n当一个字段被设为静态时，该类的所有对象中只存在该字段的一个拷贝![](img/image_rsrc3KE.jpg)\n\
  \n* 第 5 行指定了一个名为 `field1` 的静态字段\n* 第 7 行指定了一个名为 `field2` 的实例字段\n* 所以，`DemoClass`\
  \ 的所有对象将引用 `field1` 的同一个拷贝，但将拥有各自的 `field2` 拷贝\n\n### 7.1.2 访问静态字段\n可以通过类名加点操作符访问静态字段。也可以通过对象访问![](img/image_rsrc3KF.jpg)\n\
  \n* 第 9-20 行指定了 `DemoClass` 中的 `main` 方法\n* 第 11 行通过类名 `DemoClass` 访问静态字段 `field1`\n\
  * 第 13 行通过类名从 `DemoClass` 访问实例字段 `field2`，这会导致编译错误\n* 第 15 行创建了 `DemoClass` 的 `demoObject`\
  \ 对象\n* 第 16 行通过 `demoObject` 访问实例字段 `field2`，这可以正常工作\n* 第 18 行通过 `demoObject` 访问静态字段\
  \ `field1`，这也可以正常工作\n\n**幕后发生了什么？**\n\n* 第 11 行运行正常，因为静态字段可以通过类名访问\n* 第 13 行导致了编译错误，因为实例字段无法通过类名访问\n\
  * 第 16 行和 18 行运行正常，因为静态和实例字段都可以通过对象访问\n\n## 7.2 静态方法\n与字段一样，方法可以通过 `static` 关键字设为静态的，并通过类名访问![](img/image_rsrc3KG.jpg)\n\
  \n* 第 9-11 行指定了一个名为 `myMethod` 的静态方法\n* 第 13-17 行指定了 `main` 方法\n* 第 15 行通过类名调用了\
  \ `myMethod`\n\n这段代码打印以下输出![](img/image_rsrc3KH.jpg)\n\n**幕后发生了什么？**\n\n* 当执行第 15\
  \ 行时，调用了方法 `myMethod`，而无需创建 `DemoClass` 的对象\n\n**静态方法的规则**\n\n* 静态方法只能访问静态字段，不能访问实例字段\n\
  * 静态方法只能调用静态方法，不能访问实例方法\n\n## 7.3 静态块\n除了字段和方法外，代码块也可以声明为 `static`。此类代码在任何其他代码执行之前只会执行一次![](img/image_rsrc3KJ.jpg)\n\
  \n* 第 8-11 行指定了一个静态代码块\n* 第 10 行初始化了静态字段 `field1`\n* 第 13-16 行指定了 `main` 方法\n\n\
  这段代码打印以下输出![](img/image_rsrc3KK.jpg)\n\n**幕后发生了什么？**\n\n* 当 Java 类加载时，执行第 8 行的静态块\n\
  * 随后，执行第 13 行的 `main` 方法\n\n**静态块的规则**\n\n* 静态块只能访问静态字段，不能访问实例字段\n* 静态块只能调用静态方法，不能访问实例方法\n\
  \n## 7.4 总结\n\n* `static` 关键字将字段或方法与类本身相关联\n* 静态成员可以通过类名访问，也可以通过类的对象访问\n* 静态字段类似于全局变量，在所有对象中只存在该字段的一个拷贝\n\
  * 除了字段和方法外，代码块也可以被设为静态的\n* 静态成员最常见的例子是 `main()`\n* 由于 `main()` 是静态的，JVM 可以调用它而不需要创建类的对象。\n\
  \n# 8 继承\n继承允许类从另一个类继承字段和方法，从而创建一个专门的类。这有助于代码的复用。\n\n## 8.1 子类\n子类是通用类的特化。\n\n###\
  \ 8.1.1 定义父类\n被继承的类被称为基类或父类![](img/image_rsrc3KM.jpg)\n\n* `Product` 是一个普通类\n* 它拥有对应于\
  \ `name` 和 `price` 的字段\n* 它有一个名为 `printNameAndPrice` 的方法\n\n### 8.1.2 定义子类\n继承基类并添加自身特定内容的类被称为子类![](img/image_rsrc3KN.jpg)\n\
  \n* 第 6-14 行定义了一个 `ElectronicProduct` 类\n* 第 3 行中，类名后跟着关键字 `extends`，然后是 `Product`\n\
  * 所以，这表示 `ElectronicProduct` 是 `Product` 的子类\n* `ElectronicProduct` 拥有字段 `warrantyInYears`\
  \ 和方法 `printWarranty`\n* 所以 `ElectronicProduct` 是 `Product` 的特化版本\n* 就像 `ElectronicProduct`\
  \ 一样，我们可以创建其他子类，如 `FoodProduct`、`ApparelProduct` 等。\n\n### 8.1.3 访问父类成员\n子类可以访问父类的非私有成员![](img/image_rsrc3KP.jpg)\n\
  \n* 第 3-19 行定义了一个 `ProductDemo` 类\n* 第 7 行创建了一个 `ElectronicProduct` 对象\n* 第 9-10\
  \ 行通过 `eProduct` 初始化 `name` 和 `price` 字段\n* 第 11 行通过 `eProduct` 调用 `printNameAndPrice`\n\
  * 第 13 行通过 `ElectronicProduct` 初始化 `warrantyInYears` 字段\n* 第 14 行通过 `ElectronicProduct`\
  \ 调用 `printWarranty`\n\n这段代码打印以下输出![](img/image_rsrc3KR.jpg)\n\n**幕后发生了什么？**\n\n\
  * 当执行第 7 行时，它创建了特化的 `ElectronicProduct`\n* 第 9-11 行通过 `ElectronicProduct` 访问基类的字段和方法\n\
  \n### 8.1.4 总结\n\n* 基类是普通类，子类是基类的特化\n* 可以通过 `extends` 关键字加上基类来创建子类\n* 一个类可以有多个子类\n\
  * 一个类不能继承多个类\n* 继承有助于代码复用，因此公共字段和方法不需要在每个子类中重复\n\n## 8.2 中的构造函数\n与普通类一样，构造函数也可以存在于继承层次的类中。\n\
  \n### 8.2.1 构造函数调用\n当创建子类对象时，它会隐式地调用父类的构造函数![](img/image_rsrc3KS.jpg)[](image_rsrc3KT.jpg)\n\
  \n* 第 3-9 行定义了 `Product` 类\n* 第 5-7 行指定了 `Product` 构造函数\n* 第 12-22 行定义了 `ElectronicProduct`\
  \ 类\n* 第 14-16 行指定了 `ElectronicProduct` 构造函数\n* 第 20 行在 `main` 方法中创建了一个 `ElectronicProduct`\
  \ 对象\n\n这段代码打印以下输出![](img/image_rsrc3KU.jpg)\n\n**幕后发生了什么？**\n\n* 当执行第 20 行时，控制转移到第\
  \ 5 行的 `Product` 构造函数\n* 当 `Product` 构造函数完成后，控制转移到第 14 行的 `ElectronicProduct` 构造函数\n\
  \n### 8.2.2 总结\n\n* 当创建子类对象时，它会隐式地调用基类的构造函数。\n* 如下一节所示，也可以通过 `super` 关键字显式调用父类构造函数。\n\
  \n## 8.3 super 关键字\n`super` 关键字用于从子类访问父类的成员。\n\n### 8.3.1 访问父类成员\n可以在子类中使用 `super`\
  \ 关键字来访问父类的实例字段和方法![](img/image_rsrc3KV.jpg)[](image_rsrc3KW.jpg)\n\n\n\n\n\n* 第\
  \ 3-7 行定义了一个 `Product` 类，包含 `name` 和 `price` 实例字段以及一个 `printPriceWith10PercentDiscount`\
  \ 方法。\n* 第 16-40 行定义了一个 `ElectronicProduct` 类。\n* 第 20-29 行定义了一个 `printDetails`\
  \ 方法。\n* 第 22-23 行通过 `super` 关键字访问基类字段 `name` 和 `price`。\n* 第 27 行通过 `super` 关键字访问基类方法\
  \ `printPriceWith10PercentDiscount`。\n* 第 30-38 行定义了一个 `main` 方法，该方法调用了 `printDetails`\
  \ 方法。\n\n此代码打印以下输出：![](img/image_rsrc3KX.jpg)\n\n幕后发生了什么？\n\n* 当执行第 24 行时，会调用 `printDetails`\
  \ 方法，该方法通过 `super` 关键字访问了超类的字段和方法。\n\n### 8.3.2 调度父类构造函数\n`super` 关键字也可以用于子类构造函数，以调用父类构造函数\
  \ ![](img/image_rsrc3KY.jpg)![](img/image_rsrc3KZ.jpg)\n\n* 第 3-14 行定义了 `Product`\
  \ 类。\n* 第 8-12 行指定了一个 `Product` 构造函数，它接受参数并初始化实例字段。\n* 第 16-35 行定义了一个 `ElectronicProduct`\
  \ 类。\n* 第 20-27 行定义了一个 `ElectronicProduct` 构造函数。\n* 第 22 行通过 `super` 关键字显式调用了 `Product`\
  \ 构造函数。\n* `super` 的调用必须是子类构造函数中的第一个语句（如第 22 行），否则将发生编译错误。\n* 由于 `Product` 构造函数接受\
  \ `name` 和 `price` 作为参数，这些参数通过 `super` 传递，但 `super` 也可以用于调用不带参数的构造函数。\n* 第 17-22\
  \ 行定义了一个 `main` 方法，该方法创建一个 `ElectronicProduct` 对象。\n\n此代码打印以下输出：![](img/image_rsrc3M0.jpg)\n\
  \n幕后发生了什么？\n\n* 当执行第 19 行时，控制权转移到第 7 行的 `ElectronicProduct` 构造函数。\n* 这首先通过 `super`\
  \ 关键字显式调用了 `Product` 构造函数，并在第 9 行传入了 `name` 和 `price` 字段。\n* 之后，执行 `ElectronicProduct`\
  \ 构造函数中的代码。\n\n### 8.3.3 总结\n\n* `super` 关键字可以从子类内部用于访问超类的实例字段、方法或构造函数。\n* 对于实例字段和方法，`super`\
  \ 关键字是冗余的，因为非私有的超类成员可以在子类中直接访问。\n* 只有当基类中具有同名的成员时，`super` 关键字在访问类成员时才有用。\n\n## 8.4\
  \ 方法重写\n当子类拥有与父类中相同的方法时，就会发生方法重写。它允许子类为父类方法提供不同的实现。\n\n#### 8.4.1 定义重写方法\n为了定义被重写的方法，子类应该拥有一个与父类中方法名称、参数数量和类型相同的方法![](img/image_rsrc3M1.jpg)![](img/image_rsrc3M2.jpg)\n\
  \n* 第 3-9 行定义了 `Product` 类。\n* 第 5-7 行定义了一个 `printInfo` 方法，打印关于 `Product` 的某些细节。\n\
  * 第 11-17 行定义了一个 `ElectronicProduct` 类，它是 `Product` 的子类。\n* 第 13-15 行定义了一个 `printInfo`\
  \ 方法，打印关于 `ElectronicProduct` 的某些细节。\n* `ElectronicProduct` 中的 `printInfo` 方法重写了\
  \ `Product` 中的 `printInfo` 方法。\n\n### 8.4.2 调用重写方法\n被重写的方法可以像任何其他方法一样正常调用![](img/image_rsrc3M3.jpg)\n\
  \n* 第 3-14 行指定了一个 `ProductDemo` 类。\n* 第 5-12 行指定了一个 `main` 方法。\n* 第 7-8 行创建一个 `Product`\
  \ 对象并调用 `printInfo` 方法。\n* 第 10-11 行创建一个 `ElectronicProduct` 对象并调用 `printInfo` 方法。\n\
  \n此代码打印以下输出：![](img/image_rsrc3M4.jpg)\n\n幕后发生了什么？\n\n* 当执行第 8 行时，使用 `Product` 对象调用\
  \ `printInfo` 方法，因此执行了 `Product` 类中的代码。\n* 当执行第 11 行时，使用 `ElectronicProduct` 对象调用\
  \ `printInfo` 方法，因此执行了 `ElectronicProduct` 类中的代码。\n\n### 8.4.3 运行时多态\n方法重写可以实现运行时多态，这是\
  \ Java 的一个强大特性![](img/image_rsrc3M5.jpg)\n\n* 第 7 行声明了一个类型为 `Product` 的变量 `product`。\n\
  * 第 9 行创建一个类型为 `ElectronicProduct` 的对象 `eProduct`。\n* 第 11 行将 `eproduct` 赋值给 `product`。\n\
  * 这是允许的，且不会引起编译错误。\n* 第 13 行在 `product` 对象上调用 `printInfo` 方法。\n* 这导致调用了 `ElectronicProduct`\
  \ 类中的 `printInfo` 方法。\n\n此代码打印以下输出：![](img/image_rsrc3M6.jpg)\n\n幕后发生了什么？\n\n* 11\
  \ 行将子类对象（`ElectronicProduct`）赋值给父类变量（`Product`）。\n* 当执行 11 行时，将子类对象赋值给父类变量。\n* 由于\
  \ `product` 被赋值为 `ElectronicProduct`，因此执行了该类的 `printInfo` 方法。\n\n### 8.4.4 总结\n\n\
  * 方法重写发生在子类拥有与父类相同的方法时。\n* 方法重写用于实现运行时多态。\n* 在运行时多态中，Java 根据赋值的对象来决定方法。\n\n# 9 final\
  \ 关键字\n`final` 关键字可以用于方法或实例字段。\n\n## 9.1 final 方法\n当 `final` 关键字用于方法时，它可以防止方法被重写![](img/image_rsrc3M7.jpg)![](img/image_rsrc3M8.jpg)\n\
  \n* 第 3-9 行定义了 `Product` 类。\n* 第 5-7 行定义了 `printInfo` 方法。\n* 第 11-17 行定义了 `ElectronicProduct`\
  \ 类，它是 `Product` 的子类。\n* 第 13-15 行定义了 `printInfo` 方法。\n* 由于 `printInfo` 是 `final`，第\
  \ 13 行会导致错误。\n\n## 9.2 final 字段\n当 `final` 关键字用于字段时，它可以防止字段被修改![](img/image_rsrc3M9.jpg)\n\
  \n* 第 7 行声明了一个 final 字段 `num` 并初始化为 10。\n* 第 9 行尝试将 `num` 更新为 20，会导致错误。\n* 由于 final\
  \ 变量不可修改，它必须在声明时初始化。\n\n## 9.3 总结\n* `final` 关键字可以用于方法和字段。\n* `final` 方法不能被重写。\n\
  * `final` 字段在声明后不能被修改。\n\n# 10 包与导入\n包有助于将一组 Java 文件组合在一起。导入用于包含包中定义的类和接口。\n\n##\
  \ 10.1 定义包\n`package` 语句可以用于定义包![](img/image_rsrc3MA.jpg)\n\n* 第 2-6 行指定了一个名为 `ClassA`\
  \ 的类。\n* 第 2 行是 `package` 语句。\n* 它由 `package` 关键字后跟包名 `mypackage` 组成。\n\n包的规则\n\n\
  * 当类在包内定义时，该类的 `.java` 文件必须存在于与包同名的目录中。如果你如所示通过 Eclipse 创建包](#part0003.xhtml_a3GH)，Eclipse\
  \ 会自动为你完成。\n* 包可以是分级的。层次结构中的每个包名应通过点分隔。例如：`package1.package2.package3`。\n* 分级包结构也需要目录结构。因此，对于包\
  \ `package1.package2`，`package1` 需要一个名为 `package2` 的文件夹。\n\n## 10.2 导入包\n包中的类在另一个包中使用之前需要导入。为了导入类或包，应该使用\
  \ `import` 关键字![](img/image_rsrc3MB.jpg)\n\n* 第 1-13 行指定了 `demo.package2` 包中的类 `ClassB`。\n\
  * 第 3 行是 `import` 语句。\n* 它由 `import` 关键字后跟全限定类名（包名后跟类名）组成。\n\n\n\n\n\n除了导入单个类外，你还可以导入整个包。这会导入包中的所有类。要导入一个包，应该在\
  \ `import` 关键字后跟包名，然后是一个点 `.`，最后是通配符符号 (`*`)。例如：`import mypackage.*`\n\n## 10.3\
  \ 总结\n\n*   包（Packages）用于在逻辑上将相关的类组合在一起\n*   一个包中可以有多个类\n*   要访问包外部的类，需要通过 `import`\
  \ 语句进行导入\n\n# 11 访问修饰符\n访问修饰符是一些控制对类成员（实例字段或方法）访问权限的关键字。\n\n## 11.1 Private（私有）\n\
  私有成员只能在定义它的类中被访问，不能在类外部被访问。\n\n### 11.1.1 定义私有字段\n可以通过在声明中使用 `private` 关键字将字段设为私有。![](img/image_rsrc3MC.jpg)\n\
  \n*   第 3-14 行定义了一个 `Product` 类\n*   第 5 行定义的 `name` 字段具有 `private` 访问修饰符\n\n###\
