    # 9.3 ABOUT FXML


    This chapter has provided a brief introduction to FXML, and although there is
    more to explain, the above should be sufficient to use FXML in practice. The question
    is then what is gained from using FXML and there are two purposes:


    +   1. to separate the design/definition of the user interface from the Java code

    2. to make it easier to develop complex user interfaces


    The first follows immediately from the separation of the code for a window in
    an XML part and a controller with the Java code. In principle, it is good, but
    it requires learning FXML, and although NetBeans provides good support, there
    is still a lot to learn, and in my opinion, it is at least as easy to write the
    user interface in Java as in FXML. The separation of the code can easily achieved
    by moving the code to event handlers in their classes in a controller layer. The
    conclusion is that I do not find the gains in using FXML, and in fact, I feel
    that the forces are better used by learning JavaFX in detail than using the power
    to get good at FXML. It is my opinion and it is not necessarily true and I know
    that others look different. Therefore, there is only to say, to try and gain your
    own experiences.

    According to what I''ve mentioned above, FXML does not make it easier to write
    the user interfaces, but it is when using a tool. There is a program called Scene
