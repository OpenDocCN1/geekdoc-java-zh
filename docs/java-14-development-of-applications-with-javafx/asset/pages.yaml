    # 3.3 SHAPE PROPERTIES


    The above has primarily concerned the shape of figures like straight lines, rectangles,
    circles, and more, but there are also other properties attached to shapes, including
    how they are filled and how the perimeter is drawn. This section will discuss
    the most important of these features.


    The perimeter – which is a line / curve – can be drawn in three ways:


    +   1. Stroke.CENTERED, which is default and means the perimeter is drawn so that
    the edge of the shape is exactly the center of the perimeter line.

    2. StrokeType.INSIDE, where the perimeter is drawn as it falls inside the shape.

    3. StrokeType.OUTSIDE, where the perimeter is drawn outside the shape.


    The program StrokeProgram opens the following window, which illustrates the three
    ways to draw the perimeter and where the first is the default:


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_36_0.png)


