    I have previously argued that in this place you should conduct a code review,
    inspecting the

    code, adding comments, removing disabilities, and more. This code review often
    has character

    a a refactoring, which may result in code being moved to new classes or reorganizing
    the

    code in another way. Especially if the program is developed through many small
    iterations\with the character of prototyping in this case, there is a great risk
    that it may go beyond

    the architecture, and in particular there is a risk that the main window swells

    up and becomes inappropriately design. For the sake of future maintenance, therefore,

    refactoring is important, and you should focus on the following:


    +   - If there are import statements that are no longer necessary (NetBeans shows
    which

    ones), they should be removed.

    - If there are variables that are no longer used, they should also be deleted.

    - If there is code (such as methods) that are not used, it should be removed.

    - Have instance variables and methods appropriate names. If not, consider changing

    the so that they better reflect the use.

    - Consider visibility, only what it is going to be public is public while the
    rest is

    private and possibly protected.


