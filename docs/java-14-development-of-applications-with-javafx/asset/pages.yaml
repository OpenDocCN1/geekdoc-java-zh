    # 5.3 LIGHT


    In the introduction to this chapter on effects, I have listed the different effects
    that you can apply, and I have here far from illustrating them all (and will not),
    but I want to conclude this chapter with a little about the effect light. The
    principle is that a light source shines on a figure, and the color of the figure
    is determined by the nature of the light source and its position in relation to
    the figure.


    Generally, you can associate a lighting effect to a figure with a Lighting object,
    and if you do not indicate a light source, a default light source is used, which
    corresponds to the light falling directly into the figure, resulting in a weak
    3D effect towards the edge. You can also explicitly indicate a light source, where
    there are three options:


    +   1. Light.Distant

    2. Light.Point

