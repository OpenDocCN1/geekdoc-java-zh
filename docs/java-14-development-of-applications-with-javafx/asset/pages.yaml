    }\n```\n\nand a class that implements this interface how to instantiate objects\
    \ of the type T. The class is used by a factory class that implements another\
    \ interface:\n\n```\npublic interface BuilderFactory\n{\n    public Builder<?>\
    \ getBuilder(Class<? > type);\n}\n```\n\nThe FXMLLoader uses a BuilderFactory\
    \ if it cannot create an object otherwise, and it happens calling the method getBuilder()\
    \ with the argument. If this method returns a Builder object, a FXMLLoader uses\
    \ this to initialize the required properties of the object to be instantiated\
    \ and eventually calls the method build() that returns the object. The builder\
    \ class must get and set methods for all the constructor’s parameters. In this\
    \ case, you must define a Builder for the class Person as follows:\n\n```\npackage\
    \ objectsfxml;\n\nimport javafx.util.*;\n\npublic class PersonBuilder implements\
