    # 6.1 ANIMATIONS


    In this section I introduce animations, which you also can perceive as a form
    of transformations of a node, and if you do it changing one or the properties
    of a node many times and do it at short intervals, it will seem to the user as
    if something is “alive” with that node. As described in Java 10, a node needs
    to be redrawn at short intervals, and such that the value of an option has been
    changed for each redraw. In JavaFX, this logic is encapsulated in a number of
    classes, where each class defines an animation for a particular value or property.
    The base class is called a Transition, but there are the following specific transitions:


    +   - FadeTransition

    - FillTransition

    - RotateTransition

    - ScaleTransition

    - StrokeTransition

    - TranslateTransition

    - PathTransition

    - SequentialTransition

    - PauseTransition

    - ParallelTransition'
