  md: '# JAVA 14: DEVELOPMENT OF APPLICATIONS

    WITH JAVFX: SOFTWARE DEVELOPMENT


    When an event occurs, one talks about an event dispatch chain, which is the route
    from the root

    stage to that node. Is it a Circle node, for example, it could be


    Stage – Scene – Group – Circle


    When an event occurs, it is sent to all nodes in its dispatch chain from top to
    bottom. When

    there is a node that has registered a filter for that event, this will be done,
    after which the

    event will be sent to its target node where it will be processed if there is an
    event handler.

    This phase is called the Event Capturing Phase. After that, the event will follow
    the way

    back, and for each node it will be processed if there is a handler assigned. This
    phase is

    called the Bubbling Phase. An event can thus result in multiple event handlers

    are performed and event handlers during the capturing phase are called filters
    while event

    handlers during the bubbling phase are called handlers.


    When an event follows the dispatch chain, it can at any time be stopped by the
    method

    consume(), which means that the event will not be forwarded in the chain. As an
    example,

    I will show a program EventPhaseProgram that creates the following scene graph:


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_93_0.png)'
