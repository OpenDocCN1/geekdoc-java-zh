  md: "# JAVA 14: DEVELOPMENT OF APPLICATIONS\nWITHJAVAFX: SOFTWARE DEVELOPMENT\n\n\
    has already said about colors. The next figure uses a linear gradient paint, which\
    \ is defined as follows:\n\n```\nprivate Paint createLinear(){\n    Stop[] stops\
    \ = new Stop[]{new Stop(0, Color.BLUE), new Stop(1, Color.RED)};n    return new\
    \ LinearGradient(0, 0, 1, 0, true, CycleMethod.NO_CYCLE, stops);\n}\n```\n\nA\
    \ linear gradient is defined by two or more colors, which are defined as objects\
    \ of the type. Each stop indicates a color and a position that can be relative\
    \ or absolute. The first stop is in this case and the position is 0, which means\
    \ that the color is the start color. The other color is red and the position is\
    \ 1, which means that the last color value must be red. All colors between these\
    \ extremes are blends of blue and red.\n\nThe LinearGradient parameters are the\
    \ starting position (0.0)) and the final position (1.0), and the next parameter\
    \ indicates that the coordinates must be interpreted relative (true) or absolute.\
    \ In this case, the coordinates indicate that they must be mixed along the x axis\
    \ from the left edge of the shape to the right edge of the shape. The next last\
    \ parameter indicates whether the pattern should be repeated if the coordinates\
    \ do not define the entire shape, and finally the last parameter is the color\
    \ stops.\n\nA radial gradient is defined in almost the same way:\n\n```\nprivate\
    \ Paint createRadial(){\n    Stop[] stops = new Stop[]{new Stop(0, Color.WHITE),\
    \ new Stop(0.2, Color.RED), new Stop(1, Color.BLUE);\n    return new RadialGradient(0,\
    \ 0, 0.6, 0.5, 1, true, CycleMethod.NO_CYCLE, stops);\n}\n```\n\nTwo, or more\
    \ color stops must be defined, and in this case three are defined. They say that\
    \ with a white color, and after 20% the color should be red for the last to be\
    \ blue. Parameters for a RadialGradient begins by defining a starting point, which\
    \ is the focus point and is the first stop. The first parameter is the distance\
    \ to the focus point. The next two parameters are the coordinates of the focus\
    \ point, while the next is the radius of a circle that defines the Paint object\
    \ is about. The last three parameters means the same as for a LinearGradient."
