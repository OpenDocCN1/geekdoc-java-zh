  md: '# ARCHITECTURE OF JAVFX


    JavaFX is a full API for creating GUI applications and consists of classes distributed
    on the following packages:


    +   1. javafx.animation

    2. javafx.application

    3. javafx.css

    4. javafx.event

    5. javafx.geometry

    6. javafx.stage

    7. javafx.scene


    where the latter has more sub packages. A JavaFX program consists as mentioned
    of a scene graph, which is a tree containing nodes that may be


    +   - geometrical objects, that can be 2D and 3D objects, as Circle’s, Sphere’s
    and so on

    - UI controls, as Label, Button and so on

    - Containers, as StackPane, VBox, Group and more

    - Media elements, for images, audio and video


    Each node in a scene graph has a unique parent, except the root, which has no
    parent, and all nodes that do not have child nodes are called as mentioned for
    leaf nodes, while all other nodes are called branch nodes. The same node can only
    occur in the tree once, and each node may have defined effects, opacity, transforms,
    and event handlers.


    To render the graphics JavaFX uses OpenGL (on Linux systems), and as far as possible,
    use the graphics graph''s hardware accelerator with the result that JavaFX is
    highly effective in rendering graphics.


    As mentioned above, a JavaFX application is represented by a Stage object that
    contains all of the application''s objects, and the Stage object is created by
    the actual platform. A Stage object has a width and a height in addition to the
    content (the scene graph), and there are decorations as a title line and a frame.
    There are the following kind of Stage objects:'
