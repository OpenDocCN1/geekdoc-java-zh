  md: '# 1 INTRODUCTION


    In the books Java 2, Java 9 and primarily Java 10, I have dealt with how to write
    a standalone Java application with a graphical user interface. All of it has been
    based on Swing, which is an API that makes the necessary available through a comprehensive
    class library. There is nothing wrong with Swing, and it will be many years to
    come, among other things because there are a lot of programs based on Swing. However,
    there are alternatives and one of them is called JavaFX, as the new API for developing
    Java applications with a graphical user interface.


    JavaFX is introduced as an alternative to Swing, and it is especially for better
    graphics and other media used in the user interface. With JavaFX, it is easier
    to develop applications with a modern user interface and with all the possibilities
    that users expect and get used from web applications. However, it is important
    to emphasize that you can still use Swing components, and that all known facilities
    from Swing are still available.


    JavaFX is an alternative to Swing, but the idea actually originates from Wide
    Web, where you can design user interfaces using markup, and to a large extent
    you can design the applications user interface styles. The goal of this book is
    to show how to use JavaFX, and I will only look at the development of standalone
    applications, but the goal of JavaFX is also the development of the client side
    of web application, which means that a JavaFX application can be opened as


    +   4. a standalone desktop application

    5. with the Java Web Start technology

    6. as part of a web page


    For the time being, I will only look at the first option.


