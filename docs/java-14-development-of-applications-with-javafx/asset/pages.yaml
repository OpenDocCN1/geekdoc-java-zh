    # 3.4 SHAPE OPERATIONS


    In general, if you add two Shape objects to a Group and the two shapes overlap,
    then the shape added last will cover the part of the first shape that overlaps.
    The Shape class has three static methods


    +   - union()

    - intersect()

    - subtract()


    which all as parameters have two Shape objects and the methods combine these two
