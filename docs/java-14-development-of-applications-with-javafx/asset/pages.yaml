  md: '# 10 A FINAL EXAMPLE


    As the final example, I will use the same program as in the previous book, but
    with the difference that this program this should be a desktop application. This
    means that I can reuse the class library FunctionsLib, which implements the mathematical
    functions, as well as the classes for parsing and evaluating an expression can
    be reused. Therefore, I only have to implement the user interface. The aim of
    the program is, of course, to show an example of a JavaFX program, which is slightly
    larger than the examples that are otherwise shown in this book.


    The program must have the same features as in the previous book and should be
    basically used in the same way where the user enters a mathematical expression
    that the program then evaluates. Unlike the previous program, the program should
    have buttons for the mathematical functions where a button should do nothing but
    insert the function name in the input field of the expression. In the previous
    program you can save a value in a variable and the value can be inserted later
    in an expression. In the new version of the program you must be able to save an
    arbitrary expression so that you can insert an expression into an expression,
    and it should also be possible to save the program’s variables in a file.


    # 10.1 DEVELOPMENT


    The development of the program has been implemented as a form of prototyping,
    and in the following I will briefly describe how the development has been completed.
    From the start, I have planned the following iterations:


    +   1. First prototype

    2. Enhanced prototype

    3. Implements the square root and square function

    4. Implements Store and Recall

    5. Implements the other functions

    6. Implements Set Precision

    7. Implements the menu item Expressions

    8. Implements the File menu

    9. Implements missing features

    10. Styling the program

    11. Refactoring'
