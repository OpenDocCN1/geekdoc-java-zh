    # 3.1 SVG


    SVG 代表缩放矢量图形，在 JavaFX 中，通过字符串定义路径：


    - `M` 或 `m`：移动到（绝对或相对）。

    - `L` 或 `l`：画线（绝对或相对）。

    - `H` 或 `h`：水平线（绝对或相对）。

    - `V` 或 `v`：垂直线（绝对或相对）。

    - `C` 或 `c`：三次贝塞尔曲线（绝对或相对）。

    - `Q` 或 `q`：二次贝塞尔曲线（绝对或相对）。

    - `A` 或 `a`：圆弧（绝对或相对）。

    - `Z` 或 `z`：关闭路径。


