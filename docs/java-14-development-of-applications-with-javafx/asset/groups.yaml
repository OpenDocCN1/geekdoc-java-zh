    \n为了渲染图形，JavaFX 使用 OpenGL（在 Linux 系统上），并尽可能使用图形图的硬件加速器，结果是 JavaFX 在渲染图形方面非常高效。\n\
    \n如上所述，JavaFX 应用程序由 `Stage` 对象表示，它包含了应用程序的所有对象，`Stage` 对象由实际平台创建。`Stage` 对象除了内容（场景图）外还有宽度和高度，以及标题行和框架等装饰。有以下类型的\
    \ Stage 对象：\n\n- 有装饰的 (Decorated)\n- 无装饰的 (Undecorated)\n- 透明的 (Transparent)\n\
    - 统一的 (Unified)\n- 工具 (Utility)\n\n具体的对象将结合示例持续讨论。\n\n`Stage` 对象的的内容由 `Scene`\
    \ 对象表示，它定义了宽度、高度以及场景图。具体的节点将结合示例讨论，每种用途都有许多节点。此外，还有不同的分支节点，其中最的是 `Group` 节点，它主要是子节点的集合。其他示例是具有特定派生类的\
    \ `Pane` 节点，它们的作用与 Swing 中的布局管理器相同。所有特定节点都是类层次结构的一部分，并派生自以下类之一：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_19_0.png)\n\
