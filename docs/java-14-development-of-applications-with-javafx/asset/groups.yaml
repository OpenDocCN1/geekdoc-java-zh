    \nand clicking on the button it prints a message on the console. If you consider\
    \ the code, first notice that the class inherits Application, which means that\
    \ it is a JavaFX application. The class has a usual main() method as other Java\
    \ applications, and it starts by calling a static method launch() (in the class\
    \ Application). It basically performs the following:\n\n- 1. instantiates an object\
    \ of the class (here the class HelloFX)\n- 2. performs a method init(), which\
    \ in Application is an empty method\n- 3. performs a method start(), which in\
    \ Application is an empty method\n- 4. waiting until the program terminates, where\
    \ method stop(), as in Application is an empty method, is performed\n\nIf you\
    \ want an application to open a window, it usually happens to override the method\
    \ start() from the class Application, as is the case in the above example.\n\n\
    A JavaFX program basically consists of a Stage that contains a Scene object, which\
    \ again contains Node objects arranged in a tree. A Stage represents a window\
    \ and the primary Stage object is created by the runtime system and is set as\
    \ a parameter to the method start(), and in the example it has the name primaryStage.\
    \ A Scene object contains all of the window's objects organized into a tree graph.\
    \ The tree's elements are Node objects, and a node can be a branch node (which\
    \ has children) or a leaf node (which no children have). A node is a component\
    \ in the window and may, for example, be a button or an entry field.\n\nIn the\
    \ example above, the method start() begins by creating a button, which is a node.\
    \ The object is called btn, and attaching text to the button, an action is also\
