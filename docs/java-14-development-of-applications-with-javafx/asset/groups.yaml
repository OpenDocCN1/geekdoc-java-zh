    # 序言


    本书是软件开发系列书籍中的第 14 册，涉及 JavaFX。本书介绍了 JavaFX 作为 Swing 和 Java2D 的替代方案，因此重点讨论了如何在
    JavaFX 中处理 2D 图形，以及主要的组件和布局。其目标是让您能够快速使用 JavaFX 编写带有图形用户界面的程序。书中包含许多主题，特别是 JavaFX
    属性，本书未涵盖这些内容，这些主题将在后续书中讨论。JavaFX 旨在作为 Swing 的替代方案，特别适用于用户界面中更好的图形和其他媒体。通过 JavaFX，可以更容易开发出具有现代用户界面的应用程序，并满足用户期望从
    Web 应用程序中获得的所有可能。本书并不要求读者详细了解 Swing 和 Java2D，但假设读者具有开发图形界面程序的入门知识。


    正如这系列软件开发书籍的标题所示，本书的目标是教导读者如何在 Java 中开发应用程序。可以通过阅读相关主题和学习完整的程序来掌握，但最重要的是通过亲身实践从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者需要在其中编写与文中内容相对应的程序。该系列的所有书籍都围绕骨架构建，由文本、示例、练习和问题组成，且这些内容被放置在文中自然的位置。练习和问题的区别在于，练习侧重于对文中内容的重复，并且会准确描述需要做什么。


    正如标题所示，这系列软件开发书籍的目标是教导读者如何在 Java 中开发应用程序。


