    The method createCircle() is trivial, unless it is the method createTransition()
    that creates the transition. In this case, it is a FadeTransition, and the constructor
    tells the animation should take 2 seconds, and it is for a node that the animation
    should work on. Otherwise, the animation should change the value from 1 (not transparent)
    to 0 (total transparent). The next statement tells the animation to be repeated
    10 times and finally, after the animation is complete, the next one must go backwards.
    In start(), a Transition object is created and the statement


    ```

    trans.play();

    ```


    starts the animation.


