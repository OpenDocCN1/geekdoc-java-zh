    \ white;\n}\n.text-field {\n  -fx-border-width: 3;\n  -fx-border-color: blue;\n\
    }\n.border {\n  -fx-padding: 20;\n  -fx-border-style: solid inside;\n  -fx-border-width:\
    \ 5;\n  -fx-border-insets: 25;\n  -fx-border-radius: 5;\n  -fx-border-color: gray;\n\
    }\n```\n\nHere are three styles defined. In the same way as web pages, a style\
    \ is defined with a selector that starts with a point followed by the node on\
    \ the scene graph, which should have a style - but with the class name written\
    \ in lowercase. The first, therefore, defines a style for Button nodes. two attributes\
    \ are defined, and the difficulty is of course to know which attributes can be\
    \ specified, but in general, you can associate a style value with any of the class's\
    \ properties. Here is the syntax that if a property called backgroundColor, style\
    \ attribute is named -background-color. That is, if the name of an attribute consists\
    \ of two words, the one starting with a capital letter, it is all written in lowercase\
    \ letters and with a hyphen inserted between the words. The same syntax used for\
    \ a selector, and selectors for the class TextField is written as:\n\n```\n.text-field\n\
    ```\n\nYou can also have a custom selector, what the last style is an example\
    \ of. It defines a style for the gray frame in the window, and when you see the\
    \ individual attributes, it is easy enough to understand the meaning. In practice,\
    \ it is more difficult to find out what to write, and it is important to note\
    \ that NetBeans knows JavaFX style sheets and which attributes are available.\n\
