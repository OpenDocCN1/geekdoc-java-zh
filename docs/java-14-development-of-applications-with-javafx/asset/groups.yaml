    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_118_0.png)


    程序必须拥有按钮，以便你加载和保存本地文件的 HTML 文档。


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_118_1.png)


