    \ STYLING\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_133_0.png)\n\nThe CSS style\
    \ sheet is thus located in the folder /css as resources (again is located under\
    \ the /src directory). It is not a requirement, but can be recommended as the\
    \ file becomes part of the project's jar file. Then there is the code for the\
    \ above program:\n\n```java\npackage styleprogram;\n```\n\n```java\nimport javafx.application.Application;\n\
    import javafx.event.*;\nimport javafx.Scene;\nimport javafx.scene.control.*;\n\
    import javafx.scene.layout.*;\nimport javafx.stage.Stage;\nimport javafx.geometry.*;\n\
    ```\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_133_1.png)\n\n# JAVA 14: DEVELOPMENT\
    \ OF APPLICATIONS\nWITH JAVAFX: SOFTWARE DEVELOPMENT STYLING\n\n```java\npublic\
    \ class StyleProgram extends Application {\n    private TextField txtName;\n \
    \   private TextField txtJob;\n\n    @Override\n    public void start(Stage stage)\
    \ {\n        HBox commands = new HBox(10);\n        createButton(\"Save\", e ->\
    \ {new Alert(Alert.Type.INFORMATION, \"Object saved.\", ButtonType.CLOSE).show();});\n\
    \        createButton(\"Clear\", e -> { txtName.clear(); txtJob.clear(); });\n\
    \        commands.setAlignment(Pos.CENTER_RIGHT);\n        GridPane root = new\
    \ GridPane();\n        root.add(0, createLabel(\"Name\", \"-fx-font-size: 18;\
    \ -fx-text-fill: darkred\"));\n        txtName = createField(300);\n        root.add(1,\
    \ createLabel(\"Job\", \"-fx-font-size: 18; -fx-text-fill: darkgreen\"));\n  \
    \      txtJob = createField(300);\n        root.add(commands, 1, 2);\n       \
    \ root.setHgap(10);\n        root.setPadding(new Insets(20, 20, 20, 20));\n  \
    \      root.setStyleClass().add(\"border\");\n        Scene scene = new Scene(root);\n\
    \        scene.getStylesheets().add(\"resources/css/styles.css\");\n        stage.setTitle(\"\
    StyleProgram\");\n        stage.setScene(scene);\n        stage.show();\n    }\n\
    \n    private Label createLabel(String text, String style) {\n        Label label\
    \ = new Label(text);\n        label.setStyle(style);\n        return label;\n\
    \    }\n\n    private TextField createField(double width) {\n        TextField\
    \ field = new TextField();\n        field.setPrefWidth(width);\n        return\
    \ field;\n    }\n\n    private Button createButton(String text, EventHandler<ActionEvent>\
    \ handler) {\n        Button cmd = new Button(text);\n        cmd.setOnAction(handler);\n\
    \        return cmd;\n    }\n\n    public static void main(String[] args) {\n\
    \        launch(args);\n    }\n}\n```\n\nIt's a simple program where the components\
    \ are laid out using a GridPane. A style sheet can be assigned to a scene graph\
    \ or a branch node. In this case, it is assigned to the scene graph:\n\n```java\n\
    scene.getStylesheets().add(\"resources/css/styles.css\");\n```\n\nHere is used\
    \ a relative path to the style sheet, but you can of course specify an absolute\
    \ path. As result, all of the program's TextField and Button nodes (unless stated\
    \ otherwise) will apply the styles defined in the style sheet. The statement\n\
    \n```java\nroot.getStyleClass().add(\"border\");\n```\n\nsays that the GridPane\
    \ node should apply a style with the selector border, and the result is that the\
    \ gray frame appears.\n\nStyles also can be defined inline, as is the case with\
    \ the two Label controls. It certainly has its uses, but it is generally advisable\
    \ to define styles in a style sheet, as inline styles can only be changed in the\
    \ code.\n\nIf you in an application consider an attribute, its value can be determined\
    \ in several places, and the following list indicates which value has the highest\
    \ priority:\n\n1. inline (the highest priority)\n2. parent node\n3. scene graph\n\
    4. values assigned in the code (Java properties)\n5. default style sheet\n\nHere\
    \ you should especially note that styles have higher priority values assigned\
    \ to the usual way in the Java code. Also note the last option with the lowest\
    \ priority. If you do not specify something, the value of a property is determined\
    \ by a default style sheet.\n\n# EXERCISE 37\n\nYou must write an application\
