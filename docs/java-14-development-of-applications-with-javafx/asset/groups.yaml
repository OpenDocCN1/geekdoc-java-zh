    \n下面是 6 个人输入后的窗口。任务的一部分是找出使用了哪些控件以及如何将它们放在窗口中：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_22.png)\n\
    \n我加入 MITAS是因为\n我想要真正的责任感\n针对工程师和地质科学家的毕业生计划\nwww.discovermitas.com\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_22.png)\n\
    \n第6个月\n我在北海担任施工主管，提供建议并帮助工头解决问题\n\n真实的工作\n国际机会\n三次实习\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_23.png)\n\
    \n## 3 2D 形状\n\n在本章中，我将回顾如何在窗口中绘制几何形状，正如第1章的最后一个示例所示，它与 Java2D 几乎相同，只是使用了不同的类。几何形状是\
    \ `Shape2D` 类型的对象，因此是可以包含在场景图中的对象。通常有以下预定义的形状（节点）：\n\n- Line\n- Rectangle\n- Circle\n\
    - Ellipse\n- Polygon\n- Polyline\n- CubicCurve\n- QuadCurve\n- Arc\n\n此外，你还可以作为\
    \ `Path` 对象来定义通用曲线，它由以下类型的段组成：\n\n- Line\n- CubicCurve\n- QuadCurve\n- Arc\n\n\
    最后你可以定义一个类似 SVG Path 的形状。\n\n本章的目的是展示如何创建和应用上述几何形状，但不是回顾语法（这很多是你在 Java2D 中已知的内容），我将转而制定一系列练习，挑战主要是找出这些类型在\
    \ JavaFX 中被称为什么什么。\n\n"
