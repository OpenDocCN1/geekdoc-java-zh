    highly effective in rendering graphics.


    As mentioned above, a JavaFX application is represented by a Stage object that
    contains all of the application''s objects, and the Stage object is created by
    the actual platform. A Stage object has a width and a height in addition to the
    content (the scene graph), and there are decorations as a title line and a frame.
    There are the following kind of Stage objects:'
