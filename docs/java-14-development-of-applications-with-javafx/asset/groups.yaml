    \ new LinearGradient(0, 0, 1, 0, true, CycleMethod.NO_CYCLE, stops);\n}\n```\n\
    \nA linear gradient is defined by two or more colors, which are defined as objects\
    \ of the type. Each stop indicates a color and a position that can be relative\
    \ or absolute. The first stop is in this case and the position is 0, which means\
    \ that the color is the start color. The other color is red and the position is\
    \ 1, which means that the last color value must be red. All colors between these\
    \ extremes are blends of blue and red.\n\nThe LinearGradient parameters are the\
    \ starting position (0.0)) and the final position (1.0), and the next parameter\
    \ indicates that the coordinates must be interpreted relative (true) or absolute.\
    \ In this case, the coordinates indicate that they must be mixed along the x axis\
    \ from the left edge of the shape to the right edge of the shape. The next last\
    \ parameter indicates whether the pattern should be repeated if the coordinates\
    \ do not define the entire shape, and finally the last parameter is the color\
    \ stops.\n\nA radial gradient is defined in almost the same way:\n\n```\nprivate\
    \ Paint createRadial(){\n    Stop[] stops = new Stop[]{new Stop(0, Color.WHITE),\
    \ new Stop(0.2, Color.RED), new Stop(1, Color.BLUE);\n    return new RadialGradient(0,\
    \ 0, 0.6, 0.5, 1, true, CycleMethod.NO_CYCLE, stops);\n}\n```\n\nTwo, or more\
    \ color stops must be defined, and in this case three are defined. They say that\
    \ with a white color, and after 20% the color should be red for the last to be\
    \ blue. Parameters for a RadialGradient begins by defining a starting point, which\
    \ is the focus point and is the first stop. The first parameter is the distance\
    \ to the focus point. The next two parameters are the coordinates of the focus\
    \ point, while the next is the radius of a circle that defines the Paint object\
    \ is about. The last three parameters means the same as for a LinearGradient."
- md: "\n# JAVA 14: DEVELOPMENT OF APPLICATIONS WITH JAVAFX: SOFTWARE DEVELOPMENT\n\
    \nFinally, there is an ImagePattern, which is a Paint object that draws an image.\
    \ In the program's start() method an image (Bean.png) is loaded as an Image object.\
    \ This image can then be used to create an ImagePattern object:\n\n```java\nprivate\
    \ Paint createImage()\n{\n    return new ImagePattern(image, 0, 0, 48, 48, false);\n\
    }\n```\n\nIn addition to the image, the parameters are the starting coordinate\
    \ of the figure (upper left corner), the width and height of the figure (the figure\
    \ is scaled to this size), and whether the t coordinates should be interpreted\
    \ relative or absolute.\n\n## 5.2 IMAGES\n\nIn the previous examples, I have already\
    \ shown how to load an image and display it in a window. Actually, pictures do\
    \ not have much to do with effects, but there are pictures used in the example\
    \ above, and there are a few remarks to add, so therefore a few additional examples.\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_55_0.png)\n\nAn image is displayed\
    \ in a scene graph as an ImageView node, and the image itself is represented in\
    \ the program as an Image object and can be loaded from the machine's hard disk\
    \ by specifying the path of the image as a parameter to the constructor. The following\
    \ program is called ImageViewProgram and it opens the following window:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_56_0.png)\n\
    \nIt is the same image shown three times, and the example should primarily show\
    \ how to scale an image. The first image (the big one) is unscaled while the two\
    \ others are scaled. The code is as follows:\n\n```java\npackage imageviewerprogram;\n\
    \nimport javafx.application.Application;\nimport static javafx.application.Application.launch;\n\
    import javafx.scene.*;\nimport javafx.scene.effect.*;\nimport javafx.stage.Stage;\n\
    import javafx.scene.paint.*;\nimport javafx.scene.image.*;\n\npublic class ImageViewerProgram\
    \ extends Application\n{\n    private Image image;\n\n    public ImageViewerProgram()\n\
    \    {\n        String filename = \"file:\" + System.getProperty(\"user.home\"\
    ) + \"/data/dollar.jpg\";\n        image = new Image(filename);\n    }\n\n   \
    \ @Override\n    public void start(Stage primaryStage)\n    {\n        Group root\
    \ = new Group();\n        root.getChildren().add(createView(20, 20, 0, 0, true));\n\
    \        root.getChildren().add(createView(440, 100, 200, 0, true));\n       \
    \ root.getChildren().add(createView(440, 200, 100, 200, false));\n        Scene\
    \ scene = new Scene(root, 560, 440);\n        primaryStage.setTitle(\"Colors\"\
    );\n        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n\
    \n    private ImageView createView(double x, double y, double width, double height,\n\
    \    boolean preserve)\n    {\n        ImageView view = new ImageView(image);\n\
    \        view.setX(x);\n        view.setY(y);\n        if (width > 0 && height\
    \ > 0)\n        {\n            view.setFitHeight(height);\n            view.setFitWidth(width);\n\
    \        }\n        view.setEffect(new DropShadow(5, Color.BLACK));\n        view.setPreserveRatio(preserve);\n\
    \        return view;\n    }\n\n    public static void main(String[] args)\n \
    \   {\n        launch(args);\n    }\n}\n```\n\nThe image is loaded in the class's\
    \ constructor and can be referred to for the image, and it has five instance variable\
    \ image. The method createView() creates an ImageView for the image, the first\
    \ two parameters are the coordinates of the ImageView object's upper left corner,\
    \ while the two next indicate the width and height. The last indicates whether\
    \ the image's proportions are to be retained. The statements of the method are\
    \ easy to interpret, perhaps apart from the meaning of setEffect(), but the result\
    \ is that a frame is drawn outside the image. If no width or height is specified,\
    \ these attributes are not set, and the result is that the physical dimensions\
    \ of the image are applied.\n\nExamining the method start() shows that there is\
    \ no size for the first image. The image size before becomes the physical size,\
    \ which is 400 × 400. For the next image, the size is set to 100 × 200, and it\
    \ will be scaled within this frame, but as it is said that the proportions are\
    \ to be saved, the result is an image that is scaled to ¼ in both directions and\
    \ you get a picture that is 100 × 100. For the last image, the same size is specified,\
    \ but the proportions are not preserved, and the image is therefore scaled in\
    \ both directions, so it will fill 100 × 200.\n\nAs the last example concerning\
    \ images, I will show you a program called PixelProgram. The program should show\
    \ how to manipulate the individual pixels in an image. The starting point is the\
    \ same picture as shown above. Here is a portion of the image pixels white (the\
    \ background), and the program should change the background to black. That is,\
    \ all white pixels must be changed to black. In general, it is simple, but as\
    \ it is a jpg image, pixels close to the figure will not be completely white,\
    \ and it is therefore necessary to allow an uncertainty as to when a pixel is\
    \ white. Performing the program gives you the result:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_58_0.png)\n\
    \n```java\npackage pixelprogram;\n\nimport javafx.application.Application;\nimport\
    \ static javafx.application.Application.launch;\nimport javafx.scene.Scene;\n\
    import javafx.scene.effect.*;\nimport javafx.stage.Stage;\nimport javafx.scene.paint.*;\n\
    import javafx.scene.image.*;\n\npublic class PixelsProgram extends Application\n\
    {\n    private Image image;\n\n    public PixelsProgram() {\n        String filename\
    \ = \"file:\" + System.getProperty(\"user.home\") + \"/data/dollar.jpg\";\n  \
    \      image = new Image(filename);\n    }\n\n    @Override\n    public void start(Stage\
    \ primaryStage)\n    {\n        Group root = new Group();\n        root.getChildren().add(createView());\n\
    \        Scene scene = new Scene(root, 440, 440);\n        primaryStage.setTitle(\"\
    Pixels\");\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
    \    }\n\n    private ImageView createView()\n    {\n        int width = (int)image.getWidth();\n\
    \        int height = (int)image.getHeight();\n        WritableImage buffer =\
    \ new WritableImage(width, height);\n        PixelReader reader = image.getPixelReader();\n\
    \        PixelWriter writer = buffer.getPixelWriter();\n        for (int y = 0;\
    \ y < height; y++) {\n            for (int x = 0; x < width; x++) {\n        \
    \        Color color = reader.getColor(x, y);\n                if (isWhite(color))\
    \ color = Color.BLACK;\n                writer.setColor(x, y, color);\n      \
    \      }\n        }\n        ImageView view = new ImageView(buffer);\n       \
    \ view.setX(20);\n        view.setY(20);\n        return view;\n    }\n\n    private\
    \ boolean isWhite(Color color)\n    {\n        double epsilon = 0.1;\n       \
    \ return 1 - color.getRed() < epsilon && color.getGreen() < epsilon &&\n     \
    \          1 - color.getBlue() < epsilon;\n    }\n\n    public static void main(String[]\
    \ args)\n    {\n        launch(args);\n    }\n}\n```\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_59_0.png)\n"
  mdcn: "\n\n# JAVA 14: 使用 JAVAFX 开发应用程序：软件开发\n\n最后，还有一个 `ImagePattern`，这是一个绘制图像的\
    \ `Paint` 对象。在程序的 `start()` 方法中，图像（Bean.png）被加载为一个 `Image` 对象。然后可以使用此图像来创建一个 `ImagePattern`\
    \ 对象：\n\n```java\nprivate Paint createImage()\n{\n    return new ImagePattern(image,\
    \ 0, 0, 48, 48, false);\n}\n```\n\n除了图像之外，参数是图形的起始坐标（左上角）、图形的宽度和高度（图形将缩放到此尺寸），以及\
    \ t 坐标应该被解释为相对的还是绝对的。\n\n## 5.2 图像\n\n在之前的示例中，我已经展示了如何加载图像并在窗口中显示它。实际上，图片与效果并没有太大关系，但上面的示例使用了图片，并且有几点需要说明，因此增加几个额外的示例。\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_55_0.png)\n\n图像在场景图中以 `ImageView` 节点的形式显示，而图像本身在程序中被表示为\
    \ `Image` 对象，可以通过指定图像路径作为构造函数的参数从机器的硬盘中加载。以下程序称为 `ImageViewProgram`，它打开了以下窗口：\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_56_0.png)\n\n显示的是三次相同的图像，该示例主要展示了如何缩放图像。第一张图像（较大的那个）未经过缩放，而另外两个经过了缩放。代码如下：\n\
    \n```java\npackage imageviewerprogram;\n\nimport javafx.application.Application;\n\
    import static javafx.application.Application.launch;\nimport javafx.scene.*;\n\
    import javafx.scene.effect.*;\nimport javafx.stage.Stage;\nimport javafx.scene.paint.*;\n\
    import javafx.scene.image.*;\n\npublic class ImageViewerProgram extends Application\n\
    {\n    private Image image;\n\n    public ImageViewerProgram()\n    {\n      \
    \  String filename = \"file:\" + System.getProperty(\"user.home\") + \"/data/dollar.jpg\"\
    ;\n        image = new Image(filename);\n    }\n\n    @Override\n    public void\
    \ start(Stage primaryStage)\n    {\n        Group root = new Group();\n      \
    \  root.getChildren().add(createView(20, 20, 0, 0, true));\n        root.getChildren().add(createView(440,\
    \ 100, 200, 0, true));\n        root.getChildren().add(createView(440, 200, 100,\
    \ 200, false));\n        Scene scene = new Scene(root, 560, 440);\n        primaryStage.setTitle(\"\
    Colors\");\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
    \    }\n\n    private ImageView createView(double x, double y, double width, double\
    \ height,\n    boolean preserve)\n    {\n        ImageView view = new ImageView(image);\n\
    \        view.setX(x);\n        view.setY(y);\n        if (width > 0 && height\
    \ > 0)\n        {\n            view.setFitHeight(height);\n            view.setFitWidth(width);\n\
    \        }\n        view.setEffect(new DropShadow(5, Color.BLACK));\n        view.setPreserveRatio(preserve);\n\
    \        return view;\n    }\n\n    public static void main(String[] args)\n \
    \   {\n        launch(args);\n    }\n}\n```\n\n图像在类的构造函数中加载，并可以被引用用于图像，它有一个实例变量\
    \ `image`。`createView()` 方法为该图像创建一个 `ImageView`，前两个参数是 `ImageView` 对象左上角的坐标，接下来的两个参数表示宽度和高度。最后一个参数表示是否要保留图像的比例。该方法的语句很容易理解，可能除了\
    \ `setEffect()` 的含义外，但结果是在图像外绘制了一个框。如果没有指定宽度或高度，这些属性将不会被设置，结果是应用图像的物理尺寸。\n\n检查\
    \ `start()` 方法发现第一张图像没有尺寸。之前的图像尺寸变为物理尺寸，即 400 × 400。对于下一张图像，尺寸设置为 100 × 200，它将在该框架内缩放，但由于说是保留比例，结果是图像在两个方向上都缩小了\
    \ 1/4，你得到一张 100 × 100 的图片。对于最后一张图像，指定了相同的尺寸，但没有保留比例，因此图像在两个方向上都被缩放，这将填充 100 ×\
    \ 200。\n\n关于图像的最后一个示例，我将向你展示一个名为 `PixelProgram` 的程序。该程序应该展示如何操作图像中的单个像素。起点是上面所示的图片。图像的部分像素是白色（背景），程序应该将背景改为黑色。也就是说，所有白色像素必须改为黑色。通常情况下这很简单，但由于它是\
    \ jpg 图像，靠近图形的像素不会完全是白色，因此需要对像素是否为白色允许不确定性。执行程序将得到结果：![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_58_0.png)\n\
    \n```java\npackage pixelprogram;\n\nimport javafx.application.Application;\nimport\
    \ static javafx.application.Application.launch;\nimport javafx.scene.*;\nimport\
    \ javafx.scene.effect.*;\nimport javafx.stage.Stage;\nimport javafx.scene.paint.*;\n\
    import javafx.scene.image.*;\n\npublic class PixelsProgram extends Application\n\
    {\n    private Image image;\n\n    public PixelsProgram() {\n        String filename\
    \ = \"file:\" + System.getProperty(\"user.home\") + \"/data/dollar.jpg\";\n  \
    \      image = new Image(filename);\n    }\n\n    @Override\n    public void start(Stage\
    \ primaryStage)\n    {\n        Group root = new Group();\n        root.getChildren().add(createView());\n\
    \        Scene scene = new Scene(root, 440, 440);\n        primaryStage.setTitle(\"\
    Pixels\");\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
