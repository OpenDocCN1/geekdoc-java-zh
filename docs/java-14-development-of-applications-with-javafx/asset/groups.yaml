    again contains Node objects arranged in a tree. A Stage represents a window and
    the primary Stage object is created by the runtime system and is set as a parameter
    to the method start(), and in the example it has the name primaryStage. A Scene
    object contains all of the window''s objects organized into a tree graph. The
    tree''s elements are Node objects, and a node can be a branch node (which has
    children) or a leaf node (which no children have). A node is a component in the
    window and may, for example, be a button or an entry field.


