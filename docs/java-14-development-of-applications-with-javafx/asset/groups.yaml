    \n### 9.3 关于 FXML\n\n本章提供了 FXML 的简要介绍，尽管还有更多可以解释，但这些足够了。其目的是：\n\n- 将用户界面与代码分离。\n\
    - 使开发复杂的界面变得更容易。\n\n程序的开发是以原型的方式实现的，在下面我将简要描述它是如何完成的。从开始，我计划了以下迭代：\n\n- 1. 第一原型\n\
    - 2. 增强原型\n- 3. 实现平方根和平方函数\n- 4. 实现存储和取回\n- 5. 实现其他函数\n- 6. 实现精度设置\n- 7. 实现菜单项表达式\n\
    - 8. 实现文件菜单\n- 9. 实现缺失的功能\n- 10. 程序样式化\n- 11. 重构\n\n## 10 最终示例\n\n作为最后一个示例，我将使用与之前书中相同的程序，不同之处在于该程序应该是一个桌面应用程序。这意味着我可以复用实现数学函数的\
    \ `FunctionsLib` 类，以及用于解析和评估表达式的类。因此，我只需要实现用户界面。程序的目的当然是展示一个 JavaFX 程序的示例，它比其他展示的示例稍大。\n\
    \n程序必须具有与之前书中相同的功能，并基本上以相同的方式使用，即用户输入一个数学表达式，程序对其进行评估。与之前的程序不同，程序应该具有数学函数的按钮，这些按钮的作用只是将函数名称插入到表达式输入框中。在新版本的程序中，你必须能够保存任意表达式，以便将表达式插入到表达式中，而且还可以将程序的变量保存到文件中。\n\
    \n### 10.1 开发\n\n"
