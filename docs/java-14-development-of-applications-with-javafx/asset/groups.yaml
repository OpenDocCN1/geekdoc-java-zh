    \ GUI 应用程序的完整 API，由分布在以下包中的类组成：\n\n1. javafx.animation\n2. javafx.application\n\
    3. javafx.css\n4. javafx.event\n5. javafx.geometry\n6. javafx.stage\n7. javafx.scene\n\
    \n其中后者有更多的子包。如所述，一个 JavaFX 程序由场景图组成，它是一棵包含节点的树，这些节点可能是：\n\n- 几何对象，可以是 2D 和 3D\
    \ 对象，如 Circle、Sphere 等\n- UI 控件，如 Label、Button 等\n- 容器，如 StackPane、VBox、Group\
