    # 7.4 DIALOGS


    You can use dialog boxes, and there are dialogs as Swing there are ready to use
    classes that can be used immediately, and on the other hand, there are dialog
    boxes that are custom. The simplest is an Alert that corresponds to a MessageDialog
    in Swing. The AlertProgram application opens the following window:


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_119_0.png)


    If you click on the Info button, you get the message box below that shows a simple
    message and clicking on the Save button, you may receive a corresponding message
    box (but with an error message) and finally the last button result in a message
    box with a warning, where you will be asked if you want to delete the entry field:


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_119_1.png)


