- md: "\n# TRANSFORMATIONS\n\nJavaFX also supports transformations of nodes in the\
    \ scene graph, and it happens largely in the same way that you know it from Java2D.\
    \ Generally, there are 4 transformations\n\n- 1. Translate\n- 2. Scaling\n- 3.\
    \ Rotation\n- 4. Shearing\n\nand the meaning is as same as in Java2D. As a simple\
    \ example, the following program performs a translation of a rectangle:\n\n```java\n\
    package translateprogram;\n\nimport javafx.application.Application;\nimport static\
    \ javafx.application.Application.launch;\nimport javafx.scene.Scene;\nimport javafx.scene.Group;\n\
    import javafx.stage.Stage;\nimport javafx.scene.shape.*;\nimport javafx.scene.paint.Color;\n\
    import javafx.scene.transform.*;\n\npublic class TranslateProgram extends Application\
    \ {\n  @Override\n  public void start(Stage stage) {\n    Group root = new Group();\n\
    \    root.getChildren().add(createRect(Color.BLUE, null));\n    root.getChildren().add(createRect(Color.RED,\
    \ new Translate(50, 50)));\n    Scene scene = new Scene(root, 350, 200);\n   \
    \ stage.setTitle(\"Rectangles\");\n    stage.setScene(scene);\n    stage.show();\n\
    \  }\n\n  private Rectangle createRect(Color color, Translate trans) {\n    Rectangle\
    \ rect = new Rectangle(20, 20, 200, 100);\n    rect.setFill(color);\n    if (trans\
    \ != null) rect.getTransforms().add(trans);\n    return rect;\n  }\n\n  public\
    \ static void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\nThe method\
    \ createRect creates a Rectangle with a fixed position and size, as well as a\
    \ parameter that is the color. Finally, there is a parameter that can indicate\
    \ a transformation and thus a shift of the rectangle to another position. That\
    \ is, the program creates two rectangles of the same size and position, but one\
    \ (the red) translated 50 pixels in both directions:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_70_0.png)\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_70_1.png)\n\n# EXERCISE 16\n\nWrite\
    \ a program that opens the following window:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_71_0.png)\n\
    \nThe blue rectangle has the top corner in (20, 20) while the size is 200 × 100.\
    \ The red rectangle is a scaling of the blue where it is scaled to 50% in both\
    \ directions and from the point (20, 20). The green rectangle is a corresponding\
    \ scale, followed by a translation. Note that in the case of compound transformations,\
    \ the order means something.\n\n# EXERCISE 17\n\nWrite an application that opens\
    \ the window below. Here the blue rectangle has the upper left corner in (180,\
    \ 180) while the size is 200 × 100. The red rectangle is a rotation of 45 degrees\
    \ of the blue rectangle about the point (180, 180). The green rectangle is a rotation\
    \ about the same point, but with the angle -45 degrees, and the rotation is followed\
    \ by a translation.\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_71_1.png)\n\n\
    # EXERCISE 18\n\nWrite a program that opens a window similar to the following\
    \ when the red rectangle is to be a shearing of the blue rectangle:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_72_0.png)\n\
    \n# 6.1 ANIMATIONS\n\nIn this section I introduce animations, which you also can\
    \ perceive as a form of transformations of a node, and if you do it changing one\
    \ or the properties of a node many times and do it at short intervals, it will\
    \ seem to the user as if something is “alive” with that node. As described in\
    \ Java 10, a node needs to be redrawn at short intervals, and such that the value\
    \ of an option has been changed for each redraw. In JavaFX, this logic is encapsulated\
    \ in a number of classes, where each class defines an animation for a particular\
    \ value or property. The base class is called a Transition, but there are the\
    \ following specific transitions:\n\n- FadeTransition\n- FillTransition\n- RotateTransition\n\
    - ScaleTransition\n- StrokeTransition\n- TranslateTransition\n- PathTransition\n\
    - SequentialTransition\n- PauseTransition\n- ParallelTransition\n\nand the names\
    \ tell a little about what it is for properties the class in question is an animation\
    \ for. As an example, I will show you how to use a FadeTransition. A visual node\
    \ has an opacity property that indicates the extent to which node should be displayed\
    \ transparent. If you perform an animation of this property, you can see that\
    \ the figure appears fully drawn, after which it appears more transparent until\
    \ it completely disappears. It is the task of a FadeTransition. If you run the\
    \ program FadeAnimation, the following window shows a red circle:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_73_0.png)\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_73_1.png)\n\nThe circle becomes weaker\
    \ and weaker and finally disappears. Then it grows again until it is original.\
    \ This cycle is repeated 5 times. The code is as follows:\n\n```java\npackage\
    \ fadeAnimation;\n\nimport javafx.application.Application;\nimport static javafx.application.Application.launch;\n\
    import javafx.scene.*;\nimport javafx.stage.*;\nimport javafx.scene.shape.*;\n\
    import javafx.scene.paint.Color;\nimport javafx.animation.*;\nimport javafx.util.*;\n\
    \npublic class FadeAnimation extends Application {\n  @Override\n  public void\
    \ start(Stage stage) {\n    Group root = new Group();\n    Circle circ = createCircle();\n\
    \    root.getChildren().add(circ);\n    Transition trans = createTransition(circ);\n\
    \    Scene scene = new Scene(root, 250, 250);\n    stage.setTitle(\"Fade\");\n\
    \    stage.setScene(scene);\n    stage.show();\n    trans.play();\n  }\n\n  private\
    \ Circle createCircle() {\n    return new Circle(120, 120, 100, Color.RED);\n\
    \  }\n\n  private Transition createTransition(Node node) {\n    FadeTransition\
    \ trans = new FadeTransition(Duration.millis(2000), node);\n    trans.setFromValue(1);\n\
    \    trans.setToValue(0);\n    trans.setCycleCount(10);\n    trans.setAutoReverse(true);\n\
    \    return trans;\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
    \  }\n}\n```\n\nThe other animation classes are used in the same way, but instead\
    \ of showing examples, I have formulated a series of exercises that will illustrate\
    \ applications of the most important classes. You can immediately start from the\
    \ above program, but for some of the exercises it is necessary to read the documentation\
    \ to find out what to write – which values should be initialized.\n\n# EXERCISE\
    \ 19\n\nWrite an application that opens a window with a blue circle:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_75_0.png)\n\
    \nThen the program with a FillTransition change color to red. The animation must\
    \ take 5 seconds and then start again with a blue circle. The animation must be\
    \ repeated 50 times. Note that a FillTransition cannot be applied to a general\
    \ node, but it must be a Shape.\n"
  mdcn: "\n\n# 变换\n\nJavaFX 也支持对场景图中的节点进行变换，这在很大程度上与你在 Java2D 中熟悉的用法相同。通常，有 4 种变换：\n\
    \n- 1. 平移 (Translate)\n- 2. 缩放 (Scaling)\n- 3. 旋转 (Rotation)\n- 4. 倾斜 (Shearing)\n\
    \n其含义与 Java2D 中的相同。作为一个简单的示例，以下程序对一个矩形执行平移：\n\n```java\npackage translateprogram;\n\
    \nimport javafx.application.Application;\nimport static javafx.application.Application.launch;\n\
    import javafx.scene.Scene;\nimport javafx.scene.Group;\nimport javafx.stage.Stage;\n\
    import javafx.scene.shape.*;\nimport javafx.scene.paint.Color;\nimport javafx.scene.transform.*;\n\
    \npublic class TranslateProgram extends Application {\n  @Override\n  public void\
    \ start(Stage stage) {\n    Group root = new Group();\n    root.getChildren().add(createRect(Color.BLUE,\
    \ null));\n    root.getChildren().add(createRect(Color.RED, new Translate(50,\
    \ 50)));\n    Scene scene = new Scene(root, 350, 200);\n    stage.setTitle(\"\
    Rectangles\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  private\
    \ Rectangle createRect(Color color, Translate trans) {\n    Rectangle rect = new\
    \ Rectangle(20, 20, 200, 100);\n    rect.setFill(color);\n    if (trans != null)\
    \ rect.getTransforms().add(trans);\n    return rect;\n  }\n\n  public static void\
    \ main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n`createRect` 方法创建了一个固定位置和大小的矩形，并带有一个颜色参数。最后，还有一个参数可以指示变换，从而将矩形移动到另一个位置。也就是说，程序创建了两个大小和位置相同的矩形，但其中一个（红色的）在两个方向上都平移了\
    \ 50 像素：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_70_0.png)\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_70_1.png)\n\
    \n# 练习 16\n\n编写一个程序打开以下窗口：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_71_0.png)\n\
    \n蓝色矩形的左上角位于 (20, 20)，大小为 200 × 100。红色矩形是蓝色矩形的缩放，它在两个方向上都缩放为 50%，并从点 (20, 20)\
    \ 开始。绿色矩形是相应的缩放，随后是平移。请注意，在复合变换的情况下，顺序是有意义的。\n\n# 练习 17\n\n编写一个应用程序打开下方的窗口。在这里，蓝色矩形的左上角位于\
    \ (180, 180)，大小为 200 × 100。红色矩形是蓝色矩形绕点 (180, 180) 旋转 45 度。绿色矩形是绕同一个点旋转，但角度为 -45\
    \ 度，并且旋转之后是平移。\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_71_1.png)\n\n# 练习 18\n\
    \n编写一个程序，当红色矩形是蓝色矩形的倾斜时，打开一个类似于下面的窗口：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_72_0.png)\n\
    \n# 6.1 动画\n\n在本节中，我将介绍动画，你也可以将其视为节点变换的一种形式。如果你在短间隔内多次更改节点的一个或多个属性并执行，那么对用户来说，该节点看起来就像是“活”的一样。正如\
    \ Java 10 中描述的，节点需要在短间隔内进行重绘，并且每次重绘时某个选项的值都发生了变化。在 JavaFX 中，这种逻辑封装在许多类中，每个类都为特定的值或属性定义了一个动画。基类称为\
    \ `Transition`，但还有以下特定的过渡类：\n\n- FadeTransition\n- FillTransition\n- RotateTransition\n\
    - ScaleTransition\n- StrokeTransition\n- TranslateTransition\n- PathTransition\n\
    - SequentialTransition\n- PauseTransition\n- ParallelTransition\n\n名称已经告诉了我们该类是针对什么属性的动画。例如，我将向你展示如何使用\
    \ `FadeTransition`。视觉节点有一个 `opacity`（不透明度）属性，表示节点显示透明的程度。如果你对该属性执行动画，你可以看到图形先是完全绘制的，然后它变得越来越透明，直到完全消失。这就是\
    \ `FadeTransition` 的任务。如果你运行 `FadeAnimation` 程序，下面的窗口显示一个红圆：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_73_0.png)\n\
    \n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_73_1.png)\n\n圆变得越来越淡并最终消失。然后它再次增大直到回到原始状态。这个循环重复了\
    \ 5 次。代码如下：\n\n```java\npackage fadeAnimation;\n\nimport javafx.application.Application;\n\
    import static javafx.application.Application.launch;\nimport javafx.scene.*;\n\
    import javafx.stage.*;\nimport javafx.scene.shape.*;\nimport javafx.scene.paint.Color;\n\
    import javafx.animation.*;\nimport javafx.util.*;\n\npublic class FadeAnimation\
    \ extends Application {\n  @Override\n  public void start(Stage stage) {\n   \
    \ Group root = new Group();\n    Circle circ = createCircle();\n    root.getChildren().add(circ);\n\
    \    Transition trans = createTransition(circ);\n    Scene scene = new Scene(root,\
    \ 250, 250);\n    stage.setTitle(\"Fade\");\n    stage.setScene(scene);\n    stage.show();\n\
    \    trans.play();\n  }\n\n  private Circle createCircle() {\n    return new Circle(120,\
    \ 120, 100, Color.RED);\n  }\n\n  private Transition createTransition(Node node)\
    \ {\n    FadeTransition trans = new FadeTransition(Duration.millis(2000), node);\n\
    \    trans.setFromValue(1);\n    trans.setToValue(0);\n    trans.setCycleCount(10);\n\
    \    trans.setAutoReverse(true);\n    return trans;\n  }\n\n  public static void\
    \ main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n其他动画类的用法方法相同，但我没有提供示例，而是制定了一系列练习来展示这些重要类的应用。你可以直接从上面的程序开始，但对于某些练习，需要阅读文档来确定写什么——应该初始化哪些值。\n\
    \n# 练习 19\n\n编写一个应用程序打开一个包含蓝色圆的窗口：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_75_0.png)\n\
    \n然后程序使用 `FillTransition` 将颜色变为红色。动画必须持续 5 秒，然后再次从蓝色圆开始。该动画必须重复 50 次。请注意，`FillTransition`\
    \ 不能应用于通用节点，它必须是一个 `Shape`（形状）。\n\n"
