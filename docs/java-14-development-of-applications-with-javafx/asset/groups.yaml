    \ Result（清除结果），会删除上方结果字段的内容\n- Clear Editor（清除编辑器），会删除输入字段的内容\n- Enter（回车）\n\n\
    这些都是简单的事件处理器。然后你可以进行算术运算并评估表达式，计算器在原则上就完成了。特别是你可以通过点击 `Sqr` 和 `Sqrt` 按钮将文本粘贴到编辑器中。\n\
