    你必须编写一个应用程序，打开以下窗口：


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_117_1.png)


    以及一个使用标签（tabs）的程序。在第一个标签上，你必须输入名称和注册日期，而在另一个标签上，你可以输入地址和电子邮件地址。如果你点击按钮，将得到一个显示所输入数据的消息框：


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_117_2.png)


