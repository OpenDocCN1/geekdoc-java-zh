    There are many topics, especially JavaFX properties, the book does not include,
    but these topics are dealt in the following book. JavaFX is intended as an alternative
    to Swing, and it is especially for better graphics and other media used in the
    user interface. With JavaFX, it is easier to develop applications with a modern
    user interface and with all the possibilities that users expect and get to use
    from web applications. The book does not require the reader to know Swing and
    Java2D in detail, but assumes that the reader has an introductory knowledge of
