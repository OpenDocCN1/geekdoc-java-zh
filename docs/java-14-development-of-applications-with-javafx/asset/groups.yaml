    # JAVA 14: DEVELOPMENT OF APPLICATIONS

    WITH JAVAFX: SOFTWARE DEVELOPMENT


    inherit, where the value is inherited from the parent''s node, for example


    ```

    -fx-border-color: inherit;

    ```


    boolean, where the value can be true or false, for example


    ```

    -fx-display-caret: true;

    ```


    string, where you enter the value in quotation marks, for example


    ```

    -fx-font: normal bold 24px ''areal'';

    ```


    number, where you enter the value as a decimal number, for example


    ```

    -fx-border-width: 3.5;

    ```


    You can also specify a unit such as px (pixels), mm (millimeters), cm (centimeters),
    in (inches),

    pt (points), pc (pixels) or em. You can also specify a percent value. Examples
    could be:


    ```

    -fx-font-size: 18px;

    -fx-font-size: 24pt;

    -fx-border-width: 10%;

    ```


    angle, which is specified by a number and a unit that must be deg (degrees) or
    rad (radians)

    for example


    ```

    -fx-rotate: 45deg;

    ```


    point, which is specified using x and y coordinates as two numbers separated by
    whitespaces,

    for example


    ```

    -fx-background-color: linear-gradient(from 0 0 to 100 0, repeat, red, blue);

    ```


    There are several other values that you can specify for properties, and you should
    examine

    the documentation for a complete overview, for example


    ```

    https://docs.oracle.com/javafx/2/api/javafx/scene/doc-files/cssref.html

    ```


