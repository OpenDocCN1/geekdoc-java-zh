    the coordinates denote an absolute position and is the command $h$, the coordinates
    denote a relative position. If you specify multiple coordinates, they are perceived
    as multiple subsequent horizontal to operations.

    5. V or v, which means vertical to. As a result, the cursor draws a vertical line
    from the current point to the following y coordinate. If the command is $V$, the
    coordinates denote an absolute position and is the command $v$, the coordinates
    denote a relative position. If you specify more y coordinates, they are perceived
    as multiple subsequent vertical to operations.

    6. C or c, which means cubic to. As a result, the cursor draws a curve from the
    current point to the last of the following three coordinates. The first two are
    control points. If the command $C$, the coordinates denote an absolute position,
    and is command $c$, the coordinates denote a relative position. If you specify
    more coordinates, they are perceived as several subsequent curve to operations.

    7. Q or q, which means quad to. As a result, the cursor draws a quad curve from
    the current point to the last of the following two pairs. The first is the control
    point. Is the command $Q$, the coordinates denote an absolute position and is
    the command $q$, the coordinates denote a relative position. If you specify more
    coordinates, they are perceived as several subsequent quad to operations.

    8. A or a, which means arc to. The result is that the cursor draws an arc starting
    from the current point to (x, y). The parameters are ($rx$ row large sweep $x
    y$), where $rx$ and $row$ are radii in an ellipse and the ellipse rotation over
    the x-axis. The two parameters $large$ and $sweep$ indicate which of the two arcs
    to be selected,'
