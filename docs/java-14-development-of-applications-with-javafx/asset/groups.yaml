    \n```java\n@FXML\nprivate void handleButtonAction(ActionEvent event)\n{\n    System.out.println(\"\
    You clicked me!\");\n    label.setText(\"Hello World!\");\n}\n```\n\n```java\n\
    @Override\npublic void initialize(URL url, ResourceBundle rb)\n{\n}\n```\n\nThe\
    \ class defines a variable and two methods. The first is a reference to the control\
    \ defined in the XML section, and here you should note the annotation @FXML. It\
    \ means that FXMLLoader can create an object defined in FXML by injection. The\
    \ same notion is used for the event handler for the button, which means it can\
    \ be referenced from the XML section. You should note that the class implements\
    \ the interface Initializable, which defines a single method that can be used\
    \ to initialize the controller.\n\nThe above is how NetBeans has automatically\
    \ created, and I now have to make changes to FXMLDocument.fxml and FXMLDocumentController.java.\
    \ The class HelloFXML.java will be unchanged. FXMLDocument.fxml has been changed:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\nimport java.lang.*;\n\
    import javafx.util.*;\nimport javafx.scene.*;\nimport javafx.scene.control.*;\n\
    import javafx.scene.layout.*;\nimport javafx.scene.geometry.*\nimport javafx.scene.text.*\n\
    ```\n\n```xml\n<VBox alignment=\"CENTER\" spacing=\"20\" prefWidth=\"400\"\n \
    \    xmlns:fx=\"http://javafx.com/fxml/1\"\n     fx:controller=\"hellofxml.FXMLDocumentController\"\
    >\n<style>\n    -fx-padding: 20;\n    -fx-border-style: solid;\n    -fx-border-width:\
    \ 2;\n    -fx-border-insets: 25;\n    -fx-border-radius: 10;\n    -fx-border-color:\
    \ darkred;\n</style>\n<children>\n<TextField fx:id=\"name\" prefWidth=\"300\"\
    \ maxWidth=\"300\" />\n```\n\n```xml\n<Button text=\"Click Me!\" prefWidth=\"\
    100\" onAction=\"#handleAction\" fx:id=\"button\" />\n<Label minHeight=\"20\"\
    \ fx:id=\"label\" fillColor=\"red\">\n<font>\n<Font name=\"Aria\" size=\"24.0\"\
    \ />\n</font>\n</Label>\n</children>\n</VBox>\n```\n\nTwo new import directives\
    \ have been added, the AnchorPane element has been replaced by a VBox. Then a\
    \ element and a TextField element are added, and many attributes are also changed.\
    \ When you see the code, it is easy enough to understand at least if you know\
    \ JavaFX. As a result, the window changes to the following:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_142_0.png)\n\
    \nwhere the text Carlo is entered in the entry field and then clicked on the button.\
    \ In the controller, nothing else has been added an additional variable has been\
    \ added and the event handler has changed:\n\n```java\npackage hellofxml;\nimport\
    \ java.net.URL;\nimport java.util.ResourceBundle;\nimport javafx.event.ActionEvent;\n\
    import javafx.fxml.FXML;\nimport javafx.fxml.Initializable;\nimport javafx.scene.control.Label;\n\
    import javafx.scene.control.TextField;\n\npublic class FXMLDocumentController\
    \ implements Initializable\n{\n@FXML\nprivate Label label;\n@FXML\nprivate TextField\
    \ name;\n\n@FXML\nprivate void handleButtonAction(ActionEvent event) \n{\n  label.setText(\"\
    Hello: \" + name.getText());\n  name.setText(\"\");\n}\n\n@Override\npublic void\
    \ initialize(URL url, ResourceBundle rb)\n{\n}\n}\n```\n\n## 9.1 CREATE OBJECTS\n\
    \nAs illustrated in the previous example, FXML is used to define a program’s scene\
    \ graph or part of the graph, but FXML may more generally be used to define an\
    \ object graph. In this section, I will show a program called ObjectsFXML, which\
    \ will show you how to create objects using FXML. The ObjectsFXML.java program\
    \ class does not contain anything new and will not be shown here. The file FXMLDocument.fxml\
    \ has the following content:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n```\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_143_0.png)\n\n```xml\n<import\
    \ java.lang.*?>\n<import java.util.*?>\n<import javafx.scene.*?>\n<import javafx.scene.control.*?>\n\
    <import javafx.scene.layout.*?>\n<import javafx.scene.text.*?>\n<import javafx.geometry.*?>\n\
    <import javafx.lang.*?>\n<import javafx.collections.*?>\n<import objectsfxml.*?>\n\
    \n<VBox prefHeight=\"200\" prefWidth=\"320\" spacing=\"20\" alignment=\"CENTER\"\
    \nxmlns:fx=\"http://javafx.com/fxml/1\"\nfx:controller=\"objectsfxml.FXMLLoaderController\"\
    >\n<padding>\n  <Insets top=\"20\" right=\"20\" bottom=\"20\" left=\"20\"/>\n\
    </padding>\n<children>\n  <Text fx:id=\"header\" />\n  <ComboBox fx:id=\"lstPersons\"\
    >\n    <items>\n      <FXCollections fx:factory=\"observableArrayList\">\n   \
    \     <String fx:value=\"Gorm Gamle\" />\n        <String fx:value=\"Harald Blånd\"\
    \ />\n        <String fx:value=\"Svend Tvesæg\" />\n        <String fx:value=\"\
    Harald den 2.\" />\n        <String fx:value=\"Knud den Store\" />\n      </FXCollections>\n\
    \    </items>\n  </ComboBox>\n  <Button text=\"Select a king\" onAction=\"#handleKings\"\
    \ fx:id=\"button\" />\n  <ComboBox fx:id=\"lstPersons\">\n    <Button text=\"\
    Select a king\" onAction=\"#handlePersons\" />\n    <Label fx:id=\"label\">\n\
    \      <String fx:value=\"A unknown Person\" />\n    </Label>\n  </ComboBox>\n\
    </children>\n</VBox>\n```\n\nFor example, if you look at the item\n\n<VBox prefHeight=\"\
    200\" ...\n\nthis means that each object of type VBox is being instantiated. First\
    \ of all, it requires an import directive for the package containing the class\
    \ VBox, and that the class has a default constructor, as the syntax does not contain\
    \ any immediate way to transfer values to the constructor. Similarly, the element\n\
    \n```xml\n<Text fx:id=\"header\" />\n```\n\nmeans that a Text object is created\
    \ and it is referred to a value that I return to the controller of the variable\
    \ header. Here, the object is also assigned a ComboBox called lstKings (the name\
    \ that the corresponding object is called in the controller). The next thing that\
    \ happens is to create a ComboBox. In particular, note how the ComboBox is initialized.\
    \ This happens with an ObservableList, and here the syntax the list is created\
    \ by a factory method, explained below. The individual items in the list are of\
    \ the type String and the item\n\n```xml\n<String fx:value=\"Gorm den Gayle\"\
    />\n```\n\ncreates a String object by performing a static method valueOf() initialized\
    \ with the current value. It requires that the class of which to instantiate an\
    \ object has such a method and it has the class String. The result of all is that\
    \ a ComboBox is created with 5 String objects.\n\nAs a next step, a button is\
    \ created where there is nothing to explain, and then an empty ComboBox called\
    \ lstPersons and finally another button. Finally, a Label is created, and here\
    \ you will notice how this Label is initialized with a String object. If you run\
    \ the program, you get the following window:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_145_0.png)\n\
    \nwhere a name is selected in the top combobox and then clicked on the top button.\
    \ The other ComboBox is also initialized, and it is done using a factory, as shown\
    \ below. The ComboBox is initialized with Objects of the type:\n\n```java\npackage\
    \ objectsfxml;\n\npublic class Person\n{\n    private String name;\n    private\
    \ String job;\n\npublic Person(String name, String job)\n{\n    this.name = name;\n\
    \    this.job = job;\n}\n\npublic String getName()\n{\n    return name;\n}\n\n\
    public void setName(String name)\n{\n    this.name = name;\n}\n\npublic String\
    \ getJob()\n{\n    return job;\n}\n\npublic void setJob(String job)\n{\n    this.job\
    \ = job;\n}\n\n@Override\npublic String toString()\n{\n    return String.format(\"\
    %s, %s\", name, job);\n}\n```\n\nwhich is a simple model class that I have previously\
    \ shown. Note that the class has no default constructor, and if you want to instantiate\
    \ an object, it is necessary to transfer parameters to the constructor. Because\
    \ you can not do that in FXML, a builder class is used, that is a class that implements\
    \ an interface:\n\n```java\npublic interface Builder<T>\n{\n    public T build();\n\
