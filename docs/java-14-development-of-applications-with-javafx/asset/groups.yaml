    \nFor example, if you click a location in the green area, the following is written\
    \ in standard output:\n\n- Stage - capturing\n- Scene - capturing\n- BorderPane\
    \ - capture\n- StackPane - capture\n- Rectangle - capture\n- Rectangle - bubbling\n\
    - StackPane - bubbling\n- BorderPane - bubbling\n- Scene - bubbling\n- Stage -\
    \ bubbling\n\nHere you can see how the event of mouse clicks has been processed\
