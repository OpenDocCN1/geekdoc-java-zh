    \n```java\nGridPane.setHalignment(cmd, HPos.RIGHT);\n```\n\n## 7.2 EVENTS\n\n\
    JavaFX has its event types, and the base type is called Event. Examples of specific\
    \ event types:\n\n- MouseEvent\n- KeyEvent\n- DragEvent\n- WindowEvent\n- ActionEvent\n\
    \nAn event is characterized by:\n\n1. a target, which is the node where an event\
    \ occurs and may be for example a window, a scene or a node\n2. a source, which\
    \ is the one that has generated an event and can, for example, the mouse\n3. an\
    \ event type, as mouse pressed, mouse released and so on\n\nWhen an event occurs,\
    \ one talks about an event dispatch chain, which is the route from the root stage\
    \ to that node. If it is a Circle node, for example, it could be:\n\nStage – Scene\
    \ – Group – Circle\n\nWhen an event occurs, it is sent to all nodes in its dispatch\
    \ chain from top to bottom. When there is a node that has registered a filter\
    \ for that event, this will be done, after which the event will be sent to its\
    \ target node where it will be processed if there is an event handler. This phase\
    \ is called the Event Capturing Phase. After that, the event will follow the way\
    \ back, and for each node it will be processed if there is a handler assigned.\
    \ This phase is called the Bubbling Phase. An event can thus result in multiple\
    \ event handlers; event handlers during the capturing phase are called filters\
    \ while event handlers during the bubbling phase are called handlers.\n\nWhen\
    \ an event follows the dispatch chain, it can at any time be stopped by the method\
    \ `consume()`, which means that the event will not be forwarded in the chain.\
    \ As an example, I will show a program `EventPhaseProgram` that creates the following\
