- md: "\n## JAVA 14: DEVELOPMENT OF APPLICATIONS WITH JAVAFX: SOFTWARE DEVELOPMENT\n\
    \n### 5.3 LIGHT\n\nIn the introduction to this chapter on effects, I have listed\
    \ the different effects that you can apply, and I have here far from illustrating\
    \ them all (and will not), but I want to conclude this chapter with a little about\
    \ the effect light. The principle is that a light source shines on a figure, and\
    \ the color of the figure is determined by the nature of the light source and\
    \ its position in relation to the figure.\n\nGenerally, you can associate a lighting\
    \ effect to a figure with a Lighting object, and if you do not indicate a light\
    \ source, a default light source is used, which corresponds to the light falling\
    \ directly into the figure, resulting in a weak 3D effect towards the edge. You\
    \ can also explicitly indicate a light source, where there are three options:\n\
    \n- 1. Light.Distant\n- 2. Light.Point\n- 3. Light.Spot\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_61_0.png)\n\
    \n## JAVA 14: DEVELOPMENT OF APPLICATIONS WITH JAVAFX: SOFTWARE DEVELOPMENT\n\n\
    The first corresponds to the light source located at a distance, sending light\
    \ that extends in one direction from a remote light source:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_62_0.png)\n\
    \nYou can set as a parameter two values (both of the type double):\n\n- 1. azimuth,\
    \ which indicates the angle of the light source's rotation about the z axis\n\
    - 2. elevation, which indicates the angle of the light source's rotation about\
    \ the x axis\n\nIn addition, you can indicate the color of the light source.\n\
    \nThe second option is a light source where the light is sent from a certain point,\
    \ as indicated by 3 coordinates. The light spreads in all directions, and in the\
    \ same way as a Distant light source, you can indicate the color of the light\
    \ source.\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_62_1.png)\n\nThe light intensity\
    \ depends on the distance of the source to the figure. Finally, there is the third\
    \ option that is similar to the above, but with the difference that you can specify\
    \ a specular that controls the focus of the light source.\n\n## JAVA 14: DEVELOPMENT\
    \ OF APPLICATIONS WITH JAVAFX: SOFTWARE DEVELOPMENT EFFECTS\n\nIf you run the\
    \ application LightingProgram, it opens the following window:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_63_0.png)\n\
    \nThe example looks like ColorProgram, but instead of illustrating the effect\
    \ of colors, the program shows the effect of light. The figures in the top row\
    \ show the effect of a standard and a distant light source, respectively, while\
    \ the two in the bottom row show the effect of a spot and a point light source,\
    \ respectively. The code of the program is:\n\n```java\npackage lightingprogram;\n\
    \nimport javafx.application.Application;\nimport static javafx.application.Application.launch;\n\
    import javafx.scene.*;\nimport javafx.stage.Stage;\nimport javafx.scene.effect.*;\n\
    import javafx.scene.shape.*;\nimport javafx.scene.paint.*;\nimport javafx.scene.text.*;\n\
    \npublic class LightingProgram extends Application\n{\n    @Override\n```\n\n\
    ## JAVA 14: DEVELOPMENT OF APPLICATIONS WITH JAVAFX: SOFTWARE DEVELOPMENT - EFFECTS\n\
    \npublic void start(Stage primaryStage)\n\n```java\n{\nGroup root = new Group();\n\
    root.getChildren().add(text(140, 50, Color.rgb(232, 232, 232, new Lighting()));\n\
    root.getChildren().add(circle(140, 220, Color.DARKRED, new Lighting()));\nroot.getChildren().add(text(400,\
    \ 50, Color.GREEN,new Lighting(new Light.Distant(45, 60, Color.WHITE))));\nroot.getChildren().add(circle(400,\
    \ 220, Color.GREEN,new Lighting(new Light.Distant(45, 60, Color.WHITE))));\nroot.getChildren().add(text(140,\
    \ 370, Color.BLUE,new Lighting(new Light.Spot(120, 120, 50, Color.WHITE))));\n\
    root.getChildren().add(circle(140, 540, Color.BLUE,new Lighting(new Light.Spot(120,\
    \ 120, 50, Color.WHITE))));\nroot.getChildren().add(text(400, 370, Color.RED,new\
    \ Lighting(new Light.Point(120, 120, 50, Color.WHITE))));\nroot.getChildren().add(circle(400,\
    \ 540, Color.RED,new Lighting(new Light.Point(120, 120, 50, Color.WHITE))));\n\
    Scene scene = new Scene(root, 550, 670);\nprimaryStage.setTitle(\"Lighting\");\n\
    primaryStage.setScene(scene);\n}\n```\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_64_0.png)\n\
    \nprivate Text text(double x, double y, Paint fill, Lighting light) {\n\n```java\n\
    Text text = new Text(\"Light\");\ntext.setFont(new Font(\"Liberation Sherif\"\
    , FontWeight.BOLD, FontPosture.REGULAR, 72));\ntext.setFill(fill);\ntext.setStroke(Color.BLACK);\n\
    text.setStrokeWidth(1);\ntext.setX(x - text.getBoundsInParent().getWidth() / 2);\n\
    text.setY(y + text.getBoundsInParent().getHeight() / 2);\ntext.setEffect(light);\n\
    return text;\n```\n\nprivate Circle circle(double x, double y, Paint fill, Lighting\
    \ light) {\n\n```java\nCircle circ = new Circle(x, y, 100, fill);\ncirc.setEffect(light);\n\
    return circ;\n```\n\n```java\npublic static void main(String[] args) {\n  launch(args);\n\
    }\n```\n\nThe two methods text() and circle() are similar to the corresponding\
    \ methods from earlier. You should primarily consider the method start() and here\
    \ to create light sources as Light objects as parameters for a Lighting object\
    \ that is an effect. Note that the specific Light classes are defined as inner\
    \ classes in the class.\n\n## PROBLEM 2\n\nTo experiment a little with light sources,\
    \ write an application that opens the following window:\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_66_0.png)\n\
    \nThe four circles mentioned from the left are using the light sources:\n\n- 1.\
    \ default\n- 2. distant\n- 3. spot\n- 4. point\n\nThe setting options are made\
    \ with Slider controls and ComboBox controls, and the names should explain the\
    \ meaning. A setting option does not necessarily have effect for all light sources,\
    \ but change a setting, the change must be reflected in the relevant shapes. As\
    \ for Color controls, they must be initialized with colors and I have enclosed\
    \ a color in the following wrapper class:\n\n```java\nclass ColorWrapper {\n \
    \   private Color color;\n    private String name;\n\n    public ColorWrapper(Color\
    \ color, String name) {\n        this.color = color;\n        this.name = name;\n\
    \    }\n}\n```\n\n```java\npublic Color getColor()\n{\n    return color;\n}\n\
    ```\n\n```java\npublic String getName()\n{\n    return name;\n}\n```\n\n```java\n\
    @Override\npublic String toString()\n{\n    return String.format(\"%s [%s]\",\
    \ name, color.toString());\n}\n```\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_67_0.png)\n\
    \n## We do not reinvent the wheel we reinvent light.\n\nFascinating lighting offers\
    \ an infinite spectrum of possibilities: Innovative technologies and new markets\
    \ provide both opportunities and challenges. An environment in which your expertise\
    \ is in high demand Enjoy the supportive working within our global group and benefit\
    \ from international career paths. Implement sustainable ideas in close cooperation\
    \ with other specialists and contribute to influencing our future. Come and join\
    \ us in reinventing light every day.\n\nLight is OSRAM\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_67_1.png)\n\
    \nYou can initialize the new ComboBox controls with an appropriate number of standard\
    \ colors (static objects in the class Color), but you can actually decide all\
    \ of them using the following method:\n\n```java\nprivate java.util.List<ColorWrapper>\
    \ getColors()\n{\n    java.util.List<ColorWrapper> list = new java.util.ArrayList();\n\
    \    try {\n        java.lang.reflect.Field[] fields = Color.class.getDeclaredFields();\n\
    \        for (java.lang.reflect.Field field : fields) {\n            if (java.lang.reflect.Modifier.isStatic(field.getModifiers())\
    \ &&\n                field.getType().equals(Color.class)) {\n               \
    \ Object obj = new Object();\n                obj = field.get(obj);\n        \
    \        list.add(new ColorWrapper((Color)obj, field.getName()));\n          \
    \  }\n        }\n    } catch (Exception ex) {\n        list.clear();\n    }\n\
    \    return list;\n}\n```\n"
  mdcn: "\n\n## JAVA 14: 使用 JAVAFX 开发应用程序：软件开发\n\n### 5.3 光 (LIGHT)\n\n在关于效果的章节介绍中，我列出了你可以应用的各种效果，在这里我并没有详尽说明所有的效果（也不会这样做），但我想用“光”这种效果作为本章的收尾。其原理是光源照射在图形上，而图形的颜色取决于光源的性质以及它相对于图形的位置。\n\
    \n通常，你可以通过 `Lighting` 对象将光照效果与图形相关联，如果你没有指定光源，则将使用默认光源，它对应于直接射入图形的光，导致边缘产生微弱的\
    \ 3D 效果。你也可以显式指定光源，共有三种选项：\n\n- 1. Light.Distant（远光）\n- 2. Light.Point（点光）\n-\
    \ 3. Light.Spot（聚光灯）\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_61_0.png)\n\n\
    ## JAVA 14: 使用 JAVAFX 开发应用程序：软件开发\n\n第一种对应于位于远处的光源，它从远程光源向一个方向发射光线：\n\n![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_62_0.png)\n\
    \n你可以设置两个值作为参数（均为 `double` 类型）：\n\n- 1. azimuth（方位），表示光源绕 z 轴旋转的角度。\n- 2. elevation（仰角），表示光源绕\
    \ x 轴旋转的角度。\n\n此外，你还可以指定光源的颜色。\n\n第二种选项是光源从某一点发射光，由 3 个坐标表示。光向所有方向扩散，与远光源一样，你可以指定光源的颜色。\n\
