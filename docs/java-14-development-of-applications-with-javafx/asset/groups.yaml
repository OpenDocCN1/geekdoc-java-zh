    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_94_1.png)\n\n例如，如果你点击绿色区域的某个位置，标准输出将显示以下内容：\n\
    \n- Stage - capturing\n- Scene - capturing\n- BorderPane - capture\n- StackPane\
    \ - capture\n- Rectangle - capture\n- Rectangle - bubbling\n- StackPane - bubbling\n\
