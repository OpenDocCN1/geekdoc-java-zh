    # EFFECTS


    JavaFX program, as mentioned, represents the content of the user interface as
    nodes in a scene graph. It is possible to change how the individual nodes are
    displayed using so-called effects, where an effect is an object that is used to
    modify how a node is to be drawn. It is primarily interesting for nodes, which
    represent graphic objects like images and geometric figures. This chapter is a
    brief introduction to these effects. Basically, the following effects represented
    as classes in the package javafx.scene.effect:


    +   - ColorAdjust, which can be used to modify the color of an image where you
    can adjust the hue, saturation, brightness and contrast.

    - ColorInput, which corresponds to drawing a rectangle, filled with a color.

    - ImageInput used to fill a rectangular area with an image.

    - Blend, which is used to combine pixels from two inputs.

    - Bloom, which is used to provide a portion of a node more hue.

    - Glow, which is used to increase the hue of a node.

    - BoxBlur, which is used to perform a blur operation on a node with a box filter.

    - GausienBlur,Blur, also used to perform a blur of a node, but instead using a
    kernel.

    - MotionBlur, which is a gaussian blur, where there is also an angle.

    - Reflection, which performs a reflection of a node.

    - SepiaTone, which tones a node with a brownish color.

    - Shadow, resulting in a shadow effect by a blur of edges.

    - DropShadow, where the shadow effect is created behind the node.

    - InnerShadow, where the shadow effect is created within the edge of the node.

    - Lighting, which is used to simulate a light effect, where you can indicate a
    light source as point, distance or sport.

    - Light.Distant, which is a variant of Lighting.

    - Light.Spot, which is a variation of Lighting.

    - Point.Spot, which is a variation of Lighting.


    As an example I show a program that adjusts the colors of an image. The program
    is named ColorAdjustProgram and opens the following window:'
