    # 8 STYLING


    From web applications you use cascading style sheets, and you can also use it
    in JavaFX. The idea is the same as for web application, namely to separate the
    definition of windows and their content from the presentation so you can change
    the look and feel of a program without changing the code. On the other hand, the
    syntax is a little different, and as web applications, the biggest challenge is
    to learn how styles can be written and what they are called. The subject appears
    best with an example, and the program StyleProgram opens the following window:


    ![](img/1e4e8c5aab4300ee5d8b230bc1305e5a_130_0.png)


    Do you like cars? Would you like to be a part of a successful brand? We will appreciate
    and reward both your enthusiasm and talent. Send us your CV. You will be surprised
    where it can take you.


    Send us your CV on www.employerforlife.com


    Download free eBooks at bookboom.com


    Click on the ad to read more'
