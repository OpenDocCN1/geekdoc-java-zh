  \n布尔变量默认为 `false`。\n\n## 异常处理\n\n程序可能会遇到运行时问题导致“异常”（exception）错误，这会停止其执行。通常，这是由意外的用户输入引起的。因此，一个编写良好的程序应该尝试预测用户在运行时引起异常的所有可能方式。\n\
  \n![image](img/pg76_1.jpg)\n\n可能出现异常的代码可以被识别并封装在 `try catch` 语句块中。这允许程序处理异常而不停止执行，其格式如下所示：\n\
  \n```java\ntry\n{\n    *可能出现异常的语句*\n}\ncatch( Exception e )\n{\n    *响应异常的语句*\n\
  }\n```\n\n`catch` 关键字后面的括号指定了要捕获的异常类，并将其赋值给变量“e”。顶层 `Exception` 类可以捕获所有异常。然而，可以使用多个\
  \ `catch` 语句来识别不同的底层异常类，从而为特定的异常提供响应。\n\n最常见的异常是 `NumberFormatException`（当程序遇到不符合预期数值类型的值时产生）以及\
  \ `ArrayIndexOutOfBoundsException`（当程序尝试访问超出索引范围的数组元素编号时产生）。为这些异常中的每一个创建一个单独的响应是有帮助，以便及时通知用户问题的性质。\n\
  \n可选地，`try catch` 语句块可以使用 `finally` 语句块进行扩展，其中包含始终将执行的代码——无论程序是否遇到异常。\n\n![image](img/hot.jpg)\n\
  \n`getMessage()` 方法返回有关已捕获异常的进一步信息。\n\n![image](img/1p.jpg)启动一个名为“Exceptions”的新程序，包含标准的\
  \ main 方法\n\n```java\nclass Exceptions\n{\n    public static void main ( String[]\
  \ args ) {    }\n}\n```\n\n![image](img/2p.jpg)在 main 方法中，使用 `try` 语句输出一个整数\n\n\
  ```java\ntry\n{\n    int num = Integer.parseInt( args[0] ) ;\n    System.out.println(\
  \ “You entered: “+ num );\n}\n```\n\n![image](img/3p.jpg)添加 `catch` 语句来处理在未提供参数运行时产生的异常\n\
  \n```java\ncatch( ArrayIndexOutOfBoundsException e )\n{\n    System.out.println(\
  \ “Integer required.” ;\n}\n```\n\n![image](img/4p.jpg)添加 `catch` 语句来处理在带有非整数参数运行时产生的异常\n\
  \n```java\ncatch( NumberFormatException e )\n{\n    System.out.println( “Argument\
  \ is wrong.” ;\n}\n```\n\n![image](img/5p.jpg)在程序末尾添加 `finally` 语句\n\n```java\n\
  finally { System.out.println( “Program ends.” ; }\n```\n\n![image](img/6p.jpg)将程序保存为\
  \ `Exceptions.java`，然后编译并运行程序，尝试引发异常\n\n![image](img/pg75_1.jpg)\n\n\n\n\n# 本章演示了如何使用各种\
