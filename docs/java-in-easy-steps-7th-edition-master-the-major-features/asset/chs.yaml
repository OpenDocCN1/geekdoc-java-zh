  \ 包有一个名为“Arrays”的类，它拥有可以用于操作数组的方法。通过在 `.java` 文件的开头包含 `import` 语句，可以让该功能对程序可用。在语句\
  \ `import java.util.* ;` 中可以使用通配符字符表示“所有类”。\n\n*(注：原文中存在大量重复段落，已根据要求去重保留核心内容)*\n\
  \n\n\n通过向列表的 `set()` 方法传递索引数字和新值作为参数，可以修改元素值。通过向列表的 `add()` 方法传递索引数字和值作为参数，可以在列表的特定位置添加元素。列表通过沿索引移动元素值来扩展以容纳额外的元素。\n\
  \n`ArrayList` 对象仅使用 `new` 关键字即可创建，但与其它 Java 集合一样，该语句必须指定列表可能包含的泛型项目类型。通常，一个列表可能包含\
  \ `String` 类型的项，因此 `ArrayList` 必须带有 `<String>` 后缀。\n\n集合（如 `ArrayList`）拥有一个 `forEach()`\
  \ 方法，该方法可以遍历列表中的每个元素。这使得遍历列表中包含的所有项变得简单。\n\n通过指定一个“Lambda 表达式”作为 `forEach()` 方法的参数，可以方便地轮流引用每个存储的列表项。Lambda\
  \ 表达式仅仅是短小的、匿名（未命名）方法，可以在它们要执行的地方指定。它们以括号开始，用于包含任何参数，然后跟上 `->` 字符序列，最后是语句块，语法如下：\n\
  \n```\n(*argument/s*) -> { *statement/s* }\n```\n\n参数的数据类型可以显式声明，也可以从上下文中推断——`(String\
  \ x)` 可以简单写为 `(x)`。此外，如果 Lambda 表达式语句块只包含一条语句，可以省略大括号。\n\n使用列表的 `forEach()` 方法，迭代中的当前元素值可以作为参数传递给\
  \ Lambda 表达式，然后通过其语句在输出中显示。\n\n![image](img/hot.jpg)\n\n你可以通过调用其 `size()` 方法来发现列表当前有多少个元素。\n\
