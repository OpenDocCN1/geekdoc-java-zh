  \n![image](img/forget.jpg)\n\n组件在构造函数之前声明，因此它们对于事件处理方法是全局可用的。\n\n![image](img/hot.jpg)\n\
  \n在用户执行所需操作之前禁用组件，有时是有用的。\n\n\n\n\n## KeyListener\n\n允许用户输入文本的 Swing 组件可以通过 `KeyListener`\
  \ 接口识别用户的按键击击，该接口会将 `KeyEvent` 事件传递给以下三个事件处理方法：\n\n| 事件处理器: | 描述: |\n| :--- | :---\
  \ |\n| `keyPressed( KeyEvent )` | 当按键被按下时调用 |\n| `keyTyped( KeyEvent )` | 在按键被按下后调用\
  \ |\n| `keyReleased( KeyEvent )` | 当按键释放时调用 |\n\n当程序实现 `KeyListener` 接口时，必须声明这三个方法——即使它们并不全部都被实际使用。\n\
  \n`KeyEvent` 对象拥有一个 `getKeyChar()` 方法，该方法返回该按键的字符；以及 `getKeyCode()` 方法，它返回表示该按键的整数\
  \ Unicode 值。此外，`getKeyText()` 方法接收键码作为参数并返回该按键的描述。\n\n![image](img/1r.jpg)从这里编辑一份\
  \ `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Keystrokes”。然后，添加初始语句以导入 `java.awt.event`\
  \ 包的功能。\n\n```\nimport java.awt.event.* ;\n```\n\n![image](img/common.jpg)\n\nKeystrokes.java\n\
  \n![image](img/2r.jpg)修改类声明，为程序添加 `KeyListener` 接口\n\n```java\nclass Keystrokes\
  \ extends JFrame implements KeyListener\n```\n\n![image](img/3r.jpg)在 `Keystrokes()`\
  \ 构造函数之前，创建一个 `JTextField` 组件和一个 `JTextArea` 组件\n\n```java\nJTextField field = new\
  \ JTextField( 38 ) ;\nJTextArea txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](img/4r.jpg)插入语句将这两个组件添加到\
  \ `JPanel` 容器中\n\n```java\npnl.add( field ) ;  pnl.add( txtArea ) ;\n```\n\n![image](img/5r.jpg)在\
  \ `Keystrokes()` 构造函数中，插入一条语句使 `JTextField` 组件生成 `KeyEvent` 事件\n\n```java\nfield.addKeyListener(\
