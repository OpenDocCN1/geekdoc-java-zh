  \n### 读取控制台输入\n\n`java.io` 包允许程序从命令行读取输入 – 与用户交互。正如 `System.out` 字段可以将输出发送到命令行一样，`System.in`\
  \ 字段可以使用 `InputStreamReader` 对象从命令行读取内容。这以字节形式读取输入，并将其转换为代表 Unicode 字符值的整数值。\n\n\
  ![image](img/pg118_1.jpg)\n\n为了读取整整行输入文本，`BufferedReader` 对象的 `readLine()` 方法会读取由\
  \ `InputStreamReader` 解码的字符。此方法必须在 `try catch` 语句内部调用，以捕获任何 `IOException` 问题。\n\n\
  通常情况下，`readLine()` 方法会将输入赋值给 `String` 变量供程序处理。\n\n![image](img/1v.jpg)启动一个新程序，导入所有\
  \ `java.io` 类的功能\n\n```\nimport java.io.* ;\n```\n\n![image](img/common.jpg)\n\n\
  ReadString.java\n\n![image](img/2v.jpg)添加一个名为“ReadString”的类，包含标准的 main 方法\n\n```\n\
  class ReadString\n{\n    public static void main( String[] args ) {           }\n\
  }\n```\n\n![image](img/3v.jpg)在 main 方法的大括号之间，插入一个语句输出提示用户输入的消息\n\n```java\nSystem.out.print(\
  \ “Enter the title of this book: “ ) ;\n```\n\n![image](img/4v.jpg)添加一个创建一个 `InputStreamReader`\
  \ 对象的语句，允许从命令行读取输入\n\n```java\nInputStreamReader isr = new InputStreamReader( System.in\
  \ ) ;\n```\n\n![image](img/5v.jpg)创建一个 `BufferedReader` 对象来读取解码后的输入\n\n```java\n\
  BufferedReader buffer = new BufferedReader( isr ) ;\n```\n\n![image](img/6v.jpg)声明并初始化一个空的\
  \ `String` 变量用于存储输入\n\n```java\nString input =“ ;\n```\n\n![image](img/7v.jpg)添加\
  \ `try catch` 语句从命令行读取输入并存入变量\n\n```java\ntry\n{\n    input = buffer.readLine()\
