  \n该事件处理器中的算法在数组中打乱 1-59 的整数，然后将这些整数的前六个元素赋值给字符串。\n\nLotto 程序以 import 语句开头，以使 Swing\
  \ 组件和 `ActionListener` 接口可用。\n\n![image](img/pg169_1.jpg)\n\n### 组件\n该程序包含一个单一面板组件，其中包含一个显示图像的标签组件、一个显示输出的文本字段组件和一个用于用户交互的按钮组件。\n\
  \n### 构造函数\n`Lotto()` 构造函数构建了一个简单的 Swing 界面，将面板加载到尺寸为 260 x 210 的窗口框架中。\n\n![image](img/pg169_2.jpg)\n\
  \n`Lotto.png` – 格子区域是透明的。\n\n### 事件处理器\n按钮的事件处理器方法执行一种算法，在 1-59 范围内选择六个唯一的随机数，并显示在文本字段组件中。\n\
  \n### 入口点\n`main()` 方法创建应用的实例，并调用 `ClassLoader()` 在程序文件相同的目录下查找图像文件资源 `Lotto.png`。在尝试编译程序之前，必须按照这种方式安排文件。\n\
  \n![image](img/pg169_3.jpg)\n\n![image](img/hot.jpg)\n\nLotto 程序在本章中被用于为桌面和手持设备创建应用。\n\
  \n观察所需的文件安排，可以使用通常方式使用 `javac` 编译器创建 `Lotto.class` 文件，然后可以使用 `java` 解释器执行程序：\n\n\
  ![image](img/pg169_4.jpg)\n\n![image](img/pg169_5.jpg)\n\n### 分发程序\nLotto 程序会打开一个指定大小的新窗口，其中包含\
  \ Swing 界面组件。用户每点击一次推按钮，其事件处理器就会文本字段组件中显示 1-59 范围内的六个新随机数：\n\n![image](img/pg170_1.jpg)\n\
  \n![image](img/pg170_2.jpg)\n\n与书中的其他示例一样，Lotto 程序在此处为 Java 编译，并可以分发到带有适当 Java 运行时环境\
  \ (JRE) 的其他计算机上执行——无论其操作系统是什么。例如，在下方的图中，`Lotto.class` 和 `Lotto.png` 文件已复制到运行 Linux\
  \ 操作系统且安装了 Java 运行时的计算机桌面上。因此，Lotto 程序可以用与原始 Windows 系统相同的方式通过 `java` 解释器执行。\n\n\
  ![image](img/pg170_3.jpg)\n\n![image](img/pg170_4.jpg)\n\n![image](img/hot.jpg)\n\
  \n分发程序时不需要包含 `.java` 源代码文件——只需要 `.class` 和资源文件。\n\n然而，分发程序存在一种危险——`jar` 工具提供将多个文件打包到单个归档的方法。`jar`\
  \ 工具创建一个 ZIP 归档，这是一种文件的压缩格式。\n\n![image](img/pg169_1.jpg)\n\n`jar` 工具是 Java 开发工具包\
  \ (JDK) 的，用于创建、提取和管理 Java 存档文件。\n\n### 常用 jar 命令\n\n| 命令 | 说明 |\n| :--- | :--- |\n\
  | `jar cf archive.jar file1 file2` | 创建新归档 |\n| `jar xf archive.jar` | 从归档中提取所有文件\
  \ |\n| `jar tf archive.jar` | 列出归档内容 |\n| `jar u archive.jar file1` | 用新文件更新现有归档\
  \ |\n| `jar d archive.jar file1` | 从归档中删除文件 |\n| `jar cvf archive.jar file1` | 创建带有详细输出的归档\
  \ |\n| `jar xvf archive.jar` | 带详细输出提取文件 |\n| `jar ttf archive.jar` | 带详细输出列出内容\
  \ |\n| `jar ju archive.jar file1` | 带详细输出更新归档 |\n| `jar jd archive.jar file1` |\
  \ 带详细输出删除文件 |\n| `jar cmf archive.jar manifest.txt` | 创建带有自身清单文件的归档 |\n| `jar xfm\
  \ archive.jar` | 使用清单文件提取文件 |\n| `jar tfm archive.jar` | 使用清单文件列出内容 |\n| `jarjum\
  \ archive.jar file1` | 使用清单文件更新归档 |\n| `jar jdm archive.jar file1` | 使用清单文件删除文件\
  \ |\n\n`jar` 工具对于打包 Java 程序，特别是那些需要多个类的程序。\n\n### 构建归档\n按照以下步骤为 Lotto 程序创建 JAR：\n\
  \n![image](img/1g.jpg)\n\n打开命令行窗口，然后导航到 Lotto 文件所在的目录——`Lotto.class` 和 `Lotto.png`。\n\
  \n![image](img/pg172_1.jpg)\n\nLotto.jar\n\n![image](img/2g.jpg)\n\n输入 `jar cfe\
  \ Lotto.jar Lotto.class Lotto.png`，然后按回键创建 `Lotto.jar` 归档。\n\n- `c`: 创建归档。\n- `f`:\
  \ 指定归档文件名。\n- `e`: 指定入口点（主类）。\n\n![image](img/3g.jpg)\n\n接下来，输入 `jar tf Lotto.jar`\
  \ 查看 JAR 的所有内容。\n\n![image](img/pg172_2.jpg)\n\n注意 `jar` 工具会在存档文件旁边创建一个 `META-INF`\
  \ 目录。它包含一个名为 `MANIFEST.MF` 的文本清单文件，你可以检查：\n\n![image](img/4g.jpg)\n\n现在，输入 `jar\
  \ xf Lotto.jar META-INF` 提取 `META-INF` 目录的副本。\n\n![image](img/5g.jpg)\n\n最后，在 Windows\
  \ 上输入 `type META-INF\\MANIFEST.MF` 或在 Linux/macOS 上输入 `cat META-INF/MANIFEST.MF`\
  \ 查看存档文件内的文本。\n\n输出应该如下：\n\n```\nManifest-Version: 1.0\nMain-Class: Lotto\n```\n\
  \n`Main-Class` 属性指定了执行文件。\n\n### 部署应用\nJava JAR 文件可以在安装了适当版本 Java 运行时的系统上执行：\n\n\
  ![image](img/1g.jpg)\n\n在命令行中，导航到 `Lotto.jar` 文件所在的目录，然后输入 `java -jar Lotto.jar`\
  \ 并按回键运行 Lotto 应用。\n\n![image](img/pg173_1.jpg)\n\n![image](img/pg173_2.jpg)\n\n\
  ![image](img/pg173_3.jpg)\n\n![image](img/pg173_4.jpg)\n\n![image](img/pg173_5.jpg)\n\
  \n![image](img/2g.jpg)\n\n或者，双击或右键点击 `Lotto.jar` 文件图标，并选择“打开方式”使用 Java 运行时。\n\n\n\
  \n\n\n![image](img/pg173_8.jpg)\n\n![image](img/snake.jpg)\n\n从提示符中执行 JAR 文件时，需要\
  \ `.jar` 文件扩展名。\n\n![image](img/hot.jpg)\n\n将 JRE 设置为系统上的默认 JAR 文件处理程序，以实现永久的双击执行。\n\
  \n## 创建 Android 项目\n\n在手持设备上广泛使用的 Android 操作系统包含了一组核心库，这些库提供了 Java 编程语言中大部分功能的支持。这意味着\
  \ Java 程序可以很容易地转换为 Android 程序。\n\n![image](img/pg174_1.jpg)\n\n你可以从 [developer.android.com/studio](http://developer.android.com/studio)\
  \ 免费获取 Android Studio。\n\n本章描述了使用编写时可最新版本的 Android Studio 进行 Android 应用开发——其他版本的说明可能会有所不同。\n\
  \nAndroid 应用开发最好使用官方的 Android Studio 集成开发环境 (IDE)。它提供了一个统一的环境，你可以在其中为所有 Android\
  \ 设备开发应用，并提供了广泛的测试工具。完成的程序以 Android 应用包（APK）归档文件的形式发布，这类似于 Java 归档（JAR）文件。它使用流行的\
  \ ZIP 格式将所有程序文件压缩成带有 `.apk` 文件扩展名的单个文件。每个应用首先在 Android Studio 中被创建一个“项目”，开发者向其中添加代码和资源：\n\
  \n![image](img/1g.jpg)启动 Android Studio，然后在“欢迎”对话框选项中选择 **Start a new Android Studio\
  \ project**（启动一个新的 Android Studio 项目）——打开“选择你的项目”对话框\n\n![image](img/2g.jpg)选择目标设备类型和活动类型——通常选择“Phone\
  \ and Tablet”（手机和平板）和“Empty Activity”（空活动）\n\n![image](img/pg174_2.jpg)\n\n![image](img/3g.jpg)点击\
  \ **Next**（下一步）打开“配置你的项目”对话框\n\n![image](img/pg175_1.jpg)\n\n![image](img/8g.jpg)选择运行应用所需的\
  \ **Minimum API level**（最低 API 级别）（“Ice Cream Sandwich”是默认值）\n\n![image](img/9g.jpg)点击\
  \ **Finish**（完成）按钮使用指定的配置创建 Android 项目\n\n![image](img/10g.jpg)等待 Android Studio\
  \ 现在为新项目生成几个文件和文件夹（这可能需要一些时间），最终你将看到 IDE 界面出现\n\n![image](img/hot.jpg)\n\n如果你希望应用运行在\
  \ Google Play 商店活跃的 100% 设备上，请选择 API 15。\n\n## 探索项目文件\n\nAndroid Studio IDE 提供了一个\
  \ Project 窗口，显示项目内所有文件和文件夹的可展开树状视图。\n\n![image](img/pg176_1.jpg)\n\n你可以点击 Project\
  \ 窗口中的任何箭头来展开文件夹，并双击 Project 窗口中的任何文件以在标签页 Editor 窗口中打开它。\n\n![image](img/pg176_2.jpg)\n\
  \n尽管最初看起来很复杂，但开发者只需修改两个文件即可创建一个自定义的应用程序：\n\n• `MainActivity.java` – 用于将控件加载到应用界面的\
  \ Java 文件，并可以包含事件处理代码，以响应应用界面内的用户操作。\n\n• `activity_main.xml` – 用于定义应用界面中显示的每个控件及其布局的\
  \ XML 文件。\n\n![image](img/hot.jpg)\n\n如果 Project 窗口没有立即显示，点击左侧边栏中的 Project 按钮，或使用快捷键\
  \ `Alt + F1` 打开。\n\n在 Project 窗口中选择 `activity_main.xml` 文件将会在 Editor 窗口中以两种可能的视图之一显示——视觉上的\
  \ Design（设计）视图，或程序化的 Text（文本）视图。窗口底部有标签页用于切换这些视图。\n\n![image](img/pg177_1.jpg)\n\
  \nDesign 视图提供了一个控件面板（Palette），可以将其拖到应用的图形化表示上；一个用于选择任何添加控件的组件树（Component Tree），以及一个用于修改所选控件外观的属性窗口。\n\
  \nText 视图提供了布局的“后置代码”版本，使用 XML 属性描述所添加控件的每个方面。\n\n![image](img/pg177_2.jpg)\n\n\
  控件可以在 Design 视图中通过视觉方式添加并修改，也可以在 Text 视图中通过程序方式进行。\n\n## 添加资源与控件\n\n### 图像资源\n\n\
  要开始为 Lotto 程序自定义默认的 Android Studio 空应用，首先可以将图像作为“资源”添加：\n\n![imageimage](img/pg178_1.jpg)\n\
  \n![image](img/1g.jpg)右键点击 `Lotto.png` 图像，并选择 **Copy**（拷贝）\n\n![image](img/2g.jpg)接下来，右键点击\
  \ Project 窗口中的 `app>res>drawable` 文件夹，并选择 **Paste**（粘贴）\n\n![image](img/3g.jpg)选择目标目录，然后将文件重命名为小写的\
  \ `lotto.png`\n\n![image](img/pg178_2.jpg)\n\n![image](img/4g.jpg)点击 **OK** 查看文件现在出现在\
  \ `drawable` 文件夹中\n\n![image](img/pg178_3.jpg)\n\n![image](img/snake.jpg)\n\nAndroid\
  \ 资源项仅支持小写文件名。\n\n![image](img/pg178_4.jpg)\n\n### 界面控件\n\nLotto 应用需要在垂直布局三个界面控件——用于\
  \ Logo 的 `ImageView` 控件、用于输出的 `TextView` 控件，以及用于用户交互的 `Button` 控件。\n\n![image](img/2g.jpg)在\
  \ Text 视图中打开 `activity_main.xml` 文件\n\n![image](img/1g.jpg)在现有的默认 TextView 元素之前插入此\
  \ `ImageView` 控件\n\n```xml\n<ImageView\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:srcCompat=\"@drawable/lotto\"\
  \n    android:id=\"@+id/imageView\"\n    android:contentDescription=\"Lotto Logo\"\
  \n    android:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n![image](img/hot.jpg)`app:srcCompat`\
  \ 属性引用添加到 `drawable` 文件夹的图像资源。该元素中的属性使控件适应布局宽度，并将控件放置在容器的顶部。图像被赋予了一个 id 以供其他元素引用。\n\
  \n![image](img/3g.jpg)编辑现有的 TextView 元素如下如下：\n\n```xml\n<TextView\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\
  \n    android:height=\"60dp\"\n    android:textSize=\"36sp\"\n    android:gravity=\"\
  center_horizontal\"\n    android:layout_constraintTop_toBottomOf=\"@+id/imageView\"\
  \ />\n```\n\n![image](img/4g.jpg)在 TextView 元素之后插入此 `Button` 元素\n\n```xml\n<Button\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/button\"\n    android:textSize=\"24sp\"\n    android:onClick=\"\
  lotto\"\n    android:text=\"GET MY NUMBERS\"\n    android:layout_constraintTop_toBottomOf=\"\
  @+id/textView\" />\n```\n\n![image](img/hot.jpg)每个元素中的 `android:id` 属性指定 Java 代码引用的唯一名称。`android:onClick`\
  \ 属性指定了要调用的事件处理器名称。\n\n### 字符串资源\n\n描述图像内容和指定按钮文本的字符串应分别转换为字符串资源：\n\n![image](img/1g.jpg)点击“Lotto\
  \ Logo”字符串赋值使其聚焦，然后按 `Alt + Enter` 显示 QuickFix 对话框\n\n![image](img/pg179_1.jpg)选择\
  \ **Extract string resource**（提取字符串资源），然后在现在出现的“Extract Resource”对话框中提供资源名称\n\n\
  ![image](img/pg179_2.jpg)点击 **OK** 关闭对话框，并看到分配的字符串被替换为新字符串资源的引用\n\n![image](img/pg179_3.jpg)对“GET\
  \ MY LUCKY NUMBERS”字符串重复此操作\n\n![image](img/pg179_4.jpg)\n\n**插入 Java 代码**\n\n\n\
  \n\n\n在添加此处所示的资源和控件后，应用界面现在应该看起来像 `Lotto.jar` 应用程序：\n\n![image](img/pg180_1.jpg)\n\
  ![image](img/pg180_2.jpg)\n![image](img/snake.jpg)\n\n如果控件看起来与此截图不符，您应该返回此处并仔细检查每个元素的属性。\n\
  \n接下来，可以通过在 `MainActivity.java` 文件中插入一个事件处理器（eventhandler）来为应用添加功能，当用户按下按钮时，它将响应按钮的\
  \ `onClick` 事件。此事件会自动向事件处理器传递一个参数，该参数是所点击控件的标识引用。因此，事件处理器的签名必须通过包含一个 `View` 类的参数（所有小部件的基类）来适应该参数。该方法还必须具有\
  \ `void` 返回类型：\n\n![image](img/1g.jpg)首先在 `MainActivity.java` 文件开头的 import 语句中添加此行\n\
  \n```java\nimport android.view.View ;\n```\n\n![image](img/common.jpg)\n\nMainActivity.java\n\
  \n![image](img/2g.jpg)将此事件处理器签名插入到 `MainActivity` 类中，紧接在其 `onCreate( )` 方法块之后\n\n\
  ```java\npublic void lotto( View vue ) { }\n```\n\n在代码中可以通过指定它们的身份作为 `findViewById(\
  \ )` 方法的参数来引用界面控件。这是在 `activity_main.xml` 中分配给它们的 `android:id` 属性的名称，前加上 `R.id.`\
  \ ：\n\n![image](img/3g.jpg)在事件处理器块内部，将 `<TextView>` 控件元素的赋值赋值变量\n\n```java\nTextView\
  \ txt = (TextView) findViewById( R.id.textView ) ;\n```\n\n![image](img/4g.jpg)最后，在事件处理器块内部，从\
  \ `Lotto.java` 程序中的事件处理器（列在此处）中复制输出六个唯一随机数的代码\n\n```java\nint[ ] nums = new int[\
  \ 60 ] ; String = “ ” ; str\nfor ( int i = 1 ; i < 60 ; i++ ) { nums[ i ] = i ;\
  \ }\nfor ( int i = 1 ; i < 60 ; i++ ) {\n    int r= ( int ) ( 59 * Math.random(\
  \ ) ) + 1 ;\n    int t= nums[ i ] ; nums[ i ]= nums[ r ] ; nums[ r ]= t ;\n}\nfor\
  \ ( int i = 1 ; i < 7 ; i++ ) {\n    str += “ ” + Integer.toString( nums[ i ] )\
  \ + “ ” ;\n}\ntxt.setText( str ) ;\n```\n\n![image](img/forget.jpg)\n\n在这种情况下，代码不需要检查调用源，因为事件处理器是通过\
  \ `activity_main.xml` 中的 `android:onClick` 属性显式分配给按钮的。现在 Lotto 应用已拥有所有的资源、控件和功能代码，可以尝试进行构建：\n\
  \n![image](img/5g.jpg)在 Android Studio 工具栏上，点击 `View`、`Tool Windows`、`Build` ——\
  \ 打开“Build”窗口\n\n![image](img/6g.jpg)然后，点击 `Build`、`Make Project`（或按 `Ctrl` + `F9`\
  \ 快捷键）开始构建 —— 在“Build”窗口中查看其进度\n\n![image](img/pg181_1.jpg)\n![image](img/7g.jpg)点击“Toggle\
  \ View”按钮查看构建成功或失败的确认\n\n![image](img/pg181_2.jpg)\n![image](img/8g.jpg)修复任何报告的错误，然后重新构建，直到看到成功确认\n\
  \n![image](img/hot.jpg)如果构建尝试失败，请查找代码中的红色灯泡图标 —— Android Studio 添加这些图标是为了让您轻松找到并纠正错误。\n\
  \n### 测试应用程序\n\n一旦应用项目构建成功，就可以进行测试了。测试可以在通过 USB 连接到电脑的真实 Android 设备上进行，也可以在虚拟设备\
  \ (AVD) 模拟器上进行。AVD 允许您测试应用在系列设备上的性能，但它们使用更多系统资源，且速度可能慢得惊人。应用程序应该在至少一台手机设备和一个平板电脑上测试：\n\
  \n![image](img/1g.jpg)点击 `Run`、`Run ‘app’`（或按 `Shift` + `F10` 快捷键）打开“Select Deployment”对话框\n\
