  \n## 数字舍入\n\n`java.lang` 包中的 `Math` 类提供了三种将浮点数舍入到最近整数的方法。其中最简单的是 `Math.round()`\
  \ 方法，它将参数指定的数字向上或向下舍入到最近的整数。\n\n![image](img/pg84_1.jpg)\n\n`Math.floor()` 方法向下取整到整数，而\
  \ `Math.ceil()` 方法向上取整到整数。虽然 `Math.round()` 方法返回 `int` 数据类型，但 `Math.floor()` 和 `Math.ceil()`\
  \ 方法都返回 `double` 数据类型。\n\n![image](img/1o.jpg)启动一个名为“Round”的新程序，包含 main 方法\n\n```java\n\
