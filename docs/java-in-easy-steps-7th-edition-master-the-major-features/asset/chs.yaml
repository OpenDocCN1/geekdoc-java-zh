  \n![image](img/forget.jpg)\n\n`static` 关键字声明类变量和类方法——在这种情况下，它们是 `Car` 类的成员。\n\n\
  ![image](img/hot.jpg)\n\n对象类通常在包含 main 方法的程序类之前创建。\n\n## 生成对象实例\n\n每个类都有一个内置的“构造”方法，可用于创建该类的新实例。构造方法的方法与类名相同，并使用\
