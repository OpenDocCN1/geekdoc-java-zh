  \n`java.lang` 包中的 `String` 类提供了 `startsWith()` 和 `endsWith()` 方法来比较 `String` 值的部分。这些方法在比较多个\
  \ `String` 值并选择具有相同开头或相同结尾的字符串时特别有用。当 `String` 部分与指定的参数匹配时，该方法返回 `true`；否则返回 `false`。\n\
  \n![image](img/pg92_1.jpg)\n\n通过将要复制的第一个字符的位置号作为其 `substring()` 方法的参数，可以复制 `String`\
  \ 值的一个部分。这将返回原始 `String` 值的子字符串，从指定的起始位置开始，到原始 `String` 的末尾结束。\n\n可选地，`substring()`\
  \ 方法可以接受第二个参数，以指定要复制的最后一个字符的位置号。这将返回原始 `String` 值的子字符串，从指定的起始位置开始，到指定的结束位置结束。\n\n\
  可以搜索 `String` 值以找到作为其 `indexOf()` 方法参数的字符或子字符串。不同寻常的是，该方法返回匹配的字符或子字符串在所搜索的 `String`\
  \ 值中首次出现的数字位置。如果未找到匹配项，该方法返回负整数值 -1。\n\n![image](img/1o.jpg)创建一个名为“StringSearch”的新程序，包含标准的\
