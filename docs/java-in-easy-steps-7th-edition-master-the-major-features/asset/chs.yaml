  \ 方法是否失败——因为它返回的是整数值，而不是布尔值。\n\n### 操作字符\n\n`java.lang` 包中的 `String` 类提供了 `trim()`\
  \ 方法，用于移除指定参数的 `String` 首尾的空白字符。该方法将移除所有的额外空格、换行和制表符，返回处理后的 `String`。\n\n![image](img/pg94_1.jpg)\n\
  \n通过将其在 `String` 中的索引位置作为其 `charAt()` 方法的参数，可以访问 `String` 中的单个字符。该方法将 `String` 视为字符数组，第一个字符位于位置零——就像其他从零开始索引的数组一样。`String`\
  \ 的第一个字符可以通过 `charAt(0)` 访问，第二个字符可以通过 `charAt(1)` 访问，依此类推。\n\n由于字符索引从零开始，`String`\
  \ 的最后一个字符的索引总是比 `String` 中的字符总数少一。这意味着任何 `String` 的最后一个字符的索引号等于 `length() - 1`。因此，一个名为“str”的\
  \ `String` 的最后一个字符可以通过 `str.charAt( str.length() - 1 )` 访问。\n\n\n\n\n\n`String`\
  \ 中所有特定字符的出现都可以使用其 `replace()` 方法替换为另一个字符。该方法需要两个参数，分别指定要替换的字符和取而代之的字符。例如，要将所有的字母“a”替换为字母“z”，语法为\
  \ `replace( ‘a’ , ‘z’ )`。\n\n`isEmpty()` 方法可以用于检测 `String` 是否不包含任何字符。如果 `String`\
  \ 完全为空，该方法将返回 `true`，否则将返回 `false`。\n\n![image](img/1o.jpg)启动一个名为“CharacterSwap”的新程序，其中包含标准的\
