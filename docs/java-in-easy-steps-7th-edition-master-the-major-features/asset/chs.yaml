  \ Lotto 应用\n\n![image](img/3g.jpg)按下应用按钮，查看 `TextView` 内容在较小设备上如何换行\n\n![image](img/pg182_2.jpg)编辑\
  \ `activity_main.xml` 以缩小字体大小 `android:textSize=”26sp”`\n\n![image](img/5g.jpg)点击\
  \ `Build`、`Rebuild Project` 以应用更改，然后在模拟器中再次运行应用以查看解决方案\n\n![image](img/pg182_3.jpg)\n\
  ![image](img/7g.jpg)选择一个 AVD 手机模拟器进行连接，然后点击 `OK` 将 Lotto 应用安装到模拟器上\n\n![image](img/pg182_2.jpg)\n\
  ![image](img/2g.jpg)选择一个 AVD 手机模拟器进行连接，然后点击 `OK` 将 Lotto 应用安装到模拟器上\n\n![image](img/3g.jpg)按下应用按钮，查看\
  \ `TextView` 内容在较小设备上如何换行\n\n![image](img/pg182_2.jpg)编辑 `activity_main.xml` 以缩小字体大小\
  \ `android:textSize=”26sp”`\n\n![image](img/5g.jpg)点击 `Build`、`Rebuild Project`\
  \ 以应用更改，然后在模拟器中再次运行应用以查看解决方案\n\n![image](img/pg182_3.jpg)\n![image](img/7g.jpg)选择一个\
  \ AVD 手机模拟器进行连接，然后点击 `OK` 将 Lotto 应用安装到模拟器上\n\n![image](img/pg182_2.jpg)\n![image](img/2g.jpg)选择一个\
