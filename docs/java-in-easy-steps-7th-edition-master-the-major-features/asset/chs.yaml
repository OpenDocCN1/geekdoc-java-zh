  \n![image](img/pg86_2.jpg)\n\n![image](img/hot.jpg)\n\n描述的彩票程序将此示例中的三个步骤合并到一个语句中。\n\
  \n可以使用 `Math.random()` 生成一组 1-59 范围内内的六个不重复的随机数，以产生随机彩票选择。\n\n![image](img/1o.jpg)创建一个名为“Lottery”的新程序，包含标准的\
  \ main 方法\n\n```java\nclass Lottery\n{\n    public static void main ( String[] args\
  \ ) { }\n}\n```\n\n![image](img/common.jpg)\n\nLottery.java\n\n![image](img/2o.jpg)在\
