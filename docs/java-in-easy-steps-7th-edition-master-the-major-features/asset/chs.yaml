  \ `Lottery.java`，然后编译并运行程序查看输出\n\n\n\n\n\n`java.lang` 包中的 `String` 类提供了实用的 `equals()`\
  \ 方法，该方法在此处被引入，用于评估 `args[0]` 元素中的命令行参数。也可以通过使用点符号法将方法名附加到第一个 `String` 变量上，并指定要比较的\
  \ `String` 作为其参数，用来比较任何两个 `String` 值。例如，比较 `txt2` 和 `txt1` 的语法是 `txt1.equals( txt2\
  \ )`。当两个 `String` 值都具有相同的字符且顺序相同时，该方法返回 `true`；否则返回 `false`。\n\n![image](img/pg90_1.jpg)\n\
  \n使用不同字母大小写的 `String` 值（例如“Java”和“JAVA”）不被认为是相等的，因为字符的 ASCII 码值不同。例如，大写字母“A”的值为\
  \ 65，而小写字母“a”的值为 97。\n\n在将用户输入的 `String` 值（用户输入的字母大小写不确定）与程序中的 `String` 值进行比较时，通常将输入转换为特定的大小写非常有用。为了此目的，`String`\
  \ 类提供了 `toUpperCase()` 方法和 `toLowerCase()` 方法。将输入的 `String` 指定为参数，该方法返回转换后的 `String`。\n\
  \n一个典型的示例是将用户输入的密码 `String` 强制转换为小写，然后将其与程序中以全小写存储在 `String` 变量中的正确密码进行比较。这将允许用户在允许忽略大小写的情况下，以大写、小写或大小写混合输入密码。\n\
  \n点符号允许将方法附加到其他方法上，以便按顺序执行这些操作。这意味着可以使用 `toLowerCase().equals()` 将一个 `String` 值转换为小写，然后将该小写版本与指定的参数进行比较。\n\
  \n![image](img/snake.jpg)\n\n请确保在 `toUpperCase` 和 `toLowerCase` 方法中使用大写字母“C”来正确的大小写。\n\
