- "# Java 入门指南，第7版：精通主要功能\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\n\
  ![image](img/title.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 前言\n\n本书的创作为我 Mike McGrath\
  \ 了一个了一个利用最新技术更新我 Java 书籍的好机会。\n\n### 书中的约定\n\n为了清晰书中列出的代码，我采取了特定的颜色约定。Java 语言本身的组件为蓝色；程序员指定的名称为红色；数值和字符串为黑色；注释为绿色，如下：\n\
  \n```java\n// 存储并输出一个字符串\nString message = \"Welcome to Java programming!\";\nSystem.out.println(message);\n\
  ```\n\n此外，为了识别书中描述的每个源代码文件，步骤旁侧会出现一个彩色图标和文件名，如下：\n\n![image](img/j1.jpg)\nApp.java\n\
  \n![image](img/j2.jpg)\nApp.class\n\n![image](img/j3.jpg)\nApp.jar\n\n![image](img/j4.jpg)\n\
  App.xml\n\n![image](img/j5.jpg)\nApp.html\n\n![image](img/j6.jpg)\nApp.jnlp\n\n\
  ### 获取源代码\n\n为了方便起见，我将书中示例的所有源代码文件放置在单个 ZIP 存档中。你可以按照以下简单步骤获取完整存档：\n\n![image](img/1g1.jpg)\n\
  浏览到 **[www.ineasysteps.com](http://www.ineasysteps.com)**，然后导航到 Free Resources（免费资源）并选择\
  \ Downloads（下载）部分\n\n![image](img/2g1.jpg)\n在列表中找到 Java in easy steps, 7th Edition，然后点击标题为\
  \ All Code Examples（所有代码示例）的超链接\n\n![image](img/3g1.jpg)\n现在，将存档内容解压到计算机上的任何方便位置\n\
  \n*Mike McGrath*\n\n1\n\n**开始学习**\n\n***欢迎来到 Java 编程精彩的世界。本章将展示如何创建和运行简单的 Java 程序，并演示如何在程序中存储数据。***\n\
  \n\n\n\n\n## 简介\n## 安装 JDK\n## 编写第一个 Java 程序\n### 编译与运行程序\n## 创建变量\n## 识别数据类型\n\
  ## 创建常量\n## 添加注释\n# 故障排排除\n## 总结\n\n## 简介\n\nJava™ 编程语言由 Sun Microsystems 的工程师詹姆斯·高林（James\
  \ Gosling）于 1990 年首次开发。他不喜欢使用 C++ 编程语言，因此创建了一种新语言，并将其命名为“Oak”（橡树），这是他在办公室窗外外看到的一棵树。\n\
  \n![image](img/pg8_1.jpg)\n\n这是“Duke”（迪克）——Java 编程语言的亲切吉祥物。\n\n随着世界网的日益普及，Sun 公司意识到高林编写的这种语言可以针对互联网进行开发。因此，Sun\
  \ 公司将该语言重命名为“Java”（仅仅是因为这个名字听起来很酷），并于 1995 年免费提供。全球的开发者很快采用了这种令人兴奋的新语言，并且由于其模块化设计，他们能够创建添加到核心语言中的新功能。最受喜爱的额外功能被保留在\
  \ Java 后后的发布版本中，并发展成为当今的全面版本。\n\nJava 的本质是一个称为“类”（classes）的文件库，每个类都包含小段现成的、经过验证的代码。这些类中的任何一个都可以像墙上的砖块一样整合到新程序中，因此只需要编写相对少的新代码即可完成程序。这为程序员节省了大量时间，并在很大程度上解释了\
  \ Java 编程如此受欢迎的原因。此外，这种模块化安排比单一大型程序更容易识别任何错误。\n\nJava 技术既是一种编程语言也是一个平台。在 Java 编程中，源代码首先以可\
  \ java` 的文件编写，由 `javac` 编译器编译为机器可读的 `.class` 文件。然后，`java` 解释器可以通过 Java 虚拟机（Java\
  \ VM）的实例来执行程序：\n\n![image](img/pg8_2.jpg)\n\n由于 Java VM 可运行在许多不同的操作系统上，相同的 `.class`\
  \ 文件能够在 Windows、Linux 和 Mac 操作系统上运行——因此 Java 程序员在理论上享有“编写一次，随处运行”的跨平台能力。\n\n![image](img/hot.jpg)\n\
  \nJAVA 代表“另一个模糊的缩写”（Just Another Vague Acronym）的传言并非事实。\n\n为了创建 Java 程序，需要在你的计算机上安装\
  \ Java 类库和 `javac` 编译器。为了运行 Java 程序，需要安装 Java™ 运行环境（JRE）以提供 `java` 解释器。所有这些组件都包含在一个免费提供的\
  \ Java SE（标准版）开发工具包（JDK）中。\n\nJDK 包适用于 32 位和 64 位的 Linux、Mac 和 Windows 平台——选择适合你计算机的版本来开始\
  \ Java 编程。\n\n## Oracle JDK\n\nOracle 公司收购了 Sun JDK 并将其重命名为 Oracle JDK。这是 Java SE（标准版）的正式专有版本，由\
  \ Oracle 团队维护。\n\n![image](img/pg9_1.jpg)\n\n通过 [www.oracle.com/java](http://www.oracle.com/java)\
  \ 了解更多关于 Oracle Java 软件的信息。\n\n## OpenJDK\n\nJava SE（标准版）的官方参考实现名为“OpenJDK”（Open\
  \ Java Development Kit）。这是一个完全免费的开源版本，由 Oracle 和整个 Java 社区支持。\n\nOpenJDK 每六个月发布一次新版本，并有多个实现可供选择。本书推荐的实现是由\
  \ **[adoptopenjdk.net](http://www.adoptopenjdk.net)** AdoptOpenJDK 社区小组提供的。\n\n\
  ![image](img/pg9_2.jpg)\n\n在 [openjdk.java.net](http://openjdk.java.net) 学习更多关于\
  \ OpenJDK 的信息。\n\n![image](img/pg9_3.jpg)\n\n## 安装 JDK\n\n为你的系统下载合适的 JDK 包。为了运行\
  \ Java 程序，需要安装 Java™ 运行环境（JRE）以提供 `java` 解释器。所有这些组件都包含在一个免费提供的 Java SE（标准版）开发工具包（JDK）中。\n\
  \nJDK 包适用于 Linux、Mac 和 Windows 平台的 32 位和 64 位变体——选择适合你计算机的版本来开始 Java 编程。\n\n![image](img/pg10_1.jpg)\n\
  \n![image](img/1b.jpg)JDK 包含几个可执行文件，分别是 Java 编译器、Java 壳和 Java 虚拟机。虚拟机。\n\n![image](img/pg10_2.jpg)\n\
  \n![image](img/2b.jpg)对于 Windows，从 OpenJDK 网站下载安装包，然后按照以下步骤安装 JDK：\n\n![image](img/pg10_3.jpg)\n\
  \n![image](img/3b.jpg)点击 **Next** 继续，接受许可协议并再次点击 **Next**。\n\n![image](img/pg10_4.jpg)\n\
  \n![image](img/4b.jpg)将位置更改为 `C:\\Java` 并选择“添加到路径”选项，然后点击 **Next**。\n\n![image](img/pg10_5.jpg)\n\
  \n对于 Linux，首先解压下载的 `tar.gz` 文件，通过编辑主目录下的 `.bashrc` 文件将 Java 的 `bin` 添加到路径：`PATH=$PATH:/usr/Java`\n\
  \n![image](img/pg11_1.jpg)\n\n![image](img/1b.jpg)按下 **Winkey** + **R** 打开“运行”窗口，然后输入\
  \ `cmd` 命令提示符窗口——或在 Linux 上打开终端窗口。\n\n![image](img/pg11_2.jpg)\n\n![image](img/3b.jpg)Windows\
  \ 键\n\n在提示符处输入 `java -version` 命令查看 JDK 版本（如下方所示的 Xs）。\n\n![image](img/pg11_3.jpg)\n\
  \n现在，输入 `jshell -version` 命令查看 Java 壳版本——你准备好开始 Java 编程了！\n\n![image](img/pg11_4.jpg)\n\
  \n![image](img/pg11_5.jpg)Java 壳 `jshell` 是一个交互式工具，允许你测试代码片段，无需先编译代码。它用于第 2 章演示各种“运算符”。\n\
  \n## 编写第一个 Java 程序\n\n所有的 Java 程序都从文本文件开始，随后用于创建“类”文件，这些实际的可运行程序。这意味着 Java 程序可以使用任何文本编辑器编写，例如\
  \ Windows 的记事本或 Linux 的 Nano。\n\n![image](img/pg12_1.jpg)\n\n按照以下步骤创建一个简单的 Java\
  \ 程序，它将输出传统的第一个程序问候：\n\n![image](img/1b.jpg)打开文本编辑器（如记事本），并按照列出的内容输入此代码以创建一个名为“Hello”的类\n\
  \n```java\nclass Hello {\n}\n```\n\n![image](img/common.jpg)\nHello.java\n\n![image](img/2b.jpg)在\
  \ **Hello** 类的大括号之间插入此代码以为 **Hello** 类创建一个“main”方法\n\n```java\npublic static void\
  \ main ( String[] args )\n{\n}\n```\n\n![image](img/3b.jpg)在 **main** 方法的大括号之间插入此行代码——说明程序将要做什么\n\
  \n```java\nSystem.out.println( “Hello World!” ) ;\n```\n\n\n\n\n\n![image](img/4b.jpg)\n\
  将文件保存到任何方便的位置，但请务必精确命名为 `Hello.java` – 现在完整的程序看起来应该是这样的：\n\n![image](img/pg12_2.jpg)\n\
  \n![image](img/snake.jpg)\n\nJava 是一种大小敏感的语言，“Hello”和“hello”是完全不同的 –传统上，Java 程序名应该始终以大写字母开头。\n\
  \n![image](img/forget.jpg)\n\nJava 程序始终以其完全的程序名加上 `.java` 扩展名保存。\n\n可以单独检查程序代码的这里的各个部分，以更清晰地理解每个部分：\n\
  \n### 程序的容器\n\n```java\nclass Hello { }\n```\n\n程序名跟在 `class` 关键字之后，后面紧跟着一对大括号。定义\
  \ `Hello` 类的所有程序代码都包含在这些大括号内。\n\n### main 方法\n\n```java\npublic static void main\
  \ ( String[] args ) { }\n```\n\n这行看起来很吓畏的代码是用于定义几乎所有 Java 程序起点的标准代码。它将会在书中大多数示例中以与上面完全的形式出现\
  \ – 所以记住它可能会很有用。\n\n该代码声明了一个名为“main”的方法，该方法在其大括号内包含实际的程序指令。\n\n关键字 `public static\
  \ void` 位于方法名之前，用于定义如何使用该方法，将在稍后进行详细解释。\n\n代码 `( String[] args )` 在向方法传递值时非常有用，在书中稍后也会进行详细解释。\n\
  \n![image](img/forget.jpg)\n\n所有独立的 Java 程序都必须有一个 main 方法。\n\n### 语句\n\n```java\n\
  System.out.println( “Hello World!” ) ;\n```\n\n语句是执行程序任务的实际指令，并且必须以分号结尾。一个方法可以在大括号内包含许多语句以形成一个“语句块”，定义要执行的一系列任务，但在这里，单个语句指示程序输出一行文本。\n\
  \n转到这里 发现如何编译和运行此程序。\n\n![image](img/hot.jpg)\n\n创建一个“MyJava”目录，用于保存所有的 Java 程序文件。\n\
  \n### 编译与运行程序\n\n在 Java 程序运行之前，它必须首先由 Java 编译器编译成 `class` 文件。它位于 Java 的 `bin` 子目录下，是一个名为\
  \ `javac` 的应用程序。在安装期间，`bin` 子目录已添加到系统路径，因此 `javac` 可以从任何系统位置调用。\n\n按照以下步骤编译程序这里：\n\
  \n![image](img/1b.jpg)\n打开命令行窗口，然后导航到你保存 `Hello.java` 源码文件的目录\n\n![image](img/2b.jpg)\n\
  输入 `javac` 后跟一个空格，然后是源码文件的全名 `Hello.java` 并按 `Enter` \n\n![image](img/pg14_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n在 Windows 上使用命令提示符应用或 Windows PowerShell 应用提供命令行提示符，在\
  \ Linux 上使用 Terminal 窗口。\n\n![image](img/hot.jpg)\n\n在提示符处输入 `javac` 并按回车显示 Java\
  \ 编译器选项。\n\n如果 `javac` 编译器发现代码中有错误，它将停止并显示一个有助于问题的报告，指示错误的性质 – 排除故障请参阅这里。\n\n如果\
  \ `javac` 编译器没有发现任何错误，它将创建一个以程序名和 `.class` 文件扩展名命名的新文件。\n\n![image](img/pg14_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n向 `javac` 编译器指定文件的完整路径地址，也可以从另一个位置编译源码 – 在这种情况下为 `C:\\\
  MyJava\\Hello.java`\n\n当 Java 编译器完成编译时，命令行提示符窗口的焦点返回提示提示符，没有任何确认消息 – 程序已准备好运行。\n\
  \n![image](img/pg15_3.jpg)\n\nJava 程序解释器是一个名为 `java` 的应用程序，位于 Java 的 `bin` 子目录下\
  \ – 与 `javac` 编译器在一起。由于该目录在安装期间已添加到系统路径，`java` 解释器可以从任何位置调用。\n\n按照这里描述的步骤运行已编译的程序：\n\
  \n![image](img/1b.jpg)\n打开命令行提示符窗口，然后导航到 `Hello.class` 程序文件所在的目录\n\n![image](img/2b.jpg)\n\
  在提示符处，输入 `java` 后跟一个空格，然后是程序名 `Hello` 并按回车\n\n![image](img/pg15_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n运行程序时不包含 .class 扩展名 – 只使用程序名。\n\n`Hello` 程序运行并执行其 main 方法内语句中定义的任务 – 输出“Hello\
  \ World!”。完成后，焦点再次返回到提示符。\n\n编译和运行 Java 程序的过程通常组合为顺序步骤，并且无论在什么平台上都是相同的。下面的截图展示了在\
  \ Linux 上编译和运行 `Hello` 程序的过程：\n\n![image](img/pg15_2.jpg)\n\n## 创建变量\n\n在 Java 编程中，“变量”简单来说是一个存储值的容器，供后续使用。值可能会随着程序的执行而改变（变化）–\
  \ 因此被称为“变量”。\n\n![image](img/pg16_1.jpg)\n\n通过在程序中编写声明来创建变量，指定数据类型以及变量名称。例如，可以使用\
  \ `String` 类型来允许名为“message”的变量包含文本：\n\n```java\nString message ;\n```\n\n变量名由程序员选择，但必须遵循某些命名规范。变量名只能以字母、美元符号\
  \ `$` 或下划线字符 `_` 开头，随后可以是字母、数字、美元符号或下划线。名称对大小敏感，因此“var”和“Var”是不同的名称，名称中不允许空格。\n\n\
  变量名还应避免下表列出的 Java 关键字，因为这些词在语言中有特殊含义。\n\n| | | | | |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| `abstract` | `default` | `goto` | `package` | `synchronized` |\n|\
  \ `assert` | `do` | `if` | `private` | `this` |\n| `boolean` | `double` | `implements`\
  \ | `protected` | `throw` |\n| `break` | `else` | `import` | `public` | `throws`\
  \ |\n| `byte` | `enum` | `instanceof` | `return` | `transient` |\n| `case` | `extends`\
  \ | `int` | `static` | `try` |\n| `catch` | `false` | `long` | `strictfp` | `void`\
  \ |\n| `char` | `final` | `native` | `String` | `volatile` |\n| `class` | `finally`\
  \ | `new` | `super` | `while` |\n| `continue` | `for` | `null` | `switch` | |\n\n\
  ![image](img/snake.jpg)\n\n每个变量声明都必须以分号字符结尾 正 与所有其他语句一样。\n\n![image](img/hot.jpg)\n\
  \n严格来说，表中的某些词并不是真正的关键字 – `true`、`false` 和 `null` 都是字面量；`String` 是一个特殊的类名；`const`\
  \ 和 `goto` 是保留字（目前未未使用）。将它们包含在表中是因为在命名变量时也必须避免这些词。\n\n\n\n\n\n作为良好的习惯，变量命名应使用单词或易于识别的缩写，以描述该变量的用途。例如，使用\
  \ `button1` 或 `btn1` 来描述一号按钮。单词单词优先使用小写字母，例如 `gear`；由多个单词组成的名称应将每个后续单词的首字母大写，例如\
  \ `gearRatio` —— 即所谓的 `camelCase`（驼峰命名）命名规范。\n\n一旦声明变量，可以使用等号 `=` 为其分配相应数据类型的初始值，可以在声明时赋值，也可以在程序的后期赋值，然后可以使用变量名随时引用其值。\n\
  \n按照以下步骤创建一个程序，该程序声明一个变量，并在声明时对其初始化，稍后进行更改：\n\n![image](img/1b.jpg)启动一个名为“FirstVariable”的新程序，包含标准的\
  \ main 方法\n\n```java\nclass FirstVariable\n{\n    public static void main ( String[]\
  \ args ) {             \n    }\n}\n```\n\n![image](img/common.jpg)\n\nFirstVariable.java\n\
  \n![image](img/2b.jpg)在 main 方法的大括号之间插入此代码，以创建、初始化并输出一个变量\n\n```java\nString message\
  \ = “Initial value” ;\nSystem.out.println( message ) ;\n```\n\n![image](img/3b.jpg)添加这些行来修改并输出变量值\n\
  \n```java\nmessage = “Modified value” ;\nSystem.out.println( message ) ;\n```\n\n\
  ![image](img/4b.jpg)将程序保存为 `FirstVariable.java`，然后编译并运行程序\n\n![image](img/pg17_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n如果在编译或运行程序时遇到问题，可以在此处获取排查问题的帮助。\n\n## 识别数据类型\n\nJava\
  \ 变量声明中最常用的数据类型列在本表中，并带有简要描述：\n\n![image](img/pg18_1.jpg)\n\n| 数据类型: | 描述: | 示例:\
  \ |\n| :--- | :--- | :--- |\n| `char` | 单个 Unicode 字符 | ‘a’ |\n| `String` | 任意数量的\
  \ Unicode 字符 | “my String” |\n| `int` | 整数，范围从 -21.4 亿到 +21.4 亿 | 1000 |\n| `float`\
  \ | 带有小数点的浮点数 | 3.14159265f |\n| `boolean` | 真或假的二选一逻辑值 | true |\n\n![image](img/snake.jpg)\n\
  \n由于浮点数运算的不规则性，`float` 数据类型绝不应用于货币等精确值 —— 详情请参见此处。\n\n注意，`char` 数据值必须始终由单引号包含，而\
  \ `String` 数据值必须始终由双引号包含。此外，记住 `float` 数据值必须始终带有 “f” 后缀，以确保它们被视为 `float` 值。\n\n\
  除了上述更常见的数据类型外，Java 还提供了这些特殊数据类型用于精确情况：\n\n| 数据类型: | 描述: |\n| :--- | :--- |\n| `byte`\
  \ | 从 -128 到 +127 的整数 |\n| `short` | 从 -32,768 到 +32,767 的整数 |\n| `long` | 超过 21.4\
  \ 亿的正负整数 |\n| `double` | 极长的浮点数 |\n\n![image](img/forget.jpg)\n\n除了 `String`（这是一个特殊类），所有数据类型关键字都以小写字母开头。\n\
  \n特殊数据类型在高级 Java 程序中很有 —— 本书示例大多使用顶部表中常用的数据类型。\n\n按照以下步骤创建一个 Java 程序，该程序创建、初始化并输出所有五个常用数据类型的变量：\n\
  \n![image](img/1b.jpg)启动一个名为“DataTypes”的新程序，包含标准的 main 方法\n\n```java\nclass DataTypes\n\
  {\n    public static void main ( String[] args ) {     \n    }\n}\n```\n\n![image](img/common.jpg)\n\
  \nDataTypes.java\n\n![image](img/2b.jpg)在 main 方法的大括号之间插入这些声明来创建并初始化五个变量\n\n```java\n\
  char letter = ‘M’ ;\nString title = “Java in easy steps” ;\nint number = 365 ;\n\
  float decimal = 98.6f ;\nboolean result = true ;\n```\n\n![image](img/3b.jpg)添加这些行以将适当的文本\
  \ `String` 拼接到每个变量的值\n\n```java\nSystem.out.println( “Initial is ” + letter ) ;\n\
  System.out.println( “Book is ” + title ) ;\nSystem.out.println( “Days are ” + number\
  \ ) ;\nSystem.out.println( “Temperature is ” + decimal ) ;\nSystem.out.println(\
  \ “Answer is ” + result ) ;\n```\n\n![image](img/4b.jpg)将程序保存为 `DataTypes.java`，然后编译并运行程序\n\
  \n![image](img/pg19_1.jpg)\n\n![image](img/5b.jpg)\n\n`System.out.println( “Initial\
  \ is ” + letter ) ;`\n\n![image](img/hot.jpg)\n\n`+` 在此处用于拼接字符串值。\n\n## 创建常量\n\n\
  `final` 关键字是一个修饰符，声明变量时可以使用防止任何更改。\n\n![image](img/pg20_1.jpg)以这种方式创建变量被称为“常量”。\n\
  \n按照以下步骤创建一个包含常量的 Java 程序：\n\n![image](img/1b.jpg)启动一个名为“Constants”的新程序，包含标准的 main\
  \ 方法\n\n```java\nclass Constants\n{\n    public static void main ( String[] args\
  \ ) {             \n    }\n}\n```\n\n![image](img/common.jpg)\n\nConstants.java\n\
  \n![image](img/2b.jpg)在 main 方法的大括号之间插入此代码以创建并初始化三个常量\n\n```java\nfinal int TOUCHDOWN\
  \ = 6 ;\nfinal int CONVERSION = 1 ;\nfinal int FIELDGOAL = 3 ;\n```\n\n![image](img/3b.jpg)现在，声明四个普通变量\n\
  \n```java\nint td , pat , fg , total ;\n```\n\n![image](img/4b.jpg)使用常量的倍数初始化普通变量\n\
  \n```java\ntd = 4 * TOUCHDOWN ;\npat = 3 * CONVERSION ;\nfg = 2 * FIELDGOAL ;\n\
  total = ( td + pat + fg ) ;\n```\n\n![image](img/5b.jpg)添加此行显示总分\n\n```java\nSystem.out.println(\
  \ “Score: ” + total ) ;\n```\n\n![image](img/6b.jpg)将程序保存为 `Constants.java`，然后编译并运行程序以输出，Score:\
  \ 33\n\n( 4 x 6 = 24, 3 x 1 = 3, 2 x 3 = 6，所以 24 + 3 + 6 = 33 ).\n\n![image](img/hot.jpg)`*`\
  \ 星号在此处用于乘以常量，括号包裹了它们的加法。\n\n## 添加注释\n\n在任何语言中编程时，为程序代码添加注释以解释特定部分是良好的习惯。这使得其他人以及自己在离开一段时间后能更容易理解代码。\n\
  \n在 Java 编程中，可以在 `/*` 和 `*/` 标识符之间添加跨行注释，也可以在 `//` 注释标识符之后添加单行注释`/*` 和 `*/` 之间或\
  \ `//` 之后的任何内容都会被 `javac` 编译器完全忽略。\n\n为 `Constants.java` 程序添加注释后，源代码可能如下：\n\n```java\n\
  /*\n一个演示常量变量的程序。\n*/\nclass Constants\n{\n    public static void main( String[]\
  \ args )\n    {\n        // 常量分数值。\n        final int TOUCHDOWN = 6 ;\n        final\
  \ int CONVERSION = 1 ;\n        final int FIELDGOAL = 3 ;\n\n        // 计算得分。\n\
  \        int td , pat , fg , total ;\n        td = 4 * TOUCHDOWN ; // 4x6=24\n \
  \       pat = 3 * CONVERSION ;\n        fg = 2 * FIELDGOAL ;\n        total = (\
  \ td + pat + fg ) ;\n        System.out.println( “Score: ” + total ) ;\n    }\n\
  }\n```\n\n\n\n\n\n```java\npat = 3 * CONVERSION ; // 3x1= 3\nfg = 2 * FIELDGOAL\
  \ ; // 2x3= 6\ntotal = ( td + pat + fg ) ; // 24+3+6=33\n// Output calculated total.\n\
  System.out.println( “Score: “ + total ) ;\n}\n}\n```\n\n![image](img/common.jpg)\n\
  \nConstants.java (已注释)\n\n带有注释保存后，程序可以正常编译并运行：\n\n![image](img/pg21_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n你可以添加一条尝试更改常量值值的语句，然后尝试重新编译程序以查看生成的错误信息。\n\n### 常见问题排除\n\n有时候，`javac` 编译器或 `java`\
  \ 解释器会报告错误，因此了解错误的原因以及如何快速解决问题是很有用的。为了演示一些常见的错误报告，这段代码包含了一些故意的错误：\n\n```java\nclass\
  \ test\n{\npublic static void main ( String[] args )\n{\nString text ;\nSystem.out.println(\
  \ “Test ” + text )\n}\n}\n```\n\n![image](img/common.jpg)\n\nTest.java\n\n首次尝试编译\
  \ `Test.java` 会产生此错误报告：\n\n![image](img/pg22_1.jpg)\n\n* 原因 – 找不到 `javac` 编译器。\n\
  * 解决方案 – 使用命令 `setx path “%path%;C:\\Java\\bin”` 修改系统环境，或使用完整路径命令 `C:\\Java\\bin\\\
  javac Test.java` 调用编译器。\n\n![image](img/pg22_2.jpg)\n\n* 原因 – 找不到文件 `Test.java`。\n\
  * 解决方案 – 到文件所在的目录，或在命令中使用文件的完整路径地址。\n\n![image](img/hot.jpg)\n\n要在 Windows 中编辑环境变量，你可以打开**系统属性**，点击**高级**选项卡，然后点击**环境变量**按钮。选择\
  \ `Path`，点击**编辑**并添加 `C:\\Java\\bin`，然后点击**确定**应用更改。\n\n![image](img/pg22_3.jpg)\n\
  \n![image](img/pg23_1.jpg)\n\n* 原因 – 语句没有正确终止。\n\n![image](img/pg23_2.jpg)\n* 解决方案\
  \ – 在源代码的语句末尾添加分号，然后保存文件应用更改。\n\n![image](img/pg23_3.jpg)\n\n* 原因 – 程序名与类名不匹配。\n\
  * 解决方案 – 在源代码中将类名从 `test` 改为 `Test`，然后保存文件应用更改。\n\n![image](img/pg23_4.jpg)\n\n\
  * 原因 – 变量 `text` 没有值。\n* 解决方案 – 在变量声明中为变量分配一个有效的 `String` 值（例如 `= “success”），然后保存文件。\n\
  \n![image](img/pg23_5.jpg)\n\n![image](img/snake.jpg)\n\n你必须在程序所在的目录下运行程序——不能使用路径地址，因为\
  \ Java 启动器需要的是程序名而不是文件名。\n\n## 总结\n\n* Java 既是一种编程语言也是一种运行时平台。\n* Java 程序编写为带有 `.java`\
  \ 扩展名的文本文件。\n* Java 编译器 `javac` 从原始的 `.java` 源文件创建编译后的 `.class` 程序文件。\n* Java 解释器\
  \ `java` 使用 Java 虚拟机（JVM）的实例执行编译后的程序。\n* Java VM 可用于许多操作系统平台。\n* 将 Java 的 `bin`\
  \ 子目录添加到系统 `PATH` 变量中允许从任何地方调用 `javac` 编译器。\n* Java 是一种大小敏感的语言。\n* 标准的 `main` 方法是\
  \ Java 程序的入口。\n* `System.out.println()` 语句输出文本。\n* Java 程序文件名必须与其类名完全匹配。\n* Java\
  \ 变量只能按照指定的命名规范命名，并且必须避开 Java 关键字。\n* 在 Java 编程中，每个语句必须以分号字符终止。\n* 最常见的 Java 数据类型是\
  \ `String`、`int`、`char`、`float` 和 `boolean`。\n* `String` 值必须包含在双引号内；`char` 值在单引号内；`float`\
  \ 值必须带有 “f” 后缀。\n* `final` 关键字可以创建常量变量。\n* 注释可以添加在 Java 源代码的 `/***` 和 `***/**` 之间（跨越一行或多行），或者在单行的\
  \ `//` 之后。\n* 错误报告用于识别编译器和运行时问题。\n\n## 执行操作\n\n*本章演示了用于在 Java 程序中创建表达式的各种运算符。*\n\
  \n### 算术运算\n\n下表列出的算术运算符用于在 Java 程序中创建返回单一结果值的表达式。例如，表达式 `4 * 2` 返回值 `8`。\n\n![image](img/pg26_1.jpg)\n\
  \n| 运算符: | 操作 |\n| :--- | :--- |\n| `+` | 加法（并拼接 `String` 值） |\n| `-` | 减法 |\n|\
  \ `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `++` | 递增 |\n| `--` | 递减 |\n\n递增运算符\
  \ `++` 和递减运算符 `--` 返回将单个给定操作数加减 1 的结果。例如，`4++` 返回值 `5`。\n\n`+` 运算符执行的操作取决于操作数的类型。当两个操作数都是数字时，它将返回这些数字的总和；但当操作数是\
  \ `String` 值时，它将返回拼接后的 `String`。例如，`“Java ”` + `“Arithmetic”` 返回 `“Java Arithmetic”`。\n\
  \n`int` 值的除法会截断任何小数部分。例如，`11/4` 返回 `2`。\n\n取模运算符将第一个操作数除以第二个操作数，并返回操作的余数。例如，`32\
  \ % 5` 返回 `2` ——5 除入 32 六次，余数为 2。\n\n\n\n\n\n赋值运算符列如下表所示，用于为表达式的结果赋值。除了简单的 `=` 运算符外，所有的都是更长表达式的简写形式：\n\
  \n![image](img/pg28_1.jpg)\n\n| **运算符：** | **示例：** | **等价：** |\n| :--- | :--- |\
  \ :--- |\n| `=` | `a = b` | `a = b` |\n| `+=` | `a += b` | `a = a + b` |\n| `-=`\
  \ | `a -= b` | `a = a - b` |\n| `*=` | `a *= b` | `a = a * b` |\n| `/=` | `a /=\
  \ b` | `a = a / b` |\n| `%=` | `a %= b` | `a = a % b` |\n\n将 `=` 运算符视为“赋值”而不是“等于”，以避免与\
  \ `==` 相等运算符混淆。\n\n在示例 `a = b` 中，存储在命名变量 `b` 中的值被赋值给名为 `a` 的变量，使得该值成为存储在 `a` 中的新值——替换掉它之前包含的任何值。\n\
  \n`+=` 运算符用于将一个值加到变量存储的现有值上——保持一个“运行总计”。\n\n示例 `a += b` 首先计算存储在命名变量 `a` 和 `b` 中的值的总和，然后将得到的总和赋值给变量\
  \ `a`。程序随后可能会包含进一步的赋值 `a += c`，它计算存储在命名变量 `a` 和 `c` 中的总和，然后将该新总和赋值给 `a`——将 `c` 的值加到它之前包含的值上。\n\
  \n所有其他赋值运算符的运行方式都相同：首先对两个存储的值进行算术计算，然后将结果赋值给第一个变量——成为其新的存储值。\n\n![image](img/hot.jpg)\n\
  \n`==` 相等运算符用于比较两个值，其详细解释请参见此处。\n\n按照以下步骤在 Java 交互式外壳（Java shell）中探索 Java 赋值运算符：\n\
  \n![image](img/1r.jpg)打开一个命令行提示提示符窗口，然后输入 `jshell` 并按 `Enter` 键启动 Java 交互式外壳\n\n\
  ![image](img/2r.jpg)接下来，输入语句初始化两个 `String` 变量\n\n```java\nString txt = “Super ”\
  \ ; String lang = “Java” ;\n```\n\n![image](img/3r.jpg)现在，分别输入语句添加并赋值一个 `String`\
  \ 值，然后显示拼接后的字符串结果\n\n```java\ntxt += lang ; txt ;\n```\n\n![image](img/pg29_1.jpg)\n\
  \n![image](img/4r.jpg)然后输入语句初始化两个整数变量\n\n```java\nint sum = 10 ; int num = 20 ;\n\
  ```\n\n![image](img/5r.jpg)分别输入语句添加并赋值一个 `int` 值，然后显示加总后的整数结果\n\n```java\nsum +=\
  \ num ; sum ;\n```\n\n![image](img/pg29_2.jpg)\n\n![image](img/hot.jpg)\n\nJava\
  \ 交互式外壳会创建带有 `$` 前缀的内部编号变量，包含评估的结果。在这里，内部变量 `$3` 和 `$7` 包含评估结果。\n\n![image](img/snake.jpg)\n\
  \n为变量分配错误的数据类型将导致错误。\n\n### 比较值\n\n比较运算符列如下表所示，用于比较表达式中的两个值，并返回一个单一的 `true` 或 `false`\
  \ 布尔值——描述该比较的结果。\n\n![image](img/pg30_1.jpg)\n\n| **运算符：** | **比较：** |\n| :--- |\
  \ :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n| `<` |\
  \ 小于 |\n| `<=` | 小于等于 |\n\n`==` 相等运算符比较两个操作数，如果两者的值完全相等，则返回 `true`。如果两个都是相同的数字，它们就是相等的；如果两个都是包含相同字符且顺序相同的\
  \ `String` 值，它们就是相等的。两个都为 `true` 或两个都为 `false` 的布尔操作数是相等的。\n\n相反，`!=` 不等于运算符在两个操作数不相等时返回\
  \ `true`——适用与相等运算符相同的规则。\n\n相等和不等运算符在测试两个变量的状态以执行程序的“条件分支”时非常有用——根据条件向不同的方向执行。\n\
  \n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回 `true`。\n\n`<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个，则返回\
  \ `true`。\n\n在 `>` “大于”运算符或 `<` “小于”运算符后添加 `=` 赋值运算符，可以使其在两个操作数的值完全相等时也返回 `true`。\n\
  \n![image](img/hot.jpg)\n\n`<` 小于运算符通常用于测试循环中的计数器值——可以在此处 找到此类的示例。\n\n按照以下步骤在 Java\
  \ 交互式外壳中探索 Java 比较运算符：\n\n![image](img/1r.jpg)打开一个命令行提示符窗口，然后输入 `jshell` 并按 `Enter`\
  \ 键启动 Java 交互式外壳\n\n![image](img/2r.jpg)接下来，输入语句初始化两个 `String` 变量\n\n```java\nString\
  \ txt = “Super ” ; String lang = “Java” ;\n```\n\n![image](img/3r.jpg)现在，分别输入语句添加并赋值一个\
  \ `String` 值，然后显示拼接后的字符串结果\n\n```java\ntxt += lang ; txt ;\n```\n\n![image](img/pg29_1.jpg)\n\
  \n![image](img/4r.jpg)然后输入语句初始化两个整数变量\n\n```java\nint sum = 10 ; int num = 20 ;\n\
  ```\n\n![image](img/5r.jpg)分别输入语句添加并赋值一个 `int` 值，然后显示加总后的整数结果\n\n```java\nsum +=\
  \ num ; sum ;\n```\n\n![image](img/pg29_2.jpg)\n\n![image](img/hot.jpg)\n\nJava\
  \ 交互式外壳会创建带有 `$` 前缀的内部编号变量，包含评估的结果。在这里，内部变量 `$3` 和 `$7` 包含评估结果。\n\n![image](img/snake.jpg)\n\
  \n为变量分配错误的数据类型将导致错误。\n\n### 逻辑评估\n\n逻辑运算符如下表所示，用于将多个每个返回布尔值的表达式组合成一个返回单一值的复杂表达式。\n\
  \n![image](img/pg32_1.jpg)\n\n| **运算符：** | **操作：** |\n| :--- | :--- |\n| `&&` |\
  \ 逻辑与 |\n| `||` | 逻辑或 |\n| `!` | 逻辑非 |\n\n逻辑运算符用于具有 `true` 或 `false` 布尔值的操作数，或可以转换为\
  \ `true` 或 `false` 的值。\n\n逻辑 `&&` 与评估两个操作数，只有当两个操作数都为 `true`时才返回 `true`。否则，逻辑 `&&`\
  \ 运算符返回 `false`。这种评估可以用于条件分支，只有当两个测试条件都成立时，程序才会执行某些操作。\n\n与需要两个操作数均为 `true` 的逻辑\
  \ `&&` 运算符不同，逻辑 `||` 或运算符评估两个操作数，如果其中一个为 `true`，则返回 `true`——只有当两个操作数都不为 `true` 时才会返回\
  \ `false`。这在 Java 编程中非常有用，可以在满足两个条件之一时执行某些操作。\n\n逻辑 `!` 非运算符是一个用于单个操作数的一元运算符。它返回给定操作数的反转布尔值——将\
  \ `true` 变为 `false`，将 `false` 变为 `true`。它在 Java 程序中非常有用，可以在连续循环迭代中切换变量的值，使用类似 `goState=!goState`\
  \ 的语句。这确保值在每次循环中都会发生变化，就像开关灯一样。\n\n“布尔”（Boolean）一词是指英国数学家乔治·布尔（George Boole，1815-1864）开发的一种逻辑系统。\n\
  \n你可以在 Java 交互式外壳中通过输入 `/help` 命令发现更多选项。\n\n\n\n\n\n![image](img/2r.jpg)接下来，输入语句来初始化两个\
  \ `boolean` \n\n```java\nboolean yes = true ; boolean no = false ;\n```\n\n![image](img/3r.jpg)输入语句测试两个条件是否都为真\n\
  \n```java\nboolean result = ( yes && yes ) ; result = ( yes && no ) ;\n```\n\n![image](img/pg33_1.jpg)\n\
  \n![image](img/4r.jpg)输入语句测试其中任一个条件是否为真\n\n```java\nresult = ( yes || yes ) ;\n\
  result = ( yes || no ) ;\nresult = ( no || no ) ;\n```\n\n![image](img/5r.jpg)输入语句显示原始值和反反值\n\
  \n```java\nresult = yes ; result = !yes ;\n```\n\n![image](img/pg33_2.jpg)\n\n![image](img/hot.jpg)\n\
  \nJava shell 也称为“REPL”，它是 Read（读取）、Evaluate（求值）、Print（打印）、Loop（循环）的缩写，描述了这种交互式工具。\n\
  \n![image](img/hot.jpg)\n\n注意 `false && false` 返回 `false` 而不是 `true` —— 这证明了“两个错并不出一个对”的格言。\n\
  \n![image](img/forget.jpg)\n\n由 `!` NOT 逻辑运算符返回的值是存储值的反值 —— 存储值本身保持不变。\n\n### 检查条件\n\
  \nJava 程序员最喜爱的运算符可能是 `? :` 条件运算符，它能以非常简洁的方式实现强大的语句。它不寻常的语法初看之下可能很难理解，但了解这个实用的运算符是非常值得的。\n\
  \n![image](img/pg34_1.jpg)\n\n条件运算符首先评估一个表达式的 `true` 或 `false` 值，然后根据求值结果返回两个给定的操作数之一。它的语法如下：\n\
  \n```\n( boolean-expression ) ? if-true-return-this : if-false-return-this ;\n```\n\
  \n每个指定的操作数备选方案允许程序根据测试表达式返回的布尔值继续执行。例如，备选方案可以返回一个 `String` 值：\n\n```java\nstatus\
  \ = ( quit == true ) ? “Done!” : “Continuing...” ;\n```\n\n在这种情况下，当 `quit` 变量为 `true`\
  \ 时，条件运算符将第一个操作数的值赋值给 `status` 变量；否则，它赋值第二个操作数的值。\n\n在编写 Java 程序时的一种简便方法允许表达式在评估简单布尔值时可选地省略\
  \ `== true`，因此上面的示例可以简单写为：\n\n```java\nstatus = ( quit ) ? “Done!” : “Continuing...”\
  \ ;\n```\n\n条件运算符可以返回任何数据类型的值，并使用任何有效的测试表达式。例如，表达式可以使用大于 `>` 运算符来评估两个数值，然后根据结果返回一个布尔值：\n\
  \n```java\nbusted = ( speed > speedLimit ) ? true : false ;\n```\n\n同样，条件运算符可能使用不等\
  \ `!=` 运算符评估一个 `String` 值，然后根据结果返回一个数值：\n\n```java\nbodyTemperature = ( scale !=\
  \ “Celsius” ) ? 98.6 : 37.0 ;\n```\n\n![image](img/hot.jpg)\n\n条件运算符也被称为“三元”运算符。\n\
  \n按照以下步骤在 Java shell 中探索 Java 条件运算符：\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入 `jshell`\
  \ 并按 `Enter` 键启动 Java shell\n\n![image](img/2r.jpg)接下来，输入语句来初始化两个 `int` 变量\n\n```java\n\
  int num1 = 1357 ; int num2 = 2468 ;\n```\n\n![image](img/3r.jpg)声明另一个变量来存储测试结果 `String`\n\
  \n```java\nString result ;\n```\n\n![image](img/4r.jpg)输入此语句判断第一个整数值是奇数还是偶数\n\n\
  ```java\nresult = ( num1 % 2 != 0 ) ? “Odd” : “Even” ;\n```\n\n![image](img/pg35_1.jpg)\n\
  \n![image](img/5r.jpg)现在，输入此语句判断第二个整数值是奇数还是偶数\n\n```java\nresult = ( num2 % 2 !=\
  \ 0 ) ? “Odd” : “Even” ;\n```\n\n![image](img/pg35_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n你还可以使用命令 `jshell --feedback verbose` 启动 Java shell，以便在每次求值后接收描述性输出。\n\n![image](img/hot.jpg)\n\
  \n注意未初始化的 `String` 变量返回一个特殊的 `null` 值 —— 表示它完全不包含内容。\n\n![image](img/forget.jpg)\n\
  \n在这里，当存在余数时，表达式为真。\n\n### 设置优先级\n\n包含多个运算符和操作数的复杂表达式如果没有明确操作执行顺序，就会产生歧义。这种缺乏清晰度很容易导致同一个表达式暗示不同的结果。例如，考虑这个复杂表达式：\n\
  \n```java\nnum = 8 + 4 * 2 ;\n```\n\n![image](img/pg36_1.jpg)\n\n从左到右计算：`8 + 4 =\
  \ 12`，`12 * 2 = 24`，所以 `num = 24`。但从右到左计算：`2 * 4 = 8`，`8 + 8 = 16`，所以 `num = 16`。\n\
  \nJava 程序员可以通过添加括号来显式指定应该先执行哪个操作。在这种情况下，`(8 + 4) * 2` 确保在执行乘法之前执行加法 —— 所以结果是 24\
  \ 而不是 16。相反，`8 + (4 * 2)` 先执行乘法 —— 所以结果是 16 而不是 24。\n\n当括号没有指定优先级时，Java 遵循下面的默认顺序：\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `++` `--` `!` | 增、减、逻辑非 |\n| `*` `/` `%` | 乘法、除法、取模\
  \ |\n| `+` `-` | 加法、减法 |\n| `>` `>=` `< `<=` | 大于、大于等于、小于、小于等于 |\n| `==` `!=` |\
  \ 等于、不等 |\n| `&&` | 逻辑与 |\n| `\\|\\|` | 逻辑或 |\n| `? :` | 条件 |\n| `=` `+=` `-=` `*=`\
  \ `/=` `%=` | 赋值 |\n\n优先级相同的运算符按照它们在表达式中的顺序处理 —— 从左到右。当表达式有多个嵌套括号时，最内层的括号优先级最高。\n\
  \n工作原理 – 步骤 2...\n\n`16 x 2 = 32, + 24 = 56`\n\n步骤 3...\n\n`24 + 16 = 40, x 2 =\
  \ 80`\n\n步骤 4...\n\n`32 - 24 = 8, x 2 = 16`\n\n本章到目前为止使用 Java shell **jshell** 通过评估代码片段来探索各种\
  \ Java 运算符。后续示例将使用 Java 编译器 **javac** 和 Java 运行时 **java** 来创建和运行程序。你可以使用命令 `/exit`\
  \ 退出 Java shell 返回普通提示符。\n\n\n\n\n字面量通常与 Java 语言的关键字分离，但在 `String` 值内部如果需要双引号或单引号，则必须指示该引号字符被视为字面量处理，以避免过早终止\
  \ `String`。这可以通过在每个嵌套的引号字符前紧跟一个 `\\` 转义运算符来轻松实现。例如，在 `String` 变量中包含引号，如下：\n\n```java\n\
  String quote = “ \\”Fortune favors the brave.\\” said Virgil ”;\n```\n\n此外，`\\`\
  \ 转义运算符为简单的输出格式提供了多种实用的转义序列：\n\n| **转义符:** | **描述:** |\n| :--- | --- |\n| `\\n`\
  \ | 换行 |\n| `\\t` | 制表符 |\n| `\\b` | 退格 |\n| `\\r` | 回车 |\n| `\\f` | 换符 |\n| `\\\
  \\` | 反斜杠 |\n| `\\’` | 单引号 |\n| `\\”` | 双引号 |\n\n![image](img/hot.jpg)\n\n可以将单引号嵌套在双引号内，作为转义引号字符的替代方案。\n\
  \n`\\n` 换行转义序列经常用于长 `String` 值中，以便多行显示输出。同样，`\\t` 制表符转义序列经常用于列显示输出。使用 `\\n` 换行和\
  \ `\\t` 制表符转义序列的组合允许输出按行和列格式化——类似于表格。\n\n按照以下步骤使用转义序列创建 Java 程序来格式化输出：\n\n![image](img/1r.jpg)创建一个名为“Escape”的新程序，包含标准的\
  \ main 方法\n\n```java\nclass Escape\n{\n    public static void main( String[] args\
  \ ) {    }\n}\n```\n\n![image](img/common.jpg)\n\nEscape.java\n\n![image](img/2r.jpg)在\
  \ main 方法的大括号之间插入此代码，以构建一个包含格式化表格标题和列标题的 `String`\n\n```java\nString header = “\\\
  n\\tNEW YORK 3-DAY FORECAST:\\n” ;\nheader += “\\n\\tDay\\t\\tHigh\\tLow\\tConditions\\\
  n” ;\nheader += “\\t---\\t\\t----\\t---\\t----------\\n” ;\n```\n\n![image](img/3r.jpg)添加这些行以构建一个包含格式化表格单元数据的\
  \ `String`\n\n```java\nString forecast = “\\tSunday\\t\\t68F\\t48F\\tSunny\\n” ;\n\
  forecast += “\\tMonday\\t\\t69F\\t57F\\tSunny\\n” ;\nforecast += “\\tTuesday\\t\\\
  t71F\\t50F\\tCloudy\\n” ;\n```\n\n![image](img/4r.jpg)现在，添加此行输出两个格式化的 `String` 值\n\
  \n```java\nSystem.out.print( header + forecast ) ;\n```\n\n![image](img/5r.jpg)将程序保存为\
  \ `Escape.java`，然后编译并运行程序\n\n![image](img/pg39_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n在这种情况下，转义序列添加了换行，因此此处使用了 `print()` 方法——而不是输出后会自动添加换行的 `println()` 方法。\n\n## 使用位操作\n\
  \n除了本章前面介绍的普通运算符外，Java 还提供了用于二进制运算的特殊运算符。这些运算符比其他运算符不常用，但在这里简要讨论是为了让大家了解它们的存在。\n\
  \n![image](img/pg40_1.jpg)\n\nJava “位”运算符可以与 `int` 整数数据类型一起使用，用于操作值的二进制表示位。这需要理解二进制计数，其中字节中的八位代表十进制的零到\
  \ 255。例如，53 的二进制为 `00110101`（`0` x 128, `0` x 64, `1` x 32, `1` x 16, `0` x 8, `1`\
  \ x 4, `0` x 2, `1` x 1）。\n\n二进制加法运算的操作类似于十进制算术：\n\n| | 53 | = | `00110101` |\n\
  | :--- | --- | --- | --- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = | `00111100`\
  \ |\n\n下列表位运算符允许在二进制运算中执行更专门的操作。\n\n| **运算符:** | **操作:** | **示例:** | **结果:** |\n\
  | :--- | --- | --- | --- |\n| `&` | 与 (AND) | `a & b` | 如果两个位都为 1 则结果为 1 |\n| `\\\
  |` | 或 (OR) | `a \\| b` | 如果其中一个位为 1 则结果为 1 |\n| `^` | 异或 (XOR) | `a ^ b` | 如果两个位不同则为\
  \ 1 |\n| `~` | 非 (NOT) | `~a` | 反转位 |\n| `<<` | 左移 | `n << p` | 将 `n` 向左移动 `p` 位\
  \ |\n| `>>` | 右移 | `n >> p` | 将 `n` 向右移动 `p` 位 |\n\n例如，在二进制运算中使用位 `&` 运算符：\n\n|\
  \ | 53 | = | `00110101` |\n| :--- | --- | --- | --- |\n| `+` | 7 | = | `00000111`\
  \ |\n| | 60 | = | `00111100` |\n\n\n\n\n\n本章演示了用于 Java 程序中创建分支的各种关键字。\n\n### 使用\
  \ if 进行分支\n### 分支的替代方案\n### 切换分支\n## for 循环\n## 为 true 的 while 循环\n## 执行 do-while\
  \ 循环\n## 跳出循环\n## 返回控制权\n## 总结\n\n### 使用 if 进行分支\n\n`if` 关键字执行条件测试，以评估一个表达式的布尔值（Boolean）。表达式后的语句仅在评估结果为\
  \ `true` 时才会被执行，否则程序将继续执行后续代码——即走向下一个“分支”。`if` 语句的语法如下：\n\n`if (test-expression)\
  \ code-to-be-executed-when-true;`\n\n![image](img/ycap.jpg)\n\n如果被执行的代码可以包含多条语句，前提是它们被包含在大括号内，以形成一个“语句块”：\n\
  \n![image](img/1g.jpg)创建一个名为“If”的新程序，其中包含标准的 main 方法\n\n```java\nclass If\n{\n \
  \   public static void main (String[] args) {\n    }\n}\n```\n\n![image](img/j1.jpg)\n\
  \nIf.java\n\n![image](img/2g.jpg)在 main 方法的大括号之间插入这个简单的条件测试，当一个数字大于另一个数字时，执行单条语句\n\
  \n`if ( 5 > 1 ) System.out.println( “Five is greater than one.” ) ;`\n\n![image](img/3g.jpg)添加第二个条件测试，当一个数字小于另一个数字时，它会执行整个语句块\n\
  \n```java\nif ( 2 < 4 )\n{\n    System.out.println( “Two is less than four.” ) ;\n\
  \    System.out.println( “Test succeeded.” ) ;\n}\n```\n\n![image](img/4g.jpg)将程序保存为\
  \ `If.java`，然后编译并运行程序，以看到所有语句都被执行——因为在这种情况下，两个测试的评估结果均为 `true`：\n\n![image](img/pg44_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n表达式可以使用 `true` 和 `false` 关键字。测试表达式 `( 2 < 4 )` 是 `( 2\
  \ < 4 == true )` 的简写。\n\n条件测试还可以评估复杂的表达式，以测试多个条件的布尔值。括号包裹每个测试条件以建立优先级——因此它们会被先评估。布尔运算符\
  \ `&&`（与/AND）确保只有当两个测试条件都为 `true` 时，复杂表达式才会返回 `true`：\n\n`if ( (test-condition1)\
  \ && (test-condition2) ) execute-this-code;`\n\n布尔运算符 `||`（或/OR）确保只有当测试条件中的一个为 `true`\
  \ 时，复杂表达式才会返回 `true`：\n\n`if ( (test-condition1) || (test-condition2) ) execute-this-code;`\n\
  \n这些组合可以形成更长的复杂表达式：\n\n![image](img/5g.jpg)在 `If.java` 的 main 方法内部插入此行来声明并初始化一个名为\
  \ `num` 的整数变量\n\n```java\nint num = 8 ;\n```\n\n![image](img/6g.jpg)添加第三个条件测试，当\
  \ `num` 变量的值在指定范围内，或者恰好等于指定值时，执行一条语句\n\n```java\nif ( ( ( num > 5 ) && ( num < 10\
  \ ) ) || ( num == 12 ) )\n    System.out.println( “Number is 6-9 inclusive, or 12”\
  \ ) ;\n```\n\n![image](img/7g.jpg)重新编译程序并再次运行一次，以看到复杂表达式后的语句被执行\n\n![image](img/pg45_1.jpg)\n\
  \n![image](img/8g.jpg)更改赋值给 `num` 变量的值，使其既不在指定的 6-9 范围内，也不恰好等于 12。重新编译程序并再次运行，现在你会看到复杂表达式后的语句没有被执行\n\
  \n![image](img/hot.jpg)\n\n范围可以使用 `>=` 和 `<=` 运算符扩展到包含上限和下限。\n\n![image](img/forget.jpg)\n\
  \n复杂表达式使用 `==` 等于运算符来指定精确匹配，而不是 `=` 赋值运算符。\n\n### 分支的替代方案\n\n`else` 关键字与 `if` 关键字结合使用，创建\
  \ `if else` 语句，根据测试表达式的评估结果为程序提供备选择的分支。在最简单的形式中，它仅仅是在测试失败时指定一个备选语句执行：\n\n`if (test-expression)\
  \ code-to-be-executed-when-true;`\n`else code-to-be-executed-when-false;`\n\n![image](img/ycap.jpg)每个备选分支可以是单条语句，也可以是包含多条语句的语句——包含在大括号内\n\
  \n![image](img/1g.jpg)创建一个名为“Else”的新程序，其中包含标准的 main 方法\n\n```java\nclass Else\n\
  {\n    public static void main (String[] args) {\n    }\n}\n```\n\n![image](img/j1.jpg)\n\
  \nElse.java\n\n![image](img/2g.jpg)在 main 方法内部插入此行来声明并初始化一个名为 `hrs` 的整数变量\n\n```java\n\
  int hrs = 11 ;\n```\n\n![image](img/3g.jpg)插入这个简单的条件测试，当 `hrs` 变量的值为 13 时，执行单条语句\n\
  \n```java\nif ( hrs < 13 )\n{\n    System.out.println( “Good morning: ” + hrs )\
  \ ;\n}\n```\n\n![image](img/4g.jpg)将程序保存为 `Else.java`，然后编译并运行程序，以看到语句被执行\n\n![image](img/pg44_1.jpg)注意在\
  \ `else` 关键字之前，第一条语句像通常一样用分号结束的\n\n![image](img/5g.jpg)更改赋值给 `hrs` 变量的值为 15，然后在\
  \ `if` 语句之后直接添加此备选分支\n\n```java\nelse if ( hrs < 18 )\n{\n    System.out.println(\
  \ “Good afternoon: ” + hrs ) ;\n}\n```\n\n![image](img/6g.jpg)保存更改，重新编译并再次运行程序，以看到只执行备选语句\n\
  \n![image](img/7g.jpg)有时提供一个最终的 `else` 分支（不嵌套 `if` 语句）是有必要的，以便指定在没有测试表达式评估为 `true`\
  \ 时执行的“默认”语句：\n\n![image](img/8g.jpg)更改赋值给 `hrs` 变量的值为 21，然后在 `if else` 语句末尾添加此默认分支\n\
  \n```java\nelse System.out.println( “Good evening: ” + hrs ) ;\n```\n\n![image](img/pg45_1.jpg)保存更改，重新编译并再次运行程序，以只执行默认语句\n\
  \n![image](img/hot.jpg) \n\n条件分支是计算机程序运行的基本过程。\n\n### 切换分支\n\n大量的 `if else` 语句为程序提供了许多条件分支，可能会变得臃肿。当测试表达式反复评估同一个变量值时，`switch`\
  \ 语句通常提供更优雅的解决方案。\n\n![image](img/ycap.jpg)\n\n典型的 switch 语句块如下：\n\n```java\nswitch\
  \ (test-variable)\n{\n    case value1: code-to-be-executed-when-true; break;\n \
  \   case value2: code-to-be-executed-when-true; break;\n    case value3: code-to-be-executed-when-true;\
  \ break;\n    default : code-to-be-executed-when-false;\n}\n```\n\n\n\n\n`switch`\
  \ 语句的工作方式不同寻常。它接收一个指定的变量，然后尝试在多个 `case` 选项中匹配其赋值值。随后，将执行与匹配值相同的选项相关的语句。\n\n可选地，`switch`\
  \ 语句可以包含一个使用 `default` 关键字的最终选项，用于指定当没有 `case` 选项匹配指定变量的赋值值时要执行的语句。\n\n每个选项都以 `case`\
  \ 关键字开头，并跟跟着一个要匹配的值。接着是 `:` 冒号以及匹配成功后要执行的语句（如果有的话）。\n\n重要的一点是，与每个 `case` 选项相关的语句或语句块必须由\
  \ `break` 关键字终止。否则，程序将在执行完匹配选项后继续执行其他 `case` 选项的语句。有时，这种做法是有意义的，即可以指定多个 `case` 选项，让它们在匹配时都执行相同的语句——例如，每三个选项块执行同一个语句，如下所示：\n\
  \n```java\nswitch (test-variable)\n{\ncase value1 : case value2 : case value3 :\n\
  \    code-A-to-be-executed-when-true ; break ;\ncase value4 : case value5 : case\
  \ value6 :\n    code-B-to-be-executed-when-true ; break ;\n}\n```\n\n![image](img/snake.jpg)\n\
  \n缺少 `break` 关键字并不是语法错误——请确保 `switch` 块中存在所有预期的 `break`，以避免意外结果。\n\n![image](img/1g.jpg)创建一个名为“Switch”的新程序，其中包含标准的\
  \ main 方法\n\n```java\nclass Switch\n{\n    public static void main ( String[] args\
  \ ) { }\n}\n```\n\n![image](img/j1.jpg)\n\nSwitch.java\n\n![image](img/2g.jpg)在\
  \ main 方法内部声明并初始化三个整数变量\n\n```java\nint month = 2, year = 2022, num = 31 ;\n```\n\
  \n![image](img/3g.jpg)添加一个 `switch` 语句块来测试赋值给 `month` 变量的值\n\n```java\nswitch (\
