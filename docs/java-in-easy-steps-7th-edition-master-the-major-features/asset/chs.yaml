  \ 总结\n\n- 将程序分成多个方法并在需要时调用增加了灵活性，并更容易调试。\n- 重载方法具有相同的名称，但参数不同。\n- 在方法内部定义的变量具有局部作用域，而类变量在整个类中具有全局作用域。\n\
  - `static` 关键字用于声明类方法和类变量 ——它们在整个类中具有全局作用域。\n- `public` 关键字显式允许从任何类访问。\n- 类声明可以包含\
  \ `extends` 关键字，以指定它将继承的父类。\n- 使用类名和点符号可以显式访问特定的类方法或类变量。\n- 真实世界对象具有属性和行为，可以通过程序中的变量和方法来表示。\n\
  \n\n\n\n\nJava 包含一个名为 `java.io` 的包，用于处理文件输入输出过程。通过在 `.java` 文件的最开始包含 `import` 语句，可以使程序可以使用该包。在语句\
  \ `import java.io.* ;` 中可以使用通配符字符 `*` 来表示“所有类”。\n\n![image](img/pg116_1.jpg)\n\n\
  `java.io` 包有一个名为 `File` 的类，用于访问文件或完成目录。必须先使用 `new` 关键字创建一个 `File` 对象，并将文件名或目录名作为构造函数的参数。例如，创建一个名为\
  \ `info` 代表名为 `info.dat` 的本地文件的 `File` 对象的语法如下：\n\n```\nFile info = new File( “info.dat”\
  \ ) ;\n```\n\n该文件将位于与程序相同的目录中，但参数也可以指定位于其他地方的文件路径。请注意，创建 `File` 对象并不会实际创建文件，而仅仅是表示文件的手段。\n\
  \n一旦创建了表示文件的 `File` 对象，就可以调用它的方法来操作文件。最实用的 `File` 对象方法列在下表中，并附有简要说明：\n\n| `Method:`\
  \ | `Returns:` |\n| :--- | :--- |\n| `exists()` | 如果文件存在则返回 `true` – 不存在则返回 `false`\
  \ |\n| `getName()` | 作为 `String` 类型的文件名 |\n| `length()` | 文件中的字节数，类型为 `long` |\n\
  | `createNewFile()` | 如果能够创建新的唯一文件则返回 `true` |\n| `delete()` | 如果能够成功删除文件则返回 `true`\
  \ |\n| `renameTo(File)` | 如果能够成功重命名文件则返回 `true` |\n| `list()` | `String` 类型的文件或文件夹名称数组\
  \ |\n\n![image](img/forget.jpg)\n\n作为构造函数参数指定的名必须包含在引号内。\n\n![image](img/1v.jpg)启动一个新程序，导入所有\
  \ `java.io` 类的功能\n\n```\nimport java.io.* ;\n```\n\n![image](img/common.jpg)\n\n\
  ListFiles.java\n\n![image](img/2v.jpg)添加一个名为“ListFiles”的类，包含标准的 main 方法\n\n```\n\
  class ListFiles\n{\n    public static void main( String[] args ) {      }\n}\n```\n\
  \n![image](img/3v.jpg)在 main 方法的大括号之间，插入一个语句为名为“data”的目录文件夹创建一个 `File` 对象\n\n```\n\
  File dir = new File( “data” ) ;\n```\n\n![image](img/4v.jpg)添加一个 `if` 语句输出该文件夹中所有文件的名称，或者如果文件夹为空则输出消息\n\
  \n```java\nif ( dir.exists() )\n{\n    String[] files = dir.list() ;\n    System.out.println(\
  \ files.length + “ files found...” ) ;\n    for ( int i = 0 ; i < files.length ;\
  \ i++ )\n    {\n               System.out.println( files[i] ) ;\n    }\n}\nelse\n\
