  ## MouseListener\n\n![image](img/pg160_1.jpg)\n\nSwing 组件可以通过 `MouseListener` 接口识别用户的鼠标动作，该接口会将\
  \ `MouseEvent` 事件传递给以下五个事件处理方法：\n\n| 事件处理器: | 描述: |\n| :--- | :--- |\n| `mousePressed(\
  \ MouseEvent )` | 按钮被按下 |\n| `mouseReleased( MouseEvent )` | 按钮被释放 |\n| `mouseClicked(\
  \ MouseEvent )` | 按钮已释放 |\n| `mouseEntered( MouseEvent )` | 鼠标移入 |\n| `mouseExited(\
  \ MouseEvent )` | 鼠标移出 |\n\n鼠标移动可以通过 `MouseMotionListener` 接口识别，该接口会将 `MouseEvent`\
  \ 事件传递给两个事件处理器：\n\n| 事件处理器: | 描述: |\n| :--- | :--- |\n| `mouseMoved( MouseEvent\
  \ )` | 鼠标被移动 |\n| `mouseDragged( MouseEvent )` | 鼠标被拖动 |\n\n当程序实现 `MouseListener`\
  \ 或 `MouseMotionListener` 接口时，必须声明所有相关的事件处理器方法——即使它们并不全部都被实际使用。\n\n由 `MouseMotionListener`\
  \ 接口传递的 `MouseEvent` 对象拥有 `getX()` 和 `getY()` 方法，它们返回相对于生成事件组件的当前鼠标坐标。\n\n![image](img/1r.jpg)从这里编辑一份\
  \ `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Mouse”。然后，添加初始语句以导入 `java.awt.event`\
  \ 包的功能。\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](img/common.jpg)\n\
  \nMouse.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `KeyListener` 接口和 `MouseMotionListener`\
  \ 接口\n\n```java\nclass Mouse extends JFrame implements MouseListener, MouseMotionListener\n\
  ```\n\n![image](img/3r.jpg)在 `Mouse()` 构造函数之前，创建一个 `JTextArea` 组件和两个存储坐标的整数变量\n\n\
  ```java\nJTextArea txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n![image](img/4r.jpg)在\
  \ `Mouse()` 构造函数中，插入语句将 `JTextArea` 组件添加到 `JPanel` 容器中并使其生成 `MouseEvent` 事件\n\n\
  ```java\npnl.add( txtArea ) ;\ntxtArea.addMotionListener( this ) ;\ntxtArea.addMouseListener(\
  \ this ) ;\n```\n\n![image](img/5r.jpg)在构造方法之后，为 `MouseMotionListener` 接口添加事件处理器\n\
  \n```java\npublic void mouseMoved( MouseEvent event )\n{\n    x = event.getX() ;\n\
  \    y = event.getY() ;\n}\n\npublic void mouseDragged( MouseEvent event )\n{\n\
  \    x = event.getX() ;\n    y = event.getY() ;\n}\n```\n\n![image](img/6r.jpg)为\
  \ `MouseListener` 接口添加五个事件处理器\n\n```java\npublic void mousePressed( MouseEvent event\
  \ )\n{\n    txtArea.append( “\\nPressed at X: ”+x+“Y: “+y ) ;\n}\n\npublic void\
  \ mouseReleased( MouseEvent event )\n{\n    txtArea.append( “\\nReleased” ) ;\n\
  }\n\npublic void mouseClicked( MouseEvent event )\n{\n    txtArea.append( “\\nClicked”\
  \ ) ;\n}\n\npublic void mouseEntered( MouseEvent event )\n{\n    txtArea.setText(\
  \ “\\nEntered” ) ;\n}\n\npublic void mouseExited( MouseEvent event )\n{\n    txtArea.setText(\
  \ “\\nExited” ) ;\n}\n```\n\n![image](img/7r.jpg)将程序保存为 `Mouse.java`，然后编译并运行程序，点击\
