  \n## 总结\n\n- 程序开头可以包含一个或多个 `import` 语句，以便可以使用其他类的功能。\n- `import` 语句可以使用通配符字符导入包中的所有类，也可以通过名称导入单个类。\n\
  - `java.io` 包包含设计用于处理输入输出过程的类。\n- `File` 对象可以用于访问文件和目录。\n- `InputStreamReader` 对象将输入字节解码为字符，而\
  \ `BufferedReader` 读取其解码后的字符。\n- `FileReader` 对象可以用于将文本文件字节解码为字符，供 `BufferedReader`\
  \ 对象读取。\n- `FileWriter` 对象和 `BufferedWriter` 对象可以创建和更新文本文件。\n- `java.util` 包包含处理数据集合的工具类，例如使用其\
  \ `Arrays` 类进行数组操作。\n- `java.util` 包还包含一个 `ArrayList` 类，它拥有可以轻松操作顺序化列表项的方法。\n- `ArrayList`\
  \ 对象是一个集合（Collection），它必须指定列表可能包含的项泛型类型，例如 `<String>`。\n- Lambda 表达式是一个匿名方法，可以指定其执行的位置。\n\
  - `java.time` 包包含一个 `LocalDateTime` 类，该类提供了日期和时间组件的字段。\n- `java.text` 包包含一个 `NumberFormat`\
  \ 类，可格式化数字和货币。\n- `java.time.format` 包包含一个 `DateTimeFormatter` 类，可以指定格式化日期和时间的模式。\n\
  \n## 构建接口\n\n本章演示了如何使用 Java Swing 组件创建图形化程序界面。\n\n- 创建窗口\n- 添加推送按钮\n- 添加标签\n- 添加文本字段\n\
  - 添加项目选择器\n- 添加单按钮\n- 排列组件\n- 更改外观\n- 总结\n\n### 创建窗口\n\n程序可以使用 Swing 组件提供图形用户界面（GUI）。`javax.swing`\
  \ 包包含了使用原生操作系统创建各种组件的类。\n\n必须通过使用 `extends` 关键字声明 `JFrame` 的子类来创建一个类。类的构造函数应该包含设置这些要求的语句：\n\
  \n- 窗口标题——作为 `JFrame` 类 `super()` 方法的参数。\n- 窗口大小——以像素作为参数传递给 `setSize()` 方法。\n-\
  \ 用户关闭窗口时执行的操作——作为常量参数传递给 `setDefaultCloseOperation()` 方法。\n- 显示窗口——作为布尔参数传递给 `setVisible()`\
  \ 方法。\n\n![image](img/snake.jpg)\n\n通过记住 `JAVA` 来记住 `javax.swing` 中的 `x`。\n\n此外，构造函数可以将\
  \ `JPanel` 容器组件添加到窗口，可以使用 `JFrame` 类的 `add()` 方法添加小的组件。\n\n默认情况下，`JPanel` 容器采用 `FlowLayout`\
  \ 布局管理器，该器从左到右布局组件，并在右边缘换行。\n\n相反步骤描述了如何创建一个带有 `FlowLayout` 布局管理器的 `JPanel` 窗口。该窗口将出现在本书后续的示例中，这些示例演示了如何向\
  \ `JPanel` 容器添加各种组件。\n\n![image](img/hot.jpg)\n\n布局管理器在此处有更详细的介绍](#chapter08.html_sec72)。\n\
  \n\n\n\n\n```\nadd( pnl ) ;\n\nsetVisible( true ) ;\n\n}\n```\n\n![image](img/5b.jpg)通过在主方法中插入此行创建\
  \ `Window` 类的实例\n\n```java\nWindow gui = new Window() ;\n```\n\n![image](img/6b.jpg)将程序保存为\
  \ `Window.java`，然后编译并运行程序以看到基础窗口出现\n\n![image](img/pg135_1.jpg)\n\n![image](img/pg135_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n`EXIT_ON_CLOSE` 操作是 `JFrame` 类的一个常量成员。当窗口关闭时，它会退出程序。\n\
  \n![image](img/hot.jpg)\n\n注意这里是如何使用 `add()` 方法将 `JPanel` 对象添加到 `JFrame` 窗口中的。\n\
  \n### 添加推按钮\n\nSwing 的 `JButton` 类创建一个可以添加到图形界面中的推按钮组件。这允许用户通过点击按钮执行操作来与程序交互。\n\n\
  ![image](img/pg136_1.jpg)\n\n使用 `new` 关键字创建 `JButton` 对象，其构造函数接受一个 `String` 参数，用于指定在按钮上显示的文本。\n\
  \n按钮上也可以显示图像。必须先创建一个 `ImageIcon` 对象来表示图像，并将图像文件名作为其构造函数的参数。通常，图像将位于程序所在目录，但参数也可以包含本地目录之外的图像路径。\n\
  \n![image](img/hot.jpg)\n\n下一章 第 9 章 详细介绍了如何创建事件处理方法来响应用户操作（例如按钮点击）。\n\n将 `ImageIcon`\
  \ 对象的名称指定作为 `JButton` 构造函数的参数，以便在按钮上显示该图像；或者指定一个 `String` 和一个 `ImageIcon` 作为其两个参数，用以同时显示文本和图像。\n\
  \n![image](img/1b.jpg)从这里 编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Buttons”\n\
  \n![image](img/common.jpg)\n\nButtons.java\n\n![image](img/2b.jpg)在 `Buttons()`\
  \ 构造函数之前，创建两个 `ImageIcon` 对象\n\n```java\nImageIcon tick = new ImageIcon( “Tick.png”\
  \ ) ;\nImageIcon cross = new ImageIcon( “Cross.png” ) ;\n```\n\n![image](img/3b.jpg)接下来，创建三个\
  \ `JButton` 对象，分别显示文本、图像以及文本和图像\n\n```java\nJButton btn = new JButton( “Click Me”\
  \ ) ;\nJButton tickBtn = new JButton( tick ) ;\nJButton crossBtn = new JButton(\
  \ “STOP” , cross ) ;\n```\n\n![image](img/4b.jpg)在 `Buttons()` 构造函数内部，插入三个语句将 `JButton`\
  \ 组件添加到 `JPanel` 容器中\n\n```java\npnl.add( btn ) ;\npnl.add( tickBtn ) ;\npnl.add(\
  \ crossBtn ) ;\n```\n\n![image](img/5b.jpg)将程序保存为 `Buttons.java`，然后编译并运行程序，看到窗口中出现推按钮\n\
  \n![image](img/pg137_1.jpg)\n\n![image](img/pg137_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n`JPanel` 对象有一个 `add()` 方法 —— 用于向该面板添加组件。\n\n![image](img/hot.jpg)\n\n创建 Java 存档\
  \ (JAR) 的详细信息可以参考这里。\n\n按钮在被点击时会有图形化响应，但在程序提供事件处理方法来响应每次点击事件之前，它们不会执行任何操作。\n\n如果程序打算部署在单个\
  \ Java 存档 (JAR) 中，则必须在创建表示它们的 `ImageIcon` 对象之前，通过 `ClassLoader` 对象加载图像资源。\n\n向 `ClassLoader`\
  \ 的 `getResource()` 方法指定资源文件名或路径会返回一个 URL，该 URL 可以作为 `ImageIcon` 构造函数的参数。`java.net`\
  \ 包提供了一个实用的 `URL` 类，可以先赋值给这些对象。\n\n![image](img/6b.jpg)在 `Buttons()` 构造函数之前，创建一个\
  \ `ClassLoader` 对象\n\n```java\nClassLoader ldr = this.getClass().getClassLoader()\
  \ ;\n```\n\n![image](img/7b.jpg)加载图像资源的 URL\n\n```java\njava.net.URL tickURL = ldr.getResource(\
  \ “Tick.png” ) ;\njava.net.URL crossURL = ldr.getResource( “Cross.png” ) ;\n```\n\
  \n![image](img/8b.jpg)修改第 2 步中的 `ImageIcon()` 构造函数以使用 URL\n\n```java\nImageIcon\
  \ tick = new ImageIcon( tickURL ) ;\nImageIcon cross = new ImageIcon( crossURL )\
  \ ;\n```\n\n![image](img/9b.jpg)保存更改，重新编译并运行程序 —— 它将像以前一样运行，但现在可以部署在 JAR 中了\n\n\
  ![image](img/hot.jpg)\n\n注意这里是如何使用 `getClass()` 方法和 `this` 关键字来引用此类类对象的。\n\n###\
  \ 添加标签\n\nSwing 的 `JLabel` 类创建一个可以添加到图形界面中的标签组件。这可以用于显示非交互式文本或图像，或同时显示文本和图像。\n\n\
  ![image](img/pg138_1.jpg)`JLabel` 对象使用 `new` 关键字创建，其构造函数接受一个 `String` 参数来指定显示的文本。此外，通过向其\
  \ `setToolTip()` 方法指定一个 `String`，可以让 `JLabel` 对象在光标悬停时显示工具提示。\n\n![image](img/1b.jpg)从这里\
  \ 编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Labels”\n\n![image](img/common.jpg)\n\
  \nLabels.java\n\n![image](img/2b.jpg)在 `Labels()` 构造函数之前，创建一个 `ImageIcon` 对象\n\n\
  ```java\nImageIcon duke = new ImageIcon( “Duke.png” ) ;\n```\n\n![image](img/3b.jpg)接下来，创建三个\
  \ `JLabel` 对象分别显示图像、文本以及文本和图像\n\n```java\nJLabel lbl1 = new JLabel( duke ) ;\nJLabel\
  \ lbl2 = new JLabel( “Duke is the friendly mascot of technology.” ) ;\nJLabel lbl3\
  \ = new JLabel( “Duke” , duke , JLabel.CENTER ) ;\n```\n\n![image](img/4b.jpg)在\
  \ `Labels()` 构造函数内部，插入此语句为第一个标签创建工具提示\n\n```java\nlbl1.setToolTip( “Duke - the Mascot”\
  \ ) ;\n```\n\n![image](img/5b.jpg)添加这两个语句将文本居中对齐在第三个标签下方\n\n```java\nlbl3.setHorizontalTextPosition(\
  \ JLabel.CENTER ) ;\nlbl3.setVerticalTextPosition( JLabel.BOTTOM ) ;\n```\n\n![image](img/6b.jpg)现在，添加三个语句将\
  \ `JLabel` 组件添加到 `JPanel` 容器中\n\n```java\npnl.add( lbl1 ) ;\npnl.add( lbl2 ) ;\n\
  pnl.add( lbl3 ) ;\n```\n\n![image](img/7b.jpg)将程序保存为 `Labels.java`，然后编译并运行程序，将光标停在第一个标签上\n\
  \n![image](img/pg139_1.jpg)\n\n![image](img/pg139_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n`JLabel` 对齐常量包括 `LEFT`、`CENTER`、`RIGHT`、`TOP` 和 `BOTTOM`。`JLabel` 对象可以接受三个参数：`String`、`ImageIcon`\
  \ 和 `JLabel` 对齐值。例如，文本的相对位置可以通过 `JLabel` 对象的 `setHorizontalPosition()` 和 `setVerticalPosition()`\
  \ 方法来确定。\n\n\n\n\n[content]\n\n```\nnew ImageIcon( ldr.getResource( “Duke.png” )\
  \ ) ;\n```\n\n![image](img/10b.jpg)保存更改，然后重新编译并运行程序——它的运行方式将与之前一样，但现在可以部署到 JAR 中\n\
  \n![image](img/hot.jpg)\n\n关于如何创建 Java 存档 (JAR) 的详细信息可以查阅此处。\n\n## 添加文本字段\n\nSwing\
  \ 的 `JTextField` 类创建一个单行文本字段组件，该组件可以添加到图形界面中。它可以用于显示可编辑的文本，并允许用户输入文本与程序进行交互。\n\n\
  ![image](img/pg140_1.jpg)\n\n`JTextField` 对象使用 `new` 关键字创建，其构造函数可以接受一个 `String`\
  \ 参数，用于指定在在该字段中显示的默认文本。在这种情况下，组件的大小将调整为适应该 `String` 的长度。或者，该参数也可以是一个数值，用于指定文本字段的大小。构造函数还可以接受两个参数，同时指定默认文本和文本字段的大小。\n\
  \n![image](img/hot.jpg)\n\n在需要输入字符不可见的情况下，使用 `JPasswordField` 类代替 `JTextField` 类。\n\
  \n可以使用 `JTextArea` 类创建多行文本字段，其构造函数接受两个数值参数，分别指定它的行数和宽度。或者，可以提供三个参数，分别指定默认文本、行数和宽度。通过向\
  \ `JTextArea` 对象的 `setLineWrap()` 方法和 `setWrapStyleWord()` 方法传递 `true` 作为参数，可以使该字段内的文本在单词结束处自动换行。\n\
  \n当输入到 `JTextArea` 组件的文本超过其初始大时，组件将扩展以容纳文本。要使组件具有固定大小并带有滚动功能，可以将其放置在 `JScrollPane`\
  \ 容器中。该容器使用 `new` 关键字创建，并将 `JTextArea` 的名称作为其参数。\n\n默认情况下，滚动条只有在字段包含超过其初始大小的文本时才会出现——但通过向\
  \ `JScrollPane` 对象的命名巧妙的 `setVerticalScrollBarPolicy()` 或 `setHorizontalScrollBarPolicy()`\
  \ 方法传递 `JScrollPane` 常数作为参数，可以使其始终出现。例如，要始终显示垂直滚动条，请使用 `JScrollPane.VERTICAL_SCROLLBAR_ALWAYS`\
  \ 常数作为参数。\n\n![image](img/1b.jpg)从此处编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”改为“TextFields”\n\
  \n![image](img/common.jpg)\n\nTextFields.java\n\n![image](img/2b.jpg)在 `TextFields()`\
  \ 构造函数之前，创建两个 `JTextField` 对象\n\n```\nJTextField txt1 = new JTextField( 38 ) ;\n\
  ```\n\n```\nJTextField txt2 = new JTextField( “Default Text” , 38 ) ;\n```\n\n![image](img/3b.jpg)创建一个五行高的\
  \ `JTextArea` 对象\n\n```\nJTextArea txtArea = new JTextArea( 5 , 37 ) ;\n```\n\n\
  ![image](img/4b.jpg)添加一个 `JScrollPane` 对象——用于包含第 3 步中创建的 `JTextArea`\n\n```\nJScrollPane\
  \ pane = new JScrollPane( txtArea ) ;\n```\n\n![image](img/5b.jpg)在 `TextFields()`\
  \ 构造方法方法中，插入语句使 `JTextArea` 对象在单词结束处换行\n\n```\ntxtArea.setLineWrap( true ) ;\n```\n\
  \n```\ntxtArea.setWrapStyleWord( true ) ;\n```\n\n![image](img/6b.jpg)插入一条语句为 `JTextArea`\
  \ 对象始终显示垂直滚动条\n\n```\npane.setVerticalScrollBarPolicy( JScrollPane.VERTICAL_SCROLLBAR_ALWAYS\
  \ ) ;\n```\n\n![image](img/7b.jpg)插入两条语句将 `JTextField` 组件添加到 `JPanel` 容器中\n\n```\n\
  pnl.add( txt1 ) ;\n```\n\n```\npnl.add( txt2 ) ;\n```\n\n![image](img/8b.jpg)插入另一语句将\
  \ `JScrollPane` 容器（包含 `JTextArea` 字段）添加到 `JPanel` 容器中\n\n```\npnl.add( pane ) ;\n\
  ```\n\n![image](img/9b.jpg)将程序保存为 **TextFields.java**，然后编译并运行程序，在文本区域输入一些文本\n\n\
  ![image](img/pg141_1.jpg)\n\n![image](img/pg141_2.jpg)\n\n![image](img/snake.jpg)\n\
  \n`JTextArea` 组件没有滚动能力，除非它包含在 `JScrollPane` 组件内部。\n\n## 添加项目选择器\n\nSwing 的 `JCheckBox`\
  \ 类创建一个复选框组件，该组件可以添加到图形界面中。它可以允许用户选择或取消选择程序中的单个项目。\n\n`JCheckBox` 对象使用 `new` 关键字创建，其构造函数接受一个\
  \ `String` 参数，指定显示在复选框旁边的文本。它还可以接受第二个 `true` 参数，使复选框默认被选中。\n\n![image](img/pg142_1.jpg)\n\
  \n可以通过 `JComboBox` 类提供项目选择，它创建一个下拉列表，用户可以从中选择任何单个项目。该对象使用 `new` 关键字创建，其构造函数通常接受数组名称作为参数。同样，`JList`\
  \ 类也可以提供项目选择，用户可以从中选择一个或多个项目。它使用 `new` 关键字创建，其构造函数接受数组作为参数。`JList` 和 `JComboBox`\
  \ 在创建时必须指定泛型，例如 `<String>`。\n\n![image](img/1b.jpg)从此处编辑 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”改为“Items”\n\
  \n![image](img/common.jpg)\n\nItems.java\n\n![image](img/2b.jpg)在 `Items()` 构造函数之前，创建一个用于选择的\
  \ `String` 数组\n\n```\nString[] toppings = { “Pepperoni” , “Mushroom” , “Ham” , “Tomato”\
  \ } ;\n```\n\n![image](img/3b.jpg)创建 `JCheckBox` 对象呈现每个项目——默认选中一个\n\n```\nJCheckBox\
  \ chk1 = new JCheckBox( toppings[0] ) ;\nJCheckBox chk2 = new JCheckBox( toppings[1]\
  \ , true ) ;\nJCheckBox chk3 = new JCheckBox( toppings[2] ) ;\nJCheckBox chk4 =\
  \ new JCheckBox( toppings[3] ) ;\n```\n\n![image](img/4b.jpg)添加第二个用于选择的 `String`\
  \ 数组\n\n```\nString[] styles = { “Deep Dish” , “Gourmet Style” , “Thin & Crispy”\
  \ } ;\n```\n\n![image](img/5b.jpg)创建一个 `JComboBox` 对象呈现第二个数组中的每个项目\n\n```\nJComboBox<String>\
  \ box1 = new JComboBox<String>( styles ) ;\n```\n\n![image](img/6b.jpg)添加 `JList`\
  \ 对象呈现第一个数组中的每个项目——从列表\n\n```\nJList<String> lst1 = new JList<String>( toppings\
  \ ) ;\n```\n\n![image](img/7b.jpg)在 `Items()` 构造方法中，插入语句将 `JCheckBox` 组件添加到 `JPanel`\
  \ 容器中\n\n```\npnl.add( chk1 ) ;\npnl.add( chk2 ) ;\npnl.add( chk3 ) ;\npnl.add(\
  \ chk4 ) ;\n```\n\n![image](img/8b.jpg)插入语句设置默认选择并将 `JComboBox` 组件添加到 `JPanel` 容器中\n\
  \n```\nbox1.setSelectedIndex( 0 ) ;\npnl.add( box1 ) ;\n```\n\n![image](img/9b.jpg)现在，插入一条语句将\
  \ `JList` 组件添加到 `JPanel` 容器中\n\n```\npnl.add( lst1 ) ;\n```\n\n![image](img/10b.jpg)将程序保存为\
  \ **Items.java**，然后编译并运行程序，从列表中选择项目\n\n![image](img/pg143_1.jpg)\n\n![image](img/pg143_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n`JComboBox` 组件只能选择一个项目——`JList` 组件可以选择多个项目。\n\n![image](img/hot.jpg)\n\
  \n关于如何创建事件处理方法以响应用户操作（如项目选择）的详细信息可以查阅第 9 章。\n\n\n\n\n`JRadioButton` 类创建了一个可以添加到图形界面的单选按钮组件。这可以用于允许用户从一组单选按钮中选择一个项目。\n\
  \n![image](img/pg144_1.jpg)\n\n使用 `new` 关键字创建 `JRadioButton` 对象，其构造函数接受一个 `String`\
  \ 类型参数，用于指定在单选按钮旁边显示的文本。它还可以接收第二个 `true` 参数，以使单选按钮默认处于被选中状态。\n\n`ButtonGroup` 对象在逻辑上将多个单选按钮分组，使得该组在任何时间只有一个按钮被选中。通过将单选按钮名称作为组的\
  \ `add()` 方法的参数，可以将每个单选按钮添加到 `ButtonGroup` 对象中。\n\n![image](img/1b.jpg)\n\n从这里 复制\
  \ `Window.java` 并进行编辑，将声明、构造函数和实例化语句中的类名从“Window”更改为“Radios”\n\n![image](img/common.jpg)\n\
  \nRadios.java\n\n![image](img/2b.jpg)\n\n在 `Radios()` 构造函数之前，创建三个 `JRadioButton`\
  \ 对象——其中一个默认被选中\n\n```\nJRadioButton rad1 = new JRadioButton( “Red” , true ) ;\n\
  JRadioButton rad2 = new JRadioButton( “Rosé” ) ;\nJRadioButton rad3 = new JRadioButton(\
  \ “White” ) ;\n```\n\n![image](img/3b.jpg)\n\n接下来，创建一个 `ButtonGroup` 对象来对单选按钮分组\n\
  \n```\nButtonGroup wines = new ButtonGroup() ;\n```\n\n![image](img/4b.jpg)\n\n\
  在 `Radios()` 构造方法中，插入语句将每个 `JRadioButton` 组件添加到 `JButtonGroup`\n\n```\nwines.add(\
  \ rad1 ) ;\nwines.add( rad2 ) ;\nwines.add( rad3 ) ;\n```\n\n![image](img/5b.jpg)\n\
  \n插入语句将 `JRadioButton` 组件添加到 `JPanel` 容器中\n\n```\npnl.add( rad1 ) ;\npnl.add( rad2\
  \ ) ;\npnl.add( rad3 ) ;\n```\n\n![image](img/6b.jpg)\n\n将程序保存为 `Radios.java`，然后编译并运行程序，在默认选项之后选择任一单选按钮\n\
  \n![image](img/pg145_1.jpg)\n\n![image](img/pg145_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n`ButtonGroup` 对象仅在逻辑上对按钮进行分组，而不是物理上。\n\n![image](img/hot.jpg)\n\n关于如何创建事件处理方法以响应用户操作的细节，可以在第\
  \ 9 章中找到。\n\n之前的示例演示了常用的 Swing 组件——`JButton`、`JLabel`、`JTextField`、`JCheckBox`、`JComboBox`、`JList`\
  \ 和 `JRadioButton`。`javax.swing` 包中还有许多专门的组件，其细节可以在 Java 文档中找到——例如下面的 `JSlider`、`JProgressBar`\
  \ 和 `JMenuBar` 组件：\n\n![image](img/pg145_3.jpg)\n\n![image](img/pg145_4.jpg)\n\n\
  ![image](img/pg145_5.jpg)\n\n![image](img/hot.jpg)\n\n尝试使用 Java 文档为 Radios 程序添加一个\
  \ `JSlider` 组件——有关如何使用文档的细节请参阅这里。\n\n### 布局组件\n\n`java.awt` 包（抽象窗口工具包）包含许多布局管理器类，可以使用不同的方式将组件放置在容器中。\n\
  \n![image](img/pg146_1.jpg)\n\n使用 `new` 关键字创建布局管理器对象，然后可以将其作为 `JPanel` 构造函数的参数，让面板使用该布局。当组件被添加到面板时，它们将根据指定的布局管理器的规则进行放置。\n\
  \n| 布局管理器: | 规则: |\n| :--- | :--- |\n| `BorderLayout` | 放置在北、南、东、西和中心（内容面板的默认值）\
  \ |\n| `BoxLayout` | 在单行或单列中放置 |\n| `CardLayout` | 在不同时间将不同组件放在指定区域 |\n| `FlowLayout`\
  \ | 从左到右在换行的行中放置（`JPanel` 的默认值） |\n| `GridBagLayout` | 在单元格网格中放置，允许组件跨单元格 |\n| `GridLayout`\
  \ | 在行和列的网格中放置 |\n| `GroupLayout` | 水平和和垂直放置 |\n| `SpringLayout` | 通过相对间距放置 |\n\n\
  顶层 `JFrame` 对象有一个“内容面板”容器，它默认使用 `BorderLayout` 布局管理器放置组件。这可以用来放置多五个 `JPanel` 容器，每个面板可以使用其默认的\
  \ `FlowLayout` 布局管理器或上表中的任何布局管理器。使用各种布局管理器可以满足大多数布局需求。\n\n内容面板可以用 `java.awt.Container`\
  \ 对象表示，其 `add()` 方法可以指定放置在内容面板内的组件的位置和名称。\n\n![image](img/forget.jpg)\n\n你可以在 Java\
  \ 文档的 `java.awt` 部分找到每个布局管理器的更多详细信息。\n\n![image](img/1b.jpg)\n\n从这里 复制 `Window.java`\
  \ 并进行编辑，将声明、构造函数和实例化语句中的类名从“Window”更改为“Layout”，并在程序开头添加 `java.awt` 包的导入\n\n```\n\
  import java.awt.*;\n```\n\n![image](img/common.jpg)\n\nLayout.java\n\n![image](img/2b.jpg)\n\
  \n在 `Layout()` 构造函数之前，创建一个 `Container` 对象来代表内容面板\n\n```\nContainer contentPane =\
  \ getContentPane();\n```\n\n![image](img/3b.jpg)\n\n使用 `GridLayout` 布局管理器创建第二个 `JPanel`\
  \ 对象，设置为 2 列\n\n```\nJPanel grid = new JPanel( 2 ) ;\n```\n\n![image](img/4b.jpg)\n\
  \n在 `Layout()` 构造方法中，插入语句将 `JButton` 组件添加到 `JPanel` 对象中\n\n```\npnl.add( “Yes” )\
  \ ;\npnl.add( “No” ) ;\npnl.add( “Cancel” ) ;\ngrid.add( “1” ) ;\ngrid.add( “2”\
  \ ) ;\ngrid.add( “3” ) ;\ngrid.add( “4” ) ;\n```\n\n![image](img/5b.jpg)\n\n现在，插入语句将面板和按钮添加到内容面板\n\
  \n```\ncontentPane.add( “North” , pnl ) ;\ncontentPane.add( “Center” , grid ) ;\n\
  contentPane.add( “West” , new JButton( “West” ) ) ;\n```\n\n![image](img/6b.jpg)\n\
  \n将程序保存为 `Layout.java`，然后编译并运行程序查看布局\n\n![image](img/pg147_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n虽然 `FlowLayout` 保持 `JButton` 的大小，但其他布局管理器会扩展组件以填充布局。\n\n### 修改外观\n\n`java.awt`\
  \ 包（抽象窗口工具包）包含了用于界面组件着色的“绘制”类。通过包含初始语句 `import java.awt.*;` 可以让这些类程序可用。\n\n![image](img/pg148_1.jpg)\n\
  \n`java.awt` 包中包含了 `Color` 类，它具有表示基本色的常量，例如 `Color.RED`。此外，可以使用 `new` 关键字创建 `Color`\
  \ 类的实例来表示自定义颜色。构造函数可以接受 0 到 255 之间的整数参数，表示红、绿、蓝（RGB）值以形成自定义颜色。\n\n每个组件都有 `setBackground()`\
  \ 方法和 `setForeground()` 方法，它们接受 `Color` 对象作为参数，用指定的颜色绘制该组件。\n\n注意，`JLabel` 组件的背景默认是透明的，因此在绘制它们之前，建议调用\
  \ `setOpaque()` 方法将不透明度设置为 `true`。\n\n`java.awt` 包中还有 `Font` 类，可用于修改显示文本的字体。`Font`\
  \ 对象表示字体，其构造函数可以接受三个参数来指定名称、样式和大小：\n\n• 指定的名称应该是三个平台无关名称之一——“Serif ”、“SansSerif\
  \ ”或“Monospaced”。\n\n• 指定的样式应该是以下三种之一\n\n\n\n\n### 常量\n常量：`Font.PLAIN`、`Font.BOLD`\
  \ 或 `Font.ITALIC`。\n\n•指定的尺寸应该是字号的整数。\n\n每个组件都有一个 `setFont()` 方法，该方法接受一个 `Font`\
  \ 对象作为参数，用指定的字体绘制该组件。\n\n![image](img/1b.jpg)\n从这里 复制一份 `Window.java`，将声明、构造函数和实例语句中的类名从“Window”更改为“Custom”\n\
  \n![image](img/common.jpg)\n\nCustom.java\n\n![image](img/2b.jpg)\n在程序的的最开头添加一条语句，导入\
  \ `java.awt` 包中所有类的功能\n\n```java\nimport java.awt.* ;\n```\n\n![image](img/3b.jpg)\n\
  在 `Custom()` 构造函数之前，创建三个 `JLabel` 对象\n\n```java\nJLabel lbl1 = new JLabel( “Custom\
  \ Background” ) ;\nJLabel lbl2 = new JLabel( “Custom Foreground” ) ;\nJLabel lbl3\
  \ = new JLabel( “Custom Font” ) ;\n```\n\n![image](img/4b.jpg)\n接下来，创建 `Color`、`Font`\
  \ 和 `Box` 布局对象\n\n```java\nColor customColor = new Color( 255 , 0 , 0 ) ;\nFont\
  \ customFont = new Font( “Serif” , Font.PLAIN , 64 ) ;\nBox box = Box.createVerticalBox()\
  \ ;\n```\n\n![image](img/5b.jpg)\n在 `Custom()` 构造方法中，插入语句使用 `Color` 常量为 `JLabel`\
  \ 背景上色\n\n```java\nlbl1.setOpaque( true ) ;\nlbl1.setBackground( Color.YELLOW )\n\
  ```\n\n![image](img/6b.jpg)\n插入语句使用 `Color` 对象为 `JLabel` 前景上色\n\n```java\nlbl2.setForeground(\
  \ customColor ) ;\n```\n\n![image](img/7b.jpg)\n插入语句使用自定义字体在 `JLabel` 上绘制文本\n\n\
  ```java\nlbl3.setFont( customFont ) ;\n```\n\n![image](img/8b.jpg)\n将每个标签添加到布局容器中\n\
  \n```java\nbox.add( lbl1 ) ; box.add( lbl2 ) ; box.add( lbl3 ) ;\n```\n\n![image](img/9b.jpg)\n\
  然后，将布局容器添加到 `JPanel` 容器中\n\n```java\npnl.add( box ) ;\n```\n\n![image](img/10b.jpg)\n\
  将程序保存为 `Custom.java`，然后编译并运行程序查看效果\n\n![image](img/pg149_jpg)\n\n![image](img/hot.jpg)\n\
  \n在这种情况下，自定义颜色相当于 `Color.RED`，没有绿色或蓝色。\n\n![image](img/hot.jpg)\n\n`Box` 对象是一个使用\
  \ `BoxLayout` 作为布局管理器的方便容器。`Box` 对象的 `createVerticalBox()` 方法单独显示组件。\n\n## 总结\n\
  • `javax.swing` 包包含了用于创建 GUI 组件的 Swing 类。\n• 创建顶级容器 `JFrame`。\n• `JFrame` 构造函数应该指定窗口的标题、大小、关闭操作和可见性。\n\
  • `JPanel` 容器使用其默认的 `FlowLayout` 布局管理器显示较小的组件。\n• `JButton` 构造函数可以指定显示在按钮组件上的文本和图像。\n\
  • `ImageIcon` 对象表示程序中使用的图像。\n• 要部署为单个 Java 存档 (JAR) 的程序应使用 `ClassLoader` 对象指定图像源。\n\
  • `JLabel` 对象显示非交互文本和内容。\n• 可编辑文本可以显示在 `JTextField` 和 `JTextArea` 字段中。\n• `JScrollPane`\
  \ 对象为 `JTextArea` 字段提供滚动条。\n• 选项、JComboBox、JList 项可以通过 `ButtonGroup` 对象逻辑上分组多个 `JRadioButton`\
  \ 组件，使其只能选择一个。\n• `java.awt` 包的 `Color` 类可以表示特定的颜色。\n• `java.awt` 包有一个 `Font` 类，可以创建表示字体名称、样式和大小的对象。\n\
  • 使用 `java.awt` 包的 `Container` 类可以将多个 `JPanel` 容器添加到 `JFrame`。\n当创建 `JPanel` 容器对象时，可以可选指定布局管理器。\n\
  \n### 识别事件\n*本章演示了如何创建响应用户界面操作的 Java 程序处理器。*\n\n- 监听事件\n- 生成事件\n- 处理按钮事件\n- 处理项目事件\n\
  - 响应键盘事件\n- 响应鼠标事件\n- 发布消息\n- 请求输入\n- 总结\n\n#### 监听事件\n用户可以通过鼠标、键盘或其他输入设备的操作来与提供图形界面\
  \ (GUI) 的程序交互。这些操作会导致界面中发生“事件”。\n\n![image](img/152.jpg)\n\n程序为了识别事件，需要添加来自 `java.awt.event`\
  \ 包的 `EventListener` 接口。通过添加初始语句 `import java.awt.event.* ;` 可以使这些接口可用。\n\n可以使用\
  \ `implements` 关键字在类声明中包含所需的 `EventListener` 接口。例如，一个监听点击的类声明可能如下：\n\n```java\n\
  class Click extends JFrame implements ActionListener { }\n```\n\nJava 文档描述了许多可以监听不同事件的\
  \ `EventListener` 接口，下表列出了最常用的接口并附带简要描述：\n\n| EventListener | 描述 |\n| :--- | :---\
  \ |\n| `ActionListener` | 识别按钮按下或释放时发生的动作事件 |\n| `ItemListener` | 识别列表项被选中或取消勾选时发生的项目事件\
  \ |\n| `KeyListener` | 识别用户按下或释放按键时发生的键盘事件 |\n| `MouseListener` | 识别用户按下或释放鼠标按钮时，以及鼠标进入或离开组件时发生的鼠标按钮操作\
  \ |\n| `MouseMotionListener` | 识别用户移动鼠标时发生的运动事件 |\n\n![image](img/hot.jpg)\n\n多个\
  \ `EventListener` 可以作为逗号分隔的列表包含在 `implements` 关键字之后。\n\n#### 生成事件\n如果组件要有用，它们就需要生成\
  \ `EventListener` 接口可以识别的事件。在如所示向程序添加了适当的 `EventListener` 后，必须向组件添加一个事件生成器。\n\n\
  ![image](img/153.jpg)\n\n例如，为了让程序响应按钮点击，需要在程序中添加 `ActionListener` 接口，并调用按钮的 `addActionListener()`\
  \ 方法，将 `this` 关键字作为参数。这使得按钮在被点击时生成事件，该事件可以被 `ActionListener` 接口识别。\n\n创建生成事件按钮语句所示：\n\
  \n```java\nJButton btn = new JButton( “Click Me” ) ;\nbtn.addActionListener( this\
  \ ) ;\n```\n\n当用户点击生成事件的按钮时，`ActionListener` 接口识别事件并在程序内寻找事件处理器执行响应。\n\n每个 `EventListener`\
  \ 接口都有一个关联的事件处理器，该方法在识别到事件时被调用。例如，当按钮被点击时，`ActionListener` 接口会调用名为 `actionPerformed()`\
  \ 的关联方法，并传递一个 `ActionEvent` 对象作为其参数。\n\n\n\n\n一个 `ActionEvent` 对象包含了有关事件本身以及其源自组件的信息。最有用的是，它有一个\
  \ `getSource()` 方法，可以识别生成事件的物体。这可以用于为该组件创建适当响应。\n\n为特定按钮点击创建响应的事件处理方法可能如下：\n\n```\n\
  public void actionPerformed( ActionEvent event )\n{\n    if ( event.getSource()\
  \ == btn )\n    {\n        // 为此按钮点击事件要执行的语句\n    }\n}\n```\n\n### 处理按钮事件\n\nSwing\
  \ `JButton` 组件如果被设置为在点击时生成 `ActionEvent` 事件，则可以通过 `ActionListener` 接口进行识别，该接口会将事件传递给它的\
  \ `actionPerformed()` 事件处理方法。`ActionEvent` 对象有一个 `getSource()` 方法来识别源自组件，以及一个返回\
  \ `String` 类型的 `getActionCommand()` 方法。这将会是按钮组件的文本标签，或者是文本字段组件的内容。\n\n![image](img/pg154_1.jpg)\n\
  \n对按钮的一种响应可能是通过调用其 `setEnabled()` 方法并传入 `false` 参数来禁用组件。相反，通过向其 `setEnabled()` 方法指定\
  \ `true` 参数可以再次启用该组件。\n\n![image](img/1r.jpg)从此处编辑一份 `Window.java` 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“Actions”\n\
  \n![image](img/common.jpg)\n\nActions.java\n\n![image](img/2r.jpg)在程序的最开始处添加语句，导入\
  \ `java.awt.event` 包中所有类的功能\n\n```\nimport java.awt.event.* ;\n```\n\n![image](img/3r.jpg)修改类声明，为程序添加\
  \ `ActionListener` 接口\n\n```\nclass Actions extends JFrame implements ActionListener\n\
  ```\n\n![image](img/4r.jpg)在 `Actions()` 构造函数之前，创建两个 `JButton` 推射按钮和一个 `JTextArea`\
  \ 文本字段\n\n```\nJButton btn1 = new JButton( “Button 1” ) ;\nJButton btn2 = new JButton(\
  \ “Button 2” ) ;\nJTextArea txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](img/5r.jpg)将按钮和文本区域添加到\
  \ `JPanel` 容器中\n\n```\npnl.add( btn1 ) ;\npnl.add( btn2 ) ;\npnl.add( txtArea )\
  \ ;\n```\n\n![image](img/6r.jpg)插入设置两个组件初始状态的语句\n\n```\nbtn2.setEnabled( false )\
  \ ;\ntxtArea.setText( “Button 2 is Disabled” ) ;\n```\n\n![image](img/7r.jpg)在 `Actions()`\
  \ 构造函数中插入语句，使每个按钮点击时生成 `ActionEvent` 事件\n\n```\nbtn1.addActionListener( this ) ;\n\
  btn2.addActionListener( this ) ;\n```\n\n![image](img/8r.jpg)在构造方法之后，为 `ActionListener`\
  \ 接口添加事件处理方法——用于显示标识哪个按钮被点击的文本\n\n```\npublic void actionPerformed( ActionEvent\
  \ event )\n{\n    txtArea.setText( event.getActionCommand() + “ Clicked and Disabled”\
  \ ) ;\n}\n```\n\n![image](img/9r.jpg)在事件处理方法中插入 `if` 语句——对每个按钮点击执行特定的响应\n\n```\n\
  if ( event.getSource() == btn1 )\n{ btn2.setEnabled( true ) ; btn1.setEnabled( false\
  \ ) ; }\nif ( event.getSource() == btn2 )\n{ btn1.setEnabled( true ) ; btn2.setEnabled(\
  \ false ) ; }\n```\n\n![image](img/10r.jpg)将程序保存为 `Actions.java`，然后编译并运行程序，点击推送按钮\n\
  \n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\n![image](img/pg155_3.jpg)\n\
  \n![image](img/forget.jpg)\n\n组件在构造函数之前声明，因此它们对于事件处理方法是全局可用的。\n\n![image](img/hot.jpg)\n\
  \n在用户执行所需操作之前禁用组件，有时是有用的。\n\n### 处理项目事件\n\nSwing `JRadioButton`、`JCheckBox` 和 `JComboBox`\
  \ 组件维护状态，其状态的变化可以通过 `ItemListener` 接口进行识别，该接口会将 `ItemEvent` 传递给它的 `itemStateChanged()`\
  \ 事件处理方法。`ItemEvent` 对象有一个 `getItemSelectable()` 方法来识别源自组件，以及一个返回其状态的 `getStateChange()`\
  \ 方法。这将决定变化是选中还是取消选中项目，并可以与 `ItemEvent.SELECTED` 常量进行比较。\n\n![image](img/pg156_1.jpg)\n\
