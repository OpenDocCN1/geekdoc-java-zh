  \n![image](img/pg49_1.jpg)\n\n![image](img/hot.jpg)\n\n注意这三个整数变量在这里是如何使用方便的简写方式内联声明并初始化的。\n\
  \n![image](img/forget.jpg)\n\n条件运算符在第 5 步发挥了很好的作用。你可以返回这里回顾它是如何工作的。\n\n## 循环 (Looping\
  \ for)\n\n循环是一个代码块，它重复执行包含的语句，直到满足某个测试条件——随后循环结束，程序继续执行下一个任务。\n\n![image](img/arrowg.jpg)\n\
  \nJava 编程中最频繁使用的循环结构采用 `for` 关键字，其语法如下：\n\n```java\nfor ( initializer ; test-expression\
  \ ; updater )\n{\n    statements-to-be-executed-on-each-iteration ;\n}\n```\n\n\
  `for` 关键字后的括号必须包含三个建立循环性能的控制部分：\n\n- **初始化器 (Initializer)** – 为计数器变量分配一个初始值，该变量将记录此循环执行的次数。为此目的的变量可以在此处声明，传统上通常是一个名为\
  \ `i` 的“简单”整数变量。\n- **测试表达式 (Test expression)** – 在循环的每次迭代开始时评估其是否为布尔 `true` 值。当评估结果为\
  \ `true` 时，继续迭代；当返回 `false` 时，循环立即终止，而不完成该迭代。\n- **更新器 (Updater)** – 更改由初始化器的计数器变量的当前值，记录此循环执行的总次数。通常，这会使用\
  \ `i++` 递增，或使用 `i--` 递减。\n\n循环每次迭代时执行的代码可以是单条语句、语句块，甚至是另一个“嵌套”循环。\n\n每个循环都必须在某点让测试表达式返回\
  \ `false`——否则将创建一个无限循环，它将无情地一直执行其语句。通常，测试表达式会评估计数器变量的当前值以执行指定次数的迭代。例如，使用测试表达式 `i\
  \ < 10` 的循环在结束前将执行 10 次。\n\n更新器通常被称为“递增器 (incrementer)”，因为它通常是递增而非递减计数器变量。\n\n![image](img/1g.jpg)创建一个名为“Switch”的新程序，其中包含标准的\
  \ main 方法\n\n```java\nclass Switch\n{\n    public static void main ( String[] args\
  \ ) { }\n}\n```\n\n![image](img/j1.jpg)\n\nFor.java\n\n![image](img/2g.jpg)在 main\
  \ 方法内部声明并初始化一个整数变量\n\n```java\nint num = 0;\n```\n\n![image](img/3g.jpg)添加一个 `for`\
  \ 循环执行三次迭代并显示 `i` 的当前值\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    System.out.println(\
  \ “Outer Loop=” + i );\n}\n```\n\n![image](img/4g.jpg)在 `for` 块内部插入一个嵌套的 `for` 循环同样执行三次迭代，显示\
  \ `j` 的当前值\n\n```java\nfor ( int j = 1 ; j < 4 ; j++ )\n{\n    System.out.print(\
  \ “\\tInner Loop=” + j );\n    System.out.println( “\\t\\tTotal=” (++num) );\n}\n\
  ```\n\n![image](img/5g.jpg)将程序保存为 `For.java`，然后编译并运行程序查看输出\n\n![image](img/pg51_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n递增 `++` 和递减 `--` 运算符可以作为变量的前缀以立即更改值，也可以作为后缀——在引用时才更改值。尝试将此示例中的递增运算符改为\
  \ `++i` 和 `++j` 以查看差异。\n\n## While 真循环 (Looping while true)\n\n`for` 循环的另一种结构（见此处\n\
  {\n    statements-to-be-executed-on-each-iteration ;\n}\n```\n\n![image](img/arrowg.jpg)\n\
  \n与 `for` 循环一样，`while` 循环重复执行包含的语句，直到满足测试条件——随后循环结束，程序继续执行下一个任务。\n\n与 `for` 循环不同，`while`\
  \ 关键字后的括号不包含迭代计数器的初始化器或更新器。这意味着测试表达式必须评估一个在循环进行过程中通过语句发生变化的值——否则将创建一个无限循环，它将无情地一直执行其语句。\n\
  \n测试表达式在循环的每次迭代开始时评估其是否为布尔 `true` 值。当评估结果为 `true` 时，继续迭代；当返回 `false` 时，循环立即终止，而不完成该迭代。\n\
  \n注意，如果测试表达式在第一次评估时返回 `false`，则循环语句将永远不会执行。\n\n\n\n\n\n一个 `while` 循环可以构造成类似于 `for`\
  \ 循环的结构，通过在测试表达式中评估计数器变量，实现方法是在循环外部创建一个计数器变量，并在每次迭代执行的语句改变它的值。例如，上一个示例中的外部 `for`\
  \ 循环可以重构为 `while` 循环，如下：\n\n```java\nint i = 1 ;\nwhile ( i < 4 )\n{\n    System.out.println(\
  \ “Outer Loop i=” +i ) ;\n    i++;\n}\n```\n\n这会将计数器初始化放置在 `while` 循环结构外部，并将更新器放在语句块内部。\n\
  \n![image](img/snake.jpg)\n\n无限循环会由于持续执行迭代而锁定程序——在 Windows 上，按下 `Ctrl + C` 停止。\n\
  \n![image](img/1g.jpg)创建一个名为“While”的新程序，其中包含标准的 `main` 方法\n\n```java\nclass While\n\
  {\n    public static void main ( String[] args ) {      }\n}\n```\n\n![image](img/j1.jpg)\n\
  \nWhile.java\n\n![image](img/2g.jpg)在 `main` 方法内部声明并初始化一个名为 `num` 的整数变量\n\n```java\n\
  int num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个 `while` 循环，当 `num` 变量大于零时显示其当前值\n\
  \n```java\nwhile ( num > 0 )\n{\n    System.out.println( “While Countdown: ” + num\
  \ ) ;\n}\n```\n\n![image](img/4g.jpg)在 `while` 循环块的末尾插入一个更新器，每次迭代将 `num` 变量的值减少\
  \ 10——从而避免无限循环\n\n```java\nnum -= 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为 `While.java`，然后编译并运行程序查看输出\n\
  \n![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\n该更新器中的赋值操作是 `num = ( num\
  \ - 10 )` 的简写。\n\n## 执行 do-while 循环\n\n`while` 循环结构的一种变体（见此处）使用 `do` 关键字创建一个具有如下语法的循环：\n\
  \n```java\ndo\n{\n    statements-to-be-executed-on-each-iteration ;\n}\nwhile (\
  \ test-expression ) ;\n```\n\n![image](img/arrowg.jpg)\n\n与 `for` 循环和 `while` 循环一样，`do\
  \ while` 循环重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下一个任务。\n\n与 `for` 循环和 `while` 循环不同，`do\
  \ while` 的测试表达式出现在包含执行语句的块之后。测试表达式在循环的每次迭代结束时被评估是否为布尔值 `true`。当评估返回 `true` 时，继续下一次迭代；但当返回\
  \ `false` 时，循环立即终止。这意味着 `do while` 循环中的语句至少会被执行一次。\n\n请注意，如果测试表达式在第一次评估时返回 `false`，循环语句已经执行过一次。\n\
  \n`do while` 循环也可以构造成类似于 `for` 循环的结构，通过在测试表达式中评估计数器变量，实现方法是将计数器初始化放在循环结构外部，并将更新器放在语句块内部——就像\
  \ `while` 循环一样。\n\n所有仅包含一条待执行语句的 `for`、`while` 或 `do while` 循环结构都可以选择性省略语句周围的大括号。但如果省略了，以后向循环中添加额外语句时，你需要添加大括号。\n\
  \n选择 `for`、`while` 还是 `do while` 循环很大程度上取决于个人的编码偏好和目的。`for` 循环结构方便地将计数器初始化、测试表达式和更新器放置在\
  \ `for` 关键字后的括号中。`while` 循环结构可以更简洁——但你必须在循环语句中包含一个更新器以避免无限循环。`do while` 循环仅仅增加了一个优点，即在评估测试表达式之前执行一次其语句——正如右侧描述的\
  \ `do while` 循环所示。\n\n![image](img/hot.jpg)\n\n始终将循环要执行的语句包含在大括号内——以保持代码的清晰度并提高代码的可维护性。\n\
  \n![image](img/1g.jpg)创建一个名为“DoWhile”的新程序，其中包含标准的 `main` 方法\n\n```java\nclass DoWhile\n\
  {\n    public static void main ( String[] args ) {      }\n}\n```\n\n![image](img/j1.jpg)\n\
  \nDoWhile.java\n\n![image](img/2g.jpg)在 `main` 方法内部声明并初始化一个名为 `num` 的整数变量\n\n```java\n\
  int num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个 `do while` 循环，当 `num` 变量小于 10 时显示其当前值\n\
  \n```java\ndo\n{\n    System.out.println( “DoWhile Countup: ” + num )\n}\nwhile\
  \ ( num < 10 ) ;\n```\n\n![image](img/4g.jpg)在 `while` 循环块的末尾插入一个更新器，每次迭代将 `num`\
  \ 变量的值减少 10——从而避免无限循环\n\n```java\nnum -= 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为\
  \ `While.java`，然后编译并运行程序查看输出\n\n## 跳出循环\n\n`break` 关键字用于满足特定条件时提前终止循环。`break` 语句位于循环块内部，并跟在一个测试表达式。例如，在嵌套循环中，它会进入下一个任务。\n\
  \n![image](img/pg55.jpg)\n\n![image](img/1g.jpg)创建一个名为“Break”的程序，包含标准的 `main` 方法\n\
  \n```java\nclass Break\n{\n    public static void main ( String[] args ) {     \
  \ }\n}\n```\n\n![image](img/j1.jpg)\n\nBreak.java\n\n![image](img/2g.jpg)在 `main`\
  \ 方法内部创建两个嵌套的 `for` 循环，在每次迭代中显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i < 4 ; i++\
  \ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
  \ “Running i=”+i+“ j=”+j )\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Break.java`，然后编译并运行程序查看输出\n\
  \n![image](img/pg56_1.jpg)\n\n该程序对外部循环进行了三次迭代，每次迭代都执行内部循环。可以添加 `break` 语句来停止内部循环的第二次执行。\n\
  \n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++\
  \ )\n    {\n        if ( i == 2 && j == 1 )\n        {\n            System.out.println(\
  \ “Breaks innerLoop when i=”+i+“ j=”+j )\n            break ;\n        }\n    }\n\
  }\n```\n\n`continue` 关键字用于满足特定条件时跳过循环的单次迭代。`continue` 语句位于语句块内部，并跟在一个测试表达式。当测试返回\
  \ `true` 时，该迭代结束。\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int\
  \ j = 1 ; j < 4 ; j++ )\n    {\n        if ( i == 1 && j == 1 )\n        {\n   \
  \         System.out.println( “Continues innerLoop when i=”+i+“ j=”+j )\n      \
  \      continue;\n        }\n    }\n}\n```\n\n\n\n\n\n`break` 和 `continue` 关键字的默认行为可以更改，通过指明标签名称来显式指定控制流返回到带标签的外层循环。这允许循环执行迭代，直到满足指定的条件或被中断。\n\
  \n![image](img/pg58_2.jpg)\n\n标记循环的语法需要一个标签名称，后跟一个冒号 `:`，放在循环结构开始之前。\n\n![image](img/1g.jpg)启动一个名为“Label”的新程序，其中包含标准的\
  \ main 方法\n\n```java\nclass Label\n{\n    public static void main ( String[] args\
  \ ) { }\n}\n```\n\n![image](img/j1.jpg)\n\nLabel.java\n\n![image](img/2g.jpg)在 main\
  \ 方法内部，创建两个嵌套的 `for` 循环，在三次迭代中的每次中显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i < 4\
  \ ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
  \ “Running i=”+i+ “ j=”+j ) ;\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Label.java`，然后编译并运行程序以查看输出\n\
  \n![image](img/pg58_1.jpg)\n\n![image](img/4g.jpg)修改外层循环的开头，将其标记为“outerLoop”\n\n\
  ```java\nouterLoop : for ( int i = 1 ; i < 4 ; i++ )\n```\n\n要显式指定程序应在外层循环中继续，在\
  \ `continue` 关键字之后写上该循环的标签名称。\n\n![image](img/5g.jpg)将此 `continue` 语句添加到内层循环语句的开头，以便进入外层循环的下一次迭代——然后重新编译并运行程序\n\
  \n```java\nif ( i == 1 && j == 1 )\n{\n    System.out.println( “Continues outerLoop\
  \ when i=” +i+ “ j=” +j ) ;\n    continue outerLoop ;\n}\n```\n\n![image](img/pg59_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n在这里，`continue` 语句停止了内层循环首次运行的所有三次迭代——通过将控制权返回外层循环。\n\
  \n要显式指定程序应从外层循环退出，在 `break` 关键字之后写上该循环的标签名称。\n\n![image](img/6g.jpg)将此 `break` 语句添加到内层循环语句的开头，以便退出外层循环——然后重新编译并运行程序\n\
  \n```java\nif ( i == 2 && j == 3 )\n{\n    System.out.println( “Breaks outerLoop\
  \ when i=” +i+ “ j=” +j ) ;\n    break outerLoop ;\n}\n```\n\n![image](img/pg59_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n在这里，`break` 语句停止了整个循环结构的所有后续迭代——通过退出外层循环。\n\n## 总结\n\
  \n- `if` 关键字执行条件测试，以评估表达式的布尔值为 `true` 或 `false`。\n- `if` 语句块可以包含一个或多个语句，这些语句仅在测试表达式返回\
  \ `true` 时执行。\n- `else` 关键字指定了当 `if` 关键字执行的测试返回 `false` 时执行的备选语句。\n- 组合 `if else`\
  \ 语句允许程序通过条件分支的过程继续运行。\n- `switch` 语句通常可以通过提供 `case` 选项为难以管理的 `if else` 语句提供一种优雅的解决方案。\n\
  - 每个 `case` 选项都可以由 `break` 关键字终止，这样只有与该选项相关的语句会被执行。\n- `default` 关键字可以指定在所有 `case`\
  \ 选项都返回 `false` 时执行的语句。\n- 循环重复执行其包含的语句，直到测试表达式返回 `false` 为止。\n- `for` 关键字后面的括号指定了循环的计数器初始化器、测试表达式和计数器更新器。\n\
  - `while` 循环和 `do while` 循环中的语句必须更改其测试表达式中使用的值，以避免死循环。\n- 测试表达式在 `for` 循环和 `while`\
  \ 循环的开始处评估——在循环第一次迭代之前。\n- 测试表达式在 `do while` 循环的结束处评估——在循环第一次迭代之后。\n- 使用 `continue`\
  \ 关键字可以跳过循环迭代。\n- 使用 `break` 关键字可以终止循环。\n- 嵌套的内层循环可以使用标签配合 `break` 和 `continue`\
  \ 关键字来引用外层循环。\n\n## 4 值的引导\n\n*本章演示了如何使用各种 Java 编程结构来引导数据值。*\n\n- 类型值转换\n- 创建变量数组\n\
  - 传递参数\n- 传递多个参数\n- 遍历元素\n- 更改元素值\n- 添加数组维度\n- 捕获异常\n- 总结\n\n### 类型值转换\n\n在 Java\
  \ 中处理值需要一个类型以便进行处理。\n\n![image](img/pg62_1.jpg)数值值可以以以下语法轻松转换为另一种数据类型：\n\n```java\n\
  (type)value\n```\n\n将 `float` 转换为 `int` 时会发生某些精度损失。\n\n![image](img/common.jpg)例如，将\
  \ 9.9 的 `float` 转换为 `int` 会截断小数部分。\n\n数值可以使用该类型的 `toString()` 方法转换为 `String`：\n\n\
  ```java\nInteger.toString(num)\n```\n\n同样，将 `float num` 转换为 `String`：\n\n```java\n\
  Float.toString(num)\n```\n\n在实践中这并不总是需要的，因为如果变量是 `String`，Java 会自动转换。\n\n## 总结\n\
  \n更多时候，你会希望将 `String` 值转换为数值类型以便程序对其进行运算。`String` 值可以使用 `Integer.parseInt()` 方法转换为\
  \ `int` 值。该方法接收 `String` 值作为参数：\n\n```java\nInteger.parseInt(msg)\n```\n\n同样，使用\
  \ `Float.parseFloat()` 将 `String` 转换为 `float`：\n\n```java\nFloat.parseFloat(msg)\n\
  ```\n\n当将 `String` 值转换为数值类型时，该 `String` 只能包含有效的数值，否则编译器将报告错误。所有数值类都有一个 `parse...`\
  \ 方法和一个 `toString` 方法，允许在 `String` 值和数值类型之间进行转换。\n\n![image](img/1p.jpg)启动一个名为“Convert”的新程序，其中包含标准的\
  \ main 方法\n\n```java\nclass Convert\n{\n    public static void main ( String[] args\
