  \ ) ) + 1 ;\n    int t= nums[ i ] ; nums[ i ]= nums[ r ] ; nums[ r ]= t ;\n}\nfor\
  \ ( int i = 1 ; i < 7 ; i++ ) {\n    str += “ ” + Integer.toString( nums[ i ] )\
  \ + “ ” ;\n}\ntxt.setText( str ) ;\n```\n\n![image](img/forget.jpg)\n\n在这种情况下，代码不需要检查调用源，因为事件处理器是通过\
  \ `activity_main.xml` 中的 `android:onClick` 属性显式分配给按钮的。\n\n现在 Lotto 应用已拥有所有的资源、控件和功能代码，可以尝试进行构建：\n\
