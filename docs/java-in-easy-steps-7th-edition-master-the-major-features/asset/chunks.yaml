  trans: "\n\n![image](img/4b.jpg)\n将文件保存到任何方便的位置，但请务必精确命名为 `Hello.java` – 现在完整的程序看起来应该是这样的：\n\
    \n![image](img/pg12_2.jpg)\n\n![image](img/snake.jpg)\n\nJava 是一种大小敏感的语言，“Hello”和“hello”是完全不同的\
    \ –传统上，Java 程序名应该始终以大写字母开头。\n\n![image](img/forget.jpg)\n\nJava 程序始终以其完全的程序名加上\
    \ `.java` 扩展名保存。\n\n可以单独检查程序代码的这里的各个部分，以更清晰地理解每个部分：\n\n### 程序的容器\n\n```java\n\
    class Hello { }\n```\n\n程序名跟在 `class` 关键字之后，后面紧跟着一对大括号。定义 `Hello` 类的所有程序代码都包含在这些大括号内。\n\
    \n### main 方法\n\n```java\npublic static void main ( String[] args ) { }\n```\n\
    \n这行看起来很吓畏的代码是用于定义几乎所有 Java 程序起点的标准代码。它将会在书中大多数示例中以与上面完全的形式出现 – 所以记住它可能会很有用。\n\
    \n该代码声明了一个名为“main”的方法，该方法在其大括号内包含实际的程序指令。\n\n关键字 `public static void` 位于方法名之前，用于定义如何使用该方法，将在稍后进行详细解释。\n\
    \n代码 `( String[] args )` 在向方法传递值时非常有用，在书中稍后也会进行详细解释。\n\n![image](img/forget.jpg)\n\
    \n所有独立的 Java 程序都必须有一个 main 方法。\n\n### 语句\n\n```java\nSystem.out.println( “Hello\
    \ World!” ) ;\n```\n\n语句是执行程序任务的实际指令，并且必须以分号结尾。一个方法可以在大括号内包含许多语句以形成一个“语句块”，定义要执行的一系列任务，但在这里，单个语句指示程序输出一行文本。\n\
    \n转到这里 发现如何编译和运行此程序。\n\n![image](img/hot.jpg)\n\n创建一个“MyJava”目录，用于保存所有的 Java 程序文件。\n\
    \n### 编译与运行程序\n\n在 Java 程序运行之前，它必须首先由 Java 编译器编译成 `class` 文件。它位于 Java 的 `bin`\
    \ 子目录下，是一个名为 `javac` 的应用程序。在安装期间，`bin` 子目录已添加到系统路径，因此 `javac` 可以从任何系统位置调用。\n\n\
    按照以下步骤编译程序这里：\n\n![image](img/1b.jpg)\n打开命令行窗口，然后导航到你保存 `Hello.java` 源码文件的目录\n\
    \n![image](img/2b.jpg)\n输入 `javac` 后跟一个空格，然后是源码文件的全名 `Hello.java` 并按 `Enter` \n\
    \n![image](img/pg14_1.jpg)\n\n![image](img/hot.jpg)\n\n在 Windows 上使用命令提示符应用或 Windows\
    \ PowerShell 应用提供命令行提示符，在 Linux 上使用 Terminal 窗口。\n\n![image](img/hot.jpg)\n\n\
    在提示符处输入 `javac` 并按回车显示 Java 编译器选项。\n\n如果 `javac` 编译器发现代码中有错误，它将停止并显示一个有助于问题的报告，指示错误的性质\
    \ – 排除故障请参阅这里。\n\n如果 `javac` 编译器没有发现任何错误，它将创建一个以程序名和 `.class` 文件扩展名命名的新文件。\n\n\
    ![image](img/pg14_2.jpg)\n\n![image](img/hot.jpg)\n\n向 `javac` 编译器指定文件的完整路径地址，也可以从另一个位置编译源码\
    \ – 在这种情况下为 `C:\\MyJava\\Hello.java`\n\n当 Java 编译器完成编译时，命令行提示符窗口的焦点返回提示提示符，没有任何确认消息\
    \ – 程序已准备好运行。\n\n![image](img/pg15_3.jpg)\n\nJava 程序解释器是一个名为 `java` 的应用程序，位于 Java\
    \ 的 `bin` 子目录下 – 与 `javac` 编译器在一起。由于该目录在安装期间已添加到系统路径，`java` 解释器可以从任何位置调用。\n\n\
    按照这里描述的步骤运行已编译的程序：\n\n![image](img/1b.jpg)\n打开命令行提示符窗口，然后导航到 `Hello.class` 程序文件所在的目录\n\
    \n![image](img/2b.jpg)\n在提示符处，输入 `java` 后跟一个空格，然后是程序名 `Hello` 并按回车\n\n![image](img/pg15_1.jpg)\n\
    \n![image](img/snake.jpg)\n\n运行程序时不包含 .class 扩展名 – 只使用程序名。\n\n`Hello` 程序运行并执行其\
    \ main 方法内语句中定义的任务 – 输出“Hello World!”。完成后，焦点再次返回到提示符。\n\n编译和运行 Java 程序的过程通常组合为顺序步骤，并且无论在什么平台上都是相同的。下面的截图展示了在\
    \ Linux 上编译和运行 `Hello` 程序的过程：\n\n![image](img/pg15_2.jpg)\n\n### 创建变量\n\n在 Java\
    \ 编程中，“变量”简单来说是一个存储值的容器，供后续使用。值可能会随着程序的执行而改变（变化）– 因此被称为“变量”。\n\n![image](img/pg16_1.jpg)\n\
    \n通过在程序中编写声明来创建变量，指定数据类型以及变量名称。例如，可以使用 `String` 类型来允许名为“message”的变量包含文本：\n\n```java\n\
    String message ;\n```\n\n变量名由程序员选择，但必须遵循某些命名规范。变量名只能以字母、美元符号 `$` 或下划线字符 `_` 开头，随后可以是字母、数字、美元符号或下划线。名称对大小敏感，因此“var”和“Var”是不同的名称，名称中不允许空格。\n\
    \n变量名还应避免下表列出的 Java 关键字，因为这些词在语言中有特殊含义。\n\n| | | | | |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| `abstract` | `default` | `goto` | `package` | `synchronized`\
    \ |\n| `assert` | `do` | `if` | `private` | `this` |\n| `boolean` | `double` |\
    \ `implements` | `protected` | `throw` |\n| `break` | `else` | `import` | `public`\
    \ | `throws` |\n| `byte` | `enum` | `instanceof` | `return` | `transient` |\n\
    | `case` | `extends` | `int` | `static` | `try` |\n| `catch` | `false` | `long`\
    \ | `strictfp` | `void` |\n| `char` | `final` | `native` | `String` | `volatile`\
    \ |\n| `class` | `finally` | `new` | `super` | `while` |\n| `continue` | `for`\
    \ | `null` | `switch` | |\n\n![image](img/snake.jpg)\n\n每个变量声明都必须以分号字符结尾 正 与所有其他语句一样。\n\
    \n![image](img/hot.jpg)\n\n严格来说，表中的某些词并不是真正的关键字 – `true`、`false` 和 `null` 都是字面量；`String`\
    \ 是一个特殊的类名；`const` 和 `goto` 是保留字（目前未未使用）。将它们包含在表中是因为在命名变量时也必须避免这些词。\n\n"
- fmt: "\nAs good practice, variables should be named with words or easily recognizable\
    \ abbreviations, describing that variable’s purpose. For example, `button1` or\
    \ `btn1` to describe button number one. Lowercase letters are preferred for single-word\
    \ names, such as `gear`, and names that consist of multiple words should capitalize\
    \ the first letter of each subsequent word, such as `gearRatio` – the so-called\
    \ `camelCase` naming convention.\n\nOnce a variable has been declared, it may\
    \ be assigned an initial value of the appropriate data type using the equals sign\
    \ `=`, either in the declaration or later on in the program, then its value can\
    \ be referenced at any time using the variable’s name.\n\nFollow these steps to\
    \ create a program that declares a variable, which gets initialized in its declaration\
    \ then changed later:\n\n![image](images/1b.jpg)Start a new program named “FirstVariable”,\
    \ containing the standard main method\n\n```java\nclass FirstVariable\n{\n   \
    \ public static void main ( String[] args ) {             \n    }\n}\n```\n\n\
    ![image](images/common.jpg)\n\nFirstVariable.java\n\n![image](images/2b.jpg)Between\
    \ the curly brackets of the main method, insert this code to create, initialize,\
    \ and output a variable\n\n```java\nString message = “Initial value” ;\nSystem.out.println(\
    \ message ) ;\n```\n\n![image](images/3b.jpg)Add these lines to modify and output\
    \ the variable value\n\n```java\nmessage = “Modified value” ;\nSystem.out.println(\
    \ message ) ;\n```\n\n![image](images/4b.jpg)Save the program as `FirstVariable.java`,\
    \ then compile and run the program\n\n![image](images/pg17_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nIf you encounter problems compiling or running the program, you can get help\
    \ with troubleshooting problems [here](#chapter01.html_sec9).\n\n## Recognizing\
    \ data types\n\nThe most frequently-used data types in Java variable declarations\
    \ are listed in this table, along with a brief description:\n\n![image](images/pg18_1.jpg)\n\
    \n| Data type: | Description: | Example: |\n| :--- | :--- | :--- |\n| `char` |\
    \ A single Unicode character | ‘a’ |\n| `String` | Any number of Unicode characters\
    \ | “my String” |\n| `int` | An integer number, from -2.14 billion to +2.14 billion\
    \ | 1000 |\n| `float` | A floating-point number, with a decimal point | 3.14159265f\
    \ |\n| `boolean` | A logical value of either true or false | true |\n\n![image](images/snake.jpg)\n\
    \nDue to the irregularities of floating-point arithmetic, the `float` data type\
    \ should never be used for precise values such as currency – see [here](#chapter07.html_sec63)\
    \ for details.\n\nNotice that `char` data values must always be surrounded by\
    \ single quotes, and `String` data values must always be surrounded by double\
    \ quotes. Also, remember that `float` data values must always have an “f” suffix\
    \ to ensure they are treated as a `float` value.\n\nIn addition to the more common\
    \ data types above, Java provides these specialized data types for use in exacting\
    \ circumstances:\n\n| Data type: | Description: |\n| :--- | :--- |\n| `byte` |\
    \ Integer number from -128 to +127 |\n| `short` | Integer number from -32,768\
    \ to +32,767 |\n| `long` | Positive or negative integer exceeding 2.14 billion\
    \ |\n| `double` | Extremely long floating-point number |\n\n![image](images/forget.jpg)\n\
    \nAll data type keywords begin with a lowercase letter except `String` – which\
    \ is a special class.\n\nSpecialized data types are useful in advanced Java programs\
    \ – the examples in this book mostly use the common data types described in the\
    \ top table.\n\nFollow these steps to create a Java program that creates, initializes,\
    \ and outputs variables of all five common data types:\n\n![image](images/1b.jpg)Start\
    \ a new program named “DataTypes” containing the standard main method\n\n```java\n\
    class DataTypes\n{\n    public static void main ( String[] args ) {     \n   \
    \ }\n}\n```\n\n![image](images/common.jpg)\n\nDataTypes.java\n\n![image](images/2b.jpg)Between\
    \ the curly brackets of the main method, insert these declarations to create and\
    \ initialize five variables\n\n```java\nchar letter = ‘M’ ;\nString title = “Java\
    \ in easy steps” ;\nint number = 365 ;\nfloat decimal = 98.6f ;\nboolean result\
    \ = true ;\n```\n\n![image](images/3b.jpg)Add these lines to output an appropriate\
    \ text `String` concatenated to the value of each variable\n\n```java\nSystem.out.println(\
    \ “Initial is ” + letter ) ;\nSystem.out.println( “Book is ” + title ) ;\nSystem.out.println(\
    \ “Days are ” + number ) ;\nSystem.out.println( “Temperature is ” + decimal )\
    \ ;\nSystem.out.println( “Answer is ” + result ) ;\n```\n\n![image](images/4b.jpg)Save\
    \ the program as `DataTypes.java`, then compile and run the program\n\n![image](images/pg19_1.jpg)\n\
    \n![image](images/5b.jpg)\n\n`System.out.println( “Initial is ” + letter ) ;`\n\
    \n![image](images/hot.jpg)\n\n`+` is used here to concatenate string values.\n\
    \n## Creating constants\n\nThe `final` keyword is a modifier that can be used\
    \ when declaring variables to prevent any changes.\n\n![image](images/pg20_1.jpg)Variables\
    \ created with fixed values in this way are known as “constants”.\n\nFollow these\
    \ steps to create a Java program featuring constants:\n\n![image](images/1b.jpg)Start\
    \ a new program named “Constants”, containing the standard main method\n\n```java\n\
    class Constants\n{\n    public static void main ( String[] args ) {          \
    \   \n    }\n}\n```\n\n![image](images/common.jpg)\n\nConstants.java\n\n![image](images/2b.jpg)Between\
    \ the curly brackets of the main method, insert this code to create and initialize\
