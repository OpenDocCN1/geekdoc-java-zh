    \ 和 `Math.E` 常量。\n- `Math.pow()` 将数字提升到指定的幂，`Math.sqrt()` 返回指定数字的平方根。\n- 可以 `Math.round()`、`Math.floor()`\
    \ 和 `Math.ceil()` 将数字舍入为整数值。\n- 可以使用 `Math.max()` 和 `Math.min()` 对数字进行比较。\n- `Math.random()`\
    \ 返回 0.0 到 0.999999999999999 之间的 `double` 精度随机数。\n- `String` 是包含在引号内的零或多个字符。\n\
    - `length()` 方法返回其 `String` 的大小，类似于数组的 `length` 属性。\n- `String` 的 `concat()` 方法附加另一个\
    \ `String` 值。\n- `String` 的 `equals()` 方法仅当两个 `String` 值具有相同字符且顺序相同时才返回 `true`。\n\
    - 可以 `toUpperCase()` 方法和 `toLowerCase()` 方法更改 `String` 的字符大小写。\n- 可以使用 `String`\
    \ 的 `startsWith()` 和 `endsWith()` 方法比较 `String` 值。\n- 可以 `indexOf()` 和 `substring()`\
    \ 方法在 `String` 中查找子字符串。\n- `isEmpty()` 方法仅在 `String` 完全没有任何内容时才返回 `true`。\n- 可以使用\
    \ `String` 的 `trim()`、`charAt()` 和 `replace()` 方法操作 `String` 值中的字符。\n\n6\n\n##\
    \ 创建类\n\n***本章演示了如何创建使用多个方法和类的 Java 程序。***\n\n- 形成多个方法\n- 理解程序范围\n- 形成多个类\n- 扩展现有类\n\
    - 创建对象类\n- 产生对象实例\n- 封装属性\n- 构造对象值\n- 总结\n\n### 形成多个方法\n\n程序通常被拆分为独立的方法来创建任务，这使得更容易追踪错误，因为每个方法都可以单独测试。调用方法的语法只需要方法名，后面跟着括号。类甚至可以包含多个相同的方法，只要它们的参数不同或参数类型不同。这种用的特性被称为“重载”。\n\
    \n![image](img/1bl.jpg)启动一个名为“Methods”的新程序，其中包含标准的 main 方法\n\n```java\nclass Methods\n\
    {\n    public static void main ( String[] args ) {             }\n}\n```\n\n![image](img/common.jpg)\n\
    \nMethods.java\n\n![image](img/2bl.jpg)在 main 方法的花括号之间，插入输出消息的语句并调用名为“sub”的方法\n\
    \n```java\nSystem.out.println( “Message from main method.” ) ;\n```\n\n![image](img/3bl.jpg)在\
    \ main 方法之后、类的花括号之前，添加输出消息的方法\n\n```java\npublic static void sub()\n{\n    System.out.println(\
    \ “Message from sub method.” )\n}\n```\n\n![image](img/4bl.jpg)将程序保存为 **Methods.java**，然后编译并运行程序以查看输出\n\
    \n![image](img/pg98_2.jpg)\n\n![image](img/jpg)\n\n每个重载方法的声明必须指示方法返回一个 **String**\
    \ 值，而不是 **void**。\n\n![image](img/1bl.jpg)启动一个名为“Overload”的新程序，其中包含标准的 main 方法\n\
    \n```java\nclass Overload\n{\n    public static void main ( String[] args ) {\
    \             }\n}\n```\n\n![image](img/common.jpg)\n\nOverload.java\n\n![image](img/2bl.jpg)在\
    \ main 方法的花括号之间，插入三个调用不同重载方法的语句并传递参数值\n\n```java\nSystem.out.println( write( 12\
    \ ) ) ;\nSystem.out.println( write( “Twelve” ) ;\nSystem.out.println( write( 4\
    \ , 16 ) ) ;\n```\n\n![image](img/3bl.jpg)在 main 方法之后、类的花括号之前，添加三个重载方法，每个都向调用者返回\
    \ **String**\n\n```java\npublic static String write( int num )\n{\n    return\
    \ ( “Integer passed is “ + num ) ;\n}\n\npublic static String write( String num\
    \ )\n{\n    return ( “String passed is “ + num ) ;\n}\n\npublic static String\
    \ write( int num1 , int num2 )\n{\n    return ( “Sum Total is “ + ( num1 * num2\
    \ ) ) ;\n}\n```\n\n### 程序范围\n\n在方法内部声明的变量只能从该方法内部访问 —— 它的访问“范围”仅限于声明该变量的方法。这意味着可以在另一个方法中声明相同名称的变量而不会产生冲突。\n\
    \n"
- fmt: "\n![image](images/1bl.jpg)Start a new program named “Scope” containing the\
    \ standard main method\n\n```java\nclass Scope\n{\n    public static void main\
    \ ( String[] args ) {    }\n}\n```\n\n![image](images/common.jpg)\n\nScope.java\n\
    \n![image](images/2bl.jpg)Between the curly brackets of the main method declare\
    \ and initialize a local `String` variable, then output its value\n\n```java\n\
    String txt = “This is a local variable in the main method”;\nSystem.out.println(\
    \ txt ) ;\n```\n\n![image](images/3bl.jpg)After the main method, before the final\
    \ curly bracket of the class, add another method named “sub”\n\n```java\npublic\
    \ static void sub( ) {    }\n```\n\n![image](images/4bl.jpg)Between the curly\
    \ brackets of the `sub` method, declare and initialize a local `String` variable\
    \ of the same name as the variable in the main method\n\n```java\nString txt =\
    \ “This is a local variable in the sub method” ;\nSystem.out.println( txt ) ;\n\
    ```\n\n![image](images/5bl.jpg)Insert a call to the `sub` method at the end of\
    \ the main method\n\n```java\nsub() ;\n```\n\n![image](images/6bl.jpg)Save the\
    \ program as `Scope.java` then compile and run the program to see the output\n\
    \n![image](images/pg100_1.jpg)\n\n![image](images/forget.jpg)\n\nA counter variable\
    \ declared in a `for` loop cannot be accessed outside the loop – its scope is\
    \ limited to the `for` statement block.\n\nThe `static` keyword that is used in\
    \ method declarations ensures that the method is a “class method” – globally accessible\
    \ from any other method in the class.\n\n![image](images/pg101_1.jpg)\n\nSimilarly,\
    \ a “class variable” can be declared with the `static` keyword to ensure it is\
    \ globally accessible throughout the class. Its declaration should be made before\
    \ the `main` method declaration, right after the curly bracket following the class\
    \ declaration.\n\nA program may have a global class variable and local method\
    \ variable of the same name. The local method variable takes precedence unless\
    \ the global class variable is explicitly addressed by the class name prefix using\
    \ dot notation, or if a local variable of that name has not been declared.\n\n\
    ![image](images/7bl.jpg)Edit `Scope.java` by inserting a global class `String`\
    \ variable constant of the same name as the local method variables\n\n```java\n\
    final static String txt = “This is a global variable of the Scope class” ;\n```\n\
    \n![image](images/8bl.jpg)Add a statement at the end of the `main` method to output\
    \ the value of the global class variable\n\n```java\nSystem.out.println( Scope.txt\
    \ ) ;\n```\n\n![image](images/9bl.jpg)Comment out the line that declares the local\
    \ variable in the `sub` method – so the output statement will now address the\
    \ global variable of the same name\n\n```java\n//String txt = “This is a local\
    \ variable in the sub method” ;\n```\n\n![image](images/10bl.jpg)Save the changes,\
    \ then recompile the program and run it once more to see the revised output\n\n\
    ![image](images/pg101_2.jpg)\n\n![image](images/hot.jpg)\n\nUse local method variables\
    \ wherever possible to avoid conflicts – global class variables are typically\
    \ only used for constants.\n\n## Forming multiple classes\n\nIn the same way that\
    \ a program may have multiple methods, larger programs may consist of several\
    \ classes – where each class provides specific functionality. This modular format\
    \ is generally preferable to writing the entire program in a single class, as\
    \ it makes debugging easier and provides better flexibility.\n\n![image](images/pg102_1.jpg)\n\
    \nThe `public` keyword that appears in declarations is an “access modifier” that\
    \ determines how visible an item will be to other classes. It can be used in the\
    \ class declaration to explicitly ensure that class will be visible to any other\
    \ class. If it is omitted, the default access control level allows access from\
    \ other local classes. The `public` keyword must always be used with the program’s\
    \ `main` method, however, so that method will be visible to the compiler.\n\n\
    ![image](images/1bl.jpg)Start a new program named “Multi” containing the standard\
    \ main method – including the `public` keyword as usual\n\n```java\nclass Multi\n\
    {\n    public static void main ( String[] args ) {    }\n}\n```\n\n![image](images/common.jpg)\n\
    \nMulti.java\n\n![image](images/2bl.jpg)Between the curly brackets of the `main`\
    \ method, declare and initialize a `String` variable, then output its contents\n\
    \n```java\nString msg = “This is a local variable in the Multi class” ;\nSystem.out.println(\
    \ msg ) ;\n```\n\n![image](images/3bl.jpg)Output the contents of a class `String`\
    \ variable constant named “txt” from a class named “Data”\n\n```java\nSystem.out.println(\
    \ Data.txt ) ;\n```\n\n![image](images/4bl.jpg)Call a method named “greeting”\
    \ from the `Data` class\n\n```java\nData.greeting() ;\n```\n\n![image](images/5bl.jpg)Call\
    \ a method named “line” from a class named “Draw”\n\n```java\nDraw.line() ;\n\
    ```\n\n![image](images/6bl.jpg)Save the program as `Multi.java`\n\n![image](images/hot.jpg)\n\
    \nThe compiler will automatically find classes in adjacent external `.java` files\
    \ – and create compiled `.class` files for each one.\n\n![image](images/7bl.jpg)Start\
    \ a new file creating the Data class\n\n```java\nclass Data\n{\n}\n```\n\n![image](images/common.jpg)\n\
    \nData.java\n\n![image](images/8bl.jpg)Declare and initialize a public class constant\n\
    \n```java\npublic static String txt = “This is a global variable” ;\n```\n\n![image](images/9bl.jpg)Add\
    \ a public “greeting” class method\n\n```java\npublic static void greeting()\n\
    {\n    System.out.print( “This is a global method” ) ;\n    System.out.println(\
    \ “of the Data class” ) ;\n}\n```\n\n![image](images/10bl.jpg)Save the file as\
    \ `Data.java` in the same directory as the `Multi.java` program\n\n![image](images/11bl.jpg)Start\
    \ a new file creating the Draw class and a class “line” method for default access\
    \ – without the `public` keyword\n\n```java\nclass Draw\n{\n    static void line()\n\
    \    {\n        System.out.println( ) ;\n    }\n}\n```\n\n![image](images/common.jpg)\n\
    \nDraw.java\n\n![image](images/12bl.jpg)Save the file as `Draw.java` in the same\
    \ directory as the `Multi.java` program, then compile and run the program to see\
    \ the output\n\n![image](images/pg103_1.jpg)\n\n![image](images/forget.jpg)\n\n\
    The `public` keyword allows access from any other class, but default access only\
    \ allows access from classes in the same package.\n\n## Extending an existing\
    \ class\n\nA class can inherit the features of another class by using the `extends`\
    \ keyword in the class declaration to specify the name of the class from which\
    \ it should inherit. For example, the declaration `class Extra extends Base` inherits\
    \ from the `Base` class.\n\n![image](images/pg104_1.jpg)\n\nThe inheriting class\
    \ is described as the “sub” class, and the class from which it inherits is described\
    \ as the “super” class. In the example above, the `Base` class is the super class\
    \ and the `Extra` class is the sub class.\n\nMethods and variables created in\
    \ a super class can generally be treated as if they existed in the sub class providing\
    \ they have not been declared with the `private` keyword, which denies access\
    \ from outside the original class.\n\nA method in a sub class will override a\
    \ method of the same name that exists in its super class unless their arguments\
    \ differ. The method in the super class may be explicitly addressed using its\
    \ class name and dot notation – for example, `SuperClass.run()`.\n\nIt should\
    \ be noted that a `try catch` statement in a method within a super class does\
    \ not catch exceptions that occur in a sub class – the calling statement must\
    \ be enclosed within its own `try catch` statement to catch those exceptions.\n\
    \n![image](images/1bl.jpg)Start a new class named “SuperClass”\n\n```java\nclass\
    \ SuperClass {    }\n```\n\n![image](images/common.jpg)\n\nSuperClass.java\n\n\
    ![image](images/2bl.jpg)Between the curly brackets of the class, add a method\
    \ that outputs an identifying `String`\n\n```java\npublic static void hello( )\n\
    {\n    System.out.println( “Hello from the Super Class” ) ;\n}\n```\n\n![image](images/3bl.jpg)Add\
    \ a second method that attempts to output a passed argument, then save the file\
    \ as `SuperClass.java`\n"
