    ### Adding push buttons


    The Swing `JButton` class creates a push-button component that can be added to
    a graphical interface. This lets the user interact with the program by clicking
    on a button to perform an action.


    ![image](images/pg136_1.jpg)


    The `JButton` object is created with the `new` keyword, and its constructor takes
    a `String` argument specifying text to be displayed on that button.


    Images can appear on buttons too. An `ImageIcon` object must first be created
    to represent the image, specifying the image file name as the argument to its
    constructor. Typically, the image will be located alongside the program but the
    argument can include the path for images outside the local directory.


    ![image](images/hot.jpg)


    The next chapter, [Chapter 9](#chapter09.html), details of how to create event-handler
    methods to respond to user actions, such as a button click.


    Specify the name of the `ImageIcon` object as the argument to the `JButton` constructor
    to display that image on the button, or specify a `String` and `ImageIcon` as
    its two arguments to display both text and the image.


    ![image](images/1b.jpg)Edit a copy of `Window.java` from [here](#chapter08.html_pg135),
    changing the class name in the declaration, the constructor, and the instance
    statement from “Window” to “Buttons”


    ![image](images/common.jpg)


    Buttons.java


    ![image](images/2b.jpg)Before the `Buttons()` constructor, create two `ImageIcon`
    objects


    ```java

    ImageIcon tick = new ImageIcon( “Tick.png” ) ;

    ImageIcon cross = new ImageIcon( “Cross.png” ) ;

    ```


    ![image](images/3b.jpg)Next, create three `JButton` objects to display text, an
    image, and both text and an image respectively


    ```java

    JButton btn = new JButton( “Click Me” ) ;

    JButton tickBtn = new JButton( tick ) ;

    JButton crossBtn = new JButton( “STOP” , cross ) ;

    ```


    ![image](images/4b.jpg)Inside the `Buttons()` constructor, insert three statements
    to add the `JButton` components to the `JPanel` container


    ```java

    pnl.add( btn ) ;

    pnl.add( tickBtn ) ;

    pnl.add( crossBtn ) ;

    ```


    ![image](images/5b.jpg)Save the program as `Buttons.java` then compile and run
    the program to see push buttons appear in the window


    ![image](images/pg137_1.jpg)


    ![image](images/pg137_2.jpg)


    ![image](images/forget.jpg)


    The `JPanel` object has an `add()` method – to add components to that panel.


    ![image](images/hot.jpg)


    Details of how to create a Java Archive (JAR) can be found [here](#chapter10.html_sec85).


    The buttons respond graphically when they are clicked, but will not perform an
    action until the program provides an event-handler method to respond to each click
    event.


    Where the program is intended for deployment in a single Java archive (JAR), image
    resources must be loaded by a `ClassLoader` object before creating the `ImageIcon`
    objects to represent them.


    Specifying the resource file name or path to the `getResource()` method of a `ClassLoader`
    returns a URL, which can be used as the argument to the `ImageIcon` constructor.
    The `java.net` package provides a useful `URL` class to which these may first
    be assigned.


    ![image](images/6b.jpg)Before the `Buttons()` constructor, create a `ClassLoader`
    object


    ```java

    ClassLoader ldr = this.getClass().getClassLoader() ;

    ```


    ![image](images/7b.jpg)Load the URLs of the image resources


    ```java

    java.net.URL tickURL = ldr.getResource( “Tick.png” ) ;

    java.net.URL crossURL = ldr.getResource( “Cross.png” ) ;

    ```


    ![image](images/8b.jpg)Edit the `ImageIcon()` constructors in Step 2 opposite
    to use URLs


    ```java

    ImageIcon tick = new ImageIcon( tickURL ) ;

    ImageIcon cross = new ImageIcon( crossURL ) ;

    ```


    ![image](images/9b.jpg)Save the changes then recompile and re-run the program
    – it will run as before but can now be deployed in a JAR


    ![image](images/hot.jpg)


    Notice how the `getClass()` method and `this` keyword are used here to reference
    this class object.


