- fmt: "\nElement values can be modified by specifying the index number and new value\
    \ as arguments to the list’s `set()` method. Elements can be added to the list\
    \ at a particular position by specifying the index number and value as arguments\
    \ to the list’s `add()` method. The list expands to accommodate additional elements\
    \ by moving the element values along the index.\n\nAn `ArrayList` object is simply\
    \ created using the `new` keyword but, like other Java collections, the statement\
    \ must specify which generic type of item the list may contain. Typically, a list\
    \ may contain `String` items, so `ArrayList` must have a `<String>` suffix.\n\n\
    Collections, such as `ArrayList`, have a `forEach()` method that iterates over\
    \ each element in the list. This makes it easy to loop through all items contained\
    \ in the list.\n\nEach stored list item can be conveniently referenced in turn\
    \ by specifying a “lambda expression” as the argument to the `forEach()` method.\
    \ Lambda expressions are simply short, anonymous (unnamed) methods that can be\
    \ specified in the location they are to be executed. They begin with parentheses,\
    \ to contain any arguments, then have a `->` character sequence followed by the\
    \ statement block, with this syntax:\n\n```\n(*argument/s*) -> { *statement/s*\
    \ }\n```\n\nThe data type of the arguments can be explicitly declared, or it can\
    \ be inferred from the context – `(String x)` can be simply `(x)`. Additionally,\
    \ the curly brackets can be omitted if the lambda expression statement block contains\
    \ only one statement.\n\nWith a list’s `forEach()` method the value of the current\
    \ element in the iteration can be passed to the lambda expression as its argument,\
    \ then displayed in output by its statement.\n\n![image](images/hot.jpg)\n\nYou\
    \ can discover how many elements a list currently has by calling its `size()`\
    \ method.\n\n![image](images/hot.jpg)\n\nLambda expressions were introduced in\
    \ Java 8 to enable succinct anonymous methods.\n\n![image](images/1v.jpg)Start\
    \ a new program that imports the functionality of all methods in the `java.util.ArrayList`\
    \ class\n\n```java\nimport java.util.ArrayList ;\n```\n\n![image](images/common.jpg)\n\
    \nLists.java\n\n![image](images/2v.jpg)Add a class named “Lists” containing the\
    \ standard main method\n\n```java\nclass Lists\n{\n    public static void main(\
    \ String[] args ) { }\n}\n```\n\n![image](images/3v.jpg)Between the curly brackets\
    \ of the main method, insert a statement to create a `String ArrayList` object\
    \ named “list”\n\n```java\nArrayList<String> list = new ArrayList<String>() ;\n\
    ```\n\n![image](images/4v.jpg)Next, add statements to populate the list elements\
    \ with `String` values then display the entire list\n\n```java\nlist.add( “Alpha”\
    \ ) ;\nlist.add( “Delta” ) ;\nlist.add( “Charlie” ) ;\nSystem.out.println( “List:\
    \ ” + list ) ;\n```\n\n![image](images/5v.jpg)Now, identify the current value\
    \ in the second element then replace it with a new `String`\n\n```java\nSystem.out.println(\
    \ “Replacing: ” + list.get(1) + “\\n” ) ;\nlist.set( 1, “Bravo” ) ;\n```\n\n![image](images/6v.jpg)Finally,\
    \ iterate through the list and display the `String` value now stored in each element\n\
    \n```java\nlist.forEach( ( x ) -> System.out.println( “Item: “ + x ) ) ;\n```\n\
    \n![image](images/7v.jpg)Save the program as `Lists.java` then compile and run\
    \ the program to see the output\n\n![image](images/pg127_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nAs with regular arrays, elements in an `ArrayList` have a zero-based index.\n\
    \n![image](images/hot.jpg)\n\nThe graphical Java Swing `JComboBox` component that\
    \ is introduced [here](#chapter08.html_pg143) holds a drop-down list of options,\
    \ so must also specify its generic data type when that object gets created.\n\n\
    ### Managing dates\n\nThe `java.time` package contains a class named `LocalDateTime`\
    \ that has useful methods to extract specific fields from a `LocalDateTime` object\
    \ that describe a particular point in time. These can be made available to a program\
    \ by importing the specific class with `import java.time.LocalDateTime;` or by\
    \ importing all classes in this package using the wildcard with `import java.time.*\
    \ ;`.\n\n![image](images/pg128_1.jpg)\n\nA new `LocalDateTime` object can be created\
    \ with fields describing the current date and time using its `now()` method. The\
    \ fields are initialized from the system clock for the current locale.\n\nThe\
    \ value within an individual field can be retrieved using an appropriate method\
    \ of the `LocalDateTime` object. For example, the value of the year field can\
    \ be retrieved using its `getYear()` method. Similarly, any field can be changed\
    \ using an appropriate method of the `LocalDateTime` object to specify a replacement\
    \ value. For example, the value of the year field can be changed by specifying\
    \ a new year value as an argument to its `withYear()` method.\n\n![image](images/1v.jpg)Start\
    \ a new program that imports the functionality of all methods in the `java.time.LocalDateTime`\
    \ class\n\n```java\nimport java.time.LocalDateTime ;\n```\n\n![image](images/common.jpg)\n\
    \nDateTime.java\n\n![image](images/2v.jpg)Add a class named “DateTime” containing\
    \ the main method\n\n```java\nclass DateTime\n{\n    public static void main(\
    \ String[] args ) { }\n}\n```\n\n![image](images/3v.jpg)Between the curly brackets\
    \ of the main method, insert a statement to create a `LocalDateTime` object\n\n\
    ```java\nLocalDateTime date = LocalDateTime.now() ;\n```\n\n![image](images/4v.jpg)Output\
    \ the current date and time\n\n```java\nSystem.out.println( “It is now ” + date\
    \ ) ;\n```\n\n![image](images/5v.jpg)Increment the year, and output the revised\
    \ date\n\n```java\ndate = date.withYear( 2022 ) ;\nSystem.out.println( “Date is\
    \ now ” + date ) ;\n```\n\n![image](images/6v.jpg)Output individual `LocalDateTime`\
    \ fields of the revised date\n\n```java\nString fields = “\\nYear:\\t\\t\\t” +\
    \ date.getYear();\nfields += “\\nMonth:\\t\\t\\t” + date.getMonth();\nfields +=\
    \ “\\nMonth Number:\\t\\t” + date.getMonthValue();\nfields += “\\nDay:\\t\\t\\\
    t” + date.getDayOfWeek();\nfields += “\\nDay Number:\\t\\t” + date.getDayOfMonth();\n\
    fields += “\\nDay Number Of Year:\\t” + date.getDayOfYear();\nfields += “\\nHour\
    \ (0-23):\\t\\t” + date.getHour();\nfields += “\\nMinute:\\t\\t\\t” + date.getMinute();\n\
    fields += “\\nSecond:\\t\\t\\t” + date.getSecond();\nSystem.out.println( fields\
    \ ) ;\n```\n\n![image](images/7v.jpg)Save the program as `DateTime.java` then\
    \ compile and run the program to see the output\n\n![image](images/pg129_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nConcatenating a `String` like this means the program\
    \ makes just one call to `println()` to output field details – this is more efficient\
    \ than calling `println()` many times to output each individual field separately.\n\
    \n![image](images/forget.jpg)\n\nYou can alternatively use the `ZonedDateTime`\
    \ class instead of `LocalDateTime` if you also require a time zone field.\n\n\
    ### Formatting numbers\n\nJava contains a package named `java.text` that provides\
    \ useful classes for formatting numbers and currency. The package can be made\
    \ available to a program by including an **import** statement at the very beginning\
    \ of the **.java** file. This can use the `*` wildcard character to mean “all\
    \ classes” in the statement. Alternatively, specific classes can be imported by\
    \ name.\n\n![image](images/pg130_1.jpg)\n\nThe `java.text` package has a class\
    \ named “NumberFormat”, which has methods that can be used to format numerical\
    \ values for output – adding group separators, currency signs, and percentage\
    \ signs.\n\nThe method used to create a new `NumberFormat` object determines its\
    \ formatting type – `getNumberInstance()` for group separators, `getCurrencyInstance()`\
    \ for currency signs, and `getPercentInstance()` for percentage signs. Formatting\
    \ is applied by specifying the numerical value to be formatted as the argument\
    \ to the `format()` method of the `NumberFormat` object.\n"
