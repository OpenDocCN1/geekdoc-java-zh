    ### Troubleshooting problems


    Sometimes, the `javac` compiler or `java` interpreter will complain about errors,
    so it’s useful to understand their cause and how to quickly resolve the problem.
    In order to demonstrate some common error reports, this code contains some deliberate
    errors:


    ```java

    class test

    {

    public static void main ( String[] args )

    {

    String text ;

    System.out.println( “Test ” + text )

    }

    }

    ```


    ![image](images/common.jpg)


    Test.java


    A first attempt to compile `Test.java` throws up this error report:


    ![image](images/pg22_1.jpg)


    * Cause – the `javac` compiler cannot be found.

    * Solution – edit your system environment with the command `setx path “%path%;C:\Java\bin”`
    or use the full path to invoke the compiler with the command `C:\Java\bin\javac
    Test.java`


    ![image](images/pg22_2.jpg)


    * Cause – the file `Test.java` cannot be found.

    * Solution – navigate to the directory where the file is located, or use the full
    path address to the file in the command.


    ![image](images/hot.jpg)


    To edit the environment variables in Windows, you can open the **System Properties**,
    **Advanced** tab and click the **Environment Variables** button. Select `Path`,
    `Edit` and add `C:\Java\bin`, then click `OK` to apply the change.


    ![image](images/pg22_3.jpg)


    ![image](images/pg23_1.jpg)


    * Cause – the statement is not terminated correctly.


    ![image](images/pg23_2.jpg)

    * Solution – in the source code add a semicolon at the end of the statement, then
    save the file to apply the change.


    ![image](images/pg23_3.jpg)


    * Cause – the program name and class name do not match.

    * Solution – in the source code change the class name from `test` to `Test`, then
    save the file to apply the change.


    ![image](images/pg23_4.jpg)


    * Cause – the variable `text` has no value.

    * Solution – in the variable declaration assign the variable a valid `String`
    value (for instance `= “success”`) then save the file.


    ![image](images/pg23_5.jpg)


    ![image](images/snake.jpg)


    You must run the program from within its directory – you cannot use a path address,
    as the Java launcher requires a program name, not a file name.


    ### Summary


    * Java is both a programming language and a runtime platform.

    * Java programs are written as plain text files with a `.java` file extension.

    * The Java compiler `javac` creates compiled `.class` program files from original
    `.java` source code files.

    * The Java interpreter `java` executes compiled programs using an instance of
    the Java Virtual Machine.

    * The Java VM is available on many operating system platforms.

    * Adding Java’s `bin` sub-directory to the system `PATH` variable allows the `javac`
    compiler to be invoked from anywhere.

    * Java is a case-sensitive language.

    * The standard `main` method is the entry point for Java programs.

    * The `System.out.println()` statement outputs text.

    * A Java program file name must exactly match its class name.

    * Java variables can only be named in accordance with specified naming conventions,
    and must avoid the Java keywords.

    * In Java programming, each statement must be terminated by a semicolon character.

    * The most common Java data types are `String`, `int`, `char`, `float` and `boolean`.

    * `String` values must be enclosed in double quotes; `char` values in single quotes;
    and `float` values must have an “f” suffix.

    * The `final` keyword can be used to create a constant variable.

    * Comments can be added to Java source code between `/***` and `***/**`, on one
    or more lines, or after `//` on a single line.

    * Error reports identify compiler and runtime problems.


    ## Performing operations


    *This chapter demonstrates the various operators that are used to create expressions
    in Java programs.*


    ### Doing arithmetic


    Arithmetical operators, listed in the table below, are used to create expressions
    in Java programs that return a single resulting value. For example, the expression
    `4 * 2` returns the value `8`.


    ![image](images/pg26_1.jpg)


    | Operator: | Operation |

    | :--- | :--- |

    | `+` | Addition (and concatenates `String` values) |

    | `-` | Subtraction |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Modulus |

    | `++` | Increment |

    | `--` | Decrement |


    The increment operator `++` and decrement operator `--` return the result of modifying
    a single given operand by a value of one. For example, `4++` returns the value
    `5`.


    The operation performed by the `+` operator depends on the type of its operands.
    Where both operands are numeric it will return the total sum of those numbers,
    but where the operands are `String` values it will return a concatenated `String`.
    For example, `“Java ”` + `“Arithmetic”` returns `“Java Arithmetic”`.


    Division of `int` values will truncate any fractional part. For example, `11/4`
    returns `2`.


    The modulus operator divides the first operand by the second operand and returns
    the remainder of the operation. For example, `32 % 5` returns `2` – five divides
    into 32 six times, with 2 remainder.

