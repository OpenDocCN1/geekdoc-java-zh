  trans: "\n\n一个 `while` 循环可以构造成类似于 `for` 循环的结构，通过在测试表达式中评估计数器变量，实现方法是在循环外部创建一个计数器变量，并在每次迭代执行的语句改变它的值。例如，上一个示例中的外部\
    \ `for` 循环可以重构为 `while` 循环，如下：\n\n```java\nint i = 1 ;\nwhile ( i < 4 )\n{\n \
    \   System.out.println( “Outer Loop i=” +i ) ;\n    i++;\n}\n```\n\n这会将计数器初始化放置在\
    \ `while` 循环结构外部，并将更新器放在语句块内部。\n\n![image](img/snake.jpg)\n\n无限循环会由于持续执行迭代而锁定程序——在\
    \ Windows 上，按下 `Ctrl + C` 停止。\n\n![image](img/1g.jpg)创建一个名为“While”的新程序，其中包含标准的\
    \ `main` 方法\n\n```java\nclass While\n{\n    public static void main ( String[]\
    \ args ) {      }\n}\n```\n\n![image](img/j1.jpg)\n\nWhile.java\n\n![image](img/2g.jpg)在\
    \ `main` 方法内部声明并初始化一个名为 `num` 的整数变量\n\n```java\nint num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个\
    \ `while` 循环，当 `num` 变量大于零时显示其当前值\n\n```java\nwhile ( num > 0 )\n{\n    System.out.println(\
    \ “While Countdown: ” + num ) ;\n}\n```\n\n![image](img/4g.jpg)在 `while` 循环块的末尾插入一个更新器，每次迭代将\
    \ `num` 变量的值减少 10——从而避免无限循环\n\n```java\nnum -= 10 ;\n```\n\n![image](img/5g.jpg)将程序保存为\
    \ `While.java`，然后编译并运行程序查看输出\n\n![image](img/pg53_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n该更新器中的赋值操作是 `num = ( num - 10 )` 的简写。\n\n## 执行 do-while 循环\n\n`while` 循环结构的一种变体（见此处）使用\
    \ `do` 关键字创建一个具有如下语法的循环：\n\n```java\ndo\n{\n    statements-to-be-executed-on-each-iteration\
    \ ;\n}\nwhile ( test-expression ) ;\n```\n\n![image](img/arrowg.jpg)\n\n与 `for`\
    \ 循环和 `while` 循环一样，`do while` 循环重复执行其包含的语句，直到满足测试条件——然后循环结束，程序继续执行下一个任务。\n\n与\
    \ `for` 循环和 `while` 循环不同，`do while` 的测试表达式出现在包含执行语句的块之后。测试表达式在循环的每次迭代结束时被评估是否为布尔值\
    \ `true`。当评估返回 `true` 时，继续下一次迭代；但当返回 `false` 时，循环立即终止。这意味着 `do while` 循环中的语句至少会被执行一次。\n\
    \n请注意，如果测试表达式在第一次评估时返回 `false`，循环语句已经执行过一次。\n\n`do while` 循环也可以构造成类似于 `for` 循环的结构，通过在测试表达式中评估计数器变量，实现方法是将计数器初始化放在循环结构外部，并将更新器放在语句块内部——就像\
    \ `while` 循环一样。\n\n所有仅包含一条待执行语句的 `for`、`while` 或 `do while` 循环结构都可以选择性省略语句周围的大括号。但如果省略了，以后向循环中添加额外语句时，你需要添加大括号。\n\
    \n选择 `for`、`while` 还是 `do while` 循环很大程度上取决于个人的编码偏好和目的。`for` 循环结构方便地将计数器初始化、测试表达式和更新器放置在\
    \ `for` 关键字后的括号中。`while` 循环结构可以更简洁——但你必须在循环语句中包含一个更新器以避免无限循环。`do while` 循环仅仅增加了一个优点，即在评估测试表达式之前执行一次其语句——正如右侧描述的\
    \ `do while` 循环所示。\n\n![image](img/hot.jpg)\n\n始终将循环要执行的语句包含在大括号内——以保持代码的清晰度并提高代码的可维护性。\n\
    \n![image](img/1g.jpg)创建一个名为“DoWhile”的新程序，其中包含标准的 `main` 方法\n\n```java\nclass\
    \ DoWhile\n{\n    public static void main ( String[] args ) {      }\n}\n```\n\
    \n![image](img/j1.jpg)\n\nDoWhile.java\n\n![image](img/2g.jpg)在 `main` 方法内部声明并初始化一个名为\
    \ `num` 的整数变量\n\n```java\nint num = 100 ;\n```\n\n![image](img/3g.jpg)添加一个 `do\
    \ while` 循环，当 `num` 变量小于 10 时显示其当前值\n\n```java\ndo\n{\n    System.out.println(\
    \ “DoWhile Countup: ” + num )\n}\nwhile ( num < 10 ) ;\n```\n\n![image](img/4g.jpg)在\
    \ `while` 循环块的末尾插入一个更新器，每次迭代将 `num` 变量的值减少 10——从而避免无限循环\n\n```java\nnum -= 10\
    \ ;\n```\n\n![image](img/5g.jpg)将程序保存为 `While.java`，然后编译并运行程序查看输出\n\n## 跳出循环\n\
    \n`break` 关键字用于满足特定条件时提前终止循环。`break` 语句位于循环块内部，并跟在一个测试表达式。例如，在嵌套循环中，它会进入下一个任务。\n\
    \n![image](img/pg55.jpg)\n\n![image](img/1g.jpg)创建一个名为“Break”的程序，包含标准的 `main`\
    \ 方法\n\n```java\nclass Break\n{\n    public static void main ( String[] args )\
    \ {      }\n}\n```\n\n![image](img/j1.jpg)\n\nBreak.java\n\n![image](img/2g.jpg)在\
    \ `main` 方法内部创建两个嵌套的 `for` 循环，在每次迭代中显示它们的计数器值\n\n```java\nfor ( int i = 1 ; i\
    \ < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
    \ “Running i=”+i+“ j=”+j )\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Break.java`，然后编译并运行程序查看输出\n\
    \n![image](img/pg56_1.jpg)\n\n该程序对外部循环进行了三次迭代，每次迭代都执行内部循环。可以添加 `break` 语句来停止内部循环的第二次执行。\n\
    \n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++\
    \ )\n    {\n        if ( i == 2 && j == 1 )\n        {\n            System.out.println(\
    \ “Breaks innerLoop when i=”+i+“ j=”+j )\n            break ;\n        }\n   \
    \ }\n}\n```\n\n`continue` 关键字用于满足特定条件时跳过循环的单次迭代。`continue` 语句位于语句块内部，并跟在一个测试表达式。当测试返回\
    \ `true` 时，该迭代结束。\n\n```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int\
    \ j = 1 ; j < 4 ; j++ )\n    {\n        if ( i == 1 && j == 1 )\n        {\n \
    \           System.out.println( “Continues innerLoop when i=”+i+“ j=”+j )\n  \
    \          continue;\n        }\n    }\n}\n```\n\n"
- fmt: "\nThe default behavior of the `break` and `continue` keywords can be changed\
    \ to explicitly specify that control should return to a labeled outer loop by\
    \ stating its label name. This allows a loop to perform iterations until a specified\
    \ condition is met or broken.\n\n![image](images/pg58_2.jpg)\n\nThe syntax to\
    \ label a loop requires a label name, followed by a `:` colon character, to precede\
    \ the start of the loop structure.\n\n![image](images/1g.jpg)Start a new program\
    \ named “Label” containing the standard main method\n\n```java\nclass Label\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](images/j1.jpg)\n\
    \nLabel.java\n\n![image](images/2g.jpg)Inside the main method, create two nested\
    \ `for` loops that display their counter values on each of three iterations\n\n\
    ```java\nfor ( int i = 1 ; i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++\
    \ )\n    {\n        System.out.println( “Running i=”+i+ “ j=”+j ) ;\n    }\n}\n\
    ```\n\n![image](images/3g.jpg)Save the program as `Label.java` then compile and\
    \ run the program to see the output\n\n![image](images/pg58_1.jpg)\n\n![image](images/4g.jpg)Edit\
    \ the start of the outer loop to label it “outerLoop”\n\n```java\nouterLoop :\
    \ for ( int i = 1 ; i < 4 ; i++ )\n```\n\nTo explicitly specify that the program\
    \ should proceed in the outer loop, state that loop’s label name after the `continue`\
    \ keyword.\n\n![image](images/5g.jpg)Add this `continue` statement to the beginning\
    \ of the inner loop statement block, to proceed at the next iteration of the outer\
    \ loop – then recompile and re-run the program\n\n```java\nif ( i == 1 && j ==\
    \ 1 )\n{\n    System.out.println( “Continues outerLoop when i=” +i+ “ j=” +j )\
    \ ;\n    continue outerLoop ;\n}\n```\n\n![image](images/pg59_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nHere the `continue` statement halts all three iterations of the inner loop‘s\
    \ first run – by returning control to the outer loop.\n\nTo explicitly specify\
    \ that the program should exit from the outer loop, state that loop’s label name\
    \ after the `break` keyword.\n\n![image](images/6g.jpg)Add this `break` statement\
    \ to the beginning of the inner loop statement block, to exit the outer loop –\
    \ then recompile and re-run the program\n\n```java\nif ( i == 2 && j == 3 )\n\
    {\n    System.out.println( “Breaks outerLoop when i=” +i+ “ j=” +j ) ;\n    break\
    \ outerLoop ;\n}\n```\n\n![image](images/pg59_2.jpg)\n\n![image](images/forget.jpg)\n\
    \nHere the `break` statement halts all further iterations of the entire loop structure\
    \ – by exiting from the outer loop.\n\n### Summary\n\n- The `if` keyword performs\
    \ a conditional test to evaluate an expression for a Boolean value of `true` or\
    \ `false`.\n- An `if` statement block can contain one or more statements, which\
    \ are only executed when the test expression returns `true`.\n- The `else` keyword\
    \ specifies alternative statements to execute when the test performed by the `if`\
    \ keyword returns `false`.\n- Combined `if else` statements enable a program to\
    \ proceed by the process of conditional branching.\n- A `switch` statement can\
    \ often provide an elegant solution to unwieldy `if else` statements by offering\
    \ `case` options.\n- Each `case` option can be terminated by the `break` keyword\
    \ so only statements associated with that option will be executed.\n- The `default`\
    \ keyword can specify statements to be executed when all `case` options return\
    \ `false`.\n- A loop repeatedly executes the statements it contains until a tested\
    \ expression returns `false`.\n- The parentheses that follow the `for` keyword\
    \ specify the loop’s counter initializer, test expression, and counter updater.\n\
    - Statements in a `while` loop and a `do while` loop must change a value used\
    \ in their test expression to avoid an infinite loop.\n- The test expression is\
    \ evaluated at the start of `for` loops and `while` loops – before the first iteration\
    \ of the loop.\n- The test expression is evaluated at the end of `do while` loops\
    \ – after the first iteration of the loop.\n- A loop iteration can be skipped\
    \ using the `continue` keyword.\n- A loop can be terminated using the `break`\
    \ keyword.\n- Nested inner loops can use labels with the `break` and `continue`\
    \ keywords to reference the outer loop.\n\n## 4 Directing values\n\n*This chapter\
    \ demonstrates how to direct data values using various Java programming constructs.*\n\
    \n- [Casting type values](#chapter04.html_sec29)\n- [Creating variable arrays](#chapter04.html_sec30)\n\
    - [Passing an argument](#chapter04.html_sec31)\n- [Passing multiple arguments](#chapter04.html_sec32)\n\
    - [Looping through elements](#chapter04.html_sec33)\n- [Changing element values](#chapter04.html_sec34)\n\
    - [Adding array dimensions](#chapter04.html_sec35)\n- [Catching exceptions](#chapter04.html_sec36)\n\
    - [Summary](#chapter04.html_sec37)\n\n### Casting type values\n\nHandling values\
    \ in Java requires a type so that they can be processed. \n\n![image](pg62_1.jpg)Numeric\
    \ values can be easily “cast” (converted) into another data type using this syntax:\n\
    \n```java\n(type)value\n```\n\nSome loss of precision will occur when casting\
    \ `float` values into an `int`. \n\n![image](images/common.jpg)For example, casting\
    \ a `float` value of 9.9 into an `int` will be truncated at the decimal point.\n\
    \nNumeric values can be converted to `String` using the `toString()` method of\
    \ that type class.\n\n```java\nInteger.toString(num)\n```\n\nSimilarly, convert\
    \ a `float num` to a `String`:\n\n```java\nFloat.toString(num)\n```\n\nIn practice,\
    \ this is not always required because Java automatically converts variables to\
    \ a `String` if any one of the variables has a `String`.\n\n### Summary\n\nMore\
    \ frequently, you will want to convert a `String` value to a numeric type so the\
    \ program can use it arithmetically. A `String` value can be converted to an `int`\
    \ value using the `Integer.parseInt()` method. This takes the `String` value as\
    \ its argument:\n\n```java\nInteger.parseInt(msg)\n```\n\nSimilarly, convert a\
    \ `String` value to a `float` with `Float.parseFloat()`:\n\n```java\nFloat.parseFloat(msg)\n\
    ```\n\nWhen converting a `String` value to a numeric type, the `String` may only\
    \ contain a valid numeric value, or the compiler will report an error. All numeric\
    \ classes have a `parse...` method and a `toString` method allowing conversion\
    \ between `String` values and numeric data types.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Convert” containing the standard main method\n\n```java\n\
    class Convert\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/2p.jpg)Convert.java\n\nInside the main method, declare and initialize\
    \ a `float` variable and a `String` variable:\n\n```java\nfloat daysFloat = 365.25f;\n\
    String weeksString = “52”;\n```\n\nCast the `float` value into an `int` variable:\n\
    \n```java\nint daysInt = (int) daysFloat;\n```\n\nConvert the `String` value into\
    \ an `int` variable:\n\n```java\nint weeksInt = Integer.parseInt(weeksString);\n\
    ```\n"
