  trans: "\n通过向列表的 `set()` 方法传递索引数字和新值作为参数，可以修改元素值。通过向列表的 `add()` 方法传递索引数字和值作为参数，可以在列表的特定位置添加元素。列表通过沿索引移动元素值来扩展以容纳额外的元素。\n\
