    \n![image](img/hot.jpg)\n\n默认情况下，`Math.round()` 会四舍五入——因此 7.5 会被四舍五入为 8。\n\n`java.lang`\
    \ 包中的 `Math` 类提供了两个方法来比较两个数值。`Math.max()` 方法和 `Math.min()`方法各需要两个数字作为其参数。`Math.max()`\
    \ 将较大的较大的，而 `Math.min()` 将返回较小的数字。\n\n要比较的数字可以是任何数值数据类型，但结果将以 `double` 数据类型返回。\n\
    \n![image](img/1o.jpg)创建一个名为“Compare”的新程序，包含标准的 main 方法\n\n```java\nclass Compare\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](img/common.jpg)\n\
    \nCompare.java\n\n![image](img/2o.jpg)在 main 方法中，声明并初始化一个 `float` 变量和一个 `int`\
    \ 变量\n\n```java\nfloat num1 = 24.75f ;\nint num2 = 25 ;\n```\n\n![image](img/3o.jpg)输出较大的值\n\
    \n```java\nSystem.out.println( “Most is “ + Math.max( num1, num2 ) ) ;\n```\n\n\
    ![image](img/4o.jpg)输出较小值\n\n```java\nSystem.out.println( “Least is “ + Math.min(\
    \ num1, num2 ) ) ;\n```\n\n![image](img/5o.jpg)将程序保存为 `Compare.java`，然后编译并运行程序查看输出\n\
    \n![image](img/pg85_1.jpg)\n\n### 生成随机数\n\n`java.lang` 包中的 `Math` 类通过其 `Math.random()`\
    \ 方法提供了生成随机数的能力，该方法返回 0.0 到 0.999 之间的 `double` 精度随机数。乘以随机数可以指定更宽的范围。例如，乘以 10 将创建一个\
    \ 0.0 到 9.999 之间的随机数。现在，使用 `Math.ceil()` 将随机数向上取整将确保它落在 1-10 的包含范围内。\n\n![image](img/pg86_1.jpg)\n\
    \n![image](img/1o.jpg)创建一个名为“Random”的新程序，包含标准的 main 方法\n\n```java\nclass Random\n\
    {\n    public static void main ( String[] args ) { }\n}\n```\n\n![image](img/common.jpg)\n\
    \nRandom.java\n\n![image](img/2o.jpg)在 main 方法中，将随机数赋值给一个 `float` 变量并输出其值\n\n\
    ```java\nfloat random = (float) Math.random() ;\nSystem.out.println( “Random number:\
    \ “ + random ) ;\n```\n\n![image](img/3o.jpg)将随机数的乘积赋值给第二个 `float` 变量，并输出其值\n\n\
    ```java\nfloat multiplied = random * 10 ;\nSystem.out.println( “Multiplied number:\
    \ “ + multiplied ) ;\n```\n\n![image](img/4o.jpg)将乘后的随机数的向上取整整数赋值给一个 `int` 变量，并输出其值\n\
    \n```java\nint randomInt = (int) Math.ceil( multiplied ) ;\nSystem.out.println(\
    \ “Random Integer: “ + randomInt ) ;\n```\n\n![image](img/5o.jpg)将程序保存为 `Random.java`，然后编译并运行程序查看输出\n\
    \n![image](img/pg86_2.jpg)\n\n![image](img/hot.jpg)\n\n描述的彩票程序将此示例中的三个步骤合并到一个语句中。\n\
    \n可以使用 `Math.random()` 生成一组 1-59 范围内内的六个不重复的随机数，以产生随机彩票选择。\n\n![image](img/1o.jpg)创建一个名为“Lottery”的新程序，包含标准的\
    \ main 方法\n\n```java\nclass Lottery\n{\n    public static void main ( String[]\
    \ args ) { }\n}\n```\n\n![image](img/common.jpg)\n\nLottery.java\n\n![image](img/2o.jpg)在\
    \ main 方法中，创建一个包含 60 个元素的 `int` 数组，然后用整数 1-59 填充元素 1-59 \n\n```java\nint[] nums\
    \ = new int[60] ;\nfor( int i = 1 ; i < 60 ; i++ ) { nums[i] = i ; }\n```\n\n\
    ![image](img/3o.jpg)洗乱元素 1-59 中的值\n\n```java\nfor( int i = 1 ; i < 60 ; i++ )\n\
    {\n    int r = (int) Math.ceil( Math.random() * 59 ) ;\n    int temp = nums[i]\
    \ ;\n    nums[i] = nums[r] ;\n    nums[r] = temp;\n}\n```\n\n![image](img/4o.jpg)仅输出元素\
    \ 1-59\n\n```java\nfor ( int i = 1 ; i < 60 ; i++ ) {\n    System.out.print( nums[i]\
    \ + “ ” )\n}\n```\n\n![image](img/5o.jpg)将程序保存为 `Lottery.java`，然后编译并运行程序查看输出\n\
    \n"
- fmt: "\nThe `String` class within the `java.lang` package provides the useful `equals()`\
    \ method that was introduced [here](#chapter04.html_sec31) to evaluate a command\
    \ line argument in the `args[0]` element. This can also be used to compare any\
    \ two `String` values by tacking the method name onto the first `String` variable\
    \ using dot notation, and specifying the `String` to be compared as its argument.\
    \ For example, the syntax to compare `txt2` to `txt1` is `txt1.equals( txt2 )`.\
    \ When both `String` values have identical characters, in the same order, the\
    \ method returns `true` – otherwise, it returns `false`.\n\n![image](images/pg90_1.jpg)\n\
    \n`String` values that use different letter case, such as “Java” and “JAVA”, are\
    \ not considered equal because the ASCII code values of the characters differ.\
    \ For instance, the value of uppercase “A” is 65, whereas lowercase “a” is 97.\n\
    \nTo compare an input `String` value, where the letter case entered by the user\
    \ is uncertain, against a `String` value in the program it is often useful to\
    \ transform the input into a particular case. For this purpose, the `String` class\
    \ provides a `toUpperCase()` method and a `toLowerCase()` method. The input `String`\
    \ is specified as the argument, and the method returns the transformed `String`.\n\
    \nA typical example might force a user-input password `String` to lowercase before\
    \ comparing it to the correct password stored in all lowercase in a `String` variable\
    \ within the program. This would allow the user to enter their password in uppercase,\
    \ lowercase, or a mixture of both cases where case-insensitive passwords are permissible.\n\
    \nDot notation allows methods to be tacked onto other methods so their operations\
    \ can be performed in sequence. This means that `toLowerCase().equals()` can be\
    \ used to transform a `String` value to lowercase and then compare that lowercase\
    \ version against a specified argument.\n\n![image](images/snake.jpg)\n\nBe sure\
    \ to observe correct capitalization using a capital “C” in the `toUpperCase` and\
    \ `toLowerCase` methods.\n\n![image](images/1o.jpg)Start a new program named “StringComparison”\
    \ containing the standard main method\n\n```java\nclass StringComparison {\n \
    \   public static void main ( String[] args ) { }\n}\n```\n\n![image](images/common.jpg)\n\
    \nStringComparison.java\n\n![image](images/2o.jpg)Inside the main method, create\
    \ and initialize a `String` variable with a correct lowercase password\n\n```java\n\
    String password = “bingo” ;\n```\n\n![image](images/3o.jpg)Add a `try catch` statement\
    \ to catch the exception that occurs when no password argument is entered\n\n\
    ```java\ntry { }\ncatch( Exception e ) {\n    System.out.println( “Password required.”\
    \ ) ;\n}\n```\n\n![image](images/4o.jpg)Insert this `if else` statement into the\
    \ `try` statement block to evaluate the password argument entered by the user\n\
    \n```java\nif ( args[0].toLowerCase().equals( password ) ) {\n    System.out.println(\
    \ “Password accepted.” ) ;\n}\nelse {\n    System.out.println( “Incorrect password.”\
    \ ) ;\n}\n```\n\n![image](images/5o.jpg)Save the program as `StringComparison.java`\
    \ then compile and run the program with various arguments\n\n![image](images/pg91_1.jpg)\n\
    \n### Searching strings\n\nThe `String` class within the `java.lang` package provides\
    \ `startsWith()` and `endsWith()` methods to compare portions of a `String` value.\
    \ These are especially useful to compare a number of `String` values and select\
    \ those with common beginnings or common endings. When the `String` section matches\
    \ the specified argument, the method returns `true` – otherwise, it returns `false`.\n\
    \n![image](images/pg92_1.jpg)\n\nA portion of a `String` value can be copied by\
    \ stating the position number of the first character to be copied as the argument\
    \ to its `substring()` method. This will return a substring of the original `String`\
    \ value, starting at the specified start position and ending at the end of the\
    \ original `String`.\n\nOptionally, the `substring()` method can take a second\
    \ argument to specify the position number of the final character to be copied.\
    \ This will return a substring of the original `String` value, starting at the\
    \ specified start position and ending at the specified end position.\n\nA `String`\
    \ value can be searched to find a character or substring specified as the argument\
    \ to its `indexOf()` method. Unusually, this method returns the numeric position\
    \ of the first occurrence of the matched character or substring within the searched\
    \ `String` value. Where no match is found, the method returns the negative integer\
    \ value of -1.\n\n![image](images/1o.jpg)Start a new program named “StringSearch”\
    \ containing the standard main method\n\n```java\nclass StringSearch {\n    public\
    \ static void main ( String[] args ) { }\n}\n```\n\n![image](images/common.jpg)\n\
    \nStringSearch.java\n\n![image](images/2o.jpg)Inside the main method, create an\
    \ initialized `String` array of book titles\n\n```java\nString[] books = {\n \
    \   “Java in easy steps”, “XML in easy steps” ,\n    “SQL in easy steps”, ”CSS\
    \ in easy steps” ,\n    “Gone With the Wind”, “Drop the Defense” } ;\n```\n\n\
    ![image](images/3o.jpg)Create and initialize three `int` counter variables\n\n\
    ```java\nint counter1 = 0 , counter2 = 0 , counter3 = 0 ;\n```\n\n![image](images/4o.jpg)Add\
    \ a `for` loop to iterate through the `String` array, listing as output the first\
    \ four characters of each title\n\n```java\nfor ( int i = 0 ; i < books.length\
    \ ; i++ ) {\n    System.out.print( books[i].substring( 0,4 ) + “ | “ ) ;\n}\n\
    ```\n\n![image](images/5o.jpg)Insert a statement in the `for` loop block to count\
    \ the titles found with a specified ending\n\n```java\nif ( books[i].endsWith(\
    \ “in steps” ) ) counter1++;\n```\n\n![image](images/6o.jpg)Insert a statement\
    \ in the `for` loop block to count the titles found with a specified beginning\n\
    \n```java\nif ( books[i].startsWith( “Java” ) ) counter2++;\n```\n\n![image](images/7o.jpg)Insert\
    \ a statement in the `for` loop block to count the titles found not containing\
    \ a substring\n\n```java\nif ( books[i].indexOf( “easy” ) == -1 ) counter3++;\n\
    ```\n\n![image](images/8o.jpg)At the end of the main method, add these statements\
    \ to output the results of each search\n\n```java\nSystem.out.println( “\\nFound\
    \ “ + counter1 + “ titles from this series” ) ;\nSystem.out.println( “Found “\
    \ + counter2 + “ Java title” ) ;\nSystem.out.println( “Found “ + counter3 + “\
    \ other titles” ) ;\n```\n\n![image](images/9o.jpg)Save the program as `StringSearch.java`\
    \ then compile and run the program to see the output\n\n![image](images/pg93_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe `!` NOT operator cannot be used to test if\
    \ the `indexOf()` method has failed – because it returns an integer value, not\
    \ a Boolean value.\n\n### Manipulating characters\n\nThe `String` class within\
    \ the `java.lang` package provides the `trim()` method that is used to remove\
    \ any whitespace from the beginning and end of the `String` specified as its argument.\
    \ This method will remove all extreme spaces, newlines, and tabs, returning the\
    \ trimmed version of that `String`.\n\n![image](images/pg94_1.jpg)\n\nAn individual\
    \ character in a `String` can be addressed by stating its index position within\
    \ that `String` as the argument to its `charAt()` method. This method treats the\
    \ `String` as an array of characters where the first character is at position\
    \ zero – just like other arrays whose elements are indexed starting at zero. The\
    \ first character in a `String` can be addressed as `charAt(0)`, the second character\
    \ as `charAt(1)`, and so on.\n\nAs character indexing begins at zero, the final\
    \ character in a `String` will always have an index number that is one less than\
    \ the total number of characters in the `String`. This means that the final character\
    \ in any `String` has the index number equivalent to `length() - 1`. The final\
    \ character in a `String` named “str” can, therefore, be addressed as `str.charAt(\
    \ str.length() - 1 )`.\n"
  raw: 'The **String** class within the **java.lang** package provides the useful
    **equals()** method that was introduced [here](#chapter04.html_sec31) to evaluate
    a command line argument in the **args[0]** element. This can also be used to compare
    any two **String** values by tacking the method name onto the first **String**
    variable using dot notation, and specifying the **String** to be compared as its
    argument. For example, the syntax to compare **txt2** to **txt1** is **txt1.equals(
    txt2 )**. When both **String** values have identical characters, in the same order,
    the method returns **true** – otherwise, it returns **false**.


    ![image](images/pg90_1.jpg)


    **String** values that use different letter case, such as “Java” and “JAVA”, are
    not considered equal because the ASCII code values of the characters differ. For
    instance, the value of uppercase “A” is 65, whereas lowercase “a” is 97.


    To compare an input **String** value, where the letter case entered by the user
    is uncertain, against a **String** value in the program it is often useful to
    transform the input into a particular case. For this purpose, the **String** class
    provides a **toUpperCase()** method and a **toLowerCase()** method. The input
    **String** is specified as the argument, and the method returns the transformed
    **String**.


    A typical example might force a user-input password **String** to lowercase before
    comparing it to the correct password stored in all lowercase in a **String** variable
    within the program. This would allow the user to enter their password in uppercase,
    lowercase, or a mixture of both cases where case-insensitive passwords are permissible.


    Dot notation allows methods to be tacked onto other methods so their operations
    can be performed in sequence. This means that **toLowerCase().equals()** can be
    used to transform a **String** value to lowercase and then compare that lowercase
    version against a specified argument.


    ![image](images/snake.jpg)


    Be sure to observe correct capitalization using a capital “C” in the toUpperCase
    and toLowerCase methods.


    ![image](images/1o.jpg)Start a new program named “StringComparison” containing
    the standard main method


    **class StringComparison**


    **{**


    **public static void main ( String[] args ) {            }**


    **}**


    ![image](images/common.jpg)


    StringComparison.java


    ![image](images/2o.jpg)Inside the main method, create and initialize a **String**
    variable with a correct lowercase password


    **String password = “bingo” ;**


    ![image](images/3o.jpg)Add a **try catch** statement to catch the exception that
    occurs when no password argument is entered


    **try {      }**


    **catch( Exception e )**


    **{**


    **System.out.println( “Password required.” ) ;**


    **}**


    ![image](images/4o.jpg)Insert this **if else** statement into the **try** statement
    block to evaluate the password argument entered by the user


    **if ( args[0].toLowerCase().equals( password ) )**


    **{**


    **System.out.println( “Password accepted.” ) ;**


    **}**


    **else**


    **{**


    **System.out.println( “Incorrect password.” ) ;**


    **}**


    ![image](images/5o.jpg)Save the program as **StringComparison.java** then compile
    and run the program with various arguments


    ![image](images/pg91_1.jpg)


    **Searching strings**


    The **String** class within the **java.lang** package provides **startsWith()**
    and **endsWith()** methods to compare portions of a **String** value. These are
    especially useful to compare a number of **String** values and select those with
    common beginnings or common endings. When the **String** section matches the specified
    argument, the method returns **true** – otherwise, it returns **false**.


    ![image](images/pg92_1.jpg)


    A portion of a **String** value can be copied by stating the position number of
    the first character to be copied as the argument to its **substring()** method.
    This will return a substring of the original **String** value, starting at the
    specified start position and ending at the end of the original **String**.


    Optionally, the **substring()** method can take a second argument to specify the
    position number of the final character to be copied. This will return a substring
    of the original **String** value, starting at the specified start position and
    ending at the specified end position.


    A **String** value can be searched to find a character or substring specified
    as the argument to its **indexOf()** method. Unusually, this method returns the
    numeric position of the first occurrence of the matched character or substring
    within the searched **String** value. Where no match is found, the method returns
    the negative integer value of -1.


    ![image](images/1o.jpg)Start a new program named “StringSearch” containing the
    standard main method


    **class StringSearch**


    **{**


    **public static void main ( String[] args ) {           }**


    **}**


    ![image](images/common.jpg)


    StringSearch.java


    ![image](images/2o.jpg)Inside the main method, create an initialized **String**
    array of book titles


    **String[] books =**


    **{           “Java in easy steps”, “XML in easy steps” ,**


    **            “SQL in easy steps” , ”CSS in easy steps” ,**


    **            “Gone With the Wind” , “Drop the Defense” } ;**


    ![image](images/3o.jpg)Create and initialize three **int** counter variables


    **int counter1 = 0 , counter2 = 0 , counter3 = 0 ;**


    ![image](images/4o.jpg)Add a **for** loop to iterate through the **String** array,
    listing as output the first four characters of each title


    **for ( int i = 0 ; i < books.length ; i++ )**


    **{**


    **System.out.print( books[i].substring( 0,4 ) + “ | “ ) ;**


    **}**


    ![image](images/5o.jpg)Insert a statement in the **for** loop block to count the
    titles found with a specified ending


    **if ( books[i].endsWith( “in easy steps” ) ) counter1++ ;**


    ![image](images/6o.jpg)Insert a statement in the **for** loop block to count the
    titles found with a specified beginning


    **if ( books[i].startsWith( “Java” ) ) counter2++ ;**


    ![image](images/7o.jpg)Insert a statement in the **for** loop block to count the
    titles found not containing a specified substring


    **if ( books[i].indexOf( “easy” ) == -1 ) counter3++ ;**


    ![image](images/8o.jpg)At the end of the main method, add these statements to
    output the results of each search


    **System.out.println( “\nFound “ + counter1 + “ titles from this series” ) ;**


    **System.out.println( “Found “ + counter2 + “ Java title” ) ;**


    **System.out.println( “Found “ + counter3 + “ other titles” ) ;**


    ![image](images/9o.jpg)Save the program as **StringSearch.java** then compile
    and run the program to see the output


    ![image](images/pg93_1.jpg)


    ![image](images/forget.jpg)


    The **!** NOT operator cannot be used to test if the **indexOf()** method has
    failed – because it returns an integer value, not a Boolean value.


    **Manipulating characters**


    The **String** class within the **java.lang** package provides the **trim()**
    method that is used to remove any whitespace from the beginning and end of the
    **String** specified as its argument. This method will remove all extreme spaces,
    newlines, and tabs, returning the trimmed version of that **String**.


    ![image](images/pg94_1.jpg)


    An individual character in a **String** can be addressed by stating its index
    position within that **String** as the argument to its **charAt()** method. This
    method treats the **String** as an array of characters where the first character
    is at position zero – just like other arrays whose elements are indexed starting
    at zero. The first character in a **String** can be addressed as **charAt(0)**,
    the second character as **charAt(1)**, and so on.


    As character indexing begins at zero, the final character in a **String** will
    always have an index number that is one less than the total number of characters
    in the **String**. This means that the final character in any **String** has the
    index number equivalent to **length() - 1**. The final character in a **String**
    named “str” can, therefore, be addressed as **str.charAt( str.length() - 1 )**.'
