    **Summary**


    •The **implements** keyword can be used in a class declaration to add one or more
    **EventListener** interfaces.


    •A component’s **addActionListener()** method takes the **this** keyword as its
    argument – to make that component generate an **ActionEvent** event when it is
    activated.


    •The **ActionListener** interface passes a generated **ActionEvent** event as
    the argument to its **actionPerformed()** event-handler, which can respond to
    a push button click made by the user.


    •The **getSource()** method of an **ActionEvent** event can be used to identify
    the originating component that generated the event.


    •An **ItemListener** interface passes a generated **ItemEvent** event as the argument
    to its **itemStateChanged()** event-handler, which can respond to an item selection
    made by the user.


    •The **getItemSelectable()** method of an **ItemEvent** event can be used to identify
    the component that generated the event.


    •A **KeyListener** interface passes a generated **KeyEvent** event as the argument
    to three required event-handler methods, which can respond to a key press and
    reveal that key’s character.


    •A **MouseListener** interface passes a generated **MouseEvent** event as the
    argument to five required event-handler methods, which can respond to mouse actions
    made by the user.


    •A **MouseMotionListener** interface passes a generated **MouseEvent** event as
    the argument to two required event-handlers, which can respond to mouse movement.


    •The **showMessageDialog()** method of the **JOptionPane** class creates a dialog
    displaying a message to the user, and its **showInputDialog()** and **showConfirmationDialog()**
    methods can be used to request user input.


    •Audio resources can be represented by the **AudioClip** class of the **java.applet**
    package, and played using its **play()** method.


