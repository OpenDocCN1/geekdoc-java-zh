    **pnl.add( rad2 ) ;**


    **pnl.add( chk ) ;**


    **pnl.add( box ) ;**


    **pnl.add( txtArea ) ;**


    ![image](images/hot.jpg)


    Note how this example uses the **append()** method to add further text to the
    text area.


    ![image](images/6r.jpg)Insert statements to make selectable components generate
    an **ItemEvent** event when an item is selected or deselected


    **rad1.addItemListener( this ) ;**


    **rad2.addItemListener( this ) ;**


    **chk.addItemListener( this ) ;**


    **box.addItemListener( this ) ;**


    ![image](images/7r.jpg)After the constructor method, add an event-handler method
    for the **ItemListener** interface – identifying items selected by the **JRadioButton**
    components


    **public void itemStateChanged( ItemEvent event )**


    **{**


    **if ( event.getItemSelectable() == rad1 )**


    **txtArea.setText( “White wine selected” ) ;**


    **              if ( event.getItemSelectable() == rad2 )**


    **txtArea.setText( “Red wine selected” ) ;**


    **}**


    ![image](images/8r.jpg)Add an **if** statement to the event-handler method to
    indicate the status of the **JCheckBox** component


    **if ( ( event.getItemSelectable() == chk ) &&**


    **( event.getStateChange() == ItemEvent.SELECTED ) )**


    **txtArea.append( “\nPepperoni selected\n” ) ;**


    ![image](images/9r.jpg)Add an **if** statement to the event-handler method to
    indicate the status of the **JComboBox** component


    **if ( ( event.getItemSelectable() == box ) &&**


    **( event.getStateChange() == ItemEvent.SELECTED ) )**


    **txtArea.append( event.getItem().toString() + “ selected” ) ;**


    ![image](images/10r.jpg)Save the program as **States.java** then compile and run
