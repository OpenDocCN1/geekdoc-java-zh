    ## Adding item selectors


    The Swing `JCheckBox` class creates a checkbox component that can be added to
    a graphical interface. This can be used to allow the user to select or deselect
    individual items in a program.


    The `JCheckBox` object is created with the `new` keyword, and its constructor
    takes a `String` argument specifying text to be displayed alongside that checkbox.
    It can also take a second `true` argument to make the checkbox be selected by
    default.


    ![image](images/pg142_1.jpg)


    A choice of items can be offered by the `JComboBox` class that creates a drop-down
    list from which the user can select any single item. This object is created with
    the `new` keyword, and its constructor typically takes the name of a `String`
    array as its argument. Each element in the array provides an item for selection
    in the drop-down list. Similarly, a choice of items can be offered by the `JList`
    class that creates a fixed-size list from which the user can select one or more
    items. It is created with the `new` keyword, and its constructor also takes an
    array as its argument, with each element providing an item for selection. As both
    `JList` and `JComboBox` are “Collections” they must specify the generic type they
    may contain when they get created, such as `<String>`.


    ![image](images/1b.jpg)Edit a copy of `Window.java` from [here](#chapter08.html_pg135),
    changing the class name in the declaration, the constructor, and the instance
    statement from “Window” to “Items”


    ![image](images/common.jpg)


    Items.java


    ![image](images/2b.jpg)Before the `Items()` constructor, create a `String` array
    of items for selection


    ```

    String[] toppings = { “Pepperoni” , “Mushroom” , “Ham” , “Tomato” } ;

    ```


    ![image](images/3b.jpg)Next, create four `JCheckBox` objects to present each item
    for selection – one selected by default


    ```

    JCheckBox chk1 = new JCheckBox( toppings[0] ) ;

    JCheckBox chk2 = new JCheckBox( toppings[1] , true ) ;

    JCheckBox chk3 = new JCheckBox( toppings[2] ) ;

    JCheckBox chk4 = new JCheckBox( toppings[3] ) ;

    ```


    ![image](images/4b.jpg)Add a second `String` array of items for selection


    ```

    String[] styles = { “Deep Dish” , “Gourmet Style” , “Thin & Crispy” } ;

    ```


    ![image](images/5b.jpg)Create a `JComboBox` object to present each item in the
    second array for selection


    ```

    JComboBox<String> box1 = new JComboBox<String>( styles ) ;

    ```


    ![image](images/6b.jpg)Add a `JList` object to present each item in the first
    array for selection from a list


    ```

    JList<String> lst1 = new JList<String>( toppings ) ;

    ```


    ![image](images/7b.jpg)In the `Items()` constructor method, insert statements
    to add each `JCheckBox` component to the `JPanel` container


    ```

    pnl.add( chk1 ) ;

    pnl.add( chk2 ) ;

    pnl.add( chk3 ) ;

    pnl.add( chk4 ) ;

    ```


    ![image](images/8b.jpg)Insert statements to make a default selection and to add
    the `JComboBox` component to the `JPanel` container


    ```

    box1.setSelectedIndex( 0 ) ;

    pnl.add( box1 ) ;

    ```


    ![image](images/9b.jpg)Now, insert a statement to add the `JList` component to
    the `JPanel` container


    ```

    pnl.add( lst1 ) ;

    ```


    ![image](images/10b.jpg)Save the program as **Items.java** then compile and run
