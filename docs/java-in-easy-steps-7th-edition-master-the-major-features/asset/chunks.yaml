    **Exploring Java classes**


    Java has a vast library of pre-tested code packages, which are arranged in modules.
    Those providing functionality that is fundamental to the Java language itself
    are contained in the **java.lang** package, within the **java.base** module. These
    are automatically accessible to the Java API (Application Programming Interface).
    This means that the properties and methods provided by the **java.lang** package
    are readily available when creating programs. For example, the mathematic functionality
    provided by the **abs()** method of the **Math** class, which is part of the **java.lang**
    package, in the **java.base** module.


    ![image](images/pg80_1.jpg)


    Package contents are arranged in hierarchical order, allowing any item to be addressed
    using dot notation. For example, the **System** class contains an **out** property
    (field), which in turn contains a **println()** method – so can be addressed as
    **System.out.println()**.


    The Java documentation provides information about every item available, and can
    be used to explore the Java classes. It is available online via **[docs.oracle.com/en/java](http://docs.oracle.com/en/java)**
    and can be downloaded for offline reference. The documentation is understandably
    large, but familiarity with it is valuable. A good starting point is the API Overview
    page containing a list of every module, together with a brief description of each
    module:


    ![image](images/1o.jpg)Browse to **[docs.oracle.com/en/java](http://docs.oracle.com/en/java)**
    and click the link to **Java SE documentation**, then click **API Documentation**


    ![image](images/2o.jpg)See **All Modules** listed alphabetically – click the link
    for the **java.base** module (the foundational APIs of Java SE)


    ![image](images/pg80_2.jpg)


    ![image](images/hot.jpg)


    Modules were introduced to improve scalability and increase performance.


    ![image](images/3o.jpg)See the module’s **Packages** listed alphabetically in
    each section – scroll down the page to the “Exports” section and click the link
    for the **java.lang** package


    ![image](images/pg81_1.jpg)


    ![image](images/hot.jpg)


    You can also use the Search box to find information on any item.


    ![image](images/4o.jpg)See the package’s **Classes** listed alphabetically in
    each section – scroll down the page to the “Class Summary” section and click the
    link for the **Math** class


    ![image](images/pg81_2.jpg)


    ![image](images/5o.jpg)See the class’s **Methods** listed alphabetically in the
    “Method Summary” section – to discover the purpose and syntax of any method simply
    click on its link


    ![image](images/pg81_3.jpg)


    ![image](images/hot.jpg)


    Examine the information available via other items on the page menu to become more
    familiar with the documentation.


    **Doing mathematics**


    The **Math** class within the **java.lang** package provides two constant values
    that are often useful to perform mathematical calculations. **Math.PI** stores
    the value of Pi, and **Math.E** stores the value that is the base of natural logarithms.
    Both these constant values are stored as **double** precision data types with
    15 decimal places.


    ![image](images/pg82_1.jpg)


    ![image](images/1o.jpg)Start a new program named “Pi” containing the standard
    main method


    **class Pi**


    **{**


    **public static void main ( String[] args ) {         }**


    **}**


    ![image](images/common.jpg)


    Pi.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize a **float**
    variable from a command line argument, and cast the **double Math.PI** constant
    into a second **float** variable


    **float radius = Float.parseFloat( args[0] ) ;**


    **float shortPi = (float) Math.PI ;**


    ![image](images/3o.jpg)Perform mathematical calculations using the cast value,
    assigning the results to more **float** variables


    **float circ = shortPi * ( radius + radius ) ;**


    **float area = shortPi * ( radius * radius ) ;**


    ![image](images/4o.jpg)Output the value of **Math.PI** and its cast **float**
    equivalent, followed by the results of the calculations


    **System.out.print( “With Pi commuted from “ + Math.PI ) ;**


    **System.out.println( “ to “ + shortPi + “...” ) ;**


    **System.out.println( “A circle of radius “ + radius + “ cm” ) ;**


    **System.out.printIn( “has a circumference of “ + circ + “ cm” ) ;**


    **System.out.println( “ and an area of “ + area + “ sq.cm” ) ;**


    ![image](images/5o.jpg)Save the program as **Pi.java** then compile and run the
    program to see the output


    ![image](images/pg82_2.jpg)


    ![image](images/hot.jpg)


    The commuted value of Pi usually provides sufficient precision.


    The **Math** class within the **java.lang** package provides many methods that
    are useful to perform mathematical calculations. Using **Math.pow()**, a given
    number can be raised to a specified power. The parentheses require the number
    as its first argument and the power by which it is to be raised as its second
    argument. The **Math.sqrt()** method returns the square root of the number specified
    as its sole argument. Both methods return a **double** type.


    ![image](images/1o.jpg)Start a new program named “Power” containing the standard
    main method


    **class Power**


    **{**


    **public static void main ( String[] args ) {       }**


    **}**


    ![image](images/common.jpg)


    Power.java


    ![image](images/2o.jpg)Inside the main method, declare and initialize an **int**
    variable from a passed command line argument


    **int num = Integer.parseInt( args[0] ) ;**


    ![image](images/3o.jpg)Perform mathematical calculations, casting the results
    into more **int** variables


    **int square = (int) Math.pow( num , 2 ) ;**


    **int cube = (int) Math.pow( num , 3 ) ;**


    **int sqrt = (int) Math.sqrt( num ) ;**


    ![image](images/4o.jpg)Output the results of the calculations


    **System.out.println( num + ” squared is “ + square ) ;**


    **System.out.println( num + ” cubed is “ + cube ) ;**


    **System.out.println( “Square root of “ + num + ” is “+ sqrt ) ;**


    ![image](images/5o.jpg)Save the program as **Power.java** then compile and run
    the program to see the output


    ![image](images/pg83_1.jpg)


    ![image](images/forget.jpg)


    Both these examples could be improved by adding **try catch** statement blocks
    to anticipate user errors – see [here](#chapter04.html_sec36) for details.


    **Rounding numbers**


    The **Math** class within the **java.lang** package provides three methods to
    round floating-point numbers to the nearest integer. Simplest of these is the
    **Math.round()** method that rounds a number stated as its argument up, or down,
    to the closest integer.


    ![image](images/pg84_1.jpg)


    The **Math.floor()** method rounds down to the closest integer below, and **Math.ceil()**
    rounds up to the closest integer above.


    While the **Math.round()** method returns an **int** data type, both **Math.floor()**
    and **Math.ceil()** methods return a **double** data type.


