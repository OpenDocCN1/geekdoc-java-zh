    \n### Lotto.java\n![image](images/hot.jpg)\n\nThe algorithm in this event-handler\
    \ shuffles integers 1-59 in an array, then assigns those integers in the first\
    \ six elements to a string.\n\nThe Lotto program begins with import statements\
    \ to make Swing components and the `ActionListener` interface available.\n\n![image](images/pg169_1.jpg)\n\
    \n### Components\nThe program comprises a single panel component containing a\
    \ label component to display an image, a text field component to display output,\
    \ and a button component for user interaction.\n\n### Constructor\nThe `Lotto()`\
    \ ` constructor builds a simple Swing interface that loads the panel into a window\
    \ frame measuring 260 x 210.\n\n![image](images/pg169_2.jpg)\n\n`Lotto.png` –\
    \ Checkered areas are transparent.\n\n### Event-handler\nThe button’s event-handler\
    \ method executes an algorithm to select a sequence of six unique random numbers\
    \ in the range of 1-59 for display in the text field component.\n\n### Entry-point\n\
    The `main()` method creates an instance of the app, and calls upon `ClassLoader()`\
    \ to seek the image file resource `Lotto.png` in the same directory as the program\
    \ file. The files must be arranged in this way before attempting to compile the\
    \ program.\n\n![image](images/pg169_3.jpg)\n\n![image](images/hot.jpg)\n\nThe\
    \ Lotto program is used throughout this chapter to create apps for desktop and\
    \ handheld devices.\n\nObserving the required file arrangement, the `javac` compiler\
    \ can be employed in the usual way to create a `Lotto.class` file, then the `java`\
    \ interpreter can be employed to execute the program:\n\n![image](images/pg169_4.jpg)\n\
    \n![image](images/pg169_5.jpg)\n\n### Distributing programs\nThe Lotto program\
    \ opens a new window of the specified size containing the Swing interface components.\
    \ Each time the user clicks the push button, its event-handler displays six new\
    \ random numbers in the range of 1-59 within the text field component:\n\n![image](images/pg170_1.jpg)\n\
    \n![image](images/pg170_2.jpg)\n\nAs with other examples in this book, the Lotto\
    \ program has been compiled here for Java and can be distributed for execution\
    \ on other computers where an appropriate Java Runtime Environment (JRE) is present\
    \ – regardless of their operating system. For example, in the screenshots below,\
    \ `Lotto.class` and `Lotto.png` files have been copied to the desktop of a computer\
    \ running the Linux operating system with the Java runtime installed. The Lotto\
    \ program can, therefore, be executed by the `java` interpreter in the same way\
    \ as on the originating Windows system.\n\n![image](images/pg170_3.jpg)\n\n![image](images/pg170_4.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe `.java` source code file need not be included\
    \ when distributing a program – only `.class` and resource files are needed.\n\
    \nThere is, however, a danger in distributing a program – the `jar` utility provides\
    \ a way to package multiple files into a single archive. The `jar` utility creates\
    \ a ZIP archive, which is a compressed format for storing files.\n\n![image](images/pg169_1.jpg)\n\
    \nThe `jar` utility is part of the Java Development Kit (JDK) and is used to create,\
    \ extract, and manage Java archive files.\n\n### Common jar commands\n\n| Command\
    \ | Description |\n| :--- | :--- |\n| `jar cf archive.jar file1 file2` | Create\
    \ a new archive |\n| `jar xf archive.jar` | Extract all files from an archive\
    \ |\n| `jar tf archive.jar` | List the contents of an archive |\n| `jar u archive.jar\
    \ file1` | Update an existing archive with new files |\n| `jar d archive.jar file1`\
    \ | Delete a file from an archive |\n| `jar cvf archive.jar file1` | Create an\
    \ archive with verbose output |\n| `jar xvf archive.jar` | Extract files with\
    \ verbose output |\n| `jar ttf archive.jar` | List contents with verbose output\
    \ |\n| `jar ju archive.jar file1` | Update archive with verbose output |\n| `jar\
    \ jd archive.jar file1` | Delete file with verbose output |\n| `jar cmf archive.jar\
    \ manifest.txt` | Create an archive with its own manifest file |\n| `jar xfm archive.jar`\
    \ | Extract files using the manifest file |\n| `jar tfm archive.jar` | List contents\
    \ using the manifest file |\n| `jarjum archive.jar file1` | Update archive using\
    \ manifest file |\n| `jar jdm archive.jar file1` | Delete file using manifest\
    \ file |\n\nThe `jar` utility is essential for packaging Java applications, especially\
    \ those that require multiple classes and resources.\n\n### Building archives\n\
    Follow these steps to create a JAR for the Lotto program:\n\n![image](images/1g.jpg)\n\
    \nOpen a command-line window, then navigate to the directory where the Lotto files\
    \ are located – `Lotto.class` and `Lotto.png`.\n\n![image](images/pg172_1.jpg)\n\
    \nLotto.jar\n\n![image](images/2g.jpg)\n\nEnter `jar cfe Lotto.jar Lotto.class\
    \ Lotto.png`, then hit the **Enter** key to create a `Lotto.jar` archive.\n\n\
    - `c`: Create a new archive.\n- `f`: Specify the filename of the archive.\n- `e`:\
    \ Specify the entry-point (the main class) for the application.\n\n![image](images/3g.jpg)\n\
    \nNext, enter `jar tf Lotto.jar` to see all contents of the JAR.\n\n![image](images/pg172_2.jpg)\n\
    \nNotice that the `jar` tool automatically creates a `META-INF` directory alongside\
    \ the archived files. This contains a text-based manifest file named `MANIFEST.MF`\
    \ that you can examine:\n\n![image](images/4g.jpg)\n\nNow, enter `jar xf Lotto.jar\
    \ META-INF` to extract a copy of the `META-INF` directory.\n\n![image](images/5g.jpg)\n\
    \nFinally, enter `type META-INF\\MANIFEST.MF` (Windows) or `cat META-INF/MANIFEST.MF`\
    \ (Linux/macOS) to see the text contained within the archive manifest.\n\nThe\
    \ output should look like this:\n\n```\nManifest-Version: 1.0\nMain-Class: Lotto\n\
    ```\n\nThe `Main-Class` attribute specifies the executable.\n\n### Deploying applications\n\
    Java JAR files are executable on any system on which the appropriate version of\
    \ the Java Runtime is installed:\n\n![image](images/1g.jpg)\n\nAt the command\
    \ line, navigate to the directory where the `Lotto.jar` file is located, then\
    \ type `java -jar Lotto.jar` and hit the **Enter** key to run the Lotto application.\n\
    \n![image](images/pg173_1.jpg)\n\n![image](images/pg173_2.jpg)\n\n![image](images/pg173_3.jpg)\n\
    \n![image](images/pg173_4.jpg)\n\n![image](images/pg173_5.jpg)\n\n![image](images/2g.jpg)\n\
    \nAlternatively, double-click or right-click the `Lotto.jar` file icon, and choose\
    \ to “Open With” the Java Runtime.\n"
