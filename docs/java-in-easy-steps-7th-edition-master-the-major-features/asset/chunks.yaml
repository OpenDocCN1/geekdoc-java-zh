    returns a **String** value, not **void**.


    **Understanding program scope**


    A variable that is declared inside a method is only accessible from inside that
    method – its “scope” of accessibility is only local to the method in which it
    is declared. This means that a variable of the same name can be declared in another
    method without conflict.'
