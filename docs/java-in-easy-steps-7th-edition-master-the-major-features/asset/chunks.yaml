    The Java shell is also known as a “REPL” – an acronym for Read, Evaluate, Print,
    Loop that describes this type of interactive tool.


    ![image](images/hot.jpg)


    Notice that `false && false` returns `false`, not `true` – demonstrating the maxim
    that “two wrongs don’t make a right”.


    ![image](images/forget.jpg)


    The value returned by the `!` NOT logical operator is the inverse of the stored
    value – the stored value itself remains unchanged.


    ### Examining conditions


    Possibly the all-time favorite operator of the Java programmer is the `? :` conditional
    operator that makes a powerful statement very concisely. Its unusual syntax can
    seem tricky to understand at first, but it is well worth getting to know this
    useful operator.


    ![image](images/pg34_1.jpg)


    The conditional operator first evaluates an expression for a `true` or `false`
    value, then returns one of two given operands depending on the result of the evaluation.
    Its syntax looks like this:


    ```

    ( boolean-expression ) ? if-true-return-this : if-false-return-this ;

    ```


    Each specified operand alternative allows the program to progress according to
    the Boolean value returned by the tested expression. For instance, the alternatives
    might return a `String` value:


    ```java

    status = ( quit == true ) ? “Done!” : “Continuing...” ;

    ```


    In this case, when the `quit` variable is `true` the conditional operator assigns
    the value of its first operand to the `status` variable; otherwise, it assigns
    its second operand value instead.


    A shorthand available when coding Java programs allows expressions to optionally
    omit `== true` when evaluating a simple Boolean value, so the example above can
    be written simply as:


    ```java

    status = ( quit ) ? “Done!” : “Continuing...” ;

    ```


    The conditional operator can return values of any data type and employ any valid
    test expression. For instance, the expression might use the greater than `>` operator
    to evaluate two numeric values then return a Boolean value depending on the result:


    ```java

    busted = ( speed > speedLimit ) ? true : false ;

    ```


    Similarly, the conditional operator might employ the inequality `!=` operator
    to evaluate a `String` value then return a numeric value depending on the result:


    ```java

    bodyTemperature = ( scale != “Celsius” ) ? 98.6 : 37.0 ;

    ```


    ![image](images/hot.jpg)


    The conditional operator is also known as the “ternary” operator.


    Follow these steps to explore the Java conditional operator in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type `jshell` and
    hit the `Enter` key to launch the Java shell


    ![image](images/2r.jpg)Next, enter statements to initialize two `int` variables


    ```java

    int num1 = 1357 ; int num2 = 2468 ;

    ```


    ![image](images/3r.jpg)Declare a further variable to store a test result `String`


    ```java

    String result ;

    ```


    ![image](images/4r.jpg)Enter this statement to determine whether the first integer
    value is an odd or even number


    ```java

    result = ( num1 % 2 != 0 ) ? “Odd” : “Even” ;

    ```


    ![image](images/pg35_1.jpg)


    ![image](images/5r.jpg)Now, enter this statement to determine whether the second
    integer value is an odd or even number


    ```java

    result = ( num2 % 2 != 0 ) ? “Odd” : “Even” ;

    ```


    ![image](images/pg35_2.jpg)


    ![image](images/hot.jpg)


    You can also start the Java shell with the command `jshell --feedback verbose`
    to receive descriptive output after each evaluation.


    ![image](images/hot.jpg)


    Notice that an uninitialized `String` variable returns a special `null` value
    – indicating that it contains nothing whatsoever.


    ![image](images/forget.jpg)


    Here, the expression evaluates as true when there is any remainder.


    ### Setting precedence


    Complex expressions, which contain multiple operators and operands, can be ambiguous
    unless the order in which the operations should be executed is clear. This lack
    of clarity can easily cause different results to be implied by the same expression.
    For example, consider this complex expression:


    ```java

    num = 8 + 4 * 2 ;

    ```


    ![image](images/pg36_1.jpg)


    Working left to right: `8 + 4 = 12`, and `12 * 2 = 24`, so `num = 24`. But working
    right to left: `2 * 4 = 8`, and `8 + 8 = 16`, so `num = 16`.


    The Java programmer can explicitly specify which operation should be executed
    first by adding parentheses to signify which operator has precedence. In this
    case, `(8 + 4) * 2` ensures the addition is performed before the multiplication
    – so the result is 24, not 16. Conversely, `8 + (4 * 2)` performs the multiplication
    first – so the result is 16, not 24.


    Where parentheses do not specify operator precedence Java follows the default
    order listed below:


    | Operator | Description |

    | :--- | :--- |

    | `++` `--` `!` | Increment, Decrement, Logical NOT |

    | `*` `/` `%` | Multiplication, Division, Modulus |

    | `+` `-` | Addition, Subtraction |

    | `>` `>=` `< `<=` | Greater than, Greater or equal to Less than, Less or equal
    to |

    | `==` `!=` | Equality, Inequality |

    | `&&` | Logical AND |

    | `\|\|` | Logical OR |

    | `? :` | Conditional |

    | `=` `+=` `-=` `*=` `/=` `%=` | Assignment |


    Operators of equal precedence are handled in the order they appear in the expression
    – from left to right. Where expressions have multiple nested parentheses, the
    innermost takes precedence.


    How it works – Step 2...


    `16 x 2 = 32, + 24 = 56`


    Step 3...


    `24 + 16 = 40, x 2 = 80`


    Step 4...


    `32 - 24 = 8, x 2 = 16`


    This chapter has so far used the Java shell **jshell** to explore the various
    Java operators by evaluating code snippets. Ensuing examples will use the Java
    compiler **javac** and Java runtime **java** to create and execute programs. You
    can quit the Java shell to return to a regular prompt with the command `/exit`.

