- fmt: "\nThe `java.time.format` package has a `DateTimeFormatter` class that can\
    \ be used to format `java.time` dates and time objects. A `DateTimeFormatter`\
    \ object contains a formatter pattern that is specified as a string argument to\
    \ its `ofPattern()` method. The formatter comprises letters, defined in the Java\
    \ documentation, and your choice of separators. For example, `“M/d/y”` specifies\
    \ the month, day, and year, separated by slashes. The format is applied by specifying\
    \ the formatter as the argument to the `format()` method of a `java.time` date\
    \ and time object.\n\n![image](images/hot.jpg)\n\nThe `java.time.format` package\
    \ was introduced in Java 8 to make it easier to specify date format patterns.\n\
    \n![image](images/1v.jpg)Start a new program that imports the functionality of\
    \ all methods of the `NumberFormat` class in the `java.text` package and all methods\
    \ of the `DateTimeFormatter` class in the `java.time.format` package.\n\n```java\n\
    import java.text.NumberFormat ;\nimport java.time.format.DateTimeFormatter ;\n\
    ```\n\n![image](images/common.jpg)\n\nFormats.java\n\n![image](images/2v.jpg)Add\
    \ a class named “Formats” containing the standard main method.\n\n```java\nclass\
    \ Formats\n{\n    public static void main ( String [] args )\n    {\n    }\n}\n\
    ```\n\n![image](images/3v.jpg)Between the curly brackets of the main method, insert\
    \ statements to output a number with group separators.\n\n```java\nNumberFormat\
    \ nf = NumberFormat.getNumberInstance() ;\nSystem.out.println( “\\nNumber: “ +\
    \ nf.format(123456789) ) ;\n```\n\n![image](images/4v.jpg)Add statements to output\
    \ a number with a currency sign.\n\n```java\nNumberFormat cf = NumberFormat.getCurrencyInstance()\
    \ ;\nSystem.out.println( “\\nCurrency: “ + cf.format(1234.50f) ) ;\n```\n\n![image](images/5v.jpg)Add\
    \ statements to output a number with a percent sign.\n\n```java\nNumberFormat\
    \ pf = NumberFormat.getPercentInstance() ;\nSystem.out.println( “\\nPercent: “\
    \ + pf.format( 0.75f ) ) ;\n```\n\n![image](images/6v.jpg)Add a statement creating\
    \ a current `LocalDateTime` object.\n\n```java\njava.time.LocalDateTime now =\
    \ java.time.LocalDateTime.now() ;\n```\n\n![image](images/7v.jpg)Add statements\
    \ to output a formatted numerical date.\n\n```java\nDateTimeFormatter df = DateTimeFormatter.ofPattern(\
    \ “MMM d, yyy” ) ;\nSystem.out.println( “\\nDate: “ + now.format( df ) ) ;\n```\n\
    \n![image](images/8v.jpg)Add statements to output a formatted numerical time.\n\
    \n```java\nDateTimeFormatter tf = DateTimeFormatter.ofPattern( “h:m a” ) ;\nSystem.out.println(\
    \ “\\nTime: “ + now.format( tf ) ) ;\n```\n\n![image](images/9v.jpg)Save the program\
    \ as `Formats.java` then compile and run the program to see the formatted output.\n\
    \n![image](images/pg131_1.jpg)\n\n![image](images/hot.jpg)\n\nA statement can\
    \ address a class that has not been imported by using its full package address\
    \ – as seen here in the statement creating a `LocalDateTime` object.\n\n![image](images/snake.jpg)\n\
    \nPattern letters are case sensitive – refer to the documentation to discover\
    \ the full details of possible patterns.\n\n## Summary\n\n- One or more `import`\
    \ statements can be included at the start of a program to make the functionality\
    \ of other classes available.\n- An `import` statement can import all classes\
    \ in a package with a wildcard character, or individual classes by name.\n- The\
    \ `java.io` package has classes that are designed to handle input and output procedures.\n\
    - A `File` object can be used to access files and directories.\n- The `InputStreamReader`\
    \ object decodes input bytes into characters, and the `BufferedReader` reads its\
    \ decoded characters.\n- A `FileReader` object can be used to decode text file\
    \ bytes into characters for reading by a `BufferedReader` object.\n- A `FileWriter`\
    \ object and `BufferedWriter` object can create and update text files.\n- The\
    \ `java.util` package contains utilities for handling collections of data, such\
    \ as array manipulation with its `Arrays` class.\n- The `java.util` package also\
    \ contains an `ArrayList` class that has methods to easily manipulate sequenced\
    \ list items.\n- An `ArrayList` object is a Collection that must specify the generic\
    \ type of item that list may contain, such as `<String>`.\n- A lambda expression\
    \ is an anonymous method that can be specified where it is to be executed.\n-\
    \ The `java.time` package contains a `LocalDateTime` class that provides fields\
    \ for date and time components.\n- The `java.text` package contains a `NumberFormat`\
    \ class that can format numbers and currency.\n- The `java.time.format` package\
    \ contains a `DateTimeFormatter` class that can specify patterns to format dates\
    \ and times.\n\n## Building interfaces\n\nThis chapter demonstrates how to use\
    \ Java Swing components to create a graphical program interface.\n\n- [Creating\
    \ a window](#chapter08.html_sec65)\n- [Adding push buttons](#chapter08.html_sec66)\n\
    - [Adding labels](#chapter08.html_sec67)\n- [Adding text fields](#chapter08.html_sec68)\n\
    - [Adding item selectors](#chapter08.html_sec69)\n- [Adding radio buttons](#chapter08.html_sec70)\n\
    - [Arranging components](#chapter08.html_sec71)\n- [Changing appearance](#chapter08.html_sec72)\n\
    - [Summary](#chapter08.html_sec73)\n\n### Creating a window\n\nPrograms can provide\
    \ a graphical user interface (GUI) using Swing components. The `javax.swing` package\
    \ contains classes to create a variety of components using the native operating\
    \ system.\n\nA class must be created to represent the GUI by declaring it a subclass\
    \ of `JFrame` using the `extends` keyword. The class constructor should include\
    \ statements to set these requirements:\n\n- The title of the window – specified\
    \ as a `String` argument to the inherited `super()` method of the `JFrame` class.\n\
    - The size of the window – specified as width and height in pixels as arguments\
    \ to its `setSize()` method.\n- What to do when the user closes the window – specified\
    \ as a constant argument to its `setDefaultCloseOperation()` method.\n- Display\
    \ the window – specified as a `Boolean` argument to its `setVisible()` method.\n\
    \n![image](images/snake.jpg)\n\nRemember the letter `x` in `javax.swing` by thinking\
    \ of `JAVA` extra.\n\nAdditionally, the constructor can add a `JPanel` container\
    \ component to the window, in which smaller components can be added, using the\
    \ inherited `add()` method of the `JFrame` class.\n\nBy default, a `JPanel` container\
    \ employs a `FlowLayout` layout manager that lays out components in left-to-right\
    \ lines, wrapping at the right edge of the window.\n\nThe steps opposite describe\
    \ how to create a basic window containing a `JPanel` with a `FlowLayout` layout\
    \ manager. This window is featured in subsequent examples in this book that demonstrate\
    \ how to add various components to the `JPanel` container.\n\n![image](images/hot.jpg)\n\
    \nLayout managers are described in more detail [here](#chapter08.html_sec72).\n\
    \n![image](images/1b.jpg)Start a new program that imports all Swing components.\n\
    \n```java\nimport javax.swing.*;\n```\n\nWindow.java\n\n![image](images/2b.jpg)Create\
    \ a subclass of the `JFrame` class named “Window” containing the standard main\
    \ method.\n\n```java\nclass Window extends JFrame\n{\n    public static void main\
    \ ( String[] args) {\n    }\n}\n```\n\n![image](images/3b.jpg)Before the main\
    \ method, create a `JPanel` container object.\n\n```java\nJPanel pnl = new JPanel()\
    \ ;\n```\n\n![image](images/4b.jpg)Next, insert this constructor method to specify\
    \ window requirements and to add the `JPanel` object to the `JFrame`.\n\n```java\n\
    public Window()\n{\n    super( “Swing Window” ) ;\n    setSize( 500 , 200 ) ;\n\
    \    setDefaultCloseOperation( EXIT_ON_CLOSE ) ;\n}\n```\n"
