    Java contains a package named **java.util** that provides useful utilities for
    handling collections of data. The package can be made available to a program by
    including an **import** statement at the very beginning of the **.java** file.
    This can use the * wildcard character to mean “all classes” in the statement **import
    java.util.* ;** .


    ![image](images/pg124_1.jpg)


    The **java.util** package has a class named “Arrays” that has methods that can
    be used to manipulate arrays. Its functionality can be made available to the program
    by importing all classes from the **java.util** package or, where the program
    only requires a single class, the **import** statement can import just that specific
    class. For example, the program can import the **Arrays** class with the statement
    **import java.util.Arrays ; .**


    The **Arrays** class has a **sort()** method that can rearrange the contents of
    array elements alphabetically and numerically.


    ![image](images/1v.jpg)Start a new program that imports the functionality of all
