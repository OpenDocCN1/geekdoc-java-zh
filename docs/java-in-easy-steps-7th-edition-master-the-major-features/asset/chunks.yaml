  trans: "\n\n```java\npublic class Lotto extends JFrame implements ActionListener\
    \ {\n    ClassLoader ldr = this.getClass( ).getClassLoader( ) ;\n    java.net.URL\
    \ iconURL = ldr.getResource( “Lotto.png” ) ;\n    ImageIcon icon = new ImageIcon(\
    \ iconURL ) ;\n    JLabel img = new JLabel( icon ) ;\n    JTextField txt = new\
    \ JTextField( “” , 18 ) ;\n    JButton btn = new JButton( “Get My Lucky Numbers”\
    \ ) ;\n    JPanel pnl = new JPanel( ) ;\n\n    // Constructor\n    public Lotto(\
    \ ) {\n        super( “Lotto App” ) ; setSize( 260 , 210 ) ;\n        setDefaultCloseOperation(\
    \ JFrame.EXIT_ON_CLOSE ) ;\n        pnl.add( img ) ; pnl.add( txt ) ; pnl.add(\
    \ btn ) ;\n        btn.addActionListener( this ) ; add( pnl ) ; setVisible( true\
    \ ) ;\n    }\n\n    // Event-handler\n    public void actionPerformed( ActionEvent\
    \ event ) {\n        if ( event.getSource( ) == btn ) {\n            int[ ] nums\
    \ = new int[ 60 ] ; String str = “” ;\n            for ( int i = 1 ; i < 60 ;\
    \ i++ ) { nums[ i ] = i ; }\n            for ( int i = 1 ; i < 60 ; i++ ) {\n\
    \                int r= ( int ) ( 59 * Math.random( ) ) + 1 ;\n              \
    \  int t= nums[ i ] ; nums[ i ]= nums[ r ] ; nums[ r ]= t ;\n            }\n \
    \           for ( int i = 1 ; i < 7 ; i++ ) {\n                str += “ ” + Integer.toString(\
    \ nums[ i ] ) + “ ” ;\n            }\n            txt.setText( str ) ;\n     \
    \   }\n    }\n\n    // Entry-point\n    public static void main ( String[ ] args\
    \ ) {\n        Lotto lotto = new Lotto( ) ;\n    }\n}\n```\n\n![image](img/common.jpg)\n\
    \n### Lotto.java\n![image](img/hot.jpg)\n\n该事件处理器中的算法在数组中打乱 1-59 的整数，然后将这些整数的前六个元素赋值给字符串。\n\
    \nLotto 程序以 import 语句开头，以使 Swing 组件和 `ActionListener` 接口可用。\n\n![image](img/pg169_1.jpg)\n\
    \n### 组件\n该程序包含一个单一面板组件，其中包含一个显示图像的标签组件、一个显示输出的文本字段组件和一个用于用户交互的按钮组件。\n\n### 构造函数\n\
    `Lotto()` 构造函数构建了一个简单的 Swing 界面，将面板加载到尺寸为 260 x 210 的窗口框架中。\n\n![image](img/pg169_2.jpg)\n\
    \n`Lotto.png` – 格子区域是透明的。\n\n### 事件处理器\n按钮的事件处理器方法执行一种算法，在 1-59 范围内选择六个唯一的随机数，并显示在文本字段组件中。\n\
    \n### 入口点\n`main()` 方法创建应用的实例，并调用 `ClassLoader()` 在程序文件相同的目录下查找图像文件资源 `Lotto.png`。在尝试编译程序之前，必须按照这种方式安排文件。\n\
    \n![image](img/pg169_3.jpg)\n\n![image](img/hot.jpg)\n\nLotto 程序在本章中被用于为桌面和手持设备创建应用。\n\
    \n观察所需的文件安排，可以使用通常方式使用 `javac` 编译器创建 `Lotto.class` 文件，然后可以使用 `java` 解释器执行程序：\n\
    \n![image](img/pg169_4.jpg)\n\n![image](img/pg169_5.jpg)\n\n### 分发程序\nLotto 程序会打开一个指定大小的新窗口，其中包含\
    \ Swing 界面组件。用户每点击一次推按钮，其事件处理器就会文本字段组件中显示 1-59 范围内的六个新随机数：\n\n![image](img/pg170_1.jpg)\n\
    \n![image](img/pg170_2.jpg)\n\n与书中的其他示例一样，Lotto 程序在此处为 Java 编译，并可以分发到带有适当 Java\
    \ 运行时环境 (JRE) 的其他计算机上执行——无论其操作系统是什么。例如，在下方的图中，`Lotto.class` 和 `Lotto.png` 文件已复制到运行\
    \ Linux 操作系统且安装了 Java 运行时的计算机桌面上。因此，Lotto 程序可以用与原始 Windows 系统相同的方式通过 `java` 解释器执行。\n\
    \n![image](img/pg170_3.jpg)\n\n![image](img/pg170_4.jpg)\n\n![image](img/hot.jpg)\n\
    \n分发程序时不需要包含 `.java` 源代码文件——只需要 `.class` 和资源文件。\n\n然而，分发程序存在一种危险——`jar` 工具提供将多个文件打包到单个归档的方法。`jar`\
    \ 工具创建一个 ZIP 归档，这是一种文件的压缩格式。\n\n![image](img/pg169_1.jpg)\n\n`jar` 工具是 Java 开发工具包\
    \ (JDK) 的，用于创建、提取和管理 Java 存档文件。\n\n### 常用 jar 命令\n\n| 命令 | 说明 |\n| :--- | :---\
    \ |\n| `jar cf archive.jar file1 file2` | 创建新归档 |\n| `jar xf archive.jar` | 从归档中提取所有文件\
    \ |\n| `jar tf archive.jar` | 列出归档内容 |\n| `jar u archive.jar file1` | 用新文件更新现有归档\
    \ |\n| `jar d archive.jar file1` | 从归档中删除文件 |\n| `jar cvf archive.jar file1` |\
    \ 创建带有详细输出的归档 |\n| `jar xvf archive.jar` | 带详细输出提取文件 |\n| `jar ttf archive.jar`\
    \ | 带详细输出列出内容 |\n| `jar ju archive.jar file1` | 带详细输出更新归档 |\n| `jar jd archive.jar\
    \ file1` | 带详细输出删除文件 |\n| `jar cmf archive.jar manifest.txt` | 创建带有自身清单文件的归档 |\n\
    | `jar xfm archive.jar` | 使用清单文件提取文件 |\n| `jar tfm archive.jar` | 使用清单文件列出内容 |\n\
    | `jarjum archive.jar file1` | 使用清单文件更新归档 |\n| `jar jdm archive.jar file1` | 使用清单文件删除文件\
    \ |\n\n`jar` 工具对于打包 Java 程序，特别是那些需要多个类的程序。\n\n### 构建归档\n按照以下步骤为 Lotto 程序创建 JAR：\n\
    \n![image](img/1g.jpg)\n\n打开命令行窗口，然后导航到 Lotto 文件所在的目录——`Lotto.class` 和 `Lotto.png`。\n\
    \n![image](img/pg172_1.jpg)\n\nLotto.jar\n\n![image](img/2g.jpg)\n\n输入 `jar cfe\
    \ Lotto.jar Lotto.class Lotto.png`，然后按回键创建 `Lotto.jar` 归档。\n\n- `c`: 创建归档。\n-\
    \ `f`: 指定归档文件名。\n- `e`: 指定入口点（主类）。\n\n![image](img/3g.jpg)\n\n接下来，输入 `jar tf Lotto.jar`\
    \ 查看 JAR 的所有内容。\n\n![image](img/pg172_2.jpg)\n\n注意 `jar` 工具会在存档文件旁边创建一个 `META-INF`\
    \ 目录。它包含一个名为 `MANIFEST.MF` 的文本清单文件，你可以检查：\n\n![image](img/4g.jpg)\n\n现在，输入 `jar\
    \ xf Lotto.jar META-INF` 提取 `META-INF` 目录的副本。\n\n![image](img/5g.jpg)\n\n最后，在\
    \ Windows 上输入 `type META-INF\\MANIFEST.MF` 或在 Linux/macOS 上输入 `cat META-INF/MANIFEST.MF`\
    \ 查看存档文件内的文本。\n\n输出应该如下：\n\n```\nManifest-Version: 1.0\nMain-Class: Lotto\n```\n\
    \n`Main-Class` 属性指定了执行文件。\n\n### 部署应用\nJava JAR 文件可以在安装了适当版本 Java 运行时的系统上执行：\n\
    \n![image](img/1g.jpg)\n\n在命令行中，导航到 `Lotto.jar` 文件所在的目录，然后输入 `java -jar Lotto.jar`\
    \ 并按回键运行 Lotto 应用。\n\n![image](img/pg173_1.jpg)\n\n![image](img/pg173_2.jpg)\n\
    \n![image](img/pg173_3.jpg)\n\n![image](img/pg173_4.jpg)\n\n![image](img/pg173_5.jpg)\n\
    \n![image](img/2g.jpg)\n\n或者，双击或右键点击 `Lotto.jar` 文件图标，并选择“打开方式”使用 Java 运行时。\n\n"
- fmt: "\n![image](images/pg173_8.jpg)\n\n![image](images/snake.jpg)\n\nThe `.jar`\
    \ file extension is required when executing JAR files from a prompt.\n\n![image](images/hot.jpg)\n\
    \nSet the JRE as the default JAR file handler on your system for permanent double-click\
    \ execution.\n\n## Creating Android projects\n\nThe Android operating system,\
    \ prevalent on handheld devices, includes a set of core libraries that provide\
    \ most of the functionality of those in the Java programming language. This means\
    \ that Java programs can be readily converted for Android.\n\n![image](images/pg174_1.jpg)\n\
    \nAndroid Studio is available free from [developer.android.com/studio](http://developer.android.com/studio)\n\
    \nThis chapter describes Android application development using the latest version\
    \ of Android Studio available at the time of writing – instructions may vary for\
    \ other versions.\n\nAndroid app development is best undertaken using the official\
    \ Android Studio Integrated Development Environment (IDE). This provides a unified\
    \ environment where you can develop apps for all Android devices, and provides\
    \ extensive testing tools. Completed apps are distributed as an Android Application\
    \ Package (APK) archive file, which is similar to a Java archive (JAR) file. This\
    \ compresses all program files, using the popular ZIP format, into a single file\
    \ with a `.apk` file extension. Each app is first created in Android Studio as\
    \ a “project”, to which the developer adds code and resources:\n\n![image](images/1g.jpg)Launch\
    \ Android Studio, then choose to **Start a new Android Studio project** in the\
    \ “Welcome” dialog options – to open the “Choose your project” dialog\n\n![image](images/2g.jpg)Select\
    \ the target device type and the type of activity – typically “Phone and Tablet”\
    \ and “Empty Activity”\n\n![image](images/pg174_2.jpg)\n\n![image](images/3g.jpg)Click\
    \ **Next** to open the “Configure your project” dialog\n\n![image](images/pg175_1.jpg)\n\
    \n![image](images/8g.jpg)Choose the **Minimum API level** a device will need to\
    \ run the app (“Ice Cream Sandwich” is the default)\n\n![image](images/9g.jpg)Click\
    \ the **Finish** button to create an Android project using your specified configuration\n\
    \n![image](images/10g.jpg)Wait while Android Studio now generates several files\
    \ and folders for the new project (this can take a while), then eventually you\
    \ will see the IDE interface appear\n\n![image](images/hot.jpg)\n\nChoose API\
    \ 15 if you would like the app to run on 100% of devices active on the Google\
    \ Play Store.\n\n## Exploring project files\n\nThe Android Studio IDE provides\
    \ a Project window that displays an expandable tree view of all files and folders\
    \ within the project.\n\n![image](images/pg176_1.jpg)\n\nYou can click any arrow\
    \ in the Project window to expand a folder, and double-click on any file in the\
    \ Project window to open it in the tabbed Editor window.\n\n![image](images/pg176_2.jpg)\n\
    \nDespite its initial appearance of complexity, only two files need modification\
    \ by the developer to create a customized application:\n\n• `MainActivity.java`\
    \ – the Java file that loads controls into the app interface and can contain event-handler\
    \ code to respond to user actions within the app interface.\n\n• `activity_main.xml`\
    \ – the XML file that defines each control to appear in the app interface and\
    \ their layout.\n\n![image](images/hot.jpg)\n\nIf the Project window is not immediately\
    \ visible, click the Project button in the left sidebar, or open it using the\
    \ shortcut keys `Alt + F1`.\n\nSelecting the `activity_main.xml` file in the Project\
    \ window presents it in the Editor window in one of two possible views – visually\
    \ in Design view or programmatically in Text view. There are tabs at the bottom\
    \ of the window to switch between views.\n\n![image](images/pg177_1.jpg)\n\nDesign\
    \ view provides a Palette of controls that can be dragged onto a graphical representation\
    \ of the app, a Component Tree to select any added control, and an attributes\
    \ window in which to modify the appearance of a selected control.\n\nText view\
    \ provides a “code-behind” version of the layout that describes each aspect of\
    \ added controls using XML attributes.\n\n![image](images/pg177_2.jpg)\n\nControls\
    \ can be added to the app interface and modified either visually in Design view\
    \ or programmatically in Text view.\n\n## Adding resources & controls\n\n### Image\
    \ resources\n\nTo begin customizing the default Android Studio empty app for the\
    \ Lotto program, the image can first be added as a “resource”:\n\n![image](images/pg178_1.jpg)\n\
    \n![image](images/1g.jpg)Right-click on the `Lotto.png` image, and choose **Copy**\n\
    \n![image](images/2g.jpg)Next, right-click on the `app>res>drawable` folder in\
    \ the Project window, and choose **Paste**\n\n![image](images/3g.jpg)Choose a\
    \ Destination Directory, then rename the file to lowercase as `lotto.png`\n\n\
    ![image](images/pg178_2.jpg)\n\n![image](images/4g.jpg)Click **OK** to see the\
    \ file now appear in the `drawable` folder\n\n![image](images/pg178_3.jpg)\n\n\
    ![image](images/snake.jpg)\n\nAndroid only supports lowercase filenames for resource\
    \ items.\n\n![image](images/pg178_4.jpg)\n\n### Interface controls\n\nThe Lotto\
    \ app will require three interface controls in a vertical layout – an `ImageView`\
    \ control for the logo, a `TextView` control is required for the output, and a\
    \ `Button` control for user interaction.\n\n![image](images/2g.jpg)Open the `activity_main.xml`\
    \ file in the Text view\n\n![image](1g.jpg)Insert this `ImageView` control immediately\
    \ before the existing default TextView element\n\n```xml\n<ImageView\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:srcCompat=\"\
    @drawable/lotto\"\n    android:id=\"@+id/imageView\"\n    android:contentDescription=\"\
    Lotto Logo\"\n    android:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n\
    ![image](hot.jpg)The `app:srcCompat` attribute references the image resource added\
    \ to the `drawable` folder. The attributes in this element fit the control to\
    \ the width of the layout, and position the control at the top of the container.\
    \ The image is given an id for reference by other elements.\n\n![image](3g.jpg)Edit\
    \ the existing TextView element to look like:\n\n```xml\n<TextView\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"\
    @+id/textView\"\n    android:height=\"60dp\"\n    android:textSize=\"36sp\"\n\
    \    android:gravity=\"center_horizontal\"\n    android:layout_constraintTop_toBottomOf=\"\
    @+id/imageView\" />\n```\n\n![image](4g.jpg)Insert this `Button` element right\
    \ after the TextView element\n\n```xml\n<Button\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\n\
    \    android:textSize=\"24sp\"\n    android:onClick=\"lotto\"\n    android:text=\"\
    GET MY NUMBERS\"\n    android:layout_constraintTop_toBottomOf=\"@+id/textView\"\
    \ />\n```\n\n![image](hot.jpg)The `android:id` attribute in each element specifies\
    \ a unique name by which the element can be referenced in Java code. The `android:onClick`\
    \ attribute specifies the name of an event-handler to be called.\n\n### String\
    \ resources\n\nThe strings assigned to describe the image content and to specify\
    \ the button text should each be converted to a string resource:\n\n![image](1g.jpg)Click\
    \ within the “Lotto Logo” string assignment to give it focus, then press `Alt\
    \ + Enter` to see a QuickFix dialog\n\n![image](pg179_1.jpg)Choose **Extract string\
    \ resource**, then provide a resource name in the “Extract Resource” dialog that\
    \ now appears\n\n![image](pg179_2.jpg)Click **OK** to close the dialog, and see\
    \ the assigned string get replaced by a reference to the new string resource\n\
    \n![image](pg179_3.jpg)Repeat this for the “GET MY LUCKY NUMBERS” string\n\n![image](pg179_4.jpg)\n\
    \n**Inserting Java code**\n"
