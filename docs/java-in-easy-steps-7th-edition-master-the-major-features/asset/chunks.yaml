  trans: "\n\n![image](img/pg173_8.jpg)\n\n![image](img/snake.jpg)\n\n从提示符中执行 JAR\
    \ 文件时，需要 `.jar` 文件扩展名。\n\n![image](img/hot.jpg)\n\n将 JRE 设置为系统上的默认 JAR 文件处理程序，以实现永久的双击执行。\n\
    \n## 创建 Android 项目\n\n在手持设备上广泛使用的 Android 操作系统包含了一组核心库，这些库提供了 Java 编程语言中大部分功能的支持。这意味着\
    \ Java 程序可以很容易地转换为 Android 程序。\n\n![image](img/pg174_1.jpg)\n\n你可以从 [developer.android.com/studio](http://developer.android.com/studio)\
    \ 免费获取 Android Studio。\n\n本章描述了使用编写时可最新版本的 Android Studio 进行 Android 应用开发——其他版本的说明可能会有所不同。\n\
    \nAndroid 应用开发最好使用官方的 Android Studio 集成开发环境 (IDE)。它提供了一个统一的环境，你可以在其中为所有 Android\
    \ 设备开发应用，并提供了广泛的测试工具。完成的程序以 Android 应用包（APK）归档文件的形式发布，这类似于 Java 归档（JAR）文件。它使用流行的\
    \ ZIP 格式将所有程序文件压缩成带有 `.apk` 文件扩展名的单个文件。每个应用首先在 Android Studio 中被创建一个“项目”，开发者向其中添加代码和资源：\n\
    \n![image](img/1g.jpg)启动 Android Studio，然后在“欢迎”对话框选项中选择 **Start a new Android\
    \ Studio project**（启动一个新的 Android Studio 项目）——打开“选择你的项目”对话框\n\n![image](img/2g.jpg)选择目标设备类型和活动类型——通常选择“Phone\
    \ and Tablet”（手机和平板）和“Empty Activity”（空活动）\n\n![image](img/pg174_2.jpg)\n\n![image](img/3g.jpg)点击\
    \ **Next**（下一步）打开“配置你的项目”对话框\n\n![image](img/pg175_1.jpg)\n\n![image](img/8g.jpg)选择运行应用所需的\
    \ **Minimum API level**（最低 API 级别）（“Ice Cream Sandwich”是默认值）\n\n![image](img/9g.jpg)点击\
    \ **Finish**（完成）按钮使用指定的配置创建 Android 项目\n\n![image](img/10g.jpg)等待 Android Studio\
    \ 现在为新项目生成几个文件和文件夹（这可能需要一些时间），最终你将看到 IDE 界面出现\n\n![image](img/hot.jpg)\n\n如果你希望应用运行在\
    \ Google Play 商店活跃的 100% 设备上，请选择 API 15。\n\n## 探索项目文件\n\nAndroid Studio IDE 提供了一个\
    \ Project 窗口，显示项目内所有文件和文件夹的可展开树状视图。\n\n![image](img/pg176_1.jpg)\n\n你可以点击 Project\
    \ 窗口中的任何箭头来展开文件夹，并双击 Project 窗口中的任何文件以在标签页 Editor 窗口中打开它。\n\n![image](img/pg176_2.jpg)\n\
    \n尽管最初看起来很复杂，但开发者只需修改两个文件即可创建一个自定义的应用程序：\n\n• `MainActivity.java` – 用于将控件加载到应用界面的\
    \ Java 文件，并可以包含事件处理代码，以响应应用界面内的用户操作。\n\n• `activity_main.xml` – 用于定义应用界面中显示的每个控件及其布局的\
    \ XML 文件。\n\n![image](img/hot.jpg)\n\n如果 Project 窗口没有立即显示，点击左侧边栏中的 Project 按钮，或使用快捷键\
    \ `Alt + F1` 打开。\n\n在 Project 窗口中选择 `activity_main.xml` 文件将会在 Editor 窗口中以两种可能的视图之一显示——视觉上的\
    \ Design（设计）视图，或程序化的 Text（文本）视图。窗口底部有标签页用于切换这些视图。\n\n![image](img/pg177_1.jpg)\n\
    \nDesign 视图提供了一个控件面板（Palette），可以将其拖到应用的图形化表示上；一个用于选择任何添加控件的组件树（Component Tree），以及一个用于修改所选控件外观的属性窗口。\n\
    \nText 视图提供了布局的“后置代码”版本，使用 XML 属性描述所添加控件的每个方面。\n\n![image](img/pg177_2.jpg)\n\n\
    控件可以在 Design 视图中通过视觉方式添加并修改，也可以在 Text 视图中通过程序方式进行。\n\n## 添加资源与控件\n\n### 图像资源\n\
    \n要开始为 Lotto 程序自定义默认的 Android Studio 空应用，首先可以将图像作为“资源”添加：\n\n![imageimage](img/pg178_1.jpg)\n\
    \n![image](img/1g.jpg)右键点击 `Lotto.png` 图像，并选择 **Copy**（拷贝）\n\n![image](img/2g.jpg)接下来，右键点击\
    \ Project 窗口中的 `app>res>drawable` 文件夹，并选择 **Paste**（粘贴）\n\n![image](img/3g.jpg)选择目标目录，然后将文件重命名为小写的\
    \ `lotto.png`\n\n![image](img/pg178_2.jpg)\n\n![image](img/4g.jpg)点击 **OK** 查看文件现在出现在\
    \ `drawable` 文件夹中\n\n![image](img/pg178_3.jpg)\n\n![image](img/snake.jpg)\n\n\
    Android 资源项仅支持小写文件名。\n\n![image](img/pg178_4.jpg)\n\n### 界面控件\n\nLotto 应用需要在垂直布局三个界面控件——用于\
    \ Logo 的 `ImageView` 控件、用于输出的 `TextView` 控件，以及用于用户交互的 `Button` 控件。\n\n![image](img/2g.jpg)在\
    \ Text 视图中打开 `activity_main.xml` 文件\n\n![image](img/1g.jpg)在现有的默认 TextView 元素之前插入此\
    \ `ImageView` 控件\n\n```xml\n<ImageView\n    android:layout_width=\"match_parent\"\
    \n    android:layout_height=\"wrap_content\"\n    android:srcCompat=\"@drawable/lotto\"\
    \n    android:id=\"@+id/imageView\"\n    android:contentDescription=\"Lotto Logo\"\
    \n    android:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n![image](img/hot.jpg)`app:srcCompat`\
    \ 属性引用添加到 `drawable` 文件夹的图像资源。该元素中的属性使控件适应布局宽度，并将控件放置在容器的顶部。图像被赋予了一个 id 以供其他元素引用。\n\
    \n![image](img/3g.jpg)编辑现有的 TextView 元素如下如下：\n\n```xml\n<TextView\n    android:layout_width=\"\
    match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"\
    @+id/textView\"\n    android:height=\"60dp\"\n    android:textSize=\"36sp\"\n\
    \    android:gravity=\"center_horizontal\"\n    android:layout_constraintTop_toBottomOf=\"\
    @+id/imageView\" />\n```\n\n![image](img/4g.jpg)在 TextView 元素之后插入此 `Button` 元素\n\
    \n```xml\n<Button\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
    wrap_content\"\n    android:id=\"@+id/button\"\n    android:textSize=\"24sp\"\n\
    \    android:onClick=\"lotto\"\n    android:text=\"GET MY NUMBERS\"\n    android:layout_constraintTop_toBottomOf=\"\
    @+id/textView\" />\n```\n\n![image](img/hot.jpg)每个元素中的 `android:id` 属性指定 Java\
    \ 代码引用的唯一名称。`android:onClick` 属性指定了要调用的事件处理器名称。\n\n### 字符串资源\n\n描述图像内容和指定按钮文本的字符串应分别转换为字符串资源：\n\
    \n![image](img/1g.jpg)点击“Lotto Logo”字符串赋值使其聚焦，然后按 `Alt + Enter` 显示 QuickFix 对话框\n\
    \n![image](img/pg179_1.jpg)选择 **Extract string resource**（提取字符串资源），然后在现在出现的“Extract\
    \ Resource”对话框中提供资源名称\n\n![image](img/pg179_2.jpg)点击 **OK** 关闭对话框，并看到分配的字符串被替换为新字符串资源的引用\n\
    \n![image](img/pg179_3.jpg)对“GET MY LUCKY NUMBERS”字符串重复此操作\n\n![image](img/pg179_4.jpg)\n\
    \n**插入 Java 代码**\n\n"
- fmt: "\nAfter adding resources and controls shown on [here](#chapter10.html_pg179),\
    \ the app interface should now resemble that of the `Lotto.jar` application:\n\
    \n![image](images/pg180_1.jpg)\n![image](images/pg180_2.jpg)\n![image](images/snake.jpg)\n\
    \nIf the controls do not look like this screenshot, you should return to [here](#chapter10.html_pg179)\
    \ and carefully check each element’s attributes.\n\nFunctionality can next be\
    \ added to the app by inserting an eventhandler into the `MainActivity.java` file\
    \ that will respond to the button’s `onClick` event when the user pushes the button.\
    \ This event automatically passes one argument to the event-handler, which is\
    \ an identifying reference to the control that has been clicked. Consequently,\
    \ the event-handler signature must accommodate the argument by including a parameter\
    \ for the `View` class – the base class of all widgets. The method must also have\
    \ a `void` return type:\n\n![image](images/1g.jpg)First add this line to the import\
    \ statements at the beginning of the `MainActivity.java` file\n\n```\nimport android.view.View\
    \ ;\n```\n\n![image](images/common.jpg)\n\nMainActivity.java\n\n![image](images/2g.jpg)Insert\
    \ this event-handler signature into the `MainActivity` class, immediately after\
    \ its `onCreate( )` method block\n\n```java\npublic void lotto( View vue ) { }\n\
    ```\n\nInterface controls can be referenced in code by specifying their identity\
    \ as the argument to a `findViewById( )` method. This is the name assigned to\
    \ their `android:id` attribute in `activity_main.xml` prefixed by `R.id.` :\n\n\
    ![image](images/3g.jpg)Inside the event-handler block, assign a reference to the\
    \ `<TextView>` control element to a variable\n\n```java\nTextView txt = (TextView)\
    \ findViewById( R.id.textView ) ;\n```\n\n![image](images/4g.jpg)Finally, inside\
    \ the event-handler block, copy the code from the event-handler in the `Lotto.java`\
    \ program (listed [here](#chapter10.html_sec83)) that outputs six unique random\
    \ numbers\n\n```java\nint[ ] nums = new int[ 60 ] ; String = “ ” ; str\nfor (\
    \ int i = 1 ; i < 60 ; i++ ) { nums[ i ] = i ; }\nfor ( int i = 1 ; i < 60 ; i++\
    \ ) {\n    int r= ( int ) ( 59 * Math.random( ) ) + 1 ;\n    int t= nums[ i ]\
    \ ; nums[ i ]= nums[ r ] ; nums[ r ]= t ;\n}\nfor ( int i = 1 ; i < 7 ; i++ )\
    \ {\n    str += “ ” + Integer.toString( nums[ i ] ) + “ ” ;\n}\ntxt.setText( str\
    \ ) ;\n```\n\n![image](images/forget.jpg)\n\nIn this case, there is no need for\
    \ the code to check the source of the call, as the event-handler is explicitly\
    \ assigned to the button by the `android:onClick` attribute in `activity_main.xml.`\n\
    \nNow that the Lotto app has all resources, controls, and functional code in place,\
    \ an attempt can be made to build:\n\n![image](images/5g.jpg)On the Android Studio\
    \ toolbar, click `View`, `Tool Windows`, `Build` – to open the “Build” window\n\
    \n![image](images/6g.jpg)Then, click `Build`, `Make Project` (or press `Ctrl`\
    \ + `F9` shortcut) to start building – see its progress displayed in the “Build”\
    \ window\n\n![image](images/pg181_1.jpg)\n![image](images/7g.jpg)Click the “Toggle\
    \ View” button to see a confirmation of build success, or failure\n\n![image](images/pg181_2.jpg)\n\
    ![image](images/8g.jpg)Fix any reported errors, then build again until you see\
    \ a confirmation of success\n\n![image](images/hot.jpg)If the build attempt fails,\
    \ look for red bulb icons in the code – Android Studio adds these so you can easily\
    \ find and correct errors.\n\n### Testing the application\n\nOnce an application\
    \ project has built successfully, it is ready to be tested. Testing can be performed\
    \ on a real Android device, connected to your computer via USB, or on an Virtual\
    \ Device (AVD) emulator. AVDs allow you to test how the app will perform on a\
    \ range of devices, but they use more system resources and can be painfully slow.\
    \ Applications should be tested on at least one phone device and one tablet:\n\
    \n![image](images/1g.jpg)Click `Run`, `Run ‘app’` (or press `Shift` + `F10` shortcut)\
    \ to open the “Select Deployment” dialog\n\n![image](images/pg182_1.jpg)\n![image](images/2g.jpg)Select\
    \ an AVD phone emulator to connect, then click `OK` to install the Lotto app on\
    \ the emulator\n\n![image](images/3g.jpg)Push the app’s button to see the `TextView`\
    \ content wrap on this small device\n\n![image](images/pg182_2.jpg)Edit `activity_main.xml`\
    \ to reduce the text size `android:textSize=”26sp”`\n\n![image](images/5g.jpg)Click\
    \ `Build`, `Rebuild Project` to apply the change, then run the app in the emulator\
    \ once more to see the solution\n\n![image](images/pg182_3.jpg)\n![image](images/pg182_4.jpg)\n\
    ![image](images/snake.jpg)\n\nCreation of each AVD emulator may require a large\
    \ system file to be downloaded. You may prefer to test on a real Android device.\
    \ Also note that accelerated emulators will only run if your computer supports\
    \ hardware virtualization (Intel VT-x or AMD SVM).\n\n![image](images/hot.jpg)Android\
    \ Studio has an Instant Run feature that automatically updates changes to the\
    \ app so they appear in the test device more quickly.\n\n![image](images/forget.jpg)It\
    \ is better to test on real devices than the emulators. Ideally, you should test\
    \ on as different devices as possible before final deployment of apps.\n\n![image](images/6g.jpg)Take\
    \ an Android phone and enable “USB Debugging” in the `Settings`, `Developer Options`\
    \ menu\n\n![image](images/pg183_1.jpg)\n![image](images/pg183_2.jpg)\n![image](images/7g.jpg)Connect\
    \ the phone to your computer via a USB port, and tap to allow access\n\n![image](images/pg183_3.jpg)\n\
    ![image](images/8g.jpg)Click `Run`, `Run ‘app’` (or press `Shift` + `F10` shortcut)\
    \ to open the “Select Deployment” dialog\n\n![image](images/9g.jpg)Select the\
    \ connected phone device, then click `OK` to install the Lotto app onto the phone\n\
    \n![image](images/pg183_4.jpg)\n![image](images/10g.jpg)Push the app’s button\
    \ to see the Lotto app happily perform as expected – a successful test\n\n![image](images/pg183_5.jpg)\n\
    ![image](images/pg183_6.jpg)\n![image](images/pg183_7.jpg)The test processes provide\
    \ an application launcher so the tablet can be disconnected and the app launched\
    \ by tapping the launcher icon – but remember, this is a Debug build of the app.\n\
    \n![image](images/hot.jpg)If you cannot see Developer Options in the Android Settings\
    \ you can enable it by tapping on the Build Number seven times – typically found\
    \ at Settings, About, Software Information, Build Number.\n\n![image](images/hot.jpg)Android\
    \ Studio provides a default image launcher icon, but you can use your own image.\
    \ In the Project window, rightclick on the `res` folder then choose `New`, `Image\
    \ Asset` to open the Asset Studio, then select `Image` and browse to an image\
    \ you wish to import into the project.\n\n### Deploying Android apps\n\nAfter\
    \ successful testing, the development Debug version of an app should be changed\
    \ to a Release version before deployment as an Android Application Package (APK).\
    \ Android requires that all APKs must be digitally signed with a certificate,\
    \ and Android Studio allows you to easily generate a signed APK:\n\n![image](images/pg184_1.jpg)\n\
    \n![image](images/1g.jpg)Click `Build`, `Generate Signed Bundle/ APK` on the Android\
    \ Studio menu\n\n![image](images/2g.jpg)Select the `APK` option, then click the\
    \ `Next` button\n\n![image](images/pg184_2.jpg)\n\n![image](images/3g.jpg)Enter\
    \ your existing key store details, or click the `Create new...` button to create\
    \ a key store\n\n![image](images/pg184_3.jpg)\n![image](images/4g.jpg)Enter the\
    \ key store passwords, then click the `Next` button\n\n![image](images/5g.jpg)Select\
    \ the `release` option\n\n![image](images/pg184_4.jpg)\n\n![image](images/6g.jpg)Check\
    \ the `V2` signature version\n\n![image](images/pg184_4.jpg)\n![image](images/7g.jpg)Click\
    \ `Finish` to generate a signed APK for the app\n"
