  trans: "\n\n## KeyListener\n\n允许用户输入文本的 Swing 组件可以通过 `KeyListener` 接口识别用户的按键击击，该接口会将\
    \ `KeyEvent` 事件传递给以下三个事件处理方法：\n\n| 事件处理器: | 描述: |\n| :--- | :--- |\n| `keyPressed(\
    \ KeyEvent )` | 当按键被按下时调用 |\n| `keyTyped( KeyEvent )` | 在按键被按下后调用 |\n| `keyReleased(\
    \ KeyEvent )` | 当按键释放时调用 |\n\n当程序实现 `KeyListener` 接口时，必须声明这三个方法——即使它们并不全部都被实际使用。\n\
    \n`KeyEvent` 对象拥有一个 `getKeyChar()` 方法，该方法返回该按键的字符；以及 `getKeyCode()` 方法，它返回表示该按键的整数\
    \ Unicode 值。此外，`getKeyText()` 方法接收键码作为参数并返回该按键的描述。\n\n![image](img/1r.jpg)从这里编辑一份\
    \ `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Keystrokes”。然后，添加初始语句以导入 `java.awt.event`\
    \ 包的功能。\n\n```\nimport java.awt.event.* ;\n```\n\n![image](img/common.jpg)\n\n\
    Keystrokes.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `KeyListener` 接口\n\n```java\n\
    class Keystrokes extends JFrame implements KeyListener\n```\n\n![image](img/3r.jpg)在\
    \ `Keystrokes()` 构造函数之前，创建一个 `JTextField` 组件和一个 `JTextArea` 组件\n\n```java\nJTextField\
    \ field = new JTextField( 38 ) ;\nJTextArea txtArea = new JTextArea( 5 , 38 )\
    \ ;\n```\n\n![image](img/4r.jpg)插入语句将这两个组件添加到 `JPanel` 容器中\n\n```java\npnl.add(\
    \ field ) ;  pnl.add( txtArea ) ;\n```\n\n![image](img/5r.jpg)在 `Keystrokes()`\
    \ 构造函数中，插入一条语句使 `JTextField` 组件生成 `KeyEvent` 事件\n\n```java\nfield.addKeyListener(\
    \ this ) ;\n```\n\n![image](img/6r.jpg)在构造方法之后，添加一个确认按键被按下的事件处理器\n\n```java\n\
    public void keyPressed( KeyEvent event )\n{\n    txtArea.setText( “Key Pressed”\
    \ ) ;\n}\n```\n\n![image](img/7r.jpg)添加第二个事件处理器，在按键按下后显示键字符\n\n```java\npublic\
    \ void keyTyped( KeyEvent event )\n{\n    txtArea.append( “\\nCharacter : ” +\
    \ event.getKeyChar() ) ;\n}\n```\n\n![image](img/8r.jpg)添加第三个事件处理器，在按键释放时显示键码和键文本\n\
    \n```java\npublic void keyReleased( KeyEvent event )\n{\n    int keyCode = event.getKeyCode()\
    \ ;\n    txtArea.append( “\\nKey Code : ” + keyCode ) ;\n    txtArea.append( “\\\
    nKey Text : ” + event.getKeyText( keyCode ) ) ;\n}\n```\n\n![image](img/9r.jpg)将程序保存为\
    \ `Keystrokes.java`，然后编译并运行程序，在顶部的文本框中输入。\n\n![image](img/pg159_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n`getKeyCode()` 方法只有在从 `keyPressed()` 或 `keyReleased()` 事件处理器内部调用时才会返回键码——而不是从\
    \ `keyTyped()` 事件处理器中调用。\n\n![image](img/hot.jpg)运行此程序并按下非字符键（如退格键），查看其键文本名称。\n\
    \n## MouseListener\n\n![image](img/pg160_1.jpg)\n\nSwing 组件可以通过 `MouseListener`\
    \ 接口识别用户的鼠标动作，该接口会将 `MouseEvent` 事件传递给以下五个事件处理方法：\n\n| 事件处理器: | 描述: |\n| :---\
    \ | :--- |\n| `mousePressed( MouseEvent )` | 按钮被按下 |\n| `mouseReleased( MouseEvent\
    \ )` | 按钮被释放 |\n| `mouseClicked( MouseEvent )` | 按钮已释放 |\n| `mouseEntered( MouseEvent\
    \ )` | 鼠标移入 |\n| `mouseExited( MouseEvent )` | 鼠标移出 |\n\n鼠标移动可以通过 `MouseMotionListener`\
    \ 接口识别，该接口会将 `MouseEvent` 事件传递给两个事件处理器：\n\n| 事件处理器: | 描述: |\n| :--- | :--- |\n\
    | `mouseMoved( MouseEvent )` | 鼠标被移动 |\n| `mouseDragged( MouseEvent )` | 鼠标被拖动\
    \ |\n\n当程序实现 `MouseListener` 或 `MouseMotionListener` 接口时，必须声明所有相关的事件处理器方法——即使它们并不全部都被实际使用。\n\
    \n由 `MouseMotionListener` 接口传递的 `MouseEvent` 对象拥有 `getX()` 和 `getY()` 方法，它们返回相对于生成事件组件的当前鼠标坐标。\n\
    \n![image](img/1r.jpg)从这里编辑一份 `Window.java` 的副本，将声明、构造函数和实例语句中的类名从“Window”更改为“Mouse”。然后，添加初始语句以导入\
    \ `java.awt.event` 包的功能。\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](img/common.jpg)\n\
    \nMouse.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `KeyListener` 接口和 `MouseMotionListener`\
    \ 接口\n\n```java\nclass Mouse extends JFrame implements MouseListener, MouseMotionListener\n\
    ```\n\n![image](img/3r.jpg)在 `Mouse()` 构造函数之前，创建一个 `JTextArea` 组件和两个存储坐标的整数变量\n\
    \n```java\nJTextArea txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n\
    ![image](img/4r.jpg)在 `Mouse()` 构造函数中，插入语句将 `JTextArea` 组件添加到 `JPanel` 容器中并使其生成\
    \ `MouseEvent` 事件\n\n```java\npnl.add( txtArea ) ;\ntxtArea.addMotionListener(\
    \ this ) ;\ntxtArea.addMouseListener( this ) ;\n```\n\n![image](img/5r.jpg)在构造方法之后，为\
    \ `MouseMotionListener` 接口添加事件处理器\n\n```java\npublic void mouseMoved( MouseEvent\
    \ event )\n{\n    x = event.getX() ;\n    y = event.getY() ;\n}\n\npublic void\
    \ mouseDragged( MouseEvent event )\n{\n    x = event.getX() ;\n    y = event.getY()\
    \ ;\n}\n```\n\n![image](img/6r.jpg)为 `MouseListener` 接口添加五个事件处理器\n\n```java\n\
    public void mousePressed( MouseEvent event )\n{\n    txtArea.append( “\\nPressed\
    \ at X: ”+x+“Y: “+y ) ;\n}\n\npublic void mouseReleased( MouseEvent event )\n\
    {\n    txtArea.append( “\\nReleased” ) ;\n}\n\npublic void mouseClicked( MouseEvent\
    \ event )\n{\n    txtArea.append( “\\nClicked” ) ;\n}\n\npublic void mouseEntered(\
    \ MouseEvent event )\n{\n    txtArea.setText( “\\nEntered” ) ;\n}\n\npublic void\
    \ mouseExited( MouseEvent event )\n{\n    txtArea.setText( “\\nExited” ) ;\n}\n\
    ```\n\n![image](img/7r.jpg)将程序保存为 `Mouse.java`，然后编译并运行程序，点击 `JTextArea` 组件。可以通过\
    \ `mouseEntered()` 和 `mouseExited()` 事件处理器交换图像来创建悬停效果。\n\n## 发布消息\n\nSwing `JOptionPane`\
    \ 类用于在其窗口中心创建一个标准的对话框。其 `showMessageDialog()` 方法向用户显示提供信息、警告或错误描述的消息。\n\n![image](img/pg162_1.jpg)\n\
    \n`showMessageDialog()` 方法可以接受四个参数：\n\n- 父对象——通常通过 `this` 关键字引用\n- 要显示的消息 `String`\
    \ \n- 对话框标题 `String`\n- `JOptionPane` 常量之一：`INFORMATION_MESSAGE`、`WARNING_MESSAGE`\
    \ 或 `ERROR_MESSAGE`\n\n对话框将根据指定的 `JOptionPane` 常量显示相应的图标。\n\n"
