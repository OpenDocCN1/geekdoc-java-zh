    \ `String`。这可以通过在每个嵌套的引号字符前紧跟一个 `\\` 转义运算符来轻松实现。例如，在 `String` 变量中包含引号，如下：\n\n\
    ```java\nString quote = “ \\”Fortune favors the brave.\\” said Virgil ”;\n```\n\
    \n此外，`\\` 转义运算符为简单的输出格式提供了多种实用的转义序列：\n\n| **转义符:** | **描述:** |\n| :--- | --- |\n\
    | `\\n` | 换行 |\n| `\\t` | 制表符 |\n| `\\b` | 退格 |\n| `\\r` | 回车 |\n| `\\f` | 换符\
    \ |\n| `\\\\` | 反斜杠 |\n| `\\’` | 单引号 |\n| `\\”` | 双引号 |\n\n![image](img/hot.jpg)\n\
    \n可以将单引号嵌套在双引号内，作为转义引号字符的替代方案。\n\n`\\n` 换行转义序列经常用于长 `String` 值中，以便多行显示输出。同样，`\\\
    t` 制表符转义序列经常用于列显示输出。使用 `\\n` 换行和 `\\t` 制表符转义序列的组合允许输出按行和列格式化——类似于表格。\n\n按照以下步骤使用转义序列创建\
    \ Java 程序来格式化输出：\n\n![image](img/1r.jpg)创建一个名为“Escape”的新程序，包含标准的 main 方法\n\n```java\n\
    class Escape\n{\n    public static void main( String[] args ) {    }\n}\n```\n\
    \n![image](img/common.jpg)\n\nEscape.java\n\n![image](img/2r.jpg)在 main 方法的大括号之间插入此代码，以构建一个包含格式化表格标题和列标题的\
    \ `String`\n\n```java\nString header = “\\n\\tNEW YORK 3-DAY FORECAST:\\n” ;\n\
    header += “\\n\\tDay\\t\\tHigh\\tLow\\tConditions\\n” ;\nheader += “\\t---\\t\\\
    t----\\t---\\t----------\\n” ;\n```\n\n![image](img/3r.jpg)添加这些行以构建一个包含格式化表格单元数据的\
    \ `String`\n\n```java\nString forecast = “\\tSunday\\t\\t68F\\t48F\\tSunny\\n”\
    \ ;\nforecast += “\\tMonday\\t\\t69F\\t57F\\tSunny\\n” ;\nforecast += “\\tTuesday\\\
    t\\t71F\\t50F\\tCloudy\\n” ;\n```\n\n![image](img/4r.jpg)现在，添加此行输出两个格式化的 `String`\
    \ 值\n\n```java\nSystem.out.print( header + forecast ) ;\n```\n\n![image](img/5r.jpg)将程序保存为\
    \ `Escape.java`，然后编译并运行程序\n\n![image](img/pg39_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n在这种情况下，转义序列添加了换行，因此此处使用了 `print()` 方法——而不是输出后会自动添加换行的 `println()` 方法。\n\n##\
    \ 使用位操作\n\n除了本章前面介绍的普通运算符外，Java 还提供了用于二进制运算的特殊运算符。这些运算符比其他运算符不常用，但在这里简要讨论是为了让大家了解它们的存在。\n\
    \n![image](img/pg40_1.jpg)\n\nJava “位”运算符可以与 `int` 整数数据类型一起使用，用于操作值的二进制表示位。这需要理解二进制计数，其中字节中的八位代表十进制的零到\
    \ 255。例如，53 的二进制为 `00110101`（`0` x 128, `0` x 64, `1` x 32, `1` x 16, `0` x 8,\
    \ `1` x 4, `0` x 2, `1` x 1）。\n\n二进制加法运算的操作类似于十进制算术：\n\n| | 53 | = | `00110101`\
    \ |\n| :--- | --- | --- | --- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = | `00111100`\
    \ |\n\n下列表位运算符允许在二进制运算中执行更专门的操作。\n\n| **运算符:** | **操作:** | **示例:** | **结果:** |\n\
    | :--- | --- | --- | --- |\n| `&` | 与 (AND) | `a & b` | 如果两个位都为 1 则结果为 1 |\n|\
    \ `\\|` | 或 (OR) | `a \\| b` | 如果其中一个位为 1 则结果为 1 |\n| `^` | 异或 (XOR) | `a ^ b`\
    \ | 如果两个位不同则为 1 |\n| `~` | 非 (NOT) | `~a` | 反转位 |\n| `<<` | 左移 | `n << p` | 将\
    \ `n` 向左移动 `p` 位 |\n| `>>` | 右移 | `n >> p` | 将 `n` 向右移动 `p` 位 |\n\n例如，在二进制运算中使用位\
    \ `&` 运算符：\n\n| | 53 | = | `00110101` |\n| :--- | --- | --- | --- |\n| `+` | 7\
    \ | = | `00000111` |\n| | 60 | = | `00111100` |\n\n"
- fmt: "\nThis chapter demonstrates the various keywords that are used to create branching\
    \ in Java programs.\n\n## Branching with if\n## Branching alternatives\n## Switching\
    \ branches\n## Looping for\n## Looping while true\n## Doing do-while loops\n##\
    \ Breaking out of loops\n## Returning control\n## Summary\n\n### Branching with\
    \ if\n\nThe `if` keyword performs a conditional test to evaluate an expression\
    \ for a Boolean value. A statement following the expression will only be executed\
    \ when the evaluation is `true`, otherwise the program proceeds on to subsequent\
    \ code – pursuing the next “branch”. The `if` statement syntax looks like this:\n\
    \n`if (test-expression) code-to-be-executed-when-true;`\n\n![image](images/ycap.jpg)\n\
    \nThe code to be executed can contain multiple statements if they are enclosed\
    \ within curly brackets to form a “statement block” :\n\n![image](images/1g.jpg)Start\
    \ a new program named “If” containing the standard main method\n\n```java\nclass\
    \ If\n{\n    public static void main (String[] args) {\n    }\n}\n```\n\n![image](images/j1.jpg)\n\
    \nIf.java\n\n![image](images/2g.jpg)Between the curly brackets of the main method,\
    \ insert this simple conditional test that executes a single statement when one\
    \ number is greater than another\n\n`if ( 5 > 1 ) System.out.println( “Five is\
    \ greater than one.” ) ;`\n\n![image](images/3g.jpg)Add a second conditional test,\
    \ which executes an entire statement block when one number is less than another\n\
    \n```java\nif ( 2 < 4 )\n{\n    System.out.println( “Two is less than four.” )\
    \ ;\n    System.out.println( “Test succeeded.” ) ;\n}\n```\n\n![image](images/4g.jpg)Save\
    \ the program as `If.java` then compile and run the program to see all statements\
    \ get executed – because both tests evaluate as `true` in this case:\n\n![image](images/pg44_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nExpressions can utilize the `true` and `false` keywords.\
    \ The test expression `( 2 < 4 )` is shorthand for `( 2 < 4 == true )`.\n\nA conditional\
    \ test can also evaluate a complex expression to test multiple conditions for\
    \ a Boolean value. Parentheses enclose each test condition to establish precedence\
    \ – so they get evaluated first. The Boolean `&&` AND operator ensures the complex\
    \ expression will only return `true` when both tested conditions are true:\n\n\
    `if ( (test-condition1) && (test-condition2) ) execute-this-code;`\n\nThe Boolean\
    \ `||` OR operator ensures a complex expression will only return `true` when either\
    \ one of the tested conditions is true:\n\n`if ( (test-condition1) || (test-condition2)\
    \ ) execute-this-code;`\n\nA combination of these can form longer complex expressions:\n\
    \n![image](images/5g.jpg)Inside the main method of `If.java` insert this line\
    \ to declare and initialize an integer variable named `num`\n\n```java\nint num\
    \ = 8 ;\n```\n\n![image](images/6g.jpg)Add a third conditional test that executes\
    \ a statement when the value of the `num` variable is within a specified range,\
    \ or when it’s exactly equal to a specified value\n\n```java\nif ( ( ( num > 5\
    \ ) && ( num < 10 ) ) || ( num == 12 ) )\n    System.out.println( “Number is 6-9\
    \ inclusive, or 12” ) ;\n```\n\n![image](images/7g.jpg)Recompile the program,\
    \ and run it once more to see the statement after the complex expression get executed\n\
    \n![image](images/pg45_1.jpg)\n\n![image](images/8g.jpg)Change the value assigned\
    \ to the `num` variable so it is neither within the specified range 6-9, or exactly\
    \ 12. Recompile the program, and run it again to now see the statement after the\
    \ complex expression is not executed\n\n![image](images/hot.jpg)\n\nThe range\
    \ can be extended to include the upper and lower limits using the `>=` and `<=`\
    \ operators.\n\n![image](images/forget.jpg)\n\nThe complex expression uses the\
    \ `==` equality operator to specify an exact match, not the `=` assignment operator.\n\
    \n### Branching alternatives\n\nThe `else` keyword is used in conjunction with\
    \ the `if` keyword to create `if else` statements that provide alternative branches\
    \ for a program to pursue – according to the evaluation of a tested expression.\
    \ In its simplest form, this merely nominates an alternative statement for execution\
    \ when the test fails:\n\n`if (test-expression) code-to-be-executed-when-true;`\n\
    `else code-to-be-executed-when-false;`\n\n![image](images/ycap.jpg)Each alternative\
    \ branch may be a single statement or a statement of multiple statements – enclosed\
    \ within curly brackets\n\n![image](images/1g.jpg)Start a new program named “Else”\
    \ containing the standard main method\n\n```java\nclass Else\n{\n    public static\
    \ void main (String[] args) {\n    }\n}\n```\n\n![image](images/j1.jpg)\n\nElse.java\n\
    \n![image](images/2g.jpg)Inside the main method, insert this line to declare and\
    \ initialize an integer variable named `hrs`\n\n```java\nint hrs = 11 ;\n```\n\
    \n![image](images/3g.jpg)Insert this simple conditional test, which executes a\
    \ single statement when the value of the `hrs` variable is 13\n\n```java\nif (\
    \ hrs < 13 )\n{\n    System.out.println( “Good morning: ” + hrs ) ;\n}\n```\n\n\
    ![image](images/4g.jpg)Save the program as `Else.java` then compile and run the\
    \ program to see the statement get executed\n\n![image](images/pg44_1.jpg)Notice\
    \ that the first statement is terminated with a semicolon, as usual, before the\
    \ `else` keyword\n\n![image](images/5g.jpg)Change the value assigned to the `hrs`\
    \ variable to 15, then add this alternative branch right after the `if` statement\n\
    \n```java\nelse if ( hrs < 18 )\n{\n    System.out.println( “Good afternoon: ”\
    \ + hrs ) ;\n}\n```\n\n![image](images/6g.jpg)Save the changes, recompile, and\
    \ run the program again to see just the alternative statement executed\n\n![image](images/7g.jpg)It\
    \ is sometimes desirable to provide a final `else` branch, without a nested `if`\
    \ statement, to specify a “default” statement to be executed when no tested expression\
    \ evaluates as `true`:\n\n![image](images/8g.jpg)Change the value assigned to\
    \ the `hrs` variable to 21, then add this default branch to the end of the `if\
    \ else` statement\n\n```java\nelse System.out.println( “Good evening: ” + hrs\
    \ ) ;\n```\n\n![image](images/pg45_1.jpg)Save the changes, recompile, and run\
    \ the program once more to see just the default statement executed\n\n![image](images/hot.jpg)\
    \ \n\nConditional branching is the fundamental process by which computer programs\
    \ proceed.\n\n### Switching branches\n\nLengthy `if else` statements, which offer\
    \ many conditional branches for a program to pursue, can become unwieldy. Where\
    \ the test expressions repeatedly evaluate the same variable value, a more elegant\
    \ solution is often provided by a `switch` statement.\n\n![image](images/ycap.jpg)\n\
    \nThe syntax of a typical switch statement block looks like this:\n\n```java\n\
    switch (test-variable)\n{\n    case value1: code-to-be-executed-when-true; break;\n\
    \    case value2: code-to-be-executed-when-true; break;\n    case value3: code-to-be-executed-when-true;\
    \ break;\n    default : code-to-be-executed-when-false;\n}\n```\n"
  raw: '***This chapter demonstrates the various keywords that are used to create
    branching in Java programs.***


    [**Branching with if**](#chapter03.html_sec20)


    [**Branching alternatives**](#chapter03.html_sec21)


    [**Switching branches**](#chapter03.html_sec22)


    [**Looping for**](#chapter03.html_sec23)


    [**Looping while true**](#chapter03.html_sec24)


    [**Doing do-while loops**](#chapter03.html_sec25)


    [**Breaking out of loops**](#chapter03.html_sec26)


    [**Returning control**](#chapter03.html_sec27)


    [**Summary**](#chapter03.html_sec28)


    **Branching with if**


    The **if** keyword performs a conditional test to evaluate an expression for a
    Boolean value. A statement following the expression will only be executed when
    the evaluation is **true**, otherwise the program proceeds on to subsequent code
    – pursuing the next “branch”. The **if** statement syntax looks like this:


    **if (** *test-expression* **)** *code-to-be-executed-when-true* **;**


    ![image](images/ycap.jpg)


    The code to be executed can contain multiple statements if they are enclosed within
    curly brackets to form a “statement block” :


    ![image](images/1g.jpg)Start a new program named “If” containing the standard
    main method


    **class If**


    **{**


    **public static void main (String[] args) {          }**


    **}**


    ![image](images/j1.jpg)


    If.java


    ![image](images/2g.jpg)Between the curly brackets of the main method, insert this
    simple conditional test that executes a single statement when one number is greater
    than another


    **if ( 5 > 1 ) System.out.println( “Five is greater than one.” ) ;**


    ![image](images/3g.jpg)Add a second conditional test, which executes an entire
    statement block when one number is less than another


    **if ( 2 < 4 )**


    **{**


    **System.out.println( “Two is less than four.” ) ;**


    **System.out.println( “Test succeeded.” ) ;**


    **}**


    ![image](images/4g.jpg)Save the program as **If.java** then compile and run the
    program to see all statements get executed – because both tests evaluate as **true**
    in this case:


    ![image](images/pg44_1.jpg)


    ![image](images/hot.jpg)


    Expressions can utilize the **true** and **false** keywords. The test expression
    **( 2 < 4 )** is shorthand for **( 2 < 4 == true )**.


    A conditional test can also evaluate a complex expression to test multiple conditions
    for a Boolean value. Parentheses enclose each test condition to establish precedence
    – so they get evaluated first. The Boolean **&&** AND operator ensures the complex
    expression will only return **true** when both tested conditions are true:


    **if** **( (** *test-condition1* **) && (** *test-condition2* **) )** *execute-this-code*
    **;**


    The Boolean **||** OR operator ensures a complex expression will only return **true**
    when either one of the tested conditions is true:


    **if ( (** *test-condition1* **) || (** *test-condition2* **) )** *execute-this-code*
    **;**


    A combination of these can form longer complex expressions:


    ![image](images/5g.jpg)Inside the main method of **If.java** insert this line
    to declare and initialize an integer variable named **num**


    int num = 8 ;


    ![image](images/6g.jpg)Add a third conditional test that executes a statement
    when the value of the **num** variable is within a specified range, or when it’s
    exactly equal to a specified value


    **if ( ( ( num > 5 ) && ( num < 10 ) ) || ( num == 12 ) )**


    **System.out.println( “Number is 6-9 inclusive, or 12” ) ;**


    ![image](images/7g.jpg)Recompile the program, and run it once more to see the
    statement after the complex expression get executed


    ![image](images/pg45_1.jpg)


    ![image](images/8g.jpg)Change the value assigned to the **num** variable so it
    is neither within the specified range 6-9, or exactly 12\. Recompile the program,
    and run it again to now see the statement after the complex expression is not
    executed


    ![image](images/hot.jpg)


    The range can be extended to include the upper and lower limits using the **>=**
    and **<=** operators.


    ![image](images/forget.jpg)


    The complex expression uses the **==** equality operator to specify an exact match,
    not the **=** assignment operator.


    **Branching alternatives**


    The **else** keyword is used in conjunction with the **if** keyword to create
    **if else** statements that provide alternative branches for a program to pursue
    – according to the evaluation of a tested expression. In its simplest form, this
    merely nominates an alternative statement for execution when the test fails:


    **if (** *test-expression* **)**


    *code-to-be-executed-when-true* **;**


    **else**


    *code-to-be-executed-when-false* **;**


    ![image](images/ycap.jpg)


    Each alternative branch may be a single statement or a statement block of multiple
    statements – enclosed within curly brackets.


    More powerful **if else** statements can be constructed that evaluate a test expression
    for each alternative branch. These employ nested **if** statements after each
    **else** keyword to specify each further test. When the program discovers an expression
    that evaluates as **true**, it executes the statements associated with just that
    test then exits the **if else** statement without exploring any further branches:


    ![image](images/1g.jpg)Start a new program named “Else” containing the standard
    main method


    **class Else**


    **{**


    **public static void main ( String[] args ) {          }**


    **}**


    ![image](images/j1.jpg)


    Else.java


    ![image](images/2g.jpg)Inside the main method, insert this line to declare and
    initialize an integer variable named **hrs**


    **int hrs = 11 ;**


    ![image](images/3g.jpg)Insert this simple conditional test, which executes a single
    statement when the value of the **hrs** variable is below 13


    **if ( hrs < 13 )**


    **{**


    **System.out.println( “Good morning: ” + hrs ) ;**


    **}**


    ![image](images/4g.jpg)Save the program as **Else.java** then compile and run
    the program to see the statement get executed


    ![image](images/pg47_1.jpg)


    ![image](images/snake.jpg)


    Notice that the first statement is terminated with a semicolon, as usual, before
    the else keyword.


    ![image](images/5g.jpg)Change the value assigned to the **hrs** variable to 15,
    then add this alternative branch right after the **if** statement


    **else if ( hrs < 18 )**


    **{**


    **System.out.println( “Good afternoon: ” + hrs ) ;**


    **}**


    ![image](images/6g.jpg)Save the changes, recompile, and run the program again
    to see just the alternative statement get executed


    ![image](images/pg47_2.jpg)


    It is sometimes desirable to provide a final **else** branch, without a nested
    **if** statement, to specify a “default” statement to be executed when no tested
    expression evaluates as **true**:


    ![image](images/7g.jpg)Change the value assigned to the **hrs** variable to 21,
    then add this default branch to the end of the **if else** statement


    **else System.out.println( “Good evening: ” + hrs ) ;**


    ![image](images/8g.jpg)Save the changes, recompile, and run the program once more
    to see just the default statement get executed


    ![image](images/pg47_3.jpg)


    ![image](images/forget.jpg)


    Conditional branching is the fundamental process by which computer programs proceed.


    **Switching branches**


    Lengthy **if else** statements, which offer many conditional branches for a program
    to pursue, can become unwieldy. Where the test expressions repeatedly evaluate
    the same variable value, a more elegant solution is often provided by a **switch**
    statement.


    ![image](images/ycap.jpg)


    The syntax of a typical switch statement block looks like this:


    **switch (** *test-variable* **)**


    **{**


    **case** *value1* **:** *code-to-be-executed-when-true* **; break ;**


    **case** *value2* **:** *code-to-be-executed-when-true* **; break ;**


    **case** *value3* **:** *code-to-be-executed-when-true* **; break ;**


    **default :** *code-to-be-executed-when-false* **;**


    **}**'
