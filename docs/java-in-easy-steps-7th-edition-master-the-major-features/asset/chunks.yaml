    ## 传递参数


    声明程序 `main` 方法的标准 Java 代码在其括号内包含一个参数，该参数创建一个 `String` 数组，传统命名为“args”：


    ```java

    public static void main( String[] args ) { }

    ```


    ![image](img/pg68_1.jpg)


    `args[]` 数组的目的是在调用程序运行时允许将值传递给程序。在命令行上，传递给程序的值添加在程序名后的单个空格之后。例如，向名为“Run”的程序传递
    `String` 值“Java”的命令是 `Run Java`。


    传递给程序的单个值会自动放置在 `args[]` 数组的第一个元素中，因此程序可以通过 `args[0]` 访问它。


    重要的是 `args[]` 数组是 `String` 类型。数组中元素的总数以整数形式存储在该数组的 `length` 属性中。访问该数字的语法只需在数组名后加上一个点和“length”。例如，`numbersArray.length`
    将返回上述示例中数组的大小——在这种情况下，为整数 3。


    数组也可以通过 `new` 关键字创建一个指定大小的空数组“对象”，从而在声明时不分配初始值列表来声明一个空数组。所需的空元素数量在适宜数据类型后的方括号内的赋值语句中指定。记住数组索引从零开始。这意味着
    `index[2]` 访问数组中的第三个元素，而不是第二个元素。


    ![image](img/1p.jpg)启动一个名为“Array”的新程序，包含标准的 main 方法


    ```

    class Array

    {

    public static void main ( String[] args ) { }

    }

    ```


    ![image](img/common.jpg)


    Array.java


    ![image](img/2p.jpg)在 main 方法内部，声明并初始化一个具有三个元素的 `String` 数组


    ```

    String[] str = { “Much ”, “More”, “ Java” } ;

    ```


    ![image](img/3p.jpg)声明一个具有三个元素的空整数数组


    ```

    intint num = new int[3] ;

    ```


    ![image](img/4p.jpg)给前两个整数数组元素赋值


    ```

    num[0] = 100 ;

    num[1] = 200 ;

    ```


    ![image](img/5p.jpg)给第二个 String 数组元素赋新值


    ```

    str[1] = “Better” ;

    ```


    ![image](img/6p.jpg)输出每个数组的长度以及每个数组所有元素的内容


    ```java

    System.out.println( “String array length is “ + str.length ) ;

    System.out.println( “Integer array length is”+ num.length) ;

    System.out.println( num[0] + ”,” +num[1]+ ”,”+num[2] ) ;

    System.out.println( str[0] + str[1] + str[2] ) ;

    ```


    ![image](img/7p.jpg)将程序保存为 `Array.java`，然后编译并运行程序以查看输出。


    ![image](img/pg65_1.jpg)


    ![image](img/forget.jpg)


    `String` 值需要包含引号内。


    ## 传递多个参数


    可以在命令行向程序传递多个参数，跟在程序名和空格之后。参数之间必须由至少一个空格，其值将按顺序放入 `args[]` 数组的元素中。然后可以像任何其他数组一样通过索引数字访问每个值——`args[0]`
    是第一个参数，`args[1]` 是第二个参数，依此类推。


    '
- fmt: "\nThe program can test the `length` property of the `args[]` array to ensure\
    \ the user has entered the appropriate number of arguments. When the test fails,\
    \ the `return` keyword can be used to exit the `main` method, thereby exiting\
    \ the program:\n\n![image](images/1p.jpg)Start a new program named “Args” containing\
    \ the standard main method\n\n```java\nclass Args\n{\n    public static void main\
    \ ( String[] args ) {\n    }\n}\n```\n\n![image](images/common.jpg)\n\nArgs.java\n\
    \n![image](images/2p.jpg)Inside the main method, write an `if` statement to output\
    \ advice and exit the program when there are not the required number of arguments\
    \ – in this case, three\n\n```java\nif ( args.length != 3 )\n{\n    System.out.println(\
    \ “Wrong number of arguments” ;\n    return ;\n}\n```\n\n![image](images/3p.jpg)Below\
    \ the `if` statement, create two `int` variables – initialized with the values\
    \ of the first argument and third argument respectively\n\n```java\nint num1 =\
    \ Integer.parseInt( args[0] ) ;\nint num2 = Integer.parseInt( args[2] ) ;\n```\n\
    \n![image](images/4p.jpg)Add a `String` variable, initialized with a concatenation\
    \ of all three arguments\n\n```java\nString msg = args[0] + args[1] + args[2]\
    \ + “=” ;\n```\n\n![image](images/hot.jpg)\n\nThe `return` keyword exits the current\
    \ method. It can also return a value to the point where the method was called.\
    \ See [here](#chapter06.html_pg99) for more details.\n\n![image](images/5p.jpg)Add\
    \ this `if else` statement to perform arithmetic on the arguments and append the\
    \ result to the `String` variable\n\n```java\nif ( args[1].equals(“+”) )     \
    \        msg += (num1 + num2);\nelse if ( args[1].equals(“-”) )      msg += (num1\
    \ - num2) ;\nelse if ( args[1].equals(“x”) )      msg += (num1 * num2) ;\nelse\
    \ if ( args[1].equals(“/”) )      msg += (num1 / num2) ;\nelse msg = “Incorrect\
    \ operator” ;\n```\n\n![image](images/6p.jpg)Insert this line at the end of the\
    \ main method to display the appended `String`\n\n```java\nSystem.out.println(\
    \ msg ) ;\n```\n\n![image](images/7p.jpg)Save the program as `Args.java` then\
    \ compile and run the program with three arguments – an integer, any arithmetical\
