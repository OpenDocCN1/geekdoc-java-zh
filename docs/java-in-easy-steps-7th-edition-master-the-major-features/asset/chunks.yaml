    \ “Original String Length: “ + txt.length() ) ;\n```\n\n![image](img/5o.jpg)移除开头和结尾的空格，然后再次输出\
    \ `String` 值及其大小\n\n```java\ntxt = txt.trim() ;\nSystem.out.println( “String:\
