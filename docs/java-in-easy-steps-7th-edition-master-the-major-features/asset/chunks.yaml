    # 总结


    ## 简介


    Java™ 编程语言由 Sun Microsystems 的工程师詹姆斯·高林（James Gosling）于 1990 年首次开发。他不喜欢使用 C++
    编程语言，因此创建了一种新语言，并将其命名为“Oak”（橡树），这是他在办公室窗外外看到的一棵树。


    ![image](img/pg8_1.jpg)


    这是“Duke”（迪克）——Java 编程语言的亲切吉祥物。


    随着世界网的日益普及，Sun 公司意识到高林编写的这种语言可以针对互联网进行开发。因此，Sun 公司将该语言重命名为“Java”（仅仅是因为这个名字听起来很酷），并于
    1995 年免费提供。全球的开发者很快采用了这种令人兴奋的新语言，并且由于其模块化设计，他们能够创建添加到核心语言中的新功能。最受喜爱的额外功能被保留在 Java
    后后的发布版本中，并发展成为当今的全面版本。


    Java 的本质是一个称为“类”（classes）的文件库，每个类都包含小段现成的、经过验证的代码。这些类中的任何一个都可以像墙上的砖块一样整合到新程序中，因此只需要编写相对少的新代码即可完成程序。这为程序员节省了大量时间，并在很大程度上解释了
    Java 编程如此受欢迎的原因。此外，这种模块化安排比单一大型程序更容易识别任何错误。


    Java 技术既是一种编程语言也是一个平台。在 Java 编程中，源代码首先以可 java` 的文件编写，由 `javac` 编译器编译为机器可读的 `.class`
    文件。然后，`java` 解释器可以通过 Java 虚拟机（Java VM）的实例来执行程序：


    ![image](img/pg8_2.jpg)


    由于 Java VM 可运行在许多不同的操作系统上，相同的 `.class` 文件能够在 Windows、Linux 和 Mac 操作系统上运行——因此 Java
    程序员在理论上享有“编写一次，随处运行”的跨平台能力。


    ![image](img/hot.jpg)


    JAVA 代表“另一个模糊的缩写”（Just Another Vague Acronym）的传言并非事实。


    为了创建 Java 程序，需要在你的计算机上安装 Java 类库和 `javac` 编译器。为了运行 Java 程序，需要安装 Java™ 运行环境（JRE）以提供
    `java` 解释器。所有这些组件都包含在一个免费提供的 Java SE（标准版）开发工具包（JDK）中。


    JDK 包适用于 32 位和 64 位的 Linux、Mac 和 Windows 平台——选择适合你计算机的版本来开始 Java 编程。


    ## Oracle JDK


    Oracle 公司收购了 Sun JDK 并将其重命名为 Oracle JDK。这是 Java SE（标准版）的正式专有版本，由 Oracle 团队维护。


    ![image](img/pg9_1.jpg)


    通过 [www.oracle.com/java](http://www.oracle.com/java) 了解更多关于 Oracle Java 软件的信息。


    ## OpenJDK


    Java SE（标准版）的官方参考实现名为“OpenJDK”（Open Java Development Kit）。这是一个完全免费的开源版本，由 Oracle
    和整个 Java 社区支持。


    OpenJDK 每六个月发布一次新版本，并有多个实现可供选择。本书推荐的实现是由 **[adoptopenjdk.net](http://www.adoptopenjdk.net)**
    AdoptOpenJDK 社区小组提供的。


    ![image](img/pg9_2.jpg)


    在 [openjdk.java.net](http://openjdk.java.net) 学习更多关于 OpenJDK 的信息。


    ![image](img/pg9_3.jpg)


    ## 安装 JDK


    为你的系统下载合适的 JDK 包。为了运行 Java 程序，需要安装 Java™ 运行环境（JRE）以提供 `java` 解释器。所有这些组件都包含在一个免费提供的
    Java SE（标准版）开发工具包（JDK）中。


    JDK 包适用于 Linux、Mac 和 Windows 平台的 32 位和 64 位变体——选择适合你计算机的版本来开始 Java 编程。


    ![image](img/pg10_1.jpg)


    ![image](img/1b.jpg)JDK 包含几个可执行文件，分别是 Java 编译器、Java 壳和 Java 虚拟机。虚拟机。


    ![image](img/pg10_2.jpg)


    ![image](img/2b.jpg)对于 Windows，从 OpenJDK 网站下载安装包，然后按照以下步骤安装 JDK：


    ![image](img/pg10_3.jpg)


    ![image](img/3b.jpg)点击 **Next** 继续，接受许可协议并再次点击 **Next**。


    ![image](img/pg10_4.jpg)


    ![image](img/4b.jpg)将位置更改为 `C:\Java` 并选择“添加到路径”选项，然后点击 **Next**。


    ![image](img/pg10_5.jpg)


    对于 Linux，首先解压下载的 `tar.gz` 文件，通过编辑主目录下的 `.bashrc` 文件将 Java 的 `bin` 添加到路径：`PATH=$PATH:/usr/Java`


    ![image](img/pg11_1.jpg)


    ![image](img/1b.jpg)按下 **Winkey** + **R** 打开“运行”窗口，然后输入 `cmd` 命令提示符窗口——或在 Linux
    上打开终端窗口。


    ![image](img/pg11_2.jpg)


    ![image](img/3b.jpg)Windows 键


    在提示符处输入 `java -version` 命令查看 JDK 版本（如下方所示的 Xs）。


    ![image](img/pg11_3.jpg)


    现在，输入 `jshell -version` 命令查看 Java 壳版本——你准备好开始 Java 编程了！


    ![image](img/pg11_4.jpg)


    ![image](img/pg11_5.jpg)Java 壳 `jshell` 是一个交互式工具，允许你测试代码片段，无需先编译代码。它用于第 2 章演示各种“运算符”。


    ## 编写第一个 Java 程序


    所有的 Java 程序都从文本文件开始，随后用于创建“类”文件，这些实际的可运行程序。这意味着 Java 程序可以使用任何文本编辑器编写，例如 Windows
    的记事本或 Linux 的 Nano。


    ![image](img/pg12_1.jpg)


    按照以下步骤创建一个简单的 Java 程序，它将输出传统的第一个程序问候：


    ![image](img/1b.jpg)打开文本编辑器（如记事本），并按照列出的内容输入此代码以创建一个名为“Hello”的类


    ```java

    class Hello {

    }

    ```


    ![image](img/common.jpg)

    Hello.java


    ![image](img/2b.jpg)在 **Hello** 类的大括号之间插入此代码以为 **Hello** 类创建一个“main”方法


    ```java

    public static void main ( String[] args )

    {

    }

    ```


    ![image](img/3b.jpg)在 **main** 方法的大括号之间插入此行代码——说明程序将要做什么


    ```java

    System.out.println( “Hello World!” ) ;

    ```


