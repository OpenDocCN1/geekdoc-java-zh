    The **main( )** method creates an instance of the app, and calls upon **ClassLoader(
    )** to seek the image file resource **Lotto.png** in the same directory as the
    program file. The files must be arranged in this way before attempting to compile
    the program.


    ![image](images/pg169_3.jpg)


    ![image](images/hot.jpg)


    The Lotto program is used throughout this chapter to create apps for desktop and
    handheld devices.


    Observing the required file arrangement, the **javac** compiler can be employed
    in the usual way to create a **Lotto.class** file, then the **java** interpreter
    can be employed to execute the program:


    ![image](images/pg169_4.jpg)


