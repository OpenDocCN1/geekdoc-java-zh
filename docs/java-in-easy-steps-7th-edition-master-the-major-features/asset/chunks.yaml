    | **== !=** | Equality, Inequality |


    | **&&** | Logical AND |


    | **&#124;&#124;** | Logical OR |


    | **? :** | Conditional |


    | **= += -= *= /= %=** | Assignment |


    ![image](images/hot.jpg)


    Operators of equal precedence are handled in the order they appear in the expression
    – from left to right.


    Follow these steps to explore operator precedence in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type **jshell**
    and hit the **Enter** key to launch the Java shell


    ![image](images/2r.jpg)Next, enter a statement to display the result of evaluating
    an expression that uses default operator precedence


    **int sum = 32 - 8 + 16 * 2 ;**


    ![image](images/pg37_1.jpg)


    ![image](images/3r.jpg)Now, enter a statement to display the result of evaluating
    the same expression – but giving addition and subtraction precedence over multiplication


    **sum = ( 32 - 8 + 16 ) * 2 ;**


    ![image](images/pg37_2.jpg)


    ![image](images/4r.jpg)Finally, enter a statement to display the result of evaluating
    the same expression once more – but now where operation precedence order is first
    addition, then subtraction, and then multiplication


    **sum = ( 32 - ( 8 + 16 ) ) * 2 ;**


    ![image](images/pg37_3.jpg)


    ![image](images/forget.jpg)


    Where expressions have multiple nested parentheses, the innermost takes precedence.


    ![image](images/hot.jpg)


    How it works – Step 2...


    **16 x 2 = 32, + 24 = 56**


    Step 3...


    **24 + 16 = 40, x 2 = 80**


    Step 4...


    **32 - 24 = 8, x 2 = 16**


    ![image](images/hot.jpg)


    This chapter has so far used the Java shell **jshell** to explore the various
    Java operators by evaluating code snippets. Ensuing examples will use the Java
    compiler **javac** and Java runtime **java** to create and execute programs. You
    can quit the Java shell to return to a regular prompt with the command **/exit**.


    **Escaping literals**


    The numerical and text values in Java programs are known as “literals” – they
    represent nothing but are, literally, what you see.


    ![image](images/pg38_1.jpg)'
