    **Forming multiple methods**


    Programs are typically split into separate methods in order to create modules
    of code that each perform tasks, and that can be called repeatedly throughout
    the program as required. Splitting the program into multiple methods also makes
    it easier to track down bugs, as each method can be tested individually. Further
    methods may be declared, inside the curly brackets that follow the class declaration,
    using the same keywords that are used to declare the main method. Each new method
    must be given a name, following the usual naming conventions, and may optionally
    specify arguments in the parentheses after its name.


    ![image](images/pg98_1.jpg)


    ![image](images/1bl.jpg)Start a new program named “Methods” containing the standard
    main method


    **class Methods**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


