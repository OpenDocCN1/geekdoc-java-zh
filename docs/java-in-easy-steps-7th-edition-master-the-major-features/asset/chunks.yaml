  trans: "\n该程序可以测试 `args[]` 数组的 `length` 属性，以确保用户输入了数量参数。当测试失败时，可以使用 `return` 关键字退出\
    \ `main` 方法，从而退出程序：\n\n![image](img/1p.jpg)启动名为“Args”的新程序，包含标准的 main 方法\n\n```java\n\
    class Args\n{\n    public static void main ( String[] args ) {\n    }\n}\n```\n\
    \n![image](img/common.jpg)\n\nArgs.java\n\n![image](img/2p.jpg)在 main 方法内部，编写一个\
    \ `if` 语句，当没有从命令行 `args[]` 数组中输入所需的数量参数时，输出建议并退出程序——在这种情况下，数量为三个\n\n```java\n\
    if ( args.length != 3 )\n{\n    System.out.println( “Wrong number of arguments”\
    \ ;\n    return ;\n}\n```\n\n![image](img/3p.jpg)在 `if` 语句下方创建两个 `int` 变量——分别初始化为第一个参数和第三个参数的值\n\
    \n```java\nint num1 = Integer.parseInt( args[0] ) ;\nint num2 = Integer.parseInt(\
    \ args[2] ) ;\n```\n\n![image](img/4p.jpg)添加一个 `String` 变量，初始化为所有三个参数的拼接\n\n```java\n\
    String msg = args[0] + args[1] + args[2] + “=” ;\n```\n\n![image](img/hot.jpg)\n\
    \n`return` 关键字退出当前方法。它还可以将值返回到调用方法的地方。更多详情请参阅此处。\n\n![image](img/5p.jpg)添加此 `if\
    \ else` 语句对参数进行算术运算，并将结果附加到 `String` 变量\n\n```java\nif ( args[1].equals(“+”) )\
    \             msg += (num1 + num2);\nelse if ( args[1].equals(“-”) )      msg\
    \ += (num1 - num2) ;\nelse if ( args[1].equals(“x”) )      msg += (num1 * num2)\
    \ ;\nelse if ( args[1].equals(“/”) )      msg += (num1 / num2) ;\nelse msg = “Incorrect\
    \ operator” ;\n```\n\n![image](img/6p.jpg)在 main 方法末尾插入此行以显示附加的 `String`\n\n```java\n\
    System.out.println( msg ) ;\n```\n\n![image](img/7p.jpg)将程序保存为 `Args.java`，然后使用三个参数编译并运行程序——一个整数、任何算术符号\
    \ + - x /，以及另一个整数\n\n![image](img/pg69_1.jpg)\n\n![image](img/8p.jpg)现在，使用错误的第二个参数和错误的参数数量运行程序\n\
    \n![image](img/pg69_2.jpg)\n\n![image](img/hot.jpg)\n\n如果输入了非数值，此程序将报告错误。关于如何捕获错误的详情，请参阅此处。\n\
    \n## 遍历元素\n\n所有类型的循环都可以轻松读取存储在数组元素中的所有值。循环计数器应该从第一个元素的索引开始，然后一直进行到最后一个索引。数组中最后一个元素的索引始终比数组长度少\
    \ 1——因为索引从零开始。\n\n![image](img/arrowp.jpg)\n\n将数组的 `length` 属性设置为循环的条件测试，以确定循环何时结束是很有用的。这意味着循环将持续到计数器值超过数组最后一个元素的索引。\n\
