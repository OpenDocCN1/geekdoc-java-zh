- fmt: "\nJava contains a package named `java.io` that is designed to handle file\
    \ input and output procedures. The package can be made available to a program\
    \ by including an `import` statement at the very beginning of the `.java` file.\
    \ This can use the wildcard wildcard character to mean “all classes” in the statement\
    \ `import java.io.* ;`.\n\n![image](images/pg116_1.jpg)\n\nThe `java.io` package\
    \ has a class named `File` that can be used to access files or complete directories.\
    \ A `File` object must first be created using the `new` keyword and specifying\
    \ the filename, or directory name, as the constructor’s argument. For example,\
    \ the syntax to create a `File` object named `info` to represent a local file\
    \ named `info.dat` looks like this:\n\n```\nFile info = new File( “info.dat” )\
    \ ;\n```\n\nThis file would be located in the same directory as the program, but\
    \ the argument could state the path to a file located elsewhere. Note that the\
    \ creation of a `File` object does not actually create a file, but merely the\
    \ means to represent a file.\n\nOnce a `File` object has been created to represent\
    \ a file, its methods can be called to manipulate the file. The most useful `File`\
    \ object methods are listed in this table, together with a brief description:\n\
    \n| `Method:` | `Returns:` |\n| :--- | :--- |\n| `exists()` | `true` if the file\
    \ exists – `false` if it does not |\n| `getName()` | the filename as a `String`\
    \ |\n| `length()` | number of bytes in the file, as a `long` type |\n| `createNewFile()`\
    \ | `true` if able to create the new unique file |\n| `delete()` | `true` if able\
    \ to successfully delete the file |\n| `renameTo(File)` | `true` if able to successfully\
    \ rename the file |\n| `list()` | an array of file or folder names as `Strings`\
    \ |\n\n![image](images/forget.jpg)\n\nThe filename specified as the constructor\
    \ argument must be enclosed within quotes.\n\n![image](images/1v.jpg)Start a new\
    \ program that imports the functionality of all the `java.io` classes\n\n```\n\
    import java.io.* ;\n```\n\n![image](images/common.jpg)\n\nListFiles.java\n\n![image](images/2v.jpg)Add\
    \ a class named “ListFiles” containing the standard main method\n\n```\nclass\
    \ ListFiles\n{\n    public static void main( String[] args ) {      }\n}\n```\n\
    \n![image](images/3v.jpg)Between the curly brackets of the main method, insert\
    \ a statement to create a `File` object for a directory folder named “data”\n\n\
    ```\nFile dir = new File( “data” ) ;\n```\n\n![image](images/4v.jpg)Add an `if`\
    \ statement to output the names of all files in that folder, or a message if the\
    \ folder is empty\n\n```java\nif ( dir.exists() )\n{\n    String[] files = dir.list()\
    \ ;\n    System.out.println( files.length + “ files found...” ) ;\n    for ( int\
    \ i = 0 ; i < files.length ; i++ )\n    {\n               System.out.println(\
    \ files[i] ) ;\n    }\n}\nelse\n{              System.out.println( “Folder not\
    \ found.” ) ; }\n```\n\n![image](images/5v.jpg)Save the program as `ListFiles.java`\
    \ alongside a “data” folder containing some files, then compile and run the program\
    \ to see the filenames listed as output\n\n![image](images/pg117_1.jpg)\n\n###\
    \ Reading console input\n\nThe `java.io` package allows a program to read input\
    \ from the command line – interacting with the user. Just as the `System.out`\
    \ field can send output to the command line, the `System.in` field can be used\
    \ to read from it with an `InputStreamReader` object. This reads the input as\
    \ bytes, which it converts into integer values that represent Unicode character\
    \ values.\n\n![image](images/pg118_1.jpg)\n\nIn order to read an entire line of\
    \ input text, the `readLine()` method of a `BufferedReader` object reads the characters\
    \ decoded by the `InputStreamReader`. This method must be called from within a\
    \ `try catch` statement to catch any `IOException` problems.\n\nTypically, the\
    \ `readLine()` method will assign the input to a `String` variable for manipulation\
    \ by the program.\n\n![image](images/1v.jpg)Start a new program that imports the\
    \ functionality of all the `java.io` classes\n\n```\nimport java.io.* ;\n```\n\
    \n![image](images/common.jpg)\n\nReadString.java\n\n![image](images/2v.jpg)Add\
    \ a class named “ReadString” containing the standard main method\n\n```\nclass\
    \ ReadString\n{\n    public static void main( String[] args ) {           }\n\
    }\n```\n\n![image](images/3v.jpg)Between the curly brackets of the main method,\
    \ insert a statement to output a message prompting the user for input\n\n```java\n\
    System.out.print( “Enter the title of this book: “ ) ;\n```\n\n![image](images/4v.jpg)Add\
    \ a statement creating an `InputStreamReader` object, enabling input to be read\
    \ from the command line\n\n```java\nInputStreamReader isr = new InputStreamReader(\
    \ System.in ) ;\n```\n\n![image](images/5v.jpg)Create a `BufferedReader` object\
    \ to read the decoded input\n\n```java\nBufferedReader buffer = new BufferedReader(\
    \ isr ) ;\n```\n\n![image](images/6v.jpg)Declare and initialize an empty `String`\
    \ variable in which to store the input\n\n```java\nString input = ““ ;\n```\n\n\
    ![image](images/7v.jpg)Add a `try catch` statement to read the input from the\
    \ command line and store it in the variable\n\n```java\ntry\n{\n    input = buffer.readLine()\
    \ ;\n    buffer.close() ;\n}\ncatch ( IOException e )\n{\n    System.out.println(\
    \ “An input error has occurred” ) ;\n}\n```\n\n![image](images/8v.jpg)Output a\
    \ message that includes the stored value\n\n```java\nSystem.out.println( “\\nThanks,\
    \ you are reading “ + input ) ;\n```\n\n![image](images/9v.jpg)Save the program\
    \ as `ReadString.java` then compile and run the program\n\n![image](images/pg119_1.jpg)Enter\
    \ text as prompted, then hit Return to see the output\n\n![image](images/10v.jpg)\n\
    \n![image](images/hot.jpg)It is good practice to call the `close()` method of\
    \ the `BufferedReader` when it is no longer needed.\n\n### Reading files\n\nThe\
    \ `java.io` package contains a class named `FileReader` that is especially designed\
    \ to read text files. This class is a subclass of `InputStreamReader` that can\
    \ be used to read console input by converting a byte stream into integers that\
    \ represent Unicode character values.\n\n![image](images/pg120_1.jpg)\n\nIn order\
    \ to efficiently read the text file line-by-line, the `readLine()` method of a\
    \ `BufferedReader` object can be employed. This method must be called from within\
    \ a `try catch` statement to catch any `IOException` problems that may arise.\n\
    \nReading all lines in a text file containing multiple lines is accomplished by\
    \ making repeated calls to the `readLine()` method. At the end of the file the\
    \ call will return a `null` value, which can be used to terminate the loop.\n\n\
    ![image](images/1v.jpg)Open a plain text editor, such as Windows Notepad, and\
    \ write a few lines of text – for example, a famous verse from “The Ballad of\
    \ Reading Gaol” by Oscar Wilde\n\n![image](images/pg120_2.jpg)\n\n![image](images/2v.jpg)Save\
    \ the text file as `Oscar.txt** then start a new program that imports the functionality\
    \ of all `java.io` classes\n\n```\nimport java.io.* ;\n```\n\n![image](images/common.jpg)\n\
    \nReadFile.java\n\n![image](images/3v.jpg)Add a class named “ReadFile” containing\
    \ the standard main method\n\n```\nclass ReadFile\n{\n    public static void main(\
    \ String[] args ) {      }\n}\n```\n\n![image](images/4v.jpg)Between the curly\
    \ brackets of the main method, insert a `try catch` statement\n\n```java\ntry\
    \ {      }\ncatch ( IOException e )\n{\n    System.out.println( “A read error\
    \ has occurred” ) ;\n}\n```\n\n![image](images/5v.jpg)Between the curly brackets\
    \ of the `try` block, insert a statement to create a `FileReader` object\n\n```java\n\
    FileReader file = new FileReader( “Oscar.txt” ) ;\n```\n"
