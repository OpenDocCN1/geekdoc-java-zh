    赋值运算符列如下表所示，用于为表达式的结果赋值。除了简单的 `=` 运算符外，所有的都是更长表达式的简写形式：


    ![image](img/pg28_1.jpg)


    | **运算符：** | **示例：** | **等价：** |

    | :--- | :--- | :--- |

    | `=` | `a = b` | `a = b` |

    | `+=` | `a += b` | `a = a + b` |

    | `-=` | `a -= b` | `a = a - b` |

    | `*=` | `a *= b` | `a = a * b` |

    | `/=` | `a /= b` | `a = a / b` |

    | `%=` | `a %= b` | `a = a % b` |


    将 `=` 运算符视为“赋值”而不是“等于”，以避免与 `==` 相等运算符混淆。


    在示例 `a = b` 中，存储在命名变量 `b` 中的值被赋值给名为 `a` 的变量，使得该值成为存储在 `a` 中的新值——替换掉它之前包含的任何值。


    `+=` 运算符用于将一个值加到变量存储的现有值上——保持一个“运行总计”。


    示例 `a += b` 首先计算存储在命名变量 `a` 和 `b` 中的值的总和，然后将得到的总和赋值给变量 `a`。程序随后可能会包含进一步的赋值 `a
    += c`，它计算存储在命名变量 `a` 和 `c` 中的总和，然后将该新总和赋值给 `a`——将 `c` 的值加到它之前包含的值上。


    所有其他赋值运算符的运行方式都相同：首先对两个存储的值进行算术计算，然后将结果赋值给第一个变量——成为其新的存储值。


    ![image](img/hot.jpg)


    `==` 相等运算符用于比较两个值，其详细解释请参见此处。


    按照以下步骤在 Java 交互式外壳（Java shell）中探索 Java 赋值运算符：


    ![image](img/1r.jpg)打开一个命令行提示提示符窗口，然后输入 `jshell` 并按 `Enter` 键启动 Java 交互式外壳


    ![image](img/2r.jpg)接下来，输入语句初始化两个 `String` 变量


    ```java

    String txt = “Super ” ; String lang = “Java” ;

    ```


    ![image](img/3r.jpg)现在，分别输入语句添加并赋值一个 `String` 值，然后显示拼接后的字符串结果


    ```java

    txt += lang ; txt ;

    ```


    ![image](img/pg29_1.jpg)


    ![image](img/4r.jpg)然后输入语句初始化两个整数变量


    ```java

    int sum = 10 ; int num = 20 ;

    ```


    ![image](img/5r.jpg)分别输入语句添加并赋值一个 `int` 值，然后显示加总后的整数结果


    ```java

    sum += num ; sum ;

    ```


    ![image](img/pg29_2.jpg)


    ![image](img/hot.jpg)


    Java 交互式外壳会创建带有 `$` 前缀的内部编号变量，包含评估的结果。在这里，内部变量 `$3` 和 `$7` 包含评估结果。


    ![image](img/snake.jpg)


    为变量分配错误的数据类型将导致错误。


    ### 比较值


    比较运算符列如下表所示，用于比较表达式中的两个值，并返回一个单一的 `true` 或 `false` 布尔值——描述该比较的结果。


    ![image](img/pg30_1.jpg)


    | **运算符：** | **比较：** |

    | :--- | :--- |

    | `==` | 等于 |

    | `!=` | 不等于 |

    | `>` | 大于 |

    | `>=` | 大于等于 |

    | `<` | 小于 |

    | `<=` | 小于等于 |


    `==` 相等运算符比较两个操作数，如果两者的值完全相等，则返回 `true`。如果两个都是相同的数字，它们就是相等的；如果两个都是包含相同字符且顺序相同的
    `String` 值，它们就是相等的。两个都为 `true` 或两个都为 `false` 的布尔操作数是相等的。


    相反，`!=` 不等于运算符在两个操作数不相等时返回 `true`——适用与相等运算符相同的规则。


    相等和不等运算符在测试两个变量的状态以执行程序的“条件分支”时非常有用——根据条件向不同的方向执行。


    `>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回 `true`。


    `<` “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个，则返回 `true`。


    在 `>` “大于”运算符或 `<` “小于”运算符后添加 `=` 赋值运算符，可以使其在两个操作数的值完全相等时也返回 `true`。


    ![image](img/hot.jpg)


    `<` 小于运算符通常用于测试循环中的计数器值——可以在此处 找到此类的示例。


    按照以下步骤在 Java 交互式外壳中探索 Java 比较运算符：


    ![image](img/1r.jpg)打开一个命令行提示符窗口，然后输入 `jshell` 并按 `Enter` 键启动 Java 交互式外壳


    ![image](img/2r.jpg)接下来，输入语句初始化两个 `String` 变量


    ```java

    String txt = “Super ” ; String lang = “Java” ;

    ```


    ![image](img/3r.jpg)现在，分别输入语句添加并赋值一个 `String` 值，然后显示拼接后的字符串结果


    ```java

    txt += lang ; txt ;

    ```


    ![image](img/pg29_1.jpg)


    ![image](img/4r.jpg)然后输入语句初始化两个整数变量


    ```java

    int sum = 10 ; int num = 20 ;

    ```


    ![image](img/5r.jpg)分别输入语句添加并赋值一个 `int` 值，然后显示加总后的整数结果


    ```java

    sum += num ; sum ;

    ```


    ![image](img/pg29_2.jpg)


    ![image](img/hot.jpg)


    Java 交互式外壳会创建带有 `$` 前缀的内部编号变量，包含评估的结果。在这里，内部变量 `$3` 和 `$7` 包含评估结果。


    ![image](img/snake.jpg)


    为变量分配错误的数据类型将导致错误。


    ### 逻辑评估


    逻辑运算符如下表所示，用于将多个每个返回布尔值的表达式组合成一个返回单一值的复杂表达式。


    ![image](img/pg32_1.jpg)


    | **运算符：** | **操作：** |

    | :--- | :--- |

    | `&&` | 逻辑与 |

    | `||` | 逻辑或 |

    | `!` | 逻辑非 |


    逻辑运算符用于具有 `true` 或 `false` 布尔值的操作数，或可以转换为 `true` 或 `false` 的值。


    逻辑 `&&` 与评估两个操作数，只有当两个操作数都为 `true`时才返回 `true`。否则，逻辑 `&&` 运算符返回 `false`。这种评估可以用于条件分支，只有当两个测试条件都成立时，程序才会执行某些操作。


    与需要两个操作数均为 `true` 的逻辑 `&&` 运算符不同，逻辑 `||` 或运算符评估两个操作数，如果其中一个为 `true`，则返回 `true`——只有当两个操作数都不为
    `true` 时才会返回 `false`。这在 Java 编程中非常有用，可以在满足两个条件之一时执行某些操作。


    逻辑 `!` 非运算符是一个用于单个操作数的一元运算符。它返回给定操作数的反转布尔值——将 `true` 变为 `false`，将 `false` 变为 `true`。它在
    Java 程序中非常有用，可以在连续循环迭代中切换变量的值，使用类似 `goState=!goState` 的语句。这确保值在每次循环中都会发生变化，就像开关灯一样。


    “布尔”（Boolean）一词是指英国数学家乔治·布尔（George Boole，1815-1864）开发的一种逻辑系统。


    你可以在 Java 交互式外壳中通过输入 `/help` 命令发现更多选项。


