    \n## 总结\n\n- 程序开头可以包含一个或多个 `import` 语句，以便可以使用其他类的功能。\n- `import` 语句可以使用通配符字符导入包中的所有类，也可以通过名称导入单个类。\n\
    - `java.io` 包包含设计用于处理输入输出过程的类。\n- `File` 对象可以用于访问文件和目录。\n- `InputStreamReader`\
    \ 对象将输入字节解码为字符，而 `BufferedReader` 读取其解码后的字符。\n- `FileReader` 对象可以用于将文本文件字节解码为字符，供\
    \ `BufferedReader` 对象读取。\n- `FileWriter` 对象和 `BufferedWriter` 对象可以创建和更新文本文件。\n\
    - `java.util` 包包含处理数据集合的工具类，例如使用其 `Arrays` 类进行数组操作。\n- `java.util` 包还包含一个 `ArrayList`\
    \ 类，它拥有可以轻松操作顺序化列表项的方法。\n- `ArrayList` 对象是一个集合（Collection），它必须指定列表可能包含的项泛型类型，例如\
    \ `<String>`。\n- Lambda 表达式是一个匿名方法，可以指定其执行的位置。\n- `java.time` 包包含一个 `LocalDateTime`\
    \ 类，该类提供了日期和时间组件的字段。\n- `java.text` 包包含一个 `NumberFormat` 类，可格式化数字和货币。\n- `java.time.format`\
    \ 包包含一个 `DateTimeFormatter` 类，可以指定格式化日期和时间的模式。\n\n## 构建接口\n\n本章演示了如何使用 Java Swing\
    \ 组件创建图形化程序界面。\n\n- 创建窗口\n- 添加推送按钮\n- 添加标签\n- 添加文本字段\n- 添加项目选择器\n- 添加单按钮\n- 排列组件\n\
    - 更改外观\n- 总结\n\n### 创建窗口\n\n程序可以使用 Swing 组件提供图形用户界面（GUI）。`javax.swing` 包包含了使用原生操作系统创建各种组件的类。\n\
    \n必须通过使用 `extends` 关键字声明 `JFrame` 的子类来创建一个类。类的构造函数应该包含设置这些要求的语句：\n\n- 窗口标题——作为\
    \ `JFrame` 类 `super()` 方法的参数。\n- 窗口大小——以像素作为参数传递给 `setSize()` 方法。\n- 用户关闭窗口时执行的操作——作为常量参数传递给\
    \ `setDefaultCloseOperation()` 方法。\n- 显示窗口——作为布尔参数传递给 `setVisible()` 方法。\n\n![image](img/snake.jpg)\n\
    \n通过记住 `JAVA` 来记住 `javax.swing` 中的 `x`。\n\n此外，构造函数可以将 `JPanel` 容器组件添加到窗口，可以使用\
    \ `JFrame` 类的 `add()` 方法添加小的组件。\n\n默认情况下，`JPanel` 容器采用 `FlowLayout` 布局管理器，该器从左到右布局组件，并在右边缘换行。\n\
    \n相反步骤描述了如何创建一个带有 `FlowLayout` 布局管理器的 `JPanel` 窗口。该窗口将出现在本书后续的示例中，这些示例演示了如何向 `JPanel`\
    \ 容器添加各种组件。\n\n![image](img/hot.jpg)\n\n布局管理器在此处有更详细的介绍](#chapter08.html_sec72)。\n\
    \n"
