    **Creating a window**


    Programs can provide a graphical user interface (GUI) using the “Swing” components
    of the Java library. The **javax.swing** package contains classes to create a
    variety of components using the style of the native operating system. These can
    be made available to a program by including the initial statement **import javax.swing.*;
    .**


    ![image](images/pg134_1.jpg)


    A class must be created to represent the GUI to which components can be added
    to build the interface. This is easily achieved by declaring it a subclass of
    Swing’s **JFrame** class using the **extends** keyword – thereby inheriting attributes
    and behaviors that allow the user to move, resize, and close the window.


    The class constructor should include statements to set these minimum requirements:


    •The title of the window – specified as a **String** argument to the inherited
    **super()** method of the **JFrame** class.


    •The size of the window – specified as width and height in pixels as arguments
    to its **setSize()** method.


    •What to do when the user closes the window – specified as a constant argument
    to its **setDefaultCloseOperation()** method.


    •Display the window – specified as a Boolean argument to its **setVisible()**
    method.


    ![image](images/snake.jpg)


    Remember the letter **x** in **javax.swing** by thinking of **JAVA** e**X**tra.


    Additionally, the constructor can add a **JPanel** container component to the
    window, in which smaller components can be added, using the inherited **add()**
    method of the **JFrame** class.


    By default, a **JPanel** container employs a **FlowLayout** layout manager that
    lays out components in left-to-right lines, wrapping at the right edge of the
    window.


    The steps opposite describe how to create a basic window containing a **JPanel**
    container with a **FlowLayout** layout manager. This window is featured in subsequent
    examples in this book that demonstrate how to add various components to the **JPanel**
    container.


    ![image](images/hot.jpg)


    Layout managers are described in more detail [here](#chapter08.html_sec72).


