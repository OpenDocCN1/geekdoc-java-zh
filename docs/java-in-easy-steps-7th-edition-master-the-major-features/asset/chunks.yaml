    **Handling item events**


    Swing **JRadioButton**, **JCheckBox** and **JComboBox** components maintain states
    whose change can be recognized by the **ItemListener** interface, which will pass
    the **ItemEvent** to its **itemStateChanged()** event-handler method. The **ItemEvent**
    object has a **getItemSelectable()** method that identifies the originating component,
    and a **getStateChange()** method that returns its status. This will determine
