    ## Introduction


    The Java™ programming language was first developed in 1990 by an engineer at Sun
    Microsystems named James Gosling. He was unhappy using the C++ programming language
    so he created a new language that he named “Oak”, after the oak tree that he could
    see from his office window.


    ![image](images/pg8_1.jpg)


    This is “Duke” – the friendly mascot of the Java programming language.


    As the popularity of the World Wide Web grew, Sun recognized that Gosling’s language
    could be developed for the internet. Consequently, Sun renamed the language “Java”
    (simply because that name sounded cool) and made it freely available in 1995.
    Developers around the world quickly adopted this exciting new language and, because
    of its modular design, were able to create new features that could be added to
    the core language. The most endearing additional features were retained in subsequent
    releases of Java as it developed into the comprehensive version of today.


    The essence of Java is a library of files called “classes”, which each contain
    small pieces of ready-made proven code. Any of these classes can be incorporated
    into a new program, like bricks in a wall, so that only a relatively small amount
    of new code ever needs to be written to complete the program. This saves the programmer
    a vast amount of time, and largely explains the huge popularity of Java programming.
    Additionally, this modular arrangement makes it easier to identify any errors
    than in a single large program.


    Java technology is both a programming language and a platform. In Java programming,
    the source code is first written as human-readable plain text files ending with
    the `.java` extension. These are compiled into machine-readable `.class` files
    by the `javac` compiler. The `java` interpreter can then execute the program with
    an instance of the Java Virtual Machine (Java VM):


    ![image](images/pg8_2.jpg)


    As the Java VM is available on many different operating systems, the same `.class`
    files are capable of running on Windows, Linux, and Mac operating systems – so
    Java programmers theoretically enjoy the cross-platform ability to “write once,
    run anywhere”.


    ![image](images/hot.jpg)


    There is no truth in the rumor that JAVA stands for “Just Another Vague Acronym”.


    In order to create Java programs, the Java class libraries and the `javac` compiler
    need to be installed on your computer. In order to run Java programs, the Java™
    Runtime Environment (JRE) needs to be installed to supply the `java` interpreter.
    All of these components are contained in a freely available package called the
    Java SE (Standard Edition) Development Kit (JDK).


    The JDK package is available in versions for 32-bit and 64-bit variants of the
    Linux, Mac, and Windows platforms – select the version for your computer to get
    started with Java programming.


    ## Oracle JDK


    The Oracle Corporation bought the Sun JDK and renamed it to Oracle JDK. This is
    the formal proprietary version of the Java SE (Standard Edition), maintained by
    the Oracle team.


    ![image](images/pg9_1.jpg)


    Discover more about Oracle Java software at [www.oracle.com/java](http://www.oracle.com/java)


    ## OpenJDK


    The official reference implementation of the Java SE (Standard Edition) is named
    “OpenJDK” (Open Java Development Kit). This is a totally free open-source version,
    supported by Oracle and the Java community at large.


    OpenJDK delivers new releases every six months, and several implementations of
    these are available. The implementation recommended by this book it that provided
    by the AdoptOpenJDK community group at **[adoptopenjdk.net](http://www.adoptopenjdk.net)**


    ![image](images/pg9_2.jpg)


    Learn more on OpenJDK at [openjdk.java.net](http://openjdk.java.net)


    ![image](images/pg9_3.jpg)


    ## Installing the JDK


    Download the appropriate JDK package for your system from the AdoptOpenJDK website,
    shown [here](#chapter01.html_OpenJDK), then follow these steps to install the
    Java Development Kit on your computer:


    ![image](images/pg10_1.jpg)


    ![image](images/1b.jpg)Uninstall any previous versions of the JDK and/or Java
    Runtime Environment (JRE) from your system


    ![image](images/2b.jpg)For Windows, the download is currently a Microsoft Installer
    (`.msi`) file that will install the JDK package. Click on the download file icon
    to launch the installer


    ![image](images/pg10_2.jpg)


    ![image](images/3b.jpg)Click **Next** to continue, then accept the License Agreement
    terms and click **Next** once more


    ![image](images/4b.jpg)Change the Location to `C:\Java` and select the “Add to
    PATH” option, then click **Next** to install the JDK


    ![image](images/pg10_3.jpg)


    ![image](images/snake.jpg)On Linux, first extract the contents of the download
    `tar.gz` file to `/usr/Java`. Then add the location of Java’s `bin` to the system
    path by editing the `.bashrc` file in your home directory with `PATH=$PATH:/usr/Java/bin`


    ![image](images/hot.jpg)The JDK contains several folders. The `bin` folder holds
    executable files that are the Java compiler (`javac.exe`), Java shell (`jshell.exe`),
    and the Java VM (`java.exe`).


    You are now able to test your Java environment:


    ![image](images/1b.jpg)Press **Winkey** + **R**, to open a “Run” window, then
