    \ num2 ) ) ;\n```\n\n![image](images/5o.jpg)Save the program as `Compare.java`\
    \ then compile and run the program to see the output\n\n![image](images/pg85_1.jpg)\n\
    \n### Generating random numbers\n\nThe `Math` class within the `java.lang` package\
    \ provides the ability to generate random numbers with its `Math.random()` method,\
    \ which returns a `double` precision random number between 0.0 and 0.999\\. Multiplying\
    \ the random number will specify a wider range. For example, multiplying by 10\
    \ will create a random number in the range of 0.0 to 9.999\\. Now, rounding the\
    \ random number up with `Math.ceil()` will ensure it falls within the range of\
    \ 1-10 inclusive.\n\n![image](images/pg86_1.jpg)\n\n![image](images/1o.jpg)Start\
    \ a new program named “Random” containing the standard main method\n\n```java\n\
    class Random\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/common.jpg)\n\nRandom.java\n\n![image](images/2o.jpg)Inside the\
    \ main method, assign a random number to a `float` variable, and output its value\n\
    \n```java\nfloat random = (float) Math.random() ;\nSystem.out.println( “Random\
    \ number: “ + random ) ;\n```\n\n![image](images/3o.jpg)Assign a multiplication\
    \ of the random number to a second `float` variable, and output its value\n\n\
    ```java\nfloat multiplied = random * 10 ;\nSystem.out.println( “Multiplied number:\
    \ “ + multiplied ) ;\n```\n\n![image](images/4o.jpg)Assign a rounded integer of\
    \ the multiplied random number to an `int` variable, and output its value\n\n\
    ```java\nint randomInt = (int) Math.ceil( multiplied ) ;\nSystem.out.println(\
    \ “Random Integer: “ + randomInt ) ;\n```\n\n![image](images/5o.jpg)Save the program\
    \ as `Random.java` then compile and run the program to see the output\n\n![image](images/pg86_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe Lottery program described opposite combines\
    \ all three steps from this example into a single statement.\n\nA sequence of\
    \ six non-repeating random numbers within the range 1-59 inclusive can be generated\
    \ using `Math.random()` to produce a random lottery selection.\n\n![image](images/1o.jpg)Start\
    \ a new program named “Lottery” containing the standard main method\n\n```java\n\
    class Lottery\n{\n    public static void main ( String[] args ) { }\n}\n```\n\n\
    ![image](images/common.jpg)\n\nLottery.java\n\n![image](images/2o.jpg)Inside the\
    \ main method, create an `int` array of 60 elements, then fill elements 1-59 with\
    \ integers 1-59\n\n```java\nint[] nums = new int[60] ;\nfor( int i = 1 ; i < 60\
    \ ; i++ ) { nums[i] = i ; }\n```\n\n![image](images/3o.jpg)Shuffle the values\
    \ in elements 1-59\n\n```java\nfor( int i = 1 ; i < 60 ; i++ )\n{\n    int r =\
    \ (int) Math.ceil( Math.random() * 59 ) ;\n    int temp = nums[i] ;\n    nums[i]\
    \ = nums[r] ;\n    nums[r] = temp;\n}\n```\n\n![image](images/4o.jpg)Output only\
    \ elements 1-59\n\n```java\nfor ( int i = 1 ; i < 60 ; i++ ) {\n    System.out.print(\
    \ nums[i] + “ ” )\n}\n```\n\n![image](images/5o.jpg)Save the program as `Lottery.java`\
    \ then compile and run the program to see the output\n\n### Managing strings\n\
    \nIn Java, a `String` is a collection of characters. Each `String` is enclosed\
    \ within quotes:\n\n```java\nString txt1 = “My First” ;\nString txt2 = “” ;\n\
    String txt3 = “2” ;\nString txt4 = “null” ;\n```\n\nThe `String` class within\
    \ the `java.lang` package provides a `length()` method that will return the size\
    \ of a `String`. For example, to return the size of a `String` variable named\
    \ `txt` is `txt.length()`.\n\nThe `String` class also provides an alternative\
    \ to the `+` concatenation operator for joining `String` values. Its `concat()`\
    \ method requires a single argument specifying the second `String` to be appended.\
    \ For example, append `txt2` onto `txt1` using `txt1.concat(txt2)`.\n\n`Array.length`\
    \ is a property but `String.length()` is a method – so it must have trailing parentheses.\n\
    \n```java\nclass StringLength\n{\n    public static void main ( String[] args\
    \ ) {\n        String lang = “Java” ;\n        String series = “ in easy steps”\
    \ ;\n        String title = lang.concat(series) ;\n        System.out.print( “\\\
    ”” + title + “\\” has “ ) ;\n        System.out.println( title.length() + “ characters”\
    \ ) ;\n    }\n}\n```\n"
