    \ `String` 类型的项，因此 `ArrayList` 必须带有 `<String>` 后缀。\n\n集合（如 `ArrayList`）拥有一个 `forEach()`\
    \ 方法，该方法可以遍历列表中的每个元素。这使得遍历列表中包含的所有项变得简单。\n\n通过指定一个“Lambda 表达式”作为 `forEach()` 方法的参数，可以方便地轮流引用每个存储的列表项。Lambda\
    \ 表达式仅仅是短小的、匿名（未命名）方法，可以在它们要执行的地方指定。它们以括号开始，用于包含任何参数，然后跟上 `->` 字符序列，最后是语句块，语法如下：\n\
    \n```\n(*argument/s*) -> { *statement/s* }\n```\n\n参数的数据类型可以显式声明，也可以从上下文中推断——`(String\
    \ x)` 可以简单写为 `(x)`。此外，如果 Lambda 表达式语句块只包含一条语句，可以省略大括号。\n\n使用列表的 `forEach()` 方法，迭代中的当前元素值可以作为参数传递给\
