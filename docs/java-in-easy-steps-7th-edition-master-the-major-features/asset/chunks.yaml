  trans: "\n\n![image](img/2r.jpg)接下来，输入语句来初始化两个 `boolean` \n\n```java\nboolean yes\
    \ = true ; boolean no = false ;\n```\n\n![image](img/3r.jpg)输入语句测试两个条件是否都为真\n\n\
    ```java\nboolean result = ( yes && yes ) ; result = ( yes && no ) ;\n```\n\n![image](img/pg33_1.jpg)\n\
    \n![image](img/4r.jpg)输入语句测试其中任一个条件是否为真\n\n```java\nresult = ( yes || yes ) ;\n\
    result = ( yes || no ) ;\nresult = ( no || no ) ;\n```\n\n![image](img/5r.jpg)输入语句显示原始值和反反值\n\
    \n```java\nresult = yes ; result = !yes ;\n```\n\n![image](img/pg33_2.jpg)\n\n\
    ![image](img/hot.jpg)\n\nJava shell 也称为“REPL”，它是 Read（读取）、Evaluate（求值）、Print（打印）、Loop（循环）的缩写，描述了这种交互式工具。\n\
    \n![image](img/hot.jpg)\n\n注意 `false && false` 返回 `false` 而不是 `true` —— 这证明了“两个错并不出一个对”的格言。\n\
    \n![image](img/forget.jpg)\n\n由 `!` NOT 逻辑运算符返回的值是存储值的反值 —— 存储值本身保持不变。\n\n###\
    \ 检查条件\n\nJava 程序员最喜爱的运算符可能是 `? :` 条件运算符，它能以非常简洁的方式实现强大的语句。它不寻常的语法初看之下可能很难理解，但了解这个实用的运算符是非常值得的。\n\
    \n![image](img/pg34_1.jpg)\n\n条件运算符首先评估一个表达式的 `true` 或 `false` 值，然后根据求值结果返回两个给定的操作数之一。它的语法如下：\n\
    \n```\n( boolean-expression ) ? if-true-return-this : if-false-return-this ;\n\
    ```\n\n每个指定的操作数备选方案允许程序根据测试表达式返回的布尔值继续执行。例如，备选方案可以返回一个 `String` 值：\n\n```java\n\
    status = ( quit == true ) ? “Done!” : “Continuing...” ;\n```\n\n在这种情况下，当 `quit`\
    \ 变量为 `true` 时，条件运算符将第一个操作数的值赋值给 `status` 变量；否则，它赋值第二个操作数的值。\n\n在编写 Java 程序时的一种简便方法允许表达式在评估简单布尔值时可选地省略\
    \ `== true`，因此上面的示例可以简单写为：\n\n```java\nstatus = ( quit ) ? “Done!” : “Continuing...”\
    \ ;\n```\n\n条件运算符可以返回任何数据类型的值，并使用任何有效的测试表达式。例如，表达式可以使用大于 `>` 运算符来评估两个数值，然后根据结果返回一个布尔值：\n\
    \n```java\nbusted = ( speed > speedLimit ) ? true : false ;\n```\n\n同样，条件运算符可能使用不等\
    \ `!=` 运算符评估一个 `String` 值，然后根据结果返回一个数值：\n\n```java\nbodyTemperature = ( scale\
    \ != “Celsius” ) ? 98.6 : 37.0 ;\n```\n\n![image](img/hot.jpg)\n\n条件运算符也被称为“三元”运算符。\n\
    \n按照以下步骤在 Java shell 中探索 Java 条件运算符：\n\n![image](img/1r.jpg)打开命令行提示窗口，然后输入 `jshell`\
    \ 并按 `Enter` 键启动 Java shell\n\n![image](img/2r.jpg)接下来，输入语句来初始化两个 `int` 变量\n\n\
    ```java\nint num1 = 1357 ; int num2 = 2468 ;\n```\n\n![image](img/3r.jpg)声明另一个变量来存储测试结果\
    \ `String`\n\n```java\nString result ;\n```\n\n![image](img/4r.jpg)输入此语句判断第一个整数值是奇数还是偶数\n\
    \n```java\nresult = ( num1 % 2 != 0 ) ? “Odd” : “Even” ;\n```\n\n![image](img/pg35_1.jpg)\n\
    \n![image](img/5r.jpg)现在，输入此语句判断第二个整数值是奇数还是偶数\n\n```java\nresult = ( num2 % 2\
    \ != 0 ) ? “Odd” : “Even” ;\n```\n\n![image](img/pg35_2.jpg)\n\n![image](img/hot.jpg)\n\
    \n你还可以使用命令 `jshell --feedback verbose` 启动 Java shell，以便在每次求值后接收描述性输出。\n\n![image](img/hot.jpg)\n\
    \n注意未初始化的 `String` 变量返回一个特殊的 `null` 值 —— 表示它完全不包含内容。\n\n![image](img/forget.jpg)\n\
    \n在这里，当存在余数时，表达式为真。\n\n### 设置优先级\n\n包含多个运算符和操作数的复杂表达式如果没有明确操作执行顺序，就会产生歧义。这种缺乏清晰度很容易导致同一个表达式暗示不同的结果。例如，考虑这个复杂表达式：\n\
    \n```java\nnum = 8 + 4 * 2 ;\n```\n\n![image](img/pg36_1.jpg)\n\n从左到右计算：`8 + 4\
    \ = 12`，`12 * 2 = 24`，所以 `num = 24`。但从右到左计算：`2 * 4 = 8`，`8 + 8 = 16`，所以 `num =\
    \ 16`。\n\nJava 程序员可以通过添加括号来显式指定应该先执行哪个操作。在这种情况下，`(8 + 4) * 2` 确保在执行乘法之前执行加法 ——\
    \ 所以结果是 24 而不是 16。相反，`8 + (4 * 2)` 先执行乘法 —— 所以结果是 16 而不是 24。\n\n当括号没有指定优先级时，Java\
    \ 遵循下面的默认顺序：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `++` `--` `!` | 增、减、逻辑非 |\n|\
    \ `*` `/` `%` | 乘法、除法、取模 |\n| `+` `-` | 加法、减法 |\n| `>` `>=` `< `<=` | 大于、大于等于、小于、小于等于\
    \ |\n| `==` `!=` | 等于、不等 |\n| `&&` | 逻辑与 |\n| `\\|\\|` | 逻辑或 |\n| `? :` | 条件 |\n\
    | `=` `+=` `-=` `*=` `/=` `%=` | 赋值 |\n\n优先级相同的运算符按照它们在表达式中的顺序处理 —— 从左到右。当表达式有多个嵌套括号时，最内层的括号优先级最高。\n\
    \n工作原理 – 步骤 2...\n\n`16 x 2 = 32, + 24 = 56`\n\n步骤 3...\n\n`24 + 16 = 40, x 2\
    \ = 80`\n\n步骤 4...\n\n`32 - 24 = 8, x 2 = 16`\n\n本章到目前为止使用 Java shell **jshell**\
    \ 通过评估代码片段来探索各种 Java 运算符。后续示例将使用 Java 编译器 **javac** 和 Java 运行时 **java** 来创建和运行程序。你可以使用命令\
    \ `/exit` 退出 Java shell 返回普通提示符。\n\n"
- fmt: "\nLiterals are normally detached from the keywords of the Java language, but\
    \ where double quotes or single quotes are required within a `String` value it\
    \ is necessary to indicate that the quote character is to be treated literally\
    \ to avoid prematurely terminating the `String`. This is easily achieved by immediately\
    \ prefixing each nested quote character with the `\\` escape operator. For example,\
    \ including a quote within a `String` variable, like this:\n\n```java\nString\
    \ quote = “ \\”Fortune favors the brave.\\” said Virgil ”;\n```\n\nAdditionally,\
    \ the `\\` escape operator offers a variety of useful escape sequences for simple\
    \ output formatting:\n\n| **Escape:** | **Description:** |\n| :--- | --- |\n|\
    \ `\\n` | Newline |\n| `\\t` | Tab |\n| `\\b` | Backspace |\n| `\\r` | Carriage\
    \ return |\n| `\\f` | Formfeed |\n| `\\\\` | Backslash |\n| `\\’` | Single quote\
    \ mark |\n| `\\”` | Double quote mark |\n\n![image](images/hot.jpg)\n\nSingle\
    \ quotes can be nested within double quotes as an alternative to escaping quote\
    \ characters.\n\nThe `\\n` newline escape sequence is frequently used within long\
    \ `String` values to display the output on multiple lines. Similarly, the `\\\
    t` tab escape sequence is frequently used to display the output in columns. Using\
    \ a combination of `\\n` newline and `\\t` tab escape sequences allows the output\
    \ to be formatted in both rows and columns – to resemble a table.\n\nFollow these\
    \ steps to create a Java program using escape sequences to format the output:\n\
    \n![image](images/1r.jpg)Start a new program named “Escape” containing the standard\
    \ main method\n\n```java\nclass Escape\n{\n    public static void main( String[]\
    \ args ) {    }\n}\n```\n\n![image](images/common.jpg)\n\nEscape.java\n\n![image](images/2r.jpg)Between\
    \ the curly brackets of the main method, insert this code to build a `String`\
    \ containing a formatted table title and column headings\n\n```java\nString header\
    \ = “\\n\\tNEW YORK 3-DAY FORECAST:\\n” ;\nheader += “\\n\\tDay\\t\\tHigh\\tLow\\\
    tConditions\\n” ;\nheader += “\\t---\\t\\t----\\t---\\t----------\\n” ;\n```\n\
    \n![image](images/3r.jpg)Add these lines to build a `String` containing formatted\
    \ table cell data\n\n```java\nString forecast = “\\tSunday\\t\\t68F\\t48F\\tSunny\\\
    n” ;\nforecast += “\\tMonday\\t\\t69F\\t57F\\tSunny\\n” ;\nforecast += “\\tTuesday\\\
    t\\t71F\\t50F\\tCloudy\\n” ;\n```\n\n![image](images/4r.jpg)Now, add this line\
    \ to output both formatted `String` values\n\n```java\nSystem.out.print( header\
    \ + forecast ) ;\n```\n\n![image](images/5r.jpg)Save the program as `Escape.java`,\
    \ then compile and run the program\n\n![image](images/pg39_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nIn this case, escape sequences add newlines so the `print()` method is used\
    \ here – rather than the `println()` method that automatically adds a newline\
    \ after output.\n\n## Working with bits\n\nIn addition to the regular operators\
    \ described earlier in this chapter, Java provides special operators for binary\
    \ arithmetic. These are less commonly used than other operators, but are briefly\
    \ discussed here to simply provide an awareness of their existence.\n\n![image](images/pg40_1.jpg)\n\
    \nThe Java “bitwise” operators can be used with the `int` integer data type to\
    \ manipulate the bits of the binary representation of a value. This requires an\
    \ understanding of binary numbering, where eight bits in a byte represent decimal\
    \ values zero to 255. For example, 53 is binary `00110101` (`0` x 128, `0` x 64,\
    \ `1` x 32, `1` x 16, `0` x 8, `1` x 4, `0` x 2, `1` x 1).\n\nBinary addition\
    \ operations are performed like decimal arithmetic:\n\n| | 53 | = | `00110101`\
    \ |\n| :--- | --- | --- | --- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = | `00111100`\
    \ |\n\nThe bitwise operators, listed below, allow more specialized operations\
    \ to be performed in binary arithmetic.\n\n| **Operator:** | **Operation:** |\
    \ **Example:** | **Result:** |\n| :--- | --- | --- | --- |\n| `&` | AND | `a &\
    \ b` | 1 if both bits are 1 |\n| `\\|` | OR | `a \\| b` | 1 if either bit is 1\
    \ |\n| `^` | XOR | `a ^ b` | 1 if both bits differ |\n| `~` | NOT | `~a` | Inverts\
    \ the bits |\n| `<<` | Left shift | `n << p` | Moves `n` bits `p` left |\n| `>>`\
    \ | Right shift | `n >> p` | Moves `n` bits `p` right |\n\nFor example, using\
    \ the bitwise `&` operator in binary arithmetic:\n\n| | 53 | = | `00110101` |\n\
    | :--- | --- | --- | --- |\n| `+` | 7 | = | `00000111` |\n| | 60 | = | `00111100`\
    \ |\n"
  raw: 'Literals are normally detached from the keywords of the Java language, but
    where double quotes or single quotes are required within a **String** value it
    is necessary to indicate that the quote character is to be treated literally to
    avoid prematurely terminating the **String**. This is easily achieved by immediately
    prefixing each nested quote character with the **\** escape operator. For example,
    including a quote within a **String** variable, like this:


    **String quote = “ \”Fortune favors the brave.\” said Virgil ”;**


    Additionally, the **\** escape operator offers a variety of useful escape sequences
    for simple output formatting:


    | **Escape:** | **Description:** |


    | **\n** | Newline |


    | **\t** | Tab |


    | **\b** | Backspace |


    | **\r** | Carriage return |


    | **\f** | Formfeed |


    | **\\** | Backslash |


    | **\’** | Single quote mark |


    | **\”** | Double quote mark |


    ![image](images/hot.jpg)


    Single quotes can be nested within double quotes as an alternative to escaping
    quote characters.


    The **\n** newline escape sequence is frequently used within long **String** values
    to display the output on multiple lines. Similarly, the **\t** tab escape sequence
    is frequently used to display the output in columns. Using a combination of **\n**
    newline and **\t** tab escape sequences allows the output to be formatted in both
    rows and columns – to resemble a table.


    Follow these steps to create a Java program using escape sequences to format the
    output:


    ![image](images/1r.jpg)Start a new program named “Escape” containing the standard
    main method


    **class Escape**


    **{**


    **public static void main( String[] args ) {         }**


    **}**


    ![image](images/common.jpg)


    Escape.java


    ![image](images/2r.jpg)Between the curly brackets of the main method, insert this
    code to build a **String** containing a formatted table title and column headings


    **String header = “\n\tNEW YORK 3-DAY FORECAST:\n” ;**


    **header += “\n\tDay\t\tHigh\tLow\tConditions\n” ;**


    **header += “\t---\t\t----\t---\t----------\n” ;**


    ![image](images/3r.jpg)Add these lines to build a **String** containing formatted
    table cell data


    **String forecast = “\tSunday\t\t68F\t48F\tSunny\n” ;**


    **forecast += “\tMonday\t\t69F\t57F\tSunny\n” ;**


    **forecast += “\tTuesday\t\t71F\t50F\tCloudy\n” ;**


    ![image](images/4r.jpg)Now, add this line to output both formatted **String**
    values


    **System.out.print( header + forecast ) ;**


    ![image](images/5r.jpg)Save the program as **Escape.java**, then compile and run
    the program


    ![image](images/pg39_1.jpg)


    ![image](images/forget.jpg)


    In this case, escape sequences add newlines so the **print()** method is used
    here – rather than the **println()** method that automatically adds a newline
    after output.


    **Working with bits**


    In addition to the regular operators described earlier in this chapter, Java provides
    special operators for binary arithmetic. These are less commonly used than other
    operators, but are briefly discussed here to simply provide an awareness of their
    existence.


    ![image](images/pg40_1.jpg)


    The Java “bitwise” operators can be used with the **int** integer data type to
    manipulate the bits of the binary representation of a value. This requires an
    understanding of binary numbering, where eight bits in a byte represent decimal
    values zero to 255\. For example, 53 is binary **00110101**


    (**0** x 128, **0** x 64, **1** x 32, **1** x 16, **0** x 8, **1** x 4, **0**
    x 2, **1** x 1).


    Binary addition operations are performed like decimal arithmetic:


    |  | 53 | = | **00110101** |


    | **+** | 7 | = | **00000111** |


    |  | 60 | = | **00111100** |


    The bitwise operators, listed below, allow more specialized operations to be performed
    in binary arithmetic.


    | **Operator:** | **Operation:** | **Example:** | **Result:** |


    | **&** | AND | **a & b** | 1 if both bits are 1 |


    | **&#124;** | OR | **a &#124; b** | 1 if either bit is 1 |


    | **^** | XOR | **a ^ b** | 1 if both bits differ |


    | **~** | NOT | **~a** | Inverts the bits |


    | **<<** | Left shift | ***n << p*** | Moves *n* bits *p* left |


    | **>>** | Right shift | ***n >> p*** | Moves *n* bits *p* right |


    For example, using the bitwise **&** operator in binary arithmetic:


    |  | 53 | = | **00110101** |


    | **&** | 7 | = | **00000111** |


    |  | 5 | = | **00000101** |


    ![image](images/snake.jpg)


    Don’t confuse the logical AND operator **&&** with the bitwise **&** operator,
    or the logical OR operator **||** with the bitwise **|** operator.


    A common use of bitwise operators combines several values in a single variable
    for efficiency. For instance, a program with eight “flag” **int** variables, with
    values of 1 or 0 (representing on and off states), requires 32 bits of memory
    for each variable – 256 bits in total. These values only really require a single
    bit, however, so eight flags can be combined in a single **byte** variable – using
    one bit per flag. The status of each flag can be retrieved with bitwise operations:


    ![image](images/1r.jpg)Start a new program named “Bitwise” containing the standard
    main method


    **class Bitwise**


    **{**


    **public static void main( String[] args ) {       }**


    **}**


    ![image](images/common.jpg)


    Bitwise.java


    ![image](images/2r.jpg)Between the curly brackets of the main method, insert this
    code to declare and initialize a byte variable with a value representing the total
    status of up to eight flags


    **byte fs = 53 ; // Combined flag status of 00110101**


    ![image](images/3r.jpg)Add these lines to retrieve the status of each flag


    **System.out.println(“Flag 1: “+(( (fs&1)>0) ? “ON” : “off”));**


    **System.out.println(“Flag 2: “+(( (fs&2)>0) ? “ON” : “off”));**


    **System.out.println(“Flag 3: “+(( (fs&4)>0) ? “ON” : “off”));**


    **System.out.println(“Flag 4: “+(( (fs&8)>0) ? “ON” : “off”));**


    **System.out.println(“Flag 5: “+(( (fs&16)>0)? “ON” : “off”));**


    **System.out.println(“Flag 6: “+(( (fs&32)>0)? “ON” : “off”));**


    **System.out.println(“Flag 7: “+(( (fs&64)>0)? “ON” : “off”));**


    **System.out.println(“Flag 8: “+(( (fs&128)>0)?“ON”: “off”));**


    ![image](images/4r.jpg)Save the program as **Bitwise.java** then compile and run
    the program:


    ![image](images/pg41_1.jpg)


    ![image](images/hot.jpg)


    How it works – The binary representation of 53 is **00110101** so the set bits
    are... **1 + 4 + 16 + 32 = 53**


    ![image](images/forget.jpg)


    Here, the bitwise **&** operation returns one or zero to determine each flag’s
    status.


    **Summary**


    •Arithmetical operators can form expressions with two operands for addition **+**,
    subtraction **-**, multiplication *****, division **/**, or modulus **%**.


    •Increment **++** and decrement **--** operators modify a single operand by a
    value of one.


    •The assignment **=** operator can be combined with an arithmetical operator to
    perform an arithmetical calculation then assign its result.


    •Comparison operators can form expressions comparing two operands for equality
    **==**, inequality **!=**, greater **>**, or lesser **<** values.


    •The assignment **=** operator can be combined with the greater than **>** or
    lesser than **<** operator to also return **true** when equal.


    •Logical **&&** and **||** operators form expressions evaluating two operands
    to return a Boolean value of either **true** or **false**.


    •The logical ! operator returns the inverse Boolean value of a single operand.


    •A conditional **? :** operator evaluates a given Boolean expression and returns
    one of two operands, depending on its result.


    •Expressions evaluating a Boolean expression for a **true** value may optionally
    omit **== true**.


    •It is important to explicitly set operator precedence in complex expressions
    by adding parentheses **( )**.


    •The backslash escape **\** operator can be used to prefix quote characters within
    **String** values to prevent syntax errors.


    •Escape sequences **\n** newline and **\t** tab provide simple output formatting.


    •Bitwise operators can be useful to perform binary arithmetic in specialized situations.


    3


    **Making statements**'
