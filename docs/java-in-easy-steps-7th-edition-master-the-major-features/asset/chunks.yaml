    The `JRadioButton` class creates a radio button component that can be added to
    a graphical interface. This can be used to allow the user to select an item from
    a group of radio buttons.


    ![image](images/pg144_1.jpg)


    The `JRadioButton` object is created with the `new` keyword, and its constructor
    takes a `String` argument specifying text to be displayed alongside that radio
    button. It can also take a second `true` argument to make a radio button be selected
    by default.


    A `ButtonGroup` object logically groups a number of radio buttons so that only
    one button in that group can be selected at any time. Each radio button is added
    to the `ButtonGroup` object by specifying its name as the argument to the group’s
    `add()` method.


    ![image](images/1b.jpg)


    Edit a copy of `Window.java` from [here](#chapter08.html_pg135), changing the
    class name in the declaration, the constructor, and the instance statement from
    “Window” to “Radios”


    ![image](images/common.jpg)


    Radios.java


    ![image](images/2b.jpg)


    Before the `Radios()` constructor, create three `JRadioButton` objects – with
    one selected by default


    ```

    JRadioButton rad1 = new JRadioButton( “Red” , true ) ;

    JRadioButton rad2 = new JRadioButton( “Rosé” ) ;

    JRadioButton rad3 = new JRadioButton( “White” ) ;

    ```


    ![image](images/3b.jpg)


    Next, create a `ButtonGroup` object with which to group the radio buttons


    ```

    ButtonGroup wines = new ButtonGroup() ;

    ```


    ![image](images/4b.jpg)


    In the `Radios()` constructor method, insert statements to add each `JRadioButton`
    component to the `JButtonGroup`


    ```

    wines.add( rad1 ) ;

    wines.add( rad2 ) ;

    wines.add( rad3 ) ;

    ```


    ![image](images/5b.jpg)


    Insert statements to add the `JRadioButton` components to the `JPanel` container


    ```

    pnl.add( rad1 ) ;

    pnl.add( rad2 ) ;

    pnl.add( rad3 ) ;

    ```


    ![image](images/6b.jpg)


    Save the program as `Radios.java` then compile and run the program, selecting
    any one radio button after the default


    ![image](images/pg145_1.jpg)


    ![image](images/pg145_2.jpg)


    ![image](images/forget.jpg)


    The `ButtonGroup` object only groups the buttons logically, not physically.


    ![image](images/hot.jpg)


    Details of how to create event-handler methods to respond to user actions can
    be found in [Chapter 9](#chapter09.html).


    The examples on the previous pages have demonstrated the most common Swing components
    – `JButton`, `JLabel`, `JTextField`, `JCheckBox`, `JComboBox`, `JList` and `JRadioButton`.
    There are many more specialized components available in the `javax.swing` package,
    whose details can be found in the Java documentation – for example, the `JSlider`,
    `JProgressBar`, and `JMenuBar` components below:


    ![image](images/pg145_3.jpg)


    ![image](images/pg145_4.jpg)


    ![image](images/pg145_5.jpg)


    ![image](images/hot.jpg)


    Try using the Java documentation to add a `JSlider` component to the Radios program
    – see [here](#chapter05.html_sec38) for details on how to use the documentation.


    ### Arranging components


    The `java.awt` package (Abstract Window Toolkit) contains a number of layout manager
    classes that can be used to place components in a container in different ways.


    ![image](images/pg146_1.jpg)


    A layout manager object is created using the `new` keyword, and can then be specified
    as the argument to a `JPanel` constructor to have the panel use that layout. When
    components get added to the panel they will be placed according to the rules of
    the specified layout manager.


    | Layout Manager: | Rules: |

    | :--- | :--- |

    | `BorderLayout` | Places North, South, East, West and Center (the content pane
    default) |

    | `BoxLayout` | Places in a single row or column |

    | `CardLayout` | Places different components in a specified area at different
    times |

    | `FlowLayout` | Places left to right in a wrapping line (the `JPanel` default)
    |

    | `GridBagLayout` | Places in a grid of cells, allowing components to span cells
    |

    | `GridLayout` | Places in a grid of rows and columns |

    | `GroupLayout` | Places horizontally and vertically |

    | `SpringLayout` | Places by relative spacing |


    The top level `JFrame` object has a “content pane” container that places components
    using the `BorderLayout` layout manager by default. This can be used to place
    up to five `JPanel` containers, which may each use their default `FlowLayout`
    layout manager or any of the layout managers in the table above. Using a variety
    of layout managers accommodates most layout requirements.


    The content pane can be represented by a `java.awt.Container` object, whose `add()`
    method can specify the position and name of a component to be placed within the
    content pane.


    ![image](images/forget.jpg)


    You can find further details of each layout manager in the `java.awt` section
    of the Java documentation.


    ![image](images/1b.jpg)


    Edit a copy of `Window.java` from [here](#chapter08.html_pg135), changing the
    class name in the declaration, the constructor, and the instance statement from
    “Window” to “Layout”, then add a statement at the start of the program to import
    `java.awt` package


    ```

    import java.awt.*;

    ```


    ![image](images/common.jpg)


    Layout.java


    ![image](images/2b.jpg)


    Before the `Layout()` constructor, create a `Container` object representing the
    `JFrame` content pane


    ```

    Container contentPane = getContentPane();

    ```


    ![image](images/3b.jpg)


    Create a second `JPanel` object using `GridLayout` layout manager in 2 columns


    ```

    JPanel grid = new JPanel( new GridLayout( 2 ) ;

    ```


    ![image](images/4b.jpg)


    In the `Layout()` constructor method, insert statements adding `JButton` components
    to both `JPanel` objects


    ```

    pnl.add( “Yes” ) ;

    pnl.add( “No” ) ;

    pnl.add( “Cancel” ) ;

    grid.add( “1” ) ;

    grid.add( “2” ) ;

    grid.add( “3” ) ;

    grid.add( “4” ) ;

    ```


    ![image](images/5b.jpg)


    Now, insert statements adding both panels and a button to the content pane


    ```

    contentPane.add( “North” , pnl ) ;

    contentPane.add( “Center” , grid ) ;

    contentPane.add( “West” , new JButton( “West” ) ) ;

    ```


    ![image](images/6b.jpg)


    Save the program as `Layout.java` then compile and run the program to see component
    layout


    ![image](images/pg147_1.jpg)


    ![image](images/snake.jpg)


    While the `FlowLayout` maintains the `JButton` size, other layout managers expand
    the components to fill their layout design.


    ### Changing appearance


    The `java.awt` package (Abstract Window Toolkit) contains “painting” classes that
    can be used to color interface components. These can be made available to a program
    by including the initial statement `import java.awt.*;` .


    ![image](images/pg148_1.jpg)


    Included in the `java.awt` package is a `Color` class that has constants representing
    a few basic colors, such as `Color.RED`. Additionally, instances of the `Color`
    class can be created using the `new` keyword to represent custom colors. The constructor
    can take three integer arguments between zero and 255 to represent red, green,
    and blue (RGB) values to form the custom color.


    Each component has a `setBackground()` method and a `setForeground()` method that
    take a `Color` object as their argument to paint that component with the specified
    color.


    Note that the background of `JLabel` components are transparent by default, so
    it is recommended that their `setOpaque()` method should be called to set the
    opacity to `true` before they are painted.


    Also in the `java.awt` package is a `Font` class that can be used to modify the
    font displaying text. A `Font` object represents a font, and its constructor can
    take three arguments to specify name, style and size:


    • The specified name should be one of the three platform-independent names “Serif
    ”, “SansSerif ” or “Monospaced”.


    • The specified style should be one of the following three

