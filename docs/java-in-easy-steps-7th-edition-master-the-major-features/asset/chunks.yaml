    ![image](images/8g.jpg)

    Find the generated APK by clicking `locate` on the notification that appears,
    then rename the APK from `app-release.apk` to `Lotto.apk`.


    ![image](images/pg184_5.jpg)


    ![image](images/hot.jpg)


    Choose the Android App Bundle option if you want to upload the app to the Google
    Play store.


    ![image](images/hot.jpg)


    A key store holds public/ private key pairs. You, as the owner, retain the private
    key, while the Android Studio signing tool attaches the public key to the APK.
    This uniquely associates the APK to ensure that any future updates to the APK
    come from you: the original developer.


    Installation of APKs from sources other than Google Play is blocked unless the
    user opts to allow them:


    ![image](images/1g.jpg)

    Download `Lotto.apk` to an Android device, then tap the file icon to attempt installation


    ![image](images/2g.jpg)

    Select the `SETTINGS` option on the security dialog


    ![image](images/pg185_1.jpg)


    ![image](images/3g.jpg)

    Slide the control to the ON position for the option to `Allow from this source`,
    then click `Install` when asked


    ![image](images/pg185_2.jpg)


    ![image](images/4g.jpg)

    Now select the `INSTALL ANYWAY` option on the Play Protect dialog


    ![image](images/pg185_3.jpg)


    ![image](images/5g.jpg)

    Wait while the app gets installed onto the device


    ![image](images/pg185_4.jpg)


    ![image](images/pg185_5.jpg)


    ![image](images/hot.jpg)


    On earlier versions of Android go to Settings, Security and opt to “Allow installation
    of apps from unknown sources”.


    ![image](images/hot.jpg)


    Play Protect is a security safeguard built into every device with Google Play.


    ## Summary


    - Java programs can be deployed as stand-alone desktop applications running on
    an appropriate version of the JRE.

    - Application files can be distributed for execution on other operating systems
    using the appropriate `java` interpreter.

    - Bundling all program files into a single JAR archive file helps ensure resource
    files do not become accidentally isolated.

    - Executable JAR applications can be executed from a prompt with the `java -jar`
    command or by clicking on their file icon.

    - Java programs can be readily converted for the Android operating system as it
    includes similar core libraries.

    - Android Studio is the official IDE for the development of Android applications.

    - APK and JAR archive files are both compressed in ZIP format.

    - Each Android app is first created as a project to which the developer adds code
    and resources.

    - The most used windows in the Android Studio interface are the Project window
    and the Editor window.

    - Functional code can be added to the `MainActivity.java` file and interface components
    added to the `activity_main.xml` file.

    - An Android app can store images and strings as resources.

    - The signature of a button’s `onClick` event-handler must include a parameter
    for a `View` class object.

    - Interface components can be referenced in code by specifying their identity
    as the argument to `findViewById()`.

    - Android Studio provides AVD emulators for testing, and also allows testing to
    be performed on real connected devices.

    - The Release version of an Android app must be digitally signed with a public
    key certificate.


    ![image](images/back1.jpg)


    [![image](images/ibc1.jpg)](https://iescourses.com/)


    ![image](images/back2.jpg)


    ![image](images/bcover.jpg)

