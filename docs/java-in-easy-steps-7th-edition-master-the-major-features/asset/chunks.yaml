    text, and both text and an image respectively.


    ```java

    JLabel lbl1 = new JLabel( duke ) ;

    JLabel lbl2 = new JLabel( “Duke is the friendly mascot of technology.” ) ;

    JLabel lbl3 = new JLabel( “Duke” , duke , JLabel.CENTER ) ;

