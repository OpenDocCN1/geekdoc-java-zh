  trans: "\n\n`break` 和 `continue` 关键字的默认行为可以更改，通过指明标签名称来显式指定控制流返回到带标签的外层循环。这允许循环执行迭代，直到满足指定的条件或被中断。\n\
    \n![image](img/pg58_2.jpg)\n\n标记循环的语法需要一个标签名称，后跟一个冒号 `:`，放在循环结构开始之前。\n\n![image](img/1g.jpg)启动一个名为“Label”的新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass Label\n{\n    public static void main ( String[] args\
    \ ) { }\n}\n```\n\n![image](img/j1.jpg)\n\nLabel.java\n\n![image](img/2g.jpg)在\
    \ main 方法内部，创建两个嵌套的 `for` 循环，在三次迭代中的每次中显示它们的计数器值\n\n```java\nfor ( int i = 1 ;\
    \ i < 4 ; i++ )\n{\n    for ( int j = 1 ; j < 4 ; j++ )\n    {\n        System.out.println(\
    \ “Running i=”+i+ “ j=”+j ) ;\n    }\n}\n```\n\n![image](img/3g.jpg)将程序保存为 `Label.java`，然后编译并运行程序以查看输出\n\
    \n![image](img/pg58_1.jpg)\n\n![image](img/4g.jpg)修改外层循环的开头，将其标记为“outerLoop”\n\
    \n```java\nouterLoop : for ( int i = 1 ; i < 4 ; i++ )\n```\n\n要显式指定程序应在外层循环中继续，在\
    \ `continue` 关键字之后写上该循环的标签名称。\n\n![image](img/5g.jpg)将此 `continue` 语句添加到内层循环语句的开头，以便进入外层循环的下一次迭代——然后重新编译并运行程序\n\
    \n```java\nif ( i == 1 && j == 1 )\n{\n    System.out.println( “Continues outerLoop\
    \ when i=” +i+ “ j=” +j ) ;\n    continue outerLoop ;\n}\n```\n\n![image](img/pg59_1.jpg)\n\
    \n![image](img/forget.jpg)\n\n在这里，`continue` 语句停止了内层循环首次运行的所有三次迭代——通过将控制权返回外层循环。\n\
    \n要显式指定程序应从外层循环退出，在 `break` 关键字之后写上该循环的标签名称。\n\n![image](img/6g.jpg)将此 `break`\
    \ 语句添加到内层循环语句的开头，以便退出外层循环——然后重新编译并运行程序\n\n```java\nif ( i == 2 && j == 3 )\n{\n\
    \    System.out.println( “Breaks outerLoop when i=” +i+ “ j=” +j ) ;\n    break\
    \ outerLoop ;\n}\n```\n\n![image](img/pg59_2.jpg)\n\n![image](img/forget.jpg)\n\
    \n在这里，`break` 语句停止了整个循环结构的所有后续迭代——通过退出外层循环。\n\n### 总结\n\n- `if` 关键字执行条件测试，以评估表达式的布尔值为\
    \ `true` 或 `false`。\n- `if` 语句块可以包含一个或多个语句，这些语句仅在测试表达式返回 `true` 时执行。\n- `else`\
    \ 关键字指定了当 `if` 关键字执行的测试返回 `false` 时执行的备选语句。\n- 组合 `if else` 语句允许程序通过条件分支的过程继续运行。\n\
    - `switch` 语句通常可以通过提供 `case` 选项为难以管理的 `if else` 语句提供一种优雅的解决方案。\n- 每个 `case` 选项都可以由\
    \ `break` 关键字终止，这样只有与该选项相关的语句会被执行。\n- `default` 关键字可以指定在所有 `case` 选项都返回 `false`\
    \ 时执行的语句。\n- 循环重复执行其包含的语句，直到测试表达式返回 `false` 为止。\n- `for` 关键字后面的括号指定了循环的计数器初始化器、测试表达式和计数器更新器。\n\
    - `while` 循环和 `do while` 循环中的语句必须更改其测试表达式中使用的值，以避免死循环。\n- 测试表达式在 `for` 循环和 `while`\
