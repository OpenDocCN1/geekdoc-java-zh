    of the file to be written as its argument. Optionally, the argument can include
    the full path to a file to be written in a directory outside that in which the
    program is located.


    The **BufferedWriter** object is created with the **new** keyword, and takes the
    name of the **FileWriter** object as its argument. Text can then be written with
    the **write()** method of the **BufferedWriter** object, and lines separated by
    calling its **newLine()** method. These methods should be called from within a
    **try catch** statement to catch any **IOException** problems that may arise.


