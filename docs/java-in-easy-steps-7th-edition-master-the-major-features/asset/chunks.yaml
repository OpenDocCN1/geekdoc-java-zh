    statement to create a **String ArrayList** object named “list”


    **ArrayList<String> list = new ArrayList<String>() ;**


    ![image](images/4v.jpg)Next, add statements to populate the list elements with
    **String** values then display the entire list


    **list.add( “Alpha” ) ;**


    **list.add( “Delta” ) ;**


    **list.add( “Charlie” ) ;**


    **System.out.println( “List: ” + list ) ;**


    ![image](images/5v.jpg)Now, identify the current value in the second element then
    replace it with a new **String**


    **System.out.println( “Replacing: ” + list.get(1) + “\n” ) ;**


    **list.set( 1, “Bravo” ) ;**


    ![image](images/6v.jpg)Finally, iterate through the list and display the **String**
    value now stored in each element


    **list.forEach( ( x ) -> System.out.println( “Item: “ + x ) ) ;**


    ![image](images/7v.jpg)Save the program as **Lists.java** then compile and run
    the program to see the output


    ![image](images/pg127_1.jpg)


    ![image](images/forget.jpg)


    As with regular arrays, elements in an **ArrayList** have a zero-based index.


    ![image](images/hot.jpg)


    The graphical Java Swing **JComboBox** component that is introduced [here](#chapter08.html_pg143)
    holds a drop-down list of options, so must also specify its generic data type
    when that object gets created.


    **Managing dates**


    The **java.time** package contains a class named **LocalDateTime** that has useful
    methods to extract specific fields from a **LocalDateTime** object that describe
    a particular point in time. These can be made available to a program by importing
    the specific class with **import java.time.LocalDateTime;** or by importing all
    classes in this package using the wildcard with **import java.time.* ;** .


    ![image](images/pg128_1.jpg)


    A new **LocalDateTime** object can be created with fields describing the current
    date and time using its **now()** method. The fields are initialized from the
    system clock for the current locale.


    The value within an individual field can be retrieved using an appropriate method
    of the **LocalDateTime** object. For example, the value of the year field can
    be retrieved using its **getYear()** method. Similarly, any field can be changed
    using an appropriate method of the **LocalDateTime** object to specify a replacement
    value. For example, the value of the year field can be changed by specifying a
    new year value as an argument to its **withYear()** method.


    ![image](images/1v.jpg)Start a new program that imports the functionality of all
    methods in the **java.time.LocalDateTime** class


    **import java.time.LocalDateTime ;**


    ![image](images/common.jpg)


    DateTime.java


    ![image](images/2v.jpg)Add a class named “DateTime” containing the standard main
    method


    **class DateTime**


    **{**


    **public static void main ( String [] args ) {             }**


    **}**


    ![image](images/3v.jpg)Between the curly brackets of the main method, insert a
    statement to create a current **LocalDateTime** object


    **LocalDateTime date = LocalDateTime.now() ;**


    ![image](images/4v.jpg)Output the current date and time details


    **System.out.println( “\nIt is now ” + date ) ;**


    ![image](images/5v.jpg)Increment the year, and output the revised date and time


    **date = date.withYear( 2022 ) ;**


    **System.out.println( “\nDate is now ” + date ) ;**


    ![image](images/6v.jpg)Output individual **LocalDateTime** fields of the revised
    date


    **String fields = “\nYear:\t\t\t” + date.getYear() ;**


    **fields += “\nMonth:\t\t\t” + date.getMonth() ;**


    **fields += “\nMonth Number:\t\t” + date.getMonthValue() ;**


    **fields += “\nDay:\t\t\t” + date.getDayOfWeek() ;**


    **fields += “\nDay Number:\t\t” + date.getDayOfMonth() ;**


    **fields += “\nDay Number Of Year:\t” + date.getDayOfYear() ;**


    **fields += “\nHour (0-23):\t\t” + date.getHour() ;**


    **fields += “\nMinute:\t\t\t” + date.getMinute() ;**


    **fields += “\nSecond:\t\t\t” + date.getSecond() ;**


    **System.out.println( fields ) ;**


    ![image](images/7v.jpg)Save the program as **DateTime.java** then compile and
    run the program to see the output


    ![image](images/pg129_1.jpg)


    ![image](images/hot.jpg)


    Concatenating a **String** like this means the program makes just one call to
    **println()** to output field details – this is more efficient than calling **println()**
    many times to output each individual field separately.


    ![image](images/forget.jpg)


    You can alternatively use the **ZonedDateTime** class instead of **LocalDateTime**
    if you also require a time zone field.


    **Formatting numbers**


    Java contains a package named **java.text** that provides useful classes for formatting
    numbers and currency. The package can be made available to a program by including
    an **import** statement at the very beginning of the **.java** file. This can
    use the * wildcard character to mean “all classes” in the statement **import java.text.*
    ;**. Alternatively, specific classes can be imported by name.


    ![image](images/pg130_1.jpg)


    The **java.text** package has a class named “NumberFormat”, which has methods
    that can be used to format numerical values for output – adding group separators,
    currency signs, and percentage signs.


    The method used to create a new **NumberFormat** object determines its formatting
    type – **getNumberInstance()** for group separators, **getCurrencyInstance()**
    for currency signs, and **getPercentInstance()** for percentage signs. Formatting
    is applied by specifying the numerical value to be formatted as the argument to
    the **format()** method of the **NumberFormat** object.'
