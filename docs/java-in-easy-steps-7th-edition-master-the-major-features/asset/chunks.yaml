    The `private` keyword can be used when declaring object variables and methods
    to protect them from manipulation by external program code. The object should
    then include `public` methods to retrieve the values and call the methods. This
    technique neatly encapsulates the variables and methods within the object structure.
    It is demonstrated in the following steps that reproduce the previous example
    – but with encapsulated attributes and method:


    ![image](images/1bl.jpg)Start a new class named “Car”


    ```java

    class Car

    {


    }

    ```


    ![image](images/pg110_1.jpg)


    ![image](images/common.jpg)


    SafeInstance.java


    ![image](images/2bl.jpg)Between the curly brackets of the class, declare three
    private `String` variables to store object attributes


    ```java

    private String maker ;

    private String color ;

    private String bodyType ;

    ```


    ![image](images/3bl.jpg)Add a private method describing a behavior


    ```java

    private String accelerate()

    {

    String motion = “Accelerating -->” ;

    return motion ;

    }

    ```


    ![image](images/4bl.jpg)Add a public method to assign passed argument values to
    each private variable


    ```java

    public void setCar( String brand , String paint , String style )

    {

    maker = brand ;

    color = paint ;

    bodyType = style ;

    }

    ```


    ![image](images/5bl.jpg)Add another public method to retrieve the private variable
    values and to call the private method


    ```java

    public void getCar()

    {

    System.out.println( maker + ” paint is “ + color ) ;

    System.out.println( maker + “ style is “ + bodyType ) ;

    System.out.println( maker + “ is “ + accelerate() + ”\n” ) ;

    }

    ```


    ![image](images/6bl.jpg)After the end of the `Car` class, start another class
    named “SafeInstance” containing the standard main method


    ```java

    class SafeInstance

    {

    public static void main ( String[] args) {} }

    ```


    ![image](images/7bl.jpg)Between the curly brackets of the main method, insert
    a statement to create an instance of the `Car` class


    ```java

    Car Porsche = new Car() ;

    ```


    ![image](images/8bl.jpg)Add a statement that calls a public method of the `Car`
    class to assign values to its private variables


    ```java

    Porsche.setCar( “Porsche” , ”Red” , ”Coupe” ) ;

    ```


    ![image](images/9bl.jpg)Now, add a statement to call the other public method of
    the `Car` class to retrieve the stored attribute values and call the private behavior
    method


    ```java

    Porsche.getCar() ;

    ```


    ![image](images/10bl.jpg)Create another instance, assigning and retrieving values


    ```java

    Car Bentley = new Car() ;

    Bentley.setCar( “Bentley” , ”Green” , ”Saloon” ) ;

    Bentley.getCar() ;

    ```


    ![image](images/11bl.jpg)Save the program as `SafeInstance.java` then compile
    and run the program to see the output


    ![image](images/pg111_1.jpg)


    ![image](images/forget.jpg)


    An uninitialized `String` variable has a `null` value – so calling the `getCar()`
    method before `setCar()` will return a `null` from each variable.


    ### Configuring object values


    An object’s constructor method can be called directly in the object class to initialize
    object variables. This helps to keep the declarations and assignments separate,
    and is considered to be good programming style. It is demonstrated in the following
    steps that reproduce the previous example [here](#chapter06.html_sec53) with encapsulated
    attributes and method – together with initialization by the constructor:


    ![image](images/1bl.jpg)Start a new class named “Car”


    ```java

    class Car

    {


    }

    ```


    ![image](images/pg112_1.jpg)


    ![image](images/common.jpg)


    Constructor.java


    ![image](images/2bl.jpg)Between the curly brackets of the class, declare three
    private `String` variables to store object attributes


    ```java

    private String maker ;

    private String color ;

    private String bodyType ;

    ```


    ![image](images/3bl.jpg)Add a constructor method that initializes all three variables
    with attribute values


    ```java

    public Car()

    {

    maker = “Porsche” ;

    color = “Silver” ;

    bodyType = “Coupe” ;

    }

    ```


    ![image](images/4bl.jpg)Add a private method describing a behavior


    ```java

    private String accelerate()

    {

    String motion = “Accelerating -->” ;

    return motion ;

    }

    ```


    ![image](images/5bl.jpg)Add a public method to assign passed argument values to
    each private variable


    ```java

    public void setCar( String brand , String paint , String style )

    {

    maker = brand ;

    color = paint ;

    bodyType = style ;

    }

    ```


    ![image](images/snake.jpg)


    Constructor method declarations do not state any return data type.


    ![image](images/6bl.jpg)Add another public method to retrieve the private variable
    values and to call the private method


    ```java

    public void getCar()

    {

    System.out.println( maker + ” paint is “ + color ) ;

    System.out.println( maker + “ style is “ + bodyType ) ;

    System.out.println( maker + “ is “ + accelerate() + ”\n” ) ;

    }

    ```


    ![image](images/7bl.jpg)After the end of the `Car` class, start another class
    named “Constructor” containing the standard main method


    ```java

    class Constructor

    {

    public static void main ( String[] args) {} }

    ```


    ![image](images/8bl.jpg)Between the curly brackets of the main method, insert
    a statement to create an instance of the `Car` class and retrieve the initial
    values


    ```java

    Car Porsche = new Car() ;

    Porsche.getCar() ;

    ```


    ![image](images/9bl.jpg)Create another instance, assigning and retrieving values


    ```java

    Car Bentley = new Car() ;

    Bentley.setCar( “Bentley” , ”Green” , ”Saloon” ) ;

    Bentley.getCar() ;

    ```


    ![image](images/10bl.jpg)Save the program as `Constructor.java` then compile and
    run the program to see the output


    ### Summary


    - Splitting programs into multiple methods, which can be called upon required,
    increases flexibility and makes it easier to track bugs.

    - Overloaded methods have the same name but take different arguments.

    - Variables declared within a method have local scope, but class variables have
    global scope throughout that class.

    - The `static` keyword is used to declare class methods and class variables –
    having global scope throughout that class.

    - The `public` keyword explicitly allows access from any class.

    - A class declaration can include the `extends` keyword to nominate a super class
    from which it will inherit.

    - The class name and dot notation can be used to explicitly address a particular
    class method or class variable.

    - Real-world objects have attributes and behaviors that can be represented in
    programs by variables and methods.

    - Java objects are created as a template class from which instance copies can
    be made.

    - Each class has a constructor method that can be invoked using the `new` keyword
    to create an instance copy of that class.

    - Instances inherit the attributes and behaviors of the class from which they
    are derived.

    - Encapsulation protects instance variables and instance methods from manipulation
    by external classes.

    - The `private` keyword denies access from outside the class where the declaration
    is made.

    - An object’s constructor method can be called to initialize variable attributes
    of that object.

