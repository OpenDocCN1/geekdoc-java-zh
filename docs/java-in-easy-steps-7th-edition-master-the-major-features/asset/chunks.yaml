    密钥库存储公钥/私钥对。你作为所有者保留私钥，而 Android Studio 签名工具会将公钥附加到 APK 中。这唯一地将 APK 关联起来，以确保 APK
    的任何后续更新都来自你——即原始开发者。


    除非用户选择允许，否则来自 Google Play 以外来源的 APK 将被阻止：


