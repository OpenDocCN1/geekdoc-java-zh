    \ run the program with an incorrect second argument and with the wrong number\
    \ of arguments\n\n![image](images/pg69_2.jpg)\n\n![image](images/hot.jpg)\n\n\
    This program will report an error if non-numeric values are entered. See [here](#chapter04.html_sec36)\
    \ for details on how to catch errors.\n\n## Looping through elements\n\nAll types\
    \ of loop can be used to easily read all the values stored inside the elements\
    \ of an array. The loop counter should start with the index number of the first\
    \ element then proceed on up to the final index number. The index number of the\
    \ last element in an array will always be one less than the array length – because\
    \ the index starts at zero.\n\n![image](images/arrowp.jpg)\n\nIt is useful to\
    \ set the array `length` property as the loop’s conditional test determining when\
    \ the loop should end. This means that the loop will continue until the counter\
    \ value exceeds the index number of the array’s final element.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Loops” containing the standard main method\n\n```java\n\
    class Loops\n{\n    public static void main ( String[] args ) {\n    }\n}\n```\n\
    \n![image](images/common.jpg)\n\nLoops.java\n\n![image](images/2p.jpg)Inside the\
    \ main method, write an `if` statement to test whether any argument values have\
    \ been entered into the `args[]` array from the command line\n\n```java\nif (\
    \ args.length > 0 ) {    }\n```\n\n![image](images/3p.jpg)Insert a `for` loop\
    \ inside the curly brackets of the `if` statement to output the value stored in\
    \ each element\n\n```java\nfor ( int i = 0 ; i < args.length ; i++ )\n{\n    System.out.println(\
    \ “args[“ +i+ “] is | “+ args[i] ) ;\n}\n```\n\n![image](images/4p.jpg)Save the\
    \ program as `Loops.java` then compile the program and run it with the arguments\
    \ `Java in easy steps`\n\n![image](images/pg70_1.jpg)\n\n![image](images/5p.jpg)Edit\
    \ `Loops.java` to add a `String` array and a `while` loop to output the value\
    \ stored in each element\n\n```java\nString[] htm = { “HTML”, “in”, “easy”, “steps”\
    \ };\nint j = 0;\nwhile ( j < htm.length )\n{\n    System.out.println( “htm[“\
    \ +j+ “] is | + htm[j] );\n    j++;\n}\n```\n\n![image](images/6p.jpg)Save the\
    \ changes, then recompile and re-run the program\n\n![image](images/pg71_1.jpg)\n\
    \n![image](images/7p.jpg)Edit `Loops.java` to add another `String` array and a\
    \ `do while` loop to output the value stored in each element\n\n```java\nString[]\
    \ xml = { “XML”, “in”, “steps” };\nint k = 0;\nif ( xml.length > 0 ) do\n{\n \
    \   System.out.println( “\\txml[“+k+“] is |+xml[k] );\n    k++;\n} while ( k <\
    \ xml.length );\n```\n\n![image](images/8p.jpg)Save the changes, then recompile\
    \ and re-run the program\n\n![image](images/pg71_2.jpg)\n\n![image](images/hot.jpg)Notice\
    \ that the `do` statement is preceded by a conditional test to ensure the array\
    \ is not empty before attempting to output the value of the first element.\n\n\
    ### Changing element values\n\nThe value stored in an array can be changed by\
    \ assigning a new value to that particular element using its index number. Additionally,\
    \ any type of loop can be used to efficiently populate all the elements in an\
    \ array from values in other arrays.\n\n![image](images/pg72_1.jpg)\n\nThis ability\
    \ is especially useful to combine data from multiple arrays into a single array\
    \ of totaled data.\n\n![image](images/1p.jpg)Start a new program named “Elements”\
    \ containing the standard main method\n\n```java\nclass Elements\n{\n    public\
    \ static void main ( String[] args ) {    }\n}\n```\n\n![image](images/common.jpg)\n\
    \nElements.java\n\n![image](images/2p.jpg)In the main method, add `int` arrays\
    \ representing monthly sales from all four quarters of a year\n\n```java\nint[]\
    \ kiosk_q1 = { 42000, 48000, 50000 };\nint[] kiosk_q2 = { 52000, 58000, 60000\
    \ };\nint[] kiosk_q3 = { 46000, 49000, 58000 };\nint[] kiosk_q4 = { 50000, 51000,\
    \ 61000 };\n```\n\n![image](images/3p.jpg)Add `int` arrays representing monthly\
    \ sales from all four quarters of a year\n\n```java\nint[] outlet_q1 = { 57000,\
    \ 63000, 60000 };\nint[] outlet_q2 = { 70000, 67000, 73000 };\nint[] outlet_q3\
    \ = { 67000, 65000, 62000 };\nint[] outlet_q4 = { 72000, 69000, 75000 };\n```\n\
    \n![image](images/4p.jpg)Now, create an empty `int` array of 12 elements in which\
    \ to combine all the monthly sales figures and an `int` variable in which to record\
    \ their grand total value\n\n```java\nint[] sum = new int[12];\nint total = 0;\n\
    ```\n\n![image](images/5p.jpg)Add a `for` loop to populate each element of the\
    \ empty array with combined values from the other arrays\n\n```java\nfor ( int\
    \ i = 0 ; i < kiosk_q1.length ; i++ )\n{\n    sum[ i ] = kiosk_q1[i] + outlet_q1[i]\
    \ ;\n    sum[i+3] = kiosk_q2[i] + outlet_q2[i] ;\n    sum[i+6] = kiosk_q3[i] +\
    \ outlet_q3[i] ;\n    sum[i+9] = kiosk_q4[i] + outlet_q4[i] ;\n}\n```\n\n![image](images/6p.jpg)Next,\
    \ add a second `for` loop to output each of the combined monthly sales totals,\
    \ and to calculate their grand total\n\n```java\nfor ( int i = 0 ; i < sum.length\
    \ ; i++ )\n{\n    System.out.println( “Month “+ ( i+1 ) + ” sales:\\t” + sum[i]\
    \ );\n    total += sum[i] ;\n}\n```\n\n![image](images/7p.jpg)Insert a final statement\
    \ at the end of the main method to output the grand total\n\n```java\nSystem.out.println(\
    \ “TOTAL YEAR SALES\\t” + total );\n```\n\n![image](images/8p.jpg)Save the program\
    \ as `Elements.java` then compile the program and run it to see the output\n\n\
    ![image](images/pg73_1.jpg)\n\n![image](images/forget.jpg)\n\nThe counter number\
    \ gets increased by one to produce the month numbers 1-12.\n\n**Adding array dimensions**\n"
