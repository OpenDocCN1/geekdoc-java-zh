    \ false ) ; }\n```\n\n![image](images/10r.jpg)Save the program as `Actions.java`\
    \ then compile and run the program, clicking the push buttons\n\n![image](images/pg155_1.jpg)\n\
    \n![image](images/pg155_2.jpg)\n\n![image](images/pg155_3.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe components are declared before the constructor so they are globally accessible\
    \ to the event-handler method.\n\n![image](images/hot.jpg)\n\nIt’s sometimes useful\
    \ to disable a component until the user has performed a required action.\n\n###\
    \ Handling item events\n\nSwing `JRadioButton`, `JCheckBox` and `JComboBox` components\
