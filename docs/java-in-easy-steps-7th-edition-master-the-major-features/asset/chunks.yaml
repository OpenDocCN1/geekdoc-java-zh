- fmt: "\nArrays can be created to store multiple sets of element values, each having\
    \ their own index dimension. Individual values are addressed in a multi-dimensional\
    \ array using the appropriate index numbers of each dimension – for example, `num\
    \ [1] [3]`.\n\n![image](images/pg74_1.jpg)\n\nA two-dimensional array might be\
    \ used to record an integer value for each day of a business year, organized by\
    \ week. This requires an array of 52 elements (one per week) that each have an\
    \ array of seven elements (one per day). Its declaration looks like this:\n\n\
    ```java\nint[][] dailyRecord = new int [52] [7] ;\n```\n\nThis “array of arrays”\
    \ provides an element for each business day. Values are assigned to a multi-dimensional\
    \ array by stating the appropriate index numbers of each dimension. With the example\
    \ above, for instance, a value can be assigned to the first day of the sixth week,\
    \ like this:\n\n```java\ndailyRecord [5] [0] = 5000 ;\n```\n\nEach array has its\
    \ own `length` property that can be accessed by specifying the dimension required.\
    \ For the example above, the syntax `dailyRecord.length` returns a value of 52\
    \ – the size of the first dimension. To access the size of the second dimension,\
    \ the syntax `dailyRecord[0].length` returns the value of seven.\n\nTwo-dimensional\
    \ arrays are often used to store grid coordinates, where one dimension represents\
    \ the X axis and the other dimension represents the Y axis – for example, `point[3][5]`.\n\
    \nThree-dimensional arrays can be used to store XYZ coordinates in a similar way,\
    \ but it can be difficult to visualize `point[4][8][2]`.\n\n![image](images/snake.jpg)\n\
    \nAvoid using more than three dimensions in arrays – it will be confusing.\n\n\
    Nested loops are perfectly suited to multi-dimensional arrays, as each loop level\
    \ can address the elements of each array dimension.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Dimensions” containing the standard main method\n\n```java\n\
    class Dimensions\n{\n    public static void main ( String[] args ) {    }\n}\n\
    ```\n\n![image](images/common.jpg)\n\nDimensions.java\n\n![image](images/2p.jpg)In\
    \ the main method, create a two-dimensional array to store Boolean flats relating\
    \ to XY coordinates\n\n```java\nboolean[][] points = new boolean[5][20] ;\n```\n\
    \n![image](images/3p.jpg)Define one Y point on each X axis\n\n```java\npoints[0][5]\
    \ = true ;\npoints[1][6] = true ;\npoints[2][7] = true ;\npoints[3][8] = true\
    \ ;\npoints[4][9] = true ;\n```\n\n![image](images/4p.jpg)Add a `for` loop to\
    \ iterate through the first array index, adding a newline character at the end\
    \ of each iteration\n\n```java\nfor ( int i = 0 ; i < points.length ; i++ )\n\
    {\n    System.out.print( “\\n” ;\n}\n```\n\n![image](images/5p.jpg)Within the\
    \ curly brackets of the `for` loop, insert a second `for` loop to iterate through\
    \ the second array index\n\n```java\nfor ( int j = 0 ; j < points[0].length ;\
    \ j++ ) {    }\n```\n\n![image](images/6p.jpg)Within the curly brackets of the\
    \ second `for` loop, insert a statement to output a character for each element\
    \ according to that element’s Boolean value\n\n```java\nchar mark = ( points[i][j]\
    \ ) ? ‘X’ : ‘-’ ;\nSystem.out.print( mark ) ;\n```\n\n![image](images/7p.jpg)Save\
    \ the program as `Dimensions.java` then compile and run the program to see the\
    \ output\n\n![image](images/pg75_1.jpg)\n\n![image](images/forget.jpg)\n\nBoolean\
    \ variables are `false` by default.\n\n### Catching exceptions\n\nA program may\
    \ encounter a runtime problem that causes an “exception” error, which halts its\
    \ execution. Often, this will be created by unexpected user input. A well-written\
    \ program should, therefore, attempt to anticipate all possible ways the user\
    \ might cause exceptions at runtime.\n\n![image](images/pg76_1.jpg)\n\nCode where\
    \ exceptions might arise can be identified and enclosed within a `try catch` statement\
    \ block. This allows the program to handle exceptions without halting execution\
    \ and looks like this:\n\n```java\ntry\n{\n    *statements where an exception\
    \ may arise*\n}\ncatch( Exception e )\n{\n    *statements responding to an exception*\n\
    }\n```\n\nThe parentheses following the `catch` keyword specify the class of exception\
    \ to be caught and assign it to the variable “e”. The top-level `Exception` class\
    \ catches all exceptions. Responses can be provided for specific exceptions, however,\
    \ using multiple `catch` statements to identify different lower-level exception\
    \ classes.\n\nThe most common exceptions are the `NumberFormatException`, which\
    \ arises when the program encounters a value that is not of the expected numeric\
    \ type, and the `ArrayIndexOutOfBoundsException`, which arises when the program\
    \ attempts to address an array element number that is outside the index size.\
    \ It is helpful to create a separate response for each of these exceptions to\
    \ readily notify the user about the nature of the problem.\n\nOptionally, a `try\
    \ catch` statement block can be extended with a `finally` statement block, containing\
    \ code that will always be executed – irrespective of whether the program has\
    \ encountered exceptions.\n\n![image](images/hot.jpg)\n\nThe `getMessage()` method\
    \ returns further information about captured exceptions.\n\n![image](images/1p.jpg)Start\
    \ a new program named “Exceptions” containing the standard main method\n\n```java\n\
    class Exceptions\n{\n    public static void main ( String[] args ) {    }\n}\n\
    ```\n\n![image](images/2p.jpg)In the main method, write a `try` statement to output\
    \ a single integer\n\n```java\ntry\n{\n    int num = Integer.parseInt( args[0]\
    \ ) ;\n    System.out.println( “You entered: “+ num );\n}\n```\n\n![image](images/3p.jpg)Add\
    \ a `catch` statement to handle the exception that arises when the program is\
    \ run without an argument\n\n```java\ncatch( ArrayIndexOutOfBoundsException e\
    \ )\n{\n    System.out.println( “Integer required.” ;\n}\n```\n\n![image](images/4p.jpg)Add\
    \ a `catch` statement to handle the exception that arises when the program is\
    \ run with a non-integer argument\n\n```java\ncatch( NumberFormatException e )\n\
    {\n    System.out.println( “Argument is wrong.” ;\n}\n```\n\n![image](images/5p.jpg)Add\
    \ a `finally` statement at the end of the program\n\n```java\nfinally { System.out.println(\
    \ “Program ends.” ; }\n```\n\n![image](images/6p.jpg)Save the program as `Exceptions.java`\
    \ then compile and run the program, trying to cause exceptions\n\n![image](images/pg75_1.jpg)\n\
    \n### Summary\n\n- Numeric values can be converted to other numeric types by casting,\
    \ and to the `String` type using the `toString()` method.\n- A `String` value\
    \ can be converted to an `int` value using the `Integer.parseInt()` method, and\
    \ to a `float` using `Float.parseFloat()`.\n- An array is a variable that can\
    \ contain multiple values, initialized as a list within curly brackets in its\
    \ declaration.\n- An empty array object can be created using the `new` keyword.\n\
    - The `length` property of an array stores an integer, which is the number of\
    \ elements in that array.\n- Each element of an array can be addressed by its\
    \ index number.\n- A program’s `main` method creates a `String` array, traditionally\
    \ named “args”, to store command line arguments.\n- The first command line argument\
    \ gets automatically stored in the `args[0]` element – as a `String` data type.\n\
    - Multiple arguments being passed to a program from the command line must each\
    \ be separated by a space.\n- Loops are an ideal way to read all the values stored\
    \ within array elements.\n- Data from multiple arrays can be combined to form\
    \ a new array of totaled data in each element.\n- Multi-dimensional arrays can\
    \ store multiple sets of element values, each having their own index dimension.\n\
    - A `try catch` statement block is used to anticipate and handle runtime exceptions\
    \ that may arise.\n- The `Exception` class catches all exception errors, including\
    \ `NumberFormatException` and `ArrayIndexOutOfBoundsException`.\n- A `try catch`\
    \ statement can be extended with a `finally` statement block, containing code\
    \ that will always be executed.\n"
