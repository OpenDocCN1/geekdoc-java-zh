    the source code file **Hello.java** and hit the **Enter** key


    ![image](images/pg14_1.jpg)


    ![image](images/hot.jpg)


    On Windows use the Command Prompt app or Windows PowerShell app to provide a command-line
    prompt, and on Linux use a Terminal window.


    ![image](images/hot.jpg)


    At a prompt type **javac** and hit Enter to reveal the Java compiler options.


    If the **javac** compiler discovers errors in the code it will halt and display
    a helpful report indicating the nature of the error – see [here](#chapter01.html_sec9)
    for troubleshooting problems.


    If the **javac** compiler does not find any errors it will create a new file with
    the program name and the **.class** file extension.


    ![image](images/pg14_2.jpg)


    ![image](images/hot.jpg)


    You can also compile the source code from another location if you state the file’s
    full path address to the javac compiler – in this case, **C:\MyJava\Hello.java**


    When the Java compiler completes compilation, the command-line prompt window focus
    returns to the prompt without any confirmation message – and the program is ready
    to run.


    ![image](images/pg15_3.jpg)


    The Java program interpreter is an application named **java** that is located
    in Java’s **bin** sub-directory – alongside the **javac** compiler. As this directory
    was previously added to the system path during installation the **java** interpreter
    can be invoked from any location.


    Follow these steps to run the program that was compiled using the procedure described
    [here](#chapter01.html_sec4):


    ![image](images/1b.jpg)Open a command-line prompt window, then navigate to the
    directory where the **Hello.class** program file is located


    ![image](images/2b.jpg)At the prompt, type **java** followed by a space then the
    program name **Hello** and hit the **Enter** key


    ![image](images/pg15_1.jpg)


    ![image](images/snake.jpg)


    Do not include the .class extension when running a program – only use the program
    name.


    The **Hello** program runs and executes the task defined in the statement within
    its main method – to output “Hello World!”. Upon completion, focus returns to
    the prompt once more.


    The process of compiling and running a Java program is typically combined in sequential
    steps, and is the same regardless of platform. The screenshot below illustrates
    the **Hello** program being compiled and run in combined steps on a Linux system:


    ![image](images/pg15_2.jpg)


    **Creating a variable**


    In Java programming, a “variable” is simply a useful container in which a value
    may be stored for subsequent use by the program. The stored value may be changed
    (vary) as the program executes its instructions – hence the term “variable”.


    ![image](images/pg16_1.jpg)


    A variable is created by writing a variable “declaration” in the program, specifying
    the type of data that variable may contain and a given name for that variable.
    For example, the **String** data type can be specified to allow a variable named
