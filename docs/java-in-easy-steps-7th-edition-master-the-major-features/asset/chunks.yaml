    **Arrays.sort( names ) ;**


    **Arrays.sort( nums ) ;**


    ![image](images/8v.jpg)Output the contents of all elements in each array again


    **display( names ) ;**


    **display( nums ) ;**


    ![image](images/9v.jpg)Save the program as **Sort.java** then compile and run
    the program to see the output


    ![image](images/pg125_1.jpg)


    ![image](images/forget.jpg)


    The **for** loops in this example each execute a single statement so no curly
    brackets are required – but they could be added for clarity.


    **Making array lists**


    The **java.util** package contains a class named **ArrayList** that stores data
    in an ordered “Collection” (resizable sequence) of list elements. This can be
    made available to a program by importing the specific class with **import java.util.ArrayList;**.
    A list may contain duplicate elements, and an **ArrayList** object has useful
    methods that allow manipulation of stored values by specifying their element index
    number. For example, the list’s method call **get(0)** will retrieve the value
    stored in the first element whereas **remove(1)** will remove the second list
    element.


