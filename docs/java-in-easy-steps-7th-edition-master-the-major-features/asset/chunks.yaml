    **System.out.println( Porsche.accelerate() ) ;**


    ![image](images/7bl.jpg)Save the program as **FirstInstance.java** alongside the
    **Car.java** template file, then compile and run the program to see the output


    ![image](images/pg109_1.jpg)


    ![image](images/forget.jpg)


    You cannot address the **motion** variable directly – it is out of scope within
    the method declaration.


    A virtual class is created for the new **Porsche** object that replicates the
    original **Car** class. Both these objects contain static “class variables” and
    a “class method”, which are addressed using the class name and dot notation –
    as these members are globally accessible, this is not considered good programming
    practice.


    Whilst this example demonstrates how instances of an object inherit properties
    of the original class, it is improved in the next example [here](#chapter06.html_sec53)
    that uses non-static members to create “instance variables” and an “instance method”,
    which cannot be addressed from outside that class – as these members are not globally
    accessible, this is considered good programming practice.


    ![image](images/hot.jpg)


    The compiler automatically finds the **Car** class in the external **.java** file
    – and creates a compiled **.class** file for it.


