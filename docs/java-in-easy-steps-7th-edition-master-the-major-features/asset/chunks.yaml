    \n接下来，可以通过在 `MainActivity.java` 文件中插入一个事件处理器（eventhandler）来为应用添加功能，当用户按下按钮时，它将响应按钮的\
    \ `onClick` 事件。此事件会自动向事件处理器传递一个参数，该参数是所点击控件的标识引用。因此，事件处理器的签名必须通过包含一个 `View` 类的参数（所有小部件的基类）来适应该参数。该方法还必须具有\
    \ `void` 返回类型：\n\n![image](img/1g.jpg)首先在 `MainActivity.java` 文件开头的 import 语句中添加此行\n\
    \n```java\nimport android.view.View ;\n```\n\n![image](img/common.jpg)\n\nMainActivity.java\n\
    \n![image](img/2g.jpg)将此事件处理器签名插入到 `MainActivity` 类中，紧接在其 `onCreate( )` 方法块之后\n\
    \n```java\npublic void lotto( View vue ) { }\n```\n\n在代码中可以通过指定它们的身份作为 `findViewById(\
    \ )` 方法的参数来引用界面控件。这是在 `activity_main.xml` 中分配给它们的 `android:id` 属性的名称，前加上 `R.id.`\
