  trans: "\n\nJava 包含一个名为 `java.io` 的包，用于处理文件输入输出过程。通过在 `.java` 文件的最开始包含 `import`\
    \ 语句，可以使程序可以使用该包。在语句 `import java.io.* ;` 中可以使用通配符字符 `*` 来表示“所有类”。\n\n![image](img/pg116_1.jpg)\n\
    \n`java.io` 包有一个名为 `File` 的类，用于访问文件或完成目录。必须先使用 `new` 关键字创建一个 `File` 对象，并将文件名或目录名作为构造函数的参数。例如，创建一个名为\
    \ `info` 代表名为 `info.dat` 的本地文件的 `File` 对象的语法如下：\n\n```\nFile info = new File(\
    \ “info.dat” ) ;\n```\n\n该文件将位于与程序相同的目录中，但参数也可以指定位于其他地方的文件路径。请注意，创建 `File` 对象并不会实际创建文件，而仅仅是表示文件的手段。\n\
    \n一旦创建了表示文件的 `File` 对象，就可以调用它的方法来操作文件。最实用的 `File` 对象方法列在下表中，并附有简要说明：\n\n| `Method:`\
    \ | `Returns:` |\n| :--- | :--- |\n| `exists()` | 如果文件存在则返回 `true` – 不存在则返回 `false`\
    \ |\n| `getName()` | 作为 `String` 类型的文件名 |\n| `length()` | 文件中的字节数，类型为 `long` |\n\
    | `createNewFile()` | 如果能够创建新的唯一文件则返回 `true` |\n| `delete()` | 如果能够成功删除文件则返回 `true`\
    \ |\n| `renameTo(File)` | 如果能够成功重命名文件则返回 `true` |\n| `list()` | `String` 类型的文件或文件夹名称数组\
    \ |\n\n![image](img/forget.jpg)\n\n作为构造函数参数指定的名必须包含在引号内。\n\n![image](img/1v.jpg)启动一个新程序，导入所有\
    \ `java.io` 类的功能\n\n```\nimport java.io.* ;\n```\n\n![image](img/common.jpg)\n\
    \nListFiles.java\n\n![image](img/2v.jpg)添加一个名为“ListFiles”的类，包含标准的 main 方法\n\n\
    ```\nclass ListFiles\n{\n    public static void main( String[] args ) {      }\n\
    }\n```\n\n![image](img/3v.jpg)在 main 方法的大括号之间，插入一个语句为名为“data”的目录文件夹创建一个 `File`\
    \ 对象\n\n```\nFile dir = new File( “data” ) ;\n```\n\n![image](img/4v.jpg)添加一个\
    \ `if` 语句输出该文件夹中所有文件的名称，或者如果文件夹为空则输出消息\n\n```java\nif ( dir.exists() )\n{\n  \
    \  String[] files = dir.list() ;\n    System.out.println( files.length + “ files\
    \ found...” ) ;\n    for ( int i = 0 ; i < files.length ; i++ )\n    {\n     \
    \          System.out.println( files[i] ) ;\n    }\n}\nelse\n{              System.out.println(\
    \ “Folder not found.” ) ; }\n```\n\n![image](img/5v.jpg)将程序保存为 `ListFiles.java`，并带上包含某些文件的“data”文件夹，然后编译并运行程序，以查看输出列出的文件名\n\
    \n![image](img/pg117_1.jpg)\n\n### 读取控制台输入\n\n`java.io` 包允许程序从命令行读取输入 – 与用户交互。正如\
    \ `System.out` 字段可以将输出发送到命令行一样，`System.in` 字段可以使用 `InputStreamReader` 对象从命令行读取内容。这以字节形式读取输入，并将其转换为代表\
    \ Unicode 字符值的整数值。\n\n![image](img/pg118_1.jpg)\n\n为了读取整整行输入文本，`BufferedReader`\
    \ 对象的 `readLine()` 方法会读取由 `InputStreamReader` 解码的字符。此方法必须在 `try catch` 语句内部调用，以捕获任何\
    \ `IOException` 问题。\n\n通常情况下，`readLine()` 方法会将输入赋值给 `String` 变量供程序处理。\n\n![image](img/1v.jpg)启动一个新程序，导入所有\
    \ `java.io` 类的功能\n\n```\nimport java.io.* ;\n```\n\n![image](img/common.jpg)\n\
    \nReadString.java\n\n![image](img/2v.jpg)添加一个名为“ReadString”的类，包含标准的 main 方法\n\n\
    ```\nclass ReadString\n{\n    public static void main( String[] args ) {     \
    \      }\n}\n```\n\n![image](img/3v.jpg)在 main 方法的大括号之间，插入一个语句输出提示用户输入的消息\n\n\
    ```java\nSystem.out.print( “Enter the title of this book: “ ) ;\n```\n\n![image](img/4v.jpg)添加一个创建一个\
    \ `InputStreamReader` 对象的语句，允许从命令行读取输入\n\n```java\nInputStreamReader isr = new\
    \ InputStreamReader( System.in ) ;\n```\n\n![image](img/5v.jpg)创建一个 `BufferedReader`\
    \ 对象来读取解码后的输入\n\n```java\nBufferedReader buffer = new BufferedReader( isr ) ;\n\
    ```\n\n![image](img/6v.jpg)声明并初始化一个空的 `String` 变量用于存储输入\n\n```java\nString input\
    \ =“ ;\n```\n\n![image](img/7v.jpg)添加 `try catch` 语句从命令行读取输入并存入变量\n\n```java\n\
    try\n{\n    input = buffer.readLine() ;\n    buffer.close() ;\n}\ncatch ( IOException\
    \ e )\n{\n    System.out.println( “An input error has occurred” ) ;\n}\n```\n\n\
    ![image](img/8v.jpg)输出包含存储值的消息\n\n```java\nSystem.out.println( “\\nThanks, you\
    \ are reading “ + input ) ;\n```\n\n![image](img/9v.jpg)将程序保存为 `ReadString.java`\
    \ 然后编译并运行程序\n\n![image](img/pg19.jpg)输入文本，然后按回车查看输出\n\n![image](img/10v.jpg)在不再需要时调用\
    \ `BufferedReader` 的 `close()` 方法是一个良好的习惯\n\n### 读取文件\n\n`java.io` 包包含一个名为 `FileReader`\
    \ 的类，专门用于读取文本文件。该类是 `InputStreamReader` 的子类，可以通过将字节流转换为代表 Unicode 字符值的整数来读取输入。\n\
    \n![image](img/pg120_1.jpg)\n\n为了逐行读取文本文件，可以使用 `BufferedReader` 对象的 `readLine()`\
    \ 方法。此方法必须在 `try catch` 语句内部调用。\n\n读取包含多行的文本文件的所有行通过重复调用 `readLine()` 方法来实现。在文件末尾，该调用将返回\
    \ `null` 值，可用于终止循环。\n\n![image](img/1v.jpg)打开一个纯文本编辑器（如 Windows 记事本），编写几行文本 –\
