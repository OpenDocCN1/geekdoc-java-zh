    android:id=”@+id/imageView”


    android:contentDescription=”Lotto Logo


    app:layout_constraintTop_toTopOf=”parent” />**


    ![image](images/forget.jpg)


    The **app:srcCompat** attribute references the image resource added to the **drawable**
    folder.


    The attributes in this element fit the control to the width of the layout container,
    and position the control at the top of the container. The image resource is defined
    as the content source, and the element is given an id for reference by other elements.


    ![image](images/3g.jpg)Edit the existing TextView element to look like this:


    **<TextView**


    **android:layout_width=”match_parent”


    android:layout_height=”wrap_content”


    android:id=”@+id/textView


    android:height=”60dp”


    android:textSize=”36sp”


    android:gravity=”center_horizontal” app:layout_constraintTop_toBottomOf = ”@+id/imageView”
    />**


    ![image](images/4g.jpg)Insert this element right after the TextView element


    **<Button**


    **android:layout_width=”match_parent”


    android:layout_height=”wrap_content”


    android:id=”@+id/button”


    android:textSize=”24sp”


    android:onClick=”lotto”


    android:text=”GET MY LUCKY NUMBERS” app:layout_constraintTop_toBottomOf = ”@+id/textView”
    />**


    ![image](images/hot.jpg)


    The **android:id** attribute in each element specifies a unique name by which
    the element can be referenced in Java code.


    ![image](images/hot.jpg)


    The **android:onClick** attribute specifies the name of an event-handler to be
    called.


    **String resources**


    The strings assigned to describe the image content and to specify the button text
    should each be converted to a string resource:


    ![image](images/1g.jpg)Click within the **“Lotto Logo”** string assignment to
    give it focus, then press **Alt** + **Enter** to see a QuickFix dialog


    ![image](images/pg179_1.jpg)


    ![image](images/2g.jpg)Choose **Extract string resource**, then provide a resource
    name in the “Extract Resource” dialog that now appears


    ![image](images/pg179_2.jpg)


    ![image](images/3g.jpg)Click **OK** to close the dialog, and see the assigned
    string get replaced by a reference to the new string resource


    ![image](images/pg179_3.jpg)


    ![image](images/4g.jpg)Repeat this for the **“GET MY LUCKY NUMBERS”** string


    ![image](images/pg179_4.jpg)


    **Inserting Java code**'
