    they are equal. Boolean operands that are both **true**, or that are both **false**,
    are equal.


    Conversely, the **!=** inequality operator returns **true** if two operands are
    not equal – applying the same rules as the equality operator.


    Equality and inequality operators are useful in testing the state of two variables
    to perform “conditional branching” of a program – proceeding in different directions
    according to the condition.


    The **>** “greater than” operator compares two operands, and will return **true**
    if the first is greater in value than the second.


    The **<** “less than” operator makes the same comparison, but returns true if
    the first operand is less in value than the second.


    Adding the **=** assignment operator after the **>** “greater than” operator,
    or after the **<** “less than” operator, makes it also return **true** when the
    two operands are exactly equal in value.


    ![image](images/hot.jpg)


    The < less than operator is typically used to test a counter value in a loop –
    an example of this can be found [here](#chapter03.html_sec23).


    Follow these steps to explore the Java comparison operators in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type **jshell**
    and hit the **Enter** key to launch the Java shell


    ![image](images/2r.jpg)Next, enter statements to initialize two **String** variables


    **String txt = “Super ” ; String lang = “Java” ;**


    ![image](images/3r.jpg)Now, separately enter statements to initialize a **boolean**
    variable and display the result of **String** value comparisons for equality and
    inequality


    **boolean state = ( txt == lang ) ;**


    **state = ( txt != lang ) ;**


    ![image](images/pg31_1.jpg)


    ![image](images/4r.jpg)In a similar way, separately enter these statements to
    display the result of **int** value comparisons for greater and lesser numeric
    value


    **int dozen = 12 ; int score = 20 ;**


    **state = ( dozen > score ) ;**


    **state = ( dozen < score ) ;**


    ![image](images/pg31_2.jpg)


    ![image](images/hot.jpg)


    You can discover more options within the Java shell by entering the **/help**
    command.


    ![image](images/forget.jpg)


    Here it’s untrue (**false**) that the **String** values are equal, but it is **true**
    that they are unequal.


    ![image](images/hot.jpg)


    Notice how an expression can be contained in parentheses for better readability.


    **Assessing logic**


    Logical operators, listed in the table below, are used to combine multiple expressions
    that each return a Boolean value – into a complex expression that returns a single
    Boolean value.


    ![image](images/pg32_1.jpg)


    | **Operator:** | **Operation:** |


    | **&&** | Logical AND |


    | **&#124;&#124;** | Logical OR |


    | **!** | Logical NOT |


    Logical operators are used with operands that have the Boolean values of **true**
    or **false**, or values that can convert to **true** or **false**.


    The logical **&&** AND operator will evaluate two operands and return **true**
    only if both operands are themselves **true**. Otherwise, the logical **&&** operator
    will return **false**. This evaluation can be used in conditional branching, where
    a program will only perform a certain action when two tested conditions are both
    true.


    Unlike the logical **&&** operator that needs two operands to be **true**, the
    logical **||** OR operator will evaluate its two operands and return **true**
    if either one of the operands is **true** – it will only return **false** when
    neither operand is **true**. This is useful in Java programming to perform a certain
    action when either one of two test conditions has been met.


    The logical **!** NOT operator is a “unary” operator that is used before a single
    operand. It returns the inverse Boolean value of the given operand – reversing
    **true** to **false**, and **false** to **true**. It’s useful in Java programs
    to toggle the value of a variable in successive loop iterations with a statement
    like **goState=!goState**. This ensures that on each pass of the loop the value
    is changed, like flicking a light switch on and off.


    ![image](images/pg32_2.jpg)


    The term “Boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    Follow these steps to explore logical operators in the Java shell:


    ![image](images/1r.jpg)Open a command-line prompt window, then type **jshell**
    and hit the **Enter** key to launch the Java shell'
