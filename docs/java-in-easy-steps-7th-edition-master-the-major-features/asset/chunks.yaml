    of the Xs shown below)


    ![image](images/3b.jpg)Now, enter a `jshell -version` command to see the Java
    shell version – and you’re ready to begin Java programming!


    ![image](images/pg11_4.jpg)


    ![image](images/pg11_5.jpg)The Java shell `jshell` is an interactive tool that
    lets you test snippets of code, without the need to first compile the code. It
    is used in [Chapter 2](#chapter02.html) to demonstrate the various “operators”
    available in Java programming.


    ## Writing a first Java program


    All Java programs start as text files that are later used to create “class” files,
    which are the actual runnable programs. This means that Java programs can be written
    in any plain text editor such as the Windows Notepad app or the Nano app on Linux.


    ![image](images/pg12_1.jpg)


    Follow these steps to create a simple Java program that will output the traditional
    first program greeting:


    ![image](images/1b.jpg)Open a plain text editor, like Notepad, and type this code
    exactly as it is listed – to create a class named “Hello”


    ```java

    class Hello {

    }

    ```


    ![image](images/common.jpg)

    Hello.java


    ![image](images/2b.jpg)Between the curly brackets of the **Hello** class, insert
    this code – to create a “main” method for the **Hello** class


    ```java

    public static void main ( String[] args )

    {

    }

    ```


    ![image](images/3b.jpg)Between the curly brackets of the **main** method, insert
    this line of code – stating what the program will do


    ```java

    System.out.println( “Hello World!” ) ;

    ```

