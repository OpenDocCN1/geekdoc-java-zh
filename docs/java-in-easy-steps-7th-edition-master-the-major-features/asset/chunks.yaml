    ![image](images/4b.jpg)

    Save the file at any convenient location, but be sure to name it precisely as
    `Hello.java` – the complete program should now look like this:


    ![image](images/pg12_2.jpg)


    ![image](images/snake.jpg)


    Java is a case-sensitive language where “Hello” and “hello” are distinctly different
    – traditionally, Java program names should always begin with an uppercase letter.


    ![image](images/forget.jpg)


    Java programs are always saved as their exact program name followed by the `.java`
    extension.


    The separate parts of the program code [here](#chapter01.html_code) can be examined
    individually to understand each part more clearly:


    ### The program container


    ```java

    class Hello { }

    ```


    The program name is declared following the `class` keyword, and followed by a
    pair of curly brackets. All of the program code that defines the `Hello` class
    will be contained within these curly brackets.


    ### The main method


    ```java

    public static void main ( String[] args ) { }

    ```


    This fearsome-looking line is the standard code that is used to define the starting
    point of nearly all Java programs. It will be used in most examples throughout
    this book exactly as it appears above – so it may be useful to memorize it.


    The code declares a method named “main” that will contain the actual program instructions
    within its curly brackets.


    Keywords `public static void` precede the method name to define how the method
    may be used, and are explained in detail later.


    The code `( String[] args )` is useful when passing values to the method, and
    is also fully explained later in this book.


    ![image](images/forget.jpg)


    All stand-alone Java programs must have a main method.


    ### The statement


    ```java

    System.out.println( “Hello World!” ) ;

    ```


    Statements are actual instructions to perform program tasks, and must always end
    with a semicolon. A method may contain many statements inside its curly brackets
    to form a “statement block” defining a series of tasks to perform, but here a
    single statement instructs the program to output a line of text.


    Turn to [here](#chapter01.html_sec4) to discover how to compile and run this program.


    ![image](images/hot.jpg)


    Create a “MyJava” directory in which to save all your Java program files.


    ### Compiling & running programs


    Before a Java program can run, it must first be compiled into a `class` file by
    the Java compiler. This is located in Java’s `bin` sub-directory, and is an application
    named `javac`. The `bin` sub-directory was added to the system path during installation
    so that `javac` can be invoked from any system location.


    Follow these steps to compile the program [here](#chapter01.html_pg13):


    ![image](images/1b.jpg)

    Open a command-line window, then navigate to the directory where you saved the
    `Hello.java` source code file


    ![image](images/2b.jpg)

    Type `javac` followed by a space then the full name of the source code file `Hello.java`
    and hit the `Enter` key


    ![image](images/pg14_1.jpg)


    ![image](images/hot.jpg)


    On Windows use the Command Prompt app or Windows PowerShell app to provide a command-line
    prompt, and on Linux use a Terminal window.


    ![image](images/hot.jpg)


    At a prompt type `javac` and hit Enter to reveal the Java compiler options.


    If the `javac` compiler discovers errors in the code it will halt and display
    a helpful report indicating the nature of the error – see [here](#chapter01.html_sec9)
    for troubleshooting problems.


    If the `javac` compiler does not find any errors it will create a new file with
    the program name and the `.class` file extension.


    ![image](images/pg14_2.jpg)


    ![image](images/hot.jpg)


    You can also compile the source code from another location if you state the file’s
    full path address to the `javac` compiler – in this case, `C:\MyJava\Hello.java`


    When the Java compiler completes compilation, the command-line prompt window focus
    returns to the prompt without any confirmation message – and the program is ready
    to run.


    ![image](images/pg15_3.jpg)


    The Java program interpreter is an application named `java` that is located in
    Java’s `bin` sub-directory – alongside the `javac` compiler. As this directory
    was previously added to the system path during installation the `java` interpreter
    can be invoked from any location.


    Follow these steps to run the program that was compiled using the procedure described
    [here](#chapter01.html_sec4):


    ![image](images/1b.jpg)

    Open a command-line prompt window, then navigate to the directory where the `Hello.class`
    program file is located


    ![image](images/2b.jpg)

    At the prompt, type `java` followed by a space then the program name `Hello` and
    hit the `Enter` key


    ![image](images/pg15_1.jpg)


    ![image](images/snake.jpg)


    Do not include the .class extension when running a program – only use the program
    name.


    The `Hello` program runs and executes the task defined in the statement within
    its main method – to output “Hello World!”. Upon completion, focus returns to
    the prompt once more.


    The process of compiling and running a Java program is typically combined in sequential
    steps, and is the same regardless of platform. The screenshot below illustrates
    the `Hello` program being compiled and run on Linux:


    ![image](images/pg15_2.jpg)


    ### Creating a variable


    In Java programming, a “variable” is simply a useful container in which a value
    may be stored for subsequent use. The stored value may be changed (vary) as the
    program executes – hence the term “variable”.


    ![image](images/pg16_1.jpg)


    A variable is created by writing a variable “declaration” in the program, specifying
    the type of data variable may contain and a given name for that variable. For
    example, the `String` data type can be specified to allow a variable named “message”
    to contain regular text:


    ```java

    String message ;

    ```


    Variable names are chosen by the programmer but must adhere to certain naming
    conventions. The variable name may only begin with a letter, dollar sign `$` or
    the underscore character `_` , and subsequently have only letters, digits, dollar
    signs, or underscore characters. Names are case-sensitive, so “var” and “Var”
    are different names, and spaces are not allowed in names.


    Variable names should also avoid the Java keywords listed in the table below,
    as these have special meaning in the language.


    | | | | | |

    | :--- | :--- | :--- | :--- | :--- |

    | `abstract` | `default` | `goto` | `package` | `synchronized` |

    | `assert` | `do` | `if` | `private` | `this` |

    | `boolean` | `double` | `implements` | `protected` | `throw` |

    | `break` | `else` | `import` | `public` | `throws` |

    | `byte` | `enum` | `instanceof` | `return` | `transient` |

    | `case` | `extends` | `int` | `static` | `try` |

    | `catch` | `false` | `long` | `strictfp` | `void` |

    | `char` | `final` | `native` | `String` | `volatile` |

    | `class` | `finally` | `new` | `super` | `while` |

    | `continue` | `for` | `null` | `switch` | |


    ![image](images/snake.jpg)


    Each variable declaration must be terminated with a semicolon character – like
    all other statements.


    ![image](images/hot.jpg)


    Strictly speaking, some words in this table are not actually keywords – `true`,
    `false`, and `null` are all literals; `String` is a special class name; `const`
    and `goto` are reserved words (currently unused). These are included in the table
    because they must also be avoided when naming variables.

