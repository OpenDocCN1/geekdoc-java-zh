    statements to output the value of each **Car** attribute and call its behavior
    method


    **System.out.println( “Paint is “ + Car.color ) ;**


    **System.out.println( “Style is “ + Car.bodyType ) ;**


    **System.out.println( Car.accelerate() ) ;**


    ![image](images/6bl.jpg)Save the program as **FirstObject.java** then compile
