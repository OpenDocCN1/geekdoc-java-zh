  trans: "\n\n# 本章演示了如何使用各种 Java 库方法操作程序数据。\n\n- 探索 Java 类\n- 进行数学运算\n- 数字舍入\n- 生成随机数\n\
    - 管理字符串\n- 比较字符串\n- 搜索字符串\n- 操作字符\n- 总结\n\n## 探索 Java 类\n\nJava 拥有海量的预测试代码包库，这些包按模块排列。那些提供\
    \ Java 语言本身基础功能的包包含在 `java.lang` 包中，该包位于 `java.base` 模块内。这些内容由 Java API（应用程序编程接口）自动访问。这意味着在创建程序时，`java.lang`\
    \ 包提供的属性和方法是随时可用的。例如，位于 `java.base` 模块中 `java.lang` 包的 `Math` 类通过 `abs()` 方法提供的数学功能。\n\
    \n![image](img/pg80_1.jpg)\n\n包的内容按层次结构排列，允许使用点表示法访问任何项。例如，`System` 类包含一个 `out`\
    \ 属性（字段），该属性又包含一个 `println()` 方法——因此可以通过 `System.out.println()` 进行访问。\n\nJava\
    \ 文档提供了关于每个可用项的信息，并可用于探索 Java 类。您可以通过 `[docs.oracle.com/en/java](http://docs.oracle.com/en/java)`\
    \ 在线访问，也可以下载进行离线参考。文档量大是可以可以理解的，但熟悉它是非常有价值的。一个很好的起点是 API 概览页面，其中包含了每个模块的列表以及对每个模块的简要描述：\n\
    \n![image](img/1o.jpg)访问 `[docs.oracle.com/en/java](http://docs.oracle.com/en/java)`\
    \ 并点击 **Java SE documentation** 链接，然后点击 **API Documentation**\n\n![image](img/2o.jpg)查看按字母顺序排列的\
    \ **All Modules** – 点击 `java.base` 模块的链接（Java SE 的基础 API）\n\n![image](img/pg80_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n引入模块是为了提高可扩展性和增加性能。\n\n![image](img/3o.jpg)查看每个章节中按字母顺序排列的模块**Packages**\
    \ – 向下滚动页面到“Exports”部分并点击 `java.lang` 包的链接\n\n![image](img/pg81_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n您还可以使用搜索框查找关于任何项的信息。\n\n![image](img/4o.jpg)查看每个章节中按字母顺序排列的包**Classes** – 向下滚动页面到“Class\
    \ Summary”部分并点击 `Math` 类的链接\n\n![image](img/pg81_2.jpg)\n\n![image](img/5o.jpg)查看“Method\
    \ Summary”部分中按字母顺序排列的类**Methods** ——只需点击其链接即可发现任何方法的用途和语法\n\n![image](img/pg81_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n检查页面菜单上其他项可用的信息以更熟悉文档。\n\n## 进行数学运算\n\n`java.lang`\
    \ 包中的 `Math` 类提供了两个对执行数学计算通常有用的常量值。`Math.PI` 存储 Pi 的值，`Math.E` 存储自然对数底的值。这两个常量值都存储为\
    \ `double` 精度数据类型，具有 15 位小数。\n\n![image](img/pg82_1.jpg)\n\n![image](img/1o.jpg)启动一个名为“Pi”的新新程序，其中包含标准的\
    \ main 方法\n\n```java\nclass Pi {\n    public static void main (String[] args)\
    \ { }\n}\n```\n\n![image](img/common.jpg)\nPi.java\n\n![image](img/2o.jpg)在 main\
    \ 方法中，从命令行参数声明并初始化 `float` 变量，并将 `double Math.PI` 常量转换为第二个 `float` 变量\n\n```java\n\
    float radius = Float.parseFloat(args[0]) ;\nfloat shortPi = (float) Math.PI ;\n\
    ```\n\n![image](img/3o.jpg)使用转换后的值进行数学计算，将结果分配更多的 `float` 变量\n\n```java\nfloat\
    \ circ = shortPi * (radius + radius) ;\nfloat area = shortPi * (radius * radius)\
    \ ;\n```\n\n![image](img/4o.jpg)输出 `Math.PI` 的值及其转换后的 `float` 等效值，随后输出计算结果\n\n\
    ```java\nSystem.out.print( “With Pi commuted from “ + Math.PI ) ;\nSystem.out.println(\
    \ “ to “ + shortPi + “...” ) ;\nSystem.out.println( “A circle of radius “ + radius\
    \ + “ cm” ) ;\nSystem.out.print( “has a circumference of “ + circ + “ cm” ) ;\n\
    System.out.println( “and an area of ” + area + “ sq.” ) ;\n```\n\n![image](img/5o.jpg)将程序保存为\
    \ `Pi.java`，然后编译并运行\n\n![image](img/pg82_2.jpg)\n\n![image](img/hot.jpg)\n\n`java.lang`\
    \ 包中的 `Math` 类提供了许多用于执行数学计算的方法。使用 `Math.pow()`，可以将给定的数字提升指定的幂。`Math.sqrt()` 方法返回数字的平方根。\n\
    \n![image](img/1o.jpg)启动一个名为“Power”的新程序，包含 main 方法\n\n```java\nclass Power {\n\
    \    public static void main (String[] args) { }\n}\n```\n\n![image](img/common.jpg)\n\
    Power.java\n\n![image](img/2o.jpg)在 main 方法中，从传递的参数声明并初始化 `int` 变量\n\n```java\n\
    int num = Integer.parseInt(args[0]) ;\n```\n\n![image](img/3o.jpg)执行数学计算，将结果转换为\
    \ `int`\n\n```java\nint square = (int) Math.pow(num, 2) ;\nint cube = (int) Math.pow(num,\
    \ 3) ;\nint sqrt = (int) Math.sqrt(num) ;\n```\n\n![image](img/4o.jpg)输出计算结果\n\
    \n```java\nSystem.out.println( num + ” squared is ” + square ) ;\nSystem.out.println(\
    \ num + ” cubed is ” + cube ) ;\nSystem.out.println( “Square root of ” + num +\
    \ ” is ”+ sqrt ) ;\n```\n\n![image](img/5o.jpg)将程序保存为 `Power.java`，然后编译并运行查看输出\n\
    \n![image](img/pg83_1.jpg)\n\n![image](img/hot.jpg)\n\n这两个示例可以通过添加 `try catch`\
    \ 语句块来预测错误——见详情。\n\n## 数字舍入\n\n`java.lang` 包中的 `Math` 类提供了三种将浮点数舍入到最近整数的方法。其中最简单的是\
    \ `Math.round()` 方法，它将参数指定的数字向上或向下舍入到最近的整数。\n\n![image](img/pg84_1.jpg)\n\n`Math.floor()`\
    \ 方法向下取整到整数，而 `Math.ceil()` 方法向上取整到整数。虽然 `Math.round()` 方法返回 `int` 数据类型，但 `Math.floor()`\
    \ 和 `Math.ceil()` 方法都返回 `double` 数据类型。\n\n![image](img/1o.jpg)启动一个名为“Round”的新程序，包含\
    \ main 方法\n\n```java\nclass Round {\n    public static void main (String[] args)\
    \ { }\n}\n```\n\n![image](img/common.jpg)\nRound.java\n\n![image](img/2o.jpg)在\
    \ main 方法中，声明并初始化 `float` 变量\n\n```java\nfloat num = 7.25f ;\n```\n\n![image](img/3o.jpg)以\
    \ `int` 值输出舍入后的 `float` 值\n\n```java\nSystem.out.println( num+” rounded is ”+Math.round(\
    \ num ) ) ;\n```\n\n![image](img/4o.jpg)以 `double` 值输出舍入后的 `float` 值\n\n```java\n\
    System.out.println( num+” floored is ” +Math.floor( num ) );\n```\n\n"
