    \ = new JTextArea( 5 , 38 ) ;\n```\n\n![image](images/5r.jpg)Add the buttons and\
    \ text area to the `JPanel` container\n\n```\npnl.add( btn1 ) ;\npnl.add( btn2\
    \ ) ;\npnl.add( txtArea ) ;\n```\n\n![image](images/6r.jpg)Insert statements to\
    \ set the initial state of two components\n\n```\nbtn2.setEnabled( false ) ;\n\
    txtArea.setText( “Button 2 is Disabled” ) ;\n```\n\n![image](images/7r.jpg)In\
    \ the `Actions()` constructor, insert statements to make each button generate\
    \ an `ActionEvent` event when clicked\n\n```\nbtn1.addActionListener( this ) ;\n\
    btn2.addActionListener( this ) ;\n```\n\n![image](images/8r.jpg)After the constructor\
    \ method, add an event-handler method for the `ActionListener` interface – to\
