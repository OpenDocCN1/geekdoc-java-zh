    \n为特定按钮点击创建响应的事件处理方法可能如下：\n\n```\npublic void actionPerformed( ActionEvent event\
    \ )\n{\n    if ( event.getSource() == btn )\n    {\n        // 为此按钮点击事件要执行的语句\n\
    \    }\n}\n```\n\n### 处理按钮事件\n\nSwing `JButton` 组件如果被设置为在点击时生成 `ActionEvent` 事件，则可以通过\
    \ `ActionListener` 接口进行识别，该接口会将事件传递给它的 `actionPerformed()` 事件处理方法。`ActionEvent`\
    \ 对象有一个 `getSource()` 方法来识别源自组件，以及一个返回 `String` 类型的 `getActionCommand()` 方法。这将会是按钮组件的文本标签，或者是文本字段组件的内容。\n\
    \n![image](img/pg154_1.jpg)\n\n对按钮的一种响应可能是通过调用其 `setEnabled()` 方法并传入 `false` 参数来禁用组件。相反，通过向其\
    \ `setEnabled()` 方法指定 `true` 参数可以再次启用该组件。\n\n![image](img/1r.jpg)从此处编辑一份 `Window.java`\
    \ 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“Actions”\n\n![image](img/common.jpg)\n\n\
    Actions.java\n\n![image](img/2r.jpg)在程序的最开始处添加语句，导入 `java.awt.event` 包中所有类的功能\n\
    \n```\nimport java.awt.event.* ;\n```\n\n![image](img/3r.jpg)修改类声明，为程序添加 `ActionListener`\
    \ 接口\n\n```\nclass Actions extends JFrame implements ActionListener\n```\n\n![image](img/4r.jpg)在\
    \ `Actions()` 构造函数之前，创建两个 `JButton` 推射按钮和一个 `JTextArea` 文本字段\n\n```\nJButton btn1\
    \ = new JButton( “Button 1” ) ;\nJButton btn2 = new JButton( “Button 2” ) ;\n\
    JTextArea txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](img/5r.jpg)将按钮和文本区域添加到\
    \ `JPanel` 容器中\n\n```\npnl.add( btn1 ) ;\npnl.add( btn2 ) ;\npnl.add( txtArea\
    \ ) ;\n```\n\n![image](img/6r.jpg)插入设置两个组件初始状态的语句\n\n```\nbtn2.setEnabled( false\
    \ ) ;\ntxtArea.setText( “Button 2 is Disabled” ) ;\n```\n\n![image](img/7r.jpg)在\
    \ `Actions()` 构造函数中插入语句，使每个按钮点击时生成 `ActionEvent` 事件\n\n```\nbtn1.addActionListener(\
    \ this ) ;\nbtn2.addActionListener( this ) ;\n```\n\n![image](img/8r.jpg)在构造方法之后，为\
    \ `ActionListener` 接口添加事件处理方法——用于显示标识哪个按钮被点击的文本\n\n```\npublic void actionPerformed(\
    \ ActionEvent event )\n{\n    txtArea.setText( event.getActionCommand() + “ Clicked\
    \ and Disabled” ) ;\n}\n```\n\n![image](img/9r.jpg)在事件处理方法中插入 `if` 语句——对每个按钮点击执行特定的响应\n\
    \n```\nif ( event.getSource() == btn1 )\n{ btn2.setEnabled( true ) ; btn1.setEnabled(\
    \ false ) ; }\nif ( event.getSource() == btn2 )\n{ btn1.setEnabled( true ) ; btn2.setEnabled(\
    \ false ) ; }\n```\n\n![image](img/10r.jpg)将程序保存为 `Actions.java`，然后编译并运行程序，点击推送按钮\n\
    \n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\n![image](img/pg155_3.jpg)\n\
    \n![image](img/forget.jpg)\n\n组件在构造函数之前声明，因此它们对于事件处理方法是全局可用的。\n\n![image](img/hot.jpg)\n\
    \n在用户执行所需操作之前禁用组件，有时是有用的。\n\n### 处理项目事件\n\nSwing `JRadioButton`、`JCheckBox` 和\
    \ `JComboBox` 组件维护状态，其状态的变化可以通过 `ItemListener` 接口进行识别，该接口会将 `ItemEvent` 传递给它的\
    \ `itemStateChanged()` 事件处理方法。`ItemEvent` 对象有一个 `getItemSelectable()` 方法来识别源自组件，以及一个返回其状态的\
    \ `getStateChange()` 方法。这将决定变化是选中还是取消选中项目，并可以与 `ItemEvent.SELECTED` 常量进行比较。\n\n\
    ![image](img/pg156_1.jpg)\n\n![image](img/1r.jpg)从此处编辑一份 `Window.java` 的副本，将声明、构造函数和实例化语句中的类名从“Window”更改为“Actions”。然后在在程序的最开始处添加语句，导入\
    \ `java.awt.event` 包中所有类的功能\n\n```\nimport java.awt.event.* ;\n```\n\n![image](img/common.jpg)\n\
    \nActions.java\n\n![image](img/2r.jpg)修改类声明，为程序添加 `ActionListener` 接口\n\n```\n\
    class Actions extends JFrame implements ActionListener\n```\n\n![image](img/4r.jpg)在\
    \ `Actions()` 构造函数之前，创建两个 `JButton` 推射按钮和一个 `JTextArea` 文本字段\n\n```\nJButton btn1\
    \ = new JButton( “Button 1” ) ;\nJButton btn2 = new JButton( “Button 2” ) ;\n\
    JTextArea txtArea = new JTextArea( 5 , 38 ) ;\n```\n\n![image](img/5r.jpg)将按钮和文本区域添加到\
    \ `JPanel` 容器中\n\n```\npnl.add( btn1 ) ;\npnl.add( btn2 ) ;\npnl.add( txtArea\
    \ ) ;\n```\n\n![image](img/6r.jpg)插入设置两个组件初始状态的语句\n\n```\nbtn2.setEnabled( false\
    \ ) ;\ntxtArea.setText( “Button 2 is Disabled” ) ;\n```\n\n![image](img/7r.jpg)在\
    \ `Actions()` 构造函数中，插入语句，使每个按钮点击时生成 `ActionEvent` 事件\n\n```\nbtn1.addActionListener(\
    \ this ) ;\nbtn2.addActionListener( this ) ;\n```\n\n![image](img/8r.jpg)在构造方法之后，为\
    \ `ActionListener` 接口添加事件处理方法——用于显示哪个按钮被点击的文本\n\n```\npublic void actionPerformed(\
    \ ActionEvent event )\n{\n    txtArea.setText( event.getActionCommand() + “ Clicked\
    \ and Disabled” ) ;\n}\n```\n\n![image](img/9r.jpg)在事件处理方法中插入 `if` 语句——对每个按钮点击执行特定的响应\n\
    \n```\nif ( event.getSource() == btn1 )\n{ btn2.setEnabled( true ) ; btn1.setEnabled(\
    \ false ) ; }\nif ( event.getSource() == btn2 )\n{ btn1.setEnabled( true ) ; btn2.setEnabled(\
    \ false ) ; }\n```\n\n![image](img/10r.jpg)将程序保存为 `Actions.java`，然后编译并运行程序，点击推送按钮\n\
    \n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\n![image](img/pg155_3.jpg)\n\
    \n![image](img/forget.jpg)\n\n组件在构造函数之前声明，因此它们对于事件处理方法是全局可用的。\n\n![image](img/hot.jpg)\n\
    \n在用户执行所需操作之前禁用组件，有时是有用的。\n"
- fmt: "\n## KeyListener\n\nSwing components that allow the user to input text can\
    \ recognize user key strokes with the `KeyListener` interface, which will pass\
    \ the `KeyEvent` event to these three event-handler methods:\n\n| Event-handler:\
    \ | Description: |\n| :--- | :--- |\n| `keyPressed( KeyEvent )` | Called when\
    \ a key is pressed |\n| `keyTyped( KeyEvent )` | Called after a key is pressed\
    \ |\n| `keyReleased( KeyEvent )` | Called when a key is released |\n\nWhen a program\
    \ implements the `KeyListener` interface it must declare these three methods –\
    \ even if not all are actually used.\n\nThe `KeyEvent` object has a `getKeyChar()`\
    \ method, which returns the character for that key, and a `getKeyCode()` method,\
    \ which returns an integer Unicode value representing that key. Additionally,\
    \ a `getKeyText()` method takes the key code value as its argument and returns\
    \ a description of that key.\n\n![image](images/1r.jpg)Edit a copy of `Window.java`\
    \ from [here](#chapter08.html_pg135), changing the class name in the declaration,\
    \ the constructor, and the instance statement from “Window” to “Keystrokes”. Then,\
    \ add an initial statement to import the functionality of the `java.awt.event`\
    \ package\n\n```\nimport java.awt.event.* ;\n```\n\n![image](images/common.jpg)\n\
    \nKeystrokes.java\n\n![image](images/2r.jpg)Edit the class declaration to add\
    \ a `KeyListener` interface to the program\n\n```java\nclass Keystrokes extends\
    \ JFrame implements KeyListener\n```\n\n![image](images/3r.jpg)Before the `Keystrokes()`\
    \ constructor, create a `JTextField` component and a `JTextArea` component\n\n\
    ```java\nJTextField field = new JTextField( 38 ) ;\nJTextArea txtArea = new JTextArea(\
    \ 5 , 38 ) ;\n```\n\n![image](images/4r.jpg)Insert statements to add these two\
    \ components to the `JPanel` container\n\n```java\npnl.add( field ) ;  pnl.add(\
    \ txtArea ) ;\n```\n\n![image](images/5r.jpg)In the `Keystrokes()` constructor,\
    \ insert a statement to make the `JTextField` component generate `KeyEvent` events\n\
    \n```java\nfield.addKeyListener( this ) ;\n```\n\n![image](images/6r.jpg)After\
    \ the constructor method, add an event-handler that acknowledges when a key gets\
    \ pressed\n\n```java\npublic void keyPressed( KeyEvent event )\n{\n    txtArea.setText(\
    \ “Key Pressed” ) ;\n}\n```\n\n![image](images/7r.jpg)Add a second event-handler\
    \ that displays the key character after the key has been pressed\n\n```java\n\
    public void keyTyped( KeyEvent event )\n{\n    txtArea.append( “\\nCharacter :\
    \ ” + event.getKeyChar() ) ;\n}\n```\n\n![image](images/8r.jpg)Add a third event-handler\
    \ that displays the key code and key text when the key gets released\n\n```java\n\
    public void keyReleased( KeyEvent event )\n{\n    int keyCode = event.getKeyCode()\
    \ ;\n    txtArea.append( “\\nKey Code : ” + keyCode ) ;\n    txtArea.append( “\\\
    nKey Text : ” + event.getKeyText( keyCode ) ) ;\n}\n```\n\n![image](images/9r.jpg)Save\
    \ the program as `Keystrokes.java` then compile and run the program, typing in\
    \ the top text field\n\n![image](images/pg159_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nThe `getKeyCode()` method only returns the key code if called from within the\
    \ `keyPressed()` or `keyReleased()` eventhandlers – not from the `keyTyped()`\
    \ eventhandler.\n\n![image](images/hot.jpg)Run this program and press a non-character\
    \ key, such as Backspace, to see its key text name.\n\n## MouseListener\n\n![image](images/pg160_1.jpg)\n\
    \nSwing components can recognize user mouse actions with the `MouseListener` interface,\
    \ which will pass the `MouseEvent` event to these five event-handler methods:\n\
    \n| Event-handler: | Description: |\n| :--- | :--- |\n| `mousePressed( MouseEvent\
    \ )` | Button is pressed |\n| `mouseReleased( MouseEvent )` | Button is released\
    \ |\n| `mouseClicked( MouseEvent )` | Button has been released |\n| `mouseEntered(\
    \ MouseEvent )` | Mouse moves on |\n| `mouseExited( MouseEvent )` | Mouse moves\
    \ off |\n\nMouse movements can be recognized by the `MouseMotionListener` interface,\
    \ which passes `MouseEvent` events to two event-handlers:\n\n| Event-handler:\
    \ | Description: |\n| :--- | :--- |\n| `mouseMoved( MouseEvent )` | Mouse is moved\
    \ |\n| `mouseDragged( MouseEvent )` | Mouse is dragged |\n\nWhen a program implements\
    \ the `MouseListener` or `MouseMotionListener` interface, it must declare all\
    \ its associated event-handler methods – even if not all are actually used.\n\n\
    The `MouseEvent` object passed by the `MouseMotionListener` interface has `getX()`\
    \ and `getY()` methods, which return the current mouse coordinates relative to\
    \ the component generating the event.\n\n![image](images/1r.jpg)Edit a copy of\
    \ `Window.java` from [here](#chapter08.html_pg135), changing the class name in\
    \ the declaration, the constructor, and the instance statement from “Window” to\
    \ “Mouse”. Then, add an initial statement to import the functionality of the `java.awt.event`\
    \ package\n\n```java\nimport java.awt.event.* ;\n```\n\n![image](images/common.jpg)\n\
    \nMouse.java\n\n![image](images/2r.jpg)Edit the class declaration to add a `KeyListener`\
    \ interface and `MouseMotionListener` interface to the program\n\n```java\nclass\
    \ Mouse extends JFrame implements MouseListener, MouseMotionListener\n```\n\n\
    ![image](images/3r.jpg)Before the `Mouse()` constructor, create a `JTextArea`\
    \ component and two integer variables to store coordinates\n\n```java\nJTextArea\
    \ txtArea = new JTextArea( 8 , 38 ) ;\nint x , y ;\n```\n\n![image](images/4r.jpg)In\
    \ the `Mouse()` constructor, insert statements to add the `JTextArea` component\
    \ to the `JPanel` container and to make it generate `MouseEvent` events\n\n```java\n\
    pnl.add( txtArea ) ;\ntxtArea.addMotionListener( this ) ;\ntxtArea.addMouseListener(\
    \ this ) ;\n```\n\n![image](images/5r.jpg)After the constructor method, add an\
    \ event-handler for the `MouseMotionListener` interface\n\n```java\npublic void\
    \ mouseMoved( MouseEvent event )\n{\n    x = event.getX() ;\n    y = event.getY()\
    \ ;\n}\n\npublic void mouseDragged( MouseEvent event )\n{\n    x = event.getX()\
    \ ;\n    y = event.getY() ;\n}\n```\n\n![image](images/6r.jpg)Add five event-handlers\
    \ for the `MouseListener` interface\n\n```java\npublic void mousePressed( MouseEvent\
    \ event )\n{\n    txtArea.append( “\\nPressed at X: ” +x+ “Y: “ +y ) ;\n}\n\n\
    public void mouseReleased( MouseEvent event )\n{\n    txtArea.append( “\\nReleased”\
    \ ) ;\n}\n\npublic void mouseClicked( MouseEvent event )\n{\n    txtArea.append(\
    \ “\\nClicked” ) ;\n}\n\npublic void mouseEntered( MouseEvent event )\n{\n   \
    \ txtArea.setText( “\\nEntered” ) ;\n}\n\npublic void mouseExited( MouseEvent\
    \ event )\n{\n    txtArea.setText( “\\nExited” ) ;\n}\n```\n\n![image](images/7r.jpg)Save\
    \ the program as `Mouse.java`, then compile and run the program, clicking on the\
    \ `JTextArea` component. Rollover effects can be created by swapping images with\
    \ the `mouseEntered()` and `mouseExited()` event-handler methods.\n\n## Announcing\
    \ messages\n\nThe Swing `JOptionPane` class is designed to create a standard dialog\
    \ box centered on its parent window. Its `showMessageDialog()` method displays\
    \ a message to the user providing information, warning, or error description.\n\
    \n![image](images/pg162_1.jpg)\n\nThe `showMessageDialog()` method can take four\
    \ arguments:\n\n- Parent object – typically referenced by the `this` keyword\n\
    - Message `String` to be displayed\n- Dialog title `String`\n- One of the `JOptionPane`\
    \ constants: `INFORMATION_MESSAGE`, `WARNING_MESSAGE` or `ERROR_MESSAGE`\n\nThe\
    \ dialog box will display an appropriate icon according to which `JOptionPane`\
    \ constant is specified.\n"
