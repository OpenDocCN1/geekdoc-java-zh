    **sub() ;**


    ![image](images/3bl.jpg)After the main method, before the final curly bracket
    of the class, add the second method to output a message


    **public static void sub()**


    **{**


    **System.out.println( “Message from the sub method.” ) ;**


    **}**


    ![image](images/4bl.jpg)Save the program as **Methods.java** then compile and
    run the program to see the output


    ![image](images/pg98_2.jpg)


    ![image](images/forget.jpg)


    The syntax to call a method without arguments just needs the method name, followed
    by parentheses.


    A class may even contain multiple methods of the same name providing they each
    have different arguments – requiring a different number of arguments, or arguments
    of different data types. This useful feature is known as method “overloading”.


    ![image](images/1bl.jpg)Start a new program named “Overload” containing the standard
    main method


    **class Overload**


    **{**


    **public static void main ( String[] args ) {      }**


    **}**


