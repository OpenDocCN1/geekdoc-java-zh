  trans: "\n\n`java.lang` 包中的 `String` 类提供了实用的 `equals()` 方法，该方法在此处被引入，用于评估 `args[0]`\
    \ 元素中的命令行参数。也可以通过使用点符号法将方法名附加到第一个 `String` 变量上，并指定要比较的 `String` 作为其参数，用来比较任何两个\
    \ `String` 值。例如，比较 `txt2` 和 `txt1` 的语法是 `txt1.equals( txt2 )`。当两个 `String` 值都具有相同的字符且顺序相同时，该方法返回\
    \ `true`；否则返回 `false`。\n\n![image](img/pg90_1.jpg)\n\n使用不同字母大小写的 `String` 值（例如“Java”和“JAVA”）不被认为是相等的，因为字符的\
    \ ASCII 码值不同。例如，大写字母“A”的值为 65，而小写字母“a”的值为 97。\n\n在将用户输入的 `String` 值（用户输入的字母大小写不确定）与程序中的\
    \ `String` 值进行比较时，通常将输入转换为特定的大小写非常有用。为了此目的，`String` 类提供了 `toUpperCase()` 方法和 `toLowerCase()`\
    \ 方法。将输入的 `String` 指定为参数，该方法返回转换后的 `String`。\n\n一个典型的示例是将用户输入的密码 `String` 强制转换为小写，然后将其与程序中以全小写存储在\
    \ `String` 变量中的正确密码进行比较。这将允许用户在允许忽略大小写的情况下，以大写、小写或大小写混合输入密码。\n\n点符号允许将方法附加到其他方法上，以便按顺序执行这些操作。这意味着可以使用\
    \ `toLowerCase().equals()` 将一个 `String` 值转换为小写，然后将该小写版本与指定的参数进行比较。\n\n![image](img/snake.jpg)\n\
    \n请确保在 `toUpperCase` 和 `toLowerCase` 方法中使用大写字母“C”来正确的大小写。\n\n![image](img/1o.jpg)创建一个名为“StringComparison”的新程序，包含标准的\
    \ main 方法\n\n```java\nclass StringComparison {\n    public static void main (\
    \ String[] args ) { }\n}\n```\n\n![image](img/common.jpg)\n\nStringComparison.java\n\
    \n![image](img/2o.jpg)在 main 方法中，创建并初始化一个带有正确小写密码的 `String` 变量\n\n```java\nString\
    \ password = “bingo” ;\n```\n\n![image](img/3o.jpg)添加 `try catch` 语句来捕捉未输入密码参数时发生的异常\n\
    \n```java\ntry { }\ncatch( Exception e ) {\n    System.out.println( “Password\
    \ required.” ) ;\n}\n```\n\n![image](img/4o.jpg)在 `try` 语句块中插入此 `if else` 语句，以评估用户输入的密码参数\n\
    \n```java\nif ( args[0].toLowerCase().equals( password ) ) {\n    System.out.println(\
    \ “Password accepted.” ) ;\n}\nelse {\n    System.out.println( “Incorrect password.”\
    \ ) ;\n}\n```\n\n![image](img/5o.jpg)将程序保存为 `StringComparison.java`，然后使用各种参数编译并运行程序\n\
    \n![image](img/pg91_1.jpg)\n\n### 搜索字符串\n\n`java.lang` 包中的 `String` 类提供了 `startsWith()`\
    \ 和 `endsWith()` 方法来比较 `String` 值的部分。这些方法在比较多个 `String` 值并选择具有相同开头或相同结尾的字符串时特别有用。当\
    \ `String` 部分与指定的参数匹配时，该方法返回 `true`；否则返回 `false`。\n\n![image](img/pg92_1.jpg)\n\
    \n通过将要复制的第一个字符的位置号作为其 `substring()` 方法的参数，可以复制 `String` 值的一个部分。这将返回原始 `String`\
    \ 值的子字符串，从指定的起始位置开始，到原始 `String` 的末尾结束。\n\n可选地，`substring()` 方法可以接受第二个参数，以指定要复制的最后一个字符的位置号。这将返回原始\
    \ `String` 值的子字符串，从指定的起始位置开始，到指定的结束位置结束。\n\n可以搜索 `String` 值以找到作为其 `indexOf()`\
    \ 方法参数的字符或子字符串。不同寻常的是，该方法返回匹配的字符或子字符串在所搜索的 `String` 值中首次出现的数字位置。如果未找到匹配项，该方法返回负整数值\
    \ -1。\n\n![image](img/1o.jpg)创建一个名为“StringSearch”的新程序，包含标准的 main 方法\n\n```java\n\
    class StringSearch {\n    public static void main ( String[] args ) { }\n}\n```\n\
    \n![image](img/common.jpg)\n\nStringSearch.java\n\n![image](img/2o.jpg)在 main\
    \ 方法中，创建一个初始化的书名 `String` 数组\n\n```java\nString[] books = {\n    “Java in easy\
    \ steps”, “XML in easy steps” ,\n    “SQL in easy steps”, ”CSS in easy steps”\
    \ ,\n    “Gone With the Wind”, “Drop the Defense” } ;\n```\n\n![image](img/3o.jpg)创建并初始化三个\
    \ `int` 计数器\n\n```java\nint counter1 = 0 , counter2 = 0 , counter3 = 0 ;\n```\n\
    \n![image](img/4o.jpg)添加一个 `for` 循环遍历 `String` 数组，输出每个标题的前四个字符\n\n```java\nfor\
    \ ( int i = 0 ; i < books.length ; i++ ) {\n    System.out.print( books[i].substring(\
    \ 0,4 ) + “ | ” )\n}\n```\n\n![image](img/5o.jpg)在 `for` 循环中插入语句，计算具有特定结尾的标题\n\
    \n```java\nif ( books[i].endsWith( “steps” ) ) counter1++;\n```\n\n![image](img/6o.jpg)在\
    \ `for` 循环中插入语句，计算具有特定开头的标题\n\n```java\nif ( books[i].startsWith( “Java” ) ) counter2++;\n\
    ```\n\n![image](img/7o.jpg)在 `for` 循环中插入语句，计算不包含特定子字符串的标题\n\n```java\nif ( books[i].indexOf(\
    \ “easy” ) == -1 ) counter3++;\n```\n\n![image](img/8o.jpg)在 main 方法末尾添加这些语句，输出搜索结果\n\
    \n```java\nSystem.out.println( “\\nFound “ + counter1 + “ titles from this series”\
    \ ) ;\nSystem.out.println( “Found “ + counter2 + “ Java title” ) ;\nSystem.out.println(\
    \ “Found “ + counter3 + “ other titles” ) ;\n```\n\n![image](img/9o.jpg)将程序保存为\
    \ `StringSearch.jpg`，然后编译并运行程序查看输出\n\n![image](img/pg93_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n`!` 运算符不能用于测试 `indexOf()` 方法是否失败——因为它返回的是整数值，而不是布尔值。\n\n### 操作字符\n\n`java.lang`\
    \ 包中的 `String` 类提供了 `trim()` 方法，用于移除指定参数的 `String` 首尾的空白字符。该方法将移除所有的额外空格、换行和制表符，返回处理后的\
    \ `String`。\n\n![image](img/pg94_1.jpg)\n\n通过将其在 `String` 中的索引位置作为其 `charAt()`\
    \ 方法的参数，可以访问 `String` 中的单个字符。该方法将 `String` 视为字符数组，第一个字符位于位置零——就像其他从零开始索引的数组一样。`String`\
    \ 的第一个字符可以通过 `charAt(0)` 访问，第二个字符可以通过 `charAt(1)` 访问，依此类推。\n\n由于字符索引从零开始，`String`\
    \ 的最后一个字符的索引总是比 `String` 中的字符总数少一。这意味着任何 `String` 的最后一个字符的索引号等于 `length() - 1`。因此，一个名为“str”的\
    \ `String` 的最后一个字符可以通过 `str.charAt( str.length() - 1 )` 访问。\n\n"
- fmt: "\nAll occurrences of a particular character in a `String` can be replaced\
    \ by another character using its `replace()` method. This method requires two\
    \ arguments that specify the character to be replaced and the character that is\
    \ to take its place. For example, to replace all occurrences of the letter “a”\
    \ with the letter “z”, the syntax would be `replace( ‘a’ , ‘z’ )`.\n\nThe `isEmpty()`\
    \ method can be used to discover if a `String` contains no characters. This method\
    \ will return `true` if the `String` is absolutely empty, otherwise it will return\
    \ `false`.\n\n![image](images/1o.jpg)Start a new program named “CharacterSwap”\
    \ containing the standard main method\n\n```java\nclass CharacterSwap\n{\n   \
    \ public static void main ( String[] args ) {             }\n}\n```\n\n![image](images/common.jpg)\n\
    \nCharacterSwap.java\n\n![image](images/2o.jpg)Inside the main method, declare\
    \ and initialize an empty `String` variable\n\n```java\nString txt = ““ ;\n```\n\
    \n![image](images/3o.jpg)Assign some characters to the `String` variable, if it\
    \ is indeed empty, with both leading and trailing spaces\n\n```java\nif ( txt.isEmpty()\
    \ ) txt = “      Borrocudo      “ ;\n```\n\n![image](images/4o.jpg)Output the\
    \ `String` value and the number of characters it contains\n\n```java\nSystem.out.println(\
    \ “String: “ + txt ) ;\nSystem.out.println( “Original String Length: “ + txt.length()\
    \ ) ;\n```\n\n![image](images/5o.jpg)Remove the leading and trailing spaces, then\
    \ output the `String` value and its size again\n\n```java\ntxt = txt.trim() ;\n\
    System.out.println( “String: “ + txt ) ;\nSystem.out.println( “String Length:\
    \ “ + txt.length() ) ;\n```\n\n![image](images/6o.jpg)Output the first character\
    \ in the `String`\n\n```java\nchar initial = txt.charAt(0) ;\nSystem.out.println(\
    \ “First Letter: “ + initial ) ;\n```\n\n![image](images/7o.jpg)Now, output the\
    \ last character in the `String`\n\n```java\ninitial = txt.charAt( ( txt.length()\
    \ -1 ) );\nSystem.out.println( “Last Letter: “ + initial ) ;\n```\n\n![image](images/8o.jpg)Replace\
    \ all occurrences of the letter “o” with letter “a”\n\n```java\ntxt = txt.replace(\
    \ ‘o’ , ’a’ ) ;\nSystem.out.println( “String: “ + txt ) ;\n```\n\n![image](images/9o.jpg)Save\
    \ the program as **CharacterSwap.java** then compile and run the program to see\
    \ the output\n\n![image](images/pg95_1.jpg)\n\n## Summary\n\n- The Java documentation\
    \ provides information about the methods and properties in each Java class.\n\
    - Java classes that are fundamental to the Java language are contained in the\
    \ `java.lang` package, in the `java.base` module.\n- The `Math` class provides\
    \ `Math.PI` and `Math.E` constants.\n- `Math.pow()` raises to a specified power\
    \ and `Math.sqrt()` returns the square root of a specified number.\n- Numbers\
    \ can be rounded to an integer value with `Math.round()`, `Math.floor()`, and\
    \ `Math.ceil()`.\n- Numbers can be compared with `Math.max()` and `Math.min()`.\n\
    - `Math.random()` returns a `double` precision random number between 0.0 and 0.999999999999999.\n\
    - A `String` is zero or more characters enclosed in quote marks.\n- The `length()`\
    \ method returns the size of its `String`, much like the `length` property of\
    \ an array.\n- The `concat()` method of a `String` appends another `String` value.\n\
    - The `equals()` method of a `String` only returns `true` when two `String` values\
    \ have identical characters, in the same order.\n- Character case of a `String`\
    \ can be changed using its `toUpperCase()` method and `toLowerCase()` method.\n\
    - `String` values can be compared using the `startsWith()` and `endsWith()` methods\
    \ of a `String`.\n- A substring can be sought in a `String` using its `indexOf()`\
    \ and `substring()` methods.\n- The `isEmpty()` method only returns `true` when\
    \ the `String` contains absolutely nothing.\n- Characters can be manipulated within\
    \ a `String` value using its `trim()`, `charAt()`, and `replace()` methods.\n\n\
    6\n\n## Creating classes\n\n***This chapter demonstrates how to create Java programs\
    \ that employ multiple methods and classes.***\n\n- [Forming multiple methods](#chapter06.html_sec47)\n\
    - [Understanding program scope](#chapter06.html_sec48)\n- [Forming multiple classes](#chapter06.html_sec49)\n\
    - [Extending an existing class](#chapter06.html_sec50)\n- [Creating an object\
    \ class](#chapter06.html_sec51)\n- [Producing an object instance](#chapter06.html_sec52)\n\
    - [Encapsulating properties](#chapter06.html_sec53)\n- [Constructing object values](#chapter06.html_sec54)\n\
    - [Summary](#chapter06.html_sec55)\n\n### Forming multiple methods\n\nPrograms\
    \ are typically split into separate methods to create tasks, making it easier\
    \ to track down bugs, as each method can be tested individually. The syntax to\
    \ call a method without arguments just needs the method name, followed by parentheses.\
    \ A class may even contain multiple methods of the same name providing they have\
    \ different arguments – or arguments of different types. This useful feature is\
    \ known as “overloading”.\n\n![image](images/1bl.jpg)Start a new program named\
    \ “Methods” containing the standard main method\n\n```java\nclass Methods\n{\n\
    \    public static void main ( String[] args ) {             }\n}\n```\n\n![image](images/common.jpg)\n\
    \nMethods.java\n\n![image](images/2bl.jpg)Between the curly brackets of the main\
    \ method, insert statements to output a message and to call second method named\
    \ “sub”\n\n```java\nSystem.out.println( “Message from main method.” ) ;\n```\n\
    \n![image](images/3bl.jpg)After the main method, before the curly bracket of the\
    \ class, add second method to output a message\n\n```java\npublic static void\
    \ sub()\n{\n    System.out.println( “Message from sub method.” ) ;\n}\n```\n\n\
    ![image](images/4bl.jpg)Save the program as **Methods.java** then compile and\
    \ run the program to see the output\n\n![image](images/pg98_2.jpg)\n\n![image](images/snake.jpg)The\
    \ declaration for each of the overloaded methods must indicate that the method\
    \ returns a **String** value, not **void**.\n\n![image](images/1bl.jpg)Start a\
    \ new program named “Overload” containing the standard main method\n\n```java\n\
    class Overload\n{\n    public static void main ( String[] args ) {           \
    \  }\n}\n```\n\n![image](images/common.jpg)\n\nOverload.java\n\n![image](images/2bl.jpg)Between\
    \ the curly brackets of the main method, insert three statements calling different\
    \ overloaded methods and passing them argument values\n\n```java\nSystem.out.println(\
    \ write( 12 ) ) ;\nSystem.out.println( write( “Twelve” ) ;\nSystem.out.println(\
    \ write( 4 , 16 ) ) ;\n```\n\n![image](images/3bl.jpg)After the main method, before\
    \ the curly bracket of the class, add the three overloaded methods to each return\
    \ a **String** to the caller\n\n```java\npublic static String write( int num )\n\
    {\n    return ( “Integer passed is “ + num ) ;\n}\n\npublic static String write(\
    \ String num )\n{\n    return ( “String passed is “ + num ) ;\n}\n\npublic static\
    \ String write( int num1 , int num2 )\n{\n    return ( “Sum Total is “ + ( num1\
    \ * num2 ) ) ;\n}\n```\n\n![image](images/4bl.jpg)Save the program as **Overload.java**\
    \ then compile and run the program to see the output\n\n![image](images/pg99_1.jpg)\n\
    \n### Understanding program scope\n\nA variable that is declared inside a method\
    \ is only accessible from inside that method – its “scope” of accessibility is\
    \ only local to the method in which it is declared. This means that a variable\
    \ of the same name can be declared in another method without conflict.\n"
