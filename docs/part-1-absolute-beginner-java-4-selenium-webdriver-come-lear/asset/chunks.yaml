    \ 10)` 为真并执行语句。\n\n## Switch 分支\n\nswitch 分支评估单个变量，然后根据变量的值执行语句。原始数据类型 `byte`、`short`、`char`\
    \ 和 `int` 可以与 `String` 一起被评估。在某些情况下，两种分支都适用。然而，switch 分支在处理特定数量的值（如星期）时效率最高。否则，在处理无限数量的值时最好实现\
