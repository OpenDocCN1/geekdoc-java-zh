  trans: "\n\n注意：通常情况下，使用大于运算符（`>`）的条件会实现递减运算符（—，而使用小于运算符（`<`）的条件会实现递增运算符（++)。\n\n\
    ## 嵌套 for 循环\n\n嵌套 `for` 循环在一个 `for` 循环内部包含另一个 `for` 循环。外层 `for` 循环作为内部循环的嵌套。内部循环中的语句可以使用外层循环的循环控制变量。因此，最好为每个循环使用不同的循环控制变量。以下是一个嵌套\
    \ `for` 循环的示例：\n\n```java\npublic class ControlStructures\n{\n    public static\
    \ void main (String[] args)\n    {\n        for (int x = 0; x < 3; x++ )\n   \
    \     {\n            System.out.println(\"Outer Loop value is \" + x);\n     \
    \       for (int y = 0; y < 3; y++ )\n            {\n                System.out.println(\"\
    \  Inner Loop value is \" + y);\n            }\n        }\n    }\n}\n```\n\n![image](img/image012.png)\n\
    图 4.12 – 嵌套 for 循环\n\n程序输出：\nOuter Loop value is 0\nInner Loop value is 0\nInner\
    \ Loop value is 1\nInner Loop value is 2\nOuter Loop value is 1\nInner Loop value\
    \ is 0\nInner Loop value is 1\nInner Loop value is 2\nOuter Loop value is 2\n\
    Inner Loop value is 0\nInner Loop value is 1\nInner Loop value is 2\n\n第八行使用关键字\
    \ `for` 开始嵌套的 for 循环，后面跟随着参数初始化、条件和迭代。初始化 `(int y = 0;)` 将零 赋值为起始值。条件 `(y < 3)`\
    \ 将 3 设置为循环控制变量的停止点。递增 `(y++)` 将循环控制变量 增加一。该语句通过第 10 行打印循环控制变量。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# while 循环\n\n![image](img/chapter_title_below.png)\n\n`while` 循环在条件为真时重复执行语句。条件是在执行语句之前进行检查的布尔表达式。此外，变量名\
    \ 在循环之前初始化，并作为条件的一部分进行评估。在执行语句时，`while` 循环将持续运行直到条件变为假。以下是 `while` 循环的语法。\n\n\
    ### 语法\n\n```java\nwhile (condition)\n{\n    statement(s);\n}\n```\n\n### 语法细节\n\
    \n| 参数 | 说明 |\n| :--- | :--- |\n| while | 开始循环的关键字 |\n| condition | 决定循环是否重复的布尔表达式\
    \ |\n| { | 左大括号 |\n| statement(s) | 条件满足后执行的语句(s) |\n| ; | 完成语句的分号 |\n| } | 右大括号\
    \ |\n\n图 4.13 – while 循环语法。以下是一个 `while` 循环示例：\n\n```java\npublic class ControlStructures\n\
    {\n    public static void main (String[] args)\n    {\n        int i = 0;\n  \
    \      while (i < 5)\n        {\n            System.out.println(\"The variables\
    \ value is \" + i);\n            i++;\n        }\n    }\n}\n```\n\n![image](img/image027.png)\n\
    图 4.14 – while 循环示例\n\n程序输出：\nThe variables value is 0\nThe variables value is\
    \ 1\nThe variables value is 2\nThe variables value is 3\nThe variables value is\
    \ 4\n\n第五行将变量 `i` 初始化为 \"0\"。该变量将在第七行作为关键字 `while` 之后条件 `(i < 5)` 的一部分进行评估。当条件为真时，通过第九行反复打印变量\
    \ `i` 的值。注意第 10 行的递增运算符。需要注意的是，如果不添加递增运算符，`while` 循环将永远停止。因此，循环将无限持续，产生无限循环。此外，如果未设置初始化条件变量，`while`\
    \ 循环将变得无止。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# do while 循环\n\n![image](img/chapter_title_below.png)\n\
    \n`do while` 循环在循环底部评估条件。因此，循环将执行语句，然后评估条件。结果是，`do while` 循环至少执行一次语句，只要条件为真就会一直执行。以下是\
    \ `do while` 循环的语法：\n\n```java\ndo\n{\n    statement(s);\n} while (condition);\n\
    ```\n\n### 语法\n\n| 参数 | 说明 |\n| :--- | :--- |\n| do | 开始循环的关键字 |\n| { | 左大括号 |\n\
    | statement(s) | 至少执行的语句(s) |\n| ; | 完成语句的分号 |\n| } | 右大括号 |\n| while | 决定循环是否重复的关键字\
    \ |\n| condition | 决定循环是否重复的布尔表达式 |\n| ; | 完成条件的分号 |\n\n图 4.15 – do 循环细节。以下是一个\
    \ `do while` 循环示例：\n\n```java\npublic class ControlStructures\n{\n    public static\
    \ void main (String[] args)\n    {\n        int i = 0;\n        do\n        {\n\
    \            System.out.println(\"The variables value is \" + i);\n          \
    \  i++;\n        }\n        while (i > 5);\n    }\n}\n```\n\n![image](img/image026.png)\n\
    图 4.16 – do while 循环示例\n\n程序输出：\nThe variables value is 0\nThe variables value\
    \ is 1\nThe variables value is 2\nThe variables value is 3\nThe variables value\
    \ is 4\n\n第五行将变量 `i` 初始化为 \"0\"。在关键字 `do` 之后，变量将在第七行作为条件 `(i < 5)` 的一部分进行评估。当条件为真时，通过第九行反复打印变量\
    \ `i` 的值。巧合的是，在语句第 12 行之后评估条件。和 `while` 循环一样，如果不在第 10 行添加递增运算符（++)，就会发生无限循环。此外，如果没有正确设置初始化和条件值，可能会产生无限循环。在本示例中，由于条件从真结果开始，语句重复了多次。以下是当条件从假结果开始的情况：\n\
    \n```java\npublic class ControlStructures\n{\n    public static void main (String[]\
    \ args)\n    {\n        int i = 0;\n        do\n        {\n            System.out.println(\"\
    The variables value is \" + i);\n            i++;\n        }\n        while (i\
    \ > 5);\n    }\n}\n```\n\n![image](img/image001.png)\n图 4.17 – do while 循环示例（假条件开始）\n\
    \n程序输出：\nThe variables value is 0\n\n第五行将变量 `i` 初始化为 \"0\"。因此，第 12 行的条件 `(i >\
    \ 5)` 为假，因为零小于五。`do while` 循环执行了语句，因为语句先执行，然后评估条件。\n\n注意：循环 (for、while 和 do while)\
    \ 在功能上相似。决定使用哪种循环的经验法则是：\n\n*   在执行特定次数的迭代时，使用 for 循环\n*   当循环重复次数不确定时，使用 while\
    \ 循环\n*   当循环需要至少执行一次时，使用 do while 循环\n\n# break 退出\n\n"
- fmt: "\nThe `break` (#c018.xhtml_break) keyword is optional and used to force an\
    \ exit from a branch or loop. If a break occurs within a nested branch or loop\
    \ then the innermost branch or loop discontinues. However, execution resumes at\
    \ the statement immediately following the current branch or loop. The following\
    \ is a `break` (#c018.xhtml_break) keyword example using statements from [Figure\
    \ 4.8](#c036.xhtml_Figure_4_8) (Switch Branch).\n\n```java\npublic class ControlStructures\n\
    {\n    public static void main (String[] args)\n    {\n        int day = 6;\n\
    \        switch (day)\n        {\n            case 1:\n                System.out.println(\"\
    Sunday is the 1st day of the week\");\n                break;\n            case\
    \ 2:\n                System.out.println(\"Monday is the 2nd day of the week\"\
    );\n                break;\n            case 3:\n                System.out.println(\"\
    Tuesday is the 3rd day of the week\");\n                break;\n            case\
    \ 4:\n                System.out.println(\"Wednesday is the 4th day of the week\"\
    );\n                break;\n            case 5:\n                System.out.println(\"\
    Thursday is the 5th day of the week\");\n                break;\n            case\
    \ 6:\n                System.out.println(\"Friday is the 6th day of the week\"\
    );\n                break;\n            case 7:\n                System.out.println(\"\
    Saturday is the 7th day of the week\");\n                break;\n            default:\n\
    \                System.out.println(\"Not valid: There are only 7 days in a week\"\
    );\n        }\n    }\n}\n```\n\n![image](d2d_images/image034.png)Figure 4.18 –\
    \ Break Keyword Example\n\nIn this example, the `break` (#c018.xhtml_break) keyword\
    \ is used to exit a case if a match is located. A match happens for case six at\
    \ line 24. The `break` (#c018.xhtml_break) keyword prevents case seven (line 27)\
    \ and the default (line 30) from executing.\n\nNote: More than one `break` (#c018.xhtml_break)\
    \ keyword can appear in a branch or loop. There is a `break` (#c018.xhtml_break)\
    \ keyword after every case.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Continue To Next Statement\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nThe `continue` (#c018.xhtml_continue) keyword forces the current loop iteration\
    \ to stop and immediately execute the next loop iteration. As a result, the condition\
    \ and statement between both intervals are skipped. The following is an example\
    \ using the `continue` (#c018.xhtml_continue) keyword to skip all odd numbers:\n\
    \n```java\npublic class ControlStructures\n{\n    public static void main (String[]\
    \ args)\n    {\n        for (int x = 2; x <= 10; x++ )\n        {\n          \
    \  if (x % 2 != 0) continue;\n            System.out.println(\"Even numbers \"\
    \ + x);\n        }    \n    }\n}\n```\n\n![image](d2d_images/image000.png)Figure\
    \ 4.19 – Continue Keyword\n\nProgram Output:\nEven numbers 2\nEven numbers 4\n\
    Even numbers 6\nEven numbers 8\nEven numbers 10\n\nLine seven implements the `continue`\
    \ (#c018.xhtml_continue) keyword to bypass all odd numbers. Therefore, the condition\
    \ and statements are skipped when the loop control variable `i` equals one, three,\
    \ five, seven, and nine.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Conclusion\n\n![image](d2d_images/chapter_title_below.png)\n\nThe purpose\
    \ of “Part 1 – Java 4 Selenium WebDriver” was to provide a good foundational knowledge\
    \ of Java. An understanding of Java facilitates the process of testing an Application\
    \ Under Testing (AUT) via Selenium. The key to verifying data within an AUT, is\
    \ knowing how to access and manipulate data. Data is represented by variables,\
    \ which can be text or numbers. All variables must have a data type to indicate\
    \ the range and behavior. The data type is significant when dealing with operators\
    \ because certain functions are performed according to the data type. In addition,\
    \ some of the operators are contributors to forming control structures. The following\
    \ items are take–away topics from the book: \n\n- [Variables](#c017.xhtml_A_variable):\
    \ A location that holds data\n- [Data Types](#c017.xhtml_Data_Type): Refer to\
    \ a variable’s type\n- [Operators](#c024.xhtml_Operators): A symbol that performs\
    \ mathematical or logical operations\n- [Control Structures](#c034.xhtml_Control_structures):\
    \ Refers to the process of using logic to force the program to skip or loop statements\n\
    \nThe second book is titled “[(Part 2) Java 4 Selenium WebDriver](http://tinyurl.com/Review-Part-2-Java-4-Selenium)“.\
    \ It takes a closer look at Classes, Objects, and Methods while examining Object-Oriented\
    \ Programming (OOP), which consist of Inheritance, Encapsulation, and Polymorphism.\
    \ In addition, the book explores Packages, Interfaces, Exception Handling, and\
    \ how to utilize Input/Output.\n"
