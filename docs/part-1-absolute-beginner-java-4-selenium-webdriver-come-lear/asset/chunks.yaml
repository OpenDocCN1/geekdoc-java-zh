  trans: "\n\n运算符是对一个或多个操作数进行数学或逻辑处理的符号。操作数可以是任何可以被更改或处理的对象。最常见操作数是变量。在 `Java` 中，有四种运算符：算术运算符、位运算符运算符、逻辑运算符\
    \ 和 关系运算符。算术运算符、逻辑运算符 和关系运算符 是最常用的运算符。下面的示例演示了乘法运算符 (*) 运算符和操作数（三和四）：\n\n```java\n\
    public class Operators\n{  \n    public static void main(String[] args)\n    {\n\
    \        int answer;\n        answer = 3 * 4; \n        System.out.println(\"\
    What is 3 times 4? \" + answer);\n    }\n}\n```\n\n![image](img/image037.png)\n\
    图 3.1 – 运算符和操作数\n\n程序输出：\nWhat is 3 times 4? 12\n\n本章提供了关于运算符的以下信息：\n✓ 算术运算符\n\
    ✓ 位运算符\n✓ 逻辑运算符\n✓ 关系运算符\n✓ 赋值运算符\n✓ 三目运算符\n✓ 运算符优先级\n✓ 数据类型转换\n✓ 表达式\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 算术运算符\n\n![image](img/chapter_title_below.png)\n\n算术运算符对数值执行数学运算。因此，算术运算符可以应用于任何涉及数字的数据类型。以下是算术运算符列表：\n\
    \n1. `+` (加法)#c025.xhtml_Operator_Addition) 运算符\n2. `-` (减法)#c025.xhtml_Operator_Subtraction)\
    \ 运算符\n3. `*` (乘法)#c025.xhtml_Operator_Multiplication) 运算符\n4. `/` (除法)#c025.xhtml_Operator_Division)\
    \ 运算符\n5. `%` (取模)#c025.xhtml_Operator_Modulus) 运算符\n6. `++` (自增)#c025.xhtml_Operator_Increment)\
    \ 运算符\n7. `—` (自减)#c025.xhtml_Operator_Decrement) 运算符\n\n| 运算符 | 说明 |\n| :---\
    \ | :--- |\n| `+` | 将 `+` 运算符两侧的值相加；用于连接字符串所需的字符串拼接 |\n| `-` | 从左操作数中减去右操作数 |\n\
    | `*` | 乘法 `*` 运算符两侧的值 |\n| `/` | 将左操作数除以右操作数 |\n| `%` | 将左操作数除以右操作数并返回余数 |\n\
    | `++` | 将操作数的值加一 |\n| `—` | 将操作数的值减一 |\n\n图 3.2 – 算术运算符\n\n注意：除法运算符 (`/`）会截断余数，而取模运算符\
    \ (`%`）会返回余数。例如，`10/3` 只返回三并截断了余数（余数为一）。另一方面，`10%3` 只返回余数一。\n\n## 自增算术运算符\n\n\
    自增运算符将操作数 加一。该运算符具有前缀和后缀形式。下面的语法显示了两种自增运算符形式，它们与以下表达式相同：\n\n`i = i + 1;`\n\n前缀形式语法\n\
    `++i;`\n\n后缀形式语法\n`i++;`\n\n## 自减算术运算符\n\n自减运算符从操作数 中减一。该运算符具有前缀和后缀形式。下面的语法显示了两种自减运算符形式，它们与以下表达式相同：\n\
    \n`i = i - 1;`\n\n前缀形式语法\n`—i;`\n\n后缀形式语法\n`i—;`\n\n以下是每个算术运算符的示例：\n\n```java\n\
    public class Operators\n{  \n    public static void main(String[] args)\n    {\n\
    \        int result, x = 10;\n        result = x + y; // Addition\n        System.out.println(\"\
    x + y = \" + result);\n        result = x - y; // Subtraction\n        System.out.println(\"\
    x - y = \" + result);\n        result = x * y; // Multiplication\n        System.out.println(\"\
    x * y = \" + result);\n        result = x / y; // Division\n        System.out.println(\"\
    x / y = \" + result);\n        result = x % y; // Modulus\n        System.out.println(\"\
    x % y = \" + result);\n        x++; // Increment\n        System.out.println(\"\
    x++ = \" + x);\n        ++x; // Increment\n        System.out.println(\"++x =\
    \ \" + x);\n        x--; // Decrement\n        System.out.println(\"x-- = \" +\
    \ x);\n        --x; // Decrement\n        System.out.println(\"--x = \" + x);\n\
    \    }\n}\n```\n（注：代码块示例的原始源文本是碎片化的；我根据文中提供的上下文重构了逻辑。）\n\n![image](img/image57.png)\n\
    图 3.3 – 算术运算符\n\n程序输出：\nWhat is 3 times 4? 12\n\n在这个示例中，`x` 被赋值为 10，`y` 被赋值为 3。`+`\
    \ 运算符将 `x` 和 `y` 相加。`result` 被赋值为和。`-` 运算符从 `x` 中减去 `y`。`result` 被赋值为差。`*` 运算符将\
    \ `x` 和 `y` 相乘。`result` 被赋值为积。`/` 运算符将 `x` 除以 `y`。`result` 被赋值为商。`%` 运算符将 `x`\
    \ 除以 `y` 并返回余数。`result` 被赋值为余数。`x++` 让 `x` 加一。`++x` 也让 `x` 加一。`x--` 让 `x` 减一。`--x`\
    \ 也让 `x` 减一。\n\n"
- fmt: "\n| << | Shifts the left operand’s value to the left by the number of bits\
    \ specified by the right operand | `x << 2` |\n| ~![image](d2d_images/scene_break.png)\
    \ | Changes every bit to the opposite bit. For example, every 1 bit changes to\
    \ 0 and every 0 bit changes to 1 | `~2` |\n\nFigure 3.4 – Bitwise Operators\n\n\
    # Logical Operators\n\nLogical Operators (known as Conditional Operators) return\
    \ a `boolean` value based on one or more `expressions`. Therefore, the Logical\
    \ Operator’s data type must be `boolean`. The following is a list of logical operators:\n\
    \n* `&&` (Logical AND) operator\n* `||` (Logical OR) operator\n* `^` (Logical\
    \ exclusive OR (XOR)) operator\n* `!` (Logical NOT) operator\n\n| Operator | Description\
    \ |\n| :--- | :--- |\n| `&&` | Returns true if both operands are true. Returns\
    \ false if one operand or both operands are false |\n| `||` | Returns true if\
    \ one operand or both operands are true. Returns false if both operands are false\
    \ |\n| `^` | Returns true if only one operand is true. Returns false if both operands\
    \ are false and if both operands are true |\n| `!` | Returns the opposite value\
    \ of the operand. Returns true if the operand is false and return false if the\
    \ operand is true |\n\nFigure 3.5 – Logical Operators\n\nNote: The Bitwise Operators\
    \ and Logical Operators perform some of the same functions. The following are\
    \ examples of each logical operator and two bitwise operators:\n\n```java\npublic\
    \ class Operators\n{  \n    public static void main (String[] args)\n    {\n \
    \       boolean x = 100 > 99, y = 99 > 100;\n        // Logical AND '&&' operator\n\
    \        System.out.println(\"What is the result of 100 > 99 && 99 > 100? \" +\
    \ (x && y));\n        // Bitwise AND '&' operator\n        System.out.println(\"\
    What is the result of 100 > 99 & 99 > 100? \" + (x & y));\n        // Logical\
    \ OR '||' operator\n        System.out.println(\"What is the result of 100 > 99\
    \ || 99 > 100? \" + (x || y));\n        // Bitwise OR '|' operator\n        System.out.println(\"\
    What is the result of 100 > 99 | 99 > 100? \" + (x | y));\n        // Logical\
    \ XOR '^' operator\n        System.out.println(\"What is the result of 100 > 99\
    \ ^ 99 > 100? \" + (x ^ y));\n        // Logical NOT '!' operator\n        System.out.println(\"\
    What is the result of Not 100 > 99? \" + (!x));\n        // Logical NOT '!' operator\
    \ (parenthesis is optional surrounding this operator and operand)\n        System.out.println(\"\
    What is the result of Not 99 > 100? \" + !y);\n    }\n}\n```\n\nFigure 3.6 – Logical\
    \ and Bitwise Operator Examples\n\nProgram Output:\n```\nWhat is the result of\
    \ 100 > 99 && 99 > 100? false\nWhat is the result of 100 > 99 & 99 > 100? false\n\
    What is the result of 100 > 99 || 99 > 100? true\nWhat is the result of 100 >\
    \ 99 | 99 > 100? true\nWhat is the result of 100 > 99 ^ 99 > 100? true\nWhat is\
    \ the result of Not 100 > 99? false\nWhat is the result of Not 99 > 100? True\n\
    ```\n\nIn this example, line five declares and initializes the variables. Both\
    \ variables `x` and `y` are assigned boolean expressions. Variable `x` is assigned\
    \ a true expression (`100 > 99`) while `y` is assigned a false expression (`99\
    \ > 100`). A `&&` (Logical AND) operator in line eight and `&` (Bitwise AND) operator\
    \ in line 11 compares the operands `x` and `y` then returns a `false` value. False\
    \ is returned because one operand `x` is true while the other operand `y` is false.\
    \ A similar process is performed for all examples in Figure 3.6 using Bitwise\
    \ and Logical Operators according to Figure 3.4 and Figure 3.5.\n\n## Short-Circuit\
    \ Behavior\n\nShort-circuit operators are `||` (Logical OR) and `&&` (Logical\
    \ AND) operators. Notice from Figure 3.6, `||` and `&&` return the same result\
    \ as bitwise OR and AND operators. However, the distinguishing characteristic\
    \ relies on evaluating the operands. If the first operand returns false then the\
    \ `&&` (Logical AND) operator will not evaluate the second. Yet, the bitwise AND\
    \ operator always evaluates both operands. Likewise, the `||` (Logical OR) operator\
    \ will not evaluate the second operand if the first operand returns true. Contrary\
    \ to the bitwise OR operator, the bitwise OR operator always evaluates both operands.\
    \ Note: The short-circuit operators do not evaluate the second operator because\
    \ it knows the result regardless of the second operand.\n\n# Relational Operators\n\
    \nRelational Operators return a `boolean` value after comparing operands. Normally,\
    \ all of the Relational Operators are applied to operands that are numbers. If\
    \ the relationship between two operands is Yes, then True is returned. For example,\
    \ if 34 is equal to 34, then True is returned. The following is a list of Relational\
    \ Operators:\n\n1. `==` (Equal To) operator\n2. `!=` (Not Equal To) operator\n\
    3. `>` (Greater Than) operator\n4. `>=` (Greater Than or Equal To) operator\n\
    5. `<` (Less Than) operator\n6. `<=` (Less Than or Equal To) operator\n\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `==` | Verifies if both operands are equal.\
    \ |\n| `!=` | Verifies if both operands are not equal. |\n| `>` | Verifies if\
    \ the left operand is greater than the right operand |\n| `>=` | Verifies if the\
    \ left operand is greater or equal to the right operand |\n| `<` | Verifies if\
    \ the left operand is less than the right operand |\n| `<=` | Verifies if the\
    \ left operand is less than or equal to the right operand |\n\nFigure 3.7 – Relational\
    \ Operators\n\nThe following are examples of each relational operator:\n\n```java\n\
    public class Operators\n{  \n    public static void main (String[] args)\n   \
    \ {\n        int x = 25, y = 50;\n        // == = Equal To operator\n        System.out.println(\"\
    Is 25 equal to 50? \" + (x == y));\n        // != = Not Equal To operator\n  \
    \      System.out.println(\"Is 25 not equal to 50? \" + (x != y));\n        //\
    \ > Greater Than operator\n        System.out.println(\"Is 25 greater than 50?\
    \ \" + (x > y));\n        // >= = Greater Than or Equal To operator\n        System.out.println(\"\
    Is 25 greater than or equal to 50? \" + (x >= y));\n        // < Less Than operator\n\
    \        System.out.println(\"Is 25 less than 50? \" + (x < y));\n        // <=\
    \ = Less Than or Equal To operator\n        System.out.println(\"Is 25 less than\
    \ or equal to 50? \" + (x <= y));  \n    }\n}\n```\n\nFigure 3.8 – Relational\
    \ Operator Examples\n\nProgram Output:\n```\nIs 25 equal to 50? false\nIs 25 not\
    \ equal to 50? true\nIs 25 greater than 50? false\nIs 25 greater than or equal\
    \ to 50? false\nIs 25 less than 50? true\nIs 25 less than or equal to 50? True\n\
    ```\n"
