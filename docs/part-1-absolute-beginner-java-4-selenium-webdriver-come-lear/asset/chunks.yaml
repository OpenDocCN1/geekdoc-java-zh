    \ \" + total);\n```\n"
- fmt: "\n![image](d2d_images/image048.png)Figure 3.14 – Operator Precedence Example\n\
    \nProgram Output:\n\n```\nWhat is the total without a parenthesis? 14\nWhat is\
    \ the total with a parenthesis? 20\n```\n\nTypically, a [Multiplication (*)](#c025.xhtml_Operator_Multiplication)\
    \ Operator is evaluated before an [Addition (+)](#c025.xhtml_Operator_Addition)\
    \ Operator. The variable `total` is assigned the same values in line seven and\
    \ line 10. However, the statement in line 7 do not contain parenthesis while line\
    \ 10 contain parenthesis. In line 7, the [Multiplication (*)](#c025.xhtml_Operator_Multiplication)\
    \ Operator is evaluated first for values `3 * 4` then value `2` is added via [Addition\
    \ (+)](#c025.xhtml_Operator_Addition) Operator. Therefore, the value `14` (`3\
    \ * 4 = 12` and `12 + 2 = 14`) is assigned to variable `total` in line 7. In line\
    \ 10, the parenthesis ranks higher than the [Multiplication (*)](#c025.xhtml_Operator_Multiplication)\
    \ Operator. As a result, values `2 + 3` is evaluated first within the parenthesis\
    \ then the [Multiplication (*)](#c025.xhtml_Operator_Multiplication) Operator\
    \ is evaluated. Hence, the value `20` (`2 + 3 = 5` and `5 * 4 = 20`) is assigned\
    \ to variable `total` in line 10. According to [The Java ^(TM) Tutorials](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html),\
    \ the following is an operator precedence list:\n\n| Operator | Precedence |\n\
    | :--- | :--- |\n| Postfix | `expr++ expr—` |\n| Unary | `++expr—expr +expr -expr\
    \ ~ !` |\n| multiplicative | `* / %` |\n| additive | `+ -` |\n| shift | `<< >>\
    \ >>>` |\n| relational | `< > <= >= instanceof` |\n| equality | `== !=` |\n| bitwise\
    \ AND | `&` |\n| bitwise exclusive OR | `^` |\n| bitwise inclusive OR | `|` |\n\
    | logical AND | `&&` |\n| logical OR | `||` |\n| ternary | `? :` |\n| assignment\
    \ | `= += -= *= /= %= &= ^= |= <<= >>= >>>=` |\n\nFigure 3.15 – Operator Precedence\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) | | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Data Type Casting\n\n\
    ![image](d2d_images/chapter_title_below.png)\n\nData type casting is when the\
    \ value of a [data type](#c017.xhtml_Data_Type) is converted into a different\
    \ [data type](#c017.xhtml_Data_Type). For instance, the value of one numeric data\
    \ type “[`float`](#c022.xhtml_float)” can be converted to another numeric data\
    \ type “[`double`](#c022.xhtml_double).” However, the value of a [`boolean`](#c022.xhtml_boolean)\
    \ data type can never be converted to a numeric type. There are two types of casts/conversions:\n\
    \n1. [Implicit Casting](#c032.xhtml__Implicit_Casting_1)\n2. [Explicit Casting](#c032.xhtml__Explicit_Casting_1)\n\
    \nNote: The primitive data type hierarchy from high to low is `double`](#c022.xhtml_double),\
    \ `float`](#c022.xhtml_float), `long`](#c022.xhtml_long), `int`](#c022.xhtml_int),\
    \ `short`](#c022.xhtml_short), then `byte`](#c022.xhtml_byte).\n\n## Implicit\
    \ Casting\n\nImplicit casting is when a conversion takes place without an instruction\
    \ to the [compiler](#c011.xhtml_A_compiler) to convert one [data type](#c017.xhtml_Data_Type)\
    \ into another [data type](#c017.xhtml_Data_Type). This type of casting only happens\
    \ for a widening conversion. Widening conversions occur automatically when the\
    \ value of a specific [data type](#c017.xhtml_Data_Type) is converted to a higher\
    \ [data type](#c017.xhtml_Data_Type). Therefore, based on the [primitive data\
    \ type hierarchy](#c032.xhtml_Primitive_Data_Type_Hierarchy), an `int`](#c022.xhtml_int)\
    \ can be converted to a `float`](#c022.xhtml_float), but an error arises when\
    \ trying to convert a `float`](#c022.xhtml_float) to an `int`](#c022.xhtml_int).\
    \ The following is an implicit casting example:\n\n```java\npublic class Operators\n\
    {\n    public static void main (String[] args)\n    {\n        int i;\n      \
    \  float f;\n        i = 78;\n        System.out.println(\"The value of int 'i'\
    \ is: \" + i);\n        f = i;\n        System.out.println(\"The value of float\
    \ 'f' is: \" + f);\n    }\n}\n```\n\n![image](d2d_images/image007.png)\n\nFigure\
    \ 3.16 - Assignment Type Conversion Example\n\nProgram Output:\n```\nThe value\
    \ of int 'i' is: 78\nThe value of float 'f' is: 78.0\n```\n\nThe value of int\
    \ 'i' is: 78\nThe value of float 'f' is: 78.0\n\nLine five declares `i` with an\
    \ `int` type while line six declares `f` as a `float` type. Line eight assigns\
    \ `78` to `f`. However, line eleven converts `78` to `float`. Note the value did\
    \ not lose data when converting `78`. The following two principles are necessary\
    \ for implicit casting:\n\n1. Both data types must be compatible\n2. Destination\
    \ data type must have a higher range than the source type\n\nThe following is\
    \ a list of [widening conversions](#c032.xhtml_Widening_Conversions) according\
    \ to the [primitive data type hierarchy](#c032.xhtml_Primitive_Data_Type_Hierarchy):\n\
    \n* `byte`](#c022.xhtml_byte) converts to `short`](#c022.xhtml_short), `int`](#c022.xhtml_int),\
    \ `long`](#c022.xhtml_long), `float`](#c022.xhtml_float), or `double`](#c022.xhtml_double)\n\
    * `short`](#c022.xhtml_short) converts to `int`](#c022.xhtml_int), `long`](#c022.xhtml_long),\
    \ `float`](#c022.xhtml_float), or `double`](#c022.xhtml_double)\n* `int`](#c022.xhtml_int)\
    \ converts to `long`](#c022.xhtml_long), `float`](#c022.xhtml_float), or `double`](#c022.xhtml_double)\n\
