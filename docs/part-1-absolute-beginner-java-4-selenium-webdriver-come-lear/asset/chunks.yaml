    \n程序输出：\nFriday is the 6th day of the week\n\n第五行给变量 `day` 赋值为 `6`。然后关键字 `switch`\
    \ 通过检查变量的值，在第七行开始分支。第 24 行的关键字 `case` 匹配了变量的值 `6`，然后执行第 25 行的语句。第 26 行的关键字 `break`\
    \ 是必要的，它能防止 `case 7`（第 27 行）和 `default`（第 30 行）的执行。\n\n注意：由于 switch 分支采用自上而下的方法顺序执行，匹配后的所有语句都会执行。因此，必须使用关键字\
    \ `break` 在找到匹配项后跳出 switch 分支。\n\n## 嵌套 switch 分支\n\n嵌套 switch 分支由另一个 switch 分支内部的\
    \ switch 分支组成。此外，`if` 分支也可以嵌套在 switch 分支内部。外部 switch 分支作为内部分支的容器。值对于各自的外部和内部分支是唯一的。例如，`constant`（常量）可以在多个\
    \ switch 分支中包含相同的值。以下是一个 switch 分支示例：\n\n```java\npublic class ControlStructures\n\
    {\n    public static void main (String[] args)\n    {\n        int day = 2, numHours\
    \ = 4;\n        switch (day)\n        {\n            case 1:\n               \
    \ System.out.println(\"Sunday is the 1st day of the week\");\n               \
    \ break;\n            case 2:\n                System.out.println(\"Monday is\
    \ the 2nd day of the week\");\n                switch (numHours)\n           \
    \     {\n                    case 4:\n                        System.out.println(\"\
    Plan to work 4 hours (half a day) due to an appointment\");\n                \
    \        break;\n                    case 8:\n                        System.out.println(\"\
    Plan to work 8 hours today\");\n                        break;\n             \
    \       default:\n                        System.out.println(\"Not sure how many\
    \ hours I will work today\");\n                        break; \n             \
    \   }    \n                break;\n            case 3:\n                System.out.println(\"\
    Tuesday is the 3rd day of the week\");\n                break;\n            case\
