    \ 分号完成初始化语句 |\n\n图 3.9 – 赋值运算符语法细节\n\n注意：赋值运算符可以生成赋值链链。赋值链是为多个变量初始化相同值的一种良好方法。此外，如果变量已存在值，则该值会被覆盖。以下是一个赋值运算符的示例：\n\
    \n```java\npublic class Operators\n{  \n  public static void main (String[] args)\n\
    \  {\n    int i, j, k;\n    i = j = k = 34;\n    System.out.println(\"The value\
    \ of i is: \" + i);\n    System.out.println(\"The value of j is: \" + j);\n  \
    \  System.out.println(\"The value of k is: \" + k);\n    j = 38;\n    System.out.println(\"\
    The value of j has been overwritten to: \" + j);\n  }\n}\n```\n\n![image](img/image029.png)图\
    \ 3.10 – 赋值运算符示例\n\n程序输出：\nThe value of i is: 34\nThe value of j is: 34\nThe value\
    \ of k is: 34\nThe value of j has been overwritten to: 38\n\n第五行使用 int 数据类型声明了每个变量\
    \ `i, j, k`。第七行利用链式赋值在一个语句中将每个变量初始化为相同的值 34。第十二行通过赋值值 38 覆盖了变量 `j`。\n\n## 复合赋值\n\
    \n复合赋值（也称为简写赋值）将算术结合在一起。以下运算符被排除在合并功能之外：递增、递减和取反码。这一过程缩短了赋值语句。例如，以下两个语句产生相同的输出：\n\
    \n```\ny = y + 3;\ny += 3;\n```\n\n这两个语句都为变量 `y` 赋值为 `y` 加三的值。以下是复合赋值的列表： \n\n\
    1. `+=`（加法赋值 |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n\
    ![image](img/chapter_title_above.png)\n\n# 三元运算符\n\n![image](img/chapter_title_below.png)\n\
    \n根据[dictionary.com](http://dictionary.com/reference)，三元意味着“由三部分组成”。因此，三元运算符（`?`）用于确定赋值给变量的值。以下是三元运算符的语法：\n\
    \n### 语法\n\n```\nvariableType variableName = expression1 ? expression2 : expression3;\n\
    ```\n\n### 语法细节\n\n| 参数 | 描述 |\n| :--- | :--- |\n| variableType | 变量的数据类型 |\n\
    | variableName | 接收值的变量名 |\n| expression1 | 布尔表达式 |\n| expression2 | 表达式为真时的值\
    \ |\n| : | 冒号分隔 expression2 和 expression3 |\n| expression3 | 表达式为假时的值 |\n\n图 3.12\
