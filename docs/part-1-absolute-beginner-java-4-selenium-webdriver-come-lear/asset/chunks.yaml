    ![image](d2d_images/chapter_title_above.png)


    # Arithmetic Operators


    ![image](d2d_images/chapter_title_below.png)


    Arithmetic operators implement mathematical operations on numerical values. Therefore,
    the arithmetic operators can be applied to any [data type](#c017.xhtml_Data_Type)
    involving numbers. The following is a list of arithmetic operators:


    1.  [+  (Addition)](#c025.xhtml_Operator_Addition) operator


    2.  [-  (Subtraction)](#c025.xhtml_Operator_Subtraction) operator


    3.  [*  (Multiplication)](#c025.xhtml_Operator_Multiplication) operator


    4.  [/  (Division)](#c025.xhtml_Operator_Division) operator


    5.  [%  (Modulus)](#c025.xhtml_Operator_Modulus) operator


    6.  [++  (Increment)](#c025.xhtml_Operator_Increment) operator


    7.  [—  (Decrement)](#c025.xhtml_Operator_Decrement) operator


    | Operator | Description |


    | +  | Adds a value on both sides of the (+) operatorUsed for joining strings
    which is known as string concatenation |


    | - ![image](d2d_images/scene_break.png) | Subtracts right operand from left operand
    |


    | *![image](d2d_images/scene_break.png) | Multiplies values on both sides of the
    (*) operand |


    | /  | Divides left operand by right operand |


    | %  | Divides left operand by right operand then returns the remainder |


    | ++ | Increases the operand’s value by one |


    | — ![image](d2d_images/scene_break.png) | Decreases the operand’s value by one
    |


    Figure 3.2 – Arithmetic Operators


    Note: The Division Operator (/) truncates the remainder while the Modulus Operator
    (%) returns the remainder. For instance, 10/3 only returns three and truncates
    the remainder, which is one. On the other hand, 10%3 only returns the remainder
    of one.


    ## Increment Arithmetic Operator


    The Increment Operator adds one to an [operand](#c024.xhtml_operand). This operator
    has a prefix and postfix form. The below syntaxes show both increment operator
    forms which is the same as the following expression:


    i = i + 1;


    Prefix Form Syntax


    ++i;


    Postfix Form Syntax


    i++;


    ## Decrement Arithmetic Operator


    The Decrement Operator subtracts one from an [operand](#c024.xhtml_operand). This
    operator has a prefix and postfix form. The below syntaxes show both decrement
    operator forms which is the same as the following expression:


    i = i - 1;


    Prefix Form Syntax


    —i;


    Postfix Form Syntax


    i—;


    The following are examples of each arithmetic operator:


    public class Operators


    {  


    public static void main(String[] args)


    {


    int result, x = 10, y = 3;


    result = x + y;  // Addition


    System.out.println("What is 10 plus 3? " + result);


    result = x - y;  // Subtraction


    System.out.println("What is 10 minus 3? " + result);


    result = x * y;  // Multiplication


    System.out.println("What is 10 times 3? " + result);


    result = x / y;  // Division


    System.out.println("What is 10 divided 3? " + result);


    result = x % y;  //  Modulus


    System.out.println("What is the remainder of 10 divided 3? " + result);


    result = ++x;  // Prefix Increment 


    System.out.println("What is the prefix increment value of 10? " + result);


    result = x++;  // Postfix Increment 


    System.out.println("What is the postfix increment value of 10? " + result);


    result =—y;  // Prefix Decrement 


    System.out.println("What is the prefix decrement value of 3? " + result);


    result = y—;  // Postfix Decrement 


    System.out.println("What is the postfix decrement value of 3? " + result);


    } 


    }


    ![image](d2d_images/image057.png)


    Figure 3.3 – Arithmetic Operator Examples


    Program Output:


    What is 10 plus 3? 13


    What is 10 minus 3? 7


    What is 10 times 3? 30


    What is 10 divided 3? 3


    What is the remainder of 10 divided 3? 1


    What is the prefix increment value of 10? 11


    What is the postfix increment value of 10? 11


    What is the prefix decrement value of 3? 2


    What is the postfix decrement value of 3? 2


    In this example, line five declares and initializes the variables. Variable “x”
    is assigned 10 while “y” is assigned three. An [+  (Addition)](#c025.xhtml_Operator_Addition)
    operator adds both variables in line seven. Variable “result” is assigned the
    sum of variables “x” and “y” which results in 13\. A similar process is performed
    for all examples in [Figure 3.3](#c025.xhtml_Figure_3_3) using a different Arithmetic
    Operator according to [Figure 3.2](#c025.xhtml_Figure_3_2).


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Bitwise Operators


    ![image](d2d_images/chapter_title_below.png)


    The Bitwise Operator work on operands utilizing bits. Therefore this operator
    have a foundation that functions on a bit-by-bit basis. Values are made available
    after the bits are set, shifted, and tested. Primarily, the Bitwise Operators
    are used on data types [byte](#c022.xhtml_byte), [char](#c022.xhtml_char), [int](#c022.xhtml_int),
    [long](#c022.xhtml_long), and [short](#c022.xhtml_short). The following is a list
    of bitwise operators and examples:


    1.  [&  (Bitwise AND)](#c026.xhtml_Operator_Bitwise_AND) operator


    2.  [|  (Bitwise OR)](#c026.xhtml_Operator_Bitwise_OR) operator


    3.  [^  (Bitwise exclusive OR (XOR))](#c026.xhtml_Operator_Bitwise_XOR) operator


    4.  [>>  (Signed shift right)](#c026.xhtml_Operator_Signed_shift_right) operator


    5.  [>>>  (Unsigned shift right)](#c026.xhtml_Operator_Unsigned_shift_right) operator


    6.  [<<  (Signed shift left)](#c026.xhtml_Operator_Signed_shift_left) operator


    7.  [~  (One’s Compliment)](#c026.xhtml_Operator_Ones_Compliment) operator


    | Operator | Description | Example |


    | & | Places 1 bit in the result if a bit exists in both operands. Can be used
    on a boolean data type | x & y; |


    | &#124; | Places 1 bit in the result if a bit exists in one of both operands.
    Can be used on a boolean data type | x &#124; y; |


    | ^ | Places 1 bit in the result if a bit exists in one of the operands (not both)
    | x ^ y: |


    | >> | Shifts the left operand’s value to the right by the number of bits specified
    by the right operand | x >> 2 |


    | >>> | Shifts the left operand’s value to the right by the number of bits specified
    by the right operand while shifted value are filled with zeros (0) | x >>> 2 |'
