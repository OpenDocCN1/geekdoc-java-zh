    ![image](d2d_images/chapter_title_above.png)


    # Assignment Operator


    ![image](d2d_images/chapter_title_below.png)


    An Assignment Operator (=) is positioned between a variable and value. The purpose
    is to assign values to variables. Therefore, the value on the right side is transferred
    into the variable name which is on the left side. The following is an assignment
    operator syntax:


    Syntax


    variableName = expression;


    Syntax Details


    | Argument | Description |


    | variableName | Name of variable that was declared |


    | expression | Value that is assigned to the variable name |


    | ; | Semi-colon completes the initialization statement |


    Figure 3.9 – Assignment Operator Syntax Details


    Note: The Assignment Operator can generate a chain of assignments. An assignment
    chain is a good way to initialize multiple variables the same value. In addition,
    a value is overwritten if the variable has an existing value. The following is
    an Assignment Operator example:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int i, j, k;


    i = j = k = 34;


    System.out.println("The value of i is: " + i);


    System.out.println("The value of j is: " + j);


    System.out.println("The value of k is: " + k);


    j = 38;


    System.out.println("The value of j has been overwritten to: " + j);


    }


    }


    ![image](d2d_images/image029.png)Figure 3.10 – Assignment Operator Example


    Program Output:


    The value of i is: 34


    The value of j is: 34


    The value of k is: 34


    The value of j has been overwritten to: 38


    Line five declares each variable “i, j, k” with an [int](#c022.xhtml_int) data
    type. Line seven utilizes a chain assignment then initialize each variable the
    same value 34 with one statement. Line 12 overwrite variable “j” by assigning
    a value of 38.


    ## Compound Assignments


    Compound Assignments (known as Shorthand Assignments) join [Arithmetic](#c025.xhtml__Arithmetic_Operators_1)
    and [Bitwise](#c026.xhtml__Bitwise_Operators_1) Operators with the [Assignment
    Operator](#c029.xhtml__Assignment_Operator_1). The following operators are excluded
    from the joining feature: [increment](#c025.xhtml_Operator_Increment), [decrement](#c025.xhtml_Operator_Decrement),
    and [one’s compliment](#c026.xhtml_Operator_Ones_Compliment). This process shortens
    the assignment statement. For example, the following two statements produce the
    same output:


    y = y + 3;


    y += 3;


    Both statements assign to variable “y” the value of “y” plus three. The following
    is a list of compound assignments: 


    1.  [+=  (Add and Assignment)](#c029.xhtml_Operator_Add_and_Assignment) operator


    2.  [-=  (Subtract and Assignment)](#c029.xhtml_Operator_Subtract_and_Assignment)
    operator


    3.  [*=  (Multiply and Assignment)](#c029.xhtml_Operator_Multiply_and_Assignment)
    operator


    4.  [/=  (Divide and Assignment)](#c029.xhtml_Operator_Divide_and_Assignment)
    operator 


    5.  [%=  (Modulus and Assignment)](#c029.xhtml_Operator_Modulus_and_Assignment)
    operator


    6.  [&=  (Bitwise And and Assignment)](#c029.xhtml_Operator_Bitwise_And_and_Assignment)
    operator


    7.  [|=  (Bitwise OR and Assignment)](#c029.xhtml_Operator_Bitwise_OR_and_Assignment)
    operator


    8.  [^=  (Bitwise exclusive OR (XOR) and Assignment)](#c029.xhtml_Operator_Bitwise_XOR_and_Assignment)
    operator 


    9.  [<<=  (Left shift and Assignment)](#c029.xhtml_Operator_Signed_shift_left_and_Assignmen)
    operator


    10.  [>>=  (Right shift and Assignment)](#c029.xhtml_Operator_Signed_shift_right_and_Assignme)
    operator


    11.  [>>>=  (Unsigned right shift and Assignment)](#c029.xhtml_Operator_Unsigned_shift_right_and_Assign)
    operator


    | Compound Assignment | Description |


    | += | Assigns the addition outcome |


    | -= | Assigns the subtraction outcome |


    | *= | Assigns the multiplication outcome |


    | /= | Assigns the division outcome |


    | %= | Assigns the division remainder outcome |


    | &= | Assigns the bitwise AND outcome |


    | &#124;= | Assigns the bitwise OR outcome |


    | ^= | Assigns the bitwise exclusive OR (XOR) outcome |


    | <<= | Assigns the signed left bit shift outcome |


    | >>= | Assigns the signed right bit shift outcome |


    | >>>= | Assigns the unsigned right bit shift outcome |


    Figure 3.11 – Compound Assignments


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Ternary Operator


    ![image](d2d_images/chapter_title_below.png)


    According to [dictionary.com](http://dictionary.reference.com/browse/ternary?s=t),
    ternary means, “consisting of or involving three.” Therefore, the Ternary Operator
    (?) requires three [operands](#c024.xhtml_operand). This operator is used to evaluate
    boolean expressions and determine which value is assigned to the variable. The
    following is the ternary operator syntax:


    Syntax


    variableType variableName = expression1 ? expression2 : expression3;


    Syntax Details


    | Argument | Description |


    | variableType | Data type of variable |


    | variableName | Name of variable that will receive a value |


    | expression1 | Boolean expression |


    | expression2 | Value if the boolean expression is true |


    | :![image](d2d_images/scene_break.png) | Colon separates the values of expression2
    and expression3 |


    | expression3 | Value if the boolean expression is false |


    | ; | Semi-colon completes the ternary operator statement |


    Figure 3.12 – Ternary Operator Syntax Details


    The following is a ternary operator example:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int x, y;


    x = 5;


    System.out.println("What is the value of x? " + x);


    y = (x == 5) ? 7 : 1;


    System.out.println("x equals 5 so the boolean expression is true: Value is " +
    y);


    y = (x == 3) ? 7 : 1;


    System.out.println("x does not equal 3 so the boolean expression is false: Value
    is " + y);


    }


    }


    ![image](d2d_images/image040.png)Figure 3.13 – Ternary Operator Example


    Program Output:


    What is the value of x? 5


    x equals 5 so the boolean expression is true: Value is 7


    x does not equal 3 so the boolean expression is false: Value is 1


    Line 10 displays expression1 as (x == 5) while line 13 displays expression1 as
    (x == 3). Both lines display expression2 as 7 and expression3 as 1\. If the boolean
    expressions are True then variable “y” is assigned 7, otherwise “y” is assigned
    1.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Operator Precedence


    ![image](d2d_images/chapter_title_below.png)


    The operator precedence is ranking Java’s operators from high to low. Rankings
    become important when a given expression has multiple operators. An [expression](#c033.xhtml__Expressions_2)
    is evaluated from left to right and the operator with a higher precedence receives
    the first evaluation. To change the precedence order, a parenthesis should be
    implemented to point out which expression is evaluated first. The following example
    shows two expressions which exclude and include a parenthesis:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int total;


    total = 2 + 3 * 4;


    System.out.println("What is the total without a parenthesis? " + total);


    total = (2 + 3) * 4;


    System.out.println("What is the total with a parenthesis? " + total);


    }


