    \n# Chapter 2\n\n![image](d2d_images/chapter_title_below.png)\n\nVariables and\
    \ Data Types\n\nA variable is a named container or memory location that holds\
    \ a value. The value of the container or memory location can change during execution\
    \ of the program. Each variable has the ability to contain any kind of information,\
    \ such as text or numbers. As a result, automation engineers are empowered to\
    \ create flexible programs. Variables are utilized to represent changeable data,\
    \ rather than hard-coding data (entering unchangeable data directly into a program).\n\
    \nAll variables possess a name, data type, and value. A variable name is used\
    \ to uniquely identify the variable. Data type refers to the type of variable,\
    \ such as [int](#c022.xhtml_int), [double](#c022.xhtml_double), or [boolean](#c022.xhtml_boolean)\
    \ that can be stored in a variable. Therefore, data type determines a variable’s\
    \ value. In Java, there are two kinds of data types: [primitive](#c022.xhtml__Primitive_Data_Types_1)\
    \ and reference. [Primitive data type](#c022.xhtml__Primitive_Data_Types_1) supports\
    \ [eight basic data types](#c022.xhtml_Eight_Primitive_Data_Types) (explained\
    \ in this chapter) and reference data type is based on a class (explained in Part\
    \ 2 – Java 4 Selenium WebDriver).\n\nChapter two covers the following regarding\
    \ variables and data types:\n\n✓  [Variable Names](#c018.xhtml__Variable_Names_2)\n\
    \n✓  [Variable Declaration](#c019.xhtml__Variable_Declaration_1)\n\n✓  [Variable\
    \ Initialization](#c020.xhtml__Variable_Initialization_1)\n\n✓  [Variable Type,\
    \ Scope, and Lifetime](#c021.xhtml__Variable_Type__Scope__1)\n\n✓  [Primitive\
    \ Data Types](#c022.xhtml__Primitive_Data_Types_1)\n\n✓  [Constants](#c023.xhtml__Constants_1)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Variable Names\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nThe name of a variable is significant when identifying the variable in memory. \
    \ Hence, variables are referred to as identifiers. In addition to variables, an\
    \ identifier represents [methods](#c015.xhtml_A_method) along with other user-defined\
    \ items. All variable names can range anywhere from one character to an unlimited\
    \ number of characters. The following is a variable name example:\n\npublic class\
    \ VariableExample\n\n{  \n\npublic static void main(String[] args)\n\n{\n\nint\
    \ custOrder;\n\ncustOrder = 123;\n\nSystem.out.println(\"The customer's order\
    \ number is \" + custOrder);\n\n} \n\n}\n\n![image](d2d_images/image038.png)\n\
    \nFigure 2.1 – Variable Name Example\n\nProgram Output:\n\nThe customer's order\
    \ number is 123\n\n## Variable Naming Rules\n\nJava has rules to naming variables.\
    \ One of the rules is to ensure each variable has a unique name. Unique names\
    \ prevent errors from occurring, such as “Duplicate local variable”— meaning the\
    \ same variable name has been entered more than one time. The following is a list\
    \ of more rules for naming a variable:\n\n*   Can contain case sensitive letters,\
    \ numbers, dollar sign “$,” and underscore “_”\n\n*   Can begin with a letter,\
    \ dollar sign “$,” or underscore “_”\n\n*   Cannot begin with a number\n\n*  \
    \ Cannot contain a space or special character except dollar sign “$,” and underscore\
    \ “_”\n\n*   Cannot contain a reserve keyword\n\nThe following is a list of 50\
    \ Java reserve keywords:\n\n| abstract | continue | for | new | switch |\n\n|\
    \ assert | default | goto | package | synchronized |\n\n| boolean | do | if |\
    \ private | this |\n\n| break | double | implements | protected | throw |\n\n\
    | byte | else | import | public | throws |"
