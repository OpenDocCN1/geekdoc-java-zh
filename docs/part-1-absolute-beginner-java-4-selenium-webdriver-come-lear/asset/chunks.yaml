    \ while |\n\n图 2.2 - 保留关键字\n\n## 变量命名规范\n\n规范（Convention）是在建立标准时的一种通用的共识或做法。在与自动化工程师团队合作时，为变量命名制定合适的规范是非常关重要的。所有标识符名称（例如变量、方法等）对于代码的阅读、理解和维护至关重要。以下是建议的变量命名规范列表：\n\
    \n- 构建具有描述性的名称来描述变量的用途\n- 除非名称是单个单词，否则使用混合大小写字母（驼峰法）组合名称\n- 如果是单个单词，则使用全小写字母\n\
    - 如果是多个单词，第一个单词首字母小写，每个后续单词的首字母大写（例如，`custFirstName`）\n- 创建以字母开头的名字，而不是美元符号 `$`\
    \ 或下划线 `_`\n- 选择以单个小写字母开头的循环控制变量（例如，`i`，`x`, `y`）\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 变量声明\n\n![image](img/chapter_title_below.png)\n\n声明变量是明确表示一个变量的存在。在声明变量时，所有变量都与一个数据类型相关。数据类型确保正确的数据被分配给变量。此外，变量的大小由数据类型决定。在程序中使用变量之前必须对其进行声明。以下是声明变量的语法：\n\
    \n### 语法\n```\nvariableType variableName;\n```\n\n### 语法细节\n\n| 参数 | 描述 |\n| :---\
    \ | :--- |\n| `variableType` | 被声明变量的数据类型 |\n| `variableName` | 被声明变量的名称 |\n|\
    \ `;` | 分号，用于完成声明语句 |\n\n图 2.3 – 变量声明语法细节\n\n以下是一个变量声明的示例：\n\n```java\npublic\
    \ class VariableExample\n{  \n  public static void main(String[] args)\n  {\n\
    \    int x;\n    int y;\n    x = 5;\n    y = 7;\n    System.out.println(\"The\
    \ values of x and y are \" + x + \" and \" + y);\n  } \n}\n```\n\n![image](img/image055.png)\n\
    \n图 2.4 – 变量声明\n\n程序输出：\nThe values of x and y are: 5 and 7\n\n第五行和第六行声明了 `int`\
    \ 类型的变量 `x` 和 `y`。注意每个声明都以分号结束。分号完成了声明语句。\n\n注意：如果变量具有相同的数据类型，可以在同一行声明多个变量。以下是使用逗号分隔的多个变量的声明示例：\n\
    \n```\nint x, y;\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 变量初始化\n\n![image](img/chapter_title_below.png)\n\n通常情况下，变量在使用之前会赋予其一个初始值。赋值运算符分隔等式的两边。每个方程式都有左侧和右侧。左侧显示变量名，右侧显示值。变量可以通过以下方式初始化：\n\
    \n1. 通过值初始化\n2. 通过动态初始化\n\n## 通过值初始化\n\n通过值初始化变量需要为变量设置一个值。以下是通过值初始化变量的两种方式：\n\
    \n1. 声明时\n2. 声明后\n\n### 声明时\n\n声明时是将数据类型、变量名和值放在同一行。也就是说，同时声明并初始化变量可以使用逗号分隔的列表在声明时初始化多个变量。以下是“声明时”通过值初始化的示例：\n\
    \n```java\npublic class VariableExample\n{  \n  public static void main(String[]\
    \ args)\n  {\n    int num1 = 100, num2 = 200, total;\n    total = num1 + num2;\n\
    \    System.out.println(\"The total of num1 and num2 is \" + total);  \n  } \n\
    }\n```\n\n![image](img/image18.png)\n\n图 2.5 – 声明时变量初始化\n\n程序输出：\nThe total of\
    \ num1 and num2 is 300\n\n第五行声明了 `int` 类型的变量 `num1`、`num2` 和 `total`。注意每个声明都以分号结束。分号完成了声明语句。因此，变量在声明时进行了初始化。\n\
    \n### 声明后\n\n声明后是将数据类型、变量名和值放在同一行（注：此处原文描述可能可能有误，通常指在声明之后的行进行赋值）。也就是说，同时声明并初始化变量。可以使用逗号分隔的列表在声明时初始化多个变量。以下是“声明时”通过值初始化的示例：\n\
    \n```java\npublic class VariableExample\n{  \n  public static void main(String[]\
    \ args)\n  {\n    int x, y;\n    x = 5;\n    y = 7;\n    System.out.println(\"\
    The values of x and y are \" + x + \" and \" + y);\n  } \n}\n```\n\n![image](img/image051.png)\n\
    \n图 2.6 – 声明后变量初始化\n\n程序输出：\nThe values of x and y are: 5 and 7\n\n第五行和第六行声明了\
    \ `int` 类型的变量 `x` 和 `y`。注意每个声明都以分号结束。分号完成了声明语句。因此，变量在声明后进行了初始化。\n\n## 通过动态初始化\n\
    \n通过动态初始化变量不是为变量分配特定的值。相反，将会变化的值分配给变量。偶尔，变化的值来自被测试应用程序（AUT）或其他变量。以下是变量动态初始化示例：\n\
    \n```java\npublic class VariableExample\n{  \n  public static void main(String[]\
    \ args)\n  {\n    int num1, num2;\n    num1 = 100;\n    num2 = 200; \n    int\
    \ total = num1 + num2;\n    System.out.println(\"The total of num1 and num2 is\
    \ \" + total);\n  } \n}\n```\n\n![image](img/image020.png)\n\n图 2.7 – 通过动态初始化\n\
    \n程序输出：\nThe total of num1 and num2 is 300\n\n第十行声明并初始化了 `int` 类型的变量 `total`。该变量没有被赋予特定的值。然而，它被分配了可能会变化的信息\
    \ `num1` 和 `num2`。例如，自动化工程师可以在执行期间输入语句来增加变量 `num1` 和 `num2` 的值。如果变量 `num1` 和 `num2`\
    \ 发生变化，那么变量 `total` 随之动态变化。\n\n注意：通过动态初始化变量时需要数据类型 `int`。\n\n"
- fmt: "\nJava allows a variable to be declared anywhere in a program. For that reason,\
    \ a variable can be defined within a class, within a method, or within a method\
    \ as a parameter. A variable’s scope is related to where the variable is declared\
    \ inside the program. Lifetime is how long the variable exists in the program.\
    \ The following are four types of variables that have their own scope and lifetime:\n\
    \n1. [Local Variables]\n2. [Parameter Variables]\n3. [Instance Variables]\n4.\
    \ [Class Variables]\n\n## Local Variables\n\nLocal variables are declared inside\
    \ a `method`. Individual `methods` can have the same `variable name` as another\
    \ method within a program. Local variables are only visible inside its individual\
    \ `method`. Therefore, each variable is unique to a specific `method`. Before\
    \ using a local variable, it must be declared and initialized a value without\
    \ needing a special keyword. Hence, there are no default values for local variables.\
    \ Local variables are created when the `method` is constructed and destroyed when\
    \ the `method` is terminated. The following is a local variable example:\n\n```java\n\
    public class VariableExample {\n    public void AutomationEngineers () {\n   \
    \     int yearsEmployed;\n        yearsEmployed = 5;\n        System.out.println(\"\
    Joe Doe 'Automation' has been at the organization \" + yearsEmployed + \" years\"\
    );\n    }\n\n    public void Developers () {\n        int yearsEmployed;\n   \
    \     yearsEmployed = 3;\n        System.out.println(\"Jane Doe 'Dev' has been\
    \ at the organization \" + yearsEmployed + \" years\");\n    }\n\n    public static\
    \ void main(String[] args) {\n        VariableExample years = new VariableExample\
    \ ();\n        years.AutomationEngineers();\n        years.Developers();\n   \
    \ }\n}\n```\n\n![image](d2d_images/image060.png)\nFigure 2.8 – Local Variable\n\
    \nProgram Output:\nJoe Doe 'Automation' has been at the organization 5 years\n\
    Jane Doe 'Dev' has been at the organization 3 years\n\nLines five and thirteen\
    \ display a variable `yearsEmployed` that is local to methods `AutomationEngineers`\
    \ and `Developers`. An error will not occur because each variable is unique to\
    \ its `method`. However, the same `variable name` cannot be declared multiple\
    \ times within the same `method`. The scope and lifetime of a local variable is\
    \ limited to the block/curly braces in which it is declared.\n\n## Parameter Variables\n\
    \nParameter variables are declared and passed into `methods`. After a parameter\
    \ variable is declared, it is implemented like a `local variable`. Therefore,\
    \ a `local variable` and parameter variable cannot have the same name. Keywords\
    \ are not required for a parameter variable. However, the `data type` and `variable\
    \ name` must be surrounded by a parenthesis after the `method` name. The following\
    \ is a parameter variable example:\n\n```java\npublic class VariableExample {\n\
    \    public void setMtgAmount (double mtgAmount) {\n        System.out.println(\"\
    The mortgage payment amount is \" + mtgAmount);\n    }\n\n    public static void\
    \ main(String[] args) {\n        VariableExample payment = new VariableExample\
    \ ();\n        payment.setMtgAmount(99000);\n    }\n}\n```\n\n![image](d2d_images/image028.png)\n\
    Figure 2.9 – Parameter Variables\n\nProgram Output:\nThe mortgage payment amount\
    \ is 99000.0\n\nLines three and eight pass parameter variables `double mtgAmount`\
    \ and `String[] args` into `methods` `setMtgAmount` and `main`. The value `99000`\
    \ is passed from the method call `payment.setMtgAmount` line 11 into the `method`\
    \ `setMtgAmount` line three that is called. The scope of a parameter variable\
    \ is a method’s header inside the parenthesis while the lifetime is a method’s\
    \ body within the curly brackets.\n\n## Instance Variables\n\nInstance variables\
    \ are declared inside a `class`, outside of a `method`, and can be optionally\
    \ accessed after creating an `object`. The values of an instance variable are\
    \ unique to each `object`. Instance variable can be declared before or after it\
    \ is initialized with visibility to all `methods` in a `class`. Default values\
    \ for a number is zero, for `boolean` the default is false. The following is instance\
    \ variable example:\n\n```java\npublic class VariableExample {\n    int yearsExist\
    \ = 34;\n\n    public static void main(String[] args) {\n        VariableExample\
    \ years = new VariableExample();\n        System.out.println(\"This organization\
    \ has existed for \" + years.yearsExist + \" years\");\n    }\n}\n```\n\n![image](d2d_images/image032.png)\n\
    Figure 2.10 – Instance Variable\n\nProgram Output:\nThis organization has existed\
    \ for 34 years\n\nLine three declares the instance variable `yearsExist` within\
    \ the `class`, outside of the `method` `main`. Line eight prints the variable\
    \ `years.yearsExist`.\n\n## Class Variables\n\nClass Variables (known as Static\
    \ Variables) are declared in a `class`, but not in a `method`. The keyword `static`\
    \ announces to the `compiler` that only one copy of a particular variable exists,\
    \ but is shared by all instances of `object`. Default values for a number is zero,\
    \ the default for `boolean` is false. Class Variables are created when the program\
    \ begins and destroyed when the program ends. The following is a class variable\
    \ example:\n\n```java\npublic class VariableExample {\n    static int numDays\
    \ = 30;\n\n    public static void main(String[] args) {\n        VariableExample\
    \ days = new VariableExample ();\n        System.out.println(\"Java can be mastered\
    \ in \" + VariableExample.numDays + \" days\");\n        System.out.println(\"\
    Selenium can be mastered in \" + days.numDays + \" days\");\n        System.out.println(\"\
    Do you think you can master Java/Selenium in \" + numDays + \" days\");\n    }\n\
    }\n```\n\n![image](d2d_images/image062.png)\nFigure 2.11 – Class Variable\n\n\
    Program Output:\nJava can be mastered in 30 days\nSelenium can be mastered in\
    \ 30 days\nDo you think you can master Java/Selenium in 30 days\n\nLine three\
    \ declares the Class Variable `numDays` within the `class` using the keyword `static`.\
    \ Lines eight, nine, and ten access the class variable by using the `ClassName.ClassVariable`\
    \ `VariableExample.numDays`, `ObjectReference.ClassVariable` `days.numDays`, and\
    \ `ClassVariableName` `numDays`.\n"
