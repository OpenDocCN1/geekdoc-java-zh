    # Logical Operators


    ![image](d2d_images/chapter_title_below.png)


    Logical Operators (known as Conditional Operators) return a [boolean](#c022.xhtml_boolean)
    value based on one or more [expressions](#c033.xhtml__Expressions_2). Therefore,
    the Logical Operator’s data type must be [boolean](#c022.xhtml_boolean). The following
    is a list of logical operators:


    *   [&&  (Logical AND)](#c027.xhtml_Operator_Logical_AND) operator


    *   [|| (Logical OR)](#c027.xhtml_Operator_Logical_OR) operator


    *   [^  (Logical exclusive OR (XOR))](#c027.xhtml_Operator_Logical_XOR) operator


    *   [!  (Logical NOT)](#c027.xhtml_Operator_Logical_NOT) operator


    | Operator | Description |


    | && | Returns true if both operands are trueReturns false if one operand or both
    operands are false |


    | &#124;&#124; | Returns true if one operand or both operands are trueReturns
    false if both operands are false |


    | ^ | Returns true if only one operand is trueReturns false if both operands are
    false and if both operands are true |


    | ! | Returns the opposite value of the operandReturns true if the operand is
    false and return false if the operand is true |


    Figure 3.5 – Logical Operators


    Note: The Bitwise Operators and Logical Operators perform some of the same functions.
    The following are examples of each logical operator and two [bitwise](#c011.xhtml__Bitwise_Operators)
    operators:


    public class Operators


    {  


    public static void main (String[] args)


    {


    boolean x = 100 > 99, y = 99 > 100;


    // Logical AND ''&&'' operator


    System.out.println("What is the result of 100 > 99 && 99 > 100? " + (x && y));


    // Bitwise AND ''&'' operator


    System.out.println("What is the result of 100 > 99 & 99 > 100? " + (x & y));


    // Logical OR ''||'' operator


    System.out.println("What is the result of 100 > 99 || 99 > 100? " + (x || y));


    // Bitwise OR ''|'' operator


    System.out.println("What is the result of 100 > 99 | 99 > 100? " + (x | y));


    // Logical XOR ''^'' operator


    System.out.println("What is the result of 100 > 99 ^ 99 > 100? " + (x ^ y));


    // Logical NOT ''!'' operator


    System.out.println("What is the result of Not 100 > 99? " + (!x));


    // Logical NOT ''!'' operator (parenthesis is optional surrounding this operator
    and operand)


    System.out.println("What is the result of Not 99 > 100? " + !y);


    }


    }


    ![image](d2d_images/image023.png)


    Figure 3.6 – Logical and Bitwise Operator Examples


    Program Output:


    What is the result of 100 > 99 && 99 > 100? false


    What is the result of 100 > 99 & 99 > 100? false


    What is the result of 100 > 99 || 99 > 100? true


    What is the result of 100 > 99 | 99 > 100? true


    What is the result of 100 > 99 ^ 99 > 100? true


    What is the result of Not 100 > 99? false


    What is the result of Not 99 > 100? True


    In this example, line five declares and initializes the variables. Both variables
    “x and y” are assigned boolean expressions. Variable “x” is assigned a true expression
    (100 > 99) while “y” is assigned a false expression (99 > 100). A [&&  (Logical
    AND)](#c027.xhtml_Operator_Logical_AND) operator in line eight and [&  (Bitwise
    AND)](#c026.xhtml_Operator_Bitwise_AND) operator in line 11 compares the [operands](#c024.xhtml_operand)
    “x and y” then returns a “false” value. False is returned because one [operand](#c024.xhtml_operand)
    “x” is true while the other [operand](#c024.xhtml_operand) “y” is false. A similar
    process is performed for all examples in [Figure 3.6](#c027.xhtml_Figure_3_6)
    using different Bitwise and Logical Operators according to [Figure 3.4](#c026.xhtml_Figure_3_4)
    and [Figure 3.5](#c027.xhtml_Figure_3_5).


    ## Short-Circuit Behavior Operators


    Short-circuit behavior operators are [|| (Logical OR)](#c027.xhtml_Operator_Logical_OR)
    and [&&  (Logical AND)](#c027.xhtml_Operator_Logical_AND) operators. Notice from
    [Figure 3.6](#c027.xhtml_Figure_3_6), [|| (Logical OR)](#c027.xhtml_Operator_Logical_OR)
    and [&&  (Logical AND)](#c027.xhtml_Operator_Logical_AND) operators return the
    same result as [|  (Bitwise OR)](#c026.xhtml_Operator_Bitwise_OR) and [&  (Bitwise
    AND)](#c026.xhtml_Operator_Bitwise_AND) operators. However, the distinguishing
    characteristic relies on evaluating the [operands](#c024.xhtml_operand).


    If the first operand returns false then the [&&  (Logical AND)](#c027.xhtml_Operator_Logical_AND)
    Operator will not evaluate the second operator. Yet, the [&  (Bitwise AND)](#c026.xhtml_Operator_Bitwise_AND)
    Operator always evaluate both operands. Likewise, the [|| (Logical OR)](#c027.xhtml_Operator_Logical_OR)
    Operator will not evaluate the second operand if the first operand returns true.
    Contrary to the [|| (Logical OR)](#c027.xhtml_Operator_Logical_OR) Operator, the
    [|  (Bitwise OR)](#c026.xhtml_Operator_Bitwise_OR) Operator will always evaluate
    both operands. 


    Note: The short-circuit behavior operators do not evaluate the second operator
    because it knows the result regardless of the second operand.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Relational Operators


    ![image](d2d_images/chapter_title_below.png)


    Relational Operators return a [boolean](#c022.xhtml_boolean) value after comparing
    [operands](#c024.xhtml_operand). Normally, all of the Relational Operators are
    applied to [operands](#c024.xhtml_operand) that are numbers. If the relationship
    between two [operands](#c024.xhtml_operand) is Yes, then True is returned. For
    example, if 34 is equal to 34, then True is returned. The following is a list
    of Relational Operators:


    1.  [==  (Equal To)](#c028.xhtml_Operator_Equal_To) operator


    2.  [!=  (Not Equal To)](#c028.xhtml_Operator_Not_Equal_To) operator


    3.  [>  (Greater Than)](#c028.xhtml_Operator_Greater_Than) operator


    4.  [>=  (Greater Than or Equal To)](#c028.xhtml_Operator_Greater_Than_Or_Equal_To)
    operator


    5.  [<  (Less Than)](#c028.xhtml_Operator_Less_Than) operator 


    6.  [<=  (Less Than or Equal To)](#c028.xhtml_Operator_Less_Than_Or_Equal_To)
    operator


    | Operator | Description |


    | == | Verifies if both operands are equal. |


    | != | Verifies if both operands are not equal. |


    | > | Verifies if the left operand is greater than the right operand |


    | >= | Verifies if the left operand is greater than or equal to the right operand
    |


    | < | Verifies if the left operand is less than the right operand |


    | <= | Verifies if the left operand is less than or equal to the right operand
    |


    Figure 3.7 – Relational Operators


    The following are examples of each relational operator:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int x = 25, y = 50;


    // = = Equal To operator


    System.out.println("Is 25 equal to 50? " + (x == y));


    // ! = Not Equal To operator


    System.out.println("Is 25 not equal to 50? " + (x != y));


    // > Greater Than operator


    System.out.println("Is 25 greater than 50? " + (x > y));


    // > = Greater Than or Equal To operator


    System.out.println("Is 25 greater than or equal to 50? " + (x >= y));


    // <  Less Than operator


    System.out.println("Is 25 less than 50? " + (x < y));


    // < =  Less Than or Equal To operator


    System.out.println("Is 25 less than or equal to 50? " + (x <= y));  


    }


    }


    ![image](d2d_images/image004.png)Figure 3.8 – Relational Operator Examples


    Program Output:


    Is 25 equal to 50? false


    Is 25 not equal to 50? true


    Is 25 greater than 50? false


    Is 25 greater than or equal to 50? false


    Is 25 less than 50? true


    Is 25 less than or equal to 50? True'
