  trans: "\n\n| << | 将左操作数的值向左移动，移动数为右操作数指定的位数 | `x << 2` |\n| ~![image](img/scene_break.png)\
    \ | 将每个位反转为相反的位。例如，每个 1 位变为 0，每个 0 位变为 1 | `~2` |\n\n图 3.4 – 位运算符\n\n# 逻辑运算符\n\
    \n逻辑运算符（也称为条件运算符）根据一个或多个表达式（`expressions`）返回 `boolean` 值。因此，逻辑运算符的数据类型必须是 `boolean`。以下是逻辑运算符列表：\n\
    \n* `&&` (逻辑与) 运算符\n* `||` (逻辑或) 运算符\n* `^` (逻辑异或 (XOR)) 运算符\n* `!` (逻辑非) 运算符\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| `&&` | 如果两个操作数都为 true，则返回 true。如果一个或两个操作数为\
    \ false，则返回 false |\n| `||` | 如果一个或两个操作数为 true，则返回 true。如果两个操作数都为 false，则返回 false\
    \ |\n| `^` | 如果仅有一个操作数为 true，则返回 true。如果两个操作数都为 false 或都为 true，则返回 false |\n|\
    \ `!` | 返回操作数的相反值。如果操作数为 false，则返回 true；如果操作数为 true，则返回 false |\n\n图 3.5 – 逻辑运算符\n\
    \n注意：位运算符和逻辑运算符执行了某些相同的功能。以下是每个逻辑运算符以及两个位运算符的示例：\n\n```java\npublic class Operators\n\
    {  \n    public static void main (String[] args)\n    {\n        boolean x = 100\
    \ > 99, y = 99 > 100;\n        // 逻辑与 '&&' 运算符\n        System.out.println(\"\
    What is the result of 100 > 99 && 99 > 100? \" + (x && y));\n        // 位与 '&'\
    \ 运算符\n        System.out.println(\"What is the result of 100 > 99 & 99 > 100?\
    \ \" + (x & y));\n        // 逻辑或 '||' 运算符\n        System.out.println(\"What is\
    \ the result of 100 > 99 || 99 > 100? \" + (x || y));\n        // 位或 '|' 运算符\n\
    \        System.out.println(\"What is the result of 100 > 99 | 99 > 100? \" +\
    \ (x | y));\n        // 逻辑异或 '^' 运算符\n        System.out.println(\"What is the\
    \ result of 100 > 99 ^ 99 > 100? \" + (x ^ y));\n        // 逻辑非 '!' 运算符\n    \
    \    System.out.println(\"What is the result of Not 100 > 99? \" + (!x));\n  \
    \      // 逻辑非 '!' 运算符（运算符和操作数周围括号是可选的）\n        System.out.println(\"What is the\
    \ result of Not 99 > 100? \" + !y);\n    }\n}\n```\n\n图 3.6 – 逻辑与位运算符示例\n\n程序输出：\n\
    ```\nWhat is the result of 100 > 99 && 99 > 100? false\nWhat is the result of\
    \ 100 > 99 & 99 > 100? false\nWhat is the result of 100 > 99 || 99 > 100? true\n\
    What is the result of 100 > 99 | 99 > 100? true\nWhat is the result of 100 > 99\
    \ ^ 99 > 100? true\nWhat is the result of Not 100 > 99? false\nWhat is the result\
    \ of Not 99 > 100? True\n```\n\n在此示例中，第五行声明并初始化了变量。变量 `x` 和 `y` 都被赋值了布尔表达式。变量\
    \ `x` 被赋值了一个为 true 的表达式（`100 > 99`），而 `y` 被赋值了一个为 false 的表达式（`99 > 100`）。第八行的\
    \ `&&`（逻辑与）运算符和第 11 行的 `&`（位与）运算符比较了操作数 `x` 和 `y`，然后返回一个 `false` 值。返回 false 是因为一个操作数\
    \ `x` 为 true 而另一个操作数 `y` 为 false。根据图 3.4 和图 3.5，图 3.6 中所有使用位运算符和逻辑运算符的示例都执行了相似的过程。\n\
    \n## 短路行为\n\n短路运算符是 `||`（逻辑或）和 `&&`（逻辑）。从图 3.6 可以看出，`||` 和 `&&` 返回的结果与位或和位与运算符相同。然而，区别特征在于对操作数的求值。如果第一个操作数返回\
    \ false，则 `&&`（逻辑与）运算符将不会求值第二个。而位与运算符总是求值两个操作数。同样，`||`（逻辑或）运算符如果第一个操作数返回 true，则不会求值第二个操作数。与位或运算符相反，位运算符总是求值两个操作数。注意：短路运算符不求值第二个运算符，因为无论第二个操作数是什么，它都知道结果。\n\
    \n# 关系运算符\n\n关系运算符在比较操作数后返回一个 `boolean` 值。通常情况下，所有关系运算符都应用于数字操作数。如果数字之间的关系成立，则返回\
    \ true。例如，如果 34 等于 34，则返回 true。以下是关系运算符：\n\n1. `==` (等于) 运算符\n2. `!=` (不等于) 运算符\n\
    3. `>` (大于) 运算符\n4. `>=` (大于等于) 运算符\n5. `<` (小于) 运算符\n6. `<=` (小于等于) 运算符\n\n|\
    \ 运算符 | 描述 |\n| :--- | :--- |\n| `==` | 验证两个操作数是否相等 |\n| `!=` | 验证两个操作数是否不等 |\n\
    | `>` | 验证左操作数是否大于右操作数 |\n| `>=` | 验证左操作数是否大于等于右操作数 |\n| `<` | 验证左操作数是否小于右操作数\
    \ |\n| `<=` | 验证左操作数是否小于等于右操作数 |\n\n图 3.7 – 关系运算符\n\n以下是每个关系运算符的示例：\n\n```java\n\
    public class Operators\n{  \n    public static void main (String[] args)\n   \
    \ {\n        int x = 25, y = 50;\n        // == 等于 运算符\n        System.out.println(\"\
    Is 25 equal to 50? \" + (x == y));\n        // != 不等于 运算符\n        System.out.println(\"\
    Is 25 not equal to 50? \" + (x != y));\n        // > 大于 运算符\n        System.out.println(\"\
    Is 25 greater than 50? \" + (x > y));\n        // >= 大于等于 运算符\n        System.out.println(\"\
    Is 25 greater than or equal to 50? \" + (x >= y));\n        // < 小于 运算符\n    \
    \    System.out.println(\"Is 25 less than 50? \" + (x < y));\n        // <= 小于等于\
    \ 运算符\n        System.out.println(\"Is 25 less than or equal to 50? \" + (x <=\
    \ y));  \n    }\n}\n```\n\n图 3.8 – 关系运算符示例\n\n程序输出：\n```\nIs 25 equal to 50? false\n\
    Is 25 not equal to 50? true\nIs 25 greater than 50? false\nIs 25 greater than\
    \ or equal to 50? false\nIs 25 less than 50? true\nIs 25 less than or equal to\
    \ 50? True\n```\n\n"
- fmt: "\nIn this example, line five declares and initializes the variables. Variable\
    \ `x` is assigned 25 while `y` is assigned 50. An `==` (Equal To](#c028.xhtml_Operator_Equal_To)\
    \ operator determines if both variables `(x == y)` equals each other on line eight.\
    \ The values 25 and 50 are not equal so `false` is returned. A similar process\
    \ is performed for all examples in [Figure 3.8](#c028.xhtml_Figure_3_8) using\
    \ a different Relational Operator according to [Figure 3.7](#c028.xhtml_Figure_3_7).\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Assignment Operator\n\
    \n![image](d2d_images/chapter_title_below.png)\n\nAn Assignment Operator (`=`)\
    \ is positioned between a variable and value. The purpose is to assign values\
    \ to variables. Therefore, the value on the right side is transferred into the\
    \ variable name which is on the left side. The following is an assignment operator\
    \ syntax:\n\n### Syntax\n\n```\nvariableName = expression;\n```\n\n### Syntax\
    \ Details\n\n| Argument | Description |\n| :--- | :--- |\n| variableName | Name\
    \ of variable that was declared |\n| expression | Value that is assigned to the\
    \ variable name |\n| ; | Semi-colon completes the initialization statement |\n\
    \nFigure 3.9 – Assignment Operator Syntax Details\n\nNote: The Assignment Operator\
    \ can generate a chain of assignments. An assignment chain is a good way to initialize\
    \ multiple variables the same value. In addition, a value is overwritten if the\
    \ variable has an existing value. The following is an Assignment Operator example:\n\
    \n```java\npublic class Operators\n{  \n  public static void main (String[] args)\n\
    \  {\n    int i, j, k;\n    i = j = k = 34;\n    System.out.println(\"The value\
    \ of i is: \" + i);\n    System.out.println(\"The value of j is: \" + j);\n  \
    \  System.out.println(\"The value of k is: \" + k);\n    j = 38;\n    System.out.println(\"\
    The value of j has been overwritten to: \" + j);\n  }\n}\n```\n\n![image](d2d_images/image029.png)Figure\
    \ 3.10 – Assignment Operator Example\n\nProgram Output:\nThe value of i is: 34\n\
    The value of j is: 34\nThe value of k is: 34\nThe value of j has been overwritten\
    \ to: 38\n\nLine five declares each variable `i, j, k` with an [int](#c022.xhtml_int)\
    \ data type. Line seven utilizes a chain assignment then initialize each variable\
    \ the same value 34 with one statement. Line 12 overwrite variable `j` by assigning\
    \ a value of 38.\n\n## Compound Assignments\n\nCompound Assignments (known as\
    \ Shorthand Assignments) join [Arithmetic](#c025.xhtml__Arithmetic_Operators_1)\
    \ and [Bitwise](#c026.xhtml__Bitwise_Operators_1) Operators with the [Assignment\
    \ Operator](#c029.xhtml__Assignment_Operator_1). The following operators are excluded\
    \ from the joining feature: [increment](#c025.xhtml_Operator_Increment), [decrement](#c025.xhtml_Operator_Decrement),\
    \ and [one’s compliment](#c026.xhtml_Operator_Ones_Compliment). This process shortens\
    \ the assignment statement. For example, the following two statements produce\
    \ the same output:\n\n```\ny = y + 3;\ny += 3;\n```\n\nBoth statements assign\
