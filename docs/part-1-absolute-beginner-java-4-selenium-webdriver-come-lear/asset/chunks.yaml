    # Do While Loop


    ![image](d2d_images/chapter_title_below.png)


    The do while loop evaluates a condition at the bottom of the loop. Therefore,
    the loop will execute the statement within the loop then evaluate the condition.
    As a result, the do while loop always executes a statement for at least one iteration
    and continues as long as the condition is true. The following is the syntax for
    a do while loop:


    Syntax


    do


    {


    statement(s);


    }


    while (condition);


    Syntax Details


    | Argument | Description |


    | do | Keyword that starts the loop |


    | { | An opening curly bracket |


    | statement(s) | Statement(s) that will execute at least once |


    | ; | Semi-colon that completes the statement |


    | } | A closing curly bracket |


    | while | Keyword that determines if the loop’s condition will repeat |


    | condition | A boolean expression that determines if the loop will or will not
    repeat |


    | ; | Semi-colon that completes the condition |


    Figure 4.15 – Do While Loop Syntax Details


    The following is a do while loop example:


    public class ControlStructures


    {


    public static void main (String[] args)


    {


    int i = 0;


    do


    {


    System.out.println("The variables value is " + i);


    i++;


    }


    while (i > 5); 


    }


    }


    ![image](d2d_images/image026.png)Figure 4.16 – Do While Loop Example


    Program Output:


    The variables value is 0


    The variables value is 1


    The variables value is 2


    The variables value is 3


    The variables value is 4


    Line five initializes the variable "i" to zero “0”. The keyword “[do](#c018.xhtml_do)”
    starts the do while loop followed by two statements surrounded by curly brackets.
    A value for the variable “i” is repeatedly printed via line nine while the condition
    (i < 5) is true. Coincidentally, the condition is evaluated after the statement
    at line 12\. Like the while loop, an [infinite loop](#c037.xhtml_infinite_loop)
    would have occurred if the [increment operator (++)](#c025.xhtml_Operator_Increment)
    was not added at line 10\. Also, the initialization and conditional values can
    create an [infinite loop](#c037.xhtml_infinite_loop) if not set correctly. In
    this example, the statements were repeated multiple iterations because the condition
    started with a true result. The following shows what happens when the condition
    starts with a false result:


    public class ControlStructures


    {


    public static void main (String[] args)


    {


    int i = 0;


    do


    {


    System.out.println("The variables value is " + i);


    i++;


    }


    while (i > 5);       


    }


    }


    ![image](d2d_images/image001.png)


    Figure 4.17 – Do While Loop Example (Start With False Condition)


    Program Output:


    The variables value is 0


    Line five initializes the variable "i" to zero “0”. Therefore, the condition (i
    > 5) at line 12 is false due to zero being less than five. The do while loop executed
    the statement because statements are executed first, then the condition is evaluated.


    Note: The loops ([for](#c037.xhtml__For_Loop), [while](#c038.xhtml__While_Loop),
    and [do while](#c039.xhtml__Do_While_Loop)) are similar in functionality. A rule
    of thumb to use when deciding which loop to implement is:


    *   Implement a [for loop](#c037.xhtml__For_Loop) when executing a specific number
    of iterations


    *   Implement a [while loop](#c038.xhtml__While_Loop) when the loop will repeat
    an uncertain number of iterations


    *   Implement a [do while loop](#c039.xhtml__Do_While_Loop) when a loop needs
    to be executed at least one iteration


