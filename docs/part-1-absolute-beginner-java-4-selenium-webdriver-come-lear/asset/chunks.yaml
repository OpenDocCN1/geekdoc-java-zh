  trans: "\n\n变量是一个带有名称并包含一个值的内存位置（请参见第 2 章中的变量和数据类型）。为了使用该变量，必须对其进行声明和初始化。声明变量是通过提供数据类型和变量名来明确表示一个变量的存在。数据类型指的是可以存储在变量中的数据类型，而变量名则标识该变量。在\
    \ Java 中，数据类型有两种：基数据类型和引用类型。基数据数据类型支持八种基本数据类型，而引用数据类型则基于类。初始化变量是指给变量分配一个在程序执行期间可以改变的值。以下是变量声明和初始化的示例：\n\
    \n```java\npublic class Declare_Initialize_Variable\n{\n    public static void\
    \ main(String[] args)\n    {\n        int sum;\n        sum = 3 + 4;\n       \
    \ System.out.println(\"What is the sum of 3 + 4? \" + sum);\n    }\n}\n```\n\n\
    ![image](img/image042.png)\n图 1.2 – 变量声明与初始化\n\n程序输出：\n第五行声明了数据类型为 `int` 且变量名为\
    \ `sum` 的变量，而第七行将 `3 + 4` 初始化为变量 `sum`。在 Java 中，所有变量都拥有数据类型、变量名和值。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 运算符\n\n![image](img/chapter_title_below.png)\n\n运算符是如加（`+`）和减（`-`）之类的符号，用于执行数学运算（请参见第\
    \ 3 章中的运算符）。运算符在操作数上执行，操作数可以是任何可以改变的内容。变量是一种在执行期间发生变化的常见[操作数]。在 Java 中，有四种运算符：\n\
    \n1. 算术运算符 – 对数值执行数学运算\n2. 位运算符 – 利用位对操作数进行操作\n3. 逻辑运算符 – 根据一个或多个表达式返回布尔值（true\
    \ 或 false）\n4. 关系运算符 – 在比较操作数后返回布尔值（true 或 false）\n\n以下是算术运算符的示例：\n\n```java\n\
    public class Subtraction_Operator\n{\n    public static void main(String[] args)\n\
    \    {\n        // Subtraction Operator\n        int x, y, answer;\n        x\
    \ = 100;\n        y = 80;\n        answer = x - y;\n        System.out.println(\"\
    What is 100 - 80? \" + answer);  \n    }\n}\n```\n\n![image](img/image056.png)\n\
    图 1.3 – 减法算术运算符\n\n程序输出：\n100 - 80 等于？ 20\n\n第七行声明了数据类型为 `int` 的变量 `x, y, answer`。然而，第九行和第十行将值（`x\
    \ = 100` 和 `y = 80`）赋值给其中两个变量。`– 减`运算符在第 12 行实现，它从左侧操作数`x` 中减去右侧操作数`y`，然后将值 `20`\
    \ 分配给变量 `answer`。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 控制结构\n\n![image](img/chapter_title_below.png)\n\n控制结构提供了调节程序流的方法（请参见第 4 章中的控制结构）。流程由分支和循环引导。分支允许在评估条件或变量后跳过某些语句。循环允许根据布尔表达式重复特定的语句。以下是两个分支和三个循环的列表：\n\
    \n## 分支\n\n1. if 分支 – 当条件为真时执行语句\n2. switch 分支 – 评估变量，然后根据变量的值执行语句\n\n## 循环\n\n\
    1. for 循环 – 执行特定次数的代码块\n2. while 循环 – 只要布尔表达式为真就执行语句\n3. do-while 循环 – 至少执行一次语句，只要布尔表达式为真就重复\n\
    \n以下是 if 示例：\n\n```java\npublic class If_Branch\n{\n    public static void main(String[]\
    \ args)\n    {\n        // If Branch\n        boolean study;\n        study =\
    \ true;\n        if (study == true)\n        {\n            System.out.println(\"\
    You can learn Java within 30 days\");\n        }\n        else\n        {\n  \
    \          System.out.println(\"May take longer than 30 days\");\n        }\n\
    \    }\n}\n```\n\n![image](img/image58.png)\n图 1.4 – if 分支\n\n程序输出：\n你可以在 30 天内学会\
    \ Java\n\n第八行给变量 `study` 赋值 `true`。由于 `study == true` 为真，程序执行第 12 行并跳过其余行（14-17）。如果条件为假，程序将执行\
    \ 14-17 行。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 类、对象与方法\n\n![image](img/chapter_title_below.png)\n\
    \nJava 是一种面向对象的编程（OOP）语言，以对象为中心。对象是任何可以被看到或感知到的。所有对象有两个特征：状态和行为。状态标识对象，行为代表对象的动作。例如，客户可以通过姓名（状态）来识别，而说话（行为）是客户的动作。\n\
    \n状态和行为这两个特征都由类定义。类是对象的模板，也是面向对象编程的基础。数据以及操作数据的语句由类指定。此外，通过类访问数据是通过方法实现的。方法操纵数据并与类交互。以下是一个说明类、对象和方法的示例：\n\
    \n```java\nclass Customer\n{\n    String name;\n    int age;\n\n    public static\
    \ void main(String[] args)\n    {\n        Customer firstCustomer= new Customer\
    \ ();\n        firstCustomer.name = \"Joe Doe\";\n        System.out.println(\"\
    The customer's name is \" + firstCustomer.name);\n    }\n}\n```\n\n![image](img/image30.png)\n\
    图 1.5 – 类、对象与方法示例\n\n程序输出：\n客户的名字是 Joe Doe\n\n*   第一行显示关键字 `class` 和类名 `Customer`\n\
    *   第六行是 `main` 方法\n*   第八行声明 `firstCustomer` 为类型为 `Customer` 的变量。关键字 `new` 分配内存并创建一个新的\
    \ `Customer` 对象。\n\n"
