  trans: "\n\n![image](img/image048.png)图 3.14 – 运算符优先级示例\n\n程序输出：\n\n```\n不带括号的总和是多少？14\n\
    带括号的总和是多少？20\n```\n\n通常，乘法运算符 (*) 运算符会在加法运算符 (+) 运算符之前进行求值。变量 `total` 在第 7 行和第\
    \ 10 行被赋值了相同的值。然而，第 7 行的语句不包含括号，而第 10 行包含括号。在第 7 行中，乘法运算符 (*) 优先计算值 `3 * 4`，然后通过加法运算符\
    \ (+) 运算符加上值 `2`。因此，值 `14`（`3 * 4 = 12` 且 `12 + 2 = 14`）被赋值给第 7 行的变量 `total`。在第\
    \ 10 行中，括号的优先级高于乘法运算符 (*)。结果是，在括号内先计算值 `2 + 3`，然后计算乘法运算符 (*)。因此，值 `20`（`2 + 3\
    \ = 5` 且 `5 * 4 = 20`）被赋值给第 10 行的变量 `total`。根据[Java ^(TM) 教程](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html)，以下是运算符优先级列表：\n\
    \n| 运算符 | 优先级 |\n| :--- | :--- |\n| 后置 | `expr++ expr--` |\n| 一元 | `++expr--expr\
    \ +expr -expr ~ !` |\n| 乘除 | `* / %` |\n| 相 | `+ -` |\n| 移位 | `<< >> >>>` |\n\
    | 关系 | `< > <= >= instanceof` |\n| 等于 | `== !=` |\n| 位与 | `&` |\n| 位异或 | `^` |\n\
    | 位按或 | `|` |\n| 逻辑与 | `&&` |\n| 逻辑或 | `||` |\n| 三元 | `? :` |\n| 赋值 | `= += -=\
    \ *= /= %= &= ^= |= <<= >>= >>>=` |\n\n图 3.15 – 运算符优先级\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 数据类型转换\n\n![image](img/chapter_title_below.png)\n\n数据类型转换是将一个数据类型 的值转换为另一种数据类型。例如，一个数值数据类型“`float`”的值可以转换为另一个数值数据类型“`double`”。然而，`boolean`\
    \ 数据类型的值永远无法转换为数值类型。转换/转型有两种类型：\n\n1. 隐式转换\n2. 显式转换\n\n注意：基本数据类型的层次结构从高到低依次为：`double`](#c022.xhtml_double)、`float`](#c022.xhtml_float)、`long`](#c022.xhtml_long)、`int`](#c022.xhtml_int)、`short`](#c022.xhtml_short)，然后是\
    \ `byte`](#c022.xhtml_byte)。\n\n## 隐式转换\n\n隐式转换是在没有指示编译器 将一种数据类型 转换为另一种数据类型 的情况下发生的转换。这种类型的转换只发生在宽转换中。当某个特定的数据类型\
    \ 的值转换为更高的数据类型 时，宽转换会自动发生。因此，根据基本数据类型层次结构，`int`](#c022.xhtml_int) 可以转换为 `float`](#c022.xhtml_float)，但尝试将\
    \ `float`](#c022.xhtml_float) 转换为 `int`](#c022.xhtml_int) 时会产生错误。以下是一个隐式转换示例：\n\
    \n```java\npublic class Operators\n{\n    public static void main (String[] args)\n\
    \    {\n        int i;\n        float f;\n        i = 78;\n        System.out.println(\"\
    The value of int 'i' is: \" + i);\n        f = i;\n        System.out.println(\"\
    The value of float 'f' is: \" + f);\n    }\n}\n```\n\n![image](img/image007.png)\n\
    \n图 3.16 - 赋值类型转换示例\n\n程序输出：\n```\nThe value of int 'i' is: 78\nThe value of float\
    \ 'f' is: 78.0\n```\n\nint 'i' 的值是： 78\nfloat 'f' 的值是： 78.0\n\n第五行声明了 `i` 为 `int`\
    \ 类型，而第六行声明 `f` 为 `float` 类型。第八行将 `78` 赋值给 `f`。然而，第十一行将 `78` 转换为 `float`。注意在转换\
    \ `78` 时值没有丢失数据。隐式转换需要以下两个原则：\n\n1. 两种数据类型必须兼容\n2. 目标数据类型的范围必须高于源类型\n\n以下是根据基本数据类型层次结构列出的宽转换列表：\n\
    \n* `byte`](#c022.xhtml_byte) 转换为 `short`](#c022.xhtml_short)、`int`](#c022.xhtml_int)、`long`](#c022.xhtml_long)、`float`](#c022.xhtml_float)或`double`](#c022.xhtml_double)\n\
    * `short`](#c022.xhtml_short) 转换为 `int`](#c022.xhtml_int)、`long`](#c022.xhtml_long)、`float`](#c022.xhtml_float)或`double`](#c022.xhtml_double)\n\
    * `int`](#c022.xhtml_int) 转换为 `long`](#c022.xhtml_long)、`float`](#c022.xhtml_float)或`double`](#c022.xhtml_double)\n\
    * `long`](#c022.xhtml_long) 转换为 `float`](#c022.xhtml_float)或`double`](#c022.xhtml_double)\n\
    * `float`](#c022.xhtml_float) 转换为 `double`](#c022.xhtml_double)\n* `char`](#c022.xhtml_char)\
    \ 转换为 `int`](#c022.xhtml_int)、`long`](#c022.xhtml_long)、`float`](#c022.xhtml_float)或`double`](#c022.xhtml_double)\n\
    \n## 显式转换\n\n显式转换是在有指示编译器 将一种数据类型 转换为另一种数据类型 时发生的转换。这种类型的转换可以发生在宽转换](#c032.xhtml_Widening_Conversions）和窄转换中。窄转换发生在当特定的数据类型\
    \ 的值转换为较低的数据类型 时。因此，在将 `float`](#c022.xhtml_float) 转换为 `int`](#c022.xhtml_int)\
    \ 时不会产生错误。以下是显式转换的语法：\n\n```\n(targetDataType) expression;\n```\n\n语法细节\n\n| 参数\
    \ | 描述 |\n| :--- | :--- |\n| targetDataType | 转换表达式的目标数据类型 |\n| expression | 将要转换的值\
    \ |\n| ; | 分号结束显式转换语句 |\n\n图 3.17 – 显式转换语法细节\n\n以下是一个显式转换示例：\n\n```java\npublic\
    \ class Operators\n{\n    public static void main (String[] args)\n    {\n   \
    \     int i = 8;\n        double d = (double) i;\n        System.out.println(\"\
    What is the value of int 'i'? \" + i);\n        System.out.println(\"What is the\
    \ value of double 'd'? \" + d);\n\n        float f = 12.34f;\n        short s\
    \ = (short) f;\n        System.out.println(\"What is the value of float 'f'? \"\
    \ + f);\n        System.out.println(\"What is the value of short 's'? \" + s);\n\
    \    }\n}\n```\n\n![image](img/image047.png)\n\n图 3.18 – 显式转换示例\n\n程序输出：\n```\n\
    What is the value of int 'i'? 8\nWhat is the value of double 'd'? 8.0\nWhat is\
    \ the value of float 'f'? 12.34\nWhat is the value of short 's'? 12\n```\n\n"
- fmt: "\nLine five assigns “8” to data type `int`, which is named \"i.\" An explicit\
    \ widening conversion ensues at line six when variable `i`—an `int` data type—converts\
    \ to a `double` data type. Line 11 assigns 12.34 (a default data type of `double`),\
    \ but converts it to a `float` data type `12.34f`. Variable `f` holds a 12.34\
    \ value, then converts to a `short` data type in line 12. Notice that the value\
    \ loses data on line 15, when the narrowing conversion takes place and converts\
    \ a `float` value “12.34” to a `short` value of “12.” The following is a list\
    \ of narrowing conversions according to the primitive data type hierarchy:\n\n\
    * `byte` converts to `char`\n* `short` converts to `byte` or `char`\n* `char`\
    \ converts to `byte` or `short`\n* `int` converts to `byte`, `short`, or `char`\n\
    * `long` converts to `byte`, `short`, `char`, or `int`\n* `float` converts to\
    \ `byte`, `short`, `char`, `int`, or `long`\n* `double` converts to `byte`, `short`,\
    \ `char`, `int`, `long`, or `float`\n\n# Expressions\n\n`Operators`, `variables`,\
    \ `constants`, and `methods` (calls and returns) are components of an expression.\
    \ A component joined with an `operator` forms an expression. It is possible to\
    \ create a compound expression by combining multiple expressions. However, the\
    \ `data types` must be compatible to construct a valid compound expression. For\
    \ example, an `int` data type can be mixed with a `long` data type because both\
    \ are numeric.\n\nThrough the use of type promotion rules, the mixture of `data\
    \ types` is converted to the same `data type`. Values that are returned from an\
    \ expression depend on the `data type`. Data types `char`, `byte`, and `short`\
    \ are advanced to `int`. An expression is promoted to `long` if one of the `operands`\
    \ is a `long` data type. The same goes for `float` data types, if one of the `operands`\
    \ is a `float` then the whole expression is a `float`. Likewise, an expression\
    \ is promoted to a `double` data type if one of the `operands` is a `double`.\n\
    \n```java\npublic class Operators {\n    public static void main (String[] args)\
    \ {\n        byte b = 7;\n        float f = 34.56f;\n        float total = (b\
    \ * f);\n        System.out.println(\"The total of byte 'b' times float 'f' (7\
    \ * 34.56) is: \" + total);\n    }\n}\n```\n\n**Program Output:**\n`The total\
    \ of byte 'b' times float 'f' (7 * 34.56) is: 241.92`\n\nLine five declares and\
    \ assigns a `byte` data type while line seven declares and assigns a `float` data\
    \ type. On line eight, the `*` operator multiplies both `byte` and `float` even\
    \ though the types are mixed. However, the expression is promoted as a `float`\
    \ since one of the `operands` is a `float`.\n\nChapter 3 gave an account for the\
    \ four types of Java operators: `Arithmetic`, `Bitwise`, `Logical`, and `Relational`.\
    \ The `Assignment Operator` and `Ternary Operator` were examined along with rankings\
    \ of each `operator`. Chapter 4 will explain the two types of control structures:\
    \ branches and loops. There are two types of branches: the `if branch` and the\
    \ `switch branch`. There are three types of loops: `for loop`, `while loop`, and\
    \ `do while loop`.\n\n# Chapter 4\n\n## Control Structures\n\nControl structures\
    \ are the process of using logic to force the program to skip statements while\
    \ looping other statements. Forcing the program to skip statements is known as\
    \ branching and looping specific statements is carried out via loops. The two\
    \ types of branches are `if branch` and `switch branch`. The three types of loops\
    \ are `for loop`, `while loop`, and `do while loop`. In addition to the branches\
    \ and loops are jump statements. Jump statements allow execution to bypass unnecessary\
    \ components of the program. The jump statements utilize keywords `break` and\
    \ `continue`. Both keywords can be included within all branches and loops.\n\n\
    Chapter four will cover the following regarding control structures:\n\n* `If Branch`\n\
    * `Switch Branch`\n* `For Loop`\n* `While Loop`\n* `Do While Loop`\n* `Break To\
    \ Exit`\n* `Continue To Next Statement`\n\n## If Branch\n\nThe `if branch` executes\
    \ a statement when a condition is true. In other words, a specific statement is\
    \ executed if a condition is met. An `if branch` is a greatly utilized and indispensable\
    \ control structure. The following is the syntax for the `if branch`:\n\n```java\n\
    if (condition)\n{\n    statement(s);\n}\n```\n\n### Syntax Details\n\n| Argument\
    \ | Description |\n| :--- | :--- |\n| if | Keyword that starts the if branch |\n\
    | condition | Boolean expression which results in a true or false result |\n|\
    \ { | An opening curly bracket |\n| statement(s) | Statement that will be executed\
    \ if the condition is true |\n| ; | Semi-colon completes the true statement |\n\
    | } | A closing curly bracket\n"
