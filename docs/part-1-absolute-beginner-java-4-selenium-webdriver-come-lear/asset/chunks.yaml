    \ 点击 `OK`。\n20. 点击 `Apply`。\n21. 点击 `OK`。\n\n注意：步骤 10 到 21 是可选的，但很有帮助。Eclipse\
    \ 会自动在 `Environment Variables` 对话框中搜索路径（例如，`C:\\Program Files\\Java\\jdk1.8.0_66\\\
    bin`）。\n\n## 安装 Eclipse IDE\n\nEclipse 是一个用于开发和测试应用程序的开源 IDE。IDE 是一个综合工具，包含许多功能。源码编辑器和调试器是其中一些功能。源码编辑器允许创建代码，而调试器则负责检查创建的代码。Eclipse\
    \ 支持多种编程语言，但主要用于 Java。Eclipse 的优点之一是可以使用插件。插件允许自定义和添加额外功能。以下是安装 Eclipse IDE 的步骤：\n\
    \n### 安装 Eclipse 的步骤：\n\n1. 访问 [`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\
    2. 选择平台（Windows、Mac OS 或 Linux）\n3. 点击 Eclipse IDE for Java EE Developers 的系统类型（例如，“64\
    \ bit”）。\n   ![image](img/image065.png)\n4. 选择一个离你最近的镜像站点（例如，“哥伦大学”）。\n   ![image](img/image010.png)\n\
    5. 进入 `Download` 文件夹。\n6. 右键点击 `Eclipse` zip 文件并解压所有文件。\n   ![image](img/image014.png)\n\
    7. 打开 `eclipse.exe` 文件启动 Eclipse IDE：\n   1. 进入解压文件夹（例如，`eclipse-jee-mars-1-win32-x86_64`）。\n\
    \   2. 打开 `eclipse` 文件夹。\n   3. 右键点击 `eclipse.exe` 并选择 Open。\n   ![image](img/image035.png)\n\
    8. 加载 Eclipse IDE。\n   ![image](img/image059.png)\n\n第 1 章概述了关于变量、数据类型、运算符、控制结构、类、对象和方法的通用概念。变量、数据类型、运算符和控制结构的详细信息在本书中给出。然而，类、对象和方法的详细信息将在另一本书“[(Part\
    \ 2) Java 4 Selenium WebDriver](http://tinyurl.com/Review-Part-2-Java-4-Selenium)”中解释，并结合面向对象编程\
    \ (OOP) 概念：继承、封装和多态。第 2 章将定义四种变量 local、parameter、instance 和 class，以及原始数据类型：boolean,\
    \ byte, char, double, float。\n\n## 第 2 章：变量与数据类型\n\n变量是存储值的命命名容器。变量名用于识别变量。数据类型决定了变量的类型。在\
    \ Java 中，数据类型有两种：原始类型和引用类型。原始类型包括 `int`、`double`、`boolean`、`float`、`long`、`short`\
    \ 等。\n\n## 变量命名\n\n变量名在内存中标识时非常重要。因此变量被称为标识符。除了变量外，标识符还代表方法以及其他自定义项。所有变量名从一个字符到无限字符。以下是一个变量命名示例：\n\
    \n```java\npublic class VariableExample\n{\n    public static void main(String[]\
    \ args)\n    {\n        int custOrder;\n        custOrder = 123;\n        System.out.println(\"\
    The customer's order number is \" + custOrder);\n    }\n}\n```\n\n![image](img/image038.png)\n\
    \n图 2.1 变量命名示例\n\n程序输出：\n\nThe customer's order number is 123\n\n## 变量命名规则\n\n\
    Java 有命名规则。其中规则是确保每个变量都是唯一的。唯一的名称可以防止错误的发生，例如“重复的局部变量”——意味着同一个变量名被输入了多次。以下是更多关于变量命名的规则：\n\
    \n* 可以包含区分大小写的字母、数字、美元符号 `$` 和下划线 `_`\n* 可以以字母、美元符号 `$` 或下划线 `_` 开\n* 不能以数字开头\n\
    * 不能包含空格或美元符号 `$`、下划线 `_` 以外的特殊字符\n* 不能包含保留关键字\n\n以下是 50 个 Java 保留关键字：\n\n| abstract\
    \ | continue | for | new | switch |\n| assert | default | goto | package | synchronized\
    \ |\n| boolean | do | if | private | this |\n| break | double | implements | protected\
    \ | throw |\n| byte | else | import | public | throws |\n\n"
