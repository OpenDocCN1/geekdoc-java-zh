    # While Loop


    ![image](d2d_images/chapter_title_below.png)


    The while loop repeats a statement while a condition is true. Conditions are boolean
    expressions that is checked prior to executing the statement. In addition, the
    [variable name](#c018.xhtml__Variable_Names_2) is initialized before the loop
    and evaluated as part of the condition. When executing the statement, the while
    loop continues until the condition becomes false. The following is the syntax
    of a while loop.


    Syntax


    while (condition)


    {


    statement(s);


    }


    Syntax Details


    | Argument | Description |


    | while | Keyword that starts the loop |


    | condition | A boolean expression that determines if the loop will or will not
    repeat |


    | { | An opening curly bracket |


    | statement(s) | Statement(s) that will execute after the condition is met |


    | ; | Semi-colon that completes the statement |


    | } | A closing curly bracket |


    Figure 4.13 – While Loop Syntax Details


    The following is a while loop example:


    public class ControlStructures


    {


    public static void main (String[] args)


    {


    int i = 0;


    while (i < 5)


    {


    System.out.println("The variables value is " + i);


    i++;


    }     


    }


    }


    ![image](d2d_images/image027.png)


    Figure 4.14 – While Loop Example


    Program Output:


    The variables value is 0


    The variables value is 1


    The variables value is 2


    The variables value is 3


    The variables value is 4


    Line five initializes the variable "i" to zero “0”. The variable will be evaluated
    at line seven as part of the condition (i < 5) after keyword “[while](#c018.xhtml_while)”.
    A value for the variable "i" is repeatedly printed via line nine while the condition
    is true. Notice the [increment operator](#c025.xhtml_Operator_Increment) at line
    10\. It is important to know that the while loop never stops if the [increment
    operator](#c025.xhtml_Operator_Increment) is not added. Therefore, the loop would
    continue indefinitely, generating an [infinite loop](#c037.xhtml_infinite_loop).
    In addition, the while loop becomes indefinite if the initialization and conditional
    variable values are not set in agreement.


