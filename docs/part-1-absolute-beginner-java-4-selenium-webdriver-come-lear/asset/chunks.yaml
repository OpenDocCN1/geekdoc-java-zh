    else if (extraCustomers <= 3)


    {


    System.out.println("No Discount: Customer count less than or equal to 3");


    }


    else


    {


    System.out.println("Error: Not a valid customer count");


    }     


    }


    }


    ![image](d2d_images/image046.png)


    Figure 4.5 – Else If Branch


    Program Output:


    No Discount: Customer count less than or equal to 3


    Line five assigns “2” to the variable “extraCustomers”. Line 11 display keywords
    "[else](#c018.xhtml_else)" and “[if](#c018.xhtml_if)” followed by a parenthesis.
    Inside the parenthesis is a condition (extraCustomers <= 3) that returns true.
    True is returned because two is less than or equal to three. The second condition
    (line 11) is only executed after the first condition (line seven) is false.


    Note: Several else-if branches can be added to the if branch:


    ## Nested If Branch


    The nested if branch consists of an if or else-if branch inside an if, else, or
    else-if branch. A particular outer if branch serves as a nest for the inner branch.
    The following is a nested if branch example:


    public class ControlStructures


    {


    public static void main (String[] args)


    {


    int extraCustomers = 15;


    if (extraCustomers >= 3)


    {


    System.out.println("Customer receives a discount");


    if (extraCustomers >= 10)


    {


    System.out.println("25% off the price");


    }


    else


    {


    System.out.println("10% off the price");


    }


    }   


    else


    {


    System.out.println("Customer does not receive a discount");


    }     


    }


    }


    ![image](d2d_images/image011.png)


    Figure 4.6 – Nested If Branch


    Program Output:


    Customer receives a discount


    25% off the price


    The nested if branch starts at line 11 and ends at line 18\. A condition (extraCustomers
    >= 10) determines if the customer receives 10 or 25 percent off. In this case,
    the variable “extraCustomers” is assigned 15 at line five. Therefore, the condition
    at line 11 evaluates to true and executes the first statement “25% off the price.”
    The second statement would execute if the variable “extraCustomers” is less than
    10.


