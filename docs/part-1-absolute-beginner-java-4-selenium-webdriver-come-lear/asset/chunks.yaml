    The values 25 and 50 are not equal so false is returned. A similar process is
    performed for all examples in [Figure 3.8](#c028.xhtml_Figure_3_8) using a different
    Relational Operator according to [Figure 3.7](#c028.xhtml_Figure_3_7).


