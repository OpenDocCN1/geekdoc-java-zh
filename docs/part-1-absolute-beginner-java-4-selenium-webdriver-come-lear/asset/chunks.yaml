    The following are steps to install JDK:\n\n### Steps To Install JDK:\n\n1. Go\
    \ to Java SE Downloads [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\n\
    2. Click the `JDK Download` button.\n   ![image](d2d_images/image036.png)\n3.\
    \ Click `Accept License Agreement` in the `Java SE Development Kit 8u66` section.\n\
    \   Note: There may be a more recent version than `8u66`.\n   ![image](d2d_images/image052.png)\n\
    4. Click the `Download` link for the appropriate System Type “i.e., Windows x64”.\n\
    5. Go to the `Download` folder.\n6. Open the downloaded executable file.\n   ![image](d2d_images/image043.png)\n\
    7. Click the `Next` button to Set Up `Java SE Development Kit`.\n8. Click the\
    \ `Next` button for `Custom Set Up`.\n9. Click the `Next` button to Install to\
    \ a specific location: “i.e., `C:\\Program Files\\Java`”.\n10. Go to the location\
    \ and Open the `jdk` folder “i.e., `jdk1.8.0_66`”.\n    ![image](d2d_images/image053.png)\n\
    11. Open the `bin` folder.\n12. Copy the `bin` folder’s location “i.e., `C:\\\
    Program Files\\Java\\jdk1.8.0_66\\bin`”.\n13. Access the `Advanced system settings`\
    \ via `System`.\n    ![image](d2d_images/image003.png)\n14. Click the `Advanced`\
    \ tab.\n15. Click `Environment Variables`.\n16. Go to `Path` within System variables\
    \ section.\n    ![image](d2d_images/image049.png)\n17. Click `Edit`.\n18. Paste\
    \ the `bin` folder’s location “i.e., `C:\\Program Files\\Java\\jdk1.8.0_66\\bin`”.\n\
    \    ![image](d2d_images/image063.png)\n19. Click `OK`.\n20. Click `Apply`.\n\
    21. Click `OK`.\n\nNote: Steps 10 – 21 are optional but beneficial. Eclipse automatically\
    \ searches for the path “i.e., `C:\\Program Files\\Java\\jdk1.8.0_66\\bin`” that\
    \ is placed in the `Environment Variables` modal.\n\n## Install Eclipse IDE\n\n\
    Eclipse is an open source IDE used for developing and testing applications. An\
    \ IDE is comprehensive whereby it contains many features. The source code editor\
    \ and debugger are some of the features. A source code editor allows code creation\
    \ while a debugger examines the created code. Eclipse supports multiple programming\
    \ languages but mainly used for Java. One of the benefits of Eclipse is the use\
    \ of plugins. The plugins allow customizations and additional functionalities.\
    \ The following are steps to install Eclipse IDE:\n\n### Steps To Install Eclipse:\n\
    \n1. Go to [https://eclipse.org/downloads/](https://eclipse.org/downloads/)\n\
    2. Select the platform (Windows, Mac OS, or Linux)\n3. Click the System Type “i.e.,\
    \ 64 bit” for Eclipse IDE for Java EE Developers.\n   ![image](d2d_images/image065.png)\n\
    4. Choose a mirror close to you “i.e., Columbia University”.\n   ![image](d2d_images/image010.png)\n\
    5. Go to `Download` folder.\n6. Right click the `Eclipse` zip file and Extract\
    \ All files.\n   ![image](d2d_images/image014.png)\n7. Open the `eclipse.exe`\
    \ file to launch Eclipse IDE:\n   1. Go the extracted folder “i.e., `eclipse-jee-mars-1-win32-x86_64`”.\n\
    \   2. Open `eclipse` folder.\n   3. Right click `eclipse.exe` and Select Open.\n\
    \   ![image](d2d_images/image035.png)\n8. Load Eclipse IDE.\n   ![image](d2d_images/image059.png)\n\
    \nChapter 1 outlined general concepts regarding variables, data types, operators,\
    \ control structures, classes, objects, and methods. The details of variables,\
    \ data types, operators, and control structures are presented in this book. However,\
    \ details of classes, objects, and methods are explained in the next book “[(Part\
    \ 2) Java 4 Selenium WebDriver](http://tinyurl.com/Review-Part-2-Java-4-Selenium)”\
    \ along with Object-Oriented Programming (OOP) concepts: Inheritance, Encapsulation,\
    \ and Polymorphism. Chapter 2 will define the four types of variables [local](#c021.xhtml__Local_Variables_3),\
    \ [parameter](#c021.xhtml__Parameter_Variables_2), [instance](#c021.xhtml__Instance_Variables_2),\
    \ and [class](#c021.xhtml__Class_Variables_1) as well as primitive data types:\
    \ [boolean](#c022.xhtml_boolean), [byte](#c022.xhtml_byte), [char](#c022.xhtml_char),\
    \ [double](#c022.xhtml_double), [float](#c022.xhtml_float).\n\n## Chapter 2: Variables\
    \ and Data Types\n\nA variable is a named container that holds a value. A variable\
    \ name is used to identify the variable. Data type determines the type of variable.\
    \ In Java, there are two kinds of data types: primitive and reference. Primitive\
    \ data types include `int`, `double`, `boolean`, `float`, `long`, `short`, etc.\n\
    \n## Variable Names\n\nThe name of a variable is significant when identifying\
    \ the variable in memory. Hence, variables are referred to as identifiers. In\
    \ addition to variables, an identifier represents methods along with other user-defined\
    \ items. All variable names can range from one character to an unlimited number\
    \ of characters. The following is a variable name example:\n\n```java\npublic\
    \ class VariableExample\n{\n    public static void main(String[] args)\n    {\n\
    \        int custOrder;\n        custOrder = 123;\n        System.out.println(\"\
    The customer's order number is \" + custOrder);\n    }\n}\n```\n\n![image](d2d_images/image038.png)\n\
    \nFigure 2.1 – Variable Name Example\n\nProgram Output:\n\nThe customer's order\
    \ number is 123\n\n## Variable Naming Rules\n\nJava has rules to naming variables.\
    \ One of the rules is to ensure each variable has a unique name. Unique names\
    \ prevent errors from occurring, such as “Duplicate local variable”— meaning the\
    \ same variable name has been entered more than one time. The following is a list\
    \ of more rules for naming a variable:\n\n* Can contain case sensitive letters,\
    \ numbers, dollar sign `$`, and underscore `_`\n* Can begin with a letter, dollar\
    \ sign `$`, or underscore `_`\n* Cannot begin with a number\n* Cannot contain\
    \ a space or special character except dollar sign `$`, and underscore `_`\n* Cannot\
    \ contain a reserve keyword\n\nThe following is a list of 50 Java reserve keywords:\n\
    \n| abstract | continue | for | new | switch |\n| assert | default | goto | package\
    \ | synchronized |\n| boolean | do | if | private | this |\n| break | double |\
    \ implements | protected | throw |\n| byte | else | import | public | throws |\n"
