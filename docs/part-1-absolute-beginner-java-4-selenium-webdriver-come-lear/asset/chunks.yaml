    * `float`](#c022.xhtml_float) converts to `double`](#c022.xhtml_double)\n* `char`](#c022.xhtml_char)\
    \ converts to `int`](#c022.xhtml_int), `long`](#c022.xhtml_long), `float`](#c022.xhtml_float),\
