  raw: '![image](d2d_images/image048.png)Figure 3.14 – Operator Precedence Example


    Program Output:


    What is the total without a parenthesis? 14


    What is the total with a parenthesis? 20


    Typically, a [Multiplication (*)](#c025.xhtml_Operator_Multiplication) Operator
    is evaluated before an [Addition (+)](#c025.xhtml_Operator_Addition) Operator.
    The variable “total” is assigned the same values in line seven and line 10. However,
    the statement in line 7 do not contain parenthesis while line 10 contain parenthesis.
    In line 7, the [Multiplication (*)](#c025.xhtml_Operator_Multiplication) Operator
    is evaluated first for values 3 * 4 then value 2 is added via [Addition (+)](#c025.xhtml_Operator_Addition)
    Operator. Therefore, the value 14 (3 * 4 = 12 and 12 + 2 = 14) is assigned to
    variable “total” in line 7\. In line 10, the parenthesis ranks higher than the
    [Multiplication (*)](#c025.xhtml_Operator_Multiplication) Operator. As a result,
    values 2 + 3 is evaluated first within the parenthesis then the [Multiplication
    (*)](#c025.xhtml_Operator_Multiplication) Operator is evaluated. Hence, the value
    20 (2 + 3 = 5 and 5 * 4 = 20) is assigned to variable “total” in line 10\. According
    to [The Java ^(TM) Tutorials](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html),
    the following is an operator precedence list:


    | Operator | Precedence |


    | Postfix | expr++ expr— |


    | Unary | ++expr—expr +expr -expr ~ ! |


    | multiplicative | * / % |


    | additive | + - |


    | shift | << >> >>> |


    | relational | < > <= >= instanceof |


    | equality | == != |


    | bitwise AND | & |


    | bitwise exclusive OR | ^ |


    | bitwise inclusive OR | &#124; |


    | logical AND | && |


    | logical OR | &#124;&#124; |


    | ternary | ? : |


    | assignment | = += -= *= /= %= &= ^= &#124;= <<= >>= >>>= |


    Figure 3.15 – Operator Precedence


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Data Type Casting


    ![image](d2d_images/chapter_title_below.png)


    Data type casting is when the value of a [data type](#c017.xhtml_Data_Type) is
    converted into a different [data type](#c017.xhtml_Data_Type). For instance, the
    value of one numeric data type “[float](#c022.xhtml_float)” can be converted to
    another numeric data type “[double](#c022.xhtml_double).” However, the value of
    a [boolean](#c022.xhtml_boolean) data type can never be converted to a numeric
    type. There are two types of casts/conversions:


    1.  [Implicit Casting](#c032.xhtml__Implicit_Casting_1)


    2.  [Explicit Casting](#c032.xhtml__Explicit_Casting_1)


    Note: The primitive data type hierarchy from high to low is [double](#c022.xhtml_double),
    [float](#c022.xhtml_float), [long](#c022.xhtml_long), [int](#c022.xhtml_int),
    [short](#c022.xhtml_short), then [byte](#c022.xhtml_byte).


    ## Implicit Casting


    Implicit casting is when a conversion takes place without an instruction to the
    [compiler](#c011.xhtml_A_compiler) to convert one [data type](#c017.xhtml_Data_Type)
    into another [data type](#c017.xhtml_Data_Type). This type of casting only happens
    for a widening conversion. Widening conversions occur automatically when the value
    of a specific [data type](#c017.xhtml_Data_Type) is converted to a higher [data
    type](#c017.xhtml_Data_Type). Therefore, based on the [primitive data type hierarchy](#c032.xhtml_Primitive_Data_Type_Hierarchy),
    an [int](#c022.xhtml_int) can be converted to a [float](#c022.xhtml_float), but
    an error arises when trying to convert a [float](#c022.xhtml_float) to an [int](#c022.xhtml_int).
    The following is an implicit casting example:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int i;


    float f;


    i = 78;


    System.out.println("The value of int ''i'' is: " + i);


    f = i;


    System.out.println("The value of float ''f'' is: " + f);


    }


    }


    ![image](d2d_images/image007.png)


    Figure 3.16 - Assignment Type Conversion Example


    Program Output:


    The value of int ''i'' is: 78


    The value of float ''f'' is: 78.0


    Line five declares variable “i” with an [int](#c022.xhtml_int) data type while
    line six declares variable “f” as a [float](#c022.xhtml_float) data type. Initially,
    line eight assigns a value of 78 to variable “i”. However, a conversion happens
    on line 11 which converts the data type from [int](#c022.xhtml_int) to [float](#c022.xhtml_float).
    The value “78.0” remains the same but displays differently as a [float](#c022.xhtml_float)
    data type. Notice the value did not lose data when converting from 78 to 78.0\.
    The following two principles are necessary for an implicit casting:


    1.  Both data types must be compatible


    2.  Destination data type (left side) must have a higher range than the source
    data type (right side)


    The following is a list of [widening conversions](#c032.xhtml_Widening_Conversions)
    according to the [primitive data type hierarchy](#c032.xhtml_Primitive_Data_Type_Hierarchy):


    *   [byte](#c022.xhtml_byte) converts to [short](#c022.xhtml_short), [int](#c022.xhtml_int),
    [long](#c022.xhtml_long), [float](#c022.xhtml_float), or [double](#c022.xhtml_double)


    *   [short](#c022.xhtml_short) converts [int](#c022.xhtml_int), [long](#c022.xhtml_long),
    [float](#c022.xhtml_float), or [double](#c022.xhtml_double)


    *   [char](#c022.xhtml_char) converts to [int](#c022.xhtml_int), [long](#c022.xhtml_long),
    [float](#c022.xhtml_float), or [double](#c022.xhtml_double)


    *   [int](#c022.xhtml_int) converts to [long](#c022.xhtml_long), [float](#c022.xhtml_float),
    or [double](#c022.xhtml_double)


    *   [long](#c022.xhtml_long) converts [float](#c022.xhtml_float) or [double](#c022.xhtml_double)


    *   [float](#c022.xhtml_float) converts to [double](#c022.xhtml_double)


    ## Explicit Casting


    Explicit casting is when a conversion takes place with an instruction to the [compiler](#c011.xhtml_A_compiler)
    to convert one [data type](#c017.xhtml_Data_Type) into another [data type](#c017.xhtml_Data_Type).
    This type of casting can happen for a [widening](#c032.xhtml_Widening_Conversions)
    and narrowing conversion. Narrowing conversion occurs when the value of a specific
    [data type](#c017.xhtml_Data_Type) is converted to a lower [data type](#c017.xhtml_Data_Type).
    Consequently, an error will not be generated when converting a [float](#c022.xhtml_float)
    to an [int](#c022.xhtml_int). The following is an explicit casting syntax:


    Syntax


    (targetDataType) expression;


    Syntax Details


    | Argument | Description |


    | targetDataType | Desired data type to convert the expression |


    | expression | Value that will be converted |


    | ; | Semi-colon completes the explicit casting statement |


    Figure 3.17 – Explicit Casting Syntax Details


    The following is an explicit casting example:


    public class Operators


    {  


    public static void main (String[] args)


    {


    int i = 8;


    double d = (double) i;


    System.out.println("What is the value of int ''i''? " + i);


    System.out.println("What is the value of double ''d''? " + d);


    float f = 12.34f;  


    short s = (short) f;


    System.out.println("What is the value of float ''f''? " + f);


    System.out.println("What is the value of short ''s''? " + s);  


    }


    }


    ![image](d2d_images/image047.png)


    Figure 3.18 – Explicit Casting Example


    Program Output:


    What is the value of int ''i''? 8


    What is the value of double ''d''? 8.0


    What is the value of float ''f''? 12.34


    What is the value of short ''s''? 12'
