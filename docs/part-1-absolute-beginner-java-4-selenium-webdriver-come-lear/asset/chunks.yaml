    );\n                break;\n            case 5:\n                System.out.println(\"\
    Thursday is the 5th day of the week\");\n                break;\n            case\
    \ 6:\n                System.out.println(\"Friday is the 6th day of the week\"\
    );\n                break;\n            case 7:\n                System.out.println(\"\
    Saturday is the 7th day of the week\");\n                break;\n            default:\n\
    \                System.out.println(\"Not valid: There are only 7 days in a week\"\
    );\n        }\n    }\n}\n```\n\n![image](img/image015.png)图 4.9 – 嵌套 switch 分支\n\
    \n程序输出：\nMonday is the 2nd day of the week\nPlan to work 4 hours (half a day)\
    \ due to an appointment\n\n第五行给变量 `numHours` 赋值为 `4`。然后关键字 `switch` 通过检查变量的值，在第\
    \ 14 行开始嵌套 switch 分支。嵌套 switch 分支包含两个 `case` 和一个 `default`。第 16 行的一个 `case` 与第\
    \ 30 行的外部 `case` 拥有相同的常量 `4`。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# for 循环 (For Loop)\n\n![image](img/chapter_title_below.png)\n\n`for` 循环执行指定次数的代码块。换句话说，只要满足条件，语句就会执行。for\
    \ 循环的用处之一是允许在不重复编写的情况下执行语句。以下是 for 循环的语法：\n\n### 语法\n\n```\nfor (initialization;\
    \ condition; iteration)\n{\n    statement(s)\n}\n```\n\n### 语法细节\n\n| 参数 | 描述\
    \ |\n| :--- | :--- |\n| `for` | 启动 for 循环的关键字 |\n| `initialization` | 设置 for 循环的赋值\
    \ |\n| `;` | 分号 |\n| `condition` | 决定循环是否重复的布尔表达式 |\n| `;` | 分号 |\n| `iteration`\
    \ | 指明循环如何变化 |\n| `{` | 左括号 |\n| `statement(s)` | 将执行的语句 |\n| `;` | 分号 |\n| `}`\
    \ | 右括号 |\n\n图 4.10 – for 循环语法\n\n`initialization` 组件声明了数据类型并分配初始值。通常，`loop control\
    \ variable`（循环控制变量）是一个单字符 `i`。`condition` 是指定最大值的布尔表达式。所有的 for 循环在条件成立时继续。大多数工程师使用增量\
    \ (++) 作为迭代表达式。语句放在可选的大括号之间。虽然括号是可选的，但建议使用它们以提高可读性。以下是一个 for 循环示例：\n\n```java\n\
    public class ControlStructures\n{\n    public static void main (String[] args)\n\
    \    {\n        for (int i = 0; i < 5; i++ )\n        {\n            System.out.println(\"\
    The loop control variable value is \" + i);\n        }\n    }\n}\n```\n\n![image](img/image013.png)图\
    \ 4.11 – for 循环示例\n\n程序输出：\nThe loop control variable value is 0\nThe loop control\
    \ variable value is 1\nThe loop control variable value is 2\nThe loop control\
    \ variable value is 3\nThe loop control variable value is 4\n\n第五行通过关键字 `for`\
    \ 及其初始化、条件和迭代参数启动 for 循环。初始化 `(int i = 0;)` 将赋值为零。条件 `(i < 5)` 为 `loop control\
    \ variable` 设置了停止点。增量 `(i++)` 使 `loop control variable` 增加一次。语句位于第七行。\n\n在 for\
    \ 循环中使用协调的值非常重要。如果不一致，值可能会导致无限循环。无限循环是一个不会停止的循环。例如，下面的 for 循环由于初始值、最大值和迭代表达式会导致无限重复：\n\
    \n```\nfor (int i = 3; i > 1; i++)\n```\n\n初始值 `3` 从一个大于最大值 `1` 的值开始，而迭代器 `++`\
    \ 在每次循环后增加。为了修正这个无限循环，初始化值 `3` 必须减少到小于条件值 `1`；条件值 `1` 必须增加到大于初始化值 `3`；或者迭代器必须从每次循环后增加\
    \ `++` 变为每次循环后减少 `—`。\n\n"
- fmt: "\nNote: Routinely, a condition using a greater than operator (`>`) implements\
    \ a [decrement operator (—](#c025.xhtml_Operator_Decrement), while a condition\
    \ using a less than operator (`<`) implements an [increment operator (++)](#c025.xhtml_Operator_Increment).\n\
    \n## Nested For Loop\n\nThe nested for loop consist of a `for` loop inside another\
    \ `for loop`. An outer `for` loop serves as a nest for the inner loop. Statements\
    \ within the inner loop can utilize the [loop control variables](#c037.xhtml_loop_control_variable)\
    \ from the outer loop. As a result, it is best to use different loop control variables\
    \ for each loop. The following is a nested for loop example:\n\n```java\npublic\
    \ class ControlStructures\n{\n    public static void main (String[] args)\n  \
    \  {\n        for (int x = 0; x < 3; x++ )\n        {\n            System.out.println(\"\
    Outer Loop value is \" + x);\n            for (int y = 0; y < 3; y++ )\n     \
    \       {\n                System.out.println(\"  Inner Loop value is \" + y);\n\
    \            }\n        }\n    }\n}\n```\n\n![image](d2d_images/image012.png)\n\
    Figure 4.12 – Nested For Loop\n\nProgram Output:\nOuter Loop value is 0\nInner\
    \ Loop value is 0\nInner Loop value is 1\nInner Loop value is 2\nOuter Loop value\
    \ is 1\nInner Loop value is 0\nInner Loop value is 1\nInner Loop value is 2\n\
    Outer Loop value is 2\nInner Loop value is 0\nInner Loop value is 1\nInner Loop\
    \ value is 2\n\nLine eight starts the nested for loop with keyword `[for](#c018.xhtml_for)`\
    \ followed by arguments initialization, condition, and iteration. Initialization\
    \ `(int y = 0;)` assigns zero as the starting value. Condition `(y < 3)` sets\
    \ three as the stopping point for the [loop control variable](#c037.xhtml_loop_control_variable).\
    \ Increment `(y++)` increases the [loop control variable](#c037.xhtml_loop_control_variable)\
    \ by one. The statement prints the [loop control variable](#c037.xhtml_loop_control_variable)\
    \ via line 10.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# While Loop\n\n![image](d2d_images/chapter_title_below.png)\n\nThe while loop\
    \ repeats a statement while a condition is true. Conditions are boolean expressions\
    \ that is checked prior to executing the statement. In addition, the [variable\
    \ name](#c018.xhtml__Variable_Names_2) is initialized before the loop and evaluated\
    \ as part of the condition. When executing the statement, the while loop continues\
    \ until the condition becomes false. The following is the syntax of a while loop.\n\
    \n### Syntax\n\n```java\nwhile (condition)\n{\n    statement(s);\n}\n```\n\n###\
    \ Syntax Details\n\n| Argument | Description |\n| :--- | :--- |\n| while | Keyword\
    \ that starts the loop |\n| condition | A boolean expression that determines if\
    \ the loop will or will not repeat |\n| { | An opening curly bracket |\n| statement(s)\
    \ | Statement(s) that will execute after the condition |\n| ; | Semi-colon that\
    \ completes the statement |\n| } | A closing curly bracket |\n\nFigure 4.13 –\
    \ While Loop Syntax The following is a while loop example:\n\n```java\npublic\
    \ class ControlStructures\n{\n    public static void main (String[] args)\n  \
    \  {\n        int i = 0;\n        while (i < 5)\n        {\n            System.out.println(\"\
    The variables value is \" + i);\n            i++;\n        }\n    }\n}\n```\n\n\
    ![image](d2d_images/image027.png)\nFigure 4.14 – While Loop Example\n\nProgram\
    \ Output:\nThe variables value is 0\nThe variables value is 1\nThe variables value\
    \ is 2\nThe variables value is 3\nThe variables value is 4\n\nLine five initializes\
    \ the variable `i` to \"0\". The variable will be evaluated at line seven as part\
    \ of the condition `(i < 5)` after keyword `[while](#c018.xhtml_while)`. A value\
    \ for the variable `i` is repeatedly printed via line nine while the condition\
    \ is true. Notice the [increment operator](#c025.xhtml_Operator_Increment) at\
    \ line 10. It is important to know that the while loop never stops if the [increment\
    \ operator](#c025.xhtml_Operator_Increment) is not added. Therefore, the loop\
    \ would continue indefinitely, generating an [infinite loop](#c037.xhtml_infinite_loop).\
    \ In addition, the while loop becomes indefinite if the initialization and conditional\
    \ variable are not set.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Do While Loop\n\n![image](d2d_images/chapter_title_below.png)\n\nThe do while\
    \ loop evaluates a condition at the bottom of the loop. Therefore, the loop will\
    \ execute the statement then evaluate the condition. As a result, the do while\
    \ loop always executes a statement at least one iteration and continues as long\
    \ as the condition is true. The following is the syntax for a do while loop:\n\
    \n### Syntax\n\n```java\ndo\n{\n    statement(s);\n}\nwhile (condition);\n```\n\
    \n### Syntax Details\n\n| Argument | Description |\n| :--- | :--- |\n| do | Keyword\
    \ that starts the loop |\n| { | An opening curly bracket |\n| statement(s) | Statement(s)\
    \ that will execute at least once |\n| ; | Semi-colon that completes the statement\
    \ |\n| } | A closing curly bracket |\n| while | Keyword that determines if the\
    \ loop’s condition will repeat |\n| condition | A boolean expression that determines\
    \ if the loop will or not repeat |\n| ; | Semi-colon that completes the condition\
    \ |\n\nFigure 4.15 – Do Loop Loop Details The following is a do while loop example:\n\
    \n```java\npublic class ControlStructures\n{\n    public static void main (String[]\
    \ args)\n    {\n        int i = 0;\n        do\n        {\n            System.out.println(\"\
    The variables value is \" + i);\n            i++;\n        }\n        while (i\
    \ > 5);\n    }\n}\n```\n\n![image](d2d_images/image026.png)\nFigure 4.16 – Do\
    \ While Loop Example\n\nProgram Output:\nThe variables value is 0\nThe variables\
    \ value is 1\nThe variables value is 2\nThe variables value is 3\nThe variables\
    \ value is 4\n\nLine five initializes the variable `i` to \"0\". The keyword `[do](#c018.xhtml_do)`\
    \ starts the do while loop followed by two statements surrounded by curly brackets.\
    \ A value for the variable `i` is repeatedly printed via line nine while the condition\
    \ `(i < 5)` is true. Coincidentally, the condition is evaluated after the statement\
    \ at line 12. Like the while loop, an [infinite loop](#c037.xhtml_infinite_loop)\
    \ would have occurred if the [increment operator (++)](#c025.xhtml_Operator_Increment)\
    \ was not added at line 10. Also, the initialization and conditional values can\
    \ create an [infinite loop](#c037.xhtml_infinite_loop) if not set correctly. In\
    \ this example, the statements were repeated multiple iterations because the condition\
    \ started with a true result. The following shows what happens when the condition\
    \ starts with a false result:\n\n```java\npublic class ControlStructures\n{\n\
    \    public static void main (String[] args)\n    {\n        int i = 0;\n    \
    \    do\n        {\n            System.out.println(\"The variables value is \"\
    \ + i);\n            i++;\n        }\n        while (i > 5);\n    }\n}\n```\n\n\
    ![image](d2d_images/image001.png)\nFigure 4.17 – Do While Loop Example (Start\
    \ With False Condition)\n\nProgram Output:\nThe variables value is 0\n\nLine five\
    \ initializes the variable `i` to \"0\". Therefore, the condition `(i > 5)` at\
    \ line 12 is false due to zero being less than five. The do while loop executed\
    \ the statement because statements are executed first, then the condition is evaluated.\n\
    \nNote: The loops ([for](#c037.xhtml_For_Loop), [while](#c038.xhtml_While_Loop),\
    \ and [do while](#c039.xhtml_Do_While_Loop)) are similar in functionality. A rule\
    \ of thumb to use when deciding which loop to implement is:\n\n*   Implement a\
    \ [for loop](#c037.xhtml_For_Loop) when executing a specific number of iterations\n\
    *   Implement a [while loop](#c038.xhtml_While_Loop) when the loop will repeat\
    \ an uncertain number of iterations\n*   Implement a [do while loop](#c039.xhtml_Do_While_Loop)\
    \ when a loop needs to be executed at least one iteration\n\n# Break To Exit\n"
