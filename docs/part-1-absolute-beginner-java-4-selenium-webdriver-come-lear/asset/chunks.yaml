  trans: "\n\nJava 允许在程序的任何位置声明变量。因此，变量可以定义在类内部、方法内部，或者作为方法的参数定义。变量的作用域与该变量在程序中声明的位置有关。生命周期是指变量在程序中存在的时间。以下是四种具有独立作用域和生命周期的变量：\n\
    \n1. [局部变量]\n2. [参数变量]\n3. [实例变量]\n4. [类变量]\n\n## 局部变量\n\n局部变量声明在 `method` 内部。不同的\
    \ `methods` 可以与程序中的其他方法具有相同的 `variable name`（变量名）。局部变量在其所属的 `method` 内部可见。因此，每个变量对于特定的\
    \ `method` 都是唯一的。在使用局部变量之前，必须对其声明并初始化一个值，不需要特殊的关键字。因此，局部变量没有默认值。局部变量在 `method`\
    \ 构建时创建，在 `method` 时销毁。以下是一个局部变量示例：\n\n```java\npublic class VariableExample {\n\
    \    public void AutomationEngineers () {\n        int yearsEmployed;\n      \
    \  yearsEmployed = 5;\n        System.out.println(\"Joe Doe 'Automation' has been\
    \ at the organization \" + yearsEmployed + \" years\");\n    }\n\n    public void\
    \ Developers () {\n        int yearsEmployed;\n        yearsEmployed = 3;\n  \
    \      System.out.println(\"Jane Doe 'Dev' has been at the organization \" + yearsEmployed\
    \ + \" years\");\n    }\n\n    public static void main(String[] args) {\n    \
    \    VariableExample years = new VariableExample ();\n        years.AutomationEngineers();\n\
    \        years.Developers();\n    }\n}\n```\n\n![image](img/image060.png)\n图 2.8\
    \ – 局部变量\n\n程序输出：\nJoe Doe 'Automation' has been at the organization 5 years\n\
    Jane Doe 'Dev' has been at the organization 3 years\n\n第五行和十三行显示了变量 `yearsEmployed`，它是方法\
    \ `AutomationEngineers` 和 `Developers` 的局部变量。不会发生错误，因为每个变量对于其 `method` 都是唯一的。然而，在同一个\
    \ `method` 内不能多次声明相同的 `variable name`。局部变量的作用域和生命周期限于其声明所在的块/大括号内。\n\n## 参数变量\n\
    \n参数变量被声明并传递到 `methods` 中。在声明参数变量后，它的实现方式类似于 `local variable`（局部变量）。因此，`local\
    \ variable` 和参数变量不能同名。参数变量不需要关键字。但是，在 `method` 名称之后，`data type` 和 `variable name`\
    \ 必须括在括号内。以下是一个参数变量示例：\n\n```java\npublic class VariableExample {\n    public\
    \ void setMtgAmount (double mtgAmount) {\n        System.out.println(\"The mortgage\
    \ payment amount is \" + mtgAmount);\n    }\n\n    public static void main(String[]\
    \ args) {\n        VariableExample payment = new VariableExample ();\n       \
    \ payment.setMtgAmount(99000);\n    }\n}\n```\n\n![image](img/image028.png)\n\
    图 2.9 – 参数变量\n\n程序输出：\nThe mortgage payment amount is 99000.0\n\n第三行和第八行将参数变量\
    \ `double mtgAmount` 和 `String[] args` 传递到方法 `setMtgAmount` 和 `main`。值 `99000`\
    \ 从第 11 行的方法调用 `payment.setMtgAmount` 传递到被调用的第三行方法 `setMtgAmount`。参数变量的作用域是括号内的方法头，而生命周期是大括号内的方法体。\n\
    \n## 实例变量\n\n实例变量声明在 `class` 内部、`method` 外部，并且可以在创建 `object` 后可选地访问。实例变量的值对于每个\
    \ `object` 都是唯一的。实例变量可以在初始化之前或之后声明，并且对 `class` 中的所有 `methods` 可见。数字类型的默认值为 0，`boolean`\
    \ 类型的默认值为 false。以下是实例变量示例：\n\n```java\npublic class VariableExample {\n    int\
    \ yearsExist = 34;\n\n    public static void main(String[] args) {\n        VariableExample\
    \ years = new VariableExample();\n        System.out.println(\"This organization\
    \ has existed for \" + years.yearsExist + \" years\");\n    }\n}\n```\n\n![image](img/image032.png)\n\
    图 2.10 – 实例变量\n\n程序输出：\nThis organization has existed for 34 years\n\n第三行在 `class`\
    \ 内部、`method main` 外部声明了实例变量 `yearsExist`。第八行打印变量 `years.yearsExist`。\n\n## 类变量\n\
    \n类变量（称为静态变量）声明在 `class` 内部，但不在 `method` 内部。关键字 `static` 通知 `compiler`（编译器）特定变量只存在一份，但它被所有\
    \ `object` 实例共享。数字类型的默认值为 0，`boolean` 的默认值为 false。类变量在程序开始时创建，在程序结束时销毁。以下是一个类变量示例：\n\
    \n```java\npublic class VariableExample {\n    static int numDays = 30;\n\n  \
    \  public static void main(String[] args) {\n        VariableExample days = new\
    \ VariableExample ();\n        System.out.println(\"Java can be mastered in \"\
    \ + VariableExample.numDays + \" days\");\n        System.out.println(\"Selenium\
    \ can be mastered in \" + days.numDays + \" days\");\n        System.out.println(\"\
    Do you think you can master Java/Selenium in \" + numDays + \" days\");\n    }\n\
    }\n```\n\n![image](img/image062.png)\n图 2.11 – 类变量\n\n程序输出：\nJava can be mastered\
    \ in 30 days\nSelenium can be mastered in 30 days\nDo you think you can master\
    \ Java/Selenium in 30 days\n\n第三行使用关键字 `static` 在 `class` 内部声明了类变量 `numDays`。第八行、第九行和十行分别通过\
    \ `ClassName.ClassVariable` (`VariableExample.numDays`)、`ObjectReference.ClassVariable`\
    \ (`days.numDays`) 以及 `ClassVariableName` (`numDays`) 访问类变量。\n\n"
- fmt: "\nThe primitive data types give an account for the type of data that is stored\
    \ in a variable. Each `data type`(#c017.xhtml_Data_Type) has a precise range and\
    \ behavior. Consequently, a `data type`(#c017.xhtml_Data_Type) of `int`(#c022.xhtml_int)\
    \ can store numerical data, but a type mismatch error will occur if `boolean`(#c022.xhtml_boolean)\
    \ attempts to store numerical data. In addition, certain operations are permitted\
    \ on values depending on the `data type`(#c017.xhtml_Data_Type). As an example,\
    \ a math calculation cannot be performed on a `boolean`(#c022.xhtml_boolean) data\
    \ type because a `boolean`(#c022.xhtml_boolean) cannot contain numbers. The following\
    \ is a list of all eight primitive data types:\n\n| Type | Width in Bits (Bytes)\
    \ | Description/Range |\n| :--- | :--- | :--- |\n| boolean | | True or False values\
    \ |\n| byte | 8-bit (1-byte) | -128 to 127 |\n| char | 16-bit | Standard character\
    \ set that can be a letter, control character, number, punctuation, or symbol\
    \ representing all languages in the world |\n| double | 64-bit (8-byte) | -1.7976931348623157E+308\
    \ to 1.7976931348623157E+308 |\n| float | 32-bit (4-byte) | -3.4028235E+38 to\
    \ 3.4028235E+38 |\n| int | 32-bit (4-byte) | −2,147,483,648 to 2,147,483,647 |\n\
    | long | 64-bit (8-byte) | -9,223,372,036,854,775,808 to 9,223,372,036,854,755,807\
    \ |\n| short | 16-bit (2-byte) | -32,768 to 32,767 |\n\nFigure 2.12 – Eight Primitive\
    \ Data Types\n\nThe following divides the primitive data types into 4 categories:\n\
    \n1. `Integer Type`(#c022.xhtml__Integer_Type)\n2. `Floating Point Type`(#c022.xhtml__Floating_Point_Type_2)\n\
    3. `Character Type`(#c022.xhtml__Character_Type_1)\n4. `Boolean Type`(#c022.xhtml__Boolean_Type_1)\n\
    \n## Integer Type\n\nThe integer type supports numerical values without a fractional\
    \ component. A major difference within the integer type is the range of values.\
    \ The following show each data type for integer type:\n\n* `byte`(#c022.xhtml_byte)\n\
    * `short`(#c022.xhtml_short)\n* `int`(#c022.xhtml_int)\n* `long`(#c022.xhtml_long)\n\
    \nData type `int`(#c022.xhtml_int) is used the most because it is used for controlling\
    \ loops and indexing arrays. The following is an `int`(#c022.xhtml_int) data type\
    \ example:\n\n```java\npublic class VariableExample\n{\n    public static void\
    \ main(String[] args) {\n        //Calculate 2 integer values\n        int i,\
    \ j;\n        int total;\n        i = 10;\n        j = 20;\n        total = i\
    \ + j;\n        System.out.println (\"Total of i + j is \" + total);\n    }\n\
    }\n```\n\n![image](d2d_images/image022.png)\nFigure 2.13 – Data Type int\n\nProgram\
    \ Output:\nTotal of i + j is 30\n\nLines six and seven declare an `int`(#c022.xhtml_int)\
    \ data type for names “i,” “j,” and “total.” Lines nine, ten, and eleven initialize\
    \ the variables.\n\n## Floating Point Type\n\nThe floating point type supports\
    \ numerical values with a fractional component. Data types `float`(#c022.xhtml_float)\
    \ and `double`(#c022.xhtml_double) make up the floating point type category. Due\
    \ to Java’s standard `Math` class, the `double`(#c022.xhtml_double) data type\
    \ is used the most when a numerical value includes a fraction. The following is\
    \ a `double`(#c022.xhtml_double) data type example:\n\n```java\npublic class VariableExample\n\
    {\n    public static void main(String[] args) {\n        double d;\n        double\
    \ calc;\n        d = 200;\n        calc = Math.sqrt (d);\n        System.out.println\
    \ (\"Square root of 200 is \" + calc);\n    }\n}\n```\n\n![image](d2d_images/image039.png)\n\
    Figure 2.14 – Data Type double\n\nProgram Output:\nSquare root of 200 is 14.142135623730951\n\
    \nLines five and six declare a `double`(#c022.xhtml_double) data type for names\
    \ “d” and “calc.” Line eight assigns 200 to variable “d”, while line nine assigns\
    \ a square root method to `calc`.\n\n## Character Type\n\nThe character type has\
    \ a range of 0 to 65535. The `char` data type supports Unicode. The following\
    \ is a `char` data type example:\n\n```java\npublic class VariableExample\n{\n\
    \    public static void main(String[] args) {\n        char cha1, cha2;\n    \
    \    cha1 = 'C';\n        cha2 = 67;\n        System.out.println(\"Value assigned\
    \ to cha1 is \" + cha1);\n        System.out.println(cha2);\n    }\n}\n```\n\n\
    ![image](d2d_images/image025.png)\nFigure 2.15 – Data Type char\n\nProgram Output:\n\
    Value assigned to cha1 is C\n67\n\nLines five and seven declare a `char` data\
    \ type for “cha1”.\n\n## Boolean Type\n\nThe `boolean` type supports a program\
    \ when the program involves logic. The following is a `boolean` data type example:\n\
    \n```java\npublic class VariableExample\n{\n    public static void main(String[]\
    \ args) {\n        boolean result;\n        result = false;\n        System.out.println(\"\
    Boolean variable was initialized to \" + result);\n        System.out.println(\"\
    Is 100 greater than 99? \" + (100>99));\n    }\n}\n```\n\n![image](d2d_images/image066.png)\n\
    Figure 2.16 – Data Type boolean\n\nProgram Output:\nBoolean variable was initialized\
    \ to false\nIs 100 greater than 99? true\n\nLines five and seven declare a `boolean`\
    \ data type for “result.” Line seven initializes false to the variable. Line nine\
    \ prints the default value of false, but line ten return a true value after evaluating\
    \ condition `100>99`.\n"
  raw: 'The primitive data types give an account for the type of data that is stored
    in a variable. Each [data type](#c017.xhtml_Data_Type) has a precise range and
    behavior. Consequently, a [data type](#c017.xhtml_Data_Type) of [int](#c022.xhtml_int)
    can store numerical data, but a type mismatch error will occur if [boolean](#c022.xhtml_boolean)
    attempts to store numerical data. In addition, certain operations are permitted
    on values depending on the [data type](#c017.xhtml_Data_Type). As an example,
    a math calculation cannot be performed on a [boolean](#c022.xhtml_boolean) data
    type because a [boolean](#c022.xhtml_boolean) cannot contain numbers. The following
    is a list of all eight primitive data types:


    | Type | Width in Bits (Bytes) | Description/Range |


    | boolean |  | True or False values |


    | byte | 8-bit (1-byte) | -128 to 127 |


    | char | 16-bit | Standard character set that can be a letter, control character,
    number, punctuation, or symbol representing all languages in the world |


    | double | 64-bit (8-byte) | -1.7976931348623157E+308 to 1.7976931348623157E+308
    |


    | float | 32-bit (4-byte) | -3.4028235E+38 to 3.4028235E+38 |


    | int | 32-bit (4-byte) | −2,147,483,648 to 2,147,483,647 |


    | long | 64-bit (8-byte) | -9,223,372,036,854,775,808 to 9,223,372,036,854,755,807
    |


    | short | 16-bit (2-byte) | -32,768 to 32,767 |


    Figure 2.12 – Eight Primitive Data Types


    The following divides the primitive data types into 4 categories:


    1.  [Integer Type](#c022.xhtml__Integer_Type)


    2.  [Floating Point Type](#c022.xhtml__Floating_Point_Type_2)


    3.  [Character Type](#c022.xhtml__Character_Type_1)


    4.  [Boolean Type](#c022.xhtml__Boolean_Type_1)


    ## Integer Type


    The integer type supports numerical values without a fractional component. A major
    difference within the integer type is the range of values. The following show
    each data type for integer type:


    *   [byte](#c022.xhtml_byte) 


    *   [short](#c022.xhtml_short)


    *   [int](#c022.xhtml_int)


    *   [long](#c022.xhtml_long)


    Data type [int](#c022.xhtml_int) is used the most because it is used for controlling
    loops and indexing arrays. The following is an [int](#c022.xhtml_int) data type
    example:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    //Calculate 2 integer values


    int i, j;


    int total;


    i = 10;


    j = 20;


    total = i + j;


    System.out.println ("Total of i + j is " + total);


    } 


    }


    ![image](d2d_images/image022.png)


    Figure 2.13 – Data Type int


    Program Output:


    Total of i + j is 30


    Lines six and seven declare an [int](#c022.xhtml_int) data type for names “i,”
    “j,” and “total.” Lines nine, ten, and eleven initialize the variables.


    ## Floating Point Type


    The floating point type supports numerical values with a fractional component.
    Data types [float](#c022.xhtml_float) and [double](#c022.xhtml_double) make up
    the floating point type category. Due to Java’s standard Math class, the [double](#c022.xhtml_double)
    data type is used the most when a numerical value includes a fraction. The following
    is a [double](#c022.xhtml_double) data type example:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    double d;


    double calc;


    d = 200;


    calc = Math.sqrt (d);


    System.out.println ("Square root of 200 is " + calc); 


    } 


    }


    ![image](d2d_images/image039.png)Figure 2.14 – Data Type double


    Program Output:


    Square root of 200 is 14.142135623730951


    Lines five and six declare a [double](#c022.xhtml_double) data type for names
    “d” and “calc.” Line eight assigns 200 to variable “d”, while line nine assigns
    a square root method to variable “calc.” The “sqrt ()” method is a [method](#c015.xhtml_A_method)
    within the standard Math class which returns a [double](#c022.xhtml_double) data
    type.


    ## Character Type


    The character type supports a Unicode system that displays all characters for
    every human language. In order to represent all characters, the [char](#c022.xhtml_char)
    data type holds a 16-bit type that has a range of 0 to 65,535\. The range helps
    Unicode assign every letter, number, and symbol an exclusive numerical value.
    The following is a [char](#c022.xhtml_char) data type example:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    char cha1, cha2;


    cha1 = ''C'';


    cha2 = 67;


    System.out.println("Value assigned to cha1 is " + cha1);


    System.out.println("67 is the Unicode for " + cha2); 


    } 


    }


    ![image](d2d_images/image025.png)Figure 2.15 – Data Type char


    Program Output:


    Value assigned to cha1 is C


    67 is the Unicode for C


    Line five declares a [char](#c022.xhtml_char) data type for names “cha1” and “cha2.”
    Lines seven assigns the letter ‘C’, utilizing single quotes while line eight assigns
    a value of 67\. [Constants](#c023.xhtml__Constants_1) such as line seven declared
    with a [char](#c022.xhtml_char) data type always use a single quote (‘) for a
    letter. Value 67 is the American Standard Code for Information Interchange (ASCII)
    for the letter ‘C’.


    Note: According to [webopedia](http://www.webopedia.com/TERM/A/ASCII.html), “ASCII
    is a code for representing English characters as numbers, with each letter assigned
    a number from 0 to 127”.


    ## Boolean Type


    The boolean type supports a program when the program involves logic. Thus, the
    [boolean](#c022.xhtml_boolean) data type returns a value after evaluating a logical/conditional
    statement. Conditional statements require an answer (true or false) regarding
    a specific statement. A conditional statement consists of variables and/or expressions.
    The following is a [boolean](#c022.xhtml_boolean) data type example:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    boolean result;


    result = false;


    System.out.println("Boolean variable ''result'' was initialized to " + result);


    System.out.println("Is this a true or false statement ''100 greater than 99''?
    " + (100>99));  


    } 


    }


    ![image](d2d_images/image066.png)Figure 2.16 – Data Type boolean


    Program Output:


    Boolean variable ''result'' was initialized to false


    Is this a true or false statement ''100 greater than 99''? true


    Line five declares a [boolean](#c022.xhtml_boolean) data type for variable “result.”
    Line seven initializes false to the variable. Line nine prints the default value
    of false, but line ten return a true value after evaluating condition “100>99.”
    True is returned because 100 is greater than 99.


