    What is the value of x? \" + x);\n    y = (x == 5) ? 7 : 1;\n    System.out.println(\"\
    x equals 5 so the boolean expression is true: Value is \" + y);\n    y = (x ==\
    \ 3) ? 7 : 1;\n    System.out.println(\"x does not equal 3 so the boolean expression\
    \ is false: Value is \" + y);\n  }\n}\n```\n\n图 3.13 – 三元运算符示例\n\n程序输出：\nWhat\
