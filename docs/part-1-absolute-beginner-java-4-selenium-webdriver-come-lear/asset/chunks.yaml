    \n# 赋值运算符\n\n![image](img/chapter_title_below.png)\n\n赋值运算符（=`）位于变量和值之间。其目的是为变量赋值。因此，右侧的值被传输到左侧的变量名中。以下是赋值运算符的语法：\n\
    \n### 语法\n\n```\nvariableName = expression;\n```\n\n### 语法细节\n\n| 参数 | 描述 |\n\
