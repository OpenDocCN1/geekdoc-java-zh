- fmt: "\nA variable is a memory location with a name that contains a value (see [Variables\
    \ and Data Types in Chapter 2](#c017.xhtml_Chapter_2)). In order to use the variable,\
    \ it must be declared and initialized. Declaring a variable is stating clearly\
    \ that a variable exists by providing a data type and variable name. Data type\
    \ refers to the type of data that can be stored in a variable while variable name\
    \ identifies the variable. In Java, there are two kinds of data types: [primitive](#c022.xhtml__Primitive_Data_Types_1)\
    \ and reference. [Primitive data type](#c022.xhtml__Primitive_Data_Types_1) supports\
    \ [eight basic data types](#c022.xhtml_Eight_Primitive_Data_Types) and reference\
    \ data type is based on a [class](#c018.xhtml_class). Initializing a variable\
    \ is when the variable is assigned a value that can change during program execution.\
    \ The following is a variable declaration and initialization example:\n\n```java\n\
    public class Declare_Initialize_Variable\n{\n    public static void main(String[]\
    \ args)\n    {\n        int sum;\n        sum = 3 + 4;\n        System.out.println(\"\
    What is the sum of 3 + 4? \" + sum);\n    }\n}\n```\n\n![image](d2d_images/image042.png)\n\
    Figure 1.2 – Variable Declaration and Initialization\n\nProgram Output:\nWhat\
    \ is the sum of 3 + 4? 7\n\nLine five declares the variable with a data type `[int](#c022.xhtml_int)`\
    \ and variable name `sum` while line seven initializes `3 + 4` to the variable\
    \ `sum`. In Java, all variables possess a data type, variable name, and value.\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Operators\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nOperators are symbols such as plus (`+`) and minus (`-`) that perform mathematical\
    \ operations (see [Operators in Chapter 3](#c024.xhtml_Chapter_3)). The operators\
    \ are executed on [operands](#c024.xhtml_operand) which is anything that can be\
    \ changed. A variable is a common [operand](#c024.xhtml_operand) which changes\
    \ during execution. In Java, there are four types of operators:\n\n1. [Arithmetic](#c025.xhtml__Arithmetic_Operators_1)\
    \ – implement mathematical operations on numerical values\n2. [Bitwise](#c026.xhtml__Bitwise_Operators_1)\
    \ – work on operands utilizing bits\n3. [Logical](#c027.xhtml__Logical_Operators_3)\
    \ – returns a boolean value (true or false) based on one or more expressions\n\
    4. [Relational](#c028.xhtml__Relational_Operators_1) – returns a boolean value\
    \ (true or false) after comparing operands\n\nThe following is an Arithmetic Operator\
    \ example:\n\n```java\npublic class Subtraction_Operator\n{\n    public static\
    \ void main(String[] args)\n    {\n        // Subtraction Operator\n        int\
    \ x, y, answer;\n        x = 100;\n        y = 80;\n        answer = x - y;\n\
    \        System.out.println(\"What is 100 - 80? \" + answer);  \n    }\n}\n```\n\
    \n![image](d2d_images/image056.png)\nFigure 1.3 – Subtraction Arithmetic Operator\n\
    \nProgram Output:\nWhat is 100 - 80? 20\n\nLine seven declares the variables `x,\
    \ y, answer` with an `[int](#c022.xhtml_int)` data type. However, lines nine and\
    \ 10 assign the values (`x = 100` and `y = 80`) to two of the variables. The [`–\
    \ Subtraction](#c025.xhtml_Operator_Subtraction)` operator is implemented at line\
    \ 12 and subtracts the right [operand](#c024.xhtml_operand) `y` from the left\
    \ [operand](#c024.xhtml_operand) `x` then assigns the value `20` to variable `answer`.\
    \ \n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Control Structures\n\n\
    ![image](d2d_images/chapter_title_below.png)\n\nControl structures provide ways\
    \ to regulate the flow of a program (see [Control Structures in Chapter 4](#c034.xhtml_Chapter_4)).\
    \ The flow is directed by branches and loops. Branches allow certain statements\
    \ to be skipped after evaluating a condition or variable. Loops permit specific\
    \ statements to be repeated according to a boolean expression. The following is\
    \ a list of two branches and three loops:\n\n## Branches\n\n1. [If Branch](#c035.xhtml__If_Branch)\
    \ – executes a statement when a condition is true\n2. [Switch Branch](#c036.xhtml__Switch_Branch)\
    \ – evaluates a variable then execute a statement according to the variable’s\
    \ value\n\n## Loops\n\n1. [For Loop](#c037.xhtml__For_Loop) – executes a block\
    \ of code a certain number of iterations\n2. [While Loop](#c038.xhtml__While_Loop)\
    \ – repeats a block of code while a boolean expression is true\n3. [Do While Loop](#c039.xhtml__Do_While_Loop)\
    \ – execute a statement at least one iteration\n\nThe following is an if branch\
    \ example:\n\n```java\npublic class If_Branch\n{\n    public static void main(String[]\
    \ args)\n    {\n        // If Branch\n        boolean study;\n        study =\
    \ true;\n        if (study == true)\n        {\n            System.out.println(\"\
    You can learn Java / Selenium within 30 days\");\n        }\n        else\n  \
    \      {\n            System.out.println(\"May take longer than 30 days\");\n\
    \        }\n    }\n}\n```\n\n![image](d2d_images/image58.png)\nFigure 1.4 – If\
    \ Branch\n\nProgram Output:\nYou can learn Java / Selenium within 30 days\n\n\
    Line eight assigns variable `study` the value of `true`. As a result, the condition\
    \ `study == true` evaluates to true. Therefore, the program executes line 12 and\
    \ skips the remaining lines (14–17). If the condition was false, the program would\
    \ have executed lines 14–17.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Classes, Objects, and Methods\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nJava is an object-oriented programming (OOP) language that is structured around\
    \ objects. An object is anything that can be seen or perceived. All objects have\
    \ two characteristics: state and behavior. State identifies the object and behavior\
    \ represent the actions of the object. For example, a customer can be identified\
    \ by their name (state) while talking (behavior) is the action of the customer.\n\
    \nBoth characteristics “state and behavior” are defined by a class. A class is\
    \ a template for objects and forms the foundation for object-oriented programming.\
    \ Data and statements that operate on the data are specified by classes. In addition,\
    \ access to the data by way of classes are carried out through methods. A method\
    \ manipulates data and provide interaction with classes. The following is an example\
    \ illustrating class, object, and method:\n\n```java\nclass Customer\n{\n    String\
    \ name;\n    int age;\n\n    public static void main(String[] args)\n    {\n \
    \       Customer firstCustomer= new Customer ();\n        firstCustomer.name =\
    \ \"Joe Doe\";\n        System.out.println(\"The customer's name is \" + firstCustomer.name);\n\
    \    }\n}\n```\n\n![image](d2d_images/image30.png)\nFigure 1.5 –Class, Object,\
    \ and Method Example\n\nProgram Output:\nThe customer's name is Joe Doe\n\n* \
    \  Line one displays the keyword `[class](#c018.xhtml_class)` and class name `Customer`\n\
    *   Line six is a method `main`\n*   Line eight declares `firstCustomer` as the\
    \ variable for class type `Customer`. Keyword `[new](#c018.xhtml_new)` allocates\
    \ memory and creates a new `Customer` object.\n"
  raw: 'A variable is a memory location with a name that contains a value (see [Variables
    and Data Types in Chapter 2](#c017.xhtml_Chapter_2)). In order to use the variable,
    it must be declared and initialized. Declaring a variable is stating clearly that
    a variable exists by providing a data type and variable name. Data type refers
    to the type of data that can be stored in a variable while variable name identifies
    the variable. In Java, there are two kinds of data types: [primitive](#c022.xhtml__Primitive_Data_Types_1)
    and reference. [Primitive data type](#c022.xhtml__Primitive_Data_Types_1) supports
    [eight basic data types](#c022.xhtml_Eight_Primitive_Data_Types) and reference
    data type is based on a [class](#c018.xhtml_class). Initializing a variable is
    when the variable is assigned a value that can change during program execution.
    The following is a variable declaration and initialization example:


    public class Declare_Initialize_Variable


    {


    public static void main(String[] args)


    {


    int sum;


    sum = 3 + 4;


    System.out.println("What is the sum of 3 + 4? " + sum);


    }


    }


    ![image](d2d_images/image042.png)


    Figure 1.2 – Variable Declaration and Initialization


    Program Output:


    What is the sum of 3 + 4? 7


    Line five declares the variable with a data type “[int](#c022.xhtml_int)” and
    variable name “sum” while line seven initializes “3 + 4” to the variable “sum”.
    In Java, all variables possess a data type, variable name, and value.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Operators


    ![image](d2d_images/chapter_title_below.png)


    Operators are symbols such as plus (+) and minus (-) that perform mathematical
    operations (see [Operators in Chapter 3](#c024.xhtml_Chapter_3)). The operators
    are executed on [operands](#c024.xhtml_operand) which is anything that can be
    changed. A variable is a common [operand](#c024.xhtml_operand) which changes during
    execution. In Java, there are four types of operators:


    1.  [Arithmetic](#c025.xhtml__Arithmetic_Operators_1) – implement mathematical
    operations on numerical values


    2.  [Bitwise](#c026.xhtml__Bitwise_Operators_1) – work on operands utilizing bits


    3.  [Logical](#c027.xhtml__Logical_Operators_3) – returns a boolean value (true
    or false) based on one or more expressions


    4.  [Relational](#c028.xhtml__Relational_Operators_1) – returns a boolean value
    (true or false) after comparing operands


    The following is an Arithmetic Operator example:


    public class Subtraction_Operator


    {


    public static void main(String[] args)


    {


    // Subtraction Operator


    int x, y, answer;


    x = 100;


    y = 80;


    answer = x - y;


    System.out.println("What is 100 - 80? " + answer);  


    }


    }


    ![image](d2d_images/image056.png)


    Figure 1.3 – Subtraction Arithmetic Operator


    Program Output:


    What is 100 - 80? 20


    Line seven declares the variables “x, y, answer” with an [int](#c022.xhtml_int)
    data type. However, lines nine and 10 assign the values (x = 100 and y = 80) to
    two of the variables. The [– Subtraction](#c025.xhtml_Operator_Subtraction) operator
    is implemented at line 12 and subtracts the right [operand](#c024.xhtml_operand)
    “y” from the left [operand](#c024.xhtml_operand) “x” then assigns the value “20”
    to variable “answer”. 


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Control Structures


    ![image](d2d_images/chapter_title_below.png)


    Control structures provide ways to regulate the flow of a program (see [Control
    Structures in Chapter 4](#c034.xhtml_Chapter_4)). The flow is directed by branches
    and loops. Branches allow certain statements to be skipped after evaluating a
    condition or variable. Loops permit specific statements to be repeated according
    to a boolean expression. The following is a list of two branches and three loops:


    ## Branches


    1.  [If Branch](#c035.xhtml__If_Branch) – executes a statement when a condition
    is true


    2.  [Switch Branch](#c036.xhtml__Switch_Branch) – evaluates a variable then execute
    a statement according to the variable’s value


    ## Loops


    1.  [For Loop](#c037.xhtml__For_Loop) – executes a block of code a certain number
    of iterations


    2.  [While Loop](#c038.xhtml__While_Loop) – repeats a statement while a boolean
    expression is true


    3.  [Do While Loop](#c039.xhtml__Do_While_Loop) – execute a statement at least
    one iteration and continue while the boolean expression is true


    The following is an if branch example:


    public class If_Branch


    {


    public static void main(String[] args)


    {


    // If Branch


    boolean study;


    study = true;


    if (study == true)


    {


    System.out.println("You can learn Java / Selenium within 30 days");


    }


    else


    {


    System.out.println("May take a little longer than 30 days but remain patient");


    }


    }


    }


    ![image](d2d_images/image058.png)


    Figure 1.4 – If Branch Example


    Program Output:


    You can learn Java / Selenium within 30 days


    Line eight assigns variable "study” the value of true. As a result, the condition
    “if (study == true)” evaluates to true. Therefore, the program executes line 12
    and skip the remaining lines (line 14 – 17). On the other hand, the program would
    have executed lines 14 – 17 and skipped lines 11 – 13 if the condition was false.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Classes, Objects, and Methods


    ![image](d2d_images/chapter_title_below.png)


    Java is an object-oriented programming (OOP) language that is structured around
    objects. An object is anything that can be seen or perceived. All objects have
    two characteristics: state and behavior. State identifies the object and behavior
    represent the actions of the object. For example, a customer can be identified
    by their name (state) while talking (behavior) is the action of the customer.


    Both characteristics “state and behavior” are defined by a class. A class is a
    template for objects and forms the foundation for object-oriented programming.
    Data and statements that operate on the data are specified by classes. In addition,
    access to the data by way of classes are carried out through methods. A method
    manipulates data and provide interaction with classes from other components of
    the program. The following is an example illustrating a class, object, and method:


    class Customer


    {


    String name;


    int age;


    public static void main(String[] args)


    {


    Customer firstCustomer= new Customer ();


    firstCustomer.name = "Joe Doe";


    System.out.println("The customer''s name is " + firstCustomer.name);


    }


    } 


    ![image](d2d_images/image030.png)


    Figure 1.5 –Class, Object, and Method Example


    Program Output:


    The customer''s name is Joe Doe


    *   Line one displays the keyword “[class](#c018.xhtml_class)” and class name
    “Customer”


    *   Line six is a method labeled main


    *   Line eight declares firstCustomer as the variable for class type “Customer”.
    Keyword “[new](#c018.xhtml_new)” allocates memory and creates a new Customer object


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Installations


    ![image](d2d_images/chapter_title_below.png)


    ## Install Java Development Kit (JDK)


    The Java Development Kit (JDK) is a software development environment used for
    writing code in Java. JDK includes many required components for creating and testing
    applications. Some of the components are Java Runtime Environment (JRE), Java
    Compiler, Java Interpreter, and Java Archiver (JAR).


    ●  Java Runtime Environment (JRE) – provides the requirements to execute code
    in a web browser


    ●  Java Compiler – primary program that reads class definitions then compiles
    it into bytecode class files'
