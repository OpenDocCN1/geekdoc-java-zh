    # Expressions


    ![image](d2d_images/chapter_title_below.png)


    [Operators](#c024.xhtml_Operators), [variables](#c017.xhtml_A_variable), [constants](#c023.xhtml__Constants_1),
    and [methods](#c015.xhtml_A_method) (calls and returns) are components of an expression.
    A component joined with an [operator](#c024.xhtml_Operators) forms an expression.
    It is possible to create a compound expression by combining multiple expressions.
    However, the [data types](#c017.xhtml_Data_Type) must be compatible to construct
    a valid compound expression. For example, an [int](#c022.xhtml_int) data type
    can be mixed with a [long](#c022.xhtml_long) data type because both are numeric.


    Through the use of type promotion rules, the mixture of [data types](#c017.xhtml_Data_Type)
    is converted to the same [data type](#c017.xhtml_Data_Type). Values that are returned
    from an expression depend on the [data type](#c017.xhtml_Data_Type). Data types
    [char](#c022.xhtml_char), [byte](#c022.xhtml_byte), and [short](#c022.xhtml_short)
    are advanced to [int](#c022.xhtml_int). An expression is promoted to [long](#c022.xhtml_long)
    if one of the [operands](#c024.xhtml_operand) is a [long](#c022.xhtml_long) data
    type. The same goes for [float](#c022.xhtml_float) data types, if one of the [operands](#c024.xhtml_operand)
    is a [float](#c022.xhtml_float) then the whole expression is a [float](#c022.xhtml_float).
    Likewise, an expression is promoted to a [double](#c022.xhtml_double) data type
    if one of the [operands](#c024.xhtml_operand) is a [double](#c022.xhtml_double).
    The following is an expression example with mix data types [byte](#c022.xhtml_byte)
    and [float](#c022.xhtml_float):


    public class Operators


    {  


    public static void main (String[] args)


    {


    byte b = 7;


    float f = 34.56f;


    float total = (b * f);


    System.out.println("The total of byte ''b'' times float ''f'' (7 * 34.56) is:
    " + total);


    }


    }


    ![image](d2d_images/image044.png)


    Figure 3.19 – Expression Example


    Program Output:


    The total of byte ''b'' times float ''f'' (7 * 34.56) is: 241.92001


    Line five declares and assigns a [byte](#c022.xhtml_byte) data type while line
    seven declares and assigns a [float](#c022.xhtml_float) data type. On line eight,
    the [*  (Multiplication)](#c025.xhtml_Operator_Multiplication) operator multiplies
    both data types ([byte](#c022.xhtml_byte) and [float](#c022.xhtml_float)) even
    though the types are mixed. However, the expression is promoted as a [float](#c022.xhtml_float)
    since one of the [operands](#c024.xhtml_operand) is a [float](#c022.xhtml_float).


    Chapter 3 gave an account for the four types of Java operators: [Arithmetic](#c025.xhtml__Arithmetic_Operators_1),
    [Bitwise](#c026.xhtml__Bitwise_Operators_1), [Logical](#c027.xhtml__Logical_Operators_3),
    and [Relational](#c028.xhtml__Relational_Operators_1). The [Assignment Operator](#c029.xhtml__Assignment_Operator_1)
    and [Ternary Operator](#c030.xhtml__Ternary_Operator_1) were examined along with
    rankings of each [operator](#c024.xhtml_Operators). Chapter 4 will explain the
    two types of control structures: branches and loops. There are two types of branches:
    the [if branch](#c035.xhtml__If_Branch) and the [switch branch](#c036.xhtml__Switch_Branch).
    There are three types of loops: [for loop](#c037.xhtml__For_Loop), [while loop](#c038.xhtml__While_Loop),
    and [do while loop](#c039.xhtml__Do_While_Loop).


