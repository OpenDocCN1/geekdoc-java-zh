  trans: "\n\n原始数据类型说明了变量中存储的数据类型。每种 `data type`(#c017.xhtml_Data_Type) 都有精确的范围和行为。因此，`int`(#c022.xhtml_int)\
    \ `data type` 可以存储数值数据，但如果尝试让 `boolean`(#c022.xhtml_boolean) 存储数值数据，就会发生类型不匹配错误。此外，根据\
    \ `data type`(#c017.xhtml_Data_Type)，允许对值进行某些操作。例如，不能在 `boolean`(#c022.xhtml_boolean)\
    \ 数据类型上执行数学计算，因为 `boolean` 不能包含数字。以下是所有八种原始数据类型的列表：\n\n| 类型 | 宽度（位/字节） | 描述/范围\
    \ |\n| :--- | :--- | :--- |\n| boolean | | 真或假（True or False） |\n| byte | 8 位（1\
    \ 字节） | -128 到 127 |\n| char | 16 位 | 标准字符集，可以是字母、控制字符、数字、标点或代表世界上所有语言的符号 |\n\
    | double | 64 位（8 字节） | -1.7976931348623157E+308 到 1.7976931348623157E+308 |\n\
    | float | 32 位（4 字节） | -3.4028235E+38 到 3.4028235E+38 |\n| int | 32 位（4 字节） |\
    \ −2,147,483,648 到 2,147,483,647 |\n| long | 64 位（8 字节） | -9,223,372,036,854,775,808\
    \ 到 9,223,372,036,854,755,807 |\n| short | 16 位（2 字节） | -32,768 到 32,767 |\n\n\
    图 2.12 – 八种原始数据类型\n\n以下将原始数据类型划分为 4 类：\n\n1. `Integer Type`(#c022.xhtml__Integer_Type)\n\
    2. `Floating Point Type`(#c022.xhtml__Floating_Point_Type_2)\n3. `Character Type`(#c022.xhtml__Character_Type_1)\n\
    4. `Boolean Type`(#c022.xhtml__Boolean_Type_1)\n\n## 整数类型\n\n整数类型支持没有小数部分的数值。整数类型内部的主要区别是值的范围。以下显示了整数类型的每种数据类型：\n\
    \n* `byte`(#c022.xhtml_byte)\n* `short`(#c022.xhtml_short)\n* `int`(#c022.xhtml_int)\n\
    * `long`(#c022.xhtml_long)\n\n`int`(#c022.xhtml_int) 数据类型最常用，因为它用于控制循环和数组索引。以下是一个\
    \ `int`(#c022.xhtml_int) 数据类型的示例：\n\n```java\npublic class VariableExample\n{\n\
    \    public static void main(String[] args) {\n        //Calculate 2 integer values\n\
    \        int i, j;\n        int total;\n        i = 10;\n        j = 20;\n   \
    \     total = i + j;\n        System.out.println (\"Total of i + j is \" + total);\n\
    \    }\n}\n```\n\n![image](img/image022.png)\n图 2.13 – 数据类型 int\n\n程序输出：\nTotal\
    \ of i + j is 30\n\n第六行和第七行为名为“i”、“j”和“total”的变量声明了 `int`(#c022.xhtml_int) 数据类型。第九、十和一行初始化了变量。\n\
    \n## 浮点类型\n\n浮点类型支持带有小数部分的数值。`float`(#c022.xhtml_float) 和 `double`(#c022.xhtml_double)\
    \ 数据类型构成了浮点类型。由于 Java 标准 `Math` 类的存在，当数值包含小数时，`double`(#c022.xhtml_double) 数据类型最常用。以下是一个\
    \ `double`(#c022.xhtml_double) 数据类型的示例：\n\n```java\npublic class VariableExample\n\
    {\n    public static void main(String[] args) {\n        double d;\n        double\
    \ calc;\n        d = 200;\n        calc = Math.sqrt (d);\n        System.out.println\
    \ (\"Square root of 200 is \" + calc);\n    }\n}\n```\n\n![image](img/image039.png)\n\
