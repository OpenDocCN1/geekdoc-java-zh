  trans: "\n\n`break` (#c018.xhtml_break) 关键字是可选的，用于强制退出分支或循环。如果在嵌套分支或循环中发生 break，则最内层的分支或循环将停止。然而，执行程序将从紧随当前分支或循环的语句处恢复。以下是一个使用图\
    \ 4.8 关键字示例。\n\n```java\npublic class ControlStructures\n{\n    public static\
    \ void main (String[] args)\n    {\n        int day = 6;\n        switch (day)\n\
    \        {\n            case 1:\n                System.out.println(\"Sunday is\
    \ the 1st day of the week\");\n                break;\n            case 2:\n \
    \               System.out.println(\"Monday is the 2nd day of the week\");\n \
    \               break;\n            case 3:\n                System.out.println(\"\
    Tuesday is the 3rd day of the week\");\n                break;\n            case\
    \ 4:\n                System.out.println(\"Wednesday is the 4th day of the week\"\
    );\n                break;\n            case 5:\n                System.out.println(\"\
    Thursday is the 5th day of the week\");\n                break;\n            case\
    \ 6:\n                System.out.println(\"Friday is the 6th day of the week\"\
    );\n                break;\n            case 7:\n                System.out.println(\"\
    Saturday is the 7th day of the week\");\n                break;\n            default:\n\
    \                System.out.println(\"Not valid: There are only 7 days in a week\"\
    );\n        }\n    }\n}\n```\n\n![image](img/image034.png)图 4.18 – Break 关键字示例\n\
    \n在此示例中，`break` (#c018.xhtml_break) 关键字用于在找到匹配项时退出 case。第 24 行的 case 六 发生了匹配。`break`\
    \ (#c018.xhtml_break) 关键字防止了 case 七（第 27 行）和 default（第 30 行）的执行。\n\n注意：分支或循环中可以出现多个\
    \ `break` (#c018.xhtml_break) 关键字。每个 case 都有一个 `break` (#c018.xhtml_break) 关键字。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 继续下一个语句\n\n![image](img/chapter_title_below.png)\n\
    \n`continue` (#c018.xhtml_continue) 关键字强制停止当前的循环迭代并立即执行下一次循环迭代。结果是间隔之间的条件和语句被跳过。以下是一个使用\
    \ `continue` (#c018.xhtml_continue) 关键字跳过所有奇数的示例：\n\n```java\npublic class ControlStructures\n\
    {\n    public static void main (String[] args)\n    {\n        for (int x = 2;\
    \ x <= 10; x++ )\n        {\n            if (x % 2 != 0) continue;\n         \
    \   System.out.println(\"Even numbers \" + x);\n        }    \n    }\n}\n```\n\
    \n![image](img/image000.png)图 4.19 – Continue 关键字\n\n程序输出：\nEven numbers 2\nEven\
    \ numbers 4\nEven numbers 6\nEven numbers 8\nEven numbers 10\n\n第七行实现了 `continue`\
    \ (#c018.xhtml_continue) 关键字以跳过所有奇数。因此，当循环控制变量 `i` 等于一、三、五、七和九时，条件和语句会被跳过。\n\n\
    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 结论\n\n![image](img/chapter_title_below.png)\n\
    \n“第一部分 – Java 4 Selenium WebDriver”目的是目的是良好的 Java 基础知识。理解 Java 有助于通过 Selenium\
    \ 测试待测应用程序（AUT）的过程。在 AUT 中验证数据的关键在于知道如何访问和操作数据。数据由变量表示，变量可以是文本或数字。所有变量必须有一个数据类型以指示其范围和行为。在处理运算符时，数据类型非常重要，因为某些函数是根据数据类型执行的。此外，某些运算符是形成控制结构的要素。以下项目是书中书中介绍的主题：\
    \ \n\n- 变量：存储数据的位置\n- 数据类型：引用变量的类型\n- 运算符：执行数学或逻辑操作的符号\n- 控制结构：指的是使用逻辑强制程序跳过或循环语句的过程\n\
    \n第二本书的标题为“[(第二部分) Java 4 Selenium WebDriver](http://tinyurl.com/Review-Part-2-Java-4-Selenium)”。它更深入地探讨了类、对象和方法，同时考察了面向对象编程（OOP），它由继承、封装和多态组成。此外，书中还探讨了包、接口、异常处理以及如何利用输入/输出。\n\
    \n"
