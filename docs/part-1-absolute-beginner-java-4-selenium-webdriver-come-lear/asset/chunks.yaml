    a variable can be defined within a class, within a method, or within a method
    as a parameter. A variable’s scope is related to where the variable is declared
    inside the program. Lifetime is how long the variable exists in the program. The
    following are four types of variables that have their own scope and lifetime:


    1.  [Local Variables](#c021.xhtml__Local_Variables_4)


    2.  [Parameter Variables](#c021.xhtml__Parameter_Variables_2)


    3.  [Instance Variables](#c021.xhtml__Instance_Variables_2)


    4.  [Class Variables](#c021.xhtml__Class_Variables_1)


    ## Local Variables


    Local variables are declared inside a [method](#c015.xhtml_A_method). Individual
    [methods](#c015.xhtml_A_method) can have the same [variable name](#c018.xhtml__Variable_Names_2)
    as another method within a program. Local variables are only visible inside its
    individual [method](#c015.xhtml_A_method). Therefore, each variable is unique
    to a specific [method](#c015.xhtml_A_method). Before using a local variable, it
    must be declared and initialized a value without needing a special keyword. Hence,
    there are no default values for local variables. Local variables are created when
    the [method](#c015.xhtml_A_method) is constructed and destroyed when the [method](#c015.xhtml_A_method)
    is terminated. The following is a local variable example:


    public class VariableExample


    {  


    public void AutomationEngineers ()


    {


    int yearsEmployed;


    yearsEmployed = 5;


    System.out.println("Joe Doe ''Automation'' has been at the organization " + yearsEmployed
    + " years");


    }


    public void Developers ()


    {


    int yearsEmployed;


    yearsEmployed = 3;


    System.out.println("Jane Doe ''Dev'' has been at the organization " + yearsEmployed
    + " years");


    }


    public static void main(String[] args)


    {


    VariableExample years = new VariableExample ();


    years.AutomationEngineers();


    years.Developers();


    }


    }


    ![image](d2d_images/image060.png)


    Figure 2.8 – Local Variable


    Program Output:


    Joe Doe ''Automation'' has been at the organization 5 years


    Jane Doe ''Dev'' has been at the organization 3 years


    Lines five and thirteen display a variable “yearsEmployed” that is local to methods
    “AutomationEngineers and Developers.” An error will not occur because each variable
    is unique to its [method](#c015.xhtml_A_method). However, the same [variable name](#c018.xhtml__Variable_Names_2)
    cannot be declared multiple times within the same [method](#c015.xhtml_A_method).
    The scope and lifetime of a local variable is limited to the block/curly braces
    in which it is declared.


    ## Parameter Variables


    Parameter variables are declared and passed into [methods](#c015.xhtml_A_method).
    After a parameter variable is declared, it is implemented like a [local variable](#c021.xhtml__Local_Variables_3).
    Therefore, a [local variable](#c021.xhtml__Local_Variables_3) and parameter variable
    cannot have the same name. Keywords are not required for a parameter variable.
    However, the [data type](#c017.xhtml_Data_Type) and [variable name](#c018.xhtml__Variable_Names_2)
    must be surrounded by a parenthesis after the [method](#c015.xhtml_A_method) name.
    The following is a parameter variable example:


    public class VariableExample


    {  


    public void setMtgAmount (double mtgAmount)


    {


    System.out.println("The mortgage payment amount is " + mtgAmount);


    }


    public static void main(String[] args)


    {


    VariableExample payment = new VariableExample ();


    payment.setMtgAmount(99000);


    }


    }


    ![image](d2d_images/image028.png)Figure 2.9 – Parameter Variables


    Program Output:


    The mortgage payment amount is 99000.0


    Lines three and eight pass parameter variables “double mtgAmount and String[]
    args” into [methods](#c015.xhtml_A_method) “setMtgAmount and main.” The value
    “99000” is passed from the method call “payment.setMtgAmount” line 11 into the
    [method](#c015.xhtml_A_method) “setMtgAmount” line three that is called. The scope
    of a parameter variable is a method’s header inside the parenthesis while the
    lifetime is a method’s body within the curly brackets.


    ## Instance Variables


    Instance variables are declared inside a [class](#c015.xhtml_A_class), outside
    of a [method](#c015.xhtml_A_method), and can be optionally accessed after creating
    an [object](#c015.xhtml_An_object). The values of an instance variable are unique
    to each [object](#c015.xhtml_An_object). Instance variable can be declared before
    or after it is initialized with visibility to all [methods](#c015.xhtml_A_method)
    in a [class](#c015.xhtml_A_class). Default values for a number is zero, for [boolean](#c022.xhtml_boolean)
    the default is false, and an object reference default is null. The following is
    an instance variable example:


    public class VariableExample


    {  


    int yearsExist = 34;


    public static void main(String[] args)


    {


    VariableExample years = new VariableExample ();


    System.out.println("This organization has existed for " + years.yearsExist + "
    years");   


    }


    }


    ![image](d2d_images/image032.png)


    Figure 2.10 – Instance Variable


    Program Output:


    This organization has existed for 34 years


    Line three declares the instance variable “yearsExist” within the class “VariableExample,”
    but outside of the [method](#c015.xhtml_A_method) “main”. The instance variable
    is accessed in line eight “years.yearsExist” after creating keyword [new](#c018.xhtml_new)
    via line seven.


    Note: An instance variable can be accessed directly by calling the instance variable.
    However in this example, the instance variable is accessed via ObjectReference
    due to the static method starting at line five. Line eight prints the variable’s
    value by using the ObjectReference.InstanceVariable “years.yearsExist”.


    ## Class Variables


    Class Variables (known as Static Variables) are declared in a [class](#c015.xhtml_A_class),
    but not in a [method](#c015.xhtml_A_method). This type of variable is declared
    using keyword [static](#c018.xhtml_static). The keyword [static](#c018.xhtml_static)
    announces to the [compiler](#c011.xhtml_A_compiler) that only one copy of a particular
    variable exists, but is shared by all instances of an [object](#c015.xhtml_An_object).
    Default values for a number is zero, the default for [boolean](#c022.xhtml_boolean)
    is false, and an object reference default is null. Class Variables are created
    when the program begins and destroyed when the program ends. The following is
    a class variable example:


    public class VariableExample


    {  


    static int numDays = 30;


    public static void main(String[] args)


    {


    VariableExample days = new VariableExample ();


    System.out.println("Java can be mastered in  " + VariableExample.numDays + " days");


    System.out.println("Selenium can be mastered in " + days.numDays + " days");


    System.out.println("Do you think you can master Java/Selenium in " + numDays +
    " days");     


    } 


    }


    ![image](d2d_images/image062.png)


    Figure 2.11 – Class Variable


    Program Output:


    Java can be mastered in  30 days


    Selenium can be mastered in 30 days


    Line three declares the Class Variable “numDays” within the [class](#c015.xhtml_A_class)
    “VariableExample,” but outside of the [method](#c015.xhtml_A_method) “main.” The
    scope of a class variable is inside the block/curly braces of class and outside
    the block/curly braces of all methods. Therefore, the lifetime of the variable
    continues throughout execution of the program.


    Note: A class variable can be accessed via ClassName, ObjectReference, or ClassVariableName.
    If accessed by way of Object Reference then keyword “[new](#c018.xhtml_new)” must
    be created. Lines eight, nine, and ten access the class variable by using the
    ClassName.ClassVariable “VariableExample.numDays”, ObjectReference.ClassVariable
    “days.numDays”, and ClassVariableName “numDays”.


