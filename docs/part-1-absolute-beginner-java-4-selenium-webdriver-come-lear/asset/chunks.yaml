    # For Loop


    ![image](d2d_images/chapter_title_below.png)


    The for loop executes a block of code for a certain number of iterations. In other
    words, a statement is executed as long as a condition is met. One of the for loop
    benefits is to allow statements to be executed without writing code repeatedly.
    The following is the for loop syntax:


    Syntax


    for (initialization; condition; iteration)


    {


    statement(s)


    } 


    Syntax Details


    | Argument | Description |


    | for | Keyword that starts the for loop |


    | initialization | Assignment that sets the loop control initial value |


    | ; | Semi-colon completes the initialization |


    | condition | A boolean expression that determines if the loop will or will not
    repeat |


    | ; | Semi-colon completes the condition |


    | iteration | Indicates how the loop control variable will change after each variation
    |


    | { | An opening curly bracket |


    | statement(s) | Statement(s) that will execute after the condition is met |


    | ; | Semi-colon completes the statement |


    | } | A closing curly bracket |


    Figure 4.10 – For Loop Syntax Details


    The initialization component declares a [data type](#c017.xhtml_Data_Type) and
    assigns an initial value via [loop control variable](#c037.xhtml_loop_control_variable).
    Usually, the [loop control variable](#c037.xhtml_loop_control_variable) is a single
    character variable name (e.g., i) that controls the entire loop. The condition
    is a boolean expression that specifies a maximum value for the [loop control variable](#c037.xhtml_loop_control_variable).
    All for loops continue executing while the condition is true. Execution begins
    on the statement immediately following the for loop when the condition becomes
    false. Most automation engineers use an [increment (++)](#c025.xhtml_Operator_Increment)
    or [decrement (—)](#c025.xhtml_Operator_Decrement) operator as the iteration expression.
    The [increment](#c025.xhtml_Operator_Increment) operator increases the [loop control
    variable](#c037.xhtml_loop_control_variable) by one, while the [decrement](#c025.xhtml_Operator_Decrement)
    operator decreases the value by one. An executable statement is placed between
    the optional curly brackets. Although, the curly brackets are optional, it is
    recommended to use the brackets to improve readability. The following is a for
    loop example:


    public class ControlStructures


    {


    public static void main (String[] args)


    {


    for (int i = 0; i < 5; i++ )


    {


    System.out.println("The loop control variable value is " + i);   


    }   


    }


    }


    ![image](d2d_images/image013.png)Figure 4.11 – For Loop Example


    Program Output:


    The loop control variable value is 0


    The loop control variable value is 1


    The loop control variable value is 2


    The loop control variable value is 3


    The loop control variable value is 4


    Line five starts the for loop with keyword “[for](#c018.xhtml_for)” followed by
    arguments initialization, condition, and iteration. Initialization (int i = 0;)
    assigns zero as the starting value. Condition (i < 5) sets five as the stopping
    point for the [loop control variable](#c037.xhtml_loop_control_variable). Increment
    (i++) increases the [loop control variable](#c037.xhtml_loop_control_variable)
    by one. The statement prints the [loop control variable](#c037.xhtml_loop_control_variable)
    via line seven.


    It is important to use harmonious values in the for loop. The values can lead
    to an infinite loop if they are not created in agreement. An infinite loop is
    a loop that never stops. For example, the following for loop will repeat indefinitely
    because of the initial value, maximum value, and iteration expression:


    for (int i = 3; i > 1; i++) 


    The initial value “3” starts at a greater value than the maximum value of “1,”
    while the iterator “++” increases after each loop. To correct this infinite loop,
    the initialization value “3” must decrease to less than the conditional value
    “1”; the conditional value “1” must increase to more than the initialization “3”;
    or the iterator must change from increasing “++” to decreasing “—” after each
    loop.'
