    # Chapter 4


    ![image](d2d_images/chapter_title_below.png)


    Control Structures


    Control structures are the process of using logic to force the program to skip
    statements while looping other statements. Forcing the program to skip statements
    is known as branching and looping specific statements is carried out via loops. 


    The two types of branches are [if branch](#c035.xhtml__If_Branch) and [switch
    branch](#c036.xhtml__Switch_Branch). The three types of loops are [for loop](#c037.xhtml__For_Loop),
    [while loop](#c038.xhtml__While_Loop), and [do while loop](#c039.xhtml__Do_While_Loop).
    In addition to the branches and loops are jump statements. Jump statements allow
    execution to bypass unnecessary components of the program. The jump statements
    utilize keywords [break](#c018.xhtml_break) and [continue](#c018.xhtml_continue).
    Both keywords can be included within all branches and loops.


