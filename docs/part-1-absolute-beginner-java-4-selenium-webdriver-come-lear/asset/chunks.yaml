    # Overview


    ![image](d2d_images/chapter_title_below.png)


    Java is a powerful programming language developed by Sun Microsystems. It is a
    widely used object-oriented language that revolutionized the web. In addition
    to revolutionizing the web, Java is used in many devices, such as cell phones.
    The Java Development Kit (JDK) and one of the Integrated Development Environments
    (IDE), such as Eclipse, must be downloaded and installed in order to use Java.
    Steps for installing [JDK](#c016.xhtml__Install_Java_Development) and [Eclipse](#c016.xhtml__Install_Eclipse_IDE)
    are provided at the end of this chapter.   


    Once JDK and Eclipse IDE have been downloaded and installed, statements can be
    written and compiled. Statements are referred to as code—a line or lines of information
    written in a particular syntax. The key to all programming languages is the syntax.
    Syntax is a set of rules that specifies a structured combination of words and
    symbols. If not structured correctly, an error occurs to prevent the statements
    from compiling.


    Compiling statements is performed via a compiler. A compiled language refers to
    a special program that retrieves the statements developed by a programmer and
    then translates the statements into an understandable machine language. A computer
    processor is then able to use the machine language once the statements are translated.
    It is important to know that comments are statements but ignored and never causes
    an error. Comments are notes that help programmers understand the program and/or
    other statements. The following are two types of comments:


    1.  Single line – comment one line at a time


    2.  Multi-line – comment multiple lines 


    Usually, multi-line comments are located at the top of a program with information
    describing the entire program. Single line comments are used to explain statements
    within the program. The purpose of both types of comments is to self-document
    content written in the program. Comments provide answers to two questions:


    1.  What is the purpose of the program, statements, etc.?


    2.  Why did the programmer write the program, statements, etc.? 


    The following is an example of a single and multi-line comment:


    /* 


    Programmer: Rex Jones II


    Description: Show both types of comments


    Purpose:


    Date: 


    */ 


    public class Main


    {


    public static void main(String[] args)


    {


    // This is a single line comment example


    System.out.println("Hello World!!!");


    }


    }


    ![image](d2d_images/image033.png)


    Figure 1.1 – Single and Multi-Line Examples


    Program Output:


    Hello World!!!


    Line one begins the multi-line comment with a forward slash (/) and an asterisk
    (*) while line six ends the multi-line comment with an asterisk and forward slash
    (*/). Line 12 begins the single line comment with two forward slashes (//) and
    does not include symbols to end the comment.


    This chapter provides general concepts regarding Java and will explain the following:


    ✓  [Variables and Data Types](#c012.xhtml__Variables_and_Data)


    ✓  [Operators](#c013.xhtml__Operators)


    ✓  [Control Structures](#c014.xhtml__Control_Structures)


    ✓  [Classes, Objects, and Methods](#c015.xhtml__Classes__Objects__and)


    ✓  [Installations](#c016.xhtml_Installations)


    Note: Details of the concepts are covered in subsequent chapters.


