    |


    ![image](d2d_images/chapter_title_above.png)


    # Switch Branch


    ![image](d2d_images/chapter_title_below.png)


    The switch branch evaluates a single variable then executes a statement according
    to the variable’s value. Primitive data types [byte](#c022.xhtml_byte), [short](#c022.xhtml_short),
    [char](#c022.xhtml_char), and [int](#c022.xhtml_int) can be evaluated along with
    String. The switch and if branches are similar in functionality. There are situations
    where either branch is suitable. However, the switch branch is most efficient
    when dealing with a specific number of values, such as days of the week. Otherwise,
    it is best to implement an if branch when handling an infinite number of values.
    The following is the syntax for the switch branch:


    Syntax


    switch (variableName)


    {


    case constant1:


    statement(s);


    break;


    case constant2:


    statement(s);


    break;


    case constant3:


    statement(s);


    break;


    .


    .


    . 


    default:


    statement;


    }


    Syntax Details


    | Argument | Description |


    | switch | Checks the variable’s value |


    | variableName | Name of the variable |


    | { | An opening curly bracket |


    | case constant1, 2, 3 ... | Contains a possible match for the variable’s value
    |


    | statement(s) | Statement to be executed if the variable’s value match a given
    case |


    | ; | Semi-colon completes a statement |


    | break | An optional keyword that exits out of the switch branch |


    | ; | Semi-colon completes the break |


    | default | An optional keyword that will execute if the variable’s value does
    not match a case |


    | statement | Default statement to be executed if the variable’s value does not
    match a case |


    | } | A closing curly bracket |


    Figure 4.7 – Switch Branch Syntax Details'
