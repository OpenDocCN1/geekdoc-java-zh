    \nFigure 2.2 - Reserve Keywords\n\n## Variable Naming Conventions\n\nConvention\
    \ is a general agreement or practice when establishing a standard. Suitable for\
    \ naming variables, a convention is important while working with a team of automation\
    \ engineers. All identifier names (e.g., variable, method, etc.) are critical\
    \ for reading, understanding, and maintaining code. The following is a list of\
    \ suggested conventions for naming a variable:\n\n- Construct descriptive names\
    \ that describe the variable’s purpose\n- Compose names utilizing mixed case letters,\
    \ unless the name is one word\n- If one word, then use all lowercase letters\n\
    - If multiple words, then begin the first word with a lowercase letter and each\
    \ consecutive word with an uppercase letter (e.g., `custFirstName`)\n- Create\
    \ a name that begins with a letter and not a dollar sign `$` or underscore `_`\n\
    - Choose loop control variables that begin with a single lowercase letter (e.g.,\
    \ `i`, `x`, `y`)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Variable Declaration\n\n![image](d2d_images/chapter_title_below.png)\n\nDeclaring\
    \ a variable is stating clearly that a variable exists. All variables are associated\
    \ with a data type in the event of declaring a variable. Data types guarantee\
    \ the correct data is assigned to a variable. In addition, the size of a variable\
    \ is determined by a data type. Variables must be declared before they are utilized\
    \ in any program. The following is the syntax for declaring a variable:\n\n###\
    \ Syntax\n```\nvariableType variableName;\n```\n\n### Syntax Details\n\n| Argument\
    \ | Description |\n| :--- | :--- |\n| `variableType` | Data type of variable being\
    \ declared |\n| `variableName` | Name of variable being declared |\n| `;` | Semi-colon\
    \ completes the declaration statement |\n\nFigure 2.3 – Variable Declaration Syntax\
    \ Details\n\nThe following is a variable declaration example:\n\n```java\npublic\
    \ class VariableExample\n{  \n  public static void main(String[] args)\n  {\n\
    \    int x;\n    int y;\n    x = 5;\n    y = 7;\n    System.out.println(\"The\
    \ values of x and y are \" + x + \" and \" + y);\n  } \n}\n```\n\n![image](d2d_images/image055.png)\n\
    \nFigure 2.4 – Variable Declaration\n\nProgram Output:\nThe values of x and y\
    \ are: 5 and 7\n\nLines five and six declare variables `x` and `y` with an `int`\
    \ data type. Notice how each declaration ends with a semi-colon. The semi-colon\
    \ completes the declaration statement.\n\nNote: Multiple variables can be declared\
    \ on the same line if the variable has the same data type. The following is a\
    \ declaration example of multiple variables separated by a comma:\n\n```\nint\
    \ x, y;\n```\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Variable Initialization\n\n![image](d2d_images/chapter_title_below.png)\n\n\
    In general, variables are given an initial value before the variables are used.\
    \ The Assignment Operator separates two sides of an equation. There is a left\
    \ and right side of every equation. The left side displays a variable name while\
    \ the right side displays a value. Variables can be initialized the following\
    \ ways:\n\n1. Initialize by Value\n2. Initialize by Dynamics\n\n## Initialize\
    \ by Value\n\nInitializing a variable by values requires a value to be set for\
    \ the variable. The following are two ways to initialize a variable by value:\n\
    \n1. At declaration\n2. After declaration\n\n### At declaration\n\nAt declaration\
    \ is when the data type, variable name, and value are placed on the same line.\
    \ In other words, the variable is declared and initialized simultaneously. Multiple\
    \ variables can be initialized at declaration by using a comma separated list.\
    \ The following is an example of “at declaration” initialize by value:\n\n```java\n\
    public class VariableExample\n{  \n  public static void main(String[] args)\n\
    \  {\n    int num1 = 100, num2 = 200, total;\n    total = num1 + num2;\n    System.out.println(\"\
    The total of num1 and num2 is \" + total);  \n  } \n}\n```\n\n![image](d2d_images/image18.png)\n\
    \nFigure 2.5 – Variable Initialization At Declaration\n\nProgram Output:\nThe\
    \ total of num1 and num2 is 300\n\nLine five declares variables `num1`, `num2`,\
    \ and `total` with an `int` data type. Notice how each declaration ends with a\
    \ semi-colon. The semi-colon completes the declaration statement. Therefore, the\
    \ variables are initialized at declaration.\n\n### After declaration\n\nAfter\
    \ declaration is when the data type, variable name, and value are placed on the\
    \ same line. In other words, the variable is declared and initialized simultaneously.\
    \ Multiple variables can be initialized at declaration by using a comma separated\
    \ list. The following is an example of “at declaration” initialize by value:\n\
    \n```java\npublic class VariableExample\n{  \n  public static void main(String[]\
    \ args)\n  {\n    int x, y;\n    x = 5;\n    y = 7;\n    System.out.println(\"\
    The values of x and y are \" + x + \" and \" + y);\n  } \n}\n```\n\n![image](d2d_images/image051.png)\n\
    \nFigure 2.6 – Variable Initialization After Declaration\n\nProgram Output:\n\
    The values of x and y are: 5 and 7\n\nLines five and six declare variables `x`\
    \ and `y` with an `int` data type. Notice how each declaration ends with a semi-colon.\
    \ The semi-colon completes the declaration statement. Therefore, the variables\
    \ are initialized after declaration.\n\n## Initialize by Dynamics\n\nInitializing\
    \ a variable by dynamics does not assign a specific value to a variable. Instead,\
    \ values subject to change are assigned to the variables. Occasionally, values\
    \ that change are values from an Application Under Test (AUT) or other variables.\
    \ The following is a variable initialization dynamics example:\n\n```java\npublic\
    \ class VariableExample\n{  \n  public static void main(String[] args)\n  {\n\
    \    int num1, num2;\n    num1 = 100;\n    num2 = 200; \n    int total = num1\
    \ + num2;\n    System.out.println(\"The total of num1 and num2 is \" + total);\n\
    \  } \n}\n```\n\n![image](d2d_images/image020.png)\n\nFigure 2.7 – Initialize\
    \ by Dynamics\n\nProgram Output:\nThe total of num1 and num2 is 300\n\nLine 10\
    \ declares and initializes variable `total` with an `int` data type. The variable\
    \ is not initialized with a specific value. However, the variable is initialized\
    \ with information `num1` and `num2` that can possibly change during execution.\
    \ For example, an automation engineer can enter statements to increase the value\
    \ of both variables `num1` and `num2` during execution. If variables `num1` and\
    \ `num2` change, then the variable `total` will dynamically change.\n\nNote: Line\
    \ 10 requires a data type `int` when initializing a variable by dynamics.\n"
