    # Constants


    ![image](d2d_images/chapter_title_below.png)


    Constants (also known as Literals) are unchangeable values assigned to a variable
    name of a particular [data type](#c017.xhtml_Data_Type). The way each Constant
    is defined depends upon its [data type](#c017.xhtml_Data_Type). Defining a Constant
    is a defense mechanism to protect information so that the value remains fixed.
    For instance, the total hours in a day is 24, therefore, a Constant is declared
    so that the value of 24 does not change. The following are four types of constants:


    1.  [String Constants](#c023.xhtml__String_Constants_1)


    2.  [Character Constants](#c023.xhtml__Character_Constants_1)


    3.  [Boolean Constants](#c023.xhtml__Boolean_Constants_1)


    4.  [Numeric Constants](#c023.xhtml__Numeric_Constants_1)


    ## Constant Naming Conventions


    A standard naming [convention](#c018.xhtml_Convention) for Constants facilitate
    the process of locating the Constants. The following are Constant naming conventions:


    *   Construct descriptive names that describe the Constant’s purpose


    *   Create a name that includes all capital letters (e.g., CUSTOMER)


    *   Compose a name utilizing all capital letters with an underscore if the name
    consists of multiple words (e.g., ORDER_NUM)


    ## Declare and Initialize Constants'
