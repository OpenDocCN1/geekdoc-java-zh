    # About the Author


    Rex Allen Jones II is a QA/Software Tester with a passion for sharing knowledge
    about testing software. He has been watching webinars, attending seminars, and
    testing applications since February 2005. Mr. Jones graduated from DeVry University
    in June 1999 with a Bachelor’s of Science degree in Computer Information Systems
    (CIS). Currently, Rex is a Consultant and former Board of Director for User Group:
    Dallas / Fort Worth Mercury User Group (DFWMUG) and member of User Group: Dallas
    / Fort Worth Quality Assurance Association (DFWQAA). In addition to his User Group
    memberships, he is a Certified Software Tester Engineer (CSTE) and has a Test
    Management Approach (TMap) certification.


    Mr. Jones’ advice for people interested in Functional Automation Testing is to
    learn the programming language. This advice led him to write two books “(Part
    1 & Part 2) You Must Learn VBScript for QTP/UFT” geared towards `VBScript` which
    is the programming language for Unified Functional Testing (UFT) formerly known
    as Quick Test Professional (QTP). In addition, one book “Part 1 – Java 4 Selenium
    WebDriver” and an upcoming book “Part 2 – Java 4 Selenium WebDriver” geared toward
    `Java` which is one of the programming languages for `Selenium`.

