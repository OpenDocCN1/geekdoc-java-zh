    2.  [After declaration](#c020.xhtml__After_declaration_1)


    ### At declaration


    At declaration is when the [data type](#c017.xhtml_Data_Type), [variable name](#c018.xhtml__Variable_Names_2),
    and value are placed on the same line. In other words, the variable is declared
    and initialized simultaneously. Multiple variables can be initialized at declaration
    by using a comma separated list. The following is an example of “at declaration”
    initialize by value:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    int num1 = 100, num2 = 200, total;


    total = num1 + num2;


    System.out.println("The total of num1 and num2 is " + total);  


    } 


    }


    ![image](d2d_images/image018.png)


    Figure 2.5 – Variable Initialization At Declaration


    Program Output:


    The total of num1 and num2 is 300


    Line five declares three variables “num1, num2, and total” with an [int](#c022.xhtml_int)
    data type. Two of the variables “num1 and num2” are initialized with a value that
    represents variable initialization at declaration. Therefore, the variables are
    initialized when they are declared.


    ### After declaration


    After declaration is when the [data type](#c017.xhtml_Data_Type), [variable name](#c018.xhtml__Variable_Names_2),
    and value are placed on two separate lines. The [data type](#c017.xhtml_Data_Type)
    and [variable name](#c018.xhtml__Variable_Names_2) are declared on the same line
    while the [variable name](#c018.xhtml__Variable_Names_2) is assigned a value on
    a subsequent line. The following is an example of “after declaration” initialize
    by value:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    int num1, num2, total;


    num1 = 100;


    num2 = 200; 


    total = num1 + num2;


    System.out.println("The total of num1 and num2 is " + total);


    } 


    }


    ![image](d2d_images/image051.png)


    Figure 2.6 – Variable Initialization After Declaration


    Program Output:


    The total of num1 and num2 is 300


    Line five declares three variables “num1, num2, and total” with an [int](#c022.xhtml_int)
    data type. Two of the variables “num1 and num2” are initialized with a value on
    lines seven and eight that represents variable initialization after declaration.
    Therefore, the variables are declared on line five and initialized after they
    are declared on lines seven and eight.


    ## Initialize by Dynamics


    Initializing a variable by dynamics does not assign a specific value to a variable.
    Instead, values subject to change are assigned to the variables. Occasionally,
    values that change are values from an Application Under Test (AUT) or other variables.
    The following is a variable initialization by dynamics example:


    public class VariableExample


    {  


    public static void main(String[] args)


    {


    int num1, num2;


    num1 = 100;


    num2 = 200;  


    int total = num1 + num2;


    System.out.println("The total of num1 and num2 is " + total);


    } 


    }


    ![image](d2d_images/image020.png)


    Figure 2.7 – Initialize by Dynamics


    Program Output:


    The total of num1 and num2 is 300


    Line 10 declares and initializes variable “total” with an int data type. The variable
    is not initialized with a specific value. However, the variable is initialized
    with information “num1 and num2” that can possibly change during execution. For
    example, an automation engineer can enter statements to increase the value of
    both variables “num1 and num2” during execution. If variables num1 and num2 change,
    then the variable “total” will dynamically change.


    Note: Line 10 requires a data type [int](#c022.xhtml_int) when initializing a
    variable by dynamics.


