    \n# Preface\n\n![image](d2d_images/chapter_title_below.png)\n\nI am enthused to\
    \ write an instructional book on Java because I have talked with many testers\
    \ who can relate to the frustration caused by the lack of information to learn\
    \ Java for automation testing. Java is one of the programming languages for Selenium.\
    \ A common challenge with new automation testers is learning how to program. Therefore,\
    \ this book is designed to help an absolute beginner learn Java. The purpose of\
    \ this book is to fill a need of automation testers who are forced to hurry past\
    \ the programming component of automation, leading to a struggle with working\
    \ in Selenium.\n\n### Target Audience\n\nThe target audience is beginners with\
    \ little to no knowledge of Java. Beginners are people new to Selenium and Java,\
    \ and have a desire to establish a deep foundation of Java principles.\n\n###\
    \ Why learn Java?\n\nJava is a powerful programming language that is frequently\
    \ and commonly implemented in the Information Technology (IT) industry. Java programmers\
    \ are in high demand in the IT field and being able to code automation scripts\
    \ in Java will make you a commodity to any quality assurance testing team. There\
    \ are many Java forums (message boards) online that support Java programmers in\
    \ need of a solution for a problem. Learning Java and Selenium is a great combination\
    \ that will make any quality assurance tester effective on an automation project.\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](d2d_images/chapter_title_above.png)\n\n# About the Author\n\n\
    ![image](d2d_images/chapter_title_below.png)\n\n![image](d2d_images/image050.png)\n\
    \nRex Allen Jones II is a QA/Software Tester with a passion for sharing knowledge\
    \ about testing software. He has been watching webinars, attending seminars, and\
    \ testing applications since February 2005. Mr. Jones graduated from DeVry University\
    \ in June 1999 with a Bachelor’s of Science degree in Computer Information Systems\
    \ (CIS).\n"
