  \n# 前言\n\n![image](img/chapter_title_below.png)\n\n我非常热衷于写一本关于 Java 的指导书籍，因为我与许多由于缺乏自动化测试\
  \ Java 信息而感到困扰的测试人员交流过。Java 是 Selenium 的编程语言之一。本书旨在帮助初学者学习 Java。\n\n### 目标读者\n\n\
  目标读者是对 Java 几乎没有知识的初学者。初学者是 Selenium 和 Java 的新手，并希望建立深厚的 Java 原理基础。\n\n### 为什么要学习\
  \ Java？\n\nJava 是一种强大的编程语言，在信息技术（IT）行业被频繁应用。Java 程序员在 IT 领域需求巨大，能够编写 Java 自动化脚本将成为任何质量保证测试团队的财富。网上有很多\
  \ Java 论坛（留言板）可以支持需要解决方案的 Java 程序员。学习 Java 和 Selenium 是一个极佳的组合，可以让任何质量保证测试人员在自动化项目中变得高效。\n\
  \n\n\n\n\n目前，Rex 担任高级顾问，曾是达拉斯/福特沃斯水星汞用户小组（DFWMUG）的董事会成员，以及达拉斯/福特沃斯质量保证协会（DFWQAA）的成员。除了这些用户小组的成员身份外，他还是认证软件测试工程师（CSTE），并拥有测试管理方法（TMap）认证。\n\
  \nJones 先生对对功能自动化测试感兴趣的人建议是学习编程语言。这一建议促使他编写了 4 本编程书籍——《（第一部分与第二部分）你必须为 QTP/UFT 学习\
  \ VBScript》和《（第一部分与第二部分）Java 4 Selenium WebDriver》。`VBScript` 是统一功能测试（`UFT`，原 Quick\
  \ Test Professional `QTP`）的编程语言，而 `Java` 是 `Selenium WebDriver` 的编程语言之一。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
