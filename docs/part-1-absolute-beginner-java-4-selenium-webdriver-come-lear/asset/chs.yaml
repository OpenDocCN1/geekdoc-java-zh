  \n![Rex Jones](img/ata_image.jpg)\n\n# 关于作者\n\nRex Allen Jones II 是一位 QA/软件工程师，热于分享软件测试知识。自\
  \ 2005 年 2 月以来，他一直在观看网络研讨会、参加研讨会并测试应用程序。Jones 先生于 1999 年 6 月毕业于 DeVry 大学，获得计算机信息系统\
  \ (CIS) 理学学学位。目前，Rex 担任顾问，曾任 User Group: Dallas / Fort Worth Mercury User Group\
  \ (DFWMUG) 的董事会成员，以及 User Group: Dallas / Fort Worth Quality Assurance Association\
  \ (DFWQAA) 的成员。除了用户小组的身份外，他还是认证软件测试工程师 (CSTE)，并拥有测试管理方法 (TMap) 认证。\n\nJones 先生对功能自动化测试感兴趣的人的建议是学习编程语言。这一建议促使他写了两本书《（第\
  \ 1 部分和第 2 部分）你必须为 QTP/UFT 学习 VBScript》，针对 `VBScript`，该语言是统一功能测试 (UFT，以前称为 Quick\
  \ Test Professional (QTP)) 的编程语言。此外，他的一本书《第 1 部分 – Java 4 Selenium WebDriver》以及即将出版的《第\
  \ 2 部分 – Java 4 Selenium WebDriver》针对的是 `Java`，它是 `Selenium` 的编程语言之一。\n\n"
