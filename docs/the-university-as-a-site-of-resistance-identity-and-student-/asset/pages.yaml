    # JAC: A COLLABORATIVE EFFORT


    As discussed in Chapter two, Osmania alumni were instrumental in the formation
    of Telangana Rashtra Samiti (TRS) in April 2001, which provided a platform to
    channel emotions, passion, and energy of the new generation students. It ignited
    the demand and aspirations for separate Telangana among masses. From 2001 onwards,
    countless student organizations appeared in the movement landscape. With a larger
    presence of scheduled caste (SC), scheduled tribe (ST), and Other Backward Class
    (OBC) students and activists, new organizations as Telangana Giriyan Vidyararthi
    Parishad (TGVP), Telangana Democratic Student Federation (TDSF), Bahujan Students’
    Federation (BSF), Madiga Students’ Federation (MSF), Telangana Student Association
    (TSA), and many more formed. Many Dalit organizations (especially MSF and BSF)
    articulated the ideology of national Dalit leaders as Kanshi Ram, Mayawati, and
    Manda Krishna Madigi. Tribal students were more concerned about local politics
    and case issues, and later supported the demand for ‘Dalit-Bahujan Telangana’.
    Their activism also charged the student winds of mainstream political parties
    such as National Student Union of India (NSUI) and Akhil Bhartiya Vidyarthi Parishad
    (ABVP). Though these organizations had a small following on campus, they played
    a vital role in publicizing the movement in the media. In April 2001, with the
    formation of TRS, Kalvakuntala Chandrashekhar Rao (hence KCR) promised intellectuals
    that Telangana would form through democratic means. After winning his first assembly
    and parliamentary elections in 2004, KCR served as a minister in the central government
    from 2004 to 2006. During his ministry, the separate Telangana issue was not pursued.
    One after the other, TRS won all elections and by-elections and continued performing
    well in the state and parliamentary elections. However, in 2009 state elections,
    TRS’s poor performance raised critical questions among intellectuals and supporters
    who had their hopes high from KCR. The party that was formed with one agenda of
    separate statehood diverting its attention to other political issues.'
