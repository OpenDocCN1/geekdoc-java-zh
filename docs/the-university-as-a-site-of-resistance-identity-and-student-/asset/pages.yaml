  md: '# New State, Old Narratives 197


    ideology, yet, caste is used as a political tool.Therefore, there is a need to
    problematize the notion of ideology. Any caste movement has the possibility to
    transform itself into an anti-caste movement if it can develop a democratic culture
    of its own and challenge the cultural institution. Movement that emerges from
    identity has some uniqueness that reflects in its cultural practices.The contemporary
    student activism makes university a potential site for a cultural resistance.


    The formation of a new state does not necessarily guarantee the welfare and representation
    of historically marginalized identities—it demands continuous resistance and agitation
    for democratic representation. Universities, in this regard, provide fertile ground
    where students and teachers can question the establishment and devise critical
    and creative ways to establish organic linkages with the ontological realities
    of the public. The mass movement led by Osmania activists sets an example for
    any resistance movement around the world.The university as a democratic institution
    stands taller than other public institutions.


