    # THE UNIVERSITY AS A DEMOCRATIC INSTITUTION


    The history of global student activism shows that the university has been fighting
    for its existence and autonomy while challenging traditions in the form of knowledge
    production. Despite the intervention of the state, the community of scholars constitutes
    one of the longest surviving democracies in the world (Visvanathan 1999: 51).
    A range of scholars (Apple 1996, Bernstein 2000; Giroux 1983; Habermas 1967) understand
    the university as a democratic institution that resists values of justice, ethical/moral
    and political agency. To make such an institution possible, we must problematize
    the traditional notion of ‘democracy’ and its long-standing educational cognate,
    ‘equality’, as Giroux et al. (1988) suggests. Among the masses, there is a tendency
    to look at university life detached or aloof from reality—a bubble that is often
    referred to as ‘utopia’, where one is lucky to spend a few years before venturing
    out into the ‘real world’ for a career. In contrast, Indresar (1999: 152) argues
    that ‘campuses cannot'
