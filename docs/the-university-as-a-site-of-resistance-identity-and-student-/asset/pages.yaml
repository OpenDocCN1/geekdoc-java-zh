  md: '# Introduction


    Over the past few years, Indian universities have made headlines that have sparked
    widespread debate among intellectuals about the autonomy, academic freedom, and
    freedom of expression. At the start of 2016, the administration of the University
    of Hyderabad (UoH) rusticated five members of the Ambedkar Student Association
    (ASA). Two weeks later, on 17 January 2016, one of those, a lower-caste PhD student
    named Rohit Vemula, ended his life by hanging himself in a hostel room. His death
    led to intense protests at UoH which gradually turned into a massive student movement
    in India known as the post-Rohit Vemula agitations. Uproar from Rohit''s suicide
    burst through protests, marches, and hunger strikes. From Hyderabad to New Delhi,
    the incident spawned numerous media analyses and parliamentary debates. Rohit''s
    suicide note was a searing attack on the casteist and hierarchical society where,
    in his words, ''the value of a man was reduced to his immense identity and nearest
    proximity, to a vote, to a number, to a thing,'' where he described his birth
    as a ''fatal accident''.


    Another incident occurred suddenly after Rohit''s suicide, and being in the nation''s
    capital one of the country''s most liberal institutions, it attracted rampant
    media attention. On 9 February 2016, Jawaharlal Nehru University (JNU) gained
    notoriety for allegations of being an ''anti-national'' campus. A group of JNU
    students were allegedly opposing the death penalty while commemorating the death
    of Muhammad Afzal Guru (a Kashmiri who was executed in 2013 for involvement in
    a terrorist attack). Some students in the group were filmed sloganeering for a
    free Kashmir and


    The University as a Site of Resistance: Identity and Student Politics. Gaurav
    J. Pathania, Oxford University Press (2018). DOI: 10.1093/9780199488414.003.001'
  merge: -1
  pgno: 18
