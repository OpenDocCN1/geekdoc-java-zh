    # DISCUSSION


    Network processes build and sustain the essence of a social movement (Diani and
    Bison 2004). The chapter attempted to highlight these processes through dynamics
    of campus networks. However, these dynamics are not limited to the university
    space alone; rather they are enmeshed in the broader network for the movement.
    The strength of Osmania students’ activism lies in their robust networks, produced
    by the campus culture of activism. This culture evolved over the past five decades,
    both on and off campus. Alumni are a prominent part of the campus community of
    activists and, in fact, are many teachers at OU. Most of the state’s bureaucrats,
    journalists, lawyers, officers, social workers, police, and politicians are also
    students of OU. Whenever they meet, they refer to the OU network as ‘our Osmania
    community’. Among the campus community, a culture of honour is firmly in place.
    This is evident during public meeting or talks on Telangana—if any movement leader
    appears unexpectedly at the venue, the organizer is bound to request him to address
    the meeting or announce his presence. That way, student leaders, old and new,
    become known to each other, thus weaving a stronger network of who support the
    Telangana cause.


    Specific sites and spaces within the university are used by activists for networking.
    The main ones are the ubiquitous dhabas, along with the hostels, where boarders
    and non-boarders mingle with alumni and outsiders. However, social media has also
    contributed to connecting Telangana activists across time and space.


    Thus, campus networks are also built with personal motives, where activists hope
    to expand their personal agenda, while fighting for the collective cause.'
