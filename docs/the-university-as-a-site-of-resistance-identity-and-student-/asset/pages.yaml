  md: '# Preface


    xiii


    region? How did their demand for Telangana statehood succeed? The volume also
    provides a theoretical debate on old and new social movements and arguments that
    the Telangana movement should be viewed as new social movement. This book attempts
    to establish the Telangana movement as a cultural movement, rather than merely
    a political one, as many scholars argue.


    Social movement is a process of consciousness and representation that requires
    material and cultural resources for its existence. But consciousness of cultural
    resources has largely given an industrial answer. Culture¹ cannot be reduced to
    mere economic or political factors, it cannot be understood, either, without understanding
    the economic context that surrounds and shapes it. What Telangana activists gained
    after joining an institution of higher education is access to cultural capital
    and consciousness of cultural resources unique to their identity. That is why
    cultural identities, whether custom or costume, food or festivals, language or
    life-world, caste or region, are instrumental to the functioning of Indian politics.


    Without the help of my activist-friends from Arts College, Osmania University,
    Hyderabad, and the English Foreign Language University, this research was not
