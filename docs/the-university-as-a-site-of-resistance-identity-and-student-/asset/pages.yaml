    In our discussion on identity movements, Bernstein (2008:287) uses the term ‘deconstructive
    movements’ and explains that such movements may target the state, institutions,
    and more general cultural practices. What Bernstein means by deconstructive is
    basically that movements change the meaning of existing identities and add new
    meaning to them. Therefore, exposing the social basis for these categories by
    deconstructing undermines the cultural and political bases for oppression (Bernstein
    2008: 288). Struggles for recognition are, and have been, a struggle for political
    voice (Hobson 2003: 265). This struggle, whether for social or cultural recognition,
    would manifest in one or the other form of politics. However, Bernstein (2008:289)
    raises critical questions around recognition which need to be addressed: how are
    deconstructive movements linked to recognition? Can deconstructive movements emerge
    in the absence of movements for recognition? If so, under what conditions do such
    movements emerge (Bernstein 2008: 288)? How do movements negotiate identity for
    empowerment when the identity around which the movement is organized is also the
    basis for grievances (2008: 289)?


