    # STRUCTURE OF THE BOOK


    With a conceptual debate over old and new social movements, the first chapter
    titled ‘Telangana Movement: A Cultural–Political Discourse’ offers theoretical
    insights on culture as a state of politics, social domination, marginalization,
    and resistance. It understands the ‘problem of Telangana’ within the framework
    of ‘internal colonialism’, the term used by the first State Reorganisation Commission
    (1955: 105). It tries to understand the activists’ experience and the larger forces
    that shape their motives, ideas, and identities. It establishes that the movement
    evoked various local cultural symbols such as language/accent, food, dress, arts,
    theatre, and music as forms of resistance to spur a popular movement against the
    ‘dominant’ culture of Andhrais, whom Telangana people referred to as ‘outsiders,’
    ‘non-mulki’ or ‘settlers’. Chapter two, titled ‘University: Academics, Culture,
    and Politics’, provides activists’ narratives of the five decades of activism
    at OU. It illustrates how a ‘culture of resistance’ and ‘culture of activism’
    were created by ‘organic intellectuals’ (students and teachers) and produced generations
    of campus activists. Chapters three and four, titled ‘Campus Networks and Agitations:
    The Making of a Student Activist’ and ‘Learning from the Past, Imagining the Future’
    respectively, draw'
