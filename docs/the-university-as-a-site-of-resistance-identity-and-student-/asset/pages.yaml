    political space. It challenged the existing leadership of the move- ment and bargaining
    power with the state. However, internal dynamics of movements was not simply determined
    by external contexts. The JAC as a concept became popular among every context
    of Telangana society, from elite to the common masses. Each social class had formed
    their own groups, first on the basis of collective identity of Telangana, then
    on the basis of primordial iden ties, and then on the basis of ideology (‘Geographic'',''Democratic’,
    and ‘Dalit-Bahujan’ Telangana). In the longer run, such groupings strengthened
    the movement at grassroots level. Interestingly, this basis strengthened the movement
    and made it more democratic by introducing concepts as ‘Democratic’, ‘Geographic’,
    and ‘Dalit-Bahujan’ Telangana.


    A movement only takes an agitative route when it generates a collective identity.
    The success of Telangana movement was the com- bination of various internal and
    external factors. For example, dappu, as a traditional symbol of caste-based occupation,
    was presented as a symbol of assertion by the activists. Telangana imaju popularized
    as a new identity to solidify Telangana identity. Similarly, the individual talent
    of singing got a public expression through movement (which otherwise was not possible).
    There are studies (Braz 1973;Danda 1983; Dasgupta 1983; Mahapatra 1983;Rao 1981;
    Saikia 1982; Singh 1983) on social movements and collective actions of individuals
    that dem-strate the emergence of charismatic leadership and how it becomes a symbol
    of the emotive aspects of the social consciousness of a community, activates the
    strategies of solidarity, and revitalizes the indigenous traditions (Singh 2001:
    169). Castells introduces another concept of identity: project identity is formed
    ‘when social actors, on the basis of which materials are available to them, build
    a new identity that redefines their position in society and, by doing, seek the
    transformation of the overall social structure’ (Castells 1999: 8).


