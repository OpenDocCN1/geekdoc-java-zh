  md: '# New State, Old Narratives 195


    Therefore, in any identity based movements or mobilization, the word ''ideology''
    does not convey a serious message.


    For the past decades, identity has been an important theme capturing the attention
    of new social movement scholars. Snow and McAdam (2010:46) look at identity as
    ''constructive perspective'' which focuses on the construction and maintenance
    of collective identity in social movements (also see Hunt, Benford, and Snow,
    1994; Lichtenerman 1999). Identity work in social movements is not necessarily
    confined to discussion about creating ''we''. Bernstein (2008: 288) uses the term
    ''deconstructive movements'', which may target the state, institutions, and more
    general cultural practices. These movements are motivated by activists'' understandings
    of how categories are constructed and how those categories, codes, and ways of
    thinking serve as axes of regulation and domination (Crossley 2002; Eyerman and
    Jamison 1991; Melucci 1996; Rochan 1998). Taking the concept of identity movement
    critically, Bernstein (2008: 291) argues that ''collective action'' is highly
    researched that centres around issues of domination and so on. Therefore, it not
    only defines ''us'' is, but also acknowledges injustice to ''us'' and attributed
    it to structural cases (Gamson 1992; Morris and Braime 2001; Taylor and Whittier
    1992).


    To oppose the historical injustice, Osmania formed a musical band called Bheem
    Drum to represent the traditional symbol of a community. Similarly, the dagga
    emerged as a powerful symbol for the movement. Identity assertion occurred through
    food consumption and festivals as well. In celebration of Ambedkar''s birthday,
    a group of Dalit students performed a Beaf Anthem at OU in 2012. Through these
    cultural resources they invoke a ''collective memory'' (Eyerman and Jamison 1998:
    70). Icons, symbols, and food practices, which were considered derogatory, become
    part of the activists'' toolkit in resisting cultural hegemony. The emerging middle
    class in India that has largely received higher education are ''harbingers of
    newness'' due to their active participation in agitations and protests (Pathania
    2015: 290). Yet, this ''newness'' needs to be looked at critically when it comes
    to the issue of marginalized communities based on caste, region, religion, or
    gender. Marginalized students use the logic of historic discrimination and injustice
    to ''us'' vs. ''them'' as their vantage point for any issue they raise. They claim
    that ''class'' analysis not only misguides but also weakens the fight against
    casteist forces. Therefore, these binaries of'
