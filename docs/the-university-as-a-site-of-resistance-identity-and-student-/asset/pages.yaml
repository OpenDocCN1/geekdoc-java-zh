    Aside from rallies, protests, or meetings, wedding receptions are another occasion
    when student activists network and display their status within the community.
    What is interesting about this site is that it is one rare occasion when student
    activists across party lines come together. Student leaders bring along their
    supporters, and the number of supporter shows his strength and power. times, popular
    figures of the movement (such as Kalvakuntala Chandrasekhar Rao (henceforth KCR),
    President of Telangana Rashtra Samiti (TRS); Professor Kodandar, and Gaddar attend
    these receptions. It is important to note that these wedding functions are an
    invitation to all Telangana activists. Other activists, journalists, professors,
    and local and national politicians concerned with Telangana issues are also invited.
    In this way, every kind of social gathering—marriage ceremonies included—serve
    as a medium of networking among Telangana activists.


    For the masses, a Telangana activist is considered very honorable. Those who have
    arranged marriages customarily receive a sizable dowry. Their activism adds a
    point to their profile and in negotiations for a larger dowry. To make an impression
    on a prospective bride''s family, activists show files of news coverage with pictures
    showing addressing or leading a rally. These pictures are also uploaded on social
    media, typically Facebook. Other activists have their picture taken with a famous
    personality or politician, and this photo is used in their marriage profile (bio-data).
    Similar to pamphlets and posters, wedding invitations also have the slogan, ''Jai
    Telangana, Jai Telangana'' printed on the card.

    The researcher had the opportunity to attend two student receptions, both of which
    were held on campus and were open to the entire university. To be sure, these
    were ideal opportunities to witness a unique tradition among activists as well
    as meet new activists. Everyone proudly introduced themselves their association
    with the Telangana movement and exchanged their cards. Most of the cards labelled
    their role as state president or chairman, Osmania University-Joint Action Committee
    (OU-JAC) or TS-JAC, and at the same time, as bearer of Madig Student Federation
    (MSF) or Telangana Student Front (TSF), and so on. Nearly all visiting cards are
    printed in English. This indicates a political aspiration to connect with all
    political leadership, especially'
