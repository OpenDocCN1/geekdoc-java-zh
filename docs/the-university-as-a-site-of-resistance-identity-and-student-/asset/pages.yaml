  md: '# Learning from the Past, Imagining the Future


    Students planned new programmes and used various protest strategies. ''Fasting''
    was opted as the last form of protest. On the other hand, some civil society groups
    have organized fasting. Taking a critical stand on hunger strike as a protest
    strategy, Dr Surepally,^40 an Osmania alumni from Telangana, questions its efficacy:
