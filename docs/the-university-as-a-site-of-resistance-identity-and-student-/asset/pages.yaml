    # NETWORKING AT WORK


    OU is considered the most popular and prestigious university region in the region.
    Almost 85 per of students come from the Telangana region and the rest are from
    Hyderabad.Most students who join OU are products of the Andhra Pradesh Residential
    School system, which has branches across the state. Students who earn the scholarship
    receive free education and lodging in these schools. A large section of these
    students who belong to economically lower-class families, and are the first in
    their family to attend a university. At OU, there is a feeling of solidarity and
    friendship among this group, especially as most of them are SCs or STs. Explaining
    the reason behind this, Amar⁵ activist from a radical student group recounts:


    During school days, Leftist groups used to distribute their pamphlets on various
    social problems. The content in the pamphlets was so radical and anti-government
    but was very appealing to us.These pamphlets enhanced our understanding of activism
    and Telangana problems. In their speeches they did mention Osmania University
    and its history of producing radical activists. The first time I got to know George
    Reddy who was a brilliant scholar and Left ideologue in 1970s; but he was shot
    dead by the Right-wing in his hostel. That scene was imprinted in my mind. I was
    so excited to read about such leaders. My group of friends started dreaming of
    studying in Osmania.


    Because of their exposure to these ideologies, students who graduate from these
    schools have a heightened awareness of Telangana issues and are sympathetic to
    the cause for statehood. That, combined with the solidarity experience when arriving
    at OU and the intense activism on campus, serves to crystallize their involvement
    in the movement.


    For every movement to survive, enlisting new members to sustain the activism is
    crucial. Predictably, thousands of new students arriving on campus every July
    become the target of activists'' recruitment efforts. Building trust is of prime
    importance, and various student'
  merge: -1
  pgno: 134
