    Applying the NSM framework, the next section highlights how different phases of
    the movement were essentially a struggle between two cultural identities. As Lisa
    Mitchell (2010: 96) argues, ''cultural identities—whether defined by language
    or any other foundation—are central to the functioning of politics in India today.''
    This book takes this view further and divides the Telangana agitation into three
    phases. The first phase (1953–72) lies in the cultural deprivation and humiliation
    of the Telangana people in the wake of the merger with Andhra. The movement''s
    second phase, from 1973 to 2000, was a lengthier part marked by intense mobilization
    in the region. The third phase, from 2001 to 2014, is one of cultural and political
    assertion. The movement evoked various local cultural symbols such as dialect,
    food, dress, festivals, and the arts, as forms of resistance against the so-called
    dominant culture of Andhr, a political identity. The Telangana movement defines
    this culture as the culture of the ''outsider'',''non-Mulki'', or ''settler''.
    Thus, the feeling of a unique Telangana identity emerged against the other identity
    of the Andhra.10 The ''son of the soil'' argument can also be better understood
    through the cultural thesis. Thus, the movement reinterpreted, or in Bernstein''s
    (2008) language, deconstructed, cultural representations as language, dress, food,
    and literature.


    # A BRIEF BACKGROUND ON INTER-REGIONAL DIFFERENCES


    The Telangana region was part of the Hyderabad state, ruled by Nizam Osman Ali
    Khan. It constituted a large part of present-day Maharashtra and Karnataka. That
    it was never ruled by the British makes Telangana historically distinct and unique.
    During the Nizam''s rule, Urdu was the official language of Hyderabad (Zahir 2008:
    2), despite the widespread presence of Marathi, Kannada, and Telugu. As a result,'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# The University as a Site of Resistance


    these languages became heavily influenced by Urdu. Telangana became a mixture
    of Urdu and Telugu, and Hindi (dakhini Hindi or Hyderabadadi Hindi) became a mixture
    of Urdu and Hindi. Various versions of Telugu were spoken across the region. With
    the establishment of the largest educational institution in the city of Hyderabad
    in 1918, Osmania University (OU), the Nizam aimed to provide higher education
    in Urdu.¹11 In his quest to promote language and Islamic tradition, he encouraged
    the establishment of more than a dozen Urdu dailies.¹12 Thus, Telangana remained
    underutilized during the Nizam''s rule, and later became a point of contention
    with the merger with Andhra. Hence, the Nizam''s patronage established a distinct
    political culture in Hyderabad.


    As much of the Andhra region had been part of the Madras Presidency under British
    rule, a large portion of Andhra were exposed to and educated in English. In contrast
    with the Telugu of Telangana, Andhra maintained its Sanskrit base. Such variations
    in Telugu further amplified the difference in the two main accents spoken within
    the region. The Telangana accent came to be inferior in the eyes of the growing
    Andhra population in Hyderabad, which dominated the city culturally and politically
    after 1953.


    The roots of Telugu unity can be traced to the beginning of the twentieth century.
    On 20 May 1913, the first Andhra Mahajana Sabha was created, which coined the
    idea of Telugu Talli (Mother Telugu). B.N. Sharma, who later became member of
    the Viceroy''s Executive Council, was instrumental in the formation. Another organization
    Andhra Jana Sangam formed which was the public forum for Telugu separatness from
    Madras Presidency. The Andhra Maha Sabha was formed in 1930 and dominated by the
    communists (CPI) in the mid-1940s (Mantena 2014: 351). Later, the formation of
    Visalandha Maha Sabha in 1949 by P. Sundarajya promoted the idea of a ''greater
    Andhra''. Andhra activists began to promote language as the neutral bond that
    could be cultivated to create a political community in the region. Mantena (2014:
    356) argues that ''regionalism was endorsed by both the CPI and Congress leaders
    in Hyderabad and its ultimately led to calls for severance of the state along
    linguistic lines as the best political situation to a monarchical modernity that
    reached its limits and ultimately demise''. Thus, to many, Telangana''s merger
    with Andhra began at unsecured footing (Mantena 2014).'
