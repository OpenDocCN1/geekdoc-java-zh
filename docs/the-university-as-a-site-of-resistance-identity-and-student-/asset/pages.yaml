    # STUDENT–ALUMNI NEXUS


    Contemporary Osmania campus activism is a continuation part of the historical
    upheaval carried out by the student generation of the 1960s. It is the culmination
    of dreams, inspirations, and aspirations of its alumni and the present students.
    Not all the students arrive on campus with same political aspirations. Some become
    politically involved or inclined because they are recruited by their friends.
    Political aspiration also motivates people to become part of activists networks.
    Everyday informal greeting between old and new activists not only creates a collective
    identity but also the sets of collective decision for rallies and protests. Networks
    provide opportunities for action through the circulation of information about
    ongoing activities, existing organizations, and people to contact, and a reduction
    of the practical costs attached to the participation. They may be the source of
    social pressure on prospective participants (if you go, I will go too), although
    there is possibility of cross-pressure (Kitts 2000; McAdam and Paulsen 1993) and
    of the opposite mechanism, whereby people participate because they do not expect
    others do anything (Olive 1984). Movement scholars underscore how personal ties
    with leaders or influential members inspire participation in protests. Snow, Zurcher,
    and Ekland-Olson (1980, in Crossley 2015: 27) emphasized that ''60% to 90% of
    activists to religious groups were linked with activists before joining collective
    action''. Diani and Lodi (1988, in Crossley 2015: 25) show that in Milan, ''78%
    of activists had prior connections with ecologists before participating in the
    environmental movement''. These studies highlight the fact that personal bonds
    serve to connect prospective activists with an opportunity for protest (Crossley
    2015). The Telangana agitation of 2009 was not possible without the help and guidance
    of Osmania University (OU) alumni who have continued their activism since 1969.'
