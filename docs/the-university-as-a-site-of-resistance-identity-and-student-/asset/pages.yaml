    politics. Therefore, it is rare for a student movement to be fully campus-based
    and concerned mainly with university issues (Altbach 1984: 637). As Touraine (1971:
    332) states, ''the university is not a reflection of society; it is society, because
    it is from now on at the centre of society''s change''.


    Universities have been, as Visvanathan (2016a) defines, the litmus of crisis and
    democracy''. No democracy can survive without the roots of ethical and philosophical
    imagination (Visvanathan 2016b: 10). This is the democratic aspect of a knowledge
    society where ''discipline and dissent strange a relationship''. Visvanathan (1999)
    emphasizes exploring the relationship between the university and liberal democracy.
    He believes that the ''creative power'' will emerge from these two. Student politics,
    their activism, and resistance keep this spirit of democracy alive. In Giroux''s
    (1991: 502) words, the university is ''a site of political and cultural contestation''.
    Thus, the university imports to students ''humanistic values from a humanistic
    approach to form a global community.


    As an institution or organization, the university works as the ''form of mediation
    between theory and practice'' (Lukács 1968: 299). There is a ''symbiotic'' (Pant
    2008: 171) and ''reciprocal relationship'' (Heredia 1996: 66) between university
    and society.28 The university stands in a close relationship to practical life
    and to the needs of the state, it is always concerned with the practical affair
    of training the younger generation (Humboldt 1970: 240; Giroux 1977: 263). Thus,
    universities do not exist in a vacuum; they are very much part of society. In
    all, the university serves as a space of freedom of thought, social resistance,
    and through its activism, textures the traditional fabric of society and brings
    about social change.


    Newman, Blehl, Bombogan, and many others have discussed the liberal role of university.
    Newman (1982: 15), in his popular book, The Idea of a University, writes that
    ''the very name of the university is inconsistent with restrictions of any kind''.
    Therefore, ''it is a mistake to make virtue or religious training the immediate
    aims of the university'' (Blehl 1963). There is a real necessity for this ''universal
    teaching in the highest schools of intellect'' (Newman 1982: 15; Culver 1965:
