  md: '# # New State, Old Narratives


    The political map of India has been drawn and redrawn several times since independence,
    according to recommendations made by the States Reorganisation Commission Act
    of 1953. Demands for new states have reshaped regional power dynamics. Starting
    with Andhra Pradesh, many new states were created, including Himachal Pradesh,
    Kerala, Madhya Pradesh, and Manipur. In the decades since, states and boundaries
    have been shifted for linguistic or political reasons. With the exception of Chhattisgarh,
    all such demands began with protests and undercurrents. The territorial reorganization
    had different socio-political undercurrents. Tillin (2013: 5–6) identifies three
    processes before the state formation: (a) compromise between historic social movements
    and new political parties in the 1970s; (b) challenges to the upper-class dominance
    in the Hindi Heartland by Dalits and Other Backward Classes (OBCs); and (c) Bharatiya
    Janata Party’s (BJP) changed approach to federalism and their emergence as national
    party (also see Heath 2002). On the other hand, Weiner (1978) highlighted the
    ‘sons of the soil’ theory to understand the demand for the statehood.


