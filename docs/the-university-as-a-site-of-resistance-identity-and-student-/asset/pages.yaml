  md: '# The University as a Site of Resistance


    the boundaries of resistance''. Resistance identities are defensive socio-cultural
    formations, and they are products of alienation and resentment in relation to
    the dominant institutions and ideology of society, which make their reasons for
    being no less comprehensible. Resistance identities do not generate the institution
    of civil society because they do not tend to aim at institutional transformation
    vis-à-vis the state (Castells 1997/2001). Castells provides us framework of NSMs
    to understand the Telangana movement. Earlier chapters highlighted that within
    the larger spectrum of the movement, a parallel movement for caste identity assertion
    was taking place. The tradition and trajectories of their (ongoing) struggle can
    help us in understanding the contemporary activism. Gore (1989), Oommen (1990),
    and Singh (2001) agree on the idea that ''movement are not idiosyncratic phenomena
    that have some degree of autonomy in relation to the autonomy of society itself''
    (Singh 2001: 167). Singh (2001: 136–91) raises a question: ''how to comprehend
    and analyze the growing conflicts, contention, protests, demands and assertions
    of people relating to ethnic identity, regional autonomy to nation and sub-nation,
    monopoly over symbolic heritage, language, culture and religious faith...'' In
    other words, the formation of collective identity (of Telangana or any regional
    movement) is primarily cultural which finds its explanation economically, and
    generally manifests itself politically.


    The second theme which we can derive from Telangana movement is the lived experience
    of its activist and its relationship with movements. Telangana movement has produced
    several student intellectuals who later emerged as ''organic intellectual'' (using
    Gramscian term who sees a greater challenge among students as they are not tied
    to the system in the same way like other social groups). The university education
    is not limited to bookish knowledge but it also provides a space where social
