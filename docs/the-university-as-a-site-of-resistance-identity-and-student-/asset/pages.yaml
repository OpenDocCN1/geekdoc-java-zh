  md: '# Preface


    While I was on my morning walk, a small crowd gathered around a tree near the
    library caught my attention. It was the fifth day of my pilot field study at Osmania
    University in Hyderabad in December 2012 and I enjoyed walking around campus,
    observing student life. Inquisitively, I approached the crowd. I thought that
    some students may be protesting or preparing for an agitation that day, which
    is routine at Osmania''s College of Arts and Social Sciences (known as Arts College).
    Making my way through the crowd, I found that they had taken down the body of
    a young student who had hanged himself. One student had tears in his eyes as he
    read the suicide note found on the body. The letter stated the financial crisis
    his family faced and how his education did not lead to a job. The letter concluded
    with an appeal to the government to grant separate statehood to the Telangana
    region in the state of Andhra Pradesh.


    Two students made calls to the funeral of the deceased young man. I heard spectators
    commenting that this area had a ''suicide point''. Listening to the discussion,
    I discovered that the victim was not a student of Arts College but of another
    college of Osmania, and that this was part of a growing trend, whereby outiders
    committed suicide at this ''suicide point''. Later, I returned to Narmada Research
    Scholars'' (NRS) hostel where I was staying.


    After an hour, I noticed a larger crowd of students carrying the corpse, holding
    banners and shouting the slogan ''Jai Telangana, Jai Jai Telangana''. I stopped
    at the nearby tea stall to see if I could understand what the commotion was about.
    Media and police personnel'
