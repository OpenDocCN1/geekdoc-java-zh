  md: '# # 3 Campus Networks and Agitations


    The Making of a Student Activist


    Examining everyday practices extends our understanding of how the processes work
    in any protest or movement.


    Alberto Melucci (1996)


    This chapter attempts to present the ‘lifeworld’ that activists inhabited at Osmania
    University (OU). It examines various networks student activists formed and explores
    the inner mechanisms of their activism. What motivates a student to choose a path
    of activism? How can we understand the campus culture in relation to activists''
    backgrounds and their understanding of the movement? Ethnographic observations,
    interviews with old and new leaders, insights from informal and formal chats and
    discussions, as well as popular slogans from a year of fieldwork from December
    2012 to December 2013 are presented. What elements of daily campus life and culture
    helped in the production and functioning of various networks? How did student
    change the tide to make a mass movement for Telangana? To understand this, the
    ethnographer investigated the spatial practices of activists and became a keen
    participant observer. The chapter discusses how students are inducted to a ‘network
    culture’, trained and made part of the movement on campus and shows how networks
    are rooted in Telangana cultural ethics.


    # ## ORGANIC LINKAGES BETWEEN ACTIVISTS AND CAMPUS


    Sunil parks his bike in front of his college. He gets off slowly as his concentration
    is fixed on the building’s wall which is flooded with


    *The University as a Site of Resistance: Identity and Student Politics.* Gaurav
    J. Pathania, Oxford University Press (2018). © Oxford University Press. DOI: 10.1093/oso/978019948844.003.004'
