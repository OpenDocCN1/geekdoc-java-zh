    As per the university rules, if a student gets government or permanent employment,
    he must vacate the hostel. Yet, since so many students do not gain employment
    or only temporary contract based, many linger beyond their degree or take years
    to complete their studies. Their Telangana identity and their affiliation with
    the movement delays their departure from student life and entry to the workforce.
    In this sense, having free shelter and subsidized food can make this struggle
    more manageable. Many professors acknowledge the trend on public university campuses
    in India of students not leaving the campus until they have government jobs. Some
    even stay on after getting into job, residing illegally/unofficially in the hostel.
    Therefore, the hostel serves as a space not merely for accommodation but as a
    survival space for unemployed youth—boarders and non-boarders alike. In other
    words, the institutional space shared by non-institutional people makes it a more
    open and ‘public’ space.


    In OU, students join any course (irrespective of their interest) to get Arts College.
