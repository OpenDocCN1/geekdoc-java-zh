  md: '# Telanga Activists’ Assertion against the Andhra Culture


    The cultural aspects of the Andhra–Telangana problem overshadowed political and
    economic ones. However, there has been a general tendency to focus more on the
    political aspect of the movement. According to Reed and Alexander (2007), usually
    politically engaged sociologists limit their activism to defending people who
    are unequivocally oppressed. No doubt, this is a final goal but cultural sociology
    can offer another one. They suggest ''we ask how people talk and act in everyday
    situations, which they balance their own judgements regarding what should be denounced
    against what should be maintained, what should be ignored against what should
    be said'' (Reed and Alexander 2007: 94). Thus, cultural sociology has both the
    potential and responsibility to contribute to democratic theory.


    # Cultural Symbols and Festivals


    Culture maintains and sustains itself through history. It is kept alive through
    building monuments, making art, writing books, and producing and maintaining other
    artefacts. The pride of a community, region, or culture is preserved through celebrations
    and eulizing history. In the case of Telangana–Andhra, there was much strife on
    these issues—who and what to celebrate and commemorate. Explaining culture as
    ‘honour’ and ‘self-respect’, senior activist V.K. Rao (2010: 183) states that
    ‘the artistic and poetic talent of Telangana was so neglected as be not on par
    with the youth in the other region, where many such events (such as Andhraubdaya
    Utsavalu) are encouraged in many ways. Yet, culture can be used as a source of
    domination. The merger of a distinct cultural region triggered a series of discontented
    voices among the educated in Telangana. ‘To understand the cultural politics,
    one needs to be not only educated but also conscious enough’, declares Professor
    Rao. To make people conscious about their humiliation and discrimination, Telangana
    employees and students formed new associations and reached out to villages. Towards
    the middle of 1968 the NGO Association demanded implementation of safeguards.
    The founder of Telangana Jagrut, ‘After all, the whole movement has been about
    the reassertion of the cultural identity of the people of this region. I hope
    the government will realise this, and I will'
