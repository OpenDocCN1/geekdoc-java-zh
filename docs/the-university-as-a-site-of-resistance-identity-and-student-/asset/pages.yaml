  md: '# xii


    # Preface


    were sipping tea and discussing the incident as if it was routine for them. As
    I approached Arts College where students were protesting, I saw that they had
    blocked the main road and burned an effigy of the chief minister. Approximately
    25 student leaders took turns addressing the gathering and each renewed their
    demand for a separate Telangana state, chanting,''abhi nhi to kabhi nhi!'' (Telangana,
    now or never!).


    After a few hours of protest, police warned the crowd to disperse but the students
    were determined to stay. In the meantime, government minister arrived and met
    student leaders. I noticed that from all the student leaders speaking to the crowd,
    only one of them could speak English. As a result, he had been nominated to serve
    as the national spokesperson of Osman University–Student Joint Action Committee
    (OU-JAC). He told the media that it was an unfortunate fact that thousands of
    students had lost their lives in the 50-year struggle for separate statehood,
    while the government continues to ''play its dirty politics''. Amidst this rally,
    I was curious to understand how an ''outsider'' could leave the college to commit
    suicide near the Arts College building. ''This is a sacred place for Telangana
    activists,'' one leader told me. While chatting with him, I came to know he faced
    more than 100 criminal charges since he led the biggest agitation in 2009 for
    the same cause. It shocked me even more when he told me, ''There are 50 other
    student activists who are facing a similar number of charges and need to appear
    in court almost every week.'' He expressed himself in broken English with the
    help of his friend. Once he left, I inquired about his age and was told he was
    the senior most student leader of Arts College, more than 40 years old, and had
    gained tremendous respect among students since he took an oath to remain unmarried
    to serve the people of Telangana. There were other activists who had made the
    same promise. During the protest rally, I met a much older man, an alumnus of
    the campus who had written 80 novels and stories, and had vowed to produce a book
    on Telangana every month until it became a state. Such was their passion that
    some students even used ''Telangana'' as their surname. This piqued my interest
    in such an intense movement for statehood that I felt the need to explore this
    university as a site of resistance.


    This book is the outcome of nearly a year of fieldwork in Hyderabad and presents
    an ethnography of activists'' everyday life on campus. How did their activism
    deal with the issues and problems of the Telangana'
