  md: '# DISCUSSION


    The university campus is a site where ‘identities are actively made remade’ (Vennela
    2014) and strengthened. Most of the students who were part of the movement were
    first generation students. Their families had high expectations of them to secure
    a government job in Hyderabad. Thus, they do not necessarily come with the aim
    of engaging in politics or activism on campus. Yet, it is the image of the university
    as an ‘activists’ campus’ that contributes to strengthening their Telangana identity.
    As more and more students from small towns and villages came to Hyderabad to join
    OU, they learned more about the difficulties of settling in Hyderabad. Living
    in the city forced them to think more of their career. Seeing first-hand the difficulties
    and struggle to gain employment coupled with the lack of representation of people
    like themselves in government jobs and positions of power, students from Telangana
    felt the only solution to these inequalities forming a separate state. Thus, the
    university provided the consciousness and understanding of the problems and offered
    a solution. Daily life experiences in Hyderabad magnified reasons to become an
    activist and the university campus provided a safe haven.


    Activists define collective identities in opposition to other groups in society,
    including targeted groups such as the state or countermovement groups. Collective
    identity is an interpretation of a group’s collective experience: who these members
    of the group are, what attribute are, what they have in common, how they are different
    from other groups, and what is the political significance of all this (Whittier
    2002: 3002). It emerges from interaction within movement contexts as participants
    transform their sense of themselves. It is grounded in the group’s social location,
    that is, by its structural position, its common experiences, and dominant feature
    of the group. It, thus, is shaped by forces external to the movement, but it is
    never a straightforward result toward a shared social location. The collective
    identity of JACs fragmented into various segments. On the one hand, it was narrowing
    the collective identity but at the same time, it was democratizing the movement.
    Three ideological concepts—‘Geographic Telangana’, ‘Democratic Telangana’, and
    ‘Dalit-Bahujan Telangana’—represented a vision, strangery and planning for their
    dream state. This ideological grouping'
  merge: -1
