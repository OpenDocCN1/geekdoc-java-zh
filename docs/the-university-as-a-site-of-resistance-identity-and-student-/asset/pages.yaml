    observes that the emergence of print culture established its superiority over
    the spoken, and thus a standard Andhraasha (Andhra language) was established through
    the spread of education and formation of the middle class in the Andhra region.
    This changed the vocabulary and created a wide gulf between the educated and illiterate.
    The trend brought in of the typical middle class respectable terms like and and
    garu (to give regard). These terms spread among various subregions, dividing the
    people vertically along class or cultural lines.


