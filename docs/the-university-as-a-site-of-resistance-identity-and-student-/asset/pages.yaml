  md: '# The University as a Site of Resistance


    demand for separate statehood in 1969 and formed the TPS, rallying widely for
    support. Their collective anger burst onto the streets of Hyderabad in the form
    of the first violent student agitation, accelerating the movement, and creating
    turmoil in the city for nearly a year. Hundreds of students lost their lives in
    these protests, which fuelled more protests and resulted in a mass Satyagraha
    across Telangana. Many students were on the road confronting the police. Jails
    quickly became overpopulated with students, and even students in Telangana were
    used as detention centers. At the movement''s peak, students invited Dr Mari Chenna
    Reddy (MCR), a Congress party leader, to head the TPS. After a year-long failed
    agitation in 1970, student activists set their eyes to the parliamentary election
    of 1971.

    This election was the only hope left for us. We coined the slogan—Employment,
    Status and Pride. We had no experience of except campus election of 1968 which
    was fought on Separate Telangana issues and we won with this hope we were so ready
    to take the challenge and responsibility of parliamentary election.


    In the 1971 election, TPS won 14 parliamentary seats, the most remarkable victory
    in the history of students’ struggle. With high hopes, pamphlets were published
    announcing ‘Telangana State’. However, Reddy’s politicking and the eventual merger
    of TPS with the ruling Congress party led to widespread frustration among students,
    as they lost trust in the state. This new narrative was accepted by those who
    opted for a peaceful approach to remain close to power. But many activists rejected
    the Reddy–Congress regime and imagined a new narrative. Synpath began to sway
    towards the extreme Left with many student leaders joining the Naxal movement
    and People''s War Group. Activism on campus waged and the emotions and forces
    generated by the 1969 movement did not find a political platform. More a decade
    later, students became disillusioned with the Left’s inaction. Nevertheless, the
    vision of a separate Telangana never wavered in the minds of the leading intellectuals
    who had experienced the 1969 agitation and lost friends in police firings. In
    1986, they formed the ‘Telangana Information Trust’, where they penned their experiences
    of the movement. Later, many of them became popular writers and poets. In addition,
    OU alumni formed many socio-cultural organizations such as Telangana Jana Parishad,
    Telangana Mahasabha and Telangana Sanskrit Samakhya, to evoke consciousness among
    the masses.'
