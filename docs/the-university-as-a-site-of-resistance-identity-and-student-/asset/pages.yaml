    groups compete for this trust. Social networks are important channels for the
    recruitment of new students. Diani and McAdam (2003: 33) explain the structural
    function of networks as it operates in two organizations studied. They hypothesized
    that the individuals who have social ties with people already involved in a movement
    organization are more likely to become involved in that organization. For newcomers
    who are not ''connected'', trust becomes an important aspect before joining an
    organization.6 Trust keeps the movement spirit, despite the ''ebbs and flows of
    social interactions'' (Diani and McAdam 2003: 36).


    Activists from different parties on campus compete to win the trust of ''new comer''
    students. Deepak, an student who comes from a lower middle-class family, states:


    Telangana issue very genuine and we are so concerned about having a separate state.
    But I had never thought that I will be so involved in the movement and sacrifice
    my academic career. Sometimes I feel that I was not meant for leadership but it
    was due to the police and government attitude towards us which makes us activists.
    I remember during 2009–2010 agitation, police registered some cases against us.
    My name also came in the list as protesters. When I saw my name, I was shocked
    to see every possible criminal charge made against us. I had sleepless nights.
    My dream of joining academics was shattering. I had no other option except stick
    with the activists and running after court and politicians to remove my charges.We
    had only one hope that if Telangana comes, we will get rid of these charges.


    When new students take admission at Arts College (as well as other colleges),
    activists greet students at the time of admission and offer assistance. They provide
    them with free university admission booklets which feature various student parties.
    For a new student, it is the first exposure to campus politics.


    All student organizations ''publish'' their information booklets. Though they
    all contain the same information—the university syllabus and fee–the cover page
    is added by student unions who wish to advertise their party. Interestingly, for
    this costly coloured, student unions find sponsors, who are generally the owners
    of private engineering or medical colleges. This helps student unions cover the
    cost of these publications. These booklets attract new students who come from
    rural areas, as they think it is the official'
