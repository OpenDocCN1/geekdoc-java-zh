    # OU CAMPUS: A SITE OF DISSENT


    OU is an open, residential campus in Hyderabad, adjacent to the twin city of Secunderabad.
    The campus shares a border with the English Foreign Language University (EFLU).
    The main road that connects EFLU to nearby Vidya Nagar is around 3 kilometres
    long and passes through OU, in there are five bus stops. Most of the university
    departments and hostels are situated along this road (see the route on Map 2.1
    below). OU is a multidisciplinary university, heavily devoted to the social sciences.
    As the oldest and largest university in the region, its alumni have served in
    nearly every sector, from journalism to politics, law, engineering, education,
    and medicine. The history of the movement shows a large participation of social
    science students studying at Arts College who had actively and vibrantly responded
    to the state’s social and political issues. Most of the political leaders in Telangana
    were produced by this campus. The Narmada Research Scholars (NRS) Hostel, also
    known as Dr B.R. Ambedkar Hostel, has been the ‘hallowed abode’ of student leaders
    (Pathania 2015). The college became the ‘sacred’ place for activists, where students
    pay homage to the sacrifices made by their predecessors. It is a common saying
    among students that ‘once you are part of Arts College, you be a Telangana activist
    for life’. From the 1950s, students have contributed to the movement as alumni
    and faculty, by guiding and motivating successive generations. How and why the
    university served as a site of regional Telangana identity assertion is central
    to this chapter.


    OU was established in 1918 by the seventh Nizam of Hyderabad state, Nawab Osman
    Ali Khan, and the university was named after him. It is the seventh oldest university
    in the country and third oldest university in South India. The Nawab believed
    that higher education must have its foundations deep in national consciousness
    and national integration, which he found a tangible reality. While establishing
    the university, his administration felt Urdu to be the appropriate medium'
