    Fasting is just one form of protests, isn''t it? But can it bring any change?
    Can we do opposite of it—cook well and eat well—be more effective?


    To oppose the traditional way of fasting as protest, Telangana students organized
    Vanta Varapu—cooking and eating in public places as roads or railways tracks.
    Through this strategy, they united their fellow students. As one activist pointed
    out, ''Who will come to fast with you and suffer hungry? But everyone will always
    ready to feast. Vanta Varapu strategy also helped building student-mass relations
    stronger and connecting all our activists''


    The form of protest decides the future of movement. In the case of Telangana movement,
    students adopted new network strategies to connect with the masses. Food was used
    as a medium to protest. Students, teachers, politicians, businessmen, doctor,
    lawyers, engineers, civil activists, and daily wage labourers joined these protests
    with their families to participate in the protests. Male and female activists
    helped each other cut vegetables and cook three times a day for everyone in temporary
    community kitchens. More than 20,000 stoves were lit in different locations to
    feed the testers. Every caste and community came up with a unique way of protesting.
    Potters depicted the Telangana flag on pots, drew the map of Telangana and inscribed
