  md: '# The University as a Site of Resistance


    criticizing the Indian state. The media was called in and filmed the event which
    became national news overnight. After right-wing student body, Akhil Bhartiya
    Vidyarthi Parishad (ABVP), complained to the police, the JNU Student Union (JNUSU)
    president, Mr Kanhaiya Kumar, and two others were arrested on 12 February on charges
    of sedition and criminal conspiracy for organizing a programme wherein anti-India
    slogans were raised. The media seized upon the nationalist vs. anti-nationalist
    binary, and some public actions and behaviours were interpreted in these inverse
    categories. Kanhaiya''s time in jail triggered a wave of student activism in India.


    Across universities, thousands of students and teachers participated in protests.
    They voicing dissent is a vital right, not a crime. For weeks, media vans camped
    outside the campus gates. After 20 days of imprisonment, Kanhaiya was released
    on 2 March on interim bail. The entire movement became known as the Azadi Campaign
    or Campaign for Freedom. Kanhaiya Kumar then spoke to a huge crowd gathered in
    front of JNU''s administrative building and raised the slogans: ''We want freedom
    from India, but within India. We want freedom from hunger, freedom from poverty,
    and freedom from caste system''.


    Numerous video messages were posted on social media by army personnel, discrediting
    the university and advising for its closure. JNU was tagged as ''anti-national,''a
    den of drugs, terrorism, and Naxalism''; its students were labelled as ''traitors''
    and ''sex-workers'' by the mass media. These narratives by army and media created
    an image of JNU as social misfits in a ''moral'' society, and overshadowed past
    contributions JNUhad to the country through its scientific research and democracy
    building by questioning the university''s very existence. In its defence, the
    JNU community decided to engage civil society and educate the country about nationalism,
    which they felt grossly misrepresented by corporate media and the ruling government.
    The faculty of JNU, in association with several public intellectuals, delivered
    a series of lectures on nationalism and created a public debate. The lectures
    were filmed and made available online. People immediately started commenting on
    these videos on social media. JNU professor, Gopal Guru (2017), whose lecture
    initiated the series, questioned if government''s ''nationalism'' was territorial
    national-ism. The space where these protests and speeches were held—in front'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    of the administration building—quickly known as ‘Freedom Square’. Thus, to counter
    the existing narratives, students chose protest and debate as a form of resistance.
    Until Kanhaiya’s release from jail, students held massive protests and rallies
    in New Delhi during the day, and every evening, convened with professors for debates
    on nationalism to counter what they saw as the media’s propaganda to defame JNU.
    These month-long protests were, as Professor Nivedita Menon (2016) of JNU writes,
    ‘militant but utterly non-violent’, true to the ethos of the university.


    The anti-national debate opened up many avenues to understand the evils of Indian
    society. Scholars and students questioned and debated who what is nationalist
    and anti-national. Being liberal, gay, feminist, and secular are all anti-national,
    they concluded. Indian public intellectual and Nobel laureate Amartya Sen commented
    that caste itself is anti-national, ‘it divides the nation’.⁵ A version of nationalism
    that places cultural commitments at the core is universally perceived as the most
    conservative and illiber form of nationalism. Historically, nationalism has been
    a major force behind political generational movements from nineteenth century
    onwards. The rise of intellectual ideas, cultural forms, and political ideologies
    also stimulated the formation of political generations (Braungart 1984). It promotes
    ‘intolerance and arrogant patriotism’ (Tamir 1993: 95). Indian scholar Mehta (2017)
    claims that ‘most nationalism is poisonous for intellectualism’


    Scholars and activists expressed their concern over the government’s silencing
    of opposition at universities, condemning it as an attempt to ‘depolitic the campus’.
    Students burned an effigy of the minister of human resource and development (MHRD),
    Smriti Irani, who had been a popular actress in the well-known television series,
    Kyunki Sa Bhi Kabhi Bahu Tu (Because mother-in-law was a daughter-in-law once).
    A writer at The Telegraph penned her reaction to the JNU incident in article,
    ‘Kyunki Mantri Kabhi Student Nahi Thi⁶ (Because she has never been a student),
    criticizing actions by Irani, who allegedly does not have any higher education
    qualifications. Interestingly, the article was blocked immediately after gaining
    popularity on social media, as it evoked common sense knowledge as a tool of resistance.
    The article also carried a statement by Amartya Sen about intolerance. The identity
    of'
