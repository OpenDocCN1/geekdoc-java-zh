    # FOCUS OF THE BOOK


    With a focus on the aspect of regional identity, this book provides an ethnographic
    account of the movement for Telangana’s statehood—one of the longest student movements
    in India—which developed as a protest movement at OU in 1969. This movement was
    a distinct example of the cultural assertion between two regions that speak the
    same language, Telugu, but with different accents. After Indian independence,
    the Telangana region was merged with the Andhra region. This merger ignited the
    demand for a politically separate Telangana. The idea of a separate state was
    first initiated by Telangana employees but OU students took up the issue and spearheaded
    a movement in 1969. Their year-long protests created bedlam in the state. During
    this agitation, hundreds of students lost their lives in police firings. Students
    who sacrificed their careers turned radical, left the union to join extremist
    groups, and took up arms and continued their struggle against state authorities.
    After two decades of ''anti-state'' activities, many students realized that to
    achieve Telangana, they had to find a democratic alternative. They put their trust
    back in the electoral process and formed a new party, the Telangana Rashtra Samiti
    (TRS) in 2001. This gave rise to a renewed aspiration for power among activists.
    The period from 2009 to 2014 served as the second phase of the protest movement.


    After almost half-century-long struggle and countless sacrifices made by students
    and peasants, Telangana was formed on 2 June 2014 as the 29th state of India.
    The government announced Telangana’s formation, demands for separate states across
    India were reignited (that is, Gorkaland from West Bengal, Bodoland from Assam,
    and Vidharbh from Maharashtra). Many of these demands were raised on university
    campuses. What is interesting to understand the origin of these demands among
    youth. What are the backgrounds or circumstances under which such demands turned
    into agitations and movements on campus? In the case of the Telangana movement,
    how did regional identity traverse through campuses and vice-versa? How does'
