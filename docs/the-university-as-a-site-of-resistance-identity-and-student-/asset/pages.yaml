    The movement entered the second phase on 29 November 2009,

    when KCR’s announcement of a fast-unto-death caught national

    attention. At this time, Osmania students played a crucial role: before

    CR began his fast, he ensured he had the support of students. Yet,

    ine days later, when his health started deteriorating, the government

    bec concerned about the consequences of his death. A new nar-

    ative crafted by the Congress government ‘assured’ the creation of

    separate state by forming another commission called the Sri Krishna

    Commission. It was seen as another ‘political betrayal’ in the eyes of

    activists, who sensed a repetition of 1969 with KCR in place of MCR.

    This time, they declared, ‘would not let history repeat itself.’When

    KCR abruptly broke his fast, students cut all with him. They made a powerful attempt

    to reach the masses by forming a JAC—a non-political organization.

    Students were successful in their grassroots outmarch, as the masses also

    ly understood students’ narratives, but also warmly accepted them.

    However, KCR managed to rebound and regained public sympathy by

    helping student padayatras. The period from 2009 to 2013 was char-

    terized by rallies, meetings, marches, agitations, and strikes.


    At the height of the movement, KCR vowed that his party would

    appoint a Dalit as chief minister in Telangana became a state. This

    to was counter the growing popularity of the Madiga (Dalit) leader,

    Manda Krishna Madiga who formed his one party to fight elections.

    However, after TRS won the election with a clear majority, KCR

    and his family members were given key positions. Before he took out

    as the first chief minister of the new Telangana state, he pledged to

    rescind the police cadres against Telangana activists during the

    moment, as well as create one lakh jobs for the new state’s youth.


    Many former student activists received retroactive government

    orders from the police for their involvement during the Telangana

