  md: '# # 1 Telangana Movement

    A Cultural–Political Discourse


    The available literature on the Telangana movement offers historical, political,
    and economic perspectives that define Telangana as a ‘backward’ region and the
    movement as an offshoot to this backwardness. The backwardness generally discussed
    pertains to to the economic standing of the people of Telangana. From the vantage
    point of a fresh perspective, this chapter uses regional culture to understand
    the emergence of the mass movement. It explores the context in which the idea
    of statehood for Telangana took shape and discusses how the movement can be understood
    as a new social movement. The chapter also attempts to understand the contours
    of the movement’s history in terms of how the culture of Telangana was marginalized,
    and how Telangana activists, especially employees and students, mobilized against
    the dominant Andhra culture, leading ultimately to widespread, robust cultural
    assertion.


    # DEBATING THE TELANGANA MOVEMENT\NAS NEW SOCIAL MOVEMENT


    Social movements lead to social transformation (Frank and Fuentes 1987: 1507).
    After the proliferation of the Civil Rights Movement in the United States of America
    in the 1950s and 1960s, university students around the world launched various
    counter-cultural movements and became agents of social change. In the spring of
    1966, a group of Black students at San Francisco State College (now University)
    organized'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# The University as a Site of Resistance


    the nation''s first Black Student Union (BSU), demanding a more inclusive higher
    education system. The ''Black Power'' movement spawned the term ''student power''
    (Ross 1969: 245). Topics such as the psychology of love and the social significance
    of drugs were the major attraction among university students who formed a group
    called Young Americans for Freedom (YAF). As literature highlights, similar attentions
    were led in Italy, Germany, and France (Brand 1983, 1985; Friberg and Galtung
    1984; Paris 1981; Roth 1984; Rucht 1982;Touraine 1981, 1985). Scholars such as
    Alain Touraine (France), Alberto Melucci (Italy), Jurgen Habermas (Germany), and
    Manuel Castells (Spain) recognized that the existing ''ideological'' Marxist class
    paradigm was unable to provide a convincing explanation as to why students had
    become the figures of protest (see Lee 2007: 52).


    One of the central figures of the ''New Left'' was the Columbia University sociologist,
    C.W. Mills His Letter to the New Left (Mills 1960) became the manifesto for student
    organizations who criticized the Left and classical Marxism. The ''New Left''
    questioned the nature of universal Marxism and tried to compose a ''surrogate
    universal'' (Gitlin 1995: 313). The idea of universal mass movements was rejected
    as students claimed that ''mass movements were nothing more than theoretical movements
    for themselves'' (Gitlin 1993, 1995). The scholarship of Touraine, Melucci, Habermas,
    and Castells explains the emergence and character of these new movements as New
    Social Movements (NSMs) in a global context. Contrary to the (working) class base
    and ideology of old social movements, NSMs of the 1970s drew their support from
    a different social class base, as gender, age, race, sexuality, ethnicity, and
    region (see Melucci 1980, 1985, 1989) made up of new social actors². The women''s
    movement, anti-nuclear protests, environmental movement, gay rights, animal rights,
    minority nationalism, and ethnic movements were all considered NSMs. In short,
    according to Crossley (2002: 10), NSMs arose from a contradiction between Marxist
    and Hegelian tradition of the philosophy of history. This, according to scholars,
    marked the beginning of a distinction between old and new forms of movements,
    and became a free addition to social movement literature. Thus, scholars have
    sought to break down the conventional theoretical distinction in the field between
    political process, resource mobilization, and NSM theories (Ferree 1992; Johnston
    and Klandermans 1995;'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Telangana Movement


    Meyer 1999; Morris and Mueller 1992; Polletta 1999). NSMs arise within the sphere
    of ‘cultural reproduction of social relations, symbols and identities’ (Melucci
    1980) and are ‘specific to history and social structure’ (2001: 40). According
    to NS theorists, identity movements seek to transform cultural patterns or gain
    recognition for new social identities by employing ‘expressive’ strategies (Cohen
    1985; Melucci 1985, 1989; Touraine 1981). According to Kries and Giungi (1995:
    xxii) the development of NSMs is ‘ultimately rooted in structural and cultural
    transformation that characterize all Western and European countries’.


    Identity has an ontological and epistemological status (Somers 1994: 606). Cultural
    identities—religious, national, regional, and ethnic identities—are more fluid
    and may be public or private depending upon historical context. Duncombe³ (2002:
    5) explains, ‘culture is used, consciously or unconsciously, effectively or not,
    to resist and/or change the dominant political, economic, and/or social structure.’
    He points out that some forms of cultural resistance can be dismissed as an ‘escape
    from politics and a way to release disenchant that might otherwise be expressed
    through political activity’ (2002: 6). However, there is an emphasis on both macro
    and micro historical elements. Resistance based on culture explains the use of
    such categories.⁴


    Political theorists are increasingly coming to realize that cultural dynamics
    are central to the origin and development of social movements.⁵ Culture, ideas,
    belief systems, rituals, oratory, emotions, and grievance interpretation are central
    to social movements. Social movement scholars analysed cultural processes as elements
    of political opportunity (Ferree et al. 2002; Meyer et al. 2002; Gamson and Meyer
    1996; Steinberg 1999). Polletta (2004) also considers the role of culture in mobilization.
    Like Goodwin and Jasper (2003), Polletta (2004:97) believes that we can usually
    adopt a less anaerobic conception of culture than some social process analysis
    has without making actors, interests, strategies, and resources simply figures
    of a culturalist imagination’ about who we are, how we live, and who is accountable,
    rather demanding fair remuneration and improving working conditions (Haberas 1981;
    Klandermans, Kries, and Tarrow 1988; Melucci 1985). In short, the core characteristics
    of NSMs are derived out of lived experiences, which are very much rooted in the
    culture of everyday life. In their'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'work on contentious politics, McAdam,Tarrow, Tilly (2001) argue that, at most,
    there is a fine line between social movements and the politics of everyday life.6
    Laraña, Johnston, and Gusfield (1994: 7) call it the ‘democratization dynamics
    of everyday life’. Habermas uses ‘life-world’ to describe this everyday phenomenon.7


    According to Buechler (1995: 458), there are two versions of NSM theory: political
    and cultural. The cultural version emphasizes the symbolic explorations and expressions
    of identity that precisely challenge the instrumental logic of systemic domination’.
    The political version of NSM is post-Marxist and draws upon the most promising
    work in neo-Marxist scholarship, seeking to build upon the strength of this tradition.


    Buechler (1995: 457) argues that the political version of NSM is more concerned
    with strategic questions and instrumental action as the ultimate goal of social
    movements while recognizing the importance of identity formation, grievance definition,
    and interest articulation as intermediate steps in the process of movement activism.
    Table 1.1 outlines political and cultural versions of NSMs.


    Since the social construction of identity always takes place in a context marked
    by power relationship, Castells (1997/2001: 7–8) proposes a distinction between
    forms and origins of identity building: legitimizing identity, resistance identity,
    and project identity. Social movement theories tend to view power as state and
    rooted in the political and economic structure of societies. Polletta (2004: 98)
    argues that when political opportunities are structural and not cultural, activists’
    capacity to take advantage of those opportunities is cultural. Culture provides
    a structure and context which helps in expressing our behaviour, our identity,
    status, and emotions. Therefore, understanding a movement from the culture unfolds
    deeper realities of lived experiences. Scholars (Bernstein 1997,2005;Polletta
    and Jasper 2001) establish a link between identity and social movements through
    cultural identities. Identity exists in the social structure which may be dignified,
    stigmatized, or derogatory according to contexts. Identities are integrally related
    to structure and interest (Bernstein 2008: 287).


    NS do not arise from relations of production and distribution of resources but
    from within the sphere of cultural production and the life world, and from the
    need to ‘create cultural alternatives in everyday life that seek to escape from
    the state, not influence or seize it’'
