  md: '# The University as a Site of Resistance


    the university student became central to the intellectual’s argument of student
    agency and one’s lived experience’ as part of an institution. JNU students’ cause
    resonated across the globe, gaining support from international academia, from
    Berkeley to Yale, from Columbia to Cambridge. More than 100 scholars, including
    Noam Chomsky, Orhan Pamuk, Judith Butler, Arjun Appurai, Partha Chatterjee, and
    Homi Bhabha released a public statement solidarity with JNU and freedom of expression
    in India⁷ Student unions and university intellectuals questioned why politics
    is seen negatively by the government and the masses. Several government ministers
    remarked against JNU. Messages like ‘JNU produces anti-nationals and terrorists.
    You should get out of the country. Long Live India, shut down JNU’ and ‘Shoot
    Anti-National JNU Students & Profs’ went viral on social media (Washington Post
    9 March 2016; Telegraph 15 February 2016). It was rumoured that a proposal surfaced
    to change the name of the university to disassociate it with its legacy of student
    activism.


    After the national-incident, JNU as a public institution was compelled to prove
    its ‘nationalist’ credentials, and hoisted, for the first time, the flag at the
    administrative building. To further instill the feeling of nationalism among students,
    JNU vice-chancellor (VC) Jagdish Kumar requested the Indian Army to install an
    artillery as a memorial for the country’s martyrs. At the same time, the University
    Grants Commission (UGC) ordered a new admission policy for research universities
    to limit student intake. Several activists were given rustication notices by the
    administration. Students showed their resentment by rallying together against
    the policy, saying that this policy would kill the spirit of an ‘inclusive university’⁸
    Later, the administration implemented a new policy of marking students’ compulsory
    attendance—an unprecedented move for JNU. In Foucauldian terms, it is ‘disciplining
    the bodies’, which is a strong practice in schools, but itself stands against
    such rules. Predictably, the announcement met with strong protests by teachers
    and students alike. Compulsory attendance in universities in general, and in research
    universities in particular, does not appear to be rooted in academic wellbeing
    of the students, says Swain (2017), an alumnus.With ‘no problem of mass absenteeism’,
    JNU professor, Pathak (2017b), questions the new rule:‘Not everything, the administration
    should know, can be accomplished through surveillance, CCTV cameras and the registers'
