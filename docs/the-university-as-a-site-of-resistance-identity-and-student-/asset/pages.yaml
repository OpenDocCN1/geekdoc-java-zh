    # IDENTITY NETWORKS AND ACTIVISM ON CAMPUS


    Networks played an essential role in the mass movement for Telangana statehood.
    Students were mobilized on their cultural identity of belonging to Telangana as
    well as their caste background, since the vast majority of students at OU belong
    to backward classes (OBC), scheduled caste (SC), and scheduled tribe (ST) communities.
    Melucci (1985,1986) places great emphasis on the role of everyday processes of
    networking, learning, and construction of making in a social movement. Networks
    are consciously organized to protest and demonstrate. Everyday practices can ‘develop
    and establish relationship of cooperation, learning a culture of experimentation
    with political idea that everyday life³ (Yates: 2015: 238). The everyday life
    of an activist in a university campus influences students and shapes their aspirations
    for Telangana state. What follows is an account of one activist the researcher
    observed. It demonstrates the web of networks an activist creates around himself,
    in order to ‘get the work of the movement done’, as they say.


    The day is 14th April, the birth anniversary of Dr B.R. Ambedkar, the father of
    the Indian Constitution. It is a busy day for Manish as he'
