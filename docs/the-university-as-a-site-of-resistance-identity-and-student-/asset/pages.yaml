    The NSM framework offers a fresh way to analyse the Telangana movement. Functionalist
    and dialectical Marxist frameworks assume the identity of individuals and their
    action and subjectivities in favour of a formalized non-human structural image
    of society (Singh 2001: 157). The substantial movement in Assam and the demand
    for Jharkhand are examples of NSMs, according to Singh (2001: 206). Three major
    themes emerge which help us understand the regional movement for a separate Telangana
    state. One theme is identity, second is culture, and third is the decentralized
    nature of the movement with the emergence of civil society. These themes are appropriate
    to understand the Telangana movement as a cultural movement. Scholars (Pingle
