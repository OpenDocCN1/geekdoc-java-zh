    coloured posters and pamphlets of different student organizations, both in Telugu
    and English. Pictures of student leaders overpower the text. He closely examines
    them and finds his own picture in his organization''s poster. This gives him deep
    satisfaction, and with confident look on his face he walks up the stairs and bows
    his head in front of the building. As he walks into the corridors, the guard and
    person of the building greet him with ‘Namastey Anna’ [Hello, brother], and he
    reciprocates the greeting. His doctoral supervisor approaches him from the opposite
    direction and nods his head to greet. His guide shakes hands with him. Sunil replies,
    ‘Nenu bagunanu’ [I am fine]. They spend a few minutes chatting over a cup of tea.
    Sunil invites his guide for a post-lunch protest organized by student union. He
    comes out of the college building and rings some of his friends asking him to
    bring the banner for the protest. Within half an hour, there is a small tent set
    up in front of the building. In no time, almost 50 activists gather together shouting
    Jai Telangana and give speeches to the standing audience. The principal of the
    college delivers a 10-minute speech. Non-teaching employees of the university
    aggregate in a corner, sipping tea and chatting, glancing at numerous posters
    on the wall. Meanwhile, students on bikes continue to arrive. In the next 10 minutes,
    media vans are seen buzzing around. Sunil and three other leaders speak to the
    Telugu media and warn the government that if they not form a separate statehood,
    students will sacrifice their lives for Telangana. When the media leaves, Sunil
    mounts his bike with two other activists, both on their phones, set out to mobilize
    more students in the hostels for an upcoming protest organized by the students’
    Joint Action Committee.


    The scene described above is typical of Arts College, the most popular and prestigious
    college among 400 affiliated colleges of OU. This college served as a popular
    landmark for activists’ meetings and the epicenter of Telangana activism. The
    majestic Arts College is made of pink granite and a grand archway at the centre
    is flanked by huge doorways. In front of this is a long, ornamental fountain.
    Most of the meetings are held inside this building. Strikes, public gatherings,
    sit-ins, rallies, and processions are held in front of the building, known for
    its awe-inspiring facade.


    Arts College is surrounded by small parks which are maintained by the college
    administration. During the evening, students gather here'
  merge: -1
  pgno: 127
