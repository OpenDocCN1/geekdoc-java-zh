    movement, but more importantly, it points to how the movement affected all aspects
    of life. Marriage, personal appearance and dress, vocation and lifestyle were
    all confronted with the mission of Telangana independence.


    Among left-wing students, there is also a trend to oppose traditional forms of
    rituals and celebrations. There were occasions when the Left students were married
