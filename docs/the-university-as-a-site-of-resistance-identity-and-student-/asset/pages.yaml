    In an effort to forge unity among people of the Telangana and Andhra regions,
    N.T.Rama Rao (NTR) offered a new narrative called ‘Telugu Unity’: Telugu Jathi
    Manadi, Ninduga Velugu Jathi Manadi (Ours is a Telugu nation, ours is a flourishing
    nation).Yet, many saw this as a ploy to distract from the Telangana cause. Telugu
    unity was just another narrative, according to Srinivasulu (2012), a myth invented
    by Andhra people to justify their exploitation and oppression of the Telangana
    region’. In reality, it ‘Andhra Unity,’ Ramesh a 1969 activist claims. ‘In governments’,
    Telangana does not even exist but this identity is well documented in our minds’.
    Most of the actors involved in agitations and protests were the university educated
    class.


    Similarly, Telugu Talli is another narrative created by the state to keep Telug
    united by promoting common linguistic and cultural heritage. New departments were
    established in universities to enhance research on Telugu language and literature.The
    song, Man Talli ki Mali Poanda (A jasmine garland for our mother of Telangana),
    was at every government office function. During the Telangana movement, activists
    rejected Telugu Talli and coined Telangana Talli. Later, at the peak of the movement,
    Dalit activists questioned whether Telangana Talli representing the real mother
    of Telangana’. Instead, they chose to celebrate Chakali Illamma as Telangana Talli.
    After Telangana became a state, Joint Action Committee (JAC) leaders and government
    planned to erect statues of her across various districts of Telangana.


    When the Indian government created new states of Jharkhand, Chhattisgarh, and
    Uttarakhand, rekindled among Telangana supporters. They pushed their agenda to
    the national-level authorities. In 2001, with the help of intellectuals, activists,
    and politicians, the TRS formed under the leadership of K. Chandrashekhar Rao
    (formerly KCR) and Telangana activism experienced a robust revival. Many activists
    had reservations with KCR and feared history would repeat itself, as they compared
    him to MCR. From this onwards, through various programmes, pamphlets, and songs,
