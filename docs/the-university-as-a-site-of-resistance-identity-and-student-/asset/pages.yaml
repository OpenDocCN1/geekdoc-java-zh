    # THE TELANGANA MOVEMENT AS A CULTURAL MOVEMENT


    The student movement for Telangana became a mass movement where students, with
    their diverse forms of activism, engaged civil society to make a cultural movement.
    In this sense, we may safely argue that the Telangana movement is not just political
    (as it projected), but also civil and intellectual in orientation, which manifested
    itself onto the political platform. The movement’s group of intellectuals have
    been trying to rewrite the history of Telangana to emphasize its culture in contrast
    to Andhra culture. Analysis of the movement’s debate in light of the discussion
    on NSMs suggests that cultural politics is at the heart of identity building for
    Telangana activists. Cultural mobilization that occurred through micro-level social
    and political events entered into cultural radicalization within existing institutions
    like universities, schools, art and folk traditions. With various ideological
    contours, the Telangana movement gained political maturity. Table 1.3 offers an
    analysis of the Telangana movement through old and new social movement’s frameworks.


