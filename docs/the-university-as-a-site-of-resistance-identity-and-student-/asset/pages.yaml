  md: '# 2 Osmania University

    Academics, Culture, and Politics


    For the past five decades, Osmania University (OU) has regularly made headlines
    due to the robust participation of its students in the movement for Telangana
    statehood. The university has produced several activists who later became part
    of mainstream politics and university faculty. Due to its constant student activism,
    OU has popularly been referred to as ‘Telangana University’. The widespread notion
    that the ‘movement is the business of Osmania’ is explained here, highlighting
    Osmania’s role throughout the various phases of the movement. The Srikrishna Commission
    Report (SCR) on the question of bifurcation notes that OU and Kakatiya University
    became ‘trouble spots’ and ‘trouble creators’ during agitations (Srikrishna Commission
    2010: 51–2). OU has been the nerve centre for every agitation, street, meeting,
    or debate for a separate Telangana. Lipset (1968) argues that ‘intellectuals and
    students have a major potential mass base for new movements, and they remained
    a source of radical leadership and mass support while other elements of society
    have not’. The word ‘intellectual’ has a wide connotation and this chapter explains
    how, due to the movement for separate Telangana, intellectuals established organic
    links with the poor working classes through their art, music, writings, and speeches.
    This chapter illustrates how a culture of resistance was created by intellectuals
    (students, alumni, and teachers) and how their activism made the mass movement.
    Focuss primarily on out-of-the-class ethnographic material, this chapter


    The University as a Site of Resistance: Identity and Student Politics. Gaurav
    J. Pathania, Oxford University Press (2018). DOI: 10.1093/9780199488414.003.003'
