  md: '# Campus Networks and Agitations 111


    to have tea at one of the nearby food stalls. The park is a common site for students—whether
    activists or not—to meet informally. This space is of historic and symbolic significance
    to the spirit of the movement. In many ways, the park served as the interface
    between the student movement and the general public. Every evening, families and
    friends from the nearby areas come to pass their leisure time. As a result, they
    have become spectators to the frequent protests at the Arts College. The area
    is large enough to hold rallies and state level protests. As it is located on
    the OU main road, it gathers crowds from the passing traffic, pedestrians, and
    local tourists. From this road, passers-by are able to view the college and park.
    People sitting in the park view the posters, banners, and flags set up by the
    students on daily basis as programmes are frequently organized by various student
    unions, even after the state’s formation. OU alumni who fondly recount their time
    at Arts College and remember the martyrs of the 1969 agitation. Thus, for nearby
    residents, the Arts College main building is the symbol of struggle, dedication,
    and activism.


    During the 2009 agitation, students held a rally called Vidyarthi Maharaja. Newspapers
    estimated that around two to three thousand people participated. Students did
    not vacate the park for nearly a month. They played revolutionary songs, dramas,
    and gave speeches alongside activists. During field research in 2013, the OU Madiga
    Students’ Front organized a massive meeting, which was addressed by the popular
    Madiga leader, Mr M. Krishna Madiga. During this rally, more than 50 news cameras
    covered the event. Media vehicles packed the road. Students from Kakatiya and
    other state universities joined the rally and called their relatives to join,
    making it a family affair.


    Although the park is a public space, it serves as an ‘identity affirming space’
    (Carter 2007). This kind of space is qualitatively different than other public
    spaces as it is an expression of society. Castells (1983) aptly states, ‘Space
    is not a reflection of society; it is society’. This society, rooted in local
    culture, has its linkages with the *Telangana movement*. It is the extension of
    the Arts College. Sunder, a vendor who sells snacks in the park every day from
    11 am to 9 pm shares his viewpoint with a shy expression:‘I wish there is agitation
    everyday … it will bring more business. Without these rallies or protests, this
    park and my business both seem lifeless.’1'
