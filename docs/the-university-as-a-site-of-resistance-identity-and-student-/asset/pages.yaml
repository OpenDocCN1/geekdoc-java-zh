  md: '# Learning from the Past, Imagining the Future


    Ross (1975), in his study, ‘Students for a Democratic Society’, in the United
    States of America, argues that social movements tend to have a generational character.
    Scholars (Altbach 1974; Braungart and Braungart 1990; Lipset and Schaflander 1971)
