    # POLITICS OF NARRATIVES


    Generally, a social movement provides counter-narratives to existing narratives.
    These new narratives gradually become part of our socio-cultural understanding.
    The history of Telangana regional politics has been a history of countless narratives
    by the government of ‘constituting,’ ‘establishing,’ ‘forming,’ and ‘setting up’
    dozens of ‘safeguards,’ ‘committees,’ ‘commissions,’ ‘agreements,’ ‘pacts,’ ‘government
    orders,’ ‘official statements,’ ‘negotiation,’ ‘promises,’ ‘assurance,’ and so
    on. These words appear thousands of times in the modern history of Telangana politics.
    The Telangana movement engaged with the state by opposing government policies
    known as ‘safeguards’ says Dr A. Gopala Kishan, who was one of the founding fathers
    of Telangana Pra Samiti (TPS). According to him, ‘none of our interests—relating
    to health, education, self-governance, and sale of agricultural lands—was safe-guarded.’^3
    These ‘safeguards’ were planned to ensure equal development in the region, but
    many of them were never implemented. Yet, they remained part of the state’s narrative.


    The first chapter highlights the discrimination, humiliation, and neglect of Telangana
    people and culture, specifically in government employment and financial allocation
    by the ‘dominant’ culture of Andhra. Employees hailing from Telangana faced constant
    humiliation as their culture and accent were considered ‘inferior.’ As OU is located
    in the capital city of Hyderabad, its students recognized the cultural politics
    at hand. When agitations uphold the policy of safeguards were repeatedly ignored
    by the government, OU students raised'
