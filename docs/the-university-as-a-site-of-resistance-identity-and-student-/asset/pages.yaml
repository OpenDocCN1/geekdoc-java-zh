    to the ruling party ruling at the centre. The cards also show their pride in declaring
    themselves part of the Telangana movement. Ever-present is the OU logo and the
    slogan Jai Telangana (Long Live Telangana). When asked ''why only Jai Telangana,
    why not Osmania?'', an activist replied, ''See brother, everyone knows that [students]
    are all from Osmania. But our visiting cards are temporary. We are fighting for
    our Telangana identity which is our permanent affiliation. We have printed our
