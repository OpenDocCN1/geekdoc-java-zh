  md: '# About the Author


    Gaurav J. Pathania is visiting scholar at University of Massachusetts, Amherst,
    USA, and also associated as post-doctoral researcher with Pullias Centre for Higher
    Education at the University of Southern California. He completed his PhD in sociology
    of education from Jawaharlal Nehru University, New Delhi, and served on an international
    project with University College London that explored the distress and discrimination
    in Indian higher education. His articles and reviews have appeared in journals
    such as South Asia Research, Economic and Political Weekly, and Cafe Dissentus.
    His latest research paper, published by the European Higher Education Society,
    explores the caste and class discrimination among university students. Relying
    primarily on ethnographic method, Pathania''s research applies insights from cultural
    sociology to understand social movements in education, and critically examines
    contemporary student activism and its global networks of solidarities.


    Pathania has also contributed to various literary journals. He is the winner of
    the All India Poetry Competition 2016, organized by the Poetry Society (India).'
