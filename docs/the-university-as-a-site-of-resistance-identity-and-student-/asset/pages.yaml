    # HOSTEL AS AN ABODE FOR CAREER ACTIVISTS


    During their campus stay, students spend a considerable time in the hostel. Osmania
    campus has 24 hostels, and most of them are named after Indian rivers: Godavari
    (A), Krishnaveni (B), Kaveri (C), Thunghadhra (D), Gowthami (E), Bhagirati (F),
    Narmada (Old PG), Research Scholar Hostel (NRSH), Yamuna (New PG), Maneru Hostel,
    Pinakini, Manjeera, Kinnera, Ganga, Swarnamuk, Sutlej, Gomathi, Saraswati, Pranahita,
    Triveni, BEd Hostel, Hi-Tech Hostel, Technology Hostel, and the Ladies Hostel.


    A hostel E-1 (Gouthami hostel) is located in Law College on the busiest road of
    the campus.This hostel is located 20 paces away from the main road.The area between
    hostel and the main road is bordered by low bushes and small trees. This semi-private
    area, some students bathe in the open in front of the hostel.This is the everyday
    scene of life in hostels, though it may look like a village scene.


    There are separate hostels for research scholars and postgraduate students. One
    of the important aspects of hostel life is that there are more ''outsiders'' in
    the hostels than ''insiders'' or enrolled students. Outsiders are also referred
    to as ''non-boarders'' while hostel students are called ''boarders''. There is
    no strict rule on campus almost and every room, which is allotted to one person
    officially, has two or three people. In some of the older hostels, rooms are comparatively
    large and allotted to three students, but oftentimes more than five live there.
    During fieldwork, the researcher found that nearly every room hosted at least
    one non-boarder, and if the room belonged to a student leader, they often accommodated
    as many as four guests. This makes this hostel life a community. Since the mess
    hall only serves food to boards have cooking utensils and a small stove to prepare
    food in the room. An electric rice cooker is present in nearly every room. During
    a focus discussion, a senior activist stated that ''until 2005, when there were
    used to be both of Andhra students, hostels were providing Andhra meals, and gradually
    we started boycotted their food food item''. Plain rice, daal or sambhar, and
    home-made pickle make up their staple'
