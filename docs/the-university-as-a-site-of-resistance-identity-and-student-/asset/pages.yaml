    not only rekindled activists'' aspirations and mobilization process for separate
    statehood, but also highlights intellectuals'' contributions to the movement.
    One can argue that it fragmented the movement and put it on the righthar path.
    Looking at it from another point of view, the movement can be understood as an
    identity-resistance movement, in which caste and sub-caste identity mobilization
    affected its internal structure. It helped the marginalized section to gain pride
    in their identity.


    Telangana movements brought together individuals from different social locations
    at one platform. The comparison of 1969 and 2009 generations of activists provides
    important similarities and differences. For example, the state repression was
    so severe in 1969-72 agitations but there was no suicide during 1969 agitation.
    On the other hand, during 2009–13, several students committed suicide for statehood.
    This explains how external dynamics (state and power structure) influence the
    movement actors'' decisions and strategies. By 2009, students had lost hope. The
    strength of the 2009 movement, compared to the 1969 one, lies in the activists''
    awareness and pride in collective identity of Telangana, their cultural understanding
    of the movement, which created a feeling of self-empowerment through identities
    that were inward-looking. Due to caste and sub-caste JACs, identity of Telangana
    was constantly negotiated as the specific question of ''whose Telangana is this?''
    became the central question of the movement. Dalit-Bahujan Telangana, Madiga Student
    Union focused more on identity empowerment.


    In other words, caste-based groups have a strong presence on campus, but all these
    groups culminated into a common platform of JACs. Under the broader umbrella of
    OU-JAC and TS-JAC, several internal structures like caste, minorities, and region
    played a crucial role. The strategies and goals of these JACs were largely shaped
    by the media, local politics, and state and national politics. Moreover, political
    culture of Osmania campus and youth leadership as well as an individual''s aspirations
    contributed to more dynamic and powerful protests and agitations, posing threats
    to the existing structures of state power and politics. Thus, individual, culture,
    and structural transformation are inseparable (Whittier 2002: 306). In caste-based
    JACs, activists explored caste connections within and outside the country (among
    diasporas) to widen their'
