    ‘us vs. them’, ‘bourgeois vs. proletariat’, or ‘Hindu vs. non-Hindu’ and so far,
    are fixed. These leaves little scope for any change in ideology.


    The narratives of Telangana ideologies justify the movement as a struggle for
    identity and autonomy, and rationalize it as a struggle against dominance, exploitation,
    discrimination, deception, and humiliation (Srikanth 2013: 42). Political parties
    not only ignored the socio-cultural history of the state also bypassed the people’s
    aspira- tions. Hundreds of student suicides were labelled as ‘political strategy’.
    Radical left parties used students energy for their party interests while Telangana
    was given only a mention in their agendas. Amidst all this, OU intellectuals’
    efforts over half a century to research and understand the Telangana problem of
    writing and publishing lit- er, forming organization, and mobilizing masses finally
    achieved success. What is important to understand is that a movement occurs when
    the inequality becomes intolerable and there is no space left for negotiation.
    It occurs when there is no other option left, when representation redundant, and
    existence becomes meaningless.


    The Telangana movement is the combination of various identities assertion and
    above mentioned challenges. grouping, organiz- tion, mobilization, and the strategies
    of the movements are loose and unstructured in these new movements. The changing
    student (social) composition also changed the context of higher education, which
    led to the identity assertion. It takes us back to the question that Bernstein
    (2008: 289) asks: ‘How do movements negotiate identity for empowerment when the
    identity around which the movement is organised is also the basis for grievance?’
    It also provides insight to understand the weakness of the Telangana movement.
    Before the movement is unified, it splintered into various caste and sub-caste
    groups. The process of formation of Telangana identity and caste assertion did
    not work in tandem. In fact, unlike the assertion of caste and sub-caste identity
    occurred before Telangana. In other words, lower castes were doubly deprived of
    their identity as Dalit and being Telanganaite. On the other hand, upper castes
    appeared to have a single agenda—of attaining statehood. Caste appeared as a dividing
    factor among Leftist parties but also at the same time, it was making a collective
    identity for Dalits. Ideology of Dalit-Bahajan Telangana ignited aspirations of
    all the lower castes, including OBCs. Therefore, caste issues may not be the primary
    agenda item in their'
