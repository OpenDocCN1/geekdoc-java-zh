    mask, and when the mask comes off, there''s a monkey mask underneath. To find
    out what''s behind the monkey mask, you have to watch the series on DVD. But in
    the meantime, notice: a mask within a mask. You can do the same kind of thing
    with if statements. This section''s example shows you how.'
