  md: '# # Chapter 15


    # # The Old Runaround


    **In This Chapter**


    +   - Creating repetitive techniques

    - Improving your nesting techniques

    - Insisting on a valid response from the user

    - Looping through enumerated values


    I remember it distinctly — the sense of dread I would feel on the way to Aunt
    Edna''s house. She was a kind old woman, and her intentions were good. But visits
    to her house were always agonizing.


    First, we''d sit in the living room and talk about other relatives. That was okay,
    as long as I understood what people were talking about. Sometimes, the gossip
    would be about adult topics, and I''d become very bored.


    After all the family chatter, my father would help Aunt Edna with her bills. That
    was fun to watch because Aunt Edna had a genetically inherited ailment. Like me
    and many of my ancestors, Aunt Edna couldn''t keep track of paperwork to save
    her life. It was as if the paper had allergens Aunt Edna''s skin crawl. After
    ten minutes of bill paying, my father would find a mistake, an improper tally,
    or something else in the ledger that needed attention. He''d ask Aunt Edna about
    it, and she''d shrug her shoulders. He''d become agitated trying to track down
    the problem, while Aunt Edna rolled her eyes and smiled with ignorant satisfaction.
    It was great armament.


    Then, when the bill paying was done, we''d sit down to eat dinner. That''s when
    I would remember why I dreaded these visits. Dinner was unbearable. Aunt believed
    in Fletcherism — a health movement that followers chewed each mouthful of food
    100 times. The more devoted followers used a chart, with a different number for
    the mastication of each kind of food. The minimal number of chews for any food
    was 32 — one chop for each tooth in your mouth. People who did this said they
    were "Fletcherizing."'
  merge: -1
