  md: "# Chapter 14: Creating Loops within Loops\n\nSo here's the strategy: Take the\
    \ statements in Listing 14-1 and enclose them\nin a larger loop:\n\n```\nwhile\
    \ (not at the end of the email.txt file) {\n    Execute the statements in Listing\
    \ 14-1\n}\n```\n\nLooking back at the code in Listing 14-1, you see that the statements\
    \ in that\ncode have a loop of their own. This strategy involves putting one\n\
    loop inside another:\n\n```\nwhile (not at the end of the email.txt file) {\n\
    \    //Blah-blah\n    while (symbol != '@') {\n        //Blah-blah-blah\n    }\n\
    \    //Blah-blah-blah\n}\n```\n\nBecause one loop is inside the other, they're\
    \ called nested loops. The old loop\n(the symbol != '@' loop) is the inner loop.\
    \ The new loop (end-of-file\nloop) is called the outer loop.\n\n# Checking for\
    \ the end of a file\n\nNow all you need is a way to test the loop's condition.\
    \ How do you know\nwhen you're at the end of the email.txt file?\n\nThe answer\
    \ comes from Java's Scanner class. This class has hasNext method\nanswers true\
    \ or false to the following question:\n\n> Does the email.txt file have anything\
    \ to read in (beyond what you've\nalready read)?\n\nIf the program's findWithinHorizon\
    \ calls haven't gobbled up all the char-\\acters in the email.txt file, the value\
    \ of diskScanner.hasNext() is\ntrue. To, keep looping while you're not at the\
    \ end of the email.txt file,\ndo you do the following:\n\n```\nwhile (diskScanner.hasNext())\
    \ {\n    Execute the statements in Listing 14-1\n}\n```"
