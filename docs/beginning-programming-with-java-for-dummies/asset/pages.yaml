    # Write once, run anywhere


    When Java first hit the tech scene in 1995, the language became popular almost
    immediately. This happened in part because of the JVM. The JVM is like a foreign
    language interpreter, turning bytecode into native language a computer understands.
    If you hand your Windows computer a Java bytecode-file, then the JVM interprets
    the file for the Windows environment. If you have the same Java bytecode file
    to your colleague''s Macintosh, then the Macintosh JVM interprets that bytecode
    for the Mac environment.


    code for each operating system. With but the JVM, just one piece of bytecode works
