  md: '# Chapter 4: Exploring the Parts of a Program


    **chocolate** (choc-o-late) *n.* 1. The most habit-forming substance on earth.

    2. Something you pay for with money from royalties. 3. The most impor-tant nutritional
    element in a person''s diet.


    **FixTheAlternator()** Drive the car into the bay, lift the hood, get the wrench,
    loosen the alternator belt, and then eat some chocolate.


    In contrast, a method call is like the use of a word in a sentence. A method sets
    some code in motion.


    > “I want some chocolate, or I''ll throw a fit.\nFixTheAlternator on that junkyOldFord.”


    **A method''s declaration** tells the computer what will happen if you call the
    method into action. A method call (a separate piece of code) tells the computer
    to actually call the method into action. A method''s declaration and the method''s
    call to be in different parts of the Java program.


    ![](img/f938eba5f15e231d828a6255e7ec5523_106_0.png)


    # The main method in a program


    In Listing 4-1, the bulk of the code is the declaration of a method named *main*.
    (Just look for the word main in the code''s method header) For now, don''t worry
    about the other words in the method header — the words public, static, void, String,*
    and *args*. I explain these words (on a need-to-know basis) in the next several
    chapters.


    Like any Java method, the **main** method is a recipe:


    ```

    How to make biscuits:

    Preheat the oven.

    Roll the dough.

    Bake the rolled dough.

    ```


    or


    ```

    How to follow the main instructions in

    the ThingsILike code:

    Display Chocolate, royalties, sleep on the screen.

    ```


    The word **main** plays a special role in Java. In particular, you never write
    code that explicitly calls a *main* method into action. The word main is the name
    of the method that is called into action automatically when the program begins
    running.'
