  md: "In general, a *someTypeName.values()* expression stands for the set of values\
    \ that a particular enum type's variable can have. For example, back in Listing\
    \ 10-7, you can use the expression WhoWins.values() to refer to the home, visitor,\
    \ and neither values.\n\nThe difference between a type's name (like Symbol) and\
    \ the type's values (as Symbol.values()) is really subtle. Frankly, you don't\
    \ have to worry about the difference. As a beginning programmer, you can just\
    \ use the .values() suffix in an enhanced loop's *RangeOfValues* part.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_318_0.png)\n\
    \n# Nesting the enhanced for loops\n\nListing 15-5 solves a simple problem in\
    \ a very elegant way. So after reading about Listing 15-5, you ask about more\
    \ complicated problems. \"Can I list all three-reel combinations of the slot machine's\
    \ four symbols?\" Yes, you can. Listing 15-6 shows you how to do it.\n\n# Listing\
    \ 15-6: Listing the Combinations\n\n```\nimport static java.lang.System.out;\n\
    \nclass ListCombinations {\n    enum Symbol {\n        cherry, lemon, kumquat,\
    \ rutabaga\n    }\n    public static void main(String args[]) {\n        for (Symbol\
    \ leftReel : Symbol.values()) {\n            for (Symbol middleReel : Symbol.values())\
    \ {\n                for (Symbol rightReel : Symbol.values()) {\n            \
    \        out.print(leftReel);\n                    out.print(\" \");\n       \
    \             out.print(middleReel);\n                    out.println(\" \" +\
    \ rightReel);\n                }\n            }\n        }\n    }\n}\n```\n\n\
    When you run the program in Listing 15-6, you get 64 lines of output. Some of\
    \ those lines (from the middle of a run) are shown in Figure 15-9."
