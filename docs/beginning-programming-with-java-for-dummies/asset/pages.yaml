  md: '# Chapter 5: Composing a Program


    So what''s the big deal when you type the program yourself? Well, lots of interesting
    things can happen when you apply fingers to keyboard. That''s why the second half
    of this chapter is devoted to troubleshooting.


    # How the EchoLine program works


    When you were a tiny newborn, resting comfortably in your mother''s arms, she
    told you how to send characters to the computer screen:


    ```

    System.out.println(whatever text you want displayed);

    ```


    What she didn''t tell you how to fetch characters from the computer keyboard.
    There are lots of ways to do it, but the one I recommend in this chapter is


    ```

    keyboard.nextLine();

    ```


    Now, here''s the fun part. Calling the nextLine method doesn''t just scoop characters
    from the keyboard. When the computer runs your program, the computer substitutes
    whatever you type on the keyboard in place of the text keyboard.nextLine();


    To understand this, look at the statement in Listing 5-1:


    ```

    System.out.println(keyboard.nextLine());

    ```


    When you run the program, the computer sees your call to nextLine and stops dead
    in its tracks. (Refer to Figure 5-2). The computer waits for a type of line to
    type. So (refer to Figure 5-3) you type this line:


    > Hey, there''s an echo in here.


    The computer substitutes this entire Hey for the keyboard.nextLine() call in your
    program. The process is illustrated in Figure 5-5.


    The call to keyboard.nextLine() is nested inside the System.out.println call.
    So when all is said and done, the computer behaves as though the statement in
    Listing 5-1 looks like this:


    ```

    System.out.println("Hey, there''s an echo in here.");

    ```


    The computer displays another copy of the Hey, there''s an echo in here. on the
    screen. That''s why you see two copies of the Hey line in Figure 5-4.'
