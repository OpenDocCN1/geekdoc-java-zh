    Look at the runs in Figure 16-3 and notice the program’s behavior when the user
    mistakenly asks about a nonexistent room. The motel has no Room 10. If you ask
    for the number of guests in Room 10, the program tries to read more numbers than
    the occupancy file contains. This unfortunate attempt causes a NoSuchElementException.'
