    # How many bits does your computer have?


    As you follow this chapter''s instructions, you may be prompted to choose between
    two versions of a piece of software — the 32-bit and 64-bit version. What''s the
    difference, and why should you care?


    A bit is the smallest piece of information that you can store on a computer. Most
    people think of bit as either a zero or a one and that depict of "bit" is useful.
    To represent any number, you will use several bits next to one another and do
    fancy things with powers of two. The numbering system''s details aren''t show.
    The important thing to remember is that each piece inside your computer stores
    the same number of bits. (Well, some circuits inside your computer are outliers
    with their own particular numbers of bits, but that''s not a big deal.)


