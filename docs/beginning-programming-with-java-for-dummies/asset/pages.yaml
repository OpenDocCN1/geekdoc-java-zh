  md: '# Part IV: Using Program Units


    # The Java Swing Classes


    Java''s Swing classes create graphical objects on a computer screen. The objects
    can include buttons, icons, text fields, check boxes, and other things that make
    windows software so useful.


    The name "Swing" isn''t an acronym. When the people at Sun Microsystems were first
    creating the code for these classes, one of the developers named "Swing" because
    swing music was a nostalgic revival. And yes, in addition to String and Swing,
    the standard Java API has a Spring class.

    But that''s another story.


    Actually, Swing''s API has several sets of windowing components. For details see
    the Java GUIs'' sidebar.


    # Java GUIs


    Java has four (''count'', ''four'') sets of classes for creating Java GUI applications.


    +   The Abstract Window Toolkit (AWT): The original set of classes, dating back
    to JDK 1.0.


    Classes in this set belong to packages whose names begin with java.awt. Components
    in this set have names like Button, TextField, and so on.


    Each component in an AWT program has a peer — a companion component that belongs
    to the computer''s own operating system. For example, when you create an AWT Button,
    a Mac creates its own kind of button to be displayed on the user''s screen. When
    the program runs on Windows, the computer creates a different kind of button (a
    Windows button) to display on the screen. The Java code in the AWT interacts with
    the Mac or Windows buttons, adding additional functionality where


    The AWT implements only the kinds of components that were available on all operating
    systems in the mid-1990s. So, using AWT, you can add a button to your application,
    but you can''t easily add a table or a tree.


    +   Swing: A set of classes created to fix some of the difficulties posed by the
    use of the AWT. Swing was introduced in JSE 1.2.


    Classes in this set belong to packages whose names begin with javax.swing. Components
    in this set have names like JButton, JFrame, and so on.


    Unlike an AWT component, a Swing component has no peer. When you create a JButton
    in your program, the computer''s operating system doesn''t create its own. Instead,
    the JFrame that you''re creating is a pure Java object. Java''s visual rendering
    code draws this object on a window. This is good news and bad news. The good news
    is, a Swing program'
  merge: -1
  pgno: 409
- img_proc: true
  md: 'looks the same on every operating system. In a Swing program, you can create
    table components and tree components because Java simply draws them in the computer''s
    window. The bad news is, Swing components aren''t pretty. AJButton looks improved
    compared to a Mac button or a Windows button.


    and adds no additional functionality. Unlike the AWT, the SWT creates an operating
    system button and then lets the button do its own thing. This carefully defined
    window of interaction between SWT and the operating system overcomes many of the
    difficulties posed by the design of the AWT.


    Java''s classes replace some (but not all) of the classes in the AWT. To use some
    of the Swing classes, you have to call on some of the AWT classes.


    (FYI): A Google Trends search in 2014 puts Swing away from AWT and SWT in terms
    of interest by developers. See www.bogotogo.com/JavaAppletWebStart/awt_swt.php.


    +   - Eclipse''s Widget Toolkit (SWT): An alternative to Java AWT and SWT sets.
    The bad news is "Standard" in SWT''s name, is not part of Oracle''s standard Java.


    +   - JavaFX: The newest set of GUI classes in Oracle standard Java. JavaFX comes
    with new versions of Java 7 and with all versions of Java 8.


    Classes in this set belong to packages whose name begin with org.eclipse.


    Classes in this set belong to packages whose name begin with javafx.


    The SWT takes an "all or nothing" approach. When you create an exotic component
    that a particular operating system doesn''t have, the SWT draws the way Swing
    does. (That is, SWT does allthe work of creating and managing the component.)


    JavaFX supports over 60 kinds of components.(Sure, you want a Button component?
    JavaFX has one.) In addition, JavaFX supports multi-touch operations and takes
    advantage of each processor''s specialized graphics capabilities.


    But when you create a component that''s built into a computer''s operating system,
    SWT displays the operating system''s component


