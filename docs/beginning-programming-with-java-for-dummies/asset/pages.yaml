  md: '# 288 Part III: Controlling the Flow


    The computer jumps to whatever statement comes immediately after the statement.
    In Listing 15-1, the computer prints 10 times! Hooray! I can swallow! The whole
    process is illustrated in Figure 15-2.


    ![](img/f938eba5f15e231d828a6255e7ec5523_303_0.png)


    Figure 15-2: The action of the for loop in Listing 15-1.


    # The anatomy of a for statement


    A typical for statement looks like this:


    > for (Initialization; Condition; Update) { Statements }


    After the word for, you put three things in parentheses: an initialization, condition,
    and an update.


    Each of the three items in parentheses plays its own distinct role:


    +   - Initialization: The initialization is executed once, when the run of your
    program first reaches the for statement.

    - Condition: The condition is tested several times (at the start of each iteration).

    - Update: The update is also evaluated several times (at the end of each iteration).'
