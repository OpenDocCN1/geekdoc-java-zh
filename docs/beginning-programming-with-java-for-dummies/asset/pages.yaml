  md: "# 402 Part IV: Using Program Units\n\nIn the expression new JFrame(), Java's\
    \ new keyword signals a call to a constructor. A constructor is like a method,\
    \ except that a constructor's name is the same as the name of a Java class. Java's\
    \ standard API contains classes named JFrame, ImageIcon, and JLabel, and the code\
    \ in Listing 20-1 calls the JFrame, ImageIcon, and JLabel constructors.\n\nAs\
    \ the terminology suggests, a constructor is a piece of code that constructs an\
    \ object. In Listing 20-1, when you call\n\n```\nJFrame frame = new JFrame();\n\
    ```\n\nyou make a frame variable refer to a newly constructed object (an object\
    \ constructed from the JFrame class).\n\nConstructors and methods have a lot in\
    \ common with one another. You can't call a method without having a corresponding\
    \ method declaration where in the code. (In the case of Java's nextLine method,\
    \ the method declaration lives inside Java's enormous bunch of API classes.) The\
    \ same is true of constructors. You can't call new JFrame() without having a constructor\
    \ for the JFrame class somewhere in your code. And, sure enough, inside the Java\
    \ API, you can find a declaration for the JFrame () constructor. The code looks\
    \ something like this:\n\n```\npublic class JFrame {\nint height;\nint width;\n\
    public Component add() ...\npublic void setDefaultCloseOperation() ...\npublic\
    \ void pack() ...\npublic void setVisible() ...\n\n/**\n * Constructs a new frame\
    \ that is initially invisible.\n */\npublic JFrame() {\n...\n}\n\n```\n\nThe constructor\
    \ declaration looks almost like a method declaration. But notice that the constructor\
    \ declaration doesn't start with public void JFrame() or with public double JFrame()\
    \ or with public anything JFrame(). . Aside from the optional word public, a constructor\
    \ declaration contains only the name of the class whose object is being constructed.\
    \ More on this in the next section."
