    The stuff shown in Figure 18-6 is much simpler than the real String class story.
    But Figure 18-6 makes a good point. Like the purchases in Figure 17-7, each string
    has its own features. For example, each string has a value (the actual characters
    stored in the string), and has a count (the number of characters stored in the
    string). You can''t write the following line of code because the stuff in Figure
    18-6 omits a few details.


    ```

