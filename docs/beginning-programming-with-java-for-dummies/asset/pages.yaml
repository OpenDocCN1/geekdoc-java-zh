    # Some Loops in Action


    The Java Motel, with its ten comfortable rooms, sits in a quiet place off the
    main highway. Aside from a small, separate office, the motel is just one long
    row of ground-floor rooms. Each room is easily accessible from the spacious front
    parking lot.


    Oddly, the motel''s rooms are numbered 0 through 9. I could say that the numbering
    is a fluke — something to do with the builder''s original design plan. But the
    truth is, starting with 0 makes the examples in this chapter easier to write.


    You, as the Java Motel''s manager, store occupancy data in a file on your computer''s
    hard drive. The file has one entry for each room in the motel. For example, in
    Figure 16-1, Room 0 has one guest, Room 1 has four guests, Room 2 is empty, and
    so on.'
