    \ should you sell?\n\n# Making Decisions (Java if Statements)\n\nWhen you work\
    \ with computer programs, you make one decision after another. Almost every programming\
    \ language has a way of branching in one of two directions. In Java (and in many\
    \ other languages), the branching feature is called an statement. Check out Listing\
    \ 9-1 to see an statement.\n\nListing 9-1: An If Statement\n\n```\nif (randomNumber\
    \ > 5) {\n    System.out.println(\"Yes. Isn't it obvious?\");\n} else {\n    System.out.println(\"\
    No, and don't ask again.\");\n}\n```\n\nTo see a complete program containing the\
    \ code from Listing 9-1, skip to Listing 9-2 (or, if you prefer, walk, jump, or\
    \ run to Listing 9-2).\n\nThe statement in Listing 9-1 represents a branch, a\
    \ decision, two alternative courses of action. In plain English, this statement\
    \ has the following meaning:\n\n> If the randomNumber variable's value is greater\
