    # ## Adding Stuff to Your JavaFX Project


    I like empty spaces. When I lived on my own right out of college, my apart-ment
    had no places on the walls. I didn''t want to stare at the same works of art day
    after day. I preferred to fill in the plain white spaces with images from my own
    imagination. So for me, the empty window in Figure 20-8 is soothing.


    But if Figure 20-8 isn''t acquired by New York''s Museum of Modern Art, the window
    is quite useless. (By the way, I am still waiting to hear back from the museum''s
    curator.) When you create a high-powered GUI program, you start by creating a
    window with buttons and other widgets. You then add methods to respond to keystrokes,
    button clicks, and other things.


    The next section contains some code to respond to a user''s button clicks. In
    this section, you use an XML file to describe a button and a text field:


    +   Follow the instructions in this chapter''s earlier “Creating a bare-bones
    JavaFX project” section.


    +   Look in Eclipse''s Package Explorer for the new project that you create in
    that section.


    +   Expand the new project''s branch in Eclipse''s Package Explorer.


    +   Look for the application branch, which is inside the src branch.


    +   Right-click (or on a Mac, control-click) the application branch in the context
    menu that appears, choose File→New→Other.


    +   Select A Wizard dialog box appears.


    +   In the Select Wizard dialog box''s tree, expand the JavaFX branch.


    +   In the JavaFX branch, double-click the New FXML Document item.


    +   An FXML File dialog box appears, as shown in Figure 20-9.


    +   In the dialog box''s Name field, type a name for your new file and then click
    Finish.


    If you''re following your instructions faithfully, name the file Root. In Figure
    20-9, you type the name Root, and e(fx)clipse creates a file whose full name is
    Root.fxml.


