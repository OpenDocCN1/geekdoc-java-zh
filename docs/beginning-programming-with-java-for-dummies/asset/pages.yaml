  md: '# 194 Part III: Controlling the Flow


    So to simulate a Backgammon game (and many other, more practical situa- tions)
    you need to combine conditions.


    If die1 + die2 equals 8 and die1 equals die2, ...


    You need these things like and or — things that can wire codes together. Java
    has operators to represent these concepts, which are described in Table 10-1 and
    illustrated in Figure 10-1.


    | Table 10-1 | Logical Operators | |

    |---|---|---||

    | Operator Symbol | Meaning | Example | Illustration |

    | && | and | 4 < age && age < 8 | Figure 10-1(a) |

    | || | or | age < 4 || age < 8 | Figure 10-1(b) |

    | ! | not | !eachKidGetsTen | Figure 10-1(c) |


    ![](img/f938eba5f15e231d828a6255e7ec5523_209_0.png)


    Combined conditions, like the ones in Table 10-1, can be mighty confusing. That''s
    why I tread carefully when I use such things. Here''s a short explica- tion of
    each example in the table:


    +   - 4 < age && age < 8

    The value of age variable is greater than 4 and is less than 8. The numbers 5,
    6, 7, 8, 9 ... are all greater than 4. But among these numbers, only 5, 6, and
    7 are less than 8. So only the numbers 5, 6, and 7 satisfy this combined condition.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Chapter 10: Which Way Did He Go? 195


    +   - age < 4 || 8 < age


    The value of the age variable is less than 4 or greater than 8. To create the
    condition, you use two pipe symbols. Many U.S. English keyboards, you can find
    the pipe symbol immediately above the Enter key (the same key as the backslash,
    shifted).


    In this combined condition, the value of the age variable is either less than
    4 or greater than 8. For example, if a number is less than 4, the number satisfies
    the condition. Numbers like 1, 2, and 3 are all less than 4, so these numbers
    satisfy the combined condition.


    Also, if a number is greater than 8, the number satisfies the combined condition.
    Numbers like 9, 10, and 11 are all greater than 8, so these satisfies the condition.


    +   !eachKidGetsTen


    If I weren''t experienced with computer programming languages, I''d be confused
    by the exclamation point. I think that !eachKidGetsTen means, "Yes, each code
    does ten." That''s not what this expression means. The variable eachKidGetsTen
    does not have the value "true." In Java and other programming languages, an exclamation
    point stands for negative, for no way, or no.


    Listing 8-4 (refer to Chapter 8) has a boolean variable named eachKidGetsTen.
    A boolean variable''s value is either true or false. Because ! means not, the
    expressions eachKidGetsTen and !eachKidGetsTen have opposite values. When eachKidGetsTen
    is true, !eachKidGetTen is false (and vice versa).


    Java''s || is inclusive. This means that you get whenever the thing on the left
    side is true, the one on the right is true, or both things are true. For example,
    the condition 2 < 10 || 20 < 30 is true.


    In Java, you can''t combine comparisons the way you do in ordinary English. In
    English, you may say, "We have between three and ten people at the dinner table."
    But in Java, you get an error message if you write 3 <= people <= 10. To do this
    comparison, you need something like 3 && people <= 10.


    # Combining conditions: An example


    Here''s a handy example of the use of logical operators. A movie theater posts
    its prices for admission.


    +   Regular price: $9.25


    +   Kids under 12: $5.25


    +   Seniors (65 and older): $5.25


