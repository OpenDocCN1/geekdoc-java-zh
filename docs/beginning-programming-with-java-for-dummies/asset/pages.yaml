  md: "# Chapter 15: The Old Runaround\n\nI never spend money to enter any contests.\
    \ All these winnings are freebies. When the national computer science educators'\
    \ conference met in Reno, Nevada, my colleagues convinced me to try the slot machines.\
    \ I lost $23, and then I won back $18. At that point, I stopped playing. I wanted\
    \ to quit while I was only $5 behind.\n\nThat's why writing a Java program about\
    \ slot machines is such a strange occurrence. A typical slot machine has three\
    \ reels, with each reel having 20 symbols. But to illustrate this section's ideas,\
    \ I don't need 20 symbols. Instead I use four symbols — a cherry, a lemon, a kumquat,\
    \ and a rutabaga.\n\n# Creating an enhanced for loop\n\nWhen you play my simplified\
    \ slot machine, you can spin any one of 60 combinations — cherry+cherry+kumquat,\
    \ rutabaga+rutabaga, or whatever. This chapter's goal is to list all possible\
    \ combinations. But first, I show you another kind of loop. Listing 15-5 defines\
    \ an enum for a slot machine's symbols and displays a list of the symbols. (For\
    \ an introduction to enum types, see Chapter 10.)\n\n# Listing 15-5: Slot Machine\
    \ Symbols\n\n```\nimport static java.lang.System.out;\nclass ListSymbols {\n \
    \ enum Symbol {\n    cherry, lemon, kumquat, rutabaga\n  }\n  public static void\
    \ main(String args[]) {\n    for (Symbol leftReel : Symbol.values()) {\n     \
    \ out.println(leftReel);\n    }\n  }\n}\n```\n\nListing 15-5 uses Java's enhanced\
    \ for loop. The word \"enhanced\" means \"enhanced-compared with the loops in\
    \ earlier versions of Java.\" The enhanced for loop was introduced in Java version\
    \ 5.0. If you run Java version 1.4.2 (or something like that), you can't use an\
    \ enhanced for loop.\n\nHere's the format of the enhanced for loop:\n\n```\nfor\
    \ (TypeName variableName : RangeOfValues) {\n  Statements\n}\n```"
