    System.out.println(password.count);

    ```


    Anyway, each row in Figure 18-6 has three items — a value, a count, and equals
    method. So each row of the table contains more than just data. Each row contains
    an equals method, a way of doing something useful with the data. It is as though
    each object (each instance of the String class) has three strings:


    +   - A bunch of characters (the object''s value)

    - A number (the object''s count)

    - A way of being compared with other strings (the object''s equals method)


    That''s the essence of object-oriented programming. Each string has its own personal
    copy of the equals method. For example, in Listing 18-5, the password string has
    its own equals method. When you call the password string''s equals method and
    put the userInput string in the method''s parentheses, the method compares the
    two strings to see if those strings contain the characters.


    The userInput in Listing 18-5 has an equals method, too. I could use the userInput
    string''s equals method to compare this string with the password string. But I
    don''t. In fact, in Listing 18-5, I don''t use the userInput''s equals method
    at all. (Compare the userInputWith the password, I had to use either the password
