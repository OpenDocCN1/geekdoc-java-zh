    # Understanding (or ignoring) the subtleties


    Sometimes, when you refer to a particular object, you want to emphasize which
    class the object came from. Well, subtle differences in emphasis call for big
    differences in terminology. So here''s how Java programmers use the terminology:


    +   - The bold line in Listing 17-3 creates a new object.


    +   - The bold line in Listing 17-3 creates a new instance of the Purchase class.


    The words object and instance are almost synonymous, but Java programmers never
    say "object of the Purchase class" (or if they do, they feel funny).


    By the way, if you mess up this terminology, no one jumps down your throat. Everyone
    understands what you mean, and life goes on as usual. In fact, I often use a phrase
    "Purchase object" to describe an instance of the Purchase class.'
