  md: "# 404 Part IV: Using Program Units\n\nWhen you type MyFrame extends JFrame,\
    \ you declare that your new MyFrame class has all the methods and other things\
    \ that are built into Java's own JFrame class, and possibly more. For example,\
    \ a JFrame instance has setDefaultCloseOperation, pack, and setVisible methods,\
    \ so every new MyFrame instance has setDefaultCloseOperation, pack, and setVisible\
    \ methods (see Figure 20-6).\n\n![](img/f938eba5f15e231d828a6255e7ec5523_419_0.png)\n\
    \nWhen you put the words extends JFrame in your code, you get all of the JFrame\
    \ methods for free. The MyFrame class's code doesn't need declarations for methods,\
    \ such as setDefaultCloseOperation, pack, and setVisible. These declarations are\
    \ already in the JFrame class in Java's API. The only declarations in the MyFrame\
    \ class's code are for brand-new things—things that are specific to your newly\
    \ declared MyFrame class. It is as though Listing 20-2 contains the following\
    \ information:\n\n```\npublic class MyFrame is a kind of JFrame {\n    In addition\
    \ what's in JFrame, MyFrame also has\na brand new constructor:\n        public\
