  md: '# Chapter 2: Setting Up Your Computer 39


    According to the Eclipse Foundation''s website, Eclipse is "universal tool platform
    - an open extensible IDE for anything and nothing in particular." Indeed, Eclipse
    is versatile. Programmers generally think of Eclipse as an IDE for developing
    Java programs, but Eclipse has tools for programming in C++, PHP, and many other
    languages. I''ve seen incarnations of Eclipse that have nothing to do with program
    development. (One such product is the Lively Browser - a web browser whose tabs
    are built from Eclipse components.)


    # Downloading Eclipse


    Here''s how you download Eclipse:


    +   1. Visit www.eclipse.org.


    +   2. Look for a way to download Eclipse for your operating system.


    Today, I visit www.eclipse.org and see a big button displaying the words We Get
    Started Now... Download Eclipse (see Figure 2-8). Tomorrow, who knows what I''ll
    see on this ever-changing website!


    After clicking the Download Eclipse button, I see a list of downloads for my computer''s
    operating system (see Figure 2-9).

    Eclipse''s download page directs you to versions of Eclipse that are specific
    to your computer''s operating system. For example, if you visit the page on a
    Windows computer, the page shows downloads for Windows only. If you''re downloading
    Eclipse for another computer, you may want to override the automatic choice of
    operating system. Look for a little drop-down list containing the name of your
    computer''s operating system. You can change the selected system in drop-down
    list.


    ![](img/f938eba5f15e231d828a6255e7ec5523_54_0.png)


    +   3. Choose an Eclipse package from the available packages.


    Regardless of your operating system, Eclipse comes in many shapes, sizes, and
    colors. The Eclipse website offers Eclipse IDE for Java Developers, Eclipse IDE
    for Java EE Developers, Eclipse Classic, and many other specialized downloads
    (see Figure 2-9). I usually select Eclipse IDE for Java Developers, and I recommend
    that you do the same.'
