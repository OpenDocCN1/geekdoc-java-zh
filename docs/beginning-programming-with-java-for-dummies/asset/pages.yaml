  md: "# 86 Part II: Writing Your Own Java Programs\n\nIn English, you write all the\
    \ way across one line and then you wrap your text to the start of the next line.\
    \ In programming, you seldom work this way. Instead, the code's punctuation guides\
    \ the indentation of certain lines. The indentation shows which parts of the program\
    \ are subordinate to which other parts. It's as though, in English, you wrote\
    \ Suzanne's sentence like this:\n\nSuzanne says \"eh\"\n\n+   - as you know\n\n\
    +   - she lives in Canada.\n\nThe diagrams in Figures 4-3 and 4-4 show how parts\
    \ of the ThingsLike program are contained inside other parts. Notice how a pair\
    \ of curly braces acts like a box. To make the program's structure visible at\
    \ a glance, you indent the stuff inside of each box.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_101_0.png)\n\
    \n```\nclass ThingsLike {\n    public static void main(String[] args[]) {\n  \
    \      System.out.println(\"Chocolate, royalties, sleep\");\n    }\n}\n```\n\n\
    ![](img/f938eba5f15e231d828a6255e7ec5523_101_1.png)\n\n```\nHere's a Java class\
    \ named ThingsLike:\nHere's the main starting point for the instructions:\nDisplay\
    \ Chocolate, royalties, sleep on the screen.\n```\n\nI can't emphasize this point\
    \ enough. If you don't indent your code or if you indent but you don't do it correctly,\
    \ your code still compiles and runs correctly. But this successful run gives you\
    \ a false sense of confidence. The minute you try to update poorly indented code,\
    \ you become hopelessly confused. So take my advice: Keep your code carefully\
    \ indented at every step in the process. Make your indentation clear, whether\
    \ you're scratching out a quick test or writing code for a billionaire customer.\n\
    \n![](img/f938eba5f15e231d828a6255e7ec5523_101_2.png)\n\n![](img/f938eba5f15e231d828a6255e7ec5523_101_3.png)\n\
