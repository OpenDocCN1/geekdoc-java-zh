    # Creating Useful Code


    The previous section describes a network administrator''s problem — creating a
    file with usernames from a file filled with e-mail addresses. The code in Listing
    14-1 solves part of the problem — it extracts just one e-mail address. That''s
    a good start, but to get just one username, you don''t need a computer program.
    A pencil and paper does the trick.


    Don''t keep the network administrator waiting any longer. In this section, you
    develop a program that processes dozens, hundreds, and even thousands of e-mail
    addresses from a file on your hard drive.


    First, you need a strategy to create the program. Take the statements in Listing
    14-1 and run them over and over again. Again. Better yet, have the statements
    run them over and over again. Fortunately, you already know how to do something
    over and over again: You use a loop. (See Chapter 12 for the basics)'
