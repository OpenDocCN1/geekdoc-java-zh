  md: '# 428 Part V: The Part of Tens


    # ArrayList


    Chapter 16 introduces arrays. This is good stuff, but in any programming language,
    arrays have their limitations. For example, take an array of 100. If you suddenly
    need to store a 101st value, you''re plain out of luck. You can''t change an array
    size without rewriting some code. Inserting a value into an array is another problem.
    To squeeze ''Tim'' alphabetically between ''Thom'' and ''Tom'', you may have to
    make room by moving thousands of ''Tyler'', and ''Uriah'', and ''Vector'' names.


    But Java has an ArrayList class. An ArrayList is like an array, except ArrayList
    objects grow and shrink as needed. You can also insert new values without using
    the ArrayList add method. ArrayList objects are very useful because they all kind
    of nice things that arrays can''t.


    # File


    Talk about your useful Java classes! The File class does a bunch of things that
    aren''t included in this book''s examples. Method canRead tells you whether you
    can read from a file or not. Method canWrite tells you if you can write to a file.
    Calling setReadOnly ensures that you can''t accidentally write to a file. Method
    deleteExists exits a file, but not your program stops running. Method exists isHidden,
    lastModified, and length give you even more information about a file. You can
    create a new directory by calling the mkdir method. Face it, this File class is
    powerful stuff!


    # Integer


    Chapter 18 describes the Integer class and its parseInt method. The Integer class
    has lots of other features that come in when you work with int values. For example,
    Integer.MAX_VALUE stands for the number 2147483647. That''s the largest value
    that an int variable can store. (Refer to Chapter 7.) The expression Integer.MIN_VALUE
    stands for the number -2147483648 (the smallest value that an int variable can
    store). A call to Integer.toBinaryString takes an int and returns its base-2 (binary)
    representation. And what Integer.toBinaryString does for base 2, Integer.toHexString
    does for base 16 (hexadecimal).'
  merge: -1
