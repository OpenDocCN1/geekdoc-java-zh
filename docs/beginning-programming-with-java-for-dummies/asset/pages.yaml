    # # Creating New Java Methods


    +   ## In This Chapter

    - Writing methods that work with existing values

    - Building methods that modify existing values

    - Making methods that return new values


    In Chapters 3 and 4, I introduce Java methods. I show you how to create a main
    method and how to call the System.out.println method. Between that chapter and
    this one, I make very little old noise about methods. In Chapter 18, I introduce
    a bunch of new methods for you to call, but that''s only half of the story.


    This chapter completes the circle. In this chapter, you create your own Java methods
    — not the tired old method that you''ve been using all along, but some new, powerful
    Java methods.


    # # Defining a Method within a Class


    In Chapter 18, Figure 18-6 introduces an interesting notion — a notion''s at the
    core of object-oriented programming. Each Java string has its own equals method.
    That is, each string has, built within it, the functionality to compare itself
    to other strings. When you do object-oriented programming, you bundle data and
    functionality into a lump called a class. Just remember Barry''s immortal words
    from Chapter 17:


    A class describes the way in which you intend to combine and use pieces of data.


    And why are these words so important? They''re important because, in object-oriented
    programming, chunks of data take responsibility for themselves. With object-oriented
    programming, everything you have to know about a string is located in the file
    String.java. So, if anybody has problems with strings, they know just where to
    look for all the code. That''s great!'
