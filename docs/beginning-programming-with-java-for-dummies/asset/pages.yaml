  md: '# Chapter 8: Numbers? Who Needs Numbers? 173


    Under the hood, the letters A through Z are stored with numeric codes 65 through
    90. The letters a through z are stored with codes 97 through 122. That''s why
    each uppercase letter is “less than” any of the lowercase letters.


    # The Remaining Primitive Types


    In Chapter 7, I tell you that Java has eight primitive types, but Table 7-1 lists
    only six of eight types. Table 8-2 describes the remaining two types — the types
    char and boolean. Table 8-2 isn''t too exciting, but I can''t leave you with the
    incomplete story in Table 7-1.


    | Table 8-2 | Java''s Primitive Non-numeric Types |

    |---|---|n| Type Name | Range of Values |

    | Character Type | Thousands of characters, glyphs, and symbols |

    | char | |

    | Logical Type | |

    | boolean | Only true or false |


    If you dissect parts of the Java Virtual Machine, you find that Java considers
    char to be a numeric type. That''s because Java represents characters with something
    called Unicode — an international standard for representing alphabets of the many
    languages. For example, the Unicode representation of an uppercase letter C is
    67. The representation of a Hebrew letter aleph is 1488. (And to take a more obscure
    example) the representation for the voiced retroflex approximant is 635. Don''t
    worry about this. The only reason I''m writing about the char being numeric is
    to save face among my techie friends.


    Looking back at Table 8-2, you may be wondering what a glyph is. (In fact, I''m
    proud to be writing about this esoteric concept, whether you have use for the
    information or not.) A glyph is a particular representation of a character. For
    example, a and a are different glyphs, but both of these glyphs represent the
    same lowercase letter of the Roman alphabet. (Because these two glyphs have the
    same meaning, the glyphs are called allographs. If you want to sound smart, find
    a way to inject the words glyph and allograph into a casual conversation!)'
