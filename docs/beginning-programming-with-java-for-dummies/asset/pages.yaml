  md: '# Part III: Controlling the Flow


    Part III has some of my favorite chapters. In these chapters, you make the computer
    navigate from one part of your program to another. Think of your program as a
    big mansion, with the computer moving from room to room. Sometimes the computer
    chooses between two or more hallways, and sometimes the computer visits rooms.
    As a programmer, your job is to plan the computer''s rounds through the mansion.
    It''s great fun.


    # Part IV: Using Program Units


    Have you ever solved a big problem by breaking it into smaller, more manageable
    pieces? That''s exactly what you do in Part IV of this book. You discover the
    best ways to break programming problems into pieces and create solutions for the
    newly found pieces. You also find out how to use other people'' solutions. it
    feels like stealing, but it''s not.


    This part also contains a chapter about programming with windows, buttons, and
    other graphical items. If your mouse feels ignored by the examples in this book,
    read 20.


    # Part V: The Part of Tens


    The Part of Tens is a little programmer''s candy store. In the Part of Tens, you
    can find lists — lists of tips, resources, and all kinds of interesting goodies.


    I added an article at www.dummies.com/extras/programmingwithjava to help you feel
    comfortable with Java''s documentation. I can''t write programs without my Java
    programming documentation. In fact, no Java programmer can write programs without
    those all-important docs. These docs are in web page format, so they''re easy
    to find and easy to navigate. But if you''re not used to the terminology, documentation
    can be overwhelming.


    # Icons Used in This Book


    If you could watch me write this book, you''d see me sitting at my computer, talking
    to myself. I say each sentence several times in my head. When I have an extra
    thought, a side comment, something that doesn''t belong in the regular stream,
    I twist my hand a little bit. That way, whoever''s listening to me (usually nobody)
    knows I''m off on a momentary tangent.'
