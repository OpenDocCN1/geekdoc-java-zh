  md: '# Chapter 9

    Forks in the Road


    In This Chapter


    +   * Writing statements that choose between alternatives

    * Putting statements inside one another

    * Writing several kinds of decision-making statements


    Here’s an excerpt from Beginning Programming with Java For Dummies, 4th Edition,
    Chapter 8:


    > If you’re trying to store words or sentences (not just single letters), then
    you need to use something called a String.


    This excerpt illustrates two important points: First, you may have to use something
    called a String. Second, your choice of action can depend on something being true
    or false.


    > If it’s true that you’re trying to store words or sentences, you need to use
    something called a String.


    This chapter deals with decision-making, which plays a fundamental role in the
    creation of instructions. With the material in this chapter, you expand your programming
    power by leafs and bounds.


    # Decisions, Decisions!


    Picture yourself walking along a quiet country road. You’re enjoying a pleasant
    summer day. It’s not too hot, and a gentle breeze from the north makes you feel
    fresh and alert. You’re holding a copy of this book, opened to Chapter 9. You
    read the paragraph about storing words or sentences, and then you look up.


