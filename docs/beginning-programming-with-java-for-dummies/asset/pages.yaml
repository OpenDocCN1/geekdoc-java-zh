  md: '# 170 Part II: Writing Your Own Java Programs


    # Automated debugging


    If your program isn''t working correctly, you can try something called a debugger.
    A debugger programmatically adds invisible print and println calls to your suspicious
    code. In fact, debuggers have all kinds of features to help you diagnose problems.
    For example, a debugger can pause a run of your program and accept special commands
    to diagnose variables. With some debuggers, you can pause a run and change a variable''s
    value (just to see if things go better when you do).


    An Eclipse perspective is a collection of views intended to help you with a certain
    aspect of program development. By default, Eclipse starts in the Java perspective
    — the arrangement of views to help you create Java programs. Another perspective
    — the Debug perspective — helps you diagnose errors in your code.


    In this book, I don''t promote the use of an automated debugger. But for any large
    programming project, automated debugging is an essential tool. So if you plan
    to write bigger and better programs, give Eclipse''s Debug perspective a try.
    For a small sample of the Debug perspective''s capabilities, do the:


    +   1. In the editor (where you use your Java code) double-click in the margin
    to the left of a line of code.


    A little blue dot appears in the margin (see the first figure below). This dot
    indicates a breakpoint in the code. In the steps that follow, you will make the
    run of the program pause at this breakpoint. In the figure, click the last line
    of code from Listing 8-5.


    | 14 System.out.println("Room temperature?"); |

    | 15 System.out.println(fahrenheit == 69.8); |

    | 17 } |

    | 18 |


    +   2. In Eclipse''s main menu, click Window -> Open Perspective -> Debug.


