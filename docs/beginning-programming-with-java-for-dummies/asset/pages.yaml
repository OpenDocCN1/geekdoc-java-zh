    Here is a useful exercise: Start with a Java program. After successfully running
    the code, make a change that intentionally introduces errors. Look carefully at
    each error message and ask yourself whether the message would help you diagnose
    the problem. This exercise is great because it helps you practice with errors
    as normal occurrences and gives you practice analyzing messages when you''re not
    under pressure to get your program to run correctly.


    # Runtime error messages


    Up to this point in the chapter, I describe errors that crop up when you compile
    a program. Another category of errors hides until you run the program. A case
    in point is the improper spelling or capitalization of the word main.


    Assume that, in a moment of wild abandon, you incorrectly spell main with a capital
    M:


    ```

    //The following line is incorrect:

    public static void Main(String args[]) {


    ```


    When you type the code, everything is hunky-dery. You don''t see any error markers.


    But then you try to run your program. At this point, the bits hit the fan. The
    catastrophe is illustrated in Figure 5-13.


    ![](img/f938eba5f15e231d828a6255e7ec5523_132_2.png)


    **Figure 5-13:** Whadaya mean "Main method not found in class EchoLine?”'
