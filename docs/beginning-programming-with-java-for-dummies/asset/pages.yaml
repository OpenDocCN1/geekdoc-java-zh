  md: '# Chapter 3: Running Programs


    ![](img/f938eba5f15e231d828a6255e7ec5523_70_0.png)


    Figure 3-2: The Eclipse Workspace Launcher.


    A workspace is a folder on your computer''s hard drive. Eclipse stores your Java
    programs in one or more workspace folders. Along with these Java programs, each
    workspace folder contains some Eclipse settings. These settings store things like
    the version of Java that you are using, the colors that you prefer for words in
    the editor, the size of the editor area where you drag the edges, and other things.
    You can have several workspaces with different programs and settings in each workspace.


    By default, the Workspace Launcher offers to open whatever you opened the last
    time you ran Eclipse. You want to open the workspace that you used in Chapter
    2, so do not modify the stuff in the Launcher''s Workspace field.


    # 3. In the Workspace Launcher dialog box, click OK.


    The Eclipse workbench stares at you from your computer screen (see Figure 3-3).


    In 3-3, the leftmost part of the workbench is Eclipse''s Package Explorer, which
    contains numbers like 03-01, 04-01, and so on. Each number is the name of an Eclipse
    project. Formally, a project is a collection of files and folders inside a workspace.
    Intuitively, a project is a basic unit. For example, a self-contained collection
    of Java programs to manage your CD collection (along with the files containing
    the data) may constitute a single Eclipse project.


    Looking again at the Package Explorer in Figure 3-3, you see projects 03-01, 04-01,
    and so. My project 03-01 holds the first and only example in Chapter 3 (this chapter).
    Project 06-02 contains the Java program in Listing 6-2 (the second code listing
    in Chapter 6 of this book). Project names can include letters, digits, blank spaces,
    and other characters, but for the names of this examples, 1 with digits and dashes.


    To read more about things like Eclipse''s Package Explorer, see the upcoming section
    "What''s All That Stuff in Eclipse''s Window"'
