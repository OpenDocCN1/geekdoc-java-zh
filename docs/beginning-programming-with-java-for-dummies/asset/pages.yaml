    \ 4 . . . Wait! Let's break for a commercial. When we come back, I'll say the\
    \ names of the other six doors.\"\n\nWhat Monty Hall needs is Java's switch statement.\n\
    \n# Meet the switch Statement\n\nThe code in Listing 9-2 in Chapter 9 simulates\
    \ a fortune-telling toy — an electronic oracle. Ask the program question, and\
    \ the program randomly generates a yes or no answer. But, as to go, the code in\
