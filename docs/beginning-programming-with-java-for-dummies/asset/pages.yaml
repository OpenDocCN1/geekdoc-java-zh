    # Installing Eclipse


    Precisely how you install Eclipse depends on your operating system and on

    what kind of file you get when you download Eclipse. Here''s a brief summary:


    +   * If you run Windows and the download is an .exe file:

    Double-click the .exe file''s icon.

    * If you run Windows and the download is a .zip file:

    Extract the file''s contents to the directory of your choice.

    In other words, find the .zip file''s icon in Windows Explorer (also known

    as File Explorer). Then double-click the .zip file''s icon. (As a result,

    Explorer displays the contents of the .zip file, which consists of only

    one folder– a folder named eclipse.) Drag the eclipse folder to a

    convenient place in your computer''s hard drive.'
