  md: '# Chapter 16: Using Loops and Arrays 315


    # # Grabbing input here and there


    Listing 16-2 illustrates some pithy issues surrounding the input of data. For
    one thing, the program gets input from both the keyboard and a disk file.(The
    program gets a number from the keyboard. Then the program gets the number of guests
    in that room from the occupancy file.)To make this happen, Listing 16-2 sports
    two Scanner—one to declare keyboard, and a second to declare diskScanner.


    the code in Listing 16-2, I go to my old 16-01 project in Eclipse''s Package Explorer.
    I right-click the occupancy file in the 16-01 project and select Copy from the
    context menu. Then I right-click the new 16-02 project branch and select Paste
    from the context menu. As usual, Mac users control-click instead of right-click.


    Later in the program, we call the keyboard.nextInt reads from the keyboard diskScanner.nextInt
    reads from the file. Within the program, you can read from the keyboard or the
    disk as many times as you want. You can even inline calls—reading once from the
    keyboard, three times from the disk, twice from the keyboard, and so on. All you
    do to remember is to use keyboard when you read from the keyboard and use diskScanner
    when you read from the disk.


    In real life, several copies of a data file can be dangerous. You can modify one
    copy and accidentally read out-of-date data from a different copy. So, you should
    have only one “master” copy—the copy from which all programs get the same input.


    In a real-life project, you don''t have the occupancy file from one project to
    another. What do you do? You put an occupancy file in one place on your drive
    and then have each program refer to the file using the names of the directories.
    For example, if your occupancy file is in the c:\Oct\22 directory, you would


    Another tidbit in Listing 16-2 concerns the occupancy file. Many of this chapter’s
    examples read from an occupancy file and use the same data in each of the examples.(I
    use the data shown in Figure 16-1.) To run an example, I copy the occupancy file
    from one Eclipse project to another.(Before running


    ```

    Scanner diskScanner =

    new Scanner(File("c:\oct\22\occupancy"));

    ```


    A sidebar in Chapter 13 has more details about filenames and double dashes.


    As you stare at the runs in Figure 16-3, it’s important to remember the unusual
    numbering of rooms. Room 3 has two guests because Room 3 is the fourth room in
    the occupancy file of Figure 16-1. That makes the motel’s rooms are numbered 0
    through 9.


