    \ the Condition. If the Condition is true, the computer goes back for another\
    \ iteration of the Statement.\n\nWith a do loop, the computer always executes\
    \ the statements inside the loop at least once:\n\n```\n//This code prints something:\n\
    int twoPlusTwo = 2 + 2;\ndo {\n    System.out.println(\"Are you kidding?\");\n\
    \    System.out.println(\"2+2 doesn't equal 5.\");\n    System.out.println(\"\
    Everyone knows that\");\n    System.out.println(\" 2+2 equals 5.\");\n}\n\n```\n\
    \nThis code displays Are you kidding? 2 doesn't equal 5... and so on and then\
    \ tests the condition twoPlusTwo == 5. Because twoPlusTwo == 5 is false, the computer\
    \ doesn't go back for another iteration. Instead, the computer jumps to whatever\
    \ code comes immediately after the loop.\n\n# Repeating with Predetermined Values\
    \ (Java's Enhanced for Statement)\n\nMost people say that they \"never win anything.\"\
    \ Other people win raffles, drawings, and contests, but they don't win things.\
    \ We, have news for these people— other people don't win things, either. Nobody\
    \ wins things. That's the laws of probability work. Your chance of winning one\
