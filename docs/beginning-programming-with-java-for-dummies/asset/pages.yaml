  md: "# Solving the problem\n\nListing 14-3 has the solution to the problem described\
    \ in Figures 14-1 and 14-2. The code in this listing is almost identical to the\
    \ code in Listing 14-2. The only difference is the added call to nextLine. When\
    \ the computer reaches an @ sign, this nextLine swallows the rest of the line\
    \ without actually tasting it (The nextLine gets rest of the e-mail address, but\
    \ doesn't output that part of the email address. The idea works because each email\
    \ address is on its own separate line.) After gulping down@BurdBrain.com, the\
    \ computer moves gracefully to the next line of input.\n\n# Listing 14-3: That's\
    \ Much Better!\n\n```\n*\n* This code is correct!!\n\nimport java.util.Scanner;\n\
    import java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintStream;\n\
    \nclass ListAllUsernames {\n    public static void main(String args[])\n     \
    \   throws FileNotFoundException {\n        Scanner diskScanner =\n          \
    \  new Scanner(new File(\"email.txt\"));\n        PrintStream diskWriter =\n \
    \           new PrintStream(\"usernames.txt\");\n        char symbol;\n\n    \
    \    while (diskScanner.hasNext()) {\n            symbol = diskScanner.findWithinHorizon(\"\
    .\",0)\n                .charAt(0);\n\n            while (symbol != '@') {\n \
    \               diskWriter.print(symbol);\n                symbol = diskScanner.findWithinHorizon(\"\
    .\",0)\n                    .charAt(0);\n            }\n\n            diskScanner.nextLine();\n\
    \            diskWriter.println(symbol);\n        }\n\n        diskScanner.close();\n\
    \        diskWriter.close();\n    n}\n```"
