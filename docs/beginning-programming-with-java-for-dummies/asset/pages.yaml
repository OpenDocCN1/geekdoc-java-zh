    # Escapism


    In 12-5, you see the numbers 8, 8, then 6 14 (and so on) displayed. I wanted these
    numbers to be right under the heading Card and Total, so I used a trick to make
    the numbers inline up. Normally, I can get perfect vertical columns by pressing
    the tab key, but a computer program generates the nicely-aligned output in 12-5.
    How did I get a computer program to press the tab key?


    System.out.println();\In the first statement, the computer displays Card, jumps
    to the next tab stop on the screen, and displays Total. In the next three statements,
    computer displays a card number (like the number 6), jumps to the next tab stop
    (directly under the word Total), and displays a total value (like the number 14).


    In Java, there''s a way. You can insert a tab in your output by putting \t double
    quote marks.


    \t combination of characters is an example of an escape sequence, the combination
    \n, moves the cursor to a new line. In other words, System.out.println("Hello\n")
    does the same thing as System.out.println("Hello").


    ```

    System.out.println("Card\tTotal");

    ```


    ```

    System.out.print(card);

    System.out.print("\t");

    ```


    # Thinking about Loops (Priming)


    I remember when I was a young boy. We lived on Front Street in Philadelphia, near
    where the El train turned out Kensington Avenue. Come early morning, I''d have
    to go out and get water from the well. I''d pull several times before any water
    would come out. Ma and Pa called it "priming the pump."


    These days I don''t prime primes. I prime while loops. Consider the case of a
    busy network administrator. She needs a program that extracts a username from
    an e-address. For example, the program reads


    John@BurdBrain.com


    and writes


    John


    How does the program do it? Like other examples in the chapter, this involves
    repetition:


    +   Repeatedly do the following:

    Read a character.

    Write the character.'
