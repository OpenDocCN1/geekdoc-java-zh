  md: '# 116 Part II: Writing Your Own Java Programs


    "Sour potatoes! Yuck! Granny says, as she goes to the sink to spit it all out.
    Because you have a strong ego, you''re not insulted by your grandmother''s behavior.
    But you''re somewhat confused. Why is she saying different things about three
    uncoated recipes? Maybe there are some subtle differences that you don''t know.


    Well, the same kind of thing happens when you''re writing computer programs. You
    can make the same kind of mistake twice (or at least, make what you think is the
    same kind of mistake twice) and get different error messages each time.


    For example, if you change the spelling or capitalization of println in Listing
    5-1, Eclipse tells you the method is undefined for the type PrintStream. But if
    you change System to system, Eclipse says that system cannot be resolved. And
    with System misspelled, Eclipse doesn''t notice whether println is spelled correctly
    or


    In Listing 5-1, if you change the spelling of args, nothing goes wrong. The program
    compiles and runs correctly. But if you change the spelling of main, you face
    some unusual difficulties. (If you don''t believe me, read the "Runtime error
    messages" section later in this chapter.)


    Still in 5-1, if you change the equal signs in the Scanner keyboard = new Scanner
    (System.in) line. With one equal sign, everybody''s happy. If you accidentally
    type two equal signs (Scanner keyboard == new Scanner (System.in)), Eclipse steers
    you back on course, telling you Syntax error on token "=", = expected (see Figure
    5-1). If you go crazy and type four equal signs or if you type no equal signs
    at, Eclipse misinterprets everything and suggests that you insert ";" to complete
    Statements. Unfortunately, inserting a semicolon is no help at all (see Figure
    5-12).


    ![](img/f938eba5f15e231d828a6255e7ec5523_131_0.png)


    So remember: Java responds to errors in many different ways. Two changes in your
    code might look alike, but similar changes don''t always lead to similar results.
    Each problem in your code requires its individualized attention.'
