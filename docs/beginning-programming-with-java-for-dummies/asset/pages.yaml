  md: "# 80 Part II: Your Own Java Programs\n\n# The Elements in a Java Program\n\n\
    That both English and Java are called languages is no coincidence. You use a language\
    \ to express ideas. English expresses ideas to people, and Java expresses ideas\
    \ to computers. What's more, both English and Java have things like words, names,\
    \ and punctuation. In fact, the biggest difference between the two languages is\
    \ that Java is easier to learn than English. (If English were easy, then computers\
    \ would understand English. Unfortunately, they can't.)\n\nTake an ordinary English\
    \ sentence and compare it with the code in Listing 4-1. Here's the sentence:\n\
    \nSuzanne says \"eh\" because, as you know, she lives in Canada.\n\nIn your high\
    \ school grammar class, you worried about verbs, adjectives, and other such things.\
    \ In this book, you'll think in terms of keywords and identifiers, as summarized\
    \ in Figure 4-2.\n\n| Keywords:\nSuzanne says \"eh\" because, as you know, she\
    \ lives in Canada.\nAn identifier that you can define:\nSuzanne says \"eh\" because,\
    \ as you know, she lives in Canada.\nAn identifier with a commonly agreed upon\
    \ meaning:\nSuzanne says \"eh\" because, as you know, she lives in Canada.\nLiteral:\n\
    Suzanne says \"eh\" because, as you know, she lives in Canada.\nPunctuation:\n\
    Suzanne says \"eh\" because, as you know, she lives in Canada.\nA comment:\nSuzanne\
    \ says \"eh\" because, as you know, she lives in Canada. | | Figure 4-2:\nThe\
    \ things you find in a simple sentence. \n\nSuzanne's sentence has all kinds of\
    \ things in it. They are the kind of things that you find in a computer program.\
    \ So here's the plan: Compare the elements in Figure 4-1 with similar elements\
    \ in Listing 4-1. You already understand English, so you use this understanding\
    \ to figure out new things about Java.\n\nBut first, here's a friendly reminder:\
    \ In the next paragraphs, I draw comparisons between English and Java. As you\
    \ read these paragraphs, it's important to keep an open mind. For example, in\
    \ comparing Java with English, I might write that \"names of things are the same\
