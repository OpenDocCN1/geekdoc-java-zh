  md: '# Some handy import declarations


    When I wrote this section''s example, I was tired of writing the word System.
    After all, Listing 9-4 has ten System.out.print lines. By this point in the book,
    shouldn''t my computer remember what out.print means?


    Of course, computers don''t work that way. If you want a computer to "know" what
    out.print means, you have to code that knowledge somewhere inside the Java compiler.


    Fortunately, for me, the ability to abbreviate things like System.out.print is
    available from Java 5.0 onward. (An older compiler just chokes on the code in
    Listing 9-4.) This ability to abbreviate import is called static import. It''s
    illustrated in the second and third lines of Listing 9-4.


    Whenever I start a program with the line


    ```

    import static java.lang.System.out;

    ```


    I can replace System.out with plain out in the remainder of the program. The same
    holds true of System.in. With an import declaration near the top of Listing 9-4,
    I can replace new Scanner(System.in) with the simpler new Scanner(in).


    You may be wondering what all the fuss is about. If I abbreviate java.util.Scanner
    by writing Scanner, what''s so special about abbreviating System.out? And why
    do I have to write out print? Can I trim System.out.print down to the single word
    print? Look again at the first few lines of Listing 9-4. When do you use the word
    static? And what''s the difference between java.util and java.lang?


    I''m sorry response to these questions won''t thrill you. The fact is, I can explain
    away any of these issues until Chapter 18. Before I explain static import declarations,
    I need to introduce some ideas. I need to describe classes, packages, and static
    members.


    So until you reach Chapter 18, bear with me. Just paste three import declarations
    to the top of your Java programs and trust that everything will work.


    You can abbreviate System.out with the single word out. And you can abbreviate
    System.in with the single word in. Just be sure to copy the import declarations
    exactly as you see them in Listing 9-4. With any deviation from the lines in Listing
    9-4, you may get a compiler error.


    ![](img/f938eba5f15e231d828a6255e7ec5523_207_0.png)'
