    \ of winning is still 1 in 50. If you play every day of the month (selling each\
    \ day), your chance of winning the jackpot is less than 1 in 15.\n\nOf course,\
    \ nothing in the previous paragraph applies to I don't buy tickets, but I often\
    \ win things. My winning streak lasted a few years ago. I won some expensive Java\
    \ software at the end of an online seminar. Later that month, I won a microchip-enabled\
