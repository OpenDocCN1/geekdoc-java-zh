    Comparing characters

    The comparison operators in Table 8-1 work overtime for characters. Roughly speaking,
    the operator < means "comes earlier in the alphabet." But you have to be careful
    of the following:


    +   - Because B comes alphabetically before H, the condition ''B'' < ''H'' is
    true. That''s not surprising.

    - Because b comes alphabetically before h, the condition ''b'' < ''h'' is true.
    That''s no surprise, either.

    - Every uppercase letter comes before any of the lowercase letters, so the condition
    ''b'' < ''H'' is false. Now that''s a surprise (see Figure 8-14).


    Figure 8-14:

    The order- of the letters.


    | ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz |

    |------------------------------------------------|

    | lesser | greater |


    In practice, you seldom have reason to compare one letter with another. In Chapter
    18, you can read about Java''s String type. With the String type, you can compare
    words, names, and other good stuff. At that point, you have to think carefully
    about alphabetical ordering, and the ideas in Figure 8-14 come in handy.'
