  md: '# Chapter 8: Numbers? Who Needs Numbers?


    # # What’s behind all this findWithinHorizon

    nonsense?


    Without getting in too much detail, here''s how findWithinHorizon(".", 0 )

    charAt(0) technique works:


    Java’s findWithinHorizon method looks for things in the input. The things method

    deps on the stuff you put in parentheses. For example, a call to findWithinHorizon

    ("\d\d\d", 0) looks for a group of three digits. With the following line of code


    ```

    System.out.println(keyboard);

    findWithinHorizon("\d\d\d", 0));

    ```


    I can type


    Testing 123 Testing


    and the computer responds by displaying


    123


    In the call findWithinHorizon("\d\d\d", 0), each \d stands for a single digit.

    This \d is one of many abstractions in special code called regular expressions.


    Now here’s something strange. In the world of regular expressions, a dot stands
    for

    character at all. (That is, a dot stands for "character, not necessarily a dot")
    So

    findWithinHorizon(".", 0) tells the computer to find the next character of any\kind
    you use on the keyboard. When you’re trying to input a single character,

    findWithinHorizon(".", 0) is mighty useful.


    In the call findWithinHorizon("\d\d\d", the value 0 is a special case because
    anything other

    keep searching until the end of the input. This value 0 limits the search to a
    number of characters. (That’s why the method name contains

    word horizon. The horizon is as far as the method sees) Here are a few examples:


    +   * With the same input 123 Testing, the call find

    findWithinHorizon("\d\d\d", 9) returns null because the first

    nine characters of the input (characters Testing 1 — seven letters, a blank space,
    and

    digit) doesn’t contain consecutive digits. These nine characters don’t match the
    pattern

    \d\d\d.\.


    +   * With the same input, the call findWithinHorizon("\d\d\d", 10) also

    returns null because the first ten characters of the input (the characters

    Testing 12) don’t contain consecutive digits.


    +   * With the same input, the call findWithinHorizon("\d\d\d", 11) returns 123.

    It returns 123 because the first 11 characters of the input (the characters Testing
    123)

    these 3 consecutive digits.


    +   * With the input A57B442123, theing findWithinHorizon("\d\nd\d", 12) returns
    442. It returns 442 because among the first 12 characters of the input

    (characters A57B442123 Test), the first sequence consisting of 3 consecutive digits

    is the sequence 442.


    (continued)'
