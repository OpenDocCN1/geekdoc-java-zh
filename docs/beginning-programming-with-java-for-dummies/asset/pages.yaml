  md: "# 322 Part IV: Using Program Units\n\nThis loop takes the place of ten assignment\
    \ statements because the computer executes the statement guestsIn[roomNum] = 1\
    \ times. The first time around\n\n```\nguestsIn[0] = 1;\n```\n\nIn the next loop\
    \ iteration, the value of roomNum is 1, so the computer executes the equivalent\
    \ of the following statement:\n\n```\nguestsIn[1] = 1;\n```\n\nDuring the next\
    \ iteration, the computer behaves as if it's executing\n\n```\nguestsIn[2] = 1;\n\
    ```\n\nAnd so on. When roomNum gets to 9, the computer executes the equivalent\
    \ of the following statement:\n\n```\nguestsIn[9] = 1;\n```\n\nNotice that the\
    \ loop's counter goes from 0 to 9. Compare this with Figure 16-6 and remember\
    \ that the indices of an array from 0 to one fewer than the number of components\
    \ in the array. Looping with room numbers from 0 to 9 covers all the rooms in\
    \ the Java Motel.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_337_0.png)\n\nWhen\
    \ you work with an array, and you step through the array's components using a\
    \ for loop, you normally start the loop's counter variable at 0. To form the condition\
    \ that tests for another iteration, you often write an expression like roomNum\
    \ < arraySize, where arraySize is the number of components in the array.\n\n#\
    \ Creating a report\n\nThe code to create the report in Figure 16-5 is shown in\
    \ Listing 16-4. This new program uses the idea in the world's ugliest code (the\
    \ code from several pages back with variables guestsIn0, guestsIn1, and so on).\
    \ Instead of having ten separate variables, Listing 16-4 uses an array.\n\nListing\
    \ 16-4: Traveling Through Data Forward and Backward\n\n```\nimport java.util.Scanner;\n\
    import java.io.File;\nimport java.io.FileNotFoundException;\nclass VacanciesInReverse\
    \ {\n    public static void main(String args[])n    throws FileNotFoundException\
    \ {\n```"
