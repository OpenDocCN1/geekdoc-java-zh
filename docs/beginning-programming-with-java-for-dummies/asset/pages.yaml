    Table 7-1 lists six of Java''s primitive types (also known as simple types). Java
    has only eight primitive types, so only two of Java''s primitive types are missing
    from Table 7-1.


    Chapter 8 describes the two remaining primitive types. Chapter 17 introduces types
    that aren''t primitive.


    As a beginning programmer, you don''t have to choose among the types in Table
    7-1. Just use int for whole numbers and double for decimal numbers. If, in your
    travels, you see something like short or float in someone else''s program, just
    remember the following:


    +   - The types byte, short, int, and long represent whole numbers.

    - The types float and double represent decimal numbers.


    Most of the time, that''s all you need to know.'
