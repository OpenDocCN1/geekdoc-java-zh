  md: '# 108 Part II: Writing Your Own Java Programs


    +   - Be patient.


    Every good programming effort takes a long time to get right. If you don''t understand
    something right away, be persistent. Stick with it (or put it away for a while
    and come back to it). There''s nothing you can''t understand if you put in enough
    time.


    +   - Don''t become frustrated.


    Don''t throw your pie crust. Frustration (not lack of knowledge) is your enemy.
    If you''re frustrated, you can''t accomplish anything.


    +   - Don''t think you''re the only person who''s slow to understand.


    I''m slow, and I''m proud of it. (Melba, Chapter 6 will be a week late).


    +   - Don''t be timid.


    If your code isn''t working and you can''t figure out why it''s not working, ask
    someone. Post a message on an online forum. And don''t be afraid of anyone''s
    snide or sarcastic answer. (For a list of gestures you can make in response to
    people'' snoty answers, see Appendix Z.)


    To ask directly, send me an e-mail message, tweet me, or post to me on Facebook.
    (Send e-mail to BeginProg@allmycode.com, tweets to @allmycode, or posts to Facebook
    at /allmycode.)


    # Diagnosing a problem


    The "Typing and running a program" section, earlier in this chapter, tells you
    how to run the program. If all goes well, your screen ends up like the one in
    Figure 5-1. But things don''t always go well. Sometimes your finger slips, inserting
    a typo into your program. Sometimes you ignore one of the details in Listing 5-1,
    and you get a nasty error message.


    Of course, some things in Listing 5-1 are okay to change. Not every word in Listing
    5-1 is cast in stone. So here''s a nasty wrinkle — I can''t tell you that you
    must always retype Listing 5-1 exactly as it appears. Some changes are okay; others
    are not. Keep reading for some "instances".


    # Case sensitivity


    Java is case-sensitive. Among other things, case-sensitive means that, in a Java
    program, the letter P isn''t the same as the letter p. If you send me some fan
    mail and start with “Dear Barry” instead of “Dear Barry,” I still know what you
    mean. But Java doesn''t work that way.'
