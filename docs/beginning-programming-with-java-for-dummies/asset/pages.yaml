    # Those pesky filename extensions


    The filenames displayed in Windows File Explorer or in a Finder window can be
    misleading. You may browse one of your directories and see the name Mortgage.
    The file''s real name might be Mortgage.java, Mortgage.class, somethingElse, or
    old Mortgage. File endings like .zip, .java, and .class are called filename extensions.


    In the researching search box, type Folder Options and then press Enter. Then
    follow the instructions in the In All Versions of Windows bullet.


    +   In all versions of Windows (XP and newer): Follow the instructions in one
    of the preceding bullets. Then, follow the Options dialog box, click the View
    tab. Look for the Hide Extensions for Known File Types option. Make sure that
    this check box is not selected.


    The ugly truth is that, by default, Windows and Macs have many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here is how to do it:


    +   In OS X: In the Finder application''s menu, select Preferences. In the resulting
    dialog box, select the Advanced tab and look for the All File Extensions option.
    Make sure that this check box is selected.


    +   In Windows XP: Control Panel: Appearance and Theme: Folder Options. Follow
    the instructions in the In All Versions of Windows bullet.


    +   In Linux: Linux distributions tend not to hide file extensions. If you use
    Linux, you probably don''t have to worry about this. But if your files are named
    Mortgage instead of Mortgage.class, check the documentation specific to your Linux
    distribution.


    +   In Windows 7: Control Panel-: Appearance and Personalization: Folder Options.
    Follow the instructions in the In All Versions of Windows bullet.


    +   In Windows 8: In the Start screen, hold down the Windows key while pressing
    Q.'
