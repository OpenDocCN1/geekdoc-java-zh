    \ Explorer.)\n\n![](img/f938eba5f15e231d828a6255e7ec5523_346_4.png)\n\nWhen you\
    \ call listOf(), the resulting array doesn't include things in subdirectories\
    \ of the folder directory. Just to make sure, I created dFile.txt inside the 16-06\
