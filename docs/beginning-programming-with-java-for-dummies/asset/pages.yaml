  md: "# Chapter 16: Using Loops and Arrays 321\n\nUsing an array saves you from having\
    \ to declare two separate variables: guestsIn0, guestsIn1, guestsIn2, and so on.\
    \ To declare an array ten values in it, you can write two fairly short lines of\
    \ code:\n\n```\nint guestsIn[\nguestIn = new int[10];\n```\n\nYou can even squash\
    \ these two lines into one longer line:\n\n```\nint guestsIn[] = new int[10];\n\
    ```\n\nIn either of these code snippets, notice the use of the number 10. This\
    \ number tells the computer to make the guestsIn array ten components. Each component\
    \ of the array has a name of its own. The starting component is named guestsIn[0],\
    \ the next is named guestsIn[1], and so on. The last of the ten components is\
    \ named guestsIn[9].\n\nIn creating an array, you always specify the number of\
    \ components. The array's indices always start with 0 and end with the number\
    \ that's fewer than the total number of components. For example, if your array\
    \ has ten components (and you declare the array with new int[10]), the array's\
    \ indices go from 0 to 9.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_336_0.png)\n\
    \n# Storing values in an array\n\nAfter you've created an array, you can put values\
    \ into the array's components. For example, the guests in Room 6 are fed up with\
    \ all those mint candies that you put on peoples' beds. They check out, and Room\
    \ 6 becomes vacant. You should put the value 0 into the 6 component. You can do\
    \ it with this assignment statement:\n\n```\nguestsIn[6] = 0;\n```\n\nOn one weekday,\
    \ business is awful. A bus pulls up to the motel. The side of the bus has a sign\
    \ that says \"Loners' Convention.\" Out of the bus 25 people, each walking to\
    \ the motel's small office, none paying attention to the others who were on the\
    \ bus. Each person wants a private room. Only 10 of them can stay at the Java\
    \ Motel, but that's okay, because you can send the other 15 loners down to the\
    \ old C-Side Resort and Motel Lodge.\n\nAnyway, register ten of the loners into\
    \ the Java Motel, you can put one guest in each of your ten rooms. Having created\
    \ an array, you can take advantage of the array's indexing and write a for loop,\
    \ like this:\n\n```\nfor (int roomNum = 0; roomNum < 10; roomNum++) {\n  guestsIn[roomNum]\
    \ = 1;\n}\n```"
