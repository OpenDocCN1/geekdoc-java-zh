    \ = aPurchase.amount * 1.05;\n```\n\n# ## Some questions and answers\n\nHere's\
    \ the world's briefest object-oriented programming FAQ:\n\n+   * Can I have an\
    \ object without a class?\n  No, you can't. In Java, every object is an instance\
    \ of a class.\n\n+   * Can I have a class without having an object?\n\nYes, in\
    \ fact, almost every program in this book creates a class without an object. Taking\
    \ Listing 17-5, for example. The code in Listing 17-5 defines a class named ProcessPurchases.\
    \ Nowhere in Listing 17-5 (or anywhere else) do I create an instance of the ProcessPurchases\
    \ class. I have a class with no objects. That's just fine. It's business as usual.\n\
    \n+   * After I've created a class and its instances, can I add more instances\
    \ to the class?\n\nYes, you can. In Listing 17-5, I create one instance, then\
    \ another, and then a third. If I added one time around the for loop, I'd have\
    \ a fourth instance, and I'd put a fourth row in the table of Figure 17-8. With\
    \ no objects, three objects, four objects, or more objects, I still have the same\
    \ old Purchase class.\n\n+   * Can an object come from more than one class?\n\n\
    Bit your tongue! Maybe other object-oriented languages allow this nasty class\
    \ cross-breeding, but in Java, it's strictly forbidden. That's one of the things\
    \ that distinguishes Java from some of the languages that preceded it. Java is\
    \ cleaner, more uniform, and easier to understand."
