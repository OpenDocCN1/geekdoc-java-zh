  md: "# Part IV: Using Program Units\n\nJava shapes its input and output to match\
    \ your computer's locale. Imagine, for example, that your computer runs the version\
    \ of Windows sold in France. Then, as far as Java is concerned, your computer's\
    \ locale is Locale. FRANCE, and a run of the code in Listing 18-7 looks like the\
    \ run shown in Figure 18-11.\n\nFigure 18-11: A run of Listing 18-7 on a computer\
    \ in France.\n\n| Amount: 20.00 |\n| Taxable? (true/false) true |\n| Total: 21,00\
    \ € |\n\nIn far, you can customize your code for many countries, and you don't\
    \ have to buy airplane tickets to do it! My computer is configured to run in the\
    \ United States. But in Listing 18-8, I use Java's *Locale* class to get the run\
    \ shown in Figure 18-11.\n\n# Listing 18-8: Using a Java Locale\n\n```\nimport\
