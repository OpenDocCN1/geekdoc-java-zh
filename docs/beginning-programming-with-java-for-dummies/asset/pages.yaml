  md: '# Chapter 20: Oooey GUI Was a Worm


    Here''s the scoop on the JFrame methods in Listing 20-1:


    +   The call frame.add(label) plops the label onto the frame. The label displays
    my androidBot.jpg, so this makes the frame appear on the frame.


    +   A call to frame.setDefaultCloseOperation tells Java what to do when you try
    to close the frame. (In Windows, you click the "x" in the upper-right corner by
    the title bar. On a Mac, the "x" is in the frame''s upper-left corner) For a frame
    that''s part of a larger application, you may want the frame to disappear when
    you click the "x", but you don''t want the application to stop running.


    But in Listing 20-1, the frame is the entire application — the whole enchilada.
    So when you click "x", you want the Java Virtual Machine to shut itself down.
    To make this, you call the setDefaultCloseOperation method with parameter JFrame.
    EXIT_ON_CLOSE. The other alternatives are as:


    +   JFrame.HIDE_ON_CLOSE: The frame disappears, but it still exists in the computer''s
    memory.


    +   JFrame.DISPOSE_ON_CLOSE: The frame disappears and no longer exists in the
    computer''s memory.


    +   JFrame.DO_NOTHING_ON_CLOSE: The frame still appears, still exists, and still
    does everything before you clicked the "x". Nothing happens when you click "x".
    With this DO_NOTHING_ON_CLOSE option, you can become very confused.


    If you don''t call setDefaultCloseOperation, Java automatically chooses the HIDE_ON_CLOSE
    option. When you click the "x", the frame disappears, and the Java program keeps
    running. With course, no visible frame, the running of Listing 20-1 doesn''t do
    much. The noticeable effect of the run is your development environment''s behavior.
    With Eclipse, the little square in the Console view has bright red color. When
    you hover over the square, you get the Terminate tooltip. So to end the program''s
    run (and to return the square to its washed-out reddish grey), simply click this
    little square.


    +   A frame''s pack method shrink-wraps the frame around whatever has been added
    to the frame. Without calling pack, the frame can be much bigger or smaller than
    is necessary.


    Unfortunately, the default is to make a frame much smaller than necessary. If,
    in Listing 20-1, you forget to call frame.pack, you get the tiny frame shown in
    Figure 20-3. Sure, you can enlarge the frame by dragging the frame''s edges with
    your mouse. But why should you have to do that? Just call frame.pack, instead.


    ![](img/f938eba5f15e231d828a6255e7ec5523_414_0.png)'
