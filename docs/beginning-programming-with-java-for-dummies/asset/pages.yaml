    and start calling them identifiers. In computer programming, an identifier is
    a noun of some kind. An identifier refers to a value, a part of a program, a certain
    kind structure, or any of numbers.


    Listing 4-1 has two identifiers that you or I define on our own. They''re the
    made-up words ThingsILike and args.


    ```

