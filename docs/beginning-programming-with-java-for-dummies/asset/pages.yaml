  md: '# 206 Part III: Controlling the Flow


    In Figure 10-8, notice that the y and Y inputs yield different ticket prices,
    even though the age is 85 in both runs. This happens because, without parentheses,
    any && operator gets evaluate before || operator. (That''s the rule in the Java
    programming language — evaluate && before || operator.) When reply is Y, the condition
    in the if statement takes the following form:


    ```

    reply == ''Y'' || some-other-stuff-that-doesn_t-matter

    ```


    Whenever reply == ''Y'' is true, the whole condition is automatically true, as
    illustrated in Figure 10-9.


    ![](img/f938eba5f15e231d828a6255e7ec5523_221_0.png)


    Figure 10-9: "True or false" makes "true."


