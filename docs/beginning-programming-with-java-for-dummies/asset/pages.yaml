  md: '# 70 Part I: Getting Started with Java Programming


    ![](img/f938eba5f15e231d828a6255e7ec5523_85_0.png)


    Figure 3-15: The workbench is divided into areas.


    # Views, bunch, editors, and other stuff


    The next bunch of terms deals with things called views, editors, and tabs.


    You may have difficulty understanding the difference between views and editors-ors
    (A view is like an editor, which is like a view, or something like that.) If views
    and editors seem the same to you, you''re not sure which one is which, which won''t
    be upset. As an ordinary Eclipse, the distinction between views and editors comes
    naturally as you gain experience using the workbench. You rarely have to decide
    whether the thing you''re using is a view or an editor.


    If you ever have to decide what a view is as opposed to an editor, here''s what
    you need to know:


    +   View: A part of the Eclipse workbench that displays information for you to
    browse. In the simplest case, a view fills up an area in the workbench. For example,
    in Figure 3-3, the Package Explorer fills up the left-most area.


    Many views display information as lists or trees. For example, in Figure 3-10,
    the Package Explorer view contains a tree.


    You can use a view to make changes to things. For example, to delete SomeOtherProject
    in Figure 3-10, right-click the SomeOtherProject branch in the Package Explorer
    view. (On a Mac, control-click the SomeOtherProject branch.) Then, in the resulting
    context menu, choose Delete.'
