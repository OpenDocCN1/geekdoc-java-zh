    \n```\n//You can't do this:\nswitch (age) {\ncase age <= 12: //...etc.\n```\n\n\
    # Break or not to break\n\nAt one time or another, every Java programmer forgets\
    \ to use break statements. At first, the resulting output is confusing, but then\
    \ the programmer remembers fall-through. The term fall-through describes what\
    \ happens when you end a case without a break statement. What happens is execution\
    \ of the code falls through to the next case in line. Execution falls through\
    \ until you eventually reach a break statement or the end of the entire statement.\n\
    \nIf you don't believe me, just look at Listing 11-2. This listing's code has\
    \ a switch statement gone bad.\n\nListing 11-2: Please, Gimme a Break!\n\n```\n\
