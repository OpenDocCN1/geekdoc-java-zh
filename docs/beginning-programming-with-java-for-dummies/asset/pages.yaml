  md: 'Figure 15-1 shows what you get when you run the program of Listing 15-1:


    +   - The for statement in Listing 15-1 starts by setting the count variable equal
    to 0.


    +   - Then the for statement tests to make sure that count is less than 10 (which
    it certainly is).


    +   - Then the for statement dives ahead and executes the printing-statements
    between the curly braces. In this early stage of the game, the computer prints
    I''ve chewed 0 time(s).


    +   - Then the for statement executes count++ — that thing inside the statement''s
    parentheses. This last action adds 1 to the value of count.


    ```

    Console Probier

    <terminated> AuntEdnaSettle

    I''ve chewed 2 time(s).

    ve chewed 3 time(s).

    I''ve chewed 4 time(s).

    I''ve chewed 5 time(s).

    I''ve chewed 6 time(s).

    I''ve chewed 7 time(s).

    I''ve chewed 8 time(s).

    I''ve chewed 9 time(s).

    10 times! Hooray!

    I swallow!

    ```


    Figure 15-1: Chewing ten times.


    This ends the first iteration of the for statement in Listing 15-1. Of course,
    this loop has more to it than one iteration:


    +   - With count now equal to 1, the for statement checks again to make sure that
    count is less than 10. (Yes, 1 is smaller than 10.)


    +   - Because the test turns out, the for statement marches back into the curly
    braced statements and I''ve chewed 1 time(s) on the screen.


    +   - Then the for statement executes last count++ inside its parentheses. The
    statement adds to the value of count, increasing the value of count to 2.


    And so on. This whole thing keeps being repeated over and again until, after ten
    iterations, the value of count finally reaches 10. When this happens, the check
    for count being less than 10 fails, and the loop''s execution ends.'
