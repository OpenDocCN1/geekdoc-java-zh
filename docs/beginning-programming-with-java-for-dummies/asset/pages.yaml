  md: '# 390 Part IV: Using Program Units


    Here''s what happens when getInterest is called (you can follow along in Figure
    19-9):


    +   The value of balance is 9508.00, and the value of rate is 2.0. So the value
    of balance * (rate / 100.0) is 190.16 — one hundred ninety dollars and sixteen
    cents.


    +   The value 190.16 gets assigned to the interest variable, so the statement
    return interest;


    ```

    return interest;

    ```


    has the same effect as return 190.16;


    +   The return statement sends this value 190.16 back to the code that called
    the method. At that point in the process, the entire method call in Listing 19-9
    — anAccount.getInterest(interestRate) — takes on value 190.16.


    +   Finally, the value 190.16 gets assigned to the variable yearlyInterest.


    ![](img/f938eba5f15e231d828a6255e7ec5523_405_0.png)


    Figure 19-9: A method call is an expression with a value.


    > REMEMBER a method returns anything, then a call to the method is an expression
    with a value. That value can be printed, assigned to a variable, added to something
    else, or whatever. Anything you can do with any other kind of value, you can do
    with a method call.'
