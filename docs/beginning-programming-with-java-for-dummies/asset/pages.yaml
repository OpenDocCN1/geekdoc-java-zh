    # Running the code


    To have Eclipse run the code, the same thing you do with any other Java program.
    Select the project you want to run (project 13-02 in this example). Then choose
    Run As Java Application.


    When you run the program in Listing 13-2, no text appears in Eclipse''s Console
    view. This total lack of any noticeable output gives some people the willies.
    The truth is, a program like the one in Listing 13-2 does all its work behind
    the scenes. The program has no statements that read from the keyboard and has
    no statements to print to the screen. So, if you have a very loud hard drive,
    you may hear a little chirping sound when you choose Run As Java Application,
    but you won''t type any program input, and you won''t see any program output.


