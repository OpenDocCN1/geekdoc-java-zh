  md: '# Chapter 3: Running Programs


    # REMEMBER


    When you use a view to change something, the change takes place immediately. For
    example, when you choose Delete in the Package Explorer''s context menu, whatever
    item you''ve selected is deleted immediately. In a way, this behavior is nothing
    new. The same kind of thing happens when you recycle a file using Windows Explorer
    or a trash file using the Macintosh Finder.


    ![](img/f938eba5f15e231d828a6255e7ec5523_86_0.png)


    **Editor:** A part of the Eclipse workbench that displays information for you
    to modify. A typical editor displays information in the form of text. This text
    can be the contents of a file. For example, an editor in Figure 3-10 displays
    the contents of the MyJavaClass.java file.


    ![](img/f938eba5f15e231d828a6255e7ec5523_86_1.png)


    When you use an editor to change something, the change doesn''t take place immediately.
    For example, look at the editor in Figure 3-10. This editor displays the contents
    of the MyJavaClass.java file. You can type all kinds of things in the editor.
    Nothing happens to MyJavaClass.java until you choose Save from Eclipse''s menu
    bar. Of course, this course, this behavior is nothing new. The same kind of thing
    happens when you work in Microsoft Word or in any other word-processing program.


    ![](img/f938eba5f15e231d828a6255e7ec5523_86_2.png)


    Like others, I occasionally become lazy and use the "view" when I really mean
    "view or editor.\ When you catch me doing this, shake your head and move onward.
    When I''m being careful, I use the official Eclipse terminology. I refer to views
    and editors as parts of the Eclipse workbench. Unfortunately, this "parts" terminology
    doesn''t stick in people'' minds very well.


    An area of the Eclipse workbench might contain several views or several editors.
    Most Eclipse get along fine without giving this "several views" second thought
    (or even a first). But if you care about the terminology surrounding tabs and
    active views, here''s the scoop:


    +   * **Tab:** Something that''s impossible to describe by calling it a "tab."
    When we call a tab by any other name would moves us from one view to another or
    from one editor to another. The important thing is, views can be stacked on top
    of one another. Eclipse displays views as though they''re pages in a notebook.
    For example, Figure 3-14 displays one area of the Eclipse workbench. The area
    contains five views (the Problems view, the Javadoc view, the Declaration view,
    the Search view, and the Console view). Each view has its own tab.


    A bunch of stacked views is called a tab group. To bring a view in the stack to
    the foreground, you click that view''s tab.


    And, by the way, all this stuff about tabs and views holds true for tabs and editors.
    The only interesting thing is that Eclipse uses the word "editor." In Eclipse,
    each tagged page of the editor area is an individual editor. For example, the
    Editor area in Figure 3-16 contains three editors (not three tabs belonging to
    a single editor)'
