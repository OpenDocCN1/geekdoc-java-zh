  md: '# Part III: Controlling the Flow


    # A quick look at Java''s disk access facilities


    Templates like the ones in Listings 13-3 and 13-4 are very nice. But knowing how
    the templates work is even better. Here are a few describing the inner workings
    of Java''s disk access code.


    In Listing 13-2, the added words throws FileNotFoundException form a throws clause.
    A clause is a kind of disclaimer. Throwing a clause in your code is like saying,
    "I realize that this can run into trouble."


    +   - A PrintStream is something you can use for writing output.


    A PrintStream is like a Scanner. The big difference is that a Scanner is for reading
    input and a PrintStream is for writing output. To see what I mean, look at Listing
    13-2. Notice the similarity between the statements that use Scanner and the statements
    that use PrintStream.


    Of course, in the legal realm, you often have no choice about signing disclaimers.
    If you don''t sign this disclaimer, then the surgeon operates on you. "Okay, I''ll
    sign it. The same is true with a Java throws clause. If you put things like PrintStream(`data.txt`)
    in your code, and don''t add anything like FileNotFoundException, then the Java
    compiler compiles to your code.


    The word Print is defined in the Java API.


    So when you do this FileNotFoundException clause, and when should you do with
    it? Well, having things in your code - things like new PrintStream(`data.txt`)
    - forces you to create a throws clause. You can spend all about the kinds of things
    that demand clauses. At this point, it''s better to concentrate on other issues.
    As a Java programmer, the safest thing to do is to follow the templates in Listings
    13-3 and 13-4.


    +   - In Listing 13-2, the expression new File(`rawData.txt`) plays the same role
    as System.in plays in many other programs.


    Just as System stands for the computer''s keyboard, the expression new File(`rawData.txt`)
    stands for a file on your computer''s hard drive. When the method calls File(`rawData.txt`),
    the computer creates something like System.in — something you can stuff inside
    the new Scanner ( ).


    The word File is defined in the Java API.


    +   - The word FileNotFoundException is something that may go wrong during an
    attempt to read from a disk file (or an attempt to write out a disk file).


    Disk access is loaded with pitfalls. Even the best programs run into trouble occasionally.
    To brace against such pitfalls, Java insists on your adding some extra words to
    your code.


    +   - To create this chapter''s code, I made up the names diskScanner and diskWriter.


    The words diskScanner and diskWriter don''t come from the Java API. In place of
    diskScanner and'
