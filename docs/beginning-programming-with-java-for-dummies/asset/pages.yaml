    \ is an example of a compound statement — a statement that\nincludes other statements\
    \ within it. The if statement in Listing 9-1 includes\ntwo println calls, and\
    \ these calls to println are statements.\n\nNotice how we use parentheses and\
    \ semicolons in the if statement of\nListing 9-1. In particular, notice the following:\n\
    \n+   - The condition must be in parentheses.\n- Statements inside if clause end\
    \ with semicolons. So do statements\ninside the else clause.\n- There is no semicolon\
    \ immediately after the condition.\n- There's no semicolon immediately after the\
    \ word else.\n\nAs being programmer, you may think these rules are arbitrary.\
    \ But\nthey're not. These rules belong to a very carefully crafted grammar. They're\n\
