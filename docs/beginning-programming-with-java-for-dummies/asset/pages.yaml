  md: '# 92 Part II: Writing Your Own Java Programs


    When the ThingsLike program runs, the computer automatically finds the program''s
    main method and executes every instruction inside the method''s body. In the ThingsLike
    program, the main method''s body has only one instruction. That instruction tells
    the computer to print Chocolate, royalties, sleep on the screen.


    None of the instructions in a method are executed until the method is called into
    action. But if you give a method the name main, that method is called into action
    automatically.


    ![](img/f938eba5f15e231d828a6255e7ec5523_107_0.png)


    # How you finally tell the computer to do something


    Buried deep in the heart of Listing 4-1 is the single line that issues a direct
    instruction to the computer. The line


    ```

    System.out.println("Chocolate, sleep");

    ```


    tells the computer to display the words Chocolate, royalties, sleep. (If you use
    Eclipse, the computer displays Chocolate, royalties, sleep in the Console view.)
    I can describe this line of code in at least two ways:


    +   It''s a statement. In Java, a direct instruction that tells the computer to
    do something is called a statement. The statement in Listing 4-1 tells the computer
    to display some text. The statements in other programs may tell the computer to
    put 7 in a certain memory location or make a window appear on the screen. The
    statements in computer programs do all kinds of things.


    +   It''s a method call. In the "What is a method?" section, earlier in this chapter,
    I describe something named a "method call." The statement FixTheAlternator(junkyOldFord);
    is an example of a method call, and so is


    ```

    System.out.println("Chocolate, royalties, sleep");

    ```


    Java has many different kinds of statements. A method call is just one kind.'
