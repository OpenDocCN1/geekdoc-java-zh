  md: '# 230 Part III: Controlling the Flow


    February also contains its own if statement. In Chapter 10, I nest statements
    within other if statements. But in February, I nest an if statement within a switch
    statement. That''s cool.


    # Using a Conditional Operator


    Java has a neat feature that I can''t resist writing about. Using this feature,
    you can think about alternatives in a very natural way.


    And what do I mean by “a natural way?” If I think out loud as I imitate the statement
    near the end of Listing 11-3, I come up with this:


    ```

    //The thinking in Listing 11-3:

    What should I do next?

    If this is a leap year,

    I_ll make the numberOfDays be 29;

    Otherwise,

    I_ll make the numberOfDays be 28.

    ```


    I''m wandering into an if without a clause about what I''m doing next. That seems
    silly. It''s February, and everybody knows what you do in February. You ask how
    many days the month has.


    In my opinion, the code in Listing 11-3 doesn''t reflect the most natural way
    to think about February. Here''s a more natural way to:


    ```

    //A more natural way to think about the problem:

    The value of numberOfDays is...

    Wait! Is this a leap year?

    If yes, 29

    If no, 28

    ```


    In this second, more natural way of thinking, I know from a fork in the road that
    I start picking a number of days. So by the time I reach a fork (Is a leap year?),
    the only remaining task is to choose between 29 and 28.


    I can make the choice with finesse:


    ```

    case 2:

    System.out.print("Leap year (true/false)");

    nisLeapYear = keyboard.nextBoolean();

    numberOfDays = isLeapYear ? 29 : 28;

    ```


    The ? : combination is called a conditional operator. In Figure 11-6, I show how
    your natural thinking about February can morph into the conditional operator''s
    format.'
