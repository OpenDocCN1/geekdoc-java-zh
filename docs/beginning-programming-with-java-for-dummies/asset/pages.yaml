    \ formatting, but you don't. Instead, what you see is called syntax coloring or\
    \ syntax highlighting.\n\nprogram file. Instead, the editor displays each word\
    \ in a way that makes the Java program easy to read.\n\nFor example, in a Java\
    \ program, certain words (like class, public, and void) have their own special\
    \ meanings. Eclipse's editor displays class, public, and in bold, reddish letters.\
    \ When I save my Java program, the computer stores nothing about bold, colored\
    \ letters in my Java program file. The editor uses its discretion to highlight\
    \ words with red-dish coloring.\n\nNo matter what you call it, the issue is as\
