    # Computers Are Stupid


    Handy as they are, all computers do the same damn thing. They do exactly what
    you tell them to do, and that''s sometimes very unfortunate. For example, in 1962,
    a Mariner spacecraft to Venus was destroyed just four minutes after its launch.
    Why? It destroyed because of a missing keystroke in an FORTRAN program. Around
    the same time, NASA scientists caught an error that could have trashed the Mercury
    space flights. (Yup! These flights were with people on board!) The error was a
    line with a period instead of a comma. (A computer programmer wrote DO 10 I=1.10
    instead of DO 10 I=1, 10.)


    With all respect to my buddy RoboJeeeves, he and his computer cousins are all
    incredibly stupid. Sometimes they look as though they''re guessing us humans,
    but actually they''re just doing what other humans tell them to. They can toss
    virtual coins and use elaborate schemes to mimic creative behavior, but they never
    think on their own. If you say, "Jump," they do what they are programmed to do
    in response to the letters J-u-m-p.


    When you write a computer program, you have to imagine that a genie has granted
    you three wishes. Don''t ask for eternal love, if you do, then the genie will
    give you a slobbering, adoring mate — someone that you don''t like at all. And
    don''t ask for a million dollars unless you want the genie to turn you into a
    bank robber.


    Everything you write in a computer program has to be very precise. Take a look
    at an example. ....


