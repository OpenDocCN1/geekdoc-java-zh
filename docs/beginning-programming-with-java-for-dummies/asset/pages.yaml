  md: '# Chapter 18: Using Methods and Variables from a Java Class 361


    So in Listing 18-6, you call the Scanner class''s nextLine method, allowing a
    user to enter any characters at all — not just digits. If the user types not playing,
    you don''t give the killjoy chips.


    If you use some digits, you''ll get stuck these digits in the string variable
    reply. You can''t add to a string like reply. So you call the Integer class''s
    parseInt method, which takes your string and hands you a nice int value. From
    there, you can add to the int value.


    Java has a loophole that allows you to add a number to a string. Adding the number
    10 to the string "30" gives you "3010", 40.


    Don''t confuse Integer with int. In Java, int is the name of a primitive type
    (a type that you use throughout this book). But Integer is the name of a class.
    Java''s Integer class contains many handy methods for dealing with int values.
    For example, in Listing 18-6, the Integer class''s parseInt method makes an int
    value.


