  md: '# Chapter 3: Running Programs


    If you don''t type the code exactly as it''s shown in Listing 3-1, you may see
    jagged red underlines, tiny rectangles with X-like markings inside, or other red
    marks in the Editor (see Figure 3-12).


    ![](img/f938eba5f15e231d828a6255e7ec5523_80_0.png)


    ```

    MyFirstJavaClass.java

    1  public class MyFirstJavaClass {

    2      @Override

    3      String args

    4      public static void main(String[] args) {

    5          System.out.println("Chocolate, royalties, sleep");

    6      }

    7}

    ```


    The red markers in Eclipse''s editor refer to compile-time errors in your Java
    code. A compile-time error (also known as a compiler error) is an error that prevents
    the computer from translating your code. (See the talk about translation in Chapter
    1.4.)


    The error markers in Figure 3-12 appear on line 8 of the Java program. Line numbers
    appear in the editor''s left margin. Now choose Window:Preferences (on Windows)
    or Eclipse:Preferences (on a Mac). Then choose General:Editor:Text Editors. Finally,
    put a check in the Show Line Numbers box.


    To fix compile-time errors, you must know a dedicated detective. You join an elite
    squad known as Law & Order Java Programming Unit. You seldom find easy answers.
    Instead, you comb everything you see in the editor, character by character, with
    my code in Listing 3-1. You don''t don''t miss a single detail, including spelling,
    punctuation, and uppercase versus lowercase.


    Eclipse has a few features to help you find the source of a compile-time error.
    For example, you can hover over the jagged red underline for a brief explanation
    of the error along with suggestions for repairing the error — some quick fixes
    (see Figure 3-13).


    In Figure 3-13, a popup tells you that Java doesn''t know what the word system
    means — that, system cannot be resolved. Near the bottom of the figure, one of
    the quick fix options is to change system to System.


    When you click Change To ''System'' (java.lang) option, Eclipse''s editor replaces
    system with System. The editor''s error markers disappear, and you go from the
    incorrect code in Figure 3-12 to the correct code back in Figure 3-11.'
