    \ back;\n    LongSkinnyVerticalRods legs;\n}\n```\n\nThe preceding code is a design\
    \ plan for chairs. The code tells you that each chair has three things. The code\
    \ names the things (seat, back, and legs) and tells you a little bit about each\
    \ thing. (For example, a seat is a"
