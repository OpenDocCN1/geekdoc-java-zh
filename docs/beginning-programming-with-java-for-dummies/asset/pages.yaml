    precisely, a number is random if the process used to generate the number follows
    the two preceding trends. When they''re being careful, scientists avoid the term
    random number and use the term randomly generated instead.


    It''s hard to generate numbers randomly. Computer programs do be the best they
    can, but ultimately, today''s computer programs are not truly random.


    To generate in a truly random fashion, you need a big tub of ping-pong balls,
    like the kind they see in lottery draws. The problem is, most computers come with
    big tubs of ping-pong balls among their peripherals. Strictly speaking, the numbers
    generated by Java''s Random class aren''t random. Instead, scientists will call
    them pseudorandom.


