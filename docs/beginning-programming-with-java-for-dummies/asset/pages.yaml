    Socks: \");\nout.println(socks);\n} else if (gameCancelled) {\n    out.println(\"\
    Sorry, sports fans.\");\n} else {\n    out.println(\"The game isn't over yet.\"\
    );\n}\n```\n\nNothing is special about cascading if statements. This isn't a new\
    \ programming language feature. Cascading if statements takes advantage of a loophole\
    \ in Java — a loophole about omitting curly braces in certain circumstances. Other\
    \ than that, cascading if statements just gives you a new way to think about decisions\
    \ within your code.\n\n**Note:** 10-6 uses a static import declaration to avoid\
    \ needless repetition of the words `System.out`. To read a little bit about the\
    \ static import declaration (with an analogy for not explaining this concept more),\
    \ see Chapter 9. To get the real story on static import declarations, see Chapter\
    \ 18.\n\n# Enumerating the Possibilities\n\nChapter 8 describes Java's boolean\
    \ type — the type with only two values (true and false). The boolean type is very\
    \ handy, but sometimes you need more values. After all, a traffic light's values\
    \ can be green, yellow, or red. A playing card's suit can be spade, club, heart,\
    \ or diamond. A weekday can be Monday, Tuesday, Wednesday, Thursday, or Friday.\n\
    \nLife is filled with small sets of possibilities, and Java has a feature to reflect\
    \ these possibilities. The feature is called an `enum` type. It's available from\
    \ Java version 5.0 onward.\n\n# Creating an enum type\n\nThe story in Listing\
    \ 10-6 has three possible endings — the Hankees win, the Socks win, or the game\
    \ is tied. You can represent the possibilities with the following line of Java\
    \ code:\n\n```\nenum WhoWins {home, visitor, neither};\n```\n\nThis week's game\
    \ is played at Hankeeville's SnSoftStadium, so the value home represents a win\
    \ for the Hankees, and the value visitor represents a win for the Socks."
