  md: '# Chapter 9: Forks in the Road


    TIP

    You don''t have to think about indenting your code because Eclipse can indent

    your code automatically. For details, see Chapter 4.


    # Variations on the Theme


    I don''t like to skin cats. But I''ve heard that, if I ever need to skin one,
    I have

    a choice of several techniques. I''ll keep that in my mind the next time my cat

    Histamine mistakes the carpet for a litter box.


    Anyway, whether you''re skinning catfish, skinning kitties, or writing computer

    programs, the same principle holds true. You always have alternatives. Listing
    9-2

    shows one way to write an if statement. The rest of this chapter (and all of

    Chapter 10) shows you some other ways to create if statements.


    # ... Or else what?


    You can create an if statement without an else clause. For example, imagine

    a web page on which one in ten randomly visitors receives a special

    off. To keep visitors visiting, I call the Random class''s nextInt method, and

    make the offer to anyone whose lucky is 7.


    +   * IfRandom.nextInt(10) + 1 generates the number 7, display a

    special offer message.

    * IfRandom.nextInt(10) + 1 generates any number other than 7,

    do nothing. Don''t display a special offer message and don''t display a

    discouraging. "Sorry, no offer for you," message.


    > Rick Ross, who refers to ''skinning cats'' in one of my other books, sent this
    information via

    e-mail: "...you refer to ''skinning the cat'' and go on to discuss litter boxes
    and whatnot.

    ote that the phrase ''more than one way to skin cats'' refers to the difficulty
    in removing the inedibleskin from catfish, and that there is more than one way
    to do that. These range from ranging

    critter''s tail to a board and taking a pair of pliers to peel it down, to letting
    the furry kind

    cat have the darn thing and not worrying about it. I grew up on the River (the
    one running

    north/south the US that begins with MI and has so many runners), so it''s integral

    to our experience." Another reader, Alan Wilson, added two cents to this discussion:
    "

    the phrase ''skinning a Cat...'' actually has an other but equally interesting
    Naval origin. It

    refers to the activity of attaching the nine ropes to the whip used to punish
    recalcitrant sailors up

    to a couple of hundred years ago. The ''Cat O Nine Tails'' was the name of the
    whip and there was

    more than one way to attach the ropes or ''skin'' the whip. One way or another,
    it''s time for me to

    apologize to my little house pet.'
