    Listing 10-2 has two if statements whose involve characters:


    +   - In the first statement, the computer checks to see whether the reply variable
    stores the letter y or the letter Y. If either is the case, subtracts 2.00 from
    the price. (For information on operators ==, Chapter 7.)


    +   - The second statement has a hefty condition. The condition tests to see the
    reply variable stores any reasonable value at all. If the reply isn''t Y, and
    isn''t y, and isn''t N, and isn''t n, the computer expresses its concern by displaying,
    "Huh?" (As a paying customer, the word "Huh?" on the automated ticket seller''s
    screen will certainly get your attention.)


    When you create a big multipart condition, you always have several ways to think
    about the condition. For example, you can rewrite the last condition in Listing
    10-2 as if ((reply == ''Y'' || reply == ''y'' || reply == ''N'' || reply == ''n'')).
    If it''s not the case that the reply is either Y, n, or N, then display "Huh?"
    So which way of writing the condition is better — the way I do in Listing 10-2,
    or the way I do in this? It depends on your taste. Whichever makes the logic easier
    for you to understand is the better.


    ![](img/f938eba5f15e231d828a6255e7ec5523_216_0.png)


    # Using boolean variables


    No matter how good a program is, you can always make it a little bit better. Take
    the code in Listing 10-2. Does the forest of if statements make you nervous? Do
    you slow to a crawl when you read each condition? Wouldn''t it be nice if you
    could glance at a condition and make sense of it quickly?


    To some extent, if you''re willing to create some additional variables, you can
    make your code easier to read. Listing 10-3 shows you how.'
