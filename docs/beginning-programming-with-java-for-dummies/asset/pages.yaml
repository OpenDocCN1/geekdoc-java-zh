    # Statements and blocks (plagiarizing my own sentences from Chapter 9)


    Java''s while statements have a lot in common with if statements. Like an if statement,
    a while statement is a compound statement — that is, a while statement includes
    other statements within it. Also, both statements and while statements typically
    blocks of statements. When you round a bunch of statements with curly braces,
    you get what is called a block, and a block behaves, in all respects, like a single
    statement.


    ```

    diel1=myRandom.nextInt(6) +1;

    diel2=myRandom.nextInt(6) +1;

    out.print(diel1);

    out.print(" ");

    out.println(die2);

    ```


    In a typical statement, you want the computer to repeat several smaller statements
    over and over again. To repeat several smaller statements, you combine these statements
    into one statement. To do this, you make a block using curly braces.


    is a single statement. It''s a statement that has within it, five smaller statements.
    So this block (single statement) serves as one block statement inside the while
    statement in Listing 12-1.


    That''s the story about statements and blocks. To find out how this applies to
    if statements, see the "Statements and blocks" sidebar near the end of Chapter
    9.


