    (Sorry, Melba).\n\nTable 9-1 shows the kinds of things that can go wrong when\
    \ you break\nthe if statement punctuation rules. The table's last two items are\
    \ the\\most notorious. In these two situations, the compiler doesn't catch the\n\
    error. This lulls you into a false sense of security. The trouble is, when you\n\
    run the program, the code's behavior isn't what you expect it to be.\n\n| Table\
    \ 9-1 | Common if Statement Error Messages |\n| Error | Example | Most Likely\
