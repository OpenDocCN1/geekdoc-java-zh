  md: '# Versatile looping statements


    If you were stuck on a desert island with only one kind of loop, what kind would
    you want to have? The answer is, you can get along with any kind of loop. The
    choice between a while loop and a for loop is about the code''s style and efficiency.
    It is not about necessity.


    ```

    total += card;

    System.out.print(card);

    System.out.print(" ");

    System.out.println(total);


    ```


    Anything that you can do with a for loop, you can do with a while loop as well.
    For example, the for loop in Listing 15-1. Here how you can achieve the same effect
    with a while loop:


    Turning this into a for loop removes most of the stuff inside the loop''s parentheses:


    ```

    for ( total < 21; ) {

    card =

    myRandom.nextInt(10) + 1;

    total += card;

    System.out.print(card);

    System.out.print(" ");

    System.out.println(total);

    }


    ```


    ```

    int count = 0;

    while (count < 10) {

    out.print("Ive checked ");

    out.print(count);

    out.println(" " + time + ");\ncount++;

    }


    ```


    The for loop has a condition, but it has no initialization and no update. Without
    an initialization, nothing special happens when the computer enters the for loop.
    Without an update, nothing special at the end of each iteration. It''s strange,
    but it works.


    In the while loop, you have explicit statements to declare, initialize, and increment
    the count variable.


    The same kind of trick works in reverse. Anything that you can do with a for loop,
    you can do with a while loop. But certain while loops into for loops seems strange
    and unnatural. Consider a while loop from Listing 15-2:


    Usually, when you write a statement, you''re counting how many times to repeat
    something. But, in truth, you can just do any kind of repetition with a statement.


    ```

    while (total < 21) {

    card =

    myRandom.nextInt(10) + 1;


