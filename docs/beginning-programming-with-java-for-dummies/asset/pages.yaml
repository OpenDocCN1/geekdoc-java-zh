    \n![](img/f938eba5f15e231d828a6255e7ec5523_137_0.png)\n\n# Using a variable\n\n\
    The code in Listing 6-1 makes use of a variable named amount. A *variable* is\
    \ a placeholder. You can stick a number like 5.95 into a variable. You can change\
    \ a number in the variable, change your mind and put a different number, like\
    \ 30.95, into the variable. (That's what varies in a variable.) Of course, if\
    \ you put a new number in a variable, the old number is no longer there. If you\
    \ didn't save the old number somewhere else, the old number is gone."
