  md: '# Separating your programs from mine


    In Chapter 2, you download this book''s examples from my website. You create an
    Eclipse workspace and import the book''s examples into your workspace.


    You can create your own projects in the same workspace. But if you want to separate
    your code from mine, you can create a second workspace. Here are two ways to create
    a new workspace:


    +   - When you launch Eclipse, type a new folder name in the Workspace field of
    Eclipse''s Launcher dialog box.


    +   - If the folder doesn''t already exist, Eclipse creates the folder. If it
    already exists, Eclipse''s Package Explorer lists all projects that the folder
    contains.


