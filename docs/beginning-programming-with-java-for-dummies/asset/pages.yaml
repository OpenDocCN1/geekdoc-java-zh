  md: "# Chapter 6: Using the Building Blocks: Variables, Values, and Types\n\n# #\
    \ Types and declarations\n\nHow do you tell the computer 01001010 stands for?\
    \ The answer is in the concept called *type*. The type of a variable describes\
    \ the kinds of values that the variable is permitted to store.\n\nIn Listing 6-1,\
    \ look at the first line in the body of the main method:\n\n```\ndouble amount;\n\
    ```\n\nThis line is called a *variable declaration*. Putting this line in your\
    \ program is like saying, “I’m declaring my intention to have a variable *amount*\
    \ in my program.\" This reserves the name *amount* for your use in the program.\n\
    \nIn this variable declaration, the word *double* is a Java keyword. This word\
    \ *double* tells the computer what kinds of values you intend to store in *amount*.\
    \ The word *double* stands for numbers between $-1.8 \\times 10^{308}$ and $1.8\
    \ \\times 10^{308}$. That’s an enormous range of numbers. The fancy $\times 10$\
    \ notation, the second of these numbers is\n\n![](img/f938eba5f15e231d828a6255e7ec5523_142_0.png)\n\
    \nIf the folks at SnitSoft ever charge that much for shipping and handling, they\
    \ can represent the charge with a type of *double*.\n\n# # What’s the point?\n\
    \nMore important than the humongous range of the `double` keyword's numbers is\
    \ the fact that a `double` value can have digits to the right of the decimal point.\
    \ After you declare *amount* to be of type *double*, you can store all sorts of\
    \ numbers in *amount*. You can store 5.95, 0.02398479, or $-3.0$. In Listing 6-1,\
    \ if I hadn't declared *amount* to be of type *double*, I wouldn't have been able\
    \ to store 5.95. Instead, I would have had to store plain old 5 or dreary 6, without\
