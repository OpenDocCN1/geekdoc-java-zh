  md: "# Part IV: Using Program Units\n\n+   - Each time through the loop, the counter\
    \ goes down by one:\n  for (int roomNum = 9; roomNum >= roomNum--)\n\n+   - The\
    \ loop keeps going as long as the counter is greater than or equal to 0:\n  for\
    \ (int roomNum = 9; roomNum >= 0;)\n\nThink through each of these three items,\
    \ and you'll write a perfect for loop.\n\n# Working with Arrays\n\nEarlier in\
    \ this chapter, a busload of loners showed up at your motel. When they finally\
    \ left, you were glad to get rid of them, even if it meant having all your rooms\
    \ empty for a while. But now, another bus pulls into the parking lot. This bus\
    \ has a sign that says \"Gregarian Club.\" Out of the bus come 50 people, each\
    \ more gregarious than the next. Now everybody in your parking lot is all clamoring\
    \ to meet everyone else. When they meet and greet, they are all frolicing towards\
    \ the front desk, signing the club's theme song. (Oh no! It's the Gregarian Chant!)\n\
    \nThe first five Gregarians want Room 7. It's a tight squeeze, but you were never\
    \ on fire for codes, anyway. Next comes a group of three with yen for Room 0 (They're\
    \ computer programmers, and they think the room number is cute.) Then there's\
    \ a pack of four Gregarians who want Room 3. (The in-room pool sounds attractive\
    \ to them)\n\nWith all traffic, you switch on your computer. You start a program\
    \ that enables you to enter new occupancy data. The program has five parts:\n\n\
    +   - Create an array and then put 0 in each of the array's components.\n\nWhen\
    \ the Loners' Club members left, the motel was suddenly empty. (Heck, even before\
    \ the Loners' Club members left, the motel seemed empty.) To declare an array\
    \ and fill the array with zeros, you execute code of the following:\n\n```\nint\
    \ guestsIn[];\ngestsIn = new int[10];\n\nfor (int roomNum = 0; roomNum < 10; roomNum++)\
    \ {\n    guestsIn[roomNum] = 0;\n}\n```\n\n+   - Get a room number and then get\
    \ the number of guests who will be staying in that room."
