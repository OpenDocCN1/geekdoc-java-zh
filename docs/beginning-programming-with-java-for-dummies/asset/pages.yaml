  md: '# # Chapter 11: How to Flick a Virtual Switch


    ![](img/f938eba5f15e231d828a6255e7ec5523_246_0.png)


    Taken as a role, `isLeapYear ? 29 : 28` is an expression with a value. And what
    value does this expression have? Well, the value of `isLeapYear ? 29 : 28` is
    either 29 or 28. It depends on whether `isLeapYear` is true or not. That is how
    the conditional operator works:


    +   - If the stuff before the question mark is `true`, the whole expression is
    whatever comes between the question mark and the colon.

    - If the stuff before the question mark is `false`, the whole expression''s value
    is whatever comes after the colon.


    Figure 11-7 gives you a goofy way to visualize these ideas.


