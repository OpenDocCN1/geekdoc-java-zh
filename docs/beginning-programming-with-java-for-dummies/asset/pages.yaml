  md: '# 124 Part II: Writing Your Own Java Programs


    There''s a subtle, almost unnoticeable difference between a variable and a variable''s
    name. Even in formal writing, I often use the word variable when I mean variable
    name. Strictly speaking, amount is the variable name, and all the memory storage
    associated with amount (including the value and type of amount) is the variable
    itself. If you think this distinction between variable and variable name is too
    subtle to worry about, join the club.


    Every variable name is an identifier — a name that you can make up in your own
    code (for more about this, see Chapter 4). In preparing Listing 6-1, I made you
    the name amount.


    # Understanding assignment statements


    The statements with equal signs in Listing 6-1 are called assignment statements.
    In an assignment statement, you assign a value to something. In many cases, this
    something is a variable.


    You should get into the habit of reading assignment statements from right to left.
    For example, the first assignment statement in Listing 6-1 says, "Assign 5.95
    to the amount variable." The second assignment statement is just a bit more complicated.
    Reading the second assignment statement from right to left, you get "Add 25.00
    to the value that''s already in the amount variable and make that number (30.95)
    be the new value of the amount variable." For a graphic, hit-you-over-the-head
    illustration of this, see Figure 6-4.


    ![](img/f938eba5f15e231d828a6255e7ec5523_139_0.png)


    | amount | = | 5.95 |

    | | Assign | 5.95 to |

    | amount. | |

    | amount | = | amount + | 25.00; |

    | | Add 5.95 (that is, amount''s old value) | and | 25.00 |

    | ...and assign the sum to... | | |


    In an assignment statement, the thing being assigned a value is always on the
    left side of the equal sign.'
