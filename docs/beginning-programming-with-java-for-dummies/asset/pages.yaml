    # Making a method


    Imagine a table containing the information about three accounts. (If you have
    trouble imagining such a thing, just look at Figure 19-1.) In the figure, each
    account has a name, an identification number, and a balance. In addition (and
    here''s the important part), each account knows how to display itself on the screen.
    Each row of the table has its own display method.


    Figure 19-1: A table of accounts.


    | lastName | id | balance | display |

    |---|---|---||

    | Aju | 9936 | $8,734.00 | (method to display account info) |

    | Tap | 3492 | $6,718.00 | (method to display account info) |

    | Ngp | 2151 | $1,008.00 | (method to display account info) |


    The names in Figure 19-1 may seem strange to you. That''s because I generated
    the table''s data randomly. Each name is a haphazard combination of three letters
    — one uppercase letter followed by two lowercase letters.


    Though it may seem, generating account values at random is common practice. When
    you write new code, you want to test the code to find out it runs correctly. You
    can make up your own data (with values like "Smith", 0000, and 1000.0). But to
    give your code a challenging workout, you should use some unexpected values. If
    you have values from real-life case studies, you should use them. But if you don''t
    have real data, randomly generated values are easy to create.


    To find out how I randomly generate three-letter names, see this chapter''s "Generating
    words randomly" sidebar.


    I need some code to implement the ideas in Figure 19-1. Fortunately, I have some
    code in Listing 19-1.


