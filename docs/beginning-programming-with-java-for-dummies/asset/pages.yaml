  md: "# Chapter 4: Exploring the Parts of a Program\n\n# Comments\n\nA comment is\
    \ text that's outside the normal flow. In Figure 4-2, the words \"A comment: aren't\
    \ part of the Suzanne sentence. Instead, these words are about the Suzanne sentence.\n\
    \nThe same is true of comments in computer programs. The first five lines in Listing\
    \ 4-1 form one big comment. The computer doesn't act on this comment. There are\
    \ no instructions for the computer to perform inside this comment. Instead, the\
    \ comment tells others programmers something about your code.\n\nComments are\
    \ for your own benefit, too. Imagine that you set aside your code for a while\
    \ and work on something else. When you return later to work on the code again,\
    \ the comments help you remember what you were doing.\n\nThe Java programming\
    \ language has three kinds of comments:\n\n+   * Traditional comments: The comment\
    \ in Listing 4-1 is a traditional comment. The comment begins with /* and ends\
    \ with /. Everything between the opening /* and the closing */ is for human eyes\
    \ only. Nothing between / and * / translated by the compiler.\n\n+   * The second,\
    \ and fourth lines in Listing 4-1 have extra asterisks. because these asterisks\
    \ aren't required when you create a comment. They just make the comment look pretty.\
    \ I include them in Listing 4-1 because, for some reason that I don't entirely\
    \ understand, most Java programmers add extra asterisks.\n\n+   * End-of-line\
    \ comments: Here's some code with end-of-line comments:\n\n```\nclass ThingsILike\
    \ {\n    // Two things\n    public static void main(String args[]) {\n       \
    \ System.out.println(\"sleep\"); // Missing from here\n    }\n```\n\nAn end-of-line\
    \ comment starts with two slashes and goes to the end of a line of type.\n\nYou\
    \ may hear programmers talking about commenting certain parts of their code. If\
    \ you're writing a program and something's not working correctly, it often helps\
    \ to remove some of the code. If you find out what happens when suspicious code\
    \ is removed. Of course, you may not like what happens when the code is removed,\
    \ so you don't want to delete the code completely. Instead, you turn your Java\
    \ statements into comments. For example, System.out.println(\"Sleep\"); // into\
    \ * System.out.println(\"Sleep\"); // *. This keeps the Java compiler from seeing\
    \ the code while you try to figure out what's wrong with your program.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_102_0.png)"
