  md: '# Part I: Getting Started with Java Programming


    # Returning to the big picture


    The next two terms deal with Eclipse''s overall look and feel.


    +   Layout: An arrangement of certain views. The layout in Figure 3-3 has seven
    views, of which four are easily visible:

    * At the far left, you have the Package Explorer view.

    * On the far right, you have the Task List view and the Outline view.

    * Near the bottom, you get the Problems, Declaration, Javadoc, and Console views.


    Along with all these views, the layout contains a single editor area. Any and
    all editors appear inside this editor area.


    +   Perspective: A very useful layout. If a particular layout is really useful,
    someone gives that layout a name. And if you want to use that layout whenever
    you want. For example, the workbench of Figure 3-3 displays Eclipse''s Java perspective.
    By default, the Java perspective contains six views in an arrangement very much
    like the arrangement shown in Figure 3-3.


    The Console view appears in Figure 3-3, but the Console view doesn''t always appear
    as part of the Java perspective. Normally, the Console view appears automatically
    when you run a text-based Java program. If you want to force the Console view
    to appear, choose Window>Show View>Other. In the resulting View dialog box, expand
    the General branch. Finally, within that General branch, double-click the Console.


    Along with all these views, the Java perspective contains an editor area. (Sure,
    the editor area has several tabs, but the number of tabs has nothing to do with
    the Java perspective.)


    You can switch among perspectives by choosing Window>Open Perspective in Eclipse''s
    main menu bar. This book focuses almost exclusively on Eclipse''s Java perspective.
    But if you like poking around, visit some of the other perspectives to get a glimpse
    of Eclipse''s power and versatility.


    ![](img/f938eba5f15e231d828a6255e7ec5523_89_0.png)'
