    A run of the enhanced code is shown in Figure 8-13. As you can see, the computer
    misses its mark. Instead of the expected value 69.8, the computer''s value for
    9.0 / 5.0 * 21 + 32.0 is 69.8000000000001. That''s the way the code crumbles.
    The computer does all its arithmetic with zeros and ones, so the computer''s arithmetic
    doesn''t look like the base-10 arithmetic in Figure 8-11. The computer''s answer
    isn''t wrong. The answer is just slightly inaccurate.


    | Figure 8-13: The fahrenheit variable''s full. | Enter the Celsius temperature:
    21 Fahrenheit: 69.80000000000001 Room temperature? false |


    In an example in Chapter 7, Java''s remainder operator (%) gives you the answer
    0.129999999999999 instead of 0.13 that you expect. But this same kind of thing
    happens in this section example. But this section''s code doesn''t use an exotic
    remainder operator. This section''s code uses your old friends — division, multiplication,
    and addition.


    So be careful when you compare two numbers for equality (==) or for inequality
    (!=). Little inaccuracies can creep in almost anywhere where you work with Java''s
    double type or with Java''s float type. And several little inaccuracies can build
    on one another to become very large inaccuracies. When you compare double values
    or two float values, the values are almost never dead-equal to one another.


    If your program isn''t doing what you think it should do, check your suspicions
    about the values of variables. Add print and println statements to your code.


    When you compare double values, give yourself some leeway. Instead of comparing
    for exact equality, ask whether a particular value is reasonably close to the
    expected value. For example, a condition like fahrenheit >= 69.8 - 0.01 && fahrenheit
    <= 69.8 + 0.01 to find out whether fahrenheit is within 0.01 of the value 69.8.
    To read more about conditions containing Java''s && operator, see Chapter 10.


