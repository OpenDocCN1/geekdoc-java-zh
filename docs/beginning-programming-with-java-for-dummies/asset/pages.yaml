  md: '# What You Don''t Have to Read


    Pick the first chapter or section that has material you don''t already know and
    start reading there. Of course, you may have making decisions as much as I do.
    If so, here are some guidelines you can follow:


    +   - If you already know what computer programming is all about, skip the first
    part of Chapter 1. Believe me, I won''t mind.

    - If you''re required to use a development environment other than Eclipse, you
    can skip Chapter 2. This applies if you plan to use NetBeans, IntelliJ IDEA, or
    a number of other development environments.

    - Most of this book''s examples require Java 5.0 or later, and some of the examples
    use Java 7 or later. So make sure that your system uses Java 7 or later. If you
    have leeway in choosing a development environment, your safest move is to read
    Chapter 3.

    - If you''ve already done a little computer programming, be prepared to skim 6
    through 8. Dive fully into Chapter 9 and see whether it feels comfortable. (If
    so, then read on. If not, re-skip 6, 7, and 8.)

    - If you feel comfortable writing programs in a language other than Java, this
    book isn''t for you. Keep this book as a memento and buy my Java For Dummies,
    66th Edition, also published by John Wiley & Sons, Inc.


    If you want to skip the sidebars and the Technical Stuff icons, please do. In
    fact, if you want to skip anything at all, feel free.


    # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect ... well, buy the book anyway.


    +   - I assume that you have access to a computer. Here''s good news. You can
    run the code in this book on almost any computer. The only computers can''t use
    to run this code are ancient things that are more than eight years old (give or
    take a few years). You can run the latest version of Java on Windows, Macintosh,
    and Linux computers.

    - I assume that you can navigate through your computer''s common menus and dialog
    boxes. You don''t have to be a Windows, Linux, or Macintosh power user, but you
    should be able to start a program, find a file, put a file into a certain directory
    ... that sort of thing. Most of the time, when you practice the stuff in this
    book, you''re typing code on your keyboard, not pointing and clicking your mouse.'
