  md: "# Deleting Several Files\n\nA program in Chapter 15 deletes a file named importantData.txt.\
    \ The code to delete the file looks like this:\n\n```\nnew File(\"importantData.txt\"\
    ).delete();\n```\n\nIn that code, File call refers to a single file. It is very\
    \ nice code, but it doesn't tell you how to delete a bunch of files. How can you\
    \ write code to deal with several files at once?\n\nFortunately, Java provides\
    \ ways to deal with bunches of files. One way is using an array of File. Listing\
    \ 16-6 contains a program that illustrates this idea.\n\n**Listing 16-6: Deleting\
    \ All .txt Files**\n\n```\nimport java.io.File;\nclass IHateTxtFiles {\n    public\
    \ static void main(String[] args[]) {\n        File folder = new File(\".\");\n\
    \        for (File file : folder.listFiles()) {\n            if (file.getName().endsWith(\"\
    .txt\")) {\n                file.delete();\n            }\n        }\n    }\n\
    }\n```\n\nIn many operating systems (including Windows, Mac OS, and Linux), a\
    \ single dot stands for the current working directory: the place where a program\
    \ starts looking for files. For a Java program running in Eclipse, this working\
    \ directory is the project's root directory. For example, imagine that the code\
    \ in Listing 16-6 lives in an Eclipse project named 16-06. Then your hard drive\
    \ contains a folder named 16-06, which in turn, contains a folder named src; in\
    \ turn, contains the IHateTxtFiles.java file. (See Figure 16-8.) The program's\
    \ working directory is the 16-06 directory. So, in Listing 16-6, the code\n\n\
    ```\nfolder = new File(\".\")\n```\n\nmakes refer to the directory named 16-06."
  merge: -1
  pgno: 344
- img_proc: true
  md: "# 330 Part IV: Using Program Units\n\n![](img/f938eba5f15e231d828a6255e7ec5523_345_0.png)\n\
    \nFigure 16-8: Your project is in a folder named 16-06.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_345_1.png)\n\
    \nIf you finished reading the previous paragraph, I know what you're thinking.\
    \ \"The project's root directory, 16-06, is a folder, not a file. But the code\
    \ in Listing 16-6 says folder = new File(\".*\"). Why doesn't the code say folder\
    \ = new Folder(\".*\") Well, I'm glad you asked. It turns out that most operating\
    \ systems blur the differences between folders and files. For Java's purpose,\
    \ the document HateTxtFiles.java is a file, the folder named src is also a kind\
    \ of file, and the folder named 16-06 is also a kind of file.\n\nIn Java, every\
    \ File object has a listFiles method, and when you call folder.listFiles(), you\
    \ get an array. Each \"value\" stored in the array is one of the files in the\
    \ folder. In Listing 16-6, the enhanced for loop is the same format as the loop\
    \ in the previous section.\n\n```\nfor (TypeName variableName : RangeOfValues)\
    \ {\n    Statements\n}\n```\n\nIn Listing 16-6, the RangeOfValues is an array.\
    \ The array contains all the files inside the 16-06 project directory. So the\
    \ enhanced for loop takes each file inside the 16-06 directory and asks \"Does\
    \ this file name end with .txt?\"\n\n```\nif (file.getName().endsWith(\".txt\"\
    ))\n```\n\nIf a particular file name ends with .txt, delete that file:\n\n```\n\
    file.delete();\n```\n\nFigures 16-9 and 16-10 show \"before\" and \"after\" pictures\
    \ in Eclipse's Package Explorer. Before running this section's example, the 16-06\
    \ directory contains files named src, aFile.txt, save.me, and xFile.txt. After\
    \ running this section's example, the 16-06 directory still contains src and save.me,\
    \ but no longer contains aFile.txt or xFile.txt."
  merge: -1
