  md: "# Chapter 17: Programming with Objects and Classes\n\n# Running code that straddles\
    \ two separate files\n\nFrom Eclipse's point of view, a project that contains\
    \ two Java source files is no big deal. You create two classes in the same project,\
    \ and then you choose Run-As-Java Application. Everything works the way you expect\
    \ it to work.\n\nThe only time things become tricky is when you have two main\
    \ methods in the project. This section's example (Listings 17-2 and 17-3) doesn't\
    \ suffer from that malady. But as you experiment with your code, you can easily\
    \ add classes with additional main methods. You may also create a large application\
    \ with several starting points.\n\nWhen a project has more than one main method,\
    \ Eclipse might prompt you and ask which class method you want to run. But sometimes\
    \ Eclipse doesn't prompt you. Instead, Eclipse arbitrarily picks one of the main\
    \ methods and ignores all the others. This can be very confusing. You add a println\
    \ call to the wrong main method, and nothing appears in the Console view. Hey,\
    \ what gives?\n\nYou can fix the problem by following these steps:\n\n+   1. Expand\
    \ the project's branch in the Package Explorer.\n2. Expand the src folder within\
    \ the project's branch.\n3. Expand the (default package) branch within the src\
    \ branch.\n   (The default package) branch contains .java files.\n4. (In Windows)\
    \ Right-click the .java file whose main method you want to run. (On a Mac) Control-click\
    \ the .java file whose main method you run.\n5. In the resulting context menu,\
    \ choose Run-As-Java Application.\n\nYou cannot run a project that has no main\
    \ method. If you try, you get a message box like the one shown earlier in Figure\
    \ 17-2.\n\n![](img/f938eba5f15e231d828a6255e7ec5523_352_0.png)\n\n# Why bother?\n\
    \nOn the surface, the code in Listing 17-3 is longer, more complicated, and harder\
    \ to read. But think about a big pile of laundry. It may take time to find a basket\
