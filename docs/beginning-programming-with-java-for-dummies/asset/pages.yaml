  md: '# Fully updated to reflect the new features of Java 8!


    If you''re a new programmer, or want to be, this intimidating guide gets you on
    your way toward Java mastery. It goes into creating a program, how to put the
    pieces together, debugging, and making it all. Even if you''ve never written a
    line of code, this book will have you ordering your computer around in no time.


    +   - Get started — dive into the overall programming experience, finding out
    what programming is all about getting your computer ready for writing and testing
    programs

    - Jump into Java — discover the basic building blocks in any Java program, and
    get up to speed on how to represent data and get new values from existing values

    - Go with the flow — find out how to look at your program as a mansion, and learn
    to make your computer navigate from one room to another

    - One byte at a time — learn the best ways to break complex programming problems
    into small pieces and create solutions to solve them

    - The write stuff — get access to all-important documents that no good Java programmer
    should be without


