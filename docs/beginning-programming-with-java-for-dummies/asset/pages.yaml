    \ the words \"love\" and \"hate\" bold are recorded inside the MyPersonalDiary.docx\
    \ file.\n\n+   With a program editor, things like bold and coloring aren't marked\
    \ inside the Java\n\nJava is case-sensitive, which means that system.out.println\
    \ isn't the same as System.out.println. If your program won't work. Be sure to\
