  md: '# Chapter 3: Running Programs


    # What can possibly go wrong?


    Ridding the editor of jagged underlines is cause for celebration. Eclipse looks
    like the look of your code, so from that point on, it''s smooth sailing. Right?


    Well, it ain''t necessarily so. In addition to some conspicuous compile-time errors,
    your code can have other, obvious errors.


    Imagine someone telling you to "go to the intersection, and then run tight." You
    notice immediately that the speaker made a mistake, and you respond with a polite
    "Huh? The nonsensical run tight phrase is like a compile-time error. "Huh? is
    like jagged underlines in Eclipse''s editor. As a listening human being, you may
    be able to guess what run means, but Eclipse''s editor never dares to fix your
    mistakes.


    In addition to compile-time errors, some kind of gremlins can hide inside a Java
    program:


    +   **Unchecked runtime exceptions:** You have no compile-time errors, but when
    you are running your program, the run ends prematurely. In the middle of the run,
    your instructions tell Java to do something it can''t do. For example, while you''re
    running the Mortgage program in the "Running a Canned Java Program" section, you
    type 1,000,000.00 instead of 1000000.00. Java doesn''t like the commas in the
    number, so your program crashes and displays a nasty-looking message, as shown
    in:


    ![](img/f938eba5f15e231d828a6255e7ec5523_82_0.png)


    This is an example of an unchecked exception — the equivalent of someone telling
    you to run right at the intersection when the only thing to left is a big brick
    wall. Eclipse''s editor won''t warn you about an unchecked runtime exception because
    until you run the program, the computer can''t predict that the exception will
    occur.


    +   **Logic errors:** You see no error markers in Eclipse''s editor, and when
    you run your code, the program runs to completion. But the answer isn''t correct.
    Instead of $552.20 in the figure, the output is $552,200,000.00. The program wrongly
    tells you to pay thousands of times what your house is worth and tells you to
    pay this amount each month! It''s the equivalent of being told to turn right in
    the direction of turning left. For a long time.


    ![](img/f938eba5f15e231d828a6255e7ec5523_82_1.png)


    (continued)'
