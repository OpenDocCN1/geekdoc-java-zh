  md: '# Chapter 3: Running Programs


    5. Choose Run Run As Java Application from the main menu, shown in Figure 3-4.


    When you choose Run As Java Application, the computer runs the project''s code.
    (In this example, the computer runs a Java program that I wrote.) As part of the
    run, the message How are you borrowing? appears in Eclipse''s Console view. (The
    Console view shares the lower-right area of Eclipse''s workbench with the Problems
    view, JavaDoc, the Declaration view, and possibly other views. Refer to Figure
    3-1.)


    ![](img/f938eba5f15e231d828a6255e7ec5523_72_0.png)


    +   Figure 3-4: One of the ways to run the code in Project 03-01.


    6. Click anywhere inside Eclipse''s Console view and then type a number, like
    100000.0, and press Enter.


    When you type a number in Step 6, don''t include your currency''s currency symbol
    and don''t group the digits. (U.S. residents, don''t type a dollar sign and use
    no commas.) Things like $100000.00 and 1,000,000.00 cause the program to crash.
    You see a NumberFormatException message in the Console view.


    Grouping varies from one country to another. The run shown in Figure 3-1 is for
    a computer configured in the United States where 100000.00 (with a dot) means
    "one hundred thousand." But the run might look different on a computer configured
    in what I call a "comma country"—a country where 100000.00 (with a comma) means
    "one hundred thousand." If you live in a comma country, and you type 100000.0
    exactly as it''s shown in Figure 3-1, you probably get an error message (InputMismatchException).
    If so, change the amounts in your file to match your country''s number format.
    When you do, you should be okay.


    After you press Enter, the Java program displays another message (What''s the
    interest rate?) in the Console view. (Again, refer to Figure 3-1.)


    7. In response to the interest rate query, type a number, like 5.25, and press
    Enter.


    After you press Enter, the Java program displays another message (How many years...?)
    in the Console view.


    ![](img/f938eba5f15e231d828a6255e7ec5523_72_1.png)'
