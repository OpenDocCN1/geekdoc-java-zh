    # Using too much punctuation


    In junior high school, my English teacher said I should use a comma when I would
    normally pause for a breath. This advice doesn''t work during allergy season,
    when my sentences have more commas in them than words. Even as a author, I have
    trouble deciding where the commas should go, so I often add extra commas for good
    measure. This makes more work for my copy editor, Melba, who has a trash full
    of commas by her desk in office.


    It''s the same way in a Java program. You can get carried away with punctuation.
    Consider, for example, the main method header in Listing 5-1. This line is a dangerous
    curve for novice programmers.


    For information on the method header and method body, refer to Chapter 4.


    # Why can''t the computer fix it?


    How often do you get to finish someone''s sentence? "Please," says your supervisor,
    "go over there and connect the . ."


    "Wires," you say. "I''ll connect the wires." If you know what semicolon means,
    why wait for them to say it?


    This same question comes in connection with computer error messages. Take a look
    at the message in Figure 5-7. The computer expects a semicolon after the statement
    on line 8. Well, Mr. Computer, if you know where you want a semicolon, just add
    the semicolon and done with it. Why are you bothering me about it?


    The answer is simple. The computer isn''t interested in taking any chances. If
    you don''t want a real semicolon after the statement on line 8? If the missing
    semicolon represents a more profound problem? If the computer added the extra
    semicolon, it could potentially do more harm than good.


    Returning to your supervisor ...


    Boom! A big explosion. "Not the wires, you Dummy. The dots. I wanted you to connect
    the dots.\n

    "Sorry," you say.'
