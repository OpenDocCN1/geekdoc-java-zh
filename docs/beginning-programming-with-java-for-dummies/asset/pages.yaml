    At the core of Listing 12-1 is a thing called a while statement (also known as
    a while loop). A while statement has the following form:


    ```

    while (Condition) {

    Statements}

    ```


    Rephrased in English, the while statement in Listing 12-1 would say


    ```

    while the sum of the two dice isn''t 7 and isn''t 11

    keep doing all the stuff in curly braces: {

    }

    ```


    The stuff in curly braces (the stuff that''s repeated over and over) is the code
    that gets two new numbers and displays those random numbers'' values. The statements
    in curly braces are repeated as long as die1 + die2 != 7 && die1 + die2 != 11
    keeps being true.


    Each repetition of the statements in the loop is called an iteration of the loop.
    In Figure 12-1, the first run has 2 iterations, and the second run has 12 iterations.


    When die1 + die2 != 7 && die2 != 11 is no longer true (that is, when the sum is
    either 7 or 11), the repeating of statements stops dead in its tracks. The computer
    moves on to the statements that come after the loop.


