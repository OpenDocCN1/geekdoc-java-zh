  \n# 第三部分：处理方式处理信息\n\n# 第 9 小时\n\n使用数组存储信息\n\n### 本小时待办事项：\n\n![Image](img/arrow.jpg)\
  \ 创建一个数组。\n![Image](img/arrow.jpg) 设置数组的大小。\n![Image](img/arrow.jpg) 在数组元素中存储一个值。\n\
  ![Image](img/arrow.jpg) 修改数组中的信息。\n![Image](img/arrow.jpg) 创建多维数组。\n![Image](img/arrow.jpg)\
  \ 对数组排序。\n\n没有人比圣诞老人从计算机的发展中受益更多。几个世纪以来，人类让他承担着巨大的负担来收集和处理信息。老圣尼必须跟踪以下事项：\n\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n![Image](img/arrow.jpg)\
  \ 坏孩子\n![Image](img/arrow.jpg) 乖孩子\n![Image](img/arrow.jpg) 礼物请求\n\n计算机对圣诞老人是一个巨大的福音。它们非常适合对信息进行存储、分类和研究。到目前为止，你处理过的变量都是单个项目，例如浮点数或字符串。数组是具有相同类型的变量组。任何可以存储为变量的信息类型都可以变成数组。\n\
  \n## 创建数组\n\n数组是根据共同名称分组的变量。你对数组这个词应该熟悉——想象一个销售员展示她的数组或一个有数组的游戏节目。和变量一样，数组通过说明被组织的变量类型和数组名称来创建。一对方括号\
  \ `[]` 跟在类型以区分数组与变量。\n\n你可以为任何可以存储为变量的类型类型创建数组。以下语句创建一个字符串数组：\n\n`String[] naughtyChild;`\
  \ 这里是分别是创建整数和布尔值数组的语句：\n\n此处查看代码图像\n\n`int[] reindeerWeight;`\n\n`boolean[] hostileTravelNations;`\n\
  \n### 注意\n\nJava 创建数组时括号的位置是灵活的。你可以将它们放在变量名之后而不是变量类型之后，如下：\n\n`String niceChild[];`\
  \ 为了让人更容易发现数组，你应该坚持一种风格而不是来回切换。本书中的程序总是将括号放在变量或对象类型之后。\n\n之前的示例创建了持有数组的变量，但没有在其中存储任何值。为了这样做，你可以结合变量类型使用\
  \ `new` 关键字，或者在 `{}` 中存储值。使用 `new` 时必须指定数组中存储了多少不同的项目。数组中的每个项目被称为元素。以下语句创建一个数组并为其持有的值留出空间：\n\
  \n此处查看代码图像\n\n`int[] elfSeniority = new int[250];` 这个示例创建一个名为 `elfSeniority` 的整数数组。该数组有\
  \ 250 个元素，可以存储圣诞老人的每个精灵在北极工作的月数。（如果圣诞老人经营的是工会，这些信息极其重要。）\n\n\n\n\n当你使用 `new` 语句创建数组时，必须指定元素的数量。数组的每个元素都会赋予一个初始值，该值取决于数组的类型。所有数值数组的初始值均为\
  \ `0`，`char` 数组等于 `'\\0'`，`boolean` 数组的值为 `false`。`String` 数组以及所有其他对象的初始值为 `null`。\n\
  \n对于不是不是极大的数组，你可以在创建的同时设置它们的初始值。以下示例创建了一个字符串数组并为它们赋予了初始值：\n\n点击此处查看代码图片\n\n```java\n\
  String[] reindeerNames = { \"Dasher\", \"Dancer\", \"Prancer\", \"Vixen\", \"Comet\"\
  , \"Cupid\", \"Donner\", \"Blitzen\" };\n```\n\n应该存储在数组元素中的信息放在 `{` 和 `}` 括号之间，并用逗号分隔每个元素。数组中的元素数量设置为该逗号分隔列表中元素的数量。\n\
  \n数组元素是有编号的，从第一个元素开始为 `0`。可以通过在 `[` 和 `]` 括号内引用该数字来访问特定元素。前述语句的效果与以下代码相同：\n\n点击此处查看代码图片\n\
  \n```java\nString[] reindeerNames = new String[8];\nreindeerNames[0] = \"Dasher\"\
  ;\nreindeerNames[1] = \"Dancer\";\nreindeerNames[2] = \"Prancer\";\nreindeerNames[3]\
  \ = \"Vixen\";\nreindeerNames[4] = \"Comet\";\nreindeerNames[5] = \"Cupid\";\nreindeerNames[6]\
  \ = \"Donner\";\nreindeerNames[7] = \"Blitzen\";\n```\n\n数组的每个元素必须是相同类型。在这里，使用字符串来存储每个驯的名字。\n\
  \n数组创建后，你就无法为更多元素留出空间。即使你想起了最著名的那只驯，也无法将“Rudolph”作为 `reindeerNames` 数组的第九个元素。Java\
  \ 编译器不会让可怜的 Rudolph 加入到任何 `reindeerNames` 中。\n\n### 使用数组\n\n你在程序中使用数组就像使用任何变量一样，唯一的区别是：数组项的元素编号必须位于数组名称旁边的方括号内。你可以在任何可以使用变量的地方使用数组元素，例如这些语句：\n\
  \n点击此处查看代码图片\n\n```java\nelfSeniority[193] += 1;\nniceChild[9428] = \"Eli\";\ncurrentNation\
  \ = 413;\nif (hostileAirTravelNations[currentNation] == true) {\n    sendGiftByMail();\n\
  }\n```\n\n因为数组的第一个元素编号为 `0` 而不是 `1`，这意味着最大的数字比你预期的少一。考虑以下语句：\n\n点击此处查看代码图片\n\n```java\n\
  String[] topGifts = new String[10];\n```\n\n该语句创建了一个编号从 `0` 到 `9` 的字符串变量数组。如果你在程序的某处引用了\
  \ `topGifts[10]`，你将得到一个关于 `ArrayIndexOutOfBoundsException` 的错误消息。\n\n`Exception`\
  \ 是 Java 程序中错误的另一种说法。这种异常是“数组索引越界”错误，意味着程序尝试使用一个在其定义边界之外的数组元素。你将在 14 小时“程序中的错误处理”中学习更多关于异常的知识。\n\
  \n如果你想检查数组的上限以避免超出限制，每个数组都关联了一个名为 `length` 的变量。`length` 变量是一个包含数组元素数量的整数。以下示例创建了一个数组并报告它的长度：\n\
  \n点击此处查看代码图片\n\n```java\nString[] reindeerNames = { \"Dasher\", \"Dancer\", \"Prancer\"\
  , \"Vixen\", \"Comet\", \"Cupid\", \"Donder\", \"Blitzen\", \"Rudolph\" };\nSystem.out.println(\"\
  There are \" + reindeerNames.length + \" reindeer.\");\n```\n\n在这个示例中，`reindeerNames.length`\
  \ 的值为 `9`，这意味着你可以指定的最高元素编号是 `8`。\n\n你可以以字符串或字符数组的形式在 Java 中处理文本。处理字符串时，一种有效的技巧是将字符串中的每个字符放入字符数组的独立元素中。要这样做，调用字符串的\
  \ `toCharArray()` 方法，它会生成一个元素数量与字符串长度相同的 `char` 数组。\n\n本小时的第一个项目使用了本节介绍的两种技术。`SpaceRemover`\
  \ 程序显示一个所有空格字符都被替换为点（`.`）的字符串。\n\n开始，在 NetBeans 中打开 Java24 项目，选择 File、New File 并在\
  \ `com.java24hours` 包中创建一个名为 `SpaceRemover` 的空 Java 文件。在源编辑器中输入 Listing 9.1 并在完成后保存。\n\
  \n**列表 9.1 SpaceRemover 的全文**\n\n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\
  \nclass SpaceRemover {\n    public static void main(String[] arguments) {\n    \
  \    String mostFamous = \"Rudolph the Nosed Reindeer\";\n        char[] mfl = mostFamous.toCharArray();\n\
  \        for (int dex = 0; dex < mfl.length; dex++) {\n            char current\
  \ = mfl[dex];\n            if (current != ' ') {\n                System.out.print(current);\n\
  \            } else {\n                System.out.print('.');\n            }\n \
  \       }\n        System.out.println();\n    }\n}\n```\n\n![Image](img/09fig1.jpg)\n\
  \n**图 9.1** Spaceover 的输出。\n\n### 多维数组\n\n目前为止数组都是一维的，因此可以使用一个数字检索元素。某些类型的信息需要更多维度来存储，例如\
  \ (x,y) 坐标系中的点。数组的一个维度可以存储 x 坐标，另一个维度可以存储 y 坐标。\n\n要创建一个二维的数组，你在创建和使用数组时必须使用额外的方括号，例如这些语句：\n\
  \n点击此处查看代码图片\n\n```java\nboolean[][] selectedPoint = new boolean[50][50];\nselectedPoint[4][13]\
  \ = true;\nselectedPoint[7][6] = true;\nselectedPoint[11][22] = true;\n```\n\n此示例创建了一个布尔值数组\
  \ `selectedPoint`。该数组第一个维度有 50 个元素，第二个维度有 50 个元素，因此共有 2500 个独立数组元素（50 × 50）。创建数组时，每个元素都被赋予默认值\
  \ `false`。三个元素被赋予了 `true`：(x,y) 位置 4,13 的点、7,6 的点以及 11,22 的点。\n\n数组可以拥有任意数量的维度，但记住它们可能会占用大量内存。创建一个\
  \ 50 比 50 的 `selectedPoint` 数组等同于创建 2500 个独立变量。\n\n### 数组排序\n\n当你将一组相似的项目放入数组时，你可以做的一之一就是重新排列项目。以下语句交换了名为\
  \ `numbers` 的整数数组中两个元素的值：\n\n```java\nint[] numbers = { 3, 7, 9, 12, 5, 0, 8, 19\
  \ };\nint temporary = numbers[5];\nnumbers[5] = numbers[6];\nnumbers[6] = temporary;\n\
  ```\n\n\n\n\n\n这些语句会导致 `numbers[5]` 和 `numbers[6]` 交换彼此的值。名为 `temporary` 的整数变量被用作交换交换的其中一个值的临时存储位置。排序是将一组相关项目按照特定顺序排列的过程，例如将一个数字列表从低到高进行排序。\n\
  \n圣诞老人可以使用排序功能根据姓氏对礼物赠送者的顺序进行排序，这样 Willie Aames 和 Hank Aaron 就能比那些字母顺序上倒霉的 Steve\
  \ Zahn 和 Mark Zuckerberg 更早地获得他们的圣诞节战利品。\n\n在 Java 中对数组进行排序非常简单，因为 `Arrays` 类已经完成了所有工作。`Arrays`\
  \ 是 `java.util` 类组的一部分，它可以重新排列所有变量类型的数组。\n\n要在程序中使用 `Arrays` 类，请执行以下步骤：\n\n1. 使用\
  \ `import java.util.*` 语句，以便在程序中使用 `java.util` 类更加方便。\n2. 创建数组。\n3. 使用 `Arrays`\
  \ 类的 `sort()` 方法重新排列数组。\n\n由 `Arrays` 类排序的变量数组将按数值升序顺序重新排列。字符和字符串将按字母顺序排列。\n\n为了看到实际效果，请在\
  \ `com.java24hours` 包中创建一个名为 `NameSorter` 的空 Java 文件，并在源编辑器中输入列表 9.2 的文本。\n\n###\
  \ 列表 9.2 NameSorter.java 的完整源代码\n\n```java\npackage com.java24hours;\n\nclass NameSorter\
  \ {\n    public static void main(String[] arguments) {\n        String names[] =\
  \ { \"Glimmer\", \"Marvel\", \"Rue\", \"Clove\",\n        \"Thresh\", \"Foxface\"\
  , \"Cato\", \"Peeta\", \"Katniss\" };\n        System.out.println(\"The original\
  \ order:\");\n        for (int i = 0; i < names.length; i++) {\n            System.out.println(i\
  \ + \": \" + names[i]);\n        }\n        System.out.println();\n        Arrays.sort(names);\n\
  \        System.out.println(\"The new order:\");\n        for (int i = 0; i < names.length;\
  \ i++) {\n            System.out.println(i + \": \" + names[i]);\n        }\n  \
  \      System.out.println();\n    }\n}\n```\n\n当你运行此程序时，它会按原始顺序显示九个名字列表，对名字进行排序，然后重新显示列表。图\
  \ 9.2 显示了输出。\n\n![Image](img/09fig02.jpg)\n\n**图 9.2 `NameSorter` 程序的输出。**\n\n当你处理字符串和整数、浮点数等基本变量类型时，你只能使用\
  \ `Arrays` 类按升序对它们进行排序。如果你在排序期间想要元素的元素的排列方式，或者想要比 `Arrays` 类更高的效率，你可以编写代码来手动进行排序。\n\
  \n### 统计字符串中的字符\n\n英语中出现频率最高的字母是 E, R, S, T, L, N, C, D, M 和 O，按顺序排列。如果你发现自己出现在联播游戏节目《幸运转盘》（Wheel\
  \ of Fortune）中，这是一个值得了解的事实。\n\n**注意**\n\n如果你不熟悉这个节目，《幸运转盘》是一个游戏，三位参赛者猜一个短语、名称或引言的字母。如果他们猜对了一个字母且该字母是辅音，他们就能赢得大转盘转出的金额。为了重现这种体验，你可以在摄影棚观众面前和朋友玩猜字游戏，当有人猜对字母时发放随机金额，并给获胜者送一台新的\
  \ Shark Rotator 吸尘器。\n\n你的下一个 Java 程序将统计你感兴趣输入的任意不同短语和表达式中的字母频率。使用一个数组来统计每个字母出现的次数。完成后，程序将显示每个字母在短语中出现的次数。\n\
  \n在 NetBeans 中创建一个名为 `Wheel.java` 的空 Java 文件，将其放入 `com.java24hours` 包中，填充列表 9.3\
  \ 的内容，完成后保存文件。可以随时在第 17 行和第 18 行之间添加短语，并像第 17 行一样格式格式。\n\n### 列表 9.3 Wheel.java\
  \ 的完整源代码\n\n```java\npackage com.java24hours;\n\nclass Wheel {\n    public static\
  \ void main(String[] arguments) {\n        String phrase[] = {\n        \"A STITCH\
  \ IN TIME SAVES NINE\",\n        \"DON'T EAT YELLOW SNOW\",\n        \"TASTE THE\
  \ RAINBOW\",\n        \"EVERY GOOD DOES FINE\",\n        \"I WANT MY\",\n      \
  \  \"LIKE IKE\",\n        \"PLAY IT AGAIN, SAM\",\n        \"FROSTY THE SNOWMAN\"\
  ,\n        \"ONE MORE FOR THE ROAD\",\n        \"HOME ADVANTAGE\",\n        \"SHEIELD\
  \ WEDNESDAY\",\n        \"GROVER CLEVELAND OHIO\",\n        \"SPAGHETTI WESTERN\"\
  ,\n        \"TEEN TITANS GO\",\n        \"IT'S WONDERFUL LIFE\"\n        };\n  \
  \      int[] letterCount = new int[26];\n        for (int count = 0; count < phrase.length;\
  \ count++) {\n            String current = phrase[count];\n            char[] letters\
  \ = current.toCharArray();\n            for (int count2 = 0; count2 < letters.length;\
  \ count2++) {\n                char lett = letters[count2];\n                if\
  \ ((lett >= 'A') & (lett <= 'Z')) {\n                    letterCount[lett - 'A']++;\n\
  \                }\n            }\n        }\n        for (char count = 'A'; count\
  \ <= 'Z'; count++) {\n            System.out.print(count + \": \" + letterCount[count\
  \ - 'A'] + \" \");\n            if (count == 'M') {\n                System.out.println();\n\
  \            }\n        }\n        System.out.println();\n    }\n}\n```\n\n如果你在不添加自己的短语的情况下运行程序，输出应该是图\
  \ 9.3 所示。\n\n![Image](img/09fig03.jpg)\n\n**图 9.3 `Wheel` 程序的输出。**\n\n`Wheel` 程序发生了以下操作：\n\
  \n- 5-21 行：短语存储在名为 `phrase` 的字符串数组中。\n- 22 行：创建了一个包含 26 个元素的整数数组 `letterCount`。该数组用于存储每个字母出现的次数。元素的顺序从\
  \ ‘A’ 到 ‘Z’。`letterCount[0]` 存储 ‘A’ 的计数，`letterCount[1]` 存储 ‘B’ 的计数，以此此类推，直到 `letterCount[25]`\
  \ 代表 ‘Z’。\n- 23 行：一个 `for` 循环遍历 `phrase` 数组中的短语。使用 `phrase.length` 变量在达到最后一个短语后结束循环。\n\
  - 24 行：字符串变量 `current` 被赋值为 `phrase` 数组的当前元素。\n- 25 行：创建一个字符数组并存储当前短语中的所有字符。\n-\
  \ 26 行：一个 `for` 循环遍历当前短语中的字母。使用 `letters.length` 变量在达到最后一个字母后结束循环。\n- 27 行：创建一个字符变量\
  \ `lett`，其值为为当前字母。\n- 28-30 行：一个 `if` 语句排除所有不属于字母的字符（例如标点符号和空格）。根据当前字符的数值，`letterCount`\
  \ 数组中的一个元素增加 1。\n- 33 行：一个 `for` 循环从 ‘A’ 到 ‘Z’ 遍历字母表。\n\n\n\n\n\n![Image](img/arrow.jpg)\
  \ 第 34–40 行——显示当前字母，后跟分号以及该字母在 `phrase` 数组存储的短语中出现的次数。当当前字母为‘M’时，会显示换行，因此输出分布在两行。\n\
  \n此项目展示了如何使用两个嵌套的 `for` 循环来遍历一组短语，每次处理一个字母。Java 为每个字符分配了一个数值；这个数值比数组内部的字符更易使用。\n\
  \n### 注意\n\n与‘A’到‘Z’每个字符关联的数值是 ASCII 字符集所使用的数值。ASCII 字符集是 Unicode 的一部分，Java 语言支持的完整字符集。Unicode\
  \ 包含了对世界范围内语言使用的超过 60,000 种不同字符的支持。ASCII 仅限于 256 个。\n\n### 总结\n\n数组使程序中存储复杂类型的信息并对其进行操作成为可能。对于任何可以排列成列表并可以使用你在第\
  \ 8 小节“使用循环重复操作”中学习学习的循环语句轻松访问的信息，数组都是理想的工具。\n\n诚实地说，圣诞老人的信息处理需求可能已经超数组的范围。每年制造的孩子越来越多，他们想要的礼物在复杂性和开销上也在不断增加。\n\
  \n你的程序可能会使用数组来存储那些用变量处理起来困难的信息，即使你没有创建任何列表或对其进行双重检查。\n\n### 工作坊\n\n#### 问答\n\n**Q.\
  \ 字母的数值范围（从‘A’的 65 到‘Z’的 90）是 Java 基础语言的一部分吗？如果是，1 到 64 是留给什么的？**\n\n**A.** 数字 1\
  \ 到 64 包含了数字、标点符号和一些不可打印字符，如换行符、新行符和退格键。每个可以在 Java 程序中使用的打印字符都关联有一个数字，也包括一些不可打印字符。Java\
  \ 使用 Unicode 编号系统。前 127 个字符来自 ASCII 字符集，你可能在其他编程语言中使用过它们。\n\n**Q. 在多维数组中，可以使用 `length`\
  \ 变量来测量第一维度之外的不同维度吗？**\n\n**A.** 你可以测试数组的任何维度。对于第一维度，使用数组名配合 `length`，例如 `x.length`。后续维度可以通过对该维度的\
  \ `[0]` 元素使用 `length` 来测量。考虑一个名为 `data` 的数组，它是通过以下语句创建的：\n\n点击查看代码图像\n\n```java\n\
  int[][][] data = new int[12][13][14];\n```\n\n该数组的维度可以通过使用 `data.length` 变量测量第一维度，`data[0].length`\
  \ 测量第二维度，以及 `data[0][0].length` 测量第三维度。\n\n**Q. 为什么新英格兰爱足者队主教练比尔·贝利奇（Bill Belichick）在场边穿那件破旧的连帽衫？**\n\
  \n**A.** 当你在十年内的胜利次数超过 NFL 历史上任何教练时（从 2003 年到 2012 年共 140 胜），你的老板让你设定自己的着装规范。体育记者认为，贝利奇开始穿无袖连帽衫是为了回应\
  \ NFL 与锐跑的一项交易，该交易要求所有教练必须穿授权的球队服装。\n\n“他决定，如果他们非要让他穿球队服装，他就会从选项中筛选，并穿上他能找到的最丑的东西，”Yahoo!\
  \ Sports 的 Dan Wetzel 解释道，“他选择了一件灰色的卫衣，通常带兜。”\n\n贝利奇这种消极攻击的时尚声明让连帽衫变成了球队最畅销的商品之一。\n\
  \n### 测验\n\n如果你的大脑是一个数组，你可以通过回答以下关于数组的每个来测试它的 `length`。\n\n**1.** 数组最适合存储什么类型的信息？\n\
  \n**A.** 列表\n\n**B.** 相关信息的对\n\n**C.** 冷常知识\n\n**2.** 你可以使用哪个变量来检查数组的上边界？\n\n**A.**\
  \ `top`\n\n**B.** `length`\n\n**C.** `limit`\n\n**3.** 圣诞老人共有多少只驯鹿，包括鲁道夫（Rudolph）？\n\
  \n**A.** 8\n\n**B.** 9\n\n**C.** 10\n\n#### 答案\n\n**1. A.** 仅包含相同类型信息（字符串、数字等）的列表非常适合存储在数组中。\n\
  \n**2. B.** `length` 变量包含数组中元素数量计数。\n\n**3. B.** 根据克莱门特·克拉克·摩尔（Clement Clarke Moore）的《圣尼拉斯来访》，圣诞老人有“八只小驯鹿”，所以鲁道夫是第九只。\n\
  \n#### 活动\n\n为了让自己以后有丰富的经验可供借鉴，你可以通过以下活动扩展对本小节主题的知识：\n\n![Image](img/arrow.jpg)\
  \ 创建一个使用多维数组存储学生成绩的程序。第一维度应该是每个学生的一个数字，第二个维度应该是每个学生的成绩。显示每个学生的平均分。\n\n![Image](img/arrow.jpg)\
  \ 创建一个使用多维数组存储学生成绩的程序。\n\n要查看实现这些活动的 Java 程序，请访问书籍网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n\n\n\n\n在 Java 中，你通过使用类作为模板来创建对象。`class` 是对象的副本，决定了对象应该拥有的属性和行为。“类（class）”这个词对你来说应该很熟悉，因为\
  \ Java 程序被称为类。你用 Java 创建的每个程序都是一个类，你可以将其作为创建新对象的模板。例如，任何使用字符串的 Java 程序都在使用从 `String`\
  \ 类创建的对象。该类包含了决定 `String` 对象是什么的属性，以及决定 `String` 对象可以做什么的行为。\n\n在面向对象编程（OOP）中，计算机程序是一组共同工作以完成某项任务的对象。某些简单的程序看起来似乎只由一个对象组成：即类文件。但即使即使是这些程序，也在使用其他对象来完成工作。\n\
  \n### 对象的运作\n\n考虑一个显示饼图的程序。一个 `PieChart` 对象可能包含以下内容：\n\n![Image](img/arrow.jpg)\
  \ 计算每个饼图区域大小的行为\n\n![Image](img/arrow.jpg) 绘制图表的行为\n\n![Image](img/arrow.jpg) 用于存储图表标题的属性\n\
  \n要求 `PieChart` 对象绘制自己可能看起来很奇怪，因为图表在现实世界中并不会自己绘制。OOP 中的对象尽可能自己自己工作。这种能力使得它们更容易整合到其他程序中。例如，如果一个\
  \ `PieChart` 对象不知道如何绘制自己，那么每你在另一个程序中使用该 `PieChart` 对象时，你都必须创建一个绘制它的行为。\n\nOOP 的另一个例子，请考虑马修·布罗德里克（Matthew\
  \ Broderick）的角色在经典黑客电影《游戏实战》（*WarGames*）中使用的自动拨号器程序，用来寻找他可以入侵的计算机。\n\n### 注意\n\n\
  自动拨号器是一种使用称为调制解调器（modem）的设备顺序拨打一系列电话的软件。此类程序的目的是找到其他接听的计算机，这样你以后就可以给它们打电话看看它们是什么。\n\
  \n小于 30 岁的读者可能很难相信，计算机曾通过电话拨号连接。你必须知道计算机的电话号码才能连接到它，如果它已经在与另一台计算机通话，你就会得到忙音信号。\n\
  \n现在我可能需要解释一下什么是忙音。\n\n引用诗人 T.S 艾莉特（T.S. Eliot）的话：“我老了……我老了。”\n\n今天使用自动拨号器会引起你当地电话公司和执法部门的注意。在\
  \ 20 世纪 80 年代，这是一种不出门就能反叛的好方法。大卫·莱特曼（布罗德里克饰演的角色）使用他的自动拨号器寻找视频游戏公司的私人计算机系统，以便在公司新游戏发布之前玩到。相反，莱特曼发现了一台秘密政府计算机，它可以运行从国际象棋到全球热核战争的所有程序。\n\
  \n自动拨号器像任何计算机程序一样，可以被看作一组共同工作的对象。它可以被分解为：\n\n![Image](img/arrow.jpg) 一个 `Modem`\
  \ 对象，它知道自己的连接速度等属性，并具有让调制解调器拨号以及检测另一台计算机何时接听电话的行为\n\n![Image](img/arrow.jpg) 一个\
  \ `Monitor` 对象，它跟踪拨打了哪些号码以及哪些是计算机\n\n每个对象都独立于存在。\n\n设计一个完全独立的 `Modem` 对象的优点是，它可以被用于其他需要调制解调器功能的程序。\n\
  \n使用自包含对象的另一个原因是它们更容易被调试。计算机程序的规模会迅速变得庞肿。如果你在调试像 `Modem` 对象这样的东西并且知道它不依赖于任何东西，你就可以专注于确保\
  \ `Modem` 对象执行了它应该执行的工作，并持有它执行工作所需的信息。\n\n将 Java 这样的面向对象的语言作为第一种编程语言是有益的，因为你不需要去摒弃其他编程风格的习惯。\n\
  \n### 什么是对象\n\n对象是通过使用对象类作为模板创建的。以下语句创建了一个类：\n\n```java\npublic class Modem {\n\n\
  }\n```\n\n从这个类创建的对象什么也做不了，因为它没有任何属性或行为。你需要添加这些内容来使该类变得有用，如下语句所示：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Modem {\n    int speed;\n\n    public void displaySpeed()\
  \ {\n        System.out.println(\"Speed: \" + speed);\n    }\n}\n```\n\n`Modem`\
  \ 类现在应该开始看起来你在第 1 小节 到第 9 小节 编写的程序了。`Modem` 类以 `class` 语句开始，但它包含了 `public` 关键字。这意味着该类供公共使用——换句话说，任何想要使用\
  \ `Modem` 对象的程序。\n\n`Modem` 类的第一部分创建名为 `speed` 的整数变量。这个变量是对象的属性。\n\n`Modem` 类的第二部分是一个名为\
  \ `displaySpeed()` 的方法。该方法是对象行为的一部分。它包含一条语句 `System.out.println()`，该语句显示了调制解调器的\
  \ `speed` 值。\n\n对象的变量被称为实例变量或成员变量。\n\n如果你想在程序中使用 `Modem` 对象，你可以使用以下语句创建它：\n\n```java\n\
  Modem device = new Modem();\n```\n\n该语句创建了一个名为 `device` 的 `Modem` 对象。在你创建了对象后，可以设置它的变量并调用它的方法。以下是设置\
  \ `device` 对象的 `speed` 值的方法：\n\n```java\ndevice.speed = 28800;\n```\n\n要通过调用 `displaySpeed()`\
  \ 方法让这个调制解调器显示速度，你需要调用：\n\n```java\ndevice.displaySpeed();\n```\n\n名为 `device` 的\
  \ `Modem` 对象可以响应此语句并显示“Speed: 28800”。\n\n### 理解继承\n\nOOP 的一大优势是继承，它允许一个对象从另一个对象继承行为和属性。\n\
  \n当你开始创建对象时，有时发现你想要的新对象非常你已经拥有的对象。\n\n如果大卫·莱特曼想要一个能够处理修正以及 1983 年《游戏实战》发布时还没有的高功能对象呢？莱特曼可以通过复制\
  \ `Modem` 对象的语句并进行修改来创建一个 `ErrorCorrectionModem` 对象。然而，如果 `ErrorCorrectionModem`\
  \ 的大部分行为和属性与 `Modem` 相同，这就是许多不必要的工作。这意味着如果需要更改内容，莱特曼将会有两个独立的程序。\n\n通过继承，程序员可以通过定义新类与现有类的不同之处创建一个新的对象类。莱特曼可以让\
  \ `ErrorCorrectionModem` 继承自 `Modem`，他只需要编写纠错调制解调器与普通调制解调器不同的部分。\n\n类通过使用 `extends`\
  \ 语句继承另一个类。以下继承自 `Modem` 类的 `ErrorCorrectionModem` 类的框架：\n\n点击此处查看代码图像\n\n```java\n\
  public class ErrorCorrectionModem extends Modem {\n    // 程序写在这里\n}\n```\n\n###\
  \ 构建继承层次结构\n\n继承允许在不重复工作的情况下开发各种相关的类，它使得代码从一个类传递到另一个类，再到另一个类。这种父类的类的分组被称为类层级结构，你在\
  \ Java 程序中使用的所有标准类都是层级结构的一部分。\n\n\n\n\n理解了子类和父类后，理解层级结构就会变得简单。继承自另一个类的类被称为 `subclass`（子类）。被继承的类被称为\
  \ `superclass`（父类）。\n\n在之前的 **战争游戏*（*WarGames*）示例中，`Modem` 类是 `ErrorCorrectionModem`\
  \ 类的父类。`ErrorCorrectionModem` 是 `Modem` 的子类。\n\n在层级结构中，一个类可以有多个继承自它的类——`Modem` 的另一个子类可以是\
  \ `ISDNModem`，因为 ISDN 调制调器具有某些行为和属性，使得它们区别于纠错型调制调器。如果 `ErrorCorrectionModem` 有一个子类，例如\
  \ `InternalErrorCorrectionModem`，它将继承层级结构中位于它上面的所有类——即 `ErrorCorrectionModem` 和\
  \ `Modem`。这些继承关系如图图 10.2 所示。\n\n![Image](img/10fig02.jpg)\n\n**图 10.2**\n\n类层级结构的示例。\n\
  \nJava 语言中的各个类广泛使用了继承，因此理解它至关重要。你将在第 12 小节“充分利用现有对象”中学习更多关于该主题的知识。\n\n## 转换对象简单变量\n\
  \n在 Java 中，你需要完成的最常见任务之一是将信息从一种形式转换为另一种形式。你可以进行的几种类型转换包括以下：\n\n![Image](img/arrow.jpg)\
  \ 将一个对象转换为另一个对象\n\n![Image](img/arrow.jpg) 将对象转换为另一个对象\n\n![Image](img/arrow.jpg)\
  \ 将对象转换为简单变量\n\n![Image](img/arrow.jpg) 将简单变量转换为对象\n\n在第 5 小节中，你将学习更多关于数据类型的知识。这些类型包括\
  \ `int`、`float`、`double`、`long`、`short`、`byte`、`char` 和 `boolean`。当你需要将一个基本类型转换为另一个类型时，可能需要显式进行转换。如果将\
  \ `double` 变量转换为 `int` 类型，可能会丢失精度。\n\n**注意**\n\n当你需要将 `double` 转换为 `int` 类型时，通常需要显式进行转换。如果将\
  \ `long` 转换为 `int` 类型，可能会丢失精度。如果将 `float` 转换为 `int` 类型时，可能会丢失精度。\n\n将 `double` 转换为\
  \ `long` 类型通常需要显式进行转换。如果将 `float` 转换为 `long` 类型，可能会丢失精度。\n\n将 `double` 转换为 `short`\
  \ 类型通常需要显式进行转换。如果将 `float` 转换为 `short` 类型，可能会丢失精度。\n\n将 `double` 转换为 `byte` 类型通常需要显式进行转换。如果将\
  \ `long` 转换为 `byte` 类型时，可能会丢失精度。\n\n将 `float` 转换为 `byte` 类型通常需要显式进行转换。如果将 `short`\
  \ 转换为 `byte` 类型时，可能会丢失精度。\n\n将 `double` 转换为 `char` 类型通常需要显式进行转换。如果将 `long` 转换为 `char`\
  \ 类型时，可能会丢失精度。\n\n将 `float` 转换为 `char` 类型通常需要显式进行转换。如果将 `short` 转换为 `char` 类型时，可能会丢失精度。\n\
  \n将 `double` 转换为 `boolean` 类型通常需要显式进行转换。如果将 `long` 转换为 `boolean` 类型时，可能会丢失精度。\n\n\
  将 `float` 转换为 `boolean` 类型通常需要显式进行转换。如果将 `short` 转换为 `boolean` 类型时，可能会丢失精度。\n\n\
  在 Java 中，基本类型和包装类之间的转换是自动完成的，这被称为自动装箱（autoboxing）和拆箱（unboxing）。\n\n自动装箱是指将简单变量转换为对应的类。\n\
  \n拆箱是指将对象转换为简单值。\n\n\n\n\n\n从对象到变量的一种常见转换是在数值表达式中使用字符串。当字符串的值可以转换为整数时，可以使用 `Integer`\
  \ 类的 `parseInt()` 方法来完成，如本例所示：\n\n点击此处查看代码图像\n\n```java\nString count = \"25\";\n\
  int myCount = Integer.parseInt(count);\n```\n\n这会将带有文本“25”的字符串转换为值为 25 的整数。如果字符串值不是有效的整数，则该转换将无法工作。\n\
  \n你创建的下一个项目是 `NewRoot`，该应用程序将命令行参数中的字符串值转换为数值，这是当你从命令行接收接收用户输入时的一种常用技术。\n\n回到 NetBeans\
