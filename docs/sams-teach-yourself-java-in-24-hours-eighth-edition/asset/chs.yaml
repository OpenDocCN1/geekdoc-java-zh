  如果没有错误，你现在有了三个类文件：`Modem.class`、`CableModem.class` 和 `DslModem.class`。然而，你不能运行任何这些类文件，因为它们没有像你创建的其他程序那\
  \ `main()` 块。你需要创建一个短应用程序来测试你刚刚构建的类层次结构。\n\n回到 NetBeans 在 `com.java24hours` 中创建一个名为\
