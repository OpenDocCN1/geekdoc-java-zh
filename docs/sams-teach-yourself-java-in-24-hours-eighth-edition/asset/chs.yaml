  \n![Image](img/23fig02.jpg)\n**图 23.2** 首次运行 Minecraft 服务器。\n\n### 连接到服务器\n\n因为你想制作\
  \ Minecraft mods，你显然电脑上可能已经有一个用于玩游戏的 Minecraft 客户端。如果没有，你可以从网站 [www.minecraft.net](http://www.minecraft.net)\
  \ 购买并下载游戏。目前价格为 26.95 美元。游戏有适用于 Windows、Mac OS、游戏机和移动设备的版本，但 mod 编程需要 Windows 或\
  \ Mac 版本。\n\n启动 Minecraft 并选择多人游戏。你应该能看到你的新服务器是选项之一（如图 23.5 所示）。\n\n\n\n\n\n服务器被称为“Minecraft\
  \ Server”（你以后可以将其改为更酷的名字）。客户端将向服务器发送一个 ping 消息并报告速度，该速度将显示为一组绿色的连接条（如图 23.5 所示）。\n\
  \n这些绿色的连接条意味着你已准备好连接。如果你看到它们，请选择服务器（点击它）并点击“加入服务器”（Join Server）按钮。你现在已经在自己的服务器上运行了一个新的\
  \ Minecraft 世界。继续阅读“创建你的第一个 Mod”部分。\n\n当客户端无法连接到服务器时，将显示红色的 X 而不是绿色连接条。下一节将介绍如何解决此问题。\n\
  \n![Image](img/23fig05.jpg)\n\n**图 23.5**\n\n你的新 Minecraft 服务器已准备好连接。\n\n## 修复服务器连接问题\n\
  \n有时，Minecraft 客户端在向服务器发送 ping 并获取响应时会出现问题。这通过图 23.6 所示的红色 X 来表示。\n\n![Image](img/23fig06.jpg)\n\
  \n**图 23.6**\n\n你的新 Minecraft 服务器存在连接问题。\n\n此问题的最常见原因是服务器运行的 Minecraft 版本与客户端不同。在服务器窗口中，第一条消息指示服务器运行的版本。它写着“Starting\
  \ Minecraft version 1.8.7”。\n\nMinecraft 客户端通常运行最新版本。你可以编辑你的配置（profile）以使用较旧版本。完全退出\
  \ Minecraft 客户端。你需要重新加载它来更改此设置。\n\n再次运行客户端并按照以下步骤在配置中选择不同的版本：\n\n1. 在 Minecraft\
  \ 启动器（Launcher）对话框中，点击“启动选项”（Launch Options）按钮，然后点击“添加新建”（Add New）。\n2. 在 `Version`\
  \ 下拉菜单中，选择 `Release 1.8.7`。\n3. 点击“保存”（Save）。\n4. 点击“设置”（Settings）。\n5. 点击绿色“播放”（Play）按钮上的箭头，然后选择\
  \ `Unnamed Configuration 1.8.7`。\n\n点击“播放”，然后选择“多人游戏”（Multiplayer）。你应该看到带有绿色连接条的服务器。\n\
  \n**注意**\n\n更改玩家配置会影响你使用的所有 Minecraft 服务器，包括你不在创建和测试 Mod 时所玩的服务器。当你不连接到你自己的 Spigot\
  \ 服务器时，请确保将“播放”按钮上的配置改回当前版本（或者创建一个第二个玩家配置，一个用于 Mod 工作，另一个用于游戏）。\n\n## 创建你的第一个 Mod\n\
  \n现在你已经设置并运行了 Minecraft 的 Spigot 服务器，你准备好开始为该服务器开发 Mod 了。\n\nMod 必须封装为 Java 归档文件，也称为\
  \ JAR 文件。NetBeans 是本书中使用的 Oracle 提供的免费集成开发环境，它在每当你构建项目时都会自动创建 JAR 文件。\n\n当你写完一个\
  \ Mod 后，将将其添加到服务器文件夹中一个名为 `plugins` 的子文件夹下。\n\n本小时第一个 Mod 是一个简单的示例，它展示了你在为 Spigot\
  \ 创建的每个 Mod 中都会使用的框架。该 Mod 为游戏添加了一个 `/siamesecat` 命令，可以创建一个暹猫猫实体，将其添加到世界中，并让你（玩家）成为它的主人。\n\
  \n每个 Mod 在 NetBeans 中都是独立的项目。要开始此项目，请按照以下步骤操作：\n\n1. 在 NetBeans 中，选择菜单命令 `File`（文件）、`New\
  \ Project`（新建项目）。打开新建项目向导。\n2. 在 `Categories`（类别）面板中，选择 `Java`，在 `Projects`（项目）面板中，选择\
  \ `Java Application`。然后点击 `Next`下一步）。\n3. 在 `Project Name`（项目名称）字段中，输入 `SiameseCat`（无空格并按所示大写）。\n\
  4. 点击 `Project Folder`（项目文件夹）字段旁的 `Browse`浏览）按钮。出现 `Select Project Location（选择项目位置）对话框。\n\
  5. 找到你安装 Minecraft 服务器的文件夹。选择它并点击`Open（打开）。该文件夹出现在 `Project Location`字段中。\n6. 取消勾选\
  \ `Create Main Class（创建主类）复选框。\n7. 点击`Finish（完成）。\n\n创建 `SiameseCat` 项目，项目面板中会出现两个文件夹：`Source\
  \ Packages`（源包）和 `Libraries`（库），如图 23.7 所示。\n\n![Image](img/23fig07.jpg)\n\n**图\
  \ 23.7**\n\n向 Java 项目添加库。\n\n1. 在每个 Mod 项目上，在你开始编写 Java 代码之前，必须添加 Java 类库：即你在安装时下载的\
  \ Spigot JAR 文件。在 `Projects` 面板中，右键点击 `Libraries` 文件夹并选择菜单命令 `Add Library（添加库）。出现\
  \ `Add Library` 对话框。\n2. 点击`Create（创建）按钮。出现 `Create New Library（新建库）对话框。\n3. 在 `Library\
  \ Name（库名称）字段中，输入 `Spigot` 并点击`OK（确定）。出现 `Customize Library（自定义库）对话框。\n4. 点击`Add\
  \ JAR/Folder（添加 JAR/文件夹）按钮。出现 `Browse JAR/Folder（浏览 JAR/文件夹）对话框。\n5. 使用该对话框找到并打开你安装服务器的文件夹。\n\
  6. 点击 `spigotserver.jar` 以选择该文件。\n7. 点击`Add JAR/Folder（添加 JAR/文件夹）。\n8. 点击`OK（确定）。\n\
  9. `Available Libraries（可用库）`面板现在有一个 `Spigot` 项目。选择它并点击`Add Library（添加库）。\n\n项目面板现在在\
  \ `Libraries` 文件夹中包含 Spigot 的 JAR 文件（点击 `Libraries` 旁边的 + 以查看）。你准备好开始编写 Mod 程序了。\n\
  \n按照以下步骤创建程序：\n\n1. 点击`File（文件）、`New File（新建文件）。出现 `New File` 对话框。\n2. 在 `Categories`\
  \ 面板中，选择 `Java`。\n3. 在 `Projects` 面板中，选择 `Java Application`。点击`Next（下一步）。\n4. 在\
  \ `Class Name（类名）字段中，输入 `SiameseCat`。\n5. 在 `Package（包）字段中，输入 `org.caden`。\n6. 点击`Finish（完成）。\n\
  \n`SiameseCat` 项目在 NetBeans 源编辑器中打开。你为 Spigot 创建的每个 Mod 都以这些语句开头：\n\n\n\n\n\n通过将\
  \ `sender` 对象强制转换为 `Player` 类，创建了一个名为 `me` 的对象。这个对象就是游戏玩家所控制的角色。\n\n通过这个 `Player`\
  \ 对象，你可以调用它的 `getLocation()` 方法（无需参数）来获取玩家所处的精确位置。这个位置由 `Location` 类表示。关于位置，你可以获取到的三个信息是它在三维游戏地图上的\
  \ (x,y,z) 坐标。\n\n`Player` 对象还有一个 `getWorld()` 对象，它会返回一个代表整个游戏世界的 `World` 对象。\n\n\
  你创建的大多数 mod 都会用到这些 `Player`、`Location` 和 `World` 对象。\n\n这个 mod 使用 `World` 类的 `spawn()`\
  \ 方法创建了一个名为暹猫的新生生物：\n\n点击此处查看代码图片\n\n```java\nOcelot cat = world.spawn(spot, Ocelot.class);\n\
  ```\n\n游戏中的每种生物都有对应的类。`spawn()` 的两个参数是猫应该放置的位置以及要创建的生物的类。\n\n这条语句在玩家所在的位置创建了一个名为\
  \ `cat` 的 `Ocelot` 对象。\n\n此时，这只猫是一只奥猫（ocelot），但可以通过这条语句将其更改为暹猫：\n\n点击此处查看代码图片\n\n\
  ```java\ncat.setCatType(Ocelot.Type.SIAMESE_CAT);\n```\n\n猫的 `setCatType()` 方法决定了猫是野生的奥猫，还是暹猫、黑猫或红猫。\n\
  \nMinecraft 中的猫是能够被主人驯服的生物之一。通过调用猫的 `setOwner()` 方法并将玩家作为参数可以建立这种关系：\n\n```java\n\
  cat.setOwner(me);\n```\n\n将列表 23.2 输入源代码编辑器中，并点击 NetBeans 工具栏中的“保存全部”按钮（或选择文件、保存），即可将所有内容整合在一起。\n\
  \n**列表 23.2** `SiameseCat.java` 的完整文本\n\n点击此处查看代码图片\n\n```java\n1: package org.cadenhead.minecraft;\n\
  2:\n3: import java.util.logging.*;\n4: import org.bukkit.*;\n5: import org.bukkit.command.*;\n\
  6: import org.bukkit.entity.*;\n7: import org.bukkit.plugin.java.*;\n8:\n9: public\
  \ class SiameseCat extends JavaPlugin {\n10: public static final Logger log = Logger.getLogger(\"\
  Minecraft\");\n11:   \n12: public boolean onCommand(CommandSender sender, Command\
  \ command,\n13:           String label, String[] arguments) {\n14:           \n\
  15: if (label.equalsIgnoreCase(\"siamesecat\")) {\n16: if (sender instanceof Player)\
  \ {\n17: // 获取玩家 \n18:                     Player me = (Player) sender;\n19: //\
  \ 获取玩家的当前位置\n20:                     Location spot = me.getLocation();\n21: // 获取游戏世界\n\
  22:                     World world = me.getWorld();\n23:\n24: // 生成一只奥猫\n25:  \
  \                   Ocelot cat = world.spawn(spot, Ocelot.class);\n26: // 将它变成暹猫\n\
  27:                     cat.setCatType(Ocelot.Type.SIAMESE_CAT);\n28: // 让玩家成为它的主人\n\
  29:                     cat.setOwner(me);\n30: log.info(\"[SiameseCat] Meow!\");\n\
  31: return true;\n32:                 }\n33:         }\n34: return false;\n35: }\n\
  ```\n\n列表 23.2 第 3–7 行的 `import` 语句为程序提供了五个包：一个来自 Java，四个来自 Spigot。\n\n**注意**\n\n\
  程序中使用了这些类：来自 `java.util.logging` 的 `Logger`，来自 `bukkit` 的 `Location` 和 `World`，来自\
  \ `bukkit.command` 的 `Command`，来自 `bukkit.entity` 的 `Ocelot` 和 `Player`以及来自 `bukkit.plugin.java`\
  \ 的 `JavaPlugin`。\n\n第 31 行和 34 行的 `return` 语句是标准框架的一部分。当 mod 处理命令时，你的 mod 应该返回值\
  \ `true`，否则返回 `false`。\n\n你已经创建了第一个 mod，但 Spigot 无法运行它。它需要一个名为 `plugin.yml` 的文件来告诉\
  \ Minecraft 服务器该 mod。这是一个文本文件，你可以通过以下步骤在 NetBeans 中创建：\n\n1. 选择文件、新文件。新文件对话框打开。\n\
  2. 在类别中选择其他（Other）。\n3. 在文件类型中选择空文件（Empty File）并点击下一步。\n4. 在文件名字段输入 `plugin.yml`。\n\
  5. 在文件夹字段输入 `src`。\n6. 点击完成。\n\n一个名为 `plugin.yml` 的空白文件会在编辑器中打开。将列表 23.3 的文本输入文件，并确保每行的空格数量相同。不要使用\
  \ Tab 键代替空格。\n\n**列表 23.3** 该项目 `plugin.yml` 的完整文本\n\n点击此处查看代码图片\n\n```\n1: name:\
  \ SiameseCat\n2:\n3: author: Your Name\n4:\n5: main: org.cadenhead.minecraft.SiameseCat\n\
  6:\n7: commands:\n8: siamesecat:\n9: description: Spawn a Siamese cat.\n10:\n11:\
  \ version: 1.0\n```\n\n为了检查空格是否输入正确，第 8 行 `siamesecat` 之前有四个空格，第 9 行 `description`\
  \ 之前有八个空格。`plugin.yml` 文件描述了 mod 的名称、作者、Java 类、版本以及命令的功能描述。\n\n此文件必须位于项目中的正确位置。查看项目面板，它应该在\
  \ `<default package>` 下的 `Source Libraries` 文件夹内。\n\n![Image](img/23fig08.jpg)\n\
  **图 23.8** 检查 `plugin.yml` 的位置。\n\n如果文件位于错误的位置（例如在 `org.cadenhead.minecraft` 标题下），你可以使用拖放移动它。点击并按住文件，将其拖到\
  \ Source Libraries 图标处释放。现在你准备好构建你的 mod 了。选择菜单中的运行、清理并构建项目（Run, Clean, and Build\
  \ Project）。如果成功，NetBeans 用户界面的左下角会出现“Finished SiameseCat (clean)”的消息。\n\nmod 被封装为项目子文件夹中名为\
  \ `SiameseCat.jar` 的文件。要找到它，点击项目面板中的 Files 标签页，然后展开 `dist` 文件夹。Files 标签页列出了组成项目的所有文件，如图\
  \ 23.9 所示。\n\n![Image](img/23fig09.jpg)\n**图 23.9** 寻找 SiameseCat mod 的 JAR 文件。\n\
  \n此 `SiameseCat.jar` 文件需要从项目文件夹到 Minecraft 服务器。按照以下步骤操作：\n\n1. 如果 Minecraft 服务器正在运行，通过进入\
  \ NetBeans 之外的服务器窗口停止它。\n2. 打开安装 Minecraft 服务器的文件夹。打开 SiameseCat 子文件夹。\n3. 返回 Minecraft\
  \ 服务器文件夹。\n4. 打开 `plugins` 子文件夹。\n5. 按 Ctrl+v 将 `SiameseCat` 复制到其中。\n\n你已经在 Minecraft\
  \ 服务器上部署了新 mod。按照你之前的方法启动服务器——点击你创建的 `start-server` 文件——你将在运行期间显示的日志文件中看到两条新消息：\n\
  \n点击此处查看代码图片\n\n```\n[SiameseCat] Loading SiameseCat v1.0\n[SiameseCat] Enabling\
  \ SiameseCat v1.0\n```\n\n如果你没有看到这些消息，而是看到一些长而复杂的错误信息，请双检 `SiameseCat.java` 和 `plugin.yml`\
  \ 中的所有内容，确保它们输入正确；然后重新部署 mod。\n\n当你运行 Minecraft 客户端并连接到服务器时，输入命令 `/siamesecat`。你现在有一只会跟随你周围的新宠物猫。根据你的需要多次输入该命令以不断添加猫。\n\
  \n图 23.10 显示了我和 23 只猫。苦力者不想和我们有瓜。\n\n![Image](img/23fig10.jpg)\n**图 23.10** 来我吧，暹猫朋友们！\n\
  \n### 教会僵尸骑马\n\n\n你创建的第一个 mod 需要花费大量工作，因为你是第一次经历这个过程。剩下的部分应该简单一些，因为你将重复许多相同的步骤。\n\
  \n在这一小时内，你开发的每个 mod 都会比前一个复杂。在这个项目中，你将创建一个由僵尸骑乘的马兵部队。\n\n通过以下任务开始工作吧：\n\n1. 选择 `File`、`New\
  \ Project`，在 Minecraft 服务器相同的文件夹中创建一个名为 `CrazyHorse` 的新 Java Application 项目，就像上一个项目一样。确保取消勾选\
  \ `Create Main Class`。\n2. 在 Projects 窗格中右键点击 `Libraries`，点击 `Add Library`，并将 `Spigot`\
  \ 库添加到项目中。\n3. 选择 `File`、`New File`，并创建一个类名为 `CrazyHorse`、包名为 `org.cadenhead.minecraft`\
  \ 的空 Java 文件。\n\n在 `CrazyHorse.java` 文件的源代码编辑器中输入 Listing 23.4 的文本。程序中使用的新概念将在输入后进行解释。\n\
  \n**列表 23.4** `CrazyHorse.java` 的全文\n\n点击此处查看代码图像\n\n```java\n1: package org.cadenhead.minecraft;\n\
  2:\n3: import java.util.logging.*;\n4: import org.bukkit.*;\n5: import org.bukkit.command.*;\n\
  6: import org.bukkit.entity.*;\n7: import org.bukkit.plugin.java.*;\n8: import org.bukkit.potion.*;\n\
  9:\n10: public class CrazyHorse extends JavaPlugin {\n11: public static final Logger\
  \ log = Logger.getLogger(\"Minecraft\");\n12:   \n13: public boolean onCommand(CommandSender\
  \ sender, Command command,\n14:           String label, String[] arguments) {\n\
  15:         \n16: if (label.equalsIgnoreCase(\"crazyhorse\")) {\n17: if (sender\
  \ instanceof Player) {\n18:                      Player me = (Player) sender;\n\
  19:                      Location spot = me.getLocation();\n20:                \
  \      World world = me.getWorld();\n21:\n22: // spawn some horse-riding zombies\n\
  23: int quantity = (int) (Math.random() * 10) + 1;\n24: log.info(\"[CrazyHorse]\
  \ Creating \" + quantity\n25:                           + \" zombies and horses\"\
  );\n26: for (int i = 0; i < quantity; i++) {\n27: // set horse and zombie location\n\
  28:                             Location horseSpot = new Location(world,\n29:  \
  \                               spot.getX() + (Math.random() * 15),\n30:       \
  \                          spot.getY() + 20,\n31:                              \
  \   spot.getZ() + (Math.random() * 15));\n32:                             Horse\
  \ horse = world.spawn(horseSpot, Horse.class);\n33:                            \
  \ Zombie zombie = world.spawn(horseSpot, Zombie.class);\n34:                   \
  \          horse.setPassenger(zombie);\n35:                             horse.setOwner(me);\n\
  36: // set the horse's color\n37: int coat = (int) (Math.random() * 7);\n38: switch\
  \ (coat) {\n39: case 0:\n40:                             horse.setColor(Color.WHITE);\n\
  41:                             break;\n42: case 1:\n43:                       \
  \      horse.setColor(Color.GRAY);\n44:                             break;\n45:\
  \ case 2:\n46:                             horse.setColor(Color.CREAM);\n47:   \
  \                          break;\n48: case 3:\n49:                            \
  \ horse.setColor(Color.CHESTNUT);\n50:                             break;\n51: case\
  \ 4:\n52:                             horse.setColor(Color.BROWN);\n53:        \
  \                     break;\n54: case 5:\n55:                             horse.setColor(Color.DARK_BROWN);\n\
  56:                             break;\n57: case 6:\n58:                       \
  \      horse.setColor(Color.BLACK);\n59:                             break;\n60:\
  \   }\n61: // increase the horse's speed\n62:                             PotionEffect\
  \ potion = new PotionEffect(\n63:                             PotionEffectType.SPEED,\n\
  64:                             Integer.MAX_VALUE,\n65:                        \
  \     10 + (coat * 10));\n66:                             horse.addPotionEffect(potion);\n\
  67:                         }\n68: return true;\n69:         }\n70:     }\n71: return\
  \ false;\n72:   }\n73: }\n```\n\n在输入列表内容后，通过选择 `File`、`Save` 或点击 `Save All` 保存此文件。\n\
  \n此 mod 为 Minecraft 增加了一个 `/crazyhorse` 命令，会从天空中掉落随机数量的骑马僵尸。第 18–65 行在输入命令时会执行一些酷的操作。这些行周围的其他程序部分是标准的\
  \ mod 框架。\n\n在获取玩家、位置和世界后，mod 在变量中存储了一个 1 到 11 之间的随机数：\n\n点击此处查看代码图像\n\n```java\n\
  int quantity = (int) (Math.random() * 10) + 1;\n```\n\nJava 中 `Math` 类的 `random()`\
  \ 方法生成一个 0.0 到 1.0 之间的随机浮点数。它可以乘以一个整数来产生一个从 0 到该整数的随机整数。\n\n这个数字就是僵尸的数量。\n\n\n\n\
  \n\n### 列表 23.5 此项目 `plugin.yml` 的完整文本\n\n点击此处查看代码图片\n\n```yaml\n1: name: CrazyHorse\n\
  2:\n3: author: Your Name Here\n4:\n5: main: org.cadenhead.minecraft.CrazyHorse\n\
  6:\n7: commands:\n8: crazyhorse:\n9: description: Spawn 1-11 horse-riding zombies.\n\
  10:\n11: version: 1.0\n```\n\n完成后，选择运行（Run）、清理并构建项目（Clean and Build Project）来创建\
  \ mod 的 JAR 文件。\n\n在项目（Projects）窗格中，`Source Packages`（源包）下应该有两个文件：位于 `org.cadenhead.minecraft`\
  \ 的 `CrazyHorse.java` 和位于 `<default package>`（默认包）下的 `plugin.yml`。\n\n在 NetBeans\
  \ 之外，进入你的文件文件夹，将该项目 `dist` 文件夹中的 `CrazyHorse.jar` 文件复制到服务器的 `plugins` 文件夹中。重启服务器（停止它并重新运行），你应该就可以输入\
  \ `/crazyhorse` 命令了。\n\n1–11 只骑马的僵尸会落在你周围，发出“砰”的一声。如果你在游戏白天发布该命令，这些不死人将迎来一个不妙的惊喜。见图\
  \ 23.11。\n\n![Image](img/23fig11.jpg)\n\n**图 23.11**\n\n两个骑马的僵尸。\n\nSpigot 的设计者在让\
  \ Java 类匹配游戏中的物品方面做得很好。当你开发这前两个 mod 时，你可能已经开始思考可以通过微调来更改的内容。\n\n这里是对 CrazyHorse\
  \ mod 列表 23.4 第 33 行的一行代码更改，它可以将一个完全不同的生物放在马背上：\n\n点击此处查看代码图片\n\n```java\nCreeper\
  \ creeper = world.spawn(horseSpot, Creeper.class);\n```\n\n此更改创建了一支苦力爬骑兵而不是僵尸。\n\
  \n尽管你可以推测类名并看到发生了什么，但 Spigot 为其所有 Java 类提供了详尽的在线文档。你可以在 [www.javaminecraft.com/bukkitapi](http://www.javaminecraft.com/bukkitapi)\
  \ 查看 Spigot 1.8.7 的文档。\n\n使用此指南学习 Spigot 中的每个类和接口、它们的实例变量，以及实例方法和类方法。\n\n通过翻阅文档和捣鼓\
  \ CrazyHorse mod，你可以尝试不同的生物和药水效果。\n\n这里有一个让马变得隐形的 mod 修改，会导致僵尸看起来像是漂浮在空中：\n\n点击此处查看代码图片\n\
  \n```java\nPotionEffect potion2 = new PotionEffect(\n    PotionEffectType.INVISIBILITY,\n\
  \    Integer.MAX_VALUE,\n    1);\n\nhorse.addPotionEffect(potion2);\n```\n\n###\
  \ 寻找所有生物（并杀死它们）\n\n前两个 mod 在游戏世界中添加了生物。下一个项目将检查已经存在的生物，找到它们的每一个位置，并用闪电击中该位置。\n\n\
  开始之前：\n\n1. **选择 File（文件）、New Project（新建项目）** 在 Minecraft 服务器文件夹中创建新项目 `LightningStorm`。确保取消勾选\
  \ Create Main Class（创建主类）。\n2. 在 Projects 窗格中，右键点击 `Libraries（库），点击 **Add Library（添加库）**\
  \ 并添加 Spigot 库。\n3. **选择 File（文件）、New File（新建文件）** 并创建一个类名为 `LightningStorm`、包名为\
  \ `org.cadenhead.minecraft` 的空 Java 文件。\n\n将 列表 23.6 的文本输入 NetBeans 的源代码编辑器中，记得在完成后保存文件。\n\
  \n**列表 23.6 `LightningStorm.java` 的完整文本**\n\n点击此处查看代码图片\n\n```java\n1: package org.cadenhead.minecraft;\n\
  2:\n3: import java.util.*;\n4: import java.util.logging.*;\n5: import org.bukkit.*;\n\
  6: import org.bukkit.command.*;\n7: import org.bukkit.entity.*;\n8: import org.bukkit.plugin.java.*;\n\
  9:\n10: public class LightningStorm extends JavaPlugin {\n11: public static final\
  \ Logger log = Logger.getLogger(\"Minecraft\");\n12: \n13: public boolean onCommand(CommandSender\
  \ sender, Command command,\n14:     String label, String[] arguments) {\n15:   \
  \  Player me = (Player) sender;\n16:     World world = me.getWorld();\n17: // get\
  \ every mob in the game\n18:     List<LivingEntity> mobs = world.getLivingEntities();\n\
  19:     \n20: // process lightningstorm\n21:     if (label.equalsIgnoreCase(\"lightningstorm\"\
  )) {\n22:     if (sender instanceof Player) {\n23:         int myId = me.getEntityId();\n\
  24: // loop through each mob at a time\n25:         for (LivingEntity mob : mobs)\
  \ {\n26:             log.info(\"[LightningStorm]\" + mob.getType());\n27: // is\
  \ this mob the player?\n28:             if (mob.getEntityId() == myId) {\n29:  \
  \               // yes, don't strike him\n30:                 continue;\n31:   \
  \          }\n32: // get the mob's location\n33:             Location spot = mob.getLocation();\n\
  34: // lightning strike!\n35:             world.strikeLightning(spot);\n36: // set\
  \ the mob's health to 0 (dead)\n37:             mob.setHealth(0);\n38:         }\n\
  39:     }\n40:     return true;\n41: }\n42: // process mobcount command\n43:   \
  \  if (label.equalsIgnoreCase(\"mobcount\")) {\n44:     if (sender instanceof Player)\
  \ {\n45:         me.sendMessage(\"There are \" + mobs.size() + \" living mobs.\"\
  );\n46:         return true;\n47:     }\n48:     }\n49:     return false;\n50: }\n\
  51: }\n```\n\nLightningStorm mod 在 mod 框架上做了一些新尝试：它监控两个命令而不是一个。`/lightningstorm`\
  \ 命令向生物降下大量的闪电。`/mobcount` 命令计算游戏中有多少活着的生物。\n\n用于 Spigot 的 Minecraft mod 可以实现任意数量的命令。`/lightningstorm`\
  \ 命令实现在 列表 23.6 的第 22–42 行。`/mobcount` 命令实现在 45–50 行。\n\n这些命令都需要玩家对象和世界对象。它们还需要一个所有活动生物的列表，这在第\
  \ 19 行完成：\n\n点击此处查看代码图片\n\n```java\nList<LivingEntity> mobs = world.getLivingEntities();\n\
  ```\n\n该语句调用世界的 `getLivingEntities()` 方法，该方法返回一个包含每个生物的 `List` 对象。生物用实现 `LivingEntity`\
  \ 接口的对象表示。\n\n`List`也是一个接口。它由数组列表（array lists）、栈（stacks）和其他数据结构实现。数组列表的方法和技术也适用于此列表。\n\
  \n有了这个列表后，你可以通过一个语句实现 `/mobcount` 命令：\n\n点击此处查看代码图片\n\n```java\nme.sendMessage(\"\
  There are \" + mobs.size() + \" living mobs.\");\n```\n\n列表的 `size()` 命令返回列表中的元素数量。此信息发送给玩家并显示在游戏中。这是通过调用玩家的\
  \ `sendMessage()` 方法并将信息作为唯一参数来实现的。\n\n`/lightningstorm` 命令更为复杂。\n\nJava 数据结构有特殊的\
  \ `for` 循环，可以轻松遍历结构中的每个项。第 26 行对 `mobs` 列表中的每个生物开始了这样的循环：\n\n点击此处查看代码图片\n\n```java\n\
  for (LivingEntity mob : mobs) {\n```\n\n这将当前生物存储在名为 `mob` 的 `LivingEntity` 对象中。\n\
  \n向地图上的每个生物发送闪电时，必须记住玩家也是一个生物。对自己放电不是个好主意。\n\n游戏中的每个生物都有唯一的 ID。在 `for` 循环开始之前，第\
  \ 24 行存储了玩家的 ID：\n\n点击此处查看代码图片\n\n```java\nint myId = me.getEntityId();\n```\n\n\
  该整数在循环中与当前生物的 ID 进行比较，通过在第 29–32 行调用其 `getEntityID()` 方法：\n\n```java\nif (mob.getEntityId()\
  \ == myId) {\n    continue;\n}\n```\n\n`continue` 语句会导致循环回到第 26 行并处理下一个生物。\n\n\n\
  \n\n[content]\n\n现在玩家已经安全了，你可以通过调用其 `getLocation()` 方法来找到生物的位置：\n\n点击此处查看代码图片\n\n\
  ```\nLocation spot = mob.getLocation();\n```\n\n然后，使用该位置调用世界的 `strikeLightning()`\
  \ 方法：\n\n点击此处查看代码图片\n\n```\nworld.strikeLightning(spot);\n```\n\n用闪电击中生物并不总是致命的——有些生物是很强壮的小家伙——但这让这个效果显得没那么引人注目了。通过调用生物的\
  \ `setHealth()` 方法并传入 `0` 作为参数，可以将其生命值设置为该值并将其杀死：\n\n```\nmob.setHealth(0);\n```\n\
  \n此模组应录入 `plugin.yml` 文件可以在列表 23.7 中找到。在项目的 `src` 文件夹中创建一个名为 `plugin.yml` 的空文件，然后将此列表的内容填充其中。\n\
  \n**列表 23.7 本项目 `plugin.yml` 的完整内容**\n\n点击此处查看代码图片\n\n```\n1: name: LightningStorm\n\
  2:\n3: author: Your Name Here\n4:\n5: main: org.cadenhead.minecraft.LightningStorm\n\
  6:\n7: commands:\n8: lightningstorm:\n9: description: Hit every living mob with\
  \ lightning.\n10: mobcount:\n11: description: Count of living mobs.\n12:       \
  \  \n13: version: 1.0\n```\n\n构建项目（选择 Run、Build 和 Clean Project），然后通过将项目 `dist`\
  \ 文件夹中的 `LightningStorm.jar` 文件复制到服务器的 `plugins` 文件夹，将模组部署到你的 Minecraft 服务器上。下次启动服务器并玩游戏时，你将看到像图\
  \ 23.12 中那样的闪电暴。\n\n实际上，在书中展示它会破坏惊喜感。图 23.12 是一只即将变成火焰烧烤的牛。\n\n![Image](img/23fig12.jpg)\n\
  \n**图 23.12**\n\n这不是闪电暴。\n\n### 编写一个可以建造物品的模组\n\n你创建的前三个模组都是关于生物的，即在 Minecraft 中游荡的移动实体。本小时的最后一个模组将探索如何使用\
  \ Java 执行游戏中最基础的操作：建造和破坏方块。\n\n你将创建一个新命令 `/icecreamscoop`，它会在玩家周围挖掘一个圆洞。洞的大小将由玩家作为命令参数来决定。\n\
  \n以下是开始构建该模组的方法：\n\n**1.** 在 Minecraft 服务器文件夹中创建新项目 `IceCreamScoop`，取消勾选“Create\
  \ Main Class”。\n\n**2.** 在 Projects 面格中，右键点击 `Libraries` 并添加 Spigot 库。\n\n**3.**\
  \ 在 `org.cadenhead.minecraft` 包中创建一个名为 `IceCreamScoop` 类的空 Java 文件。\n\n将列表 23.8\
  \ 的文本内容作为 `IceCreamScoop` 类的代码。在你输入完成后将对其进行解释。\n\n**列表 23.8 `IceCreamScoop.java`\
  \ 的完整内容**\n\n点击此处查看代码图片\n\n```\n1: package org.cadenhead.minecraft;\n2:\n3: import\
  \ java.util.logging.*;\n4: import org.bukkit.*;\n5: import org.bukkit.block.*;\n\
  6: import org.bukkit.command.*;\n7: import org.bukkit.entity.*;\n8: import org.bukkit.plugin.java.*;\n\
  9:\n10: public class IceCreamScoop extends JavaPlugin {\n11: public static final\
  \ Logger log = Logger.getLogger(\"Minecraft\");\n12:     \n13: public boolean onCommand(CommandSender\
  \ sender, Command command,\n14:           String label, String[] arguments) {\n\
  15:\n16: // 设置默认挖掘半径\n17: double radius = 15;\n18: if (arguments.length > 0) {\n\
  19: try {\n20: // 读取用户提供的半径（如果有的话\n21:                   radius = Double.parseDouble(arguments[0]);\n\
  22: // 确保它是可接受的尺寸（5-25）\n23: if ((radius < 5) | (radius > 25)) {\n24:          \
  \                   radius = 15;\n25:             }\n26:      } catch (NumberFormatException\
  \ exception) {\n27: // 什么都不做（使用默认值）\n28:      }\n29: }\n30:     if (label.equalsIgnoreCase(\"\
  icecreamop\")) {\n31: if (sender instanceof Player) {\n32:           scoopTerrain(sender,\
  \ radius);\n33:         }\n34: return true;\n35: }\n36: return false;\n37: }\n38:\n\
  39: // 挖掘世界中圆形的区域\n40: private void scoopTerrain(CommandSender sender, double rad)\
  \ {\n41:     Player me = (Player) sender;\n42:     Location spot = me.getLocation();\n\
  43:     World world = me.getWorld();\n44:\n45: // 遍历一个半径为两倍的正方形\n46: for (double\
  \ x = spot.getX() - rad; x < spot.getX() + rad; x++) {\n47: for (double y = spot.getY()\
  \ - rad; y < spot.getY() + rad; y++) {\n48: for (double z = spot.getZ() - rad; z\
  \ < spot.getZ() + rad; z++) {\n49: // 获取正方形内的一个位置\n50:             Location loc\
  \ = new Location(world, x, y, z);\n51: // 计算距离玩家的距离\n52: double xd = x - spot.getX();\n\
  53: double yd = y - spot.getY();\n54: double zd = z - spot.getZ();\n55: double distance\
  \ = Math.sqrt(xd * xd + yd * yd + zd * zd);\n56: // 是否在半径范围内\n57: if (distance <\
  \ rad) {\n58: // 是，将该方块设为空气\n59:             Block current = world.getBlockAt(loc);\n\
  60:             current.setType(Material.AIR);\n61:         }\n62: }\n63: }\n64:\
  \ }\n65: }\n66:\n67: // 挖掘后播放音效\n68:     world.playSound(spot, Sound.BURP, 30, 5);\n\
  69:     log.info(\"[IceCreamScoop] Scooped at (\"\n70:               + spot.getX()\
  \ + \",\"\n71:               + spot.getY() + \",\"\n72:               + spot.getZ()\
  \ + \")\");\n73:     }\n74: }\n```\n\n此模组挖掘出一个半径从 5 到 25 个方块的圆形。玩家通过在命令后加上空格和数字来决定大小，例如：\n\
  \n```\n/icecreamscoop 10\n```\n\n模组可以像 Java 应用程序一样接收参数。这些参数存储在 `onCommand` 方法的第四个参数中，这是一个\
  \ `String` 数组。\n\n名为 `radius` 的 double 类型在第 17 行创建并赋值 15 之后，以下语句将半径设置为第一个参数的值。\n\
  \n`parseDouble()` 方法是 Java 标准类 `Double` 的，它可以将字符串转换为 double 值（如果这种转换是可能的）。\n\n为了防止输入错误，你将\
  \ `parseDouble()` 放在 `try`-`catch` 块中。当用户的值不是数字时，会抛出 `NumberFormatException`。\n\n\
  \n\n\n利用勾股定理，你可以通过对 `xd`、`yd` 和 `zd` 进行平方并将它们相加，然后使用 `Math` 方法 `sqrt()` 获取该和的平方根来计算距离：\n\
  \n点击此处查看代码图片\n\n```\ndouble distance = Math.sqrt(xd * xd + yd * yd + zd * zd);\n\
  ```\n\n如果当前区块到玩家的距离在玩家选择的半径内，通过以下这两条语句可以将方块变为空气：\n\n点击此处查看代码图片\n\n```\nBlock current\
  \ = world.getBlockAt(loc);\ncurrent.setType(Material.AIR);\n```\n\n首先，会创建一个代表该区块的\
  \ `Block` 对象。\n\n接下来，调用方块的 `setType()` 方法并传入 `Material.AIR`，这是 Minecraft 中代表方块组成材料的几十种值之一。\n\
  \n用于通过将方块变为空气来破坏它的相同技术也可以用于建造物体。唯一改变的是材料的类型。如果你想挖掘出一块游戏并将其变成钻石而不是空气，则将使用这条语句：\n\n\
  点击此处查看代码图片\n\n```\ncurrent.setType(Material.DIAMOND);\n```\n\n当从世界中挖掘出一块时，模组会执行两件事来记录这项成就：播放声音并向服务器日志发送消息。\n\
  \n通过调用 `world` 对象的 `playSound()` 方法并传入四个参数播放声音——声音的位置、类型、音量和音调：\n\n点击此处查看代码图片\n\n\
  ```\nworld.playSound(spot, Sound.BURP, 30, 5);\n```\n\n正如你可能猜到的那样，声音是一个打嗝声。有几十种可能的声音可以使用。\n\
  \n通过调用 `Logger` 对象的 `info()` 命令并传入消息文本，可以在服务器上记录消息：\n\n点击此处查看代码图片\n\n```\nlog.info(\"\
  [IceCreamScoop] Scooped at \" + spot);\n```\n\n项目的 `plugin.yml` 文件如列表 23.9 所示。在项目的\
  \ `src` 文件夹中创建一个名为 `plugin.yml` 的空文件以匹配此列表。\n\n**列表 23.9 本项目 `plugin.yml` 的完整内容**\n\
  \n点击此处查看代码图片\n\n```yaml\n1: name: IceCreamScoop\n2:\n3: author: Your Name Here\n\
  4:\n5: main: org.cadenhead.minecraft.IceCreamScoop\n6:\n7: commands:\n8: icecreamscoop:\n\
  9: description: Scoop away land around the player.\n10:\n11: version: 1.0\n```\n\
  \n在构建模组并将 JAR 文件部署到 Minecraft 服务器后，使用与之前项目相同的步骤，你可以在游戏世界中移动，并在景观中挖掘出巨大的圆球。图 23.13\
  \ 显示了当你站在平坦土地上并输入此命令时发生的情况：\n\n```\n/icecreamscoop 10\n```\n\n![Image](img/23fig13.jpg)\n\
  \n**图 23.13**\n\n在 Minecraft 世界中挖掘出的圆圈区域。\n\n在测试此模组时，我发现将自己挖到世界底部并不需要长时间。你还可能掉得足够远而导致死亡，因此最好的主意不是在出生点进行任何挖掘。\n\
  \n通过将材料从 `AIR` 更改为材料，你可以在世界中制作球体。物质的完整列表可以在 Spigot 的 Java 文档 [www.javaminecraft.com/bukkitapi](http://www.javaminecraft.com/bukkitapi)\
  \ 中找到，这里有四种供你入门：\n\n![Image](img/arrow.jpg) `Material.DIRT`\n\n![Image](img/arrow.jpg)\
  \ `Material.COBBLESTONE`\n\n![Image](img/arrow.jpg) `Material.WOOD`\n\n![Image](img/arrow.jpg)\
  \ `Material.GRAVEL`\n\n如果你将方块变为空气以外的任何物体，模组将移除你所站位置的空气。那一定很疼。你可以通过这两条语句传送到一个新位置：\n\
  \n点击此处查看代码图片\n\n```\nLocation newSpot = new Location(world,\n    spot.getX(),\n\
  \    spot.getY() + rad + 1,\n    spot.getZ());\nme.teleport(newSpot);\n```\n\n因为\
  \ Minecraft 中的 Y 轴是垂直位置，这会将玩家移动到球体正上方。\n\n### 总结\n\n在我编写 Java 程序和教人们如何使用这种语言的这些年里，我从未预想过我会把这些技能用在让一个僵尸骑上。\n\
  \n\n\n\n\n![Image](img/arrow.jpg) 使用 Spigot 的 Java 文档，创建一个 mod，生成一个在本小时内未提到过的生物（mob）。\n\
  \n要查看实现这些活动的 Java 程序，请访问书籍的网站：[www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 24 小时：编写 Android 应用程序\n\n### 本小时的任务列表：\n\n* ![Image](img/arrow.jpg) 了解为什么创建了\
  \ Android。\n* ![Image](img/arrow.jpg) 创建一个 Android 应用程序。\n* ![Image](img/arrow.jpg)\
  \ 学习 Android 应用程序的结构。\n* ![Image](img/arrow.jpg) 在模拟器上运行应用程序。\n* ![Image](img/arrow.jpg)\
  \ 在 Android 手机上运行应用程序。\n\nJava 是一种通用编程语言，可以运行在各种平台之上。近年来，其中一个平台脱颖而出，并成为新 Java 开发领域极其成功的火花。\n\
  \nAndroid 操作系统最初用于手机手机，后来已扩展到许多其他设备，它专门运行用 `Java` 编写的程序。\n\n这些程序被称为 `apps`（应用程序），它们构建在一个开源移动平台之上，该平台对开发者来说是完全免费的。任何人都可以编写、部署和销售\
  \ Android 应用程序。\n\n在本小时中，你将学习 Android 是如何产生的、它的特之处在哪里，以及为什么有这么多程序员在该平台上进行开发。你还将创建一个应用程序，并在\
  \ Android 手机（如果你拥有一部的话）和模拟器（如果你没有的话）上运行它。\n\n### Android 简介\n\nAndroid 始于 2003 年，被\
  \ Google 收购，并于 2007 年发布。这是行业范围内共同努力的一部分，旨在建立一个新的非专有且开放的移动手机平台，这与驱动 RIM BlackBerry\
  \ 和 Apple iPhone 的技术不同。移动手机和技术领域的一些大名字——Google、Intel、Motorola、Nvidia、三星等公司——组成了开放手持联盟（Open\
  \ Handset Alliance），以互利互赢的方式推广这一新平台。\n\nGoogle 发布了 Android 软件工具包 (`SDK`)，这是一套用于开发\
  \ Android 应用程序的免费工具。第一款运行 Android 的手机 T-Mobile G1 于 2008 年 6 月上市。\n\n这项努力起初进展缓慢，但从\
  \ 2010 年初开始呈爆炸式增长，并成为 iPhone 以及其他移动平台的真正竞争对手。现在所有主要的手机运营商都提供 Android 手机。平板电脑和电子书阅读器的市场也在不断增长。\n\
  \n在 Android 出现之前，移动应用程序开发需要昂贵的编程工具和开发者计划。手机制造商控制谁被允许为他们创建应用程序，以及应用程序是否可以出售给用户。\n\
  \nAndroid 拆除了这道墙。\n\nAndroid 的开源和非专有性质意味着任何人都可以开发、发布和销售应用程序。唯一的成本是向 Google 市场提交应用程序的笔少量费用。其他所有内容都是免费的。\n\
  \n下载 Android `SDK` 并了解更多关于为该平台创建程序信息的地方是 Android 开发者网站：`https://developer.android.com`。在编写自己的应用程序时，你会经常查阅它，因为它记录了\
  \ Android `Java` 类库中的每一个类，并作为一个详尽的在线参考。\n\n如果你使用配备支持 Android `SDK` 的集成开发环境 (`IDE`)，编写\
  \ Android 应用程序将变得更容易。Android 编程推荐的 IDE 是 `Android Studio`，它也是免费且开源的。\n\n你可以使用 `Android\
  \ Studio` 编写 Android 应用程序，在模拟 Android 手机的模拟器中测试它们，甚至将其部署到实际设备上。\n\n在大部分时间里，`Java`\
  \ 语言一直被用于编写运行在三个地方之一程序：桌面计算机、Web 服务器或 Web 浏览器。\n\nAndroid 让 `Java` 无处不在。你的程序可以部署在数百万手机和其他移动设备上。\n\
  \n这实现了 James Gosling 在 20 世纪 90 年代中期发明这种语言时的最初设计目标。他当时被赋予的任务创建一种可以在手机、智能卡和电器等设备上随处运行的语言。\n\
  \n当 `Java` 开发者首先作为运行交互式 Web 浏览器程序的手段、然后作为通用语言流行起来时，他们放下了那些梦想。\n\n二十年后，根据一项行业估计，Android\
  \ 平台在全球范围内运行着高达 30 亿个 `Java` 程序。\n\nAndroid 在未来几年可能会成为 `Java` 编程中最无不在且最有利的领域。\n\n\
  ### 创建 Android 应用程序\n\nAndroid 应用程序是使用应用程序框架的普通 `Java` 程序，框架是一组所有应用程序共有的核心类和文件。该框架体现了应用程序必须如何结构以便在\
  \ Android 设备上正确运行的规则。\n\n要开始编写应用程序，你必须安装 `Android Studio`。要下载软件，请访问 `https://developer.android.com`。运行安装向导并按照指示在你的计算机上设置软件。\n\
  \n要在项目中使用该 `IDE`：\n\n1. 运行 `Android Studio`。\n2. 在启动时出现的对话框中，选择 `Start a New Android\
  \ Project`（启动新 Android 项目）。打开 `Create New Project` 向导，如图 24.1\n\n**图 24.1** 在 Android\
  \ Studio 中创建新的 Android 项目。\n\n1. 在 Application Name（应用程序名称）字段中，输入 `SalutonMondo`。\n\
  2. 在 Company Domain（公司域名）字段中，输入 `java24hours.com`。Package Name（包名）字段将更新为使用这些和应用程序名称，变为\
  \ `com.java24hours.salutonmondo`。\n3. 你可以接受默认的项目位置（用户文件夹下的 `StudioProjects` 子文件夹），或通过右侧的“...”按钮选择另一个位置。\n\
  4. 点击 Next。\n5. 每个 Android 项目都需要一个目标平台。目标代表可以运行你的应用程序的最旧 Android 版本。选择 `Phone` 和\
  \ `Tablet` 作为目标，并将 `API 15` 作为 Minimum SDK（如果没有 API 15）。\n6. 点击 Next。向导询问要创建的活动。选择\
  \ `Fullscreen` 并点击 Next。\n7. 在 Activity Name（活动名称）字段中，输入 `SalutonActivity`。这更改了\
  \ Layout 和 Title 字段。保留这些更改。\n8. 点击 Finish。新应用程序被创建，包中出现了 `SalutonMondo` 项目。\n\n\
  #### 探索新的 Android 项目\n\n一个新的 Android 项目由大约 20 个文件和文件夹组成，在 Android 中始终以相同的方式组织。根据应用程序的功能，可能会添加更多文件，但这些初始文件和文件夹必须存在。\n\
  \n图 24.2 显示了创建 Android 项目后 `Android Studio` 的面板。如果你没有看到此面板，点击 IDE 左边缘的 `Projects`\
  \ 选项卡。\n\n![Image](img/24fig02.jpg)\n\n**图 24.2** 查看 Android 项目的组成部分。\n\n你可以使用文件夹探索项目的文件和结构。新的\
  \ `SalutonMondo` 应用程序包含以下组件：\n\n![Image](img/arrow.jpg) `/java`——应用程序 `Java` 源代码的根文件夹。\n\
  \n![Image](img/arrow.jpg) `/src/com.java24hours.salutonmondo/SalutonActivity.java`——在运行时默认启动的活动类。\n\
  \n![Image](img/arrow.jpg) `/res`——应用程序资源的文件夹，如字符串、数字、布局文件、图形和动画。特定资源类型有子文件夹：`layout`、`values`、`drawable`\
  \ 和 `mipmap`。\n\n![Image](img/arrow.jpg) `AndroidManifest.xml`——应用程序的主要配置文件。\n\n\
  \n\n\n\n这些文件和文件夹构成了应用程序框架。作为一名 Android 程序员，你着的首要任务是学习如何修改框架，以便能够发现每个组件可以实现什么功能。\n\
  \n框架中还添加了一些额外的文件以满足特定目的。\n\n## 创建应用\n\n尽管你还没有对它进行任何操作，但你已经可以成功运行这个新的 Android 项目了。该框架本身就是一个可以运行的应用程序。\n\
  \n因为这样做没有趣，你将自定义 `SalutonMondo` 应用，以提供传统的计算机编程问候语“Saluton Mondo!”\n\n在第 2 小时“编写你的第一个程序”中，你通过调用\
  \ `System.out.println()` 方法将文本“Saluton Mondo!”作为字符串显示。\n\nAndroid 应用显示的字符串首先存储在一个名为\
  \ `strings.xml` 的资源文件中。你可以在 `/res/values` 文件夹中找到此文件。\n\n使用包管理器（Package Explorer）导航到该文件夹。双击\
  \ `strings.xml`。XML 文件将在文本编辑器中打开，如图 24.3 所示。\n\n![Image](img/24fig03.jpg)\n\n**图\
  \ 24.3**\n\n编辑 Android 应用的字符串资源。\n\n字符串和其他资源被赋予了一个名称和一个值，就像 Java 中的变量一样。编辑面板中有三个以\
  \ XML 数据形式表示的字符串资源：`app_name`、`dummy_button` 和 `dummy_content`。\n\n资源的名称遵循三条规则：\n\
  \n![Image](img/arrow.jpg) 它们必须全部小小写。\n\n![Image](img/arrow.jpg) 它们不能有空格。\n\n![Image](img/arrow.jpg)\
  \ 它们只能使用下划线字符（_”）作为标点符号。\n\n资源存储在 XML 文件。资源编辑器（Resources editor）是一个简单的 XML 编辑器。你也可以直接编辑\
  \ XML 本身。\n\n目前 `strings.xml` 如下：\n\n输出 ![Image](img/arrow1.jpg)\n\n点击此处查看代码图像\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">SalutonMondo</string>\n   \
  \ <string name=\"dummy_button\">Dummy Button</string>\n    <string name=\"dummy_content\"\
  >DUMMY\\nCONTENT</string>\n</resources>\n```\n\n这是一个带有三个 `string` 子元素的 `resources`\
  \ 元素。每个 `string` 元素都有一个持有其名称的 `name` 属性。起始 `<string>` 标签和结束 `</string>` 标签之间还有文本，持有其值。\n\
  \n这些的作用与变量相同：一个名为 `dummy_content` 的值为“DUMMY\\nCONTENT”。\n\n此编辑器允许编辑 XML 文件中的所有内容，甚至是标记标签。将“DUMMY\\\
  nCONTENT”更改为“Saluton Mondo!”——注意不要更改周围的任何字符。完成更改后，XML 文件应包含以下内容：\n\n输出 ![Image](img/arrow1.jpg)\n\
  \n点击此处查看代码图像\n\n```xml\n<resources>\n    <string name=\"app_name\">SalutonMondo</string>\n\
  \    <string name=\"dummy_button\">Dummy Button</string>\n    <string name=\"dummy_content\"\
  >Saluton Mondo!</string>\n</resources>\n```\n\n点击 Android Studio 工具栏中的 Save 按钮（或选择\
  \ File, Save All）将更改保存到 `strings.xml` 文件。\n\n经过该修改，你几乎准备好运行应用了。\n\n## 设置 Android\
  \ 模拟器\n\n在构建 Android 应用之前，你必须设置它的调试环境。这可以在 Android Studio 中处理。你必须设置一个 Android 虚拟设备\
  \ (AVD)，可以在你的桌面上作为模拟器运行该应用。你还必须创建项目的调试配置。完成后，你可以构建应用并在模拟器中运行它。\n\n要配置 Android 虚拟设备，首先点击\
  \ Android Studio 工具栏上的绿色 Android 手机图标，如图 24.4 所示。\n\n![Image](img/24fig04.jpg)\n\
  \n**图 24.4**\n\n配置 Android 虚拟设备。\n\n这将启动 Android 虚拟设备管理器（Android Virtual Device\
  \ Manager），它是 Android SDK 中的工具之一。你创建的模拟器列在左侧。管理器如图 24.5 所示。\n\n![Image](img/24fig05.jpg)\n\
  \n**图 24.5**\n\n创建一个新的 Android 模拟器。\n\n要添加新模拟器，点击 Create Virtual Device 并遵循以下步骤：\n\
  \n1. 从列表中选择设备，例如 Galaxy Nexus，并点击 Next。\n2. 从列表中选择一个版本，例如 Nougat，并点击 Next。\n3. 在\
  \ AVD Name 字段中，为其命名为 `SimpleAVD`。\n4. 点击 Finish。\n5. 新模拟器将被创建，这可能需要一点时间（通常不超过一分钟）。\n\
  \n你可以根据需要创建多个模拟器。它们可以针对不同的 Android 版本进行自定义。关闭 Android 虚拟设备管理器返回主界面。\n\n### 运行应用\n\
  \n现在你已经有了模拟器，可以运行你的第一个应用了。选择菜单命令 Run -> App。弹出 Select Target 对话框。在 Available Devices（可用设备）下，选择\
  \ `SimpleAVD` 并点击 OK。\n\n你可能会被要求安装平台。点击 Install 并 Continue。\n\n模拟器将在自己的窗口中加载。这可能需要一分钟或更长时间，请等待手机启动。你安装的应用将带有\
  \ Android 图标和标签 `Saluton Mondo!` 出现，如图 24.6 所示。\n\n![Image](img/24fig06.jpg)\n\n\
  **图 24.6**\n\n在模拟器中运行应用。\n\n## 设计真实应用\n\nAndroid 应用可以利用设备的所有功能，例如短信消息、位置服务和触摸输入。在本书的最后一个编程项目中，你将创建一个名为\
  \ Take Me to Your Leader 的真实应用。\n\n该应用利用 Android 的电话功能来拨打电话、访问网站并在 Google Maps 中加载位置。\n\
  \n\n\n\n\n## 1. 选择启动一个新的 Android Studio 项目（如果你没有看到此项，请通过菜单命令 `File`、`Close Project`\
  \ 关闭上一个项目。）\n\n2. 在 `Application Name` 字段中，输入 `Leader`。这也会自动填充到 `Project Location`\
  \ 字段。\n\n3. `Company Domain` 字段应该是 `java24hours.com`。确认无误后，点击 Next（下一步）。\n\n4. 选择\
  \ `Phone and Tablet`，选择 `Minimum SDK` 值为 `API 15`（如果不可用，则选择最低值），然后点击 Next（下一步）。\n\
  \n5. 选择 `Fullscreen Activity`；然后点击 Next（下一步）。\n\n6. 在 `Activity Name` 字段中，输入 `LeaderActivity`。\n\
  \n7. 点击 `Finish`（完成）。\n\n项目会出现在 Android Studio 的项目窗格中。\n\n### 提示\n此项目涵盖了大量内容。在学习过程中，你会发现保持浏览器打开并在\
  \ Android 开发者网站的参考部分 [`developer.android.com/reference`](https://developer.android.com/reference)\
  \ 会非常有帮助。你可以搜索 Android 类库中的 Java 类以及项目中的文件名以获取更多信息。\n\n### 组织资源\n创建一个 Android 应用需要\
  \ Java 编程，但大部分工作是在 Android Studio 界面中完成的。当你完全熟悉 Android SDK 的功能后，无需编写单行 Java 代码即可完成大量工作。\n\
  \n你不需要编程就能完成的一件事是创建应用程序使用的资源。每个新的 Android 项目从开始都包含几个放置资源的文件夹。要查看这些文件夹，请展开 Package\
  \ Explorer 中的 `Leader` 文件夹，然后展开 `/res` 文件夹及其所有子文件夹。\n\n资源由 `PNG`、`JPG` 或 `GIF` 格式的图形；存储在名为\
  \ `strings.xml` 文件中的字符串；XML 格式的用户界面布局文件；以及你可以创建的其他文件组成。另外两个文件是用于应用程序颜色的 `colors.xml`\
  \ 和用于定义用户界面组件外观的 `styles.xml`。\n\n新项目的 `/res` 文件夹包含名为 `ic_launcher.png` 和 `ic_launcher_round.png`\
  \ 的文件夹，它们包含不同版本的应用程序图标。图标是启动应用程序时使用的小图形。\n\n多个版本的 `ic_launcher.png` 是相同的图形，针对不同分辨率的显示进行了尺寸调整。你将不会使用这些图标。项目将添加一个新的图形文件\
  \ `appicon.png`，并在应用程序的主配置文件 `AndroidManifest.xml` 中将其指定为应用程序的图标。\n\n本书的网站包含了 `appicon.png`\
  \ 以及此应用所需的其他四个图形文件：`browser.png`、`maps.png`、`phone.png` 和 `whitehouse.png`。访问 [www.java24hours.com](http://www.java24hours.com)\
  \ 并进入该版本的第 24 小 页面。下载所有五个文件并将它们保存到计算机上的临时文件夹中。\n\nAndroid 对多分辨率的支持非常方便，但这里并不是必须的。\n\
  \n可以使用剪切粘贴将文件添加到资源中。打开包含这五个文件的临时文件夹，选择 `appicon.png` 并按 `Ctrl-C` 复制。在 Android Studio\
  \ 中，在项目窗格中选择 `mipmap` 文件夹，右键点击并粘贴。\n\n### 注意\n资源在应用程序中通过其 ID 进行标识。名称必须仅包含小写字母、数字、下划线和点。\n\
  \n### 配置应用程序的清单\n应用程序的主要配置是一个名为 `AndroidManifest.xml` 的文件。要开始编辑此文件，请双击 `res` 文件夹中的\
  \ `AndroidManifest.xml`。\n\n### 设计用户界面\n应用程序的图形界面由布局组成，如文本字段、按钮等容器。应用程序的所有屏幕都保存在\
  \ `/res/layout` 文件夹中。此项目有一个 `activity_leader.xml` 文件被指定为屏幕。\n\n\n\n\n组件（Component）面板列出了屏幕上的小部件。选择\
  \ `imageButton1` 项。该按钮的属性将在属性（Properties）面板中打开。\n\n1.  向下滚动属性面板，直到看到 ID 属性。它的当前值设置为\
  \ `imageButton1`。将其更改为 `phoneButton`。\n2.  在 `On Click` 属性中，输入值 `processClicks`。（这将在下一节中解释。）\n\
  3.  对 `imageButton2` 重复步骤 8–11，为其赋予 ID `webButton` 并将 On Click 属性设置为 `processClicks`。\n\
  4.  对 `imageButton3` 重复步骤 8–11，为其赋予 ID `mapButton` 并将 On Click 属性设置为 `processClicks`。\n\
  5.  点击组件树（Component Tree）中的 `LinearLayout` 项。该屏幕的属性将出现在属性面板中。\n6.  在属性面板中，点击查看所有属性链接。\n\
  7.  点击 `Background` 的值；然后点击 `...` 按钮。资源（Resources）对话框将打开。\n\n8.  选择 `whitehouse`，并点击确定。白宫的图形将成为屏幕的背景。\n\
  9.  点击保存按钮。\n\n完成后的屏幕显示在图 24.8 中。\n\n![Image](img/24fig08.jpg)\n\n**图 24.8**\n\n\
  预览应用程序的图形用户界面。\n\n## 编写 Java 代码\n\n到此时，你已经完成了新应用的大部分工作，但你还没有写过一行 Java 代码。当你尽可能利用\
  \ Android SDK 的各种功能而不诉诸编程时，应用开发会变得更加容易。\n\n应用被组织成 Activity（活动），它们代表应用可以执行的操作。每个\
  \ Activity 都由其自己的 Java 类定义。当你创建此应用时，你指定了要创建一个名为 `LeaderActivity` 的 Activity。当应用加载时，与此名称相匹配的类会自动运行。\n\
  \n`LeaderActivity.java` 的源代码可以在项目资源管理器（包资源生成器，Package Explorer）的 `/java/com.java24hours.leader`\
  \ 文件夹中找到。双击此文件进行编辑。\n\n当你启动时，该类已经有了许多现有的源代码。\n\n与所有 Activity 一样，`LeaderActivity`\
  \ 类是 activity 类的子类，该子类包含了显示屏幕、收集用户输入、保存用户偏好等所需的行为。\n\n类中定义的 `onCreate()` 方法在类加载时被调用。\n\
  \n该方法的第一件事是使用 `super()` 调用其父类中的同名方法：\n\n```java\nsuper.onCreate(savedInstanceState);\n\
  ```\n\n接下来，它调用了 `setContentView()`，该方法用于选择要显示的屏幕。此方法的参数是一个实例变量 `R.layout.activity_leader`，它指向\
  \ `/res/layout` 中的 `activity_leader.xml` 文件。正如你可能记得的那样，资源的 ID 是其不带扩展名的文件名。\n\n当你早之前设计应用的用户界面时，你将每个按钮的\
  \ On Click 属性都设置为 `processClicks`。这表示当用户点击屏幕上的小部件时，将调用名为 `processClicks()` 的方法。\n\
  \n现在是时候实现该方法了。在 `LeaderActivity` 的 `onCreate()` 方法上方添加这些语句：\n\n```java\npublic void\
  \ processClicks(View display) {\n    Intent action = null;\n    int id = display.getId();\n\
  }\n```\n\n在文件顶部添加此 `import` 语句：\n\n```java\nimport android.content.Intent;\n```\n\
  \n回到 `processClicks()` 方法。它调用时带有一个参数：一个来自 `android.view` 包的 `View` 对象。`View` 是应用中某种视觉视觉显示。在这种情况下，它是包含拨号器、浏览器和地图按钮的屏幕。\n\
  \n`View` 对象的 `getId()` 方法返回被点击按钮的 ID：`phoneButton`、`webButton` 或 `mapButton`。\n\n\
  此 ID 存储在 `id` 变量中，以便在 `switch` 语句中使用它，并根据点击情况执行相应操作。在调用 `display.getId()` 的那行之后，添加这些语句：\n\
  \n```java\nswitch (id) {\n    case (R.id.phoneButton):\n        // ...\n       \
  \ break;\n    case (R.id.webButton):\n        // ...\n        break;\n    case (R.id.mapButton):\n\
  \        // ...\n        break;\n    default:\n        break;\n}\n```\n\n此代码将使用每个\
  \ ID 的整数作为 `switch`，执行三个操作中的一种。\n\n`processClicks()` 方法中的第一个语句创建了一个变量来存放 `Intent`\
  \ 对象，它是 Android 的 `android.content` 包中的一个类：\n\n```java\nIntent action;\n```\n\n\
  Android 中的 `Intent` 是 Activity 告诉另一个 Activity 要做什么的方式。它们也是应用与 Android 设备通信的方式。以下是此方法使用的三个\
  \ Intent：\n\n```java\naction = new Intent(Intent.ACTION_DIAL, Uri.parse(\"tel:202-456-1111\"\
  ));\naction = new Intent(Intent.ACTION_VIEW, Uri.parse(\"http://whitehouse.gov\"\
  ));\naction = new Intent(Intent.ACTION_VIEW, Uri.parse(\"geo:0,0?q=White House,\
  \ Washington, DC\"));\n```\n\n`Intent()` 构造函数接受两个参数：由其中一个变量表示的动作，以及与动作关联的数据。这三个\
  \ Intent 告诉 Android 设备设置拨打白公公共线的拨号（202-456-1111）、访问 `http://whitehouse.gov` 以及加载带有“华盛顿特区白宫”地址的地图。\n\
  \n将这三个 Intent 构造函数放在 `switch` 语句的每个 `case` 中——分别放在 `phoneButton` 块、`webButton` 块和\
  \ `mapButton` 块的注释位置。在你创建了 `Intent` 后，以下语句将执行它：\n\n```java\nstartActivity(action);\n\
  ```\n\n将此语句放在 `switch` 块结束之后。由于你删除了活动上的虚拟按钮，你必须移除这行代码，它是 `onCreate()` 方法的最后一行：\n\
  \n```java\nfindViewById(R.id.dummy_button).setOnTouchListener(mTouchListener);\n\
  ```\n\n移除它的简单方法是在它前面加上 `//`，将其变成编译器忽略的注释。为了让你添加的代码正常运行，必须在类中添加以下 `import` 语句：\n\n\
  ```java\nimport android.net.Uri;\n```\n\n`LeaderActivity` 类中 `processClicks()` 方法的全文位于列表\
  \ 24.1。使你的代码方法与列表匹配。（注意，这不是 `LeaderActivity.java` 的完整源代码，只是 `processClicks()` 方法。）\n\
  \n**列表 24.1 `LeaderActivity.java` 的部分文本**\n\n```java\nvoid processClicks(View display)\
  \ {\n    Intent action = null;\n    int id = display.getId();\n    switch (id) {\n\
  \        case (R.id.phoneButton):\n            action = new Intent(Intent.ACTION_DIAL,\n\
  \                Uri.parse(\"tel:202-456-1111\"));\n            break;\n       \
  \ case (R.id.webButton):\n            action = new Intent(Intent.ACTION_VIEW,\n\
  \                Uri.parse(\"http://whitehouse.gov\"));\n            break;\n  \
  \      case (R.id.mapButton):\n            action = new Intent(Intent.ACTION_VIEW,\n\
  \                Uri.parse(\"geo:0,0?q=White House, Washington, DC\"));\n      \
  \      break;\n        default:\n            break;\n    }\n    startActivity(action);\n\
  }\n```\n\n\n\n\n要运行应用，请选择 `Run`、`Run App`，并将 `SimpleAVD` 作为虚拟设备。模拟器将加载（这需要一些时间），然后会自动运行应用。\n\
  \n模拟器并不能模拟 Android 设备可以执行的所有操作。Leader 应用中的 `Dialer`（拨号）和 `Browser`（浏览器）按钮应该正常工作，但在使用\
  \ `Maps`（地图）时可能会遇到问题。\n\n如果你有一部适用于 `Android SDK` 的 Android 手机，并且手机已设置为调试模式，也可以在手机上运行该应用。\n\
  \n选择 `Run`、`Run App`，然后选择你的手机作为设备而不是虚拟设备。点击 `OK`。\n\n图 24.9 显示了应用在我的手机上运行的情况。当手机从竖屏模式切换到横屏模式时，应用会随之切换。\n\
  \n![Image](img/24fig09.jpg)\n\n**图 24.9**\n\n带我去见你的领袖！\n\nLeader 应用也被添加到了手机应用程序列表中，带有它自己的“带我去见你的领袖”图标。即使在你断开\
  \ USB 线后，它也会留在手机上。\n\n恭喜！世界上现在有十亿零一个 Android 应用了。\n\n**注意**\n\n正如你可能设想的，Android\
  \ 编程的内容远比一个小时能涵盖的要多。Sams 提供了另一本书，将你在这里学到的 Java 编程并扩展为另外 24 小时的 Android 专项内容：*Sams\
  \ Teach Yourself Android Application Development*（Android 应用开发），第四版，由 Carmen Delessio、Lauren\
  \ Darcey 和 Shane Conder 著（ISBN 978-0-672-33739-0）。\n\n### 总结\n\n*Sams Teach Yourself\
  \ Java in 24 Hours* 的目标是帮助你熟悉编程概念，并对编写自己的程序的能力充满信心，无论这些程序是运行在桌面式电脑、Web 服务器还是手机上。Java\
  \ 的一种方法有些难以掌握。（你可以随手划掉前句中的“*有些*”一词。）\n\n随着你 Java 经验的积累，你建立的经验将变得越来越重要，因为像面向对象编程、虚拟机和安全环境等概念处于软件开发的最前沿。\n\
  \n如果你还没有查看，应该检查附录以获取更多有用的信息。\n\n在本小时结束时，你可以在几个地方探索 Java。程序员们在 [www.planetnetbeans.org](http://www.planetnetbeans.org)\
  \ 的博客上讨论这种语言。在 [www.careerbuilder.com](http://www.careerbuilder.com) 等就业网站的数据库中列出了大量的\
  \ Java 职位空缺。该书在 [www.java24hours.com](http://www.java24hours.com) 还有一个网站，你可以在那里给作者发送电子邮件，并阅读对读者问题的解答、对书籍的说明以及（咽了口水）纠正。\n\
  \n继续作为 Java 程序员并提升技能的一种方法是阅读 *Sams Teach Yourself Java in 21 Days*。我也写了那本书，它扩展了这里涵盖的主题并引入了新主题，如\
  \ `JDBC`、`Java servlets` 和网络编程。\n\n如果你没有跳读并刚刚完成了所有的 24 小时课程，太棒了。请利用你新学到的编程技能去寻找一份好工作，并重建世界经济。\n\
  \n### 工作坊\n\n#### 问答\n\n**问：为什么使用 Android Studio 创建 Android 应用而不是 NetBeans？**\n\n\
  **答：你可以使用 NetBeans 开发应用，但对于 Android 编程来说，它是一个更笨重且支持较少的 IDE。Android Studio 已被 Google\
  \ 指定为首选的 Android IDE。在 [`developer.android.com`](http://developer.android.com) Android\
  \ 开发者网站上的官方文档和教程都使用 Android Studio。**\n\n大多数 Android 编程书籍也采用 Android Studio。虽然从\
  \ NetBeans 切换到 Android Studio 需要学习曲线。\n\n\n\n\n\n从一个不完美的开始，NetBeans IDE 已经成长成为 Java\
  \ 开发者领先的编程工具之一。Java 语言的创造者 James Gosling 在他的书 *NetBeans Field Guide* 中对它给予了终极信任：“我所有的\
  \ Java 开发都使用 NetBeans。”在多年来尝试了该语言可用的大多数 IDE 后，我也成了一个它的忠实支持者。\n\nNetBeans 支持 Java\
  \ 语言三个版本的所有方面面，包括 Java 标准版 (JSE)、Java 企业版 (JEE) 和 Java 移动版 (JME)。它还支持 Web 应用程序开发、Web\
  \ 服务和 JavaBeans。本书侧重于 JSE。\n\n你可以从 [`netbeans.org`](https://netbeans.org) 下载适用于\
  \ Windows、Mac OS 和 Linux 的 NetBeans。该软件可以与 Java 开发工具包（JDK）捆绑下载，也可以单独下载。你必须在计算机上安装\
  \ NetBeans 和 JDK。NetBeans 提供多个版本的包，请选择支持 Java SE 的那一个。\n\n### 注意\n在加载 NetBeans 网站时遇到困难？你可能正在尝试加载\
  \ [www.netbeans.org](http://www.netbeans.org)（该地址无法工作），而不是 [`netbeans.org`](https://netbeans.org)。\n\
  \n如果你想确保下载的与本书准备时使用的 NetBeans 和 JDK 版本相同，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。点击本书的封面打开该版本的网站，然后寻找“Download\
  \ JDK”和“Download NetBeans”链接。你将被引导至正确的站点。\n\n### 创建新项目\nJDK 和 NetBeans 以以安装向导的形式下载，用于在你的系统中设置软件。你可以可以在任何喜欢的文件夹和菜单组中安装软件，但除非你有充分的理由这样做，否则最好坚持默认设置选项。\n\
  \n在安装后首次运行 NetBeans 时，你会看到一个启动页，其中显示了指向演示和编程教程的链接（见图 A.1）。你可以使用 NetBeans 内置的网络浏览器在\
  \ IDE 中阅读这些内容。\n\n![Image](img/afig01.jpg)\n\n**图 A.1**\nNetBeans 用户界面。\n\n一个 NetBeans\
  \ 项目由一组相关的 Java 类、这些类使用的文件以及 Java 类库组成。每个项目都有自己的文件夹，你可以在 NetBeans 之外使用文本编辑器和其他编程工具对其进行探索和修改。\n\
  \n要开始新项目，点击图 A.1 所示的“New Project”按钮，或选择 `File, New Project` 菜单命令。新项目向导会打开，如图 A.2\
  \ 所示。\n\n![Image](img/afig02.jpg)\n\n**图 A.2**\n新项目向导。\n\nNetBeans 可以创建多种类型的 Java\
  \ 项目，但在本书中你可以专注于其中一种类型：Java Application（Java ）。\n\n对于你的第一个项目（以及书中的大部分项目），选择项目类型\
  \ Java Application 并点击 Next。向导要求你为项目选择名称和位置。\n\n`Project Location` 文本字段标识了你用 NetBeans\
  \ 创建的编程项目的根文件夹。在 Windows 上，这可能是你的 `My Documents`（或 `Documents`）文件夹下名为 `NetBeansProjects`\
  \ 的子文件夹。你创建的所有项目都存储在该文件夹内，每个项目都有自己的子文件夹。\n\n在 `Project Name` 文本字段中，输入 `Java24`。`Create\
  \ Main Class` 复选框随输入发生变化，推荐 `java24.Java24` 为项目中的主 Java 类名。将其更改为 `Spartacus` 并点击\
  \ Finish，接受所有其他默认值。NetBeans 会创建项目及其第一个类。\n\n### 创建新的 Java 类\n当 NetBeans 创建新项目时，它会设置所有必要的文件和文件夹并创建主类。图\
  \ A.3 显示了你项目中的第一个类 `Spartacus.java` 在源代码编辑器中打开。\n\n![Image](img/afig03.jpg)\n\n\
  **图 A.3**\nNetBeans 源代码编辑器。\n\n`Spartacus.java` 是一个精简的 Java 类，只包含一个 `main()` 方法。类中所有的浅灰色行都是解释该类目的和功能的注释。运行该类时，注释会被忽略。\n\
  \n要让新类执行某些操作，请在注释 `// TODO code application logic here` 下方的的新行中添加以下代码行：\n\n```\n\
  System.out.println(\"I am Spartacus!\");\n```\n\n`System.out.println()` 方法显示一段文本，在此情况下是句子“I\
  \ am Spartacus!”。\n\n确保你输入的内容与显示完全一致。在你确认输入行正确并以分号结尾后，点击“Save All”工具栏按钮（或菜单命令 `File,\
  \ Save All`）来保存该类。\n\n### 注意\n当你输入内容时，源代码编辑器会识别你正在做什么，并弹出与 `System` 类、`out` 实例变量以及\
  \ `println()` 方法相关的有用信息。你以后会很喜欢这种帮助功能，但现在请尽力忽略它。\n\nJava 类在运行之前必须编译成一种称为字节码（bytecode）的可执行格式。NetBeans\
  \ 会尝试自动编译类。你也可以通过两种方式手动编译此类：\n\n![Image](img/arrow.jpg) 选择菜单命令 `Run, Compile File`。\n\
  \n![Image](img/arrow.jpg) 在 Projects 格中右键点击 `Spartacus.java` 打开弹出菜单并选择 `Compile\
  \ File`。如果 NetBeans 不允许你选择这两个选项之一，说明它已经编译了该类。\n\n### 运行应用程序\n创建 Java 类 `Spartacus.java`\
  \ 并成功编译后，你可以通过两种方式在 NetBeans 中运行它：\n\n![Image](img/arrow.jpg) 从菜单选择 `Run, Run File`。\n\
  \n![Image](img/arrow.jpg) 在 Projects 格中右键点击 `Spartacus.java` 并选择 `Run File`。\n\n\
  当你运行 Java 类时，其 `main()` 方法会被 Java 虚拟机调用。字符串“I am Spartacus!”显示在 Output 格中，如图 A.4\
  \ 所示。\n\n![Image](img/afig04.jpg)\n\n**图 A.4**\nSpartacus 应用程序的输出。\n\nJava 类必须有一个\
  \ `main()` 方法才能运行。如果你尝试运行一个缺少该方法的类，NetBeans 会返回错误。\n\n\n\n\n\n当你完成对程序输出的审查后，点击窗格页签上的\
  \ X（标题为 Output – Java24 (run) 的地方）关闭输出（Output）面板。这将使源编辑器变得更大，从而显示更多行代码，这在你创建程序时非常有用。\n\
  \n### 修复错误\n\n现在 `Spartacus` 应用程序已经编写、编译并运行了，是时候通过故意搞坏一些东西，来体验一下当情况发生严重错误时 NetBeans\
  \ 是如何响应的。\n\n像任何程序员一样，你会有很多机会自己手搞砸事情，但尽管如此，还是务必注意这里。\n\n回到源代码编辑器中的 `Spartacus.java`，删除调用\
  \ `System.out.println()` 的那行末尾的分号（见列表 A.1 中的第 18 行）。甚至在保存文件之前，NetBeans 已经发现了该错误，并在行左侧显示了一个红色警报图标（见图\
  \ A.5）。\n\n![Image](img/afig05.jpg)\n\n**图 A.5**\n\n在源编辑器中标记错误。\n\n鼠标悬停在警报图标上，会弹出一个对话框，描述\
  \ NetBeans 认为它发现的错误。\n\nNetBeans 源编辑器可以识别你在编写 Java 程序时遇到的大多数常见编程错误和拼写错误。在错误修复之前，错误的检测会阻止文件的编译。\n\
  \n将分号加回行末。警报图标会消失，你可以再次保存并运行该类。\n\n这些基础功能就是你创建和编译本书书中 Java 程序所需的所有内容。\n\nNetBeans\
  \ 的功能远不止于此，但在深入学习 IDE 之前，你应该专注于学习 Java。将 NetBeans 当作一个简单的编程项目管理器和文本编辑器来使用。编写类、标记错误，并确保能够成功编译并运行每个项目。\n\
  \n当你准备好学习更多关于 NetBeans 的知识时，启动（Start）页提供了学习如何使用它的资源。Oracle 还在 [`netbeans.org/kb`](https://netbeans.org/kb)\
  \ 提供了培训和文档资源。\n\n## 附录 B\n\n#### 接下来去向哪里：Java 资源\n\n读完这本书后，你可能会想知道可以去哪里提升你的 Java\
  \ 编程技能。本附录列了一些你可以用来扩展 Java 知识的书籍、网站、互联网讨论站点和其他资源。\n\n### 其他值得考虑的书籍\n\nSams Publishing\
  \ 和其他出版商提供了几本实用的 Java 编程书籍，其中一些是对书中涵盖内容的后续读。如果书店目前没有你找的书，可以在书店使用这些 ISBN 号：\n\n![Image](img/arrow.jpg)\
  \ *Sams Teach Yourself Java in 21 Days*，Rogers Cadenhead 著（就是我！我！我！！），ISBN: 978-0-672-33795-6。虽然这本书前七章的部分内容是重复的，但它对\
  \ Java 的讲解更深入，并添加了许多高级主题。如果你准备好为学习 Java 再投入 504 小时的承诺，那么这应该是一本合适的书。\n\n![Image](img/arrow.jpg)\
  \ *Java Phrasebook*，Timothy R. Fisher 著。ISBN 0-67232-907-7。这是一份包含 100 多个代码片段的集合，供你自己的\
  \ Java 项目使用，由专业程序员和 *Java Developer’s Journal* 贡献编写。\n\n![Image](img/arrow.jpg)\
  \ *Agile Java Development with Spring, Hibernate and Eclipse*，Anil Hemrajani 著。ISBN\
  \ 0-672-3289-8。这是一本关于 Java 企业版的书籍，展示了如何使用 Spring 框架、Hibernate 库和 Eclipse IDE 来降低企业应用编程的复杂性。\n\
  \n![Image](img/arrow.jpg) *Android How to Program, 3rd Edition*，Paul and Harvey\
  \ Deitel 著。ISBN 0-13-444430-2。关于手机和平板 Android 编程的广泛介绍，已针对 Android 6 版本和 Android\
  \ Studio IDE 更新。读这本书的读者将学习如何创建八个应用。\n\n![Image](img/arrow.jpg) *Java 9 for Programmers,\
  \ 4th Edition*，Paul and Harvey Deitel 著。ISBN 978-0-134-77756-6。对 Java 9 的高级探索，包含了\
  \ lambda 表达式、Java 模块系统、动画、视频以及使用 JDBC 和 JPA 进行数据库编程。\n\n许多 Sams Publishing 的 Java\
  \ 书籍的章节和其他材料已在 [www.informit.com](http://www.informit.com) 免费开放，这是一个与 Sams 合作制作的面向信息技术专业人员的网站。\n\
  \nSams Publishing 网站 [www.informit.com/sams](http://www.informit.com/sams) 是查看 Sams\
  \ Publishing 以及 Pearson Technology Group 其他出版物新动态的好地方。\n\n### Oracle 官方 Java 站点\n\
  \nOracle 的 Java 软件部门维护着三个对程序员及其语言用户感兴趣的网站。\n\nJava 开发者技术网络（Oracle Technology Network\
  \ for Java Developers）发布于 [www.oracle.com/technetwork/java](http://www.oracle.com/technetwork/java)，是寻找\
  \ Java 相关信息的首选之地。这里可以下载新版本的 Java 开发工具包（JDK）和其他编程资源，以及整个 Java 类库的文档。这里还有一个错误数据库、本地面对面用户群目录以及支持论坛。\n\
  \n位于 [www.java.com](http://www.java.com) 的 Java.com 向消费者和非程序员推广该语言的益处。\n\n位于 [www.netbeans.org](http://www.netbeans.org)\
  \ 的 Planet NetBeans 是几十个关于 NetBeans 的博客集合，你可以使用 Feedly 等阅读器订阅它们的 RSS 馈。\n\n### Java\
  \ 类文档\n\nOracle 站点最实用的部分也许是 Java 类库中每个类、变量和方法的文档。成千上万的页面免费提供。\n\n要访问 Java 9 的类文档，请前往\
  \ [`download.java.net/jdk9/api`](http://download.java.net/jdk9/api)。\n\n### 其他 Java\
  \ 网站\n\n由于 Java 现象很大程度上源于其网页应用，大量的网站专注于 Java。\n\n#### 本书官方网站\n\n本书的官方网站为 [www.java24hours.com](http://www.java24hours.com)，并在附录\
  \ C “本书网站”中有详细介绍。\n\n### Workbench\n\n我还出版了一个博客 `Workbench`，涵盖了 Java、互联网技术、计算机书籍等主题以及其他内容。你可以在\
  \ [`workbench.cadenhead.org`](http://workbench.cadenhead.org) 找到它。\n\n### Slashdot\n\
  \n技术新闻站点 Slashdot 自 1997 年以来程序员和其他计算机行业专业人士的首选之地。该网站将用户提交的最佳故事放到首页，并允许用户对评论进行排名以过滤噪音。要查看最新的\
  \ Java 相关故事，请访问 [www.slashdot.org/tag/java](http://www.slashdot.org/tag/java)。\n\
  \n### 其他 Java 博客\n\n数百个其他博客涵盖 Java 编程，无论是作为其核心重点还是多样化主题的一部分。\n\nWordPress.Com 作为数千个博客的托管平台，将这些网站最新的\
  \ Java 相关帖子分类在 [`en.wordpress.com/tag/java`](https://en.wordpress.com/tag/java)。\n\
  \n在 Twitter 上，你可以通过搜索标签 #java 来定位 Java 博客和新闻，地址为 [`twitter.com/search?q=%23java`](https://twitter.com/search?q=%23java)。其中一些结果是关于咖啡或\
  \ Java 岛的，而不是编程语言。\n\n### InformIT\n\n\n\n\n\n技术参考网站 `InformIT` 可通过 [www.informit.com](http://www.informit.com)\
  \ 访问，由本书出版商提供的综合资源库。该网站设有几十个与软件开发和互联网相关的主题板块。InformIT 的 `Java` 板块包含实操文章和初学者指南。您可以直接访问\
  \ [www.informit.com/topics/topic.aspx?st=66497](http://www.informit.com/topics/topic.aspx?st=66497)\
  \ 进行访问。\n\n### Stack Overflow\n\n在线社区 `Stack Overflow` 是程序员可以提问并对其他用户提供的答案进行评分的地方。网站设有标签功能，你可以将搜索范围缩小到感兴趣的语言或主题。访问\
  \ [`stackoverflow.com/questions/tagged/java`](https://stackoverflow.com/questions/tagged/java)\
  \ 查看与 Java 相关的问题。\n\n### JavaWorld 杂志\n\n`JavaWorld` 是一本自 20 世纪 90 年代语言诞生以来一直存在的杂志，经常发布教程文章以及\
  \ `Java` 开发新闻和其他专题。此外还有视频和音频播客。访问 [www.javaworld.com](http://www.javaworld.com)。\n\
  \n### Developer.com 目录\n\n由于 `Java` 是一种面向对象的语言，因此很容易使用其他开发者创建的资源。在开始任何重要的 `Java`\
  \ 项目之前，你应该在网络上搜索可能用资源。一个很好的起点是 `Developer.com` 的 `Java` 目录。该网站列出了 `Java` 程序、资源和其他信息，访问\
  \ [www.developer.com/java](http://www.developer.com/java)。\n\n### Java 聚会\n\n`Meetup.com`\
  \ 网站包含了成千上万由寻求参加活动的用户分享的正式和非正式聚会。许多 `Java` 用户小组和其他 `Java` 活动在该网站上公布。要找到你所在地 100\
  \ 英里内的聚会，请访问 [www.meetup.com/find/?keywords=Java&radius=100](http://www.meetup.com/find/?keywords=Java&radius=100)。在我所在的地区，经常举办\
  \ `Java` 用户小组、开发者小组以及咖啡聚会。\n\n### 职业机会\n\n如果你是为了学习 `Java` 并成为行业精英计划，本书附录中的几个资源设有职业机会板块。你可以查看一些\
  \ `Java` 相关的职位空缺。招聘搜索引擎 `Indeed` 有一个关于 `Java` 工作的板块。访问 [www.indeed.com/q-Java-jobs.html](http://www.indeed.com/q-Java-jobs.html)\
  \ 查看程序员的最新招聘广告。另一个良好的 `Java` 程序员招聘网站是 `Dice`，它在 [www.dice.com/jobs?q=java](http://www.dice.com/jobs?q=java)\
  \ 列出招聘信息。虽然它不是专门的 `Java` 职业资源，但 `CareerBuilder` 网站允许你搜索超过两个两个数据库的招聘广告，包括报纸分类广告和许多其他来源。访问\
  \ [www.careerbuilder.com](http://www.careerbuilder.com)。\n\n如果你在阅读本书后获得了一份 `Java`\
  \ 编程工作，我很想听听你的。回到本书网站使用 `Feedback` 链接联系我，或者在 Twitter 上给 `@rcade` 发消息。\n\n## 附录 C\n\
