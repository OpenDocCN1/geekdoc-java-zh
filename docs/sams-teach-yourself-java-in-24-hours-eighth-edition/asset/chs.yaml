  \ Cadenhead\n\n## 附录 D\n\n### 解决 Android 模拟器问题\n\n自 2015 年发布以来，免费的 `Android Studio`\
  \ 集成开发环境（IDE）已成为创建 Android 应用的官方工具。在第 24 节中，你学习了如何使用此 IDE 用 `Java` 创建移动应用。\n\n如果你已经读了该章节并成功在\
  \ Android 模拟器中运行了程序，就不需要阅读此附录。但如果你根本无法让模拟器工作，你就来对地方了。\n\n### 运行程序的问题\n\n当你在 `Android\
  \ Studio` 中进行 Android 项目并想要运行程序时，可以选择菜单命令 `Run`。该命令会打开一个 `Choose Device` 对话框，要求选择执行程序的设备。如果设备通过\
  \ USB 线连接到你的电脑，它可以是真实的手机或平板电脑。设备也可以是 Android 模拟器。`Android Studio` 中的 Android 模拟器可以像运行移动操作系统的实际手机和平电脑。可以为多个\
  \ Android 设备设置虚拟设备。\n\n某些用户在首次用 `Android Studio` 中的模拟器运行 Android 应用时遇到问题。模拟器会带有这条不详的消息崩溃：\n\
  \noutput ![Image](img/arrow1.jpg) 点击此处查看代码图像 ：x86 仿真目前需要硬件加速！请确保已正确安装并可以使用 Intel\
  \ HAXM。CPU 加速状态：HAX 内核模块未安装！\n\n此错误发生在 Windows 电脑上，表示它们需要一个来自 Intel 的名为硬件加速执行管理器（HAXM）的硬件加速程序才能工作。程序可以通过\
  \ `Android Studio` 下载，但你必须在 IDE 外安装它。\n\nHAXM 只安装在带有 Intel 处理器的电脑上。此附录解决了 `Android\
  \ Studio` 指出需要 HAX 来运行 Android 模拟器的问题。如果模拟器报错信息中没有提到 HAXM，请不要使用此附录来修复。\n\n### 在\
  \ Android Studio 中安装 HAXM\n\n在你运行 `Android Studio` 时，可以下载 HAXM 并将其添加到 Android SDK。点击\
  \ `Android Studio` 工具栏中的 `SDK Manager` 按钮，如图 D.1 所示。\n\n\n\n\n\n![Image](img/dfig01.jpg)\n\
  \n**图 D.1**\n\n运行 Android SDK Manager。\n\nSDK Manager 用于通过其他版本的 Android 和实用的 SDK\
  \ 工具来增强 SDK。点击 `SDK Tools` 选项卡将其置于顶层。\n\nSDK 可用工具将列出来，你已安装的工具旁边会有一个勾选标记。寻找 `Intel\
  \ x86 Emulator Accelerator (HAXM Installer)` 这一项。\n\n如果该项旁边没有勾选标记，说明它尚未被添加到你的 Android\
  \ Studio 版本中的 Android SDK 中。（如果有勾选标记，则它已经安装，此时你应该继续进行下一节“在你的电脑上安装 HAXM”。）\n\nAndroid\
  \ SDK Manager 如图 D.2 所示。\n\n![Image](img/dfig02.jpg)\n\n**图 D.2**\n\n添加 SDK 工具。\n\
  \n选择 `Intel x86 Emulator Accelerator (HAXM Installer)` 并点击 `OK`。系统将要求你确认此更改。点击 `OK`。\n\
  \nAndroid Studio 将下载 `HAXM` 并报告其进度。如果安装正确，你就可以进行下一步，在你的电脑上安装它。\n\n### 在你的电脑上安装 HAXM\n\
  \n要开始在电脑上设置 `HAXM`，请先关闭 Android Studio。\n\n在你的文件系统中，找到你告诉 Android Studio 安装向导存储\
  \ Android SDK 的文件夹。\n\n如果你不记得把它放在哪里了，Windows 默认设置是将 SDK 放在你个人用户文件夹下名为 `AppData\\\
  Local\\Android\\sdk` 的子文件夹中。因此如果你的 Windows 用户名是 `Catniss`，建议的 SDK 位置是 `\\Users\\\
  Catniss\\AppData\\Local\\Android\\sdk`。\n\n如果你在电脑上找到了 SDK 文件夹，打开该文件夹，然后打开子文件夹 `extras\\\
  intel\\Hardware_Accelerated_Execution_Manager`。\n\n该文件夹包含一个名为 `intelhaxm-android.exe`\
  \ 的程序。这就是 `HAXM` 安装程序。\n\n`HAXM` 需要配备 Intel 器的电脑、1G 磁盘空间以及 Windows 7 或更高版本，或者 64\
  \ 位的 Mac OS X 10.8 到 10.11 版本。该文件夹中一个名为 `Release Notes.txt` 的文本文件包含了软件要求的详细信息。\n\
  \n在查看发布说明文件后，如果你准备好安装 `HAXM`，请运行程序 `intelhaxm-android.exe`。安装程序将检查你的电脑是否可以运行 `HAXM`，如果不能运行将退出。\n\
  \n在安装过程中，系统会询问允许 `HAXM` 使用多少内存。默认值 `2G` 应该足够了。完成安装。\n\n**提示**\n\n如果你以后决定为 `HAXM`\
  \ 分配的内存过多或过少，可以通过再次运行安装程序来更改此设置。\n\n一旦 `HAXM` 安装完成，你应该重启电脑。\n\n完成后，加载 Android Studio\
  \ 并通过选择 `Run`、`Run App` 再次尝试运行你的 Android 应用程序。\n\n该程序将在模拟器中运行。Android 模拟器看起来像手机手机，在加载时会显示“Android”启动屏幕，然后运行程序。图\
  \ D.3 显示了 `SalutonMondo` 应用程序成功运行时的样子。\n\n![Image](img/dfig03.jpg)\n\n**图 D.3**\n\
  \n成功！模拟器加载并运行了应用程序。\n\n如果运行成功，你就可以回到第 24 节 了。\n\n如果失败并出现相同的错误信息，要求你“确保 Intel HAXM\
  \ 已正确安装并可用”，那么还有一点你可以检查。然而，这需要检查你电脑的 BIOS 设置并对其进行更改。\n\n### 检查 BIOS 设置\n\n为了让 `HAXM`\
  \ 工作，你电脑的 BIOS 设置中必须启用 `Intel Virtualization Technology`（Intel 虚拟化技术）。如果你习惯修改 BIOS，这是一个非常容易检查和更改的项目。\n\
  \n由于更改 BIOS 可能会影响电脑的启动方式——甚至导致其无法启动 Windows——因此只有在你以前修改过电脑 BIOS 的情况下才应该尝试调整 BIOS。否则，你应该寻求专家的帮助，让他们引导你完成整个过程。\n\
  \nBIOS 是在你打开 Windows 电脑时控制电脑的软件，负责启动电脑和其他必要的硬件功能。\n\n当你的电脑启动时，你会简短看到一条关于按下某个功能键以检查\
  \ BIOS 设置的消息。\n\n如果你不按该键，BIOS 将完成其工作并加载 Windows。\n\n如果你确实按了该键，你会看到类似图 D.4 所示的屏幕。\n\
  \n![Image](img/dfig04.jpg)\n\n**图 D.4**\n\n查看电脑的 BIOS 设置。\n\n你电脑的 BIOS 主菜单看起来可能与图\
  \ D.4 不同。它取决于你的电脑制造商以及它使用的 BIOS 版本。\n\n在我的 Dell 台式桌面电脑上，我通过选择 `BIOS Setup`、`Advanced`、`Processor\
  \ Configuration` 来发现是否启用了 `Intel Virtualization Technology`。会列出一个处理器设置列表，每项旁边都有“[[Enabled]”或“[[Disabled]]”。你可以在这些设置之间进行切换。\n\
  \n如果你在 BIOS 中启用 `Intel Virtualization Technology` 并保存更改，你的电脑应该就能运行 `HAXM`，模拟器问题也应该得到解决。\n\
  \n##附录 E：解决 NetBeans 中包不可可见的错误\n\nJava 9 引入的最有趣的功能之一是模块（modules），它们允许 Java 程序标明它们使用了\
  \ Java 类库的哪些部分。\n\n### 添加模块信息\n\nJava 类库包含数百个包。其中一小部分只有在添加了相应的模块后才可用。如果你尝试 `import`\
  \ 一个位于可用模块中的类或类组，`import` 语句将导致错误。\n\n模块是在名为 `module-info` 的 Java 类中设置的（也就是说，一个完全没有\
  \ `package` 语句的类）。\n\n```java\nmodule Java24 {\n    requires jdk.incubator.httpclient;\n\
  }\n```\n\n\n\n\n\n在 `{` 和 `}` 波浪括号内的 `module` 块中，`requires` 关键字后面跟着模块名 `jdk.incubator.httpclient`。如果你的项目需要不同的模块，请编辑此语句以反映。\n\
  \n一个项目可以有多个 `requires` 语句。\n\n当保存 `module-info.java` 文件后，模块（或多个模块）中的类就可以被项目中的任何\
  \ Java 程序使用。添加该模块中包的 `import` 语句不会报错，程序可以被编译和运行。\n\n## 索引\n\n### 符号\n\n- `+`（加法运算符），60\n\
