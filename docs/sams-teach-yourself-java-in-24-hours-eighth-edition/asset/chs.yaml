  \n![Image](img/16fig02.jpg)\n\n**图 16.2**\n\n使用 KeyViewer 应用程序监控键盘输入。\n\n匿名内部类不能定义构造函数，因此它们比非匿名内部类局限。它们是语言的一项复杂特性，在检查程序源码时较难理解，但它们可以使程序更加简洁。丰富的\
  \ Java 程序员经常使用它们。\n\n### 闭包\n\n下一节引入了备受期待的特性：闭包。闭包也被称为 lambda 表达式，允许代码引用另一个方法的变量。\n\
  \n这里是一个示例：\n\n```java\nRunnable runner = () -> {\n    System.out.println(\"Run\"\
  );\n};\n```\n\n在上面的示例中，`Runnable` 接口只有一个方法。由于 `run()` 不接受任何参数，因此表达式中的参数为空：\n\n```java\n\
  Runnable runner = () -> System.out.println(\"Run\");\n```\n\n这等同于以下代码：\n\n```java\n\
  Runnable runner = new Runnable() {\n    public void run() {\n        System.out.println(\"\
  Run\");\n    }\n};\n```\n\n箭头右边的 lambda 表达式定义了方法。在下面的示例中，接口有一个参数：\n\n```java\nActionListener\
  \ listener = (event) -> {\n    System.out.println(event.getSource());\n};\n```\n\
  \n这等同于以下代码：\n\n```java\nActionListener listener = new ActionListener() {\n    public\
  \ void actionPerformed(ActionEvent event) {\n        System.out.println(event.getSource());\n\
  \    }\n};\n```\n\n`ActionListener` 接口接收动作事件，例如用户点击按钮时。参数是一个 `ActionEvent` 对象，描述了触发事件的用户动作。lambda\
  \ 表达式的右半定义了 `actionPerformed()` 方法，其为单个语句，显示触发事件的用户组件的信息。\n\n表达式的左半声明了名为 `act` 的\
  \ `ActionEvent` 对象是方法的参数：\n\n```java\nActionListener listener = (act) -> {\n   \
  \ System.out.println(act.getSource());\n};\n```\n\n这等同于 `java.awt.event` 包中的以下代码：\n\
  \n```java\nActionListener listener = new ActionListener() {\n    public void actionPerformed(ActionEvent\
  \ act) {\n        System.out.println(act.getSource());\n    }\n};\n```\n\n如你所示，lambda\
  \ 表达式的作用之一是缩短代码。单个表达式就可以创建一个对象并实现一个接口。Java 的这一特性可以通过语言对目标类型（target typing）的支持使代码更短。\n\
  \n在 lambda 表达式中，可以推断发送给方法的参数或多个参数的类。考虑最后一个示例。由于 `ActionListener` 函数式接口有一个接受 `ActionEvent`\
  \ 对象作为唯一参数的方法，因此可以省略该类的名称。\n\n考虑到这一点，这是该 lambda 表达式修改后的版本：\n\n```java\nActionListener\
  \ listener = (act) -> {\n    System.out.println(act.getSource());\n};\n```\n\n\n\
