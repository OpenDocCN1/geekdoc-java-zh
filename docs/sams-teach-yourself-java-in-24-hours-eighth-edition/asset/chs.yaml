  \nLambda 表达式支持函数式编程，这是一种软件设计方法，直到目前 Java 程序员还无法使用这种方法。本节介绍了 Lambda 表达式的基本语法以及它们在程序中应用的两种常用方式。但\
  \ Java 中的函数式编程是一个如此强大且具有革命性的主题，足以成为一整本书的主题。到目前，你应该能够识别 Lambda 表达式并使用它们来实现任何单方法接口（也称为函数式接口）。\n\
  \n### 总结\n\n内部类、匿名内部类和 Lambda 表达式是 Java 语言中学习起来最复杂的部分。它们主要吸引那些使用该语言编写了一段时间程序的程序员，这些程序员可以利用强大的特性用更少的代码行完成更多工作。\n\
  \n但在你编写自己的 Lambda 表达式之前，你应该能够从内部类和匿名内部类中受益。\n\n非匿名内部类的结构类似于独立的辅助类，但它位于另一个类内部，与实例变量、类变量、实例方法和类方法并列。与辅助类不同，它可以访问其所在类的私有变量和方法。\n\
  \n匿名内部类避免了为仅使用一次的类分配对象，例如连接到用户界面的事件监听器。\n\nLambda 表达式的外表非常简单，只需要一个箭头运算符 `->` 即可创建。但它们为\
  \ Java 程序员实现的功能是巨大的。\n\n### 练习\n\n#### 问答\n\n**Q:** 匿名内部类很很难理解。我必须在程序中使用它们吗？\n\n\
  **A:** 不需要。和 Java 的其他复杂功能一样，如果你可以通过其他方式完成任务，就不需要使用它们。但你仍然应该学习它们，因为你会在 Java 代码中遇到它们。当你查看经验丰富的程序员编写的\
  \ Java 程序时，经常发现内部类和匿名内部类。所以，即使你还没有准备好自己创建它们，了解它们以及如何运作也是有意义的。\n\n**Q:** 哈菲尔和麦科伊家族还在斗争吗？\n\
  \n**A:** 在这场著名的 35 年冲突最后一次伤亡发生 126 年后，西弗吉尼亚州和肯基州的这两个家族的关系良好。1979 年，哈菲尔和麦科伊一起参加了电视游戏节目《家庭对抗》（Family\
  \ Feud），并持续了一周。一只猪被留在舞台上并颁给了获胜的家庭。2003 年，这两个家族在肯塔基州的派克签署了一份正式的和平协议。\n\n### 测验\n\n\
  \n\n为了判断你是否已经掌握了本小时的知识并可以上台回答，请回答以下关于内部类、匿名内部类和 lambda 表达式的问题。\n\n1. **什么使得某些内部类是匿的？**\n\
  \nA. 它们实现了一个接口。\nB. 它们没有被命名。\nC. 两者都是。\n\n2. **仅包含一个方法的接口另一个名称是什么？**\n\nA. 抽象接口\n\
  B. 类\nC. 函数式接口\n\n3. **lambda 表达式猜测方法参数的类称作为什么？**\n\nA. 目标类型推 (Target typing)\n\
  B. 类型转换\nC. 类推断\n\n#### 答案\n\n1. **C.** 匿名内部类使用 `new` 关键字实现接口，跳过了实现该接口的类的创建和命名过程。\n\
  \n2. **C.** 从 Java 8 开始，被称为函数式接口。在语言的早期版本中，它们被称为单抽象方法接口。\n\n3. **A.** 目标类型推可以推断任何函数接口方法参数的类。\n\
