  \ 18.7。界面被分为四个水平行，图中用水平线隔开。每一行都是一个 `JPanel` 对象，应用程序的整体布局管理器将这些行组织成一个四行一列的 `GridLayout`。\n\
  \n![Image](img/18fig07.jpg)\n\n**图 18.7：将 LottoMadness 应用程序分为面板。**\n\n在行内部，使用了不同的布局管理器来确定组件的显示。第\
  \ 1 行和第 3 行使用 `FlowLayout` 对象。程序的第 47–48 行展示了如何创建它们：\n\n```\nFlowLayout layout1\
  \ = new FlowLayout(FlowLayout.CENTER, 10, 10);\n```\n\n`FlowLayout()` 构造函数使用了三个参数。第一个参数\
