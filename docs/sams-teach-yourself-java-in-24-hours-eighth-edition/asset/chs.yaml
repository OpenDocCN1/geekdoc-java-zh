  # 第 8 小时：使用循环重复操作\n\n### 本小时的任务列表：\n\n![Image](img/arrow.jpg) 使用 `for` 循环。\n\n![Image](img/arrow.jpg)\
  \ 使用 `while` 循环。\n\n![Image](img/arrow.jpg) 使用 `do`-`while` 循环。\n\n![Image](img/arrow.jpg)\
  \ 提前退出循环。\n\n![Image](img/arrow.jpg) 为循环命名。\n\n学生最令人苦恼的惩罚之一是让他们在黑板上反复写某些东西。在《辛普森一家》中，在一次经常去黑板的某次经历中，巴特·辛普森必须写几十次“我再也不问圣诞老人什么时候上厕所了”。这种惩罚对孩子可能有效，但对计算机来说完全没用。\n\
  \n计算机可以重复执行某项任务。\n\n循环让计算机程序返回同一个地方执行多次。\n\nJava 中有三种循环语句：`for`、`do` 和 `while`。有些循环运行固定次数，而有些则会无限运行。\n\
  \n循环是程序用来重复执行某些操作的工具。\n\n在编程中，你可以发现很多可以使用循环的场景。循环都可以工作，但了解它们是如何运作的是有益的。\n\n### `for`\
  \ 循环\n\n在编程中，你会发现很多可以使用循环的场景。你可以使用它们来重复执行某些操作，例如每分钟移动一次时针。\n\nJava 最复杂的循环语句是 `for`。`for`\
  \ 循环以固定次数执行程序部分。看这里：\n\n点击此处查看图像\n\n```java\nfor (int dex = 0; dex < 1000; dex++)\
  \ {\n  if (dex % 12 == 0) {\n    System.out.println(\"#: \" + dex);\n  }\n}\n```\n\
  \n这个循环显示 0 到 999 之间所有能 12 整除的数字。\n\n`for` 循环有一个决定循环何时开始和结束的变量。这个变量被称为计数器（*索引*）。前面的循环中的计数器是变量\
  \ `dex`。\n\n`for` 循环在 `for` 关键字后的括号内有三个部分：初始化、条件和变化部分。这些部分用分号隔开。示例说明了这三个部分：\n\n\
  ![Image](img/arrow.jpg) 初始化部分——在第一部分，变量 `dex` 被赋予了初始值 0。\n\n![Image](img/arrow.jpg)\
  \ 条件部分——在第二部分，有一个可能你在 `if` 语句中使用的条件测试：`dex < 1000`。\n\n![Image](img/arrow.jpg) 变化部分——第三部分是改变\
  \ `dex` 变量值的语句，在本例中使用增增运算符。\n\n在初始化部分，你设置计数器变量。你可以在 `for` 语句中创建变量，正如前面的示例使用整数变量\
  \ `dex` 所示。你也可以在程序的其他地方创建变量。该变量在循环开始时具有这个值。\n\n条件部分包含一个必须保持为 `true` 循环才能继续测试。当测试为\
  \ `false` 时，循环结束。在本例中，当 `dex` 变量等于或大于 1,000 时循环结束。\n\n\n\n\n`for`语句的最后部分包含一个改变计数器变量值的语句。该语句在每次循环执行时都会处理。计数器必须以某种方式发生变化，否则循环将永远不会。在示例中，`dex`\
  \ 在变化部分被增加了 1。如果 `dex` 不发生变化，它将保持原始值 0 不变，而条件 `dex < 1000` 将始终为真。\n\n`for` 语句的块在循环的每次遍历中都会被执行。\n\
  \n上一个示例在 `for` 块内部包含以下语句：\n\n点击此处查看代码图片\n\n```\nif (dex % 12 == 0) {\n    System.out.println(\"\
  #: \" + dex);\n}\n```\n\n这些语句被执行了 1,000 次。循环通过将 `dex` 变量设置为 0 开始。在循环的每次通过中，它将 `dex`\
  \ 加 1。当 `dex` 不再小于小于 1,000 时，循环停止。\n\n### 注意事项\n\n在提到循环时，你可能会听到一个特殊的术语是“迭代”（iteration）。一次迭代是指循环的单次遍历。用于控制循环的计数变量被称为“迭代器”（iterator）。\n\
  \n正如你在 `if` 语句中看到的那样，如果 `for` 循环只包含一条语句，则不需要括号。下例所示所示：\n\n点击此处查看代码图片\n\n```\nfor\
  \ (int p = 0; p < 500; p++)\n    System.out.println(\"I will not sell miracle cures\"\
  );\n```\n\n此循环将显示“I will not sell miracle cures”这段文本 500 次。虽然循环内部的单一语句不需要括号，但你可以使用括号使代码块更容易识别，如下：\n\
  \n点击此处查看代码图片\n\n```\nfor (int p = 0; p < 500; p++) {\n    System.out.println(\"\
  I will not sell miracle cures\");\n}\n```\n\n你在此小时内创建的第一个程序将显示前 200 个 9 的倍数：9、18、27\
  \ 等，以此此类推，直到 1,800（9 × 200）。在 NetBeans 中，在 `com.java24hours` 包中创建一个名为 `Nines` 的空\
  \ Java 文件，并输入列表 8.1 中的文本。当你保存文件时，它被存储为 `Nines.java`。\n\n**列表 8.1 `Nines.java` 的完整文本**\n\
  \n点击此处查看代码图片\n\n```\n1: package com.java24hours;\n2:\n3: class Nines {\n4:     public\
  \ static void main(String[] arguments) {\n5:         for (int dex = 1; dex <= 200;\
  \ dex++) {\n6:             int multiple = 9 * dex;\n7:             System.out.print(multiple\
  \ + \" \");\n8:         }\n9:     System.out.println();\n10:     }\n11: }\n```\n\
  \n`Nines` 程序在第 5 行包含一个 `for` 语句。该语句有三个部分：\n\n![Image](img/arrow.jpg) 初始化—`int dex\
  \ = 1`，创建了一个名为 `dex` 的整数变量并赋予它一个初始值 1。\n\n![Image](img/arrow.jpg) 条件—`dex <= 200`，在循环的每次遍历中必须为真。当它不再为真时，循环结束。\n\
  \n![Image](img/arrow.jpg) 变化—`dex++`，在循环的每次遍历中将 `dex` 变量加 1。\n\n在 NetBeans 中选择 Run、Run\
  \ File 来运行程序。程序产生如图 8.1 所示的输出。\n\n![Image](img/08fig01.jpg)\n\n**图 8.1**\n\nNines\
  \ 程序的输出。\n\nNetBeans 中的输出窗口不会自动换行，因此所有数字都显示在同一行。要使文本换行，请在 Output（输出）窗格的任何位置点击右键，并从弹出菜单中选择\
  \ Wrap Text（自动换行）。\n\n### `while` 循环\n\n`while` 循环比 `for` 循环简单。它唯一需要的是随 `while`\
  \ 语句的条件测试，如下代码所示：\n\n点击此处查看代码图片\n\n```\nint gameLives = 3;\n\nwhile (gameLives >\
  \ 0) {\n    // 循环内部的语句\n}\n```\n\n`while` 循环将持续直到 `gameLives` 不再大于 0。正如你在 `if` 语句中看到的那样，如果\
  \ `for` 循环只包含一条语句，则不需要括号。下例所示：\n\n点击此处查看代码图片\n\n```\nfor (int p = 0; p < 500; p++)\n\
  \    System.out.println(\"I will not sell miracle cures\");\n```\n\n### `do-while`\
  \ 循环\n\n`do-while` 循环与 `while` 循环类似，但条件测试是在循环语句之后进行的。在 `do-while` 循环中，即使条件第一次为假，语句也会至少执行一次。\n\
  \n以下是 `do-while` 循环的示例：\n\n点击此处查看代码图片\n\n```\nint limit = 5;\nint count = 1;\n\n\
  do {\n    System.out.println(\"I will not sell miracle cures\");\n    count++;\n\
  } while (count < limit);\n```\n\n### 退出循环\n\n退出循环的正常方法是测试条件变为假。这对于 Java 中所有类型的循环都适用。有时你可能希望立即结束循环，即使测试的条件仍然为真。你可以通过\
  \ `break` 语句来实现，如下所示：\n\n点击此处查看代码图片\n\n```\nint index = 0;\n\nwhile (index <= 1000)\
  \ {\n    index = index + 5;\n    if (index == 400) {\n        break;\n    }\n}\n\
  ```\n\n\n\n另一个可以在循环内部使用的特殊情况语句是 `continue`。`continue` 语句会导致循环退出当前的迭代，并从循环的第一条语句重新开始。请考虑以下代码：\n\
  \n点击此处查看代码图片\n\n```java\nint index = 0;\n\nwhile (index <= 1000) {\n    index =\
  \ index + 5;\n    if (index == 400) {\n        continue;\n    }\n    System.out.println(\"\
  The index is \" + index);\n}\n```\n\n在这个循环内部，除非 `index` 的值等于 400，否则语句都会被正常处理。在这种情况下，`continue`\
  \ 语句会导致循环返回到 `while` 语句，而不是正常地执行到 `System.out.println()` 语句。由于 `continue` 语句的存在，循环永远不会显示以下文本：\n\
  \nThe index is 400\n\n你可以在所有类型的循环中使用 `break` 和 `continue` 语句。\n\n`break` 语句允许你在程序中创建一个设计为无限运行的循环，例如例所示：\n\
  \n点击此处查看代码图片\n\n```java\nwhile (true) {\n    if (quitKeyPressed == true) {\n   \
  \     break;\n    }\n}\n```\n\n这个示例假设程序的其他部分会有操作使 `quitKeyPressed` 变量等于 `true`。在发生这种情况之前，`while`\
  \ 循环将一直无限循环下去——因为它的条件始终等于 `true`，且这永远不会改变。\n\n### 为循环命名\n\n与 Java 程序中的其他语句一样，循环可以放置在其他循环内部。以下显示了\
  \ `while` 循环内部的 `for` 循环：\n\n点击此处查看代码图片\n\n```java\nint points = 0;\nint target\
  \ = 100;\n\nwhile (target <= 100) {\n    for (int i = 0; i < target; i++) {\n  \
  \      if (points > 50) {\n            break;\n        }\n        points = points\
  \ + i;\n    }\n}\n```\n\n在这个示例中，如果 `points` 变量大于 50，`break` 语句会导致 `for` 循环结束。然而，`while`\
  \ 循环永远不会结束，因为 `target` 永远不会大于 100。\n\n在某些情况下，你可能同时跳出多个循环。为了实现这一点，你必须给外层循环（在本示例中是\
  \ `while` 语句）起一个名字。要为循环命名，在循环开始之前的一行写上名称，并在后面跟一个冒号（`:`）。\n\n当循环有了名称后，在 `break` 或\
  \ `continue` 语句之后使用该名称，指示 `break` 或 `continue` 语句适用于哪个循环。接下来的示例重复了上一个，但有一点不同：如果\
  \ `points` 变量大于 50，两个循环都会结束。\n\n点击此处查看代码图片\n\n```java\nint points = 0;\nint target\
  \ = 100;\ntargetLoop:\n\nwhile (target <= 100) {\n    for (int i = 0; i < target;\
  \ i++) {\n        if (points > 50) {\n            break targetLoop;\n        }\n\
  \        points = points + i;\n    }\n}\n```\n\n当循环的名称被用于 `break` 或 `continue` 语句时，该名称不包含冒号。\n\
  \n### 复杂的 `for` 循环\n\n`for` 循环可以比本节在此为止展示的更复杂。循环的初始化、条件和变化部分可以包含多个一个变量。`for` 循环可以在初始化部分设置多个变量，并在变化部分包含多条语句，如下代码所示：\n\
  \n点击此处查看代码图片\n\n```java\nint i, j;\nfor (i = 0, j = 0; i * j < 1000; i++, j += 2)\
  \ {\n    System.out.println(i + \" * \" + j + \" = \" + (i * j));\n}\n```\n\n在 `for`\
  \ 循环中用分号（`;`）隔开的每个部分中，都使用逗号来分隔变量，例如 `i = 0, j = 0`。示例循环显示了一个方程列表，其中 `i` 和 `j` 变量被相乘。在每次循环迭代中，`i`\
  \ 变量增加 1，`j` 变量增加 2。当 `i` 乘以 `j` 等于或大于 1,000 时，循环结束。\n\n`for` 循环的部分也可以是空的。一个例子是循环的计数器变量已经在程序的其他部分用初始值创建了，如下文所示：\n\
  \n点击此处查看代码图片\n\n```java\nint displayCount = 1;\nint endValue = 13;\n\nfor ( ; displayCount\
  \ < endValue; displayCount++) {\n    // loop statements would be here\n}\n```\n\n\
  ### 测试你的计算机速度\n\n本小时的下一个项目是一个 Java 程序，用于执行基准测试（benchmark），这是一种衡量计算机硬件或软件运行速度快慢测试。`Benchmark`\
  \ 程序使用循环语句反复执行以下数学表达式：\n\n`double x = Math.sqrt(index);`\n\n该语句调用 `Math.sqrt()`\
  \ 方法来计算数字的平方根。你将在第 11 节“描述你的对象是什么样的”中学习更多关于方法的知识。\n\n你正在创建的基准测试计算 Java 程序在一分钟内可以计算多少次平方根。\n\
  \n使用 NetBeans 在 `com.java24hours` 包中创建一个名为 `Benchmark` 的新空 Java 文件。输入列表 8.2 的文本并在完成后保存程序。\n\
  \n**列表 8.2** `Benchmark.java` 的完整源代码**\n\n点击此处查看代码图片\n\n```java\n1: package com.java24hours;\n\
  2:\n3: class Benchmark {\n4:     public static void main(String[] arguments) {\n\
  5:         long startTime = System.currentTimeMillis();\n6:         long endTime\
  \ = startTime + 60000;\n7:         long index = 0;\n8:         while (true) {\n\
  9:             double x = Math.sqrt(index);\n10:            long now = System.currentTimeMillis();\n\
  11:            if (now > endTime) {\n12:                break;\n13:            }\n\
  14:            index++;\n15:        }\n16:        System.out.println(index + \"\
  \ loops in minute.\");\n17:    }\n18: }\n```\n\n在程序中发生了以下情况：\n\n5：`startTime` 变量创建为当前时间，通过调用\
  \ `currentTimeMillis()` 方法。\n\n6：`endTime` 变量创建为 `startTime` 加 60,000。由于一分钟等于 60,000，这设置了\
  \ `startTime` 之后的一分钟。\n\n7：`long` 类型变量 `index` 被创建。\n\n8：`while` 语句使用 `true` 作为条件开始循环，导致循环无限持续（换句话说，直到某些事情停止它）。\n\
  \n9：计算 `index` 的平方根并存储在变量 `x` 中。\n\n10：使用 `currentTimeMillis()` 创建变量 `now` 获取当前时间。\n\
  \n11-13：如果 `now` 大于 `endTime`，这意味着循环已经运行了一分钟，`break` 结束 `while` 循环。否则，它继续循环。\n\n\
  14：在每次循环迭代中，`index` 变量增加 1。\n\n16：在循环之外，程序显示执行平方根计算的次数。\n\n应用程序的输出显示在图 8.2 的输出面板中。\n\
  \n![Image](img/08fig02.jpg)\n\n**图 8.2**\n\nBenchmark 程序的输出。\n\n`Benchmark` 程序是一个查看你的计算机是否比我的极极方法。在测试此程序期间，我的笔记本电脑执行了大约\
  \ 119 亿次计算。如果你的计算机有更好的结果，不要只给我送哀。多买买我的书，这样我就可以升级我的电脑。\n\n### 总结\n\n\n\n\n循环是大多数编程语言的基础组成部分。通过顺序显示多个图形来创建动画，是你如果没有使用循环在\
  \ Java 或任何其他编程语言中无法完成的的任务之一。\n\n巴特·辛普（Bart Simpson）在黑板上的所有惩罚在网络上都有记录。访问 [`simpsons.wikia.com/wiki/List_of_chalkboard_gags`](http://simpsons.wikia.com/wiki/List_of_chalkboard_gags)\
  \ 查看该列表。\n\n### 工作坊\n\n#### 问答\n\n**Q. “初始化”（initialization）一词在多个地方都有。它是什么意思？**\n\
  \n**A.** 它是给某个东西一个初始值并对其进行设置。当你创建一个变量并给它分配一个起始值时，你正在初始化该变量。\n\n**Q. 如果循环永不结束，程序如何停止运行？**\n\
  \n**A.** 通常在循环不结束的程序中，程序中的其他部分会被设置为以某种方式停止执行。例如，游戏程序中的循环可以在玩家仍有生命值时持续进行。\n\n在编写程序时，经常出现的一个错误是无限循环，即由于编程错误导致循环永不停止。如果你运行的\
  \ Java 程序卡在无限循环中，请点击输出面板左侧的红色警报图标。\n\n**Q. 我如何购买绿湾帕克队（Green Bay Packers）的股票？**\n\
  \n**A.** 除非这家公有的 NFL 球队决定进行另一次股票出售，否则成为股东的唯一方法是通过遗嘱继承股份。\n\n帕克队分别在 1923 年、1935 年、1950\
  \ 年、1997 年和 2011 年售过股票。尽管与股票相关的权利非常有限，但仍有约 36 万人拥有该队的 500 万股股份。\n\n持有者无法获得股息，也无法通过股票获利。他们只能将股票卖回给球队并在交易中亏损。任何个人拥有的股票不能超过\
  \ 200,000 股。\n\n他们确实获得独家球队商品优惠，并参加年度会议以选举管理球队的七成员董事会。\n\n在形成特许经营权的 1923 年股票出售中，1,000\
  \ 名粉丝以每股 5 美元元的价格购买了股份。2011 年的出售为兰博球场（球队的主场）的升级筹集了 6700 万美元。\n\n关于股票的更多信息可以在网络上的\
  \ [www.packers.com/community/shareholders.html](http://www.packers.com/community/shareholders.html)找到。\n\
  \n### 测验\n\n以下问题将测试你对循环的理解。本本主题的精神，请重复这些每个问题直到你答对为止。\n\n**1.** 必须使用什么来分隔 `for` 语句的每个部分？**\n\
  \n**A.** 逗号\n**B.** 分号\n**C.** 下班的警察人员\n\n**2.** 哪条语句会导致程序回到开始循环的语句并从那里继续执行？**\n\
  \n**A.** `continue`\n**B.** `next`\n**C.** `skip`\n\n**3.** Java 中哪种循环语句始终至少运行一次？**\n\
  \n**A.** `for`\n**B.** `while`\n**C.** `do-while`\n\n#### 答案\n\n**1. B.** 逗号用于分隔部分内的内容，但分号用于分隔部分。\n\
  \n**2. A.** `break` 语句完全结束循环，而 `continue` 跳过到循环的下一次迭代。\n\n**3. C.** `do`-`while`\
  \ 条件在第一次通过循环之后才会被求值。\n\n#### 活动\n\n如果你的头没有因为这些循环而转圈的话，请通过以下活动复习本小时的主题：\n\n![Image](img/arrow.jpg)\
