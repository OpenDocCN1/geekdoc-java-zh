  \ arguments) {\n67:        new Battlepoint();\n68:    }\n69: }\n```\n\n`Battlepoint`\
  \ 应用中的注释描述了构造函数的每个部分以及程序中条件逻辑的重要部分。\n\n该应用程序创建了三个 `Point` 对象作为目标，并将它们添加到数组中（第 45–52\
  \ 行）。会显示一张地图，列出这些目标（第 22–43 行）。\n\n接下来，通过调用 `shoot(int, int)` 方法对三个点进行射击（第 54–64\
  \ 行）。每次调用，应用程序都会报告射击是否击中了某个目标。如果命中了，该目标将从列表中移除。\n\n最后，再次显示地图，应用程序终止。\n\n输出结果所示于图\
  \ 13.1。\n\n![Image](img/13fig01.jpg)\n\n**图 13.1**\n\n将 `Point` 对象放入数组列表中并对其进行射击。\n\
  \n三个目标在图 13.1 顶部的地图中显示。一个目标在命中后会被移除。输出底部的地图反映了这一变化。\n\n当目标被射击命中时，通过调用以射击点作为参数的 `remove(Object)`\
  \ 方法从 `targets` 数组列表中移除。\n\n注意\n\n在 `Battlepoint` 应用的 `shoot()` 方法中，将从列表中移除的 `Point`\
  \ 对象是代表射击点的。它与命中的目标具有相同的 (x,y) 坐标。\n\n### 哈希映射 (Hash Maps)\n\n在编程中，使用一条信息来访问另一个是很常见的。在数据结构中，数组列表（ArrayList）是这种能力最简单的示例，使用索引号从列表中检索一个对象。这里有一个从\
  \ `aristocrats` 列表中提取第一个字符串的示例：\n\n点击此处查看代码图像\n```java\nString first = aristocrats.get(0);\n\
  ```\n\n数组也使用索引号来检索数组中的每个项。哈希映射（Hash maps）是 Java 中的一种数据结构，使用一个对象检索另一个对象。第一个对象是 `key`（键），第二个对象是\
  \ `value`（值）。这种结构实现为 `java.util` 中的 `HashMap` 类。\n\n该名称指的是键如何映射到值。这种结构化数据的一个例子是电话列表。一个人的名字（字符串）可以用于检索该人的电话号码。可以通过调用不带参数的构造函数来创建一个哈希映射：\n\
  \n点击此处查看代码图像\n```java\nHashMap phonebook = new HashMap();\n```\n\n在新的哈希映射中可以指定两个控制其效率的方面：初始容量（initial\
  \ capacity）和负载因子（load factor）。它们通过两个参数设置，容量在前，负载因子在后：\n\n点击此处查看代码图像\n```java\nHashMap\
  \ phonebook = new HashMap(30, 0.7F);\n```\n\n容量是存储哈希映射值的桶（buckets）的数量。负载因子是一个从 0（空）到\
  \ 1.0（满）之间的浮点数，因此 0.7 意味着当桶填充了 70% 时，容量就会增加。默认值为容量为 16，负载因子为 .75，这通常足够了。\n\n应该使用泛型（Generics）来指示键和值的类型。它们被放在\
  \ `<` 和 `>` 字符之间，并用逗号分隔，如下例所示：\n\n点击此处查看代码图像\n```java\nHashMap<String, Long> phonebook\
  \ = new HashMap<>();\n```\n\n这创建了一个名为 `phonebook` 的哈希映射，其键为字符串，值为 `Long` 对象。第二组\
  \ `<` 和 `>` 是空的，假设与前一组 `<` 和 `>` 中的类相同。\n\n对象被存储在哈希映射中，键为字符串，值为 `Long` 对象。（注：此处原文文本逻辑存在重复，翻译已按语意整合）\n\
  \n*抱歉，我注意到您提供的原始文本中代码块与描述的对应关系有些混乱，我将完全按照您提供的文本内容进行逐行翻译。*\n\n（由于原文中包含了多次重复的描述，以下为完整翻译后的最终内容）\n\
  \n\n\n\n`java.awt` 包中的 `Font` 类用于创建字体并使用它们在图形用户界面中显示文本。字体包括字体名称、字号大小以及其样式是普通、粗体还是斜体。\n\
  \n哈希映射（Hash maps）可以包含任何类别的对象。在 NetBeans 中，在 `com.java24hours` 包中创建一个 Java 文件，并将其命名为\
  \ `FontMapper`。在文件中输入代码列表 13.2 并保存。\n\n**代码列表 13.2 `FontMapper.java` 的全文**\n\n点击此处查看代码图像\n\
  \n```java\n1: package com.java24hours;\n\n2:\n\n3: import java.awt.*;\n\n4: import\
  \ java.util.*;\n\n5: \n\n6: public class FontMapper {\n7:     public FontMapper()\
  \ {\n8:         Font courier = new Font(\"Courier New\", Font.PLAIN, 6);\n9:   \
  \      Font times = new Font(\"Times New Roman\", Font.BOLD, 12);\n10:         Font\
  \ verdana = new Font(\"Verdana\", Font.ITALIC, 25);\n11:         HashMap<String,\
  \ Font> fonts = new HashMap<>();\n12:         fonts.put(\"smallprint\", courier);\n\
  13:         fonts.put(\"body\", times);\n14:         fonts.put(\"headline\", verdana);\n\
  15:         for (Map.Entry<String, Font> entry : fonts.entrySet()) {\n16:      \
  \       String key = entry.getKey();\n17:             Font value = entry.getValue();\n\
  18:             System.out.println(key + \": \" + value.getSize() + \"-pt \"\n19:\
  \                 + value.getFontName());\n20:         }\n21:     }\n22:     \n\
  23:     public static void main(String[] arguments) {\n24:         new FontMapper();\
  \    \n25:     }\n26: }\n```\n\n`FontMapper` 应用程序在第 8–10 行创建了三个 `Font` 对象，并在第 12–14\
  \ 行将它们添加到名为 `fonts` 的哈希映射中。它们以字符串键存储在映射中，该键描述了字体的用途：“smallprint”、“body”和“headline”。\n\
  \n第 15–20 行中的 `for` 循环使用项集（entry set）和集合中的每个单独条目来遍历哈希映射。\n\n应用程序的输出显示在图 13.2。\n\n\
  ![Image](img/13fig02.jpg)\n\n**图 13.2**\n\n在哈希映射中存储 `Font` 对象。\n\n### 总结\n\n列表（Array\
  \ lists）和哈希映射（Hash maps）是 `java.util` 包中两个非常有用的数据结构。`ArrayList` 类扩展了数组的功能，使其能够克服该数据类型的固定大小限制。哈希映射允许使用任何类型的对象作为键来检索值。\n\
  \n还有位集（`BitSet` 类），它持有 0 和 1 的位值；栈（`Stack`），它是一种类似于列表的后进先出数据集合；排序结构 `TreeMap` 和\
  \ `TreeSet`；以及属性（`Properties`），这是一种特殊的哈希映射，用于在文件或其他存储位置中持有程序的配置属性。\n\n### 工作坊\n\n\
  #### 问答\n\n**Q. 类被同步（synchronized）意味着什么？**\n\n**A.** 同步是 Java 虚拟机确保其他用户以一致且准确的方式访问对象的实例变量和方法的方法。当你学习第\
  \ 15 节“创建多线程程序”中的线程时，这个概念将变得更有意义。Java 程序可以设计为执行多于一个任务。每个任务都被放在自己的线程中。当多个线程访问同一个对象时，确保该对象在每个线程中的行为相同至关重要。因此，当类的方法需要同步时（如向量\
  \ Vector 和哈表 Hasht），Java 虚拟机必须付出更多努力，并可能会遇到导致线程停止的错误。列表和哈希映射复制了向量和哈表的功能，因为需要不需要同步的数据结构。结果是，它们的运行效率更高。\n\
  \n**Q. 华盛顿将军队（Washington Generals）曾击败过环球旅行者（Globetrotters）吗？**\n\n**A.** 在过去的十年里，将军队曾击败环球旅行者七次，最近一次是在\
  \ 1971 年。在田纳西州马丁市比赛中，将军队凭借队主“红”Klotz 的进球以 100–99 获胜。尽管将军队今天以弱鱼队闻名，但他们于 1921 年作为\
  \ Sphas 队开始，是一支在东部和美国篮球联赛比赛的正规球队。Sphas（南费城协会的缩写）曾获得过冠军。Klotz 曾是 Sphas 队的球员，他买下了这支球队并在\
  \ 1952 年他们成为哈尔姆著名球队的永久合作伙伴时将队名改为将军队。1971 年的胜利胜利结束了环球旅行者 49 场的连胜。\n\n### 测验\n\n以下问题将测试你掌握了关于数据结构的多少知识。\n\
  \n**1。 下列哪项在创建后不能增加或缩小大小？**\n\nA. 列表 (Array lists)\nB. 数组 (Arrays)\nC. 哈希映射 (Hash\
  \ maps)\n\n**2。 使用什么方法可以获取映射中有多少个项？**\n\nA. `length()`\nB. `size()`\nC. `count()`\n\
  \n**3。 什么数据类型或类可以作为哈希映射的键？**\n\nA. `int`\nB. `Integer`\nC. `String`\n\n#### 答案\n\
  \n**1。 B.** 数组的大小在创建后不能改变。列表和哈希映射根据需要改变大小。\n\n**2。 B.** `size()` 方法指示映射中的项数。\n\n\
  **3。 A、B 或 C.** 哈希映射可以使用任何类作为键以及任何类作为值。\n\n#### 活动\n\n你可以通过以下活动应用结构化编程知识：\n\n![Image](img/arrow.jpg)\
  \ 使用本节的数据结构编写一个公司电子邮件列表，每个电子邮件都与一个姓名关联。\n\n![Image](img/arrow.jpg) 扩展 `FontMapper`\
  \ 程序，将字体名称、大小和样式作为命令行参数添加到哈希映射中并在显示其键和值。\n\n要查看实现这些活动的 Java 程序，请访问书籍网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 14 章 程序中的错误处理\n\n### 本节任务清单：\n\n![Image](img/arrow.jpg) 了解为什么错误被称为异常（exceptions）。\n\
  \n![Image](img/arrow.jpg) 在你的 Java 程序响应异常。\n\n![Image](img/arrow.jpg) 创建忽略异常的方法。\n\
  \n![Image](img/arrow.jpg) 使用引发异常的方法。\n\n![Image](img/arrow.jpg) 创建你自己的异常。\n\n异常通常可以通过一种保持程序正常运行的方式进行处理。\n\
  \n\n\n\n虽然你现在才开始学习它们，但在之前的 13 小时里，你可能已经对异常非常熟悉了。当你编写的 Java 程序能够编译成功但在运行时遇到问题时，这些错误就会出现。\n\
  \n例如，一种常见的编程错误是引用不存在的数组元素，如下所示：\n\n点击此处查看代码图像\n\n```java\nString[] greek = { \"\
  Alpha\", \"Beta\", \"Gamma\" };\nSystem.out.println(greek[3]);\n```\n\n`String`\
  \ 数组 `greek` 有三个元素。由于数组的第一个元素索引为 0 而不是 1，因此第一个元素是 `greek[0]`，第二个是 `greek[1]`，第三个是\
  \ `greek[2]`。这导致尝试显示 `greek[3]` 的语句是错误的。之前的语句可以成功编译，但当你运行程序时，Java 虚拟机将会停止并显示如下所示的消息：\n\
  \n输出 ![Image](img/arrow1.jpg)\n\n点击此处查看代码图像\n\n```\nException in thread \"main\"\
  \ java.lang.ArrayIndexOutBoundsException: 3\n    at SampleProgram.main(SampleProgram.java:4)\n\
  ```\n\n此消息表示应用程序生成了一个异常，JVM 通过显示错误消息并停止程序记录了该异常。\n\n错误消息指向 `java.lang` 包中一个名为 `ArrayIndexOutOfBoundsException`\
  \ 的类。该类是一个异常，是一个代表程序中发生的异常情况的对象。\n\n异常处理是类在发生错误或其他异常情况时相互通信的一种方式\n\n当 Java 类遇到异常时，它会向类的用户报告该错误。在这个例中，类的用户是\
  \ JVM。\n\n### 注意\n使用了两个术来描述这个过程：`throw`（抛出）和 `catch`（捕获）。对象抛出异常以通知其他对象异常的发生。这些异常被其他对象或\
  \ Java 虚拟机捕获。\n\n所有异常都是 `java.lang` 包中 `Exception` 的子类。`ArrayIndexOutOfBoundsException`\
  \ 正如你所期的——它报告访问了数组边界之外的元素。\n\nJava 中有数百种异常。许多异常如数组异常指示了可以通过编程更改来修复的问题。这些异常类似于编译错误。在你纠正了情况后，就不再需要担心该异常了。\n\
  \n其他异常必须在程序每次运行时通过五个新关键字来处理：`try`、`catch`、`finally`、`throw` 和 `throws`。\n\n### 在\
  \ `try`-`catch` 块中捕获异常\n\n到目前为止，你通过修复引起异常的问题来处理异常。有时你无法以这种方式处理异常，必须在 Java 类内部处理该问题。\n\
  \n为了介绍为什么很有用，请在 `com.java24hours` 包中创建一个名为 `Calculator` 的新 Java 文件，输入列表 14.1 中的短\
  \ Java 应用程序并保存文件。\n\n**列表 14.1** `Calculator.java` 的完整文本\n\n点击此处查看代码图像\n\n```java\n\
  1: package com.java24hours;\n2:\n3: public class Calculator {\n4:     public static\
  \ void main(String[] arguments) {\n5:         float sum = 0;\n6:         for (String\
  \ argument : arguments) {\n7:             sum = sum + Float.parseFloat(argument);\n\
  8:         }\n9:         System.out.println(\"Those numbers add up to \" + sum);\n\
  10:     }\n11: }\n```\n\n`Calculator` 应用程序接收一个或多个数字作为命令行参数，将它们相加并显示总和。\n\n由于 Java\
  \ 应用程序中的所有命令行参数都用字符串表示，因此程序在相加之前必须将它们转换为浮点数。第 7 行中的 `Float.parseFloat()` 类方法处理了这一点，将转换后的数字加到名为\
  \ `sum` 的变量。\n\n在运行应用程序之前，在 NetBeans 中通过命令 Run、Set Project Configuration、Customize\
  \ 设置以下命令行参数：`7 4 8 1 4 1 4`。选择 Run、Run Main Project 来运行应用程序，你应该可以在图 14.1 中看到输出。\n\
  \n![Image](img/14fig01.jpg)\n\n**图 14.1** `Calculator` 应用程序的输出。\n\n多次使用不同的数字作为参数运行程序。它应该能够成功处理它们，这可能会让你好奇这个项目与异常有什么关系。\n\
  \n为了看到相关性，将 `Calculator` 应用程序的命令行参数改为 `1 3 5x`。第三个参数包含一个拼写错误——数字 5 之后不应该是 `x`。`Calculator`\
  \ 应用程序无法感知，，它尝试加上 `5x`，导致以下结果：\n\n输出 ![Image](img/arrow1.jpg)\n\n```\nException\
  \ in thread \"main\" java.lang.NumberFormatException: For input: \"5x\"\n    at\
  \ java.lang.Float.parseFloat(Float.java:52)\n    at Calculator.main(Calculator.java:7)\n\
  ```\n\n此消息对程序员来说可能很有启发，但这不是你希望用户看到的。为了改进 `Calculator` 应用程序使其不再因此类错误停止运行，可以使用 `try`-`catch`\
  \ 块。在 `com.java24hours` 包中创建一个名为 `NewCalculator` 的新文件并输入列表 14.2 中的文本。\n\n**列表 14.2**\
  \ `NewCalculator.java` 的完整文本\n\n点击此处查看代码图像\n\n```java\n1: package com.java24hours;\n\
  2:\n3: public class NewCalculator {\n4:     public static void main(String[] arguments)\
  \ {\n5:         float sum = 0;\n6:         for (String argument : arguments) {\n\
  7:             try {\n8:                 sum = sum + Float.parseFloat(argument);\n\
  9:             } catch (NumberFormatException e) {\n10:                System.out.println(argument\
  \ + \" is not a number.\");\n11:            }\n12:         }\n13:         System.out.println(\"\
  Those numbers add up to \" + sum);\n14:     }\n15: }\n```\n\n任何你想让类处理的异常，都必须使用 `try`-`catch`\
  \ 块。`Exception` 对象应该是多个子类之一。在你保存应用程序后，自定义项目配置并使用命令行参数 `1 3 5x` 运行 `com.java24hours.NewCalculator`。你应该能看到在图\
  \ 14.2](#ch14.xhtml_ch14fig2)中所示的输出。\n\n![Image](img/14fig02.jpg)\n\n**图 14.2**\
  \ `NewCalculator` 应用程序的输出。\n\n\n\n\n第 7–11 行中的 `try`-`catch` 块处理由 `Float.parseFloat()`\
  \ 抛出的 `NumberFormatException` 错误。这些异常在 `NewCalculator` 类内部捕获：对于任何非数字参数，都会显示一条错误信息。由于异常在类内部被处理，`JVM`\
  \ 不会显示错误。你通常可以使用 `try`-`catch` 块来处理与用户输入和其他意外数据相关的问题。\n\n### 捕获多种不同的异常\n\n一个 `try`-`catch`\
  \ 块可以用于处理多种不同类型的异常，即使它们是由不同的语句抛出的。\n\n处理多个类异常的一种方法是为每种异常分配一个 `catch` 块，如下代码所示：\n\
  \n点击此处查看代码图像\n\n```java\nString textValue = \"35\";\n\nint value;\n\ntry {\n   \
  \ value = Integer.parseInt(textValue);\n} catch (NumberFormatException exc) {\n\
  \    // 处理异常的代码\n} catch (ArithmeticException exc) {\n    // 处理异常的代码\n}\n```\n\n\
  你也可以通过管道符 `|` 将多个异常分开，并在列表最后指定异常变量名称，在同一个 `catch` 块中处理多个异常。这是一个示例：\n\n点击此处查看代码图像\n\
  \n```java\ntry {\n    value = Integer.parseInt(textValue);\n} catch (NumberFormatException\
  \ | ArithmeticException exc) {\n    // 处理异常的代码\n}\n```\n\n如果捕获到 `NumberFormatException`\
  \ 或 `ArithmeticException`，它将被赋值给变量 `exc`。\n\n列表 14.3 包含一个名为 `NumberDivider` 的应用程序，它接受两个整数命令行参数用于整数除法表达式。\n\
  \n该应用程序必须能够处理用户输入中的两个潜在问题：\n\n![Image](img/arrow.jpg) 非整数参数\n\n![Image](img/arrow.jpg)\
  \ 除以零\n\n在 `com.java24hours` 包中为 `NumberDivider` 创建一个新的 Java 文件，并将列表 14.3 的文本输入到源编辑器中\n\
  \n**列表 14.3** `NumberDivider.java` 的全文\n\n点击此处查看代码图像\n\n```java\n1: package com.java24hours;\n\
  2:\n3: public class NumberDivider {\n4:     public static void main(String[] arguments)\
  \ {\n5:             if (arguments.length == 2) {\n6:                 int result\
  \ = 0;\n7:                 try {\n8:                     result = Integer.parseInt(arguments[0])\
  \ /\n9:                             Integer.parseInt(arguments[1]);\n10:       \
  \             System.out.println(arguments[0] + \" divided by \" +\n11:        \
  \                     arguments[1] + \" equals \" + result);\n12:              \
  \   } catch (NumberFormatException e) {\n13:                     System.out.println(\"\
  Both arguments must be integers.\");\n14:                 } catch (ArithmeticException\
  \ e) {\n15:                     System.out.println(\"You cannot divide by zero.\"\
  );\n16:                 }\n17:             }\n18:         }\n19: }\n```\n\n使用命令行参数指定两个参数，你可以用整数、浮点数和非数字参数运行它。\n\
  \n列表 14.3 中的第 5 行 `if` 语句检查是否存在两个参数。\n\n`NumberDivider` 应用程序执行整数除法，因此结果是整数。\n\n\
  如果你使用浮点数或非数字参数，第 8–9 行将抛出 `NumberFormatException`。\n\n如果你使用零作为参数，第 14 行将抛出 `ArithmeticException`。\n\
  \n[图 14.3] 显示了成功运行的一些示例输出。\n\n![Image](img/14fig) **图 14.3**\n\n### 在异常发生后执行某些操作\n\
  \n有时你希望在异常发生后做一些事情。你可以通过使用 `try`-`catch`-finally` 块来处理此，其形式如下：\n\n点击此处查看代码图像\n\n\
  ```java\ntry {\n    // 可能会导致异常的语句\n} catch (Exception e) {\n    // 异常发生时要做什么\n}\
  \ finally {\n    // 无论如何都会执行的语句\n}\n```\n\n无论是否发生异常，`finally` 部分都会执行。\n\n### 读取和写入文件\n\
  \n当从文件读取数据时，异常可能通过几种方式发生：文件可能不存在、可能会发生错误等。\n\n到在本节的目前，你已经学习了如何处理异常。如果你想在处理异常后再次抛出它，可以使用\
  \ `throw` 语句后跟跟要抛出的异常对象。\n\n以下代码在 `catch` 块中处理了 `NumberFormatException`，然后将其抛出：\n\
  \n点击此处查看代码图像\n\n```java\nfloat principal;\n\ntry {\n    principal = Integer.parseInt(textValue)\
  \ * 1.1F;\n} catch (NumberFormatException e) {\n    System.out.println(arguments[0]\
  \ + \" is not a number.\");\n    throw e;\n}\n```\n\n重写后的代码处理了 `try` 块可能生成的所有异常并将其抛出：\n\
  \n点击此处查看代码图像\n\n```java\nfloat principal;\n\ntry {\n    principal = Integer.parseInt(textValue)\
  \ * 1.1F;\n} catch (Exception e) {\n    System.out.println(\"Error \" + e.getMessage());\n\
  \    throw e;\n}\n```\n\n### 抛出异常\n\n当你调用 Java 库的方法时，编译器经常会显示关于异常的消息。例如：\n\n![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nNetReader.java:14: unreported exception java.net.MalformedURLException;\
  \ must be caught or declared\n```\n\n每当你看到看到异常“必须捕获或声明”的错误时，这表明你正在尝试使用的方法抛出了该异常。任何调用这些方法的类（例如编写的应用程序）必须执行以下操作之一：\n\
  \n![Image](img/arrow.jpg) 使用 `try`-`catch` 块处理异常\n\n![Image](img/arrow.jpg) 抛出异常\n\
  \n![Image](img/arrow.jpg) 使用 `try`-`catch` 块处理异常\n\n`Exception` 是所有异常子类的父类。`catch`\
  \ 语句将捕获该类以及在类层次结构中它的任何子类。\n\n\n\n\n\n当 `Database` 类正在执行任务时，如果信用卡发行机构的计算机对任何连接尝试都没有响应会发生什么？这种错误正是\
  \ `try`-`catch` 块设计用于处理的类型，它被用于 `Database` 内部处理连接错误。\n\n如果 `Database` 类自行处理此错误，那么\
  \ `CreditCardChecker` 应用程序就完全不知道异常的发生。这并不是一个好主意——应用程序应该知道何时无法建立连接，以便向该应用程序的用户报告此情况。\n\
  \n通知 `CreditCardChecker` 应用程序的一种方法是让 `Database` 在 `catch` 块中捕获异常，然后使用 `throw` 语句再次抛出。异常在\
  \ `Database` 中被抛出，随后它必须像处理任何其他异常一样处理它。\n\n当你在捕获父类（如 `Exception`）的 `catch` 块中使用 `throw`\
  \ 时，抛出异常将是抛出该父类类型的异常。这会丢失一些关于错误类型的细节，因为像 `NumberFormatException` 这样的子类比简单的 `Exception`\
  \ 类能提供更多关于问题的信息。\n\nJava 提供了一种方法来保留这些细节：在 `catch` 语句中使用 `final` 关键字。\n\n点击此处查看代码图像\n\
  \n```java\ntry {\n    principal = Float.parseFloat(loanText) * 1.1F;\n} catch (final\
  \ Exception e) {\n    System.out.println(\"Error \" + e.getMessage());\n    throw\
  \ e;\n}\n```\n\n`catch` 中的该 `final` 关键字导致 `throw` 的行为变得不同。它会抛出被捕获的特定类。\n\n## 忽略异常\n\
  \n本小时涵盖的下一个技术是如何完全忽略一个异常。类中的方法可以通过在方法定义中使用 `throws` 子句来忽略异常。\n\n以下方法抛出一个 `MalformedURLException`，当你在\
  \ Java 程序中处理网络地址时，可能会发生这种错误：\n\n点击此处查看代码图像\n\n```java\npublic void loadURL(String\
  \ address) throws MalformedURLException {\n    URL page = new URL(address);\n  \
  \  // code to load web page\n}\n```\n\n此示例中的第二个语句创建了一个 `URL` 对象，它代表 Web 上的地址。`URL`\
  \ 类的构造函数抛出 `MalformedURLException` 来表示使用了无效地址，因此无法构造对象。接下来的语句会在尝试打开到该 URL 的连接时抛出这些异常之一：\n\
  \n点击此处查看代码图像\n\n```java\nURL source = new URL(\"[http:www.java24hours.com](http://hwww.java24hours.com)\"\
  );\n```\n\n字符串 `http:www.java24hours.com` 并不是一个有效的 URL，因为它缺少了一些标点符号：冒号后的两个斜杠字符（`//`）。\n\
  \n由于 `loadURL()` 方法已声明为抛出 `MalformedURLException` 错误，它不需要在方法内部处理这些错误。捕获此异常的责任属于任何调用\
  \ `loadURL()` 方法的方法。\n\n## 不需要 catch 的异常\n\n尽管本节展示了异常需要用 `try`-`catch` 捕获或用 `throws`\
  \ 子句声明为抛出，但仍然存在一种例外。\n\nJava 程序中可能发生的某些异常不需要以任何方式处理。当编译器检测到异常正在被忽略时，并不会停止运行。这些异常被称为*未检查*（unchecked）异常，而其他的被称为*已检查*（checked）异常。\n\
  \n未检查异常都是 `java.lang` 包中 `RuntimeException` 的子类。未检查异常的一个例子是 `IndexOutOfBoundsException`，它表示用于访问数组、字符串或数组列表的索引不在其范围内。如果一个数组有五个元素，而你尝试读取第\
  \ 10 个元素，就会发生此异常。\n\n另一个是 `NullPointerException`，它发生在使用没有值的对象时。对象变量在赋值一个对象之前，其值为\
  \ `null`。某些方法在无法返回对象时也会返回 `null`。如果一个语句错误地假设一个对象有值，就会发生 `NullPointerException`。\n\
  \n这两种错误都是程序员可以（也应该）在代码中防止的错误，而不是需要异常处理的内容。如果你编写了一个访问越界数组元素的程序，请修复执行该操作的代码并重新编译。如果你预期的对象有值但它等于\
  \ `null`，请在使用对象之前通过 `if` 条件对这种情况进行检查。\n\nJava 中未检查异常的原理是：它们要么可以通过编写良好的代码来防止，要么发生得太频繁，以至于一直捕获它们会使程序变得异常复杂。在调用对象方法的每条语句中，都可能发生\
  \ `NullPointerException`。\n\n当然，仅仅因为异常可以被忽略并不意味着它应该被忽略。你仍然可以选择对未检查异常使用 `try`、`catch`\
  \ 和 `throws`。\n\n## 抛出和捕获异常\n\n在本小时的最后一个项目中，你创建一个类，使用异常来告诉另一个类已发生的错误。\n\n项目中的类有\
  \ `HomePage`（一个代表 Web 个人主页的类）和 `PageCatalog`（一个对这些页面的应用程序）。\n\n在一个名为 `HomePage`\
  \ 的新文件中输入 `Listing 14.4` 的文本，位于 `java24hours` 包中。\n\n**列表 14.4 HomePage 的全文**\n\
  点击此处查看代码图像\n\n```java\npackage java24hours;\n\nimport java.net.*;\n\npublic class\
  \ HomePage {\n    String owner;\n    URL address;\n    String category = \"none\"\
  ;\n\n    public HomePage(String inOwner, String inAddress) throws MalformedURLException\
  \ {\n        owner = inOwner;\n        address = new URL(inAddress);\n    }\n\n\
  \    public HomePage(String inOwner, String inAddress, String inCategory) throws\
  \ MalformedURLException {\n        this(inOwner, inAddress);\n        category =\
  \ inCategory;\n    }\n}\n```\n\n你可以在其他程序中使用 `HomePage` 类。该类代表页面。它有三个变量：`address`，代表地址的\
  \ `URL` 对象；`owner`，所有者；`category`，描述页面的短说明。\n\n和任何创建 `URL` 对象的类一样，`HomePage` 必须在\
  \ `try`-`catch` 块中处理 `MalformedURLException`，或者声明忽略这些错误。该类选择了后者，如列表 14.4 第 10–11\
  \ 行和 17–18 行所示。通过在两个构造方法中使用 `throws`，`HomePage` 消除了以任何方式处理 `MalformedURLException`\
  \ 的需求。\n\n要创建一个使用 `HomePage` 类的应用程序，返回 NetBeans 并创建一个名为 `PageCatalog` 的 Java 文件，其中包含\
  \ `Listing 14.5` 的文本。\n\n\n\n\n\n```java\ncatalog[3] = new HomePage(\"Taegan Goddard\"\
  ,\n                    \"[`politicalwire.com`](https://politicalwire.com)\", \"\
  politics\");\ncatalog[4] = new HomePage(\"Manton Reese\",\n                    \"\
  [www.manton.org](http://www.manton.org)\");\nfor (int i = 0; i < catalog.length;\
  \ i++) {\n    System.out.println(catalog[i].owner + \": \" +\n                 \
  \       catalog[i].address + \" -- \" +\n                        catalog[i].category);\n\
  }\n} catch (MalformedURLException e) {\n    System.out.println(\"Error: \" + e.getMessage());\n\
  }\n}\n```\n\n当你运行编译后的应用程序时，将显示如图 14.4 所示的内容。\n\n![Image](img/14fig04.jpg)\n\n**图\
  \ 14.4**\n\n`PageCatalog`应用程序的错误输出。\n\n`PageCatalog`应用程序创建了一个 `HomePage` 对象的数组，然后显示该数组的内容。每个\
  \ `HomePage` 对象创建时最多使用三个参数：\n\n![Image](img/arrow.jpg) 页面所有者的名称\n\n![Image](img/arrow.jpg)\
  \ 页面的地址（作为 `String` 类型，而非 `URL`）\n\n![Image](img/arrow.jpg) 页面的类别\n\n第三个参数是可选的，并且在第\
  \ 17–18 行中未使用。\n\n`HomePage`类的构造函数在接收到无法转换为有效 `URL` 对象的字符串时会抛出 `MalformedURLException`\
  \ 错误。这些异常在 `PageCatalog`应用程序中通过 `try`-`catch` 块进行处理。\n\n要修正导致“no protocol”错误的问题，请编辑第\
  \ 18 行，使字符串以 `http://` 文字开头，就像第 9–16 行中的其他网络地址一样。当你再次运行程序时，你会看到如图 14.5 所示的输出。\n\n\
  ![Image](img/14fig05.jpg)\n\n**图 14.5**\n\n`PageCatalog`应用程序修正后的输出。\n\n### 总结\n\n\
  既然你已经使用了 Java 的异常处理技术，那么错误这个主题应该比这一小时开始时稍微受欢迎一点。\n\n你可以利用这些技术做很多事情：\n\n![Image](img/arrow.jpg)\
  \ 捕获异常并处理它。\n\n![Image](img/arrow.jpg) 忽略异常，交给另一个类或 Java 虚拟机来处理。\n\n![Image](img/arrow.jpg)\
  \ 在同一个 `try`-`catch` 块中捕获几个不同的异常。\n\n![Image](img/arrow.jpg) 抛出自己的异常\n\n在 Java 程序中管理异常可以使它们更可靠、更多功能且更容易使用，因为你不需要向运行软件的人显示任何晦涩的错误信息。\n\
  \n### 工作坊\n\n#### 问答\n\n**问：可以创建你自己的异常吗？**\n\n**答：** 这不仅是可能的，而且是一个非常好的主意。为可能出现的问题自定义异常可以使你的类更加健壮。你可以通过将自定义异常变为现有异常（例如所有异常的父类\
  \ `Exception`）的子类来轻松创建它们。在 `Exception` 的子类中，你可能想要重写两个构造函数：无参数的 `Exception()` 和带有\
  \ `String` 参数的 `Exception()`。在后者中，该字符串应该是描述已发生错误的消息。\n\n**问：为什么这一小时除了异常之外，没有涵盖如何抛出和捕捉错误？**\n\
  \n**答：** Java 将问题分为 `Errors`（错误）和 `Exceptions`（异常），因为它们的严重程度不同。异常的程度较轻，因此它们应该在程序中使用\
  \ `try`-`catch` 或在方法声明中使用 `throws` 来处理。相反，错误更为严重，无法在程序中得到妥善处理。\n\n这些错误的两个例子是栈溢出（stack\
  \ overflows）和内存溢出（out-of-memory errors）。这些可能导致 `JVM` 崩溃，而且你无法在 `JVM` 运行时修复它们。\n\n\
  **问：仍在报纸连连连漫画是哪一个？**\n\n**答：** *Katzenjammer Kids*，由 Rudolph Dirks 于 1897 年创建，至今仍由\
  \ King Features Syndicate 提供。该连漫画在第一部漫画《The Yellow Kid》问世仅两年后开始，并且是第一个使用对话框的漫画。\n\
  \nDirks 是一个移居美国的德国移民，受他家乡的一个儿童故事启发，创造了反叛的孩子 Hans 和 Fritz。他在 1912 因合同纠纷退出了漫画，由 Harold\
  \ Knerr 接手，后者一直创作并绘制直到 1949 年。此后还有五位漫画家。从那时起，*katzenjammer* 一词在德语中字面意思是“猫的哀叫”，但它经常被用来描述\n\
  \n### 测验\n\n尽管这一小时充满了错误，但看看你是否能在不犯任何错误的情况下回答以下问题。\n\n**1. 一个 `catch` 语句可以处理多少个异常？**\n\
  \nA. 仅一个。\n\nB. 几个不同的异常。\n\nC. 此答案留空。\n\n**2. `finally` 部分中的语句在什么时候运行？**\n\nA. 在\
  \ `try`-`catch` 块因异常而结束后执行\n\nB. 在 `try`-`catch` 块在没有异常的情况下结束后执行\n\nC. A 和 B 都是\n\
  \n**3. 有了这些关于抛出和捕捉的讨论，这些需要做什么？**\n\nA. 更多投手\n\nB. 签约一个左手外野手\n\nC. 引入替补\n\n#### 答案\n\
  \n**1.** `catch` 语句中的 `Exception` 对象可以处理其自身类及其所有父类的异常。\n\n**2.** `finally` 部分的语句或语句总会在\
  \ `try`-`catch` 块之后执行，无论是否发生了异常。\n\n**3.** 每个答案都是正确的，但 A 比其他更准确。\n\n#### 活动\n\n\
  为了看看你是否是一个优秀的 Java 程序员，尝试在完成以下任务时尽可能少犯错误：\n\n- 修改 `NumberDivider` 应用程序，使其抛出它捕获的所有异常，并运行程序查看发生了什么。\n\
  - 创建一个 `Multiplier` 应用程序，接收三个数字作为命令行参数，并对非数字参数抛出异常。\n\n\n\n\n线程（Threads）是一种组织程序的方式，使其能够同时执行多件事。每个必须同时发生的任务都应该放置在自己的线程中，这通常通过将每个任务实现为一个独立的类完成。\n\
  \n线程由 `Thread` 类和 `Runnable` 接口表示，它们都属于 `java.lang` 类包。由于它们属于这个包，因此你不需要在程序中使用 `import`\
  \ 语句来引用它们。\n\n`Thread` 类最简单的用法之一是用来减慢程序执行某些操作的速度。\n\n## 减慢程序运行\n\n`Thread` 类有一个\
  \ `sleep()` 方法，你可以在任何需要停止运行一段时间的程序中调用它。你经常在带有动画的程序中看到这种技术，因为它可以防止图像显示的速度超过 Java\
  \ 虚拟机的处理能力。\n\n要使用 `sleep()` 方法，请调用 `Thread.sleep()` 并传入要暂停的毫秒数，如下句所示：\n\n```java\n\
  Thread.sleep(5000);\n```\n\n上述语句会导致 JVM 在执行任何其他操作之前暂停五秒钟（5,000 毫秒）。如果由于某种原因 JVM\
  \ 无法暂停那么久，`sleep()` 方法将抛出一个 `InterruptedException`。\n\n因为可能会抛出此异常，当你使用 `sleep()`\
  \ 方法时必须以某种方式处理它。此一种方法是将 `Thread.sleep()` 语句放在 `try-catch` 块中：\n\n```java\ntry {\n\
  \    Thread.sleep(5000);\n} catch (InterruptedException e) {\n    // 提前唤醒\n}\n```\n\
  \n当你希望 Java 程序同时处理多一件事时，你必须将程序组织成线程。你的程序可以拥有任意数量的线程，它们都可以同时运行而互不影响。\n\n## 创建线程\n\
  \n一个可以作为线程运行的 Java 类被称为可运行（runnable）类或线程（threaded）类。虽然你可以使用线程让程序执行暂停几秒，但程序员通常出于相反的原因使用它们——为了加速程序。如果你将耗时较的任务放在自己的线程中，程序的其余部分将运行得更快。这通常被用于防止任务拖慢程序图形用户界面（GUI）的响应速度。\n\
  \n例如，如果你编写了一个从文件加载股票市场价格数据并编译统计数据的应用程序，最耗时的任务是加载数据。如果应用程序没有使用线程，在加载数据时，程序的界面可能会响应迟钝。这会让用户感到极度沮丧。\n\
  \n将任务放在自己的线程中的两种方法包括：\n\n1. 将任务放在实现 `Runnable` 接口的类中。\n2. 将任务放在作为 `Thread` 子类的类中。\n\
  \n为了支持 `Runnable` 接口，在创建类时使用了 `implements` 关键字，如下例所示：\n\n```java\npublic class LoadStocks\
  \ implements Runnable {\n    // 类体\n}\n```\n\n当类实现一个接口时，表示该类除了自身的方法外还包含一些额外的行为。\n\
  \n实现 `Runnable` 接口的类必须包含 `run()` 方法，其结构如下：\n\n```java\npublic void run() {\n   \
  \ // 方法体\n}\n```\n\n`run()` 方法应该处理线程创建时要完成的任务。在股票市场的示例中，`run()` 方法可以包含从磁盘加载数据并根据这些数据编译统计数据的语句。\n\
  \n当运行一个线程应用程序时，其 `run()` 方法中的语句不会自动执行。在 Java 中可以启动和停止线程，但在你完成以下两件事之前，线程不会开始运行：\n\
  \n1. 通过调用 `Thread` 构造函数创建线程类的对象。\n2. 通过调用其 `start()` 方法启动线程。\n\n`Thread` 构造函数接受一个参数：包含线程\
  \ `run()` 方法的对象。通常你使用 `this` 关键字作为参数，这表示当前类包含了 `run()` 方法。\n\n列表 15.1 包含一个寻找前一百个质数的\
  \ Java 应用程序，将其存储在 `StringBuffer` 中。当找到所有质数后，将显示它们。在 NetBeans 中，在 `com.java24hours`\
  \ 包中创建一个名为 `PrimeFinder` 的新 Java 文件，将列表中的文本输入文件中，并且——等等——不要忘记保存。\n\n**列表 15.1 PrimeFinder.java\
  \ 的全文**\n\n```java\n1: package com.java24hours;\n2: \n3: public class PrimeFinder\
  \ implements Runnable {\n4:     Thread go;\n5:     StringBuffer primes = new StringBuffer();\n\
  6:     int time = 0;\n7: \n8:     PrimeFinder() {\n9:         start();\n10:    \
  \    while (primes != null) {\n11:            System.out.println(time);\n12:   \
  \         try {\n13:                Thread.sleep(100);\n14:            } catch (InterruptedException\
  \ exc) {\n15:                // 什么都不做\n16:            }\n17:            time++;\n\
  18:        }\n19:    }\n20: \n21:    void start() {\n22:        if (go == null)\
  \ {\n23:            go = new Thread(this);\n24:            go.start();\n25:    \
  \    }\n26:    }\n27: \n28:    void run() {\n29:        int quantity = 1000000;\n\
  30:        int numPrimes = 0;\n31:        // 可能是质数的数字\n32:        int candidate\
  \ = 2;\n33:        primes.append(\"\\nFirst\").append(quantity).append(\"primes:\\\
  n\");\n34:        while (numPrimes < quantity) {\n35:            if (isPrime(candidate))\
  \ {\n36:                primes.append(candidate).append(\" \");\n37:           \
  \     numPrimes++;\n38:            }\n39:            candidate++;\n40:        }\n\
  41:        System.out.println(primes);\n42:        primes = null;\n43:        System.out.println(\"\
  \\nTime elapsed: \" + time + \" seconds\");\n44:    }\n45: \n46:    public static\
  \ boolean isPrime(int candidate) {\n47:        double root = Math.sqrt(candidate);\n\
  48:        for (int i = 2; i <= root; i++) {\n49:            if (candidate % i ==\
  \ 0) {\n50:                return false;\n51:            }\n52:        }\n53:  \
  \      return true;\n54:    }\n55: \n56:    public static void main(String[] arguments)\
  \ {\n57:        new PrimeFinder();\n58:    }\n59: }\n```\n\n寻找一百万质数是一项耗时任务，因此该工作非常适合放在自己的线程中。当线程在后台工作时，PrimeFinder\
  \ 应用程序显示了经过了多少秒。输出的开头如图 15.1](#ch15.xhtml_ch15fig1）所示。\n\n**图 15.1 PrimeFinder 应用程序的输出。**\n\
  \n应用程序中的大多数语句用于寻找质数。以下语句用于在此程序实现线程：\n\n- 第 3 行：PrimeFinder 类实现了 `Runnable` 接口。\n\
  - 第 4 行：创建一个名为 `go` 的 `Thread` 对象变量但尚未赋值。\n- 第 22-25 行：如果 `go` 对象变量值为 `null`，表示线程尚未创建，则创建一个新的\
  \ `Thread` 对象并存储在变量中。通过调用线程的 `start()` 方法启动线程。\n\n\n\n\n![Image](img/arrow.jpg)\
  \ 第 28–44 行——`run()` 方法寻找一个从 2 开始的质数序列，通过调用其 `append()` 方法将每个质数存储在 `primes` 字符串缓冲区中。\n\
  \n当创建一个 `PrimeFinder` 对象来开始执行程序时，该应用程序的 `main()` 方法中有些不寻常。这里是该语句：\n\n```\nnew PrimeFinder();\n\
  ```\n\n通常情况下，你会期望看到该对象被赋值给一个变量，如下：\n\n点击此处查看代码图像\n\n```java\nPrimeFinder frame =\
  \ new PrimeFinder();\n```\n\n然而，由于不再需要再次引用该对象，因此将其存储在变量中是没有必要的。调用 `new` 来创建对象会导致程序运行。\n\
  \n在 Java 中，一种良好的编程实践是只有在创建后需要使用这些对象时才将其存储在变量中。\n\n**注意**\n\n`PrimeFinder` 应用对 `StringBuffer`\
  \ 对象的 `append()` 方法进行了一些不寻的操作。调用 `append()` 之后紧跟着一个点（`.`）字符和另一个 `append()` 调用。这导致文本按顺序追加。之所以可能，是因为调用\
  \ `append()` 会返回该缓冲区，然后可以再次调用它。\n\n## 线程操作\n\n你可以通过调用其 `start()` 方法来启动线程，这可能让你认为也有一个\
  \ `stop()` 方法来停止它。\n\n尽管 Java 在 `Thread` 类中包含一个 `stop()` 方法，但它已经被废弃。在 Java 中，`deprecated`（已弃用）元素是指已被具有功能更好的替代方案的替换的类、接口、方法或变量。\n\
  \n**警告**\n\n听从此弃用警告是一个好主意。Oracle 废用了 `stop()` 方法，因为它可能会给在 JVM 中运行的其他线程引起问题。该类的 `resume()`\
  \ 和 `suspend()` 方法也被废用了。\n\n你接的项目将展示如何停止一个线程。你正在进行的程序循环遍历网站标题列表和访问这些网站的地址。\n\n每个页面的标题和网页地址以循环的方式显示。用户可以通过点击应用程序图形用户界面上的按钮来访问当前显示的站点。该程序运行一段时间，按顺序显示每个网站的信息。由于这个时间因素，线程是控制程序的最佳方式。\n\
  \n你并不是先将程序输入 NetBeans 源代码编辑器后再学习它，而是在一小时结束前有机会输入 `LinkRotator` 应用程序的全文。在此之前，程序的每个部分都将得到描述。\n\
  \n### `class` 声明\n\n在这个程序中你需要做的第一件事是使用 `import` 导入 `java.awt`、`java.io`、`java.net`、`java.awt.event`\
  \ 和 `javax.swing` 包中的类。需要这么多包是因为该项目使用了 Swing，这是一组支持 Java 图形用户界面的包。\n\n在你使用 `import`\
  \ 使某些类可用后，就可以准备好以下语句开始应用程序：\n\n点击此处查看代码图像\n\n```java\npublic class LinkRotator extends\
  \ JFrame\n    implements Runnable, ActionListener {\n```\n\n该语句将 `LinkRotator` 类创建为\
  \ `JFrame` 类的子类，`JFrame` 是一个由空框架组成的简单图形用户界面。该语句还表明此类支持两个接口：`Runnable` 和 `ActionListener`。通过实现\
  \ `Runnable` 类，你能够在此程序中使用 `run()` 方法使线程开始运行。`ActionListener` 接口使程序能够响应鼠标点击。\n\n\
  ### 设置变量\n\n在 `LinkRotator` 中要做的第一件事是创建类的变量和对象。创建一个名为 `pageTitle` 的六元素 `String`\
  \ 对象数组，和一个名为 `pageLink` 的六元素 `URI` 对象数组：\n\n点击此处查看代码图像\n\n```java\nString[] pageTitle\
  \ = new String[6];\nURI[] pageLink = new URI[6];\n```\n\n`pageTitle` 数组存储显示的六个网站的标题。`URI`\
  \ 对象类存储网站地址的值。`URI` 拥有跟踪网页地址所需的所有行为和属性。\n\n最后要创建三个三个是一个整数变量、一个 `Thread` 对象和一个用户界面标签：\n\
  \n点击此处查看代码图像\n\n```java\nint current = 0;\nThread runner;\nJLabel siteLabel = new\
  \ JLabel();\n```\n\n`current` 变量跟踪正在显示哪个站点，以便你可以在站点之间循环。`Thread` 对象 `runner` 代表此程序运行的线程。当你开始、停止和暂停程序操作时，会调用\
  \ `runner` 对象的方法。\n\n### 构造函数\n\n程序的构造函数在程序运行时会自动执行。该方法被用于给数组 `pageTitle` 和 `pageLink`\
  \ 赋值。它还用于创建一个出现在用户界面上的可点击按钮。该方法包含以下语句：\n\n点击此处查看代码图像\n\n```java\npageTitle = new\
  \ String[] {\n    \"Oracle's Java site\",\n    \"Server Side\",\n    \"JavaWorld\"\
  ,\n    \"Java in 24 Hours\",\n    \"Sams Publishing\",\n    \"Workbench\"\n};\n\n\
  pageLink[0] = getURI(\"http://www.oracle.com/technwork/java\");\npageLink[1] = getURI(\"\
  http://serverside.com\");\npageLink[2] = getURI(\"http://www.javaworld.com\");\n\
  pageLink[3] = getURI(\"http://java24hours.com\");\npageLink[4] = getURI(\"http://www.samsplishing.com\"\
  );\npageLink[5] = getURI(\"http://workbench.cadenhead.org\");\n```\n\n每个页面的标题存储在\
  \ `pageTitle` 数组中，该数组使用字符串初始化。`pageLink` 数组的元素被尚未创建的 `getURI()` 方法赋值。\n\n`init()`\
  \ 方法的最后三个语句创建一个标记为“Visit Site”的按钮并将其添加到框架。\n\n### 设置 URL 时捕捉异常\n\n当你设置 `URI` 对象时，必须确保用于设置地址的文本格式正确：`http://workbench.cadenhead.org`\
  \ 和 `http://www.samsplishing.com` 是有效的，但 `http:www.javaworld.com` 则不是，因为冒号后面缺少双斜杠（`//`）。\n\
  \n`getURI(String)` 方法接收网页地址作为参数，返回该地址的 `URI` 对象。如果字符串不是有效地址，它将返回 `null`：\n\n点击此处查看代码图像\n\
  \n```java\nURI getURI(String urlText) {\n    URI pageURI = null;\n    try {\n  \
  \      pageURI = new URI(urlText);\n    } catch (URISyntaxException m) {\n     \
  \   // do nothing\n    }\n    return pageURI;\n}\n```\n\n`try`-`catch` 块处理创建 `URI`\
  \ 对象时发生的任何 `URISyntaxException` 错误。如果抛出此异常则不需要任何操作，因此 `catch` 块只包含注释。\n\n### 启动线程\n\
  \n在此程序中，当调用 `start()` 方法时，`runner` 线程就会启动。\n\n`start()` 方法作为构造函数的最后一个语句被调用。这里是该方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic void start() {\n    if (runner == null) {\n    \
  \    runner = new Thread(this);\n        runner.start();\n    }\n}\n```\n\n如果 `runner`\
  \ 尚未启动，则该方法将启动它。\n\n\n\n\n\n语句 `runner = new Thread(this)` 创建了一个带有一个参数的 `Thread`\
  \ 对象：该参数是 `this` 关键字。`this` 关键字指向程序本身，将其指定为在线程中运行的类。\n\n调用 `runner.start()` 会导致线程开始运行。当线程开始时，该线程的\
  \ `run()` 方法会被调用。由于 `runner` 线程是 `LinkRotator` 程序本身，因此调用的是应用程序的 `run()` 方法。\n\n\
  ## 运行线程\n\n`run()` 方法是线程执行主要工作的地方。在 `LinkRotator` 程序中，以下代表 `run()` 方法：\n\n点击此处代码图片\n\
  \n```java\npublic void run() {\n    Thread thisThread = Thread.currentThread();\n\
  \    while (runner == thisThread) {\n        current++;\n        if (current > 5)\
  \ {\n            current = 0;\n        }\n        siteLabel.setText(pageTitle[current]);\n\
  \        repaint();\n        try {\n            Thread.sleep(1000);\n        } catch\
  \ (InterruptedException e) {\n            // do nothing\n        }\n    }\n}\n```\n\
  \n`run()` 方法中发生的第一件事是创建一个名为 `thisThread` 的 `Thread` 对象。`Thread` 类的类方法 `currentThread()`\
  \ 为 `thisThread` 对象设置了值。`currentThread()` 方法跟踪当前运行的线程。\n\n该方法中的所有语句都是一个 `while`\
  \ 循环的一部分，该循环比较 `runner` 对象和 `thisThread` 对象。这两个对象都是线程，只要它们引用同一个对象，`while` 循环就会继续进行。此循环内部没有语句会导致\
  \ `runner` 和 `thisThread` 对象的取值不同，因此除非循环外部某些某些改变了其中一个 `Thread` 对象，否则它将无限循环。\n\n\
  `run()` 方法调用了 `repaint()`。接下来，`current` 变量的值加 1，如果 `current` 超过 5，则将其重新置为 0。`current`\
  \ 变量用于确定显示哪个网站的信息。它被用作 `pageTitle` 字符串数组的索引，而标题被设置为 `siteLabel` 用户界面组件的文本。\n\n`run()`\
  \ 方法包含了另一个处理错误的 `try-catch` 块。`Thread.sleep(1000)` 语句导致线程暂停 1 秒，足够让用户阅读网站的名称及其地址。`catch`\
  \ 语句处理在执行 `Thread.sleep()` 语句期间可能发生的任何 `InterruptedException` 错误。如果线程在睡眠时被某些操作中断，就会发生这些错误。\n\
  \n## 处理鼠标点击\n\n`LinkRotator` 程序中最后需要处理的是事件处理——检测用户输入的能力。每当用户点击“Visit Site”按钮时，应用程序都应该用网络浏览器打开显示的网站。这是通过名为\
  \ `actionPerformed()` 的方法实现的，该方法是 `ActionListener` 接口要求的。每当按钮被点击时就会调用此方法。\n\n以下是\
  \ `LinkRotator` 的 `actionPerformed()` 方法：\n\n点击此处代码图片\n\n```java\npublic void actionPerformed(ActionEvent\
  \ event) {\n    Desktop desktop = Desktop.getDesktop();\n    if (pageLink[current]\
  \ != null) {\n        try {\n            desktop.browse(pageLink[current]);\n  \
  \          runner = null;\n            System.exit(0);\n        } catch (IOException\
  \ exc) {\n            // do nothing\n        }\n    }\n}\n```\n\n此方法中发生的第一件事是创建一个\
  \ `Desktop` 对象。`java.awt` 包中的 `Desktop` 类表示运行应用程序的计算机桌面环境。获取此对象后，你可以使用它通过“mailto:”链接启动电子邮件客户端，用另一个程序打开文件进行编辑，打印文件，并让\
  \ Java 外部的其他程序执行任务。\n\n在这里，`Desktop` 对象被用于用计算机默认的网络浏览器打开网页。\n\n`browse(URI)` 方法在浏览器中加载指定的网络地址。如果\
  \ `pageLink[current]` 是一个有效地址，`browse()` 将请求浏览器加载该页面。\n\n## 显示循环链接\n\n你现在准备好创建并测试该程序了。在\
  \ `com.java24hours` 包中创建一个名为 `LinkRotator` 的新 Java 文件，并输入列表 15.2 中的文本。\n\n**列表 15.2**\
  \ LinkRotator.java 的**全文**。\n\n点击此处代码图片\n\n```java\n1: package com.java24hours;\n\
