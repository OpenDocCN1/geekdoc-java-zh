  \n### 注意\n\n当 [www.java24hours.com](http://www.java24hours.com) 的书籍网站用于运行 `LottoMadness`\
  \ 程序时，它完成了 410,732,244 次抽奖，相当于 390 万次每周两次的抽奖次数。其中有 6,364,880 名 6 选 3 中者、337,285\
  \ 名 6 选 4 中者、6,476 名 6 选 5 中者以及 51 名 6 选 6 中者（大约每 800 万次抽奖中有一个）。第一位赢得这种虚拟彩票奖的人是\
  \ Bill Teer。他的号码是 3, 7, 1, 15, 34 和 43，他仅花了 241,225 次抽奖（2319.47 年）才中奖。\n\n### 总结\n\
  \n通过使用 Swing，你可以通过少量编程代码创建一个看起来专业的程序。尽管 `LottoMadness` 应用比你过去 19 小时处理过的许多示例都要长，但该程序有一半是由构建界面的语句组成的。\n\
  \n\n\n\n要处理其他类型的数据（例如硬盘上的文件和网络服务器上的文档），你可以使用 `java.io` 包中的类。该名称中的“io”代表“输入/输出”（input/output），这些类用于访问数据源，例如硬盘、DVD\
  \ 或计算机内存。\n\n你可以通过一种名为 `streams`（流）的通信系统将数据引入程序并发送出去，流是将信息从一个地方传输到另一个地方的对象。\n\n\
  ## Streams\n\n要在 Java 程序中永久保存数据，或稍后检索这些数据，你必须至少使用一个流。\n\n流是一个从一个源获取信息并发送到其他地方的对象，其名称源于水流，水流将鱼、船和工业污染物从一个地方带到另一个地方。\n\
  \n流连接了各种来源，包括计算机程序、硬盘、Internet 服务器、计算机内存和优存盘。当你学会了如何使用流处理一种类型的数据后，就可以以相同的方式处理其他数据。\n\
  \n在本小时中，你将使用流来读写存储在计算机文件中的数据。\n\n流有两种：\n\n![Image](img/arrow.jpg) 输入流，从源处读取数据\n\n\
  ![Image](img/arrow.jpg) 输出流，向源处写入数据\n\n所有输入输出流都由字节组成，字节是范围从 0 到 255 的单个整数。你可以使用这种格式来表示数据，例如可执行程序、文字处理文档和\
  \ MP3 音乐文件，但这些只是字节能表示的内容的一小部分。字节流用于读写这类数据。\n\n### NOTE\n\nJava 类文件以称为 `bytecode`（字节码）的形式以字节形式存储。Java\
  \ 虚拟机（JVM）运行 `bytecode`，这些字节码并不一定由 Java 语言产生。它可以运行由其他语言（包括 Scala、Groovy 和 Jython）编译产生的字节码。你也会听到将\
  \ JVM 称为字节码解释器。\n\n一种更专门的数据处理方式是字符形式的——即单个字母、数字、标点符号等。当你读写文本源时，可以使用字符流。\n\n无论你处理的是字节流、字符流还是其他类型的信息，整体过程都是相同的：\n\
  \n![Image](img/arrow.jpg) 创建与数据关联的流对象。\n\n![Image](img/arrow.jpg) 调用流的方法将信息放入流中或从流中取出信息。\n\
  \n![Image](img/arrow.jpg) 通过调用对象的 `close()` 方法关闭流。\n\n### Files\n\n在 Java 中，文件由\
  \ `File` 类表示，该类也是 `java.io` 包的一部分。可以从硬盘、DVD 和其他存储设备读取文件。\n\n`File` 对象可以表示已经存在的文件，也可以表示你想创建的文件。要创建一个\
  \ `File` 对象，使用文件名作为构造函数，如下例所示：\n\n点击此处查看代码图像\n\n```\nFile book = new File(\"address.dat\"\
  );\n```\n\n这会在当前文件夹中创建一个名为 `address.dat` 的文件对象。你还可以在文件名中包含路径：\n\n点击此处查看代码图像\n\n\
  ```\nFile book = new File(\"data\\\\address.dat\");\n```\n\n### NOTE\n\n此示例适用于 Windows\
  \ 系统，该系统使用反斜杠 `\\` 字符路径和文件名的分隔符。（代码示例中有两个反斜杠，是因为反斜杠是 Java 中的特殊字符）。Linux 和其他基于 Unix\
  \ 的系统使用正斜杠 `/` 字符。要编写一个不依赖操作系统即可引用文件的 Java 程序，请使用类变量 `File.pathSeparator` 代替正斜杠或反斜杠，如该语句所示：\n\
  \n```\nFile book = new File(\"data\" + File.pathSeparator + \"address.dat\");\n\
  ```\n\n创建一个 `File` 对象并并在你的计算机上创建文件。它只是对一个可能存在也可能不存在的文件的引用。\n\n当你有一个 `File` 对象时，可以调用该对象上的若干个有用方法：\n\
  \n![Image](img/arrow.jpg) `exists()`——如果文件存在则返回 `true`，否则返回 `false`\n\n![Image](img/arrow.jpg)\
  \ `getName()`——文件名，格式为 `String`\n\n![Image](img/arrow.jpg) `length()`——文件的大小，格式为\
  \ `long` 值\n\n![Image](img/arrow.jpg) `createNewFile()`——如果不存在，则创建一个同名文件\n\n![Image](img/arrow.jpg)\
  \ `delete()`——如果文件存在，则删除\n\n![Image](img/arrow.jpg) `renameTo(File)`——使用指定的 `File`\
  \ 对象名称作为参数重命名文件\n\n你也可以使用 `File` 对象表示系统上的文件夹而非文件。在 `File` 构造函数中指定文件夹名称，可以是绝对路径（如\
  \ `C:\\\\Documents\\\\`）或相对路径（如 `java\\\\database`）。\n\n在你获得一个表示文件夹的对象后，调用其 `listFiles()`\
  \ 方法查看文件夹内部的内容。该方法返回一个 `File` 对象数组，代表其中包含的每个文件和子文件夹。\n\n### Reading Data from a\
  \ Stream\n\n本小时的第一个项目是使用输入流从文件读取数据。你可以使用 `FileInputStream` 实现，它代表以字节形式读取的输入流。\n\n\
  你可以通过指定文件名或 `File` 对象作为参数创建文件输入流。如果访问文件发生错误，读写文件的方法可能会抛出 `IOException`，因此通常使用 `try`-catch`\
  \ 块。该异常属于 `java.io` 包。\n\n流是不再使用时必须关闭的资源之一。在程序运行时，让流开启状态会大量消耗 JVM 资源。\n\n一种名为 `try`-with-resources`\
  \ 的特殊 `try` 语句可以轻松确保资源（如文件输入流）在不再需要时被关闭。`try` 语句后跟着括号。括号内是一个或多个声明读写数据变量的 Java 语句。\n\
  \n这是一个使用名为 `stream` 的文件输入流读取名为 `cookie.web` 文件的示例：\n\n点击此处查看代码图像\n\n```\nFile cookie\
  \ = new File(\"cookie.web\");\n\ntry (FileInputStream stream = new FileInputStream(cookie))\
  \ {\n    System.out.println(\"Length of file: \" + cookie.length());\n} catch (IOException\
  \ ioe) {\n    System.out.println(\"Could not read file.\");\n}\n```\n\n由于 `stream`\
  \ 位于 `try` 语句中，当 `try`-catch` 块完成时（如果尚未关闭），流会自动关闭。\n\n文件输入流按字节读取数据。你可以通过调用不带参数的流的\
  \ `read()` 方法读取单个字节。如果由于到达文件末尾流中没有可用字节，则返回字节值 −1。\n\n当你读取输入流时，它从流中的第一个字节开始，例如文件的第一个字节。你可以通过调用带有一个参数的\
  \ `skip()` 方法来跳过流中的某些字节：参数是一个表示要跳过字节数的 `int`。以下语句跳过了名为 `scanData` 的流中的后续 1,024 个字节：\n\
  \n```\nscanData.skip(1024);\n```\n\n如果你想一次读取多个字节，请执行以下操作：\n\n![Image](img/arrow.jpg)\
  \ 创建一个大小与你想要读取的字节数完全一致的字节数组。\n\n![Image](img/arrow.jpg) 将该数组作为参数调用流的 `read()` 方法。数组将填充从流中读取的字节。\n\
  \n\n\n\n\n第一个项目从 MP3 音频文件中读取 ID3 数据。由于 MP3 是一种非常流行的音乐文件格式，在 ID3 文件的末尾通常会添加 128 字节，用于存储歌曲信息，例如标题、艺术家和专辑。\n\
  \n`ID3Reader` 应用程序使用文件输入流读取 MP3 文件，跳过最后 128 字节以外的所有内容。对剩余字节进行检查以确定是否包含 ID3 数据。如果是，前三个字节将是数字\
  \ 84、65 和 71。\n\n### 注意\n在 Java 支持的 Unicode 标准字符集包含的 ASCII 字符集中，这三个数字分别代表大写字母“T”、“A”和“G”。\n\
  \n在 `com.java24hours` 包下创建一个名为 `ID3Reader` 的新空 Java 文件，并将来自列表 20.1 的文本填入其中。\n\n\
  **列表 20.1 `ID3Reader.java` 的完整文本**\n\n点击此处查看代码图像\n\n```java\npackage com.java24hours;\n\
  \nimport java.io.*;\n\npublic class ID3Reader {\n    public static void main(String[]\
  \ arguments) {\n        File song = new File(arguments[0]);\n        try (FileInputStream\
  \ file = new FileInputStream(song)) {\n            int size = (int) song.length();\n\
  \            file.skip(size - 128);\n            byte[] last128 = new byte[128];\n\
  \            file.read(last128);\n            String id3 = new String(last128);\n\
  \            String tag = id3.substring(0, 3);\n            if (tag.equals(\"TAG\"\
  )) {\n                System.out.println(\"Title: \" + id3.substring(3, 32));\n\
  \                System.out.println(\"Artist: \" + id3.substring(33, 62));\n   \
  \             System.out.println(\"Album: \" + id3.substring(63, 91));\n       \
  \         System.out.println(\"Year: \" + id3.substring(93, 97));\n            }\
  \ else {\n                System.out.println(arguments[0] + \" does not contain\"\
  \n                        + \" ID3 info.\");\n            }\n            file.close();\n\
  \        } catch (IOException ioe) {\n            System.out.println(\"Error --\
  \ \" + ioe.toString());\n        }\n    }\n}\n```\n\n在将此类作为应用程序运行之前，你必须指定一个 MP3\
  \ 文件作为命令行参数（在 NetBeans 中使用“运行”、“设置项目配置”、“配置”）。程序可以使用任何 MP3 运行程序，例如 `Come On and\
  \ Gettit.mp3`，这是 Marion Black 创作的 1973 年被不公正遗忘的灵魂乐经典之。如果你的系统中有歌曲 `Come On and Gettit.mp3`（你确实应该拥有），图\
  \ 20.1 显示了 `ID3Reader` 应用程序的内容。\n\n![图像](img/20fig01.jpg)\n\n**图 20.1** 运行 `ID3Reader`\
  \ 应用程序。\n\n### 提示\n如果你电脑上没有 `Come On and Gettit.mp3`（在我看来这是一个巨大的错误），或其他任何 MP3，你可以通过\
  \ [`search.creativecommons.org`](http://search.creativecommons.org) 使用知识共享许可寻找可检查的\
  \ MP3 歌曲。\n\n知识共享是一组版权许可协议，规定了如歌曲之类的作品如何进行分发、编辑或重新发布。应用程序在列表 20.1 的第 11–12 行从 MP3\
  \ 读取最后 128 字节，并将其存储在 `byte` 数组中。该数组在第 13 行被用于创建一个包含这些字节所代表的字符的 `String` 对象。如果字符串的前三个字符是“TAG”，则说明正在检查的\
  \ MP3 文件包含 ID3 信息。在第 16–19 行中，调用了字符串的 `substring()` 方法来显示字符串的部分。ID3 格式始终将艺术家、歌曲、标题和年份信息放在最后\
  \ 128 字节的相同位置。某些 MP3 文件完全不包含 ID3 信息，或者以应用程序无法读取的另一种格式包含 ID3 信息。如果你是从购买的 `Eccentric\
  \ Soul` 拷贝创建了 `Come On and Gettit.mp3`，那么它包含可读的 ID3 信息。从音频 CD 创建 MP3 文件的程序从音乐行业数据库读取歌曲信息。在从\
