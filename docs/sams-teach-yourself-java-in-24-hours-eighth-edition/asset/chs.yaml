  \ `getTotalSpace()` 和 `getUsableSpace()` 方法来查找当前磁盘上有可用磁盘空间：\n\n点击此处查看代码图片\n\n```\n\
  long totalSpace = store.getTotalSpace();\nlong freeSpace = store.getUsableSpace();\n\
  double percent = (double)freeSpace / (double)totalSpace * 100;\n```\n\n### 注意\n\n\
  计算百分比的表达式包含许多对 `double` 的引用，这看起来可能很奇怪。第二次和第三次强制转换在表达式中使用之前将 `freeSpace` 和 `totalSpace`\
  \ 变量转换为 `double` 值。这是为了防止表达式产生整数值而不是浮点数，这是必要的。Java 通过表达式中的类型来确定表达式结果的数据类型。一个 `long`\
  \ 除以一个 `long` 再乘以整数 100 将产生一个 `long`，而不是预期的百分比。\n\n在最后语句中计算出的百分比可能是小数点后带有非常长数字数字，例如\
  \ 64.8675309。\n\n以下表达式将 `double` 类型的百分比转换为最多两位小数：\n\n点击此处查看代码图片\n\n```\npercent\
  \ = (int)(percent * 100) / (double)100;\n```\n\n表达式的前半部分将百分比乘以 100——将小数点向右移动两位——然后将其转换为整数，因此\
  \ 64.8675309 变成了 6487。\n\n后半部分将此结果结果除以 100——将小数点向左移动两位——以恢复百分比的近似值。这使得 6486 变成 64.86。\n\
  \n将百分比限制在两位小数后，标签的内容可以这样设置：\n\n点击此处查看代码图片\n\n```\nspace.setText(freeSpace + \" out\
  \ of \" + totalSpace + \" (\" + percent + \"%)\");\n```\n\n该应用程序在第 14 行创建一个 `FreeSpacePanel`\
  \ 组件并在第 15 行将其添加到框架中。\n\n当你运行应用程序时，它应该类似于图 17.8，带有你自己计算机的值。\n\n![Image](img/17fig08.jpg)\n\
  \n**图 17.8**\n\n显示自定义磁盘空间组件。\n\n### 总结\n\n用户已经习惯于为运行的程序提供点击式的视觉化环境。这种期望使得开发软件更具挑战性，但\
  \ Java 通过 Swing 将这些能力交给你，无论你使用什么种设置来运行 Java。\n\n使用 Swing 开发图形界面应用程序是练习面向对象编程的好方法。每个组件、容器和布局管理器都由它们自己的类表示。许多类从同一个父类继承共同行为。例如，在本小时中介绍的所有用户界面组件都是\
  \ `javax.swing.JComponent` 的子类。\n\n在下一小时中，你将通过使用新的布局管理器学习更多关于 GUI 设计的知识，这些管理器可以比\
  \ `FlowLayout` 更有效地指定组件在容器内的布局。\n\n### 工作坊\n\n#### 问答\n\n**问：如果我不为容器分配布局管理器，组件将如何排列？**\n\
  \n\n\n\n\n# A. 在像面板（panel）这样的简单容器中，组件默认使用 `FlowLayout` 进行布局。每个组件的添加方式与英文页面上的单词显示方式相同：从左到右，当空间不足时换到下一行。框架（Frames）、窗口和应用程序（applets）使用了你在下一个小时学习的\
  \ `BorderLayout` 默认布局样式。\n\n## Q. 为什么有许多图形用户界面类的名称前面都带有一个“J”字，例如 `JFrame` 和 `JLabel`？\n\
  \n### A. 这些类是 `Swing` 框架的一部分，它是 Java 类库中对图形用户界面类的第二次尝试。抽象窗口工具包（AWT）是第一次尝试，它的类名较简单，例如\
  \ `Frame` 和 `Label`。\n\n`AWT` 类属于 `java.awt` 包及相关包，而 `Swing` 类属于 `javax.swing` 等包，因此它们可以具有相同的类名。使用以“J”开头的命名可以防止类之间发生混淆。\n\
  \n`Swing` 类也称为 Java 基础类（JFC）。\n\n## Q. 我可以在哪里买到未裁剪的 1 美元钞票？\n\n### A. 美国印币发行局（Bureau\
  \ of Engraving and Printing）在网站 [www.moneyfactorystore.gov](http://www.moneyfactorystore.gov)\
  \ 销售真实的 1 美元、10 美元、20 美元和 50 美元钞票张。\n\n一张包含 25 张 1 美元的钞票售价 50.50 美元，16 张 10 美元售价\
  \ 249 美元，16 张 20 美元售价 409 美元，16 张 50 美元售价 920 美元。由于这些是实际货币，如果考虑到钞票的面值，这些购买更便宜。你为\
  \ 1 美元的额外付了 25.50 美元，10 美元的 89 美元，20 美元的 89 美元，以及 50 美元的 100 美元。\n\n还有一袋五磅装的 10,000\
  \ 美元碎钞钞，售价 45 美元。\n\n该局是唯一承认自己正在浪费钱的美国政府机构。\n\n## Quiz\n\n如果你的大脑还没有被这一小时的辛劳变成 GUI\
  \ 脑浆，请通过回答以下问题来测试你的技能。\n\n**[1].** 哪个用户组件被用作容器来存放其他组件？\n\nA. TupperWare\nB. `JPanel`\n\
  C. Choice\n\n**[2].** 在容器内必须首先执行哪项操作？\n\nA. 建立布局管理器\nB. 添加组件\nC. 无所谓\n\n**[3].**\
  \ 哪个方法决定了组件在容器内的排列方式？\n\nA. `setLayout()`\nB. `setLayoutManager()`\nC. `setVisible()`\n\
  \n## Answers\n\n**[1]. B.** `JPanel`。你可以向面板中添加组件，然后将面板添加到如框架（frame）等另一个容器中。\n\n\
  **[2]. A.** 在你以正确的方式添加它们之前，必须指定布局管理器。\n\n**[3]. A.** `setLayout()` 方法接受一个参数：负责决定组件应该放置在何处的布局管理器。\n\
  \n## Activities\n\n为了进一步接触 GUI 设计这一主题，请完成以下活动：\n\n- 修改 `SalutonFrame` 应用，使其在框架的主区域显示“Saluton!”而不是标题栏。\n\
  - 增强 `FreePanel` 组件，每三个位置显示一个逗号。一种方法是使用 `StringBuilder` 对象、`String` 类的方法 `charAt()`\
  \ 以及一个 `for` 循环来遍历字符串。\n\n要查看实现这些活动的 Java 程序，请访问书籍的网站 [www.java4hours.com](http://www.java4hours.com)。\n\
  \n# 第 18 小时 布局用户界面\n\n### 本小时的任务：\n\n- 创建一个布局管理器。\n- 为容器分配布局管理器。\n- 使用面板来组织界面中的组件。\n\
  - 处理不寻常的布局。\n- 为 Java 应用程序创建一个原型。\n\n当你开始为你的 Java 程序设计用户界面（GUIs）时，你面临的一个障碍是组件是可以移动的。每当容器尺寸发生变化（例如当用户调整框架大小时），它所包含的组件可能会重新排列以适应新的尺寸。\n\
  \n这种灵活性对你有利，因为它考虑了组件在不同操作系统上显示方式的差异。一个可点击的按钮在 Windows 中的外观可能与 Linux 或 Mac OS 的不同。\n\
  \n界面中的组件通过一组被称为“布局管理器”（layout managers）的类来组织。这些类定义了组件在容器内的显示方式。界面中的每个容器都可以有它自己的布局管理器。\n\
  \n### 使用布局管理器\n\n在 Java 中，组件在容器内的位置取决于组件的大小、其他组件的大小以及容器的高度和宽度。按钮、文本字段和其他组件的布局可能会受到以下因素的影响：\n\
  \n- 容器的大小\n- 其他组件的大小\n- 布局管理器\n\n有几种布局管理器可以使用来影响组件的显示方式。面板的默认管理器是 `java.awt` 包中的\
  \ `FlowLayout` 类，在上一个小时中使用过它。\n\n在 `FlowLayout` 下，组件掉落在某个区域的方式与英文页面上的单词组织方式相同——从左到右，当有更多空间时换到下一行。\n\
  \n以下示例可以用于框架，以便在添加组件时采用流布局：\n\n```\nFlowLayout topLayout = new FlowLayout();\nsetLayout(topLayout);\n\
  ```\n\n你也可以为特定容器（例如 `JPanel` 对象）设置布局管理器。你可以通过使用该容器对象的 `setLayout()` 方法来实现。\n\n本小时的项目是\
  \ `Crisis`，一个带有五个按钮的应用程序。在 `com.java24hours` 包创建一个名为 `Crisis` 的 Java 文件。将列表 18.1\
  \ 中的文本输入该文件并保存。\n\n### 列表 18.1 `Crisis.java` 的完整文本\n\n```java\npackage com.java24hours;\n\
  \nimport java.awt.*;\nimport javax.swing.*;\n\npublic class Crisis extends JFrame\
  \ {\n    JButton panicButton;\n    JButton dontPanicButton;\n    JButton blameButton;\n\
  \    JButton mediaButton;\n    JButton saveButton;\n\n    public Crisis() {\n  \
  \      super(\"Crisis\");\n        setLookAndFeel();\n        setSize(348, 128);\n\
  \        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        FlowLayout flo\
  \ = new FlowLayout();\n        setLayout(flo);\n        panicButton = new JButton(\"\
  Panic\");\n        dontPanicButton = new JButton(\"Don't Panic\");\n        blameButton\
  \ = new JButton(\"Blame Others\");\n        mediaButton = new JButton(\"Notify the\
  \ Media\");\n        saveButton = new JButton(\"Save Yourself\");\n        add(panicButton);\n\
  \        add(dontPanicButton);\n        add(blameButton);\n        add(mediaButton);\n\
  \        add(saveButton);\n        setVisible(true);\n    }\n\n    private void\
  \ setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  );\n        } catch (Exception exc) {\n            // ignore error\n        }\n\
  \    }\n\n    public static void main(String[] arguments) {\n        Crisis frame\
  \ = new Crisis();\n    }\n}\n```\n\n\n\n\n\n`FlowLayout` 类使用容器的尺寸作为布局组件的唯一依据。调整应用程序窗口的大小，可以看到组件如何根据响应即时进行重新排列。将窗口宽度增加一倍，所有的\
  \ `JButton` 组件将显示在同一行上。将窗口缩窄到足够程度，它们将全部垂直堆叠。\n\n### `GridLayout` 布局管理器\n\n`java.awt`\
  \ 包中的 `GridLayout` 类用于将容器中的所有组件组织成特定数量的行和列。所有组件在显示区域中分配相同的大小，因此，如果你指定一个宽三列、高三行的网格，容器就会被划分为九个等大的区域。\n\
  \n`GridLayout` 在添加所有组件时，会将它们放置在网格的某个位置。组件从左到右添加，直到某一行填满，然后填充下一个网格最左侧的列。\n\n以下语句创建了一个容器并将其设置为使用两行三列的网格布局：\n\
  \n点击此处查看代码图片\n\n```\nGridLayout grid = new GridLayout(2, 3);\nsetLayout(grid);\n\
  ```\n\n图 18.2 显示了如果 `Crisis` 应用程序使用网格布局将会是什么样子。\n\n![Image](img/18fig02.jpg)\n\n\
  **图 18.2**\n\n使用网格布局安排组件。\n\n### `BorderLayout` 布局管理器\n\n同样位于 `java.awt` 包中的 `BorderLayout`\
  \ 类将组件安排在容器内的特定位置，这些位置由五个方向之一标识：北、南、东、西或中心。\n\n`BorderLayout` 管理器将组件组织成五个区域：四个由罗盘方向表示，另外一个用于中心区域。当你在此布局下添加组件时，`add()`\
  \ 方法包含第二个参数，以指定组件应该放置的位置。该参数应该是 `BorderLayout` 类的五个类变量之一：`NORTH`、`SOUTH`、`EAST`、`WEST`\
  \ 和 `CENTER` 用于此参数。\n\n与 `GridLayout` 类类似，`BorderLayout` 将所有可用空间都分配给组件。放置在中间的组件将获得四个边界组件所需的所有空间，因此它通常是最大的。\n\
  \n以下语句创建了一个使用边界布局的容器：\n\n点击此处查看代码图片\n\n```\nBorderLayout crisisLayout = new BorderLayout();\n\
  setLayout(crisisLayout);\nadd(panicButton, BorderLayout.NORTH);\nadd(dontPanicButton,\
  \ BorderLayout.SOUTH);\nadd(blameButton, BorderLayout.EAST);\nadd(mediaButton, BorderLayout.WEST);\n\
  add(saveButton, BorderLayout.CENTER);\n```\n\n图 18.3 显示了这在 `Crisis` 应用程序中对应的样子。\n\
  \n![Image](img/18fig03.jpg)\n\n**图 18.3**\n\n使用边界布局安排组件。\n\n### `BoxLayout` 布局管理器\n\
  \n另一个实用的布局管理器 `javax.swing` 包中的 `BoxLayout` 使得在单行内水平或垂直地堆叠组件成为可能。\n\n要使用此布局，请创建一个面板来存放组件，然后创建一个带有两个参数的布局管理器：\n\
  \n![Image](img/arrow.jpg) 要在框框布局中组织的组件\n\n![Image](img/arrow.jpg) 用于垂直对齐的 `BoxLayout.Y_AXIS`\
  \ 值和用于水平对齐的 `BoxLayout.X_AXIS` 值\n\n这里是堆叠 `Crisis` 组件的代码：\n\n点击此处查看代码图片\n\n```\n\
  JPanel pane = new JPanel();\nBoxLayout box = new BoxLayout(pane, BoxLayout.Y_AXIS);\n\
  pane.setLayout(box);\npane.add(panicButton);\npane.add(dontPanicButton);\npane.add(blameButton);\n\
  pane.add(mediaButton);\npane.add(saveButton);\nadd(pane);\n```\n\n图 18.4 显示了结果如何。\n\
  \n![Image](img/18fig04.jpg)\n\n**图 18.4**\n\n使用框框布局堆叠组件。\n\n### 使用 `Insets` 分离组件\n\
  \n当你在容器内安排组件时，可以使用 `Insets` 将组件远离容器边缘，`Insets` 是一个表示容器边界区域的对象。\n\n`Insets` 类是 `java.awt`\
  \ 包的一部分，它有一个接受四个参数的构造函数：容器在 `top`、`left`、`bottom` 和 `right` 侧留出的空间。每个参数都使用像素指定，这与定义框架大小时使用的测量单位相同。\n\
  \n以下语句创建了一个 `Insets` 对象：\n\n点击此处查看代码图片\n\n```\nInsets around = new Insets(10, 6,\
  \ 10, 3);\n```\n\n`around` 对象表示一个容器边界，其顶部内部 10 像素，左侧内部 6 像素，底部内部 10 像素以及右侧内部 3 像素。\n\
  \n要在容器中使用 `Insets` 对象，你必须重写容器的 `getInsets()` 方法。该方法没有参数并返回一个 `Insets` 对象，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\npublic Insets getInsets() {\n    Insets around = new Insets(10,\
  \ 6, 10, 3);\n    return around;\n}\n```\n\n图 18.5 显示了它的样子。\n\n![Image](img/18fig05.jpg)\n\
  \n**图 18.5**\n\n使用内边距添加空间。\n\n图 18.5 显示的容器顶部 50 像素、左侧 15 像素、底部 10 像素右侧 15 像素。\n\n\
  注意 `JFrame` 有内置内边距来为标题栏。当你重写 `getInsets()` 并设置自己的值时，容器会在下方显示组件。\n\n### 布局应用程序\n\n\
  到目前为止看到的布局管理器应用于整个框架。使用了框架的 `setLayout()` 方法，但当你尝试开发 GUI 时，通常会发现没有任何布局是合适的。\n\n\
  一种方法是使用一组 `JPanel` 对象作为容器包含 GUI 的不同部分。你可以通过使用每个 `JPanel` 的 `setLayout()` 方法为每个部分设置不同的布局规则。在这些面板包含所需的组件后，你可以将面板直接添加到框架中。\n\
