  \ 行——调用 `gateway` 对象的 `connect()` 方法。\n\n### 总结\n\n在创建第一类对象并将几个类组织成层级结构后，你应该对“面向对象编程”这个术语以及有趣的缩写\
  \ OOP 感到更加熟悉了。在接下来的两个小时里，随着你开始创建更复杂的对象，你将学习更多对象行为和属性的知识。\n\n随着你对这种开发风格越来越熟悉，程序、类和对象等术语将更有意义。OOP\
  \ 是一个需要时间来适应的概念。当你掌握了它之后，你会发现它是设计、开发和调试计算机程序的一种有效方式。\n\n### 工作坊\n\n#### 问答\n\n**问：类可以继承多个类吗？**\n\
  \n**答：** 在某些编程语言（如 C++）中类是可以的，但 Java 不行。多继承是一项强大的功能，但它让 OOP 变得更难学习和使用。Java 开发者决定任何类只能继承一个父类，尽管一个类可以有许多子类。补偿这种限制的一种方法是从一种称为接口（interface）的特殊类型类继承方法。你将在第\
  \ 15 节“创建多线程程序”中学习更多关于接口的知识。\n\n**问：什么时候你想创建一个非（public）方法？**\n\n**答：** 主要的情况是该方法专门供你正在编写的程序使用。如果你正在编写一个游戏程序，并且你的\
  \ `shootRayGun()` 方法专门针对你编写的游戏，那么它可以是一个私有方法。要让一个方法不是 `public`，只需在方法名前省略 `public`\
  \ 语句即可。\n\n**问：为什么 `char` 值可以像 `int` 值一样使用？**\n\n**答：** 字符可以被用作 `int` 变量，因为每个字符都有一个对应的数字代码，代表它在字符集中的位置。如果你有一个名为\
  \ `k` 值为 67 的变量，类型转换 `(char) k` 会产生字符值‘C’，因为根据 ASCII 字符集，与大写 C 关联的数字是 67。ASCII 字符集是\
  \ Java 语言采用的 Unicode 字符标准的一部分。\n\n**问：Tabasco 辣椒酱会变质吗？**\n\n**答：** 不，尽管如果你把开过的瓶留好几年，它的颜色会发生。醋、红辣椒和盐的成分对于细菌生长是一个极其恶劣的环境。\n\
  \nTabasco 辣椒酱的 McIlhenny 公司表示，原品牌的保质期为五年。其他版本的保质期从 18 个月到三年不等。\n\n作为该产品的忠实粉丝，很难相信有人会留一瓶\
  \ Tabasco 久到产生这个问题。\n\n### 测验\n\n以下问题测试了你对对象以及使用它们的程序的了解。\n\n**1。** 使用什么语句来允许一个类继承另一个类？\n\
  \n**A.** `inherits`\n\n**B.** `extends`\n\n**C.** `handItOverAndNobodyGetsHurt`\n\
  \n**2。** 为什么编译后的 Java 程序以 `.class` 文件扩展名保存？\n\n**A.** Java 开发者认为这是一种很有格调语言。\n\n\
  **B.** 这是对世界上老师的微妙致敬。\n\n**C.** 每个 Java 程序都是一个类。\n\n**3。** 组成对象的两个要素是什么？\n\n**A.**\
  \ 属性和行为\n\n**B.** 命令和数据文件\n\n**C.** 唾液和醋\n\n#### 答案\n\n**1. B.** 使用 `extends` 语句是因为子类是父类以及类层级结构中更上任何父类属性和行为的扩展。\n\
  \n**2. C.** 你的程序始终由至少一个主类以及其他所需的类组成。\n\n**3. A.** 在某种意义上，B 也是正确的，因为命令可以比比行为，数据文件类比于属性。\n\
  \n#### 活动\n\n如果你不反对，可以通过以下活动来 `extends` 你对本小时主题的知识：\n\n![Image](img/arrow.jpg) 创建一个速度为\
  \ 300 且拥有自己的 `connect()` 方法的 `Commodore64Modem` 类。\n\n![Image](img/arrow.jpg) 为\
  \ modem 添加一个 `disconnect()` 方法。\n\n## 第 11 节描述你的对象像什么\n\n### 本节待办事项：\n\n- ![Image](img/arrow.jpg)\
  \ 为对象创建变量。\n- ![Image](img/arrow.jpg) 使用对象的对象的方法。\n- ![Image](img/arrow.jpg) 调用一个方法并返回一个值。\n\
  - ![Image](img/arrow.jpg) 创建构造函数。\n- ![Image](img/arrow.jpg) 向方法发送参数（此处原文 arguments\
  \ 译为参数）。\n- ![Image](img/arrow.jpg) 使用 `this` 引用对象。\n- ![Image](img/arrow.jpg) 创建新对象。\n\
  \n正如你在上一节学习面向对象编程（OOP）时所知，对象是组织程序的一种方式使其拥有完成任务所需的一切。对象由属性和行为组成。\n\n属性是存储在对象中的信息可以是整数、字符和布尔值等变量，或者是\
  \ `String` 或 `Calendar` 等对象。\n\n要查看实现这些 Java 程序，请访问书籍网站。\n\n\n\n\n将变量设为 `public`（公有的）使得另一个使用\
  \ `Gremlin` 对象的程序修改该变量。\n\n如果另一个程序想要分配另一个创建者，例如，它可以将 `creator` 修改为该值。以下语句创建了一个名为\
  \ `gizmo` 的 `Gremlin` 对象并设置了它的 `creator` 变量：\n\n点击此处查看代码图像\n\n```\nGremlin gizmo\
  \ = new Gremlin();\ngizmo.creator = \"Joe Dante\";\n```\n\n在 `Gremlin` 类中，`creator`\
  \ 变量也是 `public` 的，因此它可以从其他程序中自由更改。另一个变量 `maximumAge` 只能在类内部使用。\n\n当你将类中的变量设为 `public`\
  \ 时，该类就失去了对其他程序如何使用该变量的控制权。在很多情况下，这可能不是问题。例如，`creator` 变量可以更改为任何识别格灵精创建者的名称。\n\n\
  限制对变量的访问可以防止当另一个程序错误设置变量时发生错误。`maximumAge` 变量包含格灵精以其当前形式存在的小时数。将 `maximumAge` 设置为负值是没有意义的。如果\
  \ `Gremlin` 对象类需要防止这种问题，你需要做以下两件事：\n\n![Images](img/arrow.jpg) 将变量从 `public` 改为\
  \ `protected`（受保护的）或 `private`（私有的），这是两种提供更严格访问限制的语句。\n\n![Images](img/arrow.jpg)\
  \ 添加行为来更改变量的值并向其他程序报告变量的值。\n\n你只能在变量所在的同一个类、该类的任何子类，或者同一个包（package）中的类中使用 `protected`\
  \ 变量。包是一组具有共同目的的相关类。一个例子是 `java.util` 包，它包含了提供如日期和时间编程以及文件归档等实用工具的类。当你在 Java 程序中使用带有星号的\
  \ `import` 语句时，例如 `import java.util.*`，你就可以更方便地在程序中引用该包中的类。\n\n`private` 变量的限制比\
  \ `protected` 变量更加严格——你只能在同一个类中使用它。除非你确定变量可以更改为任何内容而不影响其类的功能，否则你应该将变量设为 `private`\
  \ 或 `protected`。\n\n以下语句使 `guid` 变为 `private` 变量：\n\n```\nprivate int guid;\n```\n\
  \n如果你想让其他程序以某种方式使用 `guid` 变量，你必须创建一个使其成为可能的行为。这项任务将在本节后面的部分介绍。\n\n还有另一种访问控制类型：在创建变量时没有任何\
  \ `public`、`private` 或 `protected` 语句。\n\n在你在此节之前开发的大多数程序中，你并没有指定任何访问控制。当没有设置访问控制时，该变量仅对同一个包中的类可用。这被称为默认访问（default\
  \ access）或包访问（package access）。\n\n### 创建类变量\n\n当你创建一个对象时，它拥有作为对象类一部分的所有变量的独立版本。从\
  \ `Gremlin` 对象类创建的每个对象都有它们自己的版本的 `guid`、`maximumAge` 和 `creator` 变量。如果你修改了某个对象中的其中一个变量，它将不会影响另一个\
  \ `Gremlin` 对象中的相同变量。\n\n有时，属性应该描述整个对象类而不是特定对象本身。这些被称为**类变量**（class variables）。如果你想跟踪程序中使用多少个\
  \ `Gremlin` 对象，你可以可以使用类变量来存储此信息。整个类只存在一个变量副本。你到目前为止为对象创建的变量可以被称为**对象变量**（object\
  \ variables），因为它们与特定的对象相关。\n\n这两种变量的创建和使用方式是相同的，但 `static` 是创建类变量语句的一部分。以下语句为 `Gremlin`\
  \ 示例创建了一个类变量：\n\n```\nstatic int gremlinCount = 0;\n```\n\n更改类变量的值与更改对象的变量没有区别。如果你有一个名为\
  \ `stripe` 的 `Gremlin` 对象，你可以使用以下语句更改类变量 `gremlinCount`：\n\n```\nstripe.gremlinCount++;\n\
  ```\n\n因为类变量适用于整个类，你也可以使用类名来代替：\n\n```\nGremlin.gremlinCount++;\n```\n\n这两条语句都实现了相同的功能，但在处理类变量时使用类名的一个优势是，它能立即看出\
  \ `gremlinCount` 是类变量而不是对象变量。如果你在处理类变量时总是使用对象名，那么在不仔细查看源代码的情况下，你就无法判断它们是类变量还是对象变量。\n\
  \n类变量也被称为**静态变量**（static variables）。\n\n**注意**\n\n虽然类变量很有用，但你必须小心不要过度使用。这些变量在类运行期间一直存在。如果将大型对象数组存储在类变量中，它将占用大量的内存且永远释放。\n\
  \n### 使用方法创建行为\n\n属性是跟踪对象类信息的方法，但为了让一个类执行它被创建时的任务，你必须创建行为。行为描述了类中完成特定任务的部分。这些部分每一个被称为**方法**（method）。\n\
  \n到此为止，你一直在程序中使用方法而自己并不知道，其中包含一个特定的方法：`println()`。此方法显示文本。与变量一样，方法也是与对象或类结合使用的。对象或类名后面跟着一个点和方法名，例如\
  \ `object.move()` 或 `Integer.parseInt()`。\n\n**注意**\n\n`System.out.println()` 方法看起来很奇怪，因为它有两个点。这是因为该语句涉及两个类：`System`\
  \ 类和 `PrintStream` 类。`System` 类有一个 ` `Print`  变量。`println()` 是 `PrintStream` 类的方法。`System.out.println()`\
  \ 语句实际上意味着“使用 `System` 类的 `out` 实例的 `println()` 方法”。\n\n### 声明方法\n\n你创建方法的语句与开启类的语句相似。两者都可以在名称后的括号内接收参数，并且都在开始和结束处使用\
  \ `{` 和 `}`。区别在于方法处理后可以返回结果。结果可以是简单类型（如整数或布尔值），也可以是一个类。\n\n以下是 `Gremlin` 类用来创建一个新格灵精的方法示例：\n\
  \n点击此处查看代码图像\n\n```\npublic Gremlin replicate(String creator) {\n    Gremlin noob\
  \ = new Gremlin();\n    noob.creator = \"Steven Spielberg\";\n    return noob;\n\
  }\n```\n\n此方法接收单个参数：字符串变量 `creator`，它是一个代表创建者的变量。\n\n在开启方法的语句中，`Gremlin` 位于方法名 `replicate`\
  \ 之前。该语句表示方法处理后将返回一个 `Gremlin` 对象。`return` 语句才是实际发送对象的。在这个方法中，返回的是 `noob` 的值。\n\n\
  如果方法不应该返回，请在声明方法的语句中使用 `void` 关键字。\n\n当方法返回结果时，你可以将方法作为表达式的一部分。例如，如果你创建了一个名为 `haskins`\
  \ 的 `Gremlin` 对象，你可以使用如下语句：\n\n点击此处查看代码图像\n\n```\nif (haskins.active() == true)\
  \ {\n```\n\n\n\n\n```java\nSystem.out.println(haskins.guid + \" is active.\");\n\
  }\n```\n\n你可以在程序中任何本可以使用变量的地方使用一个返回值的方法。\n\n在这一小时的早些时候，你将 `guid` 变量更改为了 `private`，以防止它被其他程序读取或修改。\n\
  \n当一个实例变量为 `private` 时，仍然有一种方法可以让 `guid` 在其他地方使用：在 `Gremlin` 类中创建 `public` 方法，用以获取\
  \ `guid` 的值并为 `guid` 设置一个新值。这些新方法应该是 `public` 的，这与 `guid` 变量本身不同，这样它们可以在其他程序中被调用。\n\
  \n考虑以下两个方法：\n\n点击此处查看代码图片\n\n```java\npublic int getGuid() {\n    return guid;\n\
  }\n\npublic void setGuid(int newValue) {\n    if (newValue > 0) {\n        guid\
  \ = newValue;\n    }\n}\n```\n\n这些方法被称为*访问器方法*（accessor methods），因为它们允许从其他对象访问 `guid`\
  \ 变量。\n\n`getGuid()` 方法用于检索 `guid` 的当前值。`getGuid()` 方法没有任何参数，但方法名后必须有括号。`setGuid()`\
  \ 方法接受一个整数参数 `newValue`。这个参数是 `guid` 的新值。如果 `newValue` 大于 0，将进行更改。\n\n在这个示例中，`Gremlin`\
  \ 类控制 `guid` 变量如何被其他类使用。这个过程被称为*封装*（encapsulation），它是面向对象编程的基本概念。当对象能够防止误用时，它们在其他程序中使用得更有用。\n\
  \n尽管 `guid` 是 `private` 的，但新方法 `getGuid()` 和 `setGuid()` 能够操作 `guid`，因为它们在同一个类中。\n\
  \n**提示**\n\n集成开发环境（IDE）通常可以自动创建访问方法。NetBeans 提供了这种功能。打开第 10 节，“创建第一个对象”。在代码编辑器器的任何地方右键点击，选择菜单\
  \ `Refactor`（重构）、`Encapsulate Fields`（封装字段）。会弹出一个对话框。点击 `All`（全部），然后点击 `Refactor`。NetBeans\
  \ 将 `speed` 变量变为 `private` 并创建 `getSpeed()` 和 `setSpeed()` 方法。\n\n### 具有不同参数的相似方法\n\
  \n正如你在 `setGuid()` 方法中所，你可以向方法传递参数来影响它的行为。类中的不同方法可以有不同的名称，但如果参数不同，方法也可以有相同的名称。\n\
  \n如果参数的数量或参数类型不同，两个方法可以具有相同的名称。例如，对于 `Gremlin` 类对象可能有两个 `countHuman()` 方法。一个可以没有参数，另一个可以指定一个字符串作为参数。以下语句实现了这些方法：\n\
  \n点击此处查看代码图片\n\n```java\nvoid countHuman() {\n    System.out.println(\"That gotta\
  \ hurt!\");\n}\n\nvoid countHuman(String taunt) {\n    System.out.println(taunt);\n\
  }\n```\n\n方法的名称相同，但参数不同：一个没有参数，另一个有一个 `String` 参数。方法的参数被称为方法的签名（signature）。只要每个方法的签名不同，类就可以拥有相同名称的方法。\n\
  \n### 构造方法\n\n当你想要在程序中创建一个对象时，会使用 `new` 语句，例如：\n\n点击此处查看代码图片\n\n```java\nGremlin\
  \ clorr = new Gremlin();\n```\n\n该语句创建了一个名为 `clorr` 的新 `Gremlin` 对象。当你使用 `new` 语句时，会调用该对象的特殊方法。此方法被称为构造方法，因为它处理创建对象所需的工作。构造方法的作用是设置变量并调用对象正常运行所需的方法。\n\
  \n构造方法的定义与其他方法相似，但它们不能返回值。以下是 `Gremlin` 类的两个构造方法：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ Gremlin() {\n    creator = \"Michael Finnell\"; // creator 是一个字符串\n    maximumAge\
  \ = 240; // maximumAge 是整数\n}\n\npublic Gremlin(String name, int age) {\n    creator\
  \ = name;\n    maximumAge = age;\n}\n```\n（注：提供的源文本在构造方法块中存在一些格式不一致之处，我已将其清理为标准的\
  \ Java 语法并保留了逻辑）。\n\n根据提供的文本：\n```java\npublic Gremlin() {\n    creator = \"Michael\
  \ Finnell\"; // creator 是一个字符串\n    maximumAge = 240; // maximumAge 是整数\n}\n\npublic\
  \ Gremlin(String name, int age) {\n    creator = name;\n    maximumAge = age;\n\
  }\n```\n\n`new` 语句用于创建对象。构造方法处理创建对象所需的工作，设置变量并调用对象正常运行的方法。\n\n构造方法的定义与其他方法相似，但它们不能返回值。\n\
  \n### 类方法\n\n与类变量一样，类方法是提供与整个类相关而非特定对象的功能的方法。当方法没有影响单个对象的操作时，使用类方法。在第 10 节中，你使用了\
  \ `Integer` 类的 `parseInt()` 方法将字符串转换为 `int` 类型变量：\n\n点击此处查看代码图片\n\n```java\nint\
  \ fontSize = Integer.parseInt(fontText);\n```\n\n这是一个类方法。要使一个方法成为类方法，在方法名前单元使用 `static`，如下代码所示：\n\
  \n点击此处查看代码图片\n\n```java\nstatic void showGremlinCount() {\n    System.out.println(\"\
  There are \" + gremlinCount + \" gremlins\");\n}\n```\n\n类变量 `gremlinCount` 之前用于跟踪程序创建了多少个\
  \ `Gremlin` 对象。`showGremlinCount()` 方法是一个显示这个总数，你可以通过如下语句调用它：\n\n```java\nGremlin.showGremlinCount();\n\
  ```\n\n### 方法内部的作用域\n\n当你在一个类的方法内部创建变量或对象时，它只在该方法内部可用。这种现象是因为变量作用域的概念。作用域是变量在程序中存在的块。如果你离开了由作用域定义的程序部分，就无法再次使用该变量。\n\
  \n程序中的 `{` 和 `}` 括号定义了变量作用域的边界。在这些标记内创建的任何变量无法在外部使用。例如，考虑以下语句：\n\n```java\nif (numFiles\
  \ < 1) {\n    String warning = \"No files remaining.\";\n}\n\nSystem.out.println(warning);\n\
  ```\n\n\n\n\n这段代码无法运行——在 NetBeans 中无法编译——因为 `warning` 变量是在 `if` 块的括号内部创建的。这些括号定义了变量的作用域。`warning`\
  \ 变量在括号外部不存在，因此 `System.out.println()` 方法无法将其作为参数使用。\n\n当你在一组括号内部嵌套另一括号时，需要注意被包含变量的作用域。请看示例：\n\
  \n点击此处查看代码图像\n\n```java\nif (humanCount < 5) {\n    int status = 1;\n    if (humanCount\
  \ < 1) {\n        boolean firstGremlin = true;\n        status = 0;\n    } else\
  \ {\n        firstGremlin = false;\n    }\n}\n```\n\n发现任何问题了吗？在这个示例中，`status` 变量可以在代码块内的任何地方使用，但为\
  \ `firstGremlin` 变量赋值为 `false` 的语句会导致编译器错误。因为 `firstGremlin` 是在 `if (humanCount\
  \ < 1)` 语句的作用域内创建的，所以它在随后的 `else` 语句的作用域内不存在。\n\n要修复这个问题，必须在这两个代码块之外创建 `firstGremlin`，这样它的作用域就能包含这两个块。一种解决方案是在创建\
  \ `status` 之后的一行创建 `firstGremlin`。\n\n强制作用域的规则使得程序更易调试，因为作用域限制了可以使用变量的区域。这减少了编程中可能出现的常见错误之一：在程序的不同部分以不同的方式使用同一个变量。\n\
  \n作用域的概念也适用于方法，因为方法是由左括号和右括号定义的。在方法内部创建的变量不能在其他方法中使用。只有当变量是作为对象变量或类变量被创建时，你才能在多个方法中使用它。\n\
  \n### 将一个类放在另一个类内部\n\n尽管 Java 程序被称为一个类，但在很多情况下，程序需要多个类来完成工作。这些程序由一个主类和任何所需的辅助类组成。\n\
  \n当你将程序划分为多个类时，有两种定义辅助类的方法。一种方法是分别定义每个类，如下例所示：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ class Wrecker {\n    String creator = \"Phoebe Cates\";\n    public void destroy()\
  \ {\n        GremlinCode gc = new GremlinCode(1024);\n    }\n}\n\nclass GremlinCode\
  \ {\n    int vSize;\n    GremlinCode(int size) {\n        vSize = size;\n    }\n\
  }\n```\n\n在这个示例中，`GremlinCode` 类是 `Wrecker` 类的辅助类。辅助类有时定义在与其协助的类相同的源文件中。当编译源文件时，会产生多个类文件。前面的示例在编译时会生成\
  \ `Wrecker.class` 和 `GremlinCode.class` 文件。\n\n**注意**\n\n如果在同一个源文件中定义了多个类，则只能有一个类是\
  \ `public` 的。其他类在类语句中不应包含 `public` 关键字。源文件的名称必须与它定义的 `public` 类名匹配。\n\n在创建主类和辅助类时，你也可以将辅助类放在主类内部。这样做，该辅助类被称为内部类（inner\
  \ class）。\n\n你将内部类放在另一个类的左括号和右括号之间：\n\n点击此处查看代码图像\n\n```java\npublic class Wrecker\
  \ {\n    String creator = \"Hoyt Axton\";\n    public void destroy() {\n       \
  \ GremlinCode vic = new GremlinCode(1024);\n    }\n    class GremlinCode {\n   \
  \     int vSize;\n        GremlinCode(int size) {\n            vSize = size;\n \
  \       }\n    }\n}\n```\n\n你可以像使用其他类型的辅助类一样使用内部类。主要的区别（除了位置之外）是编译器处理完这些类后发生了什么。内部类不会获得其\
  \ `class` 语句指定的名称。相反，编译器会给它们一个包含主类名的名称。\n\n在前面的示例中，编译器生成了 `Wrecker.class` 和 `Wrecker$GremlinCode.class`。\n\
  \n**注**\n\n内部类允许在 Java 中实现复杂的编程技术，这些技术在你对语言有更多经验后会更有意义。准确地说，再过 5 个小时。本书将在第 16 小时“使用内部类和闭包”中回到这个主题。\n\
  \n### 使用 `this` 关键字\n\n由于你可以引用其他类中的变量和方法，以及你自己类中的变量和方法，在某些情况下，你引用的变量可能会变得混淆。使其更清晰的一种方法是使用\
  \ `this`。\n\n当你使用对象的方法或变量时，将对象的名称放在前面。考虑这些示例：\n\n点击此处查看代码图像\n\n```java\nGremlin\
  \ mogwai = new Gremlin();\nmogwai.creator = \"Love\";\nmogwai.set(75);\n```\n\n\
  程序中的某些时刻你需要引用当前对象——也就是说，由程序表示的对象。例如，在 `Gremlin` 类内部，你可能会有一个如下的方法：\n\n点击此处查看代码图像\n\
  \n```java\nvoid checkCreator() {\n    String creator = null;\n}\n```\n\n通过使用 `this`，你可以明确引用的是哪个变量或方法。在类中任何需要引用对象的地方都可以使用\
  \ `this`。例如，如果你想将当前对象作为参数传递，可以使用如下语句：\n\n点击此处查看代码图像\n\n```java\nSystem.out.println(this);\n\
  ```\n\n在许多情况下，不需要 `this` 来明确你正在引用一个对象。然而，每当你确定自己引用的是正确的内容时，使用 `this` 没有任何坏处。\n\n\
  `this` 关键字在构造函数设置对象的实例变量时非常有用。考虑一个具有 `creator` 和 `maximumAge` 变量的 `Gremlin` 对象。此构造函数设置了它们：\n\
  \n点击此处查看代码图像\n\n```java\nGremlin(String creator, int maximumAge) {\n    this.creator\
  \ = creator;\n    this.maximumAge = maximumAge;\n}\n```\n\n### 使用类方法和变量\n\n在本小时，你创建一个简单的\
  \ `Gremlin` 对象，它可以统计程序创建了多少 `Gremlin` 对象并报告总数。\n\n你熟悉操作：在 NetBeans 中选择 File，New\
  \ File，并在 `com.java24hours` 包中创建一个名为 `Gremlin` 的空文件。在源编辑器中输入列表 11.1。点击保存。\n\n**列表\
  \ 11.1 `Gremlin.java` 的完整文本**\n\n点击此处查看代码图像\n\n```java\npackage com.java24hours;\n\
  \npublic class Gremlin {\n    static int gremlinCount = 0;\n\n    public Gremlin()\
  \ {\n        gremlinCount++;\n    }\n\n    static int getGremlinCount() {\n    \
  \    return gremlinCount;\n    }\n}\n```\n\n\n\n保存文件，NetBeans 会自动编译。此类缺少 `main()`\
  \ 方法，因此无法直接运行。为了测试这个新的 `Gremlin` 类，你需要创建第二个类，该类能够创建 `Gremlin` 对象。\n\n`GremlinLab`\
  \ 类是一个简单的应用程序，它创建 `Gremlin` 对象，然后通过 `Gremlin` 类的类方法 `getGremlinCount()` 统计已创建的对象数量。\n\
  \n在 NetBeans 中打开一个新文件并输入列表 11.2。完成后，请将文件保存为 `GremlinLab.java`。\n\n**列表 11.2** `GremlinLab.java`\
  \ 的完整文本\n\n点击此处此处查看代码图像\n\n```java\n1: package com.java24hours;\n\n2:\n\n3: public\
  \ class GremlinLab {\n4:     public static void main(String[] arguments) {\n5: \
  \        int numGremlins = Integer.parseInt(arguments[0]);\n6:         if (numGremlins\
  \ > 0) {\n7:             Gremlin[] gremlins = new Gremlin[numGremlins];\n8:    \
  \         for (int i = 0; i < numGremlins; i++) {\n9:                 gremlins[i]\
  \ = new Gremlin();\n10:            }\n11:             System.out.println(\"There\
  \ are \" + Gremlin.getGremlinCount()\n12:                 + \" gremlins.\");\n13:\
  \         }\n14:     }\n15: }\n```\n\n`GremlinLab` 类是一个在命令行运行时接收一个参数的应用程序：即要创建的\
  \ `Gremlin` 对象的数量。要在 NetBeans 中指定命令行参数，请执行以下操作：\n\n1. 选择 **Run, Set Project Configuration,\
  \ Customize**。打开项目属性对话框。\n2. 在 `Main Class` 字段中输入 `GremlinLab`，并在 `Arguments` 字段中输入你希望程序创建的\
  \ `Gremlin` 对象数量。\n3. 点击 **OK** 关闭对话框。\n\n要运行已配置参数的程序，请在 NetBeans 中选择 **Run, Run\
  \ Main Project**。\n\n参数通过发送到 `main()` 方法的字符串数组读取到应用程序中。在 `GremlinLab` 类中，这发生在第 4\
  \ 行。\n\n要将参数作为整数处理，必须将参数从 `String` 对象转换为整数。这需要使用 `Integer` 类的 `parseInt()` 类方法。在第\
  \ 5 行，根据命令行发送到程序的第一个参数创建了一个名为 `numGremlins` 的 `int` 变量。\n\n如果 `numGremlins` 变量大于\
  \ 0，则 `GremlinLab` 应用程序中会发生以下情况：\n\n* 第 7 行——创建一个 `Gremlin` 对象数组，由 `numGremlins`\
  \ 变量决定数组中对象的数量。\n* 第 8–10 行——使用 `for` 循环调用数组中每个 `Gremlin` 对象的构造方法。\n* 第 11–12 行——在所有\
  \ `Gremlin` 对象构造完成后，使用 `Gremlin` 类的类方法 `getGremlinCount()` 计算已创建的对象数量。这应该与你运行 `GremlinLab`\
  \ 应用程序时设置的参数相符。\n\n如果 `numGremlins` 变量不大于 0，则 `GremlinLab` 应用程序中什么都不会发生。\n\n在编译\
  \ `GremlinLab.java` 文件后，使用任何你想尝试的命令行参数对其进行测试。可以创建的 `Gremlin` 对象数量取决于运行 `GremlinLab`\
  \ 应用程序时系统可用的内存。\n\n\n\n\n# 3. B. 当变量在作用域外使用时，编译器会报错。\n\n#### 活动\n\n如果这些关于“小怪兽”的谈论没有吓跑你，你可以通过以下活动来增加对本小时主题的了解：\n\
  \n![Images](img/arrow.jpg) 在 `Gremlin` 类中添加一个名为 `guid` 的 `private` 整数变量。创建方法来返回\
  \ `guid` 的值，并仅当新值在 `1,000,000` 到 `9,999,999` 之间时才更改 `guid` 的值。\n\n![Images](img/arrow.jpg)\
  \ 编写一个 Java 程序，接收一个字符串类型的参数，将其转换为 `float` 变量，然后将其转换为 `Float` 对象，最后将其转换为 `int` 变量。使用不同的参数运行几次，观察结果的变化。\n\
  \n要查看实现这些活的 Java 程序，请访问书籍的网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 12 小时：充分利用现有对象\n\n### 本小时的待办事项：\n\n![Image](img/arrow.jpg) 设计超类和子类。\n\n![Image](img/arrow.jpg)\
  \ 建立继承层次结构。\n\n![Image](img/arrow.jpg) 重写方法。\n\nJava 对象非常适合“繁衍”。当你创建一个对象（一组属性和行为）时，你实际上设计了一个准备好将这些特质传递给后代的实体。这些子对象继承了父类的大许多相同属性和行为。它们也可以以不同于父的方式执行某些事情。\n\
  \n这种系统被称为继承，是每个超类（父类）赋予其子类（孩子）的东西。继承是面向对象编程（OOP）最有用的方面之一，你将在本小时学习到它。\n\nOOP 的另一个有用方面是能够创建一个可以在不同程序中使用的对象。重用性使得开发无错误、可靠的程序变得更容易。\n\
  \n## 继承的力量\n\n当你每次使用如 `String` 或 `Integer` 等标准 Java 类时，你都使用了继承。Java 类被组织成金字塔形的类层次结构，其中所有类都继承自\
  \ `Object` 类。\n\n对象类继承自其上方的所有超类。为了直观地理解其运作方式，请考虑 `InputStreamReader` 类。该类是 `FileReader`\
  \ 的超类，`FileReader` 是从文件中读取文本行的类。`FileReader` 类是 `InputStreamReader` 的子类。\n\n`InputStreamReader`\
  \ 的部分家族树如图图 12.1 所示。每个框都是一个类，线条将超类与其方的任何子类连接起来。\n\n![Image](img/12fig01.jpg)\n\n\
  **图 12.1**\n\n`InputStreamReader` 类的家族树。\n\n顶部是 `Object` 类。`InputStreamReader` 在层次结构中上方有两个超类：`Reader`\
  \ 和 `Object`。它在层次结构下方有一个子类：`FileReader`。\n\n`InputStreamReader` 类继承了 `Reader` 和\
  \ `Object` 类的属性和行为，因为它们在超类层次结构中直接位于它的上方。`InputStreamReader` 不继承自图 12.1 中橙色的类 `BufferedReader`、`UrlReader`\
  \ 和 `LineNumberReader` 的任何内容，因为它们不在它的层次结构上方。\n\n如果这看起来很令人困惑，可以将层次结构想象成一个家族树。`InputStreamReader`\
  \ 继承自它的父类并向上延伸。然而，`InputStreamReader` 类并不继承自它的兄弟或堂兄弟。\n\n创建一个新类可以归结为以下任务：你只需要定义它与现有类不同的之处即可。其余的工作将由系统为你完成。\n\
  \n### 继承行为和属性\n\n类的行为和属性是两件事的结合：它自身的行为和属性，以及它从超类继承的所有行为和属性。\n\n以下是 `InputStreamReader`\
  \ 的一些行为和属性：\n\n![Image](img/arrow.jpg) `equals()` 方法确定一个 `InputStreamReader` 对象是否与另一个对象具有相同的值。\n\
  \n![Image](img/arrow.jpg) `getEncoding()` 方法返回流使用的字符编码名称。\n\n![Image](img/arrow.jpg)\
  \ `reset()` 方法将流的当前位置移回起点。\n\n![Image](img/arrow.jpg) `mark()` 方法标记当前位置。\n\n`InputStreamReader`\
  \ 类可以使用所有这些方法，尽管 `getEncoding()` 是唯一没有从其他类继承的方法。`equals()` 方法定义在 `Object` 中，而 `reset()`\
  \ 和 `mark()` 都来自 `Reader`。\n\n### 重写方法\n\n在 `InputStreamReader` 对象类中定义的某些方法也定义在它的某个超类中。例如，`close()`\
  \ 方法既是 `InputStreamReader` 类的一部分，也是 `Reader` 类的一部分。当方法在子类及其超类中定义时，将使用子类的方法。这允许子类更改、替换或完全消除其超类的某些行为或属性。\n\
  \n在子类中创建一个新方法以更改继承自超类的行为被称为*重写*（overriding）该方法。每当继承的行为产生非预期的结果或你想做某些事情时，都需要重写方法。\n\
  \n### 建立继承\n\n使用 `extends` 语句将类定义为另一个类的子类，如下：\n\n```\nclass FileReader extends InputStreamReader\
  \ {\n    // 行为和属性\n}\n```\n\n`extends` 语句将 `FileReader` 类建立为 `InputStreamReader`\
  \ 的子类。文件读取器都应该是输入读取器的子类。它们需要该类提供的功能来读取文件。\n\n`FileReader` 可以重写的一个方法是 `close()` 方法，它在读取文本后执行关闭文件的必要操作。由\
  \ `Reader` 类实现的 `close()` 方法一直传递到 `FileReader`。\n\n要重写方法，你必须以与其继承的超类中的声明相同声明该方法。`public`\
  \ 方法必须保持为 `public`，方法的返回值必须相同，且参数的数量和类型不能更改。\n\n`Reader` 类的 `read()` 方法如下：\n\n```java\n\
  public int read(char[] buffer) {\n```\n\n当 `FileReader` 重写此方法时，它必须如下所示开头：\n\n```java\n\
  public int read(char[] cbuf) {\n```\n\n区别在于 `char` 数组的，这在判断方法是否以相同方式创建时并不重要。这两个语句匹配是因为以下内容相同：\n\
  \n![Image](img/arrow.jpg) 两个方法都是 `public`。\n\n![Image](img/arrow.jpg) 两个方法都返回一个整数。\n\
  \n![Image](img/arrow.jpg) 两个方法都以 `char` 数组作为唯一参数。\n\n在子类中重写方法时，应该在方法声明前加上 `@Override`，如此示例所示：\n\
  \n```java\n@Override\npublic void setPosition(int x, int y) {\n    if ( (x > 0)\
  \ & (y > 0) ) {\n        super.setPosition(x, y);\n    }\n}\n```\n\n\n\n\n\n`@Override`\
  \ 文本是一种特殊的注释被称为注解（annotation），它能告诉 Java 编译器比它自己能推断出的更多的信息。通过在方法前加上 `@Override` 注解，你给了编译器一个机会来检查该方法是否真的重写了父类方法。如果没有重写——例如，你可能漏掉了第二个整数参数——程序将无法编译。\n\
  \n如果没有这个注解，编译器就无法发现这个潜在问题。没有第二个整数参数的方法看起来就像任何其他方法一样。\n\n## 在子类中使用 `this` 和 `super`\n\
  \n在子类中，两个极其有用的关键字是 `this` 和 `super`。\n\n正如你在过去一个小时内中学到的那样，`this` 关键字用于引用当前对象。当你创建一个类并需要引用从该类创建的特定对象时，你可以使用\
  \ `this`，如下所示：\n\n```java\nthis.title = \"Cagney\";\n```\n\n该语句将对象的 `title` 实例变量设置为文本“Cagney”。\n\
  \n`super` 关键字的作用与之类似：它引用对象的直接父类。你可以通过几种不同的方式使用 `super`：\n\n- ![Image](img/arrow.jpg)\
  \ 引用父类的构造函数，例如 `super(\"Adam\", 12);`\n- ![Image](img/arrow.jpg) 引用父类的变量，例如 `super.hawaii\
  \ = 50`\n- ![Image](img/arrow.jpg) 引用父类的方法，例如 `super.dragnet();`\n\n使用 `super` 关键字的一种方式是在子类的构造函数中。因为子类继承了其父类的行为和属性，你必须将该子类的每个构造函数与其父类的构造函数关联起来。否则，某些行为和属性可能无法正确设置，导致子类无法正常工作。\n\
  \n通过 `super` 访问的变量不能是 `private`，因为这些在子类中是不可用的。\n\n为了关联构造函数，子类构造函数的第一语句必须是对父类构造函数的调用。这需要\
  \ `super` 关键字，如下语句所示：\n\n点击此处查看代码图像\n\n```java\npublic DataReader(String name, int\
  \ length) {\n    super(name, length);\n}\n```\n\n这个示例是子类的构造函数，它使用语句 `super(name,\
  \ length)` 来调用其父类中可比的构造函数。\n\n如果你不使用 `super()` 调用父类中的构造函数，Java 在子类构造函数开始时自动调用无参数的\
  \ `super()`。如果这个父类构造函数不存在或提供了意外的行为，就会导致错误，因此最好自己调用父类构造函数。\n\n## 与现有对象操作\n\n面向对象编程（OOP）鼓励重用。如果你为某个\
  \ Java 编程项目开发了一个对象，那么可以在不修改的情况下将该对象整合到另一个项目中。\n\n如果一个 Java 类设计得良好，就可能让该类在其他程序中使用。你的程序中可用的对象越多，你在创建自己的软件时需要的工作就越少。如果有一个符合你需求的优秀拼写检查对象，你可以使用它而不是编写自己的。理想情况下，你甚至可以给老板留下一个关于为项目添加拼写检查功能花费多久时间的假象，并利用这段额外时间在办公室打长途电话。\n\
  \n**注意**\n\n本书作者像他许多业内人士一样，是自由职业并在居家工作。在评估他关于如何在职场中表现的建议时，请记住这一点。\n\n当 Java 首次引入时，共享对象的系统在很大程度上是非正式的。程序员开发对象时尽可能保持独立，并通过使用私有变量以及读写这些变量的公共方法来保护它们免受误用。\n\
  \n当有一个标准方法来开发重用对象（如 `JavaBeans`）时，共享对象变得更加强大。\n\n标准化的益处包括：\n\n- ![Image](img/arrow.jpg)\
  \ 不需要过多记录对象如何工作的文档，因为任何知道标准的人已经知道很多关于它的功能。\n- ![Image](img/arrow.jpg) 你可以设计遵循标准的开发工具，从而能够更容易地与这些对象工作。\n\
  - ![Image](img/arrow.jpg) 两个遵循标准的对象可以相互作用，而无需特殊的编程来使它们兼容。\n\n`JavaBeans` 是遵循严格规则的对象，规则规定了它们的创建方式以及实例变量的使用方式。遵循规则的\
  \ Java 类被称为 `bean`。可以使用 NetBeans IDE 来制作 bean。在 NetBeans 中使用 `JavaBeans` 的入门教程请访问\
  \ [`wiki.netbeans.org/NetBeansJavaBeansTutorial`](http://wiki.netbeans.org/NetBeansJavaBeansTutorial)。\n\
  \n## 在 Array Lists 中存储同类对象\n\n编写计算机程序时要做的重要决定之一是将数据存储。在本书的前半部分，你发现了三个存放信息的有用地方：\n\
  \n- ![Image](img/arrow.jpg) 基础数据类型，如 `int` 和 `char`（或它们相应的类）\n- ![Image](img/arrow.jpg)\
  \ 数组\n- ![Image](img/arrow.jpg) `String` 对象\n\n存储信息的地方多得多，因为任何 Java 类都可以持有数据。最有用之一是\
  \ `ArrayList`，它是一种持有同类对象的数据结构。\n\n正如名称所示，数组列表像数组，但它们的大小可以增长或收缩。`ArrayList` 类属于 `java.util`\
  \ 包，这是最实用的包之一。通过 `import` 语句使其在程序中可用：\n\n```java\nimport java.util.ArrayList;\n\
  ```\n\n上述语句使用泛型创建一个列表。列表的类名放在 `<` 和 `>` 字符之间，如下所示：\n\n点击此处查看代码图像\n\n```java\nArrayList<String>\
  \ structure = new ArrayList<String>();\n```\n\n如果你在使用旧版本的 Java 使用列表，你将这样写构造函数：\n\
  \n点击此处\n\n```java\nArrayList structure = new ArrayList();\n```\n\n虽然你可以这样做，但泛型让你的代码更可靠，因为它们给了编译器一种防止更多错误的方法。在这里，它们阻止你通过放入错误的对象类来误用列表。如果你尝试向预期持有\
  \ `String` 的列表放入 `Integer` 对象，编译器会报错。\n\n与数组不同，数组列表在创建时没有固定的元素数量。列表创建时有 10 个元素。如果你知道要存储比这多多的对象，可以指定大小作为构造函数的参数。创建一个\
  \ 300 元素列表语句：\n\n点击此处查看代码图像\n\n```java\nArrayList<String> structure = new ArrayList<String>(300);\n\
  ```\n\n你可以通过调用 `add()` 方法将对象添加到列表，并将对象作为唯一的参数：\n\n```java\nstructure.add(\"Vance\"\
  );\nstructure.add(\"Vernon\");\nstructure.add(\"Velma\");\n```\n\n你按顺序添加对象，因此如果这些是添加到\
  \ `structure` 的前三个对象，元素 0 是“Vance”，元素 1 是“Vernon”，元素 2 是“Velma”。\n\n\n\n\n你通过调用\
  \ `get()` 方法并将元素的索引号作为参数，从列表中检索一个元素：\n\n点击此处查看代码图片\n\n```\nString name = structure.get(1);\n\
  ```\n\n该语句将“Vernon”存储在 `name` 字符串中。\n\n要检查列表的某个元素中是否包含某个对象，请调用其 `contains()` 方法并将该对象作为参数：\n\
  \n点击此处查看代码图片\n\n```\nif (structure.contains(\"Velma\")) {\n    System.out.println(\"\
  Velma found\");\n}\n```\n\n你可以使用对象本身或其索引号从列表中删除对象：\n\n```\nstructure.remove(0);\n\
  structure.remove(\"Vernon\");\n```\n\n这两条语句后，“Velma” 成为列表中唯一的字符串。\n\n## 遍历数组列表（Array\
  \ List）\n\nJava 包含一种特殊的 `for` 循环，可以轻松地加载数组列表并依次检查其每个元素。\n\n这个循环只有两个部分，比你在 第 8 小节\
  \ “用循环重复操作”中学到的 `for` 循环少了一个。\n\n第一部分是初始化部分：用于持有从列表中检索的每个对象的变量类和名称。该对象应该属于持有列表的同一个类。\n\
  \n第二部分是标识列表。\n\n以下是遍历 `structure` 列表并将每个名称显示在屏幕的代码：\n\n点击此处查看代码图片\n\n```\nfor (String\
  \ name : structure) {\n    System.out.println(name);\n}\n```\n\n本节的第一个项目是 `StringLister`，该应用程序将演示数组列表和特殊的\
  \ `for` 循环，展示一个按字母顺序排列的字符串列表。该列表来自数组和命令行参数。\n\n在 NetBeans 中打开你的 Java24 项目，选择 File（文件）、New\
  \ File（新建文件），然后在 `com.java24hours` 包中创建一个一个名为 `StringLister` 的新 Empty Java File（空\
  \ Java 文件）。在源编辑器中输入 代码列表 12.1 并保存文件。\n\n**列表 12.1** StringLister.java 的完整文本。\n\n\
  点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\nimport java.util.*;\n\npublic\
  \ class StringLister {\n    String[] names = { \"Carly\", \"Sam\", \"Kiki\", \"\
  Lulu\",\n        \"Hayden\", \"Elizabeth\", \"Kristina\", \"Molly\", \"Laura\" };\n\
  \n    public StringLister(String[] moreNames) {\n        ArrayList<String> list\
  \ = new ArrayList<String>();\n        for (int i = 0; i < names.length; i++) {\n\
  \            list.add(names[i]);\n        }\n        for (int i = 0; i < moreNames.length;\
  \ i++) {\n            list.add(moreNames[i]);\n        }\n        Collections.sort(list);\n\
  \        for (String name : list) {\n            System.out.println(name);\n   \
  \     }\n    }\n\n    public static void main(String[] arguments) {\n        StringLister\
  \ lister = new StringLister(arguments);\n    }\n}\n```\n\n在运行应用程序之前，你应该使用 Run（运行）、Set\
  \ Configuration（设置配置）命令将主类设置为 `com.java24hours.StringLister`，并将参数设置为一个或多个由空格分隔的，例如\
  \ `Scotty Jason Dillon`。然后选择 Run Project（运行项目）查看结果。在命令行指定的名称被添加到第 6–7 行存储在数组中的名称中。由于在程序运行之前不知道名称的总数，因此列表比数组更适合这些字符串的存储媒介。列表中的字符串使用\
  \ `Collections` 类的一个方法按字母顺序排序：`Collections.sort(list)`。该类与 `ArrayList` 一样属于 `java.util`\
  \ 包。数组列表和其他有用结构被称为集合（collections）。当你运行程序时，输出应该是按字母顺序排列的名称列表（参见图 12.2）。数组列表的灵活尺寸允许你的额外名称添加到数据结构中与其他名称一起排序。\n\
  \n**图 12.2** `StringLister` 程序的输出。\n\n### 创建子类\n\n为了看到继承的工作示例，在下一个项目中，你创建一个名为 `Point3D`\
  \ 的类，表示三维空间中的一个点。你可以用 `(x,y)` 坐标表示二维点。三维空间增加了第三个坐标，可以称为 `z`。\n\n`Point3D` 类的对象可以做三件事：\n\
  \n- 跟踪对象的 `(x,y,z)` 坐标\n- 将对象移动到新的 `(x,y,z)` 坐标\n- 按指定的 `x`、`y` 和 `z` 值增量移动对象\n\n\
  Java 已经有一个表示二维维点的标准类，称为 `Point`。该类可以在 `java.awt` 包中找到。它有两个名为 `x` 和 `y` 的整数变量，用于存储\
  \ `Point` 对象的 `(x,y)` 位置。它还有一个用于将 `Point` 对象放置在 `(x,y)` 位置的 `move()` 方法，以及一个按指定的\
  \ `x` 和 `y` 移动对象的 `translate()` 方法。\n\n在 Java2 项目中，在 `com.java24hours` 包中创建一个名为\
  \ `Point3D` 的 Empty File，并将代码列表 12.2 的文本输入其中。完成后保存文件。\n\n**列表 12.2** Point3D.java\
  \ 的完整文本。\n\n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\nimport java.awt.*;\n\
  \npublic class Point3D extends Point {\n    int z;\n\n    public Point3D(int x,\
  \ int y, int z) {\n        super(x,y);\n        this.z = z;\n    }\n\n    public\
  \ void move(int x, int y, int z) {\n        super(x,y);\n        this.z = z;\n \
  \   }\n\n    public void translate(int x, int y) {\n        this.z += z;\n    }\n\
  }\n```\n\n`Point3D` 类没有 `main()` 方法，因此你无法将其作为应用程序运行，但在任何需要三维点的地方都可以使用。`Point3D`\
  \ 类只执行其父类 `Point` 未完成的工作。这主要涉及对整数变量 `z` 的跟踪，并将其作为 `move()` 方法、`translate()` 方法和\
  \ `Point3D()` 构造函数的参数。所有方法都使用了关键字 `super` 和 `this`。`this` 语句用于引用当前的 `Point3D` 对象，因此第\
  \ 10 行的 `this.z = z` 将变量 `z` 设置为传递给方法的值。`super` 语句引用父类 `Point`。第 9 行的 `super(x,y)`\
  \ 调用了父类中的 `Point(x,y)` 构造函数，然后设置 `Point3D` 对象的 `(x,y)` 坐标。由于 `Point` 已经能够处理 `x`\
  \ 和 `y` 轴，让 `Point3D` 类也这样做是多余的。\n\n为了测试新的 `Point3D` 类，创建一个使用 `Point` 和 `Point3D`\
