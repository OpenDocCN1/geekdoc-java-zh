  \ 10 像素。第 56–57 行设置了这个网格：\n\n```java\nGridLayout layout2 = new GridLayout(2, 7,\
  \ 10, 10);\nrow2.setLayout(layout2);\n```\n\n第 4 行使用 `GridLayout` 将组件排列成两行三列宽的网格。\n\
  \n`LottoMadness` 应用程序使用了在本节中描述的若干个组件。第 9–37 行用于设置构成界面的所有组件的对象。这些语句按行组织。首先为该行创建一个\
  \ `JPanel` 对象，然后设置在该行上的每个组件。这段代码创建了所有组件和容器，但除非使用 `add()` 方法将它们添加到应用程序的主框架中，否则它们不会显示。\n\
  \n在第 47–100 行中，添加了组件。以下是 `LottoMadness()` 构造函数的示例：\n\n```java\nFlowLayout layout1\
  \ = new FlowLayout(FlowLayout.CENTER, 10, 10);\noption.add(quickpick);\noption.add(personal);\n\
  row1.setLayout(layout1);\nrow1.add(quickpick);\nrow1.add(personal);\nadd(row1);\n\
  ```\n\n\n\n\n\n# A. 在灰色字段上已使用 `setEditable()` 方法，使其无法被编辑。文本字段的默认行为是允许用户通过点击其边界内部并输入任何更改来改变文本字段的值。然而，某些字段的目的是显示信息，而不是接收用户的输入。`setEditable()`\
  \ 方法可以防止用户更改他们不应该修改的字段。\n\n# Q. 在电影*《查理和巧克力工厂》*中，是否真的存在过一个名叫威利·旺卡的金奖票获得者，其结局由于惨烈到不适合在电影中呈现而消失了？\n\
  \n# A. 米兰达·派克（Miranda Piker）的命运非常凄惨，以至于她从罗尔德·达尔的书《查理和巧克力工厂》的初稿中被删除了，这本书启发了 1971\
  \ 年的电影及其 2005 年的重拍版。派克是一个自大的孩子，她认为孩子永远不应该玩，这样他们就可以一直上学。她的父亲是一位校长。\n\n派克和旺卡工厂的其它金奖票获得者被引向了“斑点粉”（Spotty\
  \ Powder），这是一种糖制的调制剂，会导致食用者身上长出红斑，这样他们就可以假装生病旷课。派克和她的父亲非常愤怒，并决定摧毁制造这种粉的机器。\n\n当隔壁房间传来他们的尖叫声时，旺卡解释说他们进入了将糖果原料磨成粉的地方。“那是配方的一部分，”他告诉米兰达的母亲，“我们偶尔得用掉一两个校长，否则机器就不起作用。”\n\
  \n奥姆帕人（Oompa-Loompas）用歌唱庆祝她的应得报应：“噢，米兰达·玛丽·派克，/谁会喜欢她呢，/一个如此古板又令人作呕的小鬼。/于是我们说，‘为什么不把她/放进斑点粉搅拌机里/那我们就一定比以前更喜欢她了。’/很快，这个如此恶毒的孩子/就会变得非常美味，/她的同学一定会明白/不再是说：‘米兰达！/噢，这个野兽！我们受不了她了！’/他们会说：‘噢，多好用，多棒！’”\n\
  \n### 测验\n要检查你的脑细胞布局是否正确，请通过回答以下问题来测试你的 Java 布局管理技能。\n\n**1.** 在将接口划分为不同的布局管理器时，通常使用哪种容器？\n\
  \n**A.** `JWindow`\n**B.** `JPanel`\n**C.** `Container`\n\n**2.** 面板（panel）的默认布局管理器是什么？\n\
  \n**A.** `FlowLayout`\n**B.** `GridLayout`\n**C.** 无默认值\n\n**3.** `BorderLayout`\
  \ 命名源于哪里？\n\n**A.** 每个组件的边界\n**B.** 组件沿容器边界组织的方式\n**C.** Java 开发者纯粹的随性性\n\n####\
  \ 答案\n**1. B.** `JPanel`，它是最简单的容器。\n\n**2. A.** 面板使用流式布局（flow layout），但帧（frames）和窗口（windows）的默认布局管理器是边界布局（border\
  \ layout）。\n\n**3. B.** 在将组件添加到容器时，你必须使用如 `BorderLayout.WEST` 和 `BorderLayout.EAST`\
  \ 等方向变量来指定组件的边界位置。\n\n#### 活动\n如果你想继续下去（包括网格和边界），请尝试以下活动：\n\n![Image](img/arrow.jpg)\
  \ 创建 `Crisis` 应用程序的修改版本，将 `panic` 和 `dontPanic` 对象组织在一个布局管理器下，将其余三个按钮放在另一个下。\n\n\
  ![Image](img/arrow.jpg) 复制 `LottoMadness.java` 文件，你可以将其重命名为 `NewMadness.java`。修改此程序，使快速选择或个人选择变为组合框（combo\
  \ box），并将开始、停止和重置按钮变为复选框（check boxes）。\n\n要查看实现这些活动的 Java 程序，请访问书籍网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n## 第 19 小\n响应用户输入\n\n### 本小时任务列表：\n- ![Image](img/arrow.jpg) 让你的程序感知事件。\n- ![Image](img/arrow.jpg)\
  \ 设置一个组件使其能触发事件。\n- ![Image](img/arrow.jpg) 找出事件在程序流向何处。\n- ![Image](img/arrow.jpg)\
  \ 在接口中存储信息。\n- ![Image](img/arrow.jpg) 存储在文本字段中的值。\n\n你在过去两个小时内开发的图形用户界面（GUI）可以独立运行。用户可以点击按钮、在文本字段中填充文本并调整窗口大小。迟早，即使是最不挑剔的用户也会想要更多功能。程序提供的\
  \ GUI 必须在发生鼠标点击或键盘输入时引发某些事情发生。\n\n当你的 Java 程序能够响应用户事件时，这些事情就变得可能。这被称为事件处理（event\
  \ handling），是本小时的主要内容。\n\n### 让你的程序学会监听\nJava 中的用户事件是用户使用鼠标、键盘或其他输入设备执行操作时发生的事情。\n\
  \n在接收事件之前，你必须学习如何让对象进行监听。响应用户事件需要使用一个或多个 `EventListener` 接口。接口是 Java 面向编程的一种特性，允许类继承原本情况下无法的行为。\n\
  \n接口就像是类之间的一种契约。`EventListener` 接口包含了接收特定类型输入的方法。\n\n添加 `EventListener` 接口需要两件事。首先，因为监听类属于\
  \ `java.event` 包，你必须通过以下语句使其可用：\n\n```\nimport java.awt.event.*;\n```\n\n其次，类必须使用\
  \ `implements` 关键字来声明它支持的接口。以下语句创建一个使用 `ActionListener` 的类，用于响应按钮点击：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Graph implements ActionListener {\n```\n\n`EventListener`\
  \ 接口允许 GUI 组件产生用户事件。如果没有监听器，组件无法被程序的其他部分听到。程序必须为其监听的每种组件包含一个监听接口。要让程序响应按钮点击或文本字段中按下回车键，你必须包含\
  \ `ActionListener` 接口。响应选择列表或复选框，你需要 `ItemListener` 接口。\n\n当你在同一个类中需要多个接口时，在 `implements`\
  \ 关键字后用逗号分隔它们的名称，如下代码所示：\n\n点击此处查看代码图片\n\n```java\npublic class Graph3D implements\
  \ ActionListener, MouseListener {\n\n// ...\n}\n```\n\n### 设置组件以便监听\n在你实现了特定组件所需的接口后，你必须让该组件产生用户事件。`ActionListener`\
  \ 接口监听动作事件，例如按钮点击或按下回车键。\n\n要让 `JButton` 对象产生事件，请使用 `addActionListener()` 方法，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\nJButton fireTorpedos = new JButton(\"Fire torpedos\");\n\
  \nfireTorpedos.addActionListener(this);\n```\n\n这段代码创建了 `fireTorpedos` 按钮并调用了按钮的\
  \ `addActionListener()` 方法。作为 `addActionListener()` 方法参数的 `this` 关键字表示当前对象接收事件并根据需要进行处理。\n\
  \n注意\n`this` 关键字在首次引入时会让很多读者感到困惑。`this` 指向出现关键字的实例。因此，如果你在一个 `LottoMadness` 类中并在该类的语句中使用\
  \ `this`，它指的是执行该代码的 `LottoMadness` 对象。\n\n\n\n\n\n## 处理用户事件\n\n当带有监听器的组件生成用户事件时，会自动调用一个方法。该方法必须在将监听器挂载到组件时所指定的类中找到。\n\
  \n每个监听器都有不同的方法被调用以接收其事件。`ActionListener` 接口将事件发送到名为 `actionPerformed()` 的方法。以下是\
  \ `actionPerformed()` 方法的一个简短示例：\n\n点击此处查看代码图片\n\n```java\npublic void actionPerformed(ActionEvent\
  \ event) {\n    // 方法写在此处\n}\n```\n\n程序中发送的所有动作事件（action events）都会发送到这个方法。如果程序中只有一个组件可能发送动作事件，你可以在此方法中放置语句来处理事件。如果有多个组件可以发送这些事件，则你需要检查发送给方法的对象。\n\
  \n`ActionEvent` 对象被发送到 `actionPerformed()` 方法。有几类对象表示程序中可以生成的用户事件。这些类具有的方法可以确定是哪个组件导致了事件的发生。在\
  \ `actionPerformed()` 方法中，如果 `ActionEvent` 对象的名为 `event`，你可以使用以下语句识别组件：\n\n点击此处查看代码图片\n\
  \n```java\nString cmd = event.getActionCommand();\n```\n\n`getActionCommand()` 方法返回一个字符串。如果组件是按钮，该字符串就是按钮上的标签。如果它是文本字段，该字符串就是字段中输入的文本。`getSource()`\
  \ 方法返回导致事件的对象。\n\n你可以使用以下 `actionPerformed()` 方法来接收来自三个组件的事件：一个名为 `start` 的 `JButton`\
  \ 对象，一个名为 `speed` 的 `JTextField`，以及另一个名为 `viscosity` 的 `JTextField`：\n\n点击此处查看代码图片\n\
  \n```java\npublic void actionPerformed(ActionEvent event) {\n    Object source =\
  \ event.getSource();\n    if (source == speed) {\n        // speed 字段导致事件\n    }\
  \ else if (source == viscosity) {\n        // viscosity 字段导致事件\n    } else {\n \
  \       // start 按钮导致事件\n    }\n}\n```\n\n对所有用户事件调用 `getSource()` 方法，以识别导致事件的特定对象。\n\
  \n## 复选框和组合框事件\n\n组合框和复选框需要 `ItemListener` 接口。调用组件的 `addItemListener()` 方法可以使其生成这些事件。以下语句创建了一个名为\
  \ `superSize` 的复选框，它在选中或取消选中时会发送用户事件：\n\n点击此处查看代码图片\n\n```java\nJCheckBox superSize\
  \ = new JCheckBox(\"Super Size\", true);\nsuperSize.addItemListener(this);\n```\n\
  \n这些事件由 `itemStateChanged()` 方法接收，该方法接受 `ItemEvent` 对象作为参数。要查看哪个对象导致了事件，你可以调用事件对象的\
  \ `getItem()` 方法。\n\n要确定复选框是被选中还是取消选中，将 `getStateChange()` 方法的返回值与常量 `ItemEvent.SELECTED`\
  \ 和 `ItemEvent.DESELECTED` 进行比较。以下代码是名为 `item` 的 `ItemEvent` 对象的示例：\n\n点击此处查看代码图片\n\
  \n```java\npublic void itemStateChanged(ItemEvent item) {\n    int status = item.getStateChange();\n\
  \    if (status == ItemEvent.SELECTED) {\n        // item 被选中了\n    }\n}\n```\n\n\
  要确定 `JComboBox` 对象中选中的值，使用 `getItem()` 并将该值转换为字符串，如下所示：\n\n点击此处查看代码图片\n\n```java\n\
  Object which = item.getItem();\nString answer = which.toString();\n```\n\n## 键盘事件\n\
  \n当程序必须在按下键后立即做出反应时，它会使用键盘事件和 `KeyListener` 接口。\n\n第一步是通过调用组件的 `addKeyListener()`\
  \ 方法来注册接收按键输入的组件。方法的参数应该是实现 `KeyListener` 接口的对象。如果是当前类，则使用 `this` 作为参数。\n\n处理键盘事件的对象必须实现三个方法：\n\
  \n![Image](img/arrow.jpg) `keyPressed(KeyEvent)`——在按键按下的瞬间调用的方法\n\n![Image](img/arrow.jpg)\
  \ `keyReleased(KeyEvent)`——在按键释放的瞬间调用的方法\n\n![Image](img/arrow.jpg) `keyTyped(KeyEvent)`——在按键按下并释放后调用的方法\n\
  \n这些方法都返回 `void` 而不是值。这些方法每个都接受一个 `KeyEvent` 对象作为参数，可以通过调用该对象的方法获取更多事件信息。调用 `getKeyChar()`\
  \ 方法可以找到按下的是哪个键。该键作为 `char` 值返回，且只能用于字母、数字和标点符号。\n\n要监控任何键（包括 Enter、Page Up 和 Page\
  \ Down），你应该调用 `getKeyCode()`。该方法返回一个整数。然后你使用该整数调用 `getText()`，以接收一个包含按键名称的 `String`\
  \ 对象（例如 Home、F1 等）。\n\n点击此处查看代码图片\n\n```java\npackage java24;\n\nimport javax.swing.*;\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class KeyViewer extends JFrame\
  \ implements KeyListener {\n    JTextField keyText = new JTextField(80);\n    JLabel\
  \ keyLabel = new JLabel(\"在文本框中按下任意键.\");\n\n    public KeyViewer() {\n        super(\"\
  KeyViewer\");\n        setLookAndFeel();\n        setSize(350, 100);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        keyText.addKeyListener(this);\n        BorderLayout bord = new BorderLayout();\n\
  \        setLayout(bord);\n        add(keyLabel, BorderLayout.NORTH);\n        add(keyText,\
  \ BorderLayout.CENTER);\n        setVisible(true);\n    }\n\n    @Override\n   \
  \ public void keyTyped(KeyEvent input) {\n        char key = input.getKeyChar();\n\
  \        keyLabel.setText(\"你按下了 \" + key);\n    }\n\n    @Override\n    public\
  \ void keyPressed(KeyEvent txt) {\n        // 无需操作\n    }\n\n    @Override\n   \
  \ public void keyReleased(KeyEvent txt) {\n        // 无需操作\n    }\n\n    private\
  \ void setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\"\
  com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\");\n        } catch (Exception\
  \ exc) {\n            // 忽略错误\n        }\n    }\n\n    public static void main(String[]\
  \ arguments) {\n        KeyViewer frame = new KeyViewer();\n    }\n}\n```\n\n当你运行该程序时，它看起来应该像图\
  \ 19.1。\n\n![Image](img/19fig01.jpg)\n\n**图 19.1**\n\n程序中处理键盘事件。\n\n## 启用和禁用组件\n\
  \n你可能在程序中见过某个组件呈现阴影状态，而不是正常外观。\n\n\n\n\n阴影表示用户无法对该组件进行任何操作，因为其未启用。启用和禁用组件是通过组件的\
  \ `setEnabled()` 方法完成的。该方法接收一个布尔值作为参数，因此 `setEnabled(true)` 启用组件以便，而 `setEnabled(false)`\
  \ 则禁用它。\n\n以下语句创建了标签为 Previous（上一个）、Next（下一个）和 Finish（完成）的按钮，并禁用了第一个按钮：\n\n点击此处查看代码图片\n\
  \n```java\nJButton previousButton = new JButton(\"Previous\");\nJButton nextButton\
  \ = new JButton(\"Next\");\nJButton finishButton = new JButton(\"Finish\");\npreviousButton.setEnabled(false);\n\
  ```\n\n这种方法是防止组件在不该发送用户事件时发送事件的有效方法。例如，如果你正在编写一个使用文本字段收集用户地址的 Java 程序，你可以在用户提供街道、城市、州和邮政编码之前禁用“保存地址”按钮。\n\
  \n### 完成图形化应用程序\n\n为了查看 Swing 的事件处理类在 Java 程序中如何工作，你将完成在第 18 节 “布局用户界面”中开始的彩票模拟程序\
  \ `LottoMadness`。\n\n此时，`LottoMadness` 只是一个 GUI。你可以点击按钮并在文本框中输入文字，但不会有任何响应。在本次中，你将创建一个新类\
  \ `LottoEvent`，该类接收用户输入、进行彩票抽奖并跟踪中奖次数。当该类完成后，你将在 `LottoMadness` 中添加几行代码，使其使用 `LottoEvent`。以这种方式划分\
  \ Swing 项目通常很方便，将 GUI 放在一个类中，将事件处理方法放在另一个类中。\n\n此应用程序的目的是评估用户一生中中六数字彩票抽奖的概率。图 19.2\
  \ 显示了程序运行时的屏幕截图。\n\n![图像](img/19fig02.jpg)\n\n**图 19.2**\n\n运行 `LottoMadness` 应用程序。\n\
  \n计算机并没有使用概率来解决这个问题，而是连续地进行抽奖，直到产生中奖者为止。由于 6 选 6 的中奖概率极低，程序还会报告任何三个、四个或五个中奖号码的组合。\n\
  \n该界面包括 12 个用于彩票号码的文本字段和两个标记为 Quick Pick（快速选号）和 Personal（个人）的复选框。六个禁用了输入的文本字段用于显示每次抽奖的中奖号码。另外六个文本字段供用户选择数字。选中\
  \ Quick Pick 框为用户选择六个随机数字。选中 Personal 框则允许用户选择所需的数字。\n\n三个按钮控制程序的活动：Stop（停止）、Play（播放）和\
  \ Reset（重置）。按下 Play 按钮时，程序启动一个名为 `playing` 的线程并生成彩票抽奖。\n\n按下 Stop 按钮停止线程，按下 Reset\
  \ 则清除所有字段，以便用户可以重新开始。你将在第 15 节 “创建多线程程序”中学习线程知识。\n\n`LottoEvent` 类实现了三个接口：`ActionListener`、`ItemListener`\
  \ 和 `Runnable`。`Runnable` 接口与线程有关，并在第 15 节介绍过。\n\n需要监听器来监听应用程序按钮和复选框生成的用户事件。程序不需要监听与文本字段相关的任何事件，因为它们专门用于存储用户选择的号码。用户界面会自动处理存储。\n\
  \n该类需要使用主 Swing 包 `javax.swing` 和 Java 的事件处理包 `java.awt.event`。\n\n该类有两个实例变量：\n\n\
  ![图像](img/arrow.jpg) `gui`，一个 `LottoMadness` 对象\n\n![图像](img/arrow.jpg) `playing`，一个用于连续抽奖的\
  \ `Thread` 对象\n\n`gui` 变量用于与包含程序 GUI 的 `LottoMadness` 对象通信。当你需要更改界面或从其中一个文本字段中检索值时，你可以使用\
  \ `gui` 对象的实例变量。\n\n例如，`LottoMadness` 的 `play` 实例变量代表 Play 按钮。要在 `LottoEvent` 中禁用此按钮，你可以使用以下语句：\n\
  \n点击此处查看代码图片\n\n```java\ngui.play.setEnabled(false);\n```\n\n你可以使用下一个语句来检索 `JTextField`\
  \ 对象 `got3` 的值：\n\n点击此处查看代码图片\n\n```java\nString got3value = gui.got3.getText();\n\
  ```\n\n列表 19.2 包含了 `LottoEvent` 类的完整文本。在 `com.java24hours` 包中创建一个名为 `LottoEvent`\
  \ 的新 Java 文件，将列表中的文本输入文件并保存。\n\n**列表 19.2** `LottoEvent.java` 的完整文本\n\n点击此处查看代码图片\n\
  \n\n\n\n```java\nwhile (playing == thisThread) {\n    addOneToField(gui.drawings);\n\
  \    int draw = Integer.parseInt(gui.drawings.getText());\n    float numYears =\
  \ (float)draw / 104;\n    gui.years.setText(\"\" + numYears);\n\n    int matches\
  \ = 0;\n    for (int i = 0; i < 6; i++) {\n        int ball;\n        do {\n   \
  \         ball = (int) Math.floor(Math.random() * 50 + 1);\n        } while (numberGone(ball,\
  \ gui.winners, i));\n        gui.winners[i].setText(\"\" + ball);\n        if (matchedOne(gui.winners[i],\
  \ gui.numbers)) {\n            matches++;\n        }\n    }\n    switch (matches)\
  \ {\n        case 3:\n            addOneToField(gui.got3);\n            break;\n\
  \        case 4:\n            addOneToField(gui.got4);\n            break;\n   \
  \     case 5:\n            addOneToField(gui.got5);\n            break;\n      \
  \  case 6:\n            addOneToField(gui.got6);\n            gui.stop.setEnabled(false);\n\
  \            gui.play.setEnabled(true);\n            playing = null;\n    }\n  \
  \  try {\n        Thread.sleep(100);\n    } catch (InterruptedException e) {\n \
  \       // do nothing\n    }\n}\n```\n\n`LottoEvent` 类有一个构造函数：`LottoEvent(LottoMadness)`。作为参数指定的\
  \ `LottoMadness` 对象标识了依赖 `LottoEvent` 来处理用户事件并进行抽奖的对象。\n\n该类中使用了以下方法：\n\n- `clearAllFields()`\
  \ 方法会导致应用程序中的所有文本字段清空。当用户点击重置（Reset）按钮时会处理此方法。\n- `addOneToField()` 方法将文本字段转换为整数，将其加\
  \ 1，然后转换回文本字段。由于所有文本字段都是以字符串形式存储的，因此在表达式中使用它们时需要采取特殊步骤。\n- `numberGone()` 方法接受三个参数：来自乐票抽取的单个数字、一个包含多个\
  \ `JTextField` 对象的数组以及一个整数 `count`。该方法确保抽奖中的每个数字在同一次抽奖中没有被重复选择。\n- `matchedOne()`\
  \ 方法接受两个参数：一个 `JTextField` 对象和一个包含六个 `JTextField` 对象的数组。该方法检查用户的数字是否与当前抽奖的数字匹配。\n\
  - 应用程序的 `actionPerformed()` 方法在用户点击按钮时接收动作事件。`getActionCommand()` 方法检索按钮的标签，以确定点击了哪个组件。\n\
  - 点击“开始”（Play）按钮会调用 `startPlaying()` 方法。该方法会禁用四个组件。\n- 点击“停止”（Stop）会调用 `stopPlaying()`\
  \ 方法，该方法会启用除停止按钮以外的所有组件。\n- `itemChanged()` 方法接收由选择“快速选择”（Quick Pick）或“个人选号”（Personal）复选框触发的用户事件。`getItem()`\
  \ 方法返回一个代表被点击复选框的 `Object`。如果是“快速选择”复选框，则为用户的数字分配 1 到 50 之间的六个随机数字。否则，存储用户数字的文本字段将被清空。\n\
  - `LottoEvent` 类为抽奖中的每个球使用 1 到 50 之间的数字。这在第 18 行确立，该行将 `Math.random()` 方法乘以 50，加\
  \ 1，并将 `this` 作为 `Math.floor()` 方法的参数。最终结果是 1 到 50 之间的随机整数。如果你在此处和第 69 行将 50 替换为不同的数字，就可以将\
  \ `LottoMadness` 用于生成范围不同的值的竞赛。\n- `LottoMadness` 项目缺少用于跟踪抽奖次数、中奖次数和数字字段的变量。相反，接口存储并自动显示值。\n\
  \n要完成该项目，请在 NetBeans 中重新打开 `LottoMadness.java`。你只需要添加六行代码来处理 `LottoEvent` 类。\n\n\
