  \n`NewRoot` 应用程序是第 4 节` 方法并将字符串作为唯一参数传递，如第 7 行所示：\n\n点击此处查看代码图像\n\n```java\nnumber\
  \ = Integer.parseInt(arguments[0]);\n```\n\n`arguments[0]` 数组元素持有运行应用程序时提交的第一个命令行参数。当程序以“9025”作为参数运行时，字符串“9025”被转换为整数\
  \ `int` 9025。\n\n将命令行参数从 9025 更改为其他数字并再次运行程序几次。\n\n### 创建对象\n\n为了在本节的下一个项目中查看类和继承的运行示例，你将创建代表两种类型对象的类：电缆调制解调器（cable\
  \ modems，通过 `CableModem` 类实现）和 DSL 调制解调器（DSL modems，通过 `DslModem` 类实现）。工作重点关注这些对象的简单属性和行为：\n\
  \n![Image](img/arrow.jpg) 每个对象都应该有一个可以显示的速度。\n\n![Image](img/arrow.jpg) 每个对象都应该连接到互联网。\n\
  \n电缆调制解调器 DSL 调制解调器的共同点是它们都有速度。因为这是它们共有的，可以将其放入一个类中，该类是 `CableModem` 和 `DslModem`\
  \ 类的超类。将此类命名为 `Modem`。在 NetBeans 中，在 `com.java24hours` 程序包中创建一个名为 `Modem` 的新空 Java\
  \ 类。在源编辑器中输入代码列表 10.2 并保存文件。\n\n**代码列表 10.2 Modem.java 的完整文本**\n\n点击此处查看代码图像\n\n\
