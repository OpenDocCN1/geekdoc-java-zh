  \ 向流写入数据\n\n在 `java.io` 包中，用于处理流的类是成对出现的。有用于字节流的 `FileInputStream` 和 `FileOutputStream`\
  \ 类，用于字符流的 `FileReader` 和 `FileWriter` 类，以及许多用于其他类型流数据的集合。\n\n要开始写入数据，你首先需要创建一个与输出流关联的\
  \ `File` 对象。该文件不需要在你的系统上存在。\n\n你可以通过两种方式创建 `FileOutputStream`。如果你想向现有文件追加字节，请调用带有两个参数的\
  \ `FileOutputStream()` 构造函数：一个代表文件的 `File` 对象和一个设为 `true` 的 `boolean` 值。你写入流的字节将附加在文件的末尾。\n\
  \n如果你想向新文件写入字节，请调用仅以 `File` 对象作为唯一参数的 `FileOutputStream()` 构造函数。\n\n获取输出流后，你可以调用不同的\
  \ `write()` 方法向其写入字节：\n\n![Image](img/arrow.jpg) 调用 `write()` 并将字节作为唯一参数，将该字节写入流。\n\
  \n![Image](img/arrow.jpg) 调用 `write()` 并将字节数组作为唯一参数，将数组中的所有字节写入流。\n\n![Image](img/arrow.jpg)\
  \ 为 `write(byte[], int, int)` 方法指定三个参数：一个字节数组、一个表示要写入流的数组第一个元素的整数，以及要写入的字节数。\n\n\
  以下语句创建了一个 10 字节的字节数组，并将最后 4 个字节写入输出流：\n\n点击此处查看代码图片\n\n```java\nFile dat = new File(\"\
  data.dat\");\nFileOutputStream datStream = new FileOutputStream(dat);\nbyte[] data\
  \ = new byte[] { 5, 12, 4, 13, 3, 15, 2, 17, 1, 18 };\ndatStream.write(data, 6,\
  \ 4);\n```\n\n在向流写入字节时，你可以通过调用 `String` 对象的 `getBytes()` 方法将文本转换为字节数组，如示例所示：\n\n\
  点击此处查看代码图片\n\n```java\nString name = \"Puddin N. Tane\";\nbyte[] nameBytes = name.getBytes();\n\
  ```\n\n完成向流写入字节后，通过调用流的 `close()` 方法将其关闭。\n\n你编写的下一个项目是一个简单的应用程序 `ConfigWriter`，它通过向文件输出流写入字节，将几行文本保存到文件中。创建一个命名的\
  \ Java 文件，为其分配包 `com.java24hours`，并将代码列表 20.3 中的文本输入到源编辑器。\n\n**代码列表 20.3 `ConfigWriter.java`\
  \ 的全文**\n\n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\nimport java.io.*;\n\
  \npublic class ConfigWriter {\n    String newline = System.getProperty(\"line.separator\"\
  );\n\n    public ConfigWriter() {\n        try {\n            File file = new File(\"\
  program.properties\");\n            FileOutputStream fileStream = new FileOutputStream(file);\n\
  \            write(fileStream, \"username=max\");\n            write(fileStream,\
  \ \"score=12550\");\n            write(fileStream, \"level=5\");\n            fileStream.close();\n\
  \        } catch (IOException ioe) {\n            System.out.println(\"Could not\
  \ write file\");\n        }\n    }\n\n    void write(FileOutputStream stream, String\
  \ output)\n        throws IOException {\n        output = output + newline;\n  \
  \      byte[] data = output.getBytes();\n        stream.write(data);\n    }\n}\n\
  ```\n（注：提供的文本代码块中包含一些乱码/交错行；我已根据提供的上下文逻辑 Java 结构进行了清理。）\n\n### 读取和写入配置属性\n\n当 Java\
  \ 程序可以使用命令行参数进行配置时，它们会变得更加灵活，正如你在课程中所演示的那样。`java.util` 包包含一个 `Properties` 类，它允许从另一个源（文本文件）加载配置设置。该文件可以像其他文件源一样读取：\n\
  \n![Image](img/arrow.jpg) 创建一个代表文件的 `File` 对象。\n\n![Image](img/arrow.jpg) 从该 `File`\
  \ 对象创建一个 `FileInputStream` 对象。\n\n![Image](img/arrow.jpg) 调用 `load()` 从该输入流中检索属性。\n\
  \n属性文件有一组属性名，后面跟着等号 `=` 及其对应的值。这是一个示例：\n\nusername=lepton\nlastCommand=open database\n\
  windowSize=32\n\n每个属性各占一行，因此这设置了属性 `username`、`lastCommand` 和 `windowSize`，值分别为“lepton”、“open\
  \ database” 和“32”。（`ConfigWriter` 应用程序使用了相同的格式。）\n\n以下代码加载了名为 `config.dat` 的属性文件：\n\
  \n点击此处查看代码图片\n\n```java\nFile configFile = new File(\"config.dat\");\nFileInputStream\
  \ inStream = new FileInputStream(configFile);\nProperties config = new Properties();\n\
  config.load(inStream);\n```\n\n配置设置（称为 `properties`）以字符串形式存储在 `Properties` 对象中。每个属性通过一个键（key）识别。`getProperty()`\
  \ 方法使用其键检索属性，如下语句所示：\n\n```java\nString username = config.getProperty(\"username\"\
  );\n```\n\n由于属性是以字符串形式存储的，你必须以某种方式将它们转换以便使用数值，如下代码所示：\n\n```java\nString windowProp\
  \ = config.getProperty(\"windowSize\");\nint windowSize = 24;\ntry {\n    windowSize\
  \ = Integer.parseInt(windowProp);\n} catch (NumberFormatException exception) {\n\
  \    // 什么都不做\n}\n```\n\n可以通过调用带有两个参数（键和值）的 `setProperty()` 方法来存储属性：\n\n\n\n\n\n\
  点击此处查看代码图像\n\n```java\nconfig.setProperty(\"username\", \"max\");\n```\n\n你可以通过调用\
  \ `Properties` 对象的 `list(PrintStream)` 方法来显示所有属性。`PrintStream` 是你在书中一直在使用的类型：它是\
  \ `System` 类中 `out` 实例变量的类，你一直在使用它在 `System.out.println()` 和 `System.out.print()`\
  \ 语句中输出。以下代码调用 `list()` 来显示所有属性：\n\n```java\nconfig.list(System.out);\n```\n\n在修改属性后，可以将它们存回文件：\n\
  \n![Image](img/arrow.jpg) 创建一个表示该文件的 `File` 对象。\n\n![Image](img/arrow.jpg) 从该 `File`\
  \ 对象创建一个 `FileOutputStream` 对象。\n\n![Image](img/arrow.jpg) 调用 `store(OutputStream,\
  \ String)` 将属性保存到指定的输出流中，并使用字符串作为属性文件的描述。\n\n在本小时的最后一个项目中，你将在 `ConfigWriter` 应用程序的基础上进行构建，该程序将几个程序设置写入文件。`Configurator`\
  \ 应用程序将这些设置读取到 Java 属性文件中，添加一个名为 `runtime` 的新属性（包含当前日期时间），并保存修改后的文件。\n\n在 `com.java24hours`\
  \ 包中创建一个新的 Java 文件来存放 `Configurator` 类，并输入列表 20.4 中的文本。\n\n**列表 20.4 `Configurator.java`\
  \ 的全文**\n\n点击此处查看代码图像\n\n```java\n1: package com.java24hours;\n2:\n3: import java.io.*;\n\
  4: import java.util.*;\n5:\n6: public class Configurator {\n7:\n8:     public Configurator()\
  \ {\n9:         try {\n10:             // 加载属性文件\n11:             File configFile\
  \ = new File(\"program.properties\");\n12:             FileInputStream inStream\
  \ = new FileInputStream(configFile);\n13:             Properties config = new Properties();\n\
  14:             config.load(inStream);\n15:             // 创建新属性\n16:          \
  \   Date current = new Date();\n17:             config.setProperty(\"runtime\",\
  \ current.toString());\n18:             // 保存属性文件\n19:             FileOutputStream\
  \ outStream = new FileOutputStream(configFile);\n20:             config.store(outStream,\
  \ \"Properties settings\");\n21:             inStream.close();\n22:            \
  \ config.list(System.out);\n23:         } catch (IOException ioe) {\n24:       \
  \      System.out.println(\"IO error \" + ioe.getMessage());\n25:         }\n26:\
  \     }\n27:\n28:     public static void main(String[] arguments) {\n29:       \
  \  new Configurator();\n30:     }\n31: }\n```\n\n在此应用程序中，第 11–12 行创建了用于 `program.properties`\
  \ 的 `File` 对象并将其与文件输入流关联。第 13–14 行从流将文件内容加载到 `Properties` 对象中。第 16–17 行创建了当前日期时间的新属性。随后，在第\
  \ 19 行将文件与输出流关联，并在第 20 行将整个属性文件写入该流中。\n\n`Configurator` 应用程序的输出所示图 20.4。\n\n![Image](img/20fig4.jpg)\n\
  **图 20.4** 运行 `Configurator` 应用程序。现在 `program.properties` 文件包含以下文本：\n\n![Image](img/arrow.jpg)\n\
  点击此处查看代码图像\n-- 显示属性 --\nruntime=Tue Jun 06 43 EDT 2017\nusername=max\nlevel=5\n\n\
  反斜杠字符的格式与应用程序的输出不同，这确保了属性文件能被正确存储。\n\n### 总结\n在本小时中，你处理了写入字节的输入流和输出流，这是在流上表示数据最简单的方法。`java.io`\
  \ 包中还有许多类可以以其他方式处理流。还有一个名为 `java.net` 的类包，它允许你在连接上读写流。字节流可以适应许多用途，因为你可以轻松将字节转换为其他类型（如整数和字符串）。本小时的第一个项目\
  \ `ID3Reader` 应用程序从流中读取字节并将其转换为字符串，以这种格式读取 ID3 数据：Marion Black 的“Come On and Gettit”。我提过你应该买下这首歌吗？\n\
  \n### 工作坊\n#### 问答\n**问. 为什么本小时中的某些字节流方法使用整数作为参数？**\n**答.** 这是流中的字节与由 `byte` 类表示的字节之间的区别。Java\
  \ 中的一个 `byte` 取值范围从 −128 到 127，而流中的一个字节的取值范围是从 0 到 255。由于这个原因，当你处理字节时，通常需要使用 `int`。\n\
  \n**问. 什么是 Mumblety-Peg（踢地子游戏）？**\n**答.** 这是一种孩子们玩的游戏，通过向地上扔地子，谁离地子近谁就赢。这种游戏源于 20\
  \ 世纪初的流行，已经过时了。\n\n#### 测试\n为了检查你是否掌握了本小时的知识，请回答关于 Java 流的问题。\n\n1. 下列哪些技术可以可以将字节数组转换为字符串？\n\
  A. 调用数组的 `toString()` 方法。\nB. 将每个字节转换为字符，然后赋值给字符串元素。\nC. 使用数组调用 `String()` 构造函数。\n\
  \n2. 在 Java 程序中，使用哪种流来读取文件？\nA. 输入流\nB. 输出流\nC. 均可\n\n3. `File` 类的哪种方法可以用于确定文件的大小？\n\
  A. `getSize()`\nB. `read()`\nC. `length()`\n\n#### 答案\n1. C. 你可以如答案 B 所示单独处理字节，但你也可以轻松从其他类型创建字符串。\n\
  2. A. 输入流可以通过 `File` 对象创建，也可以通过向输入流构造函数提供文件名创建。\n3. C. 该方法返回 `long`，表示流中的字节数。\n\n\
