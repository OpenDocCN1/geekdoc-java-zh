  \ `if` 或 `switch` 条件语句来确定应该显示哪些信息。此程序包含了多次使用 `System.out.println()` 和 `System.out.print()`\
  \ 输出字符串。第 8–14 行引用了一个名为 `now` 的 `LocalDateTime` 变量。`LocalDateTime` 变量是一个对象。对于本节，请关注这些行中发生了什么，而不是它是如何实现的。`Clock`\
  \ 程序由以下部分组成：\n\n- 第 1 行允许你的程序使用一个跟踪当前日期和时间的类：`java.time.LocalDateTime`。\n- 第 4 行允许程序使用\
  \ `java.time.temporal.ChronoField` 类，这听起来像是时间旅行电影里的东西。\n- 第 6–7 行开始 `Clock` 程序及其\
  \ `main()` 语句块。\n- 第 9 行创建了一个名为 `now` 的 `LocalDateTime` 对象，它包含了你系统的当前日期和时间。每运行一次此程序，`now`\
  \ 对象都会发生。（除非宇宙的物理定律被改变且时间停止了）。\n- 第 10–14 行创建了用于存储 `hour`、`minute`、`month`、`day`\
  \ 和 `year` 的变量。这些变量的值从 `LocalDateTime` 对象中提取，它是所有信息的存储库。括号内的信息（例如 `ChronoField.DAY_OF_MONTH`）指示提取日期和时间的哪个部分。\n\
  - 第 17–23 行显示三种可能的问候语之一：“Good morning.”“Good afternoon.”或“Good evening.”显示的问候语根据\
  \ `hour` 变量的值进行选择。\n- 第 26–32 行显示当前分钟以及一些辅助文本。如果 `minute` 的值为 0，则由于第 27 行的 `if`\
  \ 语句，第 28–31 行将被忽略。该语句是必要的，因为程序告诉某人现在是几点零分是不符合逻辑的。第 28 行显示 `minute` 变量的当前值。第 29–30\
  \ 行使用三元运算符根据 `minute` 是否等于 1 来显示“minutes”或“minute”。\n- 第 35–37 行通过另一个三元运算符显示当前小时。第\
  \ 36 行的三元条件语句导致小时大于 12 时以不同的方式显示，这防止了计算机输出类似“15 点”的时间。\n- 第 40–76 行是程序的大部分是一个长的\
  \ `switch` 语句，根据存储在 `month` 变量中的整数值显示不同的月份。\n- 第 79 行通过显示当前日期和年份完成显示。\n- 第 80–81\
  \ 行关闭 `main()` 语句块。\n\n你将在创建第一个对象 中学习如何创建和操作对象。\n\n\n\n\n\n**A.** 可以不使用 `else` 或\
  \ `switch`，许多程序员也从不使用三元运算符 `?`。然而，在程序中使用 `else` 和 `switch` 往往是有益的，因为它们能让程序更易理解。一组链在一起的\
  \ `if` 语句可能会变得难以管理。\n\n**Q. 在这一小时的课程中，如果 `if` 语句只跟一条语句，有时不需要使用大括号 `{` 和 `}`。使用大括号是强制性的吗？**\n\
  \n**A.** 不是的。大括号可以作为任何 `if` 语句的一部分，用于包围依赖于条件测试的程序部分。养成使用括号的习惯是好的，因为可以防止在修改程序时可能发生的常见错误。如果你在包含单个语句的\
  \ `if` 条件中没有添加括号，那么当你以后添加第二条语句但忘记添加括号时，会发生什么？我来回答自己的问题：会发生意料之外的事情，而在编程中，“意料之外”这个词几乎从不是好事。\n\
  \n**Q. 在每个 `case` 后的语句块中都必须使用 `break` 吗？**\n\n**A.** 你并不一定需要使用 `break`。如果你不在一组语句的结尾使用它，那么\
  \ `switch` 块语句内的所有剩余语句都将被处理，无论它们所测试的 `case` 值是什么。\n\n然而，在大多数情况下，你可能希望在每组语句的结尾加上一个\
  \ `break` 语句。\n\n**Q. 为什么汤森双胞胎（Thompson Twins）在三人组、彼此没有关系且没有人叫 Thompson 的情况下，却叫这个名字？**\n\
  \n**A.** 乐队成员 Tom Bailey、Alannah Currie 和 Joe Leeway 称自己为 Thompson Twins，以向 Thomson\
  \ 和 Thompson 致敬——这是比利时漫画《丁丁历险记》中一对笨头笨脚的侦探。\n\n这两位戴着圆顶帽的侦探在体貌上是无法区分的，除了胡须形状有细微差别外。尽管他们工作非常糟糕，但却莫名其妙地被分配重要且敏感的任务。他们经常追捕丁丁，指控他犯下未行的罪。\n\
  \n正如他们的名字所暗示的，这些侦探之间也没有血缘关系。\n\n### 测验\n\n以下问题将通过你在学习了 Java 条件语句后，对条件语句的掌握程度。\n\n\
  **1.** 条件测试的结果为 `true` 或 `false` 值。这让你想起了哪种变量类型？\n\n**A.** 都没有。别用这些问题烦扰我了。\n\n**B.**\
  \ `long` 变量类型。\n\n**C.** `boolean` 类型。\n\n**2.** 哪一个语句被用作 `switch` 块语句中的默认分类？\n\n\
  **A.** `default`\n\n**B.** `otherwise`\n\n**C.** `onTheOtherHand`\n\n**3.** 什么是条件（conditional）？\n\
  \n**A.** 洗完发后修复凌乱分叉发和缠结的东西。\n\n**B.** 程序中用于测试条件为真还是为假的东西。\n\n**C.** 你向宗教权威人物忏悔罪孽的地方。\n\
  \n#### 答案\n\n**1. C.** `boolean` 变量类型只能等于 `true` 或 `false`，这与条件测试相似。如果你回答 A，我很抱歉，但只剩下\
  \ 17 小时了，我们还有很多内容要涵盖。Java 不会自己教学。\n\n**2. A.** 如果没有其他 `case` 语句匹配 `switch` 变量，则处理\
  \ `default` 语句。\n\n**3. B.** 另外两个答案描述的是护发素（conditioner）和忏悔室（confessional）。\n\n####\
