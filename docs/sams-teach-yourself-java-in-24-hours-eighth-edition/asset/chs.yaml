  \ Swing 用户组件。\n\n**注意**\n\n由于在本节节中引入了许多不同的用户界面组件，这里没有列出用于创建每个图例的完整源代码。你可以在书籍网站 [www.java24hours.com](http://www.java24hours.com)\
  \ 上的第 17 小节 页面找到每个程序的完整版本。\n\n### 标签和文本字段（Labels and Text Fields）\n\n`JLabel` 组件显示用户无法修改的信息。这些信息可以是文本、图形或两者兼有。这些组件通常用于标记界面中的其他组件，因此得此名。它们通常用于标识文本字段。\n\
  \n`JTextField` 组件是一个用户可以输入单行文本的区域。你可以在创建文本字段时设置框的宽度。\n\n以下语句创建了一个 `JLabel` 组件和一个\
  \ `JTextField` 组件，并将它们添加到容器中：\n\n点击此处查看代码图像\n\n```java\nJLabel pageLabel = new JLabel(\"\
  Web page address: \", JLabel.RIGHT);\nJTextField pageAddress = new JTextField(20);\n\
  FlowLayout flo = new FlowLayout();\nsetLayout(flo);\nadd(pageLabel);\nadd(pageAddress);\n\
  ```\n\n图 17.3 显示了此标签和文本字段并排显示。示例中的两个语句都使用一个参数来配置组件的外观。\n\n![Image](img/17fig03.jpg)\n\
  \n**图 17.3**\n\n显示标签和文本字段。\n\n`pageLabel` 标签设置了文本“Web page address:” 和 `JLabel.RIGHT`\
  \ 参数。最后一个值表示标签应该靠右对齐。`JLabel.LEFT` 将标签文本左对齐，而 `JLabel.CENTER` 将其居中。与 `JTextField`\
  \ 使用的参数表示文本字段的宽度约为 20 个字符。你还可以使用如下语句来指定显示在文本字段中的默认文本：\n\n点击此处查看代码图像\n\n```java\n\
  JTextField country = new JTextField(\"Togolese Republic\", 29);\n```\n\n该语句将创建一个宽度为\
  \ 20 个字符的 `JTextField` 对象，并在字段中有“Togolese Republic”文本。\n\n你可以使用 `getText()` 方法获取对象包含的文本，该方法返回一个字符串：\n\
  \n点击此处查看代码图像\n\n```java\nString countryChoice = country.getText();\n```\n\n正如你可能猜的那样，你也可以用相应的方法设置文本：\n\
  \n点击此处查看代码图像\n\n```java\ncountry.setText(\"Separate Customs Territory of Taiwan,\
  \ Penghu, Kinmen, and Matsu\");\n```\n\n这会将文本设置为中国台北的正式名称，它是世界上最长的国家名称，略超过了第二名：大不列颠联合列颠及北爱尔兰联合王国。\n\
  \n### 复选框（Check Boxes）\n\n`JCheckBox` 组件是文本旁的一个框，用户可以对其进行勾选或取消勾选。以下语句创建了一个 `JCheckBox`\
  \ 对象并将其添加到容器中：\n\n点击此处查看代码图像\n\n```java\nJCheckBox jumboSize = new JCheckBox(\"\
  Jumbo Size\");\nFlowLayout flo = new FlowLayout();\nsetLayout(flo);\nadd(jumboSize);\n\
  ```\n\n`JCheckBox()` 构造函数的参数表示显示在框旁边的文本。如果你想让框被勾选，请使用以下语句：\n\n点击此处查看代码图像\n\n```java\n\
  JCheckBox jumboSize = new JCheckBox(\"Jumbo Size\", true);\n```\n\n你可以单独展示 `JCheckBox`，也可以将其作为一组的一部分。在复选复选框组中，一次只能有一个被勾选。要使一个\
  \ `JCheckBox` 对象成为组的一部分，你必须创建一个 `ButtonGroup` 对象。考虑以下内容：\n\n点击此处查看代码图像\n\n```java\n\
  JCheckBox frogLegs = new JCheckBox(\"Frog Leg\", true);\nJCheckBox fishTacos = new\
  \ JCheckBox(\"Fish Platter\", false);\nJCheckBox emuNuggets = new JCheckBox(\"Emu\
  \ Nuggets\", false);\nFlowLayout flo = new FlowLayout();\nButtonGroup meals = new\
  \ ButtonGroup();\nmeals.add(frogLegs);\nmeals.add(fishTacos);\nmeals.add(emuNuggets);\n\
  setLayout(flo);\nadd(frogLegs);\nadd(fishTacos);\nadd(emuNuggets);\n```\n\n这创建了位于\
  \ `ButtonGroup` 下的复选框。Frog Leg 初始化是勾选的。图 17.4 显示了不同的复选框。\n\n![Image](img/17fig04.jpg)\n\
  \n**图 17.4**\n\n显示复选框组件。\n\n### 组合框（Combo Boxes）\n\n`JComboBox` 组件是一个列表，也可以设置为接收文本输入。除非显示列表，否则只有一个选项可见。\n\
  \n要创建一个 `JComboBox` 对象，你必须在创建对象后添加每个选项，如下所示：\n\n点击此处查看代码图像\n\n```java\nJComboBox\
  \ profession = new JComboBox();\nFlowLayout flo = new FlowLayout();\nprofession.addItem(\"\
  Butcher\");\nprofession.addItem(\"Baker\");\nprofession.addItem(\"Candlestick maker\"\
  );\nprofession.addItem(\"Fletcher\");\nprofession.addItem(\"Fighter\");\nprofession.addItem(\"\
  Technical writer\");\nsetLayout(flo);\nadd(profession);\n```\n\n此示例创建了一个单一的 `JComboBox`\
  \ 组件，提供了六个供用户的选择。当选中其中一个时，它会显示在组件中。图 17.5 显示了此示例正在显示选项列表。\n\n![Image](img/17fig05.jpg)\n\
  \n**图 17.5**\n\n显示组合框组件。\n\n要启用 `JComboBox` 组件接收文本输入，你必须调用其 `setEditable(boolean)`\
  \ 方法并传入参数 `true`：\n\n点击此处查看代码图像\n\n```java\nprofession.setEditable(true);\n```\n\
  \n你必须在组件添加到容器之前调用此方法。\n\n### 文本区域（Text Areas）\n\n`JTextArea` 组件是一个允许用户输入多行文本的文本字段。你可以指定组件的宽度和高度。以下语句创建一个宽度为\
  \ 40 个字符、高度为 8 行的 `JTextArea` 组件并将其添加到容器中：\n\n点击此处查看代码图像\n\n```java\nJTextArea comments\
  \ = new JTextArea(8, 40);\nFlowLayout flo = new FlowLayout();\nsetLayout(flo);\n\
  add(comments);\n```\n\n图 17.6 在框架中显示了此示例。\n\n\n\n\n\n你可以在 `JTextArea()` 构造函数中指定一个字符串显示在文本区域中，使用换行符\
  \ `\\n` 将文本发送到下一行，如下所示：\n\n点击此处查看代码图像\n\n```\nJTextArea comments = new JTextArea(\"\
  I should have been a pair\\n\"\n+ \"of ragged claws.\", 10, 25);\n```\n\n![Image](img/17fig06.jpg)\
  \ \n\n**图 17.6**\n\n显示文本区域组件。\n\n文本区域有两个可以调的方法，用于指定用户在输入的文本超过行右侧边缘时组件的行为。调用 `setLineWrap(boolean)`\
  \ 方法并传入参数 `true`，可以使文本换行到下一行：\n\n```\ncomments.setLineWrap(true);\n```\n\n要确定文本如何换行到下一行，请使用\
  \ `setWrapStyleWord(boolean)` 方法。使用参数 `true` 调用它以根据单词结束处进行换行，或者使用 `false` 根据字符进行换行。\n\
  \n如果你不调用这些方法，文本将不会换行。用户可以一直沿同一行输入文本，直到按下 Enter 键或超出区域的右边缘。\n\n文本区域组件的行为可能与你预期的不同——当用户到达区域底部时，它们会扩大尺寸，并且在右侧或底部不包含滚动条。要以更好的方式实现它们，你必须将文本区域放置在一个称为滚动面板（scroll\
  \ pane）的容器中。\n\nGUI 中的组件通常比显示它们的区域大。要让组件从组件的一个部分移动到另一个部分，你需要使用垂直和水平滚动条。\n\n在 Swing\
  \ 中，你通过将组件添加到滚动面板来支持滚动，滚动面板是由 `JScrollPane` 类表示的容器。\n\n你可以使用以下构造函数创建滚动面板：\n\n![Image](img/arrow.jpg)\
  \ `JScrollPane()`——创建一个在需要时显示水平和垂直滚动条的滚动面板。\n\n![Image](img/arrow.jpg) `JScrollPane(int,\
  \ int)`——创建一个具有指定垂直滚动条和水平滚动条的滚动面板。\n\n![Image](img/arrow.jpg) `JScrollPane(Component)`——创建一个包含指定用户界面组件的滚动面板。\n\
  \n![Image](img/arrow.jpg) `JScrollPane(Component, int, int)`——创建一个具有指定组件、垂直滚动条和水平滚动条的滚动面板。\n\
  \n这些构造函数的整数参数决定了滚动条在面板中的用法。使用以下类变量作为这些参数：\n\n![Image](img/arrow.jpg) `JScrollPane.VERTICAL_SCROLLBAR_AS_NEEDED`\
  \ 或 `JScrollPane.HORIZONTAL_SCROLLBAR_AS_NEEDED`\n\n![Image](img/arrow.jpg) `JScrollPane.VERTICAL_SCROLLBAR_NEVER`\
  \ 或 `JScrollPane.HORIZONTAL_SCROLLBAR_NEVER`\n\n![Image](img/arrow.jpg) `JScrollPane.VERTICAL_SCROLLBAR_ALWAYS`\
  \ 或 `JScrollPane.HORIZONTAL_SCROLLBAR_ALWAYS`\n\n如果你创建了一个不包含组件的滚动面板，可以使用面板的 `add(Component)`\
  \ 方法添加组件。在设置好滚动面板后，应该将它添加到容器中以替换原来的组件。\n\n以下是重写之前的示例，将文本区域放置在滚动面板中：\n\n点击此处查看代码图像\n\
  \n```\nFlowLayout flo = new FlowLayout();\nsetLayout(flo);\nJTextArea comments =\
  \ new JTextArea(8, 40);\ncomments.setLineWrap(true);\ncomments.setWrapStyleWord(true);\n\
  JScrollPane scroll = new JScrollPane(comments,\n    JScrollPane.VERTICAL_SCROLLBAR_ALWAYS,\n\
  \    JScrollPane.HORIZONTAL_SCROLLBAR_NEVER);\nadd(scroll);\n```\n\n图 17.7 在框架中显示了此示例。\n\
  \n![Image](img/17fig07.jpg)\n\n**图 17.7**\n\n在滚动面板容器中显示文本区域组件。\n\n### 面板\n\n本小时介绍的最后一个组件是面板（panel），它在\
  \ Swing 中通过 `JPanel` 类创建。`JPanel` 对象是用户界面中最简单的容器类型。`JPanel` 对象的目的是将显示区域细分为不同的组件组。当显示内容被分为若干部分时，你可以在每个部分使用不同的布局管理器。\n\
  \n以下语句创建了一个 `JPanel` 对象并为它分配了一个布局管理器：\n\n点击此处查看代码图像\n\n```\nJPanel topRow = new\
  \ JPanel();\nFlowLayout flo = new FlowLayout();\ntopRow.setLayout(flo);\nadd(topRow);\n\
  ```\n\n在安排界面组件时经常会用到面板，正如你在第 18 节“布局用户界面”中所所示。\n\n你通过调用它的 `add()` 方法向面板添加组件。你可以通过调用\
  \ `setLayout()` 方法直接为面板分配布局管理器。\n\n当你需要在界面的某个区域中绘制某些内容时（例如来自图形文件的图像），你也可以使用面板。\n\
  \n`JPanel` 的另一个方便的用途是创建你自己的组件，这些组件可以添加到其他类中。这在本节的最后一个项目中得到了演示。\n\n### 创建你自己的组件\n\
  \n面向对象编程的一个优势是可以在不同项目之间重用类。对于下一个项目，你将创建一个特殊的面板组件，该组件可以在其他 Java 程序中重用。该组件 `FreeSpacePanel`\
  \ 报告运行应用程序程序的计算机上的可用磁盘空间。该面板显示可用空间量、总空间以及空闲百分比。\n\n创建你自己的用户界面组件的第一步是决定从哪个现有组件进行继承。你的新组件将拥有其所有现有的属性和行为，除非你对其进行了修改或添加了新内容。\n\
  \n`FreeSpacePanel` 组件是位于列表 17.3 中的 `JPanel` 的子类。将列表 17.3 中的文本输入到新的空 Java 文件并保存该文件。\n\
  \n**列表 17.3** `FreeSpacePanel.java` 的完整文本\n\n点击此处查看代码图像\n\n```java\n1: package com.java24hours;\n\
  2: \n3: import java.io.IOException;\n4: import java.nio.file.*;\n5: import javax.swing.*;\n\
  6: \n7: public class FreeSpacePanel extends JPanel {\n8:     JLabel spaceLabel =\
  \ new JLabel(\"Disk space: \");\n9:     JLabel space = new JLabel();\n10:      \
  \    \n11:     public FreeSpacePanel() {\n12:         super();\n13:         add(spaceLabel);\n\
  14:         add(space);\n15:         try {\n16:             setValue();\n17:   \
  \      } catch (IOException ioe) {\n18:             space.setText(\"Error\");\n\
  19:         }\n20:     }\n21:     \n22:     private final void setValue() throws\
  \ IOException {\n23:         // get the current file storage pool\n24:         Path\
  \ current = Paths.get(\"\");\n25:         FileStore store = Files.getFileStore(current);\n\
  26:         // find the free space\n27:         long totalSpace = store.getTotalSpace();\n\
  28:         long freeSpace = store.getUsableSpace();\n29:         // get this as\
  \ a percentage\n30:         double percent = (double)freeSpace / (double)totalSpace\
  \ * 100;\n31:         percent = (int)(percent * 100) / (double)100;\n32:       \
  \  // set the label's text\n33:         space.setText(freeSpace + \" free out of\
  \ \" + totalSpace + \" (\"\n34:             + percent + \"%)\");\n35: \n36:    \
  \ }\n37: }\n```\n\n该类是一个组件，当你想要显示可用磁盘空间信息时，可以添加到任何图形用户界面。它不能作为一个应用程序运行。\n\n`FreeSpacePanel`\
  \ 中的 `setValue()` 方法设置呈现磁盘空间信息的标签文本。该方法在第 22 行声明时带有 `final` 关键字：\n\n点击此处查看代码图像\n\
  \n```java\nprivate final void setValue() {\n    // ...\n}\n```\n\n在方法声明中包含 `final`\
  \ 关键字可以防止该方法在子类中重写。这对于 `FreeSpacePanel` 作为一个 GUI 组件是必要的。\n\n\n\n\n该面板在第 11–20 行的构造函数中创建。此处执行了以下操作：\n\
  \n![Image](img/arrow.jpg) 第 12 行——`super()` 方法调用了 `JPanel` 类的构造函数，确保其被正确初始化。\n\n\
  ![Image](img/arrow.jpg) 第 13 行——创建新标签 `spaceLabel`（其文本为“Disk space: ”，且在第 8 行作为实例变量创建），通过调用\
  \ `add(Component)` 方法并将标签作为参数将其添加到面板中。\n\n![Image](img/arrow.jpg) 第 14 行——`space`\
  \ 标签（在第 9 行创建的没有文本的实例变量）也被添加到面板中。\n\n![Image](img/arrow.jpg) 第 16 行——调用了 `setValue()`\
  \ 方法，该方法设置了 `space` 标签的文本。\n\n第 16 行对 `setValue()` 的调用被封装在另一个 `try-catch` 块中，这与设置外观外观（look\
  \ and feel）时使用的块类似。你将在第 18 小节中学习更多关于如何处理错误的知识，但这里是简明版（TLDR）：`try-catch` 使得处理 Java\
  \ 程序部分可能发生的一个或多个错误成为可能。\n\n这是必要的，因为当调用 `setValue()` 时，访问计算机文件系统以查看其包含剩余空间可能会发生错误。该错误在\
  \ Java 中有一个专门的类 `IOException`，代表输入/输出错误。\n\n`try` 块封装了可能导致错误的代码。`catch` 块在括号中标识错误类型，并指定了发生该错误时要执行的代码。\n\
  \n如果在应用程序运行期间遇到此类错误，第 18 行会将 `space` 标签的文本设置为“Error”，以告知用户发生了问题。\n\n### 注意\n\n缩写“TLDR”是“too\
  \ long; didn’t read”（太长了，没读）的含义。当某人在互联网上为不想阅读整篇文章的人对长篇文章提供极简短的摘要时，这个词就会出现。\n\n我希望这本书对你来说不是\
  \ TLDR。我们试图让它成为 JRLRWTANIRJP（长度恰好；读完全文后现在我是富裕的 Java 程序员了）。\n\n要让自定义组件执行一些有趣的操作，需要快速上手一下\
  \ Java 文件处理，该主题将在第 20 小节“读取和写入文件”中进行详细介绍。\n\n要确定计算机上剩余了多少磁盘空间，你需要 `java.nio.file`\
  \ 包中的四个类，该包被用于访问计算机的文件系统。\n\n一个 `Path` 对象表示文件或文件夹的位置。`Paths` 类有一个 `get(String)`\
  \ 方法，它可以将字符串转换为匹配该字符串的路径。当使用 `\"\"`（空字符串）调用它时，它会返回运行 Java 应用程序的当前文件夹的路径：\n\n点击此处查看代码图片\n\
  \n```\nPath current = Paths.get(\"\");\n```\n\n磁盘的存储信息在 Java 中由 `FileStore` 对象表示，它是一个文件存储池。一旦你有了路径，就可以通过\
  \ `Files` 类中的一个方法获取该路径所在的文件存储。调用 `Files` 的 `getFileStore(Path)` 方法来检索该文件存储池：\n\n\
  点击此处查看代码图片\n\n```\nFileStore store = Files.getFileStore(current);\n```\n\n有了这个池，你现在可以调用它的\
  \ `getTotalSpace()` 和 `getUsableSpace()` 方法来查找当前磁盘上有多少可用磁盘空间：\n\n点击此处查看代码图片\n\n\
  ```\nlong totalSpace = store.getTotalSpace();\nlong freeSpace = store.getUsableSpace();\n\
  double percent = (double)freeSpace / (double)totalSpace * 100;\n```\n\n### 注意\n\n\
  计算百分比的表达式包含许多对 `double` 的引用，这看起来可能很奇怪。第二次和第三次强制转换在表达式中使用之前将 `freeSpace` 和 `totalSpace`\
  \ 变量转换为 `double` 值。这是为了防止表达式产生整数值而不是浮点数，这是必要的。Java 通过表达式中的类型来确定表达式结果的数据类型。一个 `long`\
  \ 除以一个 `long` 再乘以整数 100 将产生一个 `long`，而不是预期的百分比。\n\n在最后语句中计算出的百分比可能是小数点后带有非常长数字数字，例如\
  \ 64.8675309。\n\n以下表达式将 `double` 类型的百分比转换为最多两位小数：\n\n点击此处查看代码图片\n\n```\npercent\
  \ = (int)(percent * 100) / (double)100;\n```\n\n表达式的前半部分将百分比乘以 100——将小数点向右移动两位——然后将其转换为整数，因此\
  \ 64.8675309 变成了 6487。\n\n后半部分将此结果结果除以 100——将小数点向左移动两位——以恢复百分比的近似值。这使得 6486 变成 64.86。\n\
  \n将百分比限制在两位小数后，标签的内容可以这样设置：\n\n点击此处查看代码图片\n\n```\nspace.setText(freeSpace + \" out\
