  95:   }\n96: }\n```\n\n\n\n\n\n# 第 16 小时\n\n使用内部类与闭包\n\n### 本小时的任务列表：\n\n![Image](img/arrow.jpg)\
  \ 为对象添加一个内部类。\n\n![Image](img/arrow.jpg) 探索为什么内部类很有用。\n\n![Image](img/arrow.jpg)\
  \ 创建一个匿名内部类。\n\n![Image](img/arrow.jpg) 在接口上使用适配器类。\n\n![Image](img/arrow.jpg) 编写一个\
  \ lambda 表达式。\n\n![Image](img/arrow.jpg) 用 lambda 表达式替换匿名内部类。\n\nJava 编程语言在 1995\
  \ 年发布时，其范围有限且易于掌握。当时 Java 类库中大约只有 250 个类。该语言的设计初衷主要是为了能够在浏览器内部运行一种称为 applet 的交互式程序。由于当时还没有其他技术可以实现这一功能，Java\
  \ 引起了巨大的轰动，并迅速被成千上万的程序员所接受。\n\n作为该语言设计优良的证明，它扩展了最初的单一焦点，成为了一种通用编程语言，与当时全球最流行、实现最广泛的\
  \ C++ 相相竞争。\n\n如今，Java 语言已有 23 年历史，数百万程序员在使用它编写代码。随着每一个新版本的发布，Java 在支持现有开发者的同时，不断扩展其功能，以实现复杂的各种软件开发方法。\n\
  \n最令人兴奋的之一是一种新的编写代码方式，被称为闭包或 lambda 表达式。这些表达式使得一种称为函数式编程的方法论成为可能。\n\n在本小时中，你将在学习\
  \ lambda 表达式之前，先涵盖使用它们的前提的两个语言方面：内部类和匿名内部类。\n\n### 内部类\n\n当你在 Java 中创建一个类时，你定义了该类的属性和行为。属性是存储数据的类变量和实例变量；行为是使用这些数据执行任务的方法。\n\
  \n类还可以包含同时由属性和行为的内容：内部类。\n\n\n\n\n内部类是包含在外部类中的辅助类。你可能会奇怪为什么它们是必要的，因为根据需要创建任意数量的新类来编写程序是很容易的。如果你正在编写一个\
  \ `CheckBook` 程序，需要为一个人书写的每张支票创建一个对象，你就会创建一个 `Check` 类。如果程序支持每月的定期自动扣款，就添加一个 `Autopayment`\
  \ 类。\n\n内部类并不是必须的。但当你学会了它们能做的所有事情后，你会发现在很多情况下它们是超级用的。\n\nJava 包含内部类有三个原因：\n\n1.\
  \ 当一个辅助类仅被另一个类使用时，在那个类内部定义它是是有意义的。\n2. 它们允许辅助类访问其 `private` 方法和变量，而这些成员在作为独立类时是无法访问的。\n\
  3. 它们将辅助类尽可能地放在它在另一个类中使用的地方。\n\n内部类使用 `class` 关键字创建，与其他任何类一样，但它声明在包含它的类内部。通常，这被与类变量和实例变量放在一起。\n\
  \n下面是在名为 `Simple` 的类内部创建一个 `InnerSimple` 内部类的示例：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class Simple {\n    class InnerSimple {\n        InnerSimple() {\n           \
  \ System.out.println(\"I am an inner class!\");\n        }\n    }\n    public Simple()\
