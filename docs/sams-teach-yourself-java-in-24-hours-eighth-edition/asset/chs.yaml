  \n## 21 小时 使用 Java 9 新 HTTP 客户端\n\n### **本小时的任务清单：**\n\n![Image](img/arrow.jpg)\
  \ 为 Java 项目添加模块。\n\n![Image](img/arrow.jpg) 创建一个 HTTP 浏览器对象。\n\n![Image](img/arrow.jpg)\
  \ 向 Web 服务器发送 GET 请求。\n\n\n\n\n\n![Image](img/arrow.jpg) 从网络请求中接收数据。\n\n![Image](img/arrow.jpg)\
  \ 从网络下载图像文件。\n\n![Image](img/arrow.jpg) 向网络服务器发送数据。\n\n尽管 Web 服务器最初是为了展示网站，但自万维网早期以来，Web\
  \ 服务器的功能已远远超了浏览器。通过 HTTP 通信的能力已被许多类型的软件利用，包括 RSS 阅读器、Web 服务、软件更新程序和操作系统。\n\nJava\
  \ 9 引入了 HTTP Client 库，以便在网络上发送和接收数据变得更加简单、快速且更可靠。\n\n该库没有自动包含在 Java 类库中。相反，它是通过新语言版本中一个备受期待特性——模块（modules）添加的。\n\
  \n在这一小时中，你将学习模块以及如何通过 HTTP 建立网络连接。\n\n### Java 模块\n\n当 Java 程序发布时，它们会被封装成 Java 归档（JAR）文件，并包含程序使用的类库。该\
  \ JAR 文件以及项目所需的其他 JAR 文件都会放在 Java 虚拟机（`JVM`）运行程序时访问的 `Classpath` 上。\n\n随着时间的推移，这个过程中的低效率变得变得明显。JAR\
  \ 中可能包含数百甚至数千个 Java 类，且仅按包组织。同一个类可能存在于 `Classpath` 的两个不同位置，导致在程序执行期间对使用的是哪一个类产生困惑。\n\
  \nJava 9 通过使用模块，对程序部署的方式引入了更多控制。\n\nJava 9 包含的新型 HTTP Client 库必须包含在一个模块中，才能在你编写的程序中使用。该库是一个名为\
  \ `jdk.incubator.http` 的包。\n\n在 NetBeans 中按照以下步骤将此模块添加到 `Java24` 项目中：\n\n![Image](img/arrow.jpg)\
  \ 选择 File（文件）、New File（新建文件），然后在 Categories（类别）窗格中选择 Java。File Types（文件类型）面板出现了新内容：Java\
  \ Module Info（Java 模块信息）。\n\n![Image](img/arrow.jpg) 选择 Java Module Info，然后点击 Next（下一步）。\n\
  \n![Image](img/arrow.jpg) 对话框显示类 `module-info`，不允许选择包名。点击 Finish（完成）。\n\n`module-info.java`\
  \ 文件在源代码编辑器中打开进行编辑。它只需要这三行代码：\n\n点击此处查看代码图像\n\n```java\nmodule Java24 {\n    requires\
  \ jdk.incubator.httpclient;\n}\n```\n\n保存文件后，`jdk.incubator.httpclient` 中的类就可以在该项目中的任何\
  \ Java 程序中使用了。\n\n### 发起 HTTP 请求\n\nWeb 服务器通过称为 HTTP 请求的消息与浏览器和其他类型的网络客户端软件通信。\n\
  \n请求可用于双向移动信息。服务器和客户端之间可以接收和发送数据。\n\n本小时的第一个项目演示了使用 HTTP Client 库连接到 Web 服务器、请求文档并学习有关服务器的信息。这是一个直接的过程，尽管它需要几个类。\n\
  \n使用此库发起网络请求需要以下步骤：\n\n**1.** 创建一个 `HttpClient` 类的浏览器对象。\n\n**2.** 创建一个请求构建器（内部类\
  \ `HttpRequest.Builder`）。\n\n**3.** 将请求构建为 `HttpRequest` 对象。\n\n**4.** 使用浏览器将请求发送到\
  \ Web 服务器。\n\n**5.** 接收返回的 `HttpResponse` 对象。\n\n浏览器是使用 `HttpClient` 类的工厂方法创建：\n\
  \n点击此处查看代码图像\n\n```java\nHttpClient browser = HttpClient.newHttpClient();\n```\n\
  \n正如你预期的那样，浏览器的工作是将请求发送到服务器。\n\n请求是通过构建器类创建的。构建器需要服务器的 Web 地址。`java.net` 包中的 `URI`\
  \ 类表示地址（也称为 `URI` 或 `URL`），并可以这样创建：\n\n点击此处查看代码图像\n\n```java\nURI link = new URI(\"\
  https://www.oracle.com/\");\n```\n\n如果作为唯一参数指定的 Web 地址不是格式正确的 Web 地址，则会抛出 `URISyntaxException`（来自\
  \ `java.net`）。\n\n通过 `URI` 对象，你可以调用工厂方法 `HttpRequest.newBuilder(URI)` 来创建构建器：\n\n\
  点击此处查看代码图像\n\n```java\nHttpRequest.Builder bob = HttpRequest.newBuilder(uri);\n\
  ```\n\n构建器的 `build()` 方法创建请求，该请求是 `HttpRequest` 类的一个对象：\n\n点击此处查看代码图像\n\n```java\n\
  HttpRequest request = bob.build();\n```\n\n现在你已经有了浏览器和请求，可以将其发送到 Web 服务器并获取响应。响应是一个\
  \ `HttpResponse` 对象，它使用了泛型，因为它可以接收多种格式的信息。\n\n浏览器的 `send()` 请求接受两个参数：\n\n![Image](img/arrow.jpg)\
  \ 一个 `HttpRequest` 对象。\n\n![Image](img/arrow.jpg) 一个设置响应格式的处理器。\n\n处理器是通过调用 `HttpResponse.BodyHandler`\
  \ 内部类的类方法创建的，如下语句所示：\n\n点击此处查看代码图像\n\n```java\nHttpResponse<String> response = browser.send(request,\n\
  \    HttpResponse.BodyHandler.asString());\n```\n\n`HttpResponse<String>` 中的泛型定义响应为字符串。处理器的\
  \ `asString()` 方法让浏览器的 `send()` 方法返回字符串。\n\n该处理器还有 `asFile(Path)` 方法以文件返回响应，以及 `asByteArray()`\
  \ 方法以 `byte[]` 格式返回。\n\n每个 HTTP 请求都包含提供有关响应和发送它的更多信息的头部。这些头部中的一个 Server 包含了运行服务器的软件名称和版本号。某些服务器出于安全考虑省略了版本号。\n\
  \n响应的 `headers()` 方法返回头部作为 `HttpHeaders` 对象。该对象的 `firstValue(String)` 方法根据名称返回第一个头部。实现此功能的代码如下：\n\
  \n点击此处查看代码图像\n\n```java\nHttpHeaders headers = response.headers();\nOptional<String>\
  \ server = headers.firstValue(\"Server\");\n```\n\n`firstValue()` 返回的对象是 `java.util`\
  \ 包中的数据结构，更容易处理空值。使用没有值的对象会导致 `NullPointerException`，这是 Java 中最常见的异常之一。\n\n`Optional`\
  \ 类通过 `isPresent()` 方法防止这种情况，当存在有效值时返回 `true`，否则返回 `false`。\n\n`server` 的值是字符串，如语句\
  \ `Optional<String>` 部分所示。可以通过以下方式在避免 `null` 问题的情况下显示此字符串：\n\n点击此处查看代码图像\n\n```java\n\
  if (server.isPresent()) {\n    System.out.println(\"Server: \" + server.get());\n\
  }\n```\n\n将这些技术付诸实践，`ServerCheck` 请求六家公司的首页并报告它们使用的服务器。\n\n在 NetBeans 中，在 `com.java24`\
  \ 包中创建一个名为 `ServerCheck` 的空 Java 文件。将列表 21.1 输入源代码编辑器。\n\n**列表 21.1** `ServerCheck.java`\
  \ 的全文\n\n点击此处查看代码图像\n\n\n\n\n\n```java\n14:              \"http://www.hp.com\",\n\
  15:              \"https://www.oracle.com/\",\n16:              \"http://www.informit.com/\"\
  \n17:          };\n18:          try {\n19:              load(sites);\n20:      \
  \    } catch (URISyntaxException oops) {\n21:              System.out.println(\"\
  Bad URI: \" + oops.getMessage());\n22:          } catch (IOException | InterruptedException\
  \ oops) {\n23:              System.out.println(\"Error: \" + oops.getMessage());\n\
  24:          }\n25:      }\n26:    \n27:      public void load(String[] sites) throws\
  \ URISyntaxException, IOException,\n28:                  InterruptedException {\n\
  29:          \n30:          for (String site : sites) {\n31:              System.out.println(\"\
  \\nSite: \" + site);\n32:              // create the web client\n33:           \
  \   HttpClient browser = HttpClient.newHttpClient();\n34:              // build\
  \ a request for a website\n35:              URI uri = new URI(site);\n36:      \
  \        HttpRequest.Builder bob = HttpRequest.newBuilder(uri);\n37:           \
  \   HttpRequest request = bob.build();\n38:              // execute the request\n\
  39:              HttpResponse<String> response = browser.send(request,\n40:    \
  \              HttpResponse.BodyHandler.asString());\n41:              // look for\
  \ a server header\n42:              HttpHeaders headers = response.headers();\n\
  43:              Optional<String> server = headers.firstValue(\"Server\");\n44:\
  \              if (server.isPresent()) {\n45:                  System.out.println(\"\
  Server: \" + server.get());\n46:              } else {\n47:                  System.out.println(\"\
  Server unidentified\");\n48:              }\n49:          }\n50:      }\n51:   \
  \ \n52:      public static void main(String[] arguments) {\n53:          new ServerCheck();\n\
  54:      }\n55:  }\n```\n\n保存你的工作并运行应用程序，以产生图 21.1 所示的输出。\n\n![Image](img/21fig01.jpg)\n\
  \n**图 21.1**\n\n使用 HTTP 客户端请求服务器头。\n\n与你在上一小时处理的“读取和写入文件”中的输入输出类一样，这些 HTTP 类的方法必须处理数据传输中的错误。它们抛出了来自\
  \ `java.io` 包的 `IOException` 和 `InterruptedException` 异常。\n\n`ServerCheck` 应用程序有一个\
  \ `load()` 方法，它执行所有必要的 HTTP 任务，从它们的 Web 服务器请求六个首页并获取响应。\n\n可能发生的三个异常被放在构造函数中的 `try`-`catch`\
  \ 块中，该块在第 22 行使用了多类异常 `catch`。\n\n### 从网络保存文件\n\n通过 HTTP 获取的数据不仅限于网页等文本文件。任何类型的数据都可以以字节的形式访问，包括图像、视频和可执行文件。\n\
  \n本小时的下一个项目使用新的 HTTP Client 库从作者的博客下载图像并将其保存到计算机中。\n\n`ImageDownloader` 应用程序遵循与之前示例相同的步骤，直到发送请求为止。创建一个浏览器，使用\
  \ `URI` 创建请求构建器，并构建请求。\n\n在请求发送到 Web 服务器之前，必须完成一些准备工作。必须创建一个文件来存放接收到的图像内容：\n\n`Path\
  \ temp = Files.createTempFile(\"lighthouse\", \".jpg\");`\n\n`java.nio` 包中的 `Files`\
  \ 类可以通过调用其方法 `createTempFile(String, String)` 创建临时文件。这两个参数是用于文件名的文本标识符和文件扩展名。文件名由标识符后跟一个数字生成，例如\
  \ `lighthouse39406253848162078.jpg`。一旦你有了文件，浏览器的 `send()` 方法就可以使用响应处理器将该文件作为第二个参数。服务器的响应将存储在该文件中。以下是执行该操作的语句：\n\
  \n```java\nHttpResponse<Path> response = browser.send(request, HttpResponse.BodyHandler.asFile(temp));\n\
  ```\n\n`request` 是使用构建器和图像的 Web 地址 (`URI`) 创建的 `HttpRequest` 对象。主体处理器的 `asFile(Path)`\
  \ 方法将指定的文件设为图像数据的目标地。此临时文件可以通过重命名将其保存为永久文件：\n\n```java\nFile perm = new File(\"\
  lighthouse.jpg\");\ntemp.toFile().renameTo(perm);\n```\n\n在 NetBeans 中，在 `com.javahours`\
  \ 包中创建一个空的 `ImageDownloader.java` 文件，然后将其填入列表 2.2 中的源代码。\n\n### 列表 2.2 ImageDownloader.java\
  \ 的完整文本\n\n```java\npackage com.javahours;\n\nimport java.io.*;\nimport java.net.*;\n\
  import java.nio.file.*;\nimport jdk.incubator.http.*;\n\npublic class ImageDownloader\
  \ {\n    public ImageDownloader() {\n        String uri = \"http://www.javahead.org/media/lighthouse.jpg\"\
  ;\n        try\n\n            load(uri);\n        } catch (URISyntaxException oops)\
  \ {\n            System.out.println(\"Bad URI: \" + oops.getMessage());\n      \
  \  } catch (IOException | InterruptedException oops) {\n            System.out.println(\"\
  Error: \" + oops.getMessage());\n        }\n    }\n\n    public void load(String\
  \ imageUri) throws URISyntaxException, IOException, InterruptedException {\n   \
  \     // create the web client\n        HttpClient browser = HttpClient.newHttpClient();\n\
  \        // build a request for the image\n        URI uri = new URI(imageUri);\n\
  \        HttpRequest.Builder bob = HttpRequest.newBuilder(uri);\n        HttpRequest\
  \ request = bob.build();\n        // create a file to hold the image data\n    \
  \    Path temp = Files.createTempFile(\"lighthouse\", \".jpg\");\n        // execute\
  \ the request and retrieve the data\n        HttpResponse<Path> response = browser.send(request,\n\
  \            HttpResponse.BodyHandler.asFile(temp));\n        System.out.println(\"\
  Image saved to \" + temp.toFile().getAbsolutePath());\n        // save the file\
  \ permanently\n        File perm = new File(\"lighthouse.jpg\");\n        temp.toFile().renameTo(perm);\n\
  \        System.out.println(\"Image moved to \" + perm.getAbsolutePath());\n   \
  \ }\n\n    public static void main(String[] arguments) {\n        new ImageDownloader();\n\
  \    }\n}\n```\n\n当运行 `ImageDownloader` 应用程序时，项目主文件夹中会出现一个名为 `lighthouse.jpg` 的文件。点击\
  \ Files 选项卡将其带到最前（位于 NetBeans 中与 Projects 窗格相同的部分）。双击文件在主面板中打开它，如图 21.2 所示。\n\n\
  程序分别在第 34–35 行和 39 行显示临时和永久图像文件的位置。\n\n![Image](img/21fig02.jpg)\n\n**图 21.2**\n\
  \n从网络下载图像文件。\n\n### 在网络上发布数据\n\n目前为止，本小时重点是使用 HTTP 从网络获取内容。现在是时候返回一些东西了。最后一个项目是\
  \ SalutonVerkisto，这是一个 Java 应用程序，使用 POST 请求向作者的 Web 服务器发送消息。\n\nPOST 请求可以编码大量数据供服务器接收，例如网络博客文章甚至是图像或视频文件。GET\
  \ 请求也可以向服务器携带信息，但它受限于 URI 中可以包含的内容。\n\n\n\n\n\n点击此处查看代码\n\n`String site = \"[`workbench.cadenhead.org/post-a-comment.php`](http://workbench.cadenhead.org/post-a-comment.php)\"\
  ;`\n\n`URI uri = new URI(site);`\n\n两个字符串 `yourName` 和 `yourMessage` 包含了将发送的名称和注释：\n\
  \n点击此处查看代码\n\n`String yourName = \"Sam Snett of Indianapolis\";`\n\n`String yourMessage\
  \ = \"Your book is pretty good, if I do say so myself.\";`\n\n这些信息将通过 HTTP 请求发送到\
  \ Web 服务器，与之前的项目一样。在发送注释之前，必须使用 `HttpRequest.BodyProcessor` 内部类的方法进行编码。\n\n该类有一个\
  \ `fromString()` 方法，该方法接收一组由 `&` 字符分隔的长字符串，包含多个键值对：\n\n点击此处查看代码\n\n```java\nHttpRequest.BodyProcessor\
  \ proc = HttpRequest.BodyProcessor.fromString (\n    \"name=\" + URLEncoder.encode(yourName,\
  \ \"UTF-8\") +\n    \"&comment=\" + URLEncoder.encode(yourMessage, \"UTF-8\") +\n\
  \    \"&mode=\" + URLEncoder.encode(\"demo\", \"UTF-8\")\n);\n```\n\n`HttpRequest.BodyProcessor`\
  \ 的 `encode(String, String)` 方法接受两个参数：消息和要使用的字符编码。适当的编码取决于 Web 服务器能接受的内容。我服务器上的脚本可以接受\
  \ UTF-8，因此在这里使用了该编码。\n\n此方法调用指定了三个键值对：`name`、`comment` 和 `mode`。前两个的值来自 `yourName`\
  \ 和 `yourMessage`。第三个 `mode` 的值为“demo”，它让服务器脚本知道消息的目的。（这也有助于过滤掉可能向脚本发送垃圾信息的垃圾邮件群发者。）\n\
  \n处理后的消息 `proc` 可以通过调用 `newBuilder(URI)` 方法来创建一个请求构建器，随后再进行另外三个调用。\n\n当先显示代码时，这些内容会更容易理解：\n\
  \n点击此处查看代码\n\n```java\nHttpRequest.Builder newBuilder = HttpRequest.newBuilder(uri)\n\
  \    .header(\"Content-Type\", \"application/x-www-form-urlencoded\")\n    .header(\"\
  Accept\", \"text/plain\")\n    .POST(proc);\n```\n\n此方法调用将四个调用堆叠在一起。这之所以有效，是因为每个调用都是对\
  \ `HttpRequest.Builder` 的调用并返回构建器对象。以下是这些调用按顺序完成的任务：\n\n1. `newBuilder(URI)` 为该\
  \ Web 地址创建一个构建器。\n2. `header(String, String)` 将名为 `Content-Type` 的请求头设置为值“application/x-www-form-urlencoded”。这告诉服务器正在发送\
  \ Web 表单。\n3. 另一个 `header()` 调用将 `Accept` 设置为“text/plain”，即请求的 MIME 类型。\n4. `post(HttpRequest.BodyProcessor)`\
  \ 将编码后的消息格式化为 HTTP POST 请求。\n\n现在构建器已就绪，可以构建请求了：\n\n点击此处查看代码\n\n```java\nHttpRequest\
  \ request = newBuilder.build();\n```\n\n请求通过浏览器的 `send(HttpRequest, HttpResponse.BodyHandler)`\
  \ 调用发送，该调用包含请求和一个将响应获取为字符串的处理程序：\n\n点击此处查看代码\n\n```java\nHttpResponse<String> response\
  \ = client.send(request,\n    HttpResponse.BodyHandler.asString());\n\nSystem.out.println(response.body());\n\
  ```\n\n`ServerCheck` 也使用了相同的技术，但这次显示的是响应。\n\n在 `com.java24hours` 包中创建一个空的 Java 文件作为\
  \ `SalutonVerkisto` 应用程序，并在 列表 21.3 中输入源码。\n\n**列表 21.3 `SalutonVerkisto.java` 的全文**\n\
  \n点击此处查看代码\n\n```java\npackage com.java24hours;\n\nimport java.io.*;\nimport java.net.*;\n\
  import jdk.incubator.http.*;\n\npublic class SalutonVerkisto {\n\n    public SalutonVerkisto()\
  \ {\n        String site = \"http://workbench.cadenhead.org/post-a-comment.php\"\
  ;\n        try {\n            postMessage(site);\n        } catch (URISyntaxException\
  \ oops) {\n            System.out.println(\"Bad URI: \" + oops.getMessage());\n\
  \        } catch (IOException | InterruptedException oops) {\n            System.out.println(\"\
  Error: \" + oops.getMessage());\n        }\n    }\n\n    public void postMessage(String\
  \ server) throws IOException, URISyntaxException, InterruptedException {\n     \
  \   HttpClient client = HttpClient.newHttpClient();\n        URI uri = new URI(server);\n\
  \        String yourName = \"Sam Snett of Indianapolis\";\n        String yourMessage\
  \ = \"Your book is pretty good, if I do say so myself.\";\n        HttpRequest.BodyProcessor\
  \ proc = HttpRequest.BodyProcessor.fromString(\n            \"name=\" + URLEncoder.encode(yourName,\
  \ \"UTF-8\") +\n            \"&comment=\" + URLEncoder.encode(yourMessage, \"UTF-8\"\
  ) +\n            \"&mode=\" + URLEncoder.encode(\"demo\", \"UTF-8\")\n        );\n\
  \        HttpRequest.Builder newBuilder = HttpRequest.newBuilder(uri)\n        \
  \    .header(\"Content-Type\", \"application/x-www-form-urlencoded\")\n        \
  \    .header(\"Accept\", \"text/plain\")\n            .POST(proc);\n        HttpRequest\
  \ request = newBuilder.build();\n        HttpResponse<String> response = client.send(request,\n\
  \            HttpResponse.BodyHandler.asString());\n        System.out.println(response.body());\n\
  \    }\n\n    public static void main(String[] args) {\n        new SalutonVerkisto();\n\
  \    }\n}\n```\n\n\n\n\n\n第一个网页地址位于 `http://info.cern.ch/hypertext/WWW/TheProject.html`，随着\
  \ Web 吸引了用户、出版者和软件开发人员，它每天都会更新。\n\n该网站将 Web 定义为“一种广域多媒体信息检索计划，旨在提供对庞大文档宇宙的访问”。\n\
  \n### 测验\n\n通过回答以下问题，检查你对 HTTP 编程这一 Web 信息知识的掌握程度。\n\n**1.** 哪种类型的请求可以向 Web 服务器发送信息？\n\
  \n**A.** GET\n\n**B.** POST\n\n**C.** GET 和 POST 都可以\n\n**2.** 哪个类持有从由请求产生的服务器接收到的信息？\n\
  \n**A.** `HttpClient`\n\n**B.** `HttpResponse`\n\n**C.** `HttpRequest`\n\n**3.**\
  \ 使用 `Optional` 数据结构的一个理由是什么？\n\n**A.** 为了避免 `NullPointerException` 错误。\n\n**B.**\
  \ 为了存储 `null` 值集合。\n\n**C.** 为了运行得更快。\n\n#### 答案\n\n**1. C.** POST 发送大量数据；GET 在\
  \ Web 地址（URI）上发送数据。\n\n**2. B.** `HttpResponse` 对象是通过调用浏览器的 `send()` 方法返回的。\n\n\
  **3. A.** 调用 `isPresent()` 用于检查该结构持有的是 `null` 而不是一个有效对象。\n\n#### 活动\n\n为了进一步加强对本小时\
  \ Web 编程主题的理解，请完成以下活动：\n\n![Image](img/arrow.jpg) 为 `ServerCheck` 程序添加另外五个科技公司首页。\n\
  \n![Image](img/arrow.jpg) 编写一个程序，使用 HTTP 响应的“Content-Type”和“Content-Encoding”头部来报告服务器采用的\
  \ MIME 类型和字符编码。\n\n要查看实现这些活动的 Java 程序，请访问书籍网站 `www.java24hours.com`。\n\n# 第 22 小时\n\
  \n创建 Java2D 图形\n\n### 本小时待办事项：\n\n![Image](img/arrow.jpg) 设置文本的字体和颜色。\n\n![Image](img/arrow.jpg)\
  \ 设置容器的背景颜色。\n\n![Image](img/arrow.jpg) 绘制线条、矩形和其他形状。\n\n![Image](img/arrow.jpg)\
  \ 绘制 GIF 和 JPEG 图形。\n\n![Image](img/arrow.jpg) 绘制填充和未填充形状。\n\n在本小时中，你将学习如何将容器——即存放图形用户界面（GUI）组件的普通灰色面板和框架——变成艺术画布，你可以在上面绘制字体、颜色、形状和图形。\n\
  \n### 使用 `Font` 类\n\nJava 中的颜色和字体通过 `java.awt` 包中的 `Color` 和 `Font` 类表示。通过这些类，你可以用不同的字体和大小显示文本，并更改文本和图形的颜色。字体通过\
  \ `Font(String, int, int)` 构造函数创建，它接受三个参数：\n\n- ![Image](img/arrow.jpg) 字体的类型，可以是通用名称（“Dialog”、“DialogInput”、“Monospaced”、“SanSerif”或“Serif”）或实际字体名称（“Arial\
  \ Black”、“Helvetica”或“Courier New”）\n- ![Image](img/arrow.jpg) 样式，取三个类变量之一：`Font.BOLD`、`Font.ITALIC`或`Font.PLAIN`\n\
  - ![Image](img/arrow.jpg) 以磅为单位的字体大小\n\n以下语句创建了一个 12 磅斜体 Serif 字体：\n\n点击此处查看代码\n\
  \n```\nFont current = new Font(\"Serif\", Font.ITALIC, 12);\n```\n\n如果你使用的是特定字体而不是通用字体之一，则该字体必须安装在运行你程序的用户的计算机上。\n\
  \n你可以通过相加字体样式来组合字体样式，如下例所示：\n\n点击此处查看代码\n\n```\nFont headline = new Font(\"Courier\
  \ New\", Font.BOLD + Font.ITALIC, 72);\n```\n\n当你拥有一个字体时，调用 `Graphics2D` 组件的 `setFont(Font)`\
  \ 方法将其指定为当前字体。所有后续绘制操作都将使用该字体，直到设置另一个字体。以下代码创建了一个“Comic Sans”字体对象，并在绘制文本之前将其指定为当前字体：\n\
  \n点击此处查看代码\n\n```\npublic void paintComponent(Graphics comp) {\n    Graphics2D comp2D\
  \ = (Graphics2D) comp;\n    Font font = new Font(\"Comic Sans\", Font.BOLD, 15);\n\
  \    comp2D.setFont(font);\n    comp2D.drawString(\"Potrzebie!\", 5, 50);\n}\n```\n\
  \nJava 支持抗锯齿，以使字体和图形更加光滑且不那么颗粒。要启用此功能，你必须设置渲染提示。`Graphics2D` 对象有一个 `setRenderingHint(int,\
  \ int)` 方法，接受两个参数：\n\n- ![Image](img/arrow.jpg) 渲染提示的键\n- ![Image](img/arrow.jpg)\
  \ 与该键关联的值\n\n这些值是 `java.awt` 中 `RenderingHints` 类的类变量。要激活抗锯齿，请调用：\n\n```\ncomp2D.setRenderingHint(RenderingHints.KEY_ANTIASING,\
  \ RenderingHints.VALUE_ANTIALIAS_ON);\n```\n\n### 使用 `Color` 类\n\nJava 中的颜色由 `Color`\
  \ 类表示，该类包含以下常量：`black`、`blue`、`cyan`、`darkGray`、`gray`、`lightGray`、`magenta`、`orange`、`pink`、`red`、`white`\
  \ 和 `yellow`。\n\n在容器中，你可以像这样调用 `setBackground(Color)` 方法，使用这些常量设置组件的背景：\n\n```\n\
  setBackground(Color.orange);\n```\n\n当前颜色像当前字体一样，必须在使用 `setColor(Color)` 方法绘制之前设置。以下代码包含一条将当前颜色设置为蓝色并用该颜色绘制文本的语句：\n\
  \n```\npublic void paintComponent(Graphics comp) {\n    Graphics2D comp2D = (Graphics2D)\
  \ comp;\n    comp2D.setColor(Color.blue);\n    comp2D.setFont(font);\n}\n```\n\n\
  与直接在容器上调用的 `setBackground()` 方法不同，你必须在 `Graphics2D` 对象上调用 `setColor()` 方法。\n\n###\
  \ 创建自定义颜色\n\n你可以通过指定红绿蓝（RGB）值在 Java 中创建自定义颜色。RGB 通过颜色中存在的红、绿、蓝量来定义颜色。每个值的范围从 0（无该颜色）到\
  \ 255（最大量）。\n\n`Color(int, int, int)` 构造函数接受红、绿、蓝值的参数。以下代码绘制了一个在青绿色背景（0 红、101 绿、118\
  \ 蓝）上显示金色文本（159 红、121 绿、44 蓝）的面板：\n\n点击此处查看代码\n\n```java\nimport java.awt.*;\nimport\
  \ javax.swing.*;\n\npublic class Jacksonville extends JPanel {\n    Color gold =\
  \ new Color(159, 121, 44);\n    Color teal = new Color(0, 101, 118);\n\n    public\
  \ void paintComponent(Graphics comp) {\n        Graphics2D comp2D = (Graphics2D)\
  \ comp;\n        comp2D.setColor(teal);\n        comp2D.fillRect(0, 0, 200, 100);\n\
  \        comp2D.setColor(gold);\n        comp2D.drawString(\"Go, Jaguars!\", 5,\
  \ 50);\n    }\n}\n```\n\n此示例调用 `Graphics2D` 的 `fillRect()` 方法，使用当前颜色绘制填充矩形。\n\n\
  注意\n\nRGB 值允许创建 1650 万种可能的组合，尽管大多数计算机显示器对其中大多数组合只能提供接近的近似。对于焦焦午夜蓝是否与中等淡婴儿绿相配的建议，请阅读《在书店排队时自学色彩感》。\n\
  \n### 绘制线条和形状\n\n\n\n\n\n在 Java 程序中，绘制线条和矩形等形状与显示文本一样简单。你只需要一个 `Graphics2D` 对象来定义绘制表面，以及代表要绘制内容的对象的对象。\n\
  \n`Graphics2D` 对象具有用于通过命令绘制文本的方法，如下：\n\n点击此处查看代码图像\n\n```\ncomp2D.drawString(\"\
  Draw, pardner!\", 15, 40);\n```\n\n此语句在坐标 (15, 40) 处绘制了文本“Draw, pardner!”。绘制方法使用与文本相同的\
  \ (x, y) 坐标系。(0, 0) 坐标点位于容器的左上角，`x` 值向右增加，`y` 值向下增加。你可以通过以下语句确定在帧或其他容器中可以使用的最大 `(x,\
  \ y)` 值：\n\n点击此处查看代码图像\n\n```java\nint maxXValue = getSize().width;\nint maxYValue\
  \ = getSize().height;\n```\n\n除了线条外，你绘制的形状可以是填充的也可以是未填充的。填充形状用当前颜色绘制，完全填充形状所占据的空间。未填充形状则用当前颜色绘制一个边框。\n\
  \n### 绘制线条\n\n对象的 2D 绘制被创建，并代表正在绘制的形状。\n\n定义形状的对象属于 `java.awt.geom` 包中的类集合。\n\n\
  `Line2D.Float` 类创建了一条连接起点 (x, y) 点和终点 (x, y) 点的线条。以下语句创建了一条从点 (40, 200) 到点 (70,\
  \ 130) 的线条：\n\n点击此处查看代码图像\n\n```java\nLine2D.Float line = new Line2D.Float(40F,\
  \ 200F, 70F, 130F);\n```\n\n参数后面紧跟着字母 `F`，用表示它们是浮点值。如果省略了该字母，Java 将把它们视为整数。\n\n\
  注意\n\n`Line2D.Float` 的类名中间有一个点，这与你之前接触过的多数类不同。这是因为 `Float` 是 `Line2D` 类的一个静态内部类，该主题在第\
  \ 16 小“使用内部类和闭包”中介绍过。\n\n线条以外的所有形状都是通过调用 `Graphics2D` 类的方法绘制的：`draw()` 用于轮廓，`fill()`\
  \ 用于填充形状。\n\n以下语句绘制了在上一个示例中创建的 `line` 对象：\n\n```java\ncomp2D.draw(line);\n```\n\n\
  ### 绘制矩形\n\n矩形可以是填充的或未填充的，并且具有圆角或直角。它们使用 `Rectangle2D.Float(int, int, int, int)`\
  \ 构造函数创建，其参数如下：\n\n![Image](img/arrow.jpg) 矩形左上角的 `x` 坐标\n\n![Image](img/arrow.jpg)\
  \ 左上角的 `y` 坐标\n\n![Image](img/arrow.jpg) 矩形的宽度\n\n![Image](img/arrow.jpg) 矩形的高度\n\
  \n以下语句绘制了一个带有直角的未填充矩形：\n\n点击此处查看代码图像\n\n```java\nRectangle2D.Float box = new Rectangle2D.Float(245F,\
  \ 65F, 20F, 10F);\n```\n\n该语句创建了一个矩形，其左上角位于坐标 (x, y) (245, 65)，宽度为 20 像素，高度为 10。要以轮廓的形式绘制此矩形，可以使用以下语句：\n\
  \n```java\ncomp2D.draw(box);\n```\n\n如果你想让矩形变为填充，请使用 `fill()` 方法：\n\n```java\ncomp.fill(box);\n\
  ```\n\n你可以使用 `RoundRectangle2D.Float` 类创建圆角矩形而非直角矩形。\n\n该类的构造函数以 `Rectangle2D.Float`\
  \ 类相同的四个参数开头，增加了以下两个参数：\n\n![Image](img/arrow.jpg) 距离矩形角部 `x` 方向的像素数\n\n![Image](img/arrow.jpg)\
  \ 距离角部 `y` 方向的像素数\n\n这些距离用于确定矩形角的圆角处理应该从哪里开始。\n\n以下语句创建了一个圆角矩形：\n\n点击此处查看代码图像\n\n\
  ```java\nRoundRectangle2D.Float ro = new RoundRectangle2D.Float(\n    10F, 10F,\n\
  \    100F, 80F,\n    15F, 15F);\n```\n\n该矩形的左上角位于 (10, 10) 坐标。第三和第四参数指定了矩形的宽度和高度。在这种情况下，它的宽度应为\
  \ 100 像素，高度为 80 像素。\n\n`drawRoundRect()` 的最后两个参数指定四个角都应该从距离 (10, 10) 处 15 像素的地方开始圆角化。\n\
  \n### 绘制椭圆和圆\n\n在 Java 中可以绘制的另一种圆形形状是椭圆。\n\n椭圆和圆可以使用 `Ellipse2D.Float` 类创建，它具有相同的四个参数：\n\
  \n![Image](img/arrow.jpg) 椭形的 `x` 坐标\n\n![Image](img/arrow.jpg) 椭形的 `y` 坐标\n\n![Image](img/arrow.jpg)\
  \ 椭形的宽度\n\n![Image](img/arrow.jpg) 椭形的高度\n\n`(x, y)` 坐标并不指示椭形的中心。相反，`(x, y)` 坐标、宽度和高度描述了左上角。以下语句在\
  \ (245, 45) 处创建一个宽度和高度均为 5 的圆：\n\n点击此处查看代码图像\n\n```java\nEllipse2D.Float cir = new\
  \ Ellipse2D.Float(245F, 45F, 5F, 5F);\n```\n\n### 绘制弧\n\n另一种圆形形状是弧。弧使用 `Arc2D.Float`\
  \ 类创建，它具有许多相同的参数。通过指定椭圆、可见部分（以度为单位）以及弧的起点来绘制弧。\n\n弧的起点大小从 0 到 359 度，按逆时针方向旋转，0 度处位于\
  \ 3 点钟位置，如图 22.1 所示。\n\n![Image](img/22fig.jpg)\n\n**图 22.1**\n\n弧的定义。\n\n弧的类型使用类变量指定：`PIE`\
  \ 用于饼图切片，`CLOSED` 如果端点用直线连接，`OPEN` 如果端点不应连接。\n\n以下语句在 (100, 50) 处绘制了一个开放弧，其长度为 120\
  \ 度，从 30 度标记开始，宽度为 65，高度为 75：\n\n点击此处查看代码图像\n\n```java\nArc2D.Float smile = new\
  \ Arc2D.Float(100F, 50F, 65F, 75F, 30F, 120F, Arc2D.Float.OPEN);\n```\n\n### 制作饼图\n\
  \n为了结束本节，你创建一个 `PiePanel`，这是一个显示饼图的 GUI 组件。该组件是 `JPanel` 的子类，`JPanel` 是一个作为绘制内容的简单容器。\n\
  \n创建类的一种方法是定义创建该类对象的方法。使用 `PiePanel` 类的程序必须执行以下步骤：\n\n![Image](img/arrow.jpg) 使用构造函数方法\
  \ `PiePanel(int)` 创建 `PiePanel` 对象。指定的整数参数是饼图包含的切片数。\n\n![Image](img/arrow.jpg)\
  \ 调用对象的 `addSlice(Color, float)` 方法，为切片指定颜色和值。\n\n`PiePanel` 中每个切片的值代表其所代表的数量。\n\
  \n\n\n\n例如，根据高等教育办公处的数据，表 22.1 显示了美国在该计划实施前 38 年学生贷款还款状态的数据。\n\n#### 表 22.1 美国学生贷款还款\n\
  \n| 学生偿还的金额 | 1010 亿美元 |\n| :--- | :--- |\n| 贷款给在读学生的剩余金额 | 680 亿美元 |\n| 贷款给正在还款的学生的金额\
  \ | 910 亿美元 |\n| 贷款给违约学生的金额 | 250 亿美元 |\n\n你可以使用以下语句通过 `PiePanel` 在饼图图中表示这些数据：\n\
  \n点击此处查看代码图像\n\n```java\nPiePanel loans = new PiePanel(4);\nloans.addSlice(Color.green,\
  \ 101F);\nloans.addSlice(Color.yellow, 68F);\nloans.addSlice(Color.blue, 91F);\n\
  loans.addSlice(Color.red, 25F);\n```\n\n图 22.2 显示了在应用程序框架中的结果，该框架包含一个组件：用学生贷款数据创建的\
  \ `PiePanel`。\n\n![Image](img/22fig02.jpg)\n\n### 图 22.2\n在饼图上显示学生贷款数据。\n\n当创建一个\
  \ `PiePanel` 对象时，扇区的数量是在构造函数中指定的。绘制每个扇区，你还需要知道另外三点：\n\n![Image](img/arrow.jpg) 扇区的颜色，由一个\
  \ `Color` 对象表示\n![Image](img/arrow.jpg) 每个扇区代表的值\n![Image](img/arrow.jpg) 所有扇区代表的总值\n\
  \n使用一个新的新的辅助类 `PieSlice` 来表示饼图中的每个扇区：\n\n点击此处查看代码图像\n\n```java\nimport java.awt.*;\n\
  \nclass PieSlice {\n    Color color = Color.lightGray;\n    float size = 0;\n  \
  \  PieSlice(Color pColor, float pSize) {\n        color = pColor;\n        size\
  \ = pSize;\n    }\n}\n```\n\n每个扇区通过调用 `PieSlice(`Color`, `float`)` 构建。所有扇区的组合值被存储在\
  \ `PiePanel` 类的私有实例变量 `totalSize` 中。此外，还有面板背景颜色（`background`）和用于跟踪扇区的计数器（`current`）的实例变量：\n\
  \n```java\nprivate int current = 0;\nprivate float totalSize = 0;\nprivate Color\
  \ background;\n```\n\n现在你已经有一个 `PieSlice` 类可以工作，你可以通过另一个实例变量创建一个 `PieSlice` 对象数组：\n\
  \n```java\nprivate PieSlice[] slice;\n```\n\n当你创建一个 `PiePanel` 对象时，没有任何扇区被分配颜色或大小。在构造函数中你必须做的事情只有定义\
  \ `slice` 数组的大小并保存面板的背景颜色：\n\n点击此处查看代码图像\n\n```java\npublic PiePanel(int sliceCount)\
  \ {\n    slice = new PieSlice[sliceCount];\n    background = getBackground();\n\
  }\n```\n\n使用 `addSlice(`Color`, `float`)` 方法向面板添加一个饼图扇区：\n\n点击此处查看代码图像\n\n```java\n\
  public void addSlice(Color sColor, float sSize) {\n    if (current <= slice.length)\
  \ {\n        slice[current] = new PieSlice(sColor, sSize);\n        totalSize +=\
  \ sSize;\n        current++;\n    }\n}\n```\n\n`current` 实例变量用于将每个扇区放入 `slice` 数组的对应元素中。数组的\
  \ `length` 变量包含了该数组定义的容纳数量；只要 `current` 不大于 `slice.length`，你就可以继续向面板添加扇区。\n\n正如你预期的那样，`PiePanel`\
  \ 类在它的 `paintComponent()` 方法中处理所有的绘制操作。这项任务中最困难的部分是绘制代表饼图每个扇区的弧。这在以下语句中处理：\n\n点击此处查看代码图像\n\
  \n```java\nfloat start = 0;\nfor (int i = 0; i < slice.length; i++) {\n    float\
  \ extent = slice[i].size * 360F / totalSize;\n    comp2D.setColor(slice[i].color);\n\
  \    Arc2D.Float drawSlice = new Arc2D.Float(\n        xInset, yInset, width, height,\
  \ start, extent,\n        Arc2D.Float.PIE);\n    start += extent;\n    comp2D.fill(drawSlice);\n\
  }\n```\n\n`start` 变量记录绘制弧的起始位置，而 `extent` 记录弧的大小。如果你知道所有饼扇区的总大小以及特定扇区的大小，你可以通过将弧的大小乘以\
  \ 360 再除以所有扇区的总和来计算出 `extent`。\n\n所有的弧都是在一个循环中绘制的。\n\n\n\n\n```java\n13:      Color\
  \ inBetweenGreen = new Color(0x00, 0x99, 0x66);\n14:      Color norwegianBlue =\
  \ new Color(0x33, 0xCC, 0xCC);\n15:      Color purpleRain = new Color(0x66, 0x33,\
  \ 0x99);\n16:      Color freckle = new Color(0x99, 0x66, 0x33);\n17:\n18: public\
  \ PieFrame() {\n19:      super(\"Pie Graph\");\n20:          setLookAndFeel();\n\
  21:          setSize(320, 290);\n22:          setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  23:          setVisible(true);\n24:\n25:          PiePanel pie = new PiePanel(10);\n\
  26:          pie.addSlice(uneasyBeingGreen, 1350);\n27:          pie.addSlice(zuzusPetals,\
  \ 1221);\n28:          pie.addSlice(zootSuit, 316);\n29:          pie.addSlice(sweetHomeAvocado,\
  \ 251);\n30:          pie.addSlice(shrinkingViolet, 201);\n31:          pie.addSlice(miamiNice,\
  \ 193);\n32:          pie.addSlice(inBetweenGreen, 173);\n33:          pie.addSlice(norwegianBlue,\
  \ 164);\n34:          pie.addSlice(purpleRain, 143);\n35:          pie.addSlice(freckle,\
  \ 127);\n36:          add(pie);\n37:     }\n38:     \n39: private void setLookAndFeel()\
  \ {\n40: try {\n41:              UIManager.setLookAndFeel(\n42: \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n43:              );\n44:         } catch (Exception exc) {\n45: // ignore error\n\
  46:         }\n47:     }\n48:\n49: public static void main(String[] arguments) {\n\
  50:          PieFrame pf = new PieFrame();\n51:     }\n52: }\n```\n\n`PieFrame`\
  \ 类是一个简单的图形用户界面，它包含一个组件：在第 25 行创建的 `PiePanel` 对象。在第 26–35 行中，调用了 10 次对象的 `addSlice()`\
  \ 方法来向饼图添加扇区。\n\n当你运行该应用程序时，`PieFrame` 会显示一个饼图，展示人口最多的 10 个国家的数据（单位：百万），数据来自 2017\
  \ 年 6 月的美国人口普查国际数据库报告。按顺序排列为：中国（13.79 亿）、印度（12.82 亿）、美国（3.27 亿）、印度尼西亚（2.61 亿）、巴西（2.07\
  \ 亿）、巴基斯坦（2.05 亿）、尼日利亚（1.91 亿）、孟加拉国（1.58 亿）、俄罗斯（1.42 亿）和日本（1.26 亿）。\n\n由于 Java 的\
  \ `Color` 类中只定义了几颜色，在这里创建了 10 个新颜色供使用，并赋予了描述性名称。这些颜色以十六进制值表示——在 Java 中，十六进制字面量前面带有\
  \ `0x`——但也可以在每个 `Color()` 构造函数中指定十进制值。\n\n图 22.3 显示了该应用程序的运行情况。\n\n![Image](img/22fig03.jpg)\n\
  \n**图 22.3**\n\n在饼图中显示人口数据。\n\n### 注意\n你可以通过访问 `www.cadenhead.org/` 获取当前的美国人口普查数据，该网站会重定向到\
  \ `www.census.gov`。\n\n### 总结\n通过使用字体、颜色和图形，你可以吸引用户对程序元素的注意力并使其更具吸引力。使用 Java 提供的形状进行绘制可能看起来麻烦。然而，使用多边形绘制的图形相比加载的图像有两个优势：\n\
  \n![Image](img/arrow.jpg) **速度**——即使是较小的图标，加载和显示也比一组多边形要慢。\n\n![Image](img/arrow.jpg)\
  \ **缩放**——你可以通过更改值来改变整个图像的大小。例如，你可以在 `Sign` 类中添加一个函数，在创建每个形状之前乘以所有的 `(x, y)` 点，结果将翻倍。\n\
  \n### 工作坊\n\n#### 问答\n**Q. 如何绘制顺时针而不是逆时针的弧？**\n**A.** 你可以通过指定弧的大小为负数来实现。弧从相同的点开始但方向相反。例如，以下语句在\
  \ `(35, 20)` 处绘制了一个长度为 90 度、从 0 度开始、顺时针方向、高度为 20 宽度为 15 的开口弧：\n\n```\nArc2D.Float\
  \ smile = new Arc2D.Float(35F, 20F, 15F, 20F, 0F, -90F, OPEN);\n```\n\n**Q. 椭圆没有角。`Ellipse.Float`\
  \ 构造函数中指定的 `(x, y)` 坐标是什么？**\n**A.** `(x, y)` 坐标代表椭圆或圆的最小 x 值和最小 y 值。如果你周围画一个不可见的矩形，矩形的左上角将是方法的\
  \ x 和 y 坐标。\n\n**Q. 为什么摄影师让你说“cheese”（微笑）？**\n**A.** “cheese”这个词会强制你的嘴部变成微笑，就像 whiskey、breeze\
  \ 和 money 一样。以长 e 结尾的单词通常会导致你的嘴角上扬并露出牙齿。摄影师有时使用的另一个词是“grin”。虽然它不以 e 结尾，但它能让人微笑。西班牙摄影师让人说“patata”，法国人说“ouiti”，德国人说“käsekuchen”。\n\
  \n#### 测试\n回答以下问题，测试你的字体和颜色技巧是否很棒。\n\n1. 下面哪个不是选择颜色的常量？**\nA. `Color.cyan`\nB. `Color.purple`\n\
  C. `Color.magenta`\n\n2. 当你更改某物的颜色并在容器上重绘时，必须做什么才能使其可见？**\nA. 使用 `drawColor()` 方法。\n\
  B. 使用 `repaint()` 语句。\nC. 什么都不做。\n\n3. RGB 首字母代表什么？**\nA. Roy G. Biv\nB. Red Green\
  \ Blue\nC. Lucy in the Sky with Diamonds\n\n#### 答案\n1. B.** 奥兰多城 SC 的主颜色——自豪的紫色在\
  \ `Color` 类中缺失。\n\n2. B.** 对 `repaint()` 的调用会导致 `paintComponent()` 方法被调用。\n\n3.\
  \ B.** 如果 C 是正确答案，你可以使用多年后回忆中可见的颜色。\n\n#### 活动\n为了进一步探索在程序中使用字体和颜色的可能性，请执行以下活动：\n\
  \n![Image](img/arrow.jpg) 创建 `PieFrame` 类的版本，将颜色值和饼扇值作为命令行参数，而不是将它们包含在应用程序源代码中。\n\
  \n![Image](img/arrow.jpg) 创建一个在面板上使用颜色、形状和字体绘制停止标志的应用程序。\n\n要查看实现这些活动的 Java 程序，请访问书籍的网站\
  \ `www.java24hours.com`。\n\n# 第 23 节\n使用 Java 创建 Minecraft Mod\n\n### 本节的任务列表：\n\
  ![Image](img/arrow.jpg) 在你的电脑上安装 Minecraft 服务器。\n![Image](img/arrow.jpg) 写一个启动服务器的脚本。\n\
  ![Image](img/arrow.jpg) 为 Minecraft mod 编程设置 NetBeans。\n![Image](img/arrow.jpg)\
  \ 为 mod 创建框架。\n![Image](img/arrow.jpg) 设计一个生成怪物的 mod。\n![Image](img/arrow.jpg) 让一个怪物成为另一个的骑手。\n\
  ![Image](img/arrow.jpg) 找到游戏中的每个怪物并攻击它。\n![Image](img/arrow.jpg) 编写一个从世界上挖掘出巨大块的\
  \ mod。\n\n书的这一节涵盖了近年来成为现象的内容。\n\n我有两个青少年儿子，他们是热衷的游戏玩家，他们都玩多人建筑游戏 Minecraft。他们同年纪的大多数表兄弟兄弟也在玩这个游戏。当我告诉任何年轻人我写关于\
  \ Java 编程的书时，他们都会问我同一个问题：它会教我如何创建 Minecraft mod 吗？\n\n\n\n\n\nMods（模组）是玩家设计并共享的游戏扩展程序。Minecraft\
  \ 游戏是用 `Java` 编写的，因此 mods 必须使用相同的语言进行编程。\n\n学习 `Java` 是创建 Minecraft mods 的第一步。这一小时是第二步。\n\
  \n在本小时结束时，你将在你的电脑上下载、安装并运行一个属于你自己的 Minecraft 服务器。你还将能够使用 `Java` 语言创建 mods，将其部署到服务器上，并在玩游戏时使用它们。但要小心，苦力者（creepers）四处潜伏。\n\
  \n### 设置 Minecraft 服务器\n\n开发 mods 需要访问 Minecraft 服务器。当你作为一个 mod 开发者刚起步时，实现此点的最佳方法是在自己的电脑上安装并运行一个服务器。由于目前还没有标准的方法向游戏中添加\
  \ mods，不同的服务器有不同的方法来实现这一目标。\n\n创建 mods 时最易用的是来自 Spigot Project 的工具，这是一个专门为此目的设计的\
  \ Minecraft 服务器和 `Java` 类库。Spigot 是免费的，可以从网站 [www.javaminecraft.com/spigot](http://www.javaminecraft.com/spigot)\
  \ 下载。寻找文件 `spigotserver.jar`。\n\n该文件包含了封装为 `JAR` 文件的 Minecraft 服务器和类库。Spigot API\
  \ 是一组在创建 mods 时将用到的 `Java` 包。\n\n下载完成后，在你的电脑上创建一个新文件夹并将文件存储在其中。在我的 Windows PC 上，我创建了\
  \ `c:\\minecraft\\server` 并 JAR 文件复制到其中。\n\n接下来，将 `spigotserver.jar` 复制到同一个文件夹。这是你启动\
  \ Minecraft 服务器的文件。\n\n以下命令启动服务器：\n\n```\njava -Xms1024M -Xmx1024M -jar spigotserver.jar\n\
  ```\n\n此命令告诉 Java 虚拟机运行封装为 JAR 文件 `spigotserver.jar` 的应用程序，并为程序分配 1,024MB 的内存。\n\
  \n为了避免每次运行服务器时都输入此命令，你可以创建一个包含该命令的批处理文件（batch file）或脚本文件，然后改为运行该文件。\n\n在 Windows\
  \ 上，打开如记事本之类的文本编辑器，将 列表 23.1 的文本输入文件中，并将其保存为与 `spigotserver.jar` 相同文件夹下的 `start-server.bat`。\n\
  \n**列表 23.1** `start-server.bat` 的完整文本\n\n```\n1: java -Xms1024M -Xmx1024M -jar\
  \ spigotserver.jar\n2: pause\n```\n\n双击此文件运行服务器。如果运行成功，将打开一个窗口显示服务器在启动时正在执行。\n\n\
  你将看到一个错误信息“Failed to load eula.txt”，如图 23.1 所示。这是预期中的。\n\n![Image](img/23fig01.jpg)\n\
  **图 23.1** 服务器 EULA 检查失败。\n\nMinecraft 有一份最终用户许可协议（`EULA`），在运行服务器之前必须接受该协议。访问此网页以审阅该协议：[`account.mojang.com/documents/minecraft_eula`](https://account.mojang.com/documents/minecraft_eula)。\n\
  \n现在与服务器相同的文件夹中有一个名为 `eula.txt` 的文件。该文件有一行包含以下文本：\n\n```\neula=false\n```\n\n如果你同意\
  \ `EULA`，请用编辑器打开该文件，将此行改为 `eula=true`，保存文件并再次运行服务器。\n\n服务器第一次运行时，它会创建多个文件和子文件夹，并构建世界地图。如果成功，你将看到最后的消息“[Info]\
  \ Done”以及 `>` 提示符旁闪烁的光标。\n\n`help` 命令列出了你可以使用的、控制服务器和游戏世界的命令。`stop` 命令用于关闭服务器（现在先不要这样做！）。\n\
  \n图 23.2 显示了一个正在运行的 Spigot 服务器。在服务器运行时，必须保持此窗口打开。如果你的服务器窗口看起来像这样，你可以跳过下一节直接进入“连接到服务器”。\n\
