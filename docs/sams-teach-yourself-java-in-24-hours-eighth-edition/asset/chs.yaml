  \ CD MP3 文件的人将立即被 Amazon、eBay、iTunes 以及任何地方点成火焰。\n\n### 缓冲流\n提高输入程序性能的方法之一是对输入进行缓冲。缓冲是将数据保存在内存中，以便在程序需要时以后使用。当\
  \ Java 程序需要从缓冲流获取数据时，它会首先查找缓冲区，这比从文件等源读取要快。要使用缓冲流，你首先创建一个输入流（例如 `FileInputStream`\
  \ 对象），然后使用该对象创建一个缓冲流。调用 `BufferedInputStream(InputStream)` 构造函数，并将输入流作为唯一参数。数据在从输入读取时会被缓冲。要从缓冲流中读取，调用其无参数的\
  \ `read()` 方法。将返回一个 0 到 255 之间的整数，代表流中的下一个字节数据。如果没有更多可用字节，则返回 −1。作为缓冲流的演示，你创建的下一个程序为\
  \ Java 增加了一个许多其他语言的程序员使用过的功能：控制台输入，即在运行应用程序时从控制台（也称为命令行）读取字符的能力。`System` 类包含了 `System.out.print()`\
  \ 和 `System.out.println()` 语句中使用的 `out` 变量，它还有一个名为 `in` 的类代表一个 `InputStream` 对象。该对象接收来自键盘的输入并作为流可用。你可以像处理其他输入一样处理这种输入。以下语句创建一个与\
  \ `System.in` 输入关联的缓冲流：\n\n点击此处查看代码图像\n\n```java\nBufferedInputStream bin = new\
  \ BufferedInputStream(System.in);\n```\n\n下一个项目是 `com.java24hours` 包中的 `Console`\
  \ 类，它包含一个可以在任何 Java 应用程序中接收控制台输入的方法。在名为 `Console` 的新 Java 文件中输入来自列表 20.2 的文本。\n\n\
  **列表 20.2 `Console.java` 的完整文本**\n\n点击此处查看代码图像\n\n```java\npackage com.java24hours;\n\
  \nimport java.io.*;\n\npublic class Console {\n    public static String readLine()\
