  \n# 第五部分：图形用户界面编程\n\n# 第 17 小时\n\n构建简单的用户界面\n\n### 本小时的任务列表：\n\n![Image](img/arrow.jpg)\
  \ 创建按钮等用户界面组件。\n![Image](img/arrow.jpg) 创建标签、文本字段和其他组件。\n![Image](img/arrow.jpg)\
  \ 将组件组合在一起。\n![Image](img/arrow.jpg) 将组件放入其他组件内部。\n![Image](img/arrow.jpg) 水平和和垂直滚动组件。\n\
  ![Image](img/arrow.jpg) 打开和关闭窗口。\n\n在本小时内容会变得非常复杂。你将用 Java 创建第一个图形用户界面 (GUI)，这会搞出一个大乱子。\n\
  \n计算机用户已经习惯了软件具有 GUI、通过鼠标接收用户输入并像其他程序一样工作。尽管某些用户仍在 Linux 或 Unix Shell 等命令行环境中工作，但大多数人如果遇到软件没有像\
  \ Microsoft Windows 或 Mac OS 那种点击和拖拽的图形界面，将会感到困惑。\n\nJava 通过 `Swing` 支持这种软件，`Swing`\
  \ 是 Java 类的集合，代表了作为 GUI 部分的所有不同按钮、文本字段、滑块和其他组件，以及从这些组件获取用户输入所需的类。\n\n在本小时和下一小时中，你将在\
  \ Java 中创建并组织 GUI。之后，在第 19 小时“响应用户输入”中，你将使这些接口能够接收鼠标点击和其他用户输入。\n\n### Swing 和抽象窗口工具包\n\
  \n由于 Java 是一种跨平台语言，允许你为许多操作系统编写程序，因此其图形用户界面软件必须是灵活的。它不能仅仅迎合 Windows 风格或 Mac 版本，必须处理两者以及其他平台。\n\
  \n在 Java 中，程序用户界面的开发基于 `Swing` 和一组早期名为抽象窗口工具包（Abstract Windowing Toolkit）的类。这些类使你能够创建\
  \ GUI 并接收用户输入。\n\n`Swing` 包含了编写使用 GUI 程序所需的所有内容。通过 Java 的用户界面类，你可以创建一个包含以下所有及更多内容的\
  \ GUI：\n\n![Image](img/arrow.jpg) 按钮、复选框、标签和其他简单组件\n![Image](img/arrow.jpg) 文本字段、滑块和其他更复杂的组件\n\
  ![Image](img/arrow.jpg) 下拉菜单和弹出菜单\n![Image](img/arrow.jpg) 窗口、帧、对话框、面板和 applet 窗口\n\
  \n注意\n\n`Swing` 包含了数十种组件，其自定义方式远比此处记录的要多。本书涵盖了最常用的组件及其最有用的方法。当你在接下来的四个小时中探索它们时，可以学习更多关于每个组件的知识，并在\
  \ Oracle 官方 Java 类库文档中发现新方法。可以在网页上阅读 [`download.java.net/jdk9/docs/api`](http://download.java.net/jdk9/docs/api)。它提供了\
  \ Java 9 中每个类和接口的额外参考文档。\n\n### 使用组件\n\n在 Java 中，GUI 的每个部分都由 `Swing` 包中的一个类表示。有一个用于按钮的\
  \ `JButton` 类，用于窗口的 `JWindow` 类，用于文本字段的 `JTextField` 类，以此此类推。\n\n要创建并显示界面，你需要创建对象、设置它们的变量并调用它们的方法。这些技术与你学习面向对象编程\
  \ (OOP) 时所使用的技术是相同的。\n\n当你组装 GUI 时，你处理的是两种对象：组件和容器。组件是用户界面中的单个元素，例如按钮或滑块。容器是你用来放置其他组件的组件。\n\
  \n创建界面的第一步是创建一个可以容纳组件的容器。在应用程序中，这个容器通常是一个窗口或帧。\n\n### 窗口和帧\n\n窗口和帧是可以显示在用户界面中并持有其他组件的容器。窗口是简单的容器，没有标题栏，也没有通常位于\
  \ GUI 顶部边缘的任何按钮。帧是窗口，包含了用户在运行软件时期望找到的所有常见窗口功能——例如用于关闭、扩展和缩小窗口的按钮。\n\n你使用 `Swing`\
  \ 的 `JWindow` 和 `JFrame` 类来创建这些容器。要在 Java 程序中不使用完整的包名和类名的情况下引用 Swing 类，请使用以下语句：\n\
  \n```java\nimport javax.swing.*;\n```\n\n这仅导入了 `javax.swing` 包中的类名。你还会在 `Swing`\
  \ 中用到其他包。\n\n在 Java 应用程序中使用帧的一种方法是让应用程序成为 `JFrame` 的子类。你的程序继承了作为帧运行所需的行为。以下语句创建了\
  \ `JFrame` 的子类：\n\n点击查看代码图片\n\n```java\nimport javax.swing.*;\n\npublic class MainFrame\
  \ extends JFrame {\n    public MainFrame() {\n        // 设置帧\n    }\n}\n```\n\n\
  该类创建了一个帧，但还没有完全设置它。在帧的构造函数中，创建帧时你必须做几件事：\n\n![Image](img/arrow.jpg) 调用父类 `JFrame`\
  \ 的构造函数。\n![Image](img/arrow.jpg) 设置帧的标题。\n![Image](img/arrow.jpg) 设置帧的大小。\n![Image](img/arrow.jpg)\
  \ 设置帧的外视图和感觉。\n![Image](img/arrow.jpg) 定义用户关闭帧时发生什么。\n\n你还必须使帧可见，除非由于某些原因它在应用程序运行时不应显示。\n\
  \n这些内容中的大部分可以在帧的构造函数中处理。该方法必须包含的是使用 `super` 语句调用 `JFrame` 的其中一个构造函数。这是一个示例：\n\n\
  ```java\nsuper();\n```\n\n前面的语句调用了无参数的 `JFrame` 构造函数。你也可以将帧的标题作为参数调用它：\n\n```java\n\
  super(\"Main Frame\");\n```\n\n这会将帧的标题（显示在顶部边缘标题栏中）设置为指定的字符串。在这个示例中，出现了文本“Main Frame”。\n\
  \n\n\n\n\n如果你没有以这种方式设置标题，可以调用框架的 `setTitle(String)` 方法，并将标题作为参数：\n\n```java\nsetTitle(\"\
  Main Frame\");\n```\n\n框架的大小可以通过调用其 `setSize(int, int)` 方法来建立，该方法接受两个参数：宽度高度。以下语句设置了一个宽度为\
  \ 350 像素、高度为 125 像素的框架：\n\n```java\nsetSize(350, 125);\n```\n\n设置框架大小的另一种方法是向其填充组件，然后调用不带参数的框架\
  \ `pack()` 方法：\n\n```java\npack();\n```\n\n`pack()` 方法将框架设置得足够大，以容纳框架内每个组件的优选大小（但不会更大）。每个界面组件都有一个优选大小，尽管根据组件在界面中的排列方式，这种大小有时会被会被忽略。在调用\
  \ `pack()` 之前，你不需要显式地设置框架的大小——该方法会在框架显示之前将其设置为合适的大小。\n\n每个框架在显示时，标题栏上都有一个按钮，可用于关闭框架。在\
  \ Windows 系统上，该按钮显示为框架右上角的 X。要定义点击此按钮时发生什么，请调用框架的 `setDefaultCloseOperation(int)`\
  \ 方法，并将四个 `JFrame` 类变量之一作为参数：\n\n![Image](img/arrow.jpg) `EXIT_ON_CLOSE`——点击按钮时退出程序。\n\
  \n![Image](img/arrow.jpg) `DISPOSE_ON_CLOSE`——关闭框架并继续运行应用程序。\n\n![Image](img/arrow.jpg)\
  \ `DO_NOT_HING_ON_CLOSE`——保持框架打开并继续运行。\n\n![Image](img/arrow.jpg) `HIDE_ON_CLOSE`——关闭框架并继续运行。\n\
  \n第一次调用该方法是最常见的，因为当应用程序的用户界面关闭时，意味着应用程序应该完成它的工作并关闭：\n\n点击此处查看代码图片\n\n```java\nsetDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  ```\n\n使用 Swing 创建的图形用户界面可以通过“外观和感觉”（look and feel）来定制其外观，这是一种视觉主题，控制按钮和其他组件的显示方式及其行为。\n\
  \nJava 包含了一种名为 Nimbus 的增强型外观和感觉，但在类中使用必须对其开启。设置外观和感觉是通过调用主 Swing 包中 `UIManager`\
  \ 类的 `setLookAndFeel()` 方法完成的。\n\n该方法接受一个参数：外观和感觉类的全名。\n\n以下语句将 Nimbus 设置为外观和感觉：\n\
  \n```java\nUIManager.setLookAndFeel(\n点击此处查看代码图片\n    \"javax.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n);\n```\n\n最后需要的一是让框架可见。调用其 `setVisible()` 方法并将 `true` 作为参数：\n\n```java\nsetVisible(true);\n\
  ```\n\n这将按照定义的宽度和高度打开框架。你也可以用 `false` 调用它来停止显示框架。\n\n列表 17.1 包含了本节描述的源代码。在 `com.java24hours`\
  \ 包中名为 `SalutonFrame` 的 Java 文件中，输入这些语句。\n\n**列表 17.1 SalutonFrame.java 的全文**\n\n\
  点击此处查看代码图片\n\n```java\n1: package com.java24hours;\n2: \n3: import javax.swing.*;\n\
