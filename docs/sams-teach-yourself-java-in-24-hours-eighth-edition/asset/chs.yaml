  \ 方法，并将四个 `JFrame` 类变量之一作为参数：\n\n### 按钮\n\n你可以添加到容器的一个简单组件是 `JButton`。`JButton`\
  \ 与你处理的其他组件一样，是 `java.swing` 的一部分。`JButton` 对象是一个描述按钮作用的标签。这个标签可以是文本、图形或两者兼有。以下语句创建了一个名为\
  \ `okButton` 的 `JButton`：\n\n```java\nJButton okButton = new JButton(\"OK\");\n\
  ```\n\n创建组件后，应该通过调用其 `add()` 方法将其添加到容器：\n\n```java\nadd(okButton);\n```\n\n当你将组件添加到容器时，你不需要指定组件应该所在的位置。组件的排列由*布局管理器*（layout\
  \ manager）决定。这些管理器中最简单的是 `FlowLayout` 类，它是 `java.awt` 的一部分。要让容器使用特定的布局管理器，你必须先创建该布局管理器的对象。\n\
  \n```java\nFlowLayout flo = new FlowLayout();\n```\n\n创建布局管理器后，调用容器的 `setLayout`\
  \ 方法将指定的管理器与容器关联：\n\n```java\nsetLayout(flo);\n```\n\n此语句将 `flo` 对象指定为布局管理器。你创建的下一个应用程序（`com.java24hours`\
  \ 包中名为 `Playback` 的类）是一个带有三个按钮的的 Java 应用程序。将列表 17.2 中的文本输入新的 Java 文件并保存该文件。\n\n\
  **列表 17.2 Playback.java 的全文**\n\n点击此处查看代码图片\n\n```java\n1: package com.java24hours;\n\
  2: \n3: import javax.swing.*;\n4: import java.awt.*;\n5: \n6: public class Playback\
  \ extends JFrame {\n7:     public Playback() {\n8:         super(\"Playback\");\n\
  9:         setLookAndFeel();\n10:          setSize(450, 200);\n11:          setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  12:          setVisible(true);\n13:     }\n14: }\n```\n\n\n\n\n\n```java\nJButton\
  \ stop = new JButton(\"Stop\");\nJButton pause = new JButton(\"Pause\");\nadd(play);\n\
  add(stop);\nadd(pause);\nsetVisible(true);\n}\n\nprivate void setLookAndFeel() {\n\
  \    try {\n        UIManager.setLookAndFeel(\n            \"javax.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n        );\n    } catch (Exception exc) {\n        // ignore error\n    }\n}\n\
  \npublic static void main(String[] arguments) {\n    Playback frame = new Playback();\n\
  }\n```\n\n`Playback` 程序在第 12 行创建了一个 `FlowLayout` 布局管理器，并在第 13 行设置框架使用它。当在第 17–19\
  \ 行将三个按钮添加到框架中时，它们由该管理器进行排列。\n\n当你运行该应用程序时，你的输出结果应该类似于图 17.2。虽然你可以点击按钮，但不会发生任何响应，因为程序没有包含任何接收和响应用户输入的方法。这将在第\
