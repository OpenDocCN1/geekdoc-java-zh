    \n## 关于作者\n关于指南作者的信息。\n\n1. 标题页\n2. 封面\n3. 目录\n\n## 什么是 Sensei？\n\n[Sensei](https://scw.buzz/38n5uPu)\
    \ 是来自 [Secure Code Warrior](https://scw.buzz/2PBhLJp) 的免费 IntelliJ 插件，它可以帮助将高质量编码实践规范化为\
