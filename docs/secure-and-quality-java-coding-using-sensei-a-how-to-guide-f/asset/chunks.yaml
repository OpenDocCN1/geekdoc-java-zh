    \n# Introduction\n\n[Sensei](https://scw.buzz/38n5uPu) is a free IntelliJ plugin\
    \ from [Secure Code Warrior](https://scw.buzz/2PBhLJp) that helps you codify quality\
    \ coding practices as real-time warnings in your IDE, and create Quick Fix solutions\
    \ to educate you or rewrite your code.\n\n*   [securecodewarrior.com/sensei](https://scw.buzz/3qvDvDt)\n\
    \nThis document has example recipes and explanations to help you get started using\
    \ Sensei to write better quality code.\n\nNumerous staff from Secure Code Warrior\
    \ have been involved in the creation of this document:\n\n*   Charlie Eriksen\
    \ and Robin Claerhout created the Guice example\n\n*   Nathan Desmet created the\
    \ `System.out.println` to `Logger` example\n\n*   Additional help, recipes, code\
    \ and reviews were provided by: Matthieu Calie, Brysen Ackx, Downey Robersscheuten.\n\
    \nFor a quick overview of what Sensei can do, watch: [youtu.be/HPj1Lo97aTQ](https://youtu.be/HPj1Lo97aTQ)\n\
    \n[![](OEBPS/Image00001.jpg)](https://www.youtube.com/watch?v=HPj1Lo97aTQ)\n\n\
    ## What is Sensei?\n\nThe Sensei plugin provides an easy way to find specific\
    \ code patterns in your source code and apply rewrite rules to amend the matching\
    \ code - all within the Intellij IDE, and in real-time.\n\nFor example, you could\
    \ create a rule that matches on JUnit `@Disabled` annotations which do not have\
    \ a reason. Sensei would then tell you about the issue by highlighting the code\
    \ in the IDE.\n\nAdditionally, when you `alt+enter` , you can have the option\
    \ to `Add a todo comment parameter` .\n\nWhen selected, this will amend the code\
    \ to add a boilerplate reason, which you can then amend. If you don’t, it will\
    \ show up in your TODO panel.\n\ne.g. `@Disabled` would become `@Disabled(\"TODO:\
    \ add a description here\")`\n\nSensei combines the functionality of a Static\
    \ Analysis code scanner with a code rewriting engine.\n\n### IntelliJ Intention\
    \ Actions\n\nBased on the above description, the obvious alternative (if you were\
    \ not using Sensei) is to use the IntelliJ Intention Actions functionality.\n\n\
    Sensei differs from IntelliJ Intention Actions because the aim with Sensei is\
    \ to provide a way to create matchers and rewriters which are project specific,\
    \ or even local to an individual developer.\n\nWe have tried to put together a\
    \ GUI that makes both the matching and rewrite rules easy to write and experiment\
    \ with.\n\n### How can it help me personally improve?\n\nWhen I’m learning a new\
    \ library, it takes me time to build up muscle memory around the methods and formatting.\
    \ So I might choose to create personal recipes which\n\n*   link off to the official\
    \ documentation or tutorial pages\n\n*   have boilerplate templates which are\
    \ most effective\n\n*   fix poor coding practices\n\n*   add boilerplate code\
    \ to help use a library\n\nI can use Sensei to build temporary recipes which prompt\
    \ me for the current practices I’ve chosen to use and help me build up effective\
    \ habits. The recipes are temporary because I can remove them when I outgrow them.\n\
    \n### How can it help my team improve?\n\nIn the same way, we can help teams build\
    \ up muscle memory around agreed coding standards.\n\nCreating cookbooks of recipes\
    \ that we apply when we find the same comments in pull request reviews. Since\
    \ the cookbooks are stored in version control with the project, they are available\
    \ to everyone on the project and we can switch them off when we no longer need\
    \ prompting.\n\n### Sensei helps provide feedback early\n\nWe’ve tried to build\
    \ a way of pulling the feedback that helps us improve and provide reminders of\
    \ corrective action as early on in the coding process as we can with Sensei.\n\
    \nRather than wait for:\n\n*   the results of a static analyser\n\n*   the comments\
    \ from a code review\n\nWe can instead see the feedback for custom standards we\
    \ want to enforce as we code.\n\nWe provide either reminders, or actual rewrite\
    \ rules, to help us write code that complies with the standards.\n\n### Sensei\
    \ is flexible\n\nSensei is a mix of:\n\n*   part Static Analyser\n\n*   part coding\
    \ tutor\n\n*   part rewrite engine\n\nSensei is so flexible that it makes it hard\
    \ to answer the question: “What is Sensei?”\n\n### Sensei fills a gap in the programming\
    \ workflow\n\nWe’ve tried to make Sensei the missing piece of the programmer workflow\
    \ that helps you improve specific elements in your coding style, or library use,\
    \ that you and your team are currently working with.\n\nThis flexibility means\
    \ that it takes a little more time to get to grips with Sensei than a static analysis\
    \ tool or the built-in IntelliJ Intensions. By spending the time to experiment,\
    \ you will gain a new way of speeding up your learning in your personal development\
    \ process.\n\n### How to experiment?"
