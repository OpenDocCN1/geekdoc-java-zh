  trans: "\n还有其他设置，但这些用于更高级用法，将在文档中介绍。\n\n- 文档 - [sensei-docs-beta.securecodewarrior.com](https://scw.buzz/3emSI7l)\n\
    \n![](img/Image00022.jpg)\n\n## 配方设置 - 搜索\n\n“配方设置”（Recipe Settings）包含了搜索配置。\n\
    \n这是我们在代码执行的搜索，用于匹配编码模式。\n\n在这个示例中，我正在搜索方法上的任何 Junit 5 测试注解。\n\n你可以看到代码中的注解已经在代码本身中被高亮了。\n\
    \n![](img/Image00023.jpg)\n\n如果我更改了注解类型，代码将无法匹配，因此我们可以直观地看到我们的搜索对于正在处理的代码是否有效。\n\
    \n![](img/Image00024.jpg)\n\n## 快速修复设置\n\n快速修复设置（QuickFix Settings）是在我使用 `alt+enter`\
    \ 修复问题时在 IntelliJ 中显示的快速修复方案。\n\n你在屏幕底部看到一个差异视图（diff view），显示了应用快速修复的结果。\n\n截图显示的配方向类中添加了一个\
    \ `Logger`，差异视图显示了代码修改前后的状态。\n\n![](img/Image00025.jpg)\n\n## 创建配方\n\n在代码中，通常位于你想要开始搜索的地方。\n\
    \n按下 `alt+enter` 会显示创建配方的上下文菜单。\n\n![](img/Image00026.jpg)\n\n我们经常从一个空配方“从零开始”。\n\
    \n![](img/Image00027.jpg)\n\n## 在 IDE 中发现问题\n\n### 在代码中\n\n当配方被激活后，它们将在代码中被标记。\n\
    \n以下代码显示了一些“错误”和一些“警告”。\n\n![](img/Image00028.jpg)\n\n我现在现在保存它，然后我们就可以在 IDE 中使用它。\n\
    \n### 问题图标\n\n问题也会通过右上角的 Sensei 问题图标显示。\n\n![](img/Image00029.jpg)\n\n我可以在这里右键点击，通过“问题”（Problems）选项卡修复问题。\n\
    \n![](img/Image00030.jpg)\n\n## 触发快速修复\n\n有许多方法可以触发快速修复（QuickFix）。\n\n### 使用问题选项卡\n\
    \n在“问题”选项卡中。\n\n右键点击报告的问题并选择“显示快速修复”（Show Quick Fixes）。\n\n![](img/Image00031.jpg)\n\
    \n然后从列表中选择快速修复。\n\n![](img/Image00032.jpg)\n\n### 上下文 `alt+enter`\n\n修复代码最常用的方法是使用\
    \ `alt+enter`，我们将看到任何 IntelliJ 建议和 Sensei 快速修复。\n\n![](img/Image00033.jpg)\n\n\
    如果我选择该操作，代码就会被修改。\n\n### 修复多个操作\n\n如果文件中有多个出现之处，我可以一次性修复它们。\n\n按下 `alt+enter`\
    \ 并导航到快速修复菜单的下一层级，我们找到了了修复当前源文件中所有问题的选项。\n\n![](img/Image00034.jpg)\n\n# 章节 -\
    \ 用用例\n\nSensei 可以帮助提高高质量代码的编写，无论底层的领域或技术如何。\n\n本节按技术分类分为若干子章节，以演示：\n\n- Sensei\
    \ 的某些功能。\n- 这些功能如何应用。\n\n技术示例已尽可能减小，以说明与技术的交互，但仍保持了较短的学习曲线。这样，即使你不了解该技术，也应该能够跟上。\n\
    \n这里的描述在 Github 仓库中提供了完整的代码示例：\n\n- [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
    \n要查看的具体代码链接或描述将包含在用例描述中。\n\n# POJO 用例\n\n这些用例使用了原始的 Java。\n\n不需要外部依赖，因此它们是 Sensei\
    \ 基础功能的良好介绍。\n\n## 将 `System.out.println` 转换为日志\n\n在编写以下代码时，我犯了一些错误：\n\n```\n\
    \ private String getCountdownString() {\n\n        String output =\n```\n"
- fmt: "\nNote that I changed `SysOutTest` to be a mustache variable so that it picks\
    \ up the name of any class I use this recipe in. And again, I didn’t remember\
    \ the mustache syntax, I used the GUI `show variables` to find the replacement\
    \ I needed.\n\nAnd by fully qualifying the `Logger` to `java.util.logging.Logger`,\
    \ Sensei will add the import and write the line of code that I want i.e\n\n```\n\
    \ Logger logger = Logger.getLogger(SysOutTest.class.getName());\n```\n\n![](![](OEBPS/Image00040.jpg)\n\
    \nOne useful thing about this recipe is that because it will only add the logger\
    \ field once, I can use this on any existing code where I have used `System.out.println`\
    \ and use Sensei to change all the occurrences in my code.\n\n![](OEBPS/Image00041.jpg)\n\
    \n## Next Steps\n\nOnce I get used to this, I’ll eventually train myself away\
    \ from using `System.out.println`.\n\nAnd I can use Sensei to help me proactively\
    \ write code by creating a second recipe which helps me create a logger.\n\ne.g.\
    \ I can match on a class, where there is no field called `logger`, and add one.\n\
    \nI created a recipe of level `Information`\n\n```\n Name: Logger: add logger\n\
    Description: Add logger to class\nLevel: Information\n```\n\nTo match on a class\
    \ without a logger field:\n\n```\n search:\n  class:\n    without:\n      child:\n\
    \        field:\n          name: \"logger\"\n```\n\nAnd then I will reuse part\
    \ of the QuickFix we saw earlier\n\n```\n availableFixes:\n  - name: \"Add Logger\"\
    \n    actions:\n      - addField:\n          field: \"java.util.logging.Logger\
    \ logger = Logger.getLogger({{{ containingClass.name\\\n        \\ }}}.class.getName())\"\
    \n          target: \"self\"\n```\n\nNote the difference in `target` here compared\
    \ to the first QuickFix. This uses `self` because our Search matched the class.\
    \ The first QuickFix uses `parentClass` because we matched code within the class\
    \ itself.*\n\n## Summary\n\nThis represents one of the key flows associated with\
    \ using Sensei to help improve your personal programming skillset:\n\n* Create\
    \ a recipe to help with your immediate ‘best practice’.\n* Once you know how to\
    \ use that best practice… create a recipe to make your workflow faster.\n\n##\
    \ Code Links\n\nIn the Github repo:\n\n* https://github.com/SecureCodeWarrior/sensei-blog-examples\n\
    * module: `pojoexamples`\n\n* `src\\test\\java\\logging`\n\n`AddLoggerTest.java`\
    \ has some instructions for applying the recipe.\n\n`SysOutTest.java` is an example\
    \ of a class that you can experiment with.\n\n## See Sensei In Action\n\n[![](OEBPS/Image00042.jpg)](https://www.youtube.com/watch?v=qPlNm0yaSto)\n\
    \n[youtu.be/qPlNm0yaSto](https://youtu.be/qPlNm0yaSto)\n\n# Junit 5 Use-Cases\n\
    \n[JUnit 5](https://junit.org/junit5/) is a popular Unit Testing Framework for\
    \ Java.\n\nThe use-cases which follow, all use JUnit 5 as their implementation,\
    \ but the basic concepts can be applied to JUnit 4, or other unit testing frameworks,\
    \ with minor amendments to the recipes.\n\n## Adding Annotations and Method Renaming\n\
    \n*Improving A Personal Programming Process Using Sensei*\n\nFor this section,\
    \ I’ve recreated a ‘bad’ coding approach that I used when I was learning JUnit,\
    \ and will demonstrate how to convert the ‘bad’ pattern to an agreed, and “better”,\
    \ coding pattern using Sensei.\n\nWhen I was learning JUnit, I could only keep\
    \ so much in my head at any one time. I constantly forgot how to skip tests when\
    \ they were not working.\n\nIf we are working in a Team then we can use code reviews\
    \ on pull requests to help enforce coding styles. And we can shorten the feedback\
    \ cycle when pair programming with a more experienced programmer.\n\nWe can also\
    \ augment our process with tooling and have the tools prompt us to do the right\
    \ thing. Thoughtworks describe this as “tools over rules,” in their [Technology\
    \ Radar listing for Sensei](https://www.thoughtworks.com/radar/tools/sensei) :\n\
    \n> “make it easy to do the right thing over applying checklist-like governance\
    \ rules and procedures”\n\n### Disabling a JUnit Test\n\nIdeally, I would, as\
    \ we all know, use the `@Disabled` annotation and write:\n\n```\n @Disabled\n\
    \    @Test\n    void canWeAddTwoNumbers(){\n        Assertions.fail(\"this test\
    \ was skipped and should not run\");\n    }\n```\n\nBut, when learning, I had\
    \ to train myself to use `@Disabled`.\n\nWhen I forgot how to disable a Test method\
    \ I would remove the `@Test` annotation and rename the test:\n\n```\n class SkipThisTest\
    \ {\n\n    void SKIPTHIScanWeAddTwoNumbers(){\n        Assertions.fail(\"this\
    \ test was skipped and should not run\");\n    }   \n}\n```\n\nIt wasn’t good,\
    \ but it got the job done. I didn’t have something like Sensei to help me remember\
    \ and so I fell into using poor coding patterns.\n\nThe tasks I’ve taken on board\
    \ for this readme are to:\n\n* Create a rule which finds methods that have been\
    \ ‘skipped’ or ‘disabled’ by renaming the method.\n* Create a QuickFix to rename\
    \ the method and add both an `@Test` and `@Disabled` annotation.\n\n### Recipe\
    \ Settings\n\nThe first step I take with Sensei is to “open settings”.\n\n```\n\
    \ Name: open Sensei\n```\n\nTo match a method, I use the following in the recipe:\n\
    ```\n search:\n  method:\n    name:\n      matches: \".*.*\"\n```\n\n![](OEBPS/Image00043.jpg)\n\
    \n### QuickFix Settings\n\nThe QuickFix is a little more complicated because it\
    \ will rewrite the code, and I’ll use `sed`.\n\nI want to:\n\n* Add a `@Test`\
    \ annotation to the method.\n* Add a `@Disabled` annotation to the method.\n*\
    \ Amend the method name.\n\nAdding the annotations is simple enough using `addAnnotation`.\
    \ If I use fully qualified name for the annotation then Sensei will automatically\
    \ add imports.\n\n```\n availableFixes:\n  - name: \"Add @Disabled and @Test\"\
    \n    actions:\n      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Test\"\
    \n      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Disabled\"\
    \n```\n\n![](OEBPS/Image00044.jpg)\n\nThe `sed` implementation requires that when\
    \ the arguments contain commas, that they are wrapped with `{{#encodeString}}`\
    \ and `{{/encodeString}}` - e.g. `{{#encodeString}}{{{.}}}{{{/encodeString}}`.\n\
    \n### Reverse Recipe\n\nSince this is an example, and we might want to use this\
    \ in demos, I wanted to explore how to reverse out the above change using a Sensei\
    \ recipe.\n\nThinking it through I want to find a method annotated with `@Disabled`\
    \ only in the class `SkipThisTest` where I do the demo:\n\n```\n Name: JUnit:\
    \ demo in SkipThisTest remove @Disabled and revert to SKIPTHIS\nShort Description:\
    \ remove @Disabled and revert to SKIPTHIS for demo purposes in the project\nLevel:\
    \ warning\n```\n\nThe Recipe Settings Search is very simple, matching the annotation\
    \ in a specific class.\n\n```\n search:\n  method:\n    annotation:\n      type:\
    \ \"Disabled\"\n    in:\n      class:\n        name: \"SkipThisTest\"\n```\n\n\
    For the Quick fix, since we have matched the method, I use the rewrite action\
    \ and populate the template using the variables.\n"
