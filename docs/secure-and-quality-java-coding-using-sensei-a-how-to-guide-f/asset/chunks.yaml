  trans: "\n\n配方中的 QuickFix 会修改被注入的类，但并不是唯一需要修改的代码。\n\n```\n availableFixes:\n- name:\
    \ \"Change class to public. Remember to also request injection on this class\"\
    \n  actions:\n  - changeModifiers:\n      visibility: \"public\"\n      target:\
    \ \"parentClass\"\n```\n\n当配方被触发时，我仍然需要在代码中执行一个手动步骤，即添加包含 `requestStaticInjection`\
    \ 的行，以完全实例化该对象。\n\n```\n public class SystemOutModule extends AbstractModule {\n\
    \n    @Override\n    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
    \        // 通过依赖注入实例化\n        binder().requestStaticInjection(CountReporter.class);\n\
    \    }\n}\n```\n\n我完全可以再写另一个配方来捕获这一点。但除非忘记添加静态注入成了我在编码时经常的半常规错误，否则我可能不会这样做。\n\n\
    ## 总结\n\n如果我们发现自己在常见的根节点模式上犯了错误，那么 Sensei 可以帮助我们将检测和修复该问题的知识代码化。这样，希望它就不会再逃过代码审查并进入生产环境。\n\
    \n有时我们编写的配方识别的是启发式模式，也就是说匹配这些模式并不保证存在问题，但很有可能存在问题。\n\n我们编写的配方和 Quick Fix 不需要完全完备，但它们需要足够好，帮助我们识别并修复问题，而不会过于复杂。当它们变得过于复杂时，它们会变得难以理解和难以维护。\n\
    \n## 下一步骤\n\n- 安装 Sensei\n- 学习一些示例\n- 阅读文档\n- 实验\n\n## 安装 Sensei\n\n如果你还没有安装，请安装\
    \ Sensei。你可以从 JetBrains 市场进行安装，既可以在 IDE 内部进行，也可以通过 `jetbrains.marketplace.com`\
    \ 完成。\n\n要在 IDE 内部安装，请使用“Preferences -> Plugins”（Mac）或“Settings -> Plugins”（Windows）并搜索“sensei\
    \ secure code”，然后点击安装。\n\n- [市场平台上的 Sensei 插件](https://scw.buzz/38n5uPu)\n- [plugins.jetbrains.com/plugin/14015-sensei-by-secure-code-warrior-](https://scw.buzz/38n5uPu)\n\
    \n有关安装 IntelliJ 插件的帮助，请考虑阅读 JetBrains 支持文档：\n\n- [jetbrains.com/help/idea/managing-plugins.html](https://www.jetbrains.com/help/idea/managing-plugins.html)\n\
    \n## 学习一些示例\n\n在文中前面我们提到了两个主要的 Github 仓库。\n\n[Sensei 博客示例](https://scw.buzz/3cixLrq)\
    \ 包含了示例代码、适用于代码的配方以及解释用例的 `readme.md` 文件。\n\n[公共菜谱 (Public Cookbooks)](https://scw.buzz/30pk1FN)\
    \ 索引列出了公开的菜谱，包含示例配方和文档。\n\n- [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
    - [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\n\
    这两个仓库都包含了许多供学习的配方，以理解 Sensei 的工作原理。\n\n## 阅读文档\n\n[官方文档](https://scw.buzz/3emSI7l)\
    \ 包含了所有 Sensei 功能和函数的参考指南。此外，它还包含了一份入门上手引导教程，帮助你从零开始创建自己的配方。\n\n- [`sensei-docs-beta.securecodewarrior.com/`](https://scw.buzz/3emSI7l)\n\
    \n## 实验\n\n当你创建帮助改进自身流程或将团队知识代码化的配方时，Sensei 产生的价值最大。\n\n你可能想要尝试的几件事：\n\n- 复制一些静态分析工具警告你的某些规则，但为你应用过的最常用的代码更改创建一个\
    \ QuickFix。\n- 创建一些辅助代码，为你经常使用的某些库生成样板代码。\n- 对你在编码时会犯的错误类型做笔记。创建一个带有修复方案的配方，帮助你下次避免此类问题。\n\
    \n## 总结\n\n[公共菜谱](https://scw.buzz/30pk1FN) 索引列出了你可以立即使用的配方。然而，Sensei 的最大价值在于你创建配方，帮助你根据自己所用技术的标准编写出更高质量的代码。\n\
    \n在 Sensei 中将你的知识代码化，并与你的团队或世界分享，通过向[公共菜谱](https://scw.buzz/30pk1FN)索引贡献你的菜谱。\n\
