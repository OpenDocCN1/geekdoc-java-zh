  trans: "\n\n但网站上的官方文档通常更容易读，并且包含更多示例。\n\n当团队开始学习一个库时，拥有一套推荐的教程会非常有用。\n\nSensei 有一个\
    \ `goto` 操作，可以打开 URL，允许我们链接到外部站点以及我们团队认为有用的文档和示例。\n\n## 实现 `goto` URL\n\n为了实现这一点，我将创建一个匹配\
    \ Junit `@Test` 注解的搜索。\n\n```\n search:\n  annotation:\n    owner:\n      method:\
    \ {}\n    type: \"org.junit.jupiter.api.Test\"\n```\n\n然后，我将为我发现的每个有用 URL 添加 `goto`\
    \ 操作。\n\n例如：\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\n\
    \n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\n\
    \n下面的示例将创建一个单一的操作 `JUnit Annotations (learn)`，它将在浏览器中同时打开这两个两个 URL。\n\n```\n availableFixes:\n\
    - name: \"Learn about JUnit Annotations\"\n  actions:\n  - goto:\n      type:\
    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\n当我在 IntelliJ 中通过 `alt+Enter` 激活它时，我看到了上下文菜单，可以选择它跳转到文档。\n\n![](img/Image00054.jpg)\n\
    \n## 多操作\n\n我可能会选择多个操作，以便每个 URL 或教程在 `alt+enter` QuickFix 弹出菜单中都有自己的选项。\n\n例如，对于\
    \ `@Parameterized` 注解，我可能想链接到官方文档和一组在线示例代码。\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests\n\
    \n* https://github.com/eviltester/junitexamples/blob/master/src/test/java/parameterized/junit5/InitialExampleTest.java\n\
    \n我只需简单的创建一个搜索该注解的配方（recipe）：\n\n```\n search:\n  annotation:\n    owner:\n  \
    \    method: {}\n    type: \"org.junit.jupiter.params.ParameterizedTest\"\n```\n\
    \n并链接到我认为有用的站点：\n\n```\n availableFixes:\n- name: \"JUnit Annotations (learn)\"\
    \n  actions:\n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n- name: \"What is a JUnit Test? (learn)\"\n  actions:\n  - goto:\n      type:\
    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\n这两个链接将出现在弹出对话框中。\n\n![](img/Image00055.jpg)\n\n## 谁会受益？\n\n在使用和学习库时，我会发现这有用，特别是在领导团队并帮助他们采用新库时。\n\
    \n这也能让创建库的团队受益，通过创建一套标准的文档配方，引导人们采用该库或库中的新功能。\n\n如果代码维护和文档维护是由不同的团队执行的，这将会特别有用。\n\
    \n# Guice 用例\n\n每引入一项新技术都会给项目增加风险。依赖注入（Dependency Injection）可以在编码时节省时间，并在配置方面增加额外的灵活性，但始终存在我们忘记连接某些组件或注入错误对象的风险。\n\
    \n本节的用例探索了 Sensei 如何提供帮助。\n\n## 如何使用 Sensei 捕捉并修复依赖注入问题\n\nSensei 项目本身拥有随时间积累的配方，这是\
    \ Sensei 团队构建配方覆盖的场景示例示例：Guice 的配置错误导致在测试期间运行时报告了 `NullPointerException`。\n\n\
    这可以推广到许多依赖注入场景，在这些场景中，代码语法上是正确的，但因为连接配置错误，导致错误漏掉。\n\n这通常在我们学习某项技术时发生，我们不断犯下忘记连接的简单错误。但也会发生在经验丰富的人士身上，因为……我们都都会犯错，而且我们可能没有单元测试来覆盖一切。\n\
    \n### 错误的依赖注入连接导致的运行时异常\n\n下面的代码在运行时因 `NullPointerException` 失败。\n\n```\n Injector\
    \ injector = Guice.createInjector(new SystemOutModule());\nCountReporter reporter\
    \ = injector.getInstance(CountReporter.class);\n\nString [] lines5 = {\"1: line\"\
    , \"2: line\", \"3: line\", \"4: line\", \"5: line\"};\n\nreporter.reportThisMany(Arrays.asList(lines5));\n\
    Assertions.assertEquals(5, reporter.getCount());\n```\n\n代码语法上是正确的，但失败是因为我们在 `SystemOutModule`\
    \ 配置中漏掉了 `requestStaticInjection`。\n\n```\n public class SystemOutModule extends\
    \ AbstractModule {\n\n    @Override\n    protected void configure() {\n      \
    \  binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n    }\n}\n\
    ```\n\n当我们尝试使用 `reporter` 时，我看到了上下文菜单。\n\n### 警告信号\n\n代码语法上是正确的，但失败是因为我们在 `SystemOutModule`\
    \ 配置中漏掉了 `requestStaticInjection`。\n\n当我们尝试使用 `reporter` 时，我看到了上下文菜单。\n\n### Sensei\
    \ 能如何提供帮助？\n\n我们可能不会使用 Sensei 来发现 `requestStaticInjection`，因为我们所有的 Guice 配置连接都需要像这个用例一样简单。\n\
    \n"
- fmt: "\nThe QuickFix in the recipe will amend the injected class, but that is not\
    \ the only code I have to change.\n\n```\n availableFixes:\n- name: \"Change class\
    \ to public. Remember to also request injection on this class\"\n  actions:\n\
    \  - changeModifiers:\n      visibility: \"public\"\n      target: \"parentClass\"\
    \n```\n\nWhen the recipe is triggered I still have a manual step to perform in\
    \ my code, adding the line containing `requestStaticInjection` to fully instantiate\
    \ the object.\n\n```\n public class SystemOutModule extends AbstractModule {\n\
    \n    @Override\n    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
    \        // instantiate via dependency injection\n        binder().requestStaticInjection(CountReporter.class);\n\
    \    }\n}\n```\n\nI could potentially write another recipe to pick this up. I\
    \ probably wouldn’t do that unless forgetting to add the static injection became\
    \ a semi-regular error that I made when coding.\n\n## Summary\n\nIf we ever find\
    \ ourselves making a mistake with a common root pattern, then Sensei can help\
    \ codify the knowledge around detecting and fixing the issue. It will then, hopefully,\
    \ not slip through code reviews and into production.\n\nSometimes the recipes\
    \ we write identify heuristic patterns i.e. matching them doesn’t guarantee that\
    \ there is a problem, but is likely that there is a problem.\n\nThe recipes and\
    \ Quick Fixes that we write,don’t have to be fully comprehensive, but they need\
    \ to be good enough that they help us identify and fix problems without being\
    \ overly complicated. When they become overly complicated, they become harder\
    \ to understand and harder to maintain.\n\n## Next Steps\n\n- Install Sensei\n\
    - Study Some Examples\n- Read the Documentation\n- Experiment\n\n## Install Sensei\n\
    \nIf you haven’t already then, install Sensei. You can do this from the Jetbrains\
    \ marketplace, either from in the IDE, or at `jetbrains.marketplace.com`\n\nTo\
    \ install within the IDE, use “Preferences Plugins” (Mac) “Settings Plugins” (Windows)\
    \ and search for “sensei secure code”, then Install.\n\n- [Sensei plugin on marketplace](https://scw.buzz/38n5uPu)\n\
    - [plugins.jetbrains.com/plugin/14015-sensei-by-secure-code-warrior-](https://scw.buzz/38n5uPu)\n\
    \nFor support in installing IntelliJ plugins, consider reading the Jetbrains support\
    \ documentation:\n\n- [jetbrains.com/help/idea/managing-plugins.html](https://www.jetbrains.com/help/idea/managing-plugins.html)\n\
    \n## Study Some Examples\n\nEarlier in the text, we mentioned two main Github\
    \ Repositories.\n\nThe [Sensei Blog Examples](https://scw.buzz/3cixLrq) contains\
    \ sample code, recipes that apply to that code, and `readme.md` files explaining\
    \ the use-case.\n\nThe [Public Cookbooks](https://scw.buzz/30pk1FN) index lists\
    \ publicly accessible cookbooks with sample recipes and documentation.\n\n- [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
    - [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\n\
    Both of these repositories contain a lot of recipes to study to understand how\
    \ Sensei works.\n\n## Read the Documentation\n\nThe [Official Documentation](https://scw.buzz/3emSI7l)\
    \ includes a reference guide to all the Sensei features and functions. Additionally,\
    \ it contains a walkthrough getting started tutorial to help you create your own\
    \ recipe from scratch.\n\n- [https://sensei-docs-beta.securecodewarrior.com/](https://scw.buzz/3emSI7l)\n\
    \n## Experiment\n\nSensei adds the most value when you create recipes that help\
    \ you improve your own process or codify knowledge from your team.\n\nA few things\
    \ you might want to try:\n\n- Replicate some of the rules that Static Analysis\
    \ tools warn you about, but create a QuickFix for the most used code changes you\
    \ apply.\n- Create some helper code to generate boilerplate code for some of the\
    \ libraries that you often use.\n- Make notes about the type of errors you make\
    \ as you code. Create a recipe with a fix to help you avoid the problem next time.\n\
    \n## Summary\n\nThe [Public Cookbooks](https://scw.buzz/30pk1FN) index lists recipes\
    \ that you can immediately use. The maximum value from Sensei comes, however,\
    \ when you create recipes that help you write better quality code to your own\
    \ standards for the technology you work with.\n\nCodify your knowledge in Sensei\
    \ and share it with your team, or with the world, by contributing your cookbooks\
    \ to the [Public Cookbooks](https://scw.buzz/30pk1FN) index.\n\nBe sure to visit\
    \ us to find out what else is new in Sensei at:\n\n- [securecodewarrior.com/sensei](https://scw.buzz/2qvDvDt)\n\
    \n# About Secure Code Warrior\n\nSecure Code Warrior is a global security company\
    \ that makes software development better and more secure. Our vision is to empower\
    \ developers to be the first line of defense in their organization by making security\
    \ highly visible and providing them with the skills and tools to write secure\
    \ code from the beginning. Our powerful platform moves the focus from reaction\
    \ to prevention, training and equipping developers to think and act with a security\
    \ mindset as they build and verify their skills, gain real-time advice and monitor\
    \ skill development. Our customers include financial institutions, telecommunications\
    \ providers and global technology companies in Europe, North America and Asia\
    \ Pacific.\n\n[SecureCodeWarrior.com](https://scw.buzz/2PBhLJp)\n\n# About the\
    \ Author\n\nAlan Richardson is Head of Developer Relations at Secure Code Warrior.\
    \ Alan has over twenty years of professional software development experience and\
    \ author of the books “Automating and Testing a REST API”, and “Java For Testers”.\n\
    \nFor more information about Alan visit [EvilTester.com](https://eviltester.com)\n"
