    \ happen to be working on.\n\nThe location would be set to the directory path.\n\
    \n### Store Recipes in Github\n\nSensei can also access recipes that are stored\
    \ in a Github repo. Both private and public repositories are supported.\n\n####\
    \ Github over SSH\n\nSSH Repository access is configured using the following syntax\
    \ for the `Location`\n\n`git@github.com:SecureCodeWarrior/acookbook.git`\n\nFor\
    \ this to work, the repository would contain the contents of a cookbook folder.\n\
    \ne.g. our Basic Protection Cookbook takes this approach and could be added as\
    \ a “Locally configured Cookbook” using the location\n\n`git@github.com:SecureCodeWarrior/cookbook-basic-protection-set.git`\n\
    \nIt is also possible to configure the branch and the subfolder for the cookbook\
    \ e.g. in the `master` branch in the `cookbook` subfolder\n\ne.g.\n\n`git@github.com:SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \nAn SSH key needs to be configured for private repositories.\n\n*   https://github.com/settings/keys\n\
    \nAnd the key should not have a passphrase.\n\n#### Github over HTTPS\n\nIt is\
    \ also possible to access public repositories over HTTPS, and the same `repo.git|branch|folder`\
    \ syntax is used e.g.\n\n`https://github.com/SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \n#### Zipped over HTTP(s)\n\nSensei can also access cookbooks that are zipped,\
    \ over HTTP or HTTPS.\n\ne.g.\n\n`http://localhost:8000/rules.sensei.zip`\n\n\
    The zip cookbook file should contain the contents of a cookbook folder e.g the\
    \ `rules.sensei` file.\n\n### Sharing Summary\n\nSensei supports using multiple\
    \ cookbooks so that an individual programmer can have recipes that support their\
    \ own learning and productivity.\n\nMore importantly, we know that teams work\
    \ most effectively when knowledge is shared. Having shared team repositories,\
    \ e.g. for a specific project, or a specific library, or for a shared set of migration\
    \ patterns, can help boost team productivity and codify the team’s experience.\n\
    \nWhen a cookbook is shared, multiple teams can use the same cookbook which can\
    \ also improve inter-team collaboration from different disciplines e.g. AppSec\
    \ to development.\n\nWith four core sharing mechanisms available, Sensei hopefully\
    \ has at least one approach you can use to increase collaboration on knowledge\
    \ sharing.\n\n## Running IntelliJ Inspections From Continuous Integration\n\n\
    IntelliJ IDEA offers functionality to help improve our coding, within the IDE\
    \ when writing code as Intentions. Intentions can be used in batch to inspect\
    \ code for patterns throughout the source and even extending to Command-Line analysis\
    \ or added to Continuous Integration. This section covers the out-of-the-box IntelliJ\
    \ functionality and expanding with custom Intentions created in Sensei.\n\n###\
    \ IntelliJ Inspections\n\nThe Inspections feature of IntelliJ drives the display\
    \ of many of the errors that are reported dynamically in the IDE when coding e.g.\n\
    \n*   Detecting abstract classes that can be converted to interfaces.\n\n*   Identifying\
    \ redundant class fields which can be local.\n\n*   Warning about uses of deprecated\
    \ methods.\n\n*   etc.\n\nThese Inspections highlight code that matches in the\
    \ IDE as Intention Actions which often have an associated QuickFix.\n\n![](OEBPS/Image00008.jpg)\n\
    \nThe real-time IDE highlighting when code matches an Inspection can help us improve\
    \ our coding dynamically. After identifying the issue in the code, using IntelliJ\
    \ Intention Actions to QuickFix the code can reinforce better patterns.\n\n###\
    \ Inspections Profile\n\nInspections can run as a batch from within the IDE and\
    \ from the Command Line or in a Continuous Integration process.\n\nThe key to\
    \ working with IntelliJ inspections in a batch is through the use of an Inspections\
    \ Profile.\n\nIntelliJ has two default Inspection Profiles: one stored in the\
    \ Project, and one stored in the IDE.\n\nNew Inspection Profiles can be created\
    \ to configure specific plugins or use-cases e.g.\n\n*   Run Checkstyle real-time\
    \ scan only\n\n*   Run a specific set of Sensei rules\n\n*   Run the HTML checks\n\
    \nThe Inspections in a profile can be enabled or disabled from the IntelliJ Preferences.\
    \ The Preferences dialog is also an easy way to learn the range of Inspections\
    \ available.\n\n![](OEBPS/Image00009.jpg)\n\nThe ‘tool’ icon allows you to duplicate\
    \ a Profile and create a new Profile to collect a specific set of rules.\n\n![](OEBPS/Image00010.jpg)\n\
    \n### Running an Inspection Profile in the IDE\n\nInspection Profiles can be run\
    \ from within the IDE using the `Analyze \\ Inspect Code...` menu.\n\n![](OEBPS/Image00011.jpg)"
