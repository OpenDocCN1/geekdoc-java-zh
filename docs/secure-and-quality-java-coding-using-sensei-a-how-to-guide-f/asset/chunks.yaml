    \ Analysis tools is searching source code to identify specific coding patterns\
    \ that have some sort of warning or information associated with them.\n\nThis\
    \ could be as simple as “JUnit 5 test classes do not need to be ‘public’” or something\
    \ complex to identify like “Untrusted String input being used in an SQL execution\
    \ statement”.\n\nStatic Analysis tools vary in how they implement this functionality.\n\
    \n*   Source code parsing technology to create an Abstract Syntax Tree (AST),\n\
    \n*   Text Regular Expression matching,\n\n*   A combination of the above.\n\n\
    Regular Expression matching on text is very flexible and easy to write rules to\
    \ match, but can often lead to a lot of false positives and the matching rules\
    \ are ignorant of the surrounding code context.\n\nAST matching treats the source\
    \ code as program code and not just files filled with text. This allows for more\
    \ specific, contextual matching and can reduce the number of false positives reported\
    \ against the code.\n\n### Static Analysis in Continuous Integration\n\nStatic\
    \ Analysis is often performed during the Continuous Integration (CI) process to\
    \ generate a report of compliance issues which can be reviewed to receive an objective\
    \ view of the code-base over time.\n\nSome people use Static Analysis as an objective\
    \ measure of their code quality by configuring the static analysis tool to only\
    \ measure specific parts of the code, and only report on a subset of rules.\n\n\
    The objectivity is provided by the rules used since these do not vary in their\
    \ evaluation of code over time. Clearly, the combination of rules used and their\
    \ configuration is a subjective decision and different teams choose to use different\
    \ rules at different times.\n\nHaving the Static Analysis performed in CI is useful\
    \ but might delay the feedback to the programmer. Programmers don’t receive feedback\
    \ when coding, they receive feedback later when the code is run through the Static\
    \ Analysis tool. Another side-effect of running the Static Analysis in CI is that\
    \ the results are easier to ignore.\n\nTo help make teams pay more attention to\
    \ the results from Static Analysis it is usually possible to configure a threshold\
    \ metric in the build process to fail the build if the metric is exceeded e.g. a\
    \ number of rules triggered.\n\n### Static Analysis in the IDE\n\nTo receive feedback\
    \ faster, there are many IDE plugins that run the Static Analysis rules in the\
    \ IDE on demand, or periodically as the code changes.\n\nThe rule violations can\
    \ then be seen in the IDE as the programmer is writing code, and to make the rules\
    \ harder to ignore, the violations can often be configured to render as underlined\
    \ code in the editor.\n\nI personally find this a useful way to improve my coding,\
    \ particularly when working with a new library that is covered by the Static Analysis\
    \ tool. Although it can be ‘noisy’ with false positives, or rules you are not\
    \ interested in. But this is solved by taking the extra step to configure the\
    \ Static Analysis tool to ignore certain rules.\n\n### Fixing Code Based on Static\
    \ Analysis Rules\n\nWith most Static Analysis tools, the fixing of the rule is\
    \ left to the programmer, so they have to understand the cause of the rule violation\
    \ and how to fix it.\n\nVery few static analysis tools also include the ability\
    \ to fix the violations because the fix is so often contextual to the team and\
    \ the technology used and their agreed coding styles.\n\n### Default Rules\n\n\
    False confidence in the quality of the rules may arise when the Static Analysis\
    \ tools come with default rules. It is tempting to believe that they cover all\
    \ the issues that a programmer might encounter and all the circumstances that\
    \ rule should apply. Sometimes the circumstances in which a rule should apply\
    \ can be subtle and may not be easy to detect.\n\nThe hope is that by using a\
    \ Static Analysis tool and researching the rules and violations in more detail,\
    \ programmers will develop the skill to detect and avoid the issue in the context\
    \ of their specific domain.\n\nWhen the domain requires contextual rules, the\
    \ Static Analysis tools may not have any rules that match your domain or library.\
    \ Additionally, the tools can often be difficult to configure and expand.\n\n\
    ### Annoyances\n\nNone of these ‘annoyances’ are insurmountable. These include:\n\
    \n*   False positives\n\n*   Lack of fixes\n\n*   Configuration to ignore rules\n\
    \n*   Adding context-specific rules\n\nThey are often used as excuses to avoid\
    \ using the Static Analysis tools in the first place, which is a pity because\
    \ the use of Static Analysis can be enormously useful as a way to:\n\n*   Highlight\
    \ better approaches to junior developers.\n\n*   Gain fast feedback on clear coding\
    \ violations.\n\n*   Identify obscure issues that the programmer has not encountered\
    \ before.\n\n*   Reinforce that the programmer has adopted a good coding approach\
    \ (when no violations are reported).\n\n### IDE Based Static Analysis Tools\n\n\
    As an individual contributor to a project, I like to use Static Analysis tools\
    \ that run from within the IDE so that I receive fast feedback on my code.\n\n\
    This supplements any pull request review process and CI integration that a project\
    \ may have.\n\nI try to identify tools that will give me an edge and improve my\
    \ individual workflow.\n\nWhen tools run in the IDE, because they tend to share\
    \ the same basic GUI and configuration approach, it can be tempting to view them\
    \ interchangeably.\n\nThe tools may have overlapping functionality or rule sets.\
    \ To gain maximum advantage I install multiple tools to take advantage of their\
    \ strengths.\n\nThe Static Analysis IDE tools I actively use when coding are:\n\
    \n*   The inbuilt IntelliJ Inspections - common coding patterns.\n\n*   SpotBugs\
    \ - common errors.\n\n*   SonarLint - common usage patterns.\n\n*   CheckStyle\
    \ - common style patterns.\n\n*   Sensei from Secure Code Warrior - custom rule\
    \ creation.\n\nI use them all because they work well together to augment and supplement\
    \ each other.\n\n#### IntelliJ Inspections\n\nIf you use IntelliJ, then you are\
    \ already using their Inspections.\n\nThese are Static Analysis rules which are\
    \ flagged in the IDE. Some of them also have QuickFix options to rewrite the code\
    \ to address the issue."
