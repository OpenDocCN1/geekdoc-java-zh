    \ out-of-the-box support for Inspection Profiles in Continuous Integration.\n\n\
    *   https://www.jetbrains.com/help/teamcity/inspections.html\n\nThe Jenkins Warnings\
    \ NG plugin supports the Command Line output from IntelliJ Inspections as one\
    \ of the report formats.\n\n*   https://github.com/jenkinsci/warnings-ng-plugin\n\
    \n*   https://github.com/jenkinsci/warnings-ng-plugin/blob/master/SUPPORTED-FORMATS.md\n\
    \nCommunity projects like `idea CLI Inspector` exist to support using Inspection\
    \ Profiles in other CI tooling i.e.\n\n*   https://github.com/bentolor/idea-cli-inspector\n\
    \nThe future of Inspection Profiles in a CI process looks even brighter with the\
    \ introduction of the JetBrains Qodana project. The Qodana project is a headless\
    \ version of IntelliJ with official Github Actions and Docker images.\n\n*   https://github.com/JetBrains/Qodana\n\
    \n*Qodana is currently in beta, but the Sensei team is monitoring it so that it\
    \ becomes an officially supported platform for running Sensei rules as part of\
    \ Continuous Integration.*\n\n### Summary\n\nIntention Actions allow us to reinforce\
    \ coding patterns and quickly fix them in the IDE when we make mistakes during\
    \ coding.\n\nInspection Profiles allow us to collect these into profiles which\
    \ can run in batch as an Analyze and Inspect Code action. This can be useful if\
    \ we encounter a pattern and want to double-check if we have missed that anywhere\
    \ else in our code.\n\nInspection Profiles can be run from the command line and\
    \ even incorporated into Continuous Integration processes supporting a “trust,\
    \ but verify” model and catch any accidental slippage.\n\nAll of the above is\
    \ built in IntelliJ functionality and JetBrains are improving their Continuous\
    \ Integration process with the introduction of Qodana.\n\nSensei recipes are loaded\
    \ into IntelliJ to act as native Intention Actions and be collected into Inspection\
    \ Profiles to support batch checking through Inspect Code and Continuous Integration\
    \ support provided by the official JetBrains Command Line execution functionality.\n\
    \n### Watch On YouTube\n\nWe created a YouTube video showing all the steps and\
    \ tools in this section.\n\n[![](OEBPS/Image00017.jpg)](https://www.youtube.com/watch?v=Gk0ASNhKH2Q)\n\
    \n[youtu.be/Gk0ASNhKH2Q](https://youtu.be/Gk0ASNhKH2Q)\n\n# Sensei GUI Overview\n\
    \nThe Sensei IntelliJ plugin lets me create searches to match on code implementing\
    \ a pattern I want to change, and then create Code amendment Quick Fixes to automatically\
    \ change the code.\n\nThis section will walk through the main parts of the GUI\
    \ and how we can use them.\n\n## Sensei Menu\n\nWhen Sensei has been installed,\
    \ we will see the Sensei menu in the Tools menu.\n\n![](OEBPS/Image00018.jpg)\n\
    \n## Cookbook Manager\n\nFrom here we can show the Cookbook Manager tool which\
    \ will list all the ‘cookbooks’, or lists of recipes, that I have available to\
    \ me.\n\n![](OEBPS/Image00019.jpg)\n\nI can use this dialog to switch cookbooks\
    \ on and off. And can use the `Sensei Cookbooks` tab on the bottom of the screen\
    \ to navigate back here when I need to. I don’t have to use the main Sensei menu.\n\
    \n## Manage Recipes\n\nSince this is the example project from Github, I have some\
    \ Recipes stored in the project’s `.sensei` folder and these have been automatically\
    \ loaded.\n\nI can manage them to see what recipes are available to me by clicking\
    \ the `[Manage recipes]` button.\n\n## Cookbook Recipe Editor List\n\nEach recipe\
    \ has a configuration with the name and description and warning level which all\
    \ configure how they are rendered in the IDE when code matches the pattern in\
    \ the search.\n\n![](OEBPS/Image00020.jpg)\n\nBy clicking on a Recipe, I can edit\
    \ it.\n\n## Recipe Editor\n\nThe Recipe Editor has four main components.\n\n*\
    \   The list of recipes where we can add, delete, and duplicate recipes.\n\n*\
    \   The General Settings tab where we can configure the recipe.\n\n*   Recipe\
    \ Settings tab where we create the search and matching conditions.\n\n*   QuickFix\
    \ settings where we configure the Quick Fix changes to amend or generate code.\n\
    \n![](OEBPS/Image00021.jpg)\n\n## General Settings\n\nGeneral Settings is where\
    \ we primarily configure the:\n\n*   `Name` and `Description` are shown in the\
    \ intentions Quick Fix popup when we use `alt+enter` .\n\n*   `Level` defines\
    \ how the matching Recipe is rendered in the IDE.\n\nIf I mark a recipe as ‘Error’,\
    \ then the code will have a red underline and show as a syntax error, but a warning\
    \ will have a light highlighting."
