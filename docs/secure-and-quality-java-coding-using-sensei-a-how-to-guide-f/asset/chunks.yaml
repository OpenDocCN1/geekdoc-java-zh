  trans: "\n\n* [官方文档](https://scw.buzz/3emSI7l)\n* [`sensei-docs-beta.securecodewarrior.com/`](https://scw.buzz/3emSI7l)\n\
    \n## JetBrains 市场上的 IntelliJ\n\n* [从 IntelliJ 市场安装插件的说明](https://scw.buzz/3rveXvC)\n\
    * [`plugins.jetbrains.com/plugin/14015-sensei-by-secure-code-warrior-/getstarted`](https://scw.buzz/3rveXvC)\n\
    \n## Secure Code Warrior Sensei 博客\n\n* [博客文章](https://scw.buzz/2OBxgk0)\n* 也可以访问\
    \ [dev.to/securecodewarrior](https://dev.to/securecodewarrior)\n* [`securecodewarrior.com/blog-tags/sensei`](https://scw.buzz/2OBxgk0)\n\
    \n## Secure Code Warrior 视频\n\n* [youtube.com/c/SecureCodeWarrior/videos](https://www.youtube.com/c/SecureCodeWarrior/videos)\n\
    \n要查看 Sensei 视频，请选择 [Sensei 列表](https://www.youtube.com/playlist?list=PL7KK7fPcGxbbmIxZJzkJKXbjtc6K_nJjX)。\n\
    \n## 有用的 Github 仓库\n\n* [Github 示例项目](https://scw.buzz/3cixLrq)\n    * [`github.com/SecureCodeWarrior/sensei-blog-examples`](https://scw.buzz/3cixLrq)\n\
    * [公开 Sensei 菜谱索引](https://scw.buzz/30pk1FN)\n    * [`github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\
    \    * [`securecodewarrior.github.io/public-cookbooks/](https://scw.buzz/3btJZhV)\n\
    \n## Sensei 团队支持\n\n当一个人创建一个配方来提高代码质量或效率时，通过共享菜谱，团队中的每个人都能受益。\n\nSensei 提供了多种共享菜谱的机制：\n\
    \n* 将菜谱存储在受版本控制的项目中。\n* 将菜谱存储在共享文件夹中。\n* 将菜谱存储在 Github 中。\n* 通过 HTTP(s) 传输压缩文件。\n\
    \n通过共享菜谱，Sensei 帮助团队进行知识共享协作。这种协作有助于改进沟通，并嵌入约定的代码质量方法。\n\n例如，共享菜谱允许：\n\n* 团队成员之间共享实用的配方。\n\
    * 团队负责人为初级员工将约定的编码规范规范化。\n    * 识别常见的违规行为并为约定的版本提供快速修复。\n* 增强团队间的协作。\n    * 应用安全（AppSec）团队可能会创建配方来突出代码中的问题，而开发团队可以编写快速修复。\n\
    \n接下来的几部分将解释如何实现每种共享机制。\n\n### 将菜谱存储在受版本控制的项目中\n\n创建菜谱文件时，`.sensei` 文件夹是默认选项。\n\
    \n* `project://.sensei`\n\n所有菜谱和配方都将存储在项目中的 `.sensei` 文件夹中。\n\n最简单的共享方法是将项目的 `.sensei`\
    \ 文件夹添加到版本控制中。\n\n然后，`.sensei` 文件夹就可以像项目相关的其他共享代码产物一样进行管理。菜谱以 YAML 配置的形式存储，使其在任何提交和审查过程中易于合并。\n\
    \n这是公开项目 `sensei-blog-examples` 采用的方法。\n\n`https://github.com/SecureCodeWarrior/sensei-blog-examples`\n\
    \n`.sensei` 文件夹包含了包含所有配方的菜谱，任何克隆仓库的人都可以使用它们。\n\n### 将菜谱存储在任何文件夹中\n\n团队还可以使用存储在中心位置的菜谱。\n\
    \n将菜谱保存到任何具有共享写入权限的文件夹中，将允许整个团队更新配方，并将其导入到他们恰好正在工作的任何项目中。\n\n该位置将设置为目录路径。\n\n\
    ### 在 Github 中存储配方\n\nSensei 还可以访问存储在 Github 仓库中的配方。支持私有仓库和公共仓库。\n\n#### 通过 SSH\
    \ 访问 Github\n\n使用以下 `Location` 语法来配置 SSH 仓库访问：\n\n`git@github.com:SecureCodeWarrior/acookbook.git`\n\
    \n要使此运行，仓库中应包含菜谱文件夹的内容。\n\n例如，我们的基础保护菜谱采用了这种方法，并可以使用该位置作为“本地配置的菜谱”添加：\n\n`git@github.com:SecureCodeWarrior/cookbook-basic-protection-set.git`\n\
    \n还可以配置菜谱的分支和子文件夹，例如在 `master` 分支的 `cookbook` 子文件夹中\n\n例如：\n\n`git@github.com:SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \n私有仓库需要配置 SSH 密钥。\n\n* https://github.com/settings/keys\n\n并且密钥不应有密码保护。\n\n####\
    \ 通过 HTTPS 访问 Github\n\n也可以通过 HTTPS 访问公共仓库，使用相同的 `repo.git|branch|folder` 语法，例如：\n\
    \n`https://github.com/SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \n#### 通过 HTTP(s) 传输压缩文件\n\nSensei 还可以通过 HTTP 或 HTTPS 访问压缩的菜谱。\n\n例如：\n\n`http://localhost:8000/rules.sensei`\n\
    \n压缩文件应包含菜谱文件夹的内容，例如：\n\n`rules.sensei`\n\n### 共享总结\n\nSensei 支持使用多个菜谱来增加共享。\n\
    \n更重要的是，我们知道当知识共享时，团队工作效率最高。共享（例如应用安全到开发）可以提高团队效率。\n\n有了四种核心共享机制，Sensei 至少有一种你可以增加协作的方法。\n\
    \n## 在持续集成中运行 IntelliJ 检查\n\nIntelliJ IDEA 提供了在编写代码时通过 IDE 帮助改进代码的功能。本节涵盖了开箱即用的\
    \ IntelliJ 功能以及自定义扩展。\n\n### IntelliJ 检查\n\nIntelliJ 的检查功能驱动了在编写代码时动态在 IDE 中报告的许多错误，例如：\n\
    \n* 检测可以转换为接口的抽象类。\n* 识别冗余的类字段（本地）。\n* 关于使用弃用方法的警告。\n* 等。\n\n这些检查在 IDE 中高亮匹配代码的意操作，通常带有关联的快速修复。\n\
    \n```\n(Image 00008.jpg)\n```\n\n代码匹配检查时的实时 IDE 高亮有助于我们动态改进代码。在识别代码中的问题后，使用 IntelliJ\
    \ 意操作修复代码可以强化更好的模式。\n\n### 检查配置\n\n检查可以在 IDE 内以批处理运行，也可以从命令行或在集成过程中运行。\n\n通过批处理运行\
    \ IntelliJ 检查的关键是使用检查配置（Inspections Profile）。\n\nIntelliJ 有两个默认检查配置：存储在项目中，存储在\
    \ IDE 中。\n\n可以创建新的检查配置以配置特定的插件或用例，例如：\n\n* 仅运行 Checkstyle 扫描\n* 运行特定的 Sensei 规则\n\
    * 运行 HTML 检查\n\n配置中的检查可以在 IntelliJ 偏好设置中启用或禁用。偏好设置也是了解可用检查范围的简单方法。\n\n```\n(Image\
    \ 00009.jpg)\n```\n\n工具图标允许复制配置并创建一个新配置以收集特定的规则集。\n\n```\n(Image 00010.jpg)\n\
    ```\n\n### 在 IDE 中运行检查配置\n\n可以使用 `Analyze \\ Inspect Code...` 菜单在 IDE 内运行检查配置。\n\
    \n```\n(Image 00011.jpg)\n```\n\n"
- fmt: '

    The `Analyze` functionality allows you to control the scope that the `Inspection`
    will run against e.g. the whole project, including or excluding test sources,
    or against a specific set of files.


    ![](OEBPS/Image00012.jpg)


    You can also manage the `Inspection Profiles` from here to create or configure
    a particular profile.


    Clicking `[OK]` on the “Specify Inspection Scope” dialog will trigger IntelliJ
    into running all the selected `Inspections` in the profile across the defined
    scope.


    IntelliJ will report the results of running the `Inspections` in the `Inspection
    Results` tab.


    ![](OEBPS/Image00013.jpg)


    The [Sensei](https://scw.buzz/3qvDvDt) plugin from Secure Code Warrior allows
    you to create custom code matching recipes. Sensei tightly integrates with IntelliJ
    to make these custom recipes as natural to use as the `IntelliJ Intention Actions`.
    This means they are loaded into IntelliJ as `Inspections` and can be grouped,
    enabled, and disabled using `Inspection Profiles`. Creating a custom `Inspection
    Profile` and then using the `Analyze Inspect Code` functionality is the recommended
    way of running Sensei recipes in bulk across a project.


    ### Running an Inspection Profile from the Command Line


    IntelliJ has the ability to run inspections from the command line as documented
    by JetBrains:


    * https://www.jetbrains.com/help/idea/working-with-the-ide-features-from-command-line.html


    I primarily use Mac OS, and can run a single instance of IntelliJ from the command
    line with:


    ```

    open -na "IntelliJ IDEA CE.app"

    ```


    To support easier execution I add this to a shell command script.


    `vi /usr/local/bin/idea`


    The contents of the script are from the official documentation provided by IntelliJ.


    ```bash

    #!/bin/sh

    open -na "IntelliJ IDEA CE.app" --args "$@"

    ```


    I then made this executable to allow me to simplify the command line inspection
    process.


    `chmod 755 /usr/local/bin/idea`


    The official intellij docs describe the general form of the inspection command
    as:


    `idea inspect <project> <inspection-profile> <output> [<options>]`


    In practice, I fully qualify the paths:


    ```

    idea inspect /Users/user/GitHub/sensei-blog-examples /Users/user/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml
    /Users/user/GitHub/sensei-blog-examples/scan-results

    ```


    Or use them relative to my user directory:


    ```

    idea inspect ~/Documents/GitHub/sensei-blog-examples ~/Documents/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml
    scan-results

    ```


    This runs all the `Inspections` I added to the `senseiprofile` and reports the
    results in the `scan-results` folder.


    ![](OEBPS/Image00014.jpg)


    ### Viewing Inspection Results


    We can report these results from within Continuous Integration, as we’ll see later.


    We can also view them within IntelliJ itself using the `Analyse \ View Offline
    Inspection Results…` feature.


    ![](OEBPS/Image00015.jpg)


    This will load the results into the `Inspection Results` tab.


    ![](OEBPS/Image00016.jpg)


    This is officially documented on the JetBrains site:


    * https://www.jetbrains.com/help/idea/command-line-code-inspector.html#inspection-results


    This might be used during a code review process if the command line execution
    was incorporated into a Continuous Integration process and the reviewers wanted
    to check the full source context of any of the Inspection result entries.


    ### Inspection Profiles in Continuous Integration


    When adding the Command Line inspection into Continuous Integration we ideally
    want a report to be generated automatically and there are a number of options
    open to us.


    TeamCity offers out-of-the-box support for `Inspection Profiles` in Continuous
    Integration.


    * https://www.jetbrains.com/help/teamcity/inspections.html


    The Jenkins Warnings NG plugin supports the Command Line output from IntelliJ
    Inspections as one of the report formats.


    * https://github.com/jenkinsci/warnings-ng-plugin

    * https://github.com/jenkinsci/warnings-ng-plugin/blob/master/SUPPORTED-FORMATS.md


    Community projects like `idea CLI Inspector` exist to support using `Inspection
    Profiles` in other CI tooling i.e.


    * https://github.com/bentolor/idea-cli-inspector


    The future of Inspection Profiles in a CI process looks even brighter with the
    introduction of the JetBrains Qodana project. The Qodana project is a headless
    version of IntelliJ with official Github Actions and Docker images.


    * https://github.com/JetBrains/Qodana


    *Qodana is currently in beta, but the Sensei team is monitoring it so that it
    becomes an officially supported platform for running Sensei rules as part of Continuous
    Integration.*


    ### Summary


    Intention Actions allow us to reinforce coding patterns and quickly fix them in
    the IDE when we make mistakes during coding.


    Inspection Profiles allow us to collect these into profiles which can run in batch
    as an `Analyze and Inspect Code` action. This can be useful if we encounter a
    pattern and want to double-check if we have missed that anywhere else in our code.


    Inspection Profiles can be run from the command line and even incorporated into
    Continuous Integration processes supporting a “trust, but verify” model and catch
    any accidental slippage.


    All of the above is built in IntelliJ functionality and JetBrains are improving
    their Continuous Integration process with the introduction of Qodana.


    Sensei recipes are loaded into IntelliJ to act as native functionality.


    ### Watch On YouTube


    We created a YouTube video showing all the steps and tools in this section.


    [![](OEBPS/Image00017.jpg)](https://www.youtube.com/watch?v=Gk0AS2Q)


    [youtu.be/Gk0AS2Q](https://youtu.be/Gk0AS2Q)


    # Sensei GUI Overview


    The Sensei plugin lets me create searches to match code I want to change, and
    then create Quick Fixes to amend the code. This section will walk through the
    main parts of the GUI and how we can use them.


    ## Sensei Menu


    When Sensei has been installed, we will see the Sensei menu in `Tools` menu.


    ![](OEBPS/Image0018.jpg)


    ## Cookbook Manager


    From here we can show the Cookbook Manager which will list all ‘cookbooks’, or
    lists of recipes, that I available to me.


    ![](OEBPS/Image00019.jpg)


    I can use this dialog to switch cookbooks on and off. And use the `Sensei Cookbooks`
    tab on the bottom of the screen to navigate back here when I need to. I don’t
    have to use the main Sensei menu.


    ## Manage Recipes


    Since this is the example project from Github, I have some Recipes stored in the
    project’s `.sensei` folder and these have been automatically loaded.


    I can manage them to see what recipes are available to me by clicking the `[Manage
    recipes]` button.


    ## Recipe Editor List


    Each recipe has a configuration with the name and description and warning level
    which all configure how they are rendered in the IDE when code matches the pattern
    in the search.


    ![](OEBPS/Image00020.jpg)


    By clicking on a Recipe, I can edit it.


    ## Recipe Editor


    The Recipe Editor has four main components:


    * The list of recipes where we can add, delete, and duplicate recipes.

    * The General Settings tab where we can configure the recipe.

    * The Recipe Settings tab where we create the search and matching conditions.

    * The QuickFix settings where we configure the Quick Fix changes to amend or generate
    code.


    ![](OEBPS/Image00021.jpg)


    ## General Settings


    General Settings is where we primarily configure the:


    * `Name` and `Description` are shown in the intentions Quick Fix popup when we
    use `alt+enter` .

    * `Level` defines how the matching Recipe is rendered in the IDE.


    If I mark a recipe as ‘Error’, then the code will have a red underline and show
    as a syntax error, but a warning will have a light highlighting.

