    [Sensei](https://scw.buzz/38n5uPu) uses Static Analysis based on an Abstract Syntax
    Tree (AST) for matching code and for creating Quick Fixes, this allows for very
    specific identification of code with issues.


    The AST allows Quick Fixes associated with a recipe to understand the surrounding
    code e.g. when adding a new class into the code any import for that class will
    only be added to the source file once, and not for each replacement.


    Sensei was created to make it easy to build custom matching rules which may not
    exist, or which would be hard to configure, in other tools.


    Rather than amend a configuration file, all the configuration can be performed
    in the GUI. When creating new recipes the GUI makes it easy to see which code
    the recipe matches. When defining the Quick Fixes the before and after state of
    the code can be compared immediately. This makes it easier to create very contextual
    recipes i.e. unique to teams, or technology, and even individual programmers.


    ![](OEBPS/Image00007.jpg)


    I use Sensei in combination with other Static Analysis tools e.g. most Static
    Analysis tools will find issues, but not fix them. A common use case for Sensei
    is to replicate the other tool’s matching search in Sensei and expand it with
    a Quick Fix. This has the benefit that the custom fix applied already meets the
    coding standards for your project.


    I periodically find myself creating Sensei recipes that already exist in the IntelliJ
    Intensions set because the Intension report doesn’t quite match the context I’ve
    created or because the QuickFix provided by IntelliJ doesn’t match the code pattern
    I want to use.


    I augment the existing tools, rather than attempt to fully replace them.


    Sensei can also be very useful when you identify a contextual variant of a common
    rule e.g. if you are using an SQL library not supported by the Static Analysis
    tool, but the common SQL rules in the Static Analysis engine still apply, then
    you can create library-specific variants of those rules using Sensei.


    Sensei does not come out-of-the-box with a lot of generic recipes like the Static
    Analysis tools mentioned, its strength is in making it easy to create new recipes,
    complete with Quick Fixes configured to match your specific coding style and use-cases.


    *NOTE: we are working on a public repository of recipes to cover generic use-cases,
    and [you can find it here](https://scw.buzz/30pk1FN) .*


    ### Summary


    I tend to pick tools that work together, are configurable, and easy to expand
    to meet my specific context. I’ve used Static Analysis tools in the IDE for years
    to help me identify issues, and learn more about the programming languages and
    libraries I use.


    I use all of the tools mentioned in combination:


    *   IntelliJ Intentions helps flag common code issues out the box, often with
    associated Quick Fixes.


    *   SpotBugs finds simple bugs I might have missed and alerts me to performance
    issues.


    *   SonarLint identifies Java features I was unaware of and prompts me to additional
    ways of modelling my code.


    *   CheckStyle helps me conform to an agreed coding style that is also enforced
    during CI.


    *   Sensei helps me create Quick Fixes to augment common scenarios found by Static
    Analysis tools and create specific project or technology recipes that can be hard
    to configure in another tool.


    ## Example Recipe Repositories


    We have created some example repositories on GitHub that you might find useful
    for learning Sensei.


    *   [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)


    *   [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)


    ### Blog Examples


    This project has example recipes and code to experiment with.


    *   [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)


    **How to Use:**


    *   [Install Sensei Plugin](https://scw.buzz/3rveXvC) .


    *   Clone or download project.


    *   Open in IDE.


    *   Example Sensei recipes in `.sensei` will be loaded.


    *   Read through Use Cases to see how recipes identify issues and fix code.


    *This is a Multi-module maven project. When you clone this project, or download
    it as a zip, remember to open the top level `pom.xml` as the project. The `.sensei`
    folder contains example recipes which support the examples and embedded `readme.md`
    files.*


    ### Public Cookbooks


    The Public Cookbooks repo is a list of all the public Sensei Cookbooks that we
    know of.


    *   [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)


    *   [securecodewarrior.github.io/public-cookbooks](https://scw.buzz/3btJZhV)


    Full instructions and documentation for the cookbooks should be in the listing
    for each cookbook.


    The cookbooks in the public listing are useful:


    *   To use as cookbooks for the technology they cover.


    *   For studying to see how to create recipes.


    *   To understand the range of domains that Sensei recipes can be applied to.


    ## Useful Documentation and Links


    The documentation for Sensei:'
