    `Analyze` 功能允许你控制 `Inspection` 运行的范围，例如整个项目（包括或排除测试源），或针对特定的文件集。


    ![](img/Image00012.jpg)


    你也可以在此处管理 `Inspection Profiles`（检查配置），以创建或配置特定的配置。


    在“Specify Inspection Scope”（指定检查范围）对话框中点击 `[OK]`，将触发 IntelliJ 在定义的范围内运行配置中所有选中的
    `Inspections`。


    IntelliJ 将在 `Inspection Results`（检查结果）标签页中报告运行 `Inspections` 的结果。


    ![](img/Image00013.jpg)


    来自 Secure Code Warrior 的 [Sensei](https://scw.buzz/3qvDvDt) 插件允许你创建自定义的代码匹配配方。Sensei
    与 IntelliJ 深度集成，使得这些自定义配方的使用像 `IntelliJ Intention Actions`（IntelliJ 意图操作）一样自然。这意味着它们作为
    `Inspections` 加载到 IntelliJ 中，并可以使用 `Inspection Profiles` 进行分组、启用和禁用。创建一个自定义的 `Inspection
    Profile` 并使用 `Analyze Inspect Code` 功能是在整个项目中批量运行 Sensei 配方的推荐方法。


    ### 从命令行运行检查配置


    IntelliJ 具有如 JetBrains 文档所描述的那样从命令行运行检查的能力：


    * https://www.jetbrains.com/help/idea/working-with-the-ide-features-from-command-line.html


    我主要使用 Mac OS，可以通过以下命令从命令行运行单个 IntelliJ 实例：


    ```

    open -na "IntelliJ IDEA CE.app"

    ```


    为了支持更容易执行，我将此添加到 shell 命令脚本中。


    `vi /usr/local/bin/idea`


    脚本的内容来自 IntelliJ 提供的官方文档。


    ```bash

    #!/bin/sh

    open -na "IntelliJ IDEA CE.app" --args "$@"

    ```


    然后我赋予了它可执行权限，以便简化命令行检查过程。


    `chmod 755 /usr/local/bin/idea`


    Intelliij 官方文档描述了检查命令的一般形式为：


    `idea inspect <project> <inspection-profile> <output> [<options>]`


    在实践中，我使用了全路径：


    ```

    idea inspect /Users/user/GitHub/sensei-blog-examples /Users/user/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml
    /Users/user/GitHub/sensei-blog-examples/scan-results

    ```


    或者使用相对于我用户目录的路径：


    ```

    idea inspect ~/Documents/GitHub/sensei-blog-examples ~/Documents/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml
    scan-results

    ```


    这会运行我添加到 `senseiprofile` 中的所有 `Inspections`并将结果报告在 `scan-results` 文件夹中。


    ![](img/Image00014.jpg)


    ### 查看检查结果


    正如稍后看到的，我们可以在持续集成（CI）内部报告这些结果。


    我们也可以在 IntelliJ 内部使用 `Analyse \ View Offline Inspection Results…`（分析 \ 查看离线检查结果…）功能查看它们。


    ![](img/Image00015.jpg)


    这将会将结果加载到 `Inspection Results` 标签页中。


    ![](img/Image00016.jpg)


    这在 JetBrains 网站上有官方文档记录：


    * https://www.jetbrains.com/help/idea/command-line-code-inspector.html#inspection-results


    如果将命令行执行整合到持续集成过程中，并且审查人员想要检查任何检查结果条目的完整源码上下文，则可能会在代码审查过程中使用此功能。


    ### 持续集成中的检查配置


    在将命令行检查添加到持续集成时，我们理想情况下希望自动生成报告，我们有许多选项可以选择。


    TeamCity 为持续集成中的 `Inspection Profiles` 提供了开箱用的支持。


    * https://www.jetbrains.com/help/teamcity/inspections.html


    Jenkins Warnings NG 插件支持 IntelliJ 检查的命令行输出作为报告格式之一。


    * https://github.com/jenkinsci/warnings-ng-plugin

    * https://github.com/jenkinsci/warnings-ng-plugin/blob/master/SUPPORTED-FORMATS.md


    存在如 `idea CLI Inspector` 这样的社区项目，用于在其他 CI 工具中使用 `Inspection Profiles`，例如：


    * https://github.com/bentolor/idea-cli-inspector


    随着 JetBrains Qodana 项目的引入，检查配置在 CI 过程中的未来看起来更加明亮。Qodana 项目是 IntelliJ 的无头版本，带有官方的
    Github Actions 和 Docker 镜像。


    * https://github.com/JetBrains/Qodana


    *Qodana 目前处于测试阶段，但 Sensei 团队正在监控它，使其作为持续集成中运行 Sensei 规则的官方支持平台。*


    ### 总结


    意图操作（Intention Actions）允许我们在编码期间出错时强化编码模式并在 IDE 中快速修复它们。


    检查配置（Inspection Profiles）允许我们将这些收集到配置中，并作为 `Analyze and Inspect Code` 操作批量运行。当我们遇到某种模式并想双检是否在代码的其他地方遗漏了该模式时，这非常有用。


    检查配置可以从命令行运行，甚至可以整合到持续集成过程中，支持“信任，但要验证”的模型并捕捉任何意外的疏漏。


    以上所有都是 IntelliJ 的内置功能，JetBrains 正在通过引入 Qodana 改进他们的持续集成过程。


    Sensei 配方作为原生功能加载到 IntelliJ 中。


    ### 在 YouTube 上观看


    我们创建了一个 YouTube 视频，展示了本部分的所有步骤和工具。


    ![](https://www.youtube.com/watch?v=GkAS2Q)


    [youtu.be/GkAS2Q](https://youtu.be/GkAS2Q)


    # Sensei GUI 概述


    Sensei 插件允许我创建搜索来匹配我想修改的代码并创建快速修复（Quick Fix）来修改代码。本节将介绍 GUI 的主要部分以及如何使用它们。


    ## Sensei 菜单


    安装 Sensei 后，我们在工具菜单中看到 Sensei 菜单。


    ![](img/Image0018.jpg)


    ## 食谱管理器 (Cookbook Manager)


    我们可以在这里显示食谱管理器，它将列出我可用的“食谱”（配方列表）。


    ![](img/Image0019.jpg)


    我可以使用此对话框切换食谱的启用和禁用。可以使用屏幕底部的 `Sensei Cookbooks` 标签页在需要时返回这里。我不需要主菜单。


    ## 管理配方


    由于这是来自 Github 的示例项目，我在项目的 `.sensei` 文件夹中存储了一些配方，并且它们已自动加载。


    可以通过点击 `[Manage recipes]` 按钮来管理它们并查看哪些配方可用


    ## 配方编辑器列表


    每个配方都有一个包含名称、描述和警告级别的配置，这些配置定义了当代码匹配搜索中的模式时在 IDE 中如何渲染。


    ![](img/Image0020.jpg)


    通过点击配方，我可以对其进行编辑。


    ## 配方编辑器


    配方编辑器有四个主要组件：


    * 配方列表，可以在此处添加、删除和复制配方。

    * 通用设置标签页，可以在此处配置配方。

    * 配方设置标签页，创建搜索和匹配条件。

    * 修复设置，配置修改或生成代码的快速修复更改。


    ![](img/Image0021.jpg)


    ## 通用设置


    通用设置是我们在主要配置此处：


    * `Name` 和 `Description` 在使用 `alt+enter` 时显示在意图快速修复弹出窗口中。

    * `Level` 定义了匹配的配方在 IDE 中如何渲染。


    如果我将一个配方标记为“错误”（Error），则代码将带有红色下划线并显示为语法错误，但警告将会有轻量高亮。


