    \n## IntelliJ on the JetBrains marketplace\n\n* [Instructions to install the plugin\
    \ from the IntelliJ Marketplace](https://scw.buzz/3rveXvC)\n* [https://plugins.jetbrains.com/plugin/14015-sensei-by-secure-code-warrior-/getstarted](https://scw.buzz/3rveXvC)\n\
    \n## The Secure Code Warrior Sensei Blog\n\n* [Blog Posts](https://scw.buzz/2OBxgk0)\n\
    * Also on [dev.to/securecodewarrior](https://dev.to/securecodewarrior)\n* [`securecodewarrior.com/blog-tags/sensei`](https://scw.buzz/2OBxgk0)\n\
    \n## Videos from Secure Code Warrior\n\n* [youtube.com/c/SecureCodeWarrior/videos](https://www.youtube.com/c/SecureCodeWarrior/videos)\n\
    \nTo see the Sensei videos, select the [Sensei playlist](https://www.youtube.com/playlist?list=PL7KK7fPcGxbbmIxZJzkJKXbjtc6K_nJjX)\
    \ .\n\n## Useful Github Repositories\n\n* [Examples Project on Github](https://scw.buzz/3cixLrq)\n\
    \    * [`github.com/SecureCodeWarrior/sensei-blog-examples`](https://scw.buzz/3cixLrq)\n\
    * [Public Sensei Cookbooks Index](https://scw.buzz/30pk1FN)\n    * [`github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\
    \    * [`securecodewarrior.github.io/public-cookbooks/](https://scw.buzz/3btJZhV)\n\
    \n## Sensei Team Support\n\nWhen one person creates a recipe to improve their\
    \ code quality or productivity, everyone on the team can benefit when the cookbooks\
    \ are shared.\n\nSensei provides a number of mechanisms for sharing cookbooks:\n\
    \n* Store Cookbooks in the Project Under Version Control.\n* Storing Cookbooks\
    \ in a shared folder.\n* Store Cookbooks in Github.\n* Zipped files over HTTP(s).\n\
    \nBy sharing the cookbooks, Sensei helps teams collaborate on knowledge sharing.\
    \ The collaboration helps improve communication and embed the agreed code quality\
    \ approaches.\n\nFor example, sharing a cookbook allows:\n\n* Team members to\
    \ share useful recipes with each other.\n* Team leads to codify agreed coding\
    \ practices for junior staff.\n    * To identify common violations with a quick\
    \ fix for the agreed version.\n* Increased Inter-team co-operation.\n    * An\
    \ AppSec team might create recipes to highlight a problem in the code, and the\
    \ development team could write the quick fix.\n\nThe next few sections explain\
    \ how to implement each of the sharing mechanisms.\n\n### Store Cookbooks in the\
    \ Project Under Version Control\n\nThe project `.sensei` folder is the default\
    \ option when creating a cookbook file.\n\n* `project://.sensei`\n\nAll cookbooks\
    \ and recipes would be stored in a `.sensei` folder in your project.\n\nThe easiest\
    \ approach to sharing is to add the project `.sensei` folder to version control.\n\
    \nThen the `.sensei` folder can be managed like any other shared code artifact\
    \ associated with the project. The cookbooks are stored as YAML configuration,\
    \ making them easy to merge during any commit and review process.\n\nThis is the\
    \ approach taken for the public `sensei-blog-examples` project.\n\n`https://github.com/SecureCodeWarrior/sensei-blog-examples`\n\
    \nThe `.sensei` folder contains the cookbook with all the recipes, and they are\
    \ available to anyone that clones the repository.\n\n### Store Cookbooks in Any\
    \ Folder\n\nTeams can also use cookbooks stored in central locations.\n\nSaving\
    \ the cookbook to any folder with shared write access permissions will allow the\
    \ whole team to update the recipes, and import them into any project that they\
    \ happen to be working on.\n\nThe location would be set to the directory path.\n\
    \n### Store Recipes in Github\n\nSensei can also access recipes that are stored\
    \ in a Github repo. Both private and public repositories are supported.\n\n####\
    \ Github over SSH\n\nSSH Repository access is configured using the following syntax\
    \ for the `Location`\n\n`git@github.com:SecureCodeWarrior/acookbook.git`\n\nFor\
    \ this to work, the repository would contain the contents of a cookbook folder.\n\
    \ne.g. our Basic Protection Cookbook takes this approach and could be added as\
    \ a “Locally configured Cookbook” using the location\n\n`git@github.com:SecureCodeWarrior/cookbook-basic-protection-set.git`\n\
    \nIt is also possible to configure the branch and the subfolder for the cookbook\
    \ e.g. in the `master` branch in the `cookbook` subfolder\n\ne.g.\n\n`git@github.com:SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \nAn SSH key needs to be configured for private repositories.\n\n* https://github.com/settings/keys\n\
    \nAnd the key should not have a passphrase.\n\n#### Github over HTTPS\n\nIt is\
    \ also possible to access public repositories over HTTPS, and the same `repo.git|branch|folder`\
    \ syntax is used e.g.\n\n`https://github.com/SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
    \n#### Zipped over HTTP(s)\n\nSensei can also access cookbooks that are zipped,\
    \ over HTTP or HTTPS.\n\ne.g.\n\n`http://localhost:8000/rules.sensei`\n\nThe zip\
    \ file should contain the contents of a cookbook folder e.g.\n\n`rules.sensei`\n\
    \n### Sharing Summary\n\nSensei supports using multiple cookbooks to increase\
    \ knowledge sharing.\n\nMore importantly, we know that teams work most effectively\
    \ when knowledge is shared. Having shared team e.g. AppSec to development, can\
    \ help team productivity.\n\nWith four core sharing mechanisms available, Sensei\
    \ has at least one approach you can use to increase collaboration.\n\n## Running\
    \ IntelliJ Inspections From Continuous Integration\n\nIntelliJ IDEA offers functionality\
    \ to help improve our code, within the IDE when writing code as Intentions. This\
    \ section covers the out-the-box IntelliJ functionality and extending with custom\
    \ Intentions.\n\n### IntelliJ Inspections\n\nThe Inspections feature of IntelliJ\
    \ drives the display of many of the errors that are reported dynamically in the\
    \ IDE when coding e.g.\n\n* Detecting abstract classes that can be converted to\
    \ interfaces.\n* Identifying redundant class fields which can be local.\n* Warning\
    \ about uses of deprecated methods.\n* etc.\n\nThese Inspections highlight code\
    \ that matches in the IDE as Intention Actions which often have an associated\
    \ QuickFix\n\n```\n(Image 00008.jpg)\n```\n\nThe real-time IDE highlighting when\
    \ code matches an Inspection can help us improve our coding dynamically. After\
    \ identifying the issue in the code, using IntelliJ Intention Actions to QuickFix\
    \ the code can reinforce better patterns.\n\n### Inspections Profile\n\nInspections\
    \ can run as a batch from within the IDE and from the Command Line or in a Integration\
    \ process.\n\nThe key to working with IntelliJ inspections in a batch is through\
    \ the use of an Inspections Profile.\n\nIntelliJ has two default Inspection Profiles:\
    \ one stored in the Project, and one stored in the IDE.\n\nNew Inspection Profiles\
    \ can be created to configure specific plugins or use-cases e.g\n\n* Run Checkstyle\
    \ real-time scan only\n* Run a specific set of Sensei rules\n* Run the HTML checks\n\
    \nThe Inspections in a profile can be enabled or disabled from the IntelliJ Preferences.\
    \ The Preferences dialog is also an easy way to learn the range of Inspections\
    \ available.\n\n```\n(Image 00009.jpg)\n```\n\nThe ‘tool icon allows you to duplicate\
    \ a Profile and create a new Profile to collect a specific set of rules.\n\n```\n\
    (Image 00010.jpg)\n```\n\n### Running an Inspection Profile in the IDE\n\nInspection\
    \ Profiles can be run from within the IDE using the `Analyze \\ Inspect Code...`\
    \ menu.\n\n```\n(Image 00011.jpg)\n```\n"
