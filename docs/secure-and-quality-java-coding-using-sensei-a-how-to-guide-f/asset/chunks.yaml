    \ Editor List\n\nThis list shows all the recipes available in the current cookbook.\n\
    \n### Recipe Editor\n\nThe recipe editor is where you create and edit individual\
    \ recipes.\n\n### General Settings\n\nGeneral settings allow you to configure\
    \ the behavior of the Sensei plugin.\n\n### Recipe Settings - Search\n\nThis section\
    \ allows you to search for specific recipes.\n\n### QuickFix Settings\n\nThese\
    \ settings allow you to configure how quick fixes are displayed and applied.\n\
