  trans: "\n从 [Intellij Marketplace](https://plugins.jetbrains.com/plugin/14015) 下载并安装\
    \ Sensei。我们推荐通过 IntelliJ 偏好设置中的插件管理器进行安装（只需搜索“Sensei secure code”即可找到它）。\n\n我们还在\
    \ Intellij Marketplace 上创建了一份入门指南 - [入门介绍页](https://scw.buzz/3rveXvC)。\n\n一旦你下载并安装了\
    \ Sensei，要让它为你服务的最简单方法是观察你的编码过程并考虑：\n\n*   你经常需要查阅哪些文档？\n    *   你可以添加一些 Sensei\
    \ 配方（recipes），将它们链接回这些文档。\n*   你总是在犯哪些简单错误？\n    *   你可以临时地将那种糟糕的编码模式代码化为一个匹配器（matcher），并编写一个\
    \ `Quick Fix` 重写程序，将代码修正为你真正想写的样子。\n*   使用某个库时，你需要编写哪些样板代码？\n    *   你可以创建一个 `Quick\
    \ Fix` 规则来为你编写代码。\n\nSensei 的设计旨在与你正在使用的任何静态分析工具协同工作。这意味着，如果你发现静态分析报告了相同的违规项，那么你可以在\
    \ Sensei 配方中复制该条件。然后你可以添加一个 `Quick Fix`，帮助训练自己不仅能识别错误，还能快速切换到编写正确的代码。\n\n## 什么是静态分析？\n\
    \n静态分析是在不执行应用程序的情况下对源代码进行自动化分析。\n\n当分析在程序执行期间进行时，则被称为动态分析（Dynamic Analysis）。\n\
    \n静态分析通常用于检测：\n\n*   安全漏洞。\n*   性能问题。\n*   不符合标准的情况。\n*   使用了过时的编程结构。\n\n### 静态分析工具是如何工作的？\n\
    \n所有静态分析工具的共同基本概念是搜索源代码，以识别出带有某种警告或信息的特定编码模式。\n\n这可能简单如“JUnit 5 测试类不需要声明为‘public’”，也可能是复杂的识别类问题，例如“在\
    \ SQL 执行语句中使用了不可信的字符串输入”。\n\n静态分析工具在实现此功能的方式上各不相同：\n\n*   使用源代码解析技术来创建抽象语法树 (`AST`)；\n\
    *   文本正则表达式匹配；\n*   或是上述两者的结合。\n\n文本的正则表达式匹配非常灵活，且易于编写匹配规则，但往往会导致大量的误报，而且匹配规则忽略了周围代码的上下文。\n\
    \n`AST` 匹配将源代码视为程序代码，而不仅仅是填充了文本的文件。这允许进行更具体的、基于上下文的匹配，并可以减少针对代码报告的误报数量。\n\n###\
    \ 持续集成中的静态分析\n\n静态分析通常在持续集成（CI）过程中执行，以生成合规性问题报告，通过审查这些报告可以获得代码库随时间推移的客观视图。\n\n\
    有些人将静态分析作为代码质量的客观衡量，通过配置静态分析工具仅测量代码的特定部分，并仅报告规则的子集。\n\n客观性是由所使用的规则提供的，因为这些规则对代码的评估不会随时间推移而改变。显然，所使用的规则组合及其配置是一个主观性决策，不同的团队会在不同时间选择不同的规则。\n\
    \n在 CI 中执行静态分析是有用的，但可能会推迟给程序员的反馈。程序员在编码时并不会收到反馈，而是在代码通过静态分析工具运行后后才会收到反馈。在 CI 中运行静态分析的另一个副作用是结果更容易被忽略。\n\
    \n为了帮助团队更加关注静态分析的结果，通常可以在构建过程中配置一个阈值指标，如果指标超过该阈值则导致构建失败，例如触发的规则数量。\n\n### IDE\
    \ 中的静态分析\n\n为了更快地接收反馈，有很多 IDE 插件可以根据需要或随着代码更改定期在 IDE 中运行静态分析规则。\n\n这样，程序员在编写代码时，就可以在\
    \ IDE 中看到规则违规项；为了让规则难以被忽略，违规项通常可以配置为渲染为编辑器中带下划线的代码。\n\n我个人发现这是一个改进我编码的有用方法，特别是在处理被静态分析工具覆盖的新库时。尽管它可能会由于误报而产生“噪音”，或者包含一些对你不感兴趣的规则。但这可以通过多花一个步骤，配置静态分析工具来忽略某些规则来解决。\n\
    \n### 根据静态分析规则修复代码\n\n对于大多数静态分析工具，修复规则的工作被留给了程序员，因此他们必须理解规则违规的原因以及如何修复它。\n\n极少数静态分析工具也包含修复违规项的能力，因为修复通常取决于团队、所用技术以及他们约定的编码风格。\n\
    \n### 默认规则\n\n当静态分析工具带有默认规则时，可能会对规则的质量产生盲目的自信。人们很容易相信这些规则涵盖了程序员可能遇到的所有问题以及规则应该适用的所有情况。有时，规则应该适用的情况可能是微妙的，并且并不容易检测。\n\
    \n我们希望，通过使用静态分析工具并更详细地研究规则和违规项，程序员将开发出在特定领域背景下检测并避免问题的技能。\n\n当领域需要上下文相关的规则时，静态分析工具可能没有任何匹配你领域或库的规则。此外，这些工具通常难以配置和扩展。\n\
    \n### 困扰之处\n\n这些“困扰”并不是不可逾越的。它们包括：\n\n*   误报\n*   缺乏修复方案\n*   忽略规则的配置\n*   添加特定上下文的规则\n\
    \n它们经常被用作避免使用分析工具的借口，这非常遗憾，因为使用静态分析可以极大地帮助：\n\n*   向初级展示更好的方法。\n*   对清晰的编码违规获得快速反馈。\n\
    *   识别程序员尚未遇到的问题。\n*   强化程序员已采用良好方法（在没有报告违规时）。\n\n## 基于 IDE 的静态分析工具\n\n作为项目的个人贡献者，我喜欢在\
    \ IDE 内部运行静态分析工具，以便对我的代码获得快速反馈。\n\n这补充了项目可能有的任何评审流程和 CI 集成。\n\n我尝试识别那些能给我优势并改进我个人工作流的工具。\n\
    \n当工具在 IDE 中运行时，由于它们通常共享相同的界面和配置方法，人们很容易将它们等同看待。\n\n工具之间可能存在重叠的功能或规则集。为了获得最大优势，我安装多个工具来利用它们的各自长处。\n\
    \n我在编码时积极使用的静态分析 IDE 工具包括：\n\n*   内置的 IntelliJ Inspections - 常见的编码模式。\n*   `SpotBugs`\
    \ - 常见的错误。\n*   `SonarLint` - 常见的用法。\n*   `CheckStyle` - 常见的样式。\n*   来自 Secure\
    \ Code Warrior 的 `Sensei` - 自定义规则创建。\n\n我使用它们是因为它们配合良好。\n\n如果你使用 IntelliJ，那么你已经在使用他们的检查（Inspections）了。\n\
    \n这些是在 IDE 中标记的静态分析规则。其中一些还有 `QuickFix` 选项，可以重写代码以解决问题。\n\n"
- fmt: '

    The rules are configurable on and off, and to choose the error level used to highlight
    it in the IDE.


    ![](OEBPS/Image00002.jpg)


    There are a lot of good IntelliJ Inspections. I know that because I read through
    them while writing this. I use the IntelliJ Inspections as the defaults and haven’t
    configured them, but to gain full value from the Inspections you should read through
    them, identify those relevant to your coding style, and configure the warning
    level so that you notice them in the code.


    The great thing about the IntelliJ Inspections is that they come free with the
    IDE and they help build the muscle memory of:


    * Noticing warnings and errors in the source as you write code.

    * Hovering the mouse over flagged code to learn the rule violations.

    * Using `alt+enter` to apply a `QuickFix` for the issue.


    ![](OEBPS/Image00003.jpg)


    ### SpotBugs


    The [SpotBugs](https://plugins.jetbrains.com/plugin/14014-spotbugs) IntelliJ plugin
    uses Static Analysis to try and alert you to bugs in your code.


    SpotBugs can be configured from the IntelliJ Preferences to scan your code. The
    actual rules used can be found in the `Detector` tab.


    ![](OEBPS/Image00004.jpg)


    I tend to use SpotBugs after I’ve written and reviewed my code. I’ll then run
    the `Analyze Project Files Including Test Sources`.


    ![](OEBPS/Image00005.jpg)


    This does help me identify bugs, dead code, and obvious optimizations. It also
    forces me to research some of the flagged violations to help me decide what to
    do.


    SpotBugs will find issues but does not offer any `QuickFix` actions to attempt
    to resolve the issues.


    SpotBugs is easy to configure and I find it to be a useful objective second opinion
    to consult in my IDE.


    ### SonarLint


    The [SonarLint](https://plugins.jetbrains.com/plugin/7973-sonarlint) plugin.


    SonarLint can be configured from the IntelliJ Preferences to select which rules
    the code is validated against.


    ![](OEBPS/Image00006.jpg)


    By default, SonarLint runs in realtime and shows issues for the current code that
    you are editing.


    SonarLint does not offer quick fixes, but the documentation associated with the
    violation reports is usually clear and well documented.


    I’ve found SonarLint to be useful in the past for alerting me to new Java features
    that I was aware of in the newer versions of Java.


    ### CheckStyle


    The [CheckStyle](https://plugins.jetbrains.com/plugin/1065-checkstyle-idea) plugin
    offers a mix of formatting and code-quality rules.


    The CheckStyle plugin comes bundled with `Sun Checks` and `Google Checks`.


    The definitions of these can be easily [found online](https://checkstyle.sourceforge.io/style_configs.html)
    .


    CheckStyle adds the most value when a project has spent the time creating its
    own ruleset. Then the IDE plugin can be configured to use that ruleset and programmers
    can perform a scan, prior to committing the code to CI.


    CheckStyle is very often used as a build failing plugin for CI processes when
    the number of CheckStyle violations exceeds a threshold.


    ### Sensei


    [Sensei](https://scw.buzz/38n5uPu) uses Static Analysis based on an Abstract Syntax
    Tree (`AST`) for matching code and for creating `Quick Fixes`, this allows for
    very specific identification of code with issues.


    The `AST` allows `Quick Fixes` associated with a recipe to understand the surrounding
    code e.g. when adding a new class into the code any import for that class will
    only be added to the source file once, and not for each replacement.


    Sensei was created to make it easy to build custom matching rules which may not
    exist, or which would be hard to configure, in other tools.


    Rather than amend a configuration file, all the configuration can be performed
    in the GUI. When creating new recipes the GUI makes it easy to see which code
    the recipe matches. When defining the `Quick Fixes` the before and after state
    of the code can be compared immediately. This makes it easier to create very contextual
    recipes i.e. unique to teams, or technology, and even individual programmers.


    ![](OEBPS/Image00007.jpg)


    I use Sensei in combination with other Static Analysis tools e.g. most Static
    Analysis tools will find issues, but not fix them. A common use case for Sensei
    is to replicate the other tool’s matching search in Sensei and expand it with
    a `Quick Fix`. This has the benefit that the custom fix applied already meets
    the coding standards for your project.


    I periodically find myself creating Sensei recipes that already exist in the IntelliJ
    Intensions set because the Intension report doesn’t quite match the context I’ve
    created or because the `QuickFix` provided by IntelliJ doesn’t match the code
    pattern I want to use.


    I augment the existing tools, rather than attempt to fully replace them.


    Sensei can also be very useful when you identify a contextual variant of a common
    rule e.g. if you are using an SQL library not supported by the Static Analysis
    tool, but the common SQL rules in the Static Analysis engine still apply, then
    you can create library-specific variants of those rules using Sensei.


    Sensei does not come out-of-the-box with a lot of generic recipes like the Static
    Analysis tools mentioned, its strength is in making it easy to create new recipes,
    complete with `Quick Fixes` configured to match your specific coding style and
    use-cases.


    *NOTE: we are working on a public repository of recipes [you can find it here](https://scw.buzz/30pkFN).*


    ### Summary


    I use all of the tools mentioned in combination:


    * IntelliJ Intentions helps flag common issues out the box, often with `QuickFix`.

    * SpotBugs finds simple bugs I might have missed and alerts me to performance
    issues.

    * SonarLint identifies Java features I was unaware of and alerts me to additional
    ways of modelling my code.

    * CheckStyle helps me conform to an agreed coding style that is also enforced
    during CI.

    * Sensei helps me create `Quick Fixes` to augment common scenarios found by Static
    Analysis and create specific project or technology recipes that can be hard to
    configure in another tool.


    ## Example Repositories


    We have created some example repositories on GitHub that you might find useful
    for learning Sensei.


    * [sensei-blog-examples](https://scw.buzz/3cixLrq)


    ### Blog Examples


    This project has example recipes and code to experiment with.


    * [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)


    **How to Use:**


    * [Install Sensei Plugin](https://scw.buzz/3rveXC).

    * Clone or download project.

    * Open in IDE.

    * Example Sensei recipes in `.sensei` will be loaded.

    * Read through Use Cases to see how recipes identify issues and fix code.


    *This is a Multi-module maven project. When you clone this project, or download
    it as a zip, remember to open the top level `pom.xml` as the project. The `.sensei`
    folder contains example recipes which support the examples and embedded `readme.md`
    files.*


    ### Public Cookbooks


    The Public Cookbooks repo is a list of all the public Sensei Cookbooks that we
    know of.


    * [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pkFN)

    * [securecodewarrior.github.io/public-cookbooks](https://scw.buzz/3btJZhV)


    Full instructions and documentation for the cookbooks should be in the listing
    for each cookbook. The cookbooks in the public listing are useful:


    * To use as cookbooks for the technology they cover.

    * For studying to see how to create recipes.

    * To understand the range of domains that Sensei recipes can be applied to.

    '
