    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\nWhen I activate it in IntelliJ with `alt+Enter` I see the context menu\
    \ which I can select to jump to the documentation.\n\n![](OEBPS/Image00054.jpg)\n\
    \n### Multiple Actions\n\nI might choose to have multiple Actions so that each\
    \ URL or tutorial has its own option in the `alt+enter` QuickFix pop-up menu.\n\
    \nFor example, for the `@Parameterized` annotation, I might want to link to the\
    \ official documentation and a set of online example code.\n\n*   https://junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests\n\
    \n*   https://github.com/eviltester/junitexamples/blob/master/src/test/java/parameterized/junit5/InitialExampleTest.java\n\
    \nI would simply create a recipe that searches for the annotation:\n\n```\n search:\n\
    \  annotation:\n    owner:\n      method: {}\n    type: \"org.junit.jupiter.params.ParameterizedTest\"\
    \n```\n\nAnd links off to the sites I identified as being useful:\n\n```\n availableFixes:\n\
    - name: \"JUnit Annotations (learn)\"\n  actions:\n  - goto:\n      type: \"URL\"\
    \n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n- name: \"What is a JUnit Test? (learn)\"\n  actions:\n  - goto:\n      type:\
    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\nBoth links would then appear in the pop-up dialog.\n\n![](OEBPS/Image00055.jpg)\n\
    \n### Who would benefit?\n\nI would have found this useful when using and learning\
    \ libraries, especially when leading teams and helping them adopt a new library.\n\
    \nThis could also benefit teams creating libraries by creating a standard set\
    \ of documentation recipes to help guide people through the adoption of the library\
    \ or new features in the library.\n\nThis would be especially useful if the code\
    \ maintenance and documentation maintenance are performed by different teams.\n\
    \n# Guice Use-cases\n\nEvery new technology adds risk to a project. Dependency\
    \ Injection can save time when coding and adds additional flexibility around configuration,\
    \ but there is always the risk that we forget to wire something up, or inject\
    \ the wrong thing.\n\nThe use-case in this section explores ways in which Sensei\
    \ can help.\n\n## How to catch and fix a dependency injection issue using Sensei\n\
    \nThe Sensei project itself has its own set of recipes that have built up over\
    \ time, this is an example of one of the scenarios the Sensei team built a recipe\
    \ to cover. A misconfiguration of Guice, which led to a `NullPointerException`\
    \ being reported at runtime during our testing.\n\nThis could be generalised to\
    \ many Dependency Injection scenarios where code is syntactically correct, but\
    \ because the wiring configuration was incorrect, an error slips through.\n\n\
    This often happens when we are learning the technology, and we keep making the\
    \ simple mistake of forgetting to wire things up. But this also happens to experienced\
    \ professionals because, well… we all make mistakes, and we may not have Unit\
    \ Tests to cover everything.\n\n### RunTime Exceptions from Incorrect Dependency\
    \ Injection Wiring\n\nThe code below fails at runtime with a `NullPointerException`\
    \ .\n\n```\n Injector injector = Guice.createInjector(new SystemOutModule());\n\
    CountReporter reporter = injector.getInstance(CountReporter.class);\n\nString\
    \ [] lines5 = {\"1: line\", \"2: line\", \"3: line\", \"4: line\", \"5: line\"\
    };\n\nreporter.reportThisMany(Arrays.asList(lines5));\nAssertions.assertEquals(5,\
    \ reporter.getCount());\n```\n\nThe code is syntactically correct but fails because\
    \ we missed out a `requestStaticInjection` in our `SystemOutModule` configuration.\n\
    \n```\n public class SystemOutModule extends AbstractModule {\n\n    @Override\n\
    \    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
    \    }\n}\n```\n\nWhen we try to use the `reporter` , created using the `Injector`\
    \ , it is not fully instantiated and we receive a `NullPointerException` when\
    \ we call `reportThisMany` .\n\nWe may well have missed that in our code review\
    \ or we didn’t have unit tests that triggered the dependency injection, and it\
    \ slipped out into our build.\n\n### Warning Signs\n\nIn this case there is a\
    \ warning sign, the `CountReporter` has a static field annotated with `@Inject`\
    \ but… the `CountReporter` class itself is `package private` . In a complicated\
    \ code base this could be a warning sign that it isn’t used because the Module\
    \ class configuring the bindings needs to be in the same package for this to work.\n\
    \n```\n class CountReporter {\n\n    @Inject\n    private static ILineReporter\
    \ reporter;\n```\n\nAnother error that we made, which we might have picked up\
    \ in a code review, is that we forgot to actually bind the fields in the `SystemOutModule`\
    \ `configure` method.\n\n```\n binder().requestStaticInjection(CountReporter.class);\n\
    ```\n\nHad we written the `requestStaticInjection` code then the Syntax Error\
    \ generated when trying to use the `CountReporter` would have alerted us to the\
    \ simple error.\n\n```\n > 'reporters.CountReporter' is not public in 'reporters'.\n\
    \  Cannot be accessed from outside package\n```\n\nSadly we forgot, and there\
    \ were no syntactic warning signs in the code.\n\n### How could Sensei help?\n\
    \nWe probably wouldn’t use Sensei to pick up the missing `requestStaticInjection`\
    \ , since all our Guice configuration wiring would need to use that method and\
    \ we can’t guarantee that all wiring is going to be as simple as this use-case.\n\
    \nWe could write a Sensei rule to look for some warning signs that our code is\
    \ not up to scratch.\n\nIn this case that would mean:\n\n*   Find any classes\
    \ with `@Inject` annotated fields\n\n*   Where the classes are not public.\n\n\
    The above was the warning sign that they were unlikely to have been wired up.\n\
    \nBy creating a recipe, we get an early warning sign during the coding and can\
    \ therefore reduce the reliance on our pull requests or resolving our tech debt\
    \ to allow us to add Unit Tests.\n\n### How to create a recipe?\n\nThe task I\
    \ want to complete is:\n\n*   Create a recipe that matches fields annotated with\
    \ `@Inject` which are in `protected private` classes\n\nThat should hopefully\
    \ give us enough warning to identify any Modules using it and add the missing\
    \ wiring code.\n\nIn my `CountReporter` class, I will use `Alt+Enter` to `Create\
    \ a new Recipe` and I will `start from scratch`\n\nI will name this and add a\
    \ description:\n\n```\n Name: Guice: Injected Field Not Public\nDescription: If\
    \ the Injected field is not public then the code might not be wired up\nLevel:\
    \ Warning\n```\n\nThe search I write looks for a field with the `Inject` annotation\
    \ which has not been scoped as `public` .\n\n```\n search:\n  field:\n    with:\n\
    \      annotation:\n        type: \"com.google.inject.Inject\"\n    in:\n    \
    \  class:\n        without:\n          modifier: \"public\"\n```\n\n![](OEBPS/Image00056.jpg)\n\
    \n### Fix"
