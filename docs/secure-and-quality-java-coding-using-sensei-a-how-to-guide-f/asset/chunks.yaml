    \n![](OEBPS/Image00029.jpg)\n\nI could right-click here to fix the problem via\
    \ the Problems tab.\n\n![](OEBPS/Image00030.jpg)\n\n## Triggering a Quick Fix\n\
    \nThere are many ways to trigger a QuickFix.\n\n### Using Problems Tab\n\nIn the\
    \ Problems Tab.\n\nRight-click on the reported problem and choose “Show Quick\
    \ Fixes”\n\n![](OEBPS/Image00031.jpg)\n\nThen choose the Quick Fix from the list.\n\
    \n![](OEBPS/Image00032.jpg)\n\n### Contextual `alt+enter`\n\nThe most common way\
    \ to fix code is with an `alt+enter` where we will see any Intellij suggestions\
    \ and Sensei Quick Fixes.\n\n![](OEBPS/Image00033.jpg)\n\nAnd if I choose the\
    \ action then the code will be amended.\n\n### Fixing Multiple Actions\n\nIf there\
    \ were multiple occurrences in the file then I could fix them all at once.\n\n\
    Pressing `alt+enter` and navigating to the next menu level down on the QuickFix,\
    \ we find the option to fix all problems in the current source file.\n\n![](OEBPS/Image00034.jpg)\n\
    \n# Section - Use-Cases\n\nSensei can help improve the writing of Quality Code,\
    \ regardless of the underlying domain or technology.\n\nThis section is split\
    \ into sub-sections categorised by technology to help demonstrate:\n\n*   Some\
    \ features of Sensei.\n\n*   How those features can be applied.\n\nThe technology\
    \ examples have been kept as small as possible to illustrate the interaction with\
    \ the technology, but still keep the learning curve small. That way, even if you\
    \ don’t know the technology you should still be able to follow along.\n\nThe descriptions\
    \ here have full code examples in the Github repo:\n\n*   [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
    \nLinks or descriptions of the specific code to look at will be contained in the\
    \ use-case description.\n\n# POJO Use-Cases\n\nThe use-cases which follow use\
    \ plain old Java.\n\nNo external dependencies are required so they are a good\
    \ introduction to the basic functionality of Sensei.\n\n## Converting System.out.println\
    \ to logger\n\nWhen writing the code below I made a bunch of mistakes:\n\n```\n\
    \ private String getCountdownString() {\n\n        String output = \"\";\n   \
    \     String prefix=\"\";\n\n        for(int countdown = 10; countdown > 0; countdown--\
    \ ){\n\n            output = output + prefix + countdown;\n\n            System.out.println(output);\n\
    \n            prefix=\", \";\n        }\n\n        System.out.println(output);\n\
    \n        return output;\n    }\n```\n\nInitially, I had `countdown++` and the\
    \ loop didn’t finish.\n\nAnd I used `countdown > 1` , so I didn’t get the output\
    \ I wanted.\n\nIn the end, I littered my code with `System.out.println` to help\
    \ me debug.\n\nThen I realised, I really need to learn how to use a logger.\n\n\
    ### Research\n\nFortunately, I read through the [Sensei documentation](https://scw.buzz/3emSI7l)\
    \ and decided to use the “Getting Started” guide to help me create a recipe to\
    \ convert from `System.out.println` and encourage me to use a logger:\n\n*   `java.util.logging.Logger`\n\
    \n### Creating a Recipe\n\nThe first thing I do is click on the `println` then\
    \ `alt+enter` to create a new recipe.\n\n![](OEBPS/Image00035.jpg)\n\nI create\
    \ it with the following details:\n\n```\n Name: Logger: use logger instead of\
    \ println\nDescription: use logger instead of println - remember stop using System.out.println\n\
    Level: Error\n```\n\nAnd I’ll start by matching a `methodcall` with the name `println`\n\
    \n```\n search:\n  methodcall:\n    name: \"println\"\n```\n\nAnd the preview\
    \ shows me all the matches in my code.\n\n![](OEBPS/Image00036.jpg)\n\nI can see\
    \ that all the matches in my code are for `System.out.println` but I don’t trust\
    \ that long term this will be the only match. I want to match a more qualified\
    \ statement I want to change.\n\nI expand the matcher to search for a `methodcall`\
    \ on a `field` named `out` in the class `System` .\n\n```\n search:\n  methodcall:\n\
    \    name: \"println\"\n    \"on\":\n      field:\n        in:\n          class:\n\
    \            name: \"System\"\n        name: \"out\"\n```\n\nI could, if I wanted,\
    \ fully qualify the `System` name to `java.lang.System`\n\n![](OEBPS/Image00037.jpg)\n\
    \n### Amending the Code to log\n\nNext, I want to create the QuickFix.\n\nFirst\
    \ I want to amend the line of code that logs the output:\n\n```\n availableFixes:\n\
    - name: \"use Logger\"\n  actions:\n  - rewrite:\n      to: \"logger.log(Level.INFO,\
    \ {{{ arguments.0 }}})\"\n```\n\nI don’t have to remember the mustache format.\
    \ I used the `Show Variables` in the GUI to show me the argument and double-clicked\
    \ on it. Then the GUI filled in the appropriate matching mustache template.\n\n\
    ![](OEBPS/Image00038.jpg)\n\nWhen I try it out, I can see that I still have to\
    \ `alt+enter` to import the `Level` enum. But if I amend my QuickFix to have a\
    \ fully qualified item then Sensei will add the import for me e.g.\n\n*   It will\
    \ replace `System.out.println(output);` with\n\n```\n logger.log(Level.INFO, output);\n\
    ```\n\n*   And add an import for the enum:\n\n```\n import java.util.logging.Level;\n\
    ```\n\n*   If I rewrite to:\n\n```\n logger.log(java.util.logging.Level.INFO,\
    \ {{{ arguments.0 }}})\n```\n\nAnd this will work, but I will still have to remember\
    \ the syntax to instantiate the logger in the first place.\n\n![](OEBPS/Image00039.jpg)\n\
    \n### Amending the code to add the logger field\n\nI can amend my QuickFix to\
    \ create the `logger` field for me as well.\n\nI will code the `logger` first,\
    \ and then add that to my recipe so I never have to code it again.\n\n```\n Logger\
    \ logger2 = Logger.getLogger(SysOutTest.class.getName());\n```\n\nI tend to write\
    \ the code first because then I can use IntelliJ code completion and syntax checking\
    \ to make sure I get it right. As a side-effect, it will then be in the code preview\
    \ when I edit the recipe to add the QuickFix lines that will create that code.\n\
    \nAnd when I write the code, I want to use a different field name (here I’m using\
    \ `logger2` ) because Sensei is clever enough not to add a duplicate field, so\
    \ I have to fool it by using a different name.\n\nSo I’ll amend the recipe to\
    \ create this code by adding a field called logger.\n\n```\n availableFixes:\n\
    - name: \"use Logger\"\n  actions:\n  - rewrite:\n      to: \"logger.log(java.util.logging.Level.INFO,\
    \ {{{ arguments.0 }}})\"\n  - addField:\n      field: \"java.util.logging.Logger\
    \ logger = Logger.getLogger({{{ containingClass.name\\\n        \\ }}}.class.getName())\"\
    \n      target: \"parentClass\"\n```"
