  trans: "\n注意，我将 `SysOutTest` 修改为了 mustache 变量，这样它就能获取我在此配方中所使用的任何类名。同样，由于我不记得 mustache\
    \ 的语法，我使用了 GUI 命令 `show variables` 来找到我需要的替换内容。\n\n而且通过将 `Logger` 全限定限定为 `java.util.logging.Logger`，Sensei\
    \ 将添加导入项并编写我想要的代码行，即：\n\n```\n Logger logger = Logger.getLogger(SysOutTest.class.getName());\n\
    ```\n\n![](img/Image00040.jpg)\n\n这个配方的一个有用之处是，因为它只会添加一次 logger 字段，因此我可以将其应用于任何使用过\
    \ `System.out.println` 的现有代码中，并使用 Sensei 更改我代码中所有出现的地方。\n\n![](img/Image00041.jpg)\n\
    \n## 下一步骤\n\n一旦我习惯了这一点，我最终将训练自己不再使用 `System.out.println`。\n\n我还可以创建一个第二个配方来帮助我创建\
    \ logger，从而利用 Sensei 帮助我主动编写代码。\n\n例如：我可以匹配一个没有名为 `logger` 字段的类，并添加一个。\n\n我创建了一个级别为\
    \ `Information` 的配方：\n\n```\n Name: Logger: add logger\nDescription: Add logger\
    \ to class\nLevel: Information\n```\n\n匹配不带 logger 字段的类：\n\n```\n search:\n  class:\n\
    \    without:\n      child:\n        field:\n          name: \"logger\"\n```\n\
    \n然后我将复用之前之前看到的 QuickFix 的部分：\n\n```\n availableFixes:\n  - name: \"Add Logger\"\
    \n    actions:\n      - addField:\n          field: \"java.util.logging.Logger\
    \ logger = Logger.getLogger({{{ containingClass.name\\\n        \\ }}}.class.getName())\"\
    \n          target: \"self\"\n```\n\n注意这里 `target` 与第一个 QuickFix 相比的区别。这里使用 `self`\
    \ 是因为我们的搜索匹配了类。第一个 QuickFix 使用 `parentClass` 是因为我们匹配的是类内部的代码。*\n\n## 总结\n\n这代表了使用\
    \ Sensei 帮助提高个人编程技能的关键流程之一：\n\n* 创建一个配方来帮助实现即时的“最佳实践”。\n* 一旦你知道如何使用该最佳实践……就创建一个配方来加速你的工作流。\n\
    \n## 代码链接\n\n在 Github 仓库中：\n\n* https://github.com/SecureCodeWarrior/sensei-blog-examples\n\
    * module: `pojoexamples`\n\n* `src\\test\\java\\logging`\n\n`AddLoggerTest.java`\
    \ 包含一些应用配方的指令。\n\n`SysOutTest.java` 是一个你可以尝试的类示例。\n\n## 观看 Sensei 演示\n\n![](https://www.youtube.com/watch?v=qPlNm0yaSto)\n\
    \n[youtu.be/qPlNm0yaSto](https://youtu.be/qPlNm0yaSto)\n\n# Junit 5 用例\n\n[JUnit\
    \ 5](https://junit.org/junit5/) 是一个流行的 Java 单元测试框架。\n\n接下来的用例都使用 JUnit 5 作为实现，但基本概念可以通过对配方进行细微修改，以应用于\
    \ JUnit 4 或其他单元测试框架。\n\n## 添加注解和重命名方法\n\n*使用 Sensei 改进个人编程流程*\n\n对于这一部分，我重现了学习\
    \ JUnit 时使用的一种“糟糕”的编码方法，并将演示如何使用 Sensei 将这种“糟糕”模式转换为公认的且“更好”的编码模式。\n\n当我学习 JUnit\
    \ 时，我脑中一次次能记住的信息非常有限。我经常忘记在测试不起作用时如何跳过它们。\n\n如果我们是在团队中工作，可以使用拉取请求（pull requests）的代码审查来帮助强制执行编码风格。与经验丰富的程序员进行结对编程时，我们还可以缩短反馈周期。\n\
    \n我们还可以通过工具增强我们的流程，让工具提示我们做正确的事。Thoughtworks 在其[针对 Sensei 的技术雷达列表](https://www.thoughtworks.com/radar/tools/sensei)\
    \ 中将其描述为：\n\n> “让做正确的事变得简单，比应用类似清单的治理规则和程序更容易”\n\n### 禁用 JUnit 测试\n\n理想情况下，正如大家所知，我应该使用\
    \ `@Disabled` 注解并写成：\n\n```\n @Disabled\n    @Test\n    void canWeAddTwoNumbers(){\n\
    \        Assertions.fail(\"this test was skipped and should not run\");\n    }\n\
    ```\n\n但在学习期间，我不得不训练自己使用 `@Disabled`。\n\n当我忘记如何禁用测试方法时，我会删除 `@Test` 注解并重命名测试：\n\
    \n```\n class SkipThisTest {\n\n    void SKIPTHIScanWeAddTwoNumbers(){\n     \
    \   Assertions.fail(\"this test was skipped and should not run\");\n    }   \n\
    }\n```\n\n这并不好，但完成了任务。我当时没有像 Sensei 这样的工具来帮助我记忆，所以我陷入了使用糟糕编码模式中。\n\n我为此 readme\
    \ 采取的任务是：\n\n* 创建一条规则，通过重命名方法来找到被“跳过”或“禁用”的方法。\n* 创建一个 QuickFix 来重命名方法并同时添加 `@Test`\
    \ 和 `@Disabled` 注解。\n\n### 配方设置\n\n我使用 Sensei 的第一步是“打开设置”。\n\n```\n Name: open\
    \ Sensei\n```\n\n为了匹配方法，我在配方中使用了以下内容：\n```\n search:\n  method:\n    name:\n \
    \     matches: \".*.*\"\n```\n\n![](img/Image00043.jpg)\n\n### QuickFix 设置\n\n\
    QuickFix 稍微复杂一些，因为它将重写代码，我将使用 `sed`。\n\n我想做：\n\n* 为方法添加 `@Test` 注解。\n* 为方法添加 `@Disabled`\
    \ 注解。\n* 修改方法名。\n\n使用 `addAnnotation` 添加注解非常简单。如果我为注解使用全限定名，Sensei 将自动添加导入项。\n\
    \n```\n availableFixes:\n  - name: \"Add @Disabled and @Test\"\n    actions:\n\
    \      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Test\"\
    \n      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Disabled\"\
    \n```\n\n![](img/Image00044.jpg)\n\n`sed` 的实现要求当参数包含逗号时，必须用 `{{#encodeString}}`\
    \ 和 `{{/encodeString}}` 裹起来——例如 `{{#encodeString}}{{{.}}}{{{/encodeString}}`。\n\
    \n### 反向配方\n\n由于这是一个示例，而且我们可能在演示中使用它，我想探索如何使用 Sensei 配方来撤销上述更改。\n\n经过思考，我想在执行演示的\
    \ `SkipThisTest` 类中找到带有 `@Disabled` 注解的方法：\n\n```\n Name: JUnit: demo in SkipThisTest\
    \ remove @Disabled and revert to SKIPTHIS\nShort Description: 为了项目演示目的移除 @Disabled\
    \ 并恢复为 SKIPTHIS\nLevel: warning\n```\n\n配方设置搜索非常简单，匹配特定类中的注解。\n\n```\n search:\n\
    \  method:\n    annotation:\n      type: \"Disabled\"\n    in:\n      class:\n\
    \        name: \"SkipThisTest\"\n```\n\n对于 Quick fix，由于我们已经匹配了方法，我们使用重写动作并使用变量填充模板。\n\
    \n"
- fmt: "\n```\n availableFixes:\n- name: \"Remove Disabled and rename to SKIPTHIS...\"\
    \n  actions:\n  - rewrite:\n      to: \"{{{ returnTypeElement }}} SKIPTHIS{{{\
    \ nameIdentifier }}}{{{ parameterList\\\n        \\ }}}{{{ body }}}\"\n```\n\n\
    I basically add every variable except the modifier (since I want to get rid of\
    \ the annotations) and add the `SKIPTHIS` text into the template.\n\nThis fix\
    \ has the weakness that by removing the modifiers, I remove any other annotations\
    \ as well.\n\n### Add another Action\n\nI can add another named fix, to give me\
    \ a choice when the `alt+enter` is used to display the `QuickFix`.\n\n```\n availableFixes:\n\
    - name: \"Remove Disabled and rename to SKIPTHIS...\"\n  actions:\n  - rewrite:\n\
    \      to: \"{{{ returnTypeElement }}} SKIPTHIS{{{ nameIdentifier }}}{{{ parameterList\\\
    \n        \\ }}}{{{ body }}}\"\n      target: \"self\"\n- name: \"Remove Disabled,\
    \ keep other annotations, and rename to SKIPTHIS...\"\n  actions:\n  - rewrite:\n\
    \      to: \"{{#sed}}s/(@Disabled\\n.*@Test)//,{{{ modifierList }}}{{/sed}}\\\
    n\\\n        {{{ returnTypeElement }}} SKIPTHIS{{{ nameIdentifier }}}{{{ parameterList\\\
    \n        \\ }}}{{{ body }}}\"\n      target: \"self\"\n```\n\nHere, I added an\
    \ additional line in the new Quick Fix.\n\n```\n {{#sed}}s/(@Disabled\\n.*@Test)//,{{{\
    \ modifierList }}}{{/sed}}\n```\n\nThis takes the modifier list, encodes it as\
    \ a string, then uses `sed` to remove the line with `@Disabled` from the string,\
    \ but leaves all other lines in the modifier, i.e. it leaves all other annotations\
    \ alone.\n\nNOTE: Remember to add the “,” in the `sed`, otherwise you will see\
    \ a comment added to your preview because this is how Sensei alerts you to syntax\
    \ errors in the `sed` command.\n\n### Nested `sed` calls\n\nI was lucky that I\
    \ could match both the `@Disabled` and `@Test` in a single search and replace.\n\
    \nIn the event that the code is more complicated and I wanted to have a sequence\
    \ of `sed` commands then I can do that by nesting them:\n\n```\n {{#sed}}s/@Test//,{{#sed}}s/@Disabled\\\
    n//,{{{ modifierList }}}{{/sed}}{{/sed}}\n```\n\nIn the above example, I apply\
    \ the `@Test` replacement to the results of applying the `@Disabled` replacement\
    \ on the `{{{ modifierList }}}`.\n\n### Summary\n\n`sed` is a very flexible way\
    \ to achieve code rewriting and it is possible to nest the `sed` function calls\
    \ for complicated rewrite conditions.\n\nRecipes like this often end up being\
    \ temporary because we are using them to improve our programming process, and\
    \ once we have built up the muscle memory and no longer use the poor programming\
    \ pattern we can remove or disable them in the Cookbook.\n\nNOTE: Rather than\
    \ add two available fixes, I could clone the recipe, but if I do, then I have\
    \ to remember to uncheck the “Add disable entry for cloned recipe” checkbox, otherwise\
    \ only the cloned recipe will be available for use.\n\n## Adding Parameters to\
    \ Annotations Using Rewrite Actions\n\nIn this example, we will:\n\n* Demonstrate\
    \ searching and matching annotations.\n* Amend annotations using mustache templates.\n\
    \nSensei provides the ability to match problematic code patterns and then amend\
    \ them to agreed implementations. In this example, I am using `@Disabled` without\
    \ a parameter as the problematic code pattern.\n\n### See This In Action on YouTube\n\
    \n[![](OEBPS/Image00045.jpg)](https://www.youtube.com/watch?v=mjXGliXJ7M8)\n\n\
    [youtu.be/mjXGliXJ7M8](https://youtu.be/mjXGliXJ7M8)\n\n### Disabled Test Annotation\n\
    \nDisabled tests without a specified reason can prove problematic over the long\
    \ term because we forget why we disabled them.\n\n```\n @Disabled\nvoid thisTestMethodHasNoDisabledReason(){\n\
    \    Assertions.fail(\"This test is disabled and should not run\");\n}\n```\n\n\
    The risk is that, over time, the code base moves on, the disabled test is not\
    \ updated in step with the purpose of the code and eventually becomes redundant\
    \ and irrelevant, and potentially never re-enabled.\n\nDuring code reviews, we\
    \ will often point out that it is a good idea to add an explanatory description\
    \ as the annotation parameter.\n\n```\n @Disabled(\"Disabled to demonstrate adding\
    \ a reason\")\nvoid thisTestMethodHasDisabledReason(){\n    Assertions.fail(\"\
    This test is disabled and should not run\");\n}\n```\n\n### A Sensei Recipe\n\n\
    We can write a recipe to detect when `@Disabled` is added without explanation\
    \ and a Quick Fix that reminds us to add the actual reason explaining why we disabled\
    \ it.\n\nWhen I think about what I’m going to do, I have to:\n\n* Match the `Disabled`\
    \ annotation without any parameters.\n* Change the `Disabled` annotation to have\
    \ a parameter with marker text “TODO: add a description here”.\n\n### Create a\
    \ Warning Recipe\n\nI use `Alt+Enter` to Create a new Recipe.\n\n![](OEBPS/Image00046.jpg)\n\
    \nThen add the basic descriptive text in the general information.\n\n![](OEBPS/Image00047.gif)\n\
    \nGeneral:\n\n```\n name: remember to add disabled description\nshort description:\
    \ @Disabled should really have a description explaining why\nLevel: Warning\n\
    ```\n\nBy making the rule a warning, any matching code is highlighted but not\
    \ shown as a glaring error.\n\n![](OEBPS/Image00048.jpg)\n\n### Find the Annotation\n\
    \nIn the recipe editor, I search to match an annotation.\n\nThis will highlight\
    \ the annotations.\n\n![](OEBPS/Image0049.jpg)\n\ni.e. Search:\n\n```\n search:\n\
    \  annotation:\n    type: \"org.jupiter.api.Disabled\"\n    without:\n      parameters:\n\
    \      - {}\n```\n\n### Create a Rewrite Quick Fix\n\nFor my QuickFix I will use\
    \ rewrite action.\n\nI use the `Show Variables` functionality to show me the variables.\n\
    \n![](OEBPS/Image0051.jpg)\n\nAnd then I add the extra code needed to create place\
    \ comment.\n\n![](OEBPS/Image0052.jpg)\n\ni.e. QuickFix:\n\n```\n availableFixes:\n\
    - name: \"Add a todo comment\"\n  actions:\n  - rewrite:\n      to: \"{{{ }}}(\\\
    \"TODO: add a description here\\\")\n      target: \"self\"\n```\n\n### Summary\n\
    \nWhen building a rewrite Quick Fix, it is easier when we can search for the `self`\
    \ entity we can act on.\n\nIn this example, I used a rewrite action to amend the\
    \ Annotation. Rewrite is a general-purpose action that can apply to any code element\
    \ and is a good default to explore.\n\n## Documentation Links\n\nOne of the difficulties\
    \ with learning a new library, or sharing agreed practices across our team is\
    \ documenting and creating examples.\n\nVery often we create example projects,\
    \ but we don’t have them open when working with actual code.\n\nI’ve often thought\
    \ it would be great to have the ability to link to our examples or online examples\
    \ and be able to go to a URL for more explanation when needed.\n\nWith Java, we\
    \ have JavaDoc comments, which can have a `see` annotation:\n\n```java\n /**\n\
    \ * @see <a href=\"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    >Junit 5 Annotation docs</a>\n */\n```\n\nJavaDoc like this in 3rd party libraries\
    \ is a great help because we can use the `Quick Documentation` functionality in\
    \ IntelliJ to have access to more detailed.\n\n![](OEBPS/Image0053.jpg)\n\nBut,\
    \ we all know that comments don’t get updated as often as code, and web presence\
    \ maintenance is often disconnected from library maintenance and sometimes performed\
    \ by a different team entirely.\n\n### How Sensei Helps\n\nSensei provides the\
    \ ability to match on library annotations and methods to provide links to long-form\
    \ documentation on a wiki or third-party tutorial site.\n\nAs an example, I’m\
    \ using the `@Test` annotation from JUnit.\n\nThe JavaDoc is very detailed, and\
    \ the `Quick Documentation` view explains how to use the annotation.\n"
