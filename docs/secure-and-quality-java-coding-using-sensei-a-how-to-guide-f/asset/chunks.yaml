    规则可以开启或关闭，并可以选择用于在 IDE 中高亮它的错误级别。


    ![](img/Image00002.jpg)


    有很多优秀的 IntelliJ 检查（Inspections）。我知道这一点是因为我在写这些内容时通读了它们。我将 IntelliJ 检查作为默认设置且没有进行配置，但为了充分利用这些检查的价值，你应该通读它们，识别出与你的编码风格相关的项，并配置警告级别，以便在代码中注意到它们。


    IntelliJ 检查的伟大之处在于它们随 IDE 免费提供，并且可以帮助建立以下肌肉记忆：


    * 在编写代码时注意到源码中的警告和错误。

    * 将鼠标悬停在被标记的代码上以学习规则违规情况。

    * 使用 `alt+enter` 为问题应用 `QuickFix`。


    ![](img/Image00003.jpg)


    ### SpotBugs


    [SpotBugs](https://plugins.jetbrains.com/plugin/14014-spotbugs) IntelliJ 插件使用静态分析来尝试提醒你代码中的
    bug。


    可以从 IntelliJ 偏好设置（Preferences）配置 SpotBugs 来扫描你的代码。实际使用的规则可以在 `Detector` 标签页中找到。


    ![](img/Image00004.jpg)


    我倾向于在编写并审查代码后使用 SpotBugs。我会运行 `Analyze Project Files Including Test Sources`。


    ![](img/Image00005.jpg)


    这确实帮助我识别 bug、死代码以及明显的优化点。它还迫使我研究一些被标记的违规项，帮助我决定如何处理。


    SpotBugs 会发现问题，但没有提供任何尝试解决问题的 `QuickFix` 动作。


    SpotBugs 很容易配置，我发现它是我在 IDE 中咨询的非常有用的客观第二意见。


    ### SonarLint


    [SonarLint](https://plugins.jetbrains.com/plugin/7973-sonarlint) 插件。


    可以从 IntelliJ 偏好设置配置 SonarLint，以选择代码针对哪些规则进行验证。


    ![](img/Image00006.jpg)


    默认情况下，SonarLint 实时运行，并显示你正在编辑当前代码的问题。


    SonarLint 不提供快速修复（quick fixes），但与违规报告相关的文档通常是清晰且记录良好的。


    我发现 SonarLint 在过去非常有用，它能提醒我在较新版本的 Java 中才熟悉的 Java 特性。


    ### CheckStyle


    [CheckStyle](https://plugins.jetbrains.com/plugin/1065-checkstyle-idea) 插件提供了格式和代码质量规则的混合。


    CheckStyle 插件内置了 `Sun Checks` 和 `Google Checks`。


    这些定义可以很容易[在线找到](https://checkstyle.sourceforge.io/style_configs.html)。


    当一个项目花费时间创建了自己的规则集时，CheckStyle 增加的价值最大。此时，可以配置 IDE 插件来使用该规则集，程序员可以在提交代码到 CI 之前进行扫描。


    CheckStyle 经常用作 CI 过程的构建失败插件，当 CheckStyle 违规数量超过阈值时。


    ### Sensei


    [Sensei](https://scw.buzz/38n5uPu) 使用基于抽象语法树 (`AST`) 的静态分析来匹配代码并创建 `Quick Fixes`，这允许对有问题的代码进行特定的识别。


    `AST` 允许与配方（recipe）相关的 `Quick Fixes` 理解周围的代码，例如，当在代码中添加新类时，该类的任何 import 仅会被添加到源文件中一次，而不是每次替换都添加一次。


    Sensei 的创建是为了方便构建自定义匹配规则，这些规则在其他工具中可能不存在，或者很难配置。


    与其修改配置文件，所有配置都可以在 GUI 中完成。在创建新配方时，GUI 可以让你轻松看到该配方匹配哪些代码。在定义 `Quick Fixes` 时，可以立即比较代码的修改前之后的状态。这使得创建非常有上下文的配方变得更容易，即针对特定团队、技术甚至是个人程序员的配方。


    ![](img/Image00007.jpg)


    我将 Sensei 与其他静态分析工具结合使用，例如大多数静态分析工具会发现问题但不修复它们。Sensei 的常见用例是在 Sensei 中复制其他工具的匹配搜索，并用
    `Quick Fix` 将其扩展。这样做的好处是，所应用的自定义修复已经符合你项目的编码标准。


    我经常发现自己创建了已经在 IntelliJ 意图（Intensions）集中存在的 Sensei 配方，因为意图报告并不完全符合我创建的上下文，或者因为
    IntelliJ 提供的 `QuickFix` 不匹配我想要使用的代码模式。


    我是在增强现有的工具，而不是尝试完全取代它们。


    当你识别出常用规则的上下文变体时，Sensei 也非常有用，例如，如果你在使用一个静态分析工具不支持的 SQL 库，但静态分析引擎中的常用 SQL 规则仍然适用，那么你可以使用
    Sensei 创建这些规则的特定库变体。


    Sensei 并不是开箱即用提供像上述静态分析工具那样的通用配方，它的优势在于可以轻松创建新配方，并带有配置好以匹配你特定编码风格和用例的 `Quick Fixes`。


    *注意：我们正在维护一个公共配方仓库，[你可以在这里找到](https://scw.buzz/30pkFN)。


    ### 总结


    我结合使用所有提到的工具：


    * IntelliJ 意图帮助开箱发现常见问题，通常带有 `QuickFix`。

    * SpotBugs 发现我可能错过的 bug 并提醒我性能问题。

    * SonarLint 识别我未知的 Java 特性，并提醒我建模代码的其他方式。

    * CheckStyle 帮助我符合约定的编码风格，该风格在 CI 期间执行。

    * Sensei 帮助我创建针对静态分析发现的常见场景的 `Quick Fix`，并创建难以配置的特定项目或技术配方。


    ## 示例仓库


    我们在 GitHub 上创建了一些示例仓库，可能对学习 Sensei 有用。


    * [sensei-blog-examples](https://scw.buzz/3cixLrq)


    ### 博客示例


    该项目包含用于实验的示例配方的代码。


    * [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)


    **如何使用：**


    * [安装 Sensei 插件](https://scw.buzz/3rveXC)。

    * 克隆或项目。

    * 在 IDE 中打开。

    * 示例 Sensei 配方将被加载。

    * 阅读用例查看配方如何识别问题并修复代码。


    *这是一个多模块 Maven 项目。当你克隆此项目或下载为 zip 包时，请记住将顶层 `pom.xml` 作为项目打开。`.sensei` 文件夹包含支持示例和嵌入
    `readme.md` 文件的示例配方。*


    ### 公共配方


    公共配方仓库是我们知道的所有公共 Sensei 配方的列表。


    * [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pkFN)

    * [securecodewarrior.github.io/public-cookbooks](https://scw.buzz/3btJZhV)


    配方的完整说明和文档应该在每个配方的列表中。公共列表中的配方非常有用：


    * 可以作为它们所覆盖技术的配方使用。

    * 用于学习如何创建配方。

    * 理解 Sensei 配方可以应用的领域范围。

