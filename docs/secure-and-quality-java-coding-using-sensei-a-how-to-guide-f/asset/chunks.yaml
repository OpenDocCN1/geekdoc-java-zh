  trans: "\n\n```\n availableFixes:\n- name: \"Remove Disabled and rename to SKIPTHIS...\"\
    \n  actions:\n  - rewrite:\n      to: \"{{{ returnTypeElement }}} SKIPTHIS{{{\
    \ nameIdentifier }}}{{{ parameterList\\\n        \\ }}}{{{ body }}}\"\n```\n\n\
    我基本上添加了除了修饰符以外的所有变量（因为我想去掉这些注释），并在模板中添加了 `SKIPTHIS` 文本。\n\n这个修复方案的缺点是，通过移除修饰符，我也删除了所有其他注释。\n\
    \n### 添加另一个 Action\n\n我可以添加另一个具名的修复方案，这样当在使用 `alt+enter` 显示 `QuickFix` 时，我可以有一个选择。\n\
    \n```\n availableFixes:\n- name: \"Remove Disabled and rename to SKIPTHIS...\"\
    \n  actions:\n  - rewrite:\n      to: \"{{{ returnTypeElement }}} SKIPTHIS{{{\
    \ nameIdentifier }}}{{{ parameterList\\\n        \\ }}}{{{ body }}}\"\n      target:\
    \ \"self\"\n- name: \"Remove Disabled, keep other annotations, and rename to SKIPTHIS...\"\
    \n  actions:\n  - rewrite:\n      to: \"{{#sed}}s/(@Disabled\\n.*@Test)//,{{{\
    \ modifierList }}}{{/sed}}\\n\\\n        {{{ returnTypeElement }}} SKIPTHIS{{{\
    \ nameIdentifier }}}{{{ parameterList\\\n        \\ }}}{{{ body }}}\"\n      target:\
    \ \"self\"\n```\n\n在这里，我在新的 Quick Fix 中添加了额外的行。\n\n```\n {{#sed}}s/(@Disabled\\\
    n.*@Test)//,{{{ modifierList }}}{{/sed}}\n```\n\n这会获取修饰符列表，将其编码为字符串，然后使用 `sed`\
    \ 移除字符串中包含 `@Disabled` 的行，但保留修饰符中的所有其他行，即保留所有其他注释。\n\n注意：记得在 `sed` 中添加逗号“，”，否则你会在预览中看到被添加的注释，因为这是\
    \ Sensei 向你通警 `sed` 命令中语法错误的方式。\n\n### 嵌套 `sed` 调用\n\n我很幸运，我可以在一次搜索和替换中同时匹配 `@Disabled`\
    \ 和 `@Test`。\n\n如果代码更复杂，我想要执行一系列 `sed` 命令，那么我可以通过嵌套它们来实现：\n\n```\n {{#sed}}s/@Test//,{{#sed}}s/@Disabled\\\
    n//,{{{ modifierList }}}{{/sed}}{{/sed}}\n```\n\n在上面的示例中，我对先对 `{{{ modifierList\
    \ }}}` 应用 `@Disabled` 替换的结果再次应用 `@Test` 替换。\n\n### 总结\n\n`sed` 是一种实现代码重写的非常灵活的方法，并且可以为复杂的重写条件嵌套\
    \ `sed` 函数调用。\n\n像这样的食谱方通常是临时的，因为我们使用它们是为了改进编程流程，一旦我们建立了肌肉记忆并且不再使用那种糟糕的编程模式，我们就可以从\
    \ Cookbook 中删除或禁用它们。\n\n注意：与其添加两个可用修复，我可以复制配方，但如果这样做，我记得取消勾选“Add disable entry\
    \ for cloned recipe”（为克隆配方添加禁用项）复选框，否则只有克隆的配方可用。\n\n## 使用 Rewrite Actions 为注释添加参数\n\
    \n在这个示例中，我们将：\n\n* 演示搜索和匹配注释。\n* 使用 mustache 模板修改注释。\n\nSensei 提供了匹配问题代码模式并将其修改为约定实现的能力。在这个示例中，我使用不带参数的\
    \ `@Disabled` 作为问题代码模式。\n\n### 在 YouTube 上查看演示\n\n![](https://www.youtube.com/watch?v=mjXGliXJ7M8)\n\
    \n[youtu.be/mjXGliXJ7M8](https://youtu.be/mjXGliXJ7M8)\n\n### 禁用测试注释\n\n没有指定原因的禁用测试长期来看可能会产生问题，因为我们会忘记为什么要禁用它们。\n\
    \n```\n @Disabled\nvoid thisTestMethodHasNoDisabledReason(){\n    Assertions.fail(\"\
    This test is disabled and should not run\");\n}\n```\n\n风险在于，随着时间的推移，代码库发生了变化，禁用的测试不会随代码的目的同步更新，最终变得多余且无关，并且可能永远不会重新启用。\n\
    \n在代码审查期间，我们经常会指出作为注释参数添加解释性描述是一个好主意。\n\n```\n @Disabled(\"Disabled to demonstrate\
    \ adding a reason\")\nvoid thisTestMethodHasDisabledReason(){\n    Assertions.fail(\"\
    This test is disabled and should not run\");\n}\n```\n\n### 一个 Sensei 食谱\n\n我们可以编写一个食谱来检测何时在没有解释的情况下添加了\
    \ `@Disabled`，并编写一个 Quick Fix 提醒我们添加解释为什么要禁用的实际原因。\n\n当我思考要做什么时，我必须：\n\n* 匹配不带任何参数的\
    \ `Disabled` 注释。\n* 将 `Disabled` 注释更改为带有标记文本“TODO: add a description here”参数的注释。\n\
    \n### 创建警告食谱\n\n我使用 `Alt+Enter` 创建一个新的食谱。\n\n![](img/Image00046.jpg)\n\n然后在通用信息中添加基础描述性文本。\n\
    \n![](img/Image00047.gif)\n\n通用：\n\n```\n name: remember to add disabled description\n\
    short description: @Disabled should really have a description explaining why\n\
    Level: Warning\n```\n\n通过将规则设置为警告，任何匹配的代码都会被高亮，但不会显示为明显的错误。\n\n![](img/Image00048.jpg)\n\
    \n### 查找注释\n\n在食谱编辑器中，我搜索以匹配注释。\n\n这将高亮注释。\n\n![](img/Image0049.jpg)\n\n例如：\n\n\
    ```\n search:\n  annotation:\n    type: \"org.jupiter.api.Disabled\"\n    without:\n\
    \      parameters:\n      {}\n```\n\n### 创建重写修复方案\n\n对于我的 Quick Fix，我将使用 rewrite\
    \ action。\n\n我使用 `Show Variables` 功能来显示变量。\n\n![](img/Image0051.jpg)\n\n然后我添加创建注释所需的额外代码。\n\
    \n![](img/Image0052.jpg)\n\n例如 QuickFix：\n\n```\n availableFixes:\n- name: \"\
    Add a todo comment\"\n  actions:\n  - rewrite:\n      to: \"{{{ }}}(\\\"TODO:\
    \ add a description\\\")\n      target: \"self\"\n```\n\n### 总结\n\n构建写 Quick Fix\
    \ 时，如果我们可以操作 `self`实体将会更容易。\n\n在示例中，我使用 rewrite action 来修改注释。Rewrite 是一种通用的操作，适用于任何代码元素，并且是一个很好的探索方向。\n\
    \n## 文档链接\n\n学习新库或在团队中共享约定的实践的困难之一在于编写文档和创建示例。\n\n我们经常创建示例项目，但在处理实际代码时并没有打开它们。\n\
    \n我经常在想，如果能够链接到我们的示例或在线示例，并在需要时访问 URL 获取更多解释就太好了。\n\n在 Java 中，我们有 JavaDoc 注释，它可以包含一个\
    \ `see` 注解：\n\n```java\n /**\n * @see <a href=\"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    >Junit 5 Annotation docs</a>a>\n */\n```\n\n第三方库中的这种 JavaDoc 非常有帮助，因为我们可以使用 IntelliJ\
    \ 中的 `Quick Documentation` 功能来获取更详细的说明。\n\n![](img/Image0053.jpg)\n\n但是，我们都知道注释的更新频率往往不如代码，而且网页呈现的维护通常与库的维护脱节，有时甚至由完全不同的团队执行。\n\
    \n### Sensei 如何帮助\n\nSensei 提供了匹配库注释和方法的能力，从而提供指向 wiki 或第三方教程网站上长文档的链接。\n\n例如，我正在使用\
    \ JUnit 的 `@Test` 注释。\n\nJavaDoc 非常详细，`Quick Documentation` 视图解释了如何使用该注释。\n\n"
- fmt: "\nBut the official documentation on the website is often easier to read and\
    \ has more examples.\n\nWhen a team starts learning a library, having a set of\
    \ recommended tutorials can be very useful.\n\nSensei has a `goto` action that\
    \ can open a URL, allowing us to link to external sites and examples for documentation\
    \ that we, as a team, find useful.\n\n## Implementing the `goto` URL\n\nTo implement\
    \ this I would create a search that matches the `@Test` annotation from Junit.\n\
    \n```\n search:\n  annotation:\n    owner:\n      method: {}\n    type: \"org.junit.jupiter.api.Test\"\
    \n```\n\nAnd then I would add `goto` actions for each of the URLs I find useful.\n\
    \ne.g.\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\n\
    \n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\n\
    \nThe example below would create a single Action `JUnit Annotations (learn)` which\
    \ would open both URLs in a browser at the same time.\n\n```\n availableFixes:\n\
    - name: \"Learn about JUnit Annotations\"\n  actions:\n  - goto:\n      type:\
    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\nWhen I activate it in IntelliJ with `alt+Enter` I see the context menu\
    \ which I can select to jump to the documentation.\n\n![](OEBPS/Image00054.jpg)\n\
    \n## Multiple Actions\n\nI might choose to have multiple Actions so that each\
    \ URL or tutorial has its own option in the `alt+enter` QuickFix pop-up menu.\n\
    \nFor example, for the `@Parameterized` annotation, I might want to link to the\
    \ official documentation and a set of online example code.\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests\n\
    \n* https://github.com/eviltester/junitexamples/blob/master/src/test/java/parameterized/junit5/InitialExampleTest.java\n\
    \nI would simply create a recipe that searches for the annotation:\n\n```\n search:\n\
    \  annotation:\n    owner:\n      method: {}\n    type: \"org.junit.jupiter.params.ParameterizedTest\"\
    \n```\n\nAnd links off to the sites I identified as being useful:\n\n```\n availableFixes:\n\
    - name: \"JUnit Annotations (learn)\"\n  actions:\n  - goto:\n      type: \"URL\"\
    \n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    \n- name: \"What is a JUnit Test? (learn)\"\n  actions:\n  - goto:\n      type:\
    \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
    \n```\n\nBoth links would then appear in the pop-up dialog.\n\n![](OEBPS/Image00055.jpg)\n\
    \n## Who would benefit?\n\nI would have found this useful when using and learning\
    \ libraries, especially when leading teams and helping them adopt a new library.\n\
    \nThis could also benefit teams creating libraries by creating a standard set\
    \ of documentation recipes to help guide people through the adoption of the library\
    \ or new features in the library.\n\nThis would be especially useful if the code\
    \ maintenance and documentation maintenance are performed by different teams.\n\
    \n# Guice Use-cases\n\nEvery new technology adds risk to a project. Dependency\
    \ Injection can save time when coding and adds additional flexibility around configuration,\
    \ but there is always the risk that we forget to wire something up, or inject\
    \ the wrong thing.\n\nThe use-case in this section explores ways in which Sensei\
    \ can help.\n\n## How to catch and fix a dependency injection issue using Sensei\n\
    \nThe Sensei project itself has its own set of recipes that have built up over\
    \ time, this is an example of one of the scenarios the Sensei team built a recipe\
    \ to cover. A misconfiguration of Guice, which led to a `NullPointerException`\
    \ being reported at runtime during our testing.\n\nThis could be generalised to\
    \ many Dependency Injection scenarios where code is syntactically correct, but\
    \ because the wiring configuration was incorrect, an error slips through.\n\n\
    This often happens when we are learning the technology, and we keep making the\
    \ simple mistake of forgetting to wire things up. But this also happens to experienced\
    \ professionals because, well… we all make mistakes, and we may not have Unit\
    \ Tests to cover everything.\n\n### RunTime Exceptions from Incorrect Dependency\
    \ Injection Wiring\n\nThe code below fails at runtime with a `NullPointerException`.\n\
    \n```\n Injector injector = Guice.createInjector(new SystemOutModule());\nCountReporter\
    \ reporter = injector.getInstance(CountReporter.class);\n\nString [] lines5 =\
    \ {\"1: line\", \"2: line\", \"3: line\", \"4: line\", \"5: line\"};\n\nreporter.reportThisMany(Arrays.asList(lines5));\n\
    Assertions.assertEquals(5, reporter.getCount());\n```\n\nThe code is syntactically\
    \ correct but fails because we missed out a `requestStaticInjection` in our `SystemOutModule`\
    \ configuration.\n\n```\n public class SystemOutModule extends AbstractModule\
    \ {\n\n    @Override\n    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
    \    }\n}\n```\n\nWhen we try to use the `reporter` , I see the context menu.\n\
    \n### Warning Signs\n\nThe code is syntactically correct but fails because we\
    \ missed out a `requestStaticInjection` in our `SystemOutModule` configuration.\n\
    \nWhen we try to use the `reporter` , I see the context menu.\n\n### How could\
    \ Sensei help?\n\nWe probably wouldn’t use Sensei to pick up the `requestStaticInjection`,\
    \ since all our Guice configuration wiring would need to be as simple as this\
    \ use-case.\n"
