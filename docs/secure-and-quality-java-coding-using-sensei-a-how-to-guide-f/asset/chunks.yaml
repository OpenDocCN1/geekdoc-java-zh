    \ for this readme are to:\n\n*   Create a rule which finds methods that have been\
    \ ‘skipped’ or ‘disabled’ by renaming the method.\n\n*   Create a QuickFix to\
    \ rename the method and add both an @Test and @Disabled annotation.\n\n### Recipe\
    \ Settings\n\nThe first step I take with Sensei is to “add new recipe” and search\
    \ for the coding pattern I want the recipe to act on.\n\n```\n Name: JUnit: Make\
    \ @Disabled @Test from SKIPTHIS\nShort Description: Stop naming methods SKIPTHIS,\
    \ use @Disabled @Test instead\n```\n\nAnd my search is very simple. I use a basic\
    \ regex to match the method name.\n\n```\n search:\n  method:\n    name:\n   \
    \   matches: \"SKIPTHIS.*\"\n```\n\n![](OEBPS/Image00043.jpg)\n\n### QuickFix\
    \ Settings\n\nThe QuickFix is a little more complicated because it will rewrite\
    \ the code, and I’ll use a few steps to achieve my final code.\n\nI want to:\n\
    \n*   Add an `@Test` annotation to the method.\n\n*   Add an `@Disabled` annotation\
    \ to the method.\n\n*   Amend the method name.\n\nAdding the annotations is simple\
    \ enough using the `addAnnotation` fix. If I use a fully qualified name for the\
    \ annotation then Sensei will automatically add the imports for me.\n\n```\n availableFixes:\n\
    - name: \"Add @Disabled and @Test Annotation\"\n  actions:\n  - addAnnotation:\n\
    \       annotation: \"@org.junit.jupiter.api.Test\"\n  - addAnnotation:\n    \
    \  annotation: \"@org.junit.jupiter.api.Disabled\"\n```\n\nThe actual renaming\
    \ seems a little more complicated but I’m just using a regex replacement, and\
    \ the generic way to do this with Sensei is to use `sed` in a rewrite action.\n\
    \nBecause the rewrite actions a Mustache templates, Sensei has some functional\
    \ extensions in the template mechanism. A function is represented with `{{#...}}`\
    \ so for `sed` the function is `{{#sed}}` . The function takes two arguments which\
    \ are comma-separated.\n\nThe first argument is the `sed` statement:\n\n*   `s/(.*)\
    \ SKIPTHIS(.*)/$1 $2/`\n\nThe second argument is the String to apply the `sed`\
    \ statement to, which in this case is the method itself, and this is represented\
    \ in the Mustache variables as:\n\n*   `{{{.}}}`\n\n```\n - rewrite:\n       to:\
    \ \"{{#sed}}s/(.*) SKIPTHIS(.*)/$1 $2/,{{{.}}}{{/sed}}\"\n```\n\n![](OEBPS/Image00044.jpg)\n\
    \nThe `sed` implementation requires that when the arguments themselves contain\
    \ commas, that they are wrapped with `{{#encodeString}}` and `{{/encodeString}}`\
    \ - e.g. `{{#encodeString}}{{{.}}}{{/encodeString}}`\n\n### Reverse Recipe\n\n\
    Since this is an example, and we might want to use this in demos, I wanted to\
    \ explore how to reverse out the above change using a Sensei recipe.\n\nThinking\
    \ it through I want to find a method annotated with `@Disabled` but only in the\
    \ class `SkipThisTest` where I do the demo:\n\n```\n Name: JUnit: demo in SkipThisTest\
    \ remove @Disabled and revert to SKIPTHIS\nShort Description: remove @Disabled\
    \ and revert to SKIPTHIS for demo purposes in the project\nLevel: warning\n```\n\
    \nThe Recipe Settings Search is very simple, matching the annotation in a specific\
    \ class.\n\n```\n search:\n  method:\n    annotation:\n      type: \"Disabled\"\
    \n    in:\n      class:\n        name: \"SkipThisTest\"\n```\n\nTo avoid making\
    \ the code look like it is an error I defined the general setting on the recipe\
    \ to be a Warning. Warnings are shown with highlights in the code and it doesn’t\
    \ make the code look like it has a major problem.\n\nFor the Quick fix, since\
    \ we have matched the method, I use the rewrite action and populate the template\
    \ using the variables."
