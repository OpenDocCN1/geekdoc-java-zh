    \ `Disabled` annotation without any parameters.\n\n*   Change the `Disabled` annotation\
    \ to have a parameter with marker text “TODO: add a description here”.\n\n###\
    \ Create a Warning Recipe\n\nI use `Alt+Enter` to Create a new Recipe.\n\n![](OEBPS/Image00046.jpg)\n\
    \nThen add the basic descriptive text in the general information.\n\n![](OEBPS/Image00047.gif)\n\
    \nGeneral:\n\n```\n name: remember to add disabled description\nshort description:\
    \ @Disabled should really have a description explaining why\nLevel: Warning\n\
    ```\n\nBy making the rule a warning, any matching code is highlighted but not\
    \ shown as a glaring error.\n\n![](OEBPS/Image00048.jpg)\n\n### Find the Annotation\n\
    \nIn the recipe editor, I change the Search to match an annotation.\n\nThis will\
    \ highlight all annotations in the preview.\n\n![](OEBPS/Image00049.jpg)\n\nHaving\
    \ done that, I want to filter on the `type` . I could just use `Disabled` but\
    \ I fully qualify the class with the package so that it only matches the annotation\
    \ from JUnit 5\\. Because the preview is displayed, I can easily copy and paste\
    \ this from the code.\n\nI then want to match only annotations without Parameters,\
    \ and I can use the GUI to do that.\n\n![](OEBPS/Image00050.jpg)\n\ni.e. Search:\n\
    \n```\n search:\n  annotation:\n    type: \"org.junit.jupiter.api.Disabled\"\n\
    \    without:\n      parameters:\n      - {}\n```\n\n### Create a Rewrite Quick\
    \ Fix Action\n\nFor my QuickFix I will use a rewrite action.\n\nI use the `Show\
    \ Variables` functionality to show me the Mustache variables and preview the contents.\n\
    \n![](OEBPS/Image00051.jpg)\n\nAnd then I add the extra code needed to create\
    \ the place marker comment.\n\n![](OEBPS/Image00052.jpg)\n\ni.e. QuickFix:\n\n\
    ```\n availableFixes:\n- name: \"Add a todo comment parameter\"\n  actions:\n\
    \  - rewrite:\n      to: \"{{{ . }}}(\\\"TODO: add a description here\\\")\"\n\
    \      target: \"self\"\n```\n\n### Summary\n\nWhen building a rewrite Quick Fix,\
    \ it is easier when we can search for the code element that we want to rewrite,\
    \ because it is then the `self` entity we can act on.\n\nIn this example, I used\
    \ a rewrite action to amend the Annotation. Rewrite is a general-purpose action\
    \ that can apply to any code element and is a good default to explore.\n\n## Documentation\
    \ Links\n\nOne of the difficulties with learning a new library, or sharing agreed\
    \ upon practices across our team is documenting and creating examples.\n\nVery\
    \ often we create small example projects, but we don’t have them open when working\
    \ with actual code.\n\nI’ve often thought it would be great to have the ability\
    \ to link to our examples or online examples and be able to go to a URL for more\
    \ explanation when needed.\n\nWith Java, we have JavaDoc comments, which can have\
    \ a `see` annotation:\n\n```\n /**\n * @see <a href=\"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
    >Junit 5 Annotation docs</a>\n */\n```\n\nJavaDoc like this in 3rd party libraries\
    \ is a great help because we can use the `Quick Documentation` functionality in\
    \ IntelliJ to have access to more detailed examples.\n\n![](OEBPS/Image00053.jpg)\n\
    \nBut, we all know that comments don’t get updated as often as code, and web presence\
    \ maintenance is often disconnected from library maintenance and sometimes performed\
    \ by a different team entirely.\n\n### How Sensei Helps\n\nSensei provides the\
    \ ability to match on library annotations and methods to provide links to long-form\
    \ documentation on a wiki or third-party tutorial site.\n\nAs an example, I’m\
    \ using the `@Test` annotation from JUnit.\n\nThe JavaDoc is very detailed, and\
    \ the `Quick Documentation` view explains how to use the annotation."
