  - [github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\n\
  这两个仓库都包含了许多供学习的配方，以理解 Sensei 的工作原理。\n\n## 阅读文档\n\n[官方文档](https://scw.buzz/3emSI7l)\
