  \n## 有用的 Github 仓库\n\n* [Github 示例项目](https://scw.buzz/3cixLrq)\n    * [`github.com/SecureCodeWarrior/sensei-blog-examples`](https://scw.buzz/3cixLrq)\n\
  * [公开 Sensei 菜谱索引](https://scw.buzz/30pk1FN)\n    * [`github.com/SecureCodeWarrior/public-cookbooks](https://scw.buzz/30pk1FN)\n\
  \    * [`securecodewarrior.github.io/public-cookbooks/](https://scw.buzz/3btJZhV)\n\
  \n## Sensei 团队支持\n\n当一个人创建一个配方来提高代码质量或效率时，通过共享菜谱，团队中的每个人都能受益。\n\nSensei 提供了多种共享菜谱的机制：\n\
  \n* 将菜谱存储在受版本控制的项目中。\n* 将菜谱存储在共享文件夹中。\n* 将菜谱存储在 Github 中。\n* 通过 HTTP(s) 传输压缩文件。\n\
  \n通过共享菜谱，Sensei 帮助团队进行知识共享协作。这种协作有助于改进沟通，并嵌入约定的代码质量方法。\n\n例如，共享菜谱允许：\n\n* 团队成员之间共享实用的配方。\n\
  * 团队负责人为初级员工将约定的编码规范规范化。\n    * 识别常见的违规行为并为约定的版本提供快速修复。\n* 增强团队间的协作。\n    * 应用安全（AppSec）团队可能会创建配方来突出代码中的问题，而开发团队可以编写快速修复。\n\
  \n接下来的几部分将解释如何实现每种共享机制。\n\n### 将菜谱存储在受版本控制的项目中\n\n创建菜谱文件时，`.sensei` 文件夹是默认选项。\n\n\
  * `project://.sensei`\n\n所有菜谱和配方都将存储在项目中的 `.sensei` 文件夹中。\n\n最简单的共享方法是将项目的 `.sensei`\
  \ 文件夹添加到版本控制中。\n\n然后，`.sensei` 文件夹就可以像项目相关的其他共享代码产物一样进行管理。菜谱以 YAML 配置的形式存储，使其在任何提交和审查过程中易于合并。\n\
  \n这是公开项目 `sensei-blog-examples` 采用的方法。\n\n`https://github.com/SecureCodeWarrior/sensei-blog-examples`\n\
  \n`.sensei` 文件夹包含了包含所有配方的菜谱，任何克隆仓库的人都可以使用它们。\n\n### 将菜谱存储在任何文件夹中\n\n团队还可以使用存储在中心位置的菜谱。\n\
  \n将菜谱保存到任何具有共享写入权限的文件夹中，将允许整个团队更新配方，并将其导入到他们恰好正在工作的任何项目中。\n\n该位置将设置为目录路径。\n\n###\
  \ 在 Github 中存储配方\n\nSensei 还可以访问存储在 Github 仓库中的配方。支持私有仓库和公共仓库。\n\n#### 通过 SSH 访问\
  \ Github\n\n使用以下 `Location` 语法来配置 SSH 仓库访问：\n\n`git@github.com:SecureCodeWarrior/acookbook.git`\n\
  \n要使此运行，仓库中应包含菜谱文件夹的内容。\n\n例如，我们的基础保护菜谱采用了这种方法，并可以使用该位置作为“本地配置的菜谱”添加：\n\n`git@github.com:SecureCodeWarrior/cookbook-basic-protection-set.git`\n\
  \n还可以配置菜谱的分支和子文件夹，例如在 `master` 分支的 `cookbook` 子文件夹中\n\n例如：\n\n`git@github.com:SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
  \n私有仓库需要配置 SSH 密钥。\n\n* https://github.com/settings/keys\n\n并且密钥不应有密码保护。\n\n####\
  \ 通过 HTTPS 访问 Github\n\n也可以通过 HTTPS 访问公共仓库，使用相同的 `repo.git|branch|folder` 语法，例如：\n\
  \n`https://github.com/SecureCodeWarrior/sensei-blog-examples.git|master|.sensei`\n\
  \n#### 通过 HTTP(s) 传输压缩文件\n\nSensei 还可以通过 HTTP 或 HTTPS 访问压缩的菜谱。\n\n例如：\n\n`http://localhost:8000/rules.sensei`\n\
  \n压缩文件应包含菜谱文件夹的内容，例如：\n\n`rules.sensei`\n\n### 共享总结\n\nSensei 支持使用多个菜谱来增加共享。\n\n\
  更重要的是，我们知道当知识共享时，团队工作效率最高。共享（例如应用安全到开发）可以提高团队效率。\n\n有了四种核心共享机制，Sensei 至少有一种你可以增加协作的方法。\n\
  \n## 在持续集成中运行 IntelliJ 检查\n\nIntelliJ IDEA 提供了在编写代码时通过 IDE 帮助改进代码的功能。本节涵盖了开箱即用的\
  \ IntelliJ 功能以及自定义扩展。\n\n### IntelliJ 检查\n\nIntelliJ 的检查功能驱动了在编写代码时动态在 IDE 中报告的许多错误，例如：\n\
  \n* 检测可以转换为接口的抽象类。\n* 识别冗余的类字段（本地）。\n* 关于使用弃用方法的警告。\n* 等。\n\n这些检查在 IDE 中高亮匹配代码的意操作，通常带有关联的快速修复。\n\
  \n```\n(Image 00008.jpg)\n```\n\n代码匹配检查时的实时 IDE 高亮有助于我们动态改进代码。在识别代码中的问题后，使用 IntelliJ\
  \ 意操作修复代码可以强化更好的模式。\n\n### 检查配置\n\n检查可以在 IDE 内以批处理运行，也可以从命令行或在集成过程中运行。\n\n通过批处理运行\
  \ IntelliJ 检查的关键是使用检查配置（Inspections Profile）。\n\nIntelliJ 有两个默认检查配置：存储在项目中，存储在 IDE\
  \ 中。\n\n可以创建新的检查配置以配置特定的插件或用例，例如：\n\n* 仅运行 Checkstyle 扫描\n* 运行特定的 Sensei 规则\n* 运行\
  \ HTML 检查\n\n配置中的检查可以在 IntelliJ 偏好设置中启用或禁用。偏好设置也是了解可用检查范围的简单方法。\n\n```\n(Image 00009.jpg)\n\
  ```\n\n工具图标允许复制配置并创建一个新配置以收集特定的规则集。\n\n```\n(Image 00010.jpg)\n```\n\n### 在 IDE\
  \ 中运行检查配置\n\n可以使用 `Analyze \\ Inspect Code...` 菜单在 IDE 内运行检查配置。\n\n```\n(Image 00011.jpg)\n\
  ```\n\n\n\n\n\n`Analyze` 功能允许你控制 `Inspection` 运行的范围，例如整个项目（包括或排除测试源），或针对特定的文件集。\n\
  \n![](img/Image00012.jpg)\n\n你也可以在此处管理 `Inspection Profiles`（检查配置），以创建或配置特定的配置。\n\
  \n在“Specify Inspection Scope”（指定检查范围）对话框中点击 `[OK]`，将触发 IntelliJ 在定义的范围内运行配置中所有选中的\
  \ `Inspections`。\n\nIntelliJ 将在 `Inspection Results`（检查结果）标签页中报告运行 `Inspections`\
  \ 的结果。\n\n![](img/Image00013.jpg)\n\n来自 Secure Code Warrior 的 [Sensei](https://scw.buzz/3qvDvDt)\
  \ 插件允许你创建自定义的代码匹配配方。Sensei 与 IntelliJ 深度集成，使得这些自定义配方的使用像 `IntelliJ Intention Actions`（IntelliJ\
  \ 意图操作）一样自然。这意味着它们作为 `Inspections` 加载到 IntelliJ 中，并可以使用 `Inspection Profiles` 进行分组、启用和禁用。创建一个自定义的\
  \ `Inspection Profile` 并使用 `Analyze Inspect Code` 功能是在整个项目中批量运行 Sensei 配方的推荐方法。\n\
  \n### 从命令行运行检查配置\n\nIntelliJ 具有如 JetBrains 文档所描述的那样从命令行运行检查的能力：\n\n* https://www.jetbrains.com/help/idea/working-with-the-ide-features-from-command-line.html\n\
  \n我主要使用 Mac OS，可以通过以下命令从命令行运行单个 IntelliJ 实例：\n\n```\nopen -na \"IntelliJ IDEA CE.app\"\
  \n```\n\n为了支持更容易执行，我将此添加到 shell 命令脚本中。\n\n`vi /usr/local/bin/idea`\n\n脚本的内容来自 IntelliJ\
  \ 提供的官方文档。\n\n```bash\n#!/bin/sh\nopen -na \"IntelliJ IDEA CE.app\" --args \"$@\"\
  \n```\n\n然后我赋予了它可执行权限，以便简化命令行检查过程。\n\n`chmod 755 /usr/local/bin/idea`\n\nIntelliij\
  \ 官方文档描述了检查命令的一般形式为：\n\n`idea inspect <project> <inspection-profile> <output> [<options>]`\n\
  \n在实践中，我使用了全路径：\n\n```\nidea inspect /Users/user/GitHub/sensei-blog-examples /Users/user/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml\
  \ /Users/user/GitHub/sensei-blog-examples/scan-results\n```\n\n或者使用相对于我用户目录的路径：\n\
  \n```\nidea inspect ~/Documents/GitHub/sensei-blog-examples ~/Documents/GitHub/sensei-blog-examples/.idea/inspectionProfiles/senseiprofile.xml\
  \ scan-results\n```\n\n这会运行我添加到 `senseiprofile` 中的所有 `Inspections`并将结果报告在 `scan-results`\
  \ 文件夹中。\n\n![](img/Image00014.jpg)\n\n### 查看检查结果\n\n正如稍后看到的，我们可以在持续集成（CI）内部报告这些结果。\n\
  \n我们也可以在 IntelliJ 内部使用 `Analyse \\ View Offline Inspection Results…`（分析 \\ 查看离线检查结果…）功能查看它们。\n\
  \n![](img/Image00015.jpg)\n\n这将会将结果加载到 `Inspection Results` 标签页中。\n\n![](img/Image00016.jpg)\n\
  \n这在 JetBrains 网站上有官方文档记录：\n\n* https://www.jetbrains.com/help/idea/command-line-code-inspector.html#inspection-results\n\
  \n如果将命令行执行整合到持续集成过程中，并且审查人员想要检查任何检查结果条目的完整源码上下文，则可能会在代码审查过程中使用此功能。\n\n### 持续集成中的检查配置\n\
  \n在将命令行检查添加到持续集成时，我们理想情况下希望自动生成报告，我们有许多选项可以选择。\n\nTeamCity 为持续集成中的 `Inspection Profiles`\
  \ 提供了开箱用的支持。\n\n* https://www.jetbrains.com/help/teamcity/inspections.html\n\nJenkins\
  \ Warnings NG 插件支持 IntelliJ 检查的命令行输出作为报告格式之一。\n\n* https://github.com/jenkinsci/warnings-ng-plugin\n\
  * https://github.com/jenkinsci/warnings-ng-plugin/blob/master/SUPPORTED-FORMATS.md\n\
  \n存在如 `idea CLI Inspector` 这样的社区项目，用于在其他 CI 工具中使用 `Inspection Profiles`，例如：\n\n\
  * https://github.com/bentolor/idea-cli-inspector\n\n随着 JetBrains Qodana 项目的引入，检查配置在\
  \ CI 过程中的未来看起来更加明亮。Qodana 项目是 IntelliJ 的无头版本，带有官方的 Github Actions 和 Docker 镜像。\n\
  \n* https://github.com/JetBrains/Qodana\n\n*Qodana 目前处于测试阶段，但 Sensei 团队正在监控它，使其作为持续集成中运行\
  \ Sensei 规则的官方支持平台。*\n\n## 总结\n\n意图操作（Intention Actions）允许我们在编码期间出错时强化编码模式并在 IDE\
  \ 中快速修复它们。\n\n检查配置（Inspection Profiles）允许我们将这些收集到配置中，并作为 `Analyze and Inspect Code`\
  \ 操作批量运行。当我们遇到某种模式并想双检是否在代码的其他地方遗漏了该模式时，这非常有用。\n\n检查配置可以从命令行运行，甚至可以整合到持续集成过程中，支持“信任，但要验证”的模型并捕捉任何意外的疏漏。\n\
  \n以上所有都是 IntelliJ 的内置功能，JetBrains 正在通过引入 Qodana 改进他们的持续集成过程。\n\nSensei 配方作为原生功能加载到\
  \ IntelliJ 中。\n\n### 在 YouTube 上观看\n\n我们创建了一个 YouTube 视频，展示了本部分的所有步骤和工具。\n\n![](https://www.youtube.com/watch?v=GkAS2Q)\n\
  \n[youtu.be/GkAS2Q](https://youtu.be/GkAS2Q)\n\n# Sensei GUI 概述\n\nSensei 插件允许我创建搜索来匹配我想修改的代码并创建快速修复（Quick\
  \ Fix）来修改代码。本节将介绍 GUI 的主要部分以及如何使用它们。\n\n## Sensei 菜单\n\n安装 Sensei 后，我们在工具菜单中看到 Sensei\
  \ 菜单。\n\n![](img/Image0018.jpg)\n\n## 食谱管理器 (Cookbook Manager)\n\n我们可以在这里显示食谱管理器，它将列出我可用的“食谱”（配方列表）。\n\
  \n![](img/Image0019.jpg)\n\n我可以使用此对话框切换食谱的启用和禁用。可以使用屏幕底部的 `Sensei Cookbooks` 标签页在需要时返回这里。我不需要主菜单。\n\
  \n## 管理配方\n\n由于这是来自 Github 的示例项目，我在项目的 `.sensei` 文件夹中存储了一些配方，并且它们已自动加载。\n\n可以通过点击\
  \ `[Manage recipes]` 按钮来管理它们并查看哪些配方可用\n\n## 配方编辑器列表\n\n每个配方都有一个包含名称、描述和警告级别的配置，这些配置定义了当代码匹配搜索中的模式时在\
  \ IDE 中如何渲染。\n\n![](img/Image0020.jpg)\n\n通过点击配方，我可以对其进行编辑。\n\n## 配方编辑器\n\n配方编辑器有四个主要组件：\n\
  \n* 配方列表，可以在此处添加、删除和复制配方。\n* 通用设置标签页，可以在此处配置配方。\n* 配方设置标签页，创建搜索和匹配条件。\n* 修复设置，配置修改或生成代码的快速修复更改。\n\
  \n![](img/Image0021.jpg)\n\n## 通用设置\n\n通用设置是我们在主要配置此处：\n\n* `Name` 和 `Description`\
  \ 在使用 `alt+enter` 时显示在意图快速修复弹出窗口中。\n* `Level` 定义了匹配的配方在 IDE 中如何渲染。\n\n如果我将一个配方标记为“错误”（Error），则代码将带有红色下划线并显示为语法错误，但警告将会有轻量高亮。\n\
  \n\n\n\n还有其他设置，但这些用于更高级用法，将在文档中介绍。\n\n- 文档 - [sensei-docs-beta.securecodewarrior.com](https://scw.buzz/3emSI7l)\n\
  \n![](img/Image00022.jpg)\n\n## 配方设置 - 搜索\n\n“配方设置”（Recipe Settings）包含了搜索配置。\n\n\
  这是我们在代码执行的搜索，用于匹配编码模式。\n\n在这个示例中，我正在搜索方法上的任何 Junit 5 测试注解。\n\n你可以看到代码中的注解已经在代码本身中被高亮了。\n\
  \n![](img/Image00023.jpg)\n\n如果我更改了注解类型，代码将无法匹配，因此我们可以直观地看到我们的搜索对于正在处理的代码是否有效。\n\
  \n![](img/Image00024.jpg)\n\n## 快速修复设置\n\n快速修复设置（QuickFix Settings）是在我使用 `alt+enter`\
  \ 修复问题时在 IntelliJ 中显示的快速修复方案。\n\n你在屏幕底部看到一个差异视图（diff view），显示了应用快速修复的结果。\n\n截图显示的配方向类中添加了一个\
  \ `Logger`，差异视图显示了代码修改前后的状态。\n\n![](img/Image00025.jpg)\n\n## 创建配方\n\n在代码中，通常位于你想要开始搜索的地方。\n\
  \n按下 `alt+enter` 会显示创建配方的上下文菜单。\n\n![](img/Image00026.jpg)\n\n我们经常从一个空配方“从零开始”。\n\
  \n![](img/Image00027.jpg)\n\n## 在 IDE 中发现问题\n\n### 在代码中\n\n当配方被激活后，它们将在代码中被标记。\n\
  \n以下代码显示了一些“错误”和一些“警告”。\n\n![](img/Image00028.jpg)\n\n我现在现在保存它，然后我们就可以在 IDE 中使用它。\n\
  \n### 问题图标\n\n问题也会通过右上角的 Sensei 问题图标显示。\n\n![](img/Image00029.jpg)\n\n我可以在这里右键点击，通过“问题”（Problems）选项卡修复问题。\n\
  \n![](img/Image00030.jpg)\n\n## 触发快速修复\n\n有许多方法可以触发快速修复（QuickFix）。\n\n### 使用问题选项卡\n\
  \n在“问题”选项卡中。\n\n右键点击报告的问题并选择“显示快速修复”（Show Quick Fixes）。\n\n![](img/Image00031.jpg)\n\
  \n然后从列表中选择快速修复。\n\n![](img/Image00032.jpg)\n\n### 上下文 `alt+enter`\n\n修复代码最常用的方法是使用\
  \ `alt+enter`，我们将看到任何 IntelliJ 建议和 Sensei 快速修复。\n\n![](img/Image00033.jpg)\n\n如果我选择该操作，代码就会被修改。\n\
  \n### 修复多个操作\n\n如果文件中有多个出现之处，我可以一次性修复它们。\n\n按下 `alt+enter` 并导航到快速修复菜单的下一层级，我们找到了了修复当前源文件中所有问题的选项。\n\
  \n![](img/Image00034.jpg)\n\n# 章节 - 用用例\n\nSensei 可以帮助提高高质量代码的编写，无论底层的领域或技术如何。\n\
  \n本节按技术分类分为若干子章节，以演示：\n\n- Sensei 的某些功能。\n- 这些功能如何应用。\n\n技术示例已尽可能减小，以说明与技术的交互，但仍保持了较短的学习曲线。这样，即使你不了解该技术，也应该能够跟上。\n\
  \n这里的描述在 Github 仓库中提供了完整的代码示例：\n\n- [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
  \n要查看的具体代码链接或描述将包含在用例描述中。\n\n## POJO 用例\n\n这些用例使用了原始的 Java。\n\n不需要外部依赖，因此它们是 Sensei\
  \ 基础功能的良好介绍。\n\n## 将 `System.out.println` 转换为日志\n\n在编写以下代码时，我犯了一些错误：\n\n```\n private\
  \ String getCountdownString() {\n\n        String output =\n```\n\n\n\n注意，我将 `SysOutTest`\
  \ 修改为了 mustache 变量，这样它就能获取我在此配方中所使用的任何类名。同样，由于我不记得 mustache 的语法，我使用了 GUI 命令 `show\
  \ variables` 来找到我需要的替换内容。\n\n而且通过将 `Logger` 全限定限定为 `java.util.logging.Logger`，Sensei\
  \ 将添加导入项并编写我想要的代码行，即：\n\n```\n Logger logger = Logger.getLogger(SysOutTest.class.getName());\n\
  ```\n\n![](img/Image00040.jpg)\n\n这个配方的一个有用之处是，因为它只会添加一次 logger 字段，因此我可以将其应用于任何使用过\
  \ `System.out.println` 的现有代码中，并使用 Sensei 更改我代码中所有出现的地方。\n\n![](img/Image00041.jpg)\n\
  \n## 下一步骤\n\n一旦我习惯了这一点，我最终将训练自己不再使用 `System.out.println`。\n\n我还可以创建一个第二个配方来帮助我创建\
  \ logger，从而利用 Sensei 帮助我主动编写代码。\n\n例如：我可以匹配一个没有名为 `logger` 字段的类，并添加一个。\n\n我创建了一个级别为\
  \ `Information` 的配方：\n\n```\n Name: Logger: add logger\nDescription: Add logger\
  \ to class\nLevel: Information\n```\n\n匹配不带 logger 字段的类：\n\n```\n search:\n  class:\n\
  \    without:\n      child:\n        field:\n          name: \"logger\"\n```\n\n\
  然后我将复用之前之前看到的 QuickFix 的部分：\n\n```\n availableFixes:\n  - name: \"Add Logger\"\n\
  \    actions:\n      - addField:\n          field: \"java.util.logging.Logger logger\
  \ = Logger.getLogger({{{ containingClass.name\\\n        \\ }}}.class.getName())\"\
  \n          target: \"self\"\n```\n\n注意这里 `target` 与第一个 QuickFix 相比的区别。这里使用 `self`\
  \ 是因为我们的搜索匹配了类。第一个 QuickFix 使用 `parentClass` 是因为我们匹配的是类内部的代码。*\n\n## 总结\n\n这代表了使用\
  \ Sensei 帮助提高个人编程技能的关键流程之一：\n\n* 创建一个配方来帮助实现即时的“最佳实践”。\n* 一旦你知道如何使用该最佳实践……就创建一个配方来加速你的工作流。\n\
  \n## 代码链接\n\n在 Github 仓库中：\n\n* https://github.com/SecureCodeWarrior/sensei-blog-examples\n\
  * module: `pojoexamples`\n\n* `src\\test\\java\\logging`\n\n`AddLoggerTest.java`\
  \ 包含一些应用配方的指令。\n\n`SysOutTest.java` 是一个你可以尝试的类示例。\n\n## 观看 Sensei 演示\n\n![](https://www.youtube.com/watch?v=qPlNm0yaSto)\n\
  \n[youtu.be/qPlNm0yaSto](https://youtu.be/qPlNm0yaSto)\n\n# Junit 5 用例\n\n[JUnit\
  \ 5](https://junit.org/junit5/) 是一个流行的 Java 单元测试框架。\n\n接下来的用例都使用 JUnit 5 作为实现，但基本概念可以通过对配方进行细微修改，以应用于\
  \ JUnit 4 或其他单元测试框架。\n\n## 添加注解和重命名方法\n\n*使用 Sensei 改进个人编程流程*\n\n对于这一部分，我重现了学习 JUnit\
  \ 时使用的一种“糟糕”的编码方法，并将演示如何使用 Sensei 将这种“糟糕”模式转换为公认的且“更好”的编码模式。\n\n当我学习 JUnit 时，我脑中一次次能记住的信息非常有限。我经常忘记在测试不起作用时如何跳过它们。\n\
  \n如果我们是在团队中工作，可以使用拉取请求（pull requests）的代码审查来帮助强制执行编码风格。与经验丰富的程序员进行结对编程时，我们还可以缩短反馈周期。\n\
  \n我们还可以通过工具增强我们的流程，让工具提示我们做正确的事。Thoughtworks 在其[针对 Sensei 的技术雷达列表](https://www.thoughtworks.com/radar/tools/sensei)\
  \ 中将其描述为：\n\n> “让做正确的事变得简单，比应用类似清单的治理规则和程序更容易”\n\n### 禁用 JUnit 测试\n\n理想情况下，正如大家所知，我应该使用\
  \ `@Disabled` 注解并写成：\n\n```\n @Disabled\n    @Test\n    void canWeAddTwoNumbers(){\n\
  \        Assertions.fail(\"this test was skipped and should not run\");\n    }\n\
  ```\n\n但在学习期间，我不得不训练自己使用 `@Disabled`。\n\n当我忘记如何禁用测试方法时，我会删除 `@Test` 注解并重命名测试：\n\n\
  ```\n class SkipThisTest {\n\n    void SKIPTHIScanWeAddTwoNumbers(){\n        Assertions.fail(\"\
  this test was skipped and should not run\");\n    }   \n}\n```\n\n这并不好，但完成了任务。我当时没有像\
  \ Sensei 这样的工具来帮助我记忆，所以我陷入了使用糟糕编码模式中。\n\n我为此 readme 采取的任务是：\n\n* 创建一条规则，通过重命名方法来找到被“跳过”或“禁用”的方法。\n\
  * 创建一个 QuickFix 来重命名方法并同时添加 `@Test` 和 `@Disabled` 注解。\n\n### 配方设置\n\n我使用 Sensei\
  \ 的第一步是“打开设置”。\n\n```\n Name: open Sensei\n```\n\n为了匹配方法，我在配方中使用了以下内容：\n```\n search:\n\
  \  method:\n    name:\n      matches: \".*.*\"\n```\n\n![](img/Image00043.jpg)\n\
  \n### QuickFix 设置\n\nQuickFix 稍微复杂一些，因为它将重写代码，我将使用 `sed`。\n\n我想做：\n\n* 为方法添加 `@Test`\
  \ 注解。\n* 为方法添加 `@Disabled` 注解。\n* 修改方法名。\n\n使用 `addAnnotation` 添加注解非常简单。如果我为注解使用全限定名，Sensei\
  \ 将自动添加导入项。\n\n```\n availableFixes:\n  - name: \"Add @Disabled and @Test\"\n  \
  \  actions:\n      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Test\"\
  \n      - addAnnotation:\n          annotation: \"@org.junit.jupiter.api.Disabled\"\
  \n```\n\n![](img/Image00044.jpg)\n\n`sed` 的实现要求当参数包含逗号时，必须用 `{{#encodeString}}`\
  \ 和 `{{/encodeString}}` 裹起来——例如 `{{#encodeString}}{{{.}}}{{{/encodeString}}`。\n\n\
  ### 反向配方\n\n由于这是一个示例，而且我们可能在演示中使用它，我想探索如何使用 Sensei 配方来撤销上述更改。\n\n经过思考，我想在执行演示的 `SkipThisTest`\
  \ 类中找到带有 `@Disabled` 注解的方法：\n\n```\n Name: JUnit: demo in SkipThisTest remove @Disabled\
  \ and revert to SKIPTHIS\nShort Description: 为了项目演示目的移除 @Disabled 并恢复为 SKIPTHIS\n\
  Level: warning\n```\n\n配方设置搜索非常简单，匹配特定类中的注解。\n\n```\n search:\n  method:\n    annotation:\n\
  \      type: \"Disabled\"\n    in:\n      class:\n        name: \"SkipThisTest\"\
  \n```\n\n对于 Quick fix，由于我们已经匹配了方法，我们使用重写动作并使用变量填充模板。\n\n\n\n\n\n```\n availableFixes:\n\
  - name: \"Remove Disabled and rename to SKIPTHIS...\"\n  actions:\n  - rewrite:\n\
  \      to: \"{{{ returnTypeElement }}} SKIPTHIS{{{ nameIdentifier }}}{{{ parameterList\\\
  \n        \\ }}}{{{ body }}}\"\n```\n\n我基本上添加了除了修饰符以外的所有变量（因为我想去掉这些注释），并在模板中添加了\
  \ `SKIPTHIS` 文本。\n\n这个修复方案的缺点是，通过移除修饰符，我也删除了所有其他注释。\n\n### 添加另一个 Action\n\n我可以添加另一个具名的修复方案，这样当在使用\
  \ `alt+enter` 显示 `QuickFix` 时，我可以有一个选择。\n\n```\n availableFixes:\n- name: \"Remove\
  \ Disabled and rename to SKIPTHIS...\"\n  actions:\n  - rewrite:\n      to: \"{{{\
  \ returnTypeElement }}} SKIPTHIS{{{ nameIdentifier }}}{{{ parameterList\\\n    \
  \    \\ }}}{{{ body }}}\"\n      target: \"self\"\n- name: \"Remove Disabled, keep\
  \ other annotations, and rename to SKIPTHIS...\"\n  actions:\n  - rewrite:\n   \
  \   to: \"{{#sed}}s/(@Disabled\\n.*@Test)//,{{{ modifierList }}}{{/sed}}\\n\\\n\
  \        {{{ returnTypeElement }}} SKIPTHIS{{{ nameIdentifier }}}{{{ parameterList\\\
  \n        \\ }}}{{{ body }}}\"\n      target: \"self\"\n```\n\n在这里，我在新的 Quick Fix\
  \ 中添加了额外的行。\n\n```\n {{#sed}}s/(@Disabled\\n.*@Test)//,{{{ modifierList }}}{{/sed}}\n\
  ```\n\n这会获取修饰符列表，将其编码为字符串，然后使用 `sed` 移除字符串中包含 `@Disabled` 的行，但保留修饰符中的所有其他行，即保留所有其他注释。\n\
  \n注意：记得在 `sed` 中添加逗号“，”，否则你会在预览中看到被添加的注释，因为这是 Sensei 向你通警 `sed` 命令中语法错误的方式。\n\n\
  ### 嵌套 `sed` 调用\n\n我很幸运，我可以在一次搜索和替换中同时匹配 `@Disabled` 和 `@Test`。\n\n如果代码更复杂，我想要执行一系列\
  \ `sed` 命令，那么我可以通过嵌套它们来实现：\n\n```\n {{#sed}}s/@Test//,{{#sed}}s/@Disabled\\n//,{{{\
  \ modifierList }}}{{/sed}}{{/sed}}\n```\n\n在上面的示例中，我对先对 `{{{ modifierList }}}` 应用\
  \ `@Disabled` 替换的结果再次应用 `@Test` 替换。\n\n## 总结\n\n`sed` 是一种实现代码重写的非常灵活的方法，并且可以为复杂的重写条件嵌套\
  \ `sed` 函数调用。\n\n像这样的食谱方通常是临时的，因为我们使用它们是为了改进编程流程，一旦我们建立了肌肉记忆并且不再使用那种糟糕的编程模式，我们就可以从\
  \ Cookbook 中删除或禁用它们。\n\n注意：与其添加两个可用修复，我可以复制配方，但如果这样做，我记得取消勾选“Add disable entry for\
  \ cloned recipe”（为克隆配方添加禁用项）复选框，否则只有克隆的配方可用。\n\n## 使用 Rewrite Actions 为注释添加参数\n\n\
  在这个示例中，我们将：\n\n* 演示搜索和匹配注释。\n* 使用 mustache 模板修改注释。\n\nSensei 提供了匹配问题代码模式并将其修改为约定实现的能力。在这个示例中，我使用不带参数的\
  \ `@Disabled` 作为问题代码模式。\n\n### 在 YouTube 上查看演示\n\n![](https://www.youtube.com/watch?v=mjXGliXJ7M8)\n\
  \n[youtu.be/mjXGliXJ7M8](https://youtu.be/mjXGliXJ7M8)\n\n### 禁用测试注释\n\n没有指定原因的禁用测试长期来看可能会产生问题，因为我们会忘记为什么要禁用它们。\n\
  \n```\n @Disabled\nvoid thisTestMethodHasNoDisabledReason(){\n    Assertions.fail(\"\
  This test is disabled and should not run\");\n}\n```\n\n风险在于，随着时间的推移，代码库发生了变化，禁用的测试不会随代码的目的同步更新，最终变得多余且无关，并且可能永远不会重新启用。\n\
  \n在代码审查期间，我们经常会指出作为注释参数添加解释性描述是一个好主意。\n\n```\n @Disabled(\"Disabled to demonstrate\
  \ adding a reason\")\nvoid thisTestMethodHasDisabledReason(){\n    Assertions.fail(\"\
  This test is disabled and should not run\");\n}\n```\n\n### 一个 Sensei 食谱\n\n我们可以编写一个食谱来检测何时在没有解释的情况下添加了\
  \ `@Disabled`，并编写一个 Quick Fix 提醒我们添加解释为什么要禁用的实际原因。\n\n当我思考要做什么时，我必须：\n\n* 匹配不带任何参数的\
  \ `Disabled` 注释。\n* 将 `Disabled` 注释更改为带有标记文本“TODO: add a description here”参数的注释。\n\
  \n### 创建警告食谱\n\n我使用 `Alt+Enter` 创建一个新的食谱。\n\n![](img/Image00046.jpg)\n\n然后在通用信息中添加基础描述性文本。\n\
  \n![](img/Image00047.gif)\n\n通用：\n\n```\n name: remember to add disabled description\n\
  short description: @Disabled should really have a description explaining why\nLevel:\
  \ Warning\n```\n\n通过将规则设置为警告，任何匹配的代码都会被高亮，但不会显示为明显的错误。\n\n![](img/Image00048.jpg)\n\
  \n### 查找注释\n\n在食谱编辑器中，我搜索以匹配注释。\n\n这将高亮注释。\n\n![](img/Image0049.jpg)\n\n例如：\n\n\
  ```\n search:\n  annotation:\n    type: \"org.jupiter.api.Disabled\"\n    without:\n\
  \      parameters:\n      {}\n```\n\n### 创建重写修复方案\n\n对于我的 Quick Fix，我将使用 rewrite\
  \ action。\n\n我使用 `Show Variables` 功能来显示变量。\n\n![](img/Image0051.jpg)\n\n然后我添加创建注释所需的额外代码。\n\
  \n![](img/Image0052.jpg)\n\n例如 QuickFix：\n\n```\n availableFixes:\n- name: \"Add\
  \ a todo comment\"\n  actions:\n  - rewrite:\n      to: \"{{{ }}}(\\\"TODO: add\
  \ a description\\\")\n      target: \"self\"\n```\n\n## 总结\n\n构建写 Quick Fix 时，如果我们可以操作\
  \ `self`实体将会更容易。\n\n在示例中，我使用 rewrite action 来修改注释。Rewrite 是一种通用的操作，适用于任何代码元素，并且是一个很好的探索方向。\n\
  \n## 文档链接\n\n学习新库或在团队中共享约定的实践的困难之一在于编写文档和创建示例。\n\n我们经常创建示例项目，但在处理实际代码时并没有打开它们。\n\
  \n我经常在想，如果能够链接到我们的示例或在线示例，并在需要时访问 URL 获取更多解释就太好了。\n\n在 Java 中，我们有 JavaDoc 注释，它可以包含一个\
  \ `see` 注解：\n\n```java\n /**\n * @see <a href=\"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
  >Junit 5 Annotation docs</a>a>\n */\n```\n\n第三方库中的这种 JavaDoc 非常有帮助，因为我们可以使用 IntelliJ\
  \ 中的 `Quick Documentation` 功能来获取更详细的说明。\n\n![](img/Image0053.jpg)\n\n但是，我们都知道注释的更新频率往往不如代码，而且网页呈现的维护通常与库的维护脱节，有时甚至由完全不同的团队执行。\n\
  \n### Sensei 如何帮助\n\nSensei 提供了匹配库注释和方法的能力，从而提供指向 wiki 或第三方教程网站上长文档的链接。\n\n例如，我正在使用\
  \ JUnit 的 `@Test` 注释。\n\nJavaDoc 非常详细，`Quick Documentation` 视图解释了如何使用该注释。\n\n\n\n\
  \n\n但网站上的官方文档通常更容易读，并且包含更多示例。\n\n当团队开始学习一个库时，拥有一套推荐的教程会非常有用。\n\nSensei 有一个 `goto`\
  \ 操作，可以打开 URL，允许我们链接到外部站点以及我们团队认为有用的文档和示例。\n\n## 实现 `goto` URL\n\n为了实现这一点，我将创建一个匹配\
  \ Junit `@Test` 注解的搜索。\n\n```\n search:\n  annotation:\n    owner:\n      method:\
  \ {}\n    type: \"org.junit.jupiter.api.Test\"\n```\n\n然后，我将为我发现的每个有用 URL 添加 `goto`\
  \ 操作。\n\n例如：\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\n\
  \n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\n\
  \n下面的示例将创建一个单一的操作 `JUnit Annotations (learn)`，它将在浏览器中同时打开这两个两个 URL。\n\n```\n availableFixes:\n\
  - name: \"Learn about JUnit Annotations\"\n  actions:\n  - goto:\n      type: \"\
  URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
  \n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
  \n```\n\n当我在 IntelliJ 中通过 `alt+Enter` 激活它时，我看到了上下文菜单，可以选择它跳转到文档。\n\n![](img/Image00054.jpg)\n\
  \n## 多操作\n\n我可能会选择多个操作，以便每个 URL 或教程在 `alt+enter` QuickFix 弹出菜单中都有自己的选项。\n\n例如，对于\
  \ `@Parameterized` 注解，我可能想链接到官方文档和一组在线示例代码。\n\n* https://junit.org/junit5/docs/current/user-guide/#writing-tests-parameterized-tests\n\
  \n* https://github.com/eviltester/junitexamples/blob/master/src/test/java/parameterized/junit5/InitialExampleTest.java\n\
  \n我只需简单的创建一个搜索该注解的配方（recipe）：\n\n```\n search:\n  annotation:\n    owner:\n    \
  \  method: {}\n    type: \"org.junit.jupiter.params.ParameterizedTest\"\n```\n\n\
  并链接到我认为有用的站点：\n\n```\n availableFixes:\n- name: \"JUnit Annotations (learn)\"\n\
  \  actions:\n  - goto:\n      type: \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations\"\
  \n- name: \"What is a JUnit Test? (learn)\"\n  actions:\n  - goto:\n      type:\
  \ \"URL\"\n      value: \"https://junit.org/junit5/docs/current/user-guide/#writing-tests-classes-and-methods\"\
  \n```\n\n这两个链接将出现在弹出对话框中。\n\n![](img/Image00055.jpg)\n\n## 谁会受益？\n\n在使用和学习库时，我会发现这有用，特别是在领导团队并帮助他们采用新库时。\n\
  \n这也能让创建库的团队受益，通过创建一套标准的文档配方，引导人们采用该库或库中的新功能。\n\n如果代码维护和文档维护是由不同的团队执行的，这将会特别有用。\n\
  \n# Guice 用例\n\n每引入一项新技术都会给项目增加风险。依赖注入（Dependency Injection）可以在编码时节省时间，并在配置方面增加额外的灵活性，但始终存在我们忘记连接某些组件或注入错误对象的风险。\n\
  \n本节的用例探索了 Sensei 如何提供帮助。\n\n## 如何使用 Sensei 捕捉并修复依赖注入问题\n\nSensei 项目本身拥有随时间积累的配方，这是\
  \ Sensei 团队构建配方覆盖的场景示例示例：Guice 的配置错误导致在测试期间运行时报告了 `NullPointerException`。\n\n这可以推广到许多依赖注入场景，在这些场景中，代码语法上是正确的，但因为连接配置错误，导致错误漏掉。\n\
  \n这通常在我们学习某项技术时发生，我们不断犯下忘记连接的简单错误。但也会发生在经验丰富的人士身上，因为……我们都都会犯错，而且我们可能没有单元测试来覆盖一切。\n\
  \n### 错误的依赖注入连接导致的运行时异常\n\n下面的代码在运行时因 `NullPointerException` 失败。\n\n```\n Injector\
  \ injector = Guice.createInjector(new SystemOutModule());\nCountReporter reporter\
  \ = injector.getInstance(CountReporter.class);\n\nString [] lines5 = {\"1: line\"\
  , \"2: line\", \"3: line\", \"4: line\", \"5: line\"};\n\nreporter.reportThisMany(Arrays.asList(lines5));\n\
  Assertions.assertEquals(5, reporter.getCount());\n```\n\n代码语法上是正确的，但失败是因为我们在 `SystemOutModule`\
  \ 配置中漏掉了 `requestStaticInjection`。\n\n```\n public class SystemOutModule extends\
  \ AbstractModule {\n\n    @Override\n    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
  \    }\n}\n```\n\n当我们尝试使用 `reporter` 时，我看到了上下文菜单。\n\n### 警告信号\n\n代码语法上是正确的，但失败是因为我们在\
  \ `SystemOutModule` 配置中漏掉了 `requestStaticInjection`。\n\n当我们尝试使用 `reporter` 时，我看到了上下文菜单。\n\
  \n### Sensei 能如何提供帮助？\n\n我们可能不会使用 Sensei 来发现 `requestStaticInjection`，因为我们所有的 Guice\
  \ 配置连接都需要像这个用例一样简单。\n\n\n\n\n\n配方中的 QuickFix 会修改被注入的类，但并不是唯一需要修改的代码。\n\n```\n availableFixes:\n\
  - name: \"Change class to public. Remember to also request injection on this class\"\
  \n  actions:\n  - changeModifiers:\n      visibility: \"public\"\n      target:\
  \ \"parentClass\"\n```\n\n当配方被触发时，我仍然需要在代码中执行一个手动步骤，即添加包含 `requestStaticInjection`\
  \ 的行，以完全实例化该对象。\n\n```\n public class SystemOutModule extends AbstractModule {\n\
  \n    @Override\n    protected void configure() {\n        binder().bind(ILineReporter.class).to(SystemOutReporter.class);\n\
  \        // 通过依赖注入实例化\n        binder().requestStaticInjection(CountReporter.class);\n\
  \    }\n}\n```\n\n我完全可以再写另一个配方来捕获这一点。但除非忘记添加静态注入成了我在编码时经常的半常规错误，否则我可能不会这样做。\n\n\
  ## 总结\n\n如果我们发现自己在常见的根节点模式上犯了错误，那么 Sensei 可以帮助我们将检测和修复该问题的知识代码化。这样，希望它就不会再逃过代码审查并进入生产环境。\n\
  \n有时我们编写的配方识别的是启发式模式，也就是说匹配这些模式并不保证存在问题，但很有可能存在问题。\n\n我们编写的配方和 Quick Fix 不需要完全完备，但它们需要足够好，帮助我们识别并修复问题，而不会过于复杂。当它们变得过于复杂时，它们会变得难以理解和难以维护。\n\
  \n## 下一步骤\n\n- 安装 Sensei\n- 学习一些示例\n- 阅读文档\n- 实验\n\n## 安装 Sensei\n\n如果你还没有安装，请安装\
