  \ 下载并安装 Sensei。我们推荐通过 IntelliJ 偏好设置中的插件管理器进行安装（只需搜索“Sensei secure code”即可找到它）。\n\
  \n我们还在 Intellij Marketplace 上创建了一份入门指南 - [入门介绍页](https://scw.buzz/3rveXvC)。\n\n\
  一旦你下载并安装了 Sensei，要让它为你服务的最简单方法是观察你的编码过程并考虑：\n\n*   你经常需要查阅哪些文档？\n    *   你可以添加一些\
  \ Sensei 配方（recipes），将它们链接回这些文档。\n*   你总是在犯哪些简单错误？\n    *   你可以临时地将那种糟糕的编码模式代码化为一个匹配器（matcher），并编写一个\
  \ `Quick Fix` 重写程序，将代码修正为你真正想写的样子。\n*   使用某个库时，你需要编写哪些样板代码？\n    *   你可以创建一个 `Quick\
  \ Fix` 规则来为你编写代码。\n\nSensei 的设计旨在与你正在使用的任何静态分析工具协同工作。这意味着，如果你发现静态分析报告了相同的违规项，那么你可以在\
  \ Sensei 配方中复制该条件。然后你可以添加一个 `Quick Fix`，帮助训练自己不仅能识别错误，还能快速切换到编写正确的代码。\n\n## 什么是静态分析？\n\
  \n静态分析是在不执行应用程序的情况下对源代码进行自动化分析。\n\n当分析在程序执行期间进行时，则被称为动态分析（Dynamic Analysis）。\n\n\
  静态分析通常用于检测：\n\n*   安全漏洞。\n*   性能问题。\n*   不符合标准的情况。\n*   使用了过时的编程结构。\n\n### 静态分析工具是如何工作的？\n\
  \n所有静态分析工具的共同基本概念是搜索源代码，以识别出带有某种警告或信息的特定编码模式。\n\n这可能简单如“JUnit 5 测试类不需要声明为‘public’”，也可能是复杂的识别类问题，例如“在\
  \ SQL 执行语句中使用了不可信的字符串输入”。\n\n静态分析工具在实现此功能的方式上各不相同：\n\n*   使用源代码解析技术来创建抽象语法树 (`AST`)；\n\
  *   文本正则表达式匹配；\n*   或是上述两者的结合。\n\n文本的正则表达式匹配非常灵活，且易于编写匹配规则，但往往会导致大量的误报，而且匹配规则忽略了周围代码的上下文。\n\
  \n`AST` 匹配将源代码视为程序代码，而不仅仅是填充了文本的文件。这允许进行更具体的、基于上下文的匹配，并可以减少针对代码报告的误报数量。\n\n### 持续集成中的静态分析\n\
  \n静态分析通常在持续集成（CI）过程中执行，以生成合规性问题报告，通过审查这些报告可以获得代码库随时间推移的客观视图。\n\n有些人将静态分析作为代码质量的客观衡量，通过配置静态分析工具仅测量代码的特定部分，并仅报告规则的子集。\n\
  \n客观性是由所使用的规则提供的，因为这些规则对代码的评估不会随时间推移而改变。显然，所使用的规则组合及其配置是一个主观性决策，不同的团队会在不同时间选择不同的规则。\n\
  \n在 CI 中执行静态分析是有用的，但可能会推迟给程序员的反馈。程序员在编码时并不会收到反馈，而是在代码通过静态分析工具运行后后才会收到反馈。在 CI 中运行静态分析的另一个副作用是结果更容易被忽略。\n\
  \n为了帮助团队更加关注静态分析的结果，通常可以在构建过程中配置一个阈值指标，如果指标超过该阈值则导致构建失败，例如触发的规则数量。\n\n### IDE 中的静态分析\n\
  \n为了更快地接收反馈，有很多 IDE 插件可以根据需要或随着代码更改定期在 IDE 中运行静态分析规则。\n\n这样，程序员在编写代码时，就可以在 IDE 中看到规则违规项；为了让规则难以被忽略，违规项通常可以配置为渲染为编辑器中带下划线的代码。\n\
  \n我个人发现这是一个改进我编码的有用方法，特别是在处理被静态分析工具覆盖的新库时。尽管它可能会由于误报而产生“噪音”，或者包含一些对你不感兴趣的规则。但这可以通过多花一个步骤，配置静态分析工具来忽略某些规则来解决。\n\
  \n### 根据静态分析规则修复代码\n\n对于大多数静态分析工具，修复规则的工作被留给了程序员，因此他们必须理解规则违规的原因以及如何修复它。\n\n极少数静态分析工具也包含修复违规项的能力，因为修复通常取决于团队、所用技术以及他们约定的编码风格。\n\
  \n### 默认规则\n\n当静态分析工具带有默认规则时，可能会对规则的质量产生盲目的自信。人们很容易相信这些规则涵盖了程序员可能遇到的所有问题以及规则应该适用的所有情况。有时，规则应该适用的情况可能是微妙的，并且并不容易检测。\n\
  \n我们希望，通过使用静态分析工具并更详细地研究规则和违规项，程序员将开发出在特定领域背景下检测并避免问题的技能。\n\n当领域需要上下文相关的规则时，静态分析工具可能没有任何匹配你领域或库的规则。此外，这些工具通常难以配置和扩展。\n\
  \n### 困扰之处\n\n这些“困扰”并不是不可逾越的。它们包括：\n\n*   误报\n*   缺乏修复方案\n*   忽略规则的配置\n*   添加特定上下文的规则\n\
  \n它们经常被用作避免使用分析工具的借口，这非常遗憾，因为使用静态分析可以极大地帮助：\n\n*   向初级展示更好的方法。\n*   对清晰的编码违规获得快速反馈。\n\
  *   识别程序员尚未遇到的问题。\n*   强化程序员已采用良好方法（在没有报告违规时）。\n\n## 基于 IDE 的静态分析工具\n\n作为项目的个人贡献者，我喜欢在\
  \ IDE 内部运行静态分析工具，以便对我的代码获得快速反馈。\n\n这补充了项目可能有的任何评审流程和 CI 集成。\n\n我尝试识别那些能给我优势并改进我个人工作流的工具。\n\
  \n当工具在 IDE 中运行时，由于它们通常共享相同的界面和配置方法，人们很容易将它们等同看待。\n\n工具之间可能存在重叠的功能或规则集。为了获得最大优势，我安装多个工具来利用它们的各自长处。\n\
  \n我在编码时积极使用的静态分析 IDE 工具包括：\n\n*   内置的 IntelliJ Inspections - 常见的编码模式。\n*   `SpotBugs`\
  \ - 常见的错误。\n*   `SonarLint` - 常见的用法。\n*   `CheckStyle` - 常见的样式。\n*   来自 Secure Code\
  \ Warrior 的 `Sensei` - 自定义规则创建。\n\n我使用它们是因为它们配合良好。\n\n如果你使用 IntelliJ，那么你已经在使用他们的检查（Inspections）了。\n\
  \n这些是在 IDE 中标记的静态分析规则。其中一些还有 `QuickFix` 选项，可以重写代码以解决问题。\n\n\n\n\n规则可以开启或关闭，并可以选择用于在\
  \ IDE 中高亮它的错误级别。\n\n![](img/Image00002.jpg)\n\n有很多优秀的 IntelliJ 检查（Inspections）。我知道这一点是因为我在写这些内容时通读了它们。我将\
  \ IntelliJ 检查作为默认设置且没有进行配置，但为了充分利用这些检查的价值，你应该通读它们，识别出与你的编码风格相关的项，并配置警告级别，以便在代码中注意到它们。\n\
  \nIntelliJ 检查的伟大之处在于它们随 IDE 免费提供，并且可以帮助建立以下肌肉记忆：\n\n* 在编写代码时注意到源码中的警告和错误。\n* 将鼠标悬停在被标记的代码上以学习规则违规情况。\n\
  * 使用 `alt+enter` 为问题应用 `QuickFix`。\n\n![](img/Image00003.jpg)\n\n### SpotBugs\n\n\
  [SpotBugs](https://plugins.jetbrains.com/plugin/14014-spotbugs) IntelliJ 插件使用静态分析来尝试提醒你代码中的\
  \ bug。\n\n可以从 IntelliJ 偏好设置（Preferences）配置 SpotBugs 来扫描你的代码。实际使用的规则可以在 `Detector`\
  \ 标签页中找到。\n\n![](img/Image00004.jpg)\n\n我倾向于在编写并审查代码后使用 SpotBugs。我会运行 `Analyze Project\
  \ Files Including Test Sources`。\n\n![](img/Image00005.jpg)\n\n这确实帮助我识别 bug、死代码以及明显的优化点。它还迫使我研究一些被标记的违规项，帮助我决定如何处理。\n\
  \nSpotBugs 会发现问题，但没有提供任何尝试解决问题的 `QuickFix` 动作。\n\nSpotBugs 很容易配置，我发现它是我在 IDE 中咨询的非常有用的客观第二意见。\n\
  \n### SonarLint\n\n[SonarLint](https://plugins.jetbrains.com/plugin/7973-sonarlint)\
  \ 插件。\n\n可以从 IntelliJ 偏好设置配置 SonarLint，以选择代码针对哪些规则进行验证。\n\n![](img/Image00006.jpg)\n\
  \n默认情况下，SonarLint 实时运行，并显示你正在编辑当前代码的问题。\n\nSonarLint 不提供快速修复（quick fixes），但与违规报告相关的文档通常是清晰且记录良好的。\n\
  \n我发现 SonarLint 在过去非常有用，它能提醒我在较新版本的 Java 中才熟悉的 Java 特性。\n\n### CheckStyle\n\n[CheckStyle](https://plugins.jetbrains.com/plugin/1065-checkstyle-idea)\
  \ 插件提供了格式和代码质量规则的混合。\n\nCheckStyle 插件内置了 `Sun Checks` 和 `Google Checks`。\n\n这些定义可以很容易[在线找到](https://checkstyle.sourceforge.io/style_configs.html)。\n\
  \n当一个项目花费时间创建了自己的规则集时，CheckStyle 增加的价值最大。此时，可以配置 IDE 插件来使用该规则集，程序员可以在提交代码到 CI 之前进行扫描。\n\
  \nCheckStyle 经常用作 CI 过程的构建失败插件，当 CheckStyle 违规数量超过阈值时。\n\n### Sensei\n\n[Sensei](https://scw.buzz/38n5uPu)\
  \ 使用基于抽象语法树 (`AST`) 的静态分析来匹配代码并创建 `Quick Fixes`，这允许对有问题的代码进行特定的识别。\n\n`AST` 允许与配方（recipe）相关的\
  \ `Quick Fixes` 理解周围的代码，例如，当在代码中添加新类时，该类的任何 import 仅会被添加到源文件中一次，而不是每次替换都添加一次。\n\n\
  Sensei 的创建是为了方便构建自定义匹配规则，这些规则在其他工具中可能不存在，或者很难配置。\n\n与其修改配置文件，所有配置都可以在 GUI 中完成。在创建新配方时，GUI\
  \ 可以让你轻松看到该配方匹配哪些代码。在定义 `Quick Fixes` 时，可以立即比较代码的修改前之后的状态。这使得创建非常有上下文的配方变得更容易，即针对特定团队、技术甚至是个人程序员的配方。\n\
  \n![](img/Image00007.jpg)\n\n我将 Sensei 与其他静态分析工具结合使用，例如大多数静态分析工具会发现问题但不修复它们。Sensei\
  \ 的常见用例是在 Sensei 中复制其他工具的匹配搜索，并用 `Quick Fix` 将其扩展。这样做的好处是，所应用的自定义修复已经符合你项目的编码标准。\n\
  \n我经常发现自己创建了已经在 IntelliJ 意图（Intensions）集中存在的 Sensei 配方，因为意图报告并不完全符合我创建的上下文，或者因为\
  \ IntelliJ 提供的 `QuickFix` 不匹配我想要使用的代码模式。\n\n我是在增强现有的工具，而不是尝试完全取代它们。\n\n当你识别出常用规则的上下文变体时，Sensei\
  \ 也非常有用，例如，如果你在使用一个静态分析工具不支持的 SQL 库，但静态分析引擎中的常用 SQL 规则仍然适用，那么你可以使用 Sensei 创建这些规则的特定库变体。\n\
  \nSensei 并不是开箱即用提供像上述静态分析工具那样的通用配方，它的优势在于可以轻松创建新配方，并带有配置好以匹配你特定编码风格和用例的 `Quick Fixes`。\n\
  \n*注意：我们正在维护一个公共配方仓库，[你可以在这里找到](https://scw.buzz/30pkFN)。\n\n## 总结\n\n我结合使用所有提到的工具：\n\
  \n* IntelliJ 意图帮助开箱发现常见问题，通常带有 `QuickFix`。\n* SpotBugs 发现我可能错过的 bug 并提醒我性能问题。\n\
  * SonarLint 识别我未知的 Java 特性，并提醒我建模代码的其他方式。\n* CheckStyle 帮助我符合约定的编码风格，该风格在 CI 期间执行。\n\
  * Sensei 帮助我创建针对静态分析发现的常见场景的 `Quick Fix`，并创建难以配置的特定项目或技术配方。\n\n## 示例仓库\n\n我们在 GitHub\
  \ 上创建了一些示例仓库，可能对学习 Sensei 有用。\n\n* [sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
  \n### 博客示例\n\n该项目包含用于实验的示例配方的代码。\n\n* [github.com/SecureCodeWarrior/sensei-blog-examples](https://scw.buzz/3cixLrq)\n\
