  \n## 实验\n\n当你创建帮助改进自身流程或将团队知识代码化的配方时，Sensei 产生的价值最大。\n\n你可能想要尝试的几件事：\n\n- 复制一些静态分析工具警告你的某些规则，但为你应用过的最常用的代码更改创建一个\
  \ QuickFix。\n- 创建一些辅助代码，为你经常使用的某些库生成样板代码。\n- 对你在编码时会犯的错误类型做笔记。创建一个带有修复方案的配方，帮助你下次避免此类问题。\n\
  \n## 总结\n\n[公共菜谱](https://scw.buzz/30pk1FN) 索引列出了你可以立即使用的配方。然而，Sensei 的最大价值在于你创建配方，帮助你根据自己所用技术的标准编写出更高质量的代码。\n\
