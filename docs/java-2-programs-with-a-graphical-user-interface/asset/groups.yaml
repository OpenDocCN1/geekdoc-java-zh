    LAYOUT AND THE COMPONENT''S SIZE


    # 6 LAYOUT AND THE COMPONENT''S SIZE


    As shown in the above examples, a component''s size and location is determined
    by the so-called layout managers, and the result is not always so easy to figure
    out. In this section I will explain in part how a component''s size is calculated,
    and where it is placed in the window. When there is a lot to tell it is due to
    a desire that the window and its components should behave sensibly if the window
    size changes. If, for example you consider the above program several of the components
    changes when the window is resized, while others follows the window''s right edge.
    It is controlled by layout managers, which determines how the components of a
    window or panel are.


    # 6.1 THE COMPONENT''S SIZE


    A component has a size which is determined by a width and a height, and to define
    and modify these values a component has four methods


    +   - setSize()

    - setPreferredSize()

    - setMinimumSize()

    - setMaximumSize()


    These methods all have a parameter of the type Dimension, however, the first has
    an overloading, where the parameters are two int values. The first has only effect
    if the panel is not using a layout manager. In all other cases it is ignored.
    There is because a Frame Window does not have a layout manager. In practice components
    almost always placed in a panel using one or more layout managers, and here it
    is the last three methods, which are the interesting. The main rule is that a
    layout manager will try to customize a component''s size to its preferred size,
    but the manager will not reduce component size to below its minimum size and not
    increase the size to more than its maximum size. There are three sizes attached
    to a component, but the whole thing is complicated because these quantities are
    determined by the specific layout manager. As a start is shown below the code
    for a window with 6 buttons:


    ```

    package layoutplanes;


    import java.awt.*;

    import java.awt.event.*;

    import javax.swing.*;

    import javax.swing.border.*;

    ```


