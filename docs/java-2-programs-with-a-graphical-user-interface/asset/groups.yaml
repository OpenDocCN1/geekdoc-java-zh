- md: "\n## JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE\n\nThe various components\
    \ can fire an event when an action occurs, and in the previous examples I have\
    \ shown and used, how a button can fire an ActionEvent when clicked, and how this\
    \ event can be caught and handled by an ActionListener. In this example I will\
    \ use that\n\n- A JTextField can fire a FocusEvent, when it gets the focus (when\
    \ the user selects the field by the tab key or the mouse), and when lost (when\
    \ the user leave the field). These events can be caught with a FocusListener.\n\
    - A JComboBox firing an ActionEvent, when the selection is changed (when the user\
    \ select another element), that can be caught with an ActionListener.\n- A JCheckBox\
    \ and a RadioButton firing a ChangeEvent, when the state is changed, it and can\
    \ be caught with a ChangeListener.\n- A JSlider fires a ChangeEvent, when the\
    \ value is changed, and it can be caught with a ChangeListener.\n\nWith this knowledge\
    \ the event handlers can be written. They are except for a single simple, and\
    \ they are written as anonymous classes in method addListeners():\n\n```java\n\
    private void addListeners()\n{\n    txtText.addFocusListener(new FocusListener()\
    \ {\n        public void focusLost(FocusEvent e)\n        {\n            lblText.setText(txtText.getText());\n\
    \        }\n        public void focusGained(FocusEvent e)\n        {\n       \
    \ }\n    });\n    txtSize.addFocusListener(new FocusListener() {\n        public\
    \ void focuslost(FocusEvent e)\n        {\n            try\n            {\n  \
    \              int t = Integer.parseInt(txtSize.getText());\n                if\
    \ (t > 5)\n                {\n                    lblText.setFont(createNewFont());\n\
    \                    return;\n                }\n            } catch (Exception\
    \ ex)\n            {\n            }\n            txtSize.setText(\"\" + size);\n\
    \        }\n    });\n```\n\n### MORE COMPONENTS\n\n```java\npublic void focusGained(FocusEvent\
    \ e)\n{\n    size = Integer.parseInt(txtSize.getText());\n}\n\nlFont.addActionListener(new\
    \ ActionListener() {\n    public void actionPerformed(ActionEvent e)\n    {\n\
    \        lblText.setFont(createNewFont());\n    }\n});\nchkBold.addChangeListener(new\
    \ ChangeListener() {\n    public void stateChanged(ChangeEvent e)\n    {\n   \
    \     lblText.setFont(createNewFont());\n    }\n});\nchkItalic.addChangeListener(new\
