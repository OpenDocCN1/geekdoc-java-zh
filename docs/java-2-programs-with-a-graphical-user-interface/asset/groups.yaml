    ## 前言


    本书是软件开发系列书籍中的第二本。编程语言是 Java，语言及其语法和语义填充了大量内容……本书的主题是介绍带有图形用户界面的程序开发，因此也是对 Swing
    的介绍。带有图形用户界面的程序称为 GUI 程序。Swing 是 Java 用于开发 GUI 程序的 API。Swing 功能非常详尽，在《Java 9》书中首次详细介绍，而本书的目标是尽可能地介绍
    Swing，让读者能够编写具有实际意义的小型应用程序。本书假设读者已具备与本系列中《Java 1》书籍对应的 Java 基础知识，但目标是让读者接触图形用户界面的开发，本书跳过了许多面向对象的概念，这些概念自然是关于
    GUI 编程书籍的一部分。这些概念将在系列中的下一本书中详细讨论。


