- md: "\n# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE LAYOUT AND THE COMPONENT'S\
    \ SIZE\n\n```java\nprivate void delete(ActionEvent e) {\n  model.clear();\n  clear(e);\n\
    }\n```\n\nThe window contains this time many components:\n\n- 8 label components\
    \ that are objects of the type JLabel\n- 8 input fields that are objects of the\
    \ type JTextField\n- 2 radio buttons that are objects of the type JRadioButton\n\
    - 1 list box that is an object of the type JList\n- 4 buttons that are objects\
    \ of the type JButton\n\nIf you start at the top, there is a model for the list\
    \ box and a last object should be used for the radio buttons that are attached\
    \ to a ButtonGroup. This ensures that only one radio button can be pressed. Next,\
    \ are defined the components that you could refer to in the event handlers. It\
    \ is the input fields and the two radio buttons (actually only one of them). Final\
    \ is defined variables to the values of the input fields.\n\n> “I studied English\
    \ for 16 years but...I finally learned to speak it in just six lessons\"\nJane,\
    \ Chinese architect\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_83_0.png)\n\n\
    Download free eBooks at bookboom.com Click on the ad to read more\n\n# JAVA 2:\
    \ PROGRAMS WITH A GRAPHICAL USER INTERFACE LAYOUT AND THE COMPONENT'S SIZE\n\n\
    The class has several auxiliary methods:\n\n- createLabel() is a simple method\
    \ that creates a label with a preferred size.\n- createField() creates in the\
    \ same way an input field. It has a parameter that specify where the content can\
    \ be edited. That is where the field should be used for input or it should be\
    \ used to show a value. You note that the content is right aligned.\n- createRadio()\
    \ is a method that creates a radio button. It has a parameter that tells if the\
    \ button should be checked, and also the group is a parameter. The group is required,\
    \ because a window may have more groups of radio buttons.\n- createButton() is\
    \ a method that creates a button and there are parameters for the text, and the\
    \ event handler.\n- createList() creates the list box and encapsulates the list\
    \ box in a JScrollPane, so you will be able to scroll the content.\n\nFurthermore,\
    \ there are defined four event handlers for the four buttons:\n\n1. calc() is\
    \ event handler to the button Calculate. When pressing retrieves the contents\
    \ of the input fields respectively the number of units and the unit price and\
    \ converts the values and stored them in the respective variables. If entered\
    \ legal values, the VAT if necessary pulled out of the unit price, and otherwise\
    \ the product amounts and VAT are calculated and the corresponding fields are\
    \ updated. Are the values of the one reason or another illegal, you get an error\
    \ message.\n2. clear() is event handler to the Clear button, and it clears the\
    \ input fields and fields to the result and sets the variables for the calculation\
    \ to zero.\n3. ok() is event handler for the OK button. If there is a calculation,\
    \ the method adds a line to the list box for the fields for the totals. The method\
    \ also call the handler clear() and clears the calculation fields.\n4. delete()\
    \ is event handler to the Delete button and clears the list box.\n\nNow there's\
    \ the method createWindow(), and that is where it happens. To add a component\
    \ method uses a method called addComponent(). This method creates a GridBagConstraints\
    \ object and initialize it using parameters. This object is attached to the component,\
