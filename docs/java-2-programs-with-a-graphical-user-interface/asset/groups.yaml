    intensity has a value between 0 and 255, and the number of possible colors is


    ```

    256^3 = 16777216

    ```


    The following table shows some examples of color encodings


    | R | G | B | Farve |

    |---|---|---|---|

    | 0 | 0 | 0 | Black |

    | 255 | 255 | 255 | White |

    | 255 | 0 | 0 | Red |

    | 0 | 255 | 0 | Green |

    | 0 | 0 | 255 | Blue |

    | 255 | 255 | 0 | Yellow |

    | 128 | 128 | 128 | Gray |


    You need to specifically the last encoding, where the same value for all intensities
    provides a grayscale. In Java you can define a color as an object to the type
    Color intensities to the constructor. It is used in the label that sits center
