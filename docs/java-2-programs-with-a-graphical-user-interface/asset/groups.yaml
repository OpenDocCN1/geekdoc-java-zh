    I''ll start with the method createLabel(), which creates and returns a component
    of the type JLabel. It is a component that shows a text. The method has 6 parameters:


    +   - The first is the text.

    - The next is the background color, which is an object of type Color.

    - The third is the foreground color and the text color. It is likewise an object
    of type Color.

    - The fourth parameter is the font, which is an object of type Font.

    - The last two parameters are respectively the width and height of the component.


    The method''s statements are enough to figure out, but you must again note how
    to define the size of a component with setPreferredSize(). A JLabel is shown with
    transparent background by default, and therefore cannot have a background color
    unless you say that the background should not be transparent. This is done with
    setOpaque().


    A window is default born with a BorderLayout, and you can immediately add 5 components,
    as happens in the method createWindow().


    A BorderLayout as mentioned in a window/ panel 5 areas, all respectively NORTH,
    EAST, SOUTH, WEST and CENTER, with the latter as default. Each region may contain
    a single component, but may also be empty. If so, the area fills the screen. An
    area contains a component, the following applies concerning the size:


    +   - NORTH: The width is the width of the panel, and the height is determined
    by the component''s height defined by its preferred size. The width of the component
    in terms of its preferred size is ignored.

    - SOUTH: The width is the width of the panel, and the height is determined by
    the component''s height defined by its preferred size. The width of the component
    in terms of its preferred size is ignored.

    - WEST: The height is the height of the panel minus the height that is used to
    NORTH and SOUTH, and the width is determined by the component''s width defined
    by its preferred size. The component''s height in terms of its preferred size
    is ignored.

    - EAST: The height is the height of the panel minus the height that is used to
    NORTH and SOUTH, and the width is determined by the component''s width defined
    by its preferred size. The component''s height in terms of its preferred size
    is ignored.

    - CENTER: The width is the width of the panel minus the width used by the WEST
    and EAST, and the height is the height of the panel minus the height that is used
    to NORTH and SOUTH. The height of the component''s preferred size is ignored.


