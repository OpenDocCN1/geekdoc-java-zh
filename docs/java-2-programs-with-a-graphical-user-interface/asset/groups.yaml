  mdcn: "\n\n# JAVA 2：带有图形用户界面的程序\n\n如果我从最后一个开始，它创建了一个带有 `FlowLayout` 布局器的 `JPanel`。它是一种布局管理器，其中组件水平流向。在这种情况下，我指定了组件必须对齐到右边缘。在创建面板后，我添加了两个按钮之一（一个用于删除列表框）。结果是，你在窗口的右下角得到了一个按钮，但由于这两个布局属性，当窗口大小改变时，组件将填充窗口的底部和右边缘。\n\
    \n`createTop()` 方法在顶部创建一个组件：一个带有布局器的 `JPanel`，它左侧有一个标签（label），右侧有一个按钮，中间有一个输入框。这三个组件通过\
    \ `BorderLayout` 放置，其中输入字段 `txt` 被放置在 `CENTER`（中心）。由于 `CENTER` 区域总是会填充所有空间，布局的结果是：输入字段将始终填充面板中未被其他两个组件使用的部分，并根据窗口宽度进行调整。你应该注意面板是按如下方式的：\n\
    \n```\nJPanel panel = new JPanel(new BorderLayout(10, 10));\n```\n\n在这里你指定了 `BorderLayout`\
    \ 类构造函数的参数，即组件之间应该留多少空隙。\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_14_0.png)\n\
    \n你喜欢汽车吗？你想成为成功品牌的一员吗？\n我们将感谢并奖励你的热情和才华。\n向我们发送你的简历。它能带去的地方将让你大惊讶。\n\n在 www.employerforlife.com\
    \ 向我们发送你的简历\n\n在 bookboom.com 下载免费电子书\n\n点击广告阅读更多\n\n`createCenter` 方法创建列表框。当你将列表框分配给数据模型时——一种\
    \ `DefaultListModel` 类型**——该模型必须包含列表框应该显示的数据。该方法创建一个带有 `BorderLayout` 的 `JPanel`，并分别分配空标签\
