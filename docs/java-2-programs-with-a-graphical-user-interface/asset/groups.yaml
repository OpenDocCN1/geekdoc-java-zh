    user interface and thus also an introduction to Swing. Programs with a graphical
    user interface are also called GUI programs. Swing is Java''s API for the development
    of GUI programs. Swing is extensive and is first treated in detail in the book
    Java 9, and the goal of the current book is to present as much of Swing, that
    the reader will be able to write small applications that have practical interest.
    The book assumes a basic knowledge of Java corresponding to the book Java 1 of
    this series, but the objective is that the reader should be introduced to the
    development of a graphical user interface the book bypasses many object-oriented
    concepts, which naturally are part of a book about GUI programming. These concepts
    are discussed in detail in the next book in the series.


    The title says this series of books deals with software development, and the goal
