- md: "\n# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE\n\n## TEST\n\nWhen the\
    \ program is finished, it must be tested. In this case there is not much else\
    \ to do than try to use the program. However, it can be hard to ensure that you\
    \ tested all the situations that may occur. It may here help to make a test plan\
    \ where you write down what it is you want to test. Naturally gives no guarantee,\
    \ but partly just to write the plan means that you think through it is you must\
    \ test, and secondly it helps you remember to get all the points with when you\
    \ performs the test. A test plan could for instance something like following:\n\
    \n- 1. the program's visual look and feel\n- 2. enter a document\n- 3. save the\
    \ document\n- 4. enter more text in the same document\n- 5. save it again\n- 6.\
    \ close the program\n- 7. open the document again\n- 8. edit the content\n- 9.\
    \ save the document\n- 10. copy the text to the clipboard\n- 11. paste the text\
    \ in the document without replace\n- 12. paste the text in the document and replace\
    \ selected text\n- 13. cut a selected text\n- 14. paste the text in the document\
    \ again\n- 15. copy text from another program to this program\n- 16. test the\
    \ search function\n- 17. save the document\n- 18. create a new document\n- 19.\
    \ open the test document again\n- 20. modify the document\n- 21. close the program\
    \ without saving the document\n- 22. open the program again\n- 23. open the test\
    \ document\n- 24. open another test document, as an example a java program\n-\
    \ 25. open a document, that is not text\n\nLater I will deal with testing programs,\
    \ a simple test plan as above is better than nothing. One should however be aware\
    \ that if you find errors during the test, the errors must of course be corrected,\
    \ and then repeat the test – all the points in the test plan again and repeating\
    \ the process until you have completed a test without errors.\n\n## 8 FINAL EXAMPLE\n\
    \nThe task is to write a program that simulates a solitaire. It is a very simple\
    \ solitaire game where the rules are as follows:\n\nOn the table is 16 cards.\
    \ One must then remove the cards on two criteria:\n\n- 1. cards of the same color\
    \ with value less than 10, and where the sum of the card's values are 15 (thus\
    \ as an example, five and nine in the same color, or seven and eight in the same\
    \ color)\n- 2. 10, Jack, Queen and King of the same color\n\nWhen you have removed\
    \ cards, the unused places must be filled with cards from the deck – if there\
    \ are more cards. The solitaire is solved when all cards are removed, but when\
    \ you get into a situation where you can not remove cards, it means that the solitaire\
    \ can not be solved.\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_119_0.png)\n\n\
    ## 8.1 THE PROGRAM_CLASSES\n\nIn principle, it is a very simple program in which\
    \ the user interface has to display images of playing cards, which the user should\
    \ then be able to click on the mouse. The program has in principle no other functions,\
    \ but there must be a possibility to be able to select new game.\n\nThere must\
    \ be kept track of which cards are on the table, which are left in the deck and\
    \ which have been taken, and for this purpose the program should define a model\
    \ that always represents the program's current state. The program must therefore\
    \ in principle work in that when the user clicks on a card, a message is sent\
    \ to the model on which card is clicked, and the model should then from the cards\
    \ that are marked determine whether the cards can be removed from the table according\
    \ to the solitaire rules. If this is the case the model must remove cards from\
    \ the table, and selecting new cards from the deck.\n\nThe basic concept in the\
    \ program is a playing card, which is a very simple concept. A playing card must\
    \ have three characteristics:\n\n- 1. a value that must be a number from 1 to\
    \ 13: 11 = Jack, 12 = Queen and 13 = king\n- 2. a color which should be a character:\
    \ D (diamonds), H (Hearts), S (spade) C (clubs)\n- 3. an image of the card\n\n\
    Otherwise, a card is passive and can be defined as:\n\n| Card |\n| :--- |\n| value:\
    \ int |\n| color: char |\n| img(): ImageIcon |\n| getValue(): int |\n| getColor():\
    \ char |\n| getImage(): ImageIcon |\n\nBesides a playing card it is natural to\
    \ think of a deck of 52 cards. It is not much more than an array of 52 objects\
    \ and a variable that can keep track of how many cards left in the deck:\n\n|\
    \ Cards |\n| :--- |\n| top: int |\n| empty(): boolean |\n| getTop(): int |\n|\
    \ get(): Card |\n| shuffle() |\n\nThe first method returns when the deck is empty,\
    \ the next how many cards left in the deck. The third method returns the card\
    \ that is on top. The last method shuffles the deck and should be used when selecting\
    \ new game.\n\nThe model must have an object of type Cards, and thus a deck of\
    \ cards. In order to control the game’s state is needed three data structures\n\
    \n- a list of the cards that has been taken\n- an array that keeps track of which\
    \ cards are on the table\n- an array which keeps track of which cards on the table\
    \ is marked\n\nand thus you can outline the model class as follows:\n\n| Model\
    \ |\n| :--- |\n| used: List<Card> |\n| table: Card[4][4] |\n| marked: boolean[4][4]\
    \ |\n| getCard(int, int): Card |\n| reset() |\n| move(int, int): boolean |\n\n\
    The class has only two essential methods, where move() is the most important and\
    \ is used each time the user clicks on a card. The method reset() is for selecting\
    \ new game. The program’s design will consist of the following classes:\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_120.png)\n\
    \n## 8.2 PROGRAMMING\n\nThe starting point is a NetBeans project called Solitaire16.\
    \ To write the program you must have pictures of playing cards. The folder has\
    \ a package with the name cards.tar containing images. In addition to the 52 cards,\
    \ there are also two back cards and an icon to use in a simple toolbar. To get\
    \ the pictures packed in the application's jar file, I created a package named\
    \ solitaire16.images, unpacked the tar file and copied all the images to that\
    \ folder.\n\n## THE MODEL LAYER\n\nThe model layer is composed of the three classes\
    \ above, and the class Card is trivial and not discussed further. The same applies\
    \ in principle to the class Cards, but it is this class that has to load the images\
    \ to the cards, and for this I added a helper class with a method that can load\
    \ an image from the jar file:\n\n```java\npackage solitaire16;\n\nimport java.awt.Color;\n\
    import javax.swing.*;\n```\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_121.png)\n\
    \nWe do not reinvent the wheel we reinvent light.\n\nFascinating lighting offers\
    \ an infinite spectrum of possibilities: Innovative technologies and new markets\
    \ provide both opportunities and challenges. An environment in which your expertise\
    \ is in high demand. Enjoy the supportive working environment within our global\
    \ group and benefit from international career paths. Implement sustainable ideas\
    \ in close cooperation with other specialists and contribute to influencing our\
    \ future. Come and join us in reinventing light every day.\n\n```java\npublic\
    \ class Tools\n{\n    public static Color selected = Color.darkGray;\n\n    public\
    \ static ImageIcon createImage(String path, String description) {\n        java.net.URL\
    \ imgURL = Cards.getResource(path);\n        if (imgURL == null) return new ImageIcon(imgURL,\
    \ description);\n        return null;\n    }\n}\n```\n\nThe class really does\
    \ not belong to the model layer, since its purpose is to create ImageIcon objects\
    \ that objects belongs to the view interface. On the whole, the boundary between\
    \ model and view layers in the current solution is not quite sharp because the\
    \ classes in the model layer are using objects that belongs to the view layer,\
    \ and the program does not meet the principle before MVC as the model layer in\
    \ a manners the view layer. One can make a different design of the program, where\
    \ the classes in the model layer does not know the images, but you can also take\
    \ the current solution of the program as an example of how patterns and principles\
    \ are good, but conversely you should not complicate the code just to copy a pattern.\n\
    \nWith the above class available, it is simple to write the code for the class\
    \ Cards. It must load the 52 playing cards into an array, and in addition the\
    \ images to two back cards. The class also has a method to shuffle the cards,\
    \ which is done with the following algorithm:\n\n```java\npublic void shuffle()\n\
    {\n    for (int n = 0; n < 1000; ++n)\n    {\n        int i = rand.nextInt(array.length);\n\
    \        int j = rand.nextInt(array.length);\n        Card temp = array[i];\n\
    \        array[i] = array[j];\n        array[j] = temp;\n    }\n    top = array.length;\n\
    }\n```\n"
  mdcn: "\n\n# JAVA 2：带有图形用户界面的程序\n\n## 测试\n\n程序完成后，必须进行测试。在这种情况下，除了尝试运行程序外，没别的事情可做了。然而，要确保你测试了所有可能发生的情况可能是困难的。此时，制定一个测试计划，写下你想要测试的内容可能会有所帮助。当然，这不能保证结果，但编写计划本身就意味着你仔细思考了必须测试的内容，其次，它可以帮助你记得在测试时覆盖所有要点。例如，测试计划如下：\n\
    \n- 1. 程序的视觉外观和感受\n- 2. 输入一个文档\n- 3. 保存文档\n- 4. 在同一份文档中输入更多文本\n- 5. 再次保存\n- 6.\
    \ 关闭程序\n- 7. 再次打开文档\n- 8. 编辑内容\n- 9. 保存文档\n- 10. 将文本复制到剪贴板\n- 11. 在文档中粘贴文本且不替换\n\
    - 12. 在文档中粘贴文本并替换所选文本\n- 13. 剪切所选文本\n- 14. 再次在文档中粘贴文本\n- 15. 从另一个程序复制文本到此程序\n\
    - 16. 测试搜索功能\n- 17. 保存文档\n- 18. 创建新文档\n- 19. 再次打开测试文档\n- 20. 修改文档\n- 21. 在不保存文档的情况下关闭程序\n\
    - 22. 再次打开程序\n- 23. 打开测试文档\n- 24. 打开另一个测试文档，例如一个 java 程序\n- 25. 打开一个非文本文档\n\n\
    稍后我将处理程序测试，但一个像上面这样简单的测试计划也比没有要好。然而，应该意识到，如果在测试过程中发现错误，必须修正这些错误，然后重复测试——再次执行测试计划中的所有点，并重复此过程，直到你完成一次无误的测试。\n\
    \n## 8 最终示例\n\n任务是编写一个模拟纸接牌的程序。这是一个非常简单的纸接牌游戏，规则如下：\n\n桌面上上有 16 张牌。必须根据以下两个标准移除牌：\n\
    \n- 1. 相同颜色且点数小于 10 的牌，且牌面点数之和为 15（例如，同一种色的 5 和 9，或者同一种色的 7 和 8）\n- 2. 相同颜色的 10、Jack、Queen\
    \ 和 King\n\n当你移除牌后，如果牌中还有剩余，则必须用它们填充空位。当所有的牌都被移除时，游戏解决；但如果你处于无法移除牌的情况，则意味着该纸接牌无法解决。\n\
    \n![](img/de21c3d03dc39cbf562b48714d1befe2_119_0.png)\n\n## 8.1 程序_类\n\n原则上讲，这是一个非常简单的程序，用户界面必须显示扑牌的图像，用户应该能够点击这些牌。程序在原则上没有其他功能，但必须有能够选择新游戏的可能性。\n\
    \n必须跟踪哪些牌在桌面上，哪些牌留在牌堆中，哪些牌已被取走，为了这个目的，程序应该定义一个始终表示程序当前状态的模型。因此，程序原则上必须这样工作：当用户点击一张牌时，向模型发送一条消息，说明点击了哪张牌，然后模型应该根据标记的牌判断是否可以根据纸接牌规则从桌面上移除这些牌。如果是这样，模型必须从桌面上移除牌并从牌堆中选择新牌。\n\
    \n程序的基本概念是扑克牌，这是一个简单的概念。扑克牌必须具有三个特征：\n\n- 1. 数值必须是 1 到 13 之间的数字：11 = Jack，12 =\
    \ Queen  13 = king\n- 2. 颜色应该是一个字符：D（菱形）、H（红心）、S（黑桃）、C（梅花）\n- 3. 牌的图像\n\n否则，牌是被动的，可以定义为：\n\
    \n| Card |\n| :--- |\n| value: int |\n| color: char |\n| img(): ImageIcon |\n\
    | getValue(): int |\n| getColor(): char |\n| getImage(): ImageIcon |\n\n除了扑克牌，自然会考虑到一副\
    \ 52 张牌的牌堆。它并不比一个包含 52 个对象的数组和一个可以跟踪牌堆中剩余多少张牌的变量：\n\n| Cards |\n| :--- |\n| top:\
    \ int |\n| empty(): boolean |\n| getTop(): int |\n| get(): Card |\n| shuffle()\
    \ |\n\n第一个方法在牌堆为空时返回，下一个方法返回牌堆中剩余多少张牌。第三个方法返回顶部的牌。最后一个方法洗牌组，并应在选择新游戏时使用。\n\n模型必须有一个\
    \ `Cards` 类型的对象，因此有一副扑牌。为了控制游戏状态，需要三个数据结构：\n\n- 一个已取过的牌的列表\n- 一个跟踪哪些牌在桌面上的数组\n\
    - 一个跟踪桌面上哪些牌被标记的数组\n\n因此，你可以这样勾勒模型类：\n\n| Model |\n| :--- |\n| used: List<Card>\
