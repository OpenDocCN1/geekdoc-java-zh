    # LAYOUT AND THE COMPONENT''S SIZE


    # 6.5 GRIDBAGLAYOUT


    The next layout manager is a very flexible manager, but is also very complex to
    work

    As the names, it is a grid that divides a panel in row and columns, but such that

    all rows do not have to have the same height, and all the columns do not have
    to have

    t same width. The result is the same as in a GridLayout, the panel is divided
    into

    number of cells, but a component may span multiple cells. In addition to that

    is the exact size of the individual cells is determined by the component''s preferred
    size.

    How many the components fills, and how they behave when the window size is changed,

    is determined by a data structure called GridBagConstraints and an object of this
    kind

    associated with the individual components. This data structure has the following
    fields:


    +   1. grids and grid indicating the component''s column and row index in the
    panel as

    t upper left corner is (0, 0). You can also specify the value via GridBagConstraints.

    RELATIVE for both column and row, which means relative to the last component,

    placed in the panel. Default value for both columns and rows are GridBagConstraints.

    RELATIVE.


    +   2. gridwidth and gridheight indicating respectively how many columns and how
    many

    rows this component should span. The default value of both values is 1. For both

    values it is possible to specify GridBagConstraints.REMAINDER, which means

    t the component can span over the remainder of the row or the remainder of

    column.


    +   3. fill that indicates how the component should fill the cell if its preferred
    size is less

    t the size of the cell. You can specify GridBagConstraints.NONE, which means

    that the preferred size is used) GridBagConstraints.HORIZONTAL,GridBagConstraints.

    VERTICAL and GridBagConstraints.BOTH where the first is default.


    +   4. ipads and ipady indicating how much gap there be outside of the component.

    Default value is 0. You can think of this value as an edge on the component, but

    an internal edge is part of the area that is used for the component.


    +   5. insets that indicates an external margin and how much space, there be

    must be around the component. The value is an Insets object, and the default is

    no margin.


    +   6. weights and weighting how the the size will be distributed on respectively

    columns and rows. The impact of these values is a little difficult to interpret,

    they have a value between 0 and 1, where the default is 0. This means the

    width of columns and the height of the rows is the maximum preferred width and

    t maximum preferred height of the components in the column or row. If, for

    a component indicates a weight, this means that any free space in the panel should

    be distributed corresponding to these weights. The weights are central to

    how the components will behave when the window is resized.'
