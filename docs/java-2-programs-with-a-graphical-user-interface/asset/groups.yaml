    # 4 DIALOG BOXES


    In the above examples are each time a single window, but in practice, a GUI program
    have several many windows, and in this chapter I will show you how from a window
    can open another window. The main window is called a frame window, and is derived
    from the class JFrame. Another window, is usually a dialog box, which is a class
    derived from JDialog. I will show you program that has three windows:


    ![](img/de21c3d03dc39cbf562b48714d1befe2_33_0.png)


    Here is ModelAndView a usual frame window, which in this case must have two buttons,
    which are used to open each of the other two windows:


    ![](img/de21c3d03dc39cbf562b48714d1befe2_33_1.png)


    The window to the right is an example of a dialog box where you should enter a
    name (first name and last name):


    ![](img/de21c3d03dc39cbf562b48714d1befe2_33_2.png)


    It must be a modal dialog, and it means that when the dialog box is open, the
    other windows of the application does not have focus, and you can not interact
    with the other windows before this dialog box is closed.


