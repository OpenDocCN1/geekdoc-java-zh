    \     setVisible(true);\n    }\n\n    private void createWindow() {\n        setLayout(new\
    \ java.awt.GridLayout(10, 20));\n        for (int r = 0; r < 10; ++r) for (int\
    \ c = 0; c < 20; ++c) add(createLabel());\n    }\n\n    private JLabel createLabel()\
    \ {\n        JLabel label = new JLabel();\n        label.setOpaque(true);\n  \
    \      label.setBackground(new Color(rand.nextInt(256), rand.nextInt(256), rand.nextInt(256)));\n\
    \        return label;\n    }\n}\n```\n\nYou should note how, in the createWindow()\
    \ a GridLayout is created. The parameters, respectively the number of rows and\
    \ number of columns. You can also specify how much gap there should be between\
    \ the individual cells – both horizontally and vertically.\n\n# JAVA 2: PROGRAMS\
    \ WITH A GRAPHICAL USER INTERFACE\n\n# EXERCISE 6\n\nWrite a program that you\
    \ can call MiniCalc. The program must open a window as shown below. The window\
    \ has an input field and 20 buttons. The program should simulate a simple calculator\
    \ and should only be operated using the mouse. The input field is read only (use\
    \ method setEditable()), and the text is right-justified. The 10 top buttons should\
    \ be self-explanatory. The buttons in the third row are from left:\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_73_0.png)\n\
    \n- 1. remove the last character in the display\n- 2. exponentiation\n- 3. division\n\
    - 4. subtraction\n- 5. decimal point\n\nThe buttons in the bottom row are from\
    \ left:\n\n- 1. clear the display\n- 2. shift sign on the content in the display\n\
    - 3. multiplication\n- 4. addition\n- 5. enter, that calculates the value of the\
    \ expression in the display and update the display with the value\n\n# JAVA 2:\
    \ PROGRAMS WITH A GRAPHICAL USER INTERFACE LAYOUT AND THE COMPONENT'S SIZE\n\n\
    The program must validate that there are only added legal characters in the display\
    \ (character which leads to a legitimate expression). If you try to perform an\
    \ illegal calculation by clicking OK, you should get an error message as shown\
    \ below:\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_74_0.png)\n\nIt is obviously\
    \ a very simplified calculator, and you can only work with very simple expressions,\
    \ especially because you can not enter parentheses.\n\n![](img/de21c3d03dc39cbf562b48714d1befe2_74_1.png)\n\
    \n> \"In Denmark you can find great engineering jobs and develop yourself professionally.\
    \ Especially in the wind sector you can learn from the best people in the industry\
    \ and advance your career in a stable job market.\"\n\nMireia Mare,\nAdvanced\
    \ Engineer from Spain.\nWorking in the wind industry in Denmark since 2010.\n\n\
    ![](img/de21c3d03dc39cbf562b48714d1befe2_74_2.png)\n\nDownload free eBooks at\
    \ bookhoon.com Click on the ad to read more\n\n# JAVA 2: PROGRAMS WITH A GRAPHICAL\
    \ USER INTERFACE LAYOUT AND THE COMPONENT'S SIZE\n\n# 6.5 GRIDBAGLAYOUT\n\nThe\
    \ next layout manager is a very flexible manager, but is also very complex to\
    \ work. As the names, it is a grid that divides a panel in rows and columns, but\
    \ such that all rows do not have to have the same height, and all the columns\
    \ do not have to have the same width. The result is the same as in a GridLayout,\
    \ the panel is divided into number of cells, but a component may span multiple\
    \ cells. In addition to that is the exact size of the individual cells is determined\
    \ by the component's preferred size. How many the components fills, and how they\
    \ behave when the window size is changed, is determined by a data structure called\
    \ GridBagConstraints and an object of this kind associated with the individual\
    \ components. This data structure has the following fields:\n\n- 1. gridx and\
    \ gridy indicating the component's column and row index in the panel as the upper\
    \ left corner is (0, 0). You can also specify the value via GridBagConstraints.RELATIVE\
    \ for both column and row, which means relative to the last component, placed\
    \ in the panel. Default value for both columns and rows are GridBagConstraints.RELATIVE.\n\
    \n- 2. gridwidth and gridheight indicating respectively how many columns and how\
    \ many rows this component should span. The default value of both values is 1.\
    \ For both values it is possible to specify GridBagConstraints.REMAINDER, which\
    \ means the component can span over the remainder of the row or the remainder\
    \ of column.\n\n- 3. fill that indicates how the component should fill the cell\
    \ if its preferred size is less than the size of the cell. You can specify GridBagConstraints.NONE\
    \ (which means that the preferred size is used), GridBagConstraints.HORIZONTAL,\
    \ GridBagConstraints.VERTICAL and GridBagConstraints.BOTH where the first is default.\n\
    \n- 4. ipads and ipady indicating how much gap there be outside of the component.\
    \ Default value is 0. You can think of this value as an edge on the component,\
    \ but an internal edge is part of the area that is used for the component.\n\n\
    - 5. insets that indicates an external margin and how much space there must be\
    \ around the component. The value is an Insets object, and the default is no margin.\n\
    \n- 6. weights and weighting how the the size will be distributed on respectively\
    \ columns and rows. The impact of these values is a little difficult to interpret,\
    \ they have a value between 0 and 1, where the default is 0. This means that any\
    \ free space in the panel should be distributed corresponding to these weights.\
    \ The weights are central to how the components will behave when the window is\
    \ resized. The anchor as in the case where the component's preferred size is less\
    \ than the cell indicates where the component is to be placed in the cell.\n\n\
    \ GRAPHICAL USER INTERFACE LAYOUT AND THE COMPONENT'S SIZE\n\nThe above sounds\
    \ complicated, and it also takes some experimentation to get a GridLayout to behave\
    \ as desired. The starting point is to start with a sketch, which can illustrate\
    \ the window you want to design. In this case I would design a window where you\
    \ can enter the number of units and unit price of an item. One must also be able\
    \ to check whether unit price is entered with or without VAT. When you click on\
    \ a button, the program must calculate the total and VAT, and if you click on\
    \ another button, a line item is inserted in a list box. The options are shown\
    \ in the figure below, where the names all refer to the constants in GridBagConstraints:\n\
    \n| FIRST_LINE | CENTER | FIRST_END |\nWait, \"In this case I would design a window\
    \ where you can enter the number of units and unit price of an item. One must\
    \ also be able to check whether unit price is entered with or without VAT. When\
    \ you click on a button, the program must calculate the total and VAT, and if\
    \ you click on another button, a line item is inserted in a list box. The design\
    \ should be something like what is shown:\n\n| Number of units | |\n| Unit price\
    \ | |\n| * Unit price excl. VAT | |\n| * Unit price incl. VAT | |\n| Amount |\
    \ |\n| VAT | |\n| Total | Amount VAT |\n\nThe three fields under the list box\
    \ must contain totals for the product lines. The list box and the three fields\
    \ to the totals should follow the window size and the buttons should be positioned\
    \ relative to the bottom.\n\nJAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE\
    \ LAYOUT AND THE COMPONENT'S SIZE\n\nIn fact, it is a quite complex design and\
