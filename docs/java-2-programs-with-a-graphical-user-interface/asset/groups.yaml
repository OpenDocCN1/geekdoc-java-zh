    \ 方法实现的那样。事件处理器从输入字段中获取文本，如果文本不为空，处理器用文本更新列表框的模型，结果是输入的名称出现在列表框中。接下来，删除输入字段的内容，最后，该字段获得焦点，准备好输入新名称。`AddAction`\
