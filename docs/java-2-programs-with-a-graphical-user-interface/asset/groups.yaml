    # JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE


    # HELLO SWING


    The class has a method called createLabel(), which creates an empty label. A label
    is a component, and has the type JLabel, and it is a component that shows a text.
    In this case it is a blank text, but the important thing is that it has a size
    defined with setPreferredSize().


    Components are placed in a window using a layout manager, which is an object that
    determines the component''s size and position. A window (that is a JFrame) by
    default BorderLayout. A layout manager divides the window into 5 areas, and each
    area may contain a component. The five areas are


    +   1. NORTH, and it has always the same width as the window while the height
    is determined by the height of the component

    2. SOUTH, and it has the same width as the window while the height is determined
    by the height of the component

    3. WEST, the height is the height of the window, except for what is used for NORTH
    and SOUTH, while the width is determined by the width of the component

    4. EAST, the height is the height of the window, except for what is used for NORTH
    and SOUTH, while the width is determined by the width of the component

    5. CENTER, and it is the rest of the window


    If an area is empty – there is not a component in the area – it fills nothing
    and collapsed. It is important to note that a BorderLayout can contain only 5
    components.


    If you now consider the method createWindow(), it starts the method createLabel()
    to place a component in each of the four areas NORTH, SOUTH, WEST and EAST. The
    goal is to define a margin of 10 corresponding to the size of the components that
    are created with the method createLabel(). Next, the method creates a new component
    of the type JPanel. It is a component which in itself is not visible, but it has
    a layout manager (in this case a BorderLayout) and can contain other components.
    The component is called panel, and the last statement in the method createWindow()
    places the component CENTER in the window. Before it is filled with content using
    three methods, respectively createTop(), createCenter() and createBottom().'
