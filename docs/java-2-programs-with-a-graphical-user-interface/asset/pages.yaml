  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE


    # TEST


    When the program is finished, it must be tested. In this case there is not much
    else to do than try to use the program. However, it can be hard to ensure that
    you tested all the situations that may occur. It may here help to make a test
    plan where you write down what it is you want to test. Naturally gives no guarantee,
    but partly just to write the plan means that you think through it is you must
    test, and secondly it helps you remember to get all the points with when you performs
    the test. A test plan could for instance something like following:


    +   1. the program''s visual look and feel

    2. enter a document

    3. save the document

    4. enter more text in the same document

    5. save it again

    6. close the program

    7. open the document again

    8. edit the content

    9. save the document

    10. copy the text to the clipboard

    11. paste the text in the document without replace

    12. paste the text in the document and replace selected text

    13. cut a selected text

    14. paste the text in the document again

    15. copy text from another program to this program

    16. test the search function

    17. save the document

    18. create a new document

    19. open the test document again

    20. modify the document

    21. close the program without saving the document

    22. open the program again

    23. open the test document

    24. open another test document, as an example a java program

    25. open a document, that is not text


    Later I will deal with testing programs, a simple test plan as above is better
    than nothing. One should however be aware that if you find errors during the test,
    the errors must of course be corrected, and then repeat the test – all the points
    in the test plan again and repeating the process until you have completed a test
    without errors.'
