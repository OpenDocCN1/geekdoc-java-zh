    and the values for width and height where they are ignored are 0. It is not necessary
    and is only done to clarify that the values are not used.


    Otherwise note how you define colors and fonts. The Color class has a number of
    constants for frequently used colors, and most of the colors in the example are
    indicated by means of these colors. Colors are defined using three intensities
    of red, green and blue, and we talk about this color coding as RGB colors. Each
    intensity has a value between 0 and 255, and the number of possible colors is


    ```

    256^3 = 16777216

    ```


    The following table shows some examples of color encodings


    | R | G | B | Farve |

    |---|---|---|---|

    | 0 | 0 | 0 | Black |

    | 255 | 255 | 255 | White |

    | 255 | 0 | 0 | Red |

    | 0 | 255 | 0 | Green |

    | 0 | 0 | 255 | Blue |

    | 255 | 255 | 0 | Yellow |

    | 128 | 128 | 128 | Gray |


    You need to specifically the last encoding, where the same value for all intensities
    provides a grayscale. In Java you can define a color as an object to the type
    Color intensities to the constructor. It is used in the label that sits center
    in the window where there is defined the following color:


    ```

    new Color(240, 240, 240)

    ```


    This means that the component will have a faint gray background.


