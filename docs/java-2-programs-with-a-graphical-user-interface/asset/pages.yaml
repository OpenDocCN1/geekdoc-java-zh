  md: "# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE A LAST EXAMPLE\n\nIn the\
    \ book Java 1 shows how to store an arbitrary object in a file (object serialization)\
    \ and how to read the object again (object deserialization). It can be difficult\
    \ to remember how to write the statements, and when it is the same you has to\
    \ write every time it pays to write two library methods for these purposes:\n\n\
    ```\npackage palib.util;\n\nimport java.io.*;\n\npublic class Files {\n    public\
    \ static boolean serialize(Object obj, String filename) {\n        try {\n   \
    \         ObjectOutputStream stream =\n                new ObjectOutputStream(new\
    \ FileOutputStream(filename));\n            stream.writeObject(obj);\n       \
    \     stream.close();\n            return true;\n        } catch (Exception ex)\
    \ {\n            return false;\n        }\n    }\n\n    public static Object deserialize(String\
    \ filename) {\n        try {\n            ObjectInputStream stream =\n       \
    \         new ObjectInputStream(new FileInputStream(filename));\n            Object\
    \ obj = stream.readObject();\n            stream.close();\n            return\
    \ obj;\n        } catch (Exception ex) {\n            return null;\n        }\n\
    \    }\n}\n```"
