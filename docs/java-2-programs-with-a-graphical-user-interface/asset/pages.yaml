  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE FINAL EXAMPLE


    # 8.1 THE PROGRAM_CLASSES


    In principle, it is a very simple program in which the user interface has to display
    images of playing cards, which the user should then be able to click on the mouse.
    The program has in principle no other functions, but there must be a possibility
    to be able to select new game.


    There must be kept track of which cards are on the table, which are left in the
    deck and which have been taken, and for this purpose the program should define
    a model that always represents the program''s current state. The program must
    therefore in principle work in that when the user clicks on a card, a message
    is sent to the model on which card is clicked, and the model should then from
    the cards that are marked determine whether the cards can be removed from the
    table according to the solitaire rules. If this is the case the model must remove
    cards from the table, and selecting new cards from the deck.


    The basic concept in the program is a playing card, which is a very simple concept.
    A playing card must have three characteristics:


    +   1. a value that must be a number from 1 to 13: 11 = Jack, 12 = Queen and 13
    = king

    2. a color which should be a character: D (diamonds), H (Hearts), S (spade) C
    (clubs)

    3. an image of the card


    Otherwise, a card is passive and can be defined as:


    | Card |

    |---|

    | value: int |

    | color: char |

    | img(): ImageIcon |

    | getValue(): int |

    | getColor(): char |

    | getImage(): ImageIcon |


    Besides a playing card it is natural to think of a deck of 52 cards. It is not
    much more than an array of 52 Card objects and a variable that can keep track
    of how many cards are left in the deck:


    | Cards |

    |---|

    | top: int |

    | empty(): boolean |

    | getTop(): int |

    | get(): Card |

    | shuffle() |


