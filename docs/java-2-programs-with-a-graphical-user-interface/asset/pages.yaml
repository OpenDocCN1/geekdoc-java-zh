    There are two variables, the first being for the text, while the other represents
    a file, and is a File object that represents a file path.


    The default constructor creates a blank document, not yet saved and associated
    with a file. The other constructor has a parameter that is a File object, and
    the constructor tries to read the contents of this file as a text. Most methods
    concerning files can raise exceptions, or there may be many reasons why a particular
    file operation can not be performed. As an example it be that the file does not
    exist, or that you may not have the right to open it. Therefore, statements regarding
    files almost always are placed in try/catch blocks. In this case readers the constructor
    an exception if the content of the file for one reason or other cannot be read.
    A text file can be read with a BufferedReader, an object that reads the line by
    line. As the lines are reading the are added to a StringBuilder, which is used
    to build the document. If an error occurs, the constructor goes to the catch block,
    and the result is a blank document.


    The method save() tries to save the content (the document) in a file, but this
    is only possible if the variable file refers to a file. If it does not, the method
    returns false. Otherwise the method calls another save() method but with a File
    as a parameter. It looks like the constructor, and you write the text to a file
    using a BufferedWriter. The text is saved with method write(), that saves the
    text as a whole and also all the line breaks.


    Note that the class also has get and set methods for variable text, the program''s
    view can read the text and update it again.


