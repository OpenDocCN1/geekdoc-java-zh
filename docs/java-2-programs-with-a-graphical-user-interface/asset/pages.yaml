  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE


    # 9 A LAST EXAMPLE


    As shown in this book require the programming of a graphical user interface many
    lines of code, and there is even code that is difficult to remember how to write.
    Conversely, the book''s examples also shows that it is the same thing you to write
    every time, or at least the development of the various user interfaces have a
    number of common features. One can facilitate the work by creating a class library
    that contains classes with methods of the tasks encountered, and this library
    can then be made available to all of the GUI programs you develop.


    I will in this chapter show how to write such a class library, which I will call
    PaLib, and I also shows a program that use the library. The class library is used
    in all subsequent books and not only that, the library will continuously be expanded
    and more of the upcoming exercises and problems absolutely has to do with how
    to expand the library. You are therefore encouraged to study how the class library
    is made and how it is used in the program History, a test program that I shows
    in this chapter. Although the program relative to GUI programs do not contain
    anything new, it is nevertheless an appropriate conclusion to this introduction
    to GUI applications and Swing.


