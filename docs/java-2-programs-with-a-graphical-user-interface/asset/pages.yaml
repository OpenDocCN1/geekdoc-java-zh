    INTRODUCTION


    # #1 INTRODUCTION


    This book is an introduction to writing GUI applications in Java using the Swing
    API. Far from everything is treated, but conversely sufficient that you after
    reading the book can write small applications with a graphical user interface.


    A program with a graphical user interface is a program that runs in a window.
    Since it is largely based on the principles of object-oriented programming, the
    topic should be examined only after the next book in the series of this books,
    and the following will also use a lot about classes and interfaces that are first
    mentioned there. If I have chosen to address the subject now, it is because I
    want to be able to write applications that are more interesting and match the
    programs that you meet in everyday life, than is possible merely console applications.


    To write a program with a graphical user interface you must work on a wide range
    of finished classes, for example classes that creates and opens a window, classes
    representing a button, classes for an input field, etc. These are very many classes,
    and each are assembled in an API called Swing. In fact, Swing classes are based
    on an older API called AWT, so there are two APIs that you have to learn about,
    and each of these has several packages of classes. In the following I will call
    programs with a graphical user interface for GUI programs where GUI stands for
    Graphical User Interface, and I will start to make clear that you cannot learn
    to write GUI applications by learning all the many classes and their methods.
    Instead, you must learn some basic principles for the development of these kinds
    of programs, and once you have learned it, it is all not so difficult. You quickly
    get an idea of what it takes, and the question is what it is all called and what
    you actually have to write. Here, however, there is only one way and to turn up
    the help, which fortunately is available and there is a variety of other sources
    on the Internet that provides advice on how to solve specific problems.


    It is very different to writing GUI applications than console applications, and
    immediately it seems as if you have to write a lot and you has to (at least as
    will start Swing), but you will also quickly find that there is a lot of repetition
    and it is the same you have to write every time. Therefore, to reducing the task
    after you''ve written the first programs, and to reduce the work, you can create
    your own class library with frequently used methods. You will find an example
    of that in the book''s appendix.


