    # 8 FINAL EXAMPLE


    The task is to write a program that simulates a solitaire. It is a very simple
    solitaire game where the rules are as follows:


    On the table is 16 cards. One must then remove the cards on two criteria:


    +   1. cards of the same color with value less than 10, and where the sum of the
    card''s values are 15 (thus as an example, five and nine in the same color, or
    seven and eight in the same color)

    2. 10, Jack, Queen and King of the same color


    When you have removed cards, the unused places must be filled with cards from
    the deck – if there are more cards. The solitaire is solved when all cards are
    removed, but when you get into a situation where you can not remove cards, it
    means that the solitaire can not be solved.


    ![](img/de21c3d03dc39cbf562b48714d1befe2_119_0.png)'
