    ```

    private void addComponent(Container container, Component component,

    int left, int top, int width, int height)

    {

    component.setBounds(left, top, width, height);

    container.add(component);

    }

    ```


    ![](img/de21c3d03dc39cbf562b48714d1befe2_99_0.png)


    The first statement in createWindow() sets the layout manager to null, which means
    the window has no layout manager. Then the method adds components using the method
    addComponent(). It defines the components size and location with the method setBounds()
    where the first two parameters are the upper left corner of the component''s location
    in the panel, while the two last are the width and height. That, the component
    is assigned an absolute position and size. These values can be assigned with setLocation()
    and setSize().


    Immediately above works simple, but in general it is advisable to use a layout
    manager, as the component''s sizes can involve for the current font. If you use
    a particular font, and the window size does not change (note that this is not
    possible in the above example), the use of components at fixed positions, however
    is a possibility.


