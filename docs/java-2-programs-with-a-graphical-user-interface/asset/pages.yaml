  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE

    LAYOUT AND THE COMPONENT''S SIZE


    the relationship between the loan and the payment is given by the following formula:


    $G = y \frac{1-(1+r)^n}{r} \Rightarrow y = \frac{rG}{1-(1+r)^n}$


    This formula assumes that the interest rate is constant throughout the loan period
    and the first payment must take 1 period after you go loan, and you should assume
    that these assumptions apply. The following formula determines the outstanding
    debt immediately after the kth payment is paid:


    $Rest = G(1+r)^k \cdot y \frac{(1+r)^k-1}{r}$


    The program must open a window where the user must enter:


    +   - cost of loan formation

    - the size of the loan

    - the interest rate in percent pro ano

    - the repayment period in years

    - number of periods a year


    Using this information, the program must calculate the payment. In addition, it
    should be possible to open a window that shows an amortization, and thus an overview
    of the loan that for each period shows the payment, the interest, the repayment
    and the debt outstanding after this date.


