  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE


    # LAYOUT AND THE COMPONENT''S SIZE


    where the model consists of the classes that defines the program''s data and state,
    while controller layer has mainly perform control of entries etc. and optionally
    also has essential calculation functions (business logic). Finally, the view layer
    has all the classes for the user interface and for windows and dialogs.


    The goal of the pattern is to separate the code so that the code regarding the
    program''s data are placed in classes in the model and used for control and logical
    operations whereas the view layer alone must contain the code which has to do
    with the visual representation and user interaction. Conforms to the pattern you
    get a code which might be a bit bigger, but in return is easier to read and understand.


    I will in the following books when there is slightly larger programs begin using
    the pattern, and so far it is only a question of the division of the program''s
    classes in logical layers, and although it does not sound like much, the pattern
    has proved very appropriate as architecture for a GUI program. Therefore, I would
    in a small way begin using the pattern only as a way to a reasonable decision
    of the code. There is much more to say about MVC, and including how each layer
    should communicate with the others, and there may also be several layers, but
    the details I''ll defer to the book Java 7.


