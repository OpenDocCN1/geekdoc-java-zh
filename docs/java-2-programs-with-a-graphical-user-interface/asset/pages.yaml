  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL USER INTERFACE


    First you note the import statement


    ```

    import palib.util.*;

    ```


    referring to the package containing the class Files. In order to be possible,
    the jar file for the class library must be available for the program. It is obtained
    for the project (the program History), by right-click on Libraries and choose
    Add JAR / Folder...You can then browse to class library''s jar file and add it
    to the project:


    ![](img/de21c3d03dc39cbf562b48714d1befe2_136_0.png)


    The application can use the jar file and its. If we build the project and copy
    the file History.jar to another folder and run the program from a Terminal window,
    you will get an error message because the program cannot find the class library.
    The class library is not part of the program''s jar-file. If you opens the project''s
    dist folder, you will see that there is a subdirectory named lib. It contains
    the jar file to class library, and for the program to run, this subfolder must
    also be copied.


    The class Persons is in simple principle and you should notice Person objects
    are stored in an ArrayList, and the class has methods to add an item, update an
    item, and delete an item. Most specifically that each of these methods serialize
    the list using the method serialize() in the class Files, which are a class in
    the class library.


    The most complex in the class is the constructor. To deserialize the list from
    a file. If this fails, for example the file does not exist (and indeed it does
    not the first time the program runs), the list is initialized using data that
    is laid out in the program (Danish kings and I have only shown the first two).
    The list is created in method initialize(), which runs through the static array
    with data.


    You should also note the method iterator(). It will first be explained in the
    next book, but it means that it is possible to iterate over a Persons object''s
    items with a for statement.


