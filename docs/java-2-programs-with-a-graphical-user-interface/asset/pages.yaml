  md: '# JAVA 2: PROGRAMS WITH A GRAPHICAL INTERFACE LAYOUT AND THE COMPONENT''S SIZE


    I''ll start with the second component, which is the input field to the number
    of units:


    ```

    addComponent(panel, txtUnits = createField(120, 20, true), 2, 0, 1, 0, 0, GridBagConstraints.NONE,
    GridBagConstraints.LINE_START, new Insets(0, 0, 20, 0));

    ```


    The input field is created with a preferred size. This has implications for the
    size of the cell that contains the component. Then is defined that the cell should
    be column 2, row 0. When it is placed in column 2, it is because the label in
    front of it is spanning two columns. The next two parameters indicate that this
    component does not need to span the cells other the cell in it is. The next two
    parameters again, are the weights, and they indicate the next fill parameter,
    the size of this component must always be its preferred size. The last parameter
    tells that the component must be adjusted to the left side of the cell, and finally
    the last parameter indicates that there has to be a margin of 20 to the right
    and below the component.


    Below is the code that adds the list box:


    ```

    addComponent(panel, createList(), 3, 0, 3, 7, 1, 1, GridBagConstraints.BOTH, GridBagConstraints.LINE_START,
    new Insets(0, 0, 10, 0));

    ```


    It is placed in column 3 row 0, but it should span 3 columns and 7 rows. Next,
    the weights are set to 1, and it says that the component must use all the available
    space horizontally and vertically. At the same time telling the next parameter,
    the component should fill the entire cell out horizontally and vertically, and
    the result is that the component’s size follows the window size. Its preferred
    size is ignored. The last two parameters tells the component to be adjusted to
    the cell’s left edge (ignored in this case, but the method addComponent() requires
    a value), and there must be a margin of 10 below the component.


    As a final note to the dialog box, notice that the window in the constructor is
    assigned a minimum size. The reason is not to made the window smaller, but the
    layout manager can not display the components.


