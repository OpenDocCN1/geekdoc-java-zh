    7. anchor as in the case where the component''s preferred size is less than the
    cell indicates where the component is to be placed in the cell. The options are
    shown in the figure below, where the names all refer to the constants in GridBagConstraints:


    | FIRST_LINE_START | PAGE_START | FIRST_LINE_END |

    |---|---|---|

    | LINE_START | CENTER | LINE_END |

    | LAST_LINE_START | PAGE_END |


    The above sounds complicated, and it is also, and it takes some experimentation
    to get a GridLayout to behave as desired. The starting point is to start with
    a sketch, which can illustrate the window that you want to design. In this case
    I would design a window where you can enter the number of units and unit price
    of an item. One must also be able to check whether unit price is entered with
    or without VAT. When you click on a button, the program must calculate the total
    and VAT, and if you click on another button, a line item is inserted in a list
    box. The design should be something like what is shown below:


    | Number of units | |

    | Unit price | |

    | * Unit price excl. VAT |

    | * Unit price incl. VAT |

    | Amount |

    | VAT |

    | Total | Amount VAT Total |

    | Ok Clear Calculate | Delete |


    The three fields under the list box must contain totals for the product lines.
    The list box and the three fields to the totals should follow the window size
    and the buttons should be positioned relative to the bottom.'
