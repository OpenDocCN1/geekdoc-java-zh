  md: "# 9.2 THE TEST PROGRAM\n\nI will finally show how my class library can be used\
    \ in a program. I have written a program called History, where you can maintain\
    \ a list of historical persons. It requires that the program save the list somewhere.\
    \ When the program starts the first time, it initialize the list of the Danish\
    \ kings, and each time it is changed, it is stored in a file on your hard disk.\
    \ When the program opens the next time, it starts to read the updated list from\
    \ the file – if possible. Otherwise the file is initialized of the Danish kings.\
    \ The file is stored in the same location as the program and you do not need to\
    \ study how the file is stored and read, as the library has the necessary methods.\n\
    \nA person is defined as follows (where I removed the comments and all the get\
    \ and set methods):\n\n```\npackage history;\n\nimport java.io.*;\n\npublic class\
    \ Person implements Comparable<Person>, Serializable {\n    private String name;\
    \ // the person's name\n    private String job; // the person's position\n   \
    \ private String text; // a description\n    private int from; // birth, start\
    \ of reign or otherwise\n    private int to; // year of when the person is dead\n\
