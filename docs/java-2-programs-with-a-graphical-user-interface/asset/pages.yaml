    specify where the content can be edited. That is where the field should be used
    for input or it should be used to show a value. You note that the content is right
    aligned.

    - createRadio() is a method that creates a radio button. It has a parameter that
    tells if the button should be checked, and also the group is a parameter. The
    group is required, because a window may have more groups of radio buttons.

    - createButton() is a method that creates a button and there are parameters for
    the text, and the event handler.

    - createList() creates the list box and encapsulates the list box in a JScrollPane,
    so you will be able to scroll the content.


    Furthermore, there are defined four event handlers for the four buttons:


    +   1. calc() is event handler to the button Calculate. When pressing retrieves
    the contents of the input fields respectively the number of units and the unit
    price and converts the values and stored them in the respective variables. If
    entered legal values, the VAT if necessary pulled out of the unit price, and otherwise
    the product amounts and VAT are calculated and the corresponding fields are updated.
    Are the values of the one reason or another illegal, you get an error message.

    2. clear() is event handler to the Clear button, and it clears the input fields
    and fields to the result and sets the variables for the calculation to zero.

    3. ok() is event handler for the OK button. If there is a calculation, the method
    adds a line to the list box for the fields for the totals. The method also call
    the handler clear() and clears the calculation fields.

    4. delete() is event handler to the Delete button and clears the list box.


    Now there''s the method createWindow(), and that is where it happens. To add a
    component method uses a method called addComponent(). This method creates a GridBagConstraints
    object and initialize it using parameters. This object is attached to the component,
    which is added to the panel. createWindow() creates a JPanel with a GridBagLayout.
    In order to have a margin the panel is assigned a border, but otherwise the work
    consists of placing the 23 components in the panel. I will not go through all
    23 components, but I''ll look at two as the principle is much the same for all
    components.'
