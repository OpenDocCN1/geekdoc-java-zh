    MORE COMPONENTS


    Compared to the first examples, this example use more kinds of components:


    +   - JLabel, which is a component showing a text and was used in the previous
    examples

    - JTextField, which is an input field, and is also used in the previous examples

    - JComboBox, which is component with a list of objects, and you can then select
    one of objects

    - JCheckBox, which is a simple component, where you can select a property

    - JRadioButton, which several components are organized in a group, so you can
    choose one of them

    - JSlider, which is a component, where you by means of the “shoots” can select
    a value within a range


    If on top of that you adds components JButton and JList that is used in the previous
    examples, but are not used in this example, you have actually met most of the
    basic Swing components, and in practice you will get far with these components.


    Then there is the program code, which is extensive with nearly 350 lines. Rather
    than show all the code together, I will show in connection with the description
    of the individual concepts. It is recommended that you open the full code while
    you read the following.


    I''ll start with the layout, which this time is quite complex. You should start
    to run the application and notice how some of the components change their sizes
    as the window size changes. The components size and location are determined by
    the layout manager being used, and it is the subject of the next chapter, but
    for now I have mentioned three layout managers


    +   - BorderLayout

    - FlowLayout

    - GridLayout


    and they are all used in this example. By using nested layout managers, that is
    having panels inside each other with their own layout managers, you can actually
    by using the three layout managers design a rather complicated layout.'
