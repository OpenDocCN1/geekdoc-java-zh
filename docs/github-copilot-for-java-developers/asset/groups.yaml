    \ + \" : \" + i);\n    }\n};\n```\n\n创建了两个线程对象，它们每个都有自己的 runnable。这意味着当每个线程被启动时，它将执行在\
    \ runnable 对象中定义的代码。\n\n```java\nThread thread1 = new Thread(runnable);\nthread1.start();\n\
    \nThread thread2 = new Thread(runnable);\nthread2.start();\n```\n\n让我们来看另一个使用\
