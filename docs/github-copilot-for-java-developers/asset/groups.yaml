    \nLambda 表达式的语法如下：\n\n```\n(parameters) -> { statements; }\n```\n\n参数：\n\nLambda\
    \ 表达式的参数定义在圆括号内，类似于方法声明。如果只有一个参数，可以省略括号。\n\n如果没有参数，则必须使用空括号。\n\n示例：\n\nJava\n\n\
    ```java\n(int x) -> ...\n(String name) -> ...\n() -> ...\n```\n\n## 箭头运算符 (->):\n\
    \n箭头运算符将参数与 Lambda 体隔开。\n它表示接下来的代码代表了 Lambda 的实现。\n示例：\n\n# Java\n\n```java\n\
    (x, y) -> x + y\n```\n\n### Lambda 体：\n\nLambda 体指定了调用 Lambda 表达式时要执行的代码。\n如果\
    \ Lambda 体只包含单个表达式，可以省略大括号 {}，该表达式将作为 Lambda 表达式的结果。\n示例：\n\n# Java\n\n```java\n\
    (x, y) -> x * y\n(name) -> \"Hello, \" + name\n```\n\n### 函数式接口：\n\nLambda 表达式通常与函数式接口结合使用。\n\
