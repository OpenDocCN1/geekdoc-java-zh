  - '[PAGE 91]


    The goal of synchronization is to ensure that only one thread can access a shared-source
    (such as a variable, object, or method) at a time.


    By preventing multiple threads from simultaneously modifying the same data, synchronization
    helps avoid data corruption and ensures consistent results.


    # Types of Synchronization:


    In Java, there are two main types of synchronization:


    +   - Process Synchronization : Deals with synchronization across different processes.


    +   - Thread Synchronization : Focuses on synchronization within a single process
    (between threads).


    # Thread Synchronization:


    Within thread synchronization, we have two primary concepts:


    +   - Mutual Exclusion : Ensures that threads do not interfere with each other
    while sharing data.


    Achieved through:


    +   - Synchronized methods : Locks an object for a shared resource.


    +   - Synchronized blocks : Allows fine-grained control over synchronization.


    +   - Static synchronization : Applies to static methods.


    Inter-thread Communication (Cooperation) : Facilitates communication between threads.


    Examples include using wait(), notify(), and notifyAll().'
