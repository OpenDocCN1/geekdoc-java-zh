    \   this.t = t;\n    }\n    public void run() {\n        t.printTable(10);\n \
    \   }\n}\n```\n\n```\npublic class TestSynchronization {\n    public static void\
    \ main(String[] args) {\n        Table obj = new Table();\n        MyThread1 t1\
    \ = new MyThread1(obj);\n        MyThread2 t2 = new MyThread2(obj);\n        t1.start();\n\
