  mdcn: '


    # 面向 Java 开发者的 GitHub Copilot


    PRITESH MISTRY


    《面向 Java 开发者的 GitHub Copilot》是一本不可或缺的指南，探索了 AI 在软件开发中革命性的集成。本书深入探讨了 GitHub Copilot
    的变革能力，这是一种 AI 驱动的编程助手，能够简化 Java 开发工作流。从它的诞生到演变，读者将发现 Copilot 的历史和特性，并对其与 Java
    开发环境的无缝集成产生见解。通过实用的技巧、案例研究和最佳实践，这一全面的资源将使 Java 开发者充分利用 GitHub Copilot 的潜力，增强项目的生产力、代码质量和创新能力。


    ## 什么是 GitHub Copilot


    GitHub Copilot 是由 GitHub 与 OpenAI 合作开发的 AI 驱动代码补全工具。它基于 GPT（生成式预训练变换）架构构建，这与 ChatGPT
    背后的技术相同，旨在帮助开发者更高效地编写代码。


    GitHub Copilot 设计通过实时建议代码行和整个函数来辅助开发者。它像一个虚拟结对编程伙伴，理解你的代码上下文，并根据你的项目和编码风格提供建议。


    ## 历史与演变


    2021 年 6 月 29 日，GitHub 在 Visual Studio Code 开发环境中推出了 GitHub Copilot 的初始预览版。2021
    年 10 月 29 日，GitHub Copilot 以插件形式在 JetBrains 市场可用。此外，2021 年 10 月 27 日，GitHub 以开源仓库的形式发布了
    GitHub Copilot Neovim 插件。2022 年 3 月 29 日，GitHub 宣布在 Visual Studio 2022 IDE 中可用
    Copilot。此外，2022 年 6 月 21 日，GitHub 宣布 Copilot 从初始预览阶段转变为面向个人开发者的订阅制服务。


    ## 从记事本到 AI


    ![](img/dbebbe5e20d39743ff28c8dae042defc_4_0.png)


    从 Notepad（记事本）到带有 GitHub Copilot 的 IntelliJ IDEA 代表了程序员可用工具的重大演变，提供了日益复杂的功能和能力：


    - Notepad（记事本）：Notepad 是一个基础文本编辑器，为编写代码提供极少的功能。虽然它可以用于简单任务，但缺乏为量身定制的功能，如语法高亮、代码补全和调试工具。使用
    Notepad 的程序员在管理大型项目和高效调试错误时经常面临挑战。


    - Notepad++：Notepad++ 是 Notepad 的改进版，提供了增强的功能，如语法高亮、代码折叠和自定义主题。与 Notepad 相比，它提供了一个更舒适的编码环境，但仍然缺乏专用集成开发环境（IDE）中的高级功能，如项目管理和版本控制集成。


    - Eclipse：Eclipse 是一款受欢迎的 Java IDE，以其全面的功能而闻名，包括语法高亮、代码补全、调试、重构工具以及通过插件支持各种编程语言。Eclipse
    显著提高了程序员的生产力，提供了一个编写、测试和调试代码的集成环境。然而，对于初学者来说，它可能非常消耗资源且复杂。


    - IntelliJ IDEA：IntelliJ IDEA 是一个强大且易用的 IDE，它在构建 Eclipse 特性的的基础上提供了额外的增强，如更好的性能、更智能的代码补全、高级重构工具以及与构建系统和版本控制的无缝集成。与
    Eclipse 相比，IntelliJ IDEA 简化了开发工作流，提高了代码质量，并提供了更直观的用户体验。


    - 带有 GitHub Copilot 的 IntelliJ IDEA：将 GitHub Copilot 与 IntelliJ IDEA 集成通过利用人工智能辅助程序员编写代码进一步增强了开发体验。GitHub
    Copilot 提供智能代码建议、自动补全，甚至根据上下文生成整个代码段，显著减少了手动工作并加速了开发任务。这种集成增强了 IntelliJ IDEA 的能力，使程序员能够更高效地编写代码、探索解决方案并提高生产力。


    总之，从 Notepad 到带有 GitHub Copilot 的 IntelliJ IDEA 的演变代表了程序员可用工具日益复杂和高效的历程，使他们能够更有效地编写高质量代码，并更轻松地处理复杂的编程任务。


    ## Copilot 如何工作


    下图显示了 copilot 如何工作。


    ## OpenAI Codex 模型


    ![](img/dbebbe5e20d39743ff28c8dae042defc_7_0.png)


    你的编辑器


    ![](img/dbebbe5e20d39743ff28c8dae042defc_7_1.png)


    - 提供上下文

    - 提供建议

    - 提问


    ```

    ```

    </>

    ```

    GitHub Copilot 服务


    公共代码（例如 pis github repo）

    ```


    OpenAI Codex 是由 OpenAI 开发的一种 AI 模型。Codex 在来自各种来源（包括开源仓库）的海量代码上训练，以理解并生成多种编程语言的代码。它基于
    GPT（生成式预训练变换）架构构建，类似于 GPT-3 等模型使用的架构。


    Codex 特别引人注目的是它根据自然语言提示理解并生成代码的能力。它可以用于代码补全、代码生成，甚至协助开发者编写软件等任务。


    所以基本上，当你在右侧尝试编写代码并执行任何操作（如提供上下文、建议或提问）时，请求会发送到 GitHub Copilot 服务，该服务间接调用 Codex
    模型并根据训练模型给出响应……


    ## 设置与安装


    ### 安装 IntelliJ IDEA


    以下是在 Windows 上安装 IntelliJ IDEA 社区版的步骤：


    **下载 IntelliJ IDEA 社区版：**


    1. 前往 JetBrains ：JetBrains IntelliJ IDEA Community Edition 下载

    2. 点击社区版的“Download”按钮。


    **运行安装程序：**


    1. 下载完成后，找到下载的安装程序文件（通常在“下载”文件夹中）。

    2. 双击安装程序（例如 `ideaIC-<version>.exe`）开始安装过程。


    **选择安装选项：**


    1. 在安装向导中，你将会被提示选择安装选项。

    2. 你可以选择安装位置、创建桌面快捷方式，并将 IntelliJ IDEA 与相关文件类型关联。

    3. 按照提示并选择你偏好的选项。


    **安装 IntelliJ IDEA 社区版：**


    1. 选择安装选项后，点击“Install”按钮开始安装过程。

    2. 安装程序将在你的系统上提取并安装 IntelliJ IDEA 社区版。取决于你的系统速度，这可能需要几分钟时间。


    **启动 IntelliJ IDEA：**


    1. 安装完成后，你将看到启动 IntelliJ IDEA 的选项。

    2. 勾选“安装后立即启动 IntelliJ IDEA”并点击“Finish”，或从开始菜单或桌面快捷方式手动启动。


    **设置 IntelliJ IDEA：**


    1. 首次启动时，IntelliJ IDEA 社区版将提示你根据喜好自定义设置。

    2. 你可能还会被提示选择 UI 主题和键位映射设置。


    **开始使用 IntelliJ IDEA 社区版：**


    1. 一旦设置好 IntelliJ IDEA 社区版，你就可以开始创建新项目、打开现有项目并用你偏好的编程语言编写代码。


    就是这样！你已成功在 Windows 系统上安装了 IntelliJ IDEA 社区版。你现在可以开始编写代码并探索 IntelliJ IDEA 社区版的功能。


    ## 在 IDE 中设置/配置 GitHub Copilot


    以下是在 IntelliJ IDEA 中设置和配置 GitHub Copilot 的步骤：


    **安装：**


    - 从 File（文件）菜单打开 Settings（Windows）或 Preferences（Mac）。

    - 在左侧面板中，点击 Plugins（插件）。

    - 点击顶部的 Marketplace（市场）。

    - 在搜索栏中搜索“Copilot”。

    - 点击 GitHub Copilot 插件旁边的 Install（安装）。

    - 重启 IntelliJ IDEA 使更改生效。


    **激活：**


    - 重启后，你将在 IDE 的左上角看到 GitHub Copilot 图标。

    - 点击图标并选择 Sign in to GitHub（登录 GitHub）。

    - 按照屏幕上的指令完成登录过程并激活 Copilot。


    '
