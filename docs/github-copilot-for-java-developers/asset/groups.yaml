    \ |\n| char | 2 | 0 to 65,535 |\n| boolean | 1 | true or false |\n\n# Datatypes\
    \ in Java\n\n![](img/dbebbe5e20d39743ff28c8dae042defc_29_0.png)\n\nThe above diagram\
    \ shows the two main categories of data types: primitive data types and non-primitive\
    \ data types.\n\n**Primitive types** are the basic blocks for storing data in\
