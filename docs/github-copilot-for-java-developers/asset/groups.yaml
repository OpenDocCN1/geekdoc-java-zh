    \ 表达式使用函数式接口的示例：\n\n```java\nJava // Java 8 之前\n```\n\n```java\nnew Thread(new\
    \ Runnable() {\n    @Override\n    public void run() {\n        System.out.println(\"\
    New thread created\");\n    }\n}).start();\n```\n\n```java\n// Java 8 及以后\nnew\
    \ Thread(() -> {\n    System.out.println(\"New thread created\");\n}).start();\n\
    ```\n\n记住，函数式接口对于启用 Java 中的函数式编程至关重要\n\n练习：\n\n```\n创建一个带有 operate 方法的函数式接口 MathOperation\n\
    ```\n\n## 解决方案：\n\n上面的代码是在 Java 中使用函数式接口的简单示例。\n\n在顶部声明了一个名为 MathOperation 的函数式接口。函数式接口包含一个抽象方法。在这种情况下，方法是\
    \ `operate(int a, int b)`。它接收两个整数作为参数并返回一个整数。\n\n```java\n@FunctionalInterface\n\
    interface MathOperation {\n  int operate(int a, int b);\n}\n```\n\n在 `FunctionalInterfaceExample`\
    \ 类的 `main` 方法中，使用 Lambda 表达式创建了四个 MathOperation 实例。Lambda 表达式是一个接收参数并返回值的短代码块。Lambda\
    \ 表达式类似于方法，但它们不需要名称，并且可以直接在方法体内实现。\n\n```java\nMathOperation addition = (a, b)\
    \ -> a + b;\nMathOperation subtraction = (a, b) -> a - b;\nMathOperation multiplication\
    \ = (a, b) -> a * b;\nMathOperation division = (a, b) -> a / b;\n```\n\n每个 Lambda\
    \ 表达式实现了 MathOperation 接口的 operate 方法。addition 实例相加它的参数，subtraction 实例减去它们，multiplication\
    \ 实例相乘它们，而 division 实例除以它们。\n\n最后，调用每个 MathOperation 实例的 operate 方法，并传入 10 和 5\
    \ 作为参数，并将结果打印到控制台。\n\n```java\nSystem.out.println(\"Addition: \" + addition.operate(10,\
    \ 5));\nSystem.out.println(\"Subtraction: \" + subtraction.operate(10, 5));\n\
    System.out.println(\"Multiplication: \" + multiplication.operate(10, 5));\nSystem.out.println(\"\
    Division: \" + division.operate(10, 5));\n```\n"
