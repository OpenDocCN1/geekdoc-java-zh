    \        t1.start();\n\n        Thread t2 = new Thread(runnable);\n        t2.start();\n\
    \    }\n}\n```\n\n在这个示例中，Lambda 表达式 { ... } 被用于定义 Runnable 接口的实现。Runnable 被传递给\
    \ Thread 构造函数。\n\n- 使用了 4 处引用\n- 你能解释 lambda 表达式如何简化 Java 中 Runnable 实例的创建吗？\n\
