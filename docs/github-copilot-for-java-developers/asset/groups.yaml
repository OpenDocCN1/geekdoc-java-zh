    # Creating variables in Java


    What are Variables in java?


    In Java, a variable is a named memory location that holds a value of a specific
    data type. Variables are used to store data that can be manipulated and accessed
    throughout the program''s execution. They are declared with a specific data type
    and may be assigned a value during declaration or later in the program.


    Java variables can be divided into several categories based on their scope, lifetime,
    and accessibility:'
  - '[PAGE 21]


    # Variables Types in Java


    ![](img/dbebbe5e20d39743ff28c8dae042defc_21_0.png)


    LOCAL VARIABLES


    STATIC VARIABLES


    INSTANCE VARIABLES


    Local Variables are also referred to as stack variables. Since they are stored
    in stack memory, initializing the local variable is necessary


    When a class is loaded into the JVM, they are loaded and initialized. The class
    variable only exists once


    Instance are heap-based. These are connected to the production of objects. Instance
    variables are also created as the object is formed'
  - "[PAGE 22]\n\nLocal Variables : Variables declared within a method, constructor,\
    \ or block are called local variables. They are accessible only within the block\
    \ in which they are declared.\n\n```\nvoid exampleMethod() {\n  int localVar =\
    \ 10; // localVar is a local variable\n}\n```\n\nInstance Variables (Non-Static\
    \ Fields): These variables are declared within a class but outside any method,\
    \ constructor, or block. They are instantiated when an object of the class is\
    \ created and exist as long as the object exists. Each object of the class has\
    \ its own copy of instance variables.\n\n```\npublic class ExampleClass {\n  int\
    \ instanceVar; // instanceVar is an instance variable\n}\n```\n\nClass Variables\
    \ (Static Fields): These are declared with the static keyword within a class but\
    \ outside any method, constructor, or block. They are shared among all instances\
    \ of the class and exist for the entire duration of the program's execution.\n\
    \n```\npublic class ExampleClass {\n  static int classVar; // classVar is a class\
    \ variable\n}\n```\n\nVariables in Java are strongly typed, which means you must\
    \ declare the type of data a a variable can hold. Additionally, Java follows static\
    \ typing, where the type of a variable is checked at compile time, and dynamic\
    \ binding, where the method to be invoked is decided at runtime based on the object's\
    \ type."
  - '[PAGE 23]


    ![](img/dbebbe5e20d39743ff28c8dae042defc_23_0.png)


    The above diagram illustrates variable declaration and memory allocation in Java.


    In Java, there are two main memory areas used for variable storage: the stack
    and the heap.


    Stack: The stack is a last-in-first-out (LIFO) data structure that is used to
    store method calls, local variables, and reference variables for objects on the
    heap. Primitive data types, such as int, double, and boolean, are directly stored
    in the stack when a variable is declared.'
  - '[PAGE 24]


    Heap: The heap is a dynamic memory allocation area that is used to store objects
    and arrays. Objects are created using the new keyword and reference variables
    that point to the objects on the heap are stored on the stack.


    The image shows two examples of variable declarations:


    ```

    boolean isOk = false;

    ```


    ```

    int count = 20;

    ```


    In this case, both isOk and count are primitive data types and are stored on the
    stack. The variable name is shown on the left and the data type is shown above
    it. An arrow points from the variable name to a reserved memory area that shows
    the value that is stored.


    Here are some added points to consider about variable declaration and memory allocation
    in Java:


    Static variables are also stored in a special part of the memory called the Method
    Area (sometimes referred to as PermGen space).


    Reference variables do not store the object itself, but rather a reference (or
    memory address) to the location of the object in the heap'
