    \n# Multithreading in Java\n\n### What is Multithreading?\n\nMultithreading is\
    \ a Java feature that allows concurrent execution of two or more parts of a program.\n\
    Each part of the program is called a thread.\nThreads are lightweight processes\
    \ within a single process.\nThe goal is to maximize CPU utilization by running\
    \ multiple threads simultaneously.\n\n### Creating Threads:\n\n- Threads can be\
    \ created using two mechanisms:\n\n#### Extending the Thread class:\n\n- We create\
    \ a class that extends java.lang.Thread.\n- Override the run() method in this\
    \ class.\n- A thread begins its life inside the run() method.\n- Create an object\
    \ of our new class and call start() to begin thread execution.\nExample:\n\nJava\n\
    \n```java\nclass MultithreadingDemo extends Thread {\n    public void run() {\n\
    \        System.out.println(\"Thread \" + Thread.currentThread().getId() + \"\
    \ is running\");\n    }\n}\n\npublic class Multithread {\n    public static void\
    \ main(String[] args) {\n        int n = 8;\n        for (int i = 0; i < n; i++)\
    \ {\n            MultithreadingDemo object = new MultithreadingDemo();\n     \
    \       object.start();\n        }\n    }\n}\n```\n\n#### Implementing the Runnable\
    \ interface:\n\n- Create a new class that implements java.lang.Runnable.\n- Override\
    \ the run() method in this class.\n- Instantiate a Thread object and call start()\
    \ on it.\nExample:\n\nJava\n\n```java\nclass MultithreadingDemo implements Runnable\
    \ {\n    public void run() {\n        System.out.println(\"Thread \" + Thread.currentThread().getId()\
    \ + \" is running\");\n    }\n}\n\npublic class Multithread {\n    public static\
    \ void main(String[] args) {\n        int n = 8;\n        for (int i = 0; i <\
    \ n; i++) {\n            Thread object = new Thread(new MultithreadingDemo());\n\
    \            object.start();\n        }\n    }\n}\n```\n\n# Thread Class vs. Runnable\
    \ Interface:\n\nExtending Thread:\n\n- Cannot extend any other class due to Java's\
    \ lack of multiple inheritance.\n- Provides inbuilt methods like yield(), interrupt(),\
    \ etc.\n\nImplementing Runnable:\n\n- Allows extending other base classes.\n-\
    \ Provides a shared object that can be used by multiple threads.\n\n# Advantages\
    \ of Multithreading:\n\n- concurrency: Multiple threads execute concurrently.\n\
    - memory Efficiency: Threads share memory, saving memory space.\n- Faster Context\
    \ Switching: Switching between threads is faster than processes.\n"
