  - '[PAGE 33]


    # Conditional Statements :


    if statement: Executes a block of code if a specified condition is true.

    if-else statement: Executes one block of code if a condition is true, and another
    block if the condition is false.

    if-else-if statement: Executes different blocks of code based on different conditions.

    switch statement: Executes different blocks of code based on different values
    of an expression.


    # Looping Statements :


    for loop: Executes a block of code a specified number of times.

    while loop: Executes a block of code as long as a specified condition is true.

    do-while loop: Executes a block of code at least once, and then continues executing
    as long as a specified condition is true.

    for-each loop (enhanced for loop): Iterates over each element of an array or collection.


    # Branching Statements :


    break statement: Terminates the loop or switch statement and transfers control
    to the next statement after the loop or switch.

    continue statement: Skips the current iteration of a loop and moves to the next
    iteration.


    # Other Control Flow Statements :


    return statement: Exits the method and returns control to the calling method.

    try-catch-finally block: Handles exceptions and provides a way to execute code
    regardless of whether an exception occurs or not'
