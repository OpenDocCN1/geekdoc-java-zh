    \n# Java 中的多线程\n\n### 什么是多线程？\n\n多线程是 Java 的一项特性，允许程序的两个或多个部分并发执行。\n程序的每个部分被称为线程。\n\
    线程是单个进程内的轻量级进程。\n其目标是通过同时运行多个线程来最大化 CPU 的利用率。\n\n### 创建线程：\n\n- 线程可以使用两种机制创建：\n\
    \n#### 继承 Thread 类：\n\n- 我们创建一个继承 java.lang.Thread 的类。\n- 在该类中重写 `run()` 方法。\n\
    - 线程从 `run()` 方法内部开始生命。\n- 创建我们新类的对象并调用 `start()` 来开始线程执行。\n示例：\n\nJava\n\n```java\n\
    class MultithreadingDemo extends Thread {\n    public void run() {\n        System.out.println(\"\
    Thread \" + Thread.currentThread().getId() + \" is running\");\n    }\n}\n\npublic\
    \ class Multithread {\n    public static void main(String[] args) {\n        int\
    \ n = 8;\n        for (int i = 0; i < n; i++) {\n            MultithreadingDemo\
    \ object = new MultithreadingDemo();\n            object.start();\n        }\n\
    \    }\n}\n```\n\n#### 实现 Runnable 接口：\n\n- 创建实现 java.lang.Runnable 的新类。\n- 重写该类中的\
    \ `run()` 方法。\n- 实例化 Thread 对象并对其调用 `start()`。\n示例：\n\nJava\n\n```java\nclass\
    \ MultithreadingDemo implements Runnable {\n    public void run() {\n        System.out.println(\"\
    Thread \" + Thread.currentThread().getId() + \" is running\");\n    }\n}\n\npublic\
    \ class Multithread {\n    public static void main(String[] args) {\n        int\
    \ n = 8;\n        for (int i = 0; i < n; i++) {\n            Thread object = new\
    \ Thread(new MultithreadingDemo());\n            object.start();\n        }\n\
    \    }\n}\n```\n\n# Thread 类与 Runnable 接口：\n\n继承 Thread：\n\n- 由于 Java 不支持多重继承，无法继承其他类。\n\
    - 提供了 `yield()`、`interrupt()` 等内置方法。\n\n实现 Runnable：\n\n- 允许继承其他基类。\n- 提供了一个可供多个线程使用的对象。\n\
    \n# 多线程的优势：\n\n- 并发：多个线程并发执行。\n- 内存效率：线程共享内存，节省内存空间。\n- 更快的上下文切换：线程之间的切换比进程切换更快。\n\
    \n"
