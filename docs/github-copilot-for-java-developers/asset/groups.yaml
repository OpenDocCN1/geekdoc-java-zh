- md: "\nOptional Configuration:\n\nWhile Copilot works out of the box, you can further\
    \ configure its behavior:\n\n- **Keyboard Shortcuts:** Go to Settings/Preferences\
    \ > Keymap and search for \"Copilot\" to manage keyboard shortcuts for various\
    \ Copilot actions.\n- **Settings:** Click the Gear icon next to the Copilot icon\
    \ and explore settings like disabling suggestions or adjusting their display style.\n\
    \nAdditional Resources:\n\nYou can find the official guide for setting up Copilot\
    \ in IntelliJ IDEA here: https://docs.github.com/copilot\n\nFor deeper configuration\
    \ options and troubleshooting, refer to the GitHub Copilot documentation: https://docs.github.com/copilot\n\
    \n# Creating a New Project\n\nCreating a new project in IntelliJ IDEA is straightforward.\
    \ Here's a step-by-step guide:\n\n### Open IntelliJ IDEA\nLaunch IntelliJ IDEA\
    \ on your computer. You can do this by double-clicking the IntelliJ IDEA icon\
    \ on your desktop or finding it in your Start menu.\n\n### Open the Welcome Screen\n\
    Once IntelliJ IDEA is launched, you'll see the Welcome screen. If you're already\
    \ working on a project, you can close it to get back to the Welcome screen. If\
    \ the Welcome screen is not visible, you can access it by clicking on \"File\"\
    \ > \"Close Project\".\n\n### Create a New Project\nOn the Welcome screen, click\
    \ on the \"New Project\" button. Alternatively, you can also go to \"File\" >\
    \ \"New\" > \"Project...\" from the menu bar.\n\nThis will open the New Project\
    \ wizard.\n\n### Choose Project Type\nIn the New Project wizard, you'll be prompted\
    \ to select the type of project you want to create. Choose the appropriate project\
    \ type based on your requirements. For example, you can select \"Java\" for a\
    \ Java project, \"Maven\" for a Maven project, \"Gradle\" for a Gradle project,\
    \ etc.\n\nAfter selecting the project type, click \"Next\".\n\n### Configure Project\n\
    In the next step, you'll need to configure your project settings such as project\
    \ name, project location, project SDK (Java version), and any additional settings\
    \ specific to the chosen project type.\n\nMake sure to provide meaningful names\
    \ and appropriate locations for your project. Once you've configured the project\
    \ settings, click \"Next\".\n\n### Finish\nReview the project summary to ensure\
    \ all settings are correct. Click \"Finish\" to create the project.\n\n### Wait\
    \ for Project Creation\nIntelliJ IDEA will create the project based on the specified\
    \ settings. This might take a few moments depending on your system's speed and\
    \ the complexity of the project.\n\n### Start Coding\nOnce the project is created,\
    \ you'll be taken to the IntelliJ IDEA workspace with your new project loaded.\n\
    \nYou can start coding by creating new classes, packages, or files within your\
    \ project.\n\nThat's it! You have successfully created a new project in IntelliJ\
    \ IDEA. You can now start working on your project and building your application.\n\
    \nFor example, while creating new Project e.g GithubCopilotExamples will have\
    \ below windows:\n\n![](img/dbebbe5e20d39743ff28c8dae042defc_13_0.png)\n\n![](img/dbebbe5e20d39743ff28c8dae042defc_14_0.png)\n\
    \nClick on New Window if you want it as separate window.\n\n![](img/dbebbe5e20d39743ff28c8dae042defc_15_0.png)\n\
    \n## Variables in Java\n\nIn Java, variables are categorized based on their scope,\
    \ lifetime, and accessibility.\n\n| Variable Type | Description |\n| :--- | :---\
    \ |\n| **Local Variables** | Declared within a method or block. Stored on the\
    \ stack. Accessible only within that block. |\n| **Instance Variables** | Declared\
    \ within a class but outside any method. Stored on the heap. Exist as long as\
    \ the object exists. |\n| **Class Variables** | Declared with the `static` keyword\
    \ within a class. Shared among all instances and exist for the duration of the\
    \ program. |\n\n![](img/dbebbe5e20d39743ff28c8dae042defc_16_0.png)\n![](img/dbebbe5e20d39743ff28c8dae042defc_17_0.png)\n\
    ![](img/dbebbe5e20d39743ff28c8dae042defc_18_0.png)\n![](img/dbebbe5e20d39743ff28c8dae042defc_19_0.png)\n\
