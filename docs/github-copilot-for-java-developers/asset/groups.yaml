    \ Java 8 中作为 `java.util.stream` 包的一部分引入。它们的设计旨在使数据操作更具声明性且具有函数式本质。\n\nJava Streams\
    \ 的核心特性：\n\n- 管道化（Pipelining）：Streams 支持管道化，这意味着可以在单个表达式中将多个操作链在一起。这使得代码更加易读且简洁。\n\
    - 惰性计算（Laziness）：Stream 上的中间操作是惰性的的，这意味着在调用终端操作（terminal operation）之前，它们不会被执行。这允许进行优化并高效地使用内存。\n\
    - 不可变性（Immutable）：Streams 是不可变的，意味着一旦创建就无法修改。对 Stream 执行的任何操作都会产生一个新的 Stream 实例。\n\
    - 并行化（Parallelization）：Streams 可以并行执行，这可以显著提高现代多核系统上的性能。\n- 可重用性（Reusability）：Streams\
    \ 在使用后就会被消费。如果你需要多次执行相同的操作，则需要一个新的 Stream 实例。\n\n## Common Stream 操作：\n\n**中间操作（Intermediate\
    \ Operations）**：这些操作将 Stream 转换为另一个 Stream。包括 `filter()`、`map()`、`sorted()`、`distinct()`\
    \ 等。\n\n**终端操作（Terminal Operations）**：这些操作从 Stream 产生结果或副作用。包括 `forEach()`、`collect()`、`reduce()`、`count()`、`anyMatch()`\
    \ 等。\n\n**短路操作（Short-circuiting Operations）**：这些是终端操作，允许在无限流上的计算在有限时间内完成。包括 `findFirst()`、`findAny()`、`limit()`\
    \ 等。\n\n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
