    \n# Flow Control in Java\n\nFlow control in Java refers to the ability to control\
    \ the order in which statements are executed in a program. Java provides several\
    \ control statements that allow developers to control the flow of execution based\
    \ on conditions or loops.\n\n### Conditional Statements\n\n- if statement: Executes\
    \ a block of code if a specified condition is true.\n- if-else statement: Executes\
    \ one block of code if a condition is true, and another block if the condition\
    \ is false.\n- if-else-if statement: Executes different blocks of code based on\
    \ different conditions.\n- switch statement: Executes different blocks of code\
    \ based on different values of an expression.\n\n### Looping Statements\n\n- for\
    \ loop: Executes a block of code a specified number of times.\n- while loop: Executes\
    \ a block of code as long as a specified condition is true.\n- do-while loop:\
    \ Executes a block of code at least once, and then continues executing as long\
    \ as a specified condition is true.\n- for-each loop (enhanced for loop): Iterates\
    \ over each element of an array or collection.\n\n### Branching Statements\n\n\
    - break statement: Terminates the loop or switch statement and transfers control\
    \ to the next statement after the loop or switch.\n- continue statement: Skips\
    \ the current iteration of a loop and moves to the next iteration.\n\n### Other\
    \ Control Flow Statements\n\n- return statement: Exits the method and returns\
    \ control to the calling method.\n- try-catch-finally block: Handles exceptions\
    \ and provides a way to execute code regardless of whether an exception occurs\
    \ or not\n\nBelow is the example of all control flow in IntelliJ IDEA. We will\
    \ see try, catch and finally later on\n\n```java\npackage org.example;\n\npublic\
    \ class FlowControlExample {\n    public static void main(String[] args) {\n \
    \       int score = 85;\n\n        // if-else statement\n        if (score >=\
    \ 90) {\n            System.out.println(\"Excellent!\");\n        } else if (score\
    \ >= 80) {\n            System.out.println(\"Great job!\");\n        } else {\n\
    \            System.out.println(\"Try harder next time.\");\n        }\n\n   \
    \     // switch statement\n        char grade = 'B';\n        switch (grade) {\n\
    \            case 'A':\n                System.out.println(\"Outstanding performance!\"\
    );\n                break;\n            case 'B':\n                System.out.println(\"\
    Good job!\");\n                break;\n            default:\n                System.out.println(\"\
    Keep working hard.\");\n        }\n\n        // for loop\n        for (int i =\
    \ 1; i <= 5; i++) {\n            System.out.println(\"Iteration: \" + i);\n  \
    \      }\n\n        // while loop\n        int count = 1;\n        while (count\
    \ <= 3) {\n            System.out.println(\"count: \" + count);\n            count++;\n\
    \        }\n    }\n}\n```\n\nTo get the explanation of code selecting main method\
    \ and in chat using /explain chat copilot command as showing in the next picture.\n\
    \n![](img/dbebbe5e20d39743ff28c8dae042defc_35_0.png)\n\n# Java Collections Framework\n\
    \n# What is collection?\n\nIn computer programming, a collection is a grouping\
