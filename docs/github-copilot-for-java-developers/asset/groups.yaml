    # Hierarchy of Java Exception Classes:


    The root class of Java''s exception hierarchy is java.lang.Throwable.


    It has two main subclasses:


    +   - Exception : Represents checked exceptions (e.g., IOException, SQLException
    ).


    +   - Error : Represents unchecked exceptions (e.g., OutOfMemoryError, StackOverflowError
    ).


    # Types of Java Exceptions:


    Checked Exceptions:


    Direct subclasses of Throwableable except RuntimeException and Error.


    Checked at compile-time.


    Examples: IOException, SQLException.


    Unchecked Exceptions:


    Subclasses of RuntimeException.


    Not checked at compile-time; detected at runtime


    Examples: ArithmeticException, NullPointerException.


    # Exception Handling Keywords:


    try...catch block: Used to catch exceptions and handle them.


    finally block: Executes regardless of whether an exception occurs or not.


    throw keyword: Explicitly throws an exception.


    throws keyword: Declares that a method may throw a specific exception.'
