    \n### 同步的类型：\n\n在 Java 中主要有两种同步类型：\n\n- 进程同步：处理不同进程之间的同步。\n- 线程同步：关注单个进程内部（线程之间）的同步。\n\
    \n### 线程同步：\n\n在线程同步中，我们有两个主要概念：\n\n- 互斥：确保线程在共享数据时互不干扰。\n\n通过以下方式实现：\n\n- `synchronized`\
    \ 方法：为共享资源锁定对象。\n- `synchronized` 块：允许对同步进行细粒度的控制。\n- 静态同步：适用于静态方法。\n\n线程间通信（协作）：促进线程之间的通信。\n\
    \n示例包括使用 `wait()`、`notify()` 和 `notifyAll()`。\n\n## Java 中锁的概念：\n\n同步围绕着一个称为锁（lock）或监视器（monitor）的内部实体。\n\
    Java 中的每个对象都有关联的锁。\n线程在访问其字段之前必须获取对象的锁，并在之后释放它。\nJava 5 引入了 `java.util.concurrent.locks`\
    \ 包，带有各种锁实现。\n没有同步的示例：\n\n考虑以下没有同步的示例：\n\n```\nclass Table {\n    void printTable(int\
    \ n) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(n\
    \ * i);\n            try {\n                Thread.sleep(400);\n            }\
    \ catch (Exception e) {\n                System.out.println(e);\n            }\n\
    \        }\n    }\n}\n\nclass Thread1 extends Thread {\n```\n\n```\nTable t;\n\
    \nMyThread1(Table t) {\n    this.t = t;\n}\npublic void run() {\n    t.printTable(5);\n\
    }\n```\n\n```\nclass MyThread2 extends Thread {\n    Table t;\n\n    MyThread2(Table\
    \ t) {\n        this.t = t;\n    }\n    public void run() {\n        t.printTable(10);\n\
    \    }\n}\n```\n\n```\npublic class TestSynchronization {\n    public static void\
    \ main(String[] args) {\n        Table obj = new Table();\n        MyThread1 t1\
    \ = new MyThread1(obj);\n        MyThread2 t2 = new MyThread2(obj);\n        t1.start();\n\
    \        t2.start();\n    }\n}\n```\n\n```\n输出（由于缺乏同步导致不一致）：\n5\n100\n10\n200\n\
    15\n300\n20\n400\n25\n500\n```\n\n## Java Synchronized 方法：\n\n当你将一个方法声明为 `synchronized`\
    \ 时，它就变成了一个同步方法。\n\n线程在调用 `synchronized` 方法时会自动获取对象的锁。\n\n当线程完成其任务时，锁会被释放。\n\n\
    ## 示例：\n\n```\nclass Table {\n    synchronized void printTable(int n) {\n    \
    \    // 同步方法\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(n\
    \ * i);\n        }\n        try {\n            Thread.sleep(400);\n        } catch\
    \ (Exception e) {\n            System.out.println(e);\n        }\n    }\n}\n```\n\
    \n记住，同步确保了线程安全并防止了多线程应用程序中的数据不一致\n\n练习：尝试使用 GitHub copilot 并根据以下提示词创建\n\n// 设计一个带有两个线程的程序，它们同时增加一个共享计数器变量。\n\
    // 使用 synchronized 关键字或锁对象实现同步，以确保\n// 计数器正确增加而不会产生数据损坏或竞态条件。\n\n答案：在接下来的两张截图中\n\
    \n```\npackage org.example;\n\n/**\n * 设计一个带有两个线程的程序，它们同时增加一个共享计数器变量。\n * 必须正确实现线程同步，或者使用锁对象。\n\
    \ * 确保计数器正确增加而不会产生数据损坏或竞态条件。\n */\nimport org.example.Counter;\n\npublic class\
    \ SyncExample {\n    public static void main(String[] args) {\n        Counter\
    \ counter = new Counter();\n        Thread thread1 = new Thread(counter);\n  \
