    \ `collect(Collectors.toList())` 将生成的 Stream 收集到一个新的 List 中。\n\nJava Streams 提供了一种强大且具表现力的数据操作方式，使得代码更加简洁、易读，并且通常比传统的命令式方法更高效。\n\
