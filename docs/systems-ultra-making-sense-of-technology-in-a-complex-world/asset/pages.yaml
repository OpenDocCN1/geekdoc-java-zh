  md: 'Madeleine Claire Elish identified the phenomenon of the ‘moral crumple zone’,
    in which responsibility gets misattributed to a person who has limited control.
    If the system works as planned, success gets attributed to the efficacy of technology;
    if it fails, human operators are blamed. This, Elish acknowledges, has equitable
    grounding: non-human entities cannot yet be responsible to society in ways that
