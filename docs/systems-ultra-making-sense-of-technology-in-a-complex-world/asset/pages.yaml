  md: '# 2

    Scale


    On 23 March 2021, the Ever Given container ship ran aground in the Suez Canal.
    Travelling westwards from Malaysia, the ship was buffeted by strong seasonal gusts
    of hot air – the khamaseen winds. The Ever Given was already travelling swiftly
    for a vessel of its size in the canal, belting through the waterway to try to
    move through the wind rather than be blown off-course. At around 7:39 am, having
    been gradually pushed by the winds towards the east bank of the canal, the ship
    attempted to readjust, overcorrecting as it did and suddenly moved westwards,
    displacing water as it swerved. The Ever Given swung through the stream – stern
    one way, bow the other, its snout ploughing into the sand of the east bank. The
    ship was stuck and the Suez Canal – abutment to the flow of global supply chains
    – blocked.


    Like many others, I first heard of the Ever Given was through social media via
    an image taken from the Marine Traffic site. On a regular day, the ship maps the
    flow of marine vessels across the world in real time, as soothing flocks of tiny
    coloured rhomboids bobbing across the oceans. On the morning of the grounding,
    a screenshot from the site showed simply a yellow shape clearly wed at an uncomfortable
    angle between two boundaries. This ship was not going anywhere. As the event was
    confirmed and news reports started to investigate the implications for global
    supply chains, the photos from Egypt began to arrive. First, a shot from above
    – the satellite image version of Marine Traffic’s diagram, the sandbanks yellow
    and the ship a Lego construct. And then, a photo taken from the ship stuck behind
    the Ever Given, which gave a sense of the heft of the thing.'
