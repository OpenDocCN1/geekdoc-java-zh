    And yet: I think the framing of the moral crumple zone applies well to Liang,
    and to any other ‘rogue engineers’ out there. Remember, the crumple zone exists
    to protect passengers who are held in the rigid safety cage; it achieves this
    purpose by absorbing energy and destroying it. So, what does the moral crumple
    zone protect? Not senior management, we’ve seen from the downfall of the Volkswagen’s
