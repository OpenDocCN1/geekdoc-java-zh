  md: 'a certain way. As the technology anthropologist Valerie Olson explains, ‘system’
    can describe an idealised interconnected coherent structure, but so too can hierarchies,
    rhythms, and assemblages.¹13 What I want to do here, guided by Olson’s work on
    how ‘system’ is strategically deployed as an authoritative scientific and philosophical
    metaphor, to trace where this metaphor comes from, and why it has such influence
    on technology and politics– not to reify it, but to dismantle it.


    For brevity, I’m going to focus on two crucial points in this history: the emergence
    and propagation of the concept of ‘system’ in early modern Europe, and its resurfacing
    in mid-twentieth-century North America in cybernetics, Cold War strategies and,
    ultimately, Silicon Valley.


    Let us start on a cold night in Italy 1610, where the astronomer and engineer
    Galileo Galilei is peering through a spyglass to the winter sky to see the planet
    Jupiter. On either side of the planet, Galileo saw a dotted line made of several
    points of light, very small but very. ‘I therefore conclude and decided unhesitatingly’,
    he wrote, ‘that there were three stars in the heavens moving around Jupiter, like
    Mercury and around the sun.’ That is: those little points of light were moons.


    Why did this matter? Galileo was not the only person stargazing with a fancy telescope
    (‘a very excellent instrument’, he notes approving). Finding a gaggle of new objects
    was not that big deal. What was important was the relationship between these objects
    which Galileo understood to be comparable to that between Earth and its own moon.
    The Jovian satellites revealed that Earth wasnt the only centre of rotation in
    the universe, and that implied the possibility of other similar set-ups. Finding
    a system in the natural world is like finding a mouse in the kitchen: it implies
    the presence of more like it.


    Galileo’s revelation was: both an idea that could be used for thinking specifically
    about Earth and Jupiter, and an analytical tool in its own right. It provided
    the empirical proof of Nicolaus Copernicus’s hypotheses of heliocentrism. Galileo
    wrote of all of this in Sidereus Nunci (‘Starry Messenger’), a short tract peppered
    with observations and sketches. The illustrations were important in conveying
    what words could not, emphasising that human senses alone weren’t sufficient to
    grasp the entirety of the natural world, and perhaps not even to be proved. There
    were drawings of the surface of the moon which showed it was cratered and scarred,
    not the perfect'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'smooth surface which had previously been imagined. And, of course, a sketch
    of that line of three stars with a circle nestled between the second and third.


    In Enlightenment Europe, the notion of system law circulated first as a scientific
    framework. Isaac Newton gave further credibility to the concept when he treated
    gravitational forces as a system; both as mathematical calculation to describe
    scientific incidences, and as a common force aligning the stars in their heavens.¹14
    Through Sidereus Nuncius and Newton’s Principia Mathematica, the concept of system
    was propagated through print media, allowing it to circulate and be reproduced
    and appropriate. It travelled, out of mathematics and astronomy, where it was
    associated with natural phenomena, and into philosophy, where it became abstracted.
    Here ‘system’ was transformed into a wholly framework that any discipline could
    drop its ideas.


    The anthropology scholar Marilyn Strath describes this transformation was made
    possible by another structure which had emerged during this period of English
    kinship law. The ‘relation’ was a legal logic of totality’ which allowed principles
    and forces to exist beyond the sum of its parts.¹15 This logic allowed the elites
    of the Enlightenment to strip a structural framework from its context, appropriating
    the scientific principles of post-Copernican cosmology into a philosophical tool
    that could be used to analyse any structure defined by relationships– but, crucially,
    without disturbing the existing logics of Western patriarchal thought and order.


    When used by philosophers includingmanuel Kant, René Descartes, John Locke, Georg
    Wilhelm Friedrich Hegel, and Alexander von Humboldt, ‘systematicity’ became not
    only a structure for thought but – Valerie Olson describes it – a sensibility.
    To work with systemic frameworks, there was a malla of good thought, demonstrating
    completeness and order. It also allowed its proponents to sweep away any real-world
    contradictions that made their heads up.


    ‘System’ became a totalising and simplifying concept. If something from the real
    world did not fit into its binding principles, it could quite be glossed over.
    To demarcate something as a system tied material fact to philosophical truth –
    and, under a systemic framework, the way that knowledge was produced also represented
    what reality.¹⁶'
