    when things fall apart and the centre cannot hold?


    One of the common answers to the question ‘what happens when systems break?’ is
    this idea can be traced back to Susan Star’s article from 1999, ‘The Ethnographies
    of Infrastructure’, in which she writes: ‘The normally invisible quality of working
    infrastructure becomes visible when it breaks: the server is down, the bridge
    washes out, there is a power blackout. Even when there are back-up mechanisms
    or procedures, their existence further highlights the now-visible infrastructure.²


    Though this line of thought has been challenged, the idea of functioning infrastructures
    (and, by proxy, systems) as unseen becomes doctrine for how systems are conceptualised
    as a hidden backdrop to the real world. But as we’ve seen, systems don’t need
    to stop functioning to overspill their boundaries and become present, if we know
    what we are grasping. The anthropologist Brian Larkin divides, instead of assuming
    that systems are inherently invisible, it is far better to ask how and why we
    are asked to avert our gaze from their presence at certain junctures.³


