  md: 'A diagram can be useful for showing how this surprise is created: a strangely
    shaped truck is designed because networked technologies and supply chain flow
    means lots of people are ordering lots of parcels online. Another surprise is
    that tr refrains are actually pretty good for describing process. ‘A stitch in
    time saves nine’ is the easier articulation of, ‘Because of feedback delays within
    complex systems, by the time a problem becomes apparent it may be unnecessarily
    difficult to solve’.


    In other words: systems can be more easily comprehended second-hand and indirectly;
    that is, as metaphor. The design scholar Dan Lockton argues that a system is a
    fiction created to understand invisible relations, in which metaphors are used
    to make abstractions tangible and shareable. Systems are therefore both conceptual
    – a way of knowing the world and something which is really there. The metaphors
    that Donella Meadows deploys in Thinking Systems to describe specific qualities
    of systems are pretty general. But metaphors are not neutral. They carry their
    own meaning which seeps into their subject is seen.


    What do you think when you think of a system? Maybe you do as the characters in
    John le Carré’s novel The Constant Gardener, for whom the System is the British
    Empire: corrupt, violent and powerful, its tendrils stroking every corner of the
    globe. Perhaps you were out in Brighton last autumn, placing neon stickers on
    walls which read: ‘If we don’t want to fuck the system, baby, we’re fucked.’ Maybe
    you you would align with the art collective Black Obsidian Sound System who state:
    ‘The only good system is a sound system.’ Maybe you remember Morpheus telling
    a wide-eyed Neo, ‘The Matrix is a system, and that system is our enemy.’ Maybe
    you do not even think of the word ‘system’ but go directly to TV shows where detectives
    and would-detectives jab at a wall collaged with mugshots and scraps of paper
    and pinned with red string, trying to make sense out of the mess. Fiction and
    creative work is so good for viscerally demonstrating the frustration and anger
    that comes with existing within a large and powerful structure which behaves set
    against you.


    But maybe when you think of a system, you think of a car that links combustion
