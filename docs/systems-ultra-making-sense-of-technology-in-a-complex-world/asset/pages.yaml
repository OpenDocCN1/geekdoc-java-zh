    was the era when the new internet crawled into the world, bringing with it the
    particular juxtaposition of dispersed ‘virtual’’ shared through screens, and the
    machines that housed them.


    ‘Declaration . . .’ was written in these shifting landscapes. To the crowds at
    Davos, Barlow announced that the internet could not be controlled as other industries
    had been because it existed beyond any nation’s boundaries and controls. Furthermore,
    it could not be controlled because it had no materiality. The new realm of cyberspace
    was positioned in direct opposition to incumbent industries. ‘Governments of the
    industrial world, weary giants of flesh and steel’, opens the speech. ‘Cyberspace
    does not lie within your borders . . do not think you can build it as though it
    were a public construction project.’ Barlow rated the heads of industry out of
    touch, ‘increasingly obsolete’; dim enough to think that matter was important,
    and that the ideas which drive the information infrastructure of the internet
