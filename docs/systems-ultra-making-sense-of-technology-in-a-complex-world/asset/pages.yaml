    ‘THINK ABOUT THIS’, demands a textbox in Donella Meadows’ ‘Thinking In Systems’:
    ‘How do you know whether you are looking at a system or just a bunch of stuff’¹
    If it has parts which affect each other to produce a collective effect which persists
    over time, yes – it’s a system.


    Systems have temporality: they are defined by time. Comprehending how systems
    move through time – or, how time moves through a system – is challenging. While
    visual forms such as diagrams and maps are equipped to take systems in their own
    terms, they are constrained by their need to capture some aspect of them and make
    it legible. Graphs are pretty solid at depicting behaviour over time, rather than
    focusing on individual events, with the horizontal axis pushing out towards the
    time horizon, raising questions about what came before and what is y to come.


    From a cybernetic reading, time occurs in a system via the series of checks and
    controls which allow the system to maintain its persistent behaviour. I cut my
    finger: my biological defence feedback systems kick into play to clot the blood
    with platelets, fight infection with white blood cells, and strap strands of collagen
    across the wound to assist repair. The skin heals, my body returns to its desired
    state of health – and, if I cut my finger, the whole cycle begins anew. When we
