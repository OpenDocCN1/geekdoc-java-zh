    how her go-to line for critiques of student projects is: ‘Will it scale?’ This
    is not meant only as caution against ‘starchitect’ dreams of designing oligarch-worthy
    structures, but also as a test of students’ understanding of material qualities
    and construction methods.


    Scale creates graduated differences in size and form. As Paul Dourish writes:
    ‘Scale and size ... are not the same thing at all. If we think about simple massification,
    we might talk about the difference between a single cell and ten million cells,
    but that’s not the same as talking about a human arm. Scale is a dimension along
    which different objects arise; the arm exists as an object at one scale, the cell
    at another’⁴


    What do these peculiarities of scale feel like they brush up against us? This
    might feel like a ridiculous question, given the obvious size of something like
    the Ever Given, one of the most gigantic ships in the world, built to the material
    limits of engineering possibility and sliding across the world through a channel
    created by a slab of land sliced off Egypt. Yet this monstrous thing is not the
    system of global logistics itself or its homunculus, but only one outlying.


    Scale is what puts the ‘hyper’ into ‘hyperobject’: the point at which the ever-present
    thing pokes through the mesh of its own existence and into the human experience.
    Its scalarity creates unsettling effects which warp and disorient our attempts
    to perceive them. The stunted human sensorium is no match for the vast multidimensionality
    of the hyperobject; our cognitive limits are stretched by how it challenges the
