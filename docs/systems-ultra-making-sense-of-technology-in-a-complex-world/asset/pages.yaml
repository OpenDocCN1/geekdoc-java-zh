    Systems do not just happen. Those on show at CES may be constructed materially,
    but their comprehension is culturally reinforced. By the show’s end, feet aching,
    caffeinated into the sun, trapped in the swell of several thousand longed attendees,
    and staring at what describes itself as a ‘Smart Door’, you may ask: truly, what
    hell is going on?


    This is a book about making sense of what it is by ‘systems’. I will be honest:
    one of the biggest and dumbest challenges here is that it is extremely difficult
    to write about systems that they cannot adequately be described using words. Think
    of a system and you might think of a headache of a diagram in a PowerPoint presentation,
    filled with hatched lines and sprinkled with phrases like ‘Pig Model’ and ‘Rich
    Picture’. At their core, systems are about the relationships between things, and
    then the relationships between those relationships. Lots of attempts to comprehend
    systems rest on foment a technical understanding of how these parts interlock
    and affect each other; and thus the horrible diagrams. Verbal attempts to encapsulate
    what a system is can feel like a stoner monologue with pointed hand gestures (‘Have
    you ever thought about electricity is, like, *really big*?’)


    But system also has a meaning of its own. As a word, system is often used interchangeably
    with technology and infrastructure. While different, the three share cultural
    expectations. They have a similar texture of technocratic authority. You might
    expect to see any combination of technology, system, and infrastructure on the
    cover of an airport management book, or in the slide deck for a RAND report. These
    terms imply some crucial power structure, bound to an expectation that to understand
    is to control it. Those who can control it, and woe betide anyone finds themselves
    on the wrong side of power dynamic.


    Systems are both structure and behaviour. These interlinked complexities of systems
    create the challenge of talking about them and the meanings that get loaded on
    them, but not in a way that is immediately obvious. Donella Meadows takes a structural
    approach, exploring how the relationships set up in a system can behave, often
    in unexpected ways. Systems are surprising, she tells us.⁵'
