  md: 'Air traffic control is not a euphemism – it is the means of controlling traffic
    in the air, keeping planes at a safe distance from each other and guiding them
    in and out of airspace. The world''s first purpose-built terminal opened for business
    in 1920 in Croydon, England, where employees also used a flag system to guide
