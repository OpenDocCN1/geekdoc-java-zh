    system throughout space and time.


    Different pieces of the system might take a hit, but the idea of the functional
    role, of cars as seamless cyber-physical entities which were always destined to
    exist, survives. Engineers and vice-presidents might be jailed, more stringent
    emissions tests might be introduced, but the system will abide. As we’ve seen
    throughout this book, the sheer complexity of these types of systems means they
    defy simple exposition. When a straightforward narrative is applied, viz. ‘A bad
    man did it and ran away’, we now understand that this story does not explain or
    simplify a difficult knotiness, but instead distracts attention as an act of self-preservation.'
