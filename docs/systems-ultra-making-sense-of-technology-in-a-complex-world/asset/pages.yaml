  md: '# 6

    Breakage


    Late summer, a swelteringly hot afternoon in South East London, and my friend
    Oliver and I are sitting in the over-heated basement of an institutional building
    that sits alongside a huge and complicated roundabout structure. This road system
    is incredibly poorly designed, having been the site of numerous accidents as cars
    and buses misalign themselves in the wrong lane; even walking into this building
    involves sharp near misses with cyclists belting the tight curve of a bike path
    that has stupidly been built directly in front of the main entryway. Through the
    windows comes the muted roar of vehicles and fug of exhaust fumes which acts an
    unexpected sensory accompaniment to what we''re watching on the laptop. We are
    researching the largest and most expensive industrial automotive accident in recent
    history; we want to know what happens when cars break.


    Car crashes are spectacular and terrible. The thrill of watching speed racing,
    whether Formula One or the Fast & Furious franchise, comes both from the pleasure
    of seeing beautifully engineered sleek machines pushing their limits but also
    for the horrible possibility of the crash and the explosion, as thousands of pounds
    of steel and petrol pass the point of human control to be acted by the physical
    laws of the universe. Outside controlled entertainment these accidents tend to
    be seen in the horror of the aftermath, as a pile-up on a motorway and the subsequent
    news report.


    For a more humane viewing spectacle, there are tons of car crash videos online.
    In slow motion a car will ascend the side of a steep ramp before slipping and
    flipping over itself, wheels in a slow swivel. For a moment, the metal hulk is
    weightless, transcendent. And then gravity takes hold, and the car comes crashing
    back to earth again.'
