  md: '‘shift your mindset’. Writing about the emergence of complex information systems,
    James Bridle makes a call for an urgent understanding of these systems and their
    ramifications.² Everyone agrees that a vocabulary of these assemblages is a challenge,
    though.


    Systems, Donella Meadows, are structures defined by relations, with parts that
    stand together and relate to the whole; and thus are notoriously difficult to
    articulate in writing. They cannot be described in a neat, linear way, but through
    a language that shares some of their properties.³ The philosopher Timothy Morton
    goes further, describing certain types of sprawling complex systems as ‘hyperobjects’,
    such as the internet and climate change, that exist through space and time. They
    are difficult to conceptualise, emerging and submerging through our limited human
    consciousness.⁴


    There’s a very human hand at play on the floor show, which also shapes how the
    man-made systems on sale are not only built but known. As we have seen, CES should
    theoretically be able to easily engulf guns, sex and construction into its maw,
    but these categories have minimal presence at the event. Military funding underpins
    the technological functioning of firearms or defence products. ‘Vehicle Tech’
    does have its own area, but a lot of what is on show is vapourware the fully functional
    machines which are ready to roll out of the concourse at World of Concrete and
    on to the construction site. At CES, a car is often a concept intended to carry
    an idea, a vehicle to carry actual passengers.


    And then oy! sex. In 2019 an elegant vibrator made by Lora DiCarlo – visually
    indistinguishable from many of the tamer, rubbery, white, curved devices on show
    – won the ‘honoree’ designation in the ‘Robotics and Drones’ category at the CES
    Innovation Awards. Although ‘sec tech’ has at CES for a while, the Consumer Technology
    Association, which runs the award, freaked the hell out and revoked the prize.
    A flurry of complaints, the award was reinstated, and sexual health devices were
    allowed to compete for the prize the following year. The whole shebang exemplified
    how weird CES gets around sexuality and gender. Despite giving rise to the accursed
    form of booth babes, women (and men) who augmented the show’s atmosphere with
    ambient vibes of attraction and'
