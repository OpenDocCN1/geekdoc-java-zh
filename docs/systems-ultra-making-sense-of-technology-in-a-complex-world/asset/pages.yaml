  md: 'boxes and everything which is inside them. Maybe you think of the strange things
    that happen when any part of this gets disrupted; say, in a global pandemic.


    People fall ill; workplaces close; factories reduce production of semiconductors;
    manufacture of devices dependent on those semiconductors, like cars, also slows.
    Cities shut down; Any stock lucky enough to leave the factory and its way on to
    a container ship might not itself waiting for weeks and months offshore. Not enough
    stevedores to remove them from the vessels. Not enough drivers to transport them
    elsewhere.


    None of this was a surprise to anyone who spent time working to the drumbeat of
    ‘if this then that’ which defines operational logistics, but the COVID-19 pandemic
    shifted a light on the structures that kept the world in flow and the visceral
    frustrations which came when they snarled up. ‘IT’S A GREAT TIME TO BE WRITING
    A BOOK ABOUT SYSTEMS,’ I messaged a group chat in the heart of one of the workers.


    How systems are imagined enormous consequences. It’s common to find fictions and
    metaphors clustered tightly around new technologies early on their inception to
    steer their development. Human-made things do not cleanly emerge into the world
    at the end of a tidy process but are tugged and tossed by social and political
    forces that shape what these things are and will be. In the early stages of development
    when what a thing is as messy and fluid as butter, fictions and metaphors act
    as the tin to pour the batter into and shape it as it bakes.


    Take the idea of autonomous vehicles, which has been hyped at CES for years now.
    None of them exist in any complete, mass-manufactured way. You cannot contact
    a dealership to buy one, not take any of the models from the show floor out into
    the streets. What’s on display is partial and experimental: combinations of engines
    and sensors, beacons embedded into highway asphalt, and student projects. So-called
    self-driving cars out on the roads exist under test conditions. But none of this
    uncertainty is on show at the show.


    Instead, the idea of the autonomous vehicle is solid with absolute self-confidence.
    People are now passengers, which is all for the best given that, as one autonomous
