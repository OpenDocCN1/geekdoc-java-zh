    Wireless telegraphy had been used successfully on ships for a long time by this
    point: as solo vessels, moving through uncertain and dangerous waters with the
    direction of travel marked out by compasses and a bright map of beacons – the
    stars above – ships were the perfect test bed for a technology which allowed communication
    beyond the immediate realm. One of the first wireless distress signals ‘CQD’ was
    created in 1904 by the engineer Guglielmo Marconi, specifically for ships in distress.
    Decades before radio equipment became small enough to be built into cockpits,
    the British shipping company White Star Line had the headlines after a communications
    snafu aboard their largest steamship led to the wireless operators missing crucial
    messages from nearby ships about an incoming ice field on the transatlantic crossing.
    The ship – RMS Titanic – struck one of the ice floes and sunk. With more than
    1,500 lives lost, it was one of which could potentially have been avoided the
    deadliest peacetime maritime disasters in history – and one could have been overwhelmed
    and confused by the catastrophe unfolded.


    Ships today, like planes, still use radio to communicate. In an earlier project,
