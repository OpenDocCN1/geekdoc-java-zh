    Unable to rationally pass the difference between ‘Neat! A really massive!’ and
    ‘Oh my GOD, we’re all going to die’, the mind collapses the two and locks into
    what Burke describes as the strongest emotion which we are capable of experiencing:
    a paralysing and overwhelming vortex of awe, wonder, and terror.


    So, this feeling in my blood is nothing new, and in fact has been the subject
    of enthusiastic discussion and unpicking over the centuries. ‘Critique of Judgment’,
    Immanuel Kant teased out further subtleties, arguing that the sublime included
    both pleasure and pain, it was not the opposite of beauty. He instead carved out
