    Matter


    Pier 9 juts from the edge of San Francisco’s Embarcadero waterfront, into the
    eastern waters of the bay. Every morning the red Bar Pilot boats dock outside
    its windows, through which you can see the Bay Bridge with its double stacked
    freeways and, and in the background, the gantry cranes of the Port of Oakland.
    A little further to the northwest, the Bay transforms into the Pacific Ocean.
    Here, the water is more than one hundred metres deep in places, and humpback whales
    navigate the Golden Gate Bridge.


    Pier 9 is both literal and titular. The structure is an actual pier, one of dozens
    on waterfront – and it is also the specific name given to the facility housed
    upon it. Inside this building is a state-of-the-art fabrication workshop that
    plays host to some of the most beautiful industrial machines one could ever hope
    to work on. Each contraption grapples with the physical world in some way. In
    the woodwork shop, a spinning table carves chunks of wood like a knife through
    cream cheese. The next room has a baby-blue five-axis CNC router which is an empty
    metal cube of the studio apartment. An array of sharp tool parts strings across
    its ceilings and walls via a crane mechanism, allowing them to slide around in
    five dimensions to sculpt wood and foam into almost any shape. There are laser
    cutters and waterjets for slicing metals and plastics. Almost every machine here
    was designed for industrial use, and has it that this is one of the few workshops
    in San Francisco where every single piece of kit was bought new, their efficiencies
    undimmed by years of use.


    The competence of the machines seems to meet, head-on, what the architect Bryan
    Boyer describes as the ‘matter battle’ – the power relations which matter exerts
    on those who would try to command it. Matter, we'
