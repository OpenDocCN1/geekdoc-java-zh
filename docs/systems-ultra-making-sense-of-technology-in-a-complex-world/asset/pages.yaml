  md: 'Earlier forensic examination of aeroplane crash sites by the American engineer
    Hugh De Haven had determined that the human body was capable of withstanding the
    tremendous forces caused by impact providing that they were protected by a crashworthy
    structure around them. 25 In the United States, this observation shifted the nature
    of automobile safety away from preventing accidents by reforming the reckless
    driver, bringing it in line with the German strategy of reducing injuries and
    fatalities by reimagining the automobile itself, and ushering in a new job title:
    the safety engineer, whose dedicated role was to research vehicle impacts.


    One of the safety engineers was Béla Barényi, hired by Daimler-Benz in 1939, and
    who worked on the energy problem. As a car crashes, the kinetic energy released
    by its sharp deceleration transfers into the body of a vehicle, collapsing it
    (think of what happens if you drop an egg onto the floor the shell will shatter).
    Building on De Haven''s research, the prevailing view at the time was that a car
    with maximum rigidity served passenger safety. However, subsequent crash test
    showed that while rigid structures withstood impact, the energy of the collision
    would then be transmitted through them and into the occupants, who would be thrown
    around the structure as clothes flung around a rotating washing drum.


    If the car body were built from softer, more malleable materials the energy of
    the crash might be absorbed into the frame as it crashed – but this would also
    crush the passengers. What to do? Barényi''s innovation was split the carriage
    into three parts. At front and back were the ''crumple zones'' which would collapse
    through controlled deformation on impact, increasing the time that the vehicle
    took to come to a stop and reducing the magnitude of forces felt by the passengers.
    In the middle of the car was a rigid compartment — the safety cage — which protected
    passengers.


    The invention of the crumple zone formed part of a critical turn in safety-testing,
    suggesting that drivers could not help but be involved in accidents, carmakers
    were implicated in motor fatality rates and had a responsibility to design and
    manufacture crashworthy cars.26 As a corollary to this, carmakers realised that
    they could sell themselves through their dedication to safety — on visiting the
    Ford crash testing facility in 1955, Mercedes-Benz engineers were surprised to
    find their US counterparts already using accident research in their marketing.
    This shift'
