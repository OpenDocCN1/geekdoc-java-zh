  md: 'People are part of systems too, and people are made of matter. Fabrication
    facilities are very keen to emphas this point. To cross the threshold into the
    workshop, you must concede that your body is soft and fallible, and that the world
    is ready to burn. Goggles and ear protection and masks recommended if using the
    most aggressive machines. Hair must be tied back: an apocryphal story swirls like
    a campfire tale of a young woman in another workshop who did not pull her long
    hair back into a bun and some of it caught in a device, and her entire skeleton
    was ripped out of her body. (Not all biological matter regenerates.) What gives
    this story a crumb of believability is that the machines are more than equal to
    this violence; blades, drills, jets of water that cut like a knife, electric arcs
    in the welding bays, and more.


    I had come to Pier 9 with my collaborators Deb, Sherri, and Ingrid, for a project
    that explored the legacy of the Bay Area''s military history on its current technology
    sector, through the lens of matter and manufacturing practices.² Predominantly
    contained down in the South Bay, Silicon Valley wraps itself in rhetor of immateriality
