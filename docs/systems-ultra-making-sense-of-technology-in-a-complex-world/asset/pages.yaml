    Burke’s formulation of the sublime grew out of an attempt to describe and rationalise
    that which was beautiful. What beautiful would stimulate as love and relaxation,
    the sublime would invert – still maintaining a sense of awe and wonder, but now
    interweaving that feeling with terror. Scale was intractably associated with this
    formulation: small things could sometimes be seen as beautiful, but large things
    were off the table. ‘It is impossible’, he states, ‘to suppose a giant object
