  md: 'went hand-in-hand with increased regulation around automotive design. From
    field tests to laboratory conditions, the spectacle of the crumple zone crumpling
    became the crash test''s ritual object.


    The closed circular logic of the techno-scientific ritual is only as successful
    as its initial starting conditions. While the crumple zone was effective in channelling
    energy away from passengers, this design was still predicated around what was
    assumed to be the most common type of accident – the head-on collision, in which
    cars would drive straight into a barrier or another vehicle, colliding bonnet-to-bonnet.
    But accident reports from around Stuttgart indicated something else was happening.


    Rather than crashing head-to-head, cars driving towards each other in opposite
    directions were more likely to collide on their edges, clipping shoulder to shoulder.
    This is the off-set collision, where a quarter or less of the dashboard collides
    with something else, and it is lethal. Only a small part of the crumple zone is
    able to absorb its impact. Instead, the car is sent into a spin, ricocheting passengers
    into the pillars, doors and windows. Once the facts of this type of crash were
    known and had brought into the lab, it could be reproduced and analysed. While
    earlier tests with wooden balls attempted to simulate cranial collisions, the
    speed and rotation of the offset crash was more likely to result in internal injury.


    Following on these types of discoveries, Daimler-Benz expanded the testing framework
    into ‘systemic accident research’ – distinct from reassigning blame to the individual
    driver, this framework asked not only what happened in the instance of the crash,
    but also what was happening in the wider social system in which the vehicle operated.
    Nevertheless, the shift from ‘road to lab to math’ continued, relocating the understanding
    of vehicle dynamics to controlled laboratory experiments and maths-based simulation
    models.²


