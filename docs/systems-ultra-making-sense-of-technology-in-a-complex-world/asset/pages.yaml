    has shaped our common understanding of what digital systems are. The term ‘information
    architecture’, which describes a shared digital environment, is not simply a metaphor
    but acknowledgement that systems were first built for architects who had turned
    to computers in the 1960s to try to meet the growing complexity of their profession.
    They, in turn, often worked with cybernetic theory to try to envisage flow and
    feedback in design problems.6


    In systems design today, architecture is a powerful metaphor that engineers and
    designers use when they want to talk about complexity because an architectural
    problem is complex, with three-dimensional elements and real-world qualities of
    scale and matter.7


    In short: it is because – and not despite – their physical endpoints that architecture
