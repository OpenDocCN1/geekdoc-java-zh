    joysticks built into it and smaller touchscreens within reaching distance. Here,
    the user was designed into the action. As they sank into the chair, they became
    one with the machine and became enmeshed into a whole system of computational
    action that combined the user, the interface and the environment together, seemingly
    without hierarchy. There wasn''t a ‘computer’ in the Media Room – everything in
    the Media Room was the computer.


    The embodied action of working on a computer graphics program was the very point
    of the research group, where the movements and expressions of the user were translated
    into command. Put That There, a project which explored voice and gesture recognition.
    A video of the project from 1979 shows a blind man in a red jumper sitting in
    the control chair. A huge black screen fills the opposite He moves his left wrist:
    a white cursor appears. He points to the upper right of the screen. ‘Create a
