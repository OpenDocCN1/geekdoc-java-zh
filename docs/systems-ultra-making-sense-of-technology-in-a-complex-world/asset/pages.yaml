  md: 'The design set of the show created a legible whole. CES of 1972 has the blocky
    feel of a Playmobil kingdom where bright chunky stands are laid out on a primary-coloured
    grid system, scattered throughout enormous monuments paying tribute to some electronic
    monarch. As electronics seeped into everything and software ate the world, the
    boundaries softened and blurred. Helicopters were on show at CES in 2018: asked
    Volpicelli whether these vessels were considered ‘consumer electronics’, a vice-president
    of Bell Helicopters replied breezy, ‘Sure.’


    So perhaps it''s not surprising that CES is a hot mess of a Friday casual hellscape;
    a city superimposed on a city. It''s all a long way from the original expositions
    and world''s fairs of the nineteenth and early twentieth centuries that aimed
    to offer a coherent vision of a better future which was thematically tied to whatever
    the show''s theme was, even if celebrating the construction of the Panama Canal.
    The only canal here is the artificial one in the Venetian hotel, where crypto
    bros set up under the unreal sunset to forg imaginary currencies. Across town,
    someone has connected a bathroom mirror to a server. At the 2022 show, there''s
    a ‘futuristic’ truck off from the US Post Service, whose main innovation is a
    larger cargo capacity to deal with all the parcels people are ordering from Amazon.
    I liked the USPS truck much more than the Laocoön monstrosity of a car, also on
    show, that purports to transform a vehicle into a gaming hub.


    Maybe this is inevitable. How could anyone create an understandable story which
    ties together, the fabric of a device; and its tiny embedded sensors that track
    heart rate and location; and, embedded software that crunches this data to determine
    habit and behaviour; and the server farms that collect and collate this material
    through environmentally-intensive processes; and any ethical and political considerations
    around any single part of this process, let alone how all of moving parts interact
    with each other? (This is for a smart dog collar, by the way.) Background and
    foreground collapse into each other.


    In the light of increasingly complex technologies and phenomena like climate change,
    there''s these strange rumble of calls for a new kind of systems literacy: not
    to treat these strange entanglements of nodes and connectors as definable *things*
    but to create a fundamentally different way to know them. This goes beyond the
    airport-bookshop model of systems thinking which tends to involve a lot of graphs
    and urges to'
