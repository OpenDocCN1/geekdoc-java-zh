  md: 'Across the road – the monorail will take you there! – is the SHOT show, a fully-functional
    acronym for Shooting, Hunting, and Outdoor Trade vendors who are also pretty comfortable
    with what they offer. No big surprises here among a swell of cameo-aesthetics:
    here’s guns, here’s ammo, here’s the FBI proffering leaflets on economic espionage,
    there’s crystal Swarovski, who make both glittering earrings and rifle scopes.


    Further south is the Adult Entertainment Expo – AEE – where, in one hall, performers
    take themselves with fans, and in another, vendors sell ‘adult novelty’s (viz:
    sex toys). By necessity the sex industry has always been self-aware of how and
    they are perceived. The only attempts to disguise themselves come through ‘discreet’
    offerings such as the elegant pastel-green vibrator shaded like a stingray, though
    on this is now next to a vibrator that looks like a larger, angrier version of
    the body part it’s modelled on.


    In theory, CES comfortably envelop guns, concrete and porn. Electronics and code
    have been seeping into everything for fifty years, with networked connectivity
    now attaching everything to everything. CES has indeed spread; what used to be
    a ‘tractor’ is now a ‘cyber-physical entity’ that farmers can lease but never
    truly own. At AEE, dozens of cam performers are livestreaming from the corridor
    where adult film actors used to do signings, indicative of how new payment infrastructures,
    streaming platforms and ring lights have radically restructured the industry to
    permit performers to engage directly with customers. The paranoia of the gun has
    been augmented by software threaded into ‘smart’ security cameras and ‘smart’
    locks which allow remote access to firearms.


    It is easier to create a narrative for a thing than around the strange interconnection
    of things. Historically, these theatrics were what CES excelled at. In its early
    years during the 1960s and 1970s, the show was a more elegant and coherent affair.
    New-fledged devices with solid state electronics and imports from Japanese manufacturers
    were given a glamour and atop brightly coloured plinths coated in psychedelic
    swirls. Wristwatch radios! Portable phones weighing nineteen pounds and requiring
    an FCC licence to operate! Audio equipment was dramatically lit by spotlights
    against a brick wall, as if about to deliver incisive political stand-up.'
