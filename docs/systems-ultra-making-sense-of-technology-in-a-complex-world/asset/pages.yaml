  md: 'richest. Only global tech giants can afford to buy the space to set up their
    stunts. Sometimes the space is nowhere near Nevada: in 2014, the GPU company Nvidia
    created a crop circle in the shape of a computer chip in the Californian barley
    field, as a promotion for its new processor.


    Many of the rest of the folks are what the writer Gian Volpicelli describes as
    the desperados in the small potato pockets, shivering in air-conditioned plastic
    grids.¹ Money doesn''t seem to buy imagination here though. Sure, it''s a challenge
    to make a spectacle something as tiny as a microchip, or as immaterial as a new
    software platform, but everyone seems to be scared of using the same colour palettes
    and shades. The curves are all the same. The lighting fl flattens everything into
    the same form. A visitor at the 2022 show was bathed in a vapourwave sea of soft
    light in pinks, greens, and purples regardless of whether they''re inspecting
    Singaporean gaming hardware, or a tunnel built by the world''s richest. Something
    like the Google Assistant slide at the 2020 show – where attendees, clutching
    backpacks full of corporate swag, slide from one into a ball pool – for good photos
    but is utterly untethered to what the technology itself does.


    As you yomp through the halls, you will pass hundreds – thousands – of stalls
    where eager vendors in polo shirts are ready to make the sell on their thing:
    a car, a phone, a tractor; a screen, some software; a shoe; a digital cockpit,
    a dog collar, a door handle. Deep down, you know that these are distinct entities.
    And yet in the cavernous halls, your heart and brain both jacked up by of coffee
    and deprived of natural light, every thing here is collapsed into samoday, inmate
    mass.


    There are no existential questions about the identity of the trifecta of trades
    that come from Las Vegas later January. One week after CES has packed up and left
    town, concrete, guns, and pornography come to take its place and each industry
    is extremely secure and confident in who they are. Agricultural machinery takes
    the Convention Centre as the building is repurposed for World of Concrete. Here
    concrete pumps puzzle their noses against the ceiling, their Jurassic scale more
    suited to the size of the place. No questions here for the construction industry
    about its selfhood, as it fills the hall with gigantic machines and scaffolding
    and the parking lots outside with wall-building competitions and vehicle rallies,
    where drivers in road diggers careen around an obstacle course as fast as they
    can.'
