    Social scientists describe this process as a sociology of expectations.¹¹¹ New
    technologies can only exist through how they are expected to behave, and the visions
    that shape their potential. The stories around autonomous cars and cryptocurrencies
    and smart dog collars are not just pitted to customers, but are part of a bigger
    sell to politicians, journalists, moneymen. With a convincing story and appealing
