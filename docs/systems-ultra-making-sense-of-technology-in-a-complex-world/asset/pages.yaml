  md: 'Von Bertalanffy’s ‘general systems’ model was enormously influential, travelling
    back over again to engineering and mathematics, shaping the development of the
    fields that we now know as informatics, systems engineering, social systems theory
    – cybernetics. It is the latter that gives us the clearest line to the chaotic
    rat king of WTF systems understanding (or lack thereof) that I talked about earlier.


    If you’d been hanging around Cambridge, Massachusetts in the late 1940s, in the
    long hallways of the Massachusetts Institute of Technology, you would have seen
    the new discipline of cybernetics take form. Established by the MIT mathematician
    Norbert Wiener and building on his wartime research on anti-aircraft systems,
    cybernetics argued that biological forms and mechanical forms could be understood
    to operate in the same way: as systems controlled by internal feedback loops.
    This meant that, as von Bertalanffy intimated, biological forms such as humans
    could be both understood as systemic forms and enmeshed into larger systems with
    human-made machinic elements. A pilot in a fighter jet could thus be understood
    as one system – a machine – which, together, formed a new, complex assemblage
    greater than the sum of its parts.


    The subtitle of Wiener’s book Cybernetics was Control and Communication in the
    Animal and Machine, which gives us a pretty good idea of the power relations in
    these systems. In Newtonian systems, gravitational forces provided feedback. In
    a cybernetic system, feedback was created by information that was generated and
    flowed between the nodes of humans and machines, each considered equal and interchangeable
    within the cybernetic ethics.


    Cyberneticists pulled a similar trick to how enlightenment philosophy had stripped
    ‘system’ of its context to turn it into an authoritative tool. Biologists working
    with systems theory had been clear that living forms were functionally and materially
    distinct from mechanical and inorganic structures and had their own set of behaviours.
    In cybernetics, these differences were flattened out and redefined into technical
    terms of feedback, control, information, homeostasis: anything could be passed
    through the cybernetic hoop and find itself known.


    Although cybernetics defined itself as an interdisciplinary field from the start
    – less science than metascience – it was grounded in an authoritative, technocratic
    way of approaching the world. It was sold to'
