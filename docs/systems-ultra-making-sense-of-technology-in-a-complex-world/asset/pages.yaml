  md: 'Or rather, how they worked. The defeat device turned out to be a continually
    evolving family of devices that were all organised around a single monitoring
    event that calculated the state of the car’s coolant, fuel, and oil temperatures,
    together with its atmospheric pressure. If all were in a specific range and the
    engine was started, the flip was made and the device kicked in. And that was how
    they did it.


    Coming out of the project, it was difficult for Oliver and the scandal to feel
    cheerful about any part of what we had learned. Despite the scandal, Volkswagen
    had emerged relatively unscathed, with sales actually increasing in 2016; unlike
    its competitors producing electric vehicles, Volkswagen had never sold itself
    hard on any environmental credentials. In a particularly dispiring turn of events,
    it transpired that consumers were more upset about the effect of the defeat device
    on their car’s performance and the inconvenience of recall that they were about
    the emission of poisonous gases into the environment.39 Even the success of the
    researchers who tracked the defeat device was undercut by their own warnings that
    software control becomes a pervasive feature of complex systems, regulators will
    be faced with certifying software whereas manufacturers both have an immense financial
    incentive to cheat and the capacity to do.


    Black-boxed software may exist undetected for an extremely long time: instead
    of the ship crashing into the rocks or a car exploding on a motorway, imagine
    a machine simply going about its business, behaving efficiently and with silent
    solace for years and years. In a perverse way, the Volkswagen emissions scandal
    was blessed by having occurred through the medium of cars — consumer objects,
    owned by millions, and hacked, modified, and bounced since the very start of their
    existence. The next scaled software disaster may not be so easily accessible.


    But we can also think about what kind of world was revealed in the breakdown and
    again, what was not revealed; what we were intended to look at. Breakages are
    a suspension in time that expose power structures. Throughout the scandal, the
    pleasure of breakage was gifted to those in control of the system of automotive
    manufacturing. There’s a chorus of voices arguing that cars are anachronistic,
    no longer seen as an item of individual selfish consumption but, through sharing
    platforms, part of a large community — and, yet, they still exist.40'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'To end where we began: systems are difficult to comprehend. It is hard to parse
    a complex nested web of structure and behaviour which stretches and warps through
    time. It is far easier to draw the eye to a single node of operation such as a
    rogue engineer or even a reprobate CEO – but doing intentionally detracts attention
    from the system itself, permitting its survival. In the same way, it''s necessary
    to look at the story that''s being narrative comes from, what it is doing and
    who it serves. Cars are only presence in the world; tearing shit down or blowing
    shit up is incredibly individualistic joy machines if you don''t consider the
    wider impact of their presence exciting and an exhilarating way of freeing oneself
    from the aggregate weight of complex systems, but only if you''re not hurt by
    the consequences of doing so.


    And yet – sitting with the breakage is necessary. Harnessing all of this knowledge
    of how the system works, how it *feels*, where the stories about it have come
    from, how it breaks, are necessary, to mend and repair and maintain if we need
    to; but also to hack it and tear it down; to refuse it power, if we want to.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Afterword / Ultra


    In the final stages of editing this book – tracking down references, addressing
    editorial comments, making sure the narrative fitted together – I took myself
    off to see a film about railway infrastructure in the Soviet Union, as a little
    treat; a break from thinking about systems. Of course, it was not. In Tekla Aslanashvili''s
    documentary A State in a State, everything we''ve been looking at in the preceding
    pages is right up there on the screen. Scale, matter, time, norms, breakage: the
    film has it all, how railway bridges behave differently when they''re scaled up,
    how, through its scale, the railway created new projections of power, and shaped
    time; and, following the collapse of the Soviet Union, how it came to materialise
    the fragile borders that emerged. Shot at the human scale – no god''s eye ever
    overhead drones here – Aslanashvili emphasises the experience of the workers over
    any exceptionalist narrating about the technology itself.


    But there''s also a happier ending, of sorts, with the binfire of the railway
    workers across Ukraine, Georgia, and Azerbaijan built networks of solidarity with
    each other; and, even better, engaged in forms of industrial sabotage to push
    back against the violence of the Soviet system. The documentary shows, the reason
    why political consciousness is raised that railway infrastructure is a material
    system which affects people; not an abstract thing, but something that the workers
    labour on, together. The Soviet railways were a system of their own, with structure
    and behaviour; and, like the other systems we''ve seen here, capable of reproducing
    and enforcing power structures, bearing down hardest on those who are the most
    disenfranchised. But through mutual support, the workers were able to build'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'their own mode of resistance, challenging the authority and control of the
    system they worked and lived in.


    **Ultra**: to go beyond; to transcend. As Valerie Olson has highlighted, many
    feminist, postcolonial and critical race scholars and activists have argued against
    the imposition of systemic forms which continue to benefit particular groups in
    a global context.¹ And still, we live in these large-scale technological systems
    that – through capitalism, financialisation, global supply chains; through kyriarchy
    flex and bend to serve the most powerful. These are still the cause and effect
    of wicked problems and, as we have seen, there is no One Neat Trick to solve them.


    What I hope we have here, then, is a way to cut through – to go beyond, to transcend;
    the stories that are told around complex systems: of their inevitability, and
    of their impossibility to parse, or their capacity to be fully mapped and controlled.
    Instead, by coming through them the human scale, there are ways to tease apart
    the totalising and simplifying concept of ‘system’. By approaching them with all
    of the meanings and affordances and scraps which make up human culture, we can
    see the ways in which they poke out through the world with all of their strange
    textures and weirdness. By swapping metaphors for metonyms, we can unbundle the
    cultural associations that stick to these systems, see where they link and twist
    together, and understand how their power logics accrete and amplify each other.


    Systems happen all at once and everything happens so much. Scale, time, matter,
    and deviance are a few points to feel out but there are so many more; and, as
    our railway workers show us, there are many ways to feel out the soft underbelly
    in these structures, through which they might be challenged, sabotaged, and maybe
    even, eventually, dismantled. The Hacking/Hustle sex work collective reminds us:
    any system can be hacked; any system can be hustled.


    This then, I hope, is the real systems engagement: not a literacy which is too
    similar to the forms of mapping which a systems encourages, nor a rubric which
    draws on a mode of analysis that carries the same authoritative sheen that characterizes
    so much. Instead I hope for a sensibility in approaching systemic forms: embodied,
    visceral, critical; sometimes still, sometimes moving; sometimes furious, always
    curious; and which, together, can help us live in this complex world.'
