  md: '# 1

    Systems


    The ceilings of the Las Vegas Convention Centre are higher than a cathedral. This
    week, these halls play host to the largest technology event on the planet. It
    is the heart of winter in the Nevada desert and CES – formerly known as the Consumer
    Electronics Show – has landed the biggest building that the self-proclaimed entertainment
    capital of the world has to offer.


    Visitors may have arrived via a monorail (a monorail!), sweeping above the city’s
    battered freeways and sweeping around glassy hotels, experiencing a pre-emptive
    touch of the Future before being delivered to the doors of the Centre. Frosted
    sunlight streams through glass walls into a colossally bright atrium. If you’re
    here for the first time, maybe you feel a ripple, a trill of excitement as you
    traverse and down the array of escalators and gentle carpet slopes, and wonder:
    what delights and wonders of the new technological world await within?


    Buckle up, because what’s inside is underwhelming and confusing. This is not your
    beautiful future. The halls are demarcated into what distinct zones but have a
    similar feel that the overall effect is one of fungal colony of car deals or sprouting
    nests of airport duty-free booths, where little nodes of brightly coloured widgets
    have budged, perched on little plinth. Repeat visitors know to bring comfy shoes
    to cushion their feet as they hike through miles and miles of a terrain of hype
    in search of the next big thing. But through the forest of stands it is very hard
    to ascertain what, or where, that might be.


    Some of the limits are financially induced. It’s hard to fill an enormous space
    without a sack of cash, and every exhibitor here has paid through the nose to
    attend. Proper theatre is only truly available to the very'
