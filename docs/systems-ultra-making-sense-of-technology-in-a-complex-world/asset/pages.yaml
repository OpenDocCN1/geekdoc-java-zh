  md: 'local authorities boarded the plane and arrested two of the passengers, the
    Belarusian journalist Roman Protasevich, and his Russian girlfriend Sofia Sapega.


    The event was described by Ryanair’s CEO as ‘state-sponsored hijacking’ – it was
    not. Hijacking takes place on a plane in motion, commonly by people already on
    board; or in action films, from the outside. More importantly however, the event
    might have taken place without violating international law. The 1944 Chicago Convention
    on International Aviation is the one that assigns territorial sovereignty to the
    country being flown over, which includes the right to order a plane in its airspace
    to land, safely and without force. Nothing is about dishonest men. The scrambled
    fighter jet never fired, and when interviewed by The Atlantic, a Belarusian representative
    pointed out that air traffic control used the word ‘recommend’, not ‘command’
    – the choice was the pilot’s.


    What this incident did, the writer Graham Wood argued, was to rewrite our perceptions
    of flight.22 Until this point, flying over a foreign country has felt like teleporting
    past it, speeding through the sealed sphere of Class A airspace, but if the Belarus
    plots, the experience will come to resemble taking a train, with all of the terrestrial
    risk that entails.


    The illegibility of my enormous Eurocontrol map is not a failure of my powers
    of perception, but I don’t think that it’s a failure of 2D visualisations either.
    The system of latter-day airspace is horribly complicated, with plenty of gaps
    and nooks which facilitate the grim activities of nation-states such as Belarus
    legally grounding aircraft, and Great Britain’s increasing use of deployment flights.


    Grappling with complexity only exacerbates it. If you can observe a complex system,
    you are already enmeshed in it. The European Union attempted for years to reconcile
    the chaotic airspace system into a ‘Single European Sky’, ironing away the national
    borders which extend into the sky and reducing the length of flight paths and
    environmental costs. The intentions are good, but EU nation-states have fought
    back – not so much around the loss of jobs for air traffic controllers that the
    plan would entail, for fear of relinquishing their sovereignty over the air.


