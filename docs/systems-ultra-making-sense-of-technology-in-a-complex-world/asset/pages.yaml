    Matter is often missing from ideas of how systems work; or, at best, relegated
    to the background. It can be difficult to get a sense of bulk or weight from the
    pictograms and diagrams that describe what systems do, or to sense what a material
    substance feels like as it grinds into the behaviour of a system. In a fabrication
    workshop, matter is front and centre, through the materials that will be reformed
    and the physical machines that will do work.


    This foregrounding of matter spills into the rest of the building. The workshop
