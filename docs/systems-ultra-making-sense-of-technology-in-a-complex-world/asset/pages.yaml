  md: 'To recap, then: by the nineteenth century, the idea of ''system'' had emerged
    as a powerful scientific and philosophical metaphor. It had moved from astronomy
    and physics into philosophy and the wider natural sciences, carrying with it the
    authoritative stain of scientific inquiry, but with no self-awareness of the underlying
    logics that allowed it to extract this authority from its original context. The
    totalising nature of ‘system’ did attract criticism from some quarters, with scholars
    unpacking some of the mechanical orderliness to consider how structures as slavery
    and economies sat against the concept.¹⁷ But none of this did anything to dismantle
    the dominant mode of ‘system’ and if anything, only scaffolded its prominence
    by offering further ways to think about it.


    This leads on the second stage of system history. By the early twentieth century,
    a system was understood to be closed, controllable; politically inherently inert.¹⁸
    Its mechanistic nature had served it well in the physical sciences. Now, in the
    1930s, it found a new playground in the comparatively new field of the biological
    sciences, where scientists began to explore how the idea of systems could help
    them understand the relationships between the parts of living things.


    In Austria, the biologist Ludwig von Bertalanffy applied mathematical modelling
    to biological entities to create models which described how an organism grew over
