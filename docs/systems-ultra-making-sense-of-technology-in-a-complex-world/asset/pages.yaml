  md: 'To make a live flight map that moves in real time, my collaborator and I have
    to track the vessels moving through the sky in real time. Airspace is not a road:
    not only do we need to know the speed at which each airship is travelling together
    with its latitude and longitude location, and how this changes moment by moment
    to movement, we also need to know altitude. We also need to know which vessel
    is which, to stop our map from being a murder of anonymous points in the air and
    indicate instead that plane has an identity, a purpose, and a trajectory.


    The easier way to do this would be to access the insides of a flight tracking
    service such as FlightRadar24, which already has all these data streams, jam them
    into visualisation software, and then let the code do the heavy lifting. But this
    would be a mediated form of seeing. We would have no direct access to the original
    information collected by the flight tracker, and our installation would be completely
    dependent on the service running smoothly. But we want to know how much access,
    we civilians, have to this data which defines the structure of the sky above us.


    So, this is how we do it.


    Every plane is essentially airborne radio station, its fuselage and kit studded
    throughout electronic instruments and operational sensors that detect where the
    vessel is, how it''s behaving, and what it experiences in any given moment. The
    Air Data System, for example, does exactly what it says on the tin, capturing
    data on the pressure and density of the air that the plane is moving through,
    and the different types of speed – vertical, calibrated, true, and Mach – the
    plane exerts. Sensors detect how the plane rotates and rolls relative to its centre
    of gravity; others, made by accelerometers and gyroscopes, pick up how the aircraft
    is moving relative to the earth below it. Much as a patient in an operating theatre
    is constantly monitored by an anaesthetist who checks that the patient is stable
    – that is, unconscious but breathing, and maintaining all vital signs – so a plane’s
    sensors tell their gigantic steel vessel is speeding through the air and doing
    fine.


    Some of this information is for the benefit of the pilots only; but some is also
    for air traffic control. Together with the plane''s own personal call sign, data
    about the plane''s position and movement is periodically and freely broadcast
    out from the plane on the 1090 megahertz frequency. The system is known as Automatic
    Dependent Surveillance Broadcast – ADS-B to its'
