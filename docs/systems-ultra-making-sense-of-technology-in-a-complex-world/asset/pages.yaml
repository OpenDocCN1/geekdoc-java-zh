  md: 'If this is the ‘why’ of the emissions scandal, is there anything left for the
    ‘how’ to tell us? Can we even ascertain what the ‘how’ is? At first glance, this
    question seems to slam us against the sealed industrial closures of automotive
    manufacturing and its closed vaults of proprietary information. Though the parameters
    of emissions testing are public, allowing them to be performed by third parties
    and gained by crooks, the black-boxed nature of the software involved made it
    nearly impossible to examine. To date, regulators have had to rely on huge fines
    to discourage cheating, bringing to mind the aphorism that if the penalty for
    transgressions are financial, laws will apply only to the poor.


    But there is a way in, courtesy of a group of German and American engineering
    scholars, who tell us the defeat device worked and, more crucially, how they uncovered
    this information, in their perfectly titled paper: ‘How They Credited It’.38


    Despite being credential academics from Ruhr-Universität Bochum and University
    of California: San Diego, the researchers were not given any privileged access
    to proprietary firmware. Instead, they took a sideways approach to their forensic
    investigation, and asked: beyond manufacturers, who might want to modify car software?
    The answer, of course, is car modders: colloquially known as ‘car tuners’, these
    are the folks who would tweak their vehicles to make them something other than
    their manufacturers intended.


    Cars tend to adapt vehicle engines to improve performance, allowing folks to drive
    faster and smarter. Repurposing a cyber-physical entity that looks like a car
    is more challenging but not impossible if you have the right elements. What you’ll
    need images of the firmware, official versions of which can be found in car repair
