    Language implies reality: the ideas we attach to things become things in the world.
    We use metaphors to describe things that elude our grasp, and fictions and metaphors
    allow an imaginary concept to be legitimated. These metaphors and stories are
    produced in a crucible of time, pace, and culture. These narratives are hugely
    influential in the design, regulation, and reception of large-scale technologies
    and infrastructures. They shape how we expect the world to work. It is therefore
    possible to trace a line between the Californian Ideology of progressive utopianism
    and techno-libertarianism, and the story of the autonomous car as something built
    for the public good, while also making transit obsolete.¹²


