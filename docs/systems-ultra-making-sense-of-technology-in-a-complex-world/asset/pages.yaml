  md: 'writes, exhibits qualities such as heaviness, largeness, and mutual exclusivity
    – that is, the inability to exist in the same place as another piece of matter.¹
    Unlike living biological material, matter does not have a native ability to regenerate.
    In this workshop, matter meets matter – metal is used to carve wood, and matter
    itself is sliced upon the waterjet where a directed stream of water is blasted
