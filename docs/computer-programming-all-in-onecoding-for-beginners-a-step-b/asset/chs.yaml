  \n# 第 3 册：初学者 SQL\n\n掌握编程艺术与数据库管理的全面指南\n\nvera Poe\n\n## 引言\n\n`sql` 是一种代表“结构化查询语言”的编程语言，考虑到它允许同一系统中的不同数据库进行交互，因此是一种很容易学习的语言。这种数据库系统最早出现于\
  \ 70 年代，但当 IBM 推出这种编程语言的原型后，它的流行程度开始增长，商业世界也开始关注。\n\nIBM 最初使用的 `sql` 版本（当时被称为 Oracle）非常成功，以至于其背后的团队最终离开了\
  \ IBM 并成立了自己的公司。`Oracle` 得益于它与 `sql` 的工作方式，仍然是编程语言的领导者之一，并且不断变化，以跟上编程和数据库管理领域的所有需求。\n\
  \n`sql` 是一组你可以用来与关系型数据库进行交互的指令。虽然有很多语言可以实现此操作，但 `sql` 是大多数数据库都能理解的唯一语言。每当你准备好与这些数据库之一交互时，软件就会进入并翻译你提供的命令，无论你是通过表单输入还是鼠标点击提供的。这些内容将转换为数据库已经能够解释的\
  \ `sql` 语句。\n\n如果你曾经工作过数据库驱动的软件程序，那么你过去很可能用过某种形式的 `sql`。尽管如此，你可能甚至不知道自己在这样做。例如，许多动态网页都是由数据库驱动的。这些页面会从你进行的表单和点击中获取用户输入，然后使用这些信息来组合\
  \ `sql` 查询。该查询将通过数据库中检索数据，以执行诸如切换到新页面的操作。\n\n为了说明这是如何运作的，想象一个允许搜索的简单在线目录。搜索页面通常会包含一个只有一个文本框的表单。你可以使用表单输入想要搜索的物品名称，然后只需点击搜索按钮。你一点击搜索按钮，搜索就会遍历数据库以查找与搜索相关的内容。它会将那些内容带回来。\n\
  \n对于那些没有时间学习编程语言且不愿学习的人来说，`sql` 中的命令设计语法都符合英语，起初这看起来很复杂，你可能担心设置需要花费多少工作。但当你开始操作几个命令时，你会发现它并没有那么难。看看代码：\n\
  \n## 第 1 章：什么是 sql\n\n什么是 `mysql`？\n\n`mysql` 是一个使用 `sql` 语法管理数据库的工具（数据库服务器）。它是一个\
  \ `rdbms`（关系型数据库管理系统），你可以用它来方便对数据库进行操作。\n\n如果你正在使用 `mysql` 管理网站，请确保你的网站主机也支持 `mysql`。\n\
  \n以下是在微软 Windows 中安装 `mysql` 的方法。我们将使用 Windows，因为它是计算机中最常用的应用程序。\n\n\n\n结构化查询语言（SQL，简称\
  \ SQL）是一种计算机编程语言，通常用于存储、检索和操作存储在关系型数据库中的数据。它是 `oracle`、`mysql` 和 `ms access` 等许多关系型数据库管理系统（RDBMS）的标准计算机编程语言。尽管如此，这些系统使用的版本可能有所不同。例如，`oracle`\
  \ 使用 `pl/sql`，而 `ms sql server` 则使用 `t-sql`。\n\nIBM 的 Ted C（广誉为关系型数据库之父）在 1970 年提出了数据库关系型模型概念，一切由此此开始。四年后的\
  \ 1974 年，`sql` 出现了。这最初只是一个想法，在 1978 年以 system/r 的形式概念化，并由 `ibm` 发布。`ansi` 标准和关系型数据库原型于\
  \ 1986 年首次发布，被称为 `oracle`。这次发布也归功于 `ibm`。\n\n## 为什么选择 SQL？\n\n`Sql` 有许多优势，使其成为数据库领域的标准且流行的编程语言。这些优势包括：\n\
  \n- `Sql` 编程语言可用于访问 `rdbmss` 中的数据。\n- 它也可以用于描述数据。\n- 数据的定义及其操作也是 `sql` 支持的。\n- 通过将\
  \ `sql` 模块嵌入其他语言的代码、预编译器和库中，`Sql` 可以与其他编程语言一起使用。\n- 可以使用这种编程语言创建和删除数据库。\n- 它可以用于设置视图、表和存储过程的权限。\n\
  - 最后，它可以用于创建视图、过程和函数。\n\n### 流程\n\n每当你向系统发出命令时，`sql` 进程就会启动。系统确定执行任务的最佳方式，并由 `sql`\
  \ 引擎进行解释。过程中涉及的不同组件如下：\n\n### 优化引擎\n- `Sql query engine`\n- `Classic query engine`\n\
  - `Query dispatcher`\n\n`sql query engine` 对处理 `sql` 查询进行了基准测试，不管理逻辑文件。`classic\
  \ query engine` 处理这些文件和非 sql 查询。`sql` 架构如图所示。\n\n### 命令\n\n下面列出了你在与关系型数据库交互期间将要使用和遇到的一些基础\
  \ `sql` 命令。它们将在书中后后的部分进行详细解释。通常，`sql` 中的命令被分为三类，即 `ddl`（数据定义语言）、`dml`（数据操作语言）和 `dcl`（数据控制语言）。`ddl`\
  \ 类下的命令如下：\n\n### `Create`\n此命令用于创建对象、表或视图。\n\n### `Alter`\n此命令通常用于修改现有的数据库对象。在大多数情况下，该对象是一个表。\n\
  \n### `Drop`\n使用 `create` 创建的对象、表和视图可以使用 `drop` 命令删除或移除。\n\n下一组命令是属于 `dml`（即数据操作语言）的命令。这些命令如下：\n\
  \n### `Select`\n此命令用于从一个或多个表中检索一组记录。\n\n### `Delete`\n此命令用于删除记录。\n\n### `Update`\
  \ \n此命令用于修改或更新记录。\n\n### `Insert`\n此命令用于插入记录。\n\n最后一类命令属于 `dcl`（即数据控制语言）。这些命令如下：\n\
  \n### `Grant`\n可以使用 `grant` 命令授予用户权限。\n\n### `Revoke`\n可以使用 `revoke` 命令收回赋予给用户的权限。\n\
  \n`Sql` 是我们在满足某些需求时可以工作的一个令人兴奋的选项。`Structured query language` 是一种在数据管理和存储设计中标准化的编程语言。正因如此，懂一点的人也可以轻松地操作和创建任何类型的数据。\n\
  \n## SQL 查询类型\n\n在编程世界中，问题被正式称为“查询”（query）。数据库中的查询可以是两种类型：操作（action）或选择（selection）。通过操作查询，会请求关于信息的如删除、刷新等额外任务，而选择查询（select\
  \ query）则有助于移除信息。\n\n在数据库方面，查询是一种非常有用的工具，因为它们通过结构被客户端定期调用。客户端在表中查找信息后使用它们来获取信息，根据需要进行许多不同的计算并参与各种活动。\n\
  \n对于参与其中的人员来说，幸运的是 `ms access` 允许实现多种类型的查询，但主要类型包括操作查询和选择查询。你可以轻松地将它们视为数据库的另一个部分——类似于宏或表。\n\
  \n当需要在数据库中创建查询时，你可以利用两种两种不同的方法：\n- 你可以自己编写 `sql` 查询，或\n- 你可以使用 `ms access’s query\
  \ wizard` \n\n### 查询语言\n\n查询语言用于数据库以创建查询，所有其他语言遵循的标准是 `structured query language`。在\
  \ `sql` 的伞下，只有少数语言变体，包括 `odb`、`oracle` 和 `mysql`。不同的数据库也有特定的查询，如 `xquery`、数据挖掘扩展、`neo4j’s\
  \ cipher` 以及 `cassandra query language` (`cql`)，这些被 `nosql` 数据库和图数据库整合。\n\n### `Select\
  \ query`\n这种查询类型在进行询问时仅提供极小的难度，因此它是所有 `ms access` 数据库中最常用的类型。这种利用可以从我们的表系列中选出所需信息。\n\
  \n最后，客户端是选择准则并告知数据库的人，以便这些准则找到结果。在调用 `select query` 后，会创建一个表，允许你逐条记录更改信息。\n\n###\
  \ `Action query`\n\n一旦你调用操作查询，数据库中就会根据查询指示的内容发生相应的活动。这允许整合多项内容，包括创建新记录、刷新它们、删除行或创建一个新表。\n\
  \n\n\n\n当与 microsoft access 配合使用时，“参数查询”可以使用多种查询来实现你所需的结果。正因如此，当使用此类查询时，你可以将参数发送到另一个查询，例如\
  \ `select` 或活动查询。这些参数可以是条件或估值，以便查询明确知道需要完成哪些内容。\n\n由于无论是否有交换框它们都会被选中，终端用户可以在每次运行查询时在参数中输入任何值。参数查询本质上只是被修改过的\
  \ `select` 查询。\n\n### 聚合查询\n\n聚合查询是一种独特的查询类型。它可以像参数查询一样对其他查询（如 `parameter`、`activity`\
  \ 或 `choice`）进行更改，但它不同于传递给不同查询的参数，因为该参数将与从其他组中选出的其他项进行聚合。\n\n求和最终是在你选择的表属性内进行的。它可以转换为可衡量的和，例如标准差或中点。\n\
  \n# 准备编写代码\n\n就像任何其他编程语言一样，在深入学习之前，你需要理解你尝试学习的语言的本质。对 SQL 的优势做一个的笔记，并记录你可能会遇到的常见错误。\n\
  \n列出需要安装的应用程序列表，并检查所有这些软件的系统要求。\n\n# 安装 mysql 应用程序\n\nMySQL 是微软为无数组织和小型企业提供的工具之一。目前有几种昂贵的认证课程，可以让你更好地理解这些数据库的管理。在书中，我们在解释了可用的\
  \ SQL Server 版本后，连贯地向你解释安装步骤。\n\n## SQL Server 软件类型\n\n微软提供了广泛的软件选择以便更好地部署服务。如果没有足够的数据，购买巨大的资源是没用的。对于海量数据，依赖较少的资源也没有意义，因为会导致持续的停机，这可能会骚扰你的服务用户。正因如此，MySQL\
  \ 有如下所示的不同类型。\n\n### Express（精简版）\n\n这是一个小型综合版本，包含个人或小型企业运行所需的简单资源和工作台工具。\n\n###\
  \ Standard（标准版）\n\n标准版通常建议处理中等数据的小企业使用。与 Express 版相比，它可以快速监控操作并处理数据。\n\n### Enterprise（企业版）\n\
  \n企业版是全球最常用的 SQL 服务器之一。它具有广泛的功能，可供中大型使用。它包含许多服务，如报告、分析和审计。由于其复杂性，企业版的费用比标准版贵得多。\n\
  \n### Developer（开发版）\n\n此版本的 SQL Server 主要供开发人员在环境中测试和操作功能。所有开发者都使用此版本来对他们处理的逻辑实体进行实验。你可以通过点击轻松将开发版的许可证转换为企业版。\n\
  \n### Web（Web 版）\n\n此版本的 SQL Server 主要为处理 Web 应用程序而开发。许多中间托管服务使用此版本存储少量数据。\n\n#\
  \ SQL 软件包含哪些组件？\n\nSQL Server 软件由需要安装的各种组件组成。以下是一些常用的 SQL 服务器管理器。\n\n## 服务器管理系统\n\
  \n这是最关键的组件，服务器管理系统运行时，数据库处于关闭状态。这是管理员与数据库交互的界面。\n\n### 服务器配置\n\n此组件帮助我们提供有关服务器配置的信息。\n\
  \n### 服务器配置文件\n\n这是监控所有正在运行查询的组件。\n\n# 安装之前需要考虑什么？\n\n对软件进行彻底搜索，你可以在文档中找到参数查询。了解组件，充分理解数据库需求。由于无法使用其他三种方法关闭数据库，这种方法是对数据库实例的管理。\n\
  \n# 启动和停止数据库实例\n\n启动 Oracle 数据库实例的过程分为三个步骤：启动实例、加载数据库和打开数据库。\n\n以下将解释几种启动方法：\n\n\
  ### 1. nomount 模式\n\n代码和结果如下：\n\n```\nstartup nomount\n```\n\n### 2. mount 模式\n\n\
  此模式启动实例并保持数据库关闭状态。代码和结果如下：\n\n```\nstartup mount\n```\n\n### 3. open 模式\n\n此模式启动实例并打开数据库，这是正常启动方式。要在数据库上执行操作的用户必须使用\
  \ open 模式启动数据库。\n\n就像启动数据库一样，关闭数据库实例也分为三个步骤，即关闭数据库、卸载数据库和停止 Oracle 实例。\n\n关闭的 SQL\
  \ 语句如下：\n\n### Shutdown [输入参数]\n\n### 1. normal approach（正常方式）\n\n这种方法被称为正常关闭。如果对关闭数据库的时间没有限制，通常用于关闭数据库。\n\
  \n代码和结果如下：\n\n```\nshutdown normal\n```\n\n### 2. transactional approach（事务方式）\n\
  \n这种方法被称为事务关闭。其首要任务是确保所有当前活动事务都能提交，并在最短时间内关闭数据库。\n\n### 3. abort mode（终止模式）\n\n\
  这种方法被称为终止关闭方法，是强制且具有破坏性的。使用这种方法将强制中断任何数据库操作，这可能会丢失某些信息并影响数据库的完整性。由于无法使用其他三种方法关闭数据库，应尽量避免使用这种方法。\n\
  \n\n\nMySQL Workbench 是一款可视化的数据库设计软件，由 MySQL 发布，其前身是 OracleForce 的 MySQL Designer。MySQL\
  \ Workbench 是一一个为开发者、数据库管理员（DBA）和数据库架构师设计的统一可视化工具。它提供了高级数据建模、灵活的 SQL 编辑器以及全面的管理工具。它可以运行在\
  \ Windows、Linux 和 Mac 上。\n\n要在 Windows 上使用它，请点击 SQL Server Studio 并选择 `workbench`\
  \ 选项打开界面。如果你使用的是 Linux 和 Mac，需要在进入 SQL 实例后输入命令 `workbench`。\n\n# 如何在微软 Windows 上安装\
  \ mysql\n\n### 访问 MySQL 网站\n\n访问 `www.mysql.com` 并浏览应用程序以选择 MySQL。确保你从官方网站获取 MySQL，以防止下载病毒，病毒可能会对你的电脑产生危害。\n\
  \n### 选择“download”（下载）选项\n\n接下来，点击下载选项。这将带你 MySQL 社区服务器（MySQL Community Server）和\
  \ MySQL 社区版（MySQL Community Edition）。点击“download”。\n\n![Image00039.jpg](img/Image00039.jpeg)\n\
  \n### 选择你的 windows 处理器版本\n\n通过仔细页面上的详细信息选择你的 windows 处理器版本。从“other downloads”（其他下载）标签中选择。你可以选择\
  \ 32 位或 64 位。\n\n点击 windows (x86, 32-bit) zip 存档或 windows (x86, 64-bit) zip 存档的下载按钮，取决于适用于你的电脑。\n\
  \n![Image00040.jpg](img/Image00040.jpeg)\n\n### 在网站注册\n\n在下载你选择的版本之前，你会被要求通过填写 Oracle\
  \ 账户登录表单进行注册。你不需要回答选择性问题。你也可以点击“no thanks”（不用，谢谢）按钮。另一个选项是在不注册直接下载服务器。尽管如此，你将无法享受某些免费福利，例如下载白皮书和技术信息、更快地访问\
  \ MySQL 下载和其他服务。\n\n### 登录你的 mysql 账户\n\n注册后，你现在可以登录新账户。将出现一个新页面，你可以通过显示的旗帜图像选择你的区域。之后，你可以点击下载按钮将其保存到电脑上。这可能需要几分钟时间。\n\
  \n### 为下载的文件命名\n\n下载文件后，你可以为你的 MySQL 文件命名并将其保存到桌面或 `C` 盘。这取决于你的决定，随你的喜好即可。\n\n###\
  \ 安装你的 mysql 服务器\n\n点击文件打开它，然后点击“install”（安装）在你的电脑上安装 MySQL。这将打开一个小窗口，电脑会询问你是否想要打开并安装该程序。只需点击“ok”按钮。\n\
  \n### 浏览你的 mysql 包\n\n将出现 MySQL Enterprise Server 页面，提供有关你的 MySQL 包包含内容的信息。有些包需要付费，但由于我们只对社区服务器感兴趣，只需点击“next”（下一步）直到到达“finish”（完成）按钮。\n\
  \n取消勾选“register the mysql server now”（现在注册 mysql 服务器）框。向导完成设置后，会出现一个框要求你配置并注册你的\
  \ MySQL 服务器。取消“register the mysql server now”框，并勾选“configure the mysql server now”（现在配置\
  \ mysql 服务器）的小框。然后点击“finish”。\n\n### 在配置向导中点击“next”\n\n将出现一个窗口，你只需点击 next。\n\n###\
  \ 选择配置类型\n\n将出现一个窗口要求你选择配置类型。勾选“detailed configuration”（详细配置）的小圆圈，而不是“standard”（标准）。点击“next”按钮。\n\
  \n### 选择服务器类型\n\n会有三个选择：developer machine（开发者机器）、server machine（服务器）和专用 MySQL 服务器机。选择\
  \ server machine，因为它具有中等负载，非常适合像你这样想要学习更多 MySQL 的初学者。developer machine 使用内存极少，可能无法让你充分利用内存。另一方面，MySQL\
  \ server machine 是为数据库程序员或全职用户准备的。它将使用电脑中所有的可用内存，因此不适合你。\n\n### 选择数据库用途\n\n对于数据库用途，有三个选择：multifunctional\
  \ database（多功能数据库）、事务型数据库（transactional database）和非事务型数据库（non-transactional database）。选择多功能数据库，因为你的目的是通用用途。事务型和非事务型用于更特定的目的。点击框底部的“next”按钮。\n\
  \n### 选择 innodb 驱动器\n\n如果你不想使用默认设置，可以从电脑中选择存储 `innodb` 数据的驱动器。选择你喜欢的驱动器并点击“next”。\n\
  \n### 设置服务器并发连接数\n\n这将指示同时连接到服务器的用户数量。选项包括支持 OLAP、在线事务处理（OLTP）以及手动设置。建议你选择 OLAP\
  \ 选项，因为你不需要高并发连接。OLTP 适用于高负载服务器，而手动设置则可以现在设置。\n\n### 设置网络选项\n\n通过勾选前面的小框来启用 TCP/IP\
  \ 网络。在下方添加你的端口号，并勾选小框以启用设置服务器 SQL 模式。点击“next”。\n\n### 选择默认字符集\n\n最推荐的是标准字符集，因为它适用于英语和其他语言。它也是英语的默认设置。另外两个选项，即多语言支持和手动默认字符集，最适合非英语语言的用户。勾选标准字符集的小圆圈并点击“next”。\n\
  \n### 设置 windows 选项\n\n勾选显示的两个选项：install as windows server（作为 windows 服务安装）和将 `bin`\
  \ 目录添加到 windows 路径。这将允许你从命令行操作 MySQL。选择作为 windows 服务将自动显示服务名称。服务名称下方的小框也必须勾选。点击“next”。\n\
  \n### 设置安全选项\n\n设置你的密码。框将指示你输入密码的地方。点击“next”。\n\n### 执行你的配置\n\n你只需点击“execute”（执行），你的电脑将根据你的规范自动进行配置。一旦配置完成且所有框都已勾选，点击“finish”。\n\
  \n### 设置验证过程\n\n进入开始菜单，输入 `cmd` 并按回车。这将带你进入命令行面板。输入以下：\n\n```\nmysql -u root -p\n\
  ```\n\n按回车。注意 `mysql` 和 `-u` 之间有空格，`-u` 和 `root` 之间有空格，`root` 和 `-p` 之间也有空格。命令行面板将提示密码。输入你的密码并按回车。将出现\
  \ MySQL 提示符。你可以输入任何 SQL 命令来显示数据库。记得在 SQL 语句结束添加分号。\n\n\n\n好了，你的控制面板已打开。\n\n恭喜你！！你成功地在机器上安装并配置了\
  \ mysql。现在是时候行动了。\n\n使用你的 mysql 可以激励你学习更多其他相关的应用程序，如 php 和类似产品。\n\n重要的是，你首先需要学习\
  \ sql 的基础知识。\n\n你可以开始学习的一些命令：\n\n![Image00041.jpg](img/Image00041.jpeg)\n\n现在是时候让我们深入学习使用这种编程语言可以做的有趣事情了。我们将查看在处理\
  \ sql 语言时可以执行的一些命令，以及我们如何搜索数据库并尽可能查看里面包含哪些信息。在本章中，我们将查看如何使用 sql，以及一些可以使用来满足我们需求的基础命令。\n\
  \n这些命令非常有帮助，因为它们会让你更容易操作数据库中我们需要的不同部分。我们会其中一些命令是很容易操作的，然后我们可以转向一些更困难、更复杂的命令，这样我们就能看到处理这种语言时展现出的威力。\n\
  \n当你需要学习 sql 中提供的一些更基础的命令时，你会发现处理它们的最好方法是将它们划分为六个独立的类别。所有这些类别都基于你可以在所选系统内部它们的用途。以下是\
  \ sql 语言中可以使用的六种命令类别，将帮助你完成代码任务。\n\n### 数据定义命令\n\n我们将查看的第一类命令被称为 `ddl`，即数据定义语言（data\
  \ definition language）。这是 sql 语言内部的一个方面，它可以让我们在按照意愿的方式进行安排之前，更容易在数据库中生成对象。例如，你将可以使用\
  \ sql 系统的这部分来帮助我们在创建的表中删除或添加对象。这里与 `ddl` 类别一起的一些不同命令包括：\n\n- `drop view`（删除视图）\n\
  - `drop index`（删除索引）\n- `Alter the index`（修改索引）\n- `Create the index`（创建索引）\n- `Alter\
  \ the table in some manner`（以某种方式修改表）\n- `Create the table`（创建表）\n- `Drop the table`（删除表）\n\
  \n### 数据操作语言\n\n我们在这里查看的第二个部分被称为 `dml`，即数据操作语言（data manipulation language）。这是在我们想要修改正在使用的数据库中找到对象的某些信息时可以使用的\
  \ sql 方面。这将使得删除对象、更新这些对象或在数据库中插入新内容变得更容易。当我们确保对数据库中信息的正确更改被添加，而无需为该数据库创建表的新部分时，这将为我们提供很大的自由。\n\
  \n### 数据查询语言\n\n现在我们需要转向数据查询语言，或者你最可能听它被称为 `dql`。这种语言将是你通过 sql 看到的最强大的方面之一，特别是当你为业务使用一个更现代的系统时。\n\
  \n这一个会很棒，因为你只需要处理一个简单的命令就可以从数据库中选择你想要的内容，命令就是 `select` 命令。你可以使用 `select` 命令在任何关系型数据库需要时运行某些查询。如果你希望输出的结果更详细，则可以通过并添加一些选项或子句来让这一切顺利运行。\n\
  \n### 数据控制语言\n\n列表中的下一个是 `dcl`，即数据控制语言（data control language）。当你想要控制谁可以使用该数据库或谁可以访问该数据库时，你可以随时选择使用这个命令。`dcl`\
  \ 命令在某些情况下用于生成与访问权限相关的数据库对象。如果你想控制访问访问员，这是一好事，这包括：\n\n- `Revoke`（撤销权限）\n- `Grant`（授权）\n\
  \n### 数据命令\n\n当你需要学习 sql 中提供的一些更基础的命令时，你会发现处理它们的最好方法是将它们划分为六个独立的类别。所有这些类别都基于你可以在所选系统内部它们的用途。以下是\
  \ sql 语言中可以使用的六种命令类别，将帮助你完成代码任务。\n\n- `Drop view`（删除视图）\n- `Drop index`（删除索引）\n\
  - `Alter the index`（修改索引）\n- `Create the index`（创建索引）\n- `Alter table in some manner`（以某种方式修改表）\n\
  - `Create table`（创建表）\n- `Drop table`（删除表）\n\n\n\n\n例如，假设我们要为工资低于 3000 的员工发放 2 个月的奖金，而为工资高于此标准的员工发放\
  \ 1 个月的奖金？\n\n为了实现这一点，我们需要使用控制流工具。这些工具包括 `if`、`case` 和循环语句。\n\n在本节中，我们将使用许多示例来解释所讨论的概念。\n\
  \n准备好了吗？\n\n# If statement\n\n让我们从 `if` 语句开始。`if` 语句的语法如下：\n\n```sql\nIf condition\
  \ 1 is met then do task a;\nElse if condition 2 is met then do task b;\nElse if\
  \ condition 3 is met then do task c;\nElse do task z;\nEnd if;\n```\n\n`if` 语句首先检查第一个条件是否满足。如果满足，它将执行任务\
  \ a。如果不满足，它将移动到第一个 `else if` 语句。如果该条件满足，将执行任务 b。如果不满足，它将继续向下检查 `else if` 语句，直到找到满足的条件。如果没有条件被满足，它将执行任务\
  \ z。\n\n可以根据需要包含任意数量的 `else if` 语句。\n\n此外，`else if` 和 `else` 语句都是可选的。如果没有其他条件需要检查，你不需要包含它们。\n\
  \n然而，如果你省略了 `else` 语句，并且存在未被任何 `if` 和 `else if` 语句满足的情况，`mysql` 将向你返回错误。\n\n现在让我们来看\
  \ `if` 语句的一些示例。\n\n## Example 1\n\n```sql\nDelimiter $$\nCreate function if_demo_a(x\
  \ int) returns varchar(255) deterministic\nBegin\nIf x > 0 then return ‘x is positive,’;\n\
  Else if x = 0 then return ‘x is zero’;\nElse return ‘x is negative,’;\nEnd if;\n\
  End $$\nDelimiter;\n```\n\n这个 `if` 语句首先检查输入 `(x)` 是否大于零。如果大于，它返回‘x is positive’。\n\
  \n如果不大于，它检查 `x` 是否等于零。如果等于，它返回‘x is zero’。\n\n如果前两个条件都不满足，它将移动到 `else` 语句并返回‘ x\
  \ is negative,’。\n\n要运行此函数，我们写道：\n\n```sql\nSelect if_demo_a(2);\n```\n\n我们将得到‘x\
  \ is positive’。\n\n如果我们将输入从 2 改为 0 或 -1，我们将分别得到‘x is zero’和‘x is negative,’。\n\n\
  ## Example 2\n\n```sql\nDelimiter $$\nCreate function if_demo_b(x int) returns varchar(255)\
  \ deterministic\nBegin\nIf x > 0 then return ‘x is positive,’;\nElse if x = 0 then\
  \ return ‘x is zero’;\nEnd if;\nEnd $$\nDelimiter;\n```\n\n这个示例与上一个相似，但我们省略了 `else`\
  \ 语句。如果我们现在运行该函数，将得到以下输出：\n\n```sql\nSelect if_demo_b(2);\n```\nOutput:\nX is positive,\n\
  \n```sql\nSelect if_demo_b(-1);\n```\nOutput:\nError code,: 1321. function if_demo_b\
  \ ended without return\n\n```\n\n你可以看到，如果我们向函数传递一个它无法处理的值（在本例中为负数），函数将返回错误。\n\n\
  # Case statement\n\n接下来，让我们转向 `case` 语句。`case` 语句与 `if` 语句非常相似，通常可以互换使用。在大多数情况下，选择\
  \ `if` 还是 `case` 取决个人偏好。\n\n语法为：\n\n```sql\nCase case_variable\nWhen value_1 then\
  \ task a;\nWhen value_2 then task b;\n…\nElse do task z;\nEnd case;\n```\n\n或者\n\
  \n```sql\nCase\nWhen condition 1 is met then task a;\nWhen condition 2 is met then\
  \ task b;\n…\nElse do task z;\nEnd case;\n```\n\n让我们来看一些示例。\n\n### Example 1\n\n\
  ```sql\nDelimiter $$\nCreate function case_demo_a(x int) returns varchar(255) deterministic\n\
  Begin\nCase x\nWhen 1 then return ‘x is 1’;\nWhen 2 then return ‘x is 2’;\nElse\
  \ return ‘x neither 1 nor 2’;\nEnd case;\nEnd $$\nDelimiter;\n```\n\n调用函数：\n\n```sql\n\
  Select case_demo_a(1);\n```\nOutput:\nX is 1\n\n```sql\nSelect case_demo_a(5);\n\
  ```\nOutput:\nX neither 1 nor 2\n\n### Example 2\n\n```sql\nDelimiter $$\nCreate\
  \ function case_demo_b(x int) returns varchar(255) deterministic\nBegin\nCase\n\
  When x > 0 then return ‘x is positive,’;\nWhen x = 0 then return ‘x is zero’;\n\
  Else return ‘x is negative,’;\nEnd case;\nEnd $$\nDelimiter;\n```\n\n这第二个示例使用了第二种语法，并测试\
  \ `x` 的范围而不是单个值。\n\n调用函数：\n\n```sql\nSelect case_demo_b(1);\n```\nOutput:\nX is\
  \ positive,\n\n```sql\nSelect case_demo_b(-1);\n```\nOutput:\nX is negative,\n\n\
  # While statement\n\n下一个控制语句是 `while` 语句。该语句允许在条件有效时重复执行任务。\n\n语法为：\n\n```sql\n\
  [name of while statement] while condition is true do\nSome tasks\nEnd while;\n```\n\
  \n### Example\n\n```sql\nDelimiter $$\nCreate function while_demo(x int, y int)\
  \ returns varchar(255) deterministic\nBegin\nDeclare z varchar(255);\nSet z = ‘‘\n\
  while_example: while x<y do\nSet x = x + 1;\nSet z = concat(z, x);\nEnd while;\n\
  Return z;\nEnd $$\nDelimiter;\n```\n\n在这里，我们首先声明了一个变量 `z` 并将其初始化为空字符串（空字符串是一个字符串）。\n\
  \n接下来，我们声明了一个 `while` 语句，并标记为 `while_example`。\n\n接下来，`while` 条件检查 `x` 是否小于 `y`（`x`\
  \ 和 `y` 都是函数的输入参数）。当 `x` 小于 `y` 时，`while` 语句执行以下操作：\n\n首先，它将 `x` 加 1。\n\n接着，它使用\
  \ `concat()` 函数将结果连接到 `z`。\n\n记住 `concat()` 是一个连接两个字符串的内置函数。如果值中的任何一个是数字，它会在连接之前将其转换为字符串。在\
  \ `while` 语句之后，我们简单返回 `z` 的值。\n\n如果我们使用以下语句运行函数：\n\n```sql\nSelect while_demo(1,\
  \ 5);\n```\n\n你将得到输出 2345。这是因为循环开始，`x = 1`  `y = 5`，`while` 语句将 `x` 加 1（现在 `x =\
  \ 2`）并将结果连接到 `z`。`z` 变为 ‘2’。\n\n接下来，循环重复。它将 `x` 加 1（现在 `x = 3`）并将结果连接到 `z`。`z` 变为\
  \ ‘23’。\n\n将 `x` 加 1 和结果连接到 `z` 的任务重复执行，直到 `x < y` 条件不再成立。\n\n# Repeat statement\n\
  \n接下来，让我们看看 `repeat` 语句。`repeat` 语句也用于执行任务，直到满足停止条件。\n\n语法为：\n\n```sql\nRepeat\n\
  Do some tasks\nUntil stop condition\nEnd repeat;\n```\n\n### Example\n\n```sql\n\
  Delimiter $$\nCreate function repeat_demo(x int, y int) returns varchar(255) deterministic\n\
  Begin\nDeclare z varchar(255);\nSet z = ‘‘\nRepeat\nSet x = x + 1;\nSet z = concat(z,\
  \ x);\nUntil x>=y\nEnd repeat;\nReturn z;\nEnd $$\nDelimiter;\n```\n\n这个 `repeat`\
  \ 语句重复两个任务（`set x = x + 1` 和 `set z = concat(z, x)`），直到满足 `x >= y` 条件。\n\n如果我们使用以下语句运行函数：\n\
  \n```sql\nSelect repeat_demo(1, 5);\n```\n\n你将得到与之前的 `while` 语句相同的输出：2345\n\n区别在于\
  \ `repeat` 语句在检查条件*之前*执行任务，而 `while` 语句在执行任务*之前*检查条件。如果条件一开始为假，`repeat` 语句仍至少执行一次，而\
  \ `while` 语句可能完全不执行。\n\n# Leave statement\n\n下一个控制语句是 `leave` 语句。该语句用于提前退出循环或块。语法为：\n\
  \n```sql\nLeave label_name;\n```\n\n使用 `leave` 语句必须有一个标签。\n\n### Example\n\n```sql\n\
  Delimiter $$\nCreate function leave_demo(x int, y int) returns varchar(255) deterministic\n\
  Begin\nDeclare z varchar(255);\nSet z = ‘‘\nloop_label: while x<y do\nSet x = x\
  \ + 1;\nIf x = 3 then\nLeave loop_label;\nEnd if;\nSet z = concat(z, x);\nEnd while;\n\
  Return z;\nEnd $$\nDelimiter;\n```\n\n在这个示例中，我们有一个标记为 `loop_label` 的 `while` 循环。在循环内部，如果\
  \ `x` 达到 3，就会调用 `leave` 语句，立即退出 `loop_label` 循环。\n\n如果我们运行此函数：\n\n```sql\nSelect\
  \ leave_demo(1, 5);\n```\nOutput:\n23\n\n注意当 `x` 达到 3 时循环停止，尽管 `y` 为 5。\n\n# Continue\
  \ statement\n\n`next` 语句用于跳过循环当前迭代的剩余部分并进入下一次迭代。语法为：\n\n```sql\nContinue label_name;\n\
  ```\n\n### Example\n\n```sql\nDelimiter $$\nCreate function next_demo(x int, y int)\
  \ returns varchar(255) deterministic\nBegin\nDeclare z varchar(255);\nSet z = ‘‘\n\
  loop_label: while x<y do\nSet x = x + 1;\nIf x = 3 then\nContinue loop_label;\n\
  End if;\nSet z = concat(z, x);\nEnd while;\nReturn z;\nEnd $$\nDelimiter;\n```\n\
  \n在这个示例中，当 `x` 达到 3 时，调用 `next` 语句，跳过循环的剩余部分（`Set z = concat(z, x)` 部分）并进入循环的下一次迭代。\n\
  \n如果我们运行此函数：\n\n```sql\nSelect next_demo(1, 5);\n```\nOutput:\n245\n\n注意值 3 没有被添加到\
  \ `z` 中，因为 `next` 语句跳过了循环的循环。\n\n# Handler statement\n\n`handler` 语句用于定义发生特定错误时采取的操作。语法为：\n\
  \n```sql\nHandler condition DO action;\n```\n\n### Example\n\n```sql\nDelimiter\
  \ $$\nCreate function handler_demo() returns varchar(255) deterministic\nBegin\n\
  Declare msg varchar(255);\nDECLARE HANDLER FOR SQLEXCEPTION SET msg = 'An error\
  \ occurred';\n-- 可能会触发错误的代码\nSELECT 1 / 0;\nReturn msg;\nEnd $$\nDelimiter;\n```\n\
  \n在这个示例中，定义的 `handler` 用于捕获任何 `SQLEXCEPTION`。当发生错误（如除以零）时，触发处理器，将 `msg` 设置为‘An error\
  \ occurred’，函数返回该消息而不是崩溃。\n\n# Declare statement\n\n`declare` 语句用于在块或函数中定义变量。语法为：\n\
  \n```sql\nDeclare variable_name datatype [DEFAULT value];\n```\n\n### Example\n\n\
  ```sql\nDelimiter $$\nCreate function declare_demo() returns int\nBegin\nDeclare\
  \ myvar int DEFAULT 10;\nDeclare othervar int;\nSet othervar = myvar + 20;\nReturn\
  \ othervar;\nEnd $$\nDelimiter;\n```\n\n\n\n\n\n此外，另一个重要的区别是 `repeat` 语句始终至少执行一次任务。这是因为检查（例如，直到\
  \ `x>=y`）是在任务完成后完成的。\n\n因此，如果你运行以下语句：\n\n```sql\nSelect repeat_demo(5, 1);\n```\n\
  \n你将得到结果 6，因为即使 `repeat` 条件（直到 `x>=y`）已经满足，`repeat` 语句内部的两个任务至少执行一次，因为检查是在任务完成后完成的。\n\
  \n清楚了吗？\n\n# 循环语句\n\n最后但最重要的，让我们来看看循环语句。此语句与 `while` 和 `repeat` 语句非常相似，区别在于它没有用于退出循环的条件。\n\
  \n相反，我们使用 `iterate` 或 `leave` 关键字来退出循环。\n\n循环语句的语法为：\n\n```sql\n[name, of loop statement\
  \ :] loop\n    Some tasks\n    End loop;\n```\n\n让我们来看几个例子。\n\n### 示例 1\n\nDelimiter\
  \ $$\n\n```sql\nDELIMITER $$\nCREATE FUNCTION loop_demo_a(x int, y int) RETURNS\
  \ varchar(255) DETERMINISTIC\nBEGIN\n    DECLARE z varchar(255);\n    SET z = '';\n\
  \    simple_loop: LOOP\n        SET x = x + 1;\n        IF x > y THEN\n        \
  \    LEAVE simple_loop;\n        END IF;\n        SET z = concat(z, x);\n    END\
  \ LOOP;\n    RETURN z;\nEND $$\nDELIMITER ;\n```\n\n在这里，我们定义了一个名为 `simple_loop`\
  \ 的循环。为循环语句提供名称通常是必要的，因为之后我们需要该名称来使用 `leave` 或 `iterate` 语句。\n\n在循环内部，我们执行以下操作：\n\
  \n首先，我们将 `x` 的值加 1。接下来，我们检查 `x` 是否大于 `y`。如果是，我们就离开循环。\n\n要退出循环，我们写：\n\n```sql\n\
  Leave simple_loop;\n```\n\n`leave` 是 MySQL 中的一个关键字，表示我们要退出循环。我们必须提供要退出的循环名称。在示例中，我们正在退出\
  \ `simple_loop`。\n\n如果没有满足 `leave` 条件，我们将留在循环中并将 `z` 与 `x` 拼接。\n\n如果你现在使用以下语句运行函数：\n\
  \n```sql\nSelect loop_demo_a(1, 5);\n```\n\n你将得到输出 2345。\n\n### 示例 2\n\n除了使用 `leave`\
  \ 关键字外，我们还可以使用 `iterate` 关键字。与完全退出循环的 `leave` 关键字相比，`iterate` 关键字仅跳过循环的一次迭代。\n\n\
  让我们来看一个例子：\n\n```sql\nDELIMITER $$\nCREATE FUNCTION loop_demo_b(x int, y int) RETURNS\
  \ varchar(255) DETERMINISTIC\nBEGIN\n    DECLARE z varchar(255);\n    SET z = '';\n\
  \    simple_loop: LOOP\n        SET x = x + 1;\n        IF x = 3 THEN ITERATE simple_loop;\n\
  \        ELSEIF x > y THEN LEAVE simple_loop;\n        END IF;\n        SET z =\
  \ concat(z, x);\n    END LOOP;\n    RETURN z;\nEND $$\nDELIMITER ;\n```\n\n在这里，我们在循环语句中又增加了一个\
  \ `if` 条件。这个 `if` 条件使用了 `iterate` 关键字。\n\n如果你使用以下语句运行函数：\n\n```sql\nSelect loop_demo_b(1,\
  \ 5);\n```\n\n你将得到输出 245。因为条件的存在，迭代 `x = 3` 被跳过了：\n\n```sql\nIf x = 3 then iterate\
  \ simple_loop;\n```\n\n清楚了吗？很好！通过这个例子，我们已经到了本章的末。\n\n## if 语句\n\n在 Python 中，你可以使用各种语句。然而，你必须确保遵循语法规则和缩进。规则之一是在进入代码时，在\
  \ `if` 和 `else` 语句后提供缩进。只需按一次 Tab 键即可提供缩进。无论如何，程序都会帮助你确定语法中的错误。如果是错误，它将显示错误以及问题所在。如果你在语言中迷失了，也可以按键寻求帮助。因此，请放松并享受体验。\n\
  \n## 函数\n\n`if-else` 语句用于执行代码，通常用于比较值或确定正确性。当条件为 `true` 时，执行 `if`；当条件为 `false` 时，执行\
  \ `else`。通用代码如下：\n\n```python\nif expression:\n    statement\nelse:\n    statement\n\
  ```\n\n示例：首先分配一个基础语句。假设你正在教大一学生化学，并希望鼓励他们参加你的辅导。你可以编写这段 Python 代码：\n\n```python\n\
  Hours = float(input('how many hours can you allot for chemistry?'))\nif hours <\
  \ 1:\n    print('you need more time to study.')\nelse:\n    print('great! keep it\
  \ up!')\nprint('chemistry needs more of your time.')\n\n# While 语句\n\n`while` 语句是主要的循环语句，大多数用于需要简单迭代的地方。它的结构如下：\n\
  \n```python\ncounter = 10\nwhile counter > 0:\n    print(counter)\n    counter =\
  \ counter - 1\nprint('backward counting from 10 to 1')\n```\n\n这个简单的 `while` 循环不断检查\
  \ `while` 条件，直到条件变为 `false` 为止。在条件变为 `false` 之前，每次循环都会通过循环体。在条件变为 `false` 后，解释器恢复最近的活动，并继续执行循环之后的程序语句。下图说明了\
  \ while 控制的流程。\n\n![Image00042.jpg](img/Image0042.jpeg)\n\n# Case 语句\n\nRuby 语言在组织中常用于\
  \ Web 应用开发。Ruby on Rails 是一个允许快速开发的框架，使业务团队专注于其他过程而不是从零开始编写函数。该框架提供了一个被称为 MVC 结构（模型-视图-控制器）的分隔器。MVC\
  \ 为分离用户界面和业务提供了支持。\n\n另一方面，Python 拥有最流行的 MVC 框架，用于 Web 开发的 Django。此外，Python 在 Web\
  \ 应用领域之外也很有。例如，pandas 库有助于数据准备。其他库如 numpy 和 stats-model 在这种情况下也是支持。matplotlib 是用于数据可视化的强大\
  \ Python 库。`tensorflow` 以机器学习任务和项目而闻名。此外，`scipy` 是 Python 的另一个开源库，用于科学计算和解决曾让工程学生流汗的数学函数。\n\
  \n\n\n\nMySQL 的开发始于 1994 年，科学家 David Axmark 和 Michael Wakefield 被誉为 1995 年该 DBMS\
  \ 首个内部版本的发布者。该 DBMS 的 Windows 版本出现得得多，是在 1998 年。最初，MySQL 项目由 MySQL AB 所有。2008 年，项目所有权转移到太阳微系统（Sun\
  \ Microsystems），随后发布了 MySQL 5.1 版本。该数据库管理系统的主要特性包括：\n\n- 灵活性\n- 高可用\n- 可扩展性\n- 高性能\n\
  - Web 优势\n- 健壮的事务支持\n- 数据仓库优势\n- 全面的应用开发\n- 强力保护\n- 开源自由\n- 管理方便\n- 最低的总拥有成本\n-\
  \ 24x7 全候支持\n\n### MS SQL Server\n微软以 MS SQL Server 的形式推出了其关系型数据库管理系统，使用 ANSI SQL\
  \ 和 `T-SQL` 作为其主要查询语言。Sybase 在 1987 年发布了该 DBMS 的第一个版本。Sybase 与 Aston-Tate 以及微软合作将\
  \ `SQL Server` 移植到 `OS/2`，并于 1989 年发布了 `SQL Server` 1.0，随后 Aston-Tate 退出了 SQL 开发，微软发布了\
  \ `SQL Server` 2000。MS SQL Server 的主要特性包括：\n\n- 高可用\n- 数据库快照\n- 高性能\n- 数据库镜像\n-\
  \ 服务代理 (Service broker)\n- CLR 集成\n- 排名函数\n- DDL 触发器\n- XML 集成\n- 基于行版本的隔离级别\n-\
  \ 数据库邮件\n- Try…catch\n\n### Oracle\nOracle 是目前市场上最流行、最大的多用户 DBMS 之一。如名所示，Oracle\
  \ 由“Oracle 公司”（Oracle Corporation）拥有并创建。Oracle 的核心特性在于它能够高效管理资源，这些资源是许多客户端通过网络访问的数据库。\n\
  \n考虑到 Oracle 的基础架构，它被认为最适合客户端服务器计算。此外，它支持 Unix、Windows、Linux 和 macOS 等许多平台。Oracle\
  \ 的起源追溯到 1977 年，当时 Ed Oats、Bob Miner 和 Larry Ellison 创立了“软件开发实验室”（Software Development\
  \ Laboratory）。当 2.0 版本于 1979 年发布时，Oracle 成为第一个商业 SQL 数据库管理系统。\n\n同年，公司名称更改为 Relational\
  \ Software Inc. (RSI)。由于该公司进行的大部分开发都与 Oracle 有关，其名称在 1982 年再次更改，并获得了现在的身份 Oracle\
  \ 公司（Oracle Corporation）。\n\n在随后的几年里，Oracle 获得了其多功能特性。例如，跨平台的 Oracle 3.0 版本于 1983\
  \ 年发布，而 4.0 和 5.0 版本中加入了并发控制等功能。Oracle 的主要特性包括：\n\n- 读取一致性\n- 并发\n- 数据库静止 (Quiesce\
  \ database)\n- 锁定机制\n- 自管理数据库\n- 可移植性\n- ASM\n- `SQL*Plus`\n- 资源管理器\n- 调度器\n- 物化视图\n\
  - 数据仓库\n- 表格压缩\n- 位图索引\n- 分析型 SQL\n- 并行执行\n- 分区\n- 数据挖掘\n\nAccess 是微软的一款基础数据库管理系统，用于入门，这使其成为最受欢迎的产品之一。它受欢迎的其他原因还包括价格低廉以及为小型项目创建健壮解决方案的能力。此外，微软旗舰性的高度直观且易于使用的图形界面增加了该产品的声誉。\n\
  \n这里需要提到的是 Access 使用了 `T-SQL`，这是 SQL 的变体。这种 SQL 方言专门用于 Access 数据库引擎的数据库操作。Access\
  \ 的第一个版本于 1992 年发布，多年来经历了许多改进和新增。目前，Access 作为 MS Office 产品的一部分提供。该管理系统的主要特性包括：Access\
  \ 允许用户创建表单、报告和查询。此外，它支持从 Oracle、Excel 等格式导入数据并导出到特殊的 `mdb` 格式。该工具还支持 SQL Server，并通过\
  \ `ADO` 或 `DAO` 进行连接。需要注意的是，Access 并不是客户端服务器数据库，因此它不实现存储过程、事务日志或触发器。它实际上是一个文件数据库。\n\
  \n### SQL 工具类型\n市场上有多种类型的 SQL 工具。在选择这些工具时，需要考虑多种因素，包括：\n\n- 你想要管理的：例如，为了管理 SQL Server\
  \ 实例，建议选择 Azure Data Studio。\n- 数据库代码的创建和维护：你需要 SQL Server Data Tools (SSDT)。\n\
  - 使用命令行查询 SQL Server：你可以选择 `mysqlcli`。\n- 编写 T-SQL 脚本：你应该使用 Visual Studio Code 和\
  \ MySQL 扩展。\n\n本节旨在评估 SQL Server 管理中常用的工具如下：\n\n#### Interbase\n这是一种快速且嵌入的 SQL 数据库工具，具有企业级的安全性、灾难恢复能力以及顺畅处理变更的能力。工具具有以下特性：\n\
  \n- 遵循 SQL 标准：这些工具兼容所有 SQL 标准，识别 Unicode，并适用于任何字符。\n- 提供多 Unicode、实时告警和更改跟踪。\n-\
  \ 轻量级：它适用于当前的 CPU，并适用于各种系统。\n- 快速恢复：适用于快速灾难恢复。\n\n#### DbForge Studio for SQL Server\n\
  这是最好的 IDE 工具之一，执行多种功能，包括服务器管理、管理、数据报告、分析等。该工具具有以下特性：\n\n- 能够管理数据库\n- 提供高质量的代码支持\n\
  - 高质量的 SQL Server 报告\n- 保护：它提供了最佳的信息保护\n\n#### Dbwatch\n该工具提供全面的数据库管理支持，适用于 Oracle、SQL\
  \ Server、Azure 等多种数据库。该工具用于不同环境（包括混合和云）的维护工作。它具有以下特点：\n\n- 协助监控性能并生成重要报告。\n- 实现\
  \ SQL Server 的常规内存最小化。\n- 轻量级：它适用于当前的 CPU，并适用于各种系统。\n- 快速恢复：适用于快速灾难恢复。\n\n\n\n这是提供\
  \ SQL 数据库监控服务的最佳工具之一。它可以处理不断增长的业务工作负载。由于对高性能数据的需求日益增长，许多公司正在使用此工具。`sql entry` 具有以下特性：\n\
  \n- 协助性能指标的收集和展示。\n- 分析和调优能力——该工具具备启用 SQL 查询分析和高级调优的功能。\n- 它被评为最佳 DBA 解决方案。\n\n\
  ## Admin\n\n这是一个提供各种解决方案的数据管理工具。这些解决方案包括数据库、表、列、关系等的管理。该工具以单个 PHP 文件的形式出售，并支持不同系统上的各种数据库，包括\
  \ ms sql、oracle 和 `mysql`。你可以下载文件形式的各种版本。`Admin` 具有各种特性，包括：\n\n- 执行数据表列表操作并具有多种功能，包括排序、搜索等。\n\
  - 它有多种自定义选项。\n- 指示过程并销毁它们。\n\n## Dbcompare\n\n这是一个易于使用的数据库比较设备，可以对数据库结构进行分析并提供见解。该工具允许你比较不同的对象，包括表、外键、角色等。`Dbcompare`\
  \ 具有不同的功能，如：\n\n- 定期对比各种数据库结构。\n- 为评估提供不同的选择。\n- 它内置了可视化树，用于自发地表示差异。\n\n## Ms sql\
  \ manager lite for sql server\n\n此工具用于创建 SQL 数据库对象并允许执行各种编辑任务。该工具拥有最好的界面并加载了实用的功能。它可以替代\
  \ `ssms`。\n\n- 支持特性——该工具支持多种 SQL 特性，包括 azure、sql database、unicode 等。\n- 提供查询构建工具——该工具为查询开发提供了视觉化和文本设备。\n\
  - 比较——该数据库工具有助于比较和同步各种数据库结构。\n- 内置 SQL 调试器——该工具带有一个 SQL 调试器，可以跟踪进程、函数和脚本。\n\n##\
  \ Firebird\n\n这是一个高效的 SQL 工具，在 Windows 和 Linux 上均运行良好。Firebird 具有各种特性，包括：\n\n- 过程完全支持——该工具对各种过程提供完全支持，包括标准事务、多种访问方式、支持增量备份等。\n\
  - 复杂的应用——该工具应用了最新技术，如 `fb25` 和 `fb30`。这意味着它提供了高质量的服务。\n- 云支持——该工具可以识别云基础设施。\n\n\
  ## Squirrel sql\n\n此工具支持 Java 数据库的管理。通过此工具，你可以查看 SQL 数据库并提供命令。该工具可在不同的数据库上运行，包括\
  \ ibm、sql、oracle 等。它的核心特性包括：\n\n- 弹出菜单——通过此菜单，你可以执行编辑等各种功能。\n- 对象树显示——这向你展示了季节窗口。\n\
  - 图表——它显示表的图形以及它们如何连接。\n\n## Sqlite database browser\n\n该工具开源，有助于创建和编辑数据库中的各种文件。`Sql\
  \ database browser` 具有各种特性，包括：\n\n- 数据库的创建和修改——通过此工具，你可以创建和编辑各种数据库、表等。\n- SQL 命令——该工具有一个日志，显示已发布的所有\
  \ SQL 命令及其使用情况。\n- 创建简单图表——该工具可以根据表中的数据绘制图表。\n\n## Beaver\n\n该工具开源，被数据库管理员用于支持 `mysql`\
  \ 和 ibm 等数据库。该工具的主要作用是创建和修改 SQL 脚本、数据导出等。该工具具有各种特性，包括：\n\n- 数据创建：创建和修改插件的能力——该工具提供了插件。\n\
  \n## Db visualize\n\n这是一个开源的通用数据库工具，有助于管理 oracle、sybase 等数据库。该工具具有一个用于浏览对象的浏览器。它有助于对象的形成和修改。`db\
  \ visualize` 的核心特性包括：\n\n- 特定对象的管理\n- 模式（Schema）辅助\n- 配合查询操作\n\n当你设置好想要使用的查询时，你会发现你正在向已设置的数据库发送查询。你会发现有几种方法可以实现此操作，但\
  \ `select` 命令将是实现此操作的最佳选项之一，并能根据搜索立即返回我们所需的信息。例如，如果你正在处理一个包含所有待售产品的表，你可以使用 `select`\
  \ 命令来查找最畅销的产品或你当时拥有的产品。结果将直接显示在数据库中存储的任何信息上，你会发现当我们谈论关系型数据库时，这些是正常完成的。\n\n“数据库”一词的含义在过去的几十年里发生了巨大的变化，某些人将其指的是书籍或列表中包含的任何数量的项目。对其他人来说，它指的是结构化数据或记录的存储库，可以通过计算机系统访问。我们将关注第二个定义，它也包含了\
  \ sql。请记住，在这种情况下，记录指的是项的表示。例如，你正在经营自己的业务，因此你会为每个唯一的客户创建一个记录。这些记录将包含描述该对象的若干特征。例如，你可以包括名称、电话号码、地址等数据。\n\
  \n然而，数据库并不仅仅包含数据。它还包含元数据，其目的是定义数据库内部的信息结构。为什么这很重要？因为如果你知道数据是如何组织的，你就可以访问、管理、维护和修改它。这意味着数据库是自描述的，因为它包含了关于数据对象之间连接的信息。元数据被保留在所谓的“数据字典”中。该词典描述了数据库的组成部分，即表、行、列等。顺便提一下，你应该知道扁文件系统不包含元数据。这意味着处理这些文件的程序需要具有某种形式的等效集成。\n\
  \n数据库的大小也根据其包含的记录数量而异。例如，你可以拥有从几十个到数百万个不等的数据对象。目前，你不必担心任何此类限制。但是，数据库可以用三种不同的方式分类：\n\
  \n个人数据库是最小的。它们存储在用户的个人计算机上，以基本数据结构为特征。\n\n\n\n\n另一方面，群组数据库要复杂得多。它们旨在供部门或团队使用，这意味着它们包含的数据比个人数据库要多得多。这意味着它们还需要能够同时从多个设备进行访问。\n\
  \n最后，我们还有企业版数据库。它们规模庞大、复杂，需要最可靠的设备来安全地存储和维护。\n\n正如你所看到的，你可以通过三个属性对数据库进行分类：它的大小、有多少人需要访问它以及它需要什么种技术设备。\n\
  \n# 数据库管理系统\n\n为了管理数据库以及任何访问它的的应用程序，我们需要使用数据库管理系统。请记住，数据库无非一个设计用于包含信息的结构。我们需要一个能够实际创建该结构并允许我们访问、维护或修改其中数据的工具。目前有许多此类程序，可以免费提供，也可以收取特定费用。\n\
  \n然而，并非所有数据管理系统都是同质的。你需要的系统取决于你的目标和需求。例如，某些程序设计用于在专业的企业级设备上运行并处理海量数据库；而另一些程序则设计用于在基础个人笔记本电脑上运行。但是，请记住，这些工具有时需要在运行不同操作系统的不同硬件设置上同时运行。此外，我们还要考虑云存储作为一种选项。如今，你可以通过亚马逊和微软等组织提供的服务获得公共在线存储。\n\
  \n云是你在任何技术领域经常听到的术语之一，由于如今许多企业对计算机处理能力和存储能力的需求巨大增长。你现在需要了解（如果你不知道的话）的是，云是计算机的集合，通过互联网向任何人提供其资源。这意味着任何人都可以从家里舒适地访问这些服务，而无需物理上连接到数据中心。在这种情况下，具有云能力的数据库管理系统可以为你提供远程管理数据库的功能。\n\
  \n数据库管理系统确保无论系统类型和数据库大小如何，用户与系统之间的数据流始终保持一致。\n\n# 数据库类型\n\n最早的数据库模型是基于分级结构的构建的。这导致了许多问题，由于缺乏灵活性，此类数据库极难修改和维护。结构性问题和各种冗余问题导致了网络型数据库的发展。它的目的是消除此类缺陷。它们确实提供了几乎没有冗余的优势；然而，为了实现这种特性，必须做出另一个牺牲。网络模型数据库的结构非常复杂，因此导致了另一组问题。\n\
  \n随着关系型数据库的发展，这些技术问题很快得到了解决方案。其结构简单，最小冗余是其主要特征之一。这种新类型的创建，其目的是将关系型数据库变为革命性的东西，并让其他模型变得无足。\n\
  \n# 关系型数据库\n\n有了新类型的数据库，就需要一种新的数据库管理系统。这就是 Oracle 的诞生：一个小型初创公司给出的新答案。此时，关系型数据库成为主流。这使得在不改变其他地方使用的程序设计的情况下修改该模型的结构成为可能。例如，要在数据库内部创建更多列，你只需要添加它们，而无需任何耗时的修改。依赖于数据库的应用程序不需要任何更改。\n\
  \n另一个强大的优势是某些数据可以存储在一个表中，而另一些数据可以存储在另一个表中。这两个表不需要以任何方式连接；因此，你可以更改一个表的信息而不会对另一个表产生负面影响。关系模型和对象模型提供了一系列优势。幸运的是，当时的开发者考虑了从对象数据库的力量中获利的可能性，以及关系模型提供的兼容性。关系型数据库就是这样产生的：本质上，它利用了我们已经讨论的关系模型，并在此基础上增加了对象模型的功能。对象特性通过\
  \ SQL 实现，因此允许所有数据库管理系统适应并变为关系型数据库管理系统。请记住，它们仍然保留了与原始关系模型的兼容性。自 90 年代以来，随着编程技术和语言的不断发展，关系型数据库通过引入越来越多的对象特性逐渐扩展。然而，在这种数据库类型的核心，关系模型保持不变，尽管它在多年里受到了许多扩展。\n\
  \n关系型数据库的流行开始下降，转而采用我们今天使用的标准 SQL 数据库。现代问题需要对象特性才能提供的复杂 SQL 解决方案。\n\n## 第 4 章：表\n\
  \n### 使用命令行创建第一个数据库和表\n\n你也可以使用 SQL 命令和语句来创建数据库和表。对于 SQL Server Management Studio，情况同样适用，但命令和语句用于指示系统执行给的功能。要构建第一个数据库，你使用命令\
  \ `select database (database_name)` 并点击执行按钮来创建程序。因此，屏幕上的信息应该是“command(s) completed\
  \ successfully”，显示你的数据库已创建。\n\n要使用数据库，运行命令 `use (database_name)`，这告诉查询窗口运行新的数据库程序。另一方面，创建一个新表涉及运行命令\
  \ `create table (table_name)`。输入数据紧随命令 `insert data into (table_name), values (table_name)`，并对你所有的数据集重复相同的过程。同样的方法允许查看你保存的数据，并包括格式命令\
  \ `select * from (table_name)`。上述所有命令在操作不同的 SQL 数据库时都是关键命令。因此，学习每个 SQL 基础命令以从容执行程序是至关重要的。\n\
  \n### 创建表\n\n以下是简单的步骤：\n\n输入关键字 `create table`\n\n这些关键字将表达你的意图并引导你脑海中的操作。\n\n\n\n\
  \n### 创建表\n\n示例：`create table`\n\n输入表名\n\n在你的 `create table` 关键字之后，添加表名。表名应该是具体的且唯一的，以便日后方便、快速地访问。\n\
  \n示例：`create table \"table_name,\"`\n\n你的表名不能让任何人轻易猜到。你可以通过包含你的姓名缩字母和出生日期来实现这一点。例如，如果你的名字是\
  \ henry sheldon，出生日期是 1964 年 10 月 20 日，你可以将这些信息添加到表名中。\n\n假设你想让你的表关于你网站的流量来源；你可以将表命名为\
  \ `\"traffic_hs2064\"`。\n\n请注意，所有的 SQL 语句必须以分号（`;`）结束。所有数据变量也必须包含在引号（ ” ）中。\n\n\
  示例：`create table traffic_hs2064`\n\n在下一行添加左括号\n\n括号将表示你想要创建的列的引入。\n\n示例：`create\
  \ table \"table_name,\"`\n\n`(`\n\n让我们将步骤应用于我们的特定示例中。\n\n示例：`create table traffic_hs2064`\n\
  \n`(`\n\n在某些情况下，并不使用括号。\n\n### 添加第一个列名\n\n你想给你的第一列起什么名字？这应该与你想为该表收集的数据或信息相关。始终用逗号分隔你的列定义。\n\
  \n示例：`create table \"table_name,\"`\n\n`(`\n`\"column_name,\" \"data type,\"`\n\n\
  ### 定义数据类型\n\n在我们的示例中，该表的重点是你网站的流量来源。因此，你可以将第一列命名为 `\"country\"`。\n\n示例：`create\
  \ table traffic_hs2064`\n\n`(country`\n\n## 根据数据添加更多列\n\n如果你需要更多关于该表的数据，可以添加更多列；这取决于你。所以，如果你想再添加四列，你的\
  \ SQL 语句将如下所示。\n\n示例：`create table \"table_name,\"`\n\n`(`\n`\"column_name,1\" \"\
  data type,\"`\n`\"column_name,2\" \"data type,\"`\n`\"column_name,3\" \"data type,\"\
  `\n`\"column_name,4\" \"data type,\"`\n`);`\n\n假设你已经决定为第 2 列添加用于搜索网站的关键词，为第 3 列添加访问者在你网站上花费的分钟数，为第\
  \ 4 列添加该人员访问的特定帖子。这是你的 SQL 语句的样子。\n\n### 注意：\n\n表名或列名必须以字母开头；后面可以跟数字、下划线或另一个字母。字符数不应超过\
  \ 30 个。\n\n你也可以使用 `varchar`（可变字符）数据类型来帮助创建列。\n\n常见的数据类型有：\n- `Date` – 指定的日期或值\n\
  - `Number(size,)` – 你应该在左右括号内指定列数字的最大最大位数\n- `Char(size,)` – 你应该在左右括号内指定固定长度的大小。\n\
  - `Varchar(size,)` – 你应该在左右括号内指定最大大小。这用于条目的变长长度。\n- `Number(size, d)` – 这与 `Number(size,)`\
  \ 类似，区别在于 `d` 代表数字右侧（从小数点开始）的最大数字位数。\n\n因此，如果你想让你的列显示 10.21，你的数字类型将是：`Number(2,2)`\n\
  \n示例：`create table traffic_hs2064`\n\n`(country varchar (40),`\n`Key varchar (30),`\n\
  `Time number (2),`\n`Post varchar (40));`\n\n约束是应用于特定列的规则。如果你愿意，可以添加约束。最常见的约束是：\n\
  - `not null` – 表示列不应包含空白\n- `unique` – 表示所有添加的条目必须是唯一的，且与列中的任何项目不重复。\n\n总之，使用 SQL\
  \ 语句创建表将从 `create table` 开始，加上 `table name`、左括号、`column names`、`data type`（在每个列后添加逗号）、添加任何\
  \ `constraints`。\n\n### 删除表\n\n使用适当的 SQL 语句可以轻松从数据库中删除表、行或列。这是你必须掌握的命令之一。\n\n删除表的步骤如下：选择\
  \ `delete` 命令。在你的显示器上，选择 `delete` 命令并指定关键字。下载 MySQL 数据库和 MySQL 连接器可以方便你的操作。\n\n\
  SQL 专家可能会笑说这些步骤不应该包含在书中，但对于初学者来说，具体说明应该执行哪些步骤是关重要的。想象你正在学习一种新语言，例如，你就会明白我的意思。通过添加单词\
  \ `from` 和表名来指示你可以从哪个表执行此操作：`delete from \"table_name,\"`。\n\n通过添加 `where` 指定特定的列或行。如果你没有指定\
  \ `where`，所有的文件都将被删除，所以请确保你的语句是完整的。\n\n示例：`delete from \"table_name,\"` `where column_name,`\n\
  \n因此，如果你想删除整个表，只需选择：`delete from \"table_name,\"` `where time = (10)`\n`delete from\
  \ traffic_hs2064` `where time = (5);`\n\n通过添加必要的变量完成你的 `delete` 语句。\n\n示例：`delete\
  \ from \"table_name,\"` `where column_name,` 运算符 `\"value,\"` [或 `\"column\"`运算符\
  \ `\"value,\"];\n\n从数据库中删除错误的表可能会导致问题，因此确保你输入了正确的 SQL 语句。\n\n### 向表中插入数据\n\n你可以通过以下步骤向现有表插入新数据：输入关键字\
  \ `insert into`。选择关键字 `insert into`。与 SQL 兼容的最常见程序是 Windows MySQL。你可以使用它向你的表插入数据。\n\
  \n添加表名。现在你可以添加表名了。确保它是正确的表。\n\n示例：`insert into \"table_name,\"`\n\n使用我们的表：示例 `insert\
  \ into traffic_hs2064`\n\n添加左括号。你现在可以在表名之后、列名之前添加左括号。记住在每个列后添加逗号。\n\n示例：`insert\
  \ into \"table_name,\"` `(`\n\n使用我们自己的表：示例 `insert into traffic_hs2064` `(`\n\n\
  指定列。指定你打算插入数据的列。\n\n示例：`insert into \"table_name,\"` `(\"column_name,\" ... \"column_name,\"\
  )`\n\n用右括号关闭列。不要忘记添加右括号。这将指示你已相应地识别了列。\n\n示例：`insert into \"table_name,\"` `(\"\
  first_columnname,\" ... \"last_columnname,\")`\n\n添加关键字 `values`。values 关键字将帮助你的选择更具体。值的列表随其。这些值也必须包含在括号内。\n\
  \n示例：`insert into \"table_name,\"` `(\"first_columnname,\" ... \"last_columnname,\"\
  )` `values(first_value, ... last_value,)`\n\n添加右括号。记得向你的 SQL 语句添加右括号。这将指示该列不再进一步延伸。\n\
  \n示例：`insert into \"table_name,\"` `(\"first_columnname,\" ... \"last_columnname,\"\
  )` `values(first_value, ... last_value);`\n\n\n\n\n\n请注意，字符串必须包含在单引号中，而数字则不需要。\n\
  \n使用我们的示例表，你可以编写此 SQL 语句：\n\n```sql\nExample: insert into \"traffic_hs2064\" (country,\
  \ keyword, time) Values ('america', 'marketing', 10);\n```\n\n你可以安全地插入更多数据，而不影响其他表。只需确保你正在使用正确的\
  \ SQL 命令或语句即可。\n\n### 删除表 (Dropping a table)\n\n你只需在键盘上敲击几下即可删除一个表。但在你决定删除表之前，请考虑一下如果以后需要它，你可能需要花费额外的时间来恢复。因此，请谨慎使用此命令。\n\
  \n删除表与删除表中的记录/数据不同。当你删除一个表时，你删除的是表的定义以及表中的所有记录/数据。\n\n```sql\nExample: drop table\
  \ \"table_name,\"\n```\n\n使用我们的表，SQL 语句如下：\n\n```sql\nExample: drop table traffic_hs2064;\n\
  ```\n\n只要你能够编写出正确的 SQL，删除表是非常简单的。\n\n### 使用 alter table 查询 (Using the alter table\
  \ query)\n\n在某些情况下，你需要使用 `alter table` 命令。这在你需要编辑、删除或修改表和约束时。\n\n该查询的基本 SQL 语句为：\n\
  \n```sql\nExample: alter table \"table_name,\" Add \"column_name,\" data type;\n\
  ```\n\n你可以使用此基础表作为你的演示表：\n\nTraffic_hs2064\n\n![Image00043.jpg](img/Image00043.jpeg)\n\
  \n如果你的基础表是上面的表，并且你想添加另一个标记为 city 的列，你可以通过这种方式创建 SQL 查询：\n\n```sql\nExamples: alter\
  \ table traffic_hs2064 Add city char(30);\n```\n\n输出的表将如下所示：\n\nTraffic_hs2064\n\
  \n![Image00044.jpg](img/Image00044.jpeg)\n![Image00045.jpg](img/Image00045.jpeg)\n\
  \n你也可以修改表以添加诸如非空（not null）之类的约束。\n\n```sql\nExample: alter table traffic_hs2064\
  \ Modify city not null;\n```\n\n这将修改所有非为空的条目。你也可以修改表以删除列，例如：\n\n```sql\nExample:\
  \ alter table traffic_hs2064 drop column time;\n```\n\n使用第二个表执行此查询，结果结果表将是：\n\n\
  Traffic_hs2064\n\n![Image00046.jpg](img/Image00046.jpeg)\n\n你可以通过添加唯一约束（unique constraint）来修改表。你可以通过这种方式构建查询：\n\
  \n```sql\nExample: alter table traffic_hs2064 Add constraint country unique;\n```\n\
  \n除了这些用途外，alter table 还可以用于删除约束（drop constraint），例如：\n\n```sql\nExample: alter table\
  \ traffic_hs2064 Drop constraint city;\n```\n\n以下是约束的示例：\n\n**非空 (Not null)**：此约束表示存储表中的列中不应存在空值。\n\
  \n**检查 (Check)**：这将确保所有参数的值都符合标准。\n\n**唯一 (Unique)**：这确保列中的所有值都是互不相同或唯一的。\n\n**主键\
  \ (Primary key)**：这表示两个或多个列中的值必须同时不为空。\n\n**外键 (Foreign key)**：这将确保不同表之间的列值相匹配。\n\
  \n**默认 (Default)**：列有一个指定的默认值。这可能显示为空白或显示为空。\n\n确保妥善使用这些约束，以充分发挥你的 SQL 查询的作用。\n\n\
  **表 (Table)**：表是关系型数据库管理系统（RDBMS）用于存储数据的对象。通常，表是包含数据条目的行和列的集合。这是数据存储最的形式。下面是表的示例。该表包含公司员工的数据。数据字段包括\
  \ ID 号、姓名、性别工资。\n\n![Image00047.jpg](img/Image00047.jpeg)\n\n## 第 5 章：学习函数 (learning\
  \ function)\n\n### 内置函数与计算 (Built-in functions & calculations)\n\n关于 SQL，内置函数可以定义为编程的一部分，它接受零或任何其他输入并返回答案。内置函数有不同的角色。这些包括执行计算、获取系统值以及在文本数据处理中的应用。这部分旨在检查各种\
  \ SQL 内置函数、函数分类、函数的优缺点以及内置函数的类型。\n\n### SQL 函数类型 (Types of sql functions)\n\nSQL\
  \ 函数分为两类：聚合函数和标量函数。配合 `group by` 使用，聚合函数在不同的记录上运行并提供摘要。而标量函数则独立地运行在不同的记录上。\n\n如下：\n\
  \n**单行函数 (Single row functions)**：它们为任何查询表提供单行返回。它们出现在 select 列表中、以 where 子句开头以及其他。单行函数的示例包括\
  \ `numeric_`、`data_mining`、`date_time_`、`conversion_` 和 `xml_functions`。\n\n**聚合函数\
  \ (Aggregate function)**：应用此类函数时，你会看到基于不同行的单行返回。聚合函数存在于 select 列表、`order by` 和 `having`\
  \ 子句中。它们与 `group by` 子句和 `select` 语句配合使用。其中许多函数不关注空值。空值通常会被忽略。\n\n**分析函数 (Analytic\
  \ function)**：它们用于计算位于特定行组的聚合值。当你运行此函数时，它会返回多行。分析函数是查询中最后出现的。分析函数的示例包括 `analytic`\
  \ 和 `order_by`。\n\n**模型函数 (Model functions)**：这些出现在 select 语句中。模型函数的示例包括 `previous`。\n\
  \n**用户定义函数 (User-defined function)**：它们用于 SQL 以提供通常出现在表达式处的函数。例如，你可以在 select 列表中找到它们。\n\
  \n**SQL 计数函数 (Sql count function)**：它用于提供表的行数。\n\n### 函数分类 (Categories of functions)\n\
  \n函数根据它们在数据库中扮演的角色进行分类。以下是一些范畴：\n\n**聚合函数 (Aggregate functions)**：它们对一组特定的值进行计算并交付单个值。聚合值用于\
  \ select 列表和 `having` 子句。聚合函数被认为是确定性的。这意味着它们在在相同输入值上运行时会返回相同的值。\n\n**分析函数 (Analytic\
  \ function)**：它们根据一组行计算聚合值。它们为不同的组返回多行。分析函数可用于执行不同的计算，如运行总计、百分比等。\n\n**排名函数 (Ranking\
  \ functions)**：它们为每个分区行提供排名值。这类类型的函数被认为是非确定性的。\n\n**结果集函数 (ResultSet functions)**：它们用于返回一个可以应用的对象。\n\
  \n\n\n\nSQL Server 中存在的函数要么是确定性的，要么是非确定性的。确定性函数在执行时提供相同的答案。相反，非确定性函数在应用时会产生不同的结果。\n\
  \n### SQL 计算\n\nSQL Server 内置了各种数学函数。这些函数可以分为 4 大类类，包括科学和三角函数、舍入函数、符号函数和随机数。虽然每类中都有许多数学函数，但并不是所有的都会经常使用。下面重点介绍并解释了这些类别：\n\
  \n### 科学和三角函数\n\n在此类别下，有多个子类。包括 `pi`、`sqrt` 和 `square`。`pi` 函数用于计算圆的周长和面积。工作原理如下：\n\
  ```\nselect 2 * 10\n```\n`sqrt` 表示平方根。该函数最常用。它能够识别任何可以转换为 float 数据类型的数字。例如：\n```\n\
  select sqrt (36)\n```\n返回 6。`square` 意味着将任何数字乘以自身。这里勾股定理的概念在这里非常有用。这意味着 `a²+b²=c²`。这可以通过以下方式实现：\n\
  ```\nselect sqrt (square (a) + square(b)) as c\n```\n\n### 舍入函数\n\n在此类下，有不同的类别，包括\
  \ `ceiling` 和 `floor`。在处理浮点数或小数时，`ceiling` 函数很有帮助。你的目标是找到最高或最低的整数。`ceiling` 是最大的整数，而\
  \ `floor` 代表最小的整数。当你想要将数字舍入到特定的特定的位数时，则应用 `round` 函数。这表示为 `round (value, number\
  \ of decimal places)`。\n\n### 符号\n\n某些情况下你需要获取数字的绝对值。例如 -7 的绝对值是 7。绝对值不包含任何符号。为了帮助你完成此任务，使用\
  \ `abs` 函数是必须的。\n\n### Cos (x)\n\n此函数将弧度表示的角度作为参数。操作后，你会得到一个余弦值。\n\n### Sin (x)\n\
  \n此函数识别弧度角。计算后，它返回一个正弦值。\n\n### Sign\n\n当你需要负值、正值或零值时，可以使用 `sign` 函数。\n\n### SQL\
  \ 内置函数和数学应用的重要性\n\n内置函数是子程序，帮助用户在处理 SQL 数据库时实现不同的结果。当你想要操作或处理数据时，这些应用会被多次使用。SQL\
  \ 函数提供了在创建、处理和操作数据时使用的工具。SQL 内置函数和数学函数的用处如下：\n\n### 数据操作\n\n内置工具和数学函数在数据操作中起着重要作用。如果手动操作，处理海量数据可能会很困难。当数据量巨大时尤其如此。因此，这些函数在确保根据你的需求快速操作数据方面起着重要作用。\n\
  \n### 协助数据处理\n\n要从数据中获益，你必须对其进行处理。你可能永远无法手动处理大数据。因此，SQL 内置函数和数学应用可以帮助你处理数据库。## 简化任务\n\
  \n如果你是一个程序员，你可以证实这些函数和公式让你的工作变得轻松。当你应用这些内置函数时，你可以工作得。得益于这些工具，你可以在短时间内完成许多项目。\n\n\
  ## 提高生产力\n\n使用内置函数可以提高你作为程序员的效率。这是因为如果我们手动处理数据，完成任务之前可能花费大量时间，最终会损害你的生产力。然而，内置函数和计算允许快速执行任务。\n\
  \n### 节省时间\n\n因为函数只编写一次即可使用多次，它们节省了大量时间。节省时间的优点是这些函数为模块化编程提供了支持。\n\n### 增强性能\n\n\
  当你应用函数时，你增强了数据库的性能。这是因为函数在使用之前已经准备好并插入。\n\n### 内置函数的缺点\n\nSQL 内置函数有各种局限性，包括：\n\n\
  ### 稳定性\n\n在使用内置函数时，测试它们的业务逻辑具有挑战性。这是一个巨大的挑战，特别是当你希望函数支持你的业务逻辑时。你可能无法理解函数是否符合你的业务愿景和使命。\n\
  \n### 版本\n\n建立 SQL 内置函数使用的版本类型是挑战性的。你需要了解是否有任何新版本可能提供最佳服务。\n\n### 错误\n\n如果内置函数内部存在你不知道的错误，它们可能会破坏程序。这证明可能是昂贵且浪费时间的。\n\
  \n### 对变化的恐惧\n\n如果发生变化，你可能不理解它将如何影响你的 SQL 内置函数。技术世界不断变化，这种变化可能会影响内置函数。SQL 内置函数和计算至关重要，因为它们让程序员能够以最少的错误快速执行任务。内置数据库中的计算使得处理和操作数据成为可能。##\
  \ st 函数\n\n你可以创建并利用自定义函数。使用关键字来定义函数。函数应该先定义，使用 `def` 词和函数名称。当你想要定义函数时，可以使用下面的通用代码：\n\
  \n```\ndef functionname (arg1, arg2, arg3)\n    Statement1\n    Statement2\n   \
  \ Statement3\n```\n双击回车键访问结果。注意：`arg` 代表参数。\n\n### 示例\n\n你是一个雇主，你想打印员工的数字 (`num`)。因此，你将\
  \ `employee` 定义为你的文件名。\n\n```\ndef employee(num)\n    print(\"num\")\n```\n\n![Image0048.jpg](img/Image0048.jpeg)\n\
  \n当你按下回车并输入数字时，函数将一直运行，直到你决定停止。所以，函数可以重复工作。看下面的图片：\n\n![Image00049.jpg](img/Image00049.jpeg)\n\
  \n你也可以这种方式创建 Python 语法：\n\n```python\ndef employee(num):\n    print('employee',\
  \ num)\n```\n\n函数可以没有参数，也可以有几个参数。参数可以是数字或字符串。\n\n\n\n\n\n你也可以使用关键字 `return` 来 `return`\
  \ 结果（`return` 关键字表示指定计算的答案将会被 `返回` —— 显示在结果中）。\n\n### 示例：\n\n如果你想获取学生在 4 门科目上的平均分，你可以按照这种方式创建代码：只要你不退出\
  \ shell，就可以一直使用这段代码。如果你想保存它，可以创建一个新文件，这样就能保存它。\n\n```python\ndef grades(a,b,c,d):\n\
  \    return ((a+b+c+d)/4)\n```\n\n看下图：\n\n![Image00051.jpg](img/Image00051.jpeg)\n\
  \n当你或学生按照语法/语句输入分数时，`return` 结果将已经是计算后的值。看下图：\n\n![Image00052.jpg](img/Image00052.jpeg)\n\
  \n学生必须在箭头（`>>>`）之后在 shell 中输入给定的格式：\n\n`grades(80,90,85,75)`\n\n通过这种方法，你可以无止境地计算学生的成绩。\n\
  \n请记住，在代码工作并打印结果之前，你必须先定义（`def`）函数。\n\n记住在你的 `def` 语句后添加冒号（`:`）。你还必须用逗号分隔参数。\n\n\
  在默认参数中，当用户没有输入任何值时，会打印初始赋值。在多参数中，可以使用星号（`*`）来表示这一点。\n\n大胆尝试吧，发现如何使用 Python 让你的代码运行的乐趣。\n\
  \n## 第 6 章：查询与子查询\n\n虽然我们花了一些时间来看在处理 sql 语言工作时可以使用的一些命令和查询，但现在是时候让我们深入了解这些查询，以及它们在此过程中能为我们的某些需求提供什么了。\n\
  \n当我们处理业务数据库并且它已经按照我们想要的方式设置好时，可能会在某一个时刻你想要进行搜索，以确保你能从这些信息中找到完美的信息。这将使我们更容易找到我们想要的简单信息和结果。但我们必须确保数据库是以正确的方式设置的，以便我们使用正确的命令并确保过程是快速且准确的。\n\
  \n把这想象成当有人访问你的网站搜索他们想要购买的特定产品时。你希望他们卡在一个缓慢的网站上，并看到与他们想要的物品完全无关的结果吗？还是说你希望有一个快速、有用并鼓励这个人进行购买的搜索？当然，为了你业务的成功，你更有可能想要第二种方案，我们可以看看如何设置你的数据库并配合查询来实现这一点。\n\
  \n### 查询\n\n查询（Query）顾其名义，简单来说是对数据库数据值的一种提问或请求。人们可以简单根据包含的信息集发送一个问题，并根据数据库中表包含的数据期望回复；发送的问题就是查询。查询既可以是作为数据检索查询的\
  \ `select` 查询，也可以是需要对数据进行执行更多操作（如删除、更新或插入）的动作查询。查询有专门的用于向数据库发出请求的语言，以及标准结构化查询语言（`sql`）。然而，在\
  \ sql 伞下还有其他几种语言的扩展，包括 `oracle`、`mysql` 等。查询有许多不同的方法，但一旦理解了基础知识，问题的格式就会变得具有适应性。\n\
  \n重要的是要记住数据库将信息存储在表中，表由行组成，行包含数据，列则告诉数据库要存储什么以帮助提问：数据应该从哪一列获取？哪个表持有所需的信息？应该选择什么？对于特定问题需要哪些字段？在\
  \ sql 中，某些关键字与上述语句匹配，当发送 `select` 命令时，决定了查看哪些表以及处理此类数据所需的特殊条件。\n\n查询如何工作的一个非常好的例子是搜索。然而，它们并不像语言那样需要关键字或位置参数。一旦文本被输入到搜索引擎（如\
  \ `google`、`yahoo` 或 `bing`），这就是对特定主题信息的请求，并且请求在选择“回车”后确定。之后，搜索引擎部署一种算法，根据搜索引擎的关联性（这是公众无法访问的）来确定最佳结果。\n\
  \n搜索查询的类型包括导航式搜索、旨在寻找特定网站/博客的直接搜索、旨在跨越广泛主题（如比较）的信息搜索，以及旨在完成交易/购买的事务性搜索。\n\n### 索引视图与查询之间的关系\n\
  \n索引视图（index view）和查询都关联到数据库的一个点。查询位于图表的顶部，因为它是一个带出一个编程视图的请求，该视图通过索引结果以呈现。\n\n![Image00053.jpg](img/Image00053.jpeg)\n\
  \n上面的图表是关于它们如何关系的简单图解说明。一旦启动查询，一个编程响应的视图就会爬取索引，搜索响应所需的数据集，并被引导到所需的信息。这些信息被传回视图，视图反过来给查询提供响应，仅显示与查询相关的具有通用访问权的特定信息。视图与索引的协同形成了索引视图，这是非常有益的，因为各种视图现在已链接到特定的、定制的索引。\n\
  \n### 子查询\n\n你需要探索的第一个概念是子查询（subquery）。正如其名所示，子查询是嵌入在查询中的。实际上，它是查询中的查询。在大多数情况下，它的目的是执行一个逻辑测试或计算，产生一个可以传递给查询的结果。它初听起来可能有些困惑，但它的语法很容易理解。你只需要将子查询写在括号中，并在需要的地方实现它。\n\
  \n\n\n\n其应用的一个简单示例是使用它来返回多个数据项，并在父级查询的 `from` 语句中将其作为表格进行处理。此外，你还可以写一个产生单个值的标量子查询，然后在语句中实现它，并借助各种语句（如\
  \ `where`）来过滤行。\n\n这两种情况是我们最频繁使用子查询的地方。考虑到这一点，让我们来看在 `update` 表中使用子查询的示例。我们将根据更新信息和设置的条件确定要更新的行，生成多个子查询。这些子查询将搜索与两个表的列相对应的值。以下是\
  \ SQL 代码：\n\n```sql\nupdate table_1\nset mycolumn = (select mycolumn\nfrom table_2\
  \ \nwhere table_1.mycolumn = table_2.mycolumn)\nwhere exists (select mycolumn\n\
  from table_2\nwhere table_1.mycolumn = table_2.mycolumn);\n```\n\n在这个示例中，我们有一个包含两个子查询的查询。两者的语法是相同的。首先，我们在括号内编写\
  \ `select` 语句。这是我们的第一个子查询，它被设置在 `set` 子句中。这生成了更新所需的数值。然后，我们将另一个子查询设置在 `where exists`\
  \ 子句中。`select` 语句再次被用于过滤需要更新的数据项。\n\n顺带一提，这两个子查询被称为**相关子查询**。这意味着它们依赖于父级查询中的某个组件（例如表名）。在我们的示例中，子查询依赖于\
  \ `table_1`，而该表是主更新操作的一部分。请记住，**不相关子查询**对父级查询中的元素没有引用。\n\n### 使用子查询进行过滤\n\n你已经习惯了使用\
  \ `where` 操作来过滤查询结果。如果你不记得了，你曾将它与诸如类似 `where salary > 2000` 的条件一起使用。然而，在这种情况下，你已经知道创建条件时所需的值了。你通常不会那么幸运地拥有这些信息，那么在这种情况下你能做什么呢？子查询就是你的答案。你可以使用子查询来生成多个值，并在你的\
  \ `where` 语句中使用这些值。\n\n假设你想确定欧洲哪些城市的人口占了前 10%。换句话说，你想找到第 90 百位数。通常情况下，你可能会想写两个查询来计算第\
  \ 90 百位数并按城市进行过滤。然而，通过子查询的帮助，你可以实现这一切。代码示如下所示：\n\n```sql\nselect loc_name, City_eu_abbreviation\n\
  from e_cities_2010\nwhere p0010001 >= (\nselect percentile_cont(.9) within group\
  \ (order by p0010001) from e_cities_2010)\norder by p0010001 desc;\n```\n\n查询本身是你已经熟悉的内容。然而，我们引入了\
  \ `where` 条件，用于过滤 `p0010001` 列，但它并不包含你预期的值。在大于等于运算符之后，我们有另一个查询，实现了我们之前讨论的 `percentile_cont`\
  \ 函数。该函数用于创建我们需要的值，即第 90 百位数。一旦生成，我们就可以在父级查询中使用它。\n\n请记住，子查询仅在编写 `select` 查询时才有用。你可以使用与编写\
  \ `where` 子句时相同的类型的查询，但将其放在语句内部。这样，你就可以从表中删除任何你想要的内容。这听起来可能是删除内容的一种稍微复杂的方法，但考虑到数据库中有五亿行数据，这是一项巨大的工程，系统查询所有这些数据将花费大量时间。然而，你可以通过复制表并只删除不必要的行或项目，将信息拆分为易于处理的块状。\n\
  \n### 使用子查询创建派生表\n\n返回某些数据的子查询允许你将其转换为表。这可以通过将子查询写入 `from` 语句中来实现。请记住，数据本身是行和列的集合，通过使用这些数据，我们创建了所谓的**派生表**（derived\
  \ table）。这种表与其他表不同，这意味着你可以与其他表进行连接或查询。问题是，你何时使用这种方法创建表呢？\n\n如果结果相似，说明你的信息分布均匀。然而，如果两个值之间存在显著差异，说明有离群值影响了数据。现在，假设你想了解欧洲城市的中位数和平均人口。寻找这些值是一个过程，而比较它们是另一个过程。这两个操作都可以通过在\
  \ `from` 语句中编写子查询同时完成。这些内容在代码中如下：\n\n```sql\nselect round(calcs.average, 0) as average,\
  \ calcs.median,\nround(calcs.average - calcs.median, 0) as median_average_diff from\
  \ (\nselect avg (p0010001) as average,\npercentile_cont(.5) within group (order\
  \ by p0010001) :: numeric (10, 1) as median from e_cities_2010\n) as calcs;\n```\n\
  \n在这个示例中，我们有一个自解释其意的子查询。我们应用 `percentile_cont` 和 `avg` 函数来计算人口的中位数和平均值。接下来，我们将子查询引用为父级查询的表。中位数和平均值随后在父级查询中返回，这近似了结果。运行查询后的最终结果应该像这样：`average\
  \ median media_average_diff 98233 25857.072376`。\n\n## 第 7 章：视图 (Views)\n\n视图是由行和列组成的虚拟表，这些行列被显式分离以服务于发送查询的结果。也可以认为是定义查询形式的表中数据的组合。它们保存在数据库中，以便在跟执行\
  \ `select` 语句后访问。它可以连接来自多个表的数据，从而产生更新且更易的视图。然而，为了让视图作为存储的数据集存在，它必须是它充当了保护层和安全功能，允许人们访问特定数据而不必暴露底层表。\n\
  \n要创建一个视图，我们可以从数据库中的一个或多个表中选择列。根据指定的条件，视图可以包含所有的行，也可以只包含其中几行。\n\n通过视图，你可以以你认为自然的方式来组织数据。你还可以通过向用户展示他们应该看到或更改的内容，控制数据的访问和更改方式。视图是汇总各种表数据以生成报告的正确方法。\n\
  \n### 创建视图\n\n在 SQL 中创建数据库视图，我们使用 `create view` 语句。我们可以从单个表、多个表或另一个视图创建视图。用户要创建视图，必须拥有相应的权限。`create\
  \ view` 语句的语法如下：\n\n```sql\ncreate view viewname as\nselect column_1, column_2…..\n\
  from table_name;\n```\n\n\n\n其中，`condition`；`view_name` 是要创建的视图名称。`table_name` 是用于创建视图的表名，而\
  \ `condition` 是在创建视图期间过滤表记录的条件。\n\n考虑具有以下数据的 `students’` 表：\n\n![Image00054.jpg](img/Image00054.jpeg)\n\
  \n下面的示例显示了如何从上表创建一个视图。该视图将仅包含学生的姓名和年龄：\n\n```sql\nCREATE VIEW students_view AS\n\
  SELECT name, age FROM students;\n```\n\n该语句应该执行成功，如下所示：\n\n![Image00055.jpg](img/Image00055.jpeg)\n\
  \n该视图被命名为 `students_view`，且仅包含表中的两列。视图只有两列，`name` 和 `age`。现在视图已经创建完成，你可以像查询表一样的方式查询它。以下命令显示了这一点：`SELECT\
  \ * FROM students_view;` 该命令返回以下结果：\n\n![Image00056.jpg](img/Image00056.jpeg)\n\n\
  正如我们所说的，视图包含了表中的两列。\n\n### 使用 check 选项\n\n我们可以将此选项与 `CREATE VIEW` 语句一起使用。`WITH CHECK\
  \ OPTION` 的目的是确保所有的插入和更新都符合视图定义中创建的所有条件。\n\n如果未满足条件，`INSERT` 或 `UPDATE` 操作将返回错误。在下面的示例中，我们展示了如何创建上述视图，但这次使用了\
  \ `WITH CHECK OPTION`：\n\n```sql\nCREATE VIEW students_view AS\nSELECT name, age\
  \ FROM students\nWHERE age > 18\n```\n\n使用 check 选项时；当你创建上述视图时，只有 `age` 大于 18 的记录会被添加到视图中。你可以通过运行以下命令删除之前的视图：`DROP\
  \ VIEW students_view;` 现在，运行上述命令重新创建视图。它应该会执行成功，如下所示：\n\n![Image00057.jpg](img/Image00057.jpeg)\n\
  \n现在，在视图上运行 `SELECT` 命令查看它包含的记录：\n\n`SELECT * FROM students_view;` 该命令将返回以下结果：\n\
  \n![Image00058.jpg](img/Image00058.jpeg)\n\n你可以看到，只有符合指定条件的记录才被添加到视图中。\n\n视图建立在单表或多表之上，也可以建立在现有的视图之上。视图也可以像创建一样删除。然而，在进行任何更新之前需要满足某些特定条件，它们是：\n\
  \n- 用于创建视图的 `SELECT` 语句不能包含 `GROUP BY` 子句或 `ORDER BY` 子句。\n- `SELECT` 语句不能包含 `DISTINCT`\
  \ 关键字。\n- 视图必须确保没有空值。\n- 视图不能使用嵌套或复杂的查询创建。\n- 视图必须从单表创建，因为任何使用多表创建的视图都不允许更新。\n-\
  \ `FROM` 子句不能有多个表。\n- 可以 `CREATE` 或 `REPLACE VIEW` 语句来从视图中添加或删除字段。\n- `SELECT` 子句不能包含汇总函数。\n\
  - `SELECT` 子句不能包含聚合函数。\n- `SELECT` 子句不能包含操作符。\n- `WHERE` 子句不能包含子查询。\n- 计算列不能被更新。\n\
  - 表中的所有非空列必须是视图的一部分，`INSERT` 查询才能工作。\n\n视图的一些优势包括：\n\n**限制修改**：通过这种方式，只有拥有表权限的人才能启动\
  \ `INSERT`、`UPDATE` 和 `DELETE` 等主要编辑。\n**节省数据库空间**：查询并不总是需要引用表，因为不存储实际数据。\n**额外的安全性**：由于选定的列和细节暴露给公众，因此表中的其他敏感细节具有更高的安全性。\n\
  \n### 如何添加视图\n\n视图通过以下 SQL 语句进行唯一标识和创建。\n\n```sql\nCREATE VIEW {parameters}\n```\n\
  \n在这里，我们将解释与此语句相关的不同参数。\n\n- **视图名称**：通过此参数，你可以为定义的视图选择一个名称。\n- **列名列表**：通过使用此参数，你可以为视图中的所有列命名。以列表形式给出名称，以便\
  \ DDL 语句能够识别格式。\n- **加密**：通过使用此参数，你为你正尝试创建的视图提供了额外的安全性。此参数增加了数据库系统的安全性。\n- **模式（Schema）**：通俗地介绍，模式是数据库中使用的一组规则，甚至视图也可以包含在模式定义中。然而，如果你尝试删除或更改受模式限制的视图内容，可能会遇到错误。所以，只有在确定时才进行绑定。\n\
  - **元数据**：此参数将帮助你为你所有的视图内容创建引用的元数据信息。所有列名和内容将被列出，并在必要时帮助你快速检查。\n\n通过这些，我们对视图有了良好的理解。在下一节中，我们将讨论视图的一些独特优势。请继续跟进！\n\
  \n### 视图的优势\n\n视图主要用于限制列和行值。视图具有访问表的一个或多个部分的选项。这使得视图相对于其他数据库概念具有了独特优势。\n\n视图还可以用于消除其他高级数据库操作，例如连接（joins）。无需创建复杂的连接操作，你只需要使用视图来实现结果。\n\
  \n你可以控制你正在处理的列的值范围。视图也是数据库安全的一个非常高级的层。\n\n如果你不熟悉 SQL 语句，可以使用 SQL 服务器管理系统来创建视图。你需要做的只是选择所需的表和列，并定义一个创建视图的语句。它很方便，但受其操作的限制。\n\
  \n### 如何创建可更新视图\n\n视图是特殊的数据库对象，通常可以使用 `ALTER` 语句进行更新。更改视图可能会导致系统中的若干中断。因此，建议将视图视为高级系统操作。在这里，我们将详细描述它。\n\
  \n更改视图的 SQL 语句：\n\n```sql\nALTER VIEW {parameters}\n```\n\n在这里，你甚至可以使用 `SELECT`\
  \ 语句选择你想要更改的列。所有高级选择操作都可以用于获取结果。\n\n### 如何删除视图\n\n删除视图由于其所习惯的复杂性是一个很难讨论的话题。如果你使用此\
  \ DDL 语句，所选视图将从系统中删除。技巧在于，所有包含你正尝试删除的视图的视图也将被删除。视图之间的不利链接非常难以处理。\n\n这里是 SQL 语句：\n\
  \n```sql\nDROP VIEW {view_name}\n```\n\n注意：\n\n\n\n假设，如果用于创建视图的表被删除，它们不会导致视图被删除。视图是可以在不涉及任何原始数据的情况下存在的主实体。\n\
  \n### 在 sql studio 中修改视图\n\n你可以轻松地使用管理器来修改视图，其操作步骤如下：\n\n在“microsoft sql server\
  \ management studio”窗口中，展开相应的服务器，双击“database”（数据库）节点，选择相应的数据库，点击“view”（视图）图标，在右侧详细面板中选择要修改的视图，在右侧点击右键，并在弹出的快捷菜单中选择`design”（设计）命令。\n\
  \n在打开的视图设计器窗口（与之前出现的窗口类似），用户可以根据创建视图的方法修改视图的定义。\n\n修改完成后，点击`save”（保存）图标将修改保存到视图中。\n\
  \n然而，在处理大量修改时，这个过程会非常费力且可能很繁琐。在下一节中，我们将讨论如何使用 `alter` 语句来修改视图。\n\n### 使用 dml 语句操作视图\n\
  \nsql 中的 `alter view` 语句可以修改视图。`alter view` 语句的语法与 `create view` 语句仅差一个 `alter`\
  \ 单词。\n\n以下是语法：\n\n```\nalter view {view name,} {enter parameters}\n```\n\n这表明 `alter\
  \ view` 语句与 `create view` 语句非常相似。如果原始视图定义是使用 `check option` 创建的，那么只有当这些选项也包含在 `alter\
  \ view` 中时，才能对其进行修改。\n\n**注意：** `alter view` 语句不支持对当前视图添加、删除或更改一个或多个单个列的类型。\n\n\
  `alter view` 语句似乎并没有为数据定义语言增加功能。`alter view` 语句没有提供更改视图定义的快捷方式。正如前面提到的，该语句在所有其他方面上都与\
  \ `create view` 语句相同（除了名称外，用 `alter` 代替了 `create`）。\n\n因此，在修改视图时，你也可以使用 `drop view`\
  \ 语句删除现有视图，然后使用新结构执行 `create view` 语句来重建视图。\n\n然而，使用 `alter view` 语句并不比顺序执行 `drop\
  \ view`/`create view` 语句有优势。当通过 `drop view` 语句删除视图时，数据库管理系统会自动删除在视图上创建的任何触发器。\n\n\
  当重建视图时，系统既不会恢复视图上的触发器，也不会向具有原始视图权限的用户名（或角色）授予任何访问权限。\n\n同样，如果你通过执行 `drop view` 语句修改视图，然后执行\
  \ `create view` 语句重建视图，你还必须重新输入原始视图上所有触发器的代码，并允许使用原始视图的用户角色和账户授予视图的访问权限。\n\n相反，如果执行\
  \ `alter view` 语句对视图定义进行相同的修改，则不需要执行 `drop view` 语句，原始视图上授予的触发器和权限将保留在视图上。\n\n###\
  \ 通过视图添加数据\n\n除了通过视图显示数据外，你还可以使用 `insert` 语句通过基表向视图添加数据。在使用 `insert` 语句向视图添加数据时，必须满足以下规则：\n\
  \n当使用 `insert` 语句向数据表插入数据时，用户必须具有插入数据的权限。由于视图仅引用表中的某些字段，因此在通过视图插入数据时，只能显式指定视图中所引用字段的值。视图不能包含多个字段值的组合，也不能包含使用统计函数的结果。视图不能包含\
  \ `distinct` 或 `group by` 子句。\n\n如果视图使用了 `with check`，该子句将检查插入的数据是否符合视图定义中 `select`\
  \ 语句设置的条件。如果插入的数据不符合此条件，sql server 将拒绝插入数据。你不能在一个语句中对多个底层表使用数据修改语句。因此，如果你想向引用了数据表的视图添加数据，必须使用多个\
  \ `insert` 语句来添加。以下是语法：\n\n```\ninsert {name of the view} {data values}\n```\n\n\
  ### 通过视图简化复杂查询\n\n在 sql 中编写多表连接（join）是很常见的，因为几乎所有查询都包含从两个或多个表中提取和关联数据。因此，创建和使用连接视图比重复输入相同的复杂查询要容易得多。\n\
  \n此外，许多不熟悉 sql 没有时间深入学习 sql 的管理员只知道如何编写简单的单表查询。\n\n通过视图组合来自多个表的数据，管理员将获得一个包含来自多个表数据的单表。他们可以使用单表\
  \ `select` 语句从数据库中获取所需数据，从而极地简化了复杂 sql 语句的使用。\n\n### 加密视图\n\n视图创建后，系统将此视图的定义存储在系统表中。你可以通过执行系统存储过程\
  \ `sp_helptext` 或直接打开系统表来查看视图的定义文本。\n\nSql server 提供了一个 `encryption` 子句来保护视图的定义，它可以防止其他用户查看视图的代码，或在发布\
  \ sql 时隐藏源代码。\n\n以下是语法：\n\n```\ncreate view {enter encryption here,}\n```\n\n###\
  \ 通过视图限制用户对列的访问\n\n视图是虚拟表，可以用于几乎任何允许引用表的地方。然而，视图不是存储在硬盘上的物理表，不像数据库中的其他表和索引。视图由 `select`\
  \ 语句组成，从一个或多个基表（或其他视图）的行和列中提取数据。\n\n\n\n身份验证是一个数据库验证用户凭据并呈现实例数据的过程。身份验证是一个复杂的过程，随着时间的推移，其技术性也在不断提高。身份验证通常使用被称为密码的秘密代码进行。一些高级数据库系统会要求你提供磁卡或指纹进行身份验证。\n\
  \n### 授权\n\n在身份验证之后，检查资源并提供你被授权的实例。如果你处理大量的管理员，授权是至关重要的。有时，你可能出于任何原因想要撤销特定用户的访问权限，授权撤销可以无故障地实现这一点。\n\
  \n### 追踪\n\n高级行业通常使用跟踪系统来监控员工。任何带有恶意意图的员工都可以通过此功能被发现，因为跟踪系统会记录执行的每一条 sql 查询语句。所有语句都记录在案，高级权限用户可以轻松查看。\n\
  \n### SQL 的安全模型\n\nSQL 的安全模型非常基础，涉及下文解释三个主要特征。\n\n### 主体 (Principals)\n\n主体是拥有数据库中特定资源的用户实体。例如，`user\
  \ a` 拥有数据库主体权限，而 `user b` 没有数据库权限。SQL 通过创建微软组使这一安全功能变得简单。管理员很容易使用组来授予权限。\n\n###\
  \ 可保护实体 (Securables)\n\n即使在许可组之后，SQL 安全也可以帮助限制谁可以访问什么。例如，组织的编程人员无法访问后端服务器信息，而安全分析师可以查看后端和前端服务器。所有可保护实体都可以使用架构（schema）定义。架构中的任何冲突都会导致程序错误，从而导致数据丢失。\n\
  \n### 权限 (Permissions)\n\n权限是对每个存在的文件、组和文件的单独权限。这是 Linux 为每个现有用户提供的高级安全功能。使用此功能可以递归地产生良好的安全标准。\n\
  \n### 创建和删除角色\n\n为了方便数据库管理，SQL Server 引入了“角色”（role）的概念，它是某些权限的聚合。角色现已用于许多管理系统中，可以认为是\
  \ SQL Server 分配权限的基础。角色与组类似。只要管理员将权限分配给角色，用户通过继承特定角色即可实现分配权限的目的。使用角色不仅可以快速划分权限，还可以方便地更改权限。这不仅增加了数据库的安全性，还方便了数据库管理员的工作。\n\
  \n### 角色的划分\n\nSQL Server 中的角色分为以下两类，即：\n\n*   服务器级角色。\n*   数据库级角色。\n\n虽然它们都被称为角色，但这两个角色所代表的含义是不同的。以下是这两个角色分别代表的含义的详细说明。\n\
  \n### 服务器级角色和权限\n\n服务器级角色也可以称为“固定服务器角色”。主要原因是服务器级角色是无法更改的（包括不能添加）。在 SQL Server 中，已经定义了总共\
  \ 9 个角色。你可以在 SQL Server 管理工具的对象资源中查看它。\n\n### 数据库级角色\n\n数据库级角色分为两个部分：一个是数据库中定义的“固定数据库”，另一个是自创建的“自定义数据库”。在特定数据库中总共可以查看\
  \ 10 个角色。\n\n### 如何创建角色\n\n这里的“创建”是指创建数据库。数据库中定义的角色可能无法满足实际工作的需求。此时，数据库管理员必须创建符合实际业务需求的角色。\n\
  \n以下是创建角色的步骤方法：\n\n1. 打开 SQL Server 管理工具并查找你将要使用的实例。\n2. 在对象资源管理器中进入你需要工作的数据库。\n\
  3. 右键点击 `security` 节点以打开功能列表项。\n4. 在弹出的功能列表中，输入 [new] 并选择 [database role] 列表功能。选择角色后，将弹出创建新数据库角色的对话框。\n\
  5. 填写创建角色所需的详细信息，如名称和其他细节，并点击完成以完成数据库操作。\n\n一旦创建了数据库角色，它就可以永久存储在 SQL Server 中。当实际业务需要时，可以随时将现有的角色分配给特定用户。向数据库用户分配角色可以在创建用户或角色时完成，也可以在已创建的用户上进行修改。这些特殊功能被称为权限（privileges），我们将在接下来进行讨论。请继续阅读！\n\
  \n### 授予和撤销权限\n\n角色可以看作权限的组合。当用户拥有某个角色时，他会继承该角色所拥有的权限集。此外，SQL Server 允许开发者使用 `dcl`（数据控制语言）来控制权限。你可以使用某些语句授予和撤销权限。这里我们将简要讨论它们以便你更好地理解。\n\
  \n### 授予 (Grant)\n\n通过此语句，你可以向某些用户授予所有角色。如果未给予此权限，将很难按照你的预期操作。\n\n以下是 SQL 语句：\n\n\
  `Grant {parameters} user {usernames}`\n\n### 撤销 (Revoke)\n\n通过此语句，你可以停止之前授予用户的权限或特殊权限。通过此语句，你可以轻松切断用户访问，以维护系统的安全性。\n\
  \n\n\n触发器，`r_action_time`，`trigger`，`r_e`，`vent`,\n\n表，`_name`,\n\n[`re`,`fe`,`re`,`ncing\
  \ old_or_ne`,`w_value`,`alias_list`]\n\n`Trigger`,`re`,`d_action`\n\n`Trigger`,`r_name`\
  \ - 触发器的唯一标识名称，`trigger_r_action_time_r_e_vent` - 触发动作组发生的指定时间或持续时间（在触发事件发生之前或之后）。\n\
  \n`_name` – 指定了 DML 语句的触发动作的数据库表 – 表示在事件触发后要执行的操作。\n\n### 删除触发器\n\n删除或销毁触发器的基本语法与删除表相同：\n\
  \n```\nDrop trigger trigger_name;\n```\n\n## 第 9 章：数据类型\n\n### SQL Server 和数据库数据类型\n\
  \n为了在某些列中存储数据，SQL Server 及其其他关系型数据库管理系统使用了所谓的“数据类型”。根据你计划存储的数据类型，有不同的数据类型可用。\n\n\
  例如，你可能正在存储货币值、产品编号和产品描述。应该使用特定的数据类型来存储这些信息。\n\n每个 RDBMS 之间的大多数数据类型基本相同，尽管它们的名称略有不同（例如\
  \ SQL Server 和 MySQL 之间）。数据类型有很多，但某些比其他用得更频繁。以下是你可能会遇到或使用的的常用数据类型列表。\n\n将使用 `adventure2012`\
  \ 数据库作为示例。\n\n### Varchar\n\n这是一个字母数字类型，非常适合存储如姓、名以及电子邮件地址之类的字符串。你可以在创建表时指定 `varchar`\
  \ 数据类型的长度，例如 `varchar(n)`。`n` 的值可以是从 1 到 8,000 之间的任何数字，或者你可以用 `max` 代替，它的值是 2 的\
  \ 31 次方减 1。然而，这种长度很少使用。\n\n在设计表时，请估算最长字符串的长度加上几个字节以确保万全。如果你知道要存储的字符串大约是 30 个字符，为了安全起见，你可能想指定\
  \ `varchar(40)`。\n\n这种数据类型在某种意义上是灵活的，因为它只会适应输入到它的字符，即使你没有像上面的示例那样插入 40 个字符。\n\n\
  但是，存储上会有一点开销，因为它会为整个字符串增加 2 个字节。例如，如果你的字符串长度为 10 字节/字符，那么实际上它将是 12 字节。\n\n### Nvarchar\n\
  \n与 `varchar` 数据类型类似，它也是字母数字的。然而它还存储国际字符。因此，如果你使用的是另一个国家语言的字符和字母，这是一个很好的选择。\n\n\
  `varchar` 和 `nvarchar` 之间的另一个区别是 `nvarchar` 的值最大到 4,000，而不是 `varchar` 的 8,000。尽管它们在长度定义上是相同的，例如：`nvarchar(n)`\
  \ 其中 `n` 是字符长度。\n\n### 精确数值 (Exact numerics)\n\n可以使用各种数字数据类型来表示数据库中的数字。这些被称为精确数字。在创建数据库\
  \ ID（例如员工 ID）时，通常使用这些类型。\n\n- `bigint` – 值范围从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807，这种类型并不频繁使用。\n\
  - `int` – 最常用的数据类型，其值范围从 -2,147,483,648 到 2,147,483,647。\n- `smallint` – 值范围从 -32,768\
  \ 到 32,767。\n- `tinyint` – 值范围从 0 到 255。\n\n在任何情况下，最好选择所有最小的数据类型，这样就可以节省数据库空间。\n\
  \n### 小数 (Decimal)\n\n与精确数值数据类型类似，它存储数字；但这些是包含小数的数字。在处理如货币等特定数字时，这是一个极佳的选择。`decimal`\
  \ 值最多只能存储 38 位数字，包括小数点。假设你想向数据库中输入 $1000.50，首先你将此值更改为 1000.50，而不是尝试加上美元符号。按数据类型定义此值的正确方法是使用\
  \ `decimal(6,2)`。\n\n### 浮点数 (Float)\n\n然而，这更是一种近似数值，意味着它不应该用于那些你不预期是精确的值。一个例子是它们用于科学方程和应用程序。使用此数据类型的列中可以容纳数字的最大长度为\
  \ 128。虽然它使用科学计数法且其范围从 -1.79e+308 到 1.79e+308，但“e”代表指数值。在这种情况下，它的最低值是 -1.79e-308。它的最大值是\
  \ 1.79e+308（注意现在它在正值范围内）。在创建表时指定 `float` 数据类型，你只需指定列名并使用 `float` 即可。不需要指定长度。\n\n\
  ### 日期 (Date)\n\nSQL Server 中的 `date` 类型经常用于日期。它的格式为 `yyyy-mm-dd`。这种数据类型只显示月、日、年，如果你只需要这些时间的信息，它是很有用的。`date`\
  \ 类型的值范围从 ‘0001-01-01’ 到 ‘9999-12-31’。所以你有大量的范围可以处理！在使用 `date` 类型创建表时，不需要指定任何参数。只需输入\
  \ `date` 即可。\n\n### 日期时间 (Date_time)\n\n这与 `date` 类型类似，但深度更高因为它包含了时间。时间是以秒为单位的；具体来说，它的精度是\
  \ 0.00333 秒。它的格式如下 `yyyy-mm-dd hh:mi:ss`。此数据类型的值范围从 ‘1000-01-01 00:00:00’ 到 ‘9999-12-31\
  \ 23:59:59’。与 `date` 数据类型一样，创建表时不需要指定值或长度。只需输入 `date_time` 即可。确定是否需要或希望包含时间。如果是，使用\
  \ `date_time` 数据类型，如果不是，使用 `date` 数据类型。\n\n### 位 (Bit)\n\n这是一个可以是 0、1 或空值的整数值。它是一种相对较小的数据类型，因此不占用多少空间（8\
  \ 位列 = 1 字节）。整数值 1 代表真，0 代表假，如果你列中只有真/假值，这是一个非常好的选择。\n\n## 第 10 章：9 个常见错误以及如何避免它们\n\
  \n数据重复\n\n\n\n\n\n在不同的表格中重复同一组数据被称为数据冗余。确保每个表都包含不同类型的数据集并避免重复是非常重要的。为了确保你不会在不同的表中重复相同的数据，遵守规范化规则是至关重要的。如果你重复了，就会导致混淆。例如，你可能有一张包含客户手机号的表格。由于手机号属于客户，它可以快速识别他们。创建一个订单表并再次添加客户的手机号是错误的。为了避免这种错误，务必将你的数据存储在单一位置，并在处理数据时应用主键和外键之间存在的关系。\n\
  \n### 避免使用过多的游标（cursors）\n在执行 SQL 时使用过多的游标会很困扰。在执行 SQL 存储过程中，务必停止应用过多的循环。虽然循环是编程中的常见特性，但在\
  \ SQL 中它们并不有效。与其使用循环，不如应用高效展示的 SQL 语句。如果偶尔需要使用游标，重要的是要将其降至最低。\n\n### 使用 and 和 or\
  \ 操作\n在编写查询时，你可能没有遵循逻辑顺序。应用 `and` 和 `or` 语句的方式可能会改变你的信息。务必使用正确的括号结构或按照正确的确定顺序安排你的语句。\n\
  \n### 拼写错误\nSQL 是一种机器语言，如果你拼写错了单词，它可能会非常严厉。例如，你没有输入 `select` 而是写成了 `selct`。你需要通过确保使用大写字母正确输入单词来避免这种错误。你还需要创建边界，将你的主词与其他单词以及表列隔离开。\n\
  \n### 缺少括号和单引号\n这些语法结构在 SQL 编程中被多次使用。它们是成对出现的。许多人犯的错误是他们忘记使用这些结构，或者没有正确应用它们。例如，你可能使用了左大括号\
  \ `{` 但忘记了右大括号 `}`。SQL 还要求将文本数字括在单引号中。如果没有引号，SQL 可能无法理解你的文本从哪里开始，哪里结束。为了停止这些错误，务必记住括号和引号是成对的，并在处理它们时始终遵守这一规则。\n\
  \n### 逗号和分号\n这些标点符号在 SQL 中有不同的用途。逗号用于分隔列表，而分号用于标记表达式的结束。为了避免这些错误，请确保在前面放置逗号。分号是可选的，可以使用也可以不使用。\n\
  \n### 不注意语法（syntax）\n语法是指单词组合在一起形成短语和句子的方式。如果你没有良好安排单词，就无法做出合理的陈述。同样，如果你没有应用正确的语法，你的数据库可能无法理解你在说什么。这可能会导致性能低下。\n\
  \n 假设你的客户理解他们需要什么\n当客户给给你打电话时，不要假设他们完全理解自己的数据库问题。务必让他们知道你是该领域的专业人士，你将协助他们发现并修复问题。\n\
  \n### 避免反馈\n尽管你倾向于多听取给你提供工作的经理的话，但听取程序用户的意见也同样重要。因此，在听取经理意见的同时，听取像职员这样的程序用户的意见也很重要。\n\
  \n## 结论\n下一步是开始学习在 SQL 帮助下完成的一些不同部分。许多大型公司都会与某种数据库打道。无论你是用它来存储以后用于做出重大决策的数据、存储有关客户的信息，还是存储你售卖的产品，你很快就会发现处理数据库有许多理由。由于许多数据库可能非常大，并且包含许多组合在一起的部分，很难想象我们能够通过手动查找来找到所需的一切。这有时会让操作变得很困难，我们会发现\
  \ SQL 语言将通过一些简单的命令来帮助我们，即使是那些任何编程经验的人也能调出他们想要的不同部分。公司有很多时候需要与数据库协作以获得他们想要的结果，以保留向客户展示的正确信息，当我们将这些数据库与\
  \ SQL 语言相结合时，你会发现处理和管理你正在工作的数据库要容易得多。当你准备好学习更多关于 SQL 语言以及它将如何帮助你所有的数据库需求时，请确保查看本指南以帮助你入门。SQL\
  \ 就像一种对业务至关重要的新兴技能。就像基础读写对于任何工作都很一样，精通 SQL 技能对于任何想要在商业领域成功的人来说变得越来越重要。最后，你到达了旅程的终点，准备好开始新的旅程了！你已经掌握了\
  \ SQL 背后的基本概念并并如何将其应用。你学习了一系列新技能，你可以将其应用于业务信息技术或工程等多个领域。\n\n许多企业将希望根据自己的需求创建、修改和处理这些数据库之一。它允许他们跟踪客户，以确保他们的订单以正确的方式提交，以展示他们想要销售的产品等。与数据库工作有很多理由，但很快就会发现它们可能会变得很大，你需要一些方法在过程中帮助保持该数据库的规范管理。本指南旨在帮助你完成这一切，以及更多。我们查看了许多命令、代码和其他所需的部分，以确保你的数据库以你想要的方式运行。即使你过去无法在数据库上做很多工作，你也会发现，通过在本指南中处理的许多技巧、策略和代码，你能够在数据库上完成你想完成的工作。你对该信息的管理能力将突飞猛进。\n\
  \n我们希望这本书帮助你学习 SQL 编程语言的道路。\n\n\n\n\n\n# 第 4 册：初学者 C++\n\n一份将你的热情转化为编程熟练能力的全面指南\n\
  \nVera Poe\n\n## 引言\n\n欢迎来到奇妙的编程世界，本书章节将使你对 C++ 编程有一个基础的理解。到最后一个章节时，你将能够使用 C++ 独立地创建一个完整的程序。\n\
  \n本指南面向 C++ 的初学者。然而，如果你对编程完全一窍不通，我建议先阅读我们的《编程入门书籍》。它涵盖了完全初学者需要了解的所有概念、术语、编程范式和编码技术。\n\
  \n本指南将花费一些时间来介绍使用 C++ 语言可以做的一切事情，以及学习这种语言有多大益处。\n\n这门使用 C 语言的面向对象编程课程为学习者提供了有效设计、开发和实现健壮程序模型所需的概念和技术。作为一名学习者，你将掌握如何应用面向对象分析和设计的基本概念并在日常活动中解决各种问题的实用知识。\n\
  \nC++ 是一种计算机编程语言，广泛用于通用编程。它是 C 语言的扩展。可以通过 C 语言获得对 C++ 的基础理解。这就是为什么这两种计算机语言都被表示为\
  \ c/c++。Bjarne Stroustrup 在 1979 年开发了这种多范式语言。\n\n在当今世界，许多操作系统使用 C++ 作为它们的基础语言。某些系统驱动程序、浏览器和游戏是基于\
  \ C++ 程序的。它是一种自由编译且静态类型的编程语言。许多专业人士认为 C++ 是实现所需结果最高效的语言。\n\n学习代码是未来的语言……我们都在生命中的某个时间点听过类似的话。\n\
  \n当你读到最后时，阅读 C++ 代码应该没有问题，并且能够编写出既有趣又有用的程序。那么，让我们深入浅学习 C++ 吧。\n\n## 第 1 章：C++ 的剖析\n\
  \n### 编程语言简介\n\n正如你所知，程序无非是一组指令。这些指令由硬件（即物理计算机机器）执行。尽管现代计算机非常快，但它们也有自己的局限性。计算机只能理解以其原生语言给出的一组指令。为此，你应该理解机器语言、汇编语言和高级语言的概念。\n\
  \n### 机器语言\n\n虽然计算机是非常先进的机器，但它们无法直接理解像 C++ 这样的语言。计算机只理解 0 和 1。它们被称为位（bits）。它们只能理解以二进制格式给出的指令。我们给计算机的每组指令都会被翻译成一组告诉处理器执行特定任务的指令。你应该理解不同类型的处理器具有不同类型的指令集。例如，奔腾（Pentium）处理器只会理解它们的指令集。麦金（Macintosh）也是如此。在最开始，程序员必须用二进制语言编写他们的指令。这非常耗时且具有挑战性。幸运的是，我们不需要经历这一切。\n\
  \n### 汇编语言\n\n由于机器语言难以处理，一种被称为“汇编语言”的新语言被发明了。在这里，每条指令都被赋予一个短名称，变量被用名称而不是二进制数字来替换，这使得程序员编写代码变得容易。你可能会问如何理解汇编语言，计算机无法理解。汇编语言将在汇编器（assembler）的帮助下转换为机器语言。你应该记住每个\
  \ CPU 都有自己的汇编语言，因此一个 CPU 的汇编语言不能在不同的 CPU 上运行。汇编也有它的缺点，即使是简单任务，它们也需要大量的指令集。\n\n###\
  \ 高级语言\n\n高级编程语言的出现是为了解决汇编语言和机器语言引起的问题。这些语言可以在任何计算机上运行。高级语言带有一个名为编译器（compiler）的程序。编译器的作用是生成一个\
  \ CPU 可以直接理解的可执行文件或程序。这些程序是独立的程序。今天提供的现代编译器在将代码转换为可执行格式方面非常高效。某些编程语言使用解释器（interpreter）。解释器的工作是在不将代码编译为机器码的情况下执行代码，但这里我们不会学习解释器。任何给定的编程语言都可以被解释或编译。像\
  \ C++ 和帕斯卡（Pascal）这样的语言是被编译的，而像 JavaScript 和 Perl 这样的脚本语言是被解释的。\n\n问这个问题，你会得到几十个不同的答案，但简单来说，C++\
  \ 是一种编译型面向对象编程语言。如果你是编程新手，甚至这句话可能让你感到有些困惑，让我们来拆解一下。\n\n编程语言有两种类型——一种是解释型的，另一种是编译型的。解释型语言运行在解释器上——它读取代码并一次执行内部的命令。CPU\
  \ 在你的计算机上读取编译后的语言，而不是程序。计算机无法读取字母；它们只能读取数字，所以当你编写代码时，它必须先翻译成二进制。这被称为编译。\n\n解释中的面向对象部分描述了代码的结构方式，但我稍后会详细介绍那部分。\n\
  \n### 这对我意味着什么\n\n要成功学习 C++，你需要同时使用文本编辑器和编译器。如果你使用 Windows 电脑来执行此操作，你可以使用电脑上已经安装的记事本（notepad）作为你的文本编辑器，而作为将你的代码转换为可执行格式的编译器，你应该使用\
  \ gnu/c++。\n\n### Linux/unix\n\n检查你的 linux/unix 计算机是否安装了 gcc 的一种简单方法是打开命令行并输入：\n\
  \n```bash\ng++ -v\n```\n\n如果安装了 gcc，你将获得以下消息或非常类似的内容：\n\n```\nUsing builtin specs\n\
  Target: i386-redhat-linux\nConfigure with: ../configure, —prefix=/usr …….\nThread\
  \ model: posix\nGcc version 4.1.2 20080704 (red hat 4.1.2-46)\n```\n\n如果没有安装 gcc，你可以按照\
  \ [`gcc.gnu.org/install/`](http://gcc.gnu.org/install/) 上的说明操作。\n\n### Mac os x\n\
  \n为 mac os x 获取 gcc 的最佳方法是访问 [`developer.apple.com/technologies/tools`](http://developer.apple.com/technologies/tools)，下载\
  \ xcode 并按照安装说明操作。\n\n### Windows\n\n要在 windows 电脑上获取 gcc，你必须先从 [`www.mingw.org`](http://www.mingw.org)\
  \ 下载 mingw。确保你下载了最新版本的 mingw，还需要安装 gcc-core、binutils、gcc-g++ 和 mingw runtime——这些是最低要求。\n\
  \n\n\n\n你还可以考虑的另一点是 IDE —— 集成开发环境。这种文本编辑器具有集成的编译器和语法高亮功能。最好的工具是代码块。\n\n还有什么是我应该知道的吗？\n\
  \n是的。C++ 的语法非常严谨，并且所有内容对大小写敏感，所以请小心你输入的内容。在 C++ 中，单词“hello”和“Hello”的含义是不相同的，但你将在书中后面的部分学到更多内容。现在，让我们直接开始编程。\n\
  \n在进入过多的细节之前，让我们先开始编写简单的代码。这是一个所有类型计算机编程教程的典型示例，所以，废话不多说，让我们来拆解它。首先，代码编写如下：\n\n\
  ![Image00059.jpg](img/Image00059.jpeg)\n\n第 1 行是在告诉你的计算机，你想将 `iostream` 库链接到你的程序中。库是一个存储小段代码的地方，有时也会包含变量和运算符。`iostream`\
  \ 库中的代码允许我们将字符移动到文本流中，然后显示在屏幕上。\n\n第 2 行告诉计算机，我们想使用标准的 `namespace`（命名空间）——这是你代码存储的地方，如果你编写了两段名称相同的代码，这非常有用。第\
  \ 4 行是代码的开始。大括号内部所有的内容都是编译器读取并翻译的内容——这一行必须出现在你编写的每一个程序中；否则，什么都不会发生。\n\n下一个阶段是程序的输出，在例例中输出的是“hello,\
  \ world!”。在这里我们使用了一些存储在 `iostream` 中的代码——一段名为 `cout` 的代码。代码后面的 `<<` 是一个运算符，它被翻译为“输出”，意味着我们正在告诉计算机将代码发送到指定的流。打印“hello,\
  \ world!”被称为字符串（string），它无非是封装在双引号中的字符序列。请注意，该行以分号结尾——这在告诉计算机代码已结束，如果没有使用分号，程序将无法编译。\n\
  \n第 8 行始终放置在 `main` 函数的末尾，用于通知计算机该块已完成。\n\n现在你已经有了程序的源代码，它必须使用你的编译器进行编译。更多细节将在稍后介绍，首先我想开始介绍构成你代码的要素。下一章将详细介绍你成为一名成功的\
  \ C++ 程序员所需要学习的所有内容。\n\n### C++ 程序的结构\n\n正如我们已经讨论过的，计算机程序无非是一系列告诉 CPU 该做什么的顺序化指令。\n\
  \n### 语句和表达式 (Statements and expressions)\n\n在 C++ 中，语句（statement）是程序中最小且独立的单元。它也是编程语言中最常见的指令形式。在\
  \ C++ 中，语句是向编译器传达指令以执行特定任务的方式。我们使用 `;` 来结束一个语句。在 C++ 中有许多种语句，下面给出最常见的语句类型。\n\n```cppint\
  \ x;\nx = 5;\ncout << x;\n```\n\n我们将在后面的章节中讨论上述语句的功能。\n\n### 函数 (Functions)\n\n\
  函数无非是一系列按顺序执行的语句。有一个函数叫做 `main` 函数，它是每个 C++ 程序中都是必不可少的。当运行任何给定的 C++ 程序时，程序的执行从 `main`\
  \ 函数开始。函数有非常特定的任务要执行，并且只能执行那些任务。为了成为一名优秀的程序员，你需要知道如何高效地使用函数。在下一章中你将学习更多关于函数的知识。\n\
  \n#### 库与 C++ 标准 (Libraries and the C++ standard)\n\n库无非是经过编译的代码集合。它们可以在不同的程序中使用。如果你希望扩展程序的功能，可以添加库。核心\
  \ C++ 语言是极简且直直观的，但它也带有一个名为 C++ 标准库的内置库，为用户提供了额外的功能。\n\n#### 语法和语法错误 (Syntax and\
  \ syntax errors)\n\n我们都知道在任何语言中，句子的都是按照该特定语言的规则构建的。以英语为例，我们通常用句号结束句子。支配语言句子句子规则被称为语法（syntax）。同样，C++\
  \ 也有语法。不遵守语法将导致你的代码无效。确保遵循 C++ 语言的基本语法是编译器的责任。如果你违反了基本语法，编译器将编译代码并对语法违规进行报错。该问题被称为语法错误（syntax\
  \ error）。C++ 编译器只有在没有发现错误时才会编译程序。它会显示所有发现的错误，并建议你使其有效，以便它能够在无任何错误的情况下执行代码。\n\n###\
  \ 编译你的第一个程序\n\n在编写你的第一个程序之前，有两重要的点是你需要知道的。程序将写在 `.cpp` 文件中并添加到你的项目中。项目也被称为工作区（workspaces）或解决方案（solutions）。代码文件和\
  \ IDE 设置将保存在你的项目中。你应该通过创建一个新项目来开始，因为有很多种项目。在开始之前，你需要指定你想要工作的项目类型。\n\n#### 什么构成了\
  \ C++ 代码？\n\n变量（variable）是存储值的东西。它就像一个盒子，每个盒子上都有名称和类别，类别是存储在其中的物品的类型——名称是特定的变量。每个变量都有特定的类型、名称和大小，这些精确决定了里面可以存储什么内容。\n\
  \n第 7 行被称为赋值（assignment）。这为变量分配了一个值，而 `=` 是运算符——它执行了赋值操作。`=` 之后的值被称为二元运算符（binary\
  \ operator）。\n\n请注意，这次 `cout` 语句周围没有引号。这是因为我们不是在显示字符串，而是在输出值。现在编译该程序将在屏幕上打印“42”。\n\
  \n除了具有类型之外，变量还可以在声明时添加一个前缀（prefix），这些前缀会改变变量的行为。有些会改变变量的大小，而另一些允许你使用或阻止你使用负数，而另一些则执行完全不同的工作。几乎所有的这些都会在这里被提到。\n\
  \n### 大小变化 (Size changes)\n\n两个特定的前缀会改变变量的字节大小——`short` 和 `long`。其后的原理是允许变量存储更多值和更大的数字。大小取决于你使用的计算机架构：\n\
  \n- 在 32 位计算机上，`int` 和 `long int` 都是 4 字节\n- 在 64 位计算机上，`int` 是 4 字节，`long int`\
  \ 是 8 字节\n- 在两种架构上，`short int` 都是 2 字节\n\n没有任何规定那些特定关键字修符的大小，除了：\n\n- `short` 必须小于或等于普通变量\n\
  - 普通变量反过来必须小于或等于 `long`\n\n只有 `int` 变量可以带有前缀。\n\n\n\n\n甚至更让人困惑的是，你可以省略 `int` 直接使用\
  \ `long` 或 `short`，例如：\n\n```cpp\nShort int s = 0;\nInt i = 0;\nLong int l = 0;\n\
  Short s2 = 0;\nLong l2 = 0;\n```\n\n### 符号变化\n\n另外两个前缀可以限制类型存储的值——有符号（signed）和无符号（unsigned）。`signed`\
  \ 变量可以存储负值和正值，而 `unsigned` 变量只能取正值。\n\n### 其他前缀\n\n在 `c++` 中还有一些其他前缀，它们并不常见，我们大多数我们不会使用，书中也不会涵盖。不过有两个非常有用的前缀——`const`\
  \ 和 `static`。前者是常量，值永远不会改变；后者保持变量的值不变，但仅在函数调用之间有效；这是一个稍后讨论的话题。\n\n### 语言的核心：理解 C++\n\
  \n今天我们周围几乎的一切都由计算机运行；在计算机或你喜爱的手机品牌的核心是程序。在我们的学习过程中，我假设你已经知道什么是计算机程序及其背后的结构。所有程序的核心都是编译语言。这个问题随之而来：`c++`\
  \ 到底是什么？\n\n`C++`（读作加加）其核心是一种通用的编程语言。该语言与众不同之处在于，它在提供低级内存管理的同时，还整合了关键的面向对象和泛型编程。\n\
  \n该语言及其设计偏向系统编程，例如嵌入式系统和操作系统内核（仅列举此类）。\n\n由于其高性能、灵活性高效率，该语言是许多程序员的青睐。该语言在许多场景中都有有效用途，例如服务器（如网络搜索\
  \ SQL 和电子商务）、桌面应用程序、对性能要求极高的应用程序（如太空探测器和电话交换机），以及最重要的是娱乐软件，而你喜欢的视频游戏就属于此类。\n\n该语言被称为编译语言，其实现版本适用于全球的许多平台，并被如\
  \ `intel`、`fsf`、`microsoft` 和 `llvm` 等许多跨国公司使用（仅列举几例）。\n\n如果你搜索 `iso`（国际标准组织），你会学到\
  \ `c++` 是标准化的。`iso` 在 2011 年 9 月批准并发布了 `c++` 的当前版本，编号为 `iso/iec 14882:2011`，通称为\
  \ `c++11`。`c++` 首次于 1998 年标准化，版本为 `iso/iec 14882:1198`，命名为 `c++03`，随后在 2003 年再次标准化为\
  \ `iso/iec 14882:2003`。尽管上述信息有用，但对你来说并不。\n\n更重要的是当前的标准 `c++11`，由于整合了新功能和更大的标准库，它取代了所有其他版本。\n\
  \n与计算机相关的一切，事实上，世界上其他的一切都有其起源。`c++` 是 `bjarne stroustrup` 早在 1979 年在 `bell labs`\
  \ 的结晶。每一项伟大的发明都有原因或目的。`bjarne` 想要一种比 `c` 更灵活、高效的语言，同时也一种提供更高级程序组织功能的语言。\n\n这里有一个关键点；记得我说过学习\
  \ `c++` 会为你以后学习其他语言做准备吗？这就是原因。`c++` 影响了许多语言，包括 `java`、`c#` 以及 1998 年之后开发的所有后续 `c`\
  \ 版本。\n\n在结束第一章之前，我也许应该提到 `c` 是 `c++` 的前身，因此使用 `c++` 将需要一些后者的知识。\n\n### 起始——第一次使用\
  \ `c++`\n\n虽然学习和掌握 `c++` 令人兴奋，但在我们开始编写代码之前有一些前提条件。在进行任何编程之前，你需要一个集成开发环境 (`ide`)。一个\
  \ `ide` 是将你的代码翻译成一堆 1 的编译器。\n\n### 准备 ide\n\n`ide` 构成了编程中非常核心的部分。如果你没有 `ide`，可以下载一些。如果你还没有\
